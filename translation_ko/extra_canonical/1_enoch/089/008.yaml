theological_decisions:
- issue: ‘빛이 생겼습니다’에서 창세기 표현을 의도적으로 완화할지 여부
  chosen_reading: 창세기 문구를 그대로 따라가지 않고 ‘빛이 생겼습니다’로 옮겼습니다.
  alternative_readings:
  - 빛이 있었습니다
  - 빛이 나타났습니다
  rationale: 이 구절은 창조/회복 이미지를 강하게 떠올리지만, 게으즈 본문 자체는 단순히 ‘되다’의 동사를 쓰므로, 익숙한 창세기 어조로 정형화하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 원문 우선과 상호본문성 보존
- issue: ‘어둠이 걷히고’의 인격화 여부
  chosen_reading: 어둠의 소멸을 ‘걷히다’로 표현했습니다.
  alternative_readings:
  - 어둠이 제거되고
  - 어둠이 사라지고
  rationale: ‘제거됨’의 수동성을 한국어 자연문으로 바꾸되, 사건의 우주적 전환을 약화시키지 않기 위해 관용적이면서도 격을 유지하는 표현을 택했습니다.
  doctrine_reference: 비전 서술의 상징성 보존
