theological_decisions:
- issue: 첫 번째 양의 상태를 죽음으로 명시할지 여부
  chosen_reading: ‘엎드릴 때까지’로 두어 죽음을 본문에 명시하지 않았습니다.
  alternative_readings:
  - 죽을 때까지
  - 쓰러질 때까지
  - 잠들 때까지
  rationale: 게즈 동사는 죽음의 완곡어법으로도 쓰이지만, 본문 자체가 그 결과를 명시하지 않으므로 상징의 긴장을 보존했습니다.
  doctrine_reference: 상징적 서술의 다의성을 보존하여 해석을 본문에 앞서 주입하지 않음
