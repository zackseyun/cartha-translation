  naturalness: ‘그 양이 … 그 양을 만났던 그 양’이라는 초안의 반복은 한국어에서 지나치게 무겁습니다. 관계절을 ‘그들을 인도하던 양을 만난 그 양’으로 정리하고, 능동 동사 ሰከበ에 맞추어 ‘눕는’으로 옮기는 것이 자연스럽습니다.
  terminology: 양·목장·물줄기는 환상 속 동물 이미지를 무리 없이 보존합니다. ህየንቴሆሙ는 여기서 앞선 ‘큰 양들’을 가리키는 ‘그들을 대신하여’로 번역하는 것이, 작은 양들이 그 자리를 잇는 대조 구조를 가장 잘 드러냅니다.
