  text: And I saw the sheep until they entered into a good place[a], and into a pleasant and glorious land; and I saw until the sheep were satisfied[c][b], and that house was in their midst in the pleasant land.
  footnotes:
  - marker: a
    text: '''House'' may refer to the sanctuary or temple within the vision''s symbolic imagery.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'land of delight' is repeated at the end of the verse in the Ge'ez, reinforcing the restored and blessed setting.
    reason: cross_reference
  - marker: c
    text: Or 'until those sheep entered into a good place, into a land of delight and glory; and I saw until the sheep were satisfied, and that house was in their midst in the land of delight.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 양들이 좋은 곳과 즐겁고 영광스러운 땅에 들어갈 때까지 보았습니다. 또 나는 양들이 배부르게 될 때까지 보았으며, 그 집[a]이 그 즐거운 땅 한가운데 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 환상적 상징 안에서 성소나 성전을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 게에즈 본문은 끝부분에서 ‘즐거운 땅’이라는 표현을 다시 반복하여, 회복되고 복된 상태를 강조합니다.
    reason: cross_reference
