  yaml_path: translation/extra_canonical/1_enoch/089/034.yaml
  text: And when they saw him[a], they were afraid and trembled before his face[b], and they desired to return to their own folds.
  footnotes:
  - marker: a
    text: Literally, 'before his face,' a vivid expression for standing in his presence.
    reason: lexical_alternative
  - marker: b
    text: The final phrase likely refers to animal enclosures or sheepfolds; 'folds' preserves the vision's animal symbolism.
    reason: cultural_note
