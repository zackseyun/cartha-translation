base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/060.yaml
  text: “And I will hand them over to you by number[a], and I will tell you which of them are to be destroyed[c][b], and those you shall destroy.” And he handed over to them those sheep.
  footnotes:
  - marker: a
    text: The phrase rendered 'among them' may also be understood more loosely as 'from them' or 'with them,' depending on how the preposition is read in this witness.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult. 'Was delivered over to them' is chosen because it fits the passage's judgment-laden animal imagery, but 'was entrusted to them' is also possible.
    reason: alternative_reading
  - marker: c
    text: 'Or ''And I will tell you in truth, and I will declare to you what will happen among them: they gathered them together, and that sheep was delivered over to them.''.'
    reason: previous_rendering
translation:
  language: ko
  text: “내가 그들을 수대로 너희에게 넘겨주고, 그들 가운데서 누가 멸망할지 너희에게 알려 주며, 너희는 그들을 멸망시킬 것입니다.” 그리고 그가 그 양들을 그들에게 넘겨주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수대로’는 이 본문에서 배분 기준을 나타내는 표현으로, 문자적으로는 ‘숫자대로’ 또는 ‘수에 따라’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸망시킬 것입니다’는 심판적 파괴를 분명히 드러내기 위한 번역이며, 더 완곡하게는 ‘파멸시킬 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሜጥወክሙ
  english_pob_choice: I will hand them over to you by number
  chosen_korean: 내가 그들을 수대로 너희에게 넘겨주고
  alternatives_korean:
  - 내가 그들을 수를 따라 너희에게 넘기고
  - 내가 그들을 차례대로 너희에게 넘겨주고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 መጠወ의 ‘넘겨주다/건네주다’ 의미를 살리고, በኍልቍ을 ‘수대로’로 옮겨 수량이 기준이 되는 점을 드러냈습니다.
- source_word: በኍልቍ
  english_pob_choice: by number
  chosen_korean: 수대로
  alternatives_korean:
  - 숫자대로
  - 번호대로
  - 수에 따라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘by number’의 질서 있는 배분 의미를 자연스럽게 살리면서도, 단순한 숫자 열거보다 배분 기준임을 나타내기 위해 ‘수대로’를 택했습니다.
- source_word: ዘይትኃጐል
  english_pob_choice: which of them are to be destroyed
  chosen_korean: 그들 가운데서 누가 멸망할지
  alternatives_korean:
  - 그들 가운데 누가 파멸될지
  - 그들 중 누가 멸해질지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 심판의 결과를 가리키는 미래 상대절이므로 ‘멸망할지’로 옮겨, 단순한 사건 서술이 아니라 파멸의 대상 식별이라는 점을 유지했습니다.
- source_word: አኅጕሉ
  english_pob_choice: and those you shall destroy
  chosen_korean: 너희는 그들을 멸망시킬 것입니다
  alternatives_korean:
  - 너희는 그들을 파멸시킬 것입니다
  - 너희는 그것들을 없앨 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 어근이 ‘멸하다/파멸시키다’의 강한 심판 행위를 나타내므로, 완곡하게 약화하지 않고 ‘멸망시키다’로 직접 반영했습니다.
- source_word: ዝኩ አባግዐ
  english_pob_choice: those sheep
  chosen_korean: 그 양들을
  alternatives_korean:
  - 그 양들
  - 그 어린 양들을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상징적 동물 표상을 그대로 유지하기 위해 ‘양들’로 옮겼고, 특정 표지 표현은 앞선 지시어를 살려 ‘그 양들’로 처리했습니다.
