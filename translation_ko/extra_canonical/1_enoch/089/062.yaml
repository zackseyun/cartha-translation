  to: 그리고 기록자는 목자들이 행한 모든 과도함과 파괴, 곧 그들이 내 명령으로 얼마나 파괴했는지와 자기 책임으로 얼마나 파괴했는지를 기록하였습니다.[a] 그 칠십 목자들이 저지른 모든 파괴는 그들에게 불리하게 기록되었습니다.[b]
  rationale: 명령문을 기록 행위의 서술로 고치고, 문맥상의 기록자를 명시했습니다. 첫 병렬 명사는 영어 POB 감사본과 전승적 번역에 따라 ‘과도함과 파괴’로 옮겼습니다. 수량을 헤아리는 두 절, ‘내 명령’과 ‘자기 책임’의 대조, 그리고 칠십 목자들에 대한 불리한 기록을 모두 복원했습니다. ‘자기 책임’의 해석적 성격과 ‘파괴’ 어근의 의미 범위는 각주에서 보존했습니다.
