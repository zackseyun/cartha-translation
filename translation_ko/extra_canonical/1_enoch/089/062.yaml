theological_decisions:
- issue: 명령에 따른 파괴와 자기 책임의 파괴를 어떻게 구분해 옮길지
  chosen_reading: 본문의 긴장을 보존해, 일부 파괴는 ‘내 명령으로’ 행해졌고 다른 일부는 ‘자기 책임으로’ 행해진 것으로 구분했습니다.
  alternative_readings:
  - 모든 파괴를 단순히 신적 명령의 결과로 통일함
  - 모든 파괴를 목자들의 자의적 행동으로만 읽음
  rationale: 게에즈 본문은 명령에 따른 행위와 책임 귀속을 나란히 두어 판단의 구분을 만듭니다. 이를 평탄화하지 않고 한국어에서도 분리해 옮기는 것이 문맥의 신학적 긴장을 보존합니다.
  doctrine_reference: 신적 주권과 피조물의 책임의 긴장을 유지
