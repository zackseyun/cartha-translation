base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/039.yaml
  text: And I saw until they grew quiet from the outcry for that sheep[a], and they crossed that stream of water. And the other two sheep, which were leading them, stood in place of those who had lain down[e][d][c][b], and they led them.
  footnotes:
  - marker: a
    text: The clause rendered 'they set down those who had lain down' is textually and lexically difficult. The Ge'ez may mean that the leading sheep placed, stationed, or gathered those who had lain down before leading them onward.
    reason: textual_variant
  - marker: b
    text: '''Stream of water'' could also be rendered ''watercourse'' or ''river,'' depending on how specifically the flowing water is understood in context.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the outcry of those sheep'.
    reason: previous_rendering
  - marker: d
    text: Or 'those other sheep stood still, the ones who were leading them'.
    reason: previous_rendering
  - marker: e
    text: Or 'and they set down those who had lain down'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보니 그들이 그 양을 향한 외침에서 잠잠해질 때까지였고, 그들은 그 물의 흐름을 건넜습니다. 그리고 그들을 인도하던 다른 두 양은, 누워 있던 이들의 자리에 서서 그들을 인도했습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서의 ‘외침’은 POB의 ‘outcry’를 따른 것으로, Ge'ez의 표현은 ‘양에 대한 외침’으로 읽을 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물의 흐름’은 ‘시냇물’이나 ‘강’으로도 옮길 수 있으나, 원문은 더 일반적인 흐름을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 양을 향한’은 ‘그 양의 외침’으로도 이해될 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: ‘다른 두 양’은 ‘그 밖의 두 양’으로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: e
    text: ‘누워 있던 이들의 자리에 서서’는 원문이 ‘그 자리에 대신 서다’는 뜻일 수 있음을 반영한 옮김입니다.
    reason: textual_variant
lexical_decisions:
- source_word: አርመሙ
  english_pob_choice: grew quiet
  chosen_korean: 잠잠해질
  alternatives_korean:
