  - 침묵할
  - 가라앉을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 진행적 의미를 살려, 외침이 멎어 가는 과정을 ‘잠잠해질’로 옮겼습니다.
- source_word: እምጽራኁ
  english_pob_choice: from the outcry
  chosen_korean: 그 양을 향한 외침에서
  alternatives_korean:
  - 외침에서
  - 부르짖음에서
  - 소란에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 ‘outcry’가 지닌 집단적이고 격렬한 뉘앙스를 살리되, 문맥상 대상이 분명해 보이므로 ‘그 양을 향한’으로 보완했습니다.
- source_word: ተክሎሙ
  english_pob_choice: stood in place of
  chosen_korean: …의 자리에 서서
  alternatives_korean:
  - 대신하여 서서
  - 그 자리를 대신하여
  - 그 자리에 대신 서서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 검토된 해설에 따라 ‘놓다/세우다’가 아니라 ‘~의 자리에서/대신하여’의 뜻으로 이해하여, 두 양이 이전 지도자들의 자리를 대신함을 드러냈습니다.
- source_word: ውሒዘ ማይ
  english_pob_choice: stream of water
  chosen_korean: 물의 흐름
  alternatives_korean:
  - 물줄기
  - 시냇물
  - 강물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지칭이 꼭 ‘강’으로 좁혀지지 않으므로, 보다 중립적인 ‘물의 흐름’으로 옮겼습니다.
- source_word: ይመርሕዎሙ / መርሕዎሙ
  english_pob_choice: were leading them / led them
  chosen_korean: 인도하던 / 인도했습니다
  alternatives_korean:
  - 이끌던 / 이끌었습니다
  - 안내하던 / 안내했습니다
  - 데리고 가던 / 데리고 갔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 동사를 일관되게 ‘인도하다’로 옮겨 서사적 반복과 지도자 역할을 분명히 했습니다.
theological_decisions:
- issue: 이 구절의 동물 상징을 해석어로 풀지 않고 유지할지 여부
  chosen_reading: ‘양’과 이동·인도 동작을 그대로 유지하고, 사람 집단이나 역사적 실체로 풀어 쓰지 않았습니다.
  alternative_readings:
  - ‘백성들’로 의역
  - ‘이스라엘’로 해석 반영
  rationale: 꿈환상 본문의 동물 상징을 본문 자체의 수사로 보존하는 것이 원문 독해에 더 충실하다고 보았습니다.
  doctrine_reference: 원문 우선 원칙 및 묵시문학 상징 보존
