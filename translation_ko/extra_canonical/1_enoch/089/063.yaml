  rationale: 문맥이 단순 기록보다 증거 능력을 지닌 진술에 가깝기 때문에 ‘증언’이 가장 자연스럽습니다.
- source_word: ኖላዊያን
  english_pob_choice: shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 목자들
  - 목동들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 묵시문학의 상징군을 일관되게 유지하기 위해 표준적인 ‘목자들’을 사용했습니다.
- source_word: በትእዛዝየ ዘአዘዝክዎሙ
  english_pob_choice: my command that I commanded them
  chosen_korean: 내가 그들에게 명한 내 명령
  alternatives_korean:
  - 내가 그들에게 명령한 것
  - 내가 그들에게 준 명령
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복이 강조점이므로 이를 평평하게 줄이지 않고 ‘명한 내 명령’으로 중첩을 살렸습니다.
theological_decisions:
- issue: 발화자와 청자 관계
  chosen_reading: 주님이 기록자에게 직접 명령하시는 장면으로 이해하여 1인칭-2인칭 관계를 유지했습니다.
  alternative_readings:
  - 시인이 자신에게 말하는 독백
  - 제3자에게 전하는 서술
  rationale: Ge'ez의 1인칭 소유 표지(‘내 앞에서’, ‘내 명령’)와 공적 낭독 명령이 함께 나타나므로, 주님의 직접 발화로 읽는 것이 문법과 문맥에 가장 부합합니다.
  doctrine_reference: 본문 문법 우선 원칙
