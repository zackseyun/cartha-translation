revisions:
- from: 그리고 수로 헤아려 내 앞에서 읽어 주십시오. 그들이 얼마나 파괴하는지와 얼마나 파괴되도록 넘기는지 말입니다[a]. 그러면 이것이 그들에 대한 내 증언이 되어, 내가 목자들의 모든 행위를 알고 그들을 평가하며, 그들이 내가 그들에게 명한 내 명령을 지키는지, 아니면 아닌지 보게 될 것입니다.
  to: 그리고 그들이 얼마나 멸망시키는지와 얼마나 멸망에 넘기는지를 수대로 내 앞에서 읽어 주십시오[a]. 그러면 이것이 그들을 고발하는 증언이 되어, 내가 목자들의 모든 행위를 알고 그들을 심사하며, 그들이 내가 그들에게 명한 내 명령을 지키는지 그렇지 않은지를 보게 될 것입니다.
  rationale: 초두의 명령형과 ‘내 앞에서’를 보존하되, 반복되는 수량 구문을 ‘읽어 주십시오’의 자연스러운 목적어로 재구성했습니다. 증언이 목자들을 향한 고발 기능을 한다는 점과, 목자들의 행위 및 명령 준수를 심사하는 후반의 구조를 유지했습니다. 본문이 불명확한 초두의 대상·세부 관계는 각주에서 제한적으로 설명했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:27Z'
