- source_word: አንበብ
  english_pob_choice: read out
  chosen_korean: 읽어 주십시오
  alternatives_korean:
  - 읽으십시오
  - 낭독해 주십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령형으로 주어지는 법정적·공적 낭독의 뉘앙스를 살리기 위해 ‘읽어 주십시오’로 옮겼습니다.
- source_word: ቅድሜየ
  english_pob_choice: before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내 앞에
  - 나 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어미 -የ가 가리키는 1인칭 소유격을 반영해 ‘나 앞’이 아니라 ‘내 앞에서’로 옮겼습니다.
- source_word: ሚመጠነ
  english_pob_choice: how many / the tally of
  chosen_korean: 수로 헤아려
  alternatives_korean:
  - 얼마나
  - 그 수를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 정보가 아니라 심판을 위한 계수 행위를 나타내므로, 수량의 행위를 드러내는 표현을 택했습니다.
- source_word: ስምዐ
  english_pob_choice: testimony
