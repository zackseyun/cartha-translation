base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/064.yaml
  text: And let them not know[a], and do not show them, and do not rebuke them; but write down all the destruction of the shepherds, each one in its time[c][b], and bring all of it up before me.
  footnotes:
  - marker: a
    text: The Ethiopic wording is difficult in the final clause. The verb can suggest 'bring up' or 'present.' The translation keeps the upward imagery of heavenly presentation.
    reason: lexical_alternative
  - marker: b
    text: The distributive phrase after 'in its time' is textually awkward in the OCR witness; the sense appears to be sequential or item-by-item accounting.
    reason: textual_variant
  - marker: c
    text: Or 'And they did not know, and I did not show them, and I did not rebuke them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 알지 못하게 하십시오. 그들에게 보여 주지 말고, 그들을 꾸짖지도 마십시오. 오직 목자들의 모든 멸망을 각자의 때에 기록하고, 그것을 모두 제 앞에 가져오십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈어 문구의 마지막 절은 해석이 까다롭지만, 상향적 제시의 이미지는 살려 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘각자의 때에’에 해당하는 분배 표현은 본문 전승상 다소 어색하여, 순차적·항목별 기록의 뜻으로 이해했습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘그들이 알지 못했고, 나는 보여 주지 않았고, 꾸짖지 않았다’로도 읽을 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወኢያእምሩ
  english_pob_choice: and let them not know
  chosen_korean: 그들이 알지 못하게 하십시오
  alternatives_korean:
  - 그들이 알지 못하도록 하십시오
  - 그들이 알게 하지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 3인칭 복수 금지형으로 이해하는 것이 문법상 맞으며, ‘알지 못하게 하십시오’가 인지의 차단을 가장 직접적으로 드러냅니다.
- source_word: ወኢታርእዮሙ
  english_pob_choice: and do not show them
  chosen_korean: 그들에게 보여 주지 말고
  alternatives_korean:
  - 그들에게 보이지 말고
  - 그들에게 드러내지 말고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘보여 주다’가 시각적 계시를 자연스럽게 살리며, 단순한 ‘보이다’보다 행위 주체의 금지를 분명히 합니다.
- source_word: ወኢትዝለፎሙ
  english_pob_choice: and do not rebuke them
  chosen_korean: 그들을 꾸짖지도 마십시오
  alternatives_korean:
  - 그들을 책망하지 마십시오
  - 그들을 비난하지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 심판적 경고보다 일시적 비개입을 말하므로, ‘꾸짖다’가 재판적·예언적 어조를 가장 잘 보존합니다.
- source_word: ኵሎ፡ ሐጕለ፡ ኖላዊያን
  english_pob_choice: all the destruction of the shepherds
  chosen_korean: 목자들의 모든 멸망
  alternatives_korean:
  - 목자들의 모든 파멸
  - 목자들의 모든 멸절
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘멸망’은 단순한 손상보다 종말론적 파괴를 담아, 목자들에 대한 심판 맥락을 유지합니다.
- source_word: ወአዐርግ፡ ኵሎ፡ ኀቤየ
  english_pob_choice: and bring all of it up before me
  chosen_korean: 그것을 모두 제 앞에 가져오십시오
  alternatives_korean:
  - 그것을 모두 제 앞에 올리십시오
  - 그것을 모두 제게로 올려오십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘bring up’의 상향 이미지를 한국어에서 과도하게 형상화하지 않고도, 최종적으로는 면전으로 가져오는 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: 지식·계시의 유보와 심판 기록의 병행
  chosen_reading: 목자들에게는 알게 하거나 보여 주거나 꾸짖는 개입을 하지 말고, 그들의 멸망은 따로 기록하여 나중에 하나님 앞에 올리도록 하는 명령으로 읽었습니다.
  alternative_readings:
  - 서술형으로 ‘그들은 알지 못했고, 나는 보여 주지 않았고, 꾸짖지 않았다’로 읽는 방식
  rationale: 아드주디케이터가 지적한 대로 히브리/게즈 동사형은 금지형 명령이며, 문맥은 즉각적 개입이 아닌 지연된 심판과 기록을 강조합니다.
  doctrine_reference: 계시의 유보와 최종 심판의 보류된 집행을 보존
- issue: ‘제 앞에 가져오다’의 상향 이미지
  chosen_reading: 하늘 법정으로 올려 드리는 상향적 제시의 이미지를 살려 ‘제 앞에 가져오십시오’로 옮겼습니다.
  alternative_readings:
  - ‘제게 바치십시오’처럼 더 평면적으로 옮기는 방식
  rationale: 영어 POB의 ‘bring up’이 보존하는 상향 운동을 지우지 않기 위해, 한국어에서도 접근 방향을 남겼습니다.
  doctrine_reference: 하늘에서의 기록과 제시라는 묵시문학적 공간성 보존
