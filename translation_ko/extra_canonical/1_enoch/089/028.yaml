base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/028.yaml
  text: But the sheep passed from that water and went out into a wilderness where there was no water or grass[a]; and they began to open their eyes and to see. And I saw the Lord of the sheep shepherding them and giving them water and grass[d][c][b], and that sheep going and leading them.
  footnotes:
  - marker: a
    text: The phrase 'began to open their eyes and to see' likely signals awakening or renewed perception within the vision, but the translation keeps the animal imagery explicit.
    reason: lexical_alternative
  - marker: b
    text: '''Grass'' could also be rendered ''pasture'' or ''herbage''; the Ge''ez term denotes fodder suitable for the flock.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And those sheep'.
    reason: previous_rendering
  - marker: d
    text: Or 'and that sheep was going and leading them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 양 떼는 그 물에서 지나가 광야로 나갔는데, 그곳에는 물도 풀도 없었습니다[a]. 그리고 그들은 눈을 뜨기 시작하여 보게 되었습니다. 내가 보니 양 떼의 주께서 그들을 목자처럼 돌보시며 그들에게 물과 풀을 주셨고[d][c][b], 또 그 한 양이 가며 그들을 인도하고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서는 단순한 지리 묘사보다, 물과 초목이 없는 결핍의 상태를 강조합니다.
    reason: source_note
  - marker: b
    text: ‘풀’은 ‘목초’ 또는 ‘사료’로도 옮길 수 있는데, 양 떼 문맥에서는 먹이로서의 초목을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 양들’.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘그 한 양이 가며 그들을 인도하고 있었습니다’.
    reason: previous_rendering
