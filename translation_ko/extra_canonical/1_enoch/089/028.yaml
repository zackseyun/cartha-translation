  to: 그 양들은 그 물을 떠나 물도 풀도 없는 광야로 나갔습니다. 그리고 그들은 눈을 뜨기 시작하여 보았습니다[a]. 내가 보니, 양들의 주께서 그들을 목자로서 돌보시며 그들에게 물과 풀을 주시고[b], 그 양이 가면서 그들을 인도하는 것도 보았습니다[c][d].
  rationale: 원문의 사건 연결과 이동 방향을 보존하도록 역접을 제거하고 ‘그 물을 떠나’로 고쳤습니다. 양 떼의 주라는 상징적 호칭과 목양 이미지는 유지하되, 원문에 없는 해석적 확대는 피했습니다. 마지막 절은 እንዘ와 미완료 동사가 묘사하는 진행 장면을 ‘내가 보니’에 종속되는 관찰로 자연스럽게 표현했습니다. 각주는 관련 본문 위치와 영어 감사 기록의 기능에 맞게 재배치·정정했습니다.
