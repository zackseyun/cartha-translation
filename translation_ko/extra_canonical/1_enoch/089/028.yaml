  rationale: 환상 본문은 상징 자체를 보존하는 것이 중요하므로, 해석적 설명으로 평면화하지 않았습니다.
  doctrine_reference: 보이는 환상 이미지와 그 상징적 의미를 함께 보존한다.
- issue: '''눈을 뜨기 시작하여 보게 되었습니다''의 의미'
  chosen_reading: 동물 이미지와 인식의 각성을 함께 살렸습니다.
  alternative_readings:
  - 깨닫기 시작했습니다
  - 분별하기 시작했습니다
  rationale: 원문은 문자적 환상 장면으로 말하면서도 인식의 개시를 암시하므로, 그 긴장을 해소하지 않고 유지했습니다.
  doctrine_reference: 문자적 환상성과 상징적 각성을 동시에 보존한다.
