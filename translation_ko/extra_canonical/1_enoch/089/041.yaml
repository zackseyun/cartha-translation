- issue: 반복되는 ‘눈이 열림/멀어짐’의 상징성
  chosen_reading: 시각적 이미지 자체를 유지하고, 그것이 깨달음·인식·회복을 뜻할 가능성은 열어 두되 한 가지 의미로 고정하지 않았습니다.
  alternative_readings:
  - 그들의 이해가 밝아졌다
  - 그들의 영적 시야가 회복되었다
  rationale: 이 환상은 상징이 강하지만 본문이 의미를 직접 해설하지 않으므로, 해석을 번역문 안에서 단정하지 않는 것이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: preserve_symbolic_tension
