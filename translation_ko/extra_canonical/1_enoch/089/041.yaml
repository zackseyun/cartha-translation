  rationale: 검토본이 ‘brought them all back’를 배제한 뒤, 원문 동사의 방향성을 살려 ‘데리고 들어가다’로 옮겼습니다. ‘모으다’보다 이동의 결과를 더 분명히 보여 줍니다.
