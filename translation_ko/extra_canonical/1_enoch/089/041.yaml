  lexicon: Leslau; contextual idiom in Ge'ez
  rationale: 게즈 관용구는 단순한 ‘some’가 아니라 반복적으로 ‘때로는 ... 때로는’의 뜻이므로, 시간적 교차를 자연스럽게 살렸습니다.
