base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/066.yaml
  text: And the lions and the leopards devoured and swallowed up most of those sheep[a], and the wild boars of the desert ate with them[c][b], and they burned that tower and tore down that house.
  footnotes:
  - marker: a
    text: The exact feline meant by the Ethiopic term rendered 'tigers' is uncertain; 'leopards' or 'panthers' are possible.
    reason: lexical_alternative
  - marker: b
    text: '''House'' likely refers symbolically to the sanctuary/temple within the vision, but the main text preserves the image used in the narrative.'
    reason: cultural_note
  - marker: c
    text: Or 'And lions and tigers and wild boars of the desert devoured and swallowed up most of those sheep with them'.
    reason: previous_rendering
translation:
  language: ko
  text: 사자들과 표범들이 그 양들[a]의 대부분을 먹어 치우고 삼켜 버렸으며, 광야의 멧돼지들이 그들과 함께 먹었고, 그들은 그 탑을 불태우고 그 집을 헐어 버렸습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어의 이 동물 명칭은 ‘표범’ 또는 ‘표범류’로 이해할 수 있습니다. 전통적으로 ‘호랑이’로 옮기기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집’은 환시 안에서 상징적으로 성소나 성전을 가리킬 가능성이 있지만, 본문은 우선 그 이미지를 그대로 유지합니다.
    reason: cultural_note
