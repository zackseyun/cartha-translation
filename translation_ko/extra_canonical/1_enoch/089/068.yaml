  naturalness: ‘수로 넘겨졌습니다’는 현대 표준 한국어에서 부자연스럽습니다. ‘수에 따라 넘겨졌습니다’가 계수·할당의 뜻을 자연스럽게 전달합니다. 긴 대시로 삽입한 ‘그들 가운데 육십’도 문장 구조를 흐리므로 별도 문장으로 처리하는 편이 명료합니다.
