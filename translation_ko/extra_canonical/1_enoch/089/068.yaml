  chosen_korean: 넘겨 주어 / 넘겨졌습니다
  alternatives_korean:
  - 내주어 / 내주어졌습니다
  - 인도하여 주어 / 인도되었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 전달이 아니라 심판적·폭력적 이전을 뜻하므로, 소극적으로 약화시키지 않는 ‘넘겨 주다’ 계열을 택했습니다.
- source_word: አራዊተ ገዳም
  english_pob_choice: the wild beasts of the desert
  chosen_korean: 광야의 모든 들짐승
  alternatives_korean:
  - 광야의 모든 야수
  - 사막의 모든 들짐승
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘광야’는 이 전통의 apocalyptic 배경을 한국어 성경 문체로 가장 잘 전달하고, ‘들짐승’은 포식적 이미지와 직접 대응합니다.
- source_word: በኍልቍ
  english_pob_choice: by number
  chosen_korean: 수로
  alternatives_korean:
  - 수대로
  - 숫자로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 계산·집계의 의미를 살리되, 한국어에서 읽기 자연스러운 부사격 표현으로 처리했습니다.
- source_word: ፷፻ እምኔሆሙ
  english_pob_choice: sixty from among them
  chosen_korean: 그들 가운데 육십이었으며
  alternatives_korean:
  - 그들 가운데서 육십이었으며
  - 그들 중 육십이었으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문에 보이는 수사와 범위를 보수적으로 반영했습니다. 문자상 수치를 완전히 해석하지 않고, 수가 ‘그들 가운데’서 산정되었음을 드러냈습니다.
- source_word: ለካልኡ በመጽሐፍ ይጸሐፍ
  english_pob_choice: the record of the others was written down in the book
  chosen_korean: 나머지의 수는 책에 기록되어
  alternatives_korean:
  - 다른 이들의 수는 책에 기록되어
  - 나머지는 책에 기록되어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 정리대로 ‘책’에는 남은 자들의 수가 기록된다는 점을 살리면서, 한국어에서는 간명하게 ‘나머지의 수’로 압축했습니다.
