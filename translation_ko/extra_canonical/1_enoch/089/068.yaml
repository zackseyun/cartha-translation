  chosen_korean: 그 동료들
  alternatives_korean:
  - 그들의 साथी들
  - 그들과 함께한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 목자들과 함께한 연관 인물을 가리키므로, 자연스러운 합쇼체 문장 안에서 관계성을 살린 ‘동료들’로 옮겼습니다.
