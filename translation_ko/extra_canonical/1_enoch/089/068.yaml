  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 문맥의 상징적 ‘shepherds’를 한국어에서도 가장 직접적으로 살려, 해석을 미리 특정하지 않고 보존했습니다.
- source_word: ወጸማዶሙ
