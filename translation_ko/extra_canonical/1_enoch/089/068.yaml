base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/068.yaml
  text: And the shepherds and their companions handed over those sheep to all the wild beasts of the desert[a], so that they might devour them; and all of them, each in its time, was delivered over by number—sixty from among them—while the record of the others was written down in the book[d][c][b], how many were destroyed from among them.
  footnotes:
  - marker: a
    text: The numeral and surrounding accounting language are difficult in this witness. The Ethiopic OCR appears to read 'sixty,' but the line may preserve a corrupt or uncertain tally. The verse's main point is that the sheep were handed over under a counted and recorded reckoning.
    reason: textual_variant
  - marker: b
    text: Literally 'written in the book,' continuing the vision's theme that the destruction is not only permitted but also recorded.
    reason: cross_reference
  - marker: c
    text: '''By tale'' means by numerical reckoning or count.'
    reason: lexical_alternative
  - marker: d
    text: Or 'by tale'.
    reason: previous_rendering
translation:
  language: ko
  text: 목자들과 그 동료들이 그 양들을 광야의 모든 들짐승에게 넘겨 주어 그것들이 그것들을 삼키게 하였고, 그들 모두는 각기 때를 따라 수로 넘겨졌습니다 — 그들 가운데 육십이었으며 — 나머지의 수는 책에 기록되어, 그들 가운데서 얼마나 멸망했는지가 적혀 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들짐승’은 문자적으로는 광야/들판의 포식 동물을 가리키며, 이 환상에서는 심판과 파괴의 도구로 기능합니다.
    reason: source_note
  - marker: b
    text: ‘책에 기록되어’는 단순한 보관이 아니라, 파괴까지도 기록되는 심판적 회계를 가리킵니다.
    reason: theological_note
  - marker: c
    text: ‘수로’는 ‘수대로/숫자로’의 뜻으로, 계산된 집계를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
