  - severity: medium
    issue: ‘나머지의 수’는 원문보다 구체화된 표현입니다.
    rationale: 원문 및 영어 감사 기록은 ‘다른 이들/나머지’와 책에 쓰인 기록을 말합니다. ‘나머지에 관한 기록’은 수량 기록이라는 가능한 함의를 보존하면서도 불필요한 단정을 피합니다.
