  text: 나는 그 양들이 늑대들로부터[a] 나올 때까지 보았습니다. 늑대들의 눈이 멀어졌고, 그 늑대들은 온 힘을 다하여 그 양들을 따라 나왔습니다.
  philosophy: optimal-equivalence
  footnotes:
