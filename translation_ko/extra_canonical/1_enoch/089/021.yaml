  rationale: 최신 영어 공역의 'following'을 반영하되, 한국어에서는 단순 동행보다 뒤따르는 동작이 드러나도록 했습니다. 다만 원문의 해석 과잉을 피하기 위해 '쫓다'보다는 중립적인 '따라 나오다'를 선택했습니다.
