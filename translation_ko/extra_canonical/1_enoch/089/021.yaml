base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/021.yaml
  text: And I saw the sheep until they came out from the wolves[a]; and the eyes of the wolves were blinded[b], and those wolves went out following the sheep with all their power.
  footnotes:
  - marker: a
    text: The subject of 'they went out pursuing' is contextually best taken as the wolves, though the Ge'ez sequence is compact enough that the line could be read less explicitly as a continued movement scene involving both groups.
    reason: alternative_reading
  - marker: b
    text: Or 'those sheep until they came out from the wolves; and the wolves blinded their eyes, and they went out pursuing those sheep'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그 양들을 보니, 그 양들이 늑대들로부터 나올 때까지였으며, 늑대들의 눈이 멀어졌고, 그 늑대들은 모든 힘을 다해 그 양들을 따라 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘늑대들로부터’이지만, 앞뒤 문맥상 양들이 늑대들의 영역에서 빠져나오는 장면으로 이해하는 것이 가장 자연스럽습니다.
    reason: alternative_reading
