  rationale: 이 본문의 동물 상징은 일관되게 ‘sheep’ 계열이므로, ‘양’으로 옮겨 상징적 어휘를 유지했습니다.
- source_word: አዝእብት
  english_pob_choice: wolves
  chosen_korean: 늑대들
  alternatives_korean:
  - 이리들
  - 승냥이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접적인 포식자 표지로서 가장 표준적인 대응어는 ‘늑대들’입니다.
- source_word: ከመ ይስምዕ ዲቤሆሙ
  english_pob_choice: so that he might hear concerning them
  chosen_korean: 그가 그들에 관해 들을 수 있게 하여
  alternatives_korean:
