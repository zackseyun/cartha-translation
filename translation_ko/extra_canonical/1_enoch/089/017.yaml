base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/017.yaml
  text: And he called that sheep which had escaped from the wolves[a], and spoke with him about the wolves, so that he might hear concerning them[d][c][b], that they might not oppress the sheep.
  footnotes:
  - marker: a
    text: The clause 'so that he might hear against them' is textually and syntactically difficult. It may mean that the ram was warned about the wolves, or that he was made to hear a charge concerning them.
    reason: alternative_reading
  - marker: b
    text: Or 'which had sinned from among the sheep'.
    reason: previous_rendering
  - marker: c
    text: Or 'so that he might hear against them'.
    reason: previous_rendering
  - marker: d
    text: Or 'that ram'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 늑대들[a]에게서 도망쳐 나온 그 양을 불러, 늑대들에 관해 그에게 말했습니다. 그리하여 그가 그들에 관해 들을 수 있게 하여, 양들을 해치지 못하게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘늑대들’은 본문의 포식자 이미지를 그대로 살린 번역입니다.
    reason: lexical_alternative
