  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본적으로는 ‘듣다’의 관계절 구조로 보되, 문맥상 목적절이므로 한국어에서는 자연스럽게 풀어 ‘들을 수 있게 하여’로 옮겼습니다.
- source_word: ኢይግስስዎሙ
  english_pob_choice: might not oppress / ravage
  chosen_korean: 해치지 못하게
  alternatives_korean:
  - 괴롭히지 못하게
  - 짓밟지 못하게
  - 유린하지 못하게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기존 영문 전승의 ‘oppress/ravage’ 중에서도 본문 문맥상 양들에게 가해지는 폭력을 포괄하는 한국어로 ‘해치다’를 택했습니다.
theological_decisions:
- issue: ‘듣다’ 구문의 난해함을 한국어에서 얼마나 해석적으로 풀 것인지
  chosen_reading: 그가 그들에 관해 들을 수 있게 하여
  alternative_readings:
  - 그들에 대해 들을 수 있도록
  - 그들에 관하여 듣게 하여
  rationale: 게에즈 구문은 문법적으로 다소 난해하지만, 의미를 과도하게 특정하지 않고 목적절 기능을 살려 독자가 본문의 긴장을 보도록 했습니다.
  doctrine_reference: source-language primacy; preserve ambiguity where the source is syntactically difficult
