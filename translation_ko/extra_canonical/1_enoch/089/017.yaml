  - 소집하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서술 흐름에 맞는 기본 동사로, 과도한 권위 뉘앙스를 피하면서도 ‘부르다’의 의미를 자연스럽게 살렸습니다.
