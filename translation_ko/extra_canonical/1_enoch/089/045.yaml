base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/045.yaml
  text: And the Lord of the sheep sent a sheep to another sheep[a], and raised him up so that he might become a ram and might lead the sheep in place of that ram[c][b], which had abandoned his glory.
  footnotes:
  - marker: a
    text: Or 'another sheep.' The singular animal term may be read more generally, but 'lamb' better preserves the contrast with the later 'ram.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his honor' or 'his splendor.' The phrase likely refers to the ram's status or dignity, not necessarily visible brightness alone.
    reason: lexical_alternative
  - marker: c
    text: Or 'the lamb to another lamb'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들의 주인이 양들 가운데 한 양을 다른 양에게 보내고[a], 그를 일으켜 세워 그가 숫양이 되게 하였으며, 그 양들을 그 숫양을 대신하여 이끌게 하셨습니다[c][b]. 그 숫양은 자기의 영광을 버린 자였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 양에게’. 여기서는 개별 동물의 대응을 살리기 위해 ‘한 양’을 본문에 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기의 명예’ 혹은 ‘자기의 존귀함’. 원문은 외적 광채보다 지위와 위엄을 가리킬 가능성이 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 양을 다른 양에게’.
    reason: previous_rendering
lexical_decisions:
- source_word: እግዚኦሙ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 그들의 주인
  alternatives_korean:
  - 양들의 주인
  - 양의 주님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 원문의 소유 관계를 살리되, 이 환상 문맥에서는 신적 통치자의 권위를 나타내므로 ‘주인’으로 옮기고 ‘그들의’로 대상 군집을 분명히 했습니다.
- source_word: በግዕ
  english_pob_choice: a sheep / another sheep
  chosen_korean: 한 양 / 다른 양
  alternatives_korean:
  - 한 마리 양 / 또 한 양
  - 어린 양 / 다른 어린 양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 종별 상징을 유지하는 개별 동물을 가리키므로 ‘양’으로 직역하되, 수량과 대조를 살리기 위해 ‘한’과 ‘다른’을 붙였습니다. ‘어린 양’은 원문의 연령 정보를 넘겨 해석합니다.
- source_word: አንሥአ
  english_pob_choice: raised him up
  chosen_korean: 그를 일으켜 세워
  alternatives_korean:
  - 그를 높이 들어
  - 그를 세우고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 임명보다 신적 승격의 동작성이 중요하므로, 상승과 회복의 뉘앙스를 함께 담는 표현을 택했습니다.
- source_word: ሐርጌ
  english_pob_choice: a ram
  chosen_korean: 숫양
  alternatives_korean:
  - 수양
  - 두들겨양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 속 지도자 상징 동물을 한국어로 가장 자연스럽게 드러내는 말은 ‘숫양’입니다. 남성적 우두머리 상징을 보존합니다.
- source_word: ይመርሖሙ
  english_pob_choice: might lead the sheep
  chosen_korean: 양들을 ... 이끌게
  alternatives_korean:
  - 양들을 ... 인도하게
  - 양들을 ... 다스리게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 핵심은 목양적 인도이므로 ‘이끌다’가 가장 직설적이며, 통치적 함의도 과도하게 해석하지 않고 담을 수 있습니다.
- source_word: ዘሐደገ ስብሐቲሁ
  english_pob_choice: which had abandoned his glory
  chosen_korean: 자기의 영광을 버린 자
  alternatives_korean:
  - 자기의 영광을 떠난 자
  - 자기의 명예를 버린 자
  - 자기의 영광을 버린 숫양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 상태를 가리키며, POB의 ‘glory’를 따라 ‘영광’을 유지했습니다. ‘버린’은 의도적 이탈을 드러내고, 관계절을 명사구로 다듬어 한국어 문장 흐름을 살렸습니다.
theological_decisions:
- issue: 숫양 상징과 서사적 연속성
  chosen_reading: 동물 상징을 유지하여 ‘양’이 ‘숫양’이 되도록 번역했습니다.
  alternative_readings:
  - 지도자
  - 왕
  - 목자
  rationale: 이 본문은 정치적·신학적 승격을 동물 환상으로 표현하므로, 상징을 추상화하면 독자가 서사의 계승 구조를 놓치게 됩니다. 원문이 허용하는 범위 안에서 상징을 그대로 보존했습니다.
  doctrine_reference: 환상 문학의 상징 보존 원칙
- issue: ‘영광’의 의미
  chosen_reading: ‘영광’을 본문에 유지하고, 관계절로 ‘그 숫양은 자기의 영광을 버린 자였습니다’라고 옮겼습니다.
  alternative_readings:
  - 명예
  - 존귀
  - 광채
  rationale: 게에즈 표현은 단순한 외적 빛보다 지위와 존귀를 포함할 수 있어, 이를 너무 일찍 ‘명예’로 좁히지 않았습니다. 다만 한국어 독해를 위해 본문에는 ‘영광’을 유지하고, 대안은 주석에 남깁니다.
  doctrine_reference: 다의성 보존 및 주석화 원칙
