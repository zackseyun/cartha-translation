  source_fidelity: 핵심 의미는 충실합니다. ሥርዓት의 ‘정해진/규정된 분량’이라는 폭을 보존하고, 반복적 살상과 파괴 및 화자의 애도를 정확히 옮겼습니다. 다만 ‘그들의 정해진 분량’은 한국어에서 소유 관계가 다소 불분명하므로, 원문의 ‘그들에게 정해진’ 한도를 더 자연스럽고 분명하게 나타내는 편이 좋습니다.
