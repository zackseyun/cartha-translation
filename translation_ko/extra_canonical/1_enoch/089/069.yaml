base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/069.yaml
  text: And beyond their prescribed measure they kept killing and destroying[d][c][b][a], and I was weeping and crying out because of those sheep.
  footnotes:
  - marker: a
    text: Or 'beyond their appointed measure/order.' The Ge'ez term may refer to a fixed arrangement or allotted number.
    reason: lexical_alternative
  - marker: b
    text: The clause 'while I was sleeping' keeps the dream-vision frame explicit.
    reason: cultural_note
  - marker: c
    text: Or 'while I was sleeping, wept and cried out'.
    reason: previous_rendering
  - marker: d
    text: Or 'beyond their number'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그들에게 정해진 분량을 넘어서 계속 죽이고 파괴하였으며, 나는 그 양들 때문에 울며 부르짖었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሥርዓቶሙ
  english_pob_choice: beyond their prescribed measure
  chosen_korean: 그들의 정해진 분량을 넘어서
  alternatives_korean:
  - 그들의 수를 넘어서
  - 그들의 정해진 질서를 넘어서
  - 그들에게 정해진 양을 넘어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ሥርዓት은 단순한 ‘수’보다 ‘정해진 질서/규정된 분량’의 뜻을 함께 지니므로, 본문이 가리키는 위반의 성격을 살리기 위해 ‘정해진 분량’을 택했습니다.
- source_word: ይቀትል
  english_pob_choice: they kept killing
  chosen_korean: 그들은 계속 죽이고
  alternatives_korean:
  - 그들은 죽이고
  - 그들은 계속 죽였습니다
  - 그들은 죽여 갔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언적 환상 서술의 반복성과 지속성을 살리기 위해 단순 과거보다 ‘계속 죽이고’로 옮겼습니다.
- source_word: ያሐጕል
  english_pob_choice: destroying
  chosen_korean: 파괴하였고
  alternatives_korean:
  - 황폐하게 하였고
  - 무너뜨렸고
  - 멸망시켰고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: OCR로 불확실한 동사이지만, 문맥상 살상과 짝을 이루는 파괴 행위로 읽히므로 의미를 과도하게 좁히지 않는 ‘파괴하다’를 택했습니다.
- source_word: አባግዕ
  english_pob_choice: sheep
  chosen_korean: 양 떼들
  alternatives_korean:
  - 양들
  - 양 무리
  - 양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동물 환상어를 본문에서 그대로 살리되, 집합성을 드러내기 위해 ‘양 떼들’로 옮겼습니다.
theological_decisions:
- issue: 환상 속 ‘양’의 상징을 본문에서 해석어로 풀지 여부
  chosen_reading: 상징을 풀지 않고 ‘양 떼들’로 유지했습니다.
  alternative_readings:
  - 그 사람들 때문에
  - 이스라엘 때문에
  rationale: 묵시적 동물 이미지를 본문에서 평면화하지 않고, 독자가 환상 언어 자체를 읽도록 두는 것이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: Apocalyptic imagery should be preserved in translation rather than prematurely interpreted in the main text.
