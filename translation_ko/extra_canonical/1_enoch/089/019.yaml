  text: 그리고 그곳에서 나는 늑대들을 보았는데, 그들은 모든 힘으로 양들을 향해 몹시 강해졌고, 양들은 부르짖었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
