base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/019.yaml
  text: And from it I saw the wolves[a], and they became exceedingly strong against the sheep with all their power[c][b], and the sheep cried out.
  footnotes:
  - marker: a
    text: Or 'from him' or 'from there'; the pronominal suffix in 'from it' is ambiguous in isolation, and the immediate antecedent depends on the wider vision context.
    reason: lexical_alternative
  - marker: b
    text: 'The paired verbs likely express both strengthening and increase/intensification: the hostile creatures became strong and grew in force or number.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the wild beasts and the birds grow strong and increase'.
    reason: previous_rendering
