base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/043.yaml
  text: And that ram began to gore on this side and on that side those dogs and foxes and wild boars[c][b][a], until he had destroyed them all.
  footnotes:
  - marker: a
    text: The animal term rendered 'foxes' may also be understood more broadly as a wild canid, such as 'jackals.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from this side and from that side,' expressing attack on both sides or all around.
    reason: lexical_alternative
  - marker: c
    text: Or 'And I saw that horn making war from this side and from that side against the dogs and the foxes and the wild boars'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 그 숫양은 이쪽저쪽에서 그 개들과 여우들, 그리고 들멧돼지들을 들이받기 시작하여, 마침내 그들 모두를 멸하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 ቈናጽል은 ‘여우’로 옮길 수 있지만, 더 넓게는 ‘자칼’ 같은 들개류를 뜻할 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이쪽에서 저쪽에서’로, 양쪽 또는 사방에서의 공격을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 다른 전통 번역처럼, ‘이쪽저쪽에서 그 개들과 여우들, 그리고 들멧돼지들을 대적하여’로도 이해할 수 있습니다.
    reason: previous_rendering
