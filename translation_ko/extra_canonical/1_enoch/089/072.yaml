base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/072.yaml
  text: And again I saw the shepherds pasturing for twelve hours, and behold, three of those sheep returned, and they arrived and entered, and they began to build up all that had fallen down of that house.
translation:
  language: ko
  text: 그리고 다시 나는 목자들이 열두 시간 동안 양을 치는 것을 보았습니다. 보십시오, 그 양들 가운데 셋이 돌아와 도착하여 들어가서, 그 집에서 무너진 모든 것을 다시 세우기 시작하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምኔሁ
  english_pob_choice: And again
  chosen_korean: 그리고 다시
  alternatives_korean:
  - 또
  - 그 뒤에 다시
  lexicon: N/A
  rationale: 반복 전환을 나타내는 접속 표현으로, English POB의 'again'을 자연스럽게 옮기되 서사 흐름을 해치지 않도록 했습니다.
- source_word: ርኢኩ
  english_pob_choice: I saw
  chosen_korean: 나는 보았습니다
  alternatives_korean:
  - 내가 보았습니다
  - 보았습니다
  lexicon: N/A
  rationale: 화자의 직접 목격을 분명히 드러내는 1인칭 과거형으로 옮겼습니다.
- source_word: ኖሎት፡ ፲ወ፪ሰዓተ
  english_pob_choice: pasturing for twelve hours
  chosen_korean: 열두 시간 동안 양을 치는 것을
  alternatives_korean:
  - 열두 시간 동안 풀을 뜯기는 것을
  - 열두 시간 동안 방목하는 것을
  lexicon: N/A
  rationale: 목자의 행위를 한국어 서사에서 자연스러운 '양을 치다'로 옮기면서, 시간 표현 '열두 시간 동안'을 보존했습니다.
- source_word: ገብኡ፡ ወመጽኡ፡ ወቦኡ፡ ወአኀዙ
  english_pob_choice: they arrived and entered, and they began
  chosen_korean: 도착하여 들어가서는 … 시작하였습니다
  alternatives_korean:
  - 와서 들어가서 … 시작했습니다
  - 도착하여 들어가며 … 시작했습니다
  lexicon: N/A
  rationale: 연속 동작의 열거를 살리되 한국어 문장에서는 자연스럽게 연결하여 서술했습니다.
- source_word: ሐንጹ
  english_pob_choice: build up
  chosen_korean: 다시 세우기
  alternatives_korean:
  - 세우기
  - 건축하기
  lexicon: N/A
  rationale: 무너진 집을 복구하는 맥락을 반영해 '세우기'를 택했습니다. '다시'는 앞선 파괴 상태를 전제로 한 회복의 뉘앙스를 보강합니다.
theological_decisions:
- issue: 무너진 집의 회복 장면을 어떻게 표현할지
  chosen_reading: 단순한 건축이 아니라 무너진 상태에서의 복구·재건으로 읽어 '다시 세우기'로 번역했습니다.
  alternative_readings:
  - 건축하기
  - 세우기
  rationale: 본문의 대상이 이미 무너진 집이므로, 재건의 의미를 분명히 드러내는 것이 원문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 서사적 회복 이미지
