  - 전력을 다해
  lexicon: Dillmann
  rationale: 총력과 긴박감을 살리면서도 현대 한국어에서 가장 자연스러운 관용으로 옮겼습니다.
- source_word: ለእግዚአ አባግዕ
  english_pob_choice: to the Lord of the sheep
  chosen_korean: 양들의 주님께
  alternatives_korean:
  - 양들의 주인께
  - 양들의 주께
  lexicon: Dillmann
  rationale: 알레고리 속 하나님을 가리키는 호칭이므로 ‘주님’이 권위와 경외를 가장 잘 드러내며, ‘주인’보다 신학적 격이 높습니다.
- source_word: ተበልዑ
  english_pob_choice: were being devoured
  chosen_korean: 먹히고 있었기 때문입니다
  alternatives_korean:
  - 삼켜지고 있었기 때문입니다
  - 잡아먹히고 있었기 때문입니다
  lexicon: Dillmann
  rationale: 포식자의 공격을 나타내는 수동적 피해 상황을 직설적으로 살리되, 한국어에서 가장 자연스러운 동적 표현을 택했습니다.
- source_word: አራዊተ ገዳም
  english_pob_choice: all the wild beasts
  chosen_korean: 모든 들짐승
  alternatives_korean:
  - 모든 야수
  - 모든 광야의 짐승
  lexicon: Dillmann
  rationale: POB의 ‘wild beasts’에 맞춰 ‘들짐승’으로 옮기면 포식적 이미지가 살아나고, ገዳም의 열린 들판/광야 뉘앙스도 무리 없이 담깁니다.
theological_decisions:
- issue: ‘Lord of the sheep’의 호칭을 한국어에서 어떻게 보존할지
  chosen_reading: ‘양들의 주님’으로 옮겨, 비유적이지만 하나님을 지칭하는 상위 호칭임을 유지했습니다.
  alternative_readings:
  - ‘양들의 주인’으로 평이화
  - ‘양들의 주’로 축약
  rationale: 이 구절은 목자-양 알레고리 안에서 하나님을 부르는 표현이므로, 단순 소유주보다 통치권과 경배의 뉘앙스가 있는 ‘주님’이 더 충실합니다.
  doctrine_reference: 원문 우선, 호칭은 번역하되 신적 존칭의 기능을 보존
- issue: ‘먹히다’ 표현의 잔혹성 유지
  chosen_reading: ‘먹히고 있었다’로 하여 양들이 실제로 포식당하는 장면을 완화하지 않았습니다.
  alternative_readings:
  - ‘해를 입고 있었다’로 완화
  - ‘공격받고 있었다’로 일반화
  rationale: 본문은 단순한 위협이 아니라 이미 진행 중인 포식의 현실을 말하므로, 그 긴박함과 폭력성을 직접적으로 드러내는 편이 원문에 충실합니다.
  doctrine_reference: 서사적 이미지와 알레고리의 강도를 보존
