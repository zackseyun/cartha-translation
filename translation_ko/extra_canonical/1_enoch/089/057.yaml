base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
  footnotes:
  - marker: a
    text: Or 'by all the wild beasts.' The Ge'ez expression can evoke beasts of the open country or wilderness; the image is of predatory animals attacking the flock.
    reason: lexical_alternative
  - marker: b
    text: Or 'beasts of the field'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 온 힘을 다하여 외치기 시작했고, 양들의 주님[a]께 부르짖어 양들이 모든 들짐승[b]에게 잡아먹히고 있음을 그분께 아뢰었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘양들의 주’입니다. 이 환상적 알레고리에서 양 떼의 주권자를 가리키는 호칭입니다.
    reason: terminology
  - marker: b
    text: 또는 ‘모든 들의 짐승’, ‘모든 광야의 짐승’. 게에즈어 표현은 야생의 짐승들이라는 뜻을 지니며, 여기서는 양 떼를 잡아먹는 포식적 형상을 나타냅니다.
    reason: lexical_alternative
