base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
  footnotes:
  - marker: a
    text: Or 'by all the wild beasts.' The Ge'ez expression can evoke beasts of the open country or wilderness; the image is of predatory animals attacking the flock.
    reason: lexical_alternative
  - marker: b
    text: Or 'beasts of the field'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 온 힘을 다해 외치기 시작했고, 양들의 주님께 불러 그에게 양들에 관하여 알렸습니다. 그들이 모든 들짐승에게 먹히고 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들짐승’은 ‘wild beasts’에 해당하며, 알레고리 안에서는 목자 없는 양 떼를 노리는 포식 세력을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘양들의 주님’은 알레고리 속에서 양 떼의 주권자이신 하나님을 가리키는 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: አኃዝኩ እጽራሕ
  english_pob_choice: I began to cry out
  chosen_korean: 외치기 시작했고
  alternatives_korean:
  - 소리치기 시작했고
  - 부르짖기 시작했고
  lexicon: Dillmann
  rationale: 두 동사의 결합을 한국어에서는 시작상으로 풀어, 단순한 ‘외침’이 아니라 절박한 호소의 개시를 자연스럽게 드러냈습니다.
- source_word: በኵሉ ኃይልየ
  english_pob_choice: with all my strength
  chosen_korean: 온 힘을 다해
  alternatives_korean:
