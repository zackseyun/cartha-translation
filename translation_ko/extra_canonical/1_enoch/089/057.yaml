  lexicon: Dillmann
  rationale: POB의 ‘wild beasts’에 맞춰 ‘들짐승’으로 옮기면 포식적 이미지가 살아나고, ገዳም의 열린 들판/광야 뉘앙스도 무리 없이 담깁니다.
theological_decisions:
- issue: ‘Lord of the sheep’의 호칭을 한국어에서 어떻게 보존할지
  chosen_reading: ‘양들의 주님’으로 옮겨, 비유적이지만 하나님을 지칭하는 상위 호칭임을 유지했습니다.
  alternative_readings:
  - ‘양들의 주인’으로 평이화
  - ‘양들의 주’로 축약
  rationale: 이 구절은 목자-양 알레고리 안에서 하나님을 부르는 표현이므로, 단순 소유주보다 통치권과 경배의 뉘앙스가 있는 ‘주님’이 더 충실합니다.
  doctrine_reference: 원문 우선, 호칭은 번역하되 신적 존칭의 기능을 보존
- issue: ‘먹히다’ 표현의 잔혹성 유지
  chosen_reading: ‘먹히고 있었다’로 하여 양들이 실제로 포식당하는 장면을 완화하지 않았습니다.
  alternative_readings:
  - ‘해를 입고 있었다’로 완화
  - ‘공격받고 있었다’로 일반화
  rationale: 본문은 단순한 위협이 아니라 이미 진행 중인 포식의 현실을 말하므로, 그 긴박함과 폭력성을 직접적으로 드러내는 편이 원문에 충실합니다.
  doctrine_reference: 서사적 이미지와 알레고리의 강도를 보존
