theological_decisions:
- issue: 심판적 ‘넘김’의 행위 주체
  chosen_reading: 하나님이 보호를 거두어 적대적 짐승들에게 넘기시는 심판적 행위로 읽었습니다.
  alternative_readings:
  - 단순히 버려진 상태의 묘사로 읽을 수 있습니다.
  - 알레고리로서 역사적 민족들을 상징하는 배경을 더 노출할 수 있습니다.
  rationale: 원문의 동사는 적극적 인도/양도 의미를 가지므로, 심판적 방임이 아니라 심판적 ‘넘기심’으로 남겨 두는 편이 서술의 긴장을 보존합니다.
  doctrine_reference: apocalyptic judgment imagery; preserve agency without resolving allegory
- issue: 짐승 목록의 번역 표준
  chosen_reading: ‘표범들’과 ‘하이에나들’을 채택해, 원문의 동물군을 현대 한국어에서 식별 가능한 이름으로 제시했습니다.
  alternative_readings:
  - ‘호랑이들’로 옮길 수 있습니다.
  - ‘자칼들’로 옮길 수 있습니다.
  rationale: 게에즈 어휘와 POB 주석을 따르면 አንምርት는 호랑이가 아니라 표범/표범류이며, አጽዕብት는 하이에나가 기본값입니다. 따라서 전통적·관습적 상상보다 원어 기반 식별을 우선했습니다.
  doctrine_reference: source-language zoological referents
