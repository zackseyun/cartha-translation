base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/055.yaml
  text: And he gave them over into the hand of the lions and the leopards and the wolves and the hyenas[a], and into the hand of the foxes, and to all the wild beasts[e][d][c][b]; and those beasts of the field began to tear apart those sheep.
  footnotes:
  - marker: a
    text: The animal named here is uncertain; the Ge'ez term may refer to a large feline such as a leopard or panther rather than a tiger in the modern zoological sense.
    reason: lexical_alternative
  - marker: b
    text: The predator rendered 'hyenas' may alternatively be understood as 'jackals.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the tigers'.
    reason: previous_rendering
  - marker: d
    text: Or 'and over all the wild beasts'.
    reason: previous_rendering
  - marker: e
    text: Or 'those wild beasts began'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들을 사자들과 표범들과 늑대들과 하이에나들[a]의 손에 넘기고, 여우들과 모든 들짐승들에게[b][c][d] 넘기셨습니다. 그러자 들판의 그 짐승들이 그 양들을 찢기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 동물 명칭은 확실하지 않으며, 게에즈어는 현대 동물학의 ‘호랑이’보다 큰 고양잇과 짐승, 곧 표범이나 표범류를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하이에나들’은 ‘자칼들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문의 뒤 구문은 ‘모든 들짐승들’보다 더 구체적으로 ‘들판의 그 짐승들’로 옮길 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘그 들짐승들이 시작했습니다’로 이해할 수도 있습니다.
    reason: previous_rendering
