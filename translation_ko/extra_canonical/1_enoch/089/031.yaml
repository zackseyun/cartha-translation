theological_decisions:
- issue: 동물 상징의 인칭화 여부
  chosen_reading: 마지막 절의 주어를 동물 상징 수준인 ‘그것’으로 유지하지 않고, 한국어에서는 자연스러운 문맥을 위해 ‘그것이’로 원문의 비인칭성을 보존했습니다.
  alternative_readings:
  - 그가 우리 주 앞에 설 수 없었기 때문입니다
  - 그는 우리 주 앞에 설 수 없었습니다
  rationale: 에녹서의 동물 우화 체계를 평이한 인물 서술로 환원하지 않기 위해, 영어 POB의 상징층위를 따라 비인칭 표현을 유지했습니다.
  doctrine_reference: 원문 상징 구조 보존; 해석 과잉 방지
- issue: 괄호 처리된 ‘그들 가운데’ 구절 반영
  chosen_reading: 본문에는 넣되 별도 각주 없이, 문장 내부의 위치 표현으로만 반영했습니다.
  alternative_readings:
  - 괄호를 본문에 그대로 표기
  - 아예 생략
  rationale: 해당 구절은 증인본상 불확실하지만, 영어 POB가 본문에 보존하고 있으므로 한국어도 투명성을 위해 반영하되 과도한 강조는 피했습니다.
  doctrine_reference: 본문 전승의 불확실성 보존
