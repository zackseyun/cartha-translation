base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/031.yaml
  text: And all those feared and trembled before him[a], and they followed after that ram that was with them [that was in their midst][c][b], because it was not able to stand before our Lord and look at him.
  footnotes:
  - marker: a
    text: The clause 'that was in their midst' is bracketed in the source witness and may reflect a secondary or uncertain reading.
    reason: textual_variant
  - marker: b
    text: The phrase rendered 'they begged after him' is difficult in the Ge'ez and could also suggest crying out after him or seeking him concerning the ram.
    reason: lexical_alternative
  - marker: c
    text: Or 'all those said ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 모두는 그 앞에서 두려워하고 떨었으며, 그들 가운데 함께 있던 그 숫양을 뒤따랐습니다[a][b][c]. 그것이 우리 주 앞에 서지도 못하고 그를 바라보지도 못했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 증인에서는 이 구절이 괄호로 처리되어 있어, 보조적이거나 불확실한 읽기일 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 영어 POB의 ‘followed after’는 원 Ge'ez의 방향 동사를 따라간 번역이며, 문맥상 단순 동행보다 뒤따름의 뉘앙스를 살립니다.
    reason: source_note
  - marker: c
    text: 또는 ‘그들 모두가 말한 자들’로도 읽을 수 있습니다.
    reason: previous_rendering
