  text: 또 하늘을 향하여 눈을 들어 보니, 높은 지붕[a]과 그 위에 있는 일곱 물줄기가 보였습니다. 그 물줄기들은 물이 많은 울타리 친 곳[b]으로 흘러들어갔습니다.
  philosophy: optimal-equivalence
  footnotes:
