base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/002.yaml
  text: And again I lifted up my eyes toward heaven[a], and I saw a lofty roof, and seven streams upon it[c][b]; and those streams flowed into an enclosure with much water.
  footnotes:
  - marker: a
    text: The Ge'ez noun rendered 'roof' may also denote a covering or upper structure; the exact architectural image is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'into an enclosed place' may more specifically mean 'into a courtyard' or 'into an enclosure.'
    reason: lexical_alternative
  - marker: c
    text: Or 'into an enclosed place'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다시 하늘을 향해 내 눈을 들어 보니, 높은 지붕이 보였고 그 위에 일곱 시내가 있었으며, 그 시내들은 많은 물이 있는 울타리 안으로 흘러들어갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높은 지붕’은 원문의 ናሕሰ ልዑለ가 가리키는 구조를 다소 넓게 옮긴 것으로, ‘덮개’나 ‘상부 구조’일 가능성도 남아 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘울타리 안’은 원문의 ዐጸድ을 넓게 옮긴 표현으로, ‘뜰’, ‘마당’, ‘울타리 친 공간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
