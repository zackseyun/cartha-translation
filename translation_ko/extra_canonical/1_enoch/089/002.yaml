    reason: lexical_alternative
  - marker: b
    text: ‘울타리 친 곳’은 원문의 ዐጸድ을 넓게 옮긴 표현으로, ‘뜰’, ‘마당’, 또는 ‘둘러싸인 공간’으로도 옮길 수 있습니다.
    reason: lexical_alternative
