  text: And again I saw in the vision, until all the streams withdrew from that lofty roof, and the fissures of the earth were leveled, and other abysses were opened.
translation:
  language: ko
  text: 그리고 다시 나는 환상 가운데에서 보았습니다. 모든 시내가 그 높은 지붕 아래에서 물러날 때까지, 땅의 갈라진 틈들이 평평해지고, 또 다른 깊은 구덩이들이 열렸습니다.
  philosophy: formal
lexical_decisions:
- source_word: በራእይ
  english_pob_choice: in the vision
  chosen_korean: 환상 가운데에서
  alternatives_korean:
  - 환상 속에서
  - 환상으로
  lexicon: vision
  rationale: 시각적 계시 체험을 자연스럽게 드러내되, 단순한 ‘보다’보다 계시적 상황을 분명히 하기 위해 ‘환상 가운데에서’로 옮겼습니다.
- source_word: ሰሰሉ
  english_pob_choice: the streams withdrew
  chosen_korean: 모든 시내가 ... 물러날 때까지
  alternatives_korean:
  - 모든 시내가 ... 사라질 때까지
  - 모든 시내가 ... 말라갈 때까지
  lexicon: streams withdraw
  rationale: POB의 ‘withdrew’를 따라 물이 스스로 물러나는 동적 이미지를 살렸고, 단순 건조보다 원문의 이동감을 유지했습니다.
- source_word: ኵሉ፡ አዕራብት
  english_pob_choice: all the streams
  chosen_korean: 모든 시내
  alternatives_korean:
  - 모든 계곡
  - 모든 개울
  lexicon: streams
  rationale: Geez 어휘와 POB의 ‘streams’를 따라 물줄기 이미지를 유지하면서 한국어에서는 가장 무난한 ‘시내’를 택했습니다.
- source_word: ልዑል፡ ወንቅዐተ፡ ምድር
  english_pob_choice: the fissures of the earth were leveled
  chosen_korean: 땅의 갈라진 틈들이 평평해지고
  alternatives_korean:
  - 땅의 갈라진 틈들이 메워지고
  - 땅의 균열이 고르게 되고
  lexicon: fissures were leveled
  rationale: 원문의 ‘갈라진 틈’과 POB의 ‘leveled’가 주는 지형 정돈 이미지를 함께 반영해, 메워짐보다 표면이 고르게 되는 느낌을 살렸습니다.
- source_word: መዓምቃት
  english_pob_choice: abysses
  chosen_korean: 깊은 구덩이들
  alternatives_korean:
  - 심연들
  - 깊은 심연들
  lexicon: abysses
  rationale: 종교적-우주론적 ‘심연’도 가능하지만, 본문 병행 구조상 새로 열린 지형적 깊이를 우선해 ‘깊은 구덩이들’로 옮겼습니다.
theological_decisions:
- issue: 환상 체험의 서술 방식
  chosen_reading: 화자가 실제 계시 환상 속에서 일련의 지형 변형을 목격하는 서술로 처리했습니다.
  alternative_readings:
  - 상징적 예언 설명으로 완화
  - 단순 과거 관찰문으로 처리
  rationale: 원문과 POB 모두 시각적 계시 체험을 전제로 하므로, 서술을 평이한 관찰로 낮추지 않고 환상 서술을 분명히 했습니다.
  doctrine_reference: apocalyptic narration
