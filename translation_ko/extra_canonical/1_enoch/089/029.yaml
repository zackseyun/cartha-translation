lexical_decisions:
- source_word: ወዐርገ፡ ዝኩ፡ በግዕ፡ ዲበ፡ ድማኃ፡ ለዝኩ፡ ኰኵሕ፡ ነዋሕ፡
  english_pob_choice: that sheep went up onto the summit of that lofty rock
  chosen_korean: 그 양이 그 높은 바위의 꼭대기로 올라갔고
  alternatives_korean:
  - 그 양이 그 높은 바위 위로 올라갔고
  - 그 양이 그 높은 바위의 정상으로 올라갔고
  lexicon: 양, 꼭대기, 높다
  rationale: 게으즈 원문은 ‘그 양’과 ‘바위의 꼭대기/정상’의 상승 동작을 분명히 말하므로, 영어 POB의 ‘lofty’는 형용사적 고급 어휘보다 자연스러운 ‘높은’으로 옮기고 ‘꼭대기’로 위치성을 살렸습니다.
- source_word: ወእግዚኦሙ፡ ለአባግዕ፡
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주님
  alternatives_korean:
  - 양들의 주인
  - 양들의 주
  lexicon: 주님, 양들
  rationale: 소유격 구조를 그대로 살려 ‘양들의 주님’으로 옮겨, 단순한 소유주가 아니라 양들을 다스리는 권위자를 드러냈습니다.
- source_word: ፈነዎ፡ ኀቤሆሙ።
  english_pob_choice: sent him to them
  chosen_korean: 그를 그들에게 보내셨습니다
  alternatives_korean:
  - 그를 그들에게 파견하셨습니다
  - 그를 그들 앞으로 보내셨습니다
  lexicon: 보내다, 그들에게
  rationale: 원문 동사는 분명한 파송/보내심을 뜻하므로, 문맥상 가장 직접적인 ‘보내셨습니다’를 사용했습니다.
