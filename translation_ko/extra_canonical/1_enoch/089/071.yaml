base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/071.yaml
  text: And the book was read before the Lord of the sheep[a], and he took the book from his hand and read it, and sealed it[c][b], and set it down.
  footnotes:
  - marker: a
    text: The passive verb rendered 'was opened' is somewhat uncertain in the OCR witness; 'was read' or 'was revealed' are possible, but the following clause already states explicitly that the book was read, so 'was opened' best fits the sequence.
    reason: lexical_alternative
  - marker: b
    text: The pronoun in 'from his hand' is ambiguous in this witness; the text does not explicitly restate whose hand held the book.
    reason: alternative_reading
  - marker: c
    text: Or 'And the book was opened before the Lord of the sheep'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 책이 양 떼의 주님 앞에서 낭독되었습니다[a]. 그분께서는 그 책을 그의 손에서 가져다가 읽으시고, 봉인하신 뒤 내려놓으셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈어 사본의 이 수동 동사는 판독상 다소 불확실합니다. 여기서는 뒤이어 책을 읽는 장면과 동사의 일반적 의미에 따라 ‘낭독되었습니다’로 옮겼습니다. ‘열렸습니다’ 또는 ‘드러났습니다’로 이해할 가능성도 제기됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 손’이 누구의 손을 가리키는지는 본문에서 다시 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ተነበ
  english_pob_choice: was read
  chosen_korean: 읽혔습니다
  alternatives_korean:
  - 열렸습니다
  - 낭독되었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈 본문의 동사와 영어 POB의 수정본은 ‘읽다’ 계열의 의미를 지지합니다. 앞뒤에 다시 ‘읽었다’가 나오므로, 첫 동사도 읽힘으로 옮겨 서술의 반복 구조를 살렸습니다.
- source_word: እግዚአ አባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양 떼의 주님
  alternatives_korean:
  - 양의 주인
  - 양 떼의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 동물 환상에서 하나님을 가리키는 호칭이므로, 위엄을 살리는 ‘주님’을 택하되 원문 은유도 드러나게 ‘양 떼’를 유지했습니다.
- source_word: ኀተማ
  english_pob_choice: sealed
  chosen_korean: 인을 찍어 놓은
  alternatives_korean:
  - 봉인한
  - 봉했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문서에 도장을 찍어 봉하는 법정·기록 장면의 이미지를 살리기 위해 ‘인을 찍다’로 옮겼습니다. 단순히 닫는 의미보다 문서의 인증·보호 뉘앙스를 더 잘 드러냅니다.
- source_word: አንበረ
  english_pob_choice: set it down
  chosen_korean: 내려놓았습니다
  alternatives_korean:
  - 놓았습니다
  - 두었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 읽고 봉인한 뒤 책을 다시 놓는 구체적 동작을 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 하나님 호칭을 동물 상징 속에서 어떻게 옮길지
  chosen_reading: ‘양 떼의 주님’으로 옮겨, 상징을 풀어버리지 않으면서도 하나님을 가리키는 존칭을 유지했습니다.
  alternative_readings:
  - ‘양 떼의 주인’
  - ‘양의 주님’
  rationale: 이 장면은 단순한 목자 이미지가 아니라 묵시문학적 칭호이므로, 평이한 서술로 낮추지 않고 존칭과 은유를 함께 보존하는 쪽이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: Apocalyptic title preservation; avoid flattening visionary metaphor into generic prose.
