  - 집결하여
  - 모아져
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 물들이 한데 모여 불어나는 장면을 자연스럽게 전달하면서도, 축적·집합의 이미지를 보존하기 위해 ‘함께 모여’를 선택했습니다.
- source_word: ከመ ፍጥረቱ ፍጡነ
