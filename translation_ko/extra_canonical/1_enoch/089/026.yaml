translation:
  language: ko
  text: 그들이 양들의 주를 보았을 때, 그의 얼굴 앞에서 도망치려고 들어갔습니다[a]. 그 물길이 한데 모여, 본래의 성질대로 급해졌고, 물로 가득 차서 솟아올라 그 늑대들을 덮었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘들어왔습니다.’ 원문은 ‘들어가다’라는 이동 동사를 사용하지만, 어디로 들어갔는지는 밝히지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주
  alternatives_korean:
  - 양들의 주인
  - 양들의 주님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 알레고리의 반복 모티프를 살리면서도 지배적 소유 의미를 드러내기 위해 ‘주’를 기본으로 두었습니다. ‘주님’은 신앙 공동체적 어감이 강해 여기서는 다소 해석적이므로 ‘주’로 옮겼습니다.
- source_word: ዝኩ ዐይገ ማይ
  english_pob_choice: that watercourse
  chosen_korean: 그 물길
  alternatives_korean:
  - 그 물줄기
  - 그 개울길
  - 그 수로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈어가 특정 지형을 과도하게 한정하지 않으므로, 흐름의 통로와 물의 움직임을 함께 드러내는 ‘물길’을 택했습니다.
- source_word: ተጋብአ
  english_pob_choice: gathered together
  chosen_korean: 함께 모여
  alternatives_korean:
