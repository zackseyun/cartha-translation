theological_decisions:
- issue: ‘Lord of the sheep’의 호칭 처리
  chosen_reading: 양들의 주
  alternative_readings:
  - 양들의 주님
  - 양들의 주인
  rationale: 이 본문은 알레고리적 동물 서사 안에서 신적 통치자를 가리키므로, 예배적 호칭인 ‘주님’보다 서사적·상징적 호칭인 ‘주’를 택해 이미지와 위계를 함께 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 알레고리적 서사 보존
- issue: ‘from before his face’의 존재-도피 표현
  chosen_reading: 그의 얼굴 앞에서 도망쳤습니다
  alternative_readings:
  - 그의 앞에서 도망쳤습니다
  - 그의 임재 앞에서 도망쳤습니다
  rationale: ‘얼굴 앞에서’는 셈어적 관용구로서 대상의 직접적 현존 앞에서의 공포와 도주를 드러냅니다. 이를 ‘임재’로 풀면 문학적 긴장이 약해질 수 있어 더 직접적으로 옮겼습니다.
  doctrine_reference: 예언·묵시 문체의 직유와 관용구 보존
