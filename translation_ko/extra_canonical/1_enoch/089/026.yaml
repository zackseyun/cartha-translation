  yaml_path: translation/extra_canonical/1_enoch/089/026.yaml
  text: And when they saw the Lord of the sheep, And when they saw the Lord of the sheep, they turned back so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves. so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves.
  footnotes:
  - marker: a
    text: Or 'that channel of water' or 'that torrent-bed'; the Ge'ez term likely refers to a stream-course that suddenly swells.
    reason: lexical_alternative
  - marker: b
    text: Or 'rose up to cover those wolves.' The final phrase may refer either to the flood reaching the wolves' covering/shelter or to the waters covering the wolves themselves.
    reason: alternative_reading
  - marker: c
    text: Or 'they entered'.
    reason: previous_rendering
  - marker: d
    text: Or 'as far as the covering of those wolves'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 양들의 주를 보자, 그의 얼굴 앞에서 도망쳤습니다. 그때 그 물길이 함께 모여, 그 본성대로 빠르게 되었고, 물로 가득 차서 올라와 그 늑대들을 덮었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주
  alternatives_korean:
  - 양들의 주인
  - 양들의 주님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 알레고리의 반복 모티프를 살리면서도 지배적 소유 의미를 드러내기 위해 ‘주’를 기본으로 두었습니다. ‘주님’은 신앙 공동체적 어감이 강해 여기서는 다소 해석적이므로 ‘주’로 옮겼습니다.
- source_word: ዝኩ ዐይገ ማይ
  english_pob_choice: that watercourse
  chosen_korean: 그 물길
  alternatives_korean:
  - 그 물줄기
  - 그 개울길
  - 그 수로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈어가 특정 지형을 과도하게 한정하지 않으므로, 흐름의 통로와 물의 움직임을 함께 드러내는 ‘물길’을 택했습니다.
- source_word: ተጋብአ
  english_pob_choice: gathered together
  chosen_korean: 함께 모여
  alternatives_korean:
  - 모여들어
  - 집결하여
  - 모아져
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 물들이 한데 모여 불어나는 장면을 자연스럽게 전달하면서도, 축적·집합의 이미지를 보존하기 위해 ‘함께 모여’를 선택했습니다.
- source_word: ከመ ፍጥረቱ ፍጡነ
  english_pob_choice: swift according to its nature
  chosen_korean: 그 본성대로 빠르게 되었고
  alternatives_korean:
  - 본래 성질대로 급해졌고
  - 자연스러운 성질에 따라 빨라졌고
  - 그 본연의 성격대로 신속해졌고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 다소 낯설지만, ‘본성’과 ‘빠르게 되다’를 유지해 물길이 원래 성격에 따라 급류가 되는 뜻을 살렸습니다.
- source_word: ተላዐለ እስከ ከደኖሙ ለእልኩ አዝእብት
  english_pob_choice: rose up until it covered those wolves
  chosen_korean: 올라와 그 늑대들을 덮었습니다
  alternatives_korean:
  - 올라와 그 늑대들을 덮을 때까지 이르렀습니다
  - 올라와 그 늑대들을 덮었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 문법 판단에 따라 ከደኖሙ를 ‘덮었습니다’로 직접 옮겼고, 물의 상승과 덮음의 결과를 간결하게 표현했습니다.
theological_decisions:
- issue: ‘Lord of the sheep’의 호칭 처리
  chosen_reading: 양들의 주
  alternative_readings:
  - 양들의 주님
  - 양들의 주인
  rationale: 이 본문은 알레고리적 동물 서사 안에서 신적 통치자를 가리키므로, 예배적 호칭인 ‘주님’보다 서사적·상징적 호칭인 ‘주’를 택해 이미지와 위계를 함께 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 알레고리적 서사 보존
- issue: ‘from before his face’의 존재-도피 표현
  chosen_reading: 그의 얼굴 앞에서 도망쳤습니다
  alternative_readings:
  - 그의 앞에서 도망쳤습니다
  - 그의 임재 앞에서 도망쳤습니다
  rationale: ‘얼굴 앞에서’는 셈어적 관용구로서 대상의 직접적 현존 앞에서의 공포와 도주를 드러냅니다. 이를 ‘임재’로 풀면 문학적 긴장이 약해질 수 있어 더 직접적으로 옮겼습니다.
  doctrine_reference: 예언·묵시 문체의 직유와 관용구 보존
