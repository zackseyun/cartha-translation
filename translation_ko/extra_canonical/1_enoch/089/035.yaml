  chosen_korean: 그들을 죽이기 시작했습니다
  alternatives_korean:
  - 그들을 죽이려 하기 시작했습니다
  - 그들을 죽이기 시작하였습니다
  lexicon: L4
  rationale: 게에즈의 개시적 폭력 동작을 그대로 살려, 과정이 시작되었음을 분명하게 표현했습니다.
- source_word: ውእቱ በግዕ ... አግብኦሙ
  english_pob_choice: that ram made those sheep ... return
