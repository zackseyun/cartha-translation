  lexicon: L2
  rationale: 동반·인도 동작을 살리되, 한국어에서 자연스러운 서술인 ‘데리고 와서’로 옮겼습니다.
- source_word: እለ ስሕቱ
  english_pob_choice: those sheep that had gone astray
  chosen_korean: 길을 잃고 헤매던 그 양들
