base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/035.yaml
  text: And that ram took other sheep with him[a], and came upon those sheep that had gone astray; and he began to kill them. And the sheep were afraid before him, and that ram made those sheep that had gone astray return[b], and they went back into their folds.
  footnotes:
  - marker: a
    text: The phrase rendered 'he began to kill them' may also be understood more woodenly as 'he seized them to kill them'; the Ge'ez construction emphasizes the onset of violent action.
    reason: lexical_alternative
  - marker: b
    text: Or 'another sheep'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 숫양은 다른 양들을 데리고 와서, 길을 잃고 헤매던 그 양들 위에 이르러 그들을 죽이기 시작했습니다. 양들은 그 앞에서 두려워했고, 그 숫양은 길을 잃었던 그 양들이 돌아오게 하여, 그들이 자기 우리로 돌아가게 했습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘죽이기 시작했습니다’는 게에즈의 개시적 폭력 동작을 살린 번역이며, 더 문자적으로는 ‘죽이려고 붙잡기 시작했습니다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아오게 하여’는 원문의 사역성을 반영한 번역입니다.
    reason: source_note
