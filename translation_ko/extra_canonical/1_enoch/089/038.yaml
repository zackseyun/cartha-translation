  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 수동적 분리 의미를 살리기 위해 ‘분리되어’로 옮겼고, 행위 주체를 덧붙이지 않았습니다.
- source_word: ወሰከበ
  english_pob_choice: and lay down
  chosen_korean: 누웠습니다
  alternatives_korean:
  - 그리고 잠들었습니다
