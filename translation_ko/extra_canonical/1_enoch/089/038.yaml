  rationale: 게에즈 원문은 환시 도입어가 아니라 지시어 ዝኩ(“그/그것”)로 시작하므로, ‘그리고 그 양은’으로 시작해 주어를 유지했습니다.
- source_word: ዘኮነ ብእሴ
