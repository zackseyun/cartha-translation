  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 자체는 ‘눕다’가 기본이므로 본문에서는 비유적 죽음을 해석해 적지 않고, 이미지 자체를 유지했습니다.
- source_word: ወጸርኁ ዲቤሁ
