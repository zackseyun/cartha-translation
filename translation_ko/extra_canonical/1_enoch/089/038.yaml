base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/038.yaml
  text: And that sheep who was leading them[a], who had become a man, was separated from them and lay down[c][b]; and all the sheep sought him and cried out over him with a great cry.
  footnotes:
  - marker: a
    text: '''Lay down'' likely signals the death of the sheep-leader within the vision, but the text expresses it through the image itself.'
    reason: lexical_alternative
  - marker: b
    text: The sheep 'which had become a man' is a symbolic transformation within the dream vision, not a shift out of the allegorical register.
    reason: cultural_note
  - marker: c
    text: Or 'And I saw that the sheep which had become a man, the one who was leading them,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들을 이끌던 그 양은 사람이 되었고[a], 그들에게서 분리되어 누웠습니다[b]. 모든 양이 그를 찾아다니며 그를 두고 크게 울부짖었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람이 되었습니다’는 꿈 환시 안에서 일어나는 상징적 변화를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘누웠습니다’는 문자적 이미지 표현을 보존한 것으로, 문맥상 그 양의 죽음을 암시할 수 있습니다.
    reason: lexical_alternative
