  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘위에서/위에’에 해당하는 전치사 의미를 살리면서, 집단적 애도와 외침이 함께 있는 장면을 한국어로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 양-사람 변형과 ‘누움’의 의미를 본문에서 어디까지 명시할 것인가
  chosen_reading: 환시의 상징성을 보존하면서, 본문에는 ‘사람으로 변하였는데… 누웠습니다’까지만 적고 죽음을 명시하지 않았습니다.
  alternative_readings:
