  - ‘사람이 되어 잠들었습니다’로 완화
  rationale: 원문과 영어 POB 모두 상징적 이미지의 긴장을 남겨 두며, 독자가 문맥으로 의미를 추론하게 합니다. 본문에서 죽음을 단정하면 시각적 환시의 힘이 약해집니다.
  doctrine_reference: apocalyptic symbolic register preservation
