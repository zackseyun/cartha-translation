  to: 그리고 그들을 이끌던 그 양은 사람이 되었고[a], 그들에게서 분리되어 누웠습니다[b]. 모든 양이 그를 찾아다니며 그를 두고 크게 울부짖었습니다.
  rationale: 'The revision retains the source order and symbolic imagery: the leading sheep becomes a man, is separated from the flock, and lies down. It corrects the Korean rendering of the flock’s cry from a physical-sounding ‘그 위에서’ to the natural and contextually accurate ‘그를 두고.’ The unsupported, incomplete alternative-translation note is removed, and the symbolic-transformation note is made interpretively neutral.'
