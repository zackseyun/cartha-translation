theological_decisions:
- issue: 양들의 주의 호칭
  chosen_reading: ‘양들의 주께서’로 번역해 비유적 소유자이면서도 주권적 통치자를 드러냈습니다.
  alternative_readings:
  - 양들의 주인께서
  - 양들의 주님께서
  rationale: 이 표현은 단순한 목축 소유가 아니라 알레고리 전체를 주재하는 권위를 지니므로, 한국어에서도 ‘주’의 신학적 긴장을 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: Translate titles; preserve theological tension rather than reduce imagery.
