base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/042.yaml
  text: And dogs and foxes and wild boars of the field began to devour those sheep[b][a], until the Lord of the sheep raised up from among them one ram to lead them.
  footnotes:
  - marker: a
    text: 'The clause in brackets in the OCR suggests a difficult or variant reading around ''one ram.'' The sense of the verse is clear: a single male sheep is raised up from among the flock as leader.'
    reason: textual_variant
  - marker: b
    text: The animal term rendered 'foxes' may in some contexts overlap with a broader scavenger-predator sense, such as 'jackals.'
    reason: lexical_alternative
translation:
  language: ko
  text: 개들과 여우들[b]과 들판의 들돼지들이 그 양들을 집어삼키기 시작하여, 양들의 주께서 그들 가운데서 그들을 이끌 한 숫양[a]을 세우실 때까지 계속되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 대괄호 표기는 ‘한 숫양’과 관련하여 난독 또는 이문의 가능성을 시사합니다. 그러나 문맥상 양 떼 가운데서 한 숫양이 세워져 그들을 이끈다는 뜻은 분명합니다.
    reason: textual_variant
  - marker: b
    text: ‘여우들’로 옮긴 동물어는 문맥에 따라 자칼을 포함하는 더 넓은 여우과·청소성 포식동물을 가리킬 수도 있습니다.
    reason: lexical_alternative
