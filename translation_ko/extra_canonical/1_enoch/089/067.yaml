base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/067.yaml
  text: And I grieved greatly because of the tower[a], for that house of the sheep had been torn down[e][d][c][b]; and from among them I was not able to see whether those sheep entered that house.
  footnotes:
  - marker: a
    text: The Ge'ez imagery moves between an 'enclosure' and a 'house of the sheep.' The translation preserves both rather than reducing them to a single term such as 'sheepfold.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'had been cut away' may also be understood more generally as 'had been destroyed' or 'removed.'
    reason: lexical_alternative
  - marker: c
    text: The final clause is difficult. It may mean either that the seer could not see those sheep at all, or specifically could not see whether they entered into that house.
    reason: alternative_reading
  - marker: d
    text: Or 'that enclosure'.
    reason: previous_rendering
  - marker: e
    text: Or 'had been cut away'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 그 우리 때문에 몹시 슬퍼했습니다[a]. 양들의 그 집이 허물어졌기 때문입니다[b][d][e]. 그리고 나는 그들 가운데서 그 양들이 그 집에 들어가는지를 볼 수 없었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어는 여기서 ‘우리’ 또는 ‘울타리 친 곳’을 뜻하는 표현을 쓰고, 이어서 ‘양들의 집’이라는 이미지를 사용합니다. 두 이미지를 하나의 말로 평탄화하지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: 건물에 쓰인 ተከርየ는 단순한 소실보다 헐리거나 무너진 파괴 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 어렵습니다. ‘그 양들이 전혀 보이지 않았다’는 뜻일 수도 있고, 특별히 그들이 그 집에 들어가는지를 볼 수 없었다는 뜻일 수도 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘헐렸습니다’.
    reason: previous_rendering
  - marker: e
    text: 또는 ‘무너졌습니다’.
    reason: previous_rendering
