theological_decisions:
- issue: ‘탑’과 ‘양들의 집’의 관계를 어떻게 처리할지
  chosen_reading: 본문은 ‘탑’ 때문에 슬퍼한 이유를 밝히고, 이어지는 ‘양들의 집’ 이미지는 그대로 유지했습니다.
  alternative_readings:
  - ‘탑’을 생략하거나 배경화하기
  - ‘양우리’로 평탄화하기
  rationale: 원문과 POB가 함께 보여 주는 상징 구조를 약화시키지 않기 위해, 이미지들을 해석적으로 합치지 않고 병치했습니다.
  doctrine_reference: 상징어의 원형 보존; 원문 이미지의 긴장 유지
- issue: 마지막 절의 인식 불가능성 표현
  chosen_reading: ‘볼 수 없었던 것은… 여부였습니다’로 옮겨, 실제로 보지 못했는지 혹은 들어갔는지 판별하지 못했는지의 모호성을 유지했습니다.
  alternative_readings:
  - ‘보지 못했습니다’로 단순화하기
  - ‘들어갔는지 알 수 없었습니다’로 해석하기
  rationale: POB가 명시한 난해성을 한국어에서도 지워 버리지 않기 위해, 관찰의 한계와 판단 보류를 함께 남겼습니다.
  doctrine_reference: 원문 난해성 보존; 해석 과잉 방지
