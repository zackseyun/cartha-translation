base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/016.yaml
  text: And a sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness[a], and I saw the sheep as they lamented and cried out and petitioned their Lord with all their strength, until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling[d][c][b], and he came to them and saw them.
  footnotes:
  - marker: a
    text: The phrase rendered 'passed into the wild asses of the wilderness' is textually and syntactically difficult. It likely refers to the sheep moving into the region or company of another animal group within the vision rather than a simple landscape detail.
    reason: textual_variant
  - marker: b
    text: Or 'in response to the sheep's voice from their great outcry.' The clause after 'came down' is compressed in the Ge'ez.
    reason: lexical_alternative
  - marker: c
    text: Or 'And the sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness'.
    reason: previous_rendering
  - marker: d
    text: Or 'from their loud crying'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 늑대들에게서 구원받은 한 양이 도망쳐 광야의 들나귀들 가운데로 들어갔습니다[a]. 내가 보니, 그 양들이 한탄하며 부르짖고 온 힘을 다하여 그들의 주님께 간구하였습니다. 그러자 양들의 주님께서 양들의 소리에 응답하여 당신의 높은 거처에서 내려오셔서[b] 그들에게 이르러 그들을 보셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 첫 번째 ‘양’을 단수로, 뒤의 ‘양들’을 복수로 제시합니다. 또한 ‘광야의 들나귀들 가운데로’라는 표현은 구문과 의미가 난해하며, 환상 속 다른 동물 집단이나 그 영역으로 들어감을 가리키는 것으로 보입니다.
    reason: source_note
  - marker: b
    text: 게에즈어 እምጽርኁ ልዑል은 ‘그분의 높은 거처에서’로 이해하는 것이 문맥과 어휘에 가장 잘 맞습니다. 양들의 소리는 주님이 내려오시는 출발 장소가 아니라 그 응답의 계기입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  english_pob_choice: a sheep
  chosen_korean: 한 양
  alternatives_korean:
  - 그 양들
  - 한 마리 양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 원문은 처음 대상을 단수로 제시하므로, 집합적 복수보다 단수성을 살린 ‘한 양’이 본문 구조와 알레고리를 더 정확히 반영합니다.
- source_word: ኀለፈ ውስተ አእዱገ ገዳም
  english_pob_choice: passed into the wild asses of the wilderness
  chosen_korean: 광야의 들나귀들 가운데로 들어갔습니다
  alternatives_korean:
  - 광야의 들나귀들 속으로 들어갔습니다
  - 광야의 들나귀들 사이로 지나갔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 주석이 지적하듯 이 구절은 단순한 지리 설명이 아니라 다른 동물 집단으로의 이동을 가리키는 어려운 표현이므로, ‘들어갔습니다’로 이동의 방향을 살리면서 동물군 이미지를 유지했습니다.
- source_word: ይስእልዎ ለእግዚኦሙ
  english_pob_choice: petitioned their Lord
  chosen_korean: 그들의 주님께 간구하였습니다
  alternatives_korean:
  - 그들의 주님께 청하였습니다
  - 그들의 주님께 탄원하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 위기 속의 절박한 요청이므로 단순한 요청보다 강한 ‘간구하다’가 원문의 뉘앙스를 더 잘 전달합니다.
- source_word: እግዚአ አባግዕ
  english_pob_choice: Lord of the sheep
  chosen_korean: 그 양들의 주님
  alternatives_korean:
  - 양들의 주님
  - 양들의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 칭호는 『동물 묵시』의 반복되는 신적 표지이므로, 소유격을 살린 ‘그 양들의 주님’으로 번역해 상징 체계를 유지했습니다.
- source_word: እምጽርኁ ልዑል
  english_pob_choice: from his lofty dwelling
  chosen_korean: 그분의 높은 거처에서
  alternatives_korean:
  - 그분의 높은 거실에서
  - 그분의 높은 궁전에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 ጽርሕ은 ‘거처/방/전실’ 계열의 뜻을 가지며, ልዑል은 그것의 높음을 나타내므로, 문맥에 맞는 중립적 표현인 ‘높은 거처’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 강림을 나타내는 동작 표현
  chosen_reading: ‘내려오셔서’로 번역해, 하늘의 거처에서 양들의 부르짖음에 응답하여 강림하시는 장면성을 살렸습니다.
  alternative_readings:
  - ‘내려오셨습니다’
  - ‘강림하셨습니다’
  rationale: 본문은 단순한 이동이 아니라 하늘-땅 축을 드러내는 신적 응답 장면이므로, 과도하게 교회적이거나 추상적인 표현보다 서사적 강림을 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 서사적 신현/강림의 표지를 보존
