theological_decisions:
- issue: 목자들의 행위가 단순한 실수가 아니라 위임 범위를 넘는 파괴라는 점
  chosen_reading: 목자들은 어떤 제한된 위임을 받았지만, 그 한계를 넘어 양떼를 파괴하고 있습니다.
  alternative_readings:
  - 단순히 의무를 소홀히 한 것으로 볼 수 있습니다
  - 숫자상 과잉만을 뜻하는 표현으로 볼 수 있습니다
  rationale: ‘내게 명한 것보다 더 많이’와 파괴 동사가 함께 있어, 단순한 부주의보다 책임 있는 과잉과 남용이 강조됩니다.
  doctrine_reference: 해석적 긴장을 보존하고, 책임의 범위를 본문이 스스로 규정하도록 둡니다.
