base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/061.yaml
  text: And he called to another and said to him[a], “Take note and see all that the shepherds are doing to these sheep[c][b]; for they are destroying among them more than I commanded them.”
  footnotes:
  - marker: a
    text: Or 'Pay attention' for the imperative rendered 'Take note'; the Ge'ez likely carries the sense of directing one's mind or heart to careful observation.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'more than I commanded them' implies that the shepherds had received a limited charge but went beyond it.
    reason: cross_reference
  - marker: c
    text: Or 'destroying among them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 또 다른 이를 불러 그에게 말하였습니다. “주의 깊게 살피고, 목자들이 이 양들에게 하고 있는 모든 일을 보십시오. 그들이 그 양들 가운데서 내가 그들에게 명한 것보다 더 많은 양을 멸하고 있기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주의 깊게 살피고 보십시오’는 원문의 관용적 명령을 살려, 단순히 눈으로 보는 것보다 마음과 주의를 기울여 관찰하라는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 양들 가운데서’는 ‘그 양들 중에서’라는 부분적 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이 양들에게’는 목자들이 행하는 일의 대상을 가리킵니다. 문맥상 해로운 행위이지만, 전치사의 넓은 뜻을 보존하여 ‘대하여’나 ‘맞서’로 한정하지 않았습니다.
    reason: source_note
