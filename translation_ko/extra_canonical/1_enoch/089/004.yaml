base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/004.yaml
  text: And water[a], and darkness, and mist increased upon it; and I looked at the height of that water, and that water rose above that enclosure[d][c][b], and it poured over the enclosure and stood upon the earth.
  footnotes:
  - marker: a
    text: Or 'fog.' The Ge'ez term denotes a vaporous obscurity accompanying the water and darkness.
    reason: lexical_alternative
  - marker: b
    text: The repeated singular 'water' likely carries flood imagery in context, but the translation keeps the Ge'ez wording rather than making that interpretation explicit.
    reason: cultural_note
  - marker: c
    text: '''Enclosure'' may refer more specifically to a fold or fenced court within the vision''s animal symbolism.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And on it there came water, and darkness, and mist'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 물과 어둠과 안개가 그 위에 더해졌습니다. 나는 그 물의 높이를 바라보았고, 그 물은 그 울타리 위로 올라갔으며, 그 울타리를 넘쳐 땅 위에 서 있었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안개’보다 더 넓게 ‘연무, 김’으로도 옮길 수 있습니다. 이 게에즈어는 물과 어둠에 동반되는 희뿌연 차폐를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 반복되는 단수형 ‘물’은 문맥상 홍수 이미지를 강하게 띠지만, 번역은 그 해석을 본문에 직접 덧붙이지 않고 원문 표현을 유지합니다.
    reason: cultural_note
  - marker: c
    text: ‘울타리’는 더 구체적으로는 둘러친 우리, 담장, 또는 경계 공간을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그리고 그 위에 물과 어둠과 안개가 더해졌습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ወበዝኀ / ወበዝን (OCR)
  english_pob_choice: increased
  chosen_korean: 더해졌습니다
  alternatives_korean:
  - 증가했습니다
  - 불어났습니다
  - 커졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 핵심 동사는 ‘늘다/증가하다’의 의미이므로, 단순한 발생보다 누적과 강도의 상승을 드러내는 ‘더해지다’가 자연스럽고 원문에도 가깝습니다.
- source_word: ጽልመት
  english_pob_choice: darkness
  chosen_korean: 어둠
  alternatives_korean:
  - 흑암
  - 암흑
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 물과 함께 오는 불길한 시각적 차폐를 평이하게 살리기 위해 표준어 ‘어둠’을 택했습니다.
- source_word: ጊሜ
  english_pob_choice: mist
  chosen_korean: 안개
  alternatives_korean:
  - 연무
  - 김
  - 짙은 안개
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 물과 어둠에 이어지는 희뿌연 기운을 한국어에서 가장 مستقیم적으로 드러내는 말은 ‘안개’이며, POB의 절제된 어휘 선택과도 잘 맞습니다.
- source_word: መልዕልተ / ተላዐለ / ይከዑ
  english_pob_choice: height / rose above / it poured over
  chosen_korean: 높이 / 올라갔으며 / 넘쳐
  alternatives_korean:
  - 위 / 솟아올랐으며 / 흘러넘쳐
  - 높은 곳 / 올라서며 / 덮쳐
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘높이’와 ‘올라가다’는 수직적 상승을 유지하고, ‘넘쳐’는 물이 경계를 넘어서는 힘을 간결하게 전달합니다.
- source_word: ዐጸድ
  english_pob_choice: enclosure
  chosen_korean: 울타리
  alternatives_korean:
  - 울타리로 둘러친 곳
  - 담장
  - 둘러막은 곳
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석이 지적하듯 이 상징은 더 구체적으로는 둘러친 공간일 수 있지만, 본문 자체가 요구하는 최소 의미는 ‘둘러싸인 경계’이므로 한국어에서는 가장 직접적인 경계 이미지인 ‘울타리’로 옮겼습니다.
theological_decisions:
- issue: 상징적 ‘enclosure’의 구체화 정도
  chosen_reading: 본문에는 ‘울타리’로 두되, 더 좁은 ‘양의 우리’로는 확정하지 않았습니다.
  alternative_readings:
  - 양우리
  - 우리
  - 목장
  rationale: Animal Apocalypse의 상징 체계가 배경이지만, 이 절만으로는 동물 상징을 더 좁혀 확정할 근거가 부족하므로 원문의 열린 이미지를 유지했습니다.
  doctrine_reference: Translation philosophy §3, §4
- issue: 물의 상승과 범람의 표현
  chosen_reading: ‘더해졌습니다 / 올라갔으며 / 넘쳐’로 누적성과 범람성을 모두 살렸습니다.
  alternative_readings:
  - 불어났습니다
  - 범람했습니다
  rationale: 본문은 단순한 이동이 아니라 점증하는 침수 장면을 묘사하므로, 원문의 긴장과 재앙적 분위기를 약화시키지 않는 방향으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3
