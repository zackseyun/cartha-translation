base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/014.yaml
  text: And the Lord brought the twelve sheep so that they might dwell with it and graze with it among the wolves[c][b][a]; and they multiplied and became many flocks of sheep.
  footnotes:
  - marker: a
    text: The Ethiopic text is difficult in the middle of the verse; the clause rendered 'pasture with him among the wolves' reflects the animal imagery of the passage and may also be understood more literally as 'graze with him in the midst of the wolves.'
    reason: textual_variant
  - marker: b
    text: The final phrase is uncertain in the OCR witness. It appears to describe the twelve sheep increasing into numerous groups or flocks of sheep.
    reason: alternative_reading
  - marker: c
    text: Or 'dwell with him and pasture with him'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 열두 마리의 양을 데려오셔서, 그들이 그 양과 함께 살며 늑대들 가운데서 그 양과 함께 풀을 뜯도록 하셨습니다.[a][c] 그들은 번성하여 많은 양 떼가 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 본문의 이 절 중간 부분은 난해합니다. 여기서는 양들이 그 양과 함께 늑대들 가운데서 풀을 뜯는다는 동물 비유를 따라 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 마지막 구절은 OCR 증인의 판독이 불확실합니다. 열두 마리의 양이 늘어나 여러 무리의 양 떼가 되었다는 뜻으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그 양과 함께 살며 그 양과 함께 풀을 뜯도록 하셨습니다’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: እግዚአ
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 소유주
  - 하나님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 서술에서 지배적·권위적 존재를 가리키므로, 영어 POB의 ‘the Lord’에 맞춰 존칭적 호칭인 ‘주님’으로 옮겼습니다.
- source_word: አምጽኦሙ
  english_pob_choice: brought
  chosen_korean: 데려오셔서
  alternatives_korean:
  - 데려오셨습니다
  - 이끌어오셔서
  - 가져오셔서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 이동이 아니라 주도적으로 자기 앞/자기 영역으로 오게 하는 동작이므로, 자연스럽고 서술 흐름에 맞는 ‘데려오셔서’를 선택했습니다.
- source_word: ፲ወ፪ አባግዕ
  english_pob_choice: the twelve sheep
  chosen_korean: 열두 마리의 양
  alternatives_korean:
  - 열두 양
  - 열두 마리 양
  - 열두 마리의 어린양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 숫자가 분명하므로 ‘열두 마리의 양’으로 옮겼고, 이 상징적 동물 이미지를 보존하기 위해 ‘어린양’처럼 의미를 좁히지 않았습니다.
- source_word: ይትረዐዩ ምስሌሁ
  english_pob_choice: graze with it
  chosen_korean: 함께 풀을 뜯게 하셨습니다
  alternatives_korean:
  - 함께 먹게 하셨습니다
  - 함께 풀을 뜯도록 하셨습니다
  - 함께 먹이를 찾게 하셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본 동사의 핵심은 양의 먹이 활동이므로 ‘풀을 뜯다’로 구체화했고, 주어가 양 무리임을 살리기 위해 사역형으로 자연스럽게 처리했습니다.
- source_word: ማእከለ አዝእብት
  english_pob_choice: among the wolves
  chosen_korean: 늑대들 가운데서
  alternatives_korean:
  - 늑대들 사이에서
  - 늑대들 한가운데서
  - 늑대들 속에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 위험하고 적대적인 환경을 드러내는 공간 표현이므로, 문맥을 직접 살리는 ‘가운데서’를 택했습니다.
- source_word: በዝኁ
  english_pob_choice: they multiplied
  chosen_korean: 번성하여
  alternatives_korean:
  - 늘어나
  - 증가하여
  - 많아져
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 수적 증가보다 생동하는 확장을 담는 표준 성경어법에 따라 ‘번성하다’를 사용했습니다.
theological_decisions:
- issue: ‘with it’의 지시 대상이 2인칭 주격이 아니라 앞선 양을 가리키는 점
  chosen_reading: 한국어에서는 ‘그것’으로 받아 앞선 양을 지시하게 했습니다.
  alternative_readings:
  - 그와 함께
  - 주님과 함께
  rationale: 게으른 문법 맞춤을 피하고, 영어 POB의 수정 취지처럼 지시 대상을 양으로 분명히 하여 원문 흐름을 보존했습니다.
  doctrine_reference: 서사 내부 지시어 해소는 문맥 우선 원칙을 따릅니다.
