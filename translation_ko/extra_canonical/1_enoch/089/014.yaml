  source_fidelity: 원문의 목적절(‘~하도록’)과 복수 주어(열두 양), 그리고 ‘그것과 함께’라는 선행 양을 가리키는 지시 관계를 보존해야 합니다. 초안의 사역 표현은 대체로 가능하지만, ‘함께 살고’와 ‘함께 풀을 뜯게’의 병렬 및 지시 대상이 다소 불명확합니다. 또한 주어진 원어 자료는 에티오피아어이므로 각주에서 ‘히브리어/에티오피아어 전승’이라 한 것은 근거를 넘습니다.
  naturalness: ‘그것과 함께 살고 그것과 함께’는 한국어에서 지시어가 부자연스럽고 선행 대상이 흐려집니다. 문맥상 앞 절의 단수 양을 가리키는 ‘그 양’을 사용하고, 목적절을 ‘살며 … 풀을 뜯도록 하셨습니다’로 정리하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘주님’, ‘열두 마리의 양’, ‘늑대들 가운데서’, ‘번성하여’, ‘양 떼’는 환상의 동물 이미지를 보존하며 적절합니다. ‘풀을 뜯다’도 graze의 자연스러운 대응입니다.
