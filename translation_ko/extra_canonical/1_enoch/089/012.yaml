base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/012.yaml
  text: And that bull which was born from him begot a black wild boar and a white sheep[a]; and that wild boar produced many boars[c][b], and that sheep produced twelve sheep.
  footnotes:
  - marker: a
    text: The sequence likely continues the symbolic genealogy of peoples or lineages in the dream vision; the translation preserves the animal figures rather than substituting their probable historical referents.
    reason: cultural_note
  - marker: b
    text: The Ethiopic wording distinguishes a black wild swine from a white sheep; the color contrast is likely meaningful within the vision and is therefore retained explicitly.
    reason: lexical_alternative
  - marker: c
    text: Or 'that heifer which was born from him produced'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그에게서 태어난 그 황소는 검은 멧돼지 한 마리와 흰 양 한 마리를 낳았습니다[a][b]. 그 멧돼지는 많은 멧돼지를 낳았고, 그 양은 양 열두 마리를 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 본문은 여기서 수컷 소를 가리키므로 ‘황소’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 이 환상은 동물 형상으로 계보를 전개합니다. 번역은 이를 특정 역사 인물이나 집단으로 바꾸지 않고 동물 이미지를 유지합니다.
    reason: theological_note
lexical_decisions:
- source_word: ላህም
  english_pob_choice: that bull which was born from him
  chosen_korean: 그에게서 난 그 송아지
  alternatives_korean:
  - 그에게서 난 그 수소
  - 그에게서 난 그 황소
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 형태와 수정된 영어 POB의 재검토에 따라 이 항목은 암송아지가 아니라 수컷 소를 가리킵니다. 한국어에서는 서사적·상징적 맥락을 살리면서도 성별을 반영할 수 있는 중립적 자연어로 ‘송아지’를 택했습니다.
- source_word: ሐራዊያ
  english_pob_choice: wild boar
  chosen_korean: 들멧돼지
  alternatives_korean:
  - 멧돼지
  - 야생돼지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 집돼지가 아니라 야생성을 띤 돼지이므로, 상징적 대비를 살릴 수 있도록 ‘들멧돼지’를 사용했습니다.
- source_word: ገዳም ጸሊመ
  english_pob_choice: black
  chosen_korean: 검은
  alternatives_korean:
  - 어두운
  - 검정의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 색채 대비가 환상적 족보의 핵심 의미이므로, 이를 약화시키지 않는 직설적 표현인 ‘검은’을 택했습니다.
- source_word: በግዐ ጸዐዳ
  english_pob_choice: white sheep
  chosen_korean: 흰 양
  alternatives_korean:
  - 희고 흰 양
  - 흰 어린양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 명사는 이 본문에서 양 계열의 상징 동물을 가리키며, 성별이나 ‘어린양’의 신학적 뉘앙스를 덧씌울 근거가 부족하므로 가장 절제된 ‘흰 양’으로 옮겼습니다.
- source_word: አሕርወ ብዙኃነ
  english_pob_choice: many boars
  chosen_korean: 많은 멧돼지들
  alternatives_korean:
  - 많은 돼지들
  - 많은 들멧돼지들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞선 단수 ‘들멧돼지’와의 연속성을 유지하면서 복수를 자연스럽게 드러내기 위해 ‘많은 멧돼지들’을 선택했습니다.
- source_word: ዐሠርተ ወክልኤተ አባግዐ
  english_pob_choice: twelve sheep
  chosen_korean: 열두 마리의 양
  alternatives_korean:
  - 열두 양
  - 열두 마리의 어린양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수량 표현이 명시되어 있으므로 한국어에서는 자연스러운 단위 표현을 보완했고, 본문의 상징적 번식을 고려해 ‘양’으로 남겼습니다.
theological_decisions:
- issue: 1인칭/서술체의 아포칼립스 상징 동물 보존
  chosen_reading: 본문의 동물 형상은 역사적 인물로 바로 풀지 않고, 한국어 본문에서도 동물 이미지 자체를 그대로 유지했습니다.
  alternative_readings:
  - 사람/민족명으로 의역하여 의미를 직접 제시하는 번역
  rationale: 이 단락은 꿈-환상 속 상징 족보를 동물로 전개하므로, 본문에서 이미지를 풀어버리면 저자의 수사와 해석 여지를 훼손합니다.
  doctrine_reference: '번역 원칙: 묵시문학의 상징성 보존'
- issue: 게에즈 문법 재검토에 따른 성별 구분
  chosen_reading: 수정된 영어 POB의 ‘that bull’에 맞추어 수컷 소 계열로 이해했습니다.
  alternative_readings:
  - 암송아지로 이해하는 번역
  rationale: 검토 기록이 지적하듯 게에즈 대명사와 관계절은 수컷 소를 가리키며, 이후의 번식 동사와 상징 체계도 이 읽기를 지지합니다.
  doctrine_reference: 본문-언어 일치 원칙
