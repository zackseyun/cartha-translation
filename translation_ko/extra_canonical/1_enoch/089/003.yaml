base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/003.yaml
  text: And again I saw[a], and behold, springs were opened upon the earth in that great enclosure, and that water was bubbling up and rising over the earth, and that enclosure appeared[e][d][c][b], until all its land was covered with water.
  footnotes:
  - marker: a
    text: Or 'fountains' or 'sources' were opened.
    reason: lexical_alternative
  - marker: b
    text: The clause 'that enclosure appeared' is textually and syntactically difficult; it may mean that the enclosed land came into view as the waters rose, or more broadly that the scene of the enclosure was revealed.
    reason: alternative_reading
  - marker: c
    text: '''All its ground'' may also be understood as ''all the earth,'' depending on how the pronominal ending is taken.'
    reason: alternative_reading
  - marker: d
    text: Or 'saw that springs'.
    reason: previous_rendering
  - marker: e
    text: Or 'and that water began to well up and rise over the earth; and that enclosure appeared'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 다시 보았습니다. 보십시오, 그 큰 울타리 안의 땅 위에 샘들이 열렸고, 그 물이 땅 위로 솟아오르고 올라가고 있었으며, 그 울타리가 드러났습니다. 그래서 그 땅 전체가 물로 덮일 때까지 계속되었습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘샘들’은 ‘샘터들’이나 ‘근원들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘드러났습니다’는 ‘보였습니다’ 또는 ‘나타났습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘그 땅 전체’는 ‘그 모든 땅’ 또는 ‘그 땅의 모든 지면’으로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 이 절의 ‘그 큰 울타리’는 경계가 있는 공간을 가리키는 표현으로 이해했습니다.
    reason: source_note
  - marker: e
    text: ‘그 물이 땅 위로 솟아오르고 올라가고 있었으며’는 ‘솟아오르며 올라갔다’는 뜻을 더 직역적으로 풀어낸 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: አንቅዕታት
  english_pob_choice: springs
  chosen_korean: 샘들
  alternatives_korean:
  - 샘물들
  - 샘터들
  - 근원들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지면에서 물이 솟는 이미지를 살리기 위해 ‘샘들’로 옮겼습니다. ‘fountains’처럼 인공적 구조를 떠올리게 하는 표현은 피했습니다.
- source_word: ተርሕዉ
  english_pob_choice: were opened
  chosen_korean: 열렸고
  alternatives_korean:
  - 열리고
  - 드러났고
  - 풀렸고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 샘이 ‘열리다’는 수동적 개방을 자연스럽게 살리기 위해 ‘열렸고’로 번역했습니다.
- source_word: ዐጸድ ዐቢይ
  english_pob_choice: great enclosure
  chosen_korean: 그 큰 울타리
  alternatives_korean:
  - 그 큰 울타리 안
  - 그 큰 둘러싸인 곳
  - 그 큰 경계
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 경계가 있는 공간을 가리키므로, 구조를 과도하게 특정하지 않는 ‘울타리’로 옮기고 ‘큰’을 유지했습니다.
- source_word: ተአርአየ
  english_pob_choice: appeared
  chosen_korean: 드러났습니다
  alternatives_korean:
  - 보였습니다
  - 나타났습니다
  - 드러나 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어려운 절의 시각적 의미를 유지하되, 단순히 눈에 보였다는 뜻보다 장면이 ‘드러나다’는 느낌을 살렸습니다.
- source_word: ኵሉ ምድሩ
  english_pob_choice: all its ground
  chosen_korean: 그 땅 전체
  alternatives_korean:
  - 그 모든 땅
  - 그 전부의 땅
  - 그 땅의 모든 지면
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대명사 어미가 앞의 울타리/땅을 가리키는 가능성을 보존하면서, 한국어에서는 ‘그 땅 전체’가 가장 자연스럽고 중립적입니다.
theological_decisions:
- issue: ‘그 큰 울타리’의 범위와 홍수 이미지
  chosen_reading: 본문은 상징적 울타리 안의 땅이 물에 잠기는 장면으로 옮기고, 그 범위를 본문이 명시하는 만큼만 유지했습니다.
  alternative_readings:
  - 전 세계적 홍수로 명시하는 읽기
  - 꿈속의 특정한 제한된 공간으로만 보는 읽기
  rationale: 게에즈 본문은 ‘땅/지면’과 울타리의 지시를 함께 쓰며 범위를 단정하지 않습니다. 따라서 본문이 허용하는 긴장을 해소하지 않고 그대로 보존했습니다.
  doctrine_reference: 해석의 긴장을 본문 수준에서 보존합니다.
