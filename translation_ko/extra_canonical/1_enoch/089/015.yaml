base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/015.yaml
  text: And the wolves began to terrify them and to oppress them[a], until they destroyed their little ones and cast their little ones into a stream of much water[c][b]. And those sheep began to cry out because of their little ones and to lament before their Lord.
  footnotes:
  - marker: a
    text: Or 'attacked them' for 'oppressed them'; the Ge'ez verb can denote forceful hostile action.
    reason: lexical_alternative
  - marker: b
    text: '''A stream of much water'' may also be rendered ''a river of much water'' or ''a torrent of abundant water.'''
    reason: lexical_alternative
  - marker: c
    text: '''Before their Lord'' could also be understood as ''to their master,'' but the context favors a divine referent within the allegory.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 이리들이 그들을 두렵게 하고 그들을 압박하기 시작하여, 그들의 새끼들을 멸망시킬 때까지, 또 많은 물이 흐르는 시내로 그들의 새끼들을 던질 때까지 그러했습니다. 그러자 그 양들은 자기 새끼들 때문에 부르짖기 시작하고 자기들의 주님 앞에서 애통해했습니다.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 '그들을 공격하고'로 옮길 수 있습니다. 게에즈 동사는 강한 적대적 행동을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''많은 물이 흐르는 시내''는 ''많은 물의 강'' 또는 ''풍부한 물의 급류''로도 옮길 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: '''자기들의 주님 앞에서''는 문맥상 ''그들의 주인에게''로도 이해될 수 있으나, 알레고리의 흐름은 신적 지시를 더 강하게 지지합니다.'
    reason: alternative_reading
