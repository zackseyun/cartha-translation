base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
  footnotes:
  - marker: a
    text: Literally, 'were afraid before his face,' an idiom for fear in the immediate presence of the figure seen in the vision.
    reason: lexical_alternative
  - marker: b
    text: Or 'were afraid before his face'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 가운데서 나는 양들의 주[a]가 그들 앞에 서 있는 것을 보았으며, 그들은 그가 크고 두렵고 강한 분임을 보았고[b], 그 모든 양들은 그를 보고 그의 모습 앞에서 두려워하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘양들의 주’입니다. 이 환상에서는 소유주보다 권위 있는 통치자를 가리키는 호칭으로 읽는 것이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 게에즈 본문은 ‘그의 얼굴/모습 때문에 두려워하였다’는 관용을 담고 있습니다. 여기서는 문맥에 맞게 ‘그의 모습 앞에서 두려워하였습니다’로 옮겼습니다.
    reason: source_note
