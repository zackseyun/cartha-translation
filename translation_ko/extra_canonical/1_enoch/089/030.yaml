  terminology: ‘양들의 주’는 እግዚአ አባግዕ의 권위적 호칭과 동물 상징을 적절히 보존합니다. ‘얼굴’을 ‘모습’이나 ‘임재’로 바꾸지 않아 원문의 이미지를 유지하되, 각주에서 관용적 의미를 설명합니다.
