base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
  footnotes:
  - marker: a
    text: Literally, 'were afraid before his face,' an idiom for fear in the immediate presence of the figure seen in the vision.
    reason: lexical_alternative
  - marker: b
    text: Or 'were afraid before his face'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 가운데서 나는 양들의 주[a]께서 그들 앞에 서 계시는 것을 보았습니다. 그들은 그분이 위대하고 두려우며 강하신 분임을 보았습니다. 그 모든 양은 그분을 보고 그분의 얼굴 때문에 두려워하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양들의 주인’. 게에즈어 호칭은 주인·통치자의 뜻을 함께 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 얼굴 때문에 두려워하였다’입니다. 여기서 ‘얼굴’은 그분의 현존과 관련된 구체적 환상 이미지를 담고 있습니다.
    reason: source_note
