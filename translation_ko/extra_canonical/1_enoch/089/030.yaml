- from: 그리고 그들 가운데서 나는 양들의 주[a]가 그들 앞에 서 있는 것을 보았으며, 그들은 그가 크고 두렵고 강한 분임을 보았고[b], 그 모든 양들은 그를 보고 그의 모습 앞에서 두려워하였습니다.
  to: 그리고 그들 가운데서 나는 양들의 주[a]께서 그들 앞에 서 계시는 것을 보았습니다. 그들은 그분이 위대하고 두려우며 강하신 분임을 보았습니다. 그 모든 양은 그분을 보고 그분의 얼굴 때문에 두려워하였습니다.[b]
