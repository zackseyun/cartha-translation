    rationale: 주어가 두려움을 느낀다는 뜻으로도 읽힐 수 있으므로, 원문의 ‘두려움을 일으키는’ 의미를 분명히 하는 ‘두려우며’와 존칭 관형 표현을 사용했습니다.
