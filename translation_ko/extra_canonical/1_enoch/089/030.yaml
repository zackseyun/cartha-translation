  source_fidelity: 마지막 구절의 게에즈어 ፈርሁ እምገጹ는 ‘그의 모습 앞에서’가 아니라 그의 얼굴/현존으로 인해 두려워했다는 뜻입니다. 또한 각주 b가 중간의 형용사열에 붙어 있으면서 마지막 구절을 해설하여 앵커가 맞지 않습니다.
