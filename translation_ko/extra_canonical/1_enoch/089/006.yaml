base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/006.yaml
  text: And that vessel floated upon the water[a], and all the bulls and elephants and camels and donkeys were swallowed up into the earth; and all the beasts—I could not see them—and they were not able to come out[e][d][c][b], but perished and sank into the depths.
  footnotes:
  - marker: a
    text: The Ethiopic term rendered 'mast' may denote an upright timber or beam; the exact object in the dream image is not fully certain.
    reason: lexical_alternative
  - marker: b
    text: The final phrase could also be rendered 'into the deep' or 'into the sea.' 'Abyss' is chosen to preserve the ominous apocalyptic force of the image.
    reason: lexical_alternative
  - marker: c
    text: Or 'And that mast sank into the water'.
    reason: previous_rendering
  - marker: d
    text: Or 'and camels and donkeys'.
    reason: previous_rendering
  - marker: e
    text: Or 'and all the cattle and the birds saw them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 배는 물 위를 떠다녔습니다[a]. 그리고 모든 수소들과 코끼리들과 낙타들과 나귀들은 땅속으로 삼켜졌습니다. 그리고 모든 짐승들은 — 나는 그것들을 볼 수 없었습니다 — 밖으로 나올 수 없었고, 멸망하여 깊은 곳으로 가라앉았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 항목의 아람어/에티오피아어 어휘는 배의 돛대나 장대처럼 읽힐 여지가 있으나, 문맥상 배의 환상 장면을 가리키는 것으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 표현은 문자적으로는 '깊은 곳'이며, 영어 POB는 종말론적 울림을 살리기 위해 'abyss'를 택했지만 한국어 본문은 보다 중립적으로 처리했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: መሥቀር
  english_pob_choice: mast
  chosen_korean: 배
  alternatives_korean:
  - 돛대
  - 돛대목
  - 기둥
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절의 바로 앞 문맥에 나온 배/배의 상징적 대상이 계속 이어지는 것으로 보이므로, 한국어에서는 자연스럽게 '그 배'로 옮겨 꿈-환상 장면의 흐름을 살렸습니다.
- source_word: ይጼቢ
  english_pob_choice: sank
  chosen_korean: 떠다녔습니다
  alternatives_korean:
  - 가라앉았습니다
  - 잠겼습니다
  - 물 위에 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 물 위에서의 움직임을 가리키므로 '떠다녔습니다'가 문맥에 맞습니다. 영어 POB의 'floated upon the water'를 반영하되, 한국어에서는 사건 흐름이 자연스럽게 읽히도록 했습니다.
- source_word: አልህምት
  english_pob_choice: bulls
  chosen_korean: 수소들
  alternatives_korean:
  - 황소들
  - 소들
  - 황소 떼
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Animal Apocalypse의 상징적 짐승 목록을 살리기 위해, 보다 일반적인 '소들'보다 구체적인 수컷 소를 나타내는 '수소들'을 택했습니다.
- source_word: ኅሠጥሙ
  english_pob_choice: were swallowed up
  chosen_korean: 땅속으로 삼켜졌습니다
  alternatives_korean:
  - 땅속으로 빨려 들어갔습니다
  - 땅에 삼켜졌습니다
  - 땅으로 잠겼습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 파괴적 포식 이미지를 강하게 띠므로, 단순히 '잠기다'보다 '삼켜지다'가 더 정확하고 힘이 있습니다.
- source_word: ወኵሉ፡ እንስሳ
  english_pob_choice: all the beasts
  chosen_korean: 모든 짐승들
  alternatives_korean:
  - 모든 동물들
  - 모든 가축들
  - 모든 짐승과 동물들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 특정 가축 목록이 아닌 남아 있는 짐승들의 총칭이므로, 문맥상 가장 직접적인 '짐승들'을 유지했습니다.
- source_word: ርእዮቶሙ
  english_pob_choice: I could not see them
  chosen_korean: 나는 그것들을 볼 수 없었습니다
  alternatives_korean:
  - 나는 그것들을 보지 못했습니다
  - 내가 그것들을 볼 수 없었습니다
  - 그것들은 보이지 않았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 정정에 따라 이 표현은 '볼 수 없었습니다'로 옮겨야 하며, 1인칭 화자의 시점이 분명히 드러나도록 했습니다.
- source_word: ተሠጥሙ ውስተ ቀላይ
  english_pob_choice: sank into the abyss
  chosen_korean: 깊은 곳으로 가라앉았습니다
  alternatives_korean:
  - 깊은 데로 가라앉았습니다
  - 바다로 가라앉았습니다
  - 심연으로 가라앉았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 종말론적 이미지가 있으나, 한국어 본문에서는 과도한 해석어를 피하고 원문의 물속 깊이를 살려 '깊은 곳'으로 옮겼습니다.
theological_decisions:
- issue: 마지막 물의 깊이를 '심연/abyss'로 볼지, 보다 중립적인 깊이로 볼지
  chosen_reading: 본문은 '깊은 곳'으로 옮기고, 종말론적 함의는 문맥이 감당하게 합니다.
  alternative_readings:
  - 심연
  - 바다
  - 깊은 데
  rationale: 이 절은 환상 서술의 종결부이므로, 영어 POB의 문헌적 판단을 참고하되 한국어 본문에서는 불필요한 신학어를 덧붙이지 않는 편이 더 원문에 가깝습니다.
  doctrine_reference: Apocalyptic imagery should be preserved without over-specifying later doctrinal terms.
