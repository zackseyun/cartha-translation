  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/009.yaml
  text: And that white bull[a], which had become a man, went out from that enclosure, and with him came three bulls. And one of those three bulls was white, resembling that white bull, and one of them was red like blood, and one was black[c][b]; and that white bull departed from among them.
  footnotes:
  - marker: a
    text: The final noun in the clause 'went out from there' is textually difficult in the OCR witness; the sense of departure from a place is clear, but a more specific rendering such as 'enclosure' or 'stall' is uncertain from this witness alone.
    reason: textual_variant
  - marker: b
    text: Or 'went out from there'.
    reason: previous_rendering
  - marker: c
    text: Or 'was like that white bull'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 사람으로 변한 그 흰 수소는 그 우리에서 나왔습니다. 그리고 그와 함께 세 마리의 수소가 나왔습니다. 그 세 마리 가운데 하나는 흰색이었는데, 그 흰 수소와 닮았고, 하나는 피처럼 붉었으며, 하나는 검은색이었습니다. 그리고 그 흰 수소는 그들 가운데서 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 마지막 장소 명사는 전승상 난독/교정 문제가 있어, 정확한 지형 용어보다 ‘나왔다’는 탈출·이탈의 의미를 우선 반영했습니다.
    reason: textual_variant
