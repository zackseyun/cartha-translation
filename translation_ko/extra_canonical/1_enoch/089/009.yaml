theological_decisions:
- issue: 동물 환상 이미지의 해석 여부
  chosen_reading: 인물 동일시나 해석을 본문에 덧붙이지 않고, 세 수소와 흰 수소의 이동·색채 대비를 있는 그대로 보존했습니다.
  alternative_readings:
  - 흰 수소를 특정 인물로 주석화하는 번역
  - 세 수소를 족장 계열로 풀어 쓰는 번역
  rationale: 이 절은 상징적 환상 서술이므로, 본문이 말하는 이미지를 번역에서 해석으로 바꾸지 않는 것이 더 충실합니다.
  doctrine_reference: 종말론적·묵시적 상징은 본문 차원의 긴장을 유지해야 합니다.
