revisions:
- from: 그리고 사람으로 변한 그 흰 수소는 그 우리에서 나왔습니다. 그리고 그와 함께 세 마리의 수소가 나왔습니다. 그 세 마리 가운데 하나는 흰색이었는데, 그 흰 수소와 닮았고, 하나는 피처럼 붉었으며, 하나는 검은색이었습니다. 그리고 그 흰 수소는 그들 가운데서 떠났습니다.[a]
  to: 그리고 사람이 된 그 흰 수소는 그 배에서 나왔습니다.[a] 그와 함께 세 마리의 수소도 나왔습니다. 그 세 수소 가운데 하나는 흰색으로 그 흰 수소를 닮았고, 하나는 피처럼 붉었으며, 하나는 검은색이었습니다. 그리고 그 흰 수소는 그들 가운데서 떠났습니다.
  rationale: ‘우리’를 ‘배’로 바로잡고, 세 수소 중 첫째가 ‘흰색’이라는 명시적 서술을 복원했습니다. 각주도 문제의 장소 명사 바로 뒤로 옮겼습니다. ‘방주’라는 해석적 명칭 대신 본문의 표현에 가까운 ‘배’를 유지하여 환상 서술의 이미지를 보존했습니다.
