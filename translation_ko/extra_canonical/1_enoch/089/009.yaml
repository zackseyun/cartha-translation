    reason: previous_rendering
  - marker: c
    text: Or 'was like that white bull'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 사람이 된 그 흰 수소는 그 배에서 나왔습니다.[a] 그와 함께 세 마리의 수소도 나왔습니다. 그 세 수소 가운데 하나는 흰색으로 그 흰 수소를 닮았고, 하나는 피처럼 붉었으며, 하나는 검은색이었습니다. 그리고 그 흰 수소는 그들 가운데서 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기의 ‘배’는 전승된 본문의 난독한 형태를 문맥과 더 분명한 독법에 따라 옮긴 것입니다. 앞 절들의 물과 착지 장면은 이 배가 방주를 가리킴을 시사합니다.
    reason: textual_variant
