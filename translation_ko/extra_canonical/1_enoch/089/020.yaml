  - 짓누르는
  - 때리는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 폭력적 구타의 의미가 강하지만, 동물 비유 안에서 지나치게 구체화하지 않도록 ‘치는’으로 처리했습니다.
- source_word: የአውይዉ
  english_pob_choice: cried out
  chosen_korean: 울부짖었고
  alternatives_korean:
  - 소리쳤고
  - 외쳤고
  - 통곡했고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 늑대들의 동물적 음성을 반영하되, 단순한 말소리보다 강한 비명을 나타내는 표현을 택했습니다.
- source_word: አርመሙ / አጸርዑ
  english_pob_choice: became silent / cried out no more
  chosen_korean: 잠잠해졌으며, 그때부터는 더 이상 소리치지 않았습니다
  alternatives_korean:
  - 조용해졌으며, 그때부터는 더 이상 외치지 않았습니다
  - 잠잠해졌으며, 그때부터는 그치지 않았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 ‘침묵’과 이후의 부정적 지속을 한국어에서 분명하게 살리기 위해 ‘잠잠해졌다’와 ‘더 이상 소리치지 않았다’를 함께 사용했습니다.
theological_decisions:
- issue: 양 떼의 주의 표상
  chosen_reading: 이 표현은 비유적 장면 속에서 하나님을 가리키는 상징적 호칭으로 유지했습니다.
  alternative_readings:
  - 덜 명시적으로 ‘그들의 주’로 풀어 쓰는 방식
  rationale: 에녹서의 동물 묵시는 상징을 직접 보존하는 것이 중요하므로, 신학적 의미를 일반화하지 않았습니다.
  doctrine_reference: 원문-우선 번역 원칙; 묵시문학의 상징 보존
