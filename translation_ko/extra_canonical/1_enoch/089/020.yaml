base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/020.yaml
  text: And the Lord of the sheep came to them[a], and while they were striking those wolves, and the wolves were crying out, the sheep became silent[c][b], and from that time they cried out no more.
  footnotes:
  - marker: a
    text: 'The closing clause is difficult in the Ethiopic sequence: after ''the sheep became silent,'' the text reads literally something like ''and from that time they cried out.'' The subject of the final verb may be resumptive or reflect a textual disturbance.'
    reason: textual_variant
  - marker: b
    text: Or 'while the wolves were trampling those sheep, the wolves cried out'.
    reason: previous_rendering
  - marker: c
    text: Or 'and from that time they cried out.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 양들의 주께서 그들에게 오셨습니다. 양들이 그 늑대들을 치는 동안, 늑대들은 울부짖었고, 양들은 잠잠해졌으며, 그때부터 더 이상 소리치지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 게에즈어 전사본의 마지막 동사는 OCR로 인해 ‘소리쳤다’로 읽힐 수 있습니다. 그러나 찰스의 비평판에서 확인되는 읽기는 ‘그쳤다’이며, 이에 따라 ‘그때부터 더 이상 소리치지 않았다’로 옮겼습니다.
    reason: textual_variant
