base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/005.yaml
  text: And all the cattle in that enclosure were gathered together[a], until I saw them sink, and be swallowed up[d][c][b], and be destroyed in that water.
  footnotes:
  - marker: a
    text: Or 'pasture' for 'field'; the Ge'ez term can denote open land associated with grazing or cultivation.
    reason: lexical_alternative
  - marker: b
    text: 'The three verbs intensify the scene: they sink, are swallowed up, and perish in the water.'
    reason: cultural_note
  - marker: c
    text: Or 'of that field'.
    reason: previous_rendering
  - marker: d
    text: Or 'until I saw that they sank, and were swallowed up, and were destroyed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 울타리 안의 모든 가축이 한데 모였는데, 내가 그것들이 잠기고, 삼켜지고, 그 물에서 멸망하는 것을 볼 때까지였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘울타리’로 옮긴 ዐጸድ는 이 절에서 앞 절들과 연결되는 동일한 둘러싸인 공간을 가리킵니다.
    reason: source_note
