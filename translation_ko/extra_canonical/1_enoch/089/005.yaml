theological_decisions:
- issue: 환상 속 동물 표상 유지
  chosen_reading: '''가축''이라는 구체적 동물 집합을 유지하고, 사람 집단으로 해석하여 본문에서 풀어 쓰지 않았습니다.'
  alternative_readings:
  - 사람들
  - 짐승들
  rationale: 이 장은 일관된 동물 상징으로 서술되므로, 번역문이 상징 매체를 해독해 버리기보다 그대로 보존하는 것이 독자가 본문의 환상 구조를 이해하는 데 더 충실합니다.
  doctrine_reference: '번역 원칙: 묵시적 상징의 매체를 보존하고 본문 밖 해석을 본문 안에 주입하지 않음.'
