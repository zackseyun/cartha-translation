base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/001.yaml
  text: And one of those four went to that white bull and taught him a mystery[a], while he was not trembling; and that bull was born and became a man, and built for himself a great vessel and dwelt upon it. And three bulls were with him on that vessel[c][b], and they were covered over above them.
  footnotes:
  - marker: a
    text: The clause rendered 'while he was trembling' is textually difficult in the OCR; the negative particle may be uncertain. A possible alternative is 'while he did not tremble.'
    reason: textual_variant
  - marker: b
    text: The 'great vessel' likely corresponds to the flood craft in the vision's symbolic retelling of Genesis, but the text itself keeps the image in animal-apocalypse form.
    reason: cross_reference
  - marker: c
    text: Or 'And one of those four went to that white heifer and instructed him in a secret, while he was trembling; and that heifer was born and became a man, and built for himself a great vessel and dwelt upon it. And three cows were with him on that vessel, and they were covered over above them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 넷 중 하나가 그 흰 황소에게 가서 비밀 하나를 가르쳐 주었습니다[a]. 그런데 그 황소는 떨지 않았습니다. 그 황소는 태어나 사람이 되었고, 스스로 큰 배를 만들어 그 위에 머물렀습니다. 그리고 세 황소가 그와 함께 그 배에 있었고[c][b], 그들은 그 위로 덮여 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 OCR의 난독 구절은 부정 표지가 포함된 형태로 읽는 것이 더 일관되므로, 번역은 그 읽기를 따랐습니다.
    reason: textual_variant
  - marker: b
    text: 이 ‘큰 배’는 홍수 서사의 대응물로 보이지만, 본문 자체는 그것을 동물 우화 형식으로 제시합니다.
    reason: cross_reference
  - marker: c
    text: 일부 판본 전통에서는 이 대목을 ‘암소’로 읽기도 하나, 동물 상징 체계상 여기서는 ‘황소’가 더 적절합니다.
    reason: previous_rendering
