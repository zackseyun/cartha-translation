theological_decisions:
- issue: 동물 우화를 홍수 전승의 직접 서술로 풀어쓸지 여부
  chosen_reading: 상징적 동물-인간 변형과 배 이미지를 그대로 유지하고, 노아를 본문에 직접 이름붙이지 않았습니다.
  alternative_readings:
  - 노아가 방주를 짓는 이야기로 풀어 쓰기
  - ‘방주’로 옮겨 창세기 대응을 강하게 드러내기
  rationale: 본문은 분명 홍수 전승을 암시하지만, 저자는 꿈-환상 형식의 상징 언어로 서술합니다. 번역은 그 긴장을 보존해야 하므로 해석을 앞질러 구체화하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; do not paraphrase beyond what the witness warrants.
