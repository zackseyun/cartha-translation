base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/036.yaml
  text: And I saw in the vision until that sheep became a man[a], and built a house for the Lord of the sheep[c][b], and he placed all the sheep in that house.
  footnotes:
  - marker: a
    text: '''House'' likely carries sanctuary or temple overtones here, but the Ge''ez wording itself is simply ''house.'''
    reason: lexical_alternative
  - marker: b
    text: The sheep's becoming 'a man' is part of the vision's symbolic transformation; the translation leaves the figure unidentified rather than supplying an interpretation.
    reason: cultural_note
  - marker: c
    text: Or 'he made all the sheep stand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 환상 가운데서 그 양이 사람이 될 때까지 보았습니다[a]. 그는 양들의 주님[b][c]을 위해 집을 짓고, 그 집 안에 모든 양을 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람이 되다’는 환상 속 상징적 변화를 가리키며, 인물을 특정하지는 않습니다.
    reason: cultural_note
  - marker: b
    text: 여기서 ‘주님’은 양의 주인이라는 뜻을 넘어서, 묵시문맥에서 높은 권위를 지닌 존재를 가리킵니다.
    reason: theological_note
  - marker: c
    text: ‘집’은 원문 그대로의 표현으로, 문맥상 성전/성소의 함의가 있을 수 있으나 본문에서는 해석을 덧붙이지 않았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዝራእይ
  english_pob_choice: in the vision
  chosen_korean: 환상 가운데서
  alternatives_korean:
  - 환상에서
  - 환시 중에
  lexicon: Dillmann
  rationale: 비전/환시라는 시각적·계시적 성격을 살리면서도 한국어에서 자연스럽고 격식을 갖춘 표현을 택했습니다.
- source_word: በግዕ
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 어린양
  - 숫양
  lexicon: Dillmann
  rationale: 동물 상징의 일반성을 유지하기 위해 더 구체적인 ‘어린양’이나 ‘숫양’보다 포괄적인 ‘양’으로 옮겼습니다.
- source_word: ኮነ ብእሴ
  english_pob_choice: became a man
  chosen_korean: 사람이 될 때까지
  alternatives_korean:
  - 사람이 되었습니다
  - 한 사람이 되었습니다
  - 인간이 되었습니다
  lexicon: Dillmann
  rationale: 변형의 결과를 드러내면서도, 환상 속 상징적 변화라는 점을 유지하기 위해 직설적 ‘되다’ 구조를 사용했습니다.
- source_word: ሐነጸ ቤተ
  english_pob_choice: built a house
  chosen_korean: 집을 짓고
  alternatives_korean:
  - 집을 건축하고
  - 성전을 짓고
  - 성소를 짓고
  lexicon: Dillmann
  rationale: 원문은 단순히 ‘집’을 말하므로 본문에서는 해석을 덧붙이지 않고 그대로 옮겼으며, ‘성전’으로 구체화하는 것은 주석적 의미에 맡겼습니다.
- source_word: አቀሞሙ
  english_pob_choice: placed all the sheep
  chosen_korean: 모든 양을 두었습니다
  alternatives_korean:
  - 모든 양을 세웠습니다
  - 모든 양을 배치했습니다
  - 모든 양을 서 있게 했습니다
  lexicon: Dillmann
  rationale: POB의 수정된 영어처럼 ‘두다/배치하다’의 자연스러운 뜻을 살리되, 원문의 ‘세우다’ 뉘앙스는 과도하게 직역하지 않았습니다.
theological_decisions:
- issue: “양들의 주님”을 어떻게 옮길지
  chosen_reading: 주님
  alternative_readings:
  - 주인
  - 주
  rationale: እግዚአ는 단순 소유주보다 높은 권위를 지닌 ‘주님’에 가깝고, 이 묵시문맥의 신적 인물성을 드러내기 위해 ‘주님’을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘집’의 의미를 성전으로 해석할지
  chosen_reading: 집
  alternative_readings:
  - 성전
  - 성소
  - 성막
  rationale: 원문 어휘는 분명히 ‘집’이며, 성전적 함의는 강하지만 본문 번역에서 미리 해석으로 고정하지 않고 여운을 남겼습니다.
  doctrine_reference: Translation philosophy §3
