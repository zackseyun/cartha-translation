base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/054.yaml
  text: And after that I saw when they abandoned the house of the Lord and his tower[a], and they all went astray, and their eyes were blinded. And I saw the Lord of the sheep bring about a great slaughter among them in their pasture[f][e][d][c][b], until those sheep cried out because of that slaughter and abandoned his place.
  footnotes:
  - marker: a
    text: The phrase rendered 'his tower' may also be understood as 'his fold' or 'his enclosure'; the imagery likely belongs to the symbolic sanctuary complex in the vision.
    reason: lexical_alternative
  - marker: b
    text: The final clause is textually difficult. The verb before 'his place' may be understood differently in some readings, yielding a sense such as 'and they came to/entered his place' rather than 'left his place.'
    reason: textual_variant
  - marker: c
    text: Or 'And again'.
    reason: previous_rendering
  - marker: d
    text: Or 'that house of their Lord'.
    reason: previous_rendering
  - marker: e
    text: Or 'they all went astray'.
    reason: previous_rendering
  - marker: f
    text: Or 'cried out because of that slaughter and left his place'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런 뒤에 나는 그들이 주의 집과 그분의 탑[a]을 버리고 모두 길을 잃고 그들의 눈이 멀게 된 것을 보았습니다. 또 나는 양들의 주께서 그들의 목초지에서 그들 가운데 큰 살육을 일으키시는 것을 보았습니다. 마침내 그 양들은 그 살육 때문에 부르짖고 그분의 자리를 떠났습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분의 탑’은 ‘그분의 우리’ 또는 ‘그분의 울타리’로도 이해될 수 있습니다. 이 환상에서는 성소와 관련된 보호 공간의 상징일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 본문상 어렵습니다. ‘그분의 자리를 떠났다’ 대신, 일부 독법에서는 ‘그분의 자리에 이르렀다’ 또는 ‘그분의 자리로 들어갔다’라는 뜻으로 이해될 수 있습니다.
    reason: textual_variant
