  - 하나님의 직접적 심판성을 완화하는 읽기
  rationale: 본문은 도덕적 이탈과 그 결과로서의 심판을 강하게 연결하므로, 그 긴장을 누그러뜨리지 않고 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
