base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/032.yaml
  text: And that sheep that led them returned and went up upon that rock[a]; and the sheep, while their eyes were blinded, went astray from the path that he had shown them[b], but that sheep did not know it.
  footnotes:
  - marker: a
    text: Or 'onto that height/crag'; the Ge'ez term may denote a rocky elevation rather than a single stone.
    reason: lexical_alternative
  - marker: b
    text: Or 'while their eyes were being blinded'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들을 인도하던 그 양은 돌아와 그 바위 위로 올라갔습니다[a]. 양들은 눈이 가려진 채 그가 그들에게 보여 준 길에서 벗어나 헤매었으나[b], 그 양은 그것을 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 높이/절벽 위로’로 옮길 수 있습니다. 게으스어 어휘는 단일한 바위보다 바위로 이루어진 높은 지형을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘눈이 가려지는 동안’으로 옮길 수 있습니다.
    reason: previous_rendering
