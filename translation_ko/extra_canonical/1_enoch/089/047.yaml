base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/047.yaml
  text: And the first ram pursued that later ram[a], and that later ram rose up and fled from before his face[c][b]; and I saw until those dogs brought down the first ram.
  footnotes:
  - marker: a
    text: Literally, 'fled from before his face,' a Semitic-style expression for retreating before someone.
    reason: lexical_alternative
  - marker: b
    text: The term rendered 'later boar' could also be translated 'last boar' or 'following boar'; the Ge'ez marks sequence in contrast to the 'first boar.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And the first boar pursued that later boar, and that later boar rose up and fled from before his face; and I saw until those dogs brought down the first boar.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 첫째 숫양이 그 뒤의 숫양을 쫓았고, 그 뒤의 숫양은 일어나 그 앞에서 도망쳤습니다[a]. 그리고 저는 그 개들이 첫째 숫양을 넘어뜨릴 때까지 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 얼굴 앞에서 도망쳤다’입니다. 이는 누군가 앞에서 물러나거나 달아남을 나타내는 셈어식 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሐርጌ
  english_pob_choice: ram
  chosen_korean: 숫양
  alternatives_korean:
  - 양
  - 수양
  lexicon: Leslau / 문맥상 대응
  rationale: 애굽어·에티오피아어 본문과 POB의 수정 반영에 따라 이 단어는 이 대목에서 ‘ram’으로 이해되어야 하므로, 상징 동물의 성별을 살린 ‘숫양’으로 옮겼습니다.
- source_word: ቀዳማዊ
  english_pob_choice: first
  chosen_korean: 첫째
  alternatives_korean:
  - 첫 번째
  - 처음의
  lexicon: Dillmann
  rationale: 앞선 숫양과의 순서를 나타내므로, 자연스러운 서술어감의 ‘첫째’가 가장 직접적입니다.
- source_word: ዳሓራዊ / ዳሕራዊ
  english_pob_choice: later
  chosen_korean: 그 뒤의
  alternatives_korean:
  - 나중의
  - 다음의
  - 후의
  lexicon: Dillmann
  rationale: ‘첫째’와의 대비 속에서 순서를 나타내는 표현이므로, 직역적이면서도 한국어로 매끄러운 ‘그 뒤의’를 택했습니다.
- source_word: እምቅድመ ገጹ
  english_pob_choice: from before his face
  chosen_korean: 그의 얼굴 앞에서
  alternatives_korean:
  - 그의 앞에서
  - 그의 presence 앞에서
  - 그를 마주하여
  lexicon: Dillmann
  rationale: 히브리계 관용구의 문자적 표지를 살리되, 한국어에서는 ‘얼굴 앞에서’로 옮겨 회피·도망의 장면성을 보존했습니다.
