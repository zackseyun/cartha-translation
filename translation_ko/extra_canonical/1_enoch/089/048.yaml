  text: And afterward that ram arose and led the sheep[a]; and that ram fathered many sheep and lay down. And a little sheep became a ram in its place[d][c][b], and it became ruler and leader of those sheep.
  footnotes:
  - marker: a
    text: '''Lay down'' likely functions as the vision''s idiom for the ram''s death, but the main text keeps the image literal.'
    reason: lexical_alternative
  - marker: b
    text: The adjective rendered 'little' may also suggest 'young'; the phrase can mean either a small sheep or a young one.
    reason: lexical_alternative
  - marker: c
    text: Or 'And afterward that ram'.
    reason: previous_rendering
  - marker: d
    text: Or 'the little sheep'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 후의 그 숫양이 일어나 양들을 이끌었습니다[a]. 그리고 그 숫양은 많은 양을 낳고 엎드려 누웠습니다. 그리고 작은 양이 그 자리에 숫양이 되었고[d][c][b], 그 양들의 통치자와 인도자가 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이끌었습니다’는 단순한 이동보다 지도·통솔의 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘작은’은 ‘어린’의 가능성도 함께 열어 두는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 후의 그 숫양’으로도 읽을 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘작은 양이’로 이해할 수 있습니다.
    reason: previous_rendering
