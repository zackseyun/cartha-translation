  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서술의 진행을 살리면서도 한국어에서 자연스러운 동작 연결을 위해 ‘가서’로 옮겼습니다.
- source_word: ኀቤሁ
