  - 주권자와 안내자로 세웠습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 명칭의 병렬을 유지하되 현대 한국어에서 의미가 분명하도록 ‘통치자’와 ‘인도자’로 옮겼습니다.
- source_word: ያጸህቅዎሙ
  english_pob_choice: were afflicting
  chosen_korean: 괴롭히고 있었습니다
  alternatives_korean:
  - 압제하고 있었습니다
  - 학대하고 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개들이 양들을 지속적으로 압박하는 장면을 자연스럽게 드러내기 위해, 강도를 유지하면서도 독자가 바로 이해할 수 있는 동사로 옮겼습니다.
