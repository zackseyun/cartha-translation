  rationale: 환상 문맥에서 대상이 숫양이지만, 뒤따르는 서술이 상징 인물을 가리키므로 지시 대상의 인격화된 호칭을 살려 ‘그에게로’로 옮겼습니다.
- source_word: ለባሕቲቱ
  english_pob_choice: to it alone
  chosen_korean: 그에게만
  alternatives_korean:
  - 혼자서
  - 비밀리에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 ‘오직/혼자’라는 부사적 의미가 핵심이므로, 영어 주석의 축을 따라 ‘그에게만’으로 반영했습니다.
- source_word: ገብረ መኰንነ ወመራሔ
  english_pob_choice: made it ruler and leader
  chosen_korean: 통치자와 인도자로 삼았습니다
  alternatives_korean:
