  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개들이 양들을 지속적으로 압박하는 장면을 자연스럽게 드러내기 위해, 강도를 유지하면서도 독자가 바로 이해할 수 있는 동사로 옮겼습니다.
