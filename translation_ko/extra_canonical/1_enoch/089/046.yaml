translation:
  language: ko
  text: 그는 그에게로 가서 그에게만 말했고, 그 숫양을 세워 그를 양들의 통치자와 인도자로 삼았습니다. 그리고 이 모든 동안 개들은 양들을 괴롭히고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서는 ‘그에게만/혼자서’라는 뜻을 반영한 것으로, 대상 자체를 바꾸는 것이 아닙니다.
    reason: source_note
