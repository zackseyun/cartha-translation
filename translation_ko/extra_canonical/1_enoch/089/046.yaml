translation:
  language: ko
  text: 그는 그에게로 가서 그에게만 말했고, 그 숫양을 일으켜 세우고 그 숫양을 양들의 통치자와 인도자로 삼았습니다. 그리고 이 모든 동안 개들은 양들을 괴롭히고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그에게만’은 ‘그 숫양에게’라는 뜻이 아니라, 그에게만 또는 따로 말하였다는 뜻을 반영합니다.
    reason: source_note
