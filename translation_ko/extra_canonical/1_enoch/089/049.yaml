base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/049.yaml
  text: And those sheep grew and multiplied[a], and all those dogs and foxes and wild boars of the field feared and fled from them. And that ram gored and killed all the beasts, and those beasts were no longer able again to be in the midst of the sheep[e][d][c][b], and they did not seize anything from them.
  footnotes:
  - marker: a
    text: The animal term rendered 'foxes' may denote a fox-like scavenger; 'jackals' is a possible alternative.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'wild boars of the field' could also be understood more broadly as wild swine of the wilderness.
    reason: lexical_alternative
  - marker: c
    text: The final clause stresses that the hostile beasts no longer carried off anything from the sheep.
    reason: cultural_note
  - marker: d
    text: Or 'multiplied and became many'.
    reason: previous_rendering
  - marker: e
    text: Or 'struck'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 양들은 자라고 크게 번성하였으며[a], 그 모든 개들과 여우들과 들판의 멧돼지들은 그것들을 두려워하여 그것들로부터 도망하였습니다. 그 숫양은 모든 짐승들을 들이받아 죽였고, 그 짐승들은 다시는 양들 가운데에 있을 수 없었으며[e], 그것들로부터 아무것도 빼앗지 못하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자라고 크게 번성하였으며’는 영어 POB의 ‘grew and multiplied’에 해당하며, 원문의 이중 증가 표현을 함께 드러냅니다.
    reason: previous_rendering
  - marker: c
    text: 마지막 절은 단순한 ‘취하지 못하였다’보다, 양들에게서 아무것도 빼앗지 못했다는 약탈 금지를 강조합니다.
    reason: cultural_note
  - marker: e
    text: ‘다시는 … 있을 수 없었으며’는 영어 POB의 ‘were no longer able again to be’의 반복 불가능성을 살린 표현입니다.
    reason: previous_rendering
