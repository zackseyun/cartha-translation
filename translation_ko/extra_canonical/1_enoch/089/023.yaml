base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
  footnotes:
  - marker: a
    text: Or 'until they overtook them at a pool of water.' The Ge'ez verb in this clause is difficult, and the exact force may be either simple arrival or forced movement into the water.
    reason: lexical_alternative
  - marker: b
    text: Or 'until they drove them into a pool of water.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 늑대들이 그 양들을 추격하기 시작하여, 마침내 그들을 한 샘물가에서 따라잡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물웅덩이에서 그들을 따라잡을 때까지’로도 옮길 수 있습니다. Ge'ez 동사의 정확한 힘은 도달·추월의 뉘앙스 사이에서 논의될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘물 샘가에서’로도 옮길 수 있습니다. 전치사 በ는 이곳에서 장소를 가리키는 것으로 이해했습니다.
    reason: alternative_reading
