base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
  footnotes:
  - marker: a
    text: Or 'until they overtook them at a pool of water.' The Ge'ez verb in this clause is difficult, and the exact force may be either simple arrival or forced movement into the water.
    reason: lexical_alternative
  - marker: b
    text: Or 'until they drove them into a pool of water.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 늑대들이 그 양들을 추격하기 시작하여, 한 샘가에서 그들을 따라잡았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 물웅덩이에서 그들을 따라잡았습니다’로 옮길 수 있습니다.
    reason: place_noun_alternative
  - marker: b
    text: 게에즈어 전치사 በ는 여기서 ‘~에서/곁에서’라는 장소를 나타내는 것으로 이해했습니다.
    reason: prepositional_clarification
