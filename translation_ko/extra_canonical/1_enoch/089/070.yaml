theological_decisions:
- issue: ‘기록하는 자’의 정체를 얼마나 특정할 것인가
  chosen_reading: 천상의 기록자/서기관으로만 두고 특정 인물로 동일시하지 않았습니다.
  alternative_readings:
  - 에녹 자신으로 볼 수 있습니다
  - 천사적 전령 일반으로 볼 수 있습니다
  rationale: 본문은 기록·상승·제시의 기능을 보여 주지만, 인물의 고유 정체를 더 이상 명시하지 않습니다. 환상 서사의 심판 기록 이미지를 유지하는 것이 우선입니다.
  doctrine_reference: Apocalyptic imagery should remain explicit without over-identification.
- issue: ‘양들의 주님’의 신학적 함의
  chosen_reading: 양들의 주님을 하나님의 심판자적 호칭으로 직역했습니다.
  alternative_readings:
  - 양들의 주인
  - 목자들의 주님
  rationale: 이 표현은 우화 속에서 하나님을 가리키는 핵심 칭호이므로, 완화하지 않고 직접 옮겨 하나님의 감독과 심판을 드러냅니다.
  doctrine_reference: Preserve allegorical divine titles and judgment imagery.
