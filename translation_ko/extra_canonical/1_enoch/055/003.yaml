base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/003.yaml
  text: When I desired to deliver them into the hand of the angels on the day of tribulation and pain[a], I will cause my punishment and my wrath to abide upon them, says God[d][c][b], the Lord of spirits.
  footnotes:
  - marker: a
    text: The Ge'ez wording is difficult at the transition before 'my punishment and my wrath.' The sense appears to move from being handed over to angels to the settling of divine judgment upon them.
    reason: textual_variant
  - marker: b
    text: Literally, 'into the hand of the angels,' a judicial idiom for being given into another's power.
    reason: cultural_note
  - marker: c
    text: Or 'to give them over into the hand of the angels on the day of tribulation and pain, then'.
    reason: previous_rendering
  - marker: d
    text: Or 'says the Lord, the Lord of spirits'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그들을 환난과 고통의 날에 천사들의 손에 넘기기를 원했을 때, 나는 내 형벌과 내 진노를 그들 위에 머물게 할 것입니다. 하나님, 곧 영들의 주께서 말씀하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈቀድኩ
  english_pob_choice: I wished
  chosen_korean: 내가 ... 원했을 때
  alternatives_korean:
  - 내가 ... 바라했을 때
  - 내가 ... 뜻했을 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 의지·소원의 뉘앙스를 살리면서, 예언적 회고 구조에 맞게 자연스러운 한국어로 옮겼습니다.
- source_word: አጽንዖሙ
  english_pob_choice: to give them over
  chosen_korean: 그들을 ... 넘기기를
  alternatives_korean:
  - 그들을 ... 건네기를
  - 그들을 ... 맡기기를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘손에’라는 관용구와 함께 판단적·법정적 이양의 의미를 살리기 위해 ‘넘기다’를 택했습니다.
- source_word: በእደ መላእክት
  english_pob_choice: into the hand of the angels
  chosen_korean: 천사들의 손에
  alternatives_korean:
  - 천사들의 권세에
  - 천사들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘손에’라는 원문의 이미지를 유지해 심판의 관용적 표현을 보존했습니다.
- source_word: መቅሠፍተየ / መዐትየ
  english_pob_choice: my punishment and my wrath
  chosen_korean: 내 형벌과 내 진노
  alternatives_korean:
  - 내 징벌과 내 분노
  - 내 재앙과 내 노여움
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 문맥에서 각각의 법정적·정서적 강도를 구분해 ‘형벌’과 ‘진노’로 옮겼습니다.
- source_word: አኃድር ዲቤሆሙ
  english_pob_choice: I will cause ... to abide upon them
  chosen_korean: 그들 위에 머물게 할 것입니다
  alternatives_korean:
  - 그들 위에 거하게 할 것입니다
  - 그들 위에 임하게 할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘정착하여 계속 머물다’는 지속성을 살리되, 한국어로는 ‘머물게 하다’가 가장 자연스럽고 문맥상 강합니다.
- source_word: እግዚአብሔር እግዚአ መናፈስት
  english_pob_choice: says God, the Lord of spirits
  chosen_korean: 하나님, 곧 영들의 주께서 말씀하십니다
  alternatives_korean:
  - 하나님, 영들의 주께서 말씀하십니다
  - 주 하나님, 곧 영들의 주께서 말씀하십니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 두 칭호를 구분해 첫 항은 ‘하나님’, 둘째는 ‘영들의 주’로 살렸고, ‘곧’으로 동격을 명확히 했습니다.
theological_decisions:
- issue: 천사들의 손에 넘겨짐과 하나님의 직접적 심판의 관계
  chosen_reading: 천사들에게 넘겨지는 법정적 이양과, 그들 위에 머물게 되는 하나님의 형벌·진노를 함께 보존했습니다.
  alternative_readings:
  - 천사들이 곧 심판 자체라는 읽기
  - 천사적 매개 없이 곧바로 하나님의 진노만 보는 읽기
  rationale: 원문은 매개적 행위와 직접적 신적 행위를 구별하므로, 둘을 합치지 않고 긴장을 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 심판의 매개성과 직접성을 함께 보존
