base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/001.yaml
  text: And after this the Head of Days relented and said[a], “In vain I have destroyed all those who dwell on the dry land.”
  footnotes:
  - marker: a
    text: Or 'relented' or 'changed his mind.' The Ge'ez verb can express a reversal or regret, and with a divine subject the nuance may be less moral than English 'repented' can suggest.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 일 뒤에 연륜의 우두머리가 뜻을 돌이키며 말하셨습니다[a]. “헛되이 내가 마른 땅에 사는 모든 자를 멸하였도다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘뜻을 돌이키며’ 또는 ‘마음을 바꾸며’. 게에즈 동사는 방향 전환이나 후회의 뉘앙스를 가질 수 있으며, 신적 주어에 대해서는 영어의 ‘repented’보다 덜 도덕적인 의미일 수 있습니다.
    reason: lexical_alternative
