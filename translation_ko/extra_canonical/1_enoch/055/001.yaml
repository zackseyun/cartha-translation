  naturalness: ‘연륜의 우두머리’는 현대 한국어에서 자연스러운 칭호가 아니며, ‘뜻을 돌이키며 말하셨습니다’도 완료된 두 행위를 연결하는 문맥에는 ‘뉘우치시고 말씀하셨습니다’가 자연스럽습니다. 직접 인용의 ‘멸하였도다’는 요청된 현대 합쇼체와 어조가 맞지 않으므로 ‘멸하였구나’로 조정합니다.
