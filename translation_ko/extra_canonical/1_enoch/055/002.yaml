base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/002.yaml
  text: And he swore by his great name that from this time onward he would not do thus to all who dwell upon the dry land[a]; and I will set a sign in the heavens, and it will be a pledge of faithfulness between me and them forever, for as long as the days of heaven are upon the earth[c][b]; and this is by my command.
  footnotes:
  - marker: a
    text: The 'sign in the heavens' likely echoes the flood-sign tradition, but the verse itself does not explicitly name the sign.
    reason: cross_reference
  - marker: b
    text: The noun rendered 'pledge of faithfulness' can also be understood more broadly as 'faithfulness' or, by contextual extension, a covenantal pledge.
    reason: lexical_alternative
  - marker: c
    text: The closing phrase may also be rendered 'this is according to my ordinance' or 'this is my decree.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기의 큰 이름으로 맹세하며, 이제부터는 마른 땅 위에 사는 모든 자들에게 이와 같이 하지 않겠다고 하셨습니다[a]. 그리고 나는 하늘에 표징을 세울 것이며, 그것은 나와 그들 사이에 영원한 신실함의 보증이 될 것입니다[c][b]. 하늘의 날들이 땅 위에 있는 동안 내내 그러할 것이니, 이는 내 명령에 따른 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 하늘의 표징이 아마 홍수 표징 전승을 반영하는 것으로 보이지만, 이 절 자체는 그 표징의 이름을 밝히지 않습니다.
    reason: cross_reference
  - marker: b
    text: 여기서 '신실함의 보증'으로 옮긴 명사는 더 넓게는 '신실함'이나 문맥상 '언약적 보증'으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 끝맺는 구절은 '이는 내 규례입니다' 또는 '이는 내 칙령입니다'로도 옮길 수 있습니다.
    reason: lexical_alternative
