  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 맹세의 행위를 직접 드러내면서도 한국어 문장 흐름에 자연스럽게 맞추었습니다.
- source_word: በስሙ ዐቢይ
  english_pob_choice: by his great name
  chosen_korean: 자기의 큰 이름으로
  alternatives_korean:
  - 자기의 위대한 이름으로
  - 그의 큰 이름으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: oath 공식의 격식을 살리되, '큰 이름'을 직역해 원문의 수식어를 보존했습니다.
- source_word: ትእምርተ
  english_pob_choice: a sign
  chosen_korean: 표징
  alternatives_korean:
  - 표
  - 징표
  - 표시
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘에 두는 눈에 보이는 징표라는 성격을 살리기 위해 단순한 '표'보다 약간 더 서술적인 '표징'을 택했습니다.
- source_word: ሃይማኖተ
  english_pob_choice: a pledge of faithfulness
  chosen_korean: 신실함의 보증
  alternatives_korean:
  - 신실함
  - 신의의 보증
  - 언약적 보증
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 'pledge of faithfulness'를 따라, 추상적 '신실함'과 관계적 효력을 함께 드러내는 '보증'으로 옮겼습니다.
- source_word: ዝ በትእዛዝየ ውእቱ
  english_pob_choice: this is by my command
  chosen_korean: 이는 내 명령에 따른 것입니다
  alternatives_korean:
  - 이는 내 명령입니다
  - 이는 내 규정에 따른 것입니다
  - 이는 내 칙령입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 마지막 절의 권위 있는 종결을 살리되, 원문의 'by my command'를 지나치게 법정적이지 않게 옮겼습니다.
theological_decisions:
- issue: 하늘의 표징을 언약 용어로 얼마나 강하게 풀 것인가
  chosen_reading: 본문에는 '나와 그들 사이에 영원한 신실함의 보증'이라고 두어, 언약적 함의는 살리되 '언약'을 본문 핵심어로 직접 넣지는 않았습니다.
  alternative_readings:
  - 나와 그들 사이의 언약
  - 나와 그들 사이의 언약적 표징
  rationale: 에티오피아어의 ሃይማኖተ는 더 직접적인 '언약' 용어가 아니므로, POB의 audit trail에 맞춰 신실함/보증의 긴장을 유지했습니다.
  doctrine_reference: 원문이 주는 신학적 긴장을 보존하고, 익숙한 성경 문구로 과도하게 조화시키지 않습니다.
- issue: 마지막 절의 명령 표현을 어떻게 이해할 것인가
  chosen_reading: '''이는 내 명령에 따른 것입니다''로, 하나님의 주권적 선언으로 이해했습니다.'
  alternative_readings:
  - 이는 내 규례입니다
  - 이는 내 칙령입니다
  rationale: 원문의 በትእዛዝየ는 단순한 설명보다 신적 명령권을 드러내므로, 한국어에서도 권위 있는 종결로 처리했습니다.
  doctrine_reference: 신적 말씀의 권위를 약화시키지 않되, 원문에 없는 추가 교리적 용어는 넣지 않습니다.
