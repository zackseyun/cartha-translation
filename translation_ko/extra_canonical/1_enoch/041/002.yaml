theological_decisions:
- issue: ‘거룩한 자들’의 지시 대상
  chosen_reading: 대상을 한정하지 않고 ‘거룩한 자들’로 넓게 옮겼습니다.
  alternative_readings:
  - 성도들
  - 천사들
  - 의인들
  rationale: 에녹 문맥에서는 천상 존재와 성별된 사람의 범주가 겹칠 수 있으므로, 본문이 명시하지 않는 구분을 미리 확정하지 않았습니다.
  doctrine_reference: 본문의 해석상 긴장을 보존함.
- issue: ‘영들의 주님’의 고유 호칭
  chosen_reading: 고유한 신적 칭호로서 ‘영들의 주님’을 유지했습니다.
  alternative_readings:
  - 영들의 하나님
  - 영들의 주인
  rationale: 이 표현은 에녹서의 정형화된 호칭이므로, 일반적인 ‘하나님’으로 풀어 쓰기보다 원문의 특수성을 드러냈습니다.
  doctrine_reference: 에녹서의 신명칭 보존
