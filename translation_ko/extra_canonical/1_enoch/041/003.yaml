- from: 그리고 거기서 내 눈은 번개와 천둥의 숨겨진 보고, 그리고 바람의 숨겨진 보고를 보았습니다. 그것들이 어떻게 나뉘어 땅 위에 불게 되는지, 또 구름과 이슬의 숨겨진 보고도 보았습니다. 그리고 거기에서 그것들이 그곳으로부터 나오는 것을 보았고, 거기서 땅의 먼지를 적십니다.[a][b][c]
  to: 그리고 그곳에서 내 눈으로 번개와 천둥의 감추어진 저장고들[a]과 바람의 감추어진 저장고들, 곧 그것들의 입들이[b] 땅 위로 불도록 어떻게 나뉘어 있는지, 또 구름과 이슬의 감추어진 저장고들을 보았습니다. 그리고 그곳에서 그것들이 어디에서 오는지를 보았으며, 그곳에서 땅의 티끌이 흠뻑 젖습니다.[c]
  rationale: 원문의 문법과 연쇄를 우선하여, 바람의 ‘입’이라는 이미지를 본문에 복원하고, ‘그곳에서 그것들이 어디에서 오는지’라는 장소·의문 관계를 바로잡았습니다. 마지막 절은 자동사적 독해를 본문에 반영하되, 능동적 독해 가능성은 각주에 보존했습니다. 모든 문장을 현대 표준 한국어의 합쇼체로 다듬었습니다.
