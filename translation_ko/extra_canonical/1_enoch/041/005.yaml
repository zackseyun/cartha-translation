  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체가 나오고 들어가는 하늘의 방이라는 이미지를 살리기 위해, 재정적 뉘앙스가 강한 ‘보물창고’보다 중립적이고 구체적인 ‘창고들’을 택했습니다.
- source_word: እምአይቴ ይወፅኡ / ወአይቴ ይገብኡ
  english_pob_choice: where they come out and where they go in
  chosen_korean: 그들이 어디서 나와 어디로 들어가는지
  alternatives_korean:
  - 그들이 어디에서 나오고 어디로 들어가는지
  - 그들이 나오는 곳과 들어가는 곳
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘나오다/들어가다’는 기본 운동 동사를 살려, 발·몰이의 해석을 과도하게 좁히지 않고 원문의 환시적 이미지를 유지했습니다.
- source_word: ስቡሕ
  english_pob_choice: glorious
  chosen_korean: 영광스러운
  alternatives_korean:
  - 찬란한
  - 화려한
  - 영화로운
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 태양과 달의 귀환에 붙는 고양된 표현을 자연스럽게 옮기되, ‘영광’ 어휘로 본문의 신학적 울림을 보존했습니다.
- source_word: አፎ ይከብር አሐዱ ለካልኡ
  english_pob_choice: one is more honored than the other
  chosen_korean: 하나가 다른 것보다 어떻게 더 존귀한지를
  alternatives_korean:
  - 하나는 다른 것보다 더 존귀한지를
  - 하나가 다른 것보다 더 높임을 받는지를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아포(አፎ)의 의문성을 살리기 위해 ‘어떻게’를 넣었고, ክብር 계열의 의미는 ‘존귀하다’로 옮겨 비교의 뉘앙스를 유지했습니다.
- source_word: ምሕዋሮሙ
  english_pob_choice: their course
  chosen_korean: 궤도
  alternatives_korean:
  - 길
  - 경로
  - 순환
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체 운동의 맥락에서 ‘궤도’가 가장 자연스럽지만, 현대 과학어처럼 지나치게 환원되지 않도록 문장 전체에서 환시적 문맥을 유지했습니다.
- source_word: ሃይማኖተ የዐቅቡ በመሐላ
  english_pob_choice: keep faith with one another by an oath
  chosen_korean: 맹세로 서로에 대한 신의를 지킵니다
  alternatives_korean:
  - 맹세로 서로에게 신의를 지킵니다
  - 맹세로 서로의 믿음을 지킵니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ሃይማኖት을 교리적 ‘믿음’으로 좁히지 않고, 관계적·언약적 의미를 살린 ‘신의’로 옮겼습니다. ‘맹세로’는 በመሐላ의 수단적 의미를 반영합니다.
theological_decisions:
- issue: 천체의 질서를 단순한 기계적 규칙으로 완화할지 여부
  chosen_reading: ‘복되며’, ‘존귀한’, ‘신의를 지킨다’를 유지해, 우주 질서를 창조 질서에 대한 순종과 언약적 충실성으로 읽었습니다.
  alternative_readings:
  - ‘규칙적이며’, ‘일정하며’, ‘그들의 궤도를 따른다’로 중립화
  rationale: 게에즈 원문과 영어 POB는 천체의 운동을 단순 관측이 아니라 신학적으로 충만한 순종의 질서로 묘사합니다. 이를 평면적 천문 설명으로 낮추면 본문의 apocalyptic한 긴장이 약해집니다.
  doctrine_reference: 창조는 하나님의 질서 아래 있으며, 피조세계의 순종을 언약적 언어로 묘사하는 묵시문학의 표현을 보존합니다.
