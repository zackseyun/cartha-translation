base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/001.yaml
  text: And after this I saw all the hidden things of the heavens[a], and how the kingdom is divided[c][b], and how the deeds of human beings are weighed in the balance.
  footnotes:
  - marker: a
    text: Or 'all the secrets of the heavens.' The Ge'ez term can denote things hidden from ordinary sight or knowledge.
    reason: lexical_alternative
  - marker: b
    text: The clause 'how the kingdom is divided' is difficult. It may refer to the ordering or apportionment of the heavenly realm.
    reason: alternative_reading
  - marker: c
    text: Literally, the text speaks of human activity being weighed with balance imagery, suggesting judgment or assessment.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이 일 뒤에 나는 하늘의 모든 숨은 것들과[a] 나라가 어떻게 나뉘는지[b], 또 사람의 행위가 저울로 어떻게 달리는지를 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 모든 비밀들’. Ge'ez 어휘는 일반적으로 보이지 않거나 알려지지 않은 것들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나라가 어떻게 나뉘는지’라는 절은 어렵습니다. 하늘 영역의 질서나 배분을 가리킬 수 있습니다.
    reason: alternative_reading
