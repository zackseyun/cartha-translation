translation:
  language: ko
  text: 그곳에는 천둥의 소리와 번개의 빛이 보관되어 있으며, 그곳에는 우박의 창고들과 서리의 창고들, 안개의 창고들, 비와 이슬의 창고들이 보관되어 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
