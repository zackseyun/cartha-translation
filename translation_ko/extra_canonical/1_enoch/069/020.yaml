base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/020.yaml
  text: And by that oath the sun and the moon complete their courses[d][c][b][a], and they do not transgress their command forever.
  footnotes:
  - marker: a
    text: Or 'their circuits.' The Ge'ez term refers to the regular movement of the heavenly bodies.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not overstep their command/ordinance.' The wording presents the sun and moon as remaining within the limit imposed on them.
    reason: lexical_alternative
  - marker: c
    text: The final phrase may also be understood as 'forever' or 'from of old'; the Ge'ez expression carries a broad sense of enduring time.
    reason: alternative_reading
  - marker: d
    text: Or 'and they do not transgress their command from eternity.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 맹세로 말미암아 해와 달은 각자의 운행을 마치며[a], 자신들에게 내려진 명령에서 결코 벗어나지 않습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각자의 궤도’ 또는 ‘각자의 길’. 게에즈어는 천체의 규칙적인 운행·순환을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 명령에서 넘어서지 않습니다/벗어나지 않습니다’. 여기서 ‘그들의 명령’은 해와 달에 내려진 명령을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 표현은 부정문과 함께 ‘결코’라는 뜻의 절대적 부정으로 이해될 수 있습니다. 문맥에 따라 지속적인 시간성, 곧 ‘영원히’ 또는 ‘태고부터’의 뉘앙스로도 설명됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ማሐላ / by that oath
  english_pob_choice: by that oath
  chosen_korean: 그 맹세로 말미암아
  alternatives_korean:
  - 그 맹세로
  - 그 맹세를 통해
  - 그 맹세에 의해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 맹세의 수단·근거를 드러내는 표현을 살리되, 한국어에서는 ‘말미암아’가 원인/매개를 자연스럽게 전달합니다.
- source_word: ይፌጽሙ / complete
  english_pob_choice: complete
  chosen_korean: 완수하며
  alternatives_korean:
  - 완성하며
  - 마치며
  - 이행하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 태양과 달의 정해진 운동을 ‘완성’하기보다, 맡겨진 주기를 끝까지 ‘완수’하는 뉘앙스가 더 잘 맞습니다.
- source_word: ምሕዋሮሙ / their courses
  english_pob_choice: their courses
  chosen_korean: 자기의 궤도
  alternatives_korean:
  - 자기의 순환
  - 자기의 회전
  - 자기의 길
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체의 규칙적 운동을 가리키므로, 현대 한국어에서 가장 직접적이고 이해하기 쉬운 표현은 ‘궤도’입니다.
- source_word: ወኢየሐልፉ / do not transgress
  english_pob_choice: do not transgress
  chosen_korean: 어기지 않습니다
  alternatives_korean:
  - 벗어나지 않습니다
  - 넘지 않습니다
  - 위반하지 않습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥은 천체가 부여된 한계를 넘지 않는다는 뜻이므로, 한국어에서는 법적·규범적 뉘앙스를 담는 ‘어기다’가 적절합니다.
theological_decisions:
- issue: ‘맹세’와 ‘명령’이 우주 질서에 부여된 준법/한계의 언어를 유지할지 여부
  chosen_reading: 우주적 운동을 단순한 천문 묘사가 아니라, 맹세 아래 정해진 질서에 대한 순종의 언어로 유지했습니다.
  alternative_readings:
  - 중립적으로 ‘궤도를 따른다’고만 옮길 수 있습니다.
  - ‘질서’나 ‘규칙’으로 완화할 수 있습니다.
  rationale: 본문은 해와 달의 규칙성이 맹세와 명령의 틀 안에 놓여 있음을 말하므로, 그 긴장을 약화하지 않는 번역이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
