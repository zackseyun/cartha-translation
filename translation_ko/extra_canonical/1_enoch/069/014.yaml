  - 그 감추어진 이름
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ኅቡአ는 기술적 신비 용어라기보다 '숨겨진/감추어진'의 뜻이므로, 주석의 경계를 보존하기 위해 '숨겨진'을 선택했습니다.
