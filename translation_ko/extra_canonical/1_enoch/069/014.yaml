  chosen_korean: 그 이름과 맹세 앞에서 떨게 하려는 것이었습니다
  alternatives_korean:
  - 그 이름과 맹세를 두려워하게 하려는 것이었습니다
  - 그 이름과 맹세 때문에 떨게 하려는 것이었습니다
