base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/014.yaml
  text: This one asked Mikael to show him the hidden name[a], so that they might remember it in the oath, and so that they might tremble before that name and oath[d][c][b], those who revealed to the children of men all that is hidden.
  footnotes:
  - marker: a
    text: Or 'the secret name.' The Ge'ez adjective means hidden or concealed; the verse does not require a later mystical technical sense.
    reason: lexical_alternative
  - marker: b
    text: '''In the oath'' may also imply invocation of the name within a solemn adjuration, not mere recollection.'
    reason: lexical_alternative
  - marker: c
    text: 'The closing clause likely identifies those who are to tremble: the ones who disclosed hidden things to humankind.'
    reason: alternative_reading
  - marker: d
    text: Or 'This one said to Mikael, “Show him'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 이는 미카엘에게 그 숨겨진 이름[a]을 보여 주라고 말했습니다. 그것은 그들이 그 맹세 안에서 그것을 기억하게 하고, 또 그 이름과 맹세 앞에서 떨게 하려는 것이었습니다[b][d][c]. 그는 사람의 자손들에게 모든 숨은 것을 드러낸 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그 비밀 이름'입니다. 게으즈 형용사는 '숨겨진/감추어진'의 뜻이며, 이 절은 후대의 신비주의적 전문용어를 반드시 요구하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: '''그 맹세 안에서''는 맹세를 단순히 기억하는 것뿐 아니라, 엄숙한 맹세의 발화 안에서 이름을 부르는 뜻을 포함할 수도 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 두려움의 대상이 누구인지를 밝히는 말일 가능성이 큽니다. 즉, 숨은 것들을 사람에게 드러낸 자들입니다.
    reason: alternative_reading
  - marker: d
    text: 또는 '이 이는 미카엘에게 “그에게 보여 주라”라고 말했습니다'로도 읽을 수 있습니다.
    reason: previous_rendering
