  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Geʿez의 3인칭 사역적 요청 구조를 살려 직설 명령이 아니라 간접 요청으로 옮겼습니다. 인명은 프로젝트 정책에 따라 게으즈형 '미카엘'을 유지했습니다.
- source_word: ስመ ኅቡአ
  english_pob_choice: the hidden name
  chosen_korean: 그 숨겨진 이름
  alternatives_korean:
