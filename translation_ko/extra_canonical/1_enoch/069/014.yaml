theological_decisions:
- issue: 마지막 관계절의 지시 대상
  chosen_reading: '''그는 사람의 자손들에게 모든 숨은 것을 드러낸 자들입니다''로 읽어, 두려움의 대상이 되는 이들을 바로 앞 관계절과 연결했습니다.'
  alternative_readings:
  - 맥락상 더 넓게 '그들에게'를 일반 청자로 볼 수 있음
  - 문법적으로 주어가 압축되어 있어 중간에 화제가 이동했을 가능성도 있음
  rationale: 영어 POB의 주석처럼, 문맥상 이들은 인류에게 금지된 비밀을 드러낸 존재들로 이해하는 것이 서사적·심판적 흐름에 가장 잘 맞습니다.
  doctrine_reference: 압축된 구문은 하나의 해석을 본문에 반영하되, 다른 가능성은 주석으로 보존합니다.
