base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
  footnotes:
  - marker: a
    text: Or 'were strengthened.' The Ge'ez verb can express becoming firm or being established.
    reason: lexical_alternative
  - marker: b
    text: '''From their place'' could also be rendered ''from their stations,'' which may emphasize fixed cosmic positions.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they were made strong, and they stood firm and were not moved'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 맹세로 그 깊음들이 견고하게 되었고[a], 그것들은 자기 자리에서 세세토록[b] 움직이지 않고 서 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘견고하게 되었고’는 ‘강하게 되었다’ 또는 ‘세워졌다’로도 옮길 수 있습니다. 게에즈 동사는 ‘굳어짐’과 ‘확립됨’의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자리’는 ‘자기 자리들’ 또는 ‘정해진 위치들’로도 옮길 수 있어, 고정된 우주적 위치를 더 분명히 나타낼 수 있습니다.
    reason: lexical_alternative
