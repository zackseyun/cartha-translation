base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
  footnotes:
  - marker: a
    text: Or 'were strengthened.' The Ge'ez verb can express becoming firm or being established.
    reason: lexical_alternative
  - marker: b
    text: '''From their place'' could also be rendered ''from their stations,'' which may emphasize fixed cosmic positions.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they were made strong, and they stood firm and were not moved'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 맹세로 깊은 곳들이 견고하게 되었고[a], 자기 자리에서 영원으로부터 영원까지 서 있으며 움직이지 않습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘견고하게 되었고’는 ‘강하게 되었다’ 또는 ‘확립되었다’로도 옮길 수 있습니다. 게에즈 동사는 굳어지거나 확고히 세워지는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자리’는 ‘정해진 위치’ 또는 ‘처소’로도 옮길 수 있으며, 고정된 우주적 위치를 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  english_pob_choice: oath
  chosen_korean: 맹세
  alternatives_korean:
  - 서약
  - 맹세문
  lexicon: Dillmann
  rationale: 문맥상 결속력을 가진 선포이므로 단순한 ‘말함’이 아니라 맹세의 의미를 살려 옮겼습니다.
- source_word: ቀላይ
  english_pob_choice: the depths
  chosen_korean: 그 깊음들
  alternatives_korean:
  - 깊은 곳들
  - 심연들
  lexicon: Dillmann
  rationale: 주어를 빠뜨리지 않기 위해 ‘깊음들’로 옮겼고, 복수 동사들과 맞도록 다중의 우주적 깊이를 드러냈습니다.
- source_word: ፀንዐት
  english_pob_choice: were made firm
  chosen_korean: 견고하게 되었고
  alternatives_korean:
  - 강하게 되었고
  - 굳게 되었고
  - 튼튼하게 되었고
  lexicon: Dillmann
  rationale: ‘굳어 서 있는 상태’보다 ‘견고해짐’이 성립·고정의 결과를 더 잘 보존합니다.
- source_word: ወኢይትሐወሱ
  english_pob_choice: do not move
  chosen_korean: 움직이지 않고
  alternatives_korean:
  - 흔들리지 않고
  - 옮겨지지 않고
  lexicon: Dillmann
  rationale: 현재적 지속성을 반영해 ‘움직이지 않고’로 옮겼으며, 단순 과거형처럼 읽히지 않도록 했습니다.
theological_decisions:
- issue: 우주적 실재가 맹세로 고정되었다는 이미지의 보존 여부
  chosen_reading: 이 구절은 맹세의 힘으로 ‘깊음들’이 제자리에 고정되어 지속하는 우주론적 장면을 말합니다.
  alternative_readings:
  - 맹세 자체가 견고하다고 말하는 추상적 진술
  - 단순히 질서가 안정되었다는 비유적 표현
  rationale: 복수 동사와 ‘그 자리에서’가 함께 나오므로, 추상화하기보다 실제로 고정된 대상들이라는 이미지를 살리는 것이 원문에 더 가깝습니다.
  doctrine_reference: 문맥의 묵시적 우주 질서를 평이한 교훈문으로 약화시키지 않도록 보존합니다.
