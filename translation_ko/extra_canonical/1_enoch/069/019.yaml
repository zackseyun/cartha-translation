theological_decisions:
- issue: 우주적 실재가 맹세로 고정되었다는 이미지의 보존 여부
  chosen_reading: 이 구절은 맹세의 힘으로 ‘깊음들’이 제자리에 고정되어 지속하는 우주론적 장면을 말합니다.
  alternative_readings:
  - 맹세 자체가 견고하다고 말하는 추상적 진술
  - 단순히 질서가 안정되었다는 비유적 표현
  rationale: 복수 동사와 ‘그 자리에서’가 함께 나오므로, 추상화하기보다 실제로 고정된 대상들이라는 이미지를 살리는 것이 원문에 더 가깝습니다.
  doctrine_reference: 문맥의 묵시적 우주 질서를 평이한 교훈문으로 약화시키지 않도록 보존합니다.
