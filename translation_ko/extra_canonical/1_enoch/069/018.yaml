base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/018.yaml
  text: And by that oath the sea was created[a], and as its foundation for the time of wrath he set sand for it[c][b], and it does not pass beyond it from the creation of the world and forever.
  footnotes:
  - marker: a
    text: The phrase rendered 'for the time of wrath' is difficult in the Ge'ez and may also be understood more generally as 'for a time of judgment.'
    reason: lexical_alternative
  - marker: b
    text: '''Its foundation'' likely refers to the sea''s fixed boundary or base; the image is that sand has been set as the limit it may not cross.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he set for it sand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 맹세로 바다가 창조되었으며[a], 그 바다의 기초로서 진노의 때를 위하여 모래를 그 바다에 두셨고[c][b], 바다가 창조된 때부터 영원까지 그것을 넘어가지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez의 ‘진노의 때’는 더 넓게 ‘심판의 때’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기초’는 바다의 고정된 경계 또는 받침을 가리키는 것으로 보이며, 모래가 넘어가지 못할 한계로 놓였다는 이미지를 담습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그에게 모래를 두셨고’로도 옮길 수 있습니다.
    reason: previous_rendering
