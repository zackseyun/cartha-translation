  - 그것을 통과하지 못합니다
  lexicon: Dillmann Lexicon
  rationale: 경계 초월 금지를 한국어로 가장 분명하게 전달하는 표현을 택했습니다.
theological_decisions:
- issue: ‘for the time of wrath’의 해석 범위
  chosen_reading: ‘진노의 때’로 유지하여, 단순한 자연 묘사로 축소하지 않고 종말론적·심판적 색채를 남겼습니다.
  alternative_readings:
  - ‘심판의 때’로 해석을 좁히는 것
  - 해당 구를 अस्प명확하다고 보고 약화시키는 것
  rationale: 본문은 바다의 경계 설정을 창조 질서와 심판 이미지를 함께 걸고 있으므로, 모호성을 제거하기보다 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 아포칼립스적 상징의 긴장 보존
- issue: ‘기초’와 ‘모래’의 관계
  chosen_reading: ‘기초로서 모래를… 두셨고’로 읽어, 물리적 경계와 창조 질서의 이중 이미지를 유지했습니다.
  alternative_readings:
  - ‘경계로서 모래를 두셨고’
  - ‘기초를 세우셨고’로 일반화하는 것
  rationale: 원문은 바다에 대한 제한 장치와 그 밑받침 이미지를 함께 제시하므로, 둘 중 하나로 평탄화하지 않았습니다.
  doctrine_reference: 창조 질서와 경계 설정의 동시 보존
