  lexicon: Dillmann Lexicon
  rationale: ‘두다/배치하다’의 동작을 자연스럽게 살리면서, 모래가 바다의 경계 기능을 한다는 해석 가능성도 남겨 두었습니다.
- source_word: ወኢትኅልፍ
  english_pob_choice: it does not pass beyond it
  chosen_korean: 그것을 넘어가지 못합니다
  alternatives_korean:
