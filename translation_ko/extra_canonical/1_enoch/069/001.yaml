theological_decisions:
- issue: ἐσμέν/게즈의 복수 주어와 ‘심판’의 관계
  chosen_reading: ‘심판’은 뒤따르는 동사의 주어가 아니라 시간 부사구의 일부로 처리했습니다.
  alternative_readings:
  - ‘심판이 그들을 두렵게 하고 압제할 것입니다’
  - ‘이후, 심판은 그들을 두렵게 하고 몰아낼 것입니다’
  rationale: 게즈 문법상 복수 인칭 접미사가 동사의 주어를 가리키므로, ‘심판’이 주어가 되면 문법과 충돌합니다. 따라서 사건 순서만 표시하도록 처리했습니다.
  doctrine_reference: 원문 문법 보존; 문장 주어-동사 관계 왜곡 금지
