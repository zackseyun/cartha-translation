base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/001.yaml
  text: And after this judgment[a], they will terrify them and oppress them[d][c][b], because they showed this to those who dwell upon the dry land.
  footnotes:
  - marker: a
    text: Or 'after these things.' The Ge'ez transition marks sequence in the vision.
    reason: lexical_alternative
  - marker: b
    text: '''Dry land'' is more literal than ''earth'' here and may preserve a cosmological contrast rather than simply meaning humanity in general.'
    reason: lexical_alternative
  - marker: c
    text: The referent of 'this' is left implicit in the verse and likely points back to the preceding revealed matter; the Ge'ez does not specify it here.
    reason: alternative_reading
  - marker: d
    text: Or 'And after this, the judgment will terrify them and drive them away'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 심판 후에, 그들은 그들을 두렵게 하고 압제할 것입니다. 이는 그들이 이것을 마른 땅에 사는 이들에게 보여 주었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이것’의 구체적 지시 대상은 이 절에서 명시되지 않았으며, 앞선 계시 내용을 가리킬 가능성이 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마른 땅’은 단순한 ‘세상’보다 원문의 ‘육지/마른 땅’이라는 표현을 가깝게 옮긴 것이며, 물과 대비되는 우주론적 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
