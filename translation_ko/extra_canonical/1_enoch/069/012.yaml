base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
  footnotes:
  - marker: a
    text: The repeated Ge'ez term rendered 'blows' can also be understood more broadly as 'smitings,' 'afflictions,' or harmful strikes.
    reason: lexical_alternative
  - marker: b
    text: The clause about the womb is difficult. The sense appears to be harm done in pregnancy resulting in miscarriage.
    reason: textual_variant
  - marker: c
    text: The phrase 'the blows upon the soul' is textually uncertain in this witness; the translation follows the probable reading indicated by the OCR.
    reason: textual_variant
  - marker: d
    text: Or 'the blow that happens at midday.' The final words may identify this noonday harm with a serpentine being named Taba'et.
    reason: alternative_reading
  - marker: e
    text: Or 'the blows in the womb, so that the embryo miscarries'.
    reason: previous_rendering
  - marker: f
    text: Or 'the blows upon the soul'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다섯 번째는 카스데야라고 불렸습니다. 그는 사람의 자손들에게 영과 악귀들의 온갖 악한 타격과, 태아가 유산하게 하는 배 안의 타격과, 영에 대한 타격, 곧 뱀의 이빨, 그리고 정오에 오는 타격—이름이 타바엣인 뱀의 아들—을 보인 자입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Geʽez의 반복되는 용어는 여기서 ‘타격’으로 옮겼지만, 더 넓게는 ‘때림’, ‘치기’, ‘재앙적 가해’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 배/자궁의 구절은 난해합니다. 의미는 임신 중의 손상과 그로 인한 유산으로 보입니다.
    reason: textual_variant
  - marker: c
    text: ‘영에 대한 타격’은 이 증언본에서 본문이 불확실하며, 번역은 OCR이 제시하는 가장 그럴듯한 읽기를 따릅니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘정오에 일어나는 타격’일 수 있습니다. 마지막 말은 이 정오의 해악을 타바엣이라는 뱀 존재와 연결하는 것으로 보입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ስሙ ካስድያእ
  english_pob_choice: was named Kasdeya
  chosen_korean: 카스데야라고 불렸습니다
  alternatives_korean:
  - 카스데야였습니다
  - 이름이 카스데야였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고유명사는 음역하고, 이름 붙임의 서술을 자연스러운 한국어 수동형으로 옮겨 목록의 도입부를 살렸습니다.
- source_word: ለውሉደ ሰብእ
  english_pob_choice: the children of men
  chosen_korean: 사람의 자손들에게
  alternatives_korean:
  - 인자들에게
  - 인류에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시문학적 관용구를 완전히 평범한 현대어로 낮추지 않으면서, 한국어로는 이해 가능한 문맥을 위해 ‘사람의 자손들’로 옮겼습니다.
- source_word: ኵሎ ዝብጠታተ እኩየ
  english_pob_choice: all the evil blows
  chosen_korean: 온갖 악한 타격
  alternatives_korean:
  - 온갖 악한 때림
  - 모든 악한 치기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 ‘blows/smitings’의 물리적·가해적 이미지를 유지하기 위해 ‘타격’을 택했고, 악의 성격은 ‘악한’으로 분명히 했습니다.
- source_word: ዘነፍሳት ወዘአጋንንት
  english_pob_choice: of spirits and of demons
  chosen_korean: 영과 악귀들의
  alternatives_korean:
  - 영들과 악귀들의
  - 영적 존재들과 악귀들의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 범주를 구분해 유지하되, 한국어에서 어색한 반복을 줄이기 위해 소유격 구조로 압축했습니다.
- source_word: ባእባአ ማሕፀን
  english_pob_choice: in the womb
  chosen_korean: 배 안의
  alternatives_korean:
  - 자궁 안의
  - 태중의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 난해한 자궁/임신 이미지를 한국어에서 과도하게 해부학적으로 고정하지 않으면서도, 뒤의 ‘태아’와 연결되도록 ‘배 안’으로 옮겼습니다.
- source_word: ከመ ይደቅ
  english_pob_choice: so that the embryo miscarries
  chosen_korean: 태아가 유산하게 하는
  alternatives_korean:
  - 배아가 유산하게 하는
  - 아이를 떨어뜨리게 하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결과를 분명히 드러내기 위해 ‘유산’으로 옮겼고, 생식·임신 맥락을 살리기 위해 ‘태아’를 선택했습니다.
- source_word: ዘነፍስ
  english_pob_choice: the blow upon the soul
  chosen_korean: 영에 대한 타격
  alternatives_korean:
  - 영혼에 대한 타격
  - 생명에 대한 타격
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 구절의 본문이 불확실하다는 POB 주석을 반영해, ‘soul’을 곧바로 교리적 ‘영혼’으로 고정하지 않고 더 열린 ‘영’으로 유지했습니다.
- source_word: ንስክተ አርዌ
  english_pob_choice: the bite of the serpent
  chosen_korean: 뱀의 이빨
  alternatives_korean:
  - 뱀의 물림
  - 뱀의 물기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기존 영어는 ‘bite’이지만, 바로 뒤의 병렬적 재앙 목록 안에서 신체적 해를 간결하게 표현하는 방식으로 한국어에서는 ‘이빨’이 아니라 ‘물림’보다 더 직접적인 가해상을 살릴 수 있으나, 여기서는 본문 흐름상 병렬성을 위해 ‘뱀의 이빨’로 옮겨 파괴적 상징성을 유지했습니다.
- source_word: ዘይከውን በቀትር
  english_pob_choice: that comes at noon
  chosen_korean: 정오에 오는
  alternatives_korean:
  - 한낮에 오는
  - 오정에 오는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간 표현은 문자적으로 보존해, 정오라는 불길한 시점을 흐리지 않았습니다.
- source_word: ወልዳ ለአርዌ ዘስሙ ተባዕት
  english_pob_choice: the son of the serpent whose name is Taba'et
  chosen_korean: 이름이 타바엣인 뱀의 아들
  alternatives_korean:
  - 이름이 타바엣인 그 뱀의 아들
  - 타바엣이라는 이름의 뱀의 아들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문법적으로 압축된 마지막 구를, 정오의 타격을 수식하는 후행 동격으로 읽는 POB의 이해를 따라 한국어에서도 그 연결을 유지했습니다.
theological_decisions:
- issue: 이 구절의 ‘타격들’이 의미하는 바
  chosen_reading: 영적·악귀적 가해, 임신 중 손상, 영에 대한 손상, 뱀의 물림, 정오의 해악을 가리키는 묵시적 재앙 목록으로 유지합니다.
  alternative_readings:
  - 단순한 물리적 공격 기술
  - 주술적 지식의 중립적 목록
  rationale: 영과 악귀, 태아 유산, 뱀 이미지가 함께 나오므로 단순한 기술 정보로 완화하지 않고, 초자연적 해악의 목록으로 읽는 것이 본문과 POB 주석에 가장 충실합니다.
  doctrine_reference: 묵시문학의 악의 실재와 가해성을 희석하지 않습니다.
- issue: ‘영에 대한 타격’의 번역과 본문 불확실성
  chosen_reading: 본문의 불확실성을 반영해 ‘영에 대한 타격’으로 두되, ‘영혼’으로 교리화하지 않습니다.
  alternative_readings:
  - 영혼에 대한 타격
  - 생명에 대한 타격
  rationale: POB가 이 대목을 본문상 불확실한 읽기로 주석 처리하므로, 한국어도 의미를 좁혀 확정하지 않고 열린 표현을 유지하는 편이 적절합니다.
  doctrine_reference: 본문 비평상의 긴장을 보존합니다.
