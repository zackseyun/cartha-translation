theological_decisions:
- issue: 이 구절의 ‘타격들’이 의미하는 바
  chosen_reading: 영적·악귀적 가해, 임신 중 손상, 영에 대한 손상, 뱀의 물림, 정오의 해악을 가리키는 묵시적 재앙 목록으로 유지합니다.
  alternative_readings:
  - 단순한 물리적 공격 기술
  - 주술적 지식의 중립적 목록
  rationale: 영과 악귀, 태아 유산, 뱀 이미지가 함께 나오므로 단순한 기술 정보로 완화하지 않고, 초자연적 해악의 목록으로 읽는 것이 본문과 POB 주석에 가장 충실합니다.
  doctrine_reference: 묵시문학의 악의 실재와 가해성을 희석하지 않습니다.
- issue: ‘영에 대한 타격’의 번역과 본문 불확실성
  chosen_reading: 본문의 불확실성을 반영해 ‘영에 대한 타격’으로 두되, ‘영혼’으로 교리화하지 않습니다.
  alternative_readings:
  - 영혼에 대한 타격
  - 생명에 대한 타격
  rationale: POB가 이 대목을 본문상 불확실한 읽기로 주석 처리하므로, 한국어도 의미를 좁혀 확정하지 않고 열린 표현을 유지하는 편이 적절합니다.
  doctrine_reference: 본문 비평상의 긴장을 보존합니다.
