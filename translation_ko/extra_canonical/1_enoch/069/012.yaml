base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
  footnotes:
  - marker: a
    text: The repeated Ge'ez term rendered 'blows' can also be understood more broadly as 'smitings,' 'afflictions,' or harmful strikes.
    reason: lexical_alternative
  - marker: b
    text: The clause about the womb is difficult. The sense appears to be harm done in pregnancy resulting in miscarriage.
    reason: textual_variant
  - marker: c
    text: The phrase 'the blows upon the soul' is textually uncertain in this witness; the translation follows the probable reading indicated by the OCR.
    reason: textual_variant
  - marker: d
    text: Or 'the blow that happens at midday.' The final words may identify this noonday harm with a serpentine being named Taba'et.
    reason: alternative_reading
  - marker: e
    text: Or 'the blows in the womb, so that the embryo miscarries'.
    reason: previous_rendering
  - marker: f
    text: Or 'the blows upon the soul'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다섯째의 이름은 카스데야였습니다. 이는 사람의 자손들에게 영들과 악귀들의 모든 악한 타격들, 태아가 떨어지게 하는 태중의 타격들, 혼에 가해지는 타격, 곧 뱀의 물림, 그리고 정오에 오는 타격, 곧 이름이 타바엣인 뱀의 아들을 보여 준 자입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Geʽez의 반복되는 용어는 여기서 ‘타격’으로 옮겼지만, 더 넓게는 ‘내리침’, ‘고통’, ‘해로운 공격’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 태중/자궁에 관한 구절은 난해합니다. 임신 중에 가해진 해로움으로 태아가 떨어지는 일을 가리키는 것으로 보입니다.
    reason: textual_variant
  - marker: c
    text: ‘혼에 가해지는 타격’은 이 증언본에서 본문이 불확실하며, 번역은 OCR이 제시하는 가장 그럴듯한 읽기를 따릅니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘정오에 일어나는 타격’으로 옮길 수 있습니다. 마지막 말은 이 정오의 해악을 타바엣이라는 이름의 뱀 같은 존재와 연결하는 것으로 보입니다.
    reason: alternative_reading
