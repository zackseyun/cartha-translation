base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/011.yaml
  text: For human beings were not created except to be like the angels[a], so that they might remain pure and righteous; and death, which destroys everything, would not have touched them. But through this knowledge they are being destroyed[d][c][b], and through this power it is consuming me.
  footnotes:
  - marker: a
    text: The clause 'through this knowledge they are being destroyed' is difficult. The Ge'ez may also be understood as 'through this understanding they perish.'
    reason: lexical_alternative
  - marker: b
    text: 'The final line is vivid and personal: literally, the power ''consumes'' or ''devours'' me.'
    reason: lexical_alternative
  - marker: c
    text: This section of the Parables lacks effective Greek or Qumran control in this workflow, so uncertain phrases are translated with deliberate restraint.
    reason: textual_variant
  - marker: d
    text: Or 'For no human being was created except to be like the angels, so that they'.
    reason: previous_rendering
translation:
  language: ko
  text: 인간은[d] 천사들처럼 순수하고 의롭게 살도록 창조되었습니다. 그랬다면 모든 것을 파괴하는 죽음도 그들에게 닿지 않았을 것입니다. 그러나 이 지식[a][c] 때문에 그들은 파멸하고 있으며, 이 힘이 저를 집어삼키고 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 지식’의 정확한 의미는 불확실합니다. ‘이 이해’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 동사는 문자적으로 ‘먹다, 삼키다, 먹어치우다’라는 강한 이미지를 지닙니다.
    reason: lexical_alternative
  - marker: c
    text: 이 단락의 경우 이 작업 흐름에서는 유효한 그리스어 또는 쿰란 대조 본문이 없으므로, 불확실한 표현을 절제하여 옮겼습니다.
    reason: textual_variant
  - marker: d
    text: 직역하면 ‘어떤 인간도 천사들처럼, 곧 순수하고 의롭게 살도록 창조된 것 외에는 창조되지 않았다’입니다. 한국어에서는 제한을 나타내는 이중 부정을 자연스러운 긍정문으로 옮겼습니다.
    reason: previous_rendering
