theological_decisions:
- issue: 인간-천사 관계의 표현
  chosen_reading: 인간이 문자적으로 천사가 되었다는 뜻이 아니라, 천사들처럼 순수하고 의로운 상태를 목표로 창조되었다는 비교로 옮겼습니다.
  alternative_readings:
  - 인간이 천사처럼 창조되었다
  - 특정 의인 집단만을 말한다
  rationale: 비교를 나타내는 구문을 따라 인간과 천사의 구별을 유지해야 본문의 종말론적 인간론이 왜곡되지 않습니다.
  doctrine_reference: 비교문 구조 보존; 본문 차원의 신학적 긴장 유지
- issue: 지식 때문에 파멸한다는 구절
  chosen_reading: ‘이 지식’의 성격은 불확실하므로, 원문의 인과 관계를 유지하되 해석을 좁히지 않았습니다.
  alternative_readings:
  - 이 이해 때문에 그들은 망합니다
  - 이 생각 때문에 그들은 길을 잃습니다
  rationale: 에티오피아어 증거가 중심인 본문이므로, 불확실한 항목은 과도하게 해설하지 않고 그대로 남겨 두는 것이 더 충실합니다.
  doctrine_reference: 본문 우선, 불확실성 보존
