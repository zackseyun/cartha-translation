  chosen_korean: 물 위에
  alternatives_korean:
  - 물들 위에
  - 물 위에 걸쳐
  - 물 위에 놓여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘upon/on’의 단순한 공간 관계를 살려 우주론적 장면을 자연스럽게 표현했습니다.
- source_word: ኅቡኣተ፡ አድባር
