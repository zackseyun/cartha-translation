  - 산들의 비밀한 곳에서
  - 산들의 깊은 곳에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 산에 속한 은밀한 샘터·굴곡 같은 ‘숨은 곳’의 의미를 살리되, 한국어로는 ‘~에서’로 이어 흐름을 자연스럽게 했습니다.
- source_word: ኅሑያን፡ ማያት
  english_pob_choice: living waters
  chosen_korean: 살아 있는 물들
  alternatives_korean:
  - 생수
  - 흐르는 물들
  - 살아 있는 샘물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 이미지인 ‘living waters’를 유지해 생명력과 흐름의 은유를 보존했습니다. 다만 한국어에서는 복수·집합성을 드러내기 위해 ‘물들’로 옮겼습니다.
- source_word: ይመፅኡ
  english_pob_choice: come forth
  chosen_korean: 흘러나옵니다
  alternatives_korean:
  - 나옵니다
  - 나와 옵니다
  - 솟아납니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 현재형 반복/지속의 뉘앙스를 반영했고, 샘물 이미지에 맞게 ‘흘러나옵니다’로 구체화했습니다.
- source_word: እምፍጥረተ ዓለም ... ወእስከ፡ ለዓለም
