  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 이미지인 ‘living waters’를 유지해 생명력과 흐름의 은유를 보존했습니다. 다만 한국어에서는 복수·집합성을 드러내기 위해 ‘물들’로 옮겼습니다.
