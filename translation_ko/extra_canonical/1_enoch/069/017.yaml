  - 세상 창조 이래 영원까지
  - 세상 창조부터 영원히
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시작점에서 현재를 거쳐 끝없는 지속을 나타내는 시간 표현이므로, 간결한 한국어 관용으로 옮겼습니다.
