translation:
  language: ko
  text: 그리고 이것이 이 맹세의 능력입니다. 그것은 강력하고 견고합니다. 그리고 그가 이 맹세, 아카에를 미카엘의 손에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
