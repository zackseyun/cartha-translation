translation:
  language: ko
  text: 그리고 이것이 이 맹세의 능력입니다. 이 맹세는 강력하고 견고합니다. 그리고 그가 이 맹세, 아카에를 미카엘의 손에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘미카엘의 손에’로, 어떤 것을 맡기거나 권위 아래 두는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃይሉ
  english_pob_choice: the power
  chosen_korean: 능력
  alternatives_korean:
  - 권능
  - 힘
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 맹세의 효력과 작동력을 가리키므로, 단순한 물리적 '힘'보다 '능력'이 더 자연스럽고 의미를 잘 살립니다.
- source_word: ማሐላ
