  - 맹약
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시 대상이 앞뒤 문맥에서 반복되는 동일한 oath이므로, 법적·의례적 울림이 있는 '맹세'가 적절합니다.
- source_word: ኃያል ወፅኑዕ
  english_pob_choice: mighty and firm
  chosen_korean: 강력하고 견고합니다
  alternatives_korean:
  - 능력 있고 굳건합니다
  - 위대하고 확고합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 형용사는 맹세의 효력과 안정성을 함께 강조하므로, 한국어에서도 병렬적으로 분명한 표현으로 옮겼습니다.
- source_word: አንበሮ ለዝ ማሐላ አካእ በእዴሁ ለሚካኤል
  english_pob_choice: he placed this oath, Aka'e, into the hand of Mika'el
  chosen_korean: 그가 이 맹세, 아카에를 미카엘의 손에 두었습니다
  alternatives_korean:
  - 그가 이 맹세를 미카엘에게 맡겼습니다
  - 그가 이 맹세를 미카엘의 손안에 두었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''손에 두다''는 원문의 구체적 이미지를 보존하며, 위탁·권위 부여의 뉘앙스도 남깁니다. 고유명사 아카에는 본문에 실제로 포함되므로 보존했습니다.'
theological_decisions:
- issue: '''into the hand of Mika''el''의 관용적 의미를 본문에서 드러낼지 여부'
  chosen_reading: 직역 이미지인 '미카엘의 손에 두었습니다'를 유지했습니다.
  alternative_readings:
  - 미카엘에게 위임했습니다
  - 미카엘의 권위 아래 두었습니다
  rationale: 묵시문학적 문체에서는 구체적 이미지가 신학적 긴장을 유지하므로, 관용적 의미는 암시되게 두고 본문은 손-이미지를 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
