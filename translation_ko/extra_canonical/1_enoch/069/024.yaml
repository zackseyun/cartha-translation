    reason: lexical_alternative
  - marker: c
    text: ‘온갖 감사 가운데’는 원문의 압축된 표현을 옮긴 것입니다. ‘모든 감사와 함께’ 또는 ‘감사로’로도 이해할 수 있습니다.
