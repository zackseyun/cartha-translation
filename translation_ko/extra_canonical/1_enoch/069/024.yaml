revisions:
- from: 이 모든 이들은 믿고, 영들의 주 앞에서 감사드리며, 온 힘으로 복을 빌며, 그들의 음식은 온전히 감사 안에 있으며, 또 영들의 주의 이름을 영원무궁토록 감사드리고 복을 빌며 높일 것입니다.[a][b][c]
  to: 이들은 모두 영들의 주[a] 앞에서 믿고 감사드리며, 온 힘을 다해 송축할 것입니다. 그들의 양식은 온갖 감사 가운데 있을 것이며[c], 그들은 영들의 주의 이름을 영원무궁토록 감사드리고 송축하며[b] 높일 것입니다.
  rationale: The revision preserves the Geʽez clause structure, particularly the independent statement that their food/nourishment is in all thanksgiving. It replaces two Korean expressions that are either misleading or unnatural, while retaining the title, the threefold sequence of worship verbs, and the eternal-duration formula. Footnote anchors are moved to the expressions they explain.
  reviewer_model: gpt-5.6-terra
