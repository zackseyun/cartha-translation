base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/024.yaml
  text: All these will believe and give thanks before the Lord of Spirits[a], and they will bless with all their power, and their food will be in all thanksgiving[c][b]; and they will give thanks and bless and exalt the name of the Lord of Spirits forever and ever.
  footnotes:
  - marker: a
    text: Or 'their possessions' or 'their substance' for 'their wealth'; the Ge'ez term likely refers broadly to what they have at their disposal, not only money.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'in thanksgiving' is compressed in the Ge'ez and may also be understood as 'with all thanksgiving.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and with all their wealth in thanksgiving;'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들은 모두 영들의 주[a] 앞에서 믿고 감사드리며, 온 힘을 다해 송축할 것입니다. 그들의 양식은 온갖 감사 가운데 있을 것이며[c], 그들은 영들의 주의 이름을 영원무궁토록 감사드리고 송축하며[b] 높일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영들의 주’는 에녹서에서 반복되는 신적 호칭으로, 단순한 소유격 구문보다 제목적 성격이 강합니다.
    reason: source_note
  - marker: b
    text: ‘송축하다’는 여기서 하나님을 향해 복을 선포하고 찬양한다는 예배적 뜻으로, 원문의 동사를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘온갖 감사 가운데’는 원문의 압축된 표현을 옮긴 것입니다. ‘모든 감사와 함께’ 또는 ‘감사로’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ያአምኑ
  english_pob_choice: will believe
  chosen_korean: 믿고
  alternatives_korean:
  - 신뢰하고
  - 믿음을 가질 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사는 단순한 믿음/신뢰를 뜻하므로, 종교적 용어를 덧붙이지 않고 미래형 서술 속에서 자연스럽게 ‘믿고’로 옮겼습니다.
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  english_pob_choice: Lord of Spirits
  chosen_korean: 영들의 주
  alternatives_korean:
  - 영들의 주님
  - 영들의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 에녹서 내에서 반복되는 신적 호칭이므로, 제목의 힘을 살리기 위해 ‘영들의 주’로 직역했습니다.
- source_word: ይሴብሑ
  english_pob_choice: will bless
  chosen_korean: 복을 빌며
  alternatives_korean:
  - 복을 빌고
  - 찬송하며
  - 축복하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 감사와 병렬되는 예배 행위이므로, 한국어에서 ‘bless’의 예배적 뉘앙스를 살리는 ‘복을 빌다’로 옮겼습니다.
- source_word: ሲሳዮሙ
  english_pob_choice: their food will be in all thanksgiving
  chosen_korean: 그들의 음식은 온전히 감사 안에 있으며
  alternatives_korean:
  - 그들의 음식은 온갖 감사 가운데 있으며
  - 그들의 음식은 감사로 가득하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석된 개정에 따라 ሲሳይ를 ‘food/food of nourishment’로 이해했고, 독립절을 반영해 ‘그들의 음식은…있으며’로 옮겼습니다. ‘온전히 감사 안에’는 압축된 수식과 예배적 이미지를 함께 살립니다.
- source_word: ያሌዕሉ
  english_pob_choice: exalt
  chosen_korean: 높일 것입니다
  alternatives_korean:
  - 들어 높일 것입니다
  - 영화롭게 할 것입니다
  - 크게 할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘들어 올리다’의 수직적 이미지를 한국어에서 가장 직접적으로 드러내는 말로 ‘높이다’를 택했습니다.
theological_decisions:
- issue: ‘복을 빌다’로 옮길 때 예배적 축복과 찬양의 구분을 어떻게 보존할지
  chosen_reading: 감사드리며 → 복을 빌며 → 높일 것입니다의 연쇄로, 감사·축복·고양의 세 동작을 분리해 드러냈습니다.
  alternative_readings:
  - 찬송하며
  - 축복하며
  rationale: 원문은 감사, 축복, 높임을 연속해서 배치하므로, 한국어에서도 의미를 뭉개지 않도록 동사를 구분했습니다.
  doctrine_reference: 예배 동사의 병렬 구조를 보존하여 원문 수사와 신학적 긴장을 유지합니다.
