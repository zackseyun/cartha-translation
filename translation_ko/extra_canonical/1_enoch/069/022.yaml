base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/022.yaml
  text: And likewise heaven[a], the spirits of the winds, and all the spirits[d][c][b], and their paths from all the gatherings of spirits.
  footnotes:
  - marker: a
    text: The Ethiopic text of this line is difficult, especially in the middle and final phrases. 'Received' is supplied in English to make the syntax intelligible; the underlying wording may also be understood more literally but less clearly.
    reason: textual_variant
  - marker: b
    text: The term rendered 'paths' may also mean 'ways,' 'courses,' or 'movements.'
    reason: lexical_alternative
  - marker: c
    text: The final phrase could also be understood as referring to every 'company' or 'assembly' of spirits.
    reason: lexical_alternative
  - marker: d
    text: Or 'heaven received their spirits, and all the spirits and their paths from every gathering of spirits.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이와 같이 하늘, 바람들의 영들, 모든 영들, 그리고 모든 영들의 모임에서 비롯된 그들의 길들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길들’은 원어의 의미 범위를 반영한 번역이며, ‘경로들’, ‘행로들’ 또는 ‘움직임들’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모임’은 ‘무리’, ‘집단’, ‘회중’으로도 옮길 수 있는 넓은 의미의 말입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰማይ
  english_pob_choice: heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 천
  - 하늘들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 우주론적 목록의 서두이므로, 단수형이면서도 집합적 영역을 자연스럽게 드러내는 ‘하늘’이 가장 무난합니다.
- source_word: ነፋሳቲሆሙ / ለነፋሳት
  english_pob_choice: the spirits of the winds
  chosen_korean: 바람들의 영들
  alternatives_korean:
  - 바람의 영들
  - 바람들의 바람들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB가 최종본에서 이 구절을 ‘spirit’ 계열보다 바람-영의 결합으로 조정한 점을 반영하되, 게에즈의 반복 구조를 살려 직역에 가깝게 옮겼습니다.
- source_word: መንፈሳት
  english_pob_choice: spirits
  chosen_korean: 영들
  alternatives_korean:
  - 영
  - 영적 존재들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수형 명사이므로 ‘영들’로 옮겨 목록 구조를 유지했습니다. ‘영적 존재들’은 뜻을 풀어 쓰는 편이라 배제했습니다.
- source_word: ወፍናዋቲሆሙ
  english_pob_choice: their paths
  chosen_korean: 그들의 길들
  alternatives_korean:
  - 그들의 경로들
  - 그들의 움직임들
  - 그들의 행로들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 형태가 불분명한 어휘이지만 영어 POB의 ‘paths’에 맞추어 가장 직접적인 대응인 ‘길들’을 택했습니다. 다만 한국어에서는 자연성을 위해 후치 수식을 유지했습니다.
- source_word: እምኵሉ ኅብራት
  english_pob_choice: from all the gatherings of spirits
  chosen_korean: 모든 영들의 모임에서
  alternatives_korean:
  - 모든 집단에서
  - 모든 무리에서
  - 모든 모임에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘gatherings’의 집합 의미를 살리되, 소속 관계를 분명히 하기 위해 ‘영들의 모임’으로 옮겼습니다.
theological_decisions:
- issue: 이 절의 우주적 열거를 목록형으로 유지할지, 문장형으로 풀어쓸지
  chosen_reading: 문장 연결어를 최소화한 목록형 한국어로 유지했습니다.
  alternative_readings:
  - ‘그리고 또한 하늘이…’처럼 서술형으로 풀어쓰기
  - 주어-술어를 보충하여 매끄럽게 재구성하기
  rationale: 게에즈 원문과 영어 POB 모두 동사 중심의 해설을 과도하게 넣지 않는 열거 구조를 보이므로, 한국어도 과잉 설명 없이 목록의 긴장을 유지했습니다.
  doctrine_reference: 본문의 우주론적 열거를 보존하고, 해석적 보충은 최소화함
