base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/003.yaml
  text: And these are the chiefs of their angels[a], and their names, and the commanders of their hundreds, and the commanders of their fifties[c][b], and the commanders of their tens.
  footnotes:
  - marker: a
    text: 'The Ge''ez lists a hierarchy by numerical units: hundreds, fifties, and tens. This likely reflects ranked divisions or ordered companies rather than simple arithmetic totals.'
    reason: cultural_note
  - marker: b
    text: The possessive 'their' is repeated throughout the verse in Ge'ez. Its exact referent is supplied by the surrounding context.
    reason: lexical_alternative
  - marker: c
    text: Or 'the commander of their hundreds, and the commander of their fifties, and the commander of their tens'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들은 그들의 천사들의 우두머리들과 그들의 이름들, 그들의 백 명 단위의 지휘관들, 그들의 오십 명 단위의 지휘관들, 그리고 그들의 십 명 단위의 지휘관들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 본문은 백, 오십, 십 단위의 계층적 편제를 나열합니다. 이는 단순한 수량보다 질서 있는 편대를 가리킬 가능성이 큽니다.
    reason: cultural_note
  - marker: b
    text: 본문의 소유 표지 ‘그들의’는 각 계층 표현에 반복되어 붙어 있으며, 정확한 지시 대상은 앞뒤 문맥이 정해 줍니다.
    reason: lexical_alternative
