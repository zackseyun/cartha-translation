  text: And the fourth—his name was Penemue—this one showed the children of men the bitter and the sweet[b][a], and he showed them all the secrets of their wisdom.
  footnotes:
  - marker: a
    text: The pair 'bitterness and sweetness' may be a literal contrast or a figurative way of describing mixed or morally charged knowledge; the Ge'ez wording itself is terse.
    reason: lexical_alternative
  - marker: b
    text: Or 'bitterness and sweetness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 네 번째—그의 이름은 페네무에였습니다—이 사람은 사람의 자손들에게 쓴 것과 단 것을 보여 주었고, 그들에게 그들의 지혜의 모든 숨은 것들을 보여 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 대조는 문자적으로 ‘쓴 것과 단 것’으로도 읽힐 수 있으며, 감각적 표현을 지닌 지혜 전승의 대비일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘쓴맛과 단맛’처럼 명사화해 옮길 수도 있으나, 게에즈의 형용사적 형태를 살리기 위해 본문은 실체화된 표현으로 옮겼습니다.
    reason: previous_rendering
