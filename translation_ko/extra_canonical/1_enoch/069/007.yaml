base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
  footnotes:
  - marker: a
    text: Or 'those who live on the earth.' The Ge'ez says more literally 'those who dwell upon the dry ground.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it went out'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그의 손에서 그 무기들은 나와, 그날부터 영원한 세세에 이르기까지 땅에 거하는 자들을 향하게 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez는 더 문자적으로는 '마른 땅 위에 거하는 자들'입니다.
    reason: source_note
  - marker: b
    text: 앞 절의 '죽음의 무기들'을 받는 동사로 이해하여 복수로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: እምነ እዴሁ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 손으로부터
  - 그의 권능에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역에 가까운 공간적 표현을 살리되, 한국어에서는 출처를 나타내는 자연스러운 조사형으로 옮겼습니다. '권능'으로 추상화하면 손의 구체적 이미지를 약화시킵니다.
- source_word: ንዋየ ሞት / ወፅአ
  english_pob_choice: they went out
  chosen_korean: 그 무기들은 나와
  alternatives_korean:
  - 그것들은 나와
  - 그 무기들은 나갔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞 구절의 선행어가 '죽음의 무기들'이므로 복수로 처리했습니다. '나와'는 출현·발출의 이미지를 살리면서 한국어 서술 흐름에 맞습니다.
- source_word: ዲቤሆሙ
  english_pob_choice: against them
  chosen_korean: …을 향하게 되었습니다
  alternatives_korean:
  - …을 대적하여
  - …위에 임하게 되었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 단순한 위치보다 적대적·심판적 방향성이 강하므로 '향하게 되었습니다'로 옮겼습니다. 한국어에서 과도한 군사적 해석을 덧씌우지 않으면서 방향성을 드러냅니다.
- source_word: ለእለ የኃድሩ ዲበ የብስ
  english_pob_choice: those who dwell upon the dry ground
  chosen_korean: 땅에 거하는 자들
  alternatives_korean:
  - 마른 땅에 거하는 자들
  - 땅 위에 사는 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''dry ground''의 직역인 ''마른 땅''을 본문에 남길 수도 있으나, 한국어에서는 ''땅에 거하는 자들''이 원문의 대조적 우주적 이미지를 충분히 전달하면서도 어색함을 줄입니다.'
- source_word: እስከ ለዓለመ ዓለም
  english_pob_choice: unto the age of ages
  chosen_korean: 영원한 세세에 이르기까지
  alternatives_korean:
  - 세세토록
  - 영원무궁토록
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복된 'age' 구조를 살려 종말론적 장구함을 드러내기 위해 '세세'를 유지했습니다. '영원무궁토록'은 익숙하지만 전통 교회어로 굳어져 원문의 어법적 긴장을 약화시킬 수 있습니다.
theological_decisions:
- issue: ὁπλο-이미지에 해당하는 '죽음의 무기들'을 한국어에서 어떻게 처리할지
  chosen_reading: 본문에는 '그 무기들'로 두고, 앞 구절의 선행어를 따라가게 했습니다.
  alternative_readings:
  - 죽음의 무기들
  - 그것들
  rationale: 이 절 단독으로는 선행사 없이 읽힐 수 있지만, 바로 앞 절의 '죽음의 무기들'을 받는 연속 서술입니다. 본문 자체는 과도하게 반복하지 않고, 독자가 문맥에서 의미를 회수하도록 두는 편이 원문 연결을 더 잘 보존합니다.
  doctrine_reference: 문맥 추적 번역 원칙
