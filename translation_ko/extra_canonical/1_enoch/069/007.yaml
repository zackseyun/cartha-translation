base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
  footnotes:
  - marker: a
    text: Or 'those who live on the earth.' The Ge'ez says more literally 'those who dwell upon the dry ground.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it went out'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그의 손에서 그 무기들이 나와, 그날부터 세세의 세세까지 마른 땅 위에 거하는 자들을 대적하여 나아갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '땅에 사는 자들'. Ge'ez는 더 문자적으로는 '마른 땅 위에 거하는 자들'입니다.
    reason: lexical_alternative
  - marker: b
    text: 앞 절의 '죽음의 무기들'을 가리키는 것으로 이해하여 복수로 옮겼습니다.
    reason: previous_rendering
