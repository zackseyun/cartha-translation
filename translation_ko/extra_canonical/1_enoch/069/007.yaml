- source_word: እስከ ለዓለመ ዓለም
  english_pob_choice: unto the age of ages
  chosen_korean: 영원한 세세에 이르기까지
  alternatives_korean:
  - 세세토록
  - 영원무궁토록
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복된 'age' 구조를 살려 종말론적 장구함을 드러내기 위해 '세세'를 유지했습니다. '영원무궁토록'은 익숙하지만 전통 교회어로 굳어져 원문의 어법적 긴장을 약화시킬 수 있습니다.
