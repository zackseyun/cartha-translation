  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서, '대적하여 나아갔습니다'로 원문의 적대적 진행을 자연스럽게 나타냅니다. '세세의 세세까지'는 반복된 시대 표현을 보존하는 다소 격조 있는 종말론적 문체이나, 현대 독자에게도 이해 가능합니다.
