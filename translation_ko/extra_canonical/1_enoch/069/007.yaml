- issue: ὁπλο-이미지에 해당하는 '죽음의 무기들'을 한국어에서 어떻게 처리할지
  chosen_reading: 본문에는 '그 무기들'로 두고, 앞 구절의 선행어를 따라가게 했습니다.
  alternative_readings:
  - 죽음의 무기들
  - 그것들
  rationale: 이 절 단독으로는 선행사 없이 읽힐 수 있지만, 바로 앞 절의 '죽음의 무기들'을 받는 연속 서술입니다. 본문 자체는 과도하게 반복하지 않고, 독자가 문맥에서 의미를 회수하도록 두는 편이 원문 연결을 더 잘 보존합니다.
