base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/010.yaml
  text: 'For men were not born for this: to strengthen their faith with pen and ink[a][b][c].'
  footnotes:
  - marker: a
    text: Literally, 'by ink and by the water of gall.' The imagery is difficult; it may point to written means joined with bitterness or poison, but the Ge'ez wording is kept transparent here.
    reason: cultural_note
  - marker: b
    text: '''Men'' here means humankind collectively, not males only.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to strengthen their faith by ink and by the water of gall'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람들이 태어난 것은 이것을 위해서가 아닙니다. 곧 펜과 잉크로 자신의 믿음을 굳게 하기 위해서가 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘펜과 쓸개즙의 물로’입니다. 이 난해한 표현은 문맥상 필기 도구를 가리키는 것으로 이해하여 ‘펜과 잉크’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: እስመ
  english_pob_choice: For
  chosen_korean: 사람은 이 일을 위해
  alternatives_korean:
  - 이는
  - 왜냐하면
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞 문장에 대한 이유 제시로 읽히므로 한국어에서는 문맥상 자연스러운 연결을 위해 ‘이 일을 위해’로 풀어, 목적·설명 관계를 유지했습니다.
- source_word: ኢተወልዱ ሰብእ
  english_pob_choice: men were not born
  chosen_korean: 사람은 태어난 것이 아닙니다
  alternatives_korean:
  - 인간은 태어나지 않았습니다
  - 사람들은 태어난 것이 아닙니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘사람들’이 아니라 인류 전체를 가리키는 일반명사이므로 성별이 드러나지 않는 ‘사람’으로 옮겼고, 출생 목적의 부정을 자연스러운 문장으로 살렸습니다.
- source_word: በቀለም ወበማየ ሐመት
  english_pob_choice: with pen and ink
  chosen_korean: 펜과 먹으로
  alternatives_korean:
  - 먹과 갈필로
  - 잉크와 쓴물로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 논란이 되는 직역 이미지를 그대로 풀기보다, 영어 POB가 판독한 관용적 의미를 따라 필기 도구를 가리키는 ‘펜과 먹’으로 옮겨 의미를 투명하게 했습니다.
- source_word: ያጽንዑ ሃይማኖቶሙ
  english_pob_choice: to strengthen their faith
  chosen_korean: 그들의 믿음을 굳게 하는
  alternatives_korean:
  - 그들의 신앙을 강화하는
  - 그들의 믿음을 세우는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘믿음’이 신앙 행위의 대상이므로 한국어에서는 ‘굳게 하다’가 ‘strengthen’의 힘과 자연스러움을 함께 살려 줍니다.
theological_decisions:
- issue: ‘펜과 먹’ 이미지의 처리
  chosen_reading: 문서는 신앙을 굳게 하는 데 쓰인 필기 수단을 가리키며, 그 행위의 부자연스러움을 비판적으로 드러냅니다.
  alternative_readings:
  - 독소나 쓴맛을 동반한 물질적 수단에 대한 더 수수께끼 같은 표현
  - 문자 기록 자체를 부정적으로 보는 표현
  rationale: 본문의 지시어가 물질적 필기 수단으로 읽히는 만큼, 해석을 지나치게 좁히지 않으면서도 독자가 이해할 수 있게 직역보다 투명성을 택했습니다.
  doctrine_reference: 외경/묵시문학의 난해한 비유는 의미를 과도하게 신학화하지 않고, 본문이 주는 긴장감을 보존해야 합니다.
