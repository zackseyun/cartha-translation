base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/021.yaml
  text: And by that oath the stars complete their courses[a], and their names are called[c][b], and they answer from age to age and forever.
  footnotes:
  - marker: a
    text: The line is textually and syntactically compressed in the Ge'ez-only Parables tradition. 'They call their names, and they answer them' may describe the stars themselves, heavenly attendants, or both in an intentionally personified cosmic order.
    reason: textual_variant
  - marker: b
    text: Literally, the closing idiom is 'from age/world ... unto age/world,' a formula of enduring continuance.
    reason: lexical_alternative
  - marker: c
    text: Or 'And in it the courses of the stars complete their circuits, and they call their names, and they answer them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 맹세로 말미암아 별들은 그 운행을 마치고, 그들의 이름은 불리며, 그들은 세세토록 그에게 대답합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 행은 게에즈어로만 전해지는 비유서 전승에서 문장과 어순이 압축되어 있습니다. 이름을 부르는 이와 응답하는 주체는 별들 자체, 천상 존재들, 또는 양쪽 모두를 가리킬 수 있으며, 의인화된 우주 질서에 대한 표현은 의도적으로 열어 둡니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘시대/세상으로부터 시대/세상까지’라는 관용구로, 지속적인 계속을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 안에서 별들의 운행이 그 순환을 마치고, 그들이 그들의 이름을 부르며, 그들에게 대답한다’로도 번역되어 왔습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ማሐላ፡
  english_pob_choice: that oath
  chosen_korean: 그 맹세
  alternatives_korean:
  - 그 oath
  - 그 서약
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 1 Enoch 69장 전체에 반복되는 핵심어는 ‘맹세’이며, 본절도 앞절들과 같은 맹세를 가리킵니다. 한국어에서는 ‘맹세’가 가장 자연스럽고, 본문의 주제 연속성을 살립니다.
- source_word: ይፌጽሙ፡
  english_pob_choice: complete
  chosen_korean: 완수하고
  alternatives_korean:
  - 완료하고
  - 끝내고
  - 이루고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 별들의 정해진 움직임이 ‘마치는’ 것이므로, 단순 종결보다 목적을 채우는 뉘앙스가 있는 ‘완수하다’가 적합합니다.
- source_word: ምሕዋሪሆሙ፡
  english_pob_choice: their circuits
  chosen_korean: 그들의 순환
  alternatives_korean:
  - 그들의 순회
  - 그들의 궤도
  - 그들의 회전
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체의 정형화된 반복 운동을 가리키므로 ‘순환’이 가장 압축적이면서도 apocalyptic한 질서를 잘 드러냅니다.
- source_word: ይጼውዑ፡
  english_pob_choice: their names are called
  chosen_korean: 그들의 이름은 불리며
  alternatives_korean:
  - 그들의 이름이 불리며
  - 그 이름들이 불리며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈의 압축된 표현을 따라 수동형으로 옮겨, 누가 부르는지보다 ‘이름이 불린다’는 질서의 측면을 살렸습니다.
- source_word: ያወሥእዎ፡
  english_pob_choice: they answer him
  chosen_korean: 그들은 … 그에게 대답합니다
  alternatives_korean:
  - 그들은 … 그분께 응답합니다
  - 그들은 … 그에게 응답합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어미의 목적어가 단수 남성으로 읽히므로, 답하는 대상은 단수의 ‘그’로 유지하는 것이 원문에 가깝습니다. 한국어에서는 앞문맥에 맞는 대명사를 생략하고 조사로만 남겨도 자연스럽습니다.
theological_decisions:
- issue: 별들의 행위를 단순 천문 묘사로 볼지, 인격화된 순종으로 볼지
  chosen_reading: 별들은 맹세 아래서 정해진 질서를 수행하며, 이름이 불리고 응답하는 존재로 그려집니다.
  alternative_readings:
  - 단순한 천체 운동의 묘사
  - 별에 연결된 하늘 존재들이 응답하는 묘사
  rationale: 본문은 별을 의인화된 질서 안에 배치하며 응답 행위를 말합니다. 이 긴장을 풀어버리지 않고 그대로 유지하는 편이 1 Enoch의 시적·묵시적 성격에 더 충실합니다.
  doctrine_reference: 묵시문학의 의인화와 우주적 질서를 평면화하지 않고 유지한다.
