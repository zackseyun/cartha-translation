base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/025.yaml
  text: And over them this oath became strong[a], and they are kept by it; and their paths are kept[c][b], and their courses do not perish.
  footnotes:
  - marker: a
    text: Or 'their ways were guarded, and their circuits do not fail.' The Ge'ez wording allows either a more general sense ('ways') or a more ordered/cosmic sense ('courses, circuits').
    reason: lexical_alternative
  - marker: b
    text: The line is textually difficult in the Ethiopic witness, and the repeated passive verb may indicate both that they are kept by the oath and that their paths are kept under it.
    reason: textual_variant
  - marker: c
    text: Or 'And among them the oath became strong, and they were kept by it; and their paths were kept'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 위에 이 맹세가 강해졌고, 그들은 그것으로 지켜지며, 그들의 길도 지켜지고, 그들의 행로는 사라지지 않습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 길은 지켜지고, 그들의 순환은 실패하지 않는다.’ 에티오피아어 표현은 보다 일반적인 ‘길’ 또는 보다 질서 있는 우주적 의미의 ‘행로, 순환’을 모두 허용합니다.
    reason: lexical_alternative
  - marker: b
    text: 에티오피아어 증언에서는 이 행이 본문상 어렵고, 반복된 수동 동사가 그들이 맹세로 지켜진다는 뜻과 그들의 길이 그 아래서 지켜진다는 뜻을 함께 암시할 수 있습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘그들 가운데서 이 맹세가 강해졌고, 그들은 그것으로 지켜졌으며, 그들의 길도 지켜졌다.’
    reason: previous_rendering
lexical_decisions:
- source_word: ዲቤሆሙ
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위로
  - 그들 위에 있는
  lexicon: Dillmann
  rationale: 전치사는 ‘among them’이 아니라 ‘over/upon them’의 지배적 의미를 가지므로, 맹세의 효력과 권위를 드러내는 ‘그들 위에’로 옮겼습니다.
- source_word: ዝማሐላ
  english_pob_choice: this oath
  chosen_korean: 이 맹세
  alternatives_korean:
  - 이 서약
  - 그 맹세
  lexicon: Dillmann
  rationale: 지시사 ዝ의 의미를 살려 ‘이’로 옮겼고, 맹세/서약보다 본문이 지닌 엄숙한 선언성을 살리기 위해 ‘맹세’를 택했습니다.
- source_word: ይትዓቀቡ / ፍናዊሆሙ
  english_pob_choice: they are kept by it; and their paths are kept
  chosen_korean: 그들은 그것으로 지켜지며, 그들의 길도 지켜지고
  alternatives_korean:
  - 그것으로 보호되며, 그들의 길도 보호되고
  - 그것에 의해 붙들리며, 그들의 길도 붙들리고
  lexicon: Dillmann
  rationale: 반복되는 수동형을 그대로 살려 ‘지켜지다’로 두어, 맹세가 그들을 붙들고 보호하는 동시에 제약하는 뉘앙스를 열어 두었습니다.
- source_word: ምሕዋራቲሆሙ / ኢይማስን
  english_pob_choice: their courses do not perish
  chosen_korean: 그들의 행로는 사라지지 않습니다
  alternatives_korean:
  - 그들의 순환은 사라지지 않습니다
  - 그들의 궤도는 없어지지 않습니다
  lexicon: Dillmann
  rationale: ‘courses’는 우주적 순환까지 아우를 수 있으나, 한국어 본문에서는 과도한 과학화보다 운동의 지속성을 드러내는 ‘행로’로 옮기고, ‘do not perish’는 ‘사라지지 않습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 맹세가 인간/영적 존재를 속박하는지, 우주 질서를 유지하는지의 의미 범위
  chosen_reading: 문맥의 긴장을 유지하기 위해, 맹세가 그들을 지배하여 지키고 동시에 그들의 길과 행로를 안정시키는 것으로 열어 두었습니다.
  alternative_readings:
  - 맹세가 그들을 도덕적으로 복종시키는 의미
  - 맹세가 우주적 궤도와 질서를 보존하는 의미
  rationale: 본문은 법적 구속과 우주적 질서의 의미를 모두 배제하지 않으므로, 한쪽으로 단정하지 않고 ‘지켜지며/지켜지고/사라지지 않습니다’의 병렬로 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
