base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/005.yaml
  text: And the second[a], whose name was Asbe'el—this one taught the evil counsel to the holy sons of God[c][b], and led them astray so that they defiled their bodies with the daughters of men.
  footnotes:
  - marker: a
    text: Or 'to the sons of the holy angels.' The Ge'ez phrase is syntactically difficult, and this section lacks Greek or Qumran control for the wording.
    reason: alternative_reading
  - marker: b
    text: Literally 'their flesh.'
    reason: lexical_alternative
  - marker: c
    text: Or "And another, whose name was Asbe'el".
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 둘째, 이름이 아스브엘인 자는 거룩한 천사들의 아들들에게[a] 악한 계책을 가르치고, 그들을 그릇된 길로 이끌어 그들이 사람의 딸들과 더불어 그들의 몸을 더럽히게 했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천사들의 거룩한 아들들’. 게에즈어 구문은 문법적으로 난해하며, 이 부분은 그리스어 또는 쿰란 자료로 대조할 수 없습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘그들의 육체’입니다.
    reason: lexical_alternative
