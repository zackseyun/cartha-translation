theological_decisions:
- issue: 문자의 도입이 가져온 결과를 어떻게 드러낼지
  chosen_reading: ‘먹물과 종이로 쓰는 것’이라는 물질적·기술적 표현으로 옮겨, 문자 기술의 도입이 많은 이의 이탈을 낳았다는 경고를 분명히 했습니다.
  alternative_readings:
  - ‘글쓰기’를 일반적으로 옮김
  - ‘책’이나 ‘기록’으로 완화함
  rationale: 감수된 본문은 문자 기술 자체를 문제 삼는 맥락이므로, 이를 추상화하거나 중화하지 않고 본문의 논쟁성을 보존하는 편이 적절합니다.
  doctrine_reference: 본문의 경고를 약화하지 말고, 계시적 경고의 긴장을 보존한다.
