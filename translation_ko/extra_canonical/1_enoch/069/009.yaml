base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/009.yaml
  text: And he taught humankind writing with ink and paper[a], and because of this many have gone astray from eternity to eternity[c][b], even to this day.
  footnotes:
  - marker: a
    text: The object phrase is textually difficult in the Ethiopic and may refer more generally to harmful writings or written arts rather than literal tablets.
    reason: textual_variant
  - marker: b
    text: Or 'from age to age'; the repeated term for 'age/eternity' is kept in elevated form to preserve the apocalyptic cadence.
    reason: lexical_alternative
  - marker: c
    text: Or 'he gave to humankind the writing tablets of bitterness and deceit'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 인류에게 먹물과 종이로 쓰는 것을 가르쳤습니다[a]. 이 때문에 많은 사람이 영원에서 영원으로[b][c], 오늘에 이르기까지 길을 벗어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문 전승의 감수 기록에 따르면, 이 구절은 ‘먹물과 종이’에 해당하는 표현으로 교정됩니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘영원에서 영원으로’이며, 반복된 ‘영원/시대’ 어구의 장중한 어조를 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘시대에서 시대로’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: መሀሮሙ / አበወዎሙ
  english_pob_choice: he taught humankind / he gave to them
  chosen_korean: 그는 인류에게 …를 가르쳤습니다
