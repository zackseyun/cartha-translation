  - 잉크와 종이로 쓰는 것
  - 기록하는 기술
  lexicon: Ge'ez text corrected in audit trail; cf. English POB notes
  rationale: 감수 기록이 본문을 ‘먹물과 종이’로 교정하고 있으므로, 문자 그대로의 매체를 살리되 동사구로 옮겨 기술의 도입을 드러냈습니다. ‘먹물’은 시대감과 물질성을, ‘종이’는 문서 매체를 전달합니다.
- source_word: እምዓለም ወእስከ ለዓለም
  english_pob_choice: from eternity to eternity
