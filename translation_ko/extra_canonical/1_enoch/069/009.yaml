  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 집단적 인간 전체를 가리키므로, 성별이 드러나지 않고 집합성을 유지하는 ‘인류’가 가장 자연스럽습니다.
- source_word: በቀለም፡ ወበክርታስ / መጽሐፈ፡ በጣየ፡ ኀመት፡ ወአርታስ
