  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정정된 본문 전통에서 동사는 ‘가르치다’에 해당하므로, 단순한 ‘주다’보다 문맥의 행위—기술의 전달—을 분명히 드러내는 번역이 적절합니다.
