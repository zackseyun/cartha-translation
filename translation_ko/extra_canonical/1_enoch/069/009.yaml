  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 ዓለም 표현의 높은 종말론적 어조를 살리기 위해, 관용적이면서도 격조가 있는 ‘영원에서 영원으로’를 선택했습니다.
