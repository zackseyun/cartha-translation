  text: And these are the hidden things of this oath [a]. . . and it is made firm by his oath, and heaven was suspended before the world was created[d][c][b], and by it forever.
  footnotes:
  - marker: a
    text: The opening clause is textually difficult in this Ethiopic witness; the ellipsis in the source indicates damaged or uncertain transmission after 'this oath.'
    reason: textual_variant
  - marker: b
    text: Or 'the secret things of this oath.'
    reason: lexical_alternative
  - marker: c
    text: The final phrase is obscure in this witness; literally, 'and forever it is upon it.' The referent of 'it' may be the oath, heaven, or the created world.
    reason: alternative_reading
  - marker: d
    text: Or 'it is upon it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이것들은 이 맹세의 숨은 것들입니다[a]. … 그리고 그의 맹세로 그것은 굳게 세워졌으며, 하늘은 세계가 창조되기 전에 매달려 있었고, 그것에 의해 영원히 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 여는 구절은 이티오피아어 증언에서 본문이 어렵습니다. 원문의 줄임표는 ‘이 맹세’ 뒤의 전승이 훼손되었거나 불확실함을 가리킵니다.
    reason: textual_variant
lexical_decisions:
- source_word: እሉንቱ / ኅቡኣቲሁ
  english_pob_choice: these are the hidden things
  chosen_korean: 이것들은 이 맹세의 숨은 것들입니다
  alternatives_korean:
  - 이것들은 이 맹세의 비밀들입니다
  - 이것들은 이 맹세의 감추어진 것들입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시대명사 복수와 ‘숨겨진 것들’의 의미를 살려, 묵시문맥의 감춰진 실재를 자연스러운 한국어로 옮겼습니다.
- source_word: ፅኑዕ በመሐላሁ
  english_pob_choice: it is made firm by his oath
  chosen_korean: 그의 맹세로 그것은 굳게 세워졌으며
  alternatives_korean:
  - 그의 맹세로 그것은 확립되었으며
  - 그의 맹세로 그것은 견고하게 되었으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 어감은 단순한 ‘강화됨’보다 ‘굳게 세워짐’이 맹세의 효력을 더 잘 살리며, 수동적 결과 상태도 반영합니다.
- source_word: ሰማይ ተሰቅለ
  english_pob_choice: heaven was suspended
  chosen_korean: 하늘은 세계가 창조되기 전에 매달려 있었고
  alternatives_korean:
  - 하늘은 세계가 창조되기 전에 걸려 있었고
  - 하늘은 세계가 창조되기 전에 매달린 채였고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 우주 이미지인 ‘매달리다/걸리다’를 살려, 평범한 창조 진술로 완화하지 않았습니다.
- source_word: ዘእንበለ ይትፈጠር ዓለም
  english_pob_choice: before the world was created
  chosen_korean: 세계가 창조되기 전에
  alternatives_korean:
  - 세상이 창조되기 전에
  - 세상이 만들어지기 전에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ዓለም의 가장 자연스러운 대응으로 ‘세계’를 택해, 우주론적 시간표현을 분명하게 했습니다.
- source_word: ቦቱ
  english_pob_choice: and forever / by it
  chosen_korean: 그것에 의해 영원히 있습니다
  alternatives_korean:
  - 그것으로 인해 영원히 있습니다
  - 그것으로 영원히 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 형태상 በ-계열의 도구·수단 의미를 반영해 ‘그것에 의해’로 옮기고, 지속의 뜻은 ‘영원히’로 살렸습니다.
theological_decisions:
- issue: ‘숨은 것들’의 범위
  chosen_reading: 맹세와 관련된 감춰진 우주적 실재를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 맹세의 비밀스러운 말들
  - 맹세 안에 담긴 신비들
  rationale: 문맥이 우주 질서와 맹세의 효력을 다루므로, 추상적 교리나 단순한 정보가 아니라 감춰진 실재를 드러내는 묵시적 표현으로 보존하는 것이 적절합니다.
  doctrine_reference: 묵시적 우주언어를 평면화하지 말 것.
- issue: 하늘이 ‘매달려 있었다’는 표현
  chosen_reading: 창조 이전에 하늘이 매달려 있었다는 시각적 우주론 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 하늘이 세워져 있었다
  - 하늘이 고정되어 있었다
  rationale: Ge'ez 동사의 생생한 이미지를 완화하면 본문의 묵시적 힘이 약해지므로, 한국어에서도 직설적인 우주적 이미지를 보존했습니다.
  doctrine_reference: 환상문학/묵시문학의 비유적·우주론적 이미지 보존
