base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/026.yaml
  text: And there was great joy among them[a], and they blessed and praised and exalted because the name of that Son of Man had been revealed to them.
  footnotes:
  - marker: a
    text: The Ge'ez title rendered 'Son of Man' is formally difficult. A more literal rendering could be 'son of humankind' or, less likely, 'son of the living,' but in the Parables it functions as a recognized exalted title.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들 가운데 큰 기쁨이 있었고, 그들은 그 인자의 이름이 그들에게 드러났기 때문에 복을 빌고 찬양하고 높였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 칭호 ወልደ እጓለ እመሕያው은 문법적으로 난해합니다. 더 문자적으로는 ‘사람의 아들’로, 드물게는 ‘산 자의 아들’로도 이해될 수 있습니다. 그러나 비유들에서는 높여진 인물을 가리키는 알려진 칭호로 기능하므로 여기서는 ‘인자’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮኖሙ
  english_pob_choice: and there was among them
  chosen_korean: 그들 가운데 ... 있었고
  alternatives_korean:
  - 그들에게 ... 생겼고
  - 그들 가운데 ... 일어났고
  lexicon: Dillmann
  rationale: 분위기나 상태의 발생을 자연스럽게 드러내기 위해 ‘그들 가운데’로 옮겼습니다.
- source_word: ፍሥሐ ዓቢይ
  english_pob_choice: great joy
  chosen_korean: 큰 기쁨
  alternatives_korean:
