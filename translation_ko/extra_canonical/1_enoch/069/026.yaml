  lexicon: Dillmann
  rationale: ‘great joy’의 강한 축하 분위기를 현대 한국어로 간결하게 살렸습니다.
- source_word: ባረኩ ወሰብሑ ወአልዐሉ
  english_pob_choice: blessed and praised and exalted
  chosen_korean: 복 주고 찬양하고 높였습니다
  alternatives_korean:
  - 축복하고 찬양하고 높였습니다
  - 복 주며 찬양하며 영화롭게 했습니다
  lexicon: Dillmann
  rationale: 세 동사를 각각 살려 반복적 예배 어조를 유지했고, ‘높이다’로 በመ를 과장 없이 반영했습니다.
- source_word: ዘተከሥተ ሎሙ
  english_pob_choice: had been revealed to them
  chosen_korean: 드러났으므로
  alternatives_korean:
  - 그들에게 계시되었으므로
  - 그들에게 밝혀졌으므로
  lexicon: Dillmann
  rationale: 수동적 ‘드러남’을 한국어에서 가장 자연스럽게 표현하되, 계시의 의미도 너무 약화되지 않게 했습니다.
- source_word: ለውእቱ ወልደ እጓለ እመሕያው
  english_pob_choice: of that Son of Man
  chosen_korean: 그 사람의 아들
  alternatives_korean:
  - 그 인자의
  - 그 사람의 아들
  lexicon: Dillmann
  rationale: 이 본문은 에녹서 내부의 고유한 호칭이지만, 한국어 본문에서는 원문의 직역 가능성을 우선해 ‘그 사람의 아들’로 두고, 표준적인 종말론적 칭호와의 긴장은 각주로 남겼습니다.
theological_decisions:
- issue: መמיה한 칭호 ወልደ እጓለ እመሕያው의 한국어 처리
  chosen_reading: ‘그 사람의 아들’로 직역하되, 문맥상 고유한 승귀 칭호라는 점을 각주로 보존했습니다.
  alternative_readings:
  - ‘인자’
  - ‘그 사람의 아들’
  rationale: 에녹서의 문맥에서는 후대 신약 용례와 단순히 동일시하기보다, 원문이 가진 형식적 낯섦과 고유한 호칭성을 함께 드러내는 편이 더 충실합니다.
  doctrine_reference: 본문 고유의 종말론적 칭호를 평준화하지 않고, 문맥 내부에서 이해되도록 유지합니다.
