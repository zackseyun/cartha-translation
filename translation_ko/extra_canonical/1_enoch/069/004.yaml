base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/004.yaml
  text: And the name of the first was Yeqon[a]; this is the one who led all the children of the angels astray, and brought them down upon the dry land[d][c][b], and led them astray through the daughters of men.
  footnotes:
  - marker: a
    text: Yeqon is a transliteration of the Ge'ez form; English spellings may vary, including Yequn or Yequn.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'the sons of the angels' is literal. Some interpreters take it more broadly as the angelic host.
    reason: lexical_alternative
  - marker: c
    text: '''Upon the dry land'' may also be rendered ''upon the earth'' or ''onto the land''; the Ge''ez points concretely to the terrestrial realm.'
    reason: lexical_alternative
  - marker: d
    text: Or 'by the daughters of men'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 첫째의 이름은 예콘이었습니다[a]. 이 사람은 모든 천사들의 자녀를 미혹하고, 그들을 마른 땅 위로[b][c] 끌어내렸으며, 사람의 딸들을 통해 그들을 다시 미혹했습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 예콘은 게에즈형 음역이며, 영어 표기에는 Yeqon 외에 Yequn 등 변형이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘마른 땅 위로’는 게에즈의 구체적 지형 표현을 살린 것입니다. 보다 일반적으로는 ‘땅으로’ 또는 ‘땅 위에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 해당 구절은 하늘의 영역에서 지상 영역으로의 하강을 강조합니다.
    reason: source_note
  - marker: d
    text: 게에즈의 전치사 በ는 여기서 ‘~을 통해/수단으로’라는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: source_note
lexical_decisions:
- source_word: ወስሙ
  english_pob_choice: And the name
  chosen_korean: 그리고 첫째의 이름은
  alternatives_korean:
  - 그리고 그 이름은
  - 첫째의 이름은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 계열식 소개 공식을 한국어로 자연스럽게 옮기되, ‘첫째’라는 이어지는 서열 표지를 살려 본문의 열거성을 유지했습니다.
- source_word: ይቁን
  english_pob_choice: Yeqon
  chosen_korean: 예콘
  alternatives_korean:
  - 예쿤
  - 예퀸
  lexicon: 표준 외래어 표기 원칙
  rationale: 고유명사는 음역을 따르되, 게에즈 모음값이 완전히 확정되지 않은 점을 고려해 가능한 음역 변형을 염두에 두었습니다.
- source_word: ደቂቀ መላእክት
  english_pob_choice: the children of the angels
  chosen_korean: 천사들의 자녀
  alternatives_korean:
  - 천사들의 아들들
  - 천사들의 후손
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 친족 표현을 유지해 ‘천사들’이라는 집합으로 평탄화하지 않고, 본문이 가진 생물학적/계보적 긴장을 드러냈습니다.
- source_word: ዲበ የብስ
  english_pob_choice: upon the dry land
  chosen_korean: 마른 땅 위로
  alternatives_korean:
  - 마른 땅에
  - 땅 위로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘건조한 땅/마른 땅’이라는 구체성을 살리면서, 하강·이동의 방향성을 드러내기 위해 ‘위로’를 붙였습니다.
- source_word: በአዋልደ ሰብእ
  english_pob_choice: through the daughters of men
  chosen_korean: 사람의 딸들을 통해
  alternatives_korean:
  - 사람의 딸들로 말미암아
  - 사람의 딸들을 통해서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 በ가 도구·수단을 나타내므로, 한국어에서는 원인 행위자를 오해하지 않게 ‘통해’로 옮겼습니다.
theological_decisions:
- issue: ‘천사들의 자녀’라는 비정상적 친족 표현의 보존
  chosen_reading: 본문의 친족 언어를 유지해 ‘천사들의 자녀’로 옮겼습니다.
  alternative_readings:
  - 천사들
  - 천상 존재들
  - 천사들의 무리
  rationale: 게에즈의 독특한 표현을 일반화하면 본문이 의도하는 불편한/특수한 계보적 이미지를 잃게 되므로, 해석을 앞당기지 않고 그대로 드러냈습니다.
  doctrine_reference: 원문 우선과 해석적 평탄화 회피
- issue: ‘through the daughters of men’의 수단성
  chosen_reading: ‘사람의 딸들을 통해’로 옮겨, 미혹의 주체가 예콘이고 ‘사람의 딸들’은 수단임을 분명히 했습니다.
  alternative_readings:
  - 사람의 딸들을 통해서
  - 사람의 딸들로 인해
  - 사람의 딸들을 따라서
  rationale: 영어 POB의 공적 개정이 지적했듯, 단순히 ‘by’를 한국어 ‘~에 의해’로 옮기면 행위 주체가 뒤바뀔 수 있어 수단 의미를 분명히 했습니다.
  doctrine_reference: 문장 논리와 수단-행위자 구분
