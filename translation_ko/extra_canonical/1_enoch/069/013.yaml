base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/013.yaml
  text: This is the secret of Kasbeel[a], the chief of the oath which he showed to the holy ones when he dwelt in glory on high[d][c][b], and its name is Biqa.
  footnotes:
  - marker: a
    text: Or 'the chief of the adjuration'; the Ge'ez term commonly means 'oath,' but in this context it may denote a solemn revealed formula bound up with a name.
    reason: lexical_alternative
  - marker: b
    text: '''Holy ones'' likely refers to heavenly beings in this visionary setting, though the phrase is left literal in the translation.'
    reason: cultural_note
  - marker: c
    text: The final pronoun could be understood as referring either to the revealed name/formula or, less likely, to Kasbeel himself.
    reason: alternative_reading
  - marker: d
    text: Or 'third name'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 카스비엘의 비밀입니다. 카스비엘은 높은 곳의 영광 가운데 거할 때 거룩한 이들에게 보여 준 맹세[a]의 우두머리이며, 그 이름은 비카입니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엄숙한 선서의 우두머리’로 옮길 수 있습니다. 게에즈어는 보통 ‘맹세’를 뜻하지만, 이 문맥에서는 이름과 결부된 엄숙한 계시의 공식(公式)을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩한 이들’은 이 환상 문맥에서 천상적 존재들을 가리키는 듯하지만, 번역은 원문의 표현을 문자적으로 유지합니다.
    reason: cultural_note
  - marker: c
    text: 마지막 대명사는 드러난 이름 또는 공식(公式)을 가리킬 수도 있고, 덜 가능하게는 카스비엘 자신을 가리킬 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ዝንቱ ... ጐልቁ
  english_pob_choice: the secret
  chosen_korean: 비밀
  alternatives_korean:
  - 비밀의 내용
  - 숨은 뜻
  - 수수께끼
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문은 카스비엘에 관한 계시된 내용을 가리키므로, 영어 POB의 ‘secret’을 따라 ‘비밀’로 옮겨 계시적·은폐된 성격을 살렸습니다.
- source_word: ርእሰ ማሐላ
  english_pob_choice: chief of the oath
  chosen_korean: 맹세의 우두머리
  alternatives_korean:
  - 맹세의 수장
  - 맹세의 머리
  - 맹세의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘머리’이지만, 한국어에서는 지위와 우두머리됨을 자연스럽게 드러내는 ‘우두머리’가 본문 의미를 더 분명하게 전달합니다.
- source_word: ለቅዱሳን
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 거룩한 존재들
  - 성도들
  - 거룩한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥은 천상적 환상 세계이므로 교회 용례의 ‘성도’보다, 지시 대상을 열어 두는 ‘거룩한 이들’이 더 안전합니다.
- source_word: በልዑል በስብሐት
  english_pob_choice: in glory on high
  chosen_korean: 높은 곳의 영광 가운데
  alternatives_korean:
  - 높은 곳의 영광 안에
  - 지극히 높으신 분의 영광 가운데
  - 높은 영광 가운데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘높은 곳’과 ‘영광’의 이중 요소를 함께 살리되, 한국어 조사 처리로 문장을 자연스럽게 만들었습니다.
- source_word: ወስሙ ቢቃ
  english_pob_choice: and its name is Biqa
  chosen_korean: 그것의 이름은 비카입니다
  alternatives_korean:
  - 그 이름은 비카입니다
  - 그것의 이름이 비카입니다
  - 그의 이름은 비카입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 선행어가 ‘비밀/맹세의 이름’일 가능성을 남기기 위해 영어 POB의 ‘its’에 맞춰 ‘그것의’로 옮겼습니다.
theological_decisions:
- issue: ‘거룩한 이들’의 정체
  chosen_reading: 천상적 존재들을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 인간 성도들
  - 의도적으로 모호한 거룩한 회중
  rationale: 에녹 전승의 환상 문맥에서는 천사적 존재를 가장 자연스럽게 가리키지만, 본문 자체가 명시하지 않으므로 한국어 본문에서도 특정 교리어로 닫지 않았습니다.
  doctrine_reference: 문맥 우선 해석과 의미의 열린 보존
- issue: ‘맹세’의 의미 범위
  chosen_reading: 문자적으로 ‘맹세’를 유지했습니다.
  alternative_readings:
  - 엄숙한 선서
  - 주술적 서약
  - 비밀한 선언
  rationale: 게에즈 원문은 직접적으로 ‘맹세’를 지시하므로, 추측적인 ‘주술’ 표현으로 확장하지 않고 본문이 말하는 범위 안에 머물렀습니다.
  doctrine_reference: 원문 우선, 과도한 해석 자제
