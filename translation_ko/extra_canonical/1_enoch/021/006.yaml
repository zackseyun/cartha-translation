theological_decisions:
- issue: ‘stars’의 의미
  chosen_reading: 별들은 비전 속 천상 존재들을 가리키지만, 본문은 그 상징을 유지한 채 그들이 주님의 명령을 어겼다고 말합니다.
  alternative_readings:
  - 문자적 천체인 별들
  - 감춰진 의미를 해석해 ‘감시자들’로 번역
  rationale: 「별들」 이미지를 그대로 유지해야 에녹서의 묵시적 상징을 보존할 수 있으며, 이를 곧바로 ‘천사들’ 등으로 평평하게 풀지 않았습니다.
  doctrine_reference: 묵시문학의 상징 보존; 본문이 허락하는 범위 안에서만 해석
- issue: ‘만 년’의 기간
  chosen_reading: 정해진 형벌 기간으로서의 ‘만 년’이 문자 그대로 제시됩니다.
  alternative_readings:
  - 아주 긴 상징적 기간
  - 다른 기간을 가리키는 필사 문제
  rationale: 게에즈 본문이 제시하는 수치를 그대로 살려, 기간의 엄정함과 수사적 장대함을 함께 드러냈습니다.
  doctrine_reference: 본문 증거를 우선하고, 불확실성은 주석에서 처리
