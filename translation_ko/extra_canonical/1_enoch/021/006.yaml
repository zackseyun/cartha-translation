base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/006.yaml
  text: These are among the stars that transgressed the command of the Lord[a], and they are bound here until ten thousand years are completed[e][d][c][b], the number of the days of their sins.
  footnotes:
  - marker: a
    text: Or 'from the stars.' The Ge'ez preposition can indicate source as well as membership within a class.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'ten thousand years' may denote a vast appointed period of punishment; the wording is kept literal from the Ge'ez.
    reason: cultural_note
  - marker: c
    text: The closing phrase is literally 'the number of the days of their sins,' preserving the text's image of punishment measured out according to their transgression.
    reason: lexical_alternative
  - marker: d
    text: Or 'the ten thousand years'.
    reason: previous_rendering
  - marker: e
    text: Or 'These are among the stars that transgressed'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들은 주님의 명령을 어긴 별들 가운데 있는 자들이며, 이곳에 갇혀 있습니다. 그들의 죄의 날 수가 계산되는 만 년이 끝날 때까지입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별들 가운데 있는’은 위치라기보다 부분 관계로 읽을 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘만 년’은 매우 긴 정해진 형벌 기간을 가리키는 문자적 표현일 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 마지막 구절은 문자적으로는 ‘그들의 죄의 날 수의 수(계산)’에 해당합니다.
    reason: lexical_alternative
