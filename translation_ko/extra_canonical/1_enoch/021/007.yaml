theological_decisions:
- issue: 환상 속 장소의 성격
  chosen_reading: 명시적 지옥명칭을 넣지 않고, 공포스럽고 심연으로 내려가는 환상적 장소로 남겼습니다.
  alternative_readings:
  - 지옥
  - 음부
  - 심판의 감옥
  rationale: 본문은 불, 틈, 심연, 거대한 불기둥을 말하지만 장소의 신학적 동일시를 직접 말하지 않으므로, 과잉 해석을 피했습니다.
  doctrine_reference: 본문의 긴장을 유지하고 후대 교리 범주를 덧씌우지 않음
