base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/007.yaml
  text: 'And from there I went to another place[a], more terrible than this, and I saw a fearful work: a great fire was there, burning and blazing, and the place had a cleft reaching to the abyss, full of great pillars of fire descending; neither its measure nor its size was I able to see[c][b], and I was not able to look at it.'
  footnotes:
  - marker: a
    text: The clause about the place being split downward is difficult in the Ge'ez. 'Cleft reaching to the abyss' represents a cautious rendering of a fissure or chasm extending to extreme depth.
    reason: textual_variant
  - marker: b
    text: Or 'I was not able to discern its measure or its magnitude.' The point is Enoch's inability to comprehend the dimensions of what he sees.
    reason: lexical_alternative
  - marker: c
    text: Or 'with great pillars of fire descending'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 거기서 이보다 더 무서운 다른 곳으로 갔습니다. 그리고 나는 두려운 일을 보았습니다. 거기에는 큰 불이 있었는데, 타오르고 활활 타올랐으며, 그곳은 깊은 심연까지 이르는 틈이 나 있었고, 내려오는 큰 불기둥들로 가득했습니다. 그 넓이도 그 크기도 나는 볼 수 없었고, 또 그것을 바라볼 수도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez는 장소가 아래로 갈라져 심연에 이르는 뜻을 어렵게 표현하므로, 여기서는 보수적으로 ‘깊은 심연까지 이르는 틈’으로 옮겼습니다.
    reason: source_note
