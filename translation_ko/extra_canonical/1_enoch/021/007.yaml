  naturalness: 현 번역은 합쇼체로 자연스럽습니다. 다만 ‘타오르고 활활 타올랐으며’는 같은 뜻의 동사가 다소 중복되어, 원문의 두 동사를 살리면서도 ‘타오르며 불꽃을 내뿜고’로 다듬는 편이 현대 한국어에서 더 자연스럽습니다.
