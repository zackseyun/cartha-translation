  text: And I went on until I came to a place where nothing is made[a].
  footnotes:
  - marker: a
    text: The line may also be understood as 'to a place where nothing had been made' or 'where nothing existed.' The Ge'ez is terse and emphasizes the place's utter lack of formed things.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 아무것도 만들어진 것이 없는 곳에 이를 때까지 계속 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어는 매우 간결합니다. 이 구절은 ‘아무것도 만들어진 적이 없는 곳’ 또는 ‘아무것도 존재하지 않는 곳’으로도 이해할 수 있습니다. 본문은 그 장소에 만들어지거나 형성된 것이 전혀 없음을 강조합니다.
    reason: lexical_alternative
