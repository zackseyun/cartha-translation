  text: And I went on until I came to a place where nothing is made[a].
  footnotes:
  - marker: a
    text: The line may also be understood as 'to a place where nothing had been made' or 'where nothing existed.' The Ge'ez is terse and emphasizes the place's utter lack of formed things.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 계속 나아가 마침내 아무것도 만들어지지 않은 곳에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈는 매우 간결하여 ‘아무것도 만들어지지 않은 곳’ 외에도 ‘아무것도 존재하지 않는 곳’으로 이해할 수 있습니다. 본문은 그 장소의 철저한 비어 있음, 곧 형성된 것의 부재를 강조합니다.
    reason: alternative_reading
