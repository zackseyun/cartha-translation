base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/004.yaml
  text: At that time I said[a], “For what sin have they been bound[c][b], and for what reason have they been cast here?”
  footnotes:
  - marker: a
    text: Or 'I asked,' since the direct question that follows may imply inquiry rather than simple speech.
    reason: lexical_alternative
  - marker: b
    text: The final verb may also suggest 'left' or 'abandoned' here, but the context of judgment favors 'cast here.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And at that time'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 나는 말했습니다[a], “어떤 죄 때문에 그들이 매여 있고[c][b], 또 어떤 이유로 여기로 던져졌습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 물었습니다’. 뒤따르는 직접 질문 때문에 발화보다 문의로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘던져졌’. 심판 장면의 맥락상 ‘버려졌다’보다 ‘던져졌다’가 더 강하게 드러납니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그리고 그때’. 게에즈 원문은 접속사 없이 시간 표현으로 바로 시작합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ውእተ ጊዜ
  english_pob_choice: At that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시간에
  - 그 시각에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간을 가리키는 서술 도입구로 자연스럽고, 비전 서사의 장면 전환을 간결하게 살립니다.
- source_word: እቤ
  english_pob_choice: I said
  chosen_korean: 나는 말했습니다
  alternatives_korean:
  - 나는 물었습니다
  - 나는 말하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접 질문이 뒤따르지만, 기초 동사는 ‘말하다’로 두어 게에즈 서술을 과도하게 해석하지 않았습니다. 공손한 문체도 유지됩니다.
- source_word: ተአስሩ
  english_pob_choice: have they been bound
  chosen_korean: 그들이 매여 있고
  alternatives_korean:
  - 그들이 묶여 있고
  - 그들이 갇혀 있고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 핵심 이미지가 ‘결박됨’이므로 ‘매여 있다’로 옮겨, 형벌적 구속의 구체성을 살렸습니다.
- source_word: ተገደፉ
  english_pob_choice: have they been cast here
  chosen_korean: 여기로 던져졌습니까
  alternatives_korean:
  - 여기로 던져졌습니까
  - 여기로 내버려졌습니까
  - 여기에 버려졌습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 심판의 장면이므로 단순한 방치보다 강한 ‘던져지다’가 적합합니다. POB의 ‘cast here’에 대응하면서도 한국어로 자연스럽습니다.
theological_decisions:
- issue: 형벌 이미지의 보존
  chosen_reading: 질문은 추상적 죄책이 아니라, 실제로 결박되고 특정 장소로 던져진 심판 장면을 묻는 말로 읽었습니다.
  alternative_readings:
  - 그들이 죄 때문에 갇혔습니까
  - 그들이 죄 때문에 버려졌습니까
  rationale: 게에즈 동사들의 구체적 물리성을 살려 묵시문학적 심판 이미지를 약화시키지 않았습니다.
  doctrine_reference: 묵시적 심판 표현을 일반 종교어로 평탄화하지 않기
- issue: 직접화법의 문체
  chosen_reading: 직접 질문은 공손한 서술문 ‘나는 말했습니다’ 뒤에 따옴표로 처리하되, 질문 자체는 중립적 어순으로 유지했습니다.
  alternative_readings:
  - 나는 물었습니다
  - 나는 이렇게 말했습니다
  rationale: 원문의 발화 도입과 질문 구조를 분리해, 시각적·서사적 긴장을 그대로 드러내기 위함입니다.
  doctrine_reference: 서술과 직접화법의 구분 보존
