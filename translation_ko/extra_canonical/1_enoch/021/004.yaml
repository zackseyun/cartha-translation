translation:
  language: ko
  text: 그때 나는 말했습니다[a], “그들은 무슨 죄 때문에 매여 있으며, 무슨 이유로 여기에 던져졌습니까[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 물었습니다’. 뒤따르는 직접 질문 때문에 단순한 발화보다 질문으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여기에 버려졌습니까’ 또는 ‘여기에 내버려졌습니까’. 마지막 동사는 ‘던져지다’ 외에 ‘버려지다’의 뜻으로도 이해될 수 있으나, 심판 장면의 문맥에서는 ‘던져지다’가 적합합니다.
    reason: lexical_alternative
