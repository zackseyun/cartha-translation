  - 여기로 내버려졌습니까
  - 여기에 버려졌습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 심판의 장면이므로 단순한 방치보다 강한 ‘던져지다’가 적합합니다. POB의 ‘cast here’에 대응하면서도 한국어로 자연스럽습니다.
theological_decisions:
- issue: 형벌 이미지의 보존
  chosen_reading: 질문은 추상적 죄책이 아니라, 실제로 결박되고 특정 장소로 던져진 심판 장면을 묻는 말로 읽었습니다.
  alternative_readings:
  - 그들이 죄 때문에 갇혔습니까
  - 그들이 죄 때문에 버려졌습니까
  rationale: 게에즈 동사들의 구체적 물리성을 살려 묵시문학적 심판 이미지를 약화시키지 않았습니다.
  doctrine_reference: 묵시적 심판 표현을 일반 종교어로 평탄화하지 않기
- issue: 직접화법의 문체
  chosen_reading: 직접 질문은 공손한 서술문 ‘나는 말했습니다’ 뒤에 따옴표로 처리하되, 질문 자체는 중립적 어순으로 유지했습니다.
  alternative_readings:
  - 나는 물었습니다
  - 나는 이렇게 말했습니다
  rationale: 원문의 발화 도입과 질문 구조를 분리해, 시각적·서사적 긴장을 그대로 드러내기 위함입니다.
  doctrine_reference: 서술과 직접화법의 구분 보존
