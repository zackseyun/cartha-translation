base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/003.yaml
  text: And there I saw seven stars of heaven[a], bound together in it, like great mountains[c][b], and burning with fire.
  footnotes:
  - marker: a
    text: The image of stars being bound likely carries symbolic force for heavenly beings under judgment, but the text itself says 'stars.'
    reason: cross_reference
  - marker: b
    text: The word rendered 'gathered together' follows a difficult Ge'ez reading (†ኅቡረ†); 'assembled' or 'clustered together' are possible.
    reason: textual_variant
  - marker: c
    text: Or 'bound above it, gathered together'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기서 나는 하늘의 일곱 별을 보았는데, 그것들은 그 안에 함께 묶여 있었고, 큰 산들 같았으며, 불에 타고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 이미지가 하늘 존재에 대한 심판 상징일 가능성은 있지만, 본문 자체는 ‘별’이라고 말합니다.
    reason: theological_note
  - marker: b
    text: ‘함께’는 묶임을 수식하는 표현으로 이해하는 것이 자연스럽습니다.
    reason: source_note
