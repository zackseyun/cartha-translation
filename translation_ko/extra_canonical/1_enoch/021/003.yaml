theological_decisions:
- issue: ‘하늘의 별’의 상징성을 본문에서 명시할지 여부
  chosen_reading: 본문에는 ‘하늘의 일곱 별’로 두고, 천사적 동일시를 명시하지 않았습니다.
  alternative_readings:
  - 일곱 천사
  - 하늘의 일곱 천상 존재
  rationale: 에녹 문헌에서 별이 심판받는 존재를 상징할 수 있지만, 원문은 실제로 ‘별’이라고 말하므로 상징 해석을 본문에 밀어 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 원문 우선과 해석 절제
- issue: ‘그 안에’의 지시 대상
  chosen_reading: ‘그 안에’로 두어, 앞 문맥의 혼돈의 장소를 가리키는 관계를 살렸습니다.
  alternative_readings:
  - 그 위에
  - 그곳에서
  rationale: 공간 관계를 과도하게 재구성하지 않고, 주어진 문맥과 조응하는 가장 직접적인 관계를 유지했습니다.
  doctrine_reference: 문맥 지시어 보존
