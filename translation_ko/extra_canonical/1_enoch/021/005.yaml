  lexicon: Dillmann Lexicon, Leslau
  rationale: 천사들의 범주를 나타내는 표현이므로, 'holy'의 종교적 무게를 살려 '거룩한'으로 옮겼습니다.
- source_word: ዘምስሌየ
  english_pob_choice: who was with me
  chosen_korean: 나와 함께 있었고
  alternatives_korean:
  - 내 곁에 있었고
  - 나와 동행했고
  lexicon: Leslau
  rationale: 동행의 의미를 자연스럽게 살리되, 시각적 환시 장면의 맥락에서 가장 무난한 표현으로 옮겼습니다.
- source_word: ዘይመርሐኒ
  english_pob_choice: was guiding me
  chosen_korean: 나를 인도하던
  alternatives_korean:
