  - 나를 인도하고 있던
  lexicon: Dillmann Lexicon, Leslau
  rationale: 지속적 인도의 뉘앙스를 살리기 위해 완료형보다는 관형형 '인도하던'을 택했습니다.
- source_word: ወትጽህቅ
  english_pob_choice: and searching
  chosen_korean: 찾고 있느냐
  alternatives_korean:
  - 구하고 있느냐
  - 애써 찾고 있느냐
  lexicon: Dillmann Lexicon, Leslau
  rationale: 최종 동사의 해석을 과도하게 심리화하지 않고, 현재 진행 중인 탐색 행위로 보이도록 '찾고 있느냐'로 옮겼습니다.
theological_decisions:
- issue: 직접 인용문의 호칭과 문체
  chosen_reading: 「에녹이여, ... 네가 ... 찾고 있느냐?」
  alternative_readings:
  - 「에녹아, ... 네가 ... 찾느냐?」
  - 「에녹이여, ... 그대가 ... 찾고 있느냐?」
  rationale: 천사의 직접 발화는 원문의 질문형을 유지하되, 한국어에서 자연스럽고 격식을 갖춘 호칭으로 옮겼습니다. 인물 간 대화이므로 합쇼체 문장 안에서 인용부 내부의 2인칭은 구어적 직접 질문을 살렸습니다.
  doctrine_reference: 번역 스타일/화법 일관성
- issue: final verb의 의미 범위
  chosen_reading: 찾고 있느냐
  alternative_readings:
  - 캐묻고 있느냐
  - 궁금해하고 있느냐
  - 열심히 알아보고 있느냐
  rationale: 마지막 동사는 단순한 '묻다'보다 더 강한 탐색적 질문을 가리키므로, 과도한 감정 해석 없이 탐색의 지속성을 드러내는 표현을 택했습니다.
  doctrine_reference: 어휘적 긴장 보존
