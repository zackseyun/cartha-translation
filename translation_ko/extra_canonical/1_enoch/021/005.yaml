base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/005.yaml
  text: And Uriel[a], one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking[b], and about whom are you inquiring and searching?”
  footnotes:
  - marker: a
    text: The final verb is uncertain in nuance. It may imply being troubled, concerned, or emotionally affected; the translation uses 'showing concern' as a cautious rendering.
    reason: lexical_alternative
  - marker: b
    text: Or 'And Uriel, one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking, and about whom are you inquiring and showing concern?”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리엘이 — 나와 함께 있었고 나를 인도하던 거룩한 천사들 가운데 하나인 그가 — 나에게 말했습니다. 「에녹이여, 누구를 두고 네가 묻고 있으며, 누구를 두고 네가 캐묻고 찾고 있느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 마지막 동사는 단순한 질문보다 더 강한 탐색·추구의 뉘앙스를 지닐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኡርኤል
  english_pob_choice: Uriel
  chosen_korean: 우리엘
  alternatives_korean:
  - 우리엘
  lexicon: Ge'ez onomastic convention
  rationale: 고유명사는 음역하는 것이 원문을 가장 직접적으로 보존하므로, 현대 외래어 표기법에 맞는 우리엘을 채택했습니다.
- source_word: ፩እምቅዱሳን መላእክት
  english_pob_choice: one of the holy angels
  chosen_korean: 거룩한 천사들 가운데 하나인
  alternatives_korean:
  - 성스러운 천사들 가운데 하나인
  - 거룩한 천사들 중 한 분인
  lexicon: Dillmann Lexicon, Leslau
  rationale: 천사들의 범주를 나타내는 표현이므로, 'holy'의 종교적 무게를 살려 '거룩한'으로 옮겼습니다.
- source_word: ዘምስሌየ
  english_pob_choice: who was with me
  chosen_korean: 나와 함께 있었고
  alternatives_korean:
  - 내 곁에 있었고
  - 나와 동행했고
  lexicon: Leslau
  rationale: 동행의 의미를 자연스럽게 살리되, 시각적 환시 장면의 맥락에서 가장 무난한 표현으로 옮겼습니다.
- source_word: ዘይመርሐኒ
  english_pob_choice: was guiding me
  chosen_korean: 나를 인도하던
  alternatives_korean:
  - 나를 이끌던
  - 나를 인도하고 있던
  lexicon: Dillmann Lexicon, Leslau
  rationale: 지속적 인도의 뉘앙스를 살리기 위해 완료형보다는 관형형 '인도하던'을 택했습니다.
- source_word: ወትጽህቅ
  english_pob_choice: and searching
  chosen_korean: 찾고 있느냐
  alternatives_korean:
  - 구하고 있느냐
  - 애써 찾고 있느냐
  lexicon: Dillmann Lexicon, Leslau
  rationale: 최종 동사의 해석을 과도하게 심리화하지 않고, 현재 진행 중인 탐색 행위로 보이도록 '찾고 있느냐'로 옮겼습니다.
theological_decisions:
- issue: 직접 인용문의 호칭과 문체
  chosen_reading: 「에녹이여, ... 네가 ... 찾고 있느냐?」
  alternative_readings:
  - 「에녹아, ... 네가 ... 찾느냐?」
  - 「에녹이여, ... 그대가 ... 찾고 있느냐?」
  rationale: 천사의 직접 발화는 원문의 질문형을 유지하되, 한국어에서 자연스럽고 격식을 갖춘 호칭으로 옮겼습니다. 인물 간 대화이므로 합쇼체 문장 안에서 인용부 내부의 2인칭은 구어적 직접 질문을 살렸습니다.
  doctrine_reference: 번역 스타일/화법 일관성
- issue: final verb의 의미 범위
  chosen_reading: 찾고 있느냐
  alternative_readings:
  - 캐묻고 있느냐
  - 궁금해하고 있느냐
  - 열심히 알아보고 있느냐
  rationale: 마지막 동사는 단순한 '묻다'보다 더 강한 탐색적 질문을 가리키므로, 과도한 감정 해석 없이 탐색의 지속성을 드러내는 표현을 택했습니다.
  doctrine_reference: 어휘적 긴장 보존
