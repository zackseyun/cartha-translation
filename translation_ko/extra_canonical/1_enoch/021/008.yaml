base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/008.yaml
  text: And at that time I said[a], “How terrible this place is[c][b], and grievous to behold.”
  footnotes:
  - marker: a
    text: The wording is somewhat difficult in the Ethiopic witness. The line is rendered here as a speech formula followed by Enoch's reaction to the place; some translators smooth 'my mouth' to 'I said.'
    reason: textual_variant
  - marker: b
    text: Or 'fearsome and painful to look upon.'
    reason: lexical_alternative
  - marker: c
    text: Or 'my mouth spoke, saying, “This place is terrible'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 나는 말했습니다. 「이곳은 얼마나 끔찍하고 보기에도 괴로운 곳입니까!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 አፎ는 여기서 ‘얼마나!’라는 감탄을 나타내는 말로 이해됩니다. 따라서 ‘내 입’으로 옮기지 않고 감탄문으로 번역했습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘얼마나 두렵고 보기에도 괴로운 곳입니까!’
    reason: lexical_alternative
lexical_decisions:
