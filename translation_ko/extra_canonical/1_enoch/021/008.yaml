  rationale: 직접화법을 여는 말하기 동사로 자연스럽게 옮겼습니다. 한국어에서는 ‘말했습니다’가 가장 읽기 쉬우면서도 무난합니다.
- source_word: ግሩም
  english_pob_choice: terrible
  chosen_korean: 끔찍하고
  alternatives_korean:
  - 두렵고
  - 무섭고
  - 소름끼치고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 경외보다 공포와 혐오가 강한 심판 환상 문맥을 반영했습니다. ‘끔찍한’은 현대 한국어에서 그 감정을 가장 직접적으로 드러냅니다.
- source_word: ወሕሙም
