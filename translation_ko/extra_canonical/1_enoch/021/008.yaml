base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/008.yaml
  text: And at that time I said[a], “How terrible this place is[c][b], and grievous to behold.”
  footnotes:
  - marker: a
    text: The wording is somewhat difficult in the Ethiopic witness. The line is rendered here as a speech formula followed by Enoch's reaction to the place; some translators smooth 'my mouth' to 'I said.'
    reason: textual_variant
  - marker: b
    text: Or 'fearsome and painful to look upon.'
    reason: lexical_alternative
  - marker: c
    text: Or 'my mouth spoke, saying, “This place is terrible'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 나는 말했습니다. 「이곳은 얼마나 끔찍하고, 보기에도 괴로운 곳입니까!」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그때 나는 말했다’이지만, 아포칼립스 서술에서는 감탄문으로 이어지는 말하기 도입으로 읽는 것이 자연스럽습니다.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘두렵고 보기에도 괴로운 곳’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 감탄의 강도를 살리면 ‘얼마나 끔찍한 곳입니까’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ ጊዜ
  english_pob_choice: at that time
  chosen_korean: 그때
  alternatives_korean:
