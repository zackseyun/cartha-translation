  alternatives_korean:
  - 보기에도 고통스러운
  - 보기에 비참한
  - 보기에도 끔찍한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘지켜보는 자에게 고통을 주는’ 뉘앙스를 살려, 시각적 인상이 주는 괴로움을 표현했습니다.
theological_decisions:
- issue: Ge'ez አፎ를 ‘my mouth’로 오독할 가능성 vs 감탄사적 표현으로 이해할 가능성
  chosen_reading: 직접화법의 도입부로 처리하여 ‘말했습니다’ 뒤에 감탄문을 배치했습니다.
  alternative_readings:
  - ‘내 입이 말했습니다’
  - ‘나는 말했습니다’
  rationale: 주어진 주해·개정 기록에 따르면 አፎ는 ‘how!’에 해당하는 감탄/의문 표지로 이해하는 편이 타당합니다. 따라서 본문은 불필요한 신체 표현을 도입하지 않고, 한국어 감탄 구조로 압축했습니다.
  doctrine_reference: 본문 비평/어휘 판단; apocalyptic speech formula 유지
