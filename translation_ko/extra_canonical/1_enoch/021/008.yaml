  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서술 흐름을 자연스럽게 잇는 시간 부사로 옮기되, 아포칼립스 문맥의 연속성을 살렸습니다.
- source_word: እቤ
