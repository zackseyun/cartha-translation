theological_decisions:
- issue: Divine title እግዚአ መናፈስት의 한국어 대응
  chosen_reading: 만군의 주
  alternative_readings:
  - 영들의 주
  - 영의 주
  rationale: 이 구절의 핵심은 ‘주께서 감추어 두셨다’는 주권성입니다. 문맥상 Enochic 고유칭호를 유지해야 하지만, 한국어로는 독자가 즉시 ‘주권적 통치자’로 읽도록 ‘만군의 주’를 선택했습니다.
  doctrine_reference: 에녹서의 고유 신칭 보존과 주권적 계시 신학
