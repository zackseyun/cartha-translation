base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/003.yaml
  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
  footnotes:
  - marker: a
    text: Or “in a hidden place” / “secretly.” The Ge'ez expression points to hiddenness, but whether it describes the place, the manner of seeing, or the concealed nature of the things seen is not fully certain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 나와 함께 가던 천사에게 물었습니다. 「내가 은밀히[a] 본 이것들은 무엇입니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨은 곳에서’ / ‘은밀한 가운데’. 게즈어 표현은 ‘숨겨짐’을 가리키지만, 그것이 장소를 뜻하는지, 보는 방식이 그런지, 아니면 본 것들의 감춰진 성격을 가리키는지는 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወተስእልክዎ
  english_pob_choice: I asked him
  chosen_korean: 나는 …에게 물었습니다
  alternatives_korean:
  - 나는 …에게 물어보았습니다
  - 나는 …에게 문의했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 기본값은 ‘묻다/요청하다’이므로, 문어체에서 자연스러운 ‘물었습니다’로 옮겼습니다.
- source_word: መልአክ
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 메신저
  - 사자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시 문맥에서 하늘 존재를 가리키므로, 일반적 의미보다 ‘천사’가 원문 의도를 더 직접적으로 드러냅니다.
- source_word: ዘምስሌየ የሐውር
  english_pob_choice: who went with me
  chosen_korean: 나와 함께 가던
  alternatives_korean:
  - 나와 함께 가는
  - 나와 동행하던
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동행하는 해석 천사의 역할을 살리면서, 한국어에서 자연스러운 진행상 ‘가던’으로 옮겼습니다.
- source_word: በኅቡእ
  english_pob_choice: in secret
  chosen_korean: 은밀한 가운데
  alternatives_korean:
  - 은밀히
  - 숨은 곳에서
  - 비밀리에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 단순한 방식 부사보다 ‘숨겨진 상태/영역’의 뉘앙스를 담으므로, 장소성과 상태성을 함께 살리는 ‘은밀한 가운데’를 택했습니다.
theological_decisions:
- issue: '‘in secret’의 범위: 장소, 방식, 혹은 감춰진 실체 여부'
  chosen_reading: ‘은밀한 가운데’로 번역해, 본문의 숨겨진 성격은 드러내되 구체적 범주는 단정하지 않았습니다.
  alternative_readings:
  - 은밀히
  - 숨은 곳에서
  - 비밀리에
  rationale: 게즈 표현이 장소·방식·숨겨진 성격 중 어느 쪽인지 확정되지 않으므로, 해석을 과도하게 좁히지 않고 긴장을 보존했습니다.
  doctrine_reference: Source-language ambiguity should remain visible rather than over-resolved.
