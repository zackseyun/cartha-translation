base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/003.yaml
  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
  footnotes:
  - marker: a
    text: Or “in a hidden place” / “secretly.” The Ge'ez expression points to hiddenness, but whether it describes the place, the manner of seeing, or the concealed nature of the things seen is not fully certain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 나와 함께 가던 천사에게 물었습니다[a]. 「내가 은밀한 가운데 본 이 일들은 무엇입니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨은 곳에서’ / ‘은밀히’. 게즈어 표현은 ‘숨겨짐’을 가리키지만, 그것이 장소를 뜻하는지, 보는 방식이 그런지, 아니면 본 것들의 감춰진 성격을 가리키는지는 분명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወተስእልክዎ
