  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시 문맥에서 하늘 존재를 가리키므로, 일반적 의미보다 ‘천사’가 원문 의도를 더 직접적으로 드러냅니다.
