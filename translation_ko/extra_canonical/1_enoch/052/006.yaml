base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/006.yaml
  text: And those mountains that your eyes saw—the mountain of iron, and the mountain of copper, and the mountain of silver, and the mountain of gold, and the mountain of soft metal, and the mountain of lead—all these will be before the Chosen One like wax before the fire, and like water that runs down from above upon those mountains; and they will become weak before his feet.
  footnotes:
  - marker: a
    text: The exact identification of the fifth metal (rendered 'soft metal') is uncertain in this Ethiopic line; possibilities proposed in scholarship include tin or another softer metal.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Elect One.' The title is a major designation in the Parables and is left locally grounded here rather than harmonized with later usage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 네 눈이 보았던 그 산들—철의 산, 구리의 산, 은의 산, 금의 산, 연한 금속의 산, 납의 산—이 모든 것은 택하신 분 앞에서 불 앞의 밀랍 같고, 위에서 그 산들 위로 내려오는 물 같을 것이며, 그들은 그의 발 앞에서 약해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘연한 금속’은 이 게즈어 항목의 정확한 금속명을 단정하기 어려워 보수적으로 옮긴 것입니다. 학계에서는 주석(tin) 등 여러 가능성이 제기됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘택하신 분’은 이 절의 Enochic 칭호를 보존한 번역입니다. 문맥상 ‘택하신 자’로도 옮길 수 있습니다.
    reason: lexical_alternative
