  chosen_reading: 현재 하늘에 숨겨진 것이라기보다, 계시될 미래의 실재를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘하늘에 있는 숨은 모든 것들’
  - ‘하늘에 이미 존재하는 숨은 것들’
  rationale: 문맥이 환시적 상징 목록으로 이어지므로, 미래 지향성을 드러내되 원문과 POB의 문장 긴장을 풀어버리지 않았습니다.
