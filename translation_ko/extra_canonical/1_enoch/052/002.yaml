base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/002.yaml
  text: 'There my eyes saw all the hidden things of heaven that are to come: a mountain of iron[a], and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal[b], and a mountain of lead.'
  footnotes:
  - marker: a
    text: The clause rendered 'that are to come' is difficult. It may also be understood more statically as 'that were there' or 'that exist in heaven.'
    reason: alternative_reading
  - marker: b
    text: The fifth metal term is uncertain. It may refer to a soft or mixed metal; some interpreters identify it more specifically as tin or electrum.
    reason: lexical_alternative
translation:
  language: ko
  text: '그곳에서 내 눈은 하늘의 숨은 모든 것들, 곧 장차 있을 것을 보았습니다: 철의 산 하나와 구리의 산 하나와 은의 산 하나와 금의 산 하나와 부드러운 금속의 산 하나와 납의 산 하나였습니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 ‘장차 있을 것’은 더 정태적으로 ‘거기에 있던 것’ 또는 ‘하늘에 존재하는 것’으로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 다섯 번째 금속어는 불확실합니다. 더 구체적으로는 주석이나 전기금(electrum)으로 이해할 수도 있습니다.
    reason: lexical_alternative
