    reason: previous_rendering
translation:
  language: ko
  text: 그 날들에는 금으로도 은으로도 구원받지 못하고, 도망칠 수도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውን / በእማንቱ መዋዕል
  english_pob_choice: And in those days
  chosen_korean: 그런 날들에는
  alternatives_korean:
  - 그때에는
  - 그 날들에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 시간 표지를 한국어로 자연스럽게 풀어, 반복되는 심판 문맥의 장중한 느낌을 살리면서도 문장을 간결하게 유지했습니다.
- source_word: ኢይድኅኑ
  english_pob_choice: they will not be saved
  chosen_korean: 구원받지 못하며
  alternatives_korean:
  - 구원되지 못하며
  - 살아남지 못하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사는 기본적으로 ‘안전하다/구원받다/피하다’의 비능동적 의미이므로, 수동·비능동을 반영한 ‘구원받지 못하다’로 옮겼습니다.
- source_word: እበወርቅ / እበብሩር
  english_pob_choice: by gold or by silver
  chosen_korean: 금으로도 은으로도
  alternatives_korean:
  - 금이나 은으로
  - 금과 은으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수단을 나타내는 전치사를 한국어 조사 ‘-으로’로 살리고, 부정문 안의 병렬 구조를 위해 ‘도’를 붙여 둘 다 효력이 없음을 강조했습니다.
- source_word: ጐይየ
  english_pob_choice: to flee
  chosen_korean: 도망칠 수도 없습니다
  alternatives_korean:
  - 달아날 수도 없습니다
  - 피할 수도 없습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘도망치다’는 도주 이미지를 가장 직접적으로 전달하며, 앞절의 금·은과 연결된 심판 장면에서 실패한 탈출을 분명히 보여 줍니다.
theological_decisions:
- issue: 구원의 범위와 의미
  chosen_reading: 이 구절은 종말 심판 앞에서 재물로 자신을 건져낼 수 없다는 뜻으로 읽었습니다.
  alternative_readings:
  - 금과 은으로도 ‘구출’될 수 없다
  - 금과 은으로도 ‘속량’할 수 없다
  rationale: 문맥상 후대의 교리적 구원론보다, 재물이 심판을 막지 못한다는 현장 의미를 드러내는 것이 더 정확합니다.
  doctrine_reference: 문맥 우선 원칙; 묵시문학의 심판 선언
