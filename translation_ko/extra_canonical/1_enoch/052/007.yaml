  text: And in those days they will not be saved by gold or by silver[b][a], nor will they be able to flee.
  footnotes:
  - marker: a
    text: Or 'they will not be delivered by gold or silver.' The Ge'ez verb can be rendered either actively ('save themselves') or more passively ('be saved / be delivered').
