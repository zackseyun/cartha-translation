base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/004.yaml
  text: And he said to me[a], “All these that you have seen will belong to the dominion of his Anointed One[c][b], so that he may command and be mighty upon the earth.”
  footnotes:
  - marker: a
    text: Or 'will be for the dominion of the Messiah.' The Ge'ez expression links the things seen in the vision to the Messiah's ruling authority.
    reason: lexical_alternative
  - marker: b
    text: '''Be mighty'' may also be understood as ''prevail'' or ''exercise power.'' The line emphasizes effective rule on the earth.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 내게 말했습니다. 「네가 본 이 모든 것은 그의 기름부음받은 이[a]의 권세에 속하게 될 것이니, 이는 그가 땅 위에서 명령하고 강해질 수 있도록 하기 위함입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez에는 ‘그의’라는 소유격이 포함되어 있습니다.
    reason: source_note
  - marker: b
    text: ‘강해지다’는 ‘강력해지다’, ‘힘을 나타내다’, 또는 ‘우세해지다’로도 이해될 수 있습니다. 여기서는 땅 위에서 행사되는 유효한 힘을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  english_pob_choice: And he said to me
  chosen_korean: 그리고 그가 내게 말했습니다
  alternatives_korean:
  - 그리고 그가 내게 말했습니다
  - 그러고는 그가 내게 말했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서사 도입 공식을 자연스러운 현대 합쇼체로 옮기되, 직접 계시 발화의 흐름을 유지했습니다.
- source_word: እሉ ኵሎሙ ዘርኢከ
  english_pob_choice: All these that you have seen
  chosen_korean: 네가 본 이 모든 것은
  alternatives_korean:
  - 네가 본 모든 것들은
  - 네가 보아 온 이 모든 것은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시어 እሉ와 총칭 표현 ኵሎሙ, 그리고 2인칭 소유/관계 표현을 함께 살려 환시에서 이미 본 대상을 가리키는 힘을 보존했습니다.
- source_word: ለስልጣነ
  english_pob_choice: to the authority of / for the dominion of
  chosen_korean: 권세 아래에 있게 될 것이니
  alternatives_korean:
  - 지배 아래에 있게 될 것이니
  - 통치 권한 아래에 있게 될 것이니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ስልጣን의 핵심 의미를 ‘권세’로 옮겨 통치·능력·권위의 폭을 함께 담고, 종속 관계를 한국어의 자연스러운 구성으로 풀었습니다.
- source_word: መሲሑ
  english_pob_choice: his Anointed One / the Messiah
  chosen_korean: 그의 기름부음받은 이
  alternatives_korean:
  - 그의 메시아
  - 그의 그리스도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 소유격이 붙은 제목을 그대로 반영해 ‘그의’를 살렸고, 프로젝트 기본값인 ‘메시아’보다 원어 의미가 분명한 ‘기름부음받은 이’로 옮겼습니다.
- source_word: ወይትኃየል
  english_pob_choice: and be mighty / prevail / exercise power
  chosen_korean: 강해지게 하려는 것입니다
  alternatives_korean:
  - 강하게 되게 하려는 것입니다
  - 권세를 떨치게 하려는 것입니다
  - 이기게 하려는 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 힘과 왕적 효능을 살리되, 단순한 ‘승리’로 좁히지 않고 ‘강해지다’로 표현해 본문이 말하는 কার্যকর한 힘을 유지했습니다.
theological_decisions:
- issue: መሲሑ의 소유격 ‘그의’ 반영 여부
  chosen_reading: 그의 기름부음받은 이
  alternative_readings:
  - 기름부음받은 이
  - 메시아
  rationale: Ge'ez 형태가 ‘그의’라는 소유 관계를 포함하므로 이를 지워서는 안 됩니다. 이 표현은 인물의 정체성을 개인 이름처럼 굳히지 않으면서도, 본문이 암시하는 권위의 근원을 보존합니다.
  doctrine_reference: 'Translation philosophy: preserve source-grammar and theological relations.'
