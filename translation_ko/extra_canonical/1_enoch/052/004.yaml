  source_fidelity: ‘그의 기름부음받은 이’와 그에 대한 권세/통치의 관계는 Ge'ez 표현과 영어 감사 기록을 충실히 반영합니다. 다만 현행 ‘강해지게 하려는 것입니다’는 기름부음받은 이를 강하게 ‘만들다’라는 사역 의미를 더하며, 원문의 목적절(그가 명령하고 강해질 수 있도록)보다 강합니다.
