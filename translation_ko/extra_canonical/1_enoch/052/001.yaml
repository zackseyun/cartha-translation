base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/001.yaml
  text: And after those days[a], in that place where I had seen all the visions of what is hidden, for I had been snatched up by a whirlwind[c][b], and it had carried me westward—
  footnotes:
  - marker: a
    text: Or 'all the hidden visions.' The Ge'ez can be read either as 'visions of what is hidden' or as 'hidden visions.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'by a whirlwind of wind,' an emphatic expression for violent wind-borne transport.
    reason: cultural_note
  - marker: c
    text: Or 'I was snatched up by a whirlwind of wind, and it carried me westward.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날들 뒤에[a], 내가 감추어진 것들의 모든 환상을 보았던 바로 그곳에서—내가 회오리바람[b][c]에 휩쓸려 올라갔기 때문에, 그것이 나를 서쪽으로 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘감추어진 환상들’로도 옮길 수 있습니다. 게에즈 원문은 ‘환상들의 대상’ 또는 ‘숨겨진 환상들’로 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘바람의 회오리바람’에 가까운 강한 반복 표현으로, 폭력적이고 급작스러운 바람에 의한 이동을 강조합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘회오리바람에 휩쓸려 올라갔고, 그것이 나를 서쪽으로 데려갔다’로도 읽을 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: እምድኅረ እማንቱ መዋዕል
  english_pob_choice: after those days
  chosen_korean: 그날들 뒤에
  alternatives_korean:
  - 그런 날들 뒤에
  - 그 후에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시적 거리감이 있는 복수 표현을 살려 ‘그날들’로 옮겼습니다. 단순한 ‘그 후에’보다 원문의 시점 표지가 더 분명합니다.
- source_word: በውእቱ መካን
  english_pob_choice: in that place
  chosen_korean: 바로 그곳에서
  alternatives_korean:
  - 그곳에서
  - 그 장소에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 장소 표지의 구체성을 살리되 한국어에서 자연스러운 지시 표현으로 옮겼습니다.
- source_word: ርኢኩ ኵሎ ራእያተ ዘበኅቡእ
  english_pob_choice: I had seen all the visions of what is hidden
  chosen_korean: 감추어진 것들의 모든 환상
  alternatives_korean:
  - 감추어진 모든 환상
  - 비밀스러운 것들의 모든 환상
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ዘበኅቡእ’의 이중 가능성(‘감추어진 것의’ / ‘감추어진’)을 의식해, 환상의 내용이 숨겨진 실재에 속한다는 점을 살리면서도 과도하게 평탄화하지 않았습니다.
- source_word: ተመሠጥኩ በአውሎጋኒ ነፋስ
  english_pob_choice: I had been snatched up by a whirlwind of wind
  chosen_korean: 회오리바람에 휩쓸려 올라갔기 때문에
  alternatives_korean:
  - 회오리바람에 낚여 올라갔기 때문에
  - 회오리바람에 붙들려 올라갔기 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘snatched up’의 급박하고 강제적인 이동을 한국어에서 자연스럽게 드러내기 위해 ‘휩쓸려 올라가다’를 택했습니다. ‘회오리바람’은 원문의 강한 풍격 이미지를 유지합니다.
- source_word: ዓረበ
  english_pob_choice: westward
  chosen_korean: 서쪽으로
  alternatives_korean:
  - 서방으로
  - 서쪽을 향해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 방향 부사로서 가장 직설적인 ‘서쪽으로’를 선택해 이동의 방향성을 분명히 했습니다.
theological_decisions:
- issue: '문장 구조: 원인의 접속사 እስመ의 보존'
  chosen_reading: ‘...올라갔기 때문에, 그것이 나를 서쪽으로 데려갔습니다’로 원인절을 살렸습니다.
  alternative_readings:
  - 원인을 생략하고 주절처럼 번역
  - ‘왜냐하면’으로 명시적으로 전환
  rationale: 이 절은 다음 절의 배경을 설명하는 원인·이유 문장입니다. ‘때문에’를 사용해 문법적 긴장을 보존하면서도 한국어 문맥에서 지나치게 설명조가 되지 않게 했습니다.
  doctrine_reference: 문학적/구문적 긴장 보존
- issue: 환상과 실제 이동의 관계
  chosen_reading: 초자연적 이동을 사실 여부로 단정하지 않고, 시적·묵시적 운반 이미지로 유지했습니다.
  alternative_readings:
  - 몸의 이동으로 단정
  - 순전히 내적 환시로 환원
  rationale: 원문은 예언자적 환시 안에서의 강한 운반 이미지를 제시하지만, 그 경험이 물리적 이동인지 내적 체험인지는 열어 둡니다. 한국어도 이 긴장을 유지해야 합니다.
  doctrine_reference: 묵시문학의 환시/이동 표상
