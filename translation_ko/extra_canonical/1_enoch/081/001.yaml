base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/001.yaml
  text: And he said to me[a], “Look, Enoch, at the tablets of heaven, and read what is written on them, and understand everything[c][b], one by one.”
  footnotes:
  - marker: a
    text: Or, more literally, “understand all things one by one.”
    reason: lexical_alternative
  - marker: b
    text: The phrase “tablets of heaven” evokes heavenly written records in apocalyptic tradition, not merely a metaphor for abstract knowledge.
    reason: cultural_note
  - marker: c
    text: Or 'every single thing'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 내게[a] 말했습니다. 「보아라, 에녹아, 하늘의 판들을[b] 보고, 그 위에 기록된 것을 읽으며, 모든 것을 하나하나 이해하라[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, “모든 것을 하나하나 이해하라.”
    reason: lexical_alternative
  - marker: b
    text: “하늘의 판들”은 단순한 비유가 아니라 묵시문학 전통의 하늘 기록을 가리키는 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 “각각의 것을”.
    reason: previous_rendering
