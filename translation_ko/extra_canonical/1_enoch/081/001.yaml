  - 하늘의 기록들
  rationale: 이 구절은 하늘에 있는 기록 매체라는 묵시적 상징을 전제하므로, 이를 일반화한 「기록」이나 「책」보다 구체적 이미지인 「판들」을 유지하는 것이 본문에 더 충실합니다.
