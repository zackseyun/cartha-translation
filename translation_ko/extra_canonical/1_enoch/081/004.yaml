base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/004.yaml
  text: 'And from it And from it I said: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.'
translation:
  language: ko
  text: 그리고 그로부터 내가 말하였습니다. “복되도다, 죽으면서도 의롭고 선한 사람은. 그에게는 불의의 책이 기록되지 않았고, 심판의 날도 발견되지 않을 것입니다.”[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘복되다/복된 자’이지만, 여기서는 축복 선언의 어조를 살려 ‘복되도다’로 옮겼습니다.
    reason: korean_style_note
  - marker: b
    text: ‘불의의 책’은 원문의 ‘잘못/불의’(ዐመፃ)를 따라 직역한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘심판의 날’은 원문의 종말론적 재판 표현(ዕለተ ኵነኔ)을 따른 것입니다.
    reason: source_note
lexical_decisions:
- source_word: ብፁዕ ብእሲ
  english_pob_choice: blessed is the man
  chosen_korean: 복되도다, … 사람은
  alternatives_korean:
  - 복된 사람은
  - 복이 있는 사람은
  lexicon: 복되다
  rationale: Ge'ez의 ብፁዕ은 단순 서술이 아니라 축복 선언의 성격이 강하므로, 형식적 축복 어조를 살려 ‘복되도다’로 옮겼습니다.
- source_word: ዘይመውት ጻድቅ ወኄር
  english_pob_choice: who dies righteous and good
  chosen_korean: 죽으면서도 의롭고 선한
  alternatives_korean:
  - 의롭고 선하게 죽는
  - 의롭고 착한 채로 죽는
  lexicon: 의 / 선
  rationale: 원문은 ‘죽는’ 행위 자체를 수식하면서 인격적 상태로서의 의로움과 선함을 함께 제시하므로, 죽음 앞의 상태를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: መጽሐፈ ዐመፃ
  english_pob_choice: book of wrongdoing
  chosen_korean: 불의의 책
  alternatives_korean:
  - 악행의 책
  - 죄악의 책
  lexicon: 책
  rationale: 문자적으로는 ‘불의/잘못’의 기록문서이므로, 전통적 신학어보다 원문 구조를 살린 ‘불의의 책’이 더 직접적입니다.
- source_word: ዕለተ ኵነኔ
  english_pob_choice: day of judgment
  chosen_korean: 심판의 날
  alternatives_korean:
  - 판결의 날
  - 재판의 날
  lexicon: 심판
  rationale: Ge'ez의 ‘심판의 날’은 최종적 판정의 종말론적 표현이므로, 현대 한국어에서도 가장 직접적인 대응인 ‘심판의 날’을 사용했습니다.
theological_decisions:
- issue: ‘no day of judgment will be found’의 종말론적 부정 표현
  chosen_reading: 그에게는 심판의 날도 발견되지 않을 것입니다
  alternative_readings:
  - 심판의 날이 없을 것입니다
  - 심판받을 날이 없을 것입니다
  rationale: 원문은 단순히 심판이 없다는 뜻보다, 그를 향해 ‘찾아낼 수 있는’ 심판의 날이 없다는 부정적 완결성을 말하므로, 발견되지 않을 것입니다로 긴장을 보존했습니다.
  doctrine_reference: 종말론적 심판 언어의 보존
