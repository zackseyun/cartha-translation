base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
  footnotes:
  - marker: a
    text: Or 'for his forbearance' or 'for his long-suffering'; the Ge'ez term can carry the sense of enduring restraint, not mere passive patience.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'children of Adam' is a literal anthropological expression for human beings, preserving the text's linkage to Adam rather than using the smoother 'humanity.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 나는 영원토록 영광의 왕이신 위대하신 주님을 찬송하였습니다. 이는 그분이 세상의 모든 일을 지으셨기 때문입니다. 또한 나는 그분의 오래 참으심[a]을 두고 주님을 찬양하였고, 아담의 자녀들[b]을 두고 그분을 찬송하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오래 참으심’은 단순한 심리적 인내보다 견디며 억제하는 인내 또는 관용의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아담의 자녀들’은 아담과의 연결을 보존하는 문자적 인류 표현입니다. 이를 ‘인류’로 풀어 옮기면 그 연결이 약해집니다.
    reason: cultural_note
