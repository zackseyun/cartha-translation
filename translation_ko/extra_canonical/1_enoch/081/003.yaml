  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 칭호를 모두 살리되, 첫 호칭의 ‘Great’와 둘째 호칭의 ‘King of Glory’를 한국어 관용에 맞게 분리하여 옮겼습니다. ‘큰 주’는 직역성을, ‘영원하신 왕’은 ‘לָעֹלָם/for ever’의 지속성을 반영합니다.
- source_word: ትዕግሥቱ
  english_pob_choice: his patience
  chosen_korean: 오래 참으심
  alternatives_korean:
