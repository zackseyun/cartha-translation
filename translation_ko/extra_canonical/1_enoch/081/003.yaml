  - 오래 참으시는 일
  - 참으심
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 심리적 ‘인내’보다, POB 주석이 지적한 강한 의미—견디며 억제하는 오래 참음/관용—를 드러내는 표현으로 옮겼습니다.
- source_word: ዲበ ውሉደ አዳም
  english_pob_choice: on account of the children of Adam
  chosen_korean: 아담의 자녀들을 두고
  alternatives_korean:
