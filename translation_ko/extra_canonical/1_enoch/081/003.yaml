  - 아담의 자녀들 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘children of Adam’의 인류-아담 연결을 보존하면서, 한국어에서는 대상/관점의 뉘앙스를 가진 ‘두고’를 사용해 지나친 인과화나 매끄러운 일반화(‘인류’)를 피했습니다.
theological_decisions:
- issue: ‘children of Adam’의 번역에서 아담계 인류 표지를 유지할지 여부
  chosen_reading: ‘아담의 자녀들’로 유지하여 인간 일반을 가리키되 아담과의 계보적 연결을 남겼습니다.
  alternative_readings:
  - 인류
  - 사람들
  - 아담의 후손들
  rationale: POB 주석이 지적하듯 이 표현은 단순한 ‘인간’보다 아담과의 연관을 보존하는 것이 중요합니다. 따라서 매끈한 추상어로 평준화하지 않았습니다.
  doctrine_reference: Source-first principle; preserve the verse’s anthropological and Adamic resonance without harmonization.
