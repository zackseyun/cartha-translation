base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
  footnotes:
  - marker: a
    text: Or 'for his forbearance' or 'for his long-suffering'; the Ge'ez term can carry the sense of enduring restraint, not mere passive patience.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'children of Adam' is a literal anthropological expression for human beings, preserving the text's linkage to Adam rather than using the smoother 'humanity.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 나는 영광의 큰 주, 곧 영원하신 왕을 찬송하였습니다. 이는 그분이 세상의 모든 일을 지으셨기 때문입니다. 또한 나는 그분의 오래 참으심에 대해 주님을 찬양하였고, 아담의 자녀들을 두고 그분을 찬송하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘오래 참으심’이며, 여기에는 단순한 심리적 인내보다 견디며 억제하는 의미가 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아담의 자녀들’은 아담과의 연결을 보존하는 문자적 인류 표지입니다. ‘인류’로 풀면 그 연결이 약해집니다.
    reason: cultural_note
lexical_decisions:
- source_word: እምሶቤሃ
  english_pob_choice: at that time
  chosen_korean: 그때
  alternatives_korean:
  - 그 시기에
  - 그때에
  - 그 무렵
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서사적 시간 연결을 자연스럽게 살리되, 묵시적 서술의 긴장을 해치지 않는 간결한 표준어로 옮겼습니다.
- source_word: ባረክዎ
  english_pob_choice: I blessed
  chosen_korean: 찬송하였습니다
  alternatives_korean:
  - 축복하였습니다
  - 복을 빌었습니다
  - 찬양하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님을 향한 동사의 방향을 살리면서, 뒤의 “찬양하다”와 중복을 피하기 위해 한국어에서는 예배적 높임을 지닌 ‘찬송하다’를 택했습니다.
- source_word: እግዚአ ዐቢይ / ንጉሠ ስብሐት
  english_pob_choice: the Great Lord, the King of Glory
  chosen_korean: 영광의 큰 주, 곧 영원하신 왕
  alternatives_korean:
  - 큰 주님, 영광의 왕
  - 영광의 왕이신 큰 주
  - 영광의 왕
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 칭호를 모두 살리되, 첫 호칭의 ‘Great’와 둘째 호칭의 ‘King of Glory’를 한국어 관용에 맞게 분리하여 옮겼습니다. ‘큰 주’는 직역성을, ‘영원하신 왕’은 ‘לָעֹלָם/for ever’의 지속성을 반영합니다.
- source_word: ትዕግሥቱ
  english_pob_choice: his patience
  chosen_korean: 오래 참으심
  alternatives_korean:
  - 인내
  - 오래 참으시는 일
  - 참으심
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 심리적 ‘인내’보다, POB 주석이 지적한 강한 의미—견디며 억제하는 오래 참음/관용—를 드러내는 표현으로 옮겼습니다.
- source_word: ዲበ ውሉደ አዳም
  english_pob_choice: on account of the children of Adam
  chosen_korean: 아담의 자녀들을 두고
  alternatives_korean:
  - 아담의 자녀들을 위하여
  - 아담의 자녀들에 관하여
  - 아담의 자녀들 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘children of Adam’의 인류-아담 연결을 보존하면서, 한국어에서는 대상/관점의 뉘앙스를 가진 ‘두고’를 사용해 지나친 인과화나 매끄러운 일반화(‘인류’)를 피했습니다.
theological_decisions:
- issue: ‘children of Adam’의 번역에서 아담계 인류 표지를 유지할지 여부
  chosen_reading: ‘아담의 자녀들’로 유지하여 인간 일반을 가리키되 아담과의 계보적 연결을 남겼습니다.
  alternative_readings:
  - 인류
  - 사람들
  - 아담의 후손들
  rationale: POB 주석이 지적하듯 이 표현은 단순한 ‘인간’보다 아담과의 연관을 보존하는 것이 중요합니다. 따라서 매끈한 추상어로 평준화하지 않았습니다.
  doctrine_reference: Source-first principle; preserve the verse’s anthropological and Adamic resonance without harmonization.
