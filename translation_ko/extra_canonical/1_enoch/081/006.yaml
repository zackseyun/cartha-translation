    rationale: ‘그러므로’는 앞 내용을 근거로 한 결론·인과를 나타내지만, ከመ는 ‘so that/in order that’처럼 뒤따르는 절을 이끄는 접속사입니다. 본문이 그 뒤에서 끊기므로 목적·결과 연결을 드러내는 미완성 표현으로 처리해야 합니다.
