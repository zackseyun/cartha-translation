  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘until’의 시간 한계를 살리면서, 단순 반복이 아니라 새로 주어질 명령을 가리키는 뜻을 반영해 ‘또 다른 명령이 있을 때까지’로 옮겼습니다.
- source_word: ከመ፡
  english_pob_choice: so that...
  chosen_korean: 그러므로…
  alternatives_korean:
  - 그래서…
  - 그리하여…
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문이 절말에서 끊겨 있어 완결 문장을 만들지 않고, 연결 표지의 미완성을 드러내는 한국어로 최소한만 반영했습니다.
theological_decisions:
- issue: 복수 화자의 반영
  chosen_reading: ‘우리는’으로 번역해 발화 주체가 단수 1인칭이 아니라 복수임을 드러냈습니다.
  alternative_readings:
  - ‘나는’으로 단수화
  - 주체를 생략
  rationale: 게에즈 동사 형태와 주석 전통상 복수 화자가 더 타당하므로, 본문의 화자 수를 지우지 않도록 했습니다.
  doctrine_reference: 본문 비평과 문법적 일치를 우선하며, 화자 정체를 임의로 단수화하지 않습니다.
