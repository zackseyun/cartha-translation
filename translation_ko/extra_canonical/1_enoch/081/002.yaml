base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/002.yaml
  text: And I looked at the tablets of heaven[a], and I read all that was written, and I understood it all; and I read the book of all the deeds of humankind and of all the children of flesh upon the earth[d][c][b], to the generations of eternity.
  footnotes:
  - marker: a
    text: Or 'the book concerning all the deeds of humankind.' The Ge'ez construction may be read as a genitival description of the book's contents.
    reason: lexical_alternative
  - marker: b
    text: '''Children of flesh'' is a literal rendering of a Semitic-style expression for human beings in their mortal, earthly condition.'
    reason: cultural_note
  - marker: c
    text: Or 'to eternal generations' / 'for the generations forever.' The closing phrase is idiomatic and expansive rather than narrowly chronological.
    reason: lexical_alternative
  - marker: d
    text: Or 'who will be upon the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 하늘의 판들을 보았고[a], 기록된 모든 것을 읽었으며, 그것들을 모두 이해했고, 사람들의 모든 행위와 땅 위에 있는[b] 모든 육체의 자녀들의 책을 읽었으니, 영원한 세대들까지[c]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 하늘의 판들은 하늘에 있는 기록판들, 곧 천상 기록을 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘땅 위에 있는’은 원문의 명시적 동사 없이 놓인 관계절을 살린 표현입니다.
    reason: source_note
  - marker: c
    text: 원문의 끝맺음은 ‘영원한 세대들’이라는 관용적·확장적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በፀፍፀፈ ሰማይ
  english_pob_choice: at the tablets of heaven
  chosen_korean: 하늘의 판들을
  alternatives_korean:
  - 하늘의 서판들을
  - 하늘의 기록판들을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘에 보관된 기록 매체라는 묵시문학적 이미지를 살리기 위해 ‘판들’을 택했습니다. ‘서판’도 가능하지만, 한국어에서는 ‘판’이 더 직관적이고 간결합니다.
- source_word: አንበብኩ ኵሎ ዘጽሑፍ
  english_pob_choice: I read all that was written
  chosen_korean: 기록된 모든 것을 읽었으며
  alternatives_korean:
  - 쓰인 모든 것을 읽었으며
  - 기록된 것들을 모두 읽었으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘기록된’은 수동적 의미를 보존하면서 문장 흐름을 자연스럽게 합니다. ‘모든 것’은 ኵሎ의 총괄성을 살립니다.
- source_word: አእመርኩ ኵሎ
  english_pob_choice: I understood it all
  chosen_korean: 그것들을 모두 이해했고
  alternatives_korean:
  - 그것을 모두 알았고
  - 전부 깨달았고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순한 열람이 아니라 인지적 파악을 가리키므로 ‘이해하다’가 가장 적절합니다. 선행된 복수 대상에 맞춰 대명사를 조정했습니다.
- source_word: ውሉደ ሥጋ
  english_pob_choice: children of flesh
  chosen_korean: 모든 육체의 자녀들
  alternatives_korean:
  - 육체의 자녀들
  - 살의 자녀들
  - 육신의 자녀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 표현을 유지하되, ‘모든’을 앞에 두어 범위를 분명히 했습니다. 묵시적·인류학적 뉘앙스를 보존하려고 ‘인간’으로 풀지 않았습니다.
- source_word: ዘዲበ ምድር
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에 있는
  alternatives_korean:
  - 땅 위에
  - 땅에 있는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어간 없는 관계절의 평행성을 살리기 위해 동사를 과도하게 보충하지 않고 자연스러운 한국어로 옮겼습니다. POB의 최종 수정처럼 불필요한 미래 시제를 넣지 않았습니다.
- source_word: እስከ ትውልደ ዓለም
  english_pob_choice: to the generations of eternity
  chosen_korean: 영원한 세대들까지
  alternatives_korean:
  - 영원한 세대들에 이르기까지
  - 세대들의 영원까지
  - 영원한 세대까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관용적으로 확장된 종말론적 시간 표현을 살리면서도 한국어로 매끈하게 만들기 위해 ‘까지’를 사용했습니다. ‘영원한 세대들’은 원문의 장엄한 중첩을 비교적 직접적으로 반영합니다.
theological_decisions:
- issue: ‘children of flesh’의 인류학적 이미지 유지
  chosen_reading: ‘육체의 자녀들’로 직역하여 육체적·피조물적 상태를 드러냈습니다.
  alternative_readings:
  - ‘인간들’
  - ‘죽을 존재들’
  - ‘땅의 사람들’
  rationale: 이 표현은 단순한 ‘사람들’보다 더 강한 묵시적 대비를 형성하므로, 한국어에서도 그 긴장을 희석하지 않는 것이 좋습니다.
  doctrine_reference: Apocalyptic anthropological contrast should remain visible; do not flatten Semitic imagery into generic anthropology.
