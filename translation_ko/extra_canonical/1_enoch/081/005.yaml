base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/005.yaml
  text: And those seven holy ones brought me near and set me on the earth before the door of my house[a], and they said to me, “Make everything known to Methuselah your son, and show all your children that no flesh is righteous before the Lord[b], for he is the one who created them.”
  footnotes:
  - marker: a
    text: Or 'before the entrance of my house.' The Ge'ez term can denote a doorway or entrance area.
    reason: lexical_alternative
  - marker: b
    text: '''No flesh'' preserves the concrete idiom of the source, meaning all mortal creatures or humanity in its embodied condition.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 일곱 거룩한 존재가 나를 가까이 데려와 내 집 문 앞 땅에 내려놓았고, 나에게 이렇게 말했습니다. “네 아들 므두셀라에게 모든 것을 알려 주고, 네 모든 자녀에게도 보여 주어라. 어떤 육체도 주님 앞에서 의롭지 못함을, 그분이 바로 그들을 지으신 분이시기 때문이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፯ ቅዱሳን
  english_pob_choice: seven holy ones
  chosen_korean: 일곱 거룩한 존재
  alternatives_korean:
  - 일곱 성도
  - 일곱 거룩한 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 에녹문헌의 천상적 존재를 가리키므로, 교회적 의미가 강한 ‘성도’보다 ‘거룩한 존재’가 본문 맥락을 더 직접적으로 드러냅니다.
- source_word: አቅረቡኒ
  english_pob_choice: brought me near
  chosen_korean: 나를 가까이 데려와
  alternatives_korean:
  - 나를 데려와
  - 나를 가까이 이끌어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 초점은 단순 이동이 아니라 ‘가까이’ 오게 하는 것에 있으므로, 방향성과 접근성을 함께 살렸습니다.
- source_word: አንበሩኒ
  english_pob_choice: set me down
  chosen_korean: 내려놓았고
  alternatives_korean:
  - 세워 놓았고
  - 놓아 두었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘에서 땅으로 옮겨지는 장면의 감각을 자연스럽게 살리면서도, 원문의 ‘두다/놓다’ 계열 의미를 유지했습니다.
- source_word: አይድዕ ኵሎ
  english_pob_choice: Make everything known
  chosen_korean: 모든 것을 알려 주고
  alternatives_korean:
  - 모든 것을 알게 하고
  - 전부 말해 주고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령형의 사역적 성격을 반영하여 단순한 정보 전달보다 ‘알려 주다’로 옮겼습니다.
- source_word: ከመ ኢ ይጸድቅ ኵሉ ዘሥጋ
  english_pob_choice: that no flesh is righteous
  chosen_korean: 어떤 육체도 … 의롭지 못함을
  alternatives_korean:
  - 모든 육체가 의롭지 않음을
  - 아무 육체도 의롭지 않음을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 구체적 관용구 ‘flesh’를 살려 ‘육체’로 옮기고, 부정의 범위를 한국어 문맥에서 자연스럽게 ‘어떤 …도’로 표현했습니다.
- source_word: በቅድመ እግዚአ
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주님 면전에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 존칭을 유지하면서 관계적·법정적 대비를 살리는 가장 자연스러운 표준어 표현으로 보았습니다.
theological_decisions:
- issue: ‘no flesh is righteous before the Lord’의 신학적 뉘앙스
  chosen_reading: 모든 육체가 창조주 앞에서 의롭다고 설 수 없다는 보편적 진술로 유지했습니다.
  alternative_readings:
  - 후대 바울식 ‘의롭다 하심’ 공식으로 읽는 해석
  - 정결/의례적 부정으로 좁히는 해석
  rationale: 에녹서의 문맥에서는 인간/피조물의 피조성 앞에서의 전면적 겸손을 강조하므로, 후대 교리 용어로 환원하지 않고 본문의 긴장을 그대로 살렸습니다.
  doctrine_reference: 창조주-피조물 구도는 유지하되, 바울서신의 칭의 공식으로 선취해 해석하지 않음
