base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/032.yaml
  text: On that day the night decreases and becomes nine parts[a], and the day becomes nine parts, and the night equals the day[b], and the year becomes exact.
  footnotes:
  - marker: a
    text: The repeated 'nine parts' reflects the book's schematic division of day and night into numbered portions in its astronomical system.
    reason: cultural_note
  - marker: b
    text: The final clause may also be rendered 'the year is made precise' or 'the year becomes complete,' depending on how one construes the Ge'ez term for exactness/completion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날에는 밤이 줄어들어 아홉 몫이 되고, 낮도 아홉 몫이 되며, 밤이 낮과 같아지고, 해가 정확해집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘아홉 몫’은 이 책이 낮과 밤을 수로 나누어 설명하는 천문 체계의 표현입니다.
    reason: cultural_note
  - marker: b
    text: 마지막 절은 문맥상 ‘해가 정확해집니다’ 외에도 ‘해가 완전해집니다’ 또는 ‘해가 정밀해집니다’로 옮길 수 있습니다.
    reason: lexical_alternative
