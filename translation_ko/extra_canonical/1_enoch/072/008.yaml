  rationale: 『에녹서』의 이 단락은 관측 묘사가 아니라 질서 잡힌 우주론적 환상을 제시하므로, 문과 이동 동작을 평이하게 바꾸지 않고 보존해야 본문의 의도가 살아납니다.
