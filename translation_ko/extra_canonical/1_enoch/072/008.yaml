base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/008.yaml
  text: And when the sun rises from the sky[a], it goes out through that fourth gate for thirty mornings[c][b], and through the fourth gate in the west of the sky it goes down exactly.
  footnotes:
  - marker: a
    text: Or 'for thirty days'; the Ge'ez reads literally 'for thirty mornings,' a time-unit used in this astronomical sequence.
    reason: lexical_alternative
  - marker: b
    text: The adverb rendered 'straightway' may also mean 'directly' or 'in a straight course.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And when the sun rises from the sky, it goes out through that fourth gate for thirty mornings, and through the fourth gate in the west of the sky it goes down straightway.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 하늘에서 해가 떠오를 때, 그 넷째 문을 통해 서른 아침 동안 나가고,[a] 하늘 서쪽에 있는 넷째 문을 통해 정확히 내려갑니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서른 날 동안’으로도 옮길 수 있습니다. 게에즈어 본문은 문자적으로 ‘서른 아침 동안’이라고 하며, 이 천문학적 연속에서 시간 단위를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘정확히’로 옮긴 부사는 ‘직접으로’, ‘곧장’으로도 옮길 수 있습니다.
    reason: lexical_alternative
