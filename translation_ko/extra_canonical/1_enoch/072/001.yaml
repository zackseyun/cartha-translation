base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/001.yaml
  text: The book of the courses of the luminaries of heaven[a], how they are, each according to their companies, and according to their dominion and their seasons, according to their names and their origins, and according to their paths, which Uriel, the holy angel who was with me, showed me—he who is their guide—and the whole record of them, as he showed me, and how it is with regard to every year of the world and forever[h][g][f][e][d][c][b], until a new work is accomplished which will endure forever.
  footnotes:
  - marker: a
    text: 'The phrase translated “in their companies” is literally “in their peoples/assemblies,” here applied metaphorically to groupings of celestial bodies (cf. alternatives: hosts, classes).'
    reason: lexical_alternative
  - marker: b
    text: “Origins” renders a word that literally means “births/origins”; in astronomical context it can suggest points of origin or “risings.”
    reason: lexical_alternative
  - marker: c
    text: “[Ordered]” is supplied for English clarity; the Geʿez reads “as the whole year of the world …,” picking up the sense from “he showed me.”
    reason: cultural_note
  - marker: d
    text: “A new work” can also be understood as “a new creation,” i.e., a decisive divine act that endures forever.
    reason: lexical_alternative
  - marker: e
    text: “The year of the world” refers to the complete annual cycle (the cosmic year) as envisioned in Enoch’s astronomical section.
    reason: cultural_note
  - marker: f
    text: Or 'and their names and their origins, and their paths'.
    reason: previous_rendering
  - marker: g
    text: Or 'how they move'.
    reason: previous_rendering
  - marker: h
    text: Or 'all their writings'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘의 광명체들의 운행에 관한 책입니다. 그들이 각기 자기 무리[a]에 따라, 자기 권세와 자기 계절에 따라, 자기 이름과 자기 기원[b]과 자기 길에 따라 어떻게 되어 있는지를, 나와 함께 있던 거룩한 천사 우리엘, 곧 그들의 인도자가 내게 보여 주었습니다. 그는 그들에 관한 온 기록[h]을 내게 보여 주었고, 세상의 모든 해[e]와 영원에 걸쳐 그것이 어떻게 되어 있는지도[g] 보여 주었습니다. 이것은 영원히 지속될 새로운 일이 이루어질 때까지입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무리’로 옮긴 말은 문자적으로 ‘백성’ 또는 ‘회중’을 뜻합니다. 여기서는 천체들의 집단을 비유적으로 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기원’은 문자적으로 ‘출생들/기원들’을 뜻합니다. 천문 문맥에서는 출발점이나 떠오르는 지점을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘새로운 일’은 ‘새 창조’로 이해될 수도 있으나, 원문은 그 범위를 명시하지 않습니다.
    reason: lexical_alternative
  - marker: e
    text: ‘세상의 모든 해’는 이 천문 부분에서 상정하는 완전한 연간 주기, 곧 우주적 한 해를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: g
    text: 또는 ‘그들이 어떻게 움직이는지’로 옮길 수 있습니다.
    reason: previous_rendering
  - marker: h
    text: 직역하면 ‘그들의 온 책’ 또는 ‘그들에 관한 온 기록’입니다. 원문의 명사는 단수입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መጽሐፈ ሚጠተ ብርሃናት ሰማይ
  english_pob_choice: The book of the courses of the luminaries of heaven
  chosen_korean: 하늘의 빛들의 움직임에 관한 책입니다
  alternatives_korean:
  - 하늘의 광명체들의 책입니다
  - 하늘 빛들의 궤도에 관한 책입니다
  lexicon: Leslau; Dillmann
  rationale: መጽሐፈ는 ‘책’이고, ብርሃናት은 천체를 가리키는 ‘빛들’로 읽히므로 ‘하늘의 빛들’로 옮기되, ሚጠተ는 이 문맥에서 단순한 목록보다 ‘움직임/운행’이 더 정확해 ‘움직임에 관한 책’으로 처리했습니다.
- source_word: በበሕዝቢሆሙ
  english_pob_choice: in their companies
  chosen_korean: 자기 무리[들의 집합]에 따라
  alternatives_korean:
  - 자기 회사에 따라
  - 자기 집단에 따라
  lexicon: Leslau; Dillmann
  rationale: ሕዝብ의 기본값은 ‘백성/회중’ 계열의 집합 명사이므로, 천체에 은유적으로 적용된 집합성을 살려 ‘무리’로 옮겼습니다. 괄호는 POB의 ‘companies’가 지시하는 집합 개념을 보조적으로 드러내기 위한 것입니다.
- source_word: በበ፡ ሥልጣኖሙ ወበበ፡ ዘመኖሙ
  english_pob_choice: according to their dominion and their seasons
  chosen_korean: 자기 지배와 자기 계절에 따라
  alternatives_korean:
  - 자기 권세와 자기 때에 따라
  - 자기 통치와 자기 시기에 따라
  lexicon: Leslau; Dillmann
  rationale: ሥልጣን은 ‘권세/권위/지배’ 범위이지만 여기서는 천체에 부여된 질서상 권한을 가리키므로 ‘지배’가 가장 직접적입니다. ዘመን은 달력적 구분을 포함해 ‘계절’이 자연스럽습니다.
- source_word: ሙላዳቲሆሙ
  english_pob_choice: their origins
  chosen_korean: 자기 기원에 따라
  alternatives_korean:
  - 자기 출생에 따라
  - 자기 시작에 따라
  - 자기 탄생에 따라
  lexicon: Leslau; Dillmann
  rationale: 기본 뜻은 ‘출생들/기원들’이지만, 천문 문맥에서는 출발점이나 기원점을 가리킬 수 있어 ‘기원’이 가장 무난하고 원문 투명성을 유지합니다.
- source_word: አውራኂሆሙ
  english_pob_choice: their paths
  chosen_korean: 자기 길에 따라
  alternatives_korean:
  - 자기 경로에 따라
  - 자기 노정에 따라
  - 자기 궤도에 따라
  lexicon: Leslau; Dillmann
  rationale: 셀 수 있는 천문학적 ‘궤도’보다, 원어의 일반적 의미인 ‘길/경로’를 살린 ‘길’이 본문이 말하는 이동의 질서를 더 직접적으로 전달합니다.
- source_word: መራኂሆሙ
  english_pob_choice: their guide
  chosen_korean: 그들의 인도자입니다
  alternatives_korean:
  - 그들의 안내자입니다
  - 그들의 지도자입니다
  lexicon: Leslau; Dillmann
  rationale: መራኂ는 ‘인도하다/이끌다’ 계열이므로, 역할을 자연스럽게 드러내는 ‘인도자’가 ‘leader’보다 원문 기능을 더 잘 반영합니다.
- source_word: መጽሐፎሙ
  english_pob_choice: the whole record of them
  chosen_korean: 그들의 온 기록도
  alternatives_korean:
  - 그들의 온 책도
  - 그들의 전체 기록도
  lexicon: Leslau; Dillmann
  rationale: 청크의 핵심은 ኵሎ መጽሐፎሙ의 ‘그들의 전체/온 책’인데, 한국어에서는 ‘온 기록’이 더 자연스럽고, 이 맥락의 천문 등록부 성격도 잘 살립니다.
- source_word: ግብር ኃዲስ
  english_pob_choice: a new work
  chosen_korean: 새로운 일이
  alternatives_korean:
  - 새로운 일
  - 새 창조
  - 새로운 사역
  lexicon: Leslau; Dillmann
  rationale: ግብር은 ‘일/행위/작업’의 폭을 가지므로, 구체적 신학적 결론을 미리 닫지 않고 가장 직접적인 ‘일’로 옮겼습니다. '이루어져'는 완료/성취의 뉘앙스를 반영합니다.
theological_decisions:
- issue: ὁ 전개형의 우주적 질서와 종말적 새 일의 관계
  chosen_reading: 본문은 천체의 질서와 달력적 순환을 설명한 뒤, 그 질서가 영원히 지속되다가 ‘새로운 일이 이루어질 때까지’라고 말하므로, 우주 질서의 현재성과 미래적 전환을 함께 살렸습니다.
  alternative_readings:
  - 달력 체계의 단순 반복 설명
  - 종말적 새 창조의 명시적 진술
  rationale: Geʿez은 ‘새로운 일’을 직접 말할 뿐 ‘새 창조’로 명시하지는 않으므로, 신학적 확대 해석을 피하면서도 종말론적 전환 가능성은 열어 두는 번역이 적절합니다.
  doctrine_reference: Translation Philosophy §Preserve theological tension
