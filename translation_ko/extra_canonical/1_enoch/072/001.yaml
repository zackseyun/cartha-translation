revisions:
- from: 하늘의 빛들의 움직임에 관한 책입니다[a]. 그들이 각각 자기 무리[들의 집합]에 따라, 자기 지배와 자기 계절에 따라, 자기 이름과 자기 기원에 따라, 그리고 자기 길에 따라 어떤지, 나와 함께 있던 거룩한 천사 우리엘이—그가 그들의 인도자입니다—나에게 보였고, 그들의 온 기록도 그가 나에게 보였습니다. 또한 세상의 모든 해와 영원에 관하여 그러하며[h][g][f][e][d][c][b], 새로운 일이 이루어져 영원히 지속될 때까지입니다.
  to: 하늘의 광명체들의 운행에 관한 책입니다. 그들이 각기 자기 무리[a]에 따라, 자기 권세와 자기 계절에 따라, 자기 이름과 자기 기원[b]과 자기 길에 따라 어떻게 되어 있는지를, 나와 함께 있던 거룩한 천사 우리엘, 곧 그들의 인도자가 내게 보여 주었습니다. 그는 그들에 관한 온 기록[h]을 내게 보여 주었고, 세상의 모든 해[e]와 영원에 걸쳐 그것이 어떻게 되어 있는지도[g] 보여 주었습니다. 이것은 영원히 지속될 새로운 일이 이루어질 때까지입니다[d].
  rationale: 문장의 논리적 연결을 원문에 맞게 재구성했습니다. 우리엘이 천체들의 무리·권세·계절·이름·기원·길 및 그 전체 기록과, 세상의 해마다 영원에 이르는 상태를 보여 준다는 구조를 보존했습니다. ‘새로운 일’은 원문의 폭을 유지하며 ‘새 창조’로 단정하지 않았습니다. 각주는 한국어로 옮기고, 실제 설명 대상에만 앵커를 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:41Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 핵심 어휘(무리, 기원, 길, 인도자, 온 기록, 새로운 일)를 대체로 반영하지만, ‘그들이 … 어떤지’의 종속절 구조가 뒤의 서술과 부자연스럽게 연결되고, ‘세상의 모든 해와 영원에 관하여 그러하며’는 원문의 ‘어떻게 되어 있는지/그 질서가 어떠한지’라는 내용을 충분히 드러내지 못합니다. 또한 መጽሐፎሙ는 단수이므로 ‘그들의 온 기록’보다 ‘그들에 관한 온 기록’이 더 명료합니다.
  naturalness: 합쇼체의 문장 종결은 갖추었으나, ‘자기 무리[들의 집합]’의 대괄호 설명은 본문에 부자연스럽게 삽입되어 있으며, ‘그가 … 보였고, … 보였습니다’의 연결도 매끄럽지 않습니다. 의미상 연관된 각주를 해당 어구에 직접 배치하고, 한국어 각주로 정리해야 합니다.
  terminology: ‘광명체’, ‘운행’, ‘무리’, ‘권세’, ‘계절’, ‘기원’, ‘길’, ‘인도자’, ‘새로운 일’은 현대의 격식 있는 성서 문체에 자연스럽고 원문의 의미 범위를 과도하게 좁히지 않습니다. ‘새 창조’는 본문에 채택하지 않아 신학적 모호성을 보존했습니다.
  issues:
  - severity: medium
    issue: 본문에 편집성 대괄호 설명이 삽입됨
    rationale: ‘자기 무리[들의 집합]’의 대괄호는 번역 본문이 아니라 각주에서 처리해야 하며, 원문의 집합 은유를 불필요하게 해설화합니다.
  - severity: medium
    issue: 후반부의 연간 질서 표현이 불완전함
    rationale: ‘세상의 모든 해와 영원에 관하여 그러하며’는 무엇이 어떠한지 अस्पष्ट하게 만듭니다. 원문은 우리엘이 세상의 모든 해와 영원에 걸친 상태·질서를 보였다는 연결을 유지합니다.
  - severity: low
    issue: 각주 언어와 앵커 배치가 목표 언어 및 내용에 맞지 않음
    rationale: 각주가 영어로 남아 있고 [h][g][f][e][d][c][b]가 한곳에 몰려 있습니다. 독자가 각주가 설명하는 어구를 알 수 있도록 관련 본문 어구 뒤에 배치해야 합니다.
  - severity: low
