  chosen_korean: 낮은 짧아지고 밤은 길어집니다
  alternatives_korean:
  - 낮이 짧아지고 밤이 길어집니다
  - 낮은 줄어들고 밤은 늘어납니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대조 구조를 그대로 살려 계절적 변화—낮의 단축과 밤의 연장—를 분명하게 전달했습니다.
- source_word: በ*ጽባሕ
