  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 '동쪽으로 돌아가서'와 연결되는 반복적 태양 운동을 자연스럽게 이어 주기 위해 '그곳에서 떠오르며'로 풀었습니다.
- source_word: የዓርብ ሠላሳ ጽባሐ
