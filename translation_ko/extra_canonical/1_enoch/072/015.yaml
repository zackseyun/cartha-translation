  - 일어납니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 태양의 상승을 자연스러운 현대 한국어로 옮기되, 천문학적 서술의 흐름을 살리기 위해 동작 자체를 간명하게 표현했습니다.
- source_word: ትሕጽር ዕለት / ትኑኅ ሌሊት
  english_pob_choice: the day grows shorter / the night lengthens
  chosen_korean: 낮은 짧아지고 밤은 길어집니다
  alternatives_korean:
  - 낮이 짧아지고 밤이 길어집니다
  - 낮은 줄어들고 밤은 늘어납니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대조 구조를 그대로 살려 계절적 변화—낮의 단축과 밤의 연장—를 분명하게 전달했습니다.
- source_word: በ*ጽባሕ
  english_pob_choice: to the east
  chosen_korean: 동쪽으로
  alternatives_korean:
  - 아침에
  - 동틀 무렵에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수정 반영에 따라 이 표현은 단순한 시간표시가 아니라 태양이 돌아가는 공간적 방향을 가리키므로, '동쪽으로'로 옮겼습니다.
- source_word: ሳድስት ኆኅት
  english_pob_choice: the sixth gate
  chosen_korean: 여섯째 문
  alternatives_korean:
  - 여섯 번째 문
  - 제6문
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 천체 질서에 속한 고정된 이미지인 '문'을 그대로 유지해 우주적 도식을 보존했습니다.
- source_word: ይሠርቅ እምኔሃ
  english_pob_choice: rises from it
  chosen_korean: 그곳에서 떠오르며
  alternatives_korean:
  - 거기서 떠오르며
  - 그 문에서 떠오르며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 '동쪽으로 돌아가서'와 연결되는 반복적 태양 운동을 자연스럽게 이어 주기 위해 '그곳에서 떠오르며'로 풀었습니다.
- source_word: የዓርብ ሠላሳ ጽባሐ
  english_pob_choice: sets for thirty mornings
  chosen_korean: 서른 아침 동안 집니다
  alternatives_korean:
  - 서른 날 동안 집니다
  - 서른 아침 동안 지게 됩니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 난해한 종결구를 POB의 'thirty mornings'에 맞추어 직역적으로 살리되, 태양의 일주를 가리키는 문맥은 유지했습니다.
theological_decisions:
- issue: 천상 문(gates) 이미지의 해석
  chosen_reading: 여섯째 문을 실제 천상의 구조물로 읽어, 비유로 약화하지 않았습니다.
  alternative_readings:
  - 계절 변화의 상징으로 완화하는 해석
  - 시적 장치로 일반화하는 해석
  rationale: 본문과 POB 주석은 이 '문들'이 천문학적 우주 도식의 일부라고 안내하므로, 독자가 비유가 아니라 환상적-우주론적 장면으로 이해하도록 유지했습니다.
  doctrine_reference: 1 Enoch Astronomical Book의 서사 세계관
- issue: 동쪽/아침의 구분
  chosen_reading: 수정에 따라 '아침'보다 '동쪽'의 공간적 이동을 우선 반영했습니다.
  alternative_readings:
  - '''아침에''로 시간 개념만 남기는 번역'
  - '''동틀 무렵에''로 절충하는 번역'
  rationale: 공인된 수정 설명이 ይገብእ를 'returns'로, በጽባሕ을 'to the east'로 지시하므로, 태양의 공간 이동을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 본문 비평 및 주해상의 방향성
