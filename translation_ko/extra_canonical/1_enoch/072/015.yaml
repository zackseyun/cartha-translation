  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 태양의 상승을 자연스러운 현대 한국어로 옮기되, 천문학적 서술의 흐름을 살리기 위해 동작 자체를 간명하게 표현했습니다.
- source_word: ትሕጽር ዕለት / ትኑኅ ሌሊት
