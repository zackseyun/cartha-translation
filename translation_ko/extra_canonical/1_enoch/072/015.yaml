base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/015.yaml
  text: And the sun rises so that the day grows shorter and the night lengthens[a], and the sun returns to the east and enters into the sixth gate[c][b], and rises from it and sets for thirty mornings.
  footnotes:
  - marker: a
    text: The final clause is textually difficult in the OCR witness. 'For thirty mornings' likely refers to a thirty-day segment of the sun's course while it uses this gate.
    reason: textual_variant
  - marker: b
    text: The repeated language of gates is part of the Astronomical Book's cosmic schema and should be read literally within the vision's world, not reduced to a mere metaphor for seasons.
    reason: cultural_note
  - marker: c
    text: Or 'enters in the morning and goes into'.
    reason: previous_rendering
translation:
  language: ko
  text: 해가 떠오르고 낮은 짧아지며 밤은 길어집니다[a]. 또 해는 동쪽으로 돌아가서 여섯째 문[b][c]으로 들어가 그 문에서 떠오르며, 서른 아침 동안 해가 집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절은 OCR 전승상 난해합니다. ‘서른 아침’은 태양이 이 문을 지나는 서른 날의 구간을 가리키는 기능적 표현일 가능성이 있습니다.
    reason: textual_variant
  - marker: b
    text: 문들에 대한 반복 표현은 1 에녹의 『천문서』에 나오는 우주 도식의 일부입니다. 이는 단순한 계절의 은유로 축소하기보다 그 환상 세계 안에서 문자적으로 이해할 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘아침에 돌아가서 여섯째 문으로 들어가’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ይትነሣእ
  english_pob_choice: rises
  chosen_korean: 떠서
  alternatives_korean:
