  rationale: 단순한 감소보다 ‘길이에서 줄어들다’가 원문의 축소·단축 의미를 더 직접적으로 드러내며, 이어지는 수치적 분할과도 잘 맞습니다.
- source_word: ትከውን ሌሊት ፲ … ክፍለ
  english_pob_choice: the night becomes ten parts
  chosen_korean: 밤은 열 부분이 되고
