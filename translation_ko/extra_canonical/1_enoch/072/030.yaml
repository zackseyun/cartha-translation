base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/030.yaml
  text: And on that day the night is shortened from its length[a], and the night becomes ten parts[b], and the day eight parts.
  footnotes:
  - marker: a
    text: The verse uses the Astronomical Book's schematic division of day and night into numbered 'parts,' a technical way of describing seasonal change rather than clock-hours.
    reason: cultural_note
  - marker: b
    text: Or 'twelve parts'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에는 밤이 그 길이에서 줄어들어 밤은 열 부분이 되고, 낮은 여덟 부분이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 ‘부분’은 시계상의 시간이 아니라, 계절 변화에 따른 밤과 낮의 비율을 나타내는 도식적 구분입니다.
    reason: cultural_note
  - marker: b
    text: 일부 전승과 판본에서는 ‘열두 부분’으로 읽기도 하지만, 여기서는 수치 체계와 문맥에 따라 ‘열 부분’으로 옮깁니다.
    reason: textual_variant
