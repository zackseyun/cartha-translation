  alternatives_korean:
  - 낮은 여덟 몫이 됩니다
  - 낮은 여덟 분할이 됩니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 밤과 대구를 이루는 계산식 표현이므로, 보조동사 ‘됩니다’를 반복해 결과 상태를 일관되게 제시했습니다.
theological_decisions:
- issue: 천문학적 ‘parts’의 의미
  chosen_reading: 이 절은 시계 시간의 설명이 아니라 밤과 낮의 비율을 숫자로 나눈 우주론적 도식으로 읽었습니다.
  alternative_readings:
  - 단순히 밤이 짧아지고 낮이 길어진다는 일반적 계절 묘사
  - 정확한 시간 단위로 오해하는 읽기
  rationale: 영어 POB의 주석처럼 이 본문은 계절 변화에 따른 밤낮의 비례를 기술하는 도식이므로, ‘부분’이라는 표현을 유지해 수치 구조를 드러내는 것이 적절합니다.
  doctrine_reference: 본문 해석상 천문학적 도식에 관한 서술이며 교리적 쟁점은 크지 않습니다.
