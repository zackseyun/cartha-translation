base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/007.yaml
  text: And in that fourth gate[a], from which the sun comes out in the first month, there are twelve open windows[c][b], from which a flame comes out when they are opened at their appointed times.
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'of the dominion of the wind' is difficult in this OCR witness. It may also be understood more specifically as 'of the angels of the winds.'
    reason: alternative_reading
  - marker: b
    text: The Astronomical Book regularly depicts the heavens with gates and openings through which luminaries, winds, and fiery heat emerge according to fixed times.
    reason: cultural_note
  - marker: c
    text: Or 'window-openings of the dominion of the wind, and from them'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 넷째 문, 곧 해가 첫째 달에 그 문으로 나오는 곳에는 열두 개의 열린 창이 있으며, 그것들이 정해진 때에 열릴 때 그 창들에서 불꽃이 나옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኆኅት ራብዕት
  english_pob_choice: fourth gate
