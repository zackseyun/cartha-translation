  chosen_korean: 열두 개의 열린 창이 있는데
  alternatives_korean:
  - 열두 개의 창이 있는데
  - 열두 개의 창문이 있는데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주거용 '창문'보다 개방구를 뜻하는 '창'이 더 직접적이어서, 우주적 구조물의 이미지를 유지했습니다.
- source_word: ላህብ
  english_pob_choice: a flame
  chosen_korean: 불꽃
  alternatives_korean:
  - 불길
  - 화염
  - 불꽃 하나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 발화 현상을 간결하게 드러내는 표현으로 '불꽃'을 택했습니다.
- source_word: ሶበ ይትረሐዉ
  english_pob_choice: when they are opened
  chosen_korean: 열릴 때
  alternatives_korean:
  - 열리면
  - 열렸을 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동적 개방 상태를 자연스럽게 살리면서도 문맥상 반복·정례적 작동을 드러냅니다.
- source_word: እምዘመነ ዚአሆሙ
  english_pob_choice: at their appointed times
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 그들의 정해진 때에
  - 제때에
  - 그때그때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체의 질서와 주기성을 가리키므로, ‘정해진 때’가 가장 간명하게 그 의미를 전달합니다.
theological_decisions:
- issue: '''열린 창''의 본문 처리'
  chosen_reading: 개정된 해석을 따라 본문에는 단순히 '열린 창'으로 옮기고, 원문 OCR의 혼동을 한국어 본문에 반영하지 않았습니다.
  alternative_readings:
  - '''바람의 지배에 속한 창'''
  - '''바람의 천사들의 창'''
  rationale: 검토 기록이 `መላክወ`를 OCR 오류로 보고 `open windows`로 교정했으므로, 본문은 그 교정된 의미를 따르는 것이 더 충실합니다.
  doctrine_reference: '본문 비평 우선 원칙: 확인 가능한 교정 본문을 따르되, 불확실한 천사론은 본문에 주입하지 않습니다.'
