  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 구조를 가리키는 이미지이므로 단순한 '문'보다 '문'을 유지해 게이트/출입구의 장면을 살렸습니다.
- source_word: ይወፅእ ፀሐይ
  english_pob_choice: the sun comes out
  chosen_korean: 해가 … 나옵니다
  alternatives_korean:
  - 해가 … 나갑니다
  - 해가 … 나와서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 기본 의미인 ‘나오다/나가다’를 자연스러운 한국어로 옮기되, 해가 문을 통해 나온다는 구체적 운동감을 살렸습니다.
- source_word: ባቲ ፲፪ መስኮተ
