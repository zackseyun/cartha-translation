base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/011.yaml
  text: And the sun comes out from that fourth gate[a], and sets in the fourth gate, and returns to the fifth gate of the east for thirty mornings[c][b]; then it comes out from it and sets in the fifth gate.
  footnotes:
  - marker: a
    text: The Ge'ez counts the period as 'thirty mornings,' a characteristic expression in this section; some English renderings smooth this to 'thirty days.'
    reason: lexical_alternative
  - marker: b
    text: The final clause repeats the fifth gate. The sequence is terse in Ge'ez and may summarize the sun's continued course after the thirty mornings rather than narrate a separate additional movement in detail.
    reason: textual_variant
  - marker: c
    text: Or 'enters the fifth gate for thirty mornings'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 해는 그 네 번째 문에서 나와 네 번째 문에 지고, 동쪽의 다섯 번째 문으로 서른 아침 동안 돌아가며, 그곳에서 나와 다섯 번째 문에 집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 기간을 ‘서른 아침’으로 세어 표현합니다. 일부 번역은 이를 ‘서른 날’로 풀어 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 다섯 번째 문을 다시 말하는 간결한 구문입니다. 동작의 세부보다 해의 계속된 진행을 압축해 말한 것으로 볼 수 있습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘동쪽의 다섯 번째 문으로 서른 아침 동안 들어간다’로 옮길 수도 있습니다.
    reason: previous_rendering
