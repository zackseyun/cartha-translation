  chosen_korean: 그 원반
  alternatives_korean:
  - 그 둘레
  - 그 공
  - 그 궤도
  lexicon: Dillmann
  rationale: 천문학적 비교에서 눈에 보이는 둥근 형상을 가리키므로, POB의 ‘disk’를 ‘원반’으로 옮겼습니다.
- source_word: ከመ ክበበ ሰማይ
  english_pob_choice: like the disk of heaven
  chosen_korean: 하늘의 원반과 같고
  alternatives_korean:
