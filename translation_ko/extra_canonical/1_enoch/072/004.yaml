base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/004.yaml
  text: And first a great light comes forth[a], whose name is the sun, and its disk is like the disk of heaven[c][b], and it is wholly full of fire that gives light and heat.
  footnotes:
  - marker: a
    text: Or 'its orb' or 'its circle'; the Ge'ez term can denote a round form or circuit. 'Disk' is chosen here because the comparison appears to concern visible shape.
    reason: lexical_alternative
  - marker: b
    text: The final pair can also be understood as 'giving light and burning' or 'shining and heating.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And the first comes forth as a great light'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 먼저 큰 빛이 나옵니다[a]. 그 이름은 해이며, 그 원반은 하늘의 원반[b][c]과 같고, 그것은 빛을 내고 열을 내는 불로 온전히 가득합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘먼저’는 ቀዳማዊ를 부사적으로 옮긴 것입니다. 영어 POB의 다른 가능성인 ‘the first’보다, 여기서는 ‘큰 빛’이 주어라는 구문을 더 자연스럽게 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘원반’은 ክበቡ의 가능한 뜻인 ‘원형/둘레/궤도’ 가운데, 이 문맥의 시각적 형상을 가장 직접적으로 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 비교는 ‘하늘의 원반’ 또는 ‘하늘의 원’으로도 옮길 수 있습니다. POB의 ‘disk of heaven’은 여기서 천상 공간의 둥근 형상을 강조합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ቀዳማዊ / ይወፅእ
  english_pob_choice: And first a great light comes forth
  chosen_korean: 그리고 먼저 큰 빛이 나옵니다
  alternatives_korean:
