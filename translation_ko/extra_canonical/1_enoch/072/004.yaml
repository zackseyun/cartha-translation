  lexicon: Dillmann
  rationale: ‘먼저’는 ቀዳማዊ의 순서 표지를 살리면서, ‘큰 빛’이 동사의 주어라는 구문도 자연스럽게 유지합니다.
- source_word: ዘስሙ ፀሐይ
