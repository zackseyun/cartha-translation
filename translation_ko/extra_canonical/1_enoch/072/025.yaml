  - 한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문들의 열거에서 단순 수량 ‘하나’보다 순서 표지 ‘첫째’가 문맥에 맞습니다. 영어 POB의 revised audit도 이 순서를 지지합니다.
- source_word: ሠላሳ ወ፩ ጸባሐ
  english_pob_choice: thirty-one mornings
  chosen_korean: 서른한 아침
  alternatives_korean:
  - 서른한 날
  - 서른한 새벽
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘아침/새벽’의 직역성을 살리면서도 한국어에서 계산 가능한 시간 단위로 읽히도록 했습니다. 본문의 천문학적 날짜 셈법을 평이하게 드러냅니다.
- source_word: ምዕራበ ሰማይ
  english_pob_choice: the west of heaven
  chosen_korean: 서쪽 하늘
  alternatives_korean:
  - 하늘의 서쪽
  - 하늘의 서편
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘하늘의 서쪽’보다 한국어에서 더 자연스럽고, 천상 구조를 해치지 않으면서도 방향성을 분명히 드러냅니다.
theological_decisions:
- issue: 천문학적 문들 사이를 오가는 해의 반복 운동을 어떻게 표현할지
  chosen_reading: 문들을 통과하는 우주적 이동을 보존하되, 한국어에서는 과도한 설명을 덧붙이지 않고 서술형으로 옮겼습니다.
  alternative_readings:
  - 상징적으로 풀어 ‘해가 서쪽에서 지고 동쪽으로 돌아갑니다’처럼 평면화하기
  - 해석을 보태어 천문학적 체계를 풀어 설명하기
  rationale: 본문은 상징적 교훈보다 1 Enoch 특유의 천문학적 질서를 전달하므로, 그 구조를 그대로 드러내는 번역이 더 적절합니다.
  doctrine_reference: 본문의 장르 보존 및 묵시문학의 우주론적 상상력
- issue: ‘서른한 아침’을 ‘서른한 날’로 평탄화할지 여부
  chosen_reading: ‘서른한 아침’으로 유지했습니다.
  alternative_readings:
  - 서른한 날
  - 31일
  rationale: 영어 POB 주석이 지적하듯 이 표현은 단순한 날짜가 아니라 천체 운행표의 셈법입니다. 원문의 이미지와 계산법을 지우지 않기 위해 직역을 유지했습니다.
  doctrine_reference: 원문 이미지 보존과 주석 가능한 번역 원칙
