  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해의 이동을 가리키는 구체적 동작을 살리기 위해 자연스럽게 ‘나와’로 옮겼습니다. 과도하게 문어적인 표현보다 문들의 통과 이미지를 유지합니다.
- source_word: ኆኅት
  english_pob_choice: gate
  chosen_korean: 문
  alternatives_korean:
  - 문
  - 문짝
  - 관문
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체들이 드나드는 우주적 ‘게이트’ 개념을 한국어 성경체에서 가장 자연스럽게 드러내는 말은 ‘문’입니다.
- source_word: አሐቲ
  english_pob_choice: first / one
  chosen_korean: 첫째
  alternatives_korean:
