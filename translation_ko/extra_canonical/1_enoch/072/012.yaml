base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/012.yaml
  text: And at that time the day grows longer by two parts[a], and the day becomes eleven parts[b], and the night grows shorter and becomes seven parts.
  footnotes:
  - marker: a
    text: The Ethiopic text marks the word for 'two' as uncertain in this witness. The sense required by the verse is that the day is reduced by two parts, yielding eleven parts for the day and seven for the night.
    reason: textual_variant
  - marker: b
    text: Or 'the day diminishes by two parts, and becomes eleven parts'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 낮은 두 몫만큼 길어지고, 낮은 열한 몫이 되며, 밤은 짧아져 일곱 몫이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 본문은 여기의 ‘두’에 해당하는 낱말이 이 증언에서 불확실함을 표시합니다. 문맥상 낮이 두 몫 줄어들어 낮은 열한 몫, 밤은 일곱 몫이 되는 뜻입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘낮이 두 몫 줄어들어 열한 몫이 됩니다’.
    reason: alternative_reading
