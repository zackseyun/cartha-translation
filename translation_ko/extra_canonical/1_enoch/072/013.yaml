base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/013.yaml
  text: And it enters at dawn and goes out through the sixth[a], and it goes out and sets in the sixth gate for thirty-two mornings[d][c][b], according to its sign.
  footnotes:
  - marker: a
    text: The Ge'ez text is compressed and somewhat repetitive here; 'the sixth' is understood as the sixth gate/opening in the sequence described throughout this chapter.
    reason: lexical_alternative
  - marker: b
    text: Literally 'thirty-two mornings.' The text counts the period by mornings rather than using a smoother English summary such as 'days.'
    reason: lexical_alternative
  - marker: c
    text: Or 'goes out through the sixth, and it sets through the sixth gate'.
    reason: previous_rendering
  - marker: d
    text: Or 'according to the sign of it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것은 새벽에 들어가 여섯째 문으로 나가고, 다시 나가서 여섯째 문에서 지며, 서른두 아침 동안 그렇게 합니다.[a][b] 이는 그 표징 때문이다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 처음의 ‘여섯째’를 압축적으로 말합니다. 이 장의 문맥에 따라 ‘여섯째 문’으로 보충했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘서른두 아침’입니다. 문맥상 ‘서른두 날’로 풀어 옮길 수도 있으나, 원문의 시간 단위를 보존했습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 표징에 따라’로 옮길 수 있습니다. 원문의 전치사구는 이유·근거 또는 관련을 나타낼 수 있습니다.
    reason: alternative_reading
