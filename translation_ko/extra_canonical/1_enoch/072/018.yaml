base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/018.yaml
  text: On that day the day diminishes by two parts[a], and the day becomes ten parts[b], and the night eight parts.
  footnotes:
  - marker: a
    text: 'The Astronomical Book regularly measures daylight and darkness in numbered ''parts.'' The verse describes the seasonal decrease of daylight: day has ten parts, night eight.'
    reason: cultural_note
  - marker: b
    text: Or 'is shortened by two parts, and it becomes ten parts for the day and eight parts for the night.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에는 낮이 두 부분만큼 줄어들고, 낮은 열 부분이 되며, 밤은 여덟 부분이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 『에녹 1서』의 천문 부분은 낮과 밤의 길이를 ‘부분’으로 계산합니다. 이 절은 계절에 따른 낮의 감소를 말하며, 낮은 열 부분, 밤은 여덟 부분이 됩니다.
    reason: source_note
