  language: ko
  text: 그날에는 낮이 두 부분 줄어들고, 낮은 열 부분이 되며, 밤은 여덟 부분이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 『에녹 1서』의 천문 부분은 낮과 밤의 길이를 ‘부분’으로 계산합니다. 이 절은 계절에 따른 낮의 감소를 말하며, 낮은 열 부분, 밤은 여덟 부분이 됩니다.
    reason: source_note
