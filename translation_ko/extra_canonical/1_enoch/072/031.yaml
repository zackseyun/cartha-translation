base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/031.yaml
  text: And on that day the sun goes out from that gate and sets in the west[a], and returns to the east and rises through the third gate for thirty-one mornings[b], and sets in the west of heaven.
  footnotes:
  - marker: a
    text: The Ge'ez wording after 'sets in the west' includes a verb that can mean 'enters' or 'returns.' Here it is rendered 'returns' because the sequence describes the sun's cyclical movement back to the east for its next rising.
    reason: lexical_alternative
  - marker: b
    text: Literally 'thirty-one mornings.' The text counts the period by successive dawns.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그날에 해는 그 문에서 나와 서쪽[ [a] ]에 지고, 다시 동쪽으로 돌아가 셋째 문을 통해 떠오르며, 이렇게 서른한 아침 동안 계속하고, 하늘의 서쪽에 집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서쪽에 지고’ 뒤의 동사군은, 단순히 위치를 말하기보다 다음 순환을 위해 동쪽으로 되돌아감을 포함할 수 있습니다. 여기서는 그 순환성을 살려 ‘다시 동쪽으로 돌아가’로 옮겼습니다.
    reason: lexical_alternative
