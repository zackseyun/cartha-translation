  yaml_path: translation/extra_canonical/1_enoch/072/017.yaml
  text: And the sun goes out from the west[a], from that sixth gate, and travels eastward, and rises in the fifth gate for thirty mornings[b], and sets again in the west in the fifth western gate.
  footnotes:
  - marker: a
    text: Literally, 'thirty mornings.' This may function as a day-count, but the Ethiopic wording is preserved.
    reason: lexical_alternative
  - marker: b
    text: Or 'from there, from the west'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 해는 서쪽에서 — 그 여섯째 문에서 — 나와 동쪽으로 여행하여, 다섯째 문에서 서른 아침 동안 떠오르며, 다시 서쪽의 다섯째 문에서 집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘서른 아침’입니다. 이는 날짜 계산으로 기능할 수 있지만, 에티오피아어 표현을 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그곳에서, 곧 서쪽에서’로도 옮길 수 있습니다.
    reason: previous_rendering
