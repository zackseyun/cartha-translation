  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사는 수량이 늘어나는 의미를 가지므로, 천문적 분할 문맥에 맞게 ‘더해져’로 자연스럽게 옮겼습니다.
- source_word: ፵ዕበታ ለማዓልት
  english_pob_choice: nine parts of the day
  chosen_korean: 아홉 부분
  alternatives_korean:
  - 낮의 아홉 부분
  - 아홉 몫
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 기술적 분할 표현을 그대로 살리기 위해 ‘부분’을 택했습니다. 문맥상 ‘낮’은 뒤의 ‘낮은’에서 보완됩니다.
- source_word: ክፍለ ጥንቅቀ
  english_pob_choice: exactly
  chosen_korean: 정확히
  alternatives_korean:
  - 정밀하게
  - 엄밀히
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጥንቅቀ의 정확성·정밀성을 반영하는 부사로, 수치 계산의 엄밀함을 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: 난해한 수치 배열을 조화시키지 않을지 여부
  chosen_reading: 전승된 어색한 수치 배열을 그대로 두고, '정확히'만 분명히 살렸습니다.
  alternative_readings:
  - 열네 부분으로 정리하여 매끈하게 번역
  - 주변 문맥에 맞추어 수치를 보정
  rationale: 이 구절은 교리적 쟁점보다 전승상의 난점을 드러내는 본문이므로, 원문의 긴장과 불확실성을 지우지 않는 번역이 적합합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
