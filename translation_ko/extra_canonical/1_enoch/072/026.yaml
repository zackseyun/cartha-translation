base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/026.yaml
  text: And on that day the night increases and becomes nine parts[a], and the night becomes twelve parts and two parts exactly[d][c][b], and the day six parts.
  footnotes:
  - marker: a
    text: The numerical wording in this verse is difficult in the Ethiopic witness. The text appears to preserve a schematic measurement of day and night in parts, but the arithmetic and syntax are awkward; some interpreters would normalize the numbers from the surrounding context.
    reason: textual_variant
  - marker: b
    text: The phrase rendered 'of a division' may also mean 'of the measure' or 'of the reckoning.'
    reason: lexical_alternative
  - marker: c
    text: Or 'decreases'.
    reason: previous_rendering
  - marker: d
    text: Or 'of a division'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에는 밤이 늘어나 아홉 부분이 되고, 밤은 열두 부분과 두 부분이 정확히 되며, 낮은 여섯 부분이 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 숫자 표현은 에티오피아어 전승에서 난해합니다. 본문은 낮과 밤의 분할을 도식적으로 보존한 것으로 보이지만, 계산과 문법이 매끄럽지 않아 일부 해석자는 문맥에 따라 수치를 정리하기도 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: በይእቲ ዕለት
  english_pob_choice: on that day
  chosen_korean: 그날에는
  alternatives_korean:
  - 그날에
  - 그 시각에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시적 시간표현의 반복성을 살리면서 현대 한국어 문장 흐름에 맞게 옮겼습니다.
- source_word: ትነሡኅ ሌሊት
  english_pob_choice: the night increases
  chosen_korean: 밤이 더해져
  alternatives_korean:
