base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/009.yaml
  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
  footnotes:
  - marker: a
    text: The Ge'ez literally repeats 'day' and 'night' in a comparative pattern ('day from day,' 'night from night'). The sense is that each successive day becomes longer and each successive night shorter.
    reason: lexical_alternative
  - marker: b
    text: Or 'until thirty dawns.' The term is literally 'morning' and likely marks a counted stage in the luminary scheme.
    reason: lexical_alternative
  - marker: c
    text: Or 'the day grows longer than day, and the night grows shorter than night'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날들에는 낮이 날마다 더 길어지고, 밤이 밤마다 더 짧아져, 서른 아침에 이를 때까지 계속됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서른 아침’은 문자적으로 ‘삼십 아침들’입니다. 여기서는 천체 운행의 도식에서 세는 단위 또는 단계를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘날마다’와 ‘밤마다’에 해당하는 반복 비교 표현을 사용하여, 낮은 점점 길어지고 밤은 점점 짧아짐을 나타냅니다.
    reason: source_note
