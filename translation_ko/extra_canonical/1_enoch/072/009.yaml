base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/009.yaml
  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
  footnotes:
  - marker: a
    text: The Ge'ez literally repeats 'day' and 'night' in a comparative pattern ('day from day,' 'night from night'). The sense is that each successive day becomes longer and each successive night shorter.
    reason: lexical_alternative
  - marker: b
    text: Or 'until thirty dawns.' The term is literally 'morning' and likely marks a counted stage in the luminary scheme.
    reason: lexical_alternative
  - marker: c
    text: Or 'the day grows longer than day, and the night grows shorter than night'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날들에는 낮이 날마다 더 길어지고, 밤은 밤마다 더 짧아지며, 삼십 아침까지 이어집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘삼십 아침’은 문자적으로는 ‘서른 아침들’이지만, 여기서는 측정된 단계 또는 기간을 가리키는 천문학적 표현일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘날마다’와 ‘밤마다’의 반복 비교를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  english_pob_choice: in those days
  chosen_korean: 그날들에는
  alternatives_korean:
  - 그때에는
  - 그 시기에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아포칼립스적 시간 표지를 자연스럽게 살리되, 특정 기간을 가리키는 복수형 뉘앙스를 유지하기 위해 ‘그날들에는’으로 옮겼습니다.
- source_word: ትነኍኅ ዕለት እምዕለት
  english_pob_choice: the day grows longer from day to day
  chosen_korean: 낮이 날마다 더 길어지고
  alternatives_korean:
  - 낮이 날마다 길어지고
  - 낮이 하루하루 더 길어지고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 비교 구조를 한국어에서 자연스럽게 풀어내기 위해 ‘날마다 더 길어지고’로 옮겼습니다. ‘낮’은 천문학적 맥락에서 day의 시간 길이를 가리키는 뜻을 분명히 합니다.
- source_word: ተኃጽር ሌሊት እምሌሊት
  english_pob_choice: the night grows shorter from night to night
  chosen_korean: 밤은 밤마다 더 짧아지며
  alternatives_korean:
  - 밤이 밤마다 더 짧아지며
  - 밤은 날마다 더 짧아지며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞 구절과 평행을 이루도록 ‘밤마다’로 대응시켜 원문의 비교적·점증적 의미를 살렸습니다.
- source_word: እስከ፡ ሠላሳ፡ ጽባሕ
  english_pob_choice: until thirty mornings
  chosen_korean: 삼십 아침까지
  alternatives_korean:
  - 서른 아침까지
  - 삼십 여명까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጽባሕ은 문자적으로 ‘아침/새벽’이므로, POB의 source note를 따라 직역성을 살린 ‘아침’으로 유지했습니다.
theological_decisions:
- issue: 비교 구조를 한국어에서 얼마나 직설적으로 유지할지
  chosen_reading: ‘날마다 더 길어지고 / 밤마다 더 짧아지며’로 비교의 누적성을 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘낮이 낮보다 더 길어지고, 밤이 밤보다 더 짧아지며’
  - ‘낮이 날로 길어지고, 밤이 날로 짧아지며’
  rationale: 이 절은 천문학적 도식에 속하므로, 의미를 뭉개지 않으면서도 한국어 문장으로 읽히는 형태가 필요합니다. 반복 비교의 핵심은 유지하되, 과도한 직역 어색함은 피했습니다.
  doctrine_reference: Translation philosophy §1, §3, §4
