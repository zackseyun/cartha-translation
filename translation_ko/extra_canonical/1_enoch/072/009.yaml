theological_decisions:
- issue: 비교 구조를 한국어에서 얼마나 직설적으로 유지할지
  chosen_reading: ‘날마다 더 길어지고 / 밤마다 더 짧아지며’로 비교의 누적성을 자연스럽게 표현했습니다.
  alternative_readings:
  - ‘낮이 낮보다 더 길어지고, 밤이 밤보다 더 짧아지며’
  - ‘낮이 날로 길어지고, 밤이 날로 짧아지며’
  rationale: 이 절은 천문학적 도식에 속하므로, 의미를 뭉개지 않으면서도 한국어 문장으로 읽히는 형태가 필요합니다. 반복 비교의 핵심은 유지하되, 과도한 직역 어색함은 피했습니다.
  doctrine_reference: Translation philosophy §1, §3, §4
