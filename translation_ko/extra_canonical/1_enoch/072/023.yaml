  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문이 가리키는 것은 천상의 구조물인 ‘gate’이므로, 직역에 가까운 ‘문’을 택해 apocalyptic 우주론의 구체성을 보존했습니다.
- source_word: ያዓርብ / በ*ሣልስት ኆኅት በዐረብ
  english_pob_choice: sets in the third gate in the west
  chosen_korean: 서쪽의 셋째 문에 집니다
  alternatives_korean:
  - 서쪽의 셋째 문으로 집니다
  - 서쪽 셋째 문에 저뭅니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘지다’는 해가 서쪽으로 기우는 표준적 한국어 표현이라, 원문의 sunset 모티프를 유지하면서도 문맥상 자연스럽습니다.
