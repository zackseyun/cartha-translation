  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘하늘’은 본문의 천상 우주론을 드러내는 핵심 공간 표지이므로, ‘서쪽의 하늘’보다 ‘하늘의 서쪽’으로 자연스럽게 옮겼습니다.
