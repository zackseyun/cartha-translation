  alternative_readings:
  - 현대적 관찰 언어로 일출·일몰 지점으로 완화해 번역할 수 있습니다.
  rationale: 이 본문은 관찰 묘사보다 질서 잡힌 천상 우주론을 제시하므로, 이미지를 평탄화하지 않고 원문이 의도한 상상 세계를 유지하는 것이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic cosmological imagery rather than reducing it to modern astronomical prose.'
