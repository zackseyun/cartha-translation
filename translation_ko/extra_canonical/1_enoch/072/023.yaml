  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB가 보존한 ‘thirty mornings’를 따라, 의미를 날로 평탄화하지 않고 아침 단위의 원문 표현을 살렸습니다.
