base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/023.yaml
  text: And the sun comes out from that third gate[a], and sets in the third gate in the west, and returns to the east, and comes out from the second gate in the east for thirty mornings; and in this way it sets in the second gate in the west of heaven.
  footnotes:
  - marker: a
    text: Literally, 'thirty mornings.' This likely marks a thirty-day interval in the sun's course, but the main text keeps the source wording.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 해는 그 셋째 문에서 나와 서쪽의 셋째 문에 집니다. 또 동쪽으로 돌아가 동쪽의 둘째 문에서 서른 아침[a] 동안 나옵니다. 이와 같이 하늘의 서쪽 둘째 문에 집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘서른 아침’입니다. 이 표현은 태양의 진행을 서른 날의 주기로 가리키는 것일 가능성이 있지만, 본문은 원문 어휘를 그대로 보존합니다.
    reason: lexical_alternative
