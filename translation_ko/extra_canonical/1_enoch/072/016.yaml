base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/016.yaml
  text: And when thirty mornings are completed[a], the day decreases by exactly one part, and the day becomes eleven parts[c][b], and the night seven.
  footnotes:
  - marker: a
    text: Literally 'thirty mornings.' In this section the expression functions as a counted interval in the solar calendar.
    reason: lexical_alternative
  - marker: b
    text: The chapter repeatedly measures day and night in numbered 'parts'; the verse states that daylight has decreased to eleven parts, while night stands at seven.
    reason: cultural_note
  - marker: c
    text: Or 'the day diminishes by one part, and it becomes eleven parts for the day and seven for the night.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 서른 아침이 다 차면, 낮은 정확히 한 부분만큼 줄어들고, 낮은 열한 부분이 되며 밤은 일곱 부분입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '서른 아침들'입니다. 이 부분에서는 태양력의 계산된 구간을 가리키는 표현으로 기능합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 장에서는 낮과 밤을 번호가 매겨진 '부분들'로 측정합니다. 이 절은 낮이 열한 부분으로 줄고 밤은 일곱 부분임을 말합니다.
    reason: cultural_note
