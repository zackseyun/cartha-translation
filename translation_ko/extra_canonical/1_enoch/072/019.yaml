  text: And the sun comes out from that fifth gate[a], and sets in the fifth gate in the west, and rises in the fourth gate according to its signs for thirty-one mornings[d][c][b], and sets in the west.
  footnotes:
  - marker: a
    text: The phrase 'for its signs' is difficult. It likely refers to the sun's observable markers or appointed indications during this thirty-one-morning span.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is terse in Ge''ez: ''and sets in the west.'' Some translators supply ''in that gate,'' but the provided witness does not explicitly repeat ''gate'' here.'
    reason: alternative_reading
  - marker: c
    text: Or 'by the fourth gate'.
    reason: previous_rendering
  - marker: d
    text: Or 'for its signs'.
    reason: previous_rendering
translation:
  language: ko
  text: 해는 그 다섯째 문에서 나와 서쪽의 다섯째 문에서 집니다. 그리고 그 표징에 따라 서른한 아침 동안 넷째 문에서 떠오르고, 서쪽으로 집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 표징에 따라’는 게에즈어 በእንተ(ba'entä)의 원인 또는 기준의 뉘앙스를 반영합니다.
    reason: source_note
  - marker: b
    text: 마지막 절은 게에즈어에서 간결하게 ‘그리고 서쪽으로 집니다’라고만 되어 있으며, ‘그 문에서’라는 말은 명시적으로 반복되지 않습니다.
    reason: alternative_reading
