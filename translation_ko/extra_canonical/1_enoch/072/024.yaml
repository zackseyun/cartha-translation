  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천문적 비율이 점차 그렇게 ‘이루어진다’는 반복 구문을 자연스럽게 반영하기 위해 현재형 서술로 옮겼습니다.
- source_word: ሌሊት
  english_pob_choice: the night
  chosen_korean: 밤이
  alternatives_korean:
  - 밤은
  - 야간이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 측정 대상의 자연스러운 한국어 표현으로 ‘밤’을 택해 낮과의 병렬을 살렸습니다.
- source_word: ዓሠርተ፡ ወአሐደ፡ ክፍለ፡ / ወዕለት፡ ሰብዓተ፡ ክፍለ
  english_pob_choice: eleven parts / and the day seven parts
  chosen_korean: 열한 부분 / 낮은 일곱 부분
  alternatives_korean:
  - 열한 몫 / 낮은 일곱 몫
  - 열한 분할 / 낮은 일곱 분할
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 본문은 시계 시간이 아니라 도식적 분할을 가리키므로, POB의 ‘parts’를 따라 ‘부분’으로 옮겨 기술적 성격을 유지했습니다.
theological_decisions:
- issue: 천문서의 도식적 시간 측정 표현
  chosen_reading: 밤과 낮을 ‘부분’으로 나누어 말하는 기술적 계산 표현으로 보았습니다.
  alternative_readings:
  - 일반적인 하루의 시간 길이 묘사로 읽기
  - 비유적 표현으로 완화해 읽기
  rationale: 문맥상 1 Enoch의 Astronomical Book은 밤과 낮의 길이를 정해진 분할 단위로 계산하는 서술이므로, 현대적 시계시간으로 바꾸지 않고 원문의 구조를 보존했습니다.
  doctrine_reference: 본문 내부의 우주론적/달력적 묘사
- issue: ትከውን의 시제 뉘앙스
  chosen_reading: ‘됩니다’로 옮겨 진행 중인 천문 주기의 현재적 사실성을 드러냈습니다.
  alternative_readings:
  - ‘될 것입니다’로 미래화
  - ‘됩니다’와 ‘되어집니다’ 사이의 중립적 서술
  rationale: POB의 수정 이력처럼 이 동사는 단순 미래보다 반복적·진행적 변화의 결과를 나타내므로, 한국어 현재 서술이 가장 자연스럽고 문맥에 맞습니다.
  doctrine_reference: 서술 시제와 반복 공식의 일관성
