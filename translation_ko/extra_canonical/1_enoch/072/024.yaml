base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/024.yaml
  text: And on that day the night becomes eleven parts[b][a], and the day seven parts.
  footnotes:
  - marker: a
    text: The verse measures night and day by numbered 'parts,' a technical feature of the Astronomical Book's schematic calendar rather than ordinary clock-hours.
    reason: cultural_note
  - marker: b
    text: Or 'will be'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날에는 밤이 열한 부분이 되고, 낮은 일곱 부분이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 ‘부분’은 일반적인 시계 시간이 아니라 「천문서」의 도식적 달력에서 밤과 낮을 수로 나눈 기술적 단위입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘될 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ወበይእቲ፡ ዕለት
  english_pob_choice: And on that day
  chosen_korean: 그리고 그날에는
  alternatives_korean:
  - 그리고 그날에
  - 그리고 그 날에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시적 시간표현의 힘을 살리면서도 한국어에서 자연스러운 서술 도입구로 옮겼습니다.
