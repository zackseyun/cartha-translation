base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/010.yaml
  text: On that day the day becomes longer than the night by a ninth part[a], and the day becomes exactly ten parts[c][b], and the night becomes exactly eight parts.
  footnotes:
  - marker: a
    text: 'The Ethiopic text includes a difficult bracketed word after ''becomes longer''; the sense of the verse remains clear: the day exceeds the night, and their lengths are then given as ten parts and eight parts.'
    reason: textual_variant
  - marker: b
    text: The 'parts' are the chapter's conventional divisions used to measure the relative lengths of day and night through the year.
    reason: cultural_note
  - marker: c
    text: Or 'by nine parts, and the day amounts to ten parts and the night to eight parts.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에는 낮이 밤보다 아홉 분의 일만큼 더 길어지고[a], 낮은 정확히 열 부분이 되며[b], 밤은 정확히 여덟 부분이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 본문에는 ‘더 길어지고’ 뒤에 판독이 어려운 괄호 안의 어구가 있으나, 이 구절의 핵심 뜻은 분명합니다. 낮이 밤보다 더 길어진다는 진술과 이어지는 수량은 유지됩니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ‘부분’은 이 장에서 낮과 밤의 상대적 길이를 재는 통상적 구분 단위입니다.
    reason: cultural_note
