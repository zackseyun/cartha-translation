base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/020.yaml
  text: On that day the day becomes equal with the night[a], [and it becomes even], and the night becomes nine parts[c][b], and the day also nine parts.
  footnotes:
  - marker: a
    text: The clause 'and it becomes even' is bracketed in the source witness and may reflect a textual addition or uncertain reading; it is retained transparently rather than omitted.
    reason: textual_variant
  - marker: b
    text: The 'parts' are schematic divisions used in the Astronomical Book's calendrical descriptions, not modern clock-hours.
    reason: cultural_note
  - marker: c
    text: Or 'amounts to nine parts, and the day also to nine parts'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날에는 낮과 밤이 서로 같아집니다[a]. [그리고 그것은 더욱 고르게 됩니다.] 밤은 아홉 몫이 되고[b][c], 낮도 아홉 몫이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사본 전승에서 이 절의 ‘그리고 그것은 더욱 고르게 됩니다’에 해당하는 구절은 대괄호로 표시되어 있어, 불확실한 이문 또는 첨가 가능성을 투명하게 반영했습니다.
    reason: textual_variant
  - marker: b
    text: ‘몫’은 현대 시각 단위가 아니라 『에녹서』의 도식적 천문 분할을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘밤이 아홉 몫이 되고, 낮도 아홉 몫이 됩니다’로 옮길 수 있습니다.
    reason: previous_rendering
