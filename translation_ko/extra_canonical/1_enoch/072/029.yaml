base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/029.yaml
  text: And the sun returns and enters the second gate[a], which is in the east; and it returns to that principal course for thirty mornings[c][b], rising and setting.
  footnotes:
  - marker: a
    text: The clause rendered 'upon this one it goes in for thirty mornings' is textually awkward in the OCR witness. The sense appears to be that the sun uses this eastern gate for a period of thirty mornings before the sequence advances.
    reason: textual_variant
  - marker: b
    text: Literally the opening verb can mean 'enters' or 'comes in'; because the subject is the sun and the verse ends with 'rising and setting,' the main text uses the idiomatic English 'rises' at the start of the verse.
    reason: lexical_alternative
  - marker: c
    text: Or 'And the sun rises and enters the other gate, the one in the east; and upon this one it goes in for thirty mornings'.
    reason: previous_rendering
translation:
  language: ko
  text: 해는 돌아와 동쪽에 있는 둘째 문[a]으로 들어가며, 그 주된 궤도[b]로 돌아가 서른 아침 동안 떠오르고 집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘둘째 문’은 앞선 문들의 연속 속에서 두 번째 문을 가리키는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘주된 궤도’는 해가 정해진 순환 경로로 되돌아감을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: ወገብአ / ገብአ
  english_pob_choice: returns / returns
  chosen_korean: 돌아와서
  alternatives_korean:
  - 들어가서
  - 가서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사군은 단순한 ‘들어감’보다 순환적 이동, 곧 해가 다시 그 길로 ‘돌아오는’ 의미를 담고 있으므로 한국어도 그 순환성을 살려야 합니다.
- source_word: ካልእ ኆኅት
  english_pob_choice: second gate
  chosen_korean: 둘째 문
  alternatives_korean:
  - 두 번째 문
  - 다른 문
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 연속되는 문들의 순서 가운데 두 번째를 가리키므로 ‘둘째’가 가장 직접적입니다.
- source_word: እንተ በምሥራቅ
  english_pob_choice: which is in the east
  chosen_korean: 동쪽에 있는
  alternatives_korean:
  - 동쪽에 있는 그
  - 동쪽의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문이 어디에 있는지를 밝히는 관계절이므로 자연스럽고 정보 손실이 적은 ‘동쪽에 있는’으로 옮겼습니다.
- source_word: አርእስቲሁ
  english_pob_choice: that principal course / chief course
  chosen_korean: 그 주된 궤도
  alternatives_korean:
  - 그 주요한 궤도
  - 본래의 궤도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해의 정해진 순환 경로를 가리키는 표현이므로 ‘주된 궤도’가 문맥과 가장 잘 맞습니다. ‘궤도’는 천문학적 운동을 드러냅니다.
- source_word: ይሠርቅ / የዓርብ
  english_pob_choice: rising and setting
  chosen_korean: 떠오르고 집니다
  alternatives_korean:
  - 떠오르고 저뭅니다
  - 솟아오르고 집니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해의 일주를 짝으로 제시하는 표현이므로, 천문학적 의미를 살리면서도 한국어 문장 흐름이 자연스러운 ‘떠오르고 집니다’를 택했습니다.
theological_decisions:
- issue: 우주 질서 묘사의 직역성 유지
  chosen_reading: 본문의 태양 이동을 상징화하지 않고, 해의 실제 이동 질서를 말하는 서술로 그대로 옮겼습니다.
  alternative_readings:
  - 비유적 질서로 완화하여 번역
  - 시적 표현으로 재구성
  rationale: 이 절은 창조 질서의 구조를 설명하는 서술로 보이므로, 의미를 약화시키지 않기 위해 천문학적 이미지를 직접 보존했습니다.
  doctrine_reference: 창조 질서와 섭리에 대한 본문 자체의 묘사 존중
- issue: ‘주된 궤도’의 보존
  chosen_reading: ‘그 주된 궤도’로 옮겨 해가 정해진 경로를 따른다는 점을 유지했습니다.
  alternative_readings:
  - ‘그 길’
  - ‘본래 길’
  rationale: 원문은 단순한 반복이 아니라 지정된 중심 경로를 가리키므로, 그 구조적 의미를 흐리지 않기 위해 ‘주된 궤도’를 유지했습니다.
  doctrine_reference: 본문 내 반복 구조와 순환 질서
