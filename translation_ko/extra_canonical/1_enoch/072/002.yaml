base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
  footnotes:
  - marker: a
    text: Or 'ordinance' or 'rule' of the luminaries. The term denotes the fixed ordering that governs the heavenly bodies.
    reason: lexical_alternative
  - marker: b
    text: Literally 'through the portals of heaven of the way of dawn ... through the portals of heaven of the west.' The English makes the directional sense explicit.
    reason: lexical_alternative
  - marker: c
    text: Or 'enters through the portals of heaven on the east, and it goes out through the western portals of heaven.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 광명체들의 첫 번째 법칙입니다.[a] 한 빛인 해는 동쪽 하늘의 문들에서 떠오르고, 서쪽 하늘의 문들에서 집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘법칙’은 ‘규례’, ‘질서’로도 옮길 수 있습니다. 여기서는 인간에게 주어진 법이 아니라 광명체의 운행을 규정하는 고정된 질서를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역에 가까운 표현은 ‘하늘의 문들, 곧 동쪽의 … 서쪽의 …’입니다. 한국어에서는 동쪽과 서쪽이 각각 ‘하늘의 문들’을 수식한다는 점을 분명히 하였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእዛዝ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 명령
  - 규례
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절에서는 천체를 지배하는 고정된 질서를 가리키므로, 일회적 ‘명령’보다 ‘율법’이 영어 POB의 ‘law’와 기능적으로 가장 가깝습니다.
- source_word: ብርሃናት
  english_pob_choice: luminaries
  chosen_korean: 광명체들
  alternatives_korean:
  - 빛들
  - 천체의 빛들
  - 발광체들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 해와 달 같은 하늘의 천체들을 가리키므로, ‘광명체들’이 격식을 유지하면서도 의미를 분명히 드러냅니다.
- source_word: ፀሐይ
  english_pob_choice: the sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고전적 천문 문맥에서는 ‘해’가 자연스럽고, 뒤의 ‘빛’과도 잘 결합됩니다.
- source_word: በኃዋኅወ ሰማይ
  english_pob_choice: in the portals of heaven
  chosen_korean: 하늘의 문들에서
  alternatives_korean:
  - 하늘의 문들 안에서
  - 하늘의 문들을 통하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지리적·우주론적 통로 이미지를 살리되 한국어로 과도하게 설명하지 않기 위해 ‘문들에서’로 옮겼습니다.
theological_decisions:
- issue: 광명체와 하늘 문들의 우주론적 이미지
  chosen_reading: 천체의 정해진 운행 질서를 묘사하는 표현으로 유지했습니다.
  alternative_readings:
  - 비유적 표현으로 완화
  - 단순한 자연현상 서술로 평준화
  rationale: 본문은 도덕적 교훈보다 창조 세계의 질서 자체를 말하므로, 묵시문학적 우주론을 약화시키지 않고 그대로 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 장르 보존 및 묵시문학적 이미지 유지
- issue: ‘동쪽에’와 ‘서쪽의 하늘 문들’의 방향 표현
  chosen_reading: 동쪽/서쪽의 대조를 직역 수준으로 보존했습니다.
  alternative_readings:
  - 동편/서편
  - 동쪽으로/서쪽으로
  rationale: Geʽez의 방향 대조를 선명하게 드러내기 위해, 지나치게 순화된 표현보다 공간적 대조가 드러나는 형태를 선택했습니다.
  doctrine_reference: 원문 방향성 보존
