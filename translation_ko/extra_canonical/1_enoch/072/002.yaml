  terminology: ትእዛዝ은 이 문맥에서 천체 운행의 고정된 질서를 가리키므로 ‘율법’보다 종교적·인간 사회적 함의가 적은 ‘법칙’이 적절합니다. ብርሃናት의 ‘광명체들’과 ኃዋኅወ의 ‘문들’은 유지할 수 있습니다.
