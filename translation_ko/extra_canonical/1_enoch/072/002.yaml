  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절에서는 천체를 지배하는 고정된 질서를 가리키므로, 일회적 ‘명령’보다 ‘율법’이 영어 POB의 ‘law’와 기능적으로 가장 가깝습니다.
- source_word: ብርሃናት
  english_pob_choice: luminaries
  chosen_korean: 광명체들
  alternatives_korean:
  - 빛들
  - 천체의 빛들
  - 발광체들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 해와 달 같은 하늘의 천체들을 가리키므로, ‘광명체들’이 격식을 유지하면서도 의미를 분명히 드러냅니다.
- source_word: ፀሐይ
  english_pob_choice: the sun
  chosen_korean: 해
  alternatives_korean:
  - 태양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고전적 천문 문맥에서는 ‘해’가 자연스럽고, 뒤의 ‘빛’과도 잘 결합됩니다.
- source_word: በኃዋኅወ ሰማይ
  english_pob_choice: in the portals of heaven
  chosen_korean: 하늘의 문들에서
  alternatives_korean:
  - 하늘의 문들 안에서
  - 하늘의 문들을 통하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지리적·우주론적 통로 이미지를 살리되 한국어로 과도하게 설명하지 않기 위해 ‘문들에서’로 옮겼습니다.
theological_decisions:
- issue: 광명체와 하늘 문들의 우주론적 이미지
  chosen_reading: 천체의 정해진 운행 질서를 묘사하는 표현으로 유지했습니다.
  alternative_readings:
  - 비유적 표현으로 완화
  - 단순한 자연현상 서술로 평준화
  rationale: 본문은 도덕적 교훈보다 창조 세계의 질서 자체를 말하므로, 묵시문학적 우주론을 약화시키지 않고 그대로 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 장르 보존 및 묵시문학적 이미지 유지
- issue: ‘동쪽에’와 ‘서쪽의 하늘 문들’의 방향 표현
  chosen_reading: 동쪽/서쪽의 대조를 직역 수준으로 보존했습니다.
  alternative_readings:
  - 동편/서편
  - 동쪽으로/서쪽으로
  rationale: Geʽez의 방향 대조를 선명하게 드러내기 위해, 지나치게 순화된 표현보다 공간적 대조가 드러나는 형태를 선택했습니다.
  doctrine_reference: 원문 방향성 보존
