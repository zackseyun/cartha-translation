base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
  footnotes:
  - marker: a
    text: Or 'ordinance' or 'rule' of the luminaries. The term denotes the fixed ordering that governs the heavenly bodies.
    reason: lexical_alternative
  - marker: b
    text: Literally 'through the portals of heaven of the way of dawn ... through the portals of heaven of the west.' The English makes the directional sense explicit.
    reason: lexical_alternative
  - marker: c
    text: Or 'enters through the portals of heaven on the east, and it goes out through the western portals of heaven.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 광명체들의 첫 율법입니다. 곧 해는 하나의 빛으로서 하늘의 문들에서 동쪽에 떠오르고, 서쪽의 하늘 문들에서 집니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘광명체들의 첫 율법’입니다. 여기서 ‘율법’은 인간에게 주어진 법이라기보다 천체를 규율하는 고정된 질서를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역상 ‘하늘의 문들, 곧 동쪽의 … 서쪽의 …’라는 식의 방향적 표현입니다. 한국어에서는 의미를 분명히 하려고 ‘동쪽에’와 ‘서쪽의 하늘 문들’로 풀었습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 번역은 ‘해가 동쪽 하늘 문들을 통하여 떠오르고 서쪽 하늘 문들을 통하여 진다’고 옮깁니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ትእዛዝ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
