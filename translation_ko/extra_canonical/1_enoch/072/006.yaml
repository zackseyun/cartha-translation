base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/006.yaml
  text: Thus it comes out in the first month through the great gate[b][a], which is the fourth of those six gates that are toward the sunrise.
  footnotes:
  - marker: a
    text: The final clause about 'those six gates ... toward the east of the sun' is bracketed in the supplied witness and may be an explanatory expansion or a textually uncertain phrase, but it fits the chapter's repeated description of six eastern gates.
    reason: textual_variant
  - marker: b
    text: Or 'which is the fourth—those six gates that are toward the east of the sun.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이 해는 첫째 달에 큰 문을 통하여 나옵니다. 그 문은 해가 떠오르는 쪽에 있는 여섯 문 가운데 넷째입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해가 떠오르는 쪽에 있는 여섯 문 가운데’에 해당하는 원문 구절은 대괄호로 제시되어 있습니다. 이는 설명적으로 덧붙여진 표현이거나 본문상 불확실한 구절일 수 있으나, 이 장에서 반복되는 동쪽의 여섯 문에 대한 묘사와는 잘 맞습니다.
    reason: textual_variant
