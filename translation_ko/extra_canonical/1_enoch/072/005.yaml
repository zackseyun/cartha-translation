  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/005.yaml
  text: And the chariots by which it ascends are driven by the wind[a], and the sun goes down from the sky and returns through the north in order to reach the east[e][d][c][b]; and it is led so that it may enter the gate and shine on the face of heaven.
  footnotes:
  - marker: a
    text: The phrase rendered 'the winds' is difficult and may more literally suggest 'the wind of ascent' or 'the rising wind.'
    reason: lexical_alternative
  - marker: b
    text: '''From the sky'' could also be rendered ''from heaven''; the Ge''ez term can cover both senses.'
    reason: lexical_alternative
  - marker: c
    text: The word translated 'openings' may also be rendered 'gates' or 'portals,' a common image in this book for celestial entryways.
    reason: lexical_alternative
  - marker: d
    text: Or 'And chariots drive on the winds'.
    reason: previous_rendering
  - marker: e
    text: Or 'the openings'.
    reason: previous_rendering
translation:
  language: ko
  text: 해가 올라가는 수레들은 상승의 바람[a][d]에 밀려 나아가고, 해는 하늘[b]에서 내려가 북쪽을 지나 동쪽에 이르도록 돌아갑니다. 또 해는 문[c][e]으로 들어가 하늘의 얼굴을 비추도록 인도됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상승의 바람’은 원문의 난해한 표현입니다. ‘올라감의 바람’ 또는 ‘떠오르는 바람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘’은 문맥에 따라 ‘천’ 또는 ‘하늘(heaven)’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘문’은 이 책에서 천체가 드나드는 천상의 출입구를 나타내는 말입니다. ‘관문’ 또는 ‘출입구’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘수레들이 상승의 바람을 타고 나아간다’로 옮길 수 있습니다.
    reason: previous_rendering
  - marker: e
    text: 또는 ‘관문’ 또는 ‘출입구’로 옮길 수 있습니다. 원문은 단수형입니다.
    reason: previous_rendering
