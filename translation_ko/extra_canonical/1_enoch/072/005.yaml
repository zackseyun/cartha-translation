  rationale: 본절은 천체의 운행을 설명하지만, 마지막 구는 천상 출입과 빛남의 상징을 담고 있으므로 동일하게 평평하게 만들지 않았습니다.
  doctrine_reference: 'Translation philosophy: readable modern Korean without flattening apocalyptic imagery.'
