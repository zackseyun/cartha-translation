    issue: 난해한 ‘상승의 바람’을 시간절로 확정함
    rationale: ‘그것이 올라갈 때에 부는 바람’은 የዓርግ ነፋስ의 명사구를 해가 올라가는 특정 때의 바람으로 해석합니다. 원문의 난점을 보존하여 본문은 ‘상승의 바람’으로, 대안은 각주로 제시하는 편이 안전합니다.
