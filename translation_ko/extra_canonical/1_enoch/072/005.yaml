theological_decisions:
- issue: 하늘/천의 번역에서 우주 관찰 묘사와 상징적 어법을 어떻게 함께 살릴지
  chosen_reading: 앞부분의 천문 묘사는 자연스러운 한국어로, 마지막의 ‘하늘의 얼굴’은 상징적 어법을 유지했습니다.
  alternative_readings:
