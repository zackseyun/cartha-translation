  source_fidelity: 초안은 해의 하강·북쪽을 통한 귀환·동쪽으로의 이동 및 천상의 문이라는 전체 흐름을 대체로 반영합니다. 그러나 የዓርግ ነፋስ의 난해한 명사구를 ‘그것이 올라갈 때에 부는 바람’으로 풀면 원문에 없는 시간절과 지시 대상을 확정하게 됩니다. 또한 마지막 목적절은 ‘하늘의 얼굴 위에 빛나게’보다 ‘하늘의 얼굴을 비추도록’이 한국어에서 더 자연스럽고, 빛이 하늘의 표면에 미치는 원문의 관계를 잘 나타냅니다.
  naturalness: ‘그것이’가 해를 가리키는지 불분명하고, ‘하늘의 얼굴 위에 빛나다’는 현대 한국어에서 다소 부자연스럽습니다. ‘해가 올라가는 수레들’, ‘상승의 바람’, ‘하늘의 얼굴을 비추도록’으로 하면 문맥과 합쇼체 문장이 더 분명해집니다.
  terminology: ‘수레들’과 단수 ‘문’은 적절합니다. 다만 각주 c의 ‘문지방’과 각주 e의 복수 ‘열린 곳들’은 단수 ኆኅተ 및 이 책의 천상 문 이미지에 맞지 않습니다. 각주 표지는 해당 단어 바로 뒤에 배치해야 하며, 현재 동쪽 뒤에 집중된 표지는 참조 대상을 흐립니다.
  issues:
