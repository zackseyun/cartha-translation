base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/021.yaml
  text: And the sun comes out from that gate[a], and sets in the west, and returns to the east, and comes out from the third gate for thirty mornings[c][b], and sets in the west at the third gate.
  footnotes:
  - marker: a
    text: Or 'gate' in each occurrence of 'window'; the Astronomical Book depicts the heavens with fixed openings for the luminaries.
    reason: lexical_alternative
  - marker: b
    text: Literally 'for thirty mornings.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And the sun goes out from that window, and sets in the west, and returns in the morning, and comes out from the third window for thirty mornings, and sets in the west at the third window.'.
    reason: previous_rendering
translation:
  language: ko
  text: 해가 그 문에서 나와 서쪽으로 집니다. 그리고 동쪽으로 돌아오며, 세 번째 문에서 나와 서쪽으로 집니다. 이는 서른 아침 동안입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 ኆኅት는 여기서 천체가 드나드는 고정된 출입구를 뜻하며, 본문 전반의 우주론적 구조상 '문'으로 옮기는 것이 더 정확합니다.
    reason: source_note
  - marker: b
    text: 직역하면 '서른 아침 동안'입니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 해의 출현·일몰 경로를 설명하는 천문학적 본문이므로, ጽባሕ을 '아침'보다 '동쪽'으로 이해할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: ኆኅት
  english_pob_choice: gate
  chosen_korean: 문
  alternatives_korean:
  - 게이트
  - 문짝
  - 창문
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 ኆኅት는 이 문맥에서 천체가 드나드는 고정된 출입구를 가리키므로, POB의 최종 영어판과 달리 한국어에서는 가장 자연스러운 '문'으로 옮겼습니다. '창문'은 어휘상 맞지 않으므로 배제합니다.
- source_word: ይወፅእ / ወይወፅእ
  english_pob_choice: comes out
  chosen_korean: 나와
  alternatives_korean:
  - 나갑니다
  - 나오며
  - 나옵니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 운동 동사를 한국어에서 간결하고 서술적으로 살리기 위해 '나와'로 옮겼습니다. 앞뒤 문맥의 천문학적 운동을 과장하지 않으면서도 출현의 이미지를 유지합니다.
- source_word: ያዓርብ በምዕራብ
  english_pob_choice: sets in the west
  chosen_korean: 서쪽으로 집니다
  alternatives_korean:
  - 서쪽에 집니다
  - 서쪽으로 넘어갑니다
  - 서쪽에 넘어갑니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해의 일몰을 자연스러운 한국어로 표현하되, 본문의 우주적 이동 이미지를 보존하기 위해 '집니다'를 택했습니다.
- source_word: ወይገብእ በጽባሕ
  english_pob_choice: returns to the east
  chosen_korean: 동쪽으로 돌아오며
  alternatives_korean:
  - 아침에 돌아오며
  - 동쪽에서 돌아오며
  - 아침에 들어오며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ዘመር/방향 표현인 ጽባሕ은 여기서 '아침'보다 '동쪽'의 공간적 의미가 더 강하므로, 최종 영어판의 개정 취지를 따라 '동쪽'으로 옮겼습니다. 동쪽으로의 회귀라는 천문학적 경로를 분명히 드러내려는 선택입니다.
- source_word: ሠላሳ ጸባሐ
  english_pob_choice: for thirty mornings
  chosen_korean: 서른 아침 동안입니다
  alternatives_korean:
  - 서른 아침 동안
  - 서른 날 동안입니다
  - 서른 날 동안
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 직역인 '서른 아침'을 유지해 본문이 말하는 시간 단위를 보존했습니다. POB의 영어 주석처럼 'mornings'를 굳이 'days'로 평준화하지 않았습니다.
theological_decisions:
- issue: 우주론적 출입구 이미지(문) 보존
  chosen_reading: 해가 고정된 '문'에서 드나드는 식의 천체 질서를 그대로 유지했습니다.
  alternative_readings:
  - 일반적인 시적 표현으로 완화
  - 창문이나 문을 구분하지 않고 단순한 출몰로 처리
  rationale: 이 본문은 추상적 비유가 아니라 천체가 정해진 개구부를 통해 이동하는 묵시적 우주론을 묘사합니다. 따라서 독자가 본문의 기이하고 구체적인 상상력을 그대로 이해하도록 보존했습니다.
  doctrine_reference: 묵시문학의 우주론적 이미지 보존
- issue: '''동쪽''으로의 회귀'
  chosen_reading: ጽባሕ을 시간 부사보다 공간 방향인 '동쪽'으로 옮겼습니다.
  alternative_readings:
  - 아침에
  - 새벽에
  rationale: 문맥상 해의 이동 경로를 설명하는 부분이므로, 시간 표현보다 방향 표현이 더 정확합니다. 이는 최종 영어 POB의 수정(returns to the east)과도 일치합니다.
  doctrine_reference: 본문 문맥 우선의 지리·우주론적 번역
