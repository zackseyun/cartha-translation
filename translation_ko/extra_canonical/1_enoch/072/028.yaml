base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/028.yaml
  text: And on that day the night decreases from its length by a ninth part[a], that is, one part, and the night becomes eleven parts[b], and the day seven parts.
  footnotes:
  - marker: a
    text: The Ethiopic text is textually difficult here, with OCR uncertainty around the numeral phrase after 'from nine.' The sense is that the night is reduced by one part, yielding a night of eleven parts and a day of seven parts.
    reason: textual_variant
  - marker: b
    text: Or 'And on that day the night decreases from nine parts by one part, and the night becomes eleven parts, and the day seven parts.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 밤은 자기 길이에서 아홉째 몫만큼, 곧 한 몫만큼 줄어듭니다. 그리고 밤은 열한 몫이 되고, 낮은 일곱 몫이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으 어 원문의 수치 표현은 본문상 판독이 어려우나, 여기서는 밤이 그 길이에서 아홉째 몫만큼, 곧 한 몫만큼 줄어든다는 뜻으로 이해했습니다.
    reason: source_note
  - marker: b
    text: ‘몫’은 본문의 기술적 분할 단위인 ‘parts’를 그대로 살린 번역입니다.
    reason: korean_style_note
