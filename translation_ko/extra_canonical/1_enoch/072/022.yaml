base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/022.yaml
  text: And on that day the night exceeds the day[a], and the night increases from night to night, and the day grows shorter from day to day, until thirty mornings, and the night becomes exactly ten parts[e][d][c][b], and the day eight parts.
  footnotes:
  - marker: a
    text: The repeated phrase 'night increases beyond night' is awkward in English but likely means 'the night increases from night to night.'
    reason: lexical_alternative
  - marker: b
    text: '''Thirty mornings'' may function as a count of successive days or dawns in the seasonal cycle; the Ge''ez wording is literally ''thirty mornings.'''
    reason: cultural_note
  - marker: c
    text: The word following 'ten parts' is textually or lexically difficult in this OCR witness and may mean 'complete,' 'exact,' or a similar qualifier of the measure.
    reason: textual_variant
  - marker: d
    text: Or 'and night increases beyond night, and the day grows shorter than day by day'.
    reason: previous_rendering
  - marker: e
    text: Or 'becomes ten parts'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날에는 밤이 낮보다 길어지고, 밤은 밤마다 길어지며, 낮은 날마다 짧아집니다. 서른 아침에 이르면 밤은 정확히 열 부분이 되고, 낮은 여덟 부분이 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘서른 아침’은 문자적으로는 서른 번의 아침 또는 새벽입니다. 이는 계절 순환에서 이어지는 날들의 수를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘부분’은 밤과 낮을 수량화하는 천문적 분할 단위를 옮긴 것입니다.
    reason: source_note
