theological_decisions:
- issue: 천문적 분량 표현의 보존
  chosen_reading: 밤과 낮을 현대적 시간 단위로 환산하지 않고, '부분'이라는 측정 언어를 그대로 유지했습니다.
  alternative_readings:
  - 밤은 열 시간, 낮은 여덟 시간
  - 밤이 길어지고 낮이 짧아집니다
  rationale: 이 단락은 계절적·우주론적 측정 문맥에 속하므로, 원문의 기술적 세계관을 보존하는 편이 더 충실합니다.
  doctrine_reference: '원문 우선 번역 원칙: 묵시적 우주론을 현대적 상식으로 평평하게 만들지 않음.'
