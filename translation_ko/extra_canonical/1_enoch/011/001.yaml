base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/001.yaml
  text: And in those days I will open the storehouses of blessing that are in heaven[a], so that I may bring them down upon the earth, upon their work and upon their labor[g][f][e][d][c][b], for the children of men.
  footnotes:
  - marker: a
    text: Or gates/openings.
    reason: lexical_alternative
  - marker: b
    text: Or treasuries; the Geʿez term can denote storerooms or treasure-houses.
    reason: lexical_alternative
  - marker: c
    text: Or blessings (plural), taking the singular as a collective for multiple benefits.
    reason: lexical_alternative
  - marker: d
    text: Or seed, a Semitic idiom for descendants.
    reason: lexical_alternative
  - marker: e
    text: Or humankind; the phrase is a conventional idiom in Enoch.
    reason: lexical_alternative
  - marker: f
    text: Or 'the doors[a] of the storehouses[b]'.
    reason: previous_rendering
  - marker: g
    text: Or 'their offspring[d]'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날들에 나는 하늘에 있는 축복의 저장고들을 열어, 그것들을 땅 위로, 곧 그들의 일과 그들의 수고 위에 내려보내겠습니다. 이는 사람의 자녀들을 위한 것입니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문들/열림’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘보물창고들’; 게에즈어는 저장실이나 보관 창고를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘축복들’; 단수형을 집합적으로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘노동’ ‘고생’.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘인류’.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  english_pob_choice: in those days
  chosen_korean: 그 날들에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아 묵시문학의 전형적 시간 표지로, 직설적이면서도 문맥의 종말론적 분위기를 살리기 위해 ‘그 날들에’로 옮겼습니다.
- source_word: መዛግብተ
  english_pob_choice: storehouses
  chosen_korean: 저장고들
  alternatives_korean:
  - 창고들
  - 보물창고들
  - 보고들
  lexicon: Leslau, Comparative Dictionary of Geʿez (Classical Ethiopic)
  rationale: ‘storehouses’의 구체적 저장 장소 이미지를 살리되, 단순한 경제적 창고보다 하늘에 있는 축복의 축적 장소라는 점을 반영해 ‘저장고들’로 번역했습니다.
- source_word: በረከት
  english_pob_choice: blessing
  chosen_korean: 축복
  alternatives_korean:
  - 복
  - 복들
  lexicon: Leslau, Comparative Dictionary of Geʿez (Classical Ethiopic)
  rationale: 여기서는 하나님의 호의와 유익이 한 덩어리로 내려오는 집합적 표현이므로, 단수형의 포괄성을 살려 ‘축복’으로 옮겼습니다.
- source_word: ግብሮሙ
  english_pob_choice: their work
  chosen_korean: 그들의 일
  alternatives_korean:
  - 그들의 행위
  - 그들의 작품
  - 그들의 일들
  lexicon: Leslau, Comparative Dictionary of Geʿez (Classical Ethiopic)
  rationale: 문맥상 인간의 실제 활동 전체를 가리키므로, 도덕적 뉘앙스를 과도하게 덧씌우지 않는 ‘일’이 가장 자연스럽습니다.
- source_word: ፃማሆሙ
  english_pob_choice: their labor
  chosen_korean: 그들의 수고
  alternatives_korean:
  - 그들의 노고
  - 그들의 노동
  lexicon: Leslau, Comparative Dictionary of Geʿez (Classical Ethiopic)
  rationale: 게에즈 ፃማ가 ‘수고, 노동, 고생’의 뜻이므로, 한국어에서는 노력의 무게와 피로감을 담는 ‘수고’가 적절합니다.
- source_word: ውሉደ ሰብእ
  english_pob_choice: children of men
  chosen_korean: 사람의 자녀들
  alternatives_korean:
  - 인간의 자녀들
  - 사람들의 자녀들
  - 인류
  lexicon: Leslau, Comparative Dictionary of Geʿez (Classical Ethiopic)
  rationale: 에녹서의 상투적 표현을 유지하되, 현대 한국어에서 자연스럽고 inclusive하게 들리도록 직역에 가까운 ‘사람의 자녀들’로 옮겼습니다.
theological_decisions:
- issue: 화자의 정체를 본문에 덧붙이지 않는 문제
  chosen_reading: 1인칭 화자가 누구인지 본문에는 명시하지 않고, 1인칭 선언 형태를 그대로 유지했습니다.
  alternative_readings:
  - 하나님이 말씀하시는 것으로 명시
  - 천사 화자로 처리
  rationale: 본문 자체는 화자의 이름을 제시하지 않으므로, 독자에게 보이는 1인칭 선언의 형식을 보존하면서도 불필요한 실명 보충은 하지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: source transparency / minimal supplementation
- issue: ‘축복’의 단수/복수 처리
  chosen_reading: 단수형을 유지해 ‘축복’으로 번역했습니다.
  alternative_readings:
  - 복들
  - 축복들
  rationale: 게에즈 단수 በረከት는 집합적 의미로 쓰일 수 있으므로, 다수의 효력을 내포한 단수 개념을 유지하는 편이 원문 형태와 의미를 함께 살립니다.
  doctrine_reference: collective singular
