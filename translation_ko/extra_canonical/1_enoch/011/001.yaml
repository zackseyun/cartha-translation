  rationale: 에녹서의 상투적 표현을 유지하되, 현대 한국어에서 자연스럽고 inclusive하게 들리도록 직역에 가까운 ‘사람의 자녀들’로 옮겼습니다.
theological_decisions:
- issue: 화자의 정체를 본문에 덧붙이지 않는 문제
  chosen_reading: 1인칭 화자가 누구인지 본문에는 명시하지 않고, 1인칭 선언 형태를 그대로 유지했습니다.
  alternative_readings:
  - 하나님이 말씀하시는 것으로 명시
  - 천사 화자로 처리
  rationale: 본문 자체는 화자의 이름을 제시하지 않으므로, 독자에게 보이는 1인칭 선언의 형식을 보존하면서도 불필요한 실명 보충은 하지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: source transparency / minimal supplementation
- issue: ‘축복’의 단수/복수 처리
  chosen_reading: 단수형을 유지해 ‘축복’으로 번역했습니다.
  alternative_readings:
  - 복들
  - 축복들
  rationale: 게에즈 단수 በረከት는 집합적 의미로 쓰일 수 있으므로, 다수의 효력을 내포한 단수 개념을 유지하는 편이 원문 형태와 의미를 함께 살립니다.
  doctrine_reference: collective singular
