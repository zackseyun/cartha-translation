  rationale: 게에즈 ፃማ가 ‘수고, 노동, 고생’의 뜻이므로, 한국어에서는 노력의 무게와 피로감을 담는 ‘수고’가 적절합니다.
- source_word: ውሉደ ሰብእ
  english_pob_choice: children of men
  chosen_korean: 사람의 자녀들
