base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/002.yaml
  text: And peace and truth shall be partners throughout all the days of the world and throughout all the generations of the world[a][b][c][d].
  footnotes:
  - marker: a
    text: Ge'ez mäwa'ələ can mean 'courses' (as of heavenly bodies) or 'ages/periods.' With 'of the world' the temporal sense is most likely here; 'courses' is retained in technical contexts (e.g., chs. 72–82).
    reason: lexical_alternative
  - marker: b
    text: The phrase sutūfānä + 'they shall be' idiomatically means 'shall be multiplied/abundant.' 'Shall abound' is a close English alternative.
    reason: lexical_alternative
  - marker: c
    text: Or 'shall be multiplied'.
    reason: previous_rendering
  - marker: d
    text: Or 'ages'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 평화와 진리는 이 세상의 모든 날 동안 또 이 세상의 모든 세대에 걸쳐 함께할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰላም
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  lexicon: Leslau Ge'ez
  rationale: Ge'ez ሰላም은 단순한 내면 상태보다 온전한 관계와 질서를 포함하는 뜻으로 쓰일 수 있어, POB의 ‘peace’에 맞추어 한국어 ‘평강’을 택했습니다.
- source_word: ርትዕ
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참됨
  - 올바름
  lexicon: Leslau Ge'ez
  rationale: 이 병렬구에서 ርትዕ은 ‘truth’로 번역되는 대칭적 명사이므로, 한국어에서도 대응되는 추상명사 ‘진리’를 사용했습니다.
- source_word: ሱቱፋነ + ይከውኑ
  english_pob_choice: shall be multiplied / shall abound
  chosen_korean: 번성할 것입니다
  alternatives_korean:
  - 풍성할 것입니다
  - 많아질 것입니다
  - 증가할 것입니다
  lexicon: Leslau Ge'ez
  rationale: 동사 결합은 단순한 존재가 아니라 평강과 진리가 풍성하게 늘어나는 뜻을 나타내므로, ‘번성하다’로 자연스럽게 옮겼습니다.
- source_word: መዋዕለ ዓለም
  english_pob_choice: throughout all the days of the world
  chosen_korean: 이 세상의 모든 날 동안
  alternatives_korean:
  - 세상의 모든 기간 동안
  - 이 세상의 모든 시대 동안
  lexicon: Leslau Ge'ez
  rationale: POB의 수정 반영대로 መዋዕል은 ‘날들’의 관용구로 보고, 시간적 지속을 살려 ‘모든 날 동안’으로 옮겼습니다.
theological_decisions:
- issue: ‘world’의 범위와 반복 구조
  chosen_reading: ‘이 세상의 모든 날’과 ‘이 세상의 모든 세대’를 병렬로 유지해, 시간 전체에 걸친 지속성과 세대적 확장을 함께 드러냈습니다.
  alternative_readings:
  - ‘영원의 날들’
  - ‘세상 끝까지’
  rationale: 본문은 동일한 전치사구를 두 번 반복하며 총체적 지속을 강조하므로, 한쪽을 축소하지 않고 두 표현을 모두 살렸습니다.
  doctrine_reference: 종말론적 축복의 보편성과 지속성
- issue: ‘평강과 진리’의 관계
  chosen_reading: 두 명사를 분리된 병렬 항목으로 두어, 둘을 하나의 단어로 합치지 않았습니다.
  alternative_readings:
  - ‘평강의 진리’
  - ‘평강과 참됨’
  rationale: 원문은 두 명사를 결합된 한 개념보다 병렬된 복수 항목으로 제시하므로, 그 긴장과 균형을 보존했습니다.
  doctrine_reference: 히브리적/셈어적 병렬법
