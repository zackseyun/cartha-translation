base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/004.yaml
  text: And this Son of Man whom you have seen will raise up kings and the mighty from their couches, and the strong from their thrones; and he will loosen the loins of the strong, and crush the teeth of sinners.
  footnotes:
  - marker: a
    text: Or 'beds.' The image is of rulers being forced up from places of ease or security.
    reason: lexical_alternative
  - marker: b
    text: The term rendered 'reins' is uncertain in this Ge'ez-only context; possible senses include 'bridles,' 'straps,' or another image of restraint or control. The line likely depicts the stripping away of the strong one's power.
    reason: lexical_alternative
  - marker: c
    text: Or 'loosen the reins of the strong'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이것은 당신이 보았던 인자이십니다. 그분은 왕들과 강한 자들을 그들의 침상에서 일으키시고, 강한 자들을 그들의 왕좌에서 일으키실 것입니다. 또 강한 자들의 허리를 풀어 버리시고, 죄인들의 이를 부수실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘침상들’. 이 이미지는 통치자들이 안락함이나 안전의 자리에서 강제로 일어나게 됨을 보여 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 ‘허리’에 해당하는 어휘는 문자적으로 불확실하지만, 심판으로 힘과 권세가 해제되는 이미지를 가리키는 것으로 보입니다.
    reason: lexical_alternative
