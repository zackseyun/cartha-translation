base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/003.yaml
  text: And he answered me and said to me[a], “This is the Son of Man, to whom righteousness belongs, and righteousness dwells with him; and he will reveal all the treasuries of what is hidden, because the Lord of Spirits has chosen him[c][b], and his lot has prevailed before the Lord of Spirits forever in uprightness.”
  footnotes:
  - marker: a
    text: Or 'the storehouses/treasures of the hidden things.' The image is of concealed realities kept in heavenly reserve, not merely abstract 'secrets.'
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult in the Ge'ez. 'His lot has prevailed' may also be understood as 'his portion has triumphed' or, less likely, as referring to the lot of those associated with him.
    reason: alternative_reading
  - marker: c
    text: Or 'and his lot has prevailed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다. “이 사람이 바로 인자입니다. 의가 그에게 속해 있으며, 의가 그와 함께 머뭅니다. 그는 감추어진 것들의 모든 보물창고를 드러낼 것입니다. 이는 영들의 주께서 그를 선택하셨고, 그의 몫이 영들의 주 앞에서 영원히 올바름 가운데 승리했기 때문입니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 마지막 구절의 게즈어는 다소 난해합니다. ‘그의 몫’은 ‘그의 분깃’으로도 이해될 수 있으며, 덜 개연적이지만 그와 관련된 이들의 몫을 가리킨다고 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወልደ ሰብእ
  english_pob_choice: the Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 그 인자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게즈 관용구가 비전적 인물을 가리키는 칭호처럼 기능하므로, 한국어에서도 기독교 전통에 널리 알려진 ‘인자’를 쓰되 문맥의 칭호성을 살렸습니다.
- source_word: ዘሎቱ ኮነ ጽድቅ / ወጽድቅ ምስሌሁ ኃደረ
  english_pob_choice: to whom righteousness belongs / and righteousness dwells with him
  chosen_korean: 그에게는 의가 속해 있고, 의가 그와 함께 머뭅니다
  alternatives_korean:
  - 그에게 의가 있습니다
  - 그는 의로우며 의가 그와 함께 있습니다
  - 의가 그에게 거합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유와 동반 거주의 이중 표현을 둘 다 살려서, 단순한 형용사화로 평탄화하지 않았습니다.
- source_word: መዛግብተ ዘኅቡእ
  english_pob_choice: the treasuries of what is hidden
  chosen_korean: 숨겨진 모든 보물창고
  alternatives_korean:
  - 숨겨진 것들의 보고
  - 숨겨진 것들의 창고
  - 감추인 비밀들의 보물창고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: መዛግብት의 ‘저장고/보물창고’ 이미지를 살리되, 영어 POB의 주석 취지에 맞춰 단순한 추상적 ‘비밀’로 축소하지 않았습니다.
- source_word: እግዚአ መንፈሳት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영들의 주님
  - 만군의 하나님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1에녹의 고유한 신칭을 한국어 성경에서 익숙한 ‘만군의 주’로 옮겨, 주권성과 초월성을 자연스럽게 드러냈습니다.
- source_word: ዘክፍሉ ሞአ
  english_pob_choice: his lot has prevailed
  chosen_korean: 그의 몫이 ... 승리했습니다
  alternatives_korean:
  - 그의 몫이 ... 이겼습니다
  - 그의 분깃이 ... 우세해졌습니다
  - 그의 몫이 ... 이겨왔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게즈의 몫/분깃 이미지를 살리면서, 어려운 동사를 ‘승리하다’로 풀어 긴장과 결과를 드러냈습니다.
theological_decisions:
- issue: 1인칭 비전 서술 안에서 ‘인자’의 신분을 어떻게 드러낼지
  chosen_reading: 고유한 종말론적 인물 칭호로서 ‘인자’를 유지했습니다.
  alternative_readings:
  - 사람의 아들
  - 한 사람
  - 인간
  rationale: 문맥이 단순 인간 일반을 말하는 것이 아니라 계시 장면 속 특정 인물을 식별하고 있으므로, 칭호성을 보존하는 번역이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 본문의 로컬한 의미를 보존하고 후대 신약 용례로 과도하게 평준화하지 않습니다.
- issue: 마지막 절의 난해한 ‘몫/분깃’ 구문을 어떻게 처리할지
  chosen_reading: ‘그의 몫이 만군의 주 앞에서 영원히 올바름 가운데서 승리했습니다’로 옮기고, 의미의 난점을 각주로 남기지 않았습니다.
  alternative_readings:
  - 그의 분깃이 ... 보존되었습니다
  - 그와 함께한 이들의 몫이 ... 승리했습니다
  rationale: 게즈 본문은 구조상 어렵지만, 현재 어감상 가장 자연스러운 해석을 본문에 두어 읽히게 하고, 불필요하게 주석을 늘리지 않았습니다.
  doctrine_reference: 난해한 본문은 과도한 확정 대신 가독성 있는 근접 번역을 우선합니다.
