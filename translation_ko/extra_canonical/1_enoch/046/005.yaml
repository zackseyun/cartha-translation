base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/005.yaml
  text: And he will cast down the kings from their thrones and from their kingdoms[a], because they do not exalt him, and do not praise him[c][b], and do not acknowledge from where the kingdom was given to them.
  footnotes:
  - marker: a
    text: Or 'from whom the kingdom was given to them.' The Ge'ez phrase can point either to the source in a more general sense ('from where') or more personally ('from whom').
    reason: lexical_alternative
  - marker: b
    text: '''The kingdom'' may also be understood as ''kingship'' or ''royal authority,'' not only territorial realm.'
    reason: lexical_alternative
  - marker: c
    text: Or 'do not acknowledge'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 왕들을 그들의 보좌와 그들의 나라에서 끌어내리실 것입니다[a]. 이는 그들이 그를 높이지도, 그를 찬양하지도, 나라가 어디에서 그들에게 주어졌는지 인정하지도 않기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 나라가 주어진 분에게서’로도 옮길 수 있습니다. 게에즈 구문은 더 일반적으로 ‘어디에서’라는 출처를 가리킬 수도 있고, 더 인격적으로 ‘누구에게서’라는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ይገፈትኦሙ
  english_pob_choice: he will cast them down
  chosen_korean: 끌어내리실 것입니다
  alternatives_korean:
  - 내리치실 것입니다
  - 내리실 것입니다
  - 폐위하실 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 행정적 ‘폐위’보다 심판적·폭력적 하강 이미지를 살리기 위해 ‘끌어내리다’를 택했습니다.
- source_word: መናብርቲሆሙ
  english_pob_choice: their thrones
  chosen_korean: 그들의 보좌
  alternatives_korean:
  - 그들의 왕좌
  - 그들의 자리
  - 그들의 왕위
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 왕들의 통치 자리를 가리키는 상징적 표현으로 ‘보좌’가 가장 자연스럽고 격이 있습니다.
- source_word: መንገሥቲሆሙ
  english_pob_choice: their kingdoms
  chosen_korean: 그들의 나라
  alternatives_korean:
  - 그들의 왕국
  - 그들의 통치
  - 그들의 지배권
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단어는 영역으로서의 나라와 통치권 모두를 포함할 수 있어, 문맥상 보다 넓은 의미를 담는 ‘나라’가 적절합니다.
- source_word: ኢይገንዩ
  english_pob_choice: they do not acknowledge
  chosen_korean: 인정하지도
  alternatives_korean:
  - 고백하지도
  - 알아보지도
  - 겸손히 인정하지도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사는 단순 인지보다 ‘인정/시인’의 뜻이 강하므로, 해석을 덧붙이지 않는 범위에서 ‘인정하다’로 옮겼습니다.
theological_decisions:
- issue: 왕들이 인정해야 할 ‘그’의 지시 대상
  chosen_reading: 본문의 ‘그’는 문맥상 자신들의 권세를 주신 분, 곧 하나님을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 주어진 바로 그 왕권의 출처를 일반적으로 가리키는 표현
  - 문맥상 더 넓은 비인격적 ‘근원’으로 읽는 방식
  rationale: 마지막 절이 ‘나라가 그들에게 주어졌다’고 말하므로, 그 출처를 부여하신 인격적 주체를 염두에 둔 표현이 가장 잘 맞습니다. 다만 본문 자체에 호칭이 없으므로 이름을 덧붙이지는 않았습니다.
  doctrine_reference: 문맥이 암시하는 신적 수여자에 대한 해석은 유지하되, 본문에 없는 명칭은 삽입하지 않습니다.
