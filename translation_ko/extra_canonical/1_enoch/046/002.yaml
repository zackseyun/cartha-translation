base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/002.yaml
  text: And I asked one of the angels who was going with me[a], and who was showing me all the hidden things, concerning that Son of Man—who he was, and from where he came[c][b], and why he was going with the Head of Days.
  footnotes:
  - marker: a
    text: Or 'all the secrets.' The Ge'ez term refers to concealed heavenly matters disclosed in the vision.
    reason: lexical_alternative
  - marker: b
    text: '''Head of Days'' reflects the Ethiopic wording directly. A more traditional rendering would be ''Ancient of Days,'' influenced by Danielic phrasing.'
    reason: cross_reference
  - marker: c
    text: Or 'the one of the angels'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 나와 함께 가던 천사들 중 하나에게, 그리고 모든 숨겨진 것들을 내게 보여 주던 그 인자에 관하여—그가 누구인지, 어디에서 왔는지, 그리고 왜 그가 날들의 머리와 함께 가고 있었는지—물었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨겨진 것들’은 비밀스러운 하늘의 실재를 가리키는 맥락적 번역입니다.
    reason: source_note
  - marker: b
    text: ‘날들의 머리’는 에티오피아어 표현을 직접 옮긴 것입니다. 더 전통적인 번역은 ‘옛적부터 항상 계신 이’입니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘천사들 중 하나’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወተስእልክዎ
  english_pob_choice: And I asked one of the angels
  chosen_korean: 그리고 나는 …에게 물었습니다
