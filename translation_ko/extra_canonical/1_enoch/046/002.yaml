  - 한 천사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부분을 가리키는 표현이므로 ‘중 하나’로 옮겨, 특정 천사 한 존재를 지칭하는 문맥을 살렸습니다.
- source_word: ኵሎ ኅቡኣተ
  english_pob_choice: all the hidden things
  chosen_korean: 모든 숨겨진 것들
  alternatives_korean:
  - 모든 비밀들
  - 모든 감추어진 일들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 계시의 맥락을 유지하면서도, 너무 강하게 신학용어화하지 않는 ‘숨겨진 것들’을 사용했습니다.
- source_word: ወልደ ሰብእ
  english_pob_choice: Son of Man
  chosen_korean: 인자
  alternatives_korean:
  - 사람의 아들
  - 인자(人子)
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 본문 안에서 특수한 묵시적 호칭이므로, 한국어 성경에서 굳어진 ‘인자’를 택했습니다.
- source_word: ርእሰ መዋዕል
  english_pob_choice: Head of Days
  chosen_korean: 날들의 머리
  alternatives_korean:
  - 날들의 머리(the Head of Days)
  - 옛적부터 항상 계신 이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아어 표현을 직역해, 전승적으로 익숙한 다니엘서식 표현으로 자동 조화시키지 않았습니다.
theological_decisions:
- issue: ‘Son of Man’의 문맥상 지위
  chosen_reading: 묵시적 특정 인물을 가리키는 호칭으로 ‘인자’를 유지했습니다.
  alternative_readings:
  - 일반적인 인간
  - 사람의 아들
  rationale: 천사가 설명하는 대상이 이미 독립적인 환상 속 인물이므로, 일반 명사화하지 않고 호칭성을 보존했습니다.
  doctrine_reference: 본문 고유 의미 보존; 후대 기독론적 동일시를 본문 밖에서 선취하지 않음
- issue: ‘Head of Days’의 번역
  chosen_reading: 전승어인 ‘옛적부터 항상 계신 이’로 풀지 않고 ‘날들의 머리’로 옮겼습니다.
  alternative_readings:
  - 옛적부터 항상 계신 이
  - 날들의 머리
  rationale: 원문 직역을 우선하여 에티오피아어의 특이한 표현을 드러내고, 다니엘서의 익숙한 호칭과의 차이를 지웠지 않도록 했습니다.
  doctrine_reference: 원문 우선 원칙; 상호본문적 긴장을 보존
