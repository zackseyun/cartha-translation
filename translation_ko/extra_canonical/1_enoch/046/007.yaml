  text: And these are those who judge the stars of heaven[a][b].
  footnotes:
  - marker: a
    text: The verb may also be understood as 'rule' or 'govern.' Because this section is preserved effectively only in Ge'ez, the exact nuance should be held with some caution.
    reason: lexical_alternative
  - marker: b
    text: In apocalyptic literature, 'stars' can function as cosmic bodies or as symbols for heavenly beings; the text does not force the translator to decide here.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이들은 하늘의 별들을 심판하는 자들입니다.[a] [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 동사는 ‘심판하다’ 외에 ‘다스리다’, ‘통치하다’로도 이해될 수 있습니다. 이 단락은 에티오피아어 전승만 보존되어 있어 정확한 뉘앙스는 조심해서 읽어야 합니다.
    reason: lexical_alternative
  - marker: b
    text: 묵시문학에서 ‘별들’은 천체일 수도 있고 하늘 존재의 상징일 수도 있으므로, 여기서는 어느 쪽으로도 단정하지 않았습니다.
    reason: cultural_note
