base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/001.yaml
  text: And there I saw one who had a head of days[a], and his head was like white wool; and with him was another, whose face was like the appearance of a man, and his face was full of grace[c][b], like one of the holy angels.
  footnotes:
  - marker: a
    text: Or 'the Ancient of Days.' The Ge'ez reads more literally 'head of days,' and the translation preserves that idiom in the main text.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'full of grace' is a direct rendering of the Ge'ez and should not be read as borrowing later New Testament wording.
    reason: cross_reference
  - marker: c
    text: Or 'whose face had the appearance of a man'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기에서 나는 날들의 머리를 가진 이[a]를 보았습니다. 그의 머리는 흰 양털 같았고, 그와 함께 다른 이가 있었는데, 그의 얼굴은 사람의 모습[b]과 같았으며, 은혜로 충만하여[c] 거룩한 천사들 가운데 하나와 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛적부터 계신 이’. 게이즈 본문은 더 문자적으로 ‘날들의 머리’를 뜻하는 표현을 사용하므로, 본문은 이를 그대로 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람의 외양과 같았고’. 원문은 비교 표지 ‘처럼/같이’를 분명히 사용합니다.
    reason: alternative_reading
  - marker: c
    text: ‘은혜로 충만하여’는 게이즈 본문의 직접 번역입니다. 여기서의 표현을 후대 신약 문구의 차용으로 읽어서는 안 됩니다.
    reason: cross_reference
