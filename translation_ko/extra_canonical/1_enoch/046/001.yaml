theological_decisions:
- issue: ‘날들의 머리’라는 표현을 전통적 단칭호로 바꾸지 않을지
  chosen_reading: 본문의 이색적인 관용구를 그대로 살린 ‘날들의 머리를 가진 이’로 옮겼습니다.
  alternative_readings:
  - ‘옛날부터 계신 이’
  - ‘옛적부터 항상 계신 이’
  - ‘옛날의 머리’
  rationale: 이 구절은 다니엘의 익숙한 명칭으로 정리하기보다, 현존하는 게이즈 본문의 독특한 표현을 독자에게 그대로 전달하는 편이 원문의 긴장을 보존합니다.
  doctrine_reference: 번역 철학 §§1, 3
