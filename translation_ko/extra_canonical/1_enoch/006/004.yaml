base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/004.yaml
  text: And they all answered him and said[a], "Let us all swear an oath, and let us all bind one another with a curse, so that we do not turn back from this plan[b], but carry out this deed."
  footnotes:
  - marker: a
    text: The Ge'ez uses both 'swear an oath' and 'bind with a curse,' a doubled formula emphasizing a solemn mutual pact.
    reason: lexical_alternative
  - marker: b
    text: The final phrase is textually repetitive in the witness ('this plan ... this deed/action'); the translation preserves the sense of moving from counsel to execution.
    reason: textual_variant
translation:
  language: ko
  text: 그들이 모두 그에게 대답하여 말했습니다. 「우리 모두 맹세를 하여 맹세하고, 서로를 저주로 묶어[a] 이 계획[b]에서 물러서지 말고, 이 일을 실행합시다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 ‘맹세를 하다’와 ‘저주로 서로를 묶다’를 함께 사용하여, 엄숙한 상호 서약을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 게에즈 본문은 마지막에 ‘이 계획’과 ‘이 일/행위’를 반복하여, 의논에서 실행으로 나아가는 뜻을 드러냅니다.
    reason: textual_variant
