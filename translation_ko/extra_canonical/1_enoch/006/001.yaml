base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/001.yaml
  text: And it came to pass[a], when the children of men had multiplied in those days, daughters were born to them, beautiful and comely.
  footnotes:
  - marker: a
    text: Or 'the sons of men.' The Ge'ez expression is a conventional human designation and prepares for the contrast with the Watchers in the following verses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 일이 일어났습니다[a]. 그 날들에 사람의 자녀들이 많아지자, 그들에게 딸들이 태어났는데, 그들은 아름답고 고왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 아들들’입니다. 게에즈 표현은 관용적인 인간 지칭이며, 이어지는 절의 감시자들과의 대비를 준비합니다.
    reason: lexical_alternative
