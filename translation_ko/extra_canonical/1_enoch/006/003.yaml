  - 동의하지 않을까
  - 원하지 않을까
  lexicon: Dillmann
  rationale: 단순한 능력 부족이 아니라 의사·동의의 문제이므로, 두려움이 섞인 추정을 살려 '하려 하지 않을까'로 옮겼습니다.
- source_word: ፈዳዪ ለኃጢአት ዐባይ
  english_pob_choice: become liable for a great sin
  chosen_korean: 큰 죄의 책임을 지게 될 것입니다
  alternatives_korean:
  - 큰 죄에 대하여 책임을 져야 할 것입니다
  - 큰 죄의 벌을 받게 될 것입니다
  - 큰 죄에 대해 유죄가 될 것입니다
  lexicon: Dillmann
  rationale: 법적·도덕적 책임의 뉘앙스를 살리기 위해 '책임을 지다'를 사용했고, POB의 'liable' 의미를 자연스럽게 재현했습니다.
theological_decisions:
- issue: 세미아자의 역할을 어떻게 드러낼지
  chosen_reading: 그들의 우두머리
  alternative_readings:
