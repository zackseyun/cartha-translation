  - 그들의 수장
  rationale: 본문의 서사적 기능은 집단의 수장을 밝히는 것이므로, 독자가 역할을 즉시 이해하도록 기능적 번역을 택했습니다.
  doctrine_reference: 문맥상 기능이 분명한 호칭은 역할 의미를 우선해 번역한다.
