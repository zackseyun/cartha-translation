translation:
  language: ko
  text: 그때 그들은 모두 함께 맹세하고, 그 일에 관하여 서로를 저주로 묶었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 동사 መሐሉ는 여기서 ‘말하다’가 아니라 ‘맹세하다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘묶었습니다’는 문자적으로는 결박이지만, 문맥상 상호적인 서약으로 자신들을 구속하는 의미를 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 일’은 앞선 문맥에서 논의된 계획을 가리킵니다.
    reason: cross_reference
