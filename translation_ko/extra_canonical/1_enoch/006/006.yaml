  text: And all of them were two hundred[a], and they came down onto Ardis[b], which is the summit of Mount Hermon.
  footnotes:
  - marker: a
    text: The place-name 'Ardis' is uncertain in English transliteration. The Ge'ez presents it as the location identified with the summit of Mount Hermon.
    reason: lexical_alternative
  - marker: b
    text: Some translators render the verb more formally as 'descended.'
    reason: lexical_alternative
