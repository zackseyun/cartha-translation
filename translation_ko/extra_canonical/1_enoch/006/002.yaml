base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/002.yaml
  text: And the angels[a], the sons of heaven, saw them and desired them. And they said among themselves, “Come, let us choose for ourselves wives from the children of men[d][c][b], and let us beget children for ourselves.”
  footnotes:
  - marker: a
    text: The pronoun 'them' refers back to the women mentioned in the previous verse; the Ge'ez here does not restate 'women' explicitly.
    reason: cross_reference
  - marker: b
    text: '''Children of men'' is a literal, elevated expression contrasting human offspring with the heavenly beings in this scene; it may also be rendered ''children of humankind.'''
    reason: lexical_alternative
  - marker: c
    text: The final clause literally has the sense of begetting offspring; 'father children' is used for natural modern English.
    reason: lexical_alternative
  - marker: d
    text: Or 'And they saw them, the angels, the sons of heaven, and they desired them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 천사들, 곧 하늘의 아들들이 그녀들을 보고 그녀들을 탐했습니다. 그리고 그들끼리 말했습니다. 「자, 사람의 자녀들 가운데서 우리 아내로 삼을 이들을 택하고, 우리가 자녀를 얻자.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 앞 절에 언급된 여성들을 여기서 다시 명시하지 않습니다. ‘그녀들’은 그 여성들을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘하늘의 아들들’은 천사들과 동격으로 놓인 표현이며, 이 문맥에서는 천상 존재를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: መላእክት ውሉደ ሰማያት
  english_pob_choice: the angels, the sons of heaven
  chosen_korean: 천사의 아들들인 하늘의 아들들
  alternatives_korean:
  - 천사들, 하늘의 아들들
  - 하늘의 아들들인 천사들
  - 천사들인 하늘의 아들들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 두 호칭을 함께 살리되, 한국어에서는 apposition을 자연스럽게 풀어 ‘천사의 아들들인 하늘의 아들들’로 옮겨 두 신분 표지를 모두 보존했습니다.
- source_word: ወርእዩ ኪያሆን
  english_pob_choice: and they saw them
  chosen_korean: 그녀들을 보고
  alternatives_korean:
  - 그녀들을 보았고
  - 그것들을 보고
  - 그들을 보고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대상은 앞 절의 여성들을 가리키므로, 한국어에서는 생략된 대상을 분명히 드러내되 문맥상 자연스러운 ‘그녀들’을 사용했습니다.
- source_word: ወፈተውዎን
  english_pob_choice: and they desired them
  chosen_korean: 그녀들을 마음에 두었습니다
  alternatives_korean:
  - 그녀들을 욕망했습니다
  - 그녀들을 원했습니다
  - 그녀들을 탐했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사는 강한 욕구를 뜻하지만, 본문이 직접적으로 성적 용어를 쓰지는 않으므로, 도덕적 긴장을 유지하면서도 노골적 확대를 피하는 표현을 택했습니다.
- source_word: ንሕረይ ለነ አንስተ
  english_pob_choice: let us choose for ourselves wives
  chosen_korean: 우리를 위해 아내들을 택하고
  alternatives_korean:
  - 우리를 위해 아내들을 선택하고
  - 우리를 위해 여자들을 택하고
  - 우리 몫의 아내들을 택하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘choose/select’의 의미를 살리면서, 이어지는 결합 의도를 반영해 ‘아내들’을 택했습니다. ‘여자들’보다 결혼적 함의를 더 정확히 드러냅니다.
- source_word: ወንለድ ለነ ውሉደ
  english_pob_choice: and let us beget children for ourselves
  chosen_korean: 우리를 위해 자녀를 낳자
  alternatives_korean:
  - 우리를 위해 자녀를 잉태하자
  - 우리를 위해 자녀를 생기게 하자
  - 우리를 위해 자녀를 낳게 하자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 화자들이 남성적 주체이므로, 한국어에서는 자연스러운 동사 ‘낳자’로 출생/생산의 목적을 옮겼습니다. 너무 문자적인 ‘beget’는 합쇼체 본문에서 부자연스러워 피했습니다.
theological_decisions:
- issue: 본문의 대상 지시를 어떻게 드러낼지
  chosen_reading: 앞 절의 여성들을 가리키는 대상 대명사를 한국어 본문에 반영했습니다.
  alternative_readings:
  - 대상을 그냥 ‘그들을’로 둠
  - ‘그 여자들을’로 명시함
  rationale: 게에즈에는 여성 대상을 다시 말하지 않지만, 한국어에서는 지시 대상을 분명히 해야 하므로 문맥에 따라 ‘그녀들’로 풀었습니다. 이는 의미를 과도하게 확장하기보다 이미 암시된 대상을 명료화하는 처리입니다.
  doctrine_reference: source-language primacy over translation tradition
