base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/001.yaml
  text: And from there I went to the ends of the earth[a], and there I saw great beasts, and they differed from one another; and the birds also differed in their appearance and their forms[c][b], and their voices also differed one from another.
  footnotes:
  - marker: a
    text: Literally, 'their faces.' The broader rendering 'appearance' is used here because the verse describes how the birds differed visibly as well as in bodily form and voice.
    reason: lexical_alternative
  - marker: b
    text: The term rendered 'the form of their bodies' is somewhat uncertain in this OCR witness; it likely refers to bodily shape or build.
    reason: textual_variant
  - marker: c
    text: Or 'and the birds also differed in their appearance and in the form of their bodies and in their voices, each from the other.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그곳에서 나는 땅 끝까지 갔습니다. 거기서 나는 큰 짐승들을 보았는데, 그것들은 서로 달랐습니다. 새들도 그 모습[a]과 형태[b]가 서로 달랐으며[c], 그 소리도 서로 달랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 얼굴’입니다. 여기서는 새들의 시각적 차이를 가리키는 문맥에 맞추어 ‘그 모습’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ስኖሙ는 이 OCR 전승에서 의미가 다소 불확실합니다. 문맥상 몸의 형상이나 외형을 가리키는 것으로 보입니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘새들도 그 모습과 형태와 소리에서 서로 달랐습니다’.
    reason: previous_rendering
