    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 모든 것을 보여 주었고[a], 내게 그것을 적었습니다. 그리고 다시 내게 그들의 이름과 그들의 명령[b]과 그들의 무리를 적었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 규정들’이나 ‘그들의 정해진 질서들’로도 옮길 수 있습니다. 게에즈어 표현은 권위 있는 지시나 규정된 질서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 법’이나 ‘그들의 규정’으로도 옮길 수 있습니다. 이 표현은 하늘의 장면 안에서 정돈된 분류나 질서를 가리킬 가능성이 있습니다.
    reason: lexical_alternative
