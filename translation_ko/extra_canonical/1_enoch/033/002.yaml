base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
  footnotes:
  - marker: a
    text: Or 'the extremities of the earth.' The Ge'ez expression denotes the far limits or borders of the world.
    reason: lexical_alternative
  - marker: b
    text: The image assumes an ancient cosmology in which heaven has a resting place or support at the world's edge.
    reason: cultural_note
  - marker: c
    text: '''Gateways of heaven'' may also be rendered ''windows'' or ''openings'' of heaven, depending on how one construes the heavenly architecture.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And beyond these'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 짐승들의 동쪽에서 나는 하늘이 쉬는[b] 땅의 끝[a]과 하늘의 열린 문들[c]을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 끝자락들’로 옮길 수 있습니다. Ge’ez 표현은 세상의 먼 경계나 가장자리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 하늘이 세계의 경계에 머문다는 고대 우주론적 세계상을 전제합니다.
    reason: cultural_note
  - marker: c
    text: ‘하늘의 문들’은 ‘하늘의 관문들’, ‘하늘의 창문들’ 또는 ‘하늘의 개구부들’로도 옮길 수 있습니다. 이는 하늘의 구조를 어떻게 이해하느냐에 따라 달라집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽባሖሙ ለ*እሉ አርዌ
  english_pob_choice: to the east of these beasts
  chosen_korean: 이 짐승들 동쪽에서
  alternatives_korean:
  - 이 짐승들보다 동쪽에서
  - 이 짐승들의 동편에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge’ez가 명시하는 방향어를 살려 단순한 ‘넘어서’가 아니라 동쪽이라는 지리적·환상적 이동을 분명히 드러냈습니다.
- source_word: አጽናፈ ምድር
  english_pob_choice: the ends of the earth
  chosen_korean: 땅의 끝
  alternatives_korean:
  - 세상의 끝
  - 땅의 극한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정형적인 우주 경계 표현을 자연스러운 한국어로 옮기되, apocalyptic한 ‘끝’의 이미지를 보존했습니다.
- source_word: ሰማይ የዐርፍ
  english_pob_choice: where the heaven rests
  chosen_korean: 하늘이 쉬는
  alternatives_korean:
  - 하늘이 머무는
  - 하늘이 내려앉는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘이 땅의 경계에 ‘쉰다/안식한다’는 구체적 우주론적 이미지를 살려, 비유적으로 완화하지 않았습니다.
- source_word: ኀዋኅወ ሰማይ ርኁዋተ
  english_pob_choice: the open gates of heaven
  chosen_korean: 하늘의 열린 문들
  alternatives_korean:
  - 하늘의 열린 게이트들
  - 하늘의 열린 관문들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘gateways’에 해당하는 개방구를 한국어 ‘문들’로 옮겨, 단순한 기상학적 ‘창문’으로 좁히지 않고 개방된 प्रवेश/출입의 이미지를 유지했습니다.
theological_decisions:
- issue: 고대 우주론 이미지의 보존
  chosen_reading: 하늘이 땅의 끝에서 쉰다는 구체적 우주론 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 하늘과 땅이 만나는 지점
  - 지평선 부근
  rationale: 본문은 추상적 은유보다 환상적 지리 묘사를 제시하므로, 현대화하여 평평하게 만들지 않고 원문의 세계상을 살렸습니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic imagery; do not flatten cosmic imagery into generic modern prose.'
