base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
  footnotes:
  - marker: a
    text: Or 'the extremities of the earth.' The Ge'ez expression denotes the far limits or borders of the world.
    reason: lexical_alternative
  - marker: b
    text: The image assumes an ancient cosmology in which heaven has a resting place or support at the world's edge.
    reason: cultural_note
  - marker: c
    text: '''Gateways of heaven'' may also be rendered ''windows'' or ''openings'' of heaven, depending on how one construes the heavenly architecture.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And beyond these'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 짐승들 동쪽에서 나는 하늘이 쉬는 땅의 끝[a]과 하늘의 열린 문들[c][b][d]을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 끝자락들’로 옮길 수 있습니다. Ge’ez 표현은 세상의 먼 경계나 가장자리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 하늘이 세계의 경계에 받침이나 정착처를 둔다는 고대 우주론을 전제합니다.
    reason: cultural_note
  - marker: c
    text: ‘하늘의 문들’은 문들로도, 창문들 또는 개방구들로도 옮길 수 있습니다. 하늘의 구조를 어떻게 이해하느냐에 따라 달라집니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그리고 이들 너머에서’로도 옮길 수 있습니다.
    reason: previous_rendering
