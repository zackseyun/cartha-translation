  alternative_readings:
  - ‘수평선’이나 ‘이른 아침 하늘’처럼 비유적으로 완화함
  - ‘별이 떠오르는 곳’으로 일반화함
  rationale: 에녹서의 묵시적 우주론은 구체적 천상 구조를 전제하므로, 현대 천문학적 표현으로 환원하지 않고 원문 이미지의 힘을 보존하는 것이 적절합니다.
