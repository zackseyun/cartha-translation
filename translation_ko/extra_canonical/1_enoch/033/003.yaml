base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/003.yaml
  text: And I saw the portals from which the stars of heaven come out[a], and I wrote down all their outlets, each one by itself, according to their number and their names, by their order and their activity and their times and their months, as Uriel, the holy angel who was with me[c][b], showed me.
  footnotes:
  - marker: a
    text: Or 'openings' or 'portals' for 'mouths'; the Ge'ez keeps a vivid bodily image for the heavenly outlets.
    reason: lexical_alternative
  - marker: b
    text: The wording after 'and' is textually difficult in this OCR witness; the sense is that Enoch saw the places/openings from which the stars emerge and recorded them in ordered detail.
    reason: textual_variant
  - marker: c
    text: Or 'the mouths from which the stars of heaven come out, and the places from which they proceed'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 하늘의 별들이 나오는 문들을 보았고, 그 별들의 모든 나가는 곳을 하나하나, 그 수와 그 이름에 따라, 그 순서와 그 활동과 그 시기와 그 달들에 따라 기록하였는데, 내 곁에 있던 거룩한 천사 우리엘이 나에게 보여 준 그대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 첫 표현은 하늘의 별들이 나오는 천상 구조를 가리키며, ‘문들’은 이 이미지를 살린 번역입니다.
    reason: source_note
  - marker: b
    text: 문장 순서는 원문을 따라 조정한 것으로, ‘보았고… 기록하였는데’의 흐름을 유지합니다.
    reason: korean_style_note
