base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/002.yaml
  text: And in the days of the sinners the years shall be shortened, and their seed shall be late upon their land and in their fields; and all the works that are on the earth shall change and shall not appear in their times, and the rain shall be withheld, and heaven shall hold back.
  footnotes:
  - marker: a
    text: Or 'their offspring shall be delayed'; the Ge'ez term for 'seed' may refer either to descendants or to agricultural seed/produce in this context.
    reason: lexical_alternative
  - marker: b
    text: 'The line depicts cosmic and agricultural disorder: what should appear in its proper season fails to do so.'
    reason: cultural_note
  - marker: c
    text: Or 'every work that is on the earth shall change and shall not appear in its time'.
    reason: previous_rendering
translation:
  language: ko
  text: 죄인들의 날들에는 해들이 짧아지고, 그들의 씨는 그들의 땅과 그들의 밭에서 늦게 될 것이며, 땅 위에 있는 모든 일은 변하고 제때 나타나지 않을 것이며, 비는 거두어지고 하늘은 머물 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘씨’는 이 문맥에서 자손을 뜻할 수도 있고, 뿌려진 씨나 산출물을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 본래의 때에 마땅히 나타나야 할 것들이 나타나지 않는, 우주적·농경적 질서의 붕괴를 묘사합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘땅 위의 모든 일은 변하고 제때 나타나지 않을 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ኃጥኣን
  english_pob_choice: sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 악인들
  - 죄악을 행하는 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 도덕적 유죄를 지닌 사람들을 가리키므로, 심판적 뉘앙스를 살려 ‘죄인들’로 옮겼습니다.
- source_word: ክረማት
  english_pob_choice: years
  chosen_korean: 해들
  alternatives_korean:
  - 세월
  - 연수
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 우주적 시간 붕괴 이미지를 살리기 위해 추상적 ‘세월’보다 구체적인 ‘해들’을 택했습니다.
- source_word: የኀጽሩ
  english_pob_choice: shall be shortened
  chosen_korean: 짧아지고
  alternatives_korean:
  - 줄어들고
  - 축소되고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간이 잘려 나가듯 짧아지는 이미지를 자연스럽게 전달하는 동사형으로 옮겼습니다.
- source_word: ዘርአ ዚአሆሙ
  english_pob_choice: their seed
  chosen_korean: 그들의 씨
  alternatives_korean:
  - 그들의 자손
  - 그들의 씨앗
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 자손과 파종된 씨/산출물을 모두 열 수 있으므로, 원문의 모호성을 보존하는 ‘씨’를 유지했습니다.
- source_word: ዳኃራዊ
  english_pob_choice: late
  chosen_korean: 늦게 될
  alternatives_korean:
  - 지연될
  - 뒤늦게 될
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 농경·계절 붕괴의 맥락에서 ‘늦게’는 시간성의 어긋남을 간결하게 드러냅니다.
- source_word: ኵሉ ግብር ዘዲበ ምድር
  english_pob_choice: all the works that are on the earth
  chosen_korean: 땅 위에 있는 모든 일
  alternatives_korean:
  - 땅 위의 모든 행위
  - 땅 위에 있는 모든 일들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘일’은 인간의 행위만이 아니라 땅 위의 작동과 산물을 넓게 포괄해, 자연 질서의 붕괴라는 문맥에 잘 맞습니다.
- source_word: ይትመየጥ
  english_pob_choice: shall change
  chosen_korean: 변하고
  alternatives_korean:
  - 바뀌고
  - 뒤틀리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 광범위한 변화를 가리키는 기본 의미를 살리면서 지나친 해석을 피했습니다.
- source_word: ዝናም ይትከላእ
  english_pob_choice: the rain shall be withheld
  chosen_korean: 비는 거두어지고
  alternatives_korean:
  - 비는 막히고
  - 비는 멈추고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘에서 내려오던 비가 거둬져 멈춘다는 능동적 이미지가 한국어로 가장 자연스럽습니다.
- source_word: ሰማይ ታቀውም
  english_pob_choice: heaven shall hold back
  chosen_korean: 하늘은 머물 것입니다
  alternatives_korean:
  - 하늘은 멈출 것입니다
  - 하늘은 머물러 있을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘을 의인화한 정지·억류의 이미지를 살리되, ‘머물다’로 한국어의 시적 어감을 유지했습니다.
theological_decisions:
- issue: ‘their seed’의 농경적 의미와 자손 의미를 어떻게 처리할지
  chosen_reading: ‘그들의 씨’로 옮겨 두 의미를 모두 열어 두었습니다.
  alternative_readings:
  - 그들의 자손
  - 그들의 씨앗
  rationale: 문맥상 땅·밭·비와 연결되어 농경적 뜻이 강하지만, 원어는 자손도 환기할 수 있으므로 의미를 확정하지 않고 모호성을 보존했습니다.
  doctrine_reference: 원문이 허용하는 긴장을 해소하지 않고 유지
- issue: ‘하늘은 머물 것입니다’의 의인화
  chosen_reading: 자연 현상을 단순 기상 묘사가 아니라 우주적 질서의 억제/정지로 읽히는 표현을 유지했습니다.
  alternative_readings:
  - 하늘은 거두어질 것입니다
  - 하늘은 막힐 것입니다
  rationale: 본문은 비의 중단과 더불어 하늘 자체의 ‘멈춤’을 병렬로 제시하므로, 우주 전체가 비정상 상태에 놓인다는 점을 드러내는 번역이 적절합니다.
  doctrine_reference: 에녹서의 묵시적 우주 질서 붕괴 표현 보존
