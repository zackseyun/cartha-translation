base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/004.yaml
  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
  footnotes:
  - marker: a
    text: Ge'ez ወርኅ can mean either 'moon' or 'month'; here the luminary context favors 'moon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it will not be seen in its time.' The phrase may emphasize visibility at the proper season rather than a technical calendrical appointment.
    reason: lexical_alternative
  - marker: c
    text: Or 'at its appointed time'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 달은[a] 그 질서가 달라지고[c], 제때에[b] 나타나지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 ወርኅ는 ‘달’ 또는 ‘월’을 뜻할 수 있습니다. 여기서는 천체의 운행과 출현을 말하는 문맥이므로 ‘달’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그 자신의 때/시기에’입니다. ‘제때에’는 정해진 시기에 보인다는 맥락을 자연스럽게 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘질서’는 배열, 규칙, 또는 정해진 운행 방식을 뜻할 수 있습니다. 여기서는 달의 통상적인 천체 운행을 가리킵니다.
    reason: source_note
