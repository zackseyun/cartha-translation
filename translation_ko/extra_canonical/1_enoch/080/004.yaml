- issue: 달의 변화와 비출현을 단순한 천문 현상으로만 볼지, 정해진 우주 질서의 일탈로 볼지
  chosen_reading: 문장 자체는 달이 자기 질서를 바꾸고 제때에 나타나지 않는다는 두 표현을 함께 유지하여, 정해진 우주 질서의 흔들림을 암시하되 과도한 신학적 설명은 덧붙이지 않았습니다.
  alternative_readings:
