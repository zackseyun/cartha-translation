base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/004.yaml
  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
  footnotes:
  - marker: a
    text: Ge'ez ወርኅ can mean either 'moon' or 'month'; here the luminary context favors 'moon.'
    reason: lexical_alternative
  - marker: b
    text: Or 'it will not be seen in its time.' The phrase may emphasize visibility at the proper season rather than a technical calendrical appointment.
    reason: lexical_alternative
  - marker: c
    text: Or 'at its appointed time'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 달은 자기 질서를 바꾸며, 제때에 나타나지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달’은 여기서 천체로서의 달을 뜻합니다. 게에즈 ወርኅ는 ‘달’과 ‘월’ 모두를 뜻할 수 있지만, 문맥상 천체 의미가 분명합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘제때에’는 “그 시기에 / 그 시즌에”라는 뜻을 풀어 옮긴 것입니다. 시각적 출현의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기 질서’는 달의 정해진 운행 패턴을 가리킵니다. 전통적 교회 용어보다 원문의 배열·질서 의미를 직접 살렸습니다.
    reason: source_note
