base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
  footnotes:
  - marker: a
    text: Or 'guide' the stars of heaven. The wording presents the stars as directed by personal agents, not merely by impersonal laws.
    reason: lexical_alternative
  - marker: b
    text: The final term may refer more specifically to the heavenly bodies' goings out, transitions, or courses; 'departures' is a transparent rendering of the motion imagery.
    reason: lexical_alternative
  - marker: c
    text: Or 'and their departures'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날들에 우리엘 천사가 내게 대답하여 말했습니다. “보십시오, 에녹아. 내가 네게 모든 것을 보였고, 모든 것을 네게 드러내어 네가 이 해와 이 달과 하늘의 별들을 이끄는 이들과, 또 그것들을 돌리게 하는 모든 이들, 곧 그들의 일과 그들의 때와 그들의 지는 때를 보도록 하였습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 천체의 움직임을 단순한 물리 법칙이 아니라 인격적 행위자들이 이끄는 것으로 묘사합니다.
    reason: theological_note
  - marker: b
    text: ‘그들의 지는 때’로 옮긴 말은 직역하면 ‘그들의 들어감’에 가깝습니다. 이 천문학적 문맥에서는 천체가 들어가는 것, 곧 지는 것 또는 그 시점을 가리킬 수 있습니다.
    reason: lexical_alternative
