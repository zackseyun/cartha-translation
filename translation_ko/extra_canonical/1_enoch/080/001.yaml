base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
  footnotes:
  - marker: a
    text: Or 'guide' the stars of heaven. The wording presents the stars as directed by personal agents, not merely by impersonal laws.
    reason: lexical_alternative
  - marker: b
    text: The final term may refer more specifically to the heavenly bodies' goings out, transitions, or courses; 'departures' is a transparent rendering of the motion imagery.
    reason: lexical_alternative
  - marker: c
    text: Or 'and their departures'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그때에 우리엘 천사가 내게 응답하여 말했습니다. "보십시오, 내가 너에게 모든 것을 보였고, 에녹아, 내가 너에게 모든 것을 드러내었습니다. 이는 네가 이 해와 이 달과 하늘의 별들을 이끄는 이들과, 또 그것들을 돌리게 하는 모든 이들—그들의 일들과 그들의 때와 그들의 떠오름을 보게 하려는 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 천체의 움직임을 단순한 물리 법칙보다 개인적 행위자들의 지시 아래 있는 것으로 묘사합니다.
    reason: theological_note
  - marker: b
    text: 천문학적 맥락에서 ሙባኢሆሙ는 ‘떠남’보다 ‘떠오름/들어감’ 같은 운동 항목을 가리킬 수 있습니다. 여기서는 최신 교정에 따라 ‘떠오름’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: 아ውሥአኒ / Ἀν答?
  english_pob_choice: answered me
  chosen_korean: 내게 응답하여 말했습니다
  alternatives_korean:
  - 내게 말했습니다
  - 내게 대답했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 응답/대답의 대화적 뉘앙스를 살리되, 천사의 계시적 발화를 자연스러운 현대 한국어로 정리했습니다.
- source_word: ነዋ
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 자, 보십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주의 환기용 감탄사로서 고어적 ‘보라’보다 합쇼체 명령형 ‘보십시오’가 본문의 공적·서술적 분위기에 맞습니다.
- source_word: አርአይኩከ / ከሠትኩ ለከ
  english_pob_choice: I have shown you / I have revealed ... to you
  chosen_korean: 내가 너에게 모든 것을 보였고 ... 내가 너에게 모든 것을 드러내었습니다
  alternatives_korean:
  - 내가 너에게 모든 것을 보여 주었고 ... 밝혀 주었습니다
  - 내가 너에게 모든 것을 알게 했고 ... 나타내었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘보였다’와 ‘드러내다’로 시각적·계시적 이중 의미를 구분해, 원문의 ‘보게 하다/드러내다’ 구조를 유지했습니다.
- source_word: ሙባኢሆሙ
  english_pob_choice: their departures
  chosen_korean: 그들의 떠오름
  alternatives_korean:
  - 그들의 들어감
  - 그들의 출입
  - 그들의 설정
  lexicon: Geʽez astronomical usage / Dillmann
  rationale: 문맥상 천체의 운동 항목이며, 최신 교정 흐름을 따라 ‘떠오름’으로 옮겨 상승·출현의 천문학적 이미지를 살렸습니다.
- source_word: ይመይጥዎሙ
  english_pob_choice: turn them
  chosen_korean: 돌리게 하는
  alternatives_korean:
  - 움직이게 하는
  - 회전시키는
  - 돌게 하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체를 회전시키는 주체적 행위를 드러내기 위해 ‘돌리게 하는’으로 옮겼습니다.
theological_decisions:
- issue: 천체를 이끄는 존재들의 성격
  chosen_reading: ‘하늘의 별들을 이끄는 이들’과 ‘그것들을 돌리게 하는 모든 이들’처럼 개인적 행위자로 유지했습니다.
  alternative_readings:
  - 별의 법칙
  - 별의 운동을 다스리는 비인격적 원리
  rationale: 게에즈 원문의 관계절 구조와 POB의 해석을 따라, 단순한 물리 법칙이 아니라 지정된 행위자들의 우주 질서를 보존했습니다.
