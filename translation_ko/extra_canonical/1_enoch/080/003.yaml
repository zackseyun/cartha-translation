  text: 그때에는 땅의 열매가 늦어지고, 제때에 싹트지 않으며, 나무의 열매도 제때에 거두어지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘열매’는 여기서 땅의 소산 전반을 가리킬 수 있습니다.
    reason: lexical_alternative
