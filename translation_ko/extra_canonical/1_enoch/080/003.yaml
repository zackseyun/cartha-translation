base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/003.yaml
  text: And in those times the fruit of the earth will be delayed[a], and it will not sprout in its season[d][c][b]; and the fruit of the trees will be withheld in its season.
  footnotes:
  - marker: a
    text: Or 'the produce of the land will come late.' The Ge'ez wording emphasizes delay relative to the proper season.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be understood as 'the fruit of the trees will be hindered at its proper time,' stressing that the expected harvest is held back when it should appear.
    reason: lexical_alternative
  - marker: c
    text: Or 'in their season'.
    reason: previous_rendering
  - marker: d
    text: Or 'will be delayed'.
    reason: previous_rendering
