  naturalness: ‘나무의 열매도 제 철에 나지 못할 것입니다’는 현대 표준 한국어의 자연스러운 합쇼체이며, 농업적 결실이 기대된 시기에 나타나지 않는다는 문맥을 명료하게 전달합니다. ‘땅의 열매가 늦어지고’와 ‘싹트지 않으며’의 병렬도 유지됩니다.
  terminology: ‘땅의 열매’, ‘싹트다’, ‘제때/제 철’은 원문의 농업적·시간적 이미지를 보존합니다. 현 초안의 각주가 말하는 ‘땅의 소산 전반’은 가능한 어휘 범위이지만, 본문의 ‘열매’를 해설할 필요가 있을 정도의 모호성은 아니며 원문의 구체적 이미지를 불필요하게 넓힐 수 있어 삭제합니다.
