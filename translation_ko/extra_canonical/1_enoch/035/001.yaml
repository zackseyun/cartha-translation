base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/035/001.yaml
  text: And from there I went toward the west[a], to the ends of the earth, and there I saw three open portals of heaven, like what I had seen in the east[d][c][b], corresponding to their portals and corresponding to their outlets.
  footnotes:
  - marker: a
    text: Or 'gates of heaven' or 'windows of heaven'; the Ge'ez term denotes heavenly openings and may refer to the apertures through which celestial bodies emerge.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'corresponding to their openings and corresponding to their outlets' likely indicates that the southern portals matched the eastern ones in arrangement or measure.
    reason: lexical_alternative
  - marker: c
    text: Or 'toward the south'.
    reason: previous_rendering
  - marker: d
    text: Or 'corresponding to their openings'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기에서 나는 서쪽[a]으로, 땅의 끝까지 갔습니다. 그리고 거기에서 나는 하늘의 열린 세 문을 보았는데, 동쪽에서 보았던 것과 같았으며[c][d][b], 그 문들과 그 출구에 대응하는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서쪽을 향하여’. 여기서는 ዐረብ이 서쪽 방향을 가리킵니다.
    reason: alternative_reading
  - marker: b
    text: 문맥상 앞서 본 동쪽의 문들과 배열이나 규모가 서로 대응한다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘동쪽에서 본 것처럼’.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘그 문들과 대응하는’.
    reason: previous_rendering
