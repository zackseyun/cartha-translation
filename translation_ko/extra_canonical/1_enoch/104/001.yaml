base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/104/001.yaml
  text: I swear to you that in heaven the angels remember you for good before the glory of the Great One[a][b][c].
  footnotes:
  - marker: a
    text: The Ethiopic OCR for this verse is incomplete and difficult. The visible words include 'in heaven,' 'remembered,' and 'angels,' but the line appears truncated. The translation therefore reflects the probable sense of heavenly remembrance in context rather than a mechanically literal rendering of the damaged OCR alone.
    reason: textual_variant
  - marker: b
    text: 'An alternative, closer to the visible Ethiopic forms, would be: ''...for in heaven the angels remember you for good before ...'''
    reason: alternative_reading
  - marker: c
    text: Or 'Do not think in your spirit that your complaint is not heard, for your memorial is written down before the glory of the Great One.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 너희에게 맹세하노니, 하늘에서 천사들이 너희를 선한 것으로 기억하고 있습니다. 그것은 위대한 분의 영광 앞에서입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 원문은 천사들이 ‘기억한다’고 말하며, POB 영어의 ‘for good’는 그 기억이 호의적임을 드러내기 위한 해석입니다.
    reason: source_note
  - marker: b
    text: ‘위대한 분’은 원문이 지시하는 신적 칭호를 직역한 것으로, 전통적 교회어 ‘하나님’보다 원문 표현의 거리감을 남깁니다.
    reason: cultural_note
  - marker: c
    text: 이 구절의 문장 끝은 천상 기억이 ‘위대한 분의 영광 앞에서’ 이루어진다는 점을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  english_pob_choice: I swear to you
  chosen_korean: 내가 너희에게 맹세하노니
  alternatives_korean:
