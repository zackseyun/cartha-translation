  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서두의 서약 공식은 단순한 진술이 아니라 엄숙한 보증이므로, 한국어에서는 ‘맹세하노니’로 그 강도를 살렸습니다.
- source_word: ይዜከሩ፡
