translation:
  language: ko
  text: 내가 너희에게 맹세합니다. 하늘에서 천사들이 위대한 분의 영광 앞에서 너희를 좋게 기억합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  english_pob_choice: I swear to you
  chosen_korean: 내가 너희에게 맹세하노니
  alternatives_korean:
  - 내가 너희에게 맹세합니다
  - 내가 너희에게 확언하노니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서두의 서약 공식은 단순한 진술이 아니라 엄숙한 보증이므로, 한국어에서는 ‘맹세하노니’로 그 강도를 살렸습니다.
- source_word: ይዜከሩ፡
  english_pob_choice: remember
  chosen_korean: 기억하고 있습니다
  alternatives_korean:
  - 기억합니다
  - 상기하고 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 하늘의 기억은 현재적이고 지속적인 상태를 드러내므로, 평서적으로 ‘기억하고 있습니다’라고 옮겨 자연스러운 합쇼체를 유지했습니다.
- source_word: መላእክት፡
  english_pob_choice: the angels
  chosen_korean: 천사들이
  alternatives_korean:
  - 천사들은
  - 사자들이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 명사형은 분명히 천사들을 가리키므로, 원문 의미를 그대로 살려 ‘천사들이’로 옮겼습니다.
- source_word: በእንቲአክሙ፡ ለሠናይ፡
  english_pob_choice: for good
  chosen_korean: 선한 것으로
  alternatives_korean:
  - 좋은 것으로
  - 유익하게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘너희를 위하여 선하게’라는 방향성을 한국어에서는 결과 상태로 풀어 ‘선한 것으로’라고 옮겨, 단순한 감정이 아니라 호의적 기억의 성격을 드러냈습니다.
- source_word: በሰማይ፡
  english_pob_choice: in heaven
  chosen_korean: 하늘에서
  alternatives_korean:
  - 하늘 안에서
  - 하늘에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구는 천상 영역을 가리키므로 한국어에서는 가장 सीधे한 ‘하늘에서’로 옮겼습니다.
theological_decisions:
- issue: ‘기억하다’의 천상 법정적 뉘앙스
  chosen_reading: 이 구절은 단순한 회상이 아니라, 하늘에서 천사들이 의인들을 선하게 기억하는 천상적 증언으로 읽었습니다.
  alternative_readings:
  - 천사들이 단지 너희를 떠올린다는 뜻
  - 하늘의 기록 장부에 대한 암시로 더 강하게 읽는 해석
  rationale: 게에즈 원문과 POB 영어는 모두 천상 영역에서의 기억을 말하지만, 본문 자체에 ‘기록되다’는 단어는 없으므로 과도한 장부 이미지는 피하고, 기억의 보증 기능을 살렸습니다.
  doctrine_reference: 본문의 천상적 위로와 증언 이미지를 보존하고, 없는 표현을 추가하지 않음
