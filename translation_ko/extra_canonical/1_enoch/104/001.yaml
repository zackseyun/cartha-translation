  - 하늘에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구는 천상 영역을 가리키므로 한국어에서는 가장 सीधे한 ‘하늘에서’로 옮겼습니다.
theological_decisions:
- issue: ‘기억하다’의 천상 법정적 뉘앙스
  chosen_reading: 이 구절은 단순한 회상이 아니라, 하늘에서 천사들이 의인들을 선하게 기억하는 천상적 증언으로 읽었습니다.
  alternative_readings:
  - 천사들이 단지 너희를 떠올린다는 뜻
  - 하늘의 기록 장부에 대한 암시로 더 강하게 읽는 해석
  rationale: 게에즈 원문과 POB 영어는 모두 천상 영역에서의 기억을 말하지만, 본문 자체에 ‘기록되다’는 단어는 없으므로 과도한 장부 이미지는 피하고, 기억의 보증 기능을 살렸습니다.
  doctrine_reference: 본문의 천상적 위로와 증언 이미지를 보존하고, 없는 표현을 추가하지 않음
