  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 하늘의 개구부를 가리키므로 ‘문’이 가장 직접적입니다. 영어 POB의 footnote처럼 ‘openings/gates’의 여지도 있으나, 한국어 본문은 이미지의 구체성을 유지하는 쪽이 적절합니다.
