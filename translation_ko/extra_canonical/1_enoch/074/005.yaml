  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문 후반의 문/문들 문맥과 천문적 ‘출입’ 표현을 따라, 해가 각 문을 통해 ‘들어가다’는 의미로 자연스럽게 한국어화했습니다. 영어 POB의 ‘sets’는 결과를 풀어쓴 것이며, 원문은 동작 자체를 더 직접적으로 말합니다.
