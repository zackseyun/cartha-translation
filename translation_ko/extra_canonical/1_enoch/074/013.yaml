  revised_text: 삼 년에는 천아흔두 날이 있으며[a], 다섯 년에는 천팔백이십 날, 그리고 여덟 날이 있습니다. 그러므로 여덟 년에는 이천구백십이 날, 그리고 열 날과 두 날이 있습니다.
