  naturalness: ‘년’은 이 천문·계산 문맥에서 자연스럽습니다. 다만 수사 배열의 난해함은 문법적으로 매끈하게 재구성하지 말고, 쉼표와 ‘그리고’를 사용해 읽을 수 있게 드러내는 편이 안전합니다. 문장 종결은 현대 표준어 합쇼체로 통일했습니다.
  terminology: ‘날’은 መዋዕለ의 달력상 수량 단위에 적절합니다. 신명이나 교리 용어는 없습니다. 주석은 실제 본문에 남긴 분절 수치와 OCR 기반 증거의 한계를 구체적으로 설명해야 합니다.
