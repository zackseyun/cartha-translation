base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/010.yaml
  text: And five days are added[a], and for the sun it reaches thirty days; and all the days that accrue to it for one of those five years, when completed[c][b], amount to three hundred and sixty-four days.
  footnotes:
  - marker: a
    text: The Ethiopic line is textually awkward in places. The sense is that five supplementary days are added to complete the solar year at 364 days.
    reason: textual_variant
  - marker: b
    text: Compare the broader calendar scheme in the Astronomical Book, where the year is structured as 364 days rather than by a lunar reckoning.
    reason: cross_reference
  - marker: c
    text: Or 'And the five days are added, and for the sun there come to thirty days; and all the days appointed to the year amount to three hundred and sixty-four days, from these five days being completed.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다섯 해가 더해지고[a], 해를 기준으로는 서른 날에 이르며, 그 다섯 해 가운데 한 해에 더해지는 모든 날이[b] 채워지면, 셋백 예순넷 날이 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈 본문은 여기서 ‘다섯 해’로 읽히며, 영어 POB의 ‘five days’는 문맥상 달력 계산을 위한 조정으로 이해된 번역입니다.
    reason: textual_variant
  - marker: b
    text: 이 절은 해의 주기와 합산된 날수를 설명하는 달력 본문입니다.
    reason: cross_reference
