base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/011.yaml
  text: And their excess for the sun and the stars comes to six days[a]; in five years, at six each, it amounts for them to thirty days[c][b], and the moon falls behind the sun and the stars by thirty days.
  footnotes:
  - marker: a
    text: The verse's arithmetic is compressed. The sense appears to be that over five years the sun and stars accumulate six extra days, while the moon's reckoning is thirty days shorter than theirs.
    reason: cultural_note
  - marker: b
    text: '''The moon'' could also be understood as ''the month,'' since the Ge''ez term can bear either sense in calendrical contexts.'
    reason: lexical_alternative
  - marker: c
    text: Or 'comes to six days in five years; by six they reach them, to thirty days, and they are taken away from the sun and from the stars—thirty days for the moon.'.
    reason: previous_rendering
translation:
  language: ko
  text: 해와 별의 그 남는 분량은 여섯 날에 이릅니다[a]. 다섯 해 동안에, 각각 여섯씩 하여, 그것은 그들에게 서른 날에 이르며[b], 달은 해와 별에 비해 서른 날 모자랍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 산술은 압축되어 있습니다. 뜻은 대체로 다섯 해 동안 해와 별의 계산상 초과분이 여섯 날에 이르고, 달은 그보다 서른 날 모자란다는 것입니다.
    reason: cultural_note
  - marker: b
    text: ‘달’은 문맥에 따라 ‘한 달’로도 이해될 수 있습니다. 게에즈어 낱말이 천문·역법 문맥에서 두 뜻을 모두 가질 수 있기 때문입니다.
    reason: lexical_alternative
