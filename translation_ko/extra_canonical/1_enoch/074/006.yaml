base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/006.yaml
  text: For seven days it goes out and turns about[a], and it returns again through the gate from which the sun goes out; and it completes all its light, and it withdraws from the sun[d][c][b], and it enters for eight days through the sixth gate from which the sun goes out.
  footnotes:
  - marker: a
    text: The Ge'ez term for the heavenly opening can also be rendered 'gate.' 'Window' is kept here because it fits the imagery of the luminaries' openings, but 'gate' remains a viable lexical alternative in this section.
    reason: lexical_alternative
  - marker: b
    text: The subject is implicit in this verse. In context it is likely the moon, but the main text keeps the pronoun 'it' rather than supplying the noun.
    reason: alternative_reading
  - marker: c
    text: The clause 'it completes all its light' is somewhat technical and may refer to the luminary reaching the full measure of its brightness before changing its course.
    reason: cultural_note
  - marker: d
    text: Or 'And for seven days it goes out and turns about, and it returns again through the window from which the sun comes out; and it completes all its light, and it withdraws from the sun, and it enters for eight days through the sixth window from which the sun comes out.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것은[b] 칠 일 동안 나가서 돌며, 다시 돌아와 해가 나오는 문[a]으로 들어갑니다. 그리고 자기 빛을 모두 채우고[c], 해에서 물러나며, 여덟 날 동안 해가 나오는 여섯째 문으로 들어갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 ኆኅት은 ‘문’ 외에 ‘관문’ 또는 ‘출입구’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 이 절에서 주어를 반복하여 밝히지 않습니다. 문맥상 달을 가리킬 가능성이 크지만, 본문에서는 이를 명시하지 않았습니다.
    reason: alternative_reading
  - marker: c
    text: ‘자기 빛을 모두 채우고’는 그 천체의 빛이 충만한 분량에 이르는 과정을 가리키는 기술적 표현일 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: በኆኅት
  english_pob_choice: through the gate
  chosen_korean: 문으로
  alternatives_korean:
  - 문을 통해
  - 문으로서
  - 관문으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영어 본문이 ኆኅት을 gate로 정리했으므로, 한국어도 ‘문’보다 다소 기술적·우주론적 뉘앙스가 있는 ‘문’으로 옮기되, 고정된 종교용어 ‘문’의 친숙함을 살렸습니다.
- source_word: የአውድ
  english_pob_choice: turns about
  chosen_korean: 돌며
  alternatives_korean:
  - 빙돌며
  - 회전하며
  - 둘러
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체의 원운동을 자연스럽게 보이게 하면서도 과도한 해석을 피하기 위해 ‘돌며’로 옮겼습니다.
- source_word: ወይፌጽም ኵሎ ብርሃኖ
  english_pob_choice: and it completes all its light
  chosen_korean: 자기의 모든 빛을 채우고
  alternatives_korean:
  - 자기의 모든 빛을 완성하고
  - 모든 빛을 다 채우고
  - 온전한 빛에 이르고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구절은 빛의 총량이 채워지는 기술적 표현으로 보이므로, 의미를 풀어 쓰되 ‘완성’보다 자연스러운 ‘채우다’를 택해 과정성을 살렸습니다.
- source_word: ወይፀንን እምፀሐይ
  english_pob_choice: and it withdraws from the sun
  chosen_korean: 해에서 물러나며
  alternatives_korean:
  - 해로부터 물러나며
  - 해에서 떠나며
  - 해에서 빠져나가며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관계적 분리를 나타내는 동작이므로 ‘물러나며’가 가장 무리 없이 긴장을 유지합니다.
- source_word: ሰብዓተ መዋዕለ / ስሙነ መዋዕለ
  english_pob_choice: for seven days / for eight days
  chosen_korean: 칠 일 동안 / 여덟 날 동안
  alternatives_korean:
  - 일곱 날 동안 / 여덟 날 동안
  - 칠 일간 / 팔 일간
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기간 표현을 한국어의 자연스러운 시간 부사구로 옮겼습니다. ‘칠 일/여덟 날’은 대칭을 살리면서도 문체를 지나치게 고어적으로 만들지 않습니다.
theological_decisions:
- issue: 본문의 주어가 명시되지 않는 점
  chosen_reading: 주어를 한국어 본문에 보충하지 않고 ‘그것’으로 유지했습니다.
  alternative_readings:
  - ‘달이’라고 명시함
  - 다른 천체를 구체화함
  rationale: 원문은 연속된 3인칭 동사열로 주어를 반복하지 않으므로, 문맥상 달로 읽힐 가능성이 크더라도 본문에서는 암시를 유지하는 것이 더 충실합니다.
  doctrine_reference: 원문의 생략과 암시를 보존하여 불필요한 결정을 덧붙이지 않습니다.
