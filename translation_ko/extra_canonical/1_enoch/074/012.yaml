  - 그들의 거처대로 영원히
  - 그들의 자리에서 영원히
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 단순한 ‘거주’가 아니라 빛들의 고정된 질서와 배치를 가리키므로, ‘정해진 자리’로 옮겨 그 질서의 고정성을 드러냈습니다.
- source_word: ይዌልጡ ዓመተ
  english_pob_choice: they complete the year
  chosen_korean: 해를 바꾸어
  alternatives_korean:
  - 해를 완성하여
  - 해를 마쳐
  - 해를 이루어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 검토 기록상 이 동사는 ‘완성’보다 ‘바꾸다/변하다’의 어감이 강하므로, 해가 순환하며 넘어가는 이미지를 살려 ‘바꾸어’로 처리했습니다.
- source_word: በጽድቅ
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 옳게
  - 바르게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 정확성보다 더 강한 신학적 어휘가 원문에 있으므로, 이를 약화하지 않도록 ‘의로’라고 옮겼습니다.
- source_word: ፫፻ወ፷ወረቡዕ መዋዕለ
