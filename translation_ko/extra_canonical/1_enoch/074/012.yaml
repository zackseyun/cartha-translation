base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/012.yaml
  text: And the sun and the stars bring in all the years exactly[a]; according to their stations forever, they do not advance or fall behind by a single day, but they complete the year in righteousness, exactly[d][c][b], in three hundred and sixty-four days.
  footnotes:
  - marker: a
    text: Or 'precisely' for 'exactly'; the Ge'ez term emphasizes careful accuracy in the reckoning of the luminaries.
    reason: lexical_alternative
  - marker: b
    text: '''In righteousness'' may also be understood as ''rightly'' or ''properly,'' but the main text keeps the stronger theological wording of the Ge''ez.'
    reason: lexical_alternative
  - marker: c
    text: Or 'so that for eternity they do not advance'.
    reason: previous_rendering
  - marker: d
    text: Or 'they complete the year'.
    reason: previous_rendering
translation:
  language: ko
  text: 태양과 별들은 모든 해를 정확히 이끌어 오며, 영원히 자신들의 정해진 자리대로 하루만큼도 앞서거나 뒤처지지 않습니다. 오히려 의롭게 해를 바꾸며, 정확히 삼백육십사 일로 해를 이루어 갑니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정확히’는 ‘정밀하게’ 또는 ‘세심하게’로도 옮길 수 있습니다. 이 말은 천체의 운행과 연도 계산의 정확성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의롭게’는 ‘옳게’나 ‘바르게’로도 이해할 수 있습니다. 본문은 원문의 ‘의’라는 신학적 어감을 유지합니다.
    reason: theological_note
  - marker: c
    text: ‘해를 바꾸며’는 원문 동사의 ‘바꾸다, 전환하다’라는 의미를 반영합니다. 문맥상 한 해의 순환이 다음 해로 넘어감을 가리킵니다.
    reason: lexical_alternative
