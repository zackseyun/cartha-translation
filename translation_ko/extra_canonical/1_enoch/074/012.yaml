theological_decisions:
- issue: ‘의로’의 신학적 무게를 유지할지, 단순한 계산 정확성으로 완화할지
  chosen_reading: ‘의로’는 천문 질서가 단순한 기술적 정확성이 아니라 정당하고 질서 있는 창조의 순종임을 드러냅니다.
  alternative_readings:
  - ‘옳게’
  - ‘정확하게’
  - ‘바르게’
  rationale: 1에녹서의 이 대목은 천체의 규칙성을 단지 과학적 정밀도로만 말하지 않고, 질서의 도덕적·신학적 성격을 함께 드러냅니다. 따라서 POB의 영어 처리처럼 강한 표현을 유지했습니다.
  doctrine_reference: 'translation philosophy: Preserve theological tension rather than resolve it; contested term ‘righteousness’'
