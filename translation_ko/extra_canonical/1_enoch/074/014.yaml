base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/014.yaml
  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
  footnotes:
  - marker: a
    text: The final phrase, 'and for five years,' appears incomplete in the provided Ge'ez OCR witness; a number or further wording may be missing in this line.
    reason: textual_variant
  - marker: b
    text: The verse is part of a calendrical calculation in the Astronomical Book; 'its days come to' means 'its total number of days amounts to.'
    reason: cultural_note
  - marker: c
    text: Or 'For the single month, its days come to one thousand and sixty-two for three years'.
    reason: previous_rendering
translation:
  language: ko
  text: 달만을 따로 계산하면, 그 날수는 삼 년에는 천육십이 일에 이르며, 또 오 년에는.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절 ‘또 오 년에는’은 제공된 게에즈어 OCR 본문에서 수치나 추가 어구가 빠진 채로 남아 있습니다.
    reason: textual_variant
  - marker: b
    text: 이 절은 『천문서』의 역법 계산에 속합니다. 여기서 ‘이르며’는 날수의 총계가 해당 수치가 된다는 뜻입니다.
    reason: cultural_note
  - marker: c
    text: 또는 첫 말을 ‘한 달만을 따로 계산하면’으로 옮길 수 있습니다. 다만 문맥상 삼 년의 1062일이라는 계산은 달의 주기를 가리킵니다.
    reason: previous_rendering
