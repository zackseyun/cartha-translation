  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
  footnotes:
  - marker: a
    text: The final phrase, 'and for five years,' appears incomplete in the provided Ge'ez OCR witness; a number or further wording may be missing in this line.
    reason: textual_variant
  - marker: b
    text: The verse is part of a calendrical calculation in the Astronomical Book; 'its days come to' means 'its total number of days amounts to.'
    reason: cultural_note
  - marker: c
    text: Or 'For the single month, its days come to one thousand and sixty-two for three years'.
    reason: previous_rendering
translation:
  language: ko
  text: 달에 관해서는 그것이 홀로 있을 때, 그 날수는 삼 년과 오 년에 걸쳐 천육십이 일에 이릅니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절 ‘오 년에 걸쳐’는 제공된 게에즈 OCR 증거에서 수치나 추가 어구가 빠진 채로 남아 있습니다.
    reason: textual_variant
  - marker: b
    text: 이 절은 Astronomical Book의 역법 계산에 속하므로, ‘이릅니다’는 ‘총수가 ...에 해당합니다’라는 뜻으로 읽었습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘한 달에 관해서는, 그 날수는 삼 년 동안 천육십이 일에 이릅니다’로 옮길 수도 있습니다.
    reason: previous_rendering
