base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/002.yaml
  text: And all that Uriel[a], the holy angel who is their leader, showed me—I wrote down their positions as he showed them to me, and I wrote down their paths as they are[e][d][c][b], and I saw their lights until fifteen days were completed.
  footnotes:
  - marker: a
    text: Or 'their courses' for 'their paths'; the Ge'ez term can denote routes or ordered movements of the heavenly bodies.
    reason: lexical_alternative
  - marker: b
    text: The final clause may indicate observation of their lights through a completed fifteen-day period; the exact relation between 'I saw' and the time phrase is somewhat compressed in the Ge'ez.
    reason: alternative_reading
  - marker: c
    text: Or 'their leader'.
    reason: previous_rendering
  - marker: d
    text: Or 'their paths'.
    reason: previous_rendering
  - marker: e
    text: Or 'I saw their lights'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 모두의 지도자인 거룩한 천사 우르엘이 내게 보여 준 모든 것을 나는 기록하였습니다. 나는 그가 내게 보여 준 대로 그들의 자리를 기록하였고, 그들의 길[a]이 있는 그대로 기록하였으며, 열다섯 날이 차기까지 그들의 빛이 나타나는 모습도 기록하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 궤도”로 옮길 수 있습니다. 게에즈어 표현은 천체들의 경로나 정해진 움직임을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎዘ
  english_pob_choice: all that
  chosen_korean: 모든 것
  alternatives_korean:
  - 그 모든 것
  - 일체의 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전체성을 드러내는 상대절로서 한국어에서는 자연스럽게 ‘모든 것’으로 옮기는 것이 가장 직접적입니다.
- source_word: አርአየኒ
  english_pob_choice: showed me
  chosen_korean: 보여 준
  alternatives_korean:
  - 드러내 준
  - 가르쳐 준
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상적 시각 제시를 가리키므로, 과도한 신학화 없이 ‘보여 주다’로 옮겼습니다.
- source_word: መልአክ ቅዱስ
  english_pob_choice: the holy angel
  chosen_korean: 거룩한 천사
  alternatives_korean:
  - 성스러운 천사
  - 성결한 천사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천사의 구별성을 나타내는 관용적 형용사로 ‘거룩한’이 가장 자연스럽고 표준적입니다.
- source_word: መራሒሆሙ
  english_pob_choice: their leader
  chosen_korean: 그들의 지도자인
  alternatives_korean:
  - 그들의 인도자인
  - 그들을 이끄는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체들의 질서 있는 통솔/인도를 가리키므로, 간결하게 ‘지도자’가 본문 기능을 잘 드러냅니다.
- source_word: ምንባሪሆሙ
  english_pob_choice: their stations
  chosen_korean: 그들의 거처
  alternatives_korean:
  - 그들의 자리
  - 그들의 위치
  - 그들의 정해진 자리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 천체의 정해진 배치와 자리이지만, POB의 문맥을 따르되 한국어에서는 ‘거처’가 기존 ‘dwellings’ 계열 의미를 가장 무리 없이 살립니다.
- source_word: አውራኂሆሙ
  english_pob_choice: their paths
  chosen_korean: 그들의 길
  alternatives_korean:
  - 그들의 궤도
  - 그들의 행로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체의 이동 경로를 지칭하므로, 너무 기술적인 ‘궤도’보다 직역성이 높은 ‘길’이 더 원문에 가깝습니다.
- source_word: ብርሃኖሙ
  english_pob_choice: their lights
  chosen_korean: 그들의 빛
  alternatives_korean:
  - 그들의 광명
  - 그들의 밝음
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수형 빛남을 한국어에서 자연스럽게 전달하는 기본어로 ‘빛’을 택했습니다.
- source_word: እስከ ተፈጸመ ዐሡር ወኀሙስ መዋዕለ
  english_pob_choice: until fifteen days were completed
  chosen_korean: 열다섯 날이 차기까지
  alternatives_korean:
  - 열다섯 날이 완료될 때까지
  - 열다섯 날이 마치기까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 완결된 기간을 가리키는 표현으로, 한국어 성경 문체에서 자연스러운 완료 표현인 ‘차기까지’를 사용했습니다.
theological_decisions:
- issue: 천체들에 대한 반복 대명사의 지시 대상
  chosen_reading: 대명사는 주변 맥락의 천체들, 곧 그들의 움직임·자리·빛을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 천사적 존재들을 함께 가리키는 혼합 지시
  - 문학적으로 일부러 모호성을 남기는 읽기
  rationale: 본절은 천체의 질서와 관찰을 이어 가므로, 지시 대상을 과도하게 확대하지 않고 문맥 우선으로 옮기는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙을 유지하고, 본문 내부의 우주론적 질서를 그대로 드러냅니다.
