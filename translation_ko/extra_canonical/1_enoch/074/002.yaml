  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천사의 구별성을 나타내는 관용적 형용사로 ‘거룩한’이 가장 자연스럽고 표준적입니다.
- source_word: መራሒሆሙ
