  - 일체의 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전체성을 드러내는 상대절로서 한국어에서는 자연스럽게 ‘모든 것’으로 옮기는 것이 가장 직접적입니다.
