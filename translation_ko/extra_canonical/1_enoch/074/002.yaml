  rationale: 완결된 기간을 가리키는 표현으로, 한국어 성경 문체에서 자연스러운 완료 표현인 ‘차기까지’를 사용했습니다.
theological_decisions:
- issue: 천체들에 대한 반복 대명사의 지시 대상
  chosen_reading: 대명사는 주변 맥락의 천체들, 곧 그들의 움직임·자리·빛을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 천사적 존재들을 함께 가리키는 혼합 지시
  - 문학적으로 일부러 모호성을 남기는 읽기
  rationale: 본절은 천체의 질서와 관찰을 이어 가므로, 지시 대상을 과도하게 확대하지 않고 문맥 우선으로 옮기는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙을 유지하고, 본문 내부의 우주론적 질서를 그대로 드러냅니다.
