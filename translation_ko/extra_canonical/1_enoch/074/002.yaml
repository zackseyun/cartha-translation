revisions:
- from: 그리고 우르엘[a], 곧 그들의 지도자인 거룩한 천사가 내게 보여 준 모든 것을 나는 적었습니다. 나는 그가 내게 보여 준 대로 그들의 거처를 적었고, 그들이 있는 대로 그들의 길을 적었으며, 그들의 빛을 보았는데, 그것은 열다섯 날이 차기까지였습니다[b].
  to: 그리고 그들 모두의 지도자인 거룩한 천사 우르엘이 내게 보여 준 모든 것을 나는 기록하였습니다. 나는 그가 내게 보여 준 대로 그들의 자리를 기록하였고, 그들의 길[a]이 있는 그대로 기록하였으며, 열다섯 날이 차기까지 그들의 빛이 나타나는 모습도 기록하였습니다.
  rationale: 원문의 문법을 우선하여 마지막 ርእየ를 ‘보았다’가 아닌 ‘나타나는 모습’으로 바로잡고, 이를 앞선 ‘기록하였습니다’에 병렬되는 목적어로 번역했습니다. 이에 따라 해당 오독을 설명하던 b 각주는 삭제했습니다. 또한 천문 문맥에 맞추어 ‘거처’를 ‘자리’로 고치고, ‘그들 모두의 지도자’를 보존했습니다. 남는 어휘 대안 각주는 실제 해당 어휘인 ‘길’에 부착했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:04Z'
