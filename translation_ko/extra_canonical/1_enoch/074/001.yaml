translation:
  language: ko
  text: 그리고 나는 그것에 대한 또 다른 운행과 규정을 보았습니다. 그것은 그 규정에 따라 달들의 주기를 따라 운행합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘달들’은 ‘여러 달’ 또는 ‘여러 달(천체)’로 이해될 수 있습니다. 따라서 마지막 구절은 ‘달들의 순환’ 또는 ‘여러 달에 걸친 운행’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘운행’과 ‘규정’을 반복하여, 정해진 규정에 따른 운행이라는 관계를 강조합니다.
    reason: source_note
