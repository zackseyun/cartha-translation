translation:
  language: ko
  text: 그리고 나는 그것에 대한 또 다른 운행과 규정을 보았습니다. 그 규정에 따라 그것은 달들의 운행을 이룹니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘달들의 순환’일 수도 있습니다. 본문은 월령의 규칙적 운행을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 반복 구조는 원문의 ‘운행/규정’ 대응을 반영한 것입니다.
    reason: source_note
