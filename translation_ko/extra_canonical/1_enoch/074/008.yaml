base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/008.yaml
  text: And again[a], it returns for seven days to the fourth gate[c][b], from which the sun comes out.
  footnotes:
  - marker: a
    text: The subject of 'it enters' is implicit in the Ge'ez and, in context, refers to the sun's course in the sequence of gates described in this chapter.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez can also be rendered 'through the fourth gate'; the imagery is of the sun's ordered movement in and out of heavenly gates.
    reason: lexical_alternative
  - marker: c
    text: Or 'for seven days it enters by'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다시, 그것은 일곱 날 동안 네 번째 문으로 돌아가며, 그 문에서 해가 나옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 원문의 주어는 암시되어 있으며, 문맥상 해의 운행을 가리킵니다.
    reason: source_note
  - marker: b
    text: 게에즈는 ‘네 번째 문을 통해’로도 읽을 수 있으나, 이미지의 핵심은 그 문에 이르러 드나드는 질서 있는 운동입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘일곱 날 동안 네 번째 문으로 들어간다’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወ*ካዕበ
  english_pob_choice: And again
  chosen_korean: 그리고 다시
  alternatives_korean:
  - 또다시
  - 다시
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 접속부사는 앞선 천체의 순환 서술을 이어 주므로, 반복성과 연속성을 살리는 ‘그리고 다시’가 자연스럽습니다.
- source_word: ይገብእ
  english_pob_choice: it returns
  chosen_korean: 돌아갑니다
  alternatives_korean:
  - 되돌아옵니다
  - 되돌아갑니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사는 단순한 ‘들어가다’보다 순환적 ‘되돌아감’을 뜻하므로, 천체의 반복 운동을 드러내는 ‘돌아갑니다’로 옮겼습니다.
- source_word: ሰቡዐ፡ መዋዕለ
  english_pob_choice: for seven days
  chosen_korean: 일곱 날 동안
  alternatives_korean:
  - 일곱 날을
  - 일곱 날 동안에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기간을 나타내는 표현이므로, 한국어에서는 자연스러운 지속 표현인 ‘일곱 날 동안’이 가장 सीधे합니다.
- source_word: በራብዕት፡ ኆኅት
  english_pob_choice: to the fourth gate
  chosen_korean: 네 번째 문으로
  alternatives_korean:
  - 네 번째 문에
  - 네 번째 문까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최근접 대상은 ‘문’이며, 이동의 도착점을 드러내는 ‘-로’가 POB의 수정 반영인 ‘to the fourth gate’를 잘 살립니다.
- source_word: እንተ፡ እምኔሃ
  english_pob_choice: from which
  chosen_korean: 그 문에서
  alternatives_korean:
  - 그것에서
  - 거기서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 ‘그 문으로부터’도 가능하지만, 문맥상 해가 나오는 출처를 간명하게 드러내는 ‘그 문에서’가 한국어에서 더 자연스럽습니다.
- source_word: ይወፅእ፡ ፀሐይ
  english_pob_choice: the sun comes out
  chosen_korean: 해가 나옵니다
  alternatives_korean:
  - 해가 나옵니다
  - 태양이 나옵니다
  - 해가 나가십니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 핵심은 ‘나오다/나가다’의 출현 이미지이므로, 우주적 문에서의 출현을 평이하게 보이는 ‘해가 나옵니다’가 적절합니다.
theological_decisions:
- issue: 천문적 순환 서술의 인격화 여부
  chosen_reading: ‘그것’으로 가리키되, 문맥상 해의 순환 운동을 지속적으로 서술하는 방식으로 유지했습니다.
  alternative_readings:
  - ‘해는’으로 주어를 명시하는 방식
  - 주어를 생략해 더 압축하는 방식
  rationale: 게에즈 원문과 영어 POB는 주어를 문맥상 암시하므로, 해의 운행을 드러내되 과도한 의인화 없이 순환적 서술을 보존했습니다.
  doctrine_reference: 천체의 질서에 대한 창조 서술의 문자적·서사적 보존
- issue: ‘문으로’와 ‘그 문에서’의 병치
  chosen_reading: 도착점은 ‘네 번째 문으로’, 출처는 ‘그 문에서’로 구분했습니다.
  alternative_readings:
  - 두 곳 모두 ‘문을 통하여’로 처리
  - 둘 다 ‘문에서’로 단순화
  rationale: 영어 POB의 수정 이력은 이동의 지향점과 출현의 출처를 구분하므로, 한국어에서도 두 관계를 나누어 표현해야 의미가 흐려지지 않습니다.
  doctrine_reference: 문학적 이미지와 공간 관계의 보존
