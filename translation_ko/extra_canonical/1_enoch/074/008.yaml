  rationale: 동사의 핵심은 ‘나오다/나가다’의 출현 이미지이므로, 우주적 문에서의 출현을 평이하게 보이는 ‘해가 나옵니다’가 적절합니다.
theological_decisions:
- issue: 천문적 순환 서술의 인격화 여부
  chosen_reading: ‘그것’으로 가리키되, 문맥상 해의 순환 운동을 지속적으로 서술하는 방식으로 유지했습니다.
  alternative_readings:
  - ‘해는’으로 주어를 명시하는 방식
  - 주어를 생략해 더 압축하는 방식
  rationale: 게에즈 원문과 영어 POB는 주어를 문맥상 암시하므로, 해의 운행을 드러내되 과도한 의인화 없이 순환적 서술을 보존했습니다.
  doctrine_reference: 천체의 질서에 대한 창조 서술의 문자적·서사적 보존
- issue: ‘문으로’와 ‘그 문에서’의 병치
  chosen_reading: 도착점은 ‘네 번째 문으로’, 출처는 ‘그 문에서’로 구분했습니다.
  alternative_readings:
  - 두 곳 모두 ‘문을 통하여’로 처리
  - 둘 다 ‘문에서’로 단순화
  rationale: 영어 POB의 수정 이력은 이동의 지향점과 출현의 출처를 구분하므로, 한국어에서도 두 관계를 나누어 표현해야 의미가 흐려지지 않습니다.
  doctrine_reference: 문학적 이미지와 공간 관계의 보존
