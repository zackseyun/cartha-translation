base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/008.yaml
  text: And again[a], it returns for seven days to the fourth gate[c][b], from which the sun comes out.
  footnotes:
  - marker: a
    text: The subject of 'it enters' is implicit in the Ge'ez and, in context, refers to the sun's course in the sequence of gates described in this chapter.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez can also be rendered 'through the fourth gate'; the imagery is of the sun's ordered movement in and out of heavenly gates.
    reason: lexical_alternative
  - marker: c
    text: Or 'for seven days it enters by'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다시, 해는 일곱 날 동안 네 번째 문으로 들어가며, 그 문에서 나옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 원문에서는 첫 절의 주어가 암시되어 있으며, 문맥상 해의 운행을 가리킵니다.
    reason: source_note
  - marker: b
    text: 게에즈는 ‘네 번째 문을 통하여’로도 옮길 수 있습니다. 이 표현은 해가 정해진 문들과 관련하여 질서 있게 운행하는 모습을 나타냅니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘해는 네 번째 문으로 들어가 일곱 날 동안 그곳에 있으며’로 옮길 수 있습니다.
    reason: previous_rendering
