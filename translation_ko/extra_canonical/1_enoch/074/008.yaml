    rationale: 제공된 게에즈 본문과 이 구절의 문맥에서 동사는 문으로 ‘들어가는’ 동작을 가리킵니다. ‘돌아가다’는 반복적 천체 운행이라는 문맥을 의미에 덧붙인 해석입니다. 영어 감사 이력의 ‘returns’ 결정은 원어 우선 검토에 비추어 따르기 어렵습니다.
