review_pass:
  verdict: revise
  source_fidelity: Ge'ez በአውራኅ እመራት is correctly represented as “어떤 달에는,” and the two clauses preserve the repeated temporal phrase. The rendering should retain the source's distributive final repetition (አሐዱ አሐዱ), but the draft's final wording does not form a viable Korean predicate.
  naturalness: ‘그 설정들을 바꾸고’ is an overly literal and technical calque in Korean; ‘그 위치들을 바꾸며’ is natural in this astronomical context. ‘하나하나씩입니다’ is syntactically detached from the preceding verb and is not idiomatic modern formal-polite Korean. Integrating the distributive phrase with ‘운행합니다’ resolves this while maintaining 합쇼체.
  terminology: ‘궤도’ and ‘운행하다’ suitably convey the regular celestial course. ‘위치들’ is more idiomatic than ‘설정들’ for the astronomical sense of English “settings,” without falsely specifying a technical astronomical mechanism.
  issues:
  - severity: medium
    issue: ‘하나하나씩입니다’ is a dangling and unnatural sentence ending.
    rationale: The distributive expression modifies the preceding motion, not an implied copular predicate. Korean requires it to be integrated into the verb clause.
  - severity: low
    issue: ‘설정들’ is an unnatural calque for celestial settings.
    rationale: In modern Korean, astronomical locations or dispositions are more naturally expressed as ‘위치들’ (or, less directly, ‘배치들’).
  revised_text: 그리고 어떤 달에는 그 위치들을 바꾸며[a], 어떤 달에는 각각 하나씩 그 궤도를 운행합니다.[b][c]
