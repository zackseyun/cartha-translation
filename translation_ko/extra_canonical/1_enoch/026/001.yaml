base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/001.yaml
  text: And from there I went to the middle of the earth[a], and I saw a blessed place, shaded[c][b], in which there were trees with abiding and sprouting branches from a tree that had been cut down.
  footnotes:
  - marker: a
    text: The Ethiopic text is difficult in the botanical description. The wording likely refers to shaded, living growth associated with a tree or trees; some details may also be rendered 'with trees' or 'with boughs/shoots.'
    reason: lexical_alternative
  - marker: b
    text: The final clause probably describes fresh growth coming from a tree that had been cut down, though the exact relation of the branches/shoots to the felled tree is textually difficult.
    reason: textual_variant
  - marker: c
    text: Or 'with branches abiding and sprouting'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그곳에서 저는 땅의 한가운데로 갔습니다[a]. 저는 복되고 그늘진 곳을 보았습니다[b]. 그곳에는 베어진 나무에서 나온, 남아 있고 새로 돋아나는 가지들을 지닌 나무들이 있었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ማእከለ ምድር은 우주적·지리적 의미를 지니는 표현입니다. ‘땅의 한가운데’는 그 공간감을 직접적으로 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘그늘진’은 원문의 괄호 안 읽기(ጥሉለ)에 근거합니다. ‘그늘이 있는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 식물에 관한 표현은 본문상 난해합니다. ‘남아 있고 새로 돋아나는 가지들’ 및 그것들이 ‘베어진 나무’와 맺는 관계는 ‘베어진 나무에서 새로 난 가지들’ 등으로도 이해될 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ማእከለ ምድር
  english_pob_choice: the middle of the earth
  chosen_korean: 땅의 중앙
  alternatives_korean:
  - 땅의 한가운데
  - 세상의 중앙
  - 땅의 중심
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비전적 지리 묘사를 살리기 위해 ‘땅’과 ‘중앙’을 직역에 가깝게 옮겼습니다. ‘세상’보다 ‘땅’이 원문의 공간적 감각을 더 직접적으로 드러냅니다.
- source_word: መካነ ቡሩከ
  english_pob_choice: a blessed place
  chosen_korean: 복된 곳
  alternatives_korean:
  - 축복받은 곳
  - 복의 장소
  - 복된 지역
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 장소 자체가 복의 성격을 띤다는 뜻을 간결하게 살렸습니다. ‘복된 곳’은 형용사적 뉘앙스를 유지하면서도 과도한 해석을 피합니다.
- source_word: ጥሉለ
  english_pob_choice: shaded
  chosen_korean: 그늘진
  alternatives_korean:
  - 그늘이 드리운
  - 그늘진 상태의
  - 어두운
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 시각적·감각적 이미지를 자연스러운 한국어로 옮기기 위해 ‘그늘진’을 택했습니다. ‘어두운’은 의미가 약간 달라져 피했습니다.
- source_word: ዕፀወ / አዕፁቀ
  english_pob_choice: trees / branches
  chosen_korean: 나무들 / 가지
  alternatives_korean:
  - 수목들 / 새순
  - 나무 / 뻗은 가지
  - 수목 / 가지들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영문 판단대로 식물 요소를 ‘나무들’로 분명히 살리고, 뒤의 생장 요소를 ‘가지’로 옮겼습니다. 복수와 결합 관계를 한국어 어순에서 자연스럽게 드러냈습니다.
- source_word: ዘይነብር ወይሠርፅ
  english_pob_choice: abiding and sprouting
  chosen_korean: 계속 살아 있는 가지와 새로 돋는 가지
  alternatives_korean:
  - 머물러 있는 가지와 돋아나는 가지
  - 지속하는 가지와 싹트는 가지
  - 살아 남아 돋는 가지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 분사가 함께 생명력과 재생을 나타내므로, 하나는 지속성(계속 살아 있는), 다른 하나는 생성성(새로 돋는)으로 나눠 옮겼습니다. 한국어에서 ‘abiding’의 생동감을 살리기 위해 단순히 ‘남아 있는’보다 ‘살아 있는’을 택했습니다.
- source_word: እምዕፅ ዘተመተረ
  english_pob_choice: from a tree that had been cut down
  chosen_korean: 잘려진 나무에서
  alternatives_korean:
  - 베어진 나무에서
  - 베어져 쓰러진 나무에서
  - 잘린 나무에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 종속절은 잘려진 나무를 출발점으로 새 생장이 나온다는 점을 보여 줍니다. 한국어에서는 이어지는 ‘나무들’과의 관계를 유지하기 위해 간결하게 ‘잘려진 나무에서’로 처리했습니다.
theological_decisions:
- issue: 이 구절을 상징적 낙원/에덴으로 단정할지 여부
  chosen_reading: 본문이 제시하는 시각적 비전과 성스러운 분위기는 살리되, 본문 자체에 없는 이름(에덴, 낙원 등)으로 단정하지 않았습니다.
  alternative_readings:
  - 본문에 낙원이라는 해석어를 본문에 삽입하기
  - 단순한 비옥한 지역으로 평준화하기
  rationale: 원문은 ‘복된 곳’과 생명력 있는 식생을 보여 주지만, 장소의 정체를 직접 명명하지는 않습니다. 따라서 상징성을 보존하되 해석을 확정하지 않는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 해석적 긴장을 유지하고 본문이 말하는 만큼만 말함.
