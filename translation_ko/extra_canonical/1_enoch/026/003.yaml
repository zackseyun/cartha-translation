base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/003.yaml
  text: And I saw another mountain toward the east[a], higher than this one; and between them was a deep ravine, but not wide[d][c][b], and water was flowing in it toward the mountain.
  footnotes:
  - marker: a
    text: '''Toward the northeast'' reflects the directional phrase literally tied to dawn/east; ''toward the east'' is also possible.'
    reason: lexical_alternative
  - marker: b
    text: The comparison term may mean 'higher,' 'greater,' or possibly 'more extended/longer' than the first mountain.
    reason: lexical_alternative
  - marker: c
    text: The final clause is difficult. The Ge'ez most directly says that water was in the ravine and was moving 'toward the mountain.'
    reason: textual_variant
  - marker: d
    text: Or 'toward the northeast'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 다른 동쪽[a]의 산을 보았는데, 이 산보다 더 높았습니다[b]. 그들 사이에는 깊은 골짜기가 있었으나 넓지는 않았고[c][d], 그 안으로 물이 산 쪽을 향해 흘러가고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동쪽’은 ጽባሕ이 가리키는 문자적 방향을 따른 번역입니다. ‘해 돋는 쪽’도 가능한 뉘앙스입니다.
    reason: lexical_alternative
  - marker: b
    text: 비교 형용사는 문자적으로는 ‘더 길다/더 늘어나다’의 뜻을 가질 수 있으나, 산을 비교하는 문맥에서는 ‘더 높다’가 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: Ge'ez 본문은 물이 골짜기 안에 있으면서 산 쪽으로 움직인다고 가장 직접적으로 말합니다.
    reason: textual_variant
  - marker: d
    text: ‘넓지는 않았고’는 문자적으로 ‘너비가 없었다’는 표현을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መንገለ ጽባሕ
  english_pob_choice: toward the east
  chosen_korean: 동쪽
  alternatives_korean:
  - 해 돋는 쪽
  - 동방
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጽባሕ은 문자적으로 아침/새벽/동쪽을 가리키므로, 본문처럼 방향을 말할 때는 과잉 해석 없이 ‘동쪽’이 가장 직접적입니다.
- source_word: ካልአ ደብረ
  english_pob_choice: another mountain
  chosen_korean: 또 다른 산
  alternatives_korean:
  - 두 번째 산
  - 한 산 더
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: መ순차적 환시에서 ካልአ는 앞의 산과 구별되는 ‘또 다른’ 대상을 가리키므로, 자연스러운 한국어로 옮겼습니다.
- source_word: ዘይነውኅ እምዝ
  english_pob_choice: higher than this one
  chosen_korean: 이 산보다 더 높았습니다
  alternatives_korean:
  - 이 산보다 더 길었습니다
  - 이 산보다 더 크었습니다
  - 이 산보다 더 뻗어 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역상 ‘길다/늘어나다’의 뉘앙스가 있으나, 산의 비교에서는 높이 비교로 읽는 것이 장면에 가장 자연스럽고 POB의 판단과도 맞습니다.
- source_word: ቈላ ዕሙቀ / አልቦ ርሐበ
  english_pob_choice: a deep ravine, but not wide
  chosen_korean: 깊은 골짜기가 있었으나 넓지는 않았고
  alternatives_korean:
  - 깊은 협곡이 있었으나 넓지는 않았고
  - 깊은 계곡이 있었으나 넓지는 않았고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 산 사이의 움푹한 지형을 살리면서도, 한국어에서 환시적 장면에 지나치게 낯설지 않은 ‘골짜기’로 옮겼습니다.
theological_decisions:
- issue: 환시 지형을 상징으로 평탄화하지 않을지
  chosen_reading: 산, 골짜기, 물의 흐름을 실제 환시 풍경으로 그대로 유지했습니다.
  alternative_readings:
  - 지형을 상징적으로 풀어쓴 번역
  - ‘어떤 곳’처럼 일반화한 번역
  rationale: 본 절은 상징 의미를 설명하기보다 구체적 지형 묘사를 통해 환시의 장면을 전달하므로, 이미지를 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: '묵시문학 번역 원칙: 구체적 환시 이미지를 유지하고 해석은 독자와 주석에 맡김'
