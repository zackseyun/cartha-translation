  - 깊은 계곡이 있었으나 넓지는 않았고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 산 사이의 움푹한 지형을 살리면서도, 한국어에서 환시적 장면에 지나치게 낯설지 않은 ‘골짜기’로 옮겼습니다.
theological_decisions:
- issue: 환시 지형을 상징으로 평탄화하지 않을지
  chosen_reading: 산, 골짜기, 물의 흐름을 실제 환시 풍경으로 그대로 유지했습니다.
  alternative_readings:
  - 지형을 상징적으로 풀어쓴 번역
  - ‘어떤 곳’처럼 일반화한 번역
  rationale: 본 절은 상징 의미를 설명하기보다 구체적 지형 묘사를 통해 환시의 장면을 전달하므로, 이미지를 보존하는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: '묵시문학 번역 원칙: 구체적 환시 이미지를 유지하고 해석은 독자와 주석에 맡김'
