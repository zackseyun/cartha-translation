  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역상 ‘길다/늘어나다’의 뉘앙스가 있으나, 산의 비교에서는 높이 비교로 읽는 것이 장면에 가장 자연스럽고 POB의 판단과도 맞습니다.
