base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/002.yaml
  text: And there I saw a holy mountain[a], and beneath the mountain water from the east, and its flow toward the north.
  footnotes:
  - marker: a
    text: The Ge'ez says literally 'water from the east'; the following clause clarifies that this water has a northward flow.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거기서 나는 거룩한 산 하나를 보았습니다. 그 산 아래에는 동쪽에서 온 물[a]이 있었으며, 그 흐름은 북쪽을 향했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어는 문자적으로 ‘동쪽에서 온 물’이라고 말하며, 이어지는 절은 그 물의 흐름이 북쪽을 향한다고 밝힙니다.
    reason: lexical_alternative
