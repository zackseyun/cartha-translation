base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/003.yaml
  text: And I asked[a], saying[b], “What is this that has no rest?”
  footnotes:
  - marker: a
    text: Or 'this' or 'this one'; the Ge'ez demonstrative points to the phenomenon Enoch has just seen.
    reason: lexical_alternative
  - marker: b
    text: '''Has no rest'' may also be rendered ''is without repose.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 물었습니다. “쉬지 않는 이것이 무엇입니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 지시어는 바로 앞에서 본 현상을 가리킬 수 있으므로, ‘이것’은 ‘이것/이것이/이것 하나’ 정도로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘rest’는 ‘쉼’이나 ‘안식’으로도 옮길 수 있으나, 여기서는 더 중립적인 ‘쉬지 않는’으로 처리했습니다.
    reason: lexical_alternative
