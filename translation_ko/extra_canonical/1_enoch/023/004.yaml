base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
  footnotes:
  - marker: a
    text: The Ge'ez wording around 'this spirit that leads astray' is difficult. The referent may also be understood as a wind or rushing force rather than a personal spirit.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the western path of fire.' The phrase likely describes a fiery region or route in the west within the vision's cosmic geography.
    reason: lexical_alternative
  - marker: c
    text: Or '“This spirit that leads astray goes out by the path of the fire of the west; it is that which drives all the lights of heaven.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 라구엘이, 나와 함께 있는 거룩한 천사들 가운데 하나가, 내게 답하여 말했습니다. “네가 서쪽을 향해 본 이 불의 흐름은 하늘의 모든 빛을 몰아내는 불이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “서쪽 불의 길”.
    reason: lexical_alternative
  - marker: b
    text: ‘불의 흐름’은 원문의 ‘달리는/흐르는’ 뉘앙스를 살린 해석입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: አውሥአኒ
  english_pob_choice: answered me
  chosen_korean: 내게 답하여 말했습니다
  alternatives_korean:
  - 내게 대답했습니다
  - 내게 응답했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문답형 환시 문맥에서 ‘답하다/대답하다’가 자연스럽고, ‘말했습니다’보다 ‘내게 답하여 말했습니다’가 응답의 성격을 더 분명히 드러냅니다.
- source_word: ቅዱሳን መላእክት
  english_pob_choice: holy angels
  chosen_korean: 거룩한 천사들
  alternatives_korean:
  - 성스러운 천사들
  - 거룩한 천사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시문학의 관용적 표현을 살려 ‘거룩한 천사들’로 옮겼습니다. 복수성을 유지해 ‘one of’와도 맞춥니다.
- source_word: ዘርኢከ ሩጸተ
  english_pob_choice: This course of fire which you saw
  chosen_korean: 네가 서쪽을 향해 본 이 불의 흐름
  alternatives_korean:
  - 네가 본 이 불의 길
  - 네가 본 이 불의 진행
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보정된 원문 의미가 ‘네가 본…’과 ‘course/running’이므로, 환시 속 가시적 이동을 살리는 ‘불의 흐름’으로 옮겼습니다.
- source_word: ይሰድድ ብርሃናተ ሰማይ
  english_pob_choice: drives all the lights of heaven
  chosen_korean: 하늘의 모든 빛을 몰아내는
  alternatives_korean:
  - 하늘의 모든 빛을 몰아가는
  - 하늘의 모든 빛을 몰아치는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘드라이브/drive’의 강제적 추진력을 한국어로는 ‘몰아내다’가 가장 힘 있게 드러내며, 천체들을 움직이는 불의 작용을 유지합니다.
theological_decisions:
- issue: 서쪽의 불과 하늘의 빛들 사이의 관계
  chosen_reading: 서쪽을 향해 본 불의 흐름이 하늘의 모든 빛을 몰아내는 불이라고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 서쪽 길의 불
  - 서쪽에서 나오는 불
  rationale: 원문은 환시 해설로서 우주적 질서를 설명하지만, 그 작동 방식은 다소 기이합니다. 이를 매끈하게 풀어내기보다, 묵시적 긴장을 보존하는 쪽이 본문에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
