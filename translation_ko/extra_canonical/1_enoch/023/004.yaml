- source_word: ዘርኢከ ሩጸተ
  english_pob_choice: This course of fire which you saw
  chosen_korean: 네가 서쪽을 향해 본 이 불의 흐름
  alternatives_korean:
  - 네가 본 이 불의 길
  - 네가 본 이 불의 진행
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보정된 원문 의미가 ‘네가 본…’과 ‘course/running’이므로, 환시 속 가시적 이동을 살리는 ‘불의 흐름’으로 옮겼습니다.
- source_word: ይሰድድ ብርሃናተ ሰማይ
