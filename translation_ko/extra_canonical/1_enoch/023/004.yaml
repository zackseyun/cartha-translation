base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
  footnotes:
  - marker: a
    text: The Ge'ez wording around 'this spirit that leads astray' is difficult. The referent may also be understood as a wind or rushing force rather than a personal spirit.
    reason: lexical_alternative
  - marker: b
    text: Or 'by the western path of fire.' The phrase likely describes a fiery region or route in the west within the vision's cosmic geography.
    reason: lexical_alternative
  - marker: c
    text: Or '“This spirit that leads astray goes out by the path of the fire of the west; it is that which drives all the lights of heaven.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 나와 함께 있던 거룩한 천사들 가운데 한 사람인 라구엘이 내게 대답하여 말했습니다. “네가 서쪽을 향해 본 이 불의 흐름은 하늘의 모든 빛을 몰아 움직이는 불이다.”[a]
