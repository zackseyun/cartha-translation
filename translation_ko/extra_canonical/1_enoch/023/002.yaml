base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/002.yaml
  text: And I saw a fire that burned and flowed[a], and it did not rest or cease from its course by day or by night[c][b], but continued in the same way.
  footnotes:
  - marker: a
    text: 'The closing phrase is difficult. The Ge''ez appears to indicate continued action ''thus'' or ''in the same way''; alternatively, it may simply reinforce the description: ''but so it was.'''
    reason: lexical_alternative
  - marker: b
    text: The expression rendered 'from its course' may also be understood as 'from its rushing,' 'from its path,' or 'from its flow,' emphasizing the fire's unbroken movement.
    reason: lexical_alternative
  - marker: c
    text: Or 'And I saw a fire that burned and blazed, and it did not rest or cease from its course by day or by night, but kept on in the same way.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 타고 흐르는 불을 보았는데[a], 그것은 낮에도 밤에도 그 흐름에서 쉬지 않고 멈추지 않았으며[b], 그대로 계속되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘타고 흐르는’이며, 앞선 영어 본문처럼 Ge'ez의 동작성과 운동성을 함께 반영한 표현입니다.
    reason: source_note
  - marker: b
    text: Ge'ez는 ‘그 흐름/달림에서’라는 뜻을 가질 수 있어, 불이 자기 경로를 따라 쉬지 않고 움직인다는 뉘앙스를 살렸습니다.
    reason: alternative_reading
