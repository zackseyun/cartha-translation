    text: Or 'toward the east'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 그곳에서 다른 곳으로, 땅의 끝까지 서쪽을 향해 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምህየ
  english_pob_choice: from there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기에서
  - 그 자리에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞선 장소에서 이동을 시작하는 지시 표현이므로, 자연스러운 지시어인 ‘그곳에서’로 옮겨 서술의 연결을 살렸습니다.
- source_word: ሖርኩ
  english_pob_choice: I went
  chosen_korean: 나는 … 갔습니다
  alternatives_korean:
  - 나는 … 갔습니다
  - 나는 … 여행했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 과거 이동 동사이므로, 과장 없이 평이한 ‘갔습니다’가 가장 직접적입니다.
- source_word: ካልአ መካነ
  english_pob_choice: another place
  chosen_korean: 다른 장소
  alternatives_korean:
  - 또 다른 장소
  - 다른 곳
  lexicon: Dillmann, Lexicon Aethiopicae
  rationale: 앞 장면과 구별되는 새 위치를 가리키므로, 공간성을 분명히 하는 ‘다른 장소’가 적절합니다.
- source_word: መንገለ ዓረብ
  english_pob_choice: toward the west
  chosen_korean: 서쪽으로
  alternatives_korean:
  - 서편으로
  - 서쪽을 향해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 ዓረብ는 ‘서쪽’을 뜻하므로, 방향 부사 ‘서쪽으로’로 간결하고 분명하게 처리했습니다.
- source_word: እስከ አጽናፈ ምድር
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅의 끝까지
  alternatives_korean:
  - 땅 끝까지
  - 세상의 끝까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적·우주적 지리 표현을 유지하되, 한국어로는 ‘땅의 끝까지’가 가장 자연스럽고 범위를 잘 드러냅니다.
theological_decisions:
- issue: 묵시적 지리 표현 보존
  chosen_reading: ‘땅의 끝까지’로 번역해, 단순한 실제 여행기보다 비전적 세계 지리의 과장을 유지했습니다.
  alternative_readings:
  - 실제 지상의 끝자락까지
  - 먼 변방까지
  rationale: 에녹서의 서술은 상징적·우주적 공간 감각을 사용하므로, 이를 약화시키지 않고 그대로 살리는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic imagery rather than flattening visionary language.'
