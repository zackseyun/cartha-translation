base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/107/001.yaml
  text: And I saw written upon them that generation after generation will transgress[a], until a generation of righteousness arises, and iniquity is destroyed, and sin passes away from the earth[b], and every good thing comes upon it.
  footnotes:
  - marker: a
    text: The Ge'ez witness for this verse consists only of the brief vision formula 'And I saw.' If a fuller wording is reflected in other witnesses or editions, that expansion is not present in the supplied base text.
    reason: textual_variant
  - marker: b
    text: Or 'And I saw.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 그들 위에 기록된 것을 보았습니다. 곧 세대마다 범죄하다가 의로운 세대가 일어나고, 불의가 멸망하며, 죄가 땅에서 사라지고, 모든 좋은 것이 땅 위에 올 것이라고 기록되어 있었습니다.


    이제 내 아들아, 가서 네 아들 라멕에게 알려라. 태어난 이 아이가 참으로 그의 아들이며 거짓된 아들이 아니라고 하여라. 마투살라가 자기 아버지 에녹의 말을 들었을 때, 에녹이 그에게 은밀히 모든 일을 보여 주었으므로, 그는 돌아가 그 아이의 이름을 노아라 하였습니다. 이는 그가 모든 멸망에서 땅에 기쁨을 가져다줄 것이기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኢኩ
  english_pob_choice: I saw
  chosen_korean: 나는 … 보았습니다
  alternatives_korean:
  - 나는 … 보았고
  - 내가 … 보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 동사 ርኢኩ는 단순한 시각 인식이므로 ‘보았습니다’가 가장 सीधे하며, 환시 서술의 간결한 시작을 살립니다.
- source_word: ጽሑፈ
  english_pob_choice: written
  chosen_korean: 기록된
  alternatives_korean:
  - 쓰인
  - 적힌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 하늘에 기록된 계시 내용을 가리키므로 ‘기록된’이 한국어에서 가장 자연스럽고, 문서적·계시적 뉘앙스를 유지합니다.
- source_word: ትውልድ እምትውልድ
  english_pob_choice: generation after generation
  chosen_korean: 세대가 또 세대를 거슬러
  alternatives_korean:
  - 세대에서 세대로
  - 대대로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역 구조를 살리되 한국어로는 반복·연속의 의미가 드러나도록 ‘세대가 또 세대를 거슬러’로 옮겼습니다.
- source_word: ትውልደ ጽድቅ
  english_pob_choice: a generation of righteousness
  chosen_korean: 의의 세대
  alternatives_korean:
  - 의로운 세대
  - 정의의 세대
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጽድቅ는 윤리적 선함보다 언약적·도덕적 ‘의’에 가깝기 때문에 관형적 번역인 ‘의의 세대’가 원문 범위를 가장 잘 보존합니다.
- source_word: አበሳ / ኀጢአት
  english_pob_choice: iniquity / sin
  chosen_korean: 불의 / 죄
  alternatives_korean:
  - 죄악 / 죄
  - 불법 / 죄
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 명사가 병렬로 나오므로 의미 구분을 살려 አበሳ는 ‘불의’, ኀጢአት는 ‘죄’로 옮겨 중복을 피했습니다.
theological_decisions:
- issue: 종말론적 계시의 미래형 서술
  chosen_reading: 세대가 또 세대를 거슬러 범죄할 것이며 … 불의가 사라지며 죄가 땅에서 없어진 뒤에 모든 좋은 것이 그 위에 임할 것이라고 기록되어 있었습니다.
  alternative_readings:
  - 세대가 대대로 악을 행할 것이며 …
  - 불의와 죄가 땅에서 제거될 때 …
  rationale: 원문은 현재의 현실 진술이 아니라 기록된 예언적 전망이므로, 한국어에서도 미래·종결의 흐름을 분명히 드러내어 종말론적 긴장을 보존했습니다.
  doctrine_reference: Apocalyptic prophetic future and eschatological reversal
- issue: 천상 기록물의 수동 표현
  chosen_reading: 그들 위에 기록된 것을
  alternative_readings:
  - 그들 위에 쓰인 것을
  - 그들에 대하여 기록된 것을
  rationale: 원문 ጽሑፈ በላዕሌሆሙ는 ‘그들 위에 기록된 것’이라는 직접적 표상을 가지므로, 이를 완화하지 않고 유지했습니다.
  doctrine_reference: Heavenly record imagery in apocalyptic literature
