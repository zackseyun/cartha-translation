  - 적힌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 하늘에 기록된 계시 내용을 가리키므로 ‘기록된’이 한국어에서 가장 자연스럽고, 문서적·계시적 뉘앙스를 유지합니다.
- source_word: ትውልድ እምትውልድ
  english_pob_choice: generation after generation
  chosen_korean: 세대가 또 세대를 거슬러
  alternatives_korean:
  - 세대에서 세대로
  - 대대로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역 구조를 살리되 한국어로는 반복·연속의 의미가 드러나도록 ‘세대가 또 세대를 거슬러’로 옮겼습니다.
- source_word: ትውልደ ጽድቅ
  english_pob_choice: a generation of righteousness
  chosen_korean: 의의 세대
  alternatives_korean:
  - 의로운 세대
  - 정의의 세대
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጽድቅ는 윤리적 선함보다 언약적·도덕적 ‘의’에 가깝기 때문에 관형적 번역인 ‘의의 세대’가 원문 범위를 가장 잘 보존합니다.
- source_word: አበሳ / ኀጢአት
  english_pob_choice: iniquity / sin
  chosen_korean: 불의 / 죄
  alternatives_korean:
  - 죄악 / 죄
  - 불법 / 죄
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 명사가 병렬로 나오므로 의미 구분을 살려 አበሳ는 ‘불의’, ኀጢአት는 ‘죄’로 옮겨 중복을 피했습니다.
theological_decisions:
- issue: 종말론적 계시의 미래형 서술
  chosen_reading: 세대가 또 세대를 거슬러 범죄할 것이며 … 불의가 사라지며 죄가 땅에서 없어진 뒤에 모든 좋은 것이 그 위에 임할 것이라고 기록되어 있었습니다.
  alternative_readings:
  - 세대가 대대로 악을 행할 것이며 …
  - 불의와 죄가 땅에서 제거될 때 …
  rationale: 원문은 현재의 현실 진술이 아니라 기록된 예언적 전망이므로, 한국어에서도 미래·종결의 흐름을 분명히 드러내어 종말론적 긴장을 보존했습니다.
  doctrine_reference: Apocalyptic prophetic future and eschatological reversal
- issue: 천상 기록물의 수동 표현
  chosen_reading: 그들 위에 기록된 것을
  alternative_readings:
  - 그들 위에 쓰인 것을
  - 그들에 대하여 기록된 것을
  rationale: 원문 ጽሑፈ በላዕሌሆሙ는 ‘그들 위에 기록된 것’이라는 직접적 표상을 가지므로, 이를 완화하지 않고 유지했습니다.
  doctrine_reference: Heavenly record imagery in apocalyptic literature
