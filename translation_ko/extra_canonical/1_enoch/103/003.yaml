base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/003.yaml
  text: For every good thing and joy and glory have been prepared and written down for the spirits of those who died in righteousness[a]; and much good will be given to you as the fruit of your labor[c][b], and your portion will abound beyond the portion of the living.
  footnotes:
  - marker: a
    text: Or 'recorded.' The wording may evoke a heavenly written register of the reward kept for the righteous dead.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the fruit of your labor.' The image preserves the idea of toil yielding a future harvest.
    reason: lexical_alternative
  - marker: c
    text: Or 'your share will exceed the share of the living.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 선한 것과 기쁨과 영광은, 의롭게 죽은 이들의 영들을 위해 이미 마련되어 기록되어 있습니다[a]. 그리고 많은 선한 것이 여러분에게, 곧 여러분의 수고의 열매로서[b], 주어질 것이며, 여러분의 몫은 살아 있는 이들의 몫보다 더욱 넘칠 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기록되어 있습니다.’ 본문은 의로운 죽은 이들을 위한 하늘의 기록을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분의 수고의 열매.’ 농경적 이미지를 유지하여, 수고가 장차 열매를 맺는다는 뜻을 살립니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여러분의 몫은 살아 있는 이들의 몫을 능가할 것입니다.’ 비교의 강도를 다소 직설적으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሉ ሠናይ
  english_pob_choice: every good thing
  chosen_korean: 모든 선한 것
  alternatives_korean:
  - 모든 좋은 것
  - 모든 복된 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘선한 것’은 포괄적이면서도 도덕적·선물적 의미를 함께 담아, 단순한 ‘좋은 것’보다 본문의 보상 언어에 더 가깝습니다.
- source_word: ፍሥሓ ወክብር
  english_pob_choice: joy and glory
  chosen_korean: 기쁨과 영광
  alternatives_korean:
  - 즐거움과 영광
  - 환희와 영광
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보상의 삼중항을 자연스럽게 살리면서도, ‘영광’은 종말론적 보상 어휘로 충분히 강하게 유지됩니다.
- source_word: ተደለወ ወተጽሕፈ
  english_pob_choice: have been prepared and written down
  chosen_korean: 이미 마련되어 기록되어 있습니다
  alternatives_korean:
  - 준비되어 적혀 있습니다
  - 예비되고 기록되어 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘마련되다’와 ‘기록되다’는 준비와 천상 기록의 이중 이미지를 모두 보존하며, ‘이미’로 완료성을 분명히 드러냅니다.
- source_word: ተክለ ጻማክሙ
  english_pob_choice: as the fruit of your labor
  chosen_korean: 여러분의 수고의 열매로서
  alternatives_korean:
  - 여러분의 노동의 열매로서
  - 여러분의 수고의 결과로서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘열매’는 농경적 은유를 살리고, ‘수고’는 ጻማ의 땀 흘림의 뉘앙스를 자연스럽게 옮깁니다. ‘-로서’는 POB의 해석을 따라 보상의 성격을 표시합니다.
- source_word: ክፍልክሙ ፈድፋደ እም ክፍለ ሕያዋን
  english_pob_choice: your portion will abound beyond the portion of the living
  chosen_korean: 여러분의 몫은 살아 있는 이들의 몫보다 더욱 넘칠 것입니다
  alternatives_korean:
  - 여러분의 분깃은 살아 있는 자들의 분깃보다 더 클 것입니다
  - 여러분의 몫은 살아 있는 이들의 몫을 넘어서 풍성할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘몫’은 분깃/할당의 의미를 무리 없이 담고, 비교구는 직설적으로 옮겨 초월적 풍성함을 분명히 합니다.
theological_decisions:
- issue: ‘기록되다’의 천상 장부 암시를 얼마나 명시적으로 드러낼지
  chosen_reading: ‘기록되어 있습니다’로 두어, 천상적 기록의 이미지를 암시하되 본문이 말하는 범위를 넘는 ‘하늘의 책들’ 같은 설명은 본문 밖으로 확장하지 않았습니다.
  alternative_readings:
  - 하늘에 기록되어 있습니다
  - 천상 장부에 적혀 있습니다
  rationale: 게즈어 본문은 분명한 기록 이미지를 주지만, 구체적 장부의 형태까지 단정하지는 않으므로, 암시를 살리되 해석을 절제하는 쪽을 택했습니다.
  doctrine_reference: 본문 충실성 우선; 해석적 확장 자제
- issue: ‘여러분의 수고의 열매로서’의 관계 표현
  chosen_reading: 보상의 일부를 단순 병렬로 나열하기보다, 열매가 곧 주어질 선의 성격을 규정하는 방식으로 ‘-로서’를 사용했습니다.
  alternative_readings:
  - 여러분의 수고의 열매가 될 것입니다
  - 여러분의 수고의 결과입니다
  rationale: 최신 개정에서 제거된 appositive 해석을 다시 반영해, መን차적 보상 설명이 아니라 수고의 열매가 보상의 양상임을 드러냈습니다.
  doctrine_reference: 문법적 관계와 비유적 이미지 보존
