  source_fidelity: 원문은 영들이 어둠·그물·타오르는 불 및 큰 심판으로 들어가는 모습을 연속된 방향 표현으로 묘사합니다. 초안의 ‘큰 심판은 모든 세대의 영원에 속한 것입니다’는 ለ(‘~에게/~을 위하여, ~에 걸쳐’)를 ‘속하다’로 처리하여 문맥과 문법적 관계를 바꾸므로 수정이 필요합니다. ዓለም은 ‘세상/시대/영원’의 의미 범위를 가질 수 있으므로 본문에서는 장엄한 표현을 유지하고 주석에서 범위를 밝혔습니다.
  naturalness: ‘큰 심판으로 들어갈 것입니다’와 이어지는 ‘큰 심판은 … 속한 것입니다’는 한국어에서 부자연스럽고, 문장 끝맺음도 ‘것이며/것입니다’가 혼재합니다. 방향 병렬을 ‘… 속으로, 또 큰 심판 속으로 들어가게 될 것입니다’로 정리하고, 전체를 현대적 합쇼체로 통일했습니다.
  terminology: ‘영’, ‘큰 심판’, ‘평강’은 본문의 종말론적·성경적 어휘를 과도한 교리화 없이 보존합니다. መርበብት는 포획 도상에 충실하게 ‘그물’로 유지했습니다. ‘영원의 모든 세대’는 다소 낯설지만 원문의 난해하고 확장적인 표현을 보존하며, 주석으로 ‘세상/시대’의 가능성을 함께 제시합니다.
