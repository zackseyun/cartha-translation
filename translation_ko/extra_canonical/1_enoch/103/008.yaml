base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/008.yaml
  text: And into darkness and into a snare and into a blazing fire your spirits shall enter[a], into the great judgment; and the great judgment shall be for all the generations of eternity. Woe to you[e][d][c][b], for you have no peace.
  footnotes:
  - marker: a
    text: Or 'into snares' for 'into nets'; the Ge'ez term evokes trapping imagery and may be metaphorical for inescapable judgment.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'for all the generations of eternity' is difficult but likely emphasizes the enduring scope and memory of this judgment rather than merely a momentary sentence.
    reason: cultural_note
  - marker: c
    text: Some translators take 'to the great judgment' instead of 'for the great judgment.' The Ge'ez preposition can be understood directionally.
    reason: alternative_reading
  - marker: d
    text: Or 'into nets and into a blazing fire your spirits'.
    reason: previous_rendering
  - marker: e
    text: Or 'shall enter, for the great judgment'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희 영은 어둠과 그물과 타오르는 불 속으로, 또 큰 심판 속으로 들어가게 될 것입니다. 그 큰 심판은 영원의 모든 세대에게 미칠 것입니다.[a] 너희에게 화가 있습니다. 너희에게는 평강이 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘세상/영원의 모든 세대에게’입니다. 게에즈어 ‘알람’은 문맥에 따라 세상, 시대, 또는 영원을 가리킬 수 있으므로, 여기서는 심판의 광범위하고 지속적인 범위를 나타내는 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በጽልመት
  english_pob_choice: into darkness
  chosen_korean: 어둠 속으로
  alternatives_korean:
  - 어둠으로
  - 그 어둠 속으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 방향성을 가진 전치사구이므로 단순한 상태보다 ‘속으로’가 이동 이미지를 살립니다.
- source_word: በመርበብት
  english_pob_choice: into a snare / into a net
  chosen_korean: 그물 속으로
  alternatives_korean:
  - 덫 속으로
  - 함정 속으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 찰스 본문과 영어 주석이 보여 주는 포획 이미지에 맞추어, 한국어에서도 구체적인 ‘그물’을 택했습니다.
- source_word: በላህብ ዘይነድድ
  english_pob_choice: into a blazing fire
  chosen_korean: 타오르는 불 속으로
  alternatives_korean:
  - 활활 타는 불 속으로
  - 불꽃 속으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘타오르다’로 불의 강한 심판성을 살리되, 과도한 의역 없이 화염의 이미지를 유지했습니다.
- source_word: ኀበ ኵነኔ ዐባይ
  english_pob_choice: into the great judgment
  chosen_korean: 큰 심판으로
  alternatives_korean:
  - 큰 심판 속으로
  - 큰 심판에 이르러
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 회개나 구원의 심판이 아니라 종말론적 판결을 가리키므로 ‘심판’이 가장 직접적입니다. 영어 주석의 방향성을 따라 ‘으로’를 사용했습니다.
- source_word: መንፈስክሙ
  english_pob_choice: your spirits
  chosen_korean: 너희 영
  alternatives_korean:
  - 너희 영혼
  - 너희들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영적 실재를 직접 가리키는 표현이므로 ‘영’으로 옮기고, 복수 소유를 한국어 화법상 자연스럽게 풀었습니다.
- source_word: ኵነኔ ዐባይ
  english_pob_choice: the great judgment
  chosen_korean: 큰 심판
  alternatives_korean:
  - 거대한 심판
  - 위대한 심판
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘great’의 크기보다 위엄과 중대성을 드러내는 apocalyptic 관용을 따라 ‘큰 심판’으로 간결하게 옮겼습니다.
- source_word: ኴሌ ለክሙ
  english_pob_choice: Woe to you
  chosen_korean: 너희에게 화가 있습니다
  alternatives_korean:
  - 너희에게 화가 있을 것입니다
  - 슬프다, 너희여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언적 경고문을 현대 한국어에서 자연스럽고도 강하게 전달하는 정형 표현으로 처리했습니다.
- source_word: እስመ አልብክሙ ሰላመ
  english_pob_choice: for you have no peace
  chosen_korean: 너희에게는 평강이 없기 때문입니다
  alternatives_korean:
  - 너희에게 평강이 없기 때문입니다
  - 너희는 평강이 없습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문장 말미의 이유절을 분명히 하고, POB의 ‘peace’를 성경적 뉘앙스가 있는 ‘평강’으로 유지했습니다.
theological_decisions:
- issue: ‘영’의 범위와 인간 구성 이해
  chosen_reading: ‘너희 영’으로 직역해 본문이 명시하는 표현을 보존했습니다.
  alternative_readings:
  - 너희 영혼
  - 너희 자신
  rationale: 이 본문은 영혼론을 해설하기보다 심판 이미지 안에서 ‘영’이 들어간다고 진술합니다. 따라서 더 넓은 인간학적 결론을 덧붙이지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 해석을 확정하지 않음.
- issue: ‘심판’의 성격
  chosen_reading: ‘큰 심판’으로 옮겨 판결과 집행의 폭을 함께 살렸습니다.
  alternative_readings:
  - 큰 정죄
  - 큰 선고
  rationale: 문맥은 분명히 형벌적이지만, ‘심판’이 그 법정적 폭을 가장 온전히 보존하며 신학적 결론을 지나치게 좁히지 않습니다.
  doctrine_reference: 원문 우선, 종말론적 법정 이미지 보존.
