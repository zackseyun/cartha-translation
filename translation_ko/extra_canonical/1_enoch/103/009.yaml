base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
  footnotes:
  - marker: a
    text: The underlying wording around 'our affliction ... we toiled hard' is textually difficult in the OCR witness; the sense is a complaint of severe hardship and labor.
    reason: textual_variant
  - marker: b
    text: Literally, 'our spirit became small,' an idiom of inward diminishment that may imply discouragement, weakness, or loss of courage.
    reason: lexical_alternative
  - marker: c
    text: Or 'Do not say of the righteous and the good who are in life:'.
    reason: previous_rendering
  - marker: d
    text: Or 'and we were brought to ruin'.
    reason: previous_rendering
translation:
  language: ko
  text: 살아 있는 의인들과 선한 이들이여, 「우리의 환난의 날들에 우리는 수고하였고, 모든 고난을 보았으며, 많은 악을 만났고, 압제당하고 수가 줄어들었으며, 우리의 영이 작아졌다」라고 말하지 마십시오.[a][c][d][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리의 환난의 날들에 우리가 수고하였다’에 해당하는 원문의 표현은 OCR 전승에서 다소 난해합니다. 전체적으로는 심한 고난과 수고에 대한 탄식이라는 뜻입니다.
    reason: textual_variant
  - marker: b
    text: ‘우리의 영이 작아졌다’는 문자적인 표현입니다. 내적인 위축, 낙심, 기력의 저하를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘살아 있는 의인들과 선한 이들에 대하여, …라고 말하지 마십시오’로 읽을 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘우리가 멸망에 이르렀다’로 옮길 수 있습니다.
    reason: previous_rendering
