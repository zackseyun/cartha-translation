base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
  footnotes:
  - marker: a
    text: The underlying wording around 'our affliction ... we toiled hard' is textually difficult in the OCR witness; the sense is a complaint of severe hardship and labor.
    reason: textual_variant
  - marker: b
    text: Literally, 'our spirit became small,' an idiom of inward diminishment that may imply discouragement, weakness, or loss of courage.
    reason: lexical_alternative
  - marker: c
    text: Or 'Do not say of the righteous and the good who are in life:'.
    reason: previous_rendering
  - marker: d
    text: Or 'and we were brought to ruin'.
    reason: previous_rendering
translation:
  language: ko
  text: 「우리의 환난의 날들에 우리는 수고하였고, 모든 고난을 보았으며, 많은 악을 만났고, 압제당하며 수가 적어졌으며, 우리의 영은 작아졌다고」 너희는 말하지 마십시오.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘우리의 환난의 날들’ 같은 구절이 이어지며 OCR 전승이 다소 어려워, 전체적으로는 극심한 고난과 노동의 탄식을 뜻합니다.
    reason: textual_variant
  - marker: b
    text: ‘우리의 영은 작아졌다’는 말은 문자적으로는 ‘작아지다’지만, 내적 낙심과 기력 저하를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘살아 있는 의인들과 선한 이들에 대해 말하지 마십시오’로도 읽을 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘우리가 압제당하였다’보다 ‘우리가 짓눌렸다’는 느낌으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትበልዎሙ
  english_pob_choice: Do not say of them
  chosen_korean: 너희는 말하지 마십시오
  alternatives_korean:
  - 그들에 대해 말하지 마십시오
  - 그들을 두고 말하지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수 금지 명령으로 이해해 현대 한국어에서는 직접적이고 자연스럽게 ‘말하지 마십시오’로 옮겼습니다.
- source_word: ለጻድቃን ወኄራን
  english_pob_choice: the righteous and the good
  chosen_korean: 의인들과 선한 이들
  alternatives_korean:
  - 의인들과 좋은 이들
  - 의로운 자들과 선한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 짝을 이루는 윤리적 표현을 살려 ‘의인’과 ‘선한 이들’로 옮겼습니다. ‘좋은’보다 인격적·도덕적 성격이 분명합니다.
- source_word: በመዋዕለ ... ወውኅድነ ወንእስት መንፈስነ
  english_pob_choice: in the days of our affliction ... and our spirit became small
  chosen_korean: 우리의 환난의 날들에 ... 우리의 영은 작아졌다고
  alternatives_korean:
  - 우리 고난의 날들에 ... 우리의 영은 약해졌다고
  - 우리의 고통의 때에 ... 우리의 영은 작아졌다고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘날들에’는 원문의 시간구를 살리고, ‘영은 작아졌다’는 말은 내면의 위축을 드러내는 관용을 직역에 가깝게 보존합니다.
- source_word: ወተወጻዕነ
  english_pob_choice: and we were oppressed
  chosen_korean: 압제당하며
  alternatives_korean:
  - 억압당하며
  - 학대당하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 재검토된 영어 주석처럼 이 동사는 ‘멸망’보다 ‘압제/억압’의 뜻이 더 분명하므로, 수동적 피해를 드러내는 ‘압제당하며’로 옮겼습니다.
theological_decisions:
- issue: ‘영이 작아졌다’의 의미 범위
  chosen_reading: 낙심과 내적 위축을 포함하되, 원문의 비유를 평이하게 풀지 않고 그대로 유지합니다.
  alternative_readings:
  - 우리의 마음이 약해졌다고
  - 우리가 기운을 잃었다고
  rationale: 이 구절은 단순한 심리 진술이 아니라 고난이 사람을 안으로 줄어들게 하는 이미지를 담고 있으므로, 해석을 과도하게 좁히지 않았습니다.
  doctrine_reference: 본절의 수사적 이미지 보존
- issue: ‘의인들과 선한 이들’의 대상성
  chosen_reading: 현재 살아 있는 의인들을 향해 하는 금지 발화로 이해합니다.
  alternative_readings:
  - 의인들에 관해 말하지 말라는 뜻
  - 살아 있는 의인들에 대하여 말하지 말라는 뜻
  rationale: 문맥상 고난 가운데 있는 의인들의 탄식을 인용하는 구절이므로, 대상이 아니라 발화 내용에 대한 금지로 읽는 편이 자연스럽습니다.
  doctrine_reference: 문맥 우선의 국지적 번역
