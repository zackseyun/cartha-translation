revisions:
- from: 그리고 여러분의 영은 의 가운데서 살 것입니다[a]. 그리고 여러분, 곧 의 가운데서 죽은 여러분은 기뻐하고 즐거워할 것이며, 그들의 영은 멸망하지 않을 것이고, 그들의 기억은 위대한 분의 얼굴 앞에 영원의 모든 세대 동안 있을 것입니다[b]. 이제 그들의 수치를 두려워하지 마십시오[c].
  to: 의 안에서 죽은 여러분의 영은 살 것이며[a], 그들은 기뻐하고 즐거워할 것입니다. 그들의 영은 멸망하지 않을 것이고, 그들의 기억은 위대한 분의 얼굴 앞에[b] 영원의 모든 세대에 걸쳐 있을 것입니다. 이제 그들의 수치를 두려워하지 마십시오[c].
  rationale: 첫 구절에서 ‘의 안에서 죽은’이 수신자/그들의 영을 한정하도록 어순을 바로잡았습니다. 이는 원문의 핵심 수식 관계를 회복하면서도 ‘의’라는 용어를 보존합니다. 기쁨의 주어는 원문의 전환을 과도하게 해석하지 않고 ‘그들’로 남겼고, 이어지는 ‘그들의 영’도 그대로 유지했습니다. ‘영원의 모든 세대에 걸쳐’는 ዓለም의 이 문맥상 시간적 의미와 영어 POB 감사 이력을 반영합니다.
  reviewer_model: gpt-5.6-terra
