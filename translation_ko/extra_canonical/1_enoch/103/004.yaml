theological_decisions:
- issue: 종말론적 보상으로서 영의 지속과 공동체적 위로
  chosen_reading: ‘영’의 생존을 실제적인 사후 지속의 약속으로 읽고, ‘살 것입니다’와 ‘멸망하지 않을 것입니다’를 병행해 위로의 강도를 살렸습니다.
  alternative_readings:
  - 영혼의 불멸로 정리
  - 상징적 명예 회복으로 완화
  rationale: 본문은 의인들의 죽음 이후의 지속과 기억을 함께 말하므로, 이를 단순한 상징이나 일반적 명예 회복으로 약화하지 않는 것이 더 소스 충실적입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘위대한 분’의 신칭 유지
  chosen_reading: 하나님이라는 일반 명사로 풀지 않고 ‘위대한 분’으로 남겼습니다.
  alternative_readings:
  - 하나님
  - 위대하신 하나님
  rationale: 에녹 문헌의 특유한 묵시적 존칭을 보존하고, 원문이 직접적으로 일반명사를 쓰지 않는 점을 반영하기 위해서입니다.
  doctrine_reference: Original-language primacy over translation tradition.
