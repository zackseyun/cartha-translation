base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
  footnotes:
  - marker: a
    text: Or 'you who died in righteousness.' The Ge'ez construction may directly address the righteous dead rather than appositionally describe 'your spirit.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'before the face of the Great One,' a standard presence formula in exalted or heavenly-court language.
    reason: cultural_note
  - marker: c
    text: Or 'do not fear their reproach/disgrace.' The final noun can denote humiliation or public shame.
    reason: lexical_alternative
  - marker: d
    text: Or 'your spirit will live—those of you whose death was in righteousness'.
    reason: previous_rendering
  - marker: e
    text: Or 'generations of the world'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 여러분의 영은 의 가운데서 살 것입니다[a]. 그리고 여러분, 곧 의 가운데서 죽은 여러분은 기뻐하고 즐거워할 것이며, 그들의 영은 멸망하지 않을 것이고, 그들의 기억은 위대한 분의 얼굴 앞에 영원의 모든 세대 동안 있을 것입니다[b]. 이제 그들의 수치를 두려워하지 마십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의 가운데서 죽은 여러분’으로도 옮길 수 있습니다. 게에즈 문장은 ‘여러분의 영’에 직접 이어질 수도 있고, 수신자 자체를 설명하는 구문일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘위대한 분의 얼굴 앞에’입니다. 이는 신적 현존을 나타내는 전형적인 묵시문학적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들의 모욕/굴욕을 두려워하지 마십시오.’ 마지막 명사는 공개적 수치나 굴욕을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: የሐይዉ
  english_pob_choice: will live
  chosen_korean: 살 것입니다
  alternatives_korean:
  - 살아 있을 것입니다
  - 생명 가운데 있을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 미래의 생존/존속을 자연스럽게 풀면서도, 단순한 비유적 ‘존재’보다 강한 생명 지속의 의미를 살렸습니다.
- source_word: መንፈስክሙ
  english_pob_choice: your spirit
  chosen_korean: 여러분의 영
  alternatives_korean:
  - 여러분의 혼
  - 여러분의 숨
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: መንፈስ은 이 구절의 종말론적 인류학을 고려해 ‘영’으로 옮기는 것이 가장 직접적입니다.
- source_word: በጽድቅ
  english_pob_choice: in righteousness
  chosen_korean: 의 가운데서
  alternatives_korean:
  - 의 안에서
  - 의로움 가운데서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘의’라는 핵심 명사를 유지하면서, 죽음과 삶 전체가 그 영역 안에 놓인다는 뜻을 한국어로 자연스럽게 드러내기 위해 ‘가운데서’를 택했습니다.
- source_word: እምቅ ድመ ገጸ ለዐቢይ
  english_pob_choice: before the face of the Great One
  chosen_korean: 위대한 분의 얼굴 앞에
  alternatives_korean:
  - 위대한 분 앞에
  - 위대한 분의 임재 앞에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘얼굴 앞에’라는 표준적 현존 관용을 살리되, 에녹 문헌의 궁정적·묵시적 표현을 유지하기 위해 ‘위대한 분’을 보존했습니다.
- source_word: ኢትፍርህዎ ለኀሣሮሙ
  english_pob_choice: do not fear their humiliation
  chosen_korean: 그들의 수치를 두려워하지 마십시오
  alternatives_korean:
  - 그들의 굴욕을 두려워하지 마십시오
  - 그들의 모욕을 두려워하지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ኀሣር는 문맥상 공개적 수치와 굴욕을 가리킬 수 있어, 한국어 성경 문체에서 가장 직접적인 ‘수치’로 옮겼습니다.
theological_decisions:
- issue: 종말론적 보상으로서 영의 지속과 공동체적 위로
  chosen_reading: ‘영’의 생존을 실제적인 사후 지속의 약속으로 읽고, ‘살 것입니다’와 ‘멸망하지 않을 것입니다’를 병행해 위로의 강도를 살렸습니다.
  alternative_readings:
  - 영혼의 불멸로 정리
  - 상징적 명예 회복으로 완화
  rationale: 본문은 의인들의 죽음 이후의 지속과 기억을 함께 말하므로, 이를 단순한 상징이나 일반적 명예 회복으로 약화하지 않는 것이 더 소스 충실적입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘위대한 분’의 신칭 유지
  chosen_reading: 하나님이라는 일반 명사로 풀지 않고 ‘위대한 분’으로 남겼습니다.
  alternative_readings:
  - 하나님
  - 위대하신 하나님
  rationale: 에녹 문헌의 특유한 묵시적 존칭을 보존하고, 원문이 직접적으로 일반명사를 쓰지 않는 점을 반영하기 위해서입니다.
  doctrine_reference: Original-language primacy over translation tradition.
