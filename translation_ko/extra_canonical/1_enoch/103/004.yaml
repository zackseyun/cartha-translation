base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
  footnotes:
  - marker: a
    text: Or 'you who died in righteousness.' The Ge'ez construction may directly address the righteous dead rather than appositionally describe 'your spirit.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'before the face of the Great One,' a standard presence formula in exalted or heavenly-court language.
    reason: cultural_note
  - marker: c
    text: Or 'do not fear their reproach/disgrace.' The final noun can denote humiliation or public shame.
    reason: lexical_alternative
  - marker: d
    text: Or 'your spirit will live—those of you whose death was in righteousness'.
    reason: previous_rendering
  - marker: e
    text: Or 'generations of the world'.
    reason: previous_rendering
translation:
  language: ko
  text: 의 안에서 죽은 여러분의 영은 살 것이며[a], 그들은 기뻐하고 즐거워할 것입니다. 그들의 영은 멸망하지 않을 것이고, 그들의 기억은 위대한 분의 얼굴 앞에[b] 영원의 모든 세대에 걸쳐 있을 것입니다. 이제 그들의 수치를 두려워하지 마십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 영은 살 것입니다, 의 안에서 죽은 여러분이여’로도 이해할 수 있습니다. 게에즈 구문은 ‘의 안에서 죽은’이 ‘여러분의 영’을 수식하는 것으로도, 수신자에게 직접 부르는 말로도 분석될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘위대한 분의 얼굴 앞에’입니다. 이는 신적 현존을 나타내는 전형적인 묵시문학적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그들의 모욕’ 또는 ‘그들의 굴욕’으로 옮길 수 있습니다. 마지막 명사는 공개적 수치나 굴욕을 뜻할 수 있습니다.
    reason: lexical_alternative
