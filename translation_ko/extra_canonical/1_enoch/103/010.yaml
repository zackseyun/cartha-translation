base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
  footnotes:
  - marker: a
    text: Or 'we perished' / 'we were brought to ruin' for the repeated verb rendered 'we were destroyed.'
    reason: lexical_alternative
  - marker: b
    text: '''With a word'' likely means that no one came to their aid even by speech, plea, or advocacy.'
    reason: cultural_note
  - marker: c
    text: The clause 'and we found nothing' is textually and syntactically difficult; the sense may be 'nor did we obtain anything' or 'in no way did we find relief.'
    reason: textual_variant
translation:
  language: ko
  text: 우리는 멸망하였고, 우리를 도와줄 이가 한마디도 없었으며, 아무것도 얻지 못하였습니다. 우리는 고통을 당하고 멸망하였으며, 날마다 생명을 볼 희망도 없었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸망하였고’는 ‘우리가 멸망하였다’, ‘우리가 파멸하였다’, ‘우리가 무너졌다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘한마디도’는 말로 된 도움이나 변호조차 없었다는 뜻을 살린 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘아무것도 얻지 못하였습니다’는 본문의 난해한 구절을, 얻은 것·구제·완화가 전혀 없었다는 뜻으로 옮긴 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕልነ
  english_pob_choice: we were destroyed
  chosen_korean: 우리는 멸망하였고
  alternatives_korean:
  - 우리는 파멸하였고
  - 우리는 무너졌고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 동사를 강하게 살리되, 한국어에서는 ‘멸망하다’가 파멸·파괴의 중첩된 비극성을 가장 자연스럽게 드러냅니다.
- source_word: በነገር
  english_pob_choice: with a word
  chosen_korean: 한마디도
  alternatives_korean:
  - 말 한마디로
  - 말로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 이미지를 유지하면서도 한국어에서 ‘한마디도’가 말로 된 도움이나 중재의 부재를 가장 간결하게 드러냅니다.
- source_word: ወኢበምንትኒ ኢረከብነ
  english_pob_choice: and we found nothing
  chosen_korean: 아무것도 얻지 못하였습니다
  alternatives_korean:
  - 아무것도 찾지 못하였습니다
  - 아무것도 발견하지 못하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 단순한 ‘찾다’보다 구제나 유익의 ‘획득’ 부재를 포함하는 ‘얻다’가 비탄의 의미를 더 잘 전달합니다.
- source_word: ተጸዐርነ
  english_pob_choice: we were tormented
  chosen_korean: 우리는 고통을 당하고
  alternatives_korean:
  - 우리는 괴로움을 겪고
  - 우리는 학대를 당하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원어의 압박·고통의 폭넓은 의미를 보존하면서도, 한국어에서는 ‘고통을 당하다’가 문맥에 자연스럽고 지나친 해석을 피합니다.
- source_word: ኢተስፈውነ
  english_pob_choice: we had no hope
  chosen_korean: 희망도 없었습니다
  alternatives_korean:
  - 바랄 희망도 없었습니다
  - 소망도 없었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 ‘hope’에 맞추되, 현대 한국어에서 자연스러운 ‘희망’으로 옮겨 절망의 상태를 분명히 합니다.
- source_word: ከመ ንርአይ ሕይወተ ዕለት እምዕለት
  english_pob_choice: of seeing life from day to day
  chosen_korean: 날마다 생명을 볼
  alternatives_korean:
  - 날마다 삶을 볼
  - 하루하루 생명을 보게 될
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘from day to day’의 반복성과 생존의 지속성을 살리면서, ‘생명’을 유지해 다음 날을 볼 수 있는 상태를 표현합니다.
theological_decisions:
- issue: 반복되는 멸망 표현을 약화시키지 않을지
  chosen_reading: ‘멸망하였고 … 멸망하였으며’로 반복을 유지했습니다.
  alternative_readings:
  - 한 번만 ‘멸망’으로 묶어 완화하기
  - ‘고난받았다’ 정도로 일반화하기
  rationale: 본문은 절망의 수사를 반복으로 강화하므로, 그 반복을 유지해야 애가(哀歌)의 급박성과 비극성이 보존됩니다.
  doctrine_reference: 'Translation philosophy: preserve significant repetition and apocalyptic lament force.'
