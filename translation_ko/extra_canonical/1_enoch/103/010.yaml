base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
  footnotes:
  - marker: a
    text: Or 'we perished' / 'we were brought to ruin' for the repeated verb rendered 'we were destroyed.'
    reason: lexical_alternative
  - marker: b
    text: '''With a word'' likely means that no one came to their aid even by speech, plea, or advocacy.'
    reason: cultural_note
  - marker: c
    text: The clause 'and we found nothing' is textually and syntactically difficult; the sense may be 'nor did we obtain anything' or 'in no way did we find relief.'
    reason: textual_variant
translation:
  language: ko
  text: 우리는 멸망하였고[a], 말 한마디로라도 우리를 도와줄 이는 없었으며[b], 아무것도 얻지 못하였습니다[c]. 우리는 고통을 당하고 멸망하였으며[a], 날마다 생명을 보게 될 희망도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸망하였고’는 ‘우리가 멸망하였다’, ‘우리가 파멸하였다’, ‘우리가 무너졌다’로도 옮길 수 있습니다. 이 동사는 본문에서 두 번 반복됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘말 한마디로라도’는 말로 된 도움이나 변호조차 없었다는 뜻을 살린 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘아무것도 얻지 못하였습니다’는 본문의 난해한 구절을, 얻은 것·구제·완화가 전혀 없었다는 뜻으로 옮긴 것입니다.
    reason: textual_variant
