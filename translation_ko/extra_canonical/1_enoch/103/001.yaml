base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/001.yaml
  text: And now I know this mystery for you[a], O righteous ones, by the glory of the Great and Honored and Mighty One in dominion[c][b], and by his greatness I know it for you.
  footnotes:
  - marker: a
    text: The Ge'ez wording is compressed and somewhat difficult. The repeated verb may mean simply 'I know' or more specifically 'I know this revealed mystery.'
    reason: lexical_alternative
  - marker: b
    text: '''Kingdom'' may also be understood as ''dominion'' or ''reign.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'of the Great One, and the honorable and mighty kingdom, and in greatness'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 나는 의인들이여, 그대들을 위하여 이 비밀을 압니다.[a] 위대하고 존귀하며 권세가 크신 분의 영광으로,[b][c] 또 그분의 위대하심으로 나는 그것을 그대들을 위하여 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 압축적이며 다소 어렵습니다. 반복되는 동사는 단순히 ‘알다’로도, ‘드러난 이 비밀을 알다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: መንግሥት는 ‘나라’ 외에 ‘통치’ 또는 ‘지배권’이라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 압축된 표현은 달리 ‘위대한 분과 존귀하고 권세 있는 통치’로 분석될 여지도 있습니다. 여기서는 위대함·존귀함·권세가 한 분을 수식하는 것으로 옮겼습니다.
    reason: previous_rendering
