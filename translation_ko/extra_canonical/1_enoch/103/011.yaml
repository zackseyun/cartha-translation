base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/011.yaml
  text: We hoped to become the head[a], and we became the tail; we toiled, but we did not gain mastery over our labor; and we became food for sinners and for the lawless[c][b], and they laid their yoke heavily upon us.
  footnotes:
  - marker: a
    text: Or 'we labored, but it did not come about,' or 'we labored, but it was not accomplished.' The middle clause is textually and syntactically difficult in the Ethiopic witness.
    reason: lexical_alternative
  - marker: b
    text: '''Food'' is a concrete metaphor; the sense is that they became prey to sinners and the lawless.'
    reason: lexical_alternative
  - marker: c
    text: Or 'we toiled, and it was not done for us, and we did not gain mastery over our wealth'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 머리가 되기를 바랐으나 꼬리가 되었고, 수고했으나 우리 수고를 지배하지 못하였으며, 죄인들과 율법 없는 자들의 먹이가 되었고, 그들은 우리 위에 자기들의 멍에를 무겁게 얹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리가 되다 / 꼬리가 되다’는 우월과 전도의 대비를 이루는 관용적 이미지입니다.
    reason: source_note
lexical_decisions:
- source_word: ንሴፎ
  english_pob_choice: we hoped
  chosen_korean: 우리는 ... 되기를 바랐으나
  alternatives_korean:
  - 우리는 ... 되기를 기대했으나
  - 우리는 ... 되기를 원했으나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 공동체의 소망과 기대를 드러내는 동사로 이해하여, 절의 탄식적 분위기에 맞게 ‘바랐으나’로 옮겼습니다.
- source_word: ንኩን ርእሰ / ወኮነ ዘነበ
  english_pob_choice: to become the head / we became the tail
  chosen_korean: 머리가 되기를 ... 꼬리가 되었고
  alternatives_korean:
  - 우두머리가 되기를 ... 뒤처지가 되었고
  - 으뜸이 되기를 ... 말단이 되었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘머리/꼬리’의 구체적 대비를 유지해 전도(顚倒)의 이미지를 살렸습니다. 사회적 설명어로 풀지 않고 원문 비유를 보존했습니다.
- source_word: ጻመውነ / እንዘ ንትጌበር
  english_pob_choice: we toiled
  chosen_korean: 수고했으나 우리 수고를 지배하지 못하였으며
  alternatives_korean:
  - 애썼으나 우리 노동의 열매를 차지하지 못하였으며
  - 일했으나 우리 수고를 제어하지 못하였으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수고의 강도를 살리면서, 뒤따르는 구절은 원문과 주석에 따라 ‘우리 수고를 지배하지 못하다’로 이해했습니다. 여기서 ‘지배하다’는 ሠለጠ 계열의 통치·장악 의미를 반영한 것입니다.
- source_word: መብልዕተ / ለኃጥኣን ወለዓማፅያን
  english_pob_choice: food for sinners and for the lawless
  chosen_korean: 죄인들과 율법 없는 자들의 먹이가 되었고
  alternatives_korean:
  - 죄인들과 불법자들의 먹이가 되었고
  - 죄인들과 악인들의 먹이가 되었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘먹이’라는 구체적 은유를 살리고, δεύτερον term은 단순한 ‘악인’보다 윤리적 결핍을 직접 드러내는 ‘율법 없는 자들’로 옮겼습니다.
- source_word: አክበዱ ላዕሌነ አርዑተ ዚአሆሙ
  english_pob_choice: they laid their yoke heavily upon us
  chosen_korean: 그들은 우리 위에 자기들의 멍에를 무겁게 얹었습니다
  alternatives_korean:
  - 그들은 우리 위에 자기들의 멍에를 무겁게 지웠습니다
  - 그들은 우리에게 무거운 멍에를 씌웠습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘멍에’의 압제 이미지를 보존하되, 한국어에서 자연스럽고 문장성 있는 ‘무겁게 얹었습니다’를 택했습니다.
theological_decisions:
- issue: 말미의 ‘먹이’ 은유를 직설적으로 유지할지 여부
  chosen_reading: ‘먹이가 되었고’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘희생물이 되었고’
  - ‘약탈의 대상이 되었고’
  rationale: 본문은 단순한 피해 진술이 아니라, 억압받는 자들이 타인의 탐식에 내맡겨진다는 강한 비유를 사용합니다. 이를 완화하면 원문의 수치와 폭력성이 약해집니다.
  doctrine_reference: 원문 이미지 보존 원칙; 고난-압제 문맥에서 비유를 유지
