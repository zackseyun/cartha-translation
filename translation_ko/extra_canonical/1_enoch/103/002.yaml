base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/002.yaml
  text: For I know the mystery[a], and I have read the tablets of heaven, and I have seen the holy writings[c][b], and I found written in them and understood concerning them.
  footnotes:
  - marker: a
    text: Or 'the holy writing.' The Ge'ez phrase is difficult, and the exact relation between 'writing' and 'holy ones' is uncertain.
    reason: lexical_alternative
  - marker: b
    text: '''Tablets of heaven'' is an apocalyptic image for heavenly records or decrees, not necessarily physical tablets in a literalistic sense.'
    reason: cultural_note
  - marker: c
    text: Or 'the writing of the holy ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 신비를 알고 있으며, 하늘의 서판들을 읽었고, 거기에서 거룩한 기록들을 보았으며, 그 안에 기록된 것을 찾아내어 그것들에 관하여 깨달았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신비’는 단순한 비밀보다 계시로 드러난 숨은 지식을 가리키는 묵시적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 서판들’은 문자 그대로의 돌판이라기보다, 천상에 보관된 기록이나 결정의 이미지를 가리키는 묵시적 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘거룩한 기록들’은 원문의 표현이 가리키는 대상이 분명하지 않다는 점을 살려 둔 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ምሥጢረ
  english_pob_choice: the mystery
  chosen_korean: 신비
  alternatives_korean:
  - 비밀
  - 숨은 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 계시적 문맥에서 드러난 은폐된 지식을 가리키므로, 높임과 종말론적 분위기를 살리는 ‘신비’가 가장 자연스럽습니다.
- source_word: ፀፍፀፈ ሰማይ
  english_pob_choice: the tablets of heaven
  chosen_korean: 하늘의 서판들
  alternatives_korean:
  - 하늘의 돌판들
  - 하늘의 기록판들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 문서의 이미지를 살리되, 한국어에서 문서적·고대적 이미지를 주는 ‘서판들’로 옮겨 하늘의 기록을 가리키는 상징성을 보존했습니다.
- source_word: ጽሕፈተ ቅድስተ
  english_pob_choice: the holy writings
  chosen_korean: 거룩한 기록들
  alternatives_korean:
  - 거룩한 글들
  - 성스러운 글귀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석 전통과 수정 이력을 반영해 복수적 의미를 살리면서, ‘기록들’로 번역해 하늘의 문서군을 가리키는 흐름과 맞추었습니다.
- source_word: ውስቴቶሙ
  english_pob_choice: in them
  chosen_korean: 그 안에
  alternatives_korean:
  - 그들 안에
  - 그것들 안에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직전의 ‘하늘의 서판들’을 받는 지시를 한국어에서 자연스럽게 이어 주는 표현으로 옮겼습니다.
- source_word: አኩዐ በእንቲአሆሙ
  english_pob_choice: understood concerning them
  chosen_korean: 그것들에 관하여 깨달았습니다
  alternatives_korean:
  - 그것들에 대하여 이해했습니다
  - 그것들에 관해 알게 되었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 정보 습득보다 읽은 뒤의 인지적 파악을 나타내므로, ‘깨달았습니다’로 번역해 계시적 이해의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: ‘거룩한 기록들’과 ‘하늘의 서판들’의 관계
  chosen_reading: 두 표현을 서로 다른 천상 기록 이미지로 함께 살려, 구별을 평평하게 만들지 않았습니다.
  alternative_readings:
  - ‘거룩한 기록들’을 ‘서판들’의 동격으로 단순화하는 읽기
  - 하늘의 서판만을 언급하고 거룩한 기록은 생략하는 읽기
  rationale: 원문과 영어 POB의 보존하려는 긴장을 따라, 천상 문서와 거룩함의 표지를 함께 드러내어 계시적 중층성을 유지했습니다.
  doctrine_reference: 본문의 상징적·묵시적 기록 이미지를 보존
