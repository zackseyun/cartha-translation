  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석 전통과 수정 이력을 반영해 복수적 의미를 살리면서, ‘기록들’로 번역해 하늘의 문서군을 가리키는 흐름과 맞추었습니다.
