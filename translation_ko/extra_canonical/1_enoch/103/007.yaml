base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/007.yaml
  text: Know that they will bring your souls down to Sheol[e][d][c][b][a], and their recompense will be evil and great.
  footnotes:
  - marker: a
    text: Or 'your spirits.' The Ge'ez term can denote either souls or spirits.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the realm of the dead in Jewish tradition; the text preserves that term rather than reducing it to 'grave.'
    reason: cultural_note
  - marker: c
    text: Or 'he will bring your souls down'.
    reason: previous_rendering
  - marker: d
    text: Or 'and evil shall be their recompense—great indeed.'.
    reason: previous_rendering
  - marker: e
    text: Or 'Know them, for'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 당신의 영혼을 스올로 내려보내며, 그들의 보응은 악하고 크다고 아십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 영들.’ 게에즈 어휘는 ‘영’과 ‘영혼’ 모두를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 스올은 유대 전통에서 죽은 자들의 영역을 가리키는 말로, 단순한 ‘무덤’보다 넓은 개념입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ታእምርዎሙ
  english_pob_choice: Know that
  chosen_korean: 아십시오
  alternatives_korean:
  - 알아두십시오
  - 그들을 아십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시문은 경고의 도입부이므로, 대상을 직접 목적어로 옮기기보다 내용절을 이끄는 명령형으로 자연스럽게 표현했습니다.
- source_word: ለሲኦል
  english_pob_choice: to Sheol
  chosen_korean: 스올로
  alternatives_korean:
  - 음부로
  - 무덤으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 유대 묵시문맥의 고유 개념을 보존하기 위해 ‘스올’을 유지했습니다. ‘무덤’으로 낮추면 사후 세계의 뉘앙스가 약해집니다.
- source_word: ለመናፍስቲክሙ
  english_pob_choice: your souls
  chosen_korean: 당신의 영혼을
  alternatives_korean:
  - 당신의 영을
  - 당신들의 영혼을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 사후로 내려가는 인간의 내적 존재를 가리키므로 ‘영혼’이 가장 자연스럽습니다. 다만 게에즈 어휘가 ‘영/영혼’을 모두 포괄할 수 있어 번역 여지를 남깁니다.
- source_word: ወእኩያተ ይከውና ምንዳቤሆሙ ዐቢየ
  english_pob_choice: and their recompense will be evil and great
  chosen_korean: 그들의 보응은 악하고 크다고
  alternatives_korean:
  - 그들의 보응은 악하며 매우 크다고
  - 그들의 응보는 악하고 크다고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최신 검토에 따라 ምንዳቤ는 ‘보응/응보’보다 넓게 ‘보응’으로 옮기고, ይከውና와 እኩያተ의 연결을 한국어에서는 서술적 병렬로 정리했습니다. ‘크다’는 보응의 정도를 강조합니다.
theological_decisions:
- issue: 스올을 일반 명사로 낮출지, 유대 묵시 전통의 고유 개념으로 보존할지
  chosen_reading: 스올
  alternative_readings:
  - 무덤
  - 음부
  rationale: 이 구절은 사후 세계의 판결 언어를 유지하므로, 고유 개념 ‘스올’을 보존하는 편이 원문 세계를 더 정확히 전달합니다.
  doctrine_reference: 원문 우선 원칙; 제2성전기 유대 사후관의 어휘 보존
- issue: ㅇ 게에즈의 መናፍስት를 ‘영혼’으로 옮길지 ‘영’으로 옮길지
  chosen_reading: 영혼
  alternative_readings:
  - 영
  rationale: 명시적으로 죽음의 영역으로 내려가는 주체를 가리키는 문맥이어서, 한국어에서는 ‘영혼’이 의미를 더 분명하게 드러냅니다.
  doctrine_reference: 문맥 우선의 최적 대응 번역
