  chosen_korean: 부유함
  alternatives_korean:
  - 부
  - 부요
  - 재물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ‘번영’과 짝을 이루는 물질적 풍요를 자연스럽게 드러내기 위해 ‘부유함’을 택했습니다.
- source_word: ምንዳቤ
  english_pob_choice: distress
  chosen_korean: 고난
  alternatives_korean:
  - 환난
  - 괴로움
  - 곤경
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 삶 속에서 겪는 불행과 압박을 가리키므로, 한국어에서 넓게 통하는 ‘고난’이 가장 무난합니다.
- source_word: ቀትለ
  english_pob_choice: slaughter
  chosen_korean: 학살
  alternatives_korean:
  - 살육
  - 살해
  - 죽임
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 폭력적이고 심판적인 뉘앙스를 살리기 위해 단순한 ‘죽음’보다 강한 ‘학살’을 사용했습니다.
- source_word: ስብሐት
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 존귀
  - 영예
  - 영광
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 신적 ‘영광’보다 사회적·외적 존중의 상태가 더 분명하므로 ‘명예’가 적절합니다.
- source_word: ኵነኔ / ኢትገብረ ሎሙ
  english_pob_choice: judgment was not executed against them
  chosen_korean: 그들에게 심판이 집행되지 않았습니다
  alternatives_korean:
  - 그들에게 심판이 내려지지 않았습니다
  - 그들에게 판결이 시행되지 않았습니다
  - 그들에게 심판이 이루어지지 않았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어 없는 수동적 표현을 한국어의 법정적·집행적 어감으로 옮겨, 단지 ‘심판이 없다’가 아니라 ‘집행되지 않았다’는 뜻을 살렸습니다.
theological_decisions:
- issue: ‘자기 생애 동안’의 범위가 최종 심판까지 부정하는지 여부
  chosen_reading: 이 진술은 현세의 생애 동안 심판이 집행되지 않았다는 뜻으로 제한해 옮겼습니다.
  alternative_readings:
  - 그들은 아예 심판을 받지 않았다
  - 이 구절은 단지 사회적 불평을 말한다
  rationale: 반복되는 시간 한정이 현재의 지상 생애에 초점을 두므로, 최종 심판의 가능성은 열어 둔 채 현세적 진술로 유지하는 것이 문맥에 맞습니다.
  doctrine_reference: 현세적 판단과 최종 심판을 구별함
