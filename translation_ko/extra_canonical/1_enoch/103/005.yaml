base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
  footnotes:
  - marker: a
    text: The Ge'ez clause rendered 'in your sins' is difficult in the OCR witness; the sense is that the sinners die in connection with their sinfulness.
    reason: textual_variant
  - marker: b
    text: Or 'they have lived to see all their days,' that is, they are judged fortunate because they seemed to enjoy a full span of life.
    reason: lexical_alternative
  - marker: c
    text: Or 'Woe to you, sinners, when you die'.
    reason: previous_rendering
  - marker: d
    text: Or 'in your sins'.
    reason: previous_rendering
translation:
  language: ko
  text: 화 있을진저, 죽은 죄인들아, 너희가 너희 죄의 부요함 가운데 죽을 때에, 너희와 같은 자들이 너희에 대하여 말하기를 “복되다, 이 죄인들은; 그들은 자기 모든 날을 보았구나”라고 할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽은 죄인들’은 Ge‘ez의 ምውታን ኃጥኣን을 반영한 것입니다. 영어 POB는 중복을 피하려고 ‘dead’를 완화했지만, 원문은 이미 죽은 자를 직접 지칭합니다.
    reason: source_note
  - marker: b
    text: ‘너희 죄의 부요함 가운데’는 OCR형 በብዕሲ를 교정한 읽기 በብዕለ의 의미를 따른 것입니다.
    reason: textual_variant
  - marker: c
    text: ‘복되다’는 악인들의 왜곡된 평가를 그대로 살린 아이러니한 축복 표현입니다.
    reason: theological_note
  - marker: d
    text: ‘그들은 자기 모든 날을 보았구나’는 ‘평생을 다 누렸다/끝까지 살았다’는 관용을 문자에 가깝게 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프다
  - 불행하다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언적 심판 선언의 강한 경고를 살리기 위해 ‘화 있을진저’를 택했습니다. 단순한 탄식보다 դատ판적 어조가 분명합니다.
- source_word: ምውታን ኃጥኣን
  english_pob_choice: dead sinners
  chosen_korean: 죽은 죄인들
  alternatives_korean:
  - 죽어 가는 죄인들
  - 죄인들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기록에 있는 ‘죽은’의 반복적 수식은 의도된 수사이므로 삭제하지 않았습니다. ‘죄인들’만 두면 원문의 강한 대비가 약해집니다.
- source_word: በብዕሲ ኃጢአትክሙ
  english_pob_choice: in the wealth of your sins
  chosen_korean: 너희 죄의 부요함 가운데
  alternatives_korean:
  - 너희 죄의 풍성함 가운데
  - 너희 죄의 부 가운데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 교정된 읽기 ‘부요함/부’를 반영해 단순한 ‘죄 가운데’가 아니라 죄와 결부된 풍요의 의미를 살렸습니다. 이는 다음 절의 부와 번영 비판과도 연결됩니다.
- source_word: ብፁዓን እሙንቱ
  english_pob_choice: Blessed are these
  chosen_korean: 복되다, 이 죄인들은
  alternatives_korean:
  - 복되도다, 이 죄인들은
  - 행복하다, 이 죄인들은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 악인들이 죽은 죄인들을 두고 내리는 역설적 판결을 드러내기 위해 축복어를 살렸습니다. 한국어에서는 도치된 감탄 구조로 옮겨 자연스럽게 만들었습니다.
theological_decisions:
- issue: 악인들의 발화가 사실상 축복인지 아이러니인지
  chosen_reading: 아이러니한 축복 선언으로 옮겼습니다.
  alternative_readings:
  - 단순한 칭찬
  - 장례식적 애도
  rationale: 문맥은 하나님의 ‘화’와 인간의 잘못된 가치판단을 대비합니다. 따라서 ‘복되다’를 유지하되, 그 말이 죄인들에 대한 왜곡된 평가임을 그대로 두는 편이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 종말론적 심판과 세속적 성공의 오판을 구분함
- issue: ‘너희 죄의 부요함’의 경제적 함의
  chosen_reading: 죄를 단순한 도덕 상태가 아니라 부와 결부된 번영의 표지로 드러냈습니다.
  alternative_readings:
  - 단지 죄의 정도
  - 추상적 악함
  rationale: 본 절은 죄와 재산/번영의 결합을 비판합니다. 이를 약화시키면 다음 문맥의 경제적 풍자와 종말론적 반전이 흐려집니다.
  doctrine_reference: 부와 죄의 결합에 대한 예언자적 비판
