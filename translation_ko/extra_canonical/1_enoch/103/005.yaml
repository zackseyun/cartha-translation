base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
  footnotes:
  - marker: a
    text: The Ge'ez clause rendered 'in your sins' is difficult in the OCR witness; the sense is that the sinners die in connection with their sinfulness.
    reason: textual_variant
  - marker: b
    text: Or 'they have lived to see all their days,' that is, they are judged fortunate because they seemed to enjoy a full span of life.
    reason: lexical_alternative
  - marker: c
    text: Or 'Woe to you, sinners, when you die'.
    reason: previous_rendering
  - marker: d
    text: Or 'in your sins'.
    reason: previous_rendering
translation:
  language: ko
  text: 화가 있습니다, 죽은 죄인들이여[a]. 너희가 너희 죄의 부요함 가운데[b] 죽을 때에, 너희와 같은 자들이 너희를 두고 “이 죄인들은 복이 있습니다[c]. 그들은 평생을 다 누렸습니다[d]”라고 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죽은 죄인들’은 Ge'ez ምውታን ኃጥኣን을 반영합니다. 이어지는 ‘너희가 … 죽을 때에’와의 반복은 원문에 있는 수사입니다.
    reason: source_note
  - marker: b
    text: 제공된 Ge'ez OCR 본문은 이 구절에서 판독이 어렵습니다. 여기서는 영어 POB 감사 기록이 채택한 본문 비평상 읽기 በብዕለ, 곧 ‘너희 죄의 부요함/wealth of your sins’의 뜻을 따랐습니다.
    reason: textual_variant
  - marker: c
    text: ‘복이 있습니다’는 악인들이 죽은 죄인들을 두고 내리는 왜곡된 평가를 그대로 옮긴 축복 선언입니다.
    reason: theological_note
  - marker: d
    text: 직역하면 ‘그들은 자기들의 모든 날을 보았다’입니다. 평생을 다 누리거나 온전한 수명을 누렸다고 여기는 뜻의 관용적 표현일 수 있습니다.
    reason: lexical_alternative
