  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 교정된 읽기 ‘부요함/부’를 반영해 단순한 ‘죄 가운데’가 아니라 죄와 결부된 풍요의 의미를 살렸습니다. 이는 다음 절의 부와 번영 비판과도 연결됩니다.
- source_word: ብፁዓን እሙንቱ
  english_pob_choice: Blessed are these
  chosen_korean: 복되다, 이 죄인들은
  alternatives_korean:
  - 복되도다, 이 죄인들은
  - 행복하다, 이 죄인들은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 악인들이 죽은 죄인들을 두고 내리는 역설적 판결을 드러내기 위해 축복어를 살렸습니다. 한국어에서는 도치된 감탄 구조로 옮겨 자연스럽게 만들었습니다.
theological_decisions:
- issue: 악인들의 발화가 사실상 축복인지 아이러니인지
  chosen_reading: 아이러니한 축복 선언으로 옮겼습니다.
  alternative_readings:
  - 단순한 칭찬
  - 장례식적 애도
  rationale: 문맥은 하나님의 ‘화’와 인간의 잘못된 가치판단을 대비합니다. 따라서 ‘복되다’를 유지하되, 그 말이 죄인들에 대한 왜곡된 평가임을 그대로 두는 편이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 종말론적 심판과 세속적 성공의 오판을 구분함
- issue: ‘너희 죄의 부요함’의 경제적 함의
  chosen_reading: 죄를 단순한 도덕 상태가 아니라 부와 결부된 번영의 표지로 드러냈습니다.
  alternative_readings:
  - 단지 죄의 정도
  - 추상적 악함
  rationale: 본 절은 죄와 재산/번영의 결합을 비판합니다. 이를 약화시키면 다음 문맥의 경제적 풍자와 종말론적 반전이 흐려집니다.
  doctrine_reference: 부와 죄의 결합에 대한 예언자적 비판
