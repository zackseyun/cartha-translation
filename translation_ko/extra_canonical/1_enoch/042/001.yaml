  alternatives_korean:
  - 장소
  - 거처
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 위치가 아니라 ‘거주/정착’의 가능지를 찾는 문맥이므로, ‘머물 곳’이 이어지는 ‘거처’와 함께 생활 공간의 이미지를 자연스럽게 살립니다.
- source_word: ኢረከበት ኀበ ተኃድር
  english_pob_choice: found no place where she might dwell
  chosen_korean: 자신이 머물 곳을 찾지 못했고
  alternatives_korean:
  - 거할 곳을 찾지 못했고
  - 머물 자리를 얻지 못했고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부정 완료의 의미를 한국어 자연문으로 풀어, 단순한 ‘발견 실패’가 아니라 ‘거할 자리의 부재’를 분명히 드러냈습니다.
- source_word: ማኅደራ ውስተ ሰማያት
  english_pob_choice: her dwelling was in the heavens
  chosen_korean: 그 거처는 하늘들 안에 있었습니다
  alternatives_korean:
  - 그 거처는 하늘에 있었습니다
  - 그 거처는 하늘들에 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아어 복수형 ‘하늘들’을 반영해 apocalyptic한 우주적 표현을 유지했습니다. ‘안에’는 전치사의 공간적 포함감을 살리기 위한 선택입니다.
theological_decisions:
- issue: 지혜를 추상명사로만 처리할지, 의인화된 주체로 유지할지
  chosen_reading: 의인화된 주체로 유지하여 ‘지혜는…찾지 못했고’라고 옮겼습니다.
  alternative_readings:
  - 지혜를 위한 거처는 없었습니다
  - 지혜에게는 머물 곳이 없었습니다
  rationale: 원문은 지혜가 ‘찾는’ 주체로 제시되어 있으므로, 이를 추상적 진술로 평평하게 만들지 않고 지혜의 인격적·묵시문학적 성격을 보존했습니다.
  doctrine_reference: '소스 직역 원칙: 저자가 청중에게 이해시키려 한 의인화와 시적 긴장을 해소하지 말 것.'
