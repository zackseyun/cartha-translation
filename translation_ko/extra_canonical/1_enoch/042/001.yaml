  text: Wisdom found no place where she might dwell[b][a], and her dwelling was in the heavens.
  footnotes:
  - marker: a
    text: The Ethiopic uses the plural 'heavens,' a common apocalyptic way of speaking of the heavenly realm.
    reason: lexical_alternative
  - marker: b
    text: Or 'but her dwelling was'.
    reason: previous_rendering
translation:
  language: ko
  text: 지혜는 자신이 머물 곳을 찾지 못했고, 그 거처는 하늘들 안에 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어는 복수형 ‘하늘들’을 사용하며, 이는 묵시문학에서 하늘의 영역을 가리키는 흔한 방식입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그러나 그 거처는…’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ጥበብ
  english_pob_choice: Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜가 personified된 존재
  - 지혜님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 지혜를 행위 주체로 의인화하지만, 한국어에서는 고유명사화된 대문자 표기를 쓰기 어렵기 때문에 ‘지혜’로 옮기되 의인화된 서술 구조를 유지했습니다.
- source_word: መካነ
  english_pob_choice: place
