base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/001.yaml
  text: And again I saw them[a], and behold, they were butting one another and devouring one another[c][b], and the earth began to cry out.
  footnotes:
  - marker: a
    text: The verb rendered 'butting' may also be understood more generally as 'goring' or 'striking.' The animal-combat imagery is retained because this vision is cast in symbolic animal terms.
    reason: lexical_alternative
  - marker: b
    text: Or 'swallowing one another.' The underlying verb can denote engulfing as well as devouring.
    reason: lexical_alternative
  - marker: c
    text: Or 'while they were butting one another, and devouring one another, while the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다시 그들을 보았는데, 보십시오, 그들은 서로 들이받고 서로 집어삼키고 있었으며, 땅이 울부짖기 시작했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들이받고’는 여기서 보다 일반적으로 ‘들이받다/들이받아 상처 입히다’의 뜻일 수 있습니다. 동물 전투 이미지는 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집어삼키다’는 원문의 동사가 ‘삼키다, 집어삼키다’까지 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 대안적으로는 ‘서로 들이받고 서로 집어삼키고 있는 동안, 땅이…’처럼 연결할 수도 있습니다.
    reason: previous_rendering
