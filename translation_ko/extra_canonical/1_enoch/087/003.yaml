base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/003.yaml
  text: And those three who came out afterward seized me by my hand[a], and they lifted me up from the offspring of the earth and brought me up onto a high place, and showed me a lofty tower above the earth[d][c][b], and all the hills became low.
  footnotes:
  - marker: a
    text: Or 'from those born of the earth.' The Ge'ez phrase is more literal than a simple 'from the earth.'
    reason: lexical_alternative
  - marker: b
    text: The noun rendered 'tower' is difficult and may denote a lofty structure more generally.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the mountains were brought low.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And those three came out after they had seized me by my hands,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 뒤이어 나온 그 셋은 내 손을 붙잡고, 나를 땅의 자손들 가운데에서 들어 올려 높은 곳으로 데려가고, 땅 위에 높이 세워진 탑을 내게 보여 주었습니다. 그리고 모든 언덕은 낮아졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 셋은 … 뒤이어 나왔다’로도 옮길 수 있습니다. Ge'ez의 관계절 구조를 더 직접적으로 드러내는 번역입니다.
    reason: alternative_reading
  - marker: b
    text: ‘탑’은 원문의 난해한 명사에 대한 전통적 해석입니다. 더 일반적으로는 ‘높은 구조물’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘모든 산이 낮아졌다’로도 번역할 수 있습니다. 원문 어휘는 산맥 전체를 가리킬 가능성도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ፫እለ ወጽኡ ድኅረ
  english_pob_choice: those three who came out afterward
  chosen_korean: 뒤이어 나온 그 셋
  alternatives_korean:
  - 나중에 나온 그 셋
  - 뒤따라 나온 그 셋
  - 그 셋, 뒤이어 나온 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 관계절을 살려 ‘그 셋’에 붙는 뒤이은 출현을 자연스럽게 표현했습니다. ‘뒤이어’는 시간 순서를 유지하면서도 본문의 시각적 흐름을 해치지 않습니다.
- source_word: አሐዙኒ በእዴየ
  english_pob_choice: seized me by my hand
  chosen_korean: 내 손을 붙잡고
  alternatives_korean:
  - 내 손을 잡고
  - 내 손으로 나를 붙들고
  - 내 손을 움켜잡고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 ‘내 손’을 분명히 말하므로 이를 유지하되, 한국어에서는 ‘붙잡고’가 육체적 접촉과 이동을 함께 드러내어 가장 자연스럽습니다.
- source_word: እምትውልደ ምድር
  english_pob_choice: from the offspring of the earth
  chosen_korean: 땅의 자손들 가운데에서
  alternatives_korean:
  - 땅의 자손들로부터
  - 땅에서 난 자들 가운데에서
  - 땅의 نسل 가운데에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순히 ‘땅에서’로 평평하게 만들지 않고, 출생/계보의 이미지를 살려 ‘땅의 자손들’로 옮겼습니다. ‘가운데에서’는 그 집단적 대비를 한국어에서 자연스럽게 살립니다.
- source_word: ማኅፈደ ነዋኅ
  english_pob_choice: a tower raised high / a lofty tower
  chosen_korean: 높이 세워진 탑
  alternatives_korean:
  - 높이 솟은 탑
  - 우뚝 세워진 탑
  - 높은 탑
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어휘가 다소 난해하지만 문맥상 높은 구조물을 가리키므로 ‘탑’으로 옮기되, ነዋኅ의 상향성을 ‘높이 세워진’으로 보존했습니다.
- source_word: ሕፁፀ ኵሉ አውግር
  english_pob_choice: all the hills became low
  chosen_korean: 모든 언덕은 낮아졌습니다
  alternatives_korean:
  - 모든 산은 낮아졌습니다
  - 모든 언덕이 낮아졌습니다
  - 모든 높은 곳이 낮아졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지형의 변화라는 문자적 장면을 유지하기 위해 도덕적 의미인 ‘겸손해졌다’ 대신 물리적 낮아짐으로 번역했습니다.
theological_decisions:
- issue: ‘땅의 자손들’의 생래적/계보적 뉘앙스 보존
  chosen_reading: ‘땅의 자손들 가운데에서’로 옮겨, 단순한 공간 이동이 아니라 땅에 속한 존재들과의 대비를 드러냈습니다.
  alternative_readings:
  - 땅에서
  - 땅의 사람들 가운데에서
  - 땅의 주민들 가운데에서
  rationale: 본문은 에녹이 지상 존재들로부터 분리되어 상승하는 환시적 대비를 강조하므로, 계보적 이미지를 지워 버리지 않는 번역이 필요합니다.
  doctrine_reference: 계시적 대비와 본문 고유 이미지 보존
- issue: 지형의 낮아짐을 도덕화하지 않음
  chosen_reading: ‘낮아졌습니다’로 번역해 산과 언덕의 실제적 낮아짐을 유지했습니다.
  alternative_readings:
  - 겸손해졌습니다
  - 눌렸습니다
  - 내려앉았습니다
  rationale: 이 장면은 비유적 교훈보다 환시 속 풍경의 변형을 말하므로, 도덕적 해석을 덧씌우지 않는 것이 원문에 충실합니다.
  doctrine_reference: 문맥 우선의 서술 유지
