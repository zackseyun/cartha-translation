base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/002.yaml
  text: And again I lifted up my eyes to heaven[a], and I saw in a vision—and behold, there came out from heaven beings in the likeness of white men; and four came out from that place[d][c][b], and three with them.
  footnotes:
  - marker: a
    text: Or 'figures like white men.' The Ge'ez describes their appearance by comparison rather than directly naming their class.
    reason: lexical_alternative
  - marker: b
    text: 'The final count is abrupt in the Ethiopic: ''and four came out from that place, and three with them.'' The verse likely intends a total of seven heavenly figures, but the syntax is preserved rather than smoothed.'
    reason: textual_variant
  - marker: c
    text: Or 'in the vision'.
    reason: previous_rendering
  - marker: d
    text: Or 'beings like white men'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 다시 내 눈을 하늘로 들어 올렸습니다. 그리고 나는 환상 가운데 보았습니다.[a] 보십시오, 하늘에서 흰 사람들의 형상과 같은 존재들이 나왔고,[c] 그곳에서 넷이 나왔으며, 그들과 함께 셋이 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘환상 가운데’는 በራእይ의 무관사적 용법을 살린 표현입니다.
    reason: source_note
  - marker: b
    text: 마지막 수량 표현은 에티오피아어의 갑작스러운 병치를 그대로 살려 매끈하게 정리하지 않았습니다.
    reason: textual_variant
  - marker: c
    text: ‘흰 사람들의 형상과 같은 존재들’은 ‘like the likeness of’라는 중첩된 비교를 반영한 표현입니다.
    reason: lexical_alternative
