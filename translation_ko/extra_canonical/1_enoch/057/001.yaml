- source_word: ዲበ፡ ነፋሳት፡ እምስራቅ፡ ወእምዕራብ
  english_pob_choice: coming upon the winds from the east and from the west
  chosen_korean: 동쪽과 서쪽에서 불어오는 바람 위를 타고 와서
  alternatives_korean:
