  yaml_path: translation/extra_canonical/1_enoch/057/003.yaml
  text: And all of them shall fall down and worship the Lord of Spirits[a]. And this is the end of the second parable.
  footnotes:
  - marker: a
    text: Or 'the end of another parable' / 'the end of the other parable,' if ካልእ is taken non-sequentially rather than as 'second.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들 모두는 만군의 주이신 영들의 주 앞에 엎드려 경배할 것입니다.[a] 그리고 이것이 둘째 비유의 끝입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 비유의 끝’ / ‘그 다른 비유의 끝’으로도 옮길 수 있습니다. ካልእ을 순차적이 아니라 비순차적으로 이해할 경우입니다.
    reason: lexical_alternative
