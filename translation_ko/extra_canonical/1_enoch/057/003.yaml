  doctrine_reference: 고유 칭호 보존 원칙
- issue: ‘둘째 비유’와 ‘다른 비유’의 해석
  chosen_reading: 순차적 구분을 나타내는 ‘둘째 비유’로 읽었습니다.
  alternative_readings:
