base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
  footnotes:
  - marker: a
    text: Or 'will bring forth from her womb.' The Ge'ez verb can be understood as yielding up what has been held within.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the realm of the dead in ancient Jewish usage, not necessarily the later concept of hell.
    reason: cultural_note
  - marker: c
    text: Or 'from her womb'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에는 땅이 그 안에 맡겨진 것을 내어주고, 스올도 그것이 받은 것을 내어줄 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘맡겨진 것’은 직역보다 해석적 표현입니다. Ge'ez의 ማኅፀንታ는 이 문맥에서 ‘맡겨진/예탁된 것’의 뜻으로 이해됩니다.
    reason: source_note
  - marker: b
    text: ‘스올’은 고대 유대 용례의 죽은 자의 영역을 가리키며, 후대의 ‘지옥’과는 반드시 같지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  english_pob_choice: in those days
  chosen_korean: 그때에는
  alternatives_korean:
  - 그런 날들에는
  - 그 시대에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 종말론적 시간 공식의 감각을 살리면서도 한국어 문장 흐름에 자연스럽게 맞추었습니다.
- source_word: ምድር
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 지구
  - 땅 위
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구절에서는 죽은 자를 내어주는 우주적 공간을 가리키므로, 한국어에서는 ‘땅’이 가장 직접적이고 자연스럽습니다.
- source_word: ማኅፀንታ
  english_pob_choice: what was entrusted to it
  chosen_korean: 그 안에 맡겨진 것
  alternatives_korean:
  - 그 안에 보관된 것
  - 그에게 맡겨진 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 어형은 ‘몸의 womb’가 아니라 ‘맡겨진/위탁된 것’의 의미를 지니므로, 유언·예탁의 이미지를 살려 번역했습니다.
- source_word: ሲኦል
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 음부
  - 무덤
  - 지하세계
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 후대의 ‘지옥’ 개념으로 환원하지 않고, 유대 묵시문학의 고유 용어를 음역으로 보존했습니다.
- source_word: ዘተመጠወት
  english_pob_choice: what it has received
  chosen_korean: 그것이 받은 것
  alternatives_korean:
  - 그것이 받아 둔 것
  - 그것이 수납한 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘받다’의 수동적 의미를 단순하게 살려, 스올이 맡아 둔 죽은 자들을 다시 내놓는 그림을 분명히 했습니다.
theological_decisions:
- issue: 스올의 번역을 한국 교회 전통어로 풀지 여부
  chosen_reading: 스올로 음역하여, 땅과 스올을 서로 구별되는 두 보관소로 제시합니다.
  alternative_readings:
  - 음부
  - 무덤
  - 지옥
  rationale: 본문은 종말에 땅과 스올이 각기 맡은 것을 되돌려주는 구조이므로, 후대 교리적 연상을 불러오는 단어보다 원문 개념을 보존하는 편이 더 충실합니다.
  doctrine_reference: original-language primacy; preserve apocalyptic conceptual distinction
