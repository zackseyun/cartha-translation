base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
  footnotes:
  - marker: a
    text: Or 'will bring forth from her womb.' The Ge'ez verb can be understood as yielding up what has been held within.
    reason: lexical_alternative
  - marker: b
    text: Sheol is the realm of the dead in ancient Jewish usage, not necessarily the later concept of hell.
    reason: cultural_note
  - marker: c
    text: Or 'from her womb'.
    reason: previous_rendering
translation:
  language: ko
  text: '그 날들에 땅은 자신에게 맡겨진 것을 돌려주고, 스올은 자신이 받은 것을 돌려줄 것입니다.[a][b] 파멸도 자신이 갚아야 할 것을 돌려줄 것입니다. 그분은 그들 가운데서 의인들과 거룩한 이들을 택하실 것입니다. 그들이 구원받을 날이 가까이 왔기 때문입니다.


    그 날들에 택함을 받은 이는 그의 보좌에 앉을 것이며, 지혜의 모든 비밀을 그의 입의 생각에서 드러낼 것입니다. 영들의 주께서 그것들을 그에게 주시고 그를 영화롭게 하셨기 때문입니다.


    그 날들에 산들은 숫양들처럼 춤추고, 언덕들은 젖으로 배부른 어린양들처럼 뛰어오를 것입니다. 그들 모두는 하늘에서 천사들이 될 것이며, 그들의 얼굴은 기쁨으로 빛날 것입니다. 그 날들에 택함을 받은 이가 일어났고, 땅은 기뻐할 것이며, 의인들은 그 위에 살고 택함을 받은 이들은 그 안에서 다니며 걸을 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신에게 맡겨진 것’은 직역보다 해석적 표현입니다. 게에즈어 ማኅፀንታ는 이 문맥에서 ‘맡겨진 것’ 또는 ‘예탁된 것’으로 이해될 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘스올’은 고대 유대 용례에서 죽은 자들의 영역을 가리키며, 후대의 ‘지옥’과 반드시 같지는 않습니다.
    reason: cultural_note
