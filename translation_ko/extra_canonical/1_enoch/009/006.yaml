base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/006.yaml
  text: You see what Azazel has done[a]—how he has taught all unrighteousness upon the earth and revealed the hidden things of the world that are done in the heavens[c][b], which men learned.
  footnotes:
  - marker: a
    text: The final clause is difficult in the Ethiopic witness. It may mean 'which men were striving to learn,' or more simply 'which men learned.'
    reason: textual_variant
  - marker: b
    text: '''The hidden things of the world'' could also be rendered ''the secrets of the age'' or ''the hidden things of eternity,'' since the Ge''ez term can carry several related senses.'
    reason: lexical_alternative
  - marker: c
    text: Or 'which men were striving to learn.'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 아자젤이 행한 것을 보십니다[a] — 그가 땅 위에 온갖 불의([b])를 가르쳤고, 하늘에서 이루어지는 세상의 숨은 것들을 드러내었으니, 사람들이 그것들을 알게 되었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈 본문은 단순 과거 사실보다 천상 존재들의 고발적 호소를 전합니다.
    reason: source_note
  - marker: b
    text: 게으즈 ዓመፃ는 사회적 불의보다 넓은 의미의 도덕적 악을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 본문 전승상 난점이 있어, 단순히 "사람들이 그것들을 알게 되었다"로 이해했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ርኢከ
  english_pob_choice: You see
  chosen_korean: 보십니다
  alternatives_korean:
  - 보셨습니다
  - 보십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 2인칭 직접 호소형을 살려 현재형으로 처리했습니다. 합쇼체의 공손한 청유가 아니라 천상 청원문의 생생한 호소를 드러내기 위해 "보십니다"를 택했습니다.
- source_word: አዛዝኤል
  english_pob_choice: Azazel
  chosen_korean: 아자젤
  alternatives_korean:
  - 아자즐
  - 아사셀
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고유명사는 음역했습니다. 에녹서 전승의 인물명을 현행 표기 관습에 맞추어 아자젤로 옮겼습니다.
- source_word: ኵሎ ዓመፃ
  english_pob_choice: all unrighteousness
  chosen_korean: 온갖 불의
  alternatives_korean:
  - 모든 불의
  - 온갖 불법
  - 온갖 불의와 불법
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 죄악 전반을 가리키는 넓은 범위를 살리되, 한국어에서 신학적으로 가장 자연스러운 대응어인 "불의"를 썼습니다. "불법"은 율법 위반으로 좁아질 수 있어 피했습니다.
- source_word: ወአግሀደ ኅቡኣተ ዓለም
  english_pob_choice: and revealed the hidden things of the world
  chosen_korean: 하늘에서 이루어지는 세상의 숨은 것들을 드러내었으니
  alternatives_korean:
  - 세상의 숨은 것들을 드러내었으니
  - 세상의 비밀들을 드러내었으니
  - 세상의 감추어진 것들을 드러내었으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 "숨은 것들"과 이어지는 "세상/시대"의 중의성을 한국어에서 단정적으로 풀기보다, 문맥상 하늘에서 일어나는 일과 대조되는 숨은 사안을 살리는 방향으로 옮겼습니다. "세상의 숨은 것들"을 유지하되, 뒤의 관계절을 자연스럽게 풀어 밝혔습니다.
- source_word: እለ ይትገበሩ በሰማያት
  english_pob_choice: that are done in the heavens
  chosen_korean: 하늘에서 이루어지는
  alternatives_korean:
  - 하늘에서 행해지는
  - 하늘들에서 이루어지는
  - 하늘에서 벌어지는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동/무인칭 뉘앙스를 살리기 위해 "이루어지는"을 택했습니다. 복수적 우주론 어감을 위해 단수 "하늘"로도 읽을 수 있으나, 한국어에서는 문맥상 자연스러운 단수 표현이 의미를 충분히 전달합니다.
- source_word: አመረ ሰብእ
  english_pob_choice: which men learned
  chosen_korean: 사람들이 그것들을 알게 되었습니다
  alternatives_korean:
  - 사람들이 그것들을 배웠습니다
  - 사람들이 그것들을 알았습니다
  - 사람들이 그것들을 배우려 했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어진 게으즈 본문은 "배우려고 애쓰다"의 뜻을 지지하지 않으므로, 개정된 영어 메모에 맞추어 단순한 인지 획득으로 이해했습니다. 한국어에서는 "알게 되었습니다"가 결과적 의미를 가장 무리 없이 담습니다.
theological_decisions:
- issue: 아자젤의 가르침이 지닌 비난적 어조
  chosen_reading: '"그가 땅 위에 온갖 불의를 가르쳤고"로 옮겨, 단순한 정보 전달이 아니라 죄악의 전수라는 고발성을 살렸습니다.'
  alternative_readings:
  - '"그가 땅 위에 온갖 불의를 가르쳤습니다"'
  - '"그가 땅 위에서 온갖 불의를 가르쳤고"'
  rationale: 본문은 아자젤의 행위를 단순한 과거 사실이 아니라 천상 존재들이 호소하는 고발로 제시합니다. 그래서 현재적 호소감과 비난의 강도를 유지하는 방향을 택했습니다.
  doctrine_reference: Translation philosophy §Preserve rhetorical force; contested moral-corruption language
- issue: '"세상의 숨은 것들"과 "하늘에서 이루어지는"의 긴장'
  chosen_reading: 감춰진 세상과 하늘의 사안을 병치해, 지상과 천상의 경계를 침범한 금지된 지식을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - '"세상의 비밀들"'
  - '"영원의 숨은 것들"'
  - '"시대의 비밀들"'
  rationale: 게으즈의 ዓለም은 세상/시대/영원을 포괄할 수 있어 지나치게 한쪽으로 고정하면 본문의 긴장이 사라집니다. 한국어에서도 이 모호성을 남겨 두는 편이 원문에 충실합니다.
  doctrine_reference: Translation philosophy §Maintain lexical tension rather than resolve it
