base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/005.yaml
  text: You have made all things[a], and authority over all is with you; and all things are uncovered and laid bare before you, and you see all things, and there is nothing that can hide itself from you.
  footnotes:
  - marker: a
    text: Literally, 'all things are uncovered before you and manifest.' The paired expressions intensify the image of total exposure before God.
    reason: lexical_alternative
translation:
  language: ko
  text: 주님은 만물을 지으셨고, 모든 것에 대한 권세는 주님과 함께 있습니다. 또한 만물은 주님 앞에 드러나 있고 벌거벗겨져 있으며, 주님은 만물을 보시니, 주님에게서 스스로 숨을 수 있는 것은 아무것도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገበርከ
  english_pob_choice: have made
  chosen_korean: 지으셨고
  alternatives_korean:
  - 만드셨고
  - 창조하셨고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈어 동사는 ‘하다/만들다’의 폭이 있으므로, 우주적 문맥에서는 ‘지으셨고’가 창조 행위를 자연스럽게 드러내면서도 과잉 신학화를 피합니다.
- source_word: ስልጣነ
  english_pob_choice: authority
  chosen_korean: 권세
  alternatives_korean:
  - 통치
  - 권위
  - 주권
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 명사는 지배 권력과 통치권을 가리키므로, 한국어에서는 ‘권세’가 하나님의 보편적 통치성을 가장 압축적으로 살립니다.
- source_word: ክሡት / ግሁድ
  english_pob_choice: uncovered and laid bare
  chosen_korean: 드러나 있고 벌거벗겨져 있으며
  alternatives_korean:
  - 노출되어 있고 드러나 있으며
  - 숨김없이 펼쳐져 있으며
  - 폭로되어 있으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 표현의 병렬은 단순한 ‘알려짐’이 아니라 완전한 노출의 이미지를 강조하므로, ‘드러나 있고 벌거벗겨져 있으며’로 구체성과 중첩 효과를 살렸습니다.
- source_word: ዘይትከሀል ይትኀባእ
  english_pob_choice: there is nothing that can hide itself from you
  chosen_korean: 주님에게서 스스로 숨을 수 있는 것은 아무것도 없습니다
  alternatives_korean:
  - 주님에게 숨을 수 있는 것은 아무것도 없습니다
  - 주님 앞에서 숨을 수 있는 것은 아무것도 없습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반사적 뉘앙스를 보존하기 위해 ‘스스로 숨다’를 택해, 단순한 수동적 은폐보다 주체적 은폐 시도까지 포괄하도록 했습니다.
theological_decisions:
- issue: 인간의 전적 노출을 단순한 인지 명제가 아니라 재판적·종말론적 이미지로 살릴지 여부
  chosen_reading: ‘드러나 있고 벌거벗겨져 있으며’라는 구체적 이미지를 유지해, 하나님 앞에서의 완전한 노출이라는 현장성을 살렸습니다.
  alternative_readings:
  - ‘완전히 알려져 있으며’
  - ‘모든 것이 주님께 분명합니다’
  rationale: 이 구절은 하나님의 전지함을 추상적으로 선언하기보다, 피조물의 완전한 노출을 묘사합니다. 따라서 교리 용어로 평탄화하지 않고 원문의 긴장과 힘을 유지하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §Preserve concrete source imagery over doctrinal shorthand; §Maintain rhetorical intensity before God.
