  naturalness: 초안의 ‘영혼들이 자기들의 호소를 하며’는 ‘자기들의’가 불필요하고 ‘호소를 하다’가 다소 중복적입니다. ‘영혼들이 호소하여 말합니다’가 현대 표준어 합쇼체에서 더 자연스럽습니다. 호격은 ‘하늘의 거룩한 이들이여’가 문맥에 맞고 자연스럽습니다.
  terminology: ‘하늘의 거룩한 이들’은 후대 교회적 의미가 강한 ‘성도’나 정체성을 확정하는 ‘천사’를 피하여 적절합니다. ‘지극히 높으신 이’는 Most High의 신적 칭호를 유지합니다. ‘송사’는 판결로 확정하지 않으면서 법정적 청원이라는 ፍትሐ의 의미를 보존합니다.
