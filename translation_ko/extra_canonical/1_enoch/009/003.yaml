  rationale: 법정적 방향성을 나타내는 전치사를 ‘앞에’로 옮겨, ‘지극히 높으신 이’라는 신적 칭호의 위엄과 청원 장면을 함께 살렸습니다.
theological_decisions:
- issue: ‘하늘의 거룩한 이들’의 정체
  chosen_reading: 천상 존재들, 곧 하늘의 거룩한 이들로 넓게 유지합니다.
  alternative_readings:
