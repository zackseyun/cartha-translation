  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적 방향성을 나타내는 전치사를 ‘앞에’로 옮겨, ‘지극히 높으신 이’라는 신적 칭호의 위엄과 청원 장면을 함께 살렸습니다.
