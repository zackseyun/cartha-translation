    rationale: ‘사건’은 일반적인 일이나 형사 사건으로도 읽혀 당사자들이 न्याय를 구하며 제출하는 법정적 사안을 충분히 드러내지 못합니다. ‘송사’는 소송·법적 청원의 의미를 유지하되 이미 내려진 ‘판결’로 오해하게 하지 않습니다.
