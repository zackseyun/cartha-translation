  - 천사들로 한정
  rationale: 문맥이 중보적 천상 법정 이미지를 사용하므로, 특정 교단적 정체성으로 좁히지 않고 텍스트의 범위를 보존하는 편이 적절합니다.
  doctrine_reference: apocalyptic imagery; preserve local referent without over-specification
- issue: ፍትሐ의 의미
  chosen_reading: 법정적 ‘사건/호소’의 의미를 살려 최종 판결보다 청원 자체를 강조합니다.
  alternative_readings:
  - 판결
  - 정의
  - 억울함
  rationale: 문맥상 죽임당한 자들의 호소가 하나님 앞에 제출되는 장면이므로, 판결을 이미 받은 상태로 보이게 하는 번역은 피하고 긴장을 유지합니다.
  doctrine_reference: forensic petition / vindication tension
