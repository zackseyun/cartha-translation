base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
  footnotes:
  - marker: a
    text: Or 'Bring us justice before the Most High,' or 'Present our case before the Most High.' The Ge'ez wording is juridical and may include both the ideas of legal case and vindication.
    reason: lexical_alternative
  - marker: b
    text: Or 'Bring our judgment'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제, 하늘의 거룩한 이들이여, 사람들의 영혼들이 호소하여 말합니다. “우리의 송사[a][b]를 지극히 높으신 이 앞에 가져가 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 이 앞에서 우리에게 정의를 가져다주십시오’, 또는 ‘우리의 송사를 지극히 높으신 이 앞에 제시해 주십시오’. 게에즈어 표현은 법정적 성격을 지니며, 법적 사안과 정의 또는 신원의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 판결을 가져가 주십시오’.
    reason: previous_rendering
