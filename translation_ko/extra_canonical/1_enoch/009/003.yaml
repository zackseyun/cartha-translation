base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
  footnotes:
  - marker: a
    text: Or 'Bring us justice before the Most High,' or 'Present our case before the Most High.' The Ge'ez wording is juridical and may include both the ideas of legal case and vindication.
    reason: lexical_alternative
  - marker: b
    text: Or 'Bring our judgment'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제[a], 하늘의 거룩한 이들아, 사람들의 영혼들이 자기들의 호소를 하며[b], 「우리의 사건을 가장 높으신 이 앞에 가져가십시오」라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가장 높으신 이 앞에서 우리에게 정의를 가져오십시오’, 혹은 ‘우리의 사건을 가장 높으신 이 앞에 제시하십시오’. 게에즈 본문은 법정적 표현이라 ‘사건’과 ‘정의/신원’의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 판결을 가져오십시오’.
    reason: previous_rendering
