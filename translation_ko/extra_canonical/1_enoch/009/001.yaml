  - 악행
  - 불의
  rationale: 원문 ዓመፃ는 단순한 사회적 폭력보다 더 넓은 범주의 질서 파괴를 가리키므로, 신학적·윤리적 무게를 약화시키지 않도록 포괄적으로 옮겼습니다.
  doctrine_reference: 'Lexical-theological tension: moral transgression broader than physical violence'
