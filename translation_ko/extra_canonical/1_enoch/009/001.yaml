  rationale: 이 본문은 에녹서의 고유 전승을 번역하므로, 익숙한 후대 영어식 철자보다 원전 전통에 가까운 음역을 따랐습니다.
  doctrine_reference: 'PHILOSOPHY.md: Translate titles; transliterate names.'
- issue: ‘불법’의 범위
  chosen_reading: 법을 어기는 행위 전체를 가리키는 포괄적 표현으로 유지
  alternative_readings:
