base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/001.yaml
  text: And then Michael[a], Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth[b], and all the lawlessness being done upon the earth.
  footnotes:
  - marker: a
    text: Or 'being shed.' The Ge'ez verb is difficult, and some interpreters connect it with the idea of blood crying out; the main text keeps the more immediate image of blood poured out upon the earth.
    reason: lexical_alternative
  - marker: b
    text: The repeated phrase 'upon the earth' is retained to preserve the verse's emphasis on the earthly sphere as the scene of violence and transgression.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그때 미카엘과 우리엘과 라파엘과 가브리엘이 하늘에서 내려다보며, 땅 위에 흘려진 많은 피와 땅 위에서 행해지는 모든 불법을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 해석은 이 동사를 ‘흘려지다’보다 ‘쏟아지다’ 또는 피가 ‘외치다’로 이해하기도 하지만, 본문은 하늘에서 지상에 펼쳐진 피의 광경을 먼저 제시합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅 위에’라는 표현을 반복해, 폭력과 범죄가 일어난 현장이 지상임을 강조하는 원문의 효과를 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: ወ*እሜሃ
  english_pob_choice: And then
  chosen_korean: 그리고 그때
  alternatives_korean:
  - 그런 다음
  - 그때
  lexicon: Dillmann
  rationale: 시간 전개를 나타내는 연결어로, 서사 흐름을 자연스럽게 이어 주면서도 원문의 순서를 유지합니다.
- source_word: ሐወጹ
  english_pob_choice: looked down
  chosen_korean: 내려다보며
  alternatives_korean:
  - 바라보며
  - 내려보며
  lexicon: Dillmann
  rationale: 하늘에서 아래를 향해 보는 시각을 분명히 드러내는 표현이므로, ‘내려다보다’가 원문의 수직적 시점을 가장 잘 살립니다.
- source_word: ብዙሐ ደመ
  english_pob_choice: much blood
  chosen_korean: 많은 피
  alternatives_korean:
  - 많은 피 흘림
  - 큰 피
  lexicon: Dillmann
  rationale: 원문은 해석적으로 ‘피 흘림’보다 문자적으로 ‘피’를 말하므로, 아포칼립스적 충격을 유지하는 쪽으로 옮겼습니다.
- source_word: ዘይትከዓው
  english_pob_choice: being poured out
  chosen_korean: 흘려진
  alternatives_korean:
  - 쏟아진
  - 뿌려진
  - 흘리고 있는
  lexicon: Dillmann
  rationale: 피에 대한 수동적 이미지가 가장 직접적으로 전달되도록 했으며, ‘쏟아진’보다 한층 자연스럽고 문맥에 맞는 결과 상태를 살렸습니다.
- source_word: ኵሎ ዓመፃ
  english_pob_choice: all the lawlessness
  chosen_korean: 모든 불법
  alternatives_korean:
  - 모든 악행
  - 모든 불의
  - 모든 불법행위
  lexicon: Dillmann
  rationale: 원문의 ዓመፃ는 도덕적·법정적 위반을 포괄하므로, 단순한 폭력이나 악행으로 좁히지 않고 ‘불법’으로 옮겨 법적·윤리적 긴장을 보존했습니다.
theological_decisions:
- issue: 천상 존재들의 이름 표기
  chosen_reading: 미카엘, 우리엘, 라파엘, 가브리엘
  alternative_readings:
