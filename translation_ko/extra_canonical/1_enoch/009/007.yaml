  source_fidelity: 초안은 하나님을 주어로, 세미야자를 권위를 받은 대상으로 이해하고 ‘다스리도록’을 통해 ይኵንን의 통치 동사를 살린 점에서 원문 및 영어 POB의 핵심 의미에 충실합니다. 다만 ‘세미야자에게—당신께서’라는 절단된 구성은 한국어에서 다소 불안정하므로, 관계절을 자연스러운 서술문으로 정리하는 편이 안전합니다.
