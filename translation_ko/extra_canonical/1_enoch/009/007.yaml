base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/007.yaml
  text: And Semyaza[c][b][a], to whom you gave authority to rule over those who are with him.
  footnotes:
  - marker: a
    text: The Ge'ez clause after 'authority' is textually difficult in this OCR witness. The sense appears to be that Semyaza had authority over the angels associated with him, likely the gathered Watchers under his leadership.
    reason: textual_variant
  - marker: b
    text: Or 'those who are with him.' The underlying phrase may denote companions, associates, or those assembled together with him.
    reason: lexical_alternative
  - marker: c
    text: Or 'to you I gave authority over those who are joined with him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 세미야자에게—당신께서 그와 함께 있는 이들을 다스리도록 권위를 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈어 문구는 본문 전승상 난해하므로, 의미는 세미야자와 함께한 집단에 대한 위임 통치로 잡았습니다.
    reason: textual_variant
  - marker: b
    text: ‘그와 함께 있는 이들’은 ‘그와 함께 모여 있는 이들’, ‘그와 결합한 이들’처럼 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  english_pob_choice: Semyaza
  chosen_korean: 세미야자
  alternatives_korean:
  - 셈야자
  - 세미아자
  lexicon: 고유명사 음역
  rationale: 고유명사는 번역하지 않고 현대 외래어 표기식에 맞게 음역했습니다. 영어 POB의 Semyaza를 그대로 반영하되 한국어 표기 관습에 맞춰 세미야자를 택했습니다.
- source_word: ዘአንተ
  english_pob_choice: to whom you gave
  chosen_korean: 당신께서
  alternatives_korean:
  - 당신이
  - 당신에게
  lexicon: Dillmann
  rationale: 이 구절의 주어는 앞선 9:4의 맥락상 하나님이므로, 2인칭 남성 단수에 맞춰 ‘당신께서’로 옮겨 직접 주소를 살렸습니다.
- source_word: ወሀብኮ
  english_pob_choice: you gave
  chosen_korean: 주셨습니다
  alternatives_korean:
  - 주셨다
  - 허락하셨습니다
  - 부여하셨습니다
  lexicon: Dillmann
  rationale: ‘주셨습니다’는 전달된 권위의 수여를 자연스럽게 나타내며, ‘허락하셨습니다’보다 직접적이고 ‘부여하셨습니다’보다 덜 관료적입니다.
- source_word: ስልጣነ
  english_pob_choice: authority
  chosen_korean: 권위
  alternatives_korean:
  - 권세
  - 통치권
  - 권한
  lexicon: Dillmann
  rationale: 이 단어는 단순한 힘보다 위임된 통치 자격을 가리키므로 ‘권위’가 가장 균형 있게 받습니다. ‘권한’은 지나치게 행정적이고, ‘권세’는 더 강한 위압감을 줍니다.
- source_word: ይኵንን
  english_pob_choice: to rule
  chosen_korean: 다스리도록
  alternatives_korean:
  - 통치하도록
  - 지배하도록
  - 판단하도록
  lexicon: Dillmann
  rationale: 이동사의 핵심은 다스림/통치의 기능이므로 목적형으로 풀어 ‘다스리도록’이라고 옮겼습니다. 영어 POB의 ‘to rule’과 대응합니다.
- source_word: እለ ምስሌሁ ኅቡረ
  english_pob_choice: those who are with him / those who are joined with him
  chosen_korean: 그와 함께 있는 이들
  alternatives_korean:
  - 그와 함께 모여 있는 이들
  - 그와 결합한 이들
  - 그와 연결된 이들
  lexicon: Dillmann
  rationale: 문맥상 세미야자와 연관된 동료 집단, 곧 함께한 존재들을 가리키므로 가장 자연스럽고 넓게 ‘함께 있는 이들’로 옮겼습니다. ‘joined’의 집합적 뉘앙스를 유지하되 과도하게 좁히지 않았습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 주소의 인칭 처리
  chosen_reading: 앞 문맥의 천상 발화가 하나님께 향하고 있으므로 ‘당신께서’로 직접 주소를 유지했습니다.
  alternative_readings:
  - 당신이
  - 주님께서
  rationale: 이 절은 천사들이 하나님께 말하는 연속 문맥 안에 있으므로 2인칭을 보존해야 합니다. ‘주님’으로 바꾸면 원문의 직접성보다 후대적 경어가 앞서게 됩니다.
  doctrine_reference: 문맥 우선의 인칭 보존
