  - 사람의 여자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 존재와 대비되는 인간 여성을 가리키는 표현이므로, 직역성을 살리면서도 현대 한국어에서 자연스러운 ‘사람의 딸들’로 옮겼습니다.
- source_word: ወስከቡ ምስሌሆን
  english_pob_choice: and they lay with them
  chosen_korean: 그 여자들과 함께 누웠고
  alternatives_korean:
  - 그 여자들과 동침했고
  - 그 여자들과 잠자리를 함께했고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 성적 결합을 나타내는 관용구이므로, 합쇼체 문맥에 어울리면서도 노골적으로 현대 구어체화하지 않는 ‘함께 누웠고’를 택했습니다.
- source_word: ወአግሀዱ ሎን ኵሎ ኃጢአተ
  english_pob_choice: and revealed to them every sin
  chosen_korean: 그들에게 모든 죄를 드러내어 보였습니다
  alternatives_korean:
  - 그들에게 모든 죄를 드러냈습니다
  - 그들에게 모든 죄를 계시했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순 전달보다 ‘드러내어 알림/폭로’의 뜻이 강해, 계시 어휘를 피하고 ‘드러내어 보였습니다’로 아포칼립틱한 폭로의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 마지막 절의 행위가 단순한 가르침인지, 금지된 지식의 폭로인지
  chosen_reading: 이 구절은 성적 타락과 함께 금지된 죄의 전반을 드러내 보인 행위를 함께 말합니다.
  alternative_readings:
  - 단지 ‘죄’를 가르쳤다는 뜻으로 좁히는 읽기
  - 마지막 절을 별도의 주석적 덧붙임으로 보는 읽기
  rationale: 게즈 본문과 POB 영어 모두 ‘모든 죄’를 드러내는 폭로를 병렬로 유지하므로, 이를 단순한 교육 행위로 약화하지 않고 문자적·신학적 긴장을 그대로 살렸습니다.
  doctrine_reference: 유다계 묵시문학의 타락 서술은 성적 죄와 지식의 부패를 함께 제시할 수 있으므로, 본문이 제시하는 이중성을 보존합니다.
