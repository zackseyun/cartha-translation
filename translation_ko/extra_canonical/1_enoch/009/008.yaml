    reason: previous_rendering
  - marker: c
    text: Or 'made known'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 땅 위의 사람의 딸들에게 가서, 그 여자들과 함께 누웠고, 그 여자들과 함께 자신들을 더럽혔으며, 그들에게 모든 죄를 드러내어 보였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 딸들’은 천상 존재와 대비되는 인간 여성을 가리키는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: ወሖሩ
  english_pob_choice: and they went in
  chosen_korean: 그들은 … 가서
  alternatives_korean:
  - 그들은 … 들어가서
  - 그들은 … 갔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 뒤이어 나오는 성적 결합을 예고하는 이동 동사이므로, 한국어에서는 과도한 해설 없이 ‘가서’로 자연스럽게 옮겨 의미를 보존했습니다.
- source_word: አዋልደ ሰብእ
