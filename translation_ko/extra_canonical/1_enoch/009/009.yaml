  text: 그 여자들은 거인들을[b] 낳았고, 이로 말미암아[a] 온 땅은 피로 가득 찼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 감시자들과의 결합으로 난 거인들에 관한 앞 문맥을 배경으로, 그 결과를 간결하게 말합니다.
    reason: cross_reference
  - marker: b
    text: 또는 “여자들이 거인들을 낳았고.”
    reason: previous_rendering
