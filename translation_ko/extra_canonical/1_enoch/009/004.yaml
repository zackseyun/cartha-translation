base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/004.yaml
  text: And they said to their Lord[a], the King, “For you are Lord of lords, God of gods, and King of kings, and the throne of your glory is through all the generations of eternity, and your name is holy and glorious through all eternity[d][c][b], and blessed.”
  footnotes:
  - marker: a
    text: A bracketed Ethiopic reading adds 'and glorious' or 'and honored' after 'blessed.'
    reason: textual_variant
  - marker: b
    text: The opening address is textually compressed in Ethiopic; the sense is a royal and divine acclamation addressed to God.
    reason: alternative_reading
  - marker: c
    text: Or 'to their Lord, the King, “Lord of lords'.
    reason: previous_rendering
  - marker: d
    text: Or 'through all the generations of the world, and your name is holy and blessed and praised through all the world.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그들의 주님께, 왕께 말하였습니다. “주님은 주들 가운데 주님이시며, 신들 가운데 하나님이시며, 왕들 가운데 왕이십니다. 또한 주님의 영광의 보좌는 영원한 세대들 위에 있으며, 주님의 이름은 모든 영원에 걸쳐 거룩하고 영화로우며 복되십니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 전승에는 끝부분에 ‘영화로운’ 또는 ‘존귀한’에 해당하는 말이 덧붙는 이문이 있습니다.
    reason: textual_variant
  - marker: b
    text: 개시 호칭은 문법적으로 압축되어 있어, 뜻으로는 ‘그들의 주님, 왕께’라는 왕적·신적 찬양의 주소를 가리킵니다.
    reason: source_note
  - marker: c
    text: ‘영원한 세대들’과 ‘모든 영원에 걸쳐’는 본문의 시간 공식을 살린 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: እግዚኦሙ
  english_pob_choice: their Lord
  chosen_korean: 그들의 주님
  alternatives_korean:
  - 그들의 주인
  - 그들의 통치자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유 접미사가 붙은 높임의 호칭이므로 ‘주님’이 위격적·예배적 주소를 가장 잘 살리며, 단순한 정치적 지배자보다 더 넓은 신적 호칭을 보존합니다.
- source_word: እግዚኦሙ ለአጋእዝት
  english_pob_choice: Lord of lords
  chosen_korean: 주들 가운데 주님이시며
  alternatives_korean:
  - 주들의 주님이시며
  - 지배자들 위의 주님이시며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역형 ‘주들의 주님’도 가능하지만, 한국어에서는 반복된 지배-귀속 구조를 자연스럽게 전달하는 ‘주들 가운데 주님’이 과장된 찬양의 뉘앙스를 더 잘 살립니다.
- source_word: አምላኮሙ ለአማልክት
  english_pob_choice: God of gods
  chosen_korean: 신들 가운데 하나님이시며
  alternatives_korean:
  - 신들의 하나님이시며
  - 신들 위의 하나님이시며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘하나님’을 기본 용례로 유지하면서, ‘신들 가운데’라는 표현으로 최고신적 절대 우위를 드러내어 삼중 칭호의 병렬성을 보존합니다.
- source_word: መንበረ ስብሐቲከ
  english_pob_choice: the throne of your glory
  chosen_korean: 주님의 영광의 보좌
  alternatives_korean:
  - 주님의 영광의 왕좌
  - 주님의 영화로운 보좌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘보좌’는 መንበር의 구체적 왕좌 이미지를 유지하고, 속격 구조는 ‘영광의 보좌’로 옮겨 원문의 위엄을 보존합니다.
- source_word: ውስተ ኵሉ ትውልደ ዓለም / ውስተ ኵሉ ዓለም
  english_pob_choice: through all the generations of eternity / through all eternity
  chosen_korean: 영원한 세대들 위에 / 모든 영원에 걸쳐
  alternatives_korean:
  - 영원한 세대마다 / 영원토록
  - 세세대대로 / 영원히
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서 ዓለም은 ‘세계’보다 종말론적 시간의 단위인 ‘영원’의 뜻이 강하므로, 반복되는 시간 공식을 한국어로 명시해 두었습니다.
theological_decisions:
- issue: 삼중 찬양 칭호를 어떻게 처리할 것인가
  chosen_reading: ‘주들 가운데 주님이시며, 신들 가운데 하나님이시며, 왕들 가운데 왕이십니다’로 삼중 병렬을 그대로 유지했습니다.
  alternative_readings:
  - ‘최고의 주님과 하나님이시며 왕이십니다’로 압축
  - ‘모든 주와 신과 왕을 다스리시는 분’으로 설명적 번역
  rationale: 이 절은 하늘 찬양의 공식이므로 반복과 대구법이 핵심입니다. 압축하면 수사와 신학적 절대성이 약해져서, 원문의 열거를 드러내는 쪽을 택했습니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic doxology and formal parallelism'
- issue: 마지막 ‘복되시며’의 위치와 의미
  chosen_reading: 끝의 ‘복되십니다’를 보존하고, 중간의 ‘영화로우며’는 본문의 경구적 미화로 함께 살렸습니다.
  alternative_readings:
  - ‘거룩하고 복되시며 찬양받으십니다’
  - ‘거룩하고 복되시며 영화로우십니다’
  rationale: 에티오피아어 전승에는 끝부분의 형용사 순서와 추가가 흔들리므로, 확정적인 ‘거룩/복됨’은 살리고 ‘영화로우며’는 공경적 찬양의 의미로 처리했습니다.
  doctrine_reference: Transparency principle on textual uncertainty; preserve doxological force
