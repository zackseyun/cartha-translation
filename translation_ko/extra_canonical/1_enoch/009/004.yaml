  terminology: ‘주들의 주님, 신들의 하나님, 왕들의 왕’은 원문의 세 겹 최상급 칭호와 한국어 성서적 관용을 함께 보존합니다. ስቡሕ은 여기서 ‘영광스러우신’으로 옮기고, 불확실한 대괄호 첨가 ወከቡድ(‘영화로우신/존귀하신’)는 각주로 구별했습니다.
