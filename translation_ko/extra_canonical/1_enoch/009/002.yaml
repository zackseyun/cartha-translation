base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/002.yaml
  text: And they said among themselves[b][a], “The voice of their outcry has reached the gates of heaven.”
  footnotes:
  - marker: a
    text: The wording may be read either as the victims’ cry rising from the earth or as the earth itself crying out because of the bloodshed; the Ge'ez allows the line to evoke both.
    reason: alternative_reading
  - marker: b
    text: Or '“The voice of their outcry—the earth’s cry of distress—has reached the gates of heaven.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들이 서로 말했습니다. 「그들의 외침의 소리가 하늘의 문들까지 이르렀습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 희생자들의 외침이 땅에서 올라가는 모습으로도, 피 흘림으로 인해 땅 자체가 신음하는 모습으로도 읽을 수 있습니다. 게에즈 본문은 두 이미지를 함께 울리게 합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 「그들의 외침—땅의 고통의 외침—의 소리가 하늘의 문들까지 이르렀습니다」로 옮길 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወይቤሉ
  english_pob_choice: and they said
  chosen_korean: 그들이 서로 말했습니다
  alternatives_korean:
  - 그들이 말했습니다
  - 그들이 서로 이야기했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서로를 향한 공동 발화를 자연스럽게 드러내기 위해 '서로 말했습니다'로 옮겼습니다. 단순한 서술보다 뒤이은 직접화법을 더 분명하게 연결합니다.
- source_word: በበይናቲሆሙ
  english_pob_choice: among themselves
  chosen_korean: 서로
  alternatives_korean:
  - 그들 가운데
  - 사이에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상호성을 나타내는 관용적 표현이므로 한국어에서는 간결하게 '서로'가 가장 자연스럽습니다.
- source_word: ቃለ ጽራኃቲሆሙ
  english_pob_choice: the voice of their outcry
  chosen_korean: 그들의 외침의 소리
  alternatives_korean:
  - 그들의 외침 소리
  - 그들의 부르짖음의 소리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''voice''와 ''outcry''의 중첩을 살리되 한국어에서 중복이 지나치게 어색하지 않도록 ''외침의 소리''로 옮겼습니다. ''외침''은 단순한 소리보다 억눌린 호소의 긴박함을 더 잘 드러냅니다.'
- source_word: ዐረቀ
  english_pob_choice: has reached
  chosen_korean: 이르렀습니다
  alternatives_korean:
  - 올라갔습니다
  - 도달했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 하늘의 문들에 '도달'한 상태를 나타내므로 '이르렀습니다'가 가장 직접적입니다. 상승 이미지는 다음 구절의 공간적 표현으로 충분히 유지됩니다.
- source_word: እስከ አንቀጸ ሰማይ
  english_pob_choice: to the gates of heaven
  chosen_korean: 하늘의 문들까지
  alternatives_korean:
  - 하늘의 문들에까지
  - 하늘의 문 앞까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''문들''이라는 복수적 천상 이미지를 보존하면서, 도달의 한계를 나타내는 ''까지''로 번역했습니다. ''문 앞''보다 원문의 공간적 종결감을 더 잘 살립니다.'
theological_decisions:
- issue: 외침의 주체가 인간 희생자들인지, 땅 자체의 호소까지 포함하는지
  chosen_reading: 본문은 희생자들의 외침을 중심으로 하되, 땅이 그 피 흘림으로 인해 신음한다는 배경까지 읽을 여지를 남깁니다.
  alternative_readings:
  - 희생자들의 외침만 가리킨다
  - 땅의 외침만 가리킨다
  rationale: 게에즈 표현과 문맥은 두 가능성을 완전히 배제하지 않습니다. 그러나 한국어 본문은 과도한 해석을 더하지 않고, POB의 영어 최종안처럼 인간의 외침을 전면에 두는 쪽이 본문 흐름에 가장 충실합니다.
  doctrine_reference: 해석의 긴장을 보존하되 문맥이 강하게 지지하는 의미를 본문에 우선 반영합니다.
