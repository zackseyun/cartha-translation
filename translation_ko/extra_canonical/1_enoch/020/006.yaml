base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/006.yaml
  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
  footnotes:
  - marker: a
    text: The middle of the Ethiopic OCR line is uncertain. A widely attested understanding of this verse is that Saraqael is set over 'the spirits of humankind who sin' or similar wording.
    reason: textual_variant
  - marker: b
    text: Or 'the spirits of those who sin in the spirit.'.
    reason: previous_rendering
translation:
  language: ko
  text: 사라가엘[a]은 거룩한 천사들[b] 가운데 하나로서, 사람의 영들, 곧 죄를 짓는 자들을 맡고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문 중간의 OCR이 불안정하지만, 이 이름은 Saraqael/Sariel 전승으로 널리 알려져 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 '죄를 영 안에서 짓는 자들의 영'으로도 이해할 수 있습니다.
    reason: alternative_reading
