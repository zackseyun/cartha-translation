  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
  footnotes:
  - marker: a
    text: The middle of the Ethiopic OCR line is uncertain. A widely attested understanding of this verse is that Saraqael is set over 'the spirits of humankind who sin' or similar wording.
    reason: textual_variant
  - marker: b
    text: Or 'the spirits of those who sin in the spirit.'.
    reason: previous_rendering
translation:
  language: ko
  text: 사라카엘은 거룩한 천사들 가운데 한 분으로서, 죄를 짓는 사람들의 영들[a]을 맡고 계십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 본문 중간 부분의 OCR 판독은 불확실합니다. 널리 전승된 이해에 따르면, 이 구절은 ‘죄를 짓는 사람들의 영들’ 또는 이와 비슷한 뜻을 가리킵니다.
    reason: textual_variant
