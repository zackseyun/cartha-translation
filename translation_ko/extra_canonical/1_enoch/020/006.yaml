  rationale: 현재분사적 성격을 살려 지속적 행위를 나타내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 아리엘 계열의 천사에게 맡겨진 대상의 범위
  chosen_reading: 사람의 영들, 곧 죄를 짓는 자들
  alternative_readings:
  - 죄를 짓는 영들
  - 죄를 범하는 사람들의 영
  - 사람들 가운데 죄를 짓는 자들의 영
  rationale: 본문의 핵심은 사라가엘의 관리 대상이 인간 영역의 영적 현실과 죄의 행위에 연결된다는 점이므로, '영들'과 '죄를 짓는 자들'을 함께 살려 긴장을 유지했습니다.
  doctrine_reference: 해석을 단정하기보다 본문의 감시·책임 구조를 드러내는 번역 원칙을 따릅니다.
