base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/005.yaml
  text: Mikael[a], one of the holy angels[b], who is set over the good of mankind and over the people.
  footnotes:
  - marker: a
    text: The Ethiopic wording after 'who is set over' is difficult. It may also be understood as 'who is over the good order of the people' or 'who is over the good ones among the people.'
    reason: alternative_reading
  - marker: b
    text: Or 'who is set over the good command for the people.'.
    reason: previous_rendering
translation:
  language: ko
  text: 미카엘은 거룩한 천사들 가운데 하나로서, 인류의 선한 것과 백성을 맡도록 세워진 이입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인류의 선한 것과 백성을 맡도록’에 해당하는 원문의 구문은 난해합니다. ‘백성의 선한 질서를 맡도록’ 또는 ‘백성 가운데 선한 이들을 맡도록’으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ሚካኤል
  english_pob_choice: Mikael
  chosen_korean: 미카엘
  alternatives_korean:
  - 미가엘
  - 마이클
  lexicon: 고유명사 음역
  rationale: 에녹 전승의 Ge'ez형 이름을 따라 표준 외래어 표기보다 원형에 가까운 음역을 택했습니다.
- source_word: ፩እምነ
  english_pob_choice: one of
  chosen_korean: 중 하나이며
  alternatives_korean:
  - 하나이며
  - ~ 가운데 하나이며
  lexicon: Ge'ez 수량 표현
  rationale: 무리 안의 소속을 나타내는 표현으로, 자연스러운 한국어 구문인 ‘중 하나’가 원문 기능을 잘 드러냅니다.
- source_word: መላእክት ቅዱሳን
  english_pob_choice: the holy angels
  chosen_korean: 거룩한 천사들
  alternatives_korean:
  - 성스러운 천사들
  - 거룩한 메신저들
  lexicon: Ge'ez 어휘
  rationale: 문맥상 천상 존재들을 가리키므로 ‘천사들’로 옮기되, ቅዱሳን의 신성성을 ‘거룩한’으로 반영했습니다.
- source_word: ሠናይቱ ለሰብእ
  english_pob_choice: the good of mankind
  chosen_korean: 사람들의 선한 것
  alternatives_korean:
  - 인류의 선한 것
  - 사람들의 유익
  - 인간의 좋은 것
  lexicon: Ge'ez 어휘
  rationale: 원문의 ‘선한/좋은 것’이라는 명사적 뉘앙스를 살리면서도, 특정한 정서적 해석을 덧붙이지 않도록 직역에 가깝게 처리했습니다.
- source_word: ዲበ ሕዝብ
  english_pob_choice: over the people
  chosen_korean: 사람들 위에 세워진
  alternatives_korean:
  - 백성 위에
  - 사람들 위에
  - 백성을 맡은
  lexicon: Ge'ez 전치사구
  rationale: 지배나 보호의 관할을 뜻하는 구조이므로, ‘위에 세워진’으로 권한 위임의 의미를 살렸습니다.
theological_decisions:
- issue: 미카엘의 직무를 어떻게 표현할 것인가
  chosen_reading: 미카엘은 사람들의 선한 것과 사람들 위에 세워진 천상적 감독/배치의 존재로 제시됩니다.
  alternative_readings:
  - 사람들의 유익을 맡은 자
  - 백성의 좋은 질서를 맡은 자
  - 사람들 가운데 선한 이들을 맡은 자
  rationale: 원문은 미카엘의 관할 영역을 간명하게 열거하지만, 그 정확한 관계는 다소 모호합니다. 따라서 특정 교리적 해석으로 좁히지 않고, ‘세워진’이라는 수동 표현으로 위임된 직무를 드러냈습니다.
  doctrine_reference: Source transparency; preserve ambiguity where the Ge'ez wording is difficult.
