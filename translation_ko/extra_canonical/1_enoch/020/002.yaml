  - 성스러운 천사들 가운데 하나로서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 숫자+전치사 구조는 집합 속 포함을 뜻하므로 ‘가운데 하나로서’가 자연스럽고, 천사는 Enoch 문맥에 맞게 ‘천사들’로 옮깁니다.
- source_word: ቅዱሳን
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 성인 같은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 존재를 가리키는 관용적 형용사로서 ‘거룩한’이 가장 सीधे하며, 종교적 위계를 과도하게 덧입히지 않습니다.
- source_word: ዘዓለም
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 세상 전체
  - 시대
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천사적 관할 영역을 가리키는 문맥에서 ‘세상’이 자연스럽고, ‘시대’보다 공간적 범위를 더 분명히 드러냅니다.
- source_word: ወዘተረዓድ
  english_pob_choice: and over Tartarus
  chosen_korean: 타르타로스 위에 있는
  alternatives_korean:
  - 심연 위에 있는
  - 타르타로스를 다스리는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문 말미는 OCR상 난해하지만, 기존 POB가 제시한 해석을 따라 지하세계 감옥 개념인 ‘타르타로스’를 보존하여 묵시적 우주관을 살렸습니다.
theological_decisions:
- issue: 마지막 구절의 불확실한 영역을 어떻게 처리할지
  chosen_reading: ‘타르타로스 위에 있는’으로 직역을 유지해, 천사에게 부여된 관할권 목록이라는 구조를 드러냈습니다.
  alternative_readings:
  - ‘심연 위에 있는’
  - ‘타르타로스를 다스리는’
  rationale: 문맥은 이름들에 각기 맡겨진 우주적 관할을 나열하므로, 불확실성을 평탄화하기보다 원문이 지닌 묵시적 긴장을 그대로 남기는 편이 더 충실합니다.
  doctrine_reference: 불확실한 본문은 해소하지 말고 투명하게 보존한다는 POB 원칙을 따릅니다.
