translation:
  language: ko
  text: 가브리엘[a]은 거룩한 천사들 가운데 하나로서, 낙원과 뱀들과 그룹들 위에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 전승상 이 단어는 의미가 난해하며, 전통적 이해는 ‘뱀들’에 해당하는 존재를 가리킨다고 봅니다.
    reason: lexical_alternative
