  text: Gabriʾel[a], one of the holy angels, who is over Paradise and the serpents and the cherubim.
  footnotes:
  - marker: a
    text: The term rendered 'serpents' is lexically difficult in Ethiopic transmission; some uncertainty remains, but the traditional sense in this verse points to serpentine beings.
    reason: lexical_alternative
translation:
  language: ko
  text: 가브리엘은 거룩한 천사들 가운데 하나이며, 낙원과 뱀들[a]과 그룹들을 맡고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 에티오피아어 본문에서 이 단어의 어휘적 의미는 난해합니다. 전통적으로는 뱀 또는 뱀 같은 존재를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
