base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/004.yaml
  text: Raguel[a], one of the holy angels[b], who takes vengeance on the world and on the luminaries.
  footnotes:
  - marker: a
    text: Or 'who avenges the world and the luminaries.' The underlying verb has a retributive, judicial sense.
    reason: lexical_alternative
  - marker: b
    text: '''Luminaries'' refers to the heavenly lights, likely the sun, moon, and stars as cosmic bodies within the apocalyptic worldview.'
    reason: cultural_note
translation:
  language: ko
  text: 라구엘은 거룩한 천사들 가운데 한 분으로서, 세상과 광명체들[b]을 향해 보복을 집행하시는 분이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상과 광명체들에게 원수를 갚으시는 분’으로 옮길 수 있습니다. 여기의 동사는 재판적·보응적 의미를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: ‘광명체들’은 해, 달, 별과 같은 하늘의 빛들, 곧 묵시적 우주관 속의 천체를 가리킵니다.
    reason: cultural_note
