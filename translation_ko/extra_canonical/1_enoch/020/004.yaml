base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/004.yaml
  text: Raguel[a], one of the holy angels[b], who takes vengeance on the world and on the luminaries.
  footnotes:
  - marker: a
    text: Or 'who avenges the world and the luminaries.' The underlying verb has a retributive, judicial sense.
    reason: lexical_alternative
  - marker: b
    text: '''Luminaries'' refers to the heavenly lights, likely the sun, moon, and stars as cosmic bodies within the apocalyptic worldview.'
    reason: cultural_note
translation:
  language: ko
  text: 라구엘은 거룩한 천사들 가운데 한 분으로, 세상과 광명체들에 대해 복수하시는 분입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세상과 광명체들을 복수하시는 분’으로도 옮길 수 있습니다. 여기의 동사는 재판적·보응적 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘광명체들’은 해, 달, 별과 같은 하늘의 빛들, 곧 묵시적 우주관 속의 천체를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ራጉኤል
  english_pob_choice: Raguel
  chosen_korean: 라구엘
  alternatives_korean:
  - 라겔
  - 라귀엘
  lexicon: Ge'ez onomastic/transliteration convention
  rationale: 고유명사는 번역하지 않고 음역합니다. 영어 POB의 Raguel에 맞추되, 한국어 외래어 표기 관습에 따라 라구엘로 옮겼습니다.
- source_word: ፩እምነ
  english_pob_choice: one of
  chosen_korean: 한 분으로
  alternatives_korean:
  - 하나로
  - 그중 한 천사로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부분을 나타내는 표현이므로 ‘그중 한 천사로’보다 간결하게 ‘거룩한 천사들 가운데 한 분으로’로 처리해 소속 관계를 살렸습니다.
- source_word: መላእክት ቅዱሳን
  english_pob_choice: the holy angels
  chosen_korean: 거룩한 천사들
  alternatives_korean:
  - 성스러운 천사들
  - 거룩한 영들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천사적 범주를 그대로 살리면서, 성경적 용례에 맞는 ‘거룩한 천사들’을 사용했습니다.
- source_word: ዘይትቤቀሎ
  english_pob_choice: who takes vengeance
  chosen_korean: 복수하시는 분입니다
  alternatives_korean:
  - 원수 갚으시는 분입니다
  - 보복하시는 분입니다
  - 심판하시는 분입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사는 재판적·보응적 의미가 강하므로, 영어 POB의 ‘takes vengeance’를 따라 ‘복수하다’의 엄중한 어감을 살렸습니다.
- source_word: ለዓለም
  english_pob_choice: on the world
  chosen_korean: 세상
  alternatives_korean:
  - 세상에
  - 땅에
  - 세계에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥에서 심판의 대상은 우주적 질서 아래 있는 세계이므로, ‘세상’으로 옮겨 범위를 유지했습니다.
- source_word: ለብርሃናት
  english_pob_choice: on the luminaries
  chosen_korean: 광명체들
  alternatives_korean:
  - 빛들
  - 하늘의 광명들
  - 천체들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문자적으로는 ‘빛들’이지만, 묵시문학적 우주관에서 해·달·별을 가리키는 천체를 뜻하므로 ‘광명체들’로 옮겼습니다.
theological_decisions:
- issue: 복수하다의 강도 유지
  chosen_reading: 라구엘은 세계와 광명체들에 대해 직접적인 보응 행위를 집행하는 천사로 제시됩니다.
  alternative_readings:
  - 세상과 광명체들에 대한 질서를 맡은 천사
  - 세상과 광명체들에 대해 심판을 담당하는 천사
  rationale: 문장은 단순한 관리가 아니라 재판적 보복을 말하므로, 묵시적 심판 어조를 약화시키지 않도록 ‘복수하시는 분입니다’로 유지했습니다.
  doctrine_reference: Preserve apocalyptic judgment language and avoid flattening retributive imagery.
