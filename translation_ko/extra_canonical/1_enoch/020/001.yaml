base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/001.yaml
  text: And these are the names of the holy angels who keep watch[a].
  footnotes:
  - marker: a
    text: The verb rendered 'keep watch' can also be understood as 'are vigilant' or 'watch.' In the wider context of 1 Enoch, this language overlaps with the idea of the heavenly watchers, but the verse itself presents it as a description of the angels.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이들은 깨어 지키는[a] 거룩한 천사들의 이름입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깨어 지키는’은 ‘깨어 있는’, ‘지켜보는’, 또는 단순히 ‘지키는’으로도 옮길 수 있습니다. 이 절은 천사들을 기술 용어로 부르기보다 그들의 상태와 활동을 설명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝንቱ
  english_pob_choice: And these are
  chosen_korean: 그리고 이것은
  alternatives_korean:
  - 이것들이
  - 그리고 이들은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 도입 접속과 지시를 자연스럽게 살리되, 이어지는 ‘이름들’과의 연결을 위해 한국어에서는 단수 지시어 ‘이것은’을 쓰는 것이 문장 구조상 가장 안정적입니다.
- source_word: አስማቲሆሙ
  english_pob_choice: the names
  chosen_korean: 이름입니다
  alternatives_korean:
  - 그들의 이름입니다
  - 이름들입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘그들의 이름들’이지만, 목록 도입문에서는 한국어가 보통 ‘이름입니다’로 더 자연스럽게 말하며, 소유 관계는 뒤의 관계절이 충분히 드러냅니다.
- source_word: ይተግሁ
  english_pob_choice: keep watch
  chosen_korean: 깨어 지키는
  alternatives_korean:
  - 지켜 서 있는
  - 경계하는
  - 깨어 있는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘깨어 있음’과 ‘경계함’이 함께 드러나도록 했습니다. 단순히 ‘감시하다’보다 문맥의 종말론적 경계 뉘앙스를 보존합니다.
- source_word: ቅዱሳን መላእክት
  english_pob_choice: holy angels
  chosen_korean: 거룩한 천사들
  alternatives_korean:
  - 성스러운 천사들
  - 신성한 천사들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘holy’는 여기서 천상 존재의 구별됨을 나타내므로 ‘거룩한’이 가장 सीधे적입니다. ‘천사들’은 apocalyptic 맥락에서 ‘messengers’보다 더 정확합니다.
theological_decisions:
- issue: ‘watch’ 계열 어휘를 기술용어 ‘Watchers’로 굳힐지 여부
  chosen_reading: 본문에는 기술명보다 서술적 표현인 ‘깨어 지키는’으로 유지했습니다.
  alternative_readings:
  - 감시자들
  - 워처들
  - 깨어 있는 자들
  rationale: 이 절 자체는 거룩한 천사들을 수식하는 동사적 표현을 제시할 뿐, 기술 명칭을 명시하지 않습니다. 따라서 과도한 용어 고정화보다 원문의 서술성을 우선했습니다.
  doctrine_reference: '문맥 우선 원칙: 원문이 직접 말하는 범위를 넘어 기술용어를 덧씌우지 않습니다.'
