  lexicon: Ge'ez numeral + partitive construction
  rationale: 수사와 부분 지시 구조는 집합 안의 한 구성원을 뜻하므로, 한국어에서는 자연스럽게 ‘가운데 하나로서’로 옮겨 부분성을 보존했습니다.
- source_word: ቅዱሳን መላእክት
  english_pob_choice: the holy angels
  chosen_korean: 거룩한 천사들
  alternatives_korean:
  - 성스러운 천사들
  - 거룩한 천사, 곧 …
  lexicon: Ge'ez adjective+noun phrase
  rationale: 천사들의 성별이나 기능을 더하지 않고, 정결하고 구별된 존재라는 의미를 직접적으로 살리기 위해 ‘거룩한 천사들’로 옮겼습니다.
- source_word: ዘመናፍስተ ሰብእ
  english_pob_choice: who is over the spirits of men
  chosen_korean: 사람의 영들을 맡은
  alternatives_korean:
  - 사람의 영들 위에 있는
  - 사람들의 영을 다스리는
  lexicon: Ge'ez relative clause + possession/oversight
  rationale: 원문은 통치·관리의 범위를 말하므로, 한국어에서는 과도한 해석을 피하면서도 감독/책임의 뜻이 드러나는 ‘맡은’으로 옮겼습니다.
theological_decisions:
- issue: ‘spirit(s) of men’의 범위
  chosen_reading: 여기서는 죽은 자의 혼만이 아니라 사람의 영 일반을 가리키는 넓은 표현으로 유지합니다.
  alternative_readings:
  - 죽은 자들의 영
  - 인류의 영혼
  rationale: 에티오피아어 원문은 단지 ‘사람의 영들’이라고만 말하며, 추가적인 사후 세계 해석이나 심리적 의미를 본문에 넣지 않습니다. 그래서 긴장을 풀지 않고 넓은 범주를 그대로 살렸습니다.
  doctrine_reference: 원문 우선, 해석 전통의 과잉 투사 방지
