translation:
  language: ko
  text: 라파엘[a], 곧 거룩한 천사들 가운데 하나로서 사람의 영들을 맡은 이입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인류의 영들.’ 여기서 ‘사람’에 해당하는 게에즈어는 집합적 용법이어서 남성만을 뜻하지 않을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሩፋኤል
  english_pob_choice: Raphael
  chosen_korean: 라파엘
  alternatives_korean:
  - 라파엘
  lexicon: Ge'ez personal name
  rationale: 고유명사는 번역하지 않고 음역하는 것이 원문과 POB 관례에 가장 충실합니다.
- source_word: ፩እምነ
