  yaml_path: translation/extra_canonical/1_enoch/101/001.yaml
  text: Observe heaven[a], you sons of heaven, and every work of the Most High; and fear him[b], and do not do evil before him.
  footnotes:
  - marker: a
    text: Or 'Inquire of heaven, O sons of heaven, concerning every deed of the Most High.'
    reason: lexical_alternative
