translation:
  language: ko
  text: 하늘을 살피십시오, 하늘의 아들들이여, 그리고 지극히 높으신 이의 모든 일을 살피십시오. 그분을 두려워하고, 그분 앞에서 악을 행하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘에 관해, 하늘의 아들들이여, 지극히 높으신 이의 모든 일을 살피십시오.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘하늘을 살피십시오, 하늘의 아들들이여, 모든 일을.’
    reason: previous_rendering
lexical_decisions:
- source_word: ጠይቅዋ
  english_pob_choice: Observe
