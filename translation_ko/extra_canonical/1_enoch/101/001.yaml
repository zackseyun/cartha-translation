  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절에서는 '묻다'가 아니라 대상을 주의 깊게 바라보고 고려하라는 의미가 강하므로, 직접적이고 격식 있는 '살피십시오'로 옮겼습니다.
