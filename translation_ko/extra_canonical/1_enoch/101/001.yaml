  rationale: '''work''의 범위를 좁히지 않으면서 한국어에서 가장 넓고 자연스러운 표현인 ''모든 일''을 택했습니다.'
- source_word: ለልዑል
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
