    reason: previous_rendering
translation:
  language: ko
  text: 하늘을 살피십시오, 하늘의 아들들이여. 그리고 지극히 높으신 이의 모든 일을 살피십시오. 그분을 두려워하고, 그분 앞에서 악을 행하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጠይቅዋ
  english_pob_choice: Observe
  chosen_korean: 살피십시오
  alternatives_korean:
  - 관찰하십시오
  - 살펴보십시오
  - 숙고하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절에서는 '묻다'가 아니라 대상을 주의 깊게 바라보고 고려하라는 의미가 강하므로, 직접적이고 격식 있는 '살피십시오'로 옮겼습니다.
- source_word: ለሰማይ
  english_pob_choice: heaven
  chosen_korean: 하늘을
  alternatives_korean:
  - 하늘에게
  - 하늘에 대하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 목적어로서의 하늘을 자연스럽게 드러내기 위해 '하늘을'로 처리했습니다.
- source_word: ውሉደ ሰማይ
  english_pob_choice: you sons of heaven
  chosen_korean: 하늘의 아들들이여
  alternatives_korean:
  - 하늘의 자녀들이여
  - 하늘의 아들들아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 직유적·수사적 호칭을 보존하기 위해 직역을 유지하되, 한국어에서는 호격을 드러내는 '—들이여'로 자연화했습니다.
- source_word: ወኵሎ ግብር
  english_pob_choice: every work
  chosen_korean: 모든 일
  alternatives_korean:
  - 모든 행위
  - 모든 사역
  - 모든 행동
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''work''의 범위를 좁히지 않으면서 한국어에서 가장 넓고 자연스러운 표현인 ''모든 일''을 택했습니다.'
- source_word: ለልዑል
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 이
  - 지존하신 이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님의 호칭을 한국어 경어 체계 안에서 위계를 살려 표현하되, 고전적 교회어에 과도하게 기대지 않도록 했습니다.
- source_word: ወፍርሁ እምኔሁ
  english_pob_choice: and fear him
  chosen_korean: 그분을 두려워하고
  alternatives_korean:
  - 그분을 경외하고
  - 그를 두려워하고
  - 그분을 무서워하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 fear는 단순 공포와 경외를 함께 포함하므로, 본문 명령의 강도를 유지하는 '두려워하고'를 사용했습니다.
- source_word: ወኢትግበሩ እኩየ በቅድሜሁ
  english_pob_choice: and do not do evil before him
  chosen_korean: 그분 앞에서 악을 행하지 마십시오
  alternatives_korean:
  - 그분 앞에서 악을 저지르지 마십시오
  - 그분 앞에서 악을 행하지 말십시오
  - 그분 앞에서 악을 하지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''before him''의 관계성을 살리면서, 한국어에서 가장 자연스러운 금지 표현으로 옮겼습니다.'
theological_decisions:
- issue: '''하늘의 아들들''의 지시 대상'
  chosen_reading: 직역을 유지해 수사적 호칭으로 남겨 두고, 인간인지 더 높은 존재인지 해석을 본문 번역에서 확정하지 않았습니다.
  alternative_readings:
  - 하늘의 자녀들
  - 천상의 존재들
  rationale: 문구가 의도적으로 모호하므로, 번역이 그 긴장을 지워 버리지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
