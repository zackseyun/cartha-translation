base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/006.yaml
  text: Is not the whole sea[a], and all its waters, and all its movements[c][b], the work of the Most High? And he has measured all its works and bound its shores with sand.
  footnotes:
  - marker: a
    text: The word rendered 'movements' may more specifically refer to the sea's surging or waves.
    reason: lexical_alternative
  - marker: b
    text: The final clause is textually difficult. The Ge'ez appears to say that he 'bound their foundations with sand'; this may refer to God fixing the sea's boundary.
    reason: textual_variant
  - marker: c
    text: Or 'Is not every sea, and all its waters, and all its movements, the work of the Most High? And he has measured all his works and bound their foundations with sand.'.
    reason: previous_rendering
translation:
  language: ko
  text: 온 바다가 그 모든 물과 그 모든 움직임까지도 지극히 높으신 분의 일입니까? 그분은 그 모든 일을 헤아리시고, 그 경계를 모래로 둘러막으셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘움직임’은 바다의 파도침이나 출렁임을 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 바다의 경계 또는 가장자리를 모래로 둘러막았다는 뜻으로 읽힐 수 있습니다.
    reason: textual_variant
