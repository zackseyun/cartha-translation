  rationale: 아포칼립스적 경어 칭호의 위계를 보존하되, 후대 기독교 정형구를 자동 주입하지 않도록 설명형 호칭으로 옮겼습니다.
  doctrine_reference: 하나님의 칭호는 의미를 보존해 번역하되, 전통적 교회 문구로 자동 치환하지 않는다.
