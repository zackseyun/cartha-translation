  text: Do not those kings of the sea fear the sea[b][a], while sinners do not fear the Most High?
  footnotes:
  - marker: a
    text: The phrase rendered 'those mariners' is textually difficult in the OCR'd Ge'ez. It likely refers to people who go down to the sea in ships; 'sailors' or 'seafarers' are possible alternatives.
