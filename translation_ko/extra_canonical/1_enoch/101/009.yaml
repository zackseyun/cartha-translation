base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/009.yaml
  text: Do not those kings of the sea fear the sea[b][a], while sinners do not fear the Most High?
  footnotes:
  - marker: a
    text: The phrase rendered 'those mariners' is textually difficult in the OCR'd Ge'ez. It likely refers to people who go down to the sea in ships; 'sailors' or 'seafarers' are possible alternatives.
    reason: textual_variant
  - marker: b
    text: Or 'Are not those mariners afraid of the sea, while sinners do not fear'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 바다의 왕들조차 바다를 두려워하지 않습니까? 죄인들은 오히려 지존자를 두려워하지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez 구문은 앞선 절과 동일한 ‘바다의 왕들/바다의 왕들’ 표현을 반복하는 것으로 이해하는 것이 가장 자연스럽습니다. 영어 POB의 ‘mariners’는 이 반복을 피한 임시 처리였으나, 본문 대조를 살리기 위해 여기서는 직역 쪽을 따랐습니다.
    reason: source_note
  - marker: b
    text: ‘두려워하다’는 원문에서 같은 동사가 앞뒤에 반복됩니다. 한국어에서도 동일 어근을 유지해 수사적 병행을 보존했습니다.
    reason: source_note
