translation:
  language: ko
  text: 그 뱃사람들이[a] 바다를 두려워하는데, 죄인들은 지극히 높으신 분을 두려워하지 않습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 구문은 해석이 어렵습니다. 문자적으로는 ‘배들의 왕들’로, 다른 이해에 따르면 ‘바다의 왕들’로도 옮길 수 있습니다. 여기서는 문맥에 따라 ‘뱃사람들’로 번역했습니다.
    reason: textual_variant
  - marker: b
    text: ‘두려워하다’는 원문에서 앞뒤 절에 같은 동사로 반복됩니다. 한국어 번역도 이 반복을 유지했습니다.
    reason: source_note
