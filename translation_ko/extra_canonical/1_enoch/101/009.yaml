theological_decisions:
- issue: ‘두려워하다’의 반복을 통한 수사적 대비
  chosen_reading: 바다에 대한 두려움과 지존자에 대한 두려움 없음의 대비를 그대로 유지했습니다.
  alternative_readings:
  - 바다를 무서워하다 / 하나님을 공경하지 않다
  - 바다를 경외하다 / 지존자를 경외하지 않다
  rationale: 원문은 동일한 동사를 반복해 인간의 자연스러운 공포와 죄인의 신적 무감각을 대조합니다. 이를 완화하지 않고 그대로 드러내는 것이 본문의 경고를 보존합니다.
  doctrine_reference: 수사적 평행법 보존
- issue: ልዑል의 신적 칭호 처리
  chosen_reading: ‘지존자’로 옮겨 하나님을 가리키는 고유한 호칭으로 읽히게 했습니다.
  alternative_readings:
  - 하나님
  - 가장 높으신 분
  rationale: 본문의 표현은 단순한 형용사가 아니라 신적 칭호이므로, 의미를 풀어 쓰기보다 칭호성을 살렸습니다.
  doctrine_reference: Second Temple Jewish divine title
