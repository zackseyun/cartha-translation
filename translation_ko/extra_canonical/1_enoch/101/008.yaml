base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/008.yaml
  text: Was it not he who made heaven and earth and everything that is in them? Who gave instruction and wisdom to all who move upon the earth and to those at sea?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'all that is within them.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'those at sea' may refer to seafarers or, more broadly, those associated with the sea; the Ge'ez is concise.
    reason: lexical_alternative
  - marker: c
    text: Or 'And who gave'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분께서 하늘과 땅과 그 안에 있는 모든 것을 만드시지 않았습니까?[a] 땅 위를 움직이는 모든 이와 바다에 있는 이들에게 가르침과 지혜를 주신 분은 누구입니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 안에 있는 모든 것’.
    reason: lexical_alternative
  - marker: b
    text: ‘바다에 있는 이들’은 항해하는 사람들을 가리킬 수도 있고, 더 넓게 바다와 관련된 존재들을 가리킬 수도 있습니다. 게에즈 원문은 간결합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኮኑ
  english_pob_choice: Was it not
  chosen_korean: 아니십니까?
  alternatives_korean:
  - 아닌가요?
  - 아니었습니까?
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수사적 질문으로서 동의를 기대하는 뉘앙스를 살려 공손한 반문형으로 옮겼습니다.
- source_word: ገብረ
  english_pob_choice: made
  chosen_korean: 만드신
  alternatives_korean:
  - 창조하신
  - 지으신
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 창조 행위를 가리키지만 동사가 기술적으로 제한되지 않으므로, 보다 넓고 직접적인 ‘만드신’이 원문에 가깝습니다.
- source_word: ትምህርተ
  english_pob_choice: instruction
  chosen_korean: 교훈
  alternatives_korean:
  - 가르침
  - 훈계
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지혜와 병렬되는 전달된 가르침의 의미를 살리되, 한국어에서 자연스럽고 문어적인 ‘교훈’을 택했습니다.
- source_word: ወጥበበ
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 총명
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지혜문학적 문맥에 맞는 기본 대응어로 ‘지혜’를 유지했습니다.
- source_word: ወለእለ ባሕር
  english_pob_choice: and to those at sea
  chosen_korean: 바다에 있는 것들
  alternatives_korean:
  - 바다에 있는 이들
  - 바다에 있는 사람들
  - 바다와 관련된 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 간결한 표현이 사람만을 뜻한다고 단정하지 않으므로, POB의 폭넓은 독법을 따라 ‘것들’로 열어 두었습니다.
theological_decisions:
- issue: ‘heaven and earth’와 그 안의 모든 것의 범위
  chosen_reading: 우주 전체를 포괄하는 창조물의 총칭으로 옮겼습니다.
  alternative_readings:
  - 하늘과 땅
  - 하늘들과 땅과 그 안의 모든 피조물
  rationale: 게에즈 원문의 전형적 총칭 표현을 한국어에서도 압축적으로 살려, 창조의 전범위를 나타내는 수사적 효과를 유지했습니다.
  doctrine_reference: Translation philosophy §3 preserve theological tension rather than resolve it
- issue: 수혜 대상을 인간으로만 좁힐지 여부
  chosen_reading: ‘땅 위를 움직이는 모든 것’과 ‘바다에 있는 것들’로 넓게 유지했습니다.
  alternative_readings:
  - 땅 위의 모든 사람
  - 바다에 있는 사람들
  rationale: 원문은 사람으로 한정하지 않는 넓은 범위를 허용하므로, 그 긴장을 보존하여 대상의 폭을 축소하지 않았습니다.
  doctrine_reference: Translation philosophy §1 original-language primacy over translation tradition
