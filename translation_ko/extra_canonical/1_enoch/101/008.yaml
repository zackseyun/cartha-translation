  rationale: 게에즈의 간결한 표현이 사람만을 뜻한다고 단정하지 않으므로, POB의 폭넓은 독법을 따라 ‘것들’로 열어 두었습니다.
theological_decisions:
- issue: ‘heaven and earth’와 그 안의 모든 것의 범위
  chosen_reading: 우주 전체를 포괄하는 창조물의 총칭으로 옮겼습니다.
  alternative_readings:
  - 하늘과 땅
  - 하늘들과 땅과 그 안의 모든 피조물
  rationale: 게에즈 원문의 전형적 총칭 표현을 한국어에서도 압축적으로 살려, 창조의 전범위를 나타내는 수사적 효과를 유지했습니다.
  doctrine_reference: Translation philosophy §3 preserve theological tension rather than resolve it
- issue: 수혜 대상을 인간으로만 좁힐지 여부
  chosen_reading: ‘땅 위를 움직이는 모든 것’과 ‘바다에 있는 것들’로 넓게 유지했습니다.
  alternative_readings:
  - 땅 위의 모든 사람
  - 바다에 있는 사람들
  rationale: 원문은 사람으로 한정하지 않는 넓은 범위를 허용하므로, 그 긴장을 보존하여 대상의 폭을 축소하지 않았습니다.
  doctrine_reference: Translation philosophy §1 original-language primacy over translation tradition
