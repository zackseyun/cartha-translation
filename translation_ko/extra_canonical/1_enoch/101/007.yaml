base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/007.yaml
  text: And at his rebuke it will be afraid and dry up[a], and all its fish will die, and everything that is in it[c][b]. But you sinners who are upon the earth do not fear him.
  footnotes:
  - marker: a
    text: The repeated 'it' likely refers to the sea or waters in the preceding verse. The Ge'ez keeps the reference implicit.
    reason: cross_reference
  - marker: b
    text: The final line is literally 'you sinners who are upon the earth do not fear it,' probably contrasting the fear of creation under rebuke with the fearlessness of the wicked.
    reason: lexical_alternative
  - marker: c
    text: Or 'And at its rebuke it will be afraid and dry up, and all its fish will die, and everything that is in it. But you sinners who are upon the earth do not fear it.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 책망으로 그것은 두려워하고 마를 것이며, 그 안의 모든 물고기가 죽고 그 안에 있는 모든 것이 죽을 것입니다. 그러나 땅 위에 있는 너희 죄인들아, 그를 두려워하지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 책망’의 ‘그’는 게으즈어의 남성 단수 소유 접미사에 따라 하나님을 가리킵니다. 반면 두려워하고 마르는 ‘그것’은 문맥상 앞 절의 바다 또는 물을 가리키며, 게으즈어에서는 여성 단수로 표시됩니다.
    reason: grammatical_note
  - marker: b
    text: 마지막 말은 문자적으로 ‘그를 두려워하지 마십시오’입니다. 목적어는 남성 단수로 표시되어 바다가 아니라 하나님을 가리킵니다.
    reason: grammatical_note
lexical_decisions:
- source_word: በተግሣጹ
  english_pob_choice: at his rebuke
  chosen_korean: 그의 책망 앞에서
  alternatives_korean:
  - 그의 책망으로
  - 그의 꾸지람 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 접두사 በ와 명사 ተግሣጽ의 결합은 원인·상황을 나타내며, 문맥상 창조세계가 하나님의 질책 앞에 반응하는 장면이므로 ‘그의 책망 앞에서’가 자연스럽습니다.
- source_word: ትፈርህ / ትየብስ
  english_pob_choice: it will be afraid and dry up
  chosen_korean: 그것은 두려워하고 마르며
  alternatives_korean:
  - 그것은 두려워하며 말라버릴 것입니다
  - 그것은 무서워하고 메말라질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사는 바다/물의 의인화된 반응과 건조를 그대로 살려야 하므로, ‘두려워하고 마르며’로 직역에 가깝게 옮겼습니다.
- source_word: ዓሣቲሃ / ኵሉ ዘሀሎ ውስቴታ
  english_pob_choice: all its fish will die, and everything that is in it
  chosen_korean: 그 안에 있는 모든 물고기가 죽을 것입니다
  alternatives_korean:
  - 그 안에 있는 모든 생물이 죽을 것입니다
  - 그 안의 모든 물고기와 모든 것이 죽을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문은 물고기를 먼저 들고 뒤의 포괄구가 이를 확장하므로, 한국어에서는 중복을 피하되 ‘그 안에 있는’이라는 범위를 유지해 전체 파괴를 드러냈습니다.
- source_word: ኢትፈርህዎ
  english_pob_choice: do not fear him
  chosen_korean: 그를 두려워하지 마십시오
  alternatives_korean:
  - 그를 무서워하지 마십시오
  - 그것을 두려워하지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서 목적어 대명사는 앞의 바다가 아니라 하나님을 가리키는 남성 단수로 이해하는 것이 문법상 타당하므로, ‘그를’로 옮겨 경고의 초점을 보존했습니다.
theological_decisions:
- issue: 창조물인 바다와 하나님의 구분
  chosen_reading: ‘그의’와 ‘그를’을 각각 하나님을 가리키는 남성 단수로 번역하여, 바다의 의인화와 하나님의 주권적 책망을 분명히 구분했습니다.
  alternative_readings:
  - 두 대명사를 모두 ‘그것’으로 평준화하는 번역
  - 둘 다 바다를 가리키는 것으로 읽는 번역
  rationale: 게으즈어는 책망의 주체와 두려움의 대상에서 성별 표지를 구분하므로, 이를 구분하지 않으면 본문의 신학적 긴장—창조는 떨지만 죄인은 떨지 않음—이 흐려집니다.
  doctrine_reference: 하나님의 주권과 심판 앞에서의 피조세계와 죄인의 대비를 보존합니다.
