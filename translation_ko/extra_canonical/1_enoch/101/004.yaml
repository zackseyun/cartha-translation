base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/004.yaml
  text: Have you not seen the captains of the ships[a], how they are tossed by the waves, and their ships are shaken by the winds[c][b], and they are distressed?
  footnotes:
  - marker: a
    text: The phrase rendered 'from the movement of their souls' is difficult. The underlying words may also suggest 'from the winds' or 'from their spirits/minds.'
    reason: lexical_alternative
  - marker: b
    text: The image likely points to wealthy or powerful seafarers whose apparent security collapses under judgment; the verse may also imply the inner panic of the powerful when their stability fails.
    reason: cultural_note
  - marker: c
    text: Or 'the kings of the ships, how they are tossed from side to side and are shaken from the movement of their souls'.
    reason: previous_rendering
translation:
  language: ko
  text: 배의 선장들이 어떻게 파도에 휩쓸리고, 그들의 배들이 바람에 흔들리며, 그들이 괴로워하는지를 보지 못하였습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትሬእይዎሙኑ
  english_pob_choice: Have you not seen
  chosen_korean: 보지 못하였습니까?
  alternatives_korean:
  - 보지 않았습니까?
  - 보이지 않습니까?
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수사 의문형의 경고적 어조를 살리면서, 현대 한국어에서 자연스러운 과거 완료형 질문으로 옮겼습니다.
- source_word: ተነገሥተ፡ አሕማር
  english_pob_choice: the captains of the ships
  chosen_korean: 배들의 선장들
  alternatives_korean:
  - 배들의 왕들
  - 배의 지휘자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 교정된 어휘상 이 표현은 선박을 지휘하는 사람들을 가리키므로, 직역적인 ‘왕들’보다 문맥에 맞는 ‘선장들’이 원문의 구체적 장면을 더 잘 드러냅니다.
- source_word: ይትሀወኩ እምሞገድ
  english_pob_choice: they are tossed by the waves
  chosen_korean: 파도에 휩쓸리고
  alternatives_korean:
  - 파도에 던져지고
  - 물결에 흔들리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 교정본이 가리키는 ‘파도’의 능동적 교란을 살리기 위해, 단순한 ‘흔들리다’보다 ‘휩쓸리다’를 선택했습니다.
- source_word: ወያንቀለቅሉ እምነፋሳት
  english_pob_choice: and their ships are shaken by the winds
  chosen_korean: 그들의 배가 바람에 흔들리며
  alternatives_korean:
  - 그들의 배가 바람에 요동치며
  - 그들의 배가 바람에 흔들리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘바람에’로 원문의 원인 구문을 살리고, ‘흔들리며’로 앞의 파도 이미지와 병렬되는 선박의 동요를 자연스럽게 연결했습니다.
- source_word: ወይትመነደቡ
  english_pob_choice: and they are distressed
  chosen_korean: 그들이 고통을 당하는지
  alternatives_korean:
  - 그들이 괴로워하는지
  - 그들이 괴로움에 빠지는지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종결부의 내적·외적 고통을 포괄하는 표현으로 ‘고통을 당하다’를 택해, 단순한 감정 동요보다 더 강한 판단/재난의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 이 절의 이미지가 문자적 해상 장면인지, 권세자의 불안정에 대한 비유인지
  chosen_reading: 본문의 배와 바람, 파도 이미지는 그대로 유지하되, 그 함의는 독자가 판단하도록 열어 둡니다.
  alternative_readings:
  - 권세자들의 정치적 불안정으로만 옮기기
  - 내면의 심리적 공포로만 바꾸기
  rationale: 수정된 게으즈 본문과 영어 POB 주석이 모두 구체적 항해 이미지를 지지하므로, 이미지를 설명적으로 평탄화하지 않는 것이 원문 충실도에 더 부합합니다.
  doctrine_reference: 해석학/비유적 이미지 보존
