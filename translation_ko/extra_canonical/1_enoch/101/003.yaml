  source_fidelity: 본문은 አኮ를 긍정 답변을 기대하는 수사 의문문으로 처리하여, 심판 때 그분께 간청하게 될 것이라는 뜻을 적절히 보존합니다. ‘진노를 보내신다면’, ‘모든 행위 때문에’, ‘그분의 의를 거슬러’, ‘크고 거친 말’도 게에즈어 및 영어 POB의 확정 독법에 충실합니다. 다만 각주 d의 ‘크고 거칠며 오만한’은 영어 감사 기록의 대안인 ‘proud and insolent’에 ‘크고 거친’을 부가해, 대안 독법을 정확히 제시하지 못합니다.
  naturalness: ‘말하며’보다 문장을 분리한 ‘말합니다’가 현대 한국어 합쇼체에서 더 자연스럽습니다. ‘평안이 없습니다’는 원문의 ‘no peace’를 자연스럽고 과도한 신학적 함의 없이 옮깁니다.
  terminology: ‘진노’, ‘의’, ‘간청’은 심판 및 탄원의 문맥에 적절합니다. ‘그분’과 높임 표현도 요청된 현대적 격식체에 일관됩니다. ‘평강’도 가능하나, 여기서는 일반적 결핍을 나타내는 원문에 ‘평안’이 더 중립적입니다.
