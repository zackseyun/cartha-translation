base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/003.yaml
  text: And if he sends his wrath upon you for all your deeds[a], will you not entreat him? For you speak great and harsh words against his righteousness[d][c][b], and you have no peace.
  footnotes:
  - marker: a
    text: Or 'you are not those who can seek his favor.' The Ge'ez verb can denote imploring or making supplication.
    reason: lexical_alternative
  - marker: b
    text: '''His righteousness'' may also be understood as ''his justice'' in this context of judgment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'you are not those who can entreat him'.
    reason: previous_rendering
  - marker: d
    text: Or 'proud and insolent words'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분이 여러분의 모든 행위 때문에 여러분에게 진노를 보내신다면, 여러분이 그분께 간청하지 않겠습니까? 여러분은 그분의 의를 거슬러 크고 거친 말을 하며, 여러분에게는 평강이 없습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 그의 호의를 구할 수 있는 자들이 아닙니까?’로 옮길 수 있습니다. 게에즈 동사는 간청하거나 탄원하는 뜻을 가질 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘의’는 문맥상 ‘정의’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여러분은 그분께 간청할 수 있는 자들이 아닙니까?’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘크고 거칠며 오만한 말’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈነወ
  english_pob_choice: sends
  chosen_korean: 보내신다면
  alternatives_korean:
  - 내려보내신다면
  - 풀어놓으신다면
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 ፈነወ의 기본 뜻은 ‘보내다’이므로, 진노를 ‘보내다’로 옮겨 원문의 방향성을 살렸습니다.
- source_word: መዐቶ
  english_pob_choice: wrath
  chosen_korean: 진노
  alternatives_korean:
  - 분노
  - 격노
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 맥락에서 하나님의 감정 상태보다 심판적 분개를 드러내는 ‘진노’가 가장 적합합니다.
- source_word: ታስተበቍዕዎ
  english_pob_choice: will you not entreat him?
  chosen_korean: 그분께 간청하지 않겠습니까?
  alternatives_korean:
  - 그분께 애원하지 않겠습니까?
  - 그분께 간구하지 않겠습니까?
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 간청·탄원을 뜻하므로, 법정적·개인적 호소를 함께 살릴 수 있는 ‘간청하다’를 택했습니다.
- source_word: ዐቢይተ ወጽኑዓተ
  english_pob_choice: great and harsh words
  chosen_korean: 크고 거친 말
  alternatives_korean:
  - 크고 강한 말
  - 거칠고 완고한 말
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서에서 반복되는 관용구로, 문자적으로 ‘크고 거친’이라는 형용사를 살려 블라스페미적 언사를 보존했습니다.
- source_word: ጽድቅ ዚአሁ
  english_pob_choice: his righteousness
  chosen_korean: 그분의 의
  alternatives_korean:
  - 그분의 의로움
  - 그분의 정의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아들의 인격적 덕목이 아니라 하나님의 올바르심/의로움을 가리키는 표현이므로, 한국어 성경의 표준 대응인 ‘의’를 사용했습니다.
theological_decisions:
- issue: 수사적 질문 አኮ의 기능
  chosen_reading: 여러분이 그분께 간청하지 않겠습니까?
  alternative_readings:
  - 여러분은 그분께 간청하지 못하는 자들이 아닙니까?
  - 여러분이 그분께 간청할 수 없겠습니까?
  rationale: 문맥상 አኮ는 단순 부정이 아니라 기대 답변을 요구하는 수사적 질문으로 읽는 것이 자연스럽습니다. 따라서 절망적 심판 상황에서 ‘간청하게 될 것’이라는 뉘앙스를 살렸습니다.
  doctrine_reference: Ge'ez particle አኮ의 수사적 용법
