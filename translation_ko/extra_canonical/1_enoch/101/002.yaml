base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/002.yaml
  text: If he shuts the windows of heaven[a], and withholds the rain and the dew so that it does not come down upon the earth because of you[c][b], what will you do?
  footnotes:
  - marker: a
    text: The imagery of 'the windows of heaven' reflects ancient cosmological language for the source of rain; the translation preserves the image rather than reducing it to a modern meteorological expression.
    reason: cultural_note
  - marker: b
    text: The final clause is a rhetorical question. It may also be rendered more literally, 'what is it that you will do?'
    reason: lexical_alternative
  - marker: c
    text: Or 'And if he shuts'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 하늘의 창문들을 닫고[a] 비와 이슬이 너희 때문에 땅 위로 내려오지 못하도록 거두시면, 너희는 어찌하겠습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 창문들’은 비가 오는 근원에 대한 고대 우주론적 이미지이므로, 현대적 기상 표현으로 바꾸지 않고 그대로 살렸습니다.
    reason: cultural_note
  - marker: b
    text: 이 구절의 마지막은 수사적 질문입니다. 더 문자적으로는 ‘너희는 무엇을 하겠습니까?’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መስኮተ ሰማይ
  english_pob_choice: the windows of heaven
  chosen_korean: 하늘의 창문들
  alternatives_korean:
  - 하늘의 창들
  - 하늘의 창문
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고대적 우주론 이미지를 살리기 위해 ‘창문’ 이미지를 유지했고, 복수형을 반영해 ‘창문들’로 옮겼습니다.
- source_word: ዐፀወ
  english_pob_choice: shuts
  chosen_korean: 닫고
  alternatives_korean:
  - 잠그고
  - 가로막고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 하늘의 개구부를 닫는 직접적 동작이므로 가장 자연스러운 ‘닫다’를 택했습니다.
- source_word: ከለአ ዝናመ / ወጠለ
  english_pob_choice: withholds the rain and the dew
  chosen_korean: 비와 이슬을 거두어
  alternatives_korean:
  - 비와 이슬을 막아
  - 비와 이슬을 거두지 않으시어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘거두다’는 주지 않거나 거두어들이는 뜻을 자연스럽게 담아, 비와 이슬을 함께 멈추는 의미를 압축해 살렸습니다.
- source_word: በእንቲአክሙ
  english_pob_choice: because of you
  chosen_korean: 너희 때문에
  alternatives_korean:
  - 너희를 위하여
  - 너희로 말미암아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판의 원인이라는 인과가 핵심이므로, 보호적 뉘앙스가 강한 ‘위하여’보다 ‘때문에’가 더 정확합니다.
