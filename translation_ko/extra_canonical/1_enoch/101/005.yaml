  source_fidelity: 대체로 게으즈의 현재적·일반적 서술과 구체적인 바다의 이미지를 잘 반영합니다. 그러나 마지막 동사구 ‘가라앉게 할 것입니다’는 바다가 그들을 가라앉히게 한다는 사역 의미를 더하며, 원문의 ‘그들이 그 안에서 가라앉는다’와 다릅니다.
