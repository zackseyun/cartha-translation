  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 물리적 하강 이미지를 살리되, 앞절의 경고적 미래와 맞추어 ‘가라앉게 할 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘좋은’(ሠናየ)의 초점이 재물인지 마음의 선함인지의 모호성
  chosen_reading: 본문은 그들의 재물과 그들의 내적 반응을 함께 보이면서, 바다 앞에서 재물은 함께 사라지고 마음은 선한 생각을 하지 못하는 장면으로 읽었습니다.
  alternative_readings:
  - ‘좋은 재물’만을 가리키는 표현으로 볼 수 있습니다
  - ‘마음에 선한 것을 생각하지 않는다’는 뜻으로만 읽을 수 있습니다
  rationale: 게으즈 표현이 외적 재물과 내적 판단 사이를 동시에 열어 두므로, 한쪽으로만 확정하지 않고 두 층위를 함께 보이도록 옮겼습니다.
  doctrine_reference: 해석의 긴장을 보존하고, 본문이 허용하는 범위를 넘지 않도록 합니다.
