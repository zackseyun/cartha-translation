base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/010.yaml
  text: 'And now[a], my father, hear me: a son has been born to Lamech my son, and his appearance and form are not like the form of a human being. His color is whiter than snow and redder than the blossom of a rose, and the hair of his head is whiter than white wool. And his eyes are like the rays of the sun[c][b]; and he opened his eyes and lit up the whole house.'
  footnotes:
  - marker: a
    text: The flower term in 'redder than a rose blossom' may refer more generally to a red blossom; the exact species identification is uncertain.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'like the rays of the sun' is difficult in Ge'ez; the sense is clearly one of solar brightness.
    reason: lexical_alternative
  - marker: c
    text: Or 'and he is not like a human being in his appearance and in the form of his making.'.
    reason: previous_rendering
translation:
  language: ko
  text: “이제, 내 아버지여, 제 말을 들으십시오. 내 아들 라멕에게 아들이 태어났습니다. 그의 모습과 형체는 사람의 형체와 같지 않습니다. 그 빛깔은 눈보다 더 희고 장미꽃[a]보다 더 붉으며, 그의 머리털은 흰 양털보다 더 희고, 그의 눈은 해의 광선[b]과 같습니다. 그는 눈을 뜨고 온 집안을 밝게 비추었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장미꽃’에 해당하는 꽃 표현은 더 일반적인 붉은 꽃을 가리킬 수도 있어, 정확한 식물 종은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해의 광선’으로 옮긴 구절은 게에즈 원문이 난해하지만, 문맥상 분명한 태양의 광채를 가리킵니다.
    reason: lexical_alternative
