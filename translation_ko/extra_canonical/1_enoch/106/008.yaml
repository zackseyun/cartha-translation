- source_word: ሰምዐ
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들어 보았습니다
  - 귀 기울였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본 청각 동사이므로 ‘들었습니다’로 옮겨 사건의 순서를 자연스럽게 살렸습니다.
- source_word: ውስተ አጽናፈ ምድር
