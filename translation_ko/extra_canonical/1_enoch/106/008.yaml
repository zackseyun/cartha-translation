  chosen_korean: 땅의 끝까지
  alternatives_korean:
  - 땅의 끝에
  - 세상의 끝까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적·우주론적 지리 감각을 살리되 한국어로는 간결하게 ‘땅의 끝’으로 옮겼습니다.
- source_word: ጸርኀ / ቃሎ
  english_pob_choice: cried out / his voice
  chosen_korean: 소리쳐 불렀고 / 그의 목소리
  alternatives_korean:
  - 외쳐 부르셨고 / 그의 소리
  - 부르짖었고 / 그의 소리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 동사는 강한 호출의 뉘앙스를 살려 ‘소리쳐 불렀고’로, 이어지는 ‘voice’는 청각 문맥에 맞게 ‘목소리’로 옮겼습니다.
- source_word: ናሁ ሀለውኩ
  english_pob_choice: Behold, I am here
  chosen_korean: 보십시오, 내가 여기 있습니다
  alternatives_korean:
  - 보라, 내가 여기 있습니다
  - 보십시오, 내가 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접화법의 장중함을 유지하면서 현대 한국어에서 자연스러운 공손한 호명으로 처리했습니다.
- source_word: እስመ መጻእከ ኀቤየ
  english_pob_choice: Why have you come to me?
  chosen_korean: 왜 내게 왔습니까?
  alternatives_korean:
  - 무슨 이유로 내게 왔습니까?
  - 어찌하여 내게 왔습니까?
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시문구가 문자적으로는 ‘왜/무엇 때문에’이지만 문맥상 목적 질문으로 기능하므로 한국어도 자연스러운 질문형으로 옮겼습니다.
theological_decisions:
- issue: 직접화법의 존칭 수준
  chosen_reading: 서술문은 합쇼체로 유지하고, 아버지가 아들에게 말하는 장면의 직접호칭은 ‘내 아들아’로 보존했습니다.
  alternative_readings:
  - 전면적 반말 처리
  - 전면적 존대 처리
  rationale: 본문의 친족적·대화적 긴장을 살리기 위해 서술은 공손체, 호칭은 원문의 친밀성을 드러내는 방식으로 구분했습니다.
  doctrine_reference: 문체는 본문 의미를 훼손하지 않는 범위에서 장면의 관계성을 드러내야 합니다.
