base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
  footnotes:
  - marker: a
    text: The opening may also be understood more loosely as 'after a time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 몇 날이 지난 뒤에 그의 아들 라멕을 위해 메투셀라가 아내를 얻었고[a], 그녀는 그를 통해 임신하여 아들을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 앞부분은 더 느슨하게는 ‘어느 때가 지나서’로도 옮길 수 있습니다.
    reason: lexical_alternative
