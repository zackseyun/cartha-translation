base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
  footnotes:
  - marker: a
    text: The opening may also be understood more loosely as 'after a time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 몇 날이 지난 뒤에 메투셀라는 자기 아들 라멕을 위하여 아내를 얻었고[a], 그 아내는 라멕에게서 임신하여 아들을 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 앞부분은 더 넓게는 ‘어느 때가 지나서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ መዋዕል
  english_pob_choice: after some days
  chosen_korean: 몇 날이 지난 뒤에
  alternatives_korean:
  - 후에
  - 어느 날이 지나고
  - 몇 날 후에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간의 경과를 나타내는 관용구를 한국어에서도 자연스럽게 살리되, 문어체의 흐름을 유지했습니다.
- source_word: ነሥአ
  english_pob_choice: took
  chosen_korean: 아내를 얻었고
  alternatives_korean:
  - 아내를 데려왔고
  - 아내를 취했고
  - 아내를 맞이했고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결혼 맥락에서 ‘take a wife’는 단순히 ‘데려오다’보다 혼인 성사를 뜻하는 표현이므로, 한국어에서도 관계의 성립을 드러내는 ‘아내를 얻다’를 택했습니다.
- source_word: ወፀንሰት እምኔሁ
  english_pob_choice: she conceived by him
  chosen_korean: 그녀는 그를 통해 임신하여
  alternatives_korean:
  - 그에게서 잉태하여
  - 그로 말미암아 임신하여
  - 그에게서 아이를 배어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘임신하다’가 현대 한국어에서 가장 분명하며, ‘그를 통해’는 아버지 표지를 보존하면서도 과도하게 해설하지 않습니다.
- source_word: ወወለደት ወልደ
  english_pob_choice: and bore a son
  chosen_korean: 아들을 낳았습니다
  alternatives_korean:
  - 아들을 출산했습니다
  - 아들을 낳았고
  - 한 아들을 낳았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서술체에 맞는 자연스러운 종결로, 원문의 간결한 서사 진행을 보존합니다.
theological_decisions:
- issue: 주어-목적어 관계의 보존
  chosen_reading: 메투셀라가 라멕을 위해 아내를 얻었다
  alternative_readings:
  - 라멕이 아내를 얻었다
  - 메투셀라의 아들 라멕이 아내를 얻었다
  rationale: 게에즈 구문은 메투셀라를 주어로, 라멕을 ‘그의 아들’로 표시하는 것이 가장 자연스럽기 때문에, 가족 혼인 주선의 장면을 그대로 살렸습니다.
  doctrine_reference: 본문의 평이한 서술과 구문 구조를 우선 보존하고, 후대의 익숙한 족보식 이해로 평준화하지 않습니다.
