base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/012.yaml
  text: And his father Lamech was afraid[a], and he fled to me, and he did not believe that he was from him, but that his likeness was like the angels of heaven. And behold[b], I have come to you so that you may make righteousness known to me.
  footnotes:
  - marker: a
    text: Or 'righteousness' or 'what is right.' The Ge'ez noun can carry moral or juridical force, but here likely means the true explanation Lamech seeks.
    reason: lexical_alternative
  - marker: b
    text: Or 'and he believed that he was not from him but in the likeness of the angels of heaven.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아버지 라멕은 두려워하여 내게 도망해 왔고, 그는 자기가 그에게서 난 것이라고 믿지 않았으나, 그의 모습이 하늘의 천사들과 같다고 생각했습니다. 보십시오, 제가 당신에게 온 것은 당신이 제게 의를 알게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의’, ‘옳은 것’. 게으즈어 명사는 도덕적·법적 의미를 둘 다 가질 수 있지만, 여기서는 라멕이 구하는 참된 설명의 뜻이 더 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그는 자기가 그에게서 나지 않았고, 하늘의 천사들과 같은 모습이라고 믿지 않았다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ፈርሀ
  english_pob_choice: was afraid
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 두려움을 느껴
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 두려움 동사를 자연스러운 현대 한국어로 옮기되, 서술의 긴박함을 유지하기 위해 ‘두려워하여’를 택했습니다.
- source_word: ጐየ
  english_pob_choice: fled
  chosen_korean: 도망해 왔고
  alternatives_korean:
  - 달아나 왔고
  - 급히 왔고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 공포에 떠밀린 도주를 나타내므로, ‘도망해 왔고’가 가장 직접적입니다.
- source_word: አምሳሉ እመላእክተ ሰማይ
  english_pob_choice: his likeness was like the angels of heaven
  chosen_korean: 그의 모습이 하늘의 천사들과 같다고
  alternatives_korean:
  - 그의 형상이 하늘의 천사들과 같다고
  - 하늘의 천사들의 모습과 닮았다고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 핵심은 본질 단정이 아니라 ‘닮음’이므로, 관계절을 통해 비교 의미를 살리고 ‘모습’으로 አምሳሉ의 표지를 반영했습니다.
- source_word: ታይድዐኒ ጽድቀ
  english_pob_choice: make righteousness known to me
  chosen_korean: 제게 의를 알게 하려는 것입니다
  alternatives_korean:
  - 제게 의를 알려 주려는 것입니다
  - 제게 옳은 것을 알게 하려는 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጽድቀ는 ‘의’로도, ‘옳은 것/진실한 설명’으로도 읽힐 수 있지만, POB의 본문 선택을 따라 ‘의’를 유지하되 한국어에서는 ‘알게 하다’로 자연화했습니다.
theological_decisions:
- issue: 하늘의 천사들과의 비교를 본문이 무엇까지 말하는가
  chosen_reading: 본문은 아이의 기원을 직접적으로 천사에서 났다고 단정하지 않고, 그의 모습이 하늘의 천사들과 ‘같다’는 비교로 유지했습니다.
  alternative_readings:
  - 천사들 가운데서 난 것이라고 보기
  - 천사들의 자손이라고 읽기
  rationale: 게으즈어의 표현은 አምሳሉ(‘그의 모습/닮음’)를 통해 유사성을 말하므로, 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 원문의 비교적 표현을 보존하여 천사 출생 여부를 번역이 앞서 확정하지 않도록 함.
