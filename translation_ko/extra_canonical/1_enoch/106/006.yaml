base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/006.yaml
  text: And it seems to me that he is not from me, but from the angels; and I fear that a wonder might be done in his days upon the earth.
  footnotes:
  - marker: a
    text: Or 'a marvel' or 'a prodigy.' The Ge'ez term denotes an extraordinary or uncanny event.
    reason: lexical_alternative
  - marker: b
    text: Or 'And it seemed to me that he was not from me, but from the angels; and I was afraid'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 제게는 그가 제 아이가 아니라 천사들에게서 난 아이인 듯합니다. 또 그가 사는 동안 땅 위에서 기이한 일이 일어날까 두렵습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경이로운 일’, ‘이적’. 게에즈어는 평범하지 않은 비범하거나 기이한 사건을 가리킵니다.
    reason: lexical_alternative
