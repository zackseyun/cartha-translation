  source_fidelity: 첫 절의 주어·기원 관계가 초안에서 뒤바뀌었습니다. 게에즈어는 화자가 ‘그가 나에게서 난 아이가 아니라 천사들에게서 난 아이’라고 의심하는 내용인데, ‘그에게서 난 것이 아니라’는 ‘그에게서’라는 반대 방향의 기원을 뜻합니다. 또한 ‘것처럼 보입니다’보다 ‘제게는 … 듯합니다’가 ይመስለኒ의 화자 개인의 판단을 더 명확히 보존합니다. 후반의 불확정적 두려움은 ‘일어날까 두렵습니다’로 적절히 옮길 수 있습니다.
  naturalness: ‘제게는 그가 제 아이가 아니라 천사들에게서 난 아이인 듯합니다’는 현대 표준어 합쇼체로 자연스럽고, 친자 관계에 대한 화자의 불안한 추정을 분명히 합니다. ‘그가 사는 동안’은 ‘그의 날들에’의 시간적 뜻을 자연스럽게 표현합니다.
  terminology: ‘천사들’과 ‘땅 위’는 원문의 묵시적·우주적 범위를 유지합니다. መንክር는 긍정적 찬탄으로 한정되지 않는 비범하고 불가사의한 사건이므로 ‘기이한 일’을 유지하며, 대안어는 각주로 제시합니다.
  issues:
