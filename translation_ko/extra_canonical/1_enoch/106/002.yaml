theological_decisions:
- issue: 초자연적 광휘를 단순한 ‘아름다움’으로 약화시킬지 여부
  chosen_reading: 몸의 색채와 머리털, 눈의 아름다움, 그리고 눈을 뜰 때 집이 해처럼 밝아지는 광경을 구체적으로 유지했습니다.
  alternative_readings:
  - 아주 아름다운 외모를 가진 아이라는 식으로 일반화
  - 눈부신 빛의 묘사를 줄여 비유적으로 완화
  rationale: 본문은 묵시적이고 기이한 출생 표지로 읽히므로, 구체적 광휘 이미지를 보존하는 편이 원문의 힘에 충실합니다.
  doctrine_reference: 'Translation philosophy: apocalyptic imagery should remain concrete and startling.'
