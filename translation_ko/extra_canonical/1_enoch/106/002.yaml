base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/002.yaml
  text: And his body was white like snow[a], and red like the blooming of a rose; and the hair of his head was like white wool, and his locks were beautiful. And his eyes were beautiful; and when he opened his eyes, he lit up the whole house like the sun[c][b], and the whole house became exceedingly bright.
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'the blooming of a rose' is a floral comparison for redness; 'rose blossom' is also possible.
    reason: lexical_alternative
  - marker: b
    text: The clause about the eyes is textually difficult in Ethiopic. The sense 'his eyes were beautiful' fits the immediate wording, but a slightly different nuance such as 'his eyes were splendid' is possible.
    reason: textual_variant
  - marker: c
    text: Or 'and the hair of his head was white like wool, and his eyes were beautiful.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 몸은 눈처럼 희고[a], 장미꽃이 피어나는 것처럼 붉었으며, 머리털은 흰 양털 같았고, 그의 곱슬머리[b]는 아름다웠습니다. 그의 눈도 아름다웠습니다. 그리고 그가 눈을 뜨자 해처럼 온 집이 밝아졌고, 온 집이 몹시 환해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '게어즈어의 ‘장미의 피어남’은 붉은색을 나타내는 꽃의 비교 표현입니다. '
    reason: lexical_alternative
  - marker: b
    text: 게어즈어 본문은 머리털과 별도로 ‘곱슬머리/locks’의 아름다움을 말하는 것으로 읽을 수 있습니다.
    reason: textual_variant
