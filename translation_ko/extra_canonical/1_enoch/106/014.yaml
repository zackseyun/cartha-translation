base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/014.yaml
  text: And they will commit sin[a], and they will transgress the ordinance; and they will join themselves with women and commit sin with them, and they will take wives from among them[c][b], and they will beget children.
  footnotes:
  - marker: a
    text: The closing clause is uncertain in this Ethiopic witness. The repeated 'from them and from them' may preserve emphasis, corruption, or a variant reading in the transmission.
    reason: textual_variant
  - marker: b
    text: The phrase 'join themselves with women' likely refers to illicit union in context, but the wording is broader than an explicitly sexual verb.
    reason: lexical_alternative
  - marker: c
    text: Or 'and they will be separated from them and from them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 죄를 짓고 규례를 어길 것이며, 여자들과 어울려[a] 그들과 함께 죄를 짓고, 그들 가운데서 아내들을 맞아들일 것이며, 자녀를 낳을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여자들과 어울려’는 원문의 폭넓은 동사를 따른 표현으로, 반드시 노골적인 성행위 동사를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብሩ / ኀጢአተ
  english_pob_choice: they will commit sin
  chosen_korean: 죄를 짓고
  alternatives_korean:
  - 죄를 범하고
  - 죄를 저지르고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사+목적어 결합이 관용적으로 ‘죄를 짓다’의 뜻이므로, 한국어에서도 자연스럽고 직접적으로 옮겼습니다.
- source_word: የኀልፉ / ሥርዐተ
  english_pob_choice: they will transgress the ordinance
  chosen_korean: 규례를 어길 것이며
  alternatives_korean:
  - 명령을 어길 것이며
  - 법도를 어길 것이며
  - 율법을 어길 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 정해진 질서나 규범의 위반이므로, 너무 특정한 ‘율법’보다 ‘규례’가 더 안전하게 원문 범위를 살립니다.
- source_word: ተደመሩ / አንስት
  english_pob_choice: they will join themselves with women
  chosen_korean: 여자들과 어울려
  alternatives_korean:
  - 여자들과 결합하여
  - 여자들과 함께하여
  - 여자들과 짝지어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 동사는 단순한 접촉보다 자발적 결합·교제를 뜻할 수 있어, 성적 행위를 지나치게 노골화하지 않으면서도 문맥의 불법적 결합을 드러내는 표현으로 옮겼습니다.
- source_word: አውሰቡ
  english_pob_choice: they will take wives from among them
  chosen_korean: 그들 가운데서 아내들을 맞아들일 것이며
  alternatives_korean:
  - 그들 가운데서 아내들을 취할 것이며
  - 그들 중에서 아내들을 데려올 것이며
  - 그들 가운데서 아내들을 맞이할 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 ‘아내를 취하다/맞아들이다’의 의미이므로, 한국어에서는 혼인 결합을 드러내는 ‘맞아들이다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여자들과의 결합을 얼마나 노골적으로 표현할 것인가
  chosen_reading: ‘어울려’와 ‘함께 죄를 짓고’로 옮겨, 본문의 도덕적 비난은 살리되 원문이 요구하는 범위를 넘어 노골화하지 않았습니다.
  alternative_readings:
  - ‘간음하여’
  - ‘성적으로 관계하여’
  - ‘결혼하여’
  rationale: 원문은 불법적 결합을 분명히 말하지만, 구체적 성행위 동사를 직접 쓰지는 않습니다. 그래서 해석을 과잉하지 않으면서 죄책성을 유지하는 번역이 필요합니다.
  doctrine_reference: 원문이 허용하는 범위 안에서만 의미를 확정하고, 해석이 아닌 경우에는 긴장을 보존합니다.
