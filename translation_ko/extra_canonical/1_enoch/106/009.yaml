  rationale: 단순한 이동보다 '가까이'의 방향성을 살려, 앞선 '그대에게 왔고'와 병행되면서도 마지막 절의 반복적 근접 동작을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ጻህቅ의 의미를 '고통/distress'로 볼 것인지
  chosen_reading: 이 절은 원인이나 동기를 나타내는 추상적 표현으로 이해하여 '큰 고통'으로 번역했습니다.
  alternative_readings:
  - 큰 어려움
  - 큰 급박함
  - 의에 대한 큰 일
  rationale: 최근 원어 판독 및 POB 검토가 ጻህቅ을 'distress' 계열로 보도록 정리하므로, 본문이 드러내는 긴박한 방문 이유를 보존하면서도 '의'나 '의인' 같은 신학적 확장을 피했습니다.
  doctrine_reference: 원어 우선 원칙과 과잉 해석 절제
