base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
  footnotes:
  - marker: a
    text: Hanok is the Ge'ez form of the name more commonly rendered 'Enoch.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Hanok our father'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제, 제 아버님, 제가 아버님께 간청하고 청합니다. Henok 우리 아버지에게 가서 그에게서 진리를 들으십시오. 그의 거처는 천사들과 함께 있기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Henok은 게에즈형 이름으로, 더 흔한 음역은 ‘에녹’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그에게서 진리를 들으십시오’는 ‘진리를 그에게서 들으십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 이제는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대화의 긴급한 전환을 나타내는 시간 표지로서, 한국어에서는 간결한 ‘이제’가 가장 자연스럽고 직접적입니다.
- source_word: ሀለውኩ
  english_pob_choice: I am here
  chosen_korean: 제가 아버님께
  alternatives_korean:
  - 제가 여기 있습니다
  - 저는 여기 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 현재 장면에 참여해 있는 화자의 직접성을 살리되, 한국어에서는 ‘제가 … 간청하고’ 앞에 ‘여기 있습니다’를 덧붙이지 않고도 충분히 드러나므로 중복을 피했습니다.
- source_word: አስተበቍዐከ / ወእስእል
  english_pob_choice: asking you / petitioning
  chosen_korean: 간청하고 청합니다
  alternatives_korean:
  - 간구하고 청합니다
  - 애원하며 요청합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사가 나란히 놓여 간청의 강도를 높이므로, ‘간청하고 청합니다’로 반복적 강세를 살렸습니다.
- source_word: ትስማዕ እምኀቤሁ አማነ
  english_pob_choice: hear from him the truth
  chosen_korean: 그에게서 진리를 들으십시오
  alternatives_korean:
  - 그에게서 진리를 들으시고
  - 진리를 그에게서 들으십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구 ‘그에게서’가 정보의 출처를 강조하므로, 한국어에서도 출처를 앞세워 원문 구조를 살렸습니다.
- source_word: ምስለ መላእክት ምኅዳሩ
  english_pob_choice: his dwelling is with the angels
  chosen_korean: 그의 거처는 천사들과 함께 있기 때문입니다
  alternatives_korean:
  - 그의 거처는 천사들과 함께 있습니다
  - 그는 천사들과 함께 거처합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명사구적 표현을 ‘거처’로 살려 Enoch의 비범한 거주 상태를 유지했고, 원문의 이유절 기능을 자연스럽게 한국어로 풀었습니다.
- source_word: ሄኖክ አቡነ
  english_pob_choice: Henok our father
  chosen_korean: Henok 우리 아버지
  alternatives_korean:
  - Henok 우리의 아버지
  - Henok 아버지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고유명사는 개정된 음역 정책에 따라 Henok으로 옮기고, ‘우리 아버지’는 혈연 호칭이면서 존칭적 호명이라는 점을 유지했습니다.
theological_decisions:
- issue: Enoch의 천사들과의 관계를 어떻게 표시할지
  chosen_reading: 그의 거처는 천사들과 함께 있기 때문입니다
  alternative_readings:
  - 그의 거처는 천사들과 함께 있습니다
  - 그는 천사들과 함께 삽니다
  rationale: 원문은 단순한 동거보다 ‘거처/거주’의 상태를 말하므로, 영적·환상적 이미지를 약화시키지 않도록 장소성 있는 표현을 유지했습니다.
