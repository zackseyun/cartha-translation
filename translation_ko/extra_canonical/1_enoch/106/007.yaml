  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명사구적 표현을 ‘거처’로 살려 Enoch의 비범한 거주 상태를 유지했고, 원문의 이유절 기능을 자연스럽게 한국어로 풀었습니다.
- source_word: ሄኖክ አቡነ
  english_pob_choice: Henok our father
  chosen_korean: Henok 우리 아버지
  alternatives_korean:
  - Henok 우리의 아버지
  - Henok 아버지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고유명사는 개정된 음역 정책에 따라 Henok으로 옮기고, ‘우리 아버지’는 혈연 호칭이면서 존칭적 호명이라는 점을 유지했습니다.
