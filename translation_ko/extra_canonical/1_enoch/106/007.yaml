base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
  footnotes:
  - marker: a
    text: Hanok is the Ge'ez form of the name more commonly rendered 'Enoch.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Hanok our father'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제, 아버님, 제가 여기서 아버님께 간청하고 청하오니, 우리 아버지 Henok[a]에게 가셔서 그에게서 진리를 들으십시오. 그의 거처는 천사들과 함께 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Henok은 게에즈어 형태의 이름이며, 더 흔한 음역은 ‘에녹’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 이제는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대화의 긴급한 전환을 나타내는 시간 표지로서, 한국어에서는 간결한 ‘이제’가 가장 자연스럽고 직접적입니다.
- source_word: ሀለውኩ
  english_pob_choice: I am here
  chosen_korean: 제가 아버님께
  alternatives_korean:
