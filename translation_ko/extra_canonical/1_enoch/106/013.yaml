base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/013.yaml
  text: And I[a], Enoch, answered and said to him, “The Lord will do a new thing on the earth; and this I have already seen in a vision, and I have made it known to you[e][d][c][b], because in the generation of Jared my father they transgressed the word of my Lord from the heights of heaven.”
  footnotes:
  - marker: a
    text: Or 'will renew' or 'will make anew'; the Ge'ez verb and noun both draw on the idea of newness.
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood as 'the word of my Lord from heaven above.' The Ge'ez syntax is difficult, and the spatial phrase could modify either 'word' or 'Lord.'
    reason: alternative_reading
  - marker: c
    text: Or 'the word of the Lord'.
    reason: previous_rendering
  - marker: d
    text: Or 'make a new thing'.
    reason: previous_rendering
  - marker: e
    text: Or 'from above heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 에녹이 그에게 대답하여 말했습니다. “주님께서 땅 위에 새 일을 행하실 것입니다. 그리고 이것은 내가 이미 환상으로 보았고, 너에게 알려 주었습니다. 이는 내 아버지 야렛의 세대에 그들이 하늘의 높은 곳에서 나온 내 주님의 말씀을 거역했기 때문입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘새롭게 하실 것입니다’, ‘새것을 만드실 것입니다’. 게에즈 동사와 명사는 모두 새로움/갱신의 뜻을 품습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘하늘의 높음에서’. 게에즈 표현은 ‘하늘 위쪽/높은 곳’의 공간감을 지닙니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘주님의 말씀’.
    reason: previous_rendering
lexical_decisions:
- source_word: አውሣእኩ ... እቤሎ
  english_pob_choice: answered and said to him
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 대답하고 그에게 말했습니다
  - 응답하여 말했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 히브리어식 이중 서술을 자연스럽게 살리되, 한국어에서는 군더더기 없이 ‘대답하여 말했습니다’로 묶어 대화의 격식을 보존했습니다.
- source_word: ይኄድስ ኀዳሳተ
  english_pob_choice: will do/make a new thing
  chosen_korean: 새 일을 행하실 것입니다
  alternatives_korean:
  - 새롭게 하실 것입니다
  - 새것을 만드실 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어근의 새로움과 하나님 주도의 결정적 행위를 함께 살리기 위해 ‘새 일’을 택했습니다. 단순한 갱신보다 역사 속에서 이루어질 새로운 행위라는 뉘앙스를 유지합니다.
- source_word: ዲበ ምድር
  english_pob_choice: upon/on the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅에
  - 세상에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지리적·시각적 이미지를 살리는 직역에 가깝게 ‘땅 위에’를 선택했습니다.
- source_word: ርኢኩ በራእይ
  english_pob_choice: have already seen in a vision
  chosen_korean: 이미 환상으로 보았고
  alternatives_korean:
  - 이미 환상에서 보았고
  - 이미 환상 가운데 보았고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보는 행위의 매개가 ‘환상’임을 드러내되, 한국어에서는 자연스럽게 ‘환상으로 보았다’고 옮겨 예언적 체험의 성격을 보존했습니다.
- source_word: እመልዕልተ ሰማይ
  english_pob_choice: from the heights of heaven
  chosen_korean: 하늘의 높은 곳에서
  alternatives_korean:
  - 하늘 높이에서
  - 하늘의 높음에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: revised audit가 지적한 ‘height’ 의미를 반영해 ‘높은 곳’으로 옮겼습니다. ‘하늘에서’보다 출처의 상향적 공간감을 더 분명히 드러냅니다.
- source_word: ነገረ ለእግዚእየ
  english_pob_choice: the word of my Lord
  chosen_korean: 내 주님의 말씀
  alternatives_korean:
  - 내 주님의 말
  - 내 주님의 말씀을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘말씀’이 단순한 발화보다 권위 있는 신적 언명을 더 잘 살리므로 선택했습니다. POB의 ‘word’는 여기서 메시지/선언의 무게를 지닙니다.
theological_decisions:
- issue: ‘새 일’의 범위
  chosen_reading: 하나님이 땅 위에서 새 일을 행하신다는 역사적·예언적 선언으로 옮기고, 우주적 갱신이나 비유적 쇄신으로 좁히지 않았습니다.
  alternative_readings:
  - 땅을 새롭게 하실 것입니다
  - 새것들을 행하실 것입니다
  rationale: 원문과 POB audit이 모두 새로움/갱신의 긴장을 남기므로, 특정 종말론 체계로 과도하게 규정하지 않고 결정적 새 행위라는 범위를 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘내 주님의 말씀’의 소유격과 주체
  chosen_reading: ‘내 주님의 말씀’으로 옮겨 에녹의 발화 안에서 주님에 대한 인격적 소속감을 보존했습니다.
  alternative_readings:
  - 주님의 말씀
  - 내 주님의 명령
  rationale: 원문의 ‘my Lord’와 ‘word’의 결합을 그대로 드러내되, ‘명령’으로 축소하지 않아 의미의 폭을 유지했습니다.
  doctrine_reference: Original-language primacy over translation tradition.
