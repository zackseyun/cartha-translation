base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/003.yaml
  text: And at that time[a], he rose from the hands of the midwife[b], and he opened his mouth and spoke to the Lord of righteousness.
  footnotes:
  - marker: a
    text: Literally, 'from her hands'; the Ge'ez identifies the woman as the birth-attendant, hence 'the midwife.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to the Lord of justice.' The Ge'ez noun can carry both moral and judicial force.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그때[a], 그는 산파의 손에서[b] 일어나 입을 열고 의의 주님께 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀의 손에서’이지만, 문맥상 출산을 돕는 산파를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: Ge'ez의 ለመውለዲት은 산모가 아니라 출산을 돕는 사람, 곧 산파를 가리킵니다.
