lexical_decisions:
- source_word: לָמֶךְ ... אֲבוּהּ
  english_pob_choice: Lamech his father
  chosen_korean: 라멕은 자기 아들을 보고 두려워하여
  alternatives_korean:
  - 라멕은 그의 아버지로서 두려워하여
  - 라멕은 아버지로서 그를 두려워하여
  lexicon: Ge'ez source text + English POB audit trail
  rationale: 게에즈 본문은 라멕을 가리키는 말 뒤에 ‘그의 아버지’(아들의 아버지)라는 말을 덧붙여, 두려움의 주체가 바로 아기의 아버지임을 강조합니다. 한국어에서는 이 관계를 자연스럽고 분명하게 드러내기 위해 ‘자기 아들’을 보았다는 뜻으로 풀어, 대상을 문맥상 분명하게 했습니다.
- source_word: ፈረሀ
  english_pob_choice: was afraid
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 겁을 먹고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사는 단순한 공포 반응을 뜻하므로 ‘두려워하여’가 가장 सीधे하게 대응합니다. 구어체의 감정 묘사보다 서사체에 맞는 중립적 표현을 택했습니다.
- source_word: ጐየ
  english_pob_choice: fled
  chosen_korean: 도망쳤으며
  alternatives_korean:
  - 달아났으며
  - 급히 떠났으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 급박한 이탈과 공포에 따른 이동을 함께 살리기 위해 ‘도망쳤으며’를 택했습니다. 단순한 이동보다 위협을 느낀 반응이라는 점이 드러납니다.
- source_word: መጽአ ኀበ
  english_pob_choice: came to
  chosen_korean: 자기 아버지 므두셀라에게 왔습니다
  alternatives_korean:
  - 자기 아버지 므두셀라에게 갔습니다
  - 아버지 므두셀라에게 이르렀습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 행위의 도착점을 분명히 하는 동사구이므로 ‘에게 왔습니다’가 가장 자연스럽습니다. 인물명은 통용 표기인 ‘므두셀라’를 사용했습니다.
- source_word: አቡሁ
  english_pob_choice: his father
  chosen_korean: 자기 아버지
  alternatives_korean:
  - 그의 아버지
  - 자기의 아버지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 소유격을 한국어 대명사로 직역하기보다, 반복된 ‘아버지’ 관계를 분명하게 살리기 위해 ‘자기 아버지’로 옮겼습니다.
theological_decisions:
- issue: 대명사 him의 지시 대상
  chosen_reading: 한국어 본문은 본문 맥락에 따라 그 대상을 ‘자기 아들’로 분명히 드러냈습니다.
  alternative_readings:
  - 대상을 밝히지 않고 ‘그를’로만 둘 수 있습니다.
  - ‘갓난아기’를 본문에 직접 넣을 수 있습니다.
  rationale: 영문 POB의 각주가 밝히듯 지시 대상은 앞문맥의 갓난아기입니다. 다만 한국어에서는 너무 모호하면 서사의 핵심이 흐려지므로, 본문에 존재하는 관계를 해치지 않는 범위에서 ‘자기 아들’로 구체화했습니다.
  doctrine_reference: 문맥이 분명한 지시 대상은 최소한으로 해소하되, 본문이 제공하지 않는 추가 정보는 과잉 삽입하지 않습니다.
