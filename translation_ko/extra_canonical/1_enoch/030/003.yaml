base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/003.yaml
  text: And by the edges of those valleys I saw fragrant cinnamon[c][b][a], and beyond them I went toward the east.
  footnotes:
  - marker: a
    text: The opening expression is literally something like 'by the side/flank of those valleys.'
    reason: lexical_alternative
  - marker: b
    text: The preposition rendered 'beyond them' can also be understood more generally as 'past them' or 'in the direction beyond them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And by the side of those valleys I saw fragrant cinnamon, and beyond them I came near toward the east.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 골짜기들의 가장자리[a]에서 나는 향기로운 계피를 보았고, 그 너머로[b] 동쪽을 향해 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가장자리’는 이 지형어의 ‘입술, 가장자리, 경계’라는 뜻을 따른 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 너머로’는 ‘그것들을 지나서’ 또는 ‘그 너머 방향으로’로도 이해할 수 있습니다.
    reason: lexical_alternative
