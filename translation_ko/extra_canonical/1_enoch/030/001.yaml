base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/001.yaml
  text: And above them[a], above those mountains of the east, not far away, I saw another place, a valley of waters[c][b], as though it were inexhaustible.
  footnotes:
  - marker: a
    text: The Ethiopic text is difficult at the end of the verse. The final clause may mean 'as though it could not be drained' or 'as though it did not run out.'
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'their mountains' depends on a somewhat uncertain form in the OCR witness; 'the mountains' is also possible.
    reason: textual_variant
  - marker: c
    text: Or 'above their mountains, I saw another place, a valley of waters, not far away'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 산들 위, 동쪽의 그 산들 위에—멀지 않은 곳에—나는 또 다른 곳, 곧 물의 골짜기를 보았습니다. 그것은 마치 다함이 없는 것 같았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 말미는 난해하여, 이 절의 마지막 구는 ‘다 비워지지 않는 것처럼’ 또는 ‘마르지 않는 것처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 산들’의 소유 관계는 OCR 증거가 다소 불확실하여, 단순히 ‘산들’로도 읽을 수 있습니다.
    reason: textual_variant
