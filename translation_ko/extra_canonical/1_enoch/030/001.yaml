translation:
  language: ko
  text: 그리고 그들 위, 곧 동쪽의 그 산들[b] 위에, 멀지 않은 곳에서 나는 또 다른 곳, 곧 물의 골짜기를 보았습니다. 그것은 마치 다함이 없는 듯했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 말미는 난해하여, 이 절의 마지막 구는 ‘다 비워지지 않는 것처럼’ 또는 ‘마르지 않는 것처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 산들’의 소유 관계는 OCR 증거가 다소 불확실하여, 단순히 ‘산들’로도 읽을 수 있습니다.
    reason: textual_variant
