  english_pob_choice: because of those who brought them out thus?
  chosen_korean: 또 그들을 이렇게 끌어낸 이들 때문에
  alternatives_korean:
  - 또 그들을 이렇게 밖으로 이끈 이들로부터
  - 또 그들을 이렇게 끌어낸 이들로 말미암아
