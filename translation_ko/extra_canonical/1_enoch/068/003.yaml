theological_decisions:
- issue: 고대 인체 은유의 보존
  chosen_reading: '''마음''과 ''콩팥''을 그대로 살려, 내면 반응을 신체 이미지로 표현한 본문의 방식 자체를 유지했습니다.'
  alternative_readings:
  - '''마음''과 ''속사람''으로 순화'
  - '''마음''과 ''내장''으로 일반화'
  rationale: 본문은 심리학적 추상어가 아니라 고대 셈어적 신체 은유로 감정과 양심의 동요를 말하므로, 이를 평평하게 만들지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: '번역 원칙: स्रोत의 이미지와 긴장을 보존하고 현대적 추상화로 완화하지 않음.'
