base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/001.yaml
  text: And after this my grandfather Hēnok gave me the sign of all the hidden things in a book[a], and the parables that had been given to him[c][b]; and they shall recount them to me in the account of the book of the Parable.
  footnotes:
  - marker: a
    text: The line is textually difficult in the Ge'ez witness, especially in the clauses 'from the words of Hēnok' and 'they shall recount them to me.' The translation stays close to the surviving wording rather than smoothing the syntax.
    reason: textual_variant
  - marker: b
    text: The term rendered 'parables' may also be translated 'similitudes.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he gave me the sign of all the hidden things in the book from the words of Hēnok'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일 뒤에 내 조부 에녹은 책에 있는 모든 숨은 것들의 표징과 그에게 주어진 비유들을 나에게 주었습니다[a][b]. 그리고 그들은 비유의 책의 기록에서 그것들을 나에게 전할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈 본문의 후반부는 주어와 문장 연결이 난해합니다. 번역은 남아 있는 어법에 가깝게 옮기며, 복수 주어 ‘그들’이 누구를 가리키는지는 밝히지 않습니다.
    reason: textual_variant
  - marker: b
    text: ‘비유’는 ‘비사(譬辭)’ 또는 ‘유사한 것들(similitudes)’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  english_pob_choice: the sign
  chosen_korean: 표징
  alternatives_korean:
  - 표시
  - 징표
  - 표
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: apocalyptic한 계시 표지를 살리기 위해 ‘표징’을 택했습니다. ‘설명’처럼 의미를 풀어 쓰지 않고, ‘sign’의 짧고 상징적인 뉘앙스를 유지합니다.
- source_word: ኵሎሙ ኅቡኣት
  english_pob_choice: all the hidden things
  chosen_korean: 모든 숨은 것들
  alternatives_korean:
  - 모든 비밀들
  - 모든 감추어진 것들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘hidden things’의 직접 대응으로 ‘숨은 것들’을 사용해 계시된 내용이 아직 감추어져 있다는 긴장을 유지했습니다.
- source_word: እምሔውየ ሄኖክ
  english_pob_choice: my grandfather Hēnok
  chosen_korean: 내 조부 에녹
  alternatives_korean:
  - 나의 조상 에녹
  - 내 할아버지 에녹
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아랍어/성서적 계보 문맥에서 혈연 선조를 가리키는 관계를 자연스럽게 살리기 위해 ‘조부’를 택했습니다. 본문이 말하는 화자는 에녹의 후손임을 드러냅니다.
- source_word: ይመርሙ ሊተ
  english_pob_choice: they shall recount them to me
  chosen_korean: 그들은 그것들을 나에게 전할 것입니다
  alternatives_korean:
  - 그들은 그것들을 나에게 이야기할 것입니다
  - 그들은 그것들을 나에게 설명할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사가 본문상 다소 난해하므로, ‘recount’의 핵심인 ‘말로 풀어 전하다’를 살려 ‘전할 것입니다’로 옮겼습니다. 과도한 해석인 ‘설명하다’는 피했습니다.
- source_word: ነገረ መጽሐፍ ዘምሳሌ
  english_pob_choice: the account of the book of the Parable
  chosen_korean: 비유의 책의 말씀
  alternatives_korean:
  - 비유의 책의 기록
  - 비유 책의 말씀
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ነገረ의 넓은 의미인 ‘말씀/내용/기록’ 가운데, 문맥상 문헌의 진술을 자연스럽게 드러내는 ‘말씀’을 택했습니다. ‘of the Parable’은 문맥에 맞게 ‘비유의 책’으로 처리했습니다.
theological_decisions:
- issue: ‘숨은 것들’과 ‘표징’의 계시적 긴장 유지
  chosen_reading: 본문의 난해함을 완화하지 않고, 드러난 계시와 아직 감추어진 내용을 함께 살리는 표현을 유지했습니다.
  alternative_readings:
  - 모든 비밀의 설명
  - 모든 감추어진 것의 해석
  rationale: 이 절은 계시 전달 장면이지만, 지시어와 목적어가 간명한 만큼 해석을 덧씌우지 않는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve tension rather than resolve it.'
