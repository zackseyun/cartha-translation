base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/002.yaml
  text: And on that day Michael answered[a], saying to Raphael, “The power of the spirit seizes me and provokes me to anger because of the severity of the judgment concerning the hidden secrets. Who is there that can endure the severe judgment that has been executed[c][b], and before which they melt away?”
  footnotes:
  - marker: a
    text: The Ge'ez text of this line is difficult, and the clause rendered 'because of the severity of the judgment concerning these hidden things' may also be understood more literally as a terrible matter 'for the ear' concerning hidden things.
    reason: textual_variant
  - marker: b
    text: Or 'who can bear the severe thing that has been done?' The wording may refer either to the judgment itself or to the revelation of it.
    reason: lexical_alternative
  - marker: c
    text: Or 'drives me on'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날 미카엘이 라파엘에게 말하며 대답하였습니다. 「영의 능력이 나를 붙들고, 숨겨진 것들에 관한 심판의 엄중함 때문에 나를 분노하게 합니다. 누가 집행된 그 엄중한 심판을 견딜 수 있겠으며, 그 앞에서 누가 녹아 사라지지 않겠습니까?」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 게에즈 본문은 난해하여, ‘숨겨진 것들에 관한 심판의 엄중함’은 문자적으로는 ‘귀에 관한 무서운 일’에 더 가깝게 이해될 수도 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘누가 그 엄중한 일을 견딜 수 있겠습니까?’ 즉, 심판 자체를 가리키는지 그 집행된 결과를 가리키는지 모호합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나를 몰아붙입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: አውሥአ
  english_pob_choice: answered
  chosen_korean: 대답하였습니다
  alternatives_korean:
  - 응답하였습니다
  - 말하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이야기 흐름에서 질문에 대한 응답을 나타내는 동사이므로, ‘대답하였습니다’가 대화 구조를 가장 자연스럽게 살립니다.
- source_word: ኀይሉ ለመንፈስ
  english_pob_choice: the power of the spirit
  chosen_korean: 영의 능력이
  alternatives_korean:
  - 영의 힘이
  - 그 영의 능력이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ኀይል’은 단순한 힘보다 작용하는 역량·능력을 뜻하는 경우가 많아 ‘능력’으로 옮겼고, ‘መንፈስ’은 이 절에서 신적 실체로 분명히 특정되지 않으므로 ‘영’으로 두었습니다.
- source_word: ይመሥጠኒ … ያምዕዐኒ
  english_pob_choice: seizes me … provokes me to anger
  chosen_korean: 나를 붙들고 … 나를 분노하게 합니다
  alternatives_korean:
  - 나를 사로잡고 … 나를 화나게 합니다
  - 나를 붙잡아 … 나를 격분하게 합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 동사는 강하게 붙잡는 의미이므로 ‘붙들고’가 적절하고, 둘째 동사는 단순한 동요가 아니라 분노를 유발하는 뜻이어서 ‘분노하게 합니다’로 옮겼습니다.
- source_word: ዕፁቡ … ተገብረት
  english_pob_choice: the severity of the judgment … has been executed
  chosen_korean: 심판의 엄중함 … 집행된 그 엄중한 심판
  alternatives_korean:
  - 심판의 심각함 … 시행된 그 심판
  - 판결의 엄중함 … 이루어진 그 엄중한 심판
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문은 이미 내려져 집행된 심판의 무게를 강조하므로, ‘엄중함’과 ‘집행된’으로 법정적 뉘앙스를 살렸습니다.
- source_word: ይትመሰዉ
  english_pob_choice: they melt away
  chosen_korean: 녹아 사라지지 않겠습니까
  alternatives_korean:
  - 녹아 없어지지 않겠습니까
  - 사라져 버리지 않겠습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 붕괴 이미지를 살리기 위해 ‘녹아’의 비유를 유지했고, 결과는 자연스러운 한국어로 ‘사라지지 않겠습니까’로 처리했습니다.
theological_decisions:
- issue: 문맥상 መንፈስ을 ‘영’으로 둘지 ‘성령’으로 둘지
  chosen_reading: 영
  alternative_readings:
  - 성령
  rationale: 해당 절은 미가엘의 내적 압박을 묘사하지만, 원문만으로 그 영을 성령으로 특정할 근거가 충분하지 않으므로 모호성을 보존했습니다.
  doctrine_reference: 원문이 분명히 하지 않는 신학적 특정은 보류한다.
- issue: ‘숨겨진 것들’의 심판이 심판 자체인지, 그 선포/계시에 대한 반응인지
  chosen_reading: 숨겨진 것들에 관한 심판의 엄중함
  alternative_readings:
  - 숨겨진 것들에 관한 무서운 소식
  - 숨겨진 것들에 대한 엄중한 판결
  rationale: 지문은 난해하지만, 반복되는 ‘숨겨진 것들’과 심판 어휘가 함께 엮여 있어 본문이 가리키는 긴장감을 유지하는 쪽이 가장 안전합니다.
  doctrine_reference: 본문의 난점을 평준화하지 않고 남겨 둔다.
