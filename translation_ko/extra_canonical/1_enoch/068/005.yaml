  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞선 문맥의 결과를 이끄는 인과 표현이므로, 현대 한국어에서 자연스럽고 직접적인 '이 때문에'로 옮겼습니다.
- source_word: ኵሉ ዘኅቡእ
  english_pob_choice: everything hidden
  chosen_korean: 숨겨진 모든 것
  alternatives_korean:
  - 감추어진 모든 것
  - 은닉된 모든 것
  - 오랫동안 숨겨진 모든 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''숨겨진''은 상대구문이 가리키는 폭넓은 은폐 상태를 가장 सीधे적으로 살리며, 대상의 범위를 ''모든 것''으로 유지합니다.'
- source_word: ላዕሌሆሙ
  english_pob_choice: upon them
  chosen_korean: 그들에게 닥칠 것입니다
  alternatives_korean:
  - 그들 위에 임할 것입니다
  - 그들 위에 올 것입니다
  - 그들에게 내려올 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 문맥에서의 'upon'은 단순한 위치보다 임박한 덮침과 타격을 내포하므로, 한국어에서는 '닥치다'로 그 압박감을 살렸습니다.
theological_decisions:
- issue: '''hidden''과 ''forever''의 관계를 어떻게 처리할 것인지'
  chosen_reading: '''forever''를 ''숨겨진''에 붙여 번역하지 않고, 문장 전체의 심판적 긴장만 남겼습니다.'
  alternative_readings:
  - '''영원히 숨겨진 모든 것'''
  - '''오래전부터 감추어진 모든 것'''
  rationale: 게으즈 문장에서는 시간 부사가 동사의 종말론적 도착을 강조할 수 있으나, 이 절은 '드러남'보다 '그들에게 닥침'에 초점이 있으므로, 한국어에서는 의미를 과도하게 특정하지 않고 열린 상태로 두었습니다.
  doctrine_reference: Apocalyptic judgment should not be flattened; preserve the source's ominous force and ambiguity.
