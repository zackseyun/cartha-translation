  text: 이 때문에, 영원히 감추어진 모든 것이 그들에게 닥칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛적부터 감추어진 모든 것’ 또는 ‘한 시대 동안 감추어진 모든 것’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 시간 표현을 동사에 연결하여 ‘이 때문에, 숨겨진 모든 것이 그들에게 영원히 닥칠 것입니다’으로 옮길 수도 있습니다.
    reason: syntactic_alternative
lexical_decisions:
- source_word: በእንተ'ዝ
  english_pob_choice: Because of this
  chosen_korean: 이 때문에
  alternatives_korean:
  - 그러므로
