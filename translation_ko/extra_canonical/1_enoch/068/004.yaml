revisions:
- from: 그가 만군의 주 앞에 섰을 때 이런 일이 있었습니다. 미가엘이 라파엘에게 말했습니다. 「그는 주의 눈앞에서 그들을 위해 있지 않을 것입니다. 만군의 주께서 그들에게 분노하셨기 때문입니다. 그들은 자신들이 주인인 것처럼 행동하기 때문입니다」.[a][b]
  to: 그가 영들의 주님 앞에 섰을 때, 미가엘이 라파엘에게 이렇게 말했습니다. 「그는 주님의 눈앞에서 그들의 편에 서지 않을 것입니다. 영들의 주님께서 그들에게 분노하셨기 때문입니다. 그들이 주님인 양 행동하기 때문입니다.」[a][b]
  rationale: 원문의 신명 ‘영들의 주님’을 바로잡고, 불명확한 단수 주어는 그대로 유지했습니다. 문제의 관용구는 한국어에서 자연스러운 ‘그들의 편에 서지 않다’로 옮기되, 각주에서 지시 대상 및 의미의 여지를 밝혔습니다. 마지막 고발은 ‘주님인 양’으로 번역하여 원문의 신적 권위 참칭 가능성을 보존했습니다.
