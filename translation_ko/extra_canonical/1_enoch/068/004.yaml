base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/004.yaml
  text: 'And it came to pass[a], when he stood before the Lord of Spirits, that Michael said this to Raphael: “He will not be for them before the eye of the Lord, for the Lord of Spirits is angry with them[c][b], because they act as if they were the Lord.”'
  footnotes:
  - marker: a
    text: The clause 'He will not be for them before the eye of the Lord' is difficult. It likely means that no support or advocacy will stand for them in God's presence.
    reason: lexical_alternative
  - marker: b
    text: Or, 'because they act like lords.' The Ge'ez wording is terse and may accuse them of assuming divine or ruling authority that is not theirs.
    reason: lexical_alternative
  - marker: c
    text: Or 'He will not be for them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 영들의 주님 앞에 섰을 때, 미가엘이 라파엘에게 이렇게 말했습니다. 「그는 주님의 눈앞에서 그들의 편에 서지 않을 것입니다. 영들의 주님께서 그들에게 분노하셨기 때문입니다. 그들이 주님인 양 행동하기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그는 주님의 눈앞에서 그들의 편에 서지 않을 것입니다’에서 ‘그’가 누구를 가리키는지는 이 절만으로 분명하지 않습니다. 이 표현은 그들을 지지하거나 그들의 편을 들지 않는다는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘주님인 양 행동하다’는 그들이 자신들에게 속하지 않은 신적 권위 또는 주권을 취한다는 고발을 나타낼 수 있습니다. ‘권세자들처럼 행동하다’로 이해될 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ፡ ሶበ፡
  english_pob_choice: And it came to pass, when
  chosen_korean: 이런 일이 있었습니다. …했을 때
  alternatives_korean:
  - 그리고 …했을 때
  - …하자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서사 전환 공식의 사건성을 살리되, 현대 한국어에서 자연스럽게 읽히도록 처리했습니다.
- source_word: በቅድመ፡ እግዚአ፡ መናፍስት፡
  english_pob_choice: before the Lord of Spirits
  chosen_korean: 만군의 주 앞에
  alternatives_korean:
  - 영들의 주 앞에
  - 영들의 주님 앞에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 정식 칭호를 한국어로 옮기면서 ‘앞에’의 심판/법정적 뉘앙스를 유지했습니다.
- source_word: ወኢይከውን፡ ሎሙ፡
  english_pob_choice: He will not be for them
  chosen_korean: 그는 …를 위해 있지 않을 것입니다
  alternatives_korean:
  - 그들의 편이 되지 않을 것입니다
  - 그들을 위해서 서 있지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Dillmann이 지적하는 ‘~의 편에 서다’ 관용을 따라, 직역성이 보이면서도 한국어 문장으로는 읽히게 했습니다.
- source_word: እምሳለ፡ እግዚአ፡ ይገብሩ
  english_pob_choice: they act as if they were the Lord
  chosen_korean: 그들은 자신들이 주인인 것처럼 행동합니다
  alternatives_korean:
  - 그들은 주인인 양 행동합니다
  - 그들은 주님인 것처럼 행동합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 신적/통치적 월권을 드러내면서, 영어 POB의 해석적 긴장을 반영해 ‘주인’으로 옮겼습니다.
theological_decisions:
- issue: ‘He will not be for them’의 지시 대상과 의미
  chosen_reading: 주어를 특정하지 않고, ‘그들은 위해 있지 않을 것입니다’로 옮겨 중보/편들기의 의미를 열어 둡니다.
  alternative_readings:
  - ‘그들의 편이 되지 않을 것입니다’로 명시
  - ‘그들을 위해 중보하지 않을 것입니다’로 확장
  rationale: 원문과 POB 둘 다 직접적으로 중보자를 확정하지 않으므로, 한국어 본문에서도 그 모호성을 보존했습니다.
  doctrine_reference: 해석의 긴장 보존
- issue: ‘주인(lords)’ vs ‘주님’
  chosen_reading: 문맥상 피조물의 월권을 드러내기 위해 ‘주인’으로 옮기고, 신적 호칭과 구별했습니다.
  alternative_readings:
  - ‘주님’으로 옮기기
  - ‘권세자들’로 완화
  rationale: 원문은 그들이 자신에게 속하지 않은 권위를 취하는 것을 고발하므로, 한국어에서도 호칭을 완화하지 않았습니다.
  doctrine_reference: 피조물과 창조주의 구별
