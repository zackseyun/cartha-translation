base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/004.yaml
  text: And there I saw something like an invisible cloud[a], for because of its depth I was unable to look upon it; and I saw a flame of fire burning gloriously[d][c][b], and something like glorious mountains was circling and moving this way and that way.
  footnotes:
  - marker: a
    text: The phrase rendered 'above its measure' is textually difficult in this OCR witness. The Ge'ez appears to indicate looking upward beyond the cloud's extent or visible form.
    reason: textual_variant
  - marker: b
    text: Or 'was shaken to and fro' for 'kept moving this way and that way.' The underlying Ge'ez suggests repeated motion in alternating directions.
    reason: lexical_alternative
  - marker: c
    text: Or 'because from its depth I was able to look above its measure'.
    reason: previous_rendering
  - marker: d
    text: Or 'and was encircled like glorious mountains, and it kept moving this way and that way'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기서 저는 보이지 않는 구름 같은 것[a]을 보았습니다. 그 깊이 때문에 저는 그것을 바라볼 수 없었고, 또 불타는 불꽃을 보았는데, 그것이 영광스럽게 타고 있었으며 영광스러운 산들 같은 것들이 이리저리 움직이고 있었습니다[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 POB가 따르듯 ‘구름’과 ‘보이지 않음’의 모순을 그대로 살린 환시적 표현입니다.
    reason: textual_variant
  - marker: b
    text: 원문 동사들은 복수형이어서, 움직이는 주체를 불꽃과 분리해 이해하는 편이 더 자연스럽습니다.
    reason: source_note
  - marker: c
    text: ‘이리저리’는 반복적 방향 운동을 나타내는 표현으로, ‘이쪽저쪽으로’ 또는 ‘흔들리며’의 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: d
    text: POB 영어본의 ‘burning gloriously’는 게으스어의 영광/찬란함 어휘를 불꽃의 상태로 옮긴 것입니다.
    reason: previous_rendering
