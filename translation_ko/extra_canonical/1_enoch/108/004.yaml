theological_decisions:
- issue: ‘보이지 않는 구름’의 역설적 환시 표현
  chosen_reading: 실체를 확정하지 않고 ‘보이지 않는 구름 같은 것’으로 번역해, 본문이 의도한 환시적 긴장을 유지했습니다.
  alternative_readings:
  - 보이지 않는 구름
  - 구름 같은 보이지 않는 것
  rationale: 이 절은 일반적인 자연 현상 묘사가 아니라, 보이면서도 보이지 않는다는 역설을 통해 초월적 환시를 전달합니다. 매끈하게 해소하지 않고 긴장을 보존하는 것이 본문에 더 가깝습니다.
  doctrine_reference: 환시적 역설 보존
- issue: ‘영광스러운 산들’의 복수 운동 주체
  chosen_reading: ‘산들 같은 것들이’가 움직인다고 옮겨, 복수 동사에 맞추어 운동의 주체를 분리했습니다.
  alternative_readings:
  - 산들 같은 것이 움직이고 있었습니다
  - 산들 같은 것들이 산처럼 둘러 움직이고 있었습니다
  rationale: 게으스 원문은 복수 동사를 쓰므로, 불꽃을 단수 주어로만 묶지 않고 별도의 환시적 실체들이 움직이는 것으로 드러내는 편이 문법과 이미지 모두에 더 충실합니다.
  doctrine_reference: 문법-이미지 일치
