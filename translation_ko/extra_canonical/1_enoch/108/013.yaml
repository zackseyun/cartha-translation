  to: 그리고 그들은 헤아릴 수 없는 세월 동안 기뻐할 것입니다. 하나님의 심판은 의로우십니다. 그분은 올바른 길들의 거처에서 신실한 이들에게 믿음을 주실 것입니다.[a][b]
  rationale: 동사의 기본 의미를 ‘기뻐하다’로 바로잡고, 최신 원문 검토에서 확인된 OCR 오독 교정(‘그의 심판’)을 반영했습니다. 또한 ‘신실한 이들’ 및 복수형 ‘길들’을 유지하여 어휘적·이미지적 대응을 높였습니다. 믿음/신실함의 의미 범위는 각주에 보존했습니다.
