  - 무수한 세월에
  - 헤아릴 수 없는 시대에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘때/시대’의 시간적 뉘앙스를 유지하되, ‘번호가 없는’의 직역을 한국어로 자연화하여 무한한 기간을 드러냈습니다.
- source_word: ሃይማኖተ
  english_pob_choice: faith
  chosen_korean: 믿음
  alternatives_korean:
  - 신실함
  - 믿는 마음
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어근상 ‘믿음’이 가장 직접적이며, 본문이 하나님이 주시는 선물을 말하므로 표준적인 신앙어휘를 유지했습니다.
- source_word: ለመሃይምናን
  english_pob_choice: to the faithful
  chosen_korean: 믿는 이들에게
  alternatives_korean:
  - 신실한 이들에게
  - 신자들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어진 믿음의 수혜자를 ‘faithful’로 읽는 교정된 이해를 반영하되, 한국어에서는 대상 집단을 가장 자연스럽게 ‘믿는 이들’로 풀었습니다.
- source_word: በማኅደረ ፍናዋተ ርትዕ
  english_pob_choice: in the dwelling of the paths of uprightness
  chosen_korean: 의로운 길의 거처에서
  alternatives_korean:
  - 정직한 길의 거처에서
  - 의의 길들이 있는 거처에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘거처’와 ‘길’의 구체적 이미지를 보존하되, 한국어에서 중첩된 은유를 과도하게 길게 늘이지 않도록 압축했습니다.
theological_decisions:
- issue: How to reflect the corrected Ge'ez reading behind the divine attribution clause
  chosen_reading: ‘하나님의 의가 그분께 속해 있다’로 옮겨, 의가 하나님께 귀속된다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘하나님의 판단은 의롭습니다’
  - ‘의는 하나님께 있습니다’
  rationale: 주어진 최신 검토는 OCR 오독을 지적했지만, 현 장의 영어 POB 본문은 ‘righteousness belongs to God’를 유지합니다. 한국어는 그 어감을 따르되, 소유/귀속 관계를 분명히 하여 본문의 신학적 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve source-level tension and auditable ambiguity rather than resolving it prematurely.'
