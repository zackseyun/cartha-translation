  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘때/시대’의 시간적 뉘앙스를 유지하되, ‘번호가 없는’의 직역을 한국어로 자연화하여 무한한 기간을 드러냈습니다.
