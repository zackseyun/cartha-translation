  - 환호할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주된 영어 초안의 ‘shine’과 직결되는 시각적 이미지를 살리면서, 종말론적 복된 상태를 자연스러운 한국어로 옮겼습니다.
- source_word: በእዝማን ዘአልቦ ኍልቈ
