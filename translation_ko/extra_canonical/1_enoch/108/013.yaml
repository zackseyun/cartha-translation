  chosen_korean: 의로운 길의 거처에서
  alternatives_korean:
  - 정직한 길의 거처에서
  - 의의 길들이 있는 거처에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘거처’와 ‘길’의 구체적 이미지를 보존하되, 한국어에서 중첩된 은유를 과도하게 길게 늘이지 않도록 압축했습니다.
