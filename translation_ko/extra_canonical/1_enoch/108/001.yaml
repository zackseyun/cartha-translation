  text: Another book that Enoch wrote for his son Methuselah[a], and for those who will come after him and keep the ordinance in the latter days.
  footnotes:
  - marker: a
    text: Or 'the order,' 'the ordinance,' or 'the prescribed way.' The Ge'ez term can denote an established norm or pattern to be observed.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 에녹이 그의 아들 므두셀라와, 그 뒤에 와서 마지막 날들에 그 규례를 지킬 사람들을 위하여 쓴 또 하나의 책입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘규칙’, ‘규범’, ‘정해진 길’. 게에즈어 용어는 지켜야 할 확립된 질서나 관행을 가리킬 수 있습니다.
    reason: lexical_alternative
