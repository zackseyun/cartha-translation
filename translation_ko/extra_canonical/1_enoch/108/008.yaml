translation:
  language: ko
  text: 하나님을 사랑하는 이들은 금이나 은이나 세상에 있는 어떤 좋은 것들도[b] 사랑하지 않았고, 오히려 자신들의 몸을[a] 고난에 내어주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 ሥጋ는 ‘몸’ 또는 ‘살’로 옮길 수 있습니다. 여기서는 고난을 육체적으로 겪는 측면을 분명히 하기 위해 ‘몸’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘세상에 있는 어떤 좋은 것들’에 해당하는 전해진 본문 표현은 다소 어색합니다. 대체로 세상에 있는 바람직한 재화들을 넓게 가리키는 말로 이해됩니다.
    reason: textual_variant
