  - marker: b
    text: The phrase rendered 'any of the good things that are in the world' is textually awkward in the OCR witness; it likely refers broadly to the world's desirable goods.
    reason: textual_variant
translation:
  language: ko
  text: 하나님을 사랑하는 이들, 곧 금이나 은이나 세상에 있는 어떤 좋은 것들도 사랑하지 않았고, 오히려 자기들의 몸을 고난에 내어주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez ሥጋ는 ‘몸’ 또는 ‘살’로 옮길 수 있지만, 여기서는 고난에 내어주는 물리적 자기 헌신을 더 분명히 하기 위해 ‘몸’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘세상에 있는 어떤 좋은 것들’은 사본 전승상 다소 어색한 표현으로 보이며, 대체로 세상의 바람직한 재화들을 가리키는 것으로 읽힙니다.
    reason: textual_variant
