theological_decisions:
- issue: 세상 재물 거절과 고난 수용의 성격
  chosen_reading: 하나님 사랑 때문에 세상 재물과 좋은 것들을 의식적으로 사랑하지 않고, 몸을 고난에 내어주는 태도
  alternative_readings:
  - 단순한 빈곤 상태의 묘사
  - 금욕 일반에 대한 도덕적 권고만
  rationale: 사랑하다가 하나님과 금·은·세상 좋은 것들에 대해 대조적으로 반복되므로, 단순 결핍이 아니라 방향이 분명한 애정의 전환과 자발적 고난을 드러내는 것으로 읽는 것이 문맥에 맞습니다.
  doctrine_reference: 본문의 수사적 긴장(하나님 사랑 vs. 세상 재물 사랑, 자발적 고난)을 해소하지 않고 유지합니다.
