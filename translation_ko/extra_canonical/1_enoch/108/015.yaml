  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 동사는 난해하지만, 본문 전체가 단일 호흡으로 이어지는 점을 고려해 별도 동작 부사구보다 앞절의 연속 동작으로 자연스럽게 처리했습니다.
