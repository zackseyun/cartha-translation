base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/015.yaml
  text: And the sinners will cry out and see them while they shine[a], and they themselves will go to where the days and the times have been written down for them[e][d][c][b]. The vision of the hidden things of Enoch.
  footnotes:
  - marker: a
    text: 'The closing words may function as a subscription or title: ''The vision of the hidden things that Enoch saw,'' rather than as part of the sinners'' movement clause.'
    reason: textual_variant
  - marker: b
    text: '''Written down for them'' reflects the apocalyptic motif of fixed, recorded times of judgment.'
    reason: cultural_note
  - marker: c
    text: The verb rendered 'wander about' is difficult and may also suggest agitation or turmoil rather than aimless movement.
    reason: lexical_alternative
  - marker: d
    text: Or 'while they wander about'.
    reason: previous_rendering
  - marker: e
    text: Or ', in the vision of the hidden things that Enoch saw.'.
    reason: previous_rendering
translation:
  language: ko
  text: 죄인들은 외치며 빛나는 그들을 보게 될 것입니다[a]. 그들 자신은 그들을 위하여 날들과 때가 기록된 곳으로 갈 것입니다[b]. 에녹의 숨겨진 것들에 관한 환상입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빛나는’으로 옮긴 동사는 난해합니다. ‘방황하다’, ‘동요하다’ 또는 ‘혼란에 빠지다’라는 뜻으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들을 위하여 기록된 날들과 때’는 심판의 때가 미리 기록되어 있다는 묵시문학의 표현을 반영합니다.
    reason: cultural_note
