base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
  footnotes:
  - marker: a
    text: The exhortation verb may also be understood as 'remain steadfast' or 'endure'; the sense is patient perseverance until the downfall of the wicked.
    reason: lexical_alternative
  - marker: b
    text: 'The closing clause repeats the idea of completion/end: both the evildoers themselves and their power are brought to their finish.'
    reason: cross_reference
  - marker: c
    text: Or 'are finished'.
    reason: previous_rendering
translation:
  language: ko
  text: 선을 행한 여러분은, 악을 행하는 자들이 끝날 때까지, 그날들을 기다리십시오. 그리고 죄인들의 힘도 끝날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''기다리십시오''는 단순한 지연이 아니라, 악인의 종결을 향한 종말론적 인내를 포함합니다.'
    reason: lexical_alternative
  - marker: b
    text: 게에즈 수동형은 악인들이 스스로 끝난다는 뜻이 아니라, 그들이 종결되거나 제거되는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: እለ ገበርክሙ ሠናየ
  english_pob_choice: You who have done good
  chosen_korean: 선을 행한 여러분
  alternatives_korean:
