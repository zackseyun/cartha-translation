base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
  footnotes:
  - marker: a
    text: The exhortation verb may also be understood as 'remain steadfast' or 'endure'; the sense is patient perseverance until the downfall of the wicked.
    reason: lexical_alternative
  - marker: b
    text: 'The closing clause repeats the idea of completion/end: both the evildoers themselves and their power are brought to their finish.'
    reason: cross_reference
  - marker: c
    text: Or 'are finished'.
    reason: previous_rendering
translation:
  language: ko
  text: 선을 행한 여러분은, 악을 행하는 자들이 종말을 맞고[a] 죄인들의 힘이 끝날 그 날들을 기다리십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 수동형은 악을 행하는 자들이 스스로 그치거나 끝낸다는 뜻이 아니라, 그들 자신이 종결됨을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘기다리십시오’는 ‘굳게 서십시오’ 또는 ‘인내하십시오’로도 이해할 수 있으며, 악한 이들의 종결까지 견디라는 뜻입니다.
    reason: lexical_alternative
