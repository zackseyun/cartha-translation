  - 선을 행해 온 여러분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상대절의 호칭을 한국어에서 자연스럽게 살려, 선행으로 규정된 수신자를 직접 부릅니다. '선을 행한'은 도덕적 대비를 유지하면서도 과도한 의역을 피합니다.
- source_word: ትጸንሑ
  english_pob_choice: wait
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 참으십시오
  - 굳게 버티십시오
  - 인내하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 시간표를 향한 권고이므로, 단순한 정지보다 앞으로의 성취를 바라보는 '기다리다'가 가장 직접적입니다.
- source_word: እስከ ይትፌጸሙ
  english_pob_choice: until those who do evil are brought to an end
  chosen_korean: 악을 행하는 자들이 끝날 때까지
  alternatives_korean:
  - 악을 행하는 자들이 끝나기까지
  - 악을 행하는 자들이 완전히 끝날 때까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 수동형은 악인들이 스스로 멈춘다는 뜻이 아니라, 그들이 종결/제거되는 종말을 가리킵니다. '끝날 때까지'는 그 종료의 결과를 간결하게 전달합니다.
- source_word: ኃይሎሙ ለመአብሳን
  english_pob_choice: the power of the sinners comes to an end
  chosen_korean: 죄인들의 힘도 끝날 것입니다
  alternatives_korean:
  - 죄인들의 권세도 끝날 것입니다
  - 죄인들의 능력도 소멸할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ኃይል은 '힘/권세/능력'의 범위를 가지므로, 문맥상 압박하는 세력을 뜻하게 하는 '힘'을 택했습니다. '죄인들'은 EN POB의 도덕-종교적 어휘를 따라 이중 대구를 보존합니다.
theological_decisions:
- issue: 종말론적 심판의 대상 표현을 '악을 행하는 자들'과 '죄인들'로 이중화할지 여부
  chosen_reading: 앞 절은 행위 중심의 표현('악을 행하는 자들'), 뒤 절은 신분/규정 중심의 표현('죄인들')을 유지해 대구를 살렸습니다.
  alternative_readings:
  - 두 곳 모두 '악인들'로 통일
  - 두 곳 모두 '죄인들'로 통일
  rationale: 게에즈 원문은 동일한 의미를 반복하기보다 행위와 정체성을 교차시켜 심판의 포괄성을 강조합니다. 한국어에서도 그 긴장을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
