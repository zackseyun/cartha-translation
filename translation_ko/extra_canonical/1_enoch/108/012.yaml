base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/012.yaml
  text: And I will bring out into bright light those who loved my holy name[c][b][a], and I will seat each one on the throne of his glory.
  footnotes:
  - marker: a
    text: Or 'for those who have loved my holy name.' The Ge'ez construction may be read as identifying the people for whose sake or to whom this bringing-out is directed.
    reason: lexical_alternative
  - marker: b
    text: 'The final pronoun is most naturally read as personal: ''his glory.'' Some may understand the phrase more generally as ''the glorious throne.'''
    reason: alternative_reading
  - marker: c
    text: Or 'bring them out into the bright light for those who loved my holy name, and I will seat them, one by one, on the throne of his glory.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그들을 밝은 빛으로 이끌어 내고, 내 거룩한 이름을 사랑한 이들에게 각각 그의 영광의 보좌에 앉히겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘각각’은 원문의 반복적 분배 표현을 살린 것입니다.
    reason: source_note
  - marker: b
    text: ‘그의’는 하나님이 아니라 각 사람을 가리키는 소유격으로 이해했습니다.
    reason: theological_note
  - marker: c
    text: ‘밝은 빛으로’는 ‘bright light’의 직역이면서도 한국어에서 자연스럽게 읽히는 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: እወፅኦሙ
  english_pob_choice: I will bring them out
  chosen_korean: 이끌어 내고
  alternatives_korean:
  - 데려내고
  - 끌어내고
  - 밖으로 나오게 하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 사람들을 이전의 상태에서 바깥으로 나오게 하는 동사를 한국어 자연문으로 살리되, 단순 이동보다 구출·인도 뉘앙스가 살아 있는 ‘이끌어 내고’를 택했습니다.
- source_word: በብሩህ ብርሃን
  english_pob_choice: into the bright light
  chosen_korean: 밝은 빛으로
  alternatives_korean:
  - 환한 빛으로
  - 찬란한 빛으로
  - 밝은 광명으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 중첩된 빛 이미지를 과장하지 않으면서도 종말론적 광휘를 살리기 위해 ‘밝은 빛으로’로 옮겼습니다.
- source_word: ለእለ አፍቀርዎ ለስምየ ቅዱስ
  english_pob_choice: those who loved my holy name
  chosen_korean: 내 거룩한 이름을 사랑한 이들
  alternatives_korean:
  - 내 거룩한 이름을 사랑한 자들
  - 내 거룩한 이름을 사랑했던 이들
  - 내 거룩한 이름을 사랑하는 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수혜자 표현을 한국어에서 자연스럽게 풀어 ‘이들’로 옮기되, 사랑의 대상인 ‘내 거룩한 이름’의 성격을 유지했습니다.
- source_word: አነብር
  english_pob_choice: I will seat them
  chosen_korean: 앉히겠습니다
  alternatives_korean:
  - 보좌에 앉게 하겠습니다
  - 앉게 하겠습니다
  - 자리에 앉히겠습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 왕권·심판 장면에서 단순 거주가 아니라 자리 배정/즉위의 의미가 강하므로, ‘앉히겠습니다’로 간결하게 살렸습니다.
- source_word: መንበረ ክብር
  english_pob_choice: the throne of his glory
  chosen_korean: 그의 영광의 보좌
  alternatives_korean:
  - 영광의 보좌
  - 그 영광의 보좌
  - 그의 영광의 왕좌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: መንበር의 보좌/왕좌 중에서는 문맥상 ‘보좌’가 더 안정적이며, 속격 구조를 유지해 ‘그의 영광의 보좌’로 옮겼습니다.
theological_decisions:
- issue: 마지막 소유격 ‘his’의 지시 대상
  chosen_reading: ‘his’는 각 사람에게 속한 보좌를 가리키는 것으로 읽어, ‘각각 그의 영광의 보좌’로 옮겼습니다.
  alternative_readings:
  - 하나님의 영광의 보좌로 이해할 수도 있습니다.
  - ‘영광의 보좌’라는 더 일반적인 표현으로 완화할 수도 있습니다.
  rationale: 본문의 첫인칭 발화와 최신 교정에서 정리된 문법 판단을 따라, 소유격을 각 개인에게 귀속되는 표현으로 보존했습니다. 이는 천상적 보상 장면의 분배성을 더 직접적으로 드러냅니다.
  doctrine_reference: 문법적·문맥적 긴장을 해소하기보다, 원문이 지시하는 분배적 의미를 그대로 반영합니다.
