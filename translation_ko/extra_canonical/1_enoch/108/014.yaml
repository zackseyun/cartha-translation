  - 의인들은 빛나고 있을 것입니다
  lexicon: Dillmann
  rationale: 부사적 절의 현재성은 주절의 미래 시점에 맞추어 한국어 미래로 자연스럽게 풀었습니다. ‘빛나다’는 의인들의 영광스러운 상태를 가장 सीधे하게 드러냅니다.
- source_word: ጻድቃን
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인들
  lexicon: Dillmann
  rationale: 에녹 문헌에서의 핵심 집단 표지이므로 관용적으로 ‘의인들’을 택했습니다.
theological_decisions:
- issue: ‘어둠 속에서 태어난 자들’과 ‘어둠 속으로 던져짐’의 대비
  chosen_reading: 출생의 영역으로서의 어둠과 심판의 결과로서의 어둠을 그대로 대조해, 본문이 가진 종말론적 긴장을 보존했습니다.
  alternative_readings:
  - 어둠 속에 속한 자들
  - 어둠에 속박된 자들
  - 어둠으로 들어가게 될 자들
  rationale: 게에즈 본문은 어둠을 단순한 배경이 아니라 기원과 운명의 공간으로 반복시킵니다. 한국어도 그 반복을 살려야 본문의 힘이 유지됩니다.
  doctrine_reference: 'Translation philosophy: preserve source-level tension and imagery rather than smoothing it into a generalized moral statement.'
