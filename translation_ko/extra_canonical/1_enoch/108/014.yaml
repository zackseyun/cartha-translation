  - 어둠 속으로 던져지는
  lexicon: Dillmann
  rationale: 검토된 게에즈 동사는 ‘던지다/내던지다’의 수동형에 해당하므로, 이전 초안의 ‘사랑받다’ 계열 해석을 버리고 본문이 실제로 말하는 심판적 이동을 직역에 가깝게 반영했습니다.
- source_word: እንዘ ይትወሐውሑ
  english_pob_choice: while the righteous shine
  chosen_korean: 의인들은 빛날 것입니다
  alternatives_korean:
