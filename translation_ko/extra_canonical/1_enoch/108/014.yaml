translation:
  language: ko
  text: 그들은 어둠 속에서 태어난 자들이 어둠 속으로 던져지는 것을 보게 될 것이며, 의인들은 빛날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 게에즈 동사는 ‘사랑하다’가 아니라 ‘던지다/내던지다’의 수동형으로 이해하는 것이 타당합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘의인들은 빛나고 있을 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሬ / ወይሬ
  english_pob_choice: And I saw
  chosen_korean: 그들은 보게 될 것입니다
  alternatives_korean:
  - 내가 보았습니다
  - 그들은 보게 될 것입니다
  lexicon: Dillmann
  rationale: 문맥상 환시 보고의 도입이지만, 이 절의 핵심은 시선의 대상이므로 한국어 본문은 자연스러운 서술로 정리하고, 첫머리의 시점은 직전 맥락의 환시 화자에 의존하게 했습니다.
- source_word: ተወልዱ በጽልመት
  english_pob_choice: those who were born in darkness
  chosen_korean: 어둠 속에서 태어난 자들
  alternatives_korean:
  - 어둠 속에서 난 자들
  - 어둠 가운데서 태어난 자들
  lexicon: Dillmann
  rationale: 원문의 관계절은 ‘어둠’을 출생의 영역으로 표지하므로, 한국어에서도 ‘어둠 속에서’로 그 출처성과 상태를 함께 살렸습니다.
- source_word: ይትወደዩ በጽልመት
  english_pob_choice: cast into darkness
  chosen_korean: 어둠 속으로 던져지는
  alternatives_korean:
  - 어둠 속으로 내던져지는
  - 어둠 속으로 던져지는
  lexicon: Dillmann
  rationale: 검토된 게에즈 동사는 ‘던지다/내던지다’의 수동형에 해당하므로, 이전 초안의 ‘사랑받다’ 계열 해석을 버리고 본문이 실제로 말하는 심판적 이동을 직역에 가깝게 반영했습니다.
- source_word: እንዘ ይትወሐውሑ
  english_pob_choice: while the righteous shine
  chosen_korean: 의인들은 빛날 것입니다
  alternatives_korean:
  - 의인들은 빛납니다
  - 의인들은 빛나고 있을 것입니다
  lexicon: Dillmann
  rationale: 부사적 절의 현재성은 주절의 미래 시점에 맞추어 한국어 미래로 자연스럽게 풀었습니다. ‘빛나다’는 의인들의 영광스러운 상태를 가장 सीधे하게 드러냅니다.
- source_word: ጻድቃን
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
