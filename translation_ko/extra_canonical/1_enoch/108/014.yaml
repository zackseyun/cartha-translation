  english_pob_choice: And I saw
  chosen_korean: 그들은 보게 될 것입니다
  alternatives_korean:
  - 내가 보았습니다
  - 그들은 보게 될 것입니다
  lexicon: Dillmann
  rationale: 문맥상 환시 보고의 도입이지만, 이 절의 핵심은 시선의 대상이므로 한국어 본문은 자연스러운 서술로 정리하고, 첫머리의 시점은 직전 맥락의 환시 화자에 의존하게 했습니다.
- source_word: ተወልዱ በጽልመት
