translation:
  language: ko
  text: 그리고 나는 어둠 속에서 태어난 자들이 어둠 속으로 던져지는 것을 보았으며, 의인들은 빛나고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 게에즈 동사는 ‘사랑하다’가 아니라 ‘던지다/내던지다’의 수동형으로 이해하는 것이 타당합니다.
    reason: source_note
  - marker: b
    text: 또는 ‘의인들은 빛났습니다’.
    reason: lexical_alternative
lexical_decisions:
