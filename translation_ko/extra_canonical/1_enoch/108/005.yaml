  rationale: 대상이 아직 명시되지 않았으므로 ‘것’으로 넓게 두고, ዝስቡሕ의 영광/광휘 의미를 살렸습니다.
- source_word: ላህበ እሳት ባሕቲቱ ዘይነድድ
  english_pob_choice: only a burning flame of fire
  chosen_korean: 오직 타오르는 불꽃의 불
  alternatives_korean:
