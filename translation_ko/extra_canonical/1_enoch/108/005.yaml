  alternatives_korean:
  - 울음과 외침과 애통과 극심한 고통의 소리
  - 울음소리와 외침과 통곡과 심한 고통
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 열거된 청각적 이미지의 병치를 살리면서, ቃለ를 ‘소리’로 옮겨 전체 구문을 자연스럽게 묶었습니다.
theological_decisions:
- issue: 이 장면을 일반적 고통 설명으로 완화할지 여부
  chosen_reading: 불, 울음, 부르짖음, 통곡, 고통의 구체적 이미지들을 그대로 유지했습니다.
  alternative_readings:
  - ‘형벌’이나 ‘고통’으로 요약하기
  - 시각적·청각적 이미지를 줄여 의역하기
  rationale: 본문의 힘은 감각적으로 누적되는 묵시적 심판 이미지에 있으므로, 이를 요약해 약화하지 않았습니다.
  doctrine_reference: '묵시문학 번역 원칙: 이미지와 긴장을 보존하고, 의미를 평면화하지 않음.'
- issue: ‘그에게’의 단수 지시가 두 천사 언급과 어긋나는 문제
  chosen_reading: 본문형을 따라 단수 대명사 ‘그에게’를 유지했습니다.
  alternative_readings:
  - ‘그들에게’로 복수화하기
  - 문장 구조를 매끈하게 재구성하기
  rationale: 게으즈 본문과 POB 주석이 보여 주듯, 화자가 두 천사 중 한 안내자에게 말한 것일 수 있는 텍스트 변이를 보존하는 편이 더 충실합니다.
  doctrine_reference: 본문 비평적 변이 보존 원칙
