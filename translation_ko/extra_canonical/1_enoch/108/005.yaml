base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/005.yaml
  text: And I asked the two holy angels who were with me[a], and I said to him, “What is this glorious thing? For it is not heaven, but only a burning flame of fire[c][b], and the sound of weeping and crying out and lamentation and grievous pain.”
  footnotes:
  - marker: a
    text: The Ge'ez reads 'I said to him' although the previous phrase mentions 'the two holy angels.' This may mean Enoch addressed one angel as spokesman, or it may reflect a textual irregularity.
    reason: textual_variant
  - marker: b
    text: '''Glorious thing'' could also be rendered ''glorious place'' or ''splendor.'' The wording is kept broad because the referent is not yet explicitly named in the verse itself.'
    reason: lexical_alternative
  - marker: c
    text: Or 'only a blazing fire'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 나와 함께 있던 두 거룩한 천사에게 물었고, 그에게[a] 말했습니다. “이 영광스러운 것[b]이 무엇입니까? 그것은 하늘이 아니라, 오직 타오르는 불의 불꽃[c]일 뿐이며, 울음과 부르짖음과 통곡과 심한 고통의 소리입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈 본문은 앞에서 ‘두 거룩한 천사’를 말하면서도 여기서는 단수 ‘그에게’라고 적습니다. 한 천사를 대변자로 부른 것일 수도 있고, 본문상의 불일치일 수도 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘영광스러운 것’은 문맥상 ‘영광스러운 장소’ 또는 ‘광휘’로도 옮길 수 있습니다. 이 절 안에서는 대상을 아직 특정하지 않으므로 넓게 두었습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘오직 불타는 불꽃’.
    reason: previous_rendering
