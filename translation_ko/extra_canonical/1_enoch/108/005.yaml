  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘불꽃의 불’은 ላህበ እሳት의 중첩 이미지를 보존하고, ዘይነድድ의 지속적 연소를 ‘타오르는’으로 반영했습니다.
- source_word: ቃለ ብካይ ወጽራሕ ወአውያት ወሕማም ኀያል
  english_pob_choice: the sound of weeping and crying out and lamentation and grievous pain
