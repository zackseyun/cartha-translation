base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/011.yaml
  text: And now I will summon the spirits of the good ones from the generation of light, and I will transform those who were born in darkness[c][b][a], who in their flesh were not repaid with honor as their faith deserved.
  footnotes:
  - marker: a
    text: Or 'their faithfulness deserved.' The Ge'ez term can denote faith in the sense of steadfast fidelity as well as belief.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'I will transform' is difficult. A more image-specific sense such as 'I will make shine' or 'I will illumine' may underlie the line.
    reason: textual_variant
  - marker: c
    text: Or 'And now I summon their spirits—the good ones from the generation of light—and I will transform'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제 나는 빛의 세대에 속한 선한 이들의 영들을 불러내고, 어둠 속에서 태어난 이들 가운데 육체 안에서 그들의 믿음에 합당한 영광을 받지 못한 이들을 변화시킬 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿음’은 여기서 ‘신실함’으로도 옮길 수 있습니다. 게에즈 용어는 믿음과 지속적 충성의 뜻을 함께 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 난해하며, ‘빛나게 하다’ 또는 ‘밝게 하다’라는 이미지가 밑바탕에 있을 수 있습니다.
    reason: textual_variant
  - marker: c
    text: 또는 “그리고 이제 나는 빛의 세대에 속한 선한 이들의 영들을 불러내고, 변화시킬 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: እጼውዕ
  english_pob_choice: I summon
  chosen_korean: 불러내고
  alternatives_korean:
  - 부르고
  - 소집하고
  - 소환하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판적·종말론적 장면의 긴장을 살리면서도 한국어로는 단순한 ‘부르다’보다 ‘불러내다’가 더 엄숙하고 적극적인 소집의 뉘앙스를 담습니다.
- source_word: መናፍስቲሆሙ ለኄራን
  english_pob_choice: the spirits of the good ones
  chosen_korean: 선한 이들의 영들
  alternatives_korean:
  - 좋은 이들의 영들
  - 의로운 이들의 영들
  - 그들의 영들—선한 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 소유격 구조를 따라 ‘선한 이들의 영들’로 옮겨, 본문의 문법을 보존하면서도 ‘의로운’처럼 더 기술적인 종교어로 좁히지 않았습니다.
- source_word: እምትውልድ እንተ ብርሃን
  english_pob_choice: from the generation of light
  chosen_korean: 빛의 세대에 속한
  alternatives_korean:
  - 빛의 نسل에서
  - 빛의 نسل의
  - 빛의 계보에 속한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 대비를 살리기 위해 ‘빛의 세대’의 이미지를 유지하되, 한국어 문장 흐름에서는 소속 관계를 드러내는 ‘~에 속한’이 자연스럽습니다.
- source_word: እዊልጥ
  english_pob_choice: I will transform
  chosen_korean: 변화시킬 것입니다
  alternatives_korean:
  - 변형시킬 것입니다
  - 빛나게 할 것입니다
  - 밝게 하실 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 동사는 난해하지만, POB의 주석처럼 ‘빛나게 하다’의 이미지가 가능하더라도 여기서는 육체적 삶에서의 수치를 거꾸로 뒤집는 종말론적 변화를 포괄하는 ‘변화시키다’가 가장 절제된 선택입니다.
- source_word: በሥጋሆሙ ኢተፈደዩ ክብር
  english_pob_choice: who in their flesh were not repaid with honor
  chosen_korean: 육체 안에서 ... 영광을 받지 못한 이들
  alternatives_korean:
  - 몸 안에서 ... 영광을 받지 못한 이들
  - 육신에서 ... 영광으로 갚아지지 않은 이들
  - 살에서 ... 영광을 받지 못한 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘flesh’를 문자적으로 ‘육체’로 옮겨, 현세의 몸을 가리키는 표현임을 보존했습니다. ‘repaid with honor’는 한국어에서 자연스럽게 ‘영광을 받다’로 풀 수 있지만, 본문의 보상/응보 뉘앙스를 유지했습니다.
- source_word: ሃይማኖቶሙ
  english_pob_choice: their faith
  chosen_korean: 그들의 믿음
  alternatives_korean:
  - 그들의 신실함
  - 그들의 충성
  - 그들의 신앙
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 프로젝트 기본어인 ‘믿음’을 유지하되, 이 맥락에서 ‘faithfulness’ 가능성은 주석 처리하지 않고 본문은 가장 직접적인 의미를 따랐습니다.
theological_decisions:
- issue: ‘어둠 속에서 태어난 이들’과 ‘선한 이들’의 관계
  chosen_reading: 두 표현을 긴밀히 이어 종말론적 역전의 한 장면으로 읽었습니다.
  alternative_readings:
  - 서로 다른 두 집단으로 읽기
  - ‘어둠 속에서 태어난 이들’을 별도의 부정적 범주로 읽기
  rationale: 게에즈 문장의 접속과 병렬이 강하게 이어져 있어, 이를 두 집단의 단순 대비보다 심판과 회복이 맞물린 역전의 이미지로 살리는 편이 본문에 더 충실합니다.
  doctrine_reference: 'POB 번역 원칙: 문법적 결속이 강한 병렬은 과도하게 체계화하지 않고 본문의 긴장과 역전을 보존'
- issue: ሃይማኖት의 번역
  chosen_reading: 믿음
  alternative_readings:
  - 신실함
  - 충성
  rationale: 이 절에서는 ‘믿음’이 기본값이며, ‘신실함’은 가능하지만 본문이 요구하는 최소 의미를 넘어서지 않도록 본문에는 넣지 않았습니다.
  doctrine_reference: 'POB glossary default: πίστις → 믿음'
