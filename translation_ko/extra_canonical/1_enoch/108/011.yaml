  rationale: 본문의 동사는 난해하지만, POB의 주석처럼 ‘빛나게 하다’의 이미지가 가능하더라도 여기서는 육체적 삶에서의 수치를 거꾸로 뒤집는 종말론적 변화를 포괄하는 ‘변화시키다’가 가장 절제된 선택입니다.
