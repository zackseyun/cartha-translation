  - 몸을 고생시켰으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 자기 수양으로 좁히지 않고, 본문의 고통·자기희생적 뉘앙스를 살리는 직접적인 표현으로 옮겼습니다.
- source_word: ወተፈድዩ በኀበ አምላክ
  english_pob_choice: and received recompense from God
  chosen_korean: 하나님께 보상을 받은 이들과
  alternatives_korean:
  - 하나님께 보상을 받았으며
  - 하나님께 갚음을 받은 이들과
