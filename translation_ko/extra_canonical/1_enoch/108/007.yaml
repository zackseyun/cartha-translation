base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/007.yaml
  text: For there are writings and records concerning them in heaven above[a], so that the angels may read them and know what will come upon the sinners, and upon the humble in spirit, and upon those who afflicted their bodies and received recompense from God[d][c][b], and those who were put to shame by evil men.
  footnotes:
  - marker: a
    text: The paired expression rendered 'writings and records' is difficult. The second term can be understood in more than one way; the translation follows the sense of heavenly written records because the next clause says the angels read them.
    reason: lexical_alternative
  - marker: b
    text: Or 'the humble souls.' The Ge'ez literally speaks of 'humble spirits/souls.'
    reason: lexical_alternative
  - marker: c
    text: The final clause may also be rendered 'those who were reproached/despised by evil men.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the humble in spirit'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들에 관한 글과 기록이 하늘 높은 곳에[a] 있으니, 천사들이 그것을 읽고 죄인들과 겸손한 영들과 자기 몸을 괴롭게 하여 하나님에게서 보상을 받은 이들과 악한 사람들에게 수치를 당한 이들에게 닥칠 일을 알게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘글과 기록’으로 옮긴 짝 표현은 뜻이 분명하지 않습니다. 둘째 말은 다른 의미로도 이해될 수 있으나, 이어지는 말에서 천사들이 그것들을 읽는다고 하므로 여기서는 하늘의 문서적 기록을 가리키는 것으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽሑፋን ወእኩያን
  english_pob_choice: writings and records
  chosen_korean: 글과 기록
  alternatives_korean:
  - 글들과 기록들
  - 문서와 기록
  - 기록된 글
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 명사는 하늘의 문서 보관 이미지를 이루므로, 과도하게 구체화하지 않으면서도 ‘글과 기록’으로 중첩된 서면 자료의 느낌을 살렸습니다.
- source_word: መናፍስት ትኁታን
  english_pob_choice: the humble in spirit
  chosen_korean: 겸손한 영들
  alternatives_korean:
  - 겸손한 심령들
  - 마음이 겸손한 이들
  - 겸허한 영들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 문자적 구조는 ‘영들/영혼들’에 해당하는 복수 명사와 형용사 ‘겸손한’의 결합이므로, 내면 상태를 풀어쓴 영어식 완화보다 ‘영들’을 유지했습니다.
- source_word: እለ አሕመሙ ሥጋሆሙ
  english_pob_choice: those who afflicted their bodies
  chosen_korean: 몸을 괴롭게 하였으며
  alternatives_korean:
  - 몸을 학대하였으며
  - 육신을 괴롭혔으며
  - 몸을 고생시켰으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 자기 수양으로 좁히지 않고, 본문의 고통·자기희생적 뉘앙스를 살리는 직접적인 표현으로 옮겼습니다.
- source_word: ወተፈድዩ በኀበ አምላክ
  english_pob_choice: and received recompense from God
  chosen_korean: 하나님께 보상을 받은 이들과
  alternatives_korean:
  - 하나님께 보상을 받았으며
  - 하나님께 갚음을 받은 이들과
  - 하나님께 보답을 받은 이들과
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보상/갚음의 법정적·보응적 의미를 보존하되, 문맥상 단순한 금전적 보상으로 좁아지지 않도록 ‘보상’을 택했습니다.
- source_word: እለ ኀሥሡ እምእኩያን ሰብእ
  english_pob_choice: those who were put to shame by evil men
  chosen_korean: 악한 사람들에게 수치를 당한 이들과
  alternatives_korean:
  - 악한 사람들에게 모욕당한 이들과
  - 악한 사람들에게 멸시당한 이들과
  - 악인들에게 수치를 당한 이들과
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 동사는 ‘부끄럽게 하다/수치를 주다’의 의미가 강하므로, POB의 해석을 따라 수치의 경험을 전면에 두었습니다.
theological_decisions:
- issue: 하늘의 기록물 이미지
  chosen_reading: 본문은 천사들이 읽는 하늘의 서면 기록을 말하므로, ‘글과 기록’과 ‘읽다’를 그대로 살렸습니다.
  alternative_readings:
  - ‘책들’로 특정하기
  - 단순한 상징적 기억으로 완화하기
  rationale: 천사들의 열람 목적이 명시되어 있어, 심판·기억의 천상 기록이라는 묵시문학적 이미지를 약화시키지 않는 것이 좋습니다.
  doctrine_reference: 묵시문학의 하늘 책 모티프를 평이한 추상어로 환원하지 않기
- issue: ‘겸손한 영들’의 번역
  chosen_reading: 게에즈 문법과 평행구조를 따라 ‘겸손한 영들’로 옮겼습니다.
  alternative_readings:
  - ‘겸손한 마음을 가진 이들’
  - ‘심령이 겸손한 자들’
  rationale: 본 절은 ‘영들’이라는 존재론적 표현을 유지하며 의인의 상태를 묘사하므로, 내면적 성향만을 가리키는 표현으로 평탄화하지 않았습니다.
  doctrine_reference: 본문의 어법과 계시적 긴장을 보존하기
