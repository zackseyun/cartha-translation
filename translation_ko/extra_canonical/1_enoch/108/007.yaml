theological_decisions:
- issue: 하늘의 기록물 이미지
  chosen_reading: 본문은 천사들이 읽는 하늘의 서면 기록을 말하므로, ‘글과 기록’과 ‘읽다’를 그대로 살렸습니다.
  alternative_readings:
  - ‘책들’로 특정하기
  - 단순한 상징적 기억으로 완화하기
  rationale: 천사들의 열람 목적이 명시되어 있어, 심판·기억의 천상 기록이라는 묵시문학적 이미지를 약화시키지 않는 것이 좋습니다.
  doctrine_reference: 묵시문학의 하늘 책 모티프를 평이한 추상어로 환원하지 않기
- issue: ‘겸손한 영들’의 번역
  chosen_reading: 게에즈 문법과 평행구조를 따라 ‘겸손한 영들’로 옮겼습니다.
  alternative_readings:
  - ‘겸손한 마음을 가진 이들’
  - ‘심령이 겸손한 자들’
  rationale: 본 절은 ‘영들’이라는 존재론적 표현을 유지하며 의인의 상태를 묘사하므로, 내면적 성향만을 가리키는 표현으로 평탄화하지 않았습니다.
  doctrine_reference: 본문의 어법과 계시적 긴장을 보존하기
