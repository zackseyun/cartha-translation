  - 문서와 기록
  - 기록된 글
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 명사는 하늘의 문서 보관 이미지를 이루므로, 과도하게 구체화하지 않으면서도 ‘글과 기록’으로 중첩된 서면 자료의 느낌을 살렸습니다.
- source_word: መናፍስት ትኁታን
  english_pob_choice: the humble in spirit
  chosen_korean: 겸손한 영들
  alternatives_korean:
  - 겸손한 심령들
  - 마음이 겸손한 이들
  - 겸허한 영들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 문자적 구조는 ‘영들/영혼들’에 해당하는 복수 명사와 형용사 ‘겸손한’의 결합이므로, 내면 상태를 풀어쓴 영어식 완화보다 ‘영들’을 유지했습니다.
- source_word: እለ አሕመሙ ሥጋሆሙ
