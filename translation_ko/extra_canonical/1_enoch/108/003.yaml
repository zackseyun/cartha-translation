  rationale: 게으즈 동사는 ‘기다리다/기대하다’의 뜻이므로, 오해의 소지가 있는 ‘굳게 서다’보다 문맥에 맞는 명령형 ‘기다리십시오’가 원문을 더 정확히 반영합니다.
