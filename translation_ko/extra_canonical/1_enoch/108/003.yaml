base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/003.yaml
  text: But you[a], wait until sin passes away; for their names will be blotted out from the book of life and from the books of the holy ones, and their offspring will be destroyed forever. And their spirits will be slain, and they will cry out and lament in a desolate place that is unseen, and in burning fire[d][c][b]; for there is no earth there.
  footnotes:
  - marker: a
    text: Or 'that cannot be seen.' The Ge'ez expression is difficult, and a more literal rendering is retained in the main text to avoid false precision.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'there is no earth there' is likely part of the visionary description of the place of punishment; it is rendered literally because the image is unusual and uncertain.
    reason: cultural_note
  - marker: c
    text: Or 'hold firm'.
    reason: previous_rendering
  - marker: d
    text: Or 'that cannot be shown'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 당신들은 죄가 지나갈 때까지 기다리십시오. 그들의 이름은 생명의 책과 거룩한 자들의 책들에서 지워지고, 그들의 자손은 영원히 멸망될 것이며, 그들의 영들은 죽임을 당하고, 보이지 않는 황폐한 곳에서 울부짖고 탄식할 것이며, 타는 불 가운데 있을 것입니다. 거기에는 땅이 없습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 게으즈 동사는 ‘기다리다/기대하다’의 뜻이므로, ‘굳게 서다’보다 ‘기다리다’가 원문에 더 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거기에는 땅이 없습니다’는 심판 장소에 대한 비전적 묘사로 보이며, 낯선 이미지를 그대로 살렸습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘굳게 서십시오’.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘보일 수 없는’.
    reason: previous_rendering
