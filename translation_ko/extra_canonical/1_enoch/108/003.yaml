  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 기록에서 삭제되는 이미지를 가지므로, 명부적 맥락을 살리는 ‘지워지고’가 자연스럽고도 직접적입니다.
