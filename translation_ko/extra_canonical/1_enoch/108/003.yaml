theological_decisions:
- issue: ‘생명의 책’과 ‘거룩한 자들의 책들’의 관계
  chosen_reading: 두 종류의 하늘 기록을 함께 보존해, 이름의 말소와 소속의 상실이라는 이중 이미지를 드러냈습니다.
  alternative_readings:
  - ‘거룩한 자들의 책들’을 하나의 상징적 표현으로 완화할 수 있습니다.
  - 두 표현을 단일한 책으로 통합해 옮길 수도 있습니다.
  rationale: 본문은 단수 ‘생명의 책’과 복수 ‘책들’을 병렬로 제시하므로, 이를 합치지 않고 그대로 살리는 것이 문학적·신학적 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
- issue: 영들의 멸망과 불 심판의 성격
  chosen_reading: 후대 교리를 체계화하지 않고, 본문이 제시하는 파멸과 고통의 종말론적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 상징적 완전 파멸로 이해할 수 있습니다.
  - 의식적 사후 형벌의 묘사로 읽을 수 있습니다.
  rationale: ‘죽임’, ‘울부짖음’, ‘탄식’, ‘불’이 함께 나오므로, 특정 교리로 환원하지 않는 것이 원문의 강도를 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
