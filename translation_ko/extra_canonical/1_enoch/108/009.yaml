base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/009.yaml
  text: those who[a], from the time they came to be, did not desire the food that is on the earth, but regarded their souls as a passing breath, and kept this, and the Lord tested them greatly, and their spirits were found pure[c][b], so that they might bless his name.
  footnotes:
  - marker: a
    text: Or 'like a spirit that passes away'; the Ge'ez word can denote spirit, wind, or breath.
    reason: lexical_alternative
  - marker: b
    text: The clause 'gave up their souls' is difficult and may express severe self-denial, even to the point of risking life.
    reason: alternative_reading
  - marker: c
    text: Or 'gave up their souls'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 태어날 때부터 땅에 있는 음식을 원하지 않았고, 자기들의 생명을 지나가는 숨결처럼 여겼습니다.[a][b] 그들은 이것을 지켰고, 주께서 그들을 크게 시험하셨습니다. 그들의 영은 순수한 것으로 드러났습니다. 그리하여 그들이 그의 이름을 찬송하도록 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘생명’은 ‘영혼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 ‘숨결’은 영, 바람, 숨결을 모두 뜻할 수 있습니다. 여기서는 지나가 버리는 것의 덧없음을 강조하는 비유로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢፈተዉ
  english_pob_choice: did not desire
  chosen_korean: 원하지 않았고
  alternatives_korean:
