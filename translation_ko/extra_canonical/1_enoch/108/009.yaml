  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 거절보다 내적 욕구의 부재를 나타내므로, 금욕적 뉘앙스를 살리는 ‘원하지 않았고’로 옮겼습니다.
