theological_decisions:
- issue: መንፈስ의 의미를 어떻게 한국어로 살릴지
  chosen_reading: ‘지나가는 숨결’로 옮겨, 개인 존재의 덧없음과 전이성을 강조했습니다.
  alternative_readings:
  - 영
  - 바람
  rationale: 이 문맥에서는 존재의 일시성이 핵심이므로, ‘영’처럼 더 넓은 신학적 용어보다 ‘숨결’이 원문의 비유를 더 직접적으로 드러냅니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
