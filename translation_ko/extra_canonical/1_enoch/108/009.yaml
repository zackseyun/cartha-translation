  - 세상에 있는 음식
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지상적 대조를 분명히 하면서도, 원문의 구체적 식물/음식 이미지를 보존하기 위해 ‘땅에 있는 음식’으로 자연스럽게 옮겼습니다.
- source_word: ረሰዩ ነፍሳቶሙ
  english_pob_choice: regarded their souls as a passing breath
  chosen_korean: 자신들의 영혼을 지나가는 숨결처럼 여기며
  alternatives_korean:
  - 자신들의 영혼을 사라지는 영처럼 여기며
  - 자신들의 생명을 지나가는 숨결처럼 여기며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 ረሰየ는 ‘여기다/간주하다’의 뜻이므로 ‘버리다’가 아니라 판단 행위로 옮겼고, መንፈስ의 일시성을 살리기 위해 ‘지나가는 숨결’로 표현했습니다.
- source_word: ተረክቡ መንፈሳቲሆሙ ንጹሕተ
  english_pob_choice: their spirits were found pure
  chosen_korean: 그들의 영은 순결한 것으로 드러났으니
  alternatives_korean:
  - 그들의 영은 순결하다고 판명되었으니
  - 그들의 영은 순수한 것으로 드러났으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시험 후 판정의 흐름을 살려 ‘드러났으니’로 옮겼고, መንፈሳቲሆሙ는 여기서 인격적 내면을 가리키므로 ‘영’으로 처리했습니다.
theological_decisions:
- issue: መንፈስ의 의미를 어떻게 한국어로 살릴지
  chosen_reading: ‘지나가는 숨결’로 옮겨, 개인 존재의 덧없음과 전이성을 강조했습니다.
  alternative_readings:
  - 영
  - 바람
  rationale: 이 문맥에서는 존재의 일시성이 핵심이므로, ‘영’처럼 더 넓은 신학적 용어보다 ‘숨결’이 원문의 비유를 더 직접적으로 드러냅니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
