  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 말하기/선언하기의 1인칭 증언을 유지하되, ‘책들’의 복수와 문학적 자기지시를 살려 직역에 가깝게 옮겼습니다.
- source_word: እምእስትንፋሶሙ ዘበዓለም
  english_pob_choice: more than their life in the world
  chosen_korean: 세상에서의 자기 목숨보다
  alternatives_korean:
  - 세상에서의 숨보다
  - 세상에서의 생명보다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘숨/호흡’의 관용적 의미를 살리되 한국어에서는 자연스러운 대비를 위해 ‘목숨’으로 옮겨 천상에 대한 선호를 분명히 했습니다.
- source_word: ይትከየዱ ... ትዕይርተ ወጽርፈተ
  english_pob_choice: they are trodden down ... abuse and reviling
  chosen_korean: 짓밟히면서도 ... 욕설과 조롱
  alternatives_korean:
  - 억압받으면서도 ... 모욕과 비방
