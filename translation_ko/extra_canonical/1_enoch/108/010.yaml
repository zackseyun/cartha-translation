base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/010.yaml
  text: And I have spoken of all their blessings in the books, and he has rewarded them themselves, because these are found to love heaven more than their life in the world; and while they are trodden down by evil men, they hear from them abuse and reviling and are put to shame while blessing me.
  footnotes:
  - marker: a
    text: Literally, 'their heads.' The phrase may mean their leaders or chiefs; the Ge'ez wording is difficult.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'their breath in the world.' Here 'breath' is rendered as 'life' to convey the idiom.
    reason: lexical_alternative
  - marker: c
    text: The final clause reads 'while blessing me.' The first-person object is retained as written, though some interpreters suspect a difficult or corrupt reading here.
    reason: textual_variant
  - marker: d
    text: Or 'and I have set them down for their leaders'.
    reason: previous_rendering
  - marker: e
    text: Or 'and hear from them abuse and reviling, they endure it while blessing me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 책들 안에 그들의 모든 복을 말하였고, 그들의 머리들에 대하여 그들을 두었으며, 이는 그들이 세상에서의 자기 목숨보다 하늘을 사랑하는 자들로 드러났기 때문입니다. 그리고 그들은 악한 사람들에게 짓밟히면서도 그들에게서 욕설과 조롱을 듣고, 나를 축복하면서 수치를 당합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘그들의 머리들’은 지도자들 또는 우두머리들을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 숨’이지만, 여기서는 관용적으로 ‘목숨’의 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절의 ‘나를’은 본문 그대로 살린 표현으로, 일부 해석자들은 본문 전승상 난해하거나 훼손된 읽기라고 봅니다.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ በረከቶሙ
  english_pob_choice: all their blessings
  chosen_korean: 그들의 모든 복
  alternatives_korean:
  - 그들의 모든 축복
  - 그들에게 속한 모든 복
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: በረከት은 기본적으로 ‘복/축복’을 뜻하므로, 복수 소유격 구조를 자연스럽게 살려 ‘그들의 모든 복’으로 옮겼습니다.
- source_word: ነገርኩ በመጻሕፍት
  english_pob_choice: I have spoken ... in the books
  chosen_korean: 나는 책들 안에 … 말하였고
  alternatives_korean:
  - 나는 책들에 … 기록하였고
  - 나는 책들 속에서 … 말하였고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 말하기/선언하기의 1인칭 증언을 유지하되, ‘책들’의 복수와 문학적 자기지시를 살려 직역에 가깝게 옮겼습니다.
- source_word: እምእስትንፋሶሙ ዘበዓለም
  english_pob_choice: more than their life in the world
  chosen_korean: 세상에서의 자기 목숨보다
  alternatives_korean:
  - 세상에서의 숨보다
  - 세상에서의 생명보다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘숨/호흡’의 관용적 의미를 살리되 한국어에서는 자연스러운 대비를 위해 ‘목숨’으로 옮겨 천상에 대한 선호를 분명히 했습니다.
- source_word: ይትከየዱ ... ትዕይርተ ወጽርፈተ
  english_pob_choice: they are trodden down ... abuse and reviling
  chosen_korean: 짓밟히면서도 ... 욕설과 조롱
  alternatives_korean:
  - 억압받으면서도 ... 모욕과 비방
  - 밟히면서도 ... 욕과 비난
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘짓밟히다’는 원문의 폭력적 이미지를 보존하며, ‘욕설과 조롱’은 두 개의 적대적 발화를 평행적으로 살린 표현입니다.
- source_word: እንዘ ይባርኩኒ
  english_pob_choice: while blessing me
  chosen_korean: 나를 축복하면서
  alternatives_korean:
  - 나를 축복하며
  - 내게 복을 빌면서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 난해한 1인칭 목적어를 그대로 유지하여 본문이 가진 이례성을 보존했습니다.
theological_decisions:
- issue: 마지막 절의 1인칭 목적어 '나를'의 지시 대상
  chosen_reading: 화자는 에녹으로 유지하고, 본문 표면의 1인칭 목적어를 그대로 살렸습니다.
  alternative_readings:
  - '''나를''은 간접적으로 하나님을 가리킨다'
  - 본문이 훼손되어 원래는 하나님을 가리켰다
  rationale: 직전까지 이어지는 1인칭 증언의 흐름을 끊지 않기 위해 문법적 표면형을 보존하고, 난해성은 번역에서 삭제하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 난해한 전승은 주석으로 남기고 본문에서 해소하지 않음
