  lexicon: Dillmann
  rationale: 어형상 ‘오류/방황/그릇됨’의 범위를 가지므로, 도덕적·상태적 함의를 유지하는 ‘방황’이 가장 무난합니다. 다만 의미 범위는 넓다는 점을 주석으로 남깁니다.
- source_word: ኢትትኌለቍ
  english_pob_choice: will no longer be counted
  chosen_korean: 더 이상 헤아려지지 않을 것입니다
  alternatives_korean:
  - 더 이상 셈해지지 않을 것입니다
  - 더 이상 기록되지 않을 것입니다
  - 더 이상 여겨지지 않을 것입니다
  lexicon: Dillmann
  rationale: 동사의 정확한 힘이 불분명하므로, POB처럼 ‘counted’ 계열을 유지하되 한국어에서는 자연스러운 ‘헤아려지다’로 옮겨 불확실성을 보존했습니다.
