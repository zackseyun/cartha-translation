base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
  footnotes:
  - marker: a
    text: The Ge'ez noun rendered 'region' may also mean 'valley' or more generally 'place'; the topographical sense is uncertain in this witness.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'their beloved ones' is difficult. It likely refers to persons dear to or associated with the chosen, but the exact nuance is uncertain.
    reason: lexical_alternative
  - marker: c
    text: The verb rendered 'will be counted' could also be understood as 'will be known' or 'will be reckoned.' The line is obscure in Ethiopic and should be read with caution.
    reason: alternative_reading
  - marker: d
    text: The expression 'the days of their wandering' may also be translated 'the days of their error' or 'the days of their straying.'
    reason: lexical_alternative
  - marker: e
    text: Or 'that region'.
    reason: previous_rendering
  - marker: f
    text: Or 'and the days of their lives and the days of their wandering will no longer be counted from then on.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날들에 그 골짜기는 택함 받은 이들과 그들이 사랑하는 이들[a]로 가득 차고, 그들의 삶의 날들은 끝나며, 그들이 방황하던 날들[b]은 그때부터 더 이상 헤아려지지 않을 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들이 사랑하는 이들’로 옮긴 표현은 택함 받은 이들과 관계된, 그들에게 소중하거나 사랑받는 이들을 가리킬 수 있습니다. 정확한 관계의 뉘앙스는 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 오류의 날들’, ‘그들이 그릇되게 행하던 날들’입니다. 게으즈어 표현은 방황, 그릇됨, 오류의 의미 범위를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘헤아려지지 않다’는 ‘셈해지지 않다’, ‘여겨지지 않다’로도 이해될 수 있습니다. 이 구절의 정확한 동사적 뉘앙스는 불확실합니다.
    reason: alternative_reading
