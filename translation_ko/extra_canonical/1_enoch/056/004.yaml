  chosen_korean: 그들의 사랑하는 이들
  alternatives_korean:
  - 그들의 사랑받는 이들
  - 그들에게 소중한 이들
  lexicon: Dillmann
  rationale: 소유격이 붙은 복수 표현으로서 관계성을 살려 ‘그들의 사랑하는 이들’로 옮겼습니다. 영문 주석이 밝히듯 정확한 뉘앙스는 다소 불확실합니다.
- source_word: ይትዌዳእ ዕለተ ሕይወቶሙ
  english_pob_choice: the days of their lives will be ended
  chosen_korean: 그들의 생애의 날들은 끝나며
  alternatives_korean:
  - 그들의 삶의 날들은 마무리되며
  - 그들의 생명의 날들은 끝나며
  lexicon: Dillmann
  rationale: 여기에는 ‘그들의 삶의 날들’이 별도 절로서 분명히 존재하므로, 영문 POB의 수정본처럼 ‘끝나며’로 처리해 생애의 종결을 드러냈습니다.
- source_word: ዕለተ ስሕተቶሙ
  english_pob_choice: the days of their wandering
  chosen_korean: 그들의 방황의 날들
  alternatives_korean:
  - 그들의 오류의 날들
  - 그들의 떠돌이의 날들
