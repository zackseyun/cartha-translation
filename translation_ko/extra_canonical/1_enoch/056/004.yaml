base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
  footnotes:
  - marker: a
    text: The Ge'ez noun rendered 'region' may also mean 'valley' or more generally 'place'; the topographical sense is uncertain in this witness.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'their beloved ones' is difficult. It likely refers to persons dear to or associated with the chosen, but the exact nuance is uncertain.
    reason: lexical_alternative
  - marker: c
    text: The verb rendered 'will be counted' could also be understood as 'will be known' or 'will be reckoned.' The line is obscure in Ethiopic and should be read with caution.
    reason: alternative_reading
  - marker: d
    text: The expression 'the days of their wandering' may also be translated 'the days of their error' or 'the days of their straying.'
    reason: lexical_alternative
  - marker: e
    text: Or 'that region'.
    reason: previous_rendering
  - marker: f
    text: Or 'and the days of their lives and the days of their wandering will no longer be counted from then on.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날들에 그 골짜기는 택하신 이들과 그들의 사랑하는 이들로[a] 가득 차고, 그들의 생애의 날들은 끝나며, 그들의 방황의 날들은 그때부터 더 이상 헤아려지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈어 단어는 지형상 ‘골짜기’로 옮기는 것이 가장 자연스럽지만, POB 영어 주석이 밝히듯 일부 증거에서는 더 일반적인 ‘지역/장소’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእቱ ቈላ
  english_pob_choice: that valley
  chosen_korean: 그 골짜기
  alternatives_korean:
  - 그 지역
  - 그 장소
  lexicon: Dillmann
  rationale: 이 게으즈어 어형은 문맥상 지형적 의미가 분명하므로, POB의 수정된 영문과 같이 ‘골짜기’로 옮기는 것이 가장 직접적입니다.
- source_word: ሕሩያን
  english_pob_choice: the chosen
  chosen_korean: 택하신 이들
  alternatives_korean:
  - 선택된 자들
  - 택함 받은 이들
  lexicon: Dillmann
  rationale: 이 단어는 묵시문학적 집단 명칭이므로, ‘택하신 이들’로 옮겨 제목 같은 힘을 살리면서도 후대 교리어를 과도하게 끌어오지 않게 했습니다.
- source_word: ፍቁራነ ዚአሆሙ
  english_pob_choice: their beloved ones
  chosen_korean: 그들의 사랑하는 이들
  alternatives_korean:
  - 그들의 사랑받는 이들
  - 그들에게 소중한 이들
  lexicon: Dillmann
  rationale: 소유격이 붙은 복수 표현으로서 관계성을 살려 ‘그들의 사랑하는 이들’로 옮겼습니다. 영문 주석이 밝히듯 정확한 뉘앙스는 다소 불확실합니다.
- source_word: ይትዌዳእ ዕለተ ሕይወቶሙ
  english_pob_choice: the days of their lives will be ended
  chosen_korean: 그들의 생애의 날들은 끝나며
  alternatives_korean:
  - 그들의 삶의 날들은 마무리되며
  - 그들의 생명의 날들은 끝나며
  lexicon: Dillmann
  rationale: 여기에는 ‘그들의 삶의 날들’이 별도 절로서 분명히 존재하므로, 영문 POB의 수정본처럼 ‘끝나며’로 처리해 생애의 종결을 드러냈습니다.
- source_word: ዕለተ ስሕተቶሙ
  english_pob_choice: the days of their wandering
  chosen_korean: 그들의 방황의 날들
  alternatives_korean:
  - 그들의 오류의 날들
  - 그들의 떠돌이의 날들
  - 그들의 헤매던 날들
  lexicon: Dillmann
  rationale: 어형상 ‘오류/방황/그릇됨’의 범위를 가지므로, 도덕적·상태적 함의를 유지하는 ‘방황’이 가장 무난합니다. 다만 의미 범위는 넓다는 점을 주석으로 남깁니다.
- source_word: ኢትትኌለቍ
  english_pob_choice: will no longer be counted
  chosen_korean: 더 이상 헤아려지지 않을 것입니다
  alternatives_korean:
  - 더 이상 셈해지지 않을 것입니다
  - 더 이상 기록되지 않을 것입니다
  - 더 이상 여겨지지 않을 것입니다
  lexicon: Dillmann
  rationale: 동사의 정확한 힘이 불분명하므로, POB처럼 ‘counted’ 계열을 유지하되 한국어에서는 자연스러운 ‘헤아려지다’로 옮겨 불확실성을 보존했습니다.
theological_decisions:
- issue: ‘chosen’의 한국어 교회용어 처리
  chosen_reading: 택하신 이들
  alternative_readings:
  - 선택된 자들
  - 택함 받은 자들
  - 선민
  rationale: 이 작품의 묵시적 호칭으로서 독자에게 집단 정체성을 곧바로 드러내면서도, ‘선민’처럼 특정 전통어로 굳히지 않기 위해 중립적 표현을 택했습니다.
  doctrine_reference: Consistency of key terms in apocalyptic titles and source-directed rendering
- issue: ‘days of their wandering’의 의미 범위
  chosen_reading: 방황의 날들
  alternative_readings:
  - 오류의 날들
  - 그릇됨의 날들
  - 헤매던 날들
  rationale: 원문과 영문 POB 모두 이 구절의 의미를 확정적으로 단정하지 않으므로, 도덕적/존재론적 방황을 모두 열어 두는 표현을 유지했습니다.
  doctrine_reference: Preserving documented lexical tension rather than flattening ambiguity
