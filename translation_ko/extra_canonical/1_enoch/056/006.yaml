base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/006.yaml
  text: And they shall go up and tread upon the land of his chosen ones[b][a], and the land of his chosen ones shall become before them a trampled place and a beaten path.
  footnotes:
  - marker: a
    text: 'The wording is difficult in Ge''ez. The final pair of expressions likely intensifies the image: the land becomes something trodden down, like a track or beaten path.'
    reason: textual_variant
  - marker: b
    text: Or 'they shall ascend and march over the land of his chosen ones.' The verbs may describe military advance as well as literal treading.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 그의 선택된 자들의 땅 위로 올라가 밟고 지나갈 것이며, 그의 선택된 자들의 땅은 그들 앞에서 짓밟힌 곳과 다져진 길이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘밟고 지나가다’는 전진과 짓밟음의 뜻을 함께 드러내려는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 게에즈어의 마지막 두 표현은 해석하기 어렵습니다. 이 표현들은 그 땅이 짓밟히고, 마치 반복하여 밟혀 난 길처럼 된다는 이미지를 강조하는 것으로 보입니다.
    reason: textual_variant
