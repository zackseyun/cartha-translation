base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/008.yaml
  text: And in those days Sheol will open its mouth[a], and they will sink down into it; and destruction will pursue them[c][b]; Sheol will swallow up the sinners from before the face of the chosen ones.
  footnotes:
  - marker: a
    text: The clause rendered 'and their destruction' is difficult in the Ethiopic and may also be understood more verbally, such as 'and it will destroy them' or 'and their ruin [will come].'
    reason: textual_variant
  - marker: b
    text: '''Before the face of the chosen ones'' is a literal idiom for being removed from their presence.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and their destruction—Sheol'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날들에 스올이 그 입을 열 것이며, 그들은 그 안으로 가라앉을 것이며, 멸망이 그들을 뒤쫓을 것입니다.[a] 스올은 택한 이들 앞에서 죄인들을 삼켜 없앨 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸망이 그들을 뒤쫓을 것입니다’는 원문의 동사적 의미를 살린 번역입니다. ‘멸망이 그들을 따를 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘택한 이들 앞에서’는 직역하면 ‘택한 이들의 얼굴 앞에서부터’입니다. 여기서는 죄인들이 택한 이들 앞에서 제거됨을 뜻합니다.
    reason: lexical_alternative
