base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/007.yaml
  text: And the city of my righteous ones shall be a hindrance to their horses[a]; and they will stir up slaughter among themselves, and their right hand will be strong against them. And a man will not know his brother, nor a son his father or his mother, until the number of the corpses from their death is complete[d][c][b], and their punishment will not be in vain.
  footnotes:
  - marker: a
    text: Or 'obstacle' or 'trap' for their horses; the Ge'ez term suggests something that blocks or ensnares.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a man will not know his brother'; the sense may include 'recognize.'
    reason: lexical_alternative
  - marker: c
    text: The clause about 'the number of the corpses' is textually difficult in the Ethiopic and is rendered transparently rather than smoothed.
    reason: textual_variant
  - marker: d
    text: Or 'they will stir themselves up to slaughter among themselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 나의 의인들의 도시는 그들의 말들에게 걸림돌이 될 것이며[a], 그들은 그들끼리 살육을 일으킬 것입니다. 또 그들의 오른손이 그들을 거슬러 강해질 것입니다. 사람은 자기 형제를 알지 못하고, 아들은 자기 아버지와 어머니를 알지 못할 것입니다[b]. 그들의 죽음으로 인한 시체의 수가 차기까지[c] 그러할 것이며, 그들의 형벌은 헛되지 않을 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘걸림돌’은 말들을 실제로 막는 장애물 또는 덫의 의미를 넓게 담은 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘형제를 알지 못한다’입니다. 여기의 ‘알다’는 단순 지식보다 알아보지 못함까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 게에즈 본문의 이 구절은 수량 표현이 난해하므로, 의미를 매끈하게 정리하기보다 구조를 드러내는 방식으로 옮겼습니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘그들의 형벌은 효과 없이 끝나지 않을 것입니다’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሀገረ
  english_pob_choice: city
  chosen_korean: 도시
  alternatives_korean:
  - 성읍
  - 성
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지리적·군사적 장면을 살리기 위해 ‘도시’로 옮겼습니다. ‘성읍’보다 현대 한국어에서 덜 고어적이면서도 공성 이미지를 유지합니다.
- source_word: ጻድቃነ
  english_pob_choice: my righteous ones
  chosen_korean: 의인들
  alternatives_korean:
  - 나의 의인들
  - 의로운 사람들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 본문에 나타난 소유격의 힘은 본문 의미상 중요하지만, 한국어에서는 ‘의인들의 도시’가 자연스럽고 간결합니다. 소유 관계는 본문 전체의 심판-보호 구조 속에서 암시적으로 유지됩니다.
- source_word: ማዕቀፈ
  english_pob_choice: hindrance
  chosen_korean: 걸림돌
  alternatives_korean:
  - 장애물
  - 함정
  - 방해물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 말들 앞에 놓여 이동을 막는 이미지를 살리면서도, 단순한 ‘방해’보다 더 구체적인 정지·좌절의 뉘앙스를 주는 한국어 표현으로 옮겼습니다.
- source_word: ያነሥኡ ቀትለ
  english_pob_choice: they will stir up slaughter
  chosen_korean: 살육을 일으킬 것입니다
  alternatives_korean:
  - 도살을 일으킬 것입니다
  - 살육을 자극할 것입니다
  - 살육을 불러일으킬 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최종 개정대로 동사가 목적어를 취하는 구조를 반영해, ‘스스로 싸우다’가 아니라 ‘살육을 일으키다’로 옮겼습니다. ‘살육’은 종말론적 대량 살상을 더 직접적으로 드러냅니다.
- source_word: የማኖሙ ዲቤሆሙ
  english_pob_choice: their right hand will be strong against them
  chosen_korean: 그들의 오른손은 그들에게 강하게 될 것입니다
  alternatives_korean:
  - 그들의 오른손은 그들 위에 강할 것입니다
  - 그들의 오른손은 그들에 대하여 강할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘오른손’은 권세와 힘의 상징이며, ‘강하게 될 것입니다’는 원문의 직설적 힘의 표현을 보존합니다. ‘대적하다’로 풀면 원문의 긴장감이 약해집니다.
- source_word: ኢያእምር ብእሲ ለአኁሁ
  english_pob_choice: a man will not know his brother
  chosen_korean: 사람은 자기 형제를 알지 못하고
  alternatives_korean:
  - 사람은 자기 형제를 알아보지 못하고
  - 사람은 자기 형제를 인식하지 못하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘알다/recognize’의 기본 의미를 유지해, 친족 관계의 붕괴를 가장 직접적으로 드러냈습니다. 문맥상 단순 인지 실패가 아니라 재난 속 신원 상실의 뉘앙스가 함께 살아납니다.
- source_word: ኢወልድ ለአቡሁ ወለእሙ
  english_pob_choice: nor a son his father or his mother
  chosen_korean: 아들은 자기 아버지와 어머니를 알지 못할 것입니다
  alternatives_korean:
  - 아들은 자기 아버지와 어머니를 알아보지 못할 것입니다
  - 아들은 자기 아버지나 어머니를 알지 못할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞 절의 동사를 자연스럽게 보충해, 자녀와 부모 사이의 인식 붕괴를 한국어 문장으로 매끄럽게 재현했습니다.
- source_word: ኍልቈ አብድነት እሞቶሙ
  english_pob_choice: the number of the corpses from their death is complete
  chosen_korean: 그들의 죽음으로 인한 시체의 수가 차기까지
  alternatives_korean:
  - 그들의 죽음의 시체 수가 완전해질 때까지
  - 그들의 죽음으로 생긴 시체의 수가 채워질 때까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 난해한 수량 표현을 매끄럽게 평탄화하지 않고, ‘수’와 ‘차기까지’를 남겨 투명하게 옮겼습니다. 이는 심판의 집계라는 냉혹한 이미지를 보존합니다.
theological_decisions:
- issue: ‘my righteous ones’의 소유격 처리
  chosen_reading: 본문의 소유격 뉘앙스는 한국어 본문에서 직접 반복하기보다 ‘의인들의 도시’로 자연화하되, 심판과 보호의 관계는 유지합니다.
  alternative_readings:
  - 나의 의인들의 도시
  - 의인들의 도시
  rationale: 게에즈 증언의 소유 관계는 중요하지만, 한국어에서 ‘나의 의인들’은 지나치게 설명적일 수 있습니다. 문장 흐름과 묵시적 소유/보호 개념의 균형을 위해 간결한 표현을 택했습니다.
  doctrine_reference: 원문 우선, 과도한 신학적 명시화보다 텍스트의 수사 구조 보존
- issue: ‘among themselves’의 폭력 묘사
  chosen_reading: 상호 내전적 혼란으로 완곡화하지 않고 ‘서로의 가운데서 살육을 일으킬 것입니다’로 생생하게 유지합니다.
  alternative_readings:
  - 서로 싸우게 될 것입니다
  - 서로를 죽이게 될 것입니다
  - 내란이 일어날 것입니다
  rationale: English POB의 최종 수정과 게에즈 문법은 상호 파괴적 폭력을 가리킵니다. 이를 일반적 혼란으로 완화하면 묵시문학 특유의 심판적 긴장이 약해집니다.
  doctrine_reference: 묵시적 심판 이미지의 보존
