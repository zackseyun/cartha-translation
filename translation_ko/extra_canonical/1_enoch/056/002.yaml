  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 목적지/대상을 묻는 표현이므로 ‘누구에게’로 옮겨 대상성을 드러냈습니다.
- source_word: እሉ እለ ይአኅዙ መቅሠፍተ
