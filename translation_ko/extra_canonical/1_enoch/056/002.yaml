base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/002.yaml
  text: And I asked the angel of peace who went with me, saying, “To whom are they going, these who hold the scourges?”
  footnotes:
  - marker: a
    text: Or 'scourges' or 'implements of chastisement'; the Ge'ez term may denote either punishment itself or the means by which it is inflicted.
    reason: lexical_alternative
  - marker: b
    text: Or '“These who hold the instruments of punishment—who are they?”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 나와 함께 가던 평화의 천사에게 물으며 말했습니다. “저들은 누구에게 가고 있습니까? 채찍을 든 이들은 말입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘징벌의 도구들’; 게으즈어 용어는 형벌 그 자체나 그것이 가해지는 수단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘채찍을 든 이들은 누구에게 가고 있습니까?’
    reason: alternative_reading
lexical_decisions:
- source_word: ተስእልክዎ
  english_pob_choice: I asked
  chosen_korean: 나는 … 물으며
  alternatives_korean:
  - 나는 … 물었습니다
  - 나는 … 물어보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 질문 행위를 자연스럽게 드러내면서도 뒤따르는 직접화법을 살리기 위해 ‘물으며’로 옮겼습니다.
- source_word: መልአክ ሰላም
  english_pob_choice: angel of peace
  chosen_korean: 평화의 천사
  alternatives_korean:
  - 평강의 천사
  - 평화로운 천사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈의 속격 구성을 그대로 살려 ‘천사 of peace’의 관계를 유지했습니다. 여기서는 추상명사 ‘평화’가 가장 자연스럽고, 본문의 고유한 표현도 보존합니다.
- source_word: ዘየሐውር ምስሌየ
  english_pob_choice: who went with me
  chosen_korean: 나와 함께 가던
  alternatives_korean:
  - 나와 동행하던
  - 나와 함께 가고 있던
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동반하는 천사의 지속적 동행을 나타내기 위해 과거 진행·반복의 뉘앙스를 가진 ‘가던’으로 옮겼습니다.
- source_word: እንዘ እብል
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하며
  - 이르며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접화법 도입 공식이므로 한국어에서는 자연스러운 서술 전환으로 처리했습니다.
- source_word: ለመኑ የሐውሩ
  english_pob_choice: To whom are they going
  chosen_korean: 누구에게 가고 있습니까
  alternatives_korean:
  - 어디로 가고 있습니까
  - 무엇을 향해 가고 있습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 목적지/대상을 묻는 표현이므로 ‘누구에게’로 옮겨 대상성을 드러냈습니다.
- source_word: እሉ እለ ይአኅዙ መቅሠፍተ
  english_pob_choice: these who hold the scourges
  chosen_korean: 채찍을 든 이들은
  alternatives_korean:
  - 징계의 도구를 든 이들은
  - 징벌의 도구를 쥔 이들은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 ‘scourges’ 선택을 따라 구체적이고 시각적인 ‘채찍’을 택했습니다. 다만 게으즈어가 더 넓게 ‘징벌의 도구/형벌의 수단’을 가리킬 수 있어 본문에는 너무 협소하지 않은 방식으로 유지했습니다.
theological_decisions:
- issue: መቅሠፍተ의 구체성
  chosen_reading: ‘채찍’으로 구체화하되, 형벌 행위 자체를 상징하는 묵시적 이미지로 읽습니다.
  alternative_readings:
  - ‘징벌의 도구’로 더 일반화
  - ‘형벌’로 추상화
  rationale: 문맥이 ‘든’ 대상을 말하므로 추상명사보다 물건/도구의 이미지가 더 적합합니다. 동시에 제재와 심판의 상징성을 유지해야 하므로 너무 기술적으로 좁히지 않았습니다.
  doctrine_reference: 묵시문학의 심판 상징을 보존하고, 문장 구조가 요구하는 구체성을 살립니다.
