base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/005.yaml
  text: And in those days the angels will return and turn their heads toward the east[a], toward the people of Parthia and Media. They will stir up the kings, and a spirit of turmoil will come upon them; it will unsettle them from their thrones, and they will go out like lions from their lairs[c][b], and like hungry wolves in the midst of their pasture.
  footnotes:
  - marker: a
    text: The object after 'They will stir up' is textually difficult in the OCR. The sense of rulers or kings is likely, since the next clause speaks of being driven from 'their thrones.'
    reason: textual_variant
  - marker: b
    text: Or 'a spirit of confusion.' The Ge'ez expression can denote a force or condition of disorder without specifying whether a personal spirit-being is meant.
    reason: lexical_alternative
  - marker: c
    text: Or 'gather themselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날들에 천사들은 돌아올 것이며[c] 동쪽, 곧 파르티아와 메디아 사람들을 향해 머리를 돌릴 것입니다. 그들은 왕들을[a] 동요시키고, 혼란의 영[b]이 그들 위에 임할 것입니다. 그 영은 그들을 그들의 보좌에서 몰아낼 것이며, 그들은 그들의 굴에서 나오는 사자들처럼, 또 그들의 초원 한가운데 있는 굶주린 늑대들처럼 나올 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘왕들’을 직접 목적어로 두는 읽기가 가장 자연스럽지만, OCR로 인해 해당 대목이 다소 불안정합니다. 문맥상 보좌와의 연결이 왕들을 강하게 뒷받침합니다.
    reason: textual_variant
  - marker: b
    text: 이 표현은 개인적 영적 존재를 가리킬 수도 있고, 혼란이나 동요의 상태를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 이전 번역은 첫 동사를 ‘천사들이 모인다’ 또는 ‘함께 모인다’로 옮깁니다. 그러나 여기서 채택한 본문은 ‘돌아오다’라는 뜻의 동사 형태를 지지합니다.
    reason: previous_rendering
