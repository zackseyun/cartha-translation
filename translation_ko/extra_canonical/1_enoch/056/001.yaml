  text: And there I saw the angels of punishment going about[c][b][a], and they were holding scourges and chains of iron and bronze.
  footnotes:
  - marker: a
    text: The Ge'ez wording for the implements is difficult. The first item may denote chains or fetters; the second may denote scourges, whips, or another punitive instrument of metal.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in vision' is explicit in the Ge'ez, though English style can absorb it into 'I saw there.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And there I saw the angels of punishment going about, and they were holding chains of iron and bronze scourges.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기에서 나는 형벌의 천사들이 이리저리 다니는 것을 보았고, 그들은 채찍들과 철과 청동으로 된 사슬들을 들고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 두 도구의 정확한 명칭이 다소 불분명하므로, 한국어는 문맥상 가능한 대응으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 환상 속 ‘거기에서’라는 위치 감각을 분명히 드러냅니다.
    reason: source_note
  - marker: c
    text: 원문은 ‘형벌의 천사들’이 이리저리 다니는 장면을 직접적으로 말합니다.
    reason: source_note
