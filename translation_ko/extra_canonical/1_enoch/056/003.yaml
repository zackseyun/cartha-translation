  source_fidelity: 현 번역은 ዚአሆሙ의 소유격을 ‘그들의’로 반영한 점은 적절합니다. 그러나 ከመ፡ ይትወደዩ의 목적/귀결 구조를 ‘던져지게 하려는 것입니다’으로 옮기면서 원문에 없는 의도적 행위 주체를 보충했습니다. 또한 ‘골짜기 깊은 곳의 구렁텅이’는 ‘골짜기의 심연’과 그 안의 ‘갈라진 틈/벌어진 곳’이라는 겹친 지형 표현을 충분히 보존하지 못합니다.
  naturalness: 원문의 발화는 앞 절의 질문에 이어지는 타원적이고 난해한 답변으로 보입니다. 한국어에서도 이를 지나치게 완결된 설명문으로 바꾸지 않고, 인용문 안의 비정상적으로 압축된 구조를 유지하는 것이 안전합니다. 다만 ‘선택된 자들’보다 ‘선택된 이들’이 현대 한국어에서 조금 더 자연스럽습니다.
  terminology: ‘사랑하는 이들’은 소유격과 관계의 모호성을 보존합니다. ‘심연’은 ማዕምቅ에 적합하며, ንቅዐተ는 ‘갈라진 틈’으로 옮겨 별도 어휘임을 드러냈습니다. ‘택한 이들’ 같은 전통적 신학 용어는 원문의 지시 대상이 불명확하므로 피했습니다.
  issues:
  - severity: medium
    issue: ‘그들이 … 던져지게 하려는 것입니다’가 원문에 없는 의도적 사역 의미를 더합니다.
