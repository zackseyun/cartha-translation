base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/003.yaml
  text: And he said to me[a], 'To their chosen ones and to their beloved ones[c][b], so that they may be cast into the chasm of the abyss of the valley.'
  footnotes:
  - marker: a
    text: The wording is difficult. 'For the chosen and for their beloved ones' may refer to persons designated in the preceding vision, but the exact referent is not explicit in this verse alone.
    reason: alternative_reading
  - marker: b
    text: Or 'into the cleft/fissure of the abyss of the valley.' The Ge'ez imagery is topographical and ominous; the exact nuance of the opening is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or "'These are for the chosen and for their beloved ones,".
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 내게 말하였습니다. “그들의 선택된 이들과 그들의 사랑하는 이들에게[a], 그들이 골짜기의 심연에 있는 갈라진 틈으로 던져지도록[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 문구와 지시 대상은 난해합니다. ‘그들의 선택된 이들’과 ‘그들의 사랑하는 이들’이 누구를 가리키는지는 이 절만으로 분명하지 않으며, 앞 절의 질문에 이어지는 타원적인 표현일 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘골짜기의 심연의 갈라진 틈으로’. 게에즈어는 틈 또는 벌어진 곳, 심연, 골짜기라는 지형 이미지를 연속하여 사용합니다. 첫 표현의 정확한 뉘앙스는 ‘틈’, ‘갈라진 곳’, ‘균열’ 등으로 달리 옮길 수 있습니다.
    reason: lexical_alternative
