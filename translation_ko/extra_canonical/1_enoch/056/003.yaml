theological_decisions:
- issue: ‘chosen ones’와 ‘beloved ones’의 지시 대상
  chosen_reading: 본문의 지시 대상을 확정하지 않고, 소유격 구조를 그대로 살려 ‘그들의 선택된 자들…그들의 사랑하는 이들’로 옮겼습니다.
  alternative_readings:
  - 앞선 환상 속 열왕/권세자들을 가리키는 집단으로 특정
  - 심판받는 대상이 아니라 다른 보호받는 집단으로 이해
  rationale: 본문 자체만으로는 가리키는 대상이 분명하지 않으므로, 해석을 앞서지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
