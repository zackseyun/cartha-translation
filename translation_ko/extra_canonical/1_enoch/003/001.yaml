  - 열네 그루 외에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예외를 분명히 표시하는 구조이므로, 수량과 대비를 가장 자연스럽게 드러내는 ‘열네 그루를 제외한’을 선택했습니다.
- source_word: ዘኢይትነገፉ
  english_pob_choice: which do not lose their leaves
  chosen_korean: 잎을 잃지 않고
  alternatives_korean:
