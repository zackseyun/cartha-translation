  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시 대상이 구체적인 식물 기관이므로 ‘잎’이 가장 직접적이며, 앞뒤 대조도 선명하게 드러납니다.
- source_word: ንጉፍ
  english_pob_choice: stripped off
  chosen_korean: 벗겨졌는지
  alternatives_korean:
  - 뜯겨졌는지
  - 벗겨져 있는지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순히 떨어진 것보다 외부에서 제거된 느낌이 강하므로 ‘벗겨지다’를 써서 소스의 강한 시각적 효과를 살렸습니다.
- source_word: ዘእንበለ ፲ወ፬ ዕፀወ
  english_pob_choice: except fourteen trees
  chosen_korean: 열네 그루를 제외한
  alternatives_korean:
