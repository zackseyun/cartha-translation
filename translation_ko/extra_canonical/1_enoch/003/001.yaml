  - 주의해서 보고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 이 구절에서 단순한 ‘묻다’보다 ‘주의 깊게 살피다/관찰하다’의 뜻이 문맥에 맞으므로, 명령형 흐름을 살려 ‘살펴보고’로 옮겼습니다.
- source_word: ወርእዩ
  english_pob_choice: and see
  chosen_korean: 보십시오
  alternatives_korean:
  - 보고
  - 살펴보십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 동사와 병렬되는 시각 동사이므로, 현대 합쇼체 명령으로 자연스럽게 이어지는 ‘보십시오’를 택했습니다.
- source_word: ኵሎ ዕፀወ … አቍጽሊሆሙ
  english_pob_choice: all the trees ... and all their leaves
  chosen_korean: 모든 나무 ... 잎
  alternatives_korean:
  - 온 나무들 ... 잎사귀
  - 모든 나무 ... 잎사귀
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시 대상이 구체적인 식물 기관이므로 ‘잎’이 가장 직접적이며, 앞뒤 대조도 선명하게 드러납니다.
- source_word: ንጉፍ
  english_pob_choice: stripped off
  chosen_korean: 벗겨졌는지
  alternatives_korean:
  - 뜯겨졌는지
  - 벗겨져 있는지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순히 떨어진 것보다 외부에서 제거된 느낌이 강하므로 ‘벗겨지다’를 써서 소스의 강한 시각적 효과를 살렸습니다.
- source_word: ዘእንበለ ፲ወ፬ ዕፀወ
  english_pob_choice: except fourteen trees
  chosen_korean: 열네 그루를 제외한
  alternatives_korean:
  - 열네 그루만 빼고
  - 열네 그루 외에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예외를 분명히 표시하는 구조이므로, 수량과 대비를 가장 자연스럽게 드러내는 ‘열네 그루를 제외한’을 선택했습니다.
- source_word: ዘኢይትነገፉ
  english_pob_choice: which do not lose their leaves
  chosen_korean: 잎을 잃지 않고
  alternatives_korean:
  - 잎이 떨어지지 않고
  - 벗겨지지 않고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ‘벗겨짐’과 짝을 이루는 부정 표현이므로, 결과적으로 잎이 남아 있는 상태를 자연스럽게 나타내는 ‘잎을 잃지 않고’로 옮겼습니다.
theological_decisions:
- issue: ‘from the old until the new comes’의 시간 표현을 어떻게 처리할지
  chosen_reading: 낡은 것에서 새것이 올 때까지
  alternative_readings:
  - 옛것에서 새것이 올 때까지
  - 지난 것에서 새것이 올 때까지
  rationale: 원문은 계절/시기의 전환을 압축적으로 말하므로, ‘옛것/새것’의 대비를 살리되 한국어에서 이해 가능한 시간 이동으로 풀어 옮겼습니다. 특정 연도나 우주론을 과도하게 단정하지 않았습니다.
  doctrine_reference: 원문의 압축성과 열린 의미를 보존하고, 해석을 본문에 과도하게 주입하지 않습니다.
- issue: ‘through two and three winters’의 난해한 수량-계절 표현 처리
  chosen_reading: 두세 번의 겨울을 지나도
  alternative_readings:
  - 두세 겨울 동안
  - 두세 번의 겨울을 통해
  rationale: 이 표현은 문법적으로 어색하고 관용적일 가능성이 있어, 반복되는 겨울의 기간을 드러내는 방향으로 옮기되 정확한 idiom 해석은 열어 두었습니다.
  doctrine_reference: 난해한 표현은 의미를 과도하게 확정하지 않고, 본문이 허용하는 범위에서만 명료화합니다.
