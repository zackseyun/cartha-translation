base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/003/001.yaml
  text: Observe and see all the trees[a], how they appear withered, and all their leaves stripped off—except fourteen trees, which do not lose their leaves, but remain from the old until the new comes[c][b], through two and three winters.
  footnotes:
  - marker: a
    text: The phrase 'from the old until the new comes' is elliptical; it likely refers to the passing old season or year and the arrival of the new one.
    reason: cultural_note
  - marker: b
    text: '''Through two and three winters'' is a difficult expression. It may mean ''for two or three winters'' or indicate repeated winter seasons before renewal.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Ask and see whether all the trees appear withered'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 나무를 살펴보십시오. 나무들이 어떻게[a] 시들어 보이는지, 또 열네 그루를 제외한 모든 나무의 잎이 벗겨져 있는 것을 보십시오. 그 열네 그루는 잎을 잃지 않고 옛것에서 새것이 올 때까지[c], 두세 번의 겨울을 지나도록[b] 그대로 남아 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어떻게’에 가깝습니다. 이 구절은 질문을 제기하기보다 나무들의 상태를 ‘살펴보라’는 관찰 명령입니다.
    reason: source_note
  - marker: b
    text: 이 표현은 ‘두세 번의 겨울 동안’ 또는 ‘겨울이 두세 차례 지나갈 때까지’로 이해될 수 있는 난해한 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘옛것에서 새것이 올 때까지’는 옛 시기나 계절이 지나고 새 시기나 계절이 오는 것을 가리키는 생략된 표현일 가능성이 있습니다.
    reason: cultural_note
