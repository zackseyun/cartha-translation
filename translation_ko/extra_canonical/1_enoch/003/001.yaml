  rationale: 앞의 ‘벗겨짐’과 짝을 이루는 부정 표현이므로, 결과적으로 잎이 남아 있는 상태를 자연스럽게 나타내는 ‘잎을 잃지 않고’로 옮겼습니다.
theological_decisions:
- issue: ‘from the old until the new comes’의 시간 표현을 어떻게 처리할지
  chosen_reading: 낡은 것에서 새것이 올 때까지
  alternative_readings:
  - 옛것에서 새것이 올 때까지
  - 지난 것에서 새것이 올 때까지
  rationale: 원문은 계절/시기의 전환을 압축적으로 말하므로, ‘옛것/새것’의 대비를 살리되 한국어에서 이해 가능한 시간 이동으로 풀어 옮겼습니다. 특정 연도나 우주론을 과도하게 단정하지 않았습니다.
  doctrine_reference: 원문의 압축성과 열린 의미를 보존하고, 해석을 본문에 과도하게 주입하지 않습니다.
- issue: ‘through two and three winters’의 난해한 수량-계절 표현 처리
  chosen_reading: 두세 번의 겨울을 지나도
  alternative_readings:
  - 두세 겨울 동안
  - 두세 번의 겨울을 통해
  rationale: 이 표현은 문법적으로 어색하고 관용적일 가능성이 있어, 반복되는 겨울의 기간을 드러내는 방향으로 옮기되 정확한 idiom 해석은 열어 두었습니다.
  doctrine_reference: 난해한 표현은 의미를 과도하게 확정하지 않고, 본문이 허용하는 범위에서만 명료화합니다.
