base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
  footnotes:
  - marker: a
    text: Literally, 'his name was lifted up.' The expression may refer to Enoch himself being taken up into the presence of the Son of Man and the Lord of Spirits while still alive.
    reason: lexical_alternative
  - marker: b
    text: Or 'from those who dwell on the earth.' The Ge'ez more specifically says 'upon the dry ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후에 그의 이름이 그가 살아 있는 동안, 마른 땅에 사는 이들에게서 멀리 떨어져 저 인자와 영들의 주 앞에서 높여졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 이름이 높여졌다’입니다. 이 표현은 에녹 자신이 살아 있는 동안 인자와 영들의 주 앞에 들려 올라간 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에 사는 이들에게서’라고 할 수 있습니다. 게에즈어는 더 구체적으로 ‘마른 땅 위에’라고 말합니다.
    reason: lexical_alternative
