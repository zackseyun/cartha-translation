  - severity: medium
    issue: 마지막 분리·거리의 구문 연결이 불명확함
    rationale: ‘멀어졌습니다’가 ‘이름’의 이동인지 단순한 별도 서술인지 모호합니다. ‘마른 땅에 사는 이들에게서 멀리 떨어져’라고 하여 높여짐의 공간적·관계적 배경으로 연결하는 편이 원문에 더 가깝습니다.
