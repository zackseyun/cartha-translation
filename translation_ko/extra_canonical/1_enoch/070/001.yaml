  rationale: 원문의 ‘이름’이라는 표현과 생전이라는 시간적 한정, ‘저 인자’의 지시적 칭호, 그리고 ‘마른 땅’의 구체적 이미지는 보존했습니다. 다만 원문 칭호 ‘Lord of Spirits’를 정확히 반영하도록 ‘만군의 주’를 ‘영들의 주’로 바로잡았고, 지상 거주자들로부터의 분리를 한국어 문장 안에서 높여짐과 자연스럽게 연결했습니다. 각주 표지는 해당 표현 뒤에 배치했습니다.
