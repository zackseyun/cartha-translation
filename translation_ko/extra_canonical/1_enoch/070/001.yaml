theological_decisions:
- issue: 1 Enoch 70:1의 인자 호칭을 한국어에서 어떻게 처리할지
  chosen_reading: 저 인자
  alternative_readings:
  - 그 인자
  - 그 사람의 아들
  - 인자
  rationale: 원문의 지시적 요소(‘that’)와 묵시적 호칭성을 함께 보존하기 위해 ‘저 인자’로 옮겼습니다. 이는 후대 기독교 용례를 과도하게 끌어들이지 않으면서도 칭호의 무게를 유지합니다.
  doctrine_reference: Translation philosophy §§2, 4
- issue: ‘그의 이름이 높여졌다’의 의미를 단순 명예 상승으로 좁힐지 여부
  chosen_reading: 이름의 상승과 인물의 현시적 승귀를 함께 암시하는 표현으로 유지
  alternative_readings:
  - 명성이 높아졌다
  - 그가 들려 올라갔다
  rationale: 주석이 밝히듯 원문은 에녹 자신이 생존 중에 들려 올라가는 뜻을 시사하지만, 본문은 ‘이름’이라는 표현을 그대로 두어 문체상의 낯섦과 신학적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
