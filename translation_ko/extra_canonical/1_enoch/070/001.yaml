base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
  footnotes:
  - marker: a
    text: Literally, 'his name was lifted up.' The expression may refer to Enoch himself being taken up into the presence of the Son of Man and the Lord of Spirits while still alive.
    reason: lexical_alternative
  - marker: b
    text: Or 'from those who dwell on the earth.' The Ge'ez more specifically says 'upon the dry ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이 일 뒤에, 그의 이름이 그 생전에 저 인자와 만군의 주 앞에서 높여졌으며, 마른 땅에 사는 이들로부터 멀어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 이름이 높여졌다’입니다. 이 표현은 에녹 자신이 살아 있는 동안 인자와 만군의 주의 앞에 들려 올라간 것을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅에 사는 이들로부터’. 게에즈어는 더 구체적으로 ‘마른 땅 위에’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተለዓለ፡
  english_pob_choice: was lifted up
  chosen_korean: 높여졌으며
  alternatives_korean:
  - 들려 올라갔으며
  - 올려졌으며
  - 들어 올려졌으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상향·들림의 이미지를 살리면서도, ‘이름이 높여지다’라는 표현이 문맥상 단순한 명성 상승을 넘는 현시적 상승을 암시하도록 했습니다.
- source_word: ስሙ፡
  english_pob_choice: his name
  chosen_korean: 그의 이름이
  alternatives_korean:
  - 그의 명성이
  - 그 사람 자신이
  lexicon: Dillmann, Lexicon Lcexicae Aethiopicae
  rationale: 원문이 실제로 ‘이름’이라고 말하므로, 인물로 평탄화하지 않고 문자성을 유지했습니다.
- source_word: ሕያው፡
  english_pob_choice: during his lifetime
  chosen_korean: 그 생전에
  alternatives_korean:
  - 살아 있는 동안
  - 그가 살아 있을 때에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 형용사 ‘살아 있는’을 이름의 수식어로 굳히기보다, 사건이 죽음 이전에 일어났다는 시간 부사를 한국어로 자연스럽게 옮겼습니다.
- source_word: እግዚአ፡ መናፍስት፡
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영의 주
  - 영들의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 고유 칭호를 그대로 살리는 것이 더 투명하지만, 이 칭호는 1 Enoch 내부의 관용적 신칭으로 보아 독자가 즉시 파악하기 쉬운 전통적 한국어 대응을 선택했습니다.
- source_word: እምእለ፡ የኃድሩ፡ ዲበ፡ የብስ።
  english_pob_choice: away from those who dwell on the dry ground
  chosen_korean: 마른 땅에 사는 이들로부터 멀어졌습니다
  alternatives_korean:
  - 땅에 사는 이들로부터 멀어졌습니다
  - 메마른 땅에 거주하는 이들로부터 멀어졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: የብስ의 구체적 이미지인 ‘dry ground’를 살리되, 현대 한국어에서 어색하지 않도록 ‘마른 땅’으로 옮겼습니다.
theological_decisions:
- issue: 1 Enoch 70:1의 인자 호칭을 한국어에서 어떻게 처리할지
  chosen_reading: 저 인자
  alternative_readings:
  - 그 인자
  - 그 사람의 아들
  - 인자
  rationale: 원문의 지시적 요소(‘that’)와 묵시적 호칭성을 함께 보존하기 위해 ‘저 인자’로 옮겼습니다. 이는 후대 기독교 용례를 과도하게 끌어들이지 않으면서도 칭호의 무게를 유지합니다.
  doctrine_reference: Translation philosophy §§2, 4
- issue: ‘그의 이름이 높여졌다’의 의미를 단순 명예 상승으로 좁힐지 여부
  chosen_reading: 이름의 상승과 인물의 현시적 승귀를 함께 암시하는 표현으로 유지
  alternative_readings:
  - 명성이 높아졌다
  - 그가 들려 올라갔다
  rationale: 주석이 밝히듯 원문은 에녹 자신이 생존 중에 들려 올라가는 뜻을 시사하지만, 본문은 ‘이름’이라는 표현을 그대로 두어 문체상의 낯섦과 신학적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
