  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
  footnotes:
  - marker: a
    text: The Ethiopic clause is extremely brief, consisting only of a conjunction and a passive verb meaning 'to be raised' or 'to go up.' 'Was taken up' is chosen to preserve the upward-motion imagery without overstating whether the action is bodily, visionary, or honorific.
    reason: lexical_alternative
