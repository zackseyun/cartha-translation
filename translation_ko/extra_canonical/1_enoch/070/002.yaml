  yaml_path: translation/extra_canonical/1_enoch/070/002.yaml
  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
  footnotes:
  - marker: a
    text: The Ethiopic clause is extremely brief, consisting only of a conjunction and a passive verb meaning 'to be raised' or 'to go up.' 'Was taken up' is chosen to preserve the upward-motion imagery without overstating whether the action is bodily, visionary, or honorific.
    reason: lexical_alternative
  - marker: b
    text: Or 'And he was taken up.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 영의 병거에 실려 올라갔고, 그의 이름은 그들 가운데에서 사라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '`영의 병거`는 원문의 `በሰረገላ፡ መንፈስ፡`을 직역한 것으로, 이동 수단의 초월성을 드러냅니다.'
    reason: source_note
lexical_decisions:
- source_word: በሰረገላ፡ መንፈስ፡
  english_pob_choice: on the chariot of the spirit
  chosen_korean: 영의 병거에
  alternatives_korean:
  - 성령의 병거에
  - 영의 수레에
  - 영의 전차에
  lexicon: Charles 1906 / Ge'ez clause in 1 Enoch 70:2
  rationale: '`መንፈስ`은 문맥상 초월적 이동을 매개하는 영으로 읽히며, ‘병거’는 원문의 수레/전차 이미지를 살리면서 한국어 성경체에 자연스럽습니다.'
- source_word: ተለዓለ፡
  english_pob_choice: was lifted up
  chosen_korean: 실려 올라갔고
  alternatives_korean:
  - 들려 올라갔고
  - 올려졌고
  - 들어 올려졌고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상향 이동의 수동적 뉘앙스를 살리되, 단순한 신체적 승천으로 단정하지 않도록 ‘실려 올라갔고’로 옮겼습니다.
- source_word: ወስሙ፡ ኀለፈ፡ ማእከሎሙ፡
  english_pob_choice: and his name vanished from among them
  chosen_korean: 그의 이름은 그들 가운데에서 사라졌습니다
  alternatives_korean:
  - 그의 이름은 그들 가운데에서 없어졌습니다
  - 그의 이름은 그들 사이에서 지나갔습니다
  lexicon: Ge'ez clause / POB audit trail
  rationale: 원문은 이름이 공동체의 시야/기록에서 ‘사라짐’의 이미지를 주므로, ‘vanished’에 해당하는 자연스러운 한국어로 반영했습니다.
theological_decisions:
- issue: 천상 이동의 성격
  chosen_reading: 초월적 인도에 의한 상승과 이름의 소멸을 그대로 보존합니다.
  alternative_readings:
  - 육체적 승천으로 명시
  - 단순한 환상 장면으로 축소
  rationale: 원문과 POB 감사 흔적은 이동의 방식과 결과를 간명하게 제시할 뿐이므로, ‘병거’와 ‘사라졌습니다’를 유지하여 해석을 과잉 규정하지 않았습니다.
  doctrine_reference: 서술이 허용하는 범위 안에서 상향 이동의 이미지와 인물의 부재를 보존합니다.
