  text: 그리고 그는 영의 병거에 실려 올라갔고, 그의 이름은 그들 가운데에서 사라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '`영의 병거`는 원문의 `በሰረገላ፡ መንፈስ፡`을 직역한 것으로, 이동 수단의 초월성을 드러냅니다.'
    reason: source_note
