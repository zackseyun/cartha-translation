theological_decisions:
- issue: ‘육체’의 의미
  chosen_reading: 여기서는 육체라는 물질 자체가 아니라, 죽을 수밖에 없는 인간을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 아무 인간도
  - 어떤 혈육도
  - 어떤 죽을 육체도
  rationale: 게에즈 원문은 문자적으로 '육체'이지만, 문맥상 금지 대상은 물질로서의 육체가 아니라 죽을 인간들입니다. 한국어 본문에서는 직역적 긴장을 유지하면서도 의미가 분명해지도록 했습니다.
  doctrine_reference: 현장적 묘사와 의미를 함께 보존하고, 본문을 지나치게 일반화하지 않음.
- issue: 복수와 완성의 절
  chosen_reading: 심판 때 모든 것에 대한 복수가 이루어지고, 그 사태가 영원히 완성된다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그가 모든 것에 복수하고 완성한다
  - 모든 것에 대해 보복이 집행되고 끝난다
  rationale: 문법상 주어가 분명하지 않은 게에즈 표현을 한국어에서 억지로 특정 인물로 고정하지 않고, 심판의 보편적 집행과 완성이라는 흐름을 드러냈습니다.
  doctrine_reference: 본문의 종말론적 법정 이미지를 보존하고, 명시되지 않은 주어를 과잉 해석하지 않음.
