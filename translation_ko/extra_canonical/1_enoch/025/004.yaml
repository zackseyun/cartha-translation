base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/004.yaml
  text: And this fragrant tree—no flesh has authority to touch it until the great judgment[a], when all will be avenged and brought to completion forever[d][c][b]; then it will be given to the righteous and the humble.
  footnotes:
  - marker: a
    text: Literally, 'no flesh has authority.' The phrase refers to mortal humans, not to flesh as a substance.
    reason: lexical_alternative
  - marker: b
    text: The clause after 'the great judgment' is difficult. The sense is that vengeance is carried out universally and the matter is brought to its full completion.
    reason: textual_variant
  - marker: c
    text: Or 'the humble'.
    reason: previous_rendering
  - marker: d
    text: Or 'then it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 향기로운 나무는—큰 심판[a]이 이를 때까지는 어떤 육체도 그것을 만질 권한이 없습니다. 그때에는 모든 것에 대한 복수가 이루어지고, 그것이 영원히 완성되며[d][b][c], 그 뒤에는 그것이 의인들과 겸손한 자들에게 주어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어떤 육체도 권한이 없다’는 뜻입니다. 여기서 ‘육체’는 물질적 살 자체가 아니라 죽을 수밖에 없는 인간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 뒤부분은 해석이 어렵습니다. 의미는 모든 것에 대한 응징이 집행되고, 사태가 완결된다는 쪽에 가깝습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘겸손한 자들’입니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘그때에는 그것이’입니다.
    reason: previous_rendering
