  source_fidelity: ‘큰 심판이 이를 때까지’는 대체로 뜻이 통하지만, 원문의 시간 표현은 ‘큰 심판 때까지’입니다. 또한 원문의 보복 동사는 행위 주체를 명시하지 않은 단수 동사로 이해될 수 있으므로, ‘복수가 이루어지고’라는 비인칭 수동 표현보다 한국어의 무표지 주어를 사용해 이를 보존하는 편이 낫습니다. 마지막 ዝኩ는 시간 부사 ‘그때’가 아니라 앞의 나무를 가리키는 지시사이므로 ‘그 나무’로 옮겨야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하며, 긴 문장을 원문의 종속 관계에 맞추어 자연스럽게 구성합니다. ‘모든 것에 대한 복수’보다 ‘모든 것에게 복수하고’가 원문의 넓은 목적어를 더 직접적으로 반영합니다.
  terminology: ‘향기로운 나무’, ‘육체’, ‘권한’, ‘큰 심판’, ‘의인들’, ‘겸손한 자들’은 적절합니다. ‘그 나무’는 지시사의 선행사를 명확히 하면서도 원문의 지시성을 보존합니다.
  issues:
  - severity: medium
    issue: 보복 절이 비인칭 수동으로 번역되어 원문의 단수 동사와 행위성을 약화합니다.
    rationale: 원문과 영어 POB의 어휘 검토는 암시된 단수 주어의 보복 행위를 허용합니다. 한국어에서는 주어를 억지로 특정하지 않고 생략하여 이 모호성을 보존할 수 있습니다.
