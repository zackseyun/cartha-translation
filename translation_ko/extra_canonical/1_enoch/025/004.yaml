  revised_text: 그리고 이 향기로운 나무에는 큰 심판 때까지 어떤 육체도 손댈 권한이 없습니다. 그때에 모든 것에게 복수하고 그 일을 영원히 완결할 것이며[b], 그 나무는 의인들과 겸손한 자들에게 주어질 것입니다.
