- issue: 산과 보좌의 관계
  chosen_reading: 산은 단지 보좌를 닮은 장소가 아니라, 그분의 보좌로 지정된 종말론적 현현의 자리로 표현했습니다.
  alternative_readings:
  - 산의 꼭대기만이 보좌와 같다
  - 산은 현재 이미 하나님의 거처다
  rationale: 원문과 POB가 모두 산-보좌 이미지를 반복하면서도 미래의 '내려오심'을 붙들고 있으므로, 현재적 정착보다 장차 드러날 통치의 자리로 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
