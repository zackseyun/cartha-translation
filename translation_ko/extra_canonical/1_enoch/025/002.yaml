  rationale: 지식에 대한 소망을 한국어의 자연스러운 표현으로 옮기되, 격식을 유지해 ‘원합니다’ 계열보다 부드럽게 정리했습니다.
- source_word: በእንተ፡ ኵሉ፡ ... ወፈድፋደሰ፡ በእንተዝ፡ ዕፅ
  english_pob_choice: about everything, but especially about this tree
  chosen_korean: 모든 것에 대해 ... 특히 이 나무에 대해서는 더욱 그렇습니다
  alternatives_korean:
  - 모든 것에 관해 ... 특히 이 나무에 관해서는 더더욱 그렇습니다
  - 모든 것을 ... 특히 이 나무를 더욱 알고 싶습니다
