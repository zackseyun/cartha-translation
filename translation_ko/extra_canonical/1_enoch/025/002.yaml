  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 환상 속 대상이 되는 일반 명사로 ‘나무’가 가장 직접적이고 자연스럽습니다.
theological_decisions:
- issue: 구문이 ‘모든 것’에 대한 일반적 지식 욕구와 ‘이 나무’에 대한 특별한 관심을 함께 담는 방식
  chosen_reading: 저는 모든 것에 대해 알고 싶습니다. 특히 이 나무에 대해서는 더욱 그렇습니다.
  alternative_readings:
  - 저는 이 모든 것에 대해, 특히 이 나무에 대해 알고 싶습니다.
  - 저는 모든 것을 알고 싶지만, 특히 이 나무를 알고 싶습니다.
  rationale: 게에즈 본문은 포괄적 탐구와 특정 대상에 대한 강조를 함께 담고 있으므로, 둘을 하나로 평준화하지 않고 대비를 유지했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
