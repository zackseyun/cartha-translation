base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/002.yaml
  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
  footnotes:
  - marker: a
    text: The Ge'ez wording at the end is somewhat difficult; the sense is that Enoch asks for fuller knowledge concerning the tree.
    reason: textual_variant
  - marker: b
    text: Or 'And at that time I, Enoch, answered and said, concerning all this, “I desire to know about this tree all the more.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 저는, 에녹이, 그에게 대답하며 말했습니다. 「저는 모든 것에 대해 알고 싶습니다. 특히 이 나무에 대해서는 더욱 그렇습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 뒤의 구절이 다소 어렵지만, 에녹이 이 나무에 관해 더 충만한 지식을 구하는 뜻으로 이해됩니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그때에 저는, 에녹이, 이 모든 것에 관해 그에게 대답하며 말했습니다. 「저는 이 나무에 대해 더욱 알고 싶습니다.」’
    reason: previous_rendering
