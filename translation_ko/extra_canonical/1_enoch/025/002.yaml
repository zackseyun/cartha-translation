  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
  footnotes:
  - marker: a
    text: The Ge'ez wording at the end is somewhat difficult; the sense is that Enoch asks for fuller knowledge concerning the tree.
    reason: textual_variant
  - marker: b
    text: Or 'And at that time I, Enoch, answered and said, concerning all this, “I desire to know about this tree all the more.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 나 에녹이 그에게 대답하여 말했습니다. 「저는 모든 것에 관하여 알고 싶습니다. 특히 이 나무에 관하여서는 더욱 알고 싶습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 본문의 후반 구문은 다소 어렵습니다. 여기서는 에녹이 모든 것을 알고 싶어 하되, 특히 이 나무에 대하여 더욱 알고 싶어 한다는 뜻으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그때에 나 에녹이 이 모든 것에 관하여 그에게 대답하여 말했습니다. 「저는 이 나무에 대하여 더욱 알고 싶습니다.」’
    reason: previous_rendering
