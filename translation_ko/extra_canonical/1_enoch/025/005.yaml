theological_decisions:
- issue: ኅሩያን의 신학적 범위
  chosen_reading: 에녹서 내부의 종말론적 선택된 집단을 가리키는 말로 이해하되, 본문에는 단순히 ‘선택된 자들’로 유지합니다.
  alternative_readings:
  - 기술적 의미의 ‘택하심을 받은 자들’
  - 단순히 ‘의인들’
  rationale: 문맥상 apocalyptic 집단 표지이지만, 번역문에서 후대 체계신학의 ‘선택’ 교리를 과도하게 주입하지 않기 위해 중립적으로 유지했습니다.
  doctrine_reference: Contested terms / consistency of key terms
- issue: 생명의 성격
  chosen_reading: 예언적·종말론적 생명을 암시하지만 본문에는 ‘생명’으로만 둡니다.
  alternative_readings:
  - 영생
  - 회복된 생명
  rationale: 열매를 통한 생명 부여라는 의미는 강하지만, 남아 있는 게으스 본문 자체는 ‘생명’만 제시하므로 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
