    text: 원문은 목적어가 뒤따라야 하는 전치사 ‘위에’에서 끊깁니다. 따라서 생략 부호로 문장의 미완성을 드러냈습니다.
    reason: source_note
  - marker: b
    text: ‘선택된 이들’은 에녹문헌에서 종말론적 집단을 가리키는 표지를 반영한 번역입니다.
    reason: theological_note
