theological_decisions:
- issue: 이중 질문 동사의 뉘앙스
  chosen_reading: 단순한 질책이 아니라, 에녹의 질문을 되묻는 방식으로 탐문하는 어조로 읽었습니다.
  alternative_readings:
  - 부적절한 호기심에 대한 강한 꾸짖음
  - 그저 설명을 요청하는 중립적 말투
  rationale: 질문 동사가 반복되고 목적절이 붙어 있어, 본문은 꾸짖기보다 질문의 동기를 드러내며 더 깊은 계시로 이끄는 말투로 읽는 것이 자연스럽습니다.
  doctrine_reference: 묵시 문학의 천상 대화를 과도하게 도덕화하지 않고, 장면의 긴장과 초월성을 보존합니다.
