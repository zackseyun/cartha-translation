base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/001.yaml
  text: And he said to me[a], “Enoch, why do you ask about the fragrance of this tree, and inquire so that you may know?”
  footnotes:
  - marker: a
    text: Or 'concerning its scent.' The Ge'ez term refers to smell or fragrance; 'fragrance' was chosen for the elevated tone of the scene.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 내게 말했습니다. 「에녹아, 네가 왜 이 나무의 향기[a]에 관해 묻고 또 알려고 하느냐?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 나무의 냄새에 관하여’. 게에즈어 መዓዛ는 냄새나 향기를 가리킬 수 있습니다. 이 장면의 격조를 고려하여 ‘향기’로 옮겼습니다.
    reason: lexical_alternative
