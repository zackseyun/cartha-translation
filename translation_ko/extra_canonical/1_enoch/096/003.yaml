base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/003.yaml
  text: But you[a], do not fear—you who have suffered—for healing will come to you, and a bright light will shine for you[b], and you will hear the voice of rest from heaven.
  footnotes:
  - marker: a
    text: Or 'do not be afraid, you who are in affliction'; the Ge'ez phrase can denote those suffering pain or distress more broadly.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the voice/word of rest.' The expression is kept close to the Ge'ez rather than paraphrased as 'peace' or 'comfort.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 고통을 겪은 너희는[a] 두려워하지 마십시오. 치유가 너희에게 올 것이며, 밝은 빛이 너희를 비출 것이고, 하늘에서 쉼의 음성을 들을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고통을 겪은 너희’는 ‘환난이나 아픔 가운데 있는 이들’을 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘쉼의 음성/말씀’에 가깝습니다. 여기서는 하늘에서 들려오는 청각 이미지를 살리기 위해 ‘음성’을 유지했습니다.
    reason: lexical_alternative
