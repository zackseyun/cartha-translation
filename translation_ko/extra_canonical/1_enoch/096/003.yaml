  rationale: 원문은 고통 이후의 해소와 회복을 약속하는 계시적 언어이므로, 번역이 그 긴장을 지우지 않도록 ‘쉼’을 선택했습니다.
  doctrine_reference: 원어 우선 원칙에 따라 번역 전통의 익숙한 신학어로 평탄화하지 않음
