theological_decisions:
- issue: ‘rest’의 의미를 한국어에서 더 신학적으로 해석할지 여부
  chosen_reading: ‘쉼’으로 유지해, 회복과 안식을 암시하되 평안으로 완전히 환원하지 않았습니다.
  alternative_readings:
