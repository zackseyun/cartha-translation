theological_decisions:
- issue: 의인에게 주어지는 ‘권세’의 성격
  chosen_reading: 이 구절은 의인들이 심판받는 죄인들 위에 실제적인 지배 권세를 받는다고 말합니다.
  alternative_readings:
  - 단지 도덕적 승리나 위로를 말한다고 완화할 수 있습니다.
  - 상징적으로 악이 패배한다는 뜻으로만 읽을 수 있습니다.
  rationale: 원문의 ‘권세’와 ‘그들 위에’라는 결합은 단순한 감정적 위안보다 더 강한 종말론적 역전의 진술입니다. 한국어 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 예언적·묵시적 역전의 진술을 완화하지 않고 보존
