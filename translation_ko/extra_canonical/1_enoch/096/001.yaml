base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/001.yaml
  text: Hope[a], you righteous, for the sinners will swiftly be destroyed from before you, and authority over them will be yours[c][b], according to your desire.
  footnotes:
  - marker: a
    text: Or 'Be hopeful, righteous ones.' The opening imperative directly addresses the righteous.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before you,' preserving the image of sinners being removed from the righteous one's presence.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'authority over them' expresses an apocalyptic reversal in which the righteous are granted rule over those now judged.
    reason: cultural_note
translation:
  language: ko
  text: 의인들아, 희망하십시오. 죄인들은 너희 앞에서 속히 멸망할 것이며, 그들 위의 권세는 너희의 뜻대로 너희에게 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘희망하십시오’는 직접 명령형으로, 의인들에게 희망하라고 촉구하는 뜻을 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 앞에서’는 문자적으로는 ‘너희 앞에서/면전에서’의 이미지로, 죄인들이 의인들의 시야와 현존 앞에서 제거되는 장면을 보존합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘권세’는 단순한 힘보다 위임된 통치 지위를 가리켜, 의인에게 주어지는 종말론적 역전을 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  english_pob_choice: Hope
  chosen_korean: 희망하십시오
  alternatives_korean:
  - 희망을 가지십시오
  - 희망하라
  - 희망하시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수 명령의 직접 호소를 살리되, 합쇼체로 자연스럽게 옮기기 위해 동사형 명령인 ‘희망하십시오’를 택했습니다.
- source_word: ጻድቃን
  english_pob_choice: you righteous
  chosen_korean: 의인들아
  alternatives_korean:
  - 너희 의인들아
  - 의로운 이들아
  - 의인들이여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령문의 직접 수신자를 드러내는 호격으로 보고, 한국어에서는 간결한 호격형 ‘의인들아’가 가장 자연스럽습니다.
- source_word: ፍጡነ ይትሀጐሉ ኃጥኣን
  english_pob_choice: the sinners will swiftly be destroyed
  chosen_korean: 죄인들은 ... 속히 멸망할 것이며
  alternatives_korean:
  - 죄인들은 ... 신속히 파멸할 것이며
  - 죄인들은 ... 빠르게 망할 것이며
  - 죄인들은 ... 곧 멸망할 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 심판의 어조를 살리면서, 단순한 ‘망하다’보다 심판적·공적 어감이 강한 ‘멸망하다’를 사용했습니다. ‘속히’는 시간 부사로서 원문의 급박성을 보존합니다.
- source_word: እምቅድሜክሙ
  english_pob_choice: from before you
  chosen_korean: 너희 앞에서
  alternatives_korean:
  - 너희의 앞에서
  - 너희 면전에서
  - 너희의 존재 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 공간적 이미지를 살리되 한국어에서는 ‘from before you’의 직역형보다 ‘너희 앞에서’가 더 자연스럽고, 심판 장면의 제거 이미지를 충분히 드러냅니다.
- source_word: ሥልጣን
  english_pob_choice: authority
  chosen_korean: 권세
  alternatives_korean:
  - 권위
  - 권한
  - 통치권
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 단순한 능력이 아니라 넘겨받는 통치적 지위를 가리키므로, 한국어 성경에서 종종 쓰는 ‘권세’가 가장 적절합니다.
- source_word: ይከውን ለክሙ ዲቤሆሙ
  english_pob_choice: will be yours over them
  chosen_korean: 그들 위의 권세는 너희의 뜻대로 너희에게 있을 것입니다
  alternatives_korean:
  - 그들 위의 권세는 너희 것이 될 것입니다
  - 그들 위에 너희에게 권세가 있을 것입니다
  - 그들 위의 권세가 너희에게 주어질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 소유보다 ‘그들 위의 권세’라는 지배 관계를 살리고, POB의 ‘according to your desire’를 반영해 결과가 의인들의 뜻과 부합함을 드러냈습니다.
- source_word: በከመ ፈቀድክሙ
  english_pob_choice: according to your desire
  chosen_korean: 너희의 뜻대로
  alternatives_korean:
  - 너희의 바람대로
  - 너희가 원한 대로
  - 너희의 소원대로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘desire’는 단순 감정이 아니라 의지적 바람을 가리키므로, 한국어에서는 문어적이고 중립적인 ‘뜻대로’가 가장 잘 맞습니다.
theological_decisions:
- issue: 의인에게 주어지는 ‘권세’의 성격
  chosen_reading: 이 구절은 의인들이 심판받는 죄인들 위에 실제적인 지배 권세를 받는다고 말합니다.
  alternative_readings:
  - 단지 도덕적 승리나 위로를 말한다고 완화할 수 있습니다.
  - 상징적으로 악이 패배한다는 뜻으로만 읽을 수 있습니다.
  rationale: 원문의 ‘권세’와 ‘그들 위에’라는 결합은 단순한 감정적 위안보다 더 강한 종말론적 역전의 진술입니다. 한국어 번역도 그 긴장을 유지해야 합니다.
  doctrine_reference: 예언적·묵시적 역전의 진술을 완화하지 않고 보존
