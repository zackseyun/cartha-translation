base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/002.yaml
  text: And on the day of the judgment of sinners[a], your children will rise up and be lifted up like eagles, and your nest will be higher than the vultures. You will go up and enter the clefts of the earth and the fissures of the rock forever, like coneys before the lawless[f][e][d][c][b]; and the sirens will groan over you and weep.
  footnotes:
  - marker: a
    text: The animal terms traditionally rendered 'coney' likely refer to the hyrax or rock-badger.
    reason: cultural_note
  - marker: b
    text: The clause rendered 'your nest will be higher' is textually difficult in Ethiopic; the underlying noun may denote a sheltering place or shaded dwelling rather than a literal nest.
    reason: textual_variant
  - marker: c
    text: The final phrase may also be understood with 'hyraxes' again rather than 'coneys'; both refer to the same small rock-dwelling animal.
    reason: lexical_alternative
  - marker: d
    text: Or 'the hyraxes of the earth'.
    reason: previous_rendering
  - marker: e
    text: Or 'the righteous women'.
    reason: previous_rendering
  - marker: f
    text: Or 'before the lawless'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 죄인들의 심판의 날에 너희 자녀들은 독수리들처럼 일어나 높이 들려 올라가고, 너희 둥지는 솔개들보다 더 높아질 것입니다. 너희는 영원히 땅의 틈과 바위의 갈라진 곳들로 들어가며, 법less한 자들 앞의 관못처럼 될 것이며, 시레나들이 너희 위에서 신음하며 울 것입니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘심판’이지만, 에녹서의 문맥에서는 죄인들에게 임하는 심판의 날을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘너희 둥지’에 해당하는 표현은 문맥상 실제 둥지라기보다 보호되는 거처나 그늘진 거처를 뜻할 수 있습니다.
    reason: textual_variant
  - marker: c
    text: 마지막 동물 이미지는 다시 하이랙스(바위너구리/협록류)를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘법less한 자들 앞에서’로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: e
    text: ‘시레나들’은 황무지의 애곡하는 존재를 가리키는 전통적 번역어입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ምንዳቤሆሙ
  english_pob_choice: the judgment of sinners
  chosen_korean: 죄인들의 심판
  alternatives_korean:
  - 죄인들의 고난
  - 죄인들의 벌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 명사는 고난과 징벌의 뉘앙스를 함께 가질 수 있으나, 문맥상 최종 판정과 형벌의 날을 가리키므로 ‘심판’이 가장 직접적입니다.
- source_word: ይትሌዐሉ / ይትነሥኡ
  english_pob_choice: will rise up and be lifted up
  chosen_korean: 일어나 높이 들려 올라가고
  alternatives_korean:
  - 일어나 들려 올라가고
  - 일어나 높여지고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사의 병렬을 살려 단순히 하나로 합치지 않고, 상승과 높여짐의 중첩된 강조를 한국어로도 유지했습니다.
- source_word: ንደብታተ ምድር / ንቅዓታተ ኰኵሕ
  english_pob_choice: the clefts of the earth ... the fissures of the rock
  chosen_korean: 땅의 틈과 바위의 갈라진 곳들
  alternatives_korean:
  - 땅의 갈라진 틈과 바위의 틈들
  - 땅의 균열과 바위의 금들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 표현 모두 지하의 갈라진 은신처를 가리키므로, 중복된 이미지를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: ጼደናት
  english_pob_choice: the sirens
  chosen_korean: 시레나들
  alternatives_korean:
  - 세이렌들
  - sirens
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 loanword가 그리스어 σειρῆνες를 반영하므로, 한국어 음역은 ‘시레나’가 문헌적·음성적으로 무난하며 본문 이미지도 보존합니다.
theological_decisions:
- issue: ‘너희 자녀들’이 누구를 가리키는가
  chosen_reading: 이 직설은 의인 공동체를 향한 격려로 보고, 그들의 자녀가 독수리처럼 높여지는 대비를 유지했습니다.
  alternative_readings:
  - 보다 일반적인 후손 전체로 이해할 수 있습니다.
  - 중간 구절의 전승상 일부 모호성을 남길 수 있습니다.
  rationale: 문맥이 죄인과 의인의 대조를 분명히 세우므로, 수신자를 흐리지 않고 대조 구조를 그대로 살리는 것이 적절합니다.
  doctrine_reference: 원문 우선의 대비 구조를 보존하며 후대 교리적 평준화는 피합니다.
