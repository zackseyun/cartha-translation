base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/003.yaml
  text: And the righteous shall be in the light of the sun[a], and the chosen in the light of eternal life; and there shall be no end to the days of their life[b], and the holy ones shall have days without number.
  footnotes:
  - marker: a
    text: Or, 'the holy ones' days shall be without number.' The Ge'ez wording is literal and idiomatic, emphasizing unbounded duration rather than a mere large quantity.
    reason: lexical_alternative
  - marker: b
    text: Or 'and the holy ones shall have no number of days.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 의인들은 해의 빛 가운데, 선택된 이들은 영원한 생명의 빛 가운데 있을 것입니다. 그들의 생명의 날들에는 끝이 없을 것이며, 거룩한 이들의 날들은 헤아릴 수 없을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “거룩한 이들에게는 날들의 수가 없다”는 뜻입니다. 이는 날들이 없다는 뜻이 아니라, 그 날들을 셀 수 없을 만큼 끝없이 지속된다는 뜻입니다.
    reason: literal_idiom
lexical_decisions:
- source_word: ጻድቃን
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 정의로운 이들
  - 의로운 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 의인들은 도덕적·언약적 의미를 함께 살리는 가장 자연스러운 표준어입니다. '정의로운 이들'보다 본문상의 종교적 범주가 분명합니다.
- source_word: በብርሃነ ፀሐይ
  english_pob_choice: in the light of the sun
  chosen_korean: 해의 빛 안에
  alternatives_korean:
  - 태양빛 속에
  - 해빛 안에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구를 그대로 살려 환상적·우주론적 이미지를 유지했습니다. '빛 안에'는 위치/영역의 뉘앙스를 보존합니다.
- source_word: ኅሩያን
  english_pob_choice: the chosen
  chosen_korean: 선택된 자들
  alternatives_korean:
  - 선택자들
  - 택함을 받은 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''선택된 자들''은 더 현대적이면서도 신적 선택 범주를 유지합니다. ''택함을 받은 자들''보다 문맥상 간결합니다.'
- source_word: በብርሃነ ሕይወት ዘለዓለም
  english_pob_choice: in the light of eternal life
  chosen_korean: 영원한 생명의 빛 안에
  alternatives_korean:
  - 영생의 빛 안에
  - 영원한 생명의 광채 속에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''생명의 빛''이라는 직유를 유지하되, ''영원한 생명''을 앞에 두어 수식 관계를 분명히 했습니다. ''영생''도 가능하지만 본문은 이미지를 더 선명하게 드러냅니다.'
- source_word: ማኅለቆተ አልቦቱ / ኍልቈ መዋዕለ አልቦሙ
  english_pob_choice: there shall be no end ... shall have days without number
  chosen_korean: 끝이 없을 것이며 ... 날 수가 없을 것입니다
  alternatives_korean:
  - 끝이 없을 것이며 ... 날 수를 셀 수 없을 것입니다
  - 끝이 없을 것이며 ... 날이 헤아릴 수 없이 많을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 절의 중복된 무한성 표현을 한국어로 자연스럽게 옮기기 위해 첫 절은 '끝이 없을 것', 끝 절은 '날 수가 없을 것'으로 처리했습니다. 다만 마지막 표현은 원문의 '세어질 수 없음/무수함'을 그대로 드러내는 범위 안에서 선택했습니다.
theological_decisions:
- issue: '''거룩한 이들''의 범주를 한국어로 어떻게 유지할지'
  chosen_reading: 거룩한 이들
  alternative_readings:
  - 성도들
  - 성인들
  rationale: 이 본문은 후대 교회 용어보다 에녹서의 범주를 더 직접적으로 보여주므로, 전통적 교회 어휘인 '성도들'보다 '거룩한 이들'이 source-direct합니다.
  doctrine_reference: Translation philosophy §Readable modern English; source transparency for extra-canonical Enochic categories
- issue: 마지막 절의 무한성 표현을 '날 수가 없을 것입니다'로 옮긴 이유
  chosen_reading: 날 수가 없을 것입니다
  alternative_readings:
  - 날들이 헤아릴 수 없을 것입니다
  - 날들이 무수할 것입니다
  rationale: 기본 의미는 '그 날들을 셀 수 없다'는 무한성입니다. 한국어에서 '날 수가 없다'는 중의적 오해가 있을 수 있으나, 앞의 문맥이 이미 날짜(days)임을 분명히 하므로 원문의 압축성을 살리기 위해 선택했습니다.
  doctrine_reference: Preserve theological tension rather than over-explicate
