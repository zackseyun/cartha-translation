  - 해빛 안에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구를 그대로 살려 환상적·우주론적 이미지를 유지했습니다. '빛 안에'는 위치/영역의 뉘앙스를 보존합니다.
- source_word: ኅሩያን
  english_pob_choice: the chosen
  chosen_korean: 선택된 자들
  alternatives_korean:
  - 선택자들
  - 택함을 받은 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''선택된 자들''은 더 현대적이면서도 신적 선택 범주를 유지합니다. ''택함을 받은 자들''보다 문맥상 간결합니다.'
- source_word: በብርሃነ ሕይወት ዘለዓለም
  english_pob_choice: in the light of eternal life
  chosen_korean: 영원한 생명의 빛 안에
  alternatives_korean:
  - 영생의 빛 안에
  - 영원한 생명의 광채 속에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''생명의 빛''이라는 직유를 유지하되, ''영원한 생명''을 앞에 두어 수식 관계를 분명히 했습니다. ''영생''도 가능하지만 본문은 이미지를 더 선명하게 드러냅니다.'
- source_word: ማኅለቆተ አልቦቱ / ኍልቈ መዋዕለ አልቦሙ
  english_pob_choice: there shall be no end ... shall have days without number
  chosen_korean: 끝이 없을 것이며 ... 날 수가 없을 것입니다
  alternatives_korean:
  - 끝이 없을 것이며 ... 날 수를 셀 수 없을 것입니다
  - 끝이 없을 것이며 ... 날이 헤아릴 수 없이 많을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 절의 중복된 무한성 표현을 한국어로 자연스럽게 옮기기 위해 첫 절은 '끝이 없을 것', 끝 절은 '날 수가 없을 것'으로 처리했습니다. 다만 마지막 표현은 원문의 '세어질 수 없음/무수함'을 그대로 드러내는 범위 안에서 선택했습니다.
theological_decisions:
- issue: '''거룩한 이들''의 범주를 한국어로 어떻게 유지할지'
  chosen_reading: 거룩한 이들
  alternative_readings:
  - 성도들
  - 성인들
  rationale: 이 본문은 후대 교회 용어보다 에녹서의 범주를 더 직접적으로 보여주므로, 전통적 교회 어휘인 '성도들'보다 '거룩한 이들'이 source-direct합니다.
  doctrine_reference: Translation philosophy §Readable modern English; source transparency for extra-canonical Enochic categories
- issue: 마지막 절의 무한성 표현을 '날 수가 없을 것입니다'로 옮긴 이유
  chosen_reading: 날 수가 없을 것입니다
  alternative_readings:
  - 날들이 헤아릴 수 없을 것입니다
  - 날들이 무수할 것입니다
  rationale: 기본 의미는 '그 날들을 셀 수 없다'는 무한성입니다. 한국어에서 '날 수가 없다'는 중의적 오해가 있을 수 있으나, 앞의 문맥이 이미 날짜(days)임을 분명히 하므로 원문의 압축성을 살리기 위해 선택했습니다.
  doctrine_reference: Preserve theological tension rather than over-explicate
