base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/004.yaml
  text: And they will seek the light and find righteousness with the Lord of Spirits[c][b][a]. Peace be to the righteous in the name of the Lord of Eternity.
  footnotes:
  - marker: a
    text: Or 'obtain righteousness' instead of 'find righteousness'; the Ge'ez verb can carry either nuance.
    reason: lexical_alternative
  - marker: b
    text: The closing title could also be rendered 'the Lord of Eternity' or 'the Eternal Lord.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the Lord of the Age'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 빛을 구하고 영들의 주 곁에서 의를 얻을 것입니다[a]. 영원의 주의 이름으로, 의인들에게 평강이 있으라[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의를 얻을 것입니다’는 ‘의를 찾을 것입니다’로도 옮길 수 있습니다. 원문의 동사는 ‘찾다’와 ‘얻다’의 뜻을 모두 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원의 주’는 ‘시대의 주’ 또는 ‘세상의 주’로도 옮길 수 있습니다.
    reason: lexical_alternative
