- issue: ‘find righteousness’의 동사 처리
  chosen_reading: 만군의 주께서 의를 주십니다
  alternative_readings:
  - 만군의 주 안에서 의를 찾습니다
  - 만군의 주께서 의를 발견하게 하십니다
  rationale: 지혜·묵시 문맥에서 ‘찾다/얻다’의 중첩 의미가 있으나, 한국어에서는 의가 주어로부터 수여되는 것으로 옮길 때 문장 흐름과 신학적 긴장이 함께 살아납니다.
  doctrine_reference: preserve obtain/find tension
