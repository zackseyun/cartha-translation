  rationale: 문맥상 ‘찾아 얻다/발견하다’의 뜻이 가능하지만, 한국어에서는 ‘만군의 주께서 의를 주신다’가 수동적으로 받는 뜻과 ‘with the Lord of Spirits’의 관계를 가장 자연스럽게 드러냅니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
