  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 에녹서의 고유한 신적 칭호를 한국어 성경 문체로 옮기되, ‘spirits’의 복수성과 위엄을 살리기 위해 ‘만군의 주’를 채택했습니다.
- source_word: እግዚአ ዓለም
  english_pob_choice: the Lord of Eternity
  chosen_korean: 영원하신 주
  alternatives_korean:
  - 영원의 주
  - 영원의 주님
  - 영원하신 주님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결말의 신적 칭호는 ‘eternity/world/age’의 범위를 가지므로, 한국어에서는 ‘영원하신 주’가 시간적·우주적 지속성을 가장 간명하게 보존합니다.
theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 관용어 선택
  chosen_reading: 만군의 주
  alternative_readings:
