translation:
  language: ko
  text: 그리고 이 일 이후에는 하늘의 거룩한 이들에게 말해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말해질 것입니다’. 게어즈 본문은 화자를 밝히지 않는 비인칭 수동적 표현을 씁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩한 이들’은 하늘의 존재들이나 하늘에 있는 의인들을 가리킬 수 있으며, 이 절만으로는 특정하지 않습니다.
    reason: alternative_reading
