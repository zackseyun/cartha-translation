translation:
  language: ko
  text: 그리고 그 후에는 하늘에 있는 거룩한 이들에게 말해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘말해질 것이다’. 게어즈 본문은 화자를 밝히지 않는 비인칭 수동적 표현을 씁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩한 이들’은 하늘의 존재들이나 하늘에 있는 의인들을 가리킬 수 있으며, 이 절만으로는 특정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወእምድኅረዝ
  english_pob_choice: And after this
  chosen_korean: 그리고 이 일 이후에는
  alternatives_korean:
  - 그리고 그 뒤에는
  - 그리고 이후에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간의 전환을 나타내는 연결 표현으로, 문맥의 다음 단계로 넘어감을 자연스럽게 살리면서도 원문의 순차적 연결을 유지합니다.
- source_word: ይትበሀል
  english_pob_choice: it will be said
  chosen_korean: 말해질 것입니다
  alternatives_korean:
  - 말해질 것이다
  - 전해질 것입니다
  - 선포될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게어즈의 비인칭 수동 표현을 살려, 구체적 화자를 덧붙이지 않고 ‘말해지다’로 옮겼습니다.
- source_word: ለቅዱሳን
  english_pob_choice: to the holy ones
  chosen_korean: 하늘의 거룩한 이들에게
  alternatives_korean:
  - 거룩한 이들에게
  - 성스러운 이들에게
  - 하늘의 성도들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘거룩한 이들’의 기본 의미를 유지하되, 문맥상 ‘in heaven’과 결합해 하늘에 있는 대상을 자연스럽게 드러냈습니다. ‘성도’는 후대 교회적 뉘앙스를 더 강하게 띠어 여기서는 보류했습니다.
- source_word: በሰማይ
  english_pob_choice: in heaven
  chosen_korean: 하늘의
  alternatives_korean:
  - 하늘에서
  - 하늘에 있는
  - 천상에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 장소 부사구를 한국어 수식형으로 자연스럽게 처리하여, 앞의 ‘거룩한 이들’이 하늘에 속한 존재임을 간결하게 드러냈습니다.
theological_decisions:
- issue: ‘거룩한 이들’의 정체
  chosen_reading: 천사, 의인, 또는 하늘에 있는 존재들 가운데 어느 쪽인지 단정하지 않고 ‘거룩한 이들’로 넓게 유지했습니다.
  alternative_readings:
  - 천사들에게
  - 의인들에게
  - 성도들에게
  rationale: 이 절 자체는 대상의 정체를 특정하지 않으므로, 본문이 열어 둔 의미의 폭을 보존하는 쪽이 원문에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
