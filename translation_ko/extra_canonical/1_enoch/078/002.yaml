base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/002.yaml
  text: 'And the moon has four names: the first is Asonya[a], the second Abla, the third Benase[b], and the fourth Erae.'
  footnotes:
  - marker: a
    text: Ge'ez ወርኅ can mean either 'moon' or 'month.' Here 'moon' is preferred because the verse assigns four names to the luminary.
    reason: lexical_alternative
  - marker: b
    text: The four names are transliterations of the Ethiopic forms. Their underlying older forms, if any, are uncertain.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 달에는 네 가지 이름이 있습니다. 첫째는 아소냐[a], 둘째는 아블라, 셋째는 베나세[b], 넷째는 에라에입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈어 ወርኅ은 ‘달’과 ‘한 달’을 모두 뜻할 수 있습니다. 그러나 여기서는 이름이 붙는 대상이 천체이므로 ‘달’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 네 이름은 게으즈어 형태를 음역한 것입니다. 그보다 더 오래된 형태가 있었는지는 확실하지 않습니다.
    reason: cultural_note
