  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어진 주석대로 이 동사는 남아 있던 것이 완전히 사라지거나 소진되는 뜻이므로, 15일째의 완전한 소멸을 분명히 하는 ‘소멸됩니다’를 택했습니다.
theological_decisions:
- issue: 달의 감소를 설명하는 천문학적 서술의 성격
  chosen_reading: 상징화하거나 영적 비유로 돌리지 않고, 달빛의 수치적 감소를 관찰적·천문학적 설명으로 유지했습니다.
  alternative_readings:
  - 상징적 의미로 해석
  - 일반적인 ‘점점 줄어든다’로 완화
  rationale: 아스트로노미컬 북의 문맥은 정밀한 질서와 측정에 있으므로, 반복되는 수치와 단계적 감소를 그대로 보존하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: '번역 원칙: 묵시적 우주 질서의 서술을 평이하게 환원하지 말고, 본문이 제시하는 수리적 구조를 유지할 것.'
