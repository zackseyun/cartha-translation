base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/007.yaml
  text: And fifteen parts of light are added within it until the fifteenth day[a]; and its light is completed as a sign of the year, and it becomes fifteen parts[c][b], and the moon comes into being by half of a seventh part.
  footnotes:
  - marker: a
    text: The final clause is difficult in the Ethiopic. The wording likely refers to the month reaching its midpoint by counted portions of light, but the exact force of 'in the seventh portion' is uncertain.
    reason: textual_variant
  - marker: b
    text: The repeated 'fifteen' likely refers to fifteen parts of lunar light, a technical reckoning used in this chapter, rather than merely the calendar date.
    reason: cultural_note
  - marker: c
    text: Or 'and the month comes to its half in the seventh portion.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 안에서 빛이 열다섯 부분 더해져 열다섯째 날까지 이르며[a], 그 빛은 한 해의 표징으로서 완성되고 열다섯 부분이 되며[c][b], 달은 일곱째 부분의 절반으로 생겨납니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문에는 단지 ‘열다섯’이라고 되어 있으며, ‘날’은 달의 주기에서 그 시점을 나타내기 위해 문맥상 보충한 말입니다.
    reason: source_note
  - marker: b
    text: 이 장 전체에서 ‘열다섯’은 단순한 날짜가 아니라 달빛의 기술적 분량을 가리키는 수량 표현으로 쓰입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘달의 한 달은 일곱째 부분에서 절반에 이릅니다.’ 이 해석적 번역은 가능하지만, 원문의 분량 표현을 덜 직접적으로 반영합니다.
    reason: previous_rendering
