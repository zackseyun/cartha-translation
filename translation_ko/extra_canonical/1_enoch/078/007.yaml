    rationale: 각주 c는 ‘또는’이라고 하지만 현재 본문의 마지막 절과 사실상 동일합니다. 감사 기록상 이 각주는 폐기된/이전의 해석적 번역을 제시하는 것이므로, 그 내용을 실제 대안으로 고쳐야 합니다.
