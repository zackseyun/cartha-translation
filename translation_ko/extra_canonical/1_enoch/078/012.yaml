  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 달의 주기를 가리키는 시간 구문이므로, 한국어에서는 자연스러운 시간 부사구인 ‘첫째 날에’로 옮겼습니다.
- source_word: ሠርቀ
