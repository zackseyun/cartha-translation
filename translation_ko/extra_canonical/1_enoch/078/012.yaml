- source_word: ትሠመይ
  english_pob_choice: she is called
  chosen_korean: 그는 ...이라고 불립니다
  alternatives_korean:
  - 그녀는 ...이라고 불립니다
  - 그것은 ...이라고 불립니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게이즈어의 여성형을 살려도 되지만, 한국어에서는 달을 인격화해도 자연스러운 중성 표지가 약하므로 문장 흐름을 우선해 ‘그는’으로 두되, 달을 가리키는 지시를 본문에서 유지했습니다.
- source_word: ይትነሣእ ላዕሌሃ ብርሃን
  english_pob_choice: light rises upon her
  chosen_korean: 빛이 그 위에 떠오르기
  alternatives_korean:
  - 빛이 그 위에 올라오기
  - 빛이 그 위에 비치기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 ‘올라오다/떠오르다’ 이미지를 살리기 위해 ‘떠오르기’로 옮겼고, ላዕሌሃ는 표면 위에 비추는 뜻에 맞게 ‘그 위에’로 처리했습니다.
theological_decisions:
- issue: 달의 여성형 인칭 유지 여부
  chosen_reading: 한국어 본문에서는 자연스러운 문장성 때문에 중성적 지시를 일부 완화하되, 달의 인격화 이미지는 보존했습니다.
  alternative_readings:
  - ‘그녀는 초승달이라고 불립니다’로 여성형을 직접 반영
  - ‘그것은 초승달이라고 불립니다’로 중성화
  rationale: 게이즈어는 여성형이지만, 한국어에서 대상의 성별 표지는 이 구절의 이해에 필수적이지 않습니다. 다만 의인화된 천체 서술이라는 원문 특성은 유지해야 하므로 과도한 평이화는 피했습니다.
  doctrine_reference: '번역 원칙: 원문 형식과 한국어 자연스러움의 균형'
