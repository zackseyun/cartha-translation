base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/012.yaml
  text: On the first day she is called the new moon[d][c][b][a], because on that day light rises upon her.
  footnotes:
  - marker: a
    text: That is, the moon is in its increasing phase at the beginning of the month.
    reason: cultural_note
  - marker: b
    text: Or 'light appears upon her.' The Ge'ez expression pictures brightness coming up over the moon.
    reason: lexical_alternative
  - marker: c
    text: Or 'the waxing one'.
    reason: previous_rendering
  - marker: d
    text: Or 'the light rises over her'.
    reason: previous_rendering
translation:
  language: ko
  text: 첫째 날에 그녀는 초승달이라고 불립니다[a][b][c][d]. 그날 빛이 그녀 위에 떠오르기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 달이 한 달의 시작에 차오르는 단계에 있다는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그녀 위에 빛이 나타납니다.’ 게에즈어 표현은 빛이 달 위에 떠오르는 모습을 그립니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘차오르는 달’입니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘빛이 그녀 위에 떠오릅니다.’
    reason: previous_rendering
