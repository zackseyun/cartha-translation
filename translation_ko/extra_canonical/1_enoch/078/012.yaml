- issue: 달의 여성형 인칭 유지 여부
  chosen_reading: 한국어 본문에서는 자연스러운 문장성 때문에 중성적 지시를 일부 완화하되, 달의 인격화 이미지는 보존했습니다.
  alternative_readings:
  - ‘그녀는 초승달이라고 불립니다’로 여성형을 직접 반영
  - ‘그것은 초승달이라고 불립니다’로 중성화
  rationale: 게이즈어는 여성형이지만, 한국어에서 대상의 성별 표지는 이 구절의 이해에 필수적이지 않습니다. 다만 의인화된 천체 서술이라는 원문 특성은 유지해야 하므로 과도한 평이화는 피했습니다.
