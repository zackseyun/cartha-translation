  source_fidelity: 원문은 ‘우리엘이 나에게 또 다른 규례를 보여 주었다’는 주절과, 빛이 달 안으로 옮겨지고 해로부터 그 출처가 언급되는 압축된 천문학적 설명을 담고 있습니다. 초안은 주어와 목적어를 모두 ‘우리리’로 잘못 반복하여 አርአየኒ(‘나에게 보여 주었다’)를 훼손했습니다. ‘어디에서 해로부터’도 한국어에서 출처 관계가 불명료합니다.
  naturalness: ‘우리엘은 나에게 … 보여 주셨습니다’가 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘해의 어느 쪽으로부터’는 እምኀበ의 장소·방향 범위를 보존하면서 ‘해로부터 어디에서’라는 부자연스러운 중복을 피합니다.
