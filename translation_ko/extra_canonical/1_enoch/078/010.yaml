base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/010.yaml
  text: 'And Uriel showed me another law: when light is transferred into the moon[c][b][a], and from where it is transferred from the sun.'
  footnotes:
  - marker: a
    text: Or 'another order' or 'another ordinance.' The Ge'ez term can denote an ordered rule or fixed arrangement in the cosmos.
    reason: lexical_alternative
  - marker: b
    text: 'The wording is somewhat compressed: the sense is that Uriel showed Enoch the rule governing how the moon receives its light from the sun.'
    reason: alternative_reading
  - marker: c
    text: Or 'when the light is transferred into the moon, and from where it is transferred from the sun.'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리리는 우리리를 보고 또 다른 규례를 보여 주셨습니다. 곧 달 안으로 빛이 옮겨지고, 그 빛이 어디에서 해로부터 옮겨지는지에 관한 규례입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 질서’, ‘다른 정해진 배열’로도 옮길 수 있습니다. 게에즈어는 우주적 규칙이나 고정된 배열을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 문장이 압축되어 있지만, 뜻은 우라엘이 에녹에게 달이 해로부터 빛을 받는 규례를 보여 준다는 것입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘달 안으로 옮겨지는 빛, 그리고 해로부터 어디에서 옮겨지는지’로도 옮길 수 있습니다.
    reason: previous_rendering
