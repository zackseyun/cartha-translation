  text: And in certain months[a], the month has twenty-nine days[c][b], and once twenty-eight.
  footnotes:
  - marker: a
    text: The closing phrase is difficult in the Ethiopic OCR witness. The wording rendered 'and at one time five weeks' may reflect a corrupt or poorly recovered text; compare critical editions for possible clarification.
    reason: textual_variant
  - marker: b
    text: The Astronomical Book uses technical calendrical language for the movements and reckonings of the heavenly lights; 'luminaries' is retained to preserve that specialized register.
    reason: cultural_note
  - marker: c
    text: Or 'And in the days of the luminaries, it shall be twenty-nine days for the month, and at one time five weeks.'.
    reason: previous_rendering
