base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/013.yaml
  text: 'It is completed with exactness: by day the sun goes down in the west[a], and from the east the moon rises by night and gives light all night, until the sun rises before it[c][b], and the moon is seen before the sun.'
  footnotes:
  - marker: a
    text: The clause 'from the east it rises by night' is difficult in context. The Ge'ez wording has been translated transparently rather than harmonized to expected astronomical phrasing.
    reason: textual_variant
  - marker: b
    text: The verb rendered 'rises' in 'until the sun rises before it' is textually uncertain in form and may reflect a difficult transmission. The contextual sense is the sun's appearing or rising.
    reason: lexical_alternative
  - marker: c
    text: Or 'on that day the sun goes down in the west, and from the east it rises by night; and the moon gives light'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 일은 정확하게 이루어집니다. 낮에는 해가 서쪽으로 집니다[a]. 그리고 동쪽에서 달이 밤에 떠서 온 밤 내내 빛을 비춥니다. 해가 그보다 먼저 뜰 때까지 그렇게 하며[c][b], 달은 해보다 먼저 보입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동쪽에서 달이 밤에 뜬다’는 구절은 문맥상 난해합니다. 지문을 예상되는 천문 표현에 맞추어 조정하지 않고 드러내어 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘해가 그보다 먼저 뜰 때까지’에 해당하는 동사는 형태상 난해합니다. 문맥에 따라 ‘뜨다’ 또는 ‘나타나다’라는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 이전 번역처럼 ‘그날 해가 서쪽으로 지고, 동쪽에서 해가 밤에 떠서 달이 빛을 비춘다’로 읽을 수도 있습니다.
    reason: previous_rendering
