base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/014.yaml
  text: From where the light comes to the moon, from there again it wanes until all the light is finished, and the days of the month pass, and its disk remains empty, without light.
  footnotes:
  - marker: a
    text: Or 'from that place ... from there in turn'; the repeated source-language phrasing emphasizes the moon's cyclical reception and loss of light.
    reason: lexical_alternative
  - marker: b
    text: '''Its disk'' could also be rendered ''its circle'' or ''its orb.'' The image is the moon''s round visible form left dark.'
    reason: lexical_alternative
  - marker: c
    text: Or 'From there the light comes to the moon, and from there again it wanes'.
    reason: previous_rendering
translation:
  language: ko
  text: 빛이 달에게로 오는 곳에서, 거기서 다시 그것은 모든 빛이 끝날 때까지 줄어들고, 달의 날들이 지나가며, 그 원반은 빛 없이 빈 채로 남아 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그곳에서/그 장소에서’의 반복 구조일 수 있으며, 이 반복은 달이 빛을 받는 자리와 잃는 자리가 서로 대응됨을 강조합니다.
    reason: source_note
  - marker: b
    text: ‘원반’은 달의 둥근 겉모양을 가리키며, ‘원(circle)’이나 ‘구체(orb)’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኀበ / እምህየ
  english_pob_choice: From where ... from there
  chosen_korean: “...오는 곳에서, 거기서 다시 ...”
  alternatives_korean:
  - 그곳에서 ... 거기서 다시 ...
  - 어디에서 ... 거기서 다시 ...
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상관구문인 ‘from where / from there’를 한국어에서도 대응시키되, 첫 항목은 관계적 의미를 살려 ‘오는 곳에서’로, 둘째는 지시적 반복을 살려 ‘거기서 다시’로 옮겼습니다.
- source_word: የሐፅፅ
  english_pob_choice: it wanes
  chosen_korean: 줄어들고
  alternatives_korean:
  - 기울고
  - 감소하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 달의 주기적 감소를 나타내는 문맥이므로 ‘줄어들다’가 자연스럽고, 천문학적 묘사를 과도하게 해석하지 않으면서 쇠퇴의 감각을 유지합니다.
- source_word: እስከ ይትዌዳእ ኵሉ ብርሃን
  english_pob_choice: until all the light is finished
  chosen_korean: 모든 빛이 끝날 때까지
  alternatives_korean:
  - 모든 빛이 다할 때까지
  - 모든 빛이 사라질 때까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 완료에 이르는 과정을 직접적으로 표현하는 구문이므로 ‘끝날 때까지’가 원문의 종결성을 간결하게 보존합니다.
- source_word: ክበቡ ባክ ዘእንበለ ብርሃን
  english_pob_choice: its disk remains empty, without light
  chosen_korean: 그 원반은 빛 없이 빈 채로 남아 있습니다
  alternatives_korean:
  - 그 원반은 빛 없이 비어 있습니다
  - 그 원반은 빛이 없는 공허한 상태로 남아 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘disk/orb’에 해당하는 ክበቡ는 달의 둥근 겉모양을 가리키므로 ‘원반’으로 옮겼고, ባክ의 공허함을 ‘빈 채로’로 살려 시각적 잔상을 유지했습니다.
theological_decisions:
- issue: 본문의 천문학적 묘사 방식
  chosen_reading: 이 구절은 달이 빛을 받아 줄어드는 과정을 관찰적으로 묘사하는 문장으로 유지하고, 현대 과학식 설명이나 상징적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 달빛의 영적 원천을 암시하는 상징으로 읽기
  - 현대적 반사광 설명으로 풀어쓰기
  rationale: 『천문서』의 문체는 질서 있는 우주 현상을 비전적·묵시적으로 말하므로, 번역은 그 관찰적 어조를 그대로 보존하는 것이 본문 충실성에 더 적합합니다.
  doctrine_reference: '번역 원칙: 묵시적 우주 묘사를 보존하고, 본문이 말하는 범위를 넘어 알레고리화하지 않음.'
