  rationale: 원문의 구체적이고 의인화된 우주 표현을 유지하기 위해 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 천체의 ‘문/문들’ 이미지와 우주 질서
  chosen_reading: 하늘이 고정된 개구부들로 구조화되어 있으며, 해와 달과 별들이 그 정해진 문을 통해 드나든다는 우주론적 이미지를 유지했습니다.
  alternative_readings:
  - 단순한 시적 비유로 완화하기
  - 현대적 천문 묘사로 바꾸기
  rationale: 에녹서의 천문 묘사는 실제적인 우주 구조를 전제하는 방식으로 진행되므로, 이미지를 약화하지 않고 그대로 드러내는 편이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: 1 Enoch Astronomical Book의 우주론적 묘사
