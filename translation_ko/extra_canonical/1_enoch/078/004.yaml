base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/004.yaml
  text: In the disk of the sun there are seven portions of light which are added to it beyond the moon[e][d][c][b][a], and in measure they are added until the seventh portion of the sun is completed.
  footnotes:
  - marker: a
    text: The Ethiopic syntax is difficult. The line appears to describe the sun as exceeding the moon by seven measured portions of light, but the final clause can also be understood as 'until the seventh portion of the sun is completed' or 'surpassed.'
    reason: textual_variant
  - marker: b
    text: '''Circuit'' translates a term for circle or course, preserving the Astronomical Book''s schematic description of heavenly movement.'
    reason: cultural_note
  - marker: c
    text: Or 'beyond the moon'.
    reason: previous_rendering
  - marker: d
    text: Or 'until a seventh portion'.
    reason: previous_rendering
  - marker: e
    text: Or 'In the circuit of the sun'.
    reason: previous_rendering
translation:
  language: ko
  text: 태양의 원반에는 빛의 일곱 부분이 있으며, 그것들은 달보다 더해지고, 그 수는 측량에 따라 태양의 일곱째 부분이 완성될 때까지 더해집니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 문장은 해석이 다소 어렵습니다. 여기서는 태양의 빛이 달보다 일곱 측량된 부분만큼 더해진다는 뜻으로 옮겼으며, 마지막 절은 ‘완성될 때까지’로도 이해할 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘원반’은 ክበብ의 원형·원주·원반 의미를 살린 번역으로, 천체의 운동 경로가 아니라 천체 자체를 가리키는 것으로 보았습니다.
    reason: source_note
