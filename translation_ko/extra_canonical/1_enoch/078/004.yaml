  - 척도에 따라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 질서정연하게 규정된 증가를 나타내는 말이므로, ‘측량’으로 옮겨 정량적 의미를 보존했습니다.
- source_word: እስከ የሐልፍ ሳብዕ ክፍለ ፀሐይ
  english_pob_choice: until the seventh portion of the sun is completed
  chosen_korean: 태양의 일곱째 부분이 완성될 때까지
  alternatives_korean:
  - 태양의 일곱째 부분이 지나갈 때까지
  - 태양의 일곱째 부분을 넘을 때까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어진 수정안에 따라 ሳብዕ을 서수 ‘일곱째’로 이해했고, የሐልፍ은 문맥상 ‘완성되다’로 풀어 종결점을 분명히 했습니다.
theological_decisions:
- issue: 이 구절의 우주론적 서술 방식
  chosen_reading: 고대 묵시문학의 도식적·측정적 표현으로 살리고, 현대 천문학 용어로 환원하지 않았습니다.
  alternative_readings:
  - 상징적 진술로만 처리하기
  - 현대 과학식 표현으로 바꾸기
  rationale: 「태양」「달」「측량」「일곱 부분」의 반복은 질서 잡힌 천체 운행을 묘사하는 본문 특성을 보여 주므로, 원문 세계의 표현 방식을 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원리: 묵시적 우주 질서를 평이하지만 납작하지 않게 전달함.'
