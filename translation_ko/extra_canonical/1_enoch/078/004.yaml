  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 태양의 운동 경로가 아니라 빛이 들어 있는 천체 자체를 말하므로, ክበብ의 ‘원반/원형 몸체’ 의미를 살려 옮겼습니다.
- source_word: ሰብዓቱ ክፍለ ብርሃን
  english_pob_choice: seven portions of light
  chosen_korean: 빛의 일곱 부분
  alternatives_korean:
  - 빛의 일곱 몫
  - 빛의 일곱 분할
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수량화된 구조를 보존하기 위해 ‘부분’으로 옮겼고, ‘빛의’로 원문의 속성 관계를 간명하게 드러냈습니다.
- source_word: ዘይትዌሰክ ቦቱ
  english_pob_choice: which are added to it
  chosen_korean: 그것들은 ... 더해지고
  alternatives_korean:
  - 그것들은 ... 증가하고
  - 그것들은 ... 보태지고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 가산적 의미를 살리기 위해 ‘더해지다’를 택했고, ቦቱ는 태양을 가리키는 말로 이해해 지시를 풀었습니다.
- source_word: እምወርኅ
  english_pob_choice: beyond the moon
  chosen_korean: 달보다
  alternatives_korean:
  - 달을 넘어서
  - 달 너머
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비교의 뜻을 자연스럽게 드러내되, 영어 주석이 제시한 ‘beyond the moon’의 신중한 비교 의미를 유지했습니다.
- source_word: መስፈርት
  english_pob_choice: in measure
  chosen_korean: 측량에 따라
  alternatives_korean:
