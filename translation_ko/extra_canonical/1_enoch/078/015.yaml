  naturalness: 현 초안의 ‘제때에[b], 그 기울어짐이 일어날 때입니다’는 문장 성분이 연결되지 않아 현대 한국어 합쇼체 문장으로 자연스럽지 않습니다. ‘정해진 때에는 기울어집니다’는 원문의 시간·계절 어휘와 시간절을 간결하고 자연스럽게 반영합니다.
  terminology: 달의 주기라는 문맥에서는 ‘기울어지다’가 ‘waning’을 자연스럽게 나타냅니다. 다만 이 어형의 정확한 기술적 의미가 확정되지 않았으므로, ‘계산’이나 ‘배열’의 완성이라는 대안은 본문에 단정하지 않고 각주에 남겼습니다. ‘정해진 때’는 በአዝማነ의 시간/정한 시기 의미를 무리 없이 전달합니다.
