base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/003.yaml
  text: These are the two great luminaries[a]; their disks are like the disk of heaven[b], and the size of the disks of the two of them is equal.
  footnotes:
  - marker: a
    text: The final clause is difficult. The Ge'ez appears to say that the measured extent of the circuit belonging to both luminaries is 'equal' or 'the same.' A more literal alternative would be, 'and the measure of their circuit, for the two of them, is the same.'
    reason: lexical_alternative
  - marker: b
    text: Or 'their circuits are like the circuit of heaven, and the size of the circuit'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것들은 두 큰 광명체입니다[a]. 그들의 원반은 하늘의 원반과 같고[b], 그 둘의 원반의 크기는 서로 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 두 천체를 가리키는 복수 표현을 사용하므로, 한국어도 복수성을 분명히 살렸습니다.
    reason: source_note
  - marker: b
    text: 여기서 ክበብ 계열 어휘는 ‘궤도’보다 ‘원반’ 또는 ‘둘레’에 더 가깝다는 판정에 따라, 하늘과의 비교를 ‘원반’으로 옮겼습니다.
    reason: lexical_alternative
