base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/011.yaml
  text: And throughout the time when the moon is waning[a], it diminishes its light before the sun until fourteen days [its light is completed]; and when it is extinguished[d][c][b], all its light is completed in the sky.
  footnotes:
  - marker: a
    text: The clause around 'until fourteen days are completed' is textually difficult in the Ethiopic OCR, and the bracketed words likely repeat the idea that the moon's light reaches its completion or end over that period.
    reason: textual_variant
  - marker: b
    text: '''Before the sun'' is kept literally. In context it may mean in the sun''s presence or in relation to the sun''s course.'
    reason: lexical_alternative
  - marker: c
    text: Or 'its light diminishes before the sun'.
    reason: previous_rendering
  - marker: d
    text: Or 'until fourteen days are completed'.
    reason: previous_rendering
translation:
  language: ko
  text: 달이 기울어지는 모든 기간에, 달은 해 앞에서[a][b] 열나흘까지 자기 빛을 옮겨 놓습니다[그 빛이 다합니다].[c] 그리고 달이 꺼지면, 하늘에서 그 모든 빛이 다합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옮겨 놓다’는 여기의 동사를 빛의 단순한 감소가 아니라 빛을 두거나 옮기는 행위로 이해한 번역입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘해 앞에서’입니다. 문맥상 해와의 관계나 해의 운행에 관련된 위치를 가리킬 수 있으나, 정확한 뜻은 분명하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: 대괄호 안의 ‘그 빛이 다합니다’는 전승된 에티오피아어 본문에서 불확실하게 표시된 구절을 반영합니다.
    reason: textual_variant
