  rationale: 이 본문은 달의 주기적 변화에 대한 서술이라기보다 고대 문헌 특유의 천문적 작동 방식을 말하므로, 이미지를 완화하지 않고 그대로 살리는 편이 원문 의도에 가깝습니다.
