base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/003.yaml
  text: Do not fear the sinners[a], O righteous ones, for again the Lord will deliver them into your hands[c][b], so that you may execute judgment upon them according to your pleasure.
  footnotes:
  - marker: a
    text: Or 'Do not be afraid because of the sinners.' The Ge'ez construction with እም can be rendered more literally with 'from/because of,' but idiomatic English favors 'fear the sinners.'
    reason: lexical_alternative
  - marker: b
    text: '''Into your hands'' is an idiom for being given into someone''s power or control.'
    reason: cultural_note
  - marker: c
    text: Or 'as you wish' / 'according to your will.' The line depicts the reversal in which the righteous receive authority over those who oppressed them.
    reason: lexical_alternative
translation:
  language: ko
  text: 죄인들을 두려워하지 마십시오, 의인들이여. 이는 주님께서 다시 그들을 여러분의 손에 넘기실 것이므로, 여러분이 뜻하시는 대로 그들에게 심판을 집행하게 하실 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죄인들로부터/죄인들 때문에 두려워하지 마십시오’로도 옮길 수 있습니다. 두려움 동사와 함께 쓰인 게에즈어 전치사 እም은 문맥상 ‘죄인들을 두려워하다’라는 자연스러운 표현으로 번역되었습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분의 손에’는 누군가가 다른 이의 권력이나 통제 아래로 넘어간다는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ኢትፍርሁ
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수에게 주는 부정 명령의 직접성을 살리되, 현대 합쇼체에서 자연스러운 금지 표현으로 옮겼습니다.
- source_word: ጻድቃን
  english_pob_choice: righteous ones
  chosen_korean: 의인들이여
  alternatives_korean:
  - 의인들아
  - 의로운 이들이여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 의인 집단을 호격으로 유지해 대조 구조를 분명히 하되, 문어체에서 부자연스럽지 않게 다듬었습니다.
- source_word: ውስተ እዴክሙ
  english_pob_choice: into your hands
  chosen_korean: 여러분의 손에
  alternatives_korean:
  - 여러분의 손 안에
  - 여러분의 권력 아래
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘손에 넘기다’의 관용적 의미를 살려, 통제권이 넘어가는 이미지를 한국어에서도 자연스럽게 드러냈습니다.
- source_word: ኵነኔ
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥은 법정 절차보다 종말론적 심판 행위를 가리키므로 ‘심판’이 가장 직접적입니다.
- source_word: በከመ ፈቀድክሙ
  english_pob_choice: according to your pleasure
  chosen_korean: 여러분이 뜻하시는 대로
  alternatives_korean:
  - 여러분의 뜻대로
  - 여러분이 원하시는 대로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 의인들의 의지에 따른 재량을 표현하는 구절이므로, ‘뜻하시는 대로’가 과도한 해석 없이 자연스럽습니다.
theological_decisions:
- issue: 의인들이 단지 구원받는지, 아니면 심판 집행에 실제로 참여하는지
  chosen_reading: 의인들이 주님께서 넘기신 죄인들에게 직접 심판을 집행하는 주체로 제시된다고 옮겼습니다.
  alternative_readings:
  - 의인들은 단지 하나님의 심판을 목격합니다
  - 의인들은 죄인들에 대한 권한만 받습니다
  rationale: 목적절 ‘여러분이…심판을 집행하게 하실’과 ‘여러분의 손에’가 결합되어 있어, 적극적 참여를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 종말론적 반전과 보응의 긴장을 그대로 유지합니다.
