  naturalness: ‘죄인들을 두려워하지 마십시오, 의인들이여’는 현대 문어체 합쇼체에서 자연스럽습니다. 다만 ‘왜냐하면 … 것이기 때문입니다’는 중복 인과 표현이므로 ‘이는 … 때문입니다’ 또는 두 문장으로 정리해야 합니다. ‘주님께서 … 넘기실 것이므로’로 연결하면 격식 있고 매끄럽습니다.
