base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/001.yaml
  text: Who will grant me that my eyes might become a cloud of water[a], so that I may weep over you and pour out my tears like a cloud of water[c][b], and find rest from the sorrow of my heart?
  footnotes:
  - marker: a
    text: Or 'a rain-cloud of water.' The Ge'ez image is repeated twice and may intentionally evoke eyes becoming a storm-cloud of tears.
    reason: lexical_alternative
  - marker: b
    text: The addressee 'you' is plural in context and likely refers to the sinners/wicked addressed in the surrounding woes.
    reason: cross_reference
  - marker: c
    text: Or 'Who will grant to my eyes that they might become a cloud of water, so that I may weep over you and pour out my tears like a cloud of water, and I would find rest'.
    reason: previous_rendering
translation:
  language: ko
  text: 누가 내 눈이 물의 구름이 되게 해 주어[a], 내가 너희를 두고[b] 울며 내 눈물을 물의 구름처럼 쏟고 내 마음의 슬픔에서 쉼을 얻게 해 주겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비구름’. 원문은 ‘물의 구름’이라는 이미지를 두 번 반복하며, 눈이 눈물의 구름이 되는 모습을 떠올리게 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희’는 복수형입니다. 문맥상 주변의 경고가 향하는 죄인들 또는 악인들을 가리키는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: መኑ
  english_pob_choice: Who will grant
  chosen_korean: 누가 내게
  alternatives_korean:
  - 누가 허락하겠습니까
  - 누가 주겠습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 탄식형 의문문으로서 ‘누가’로 시작하는 것이 자연스럽고, 이어지는 ይሁበኒ의 수여·허락 뉘앙스를 한국어에서는 뒤의 ‘해 주어’로 살렸습니다.
- source_word: ይሁበኒ
  english_pob_choice: will grant to me
  chosen_korean: 내게 … 해 주어
  alternatives_korean:
  - 내게 주어
  - 내게 허락하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘내게 주다’이지만, 여기서는 간청하는 가능성의 표현이어서 ‘해 주어’가 문맥상 더 자연스럽고 청원의 힘을 유지합니다.
- source_word: ከመ ይኩና ደመና ማይ
  english_pob_choice: that my eyes might become a cloud of water
  chosen_korean: 내 눈들이 물의 구름이 되게
  alternatives_korean:
  - 내 눈들이 비구름이 되게
  - 내 눈이 물의 구름이 되게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기이한 시적 이미지를 약화시키지 않기 위해 ‘물의 구름’을 유지했습니다. ‘비구름’은 뜻은 매끄럽지만 원문의 반복 이미지가 덜 드러납니다.
- source_word: እክዐው አንብዐየ
  english_pob_choice: pour out my tears
  chosen_korean: 내 눈물을 … 쏟아 붓고
  alternatives_korean:
  - 내 눈물을 쏟고
  - 내 눈물을 흘리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘쏟아 붓다’가 눈물의 격렬한 분출을 가장 잘 살리며, ‘pour out’의 감정적 강도를 보존합니다.
theological_decisions:
- issue: 강렬한 시적 이미지의 처리
  chosen_reading: ‘물의 구름’ 이미지를 본문에 그대로 유지했습니다.
  alternative_readings:
  - ‘비구름’으로 완화
  - ‘눈물이 가득한 눈’처럼 풀이
  rationale: 이 구절은 탄식시의 과장된 이미지가 핵심이므로, 낯설더라도 원문의 상징을 평이한 문장으로 풀어버리지 않는 것이 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문의 시적·예언적 이미지를 평탄화하지 않고 가시적으로 보존한다.'
