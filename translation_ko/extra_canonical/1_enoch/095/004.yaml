base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/004.yaml
  text: Woe to you who pronounce curses that cannot be undone[c][b][a], and healing is far from you because of your sins.
  footnotes:
  - marker: a
    text: The phrase rendered 'weigh out silver' is difficult. It may refer to measuring out money in a legal or corrupt setting; some interpreters understand an allusion to bribery.
    reason: lexical_alternative
  - marker: b
    text: The clause 'so that you may be judged' is syntactically uncertain and could also be understood more specifically as the execution of sentence.
    reason: alternative_reading
  - marker: c
    text: Or 'who weigh out silver so that you may be judged'.
    reason: previous_rendering
translation:
  language: ko
  text: 화 있을진저, 풀 수 없는 저주를 선포하는 너희에게! 그리고 너희의 죄 때문에 치유는 너희에게서 멉니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሌ
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프도다
  - 아아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언적 심판 경고문의 통상적 서두를 현대 한국어 합쇼체로 옮기면서, 단순 탄식보다 심판 선언의 힘을 살렸습니다.
- source_word: ታወግዙ ግዘታተ
  english_pob_choice: pronounce curses that cannot be undone
  chosen_korean: 풀 수 없는 저주를 선포하는
  alternatives_korean:
  - 해제할 수 없는 저주를 내리는
  - 철회할 수 없는 맹세를 선포하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영어 주해를 따라 핵심은 ‘저주/금지 선언’과 ‘해제 불가’에 두고, 한국어에서도 의례적·법적 언어인 ‘선포하다’를 택했습니다.
- source_word: ከመ፡ እ ይትፈትሑ
  english_pob_choice: cannot be undone
  chosen_korean: 풀 수 없는
  alternatives_korean:
  - 해제될 수 없는
  - 풀리지 않는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 핵심은 ‘loosen/unloose’의 반의적 의미이므로, ‘풀 수 없는’으로 간명하게 보존했습니다.
- source_word: ወፈውስ ርኁቅ እምኔክሙ
  english_pob_choice: and healing is far from you
  chosen_korean: 그리고 치유는 너희에게서 멉니다
  alternatives_korean:
  - 그리고 회복은 너희에게서 멉니다
  - 그리고 치료는 너희에게서 멉니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ፈውስ’의 의료·회복적 의미를 살리면서, 한국어에서는 자연스럽게 ‘치유’로 옮겼습니다.
- source_word: በእንተ ኃጢአተ ዚአክሙ
  english_pob_choice: because of your sins
  chosen_korean: 너희의 죄 때문에
  alternatives_korean:
  - 너희의 죄로 인해
  - 너희의 죄 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원인의 관계를 직접적으로 드러내는 표현을 택해, 공동체 전체를 향한 책망의 성격을 살렸습니다.
theological_decisions:
- issue: ይትፈትሑ의 의미를 한국어에서 어떻게 처리할지
  chosen_reading: ‘풀 수 없는’으로 옮겨 저주/금지 선언이 해제 불가하다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘없앨 수 없는’
  - ‘해제될 수 없는’
  rationale: 주어진 수정 이력과 원어 재검토를 따르면 핵심 대립은 ‘묶다/풀다’이므로, 한국어에서도 그 대조를 유지하는 것이 가장 투명합니다.
  doctrine_reference: 원문 우선 원칙; 해석을 과도하게 특정하지 않고 언어적 긴장을 보존합니다.
- issue: ግዘታተ의 번역을 ‘저주’로 할지 ‘맹세/금지’로 할지
  chosen_reading: 본문에서는 ‘저주’로 옮기되, 해제 불가한 선언이라는 성격을 살렸습니다.
  alternative_readings:
  - 맹세
  - 금지 선언
  - 아나테마
  rationale: 개정된 영어 최종본이 ‘curses’로 정리되어 있고, 현대 한국어 독자가 즉시 이해할 수 있는 가장 자연스러운 대응은 ‘저주’입니다.
  doctrine_reference: 가독성과 원문 의미의 균형; 교회 전통어를 기계적으로 고정하지 않음.
