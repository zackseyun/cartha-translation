translation:
  language: ko
  text: 자기 이웃에게 악으로 갚는 자들에게는 화가 있습니다. 이는 여러분이 행한 대로 갚음을 받게 될 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 기즈어 본문은 같은 어근을 앞절의 ‘갚다’와 뒤절의 ‘갚음을 받다’에 반복해, 악을 갚는 행위와 그에 상응하는 보응을 의도적으로 연결합니다.
    reason: source_note
