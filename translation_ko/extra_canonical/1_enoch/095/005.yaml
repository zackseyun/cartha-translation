base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/005.yaml
  text: Woe to you who repay evil to your neighbor, for you will be repaid according to your deeds.
  footnotes:
  - marker: a
    text: 'The same Ge''ez verbal root appears in both clauses: those who ''repay'' evil will themselves ''be repaid.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이웃에게 악을 갚는 여러분에게 화가 있습니다. 이는 여러분이 행한 대로 갚음을 받을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 기즈어 본문은 같은 어근을 앞절의 ‘갚다’와 뒤절의 ‘갚음을 받다’에 반복해, 악을 갚는 행위와 그에 상응하는 보응을 의도적으로 연결합니다.
    reason: source_note
lexical_decisions:
- source_word: አሌ
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 슬픔이 있습니다
  - 아, 화가 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언적·심판적 경고를 나타내는 감탄형으로, 단순한 애도보다 경고의 강도를 살리는 ‘화가 있습니다’를 택했습니다.
- source_word: እኩየ
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 해악
  - 악행
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 도덕적 악과 해악의 성격을 함께 담는 가장 간결한 대응으로 ‘악’을 사용했습니다.
- source_word: ለቢጽክሙ
  english_pob_choice: to your neighbor
  chosen_korean: 자기 이웃에게
  alternatives_korean:
  - 여러분의 이웃에게
  - 동료에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 가까운 관계의 타인을 가리키는 표현으로 ‘이웃’이 가장 자연스럽고, ‘자기’를 더해 배상 행위의 방향성을 분명히 했습니다.
- source_word: ትትፈደዩ / ትፈድዩ
  english_pob_choice: you will be repaid / repay
  chosen_korean: 갚음을 받게 될
  alternatives_korean:
  - 보응을 받게 될
  - 되갚음을 받게 될
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 같은 어근의 반복이 주는 상응성과 보응 구조를 살리기 위해, 앞뒤를 모두 ‘갚다’ 계열로 연결했습니다.
theological_decisions:
- issue: 수동형 보응의 주체를 얼마나 드러낼 것인가
  chosen_reading: 주체를 명시하지 않고, 행한 대로 되갚임을 받는 심판적 수동으로 남겼습니다.
  alternative_readings:
  - 하나님이 직접 갚으신다는 식으로 명시하는 읽기
  - 도덕적 결과의 자동적 반작용으로만 읽는 해석
  rationale: 기즈어 본문과 영어 POB는 주체를 드러내지 않는 수동적 보응 공식을 유지하므로, 한국어도 그 긴장을 보존했습니다.
  doctrine_reference: 심판의 주체를 단정하지 않고 문맥의 경고 기능을 살립니다.
