translation:
  language: ko
  text: 누가 너희에게 미워함과 악을 행하도록 허락하였습니까? 그리고 정죄가 너희 죄인들에게 닥칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 죄인들에게’는 원문의 죄인 지칭을 직접 살린 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: መኑ
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 어떤 이가
  - 누가 도대체
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수사적 책망의 첫머리이므로 간결한 의문사 ‘누가’로 직접적인 질책의 힘을 살렸습니다.
- source_word: ወሀበክሙ
  english_pob_choice: has allowed you
  chosen_korean: 너희에게 허락하였습니까
  alternatives_korean:
  - 너희에게 주었습니까
  - 너희에게 허가하였습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 ‘주다’가 여기서는 행위의 허용·승인을 묻는 책망적 질문으로 기능하므로, 한국어에서는 자연스럽고 의미가 분명한 ‘허락하다’로 옮겼습니다.
- source_word: ጽልአ ወእኩየ
  english_pob_choice: hatred and evil
  chosen_korean: 미워함과 악
  alternatives_korean:
  - 증오와 악
  - 미움과 악
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ἠ/의 정서적 반감을 뜻하는 말은 ‘미워함’이 동사적 행위성과 도덕적 강도를 함께 드러내며, ‘악’은 원문의 광범위한 도덕적 부정을 보존합니다.
- source_word: ይረከበክሙ
  english_pob_choice: will overtake you
  chosen_korean: 닥칠 것입니다
  alternatives_korean:
  - 너희를 덮칠 것입니다
  - 너희에게 미칠 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 문맥에서 ‘overtake’의 긴박성과 피할 수 없음은 한국어 ‘닥치다’가 가장 간명하게 전달합니다.
- source_word: ለኃጥኣን
  english_pob_choice: you sinners
  chosen_korean: 너희 죄인들에게
  alternatives_korean:
  - 죄인들에게
  - 너희 죄인들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 ለ는 여기서 목적어와의 연계를 나타내는 표지로 읽히며, 문맥상 수신자를 직접 지목하는 앱위지션을 한국어에서는 ‘너희 죄인들에게’로 자연스럽게 드러냈습니다.
- source_word: ኵነኔ
  english_pob_choice: condemnation
  chosen_korean: 정죄
  alternatives_korean:
  - 유죄 선고
  - 심판
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적·선고적 뉘앙스를 지닌 단어이므로, 단순한 ‘심판’보다 결과를 분명히 하는 ‘정죄’가 원문의 책망과 잘 맞습니다.
theological_decisions:
- issue: ‘미워함과 악을 행하다’의 행위성을 어떻게 살릴 것인지
  chosen_reading: 행위로서의 미워함과 악을 병렬시켜, 금지된 구체적 행위를 묻는 책망으로 유지했습니다.
  alternative_readings:
  - ‘증오와 악을 행하다’
  - ‘미움과 악을 하다’
  rationale: 원문은 추상 명사만이 아니라 실제 악행을 겨냥하는 수사적 질문이므로, 한국어에서도 추상화하지 않고 행위의 책임을 선명하게 했습니다.
  doctrine_reference: Apocalyptic rebuke should remain concrete and accusatory rather than moralized into abstraction.
- issue: ‘정죄’와 ‘죄인들’의 결합을 어떻게 처리할 것인지
  chosen_reading: ‘정죄가 너희 죄인들에게 닥칠 것입니다’로 두 요소를 함께 살렸습니다.
  alternative_readings:
  - ‘정죄가 너희에게 닥칠 것입니다’
  - ‘너희 죄인들에게 정죄가 닥칠 것입니다’
  rationale: POB의 문맥상 심판은 일반적 경고가 아니라 죄인들에게 임하는 판결이므로, 대상 지칭을 유지해 도덕적·법정적 긴장을 보존했습니다.
  doctrine_reference: Preserve apocalyptic judgment formulas and direct address without softening the verdict.
