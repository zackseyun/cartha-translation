base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/001.yaml
  text: And they call the first wind the eastern one, because it is the first; and they call the second the south, because the Most High descends there, and there especially the Blessed One descends forever.
  footnotes:
  - marker: a
    text: The wording of the second half is difficult. The Ge'ez appears to say that the south is so called because 'the Most High descends there,' with an added intensifying phrase before the closing doxology.
    reason: textual_variant
  - marker: b
    text: '''The eastern one'' is literally a term related to dawn or morning, used here for the eastern direction.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he descends, blessed forever'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 첫째 바람을 동풍이라고 부릅니다.[a] 그것이 첫째이기 때문입니다. 또 둘째 바람을 남풍이라고 부릅니다. 지극히 높으신 분이 그곳에 내려오시고, 그곳에서 특별히 복되신 분이 영원히 내려오시기 때문입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘동풍’은 직역하면 ‘새벽/아침의 것’에 가까운 형용사에서 나온 방향 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절의 후반부는 게으즈 원문이 다소 난해합니다. 여기서는 남풍이라는 명칭의 이유를, 지극히 높으신 분이 그곳에 내려오시며 특히 복되신 분이 영원히 내려오신다는 말로 읽었습니다.
    reason: textual_variant
  - marker: c
    text: ‘복되신 분’은 단순한 수식어가 아니라, 두 번째 ‘내려오시다’의 주어가 되는 독립된 호칭으로 읽을 수 있습니다.
    reason: theological_note
