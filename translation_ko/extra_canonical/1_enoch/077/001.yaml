  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 독립된 서술적 호칭이므로 형용사적 ‘복되신’보다 주어적 호칭이 드러나는 ‘복되신 분’을 사용했습니다.
