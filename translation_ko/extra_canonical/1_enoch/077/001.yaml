  rationale: 강조 부사가 정확히 확정되진 않지만, 반복된 ‘거기’를 살리면서 의미를 과장하지 않는 ‘특별히’가 가장 보수적입니다.
theological_decisions:
- issue: 지극히 높으신 분과 복되신 분을 자연현상 속 방향 설명으로 완화할지, 본문이 가진 신적 하강 이미지를 유지할지
  chosen_reading: 신적 하강 이미지를 그대로 유지했습니다.
  alternative_readings:
  - ‘그곳에 복이 내려온다’ 식의 비인격화
  - ‘하나님이 그곳에 임하신다’ 식의 해석적 정리
  rationale: 게으즈 본문은 명시적으로 ‘내려오시다’라는 동사를 쓰며, 남풍을 신적 현존과 연결합니다. 따라서 자연현상으로 환원하지 않고, 묵시문학적 긴장을 보존했습니다.
  doctrine_reference: 묵시적 우주론의 긴장을 보존하고 해소하지 않음
- issue: ‘복되신 분이 영원히 내려오십니다’의 구조를 보조적 수식으로 볼지, 독립된 호칭+동사 구조로 볼지
  chosen_reading: 독립된 호칭이 다시 한 번 동사와 결합하는 병렬 구조로 보았습니다.
  alternative_readings:
  - ‘영원히 복되신 분’이라는 단순 서술형
  - ‘복되신 채로 내려오십니다’라는 부사적 처리
  rationale: 영문 POB의 최신 교정이 지적하듯, 뒤 절은 단순 형용사 덧붙임보다 ‘복되신 분’이라는 호칭이 ‘내려오시다’의 주어로 기능하는 구조를 드러냅니다.
  doctrine_reference: 문법적 병렬성과 호칭의 신학적 무게를 함께 보존
