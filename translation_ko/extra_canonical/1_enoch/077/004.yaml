base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
  footnotes:
  - marker: a
    text: Or 'days and times and years.' The Ge'ez term rendered 'seasons' can be understood more broadly as appointed times or periods.
    reason: lexical_alternative
  - marker: b
    text: The final clause uses ordinary language for time passing; here it refers to the elapsing of calendrical cycles, not to destruction.
    reason: cultural_note
  - marker: c
    text: Or 'And I saw'.
    reason: previous_rendering
  - marker: d
    text: Or 'pass away'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 땅에 있는 모든 산보다 더 높은, 높이 솟은 산 일곱을 보았습니다. 그 산들에서 서리가 나오며, 날들과 절기들과 해가 지나갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 시간 명사들은 ‘날들과 때들과 해’로도 옮길 수 있습니다. 여기서는 달력적 구분을 더 분명히 드러내기 위해 ‘절기들’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 소멸이 아니라 시간의 경과를 뜻합니다.
    reason: cultural_note
