base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
  footnotes:
  - marker: a
    text: Or 'days and times and years.' The Ge'ez term rendered 'seasons' can be understood more broadly as appointed times or periods.
    reason: lexical_alternative
  - marker: b
    text: The final clause uses ordinary language for time passing; here it refers to the elapsing of calendrical cycles, not to destruction.
    reason: cultural_note
  - marker: c
    text: Or 'And I saw'.
    reason: previous_rendering
  - marker: d
    text: Or 'pass away'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 땅에 있는 모든 산보다 더 높은 일곱 높은 산을 보았습니다. 그리고 그 산들에서 서리가 나와, 날들과 절기들과 해가 지나갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 시간명사들은 ‘날들과 때들과 해’로도 옮길 수 있습니다. 여기서는 달력적 구분을 더 분명히 드러내기 위해 ‘절기들’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 소멸이 아니라 시간의 경과를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓተ
  english_pob_choice: seven
  chosen_korean: 일곱
  alternatives_korean:
  - 칠
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상적 수를 자연스럽고 직설적으로 살리기 위해 현대 한국어의 ‘일곱’을 썼습니다.
- source_word: አድባረ ነዋኃነ
  english_pob_choice: high mountains
  chosen_korean: 높은 산
  alternatives_korean:
  - 고산
  - 높이 솟은 산
  - 높은 산들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 형용사 ‘높은’이 산의 지형적 높이를 가장 분명히 드러내며, 비교 문맥과도 자연스럽게 맞습니다.
- source_word: እለ ይነውሑ እምኵሉ አድባር እለ ውስተ ምድር
  english_pob_choice: which are higher than all the mountains that are on the earth
  chosen_korean: 땅에 있는 모든 산보다 더 높은
  alternatives_korean:
  - 세상에 있는 모든 산보다 더 높은
  - 땅 위의 모든 산보다 더 높은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비교 구문을 한국어의 ‘~보다 더 높은’으로 직역에 가깝게 살려, 지상 전체를 아우르는 비교를 유지했습니다.
- source_word: አሰሐትያ
  english_pob_choice: frost
  chosen_korean: 서리
  alternatives_korean:
  - 성에
  - 한기
  - 얼음기운
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기상 현상으로서의 냉기/서리의 이미지를 가장 간결하게 전달하는 한국어가 ‘서리’입니다.
- source_word: መዋዕለ ወዘመን ወዓመት
  english_pob_choice: days and seasons and years
  chosen_korean: 날들과 절기들과 해
  alternatives_korean:
  - 날들과 때들과 해
  - 날들과 시간들과 해
  - 날들과 계절들과 해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 ‘seasons’는 단순한 계절보다 예정된 시기·절기까지 넓게 비칠 수 있어, 달력적 구분을 드러내는 ‘절기들’이 더 적절합니다.
theological_decisions:
- issue: 시간의 흐름을 나타내는 마지막 절의 의미
  chosen_reading: 이 구절은 산에서 서리가 나오고, 그와 함께 날들·절기들·해가 흘러간다는 환시적 시간 질서를 말합니다.
  alternative_readings:
  - 산이 시간을 지배하는 우주론적 원인으로 제시된다는 읽기
  - 단순히 자연 현상과 시간 경과를 병렬로 놓는 읽기
  rationale: 원문은 인과를 과도하게 설명하지 않고 자연 현상과 달력적 시간의 흐름을 나란히 배치하므로, 그 긴장을 그대로 유지했습니다.
  doctrine_reference: 환시적 우주론의 긴장 보존
