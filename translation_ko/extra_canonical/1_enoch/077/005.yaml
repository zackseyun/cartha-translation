  rationale: 강의 물이 바다로 들어가는 수문학적 이미지를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: ‘Great Sea’를 고유 지리명으로 볼지 일반적 표현으로 볼지
  chosen_reading: 큰 바다
  alternative_readings:
  - 대해
  - 큰 바다(지리명 가능성 주석)
  rationale: 이 절은 우주적·지리적 환상 묘사 속에 있으며, 원문 자체는 고유명 여부를 단정하지 않습니다. 본문에서는 의미를 과도하게 특정하지 않고 원문 대비를 살려 번역했습니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 범위 내에서 의미를 보존하고, 단정되지 않은 지리적 식별은 본문에서 과잉 확정하지 않습니다.'
