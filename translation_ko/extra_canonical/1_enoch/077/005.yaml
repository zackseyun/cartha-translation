  text: And I saw seven rivers upon the earth[a], greater than all the rivers[b]; and one of them comes from the west and pours its waters into the Great Sea.
  footnotes:
  - marker: a
    text: Or 'into the great sea.' The phrase may be read either as a geographic designation ('the Great Sea') or as a descriptive expression.
    reason: lexical_alternative
  - marker: b
    text: Or 'And I saw rivers upon the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 땅 위에 일곱 강을 보았는데, 모든 강보다 더 컸습니다. 그리고 그중 하나는 서쪽에서 와서 그 물을 큰 바다로 흘려보냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 바다로.’ 이 구절은 지리적 고유명(‘큰 바다’)으로도, 단순한 묘사(‘큰 바다’)로도 읽힐 수 있습니다.
    reason: alternative_reading
