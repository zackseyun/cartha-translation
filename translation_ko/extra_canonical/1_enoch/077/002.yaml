base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/002.yaml
  text: And the wind from the west is named Hegulā[b][a], because there all the lights of heaven fade and go down.
  footnotes:
  - marker: a
    text: Or 'all the luminaries of heaven are extinguished and descend.' The verb may denote being effaced or obscured, and 'go down' likely refers to their setting in the west.
    reason: lexical_alternative
  - marker: b
    text: Or 'are blotted out'.
    reason: previous_rendering
translation:
  language: ko
  text: 서쪽에서 부는 바람은 헤굴라라고 불리는데, 그곳에서는 하늘의 모든 빛이 희미해지고[a] 내려가기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘희미해지다’로 옮긴 동사는 ‘줄어들다, 쇠하다, 희미해지다’의 범위를 가질 수 있습니다. 따라서 ‘하늘의 모든 빛이 쇠퇴하고 내려간다’로도 옮길 수 있습니다.
    reason: lexical_alternative
