  yaml_path: translation/extra_canonical/1_enoch/077/006.yaml
  text: And the two of them come from the west as far as the sea[d][c][b][a], and they pour out their waters into the Erythraean Sea in the east.
  footnotes:
  - marker: a
    text: Literally 'from noon'; in geographical description this likely means 'from the south.'
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez reads 'the sea of Erythra/Red Sea, east.' This may refer to the Red Sea or a broader 'Erythraean Sea' conception in ancient geography.
    reason: cultural_note
  - marker: c
    text: Or 'from noon'.
    reason: previous_rendering
  - marker: d
    text: Or 'into the eastern sea'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 둘은 서쪽에서 바다까지 오며, 그 물을 동쪽의 에리트라 해로 쏟아부읍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에리트라 해’는 고대 지리 개념으로, 문맥상 홍해 또는 더 넓은 ‘에리트라 해’ 권역을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 원문은 바다의 도달 지점과 물의 방출을 이어 말하여, 강의 흐름이 바다로 흘러들어감을 강조합니다.
    reason: source_note
