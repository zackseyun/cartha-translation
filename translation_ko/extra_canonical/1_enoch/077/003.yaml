theological_decisions:
- issue: ‘북풍’의 명칭 처리
  chosen_reading: 원문의 이름-구문을 한국어에서 의미가 드러나는 방향으로 풀어 ‘이름이 북풍’으로 옮겼습니다.
  alternative_readings:
  - 음역하여 ‘메스’로 둘 것
  - ‘메스’라는 이름이라고만 둘 것
  rationale: 이 절은 바람의 명칭을 제시하는 기능이 핵심이므로, 한국어 독자가 곧바로 방향-명칭 관계를 이해하도록 했습니다. 다만 원문 고유명칭의 음역 가능성은 주석으로 열어 둘 수 있습니다.
  doctrine_reference: 이사야/에녹 문헌의 우주론적 묘사로 이해하며, 교리적 정합성보다 본문 고유 이미지를 우선합니다.
- issue: ‘의의 동산’의 범주
  chosen_reading: 에덴이나 낙원으로 특정하지 않고, 원문의 표현을 그대로 보존했습니다.
  alternative_readings:
  - 에덴
  - 낙원
  rationale: 원문이 그 정체를 명시하지 않으므로, 후대 전통적 동일시를 본문에 주입하지 않고 열린 상태로 남겨 두는 것이 적절합니다.
  doctrine_reference: 의도된 긴장을 보존하고, 상호본문적 연상은 독자가 판단하도록 둡니다.
