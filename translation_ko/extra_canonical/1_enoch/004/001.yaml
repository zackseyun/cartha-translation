revisions:
- from: 그리고 다시, 여름의 날들을 살펴보십시오. 해가 그것의 시작에 그것 위에 이르러, 해의 열기 때문에 여러분은 피할 곳과 그늘을 찾게 되며, 땅은 타는 열로 그슬리고, 그 열기 때문에 여러분은 땅도 바위도 밟을 수 없습니다.[a][b][c]
  to: 또 여름날들을 살펴보십시오.[a] 여름이 시작될 때 해가 그 위에 비치는 모습을 보십시오. 해의 열기 때문에 여러분은 피할 곳과 그늘을 찾으며,[b] 땅은 타는 열로 그슬립니다. 그 열기 때문에 여러분은 땅이나 바위 위를 밟고 다닐 수 없습니다.[c]
  rationale: 원문의 계절적 관찰, 햇볕의 열기, 피난처와 그늘의 병렬, 땅과 바위를 밟지 못할 만큼의 열기라는 모든 요소를 유지했습니다. 난해한 해-여름 구절은 한국어에서 이해 가능한 최소한의 표현으로 다듬되, 해석의 불확실성은 각주에서 명시했습니다. 문장을 분리하고 각주 표지를 관련 어구에 배치하여 현대 한국어의 자연스러움과 주석 연결을 개선했습니다.
