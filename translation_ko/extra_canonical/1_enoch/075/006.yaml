  text: When the twelve other portals in heaven[a], at the ends of the earth, are opened[c][b], from which the sun and the moon and the stars come out.
  footnotes:
  - marker: a
    text: Or 'portals' or 'windows'; the Ge'ez term denotes apertures in the heavenly structure.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'ends of the earth' reflects ancient cosmological imagery, not a modern scientific description.
    reason: cultural_note
  - marker: c
    text: Or 'Then there are twelve other openings'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘에 있는, 땅의 끝[b]에 자리한 열두 관문[a]이 열리면, 해와 달과 별들이 그 관문들에서 나옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관문’은 ‘창’ 또는 ‘개구부’로도 옮길 수 있습니다. 이 말은 하늘 구조 안의 틈이나 출구를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅의 끝’은 현대 과학적 지리 설명이 아니라 고대의 우주론적 표현입니다.
    reason: cultural_note
