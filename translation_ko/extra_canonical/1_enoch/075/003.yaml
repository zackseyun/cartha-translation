theological_decisions:
- issue: 천체를 단순한 천문 현상으로 평면화할지, 우주적 질서의 주재자로 살릴지
  chosen_reading: 천체들이 ‘다스리고’ ‘인도자가 되게’ 하는 우주적 역할을 유지했습니다.
  alternative_readings:
  - 그들이 하늘을 가로질러 움직이고 낮과 밤을 표시한다
  - 그들이 단지 시간 계산의 표지가 된다
  rationale: 원문은 천체를 능동적으로 배열된 우주 질서의 담당자로 묘사하므로, 그 인격화·우주론적 긴장을 그대로 남겨 두었습니다.
  doctrine_reference: 묵시 문학의 우주적 상징과 질서 언어를 평범한 과학적 서술로 환원하지 않음
- issue: ‘하늘의 병거들’ 이미지를 해석적 용어로 바꿀지 여부
  chosen_reading: 주석 없이 본문에는 ‘하늘의 모든 병거들’ 이미지를 유지했습니다.
  alternative_readings:
  - 하늘의 모든 궤도들
  - 하늘의 모든 순환들
  rationale: 원문 비유를 지워 버리면 묵시적 상상력이 약해지므로, 기능적 의미는 독자가 떠올리도록 두고 이미지는 보존했습니다.
  doctrine_reference: 원문 이미지 보존 우선 원칙
