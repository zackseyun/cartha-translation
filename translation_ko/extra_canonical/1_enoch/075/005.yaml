base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/005.yaml
  text: and for the winds[a], and for the spirit of dew[c][b], when the openings are opened in heaven at the ends.
  footnotes:
  - marker: a
    text: The phrase rendered 'spirit of dew' is lexically difficult and could also be understood more physically, such as 'breath of dew' or a dew-bearing wind.
    reason: lexical_alternative
  - marker: b
    text: The bracketed clause in the source witness appears textually uncertain; 'openings' may also be rendered 'windows' or 'vents' of heaven.
    reason: textual_variant
  - marker: c
    text: Or 'when their openings are opened in the heavens'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 바람들과 이슬의 영[a]을 위하여, 하늘의 끝들에 있는 개구부들이 열릴 때에[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이슬의 영’은 어휘적으로 난해한 표현이며, 더 물리적인 의미로 ‘이슬의 숨’ 또는 이슬을 실어 나르는 바람으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 괄호 친 이 절은 전승상 본문이 불확실합니다. ‘개구부들’은 ‘창문들’이나 ‘통풍구들’로도 옮길 수 있습니다.
    reason: textual_variant
  - marker: c
    text: 직역하면 ‘하늘에서, 그 끝들에 개구부들이 열릴 때에’입니다. 원문에는 ‘그들의 개구부들’이라는 소유 표현이 없습니다.
    reason: alternative_rendering
