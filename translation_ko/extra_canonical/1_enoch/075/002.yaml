base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/002.yaml
  text: 'And because of them people go astray concerning them[a], for these lights render service at the stations of the world in righteousness: one in the first portal, and one in the third portal of heaven, and one in the fourth portal, and one in the sixth portal[e][d][c][b]; and the careful ordering of the world is completed in three hundred and sixty-four stations of the world.'
  footnotes:
  - marker: a
    text: Or 'people err because these lights shift their places rightly.' The line contrasts human misunderstanding with the ordered regularity of the luminaries.
    reason: lexical_alternative
  - marker: b
    text: The closing clause is difficult. It likely refers to the Enochic schematic year of 364 ordered positions or days; the Ge'ez wording speaks more literally of the world's precise ordering being completed in 364 'stations.'
    reason: alternative_reading
  - marker: c
    text: Or 'change their stations'.
    reason: previous_rendering
  - marker: d
    text: Or 'and two in the third portal of heaven, and two in the fourth portal, and two in the sixth portal'.
    reason: previous_rendering
  - marker: e
    text: Or 'among them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 때문에 사람들이 그들에 관하여 그릇되게 판단합니다[a]. 이 빛들은 의롭게 세상의 자리들을 바꿉니다. 하나는 첫째 문에, 둘은 하늘의 셋째 문에, 둘은 넷째 문에, 또 둘은 여섯째 문에 있습니다. 그리고 세상의 정확한 질서는 세상의 364개의 자리에서 완성됩니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들이 그들 안에서/그들로 말미암아 길을 잃는다.’ 여기의 전치사구는 해석이 어려우나, 문맥상 빛들에 관한 인간의 잘못된 판단을 가리키는 것으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 해석이 어렵습니다. 364는 에녹서의 364일 연간 도식과 관련될 수 있으나, 본문은 더 문자적으로 ‘세상의 364개의 자리’라고 말합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ይጌግዩ
  english_pob_choice: go astray
  chosen_korean: 잘못 헤매게 되다
  alternatives_korean:
  - 잘못되다
  - 오해하다
  - 방황하다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 사람들의 인식 오류와 계산상의 혼동을 함께 살리기 위해, 단순한 ‘오해하다’보다 ‘잘못 헤매다’가 문맥의 어긋남과 방황성을 함께 전달합니다.
- source_word: ቦሙ
  english_pob_choice: concerning them
  chosen_korean: 그들에 관해
  alternatives_korean:
  - 그들 가운데
  - 그들 안에서
  - 그들 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본적으로 ‘~에 관해/대해’의 의미를 살려, 사람들이 천체 자체에 대한 이해에서 오류를 범한다는 점을 드러냅니다.
- source_word: በጽድቅ
  english_pob_choice: in righteousness
  chosen_korean: 의롭게
  alternatives_korean:
  - 의 안에서
  - 정확하게
  - 올바르게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 ‘의/공의’ 어휘를 보존하되, 한국어에서는 서술 부사 ‘의롭게’로 옮겨 천체의 질서 있는 봉사라는 의미를 자연스럽게 살렸습니다.
- source_word: መንበረ ዓለም
  english_pob_choice: stations of the world
  chosen_korean: 세상의 자리들
  alternatives_korean:
  - 세상의 역
  - 세상의 정거장들
  - 세계의 자리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 고정된 우주적 위치를 가리키므로, ‘자리들’로 옮겨 반복되는 정착점/배치의 이미지를 살렸습니다. 마지막의 반복도 같은 표현으로 유지했습니다.
- source_word: ቀዳሚ ኆኅት / ሣልስ ኆኅት / ራብዕ ኆኅት / ሳድስ ኆኅት
  english_pob_choice: the first portal / the third portal of heaven / the fourth portal / the sixth portal
  chosen_korean: 첫째 문 / 하늘의 셋째 문 / 넷째 문 / 여섯째 문
  alternatives_korean:
  - 첫째 관문
  - 첫째 문간
  - 첫째 게이트
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 하늘 문/관문 도식을 유지하되, 현대 한국어에서는 ‘문’이 가장 직접적이고 자연스러워 선택했습니다.
theological_decisions:
- issue: በጽድቅ의 의미를 천문학적 질서로 살릴지 여부
  chosen_reading: ‘의롭게’로 옮기되, 천체의 질서 있는 봉사를 뜻하도록 문장 전체를 구성했습니다.
  alternative_readings:
  - 정확하게
  - 올바르게
  - 질서 있게
  rationale: 본문은 단순한 기계적 운행이 아니라 우주가 하나님이 정하신 의로운 질서 안에서 움직인다는 에녹서적 색채를 지니므로, ‘의롭게’가 그 신학적 뉘앙스를 보존합니다.
  doctrine_reference: Translation philosophy §Preserve theological tension rather than resolve it
- issue: 마지막 364의 의미
  chosen_reading: ‘세상의 364개의 자리’로 옮겨, 세계의 정확한 질서가 364라는 수로 완결된다는 점을 유지했습니다.
  alternative_readings:
  - 364일
  - 364개의 부분
  - 364개의 정거장
  rationale: 문맥은 에녹서의 364일 도식과 연결되지만, 원문 자체는 ‘자리들’(stations)이라는 표현을 사용하므로 수적-공간적 질서를 함께 남기는 번역이 가장 근접합니다.
  doctrine_reference: Original-language primacy over translation tradition
