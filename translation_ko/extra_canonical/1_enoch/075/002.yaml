  source_fidelity: 개역이 필요합니다. 게에즈어의 ይትቀየዩ는 빛들이 ‘섬긴다’기보다 자리들을 바꾸거나 옮긴다는 뜻이며, 본문의 수사 표기는 첫째 문에 하나, 셋째·넷째·여섯째 문에 각각 둘을 명시합니다. 초안은 이를 각각 하나로 축소하여 원문 수량을 반영하지 못합니다.
  naturalness: ‘잘못 헤매게 되는데’는 현대 한국어에서 부자연스럽고, ‘의롭게 섬깁니다’도 천체 운행 문맥에서 원문의 동사와 맞지 않습니다. ‘그릇되게 판단합니다’와 ‘의롭게 … 자리를 바꿉니다’가 합쇼체로 자연스럽고 원문의 반복도 보존합니다.
  terminology: ‘빛들’, ‘하늘의 … 문’, ‘세상의 자리’, ‘의롭게’, ‘정확한 질서’는 유지할 수 있습니다. ‘문’은 이 문맥의 portal에 적절합니다. 최종 364는 원문의 ‘자리’ 표현을 보존하되, 어려운 구절이라는 점을 각주에서 밝혀야 합니다.
  issues:
  - severity: high
    issue: 빛들의 행위를 ‘의롭게 섬깁니다’로 번역함
