base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
  footnotes:
  - marker: a
    text: The Ge'ez word rendered 'light' is difficult and may more literally suggest 'feet' or, by extension in context, something like the sun's outgoing rays or beams.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''And Uriel showed me another law: the courses of the chariots of the sun in the sky, from which its light goes out''.'
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이 우리엘이 하늘에 있는 해의 수레바퀴 둘레의 열두 개의 개구를 내게 보여 주었는데, 그곳에서 해의 광선이 나가고, 그것들이 정해진 계절에 열릴 때 그곳에서 따뜻함이 땅 위로 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 어형은 문자적으로 ‘발’ 또는 그 연장된 의미를 가리킬 수 있으나, 문맥상 태양의 광선으로 이해하는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ከመዝ ፲ሥሩ ወካልእ
  english_pob_choice: another law
  chosen_korean: 이와 같이
  alternatives_korean:
  - 또 다른 법으로
