  lexicon: Dillmann, Lexicon Linguae Aethiopicae; English POB revision note
  rationale: 현전 수정본은 본문을 ‘열두 개의 개구’로 복원하므로, OCR 오독에 기대었던 ‘another law’는 따르지 않고 연결 부사로 처리했습니다.
- source_word: በአበበ ሰረገላት ፀሐይ
  english_pob_choice: the chariots of the sun
  chosen_korean: 해의 수레바퀴
  alternatives_korean:
