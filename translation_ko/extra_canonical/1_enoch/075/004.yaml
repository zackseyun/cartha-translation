base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
  footnotes:
  - marker: a
    text: The Ge'ez word rendered 'light' is difficult and may more literally suggest 'feet' or, by extension in context, something like the sun's outgoing rays or beams.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''And Uriel showed me another law: the courses of the chariots of the sun in the sky, from which its light goes out''.'
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이 우리엘이 하늘에 있는 해의 수레들이 도는 궤도 안의 열두 개의 개구부를 내게 보여 주었습니다. 그 개구부들에서 해의 광선[a]이 나오며, 그 개구부들이 정해진 계절에 열릴 때 그곳에서 온기가 땅 위로 퍼집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어의 이 어형은 문자적으로 ‘발’을 뜻할 수도 있습니다. 문맥상으로는 태양에서 뻗어 나오는 광선 또는 빛을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ከመዝ ፲ሥሩ ወካልእ
  english_pob_choice: another law
  chosen_korean: 이와 같이
  alternatives_korean:
  - 또 다른 법으로
  - 또 하나의 규례를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae; English POB revision note
  rationale: 현전 수정본은 본문을 ‘열두 개의 개구’로 복원하므로, OCR 오독에 기대었던 ‘another law’는 따르지 않고 연결 부사로 처리했습니다.
- source_word: በአበበ ሰረገላት ፀሐይ
  english_pob_choice: the chariots of the sun
  chosen_korean: 해의 수레바퀴
  alternatives_korean:
  - 해의 수레
  - 해의 전차
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체의 운동을 가리키는 상징적 기구이므로, 과도하게 군사적 뉘앙스를 띠는 ‘전차’보다 우주적 구조를 드러내는 ‘수레바퀴’로 옮겼습니다.
- source_word: እገሪሃ ለፀሐይ
  english_pob_choice: from which the rays of the sun go out
  chosen_korean: 해의 광선이 나가고
  alternatives_korean:
  - 해의 발이 나가고
  - 해의 빛이 나가고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae; English POB lexical note a
  rationale: 게에즈 어형은 문자적으로 ‘발’에 가깝지만, 문맥상 태양의 발산물은 광선이므로 의미를 살려 ‘광선’으로 번역했습니다.
- source_word: ሞቅ
  english_pob_choice: warmth
  chosen_korean: 따뜻함
  alternatives_korean:
  - 더위
  - 열기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지면에 미치는 효과를 자연스럽게 드러내면서도 지나치게 강한 ‘열기’보다 중립적인 표현을 택했습니다.
- source_word: በአዝማን እለ እሙራን ሎሙ
  english_pob_choice: in the seasons appointed for them
  chosen_korean: 정해진 계절에
  alternatives_korean:
  - 그들에게 지정된 때에
  - 그들을 위해 정해진 시기에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정해진 천체 질서를 강조하는 표현이므로, 시기보다 계절성을 살려 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 우주론적 이미지 보존
  chosen_reading: 태양의 ‘수레바퀴’와 ‘개구’라는 구체적 우주론 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 현대적 천문 설명처럼 단순화하기
  - 비유적 표현으로만 처리하기
  rationale: 이 본문은 천상 질서를 묘사하는 묵시문학적 시각을 드러내므로, 현대적 과학 언어로 평탄화하지 않고 본문이 말하는 세계관을 보존하는 것이 적절합니다.
  doctrine_reference: '번역 원칙: 묵시문학의 시각적·우주론적 이미지를 보존한다.'
