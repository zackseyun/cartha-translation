  source_fidelity: 초안은 መራሕያኒሆሙ와 አርእስተ አእላፍ의 계층 관계를 ‘천천부의 우두머리들’로 잘못 처리했고, 주어들을 접속하여 원문의 구문을 흐렸습니다. 또한 ‘더해졌으나’의 관계절은 ‘그 네 개’를 수식해야 합니다. 수정문은 ‘천부장들의 지도자들’이라는 다소 낯선 표현으로 원문의 중층적 계층 관계를 보존하고, 관계절의 수식 범위를 분명히 했습니다.
  naturalness: ‘천천부(千千部)’는 현대 한국어에서 자연스럽지 않고 원문의 ‘천 명 단위의 우두머리들’을 뜻하지도 않습니다. ‘천부장들의 지도자들’은 문체상 다소 무겁지만 고대 천상 행정 체계의 표현으로 이해 가능하며, 합쇼체 서술에 맞습니다. ‘한 해의 계산’은 달력 문맥에서 자연스럽게 ‘해의 계산’으로 다듬었습니다.
  terminology: ፍጥረት은 ‘피조물’로, ምግባር은 우주 질서 안의 맡은 기능이라는 뜻에서 ‘직무’로 옮겼습니다. ይትቀየዩ는 의미가 확정적이지 않으므로 본문에서는 ‘직무를 수행합니다’로 절제하고, ‘차례로 맡다/번갈아 기능하다’ 가능성은 각주로 남겼습니다. ‘그 넷’은 마지막의 ‘네 날’과 관련되지만 그 정체를 본문에서 단정하지 않았습니다.
  issues:
