    issue: ‘천천부(千千部)의 우두머리들’은 원문의 계층 표현을 잘못 번역합니다.
    rationale: አርእስተ አእላፍ은 ‘천 명 단위의 우두머리들/천부장들’이며, 앞선 መራሕያኒሆሙ는 그들의 지도자들을 가리킵니다. ‘천천부’는 ‘thousands of thousands’라는 뜻으로 읽혀 원문에 없는 수량을 도입합니다.
  - severity: high
    issue: 초안의 ‘…우두머리들[a]과, 모든 창조물과… 이들, 그리고… 그 네 개는’은 원문의 주어와 관계절 구조를 접속 구조로 바꿉니다.
