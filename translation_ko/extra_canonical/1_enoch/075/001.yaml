base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/001.yaml
  text: And the leaders of the heads of thousands[a], who are over all creation and over all the stars, together with those four that are added and do not separate from their service[e][d][c][b], according to the reckoning of the year—and these render service on the four days that are not counted in the reckoning of the year.
  footnotes:
  - marker: a
    text: Or 'are joined' instead of 'are added'; the Ge'ez can suggest attachment to the ordered system of the year.
    reason: lexical_alternative
  - marker: b
    text: The 'four days that are not counted' are the extra calendrical days associated with the turning points of the year in the Astronomical Book's 364-day scheme.
    reason: cultural_note
  - marker: c
    text: The verb rendered 'render service' is difficult and may also carry the sense of taking turns or alternating in function.
    reason: lexical_alternative
  - marker: d
    text: Or 'And their leaders, the chiefs of thousands'.
    reason: previous_rendering
  - marker: e
    text: Or 'together with those four, are added and do not separate'.
    reason: previous_rendering
translation:
  language: ko
  text: 천천부(千千部)의 우두머리들[a]과, 모든 창조물과 모든 별들 위에 있는 이들, 그리고 더해졌으나 그들의 직무에서 떠나지 않는 그 네 개[b][c][d][e]는 한 해의 계산에 따라 있으며 — 이들은 한 해의 계산에 포함되지 않는 네 날에 직무를 수행합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천부(千部)의 우두머리들’처럼 옮길 수 있습니다. 원문의 ‘heads of thousands’는 문자적으로는 ‘수천의 머리들/우두머리들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 ‘네 날’은 364일 체계의 계절 전환점에 놓인 추가 달력일들을 가리키는 것으로 이해됩니다.
    reason: cultural_note
  - marker: c
    text: 원문의 동사는 ‘섬기다’ 외에 ‘차례로 맡다, 번갈아 기능하다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그 네 개, 곧 더해졌으나 떠나지 않는 것들’로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: e
    text: 관계절이 ‘네 개’에 붙어 있으므로, ‘더해졌으나’는 천상 관리가 아니라 그 네 개를 수식한다고 보는 것이 더 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: መራሕያኒሆሙ
  english_pob_choice: their leaders
  chosen_korean: 우두머리들
  alternatives_korean:
  - 인도하는 자들
  - 지도자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지배적·조직적 관계를 드러내는 ‘leaders’를 살리면서, 천상 질서의 계층성을 자연스럽게 보이게 했습니다.
- source_word: አርእስተ አእላፍ
  english_pob_choice: the chiefs of thousands
  chosen_korean: 천천부(千千部)의 우두머리들
  alternatives_korean:
  - 수천의 우두머리들
  - 천 명의 우두머리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역 성격의 ‘heads of thousands’를 유지하되, 한국어에서 자연스러운 계층 표현으로 풀었습니다. 숫자 단위의 문자적 뉘앙스는 보존했습니다.
- source_word: ዲበ ኵሉ ፍጥረት / ዲበ ኵሉ ከዋክብት
  english_pob_choice: over all creation / over all the stars
  chosen_korean: 모든 창조물과 모든 별들 위에 있는
  alternatives_korean:
  - 온 창조와 모든 별들 위에 있는
  - 모든 피조세계와 모든 별들 위에 있는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 우주적 통치 범위를 그대로 드러내기 위해 ‘위에 있는’ 구조를 유지했습니다. ‘창조물’은 ፍጥረት의 생성된 질서를 반영합니다.
- source_word: ይትዌሰኩ / ኢይትሌለዩ እምነ ምግባሮሙ
  english_pob_choice: are added and do not separate from their service
  chosen_korean: 더해졌으나 그들의 직무에서 떠나지 않는
  alternatives_korean:
  - 더해지며 그 봉사에서 분리되지 않는
  - 추가되었고 그 일에서 벗어나지 않는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘added’는 달력적 부가를, ‘do not separate’는 분리되지 않음을 살려야 해서 ‘더해졌으나 … 떠나지 않는’으로 옮겼습니다. ምግባር은 여기서 ‘봉사’보다 제도적·기능적 성격이 강한 ‘직무’가 더 적합합니다.
- source_word: በከመ ሐሳበ ዓመት / ፬ መዋዐለ እለ ኢይትኃሰቡ
  english_pob_choice: according to the reckoning of the year / the four days that are not counted
  chosen_korean: 한 해의 계산에 따라 / 한 해의 계산에 포함되지 않는 네 날
  alternatives_korean:
  - 해의 셈에 따라 / 셈에 들지 않는 네 날
  - 연도의 계산에 따라 / 계산되지 않는 네 날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 달력 기술어인 ‘reckoning’를 ‘계산’으로 옮겨 구조를 보존했습니다. ‘not counted’는 단순한 ‘셈에 들지 않음’보다 명시적인 ‘포함되지 않는’이 문맥상 분명합니다.
theological_decisions:
- issue: ‘그 네 개’의 정체와 달력적 기능
  chosen_reading: 본문은 ‘더해졌으나 그들의 직무에서 떠나지 않는 그 네 개’라고 하여, 네 존재를 달력에 더해진 요소로 말하면서도 마지막에는 네 날이라고 분명히 하므로, 그 정체를 너무 빨리 단정하지 않고 기능을 유지했습니다.
  alternative_readings:
  - 그 네 개는 천상 관리들이다
  - 그 네 개는 삽입된 달력의 네 날이다
  - 그 네 개는 천상 존재와 네 절기적 날을 함께 가리킨다
  rationale: 에티오피아어는 관계절을 통해 ‘더해진 네 개’를 말한 뒤, 끝에서 ‘네 날’로 다시 특정합니다. 달력 구조와 천상 질서가 함께 작동하는 묵시 문체이므로, 해석을 좁히지 않고 원문의 긴장을 살렸습니다.
  doctrine_reference: 해석적 긴장 보존
- issue: ‘직무’의 선택
  chosen_reading: ‘their service’를 제의적 봉사보다 천체의 규정된 역할로 이해하여 ‘직무’로 옮겼습니다.
  alternative_readings:
  - 봉사
  - 섬김
  - 역할
  rationale: 이 문맥은 종교적 봉사보다 천체의 질서 있는 기능을 말하므로, 제도성과 기능성을 함께 담는 ‘직무’가 가장 안정적입니다.
  doctrine_reference: 문맥 우선 번역
