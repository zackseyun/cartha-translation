- source_word: ነቅዐ ማይ
  english_pob_choice: a spring of water
  chosen_korean: 물의 샘
  alternatives_korean:
  - 물 샘
  - 물의 우물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 물의 원천이라는 이미지가 중요하므로, 관용적으로 읽히는 ‘물의 샘’을 택했습니다.
- source_word: በላዕሌሁ ብርሃን
