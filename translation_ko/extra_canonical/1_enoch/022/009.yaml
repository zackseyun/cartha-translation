  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 압축된 어순을 한국어에서는 자연스럽게 풀어 주되, 빛이 샘 위에 있다는 공간적 배치를 보존했습니다.
theological_decisions:
- issue: 죽은 자와 의인의 영을 위한 분리된 장소의 표현
  chosen_reading: 세 개의 공간/구획이 죽은 자들의 영과 의인들의 영을 구분하도록 만들어졌다는 공간적 진술로 읽었습니다.
  alternative_readings:
  - 단순히 세 가지가 존재한다는 진술
  - 영혼 상태의 상징적 묘사
  rationale: 문맥상 이 장면은 지하 세계의 실재적 구획들을 보여 주는 비전이므로, 추상화하기보다 분리된 장소라는 공간적 이미지를 살렸습니다.
  doctrine_reference: Book context; Translation philosophy §3
