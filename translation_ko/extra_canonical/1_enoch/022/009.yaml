  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사의 연속을 한국어에서도 자연스럽게 살리되, 합쇼체 서술에 맞게 압축했습니다.
- source_word: ፫ትገብሩ
  english_pob_choice: These three have been made
  chosen_korean: 이 세 개는 만들어졌습니다
  alternatives_korean:
  - 이 셋은 만들어졌습니다
  - 이 세 구획은 만들어졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 핵심은 ‘셋’이라는 수와 ‘만들어지다’라는 수동·결과적 의미이므로, 공간적 맥락을 유지하되 과도한 해석인 ‘구획’을 본문에 넣지는 않았습니다.
- source_word: ይትፈለጠ / ተፈልጠ
  english_pob_choice: might be separated / has been made a division
  chosen_korean: 분리되게 하려고 / 분리가 이루어졌습니다
  alternatives_korean:
  - 나뉘게 하려고 / 나뉨이 이루어졌습니다
