  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 መንፈስ은 이 비전문맥에서 ‘영’이 가장 직접적이며, 후기 신학 용어인 ‘혼’보다 원문 어휘를 더 가깝게 반영합니다.
- source_word: ነቅዐ ማይ
  english_pob_choice: a spring of water
  chosen_korean: 물의 샘
  alternatives_korean:
