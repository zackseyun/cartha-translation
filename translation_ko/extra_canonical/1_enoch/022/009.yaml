base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/009.yaml
  text: And he answered me and said to me[a], “These three have been made so that the spirits of the dead might be separated. And thus a division has been made for the spirits of the righteous, where there is a spring of water[e][d][c][b], with light above it.”
  footnotes:
  - marker: a
    text: 'The Ge''ez repeats the separation language twice: first for ''the spirits of the dead'' generally, then specifically for ''the spirits of the righteous.'' The English preserves this repetition with ''separated'' and ''division.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'a fountain/source of water.' The image is a water-source within the place assigned to the righteous.
    reason: lexical_alternative
  - marker: c
    text: The phrase 'above it light' is terse in the Ge'ez and may describe light resting over the spring or over the righteous division as a whole.
    reason: alternative_reading
  - marker: d
    text: Or 'These three divisions were made'.
    reason: previous_rendering
  - marker: e
    text: Or 'a division has been made'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다[a]. “이 셋은 죽은 자들의 영이 분리되도록 만들어졌습니다. 그리하여 의인들의 영은 이와 같이 분리되었습니다. 그곳에는 물의 샘이 있고, 그 위에는 빛이 있습니다[b][c][d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 원문은 ‘대답하다’와 ‘말하다’를 연속하여 사용합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그 위에 빛’입니다. 한국어에서는 문장을 완결하기 위해 ‘그 위에는 빛이 있습니다’로 옮겼습니다.
    reason: korean_style_note
  - marker: c
    text: ‘물의 샘’은 ‘물의 원천’ 또는 ‘물의 샘물’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 게에즈의 짧은 표현에서 ‘그 위’는 물의 샘을 가리킬 수도 있고, 의인들의 영이 분리된 곳 전체를 가리킬 수도 있습니다.
    reason: alternative_reading
