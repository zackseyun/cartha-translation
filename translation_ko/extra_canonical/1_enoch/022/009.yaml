  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 어근을 한국어에서도 ‘분리’로 유지해, 죽은 자의 영과 의인의 영을 가르는 기능을 분명히 드러냈습니다.
- source_word: መንፈሶሙ
  english_pob_choice: the spirits
  chosen_korean: 영
