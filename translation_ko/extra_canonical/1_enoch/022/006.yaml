base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/006.yaml
  text: At that time I asked Raphael[a], the angel who was with me, and I said to him[c][b], “This spirit whose voice reaches thus and accuses—to whom does it belong?”
  footnotes:
  - marker: a
    text: Or 'whose voice reaches like this and entreats.' The final verb is difficult and may denote supplication or urgent appeal.
    reason: lexical_alternative
  - marker: b
    text: The question asks for the identity of the spirit whose cry is being heard; the next verse identifies it as the spirit of Abel.
    reason: cross_reference
  - marker: c
    text: Or 'At that time I asked Raphael, the angel who was with me, and I said to him, “This spirit whose voice reaches thus and makes petition—whose is it?”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 나는 내와 함께 있던 천사 라파엘에게 물으며 그에게 말하였습니다. "목소리가 이처럼 들려오며 고발하는 이 영은 누구의 것입니까?"
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእቱ ጊዜ
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시각에
  - 그 무렵에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서사적 시간표현을 자연스러운 현대 한국어로 옮기되, 종말론적 장면의 격식을 살리기 위해 간결한 ‘그때에’를 택했습니다.
- source_word: ተስእልክዎ
  english_pob_choice: I asked
  chosen_korean: 물으며
  alternatives_korean:
  - 내가 물었습니다
  - 내가 물어보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 질문 행위를 직접 서술하기보다 앞선 절과 이어지는 서술 흐름을 살려 ‘물으며’로 옮겼습니다.
- source_word: ዘከመዝ ቃሉ ይበጽሕ ወይሰኪ
  english_pob_choice: whose voice reaches thus and accuses
  chosen_korean: 목소리가 이처럼 들려오며 고발하는
  alternatives_korean:
  - 목소리가 이처럼 들려오며 호소하는
  - 목소리가 이처럼 들려오며 탄원하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사군은 단순한 울부짖음보다 법정적 ‘고발/호소’의 뉘앙스를 가지므로, 반복되는 문맥의 준사법적 성격을 살려 ‘고발하는’으로 옮겼습니다.
- source_word: ዝመንፈስ
  english_pob_choice: This spirit
  chosen_korean: 이 영
  alternatives_korean:
  - 이 혼
  - 이 영혼
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 መንፈስ은 기본적으로 ‘영’을 가리키며, 여기서는 죽은 자의 비물질적 존재를 가리키는 표현이므로 ‘영’이 가장 직접적입니다.
theological_decisions:
- issue: 문장의 마지막 질문을 어떻게 한국어로 자연스럽게 살릴지
  chosen_reading: 누구의 것입니까?
  alternative_readings:
  - 누구에게 속합니까?
  - 누구의 소유입니까?
  rationale: 영어 본문이 ‘to whom does it belong?’로 정리한 질문을 따라, 소속/귀속의 의미를 현대 한국어의 자연스러운 질문형으로 옮겼습니다.
  doctrine_reference: 원문 우선과 의미 등가성의 균형
- issue: ወይሰኪ의 법정적 뉘앙스를 어떻게 반영할지
  chosen_reading: 고발하는
  alternative_readings:
  - 탄원하는
  - 간청하는
  rationale: 주변 문맥과 교정 이력을 따라 이 동사를 단순한 간구가 아니라 억울함을 제기하는 법정적 호소로 읽고, 그 긴장을 유지했습니다.
  doctrine_reference: 원어의 사법적 이미지 보존
