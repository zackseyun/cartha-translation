translation:
  language: ko
  text: 여기에서 그들의 영혼은 이 큰 환난 가운데 따로 분리되어 있습니다. 영원히 저주받는 자들[a]을 위한 심판과 형벌과 환난의 큰 날, 곧 그들의 영혼에 내릴 보복의 날이 이를 때까지 그러합니다. 그곳에서 그는 그들을 영원히 묶어 둘 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 동사는 문법적으로 ‘영원히 저주하는 자들’로도 이해될 수 있습니다. 그러나 심판 문맥에서는 ‘영원히 저주받는 자들’이라는 수동적 이해가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 전승에는 ‘그리고 이것은 세상 이전부터’에 해당하는 괄호 구절이 있으나, 본문 확실성이 낮아 본역에는 포함하지 않았습니다.
    reason: textual_variant
