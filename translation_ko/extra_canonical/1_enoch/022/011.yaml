revisions:
- from: 여기서 그들의 영혼은 이 큰 환난 속에 따로 떼어 놓여, 저주받는 자들을 위한 큰 심판과 형벌과 환난의 큰 날까지 있으며, 그들의 영혼에 대한 보복도 있습니다. 거기서 그는 그들을 영원히 묶어 둘 것입니다.[a][b]
  to: 여기에서 그들의 영혼은 이 큰 환난 가운데 따로 분리되어 있습니다. 영원히 저주받는 자들[a]을 위한 심판과 형벌과 환난의 큰 날, 곧 그들의 영혼에 내릴 보복의 날이 이를 때까지 그러합니다. 그곳에서 그는 그들을 영원히 묶어 둘 것입니다.[b]
  rationale: 원문의 분리 상태, 현재의 큰 환난, 장차 이를 심판·형벌·환난 및 영혼들에 대한 보복의 큰 날이라는 관계를 한국어 문장 안에서 명확히 연결했습니다. ‘보복’을 원문처럼 그 큰 날에 속하는 명사적 요소로 처리했으며, ‘그곳에서 그는’이라는 미지정 단수 행위자도 유지했습니다. 수동/능동으로 논쟁 가능한 저주 표현은 본문과 각주를 통해 불확실성을 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:29Z'
review_pass:
  verdict: revise
  source_fidelity: ‘따로 떼어 놓여 … 있으며’는 분리된 영혼들이 그 상태에 놓여 있음을 전달하지만, 문장 구조상 ‘큰 날까지’가 무엇을 수식하는지 다소 불분명합니다. 또한 게에즈의 ወበቀል፡ ለነፍሶሙ는 독립된 행위절이 아니라 심판의 큰 날에 속한 명사적 병렬 요소이므로, 이를 ‘그들의 영혼에 내릴 보복’으로 연결해 반영하는 편이 정확합니다. 논쟁 가능한 ይረግሙ는 본문에서 수동적 이해를 유지하되 각주로 능동 가능성을 보존합니다.
  naturalness: 현 초안의 ‘저주받는 자들을 위한 큰 심판과 형벌과 환난의 큰 날까지 있으며’는 수식 관계가 겹쳐 현대 한국어로 다소 무겁고 어색합니다. ‘…의 큰 날이 이를 때까지’라는 구문으로 바꾸면 합쇼체의 문어적 품위를 유지하면서도 의미 관계가 명료해집니다.
  terminology: ‘영혼’, ‘심판’, ‘형벌’, ‘환난’, ‘보복’, ‘묶어 두다’는 문맥에 적절합니다. 다만 ‘따로 떼어 놓여’보다 ‘따로 분리되어’가 피동적 분리·배정이라는 원문의 표현에 더 직접적이며 자연스럽습니다. 행위자의 정체는 원문처럼 ‘그’로 특정하지 않습니다.
  issues:
  - severity: medium
    issue: 심판의 날과 ‘보복’의 문법적 연결이 불명확합니다.
    rationale: 원문에서 ‘보복’은 ‘심판·형벌·환난’과 함께 큰 날에 딸린 명사구입니다. 초안의 독립절 ‘보복도 있습니다’는 뜻을 크게 바꾸지는 않지만 원문의 병렬 구조와 시간적 결속을 약화합니다.
  - severity: medium
    issue: ‘큰 날까지 있으며’의 한국어 수식 구조가 어색합니다.
    rationale: 영혼이 ‘있다’는 상태와 심판·형벌·환난의 큰 날이 한 문장에 중첩되어, ‘까지’의 범위가 즉시 파악되지 않습니다.
  - severity: low
    issue: 어휘 대안 각주의 위치가 해당 어구와 떨어져 있습니다.
    rationale: ‘저주받는 자들’ 직후에 표지를 두면 능동/수동의 어휘적 불확실성이 무엇에 관한 것인지 명확해집니다.
