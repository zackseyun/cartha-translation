base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/011.yaml
  text: Here their souls are set apart in this great affliction until the great day of judgment and punishment and affliction for those who curse forever; and vengeance on their souls. There he will bind them forever.
  footnotes:
  - marker: a
    text: The phrase 'those who are cursed forever' may also be understood as 'those who curse forever' if the verb is taken actively, but the passive sense fits the judgment context better.
    reason: lexical_alternative
  - marker: b
    text: A bracketed clause in the witness reads, 'and this [was] from before the world,' but the text is uncertain and is not included in the main translation.
    reason: textual_variant
  - marker: c
    text: Or 'Thus'.
    reason: previous_rendering
  - marker: d
    text: Or 'are cursed'.
    reason: previous_rendering
  - marker: e
    text: Or 'and there he will exact vengeance for their souls. There he will bind them'.
    reason: previous_rendering
translation:
  language: ko
  text: 여기서 그들의 영혼은 이 큰 환난 속에 따로 떼어 놓여, 저주받는 자들을 위한 큰 심판과 형벌과 환난의 큰 날까지 있으며, 그들의 영혼에 대한 보복도 있습니다. 거기서 그는 그들을 영원히 묶어 둘 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 문맥상 ‘저주받는 자들’로 이해하는 편이 더 자연스럽지만, 동사의 작용 방향 때문에 ‘저주하는 자들’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 일부 사본 전승에는 ‘그리고 이것은 세상 이전부터’에 해당하는 괄호 구절이 있으나, 본문 확실성이 낮아 본역에는 넣지 않았습니다.
    reason: textual_variant
