theological_decisions:
- issue: ‘저주받는 자들’이냐 ‘저주하는 자들’이냐
  chosen_reading: 본문은 심판의 문맥에 맞추어 ‘저주받는 자들’을 본문으로 두었습니다.
  alternative_readings:
  - ‘저주하는 자들’로 이해할 수 있음
  rationale: 게에즈 동사의 수동적 의미가 더 자연스럽고, 이어지는 심판·형벌의 나열과도 더 잘 맞습니다.
  doctrine_reference: Original-language primacy over translation tradition.
- issue: ‘보복’과 ‘묶어 둘 것’의 주어를 명시할지 여부
  chosen_reading: 주어를 명시하지 않은 채 ‘그는’으로 유지했습니다.
  alternative_readings:
  - ‘하나님은 보복하실 것이다’
  - 수동태로 ‘보복이 행해질 것이다’
  rationale: 본문은 단수 행위자를 암시하지만 이름을 밝히지 않으므로, 서술의 절제를 보존했습니다.
  doctrine_reference: Preserve grammatical reserve in apocalyptic diction.
