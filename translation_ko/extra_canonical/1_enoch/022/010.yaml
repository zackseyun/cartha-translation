theological_decisions:
- issue: 이 구절의 사후 상태 진술을 얼마나 강하게 규정할 것인가
  chosen_reading: 죄인들을 위한 정해진/마련된 상태를 말하지만, 그 본질을 절멸이나 무죄판결로 단정하지는 않습니다.
  alternative_readings:
  - ‘죄인들을 위해 창조되었다’고 더 강하게 읽을 수 있습니다.
  - 단순히 죽음과 매장을 묘사할 뿐, 별도의 배정된 구획을 말하지 않을 수도 있습니다.
  rationale: 게즈 본문은 완료된 수동형으로 결과적 배정을 말하지만, 문맥상 앞선 사후 구분과 연결되므로 의미를 좁혀 버리지 않으면서도 과도한 형이상학적 해석을 피했습니다.
  doctrine_reference: 문맥 보존 및 과잉 해석 절제
- issue: ‘심판이 그들에게 미치지 않았다’의 시제와 범위
  chosen_reading: 그들의 생애 동안 심판이 그들에게 도달하지 않았다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘심판이 그들에게 오지 않았다’
  - ‘그들은 심판을 받지 않았다’
  rationale: 원문의 시간 부사구가 생애를 기준으로 한 미도래를 가리키므로, 최종 판결의 부재로 확대하지 않고 생전의 범위를 분명히 했습니다.
  doctrine_reference: 본문의 시간 범위 유지
