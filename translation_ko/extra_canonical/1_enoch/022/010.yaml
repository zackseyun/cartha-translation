base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/010.yaml
  text: And so it was made for sinners[a], when they die and are buried in the earth[c][b], and judgment has not come upon them during their lifetime.
  footnotes:
  - marker: a
    text: The opening 'And thus' likely refers back to the preceding description of separated places for the dead, indicating that this case corresponds to that arrangement.
    reason: cross_reference
  - marker: b
    text: The passive verb 'has been made' could also be rendered 'has been appointed' or 'was created'; the text does not explicitly restate the noun supplied from the context.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''it has been made for sinners: when they die and are buried in the earth, and judgment has not come upon them''.'
    reason: previous_rendering
translation:
  language: ko
  text: 그렇게 죄인들을 위하여 마련되었습니다[a]. 그들이 죽어 땅에 묻힐 때, 그들의 생애 동안에는 심판이 그들에게 미치지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 앞 구절의 ‘분리된 처소’에 대한 결론적 대응을 가리킬 가능성이 있습니다.
    reason: cross_reference
  - marker: b
    text: 이 동사는 ‘창조되었다’ 또는 ‘정해졌다’로도 옮길 수 있지만, 본문은 여기서 그 대상을 다시 명시하지 않습니다.
    reason: lexical_alternative
