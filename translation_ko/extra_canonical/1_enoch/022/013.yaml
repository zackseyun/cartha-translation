  - 허물에 완전한 자들
  - 죄과에 가득 찬 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘완전함’의 강도를 살리면서, 단순한 상태가 아니라 죄에 철저히 잠긴 모습을 드러내도록 옮겼습니다.
- source_word: አባሲያን
  english_pob_choice: the lawless
  chosen_korean: 무법자들
  alternatives_korean:
