base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/013.yaml
  text: And thus it has been made for the souls of the people who are not righteous[a], but sinners, who are complete in transgression, and they will be with the lawless like them[d][c][b]. But as for their souls...
  footnotes:
  - marker: a
    text: The Ethiopic verb can be understood as 'has been made/prepared/appointed.' In this context of designated places for the dead, 'appointed' is preferred.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult. It may mean 'they will be with the lawless,' 'they will be like them,' or some combination of both.
    reason: alternative_reading
  - marker: c
    text: Or 'the children of men'.
    reason: previous_rendering
  - marker: d
    text: Or '—and their souls as well.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이, 의롭지 않고 죄인인 사람들[c], 곧 죄악에 완전히 빠진 자들의 영혼들을 위하여 그렇게 정해졌습니다[a]. 그들은 그들과 같은 무법자들과 함께 있게 될 것입니다[b]. 그러나 그들의 영혼은…[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈어 동사 ተፈጥረ는 ‘만들어졌다’, ‘준비되었다’, 또는 ‘정해졌다/지정되었다’로 이해할 수 있습니다. 죽은 이들을 위해 구분된 처소를 다루는 문맥에서는 ‘정해졌다’가 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구는 압축되어 있습니다. ‘무법자들과 함께 있게 될 것이다’, ‘그들과 같게 될 것이다’, 또는 두 의미가 함께 담긴 표현으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘사람의 자손들’.
    reason: previous_rendering
  - marker: d
    text: 문장 끝의 ወነፍሶሙሰ는 다음 절로 이어지는 화제 전환 또는 대조의 연결부입니다. 따라서 이 절에서는 문장을 완결하지 않았습니다.
    reason: previous_rendering
