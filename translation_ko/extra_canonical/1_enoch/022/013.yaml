  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: ‘with the lawless like them’의 관계 의미
  chosen_reading: ‘그들과 같은 무법자들 가운데 있게 될 것입니다’로, 동반성과 유사성을 함께 남깁니다.
  alternative_readings:
