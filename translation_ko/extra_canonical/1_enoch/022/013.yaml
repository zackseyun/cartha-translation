  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적·심판적 어조를 살리기 위해 ‘무법자들’을 택했으며, 이는 단순한 사회적 무질서보다 하나님의 질서에 대한 거부를 드러냅니다.
theological_decisions:
- issue: 마지막 절의 미완결성과 ‘그들의 영혼은…’의 처리
  chosen_reading: 문장이 다음 절로 이어지는 미완결 형태를 그대로 남겨, 현재 절에서 결론을 덧붙이지 않습니다.
  alternative_readings:
  - ‘그리고 그들의 영혼도…’로 보완하기
  - ‘그들의 영혼 역시 그들과 함께’로 완결하기
  - ‘그러나 그들의 영혼은 멸망할 것입니다’로 구체화하기
  rationale: 게즈 본문은 의도적으로 끊겨 있으며, 영어 POB도 이를 보존합니다. 여기서 의미를 완결시키면 다음 절의 전개와 긴장이 사라집니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: ‘with the lawless like them’의 관계 의미
  chosen_reading: ‘그들과 같은 무법자들 가운데 있게 될 것입니다’로, 동반성과 유사성을 함께 남깁니다.
  alternative_readings:
  - ‘그들과 함께 있을 것입니다’로 단순화하기
  - ‘그들처럼 될 것입니다’로 한쪽만 강조하기
  - ‘그들과 함께 멸망할 것입니다’로 해석 고정하기
  rationale: 게즈 구문이 압축적이어서 동반/유사 관계가 함께 엮여 있습니다. 한 가지로 과도하게 확정하지 않고, 두 의미가 모두 보이도록 옮겼습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
