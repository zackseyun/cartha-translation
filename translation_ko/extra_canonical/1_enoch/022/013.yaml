  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 라멕 전치사 구문이 이 대상들을 위해 마련된 것을 나타내므로, 한국어에서는 목적격적 의미를 자연스럽게 풀어 ‘위하여’로 옮겼습니다.
- source_word: ኢኮኑ ጻድቃነ አላ ኃጥኣነ
  english_pob_choice: who are not righteous, but sinners
  chosen_korean: 의롭지 않은 사람들 곧 죄인들
  alternatives_korean:
  - 의롭지 않으나 죄인들
  - 의롭지 않은 자들, 그러나 죄인들
  - 의롭지 않은 이들, 곧 죄인들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘의롭다/죄인’의 대비를 직접 보존하되, 한국어의 흐름상 ‘곧’으로 설명적 접속을 넣어 문장을 매끈하게 했습니다.
- source_word: ፍጹማነ እበሳ
  english_pob_choice: complete in transgression
  chosen_korean: 죄악에 완전히 빠진 자들
  alternatives_korean:
