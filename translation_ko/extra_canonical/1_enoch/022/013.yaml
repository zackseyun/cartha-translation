  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지하의 거처와 사후 운명을 분배하는 문맥이므로, 물리적 ‘창조’보다 ‘정해짐/지정됨’의 기능적 의미를 살렸습니다.
