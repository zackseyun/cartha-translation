base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/013.yaml
  text: And thus it has been made for the souls of the people who are not righteous[a], but sinners, who are complete in transgression, and they will be with the lawless like them[d][c][b]. But as for their souls...
  footnotes:
  - marker: a
    text: The Ethiopic verb can be understood as 'has been made/prepared/appointed.' In this context of designated places for the dead, 'appointed' is preferred.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult. It may mean 'they will be with the lawless,' 'they will be like them,' or some combination of both.
    reason: alternative_reading
  - marker: c
    text: Or 'the children of men'.
    reason: previous_rendering
  - marker: d
    text: Or '—and their souls as well.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이, 의롭지 않은 사람들 곧 죄인들—죄악에 완전히 빠진 자들—의 영혼들을 위하여 그렇게 정해졌습니다. 그들은 그들과 같은 무법자들 가운데 있게 될 것입니다. 그러나 그들의 영혼은…[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈 동사 ተፈጥረ는 문맥상 ‘만들어졌다’보다 ‘정해졌다/지정되었다’로 읽는 것이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구는 ‘그들과 같이’로 옮길 수도 있고, ‘그들과 함께’로 옮길 수도 있는 압축된 표현입니다.
    reason: alternative_reading
  - marker: c
    text: 여기서 ሰብእ는 직역하면 ‘사람들’이지만, 1에녹 문체의 관용구로서는 ‘사람의 자손/인자들’에 가까운 울림이 있습니다.
    reason: previous_rendering
  - marker: d
    text: 문장 끝의 ወነፍሶሙሰ는 다음 절로 넘어가는 연결부이므로, 현재 절에서는 완결형으로 다듬지 않았습니다.
    reason: previous_rendering
