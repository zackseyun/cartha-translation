base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/008.yaml
  text: 'And at that time I asked concerning him and concerning the judgment of all: for what reason were they separated[c][b][a], one from another?'
  footnotes:
  - marker: a
    text: The phrase 'concerning them' reflects the transmitted Ge'ez, where the referent is the groups or places just described in the vision.
    reason: cross_reference
  - marker: b
    text: The opening bracketed words in the OCR suggest minor uncertainty in the exact prepositional phrasing before 'concerning them,' but the sense of Enoch's inquiry is stable.
    reason: textual_variant
  - marker: c
    text: Or 'concerning them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그때 나는 그에 관하여, 또 모든 것의 심판에 관하여 물었습니다. 왜 그들은 서로에게서 분리되었습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈의 단수 3인칭 접미사가 가리키는 대상을 살려, 질문이 먼저 특정 대상에 대해 제기된 뒤 심판으로 넓어지는 흐름을 반영했습니다.
    reason: source_note
  - marker: b
    text: ‘심판’을 택해, 법정적 판결보다 더 넓은 종말론적 판단의 의미를 보존했습니다.
    reason: theological_note
