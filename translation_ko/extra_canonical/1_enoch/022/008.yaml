theological_decisions:
- issue: ‘judgment of all’의 범위
  chosen_reading: ‘모든 것의 심판’으로 넓게 옮겨, 대상 전체를 포괄하는 심판적 성격을 유지했습니다.
  alternative_readings:
  - 모든 사람의 심판
  - 모든 이의 판결
  rationale: 게에즈 표현은 이 장면의 분리된 영역들과 그 원인을 묻는 질문 속에서, 특정한 형벌만이 아니라 포괄적인 심판의 의미를 가질 수 있습니다. 그 긴장을 좁히지 않기 위해 넓은 표현을 택했습니다.
  doctrine_reference: 의미의 긴장 보존
- issue: 대명사 ‘그’의 지시 대상
  chosen_reading: ‘그에 관하여’로 옮겨 직전 문맥의 특정 인물/대상을 가리키게 했습니다.
  alternative_readings:
  - 그들에 관하여
  - 그것에 관하여
  rationale: 편집 기록에 따르면 해당 형식은 단수 3인칭을 가리키며, 앞선 문맥의 특정한 대상에 대한 질문이 먼저 제시된 뒤 일반적 심판으로 확장됩니다. 이를 살려 문맥적 초점을 유지했습니다.
  doctrine_reference: 문맥 지시 보존
