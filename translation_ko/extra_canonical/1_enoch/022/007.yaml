  - 그가 내게 대답하여 말했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사가 모두 있는 반복형 발화 도입을 살리되, 한국어에서는 자연스럽게 합쳐서 옮겼습니다. 1인칭 목적어 ‘-내게’도 유지했습니다.
- source_word: መንፈስ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 혼
  - 숨
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아벨의 비육체적 존재를 가리키므로 ‘영’이 가장 직접적입니다. 여기서는 성령이 아니라 인물의 영이므로 일반적으로 ‘영’으로 옮겼습니다.
- source_word: ይሰኪ ኪያሁ
  english_pob_choice: it makes accusation against him
  chosen_korean: 그를 고발하며
  alternatives_korean:
  - 그를 고발합니다
  - 그를 고소하며
  - 그를 책망하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적·호소적 뉘앙스를 살리기 위해 단순한 ‘고소하다/비난하다’보다 ‘고발하다’를 택했습니다. 현재 진행적 연결을 위해 ‘-며’로 처리했습니다.
- source_word: እስከ ሶበ ይትኀጐል ዘርኡ / ይማስን ዘርኡ
  english_pob_choice: until his seed is destroyed ... and his seed is blotted out
  chosen_korean: 그의 씨가 사라질 때까지 ... 그의 씨가 지워집니다
  alternatives_korean:
  - 그의 씨가 멸망할 때까지 ... 그의 씨가 말소됩니다
  - 그의 씨가 끊어질 때까지 ... 그의 씨가 제거됩니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 ‘씨’의 계보적·심판적 언어를 그대로 유지했습니다. 첫 절은 소멸, 둘째 절은 지움/말소의 중첩을 살리되 현대 한국어에서 읽히도록 ‘사라지다/지워지다’로 옮겼습니다.
theological_decisions:
- issue: 아벨의 사후 존재를 어떻게 표현할지
  chosen_reading: 영
  alternative_readings:
  - 혼
  - 유령
  - 그의 목소리
  rationale: 원문 መንፈስ은 분명히 아벨의 비물질적 존재를 가리키므로, 이를 완화하지 않고 ‘영’으로 유지했습니다. 환상적·종말론적 장면의 실재감을 보존합니다.
  doctrine_reference: 환상적/종말론적 묘사를 평탄화하지 말 것
- issue: 카인 계열에 대한 심판을 어떻게 보존할지
  chosen_reading: 그의 씨가 사라질 때까지 ... 그의 씨가 지워집니다
  alternative_readings:
  - 그의 후손이 멸망할 때까지 ... 그의 후손이 제거됩니다
  - 그의 자손이 끊어질 때까지 ... 그의 자손이 사라집니다
  rationale: 반복되는 ‘씨’는 혈통 전체에 대한 집단적 심판을 강조하므로, 더 매끄러운 ‘후손/자손’보다 원문의 반복을 유지했습니다.
  doctrine_reference: 반복 어휘의 신학적 기능을 보존
