base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/007.yaml
  text: And he answered me and said to me[a], “This is the spirit that came out from Abel, whom Qayin his brother killed; and it makes accusation against him until his seed is destroyed from before the face of the earth[d][c][b], and his seed is blotted out from among the seed of men.”
  footnotes:
  - marker: a
    text: The speech formula includes both 'he answered me' and, in this witness, a bracketed 'and said to me.' The English keeps both to reflect the received wording.
    reason: textual_variant
  - marker: b
    text: '''Makes accusation against him'' reflects a judicial sense: Abel''s spirit functions as an accuser crying for judgment, not merely as a narrator of grievance.'
    reason: lexical_alternative
  - marker: c
    text: '''Seed'' is retained twice to preserve the lineage-focused judgment language; ''offspring'' or ''descendants'' would be smoother but less transparent to the repeated wording.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And he answered me and said, while speaking:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하여 내게 말했습니다[a], 「이것은 아벨에게서 나온 영입니다. 곧 그의 형제 카인이 죽인 그 아벨의 영입니다. 그것은 땅의 얼굴 앞에서 그의 씨가 사라질 때까지 그를 고발하며[b], 사람의 씨 가운데에서 그의 씨가 지워집니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 증언형 도입은 ‘그가 내게 대답하여’와 ‘내게 말했습니다’를 함께 보존합니다. 게에즈 본문에는 두 동사가 모두 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘고발하다’는 단순한 말싸움이 아니라 법정적·심판적 호소를 드러내는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘씨’는 여기서 반복되는 계보 언어를 그대로 살리기 위한 번역입니다. ‘후손’이나 ‘자손’보다 원문의 반복 효과가 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአውሥአኒ / ወይቤለኒ
  english_pob_choice: he answered me and said to me
  chosen_korean: 그가 내게 대답하여 내게 말했습니다
  alternatives_korean:
  - 그가 내게 대답하고 말했습니다
  - 그가 내게 대답하여 말했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사가 모두 있는 반복형 발화 도입을 살리되, 한국어에서는 자연스럽게 합쳐서 옮겼습니다. 1인칭 목적어 ‘-내게’도 유지했습니다.
- source_word: መንፈስ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 혼
  - 숨
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아벨의 비육체적 존재를 가리키므로 ‘영’이 가장 직접적입니다. 여기서는 성령이 아니라 인물의 영이므로 일반적으로 ‘영’으로 옮겼습니다.
- source_word: ይሰኪ ኪያሁ
  english_pob_choice: it makes accusation against him
  chosen_korean: 그를 고발하며
  alternatives_korean:
  - 그를 고발합니다
  - 그를 고소하며
  - 그를 책망하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적·호소적 뉘앙스를 살리기 위해 단순한 ‘고소하다/비난하다’보다 ‘고발하다’를 택했습니다. 현재 진행적 연결을 위해 ‘-며’로 처리했습니다.
- source_word: እስከ ሶበ ይትኀጐል ዘርኡ / ይማስን ዘርኡ
  english_pob_choice: until his seed is destroyed ... and his seed is blotted out
  chosen_korean: 그의 씨가 사라질 때까지 ... 그의 씨가 지워집니다
  alternatives_korean:
  - 그의 씨가 멸망할 때까지 ... 그의 씨가 말소됩니다
  - 그의 씨가 끊어질 때까지 ... 그의 씨가 제거됩니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 ‘씨’의 계보적·심판적 언어를 그대로 유지했습니다. 첫 절은 소멸, 둘째 절은 지움/말소의 중첩을 살리되 현대 한국어에서 읽히도록 ‘사라지다/지워지다’로 옮겼습니다.
theological_decisions:
- issue: 아벨의 사후 존재를 어떻게 표현할지
  chosen_reading: 영
  alternative_readings:
  - 혼
  - 유령
  - 그의 목소리
  rationale: 원문 መንፈስ은 분명히 아벨의 비물질적 존재를 가리키므로, 이를 완화하지 않고 ‘영’으로 유지했습니다. 환상적·종말론적 장면의 실재감을 보존합니다.
  doctrine_reference: 환상적/종말론적 묘사를 평탄화하지 말 것
- issue: 카인 계열에 대한 심판을 어떻게 보존할지
  chosen_reading: 그의 씨가 사라질 때까지 ... 그의 씨가 지워집니다
  alternative_readings:
  - 그의 후손이 멸망할 때까지 ... 그의 후손이 제거됩니다
  - 그의 자손이 끊어질 때까지 ... 그의 자손이 사라집니다
  rationale: 반복되는 ‘씨’는 혈통 전체에 대한 집단적 심판을 강조하므로, 더 매끄러운 ‘후손/자손’보다 원문의 반복을 유지했습니다.
  doctrine_reference: 반복 어휘의 신학적 기능을 보존
