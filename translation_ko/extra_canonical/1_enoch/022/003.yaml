  - 거룩한 영들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정형화된 종말론적 표현을 살리기 위해 ‘거룩한 천사들’로 옮겼습니다.
- source_word: ሰናያት
