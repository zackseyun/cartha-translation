base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/003.yaml
  text: 'And at that time Raphael[a], one of the holy angels who was with me, answered and said to me, “These hollow places were made so that the spirits, the souls of the dead, might be gathered into them[c][b]. For this purpose they were created here: that they might gather all the souls of the children of men.”'
  footnotes:
  - marker: a
    text: Or 'good places' or 'fair places'; the adjective can denote moral goodness or pleasing beauty.
    reason: lexical_alternative
  - marker: b
    text: The verse uses both 'spirits' and 'souls,' likely in apposition rather than as sharply distinct categories.
    reason: lexical_alternative
  - marker: c
    text: Or 'These beautiful places'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그때 나와 함께 있던 거룩한 천사들 가운데 하나인 라파엘이 대답하여 내게 말했습니다. “이 아름다운 곳들은 영들, 곧 죽은 자들의 혼들이 그 안에 모이도록 만들어진 것입니다.[a] 이 목적을 위하여 이곳에 창조되었습니다. 곧 사람의 자녀들의 모든 혼을 모아들이도록 말입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 이곳들을 ‘아름다운’ 또는 ‘좋은’ 곳들이라고 부릅니다. 일부 번역 전통은 문맥 및 추정된 다른 언어 전승에 따라 ‘속이 빈 곳들’로 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 게에즈 본문은 ‘영들’과 ‘죽은 자들의 혼들’을 함께 사용합니다. 여기서는 두 표현을 동격으로 옮겨 이중 어휘를 보존했습니다.
    reason: lexical_alternative
