  - 속이 빈 곳들
  - 동굴 같은 곳들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문 맥락과 영어 POB의 수정판이 가리키는 ‘hollow places’를 반영하되, 한국어에서는 독자가 기능적으로 이해할 수 있도록 ‘굴속 같은 곳들’로 옮겼습니다.
- source_word: መናፍስት / ነፍሶሙ ለምዉታን
  english_pob_choice: the spirits, the souls of the dead
  chosen_korean: 죽은 자들의 혼, 곧 영들
  alternatives_korean:
  - 죽은 자들의 영혼
  - 죽은 자들의 영들
  - 죽은 자들의 혼들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 두 표현을 함께 살리기 위해 ‘혼’과 ‘영’을 병기했습니다. 이는 영과 혼의 개념을 단순화하지 않고, 본문의 이중 어휘를 드러내려는 선택입니다.
- source_word: ያስተጋብኡ
  english_pob_choice: they might gather
  chosen_korean: 모으게 하려는 것입니다
  alternatives_korean:
  - 모이게 하려는 것입니다
  - 모으려는 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동적으로 ‘들어감’만이 아니라 지정된 목적을 위해 ‘모이게 함’이라는 능동적 취지를 살렸습니다.
theological_decisions:
- issue: ‘혼’과 ‘영’의 관계
  chosen_reading: 두 용어를 병렬적으로 유지하되, ‘곧’으로 풀이를 붙여 apposition임을 드러냈습니다.
  alternative_readings:
  - ‘죽은 자들의 영혼’으로 단일화
  - ‘영들’만 남기고 ‘혼’을 생략
  rationale: 게에즈 본문은 መናፍስት과 ነፍሶሙ/ነፍሰ를 함께 쓰므로, 개념적 긴장을 평평하게 만들지 않고 중첩된 표현으로 보존하는 편이 본문에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; document ambiguity rather than flatten it.
- issue: ‘children of men’ 관용구
  chosen_reading: ‘사람의 자손들’로 유지했습니다.
  alternative_readings:
  - ‘인류’
  - ‘사람들’
  rationale: 고대 묵시문학의 인류 지칭 관용구를 평이하지만 무게 있게 살리기 위해 직역적 표현을 유지했습니다.
  doctrine_reference: Readable modern Korean, not archaic, but preserve register where significant.
