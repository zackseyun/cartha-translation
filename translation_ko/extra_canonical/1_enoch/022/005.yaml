revisions:
- from: 그리고 나는 죽은 사람의 자녀들의 영들을 보았습니다. 그들의 소리가 하늘에까지 이르러 부르짖었습니다.[a]
  to: 그리고 나는 죽은 사람들의 영들을 보았습니다. 그들의 소리는 하늘에까지 이르렀고, 그들은 부르짖었습니다.[a]
  rationale: ‘사람의 자녀들’을 ‘죽은 사람들’로 고쳐 원문의 집단적 인간 지시와 죽음의 수식을 한국어에서 명확히 전달했습니다. 이어지는 두 동작은 원문의 순서를 유지하되, 한국어의 자연스러운 주어 관계에 맞추어 ‘그들의 소리’는 하늘에 이르고 ‘그들’은 부르짖는 것으로 표현했습니다. 본문의 중립적 ‘부르짖었습니다’와 각주의 호소·항의 가능성을 유지했습니다.
