translation:
  language: ko
  text: 그리고 나는 죽은 사람의 자녀들의 영들을 보았습니다. 그들의 소리가 하늘에까지 이르러 부르짖었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 동사는 ‘부르짖다’로 옮겼지만, 문맥상 ‘호소하다’ 또는 ‘항의하다’의 뉘앙스를 가질 수 있습니다.
