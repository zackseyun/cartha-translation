  source_fidelity: 첫 절의 마련됨, 거주, 심판의 날, 정해진 때 및 마지막 ‘큰 심판의 때’라는 시간 표현은 대체로 반영합니다. 그러나 현행 번역의 ‘그들 위에 큰 심판의 때가 이를 때까지 그렇습니다’는 한국어 통사상 부자연스럽고, ‘그렇습니다’의 지시 대상이 불명확합니다. 원문의 시간적 종결점을 자연스럽게 명시할 필요가 있습니다. †ገብሩ†의 본문상 불확실성은 각주로 적절히 보존합니다.
