  rationale: 지리적·상징적 ‘지점’보다 넓게 포괄하면서도, 이 절의 감옥 같은 사후 거처를 과잉 해석하지 않는 가장 중립적인 표현입니다.
- source_word: ይነብርዎሙ
  english_pob_choice: they will dwell
