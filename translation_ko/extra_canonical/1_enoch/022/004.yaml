base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/004.yaml
  text: And these places were made for them to dwell in until the day of their judgment[a], and until their appointed time, and that appointed time is long[c][b], until the time of the great judgment upon them.
  footnotes:
  - marker: a
    text: The marked word in the Ethiopic witness (†ገብሩ†) is textually uncertain. The sense of the clause is that these are the places designated for them to dwell until judgment.
    reason: textual_variant
  - marker: b
    text: '''Appointed time'' renders a term that can also mean ''age,'' ''lifetime,'' or ''term.'' Here it likely refers to the fixed period allotted before final judgment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And these are the places where they will dwell until the day of their judgment, and until their appointed time, and that appointed time is great, until the great judgment comes upon them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 장소들은 그들을 위해, 그들의 심판의 날과 그들의 정해진 때까지 거기에 거주하도록 마련되었습니다[a]. 그리고 그 정해진 때는 길며[b], 그들 위에 큰 심판의 때가 이를 때까지 그렇습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어의 †ገብሩ†는 본문상 불확실합니다. 여기서는 ‘그들을 위해 … 마련되었습니다’로 옮겨, 그 장소들이 그들의 거처로 지정되었다는 뜻을 반영했습니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ‘정해진 때’는 ‘나이’나 ‘생애’도 뜻할 수 있지만, 문맥상 최후 심판 전까지의 정해진 기간을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መካናት
  english_pob_choice: places
  chosen_korean: 장소들
  alternatives_korean:
  - 거처들
  - 처소들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지리적·상징적 ‘지점’보다 넓게 포괄하면서도, 이 절의 감옥 같은 사후 거처를 과잉 해석하지 않는 가장 중립적인 표현입니다.
- source_word: ይነብርዎሙ
  english_pob_choice: they will dwell
  chosen_korean: 거주하도록
  alternatives_korean:
  - 살도록
  - 머물도록
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 임시 체류보다 지속적 거처의 의미를 살리면서, 한국어 문맥에서는 ‘거주하다’가 가장 자연스럽습니다.
- source_word: ኵነኔሆሙ
  english_pob_choice: the day of their judgment
  chosen_korean: 그들의 심판의 날
  alternatives_korean:
  - 그들의 판단의 날
  - 그들의 정죄의 날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''심판''은 이 단어의 재판적·종말론적 의미를 보존하며, ‘정죄’로 좁히지 않아 본문이 가진 판결의 긴장을 유지합니다.'
- source_word: አመ ዕድሜሆሙ
  english_pob_choice: their appointed time
  chosen_korean: 그들의 정해진 때
  alternatives_korean:
  - 그들의 시기
  - 그들의 수명
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘때’로 옮기되, 단순한 연대가 아니라 미리 정해진 기간이라는 점을 분명히 하기 위해 ‘정해진’을 붙였습니다.
- source_word: ዘየዓቢ
  english_pob_choice: is great
  chosen_korean: 길며
  alternatives_korean:
  - 크며
  - 오래되며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞선 ‘정해진 때’의 성격상, 여기서는 규모보다 지속 기간의 뉘앙스가 더 적절하므로 ‘길다’로 옮겨 시간적 장음을 드러냈습니다.
- source_word: ኵነኔ ዐቢይ በላዕሌሆሙ
  english_pob_choice: the great judgment upon them
  chosen_korean: 그들 위에 큰 심판
  alternatives_korean:
  - 그들 위에 임하는 큰 심판
  - 그들에 대한 큰 심판
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘위에’는 원문의 전치사적 압박감을 살리고, ‘큰 심판’은 종말론적 클라이맥스를 간결하게 전달합니다.
theological_decisions:
- issue: כּונֵנֶה/심판의 성격을 ‘정죄’로 좁힐지 여부
  chosen_reading: 본문의 판결적·종말론적 범위를 살려 ‘심판’으로 유지했습니다.
  alternative_readings:
  - 정죄
  - 유죄 판결
  rationale: 원문은 최종 결과를 단정하기보다 심판 행위 자체를 말하므로, 지나치게 결과론적으로 좁히지 않는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘정해진 때’의 의미를 시간의 길이로 구체화할지 여부
  chosen_reading: ‘길며’로 옮겨 시간의 지속성을 드러냈습니다.
  alternative_readings:
  - 크며
  - 오래되며
  rationale: 에티오피아어 수식어는 단순한 크기보다 기간의 장구함을 시사하므로, 한국어에서도 시간적 길이를 우선해 표현했습니다.
  doctrine_reference: Lexical ambiguity in eschatological time expressions.
