base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/012.yaml
  text: And thus a division has been made for the souls of those who make their complaint[d][c][b][a], who make known their destruction when they were slain in the days of the sinners.
  footnotes:
  - marker: a
    text: Or 'those who cry out' or 'those who bring accusation.' The Ge'ez verb can suggest lament, complaint, or protest.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'concerning their destruction' may refer specifically to the violent manner of their death rather than destruction in a broader sense.
    reason: lexical_alternative
  - marker: c
    text: This verse continues the description of separated places for the dead in Sheol, where the slain await judgment and vindication.
    reason: cross_reference
  - marker: d
    text: Or 'who reveal concerning their destruction'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이와 같이 그들이 신원하는[민원하는] 영혼들을 위하여 분리가 이루어졌습니다. 그들은 죄인들의 날에 죽임을 당했을 때, 자기들의 파멸을 드러내는 이들입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신원하는’은 억울함을 풀어 달라고 호소한다는 뜻이며, 문맥상 ‘하소연하는’이나 ‘고발하는’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘파멸’은 단순한 죽음보다 폭력적이고 비참한 종말을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 절은 스올에서 죽은 자들을 위한 분리된 장소를 계속 묘사하며, 죽임을 당한 이들이 심판과 신원(伸寃)을 기다리는 장면입니다.
    reason: cross_reference
  - marker: d
    text: ‘드러내는’은 ‘자기들의 파멸을 알리는/보여 주는’의 뜻도 가능합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ተፈልጠ
  english_pob_choice: a division has been made
  chosen_korean: 분리가 이루어졌습니다
  alternatives_korean:
  - 구분이 이루어졌습니다
  - 나뉘어졌습니다
  - 분할이 이루어졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형의 ‘분리/구분’ 의미를 살리면서, 죽은 자들을 위한 구획이 마련되었다는 문맥을 자연스럽게 전달합니다.
- source_word: እለ ይስክዩ
  english_pob_choice: those who make their complaint
  chosen_korean: 신원하는[민원하는] 이들
  alternatives_korean:
  - 하소연하는 이들
  - 부르짖는 이들
  - 고소하는 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 탄식과 항의, 고발의 뉘앙스를 함께 지닐 수 있으므로, 억울함을 호소하며 권리를 신원한다는 뜻의 표현으로 옮겨 포괄성을 유지했습니다.
- source_word: እለ ያርእዩ
  english_pob_choice: who make known / reveal
  chosen_korean: 드러내는 이들
  alternatives_korean:
  - 알리는 이들
  - 드러내 보이는 이들
  - 증언하는 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘보이다/알리다’의 의미를 살리되, 단순 정보 전달보다 감춰진 사실을 밖으로 드러내는 뉘앙스를 유지했습니다.
- source_word: በእንተ ሕጉለት
  english_pob_choice: concerning their destruction
  chosen_korean: 자기들의 파멸
  alternatives_korean:
  - 자기들의 멸망
  - 자기들의 파괴
  - 자기들의 죽음
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘파멸’은 단순 사망보다 폭력적 종말과 억울한 멸절을 함께 담을 수 있어, 문맥의 비극성을 드러냅니다.
- source_word: አመ ተቀትሉ
  english_pob_choice: when they were slain
  chosen_korean: 죽임을 당했을 때
  alternatives_korean:
  - 살해되었을 때
  - 죽었을 때
  - 도살되었을 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형의 폭력성을 분명히 하되, 고어적 ‘살해되다’보다 현대 한국어에서 읽히는 문장으로 정리했습니다.
theological_decisions:
- issue: ‘complaint’의 법정적/탄식적 중의성
  chosen_reading: ‘신원하는[민원하는]’으로 옮겨 억울함의 호소와 항의, 그리고 고발의 가능성을 함께 남겼습니다.
  alternative_readings:
  - 하소연하는
  - 부르짖는
  - 고소하는
  rationale: 이 본문은 억울한 죽음의 호소를 단순한 감정 표출로만 좁히지 않고, 하나님의 न्याय 앞에서의 호소로도 읽게 합니다. 한국어에서는 ‘신원하다’가 이 중의성을 비교적 잘 보존합니다.
  doctrine_reference: 억울한 피가 하나님의 न्याय를 향해 호소한다는 문맥적 긴장을 보존합니다.
