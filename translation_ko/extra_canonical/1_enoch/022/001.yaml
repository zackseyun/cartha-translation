  alternative_readings:
  - 천사가 나에게 보여 주었습니다
  - 내 안내자가 나에게 보여 주었습니다
  rationale: 게에즈 본문 자체는 3인칭 남성 주어만 제시하며, 안내자의 정체는 즉시 문맥에서 추정될 수 있어도 여기서는 명시되지 않습니다. 원문이 드러내는 범위를 넘지 않기 위해 대명사를 유지했습니다.
