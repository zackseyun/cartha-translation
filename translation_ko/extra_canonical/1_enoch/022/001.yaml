base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/001.yaml
  text: And from there I went to another place[a], and he showed me in the west a great and high mountain[b], and a hard rock.
  footnotes:
  - marker: a
    text: The description may be read as a mountain that is both great and lofty; the Ge'ez preserves both qualities rather than reducing them to a single adjective.
    reason: lexical_alternative
  - marker: b
    text: The final phrase can also be rendered 'solid rock' or 'firm rock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거기에서 나는 다른 곳으로 갔습니다. 그가 서쪽에서 크고 높은 산과 단단한 바위를 나에게 보여 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈는 산을 두 형용사로 묘사하므로, 이를 하나의 뜻으로 합치지 않고 ‘크고 높은’으로 함께 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구는 ‘단단한 바위’ 외에도 ‘견고한 바위’ 또는 ‘굳센 바위’로도 옮길 수 있습니다.
    reason: lexical_alternative
