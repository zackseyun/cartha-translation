theological_decisions:
- issue: ‘지혜를 가진 이들’과 마지막 절의 관계
  chosen_reading: 지혜를 받은 자들은 그 지혜를 소유한 상태에 따라 겸손한 삶을 보입니다.
  alternative_readings:
  - 마지막 절은 별도의 일반 진술입니다.
  - 지혜가 곧 그들을 겸손하게 만드는 원인입니다.
  rationale: 원문은 ‘지혜를 가진 이들’이라는 표지 뒤에 겸손을 붙여, 소유와 성품을 연결합니다. 한국어에서는 이 연관을 약화하지 않되, 인과를 지나치게 덧붙이지 않도록 조심했습니다.
  doctrine_reference: Translation philosophy §Contested terms / preserve local passage sense
- issue: ‘다시는 죄를 짓지 않을 것입니다’의 범위
  chosen_reading: 지혜가 주어진 후의 미래 상태를 넓게 말하면서, 곧바로 불경건과 교만을 대표적 죄로 구체화합니다.
  alternative_readings:
  - 특정한 두 죄만을 가리킵니다.
  - 과장된 수사로 보아야 합니다.
  rationale: Ge'ez의 넓은 진술과 뒤따르는 두 악덕을 함께 보존해야 하므로, 일반 진술과 구체 예시를 동시에 살리는 번역이 적절합니다.
  doctrine_reference: Source semantics / apocalyptic moral transformation
