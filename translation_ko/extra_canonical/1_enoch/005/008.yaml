  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지혜가 인간의 획득물이 아니라 수여되는 선물이라는 점을 살리기 위해 수동 미래를 반영했습니다.
- source_word: ወኢይደግሙ አብሶ እበረሲዕ ወእበኅዕቢት
  english_pob_choice: and will not again sin, whether through ungodliness or through pride
  chosen_korean: 다시는 경건치 않음이나 교만으로 죄를 짓지 않을 것입니다
  alternatives_korean:
  - 다시는 불경건함이나 교만 가운데 죄를 짓지 않을 것입니다
  - 다시는 불경이나 교만으로 죄를 범하지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘경건치 않음’은 종교-윤리적 반대 개념을, ‘교만’은 뒤의 겸손과 대응되는 핵심 덕목을 분명히 드러냅니다.
