base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/008.yaml
  text: And then wisdom will be given to the chosen[a], and all these will live and will not again sin, whether through ungodliness or through pride[b]; but those who possess wisdom will be humble.
  footnotes:
  - marker: a
    text: Or 'the elect.'
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be understood as 'but they will be humble, because wisdom is theirs.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 지혜가 택함 받은 이들에게 주어질 것이며, 그들은 모두 살고 다시는 불경건함이나 교만으로 죄를 짓지 않을 것입니다. 그러나 지혜를 가진 이들은 겸손할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘택함 받은 이들’은 ‘선택된 이들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘그러나 그들은 지혜를 가졌기 때문에 겸손할 것입니다’로도 이해할 수 있습니다.
    reason: lexical_alternative
