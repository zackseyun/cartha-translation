  - 택자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아포칼립스적 집단 표지를 살리면서도, 문맥상 과도한 교리적 색채를 덜어 주는 ‘택함 받은 이들’이 자연스럽습니다.
- source_word: ይትወሀቦሙ
