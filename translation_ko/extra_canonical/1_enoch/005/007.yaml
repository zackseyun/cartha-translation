- issue: 첫 절 접속사 ወ의 처리
  chosen_reading: ‘그리고’로 옮겨 축복 진술의 첫 항을 시작했습니다.
  alternative_readings:
  - ‘하지만’로 시작
  - 접속사를 생략
  rationale: 게에즈 본문은 첫 부분을 단순 연결하고, 뒤에서만 대조를 강화하므로 첫 절을 ‘그리고’로 처리하는 편이 구조를 더 정확히 드러냅니다.
  doctrine_reference: 본문의 수사 구조 보존
