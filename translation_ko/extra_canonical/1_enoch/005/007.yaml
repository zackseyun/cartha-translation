translation:
  language: ko
  text: 그리고 선택받은 이들에게는 빛과 기쁨과 평화가 있을 것이며, 그들은 땅을 유업으로 받을 것입니다. 그러나 너희 악인들에게는 저주가 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 ምድር는 ‘땅’뿐 아니라 ‘지역’ 또는 ‘나라’를 뜻할 수도 있습니다. 이 묵시적 문맥에서는 더 넓은 범위를 염두에 두고 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 첫 절의 게에즈어 ወ는 단순 접속사이고, 대조는 뒤의 ‘그러나 너희’에 해당하는 표현에서 나타납니다.
    reason: source_structure
