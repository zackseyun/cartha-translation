  - ‘땅’ 대신 ‘나라’
  rationale: 묵시적 우주 스케일을 살리면서도, 이 구절의 상속 이미지를 한국어에서 가장 자연스럽게 유지하는 번역은 ‘땅’입니다.
  doctrine_reference: 묵시문학적 상속 약속의 범위 보존
