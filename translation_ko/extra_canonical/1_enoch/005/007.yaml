translation:
  language: ko
  text: 그리고 선택받은 자들에게는 빛과 기쁨과 평강이 있으며, 그들이 땅을 유업으로 받을 것입니다. 그러나 너희 악인들에게는 저주가 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 ምድር는 ‘땅’도 뜻할 수 있지만, 이 문맥에서는 더 넓은 우주적 범위를 살려 ‘땅’으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 첫 절의 연결은 단순 접속이고, 대조는 뒤의 ‘그러나 너희’에서 본격화됩니다. 따라서 구조를 살려 번역했습니다.
    reason: source_note
