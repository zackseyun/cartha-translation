base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/001.yaml
  text: Observe how the trees are covered with green leaves and bear fruit[c][b][a], and understand concerning everything that the Ever-Living One has made all these things.
  footnotes:
  - marker: a
    text: The Ge'ez in the latter half of the verse is difficult. The clause rendered 'all of them know concerning themselves that they have made all these things' may reflect a corrupt or uncertain transmission; the general sense is that the trees themselves testify to the ordered pattern of creation.
    reason: textual_variant
  - marker: b
    text: The final phrase could also be understood as referring to 'the Ever-Living One' rather than 'the living forever.'
    reason: alternative_reading
  - marker: c
    text: 'Or ''But ask, please, the trees: when they have put forth green leaves, and are covered and bear fruit, all of them know concerning themselves that they have made all these things for the living forever.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 나무들이 푸른 잎으로 덮이고 열매를 맺는 것을 살펴보십시오. 모든 것에 관하여[a] 영원히 사시는 분께서 이 모든 것을 지으셨음을 깨달으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문의 이 부분은 문법과 전승이 다소 난해합니다. ‘모든 것에 관하여’ 뒤의 연결은 확정적으로 매끈하게 복원하기 어렵습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ጠይቁ
  english_pob_choice: Observe / ask
  chosen_korean: 살피고
  alternatives_korean:
  - 보십시오
  - 물으십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 단순한 질문보다 창조 세계를 관찰하여 깨닫는 촉구이므로, 자연스러운 합쇼체 동사인 ‘살피다’로 옮겼습니다.
- source_word: በሐመልማለ አቍጽል
  english_pob_choice: are covered with green leaves
  chosen_korean: 푸른 잎으로 덮여
  alternatives_korean:
  - 푸른 잎을 입고
  - 초록 잎으로 덮여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘green leaves’의 시각적 이미지를 살리되, 나무가 잎으로 ‘덮인다’는 뜻을 자연스럽게 전달하기 위해 ‘푸른 잎으로 덮여’라고 했습니다.
- source_word: ወይፈሪዩ
  english_pob_choice: bear fruit
  chosen_korean: 열매를 맺는
  alternatives_korean:
  - 열매를 맺고
  - 과실을 맺는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 나무의 결실을 직접적으로 나타내는 관용적 표현이므로 ‘열매를 맺다’를 택했습니다.
- source_word: ወለበዉ በእንተ ኵሉ
  english_pob_choice: understand concerning everything
  chosen_korean: 만물을 두고 이해하며
  alternatives_korean:
  - 모든 것에 관해 이해하며
  - 이 모든 것에 대해 깨달으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 핵심은 창조 질서 전체에 대한 이해이므로, ‘만물을 두고’로 범위를 살리고 ‘이해하다’로 지적 응답을 유지했습니다.
- source_word: ዘሕያው ለዓለም
  english_pob_choice: the Ever-Living One
  chosen_korean: 영원히 사시는 분
  alternatives_korean:
  - 영원히 살아 계신 분
  - 영원하신 이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영원한 생존의 속성을 하나님께 돌리는 해석을 반영하되, 자연스러운 한국어 경어 표현으로 ‘영원히 사시는 분’이라 옮겼습니다.
theological_decisions:
- issue: 마지막 구절의 주어가 ‘영원히 사시는 분’인지, 아니면 ‘영원히 사는 자들/생명’인지
  chosen_reading: 하나님을 가리키는 ‘영원히 사시는 분’으로 이해했습니다.
  alternative_readings:
  - ‘영원한 생명을 위한 것’으로 이해
  - ‘영원히 사는 생명체’를 가리킨다고 보기
  rationale: 본문의 결론은 창조 질서를 관찰하여 창조주를 인식하라는 데 있으며, POB 개정도 ‘He who lives forever’로 읽도록 정리하고 있으므로 그 흐름을 따랐습니다.
  doctrine_reference: 창조주 인식의 신학적 독해를 보존합니다.
