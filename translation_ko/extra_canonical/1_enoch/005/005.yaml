base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/005.yaml
  text: And because of this[a], you will curse your days, and you will shorten the years of your life; and the years of your destruction will increase in an eternal curse[b], and there will be no mercy for you.
  footnotes:
  - marker: a
    text: The clause 'the years of your destruction will increase' is textually difficult. The underlying noun may also be understood as 'ruin' or 'perishing,' yielding 'the years of your ruin will increase.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and the years of your life will perish'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 때문에[a] 너희는 자기 날들을 저주하고, 너희 생명의 해들을 줄이게 될 것입니다. 너희 파멸의 해들은 영원한 저주 속에서 더 많아질 것이며[b], 너희에게는 긍휼이 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 접속사는 앞선 책망에 대한 인과를 표시하므로, ‘이 때문에’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘파멸’은 본문의 ‘파멸/멸망/무너짐’ 계열 명사를 포괄적으로 살린 번역입니다. 전승상 ‘너희 생명의 해들이 사라질 것이다’로 이해할 여지도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእንተዝ
  english_pob_choice: And because of this
  chosen_korean: 이 때문에
  alternatives_korean:
  - 그러므로
  - 이로 말미암아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞선 선언과의 인과 관계를 분명히 드러내면서도, 한국어에서 자연스럽고 문맥 의존성이 낮은 원인 표지를 살렸습니다.
- source_word: መዋዕሊክሙ
  english_pob_choice: your days
  chosen_korean: 너희 날들
  alternatives_korean:
  - 너희의 날들
  - 너희 세월
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 심판 문맥에서 ‘날들’은 단순한 기간보다 삶의 시간 자체를 가리키는 압축된 표현이므로, 직역성을 유지했습니다.
- source_word: ትኃጕሉ
  english_pob_choice: you will destroy / you will shorten
  chosen_korean: 줄이게 될 것입니다
  alternatives_korean:
  - 단축하게 될 것입니다
  - 짧아지게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어진 어형은 2인칭 능동으로, 당사자들이 자기 생명의 기간을 해치거나 잃는 책임을 지는 뜻을 담습니다. 한국어에서는 자연스럽게 ‘줄이다’로 옮겨 능동성을 살렸습니다.
- source_word: ዓመታት ኀጕልክሙ
  english_pob_choice: the years of your destruction
  chosen_korean: 너희 파멸의 해들
  alternatives_korean:
  - 너희 멸망의 해들
  - 너희 파괴의 해들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘파멸’은 ruin/destruction의 심판적 뉘앙스를 유지하면서도 한국어에서 자연스럽고, 앞절의 ‘생명의 해들’과 대조를 이룹니다.
- source_word: በርገመት ዘለዓለም
  english_pob_choice: in an eternal curse
  chosen_korean: 영원한 저주 속에서
  alternatives_korean:
  - 영원한 저주 아래
  - 영원한 저주 안에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사적 구문을 한국어에서 자연스럽게 풀어, 저주가 처해 있는 상태를 분명히 했습니다. ‘영원한’은 ዘለዓለም의 지속성과 종결 불가능성을 보존합니다.
- source_word: ሣህል
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은혜
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단어는 단순한 친절보다 구제적 연민의 부재를 말하므로, 한국어에서 성경적 어감이 강한 ‘긍휼’이 가장 직접적입니다.
theological_decisions:
- issue: 문장의 주체가 ‘너희’인지, ‘너희의 날들/해들’인지
  chosen_reading: 너희가 자기 날들과 생명의 해들을 손상시키는 능동적 진술로 읽었습니다.
  alternative_readings:
  - 날들과 해들이 스스로 짧아지는 수동적 진술
  - 불특정한 저주가 외부에서 임하는 진술
  rationale: 게에즈 동사의 2인칭 복수 능동형을 살려, 심판 아래 놓인 자들의 자기 파멸 책임을 보존했습니다. 이는 영어 POB의 최종 수정 방향과도 일치합니다.
  doctrine_reference: 본문의 문법적 능동성을 보존하여 책임성과 심판의 긴장을 흐리지 않습니다.
- issue: ‘긍휼이 없을 것입니다’의 최종성
  chosen_reading: 긍휼의 완전한 부재를 선포하는 종결 진술로 읽었습니다.
  alternative_readings:
  - 긍휼이 드물게 될 것이라는 완화된 뜻
  - 일시적으로 긍휼이 없다는 뜻
  rationale: 문맥상 종말론적 저주 선언이므로, ‘없을 것입니다’로 최종적 단절을 분명히 했습니다.
  doctrine_reference: 심판 선언의 강도를 약화시키지 않고 원문의 절박함을 유지합니다.
