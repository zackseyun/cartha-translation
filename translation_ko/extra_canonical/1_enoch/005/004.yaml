  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지속적 충성의 실패라는 뜻을 살려, 단순 감정적 참음보다 ‘견디다’로 옮겼습니다.
- source_word: ትእዛዘ እግዚእ
