  - 완고한 마음 때문에
  - 마음이 완악하기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관용구의 인격적 완고함을 드러내기 위해 ‘마음이 완고하다’로 자연스럽게 풀었습니다.
- source_word: ኢትከውኑክሙ ሰላም
  english_pob_choice: you will have no peace
  chosen_korean: 평강이 없을 것입니다
  alternatives_korean:
