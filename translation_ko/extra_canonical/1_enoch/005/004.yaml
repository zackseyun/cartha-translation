  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 선언의 성격을 살려 내적 안정만이 아니라 전반적 복리를 포함하는 ‘평강’을 유지했습니다.
theological_decisions:
- issue: ‘peace’의 범위
  chosen_reading: ‘평강’은 단순한 마음의 평온이 아니라, 심판 아래 놓인 전체적 복리와 형통의 부재를 가리키는 것으로 보았습니다.
  alternative_readings:
  - 마음의 평안
  - 평화
  - 번영
  rationale: 문맥이 저주/심판 선언이므로, ‘평강’의 성경적 넓이를 줄이지 않고 유지하는 것이 가장 적절합니다.
  doctrine_reference: 판결적 선언의 의미 범위를 축소하지 않고 보존
- issue: ‘his greatness’의 뉘앙스
  chosen_reading: ‘그의 위대함’으로 직역해 하나님의 높으심을 드러냈습니다.
  alternative_readings:
  - 그의 위엄
  - 그의 영광
  rationale: Ge'ez가 가리키는 것은 하나님의 숭고한 지위이며, 본문이 더 구체적인 용어를 요구하지 않으므로 직역성을 우선했습니다.
  doctrine_reference: 의도된 긴장 유지 및 어휘 일관성
