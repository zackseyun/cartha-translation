  - 주님의 계명
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단수형 명령을 반영해 복수적·관용적 ‘계명’보다 직접적인 ‘명령’으로 옮겼습니다.
- source_word: ሐመይክሙ ዓበይተ ወድሩካተ ቃላተ
  english_pob_choice: spoken proud and harsh words
  chosen_korean: 교만하고 거친 말을 했습니다
  alternatives_korean:
  - 오만하고 거친 말을 했습니다
  - 뻔뻔하고 거친 말을 했습니다
  - 교만하고 모진 말을 했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘교만한’과 ‘거친’의 두 형용사를 살리되, 한국어에서 자연스러운 비난 표현으로 정리했습니다.
- source_word: በ*አፈ፡ ርኵሳት
  english_pob_choice: with your unclean mouths
  chosen_korean: 더러운 입으로
  alternatives_korean:
  - 부정한 입으로
  - 더럽혀진 입으로
  - 불결한 입으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 입술/입의 도덕적·제의적 부정성을 보존하기 위해 ‘더러운’으로 번역했습니다.
- source_word: ዕበዩ ዚአሁ
  english_pob_choice: his greatness
  chosen_korean: 그의 위대함
  alternatives_korean:
  - 그의 위엄
  - 그의 존엄
  - 그의 장엄함
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 직역성을 살려 ‘위대함’을 택하되, ‘위엄’보다 더 넓은 숭고함을 유지했습니다.
- source_word: ይቡሳነ ልብ
  english_pob_choice: Hard of heart
  chosen_korean: 마음이 완고하기
  alternatives_korean:
