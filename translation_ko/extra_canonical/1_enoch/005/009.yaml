translation:
  language: ko
  text: 그들은 다시는 죄를 짓지 않을 것이며, 평생 동안 정죄받지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 더 이상 죄를 짓지 않을 것입니다.’ Ge'ez는 반복·지속의 뉘앙스를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 생애의 모든 날 동안’. 원문은 복수 소유자와 함께 단수 ‘생명’ 표현을 쓰는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 이전 번역은 ‘다시는 죄를 짓지 않고, 평생 동안 정죄받지 않을 것이다’로도 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወኢይደግሙ፡ አብሶ
  english_pob_choice: And they shall not again sin
  chosen_korean: 그들은 다시는 죄를 짓지 않을 것이며
  alternatives_korean:
  - 그들은 더 이상 죄를 짓지 않을 것이며
  - 그들은 죄를 다시 범하지 않을 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 반복·계속 부정 뉘앙스를 한국어 ‘다시는’으로 살렸고, POB가 이 구절을 단순히 ‘sin’으로 유지한 판단에 맞춰 과도한 해석 없이 번역했습니다.
- source_word: ኢይትኴነኑ
  english_pob_choice: they shall not be condemned
  chosen_korean: 정죄받지 않을 것입니다
  alternatives_korean:
  - 유죄 판결을 받지 않을 것입니다
  - 판결받지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적·판정적 의미를 살리기 위해 ‘정죄받다’를 택했으며, 단순한 처벌보다 선언적 판단의 힘을 더 분명히 드러냅니다.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቶሙ
  english_pob_choice: all the days of their life
  chosen_korean: 평생 동안
  alternatives_korean:
  - 그들의 생애의 모든 날 동안
  - 그들 삶의 모든 날 동안
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘모든 날’의 셈어적 관용을 한국어의 자연스러운 시간 표현 ‘평생 동안’으로 옮기되, 의미 범위를 좁히지 않도록 했습니다.
theological_decisions:
- issue: 죄의 중단과 정죄의 부재를 어떻게 구분할지
  chosen_reading: 첫 절반은 행위의 변화(다시는 죄를 짓지 않음), 둘째 절반은 법정적 결과(정죄받지 않음)로 구분해 유지했습니다.
  alternative_readings:
  - 둘을 합쳐 ‘더 이상 죄를 짓거나 정죄받지 않을 것’이라고 매끄럽게 묶을 수 있습니다.
  - 둘째 절반을 ‘벌받지 않을 것’으로 완화할 수 있습니다.
  rationale: Ge'ez는 행동과 판결을 병렬로 구분하므로, 한국어도 그 긴장을 유지해야 본문의 윤리적·사법적 대비가 보존됩니다.
  doctrine_reference: 의도된 이중 진술(행위/판결)의 보존
