  rationale: 문맥이 자연계의 고정된 질서를 말하므로, 예배 행위보다 창조 질서에 대한 종속성을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 창조 질서와 섭리에 대한 본문 의미를 보존합니다.
