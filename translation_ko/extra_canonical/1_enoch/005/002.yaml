base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/002.yaml
  text: And his works are before him for every year that shall be[a], and all his works are subject to him and do not change; but as God has ordained[b], so everything is done.
  footnotes:
  - marker: a
    text: Or 'for each coming year.' The Ge'ez phrase points to the continuing course of the years ahead.
    reason: lexical_alternative
  - marker: b
    text: '''Serve him'' may also be understood as ''are ordered for him'' or ''are obedient to him,'' emphasizing creation''s conformity to God''s fixed ordinance.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 일들은 앞으로 올 해마다[a] 그 앞에 있으며, 그의 모든 일들은 그에게 복종하고[b] 변하지 않습니다. 그러나 하나님께서 정하신 대로 모든 것이 이루어집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앞으로 올 각각의 해를 위하여’. 게즈어 표현은 앞으로 이어질 해들의 지속적인 흐름을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘복종하고’는 ‘그에게 질서 있게 놓여 있고’ 또는 ‘그에게 순응하고’로도 이해할 수 있습니다.
    reason: lexical_alternative
