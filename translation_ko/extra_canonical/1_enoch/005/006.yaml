base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/006.yaml
  text: In those days you will give your names to an everlasting curse for all the righteous[a], and the sinners will curse you[d][c][b]; and for you there will be a joining together with sinners.
  footnotes:
  - marker: a
    text: The line likely means that their names will become a formula used when pronouncing curses—an image of public disgrace and judgment.
    reason: lexical_alternative
  - marker: b
    text: The final clause can also be understood as 'you will be counted with the sinners' or 'you will have fellowship with the sinners.'
    reason: alternative_reading
  - marker: c
    text: Or 'your names will be given over'.
    reason: previous_rendering
  - marker: d
    text: Or 'by you the sinners will swear curses'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에는 너희가 모든 의인에게 영원한 저주가 되도록 너희 이름을 내주게 될 것이며, 죄인들이 너희를 저주할 것이고, 너희는 죄인들과 함께 어울리게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 이름을 … 저주가 되도록’은 이름이 실제 저주 문구로 쓰이는 공적 수치의 이미지를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘죄인들과 함께 셈해지다’ 또는 ‘죄인들과 교제하다’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ መዋዕል
  english_pob_choice: In those days
  chosen_korean: 그때에는
  alternatives_korean:
  - 그 날들에는
  - 그 시기에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 시기를 가리키는 관용적 시간 표현으로, 한국어에서는 짧고 자연스러운 ‘그때에는’이 예언적 장조를 유지합니다.
- source_word: ትሁቡ ስመ ዚአክሙ
  english_pob_choice: you will give your names
  chosen_korean: 너희 이름을 내주게 될 것이며
  alternatives_korean:
  - 너희 이름을 주게 될 것이며
  - 너희 이름이 주어지게 될 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘이름’을 단순 소유물이 아니라 공적 용도로 내어주는 뉘앙스로 살리기 위해 ‘내주다’를 택했습니다. 이는 이름이 저주의 공식처럼 쓰인다는 문맥을 반영합니다.
- source_word: በርገመት ዘለዓለም ለኵሉ ጻድቃን
  english_pob_choice: to an everlasting curse for all the righteous
  chosen_korean: 모든 의인에게 영원한 저주가 되도록
  alternatives_korean:
  - 모든 의인 앞에 영원한 저주가 되도록
  - 모든 의인에게 영원한 저주로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 저주가 ‘공식/표현’으로 기능하는 의미를 한국어로는 ‘~가 되도록’이 가장 자연스럽게 드러냅니다. ‘의인’은 지칭 대상을 그대로 보존합니다.
- source_word: ወኪያክሙ ይረግሙ ኃጥኣን
  english_pob_choice: and the sinners will curse you
  chosen_korean: 죄인들이 너희를 저주할 것이고
  alternatives_korean:
  - 죄인들이 너희를 욕할 것이고
  - 죄인들이 너희에게 저주를 퍼부을 것이고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 본문에서 ኪያክሙ는 직접목적어이므로 ‘너희를’로 옮겼습니다. English POB의 ‘curse you’에 맞춰 주어-목적어 관계를 분명히 했습니다.
- source_word: ተኅቡረ ምስለ ኃጥኣን
  english_pob_choice: a joining together with the sinners
  chosen_korean: 죄인들과 함께 어울리게 될 것입니다
  alternatives_korean:
  - 죄인들과 함께 결합되게 될 것입니다
  - 죄인들과 함께 한패가 되게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명사구의 결합/동류화 의미를 살리되, 현대 한국어에서 자연스러운 결과 상태를 위해 ‘어울리다’를 썼습니다. 다만 도덕적 동조의 뉘앙스도 남겨 둡니다.
theological_decisions:
- issue: ‘이름을 내주다’와 저주 공식의 의미
  chosen_reading: 이 구절은 정죄받는 자들의 이름이 공적 저주 선언에 쓰이는 표식이 된다는 뜻으로 읽었습니다.
  alternative_readings:
  - 그들의 이름이 단순히 망각되거나 삭제된다는 뜻
  - 사람들이 그 이름으로 직접 저주를 맹세한다는 뜻
  rationale: ‘이름’과 ‘영원한 저주’의 결합은 개인의 명성이 저주의 예시가 되는 수치를 드러냅니다. 본문이 허용하는 상징성을 보존하기 위해 의미를 지나치게 평탄화하지 않았습니다.
  doctrine_reference: 의미의 긴장을 보존하고, 상징적-재판적 이미지를 해소하지 않습니다.
- issue: 죄인들과의 ‘함께 어울림’
  chosen_reading: 마지막 절은 단순한 사회적 교제가 아니라, 죄인들과 같은 범주와 운명에 놓이는 것을 암시합니다.
  alternative_readings:
  - 죄인들과 실제로 동참한다는 적극적 의미
  - 단순히 죄인들 가운데 포함된다는 법적 의미
  rationale: 게에즈의 ‘~와 함께’ 구조를 보존하면서도, 문맥상 심판의 동류화가 암시됨을 드러내기 위해 넓게 번역했습니다.
  doctrine_reference: 투명한 애매성을 유지하는 최적 대응입니다.
