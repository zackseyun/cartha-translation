base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/011.yaml
  text: And their four leaders enter first, those who divide the four parts of the year; and after them the twelve leaders of the orders, those who divide the months; and the three hundred and sixty-four heads of thousands, the ones who distinguish the days; and the four that are added with them, the leaders who distinguish the four divisions of the years.
  footnotes:
  - marker: a
    text: Or 'quarters of the year.' The Ge'ez literally says 'four parts/divisions of the year.'
    reason: lexical_alternative
  - marker: b
    text: The number 'three hundred and sixty-four' reflects the schematic 364-day calendar used in the Astronomical Book.
    reason: cultural_note
  - marker: c
    text: The phrase 'distinguish the days' may also be understood as 'mark out' or 'determine' the days.
    reason: lexical_alternative
  - marker: d
    text: Or 'And the four leaders enter first'.
    reason: previous_rendering
  - marker: e
    text: Or 'and the three hundred and sixty-four heads, the ones who distinguish the days'.
    reason: previous_rendering
  - marker: f
    text: Or 'those that distinguish the four divisions of the years'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 네 지도자들이 먼저 들어옵니다. 이들은 해의 네 부분을 나누는 이들입니다.[a] 그 뒤에는 달들을 나누는 질서의 열두 지도자들이 있으며, 날들을 구별하는 삼백육십사 명의 우두머리들이 있습니다.[b][c] 또 그들과 함께 더해진 네 명은 해의 네 분할을 구별하는 지도자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해의 사분기들’. Ge'ez 본문은 문자적으로 ‘해의 네 부분/분할들’이라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘삼백육십사’는 「천문서」에 나타나는 364일 도식력과 관련됩니다.
    reason: cultural_note
  - marker: c
    text: ‘구별하는’은 ‘표시하는’ 또는 ‘결정하는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መራሕያኒሆሙ
  english_pob_choice: their leaders
  chosen_korean: 그들의 지도자들
  alternatives_korean:
  - 그들의 인도자들
  - 그들의 우두머리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 መራሕያን은 ‘이끄는 자들/지도자들’의 뜻이므로, 행정적·우주적 질서를 보여 주는 문맥에서 가장 자연스럽게 ‘지도자들’로 옮겼습니다.
- source_word: ይሌልዩ / ይፈልጥዎሙ
  english_pob_choice: divide / distinguish
  chosen_korean: 나누는 / 구별하는
  alternatives_korean:
  - 분할하는 / 식별하는
  - 가르는 / 판별하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 달력의 구획을 설명하는 반복 동사이므로, 앞부분은 ‘나누는’으로, 날들 부분은 ‘구별하는’으로 살려 구조적 반복과 의미 차이를 함께 반영했습니다.
- source_word: ዘሥርዓታት
  english_pob_choice: of the orders
  chosen_korean: 규정의
  alternatives_korean:
  - 질서의
  - 정해진 순서의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 ‘순서’보다 제정된 배열·규범의 뉘앙스가 있어, 달들을 담당하는 천문적 직무를 드러내는 ‘규정의’로 옮겼습니다.
- source_word: ፲፻ወ፷፬ አርእስት
  english_pob_choice: the three hundred and sixty-four heads
  chosen_korean: 천삼백육십사 명의 우두머리들
  alternatives_korean:
  - 삼백육십사 명의 우두머리들
  - 삼백육십사 개의 우두머리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문 수사는 364를 뜻하므로 그렇게 반영했습니다. አርእስት는 문자적으로 ‘머리들’이지만, 한국어에서는 계층적 의미를 살려 ‘우두머리들’이 더 자연스럽습니다.
- source_word: ፬ መክፈልተ ዓመታት
  english_pob_choice: the four divisions of the years
  chosen_korean: 해의 네 분할
  alternatives_korean:
  - 해의 네 구분
  - 연도의 네 분할
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문자적으로는 ‘해들/연도들의 네 분할’이지만, 이 절의 반복 구조가 일관되므로 한국어에서는 단수화해 ‘해의 네 분할’로 옮겨 달력적 분절을 압축적으로 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 ‘네 명’과 ‘지도자들’의 관계
  chosen_reading: ‘그들과 함께 더해진 네 명은 … 지도자들을 구별하는 자들’로 옮겨, 네 명 자체를 곧바로 ‘지도자들’로 동일시하지 않았습니다.
  alternative_readings:
  - 네 명을 곧바로 ‘해의 네 분할의 지도자들’로 읽기
  - 마지막 구를 부가 설명 없이 단순한 병렬로 처리하기
  rationale: Ge'ez는 마지막 절에서 ‘네 명’과 ‘지도자들’을 함께 두면서 기능을 설명하므로, 이 둘을 무리하게 동일시하지 않고 관계를 드러내는 번역이 본문 구조를 가장 잘 보존합니다.
  doctrine_reference: 본문의 천상적 질서와 직무 구분을 보존
- issue: 수사적·우주적 존재를 구체적 천사로 특정하지 않음
  chosen_reading: 지도자들, 우두머리들, 규정의 담당자들로 옮기되 본문만으로 천사라고 단정하지 않았습니다.
  alternative_readings:
  - 천사들로 명시하기
  - 단순한 달력 표지로 축소하기
  rationale: 이 절은 연·월·일의 분할을 담당하는 질서 있는 존재들을 제시하지만 정체를 직접 밝히지는 않으므로, 본문의 수준을 넘지 않도록 직무 중심 표현을 유지했습니다.
  doctrine_reference: 해석상의 긴장 유지
