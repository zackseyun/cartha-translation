base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/005.yaml
  text: Because of them, people go astray and do not reckon them in the reckoning of all the world; for people err concerning them and do not know them exactly.
  footnotes:
  - marker: a
    text: The Ge'ez wording in the middle of the verse is difficult. The phrase rendered 'in the thought of all the world' may also mean 'in the reckoning/calculation of the whole world.'
    reason: lexical_alternative
  - marker: b
    text: The final word may carry the sense 'carefully' or 'precisely'; thus, 'people do not know them carefully/precisely.'
    reason: lexical_alternative
  - marker: c
    text: Or 'for they lead them astray, and people do not know them exactly.'.
    reason: previous_rendering
  - marker: d
    text: Or 'in the thought of all the world'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들 때문에 사람들은 길을 잃고, 온 세상의 계산에서 그들을 헤아리지 못합니다.[a] 사람들은 그들에 관해 잘못 판단하고, 그들을 정확히 알지 못합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 중간 구절은 난해합니다. 그러나 이 단락의 문맥에서 ሐሳብ은 ‘생각’보다 ‘계산’ 또는 ‘산정’의 뜻으로 읽는 것이 더 적절합니다.
    reason: source_note
  - marker: b
    text: 마지막 말은 ‘정확히’ 외에 ‘세밀하게’ 또는 ‘꼼꼼히’로도 옮길 수 있습니다.
    reason: lexical_alternative
