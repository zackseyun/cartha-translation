theological_decisions:
- issue: 반복되는 ‘그들’의 지시 대상
  chosen_reading: 하늘의 빛들 또는 그들의 정해진 시기·계산을 가리키되, 본문이 직접 말하지 않는 한 구체화하지 않았습니다.
  alternative_readings:
  - 하늘의 법령
  - 보다 추상적인 달력 구분
  rationale: 본 단락의 관심은 우주적 질서의 계산이므로 문맥상 대상은 분명하지만, 원문이 직접 특정 명사를 제시하지 않으므로 한국어에서도 열린 상태를 유지했습니다.
  doctrine_reference: 텍스트가 열어 둔 모호성은 해소하지 않고 보존합니다.
