base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
  footnotes:
  - marker: a
    text: Or, 'the book of your father's hand,' an idiom for a book handed down directly from the father.
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood as 'to all generations forever' or 'to the generations of eternity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and give it'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 내 아들 므두셀라야, 내가 이 모든 것을 네게 말하고 네게 기록하며, 이 모든 것을 네게 드러내고, 그 모든 것에 딸린 책들을 네게 주었습니다. 내 아들아, 세상의 여러 세대에게[a] 그것을 전해 줄 수 있도록, 네 아버지의 손에서 받은 그 책을[b] 지키십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘세상의 세대들에게’입니다. 이 표현은 ‘영원한 모든 세대에게’ 또는 ‘영원의 세대들에게’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘네 아버지의 손의 책’입니다. 아버지에게서 직접 전해진 책이라는 관용적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 접속사를 명령의 병렬로 이해하여 ‘그리고 그것을 전해 주십시오’로 옮길 수도 있습니다. 그러나 여기서는 접속법을 목적, 곧 후대에 전하기 위한 보존으로 이해했습니다.
    reason: previous_rendering
