base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
  footnotes:
  - marker: a
    text: Or, 'the book of your father's hand,' an idiom for a book handed down directly from the father.
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood as 'to all generations forever' or 'to the generations of eternity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and give it'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제, 내 아들 므두셀라야, 내가 너에게 이 모든 것을 말하고, 너를 위해 이것들을 적고, 내가 그 모든 것을 너에게 드러내었으며, 너에게 이 모든 것에 관한 책들을 주었습니다. 내 아들아, 네 아버지의 손에서 받은 그 책을 지키라. 그러면 네가 그것을 세상의 세대들에게 줄 수 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 아버지의 손의 책’이 될 수 있으며, 아버지에게서 직접 물려받는 책이라는 관용구로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 마지막 구절은 ‘세상의 세대들에게’가 아니라 ‘영원한 모든 세대에게’ 또는 ‘영원의 세대들에게’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그것을 주라’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወይእዜኒ
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 지금
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 담화 전환 표지로서 시간적 ‘지금’보다 서술 전환의 ‘이제’가 자연스럽고, 한국어 문맥에서도 권면의 시작을 분명히 합니다.
- source_word: ወልድየ
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 오 내 아들
  - 아들아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1인칭 소유 접미사의 친자적 호칭을 그대로 살리되, 현대 한국어에서 직설적이면서도 자연한 호격으로 옮겼습니다.
- source_word: ወኵሎሙ፡ ከሠትኩ፡ ለከ
  english_pob_choice: and I have revealed them all to you
  chosen_korean: 내가 그 모든 것을 너에게 드러내었으며
  alternatives_korean:
  - 내가 그 모든 것을 너에게 보였으며
  - 내가 그 모든 것을 너에게 밝혔으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘revealed’의 계시적 뉘앙스를 살리기 위해 ‘드러내다’를 택했습니다. 단순한 정보 전달보다 감추어진 내용의 개방을 더 잘 반영합니다.
- source_word: መጽሐፈ፡ እዴሁ፡ ለአቡከ
  english_pob_choice: the book from the hand of your father
  chosen_korean: 네 아버지의 손에서 받은 그 책
  alternatives_korean:
  - 네 아버지의 손에서 온 그 책
  - 네 아버지의 손으로부터 받은 그 책
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘손에서’라는 직역적 이미지를 유지하면서도 한국어로는 전달·전수의 관용적 뜻이 살아나도록 ‘받은’으로 풀었습니다.
- source_word: ወከመ፡ ትሀብ፡ ለትውልደ፡ ዓለም
  english_pob_choice: so that you may give it to the generations of the world
  chosen_korean: 그러면 네가 그것을 세상의 세대들에게 줄 수 있을 것입니다
  alternatives_korean:
  - 그래서 네가 그것을 세상의 세대들에게 줄 것이다
  - 그리하여 네가 그것을 영원의 세대들에게 줄 수 있을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 목적절 ‘so that you may give’의 기능을 살려 결과를 암시하는 ‘그러면’과 가능형을 사용했습니다. ‘세상의 세대들’은 문구의 세계/시대적 범위를 보존합니다.
theological_decisions:
- issue: ‘세상의 세대들’의 범위
  chosen_reading: 원문이 가리키는 세계-세대적 범위를 유지하여, 장래의 모든 세대에 대한 전승을 암시하되 ‘영원’으로 단정하지는 않았습니다.
  alternative_readings:
  - 모든 세대에게 영원히
  - 영원의 세대들에게
  rationale: 게즈어 ለትውልደ፡ ዓለም은 시간적 지속과 세계적 범위를 함께 열어 두므로, 해석을 하나로 봉합하지 않고 원문 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
