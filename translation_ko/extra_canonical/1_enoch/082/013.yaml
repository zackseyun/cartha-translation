  text: 'And these are the names of the leaders who divide the four parts of the year[a], who are appointed: Milkiel, Helemmelek, Meleyal[b], and Narel.'
  footnotes:
  - marker: a
    text: Or 'the four divisions of the year'; the Ge'ez expression is literally 'the four parts of the year.'
    reason: lexical_alternative
  - marker: b
    text: The second and third names are difficult in this OCR witness; the English transliterations follow the Ge'ez forms conservatively rather than reconstructing a more familiar spelling.
    reason: textual_variant
