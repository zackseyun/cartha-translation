base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/009.yaml
  text: And this is the order of the stars[a], those that set in their places, and in their times, and in their festivals[b], and in their months.
  footnotes:
  - marker: a
    text: Or 'stations' for 'places'; the Ge'ez can denote assigned locations within the ordered course of the stars.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in their festivals' reflects calendrical feast-times, not that the stars themselves celebrate; the verse links stellar order with the reckoning of sacred times.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이것이 별들의 질서입니다[a] — 자기의 자리에서, 자기의 때에, 자기의 절기[b]에, 그리고 자기의 달에 들어가는 별들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자리’는 별들의 정해진 위치나 ‘정거장(stations)’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘절기’는 별들이 절기 자체를 기념한다는 뜻이 아니라, 성스러운 달력의 시기와 연결된 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ሥርዓተ
  english_pob_choice: order
  chosen_korean: 질서
  alternatives_korean:
  - 순서
  - 질서 체계
  - 규정
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천문적 배열과 정해진 운행의 의미를 살리기 위해 ‘질서’를 택했습니다. ‘규정’은 너무 법적이고, ‘순서’는 다소 약합니다.
- source_word: በመካናቲሆሙ
  english_pob_choice: in their places
  chosen_korean: 자기의 자리에서
  alternatives_korean:
  - 자기의 장소에서
  - 자기의 위치에서
  - 자기의 정해진 자리에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 별들의 배정된 위치를 가리키므로, 자연스러운 한국어로 ‘자리’가 가장 직접적입니다. 문맥상 ‘정해진’이 암시되지만 본문에는 덧붙이지 않았습니다.
- source_word: በበዓላቲሆሙ
  english_pob_choice: in their festivals
  chosen_korean: 자기의 절기
  alternatives_korean:
  - 자기의 축제
  - 자기의 축일
  - 자기의 명절
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 별들이 절기를 ‘지킨다’기보다 달력상의 절기와 연결된다는 뜻이므로, 한국어에서는 교회적·유대교적 달력 뉘앙스를 살리는 ‘절기’가 적절합니다.
- source_word: በአውራኂሆሙ
  english_pob_choice: in their months
  chosen_korean: 자기의 달에
  alternatives_korean:
  - 자기의 월에
  - 자기의 달들에
  - 자기의 월력에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘months’의 직역으로는 ‘달’이 가장 자연스럽고, 고대 달력의 주기성을 한국어로 간결하게 드러냅니다.
theological_decisions:
- issue: 별들의 질서와 절기 언어를 어떻게 처리할지
  chosen_reading: 천체의 질서를 단순한 자연현상이 아니라 시간의 배치와 절기의 기준과 연결된 표현으로 유지했습니다.
  alternative_readings:
  - 모두를 ‘시기’나 ‘기간’처럼 일반화하기
  - ‘절기’를 빼고 ‘때’와 ‘달’만 남기기
  rationale: 본문은 천체 질서와 성스러운 시간 계산을 함께 묶고 있으므로, ‘절기’를 보존해야 본문의 달력적·예배적 함의가 흐려지지 않습니다.
  doctrine_reference: '번역 원칙: apocalyptic/칼렌더 문맥의 의미 긴장을 평준화하지 않고 드러낸다.'
