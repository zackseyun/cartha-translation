  naturalness: ‘그에게는 … 권세가 있어서, 그것들이 … 하려는 것입니다’는 문장 종결과 인과 관계가 현대 한국어 성경 문체에서 다소 부자연스럽습니다. 유리엘의 권세와 천체들이 비추는 행위를 명시적으로 연결하면 자연스럽고 분명해집니다.
