base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/008.yaml
  text: And they have authority by night and by day in heaven[a], so that they may give light upon humankind—the sun and the moon and the stars and all the powers of heaven[b], which return in their courses.
  footnotes:
  - marker: a
    text: Or 'in their courses.' The Ge'ez expression can denote recurring paths or ordered cycles of heavenly movement.
    reason: lexical_alternative
  - marker: b
    text: Or 'And authority over them is by night and by day in heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 그에게는 밤과 낮에 하늘에서 권세가 있어서, 그것들이 사람들에게 빛을 비추게 하려는 것입니다—해와 달과 별들과, 제각기 제자리로 돌아가는 하늘의 모든 권세들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 순환들/궤도들’도 가능합니다. 게에즈 표현은 하늘의 반복적 운동 경로나 정해진 순환을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그리고 밤과 낮에 하늘에서 그들 위에 권세가 있다’로도 옮길 수 있습니다. 다만 문맥과 문법상 본문은 앞서 언급된 천체들의 순환을 가리키는 읽기가 더 자연스럽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ስልጣነ
  english_pob_choice: authority
  chosen_korean: 권세
  alternatives_korean:
  - 권위
  - 통치권
  - 권한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체를 다스리는 우주적 지배력을 가리키므로, 단순한 권한보다 ‘권세’가 더 자연스럽고 힘 있는 표현입니다.
- source_word: ቦቱ
  english_pob_choice: he has authority
  chosen_korean: 그에게는
  alternatives_korean:
  - 그 위에
  - 그들에게는
  - 그와 함께
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 3인칭 남성 단수 접미로 앞선 유리엘을 가리키므로, 한국어에서는 주어를 보충해 ‘그에게는’으로 권세의 귀속을 드러냈습니다.
- source_word: በሌሊት ወበመዓልት
  english_pob_choice: by night and by day
  chosen_korean: 밤과 낮에
  alternatives_korean:
  - 밤낮으로
  - 밤에나 낮에나
  - 밤과 낮 동안
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복된 전치사의 형식을 한국어에서 과도하게 경직되게 만들지 않으면서, 시간의 전면성을 살렸습니다.
- source_word: በዓስቢሆሙ
  english_pob_choice: in their circuits
  chosen_korean: 제각기 제자리로 돌아가는
  alternatives_korean:
  - 제각기 궤도에서 도는
  - 그들의 순환 안에서 돌아가는
  - 자기 순환에 따라 돌아가는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천문학적 ‘순환/궤도’의 뜻을 살리되, 독자가 이해할 수 있도록 ‘제자리로 돌아가는’으로 풀어 썼습니다.
theological_decisions:
- issue: ‘하늘의 모든 권세들’이 인격적 존재인지 비인격적 천체 질서인지
  chosen_reading: 문맥의 천문학적 질서를 따라 비인격적 우주 질서로 두었습니다.
  alternative_readings:
  - ‘하늘의 모든 권위들’로 더 개인화하여 읽는 해석
  - ‘하늘의 군대’처럼 집합적 존재로 읽는 해석
  rationale: 이 절은 해·달·별과 병렬되는 천체의 질서와 운동을 말하므로, 인격적 천사 존재로 단정하지 않고 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 해석의 긴장을 보존하고, 본문이 명시하지 않는 신학적 구체화를 피합니다.
