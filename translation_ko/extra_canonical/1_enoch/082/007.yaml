theological_decisions:
- issue: ‘그에게’의 지시 대상과 우리엘의 권위 관계
  chosen_reading: 우리엘은 하나님이 받은 명령을 바탕으로 나에게 계시를 전달하는 천상 사자입니다.
  alternative_readings:
  - 우리엘 자신이 직접 명령한 것으로 읽을 수 있습니다
  - 문장을 단순한 서술로만 평평하게 읽을 수 있습니다
  rationale: 원문은 ‘만물의 주께서’가 우리엘에게 하늘 군대에 관한 명령을 주셨다고 말해, 우리엘의 독자적 권위가 아니라 위임된 권위를 강조합니다.
  doctrine_reference: 1 Enoch의 천상 위계와 계시 매개 구조
- issue: ‘숨을 불어넣었습니다’의 이미지 보존
  chosen_reading: 직접적 영감/교훈으로 완화하지 않고, 신체적 동작 이미지를 유지합니다.
  alternative_readings:
  - 가르쳐 주었습니다
  - 영감을 주었습니다
  rationale: 원문은 계시를 전달하는 방식까지 형상적으로 표현하므로, 이를 추상화하면 본문의 묵시적 생동감이 약해집니다.
  doctrine_reference: '묵시문학 번역 원칙: 시각적·신체적 이미지를 보존'
