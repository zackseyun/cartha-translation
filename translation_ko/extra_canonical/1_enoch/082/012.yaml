base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/012.yaml
  text: 'And these are the heads of a thousand: between leader and leader[a], six are added after the station[e][d][c][b]; and their leaders make the distinction.'
  footnotes:
  - marker: a
    text: The wording of this verse is textually and syntactically difficult in the Ethiopic witness. It appears to describe technical divisions within the luminary scheme, possibly involving supplementary units added after a fixed station.
    reason: textual_variant
  - marker: b
    text: Or 'chiefs of the thousand' / 'leaders of the thousand.' The relation of 'heads' to 'the thousand' is not fully clear.
    reason: lexical_alternative
  - marker: c
    text: Or 'their guides separate them' / 'their leaders discern them.'
    reason: lexical_alternative
  - marker: d
    text: Or 'in the midst of the leaders, and leader after leader'.
    reason: previous_rendering
  - marker: e
    text: Or 'heads of the thousand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이것들은 천의 우두머리들입니다.[a] 인도자와 인도자 사이에, 정해진 자리 뒤에 여섯이 더해지며,[b] 그들의 인도자들이 그것들을 구분합니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘천 명을 맡은 우두머리들’. ‘우두머리들’과 ‘천’의 정확한 관계는 게에즈 본문에서 완전히 분명하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정해진 위치 뒤에’, ‘서 있는 자리 뒤에’. 이 표현은 천문 도식 안의 기술적 순서를 가리키는 듯하나, 정확한 세부 사항은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 인도자들이 그것들을 나눕니다’ 또는 ‘식별합니다’. 게에즈 본문은 이 구절의 문법과 구성이 난해합니다.
    reason: textual_variant
