base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/017.yaml
  text: 'And these are the names of the leaders who are under them: Berkael[a], Zelbesael, and another who is added, the head of a thousand, whose name is Helyaseph[c][b]. And the days of the dominion of this one are completed.'
  footnotes:
  - marker: a
    text: The phrase rendered 'another who is added as the head of a thousand' is textually awkward in the Ge'ez and may indicate an additional ranked official appended to the list.
    reason: textual_variant
  - marker: b
    text: Or 'the days of his authority were fulfilled.' The Ge'ez term can denote authority, dominion, or delegated power.
    reason: lexical_alternative
  - marker: c
    text: Or 'and another who is added as the head of a thousand, Helyaseph. And for this one the days of his dominion were completed.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이것들은 그들 아래에 있는 지도자들의 이름입니다. 베르카엘, 젤브사엘, 그리고 하나 더 있는데, 천의 우두머리이며 그의 이름은 헬야세프입니다. 그리고 이 자의 통치의 날들이 끝났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천의 우두머리’는 문자적으로 ‘천의 머리’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘통치’는 ‘권세’나 ‘권위’로도 옮길 수 있습니다.
    reason: lexical_alternative
