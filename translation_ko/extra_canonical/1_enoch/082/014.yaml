base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/014.yaml
  text: And the names of those who lead them are Adnarel[a], Iyasusael, and Elomeel. These three follow after the leaders of the orders, and there are two that follow after the leaders of the orders, which follow after all the leaders of the fixed stations[c][b], who divide the four parts of the year.
  footnotes:
  - marker: a
    text: Or 'the four divisions of the year'; the phrase refers to the calendrical partition of the year in the Astronomical Book.
    reason: lexical_alternative
  - marker: b
    text: The syntax of the middle clauses is difficult, with repeated 'follow after' and multiple groups of leaders. The translation preserves the sequence of the Ge'ez rather than smoothing it into a fully resolved hierarchy.
    reason: textual_variant
  - marker: c
    text: Or 'and there are two that follow after the leaders of the orders'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들을 인도하는 자들의 이름은 아드나렐, 이야수사엘, 그리고 엘로메엘입니다. 이 셋은 질서의 지도자들 뒤를 따르며, 질서의 지도자들 뒤를 따르는 이가 하나 있습니다. 그는 고정된 자리의 모든 지도자들 뒤를 따르며, 그들은 해의 네 부분을 나눕니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해의 네 분할들’; 이 표현은 『천문서』에서 한 해를 칸처럼 나누는 달력적 구분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘질서의 지도자들 뒤를 따르는 이가 하나 있습니다’.
    reason: previous_rendering
  - marker: c
    text: 중간 절의 문법은 반복되는 ‘뒤를 따르다’와 여러 무리의 지도자가 겹쳐 있어 난해하므로, 한국어는 게에즈어의 진행 순서를 따라 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: አስማቲሆሙ
  english_pob_choice: the names of those who lead them
  chosen_korean: 그들을 인도하는 자들의 이름은
  alternatives_korean:
  - 그들의 이름은
  - 그들을 이끄는 자들의 이름은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유 접미사가 붙은 복수 표현을 한국어에서는 자연스럽게 ‘...하는 자들의 이름’으로 풀어, 이어지는 이름 목록을 도입했습니다.
- source_word: ይመርሃዎሙ
  english_pob_choice: lead them
  chosen_korean: 인도하는
  alternatives_korean:
  - 이끄는
  - 지도하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체적 질서 속의 위계적 인도를 나타내므로, 단순한 안내보다 ‘인도하다’가 원문의 기능을 더 잘 살립니다.
- source_word: መራሕያነ / ሥርዓታት
  english_pob_choice: leaders of the orders
  chosen_korean: 질서의 지도자들
  alternatives_korean:
  - 질서들의 지도자들
  - 규정된 질서의 지도자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 우주적·천문학적 배열을 가리키므로, ‘orders’를 직역하기보다 ‘질서’로 옮겨 구조적 의미를 드러냈습니다.
- source_word: ምቅዋማት
  english_pob_choice: fixed stations
  chosen_korean: 고정된 자리
  alternatives_korean:
  - 정해진 위치
  - 고정된 거처
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천문학적 정위(定位)를 가리키는 표현이어서, ‘station’의 느낌을 살리되 한국어에서는 ‘자리’가 가장 간결하고 자연스럽습니다.
- source_word: ክፍለ ለዓመት
  english_pob_choice: the four parts of the year
  chosen_korean: 해의 네 부분
  alternatives_korean:
  - 한 해의 네 부분
  - 해의 네 분할
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문자적으로는 ‘연도의 네 부분’이지만, 한국어에서는 ‘해’가 더 자연스럽고, 분기적 분할이라는 뜻을 유지할 수 있습니다.
theological_decisions:
- issue: 이름을 번역하지 않고 음역할지 여부
  chosen_reading: 세 존재의 이름은 해설적 번역 없이 음역으로 제시했습니다.
  alternative_readings:
  - 의미를 추정해 별칭으로 번역하기
  - 일부를 교정적으로 정리하기
  rationale: 이 본문은 천체/천사적 관리자의 고유명을 열거하는 형식이므로, 이름을 해석어로 바꾸면 본문의 식별 기능이 약화됩니다.
  doctrine_reference: Translate titles; transliterate names.
- issue: 계층적 반복 구문을 얼마나 매끈하게 정리할지
  chosen_reading: ‘뒤를 따르며’라는 반복을 남겨 원문의 중첩 구조를 보존했습니다.
  alternative_readings:
  - 한국어에서 더 자연스럽게 한 번만 풀어쓰기
  - 위계를 도식화해 재구성하기
  rationale: 영문 POB의 감사 주석이 지적하듯 중간 절은 의도적으로 난해하므로, 구조를 과도하게 매끈하게 만들지 않았습니다.
  doctrine_reference: Preserve source tensions unless the source resolves them.
