base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/018.yaml
  text: The second leader after him is Helemmelek[c][b][a], whose name they call the Sun.
  footnotes:
  - marker: a
    text: 'The naming formula is literal: ''whose name is called the Sun.'' English could also be smoothed to ''who is called the Sun.'''
    reason: lexical_alternative
  - marker: b
    text: The personal name Hēlʾəmməlēk is transliterated from the Ge'ez and its precise vocalization is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'Hēlʾəmməlēk, whose name is called'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 다음의 둘째 지도자는 헤렘메렉이며, 그의 이름을 사람들은 태양이라고 부릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
