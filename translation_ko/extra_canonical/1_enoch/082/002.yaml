base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/002.yaml
  text: Wisdom I have given to you[a], and to your children, and to those who shall be your children, so that they may give this wisdom, which is beyond their understanding[c][b], to their children throughout the generations.
  footnotes:
  - marker: a
    text: The clause 'and to those who shall be your children' reflects a bracketed reading in the supplied Ethiopic witness and may indicate future descendants more generally.
    reason: textual_variant
  - marker: b
    text: 'Or ''in their minds.'' The Ethiopic expression is somewhat literal: ''upon their thought/understanding.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'And wisdom I have given to you, and to your children, and to those who shall be your children, so that they may give it to their children through the generations—this wisdom upon their thought.'.
    reason: previous_rendering
translation:
  language: ko
  text: 지혜를 내가 너희에게, 너희 자녀에게, 그리고 너희의 자녀가 될 이들에게 주었습니다[a]. 이는 그들이 이 지혜를, 그들의 이해를 넘어서는 이 지혜를[b][c], 대대로 자기 자녀에게 주게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 괄호 친 구문은 에티오피아어 본문 전승의 변이로 보이며, 더 넓은 미래 세대를 가리킬 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘그들의 생각/이해 위에’에 가깝습니다. 여기서는 의미를 따라 ‘이해를 넘어서는’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 단순한 인지 능력이 아니라, 인간의 이해를 초월하는 지혜를 가리킬 수 있습니다.
    reason: theological_note
