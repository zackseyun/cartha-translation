theological_decisions:
- issue: 지혜의 내용 범위
  chosen_reading: 본문은 지혜를 대대로 전수되는 하늘의 가르침으로 말하며, 이 구절 자체에서는 그 내용을 일반적인 ‘지혜’로 유지합니다.
  alternative_readings:
  - 천문학적/달력적 지식
  - 실용적 통찰
  rationale: 『빛들의 책』 문맥상 구체 내용은 달력·천문 지시를 포함할 수 있으나, 본절의 어휘는 더 넓은 ‘지혜’를 사용하므로 그 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 세부 내용을 규정하되 번역이 미리 축소하지 않음.
