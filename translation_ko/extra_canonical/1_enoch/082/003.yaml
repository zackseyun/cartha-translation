base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/003.yaml
  text: And those who understand shall not sleep[a], but shall listen with their ears so as to learn this wisdom[d][c][b]; and it will be sweeter to them than good food is to those who eat.
  footnotes:
  - marker: a
    text: The Ge'ez wording about the ears is difficult; it likely means becoming dull or unresponsive in hearing rather than literal deafness.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause uses food imagery for receiving wisdom: wisdom is portrayed as more pleasing than fine things to eat.'
    reason: cultural_note
  - marker: c
    text: Or 'or be sluggish in their ears'.
    reason: previous_rendering
  - marker: d
    text: Or 'it will be sweeter than good food for those who eat it'.
    reason: previous_rendering
translation:
  language: ko
  text: 이해하는 이들은 잠들지 않고, 이 지혜를 배우기 위해 귀를 기울일 것입니다. 이 지혜는 좋은 음식이 먹는 이들의 마음에 드는 것보다 그들의 마음에 더 들 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge‘ez의 표현은 직역하면 ‘귀로 갈망하다’에 가까운 어려운 관용구입니다. 여기서는 둔감함이 아니라, 지혜를 배우기 위해 주의 깊게 듣는다는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 비교는 이 지혜가 그들의 마음에 드는 정도가, 좋은 음식이 먹는 이들의 마음에 드는 정도보다 더 크다는 뜻입니다.
    reason: cultural_note
