theological_decisions:
- issue: 지혜 수용의 신체적 은유 보존
  chosen_reading: 지혜를 배우기 위해 귀를 기울이고, 음식보다 더 좋고 맞는 것으로 묘사되는 수용의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘열심히 듣는다’처럼 평이하게 풀어 쓰기
  - ‘더 달콤할 것입니다’처럼 맛의 은유로만 한정하기
  rationale: 이 절은 계시된 지혜를 듣고 배우는 몸의 은유를 통해 강조하므로, 상징을 약화시키지 않는 쪽이 본문의 수사와 장르에 더 충실합니다.
  doctrine_reference: '번역 원칙: 묵시-지혜 문체의 이미지와 긴장 보존'
- issue: ‘더 맞고 기분 좋을 것입니다’의 의미 범위
  chosen_reading: ‘맛있다’로 단순화하지 않고, 지혜가 음식보다 더 적절하고 기분 좋게 여겨진다는 의미를 반영했습니다.
  alternative_readings:
  - ‘더 달콤할 것입니다’
  - ‘더 맛있을 것입니다’
  rationale: Ge‘ez 동사는 단순한 단맛보다 ‘적절함/호감’을 가리키므로, 비교의 핵심을 살리되 한국어에서 오해 없이 읽히도록 조정했습니다.
  doctrine_reference: '어휘-의미 구분: 맛의 은유와 적합성의 표현'
