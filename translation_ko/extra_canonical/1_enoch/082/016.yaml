base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/016.yaml
  text: 'And these are the signs of the days that appear on the earth in the days of his dominion: heat and warmth and calm[a]; and all the trees bear fruit, and leaves come forth on all the trees, and the harvest of wheat, and the blossom of the rose, and every flower that comes forth in the field[f][e][d][c][b]; but the trees of winter dry up.'
  footnotes:
  - marker: a
    text: Or 'are shown on the earth'; the Ge'ez verb has a showing/appearing sense.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in the days of his dominion' likely refers to the ruling period of the luminary under discussion in the surrounding context, but the verse itself leaves the pronoun implicit.
    reason: cross_reference
  - marker: c
    text: The term rendered 'calm' is uncertain; it may denote a pleasant or gentle climatic condition.
    reason: lexical_alternative
  - marker: d
    text: The word rendered 'field' can elsewhere mean wilderness or open country; here the vegetation imagery favors 'field.'
    reason: lexical_alternative
  - marker: e
    text: The plant name rendered 'rose' is a traditional identification and may refer more broadly to a flowering plant.
    reason: lexical_alternative
  - marker: f
    text: Or 'heat and warmth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이것들은 땅에 나타나는 날들의 표징입니다. 곧 그의 통치의 날들에 — 땀과 열기와 고요가 있으며[a]; 모든 나무가 열매를 맺고, 모든 나무에 잎이 돋아나며, 밀의 수확과 장미의 꽃피움과 들에 나오는 모든 꽃이 있습니다[f][e][d][c][b]. 그러나 겨울의 나무들은 말라 버립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으스 동사의 감각상 ‘보여지다/드러나다’까지 가능하지만, 문맥상 한국어는 자연스럽게 ‘나타나다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의’가 누구를 가리키는지는 인접 문맥이 보완하지만, 이 절만으로는 명시되지 않습니다.
    reason: cross_reference
  - marker: c
    text: 게으스어 항목은 단순한 온기보다 ‘온화함/쾌적함’ 쪽으로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘들’로 옮긴 말은 여기서 광야보다 식생이 자라는 열린 땅의 이미지를 따릅니다.
    reason: lexical_alternative
  - marker: e
    text: ‘장미’는 전통적 식별이며, 더 넓게는 꽃피는 식물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: f
    text: ‘땀과 열기’로 옮길 수도 있고, 전통 번역처럼 기온적 용어로 풀 수도 있습니다.
    reason: previous_rendering
