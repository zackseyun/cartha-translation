  to: 한 해가 시작될 때, 멜키얄이 먼저 일어나 다스립니다. 그는 ‘타므아데에니’와 ‘해’라는 이름으로 불립니다.[a] 그가 다스리는 통치 기간의 모든 날은 아흔하루입니다.
  rationale: 멜키얄의 음역을 원문에 맞게 바로잡고, ‘먼저’가 ‘일어나다’를 수식한다는 구문을 명료하게 유지했습니다. ‘해’를 통치 기간의 주어로 잘못 연결하지 않고 난해한 명칭 구문 안에 두었으며, 각주를 해당 구문에 직접 연결했습니다. 통치와 기간의 표현은 원문의 인격화된 우주 질서와 아흔하루라는 수량을 보존합니다.
