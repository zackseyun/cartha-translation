  source_fidelity: 원문의 순서상 ‘첫째/먼저’는 ‘일어나다’를 수식하며, ‘해’는 메르키얄의 이름을 말하는 난해한 구문 안에 속합니다. 초안도 이 두 핵심을 대체로 반영했으나, ምልኪያል의 음역 ‘메르키얄’은 근거 없이 /r/을 더하므로 ‘멜키얄’로 고쳐야 합니다. 또한 마지막 구절의 ‘그가 다스리는 그의 통치’는 원문의 반복을 보존하려는 의도는 이해되지만 한국어에서 불필요하게 겹칩니다.
  naturalness: ‘해의 시작에’도 이해되지만 ‘한 해가 시작될 때’가 현대 한국어 문장으로 더 자연스럽습니다. ‘처음으로 일어나 다스리는 자는’보다 서술형으로 옮기고, 명칭 구문은 ‘…라는 이름으로 불립니다’로 처리하면 합쇼체의 문체와 문장 연결이 자연스럽습니다.
  terminology: ‘다스리다’와 ‘통치 기간’은 인격화된 천문·달력 질서라는 원문의 표현을 보존합니다. 이름은 영어 POB 및 게에즈 자형에 더 충실하게 ‘멜키얄’로 음역합니다. ‘타므아데에니’는 난해한 명칭이므로 번역하거나 해석하지 않습니다.
