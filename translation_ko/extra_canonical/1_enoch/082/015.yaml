theological_decisions:
- issue: 천문·달력 인격화의 보존
  chosen_reading: 메르키얄이 ‘다스리는’ 표현을 유지해, 달력의 첫 부분이 천상 존재의 통치 아래 놓인 것으로 읽히게 했습니다.
  alternative_readings:
  - 주관하는
  - 맡아 있는
  - 표시하는
  rationale: 이 책의 묵시적 우주관을 흐리지 않기 위해, 달력 기능을 중립적 표지로 평탄화하지 않았습니다.
  doctrine_reference: Apocalyptic imagery should remain intact; do not domesticate personified cosmic order.
