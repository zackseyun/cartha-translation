base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/015.yaml
  text: At the beginning of the year[a], first rises and rules Melkiyal, whose name is called Tam'ade'eni and the sun; and all the days of his dominion, while he rules[c][b], are ninety-one days.
  footnotes:
  - marker: a
    text: The clause after 'Melkiyal' is textually difficult. The Ge'ez appears to give an additional name or designation, here transliterated as Tam'ade'eni rather than translated speculatively.
    reason: textual_variant
  - marker: b
    text: The verse treats the opening segment of the year as a personified period under Melkiyal's rule, totaling ninety-one days.
    reason: cultural_note
  - marker: c
    text: Or "the first, Melkiyal rises and rules—the one whose name is Tam'ade'eni—and the sun and all the days of his dominion, while he rules, are ninety-one days.".
    reason: previous_rendering
translation:
  language: ko
  text: 해의 시작에, 처음으로 일어나 다스리는 자는 메르키얄입니다. 그의 이름은 ‘타므아데에니’와 ‘해’로 불리며, 그가 다스리는 그의 통치의 모든 날은 아흔한 날입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 이름 지정 구문이 본문상 다소 난해하므로, ‘타므아데에니’와 ‘해’를 별개의 호칭으로 두었습니다.
    reason: textual_variant
