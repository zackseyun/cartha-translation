- from: 복된 사람들은 모두 의의 길로 걸어가며 죄인들처럼 죄가 없습니다[a]. 그들의 모든 날의 전체 계산 속에서, 해가 하늘을 지나는 동안, 삼십 일 동안 문으로 들어가고 나가며, 별들의 질서의 수천의 우두머리들과 함께하고, 또 년의 네 부분을 나누는[b][c] 보태어진 넷과 함께하여, 그것들이 그들을 이끌고 넷의 날에 그들과 함께 들어갑니다.
  to: 복됩니다, 의의 길을 걷고 죄인들처럼 죄를 짓지 않는 모든 의인들은[a]. 해가 하늘에서 문들을 통하여 서른 날 동안 들어가고 나가는 동안, 곧 그들의 모든 날을 헤아리는 전체 기간에, 그들은 별들의 질서에 속한 천인대 우두머리들[b]과 해의 네 구획을 나누는 더해진 넷[c]과 함께합니다. 이 넷은 그들을 이끌고, 네 날에 그들과 함께 들어갑니다.
  rationale: 원문의 윤리적 대비와 천문력적·위계적 이미지를 유지하면서, 한국어에서 비교구문이 역전되어 읽히는 문제를 바로잡았습니다. 난해한 ‘천 단위의 우두머리’ 및 추가된 네 단위는 평이하게 해소하지 않고 각각의 각주에 불확실성을 밝혔습니다. 원문이 제공하는 어색한 천문력 서술은 의역으로 재구성하지 않았습니다.
