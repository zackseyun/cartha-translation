theological_decisions:
- issue: 의인들의 죄 없음 진술의 강도
  chosen_reading: 이 구절은 의인들이 ‘죄인들처럼 죄가 없다’는 강한 대비로 옮기되, 절대적 무죄 교리로 풀어 약화시키지 않았습니다.
  alternative_readings:
  - 단순히 죄를 짓지 않는 삶의 묘사
  - 완전한 무죄에 대한 단정
  rationale: 비교구문 ‘죄인들처럼’을 유지해 본문의 강한 윤리적 대비와 묵시적 수사를 함께 보존했습니다.
  doctrine_reference: 본문의 긴장을 유지하고 교리적으로 과잉 정리하지 않음
- issue: 보태어진 네 날의 성격
  chosen_reading: 본문은 해의 네 부분을 나누는 보태어진 네와 그 기능을 가리키는 달력 문맥으로 이해했습니다.
  alternative_readings:
  - OCR 수치를 문자 그대로 따르는 읽기
  - 별의 우두머리들을 가리키는 더 일반적 읽기
  rationale: 문맥상 연간 구분을 이루는 추가 날이라는 이해가 가장 자연스럽고, 수상한 수사 요소는 번역에서 너무 매끈하게 지우지 않았습니다.
  doctrine_reference: 천문력/달력 구조에 대한 본문 내 설명을 우선함
