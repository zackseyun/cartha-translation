  source_fidelity: 초안은 ‘복된/의인/의의 길’, 해의 출입문, 서른 날, 연중 네 구획이라는 핵심 요소를 대체로 보존합니다. 그러나 ‘죄인들처럼 죄가 없습니다’는 한국어상 죄인들에게 죄가 없다는 뜻으로 읽히며 비교 대상이 뒤집힐 수 있습니다. 또한 ‘별들의 질서의 수천의 우두머리들’은 ‘수천(천인대)들의 우두머리’라는 위계적 표현을 충분히 드러내지 못합니다. 원문의 난해한 수사와 네 개의 추가 단위라는 문맥적 읽기는 각주로 명시하되 본문에서 과도하게 단정하지 않도록 수정했습니다.
  naturalness: 초안의 ‘전체 계산 속에서’, ‘년’, ‘넷의 날’은 현대 표준어 문장으로 부자연스럽거나 지시 대상이 흐립니다. ‘모든 날을 헤아리는 전체 기간’, ‘해’, ‘네 날’로 다듬고, 마지막 관계절의 선행사인 ‘더해진 넷’을 명시하여 합쇼체의 자연스러운 서술로 정리했습니다.
  terminology: ‘복됩니다’, ‘의인들’, ‘의의 길’은 묵시문학 및 성서 번역의 격식에 맞게 유지했습니다. ሥርዓት의 단수 ‘질서’와 ‘heads of thousands’의 행정·위계 이미지는 ‘별들의 질서에 속한 천인대 우두머리들’로 반영했습니다. 달력 문맥의 ‘더해진 넷’은 본문에 남기고, 불안정한 수사 문제는 해당 본문 표지의 각주로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘죄인들처럼 죄가 없습니다’의 비교구문
    rationale: 한국어 문법상 ‘죄인들처럼’이 ‘죄가 없다’를 수식하여 죄인들도 죄가 없다는 뜻으로 오독될 수 있습니다. 원문의 의인과 죄인의 대비를 보존하려면 ‘죄인들처럼 죄를 짓지 않는’처럼 동작을 명시해야 합니다.
  - severity: medium
    issue: ‘별들의 질서의 수천의 우두머리들’의 위계 표현
    rationale: 연속 소유격이 부자연스럽고, ‘heads of thousands’가 단순히 수천 명의 우두머리라는 뜻으로 흐려집니다. ‘천인대 우두머리들’이 수천 단위 집단의 우두머리라는 이미지를 더 잘 보존합니다.
  - severity: medium
    issue: 각주 표지와 내용의 대응
    rationale: 초안의 b·c 각주는 모두 달력 표현에 붙어 있으나, 영어 감사 이력에서 난해함이 특별히 지적된 별들의 위계 표현에는 표지가 없습니다. 수정문은 b를 해당 위계 표현에, c를 불안정한 수사와 ‘더해진 넷’에 붙여 각주 대상을 명확히 했습니다.
  - severity: low
    issue: 현대 표준어 및 지시어의 자연스러움
    rationale: ‘년’보다 ‘해’가 이 문맥에서 자연스럽고, ‘그것들’과 ‘넷의 날’은 선행사가 불명확합니다. ‘이 넷’과 ‘네 날’로 명료하게 했습니다.
