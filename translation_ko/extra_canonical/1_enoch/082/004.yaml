base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/004.yaml
  text: Blessed are all the righteous who walk in the path of righteousness and have no sin like sinners[a], in the whole count of all their days, while the sun goes on its course in heaven, entering and going out through the gates for thirty days, together with the heads of the thousands of the order of the stars, and with the four that are added, which divide the four parts of the year[c][b], which lead them and enter with them on four days.
  footnotes:
  - marker: a
    text: The Ethiopic OCR at this point is difficult and appears to show a numeral that may not fit the context. The sense is likely the four additional days that mark the year's four divisions.
    reason: textual_variant
  - marker: b
    text: Or 'the chiefs of the starry orders.' The Ge'ez phrase is numerically and syntactically difficult, so the translation keeps its hierarchical imagery visible rather than smoothing it away.
    reason: lexical_alternative
  - marker: c
    text: Or 'heads of the thousand-order of the stars'.
    reason: previous_rendering
translation:
  language: ko
  text: 복된 사람들은 모두 의의 길로 걸어가며 죄인들처럼 죄가 없습니다[a]. 그들의 모든 날의 전체 계산 속에서, 해가 하늘을 지나는 동안, 삼십 일 동안 문으로 들어가고 나가며, 별들의 질서의 수천의 우두머리들과 함께하고, 또 년의 네 부분을 나누는[b][c] 보태어진 넷과 함께하여, 그것들이 그들을 이끌고 넷의 날에 그들과 함께 들어갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄가 없습니다’는 영어 POB의 ‘have no sin like sinners’를 따른 것으로, 죄인들과의 대비를 보존한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 수사적으로 난해한 대목이어서, 전통적 이해에 따라 ‘보태어진 넷’으로 옮겼습니다.
    reason: textual_variant
  - marker: c
    text: 별도의 차수 표기와 결합된 달력적 표현으로, 연중 네 부분을 나누는 기능을 가리킵니다.
    reason: source_note
