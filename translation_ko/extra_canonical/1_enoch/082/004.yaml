  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 축복 선언의 높임을 살리되, 현대 한국어 합쇼체에서 자연스러운 복수 주어로 옮겼습니다.
- source_word: በፍኖተ ጽድቅ
