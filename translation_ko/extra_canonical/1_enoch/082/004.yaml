  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘길’의 은유를 그대로 살려, 도덕적 행위를 나타내는 이동 이미지를 보존했습니다.
- source_word: በኍልቈ ኵሉ መዋዕሊሆሙ
  english_pob_choice: in the whole count of all their days
  chosen_korean: 그들의 모든 날의 전체 계산 속에서
  alternatives_korean:
  - 그들의 모든 날의 전부 계산 속에서
  - 그들의 모든 날을 헤아린 전체 속에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아스트로노미컬 북의 수적·달력적 등록어를 살려 ‘count’의 계산/헤아림 뉘앙스를 유지했습니다.
- source_word: ምስለ ፲ እለ ይትዌሰኩ
  english_pob_choice: with the four that are added
  chosen_korean: 보태어진 넷과 함께하여
  alternatives_korean:
