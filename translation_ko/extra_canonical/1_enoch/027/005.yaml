theological_decisions:
- issue: ‘축복하다’와 ‘찬양하다’의 구분
  chosen_reading: 첫 동사는 예배적 맥락을 살려 ‘찬양하다’로 옮기고, 뒤의 ‘노래하다/찬송하다’와 중복되더라도 의미를 유지했습니다.
  alternative_readings:
  - 영광의 주님을 축복하였습니다
  - 영광의 주님께 복을 빌었습니다
  rationale: 이 구절은 하나님께 드리는 찬양의 장면이므로, 한국어에서 오해될 수 있는 ‘복을 빌다’보다 예배적 의미가 분명한 표현을 택했습니다.
  doctrine_reference: 예배 언어의 의미 보존; source-direct rendering over traditional domestication
- issue: 불확실한 구절 처리
  chosen_reading: 난점이 있는 중간 구절은 목적어를 확정하지 않고 ‘말하고’로 처리했습니다.
  alternative_readings:
  - 그의 영광을 말하고
  - 그에 관해 말하고
  rationale: 주어진 게즈 본문과 영어 POB 주석이 모두 해당 어구의 확실성이 낮음을 보여 주므로, 한국어도 불확실성을 드러내는 보수적 번역을 유지했습니다.
  doctrine_reference: source uncertainty / textual caution
