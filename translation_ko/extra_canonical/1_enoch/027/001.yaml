    reason: previous_rendering
translation:
  language: ko
  text: 그때 나는 말했습니다. “무슨 까닭으로 이 복된 땅은 온통 나무들로 가득하고, 그 한가운데에는 이 저주받은 골짜기가 있습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 식생 표현은 이 전승에서 다소 난해하므로, ‘나무들로 가득하고’는 풍성한 수목이 덮인다는 뜻을 살린 번역입니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘그 한가운데에’입니다.
    reason: lexical_alternative
