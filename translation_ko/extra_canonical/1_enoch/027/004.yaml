base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/004.yaml
  text: In the days of their judgment they will bless him for the mercy[b][a], according as he has apportioned to them.
  footnotes:
  - marker: a
    text: The final clause leaves the object of 'has apportioned' implicit; it may refer to a measured share, lot, or portion of mercy/blessing.
    reason: lexical_alternative
  - marker: b
    text: Or 'he will bless them with mercy'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 심판의 날에 그들은, 그분이 그들에게 나누어 주신 것에 따라, 자비를 두고 그분을 찬양할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절에서 ‘그분이 그들에게 나누어 주신 것’의 대상은 명시되지 않았으며, 일정한 몫이나 분깃, 또는 자비나 축복의 몫을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그분이 자비로 그들을 축복하실 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: መዋዕለ
  english_pob_choice: days
  chosen_korean: 날
  alternatives_korean:
  - 때
  - 시기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수의 시간 표지를 한국어의 자연스러운 복수 표현인 ‘날’로 옮겨, 종말론적 시간표지를 살리면서도 과도하게 일반화하지 않았습니다.
- source_word: ኵነኔሆሙ
  english_pob_choice: their judgment
  chosen_korean: 그들의 심판
  alternatives_korean:
  - 그들의 판단
  - 그들의 정죄
  - 그들의 형벌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적 사건을 가리키는 폭을 유지하기 위해 ‘심판’을 택했습니다. 이는 정죄나 형벌로 미리 한정하지 않습니다.
- source_word: ይባርክዎ
  english_pob_choice: they will bless him
  chosen_korean: 그들은 그분을 찬양할 것입니다
  alternatives_korean:
  - 그들은 그분을 복을 빌 것입니다
  - 그들은 그분을 축복할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어간과 목적어 표지가 ‘그분을’로 향하므로 주어는 그들이고 대상은 하나님입니다. 문맥상 예배적 응답을 나타내는 ‘찬양하다’가 한국어에서 가장 자연스럽고, ‘축복하다’보다 오해가 적습니다.
- source_word: በምሕረት
  english_pob_choice: for the mercy
  chosen_korean: 자비 때문입니다
  alternatives_korean:
  - 자비로
  - 자비를 위해
  - 은혜로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구를 원인/근거의 의미로 받아 ‘~때문입니다’로 옮겨, 그들이 찬양하는 이유가 자비라는 점을 분명히 했습니다.
- source_word: ከፈሎሙ
  english_pob_choice: he has apportioned to them
  chosen_korean: 그분이 그들에게 나누어 주신 대로 받은
  alternatives_korean:
  - 그분이 그들에게 배정하신 대로
  - 그분이 그들에게 분배하신 대로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘apportioned’의 분배/할당 의미를 살리되, 한국어에서는 자연스럽게 ‘나누어 주신 대로 받은’으로 풀어 원문의 미완결된 목적어 함의를 보존했습니다.
theological_decisions:
- issue: ‘their judgment’의 성격을 어떻게 유지할지
  chosen_reading: ‘심판’으로 넓게 유지해, 이 장면이 정죄만이 아니라 의로운 자들의 재판적 순간일 수 있음을 열어 둡니다.
  alternative_readings:
  - 정죄
  - 형벌
  rationale: 바로 뒤의 찬양과 자비가 이 심판의 결과를 규정하므로, 본문보다 더 좁은 형벌 언어로 미리 확정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ይባርክዎ의 주어-목적어 관계
  chosen_reading: 주어는 ‘그들’, 목적어는 ‘그분’으로 읽어야 하며, 따라서 문맥은 ‘그들이 그분을 찬양한다’입니다.
  alternative_readings:
  - 그분이 그들을 축복하신다
  - 그들이 그들을 축복한다
  rationale: 게에즈 동사의 인칭 표지가 이 관계를 요구하므로, 영어 초안의 수정된 의미를 한국어 본문에 반영했습니다.
  doctrine_reference: 문법적 주어-목적어 관계 보존
