revisions:
- from: 그들의 심판의 날에 그들은 그분을 찬양할 것입니다. 이는 그분이 그들에게 나누어 주신 대로 받은 자비 때문입니다.[a][b]
  to: 그들의 심판의 날에 그들은, 그분이 그들에게 나누어 주신 것에 따라, 자비를 두고 그분을 찬양할 것입니다.[a][b]
  rationale: 원문의 복수 주어와 남성 단수 목적어(‘그들이 그분을’)를 보존하고, 자비가 찬양의 근거라는 관계를 ‘자비를 두고’로 옮겼습니다. 또한 ‘나누어 주신’ 것의 불명시된 목적어를 본문에서 보충하지 않고 각주에서만 설명했습니다. 각주 b는 감사 기록에 보존된 이전 번역을 정확하게 제시하도록 수정했습니다.
