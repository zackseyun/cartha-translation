  - 거룩한 천사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 천상 존재 표현을 자연스러운 현대 한국어로 옮기되, ‘거룩한’의 제의적·천상적 뉘앙스를 유지했습니다.
- source_word: ቃለ ዘኢይደሉ
  english_pob_choice: improper words
  chosen_korean: 부적절한 말
  alternatives_korean:
  - 마땅하지 않은 말
  - 옳지 않은 말
  - 어울리지 않는 말
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 주님 앞에 ‘맞지 않는’ 말을 가리키므로, 도덕적 평가를 유지하면서도 직역투를 피하는 ‘부적절한’이 가장 균형적입니다.
- source_word: ዕፁብተ
  english_pob_choice: hard things
  chosen_korean: 거친 말
  alternatives_korean:
  - 심한 말
  - 무서운 말
  - 충격적인 말
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 주님의 영광에 대한 모욕적·공격적 언사를 가리키므로, 의미를 과잉 확정하지 않으면서도 강도를 살린 표현으로 옮겼습니다.
- source_word: ምኵናኒሆሙ
  english_pob_choice: their place of judgment
  chosen_korean: 그들의 심판의 자리
  alternatives_korean:
  - 그들의 심판 장소
  - 그들의 판결의 자리
  - 그들의 정죄의 자리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 ‘여기’가 장소성을 강하게 만들므로, 단순 추상어보다 ‘자리’로 옮겨 환시의 공간감을 살렸습니다.
theological_decisions:
- issue: 저주와 심판의 대상 표현
  chosen_reading: 골짜기는 영원히 저주받을 자들을 위한 곳으로 제시되며, 그곳은 그들의 최종 심판의 장소입니다.
  alternative_readings:
  - 단순히 불길한 장소로 읽음
  - ‘저주받은 자’의 운명만 강조함
  rationale: 원문은 장소 자체의 저주성과 그 거주자들의 운명을 함께 묶습니다. 둘 중 하나로 약화하지 않고 함께 보존했습니다.
  doctrine_reference: 원문 우선, 의미의 긴장 보존
- issue: ‘거친 말’의 범위
  chosen_reading: 주님과 그분의 영광을 향한 모욕적·불경한 언사를 넓게 가리키는 표현으로 두었습니다.
  alternative_readings:
  - 명시적 ‘신성모독’으로 한정
  - 일반적인 험담으로 완화
  rationale: 원문은 법적 용어를 명시하지 않고 부적절한 말과 거친 말을 병치하므로, 후대의 기술적 범주로 좁히지 않았습니다.
  doctrine_reference: 의미 과도한 축소 금지
