  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시어 ዝየ는 ‘여기/이곳’을 뜻하므로, 시간 표현과 자연스럽게 결합되는 한국어로 옮겼습니다.
- source_word: ምሑራን፡
  english_pob_choice: the wise
  chosen_korean: 지혜로운 이들
  alternatives_korean:
