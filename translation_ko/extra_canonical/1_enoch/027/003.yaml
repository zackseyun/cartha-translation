  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘앞에서’는 공적이고 시각적인 장면을 살리고, [ለዓለም]의 본문 불확실성은 ‘영원히’로 옮기되 별도 각주로 처리했습니다.
- source_word: ኵሎ፡ መዋዕለ፡ ዝየ፡
