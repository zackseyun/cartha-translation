base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/003.yaml
  text: In the latter days this will become for them a spectacle of righteous judgment in the presence of the righteous forever[a]; all the days here the wise will bless the Lord of glory[d][c][b], the eternal King.
  footnotes:
  - marker: a
    text: The word rendered 'forever' is textually uncertain in this witness (shown bracketed in the source). It may belong with the phrase 'in the presence of the righteous' or reflect a variant reading.
    reason: textual_variant
  - marker: b
    text: '''Spectacle'' renders a term that can also mean ''sign,'' ''appearance,'' or ''example.'' The sense here is of a visible display of judgment.'
    reason: lexical_alternative
  - marker: c
    text: '''This age'' could also be rendered ''this world,'' but the apocalyptic contrast between present age and coming judgment favors ''age.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'all the days of this age the wise will bless'.
    reason: previous_rendering
translation:
  language: ko
  text: 후일에 이 일은 그들에게 의로운 심판의 표상이 되어, 의인들 앞에서 영원히 있게 될 것입니다. 이곳의 모든 날 동안 지혜로운 이들은 영광의 주님, 영원한 왕을 찬양할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 [ለዓለም]은 전승상 불확실하여, ‘영원히’가 의인들 앞에 걸리는지 또는 다른 구문에 속하는지 단정하기 어렵습니다.
    reason: textual_variant
lexical_decisions:
- source_word: በዳኃሪ፡ መዋዕል፡
  english_pob_choice: In the latter days
  chosen_korean: 후일에
  alternatives_korean:
