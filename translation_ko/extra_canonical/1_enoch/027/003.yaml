  rationale: 이 단어는 ‘가르침 받은 자들’ 계열의 의미가 있지만, 문맥상 경건한 지혜의 공동체를 가리키므로 ‘지혜로운 이들’이 가장 무난합니다.
- source_word: ለ*እግዚአ፡ ስብሐት፡ ንጉሥ፡ ዘለዓለም።
