  chosen_korean: 의로운 심판의 표상
  alternatives_korean:
  - 의로운 심판의 광경
  - 의로운 심판의 보임
  - 의로운 심판의 예표
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아리야는 단순한 ‘예’보다 눈에 보이는 ‘모습/표상’의 뜻이 강하고, 심판의 공개적 가시성을 유지하면서도 한국어에서 과도하게 낯설지 않게 옮겼습니다.
- source_word: በቅድመ፡ ጻድቃን፡ [ለዓለም፡]
  english_pob_choice: in the presence of the righteous forever
  chosen_korean: 의인들 앞에서 영원히
  alternatives_korean:
  - 의인들의 앞에서
  - 의인들 면전에서 영원히
