  rationale: 종말론적 미래 시점을 가리키므로, 자연스러우면서도 예언적 뉘앙스를 살리는 ‘후일에’를 택했습니다.
- source_word: አርአያ፡ ኵነኔ፡ ዘበ፡ ጽድቅ፡
