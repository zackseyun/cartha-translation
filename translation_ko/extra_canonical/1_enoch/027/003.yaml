theological_decisions:
- issue: '후반부 동사의 화행: 축복/찬양의 의미'
  chosen_reading: 지혜로운 이들은 영광의 주님, 영원한 왕을 찬양할 것입니다
  alternative_readings:
  - 지혜로운 이들은 …을 축복할 것입니다
  - 지혜로운 이들은 …을 송축할 것입니다
  rationale: 에티오피아어 ይባርክዎ는 문자적으로 ‘축복하다’이지만, 한국어에서는 하나님께 드리는 응답을 ‘찬양하다’로 옮겨도 의미를 해치지 않으며 예배적 문맥을 자연스럽게 전달합니다.
  doctrine_reference: 예배 언어의 관용적 번역; 하나님을 향한 인간의 응답을 한국어로 자연화
