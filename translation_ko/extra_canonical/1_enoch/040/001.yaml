  naturalness: ‘수천의 수천과 만만의 만만’은 현대 일상어는 아니나 묵시문학의 정형적 수사로서 자연스럽게 수용될 수 있습니다. ‘그 수와 셈을 헤아릴 수 없었고’는 기존 문장보다 자연스럽고, ‘그들은 … 서 있었습니다’는 합쇼체 환상 서술에 적절합니다.
