theological_decisions:
- issue: 『Lord of Spirits』의 한국어 신적 칭호 형식
  chosen_reading: ‘영들의 주님’으로 유지했습니다.
  alternative_readings:
  - ‘영들의 주님’ 대신 ‘영들의 주’
  - ‘영들의 주님’ 대신 ‘영들의 주님’의 음역화
  rationale: 이 문맥에서 이는 천상 보좌 앞에 서는 분을 가리키는 고정된 신적 칭호이므로, 지나친 평어화 없이 합쇼체로 보존했습니다.
  doctrine_reference: Translation philosophy §2 (Translate titles; transliterate names).
- issue: 누적 수사 표현의 처리
  chosen_reading: ‘수천의 수천과 만만의 만만’처럼 반복 구조를 살렸습니다.
  alternative_readings:
  - ‘셀 수 없이 많은’으로 완화
  - ‘무수한 무리’로 의역
  rationale: 원문의 셈법적 반복이 환상적 규모를 형성하므로, 의미를 약화시키는 일반화는 피했습니다.
  doctrine_reference: 'North-star principle: source-direct rendering with auditable reasoning.'
