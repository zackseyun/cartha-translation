  to: 그리고 나는 영들의 주님의 네 사방에서[c] 잠들지 않는 이들과 다른 네 얼굴을 보았습니다. 나는 그들의 이름을 알게 되었습니다. 나와 함께 온 천사가 그들의 이름을 내게 알려 주고 감추어진 모든 것을[b] 보여 주었기 때문입니다.
