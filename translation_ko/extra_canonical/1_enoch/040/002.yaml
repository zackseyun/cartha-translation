base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/002.yaml
  text: And on the four sides of the Lord of Spirits I saw four other faces[a], different from those who do not sleep. And I learned their names[c][b], for the angel who came with me made their names known to me and showed me all the hidden things.
  footnotes:
  - marker: a
    text: Or 'four other faces.' The Ge'ez keeps the imagery at the level of visible 'faces,' not a more abstract term.
    reason: lexical_alternative
  - marker: b
    text: '''The hidden things'' can also be rendered ''the secret things,'' a common apocalyptic expression for heavenly mysteries disclosed in a vision.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And beside the four wings of the Lord of Spirits I saw another four faces, different from those, which do not sleep.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 영들의 주님의 네 사방에서[c] 잠들지 않는 이들과 다른 네 얼굴을 보았습니다. 나는 그들의 이름을 알게 되었습니다. 나와 함께 온 천사가 그들의 이름을 내게 알려 주고 감추어진 모든 것을[b] 보여 주었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘감추어진 모든 것’은 ‘비밀스러운 것들’로도 옮길 수 있습니다. 묵시문학에서 이는 하늘의 비밀이 계시되는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 이전 번역처럼 ‘영들의 주님의 네 날개에’로 읽을 수도 있으나, 여기서는 ክነፍ를 공간적 ‘사방’으로 이해했습니다.
    reason: previous_rendering
