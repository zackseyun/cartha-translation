  naturalness: ‘나는 그 네 얼굴의 목소리를 들었는데, 그들이 … 있었습니다’는 문장이 불필요하게 두 절로 나뉘고 ‘-는데’가 문장을 미결 상태로 만듭니다. ‘그 네 얼굴들이 … 찬양하는 목소리를 들었습니다’로 하면 한국어 문장 흐름과 원문의 동시성을 함께 살릴 수 있습니다. ‘얼굴들이 목소리를 낸다’는 의도적으로 낯선 환시 표현이지만, 설명 각주가 있으므로 평탄화하지 않는 편이 낫습니다.
