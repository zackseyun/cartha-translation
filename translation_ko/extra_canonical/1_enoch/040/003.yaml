base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/003.yaml
  text: And I heard the voices of those four beings as they gave praise before the Lord of glory[a][b][c].
  footnotes:
  - marker: a
    text: Literally, 'those four faces.' The phrase likely refers to the four heavenly figures seen in the vision rather than to faces in isolation.
    reason: lexical_alternative
  - marker: b
    text: The title can also be rendered 'Lord of splendor.'
    reason: lexical_alternative
  - marker: c
    text: Or 'those four presences'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 그 네 얼굴의 목소리를 들었는데, 그들이 영광의 주 앞에서 찬양하고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 네 얼굴’입니다. 여기서는 분리된 얼굴이 아니라 환시에서 본 네 하늘 존재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영광의 주’는 ‘영광의 주님’, ‘영화의 주’로도 옮길 수 있습니다.
    reason: lexical_alternative
