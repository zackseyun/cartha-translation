translation:
  language: ko
  text: 나는 그 네 얼굴들이 영광의 주 앞에서 찬양하는 목소리를 들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 네 얼굴’입니다. 여기서는 분리된 얼굴이 아니라 환시에서 본 네 하늘 존재를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영광의 주’는 ‘영광의 주님’ 또는 ‘영광의 주권자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 네 존재’로도 옮길 수 있습니다.
    reason: previous_rendering
