base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/002.yaml
  text: And I heard the voice of the angel saying[a], 'These are the angels who came down upon the earth and revealed what was hidden to the children of men[b], and led the children of men astray so that they committed sin.'
  footnotes:
  - marker: a
    text: Or 'disclosed the hidden things.' The Ge'ez expression points to the uncovering of what had been concealed, without specifying in this verse exactly which secrets are meant.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the children of men,' an Enochic expression for humankind.
    reason: cultural_note
translation:
  language: ko
  text: 나는 그 천사가 이렇게 말하는 것을 들었습니다. 「이들은 땅에 내려와 사람의 자손에게 숨겨진 것을 드러내고[a], 사람의 자손을 미혹하여 죄를 짓게 한 천사들입니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨겨진 것들을 드러내고’. 이 구절의 게으즈어 표현은 감추어졌던 것이 밝혀지는 뜻을 나타내지만, 그것이 무엇인지는 여기서 구체적으로 말하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘사람의 자손’입니다. 에녹 문헌에서 인류를 가리키는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ሰማዕኩ / ቃሎ ለመልአክ
  english_pob_choice: I heard the voice of the angel
  chosen_korean: 나는 천사에게서 나는 소리를 들었습니다
  alternatives_korean:
  - 나는 천사의 말을 들었습니다
  - 나는 천사의 음성을 들었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘들었습니다’로 직접적인 청각 경험을 살리고, ቃል/‘voice’의 음성적 성격을 자연스러운 한국어로 옮겼습니다.
- source_word: እሉ ውእቶሙ መላእክት እለ ወረዱ ዲበ ምድር
  english_pob_choice: These are the angels who came down upon the earth
  chosen_korean: 이들은 땅에 내려와서 … 한 천사들입니다
  alternatives_korean:
  - 이들은 땅으로 내려온 천사들입니다
  - 이들은 땅에 강림한 천사들입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘땅에 내려오다’로 하강 이미지를 유지하면서, ‘강림’처럼 종교적으로 굳어진 표현은 피했습니다.
- source_word: ወዘበኅቡእ ከሠቱ
  english_pob_choice: and revealed what was hidden
  chosen_korean: 숨겨진 것을 드러내고
  alternatives_korean:
  - 감추인 것을 밝히고
  - 숨은 것을 드러내고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 숨김/드러냄의 대조를 보존하되, ‘무엇이’라는 범위를 과도하게 특정하지 않도록 했습니다.
- source_word: ለውሉደ፡ ሰብእ
  english_pob_choice: to the children of men
  chosen_korean: 사람의 자손
  alternatives_korean:
  - 사람의 아들들
  - 인류
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹 문헌의 관용구를 직역에 가깝게 살리면서, 현대 한국어에서 이해 가능한 형태로 조정했습니다.
- source_word: ወአስሐትዎሙ ለውሉደ፡ ሰብእ ከመ፡ ይግበሩ፡ ኃጢአተ
  english_pob_choice: and led the children of men astray so that they committed sin
  chosen_korean: 사람의 자손을 미혹하여 죄를 짓게 한
  alternatives_korean:
  - 사람의 자손을 그릇된 길로 이끌어 죄를 범하게 한
  - 사람의 자손을 속여 죄를 짓게 한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: አስሐተዎሙ의 기만/오도 의미를 ‘미혹하다’로 살리고, 결과절은 한국어에서 자연스러운 ‘죄를 짓게 하다’로 옮겼습니다.
theological_decisions:
- issue: ‘숨겨진 것’의 범위
  chosen_reading: 본문은 무엇이 숨겨졌는지 특정하지 않고 ‘숨겨진 것’으로 유지했습니다.
  alternative_readings:
  - 비밀들
  - 숨은 지식
  - 천상의 비밀
  rationale: 영어 POB가 지적하듯 이 구절 자체는 대상의 범위를 열어 두므로, 주석 없이 구체화하지 않았습니다.
  doctrine_reference: 본문의 의미 범위를 보존하고, 후대 전통의 내용을 본문에 앞서 주입하지 않음
- issue: 천사들의 정체 명시 여부
  chosen_reading: 본문에는 ‘타락한 천사’나 ‘감시자’라는 제목을 넣지 않았습니다.
  alternative_readings:
  - 감시자들인 천사들
  - 타락한 천사들
  rationale: 게으즈 원문은 단순히 ‘땅에 내려온 천사들’이라고 하므로, 전통적 식별은 본문 밖의 해석으로 남겨 두었습니다.
  doctrine_reference: 지역 본문 표현을 유지하고 넓은 에녹 전승과의 조화는 주석에서 처리
