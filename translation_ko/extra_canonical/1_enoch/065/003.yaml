  - 알려 주십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접적인 요청을 자연스러운 현대 한국어 공손체로 옮기되, 상대에게 정보를 청하는 뉘앙스를 살렸습니다.
- source_word: ምንት ውእቱ ዘይትገበር
  english_pob_choice: what is this that is being done
  chosen_korean: 무엇이 이루어지고 있습니까
  alternatives_korean:
  - 무엇이 행해지고 있습니까
  - 무슨 일이 일어나고 있습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 현재 진행형의 사건성을 살려 ‘이루어지고 있습니까’로 옮겼습니다. ‘무슨 일이 일어나고 있습니까’보다 원문의 목적어적 초점인 ‘무엇이’가 더 분명합니다.
- source_word: እስመ ከመዝ ሰርሐት ምድር
  english_pob_choice: For the earth has labored thus
  chosen_korean: 땅이 이처럼 수고하고
  alternatives_korean:
  - 땅이 이처럼 해산의 고통을 겪고
  - 땅이 이처럼 일하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 난해한 동사를 과도하게 단정하지 않으면서도, POB의 ‘labored’가 지닌 고통·긴장의 이미지를 한국어 ‘수고하다’로 살렸습니다.
- source_word: ወአንቀልቅለት
  english_pob_choice: and has been shaken
  chosen_korean: 흔들렸으니
  alternatives_korean:
  - 요동쳤으니
  - 뒤흔들렸으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지진적·우주적 격동을 포괄하는 넓은 표현으로 ‘흔들리다’를 택했습니다. 문맥상 종결 연결을 위해 ‘-니’로 처리했습니다.
- source_word: ዮጊ አነ እትኃጐል ምስሌሃ
  english_pob_choice: perhaps I will perish with it
  chosen_korean: 아마도 나는 그것과 함께 멸망할 것입니다
  alternatives_korean:
  - 내가 그것과 함께 망할지도 모릅니다
  - 내가 그것과 함께 죽을지도 모릅니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 수정판이 반영한 ‘perhaps’의 불확실성을 따라, 단정적 ‘lest’보다 한국어 ‘아마도’가 더 자연스럽고 정확합니다. ‘멸망하다’는 종말론적 파괴의 범위를 살립니다.
theological_decisions:
- issue: 땅의 ‘수고함’과 ‘흔들림’의 성격
  chosen_reading: 이 구절은 땅 자체가 재난적 격동을 겪는 장면으로 읽고, 단순한 지상 사건 묘사로 약화하지 않았습니다.
  alternative_readings:
  - 땅 위에서 벌어지는 인간 사회의 혼란으로만 읽는 해석
  - 단순한 지진 보도로만 축소하는 해석
  rationale: 원문은 땅을 의인화하여 우주적 불안과 심판의 분위기를 형성합니다. 이를 보존해야 문맥의 종말론적 긴장이 살아납니다.
  doctrine_reference: Apocalyptic imagery should be preserved without flattening cosmic personification.
