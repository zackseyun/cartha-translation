base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/003.yaml
  text: And I said to him[a], “Tell me, what is this that is being done upon the earth? For the earth has labored thus and has been shaken[c][b]; perhaps I will perish with it.”
  footnotes:
  - marker: a
    text: Or 'has travailed thus.' The Ge'ez verb is difficult here; the main text chooses a broader term for the earth's distress while preserving the image of violent upheaval.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may also be understood more explicitly as fear: ''for I fear that I may perish with it.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'For the earth has labored like this and has been shaken, lest I perish with it.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 그에게 말했습니다. 「말해 보십시오. 땅 위에서 무엇이 이루어지고 있습니까? 땅이 이처럼 수고하고 흔들렸으니, 아마도 나는 그것과 함께 멸망할 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수고하고’는 원문의 난해한 동사를 너무 해석하지 않으면서도, POB의 “labored”가 지닌 고통의 이미지를 보존한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아마도’는 영어 POB의 최신 수정처럼 원문의 ዮጊ를 불확실성의 표현으로 읽은 것입니다. 이 말은 ‘~할까 두렵다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ንግረኒ
  english_pob_choice: Tell me
  chosen_korean: 말해 보십시오
  alternatives_korean:
