  source_fidelity: ‘나의 조부 에녹’은 최신 판정에 따른 게에즈어 친족 호칭(‘나의 조부’)을 정확히 반영하며, ‘와서 … 내 곁에 섰다’와 질문의 ‘쓰라린 부르짖음과 울음’도 원문의 병렬적 애가 표현을 충실히 담고 있습니다. 다만 현재의 ‘서더니, 내게 말하였습니다’는 연결이 다소 구어적·비대칭적입니다.
  naturalness: ‘내 조부’가 현대 표준 한국어 문맥에서 ‘나의 조부’보다 자연스럽습니다. 또한 서술 연결을 ‘서서 내게 말했습니다’로 정리하고, 문맥상 불필요하게 강조되는 2인칭 대명사 ‘너는’을 생략하면 더 유려합니다. 인용문 안의 ‘-느냐’는 등장인물의 직접 발화에 자연스럽고 원문의 질문 형식을 보존합니다.
  terminology: ‘에녹’은 통용되는 한국어 성경 인명 표기이며, ‘조부’는 원문의 친족 관계를 과도하게 해석하지 않고 보존합니다. ‘부르짖음’과 ‘울음’은 각각 강한 외침과 울음을 적절히 구별합니다.
  issues:
