lexical_decisions:
- source_word: ወመጽአ
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 오셔서
  - 이르러
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본적인 이동 동사로, 서술의 흐름을 가장 직접적으로 살려 ‘와서’로 옮겼습니다.
- source_word: ሄኖክ
  english_pob_choice: Enoch
  chosen_korean: 에녹
  alternatives_korean:
  - 에노크
  lexicon: modern Korean biblical proper-name usage
  rationale: 한국어에서 널리 정착한 성경 인명 표기인 ‘에녹’을 사용했습니다.
- source_word: ቆመ ኀቤየ
  english_pob_choice: stood beside me
  chosen_korean: 내 곁에 서더니
  alternatives_korean:
  - 내 옆에 서더니
  - 내 곁에 서서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 근접을 나타내는 표현을 자연스럽게 살려, 단순한 위치보다 대면의 즉시성을 드러내는 ‘내 곁에’로 옮겼습니다.
- source_word: በምንት ጸራሕከ ኀቤየ ጽራኀ መሪረ ወብካየ
  english_pob_choice: Why have you cried out to me with a bitter cry and weeping?
  chosen_korean: 왜 너는 나에게 쓰라린 부르짖음과 울음으로 외쳤느냐?
  alternatives_korean:
  - 왜 나에게 쓰라린 부르짖음과 울음으로 외쳤느냐?
  - 무슨 까닭으로 나에게 쓰라리게 부르짖으며 울었느냐?
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ጸራሕከ’의 강한 외침을 ‘부르짖음’으로 살리고, ‘ጽራኀ መሪረ’와 ‘ብካየ’의 병렬을 ‘쓰라린…울음’으로 간결하게 반영했습니다.
