  naturalness: ‘발을 들어 올려’는 원문의 신체적 이미지를 보존하지만 한국어 문장 안에서는 다소 경직됩니다. ‘발을 들어 올리고’로 연결하고, 인용문 뒤의 ‘세 번’을 서술어에 결부하면 현대 표준어 합쇼체로 더 자연스럽습니다. ‘쓰라린 음성’은 ‘bitter voice’의 정서를 유지하면서 ‘쓰라린 목소리’보다 문어적 서사 문맥에 더 자연스럽습니다.
  terminology: ‘에녹’, ‘노아’, ‘조부’, ‘땅 끝’은 적절합니다. ስምዐኒ의 1인칭 목적어는 ‘내 말을 들으십시오’로 명시할 수 있습니다.
