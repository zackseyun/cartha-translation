  alternative_readings:
  - 에녹에게
  - 노아의 선조 에녹에게
  - 문맥에 맞게 친족 호칭을 완화
  rationale: 이 구절은 문자 전승의 난점을 평탄화하기보다 드러내는 것이 원문 충실도에 더 부합합니다.
  doctrine_reference: 원문 우선 원칙; 본문 난점 보존
