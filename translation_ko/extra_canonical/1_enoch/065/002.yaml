  - 저를 들으십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역형 ‘들으십시오’보다 한국어에서 더 분명한 청유·호소가 되도록 목적어를 드러내어 옮겼습니다.
theological_decisions:
