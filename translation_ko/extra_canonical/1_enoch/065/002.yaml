  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘발’과 ‘들어 올리다’로 신체적 움직임을 살려, 단순히 ‘떠나다’로 평탄화하지 않았습니다.
- source_word: አጽናፈ ምድር
