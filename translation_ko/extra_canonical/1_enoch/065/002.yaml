theological_decisions:
- issue: 에녹과 노아의 친족 관계를 둘러싼 본문상의 긴장
  chosen_reading: 본문이 지시하는 친족 호칭을 그대로 살려 ‘그의 조부 에녹’으로 옮기고, 계보상의 어색함은 본문 자체의 긴장으로 남겼습니다.
  alternative_readings:
  - 에녹에게
  - 노아의 선조 에녹에게
  - 문맥에 맞게 친족 호칭을 완화
  rationale: 이 구절은 문자 전승의 난점을 평탄화하기보다 드러내는 것이 원문 충실도에 더 부합합니다.
  doctrine_reference: 원문 우선 원칙; 본문 난점 보존
