  rationale: 감정의 날카로움과 고통을 드러내는 표현으로, 한국어에서 가장 자연스러운 정서를 선택했습니다.
- source_word: ስምዐኒ
  english_pob_choice: Hear me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
