base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/002.yaml
  text: And he lifted up his feet from there and went as far as the ends of the earth[a], and he cried out to his grandfather Enoch, and Noah said with a bitter voice, “Hear me, hear me[d][c][b], hear me,” three times.
  footnotes:
  - marker: a
    text: The Ethiopic text appears to say 'to his son Enoch,' which is difficult in context since Noah is normally presented as Enoch's descendant, not his father. The translation preserves the surviving wording rather than silently harmonizing it.
    reason: textual_variant
  - marker: b
    text: The clause around 'and said, Noah' is syntactically awkward in this witness. It may reflect a disturbed text or compressed speech introduction. A smoother rendering is possible, but the main text stays close to the Ethiopic wording.
    reason: alternative_reading
  - marker: c
    text: Or 'to his son Enoch'.
    reason: previous_rendering
  - marker: d
    text: Or 'and said, “Noah, with a bitter voice:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 그곳에서 발을 들어 올려 땅의 끝까지 가서, 그의 조부 에녹에게 외쳤습니다. 그리고 노아가 쓰라린 목소리로 말했습니다. 「내 말을 들으십시오, 내 말을 들으십시오, 내 말을 들으십시오」 — 세 번.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ethiopic 본문은 친족 호칭을 ‘his grandfather Enoch’로 읽는 것이 더 자연스럽습니다. 영어 POB도 이 난점을 반영해 본문을 수정했습니다.
    reason: textual_variant
  - marker: b
    text: ‘and said, Noah’처럼 보이는 어색한 문장 구조는 영어 POB의 수정에 따라 정리했습니다.
    reason: source_note
