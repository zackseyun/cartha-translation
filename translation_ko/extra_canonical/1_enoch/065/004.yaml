base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/004.yaml
  text: And after that time there came a great upheaval upon the earth[a], and a voice was heard from heaven[b], and I fell on my face.
  footnotes:
  - marker: a
    text: 'The final clause is textually difficult in the OCR: the verb form appears plural (''and they fell''), but the attached suffix in ''my face'' points toward the sense ''and I fell on my face.'' The translation follows the reading that best fits the immediate first-person narrative context.'
    reason: textual_variant
  - marker: b
    text: The term rendered 'upheaval' can also be understood as 'tumult,' 'confusion,' or 'shaking.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그때 뒤에, 땅 위에 큰 요동이 일어나고 하늘로부터 음성이 들렸으며, 나는 얼굴을 땅에 대고 엎드렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Geʽez 동사는 OCR상 복수형처럼 보이지만, 뒤의 ‘내 얼굴’(በገጽየ)이 1인칭 단수 소유를 보이므로 문맥상 “나는 … 엎드렸습니다”가 가장 타당합니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ቃል은 문맥상 ‘말씀’보다 ‘음성/소리’에 가깝지만, 계시적 발화의 성격을 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበድኅሬ ውእቱ ጊዜ
  english_pob_choice: after that time
  chosen_korean: 그리고 그때 뒤에
  alternatives_korean:
  - 그때 후에
  - 그 시간 뒤에
  - 그 일 후에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시점의 연속을 살리되, 문어체 한국어에서 자연스럽게 읽히도록 ‘뒤에’로 옮겼습니다. '그때'는 ውእቱ의 지시성을, '그리고'는 서술 전개를 반영합니다.
- source_word: ሀውክ ዐቢይ
  english_pob_choice: a great upheaval
  chosen_korean: 큰 요동
  alternatives_korean:
  - 큰 소동
  - 큰 혼란
  - 큰 흔들림
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 심리적 혼란보다 묵시적·우주적 동요를 드러내기 위해 ‘요동’을 택했습니다. ‘큰’은 ዐቢይ의 강도를, ‘땅 위에’와 결합해 지상의 격변을 살립니다.
- source_word: ተሰምዐ ቃል እምሰማይ
  english_pob_choice: a voice was heard from heaven
  chosen_korean: 하늘로부터 음성이 들렸으며
  alternatives_korean:
  - 하늘에서 소리가 들렸으며
  - 하늘에서 말씀이 들렸으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 계시 문맥에서 ቃል은 ‘음성’이 가장 자연스럽고, ‘말씀’보다 직접적인 들림의 감각을 잘 전달합니다. ‘하늘로부터’는 출처를 분명히 하면서도 성경적 어감을 유지합니다.
- source_word: ወወደቁ በገጽየ
  english_pob_choice: and I fell on my face
  chosen_korean: 나는 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 나는 얼굴을 바닥에 대고 엎드렸습니다
  - 나는 얼굴을 땅에 대고 넘어졌습니다
  - 나는 얼굴로 엎드렸습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 1인칭 귀결을 살려 ‘나는’으로 옮겼고, 관용적 ‘얼굴을 땅에 대고 엎드리다’로 완전한 엎드림을 표현했습니다. OCR상 동사의 수형 난점이 있으나 문맥상 첫인칭이 가장 타당합니다.
theological_decisions:
- issue: ‘요동’의 범위
  chosen_reading: 땅 위에 일어난 묵시적 격변으로 넓게 이해합니다.
  alternative_readings:
  - 정치적 소동
  - 단순한 지진
  - 심리적 혼란
  rationale: 파르달/묵시 문맥에서 발생하는 사건으로서, 특정 자연현상이나 사회불안으로 축소하지 않고 종말론적 격변의 넓이를 보존합니다.
  doctrine_reference: 묵시적 상징을 과도하게 축소하지 않는 번역 원칙
- issue: ‘음성’의 번역
  chosen_reading: 하늘의 계시적 발화를 드러내는 ‘음성’으로 번역합니다.
  alternative_readings:
  - 소리
  - 말
  rationale: 보편적 ‘소리’보다 인격적·계시적 발화성을 지닌 ‘음성’이 본문의 신현적 분위기를 더 잘 살립니다.
  doctrine_reference: 계시 장면의 발화성 보존
