  text: And now instruct him[c][b][a], that he may flee and preserve his seed for all the generations forever.
  footnotes:
  - marker: a
    text: Or 'his offspring' or 'his descendants.' The Ge'ez literally says 'his seed,' a lineage term preserved here for transparency.
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be rendered 'for all generations forever.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and preserve his seed'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 그에게 지시하여, 그가 도망하고 그의 씨가 모든 세대에 걸쳐 영원히 남게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 후손’이나 ‘그의 자손’으로 옮길 수 있습니다. 게에즈 원문은 문자 그대로 ‘그의 씨’라고 되어 있어, 계보를 드러내는 표현을 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구는 ‘모든 세대에 걸쳐 영원히’로도 옮길 수 있습니다.
    reason: lexical_alternative
