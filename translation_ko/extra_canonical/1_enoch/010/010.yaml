theological_decisions:
- issue: 문장 앞의 관형절과 뒤의 결과절이 지시하는 대상 관계
  chosen_reading: 이 구절은 청원이 조상들에게 허락되지 않는다는 사실과, 그럼에도 후손/당사자들이 영원한 생명을 바라며 장수한다는 내용을 병렬로 제시합니다.
  alternative_readings:
  - 청원 대상이 조상인지 후손인지 더 좁혀 읽는 해석
  - 조상들이 아니라 후손에게 허락되지 않는다는 해석
  rationale: 게즈어가 압축되어 있어 지시 관계를 지나치게 확정하지 않고, 허락의 거절과 장수의 소망이라는 두 축을 함께 보존했습니다.
  doctrine_reference: source tension preservation
