base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/016.yaml
  text: Destroy all violence from the face of the earth[a], and every evil deed shall come to an end; and the plant of righteousness and uprightness shall appear[b], and it shall become a blessing.
  footnotes:
  - marker: a
    text: Or 'the planting of righteousness and uprightness.' The Ge'ez noun can denote either the thing planted or the act/result of planting.
    reason: lexical_alternative
  - marker: b
    text: Or 'And all violence shall be removed'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅의 얼굴에서 모든 폭력을 없애고, 모든 악한 행위는 끝나게 될 것이며, 의와 올곧음의 식물이 나타나서 복이 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의와 올곧음의 심기’입니다. 게에즈 명사는 심겨진 것 자체와 심는 행위/결과를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘모든 폭력은 제거될 것입니다’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ኵሎ ግፍዓ
  english_pob_choice: all violence
  chosen_korean: 모든 폭력
  alternatives_korean:
  - 모든 압제
  - 모든 악행
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ግፍዓ는 폭력, 압제, 부정의 강제를 아우를 수 있으나, 심판과 정화의 문맥에서는 사회적·도덕적 파괴성을 가장 직접적으로 드러내는 ‘폭력’이 가장 적절합니다.
- source_word: እምገጸ ምድር
  english_pob_choice: from the face of the earth
  chosen_korean: 땅의 얼굴에서
  alternatives_korean:
  - 땅에서
  - 땅의 표면에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘얼굴’이 포함된 셈어적 관용을 살려, 장중한 묵시적 어조를 유지하기 위해 직역에 가깝게 옮겼습니다.
- source_word: ኵሉ ምግባረ እኩይ
  english_pob_choice: every evil deed
  chosen_korean: 모든 악한 행위
  alternatives_korean:
  - 모든 악한 일
  - 모든 사악한 행실
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘행위’는 집합적 의미를 살리면서도 한국어로 자연스럽고, ‘악한’은 እኩይ의 도덕적 악성을 무리 없이 전달합니다.
- source_word: ይኅልቅ
  english_pob_choice: shall come to an end
  chosen_korean: 끝나게 될 것입니다
  alternatives_korean:
  - 멸망하게 될 것입니다
  - 사라지게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 소멸과 종결을 함께 포함할 수 있으나, 대상이 ‘악한 행위’이므로 인격화된 파괴보다 종결의 뜻을 살린 표현이 적합합니다.
- source_word: ተክለ ጽድቅ ወርትዕ
  english_pob_choice: the plant of righteousness and uprightness
  chosen_korean: 의와 올곧음의 식물
  alternatives_korean:
  - 의와 올곧음의 심기
  - 의와 올곧음의 나무
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: አስተ리/‘나타나다’와 결합한 농경 이미지를 살리면서도, ተክለ의 식물성 이미지를 유지하기 위해 ‘식물’을 택했습니다. ‘올곧음’은 ርትዕ의 직선성·정직성을 현대 한국어로 자연스럽게 옮깁니다.
- source_word: ይከውን ለበረከት
  english_pob_choice: it shall become a blessing
  chosen_korean: 복이 될 것입니다
  alternatives_korean:
  - 복이 되겠습니다
  - 복으로 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결과 상태를 나타내는 구조를 한국어의 자연스러운 미래 서술로 옮겼으며, በረከት의 언약적 의미를 ‘복’으로 간결하게 살렸습니다.
theological_decisions:
- issue: 명령문 유지 여부
  chosen_reading: 이 절은 하나님/천사의 명령으로 읽히는 직접 명령형을 한국어에서도 유지해, 정화 행위의 권위와 긴박성을 보존했습니다.
  alternative_readings:
  - ~가 제거될 것입니다
  - ~를 제거하시오
  rationale: 주어진 주해에서는 동사를 명령으로 보아야 하므로, 단순한 서술형으로 바꾸면 원문의 직접성과 심판적 힘이 약화됩니다.
  doctrine_reference: 원문 명령형과 묵시문학의 심판 어조 보존
- issue: ‘식물’ 이미지의 보존
  chosen_reading: 의와 올곧음이 추상명사로만 풀리지 않도록 농경적 이미지를 살렸습니다.
  alternative_readings:
  - 의와 올곧음이 흥왕할 것입니다
  - 의와 올곧음이 자랄 것입니다
  rationale: POB의 주해가 지적하듯 이 표현은 단순 추상보다 ‘심겨진 것/자라나는 것’의 묵시적 이미지를 담고 있으므로, 이미지를 유지하는 편이 source-grounded합니다.
  doctrine_reference: 묵시적 상징과 이미지의 보존
