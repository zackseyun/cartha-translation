base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/008.yaml
  text: And the whole earth has been corrupted by the teaching of the works of Azazel[c][b][a]; and to him ascribe all sin.
  footnotes:
  - marker: a
    text: Or 'by the instruction in his deeds.' The Ge'ez phrase keeps both the idea of teaching and of concrete acts or practices.
    reason: lexical_alternative
  - marker: b
    text: The final clause may carry the sense 'write down against him all sin,' expressing formal assignment of guilt in the judgment scene.
    reason: alternative_reading
  - marker: c
    text: Or 'to him write down all sin.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 온 땅은 아자젤의 행위에 대한 가르침으로 부패되었습니다. 그리고 그에게 모든 죄를 기록하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 행위에 대한 지시로’로도 옮길 수 있습니다. 게에즈 표현은 가르침과 구체적 행위를 함께 품고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘그에게 모든 죄를 기록하십시오’가 아니라 ‘그를 상대로 모든 죄를 기록하십시오’의 뉘앙스를 가질 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘그에게 모든 죄를 써 두십시오’로도 읽을 수 있습니다.
    reason: previous_rendering
