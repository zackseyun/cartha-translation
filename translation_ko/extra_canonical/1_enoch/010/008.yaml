theological_decisions:
- issue: 마지막 절의 명령이 ‘아자젤을 향해 모든 죄를 기록하라’는 법정적 귀속인지, 단순히 그에 관해 쓰라는 것인지
  chosen_reading: 아자젤에게 죄책을 공식적으로 귀속시키는 판결문적 명령으로 읽었습니다.
  alternative_readings:
  - 그에 관해 모든 죄를 기록하십시오
  - 그를 상대로 모든 죄를 기록하십시오
  rationale: 문맥이 심판 선고이므로, 원문의 ‘그에게/그 위에’라는 힘을 살려 죄의 총체적 책임을 그에게 돌리는 읽기가 가장 자연스럽습니다.
  doctrine_reference: 문맥이 허용하는 법정적 의미를 보존하고, 해석의 긴장을 평탄화하지 않습니다.
