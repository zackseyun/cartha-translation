  rationale: 게에즈는 ‘가르침/지시’와 ‘행위/실천’을 함께 묶고 있으므로, 두 요소를 모두 드러내되 한국어 문장으로는 ‘행위에 대한 가르침’이 가장 덜 평탄화합니다.
