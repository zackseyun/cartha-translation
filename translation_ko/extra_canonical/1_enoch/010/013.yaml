  - marker: b
    text: '''Prison-house'' translates a literal ''house of confinement,'' preserving the concrete imagery of incarceration in this judgment scene.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그날들에 그들은 그들을 불의 깊은 곳[a]과 고통과 감옥집[b]으로 끌고 갈 것이며, 거기에서 그들은 영원히 갇혀 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불의 깊은 곳’은 문자적으로는 불의 낮은/깊은 장소를 가리키며, ‘불의 심연’ 또는 ‘불타는 깊은 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감옥집’은 문자 그대로 ‘구금의 집’이라는 구체적 이미지를 보존한 표현입니다.
    reason: cultural_note
