  text: 그리고 그 날들에는 그들이 그들을 불의 깊은 곳[a]과 고통과 감옥[b]으로 데려갈 것이며, 거기에서 그들은 영원히 갇혀 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
