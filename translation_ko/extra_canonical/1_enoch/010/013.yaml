    text: ‘불의 깊은 곳’은 문자적으로 불과 관련된 낮거나 깊은 장소를 가리킵니다. ‘불의 심연’ 또는 ‘불타는 깊은 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
