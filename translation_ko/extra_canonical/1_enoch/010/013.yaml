  text: And in those days they will lead them down into the abyss of fire[a], and into torment and the prison-house[b]; and there they will be shut up forever.
  footnotes:
  - marker: a
    text: The phrase rendered 'the abyss of fire' is literally a lower or deep place of fire; the exact nuance may be 'depth of fire' or 'fiery abyss.'
