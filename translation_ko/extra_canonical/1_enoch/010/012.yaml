  - 그들을 칠십 세대 동안 땅의 산들 아래에 묶어 두십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령형 ‘묶어 두십시오’는 본문의 물리적 구속 이미지를 보존하며, ‘칠십 세대’는 묵시적 기간 표현을 그대로 옮깁니다.
- source_word: በመትሕተ አውግርተ ምድር
  english_pob_choice: beneath the hills of the earth
  chosen_korean: 땅의 언덕들 아래
  alternatives_korean:
  - 땅의 산들 아래
  - 땅의 산기슭 아래
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 어휘를 따라 ‘언덕들’로 옮기되, 지하 감금의 공간성을 드러내기 위해 ‘아래’ 구조를 유지했습니다.
- source_word: ዕለተ ኵነኔሆሙ ወተፍጻሜቶሙ
  english_pob_choice: the day of their judgment and of their consummation
  chosen_korean: 그들의 심판의 날과 그들의 종말
  alternatives_korean:
  - 그들의 심판의 날과 그들의 완성
  - 그들의 심판의 날과 그들의 완결
  - 그들의 심판의 날과 그들의 완성의 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘종말’은 ተፍጻሜቶሙ의 끝/종결 의미를 간결하게 반영하면서도, 본문의 종말론적 긴장을 유지합니다.
- source_word: ኵነኔ ዘለዓለመ ዓለም
  english_pob_choice: the judgment that is for all eternity
  chosen_korean: 영원한 세월의 심판
