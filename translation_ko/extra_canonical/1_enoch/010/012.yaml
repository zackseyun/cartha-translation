  rationale: 반복적 ‘세월/시대’ 어법을 살리기 위해 ‘영원한 세월’로 옮겨, 단순한 ‘영원’보다 원문의 강조를 더 잘 드러냈습니다.
theological_decisions:
- issue: ‘consummation’의 의미를 완전히 종결로 좁힐지 여부
  chosen_reading: ‘종말’로 옮겨 끝/완결의 의미를 열어 두되, 심판의 종결성은 유지했습니다.
  alternative_readings:
  - ‘완성’
  - ‘완결’
  - ‘최종 판결’
  rationale: 원문은 단순한 소멸보다 심판 절차의 종료와 종말론적 완결을 함께 가리킬 수 있으므로, 의미를 과도하게 한쪽으로 고정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolving the eschatological term too narrowly.
