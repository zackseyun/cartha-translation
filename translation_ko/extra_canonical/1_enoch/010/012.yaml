  - 서로 멸하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상호적 폭력과 심판 장면의 강도를 살리기 위해 단순한 ‘다투다’보다 직접적인 살해 의미를 반영했습니다.
- source_word: ሐጕሎሙ ለፍቁራኒሆሙ
