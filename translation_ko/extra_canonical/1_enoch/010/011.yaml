base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/011.yaml
  text: And to Michael the Lord said[a], “Go, bind Shemihazah and the others with him[c][b], who joined themselves with women so as to defile themselves with them in their uncleanness.”
  footnotes:
  - marker: a
    text: The command verb before 'Shemihazah' is textually difficult in the OCR, but the chapter context and broader witness support the sense 'bind.'
    reason: textual_variant
  - marker: b
    text: Mikael is the Ge'ez-form transliteration of the angel's name, more familiar in English as Michael.
    reason: lexical_alternative
  - marker: c
    text: Or 'And to Mikael he said, “Go, bind Shemihazah and the others with him, who joined themselves with women so as to defile themselves with them in all their uncleanness.”'.
