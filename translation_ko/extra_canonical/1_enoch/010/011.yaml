translation:
  language: ko
  text: 그리고 미카엘에게 주님께서 말씀하셨습니다. 「가서 시미아자와 그와 함께한 다른 이들을 묶으십시오. 그들은 여자들과 결합하여 그들과 그들의 더러움 가운데서 자신들을 더럽혔습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈 본문은 말하는 주체로 እግዚእ(주님)을 분명히 포함하므로 본문에 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: ወለሚካኤል፡ ይቤ፡ እግዚእ
  english_pob_choice: And to Michael the Lord said
  chosen_korean: 그리고 미카엘에게 주님께서 말씀하셨습니다
  alternatives_korean:
  - 그리고 미카엘에게 주님이 말씀하셨습니다
  - 그리고 미카엘에게 주님께서 이르셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게즈 본문은 말하는 주체를 እግዚእ(주님)으로 분명히 밝히므로 이를 한국어 본문에도 반영했고, ይቤ는 서술형 ‘말씀하셨습니다’로 자연스럽게 옮겼습니다.
- source_word: ሑር
  english_pob_choice: bind
  chosen_korean: 묶으십시오
  alternatives_korean:
  - 매어 두십시오
  - 결박하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 단순한 이동이 아니라 심판적 구속/구금의 명령이므로, 현대 한국어에서 명령의 힘을 살리되 과도하게 문어적인 ‘결박하다’보다 직접적인 ‘묶으십시오’를 택했습니다.
- source_word: ለስምያዛ
  english_pob_choice: Shemihazah
  chosen_korean: 시미아자
  alternatives_korean:
  - 셈이하자
  - 세미자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아어 음가에 더 직접적인 음역을 따르되, 한국어 본문에서 읽히도록 최소한으로 표기했습니다.
- source_word: ወለካልኣን እለ ምስሌሁ
  english_pob_choice: and the others with him
  chosen_korean: 그와 함께한 다른 이들을
  alternatives_korean:
  - 그와 함께한 자들을
  - 그와 함께한 나머지 이들을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘카른/칼안’에 해당하는 집합적 동반자를 특정 직함 없이 자연스럽게 풀어, 앞선 이름과 함께 묶인 동료 집단이라는 의미를 보존했습니다.
- source_word: እለ ሐብሩ ምስለ አንስት
  english_pob_choice: who joined themselves with women
  chosen_korean: 그들은 여자들과 결합하여
  alternatives_korean:
  - 그들은 여자들과 함께하여
  - 그들은 여자들과 연합하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게즈의 ‘함께 결합하다/붙다’는 의도적 결합을 가리키므로, 직역보다도 의미를 살리는 ‘결합하다’를 선택해 서술의 강도를 유지했습니다.
- source_word: ከመ፡ ይማስኑ፡ ምስሌሆን፡ በርኵሶ፡ ዚአሆን
  english_pob_choice: so as to defile themselves with them in their uncleanness
  chosen_korean: 그들과 그들의 더러움 가운데서 자신들을 더럽혔습니다
  alternatives_korean:
  - 그들과 함께 그들의 부정함 가운데 자신들을 더럽혔습니다
  - 그들과 더불어 그들의 부정 속에서 자신들을 더럽혔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 핵심은 행위의 목적/결과와 함께 ‘더러움/부정’의 반복입니다. ‘자신들을 더럽혔습니다’로 동사와 결과를 살리고, ‘그들의 더러움 가운데서’로 በርኵሶ ዚአሆን의 소속격을 반영했습니다.
theological_decisions:
- issue: 원문이 말하는 부정성의 성격
  chosen_reading: ‘더럽혔습니다’와 ‘더러움’이라는 표현을 유지하되, 본문 밖의 후대 범주로 제한하지 않고 그 자체의 불결/타락의 긴장을 보존했습니다.
  alternative_readings:
  - 성적 타락으로 특정하기
  - 의례적 부정으로만 제한하기
  - 일반적 악행으로 완화하기
  rationale: 게즈 본문은 여성들과의 결합과 불결을 함께 말하지만, 그 신학적 무게를 단일 범주로 축소하지 않습니다.
  doctrine_reference: 의도된 신학적 긴장 보존
