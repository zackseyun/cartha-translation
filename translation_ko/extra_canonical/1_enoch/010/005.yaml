base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/005.yaml
  text: And heap jagged and sharp stones upon him[a], and cover him with darkness; and there he shall remain forever[c][b]. And cover his face so that he may not see light.
  footnotes:
  - marker: a
    text: The paired descriptions of the stones likely intensify their harshness; the exact nuance may be rendered 'jagged and sharp' or similarly 'rough and pointed.'
    reason: lexical_alternative
  - marker: b
    text: 'The command to cover his face explains the next clause: the condemned one is shut away from all light, a concrete image of total confinement.'
    reason: cultural_note
  - marker: c
    text: Or 'jagged stones and sharp stones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 위에 거칠고 날카로운 돌들을 쌓고[a], 그를 어둠으로 덮으십시오. 그는 거기에서 영원히 머물 것입니다. 그의 얼굴을 덮어, 그가 빛을 보지 못하게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “울퉁불퉁하고 뾰족한 돌들.” 두 형용사는 돌의 거칠고 가혹한 성질을 함께 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 얼굴을 덮으라’는 명령은 그가 빛을 보지 못하게 하는 완전한 차단의 구체적 이미지입니다.
    reason: cultural_note
