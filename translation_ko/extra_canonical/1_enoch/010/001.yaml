  - 그에게 말씀하시며
  lexicon: Dillmann
  rationale: 동사에 붙은 목적대명사를 분명히 반영했고, 높임체를 사용해 신적 발화의 존중을 드러냈습니다.
theological_decisions:
- issue: 지극히 높으신 이 / 크고 거룩하신 분의 병렬 호칭
  chosen_reading: 두 호칭을 병렬로 유지해 하나의 단일 호칭으로 합치지 않았습니다.
  alternative_readings:
  - 지존자 한 분으로 통합
  - 하나의 수식구로 단순화
  rationale: 원문은 하나님을 여러 칭호로 누적해 부르며, 이 긴장과 장엄함이 의미의 일부이므로 합쳐서 평탄화하지 않았습니다.
  doctrine_reference: 계시 문헌의 다중 호칭 보존; 신적 초월성과 거룩성의 중첩 표현
- issue: 신적 발화의 높임체
  chosen_reading: 본문 서술은 합쇼체로, 하나님께 직접 말하는 구문은 아니므로 일반 서술 높임을 유지했습니다.
  alternative_readings:
  - -습니다체보다 더 완곡한 문체
  - 기도체 종결
  rationale: 서술자 내레션으로서 현대 표준 합쇼체를 유지하는 것이 원문과 문체상 가장 가깝습니다.
  doctrine_reference: 문체는 번역 전략의 문제이며 교리적 의미를 바꾸지 않음
