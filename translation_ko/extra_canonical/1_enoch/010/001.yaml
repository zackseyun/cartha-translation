base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/001.yaml
  text: 'Then the Most High[a], the Great and Holy One, spoke and sent Uriel to the son of Lamech[b], and said to him:'
  footnotes:
  - marker: a
    text: The recipient is identified only as 'the son of Lamech' in this verse; the wider context makes clear that this is Noah.
    reason: cross_reference
  - marker: b
    text: The name 'Uriel' is inferred from the Ethiopic OCR, which appears slightly corrupted at this point; the sense is strongly supported by the immediate context of the commissioned angel.
    reason: textual_variant
translation:
  language: ko
  text: 그때 지극히 높으신 이[a], 크고 거룩하신 분께서 말씀하시고, 라멕의 아들[b]에게 우리엘을 보내시며 그에게 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 여기서 하나님의 다중 호칭을 사용합니다. POB는 이를 “the Most High, the Great and Holy One”으로 옮겼습니다.
    reason: theological_note
  - marker: b
    text: 이 절의 “라멕의 아들”은 문맥상 노아를 가리킵니다.
    reason: cross_reference
