translation:
  language: ko
  text: 그리고 이 사생아들의 영들과 감시자들의 자녀들을 멸하십시오. 그들이 사람들을 억압하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불법적으로 태어난 자들’ 또는 ‘혼혈의 자손들’. 게에즈어 표현은 가혹하며, 감시자들과 관련된 불법적·혼합적 출생의 자손을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘사람들에게 폭력을 가하였다’ 또는 ‘사람들을 학대하였다’. 이 동사는 단순한 도덕적 잘못보다 강한 폭력적 가해를 뜻할 수 있습니다.
    reason: lexical_alternative
