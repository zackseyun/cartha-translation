theological_decisions:
- issue: ‘영’과 ‘감시자들의 자녀’의 관계를 어떻게 처리할지
  chosen_reading: 원문이 병렬적으로 제시한 두 요소를 함께 살려, 멸망 대상이 ‘이 불의한 자들의 영’과 ‘감시자들의 자녀’로 읽히도록 유지했습니다.
  alternative_readings:
  - 두 표현을 같은 집단의 이중 호칭으로 통합하는 해석
  - ‘감시자들의 자녀’만을 본문의 실제 대상로 좁히는 해석
  rationale: 본절은 영적 존재와 그 후손에 관한 전승의 긴장을 압축해 담고 있으므로, 해석적으로 평탄화하지 않고 원문이 가진 중첩성을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
