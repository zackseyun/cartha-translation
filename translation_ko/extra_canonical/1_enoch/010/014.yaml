base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/014.yaml
  text: And when he burns and perishes[c][b][a], from now on they shall be bound together with them until the completion of the generations of generations.
  footnotes:
  - marker: a
    text: The opening verb is textually difficult in the OCR witness; it likely denotes rising up, appearing, or being stirred. The translation keeps a cautious rendering rather than forcing a more specific sense.
    reason: textual_variant
  - marker: b
    text: '''Generations of generations'' is a literal rendering of the repeated idiom, expressing a long succession of ages.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And when they and their sons have risen up, they shall be bound together with them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 타고 멸망할 때, 이제부터 그들은 세대들의 세대가 끝날 때까지 그들과 함께 묶이게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈 전승에서 첫 동사의 형태는 불확실합니다. 여기서는 문맥상 ‘타다’라는 의미를 따랐습니다.
