  - 거듭
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 연속된 발화의 반복을 나타내므로, 서술을 과장하지 않으면서 자연스럽게 이어 주는 ‘다시’가 적절합니다.
- source_word: እግዚእ
