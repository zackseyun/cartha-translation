  - 상징적 영적 어둠에 넘긴다는 완화된 표현
  rationale: 본문은 손, 발, 어둠, 광야, 던짐이라는 연속된 구체적 이미지로 처벌을 묘사하므로, 이를 추상화하지 않고 몸으로 체감되는 심판 장면으로 보존했습니다.
