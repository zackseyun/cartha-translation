  rationale: 본문의 신적 칭호를 살리되, 합쇼체 문맥에서 ‘주께서’로 자연스럽게 연결되는 ‘주’가 가장 직접적입니다.
- source_word: በእዴሁ ወእግሩ
  english_pob_choice: by his hands and his feet
  chosen_korean: 그의 손과 발로
  alternatives_korean:
  - 그의 손과 발에
  - 손발로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 손과 발을 모두 명시하는 신체적 구속 이미지를 유지하되, 한국어에서는 수단·도구의 의미가 드러나는 ‘-로’가 가장 자연스럽습니다.
- source_word: ውስተ ጽልመት
  english_pob_choice: into the darkness
  chosen_korean: 어둠 속으로
  alternatives_korean:
  - 어둠으로
  - 그 어둠 속으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 형벌의 장소/상태를 구체적으로 드러내는 표현으로, 단순한 추상명사보다 ‘속으로’가 더 강한 공간성을 줍니다.
- source_word: አብቅዋ ለገዳም
  english_pob_choice: open the desert
  chosen_korean: 그 광야를 열어
  alternatives_korean:
  - 광야를 열어
  - 사막을 열어
  - 광야를 갈라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기존 영문 주석이 지적하듯 본문은 ‘광야/황야’를 열라는 난해한 명령을 담고 있으므로, 구체성을 덧붙이지 않고 직역에 가까운 ‘열어’를 유지했습니다.
- source_word: ዱዳኤል
  english_pob_choice: Dudael
  chosen_korean: 두다엘
  alternatives_korean:
  - 두다엘 지역
  - 두다엘 땅
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지명으로 음역해 본문이 특정한 장소를 가리킨다는 점을 보존했습니다.
theological_decisions:
- issue: 아자젤의 처벌 묘사 방식
  chosen_reading: 손발을 묶고 어둠 속으로 던진 뒤, 특정 광야를 열어 그곳에 던지는 구체적·물리적 형벌로 옮김
  alternative_readings:
  - 단순히 감금하라는 일반적 명령
  - 상징적 영적 어둠에 넘긴다는 완화된 표현
  rationale: 본문은 손, 발, 어둠, 광야, 던짐이라는 연속된 구체적 이미지로 처벌을 묘사하므로, 이를 추상화하지 않고 몸으로 체감되는 심판 장면으로 보존했습니다.
  doctrine_reference: 묵시문학적 심판 이미지를 평이한 종교 문장으로 희석하지 않음.
