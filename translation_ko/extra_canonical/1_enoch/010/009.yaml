  naturalness: 합쇼체 요청에 맞추어 인용문 안의 명령도 ‘-십시오’로 통일해야 합니다. ‘긴 날이 없을 것’은 직역투이므로, 심판의 수명 제한을 자연스럽게 나타내는 ‘오래 살지 못할 것’으로 옮깁니다.
