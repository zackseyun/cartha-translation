theological_decisions:
- issue: 심판 대상의 범위
  chosen_reading: 이 구절은 인류 일반이 아니라, 감시자들과의 불법한 결합에서 나온 혼종적 후손들을 특정하여 겨냥합니다.
  alternative_readings:
  - 거대한 존재들만을 겨냥한다
  - 사람들의 죄인 일반을 겨냥한다
  rationale: 연속되는 호칭이 혈통적·서사적 표지를 이루므로, 맥락상 특정 계열의 심판으로 유지해야 합니다.
  doctrine_reference: Preserve local passage meaning; do not harmonize beyond context.
- issue: 모욕적 혈통 언어의 보존
  chosen_reading: 주저 없이 직설적인 심판 어조를 유지합니다.
  alternative_readings:
  - ‘불법한 자들’ 대신 완곡한 표현을 쓴다
  - ‘음행의 자식들’을 약화시킨다
  rationale: 묵시문학의 심판 선언이 지닌 강도를 살리기 위해, 불편한 표현도 본문 수준에서 드러내는 편이 원문에 충실합니다.
  doctrine_reference: Preserve apocalyptic imagery and judgment formulas rather than smoothing them away.
