base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/009.yaml
  text: And to Gabriel the Lord said[a], “Go against the bastards and the reprobates, and against the children of fornication; destroy the children of fornication and the children of the Watchers from among humankind. Send them out against one another, and let them perish in battle[d][c][b]; for length of days shall not be theirs.”
  footnotes:
  - marker: a
    text: Or 'the illegitimate ones.' The Ge'ez term is a harsh label for offspring of illicit union.
    reason: lexical_alternative
  - marker: b
    text: The text is difficult in the phrase rendered 'the children of the Watchers.' The OCR shows ለውሉደ፡ ትጉሃን, and the sense is taken from the immediate Watchers context; some uncertainty remains.
    reason: textual_variant
  - marker: c
    text: A bracketed reading in the witness includes 'and send them out'; the sense of mutual conflict is clear even if the exact verbal sequence is uncertain.
    reason: textual_variant
  - marker: d
    text: Or 'let them destroy each other in battle'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 가브리엘에게 주님께서 말씀하셨습니다. 「그 불법한 자들과 버림받은 자들에게, 그리고 음행의 자식들에게로 가서, 음행의 자식들과 사람들 가운데 있는 감시자들의 자식들을 멸하라. 그들을 서로 맞서게 하여 전쟁에서 멸망하게 하라. 그들에게는 긴 날이 없을 것이기 때문입니다.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사생아들’ 또는 ‘불법한 결합에서 난 자들’로도 옮길 수 있습니다. 게에즈어는 불법한 출생을 가리키는 강한 경멸 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감시자들’은 1 Enoch의 고유 용어를 따른 번역입니다.
    reason: cross_reference
  - marker: c
    text: 일부 증언에는 ‘그들을 보내어’에 해당하는 말이 덧붙어 있어, 서로 충돌시키는 뜻은 분명하지만 정확한 동사 배열은 다소 불확실합니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘전쟁에서 서로를 멸망하게 하라’로도 이해할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወለገብርኤል፡ ይቤሎ፡ እግዚእ፡
  english_pob_choice: And to Gabriel the Lord said
  chosen_korean: 그리고 가브리엘에게 주님께서 말씀하셨습니다
  alternatives_korean:
  - 그리고 주님께서 가브리엘에게 말씀하셨습니다
  - 그리고 가브리엘에게 주님께서 이르셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어-목적어 구조를 자연스럽게 옮기되, divine speech의 화자임을 분명히 하기 위해 ‘주님’을 사용했습니다.
- source_word: ሑር፡ ዲቤሆሙ፡
  english_pob_choice: Go against them
  chosen_korean: 그 불법한 자들과 버림받은 자들에게로 가서
  alternatives_korean:
  - 그들에게 맞서 가서
  - 그들에게로 가서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 이동이 아니라 심판 명령의 적대적 접근이므로 ‘에게로 가서’에 대상 명시를 붙여 punitive force를 살렸습니다.
- source_word: ለመንዝራን፡ ወለማኑናን፡
  english_pob_choice: the bastards and the reprobates
  chosen_korean: 그 불법한 자들과 버림받은 자들
  alternatives_korean:
  - 그 사생아들과 버림받은 자들
  - 그 사생자들과 유기된 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 항은 강한 모욕적·심판적 뉘앙스를 지닌 혈통 언어이지만, 한국어에서는 과도하게 현대적 속어로 흐르지 않도록 ‘불법한 자들’로 옮겼고, 둘째 항은 거부·배제의 의미를 살려 ‘버림받은 자들’로 처리했습니다.
- source_word: ወዲበ፡ ውሉደ፡ ዘማ፡
  english_pob_choice: and against the children of fornication
  chosen_korean: 그리고 음행의 자식들에게
  alternatives_korean:
  - 그리고 음행의 자손들에게
  - 그리고 음란의 자식들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ዘማ의 성적 타락 의미를 직접 드러내기 위해 ‘음행’으로 옮겼고, genealogical insult를 유지하기 위해 ‘자식들’을 보존했습니다.
- source_word: ለውሉደ፡ ትጉሃን፡ እምሰብእ፡
  english_pob_choice: the children of the Watchers from among humankind
  chosen_korean: 사람들 가운데 있는 감시자들의 자식들
  alternatives_korean:
  - 사람들 가운데 있는 파수자들의 자식들
  - 인간들 가운데 있는 감시자들의 자식들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 고유 용례를 따라 ‘Watchers’를 ‘감시자들’로 옮겼고, ἔκ τοῦ ἀνθρώπων류의 범위를 ‘사람들 가운데 있는’으로 반영했습니다.
- source_word: ወአውፅኦሙ፡ [ወፈንዎሙ፡] በበይናቲሆሙ፡
  english_pob_choice: Send them out against one another
  chosen_korean: 그들을 서로 맞서게 하여
  alternatives_korean:
  - 그들을 서로에게 보내어
  - 그들을 서로 대항하게 하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 변이 독법이 시사하는 상호 충돌의 의미를 한국어 동사구로 압축해 반영했습니다.
- source_word: እሙንቱ፡ ወስሊሆሙ፡ በቀትል፡ ይትሐጐሉ፡
  english_pob_choice: and let them perish in battle
  chosen_korean: 전쟁에서 멸망하게 하라
  alternatives_korean:
  - 전투에서 멸망하게 하라
  - 전쟁 가운데 죽게 하라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 검토된 종결 형태가 수동·비능동적 ‘perish’이므로 능동적 상호살해로 풀지 않고, 심판 결과를 간명한 ‘멸망하다’로 옮겼습니다.
theological_decisions:
- issue: 심판 대상의 범위
  chosen_reading: 이 구절은 인류 일반이 아니라, 감시자들과의 불법한 결합에서 나온 혼종적 후손들을 특정하여 겨냥합니다.
  alternative_readings:
  - 거대한 존재들만을 겨냥한다
  - 사람들의 죄인 일반을 겨냥한다
  rationale: 연속되는 호칭이 혈통적·서사적 표지를 이루므로, 맥락상 특정 계열의 심판으로 유지해야 합니다.
  doctrine_reference: Preserve local passage meaning; do not harmonize beyond context.
- issue: 모욕적 혈통 언어의 보존
  chosen_reading: 주저 없이 직설적인 심판 어조를 유지합니다.
  alternative_readings:
  - ‘불법한 자들’ 대신 완곡한 표현을 쓴다
  - ‘음행의 자식들’을 약화시킨다
  rationale: 묵시문학의 심판 선언이 지닌 강도를 살리기 위해, 불편한 표현도 본문 수준에서 드러내는 편이 원문에 충실합니다.
  doctrine_reference: Preserve apocalyptic imagery and judgment formulas rather than smoothing them away.
