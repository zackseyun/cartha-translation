base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/002.yaml
  text: Go to Noah and say to him in my name[a], 'Hide yourself!' And reveal to him the end that is coming; for the whole earth will be destroyed, and a flood is about to come upon all the earth[c][b], and it will destroy whatever is in it.
  footnotes:
  - marker: a
    text: Or 'make known to him the coming end.' The Ge'ez can be rendered with slightly different word order without changing the sense.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'a flood of waters' preserves the emphatic wording of the Ge'ez rather than reducing it to a bare 'flood.'
    reason: cultural_note
  - marker: c
    text: Or 'And say to Noah, in my name, ‘Hide yourself, and reveal to him the end that is coming; for the whole earth will be destroyed, and a flood of waters is about to come upon all the earth, and it will destroy whatever is in it.’'.
    reason: previous_rendering
translation:
  language: ko
  text: 노아에게 가서 내 이름으로[a] 그에게 말하십시오. 「몸을 숨기십시오!」 그리고 그에게 다가올 끝을 알려 주십시오.[c] 온 땅이 멸망할 것이기 때문입니다. 물의 홍수가[b] 온 땅 위에 닥쳐 그 안에 있는 모든 것을 멸망시킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘내 이름으로’는 단순한 언급이 아니라 위임된 권위를 나타냅니다.
    reason: source_note
  - marker: b
    text: ‘물의 홍수’는 게에즈어의 강조된 표현을 살린 것으로, 단순히 ‘홍수’라고만 옮기면 중첩된 물의 이미지를 약화시킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 원문의 명령 순서는 ‘가서 → 말하라 → 숨으라 → 알리라’의 구조를 가지며, ‘알리라’는 노아에게가 아니라 그를 향해 주어진 별도 명령입니다.
    reason: source_note
lexical_decisions:
- source_word: ሖር ለኖኅ
  english_pob_choice: Go to Noah
  chosen_korean: 노아에게 가서
  alternatives_korean:
  - 노아에게 가십시오
  - 노아에게 가서 가르치십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문두 명령 ሖር은 단순한 이동 명령이므로 ‘가서’로 옮기고, 한국어에서는 목적어를 앞에 두어 자연스럽게 구성했습니다.
- source_word: በስመ ዚአየ
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름에 의지하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 위임된 권위의 공식이므로 직역적이면서도 관용적인 ‘내 이름으로’가 가장 적절합니다.
- source_word: ኅባእ ርእሰከ
  english_pob_choice: Hide yourself
  chosen_korean: 너 자신을 숨기십시오
  alternatives_korean:
  - 스스로 숨으십시오
  - 몸을 숨기십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 재귀 명령의 강한 긴급성을 살리기 위해 ‘너 자신을’로 풀어, 단순히 사물을 숨기는 뜻으로 약화되지 않게 했습니다.
- source_word: ፍጻሜ ዘይመጽእ
  english_pob_choice: the end that is coming
  chosen_korean: 다가오는 끝
  alternatives_korean:
  - 오고 있는 끝
  - 임하는 종말
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 종말론적 추상어보다 홍수 심판의 임박성을 드러내는 ‘다가오는 끝’이 원문의 긴박감을 잘 보존합니다.
- source_word: ማየ አይኅ
  english_pob_choice: a flood of waters
  chosen_korean: 물의 홍수
  alternatives_korean:
  - 물의 범람
  - 홍수의 물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘물’과 ‘홍수’의 중첩을 살리되 한국어에서 지나치게 어색하지 않도록 ‘물의 홍수’로 옮겨 강조를 보존했습니다.
theological_decisions:
- issue: 직접화법의 경계
  chosen_reading: 「너 자신을 숨기십시오!」까지만 노아에게 직접 말하는 것으로 두고, 그 뒤의 ‘그에게 드러내십시오’는 천사에게 주어진 별도 명령으로 처리했습니다.
  alternative_readings:
  - ‘그리고 그에게 드러내십시오’까지 노아에게 하는 말로 묶는 읽기
  - 직접화법 없이 한 문장으로 평서화하는 읽기
  rationale: 아무개 대명사 ‘그에게’의 지시 대상과 동사의 주어를 문법적으로 분명히 해야 원문의 명령 계층이 무너지지 않습니다. 이 구분은 본문이 가진 전달 구조를 보존합니다.
  doctrine_reference: 본문 내 화행 구조를 우선 보존
- issue: ‘끝’의 범위
  chosen_reading: ‘다가오는 끝’을 홍수 심판에 임박한 파멸로 이해하고, 추상적 최종 종말로 일반화하지 않았습니다.
  alternative_readings:
  - ‘종말’
  - ‘완성’
  rationale: 문맥은 우주적 종말론의 일반 개념보다 다가오는 홍수 심판의 경고에 초점이 있으므로, 그 지역적 의미를 유지했습니다.
  doctrine_reference: 국지적 문맥 우선 원칙
