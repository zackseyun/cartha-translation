base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/007.yaml
  text: And heal the earth which the angels have corrupted[a], and make known the healing of the earth, so that they may heal the earth, and all the children of men may not perish through all the secrets that the Watchers have disclosed[f] and taught to their sons.
  footnotes:
  - marker: a
    text: The clause rendered 'make known the healing of the earth' is textually and syntactically difficult. The Ge'ez wording may also be understood more literally as 'make known the life/restoration of the earth.'
    reason: textual_variant
  - marker: b
    text: The phrase rendered 'they may heal the plague' is uncertain in the surviving Ethiopic wording. Some interpreters understand the line more generally as the earth being restored or made to live.
    reason: lexical_alternative
  - marker: c
    text: '''Secrets'' here refers to illicit hidden knowledge disclosed by the Watchers in this section, not necessarily to divine mysteries revealed legitimately.'
    reason: cultural_note
  - marker: d
    text: Or 'so that they may heal the plague'.
    reason: previous_rendering
  - marker: e
    text: Or 'disclosed'.
    reason: previous_rendering
  - marker: f
    text: The Ge'ez literally reads "killed" (za-qatalu), reflecting a corruption in the underlying Greek transmission (ἐπάταξαν for ὑπέδειξαν, "showed/disclosed").
    reason: textual_variant
translation:
  language: ko
  text: 그리고 땅을 천사들이 더럽힌 것을 고치고, 땅의 치유를 알게 하여, 그들이 땅을 고칠 수 있게 하고, 파수꾼들이 드러내고 그들의 아들들에게 가르친 모든 비밀 때문에 사람의 모든 자녀가 멸망하지 않게 하십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 문자적으로는 “그들이 죽였다”(ዘቀተሉ)라고 읽히며, 이는 밑바탕 그리스어 전승의 훼손을 반영한 것으로 이해됩니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ‘비밀’은 파수꾼들이 불법적으로 드러낸 숨은 지식을 가리키며, 반드시 선한 계시를 뜻하는 것은 아닙니다.
    reason: cultural_note
  - marker: c
    text: 게에즈의 표현은 엄밀히는 “땅의 생명/회복”까지도 뜻할 수 있어, ‘치유’는 문맥에 따른 해석입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕይዋ / ሕይወታ
  english_pob_choice: heal / healing
  chosen_korean: 고치고 / 치유
  alternatives_korean:
  - 살리고 / 생명
  - 회복시키고 / 회복
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 훼손된 땅을 회복시키는 구문이므로, 직역적인 ‘생명’보다 ‘고치다/치유’가 더 자연스럽고 본문의 치유-회복 이미지를 살립니다.
- source_word: አማሰኑ
  english_pob_choice: have corrupted
  chosen_korean: 더럽힌
  alternatives_korean:
  - 망가뜨린
  - 파괴한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천사들의 행위가 땅에 미친 해악을 나타내며, 도덕적 오염과 피조세계의 훼손을 함께 드러낼 수 있는 표현으로 ‘더럽힌’을 택했습니다.
- source_word: አይድዕ ከመ
  english_pob_choice: make known ... so that
  chosen_korean: 알게 하여 ... 수 있게 하고
  alternatives_korean:
  - 알리셔서 ... 하게 하시고
  - 알려서 ... 하도록
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령적 알림과 목적/결과를 함께 나타내는 구문이므로, ‘알게 하여’와 ‘수 있게 하고’로 인과 관계를 자연스럽게 살렸습니다.
- source_word: ትጉሃን
  english_pob_choice: the Watchers
  chosen_korean: 파수꾼들
  alternatives_korean:
  - 감시자들
  - 깨어 있는 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 에녹 내부의 고유한 천사 집단 명칭으로서 ‘파수꾼들’이 가장 널리 알려진 대응어이며, 본문의 apocalyptic 용례를 유지합니다.
- source_word: በምሥጢር ኵሉ
  english_pob_choice: through all the secrets
  chosen_korean: 모든 비밀 때문에
  alternatives_korean:
  - 모든 숨은 지식 때문에
  - 모든 비밀을 통해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서의 ‘비밀’은 파수꾼들이 불법적으로 드러낸 숨은 지식을 가리키므로, 본문의 경고 성격을 살려 ‘모든 비밀 때문에’로 옮겼습니다.
- source_word: ዘቀተሉ
  english_pob_choice: disclosed
  chosen_korean: 드러내고
  alternatives_korean:
  - 가르치고
  - 알리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 문자 자체는 문자적으로 ‘죽였다’는 뜻이지만, 본문의 문맥과 전승 문제를 반영한 의미역이 필요하므로, ‘드러내고’로 옮기되 주석으로 문자형을 남깁니다.
theological_decisions:
- issue: 땅의 치유 대상
  chosen_reading: 이 구절은 인간 사회의 도덕 개선보다, 타락한 땅 자체의 실제 치유와 회복을 말합니다.
  alternative_readings:
  - 주로 사람들의 삶을 고치라는 뜻
  - 그저 땅이 ‘살게 하라’는 뜻
  rationale: 직접 목적어가 반복해서 ‘땅’이며, 훼손-치유의 대조가 피조세계 전체의 회복을 가리키므로, 우주적 회복의 뜻을 보존하는 번역이 필요합니다.
  doctrine_reference: 묵시문학적 우주 회복 이미지를 약화시키지 말 것.
- issue: ‘드러내고’의 문자적 전승
  chosen_reading: 본뜻은 파수꾼들이 불법적 비밀을 드러내어 가르쳤다는 의미로 읽되, 게에즈 문자형의 전승 손상을 각주로 남깁니다.
  alternative_readings:
  - 문자적으로는 ‘죽였다’로 읽을 수 있음
  - 전승 문제 없이 단순히 ‘가르쳤다’로만 읽기
  rationale: 게에즈 본문은 ዘቀተሉ라고 적지만, 학계와 영어 POB 주석이 지적하듯 이는 훼손된 그리스어 전승을 반영한 문자형입니다. 본문 의미를 살리되, 텍스트 비평 정보를 투명하게 제시해야 합니다.
  doctrine_reference: 본문 의미와 문자 전승을 함께 보존하는 비평적 번역 원칙.
