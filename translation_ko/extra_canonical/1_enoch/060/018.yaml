base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
  footnotes:
  - marker: a
    text: The line is difficult in Ge'ez. 'The spirit within it is distinct' may also be understood as 'the spirit in it is separate/by itself.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may identify the rising exhalation from the hail as ''Dew.'' The pronoun could also be rendered more personally: ''his name is Dew.'''
    reason: alternative_reading
  - marker: c
    text: Or 'And the spirit of hail'.
    reason: previous_rendering
  - marker: d
    text: Or 'its name is Dew'.
    reason: previous_rendering
  - marker: e
    text: Or 'went out'.
    reason: previous_rendering
  - marker: f
    text: Or 'is distinct'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우박의 영은 그의 권능의 힘으로부터 떠나갔고, 그 안의 영은 그 자체로 따로 있으며, 거기서 올라오는 것은 연기와 같고, 그 이름은 이슬입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 Ge'ez는 난해하여, ‘그 안의 영은 따로 있다/그 자체로 있다’는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 절은 ‘그 이름은 이슬이다’로도, ‘그 이름은 서리다’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: መንፈሰ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 바람
  - 숨
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥은 우박을 둘러싼 우주적·의인화된 작용을 말하므로, 단순한 기상 현상인 ‘바람’보다 ‘영’이 더 잘 맞습니다.
- source_word: ሐመዳ
  english_pob_choice: hail
  chosen_korean: 우박
  alternatives_korean:
  - 서리
  - 얼음
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 어휘는 기상 현상 가운데 우박을 가리키는 것이 가장 자연스러우므로, 문맥의 파괴적 강설 이미지를 살려 ‘우박’으로 옮겼습니다.
- source_word: ባሕቲቱ
  english_pob_choice: is by itself
  chosen_korean: 그 자체로 따로 있으며
  alternatives_korean:
  - 홀로 있으며
  - 분리되어 있으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 핵심은 ‘혼자/따로/그 자체로’라는 분리성과 독립성입니다. 한국어에서는 관계를 자연스럽게 드러내기 위해 ‘그 자체로 따로 있으며’로 옮겼습니다.
- source_word: ስሙ ደይክ
  english_pob_choice: its name is Dew
  chosen_korean: 그 이름은 이슬입니다
  alternatives_korean:
  - 그 이름은 서리입니다
  - 그 이름은 눈입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 주석처럼 이 결론부는 ‘Dew’로도 이해될 수 있으므로, 한국어에서는 주된 채택안을 따라 ‘이슬’을 본문에 두었습니다.
theological_decisions:
- issue: 우박의 ‘영’과 그 명명된 산출물을 현대적 자연현상으로만 평평하게 번역할지 여부
  chosen_reading: 의인화된 우주적 실재로서 ‘영’과 ‘이슬’의 명명 구조를 유지했습니다.
  alternative_readings:
  - ‘우박의 바람’ 또는 단순한 수증기/기상 과정으로 축소 번역
  - ‘서리’로 번역해 기상학적 이미지에만 한정
  rationale: 1에녹서는 자연현상을 질서 잡힌 영적 작용으로 묘사하는 경우가 많으므로, 본문이 가진 상상 세계를 평면화하지 않도록 의인화와 명명 구조를 보존했습니다.
  doctrine_reference: 묵시적 우주론과 의인화된 자연어를 보존하는 번역 원칙
