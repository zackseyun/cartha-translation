base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
  footnotes:
  - marker: a
    text: The line is difficult in Ge'ez. 'The spirit within it is distinct' may also be understood as 'the spirit in it is separate/by itself.'
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may identify the rising exhalation from the hail as ''Dew.'' The pronoun could also be rendered more personally: ''his name is Dew.'''
    reason: alternative_reading
  - marker: c
    text: Or 'And the spirit of hail'.
    reason: previous_rendering
  - marker: d
    text: Or 'its name is Dew'.
    reason: previous_rendering
  - marker: e
    text: Or 'went out'.
    reason: previous_rendering
  - marker: f
    text: Or 'is distinct'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우박의 영이 그의 권능의 힘에 힘입어 떠나갔습니다. 그 안의 영은 홀로 있으며[a], 거기서 올라오는 것은 연기와 같고, 그 이름은 서리입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 Ge'ez는 난해합니다. ‘그 안의 영은 홀로 있다’는 말은 ‘그 안에 있는 영은 그 자체로 따로 있다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 명명어는 일반적으로 ‘서리’로 이해됩니다. 그러나 이를 ‘이슬’로 읽을 가능성도 제기됩니다. 대명사는 그 올라오는 현상, 또는 의인화된 존재를 가리킬 수 있습니다.
    reason: alternative_reading
