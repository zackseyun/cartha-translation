base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/015.yaml
  text: For when the lightning flashes[a], the thunder gives its voice, and the spirit rests at its appointed time, and it divides equally among them; for the treasury of their times is of sand, and the two of them are restrained with a bridle and turned back by the power of the spirit[d][c][b], and they are driven on likewise according to the many regions of the earth.
  footnotes:
  - marker: a
    text: Or 'wind' in both occurrences of 'spirit'; the verse moves within storm imagery, and the Ge'ez term can denote wind, breath, or spirit.
    reason: lexical_alternative
  - marker: b
    text: The final comparison is textually difficult in the Ethiopic witness; 'dwelling-places' could also be understood more broadly as habitations or regions of the earth.
    reason: textual_variant
  - marker: c
    text: The clause rendered 'he divides equally among them' is uncertain; a more cautious alternative is 'he apportions among them.'
    reason: alternative_reading
  - marker: d
    text: Or 'and he divides equally among them; for the treasury of their times is fixed, and they are stirred and moved by the power of the spirit, and purified from among them, like the many dwelling-places of the earth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 번개가 번쩍일 때에 천둥은 자기 소리를 내고, 영은 그 정해진 때에 쉬며 그들 가운데를 나누어 줍니다. 그들의 때의 곳간은 모래이며, 그 둘은 굴레로 제어되고 영의 힘으로 되돌려지며, 또한 땅의 많은 지역에 따라 그렇게 몰려갑니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바람’. 이 절은 폭풍 이미지 안에 있으므로, 게에즈어 መንፈስ은 ‘바람’, ‘숨’, ‘영’ 모두를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 끝부분의 ‘땅의 많은 지역’은 원문에서 지리적 구획을 가리키는 표현으로 이해할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ይበርቅ መብረቅ
  english_pob_choice: the lightning flashes
  chosen_korean: 번개가 번쩍일 때에
  alternatives_korean:
  - 번개가 빛날 때에
  - 번개가 치면
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사-명사 결합의 생동감을 살리면서 번개의 순간적 광휘를 자연스럽게 옮기기 위해 ‘번쩍일 때에’로 옮겼습니다.
- source_word: ነጐድጓድ ቃሎ ይሁብ
  english_pob_choice: the thunder gives its voice
  chosen_korean: 천둥은 자기 소리를 내고
  alternatives_korean:
  - 천둥은 소리를 내고
  - 천둥이 자기 음성을 내고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적인 ‘voice’의 인격화된 표현을 살리되 한국어로는 자연스러운 ‘자기 소리를 내고’가 가장 직접적이어서 채택했습니다.
- source_word: መንፈስ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 바람
  - 숨
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절은 기상 이미지 안에 있으나, POB의 최종 수정본처럼 통제력과 작용을 지닌 힘의 층위를 보존하기 위해 ‘바람’ 대신 중립적인 ‘영’을 유지했습니다.
- source_word: በጊዜሃ ያዐርፍ
  english_pob_choice: rests at its appointed time
  chosen_korean: 그 정해진 때에 쉬며
  alternatives_korean:
  - 그 정한 때에 쉬며
  - 그 시기에 머물며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘appointed time’의 예정성을 살려 ‘정해진 때’로 옮기고, 동작은 ‘쉬며’로 간결하게 처리했습니다.
- source_word: በአጓም ይትነኃዙ
  english_pob_choice: are restrained with a bridle
  chosen_korean: 굴레로 제어되고
  alternatives_korean:
  - 굴레로 매여지고
  - 재갈로 억제되고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수정된 영어 POB가 반영한 제어 이미지에 맞추어, ‘bridle’의 말굴레 이미지를 한국어의 ‘굴레’로 옮겼습니다.
- source_word: ወይትመየጡ
  english_pob_choice: turned back
  chosen_korean: 되돌려지며
  alternatives_korean:
  - 되돌아가며
  - 꺾이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 방향 전환 의미를 직설적으로 살리기 위해 ‘되돌려지며’로 옮겼습니다.
- source_word: ወይትነጸኡ
  english_pob_choice: they are driven on
  chosen_korean: 몰려갑니다
  alternatives_korean:
  - 내몰립니다
  - 이끌려 갑니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최종 수정본의 ‘driven on’에 맞춰 수동적 추진을 담되, 한국어에서는 자연스러운 종결 표현으로 ‘몰려갑니다’를 택했습니다.
- source_word: ከመዝ ... ብዙኃ አድዋስ ምድር
  english_pob_choice: according to the many regions of the earth
  chosen_korean: 땅의 많은 지역에 따라
  alternatives_korean:
  - 땅의 많은 구역에 따라
  - 땅의 많은 곳에 따라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최종 수정본의 ‘regions’에 따라 ‘지역’으로 옮겨, 지리적 분포의 의미를 간명하게 전달했습니다.
theological_decisions:
- issue: መንፈስ을 ‘바람’으로 풀지, ‘영’으로 유지할지
  chosen_reading: 영
  alternative_readings:
  - 바람
  - 숨
  rationale: 본문의 기상 문맥 때문에 ‘바람’이 가능하지만, 절 내에서 영이 시간과 힘을 매개하는 주체로 작동하므로 원문이 가진 층위를 보존하기 위해 ‘영’을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it.'
