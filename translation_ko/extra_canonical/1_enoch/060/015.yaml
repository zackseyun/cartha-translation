theological_decisions:
- issue: መንፈስ을 ‘바람’으로 풀지, ‘영’으로 유지할지
  chosen_reading: 영
  alternative_readings:
  - 바람
  - 숨
  rationale: 본문의 기상 문맥 때문에 ‘바람’이 가능하지만, 절 내에서 영이 시간과 힘을 매개하는 주체로 작동하므로 원문이 가진 층위를 보존하기 위해 ‘영’을 유지했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it.'
