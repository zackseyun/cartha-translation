  chosen_reading: ‘콩팥’과 ‘허리’의 신체 이미지를 그대로 살려, 내면의 공포를 육체적 붕괴로 묘사하는 수사학을 유지했습니다.
  alternative_readings:
  - ‘내 속이 풀려 버렸고’
  - ‘내 마음이 무너졌고’
  rationale: 본문은 단순한 감정 진술이 아니라 신체가 무너지는 환시적 공포를 보여 주므로, 현대적 완곡어로 바꾸지 않는 편이 원문 효과를 더 정확히 전달합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve apocalyptic bodily imagery rather than smoothing it away.'
