base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/003.yaml
  text: And as for me[a], a great trembling seized me, and fear took hold of me; and my loins were broken, and my kidneys were loosened[d][c][b], and I fell on my face.
  footnotes:
  - marker: a
    text: Literally 'my kidneys were dissolved.' In ancient Semitic-style bodily language, the kidneys can represent the inner self or deep emotions.
    reason: cultural_note
  - marker: b
    text: The clause about the loins may also be rendered 'my hips gave way' or 'my loins collapsed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And a great trembling seized me'.
    reason: previous_rendering
  - marker: d
    text: Or 'my loins were loosened'.
    reason: previous_rendering
translation:
  language: ko
  text: 저에게는 큰 떨림이 임하여 두려움이 저를 사로잡았고, 내 허리는 부러졌으며, 내 콩팥은 풀려 버렸고, 나는 얼굴을 땅에 대고 넘어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘콩팥’은 문자적으로는 신장/콩팥이지만, 고대 셈어권에서는 내면의 깊은 감정이나 존재 전체를 가리키는 몸 언어로 쓰입니다.
    reason: cultural_note
  - marker: b
    text: ‘허리’는 문자적 신체 부위이지만, 여기서는 힘과 지탱이 무너지는 뜻을 담을 수 있습니다.
    reason: cultural_note
