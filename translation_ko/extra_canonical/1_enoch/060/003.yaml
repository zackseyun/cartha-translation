  rationale: 문자적으로는 ‘콩팥’이지만, 고대 세미어적 신체 언어에서 내면의 붕괴를 가리키는 표현이므로 본문에는 투명하게 두고, 한국어에서는 ‘풀려 버렸고’로 붕괴감을 살렸습니다.
- source_word: ወወደቁ በገጽየ
  english_pob_choice: and I fell on my face
  chosen_korean: 나는 얼굴을 땅에 대고 넘어졌습니다
  alternatives_korean:
