base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/020.yaml
  text: And the spirit of the dew has its dwelling at the ends of heaven[a], and it is joined with the storehouses of the rain; and its course is in winter and in summer, and its clouds and the clouds of the mist are joined together[d][c][b], and one gives to another.
  footnotes:
  - marker: a
    text: Or 'its circuit' or 'its path' for 'its course.' The Ge'ez term can denote movement or a route, and the exact nuance is uncertain in this weather-cosmology context.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may imply reciprocal exchange among dew, rain, and cloud formations: ''the one gives to the other'' or ''each gives to the other.'''
    reason: lexical_alternative
  - marker: c
    text: The word rendered 'mist' is somewhat uncertain; 'fog' or 'haze' are possible.
    reason: lexical_alternative
  - marker: d
    text: Or 'has its storehouse'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이슬의 영은 하늘의 끝에 거처하며[a], 비의 창고들과 연결되어 있습니다. 그 길은 겨울에도 여름에도 있으며, 그 영들과 안개의 영들은 서로 결합되어 있고[d][c][b], 하나가 다른 하나에게 줍니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 순환’이나 ‘그 경로’로도 옮길 수 있습니다. 이 에티오피아어 표현은 움직임, 순환, 경로의 뉘앙스를 모두 가질 수 있어 정확한 뜻은 문맥상 다소 불확실합니다.
    reason: lexical_alternative
  - marker: b
    text: '마지막 절은 이슬, 비, 구름들 사이의 상호적 교환을 암시할 수 있습니다: ‘하나가 다른 하나에게 준다’ 또는 ‘각각이 다른 것에게 준다’.'
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘안개’로 옮긴 말은 다소 불확실하며, ‘안개’나 ‘연무’도 가능합니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그의 창고가 있다’로도 옮길 수 있습니다. 다만 이 절에서는 ማኅደር과 뒤의 መዛግብተ가 구별되므로 ‘거처’로 유지했습니다.
    reason: previous_rendering
