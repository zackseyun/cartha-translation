theological_decisions:
- issue: ‘holy ones’의 범주
  chosen_reading: 천상적 거룩한 존재들, 곧 천사적 무리로 이해함
  alternative_readings:
  - 인간 성도들
  - 혼합된 하늘 회중
  rationale: 문맥상 미카엘이 천사를 보내는 장면이므로, ‘holy ones’는 인간 신자가 아니라 천상 세계의 거룩한 존재들을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 'Book context: apocalyptic heavenly host; avoid later ecclesial harmonization.'
- issue: ‘my spirit returned’의 난해한 표현
  chosen_reading: 혼절에서 회복되어 영이 돌아온 것으로 본문은 그대로 유지함
  alternative_readings:
  - 내 영이 들어왔다
  - 내 영이 내게 되돌아왔다
  rationale: 게에즈 동사의 기본 의미와 앞문맥의 압도적 환상을 함께 고려하면, 본문은 에녹이 감각을 회복하는 장면으로 읽히며, 의미를 과도하게 해소하지 않되 문맥적 자연스러움을 살렸습니다.
  doctrine_reference: Preserve local apocalyptic tension while respecting the source verb.
