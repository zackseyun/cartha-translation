  rationale: ፈነወ는 ‘보내다/파견하다’의 자연스러운 의미이므로 ‘보내고’로 옮기고, ካልአ መልአከ는 구별되는 추가 천사를 가리키므로 ‘또 하나의 천사’가 가장 직접적입니다.
- source_word: እምቅዱሳን
  english_pob_choice: from among the holy ones
  chosen_korean: 성도들 가운데서
  alternatives_korean:
