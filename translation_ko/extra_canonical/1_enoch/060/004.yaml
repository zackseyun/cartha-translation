base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/004.yaml
  text: And Michael sent another angel from among the holy ones[a], and he lifted me up. And when he lifted me up, my spirit entered in[c][b], for I was not able to endure the sight of that power and its shaking and the quaking of heaven.
  footnotes:
  - marker: a
    text: The clause 'my spirit entered' is difficult in Ge'ez and may mean that Enoch's spirit returned to him or came into a new visionary state.
    reason: lexical_alternative
  - marker: b
    text: Or 'the sight of that mighty power and its tumult, and the quaking of heaven.' The exact relation of 'power,' 'shaking/tumult,' and 'heaven' is syntactically compressed.
    reason: alternative_reading
  - marker: c
    text: Or 'my spirit entered'.
    reason: previous_rendering
translation:
  language: ko
  text: 미카엘이 성도들[a] 가운데서 또 하나의 천사를 보내고, 그가 나를 들어 올렸습니다. 그가 나를 들어 올렸을 때 내 영이 돌아왔습니다. 나는 그 능력과 그 요동과 하늘의 진동을 보는 것을 견딜 수 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 이 문맥에서 인간의 ‘성도들’보다 천상적 거룩한 존재들을 가리키는 것으로 읽는 것이 자연스럽습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ወፈነወ ሚካኤል ካልአ መልአከ
  english_pob_choice: And Michael sent another angel
  chosen_korean: 미카엘이 또 하나의 천사를 보내고
  alternatives_korean:
  - 미카엘이 다른 천사를 보내고
  - 미카엘이 한 천사를 더 보내고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ፈነወ는 ‘보내다/파견하다’의 자연스러운 의미이므로 ‘보내고’로 옮기고, ካልአ መልአከ는 구별되는 추가 천사를 가리키므로 ‘또 하나의 천사’가 가장 직접적입니다.
- source_word: እምቅዱሳን
  english_pob_choice: from among the holy ones
  chosen_korean: 성도들 가운데서
  alternatives_korean:
  - 거룩한 이들 가운데서
  - 거룩한 존재들 가운데서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘~가운데서’는 집단 내부에서 나온다는 뜻을 살리고, ‘성도들’은 이 본문의 천상적 집단을 너무 교회 제도적으로 만들지 않으면서도 ‘holy ones’의 의미를 충분히 전달합니다.
- source_word: ወአንሥአኒ
  english_pob_choice: and he lifted me up
  chosen_korean: 그가 나를 들어 올렸습니다
  alternatives_korean:
  - 그가 나를 일으켰습니다
  - 그가 나를 끌어올렸습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시각적·공간적 상승 이미지를 살려 ‘들어 올렸습니다’로 옮겼습니다.
- source_word: መንፈስየ ገብአት
  english_pob_choice: my spirit entered in
  chosen_korean: 내 영이 돌아왔습니다
  alternatives_korean:
  - 내 영이 들어왔습니다
  - 내 영이 다시 돌아왔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 ገብአ는 ‘돌아오다/되돌아오다’의 뜻이므로, 혼절에서 회복되는 관용적 의미를 반영해 ‘내 영이 돌아왔습니다’로 번역했습니다.
- source_word: ኢክህልኩ ተዓግሦ ራእየ ዝኩ ኃይል
  english_pob_choice: I was not able to endure the sight of that power
  chosen_korean: 나는 그 능력을 보는 것을 견딜 수 없었습니다
  alternatives_korean:
  - 나는 그 힘의 모습을 견딜 수 없었습니다
  - 나는 그 권능의 광경을 견딜 수 없었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ኃይል은 ‘능력/힘/권능’의 폭이 있지만 여기서는 압도적 천상 현현을 가리키므로 ‘그 능력’으로 간결하게 살렸습니다.
- source_word: ሀውከ ወአንቀልቅለ ሰማይ
  english_pob_choice: and its shaking and the quaking of heaven
  chosen_korean: 그 요동과 하늘의 진동
  alternatives_korean:
  - 그 소란과 하늘의 진동
  - 그 흔들림과 하늘의 떨림
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞뒤 병렬 구조를 살려 ‘요동’과 ‘진동’으로 옮겨, 천상적 격변의 반복적 울림을 유지했습니다.
theological_decisions:
- issue: ‘holy ones’의 범주
  chosen_reading: 천상적 거룩한 존재들, 곧 천사적 무리로 이해함
  alternative_readings:
  - 인간 성도들
  - 혼합된 하늘 회중
  rationale: 문맥상 미카엘이 천사를 보내는 장면이므로, ‘holy ones’는 인간 신자가 아니라 천상 세계의 거룩한 존재들을 가리키는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 'Book context: apocalyptic heavenly host; avoid later ecclesial harmonization.'
- issue: ‘my spirit returned’의 난해한 표현
  chosen_reading: 혼절에서 회복되어 영이 돌아온 것으로 본문은 그대로 유지함
  alternative_readings:
  - 내 영이 들어왔다
  - 내 영이 내게 되돌아왔다
  rationale: 게에즈 동사의 기본 의미와 앞문맥의 압도적 환상을 함께 고려하면, 본문은 에녹이 감각을 회복하는 장면으로 읽히며, 의미를 과도하게 해소하지 않되 문맥적 자연스러움을 살렸습니다.
  doctrine_reference: Preserve local apocalyptic tension while respecting the source verb.
