  rationale: 게에즈 ገብአ는 ‘돌아오다/되돌아오다’의 뜻이므로, 혼절에서 회복되는 관용적 의미를 반영해 ‘내 영이 돌아왔습니다’로 번역했습니다.
- source_word: ኢክህልኩ ተዓግሦ ራእየ ዝኩ ኃይል
  english_pob_choice: I was not able to endure the sight of that power
  chosen_korean: 나는 그 능력을 보는 것을 견딜 수 없었습니다
