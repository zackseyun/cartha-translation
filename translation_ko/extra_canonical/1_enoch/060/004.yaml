  - 거룩한 존재들 가운데서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘~가운데서’는 집단 내부에서 나온다는 뜻을 살리고, ‘성도들’은 이 본문의 천상적 집단을 너무 교회 제도적으로 만들지 않으면서도 ‘holy ones’의 의미를 충분히 전달합니다.
