- source_word: ዘስማ ሌዋያታን
  english_pob_choice: whose name is Lewyatan
  chosen_korean: 이름이 레위야탄인
  alternatives_korean:
  - 이름이 리워야단인
  - 이름이 레비아탄인
  lexicon: Project proper-noun transliteration policy; Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 철자에 더 직접적인 음역을 본문에 두되, 한국어에서 인지 가능한 형태로 옮겼습니다.
- source_word: በልጕተ ባሕር / መልዕልተ አነቅዕተ ማያት
  english_pob_choice: in the abyss of the sea / above the springs of the waters
  chosen_korean: 바다의 깊은 곳[b]— 물들의 샘들 위에 있는 곳[c]—
  alternatives_korean:
  - 바다의 심연[b]— 물들의 샘들 위에 있는 곳[c]—
  - 바다의 깊은 곳[b]— 물의 샘들 위에 있는 곳[c]—
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘깊은 곳’은 abyssal region의 과도한 해석을 피하면서도 본문의 심연 이미지를 살리고, ‘물들의 샘들’은 원문의 우주론적 수원 이미지를 그대로 보존합니다.
theological_decisions:
- issue: Leviathan 이름의 음역을 본문에 어떻게 둘 것인가
  chosen_reading: 레위야탄
  alternative_readings:
  - 리워야단
  - 레비아탄
  rationale: 이 구절은 창조 질서 속의 신화적 존재를 다루므로, 본문에는 음역을 유지하고 통상적인 한국 교회어보다 원천 언어 흔적을 더 가깝게 반영했습니다.
  doctrine_reference: 'Translation philosophy: preserve source-form proper names unless a standard biblical form is overwhelmingly established.'
- issue: ‘괴물’이라는 표현이 지나치게 현대적이거나 경멸적으로 들릴 가능성
  chosen_reading: 그 두 괴물
  alternative_readings:
  - 그 두 짐승
  - 그 두 생물
  rationale: 엔녹서의 우주론적·비정상적 존재감을 약화시키지 않기 위해, 일반적인 동물이나 중립적 생물보다 ‘괴물’을 선택했습니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic/mythic imagery rather than domesticating it into generic prose.'
