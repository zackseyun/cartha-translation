  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 완료 시제의 사건을 한국어에서도 과거 완료적 느낌으로 살리면서, ‘분리되다’가 원문의 우주적 분리/구분을 가장 직접적으로 반영합니다.
- source_word: ክልኤቱ ዐናብርት
