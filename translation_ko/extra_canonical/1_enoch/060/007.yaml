base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
  footnotes:
  - marker: a
    text: Lewyatan is the well-known sea-creature name often rendered 'Leviathan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the deep of the sea'; the Ge'ez term denotes a deep or abyssal region.
    reason: lexical_alternative
  - marker: c
    text: The wording places her domain in relation to 'the springs/fountains of the waters,' preserving ancient cosmological imagery rather than a modern geographic description.
    reason: cultural_note
  - marker: d
    text: Or 'And on that day the two monsters will be separated:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날에 그 두 괴물은 분리되었습니다[a]. 곧 이름이 레위야탄인 한 암괴물이었는데, 바다의 깊은 곳[b]— 물들의 샘들 위에 있는 곳[c]— 에 거주하도록 되어 있었습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 그날에 그 두 괴물은 분리될 것입니다”로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: b
    text: 또는 “바다의 심연”입니다. 게에즈어 표현은 깊은 바다/심연의 영역을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 이 표현은 현대 지리 설명이 아니라 고대 우주론의 물의 근원을 보존합니다.
    reason: cultural_note
  - marker: d
    text: 또는 “거주하게 될 것이었습니다”로도 옮길 수 있습니다. 다만 게에즈 완료형을 반영해 과거로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ተካፈሉ
  english_pob_choice: were separated
  chosen_korean: 분리되었습니다
  alternatives_korean:
