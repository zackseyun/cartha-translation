base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
  footnotes:
  - marker: a
    text: Lewyatan is the well-known sea-creature name often rendered 'Leviathan.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the deep of the sea'; the Ge'ez term denotes a deep or abyssal region.
    reason: lexical_alternative
  - marker: c
    text: The wording places her domain in relation to 'the springs/fountains of the waters,' preserving ancient cosmological imagery rather than a modern geographic description.
    reason: cultural_note
  - marker: d
    text: Or 'And on that day the two monsters will be separated:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 두 괴물이 분리되었습니다. 그중 이름이 레위야탄인 암컷 괴물은 물들의 샘들 위에 있는 바다의 깊은 곳[a]에 살도록 분리되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바다의 심연”입니다. 게에즈어 표현은 깊은 바다 또는 심연의 영역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: “물들의 샘들 위에”라는 표현은 현대 지리 설명이 아니라 물의 근원에 관한 고대 우주론적 이미지를 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ተካፈሉ
  english_pob_choice: were separated
  chosen_korean: 분리되었습니다
  alternatives_korean:
  - 나뉘었습니다
  - 갈라졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 완료 시제의 사건을 한국어에서도 과거 완료적 느낌으로 살리면서, ‘분리되다’가 원문의 우주적 분리/구분을 가장 직접적으로 반영합니다.
- source_word: ክልኤቱ ዐናብርት
  english_pob_choice: the two monsters
  chosen_korean: 그 두 괴물
  alternatives_korean:
  - 그 두 짐승
  - 그 두 존재
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문은 신화적·우주적 생물들을 가리키므로, ‘괴물’이 그 이질성과 장엄성을 가장 잘 보존합니다.
- source_word: ዐንበሪ አንስትያዊት
  english_pob_choice: a female monster
  chosen_korean: 한 암괴물
  alternatives_korean:
  - 한 여성 괴물
  - 한 암컷 괴물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 암수 구분을 드러내는 수식이므로 ‘암-’을 써서 성별 정보를 간결하게 반영하고, ‘괴물’ 반복을 유지해 신화적 어감을 살렸습니다.
- source_word: ዘስማ ሌዋያታን
  english_pob_choice: whose name is Lewyatan
  chosen_korean: 이름이 레위야탄인
  alternatives_korean:
  - 이름이 리워야단인
  - 이름이 레비아탄인
  lexicon: Project proper-noun transliteration policy; Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 철자에 더 직접적인 음역을 본문에 두되, 한국어에서 인지 가능한 형태로 옮겼습니다.
- source_word: በልጕተ ባሕር / መልዕልተ አነቅዕተ ማያት
  english_pob_choice: in the abyss of the sea / above the springs of the waters
  chosen_korean: 바다의 깊은 곳[b]— 물들의 샘들 위에 있는 곳[c]—
  alternatives_korean:
  - 바다의 심연[b]— 물들의 샘들 위에 있는 곳[c]—
  - 바다의 깊은 곳[b]— 물의 샘들 위에 있는 곳[c]—
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘깊은 곳’은 abyssal region의 과도한 해석을 피하면서도 본문의 심연 이미지를 살리고, ‘물들의 샘들’은 원문의 우주론적 수원 이미지를 그대로 보존합니다.
theological_decisions:
- issue: Leviathan 이름의 음역을 본문에 어떻게 둘 것인가
  chosen_reading: 레위야탄
  alternative_readings:
  - 리워야단
  - 레비아탄
  rationale: 이 구절은 창조 질서 속의 신화적 존재를 다루므로, 본문에는 음역을 유지하고 통상적인 한국 교회어보다 원천 언어 흔적을 더 가깝게 반영했습니다.
  doctrine_reference: 'Translation philosophy: preserve source-form proper names unless a standard biblical form is overwhelmingly established.'
- issue: ‘괴물’이라는 표현이 지나치게 현대적이거나 경멸적으로 들릴 가능성
  chosen_reading: 그 두 괴물
  alternative_readings:
  - 그 두 짐승
  - 그 두 생물
  rationale: 엔녹서의 우주론적·비정상적 존재감을 약화시키지 않기 위해, 일반적인 동물이나 중립적 생물보다 ‘괴물’을 선택했습니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic/mythic imagery rather than domesticating it into generic prose.'
