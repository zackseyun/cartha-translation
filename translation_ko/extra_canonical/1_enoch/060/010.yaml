base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/010.yaml
  text: And he said to me[a], “You, son of man[c][b], here you desire to understand what is hidden.”
  footnotes:
  - marker: a
    text: Or 'human one' or 'mortal.' Here 'son of man' is an address to the seer, not necessarily the exalted figure called 'the Son of Man' elsewhere in the Parables.
    reason: lexical_alternative
  - marker: b
    text: The final phrase could also be rendered 'to know the hidden thing' or 'to learn what is concealed.'
    reason: lexical_alternative
  - marker: c
    text: Or 'You, son of man, here desire to understand what is hidden.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 나에게 말하였습니다. 「너, 인자여, 여기에서 네가 숨겨진 것을 이해하려고 합니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인자’는 여기서 시현자에게 하는 호칭이며, 다른 곳에서 말하는 종말론적 ‘인자’ 칭호와는 구분됩니다.
    reason: theological_note
  - marker: b
    text: ‘숨겨진 것’은 ‘감추어진 것’ 또는 ‘알려지지 않은 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘너, 인자여, 여기에서 네가 숨겨진 것을 이해하려고 합니다’가 될 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወይቤለኒ
  english_pob_choice: And he said to me
  chosen_korean: 그가 나에게 말하였습니다
  alternatives_korean:
  - 그가 나에게 말했습니다
  - 그리고 그가 나에게 말하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 평서형 서술 도입 공식으로서 ‘말하였습니다’가 문맥상 자연스럽고, 직설화법의 시작을 분명하게 드러냅니다.
- source_word: አንተ
  english_pob_choice: You
  chosen_korean: 너
  alternatives_korean:
  - 당신
  - 그대
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 원문은 직접적 2인칭 호칭을 강조하므로, 예언/환상 대화의 직설성을 살려 ‘너’로 옮겼습니다.
- source_word: ወልደ ሰብእ
  english_pob_choice: son of man
  chosen_korean: 인자여
  alternatives_korean:
  - 사람의 아들이여
  - 인간이여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 셈어적 호칭을 유지하되, 한국어에서 호칭으로 자연스러운 ‘-여’형을 사용해 직접 부름을 살렸습니다. 다만 여기서는 후기 기독론적 호칭보다 수신자 지칭이라는 점을 우선했습니다.
- source_word: በዝየ
  english_pob_choice: here
  chosen_korean: 여기에서
  alternatives_korean:
  - 여기서
  - 이곳에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 장면의 지시성을 살리기 위해 위치 표지로 옮겼고, 문장 흐름상 ‘여기에서’가 가장 무난합니다.
- source_word: ታእምር ዘኅቡእ
  english_pob_choice: to understand what is hidden
  chosen_korean: 숨겨진 것을 이해하려고 합니다
  alternatives_korean:
  - 감추어진 것을 알려고 합니다
  - 숨겨진 것을 알려고 합니다
  - 감추어진 바를 이해하려고 합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 ታእምር는 단순 인지가 아니라 인식적 파악을 뜻하므로 ‘이해하다’로 옮겼고, ዘኅቡእ는 ‘숨겨진 것’으로 처리해 ‘mystery’ 같은 해석어를 덧씌우지 않았습니다.
theological_decisions:
- issue: ‘인자’ 호칭의 범위
  chosen_reading: 여기서는 엘로크/에녹에게 주어지는 직접 호칭으로 번역하고, 종말론적 ‘인자’ 칭호와는 구분을 유지했습니다.
  alternative_readings:
  - 그 사람
  - 인간이여
  - 사람의 아들이여
  rationale: 영어 POB 주석처럼 이 표현은 여기서 시현자에게 하는 호칭이므로, 본문 내 기능을 우선해 번역하되 후대의 메시아 칭호와 혼동되지 않도록 했습니다.
  doctrine_reference: 본문 문맥 우선 원칙; 동일 어구의 다층적 용례를 문맥으로 구분
