  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 셈어적 호칭을 유지하되, 한국어에서 호칭으로 자연스러운 ‘-여’형을 사용해 직접 부름을 살렸습니다. 다만 여기서는 후기 기독론적 호칭보다 수신자 지칭이라는 점을 우선했습니다.
- source_word: በዝየ
  english_pob_choice: here
  chosen_korean: 여기에서
  alternatives_korean:
  - 여기서
  - 이곳에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 장면의 지시성을 살리기 위해 위치 표지로 옮겼고, 문장 흐름상 ‘여기에서’가 가장 무난합니다.
- source_word: ታእምር ዘኅቡእ
  english_pob_choice: to understand what is hidden
  chosen_korean: 숨겨진 것을 이해하려고 합니다
  alternatives_korean:
  - 감추어진 것을 알려고 합니다
  - 숨겨진 것을 알려고 합니다
  - 감추어진 바를 이해하려고 합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 ታእምር는 단순 인지가 아니라 인식적 파악을 뜻하므로 ‘이해하다’로 옮겼고, ዘኅቡእ는 ‘숨겨진 것’으로 처리해 ‘mystery’ 같은 해석어를 덧씌우지 않았습니다.
