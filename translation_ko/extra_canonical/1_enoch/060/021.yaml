  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반사적/수동적 결합을 한국어에서 자연스럽게 드러내기 위해 ‘하나가 되다’로 옮겼고, 단순한 혼합보다 결합의 결과를 강조했습니다.
