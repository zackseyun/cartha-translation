base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/005.yaml
  text: And Michael said to me[a], “Why are you troubled by such a vision? Until today the day of his mercy has lasted[c][b], and he has been merciful and slow to wrath toward those who dwell upon the dry land.”
  footnotes:
  - marker: a
    text: Or, more literally, 'What is this that you have seen and been troubled?' The opening question is syntactically difficult in the Ge'ez.
    reason: lexical_alternative
  - marker: b
    text: '''Dry land'' may be significant in context, contrasting land-dwelling beings with the sea imagery in the surrounding passage.'
    reason: cultural_note
  - marker: c
    text: Or 'Why have you seen this and been troubled?'.
    reason: previous_rendering
translation:
  language: ko
  text: 미카엘이 제게 말했습니다. 「왜 이런 환상 때문에 동요하십니까? 오늘까지 그의 긍휼의 날이 이어져 왔으며, 그분은 마른 땅 위에 사는 자들에게 자비로우시고 진노하기를 더디하셨습니다.[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마른 땅’은 원문의 ዲበ የብስ를 옮긴 것으로, 단순한 ‘땅’보다 육지라는 구체적인 뜻을 지닙니다.
    reason: source_note
lexical_decisions:
- source_word: ምንተ ርእየ ዘከመዝ ተሀውከ
  english_pob_choice: Why are you troubled by such a vision?
  chosen_korean: 왜 이런 환상 때문에 당신이 동요합니까?
  alternatives_korean:
  - 왜 이런 환상 때문에 당신이 괴로워합니까?
  - 왜 이런 환상 때문에 당신이 두려워합니까?
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서 ርእየ는 ‘보다’의 동사가 아니라 ‘환상/보임’에 해당하는 명사구로 읽혀야 하므로, 질문은 ‘무엇을 보았느냐’가 아니라 ‘왜 동요하느냐’로 옮기는 것이 원문 구조를 살립니다.
- source_word: ዕለተ ምሕረቱ
  english_pob_choice: the day of his mercy
  chosen_korean: 그의 긍휼의 날
  alternatives_korean:
  - 그의 자비의 날
  - 긍휼의 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 감정적 자비보다 종말론적 유예 기간이라는 뉘앙스를 살리기 위해 ‘긍휼의 날’로 옮겼습니다.
- source_word: ወሀሎ መሓሪ ወርኁቀ መዓት
  english_pob_choice: and he has been merciful and slow to wrath
  chosen_korean: 그는 자비로우시며 진노하시기를 더디하셨습니다
  alternatives_korean:
  - 그는 자비로우시고 분노에 더디하셨습니다
  - 그는 자비를 베푸시고 진노를 늦추셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 ‘자비로움’과 ‘진노로부터의 멂/더딤’을 함께 살리되, 한국어에서는 ‘진노하시기를 더디하다’가 성경적 문맥에서 자연스럽고 원문의 신학적 긴장을 유지합니다.
- source_word: ላዕለ እለ የኃድሩ ዲበ የብስ
  english_pob_choice: toward those who dwell upon the dry land
  chosen_korean: 마른 땅 위에 사는 자들에게
  alternatives_korean:
  - 땅 위에 사는 자들에게
  - 육지에 거주하는 자들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: የብስ는 일반적인 ‘땅’보다 구체적으로 ‘마른 땅/육지’를 뜻하므로, 주변의 바다-땅 대비를 살려 ‘마른 땅’으로 옮겼습니다.
theological_decisions:
- issue: ‘his mercy’의 소유격이 가리키는 대상
  chosen_reading: 소유격은 문맥상 하나님을 가리키는 것으로 유지했습니다.
  alternative_readings:
  - 소유격을 약화시켜 단순히 ‘긍휼의 날’로만 옮기는 방식
  rationale: 천상 장면 전체가 하나님의 심판과 유예를 전제하므로, 소유격을 살려 하나님의 주권적 긍휼을 드러내는 편이 원문에 충실합니다.
  doctrine_reference: 하나님의 자비와 심판의 긴장을 함께 보존함
