base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/009.yaml
  text: And I asked another angel that he should show me the power of those monsters[a], how they were separated on one day and were cast[d][c][b], one into the depths of the sea and one onto the dry land of the wilderness.
  footnotes:
  - marker: a
    text: The surrounding context identifies these two cosmic creatures more specifically, but this verse itself refers to them only as 'these monsters.'
    reason: cross_reference
  - marker: b
    text: Or 'their might' or possibly 'their nature'; the Ge'ez term centers on power, but in context it may imply the character or force of these beings.
    reason: lexical_alternative
  - marker: c
    text: 'The final phrase is difficult. The Ge''ez appears to contrast the sea with a dry wilderness region: literally something like ''on the dry land, in the desert.'''
    reason: textual_variant
  - marker: d
    text: Or 'these monsters—how they were separated on one day, and one was cast'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 또 다른 천사에게, 저 몬스터들의 능력을 나에게 보여 달라고 청했습니다. 그것들이 어느 날에 나뉘어, 하나는 바다의 깊은 곳으로, 하나는 광야의 마른 땅으로 던져졌는지를 말입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 둘은 더 구체적으로 식별될 수 있지만, 이 절 자체는 단지 ‘저 몬스터들’이라고만 말합니다.
    reason: cross_reference
  - marker: b
    text: 원문의 ኃይል은 ‘능력’, ‘힘’, 또는 문맥상 ‘본성’까지도 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 어렵습니다. 원문은 바다와 대비되는 마른 광야 지역을 가리키는 듯하며, 문자적으로는 ‘마른 땅, 곧 광야에’에 가깝습니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘저 몬스터들—그것들이 어느 날에 나뉘고, 하나는 던져졌다’.
    reason: previous_rendering
