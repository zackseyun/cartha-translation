base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/019.yaml
  text: And the spirit of the mist is not joined with them in their storehouses[a], but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in summer[c][b], and its storehouse is an angel.
  footnotes:
  - marker: a
    text: The final clause is difficult. The Ge'ez reads literally, 'its storehouse is an angel,' which may mean that an angelic being is identified with, or stands as, the sea's appointed repository.
    reason: textual_variant
  - marker: b
    text: The last atmospheric term is uncertain in this OCR witness; it may denote cloud, storm, or a related weather phenomenon.
    reason: lexical_alternative
  - marker: c
    text: Or 'spirit of the sea will not be joined with their storehouses, but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in cloud'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 안개의 영은 그들의 저장소들 안에서 그들과 결합되지 않습니다[a]. 오히려 그 영의 저장소는 따로 있습니다. 그 행로에는 빛과 어둠 가운데서, 또 겨울과 여름 가운데서 영광이 있기 때문입니다[b][c]. 그리고 그 저장소는 한 천사입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그들과’와 ‘그들의 저장소들 안에서’를 함께 두어, 안개의 영이 그들과 그들의 저장소 안에서 결합하지 않음을 말합니다.
    reason: source_note
  - marker: b
    text: ‘그 행로에는 영광이 있다’로 옮긴 짧은 원문 표현은 문법상 난해하며, 직역하면 ‘그 안에 영광이 있다’에 가깝습니다.
    reason: source_note
  - marker: c
    text: 마지막 계절어는 현존 OCR 전사에서 오독되었을 가능성이 있습니다. 겨울과 짝을 이루는 문맥 및 검토된 판독에 따라 ‘여름’으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: መንፈሰ ጊሜ
  english_pob_choice: the spirit of the mist
  chosen_korean: 안개의 영
  alternatives_korean:
  - 안개의 영
  - 안개의 רוח
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጊሜ는 ‘안개/옅은 안개’를 뜻하므로 ‘mist’에 맞춰 ‘안개’로 옮기고, መንፈስ은 이 문맥의 인격화된 우주적 실재를 살려 ‘영’으로 번역했습니다.
- source_word: ኢይትኃበር ምስሌሆሙ ውስተ መዛግብቲሆሙ
  english_pob_choice: is not joined with them in their storehouses
  chosen_korean: 그들의 저장소들 안에서 그들과 합쳐지지 않습니다
  alternatives_korean:
  - 그들과 함께 저장소들 안에 있지 않습니다
  - 그들의 창고들에 그들과 연합되지 않습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 결합·연합을 뜻하므로 ‘합쳐지지 않습니다’로 직역에 가깝게 살렸고, ውስተ와 መዛግብቲሆሙ의 관계를 분명히 드러내기 위해 ‘저장소들 안에서’를 유지했습니다.
- source_word: መዝገበ ቦቱ ባሕቲቱ
  english_pob_choice: its own storehouse is by itself
  chosen_korean: 그 영의 저장소는 따로 있습니다
  alternatives_korean:
  - 그 저장소는 홀로 있습니다
  - 그 저장고는 그것만의 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ባሕቲቱ는 강한 분리·단독성을 나타내므로 ‘따로 있습니다’로 간결하게 옮겨, POB가 지적한 분리 강조를 한국어에서 자연스럽게 반영했습니다.
- source_word: ምሕዋረ ዚአሁ
  english_pob_choice: its course
  chosen_korean: 그 행로는
  alternatives_korean:
  - 그 경로는
  - 그 순환은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 우주적 운동을 가리키는 표현이어서 ‘행로’로 번역해 진행성과 정해진 길의 뉘앙스를 살렸습니다.
- source_word: በብርሃን ... በጽልመት ... በክረምት ... በሐጋይ
  english_pob_choice: both in light and in darkness, and in winter and in summer
  chosen_korean: 빛과 어둠 가운데서, 또 겨울과 여름 가운데서
  alternatives_korean:
  - 밝음과 어둠 속에서, 또 겨울과 여름에
  - 빛 가운데와 어둠 가운데, 또 겨울과 여름 가운데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아직과 선행 검토에서 확인된 ንጋይ의 오독을 따르지 않고, ḥagāy의 의미에 맞춰 ‘여름’으로 옮겼습니다. 반복되는 전치사구는 포괄 범위를 살려 ‘가운데서’로 처리했습니다.
theological_decisions:
- issue: 안개의 영을 자연현상으로 축소할지, 인격화된 우주적 실재로 유지할지
  chosen_reading: 인격화된 우주적 실재로 유지하여 ‘안개의 영’으로 번역했습니다.
  alternative_readings:
  - 안개의 바람
  - 안개의 힘
  rationale: 문맥이 저장소, 천사, 우주 질서에 관한 묘사이므로, 현대적 비신화화보다 본문의 우주론적 상상력을 그대로 드러내는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 본문의 신화적·묵시적 이미지를 평탄화하지 않고 보존합니다.
- issue: 마지막 절의 ‘그 저장소는 한 천사입니다’를 완화해 해석할지
  chosen_reading: 직설적으로 ‘그 저장소는 한 천사입니다’로 두었습니다.
  alternative_readings:
  - 그 저장소는 천사에게 맡겨져 있습니다
  - 한 천사가 그 저장소를 맡고 있습니다
  rationale: 게즈어가 주는 가장 직접적인 문형을 유지해야 본문이 가진 난점을 숨기지 않습니다. 해석적 완화는 문장의 충격과 애매성을 지워 버립니다.
  doctrine_reference: 난해한 본문은 해석을 과잉 삽입하지 말고, 본문이 가진 긴장을 그대로 제시합니다.
