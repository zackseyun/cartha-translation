theological_decisions:
- issue: በመንፈስ의 번역에서 인격적 영과 비인격적 힘 사이의 긴장
  chosen_reading: ‘영으로 말미암아’로 옮겨, 초월적 주재 가능성과 생동하는 힘의 가능성을 모두 남겼습니다.
  alternative_readings:
  - ‘성령으로’
  - ‘바람으로’
  - ‘숨으로’
  rationale: 본문은 천둥과 번개의 조화로운 움직임을 설명하면서도 그 매개를 단정하지 않습니다. 따라서 특정 교리적 해석을 앞세우지 않고, 의미 범위를 보존하는 쪽이 स्रोत에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘하나가 아니지만’의 난해한 대조 유지
  chosen_reading: ‘비록 하나는 아니지만’으로 두 현상의 구별성과 분리 불가를 함께 드러냈습니다.
  alternative_readings:
  - ‘하나가 아니어도’
  - ‘한 존재가 아니지만’
  - ‘서로 하나는 아니지만’
  rationale: 본문은 동일성을 부정하면서도 결합을 말하므로, 그 긴장을 완화하지 않고 그대로 보존해야 합니다.
  doctrine_reference: Do not erase a documented lexical/theological tension.
