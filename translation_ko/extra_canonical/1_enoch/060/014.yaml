base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/014.yaml
  text: For resting places have been given to the thunder with patience for the sound of its voice[a]; and the thunder and the lightning are not separated, and though they are not one[d][c][b], by the Spirit the two of them go together and are not separated.
  footnotes:
  - marker: a
    text: Or 'with forbearance' or 'in patience.' The phrase is difficult in context and may describe the ordered restraint of thunder's sound.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez term rendered 'Spirit' can also mean 'spirit,' 'breath,' or 'wind.' The line may speak of divine agency or of an animating force that causes thunder and lightning to move together.
    reason: lexical_alternative
  - marker: c
    text: The clause rendered 'though not one' is textually difficult in this OCR witness. The sense appears to be that thunder and lightning remain distinct, yet they move together and are not separated.
    reason: textual_variant
  - marker: d
    text: Or 'For for the thunder there has been given a resting-place'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 천둥에는 그 음성의 소리를 위하여 인내 가운데 쉴 곳들이 주어졌기 때문입니다[a][d]. 천둥과 번개는 분리되지 않으며, 비록 하나는 아니지만[c], 영으로 말미암아[b] 그 둘은 함께 나아가며 분리되지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인내 가운데’(또는 ‘인내와 함께’)에 해당하는 구문은 문맥상 난해합니다. ‘오래 참음으로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: Ge'ez ‘መንፈስ’은 ‘영’ 외에 ‘숨’이나 ‘바람’도 뜻할 수 있습니다. 여기서는 천둥과 번개의 움직임을 함께 이끄는 영적 또는 비인격적 작용을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘비록 하나는 아니지만’에 해당하는 절은 이 전승에서 문장이 난해합니다. 천둥과 번개는 구별되지만 함께 움직이고 분리되지 않는다는 뜻으로 보입니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘천둥에게는 쉴 곳들이 주어졌습니다’로 옮길 수 있습니다.
    reason: previous_rendering
