base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/006.yaml
  text: And when the day and the power and the punishment and the judgment come, which the Lord of Spirits has prepared for those who do not bow down to the righteous law, and for those who deny the righteous judgment, and for those who take his name in vain—that day has been prepared for the chosen as a covenant, and for sinners as an inquiry.
translation:
  language: ko
  text: 그리고 그 날과 권세와 징벌과 심판이 올 때, 영들의 주님께서 의로운 율법에 절하지 않는 자들과, 의로운 심판을 부정하는 자들과, 그의 이름을 헛되이 취하는 자들을 위하여 예비하신 날입니다. 그 날은 택하신 이들에게는 언약으로, 죄인들에게는 조사로 예비되었습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘권세’는 ኃይል의 폭넓은 힘/권능 범위를 한국어에서 가장 자연스럽게 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조사’는 영어 POB의 inquiry를 따른 번역으로, 종말론적 판결보다 확인·심사에 더 가까운 중립적 의미를 유지합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዕለት፡ ወኃይል፡ ወመቅሠፍት፡ ወኵነኔ
  english_pob_choice: the day and the power and the punishment and the judgment
  chosen_korean: 그 날과 권세와 징벌과 심판
  alternatives_korean:
  - 그 날과 힘과 형벌과 판단
  - 그 날과 능력과 징벌과 재판
  lexicon: ዕለት / ኃይል / መቅሠፍት / ኵነኔ
  rationale: 영어 POB의 병렬 구조를 따라 네 항목을 각각 살리되, ኃይል은 단순한 물리적 힘보다 종말론적 권세의 뉘앙스가 있어 권세로 옮겼습니다.
- source_word: እግዚአ፡ መንፈሳት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 영들의 주님
  alternatives_korean:
  - 영들의 주
  - 영들의 주님
  lexicon: እግዚአ፡ መንፈሳት
  rationale: 직역에 가깝게 ‘영들’의 소유 구조를 유지하되, 한국어 문체에서는 존칭 주님이 자연스럽고 본문의 호칭 기능도 보존합니다.
- source_word: ለእለ፡ ኢይሰግዱ፡ ለእግዚ፡ ጽድቅ
  english_pob_choice: for those who do not bow down to the righteous law
  chosen_korean: 의로운 율법에 절하지 않는 자들
  alternatives_korean:
  - 의로운 율법에 경배하지 않는 자들
  - 의로운 법에 절하지 않는 자들
  lexicon: ኢይሰግዱ / እግዚ፡ ጽድቅ
  rationale: ‘bow down’의 예배적·복종적 함의를 살리기 위해 절하다를 택했고, ጽድቅ은 여기서 인격적 ‘주님’이 아니라 ‘의로운 율법/심판’의 성격을 드러내므로 율법으로 옮겼습니다.
- source_word: ወለእለ፡ ይነሥኡ፡ ስሞ፡ በከ፡
  english_pob_choice: for those who take his name in vain
  chosen_korean: 그의 이름을 헛되이 취하는 자들
  alternatives_korean:
  - 그의 이름을 헛되이 부르는 자들
  - 그의 이름을 헛되이 취하는 자들
  lexicon: ይነሥኡ / ስም
  rationale: 직역을 우선해 ‘취하다’를 유지하여 이름을 함부로 사용한다는 폭넓은 책임을 보존했고, 영어 POB의 ‘take his name in vain’도 이 의미장을 반영합니다.
- source_word: ለሕሩያን መሐላ ወለኃጥኣን ሐተታ
  english_pob_choice: for the chosen as a covenant, and for sinners as an inquiry
  chosen_korean: 택하신 이들에게는 언약으로, 죄인들에게는 조사로
  alternatives_korean:
  - 선택된 이들에게는 언약으로, 죄인들에게는 심문으로
  - 택하신 이들에게는 언약으로, 죄인들에게는 문의로
  lexicon: መሐላ / ሐተታ
  rationale: መሐላ는 단순한 맹세보다 관계를 세우는 언약의 기능이 강해 언약으로, ሐተታ는 영어 POB의 ‘inquiry’를 따라 종말론적 심문/조사보다 중립적인 조사로 옮겼습니다.
theological_decisions:
