  - 영들의 주님
  rationale: 본문은 하나님을 직접 호칭하는 서술적 칭호이므로 주님을 유지해 경외를 살리되, 원문의 복수 ‘영들’ 구조를 보존했습니다.
  doctrine_reference: 창조주 하나님의 주권과 영적 존재들에 대한 통치
