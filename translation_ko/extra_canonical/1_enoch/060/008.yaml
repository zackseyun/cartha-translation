  rationale: 고유한 신칭 '영들의 주'를 그대로 살리고, 창조 행위는 '지으신'으로 옮겨 원문의 직접성을 유지했습니다.
theological_decisions:
- issue: 문장의 주어 관계와 시점
  chosen_reading: 이 절은 베헤못의 거처를 설명하는 현시적 서술로 읽고, 에녹의 자전적 위치 언급은 그 거처와 연결된 보조 절로 처리했습니다.
  alternative_readings:
  - 문장 전체를 에녹의 과거 회상으로 평면화하는 읽기
  - '''그곳''의 지시를 약화해 단순 장소 설명으로만 보는 읽기'
  rationale: 원문은 장소 묘사와 계보적 자기지시를 함께 묶어 시현의 권위를 세우므로, 한국어에서도 그 층위를 분리하지 않고 유지했습니다.
  doctrine_reference: 본문의 시현적·묵시적 긴장을 보존하고 평탄화하지 않습니다.
