  - 숨겨진 광야
  - 볼 수 없는 광야
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 부정형 표현을 따라 '보이지 않는'을 살리고, 장소 성격은 '광야'로 옮겨 시현적·지리적 긴장을 보존했습니다.
