  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥은 기상 현상을 단순 묘사하기보다 그것에 대응하는 초월적 주체를 병렬로 열거하므로, 한국어에서는 ‘영’으로 옮겨 personification을 살렸습니다.
- source_word: አስሐትያ
  english_pob_choice: hoarfrost
  chosen_korean: 서리
  alternatives_korean:
  - 상고대
  - 서릿발
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아어의 뜻은 ‘hoarfrost’이므로 고유명사로 처리하지 않고, 자연스러운 현대 한국어의 ‘서리’로 옮겼습니다.
- source_word: መልአክ
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 우주적 기상 질서에 배정된 존재를 가리키므로 일반적 기별자보다 ‘천사’가 문맥에 맞고, 본문의 초월적 위계를 분명히 드러냅니다.
- source_word: ኄር
  english_pob_choice: good
  chosen_korean: 좋은
  alternatives_korean:
  - 선한
  - 착한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아어 형용사 ኄር는 ‘good’의 의미이므로, 도덕적 뉘앙스를 과도하게 좁히지 않는 ‘좋은’을 택했습니다.
