base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/002.yaml
  text: And the Head of Days was sitting on the throne of his glory[a], and the angels and the righteous were standing around him.
  footnotes:
  - marker: a
    text: Or 'the Ancient of Days.' The Ge'ez title is rendered more literally here as 'the Head of Days' to preserve the wording of this passage without importing the familiar phrasing from Daniel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 **머리**는 영광의 보좌에 앉아 계셨고, 천사들과 의인들은 그분 주위에 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리’는 Ge'ez의 ርእሰ መዋዕል을 가능한 한 직역한 표현입니다. 다니엘서의 익숙한 ‘옛적부터 계신 이’와는 다른 Enoch 고유의 칭호를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሰ መዋዕል
  english_pob_choice: the Head of Days
  chosen_korean: 머리
  alternatives_korean:
  - 날들의 머리
  - 옛날의 옛적부터 계신 이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 독특한 칭호를 그대로 살리기 위해 ‘Head of Days’의 직역 구조를 유지했습니다. 다니엘서의 익숙한 표현으로 미리 환원하지 않도록 ‘머리’로 옮겼습니다.
- source_word: መንበረ ስብሐቲሁ
  english_pob_choice: the throne of his glory
  chosen_korean: 영광의 보좌
  alternatives_korean:
  - 그분의 영광의 보좌
  - 영광스러운 보좌
  - 그분의 영광스러운 자리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘보좌’는 왕적·심판적 자리의 구체성을 살리고, ‘그의 영광’은 속격 관계를 자연스러운 한국어로 압축해 옮겼습니다.
- source_word: ይነብር
  english_pob_choice: was sitting
  chosen_korean: 앉아 계셨고
  alternatives_korean:
  - 앉아 계셨습니다
  - 앉아 계셨으며
  - 앉아 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 서술의 지속성을 살리기 위해 진행적 뉘앙스를 유지했고, 존칭 ‘계셨’으로 보좌에 앉아 계신 위엄을 반영했습니다.
- source_word: መላእክት
  english_pob_choice: the angels
  chosen_korean: 천사들
  alternatives_korean:
  - 천사들
  - 사자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 법정의 문맥에서는 ‘천사들’이 가장 분명하며, ‘사자들’은 오해 소지가 있어 배제했습니다.
- source_word: ጻድቃን
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의인들
  - 의로운 자들
  - 의로운 이들
  lexicon: Dillmann, Lexicon Aethiopicae
  rationale: 에녹 전승에서 집단 명칭으로 쓰이는 ‘righteous’를 한국어 성경어휘에 맞게 ‘의인들’로 옮겼습니다.
- source_word: አውዶ ይቆውሙ
  english_pob_choice: were standing around him
  chosen_korean: 그분 주위에 서 있었습니다
  alternatives_korean:
  - 그분 둘레에 서 있었습니다
  - 그분을 둘러 서 있었습니다
  - 그분 주위에 둘러서 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘around him’의 주변 배치를 명시하면서도 한국어로 자연스러운 ‘그분 주위에 서 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘Head of Days’의 한국어 처리에서 다니엘서 전통어를 바로 채택할지 여부
  chosen_reading: ‘머리’라는 직역 구조를 유지해 에녹서의 고유한 칭호로 읽히게 했습니다.
  alternative_readings:
  - ‘옛날의 옛적부터 계신 이’
  - ‘옛적부터 계신 분’
  rationale: 본문의 지시 대상이 다니엘서와 연결되더라도, 이 구절 자체는 에녹서의 어휘를 보존하는 것이 우선이므로 익숙한 전통어로 평탄화하지 않았습니다.
  doctrine_reference: 번역 원칙 §1, §3; 과도한 조화 번역 방지
- issue: 천상 법정 장면에서의 존칭 및 서술 시제
  chosen_reading: 보좌에 ‘앉아 계셨고’로 존칭과 진행성을 함께 살렸습니다.
  alternative_readings:
  - ‘앉아 있었습니다’
  - ‘앉아 계셨습니다’
  rationale: 환상 속 위엄 있는 좌정 장면을 한국어 합쇼체로 자연스럽게 표현하면서도, 지속적으로 그 자리에 머무는 장면성을 보존했습니다.
  doctrine_reference: 한국어 표준 문체 가이드; 서술형 환상 장면 처리
