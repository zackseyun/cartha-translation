    rationale: 이 절의 Ge'ez 전승은 통사적으로 어려우며, መንፈስ는 ‘영’과 ‘바람’ 모두를 뜻할 수 있습니다. 이 불확실성을 본문에서 한쪽으로 해소하지 않고 각주로 밝혀야 합니다.
