    issue: ‘있습니다’가 열거를 독립 진술로 만들고 마지막 ‘분배될 것입니다’와 통사적으로 충돌합니다.
    rationale: 원문 및 영어 감사본은 열거를 계속한 뒤 ‘모든 구분은 분배될 것이다’라는 종결 진술을 둡니다. 한국어에서도 ‘…이니’로 열거를 최종 진술에 연결하는 편이 의미를 추가하지 않으면서 구조를 보존합니다.
