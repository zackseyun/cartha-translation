base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/012.yaml
  text: And the treasuries of the spirits[a], and how the spirits are divided, and how they are weighed out, and the portals of the spirits are reckoned, each according to the power of the spirit, and their powers for the light of the moon, and according to the power of righteousness[c][b], and the divisions of the stars by their names—every division shall be apportioned.
  footnotes:
  - marker: a
    text: Several clauses in this verse are textually and syntactically difficult in the Ge'ez-only witness of the Parables. Terms rendered 'weighed out,' 'reckoned,' and 'chambers' may also be understood more generally as measured, counted, or compartments/storehouses.
    reason: textual_variant
  - marker: b
    text: '''Spirits'' may also be read as ''winds''; the Ge''ez term can carry both senses, and the verse may intentionally blur cosmic powers and atmospheric forces.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and of the clouds shall be divided, and the spirits and the clouds shall be weighed out and reckoned; and the chambers of the spirits, by the power of the spirit'.
    reason: previous_rendering
translation:
  language: ko
  text: 또한 영들의 저장고[a]와 영들이 어떻게 나뉘는지, 어떻게 달아 배정되는지, 영들의 문들이 각기 영의 능력[b]에 따라 어떻게 헤아려지는지, 달빛을 위한 그들의 능력과 의의 능력[c]에 따른 것과 이름에 따른 별들의 구분이니, 모든 구분은 분배될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 게에즈어로만 전해지는 「비유들」 부분에서 특히 통사적으로 어렵습니다. ‘달아 배정되는지’, ‘헤아려지는지’, ‘문들’로 옮긴 말들은 각각 더 넓게 ‘측량되는지’, ‘계산·계수되는지’, ‘관문들’로도 이해될 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘영’은 ‘바람’ 또는 ‘숨’으로도 읽을 수 있습니다. 이 표현은 우주적 존재와 대기 현상을 의도적으로 겹쳐 보이게 할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 연결은 불확실합니다. 이전 번역 전통에는 이 구절을 ‘구름이 나뉘고 영들과 구름이 달아 헤아려지며, 영들의 방들이 영의 능력에 따라…’라는 방향으로 이해한 경우도 있으나, 현재 게에즈어 재검토는 አፎ를 ‘어떻게’로, አናቅፅ를 ‘문들/관문들’로 읽습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: መዛግብተ
  english_pob_choice: treasuries
  chosen_korean: 창고
  alternatives_korean:
  - 보물고
  - 저장고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 천상의 저장된 구획을 가리키므로, 과도하게 화려한 '보물고'보다 기능을 살린 '창고'가 원문의 보관·축적 이미지를 더 직접적으로 옮깁니다.
- source_word: መንፈሳት
  english_pob_choice: spirits
  chosen_korean: 영
  alternatives_korean:
  - 바람
  - 숨
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절은 우주적 존재와 질서를 말하므로, 기상학적 '바람'으로 좁히지 않고 POB의 선택을 따라 '영'으로 두어 의미의 긴장을 보존합니다.
- source_word: አናቅፅ
  english_pob_choice: portals
  chosen_korean: 문들
  alternatives_korean:
  - 관문들
  - 게이트들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 어휘는 Enoch적 우주론에서 ‘문/문지방’의 이미지가 자연스러워, 한국어에서는 비유적이면서도 이해 가능한 '문들'로 옮겼습니다.
- source_word: በበኀይለ መንፈስ
  english_pob_choice: each according to the power of the spirit
  chosen_korean: 각기 영의 능력에 따라
  alternatives_korean:
  - 영의 힘에 따라 각각
  - 영의 권능에 따라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 포함된 분배적 뉘앙스(각기)를 살리면서, 'power'는 신학적 과장을 덜한 '능력'으로 두어 원문의 질서 부여 의미를 유지했습니다.
- source_word: ኀይለ ጽድቅ
  english_pob_choice: the power of righteousness
  chosen_korean: 의의 능력
  alternatives_korean:
  - 의의 힘
  - 의의 권능
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 'power of righteousness'를 따라 ጽድቅ을 '의'로, ኀይል을 '능력'으로 옮겨 우주 질서를 세우는 도덕적·신학적 힘을 보존했습니다.
- source_word: ክፍላተ ከዋክብት
  english_pob_choice: the divisions of the stars
  chosen_korean: 별들의 분류
  alternatives_korean:
  - 별들의 구분
  - 별들의 나뉨
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 별들이 이름별로 질서 있게 나뉜다는 뜻을 살려, 자연스러운 현대 한국어로는 '분류'가 가장 명료합니다.
theological_decisions:
- issue: መንፈሳት을 '영들'로 유지할지, '바람들'로 좁힐지
  chosen_reading: 영들
  alternative_readings:
  - 바람들
  - 숨들
  rationale: 문맥이 천상 질서와 분배를 말하므로, 기상 현상으로 환원하지 않고 원문의 양의성을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it.
- issue: በበ의 분배적 의미를 문장에 드러낼지
  chosen_reading: 각기 ...에 따라
  alternative_readings:
  - '...에 따라'
  - 각 ...에 따라
  rationale: POB의 'each according to'가 놓친 분배성을 한국어에서는 '각기'로 살려, 모든 항목이 동일한 방식으로가 아니라 각자 배정됨을 드러냈습니다.
  doctrine_reference: 'Audited revision: distributive force of በበ'
