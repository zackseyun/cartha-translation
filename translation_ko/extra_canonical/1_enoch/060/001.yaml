base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/001.yaml
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Henok, in that parable I saw that the heaven of heavens was shaken with a great shaking, and the host of the Most High, and the angels, thousands of thousands and ten thousand times ten thousand, were stirred in a great turmoil.
  footnotes:
  - marker: a
    text: Or 'the highest heaven.' The Ge'ez literally reads 'the heaven of heavens,' a superlative expression for the loftiest heavenly realm.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'the host of the Most High' could also be understood more abstractly as 'the power of the Most High,' but the immediate reference to angels in immense numbers favors a collective heavenly-host sense.
    reason: lexical_alternative
  - marker: c
    text: Or 'was shaken violently'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 해는 오백년째였고, 일곱째 달, 곧 그 달의 열나흗날이었습니다. 에녹의 생애 동안, 나는 그 비유 가운데서 하늘들의 하늘이 큰 흔들림으로 흔들리고, 지극히 높으신 이의 군대와 천사들 곧 수천의 수천과 만만의 만이 큰 소란 속에 뒤흔들리는 것을 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓመት ፭ምእት
  english_pob_choice: in the five-hundredth year
  chosen_korean: 그 해는 오백년째였고
  alternatives_korean:
  - 오백년째 해에
  - 오백 번째 해에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 연대 표지를 자연스러운 현대 한국어로 옮기되, 순서를 나타내는 ‘오백년째’로 시점을 유지했습니다.
- source_word: በወርኅ ሳብዕ / አመ ዐሡሩ ወረቡዑ ለወርኅ
  english_pob_choice: in the seventh month / on the fourteenth day of the month
  chosen_korean: 일곱째 달, 곧 그 달의 열나흗날
  alternatives_korean:
  - 일곱째 달에, 곧 그 달의 열넷째 날
  - 일곱째 달의 열나흗날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 시간 표현을 함께 살려 달과 날짜를 분명히 했고, ‘열나흗날’이 문맥상 가장 자연스럽습니다.
- source_word: በሕይወተ ሄኖክ
  english_pob_choice: in the life of Henok
  chosen_korean: 에녹의 생애 동안
  alternatives_korean:
  - 에녹의 생애에
  - 에녹의 생애 가운데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 ‘생명/생애’를 직역하기보다, 비전 서두의 장중한 시간 표지로 기능하는 점을 살려 ‘생애 동안’으로 옮겼습니다.
- source_word: በውእቱ አምሳል
  english_pob_choice: in that parable
  chosen_korean: 그 비유 가운데서
  alternatives_korean:
  - 그 비유 안에서
  - 그 비유에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문이 해당 단락을 가리키는 기술적 표현이므로, 한국어에서도 장을 소개하는 문맥으로 자연스럽게 유지했습니다.
- source_word: ሰማየ ሰማያት
  english_pob_choice: the heaven of heavens
  chosen_korean: 하늘들의 하늘
  alternatives_korean:
  - 하늘의 하늘
  - 가장 높은 하늘
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 장엄성을 살리면서도 한국어의 병렬 구조에 맞게 복수형 느낌을 반영했습니다.
- source_word: ታድለቀልቅ ... ይልቅልቅ ዐቢይ
  english_pob_choice: was shaken with a great shaking
  chosen_korean: 큰 흔들림으로 흔들리고
  alternatives_korean:
  - 크게 흔들리고
  - 심한 흔들림으로 흔들리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 동족목적어(cognate accusative)와 ‘great’의 강조를 살려 ‘큰 흔들림으로 흔들리다’로 옮겼습니다.
- source_word: ኀይሉ ልዑል
  english_pob_choice: the host of the Most High
  chosen_korean: 지극히 높으신 이의 군대
  alternatives_korean:
  - 지극히 높으신 이의 군사들
  - 지극히 높으신 이의 하늘 군대
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 추상적 ‘권능’보다 천사 무리라는 집합적 의미가 강하므로 ‘군대’로 옮기되, ልዑል은 하나님의 칭호로 풀어 썼습니다.
- source_word: መላእክት አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  english_pob_choice: the angels, thousands of thousands and ten thousand times ten thousand
  chosen_korean: 천사들 곧 수천의 수천과 만만의 만
  alternatives_korean:
  - 천사들 곧 수천 곱하기 수천과 만 곱하기 만
  - 천사들 곧 수천수천과 만만
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 과장적 수사와 반복을 유지하되, 현대 한국어에서 읽히는 자연스러운 수량 표현으로 옮겼습니다.
- source_word: ትሀውኩ ሁከተ ዐቢየ
  english_pob_choice: were stirred in a great turmoil
  chosen_korean: 큰 소란 속에 뒤흔들리는 것을
  alternatives_korean:
  - 큰 혼란 속에 흔들리는 것을
  - 큰 소란 가운데 뒤엉키는 것을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사와 명사의 반복된 혼란 이미지를 살리면서, 천사 무리의 집단적 동요를 한국어로 선명하게 전달했습니다.
theological_decisions:
- issue: How to render ሰማየ ሰማያት without flattening its apocalyptic elevation
  chosen_reading: 하늘들의 하늘
  alternative_readings:
  - 가장 높은 하늘
  - 하늘의 하늘
  rationale: 직역성이 높은 표현을 유지해, 본문의 초월적 우주론과 장중한 비전 분위기를 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 묵시적 공간 표현의 신학적 긴장 보존
- issue: Whether ኀይሉ ልዑል is abstract power or a heavenly host
  chosen_reading: 지극히 높으신 이의 군대
  alternative_readings:
  - 지극히 높으신 이의 권능
  - 지극히 높으신 이의 군사들
  rationale: 뒤이어 천사들의 무수한 숫자가 나오므로, 추상명사보다 천상 군대의 집합적 의미가 문맥에 더 잘 맞습니다.
  doctrine_reference: 문맥 우선 해석; 천사 무리의 집합적 표상 유지
