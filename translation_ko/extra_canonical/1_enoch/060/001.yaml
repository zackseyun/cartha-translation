  terminology: ‘에녹’, ‘지극히 높으신 이’, ‘천사들’, ‘만만의 만’은 적절합니다. ኀይሉ ልዑል은 문맥상 ‘지극히 높으신 이의 군대’로 유지할 수 있으나, 천사들과 별도로 열거되는 원문의 구조를 보존해야 합니다.
  issues:
