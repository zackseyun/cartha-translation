base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/001.yaml
  text: And I saw until the time when thirty-seven shepherds were pasturing in this way[a], and they all completed their periods, each in its time, like the former ones; and others received them into their hands, to pasture them in their times[c][b], each shepherd in its time.
  footnotes:
  - marker: a
    text: The Ge'ez text is somewhat compressed in the handover clause; the sense is that one set of shepherds finishes its allotted period and another set receives charge in succession.
    reason: textual_variant
  - marker: b
    text: The repeated language of 'time' underscores fixed, allotted periods of oversight rather than indefinite activity.
    reason: cultural_note
  - marker: c
    text: Or 'until that time that thirty-seven shepherds were pasturing'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 서른일곱 목자들이 이렇게 목양하는 때까지 보았습니다[a]. 그들은 모두 앞선 이들과 마찬가지로 각자에게 정해진 때를 마쳤습니다. 그러자 다른 이들이 그들을 자기들의 손에 받아, 각자의 때에 그들을 목양하였습니다[b][c]. 각 목자가 저마다 자기의 때에 그렇게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서른일곱 목자들이 이렇게 목양하던 때까지’로 옮길 수 있습니다. ‘이렇게’는 앞서 제시된 목양의 방식을 가리킵니다.
    reason: previous_rendering
  - marker: b
    text: 게에즈 본문은 인수와 목양의 연결을 압축하여 표현합니다. 한 무리가 할당된 때를 마치면 다른 이들이 차례로 맡는다는 뜻으로 이해할 수 있습니다.
    reason: textual_variant
  - marker: c
    text: 반복되는 ‘때’는 목자들의 감독이 무기한이 아니라 각자에게 정해진 몫과 기간에 따라 이루어짐을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  english_pob_choice: And I saw
  chosen_korean: 그때 나는 보았습니다
  alternatives_korean:
  - 나는 보았습니다
  - 그리고 나는 보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 보고의 시작을 자연스럽게 살리면서도, 에녹서의 장면 전환을 보이기 위해 ‘그때’로 문맥 연결을 더했습니다.
- source_word: ይርዕዩ
  english_pob_choice: were pasturing
  chosen_korean: 목양하는
  alternatives_korean:
  - 풀을 뜯게 하는
  - 양을 치는
  - 기르던
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동물 알레고리의 ‘목자’ 이미지를 유지하기 위해 ‘목양하다’를 택했고, 본문이 단순한 ‘먹이다’보다 감독·양육의 행동을 함께 암시하도록 했습니다.
- source_word: ፈጸሙ ኵሎሙ በበጊዜሆሙ
  english_pob_choice: they all completed their periods, each in its time
  chosen_korean: 그들 모두가 자기에게 정해진 기간을 각각 자기의 때에 마치고
  alternatives_korean:
  - 그들 모두가 각자의 때에 기간을 마치고
  - 그들 모두가 자기 때를 다하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘기간’으로 정해진 통치/감독의 몫을 분명히 하고, 반복되는 ‘때’를 살려 할당된 시한의 의미를 보존했습니다.
- source_word: በዐዳን ተመጠውዎሙ ውስተ እደዊሆሙ
  english_pob_choice: others received them into their hands
  chosen_korean: 다른 이들이 그들을 자기들의 손에 받아들여
  alternatives_korean:
  - 다른 이들이 그들을 넘겨받아
  - 다른 이들이 그들을 맡아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘손에’라는 관용구를 살려 권한 이양의 이미지를 드러내고, 단순한 ‘맡다’로 완화하지 않았습니다.
- source_word: ከመ ይርዐይዎሙ በበጊዜሆሙ
  english_pob_choice: to pasture them in their times
  chosen_korean: 자기들의 때에 그들을 먹이게 하였습니다
  alternatives_korean:
  - 자기들의 때에 그들을 목양하게 하였습니다
  - 그 정해진 때에 그들을 돌보게 하였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 한국어에서는 ‘목양하다’보다 ‘먹이다’가 성립 가능한 동사이므로, 양 떼를 돌보는 구체적 행위를 드러내면서도 알레고리적 ‘목자’ 맥락을 유지했습니다.
theological_decisions:
- issue: ‘목자들’의 상징성
  chosen_reading: 본문의 알레고리 이미지를 해석하지 않고 ‘목자들’로 그대로 유지했습니다.
  alternative_readings:
  - 천사들
  - 통치자들
  - 감독들
  rationale: 이 절은 상징적 감독자들을 가리키지만, 본문 자체는 해석어보다 이미지 자체를 제시하므로 주석적 확정을 본문에 넣지 않았습니다.
  doctrine_reference: 본문의 상징성과 해석 가능성을 유지합니다.
- issue: 반복되는 ‘때’의 강조
  chosen_reading: ‘자기에게 정해진 기간’, ‘자기의 때’, ‘자기들의 때’로 분산해 반복을 살렸습니다.
  alternative_readings:
  - 일괄적으로 ‘때’만 사용
  - ‘기간’ 없이 ‘때’로만 번역
  rationale: 본문의 핵심은 임의적 활동이 아니라 정해진 몫과 순차적 교대이므로, 시간 표현의 반복을 보존해야 합니다.
  doctrine_reference: 정해진 배정과 순서를 강조하는 본문의 구조를 보존합니다.
