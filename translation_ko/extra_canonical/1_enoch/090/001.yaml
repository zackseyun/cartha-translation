- from: 그때 나는 보았습니다. 삼십칠 명의 목자들이 이렇게 목양하는 때까지[a], 그들 모두가 자기에게 정해진 기간을 각각 자기의 때에 마치고, 이전의 이들과 같이 하였으며, 다른 이들이 그들을 자기들의 손에 받아들여, 자기들의 때에 그들을 먹이게 하였습니다[b][c]—곧 각 목자가 자기의 때에 그러하였습니다.
