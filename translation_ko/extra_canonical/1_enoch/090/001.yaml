  rationale: 사역 동사를 제거하여 목적절의 의미를 회복하고, 환상 보고의 시간 구문을 자연스러운 한국어 문장으로 연결했습니다. ‘이렇게’, ‘목자’, ‘손에 받아’, 그리고 각자에게 배정된 때의 반복은 유지했습니다. 원문의 압축된 대명사 관계는 해석적으로 특정하지 않았습니다.
