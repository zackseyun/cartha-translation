base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/031.yaml
  text: And after that[a], those three clothed in white who had taken me by the hand, who had brought me up before, and the hand of that ram holding me[c][b], brought me up and set me down in the midst of those sheep before the judgment took place.
  footnotes:
  - marker: a
    text: The clause 'those who had gone up before brought me up' is textually difficult in the OCR witness; the translation follows the apparent sense of guided ascent.
    reason: textual_variant
  - marker: b
    text: '''Those sheep'' continues the Animal Apocalypse''s symbolic imagery, where human groups are represented as animals; the translation preserves the image rather than explaining it in the main text.'
    reason: cultural_note
  - marker: c
    text: Or 'And from among them I saw three who were clothed in white, and they took me by my hand—those who had gone up before brought me up—and the hand of that one held me while he brought me up and set me down'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 후에[a], 흰옷을 입고 전에 내 손을 붙잡아 나를 데리고 올라갔던[c] 그 셋과, 나를 붙들고 있던 그 숫양의 손이 나를 데리고 올라가 심판이 있기 전에 그 양들[b] 가운데에 내려놓았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 시간적 연결을 나타내며, ‘그 후에’라는 뜻입니다.
    reason: source_note
  - marker: b
    text: ‘양들’은 「동물 묵시」에서 인간 집단을 나타내는 상징 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘전에 … 나를 데리고 올라갔던’에 해당하는 구절은 게에즈 전승에서 대괄호로 제시되어 있으며 문장 연결이 어렵습니다. 여기서는 앞서 화자를 인도하여 올라갔던 이들이라는 뜻으로 옮겼습니다.
    reason: textual_variant
