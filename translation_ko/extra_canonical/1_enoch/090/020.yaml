base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/020.yaml
  text: And I saw until a throne was set up in the pleasant land[a], and the Lord of the sheep sat upon it[b]; and he took all the sealed books and opened those books before the Lord of the sheep.
  footnotes:
  - marker: a
    text: The Ethiopic word rendered 'pleasant land' is uncertain in this witness; it may denote a specially favored land rather than the earth in general.
    reason: lexical_alternative
  - marker: b
    text: The verse repeats 'the Lord of the sheep' both as the one seated on the throne and as the one before whom the books are opened. The translation keeps this repetition rather than smoothing it away.
    reason: textual_variant
translation:
  language: ko
  text: 나는 보좌가 아름다운 땅에 세워지는 것과, 양들의 주께서 그 위에 앉으시는 것을 보았습니다[a][b]. 또 그가 인봉된 모든 책들을 가져다가, 양들의 주 앞에서 그 책들을 펼치셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 어휘는 여기서 뜻이 분명하지 않으며, 단순한 ‘땅’보다 특별히 호의적이거나 선택된 땅을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절은 ‘양들의 주’라는 칭호를 보좌에 앉는 분과 책들 앞에서 책을 펼치는 분에게 반복해서 사용합니다. 번역은 이 반복을 매끄럽게 없애지 않았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: መንበር
  english_pob_choice: throne
  chosen_korean: 보좌
  alternatives_korean:
  - 왕좌
  - 자리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 심판 장면에서 መንበሀ/መንበር는 단순한 ‘자리’보다 권위 있는 재판·통치의 좌석을 가리키므로, 한국어도 ‘보좌’로 옮기는 것이 가장 자연스럽습니다.
- source_word: ተሐንጸ፡
  english_pob_choice: was set up
  chosen_korean: 세워지는
  alternatives_korean:
  - 설치되는
  - 세워진
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형은 보좌가 비전 속에서 마련·설치되는 과정을 나타내므로, 현재적 비전 서술에 맞는 ‘세워지는’이 원문과 가장 가깝습니다.
- source_word: ሐዋዝ
  english_pob_choice: the pleasant land
  chosen_korean: 아름다운 땅
  alternatives_korean:
  - 기쁜 땅
  - 선택된 땅
  - 기쁨의 땅
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 어휘는 전승상 뜻이 불확실하지만, 영어 POB가 지적하듯 일반적 ‘땅’보다 특별히 호의적이고 좋은 땅을 가리킬 가능성이 있어, 의미를 과도하게 좁히지 않는 ‘아름다운 땅’으로 옮겼습니다.
- source_word: እግዚአ፡ አባግዕ፡
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주
  alternatives_korean:
  - 양들의 주인
  - 양들의 주님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Animal Apocalypse의 반복 칭호를 일관되게 살리기 위해, 주권을 드러내는 ‘주’를 유지하고 ‘양들의’라는 소유 구조도 그대로 보존했습니다.
- source_word: መጻሕፍተ፡ ኅትማተ፡
  english_pob_choice: the sealed books
  chosen_korean: 인봉된 모든 책들
  alternatives_korean:
  - 봉인된 책들
  - 봉인된 두루마리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수형과 ‘인봉됨’이라는 상태를 드러내기 위해 ‘인봉된’으로 옮겼고, 모든 책들을 수집하는 뉘앙스를 살리기 위해 ‘모든’을 유지했습니다.
theological_decisions:
- issue: 양들의 주가 보좌에 앉는 분과 책들 앞에 있는 분으로 반복되는가
  chosen_reading: 원문의 반복을 그대로 살려, 같은 칭호가 보좌에 앉는 분과 책들이 그 앞에서 펼쳐지는 분을 모두 가리키도록 번역했습니다.
  alternative_readings:
  - 자연스럽게 정리하여 다른 천상 존재를 보좌의 주체로 두는 읽기
  - 두 번째 ‘양들의 주’를 다른 칭호로 바꾸어 매끄럽게 만드는 읽기
  rationale: 이 구절은 전승된 형태 자체에 약간의 긴장이 있으므로, 번역이 임의로 조화하지 않고 원문 반복을 보존하는 편이 독자가 본문의 신학적 긴장을 보도록 돕습니다.
  doctrine_reference: 원문 우선과 텍스트 보존 원칙
