base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/019.yaml
  text: And I saw until a great sword was given to the sheep[a], and the sheep went out against all the beasts of the field to kill them; and all the beasts and the birds of heaven fled from before their face.
  footnotes:
  - marker: a
    text: The phrase 'from before their face' reflects a Semitic-style idiom for fleeing in someone's presence; English readers may understand simply 'fled before them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니, 큰 칼이 양들에게 주어질 때까지였고, 양들은 나가서 들의 모든 짐승들을 쳐서 죽이려 하였으며, 모든 짐승과 하늘의 새들은 그들의 얼굴 앞에서 달아났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 얼굴 앞에서’는 셈어식 관용구를 반영한 표현으로, 한국어에서는 단순히 ‘그들 앞에서 달아났다’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  english_pob_choice: I saw
  chosen_korean: 내가 보니
  alternatives_korean:
  - 내가 보았습니다
  - 내가 보았는데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 계시 환상 서술의 도입을 자연스럽게 살리되, 반복되는 ‘보았다’보다 문맥상 흐름이 좋은 ‘내가 보니’로 옮겼습니다.
- source_word: እስከ ተውህበ
  english_pob_choice: until ... was given
  chosen_korean: '...이 주어질 때까지'
  alternatives_korean:
  - '...이 주어지기까지'
  - '...이 주어졌을 때까지'
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간의 경과와 결정적 사건을 함께 나타내는 구조를 살려, 결과의 완료감보다 ‘~할 때까지’의 진행성을 유지했습니다.
- source_word: ለአባግዕ
  english_pob_choice: to the sheep
  chosen_korean: 양들에게
  alternatives_korean:
  - 양에게
  - 양들을 위해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여격 의미를 자연스러운 복수 처소로 옮겼으며, 이 환상에서 ‘양’이라는 상징어를 본문에서 그대로 보존했습니다.
- source_word: ሰይፍ ዐቢይ
  english_pob_choice: a great sword
  chosen_korean: 큰 칼
  alternatives_korean:
  - 큰 칼이
  - 위대한 칼
  - 강한 칼
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘great’의 규모와 위력을 모두 완전히 특정하지 않고, 한국어에서 가장 자연스러운 상징적 무기 표현인 ‘큰 칼’을 택했습니다.
- source_word: አዕዋፈ ሰማይ
  english_pob_choice: the birds of heaven
  chosen_korean: 하늘의 새들
  alternatives_korean:
  - 하늘의 새
  - 공중의 새들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘heaven’의 상징적 높임을 살리면서도 현대 한국어에서 더 자연스러운 ‘하늘의 새들’로 옮겼습니다.
- source_word: ነፍጹ እምቅድመ ገጾሙ
  english_pob_choice: fled from before their face
  chosen_korean: 그들의 얼굴 앞에서 달아났습니다
  alternatives_korean:
  - 그들 앞에서 달아났습니다
  - 그들의 앞에서 달아났습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 셈어적 관용구의 직설성을 보존해 ‘얼굴 앞에서’로 옮겼으며, 이는 단순한 ‘그들 앞에서’보다 원문의 생생한 압박감을 더 잘 드러냅니다.
theological_decisions:
- issue: 환상 상징어를 본문에서 해설로 풀지 않을지 여부
  chosen_reading: ‘양들’, ‘짐승들’, ‘하늘의 새들’을 문자적 환상 상징으로 유지했습니다.
  alternative_readings:
  - 양들을 하나님의 백성, 짐승들을 대적 세력으로 해설하여 옮김
  rationale: 애니멀 아포칼립스의 일관된 상징 체계를 본문 자체의 언어로 보존하는 것이, 독자가 원문이 의도한 환상적 긴장을 직접 접하게 합니다.
  doctrine_reference: 원문 우선의 번역 원칙; 상징을 설명문으로 평면화하지 않음.
