  rationale: 시작 동사와 반복되는 폭력적 섭식을 함께 살리기 위해 ‘먹어치우다’를 사용했습니다. 새가 눈을 공격한다는 구체성은 ‘쪼아 빼다’가 가장 직접적으로 전달합니다.
