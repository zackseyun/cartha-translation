  rationale: 본문과 영어 POB의 공인 어휘를 따르되, 두 번째 አንስርት는 ‘이끌다’의 주체로 다시 등장하는 동일 어휘이므로 중복 표기를 유지했습니다. 영어의 ‘vultures’는 한국어에서 ‘독수리’와 정확히 일대일이 아니지만, 본문이 포식성 맹금류의 군집을 가리키므로 지나친 세분화보다 일관성을 택했습니다.
