base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/026.yaml
  text: And I saw at that time that a similar deep abyss was opened in the middle of the earth[a], full of fire; and they brought those blinded sheep, and all of them were judged and were found to be sinners, and they were cast into that deep abyss of fire, and they burned[f][e][d][c][b]. And this abyss came to be at the right side of that house.
  footnotes:
  - marker: a
    text: Or 'a deep pit.' The Ge'ez term denotes a great depth; 'abyss' is chosen to preserve the apocalyptic setting.
    reason: lexical_alternative
  - marker: b
    text: '''Those blinded sheep'' continues the Animal Apocalypse''s symbolic imagery; the sheep represent people within the vision rather than literal animals.'
    reason: cultural_note
  - marker: c
    text: The clause 'were judged and became sinners' is rendered closely. It may mean that judgment exposed them as guilty, rather than that they then began to sin.
    reason: alternative_reading
  - marker: d
    text: Or 'a deep abyss was opened'.
    reason: previous_rendering
  - marker: e
    text: Or 'became sinners'.
    reason: previous_rendering
  - marker: f
    text: Or 'And that abyss'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 그때에 이와 같은 깊은 구렁이 땅 한가운데 열려 있는 것을 보았는데, 그것은 불로 가득 차 있었습니다. 그들이 그 눈먼 양들을 데려왔고, 그들 모두가 심판을 받아 죄인으로 판명되었으며, 그들은 그 불의 깊은 구렁에 던져져 탔습니다. 그리고 이 구렁은 그 집의 오른쪽에 있게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተርኅወ፡
  english_pob_choice: was opened
  chosen_korean: 열려 있는
  alternatives_korean:
  - 열렸습니다
  - 드러났습니다
  - 갈라졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상적 장면의 अचानक한 공개성을 살리면서도, 기계적으로 ‘열렸다’에만 고정하지 않고 상태 서술로 자연스럽게 옮겼습니다.
- source_word: ማዕምቅ
  english_pob_choice: deep abyss
  chosen_korean: 깊은 구렁
  alternatives_korean:
  - 깊은 심연
  - 깊은 구덩이
  - 심연
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘깊이’를 유지하면서도 묵시문학적 공포감을 살릴 수 있는 ‘구렁’을 택했습니다. ‘심연’보다 공간적 이미지가 또렷합니다.
- source_word: እልኩ አባግዕ ጽዑላነ
  english_pob_choice: those blinded sheep
  chosen_korean: 그 눈먼 양들
  alternatives_korean:
  - 그 눈멀어진 양들
  - 그 눈먼 양
  - 눈멀게 된 양들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 속 양들이 사람들을 상징한다는 점은 유지하되, 원문의 형용사적 표현을 간결하게 살려 ‘눈먼’으로 옮겼습니다.
- source_word: ወኮኑ፡ ኃጥኣነ
  english_pob_choice: were found to be sinners
  chosen_korean: 죄인으로 판명되었으며
  alternatives_korean:
  - 죄인으로 드러났으며
  - 죄인으로 여겨졌으며
  - 죄인으로 인정되었으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 뒤에 죄인 판정을 받는다는 사법적 뉘앙스를 살리기 위해 ‘판명되다’를 선택했습니다. 이것이 ‘죄를 짓기 시작했다’는 뜻으로 읽히지 않도록 했습니다.
- source_word: ተወድዩ
  english_pob_choice: were cast
  chosen_korean: 던져졌으며
  alternatives_korean:
  - 내던져졌으며
  - 던져 넣어졌으며
  - 던져졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형의 강한 추방 이미지를 한국어에서 자연스럽게 전달하는 동사로 옮겼습니다.
- source_word: ውዕዩ
  english_pob_choice: they burned
  chosen_korean: 탔습니다
  alternatives_korean:
  - 불탔습니다
  - 타올랐습니다
  - 불에 탔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 짧고 직접적인 종결을 살려 화염 속 파멸을 간결하게 표현했습니다.
theological_decisions:
- issue: ‘judged and were found to be sinners’의 사법적·상태적 의미를 어떻게 보존할지
  chosen_reading: ‘심판을 받아 죄인으로 판명되었으며’로 두 절을 분리해 유지했습니다.
  alternative_readings:
  - ‘심판을 받아 죄인으로 되었습니다’
  - ‘정죄되어 죄인이 되었습니다’
  rationale: 원문은 심판과 판정을 연속으로 제시합니다. 이를 하나로 합치면 ‘심판이 죄를 만들어냈다’는 오해가 생길 수 있어, 판결의 선언성을 남겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘this abyss’와 ‘that house’의 지시어 대비
  chosen_reading: ‘이 구렁’과 ‘그 집’으로 구별했습니다.
  alternative_readings:
  - ‘그 구렁’과 ‘그 집’
  - ‘이 심연’과 ‘저 집’
  rationale: 원문은 가까운 지시어와 먼 지시어를 의도적으로 대조합니다. 한국어에서도 근접/원거리 대비를 유지해 환상 속 공간 배치를 보존했습니다.
  doctrine_reference: Consistency of deixis in source imagery.
