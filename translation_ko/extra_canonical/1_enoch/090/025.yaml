base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/025.yaml
  text: And those shepherds were judged and were found to be sinners[c][b][a], and they were cast into that abyss of fire.
  footnotes:
  - marker: a
    text: The animal term in the Ethiopic OCR is textually uncertain in form, but the context of the Animal Apocalypse strongly suggests the referent is the elephants.
    reason: textual_variant
  - marker: b
    text: Or 'were found guilty'; the phrase 'became sinners' may function as a judicial declaration in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'And I saw that those elephants were judged and became sinners, and they were cast into that deep abyss of fire.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 목자들은 심판을 받았고 죄인으로 판명되었으며, 그들은 그 불의 심연으로 던져졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불의 심연’은 문자적으로는 불의 깊은 곳/깊은 심연을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ ኖላዊያን
  english_pob_choice: And those shepherds
  chosen_korean: 그리고 그 목자들은
  alternatives_korean:
  - 그리고 그 양치기들은
  - 그리고 그 목자들이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 ኖላዊያን은 ‘목자들’이므로, 본문 이미지와 선행 절(70명의 목자들)을 살려 직역합니다. 영어 POB의 ‘those shepherds’에 맞춰 지시어 ‘그’도 반영했습니다.
- source_word: ተኰነኑ
  english_pob_choice: were judged
  chosen_korean: 심판을 받았고
  alternatives_korean:
  - 판결을 받았고
  - 정죄를 받았고
  - 심판되었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적 수동을 살려 ‘심판을 받다’로 옮겼습니다. 이는 단순한 벌칙이 아니라 최종 판결의 뉘앙스를 드러냅니다.
- source_word: ወኮኑ ኃጥኣነ
  english_pob_choice: were found to be sinners
  chosen_korean: 죄인으로 판명되었으며
  alternatives_korean:
  - 죄인으로 드러났으며
  - 죄인으로 간주되었으며
  - 죄인임이 밝혀졌으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘죄인들이 되었다’이지만, 이 문맥에서는 판결로서의 선언이 핵심이므로 ‘판명되다’로 옮겨 사법적·도덕적 긴장을 함께 살렸습니다.
- source_word: ውስተ'ዛ ማዕምቀ እሳት
  english_pob_choice: into that abyss of fire
  chosen_korean: 그 불의 심연으로
  alternatives_korean:
  - 그 불의 깊은 심연으로
  - 그 불못으로
  - 그 불의 깊은 곳으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ማዕምቀ እሳት은 ‘불의 심연’이 핵심이므로 ‘심연’을 유지했습니다. 영어 본문의 ‘deep’는 별도 심화를 덧붙이지 않고, 한국어에서는 중복된 심화 표현을 피했습니다.
theological_decisions:
- issue: ‘죄인’의 의미를 도덕적 진술로 유지할지, 법정적 유죄 판정으로 풀어낼지
  chosen_reading: 본문에는 ‘죄인으로 판명되다’를 두어 도덕적 타락과 법정적 선언을 함께 드러냈습니다.
  alternative_readings:
  - 유죄로 판정되다
  - 죄를 지은 자로 드러나다
  rationale: 게에즈 표현은 도덕적 상태와 재판 결과를 동시에 함축하므로, 어느 한쪽으로만 평면화하지 않고 두 의미를 함께 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
