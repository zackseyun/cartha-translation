  - 그 인물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 원문이 말하는 시각적 인물을 지나치게 해석하지 않고, POB의 ‘man’에 맞춰 직접적으로 옮겼습니다.
- source_word: መጽሐፈ ሐጕል
  english_pob_choice: book of destruction
  chosen_korean: 멸망의 책
  alternatives_korean:
  - 파멸의 책
  - 파괴의 책
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 파괴·멸망 의미를 살리되, 한국어에서 자연스럽고 문맥상 심판 문서처럼 들리는 표현으로 옮겼습니다.
- source_word: እልኩ ፲ወ፪የአቱ ይኃርያን
  english_pob_choice: those twelve shepherds had destroyed
  chosen_korean: 그 열두 목자들이 망가뜨린
  alternatives_korean:
  - 그 열두 목자들이 파괴한
  - 그 열두 목자들이 허물어뜨린
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘목자들’이라는 상징적 직함을 보존하고, 파괴 행위를 한국어 동사로 직접 드러내어 원문의 책 제목과 연결했습니다.
- source_word: ፈድፋደ እምቅድሜሆሙ
  english_pob_choice: much more than those before them
  chosen_korean: 자기들보다 앞선 이들보다 훨씬 더 많이
  alternatives_korean:
  - 그들 이전 사람들보다 훨씬 더 많이
  - 앞선 이들보다 더 많이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 검토 기록에 따라 ‘명령된 바’를 덧붙이지 않고, ‘앞선 이들’이라는 비교 의미를 그대로 살렸습니다.
- source_word: ቅድመ እግዚአ አባግዕ
  english_pob_choice: before the Lord of the sheep
  chosen_korean: 양의 주 앞에서
  alternatives_korean:
  - 양들의 주 앞에서
  - 양의 주님 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Animal Apocalypse의 고유 호칭을 보존하기 위해 일반화하지 않고 직역 계열로 유지했습니다.
theological_decisions:
- issue: ‘양의 주’라는 고유 표제 보존
  chosen_reading: 하나님을 일반 명칭으로 바꾸지 않고 ‘양의 주’로 유지했습니다.
  alternative_readings:
  - 하나님 앞에서
  - 주님 앞에서
  rationale: 이 구절은 동물 묵시의 상징 세계 안에서 말하는 고유 호칭이므로, 독자가 본문 내부의 문학적·신학적 장치를 그대로 보도록 했습니다.
  doctrine_reference: 문학적 표제의 보존과 본문 내 상징 체계 존중
- issue: ‘앞선 이들’의 비교 의미
  chosen_reading: 열두 목자들의 행위가 ‘그들보다 앞선 이들’보다 더 심했다는 비교를 그대로 옮겼습니다.
  alternative_readings:
  - 그들에게 맡겨진 것보다 더 많이
  - 그들에게 정해진 한도를 넘어서
  rationale: 게에즈의 비교 표현을 주어진 대로 살려, 추가 해석을 넣지 않고 심판적 비교를 유지했습니다.
  doctrine_reference: 원문 우선 번역과 해석 절제
