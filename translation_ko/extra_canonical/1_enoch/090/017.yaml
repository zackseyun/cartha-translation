theological_decisions:
- issue: ‘양의 주’라는 고유 표제 보존
  chosen_reading: 하나님을 일반 명칭으로 바꾸지 않고 ‘양의 주’로 유지했습니다.
  alternative_readings:
  - 하나님 앞에서
  - 주님 앞에서
  rationale: 이 구절은 동물 묵시의 상징 세계 안에서 말하는 고유 호칭이므로, 독자가 본문 내부의 문학적·신학적 장치를 그대로 보도록 했습니다.
  doctrine_reference: 문학적 표제의 보존과 본문 내 상징 체계 존중
- issue: ‘앞선 이들’의 비교 의미
  chosen_reading: 열두 목자들의 행위가 ‘그들보다 앞선 이들’보다 더 심했다는 비교를 그대로 옮겼습니다.
  alternative_readings:
  - 그들에게 맡겨진 것보다 더 많이
  - 그들에게 정해진 한도를 넘어서
  rationale: 게에즈의 비교 표현을 주어진 대로 살려, 추가 해석을 넣지 않고 심판적 비교를 유지했습니다.
  doctrine_reference: 원문 우선 번역과 해석 절제
