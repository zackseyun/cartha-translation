  - 그리고 나는 ...를 보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비전 서술의 반복 공식에 맞춰 단순한 관찰 동사를 사용하고, 한국어에서도 회상적 서술 흐름을 유지했습니다.
