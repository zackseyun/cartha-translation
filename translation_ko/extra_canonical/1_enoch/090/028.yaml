base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/028.yaml
  text: And I stood watching until that old house was folded up[a]; and they carried out all the pillars, and all the beams and ornaments of that house were folded up with it[c][b], and they carried it out and set it down in one place in the south of the land.
  footnotes:
  - marker: a
    text: Literally, 'at the right hand of the land.' In biblical-style directional language this commonly means 'to the south.'
    reason: lexical_alternative
  - marker: b
    text: The repeated verb rendered 'was folded up' may also suggest 'was wrapped up' or 'taken down'; the image is of the old structure being gathered away, not merely ruined.
    reason: lexical_alternative
  - marker: c
    text: Or 'and they carried out all its pillars and all its plants and the beams of that house were folded up with it'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 서서 보고 있으니, 그 오래된 집이 접혀 없어질 때까지였고, 그들은 모든 기둥을 끌어내었으며, 그 집의 모든 나무기둥과 함께 접혀 없어질 것들도 함께였고, 그 집을 끌어내어 그 땅의 남쪽 한 곳에 내려놓았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 땅의 오른쪽에’입니다. 성서적 방향어에서는 보통 ‘남쪽’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 반복된 동사는 ‘접혀 없어지다’ 외에 ‘말려 올라가다’ 또는 ‘거두어지다’로도 옮길 수 있습니다. 핵심 이미지는 단순한 파괴가 아니라 구조가 함께 거두어지는 장면입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 집의 모든 기둥과 모든 식물과 들보가 그것과 함께 접혀 없어졌다’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ቆምኩ + አርእይ
  english_pob_choice: I stood watching
  chosen_korean: 내가 서서 보고 있으니
  alternatives_korean:
  - 내가 서서 지켜보고 있으니
  - 내가 서서 바라보고 있으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 서술의 진행성을 살리기 위해 단순한 ‘섰다’보다 ‘서서 보고 있다’는 진행형을 택했습니다.
- source_word: ተጠወም
  english_pob_choice: was folded up
  chosen_korean: 접혀 없어질 때까지
  alternatives_korean:
  - 접혀 올라갈 때까지
  - 말려 들어갈 때까지
  - 걷혀 없어질 때까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 건물이 ‘부서졌다’기보다 함께 거두어져 사라지는 영상이므로, ‘접혀 없어지다’로 시각적 이미지를 살렸습니다.
- source_word: አዕማድ / ሤስ
  english_pob_choice: pillars / beams
  chosen_korean: 기둥 / 나무기둥
  alternatives_korean:
  - 기둥 / 들보
  - 주기둥 / 들보
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘기둥’은 구조를, ‘나무기둥’은 뒤의 목재 요소와 병렬을 이루어 집의 해체 장면을 더 구체적으로 전달합니다.
- source_word: ወበየማነ ምድር
  english_pob_choice: in one place in the south of the land
  chosen_korean: 그 땅의 남쪽 한 곳에
  alternatives_korean:
  - 그 땅의 오른쪽 한 곳에
  - 그 땅의 남쪽에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘땅의 오른쪽’이지만, 여기서는 방향어가 남쪽을 가리키는 관용법이므로 본문에서는 자연스러운 의미를 살렸습니다.
theological_decisions:
- issue: ‘old house’의 상징성을 얼마나 드러낼지
  chosen_reading: 오래된 집
  alternative_readings:
  - 옛 성전
  - 옛 집
  rationale: 이 장면의 성전 상징은 문맥에서 드러나므로, 본절 자체는 원문 어휘를 따라 ‘집’으로 두어 상징을 과도하게 해석하지 않았습니다.
  doctrine_reference: 문맥이 상징을 확장하더라도 본절은 원문 이미지의 보존을 우선한다.
