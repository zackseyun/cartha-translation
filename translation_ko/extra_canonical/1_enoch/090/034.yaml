base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/034.yaml
  text: And I saw until they laid aside that sword which had been given to the sheep[a], and they brought it into the house and sealed it before the face of the Lord; and all the sheep were summoned into that house[e][d][c][b], and it did not contain them.
  footnotes:
  - marker: a
    text: '''Before the face of the Lord'' is a literal idiom meaning ''in the Lord''s presence.'''
    reason: lexical_alternative
  - marker: b
    text: The final clause likely means that the house could not contain all the sheep.
    reason: lexical_alternative
  - marker: c
    text: In the vision's symbolism, 'the house' may evoke the temple or the eschatological dwelling of God's people, but the text itself says only 'house.'
    reason: cultural_note
  - marker: d
    text: Or 'they brought it'.
    reason: previous_rendering
  - marker: e
    text: Or 'it was not enough to hold them'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 그들이 양들에게 주어졌던 그 칼을 내려놓는 것을 보았습니다. 그들은 그것을 그 집 안으로 가져가 주님 앞에서 봉인하였고[a], 모든 양들은 그 집 안으로 불려 들어갔으나 그 집은 그들을 담을 수 없었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주님의 얼굴 앞에서’이며, ‘주님의 임재 가운데서’를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들을 담지 못했습니다’ 또는 ‘그들을 포함하지 못했습니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘집’은 원문 그대로 보존한 표현입니다. 성전이나 종말론적 거처를 가리킬 가능성은 있으나, 본문만으로 확정할 수 없습니다.
    reason: cultural_note
lexical_decisions:
- source_word: አሰከብዎ
  english_pob_choice: they laid aside
  chosen_korean: 내려놓는 것을
  alternatives_korean:
  - 옆에 두는 것을
  - 놓아두는 것을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 칼을 의도적으로 내려놓는 동작을 자연스럽게 살리면서도, 과도하게 해석하지 않기 위해 ‘내려놓는 것’으로 옮겼습니다.
- source_word: ሰይፍ
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 칼날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상징적이면서도 구체적인 무기 이미지를 유지하기 위해 표준적인 ‘칼’을 택했습니다.
- source_word: ተውህበ
  english_pob_choice: had been given
  chosen_korean: 주어진
  alternatives_korean:
  - 받은
  - 주어졌던
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이전 문맥에서 양들이 칼을 받았다는 사실을 회상하는 서술이므로, 한국어에서는 자연스러운 수동 표현인 ‘주어진’이 적절합니다.
- source_word: ኀተማ እምቅድመ ገጹ ለእግዚእ
  english_pob_choice: sealed it up before the face of the Lord
  chosen_korean: 주님의 얼굴 앞에서 봉인하였고
  alternatives_korean:
  - 주님 앞에서 봉인하였고
  - 주님의 임재 앞에서 봉인하였고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘before the face of’라는 셈어적 관용을 살리기 위해 ‘얼굴 앞에서’를 유지했고, 행위의 엄숙함은 ‘봉인하다’로 옮겼습니다.
- source_word: ወኢያገምሮሙ
  english_pob_choice: it did not contain them
  chosen_korean: 그들을 감당하지 못했습니다
  alternatives_korean:
  - 그들을 담을 수 없었습니다
  - 그들을 포함하지 못했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘그들을 담지/포함하지 못했다’이지만, 집이 군중을 수용하지 못한다는 뜻을 한국어에서 가장 자연스럽게 전달하는 표현으로 ‘감당하지 못했습니다’를 선택했습니다.
theological_decisions:
- issue: ‘house’의 해석을 본문에서 어떻게 처리할지
  chosen_reading: ‘집’으로 두어 상징적 해석을 본문에 강요하지 않았습니다.
  alternative_readings:
  - 성전
  - 하나님의 집
  rationale: 에녹서의 상징 체계상 추가 해석 여지가 있지만, 원문 자체는 단지 ‘집’이라고 말하므로 본문에서는 이미지 자체를 보존했습니다.
  doctrine_reference: 서술 본문은 원문이 말하는 범위 안에서 번역하고, 상징 해석은 주석에 남깁니다.
