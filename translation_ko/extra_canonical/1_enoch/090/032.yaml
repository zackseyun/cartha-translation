translation:
  language: ko
  text: 그리고 그 양 떼는 모두 흰색이 되었고, 그 털은 굵고 깨끗해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጻዕዳ
  english_pob_choice: white
  chosen_korean: 흰색
  alternatives_korean:
  - 하얗게
  - 희게
  - 흰
  lexicon: color adjective
  rationale: 양 떼가 ‘모두 흰색이 되었다’는 상태 변화를 직설적으로 살려, 색채의 결과를 분명하게 나타냈습니다.
- source_word: ወጸጕረ
  english_pob_choice: hair
  chosen_korean: 털
  alternatives_korean:
  - 머리털
  - 양털
  - 털
  lexicon: body_fur/wool
  rationale: 문맥상 양의 신체 털을 가리키므로, 영어 POB의 ‘hair’를 한국어로는 동물의 털을 자연스럽게 지시하는 ‘털’로 옮겼습니다.
- source_word: '*ዐቢየ'
  english_pob_choice: thick
  chosen_korean: 굵고
  alternatives_korean:
  - 두껍고
  - 풍성하고
  - 많고
  lexicon: size/texture adjective
  rationale: 털의 상태를 묘사하는 형용사로서, ‘굵고’가 두께와 밀도를 함께 무리 없이 드러냅니다.
- source_word: ወንጹሐ
  english_pob_choice: pure
  chosen_korean: 깨끗해졌습니다
  alternatives_korean:
  - 순결해졌습니다
  - 순수해졌습니다
  - 깨끗했습니다
  lexicon: moral/purity adjective
  rationale: 원문의 ‘pure’는 외형적·상태적 청결과 순수함을 함께 담을 수 있어, 한국어에서는 상태 변화가 보이는 ‘깨끗해졌습니다’로 옮겼습니다.
theological_decisions:
- issue: 양 떼의 변형을 어떻게 표현할지
  chosen_reading: 외형적 흰색과 털의 변화라는 환상/상징적 묘사를 과장 없이 그대로 번역했습니다.
  alternative_readings:
  - 알레고리적 의미를 덧붙여 설명하는 번역
  - 상징성을 약화해 단순 목축 묘사로 축소하는 번역
  rationale: 본문은 시각적 변화와 정결의 이미지를 함께 제시하므로, 의미를 확장하지도 축소하지도 않고 관찰 가능한 변화로 옮기는 것이 적절합니다.
  doctrine_reference: 상징 서술의 직역 원칙
