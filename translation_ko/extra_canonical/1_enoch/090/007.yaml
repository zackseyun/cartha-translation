base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/007.yaml
  text: And they cried out to them[a], but they did not heed their words; rather, they were exceedingly deaf[c][b], and their eyes were exceedingly blinded.
  footnotes:
  - marker: a
    text: The Ethiopic repeats an intensifier ('exceedingly') with both their deafness and the blinding of their eyes, emphasizing extreme insensibility.
    reason: lexical_alternative
  - marker: b
    text: The imagery of deafness and blinded eyes likely carries moral-spiritual force within the vision, but the translation keeps the concrete sensory language of the Ethiopic.
    reason: cultural_note
  - marker: c
    text: Or 'And I cried out over them, but they did not listen to my words'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 그들에게 외쳤지만, 그들은 그들의 말을 듣지 않았습니다. 오히려 그들은 매우 귀머거리였고, 그들의 눈은 매우 멀어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 본문은 ‘매우’라는 강조를 귀머거림과 눈의 멀어짐에 각각 반복해 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 비전 안에서 도덕적·영적 무감각을 암시할 수 있지만, 번역은 에티오피아어의 구체적 감각 언어를 유지합니다.
    reason: theological_note
lexical_decisions:
- source_word: ወአስርኅዎሙ
  english_pob_choice: And they cried out to them
  chosen_korean: 그들은 그들에게 외쳤지만
  alternatives_korean:
  - 그들은 그들에게 소리쳤지만
  - 그들은 그들에게 부르짖었지만
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 3인칭 복수 동작을 반영해 1인칭으로 바꾸지 않고, 비전 속 절박한 호소의 뉘앙스를 살리기 위해 ‘외쳤지만’으로 옮겼습니다.
- source_word: ኢያጽምኡ ነገሮሙ
  english_pob_choice: they did not heed their words
  chosen_korean: 그들은 그들의 말을 듣지 않았습니다
  alternatives_korean:
  - 그들은 그들의 말을 귀담아듣지 않았습니다
  - 그들은 그들의 말을 따르지 않았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 청각 부재보다 책임 있는 거부를 드러내면서도, 영어 POB의 ‘heed’가 과도한 해석으로 굳지 않도록 표준적인 ‘듣지 않았습니다’로 처리했습니다.
- source_word: ፈድፋደ
  english_pob_choice: exceedingly
  chosen_korean: 매우
  alternatives_korean:
  - 지극히
  - 극도로
  - 몹시
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동일한 강조 부사가 두 번 반복되는 점을 한국어에서는 자연스럽게 ‘매우’로 살려, 과도한 문어체 없이 강도를 유지했습니다.
- source_word: ተጸመሙ / ተጸለሉ አዕይንቲሆሙ
  english_pob_choice: were exceedingly deaf / their eyes were exceedingly blinded
  chosen_korean: 귀머거리였고 / 그들의 눈은 매우 멀어졌습니다
  alternatives_korean:
  - 듣지 못했고 / 그들의 눈은 매우 가려졌습니다
  - 귀가 막혀 있었고 / 그들의 눈은 매우 어두워졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 감각적·비전적 이미지를 유지하기 위해 ‘귀머거리’와 ‘멀어졌습니다’를 사용했고, ‘눈은 멀어지다’는 시력 상실을 비교적 직접적으로 드러냅니다.
theological_decisions:
- issue: 감각적 묘사와 도덕적·영적 무감각의 관계
  chosen_reading: 본문은 ‘듣지 않음/귀머거리/눈이 멀어짐’이라는 구체적 감각 언어를 그대로 두어, 독자가 그 비전의 영적 의미를 읽어내도록 했습니다.
  alternative_readings:
  - 그들은 영적으로 완고해졌습니다
  - 그들은 하나님의 말을 순종하지 않았습니다
  rationale: 이 단락의 묵시적 이미지가 육체적 감각 상실을 통해 도덕적·영적 상태를 보여주므로, 해석을 선제적으로 풀어쓰지 않고 긴장을 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 묵시문학의 상징 언어는 그대로 두고 신학적 의미는 문맥에서 드러나게 한다.
