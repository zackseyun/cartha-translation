base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/033.yaml
  text: And all those that had been scattered and dispersed[a], and all the beasts of the field and all the birds of heaven, were gathered into that house; and the Lord of the sheep rejoiced with great joy[c][b], because they had all become good and had entered into his house.
  footnotes:
  - marker: a
    text: The paired verbs 'scattered and dispersed' likely intensify the same idea; the translation keeps both to preserve the verse's emphatic restoration imagery.
    reason: lexical_alternative
  - marker: b
    text: '''That house'' and later ''his house'' refer to the restored dwelling/temple imagery within the vision, not merely an ordinary building.'
    reason: cultural_note
  - marker: c
    text: Or 'had been scattered and dispersed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 흩어지고 흩어진[a] 모든 이들과 들의 모든 짐승과 하늘의 모든 새들이 그 집으로 모여들었습니다. 그러자 양들의 주께서 큰 기쁨으로 크게 기뻐하셨습니다[b][c]. 그들이 모두 좋게 되었고 그의 집으로 들어갔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 두 동사는 의미가 겹치지만, 본문은 분산과 흩어짐을 겹쳐 말해 회복의 전면성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 집’은 환상 안의 회복된 거처/성전 이미지를 가리키며, 단순한 건물을 뜻하지 않습니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘큰 기쁨으로 크게 기뻐하셨습니다’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ተሐጕሉ
  english_pob_choice: had been scattered
  chosen_korean: 흩어지고
  alternatives_korean:
  - 사라지고
  - 멸망하고
  - 분산되고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 영어는 이 동사를 ‘scattered’로 이해하지만, 1 Enoch 90장의 문맥상 전후의 분산 표현과 함께 회복된 집합을 대비시키는 말이므로 한국어도 ‘흩어지고’로 자연스럽게 살렸습니다.
- source_word: ተዘርዘሩ
  english_pob_choice: dispersed
  chosen_korean: 흩어진
  alternatives_korean:
  - 분산된
  - 퍼져 흩어진
  - 분리된
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 번째 동사와 겹치지만 반복을 통해 강조를 형성하므로, 같은 어근을 피하지 않고 ‘흩어진’으로 대응해 강조감을 유지했습니다.
- source_word: አራዊተ ገዳም
  english_pob_choice: beasts of the field
  chosen_korean: 들의 모든 짐승
  alternatives_korean:
  - 들짐승
  - 광야의 모든 짐승
  - 야생 짐승들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘field’에 해당하는 ገዳም을 지나치게 특정하지 않고, POB의 범주적 표현을 따라 ‘들의 모든 짐승’으로 옮겨 장면의 포괄성을 살렸습니다.
- source_word: እግዚኦሙ ለአባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주
  alternatives_korean:
  - 양들의 주인
  - 양들의 주님
  - 양들의 통치자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 Animal Apocalypse의 반복되는 신적 호칭이므로, 비유성을 유지하면서도 예배적 울림이 있는 ‘양들의 주’로 옮겼습니다.
- source_word: ተፈሥሐ ዐቢየ ፍሥሐ
  english_pob_choice: rejoiced with great joy
  chosen_korean: 큰 기쁨으로 크게 기뻐하셨습니다
  alternatives_korean:
  - 엄청난 기쁨으로 기뻐하셨습니다
  - 크게 기뻐하셨습니다
  - 지극히 기뻐하셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동족어 반복의 강조를 한국어에서 가장 자연스럽게 살리기 위해 ‘큰 기쁨으로 크게 기뻐하셨습니다’로 반복 구조를 유지했습니다.
- source_word: ኄራነ
  english_pob_choice: good
  chosen_korean: 좋게
  alternatives_korean:
  - 선하게
  - 올바르게
  - 의롭게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 형용사는 여기서 도덕적 평가와 회복된 상태를 함께 가리키므로, 좁은 신학용어인 ‘의롭게’보다 문맥상 넓은 ‘좋게’가 더 적절합니다.
theological_decisions:
- issue: ‘양들의 주’의 신적 호칭 보존
  chosen_reading: ‘양들의 주’로 직역해, 비유적 표상을 그대로 유지했습니다.
  alternative_readings:
  - 양들의 주인
  - 양들의 주님
  - 양들의 통치자
  rationale: 이 호칭은 단순 소유자 표현이 아니라 환상 서사 안에서 하나님을 가리키는 반복적 표지이므로, 의미를 평탄화하지 않고 상징을 보존하는 쪽이 본문의 의도에 더 가깝습니다.
  doctrine_reference: Apocalyptic symbolic title preservation; do not flatten recurring divine imagery.
- issue: ‘좋게 되었고’의 의미 범위
  chosen_reading: 도덕적 완전성만이 아니라 회복된 상태를 함께 포괄하는 표현으로 이해했습니다.
  alternative_readings:
  - 의롭게 되었고
  - 올바르게 되었고
  - 선하게 되었고
  rationale: 문맥은 짐승들이 집으로 모이는 회복 장면이므로, 본문이 요구하는 변화의 폭을 과도하게 신학화하지 않으면서도 상태 변화를 드러내야 합니다.
  doctrine_reference: Preserve local semantic tension; avoid over-theologizing the adjective.
