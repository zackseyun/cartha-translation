theological_decisions:
- issue: 눈이 열림의 의미
  chosen_reading: 지각이 실제로 회복되는 환상적·서사적 장면으로 옮기고, 본문 안에서 곧바로 영적 해석으로 환원하지 않았습니다.
  alternative_readings:
  - 모든 이에게 영적 깨달음이 주어졌습니다
  - 상징적으로 영적 눈이 열렸습니다
  rationale: 애니멀 아포칼립스의 맥락에서 이 표현은 환상 세계 안의 실제적 회복을 가리키므로, 본문 이미지를 유지하는 번역이 더 충실합니다.
  doctrine_reference: 상징의 신학적 함의를 유지하되 본문이 허용하는 범위를 넘어 해석을 고정하지 않습니다.
