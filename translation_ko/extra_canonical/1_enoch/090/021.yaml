- source_word: ዘይቀድም እምነ ዝኩ ከዋክብት ... ዘወፅአ ቅድመ
  english_pob_choice: the first star that went before those stars ... that first one which went out before them
  chosen_korean: 처음으로 그들 앞에 나아간 그 별로부터 ... 그 앞서간 첫 별까지
  alternatives_korean:
