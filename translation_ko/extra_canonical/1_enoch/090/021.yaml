  rationale: 본문의 상징 이미지를 해석어로 바꾸지 않고 ‘별들’로 보존하여, 독자가 비유 체계를 그대로 따라가도록 했습니다.
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  english_pob_choice: whose private parts were like those of horses
  chosen_korean: 말의 것과 같은 그들의 사지가 수치스러웠던
  alternatives_korean:
  - 말의 생식기와 같은 그들의 사지가 수치스러웠던
