  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: inceptive እም의 뜻을 살려 ‘~로부터’가 아니라 ‘처음으로 …부터’/‘~까지’의 순서감을 드러냈고, 반복된 ‘첫 별’ 표지를 유지해 지시 대상의 동일성을 보존했습니다.
theological_decisions:
- issue: 1 Enoch의 상징어 ‘stars’를 해석어로 바꿀지 여부
  chosen_reading: 본문에서는 ‘별들’을 유지하고 해석을 보류했습니다.
  alternative_readings:
  - ‘천사들’로 풀어 옮기기
  - ‘천상 존재들’로 바꾸기
  rationale: 묵시적 상징은 독자의 추론을 통해 읽히도록 두는 것이 서사의 힘을 보존합니다. 영어 POB의 처리와 같이, 의미는 문맥이 드러내되 본문은 이미지 자체를 유지했습니다.
  doctrine_reference: 묵시문학의 상징 이미지를 평이한 해석어로 평탄화하지 않음
- issue: 반복되는 ‘첫 별/그 별’의 지시를 어떻게 처리할지
  chosen_reading: ‘첫 별’과 ‘그 별’을 함께 써서 동일 지시를 유지했습니다.
  alternative_readings:
  - 한 번만 언급하고 정리하기
  - 모두 ‘첫 번째 별’로 통일하기
  rationale: 본문의 중복은 필사 전승의 난점과 의도된 식별을 함께 반영할 수 있으므로, 반복을 지워버리지 않고 독자가 동일 대상을 추적할 수 있게 했습니다.
  doctrine_reference: 본문의 전승상 긴장과 반복 구조를 보존
