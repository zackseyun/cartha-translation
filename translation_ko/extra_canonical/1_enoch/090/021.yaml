  naturalness: ‘그때부터 말입니다’는 문맥상 독립 문장으로 성립하지 않으며, ‘처음으로 … 별로부터 … 첫 별까지’는 수식 관계가 뒤엉켜 현대 한국어로 자연스럽지 않습니다. 명령문을 하나의 문장으로 정리하고, ‘~부터’를 명령 대상의 제시 순서를 나타내는 표현으로 두면 자연스럽습니다.
  terminology: ‘양들의 주’, ‘별들’, ‘흰 사람’은 환상 서사의 상징과 원문의 명시적 ‘사람들’을 함께 보존합니다. 성적 표현은 완곡하되 의미를 바꾸지 않는 ‘말과 같은 성기’를 사용했습니다. ‘맨 처음의 흰 사람 일곱’은 ‘일곱 first white men’의 우선성·수량·흰색 표지를 비교적 자연스럽게 유지합니다.
