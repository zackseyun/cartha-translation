    rationale: ‘그때부터 말입니다’는 원문에 없고 문장으로도 부자연스럽습니다. inceptive እም은 별들을 데려오는 순서의 시작을 나타내므로 ‘첫 별부터’로 연결해야 하며, ‘~까지’는 근거가 없습니다.
