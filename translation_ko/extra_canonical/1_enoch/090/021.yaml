base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/021.yaml
  text: And the Lord of the sheep called those seven first white ones and commanded that they bring before him[a], beginning with the first star that went before those stars whose private parts were like those of horses, that first one which went out before them[e][d][c][b]; and they brought them before him.
  footnotes:
  - marker: a
    text: The clause about 'the first one that went out before' is textually difficult in this Ethiopic witness and may restate the identity of the leading star rather than introduce a separate figure.
    reason: textual_variant
  - marker: b
    text: In this vision, 'stars' function symbolically for heavenly beings; the translation keeps the image rather than replacing it with its interpretation.
    reason: cross_reference
  - marker: c
    text: The comparison to horses is an intentionally shameful sexual image, likely recalling the transgression of the rebellious heavenly beings.
    reason: cultural_note
  - marker: d
    text: Or 'those seven first white ones'.
    reason: previous_rendering
  - marker: e
    text: Or 'from the first star that went before those stars whose private parts were like those of horses, even that first one'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 양들의 주께서 맨 처음의 흰 사람 일곱을 부르시고, 그들에게 말과 같은 성기를 가진 별들[b][c]보다 앞서간 첫 별, 곧 그들 앞에 먼저 나아간 그 첫 별[a][d]부터[e] 그분 앞으로 데려오라고 명하셨습니다. 그들이 그것들을 그분 앞으로 데려왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들 앞에 먼저 나아간 그 첫 별’이라는 반복 구절은 이 에티오피아어 전승에서 본문상 난해합니다. 이는 앞서 언급한 첫 별을 다시 가리키는 말일 수 있으며, 별도의 존재를 뜻하는 것으로 단정하지 않았습니다.
    reason: textual_variant
  - marker: b
    text: 이 환상에서 ‘별들’은 천상 존재들을 가리키는 상징 이미지입니다. 본문에서는 해석어로 바꾸지 않고 이미지를 유지했습니다.
    reason: cross_reference
  - marker: c
    text: ‘말과 같은 성기’라는 비교는 반역한 천상 존재들의 타락을 환기하는 의도적으로 수치스러운 성적 이미지입니다.
    reason: cultural_note
  - marker: d
    text: 직역하면 ‘첫 별’이라 할 곳에 반복 구절은 ‘첫것’으로 읽힐 수 있으나, 문맥과 전승상의 반복을 따라 같은 첫 별을 가리키도록 옮겼습니다.
    reason: previous_rendering
  - marker: e
    text: ‘~부터’는 공간적 출발점이 아니라 데려오는 순서의 시작점, 곧 ‘첫 별부터 시작하여’를 뜻합니다.
    reason: source_note
