  - 양 떼의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비유적 인물 지칭을 살리면서도 주인의식보다 주권을 드러내는 ‘주’를 택해 영어 POB의 elevated register를 한국어로 옮겼습니다.
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  english_pob_choice: those seven first white ones
  chosen_korean: 그 일곱 흰 첫 사람들
  alternatives_korean:
  - 그 일곱 흰 자들
  - 그 일곱 첫 흰 사람들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정 논의에서 확인되듯 ሰብአ는 ‘사람들/남자들’의 뜻을 가지므로, ‘첫 사람들’로 옮겨 1 Enoch의 상징 코드에서 천상 존재를 인간 형상으로 제시하는 층위를 살렸습니다.
- source_word: ያምጽኡ ቅድሜሁ
  english_pob_choice: bring before him
  chosen_korean: 그분 앞에 데려오라고
  alternatives_korean:
  - 그 앞에 데려오라고
  - 그분 앞에 바치라고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 재판적·의례적 제시 동사를 자연스러운 현대 한국어로 옮기되, 단순 이동이 아니라 권위 앞에 ‘데려옴’이라는 뜻을 유지했습니다.
- source_word: ከዋክብት
  english_pob_choice: stars
  chosen_korean: 별들
  alternatives_korean:
  - 천상 존재들
  - 별
