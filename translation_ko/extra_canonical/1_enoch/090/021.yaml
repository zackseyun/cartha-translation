  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 재판적·의례적 제시 동사를 자연스러운 현대 한국어로 옮기되, 단순 이동이 아니라 권위 앞에 ‘데려옴’이라는 뜻을 유지했습니다.
- source_word: ከዋክብት
