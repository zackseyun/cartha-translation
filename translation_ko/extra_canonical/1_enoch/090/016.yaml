- source_word: ይቀትቅጥዎ፡ ለዝኩ፡ ቀርነ፡
  english_pob_choice: helped one another so as to break the horn of that ram
  chosen_korean: 서로 도와 그 숫양의 뿔을 꺾었습니다
  alternatives_korean:
  - 서로 도와 그 숫양의 뿔을 부러뜨렸습니다
  - 서로 협력하여 그 숫양의 뿔을 꺾었습니다
  lexicon: Qal/causative sense in Ge'ez for damaging/breaking a horn
