theological_decisions:
- issue: 숫양의 뿔을 ‘꺾다’라는 최종 이미지
  chosen_reading: 군집한 새들과 들양들이 협력하여 권세의 상징인 뿔을 무너뜨리는 서사적 장면으로 유지했습니다.
  alternative_readings:
  - 정치적 세력의 몰락을 직접 해석하는 방식
  - 상징을 약화시켜 단순한 동물 행동으로만 읽는 방식
  rationale: 본문은 해석을 덧붙이기보다 상징적 행위를 서술합니다. 그래서 의미를 확장하지 않고, 독자가 Enoch의 비유적 힘을 그대로 읽도록 했습니다.
  doctrine_reference: apocalyptic symbolism preservation
