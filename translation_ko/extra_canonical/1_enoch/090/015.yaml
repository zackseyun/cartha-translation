  source_fidelity: 원문의 ርኢኩ는 환상 서술의 ‘내가 지켜보니’로, እስከ መጽአ는 과거 사건에 이르는 ‘오실 때까지’보다 ‘오셨을 때까지’가 적절합니다. እግዚአ አባግዕ, በመዓት, ነፍጹ, ውስተ ጽላሎት은 각각 ‘양 떼의 주’, ‘진노 가운데’, ‘도망쳤고’, ‘그림자 속으로’로 충실히 반영할 수 있습니다. 마지막 እምቅድመ ገጹ는 명시적으로 ‘그의 얼굴 앞을/앞으로부터 떠나’라는 출발점을 나타내므로, 초안의 ‘그의 얼굴 앞에서’만으로는 그 방향성이 충분히 드러나지 않습니다.
  naturalness: 초안의 ‘오실 때까지’는 이미 완료된 환상 장면의 과거 서술과 어울리지 않고, ‘그의 얼굴 앞에서 그림자 속에 엎드러졌습니다’는 ‘속에’와 ‘엎드러지다’의 결합이 원문의 이동·추락 이미지를 약화합니다. ‘그의 얼굴 앞을 떠나 그림자 속으로 떨어졌습니다’는 현대 한국어로 자연스럽고, 원문의 공간적 흐름을 보존합니다.
