base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/015.yaml
  text: And I watched until the Lord of the sheep came to them in wrath[a], and all who saw him fled[c][b], and they all fell into the shadow before his face.
  footnotes:
  - marker: a
    text: Or 'from before his face'; the Ge'ez idiom can denote the overwhelming effect of his presence.
    reason: lexical_alternative
  - marker: b
    text: '''Into the shadow'' is a literal rendering of the Ge''ez; the image may suggest a dark place of downfall, but the wording is left transparent rather than interpreted more narrowly.'
    reason: lexical_alternative
  - marker: c
    text: Or 'before his face'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보니, 양 떼의 주께서 진노 가운데 그들에게 오실 때까지, 그를 본 모든 이가 도망했고, 그들은 모두 그의 얼굴 앞에서 그림자 속에 엎드러졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአ አባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양 떼의 주
  alternatives_korean:
  - 양들의 주인
  - 양 떼의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 명칭은 동물 묵시에서 양 떼를 다스리는 신적 통치자를 가리키므로, 권위를 살리는 ‘주’를 택하되 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: በመዓት
  english_pob_choice: in wrath
  chosen_korean: 진노 가운데
  alternatives_korean:
  - 분노 가운데
  - 노여움으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판의 엄중한 어조를 살리기 위해 ‘진노’를 사용했습니다. 이는 단순 감정이 아니라 դատ적인 분노를 드러냅니다.
- source_word: ነፍጹ
  english_pob_choice: fled
  chosen_korean: 도망했고
  alternatives_korean:
  - 달아났고
  - 피했고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 갑작스러운 공포 속 이탈을 나타내므로, 서술체에 자연스러운 ‘도망하다’를 택했습니다.
- source_word: ውስተ ጽላሎት
  english_pob_choice: into the shadow
  chosen_korean: 그림자 속에
  alternatives_korean:
  - 어둠 속에
  - 그늘 속에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 이미지를 지나치게 해석하지 않고 ‘shadow’를 직접 반영했습니다. 심판 장면의 음울함은 문맥이 충분히 전달합니다.
theological_decisions:
- issue: “before his face”의 방향성
  chosen_reading: ‘그의 얼굴 앞에서’로 옮겨, 그 현현 앞에 압도되어 물러나는 장면을 드러냈습니다.
  alternative_readings:
  - ‘그의 얼굴에서’
  - ‘그의 임재 앞에서’
  rationale: Ge'ez의 እምቅድመ는 ‘~앞에서/앞으로부터’의 중의성을 가지지만, 이 절은 공포로 인한 퇴각을 묘사하므로 ‘얼굴 앞에서’로 두어 원문의 인격적 현현 이미지를 보존했습니다.
  doctrine_reference: Apocalyptic imagery should remain transparent; preserve the force of divine presence without flattening the idiom into a generic 'presence'.
