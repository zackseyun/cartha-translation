base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/024.yaml
  text: And judgment took place first upon the stars[a], and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming[c][b], and full of pillars of fire.
  footnotes:
  - marker: a
    text: The phrase 'before the stars' may also be understood as 'in the presence of the stars.' In this vision the stars are personified heavenly beings, so the wording likely carries both spatial and judicial force.
    reason: lexical_alternative
  - marker: b
    text: The repeated judgment language is kept in English ('judgment,' 'were judged,' 'place of judgment') to reflect the Ge'ez repetition rather than smoothing it away.
    reason: cultural_note
  - marker: c
    text: Or 'And judgment took place before the stars, and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming, and full of pillars of fire.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 심판이 먼저 별들에게 임하였고, 그들은 심판을 받아 죄인으로 드러났으며, 심판의 장소로 갔습니다. 그리고 그들을 깊은 구렁에 던졌는데, 그곳은 불과 타오름으로 가득하고 불의 기둥으로 가득했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 초기 영어 판본의 ‘before the stars’는 별들 앞이라는 공간적 의미로도 읽힐 수 있으나, 최신 검토에 따라 여기서는 시간적으로 ‘먼저’라는 뜻을 반영했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ቅድመ እምከዋክብት
  english_pob_choice: first upon the stars
  chosen_korean: 먼저 별들에게 임하였고
  alternatives_korean:
  - 별들 앞에
  - 별들 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영어 POB와 같이 시간적 선행을 드러내기 위해 ‘먼저’로 옮기고, 별들을 심판의 대상인 존재로 나타내기 위해 여격을 사용했습니다.
- source_word: ኵነኔ / ተኰነኑ
  english_pob_choice: judgment / were judged
  chosen_korean: 심판 / 심판을 받아
  alternatives_korean:
  - 판결 / 판결을 받아
  - 재판 / 재판을 받아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 반복된 심판 어근을 살려, 절차성과 결과를 분리한 상태로 유지했습니다. ‘심판을 받아’는 ‘were judged’의 수동적 법정 의미를 자연스럽게 드러냅니다.
- source_word: ኃጥኣነ
  english_pob_choice: sinners
  chosen_korean: 죄인
  alternatives_korean:
  - 죄인들
  - 죄를 지은 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 도덕적·종교적 비난을 직접 담는 기본어로서 ‘죄인’이 가장 간결하고 원문에 충실합니다.
- source_word: ውስተ ዕሙቅ
  english_pob_choice: into an abyss
  chosen_korean: 깊은 구렁
  alternatives_korean:
  - 깊은 심연
  - 무저갱
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 형벌의 공간을 가리키는 구체적 지형 이미지로 보아, 후대 교리적 용어인 ‘무저갱’보다 중립적인 ‘깊은 구렁’이 더 적합합니다.
- source_word: ምሉእ እሳት ወይላህብ
  english_pob_choice: full of fire and flaming
  chosen_korean: 불과 타오름으로 가득
  alternatives_korean:
  - 불과 불길로 가득
  - 불과 화염으로 가득
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 겹의 화염 이미지를 평행적으로 보존하되, ‘타오름’으로 두 번째 명사를 명사형으로 살려 반복된 격렬함을 유지했습니다.
- source_word: አዕማደ እሳት
  english_pob_choice: pillars of fire
  chosen_korean: 불의 기둥
  alternatives_korean:
  - 화염 기둥
  - 불기둥
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역에 가까운 복합 명사로 시각적 구조를 보존하면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: ‘before the stars’로 오해될 수 있는 구문을 시간 순서로 읽을지 여부
  chosen_reading: ‘먼저 별들에게 임하였고’로 옮겨, 심판의 첫 대상이라는 순서를 분명히 했습니다.
  alternative_readings:
  - ‘별들 앞에’
  - ‘별들 앞에서’
  rationale: 수정된 영어 POB와 최신 검토는 이 표현을 공간보다 순서의 표지로 보며, Animal Apocalypse의 서사 진행과도 일치합니다.
  doctrine_reference: Narrative sequence in the Animal Apocalypse; preserve source-informed syntax over surface ambiguity
- issue: 형벌 장소를 후대 기독교 용어로 동일시할지 여부
  chosen_reading: ‘깊은 구렁’과 화염 이미지를 유지하고, ‘지옥’ 같은 후대 정식 용어는 쓰지 않았습니다.
  alternative_readings:
  - ‘지옥’
  - ‘무저갱’
  rationale: 본문은 구체적 묘사를 제시할 뿐이므로, 후대 교리 용어로 평탄화하지 않고 원문의 환상적·심판적 이미지를 살렸습니다.
  doctrine_reference: 'Book context: do not flatten apocalyptic imagery or over-harmonize with later Christian usage'
