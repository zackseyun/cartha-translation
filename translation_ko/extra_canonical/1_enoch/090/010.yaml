base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
  footnotes:
  - marker: a
    text: The clause 'their eyes were opened' is bracketed because the supplied Ethiopic witness marks it as uncertain or textually unstable, though it fits a recurring motif in this vision cycle.
    reason: textual_variant
  - marker: b
    text: The final pronoun could also be rendered 'him' if the singular figure is understood as a personalized leader within the animal vision.
    reason: lexical_alternative
  - marker: c
    text: Or 'And I saw among them that [their eyes were opened], and it cried out to the sheep and said to them, “Look!” And all of them ran to it.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것이 그들을 바라보았고, [그들의 눈이 열렸으며,] 양들에게 소리쳤습니다. 숫양들이 그것을 보고 모두 그것에게로 달려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 눈이 열렸으며’라는 절은 제시된 게으즈 본문에서 대괄호로 표시되어 있어, 본문상 불확실한 구절로 번역에서도 대괄호 안에 유지했습니다.
    reason: textual_variant
  - marker: b
    text: 마지막 지시대상은 동물 상징의 표면을 따라 ‘그것’으로 옮겼습니다. 단수 대상이 인격화된 지도자를 가리킨다고 이해할 경우 ‘그에게로’로도 옮길 수 있습니다.
    reason: lexical_alternative
