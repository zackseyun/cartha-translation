base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
  footnotes:
  - marker: a
    text: The clause 'their eyes were opened' is bracketed because the supplied Ethiopic witness marks it as uncertain or textually unstable, though it fits a recurring motif in this vision cycle.
    reason: textual_variant
  - marker: b
    text: The final pronoun could also be rendered 'him' if the singular figure is understood as a personalized leader within the animal vision.
    reason: lexical_alternative
  - marker: c
    text: Or 'And I saw among them that [their eyes were opened], and it cried out to the sheep and said to them, “Look!” And all of them ran to it.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것이 그들을 바라보았고, [그들의 눈이 열렸으며,] 그것이 양들에게 소리치며 그들에게 말했습니다. 「보라!」 그러자 그들은 모두 그것에게로 달려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 제시된 게으즈 본문에서도 대괄호로 표시되어 있어, 번역에서도 불확실한 본문으로 표기했습니다.
    reason: textual_variant
  - marker: b
    text: 마지막 지시대사는 문맥상 ‘그것’으로 읽는 것이 자연스럽지만, 상징적 대상이 인격화된 지도자를 가리킨다고 보면 ‘그에게로’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእየ
  english_pob_choice: And it looked at them
  chosen_korean: 그것이 그들을 바라보았고
  alternatives_korean:
  - 그것이 그들을 보았고
  - 그것이 그들을 살폈고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서술 주체가 1인칭 ‘내가 보았다’가 아니라 3인칭 단수이므로, 비전 장면의 관찰 동작을 자연스럽게 살려 ‘바라보았고’로 옮겼습니다.
- source_word: ወተፈትሐ አዕይንቲሆሙ
  english_pob_choice: '[and their eyes were opened]'
  chosen_korean: '[그들의 눈이 열렸으며,]'
  alternatives_korean:
  - '[그들의 눈이 열렸고,]'
  - '[그들의 눈이 열렸습니다,]'
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 제시 본문에서 괄호로 처리된 불확실한 절이므로, 본문 안에 대괄호를 유지해 텍스트상 불안정성을 그대로 드러냈습니다.
- source_word: ወጸርኀ
  english_pob_choice: it cried out
  chosen_korean: 그것이 양들에게 소리치며
  alternatives_korean:
  - 그것이 양들에게 외치며
  - 그것이 양들에게 불러
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 강한 발화 동사를 살리되, 뒤따르는 직접화법과 자연스럽게 이어지도록 ‘소리치며’로 옮겼습니다.
- source_word: ርእይዎ
  english_pob_choice: Look!
  chosen_korean: 「보라!」
  alternatives_korean:
  - 「봐라!」
  - 「보십시오!」
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령형의 급박한 촉구를 살리기 위해 ‘보라’로 옮겼습니다. 비전 문맥의 직접 인용이므로 따옴표 안에 두었습니다.
- source_word: ወሮጹ ኵሎሙ ኀቤሁ
  english_pob_choice: And all of them ran to it
  chosen_korean: 그러자 그들은 모두 그것에게로 달려갔습니다
  alternatives_korean:
  - 그러자 그들 모두가 그것에게로 달려갔습니다
  - 그러자 그들은 모두 그에게로 달려갔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 신속한 움직임을 ‘달려갔습니다’로 살렸고, 지시 대상은 동물 상징의 표면을 유지해 ‘그것’으로 두었습니다.
theological_decisions:
- issue: 동물 상징 속 단수 지시대상의 인칭화 여부
  chosen_reading: 본문에서는 ‘그것’으로 유지해 상징적 표면을 보존했습니다.
  alternative_readings:
  - 그에게로
  - 그분에게로
  rationale: 『동물 비전』의 상징 구조를 성급히 인간 지칭으로 풀지 않고, 본문이 드러내는 긴장을 그대로 남겨 두는 것이 더 충실합니다.
  doctrine_reference: 상징 해석의 조기 확정 회피; 본문 수준의 의미 유지
