base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/018.yaml
  text: And I saw until the Lord of the sheep came to them, and he took in his hand the staff of wrath and struck the earth; and the earth split open, and all the beasts and all the birds of heaven fell away from among those sheep and sank into the earth, and it covered over them.
  footnotes:
  - marker: a
    text: Or 'the earth was cleft open.' The Ge'ez clause is difficult, but the following lines imply that the ground opens so that the beasts and birds descend into it.
    reason: lexical_alternative
  - marker: b
    text: The 'beasts' and 'birds of heaven' continue the symbolic cast of the Animal Apocalypse, representing hostile powers rather than ordinary animals alone.
    reason: cultural_note
  - marker: c
    text: Or 'the staff of his wrath'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 양들의 주인이 그들에게 오실 때까지 보았습니다. 그는 손에 진노의 막대기를 잡고 땅을 치셨습니다. 그러자 땅이 갈라졌고[a], 모든 들짐승과 모든 하늘의 새가[b] 그 양들 가운데서 떨어져 나와 땅속으로 빠져 들어갔으며, 땅이 그것들을 덮었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅이 갈라져 열렸다”로 옮길 수 있습니다. 게에즈어 구문은 다소 어렵지만, 이어지는 문맥은 땅이 열려 짐승들과 새가 그 안으로 내려감을 시사합니다.
    reason: alternative_reading
  - marker: b
    text: ‘들짐승’과 ‘하늘의 새’는 동물 묵시의 상징 체계 안에서 실제 동물만이 아니라 적대적 세력을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양 떼의 주인
  alternatives_korean:
  - 양들의 주님
  - 양의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 알레고리의 핵심인 ‘양 떼’ 이미지를 살리면서 እግዚአ의 지배 관계를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: በትር መዓተ
  english_pob_choice: the staff of wrath
  chosen_korean: 진노의 막대기
  alternatives_korean:
  - 진노의 지팡이
  - 노여움의 막대기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: መዓት은 단순한 감정적 분노보다 심판적 ‘진노’에 가깝고, በትር은 목자 도구이면서 징계 도구가 되므로 ‘막대기’를 택했습니다.
- source_word: ተሰጠተ ምድር
  english_pob_choice: the earth split open
  chosen_korean: 땅이 갈라졌고
  alternatives_korean:
  - 땅이 갈라졌으며
  - 땅이 찢어졌고
  - 땅이 벌어졌고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 뒤이어 짐승들과 새가 땅속으로 들어가므로, 단순한 흔들림보다 ‘갈라짐’이 서사의 전개를 가장 잘 드러냅니다.
- source_word: ወድቁ እም*ዝኩ፡ አባግዕ
  english_pob_choice: fell away from among those sheep
  chosen_korean: 그 양들 가운데서 … 떨어져 나와
  alternatives_korean:
  - 그 양들 사이에서 … 떨어져
  - 그 양들로부터 … 떨어져
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 낙하보다 집단에서의 분리를 나타내므로, ‘떨어져 나와’로 관계적 분리를 드러냈습니다.
theological_decisions:
- issue: 알레고리적 동물 이미지의 보존
  chosen_reading: 양 떼, 들짐승, 하늘의 새를 문자적 동물명으로 두되, 상징성을 한국어 본문에서 약화시키지 않습니다.
  alternative_readings:
  - 해석을 덧붙여 상징적 세력으로 풀어 쓰기
  - 더 전통적인 교회어로 일반화하기
  rationale: 이 장은 동물 묵시의 상징 체계를 유지해야 하므로, 본문은 직역에 가깝게 두고 상징 해석은 주석층에 맡기는 편이 원문 의도를 더 잘 보존합니다.
  doctrine_reference: 본문-주석 분리 원칙, 묵시문학의 상징 보존
- issue: 진노 표현의 강도 유지
  chosen_reading: ‘진노의 막대기’
  alternative_readings:
  - ‘분노의 막대기’
  - ‘노여움의 지팡이’
  rationale: መዓት은 단순 감정보다 심판 행위를 수반하는 격한 진노를 뜻하므로, 신학적 긴장을 약화시키지 않기 위해 ‘진노’를 유지했습니다.
  doctrine_reference: 심판-진노 어휘의 보존
