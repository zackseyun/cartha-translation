  terminology: ‘양들의 주인’, ‘진노의 막대기’, ‘들짐승’, ‘하늘의 새’는 알레고리와 심판 어휘를 잘 유지합니다. ‘양들의 주인’은 원문의 지배 관계를 보존하면서도 특정 교파적 해석을 덧붙이지 않습니다.
