base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/014.yaml
  text: And I saw until that man came[a], the one who had written down the names of the shepherds, and he brought them up before the Lord of the sheep; and he helped him and rescued him[c][b], and he showed him everything concerning the downfall of his helper.
  footnotes:
  - marker: a
    text: The final clause is difficult in the Ethiopic as transmitted here. It may mean that the sheep was shown everything concerning the descent or intervention of its helper.
    reason: textual_variant
  - marker: b
    text: The 'man who had written down the names of the shepherds' is the heavenly recorder figure already active in this vision's judgment scene.
    reason: cross_reference
  - marker: c
    text: Or 'and he helped that sheep and rescued it, and he showed it everything, that its helper had come down for this purpose.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 그 사람이 올 때까지 보았습니다. 그는 목자들의 이름을 기록해 둔 사람이었습니다. 그는 그 이름들을 양들의 주님 앞에 올려놓았습니다. 또 그는 그 숫양을 도와 구해 주었으며, 그 숫양에게 그의 돕는 이의 모든 내려옴을 보여 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절은 전승된 에티오피아어 본문에서 난해합니다. ‘그의 돕는 이의 모든 내려옴’은 그 돕는 이가 내려온 일 전체를 뜻할 수도 있고, 그 내려옴과 관련된 모든 일을 뜻할 수도 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ብእሲ
  english_pob_choice: that man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 인물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본적으로 남성 인간을 가리키는 말이므로, 환상적 맥락의 해석을 앞서지 않으면서도 한국어에서는 자연스럽고 중립적인 ‘그 사람’으로 옮겼습니다.
- source_word: ዘጸሐፈ አስማቲሆሙ
  english_pob_choice: who had written down their names
  chosen_korean: 이름을 기록해 둔 자
  alternatives_korean:
  - 이름을 적어 둔 자
  - 이름을 기록한 자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 ‘쓰기’보다 공적·문서적 뉘앙스가 살아 있는 ‘기록하다’를 택해, 심판 장면의 서기관적 기능을 살렸습니다.
- source_word: ለእግዚአ አባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주님
  alternatives_korean:
  - 양들의 주인
  - 양들의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 알레고리 안에서 하나님을 가리키는 핵심 호칭이므로, 위격적 존칭을 살리는 ‘주님’을 택했습니다.
- source_word: ያዐርግ ቅድሜሁ
  english_pob_choice: brought them up before him
  chosen_korean: 올려놓았습니다
  alternatives_korean:
  - 끌어올려 그 앞에 세웠습니다
  - 그 앞에 올렸습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 ‘올려’라는 상승 이미지는 유지하되, 법정적 제시라는 기능을 한국어에서 매끄럽게 드러내기 위해 간결하게 다듬었습니다.
- source_word: ኵሎ መራደ
  english_pob_choice: everything concerning the downfall
  chosen_korean: 모든 내림
  alternatives_korean:
  - 모든 내려옴
  - 그의 돕는 이의 내려옴
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 난해한 어구를 과도하게 해석하지 않고, 아래로 내려감이라는 기본 의미를 보존했습니다. 영어 POB의 ‘downfall’은 해석적 확장으로 보아 한국어 본문은 더 원문 가까운 표현을 유지했습니다.
theological_decisions:
- issue: ‘Lord of the sheep’의 신적 호칭 처리
  chosen_reading: ‘양들의 주님’으로 본문에 반영했습니다.
  alternative_readings:
  - ‘양들의 주인’
  - ‘양들의 주’
  rationale: 이 표현은 우화적 인물 호칭을 넘어 하나님을 지칭하는 기능을 가지므로, 한국어에서도 경배적·신학적 무게를 지닌 ‘주님’을 유지했습니다.
  doctrine_reference: 알레고리 속 신적 호칭 보존
