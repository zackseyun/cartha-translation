  naturalness: 초안의 첫 문장 ‘그 사람이 올 때까지였습니다’는 문장으로 부자연스럽습니다. ‘나는 그 사람이 올 때까지 보았습니다’로 고치고, 지시 대상이 불분명한 대명사는 ‘그 숫양’으로 밝혀 현대 한국어의 명료성을 확보했습니다.
  terminology: ‘그 사람’, ‘목자들’, ‘양들의 주님’은 적절합니다. ‘돕는 이’는 원문의 도움 주는 자라는 표현을 해석적으로 특정하지 않아 유지할 수 있습니다. ‘숫양’은 ይቤላ의 어휘적 의미를 반영하는 필수 수정입니다.
  issues:
