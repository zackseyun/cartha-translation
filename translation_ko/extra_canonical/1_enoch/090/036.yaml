base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/036.yaml
  text: And I saw that that house became great and broad and exceedingly full[a][b][c].
  footnotes:
  - marker: a
    text: In the Animal Apocalypse, 'house' may refer symbolically to the sanctuary or temple, but the Ge'ez text here itself reads simply 'house.'
    reason: cross_reference
  - marker: b
    text: The final term can also suggest 'plenty,' 'increase,' or 'overflow'; the exact nuance is uncertain, but it clearly conveys superabundance.
    reason: lexical_alternative
  - marker: c
    text: Or 'and it was full of abundance.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 그 집이 크고 넓어지고, 심히 가득 찬 것을 보았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 동물 묵시록의 문맥에서는 이 '집'이 성전이나 성소를 상징할 수 있지만, Ge'ez 본문 자체는 단순히 '집'이라고 말합니다.
    reason: cross_reference
  - marker: b
    text: 끝의 표현은 '가득 차다' 외에도 '풍성하다', '증가하다', '넘쳐나다'의 뉘앙스를 가질 수 있으나, 여기서는 분명한 과잉과 충만을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 곧 '심히 가득 찬'이라는 뜻으로도 옮길 수 있습니다.
    reason: previous_rendering
