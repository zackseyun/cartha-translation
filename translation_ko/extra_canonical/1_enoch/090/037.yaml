base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/037.yaml
  text: And I saw that a white bull was born[a], and its horns were great[c][b]; and all the beasts of the field and all the birds of heaven feared it and entreated it at all times.
  footnotes:
  - marker: a
    text: The verb rendered 'sought its favor' can also be understood more strongly as 'made supplication to it' or 'petitioned it.'
    reason: lexical_alternative
  - marker: b
    text: The white bull is presented here as a symbolic figure within the Animal Apocalypse; the translation preserves the image rather than identifying it in the main text.
    reason: cultural_note
  - marker: c
    text: Or 'sought its favor'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 흰 수소 한 마리가 태어난 것을 보았습니다[a][b]. 그 뿔은 컸습니다. 모든 들짐승과 하늘의 모든 새가 언제나 그것을 두려워하고 그것에게 간청하였습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘태어나다’는 단순 출현보다 출생의 이미지를 더 직접적으로 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 흰 수소는 이 시현에서 상징적 형상으로 제시되므로, 본문에서는 그 상징을 해석하지 않고 이미지를 그대로 유지합니다.
    reason: cultural_note
  - marker: c
    text: 에티오피아어 동사는 단순한 ‘찾다’보다 강한 ‘간청하다’, ‘탄원하다’의 뜻을 가집니다.
    reason: lexical_alternative
