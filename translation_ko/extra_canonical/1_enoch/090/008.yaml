base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/008.yaml
  text: And I saw in the vision that ravens flew down upon those lambs[b][a], and they seized one of those lambs and dashed the sheep to pieces and devoured them.
  footnotes:
  - marker: a
    text: The Ethiopic distinguishes the attacked flock members with terms that may overlap between 'lambs' and 'sheep'; the English keeps 'lambs' for the first group and 'sheep' later to reflect the shift in wording.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'flew down upon' could also be understood more generally as 'rushed upon' or 'came upon,' but the bird imagery favors an explicitly avian movement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 환상 가운데서 까마귀들이 그 어린 양들 위로 날아내려오는 것을 보았습니다. 그들은 그 어린 양들 가운데 하나를 붙잡고, 양 떼를 산산이 부수고는 그들을 잡아먹었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 본문은 첫 집단과 뒤의 집단을 서로 다른 어휘로 구분합니다. 한국어도 ‘어린 양들’과 ‘양 떼’로 나누어 그 차이를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘날아내려오는’은 새의 공격적 하강을 살린 표현이며, 보다 일반적으로는 ‘달려드는’ 또는 ‘덮쳐오는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
