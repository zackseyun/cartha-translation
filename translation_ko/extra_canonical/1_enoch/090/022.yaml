base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/022.yaml
  text: And he said to that man who was writing before him[a], who was one of those seven white ones, and he said to him, “Take those seventy shepherds to whom I delivered the sheep; and they, taking them[c][b], killed many more than I commanded them.”
  footnotes:
  - marker: a
    text: Or 'I entrusted the sheep to them.' The verb can emphasize handing over into another's charge.
    reason: lexical_alternative
  - marker: b
    text: The wording implies that the shepherds went beyond the limit of what had been commanded to them.
    reason: alternative_reading
  - marker: c
    text: Or 'And he said to that man who was writing before him—one of those seven white ones—“Take'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 자기 앞에서 글을 쓰고 있던 그 사람, 곧 그 일곱 흰 존재들 가운데 하나인 사람에게 말씀하셨습니다. 그리고 그에게 말씀하셨습니다. “내가 양들을 그들에게 맡긴 그 일흔 목자들을 데려오십시오. 그들은 양들을 붙잡아, 내가 그들에게 명한 것보다 더 많은 양을 죽였습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내가 양들을 그들에게 맡긴’은 ‘내가 양들을 그들에게 넘겨준’으로도 옮길 수 있습니다. 동사는 양들을 다른 이들의 책임 아래에 두는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 목자들이 자신들에게 명해진 범위를 넘어 더 많은 양을 죽였음을 나타냅니다.
    reason: alternative_reading
  - marker: c
    text: 원문은 글을 쓰던 사람을 ‘그 일곱 흰 존재들 가운데 하나’라고 설명한 뒤, 그에게 다시 말씀하셨다고 서술합니다. 이 반복은 원문의 재개 표현을 반영합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ብእሲ
  english_pob_choice: man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 존재
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시 대상은 환상 속 천상 서기이므로, 한국어에서는 성별을 드러내는 ‘남자’보다 인물 지칭이 자연스러운 ‘그 사람’이 문맥에 맞습니다.
- source_word: ዘይጽሕፍ
  english_pob_choice: who was writing
  chosen_korean: 글을 쓰고 있던
  alternatives_korean:
  - 기록하고 있던
  - 쓰고 있던
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 현재 진행 중이던 과거 동작을 나타내므로 ‘글을 쓰고 있던’이 환상 서술의 장면감을 살립니다.
- source_word: ፯እምነ ዝኩ ፯ጻዕዳው
  english_pob_choice: one of those seven white ones
  chosen_korean: 그 일곱 흰빛의 존재들 가운데 하나인
  alternatives_korean:
  - 그 일곱 흰 자들 가운데 하나인
  - 그 일곱 흰 자들 중 하나인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘흰빛의 존재들’은 단순한 외형 묘사보다 환상적·상징적 색채를 보존하면서, 인물군의 초월적 성격을 한국어로 자연스럽게 드러냅니다.
- source_word: ንሥኦሙ
  english_pob_choice: Take
  chosen_korean: 잡아오십시오
  alternatives_korean:
  - 데려오십시오
  - 붙잡으십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 명령은 단순한 ‘가지다’가 아니라 심판 장면에서 대상을 붙들어 데려오는 뉘앙스를 가지므로, 본문 상황을 살리는 ‘잡아오십시오’를 택했습니다.
- source_word: መጠውክዎሙ አባግዐተ
  english_pob_choice: I delivered the sheep
  chosen_korean: 내가 양들을 넘겨준
  alternatives_korean:
  - 내가 양들을 맡긴
  - 내가 양들을 인도한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 다른 이의 관리 아래로 넘겨주는 법정적·위임적 성격을 띠므로, ‘넘겨준’이 ‘맡긴’보다 책임 이전의 뉘앙스를 더 분명히 드러냅니다.
- source_word: ነሢኦሙ ቀተሉ
  english_pob_choice: taking them, killed
  chosen_korean: 양들을 잡고는 … 죽였습니다
  alternatives_korean:
  - 붙잡고는 … 죽였습니다
  - 잡아서는 … 죽였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 분사 뒤 동사의 연쇄를 한국어에서 자연스럽게 풀어, 취한 뒤 살해한 행동의 순서를 보존했습니다.
- source_word: ብዙኃነ እምዘ አዘዝክዎሙ
  english_pob_choice: many more than I commanded them
  chosen_korean: 내가 그들에게 명한 것보다 훨씬 더 많은 자들을
  alternatives_korean:
  - 내가 그들에게 명한 것보다 훨씬 많이
  - 내가 그들에게 명한 것보다 더 많은 자들을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문은 명령의 범위를 넘어선 과잉 살해를 말하므로, ‘훨씬 더 많은 자들’로 그 초과성을 분명하게 옮겼습니다.
