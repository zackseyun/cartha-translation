  chosen_reading: 본문의 상징적 호칭을 그대로 살려, 본문 안에서 해석어를 덧붙이지 않았습니다.
  alternative_readings:
  - 일흔 감독들
  - 일흔 통치자들
  rationale: 『동물 묵시』의 은유를 평이한 직설로 바꾸면 환상 서술의 효과가 약해지므로, 상징을 유지하는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 묵시적 상징을 본문 수준에서 보존
