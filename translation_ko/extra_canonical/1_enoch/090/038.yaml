  text: And I saw until all their kinds were transformed[a], and they all became white cattle; and the first among them became a wild ox, and that wild ox became a great beast[d][c][b], and it had great black horns on its head.
  footnotes:
  - marker: a
    text: The repeated Ge'ez word ነገር can also mean 'thing' or 'matter.' The line is textually difficult; the main text keeps the more literal 'word' to preserve the ambiguity.
    reason: lexical_alternative
  - marker: b
    text: The final phrase appears incomplete in the supplied witness or runs directly into the next clause. The ellipsis marks that the surviving OCR line does not yield a fully closed English sentence by itself.
    reason: textual_variant
  - marker: c
    text: Or 'became a word, and that word became'.
    reason: previous_rendering
  - marker: d
    text: Or 'and it had…'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 그들의 모든 종류가 변형되는 것을 보았습니다[a]. 그들은 모두 흰 가축이 되었고, 그들 가운데 첫째는 들소가 되었으며, 그 들소는 머리에 큰 검은 뿔들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 ነገር은 이 대목에서 전승상 난해한 어휘이며, 영어 POB는 본문 난점을 보존하기 위해 “word”를 두었습니다. 그러나 본문 교정 검토는 동물 상징의 흐름에 따라 “들소”로 복원하는 쪽이 더 타당하다고 보았습니다.
    reason: textual_variant
