  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상적 변모를 가리키는 동사로 읽어 “변형되다”를 택해, 단순한 변경이나 출생이 아니라 형상 변화라는 의미를 살렸습니다.
- source_word: አዝማዲሆሙ
  english_pob_choice: their kinds
  chosen_korean: 그들의 모든 종류
  alternatives_korean:
  - 그들의 종류
  - 그들의 품종
  - 그들의 갈래
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동물 환상 속 분류를 나타내므로 “종류”가 자연스럽고, “모든”을 덧붙여 전체적 변화를 분명히 했습니다.
- source_word: አልህምተ ጻዕዳ
  english_pob_choice: white cattle
  chosen_korean: 흰 가축
  alternatives_korean:
  - 흰 소떼
  - 흰 소들
  - 흰 우양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 집합적 소의 이미지를 살리면서도 암수나 연령을 좁히지 않기 위해 “가축”을 선택했습니다.
- source_word: አርዌ ዐቢየ
  english_pob_choice: a great beast
  chosen_korean: 들소
  alternatives_korean:
  - 큰 짐승
  - 거대한 들짐승
  - 큰 야생동물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 본문이 앞선 개정에서 “wild ox”로 바로잡힌 점을 반영해, 본래 환상 동물의 흐름에 맞는 “들소”로 옮겼습니다.
- source_word: ቦ
  english_pob_choice: and it had…
  chosen_korean: 있었습니다
  alternatives_korean:
  - 가지고 있었습니다
  - 달려 있었습니다
  - …
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 절의 끝이 본문 전승상 연결되는 짧은 문구이므로, 완결된 한국어로 풀되 뒤의 뿔 묘사와 자연스럽게 이어지도록 했습니다.
theological_decisions:
- issue: 본문의 textually difficult ነገር를 어떻게 처리할 것인가
  chosen_reading: 아드지우디케이터의 정정에 따라 ‘word’ 계열의 오역을 따르지 않고, 동물 환상 맥락에 맞는 ‘들소’로 반영했습니다.
  alternative_readings:
  - 단어
  - 말
  - 사물
  rationale: 이 구절은 본래의 동물 상징 체계가 핵심이므로, 전승상 어긋난 ‘word’ 직역을 유지하면 저자의 의도를 오히려 훼손합니다. 따라서 교정된 원문 이해를 따라 zoomorphic code를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 절이 뿔 묘사로 이어지는 미완성 감각을 어떻게 드러낼 것인가
  chosen_reading: 끝을 자연스럽게 마무리하되, 본문이 완결된 환시 묘사로 읽히도록 했습니다.
  alternative_readings:
  - 말줄임표로 미완성 표시
  - 불완전한 문장 유지
  rationale: 최신 검토가 OCR 절단을 확인하고 뿔 묘사를 복원했으므로, 한국어 본문도 복원된 완결형으로 제시하는 것이 더 충실합니다.
  doctrine_reference: Translation philosophy §§1, 5
