translation:
  language: ko
  text: 그리고 저는 그 양들이 타고 있는 것을 보았으며[a], 그들의 뼈도 타고 있는 것을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어는 양과 그 뼈에 대하여 모두 ‘타고 있다’에 해당하는 동사를 반복하여 환상의 심각성을 강조합니다. 한국어 번역도 이 반복을 유지했습니다.
    reason: lexical_alternative
