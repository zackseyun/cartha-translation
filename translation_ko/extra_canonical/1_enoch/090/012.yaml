- source_word: ያእትቱ ቀርኖ
  english_pob_choice: to remove his horn
  chosen_korean: 그의 뿔을 제거하려고 했으나
  alternatives_korean:
  - 그의 뿔을 빼앗으려고 했으나
  - 그의 뿔을 없애려고 했으나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기존 POB의 ‘remove’ 판단을 따라, 상징을 풀어 쓰지 않고 ‘뿔’을 문자적으로 유지하되 동작은 ‘제거하다’로 옮겼습니다.
- source_word: አእህሉዎ
  english_pob_choice: they did not prevail against him
  chosen_korean: 그를 이기지 못했습니다
  alternatives_korean:
  - 그를 극복하지 못했습니다
  - 그에게 이기지 못했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결말은 공격의 실패를 말하므로, 문맥상 가장 자연스럽고 힘 있는 결과 표현인 ‘이기지 못하다’로 옮겼습니다.
theological_decisions:
- issue: ‘뿔’ 이미지를 해석어로 바꾸지 않을지
  chosen_reading: 상징어 ‘뿔’을 그대로 유지합니다.
  alternative_readings:
  - 권세
  - 힘
  - 통치
  rationale: 동물 환상은 상징을 통해 의미를 드러내므로, 번역문에서 상징을 미리 해석해 버리면 본문의 시각적 긴장이 약해집니다.
  doctrine_reference: '번역 원칙: 묵시 문학의 상징을 보존하고, 본문이 직접 말하지 않는 해석을 본문에 덧붙이지 않습니다.'
