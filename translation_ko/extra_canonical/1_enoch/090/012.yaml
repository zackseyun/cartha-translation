base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
  footnotes:
  - marker: a
    text: Or 'against him' for 'with him'; the Ge'ez preposition is literally 'with,' but the context is hostile conflict.
    reason: lexical_alternative
  - marker: b
    text: '''Horn'' is kept literally as part of the vision''s symbolic imagery, rather than rendered interpretively as ''power'' or ''strength.'''
    reason: cultural_note
  - marker: c
    text: Or 'to lay low'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 까마귀들은 그와 싸우고 전투를 벌였으며, 그의 뿔을 제거하려고 했으나 그를 이기지 못했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘with him’은 문자적으로는 ‘그와 함께’이지만, 문맥상 적대적 충돌을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔’은 상징적 이미지를 문자 그대로 살린 것입니다.
    reason: cultural_note
  - marker: c
    text: ‘remove’는 여기서 ‘끌어내리다’보다 ‘제거하다/없애다’에 가깝습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: እልኩ
  english_pob_choice: those ravens
  chosen_korean: 그 까마귀들
  alternatives_korean:
  - 그 까마귀 무리
  - 그 새들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 동물 환상에서 종을 구체적으로 살리기 위해 일반적인 ‘새들’보다 ‘까마귀들’이 적절합니다.
- source_word: ቋዓት
  english_pob_choice: fought
  chosen_korean: 싸우고
  alternatives_korean:
  - 전쟁을 하고
  - 공격하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접적인 충돌을 가리키는 동사로, 한국어에서 자연스럽고 간결한 ‘싸우다’가 맞습니다.
- source_word: ይትጋደሉ
  english_pob_choice: battled
  chosen_korean: 전투를 벌였으며
  alternatives_korean:
  - 격돌하며
  - 치열하게 다투며
  lexicon: Dillmann, Lexicon Aethiopicae
  rationale: 앞선 ‘싸우다’와 중복되지만, 반복·강조 효과를 살리기 위해 더 강한 전투 표현을 별도로 두었습니다.
- source_word: ያእትቱ ቀርኖ
  english_pob_choice: to remove his horn
  chosen_korean: 그의 뿔을 제거하려고 했으나
  alternatives_korean:
  - 그의 뿔을 빼앗으려고 했으나
  - 그의 뿔을 없애려고 했으나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기존 POB의 ‘remove’ 판단을 따라, 상징을 풀어 쓰지 않고 ‘뿔’을 문자적으로 유지하되 동작은 ‘제거하다’로 옮겼습니다.
- source_word: አእህሉዎ
  english_pob_choice: they did not prevail against him
  chosen_korean: 그를 이기지 못했습니다
  alternatives_korean:
  - 그를 극복하지 못했습니다
  - 그에게 이기지 못했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결말은 공격의 실패를 말하므로, 문맥상 가장 자연스럽고 힘 있는 결과 표현인 ‘이기지 못하다’로 옮겼습니다.
theological_decisions:
- issue: ‘뿔’ 이미지를 해석어로 바꾸지 않을지
  chosen_reading: 상징어 ‘뿔’을 그대로 유지합니다.
  alternative_readings:
  - 권세
  - 힘
  - 통치
  rationale: 동물 환상은 상징을 통해 의미를 드러내므로, 번역문에서 상징을 미리 해석해 버리면 본문의 시각적 긴장이 약해집니다.
  doctrine_reference: '번역 원칙: 묵시 문학의 상징을 보존하고, 본문이 직접 말하지 않는 해석을 본문에 덧붙이지 않습니다.'
