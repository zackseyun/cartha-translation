base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
  footnotes:
  - marker: a
    text: Or 'against him' for 'with him'; the Ge'ez preposition is literally 'with,' but the context is hostile conflict.
    reason: lexical_alternative
  - marker: b
    text: '''Horn'' is kept literally as part of the vision''s symbolic imagery, rather than rendered interpretively as ''power'' or ''strength.'''
    reason: cultural_note
  - marker: c
    text: Or 'to lay low'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 까마귀들은 그와[a] 싸우고 맞서 싸웠으며, 그의 뿔[b]을 빼앗으려 했으나[c] 그를 이기지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그와’는 문자적으로는 ‘그와 함께’이지만, 이 문맥에서는 적대적으로 맞서는 관계를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뿔’은 환상의 상징적 이미지를 해석하지 않고 문자 그대로 옮긴 것입니다.
    reason: cultural_note
  - marker: c
    text: 직역하면 ‘그의 뿔을 제거하다/없애다’입니다. 여기서는 뿔을 빼앗으려는 시도를 가리킵니다.
    reason: previous_rendering
