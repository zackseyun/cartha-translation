base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/013.yaml
  text: And I saw until the shepherds and the eagles and the vultures and the kites came[a], and they cried out to the ravens to break the horn of that ram; and they fought and battled with him, and he fought with them[c][b], and cried out that his help might come.
  footnotes:
  - marker: a
    text: Or 'that he-goat.' The Ge'ez term denotes a horned male goat.
    reason: lexical_alternative
  - marker: b
    text: Or 'that his helper might come.' The noun can be understood as 'help' or 'helper.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the eagles and the kites and the ravens came, and they cried out to the ravens that they should break the horn of that buck'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 목자들과 독수리들과 대머리수리들과 솔개들이 올 때까지 보았습니다. 그들은 그 숫양[a]의 뿔을 부러뜨리라고 까마귀들에게 외쳤습니다. 그들은 그와 다투고 싸웠으며, 그도 그들과 싸웠고, 자기의 도움이 오기를 외쳤습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 수염소’. 게에즈 용어는 뿔이 있는 수염소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘자기를 돕는 이가 오기를’. 이 명사는 ‘도움’ 또는 ‘돕는 이’로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  english_pob_choice: the shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 양치기들
  - 목자들(지도자들)
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹의 동물 묵시에서는 정해진 감시자·관리자 이미지를 살리기 위해 일반화된 표현보다 '목자들'이 가장 직접적입니다.
- source_word: አንስርት
  english_pob_choice: the eagles
  chosen_korean: 독수리들
  alternatives_korean:
  - 매들
  - 독수리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 항목은 포식성 큰 새를 가리키므로, 문맥상 가장 자연스럽고 기존 묵시적 이미지도 유지하는 '독수리들'로 옮겼습니다.
- source_word: አውስት / ሀባይ
  english_pob_choice: the vultures and the kites
  chosen_korean: 독수리들과 솔개들
  alternatives_korean:
  - 독수리들과 독수리류의 새들
  - 독수리들과 매들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 본문은 `아우스트`와 `하바이`를 함께 두어 두 종류의 맹금류를 구분합니다. 한국어에서는 둘 다 포식성 새라는 점을 살리되, 확정이 어려운 종은 '솔개들'로 처리했습니다.
- source_word: ቋዓት
  english_pob_choice: the ravens
  chosen_korean: 까마귀들
  alternatives_korean:
  - 큰까마귀들
  - 까마귀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단어는 까마귀류를 가리키므로, 어두운 묵시적 색채를 유지하는 '까마귀들'이 적절합니다.
- source_word: ይቤላ
  english_pob_choice: that ram
  chosen_korean: 그 숫양
  alternatives_korean:
  - 그 염소
  - 그 수염소
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영문 POB가 본문에서는 'ram'을 택하고 각주에서 'he-goat' 가능성을 제시하므로, 본문은 숫양으로 두고 대체 가능성은 주석 취지에 맡겼습니다.
- source_word: ይቀትቅጥዎ
  english_pob_choice: should break
  chosen_korean: 부러뜨리라고
  alternatives_korean:
  - 꺾으라고
  - 산산이 부수라고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 핵심은 폭력적 파괴이지만, 한국어 본문에서는 가장 간명한 명령형 간접화법 '부러뜨리라고'가 원문 의미를 충분히 전달합니다.
- source_word: ረዳኢቱ
  english_pob_choice: his help
  chosen_korean: 자기의 도움이
  alternatives_korean:
  - 자기의 도우심이
  - 그를 돕는 자가
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 명사는 '도움/원조'와 '돕는 자' 둘 다 가능하므로, 본문은 중립적으로 '도움'을 택해 긴장을 유지했습니다.
theological_decisions:
- issue: 동물 묵시의 상징을 본문에서 해석할지 여부
  chosen_reading: 상징적 동물 이미지를 그대로 유지하고 인간 정치세력으로 풀어쓰지 않았습니다.
  alternative_readings:
  - 해당 동물들을 역사적 인물이나 세력으로 본문 안에 풀어쓰기
  - 현대 독자 친화적으로 인간 적대 세력으로 일반화하기
  rationale: 이 본문은 상징적 비전을 통해 말하므로, 번역은 해석을 앞서지 않고 동물 이미지 자체를 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic imagery and theological tension.'
- issue: '`ረዳኢቱ`의 의미를 ''도움''과 ''돕는 자'' 중 어떻게 처리할지'
  chosen_reading: 본문은 '도움'으로 두고, 개인적 조력자 가능성은 각주로만 열어 두었습니다.
  alternative_readings:
  - 자기의 돕는 자가 오기를
  - 자기의 원조가 오기를
  rationale: 게에즈 명사의 의미 폭을 본문에서 한쪽으로 닫지 않기 위해, 가장 중립적인 '도움'을 선택했습니다.
  doctrine_reference: Lexical tension preserved; do not collapse ambiguity.
