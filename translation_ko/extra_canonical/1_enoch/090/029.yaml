- source_word: እንተ ትጠብለለት
  english_pob_choice: which had been folded up
  chosen_korean: 접혀 있었습니다
  alternatives_korean:
  - 말려 있었습니다
  - 둘둘 말려 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동작의 구체성이 분명하지 않아 ‘무너졌다’처럼 해석하지 않고, 접히거나 말린 상태를 나타내는 가장 절제된 표현을 택했습니다.
