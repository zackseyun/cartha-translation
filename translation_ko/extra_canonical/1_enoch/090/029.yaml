  rationale: 원어는 문자 그대로 ‘집’이므로, 비전의 상징성을 유지하기 위해 해석어인 ‘성전’으로 앞질러 풀지 않고 ‘집’으로 보존했습니다.
- source_word: ዓቢይ ... ልዑል
  english_pob_choice: greater and loftier
  chosen_korean: 더 크고 더 높았으며
