  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문이 문자적으로 ‘잠’에 해당하므로 꿈으로 과도하게 한정하지 않고, 비전 상황에 맞게 자연스러운 한국어로 풀었습니다.
- source_word: ኖላዊ ዘይርዕዮሙ
