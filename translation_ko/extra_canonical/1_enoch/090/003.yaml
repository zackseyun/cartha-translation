  - 양들을 목양하는 그 목자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘목자’는 상징을 유지하고, 동사의 관리·인도 의미를 살려 ‘보살피고 있는’으로 옮겼습니다. 과도하게 교회 직분어로 굳히지 않았습니다.
