- source_word: ይትበልዑ ሥጋሆሙ እምነ አዕዋፍ
  english_pob_choice: was being devoured by the birds
  chosen_korean: 새들에게 자기들의 살이 먹히고 있었기 때문에
  alternatives_korean:
  - 새들에게 자기들의 살이 삼켜지고 있었기 때문에
  - 새들에게 자기들의 몸이 먹히고 있었기 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘살’은 원문의 ሥጋ를 직접 살리며, ‘먹히다’는 포식적 폭력을, ‘새들에게’는 행위 주체를 보존합니다.
- source_word: በንዋምየ
  english_pob_choice: in my sleep
  chosen_korean: 잠든 상태에서
  alternatives_korean:
