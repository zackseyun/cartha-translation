base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/003.yaml
  text: And the sheep cried out because their flesh was being devoured by the birds[b][a], and I looked and lamented in my sleep over that shepherd who was shepherding the sheep.
  footnotes:
  - marker: a
    text: Or 'I watched and wailed in my sleep.' The seer's response verb can be rendered with varying degrees of audible grief.
    reason: lexical_alternative
  - marker: b
    text: The text says 'birds,' without specifying 'birds of prey,' though the predatory sense is implied by the devouring imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 양들은 그들의 살이 새들에게 먹히고 있었기 때문에 소리쳤습니다[b]. 나는 잠든 가운데 양들을 치고 있는 그 목자를 보며 탄식하였습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바라보며 울부짖었습니다’로도 옮길 수 있습니다. 시현자의 반응 동사는 소리 내는 슬픔의 정도를 다르게 드러낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 단순히 ‘새들’이라고 하며, 반드시 ‘맹금류’라고 특정하지는 않습니다. 다만 먹어 치우는 이미지가 포식적 의미를 강하게 암시합니다.
    reason: lexical_alternative
