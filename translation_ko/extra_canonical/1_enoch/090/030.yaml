base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/030.yaml
  text: And I saw all the sheep that were left[a], and every beast that was upon the earth, and all the birds of heaven, falling down and bowing to those sheep, and making petition to them[b], and obeying them in every word.
  footnotes:
  - marker: a
    text: The verb translated 'obeying' is literally 'hearing.' In this context of prostration and petition, it likely carries the sense of heeding or obeying.
    reason: lexical_alternative
  - marker: b
    text: Or 'And I saw all the sheep that were left, and every beast that was upon the earth, and all the birds of heaven, falling down and bowing'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 남아 있던 모든 양을 보았습니다. 또 땅 위의 모든 짐승과 하늘의 모든 새가 그 양들에게 엎드려 절하고, 그들에게 간청하며, 그들의 모든 말을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 모든 말을 들었다’입니다. 엎드려 절하고 간청하는 문맥에서는 ‘귀 기울여 따르다’ 또는 ‘순종하다’라는 뜻일 수도 있습니다.
    reason: lexical_alternative
