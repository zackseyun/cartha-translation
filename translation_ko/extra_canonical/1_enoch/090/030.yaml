theological_decisions:
- issue: 짐승과 새의 행위를 ‘예배’로 번역할지 여부
  chosen_reading: ‘엎드려 절하고 … 간청하며 … 듣는’으로 옮겨, 정치적·종말론적 복종의 장면으로 유지했습니다.
  alternative_readings:
  - ‘예배하고’로 번역
  - ‘존경을 표하며’로 번역
  rationale: 대상은 하나님이 아니라 높임을 받은 양들이므로, ‘예배’로 단정하기보다 본문이 보여 주는 몸의 복종과 청원을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 기호적 동물 비유의 긴장을 해소하지 않고 유지합니다.
