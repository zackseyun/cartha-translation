translation:
  language: ko
  text: 보십시오[a], 흰 양들 가운데서 어린 양들이 태어났고, 그들의 눈이 열리기 시작하여 보게 되었으며[b], 양들에게 소리쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「이 흰 양들 가운데서」로도 볼 수 있습니다. 지시어가 근접적 의미인지 원거리적 의미인지에 따라 달라집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「그리고 그들이 외쳤습니다」. 게에즈 동사의 인과·연쇄를 어떻게 살릴지에 따른 번역 차이입니다.
    reason: previous_rendering
