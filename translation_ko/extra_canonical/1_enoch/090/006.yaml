translation:
  language: ko
  text: 보십시오[a], 그 흰 양들에게서 어린 양들이 태어났고, 그들의 눈이 열리기 시작했고, 그들은 보기 시작했으며, 양들에게 외치기 시작했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「이 흰 양들에게서」. 지시어를 근접적으로 이해할 경우입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 「양들에게 외쳤습니다」. 앞선 「시작했다」가 이 동사에도 미친다는 연쇄를 어떻게 한국어로 드러내는지에 따른 번역 차이입니다.
    reason: previous_rendering
