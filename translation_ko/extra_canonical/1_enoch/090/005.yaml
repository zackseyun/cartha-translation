  alternatives_korean:
  - 각자의 때에
  - 그들의 각 때에
  - 그들 각자의 때마다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 분배적 반복을 살리면서도 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: ፶ወ፰ጊዜያተ
  english_pob_choice: fifty-eight times
  chosen_korean: 여든여덟 번
  alternatives_korean:
  - 쉰여덟 번
  - 쉰여덟 시기
  - 여든여덟 번
  lexicon: Ge'ez numeral system
  rationale: 게에즈 수사가 ፶(50)+፰(8)로 읽히므로, 의미를 정확히 반영하기 위해 ‘쉰여덟 번’으로 옮깁니다. 한국어 본문에서 숫자 표기를 안정적으로 유지하기 위해 아라비아 숫자 대신 한글 수사로 적었습니다.
theological_decisions:
- issue: 숫자 단위의 해석 여부
  chosen_reading: 본문에는 수량 자체를 그대로 두고, 그 단위를 기간·시대·횟수 중 어느 것으로 볼지 확정하지 않았습니다.
  alternative_readings:
  - 쉰여덟 기간
  - 쉰여덟 시기
  - 쉰여덟 번의 목양
  rationale: 이 절은 상징적 연대 체계의 일부이므로, 원문이 허용하는 범위 안에서 수량을 보존하고 해석은 본문 밖으로 남겨 두는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve textual tension rather than resolve it'
