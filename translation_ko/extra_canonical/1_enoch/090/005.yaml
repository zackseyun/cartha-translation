base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/005.yaml
  text: And I saw until the time when twenty-three were shepherding[a], and they completed, in their respective times[c][b], fifty-eight times.
  footnotes:
  - marker: a
    text: The Ethiopic wording is difficult here. The clause rendered 'when twenty-three had looked' may refer to a counted sequence reaching twenty-three, but the exact verb sense is uncertain in this witness.
    reason: textual_variant
  - marker: b
    text: Literally 'fifty-eight times'; the word may denote counted periods or appointed spans rather than repeated actions.
    reason: lexical_alternative
  - marker: c
    text: Or 'when twenty-three had looked'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 스물셋이 목양하던 때까지 보았습니다. 그들은 각자의 때에 쉰여덟 번을 마쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘쉰여덟 번’입니다. 이 말은 셈한 기간이나 정해진 시기를 가리킬 수도 있으며, 정확한 단위는 본문만으로 확정되지 않습니다.
    reason: lexical_alternative
