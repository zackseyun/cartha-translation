  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아디우디케이터가 지적한 대로 어근은 ‘보다’가 아니라 ‘목양하다/치다’이므로, 본문 맥락의 ‘shepherding’ 의미를 반영해 번역합니다.
