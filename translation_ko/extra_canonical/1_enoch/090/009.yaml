  rationale: ‘사슴’이라는 잘못된 어휘 판단 및 그에 의존하는 각주를 제거하고, መኃስእ를 문맥에 맞게 ‘어린양들’로 번역했습니다. 뿔의 상징성과 큰 뿔의 정체에 대해서는 본문이 제공하지 않는 해석을 덧붙이지 않았습니다. 남긴 각주는 마지막 구절의 직역과 가능한 환상적 함의를 제한적으로 설명하며 해당 절에 직접 연결됩니다.
