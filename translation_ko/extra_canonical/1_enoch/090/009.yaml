  lexicon: great horn
  rationale: 숫자와 형용사의 결합을 한국어 어순에 맞게 옮기되, ‘하나’와 ‘큰’의 결합으로 단일성과 크기를 모두 분명히 했습니다.
- source_word: ወተከሥተ፡ አዕይንቲሆሙ
