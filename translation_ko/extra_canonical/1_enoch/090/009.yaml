  - 그들이 눈을 뜨게 되었습니다
  lexicon: eyes were opened
  rationale: 수동적 표현을 유지해 비유적 ‘깨달음/인식의 회복’ 가능성을 열어 두면서도, 한국어로는 가장 सीधे한 관용구인 ‘눈이 열리다’를 사용했습니다.
