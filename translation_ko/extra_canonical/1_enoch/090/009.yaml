base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/009.yaml
  text: And I saw until horns came out for those lambs[a], and the ravens cast down their horns. And I saw until one great horn sprouted on one of those sheep[c][b], and their eyes were opened.
  footnotes:
  - marker: a
    text: The Ethiopic reads literally 'horns' even for the deer-like animals. This likely reflects the vision's symbolic use of horns as signs of strength or rule rather than zoological precision.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may imply restored perception or awareness within the vision: literally, ''their eyes were opened.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'those deer'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 그 어린양들에게 뿔들이 돋아나는 것을 보았습니다. 까마귀들이 그들의 뿔들을 넘어뜨렸습니다. 그리고 나는 그 양들 가운데 한 마리에게 큰 뿔 하나가 돋아나는 것을 보았습니다. 그들의 눈이 열렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 눈이 열렸다’입니다. 이는 환상 속에서 인식이나 깨달음이 회복됨을 시사할 수 있습니다.
    reason: lexical_alternative
