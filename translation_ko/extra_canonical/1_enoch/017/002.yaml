base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/002.yaml
  text: And they took me to a place of whirlwind[b][a], and to a mountain whose summit reached to heaven.
  footnotes:
  - marker: a
    text: Or 'a place of storm' or 'a place of tempest.' The Ge'ez term conveys violent atmospheric turmoil.
    reason: lexical_alternative
  - marker: b
    text: Or 'into a place of whirlwind, and into a mountain'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 저를 회오리바람의 장소와 하늘에 닿는 꼭대기를 가진 산으로 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회오리바람의 장소’는 ‘폭풍의 장소’ 또는 ‘폭풍우의 장소’로도 옮길 수 있습니다. 게에즈어는 격렬한 대기적 소용돌이를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 이전 번역처럼 ‘회오리바람의 장소 안으로, 그리고 산 안으로’로도 옮길 수 있으나, 여기서는 산을 ‘향해’ 이동하는 장면이 자연스럽습니다.
    reason: previous_rendering
