translation:
  language: ko
  text: 그들은 저를 회오리바람이 이는 곳으로, 또 그 꼭대기가 하늘에 닿는 산으로 데려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회오리바람이 이는 곳’은 ‘폭풍의 곳’ 또는 ‘폭풍우의 곳’으로 옮길 수 있습니다. 게에즈어는 격렬한 대기적 소용돌이를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘회오리바람이 이는 곳 안으로, 그리고 산 안으로’로 옮길 수 있습니다. 게에즈어의 이동 전치사는 문맥에 따라 ‘…로’ 또는 ‘…안으로’를 뜻할 수 있으나, 여기서는 산을 향해 가는 뜻으로 옮겼습니다.
    reason: previous_rendering
