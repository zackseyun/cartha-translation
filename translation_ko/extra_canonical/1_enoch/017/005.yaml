base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/005.yaml
  text: And I came to a river of fire[a], whose fire flowed like water, and it emptied into the great sea toward the west.
  footnotes:
  - marker: a
    text: The final phrase literally reads something like 'in the direction of ʿarab.' It is rendered 'toward the west' because the expression can denote the western quarter, though some may understand a geographic reference such as Arabia.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 불의 강에 이르렀습니다. 그 불은 물처럼 흘렀고, 그것은 서쪽을 향한 큰 바다로 흘러들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절은 문자적으로는 ‘아라브의 방향으로’ 정도입니다. 여기서는 앞의 장면과 어울리는 서쪽 방위를 반영했지만, 아라비아를 가리키는 지리적 이해도 가능합니다.
    reason: lexical_alternative
