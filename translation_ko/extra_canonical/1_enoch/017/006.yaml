translation:
  language: ko
  text: 그리고 나는 큰 강들을 보았고, 큰 어둠에까지 이르렀으며, 또 아무 육체도[a] 걷지 않는 곳으로 갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘육체’는 전통적인 셈어 표현으로, 모든 사람을 가리키거나 더 넓게는 살아 있는 존재들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 에티오피아어 OCR에서는 부정 표지가 불확실하지만, 정정된 읽기와 그리스어 증언은 ‘걷지 않는다’라는 부정의 읽기를 지지합니다.
    reason: textual_variant
