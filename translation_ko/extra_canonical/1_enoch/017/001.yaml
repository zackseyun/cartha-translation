theological_decisions:
- issue: 그곳에 있는 자들의 정체
  chosen_reading: 본문은 이들을 단정적으로 ‘천사’나 ‘감시자’로 이름붙이지 않고, 외형과 행위만 묘사합니다.
  alternative_readings:
  - 천사들
  - 감시자들
  - 영적 존재들
  rationale: 본문 자체가 정체를 직접 밝히지 않으므로, 더 넓은 전승의 명칭을 본문에 주입하지 않고 해석상의 긴장을 보존했습니다.
  doctrine_reference: 본문이 말하는 범위를 넘는 동일시는 보류하고, 묘사된 현상만 번역합니다.
