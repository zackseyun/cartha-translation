base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/001.yaml
  text: And they took me into a place where those who were there were like burning fire[a], and whenever they wished, they appeared like men.
  footnotes:
  - marker: a
    text: Or 'they showed themselves like men.' The verb can carry the sense of making themselves visible in human form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들은 나를 한 곳으로 데려갔습니다. 그곳에 있는 자들은 타오르는 불과 같았고[a], 그들이 원할 때마다 사람처럼 나타났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 사람처럼 자신을 드러냈습니다.’ 이 동사는 인간의 모습으로 자신을 보이게 한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
