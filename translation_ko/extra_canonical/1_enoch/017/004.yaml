  - marker: c
    text: Or 'the waters of life'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 저를 살아 있는 물들[a][b]과 해가 질 때마다 해를 받아들이는 서쪽의 불[c]까지 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살아 있는 물들’ 뒤의 게에즈어 대괄호 어구는 이 전승에서 불확실합니다. ‘말하는’이라는 뜻일 수 있으나 문맥상 분명하지 않아 본문에는 옮기지 않았습니다.
    reason: textual_variant
  - marker: b
    text: 게에즈어는 ‘생명의 물들’이 아니라 ‘살아 있는 물들’이라는 명사+형용사 구문입니다. 문맥에 따라 생명력 있는 물 또는 생명을 주는 물로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘서쪽의 불’은 단순한 해질녘의 불이 아니라 서쪽 방향의 우주적 장소를 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
