base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/004.yaml
  text: And they took me as far as the living waters[a], and as far as the fire of the west[c][b], which receives every setting of the sun.
  footnotes:
  - marker: a
    text: The bracketed Ethiopic word after 'waters of life' is uncertain in this witness and may mean 'that speak' or reflect a corrupt reading; it is not represented in the main text.
    reason: textual_variant
  - marker: b
    text: Or 'living waters.' The Ethiopic expression can be understood either as waters characterized by life or as life-giving waters.
    reason: lexical_alternative
  - marker: c
    text: Or 'the waters of life'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 저를 살아 있는 물들[a]과 서쪽의 불[c][b]까지 데려갔습니다. 그 불은 해가 지는 모든 때를 받아들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 표현은 ‘살아 있는 물들’이라는 형용사 구문으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서쪽의 불’은 우주적 방향성을 지닌 표현으로, 단순한 ‘해질녘의 불’보다 원문의 지리적 이미지를 더 직접적으로 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 순서는 ‘서쪽의 불’이 먼저 나오지만, 한국어 문장 흐름을 위해 앞의 물과 뒤의 불을 병렬로 배치했습니다.
    reason: korean_style_note
