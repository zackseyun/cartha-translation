  verdict: revise
  source_fidelity: ‘ቅንአት’은 이 문맥에서 ‘질투’보다 ‘열심’으로 옮기는 것이 영어 POB의 ‘zeal’ 및 심판적 열정이라는 의미 범위에 더 충실합니다. 마지막 선언은 ‘그들’에게 자비가 없다는 심판 선고로 정확히 보존되어야 합니다.
  naturalness: ‘그때 그날들에’는 중복되어 어색하므로 성서적 시간 표지로 자연스러운 ‘그날들에’로 고칩니다. 또한 ‘주님이신 영들의 주님’은 불필요하게 호칭을 중복하므로 ‘영들의 주님’으로 바로 옮깁니다.
  terminology: 반복되는 신적 칭호 እግዚአ መናፈስት는 ‘영들의 주님’으로 일관되게 번역합니다. መዐት는 심판 문맥에 맞게 ‘진노’로, ቅንአት는 ‘열심’으로 번역합니다.
