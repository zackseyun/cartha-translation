    rationale: 영어 POB의 검토된 선택은 ‘zeal and wrath’이며, 이 심판 문맥에서 ‘질투’는 인간적 시기라는 뜻으로 오해될 소지가 있습니다. ‘열심과 진노’가 원문의 의미 범위와 신학적 어조를 더 잘 보존합니다.
  - severity: medium
    issue: ‘주님이신 영들의 주님’
    rationale: 원문에는 단일 칭호 ‘Lord of Spirits’가 있을 뿐 ‘주님이신’에 해당하는 별도 수식이 없습니다. 현 번역은 호칭을 중복합니다.
  - severity: low
    issue: 각주 표지가 ‘질투와 분노의 책들’에 붙어 있음
    rationale: 각주는 난해한 중간 어구인 ‘소란과 혼란’에 관한 것이므로 해당 표현 뒤에 붙여야 독자가 각주의 대상을 정확히 알 수 있습니다.
  revised_text: 그날들에 에녹은 열심과 진노의 책들, 소란과 혼란의 책들[a]을 받았습니다. 영들의 주님께서 말씀하십니다. “그들 위에는 자비가 없을 것입니다.”
