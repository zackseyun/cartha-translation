base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/002.yaml
  text: And in those days Enoch received books of zeal and wrath[a], and books of tumult and confusion; and mercy shall not be upon them, says the Lord of Spirits.
  footnotes:
  - marker: a
    text: The Ge'ez wording in the middle of the verse is difficult in this witness. The pair rendered 'tumult and confusion' may also be understood more generally as disturbance, outcry, or disorder.
    reason: textual_variant
translation:
  language: ko
  text: 그때 그날들에 에녹은 질투와 분노의 책들[a], 소란과 혼란의 책들을 받았습니다. 그리고 「그들 위에는 자비가 없을 것입니다」라고 주님이신 영들의 주님께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 중간의 게에즈 표현은 전승상 난해하며, 여기서는 ‘소란과 혼란’으로 옮겼습니다. 더 일반적으로는 ‘동요’, ‘외침’, ‘무질서’로도 이해될 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  english_pob_choice: days
  chosen_korean: 그날들
  alternatives_korean:
  - 그때들
  - 날들
  lexicon: Dillmann
  rationale: 아포칼립스의 관용구인 “in those days”를 살려 시점 표지를 분명히 하되, 한국어에서 자연스러운 복수 시간표현으로 옮겼습니다.
- source_word: ነሥአ
  english_pob_choice: received
  chosen_korean: 받았습니다
  alternatives_korean:
  - 취했습니다
  - 가졌습니다
  lexicon: Dillmann
  rationale: 에녹이 책들의 수혜자라는 점을 드러내기 위해 ‘받다’를 택했고, ‘취하다’처럼 소유·탈취의 뉘앙스를 피했습니다.
- source_word: ቅንአት ወመዐት
  english_pob_choice: zeal and wrath
  chosen_korean: 질투와 분노
  alternatives_korean:
  - 열심과 진노
  - 열정과 진노
  lexicon: Dillmann
  rationale: 이 어휘쌍은 심판 문맥에서 하나님의 격렬한 반응을 가리킬 수 있으므로, 전통적 의미 범위를 넓게 보존하는 쪽으로 ‘질투’와 ‘분노’를 택했습니다.
- source_word: ጐጕአ ወሀውክ
  english_pob_choice: tumult and confusion
  chosen_korean: 소란과 혼란
  alternatives_korean:
  - 요란과 무질서
  - 소동과 뒤엉킴
  lexicon: Dillmann
  rationale: 본문 전승이 난해한 부분이라, 불안정·동요의 의미장을 과장하지 않으면서도 심판적 혼란을 살릴 수 있는 일반어를 사용했습니다.
- source_word: እግዚአ መናፈስት
  english_pob_choice: Lord of Spirits
  chosen_korean: 영들의 주님
  alternatives_korean:
  - 영들의 주인
  - 영의 주님
  lexicon: Dillmann
  rationale: 고정된 신적 호칭을 보존하기 위해 직역적 구조를 유지했고, 한국어의 자연스러운 호칭으로 ‘주님’을 사용했습니다.
theological_decisions:
- issue: 마지막 절의 ‘자비가 없다’는 심판 선언의 대상
  chosen_reading: 자비가 ‘그들 위에’ 없다고 옮겨, 심판받는 자들에 대한 선언으로 읽었습니다.
  alternative_readings:
  - 자비가 책들 위에 없다
  - 자비가 그들에게 임하지 않는다
  rationale: 대명사 ‘그들’은 인접한 책들이 아니라 앞뒤 문맥의 피심판자들을 가리키는 것으로 읽는 것이 자연스럽고, apocalyptic 심판 선언의 형식을 더 잘 보존합니다.
  doctrine_reference: 문맥 우선 해석; 대명사 지시어는 가장 자연스러운 선행사에 귀속
