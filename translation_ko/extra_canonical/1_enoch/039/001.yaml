  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아포칼립스의 정형화된 시간 공식을 자연스러운 한국어로 압축하되, 사건 도입의 예언적 분위기를 유지했습니다.
- source_word: ይወርዱ
