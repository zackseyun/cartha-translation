  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상에서 지상으로의 하강 이미지를 살리기 위해 직역적이면서도 현대 한국어에서 자연스러운 ‘내려오다’를 택했습니다.
- source_word: ኅሩያን ወቅዱሳን
  english_pob_choice: the chosen and holy ones
  chosen_korean: 선택받고 거룩한 이들
  alternatives_korean:
  - 선택된 거룩한 이들
  - 택하신 거룩한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 형용사적 수식을 살려 ‘이들’에 붙였고, ‘ones’를 ‘자들’보다 덜 남성화되는 ‘이들’로 풀었습니다.
- source_word: እምልዑል ሰማይ
  english_pob_choice: from the high heaven
  chosen_korean: 높은 하늘에서
  alternatives_korean:
  - 지극히 높은 하늘에서
  - 높은 천상에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단수적·상승적 천상 표현을 보존하되, 한국어에서는 ‘높은 하늘’이 과도한 해석 없이 가장 투명합니다.
- source_word: ዘርኦሙ
  english_pob_choice: their offspring
  chosen_korean: 그들의 자손
  alternatives_korean:
  - 그들의 씨
  - 그들의 후손
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘seed’의 직역 가능성은 남아 있지만, 현대 독자가 혈통/후손 관계를 즉시 이해하도록 ‘자손’을 택했습니다.
- source_word: ምስለ ውሉደ ሰብእ
  english_pob_choice: with the children of men
  chosen_korean: 사람의 자녀들과
  alternatives_korean:
  - 사람들의 자녀들과
  - 인간의 자녀들과
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아포칼립스적 대구인 ‘children of men’을 유지하면서, ‘사람의 자녀들’로 인류 범주를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: “내려오다”의 주체가 누구인지와 본문의 열린 천상 기원
  chosen_reading: 주체를 특정하지 않고, 높은 하늘에서 내려오는 천상적 존재들의 운동을 그대로 유지했습니다.
  alternative_readings:
  - 천사들로 명시하기
  - 의인 공동체로 해석하기
  rationale: 문맥상 천상 기원은 분명하지만, 이 절 자체만으로 신원을 단정할 근거는 부족하므로 본문이 지닌 긴장을 보존했습니다.
  doctrine_reference: 본문 내부 증거 우선; 신원 동일시는 주석에서 다루는 것이 적절합니다.
- issue: “하나가 될 것입니다”의 의미
  chosen_reading: ‘하나가 되다’로 옮겨 결합·혼합의 가능성을 열어 두되, 구체적 방식은 특정하지 않았습니다.
  alternative_readings:
  - 섞일 것입니다
  - 결혼할 것입니다
  - 성적으로 결합할 것입니다
  rationale: 게에즈 표현 자체는 단순히 ‘하나가 된다’고 말할 뿐이므로, 성관계나 혼인으로 과잉 구체화하지 않았습니다.
  doctrine_reference: 원어 우선 원칙; 의미 범위를 좁혀 버리지 않기
