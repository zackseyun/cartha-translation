base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/004.yaml
  text: 'And there I saw another vision: the dwelling places of the holy ones[a], and the resting places of the righteous.'
  footnotes:
  - marker: a
    text: The term rendered 'resting places' could more literally suggest beds, couches, or sleeping places. The broader sense is kept in English because the verse describes the abodes prepared for the righteous in visionary imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거기에서 나는 또 다른 환상을 보았습니다. 거룩한 자들의 거처와 의인들의 안식처였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안식처’는 문자적으로는 침상, 눕는 자리, 잠자리 같은 의미를 띨 수 있으나, 여기서는 의인들을 위해 마련된 거처라는 더 넓은 뜻을 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  english_pob_choice: I saw
  chosen_korean: 나는 보았습니다
  alternatives_korean:
  - 나는 보았다
  - 내가 보았습니다
  lexicon: Dillmann
  rationale: 환상 보고의 서술을 현대 한국어 합쇼체로 자연스럽게 살리면서, 직접 목격의 의미를 분명하게 전합니다.
- source_word: ራእየ ካልአ
  english_pob_choice: another vision
  chosen_korean: 또 다른 환상
  alternatives_korean:
  - 두 번째 환상
  - 다른 시현
  lexicon: Dillmann
  rationale: 예언-환상 문맥을 유지하기 위해 ‘환상’을 택했고, ‘another’는 ‘또 다른’으로 옮겨 연속된 계시를 드러냅니다.
- source_word: ማኅደሪሆሙ
  english_pob_choice: the dwelling places
  chosen_korean: 거처
  alternatives_korean:
  - 거주지
  - 살 곳
  - 거주처
  lexicon: Dillmann
  rationale: 문맥상 준비된 머무름의 장소를 뜻하므로, 다소 문학적이면서도 현대적인 ‘거처’가 ‘dwelling places’를 간결하게 반영합니다.
- source_word: ወምስካባቲሆሙ
  english_pob_choice: the resting places
  chosen_korean: 안식처
  alternatives_korean:
  - 쉬는 곳
  - 휴식처
  - 잠자리
  lexicon: Dillmann
  rationale: 영어 POB가 ‘beds/couches/sleeping places’의 문자적 가능성을 남겨 두었지만, 이 절이 의인들을 위해 예비된 장소를 묘사하므로 그 이미지의 넓은 의미를 살려 ‘안식처’로 옮겼습니다.
theological_decisions:
- issue: ቅዱሳን을 한국어로 ‘거룩한 자들’로 옮길지 ‘성도’로 좁힐지의 문제
  chosen_reading: 거룩한 자들
  alternative_readings:
  - 성도
  - 성인들
  rationale: 에녹서 문맥에서는 대상을 교회 용어로 미리 한정하지 않는 것이 중요하므로, 영어 POB의 ‘holy ones’를 따라 종말론적·천상적 폭을 보존했습니다.
  doctrine_reference: 문맥적 신학적 긴장을 유지하고, 후대 교회 용어로 조기 수렴하지 않습니다.
