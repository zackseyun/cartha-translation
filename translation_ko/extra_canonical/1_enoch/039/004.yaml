  lexicon: Dillmann
  rationale: 예언-환상 문맥을 유지하기 위해 ‘환상’을 택했고, ‘another’는 ‘또 다른’으로 옮겨 연속된 계시를 드러냅니다.
- source_word: ማኅደሪሆሙ
  english_pob_choice: the dwelling places
  chosen_korean: 거처
  alternatives_korean:
  - 거주지
  - 살 곳
  - 거주처
  lexicon: Dillmann
  rationale: 문맥상 준비된 머무름의 장소를 뜻하므로, 다소 문학적이면서도 현대적인 ‘거처’가 ‘dwelling places’를 간결하게 반영합니다.
- source_word: ወምስካባቲሆሙ
  english_pob_choice: the resting places
  chosen_korean: 안식처
  alternatives_korean:
  - 쉬는 곳
  - 휴식처
  - 잠자리
  lexicon: Dillmann
  rationale: 영어 POB가 ‘beds/couches/sleeping places’의 문자적 가능성을 남겨 두었지만, 이 절이 의인들을 위해 예비된 장소를 묘사하므로 그 이미지의 넓은 의미를 살려 ‘안식처’로 옮겼습니다.
