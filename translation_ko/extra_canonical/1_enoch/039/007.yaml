base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/007.yaml
  text: And I saw the dwelling-place beneath the wings of the Lord of Spirits[a]; and all the righteous and the chosen shone before him like the light of fire, and their mouths were filled with blessing, and their lips praised the name of the Lord of Spirits. And righteousness does not fail before him[c][b], and uprightness does not fail before him.
  footnotes:
  - marker: a
    text: Or 'the elect' for 'the chosen.'
    reason: lexical_alternative
  - marker: b
    text: The final repeated verb can also be rendered 'does not perish,' 'does not pass away,' or 'does not come to an end.'
    reason: lexical_alternative
  - marker: c
    text: The image 'beneath the wings' is kept literal to preserve the visionary symbolism of shelter and nearness to the Lord of Spirits.
    reason: cultural_note
translation:
  language: ko
  text: 나는 영들의 주님의 날개 아래에 있는 거처를 보았습니다[a]. 모든 의인과 선택된 이들은 그 앞에서 불의 빛처럼 빛났습니다. 그들의 입에는 복이 가득했고, 그들의 입술은 영들의 주님의 이름을 찬양했습니다. 의는 그 앞에서 사라지지 않으며[b], 올바름도 그 앞에서 사라지지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘날개 아래’는 보호와 가까움을 나타내는 상징을 그대로 살리기 위해 문자적으로 옮겼습니다.
    reason: cultural_note
  - marker: b
    text: 마지막에 반복되는 동사는 ‘사라지지 않다’ 외에 ‘끝나지 않다’, ‘끊어지지 않다’로도 옮길 수 있습니다.
    reason: lexical_alternative
