  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 입이 ‘복으로 가득하다’는 표현이 원문의 명사형을 가장 직접적으로 반영하며, 단순한 ‘찬양’보다 범위가 넓습니다.
- source_word: ጽድቅ
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님 앞에서의 도덕적·언약적 상태를 가리키는 표준 성서어휘로 ‘의’를 유지했습니다.
- source_word: ወርትዕ
  english_pob_choice: uprightness
  chosen_korean: 올바름
  alternatives_korean:
