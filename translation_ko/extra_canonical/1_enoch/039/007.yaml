  - 정직
  - 바름
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘의’와 병행되는 두 번째 추상명사로, 도덕적 곧음과 직선성을 살리는 한국어는 ‘올바름’이 가장 적절합니다.
- source_word: ኢየኃልቅ
  english_pob_choice: does not fail
  chosen_korean: 사라지지 않으며
  alternatives_korean:
  - 끝나지 않으며
  - 끊어지지 않으며
  - 무너지지 않으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 ‘사라지다/끝나다/무너지다’의 뉘앙스를 모두 가질 수 있으므로, 여기서는 앞뒤 문맥의 지속성과 소멸 없음에 초점을 둔 ‘사라지지 않다’로 옮겼습니다.
theological_decisions:
- issue: ‘만군의 영의 주님’이라는 신칭의 처리
  chosen_reading: 직역에 가까운 존칭형 신칭으로 유지했습니다.
  alternative_readings:
  - ‘영들의 주님’으로 더 직역함
  - ‘영들에 대한 주님’으로 풀어씀
  rationale: 이 절은 1 Enoch 특유의 계시적 호칭을 반복하므로, 한국어에서도 고유한 신칭 구조를 유지해 문체적 위엄과 신학적 특수성을 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: preserve local passage meaning and avoid over-normalizing distinctive divine titles.'
- issue: 마지막 이중 부정절의 의미
  chosen_reading: ‘의는 그 앞에서 사라지지 않으며, 올바름도 그 앞에서 사라지지 않습니다.’
  alternative_readings:
  - ‘의는 그 앞에서 끝나지 않으며…’
  - ‘의는 그 앞에서 없어지지 않으며…’
  rationale: 원문은 의와 올바름의 지속성을 강조합니다. ‘사라지지 않다’는 존재의 소멸 없음과 지속성을 함께 전달하면서도, 반복된 부정의 힘을 유지합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence with preserved theological tension where wording is ambiguous.'
