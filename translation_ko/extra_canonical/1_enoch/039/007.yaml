  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 호칭은 1 Enoch의 반복되는 신칭이므로, ‘영들의 주님’의 직역 가능성을 고려하되 한국어에서 더 자연스럽고 존칭이 분명한 ‘만군의 영의 주님’으로 옮겼습니다.
- source_word: ኄሩያን
  english_pob_choice: the chosen
  chosen_korean: 선택된 이들
  alternatives_korean:
  - 택함받은 이들
  - 선택된 자들
  - 택하신 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥의 종말론적 범주를 유지하면서도, POB의 ‘the chosen’처럼 특정 집단 표지를 한국어로 자연스럽게 드러내기 위해 ‘선택된 이들’을 택했습니다.
- source_word: በረከተ
  english_pob_choice: blessing
  chosen_korean: 복
  alternatives_korean:
