base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/003.yaml
  text: And in those days a whirlwind of winds carried me away from the face of the earth and set me down at the end of the heavens[a].
  footnotes:
  - marker: a
    text: Or 'the extremity of the heavens.' The Ge'ez expression refers to the outer boundary or farthest limit in the visionary cosmos.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날들에 바람의 회오리가 나를 땅의 표면에서 휩쓸어 가 하늘의 끝에 내려놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 가장 먼 경계’입니다. 게에즈어 표현은 환상적 우주에서 하늘의 바깥 경계 또는 가장 먼 한계를 가리킵니다.
    reason: lexical_alternative
