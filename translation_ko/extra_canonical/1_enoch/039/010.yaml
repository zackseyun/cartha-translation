translation:
  language: ko
  text: 그리고 내 눈이 그곳, 곧 그 장소에서 보았으며, 그들은 그를 축복하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 동사의 주어는 이 짧은 구절에 명시되어 있지 않습니다. 게에즈어 동사 형태는 복수 주어와 남성 단수 목적어를 가리키므로, ‘그들은 그를’로 옮겼습니다.
    reason: lexical_alternative
