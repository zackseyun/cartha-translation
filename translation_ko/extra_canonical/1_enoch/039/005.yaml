  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈 문법에서 ‘내 눈’이 동사의 주어로 직접 서는 구조를 살려, 단순한 ‘내가 보았다’보다 시각적 증언의 강조를 보존했습니다.
- source_word: መላእክተ ጽድቅ
  english_pob_choice: angels of righteousness
  chosen_korean: 의로운 천사들
  alternatives_korean:
