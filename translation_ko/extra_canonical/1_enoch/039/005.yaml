  - 의를 행하는 천사들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 속격 구조를 한국어의 자연스러운 관형 표현으로 옮기되, ‘의’의 추상성을 살리면서도 천사들의 성격을 분명히 드러냈습니다.
- source_word: ምስካቢሆሙ
  english_pob_choice: their resting places
  chosen_korean: 쉬는 곳
  alternatives_korean:
  - 휴식하는 자리
  - 안식하는 곳
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단어는 구체적 가구보다 ‘눕거나 쉬는 장소’의 뜻이 강하므로, 천상 환상 문맥에 맞게 과도한 구체화를 피한 표현을 택했습니다.
- source_word: በእንተ ውሉደ ሰብእ
  english_pob_choice: on behalf of the children of men
  chosen_korean: 사람의 자녀들을 위하여
  alternatives_korean:
  - 인자들을 위하여
  - 인류를 위하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘사람의 자녀들’이라는 격조 높은 인류 지칭을 유지하되, 현대 한국어에서 자연스럽게 읽히도록 ‘위하여’로 옮겼습니다.
- source_word: ጽድቅ ... ከመ ማይ ይውሕዝ
  english_pob_choice: righteousness was flowing before them like water
  chosen_korean: 의는 물처럼 그들 앞에서 흘렀으며
  alternatives_korean:
  - 의가 물처럼 그들 앞에서 흘렀으며
  - 정의가 물처럼 그들 앞에서 흘렀으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절에서는 ‘ጽድቅ’이 인물 명칭과 이미지 모두에 쓰이므로, 프로젝트 기본어인 ‘의’를 유지해 도덕적·우주적 성격을 보존했습니다.
theological_decisions:
- issue: ‘거룩한 이들’의 범주
  chosen_reading: 천상 존재들, 또는 거룩한 공동체를 모두 열어 두는 표현으로 남겼습니다.
  alternative_readings:
  - 죽은 의인들
  - 천사들만
  rationale: 게으즈 본문은 ‘거룩한 이들’의 정체를 단정하지 않으므로, 한국어도 좁은 교리 범주로 환원하지 않고 POB의 유보를 따랐습니다.
  doctrine_reference: 해석의 여지를 보존하고 후대 교리화를 피함
- issue: 마지막 절의 서술 방식
  chosen_reading: ‘그러므로 그것은 그들 가운데 영원무궁합니다’로 현재적 요약을 유지했습니다.
  alternative_readings:
  - 그러므로 그들 가운데 영원무궁할 것입니다
  - 그러므로 그들 가운데서 영원무궁합니다
  rationale: 본문은 환상 속 질서의 지속성을 진술하므로, 미래형보다 현재 서술이 더 직접적입니다. 다만 독법상 미래적 뉘앙스도 가능해 과도하게 확정하지 않았습니다.
  doctrine_reference: 문맥적 현재성 유지
