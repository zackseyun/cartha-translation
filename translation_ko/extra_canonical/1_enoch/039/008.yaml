base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or 'my portion was there before'; the Ge'ez wording around 'my portion' and 'before' is compact and may be read somewhat more formally.
    reason: lexical_alternative
  - marker: b
    text: '''Lord of Spirits'' is a characteristic divine title in the Parables and should be read from this work''s own idiom, not harmonized with later formulas.'
    reason: cross_reference
  - marker: c
    text: Or 'there my portion had been assigned before'.
    reason: previous_rendering
translation:
  language: ko
  text: 그곳에 거하기를 원했고[a], 내 영은 그 거처를 사모했습니다. 그곳에 내 몫이 이미 있었으니[c], 그것이 영들의 주[b] 앞에서 나를 위해 그렇게 확정되어 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거하기를 원했고’는 Ge'ez의 ፈቀድኩ와 አኅድር에 담긴 의지와 지속적인 거주의 뜻을 함께 반영합니다.
    reason: source_note
  - marker: b
    text: ‘영들의 주’는 이 책, 특히 비유들의 부분에 특징적으로 나오는 신적 칭호를 본문 고유의 표현대로 옮긴 것입니다.
    reason: korean_style_note
  - marker: c
    text: ‘내 몫이 이미 있었다’는 Ge'ez의 단순한 서술 동사 ኮነ(‘있었다/되었다’)와 ቅድመ(‘전에, 미리’)를 반영합니다. 본문은 ‘할당되었다’라는 수동 행위를 명시하지 않습니다.
    reason: previous_rendering
