  source_fidelity: 대체로 원문에 충실합니다. 다만 ‘거기서 내 몫이 전에 있었다’는 한국어에서 ‘전에’의 수식 범위와 시간 관계가 다소 불분명합니다. ‘그곳에 내 몫이 이미 있었다’로 하면 ህየ의 장소성과 ቅድመ의 시간적 선행을 더 자연스럽고 분명하게 보존합니다. ‘영들의 주 앞에서’도 원문의 고유 신적 칭호와 ‘before’를 적절히 반영합니다.
  naturalness: 합쇼체는 일관되지만, ‘거기서 나는 거주하기를 원했고’보다 ‘그곳에 거하기를 원했고’가 현대 표준어 성경·문학 문맥에서 더 자연스럽습니다. 또한 각주 표지를 해당 표현에 붙여 독자가 주석 대상을 즉시 알 수 있게 하는 편이 좋습니다.
  terminology: ‘내 영’, ‘거처’, ‘몫’, ‘영들의 주’는 모두 적절합니다. 특히 ‘영들의 주’는 이 작품의 반복되는 고유 칭호를 보존하며, ‘성령’이나 관습적 교회 용어로 바꾸지 않은 점이 좋습니다.
