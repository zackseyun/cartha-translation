  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시적 위치 부사를 한국어로 자연스럽게 옮기되, 시상적·환상적 거리감을 유지했습니다.
- source_word: ፈቀድኩ አኅድር
