base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or 'my portion was there before'; the Ge'ez wording around 'my portion' and 'before' is compact and may be read somewhat more formally.
    reason: lexical_alternative
  - marker: b
    text: '''Lord of Spirits'' is a characteristic divine title in the Parables and should be read from this work''s own idiom, not harmonized with later formulas.'
    reason: cross_reference
  - marker: c
    text: Or 'there my portion had been assigned before'.
    reason: previous_rendering
translation:
  language: ko
  text: 거기서 나는 거주하기를 원했고, 내 영도 그 거처를 사모했습니다. 거기서 내 몫이 전에 있었으니, 그것은 영들의 주 앞에서 내게 그렇게 확정되어 있었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거주하기를 원했고’는 Ge'ez의 ፈቀድኩ와 አኅድር의 의지·거주 의미를 함께 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘영들의 주’는 이 책 특유의 신적 칭호를 본문 고유어법대로 옮긴 것입니다.
    reason: korean_style_note
  - marker: c
    text: ‘내 몫이 전에 있었다’는 Ge'ez의 단순한 서술(‘was’)을 반영한 번역입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ህየ
  english_pob_choice: there
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 거기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시적 위치 부사를 한국어로 자연스럽게 옮기되, 시상적·환상적 거리감을 유지했습니다.
- source_word: ፈቀድኩ አኅድር
