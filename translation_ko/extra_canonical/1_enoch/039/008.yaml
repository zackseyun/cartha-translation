  chosen_korean: 거주하기를 원했고
  alternatives_korean:
  - 거하기를 바랐고
  - 머물기를 원했고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘거주하다/살다’의 지속적 거처 의미를 살리면서, 1인칭 의지 표현을 합쇼체 서술에 맞게 옮겼습니다.
- source_word: ወፈተወት መንፈስየ
  english_pob_choice: my spirit longed
  chosen_korean: 내 영도 … 사모했습니다
  alternatives_korean:
  - 내 영도 … 갈망했습니다
  - 내 영도 … 원했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘longed’의 내적 열망을 ‘사모하다’로 살려 정서적 강도를 유지했고, divine spirit가 아니므로 ‘성령’이 아니라 ‘영’으로 두었습니다.
- source_word: ለውእቱ ማኅደር
  english_pob_choice: that dwelling place
  chosen_korean: 그 거처
  alternatives_korean:
  - 그 거주지
  - 그 처소
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: מַחְדָּר(거처/주거지)의 공간적 이미지를 간결한 현대어 ‘거처’로 옮겼습니다.
- source_word: ኮነ ክፍለየ
  english_pob_choice: my portion was before
  chosen_korean: 내 몫이 전에 있었으니
  alternatives_korean:
  - 내 몫이 미리 있었으니
  - 내 몫이 그곳에 이미 있었으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영어 판의 단순한 ‘was’에 맞춰 과도한 ‘할당’ 의미를 넣지 않고, ‘몫/분깃’의 선재를 드러냈습니다.
- source_word: ቅድመ
  english_pob_choice: before
  chosen_korean: 전에
  alternatives_korean:
  - 미리
  - 이전에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간적 선행을 가장 직접적으로 드러내는 표준어로 처리했습니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 영들의 주
  alternatives_korean:
  - 영들의 주님
  - 영들의 주재
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단락의 고유한 신적 칭호를 직역해 보존했고, 정형화된 교회어보다 본문 고유어법을 우선했습니다.
theological_decisions:
- issue: ‘내 몫’의 성격
  chosen_reading: 본문은 하늘의 거처와 연결된, 미리 정해진 몫/분깃을 말한다고 보되, ‘할당되었다’는 해석을 본문에 과도하게 주입하지는 않았습니다.
  alternative_readings:
  - 단순히 장소가 ‘있었다’는 진술로만 읽기
  - 분깃의 선지정까지 분명히 드러내기
  rationale: Ge'ez의 ኮነ는 단순한 존재/됨의 동사이므로, 선지정의 함의는 문맥에서 읽되 번역어 자체는 과잉설명을 피하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; document ambiguity rather than flatten it.
- issue: ‘영’과 ‘주’의 표기
  chosen_reading: ‘내 영’과 ‘영들의 주’로 옮겨, 1인칭 내적 열망과 고유한 신칭을 구분했습니다.
  alternative_readings:
  - ‘내 마음’으로 의역하기
  - ‘성령’으로 오독될 여지를 줄이기
  rationale: 본문의 spirit은 인간 내면을 가리키며, divine Spirit 문맥이 아니므로 ‘성령’으로 바꾸지 않았습니다.
  doctrine_reference: Use 성령 only where the source explicitly carries divine-Spirit force; otherwise 영.
