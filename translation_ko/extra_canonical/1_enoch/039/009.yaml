  alternatives_korean:
  - 나는 찬송하고 높였습니다
  - 나는 찬양하며 그 이름을 높였습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘이름’은 한국어에서 이미 뒷부분의 ‘주의 이름’으로 충분히 드러나므로 중복을 줄이되, 경배 동작인 ‘찬양’과 ‘높이다’를 분리해 원문의 병렬성을 보존했습니다.
- source_word: ለእግዚአ መናፍስት
  english_pob_choice: Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 책의 고유한 신칭을 한국어 성경에서 친숙한 주권 호칭으로 옮기되, ‘만군의’로 위엄과 초월성을 살렸습니다.
- source_word: በረከተ ወስብሐተ
  english_pob_choice: with blessing and with praise
  chosen_korean: 찬양과 송축
  alternatives_korean:
  - 복과 찬양
  - 복과 송축
  - 찬양과 찬양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 번째 반복도 한국어에서는 자연스럽게 묶어 옮기되, 예배적 어휘인 ‘송축’을 사용해 축복 행위와 찬양의 응답성을 함께 드러냈습니다.
- source_word: አጽንዐኒ
  english_pob_choice: he has strengthened me / established me
  chosen_korean: 나를 굳세게 하셨기
  alternatives_korean:
  - 나를 강하게 하셨기
  - 나를 견고하게 하셨기
  - 나를 세워 주셨기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 ‘강화’뿐 아니라 ‘견고하게 함/굳게 함’의 뜻이 가능하므로, 신체적·영적 지지를 함께 담는 ‘굳세게 하셨다’를 선택했습니다.
- source_word: በከመ ፈቃዱ
  english_pob_choice: according to the will of the Lord of Spirits
  chosen_korean: 만군의 주의 뜻에 따라
  alternatives_korean:
  - 만군의 주의 뜻대로
  - 그분의 뜻에 따라
  - 주의 기쁘신 뜻에 따라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 기준점이 되는 신적 의지를 분명히 하기 위해 ‘뜻에 따라’로 옮겼고, ‘기쁘신’은 원문에 없는 평가적 뉘앙스이므로 피했습니다.
theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 신칭 처리
  chosen_reading: 고유한 에녹서 신칭으로서 ‘만군의 주’를 사용해 초월적 주권과 예배적 위엄을 드러냈습니다.
  alternative_readings:
  - 영들의 주
  - 영의 주
  - 만군의 주님
  rationale: 직역형은 의미는 가깝지만 한국어 예배 언어로는 다소 거칠 수 있어, 본문 고유성을 훼손하지 않는 범위에서 이미 성경어로 익숙한 주권 호칭을 채택했습니다.
  doctrine_reference: Original-language primacy over translation tradition; preserve distinctive titles where the source text uses them as theological markers.
- issue: ‘with blessing and with praise’의 반복 표현
  chosen_reading: 두 번의 반복을 모두 예배적 행위의 병렬로 이해해 ‘찬양과 송축’으로 유지했습니다.
  alternative_readings:
  - 복과 찬양
  - 찬양하며 복을 받음
  rationale: 이 표현은 물질적 복의 약속이 아니라 하나님께 드리는 찬송의 방식과 범주를 드러내므로, 축복 결과로 바꾸지 않고 예배 언어로 보존하는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; do not paraphrase worship language into reward language.
