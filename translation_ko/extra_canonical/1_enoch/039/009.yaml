base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/009.yaml
  text: In those days I praised and exalted the name of the Lord of Spirits with blessing and with praise[a], because he has strengthened me with blessing and with praise[b], according to the will of the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or 'made me firm' / 'established me.' The Ge'ez verb can carry the sense of strengthening or making steadfast.
    reason: lexical_alternative
  - marker: b
    text: Or 'he has strengthened me with blessing and with praise'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날들에 나는 송축과 찬양으로 영들의 주[b]의 이름을 찬양하고 높였습니다. 이는 그분께서 영들의 주의 뜻에 따라 송축과 찬양으로 나를 굳세게 하셨기[a] 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굳세게 하셨기’는 본문의 동사 አጽንዐኒ가 지닌 ‘강하게 하다’, ‘견고하게 하다’, ‘세우다’라는 의미 범위를 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영들의 주’는 본문의 고유한 신칭 እግዚአ መናፍስት(‘Lord of Spirits’)를 옮긴 것입니다. ‘만군의 주’와는 다른 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: በውእቱን መዋዕል
  english_pob_choice: In those days
  chosen_korean: 그날들에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 정형화된 종말론적 시간 표현을 살리기 위해 평이한 과거 지시보다 비전적 어감을 주는 표현으로 옮겼습니다.
