  naturalness: ‘내 눈은 … 보았습니다’는 원문의 ‘내 눈이 보았다’를 기계적으로 따른 표현으로 현대 한국어 문장에서는 부자연스럽습니다. ‘내 눈으로 … 보았습니다’가 환상 체험의 시각성을 유지하면서도 자연스럽습니다. ‘그 앞에서 영원무궁토록 수를 셀 수 없을 것입니다’도 수식 관계가 다소 불분명하므로, ‘그 앞에 영원무궁토록 셀 수 없이 있을 것입니다’로 정리하는 편이 자연스럽습니다.
