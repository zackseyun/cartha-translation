  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 수식어가 아니라 호칭적 표현이지만, 한국어에서는 ‘Chosen One’의 титул성을 자연스럽게 살리면서도 과도한 신학적 고정어를 피하기 위해 ‘선택된 이’로 옮겼습니다.
- source_word: ለጽድቅ
