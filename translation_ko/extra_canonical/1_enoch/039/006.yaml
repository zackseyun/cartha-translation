  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ‘선택된 이’와 결합하는 속격 관계를 살려, 인물의 성격 규정으로 읽히도록 ‘의의’로 옮겼습니다.
- source_word: ወዘሃይማኖት
  english_pob_choice: and of faith
  chosen_korean: 믿음의
  alternatives_korean:
  - 신실함의
  - 충성의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ḥāymānot의 의미 범위가 ‘믿음/신실함/충성’ 사이에서 압축되어 있으므로, 본문에서는 가장 직접적인 ‘믿음’을 택하고, 의미의 긴장을 주석으로 보존했습니다.
- source_word: ይከውን
  english_pob_choice: shall be
  chosen_korean: 있을 것입니다
  alternatives_korean:
  - 되겠습니다
  - 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본 뜻인 ‘있다/되다’에 충실하되 한국어 예언문맥에 맞게 ‘있을 것입니다’로 옮겨, 영문 POB의 축약 없이 간결한 미래 진술을 유지했습니다.
- source_word: ኈልቈ አልቦሙ
  english_pob_choice: will be without number
  chosen_korean: 수를 셀 수 없을 것입니다
  alternatives_korean:
  - 헤아릴 수 없을 것입니다
  - 무수할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관용적 무수성을 분명히 하면서도 ‘without number’의 직설성을 유지하기 위해 ‘수를 셀 수 없다’로 풀었습니다.
theological_decisions:
- issue: ‘의의 선택된 이와 믿음의’라는 압축된 칭호의 처리
  chosen_reading: 두 속격을 모두 살려, 인물을 ‘의’와 ‘믿음’으로 규정하는 병렬적 칭호로 유지했습니다.
  alternative_readings:
  - ‘의로운 선택된 이’
  - ‘의와 신실함의 선택된 이’
  rationale: 게즈 본문은 짧은 제목형 구를 압축해 제시하므로, 하나로 합쳐 풀어버리기보다 두 요소의 긴장을 그대로 남기는 편이 원문 의미를 더 잘 보존합니다.
  doctrine_reference: Source transparency and preservation of lexical tension.
- issue: ‘그의 날들에’의 의미
  chosen_reading: 예언적 미래 시제와 결합된 시간 표지로 읽어 ‘그의 날들에 있을 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘그의 시대에’
  - ‘그의 날들 동안’
  rationale: 문자적으로는 시간구이지만, 한국어에서는 예언적 진술과 결합해 자연스러운 문장 흐름을 만드는 것이 더 적절합니다.
  doctrine_reference: Maintain apocalyptic temporal syntax without over-paraphrase.
