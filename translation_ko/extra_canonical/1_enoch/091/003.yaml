base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
  footnotes:
  - marker: a
    text: The phrase rendered 'listen rightly' is difficult in the Ge'ez and may also be understood as 'listen to the upright word(s) of my mouth' or similar.
    reason: lexical_alternative
  - marker: b
    text: Or 'listen rightly to the speech of my mouth'.
    reason: previous_rendering
  - marker: c
    text: Or 'for I speak to you and tell you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들 모두 — 곧 의의 자녀들 모두에게 말하며 이르셨습니다. “에녹의 자녀들아, 너희 아버지의 모든 말을 들으라. 그리고 내 입의 바른 말에 귀를 기울이라. 내가 너희에게 말하며 일러 주기 때문입니다. 사랑하는 자들아, 의를 사랑하고 그 안에서 걸으십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘listen rightly’에 해당하는 게에즈 표현은 난해하여, ‘내 입의 바른 말에 귀를 기울이라’처럼 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 입의 바른 말에 귀를 기울이라’라는 뜻으로 볼 수도 있습니다.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘내가 너희에게 말하며 일러 주기 때문입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ውሉደ ጽድቅ
  english_pob_choice: children of righteousness
  chosen_korean: 의의 자녀들
  alternatives_korean:
  - 의로운 자녀들
  - 의의 아들들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 유대-에녹 문헌의 정체성 표지로서 친족적 호칭을 살리되, 한국어에서는 자연스럽고 성별을 불필요하게 좁히지 않는 ‘자녀들’이 적합합니다.
- source_word: ደቂቀ ሄኖክ
  english_pob_choice: children of Enoch
  chosen_korean: 에녹의 자녀들
  alternatives_korean:
  - 에녹의 아들들
  - 에녹의 후손들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접 호명하는 문맥이므로 ‘후손들’보다 ‘자녀들’이 더 가깝고, 지혜/권면 문체의 친밀한 호칭을 유지합니다.
- source_word: ርርትዐ / ርትዕ
  english_pob_choice: upright / righteousness
  chosen_korean: 바른 말
  alternatives_korean:
  - 올바른 말
  - 의로운 말
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 뒤의 ‘의를 사랑하라’와 구별되는 말하기 방식의 수식어로 기능하므로, 추상명사 ‘의’보다 ‘바른 말’이 문맥을 더 분명히 드러냅니다.
- source_word: አሰምዕ ይቤክሙ ወእነግረክሙ
  english_pob_choice: I speak to you and tell you / I exhort you and tell you
  chosen_korean: 내가 너희에게 말하며 일러 주기 때문입니다
  alternatives_korean:
  - 내가 너희에게 권하며 일러 주기 때문입니다
  - 내가 너희에게 들려주며 일러 주기 때문입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘들리게 하다/권면하다’의 강한 어감이 있으나, 본문은 반복적 선포와 전달의 중첩이므로 한국어에서는 과잉 해석을 피하면서도 엄숙한 권면의 흐름을 살렸습니다.
- source_word: ባቲ ሑሩ
  english_pob_choice: walk in it
  chosen_korean: 그 안에서 걸으십시오
  alternatives_korean:
  - 그 안에서 행하십시오
  - 그 길을 따라 걸으십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘걷다’의 윤리적 은유를 그대로 살리면서, 현대 한국어에서 자연스럽고 명령형의 권면으로 읽히게 했습니다.
theological_decisions:
- issue: ‘의/의의’와 ‘바름/올바름’의 구분
  chosen_reading: 정체성 표지로는 ‘의의 자녀들’, 삶의 방식과 언어의 성격으로는 ‘바른 말’, 최종 권면은 ‘의를 사랑하라’로 구분했습니다.
  alternative_readings:
  - 모두 ‘의로운’으로 통일
  - 모두 ‘올바른’으로 통일
  rationale: 원문은 동일 어근을 반복하지만, 각각 호칭·말씀·윤리적 실천에서 기능이 다릅니다. 한국어에서도 그 긴장을 보존해야 문장의 구조와 강조점이 살아납니다.
