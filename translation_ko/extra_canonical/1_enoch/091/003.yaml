base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
  footnotes:
  - marker: a
    text: The phrase rendered 'listen rightly' is difficult in the Ge'ez and may also be understood as 'listen to the upright word(s) of my mouth' or similar.
    reason: lexical_alternative
  - marker: b
    text: Or 'listen rightly to the speech of my mouth'.
    reason: previous_rendering
  - marker: c
    text: Or 'for I speak to you and tell you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들 모두, 곧 의의 모든 자녀에게 말했습니다. “에녹의 자녀들아, 너희 아버지의 모든 말을 들으십시오. 그리고 내 입에서 나오는 바른 말에 귀를 기울이십시오.[a][b] 내가 너희에게 말하고 일러 주기 때문입니다.[c] 사랑하는 자들아, 의를 사랑하고 그 안에서 걸으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어의 이 표현은 난해합니다. 본문처럼 ‘내 입에서 나오는 바른 말에 귀를 기울이라’로 이해할 수도 있고, ‘내 입의 말에 바르게 귀를 기울이라’로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 입의 말에 바르게 귀를 기울이십시오’로 옮길 수 있습니다.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘내가 너희에게 들려주고 일러 주기 때문입니다’로 옮길 수 있습니다.
    reason: previous_rendering
