base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/006.yaml
  text: And lawlessness will again increase[a], and it will be brought to completion upon the earth[c][b]; and every work of lawlessness and violence and sin will again take hold.
  footnotes:
  - marker: a
    text: The final clause literally speaks of every work of lawlessness, violence, and sin 'taking hold' again; the image is of evil regaining its grip on the earth.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'will be brought to completion' may also be understood as 'will be completed' or 'will be fulfilled,' here in the dark sense that wickedness reaches its full measure.
    reason: lexical_alternative
  - marker: c
    text: Or 'will again be repeated'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 무법은 다시 증가할 것이며, 땅 위에서 완성될 것이고, 무법과 폭력과 죄의 모든 행위가 다시 자리를 잡을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘무법과 폭력과 죄의 모든 행위가 다시 붙잡힐 것’에 가깝습니다. 여기서는 악이 다시 세상에 뿌리내리고 영향력을 되찾는 이미지를 살렸습니다.
    reason: alternative_reading
  - marker: b
    text: 이 동사는 ‘완성되다’ 외에 ‘이루어지다’로도 옮길 수 있지만, 여기서는 악이 그 분량에 이른다는 어두운 의미를 드러내기 위해 ‘완성’으로 옮겼습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘다시 반복될 것이며’로도 옮길 수 있습니다.
    reason: previous_rendering
