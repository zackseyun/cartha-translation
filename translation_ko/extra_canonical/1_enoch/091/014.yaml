base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/014.yaml
  text: And after this[a], in the ninth week, the righteous judgment will be revealed to the whole world, and all the deeds of the wicked will depart from all the earth; and the world will be written down for destruction[d][c][b], and all people will look to the path of uprightness.
  footnotes:
  - marker: a
    text: The phrase 'it will be written for the destruction of the age' is difficult in the Ge'ez. It may mean that a decree or record is written concerning the world's ruin, or possibly 'for eternal destruction.'
    reason: textual_variant
  - marker: b
    text: In this chapter's symbolic scheme, 'week' refers to an epoch in sacred history, not a literal seven-day week.
    reason: cultural_note
  - marker: c
    text: Or 'it will be written for the destruction of the age'.
    reason: previous_rendering
  - marker: d
    text: Or 'the paths of uprightness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일 후에, 아홉째 주에 의로운 심판이 온 세상에 드러날 것이며, 악한 자들의 모든 행위는 온 땅에서 사라질 것입니다. 그리고 세상은 멸망을 위해 기록될 것이며, 모든 사람은 올바름의 길을 바라볼 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 단락의 ‘주’는 문자적 7일 주간이 아니라 상징적 시대 구획을 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 원문이 가리키는 ‘세상/시대’는 아포칼립스적 세계 질서를 포함하는 넓은 표현입니다.
    reason: source_note
  - marker: c
    text: 또는 ‘세대의 파멸을 위해 기록될 것입니다’.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘올바름의 길들’입니다. 그러나 여기서는 Ge'ez 단수형을 따라 ‘길’로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: በሰንበት ታስዕ
  english_pob_choice: in the ninth week
  chosen_korean: 아홉째 주에
  alternatives_korean:
  - 아홉째 안식일에
  - 아홉째 기간에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아포칼립스의 ‘주’는 문자적 7일이 아니라 상징적 시대 단위이므로, 의미를 살려 ‘주’로 옮겼습니다.
- source_word: ኵነኔ ጽድቅ
  english_pob_choice: the righteous judgment
  chosen_korean: 의로운 심판
  alternatives_korean:
  - 의의 심판
  - 의로운 판결
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판과 의가 결합된 표현이므로, 한국어에서도 판단 행위의 공적·종말론적 힘이 살아나도록 ‘의로운 심판’으로 옮겼습니다.
- source_word: ይጽሐፍ ለሐጕለ ዓለም
  english_pob_choice: the world will be written down for destruction
  chosen_korean: 세상은 멸망을 위해 기록될 것이며
  alternatives_korean:
  - 세상은 파멸을 위해 적힐 것이며
  - 세상은 세대의 파괴를 위해 기록될 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어려운 구절이지만, ‘세상’이 ‘기록되다’의 주어라는 수정된 구문을 반영하고, ‘멸망을 위해’로 목적/귀속 관계를 드러냈습니다.
- source_word: ይኔጽሩ ለፍኖተ ርትዕ
  english_pob_choice: will look to the path of uprightness
  chosen_korean: 올바름의 길을 바라볼 것입니다
  alternatives_korean:
  - 의로운 길을 바라볼 것입니다
  - 올곧음의 길을 향할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단수형 ‘길’을 살리고, 시선의 방향성을 가진 동사를 한국어에서도 자연스럽게 드러내기 위해 ‘바라볼 것입니다’로 옮겼습니다.
theological_decisions:
- issue: ‘세상은 … 기록될 것이며’의 종말론적 이미지
  chosen_reading: 세상이 멸망을 향해 기록되는 심판의 선언으로 읽었습니다.
  alternative_readings:
  - 세상이 멸망에 대해 기록된다는 의미
  - 세상이 영원한 파멸을 위해 기록된다는 의미
  rationale: 아람어 증거가 가리키는 ‘세계가 멸망을 위해 기록된다’는 이미지를 따라가되, 본문 자체의 긴장과 묵시적 선언성을 보존했습니다.
  doctrine_reference: Source transparency and preservation of apocalyptic ambiguity
- issue: ‘아홉째 주’의 상징성
  chosen_reading: 역사적 7일 주간이 아니라 구원사적 시기를 가리키는 상징적 주기로 번역했습니다.
  alternative_readings:
  - 문자적 안식일
  - 단순한 기간
  rationale: 이 단락의 ‘주’는 주간 단위가 아니라 상징적 시대를 뜻하므로, 독자가 본문의 묵시적 구조를 오해하지 않도록 처리했습니다.
  doctrine_reference: Apocalyptic period symbolism in the Apocalypse of Weeks
