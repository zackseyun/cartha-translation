  terminology: ‘의로운 심판’, ‘악인’, ‘멸망’, ‘올바름의 길’은 현대 정중체 성서 번역 문맥에 적절합니다. ‘아홉째 주’는 상징적 시대 구획이라는 각주로 충분히 보완됩니다. 단수 ‘길’에 대한 각주는 복수 대안을 제시하기보다 원문 단수 보존을 설명하는 편이 정확합니다.
