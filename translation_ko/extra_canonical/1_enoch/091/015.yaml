theological_decisions:
- issue: 감시자들(watchers)과 천사들의 관계를 어떻게 처리할지
  chosen_reading: 본문의 [집행 주체] 표현은 괄호로 살리고, 본문 핵심은 ‘천사들 한가운데에서 시행될 큰 심판’으로 옮겼습니다.
  alternative_readings:
  - ‘영원한 하늘의 감시자들’까지 본문에 포함해 직역
  - 감시자 언급을 본문에서 생략
  rationale: 제공된 영어 본문은 감시자 구절을 괄호 처리하고 동시에 천사들 사이의 심판을 강조하므로, 본문과 괄호를 구분해 텍스트 불확실성을 보존했습니다.
  doctrine_reference: 본문 전승의 불확실성을 평탄화하지 않고 유지한다.
