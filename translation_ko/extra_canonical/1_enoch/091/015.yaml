base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/015.yaml
  text: And after this[a], in the tenth week, in the seventh part, there shall be the eternal judgment [and it shall be executed by the watchers of the eternal heaven][b], a great judgment that will be exacted in the midst of the angels.
  footnotes:
  - marker: a
    text: The Ethiopic OCR for this verse is difficult and appears to preserve a substantially different wording, including a phrase that may read 'great ... in the midst of the angels.' The main text follows the Apocalypse of Weeks sense commonly recognized for this verse, but the transmitted line should be treated as textually uncertain.
    reason: textual_variant
  - marker: b
    text: Or 'And after this, in the seventh week, there shall arise an apostate generation, and many of its deeds shall be deeds of apostasy; but at its end the chosen righteous one from the eternal plant of righteousness shall be chosen, to whom shall be given sevenfold instruction concerning all his creation.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 후에 열째 주간의 일곱째 부분에 영원한 심판이 있을 것입니다. [그 심판은 영원한 하늘의 감시자들에 의해 집행될 것입니다.] 천사들 가운데에서 시행될 큰 심판이 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감시자들’에 해당하는 괄호 안 구절은 전승이 불안정하므로 본문에서 분리해 표기했습니다.
    reason: textual_variant
  - marker: b
    text: ‘천사들 가운데에서’는 전승된 게에즈 구문을 반영한 것으로, 심판이 천상 존재들 가운데에서 시행됨을 가리킬 수 있습니다.
    reason: source_note
