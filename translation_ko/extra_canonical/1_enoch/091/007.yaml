base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/007.yaml
  text: And when sin and transgression and blasphemy and violence increase in every deed, and lawlessness and wrongdoing and uncleanness increase, a great punishment will come from heaven upon them all, and the Holy Lord will come forth in wrath and in punishment, to execute judgment upon the earth.
  footnotes:
  - marker: a
    text: Or 'a great plague' or 'a great scourge'; the Ge'ez term can denote punitive affliction as well as punishment.
    reason: lexical_alternative
  - marker: b
    text: Or 'And sin and transgression and blasphemy and violence will increase in every deed, and lawlessness and wrongdoing and uncleanness will increase; and a great punishment will come'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 죄와 범죄와 신성모독과 폭력이 모든 행위 가운데서 커지고, 불법과 잘못과 더러움도 커질 때, 큰 징벌이 하늘로부터 그들 모두에게 임할 것이며, 거룩하신 주께서 진노와 징벌 가운데 나오셔서 땅 위에 심판을 집행하실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 역병’ 혹은 ‘큰 재앙’. Ge'ez 어휘는 형벌이면서 동시에 징벌적 재앙이나 역병을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእመኒ
  english_pob_choice: And when
  chosen_korean: 그리고 … 때
  alternatives_korean:
  - 그리고 …면
  - 만일 …라면
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문두의 조건·시간 표지로 읽어 원문의 종속적 구조를 살렸습니다. 한국어에서는 ‘그리고 … 때’가 본문의 종말론적 조건절을 자연스럽게 드러냅니다.
- source_word: ትልህቅ / ትለህቅ
  english_pob_choice: will increase
  chosen_korean: 커지고
  alternatives_korean:
  - 증가하고
  - 더 커지고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 악이 누적·팽창하는 흐름을 간결하게 살리기 위해 ‘커지고’를 택했습니다. 반복 동사의 점증 효과를 한국어에서도 유지합니다.
- source_word: ጽርፈት
  english_pob_choice: blasphemy
  chosen_korean: 신성모독
  alternatives_korean:
  - 모독
  - 하나님 모독
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 욕설보다 신을 향한 불경을 가리키는 쪽이 강하므로 ‘신성모독’이 가장 정확합니다. 비난의 수직적 방향을 보존합니다.
- source_word: መቅሠፍት ዐቢይ
  english_pob_choice: a great punishment
  chosen_korean: 큰 징벌
  alternatives_korean:
  - 큰 재앙
  - 큰 형벌
  - 큰 역병
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 심판의 성격이 분명하지만, 어휘 자체가 징계적 재앙도 포함할 수 있으므로 ‘징벌’이 가장 폭넓고 문맥 적합합니다. ‘큰’으로 강도를 살렸습니다.
- source_word: እግዚእ ቅዱስ
  english_pob_choice: the Holy Lord
  chosen_korean: 거룩하신 주
  alternatives_korean:
  - 거룩하신 주님
  - 거룩한 주
  - 거룩하신 야훼
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1에녹의 직설적 신칭을 한국어에서 자연스러운 호칭으로 옮기되, ‘거룩하신’으로 제목적 성격을 유지했습니다. 본문은 예배문이 아니라 심판 서술이므로 ‘주’가 가장 절제된 대응입니다.
theological_decisions:
- issue: መቅሠፍት의 의미 범위
  chosen_reading: ‘징벌’로 옮기되, 문맥상 재앙적·가혹한 처벌의 뉘앙스를 함께 보존했습니다.
  alternative_readings:
  - 재앙
  - 역병
  - 징계
  rationale: 본문은 하늘로부터 오는 종말론적 심판과 연결되므로 단순 사건이 아니라 신적 처벌의 의미가 우선입니다. 다만 어휘가 실제 피해 양상(역병/재앙)을 포함할 수 있어 과도하게 좁히지 않았습니다.
  doctrine_reference: 해석을 한 의미로 고정하지 말고, 본문이 가진 심판·재앙의 긴장을 보존합니다.
- issue: 거룩한 주의 호칭
  chosen_reading: ‘거룩하신 주’
  alternative_readings:
  - 거룩하신 주님
  - 거룩하신 야훼
  rationale: 에녹서는 후대 정전의 고정 관용구보다 본문의 묵시적 신칭을 직접 드러내는 표현이 적절합니다. ‘야훼’로의 확장은 본 절의 Ge'ez 표면형만으로는 과잉일 수 있어 본문에서는 절제했습니다.
  doctrine_reference: 정전 신학을 과잉 이식하지 말고, 원문이 제시하는 묵시적 하나님의 호칭을 유지합니다.
