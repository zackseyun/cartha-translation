theological_decisions:
- issue: ‘의의 주간’과 ‘의로운 심판’에서 ጽድቅ 계열 표현을 어떻게 일관되게 옮길지
  chosen_reading: 둘 다 ‘의’ 계열로 유지했습니다.
  alternative_readings:
  - 의로움
  - 정의
  rationale: 본문이 같은 어근으로 시대와 심판을 연결하므로, ‘의’로 통일해 주제적 연속성을 보존했습니다.
  doctrine_reference: Consistency of key terms; apocalyptic moral order without flattening to civic justice
- issue: ‘칼’ 이미지를 해석으로 바꿀지 여부
  chosen_reading: 상징적 심판 도구로서의 ‘칼’을 그대로 유지했습니다.
  alternative_readings:
  - 심판의 권세
  - 처벌의 권한
  rationale: 원문이 실제로 ‘칼’을 말하므로, 심판 권위로 의미를 환원하지 않고 이미지 자체를 보존했습니다.
  doctrine_reference: Preserve source imagery; do not smooth apocalyptic violence into generic abstraction
