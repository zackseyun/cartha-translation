base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/004.yaml
  text: And do not draw near to righteousness with a double heart[a], nor join yourselves with those who are of a double heart; but walk in righteousness, my children, and it will lead you on a good path[d][c][b], and righteousness will be your companion.
  footnotes:
  - marker: a
    text: The clause 'nor join yourselves with those who are of a double heart' is bracketed in the supplied Ethiopic witness and may reflect a textual variant or secondary expansion, but it suits the verse's parallel warning and is retained here.
    reason: textual_variant
  - marker: b
    text: '''Double heart'' is a literal idiom for divided loyalty or inner duplicity.'
    reason: cultural_note
  - marker: c
    text: Or 'righteousness will be joined to you' / 'will be your associate'; the Ethiopic term suggests companionship or partnership.
    reason: lexical_alternative
  - marker: d
    text: Or 'on good and righteous paths'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 마음이 두 갈래인 상태로 의에 가까이 가지 마십시오[a]. 또 마음이 두 갈래인 사람들과도 어울리지 마십시오. 그러나 의 가운데서 걸어가십시오, 내 자녀들아. 그러면 그것이 여러분을 좋은 길로 인도할 것이며[d][c][b], 의가 여러분의 동반자가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 에티오피아어 증언에서 이 절은 대괄호로 제시되어 있어, 이본 또는 보조 확장일 가능성이 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘마음이 두 갈래’는 분열된 충성이나 내적 이중성을 가리키는 직역적 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 원문은 ‘의가 여러분과 결합될 것’ 또는 ‘동반/동행할 것’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘좋은 길 위에서’ / ‘좋고 의로운 길 위에서’로 옮길 수 있습니다.
    reason: previous_rendering
