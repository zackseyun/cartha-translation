  naturalness: ‘그리고 이 일 후에’는 문두 연결어와 시간 전환 표현이 겹쳐 다소 어색합니다. ‘그 후에’가 현대 표준 한국어의 자연스러운 서술 전환입니다. ‘자기의’보다 ‘자기의’가 반복되는 현 초안은 허용되나, 성서적 문맥에서도 ‘자기의’는 자연스럽게 유지할 수 있습니다.
  terminology: Methuselah의 통용 한국어 성서 인명 표기는 ‘므두셀라’입니다. ‘형제들’과 ‘친족’은 원문의 구별을 적절히 반영하며, 혈연적 범위를 불필요하게 신학화하지 않습니다.
