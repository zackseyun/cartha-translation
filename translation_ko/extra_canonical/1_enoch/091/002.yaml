theological_decisions:
- issue: 혈연적 친족 표현의 범위
  chosen_reading: 이 구절은 메두셸라의 실제 혈연 관계를 가리키는 말로 번역하고, 공동체적·비유적 확장을 하지 않았습니다.
  alternative_readings:
  - 씨족 구성원으로 넓게 이해
  - 신앙 공동체적 표현으로 완화
  rationale: 문맥상 가계 서술이며, 본문 자체는 ‘형제들’과 ‘친족’을 병렬로 제시할 뿐 상징적 의미를 요구하지 않습니다.
  doctrine_reference: 문맥 우선 원칙; 본문이 허용하지 않는 알레고리화 지양
