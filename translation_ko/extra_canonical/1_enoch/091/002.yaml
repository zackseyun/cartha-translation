translation:
  language: ko
  text: 그 후에 므두셀라는 가서 자기의 모든 형제들을 자기에게로 불렀고, 자기의 친족을 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 후에’는 이야기의 순서를 나타내는 번역입니다. 원문 표현은 문자적으로 ‘그것으로부터’ 또는 ‘그 후에’라는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
