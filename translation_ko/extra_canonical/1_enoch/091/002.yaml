  text: And after this[a], Methuselah went and called all his brothers to him[b], and gathered his kindred.
  footnotes:
  - marker: a
    text: The opening expression can also be rendered 'thereupon' or 'from this point.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and gathered his kindred to himself.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일 후에 메두셸라가 가서 자기의 모든 형제들을 자기에게로 불러 모으고, 자기의 친족을 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 일 후에’는 순차적 서술을 살린 번역이며, 원문은 문자적으로 ‘그것으로부터/그 후에’의 뜻을 가질 수도 있습니다.
    reason: lexical_alternative
