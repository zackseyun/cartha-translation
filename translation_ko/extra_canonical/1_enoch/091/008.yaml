  text: In those days[a], violence shall be cut off from its roots[d][c][b], and iniquity together with deceit from under heaven.
  footnotes:
  - marker: a
    text: The opening 'in it' likely refers back to the numbered period or 'week' in the surrounding vision.
    reason: cross_reference
  - marker: b
    text: The verb rendered 'shall be cut off' may also be understood as 'shall be shortened' or 'shall come to an end.'
    reason: lexical_alternative
  - marker: c
    text: The vice-term rendered 'deceit' is uncertain in this OCR witness; 'transgression,' 'rebellion,' or 'guile' are possible depending on how the Ge'ez phrase is divided.
    reason: textual_variant
  - marker: d
    text: Or 'And in it days shall be cut off, and lawlessness shall be removed from its roots, together with deceit, from beneath heaven.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날들에 폭력은 뿌리째 끊어지고, 불의와 속임수도 하늘 아래에서 사라질 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 표현은 앞 문맥의 기간 또는 ‘주간’을 가리키는 지시어일 가능성이 큽니다.
    reason: cross_reference
  - marker: b
    text: ‘shall be cut off’는 ‘짧아질 것이다’ 또는 ‘끝날 것이다’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 여기서 ‘deceit’에 해당하는 Ge'ez 어휘는 OCR 증거상 다소 불확실하여, ‘반역’, ‘죄악’, ‘간계’ 계열 해석도 가능합니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘그 안에서 날들이 잘려 나가고, 불법이 뿌리에서 제거되며, 속임수가 하늘 아래에서 사라질 것입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
