  source_fidelity: 본문의 ‘영이 내 위에 부어졌다’는 Ge'ez 동사형을 충실히 반영합니다. 다만 현 초안은 두 명령문 중 첫째를 연결형 ‘부르고’로 두고 둘째만 ‘모으십시오’로 끝내어, 직접 화법의 병렬 명령으로서 문법적 균형이 깨집니다. 또한 ‘의의 영’이라는 각주 대안은 현재 제시된 원문과 최신 어휘 검토를 뒷받침하지 못하므로 삭제해야 합니다.
  naturalness: ‘부르십시오 … 모으십시오’로 병렬 명령을 맞추고, ‘영원에 이르기까지’를 사용하여 종결 시간 표현의 범위를 자연스럽고 엄숙하게 나타냈습니다. ‘한 말’과 ‘영’은 원문의 비한정성을 과도하게 신학화하지 않고 보존합니다.
  terminology: 므두셀라는 통용 표기를 유지했습니다. ‘자녀들’은 ደቂቀ의 성별 비한정성을 보존합니다. ‘영’은 대문자화하거나 ‘의의 영’으로 확정하지 않았으며, ‘부어졌습니다’는 해당 동사형을 반영합니다.
  issues:
  - severity: medium
    issue: 병렬 명령문의 종결 방식 불일치
    rationale: ‘네 형제들을 … 부르고, … 모으십시오’는 첫 동사가 명령형이 아니라 연결형이어서, 원문의 두 병렬 명령을 한국어 합쇼체로 적절히 구현하지 못합니다.
