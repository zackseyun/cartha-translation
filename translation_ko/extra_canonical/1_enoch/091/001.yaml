  - 내게 소집하고 / 내게 집결시키십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사는 단순한 연락과 실제 집합을 구분하므로, 한국어에서도 ‘부르다’와 ‘모으다’로 힘의 차이를 살렸습니다.
- source_word: ኵሎ ደቂቀ እምከ
