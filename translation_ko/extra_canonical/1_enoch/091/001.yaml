base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/001.yaml
  text: And now[a], my son Methuselah, call all your brothers to me, and gather to me all the children of your mother; for a word calls me, and a spirit of uprightness is poured out upon me[d][c][b], so that I may show you everything that will come upon you forever.
  footnotes:
  - marker: a
    text: Or 'the Spirit of righteousness is upon me.' The phrase may denote divine inspiration in a more personified sense.
    reason: lexical_alternative
  - marker: b
    text: The closing phrase may also be understood as 'unto eternity,' 'for all ages,' or 'for the generations to come,' depending on how broadly the temporal expression is taken.
    reason: lexical_alternative
  - marker: c
    text: Or 'a spirit of uprightness is upon me'.
    reason: previous_rendering
  - marker: d
    text: Or 'sons of your mother'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제, 내 아들 므두셀라야, 네 형제들을 모두 내게로 부르십시오. 또 네 어머니의 자녀들을 모두 내게로 모으십시오.[c] 한 말이 나를 부르고, 영이 내 위에 부어졌기 때문입니다. 내가 영원에 이르기까지 너희에게 닥칠 모든 것을 너희에게 보여 줄 수 있도록 말입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 끝의 시간 표현은 문맥에 따라 ‘영원히’ 또는 ‘모든 세대에 걸쳐’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘네 어머니의 아들들’.
    reason: previous_rendering
