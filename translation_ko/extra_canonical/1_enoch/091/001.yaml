  - 네 어머니의 아이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 ደቂቀ는 ‘자녀들/후손들’의 넓은 뜻이므로, 성별을 한정하는 ‘아들들’보다 ‘자녀들’이 원문에 더 가깝습니다.
- source_word: መንፈስ ትክዕወት ላዕሌየ
  english_pob_choice: a spirit of uprightness is poured out upon me
  chosen_korean: 한 영이 내 위에 부어졌기 때문입니다
  alternatives_korean:
  - 한 영이 내 위에 쏟아졌기 때문입니다
