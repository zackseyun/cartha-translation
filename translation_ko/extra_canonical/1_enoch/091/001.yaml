  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어진 Ge'ez에서는 ‘부어지다’의 동사형이 핵심이므로, 오역 없이 수동적 계시/영감의 이미지를 살렸습니다. ‘한 영’은 원문의 비한정성을 보존합니다.
