theological_decisions:
- issue: ‘모든 불법이 완결된다’는 문구가 악의 승인처럼 들릴 수 있는지
  chosen_reading: ‘완결되어 뿌리째 끊어지고’로 옮겨, 불법이 먼저 그 극한에 이른 뒤 심판 아래 제거된다는 긴장을 유지했습니다.
  alternative_readings:
  - ‘모든 불법이 끝나고’
  - ‘모든 불법이 완전히 드러나고’
  rationale: 영문 POB 주석이 지적하듯, 이 구절은 불법의 승인보다 심판 직전의 충만한 도달과 그 후의 제거를 뜻할 수 있습니다. 한국어도 그 긴장을 흐리지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
