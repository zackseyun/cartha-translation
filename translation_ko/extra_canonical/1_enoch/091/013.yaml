translation:
  language: ko
  text: 그리고 그 완성 때에 집들이 그들의 의로 말미암아[a][c] 선택될 것이며, 큰 왕의 집[b]은 영광 가운데 영원히 세워질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집들’은 문자적 주거지일 수도 있고, 비유적으로는 가문이나 거처를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 왕’은 이 종말론적 문맥에서 하나님을 가리키는 호칭으로 이해됩니다.
    reason: cross_reference
  - marker: c
    text: 원문의 표현은 ‘그들의 의로 말미암아’라는 인과 관계를 드러냅니다.
    reason: previous_rendering
