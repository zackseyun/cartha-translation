base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/013.yaml
  text: And at its completion[a], houses shall be chosen because of their righteousness[c][b], and the house of the great King shall be built in glory forever.
  footnotes:
  - marker: a
    text: Or 'dwellings' or 'households'; the Ge'ez has the plural 'houses,' which may be concrete or symbolic.
    reason: lexical_alternative
  - marker: b
    text: '''The great King'' likely refers to God in this eschatological context.'
    reason: cross_reference
  - marker: c
    text: Or 'houses shall be chosen in righteousness for them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 완성 때에 그들은 자기들의 의로 인해 집들을 얻을 것이며, 큰 왕의 집은 영광 가운데 영원히 세워질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집들’은 문자적 주거지일 수도 있고, 비유적으로는 가문이나 거처를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 왕’은 이 종말론적 문맥에서 하나님을 가리키는 호칭으로 이해됩니다.
    reason: cross_reference
  - marker: c
    text: 원문의 표현은 ‘그들의 의로 인해’라는 인과 관계를 드러냅니다.
    reason: previous_rendering
