theological_decisions:
- issue: ‘큰 왕’의 지시 대상
  chosen_reading: 문맥상 하나님을 가리키는 왕호로 읽되, 본문 자체의 호칭은 그대로 두었습니다.
  alternative_readings:
  - 지상의 이상화된 왕
  - 일반적인 왕권 은유
  rationale: 묵시적·종말론적 맥락에서 ‘큰 왕’은 하나님의 왕권을 가리키는 표현으로 읽는 것이 가장 자연스럽지만, 본문이 직접 설명하지 않으므로 제목만 보존했습니다.
  doctrine_reference: 해설은 최소화하고, 본문이 허락하는 왕호의 긴장을 유지합니다.
- issue: ‘집들’과 ‘큰 왕의 집’의 병렬성
  chosen_reading: 복수의 ‘집들’과 단수의 ‘큰 왕의 집’을 대조적으로 살렸습니다.
  alternative_readings:
  - 의인들이 집을 소유한다는 평면적 진술
  - 성전 건축만을 가리키는 단일 상징
  rationale: 아비야테(복수)와 ‘집’의 병렬은 종말론적 질서와 거처/성전의 이미지를 함께 유지하므로, 평탄화하지 않고 그대로 살리는 것이 좋습니다.
  doctrine_reference: 상징을 단정적으로 해석하지 않고 원문이 만드는 이미지를 보존합니다.
