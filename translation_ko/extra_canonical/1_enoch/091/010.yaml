translation:
  language: ko
  text: 그리고 의로운 자가 그들의 잠에서 일어나고, 지혜도 일어나 그들에게 주어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 단수형은 공동체 안에서 일어나는 대표적 의인일 수도 있고, 특정한 한 의인일 수도 있습니다. 번역은 이 가능성을 열어 두었습니다.
    reason: alternative_reading
  - marker: b
    text: ‘그들의 잠에서’는 최신 교정에 따라 ‘among them’이 아니라 ‘sleep’의 의미를 반영한 것입니다.
    reason: source_note
