  text: And the righteous one shall arise from their sleep[b][a], and wisdom shall arise and be given to them.
  footnotes:
  - marker: a
    text: The singular 'the righteous one' may refer either to an individual figure arising from the community or to a representative righteous person; the wording is left intentionally open.
    reason: lexical_alternative
  - marker: b
    text: Or 'And the righteous one shall arise from among them, and wisdom shall arise and be given to them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 의로운 자가 그들의 잠에서 일어날 것이며, 지혜도 일어나 그들에게 주어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 단수형은 공동체 안에서 일어나는 대표적 의인일 수도 있고, 특정한 한 의인일 수도 있습니다. 번역은 이 가능성을 열어 두었습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ጻድቅ
  english_pob_choice: the righteous one
  chosen_korean: 의로운 자
  alternatives_korean:
  - 의인
  - 의로운 이
  - 의인 한 사람
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈 원문의 단수성을 살리되, 한국어에서는 자연스럽게 읽히는 단독 인물을 나타내기 위해 ‘의로운 자’로 옮겼습니다. 영어 POB가 열어 둔 개인/대표 인물의 긴장을 유지합니다.
- source_word: እምነዋሙ
  english_pob_choice: from their sleep
  chosen_korean: 그들의 잠에서
  alternatives_korean:
  - 그들의 잠으로부터
  - 잠에서
  - 그의 잠에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 형태는 ‘잠’(sleep)에서의 이탈을 뜻하므로 ‘그들의 잠에서’가 가장 직접적입니다. 최신 수정 사항에 따라 단수 남성 접미사의 해석보다 뒤따르는 복수 지시어와의 호응을 우선했습니다.
- source_word: ይትወሀብ ሎሙ
  english_pob_choice: be given to them
  chosen_korean: 그들에게 주어질 것입니다
  alternatives_korean:
  - 그들에게 주어질 것입니다
  - 그들에게 주어집니다
  - 그들에게 주어질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형과 간접목적어를 가장 평이하게 반영하는 표현입니다. ‘주어지다’는 원문의 수여 의미를 보존하면서 과도한 신학적 해석을 덧붙이지 않습니다.
theological_decisions:
- issue: ‘의로운 자’의 단수성이 개인 인물인지 대표적 의인인지
  chosen_reading: 단수형을 유지하여 ‘의로운 자’로 번역했습니다.
  alternative_readings:
  - 의로운 사람들
  - 의인들
  - 의로운 이 한 사람
  rationale: 원문은 단수형이며, 문맥상 공동체적 일반화로 환원할 필요가 없습니다. 한국어에서도 단수 표지를 유지해 메시아적·대표적 가능성을 열어 둡니다.
  doctrine_reference: 의도적으로 신학적 긴장을 유지하고 확정하지 않음.
