base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/011.yaml
  text: And from it shall be cut off the roots of oppression[a], and sinners shall be delivered up to the sword. From the blasphemers they shall be cut off in every place[d][c][b], and those who devise violence and those who commit blasphemy shall be destroyed by the sword.
  footnotes:
  - marker: a
    text: The clause after 'by the sword' is textually difficult in the Ethiopic witness. The translation follows the received Ge'ez sequence while preserving its repeated judgment formulas.
    reason: textual_variant
  - marker: b
    text: '''Blasphemers'' and ''commit blasphemy'' render related Ge''ez terms, preserving the lexical link in the source.'
    reason: lexical_alternative
  - marker: c
    text: Or 'ten weeks of oppression'.
    reason: previous_rendering
  - marker: d
    text: Or 'Then from the blasphemers there shall be cut off, in every place, those who devise violence and those who commit blasphemy; they shall be delivered up to destruction.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그로부터 압제의 뿌리가 잘려 나가고, 죄인들은 칼에 넘겨질 것입니다. 신성모독자들은 모든 곳에서 잘려 나가며, 폭력을 꾀하는 자들과 신성모독을 행하는 자들은 칼로 멸망할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘신성모독자들’과 ‘신성모독을 행하는 자들’은 서로 관련된 게에즈어 표현을 대응시켜 그 어휘적 연결을 보존한 번역입니다.
    reason: lexical_alternative
