theological_decisions:
- issue: ‘민족들과 함께’의 심판 범위
  chosen_reading: 원문의 전치사적 결합을 따라, 민족들과 연루된 포괄적 심판으로 읽되 특정 교리 체계를 덧씌우지 않았습니다.
  alternative_readings:
  - ‘민족들 가운데’로 읽어 분포적 의미를 더 강하게 볼 수 있습니다.
  - ‘이방인들과 함께’로 좁혀 종교적 대비를 부각할 수 있습니다.
  rationale: 문맥은 최후 심판의 총체성을 강조하므로, 대상의 범위를 과도하게 특정하지 않는 번역이 더 충실합니다.
  doctrine_reference: 종말 심판의 범위는 본문이 허용하는 수준에서만 표현합니다.
