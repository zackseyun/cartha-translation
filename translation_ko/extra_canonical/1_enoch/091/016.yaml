base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/016.yaml
  text: And the first heaven shall depart and pass away[a], and a new heaven shall appear[b], and all the powers of the heavens shall shine sevenfold forever.
  footnotes:
  - marker: a
    text: Or 'all the host of the heavens.' The Ge'ez term can denote powers, forces, or heavenly hosts, and may include celestial bodies as well as heavenly beings.
    reason: lexical_alternative
  - marker: b
    text: The closing phrase is difficult. It likely means 'sevenfold' or 'seven times more brightly.' Some uncertainty remains because the transmitted Ethiopic wording is not fully clear in this OCR witness.
    reason: textual_variant
translation:
  language: ko
  text: 첫째 하늘이 떠나가고 지나가며, 새 하늘이 나타나고, 하늘들의 모든 권능이 영원히, 일곱 배로 빛날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘들의 모든 군대’. 게에즈어 해당어는 권능, 힘, 천상 군대, 천체까지 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 난해합니다. ‘일곱 배로’ 또는 ‘일곱 배 더 밝게’로 이해될 가능성이 있으며, 전승된 게에즈 문구가 완전히 분명하지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ወሰማይ፡ ቀዳማይ፡
  english_pob_choice: the first heaven
  chosen_korean: 첫째 하늘
