  rationale: ቀዳማይ는 순서상 ‘첫째/먼저의’를 뜻하므로, 종말론적 대비를 살리면서도 자연스러운 ‘첫째 하늘’로 옮겼습니다.
- source_word: ይወፅእ፡ ወየኃልፍ፡
  english_pob_choice: shall depart and pass away
  chosen_korean: 떠나가고 지나가며
  alternatives_korean:
  - 떠나고 사라지며
  - 물러가고 지나가며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사는 단순 소멸보다 ‘떠남’과 ‘지나감’의 연속적 이동을 강조하므로, 겹치지 않게 한국어 동사 두 개로 그 흐름을 살렸습니다.
- source_word: ሰማይ፡ ሐዲስ፡
  english_pob_choice: a new heaven
  chosen_korean: 새 하늘
  alternatives_korean:
  - 새로운 하늘
  - 갱신된 하늘
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ሐዲስ의 직접적 의미를 따라 ‘새 하늘’로 옮기고, 해석적 색채가 강한 ‘갱신된’은 피했습니다.
- source_word: ኵሉ፡ ኃይለ፡ ሰማያት፡
  english_pob_choice: all the powers of the heavens
  chosen_korean: 하늘들의 모든 권능
  alternatives_korean:
  - 하늘들의 모든 군대
  - 하늘의 모든 권세
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ኃይለ는 권능, 힘, 군대까지 아우를 수 있어 apocalyptic 문맥의 중의성을 살리기 위해 ‘권능’을 택했습니다.
- source_word: ያበርህ፡ ሰብዓተ፡ ምእዕቢተ።
  english_pob_choice: shall shine sevenfold forever
  chosen_korean: 영원히, 일곱 배로 빛날 것입니다
  alternatives_korean:
  - 일곱 배로 영원히 빛날 것입니다
  - 영원토록 일곱 배로 빛날 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문 말미의 어순과 영어 POB의 보존을 따라 ‘영원히’를 먼저 두고, ሰብዓተ는 분명한 ‘일곱 배’로, ያበርህ는 ‘빛나다’로 옮겼습니다.
theological_decisions:
- issue: 첫째 하늘의 ‘떠남’이 완전한 폐기인지, 변형된 새 창조인지
  chosen_reading: 본문은 첫째 하늘이 떠나가고 새 하늘이 나타난다는 환시의 순서를 유지하며, 완전한 대체인지 갱신된 지속인지 단정하지 않습니다.
  alternative_readings:
  - 옛 우주의 완전한 폐기
  - 기존 창조의 변형과 갱신
  rationale: 원문은 우주론 체계를 설명하기보다 종말 환상의 대비를 제시하므로, 신학적 긴장을 풀지 않고 그대로 남겼습니다.
  doctrine_reference: 종말론적 새 창조의 범위에 대한 해석 유보
