base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/003.yaml
  text: And I came into the garden of righteousness[a], and I saw beyond those trees many large trees growing there, with good fragrance, great and very beautiful and glorious; and the tree of wisdom[c][b], from which those who eat know great wisdom.
  footnotes:
  - marker: a
    text: The spatial phrase rendered 'beyond those trees' is difficult in the Ethiopic witness and could also be understood more generally as 'among' or 'beside' those trees.
    reason: textual_variant
  - marker: b
    text: The final clause states that eating from this tree results in knowing 'great wisdom'; the wording intentionally echoes sacred-garden imagery without repeating the exact Genesis expression.
    reason: cross_reference
  - marker: c
    text: Or 'great and very beautiful'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 의의 동산으로 들어갔습니다[a]. 그리고 나는 그 나무들 너머에 거기서 자라고 있는 큰 나무들, 곧 향기가 좋고 크고 매우 아름답고 영광스러운 나무들을 보았습니다. 그리고 지혜의 나무[b][c]가 있었는데, 그 나무에서 먹는 사람들은 큰 지혜를 알게 됩니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 나무들 너머에’는 게에즈의 위치 표현이 다소 난해하여, 더 일반적으로는 ‘그 나무들 사이에’ 또는 ‘그 나무들 곁에’로도 이해될 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 이 절의 끝은 ‘그 나무에서 먹는 사람들’이 큰 지혜를 알게 된다는 뜻으로 읽힙니다.
    reason: source_note
  - marker: c
    text: 또는 ‘크고 매우 아름답고 영광스러운’.
    reason: previous_rendering
lexical_decisions:
- source_word: ገነት ጽድቅ
  english_pob_choice: the garden of righteousness
  chosen_korean: 의의 동산
  alternatives_korean:
  - 의로운 동산
  - 의의 정원
  - 의의 낙원
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ገነት은 ‘동산/낙원’의 뜻을 지니며, ጽድቅ은 여기서 장소의 성격을 나타내므로 ‘의’로 옮겨 원문의 도덕적·비전적 뉘앙스를 살렸습니다.
- source_word: ከሐክቲሆሙ ለእልክቱ ዕፀው
  english_pob_choice: beyond those trees
  chosen_korean: 그 나무들 너머에
  alternatives_korean:
  - 그 나무들 사이에
  - 그 나무들 곁에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어휘상 위치 표현이 다소 कठिन하므로, POB의 판단을 따라 시야가 더 안쪽으로 이어지는 공간감인 ‘너머에’를 택했습니다.
- source_word: ዕፀወ ብዙኃነ ወዐቢይነ ይበቍሉ ... ዐቢያን ወሥናሙ ብዙኅ ወስቡሓን
  english_pob_choice: many large trees growing there, with good fragrance, great, very beautiful, and glorious
  chosen_korean: 큰 나무들, 곧 향기가 좋고 크고 매우 아름답고 영광스러운 나무들
  alternatives_korean:
  - 큰 나무들, 곧 향기가 좋고 크고 매우 아름답고 찬란한 나무들
  - 큰 나무들, 곧 향기가 좋고 크며 매우 아름답고 영광스러운 나무들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 크기(‘큰’), 향기(‘향기가 좋고’), 미려함(‘매우 아름답고’), 영광/장엄함(‘영광스러운’)의 층위를 각각 살려 게에즈의 누적 수식을 보존했습니다.
- source_word: ዕፀ ጥበብ
  english_pob_choice: the tree of wisdom
  chosen_korean: 지혜의 나무
  alternatives_korean:
  - 지혜 나무
  - 지혜의 나무
  - 지혜를 주는 나무
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역 구조를 유지하되 한국어에서 자연스럽게 읽히는 소유격 구성을 택했습니다. ‘지혜를 주는’은 해석을 덧붙이므로 피했습니다.
- source_word: ዘእምኔሁ በሊዖሙ ይአምርዋ ለጥበብ ዐቢይ
  english_pob_choice: from which those who eat know great wisdom
  chosen_korean: 그 나무에서 먹는 사람들은 큰 지혜를 알게 됩니다
  alternatives_korean:
  - 그 나무를 먹는 사람들은 큰 지혜를 알게 됩니다
  - 그 나무에서 먹으면 큰 지혜를 알게 됩니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘먹는 사람들’로 행위의 주체를 분명히 하면서, 결과를 나타내는 동사 ‘알게 됩니다’로 원문의 인식 결과를 보존했습니다.
theological_decisions:
- issue: 지혜의 나무와 창세기식 조화 여부
  chosen_reading: ‘지혜의 나무’로 그대로 옮기고, 창세기의 특정 공식어로 바꾸지 않았습니다.
  alternative_readings:
  - 지식의 나무
  - 지혜를 주는 나무
  - 선악을 알게 하는 나무
  rationale: 이 본문은 창세기적 동산 이미지를 환기하지만, 게에즈는 분명히 ‘지혜’라고 말합니다. 번역에서 이를 다른 성경 공식어로 평준화하지 않고 본문의 고유한 신학적 표현을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 상호본문적 연상은 살리되 혼합하지 않음
- issue: ‘영광스러운’의 보존
  chosen_reading: 게에즈의 장엄함/영광을 나타내는 수식을 ‘영광스러운’으로 남겼습니다.
  alternative_readings:
  - 찬란한
  - 아름다운
  - 위엄 있는
  rationale: 형상 묘사가 단순 미적 표현을 넘어 비전적 장엄함을 띠므로, ‘아름다운’만으로 흡수하지 않고 별도 수식으로 보존했습니다.
  doctrine_reference: 환상 문맥의 누적 수식 보존
