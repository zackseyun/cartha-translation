  terminology: ‘에리트라해’는 영어 POB의 Erythraean Sea를 현대의 홍해로 단정하지 않고 보존한 적절한 처리입니다. ‘주트엘’은 에티오피아어 철자에 근거한 보수적 음역으로 유지할 수 있으며, 이명 표기는 각주로 처리하는 것이 적절합니다.
