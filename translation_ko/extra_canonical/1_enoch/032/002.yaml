  rationale: 고유명사는 음역으로 처리하되, 본문에는 가장 보수적인 표기인 ‘주트엘’을 택했습니다.
theological_decisions:
- issue: 고대 지명 보존
  chosen_reading: 에리트라해를 사용했습니다.
  alternative_readings:
