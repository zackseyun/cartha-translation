  chosen_korean: 그 산들
  alternatives_korean:
  - 그 언덕들
  - 그 봉우리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ዐד바르는 이 문맥에서 산을 뜻하므로, 시각적 규모를 살려 ‘산들’로 번역했습니다.
- source_word: ባሕረ ኤርትራ
  english_pob_choice: the Erythraean Sea
  chosen_korean: 에리트라해
  alternatives_korean:
