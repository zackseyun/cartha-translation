  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 고대 지명을 따라 ‘에리트라해’로 옮겨, 현대 지명으로 지나치게 좁히지 않았습니다.
- source_word: ተከንኩ
  english_pob_choice: I went far
  chosen_korean: 멀리 떨어져서
  alternatives_korean:
  - 멀리 갔으며
  - 멀리 떠나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어형이 다소 불확실하고 뒤의 ‘그것으로부터 멀리’와 이어지므로, 거리의 이동을 드러내는 절로 보수적으로 옮겼습니다.
- source_word: መልአክ ዙጥኤል
  english_pob_choice: the angel Zutel
  chosen_korean: 주트엘 천사
