base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/002.yaml
  text: And from there I went above the summits of those mountains[a], far to the east, and I crossed over the Erythraean Sea; and I went far from it[c][b], and passed above the angel Zutel.
  footnotes:
  - marker: a
    text: Or 'the Red Sea.' The ancient name 'Erythraean Sea' may refer more broadly than the modern Red Sea.
    reason: lexical_alternative
  - marker: b
    text: The angel's name may be vocalized differently in other editions or translations, such as 'Zutael.'
    reason: textual_variant
  - marker: c
    text: The clause rendered 'I went far from it' is difficult in the Ethiopic witness; the sense is continued travel away from the sea.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 거기서 나는 그 산들의 꼭대기 위를 지나 동쪽으로 멀리 갔으며, 에리트라해를 건너고, 거기로부터 멀리 떨어져서 주트엘 천사 위를 지나갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에리트라해’는 고대 지명으로, 문맥에 따라 현대의 홍해를 가리킬 수도 있습니다.
    reason: cross_reference
  - marker: b
    text: 이 천사 이름은 다른 전승이나 번역에서 ‘주타엘’로도 표기됩니다.
    reason: textual_variant
  - marker: c
    text: ‘거기로부터 멀리 떨어져서’는 에티오피아어 전승에서 다소 어려운 구절로, 바다에서 계속 멀어지는 이동을 가리키는 것으로 이해했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልተ ርእሶሙ
  english_pob_choice: above the summits
  chosen_korean: 그 산들의 꼭대기 위를
  alternatives_korean:
  - 그 산들의 머리 위를
  - 그 산들의 정상 위를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 산에 대한 ‘머리’는 한국어에서 자연스럽지 않으므로, 지형의 높은 지점을 분명히 드러내는 ‘꼭대기’로 옮겼습니다.
- source_word: ለእልኩ አድባር
  english_pob_choice: those mountains
  chosen_korean: 그 산들
  alternatives_korean:
  - 그 언덕들
  - 그 봉우리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ዐד바르는 이 문맥에서 산을 뜻하므로, 시각적 규모를 살려 ‘산들’로 번역했습니다.
- source_word: ባሕረ ኤርትራ
  english_pob_choice: the Erythraean Sea
  chosen_korean: 에리트라해
  alternatives_korean:
  - 홍해
  - 에리트레아해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 고대 지명을 따라 ‘에리트라해’로 옮겨, 현대 지명으로 지나치게 좁히지 않았습니다.
- source_word: ተከንኩ
  english_pob_choice: I went far
  chosen_korean: 멀리 떨어져서
  alternatives_korean:
  - 멀리 갔으며
  - 멀리 떠나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어형이 다소 불확실하고 뒤의 ‘그것으로부터 멀리’와 이어지므로, 거리의 이동을 드러내는 절로 보수적으로 옮겼습니다.
- source_word: መልአክ ዙጥኤል
  english_pob_choice: the angel Zutel
  chosen_korean: 주트엘 천사
  alternatives_korean:
  - 주타엘 천사
  - 주텔 천사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고유명사는 음역으로 처리하되, 본문에는 가장 보수적인 표기인 ‘주트엘’을 택했습니다.
theological_decisions:
- issue: 고대 지명 보존
  chosen_reading: 에리트라해를 사용했습니다.
  alternative_readings:
  - 홍해로 바꾸는 번역
  rationale: 이 구절은 교리적 진술보다 묵시적 지리 상상력을 전달하므로, 현대화보다 원문 전승의 고대 지명을 보존하는 편이 본문의 세계를 더 정확히 드러냅니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve apocalyptic imagery.'
- issue: 천사 이름의 음역
  chosen_reading: 주트엘로 음역했습니다.
  alternative_readings:
  - 주타엘, 주텔
  rationale: 이름은 뜻번역보다 음역이 원전의 고유성을 더 잘 보존하며, 전승 간 발음 차이는 주석으로 처리하는 것이 적절합니다.
  doctrine_reference: 고유명사 처리 원칙
