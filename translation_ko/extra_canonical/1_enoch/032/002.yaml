  rationale: 이 구절은 교리적 진술보다 묵시적 지리 상상력을 전달하므로, 현대화보다 원문 전승의 고대 지명을 보존하는 편이 본문의 세계를 더 정확히 드러냅니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; preserve apocalyptic imagery.'
