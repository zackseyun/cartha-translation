base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/001.yaml
  text: And after these[a], toward the south, as I looked over the mountains, I saw seven mountains full of choice nard and fragrant trees[c][b], and cinnamon and pepper.
  footnotes:
  - marker: a
    text: The expression rendered 'choice nard' is uncertain; it likely refers to a costly aromatic plant or spice. A broader rendering such as 'choice spices' is possible.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez lists luxury aromatics in sequence, underscoring the abundance and exotic character of the visionary landscape rather than giving a modern botanical inventory.
    reason: cultural_note
  - marker: c
    text: Or 'And after these, toward the south, as I looked, I saw seven mountains'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이들 뒤에, 북쪽으로, 내가 산들 위를 바라보았을 때, 향료로 가득한 일곱 산과 향기로운 나무들[a][b], 그리고 계피와 후추를 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 값비싼 향료나 향나무를 가리킬 수 있어, 구체 종명보다 넓은 의미가 더 안전합니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 향료와 향목의 열거를 통해 비전의 풍성함과 이국성을 강조합니다.
    reason: cultural_note
