  source_fidelity: 수정이 필요합니다. 게에즈어의 አፈው ለመስዕ은 ‘나는 남쪽으로 갔다’라는 이동을 나타내며, 초안의 ‘북쪽으로’는 방향이 반대이고 ‘갔다’가 빠져 있습니다. 또한 ሰንብላተ ቅድዋተ와 ዕፀ መዓዛ는 각각 귀한 나드(불확실한 향료)와 향기로운 나무를 가리키는 열거이므로 서로 합치거나 바꾸지 않는 것이 좋습니다.
  naturalness: ‘산들 위를 바라보았을 때’도 이해되지만, 비전의 시선이 산 너머/산 위쪽으로 향하는 문맥에는 ‘산들 너머를 바라보았을 때’가 현대 한국어에서 더 자연스럽습니다. 이동 동사를 명시하면 문장의 진행도 분명해집니다.
