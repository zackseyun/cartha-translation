base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/004.yaml
  text: And it looked like the carob tree[a], and its fruit was like clusters of good grapes, very beautiful[d][c][b]; and the fragrance of that tree spread far away.
  footnotes:
  - marker: a
    text: The tree name rendered 'tamarind' reflects a traditional identification of the Ge'ez expression, but the exact botanical species is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Literally, the fruit is compared with vine-fruit; 'clusters of good grapes' expresses the likely sense in idiomatic English.
    reason: lexical_alternative
  - marker: c
    text: Or 'tamarind'.
    reason: previous_rendering
  - marker: d
    text: Or 'like clusters of good grapes'.
    reason: previous_rendering
