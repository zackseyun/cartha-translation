  text: 그리고 그것은 캐롭나무처럼 보였고, 그 열매는 매우 아름다운 포도송이처럼 보였습니다. 그리고 그 나무의 향기는 멀리 퍼져 나갔습니다.
  philosophy: optimal-equivalence
