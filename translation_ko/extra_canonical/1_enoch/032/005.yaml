  text: 나는 말했습니다. “이것은 아름답습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 매우 짧지만, 문맥상 평서문으로 자연스럽게 읽힙니다. 영어 POB의 ‘It is beautiful’은 이해를 위한 보완입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘좋다/아름답다’도 가능하므로, 여기서는 미학적 감탄을 드러내는 ‘아름답습니다’를 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእቤ
  english_pob_choice: And I said
  chosen_korean: 나는 말했습니다
  alternatives_korean:
  - 그리고 나는 말했습니다
  - 그러자 나는 말했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서술 연결사 ወ는 단순한 이야기 전개로 보고, እቤ는 ‘말하다’의 1인칭 과거형이므로 자연스러운 현대 한국어 서술체로 옮겼습니다.
