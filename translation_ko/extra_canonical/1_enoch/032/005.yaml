  - 아름답습니다
  - 이것이 좋습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본 의미 ሠናይ(‘좋다, 아름답다, 훌륭하다’)에 더해, 뒤의 지시사 ዝ를 살려 ‘이것은’으로 옮겼습니다. 비전 장면의 감탄적 평가로서는 ‘아름답습니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 지시사 ዝ의 반영 여부
  chosen_reading: ‘이것은’으로 옮겨 원문에 있는 지시성을 드러냈습니다.
  alternative_readings:
  - 의미만 반영해 ‘그것은’으로 완화
  - 지시성을 생략하고 ‘아름답습니다’만 제시
  rationale: 주어진 게에즈 형태는 단순한 존재문이 아니라 지시성을 포함하므로, 한국어에서도 대상을 가리키는 뉘앙스를 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 원문 충실성 원칙
