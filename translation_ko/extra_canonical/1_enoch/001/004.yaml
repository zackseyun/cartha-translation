base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/004.yaml
  text: And the God of eternity[a], from there, will tread upon Mount Sinai; he will appear with his host[d][c][b], and he will appear in the strength of his might from heaven.
  footnotes:
  - marker: a
    text: The phrase translated “in his manifestation” is በትዕይንቱ, literally “in his appearance.” Some Greek witnesses have “from his camp,” a different image; the Ge’ez here points to a theophany (appearance) rather than an encampment.
    reason: textual_variant
  - marker: b
    text: “God of eternity” translates አምላክ ዓለም; it can also be read “God of the world/age.” The present rendering emphasizes duration rather than realm.
    reason: lexical_alternative
  - marker: c
    text: The verb ይከይድ is rendered “will tread” to retain the weighty theophanic imagery; alternatives include “will go/come forth.”
    reason: lexical_alternative
  - marker: d
    text: Or 'in his manifestation'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 영원의 하나님이 그곳에서 시내산 위로 걸어가실 것이며, 그분은 그분의 군대와 함께, 하늘에서 그 능력의 힘으로 나타나실 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ትዕይንት는 이 절에서 ‘나타남/현현’이 아니라 ‘진영, 군대, 무리(host)’의 의미로 이해하는 것이 최신 감사기록과 Ge‘ez 사전에 더 잘 맞습니다.
    reason: textual_variant
  - marker: b
    text: ‘영원의 하나님’은 አምላክ ዓለም을 시간적 지속성에 초점을 두어 옮긴 것입니다. ‘세상의 하나님’ 또는 ‘시대의 하나님’도 가능하지만, 여기서는 하나님의 영원성을 강조했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘위로 걸어가실 것이며’는 단순한 ‘가다/오다’보다 시내산 위를 밟으며 임하시는 신현적 장중함을 살리려는 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘그분의 능력의 힘’은 በኃይለ ጽንዑ의 겹친 강조를 그대로 드러내기 위한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምላከ ዓለም
  english_pob_choice: God of eternity
  chosen_korean: 영원의 하나님
  alternatives_korean:
  - 세상의 하나님
  - 시대의 하나님
  - 영원하신 하나님
  lexicon: Leslau, Comparative Dictionary of Ge‘ez; Dillmann, Lexicon Linguae Aethiopicae
  rationale: ዓለም은 ‘세계/시대’도 될 수 있지만, 여기서는 하나님의 지속성과 영원성을 드러내는 관형적 표현으로 읽는 것이 POB의 영어 해석과 Ge‘ez 문맥에 가장 잘 맞습니다.
- source_word: ይከይድ ዲበ
  english_pob_choice: will tread upon
  chosen_korean: 위로 걸어가실 것이며
  alternatives_korean:
  - 위에 발을 디디실 것이며
  - 위로 걸으실 것이며
  - 위로 나아가실 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 ‘밟다’보다 theophany의 장중한 이동 이미지를 살리면서도, 산 위에 임하시는 동작을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ትዕይንቱ
  english_pob_choice: with his host
  chosen_korean: 그분의 군대와 함께
  alternatives_korean:
  - 그분의 군사와 함께
  - 그분의 진영과 함께
  - 그분의 군대와 진과 함께
  lexicon: Leslau, Comparative Dictionary of Ge‘ez; Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최신 감사기록에 따라 ትዕይንት는 ‘나타남’이 아니라 ‘진영/군대/무리(host)’의 뜻으로 이해해야 하므로, 천상 군대를 가리키는 한국어로 옮겼습니다.
- source_word: በትዕይንቱ
  english_pob_choice: in his manifestation
  chosen_korean: 그분은
  alternatives_korean:
  - 그분의 나타나심으로
  - 그분의 현현으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구문은 이번 절에서 ‘나타남’이 아니라 ትዕይንቱ(그의 군대/진영)로 읽어야 하므로, 본문에서는 별도 의미를 부여하지 않고 앞의 ‘그분의 군대와 함께’로 처리했습니다.
- source_word: በኃይለ ጽንዑ
  english_pob_choice: in the strength of his might
  chosen_korean: 그분의 능력의 힘으로
  alternatives_korean:
  - 그분의 강한 힘으로
  - 그분의 위력의 힘으로
  - 그분의 힘과 권능으로
  lexicon: Leslau, Comparative Dictionary of Ge‘ez; Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 명사가 겹쳐지는 강조 구조를 한국어에서도 보이기 위해 ‘능력의 힘’으로 옮겨 중첩된 힘의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 신현(theophany) 장면에서의 ‘하나님이 시내산에 임하심’과 천상 군대 동반의 묘사
  chosen_reading: 하나님이 시내산 위로 걸어가시며 그분의 군대와 함께 나타나신다는 신현적 묘사로 읽었습니다.
  alternative_readings:
  - 단순한 지리적 이동 묘사
  - 군대의 비유 없이 단지 나타나심만 말하는 읽기
  rationale: 문맥상 이 절은 하나님의 거룩한 임재가 시내산에서 가시적으로 드러나는 장면이며, ‘군대/진영’ 이미지는 그 위엄과 호위를 함께 전달합니다.
  doctrine_reference: Translation philosophy §Original-language primacy; theophany imagery
