  - 하나님에 의해 눈이 열린
  rationale: 원문은 신적 행위로 비전의 가능성을 열어 준다는 점을 강조하므로, 능동적 은혜의 뉘앙스를 살렸습니다.
  doctrine_reference: 계시의 주도권은 하나님께 있다는 묵시문학적 이해를 반영합니다.
- issue: 하늘들 복수 관용구를 유지할지
  chosen_reading: 하늘들 가운데서
  alternative_readings:
  - 하늘에서
  - 하늘들 안에서
  rationale: 복수형 우주론 표현을 평평하게 만들지 않기 위해 ‘하늘들’을 유지했습니다.
  doctrine_reference: 시적·묵시적 우주론의 어법을 보존합니다.
