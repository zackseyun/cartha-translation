base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/002.yaml
  text: 'And Enoch answered and said: "A righteous man[a], whose eyes were opened by God, saw a holy vision in the heavens, which the angels showed me; and from them I heard everything, and I understood what I saw—but not for this generation[d][c][b], but for a distant one that is to come."'
  footnotes:
  - marker: a
    text: The clause about Enoch's eyes being opened by God is textually awkward in the Ethiopic OCR, but the sense is that his visionary sight was divinely opened or uncovered.
    reason: textual_variant
  - marker: b
    text: '''Heavens'' reflects the plural cosmological idiom common in Semitic and apocalyptic texts.'
    reason: cultural_note
  - marker: c
    text: Or 'but for a generation far away that will come.' The final phrase may be taken collectively or as a singular future generation.
    reason: lexical_alternative
  - marker: d
    text: Or 'And Enoch, a righteous man, answered and said—his eyes having been opened by God—"I saw'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 에녹이 대답하여 말했습니다. “하나님께서 눈을 열어 주신 의로운 사람이 하늘들 가운데서 거룩한 환상을 보았는데, 천사들이 그것을 나에게 보여 주었습니다. 나는 그들에게서 모든 것을 듣고, 내가 본 것을 깨달았습니다. 그러나 그것은 이 세대를 위한 것이 아니라, 머나먼 장차 올 세대를 위한 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘들’은 셈어·묵시문학에서 흔한 복수 우주론 관용구를 반영한 표현입니다.
    reason: cultural_note
  - marker: b
    text: ‘이 세대’는 현재의 세대를 가리키며, 대조되는 미래 세대와의 거리를 강조합니다.
    reason: cross_reference
  - marker: c
    text: ‘장차 올 세대’는 단수적 미래 세대 또는 집합적 미래 세대로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘대답하여 말했습니다’는 셈어식 서두 공식을 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: ወአውሥአ ወይቤ
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 말했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 셈어 계열의 서두 공식을 한국어에서 자연스럽게 옮기되, 단순한 ‘말했습니다’보다 응답의 뉘앙스를 살렸습니다.
- source_word: ብእሲ ጻድቅ
  english_pob_choice: a righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의인
  - 의로운 남자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 인물의 성격을 드러내는 표현으로 ‘의로운 사람’이 가장 자연스럽고, 문맥상 칭호화된 ‘의인’보다 덜 교회적입니다.
- source_word: ዘእምኀበ እግዚአብሔር [እንዘ] አዕይን ቲሁ ክሡታት
  english_pob_choice: his eyes having been opened by God
  chosen_korean: 하나님께서 눈을 열어 주신
  alternatives_korean:
  - 하나님에 의해 눈이 열린
  - 주님께서 눈을 열어 주신
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비전적 인식을 가능하게 한 신적 개방의 의미를 유지하기 위해 ‘눈을 열어 주신’으로 옮겼습니다.
- source_word: ራእየ ቅዱሰ
  english_pob_choice: a holy vision
  chosen_korean: 거룩한 환상
  alternatives_korean:
  - 성스러운 환상
  - 거룩한 이상
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언/묵시 문맥에서 ‘환상’이 가장 적절하며, ‘거룩한’은 비전의 성격을 보존합니다.
- source_word: ዘበሰማያት
  english_pob_choice: in the heavens
  chosen_korean: 하늘들 가운데서
  alternatives_korean:
  - 하늘에서
  - 하늘들 안에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수적 우주론 관용구를 반영해 ‘하늘들’을 살렸고, 장소성을 위해 ‘가운데서’를 더했습니다.
- source_word: ዘአርአዩኒ መላእክት
  english_pob_choice: which the angels showed me
  chosen_korean: 천사들이 그것을 나에게 보여 주었습니다
  alternatives_korean:
  - 천사들이 나에게 보여 주었습니다
  - 천사들이 그것을 내게 보이셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시대명사를 보충해 앞의 ‘거룩한 환상’을 가리키게 했고, 서술은 평서형으로 유지했습니다.
- source_word: ወሰማዕኩ እምኀቤሆሙ ኵሎ
  english_pob_choice: and from them I heard everything
  chosen_korean: 나는 그들에게서 모든 것을 듣고
  alternatives_korean:
  - 그들에게서 모든 것을 들었고
  - 나는 그들로부터 다 들었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘모든 것’을 그대로 살리면서도 한국어 연결을 자연스럽게 하기 위해 동사들을 연속 구조로 옮겼습니다.
- source_word: ወአእመርኩ አነ ዘእሬኢ
  english_pob_choice: and I understood what I saw
  chosen_korean: 내가 본 것을 깨달았습니다
  alternatives_korean:
  - 내가 본 것을 이해했습니다
  - 내가 본 바를 알게 되었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 시각이 아니라 이해/파악의 의미를 살려 ‘깨달았습니다’로 옮겼습니다.
- source_word: ወአኮ ለዛ ትውልድ አላ ለዘ ይመጽእ ርኁቃት
  english_pob_choice: but not for this generation, rather for one far off that is to come
  chosen_korean: 그러나 그것은 이 세대를 위한 것이 아니라, 머나먼 장차 올 세대를 위한 것입니다
  alternatives_korean:
  - 그러나 그것은 이 세대를 위한 것이 아니라, 먼 훗날 올 세대를 위한 것입니다
  - 그러나 그것은 이 세대를 위한 것이 아니라, 멀리 있는 장래의 세대를 위한 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘세대’와 거리감을 함께 보존하되, 한국어에서 자연스러운 미래지향 표현으로 ‘머나먼 장차 올’로 옮겼습니다.
