  source_fidelity: 수정이 필요합니다. ትጉሃን(təguhan)은 기본적으로 ‘깨어 있는/경계하는 이들’을 뜻하지만, 『1 에녹』 에티오피아어 본문에서는 ‘Watchers’를 가리키는 통상적·기술적 명칭입니다. 이 구절에서는 단순한 성격 묘사인 ‘깨어 있는 이들’보다 이를 반영한 ‘감시자들’이 본문 및 작품 내 용례에 더 충실합니다. 나머지 구문, 곧 모든 이의 두려움, 감시자들의 떨림, 두려움과 큰 떨림이 그들을 사로잡는다는 표현, 그리고 땅 끝까지의 범위는 충실합니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. 다만 각주 표지가 모두 문장 끝에 몰려 있어 어느 표현을 설명하는지 불분명합니다. 해당 어구 가까이에 표지를 배치하고, ‘땅의 끝’은 현대 한국어에서 자연스러운 ‘땅 끝’으로 다듬었습니다.
  terminology: ‘감시자들’은 여기서 ትጉሃን의 기술적 용례를 반영하는 번역입니다. 이는 특정 교리적 동일시를 덧붙이는 것이 아니라 『1 에녹』 안에서 반복되는 명칭을 번역하는 것입니다. 각주에서 문자적 의미와 용례를 밝혀 의미 범위를 투명하게 했습니다.
