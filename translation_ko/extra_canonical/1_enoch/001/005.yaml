base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/005.yaml
  text: And all will fear[a], and the vigilant ones will tremble[c][b]; and fear and great trembling will seize them as far as the ends of the earth.
  footnotes:
  - marker: a
    text: The phrase “the mighty ones” translates a generic term for strong/powerful beings. Some interpreters take it to refer to the Watchers (angelic beings) in this section, but the Ethiopic here does not use the usual technical term for Watchers.
    reason: lexical_alternative
  - marker: b
    text: “As far as the ends of the earth” is a Semitic idiom describing universal scope—the whole world to its furthest limits.
    reason: cultural_note
  - marker: c
    text: Or 'the mighty ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 이가 두려워할 것이며[a], 감시자들은 떨 것입니다[c]. 두려움과 큰 떨림이 땅 끝까지[b] 그들을 사로잡을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 동사는 여기서 앞으로 일어날 일을 나타내는 미완료형입니다.
    reason: lexical_alternative
  - marker: b
    text: “땅 끝까지”는 온 세계의 가장 먼 경계까지를 뜻하는 셈어식 관용구입니다.
    reason: cultural_note
  - marker: c
    text: ‘감시자들’은 문자적으로는 ‘깨어 있는 이들’이라는 뜻이며, 『1 에녹』에서는 천상 존재인 ‘Watchers’를 가리키는 통상적 명칭입니다.
    reason: previous_rendering
