  rationale: 히브리계 종말론적 관용구의 범위를 살리되, 현대 한국어에서 이해되기 쉬운 직역형 표현을 택했습니다.
theological_decisions:
- issue: ትጉሃን의 정체를 특정 호칭으로 고정할지 여부
  chosen_reading: ‘깨어 있는 이들’로 옮겨, 본문이 직접 말하는 성격만 드러내고 ‘Watchers’라는 해석적 명칭은 본문에 넣지 않았습니다.
  alternative_readings:
