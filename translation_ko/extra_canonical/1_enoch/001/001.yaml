  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 종말론적 재난을 가리키지만, 용어 자체는 ‘affliction/tribulation/distress’의 폭을 지니므로 과도하게 좁히지 않는 ‘환난’으로 정했습니다.
