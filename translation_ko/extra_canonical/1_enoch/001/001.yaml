base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
  footnotes:
  - marker: a
    text: '''Henok'' follows the Ge''ez form of the name; the more familiar English form is ''Enoch.'''
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'day of affliction' may also be understood as 'day of distress' or 'day of tribulation.'
    reason: lexical_alternative
  - marker: c
    text: 'The final pair distinguishes two classes of the condemned: the wicked and the godless/impious.'
    reason: cultural_note
translation:
  language: ko
  text: 에녹의 축복의 말씀은 이러합니다. 그가 환난의 날에 있을 선택받은 자들과 의인들을 복 주셨으니, 이는 모든 악인들과 불경한 자들을 제거하려 하심입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에녹’은 본문의 게에즈형 이름을 한국어로 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: ‘환난’은 여기서 고난, 압박, 재난의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 ‘악인’과 ‘불경한 자’를 구별된 두 부류로 제시합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ቃለ በረከት
  english_pob_choice: The words of the blessing
  chosen_korean: 축복의 말씀
  alternatives_korean:
  - 축복의 말들
  - 축복의 말씀들
  - 복의 말씀
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서두의 명사구는 제목처럼 기능하므로, ‘말씀’으로 간결하게 살리고 ‘축복’의 내용을 자연스럽게 드러냈습니다.
- source_word: ዘሄኖክ
  english_pob_choice: Henok
  chosen_korean: 에녹
  alternatives_korean:
  - 헤녹
  - 한녹
  lexicon: 고유명사 표기 관례
  rationale: 지혜/묵시 전통에서 한국어로는 ‘에녹’이 가장 널리 통용되므로, 본문 가독성을 위해 이를 채택했습니다.
- source_word: ኅሩያነ ወጻድቃነ
  english_pob_choice: the chosen and the righteous
  chosen_korean: 선택받은 자들과 의인들
  alternatives_korean:
  - 택함받은 자들과 의인들
  - 택자들과 의인들
  - 선택된 자들과 의로운 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 범주를 각각 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘선택받은 자들’과 ‘의인들’로 옮겼습니다.
- source_word: በዕለተ ምንዳቤ
  english_pob_choice: on the day of affliction
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 고난의 날에
  - 고통의 날에
  - 환난의 때에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 종말론적 재난을 가리키지만, 용어 자체는 ‘affliction/tribulation/distress’의 폭을 지니므로 과도하게 좁히지 않는 ‘환난’으로 정했습니다.
- source_word: ለአሰስሎ ኵሎ እኩያነ ወረሲዓነ
  english_pob_choice: for the removal of all the wicked and godless
  chosen_korean: 모든 악인들과 불경한 자들을 제거하려 하심입니다
  alternatives_korean:
  - 모든 악인들과 경건하지 않은 자들을 없애려 하심입니다
  - 모든 악인들과 불경한 자들을 쫓아내려 하심입니다
  - 모든 악한 자들과 불경한 자들을 제거하려 하심입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘제거하다’는 심판의 목적을 분명히 하면서도, 두 집단—‘악인’과 ‘불경한 자’—의 구분을 유지합니다.
theological_decisions:
- issue: ‘선택받은 자들’과 ‘의인들’의 관계
  chosen_reading: 두 범주를 병렬로 유지했습니다.
  alternative_readings:
  - ‘선택받은 의인들’로 합쳐 번역
  - ‘택함받은 의인들’로 압축
  rationale: 게에즈 원문은 두 명사를 나란히 두어 묵시적 공동체의 두 표지를 모두 제시하므로, 한국어에서도 구분을 살려 원문의 범주성을 보존했습니다.
  doctrine_reference: 원문 범주 보존 원칙; 합치기보다 병렬 유지
- issue: ‘환난의 날’의 종말론적 뉘앙스
  chosen_reading: ‘환난의 날’로 번역하되 심판성을 본문에서 과도하게 명시하지 않았습니다.
  alternative_readings:
  - ‘환난과 심판의 날’
  - ‘대환난의 날’
  - ‘고통의 심판 날’
  rationale: 원어의 핵심은 고통/압박의 날이지, 어휘 자체가 곧바로 ‘심판’을 뜻하지는 않으므로, 종말론적 긴장은 유지하되 어휘의 폭을 보존했습니다.
  doctrine_reference: 의미 범위 보존; 신학적 긴장 유지
