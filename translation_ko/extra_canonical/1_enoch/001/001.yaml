  naturalness: 현대 표준 한국어 합쇼체로 자연스럽게 다듬었습니다. ‘선택받은 자들’은 다소 무거우므로 원문의 범주를 유지하면서 ‘선택된 이들’로, ‘복 주셨으니’는 자연스러운 ‘복을 빈’으로 고쳤습니다.
  terminology: ‘에녹’은 한국어 성서·관련 문헌의 통용 표기로 유지했습니다. ‘선택된 이들’, ‘의인들’, ‘환난의 날’, ‘악인들’, ‘불경한 자들’은 각각 원문의 병렬 범주와 의미 범위를 유지합니다. 이름 각주는 ‘에녹’이 게에즈어 형태를 음역한 표기라는 부정확한 진술을 피하도록 수정했습니다.
