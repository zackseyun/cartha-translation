base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
  footnotes:
  - marker: a
    text: '''Henok'' follows the Ge''ez form of the name; the more familiar English form is ''Enoch.'''
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'day of affliction' may also be understood as 'day of distress' or 'day of tribulation.'
    reason: lexical_alternative
  - marker: c
    text: 'The final pair distinguishes two classes of the condemned: the wicked and the godless/impious.'
    reason: cultural_note
translation:
  language: ko
  text: 에녹[a]이 환난의 날[b]에 있을 선택된 이들과 의인들에게 복을 빈 축복의 말씀입니다. 이 날은 모든 악인들과 불경한 자들을 제거하기 위한 날입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에녹’은 게에즈어 이름 ሄኖክ(Henok)에 해당하는 한국어 통용 표기입니다.
    reason: source_note
  - marker: b
    text: ‘환난’은 여기서 고난, 압박, 재난의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 ‘악인들’과 ‘불경한 자들’을 구별된 두 부류로 제시합니다.
    reason: cultural_note
