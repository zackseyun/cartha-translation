  to: 에녹[a]이 환난의 날[b]에 있을 선택된 이들과 의인들에게 복을 빈 축복의 말씀입니다. 이 날은 모든 악인들과 불경한 자들을 제거하기 위한 날입니다.[c]
  rationale: 문법 오류를 바로잡고, 제목형 서두에 맞게 ‘에녹이 … 복을 빈 축복의 말씀’으로 원문의 관계절을 자연스럽게 재구성했습니다. ‘환난의 날’과 ‘제거하기 위한’의 연결을 명시하되, 제거 행위의 주체나 심판의 세부 양상은 원문 이상으로 보태지 않았습니다. 세 각주 표지도 각각 해당 어구에 유지했습니다.
