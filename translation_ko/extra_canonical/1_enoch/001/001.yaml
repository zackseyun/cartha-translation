theological_decisions:
- issue: ‘선택받은 자들’과 ‘의인들’의 관계
  chosen_reading: 두 범주를 병렬로 유지했습니다.
  alternative_readings:
  - ‘선택받은 의인들’로 합쳐 번역
  - ‘택함받은 의인들’로 압축
  rationale: 게에즈 원문은 두 명사를 나란히 두어 묵시적 공동체의 두 표지를 모두 제시하므로, 한국어에서도 구분을 살려 원문의 범주성을 보존했습니다.
  doctrine_reference: 원문 범주 보존 원칙; 합치기보다 병렬 유지
- issue: ‘환난의 날’의 종말론적 뉘앙스
  chosen_reading: ‘환난의 날’로 번역하되 심판성을 본문에서 과도하게 명시하지 않았습니다.
  alternative_readings:
  - ‘환난과 심판의 날’
  - ‘대환난의 날’
  - ‘고통의 심판 날’
  rationale: 원어의 핵심은 고통/압박의 날이지, 어휘 자체가 곧바로 ‘심판’을 뜻하지는 않으므로, 종말론적 긴장은 유지하되 어휘의 폭을 보존했습니다.
  doctrine_reference: 의미 범위 보존; 신학적 긴장 유지
