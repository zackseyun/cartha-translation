base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
  footnotes:
  - marker: a
    text: Or 'everything that is on the earth.' The Ge'ez reads literally 'everything that is in the earth.'
    reason: lexical_alternative
  - marker: b
    text: The noun rendered 'judgment' can also be understood as 'justice' or 'righteousness,' but here it functions as a coming act against all.
    reason: lexical_alternative
  - marker: c
    text: Or 'And the earth shall be shaken,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 땅이 갈라지고, 땅 안에 있는 모든 것이 파괴되며, 심판이 모든 사람 위에 임할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘땅 안에 있는 모든 것’입니다.
    reason: source_note
  - marker: b
    text: ‘심판’으로도, 문맥에 따라 ‘의’ 또는 ‘공의’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወትሠጠጥ / earth shall be rent asunder
  english_pob_choice: And the earth shall be rent asunder
  chosen_korean: 땅이 갈라지고
  alternatives_korean:
  - 땅이 찢어지고
  - 땅이 쪼개지고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사와 영어 POB의 ‘rent asunder’가 가리키는 것은 단순한 흔들림이 아니라 찢기듯 분열되는 이미지이므로, 이를 가장 자연스럽게 드러내는 ‘갈라지고’를 택했습니다.
- source_word: ኵሉ ዘውስተ ምድር
  english_pob_choice: everything that is in the earth
  chosen_korean: 땅 안에 있는 모든 것
  alternatives_korean:
  - 땅 위에 있는 모든 것
  - 그 안의 모든 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈는 문자적으로 ‘땅 안에 있는 모든 것’이라고 되어 있으므로, POB의 주석이 지적하듯 이 내부성의 뉘앙스를 살려 직역에 가깝게 옮겼습니다.
- source_word: ይትሐጐል
  english_pob_choice: shall be destroyed
  chosen_korean: 파괴되며
  alternatives_korean:
  - 멸망하며
  - 사라지며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 멸실·파멸의 의미를 가지므로, 종말론적 심판 문맥에 맞는 일반적이고 강한 표현인 ‘파괴되며’를 사용했습니다.
- source_word: ፍትሕ
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 공의
  - 의
  - 정의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 명사는 의미상 ‘의/공의’와도 겹치지만, 문맥상 ‘모든 사람 위에 임할’ 행위적이고 종말론적인 처분을 가리키므로 ‘심판’이 가장 적절합니다.
theological_decisions:
- issue: ፍትሕ을 ‘의/공의’로 읽을지, 종말론적 행위인 ‘심판’으로 읽을지
  chosen_reading: 심판
  alternative_readings:
  - 의
  - 공의
  - 정의
  rationale: 동사구 ‘모든 사람 위에 임할 것입니다’가 추상적 덕목이 아니라 모든 이를 향한 하나님의 판결 사건을 요구하므로, 본문의 아포칼립스적 긴장을 살려 ‘심판’으로 번역했습니다.
  doctrine_reference: Preserve theological tension rather than resolving contested terms into a softened abstraction
