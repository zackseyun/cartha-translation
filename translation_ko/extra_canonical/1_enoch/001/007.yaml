  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
  footnotes:
  - marker: a
    text: Or 'everything that is on the earth.' The Ge'ez reads literally 'everything that is in the earth.'
    reason: lexical_alternative
  - marker: b
    text: The noun rendered 'judgment' can also be understood as 'justice' or 'righteousness,' but here it functions as a coming act against all.
    reason: lexical_alternative
  - marker: c
    text: Or 'And the earth shall be shaken,'.
    reason: previous_rendering
