theological_decisions:
- issue: ‘거룩한 이들’의 범주
  chosen_reading: ‘거룩한 이들’로 두어 천상 수행단을 암시하되, 천사나 성도로 미리 한정하지 않았습니다.
  alternative_readings:
  - 천사들
  - 성도들
  rationale: 원문은 다수의 거룩한 존재를 말하지만 범주를 명시하지 않으므로, 해석을 지나치게 좁히지 않았습니다.
  doctrine_reference: 원문이 허용하는 범위에서 의미의 긴장을 보존
- issue: ‘모든 육체’의 보편성
  chosen_reading: ‘모든 육체’로 유지해 인류 전체에 대한 전면적 심판·책망을 드러냈습니다.
  alternative_readings:
  - 모든 사람
  - 온 인류
  rationale: 관용구를 평탄화하지 않고, 예언적·묵시적 어조를 보존했습니다.
  doctrine_reference: 성경적 관용구의 보존
