translation:
  language: ko
  text: 높은 산들은 흔들리고, 높은 언덕들은 낮아질 것이며, 그들은 불길 앞에서 밀랍처럼 녹을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይደነግፁ
  english_pob_choice: will quake
  chosen_korean: 흔들리고
  alternatives_korean:
  - 떨리고
  - 진동하고
  - 뒤흔들리고
  lexicon: Leslau; Dillmann
  rationale: 산이 스스로 반응하는 역동적 이미지를 살리기 위해 수동적인 ‘흔들리다’를 택했습니다. ‘떨리다’도 가능하지만, 지각 전체가 요동하는 장면에는 ‘흔들리다’가 더 자연스럽습니다.
- source_word: አድባር ነዋኀን / አውግር ነዋኃት
  english_pob_choice: lofty mountains / high hills
  chosen_korean: 높은 산들 / 높은 언덕들
  alternatives_korean:
  - 고원들 / 산등성들
  - 우뚝한 산들 / 높은 구릉들
  lexicon: Leslau; Dillmann
  rationale: 산과 언덕의 병렬을 그대로 살리되, 높이를 나타내는 형용사를 평이한 현대 한국어로 옮겼습니다. ‘높은’은 원문의 지형 대비와 시각적 대칭을 가장 직접적으로 전달합니다.
- source_word: ይቴሐቱ
  english_pob_choice: will be brought low
  chosen_korean: 낮아질 것이며
  alternatives_korean:
  - 낮추어질 것이며
  - 낮아지게 될 것이며
  - 겸손해질 것이며
  lexicon: Leslau; Dillmann
  rationale: 지형에 대한 표현이므로 도덕적 의미인 ‘겸손해지다’는 피하고, 높이가 내려가는 물리적 변화로 옮겼습니다. ‘낮아지다’가 가장 간결하고 원문의 역전 이미지를 잘 드러냅니다.
- source_word: ይትመሰዉ ከመ መዓረ ግራ እም ላህብ
  english_pob_choice: will melt like wax before the blaze
  chosen_korean: 불길 앞에서 밀랍처럼 녹을 것입니다
  alternatives_korean:
  - 불꽃 앞에서 밀랍처럼 녹을 것입니다
  - 화염 앞에서 밀랍처럼 녹을 것입니다
  - 불 앞에서 밀랍처럼 녹을 것입니다
  lexicon: Leslau; Dillmann
  rationale: ‘밀랍’은 원문의 wax를 직접적으로 반영하며, ‘불길’은 blaze/flame의 강렬함을 살립니다. ‘앞에서’는 원문의 대비 관계를 자연스럽게 옮긴 표현입니다.
theological_decisions:
- issue: 우주적 심판 장면의 의인화
  chosen_reading: 산과 언덕을 실제로 흔들리고 낮아지고 녹는 것으로 직역해, 묵시적 심판의 압도감을 유지했습니다.
  alternative_readings:
  - 상징적으로 ‘무너지고 사라진다’고 완화하는 읽기
  - 비유적 의미를 앞세워 자연 질서의 전복으로 풀어 쓰는 읽기
  rationale: 본문은 자연물에 대한 강한 종말론적 묘사를 사용하므로, 상징적 완화보다 원문의 물리적 이미지를 보존하는 것이 더 충실합니다.
  doctrine_reference: 묵시문학의 심판 표상 보존
- issue: ‘불길’의 강도
  chosen_reading: 문맥상 단순한 불이 아니라 타오르는 화염의 강도를 지닌 표현으로 옮겼습니다.
  alternative_readings:
  - ‘불’로 단순화하는 읽기
  - ‘화염’으로 더 기술적으로 옮기는 읽기
  rationale: 영어 POB의 ‘blaze’와 게으즈 원문의 ላህብ은 강한 타오름을 시사하므로, 한국어에서는 너무 약한 ‘불’보다 ‘불길’이 더 적합합니다.
  doctrine_reference: 어휘 강도 보존
- issue: 밀랍의 비교
  chosen_reading: ‘밀랍처럼’이라는 비교를 유지해, 열 앞에서 완전히 녹아내리는 취약성을 분명히 했습니다.
  alternative_readings:
  - ‘왁스처럼’으로 음차성 유지
  - 비유를 약화해 ‘쉽게 녹아’로 의역
  rationale: 한국어 성경 문맥에서도 ‘밀랍처럼 녹다’는 직관적으로 이해되며, 원문의 물질적 비유를 가장 잘 보존합니다.
  doctrine_reference: 비유적 이미지 보존
