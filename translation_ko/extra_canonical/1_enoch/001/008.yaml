base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
  footnotes:
  - marker: a
    text: The opening words appear textually awkward in the OCR witness, but the sense clearly turns to God's favor toward the righteous.
    reason: textual_variant
  - marker: b
    text: The verb rendered 'prosper' may also be understood more generally as 'do well' or 'flourish.'
    reason: lexical_alternative
  - marker: c
    text: Or 'make peace with the righteous'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 의인들에게 평강을 베푸시고, 선택된 이들을 지키시며, 그들 위에 은총이 있을 것이며, 그들은 모두 하나님께 속하게 되고, 번성하고 복을 받으며, 하나님의 빛이 그들 위에 비칠 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 첫 부분은 전승된 본문에서 문장 배열이 다소 어색하지만, 의미는 분명히 의인들에게 베풀어지는 하나님의 평강을 가리킵니다.
    reason: textual_variant
  - marker: b
    text: 원문의 동사는 더 넓게는 ‘잘되다’, ‘형통하다’ 또는 ‘번영하다’라는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘의인들에게 평강을 이루시고’.
    reason: previous_rendering
lexical_decisions:
- source_word: ሰላመ ይገብር
  english_pob_choice: make peace for / grant peace to
  chosen_korean: 평강을 이루시고
  alternatives_korean:
  - 평강을 주시고
  - 평강을 베푸시고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 '평강을 주다'보다, 원문 동사의 적극적 형상과 공적·결정적 행위를 살려 '평강을 이루시다'로 옮겼습니다.
