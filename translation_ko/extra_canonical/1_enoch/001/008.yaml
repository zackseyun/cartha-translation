base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
  footnotes:
  - marker: a
    text: The opening words appear textually awkward in the OCR witness, but the sense clearly turns to God's favor toward the righteous.
    reason: textual_variant
  - marker: b
    text: The verb rendered 'prosper' may also be understood more generally as 'do well' or 'flourish.'
    reason: lexical_alternative
  - marker: c
    text: Or 'make peace with the righteous'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 의인들에게 평강을 이루시고, 선택된 이들을 지키시며, 그들 위에 은총이 있을 것이며, 그들은 모두 하나님의 것이 되고, 번성하며 복을 받을 것이고, 하나님의 빛이 그들 위에 비칠 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 첫 절은 문장 배열이 다소 거칠지만, 의미는 분명히 의인들에게 향하는 하나님의 평강을 말합니다.
    reason: textual_variant
  - marker: b
    text: 원문의 동사는 더 넓게는 '잘되다', '형통하다'는 뜻으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '의인들과 더불어 평강을 이루시고'.
    reason: previous_rendering
lexical_decisions:
- source_word: ሰላመ ይገብር
  english_pob_choice: make peace for / grant peace to
  chosen_korean: 평강을 이루시고
  alternatives_korean:
  - 평강을 주시고
  - 평강을 베푸시고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 '평강을 주다'보다, 원문 동사의 적극적 형상과 공적·결정적 행위를 살려 '평강을 이루시다'로 옮겼습니다.
- source_word: የዓቅቦሙ
  english_pob_choice: guard them
  chosen_korean: 지키시며
  alternatives_korean:
  - 보호하시며
  - 간수하시며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보존·보호의 의미를 담되, 한국어에서 자연스럽고 격조 있는 동사인 '지키다'로 간결하게 옮겼습니다.
- source_word: ሕሩያን
  english_pob_choice: the chosen ones
  chosen_korean: 선택된 이들
  alternatives_korean:
  - 택하신 이들
  - 택자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''선택된 이들''은 원문의 표지를 분명히 드러내면서도, 후대 교리 용어인 ''택자''보다 덜 후행적입니다.'
- source_word: ሣህል
  english_pob_choice: favor
  chosen_korean: 은총
  alternatives_korean:
  - 호의
  - 은혜
  - 자비
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 긍정적 호의가 그들 위에 임하는 장면이어서 '은총'이 가장 간결하게 대응하며, '은혜'보다 여기서는 덜 신학적으로 고정됩니다.
- source_word: ዘአምላክ
  english_pob_choice: belong to God / be God's
  chosen_korean: 하나님의 것이 되고
  alternatives_korean:
  - 하나님께 속하게 되고
  - 하나님께 속한 자가 되고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유·귀속의 관계를 한국어 관용으로 드러내기 위해 '하나님의 것이 되다'를 택했습니다.
- source_word: ይሴርሑ
  english_pob_choice: prosper
  chosen_korean: 번성하며
  alternatives_korean:
  - 형통하며
  - 잘되며
  - 번영하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 물질적 번영보다 삶의 확장과 잘됨을 넓게 담는 '번성하다'가 문맥에 가장 잘 맞습니다.
- source_word: ይትባረኩ
  english_pob_choice: be blessed
  chosen_korean: 복을 받을 것이고
  alternatives_korean:
  - 복되며
  - 축복을 받을 것이고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형의 축복 상태를 직접적으로 드러내기 위해 '복을 받을 것'으로 옮겼습니다.
- source_word: ብርሃነ አምላክ
  english_pob_choice: the light of God
  chosen_korean: 하나님의 빛
  alternatives_korean:
  - 하나님의 빛
  - 신적 빛
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 소유격 관계를 그대로 살려 '하나님의 빛'으로 번역하고, 시적 주어를 자연스럽게 정리했습니다.
theological_decisions:
- issue: '''the righteous''와 ''the chosen ones''의 관계'
  chosen_reading: 둘을 병렬된 두 집단 표지로 유지했습니다.
  alternative_readings:
  - 하나의 대상로 합쳐서 '의인들'만 번역
  - '''선택받은 자들''로 교리적으로 더 강하게 표기'
  rationale: 원문은 두 호칭을 연속해 배치하므로, 이를 합치지 않고 각각 살려 텍스트 내부의 강조를 보존했습니다.
  doctrine_reference: Translation philosophy §1 원어 우선; §3 텍스트의 병렬 구조 보존
- issue: '''하나님의 것이 되고''의 의미'
  chosen_reading: 소속·귀속을 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - '''하나님께 속한 사람들''로 풀어쓰기'
  - '''경건한 자들''처럼 성품 중심으로 이해'
  rationale: 문맥은 도덕적 성격보다 하나님께 속함을 말하므로, 소유 관계를 직접 드러내는 번역이 더 정확합니다.
  doctrine_reference: Translation philosophy §1 원어 우선
