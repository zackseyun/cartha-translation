  - 간수하시며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보존·보호의 의미를 담되, 한국어에서 자연스럽고 격조 있는 동사인 '지키다'로 간결하게 옮겼습니다.
- source_word: ሕሩያን
  english_pob_choice: the chosen ones
  chosen_korean: 선택된 이들
  alternatives_korean:
  - 택하신 이들
