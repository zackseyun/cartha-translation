  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''선택된 이들''은 원문의 표지를 분명히 드러내면서도, 후대 교리 용어인 ''택자''보다 덜 후행적입니다.'
- source_word: ሣህል
  english_pob_choice: favor
  chosen_korean: 은총
  alternatives_korean:
  - 호의
  - 은혜
  - 자비
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 긍정적 호의가 그들 위에 임하는 장면이어서 '은총'이 가장 간결하게 대응하며, '은혜'보다 여기서는 덜 신학적으로 고정됩니다.
- source_word: ዘአምላክ
  english_pob_choice: belong to God / be God's
  chosen_korean: 하나님의 것이 되고
  alternatives_korean:
  - 하나님께 속하게 되고
  - 하나님께 속한 자가 되고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유·귀속의 관계를 한국어 관용으로 드러내기 위해 '하나님의 것이 되다'를 택했습니다.
- source_word: ይሴርሑ
  english_pob_choice: prosper
  chosen_korean: 번성하며
  alternatives_korean:
  - 형통하며
  - 잘되며
  - 번영하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 물질적 번영보다 삶의 확장과 잘됨을 넓게 담는 '번성하다'가 문맥에 가장 잘 맞습니다.
- source_word: ይትባረኩ
  english_pob_choice: be blessed
  chosen_korean: 복을 받을 것이고
  alternatives_korean:
