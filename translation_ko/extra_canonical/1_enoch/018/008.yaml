base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
  footnotes:
  - marker: a
    text: The stone term rendered 'crystal' is lexically uncertain; it denotes a bright or precious material in this throne vision.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'the top of the throne' is difficult; it may refer more generally to the upper part or summit of the structure associated with the throne.
    reason: alternative_reading
  - marker: c
    text: Or 'And in the middle it reached up'.
    reason: previous_rendering
  - marker: d
    text: Or 'and the top of the throne was of crystal stone, and its foundation was of sapphire stone.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 가운데 것은 하늘까지 닿았으며[a], 주님의 보좌와 같았는데, 그것은 수정 돌로 되어 있었고[d][c][b], 보좌의 윗부분은 사파이어 돌로 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 돌의 명칭은 어휘적으로 불확실하며, 이 보좌 환상에서 밝거나 귀한 재질을 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보좌의 윗부분’은 본문상 보좌 구조의 상부나 정상 전체를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 직역하면 ‘중간에 하늘까지 닿았다’에 가깝습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘보좌의 윗부분은 수정 돌이었고, 그 기초는 사파이어 돌이었다’로 이해할 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ይጐድእ
  english_pob_choice: reached up
  chosen_korean: 하늘까지 닿았으며
  alternatives_korean:
