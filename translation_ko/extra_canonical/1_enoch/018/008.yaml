  - 하늘까지 뻗어 있었으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 위로 뻗거나 닿는 움직임을 가리키므로, 환상적 수직 확장을 살리는 ‘하늘까지 닿았으며’가 가장 자연스럽습니다.
- source_word: ከመ መንበረ ለእግዚአብሔር
  english_pob_choice: like the throne of the Lord
  chosen_korean: 주님의 보좌와 같았는데
  alternatives_korean:
