  rationale: 이 구절은 보좌의 ‘윗부분’ 또는 ‘정상’을 가리키는 것으로 보이므로, 구조적 이미지를 보존하는 ‘윗부분’으로 처리했습니다.
- source_word: እምእብነ ሰንፔር
  english_pob_choice: of sapphire stone
  chosen_korean: 사파이어 돌로 되어 있었습니다
  alternatives_korean:
  - 사파이어로 되어 있었습니다
  - 청옥 돌로 되어 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보석명은 통상 ‘사파이어’로 옮기되, Ge'ez의 물질 표현을 반영해 ‘돌로 되어 있었습니다’를 유지했습니다.
