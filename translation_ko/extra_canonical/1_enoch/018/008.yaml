  - 청옥 돌로 되어 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보석명은 통상 ‘사파이어’로 옮기되, Ge'ez의 물질 표현을 반영해 ‘돌로 되어 있었습니다’를 유지했습니다.
