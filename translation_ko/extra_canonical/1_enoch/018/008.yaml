  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 돌 이름은 어휘적으로 불확실하지만 밝고 빛나는 재질을 가리키므로, 의미를 좁히지 않는 ‘수정 돌’로 옮겼습니다.
- source_word: ይማሑ ለመንበሩ
  english_pob_choice: the top of the throne
  chosen_korean: 보좌의 윗부분은
