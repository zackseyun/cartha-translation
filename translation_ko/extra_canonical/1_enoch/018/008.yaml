base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
  footnotes:
  - marker: a
    text: The stone term rendered 'crystal' is lexically uncertain; it denotes a bright or precious material in this throne vision.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'the top of the throne' is difficult; it may refer more generally to the upper part or summit of the structure associated with the throne.
    reason: alternative_reading
  - marker: c
    text: Or 'And in the middle it reached up'.
    reason: previous_rendering
  - marker: d
    text: Or 'and the top of the throne was of crystal stone, and its foundation was of sapphire stone.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 가운데 것은 하늘까지 뻗어 올라가 주님의 보좌와 같았습니다. 그 보좌는 수정석[a]으로 되어 있었고, 그 윗부분[b]은 사파이어로 되어 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수정석’으로 옮긴 돌의 명칭은 어휘적으로 확실하지 않습니다. 이 보좌 환상에서는 밝거나 귀한 재질을 가리키는 말로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 윗부분’은 보좌와 관련된 구조물의 상부 또는 정상을 더 넓게 가리킬 수도 있습니다.
    reason: alternative_reading
