  rationale: 비교 표지 ከመ를 살려 동일시가 아니라 유사성을 나타내도록 ‘...와 같았는데’로 옮겼습니다.
- source_word: እምእብነ ፑክ
  english_pob_choice: of crystal stone
  chosen_korean: 수정 돌로 되어 있었고
