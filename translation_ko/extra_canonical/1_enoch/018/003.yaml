- source_word: አዕልና ሰማይ
  english_pob_choice: the heights of heaven
  chosen_korean: 하늘의 높이
  alternatives_korean:
  - 하늘의 높음
  - 하늘의 높은 곳
  - 하늘의 기둥
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 별도의 기둥 명칭이 아니라 하늘의 상부 구조를 가리키므로, ‘높이’가 가장 직접적이고 과도한 해석을 피합니다.
- source_word: እሙንቱ ውእቶሙ አዕማደ፡ ሰማይ
  english_pob_choice: these are the pillars of heaven
  chosen_korean: 이들은 하늘의 기둥들입니다
