theological_decisions:
- issue: ‘하늘의 높이’와 ‘하늘의 기둥들’의 관계를 어떻게 드러낼지
  chosen_reading: 본문은 바람들이 하늘의 상부를 지탱하는 장면을 말한 뒤, 그 위치에 선 존재들을 ‘하늘의 기둥들’로 설명합니다.
  alternative_readings:
  - 바람들이 하늘의 기둥들을 지탱한다
  - 바람들이 하늘을 떠받친다
  rationale: 원문은 마지막 절에서 명시적으로 ‘이들이 하늘의 기둥들’이라고 식별하므로, 앞 절을 기둥 자체로 단정하지 않고 설명적 긴장을 유지하는 편이 더 충실합니다.
  doctrine_reference: 원문 우선, 식별절과 설명절의 구분을 보존
