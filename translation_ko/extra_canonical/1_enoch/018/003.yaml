base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/003.yaml
  text: And I saw how the winds support the heights of heaven[a], and they stand between heaven and earth; these are the pillars of heaven.
  footnotes:
  - marker: a
    text: The Ge'ez verb rendered 'stretch out' is difficult and could be understood more broadly as 'extend,' 'support,' or a similar action affecting the pillars.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 보았습니다. 바람들이 하늘의 높이[a]를 지탱하고, 그들은 하늘과 땅 사이에 서 있었습니다. 이들은 하늘의 기둥들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서의 Ge'ez 동사는 해석이 어려워 ‘늘이다’, ‘펴다’, ‘지탱하다’ 등으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋሳት
  english_pob_choice: the winds
  chosen_korean: 바람들
  alternatives_korean:
  - 영들
  - 바람/영들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 우주적 환상 문맥에서는 복수형을 인격적 ‘영들’보다 자연적 힘인 ‘바람들’로 읽는 것이 더 자연스럽고, 창조 질서의 이미지를 보존합니다.
