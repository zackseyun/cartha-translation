base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/002.yaml
  text: And I saw the cornerstones of the earth[c][b][a], and I saw the four winds that bear up the earth and the firmament of heaven.
  footnotes:
  - marker: a
    text: Or 'the stones of the corners of the earth.' The Ge'ez phrase is architectural and may refer to the earth’s foundational extremities in visionary imagery.
    reason: lexical_alternative
  - marker: b
    text: The noun rendered 'winds' can in some contexts overlap with 'spirits' or 'breaths,' but here the cosmological setting favors 'winds.'
    reason: lexical_alternative
  - marker: c
    text: '''Firmament of heaven'' preserves ancient cosmic imagery of a structured heavenly expanse or vault.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 나는 땅의 모퉁잇돌들을 보았고, 또 하늘의 궁창과 땅을 떠받치는 네 바람도 보았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 모퉁이의 돌들’로도 옮길 수 있습니다. 게에즈 표현은 건축적이어서, 비전적 이미지에서는 땅의 기초적 끝부분을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바람’으로 옮긴 낱말은 어떤 문맥에서는 ‘영’이나 ‘숨결’과 겹칠 수 있지만, 여기서는 우주론적 배경이 ‘바람’ 쪽을 더 강하게 지지합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘하늘의 궁창’은 고대 우주론에서 구조화된 천상 확장 또는 궁륭을 가리키는 이미지를 보존합니다.
    reason: cultural_note
