  rationale: 문맥상 우주적 지탱자들을 말하므로 ‘영’보다 ‘바람’이 적절하며, 한국어에서는 수사와 결합한 관용적 표현인 ‘네 바람’이 가장 자연스럽습니다.
- source_word: ወጽንዐ ሰማይ
  english_pob_choice: the firmament of heaven
  chosen_korean: 하늘의 궁창
  alternatives_korean:
  - 하늘의 궁창
  - 하늘의 궁륭
  - 하늘의 창공
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고대 우주론의 구조적 천상 공간을 살리기 위해 일반적인 ‘하늘’보다 ‘궁창’을 유지했고, 속격 관계를 분명히 하기 위해 ‘하늘의 궁창’으로 옮겼습니다.
