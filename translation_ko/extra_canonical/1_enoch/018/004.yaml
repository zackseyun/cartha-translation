translation:
  language: ko
  text: 그리고 나는 하늘을 움직이고 해의 원반과 모든 별을 지게 하는 바람들을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해의 원반’으로 옮긴 말은 해와 모든 별의 원형 궤도 또는 운행을 가리키는 것으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지게 하는’으로 옮긴 동사는 해와 별이 지는 것을 일으키는 뜻이며, ‘가까이 가져오다’로 이해하기는 어렵습니다.
    reason: lexical_clarification
lexical_decisions:
- source_word: ወርኢኩ
  english_pob_choice: And I saw
  chosen_korean: 그리고 나는 ... 보았습니다
  alternatives_korean:
