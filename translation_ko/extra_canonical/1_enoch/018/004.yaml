  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘turn’의 물리적·우주적 운동 이미지를 살리면서도 한국어에서 어색하지 않게 ‘움직이게 하다’로 옮겼습니다.
- source_word: ያዐርቡ
  english_pob_choice: cause ... to set
  chosen_korean: 지게 하는
  alternatives_korean:
