  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘원반’은 둥근 형상과 천체 이미지 둘 다를 살리며, ‘해’는 성경적 한국어에서 자연스러운 표현입니다.
- source_word: ወኵሎ ከዋክብተ
