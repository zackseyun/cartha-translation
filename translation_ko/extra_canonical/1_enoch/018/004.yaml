  chosen_korean: 모든 별들
  alternatives_korean:
  - 모든 별
  - 별들 모두
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 집합적 의미를 분명히 하되 현대 한국어에서 자연스럽게 읽히도록 복수형 ‘별들’을 사용했습니다.
