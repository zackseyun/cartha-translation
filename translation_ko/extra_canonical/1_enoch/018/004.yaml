translation:
  language: ko
  text: 그리고 나는 하늘을 움직이게 하고 해의 원반과 모든 별을 지게 하는 바람들을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘해의 원반’ 또는 ‘해의 둥근 둘레’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘지게 하는’은 검토본의 정정에 따른 번역입니다. 이전 초안의 ‘가까이 가져오는’은 이 동사의 뜻을 잘못 잡은 것입니다.
    reason: textual_variant
