  rationale: 우주적 현상에 작용하는 구체적 힘으로 읽는 것이 문맥에 맞으므로, 인격화된 ‘영들’보다 ‘바람들’이 원문에 충실합니다.
- source_word: እለ ይመይጥዋ ለሰማይ
