  - 모든 산들 내부에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘안에’는 ውስተ의 내부 위치를 가장 자연스럽게 살리며, ‘모든 산들’은 복수 집합성을 유지합니다.
