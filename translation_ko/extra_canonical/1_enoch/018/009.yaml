lexical_decisions:
- source_word: ወእሳተ
  english_pob_choice: a burning fire
  chosen_korean: 타는 불
  alternatives_korean:
  - 불
  - 불타는 불
  - 타오르는 불
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정관적이지 않은 단수 명사와 진행 중인 상태를 함께 살려, ‘불’에 형용사 ‘타는’을 붙여 비전적 이미지를 자연스럽게 드러냈습니다.
- source_word: ዘይነድድ
  english_pob_choice: burning
  chosen_korean: 타는
  alternatives_korean:
  - 불타는
  - 타오르는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 불의 지속적·진행적 상태를 나타내므로, 한국어에서는 가장 مستقیم한 현재분사형 표현인 ‘타는’으로 옮겼습니다.
- source_word: ወዘሀሎ
  english_pob_choice: that was within
  chosen_korean: 안에 있는
  alternatives_korean:
  - 내에 있는
  - 속에 있는
  - 안에 있었던
  lexicon: Dillmann, Lexicon Linguae Aethiopicum
  rationale: 주석 전통의 문법 분석에 따라 이 절은 ‘불’을 수식하는 관계절이므로, 독립된 대상이 아니라 ‘산들 안에 있는’으로 처리해 원문 구조를 반영했습니다.
- source_word: ውስተ ኵሉ አድባር
  english_pob_choice: within all the mountains
  chosen_korean: 모든 산들 안에
  alternatives_korean:
