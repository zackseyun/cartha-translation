  rationale: 천사들의 이동 경로라는 공간적 이미지를 유지하기 위해 ‘길들’로 옮겼습니다.
- source_word: ጽንዐ
  english_pob_choice: the firm support
  chosen_korean: 견고한 버팀목
  alternatives_korean:
