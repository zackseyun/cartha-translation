  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘bear’의 감각을 단순한 운반보다 지탱·지지의 의미로 살려, 우주 질서의 버팀 이미지를 드러냈습니다.
- source_word: ፍናወ
