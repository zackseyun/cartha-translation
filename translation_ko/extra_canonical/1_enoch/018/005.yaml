base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/005.yaml
  text: I saw the winds upon the earth[a], which bear the clouds; I saw the paths of the angels[d][c][b]; I saw at the end of the earth the firm support of the heaven above.
  footnotes:
  - marker: a
    text: The opening clause is textually and syntactically difficult. It may also be understood more literally as 'the winds above the earth, bearing the clouds' or 'the winds that support what is above the earth among the clouds.'
    reason: textual_variant
  - marker: b
    text: Or 'the foundation of the heaven above.' The Ge'ez term can denote firmness or supporting strength.
    reason: lexical_alternative
  - marker: c
    text: Or 'And I saw the winds that bear the earth above the clouds'.
    reason: previous_rendering
  - marker: d
    text: Or '; and I saw the paths of the angels; and I saw at the end of the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 땅 위에 있는, 구름을 떠받치는 바람들을 보았습니다.[a] 나는 천사들의 길들을 보았습니다. 나는 땅 끝에서 높은 하늘을 받치는 견고한 버팀목을 보았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 구절은 전승과 구문 해석상 논의가 있습니다. 여기서는 ‘땅 위에 있는 바람들이 구름을 지탱한다’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘높은 하늘의 견고한 기초’. 원문의 말은 견고함 또는 지탱하는 힘을 뜻할 수 있습니다.
    reason: lexical_alternative
