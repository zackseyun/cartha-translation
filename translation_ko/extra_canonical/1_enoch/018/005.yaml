  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥은 천체적 장면과 구름을 떠받치는 이미지가 중심이므로, ‘영들’보다 물리적 의미의 ‘바람들’이 맞습니다.
