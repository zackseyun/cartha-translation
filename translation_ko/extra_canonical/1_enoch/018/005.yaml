  - 단단한 지지대
  - 확고한 받침
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어휘가 ‘기초’보다 넓게 ‘견고함/지탱하는 힘’을 가리킬 수 있어, 건축적 의미를 과도하게 좁히지 않는 ‘버팀목’을 택했습니다.
theological_decisions:
- issue: 구름과 바람의 관계를 어떻게 처리할지
  chosen_reading: 바람들이 구름을 떠받치는 장면으로 옮겼습니다.
  alternative_readings:
  - 바람들이 땅 위에 있다
  - 바람들이 하늘 아래에 있다
  rationale: 아랍적/우주론적 장면의 핵심은 바람-구름-하늘의 질서이므로, 원문의 이미지와 영어 POB의 확정된 독해를 따라 구름을 지탱하는 바람으로 제시했습니다.
  doctrine_reference: 원문의 우주론적 환시를 보존하고, 사본·구문상의 어려움을 평탄화하지 않습니다.
