  - 모든 피조물과 땅의 기초
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ፍጥረተ’의 집합적 우주 범위를 살려 ‘모든 창조물’로 옮기고, ‘땅의 기초’는 고대 우주론의 건축적 표현을 그대로 유지했습니다.
theological_decisions:
- issue: ‘바람’의 의미를 영적 존재로 넓힐지 여부
  chosen_reading: 우주론적 맥락에 따라 실제 바람으로 읽고 번역했습니다.
  alternative_readings:
  - 영들
  - 호흡들
  rationale: 바로 앞뒤가 천상의 저장 공간과 창조 질서에 관한 환시이므로, ‘바람’으로 두는 것이 본문의 장면을 가장 잘 보존합니다.
  doctrine_reference: '문맥 우선 원칙: 국지적 본문 의미를 먼저 보존하고, 후속 본문과의 조화를 그 다음에 검토합니다.'
- issue: ‘장식하셨다’의 의미 범위
  chosen_reading: 주된 이미지는 장식이지만, 질서 있게 배치하셨다는 뉘앙스도 함께 남겼습니다.
  alternative_readings:
  - 세우셨습니다
  - 정돈하셨습니다
  - 아름답게 하셨습니다
  rationale: 게에즈 동사의 생생한 미감적 표현을 유지하되, 창조와 땅의 기초를 대상으로 하는 문맥상 질서 부여의 의미도 배제하지 않기 위해서입니다.
  doctrine_reference: 묵시문학적 우주 이미지 보존 원칙
