base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/001.yaml
  text: And I saw the storehouses of all the winds[b][a], and I saw how with them he adorned all creation and the foundations of the earth.
  footnotes:
  - marker: a
    text: Or 'treasuries.' The image is of heavenly chambers in which the winds are kept.
    reason: lexical_alternative
  - marker: b
    text: The verb may also carry the sense 'ordered' or 'established,' not only 'adorned.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 모든 바람의 창고들을 보았고[a], 또 그분이 그것들로 모든 창조물과 땅의 기초를 어떻게 장식하셨는지도 보았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보물창고들’입니다. 바람이 보관된 하늘의 방들라는 이미지입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동사는 ‘정돈하셨다’ 또는 ‘세우셨다’는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
