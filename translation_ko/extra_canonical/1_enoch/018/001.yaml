  - 세우셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 시각적·환상적 이미지를 살리기 위해 기본 의미를 ‘장식하다’로 두었습니다. 동시에 창조 질서의 배열 의미도 문맥상 함께 열어 둡니다.
- source_word: ኵሎ ፍጥረተ ወመሰረታቲሃ ለምድር
  english_pob_choice: all creation and the foundations of the earth
  chosen_korean: 모든 창조물과 땅의 기초
