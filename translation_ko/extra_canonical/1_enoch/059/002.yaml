  source_fidelity: 초안은 መልዕልተ ሰማይ를 ‘하늘의 높이에서’로 옮기고 ‘영들의 주님’을 보존한 점은 적절합니다. 그러나 마지막 문장의 ‘정해집니다’는 원문에 없는 현재형의 단정적 서술을 더합니다. 원문은 환상 중에 천둥의 소리가 평화와 복을 위한 것인지 저주를 위한 것인지가 주님의 말씀과 관련되어 있음을 ‘보여 주었다’고 서술합니다. 또한 대괄호 안의 ‘천둥의 소리’ 반복은 번역과 주석에서 표시되어야 합니다.
  naturalness: ‘그것이 하늘의 높이에서 부서질 때’는 천둥에 대한 한국어 표현으로 다소 부자연스럽습니다. ‘천둥이 하늘 높은 곳에서 굉음을 낼 때’가 원문의 격렬한 소리와 한국어 관용을 함께 살립니다. 마지막 내용을 ‘보여 주셨습니다’의 범위 안에 두어 환상 보고의 시제와 구문을 유지했습니다.
  terminology: ‘영들의 주님’은 1에녹의 고유 칭호로 적절합니다. ‘평화와 복’은 원문의 평화와 축복을 자연스럽고 비교파적으로 옮깁니다. 난해한 ተመመንደርት የብስ는 ‘마른 땅의 거처들’로 유지하되, 주석에서 더 넓은 해석 가능성을 밝혔습니다.
