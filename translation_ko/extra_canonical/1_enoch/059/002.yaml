revisions:
- from: 그리고 거기서 나는 천둥의 숨은 곳들[a]을 보았습니다. 그것이 하늘의 높이에서 부서질 때 그 소리가 들렸고, 그가 내게 마른 땅의 거처들과 천둥의 소리를 보여 주셨습니다. 그 소리는 평강과 복을 위한 것인지, 또는 저주를 위한 것인지, 영들의 주님의 말씀에 따라 정해집니다.
  to: 그리고 거기에서 나는 천둥의 숨은 곳들을 보았습니다. 천둥이 하늘 높은 곳에서 굉음을 낼 때 그 소리가 들리는 것도 보았습니다. 또 그가 내게 마른 땅의 거처들[a]과, 영들의 주님의 말씀에 따라 평화와 복을 위한 것인지 저주를 위한 것인지 하는 천둥의 소리[b]를 보여 주셨습니다.
  rationale: 개정문은 환상 서술의 과거 시제를 유지하고, 원문에 없는 ‘정해집니다’라는 단정적 일반 진술을 제거했습니다. ‘천둥의 소리’와 평화·복 또는 저주의 관계는 ‘것인지’라는 원문의 열려 있는 구문으로 보존했습니다. 난해한 ‘마른 땅의 거처들’과 대괄호 반복구에는 각각 올바른 위치의 주석을 제공했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:11Z'
