base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/002.yaml
  text: And there I saw the hidden chambers of the thunder[a], and how, when it crashes in the height of heaven, its sound is heard; and he showed me the dwellings of the dry land, and the sound of the thunder, whether for peace and blessing or for a curse[c][b], according to the word of the Lord of Spirits.
  footnotes:
  - marker: a
    text: The phrase rendered 'the dwellings of the dry land' is textually and lexically difficult; it may refer more generally to the inhabited places of the earth.
    reason: lexical_alternative
  - marker: b
    text: A bracketed phrase in the witness repeats 'and the sound of the thunder'; the repetition may be original or may reflect scribal expansion, but it is represented in the translation's final clause.
    reason: textual_variant
  - marker: c
    text: Or 'from above in heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기서 나는 천둥의 숨은 곳들[a]을 보았습니다. 그것이 하늘의 높이에서 부서질 때 그 소리가 들렸고, 그가 내게 마른 땅의 거처들과 천둥의 소리를 보여 주셨습니다. 그 소리는 평강과 복을 위한 것인지, 또는 저주를 위한 것인지, 영들의 주님의 말씀에 따라 정해집니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천둥의 숨은 곳들’은 본문상 ‘hidden chambers of the thunder’에 해당하는 난해구입니다. 더 일반적으로 ‘숨은 장소들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኅቡኣተ
  english_pob_choice: hidden chambers
  chosen_korean: 숨은 곳들
  alternatives_korean:
  - 숨은 방들
  - 감추어진 거처들
  - 비밀의 방들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 형용사/명사는 숨겨진 것 또는 장소를 가리킬 수 있으므로, 천둥과 결합된 이 문맥에서는 특정한 건축적 ‘방’보다 포괄적인 ‘숨은 곳들’이 원문 긴장을 덜 훼손합니다.
- source_word: መልዕልተ ሰማይ
  english_pob_choice: in the height of heaven
  chosen_korean: 하늘의 높이에서
  alternatives_korean:
  - 하늘의 꼭대기에서
  - 하늘의 높은 곳에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 구문 자체가 ‘하늘의 높이/정상’을 뜻하므로, 원문의 상하 우주론적 이미지를 살리면서도 한국어로 자연스럽게 옮기기 위해 ‘하늘의 높이에서’를 택했습니다.
- source_word: ተመመንደርት የብስ
  english_pob_choice: the dwellings of the dry land
  chosen_korean: 마른 땅의 거처들
  alternatives_korean:
  - 땅의 거처들
  - 육지의 거처들
  - 사람들이 사는 땅의 곳들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어려운 구절이지만, ‘dry land/earth’의 대비와 거주지라는 감각을 함께 보존하기 위해 너무 일반화하지 않고 ‘마른 땅의 거처들’로 옮겼습니다.
- source_word: ቃለ እግዚአ መናፍስት
  english_pob_choice: according to the word of the Lord of Spirits
  chosen_korean: 영들의 주님의 말씀에 따라
  alternatives_korean:
  - 영들의 주님의 말씀대로
  - 영들의 주님의 명령에 따라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1에녹의 고유 호칭인 ‘Lord of Spirits’를 한국어로 직역해 ‘영들의 주님’으로 두고, 뒤의 전치사구는 ‘말씀에 따라’로 처리해 신적 선언의 권위를 살렸습니다.
theological_decisions:
- issue: 천둥의 기능이 단순한 자연현상인지, 신적 판정의 매개인지
  chosen_reading: 천둥은 평강·복 또는 저주를 가져오는 신적 도구로 제시됩니다.
  alternative_readings:
  - 천둥의 소리가 그 결과를 단순히 알릴 뿐입니다.
  - 서로 다른 천둥 소리가 각기 다른 뜻을 상징합니다.
  rationale: 원문은 천둥의 소리와 그 결과를 주님의 말씀에 연결하므로, 기상학적 묘사로 축소하지 않고 신적 판정의 매개라는 긴장을 유지했습니다.
  doctrine_reference: 예언적·묵시적 표상은 자연현상보다 하나님의 주권적 말씀을 우선시함
- issue: ‘영들의 주님’의 호칭 처리
  chosen_reading: 고유한 묵시문학적 칭호로서 ‘영들의 주님’을 일관되게 사용했습니다.
  alternative_readings:
  - ‘영의 주님’으로 단수화
  - ‘영들의 하나님’으로 일반화
  rationale: 1에녹에서 반복되는 호칭을 보존해 문헌 내부의 일관성과 신학적 위엄을 유지했습니다.
  doctrine_reference: 고유 칭호의 일관성 유지
