base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/003.yaml
  text: And after this all the hidden things of the lights and of the lightnings were shown to me[c][b][a]; they flash for blessing and for abundance.
  footnotes:
  - marker: a
    text: Or 'all their secrets.' The Ge'ez expression is literally 'all their hidden things,' which may refer to concealed workings of the heavenly lights and related phenomena.
    reason: lexical_alternative
  - marker: b
    text: '''Lights'' may refer specifically to heavenly luminaries in this visionary context.'
    reason: cultural_note
  - marker: c
    text: Or 'you will show me all their hidden things—of the lights, and of the lightnings, and of blessing, and of abundance—they flash forth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 뒤에 빛들[b]과 번개들에 관한 모든 숨은 것들[a]이 내게 보여졌습니다. 그것들은 복과 풍요를 위하여[c] 번뜩입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘숨은 것들’은 ‘비밀들’보다 원문에 더 가까운 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘빛들’은 이 환상 문맥에서 하늘의 광체들을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘복과 풍요를 위하여’는 목적을 나타내는 원문의 표지를 반영한 번역입니다.
    reason: lexical_alternative
