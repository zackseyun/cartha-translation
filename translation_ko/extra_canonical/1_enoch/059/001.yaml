base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/001.yaml
  text: In those days my eyes saw the secrets of the lightnings and the lights[a], and their courses, and they flash forth for blessing and for curse[d][c][b], as the Lord of Spirits has willed.
  footnotes:
  - marker: a
    text: Or 'hidden things' or 'secret treasuries'; the Ge'ez likely refers to concealed heavenly repositories from which these phenomena emerge.
    reason: lexical_alternative
  - marker: b
    text: Or 'their order' or 'their course.' The exact nuance of the Ge'ez term is uncertain, but it points to the regulated arrangement of these heavenly phenomena.
    reason: lexical_alternative
  - marker: c
    text: Or 'hidden storehouses'.
    reason: previous_rendering
  - marker: d
    text: Or 'their ordinance'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 내 눈은 번개들과 빛들의 비밀[a], 그 운행, 그리고 그것들이 영들의 주님께서 뜻하신 대로 복과 저주를 위하여 번쩍이는 것을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨겨진 것들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그 날들에
  - 그 시절에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 시간 도입구로서의 높임을 살리면서도 한국어 문맥에서 자연스럽게 시작하기 위해 ‘그때에’로 옮겼습니다.
- source_word: ርእያ አዕይንትየ
  english_pob_choice: my eyes saw
  chosen_korean: 내 눈은 ... 보았습니다
  alternatives_korean:
  - 내가 보았습니다
  - 내 눈으로 보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문이 ‘내 눈’을 명시하므로, 환시의 생생함을 살리기 위해 눈을 주어로 유지했습니다.
- source_word: ኅቡኣተ
  english_pob_choice: secrets
  chosen_korean: 비밀
  alternatives_korean:
  - 숨은 것들
  - 감추어진 것들
  - 비밀스러운 것들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영어 주석이 이 단어를 ‘secrets’로 바로잡고 있으므로, Enoch의 묵시적 ‘비밀’이라는 뜻을 한국어로 직접 살렸습니다.
- source_word: አክኒሆሙ
  english_pob_choice: their courses
  chosen_korean: 그들의 정해진 운행
  alternatives_korean:
  - 그들의 길
  - 그들의 질서
  - 그들의 운행
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘 현상들의 규정된 진행을 가리키므로, 단순한 이동보다 질서와 경로를 함께 드러내는 ‘정해진 운행’이 가장 가깝습니다.
- source_word: ወብርሃናት
  english_pob_choice: the lights
  chosen_korean: 빛들
  alternatives_korean:
  - 광체들
  - 광명들
  - 광채들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 천체적 조명 현상을 포괄하는 일반 명칭이므로, 과도하게 특정하지 않고 ‘빛들’로 옮겼습니다.
- source_word: ለበረከት ወለመረገም
  english_pob_choice: for blessing and for curse
  chosen_korean: 복을 위하여 그리고 저주를 위하여
  alternatives_korean:
  - 복과 저주를 위하여
  - 복을 위한 것과 저주를 위한 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대조적 목적격 구조를 분명히 드러내기 위해 ‘위하여’를 반복했고, 축복/저주의 양극성을 흐리지 않았습니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주님
  - 영들의 주
  - 만군의 하나님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정해진 에녹서 титул을 한국어 성서 관용어로 대응시키되, 이 구절의 주권성과 군사적 웅장함을 살리기 위해 ‘만군의 주’로 옮겼습니다.
theological_decisions:
- issue: 번개와 빛들의 역할이 단순한 자연현상인지, 아니면 하나님의 뜻 아래 복과 저주의 도구인지
  chosen_reading: 이 현상들은 만군의 주께서 원하신 대로 복과 저주를 위해 기능하는 것으로 제시됩니다.
  alternative_readings:
  - 그냥 자연 질서의 묘사로만 읽을 수 있습니다.
  - 복과 저주는 현상의 결과일 뿐, 직접적 위임은 아니라고 볼 수 있습니다.
  rationale: 원문과 영어 POB 모두 마지막 절을 지배의 근거로 연결하므로, 자연 묘사로 평탄화하지 않고 신적 주권 아래의 기능으로 유지했습니다.
  doctrine_reference: 묵시문학의 우주 질서와 신적 심판/은총의 이중 기능을 보존합니다.
