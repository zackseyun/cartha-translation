base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/003.yaml
  text: And I[a], Enoch, alone saw the vision, the ends of all things[b]; and no human being will see as I have seen.
  footnotes:
  - marker: a
    text: Or 'the extremities of everything.' The Ge'ez expression can denote furthest bounds or ends, and may carry both spatial and cosmic force.
    reason: lexical_alternative
  - marker: b
    text: Or 'Henok'.
    reason: previous_rendering
translation:
  language: ko
  text: 나, 에녹은 홀로 환상을 보았으니, 만물의 끝을 보았습니다. 그리고 사람은 아무도 내가 본 것처럼 보지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '모든 것의 지극한 경계'. 게에즈 표현은 가장 먼 지경이나 끝을 뜻할 수 있으며, 공간적·우주적 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ፡ አርአያ
  english_pob_choice: saw the vision
  chosen_korean: 환상을 보았으니
  alternatives_korean:
  - 비전을 보았으니
  - 보이는 것을 보았으니
  - 환시를 보았으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아폴리칼립스 문맥에서 단순한 '보임'보다 계시적 성격을 드러내는 '환상'이 더 자연스럽고, '보았다'는 완료형으로 체험의 확정성을 살립니다.
- source_word: ባሕቲትየ
  english_pob_choice: alone
  chosen_korean: 홀로
  alternatives_korean:
  - 나 혼자
  - 오직 나만
  - 단독으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹만이 이 계시를 받았다는 배타적 강조를 간결하게 살리기 위해 '홀로'를 택했습니다.
- source_word: አጽናፈ ኵሉ
  english_pob_choice: the ends of all things
  chosen_korean: 만물의 끝
  alternatives_korean:
  - 모든 것의 끝
  - 만물의 지극한 끝
  - 모든 것의 지경
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지리적 한계보다 우주적·종말론적 범위를 드러내는 표현이어서, POB의 'the ends of all things'를 압축해 '만물의 끝'으로 옮겼습니다.
- source_word: አልቦ ዘይሬኢ እምሰብእ
  english_pob_choice: no human being will see
  chosen_korean: 사람은 아무도 … 보지 못할 것입니다
  alternatives_korean:
  - 아무 인간도 … 보지 못할 것입니다
  - 사람 중 아무도 … 볼 수 없습니다
  - 인간은 아무도 … 보지 못할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘sebe’의 일반적 의미를 살려 남성 한정이 아닌 ‘사람’으로 옮겼고, 미래 부정으로 에녹의 비견 불가한 증언을 유지했습니다.
theological_decisions:
- issue: 에녹의 시야 범위
  chosen_reading: 에녹은 개인적 환상이 아니라 '만물의 끝'에 이르는 우주적 계시를 보았다고 말합니다.
  alternative_readings:
  - 지상의 끝부분만 보았다는 뜻
  - 모든 일의 결말만 보았다는 뜻
  rationale: 원문은 공간적·우주적 울림을 함께 가질 수 있어, 그 폭을 좁히지 않고 보존하는 것이 문맥상 더 충실합니다.
