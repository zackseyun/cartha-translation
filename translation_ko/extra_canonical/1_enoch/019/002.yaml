base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/002.yaml
  text: And their wives[a], the angels who went astray[c][b], will become like peaceful ones.
  footnotes:
  - marker: a
    text: Or 'their wives'; the Ge'ez term can denote women generally or wives specifically.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'like the angels, peaceful ones' is difficult. The comparison is clear, but 'peaceful ones' may either describe the angels or indicate a state of peace into which the women enter.
    reason: alternative_reading
  - marker: c
    text: Or 'And the women of those who went astray will become like the angels, peaceful ones.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 길을 잃은 천사들의 아내들도 평화로운 이들처럼 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아내들’로 옮겼지만, 게에즈어 표현은 문맥에 따라 일반적인 ‘여자들’을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평화로운 이들’이 정확히 누구를 가리키는지, 또는 평화의 상태를 나타내는지 분명하지 않습니다. 다만 본문은 아내들이 그들과 ‘같이’ 될 것이라는 비교를 나타냅니다.
    reason: alternative_reading
