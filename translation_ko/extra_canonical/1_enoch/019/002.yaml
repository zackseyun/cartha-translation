theological_decisions:
- issue: ‘peaceful ones’의 의미 범위
  chosen_reading: 최소한 본문이 보장하는 비교 표현으로 유지하여, 이들이 ‘평화로운 이들처럼’ 된다고만 번역합니다.
  alternative_readings:
  - 천사들과 함께 평화를 누리게 될 것입니다
  - 천사들이 평화로운 존재라는 뜻입니다
  rationale: 게에즈 본문은 비교를 분명히 하지만 그 평화가 상태인지 성격인지 단정하지 않으므로, 의미를 과도하게 좁히지 않았습니다.
  doctrine_reference: 본문의 긴장을 보존하고, 비교와 동일시를 구분합니다.
