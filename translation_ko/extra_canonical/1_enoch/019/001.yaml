base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/001.yaml
  text: And Uriel said to me[a], “Here shall stand the angels who joined themselves with women; and their spirits, having taken on many forms, defile humankind and lead them astray so that they sacrifice to demons as to gods, until the day of the great judgment[d][c][b], on which they will be judged until they are finished.”
  footnotes:
  - marker: a
    text: Or 'having become many appearances'; the Ge'ez phrase is difficult and may refer to varied manifestations by which these spirits corrupt humanity.
    reason: lexical_alternative
  - marker: b
    text: The expression 'their spirits' is left literal. In the wider Enochic context, interpreters differ on whether this points to the spirits of the fallen beings themselves or to demonic spirits associated with their offspring.
    reason: alternative_reading
  - marker: c
    text: Or 'until their end is completed.' The final clause emphasizes the full completion of judgment, but the exact nuance is uncertain.
    reason: lexical_alternative
  - marker: d
    text: Or 'defiled humankind and led them astray so that they sacrificed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리엘이 내게 말했습니다. “여기에는 여자들과 결합한 천사들이 서 있을 것이며, 그들의 영들은 많은 모습으로 나타나며 사람들을 더럽히고 그들을 그릇된 길로 이끌어 가서, 그들이 마치 신들에게 하듯이 귀신들에게 제사하게 할 것입니다. 그것은 큰 심판의 날까지이며, 그날 그들은 끝날 때까지 심판을 받을 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 모습으로 나타나며’는 난해한 Ge'ez 표현을 절제해 옮긴 것입니다. 보다 직역하면 ‘많은 형상들을 취하며/많은 현현이 되며’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘끝날 때까지’는 ‘그들의 종말이 완성될 때까지’ 또는 ‘그들의 끝이 이루어질 때까지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘귀신들’은 본문의 አጋንንት을 직역한 것으로, 일반적인 교회어를 따른 표현입니다.
    reason: cultural_note
  - marker: d
    text: ‘그들의 영들’의 정확한 지시 대상은 본문 자체에서 확정되지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: ተደሚሮሙ
  english_pob_choice: joined themselves
  chosen_korean: 결합한
  alternatives_korean:
  - 합류한
  - 스스로 결합한
  - 합해진
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상호 결합의 의미를 살리되, 한국어에서 과도하게 해설적이거나 노골적이지 않게 옮겼습니다. 문맥상 여자들과의 불법적 결합을 암시하므로 ‘결합한’이 가장 절제된 대응입니다.
- source_word: ብዙኃ ራእየ ከዊኖሙ
  english_pob_choice: having taken on many forms
  chosen_korean: 많은 모습으로 나타나며
  alternatives_korean:
  - 많은 형상들을 취하며
  - 여러 모습이 되며
  - 많은 현현으로 나타나며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘appearance/vision’ 계열의 난해한 표현을 한국어로 지나치게 단정하지 않으면서, 복수의 현현이라는 핵심을 살렸습니다. POB의 난점을 유지하기 위해 구체적 실체화보다 ‘나타나며’를 택했습니다.
- source_word: አርኰስዎሙ
  english_pob_choice: defile
  chosen_korean: 더럽히고
  alternatives_korean:
  - 부정하게 하고
  - 오염시키고
  - 더럽혀
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 의례적·도덕적 오염 뉘앙스를 함께 담는 ‘더럽히다’가 가장 직접적입니다. 본문이 인간의 상태를 단순히 해치는 것이 아니라 부정하게 만드는 것으로 그리므로 이 표현을 유지했습니다.
- source_word: ያስሕትዎሙ
  english_pob_choice: lead them astray
  chosen_korean: 그들을 그릇된 길로 이끌어 가서
  alternatives_korean:
  - 그들을 미혹하여
  - 그들을 잘못 인도하여
  - 그들을 속여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 기만보다 방향 상실과 배도를 함께 드러내기 위해 ‘그릇된 길로 이끌어 가다’를 선택했습니다. 다음 절의 우상적 제사로 이어지는 흐름과도 잘 맞습니다.
- source_word: አጋንንት
  english_pob_choice: demons
  chosen_korean: 귀신들
  alternatives_korean:
  - 악령들
  - 악한 영들
  - 마귀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전통적 교회어 ‘귀신들’은 한국어 독자에게 곧바로 이해되며, 이 본문의 고대 유대 묵시적 존재들을 무리 없이 가리킵니다. 다만 본문은 후대 민속적 의미로 축소되지 않도록 다른 항목들과 함께 유지했습니다.
theological_decisions:
- issue: ‘their spirits’의 지시 대상
  chosen_reading: ‘그들의 영들’로 직역하여, 그것이 타락한 천사들의 영인지, 그들과 연관된 다른 영적 존재들인지 단정하지 않았습니다.
  alternative_readings:
  - 그들의 악한 영들
  - 그들에게서 나온 영들
  - 그들의 후손의 영들
  rationale: 원문과 POB 주석이 지시 대상을 확정하지 않도록 경계하므로, 한국어도 동일한 긴장을 보존했습니다. 묵시문학적 영계 구조를 교리적으로 평면화하지 않기 위함입니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘until they are finished’의 종결감
  chosen_reading: ‘끝날 때까지 심판을 받을 것입니다’로 옮겨, 심판의 완결을 말하되 소멸 여부는 단정하지 않았습니다.
  alternative_readings:
  - 완전히 끝날 때까지 심판을 받을 것입니다
  - 그들의 종말이 이루어질 때까지 심판을 받을 것입니다
  - 끝장날 때까지 심판을 받을 것입니다
  rationale: 원문은 심판의 완성은 말하지만 그 방식이나 존재론적 결론을 상세히 밝히지 않습니다. 따라서 종결성은 살리되 해석을 과도하게 밀어붙이지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
