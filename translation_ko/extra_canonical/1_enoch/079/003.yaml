base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/003.yaml
  text: And the moon wanes[a], which takes place through the sixth gate; for in this sixth gate its light is completed[c][b], and from it comes the beginning of the waning.
  footnotes:
  - marker: a
    text: Or 'wanes through the sixth gate.' The Ge'ez wording is somewhat formal and procedural rather than purely observational.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the head of the diminution,' an idiom meaning the beginning or onset of the moon's decrease.
    reason: lexical_alternative
  - marker: c
    text: Or 'And the moon makes its waning, which is effected'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 달은 여섯째 문을 통해 쇠해집니다. 이는 이 여섯째 문에서 그 빛이 완성되고, 그로부터 쇠하기 시작하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '달은 여섯째 문을 통해 쇠합니다.' 게에즈 표현은 단순 관찰보다 절차적·형식적 뉘앙스가 강합니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 '쇠함의 머리'로, 달이 줄어들기 시작하는 시점을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐጸጸ
  english_pob_choice: And the moon wanes
  chosen_korean: 달은 쇠해집니다
  alternatives_korean:
  - 달은 기울어집니다
  - 달은 약해집니다
  - 달은 차츰 줄어듭니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사는 단순히 '줄어들다/쇠하다'를 뜻하므로, 천문학적 진행을 보존하면서도 현대 한국어에서 자연스러운 '쇠해집니다'로 옮겼습니다.
- source_word: ዘይትገበር በሳድስት ኆኅት
  english_pob_choice: which takes place through the sixth gate
  chosen_korean: 여섯째 문을 통해
  alternatives_korean:
  - 여섯째 문에서
  - 여섯째 문으로 말미암아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문이 단순한 배경이 아니라 달의 운동이 지나가는 통로이므로, 관계절 전체를 '여섯째 문을 통해'로 압축해 원문의 절차적·우주론적 이미지를 살렸습니다.
- source_word: ይትፌጸም ብርሃኑ ዚአሁ
  english_pob_choice: its light is completed
  chosen_korean: 그 빛이 완성되고
  alternatives_korean:
  - 그 빛이 다하고
  - 그 빛이 끝나고
  - 그 빛이 채워지고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 달빛이 어떤 기준에 따라 '완성'에 이른다는 뜻이므로, 단순한 소멸보다 측정된 충만의 의미를 담는 '완성되고'가 적합합니다.
- source_word: ርእሰ ታሕጻጼት
  english_pob_choice: the beginning of the waning
  chosen_korean: 쇠하기 시작하기
  alternatives_korean:
  - 감소의 머리
  - 기울어짐의 시작
  - 줄어듦의 시작
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 '감소의 머리'이지만, 관용적으로는 '시작'이라는 뜻이므로 한국어에서는 의미를 드러내는 '쇠하기 시작하기'로 풀었습니다.
