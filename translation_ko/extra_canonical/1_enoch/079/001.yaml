base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/001.yaml
  text: And now[a], my son, I have shown you everything[b], and the order of all the stars of heaven has been completed.
  footnotes:
  - marker: a
    text: Or 'the whole order/arrangement of all the stars of heaven has been accomplished.' The Ge'ez can be heard as either the completion of the description or the fulfillment of the heavenly order itself.
    reason: lexical_alternative
  - marker: b
    text: Or 'the whole ordering of all the stars of heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제, 내 아들아, 내가 너에게 모든 것을 보여 주었으며, 하늘의 모든 별들의 질서는 완성되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 모든 별들의 질서/배치에 대한 설명이 완결되었습니다.’로도 읽을 수 있습니다. 게에즈문은 계시의 서술이 끝났다는 뜻과, 하늘의 질서가 완성되었다는 뜻을 둘 다 들을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘내가 너에게 하늘의 모든 별들의 질서를 다 보여 주었으며’로 옮길 수 있습니다.
    reason: previous_rendering
