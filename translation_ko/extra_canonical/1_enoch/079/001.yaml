theological_decisions:
- issue: 마지막 절의 완결이 무엇을 가리키는지
  chosen_reading: 별들의 질서 자체가 종결되었다기보다, 그 질서에 대한 계시 설명이 완결되었다는 뜻으로 읽었습니다.
  alternative_readings:
  - 하늘의 별들의 질서 자체가 완성되었다
  - 별들의 질서가 이루어져 있다
  rationale: 문맥의 ‘내가 너에게 모든 것을 보여 주었으며’가 앞에 있으므로, 본절은 우주 질서의 소멸이 아니라 계시 서술의 마무리로 이해하는 것이 가장 자연스럽습니다.
  doctrine_reference: 계시 문맥의 종결과 우주 질서의 지속 가능성을 함께 보존합니다.
