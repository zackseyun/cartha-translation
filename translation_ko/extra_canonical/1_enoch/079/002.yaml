theological_decisions:
- issue: 365 관련 난구를 한국어 본문에 어떻게 반영할지
  chosen_reading: 수치가 아니라 ‘모든 때’와 ‘모든 해’의 열거 구조만 본문에 반영하고, 불확실한 수치 재구성은 피했습니다.
  alternative_readings:
  - 365의 권위 아래
  - 삼백육십오의 통치 아래
  - 365일의 질서에 따라
  rationale: Ge'ez 전승의 숫자 부분은 OCR 및 분절이 불안정하므로, 본문에서는 확인 가능한 항목 열거만 옮기고 임의의 수치 해석은 하지 않았습니다. 이는 원문 우선 원칙에 맞습니다.
  doctrine_reference: 원문 불확실성은 본문에서 과도하게 메우지 않고, 확인 가능한 의미를 보존한다.
