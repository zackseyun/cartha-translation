base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/002.yaml
  text: And he showed me all their ordinances—those for every day and every season[a], and for every year, and for its going out and its command[c][b], in every month and every sabbath.
  footnotes:
  - marker: a
    text: The phrase 'under the authority of the three hundred and sixty-five' is difficult in the Ethiopic witness. It likely refers to the ordered rule of the 365-day year, but the wording is left relatively literal because the exact construction is uncertain.
    reason: textual_variant
  - marker: b
    text: '''Sabbath'' could also be understood more broadly as ''week'' in a calendrical listing, but the literal term is retained.'
    reason: lexical_alternative
  - marker: c
    text: Or 'under the authority of the three hundred and sixty-five, and for every year, and in their going out and in their command'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 나에게 그들의 모든 규례를 보여 주셨습니다. 곧 모든 날과 모든 때를 위한 것과, 모든 해를 위한 것과, 그 나감과 그 명령을 위한 것, 그리고 모든 달과 모든 안식일을 위한 것들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안식일’은 문맥상 ‘주간’으로도 이해될 수 있으나, 여기서는 문자적 용어를 유지했습니다.
    reason: lexical_alternative
