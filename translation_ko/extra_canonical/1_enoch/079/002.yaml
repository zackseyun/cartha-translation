  rationale: 문맥이 천체의 움직임을 열거하므로, ሙጻእ은 해석을 과잉 고정하지 않고 ‘나감’으로 살렸고, ትእዛዝ은 ‘명령’의 강한 권위 뉘앙스를 유지했습니다.
- source_word: ወ፵ኵሉ ሰንበት
