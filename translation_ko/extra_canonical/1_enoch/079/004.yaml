  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: ko
  text: 그리고 첫째 문지방에서의 쇠퇴는 그때에 따라 이루어집니다. 일백칠십칠 일이 끝날 때까지—주간의 계산으로는 스물다섯과 두 날입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 천문·달력 계산의 언어를 사용하므로, ‘쇠퇴’는 윤리적 타락이 아니라 밝음이 줄어드는 현상으로 이해하는 것이 문맥에 맞습니다.
    reason: source_note
