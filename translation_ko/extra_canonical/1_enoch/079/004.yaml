  yaml_path: translation/extra_canonical/1_enoch/079/004.yaml
  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: ko
  text: 또 첫째 문에서 그 시기에 일어나는 감소는 백칠십칠 일이 차기까지이며, 주로 계산하면 스물다섯 주와 이틀입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘ፶፩ይትገበር፡ ቡኖኅት፡ ቀዳሚት፡
  english_pob_choice: the waning ... in the first gate
  chosen_korean: 첫째 문지방에서의 쇠퇴
  alternatives_korean:
  - 첫째 문에서의 기울어짐
  - 첫째 관문에서의 쇠퇴
  lexicon: waning / first gate
  rationale: source의 ‘쇠퇴’는 천문적 감소를 가리키는 표현으로 보이며, ‘첫째 gate’는 문맥상 ‘문지방’보다 ‘문/관문’이 가능하지만, 본문이 지칭하는 경계 지점을 한국어로 자연스럽게 옮기기 위해 ‘문지방’을 택했습니다.
- source_word: በዘመኑ፡ ዚአሁ፡
  english_pob_choice: in its season
  chosen_korean: 그때에 따라
  alternatives_korean:
  - 그 계절에
  - 그 시기에
  lexicon: season
  rationale: 달력·천문 문맥에서의 ‘season’을 계절보다 ‘때/시기’로 옮겨, 해당 감소가 정해진 시점에 맞춰 진행됨을 드러냈습니다.
- source_word: ይትፌጸም፡ መዋዕል፡ ፻ወ፸ወ፯፡
  english_pob_choice: until one hundred and seventy-seven days are completed
  chosen_korean: 일백칠십칠 일이 끝날 때까지
  alternatives_korean:
  - 일백칠십칠 일이 완료될 때까지
  - 일백칠십칠 일이 채워질 때까지
  lexicon: completed / days
  rationale: ‘완료되다’보다 한국어에서 더 직접적인 ‘끝나다’를 사용해 기간의 종결을 분명히 했습니다.
- source_word: በ፶፬ሥርዓተ፡ ሰንበት፡
  english_pob_choice: by the reckoning of weeks
  chosen_korean: 주간의 계산으로는
  alternatives_korean:
  - 주들의 셈으로는
  - 주 계산에 따르면
  lexicon: reckoning of weeks
  rationale: 주간(weeks)과 계산(reckoning)의 결합을 살려, 이 수치를 주 단위의 산정 방식으로 읽도록 옮겼습니다.
- source_word: '*፳ወ፭፡ ወ፶፮ክልኤቱ፡ መዋዕል፡፡'
  english_pob_choice: twenty-five and two days
  chosen_korean: 스물다섯과 두 날입니다
  alternatives_korean:
  - 스물다섯 주와 이틀입니다
  - 스물다섯과 이틀입니다
  lexicon: twenty-five and two days
  rationale: 영문 POB의 수량 배열을 따라 ‘스물다섯과 두 날’로 두 항목을 보존했으며, 이는 주석 없는 본문에서 수치의 특이한 병렬을 그대로 드러냅니다.
