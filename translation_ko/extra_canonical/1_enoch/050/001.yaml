  text: And in those days a change shall come for the holy ones and the chosen ones[a][b].
  footnotes:
  - marker: a
    text: Or 'compassion shall be for the holy ones and the chosen ones.' The Ge'ez wording allows a slightly smoother rendering with 'shall be,' but the main text preserves the sense of mercy arriving or coming into effect.
    reason: lexical_alternative
  - marker: b
    text: Or 'mercy shall come to be'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날들에는 성도들과 택함 받은 자들에게 변화가 임할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘변화’보다 ‘전환/역전’의 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  english_pob_choice: in those days
  chosen_korean: 그 날들에는
  alternatives_korean:
  - 그 시기에는
  - 그때에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시 문맥의 관용적 시간 표지를 살리면서, 영어 POB의 ‘in those days’와 대응되게 복수형 ‘날들’을 유지했습니다.
- source_word: ሚጠት
  english_pob_choice: a change shall come
  chosen_korean: 변화가 임할 것입니다
  alternatives_korean:
  - 전환이 올 것입니다
  - 뒤바뀜이 있을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 ሚጠት은 ‘change/turning/reversal’ 계열이므로 ‘변화’로 옮기고, 임함의 뉘앙스로 사건의 도래를 살렸습니다.
- source_word: ለቅዱሳን
  english_pob_choice: for the holy ones
  chosen_korean: 성도들에게
  alternatives_korean:
  - 거룩한 이들에게
  - 거룩한 자들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 ‘holy ones’는 정결한/구별된 자들을 가리키며, 한국어에서는 교회적 관용어를 쓰되 원문의 집단적 호칭을 보존했습니다.
- source_word: ወለኅሩያን
  english_pob_choice: and the chosen ones
  chosen_korean: 택함 받은 자들에게
  alternatives_korean:
  - 선택된 자들에게
  - 택자들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘chosen ones’는 예정론적 체계를 과도하게 부각하지 않도록, 그러나 선택의 수동성을 분명히 하는 표현으로 옮겼습니다.
theological_decisions:
- issue: ሚጠት를 ‘mercy’로 이해하지 않고 ‘change/reversal’로 읽는 문제
  chosen_reading: 본문은 자비의 도래가 아니라 성도들과 택함 받은 자들에게 임하는 ‘변화’로 번역했습니다.
  alternative_readings:
  - 긍휼이 임할 것입니다
  - 자비가 그들에게 있을 것입니다
  rationale: 게에즈 어형과 수정된 주석이 가리키는 바처럼, 여기서는 운명의 전도/전환이 핵심이므로 자비 어휘로 완화하지 않았습니다.
  doctrine_reference: 원문 우선, 묵시적 역전 모티프 보존
