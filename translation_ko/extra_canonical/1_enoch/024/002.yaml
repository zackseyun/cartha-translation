  - 일곱 개의 위엄 있는 산
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ክቡራነ의 존귀·영광·장엄의 뉘앙스를 살려 '영광스러운'을 택했고, 묵시적 장엄함을 유지했습니다.
- source_word: ወኵሉ ፩እምነ ፩እንዘ ይትዌለጥ
  english_pob_choice: each one differing from the other
  chosen_korean: 각 산은 서로 달랐고
  alternatives_korean:
  - 각각 서로 구별되었고
  - 각 산이 다른 산과 달랐고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 분리보다 질적 차이를 말하므로, '서로 달랐다'로 자연스럽게 옮겼습니다.
- source_word: ወኵሉ ክቡር ወስቡሕ ራእዮሙ ወሠናይ ገጾሙ
  english_pob_choice: all of them were glorious and splendid in appearance, and fair in face
  chosen_korean: 모두 그 모습이 영광스럽고 찬란했고 얼굴은 아름다웠습니다
  alternatives_korean:
  - 모두 그 모양이 영광스럽고 찬란했고 얼굴은 아름다웠습니다
  - 모두 그 모습이 영광스럽고 빛났으며 얼굴은 아름다웠습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ራእዮሙ는 외형/보이는 모습이므로 '그 모습'으로, ገጾሙ는 직역적 이미지인 '얼굴'을 유지해 산의 의인화된 묘사를 보존했습니다.
- source_word: ፩ዲበ ፩ / ኢይትቃረባ
  english_pob_choice: one set upon another / one not coming near to another
  chosen_korean: 하나 위에 하나씩 놓여 있었으며 ... 서로 가까이 다가가지 않았습니다
  alternatives_korean:
  - 하나 위에 하나씩 놓였으며 ... 서로 접근하지 않았습니다
  - 하나가 다른 하나 위에 놓여 있었으며 ... 서로 가까이하지 않았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 겹쳐 놓인 배열과 상호 비근접을 함께 살렸습니다. '다가가지 않았습니다'는 주체가 산/협곡의 배치를 가리킬 수 있는 여지를 남깁니다.
- source_word: ቈላት ዕሙቅ ወጠዋያት
  english_pob_choice: deep and winding ravines
  chosen_korean: 깊고 굽이치는 협곡들
  alternatives_korean:
  - 깊고 굽은 골짜기들
  - 깊고 구불구불한 협곡들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጠዋያት의 '굽이치는/비틀린' 성격을 반영해 '굽이치는'을 택했고, 산악 지형에 맞게 '협곡'으로 옮겼습니다.
theological_decisions:
- issue: 환시의 지형 묘사와 의인화 표현 보존
  chosen_reading: 산들의 '얼굴'을 그대로 살리고, 끝절의 비근접 표현을 산과 협곡의 배열을 함께 암시하는 방식으로 유지했습니다.
  alternative_readings:
  - '''얼굴''을 ''겉모습''으로 완화하는 번역'
  - '''서로 가까이 다가가지 않았다''를 단순한 공간 분리로만 바꾸는 번역'
  rationale: 본문은 산들을 거의 인격화된 존재처럼 묘사하므로, 이미지를 평면화하지 않고 환시적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 시적·묵시 문학의 이미지 보존 원칙
- issue: 문장 주어의 모호성 유지
  chosen_reading: 마지막 절의 주어를 명시적으로 특정하지 않고 '협곡들'과 '산들'의 배치를 모두 열어 두었습니다.
  alternative_readings:
  - 주어를 '산들'로 단정하는 번역
  - 주어를 '협곡들'로 단정하는 번역
  rationale: 에티오피아어의 여성형 상호부정 구조와 POB 주석이 보여 주는 애매성을 고려하면, 한국어도 결론을 과도하게 고정하지 않는 편이 원문에 충실합니다.
  doctrine_reference: 본문비평 및 서술 주체 모호성 처리
