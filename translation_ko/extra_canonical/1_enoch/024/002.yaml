revisions:
- from: 그리고 나는 그 방향으로 가서 일곱 개의 영광스러운 산을 보았습니다[a]. 각 산은 서로 달랐고, 그 돌들은 영광스럽고 아름다웠으며, 모두 그 모습이 영광스럽고 찬란했고 얼굴은 아름다웠습니다[b]. 셋은 동쪽을 향해 있었고, 하나 위에 하나씩 놓여 있었으며, 셋은 북쪽을 향해 있었고, 하나 위에 하나씩 놓여 있었고, 깊고 굽이치는 협곡들이 있어 서로 가까이 다가가지 않았습니다[c][d].
  to: 그리고 나는 내 길을 따라 가다가 일곱 개의 영광스러운 산을 보았습니다. 각 산은 다른 산과 달랐고, 그 돌들은 영광스럽고 아름다웠으며, 그 모습은 모두 영광스럽고 찬란했고 그 얼굴은 아름다웠습니다[a]. 셋은 동쪽에 있었고 서로 하나씩 다른 하나 위에 놓여 있었으며, 셋은 북쪽에 있었고 서로 하나씩 다른 하나 위에 놓여 있었습니다. 그 사이에는 깊고 굽이치는 협곡들이 있었으며, 그 협곡들은 서로 가까이 있지 않았습니다[b].
  rationale: 원문에 없는 ‘하나의 골짜기’를 제시하는 각주를 삭제하고, 원문의 ‘내 길’을 복원했습니다. 마지막 절은 여성 복수 문법과 바로 앞의 협곡들에 따라 번역했으며, 산의 의인화된 ‘얼굴’과 산군의 층층이 놓인 공간 이미지는 보존했습니다.
