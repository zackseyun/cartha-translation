  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여정의 진행을 나타내는 동사와 방향 표현을 자연스럽게 살리되, 환시적 이동의 흐름을 유지했습니다.
- source_word: ሰብዐተ አድባረ ክቡራነ
  english_pob_choice: seven glorious mountains
  chosen_korean: 일곱 개의 영광스러운 산
  alternatives_korean:
