base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/002.yaml
  text: And I went in that direction and saw seven glorious mountains[a], each one differing from the other; and their stones were glorious and beautiful, and all of them were glorious and splendid in appearance, and fair in face. Three were toward the east, one set upon another, and three toward the north, one set upon another, with deep and winding ravines[d][c][b], no one coming near to another.
  footnotes:
  - marker: a
    text: The Ge'ez description of the final landscape features is difficult. The clause rendered 'with deep ravines and one valley' may describe the spaces between the mountain groupings rather than an additional feature beside them.
    reason: textual_variant
  - marker: b
    text: The phrase 'fair in face' is intentionally retained from the Ge'ez imagery, which describes the mountains in almost personified visual terms.
    reason: cultural_note
  - marker: c
    text: Or 'along my way'.
    reason: previous_rendering
  - marker: d
    text: Or 'with deep ravines and one valley, and they did not come near one another.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 내 길을 따라 가다가 일곱 개의 영광스러운 산을 보았습니다. 각 산은 다른 산과 달랐고, 그 돌들은 영광스럽고 아름다웠으며, 그 모습은 모두 영광스럽고 찬란했고 그 얼굴은 아름다웠습니다[a]. 셋은 동쪽에 있었고 서로 하나씩 다른 하나 위에 놓여 있었으며, 셋은 북쪽에 있었고 서로 하나씩 다른 하나 위에 놓여 있었습니다. 그 사이에는 깊고 굽이치는 협곡들이 있었으며, 그 협곡들은 서로 가까이 있지 않았습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 산들을 거의 의인화하듯 묘사하는 원문의 이미지를 살리기 위해, 직역적인 ‘얼굴’을 유지했습니다.
    reason: cultural_note
  - marker: b
    text: 마지막 지형 묘사는 구문상 다소 어렵습니다. 여기서는 ‘깊고 굽이치는 협곡들’이 산들의 배치 사이에 있는 것으로 이해했습니다. 마지막 절의 여성 복수 동사는 이 협곡들을 가리키는 것으로 보입니다.
    reason: textual_variant
