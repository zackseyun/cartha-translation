base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/003.yaml
  text: And the seventh mountain was in the midst of these[a], and its height surpassed them all, resembling the seat of a throne[c][b], and fragrant trees encircled it.
  footnotes:
  - marker: a
    text: The word rendered 'in height' comes from an uncertain OCR reading; the sense is that the mountain's elevation or lofty form resembled a throne-seat.
    reason: textual_variant
  - marker: b
    text: The phrase 'seat of a throne' preserves the Ge'ez double expression rather than simplifying it to merely 'throne.'
    reason: lexical_alternative
  - marker: c
    text: Or 'among them, and in height it resembled'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 일곱째 산은 이들 가운데 있었고, 그 높이는 다른 모든 산보다 높이 솟아 있었으며[a], 그 산의 모양은 왕좌의 자리[b]와 같았고, 향기로운 나무들이 그것을 둘러싸고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈 전승의 이 부분은 불확실합니다. 다른 전승의 뒷받침에 따라, 일곱째 산이 다른 산들보다 더 높았다는 뜻으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘왕좌의 자리’입니다. 게으즈어의 이중 표현을 단순히 ‘왕좌’로 줄이지 않고 보존했습니다.
    reason: lexical_alternative
