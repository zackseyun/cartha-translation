  text: 그곳에서 나는 땅의 다른 곳으로 갔습니다. 그가 나에게 불의 산을 보여 주었는데, 그것은 낮과 밤 내내 타오르고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
