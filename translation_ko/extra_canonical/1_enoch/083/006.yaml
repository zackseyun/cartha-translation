base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/006.yaml
  text: And Malyal my grandfather lifted me up while I was lying beside him[a], and he said to me, “Why do you cry out like this, my son[c][b], and why do you lament like this?”
  footnotes:
  - marker: a
    text: The name rendered 'Malyal' likely reflects the patriarch Mahalalel in Ethiopic form; some translators normalize the name.
    reason: lexical_alternative
  - marker: b
    text: 'The wording distinguishes two related actions: first a loud crying out, then lamenting or grieving.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And Malyal lifted me up from where I was'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 말랄엘[a]이 나의 할아버지인 나를 들어 올려, 내가 그의 곁에 누워 있는 동안 나에게 말했습니다. “어찌하여 네가 이처럼 부르짖느냐, 내 아들아[b], 또 어찌하여 이처럼 애통하느냐?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 POB의 Malyal은 게으즈형을 따른 표기이며, 흔히 마할랄엘로 동일시되기도 합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서는 두 가지 서로 다른 동작이 구분됩니다. 첫째는 큰 소리로 부르는 것이고, 둘째는 슬퍼하며 애통하는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእያል
  english_pob_choice: Malyal
  chosen_korean: 말랄엘
  alternatives_korean:
  - 마할랄엘
  - 말리얄
  lexicon: Ge'ez proper name tradition / Charles Ethiopic Enoch
  rationale: 게으즈 본문의 고유명사형을 그대로 살리되, 한국어 독자가 인물 식별을 할 수 있도록 음역했습니다. 영어 POB의 Malyal을 따르면서도 널리 알려진 동일 인물 가능성은 주석으로 처리하는 편이 안전합니다.
- source_word: እምሔውየ
  english_pob_choice: my grandfather
  chosen_korean: 나의 할아버지인
  alternatives_korean:
  - 나의 조부인
  - 내 할아버지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 판독처럼 ‘my grandfather’의 의미로 이해되는 표현이므로, 관계를 분명히 드러내는 ‘나의 할아버지인’으로 옮겼습니다. 이는 단순한 위치표현이 아니라 친족 호칭입니다.
- source_word: አንሥአኒ
  english_pob_choice: lifted me up
  chosen_korean: 들어 올려
  alternatives_korean:
  - 끌어 올려
  - 일으켜
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동작의 물리성을 살려 ‘들어 올려’로 옮겼습니다. 단순히 ‘일으켜’라고 하면 장면의 생생함이 약해집니다.
- source_word: እንዘ እነ እስክብ ኀቤሁ
  english_pob_choice: while I was lying beside him
  chosen_korean: 내가 그의 곁에 누워 있는 동안
  alternatives_korean:
  - 내가 그의 곁에 누워 있을 때
  - 내가 그의 옆에 누워 있는 동안
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동시 상태를 나타내는 구문이므로 ‘동안’으로 처리했고, ኀቤሁ의 근접성을 ‘곁에’로 살렸습니다.
- source_word: ትጸርኅ / ትአወዩ
  english_pob_choice: cry out / lament
  chosen_korean: 부르짖느냐 / 애통하느냐
  alternatives_korean:
  - 외치느냐 / 슬퍼하느냐
  - 울부짖느냐 / 탄식하느냐
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사는 의미가 겹치지만 완전히 같지 않으므로, 첫째는 큰 소리의 호소인 ‘부르짖다’, 둘째는 슬픔의 표현인 ‘애통하다’로 구분했습니다.
theological_decisions:
- issue: 친족 호칭의 존칭 및 화행
  chosen_reading: 직접 화법의 ‘내 아들아’는 친밀한 부름을 유지하되, 서술문은 합쇼체로 통일했습니다.
  alternative_readings:
  - ‘내 아들’로 평서형 처리
  - ‘내 아들아’ 대신 ‘아들아’로 축약
  rationale: 본문은 조상-후손의 친밀한 대화 장면이므로 호칭의 온기를 보존하는 것이 중요합니다. 한국어에서는 ‘내 아들아’가 직접적이고 자연스럽습니다.
  doctrine_reference: Direct speech register preservation in source-grounded narrative translation
