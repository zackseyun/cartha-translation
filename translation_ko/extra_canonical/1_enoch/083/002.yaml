base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/002.yaml
  text: 'I saw two visions before I took a wife[a], and one of them was not like the other: the first when I was learning the book, and the second before I took your mother—I saw a mighty vision[d][c][b]; and concerning them I made supplication to the Lord.'
  footnotes:
  - marker: a
    text: Or 'when I was being taught the book.' The Ge'ez verb may imply either learning or being instructed.
    reason: lexical_alternative
  - marker: b
    text: '''A mighty vision'' may also be rendered ''a severe'' or ''powerful vision,'' emphasizing the intensity of the revelation.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'concerning them' could also mean 'because of them,' indicating that the visions prompted Enoch's prayer.
    reason: lexical_alternative
  - marker: d
    text: Or 'and the second, before I took your mother, I saw a mighty vision'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 아내를 맞이하기 전에 두 가지 환상을 보았는데, 그 둘은 서로 같지 않았습니다. 첫째는 내가 책을 배우고 있을 때였고, 둘째는 어머니를 맞이하기 전에였는데 — 나는 강력한 환상을 보았으며 — 그것들에 관하여 주님께 간구했습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책을 배우고 있을 때’는 ‘책을 배우다’와 ‘책을 가르침받다’의 두 가능성을 모두 열어 둔 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘강력한’은 ‘강한’, ‘심한’, ‘위력적인’의 뉘앙스를 함께 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그것들에 관하여’는 ‘그것들 때문에’로도 이해할 수 있으며, 두 환상이 기도의 계기가 되었다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘둘째는 어머니를 맞이하기 전에였는데, 나는 강력한 환상을 보았습니다’로도 옮길 수 있습니다.
    reason: previous_rendering
