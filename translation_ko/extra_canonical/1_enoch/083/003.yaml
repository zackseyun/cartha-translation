base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/003.yaml
  text: I was lying down in the house of my grandfather Mahalalel[a], and I saw in a vision that the heaven was being cleansed and swept away[c][b], and it fell upon the earth.
  footnotes:
  - marker: a
    text: Or 'the sky was being cleansed and swept away.' The Ge'ez wording is vivid but somewhat uncertain in the middle verb, which likely conveys violent removal before the fall to earth.
    reason: lexical_alternative
  - marker: b
    text: Or 'was being cleansed and swept away'.
    reason: previous_rendering
  - marker: c
    text: Or 'I lay down'.
    reason: previous_rendering
translation:
  language: ko
  text: 저는 할아버지 마할랄렐의 집에서 누워 있었는데, 환상 가운데 하늘이 무너져 내리고 끌려가다가 땅 위로 떨어지는 것을 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስኩበ፡ ኮንኩ
  english_pob_choice: I was lying down
  chosen_korean: 나는 … 누워 있었는데
  alternatives_korean:
  - 나는 누워 있었습니다
  - 나는 누워 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 분사적 배경 상태를 나타내는 구문이므로, 순간적 동작인 ‘누웠다’보다 지속 상태를 나타내는 ‘누워 있었다’가 더 정확합니다.
- source_word: በቤት፡ መላሕእል
  english_pob_choice: in the house of my grandfather Mahalalel
  chosen_korean: 할아버지 마할랄렐의 집에서
  alternatives_korean:
  - 조부 마할랄렐의 집에서
  - 할아버지 마할라렐의 집에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관계는 소유격 구조로 자연스럽게 옮기되, 본문 맥락상 아브라함 계열의 조상을 가리키는 친족어는 한국어에서 가장 직접적인 ‘할아버지’로 풀었습니다.
- source_word: በራእይ
  english_pob_choice: in a vision
  chosen_korean: 환상 가운데
  alternatives_korean:
  - 환상 속에서
  - 환상으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언·묵시 보고의 관용적 표현을 살리면서도 현대 한국어 문장 흐름에 맞게 정리했습니다.
- source_word: ሰማይ
  english_pob_choice: the heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 천상
  - 하늘 나라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 기상학적 ‘하늘’이 아니라 우주적 상공을 가리키지만, 한국어에서는 ‘the heaven’의 장중함을 유지하면서도 과도하게 교회식 용어화하지 않는 ‘하늘’이 적절합니다.
- source_word: ይትነጻጻ፡ ወይትሀየድ
  english_pob_choice: was being cleansed and swept away
  chosen_korean: 무너져 내리고 끌려가며
  alternatives_korean:
  - 뒤엉켜 무너지고 끌려가며
  - 무너져 내리고 쓸려가며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 검토본의 오독 가능성과 문맥을 반영하면 이 동사군은 정화가 아니라 폭력적 붕괴와 이탈을 가리킵니다. 따라서 한국어는 ‘무너져 내리다’와 ‘끌려가다’로 충격적 운동성을 살렸습니다.
- source_word: ወይወድቅ ዲበ፡ ምድር
  english_pob_choice: and it fell upon the earth
  chosen_korean: 땅 위에 떨어지는
  alternatives_korean:
  - 땅에 떨어지는
  - 땅 위로 떨어지는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 마지막 낙하의 방향성을 분명히 하면서, ‘upon the earth’의 포괄적 공간감을 살리기 위해 ‘땅 위에’로 옮겼습니다.
theological_decisions:
- issue: 하늘의 붕괴 이미지
  chosen_reading: 정화가 아니라 우주적 붕괴와 강제적 이탈을 묘사하는 환상으로 읽었습니다.
  alternative_readings:
  - 하늘이 정결하게 되면서 치워지는 장면
  - 하늘이 단지 가려지거나 이동하는 장면
  rationale: 문맥상 하늘이 땅으로 떨어지는 종말론적 장면이므로, 본문을 완화하여 정화 이미지로 읽으면 묵시적 긴장이 사라집니다. 한국어 번역도 그 폭력성과 충돌을 유지해야 합니다.
  doctrine_reference: 묵시 문학의 과장된 우주 붕괴 이미지를 약화시키지 않음.
