theological_decisions:
- issue: 환상적 우주 붕괴 이미지의 처리
  chosen_reading: 산·언덕·나무의 붕괴를 상징화하지 않고, 본문이 제시하는 그대로의 환상적 붕괴 장면으로 옮겼습니다.
  alternative_readings:
  - 지진이나 홍수 같은 자연재해로 일반화하기
  - 정치적 혼란의 은유로 풀어 쓰기
  rationale: 이 단락은 묵시적 환상 특유의 충격적 이미지를 의도적으로 제시하므로, 해석을 미리 정리하지 않고 원문의 낯섦을 보존하는 편이 더 충실합니다.
  doctrine_reference: 묵시 문학의 환상성을 평탄화하지 않고 보존함
- issue: 문장 첫머리의 접속 처리
  chosen_reading: ‘그리고’로 시작해 앞 절과의 연속성을 살렸습니다.
  alternative_readings:
  - 문장 첫머리를 생략하기
  - ‘그때’로 바꾸기
  rationale: 게즈어의 연속 서술 감각을 자연스러운 한국어로 반영해, 장면이 이어지는 흐름을 유지했습니다.
  doctrine_reference: 서사적 연쇄 보존
