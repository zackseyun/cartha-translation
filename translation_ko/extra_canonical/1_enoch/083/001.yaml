  rationale: 게에즈 본문은 ‘보여 주다’와 ‘말로 recount하다’라는 두 단계의 전달을 나란히 둡니다. 이를 구별해야 환상의 시각적 성격과 그에 대한 구두 보고의 성격이 함께 드러납니다.
