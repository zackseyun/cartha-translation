base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/001.yaml
  text: And now[a], my son Methuselah, I will show you all my visions that I have seen before you; I will recount them.
  footnotes:
  - marker: a
    text: 'The wording uses two verbs of disclosure: first ''show,'' then ''recount/tell.'' The pairing emphasizes both visionary display and spoken narration.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내 아들 메투살라야, 내가 네 앞에서 본 내 모든 환상을 네게 보여 주겠습니다. 또 그것들을 이야기하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 ‘보여 주다’와 ‘이야기하다’라는 두 전달 동사를 함께 사용합니다. 이는 환상을 제시하는 것과 그것을 말로 서술하는 것을 모두 드러냅니다.
    reason: lexical_alternative
