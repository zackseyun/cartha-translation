  chosen_korean: 제가 그에게 ... 말하니
  alternatives_korean:
  - 제가 그에게 이야기했습니다
  - 제가 그에게 전했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 서술적 보고 동사로 자연스럽게 옮기되, 수신자에게 전달하는 행위를 분명히 살리기 위해 ‘말하니’로 처리했습니다.
