  alternatives_korean:
  - 심하고
  - 준엄하고
  - 무겁고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 꿈의 위중함과 경고성을 살리기 위해 형용사적 의미를 ‘엄중하다’로 옮겼습니다.
- source_word: ኅቡኣተ ኵሉ ኃጢአተ ምድር
  english_pob_choice: it reveals all the hidden sin of the earth
  chosen_korean: 땅의 모든 숨겨진 죄를 드러내며
  alternatives_korean:
  - 땅의 모든 죄를 숨기며
  - 땅의 모든 감춰진 죄를 감추며
  - 땅의 모든 죄를 덮으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: English audit의 ‘hidden sin’을 따르되, 에티오피아어의 ‘숨기다/감추다’ 계열과 문맥상의 묵시적 폭로 의미를 함께 살려 ‘드러내다’로 번역했습니다.
- source_word: ቀላይት
  english_pob_choice: abyss
  chosen_korean: 깊은 곳
  alternatives_korean:
  - 심연
  - 무저갱
  - 바다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석의 코스믹한 ‘abyss’ 의미를 살리되, 한국어에서 과도하게 교회화된 어휘를 피하기 위해 본문에는 ‘깊은 곳’을 쓰고 주석에서 심연 성격을 보완했습니다.
- source_word: ተሐጕል ኅጕለ ዐቢየ
  english_pob_choice: be destroyed with a great destruction
  chosen_korean: 큰 멸망으로 멸망할 것이다
  alternatives_korean:
  - 크게 파괴될 것이다
  - 큰 파멸로 파멸할 것이다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동계 반복을 유지하는 아포칼립스적 강조를 살리기 위해 ‘멸망으로 멸망하다’의 어색함을 감수하고 원문의 강한 중첩을 반영했습니다.
theological_decisions:
- issue: ‘숨겨진 죄’와 ‘드러내다’의 관계
  chosen_reading: 환상은 땅의 죄를 ‘숨기기’보다 ‘드러내는’ 기능으로 옮겼습니다.
  alternative_readings:
  - 죄를 숨긴다
  - 죄를 포괄한다
  - 죄를 감춘다
  rationale: 에티오피아어 구절은 난해하지만, POB audit가 지적한 바와 같이 묵시 문맥에서는 종종 드러남과 심판의 뜻이 더 자연스럽습니다. 따라서 해석상 긴장을 유지하되, 폭로-심판 흐름을 본문에 반영했습니다.
  doctrine_reference: Preserve theological tension rather than over-resolve the compressed syntax.
- issue: ‘깊은 곳’의 종말론적 뉘앙스
  chosen_reading: 본문은 물리적 바다보다 심판의 심연을 암시하는 표현으로 읽었습니다.
  alternative_readings:
  - 바다
  - 무저갱
  - 깊음
  rationale: 원문과 영어 주석 모두 물의 깊음과 우주적 심연의 중간 지점을 가리키므로, 본문은 중립적인 ‘깊은 곳’으로 두고 의미는 주석으로 보존했습니다.
  doctrine_reference: Avoid collapsing apocalyptic imagery into a single overly specific referent.
