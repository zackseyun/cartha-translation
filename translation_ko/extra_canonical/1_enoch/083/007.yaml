  - 비전
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시 문맥의 ራእየ는 단순한 시각이 아니라 계시적 체험을 가리키므로 ‘환상’이 가장 직접적입니다.
