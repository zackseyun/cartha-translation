  naturalness: ‘심판의 주’는 현대 표준 한국어의 성서적 문체에서는 다소 경직되므로 ‘심판의 주님’이 더 자연스럽습니다. ‘하늘의 표면 위로’는 원문의 ‘하늘의 얼굴/표면’을 살린 직역적 표현으로 유지할 수 있으나, 문장 전체의 병렬과 동작 연결을 정돈할 필요가 있습니다.
  terminology: ‘송축하다’, ‘높이 찬양하다’, ‘심판의 주님’은 현대 격식체 성서 문맥에 자연스럽고, 특정 교파의 해석을 강요하지 않습니다. 마지막 대명사는 한국어에서 ‘그에게’로 옮기고, 주석에서 문법 성과 지시 대상의 불확정성을 밝혀야 합니다.
  issues:
