base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/011.yaml
  text: And when I went out below and saw the heaven[a], and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning, then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven[c][b], and set out and followed the path which He showed it.
  footnotes:
  - marker: a
    text: The phrase 'below' translates a spatial term that could also be rendered 'down' or 'beneath'; the exact reference depends on the larger dream setting.
    reason: lexical_alternative
  - marker: b
    text: The object is simply 'him' in the Ge'ez; the verse itself does not restate the figure's identity.
    reason: alternative_reading
  - marker: c
    text: Or 'And when I went out below, I saw him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 아래로 나가 하늘과, 동쪽에서 떠오르는 해와, 서쪽으로 지는 달과, 몇몇 별들과, 온 땅과, 시작할 때 그분이 아셨던 그대로의 모든 것을 보았을 때, 나는 심판의 주를 찬송하고 그분을 높였습니다. 이는 그분이 해를 동쪽 창문들에서 내어 보내셨고, 해는 하늘의 표면 위로 올라가 떠오르며, 그분이 그것에게 보여 주신 길을 따라 나아갔기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아래로’는 공간적 방향을 나타내는 말로, 본문 맥락에 따라 ‘아래에서’ 또는 ‘밑으로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해’ 뒤의 대명사는 원문 주해상 해를 가리키는 것으로 이해할 수 있으나, 절 자체는 그 지시를 다시 밝히지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 이 문맥의 ‘하늘’은 우주적 하늘을 가리키는 표현으로, 보다 직역하면 ‘하늘의 얼굴/표면’에 가깝습니다.
    reason: source_note
