theological_decisions:
- issue: 그분 / 해의 지시 관계
  chosen_reading: ‘그분’은 앞선 주권자(심판의 주)를 가리키고, ‘그것’은 해를 가리키는 것으로 구분했습니다.
  alternative_readings:
  - ‘그분’을 반복해 동일 주체로 읽는 방식
  - 해의 인격화를 더 강하게 반영해 일관되게 ‘그분’으로 옮기는 방식
  rationale: 지시 대상을 한국어 대명사로 구분해야 원문이 말하는 주권자와 창조 질서의 대상이 구별되며, 본문의 긴장을 보존할 수 있습니다.
  doctrine_reference: Preserve referential ambiguity and distinction between Creator and created phenomenon.
