base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/009.yaml
  text: My son[a], from heaven all this will come upon the earth[c][b], and upon the earth there will be a great destruction.
  footnotes:
  - marker: a
    text: The phrase rendered 'all this' may also be understood more generally as 'all' or 'all these things'; the Ge'ez form is somewhat difficult in this OCR witness.
    reason: lexical_alternative
  - marker: b
    text: '''Earth'' could in some contexts be rendered ''land,'' but the broader apocalyptic setting favors the cosmic sense.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And my son from heaven will say, ‘Let all this be upon the earth, and upon the earth there shall be a great destruction.’'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아들아, 하늘에서 이 모든 것이 땅 위에 임할 것이며, 땅 위에는 큰 멸망이 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아들’은 1인칭 소유가 붙은 직접 호칭입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅’으로도 옮길 수 있으나, 여기서는 우주적 심판의 범위를 고려해 ‘땅 위’로 처리했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이 모든 것’은 더 넓게는 ‘모든 것’ 또는 ‘이 모든 일들’로도 이해될 수 있습니다.
    reason: lexical_alternative
