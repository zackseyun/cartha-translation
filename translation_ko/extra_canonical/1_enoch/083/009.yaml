theological_decisions:
- issue: ‘my son’의 지시 대상과 해석 범위
  chosen_reading: 직역에 가까운 호칭으로 유지해 인물의 정체를 단정하지 않았습니다.
  alternative_readings:
  - 메시아적 인물로 명시
  - 상징적 환상 속 아들로 해석
  rationale: 본문 자체는 이 인물의 정체를 충분히 해명하지 않으므로, 번역에서 후대 해석을 덧씌우지 않고 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
