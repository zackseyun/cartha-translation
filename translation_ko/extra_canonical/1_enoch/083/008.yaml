base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/008.yaml
  text: And now[a], my son, rise and make your petition to the Lord of glory, since you are faithful[b], that a remnant may remain upon the earth and that he may not wipe out the whole earth.
  footnotes:
  - marker: a
    text: The Ge'ez uses a doubled expression for what is left over ('remain a remnant' / 'be left as residue'), which is rendered here as 'a remnant may remain' to preserve the emphasis.
    reason: lexical_alternative
  - marker: b
    text: The title 'Lord of glory' is kept as a formal divine epithet rather than simplified to 'glorious Lord.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이제, 내 아들아, 일어나서 영광의 주께 네 청을 드리십시오. 네가 신실하기 때문이니, 땅 위에 남은 자가 남아 있게 하고 그분이 온 땅을 멸망시키지 않게 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 원문은 ‘남아 있는 것’과 유사한 중복 표현을 사용하므로, 그 강조를 살려 ‘남은 자가 남아 있게’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영광의 주’는 원문의 격조 높은 신적 칭호를 그대로 살린 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ተንሥእ
  english_pob_choice: rise
  chosen_korean: 일어나서
  alternatives_korean:
  - 일어서서
  - 일어나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 즉각적인 행동을 촉구하는 명령형으로서 자연스러운 한국어는 ‘일어나서’입니다. ‘일어서서’는 다소 물리적이고, ‘일어나’는 뒤이은 동작과의 연결이 약합니다.
- source_word: አስተብቍዖ
  english_pob_choice: make your petition
  chosen_korean: 청을 드리십시오
  alternatives_korean:
  - 간구하십시오
  - 간청하십시오
  - 기도하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순한 일반 기도보다 간절한 요청/탄원을 뜻하므로, 위격적 대상에게 올리는 공식적 청원을 살려 ‘청을 드리십시오’로 옮겼습니다.
- source_word: ለእግዚአ ስብሐት
  english_pob_choice: to the Lord of glory
  chosen_korean: 영광의 주
  alternatives_korean:
  - 영광의 주님
  - 영광스러운 주
  - 영광의 주님께
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 속격적 칭호를 그대로 살려 ‘영광의 주’로 옮겼습니다. POB의 문체처럼 수식어를 풀어 일반적 경건어로 완화하지 않았습니다.
- source_word: መሃይምን
  english_pob_choice: faithful
  chosen_korean: 신실하기 때문이니
  alternatives_korean:
  - 믿음이 있으시기 때문이니
  - 믿는 자이기 때문이니
  - 신뢰할 만하기 때문이니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 하늘 법정적/중보적 요청의 근거를 제시하므로, 단순 인지적 ‘믿음’보다 관계적·윤리적 충실성을 드러내는 ‘신실하다’가 적합합니다.
- source_word: ይትረፍ ትራፍ
  english_pob_choice: a remnant may remain
  chosen_korean: 남은 자가 남아 있게
  alternatives_korean:
  - 남은 자가 남게
  - 남은 자가 남도록
  - 한 남은 자가 남아 있게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 중복 표현이 남아 있는 것의 강조를 이루므로, 한국어에서도 ‘남은 자가 남아 있게’로 반복성을 살렸습니다. ‘remnant’는 이 문맥에서 공동체적/종말론적 ‘남은 자’로 이해했습니다.
- source_word: ወኢይደምስሳ ለኵላ ምድር
  english_pob_choice: and that he may not wipe out the whole earth
  chosen_korean: 그분이 온 땅을 멸망시키지 않게 하십시오
  alternatives_korean:
  - 그분이 온 땅을 없애지 않게 하십시오
  - 그분이 온 땅을 다 멸하지 않게 하십시오
  - 그분이 온 땅을 쓸어버리지 않게 하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 총체적 파괴의 강도를 유지하되, 한국어 성경체에서 자연스러운 ‘멸망시키다’를 택했습니다. ‘온 땅’은 보편적 범위를 보존합니다.
theological_decisions:
- issue: መሃይምን의 의미를 ‘믿음’ 중심으로 좁힐지, ‘신실함/신실한 사람’으로 넓혀 둘지
  chosen_reading: 신실하기 때문이니
  alternative_readings:
  - 믿음이 있으시기 때문이니
  - 신뢰할 만하기 때문이니
  rationale: 이 구절에서는 Enoch가 심판 앞에서 중보를 맡을 수 있는 자격이 강조되므로, ‘믿음’만으로 좁히기보다 하나님 앞에서의 신실성을 함께 드러내는 번역이 원문 기능을 더 잘 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
