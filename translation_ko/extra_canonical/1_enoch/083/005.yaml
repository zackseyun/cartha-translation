base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/005.yaml
  text: And a word fell into my mouth because of it[a], and I lifted up a cry and said[d][c][b], “The earth is destroyed.”
  footnotes:
  - marker: a
    text: Or 'from it' or 'thereupon'; the opening phrase may mark source, cause, or sequence from the preceding vision.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'a word fell into my mouth,' an idiom for an utterance that came upon the speaker.
    reason: cultural_note
  - marker: c
    text: The verb behind 'is swallowed up' may also be understood more generally as 'is overwhelmed' or 'has perished.'
    reason: lexical_alternative
  - marker: d
    text: Or 'The earth is swallowed up.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그것으로 인해 내 입에 한 말씀이 떨어졌고, 내가 큰 소리로 외치며 말했습니다. 「땅이 멸망했습니다.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에서’, ‘그로 말미암아’로도 볼 수 있습니다. 앞선 환상과의 관계를 원인, 근거, 또는 이어짐으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘내 입에 한 말씀이 떨어졌다’로, 말이 스스로 임한 듯한 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 이 동사는 더 일반적으로 ‘파멸하다’, ‘소멸하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘땅이 삼켜졌습니다’로 옮길 수도 있으나, 이 절의 동사에는 ‘멸망하다’의 의미가 더 잘 맞습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: እምኔሁ
  english_pob_choice: because of it
  chosen_korean: 그것으로 인해
  alternatives_korean:
  - 그것 때문에
  - 그로 말미암아
  - 그것에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 앞선 환상이 원인·계기가 되어 뒤의 발화가 일어난 것으로 읽히므로, 원인성을 드러내는 표현을 택했습니다.
- source_word: ወድቀ፡ ነገር፡ ውስተ፡ አፉየ
  english_pob_choice: a word fell into my mouth
  chosen_korean: 내 입에 한 말씀이 떨어졌고
  alternatives_korean:
  - 내 입으로 한 말이 들어왔고
  - 내 입에 말씀이 들어왔고
  - 말씀이 내 입에 임했고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘말씀이 입에 떨어졌다’는 관용적·비의도적 발화의 이미지를 살리기 위해 직역에 가깝게 유지했습니다. ‘한 말씀’은 Ge'ez의 ነገር을 단순한 소리보다 의미 있는 발화로 보이게 합니다.
- source_word: አንሣእኩ እጽራሕ
  english_pob_choice: I lifted up a cry
  chosen_korean: 내가 큰 소리로 외치며
  alternatives_korean:
  - 내가 외쳐 부르며
  - 내가 부르짖으며
  - 내가 소리를 높이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘들어 올리다’의 동작을 한국어에서 자연스럽게 드러내면서, 뒤의 ‘cry’가 단순한 말이 아니라 강한 외침임을 표현했습니다.
- source_word: ተሐጕለት ምድር
  english_pob_choice: The earth is destroyed
  chosen_korean: 땅이 멸망했습니다
  alternatives_korean:
  - 땅이 파멸했습니다
  - 땅이 소멸했습니다
  - 땅이 삼켜졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석의 어휘 검토에 따라 이 동사는 ‘삼켜지다’보다 ‘파괴되다/멸망하다’의 의미가 더 적합하므로, 종말적 붕괴를 직접적으로 드러내는 ‘멸망했습니다’를 택했습니다.
theological_decisions:
- issue: 환상 보고의 직접 인용부에서의 문체 유지
  chosen_reading: 직접 인용 안에서 통상 서술체를 유지하고, ‘땅이 멸망했습니다’처럼 단정적 선언으로 번역했습니다.
  alternative_readings:
  - ‘땅이 멸망했습니다’ 대신 ‘땅이 파멸했습니다’로 완화
  - ‘말씀’보다 ‘말’로 중화
  rationale: 이 구절은 예언/환상 중에 터져 나온 긴박한 선언이므로, 완곡하게 만들지 않고 원문의 강도를 유지하는 것이 적절합니다.
  doctrine_reference: 예언적 환상의 긴급성과 심판 선언의 직접성 보존
