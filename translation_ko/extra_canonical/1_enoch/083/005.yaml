base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/005.yaml
  text: And a word fell into my mouth because of it[a], and I lifted up a cry and said[d][c][b], “The earth is destroyed.”
  footnotes:
  - marker: a
    text: Or 'from it' or 'thereupon'; the opening phrase may mark source, cause, or sequence from the preceding vision.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'a word fell into my mouth,' an idiom for an utterance that came upon the speaker.
    reason: cultural_note
  - marker: c
    text: The verb behind 'is swallowed up' may also be understood more generally as 'is overwhelmed' or 'has perished.'
    reason: lexical_alternative
  - marker: d
    text: Or 'The earth is swallowed up.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그것으로 말미암아[a] 내 입에 말이 떨어졌고[b], 나는 소리를 높여 외치며 말했습니다. “땅이 멸망했습니다.”[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에서’, ‘그로 말미암아’로도 볼 수 있습니다. 앞선 환상과의 관계를 원인, 근거, 또는 이어짐으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘내 입에 말이 떨어졌다’로, 말이 스스로 임한 듯한 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 이 동사는 더 일반적으로 ‘파멸되다’, ‘소멸하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 이전 번역에는 ‘땅이 삼켜졌습니다’로 옮긴 경우도 있으나, 이 절의 동사에는 ‘멸망하다’의 의미가 더 잘 맞습니다.
    reason: previous_rendering
