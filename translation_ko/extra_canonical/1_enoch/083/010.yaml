base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/010.yaml
  text: And after this I arose and prayed and entreated and asked[a], and I wrote down my prayer for the generations of the world; and I showed you everything[b], my son Methuselah.
  footnotes:
  - marker: a
    text: Or 'for all future generations' or 'for the generations forever'; the Ge'ez phrase can carry the sense of enduring generations beyond the present age.
    reason: lexical_alternative
  - marker: b
    text: Or 'and I showed everything to you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일 후에 나는 일어나 기도하고 간구하며 요청하였고[a], 세상의 세대들을 위하여 내 기도를 기록하였습니다. 그리고 내 아들 메투셀라야, 내가 너에게 모든 것을 보였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 장차 올 세대들을 위하여’, ‘영원한 세대들을 위하여’로도 옮길 수 있습니다. 게즈어 구문은 현세를 넘어 지속되는 세대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 모든 것을 너에게 보였습니다’.
    reason: previous_rendering
