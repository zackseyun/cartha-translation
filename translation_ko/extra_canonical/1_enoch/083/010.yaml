theological_decisions:
- issue: ‘for the generations of the world’의 범위
  chosen_reading: 세상의 세대들을 위하여
  alternative_readings:
  - 앞으로 올 모든 세대를 위하여
  - 영원한 세대들을 위하여
  rationale: 본문이 지시하는 시간 범위를 단정적으로 좁히지 않고, 원문의 세대-세계 표현이 가진 개방성을 유지했습니다.
  doctrine_reference: 해석이 갈릴 수 있는 표현은 본문의 긴장을 보존하는 쪽을 우선합니다.
- issue: ‘I showed you everything’의 시제와 전승
  chosen_reading: 내가 너에게 모든 것을 보였습니다
  alternative_readings:
  - 내가 너에게 모든 것을 보여 주었습니다
  rationale: 제공된 영어 POB와 최신 수정은 과거형으로 정리되어 있어, 서술의 연속성을 살려 완료형으로 옮겼습니다.
  doctrine_reference: 본문 흐름과 문맥이 우선이며, 별도 해석을 덧씌우지 않습니다.
