  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비전 보고의 반복적 재개를 자연스러운 합쇼체로 옮기면서, 동일 장면 안의 새 국면이라는 뉘앙스를 살렸습니다.
- source_word: ርኢኩ በራእይ
