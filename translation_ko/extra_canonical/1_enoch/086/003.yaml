theological_decisions:
- issue: ‘별들’의 정체를 본문에서 규정할 것인가
  chosen_reading: 본문은 ‘별들’ 이미지를 그대로 유지하고, 천상 존재로의 해석은 본문 밖의 독자 판단에 맡겼습니다.
  alternative_readings:
  - 천사들
  - 타락한 천상 존재들
  rationale: 에티오피아어 원문이 말하는 표층 이미지는 ‘별들’이므로, 상징을 본문에서 해설로 바꾸지 않고 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 상징 해석을 본문에서 확정하지 않고 원문 이미지 보존
- issue: ‘내던져졌고’의 강도
  chosen_reading: 단순한 ‘떨어졌다’보다 ‘내던져졌고’로 옮겨, 심판적 추락의 수동성을 드러냈습니다.
  alternative_readings:
  - 떨어졌고
  - 던져졌고
  rationale: 수동적 강제성을 가진 동사가 본문 분위기와 더 잘 맞으며, 비전의 심판성을 약화시키지 않습니다.
  doctrine_reference: 원문 수동태/피동 의미의 보존
