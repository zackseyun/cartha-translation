  - 하늘을 올려다보니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수직적 시선 이동을 드러내면서도, 이어지는 ‘보라’와 함께 자연스러운 서술 흐름을 만들었습니다.
- source_word: ከዋክብተ ብዙኃነ
  english_pob_choice: many stars
  chosen_korean: 많은 별들
  alternatives_korean:
  - 수많은 별들
  - 별들이 많이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 표층 이미지를 그대로 유지해 상징 해석을 본문에 미리 끼워 넣지 않았습니다.
- source_word: ተገደፉ እምሰማይ
  english_pob_choice: were cast from heaven
  chosen_korean: 하늘에서 그 첫 번째 별에게로 내던져졌고
  alternatives_korean:
  - 하늘에서 던져졌고
  - 하늘에서 쫓겨났고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형의 강한 추방·투척 의미를 살렸고, POB의 문맥상 앞서 언급된 ‘첫 번째 별’을 가리키는 지시를 반영했습니다.
- source_word: ጣዕዋ አልህምት
  english_pob_choice: among those calves they became bulls
  chosen_korean: 그 송아지들 가운데서 그것들은 소들이 되었으며
  alternatives_korean:
  - 그 송아지들 가운데서 그것들은 황소들이 되었으며
  - 그 송아지들 가운데서 그것들은 소로 변했으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 판독을 따라 ‘송아지들’과 ‘소들’을 반영했으며, 변형의 상징성을 보존하되 과도하게 해석하지 않았습니다.
- source_word: ይትረዓዩ
  english_pob_choice: they pastured with them
  chosen_korean: 그들과 함께 풀을 뜯었습니다
  alternatives_korean:
  - 그들과 함께 풀을 뜯었고
  - 그들 곁에서 풀을 뜯었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 어근이 ‘보다’가 아니라 ‘풀을 뜯다/초식하다’ 계열이라는 판독을 반영해, 본문을 자연스럽고 구체적으로 옮겼습니다.
theological_decisions:
- issue: ‘별들’의 정체를 본문에서 규정할 것인가
  chosen_reading: 본문은 ‘별들’ 이미지를 그대로 유지하고, 천상 존재로의 해석은 본문 밖의 독자 판단에 맡겼습니다.
  alternative_readings:
  - 천사들
  - 타락한 천상 존재들
  rationale: 에티오피아어 원문이 말하는 표층 이미지는 ‘별들’이므로, 상징을 본문에서 해설로 바꾸지 않고 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: 상징 해석을 본문에서 확정하지 않고 원문 이미지 보존
- issue: ‘내던져졌고’의 강도
  chosen_reading: 단순한 ‘떨어졌다’보다 ‘내던져졌고’로 옮겨, 심판적 추락의 수동성을 드러냈습니다.
  alternative_readings:
  - 떨어졌고
  - 던져졌고
  rationale: 수동적 강제성을 가진 동사가 본문 분위기와 더 잘 맞으며, 비전의 심판성을 약화시키지 않습니다.
  doctrine_reference: 원문 수동태/피동 의미의 보존
