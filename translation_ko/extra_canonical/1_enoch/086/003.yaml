base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/003.yaml
  text: And again I saw in the vision[a], and I looked up to heaven; and behold, I saw many stars. They came down and were cast from heaven to that first star, and among those calves they became bulls[d][c][b], and they pastured with them.
  footnotes:
  - marker: a
    text: The phrase 'that first star' likely points back to a previously mentioned star in the vision rather than introducing a new figure.
    reason: cross_reference
  - marker: b
    text: '''Stars'' may symbolize heavenly beings, but the translation keeps the visionary image explicit rather than interpreting it in the main text.'
    reason: lexical_alternative
  - marker: c
    text: The final clause is difficult. The Ge'ez most naturally yields 'they were seen among them,' though 'they appeared with them' is also possible.
    reason: alternative_reading
  - marker: d
    text: Or 'among those bulls they became horses, and they were seen among them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다시, 나는 환상 가운데서 보았습니다. 하늘을 올려다보니, 보라, 많은 별들이 있었습니다.[b] 그것들은 내려와 하늘에서 그 첫 별에게로 내던져졌습니다.[a] 그 송아지들 가운데서 그것들은 황소들이 되어 그들과 함께 풀을 뜯었습니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 첫 별’은 새 인물을 도입한다기보다 이 환상에서 앞서 언급된 별을 가리키는 표현으로 이해할 수 있습니다.
    reason: cross_reference
  - marker: b
    text: ‘별들’은 천상 존재를 상징할 수 있지만, 본문은 그 상징을 해설하지 않고 이미지 자체를 유지합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 동사는 ‘보다’가 아니라 ‘풀을 뜯다, 목축하다’라는 뜻으로 이해하여 ‘그들과 함께 풀을 뜯었습니다’로 옮겼습니다.
    reason: alternative_reading
  - marker: d
    text: 이전 번역 전통에는 이 부분을 ‘말들이 되었다’ 또는 ‘그들 가운데서 보였다’로 읽는 대안도 있으나, 여기서는 ‘송아지들 가운데서 황소들이 되어 그들과 함께 풀을 뜯었다’는 독해를 따릅니다.
    reason: previous_rendering
