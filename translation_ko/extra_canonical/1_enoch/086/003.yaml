  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: apocalyptic한 시야를 분명히 하되, ‘환상 가운데서’로 한국어 문맥에 맞는 문어적 표현을 택했습니다.
- source_word: ነጸርክዎ ለሰማይ
