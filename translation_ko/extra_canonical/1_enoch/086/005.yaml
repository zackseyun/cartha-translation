theological_decisions:
- issue: 상징 동물 이미지를 해석적으로 풀어쓸지, 본문 표면의 동물 묘사를 유지할지
  chosen_reading: 동물 이미지를 그대로 유지하여 가축, 이빨, 뿔의 장면을 직접적으로 옮겼습니다.
  alternative_readings:
  - 가축을 상징하는 인간 집단으로 풀어쓰기
  - 공격 주체와 대상의 의미를 설명적으로 덧붙이기
  rationale: Animal Apocalypse의 문학적 방식은 지속적인 동물 상징이므로, 본문이 제공하지 않는 해석을 덧붙이지 않고 독자가 장면의 충격을 그대로 읽도록 했습니다.
  doctrine_reference: '본문 중심 원칙: 상징을 평탄화하지 말고, 본문이 말하는 이미지 자체를 보존합니다.'
