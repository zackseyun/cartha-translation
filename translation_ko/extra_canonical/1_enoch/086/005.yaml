base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/005.yaml
  text: And all the cattle feared them and were terrified by them[b][a], and they began to bite with their teeth and to devour and to gore with their horns.
  footnotes:
  - marker: a
    text: 'The Ge''ez keeps the animal imagery explicit: the cattle react in fear and then attack with teeth and horns. The symbolic referents are not supplied in the text itself.'
    reason: cultural_note
  - marker: b
    text: Or 'And all the cattle feared them and were terrified before them, and they began to bite with their teeth and to devour, and to gore with their horns.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 모든 가축은 그들을 두려워하여 그들 앞에서 떨었으며, 이들은 자기들의 이빨로 물고, 삼키고, 자기들의 뿔로 들이받기 시작했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으어즈 본문은 동물의 두려움과 공격 동작을 구체적으로 유지하며, 상징적 지시 대상은 본문 안에서 설명되지 않습니다.
    reason: source_note
  - marker: b
    text: 또는 “그리고 모든 가축은 그들을 두려워하여 그들 앞에서 떨었으며, 이들은 자기들의 이빨로 물고, 삼키고, 자기들의 뿔로 들이받기 시작했습니다.”
    reason: previous_rendering
