  text: 그들은 다시 그 가축들을 집어삼키기 시작했습니다. 보십시오, 땅의 모든 자녀가 [떨며 도망치기] 시작했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 게즈어 전사문은 ‘시작했다’에서 끝납니다. 대괄호 안의 ‘떨며 도망치기’는 더 완전한 형태로 전해진 읽기에 따라 보충한 말입니다.
    reason: textual_note
  - marker: b
    text: ‘땅의 자녀’는 ‘땅의 사람들’로 풀어 옮기지 않고, 묵시문학적 표현을 문자적으로 유지한 것입니다.
    reason: cultural_note
