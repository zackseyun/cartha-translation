  naturalness: 초안의 ‘음부’는 현대 한국어에서 주로 여성 성기를 가리켜, 남성적 행위자로 묘사되는 주어에 부정확하고 어색합니다. ‘성기를 내보이며’가 원문의 동적·노골적인 표현을 자연스럽고 분명하게 옮깁니다. ‘소들 위로 올라가기’보다 ‘암소들 위에 올라타기’가 이 성적 문맥에서 자연스럽습니다.
  terminology: ‘암소들’은 አንስት አልህምት(암컷 소들)을 충실히 반영합니다. ‘잉태하다’는 적절하나, 그 주어를 ‘그 암소들’로 밝혀 남성 주어가 잉태하는 것으로 읽힐 수 있는 모호성을 제거해야 합니다. 각주에서는 ‘게에즈어’ 표기를 사용하고, 성별 편향이 있는 ‘음부’라는 설명을 제거해야 합니다.
