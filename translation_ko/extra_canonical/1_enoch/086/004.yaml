base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/004.yaml
  text: 'And I looked at them and saw: behold[a], they all let out their private parts like horses, and they began to mount the cows; and they all conceived and gave birth to elephants, camels[c][b], and donkeys.'
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'let out their private parts' is sexually explicit and likely refers to the males exposing or extending their genitals; 'private parts' is a modest but clear rendering.
    reason: lexical_alternative
  - marker: b
    text: The final animal list may denote the offspring produced in the vision's symbolic cross-breeding. The imagery is part of the Animal Apocalypse's allegorical scheme, not ordinary zoological description.
    reason: cultural_note
  - marker: c
    text: Or 'the female elephants'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그들을 바라보니, 보라, 그들 모두가 말들처럼 자기들의 음부를 드러내고 있었으며, 소들 위로 올라가기 시작했습니다. 그리고 그들 모두가 잉태하여 코끼리와 낙타와 나귀를 낳았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez의 표현은 성적 노출을 뜻하며, 여기서는 노골적이지만 한국어로는 ‘음부를 드러내다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 마지막 동물 목록은 환시 속 상징적 교배의 결과를 가리키며, 일반적인 동물학적 서술이 아닙니다.
    reason: cultural_note
