base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/001.yaml
  text: And again I looked with my eyes while I was sleeping[a], and I saw heaven above, and behold, one star fell from heaven[c][b], and it arose and ate and grazed in the midst of those cattle.
  footnotes:
  - marker: a
    text: In the Animal Apocalypse, stars commonly function as symbolic heavenly beings, but the verse itself says 'star.'
    reason: cross_reference
  - marker: b
    text: The final verbs are literally 'ate and grazed/fed,' preserving the animal imagery of the vision rather than smoothing it into a single action.
    reason: lexical_alternative
  - marker: c
    text: Or 'calves'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 잠들어 있는 동안 다시 내 눈으로 보았는데, 위의 하늘을 보았습니다. 그런데 보라, 한 별[a]이 하늘에서 떨어졌습니다[b]. 그 별은 일어나 그 소떼 가운데에서 먹고 풀을 뜯었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 동물 묵시에서는 별이 흔히 상징적 천상 존재를 가리키지만, 이 절 자체는 ‘별’이라고 말합니다.
    reason: cross_reference
  - marker: b
    text: 원문은 하늘에서의 하강을 강하게 그리므로, 해석을 완화하지 않고 ‘떨어졌습니다’로 옮겼습니다.
    reason: source_note
  - marker: c
    text: 두 동작은 문자적으로 ‘먹고’와 ‘풀을 뜯고/먹이다’입니다. 동물 비유의 이미지를 살리기 위해 구분해 옮겼습니다.
    reason: lexical_alternative
