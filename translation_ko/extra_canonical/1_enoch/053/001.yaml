base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/001.yaml
  text: There my eyes saw a valley whose mouths were open and deep; and all who dwell on the dry land and the sea and the islands will bring gifts and offerings and presents to it, yet that deep valley will not be filled.
  footnotes:
  - marker: a
    text: The Ge'ez text is difficult in the phrase describing the valley's 'mouths.' The translation understands the image as a deep valley with gaping openings.
    reason: textual_variant
  - marker: b
    text: The three nouns rendered 'gifts and offerings and presents' are near-synonymous in this context and may denote tribute brought from all regions of the world.
    reason: lexical_alternative
  - marker: c
    text: Or 'a deep valley with open mouths'.
    reason: previous_rendering
translation:
  language: ko
  text: 그곳에서 내 눈은 입구들이 열려 있고 깊게 파인 골짜기를 보았습니다[a]. 그리고 마른 땅과 바다와 섬들에 사는 모든 이들이 예물과 제물과 선물을 그곳으로 가져올 것이나[b], 그 깊은 골짜기는 채워지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘입들/개구부’는 지형의 틈이나 열린 부분을 가리키는 난해한 표현입니다. 또는 ‘입들이 열려 있고 깊은 골짜기’로 옮길 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 세 명사는 가까운 뜻을 가진 말들이며, 이 문맥에서는 전 세계에서 바쳐지는 헌납물을 누적적으로 가리킬 수 있습니다.
    reason: lexical_alternative
