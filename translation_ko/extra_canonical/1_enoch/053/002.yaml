  - 영원무궁토록 남지 못할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 주석이 지적하듯 끝 절은 부정 입자와 관련된 본문 불확실성이 있어, ‘멸망하다’보다 더 문자적인 ‘남아 있지 못하다’로 보수적으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 종말론적 결과를 어떻게 표현할지
  chosen_reading: 죄인들은 하나님의 임재에서 제거되고, 땅에서 뿌리째 뽑혀, 영원히 남아 있지 못합니다.
  alternative_readings:
  - 죄인들이 완전히 멸망한다는 뜻으로 읽을 수 있습니다.
  - 영원한 추방을 강조하는 표현으로 읽을 수 있습니다.
  rationale: 게에즈 본문과 영어 POB 주석 모두 마지막 절을 문자적으로 확정하기 어렵지만, 전체 문맥은 분명한 심판과 추방의 공식입니다. 그래서 한국어 본문은 결과를 강하게 드러내되, 존재론적 소멸 여부는 과도하게 단정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
