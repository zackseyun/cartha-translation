    reason: textual_variant
  - marker: c
    text: 직역하면 ‘그들은 영원무궁토록 남아 있지 않을 것이다’입니다. 부정 입자와 관련하여 본문상 불확실성이 보고되어 있습니다.
    reason: textual_variant
