  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 제공된 영어 본문은 표면상 체인 이미지보다 ‘lawless deeds’의 의미를 본문 핵심으로 잡고 있어, 한국어는 그 의미를 직접 드러내는 쪽을 택했습니다. 다만 이 구절의 게에즈 전승은 난해하므로, ‘불법 행위’로 옮겨도 원문이 가진 심판적 이미지는 유지됩니다.
- source_word: ኃጥኣን
  english_pob_choice: the sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 그 죄인들
  - 죄인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 문맥의 집단 지칭이므로 복수형 ‘죄인들’이 자연스럽고, 한국어에서도 특정 집단을 가리키는 기능을 분명히 드러냅니다.
- source_word: ይበልዑ
  english_pob_choice: shall eat them
  chosen_korean: 삼켜집니다
  alternatives_korean:
  - 먹습니다
  - 먹어버립니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘먹다’이지만, 한국어에서는 심판 장면의 폭력성과 비유적 포식을 함께 살리기 위해 ‘삼키다’가 더 적절합니다. 대상이 문맥상 앞선 ‘불법 행위’에 묶여 있으므로 문장 전체를 매끈하게 만들었습니다.
- source_word: እምገጸ ለእግዚአ መነፈሳት
  english_pob_choice: from before the Lord of Spirits
  chosen_korean: 영들의 주 앞에서
  alternatives_korean:
  - 영들의 주의 앞에서
  - 영들의 주의 면전에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 고정된 신적 칭호는 한국어에서 ‘영들의 주’로 살리고, 게에즈의 ‘from before’는 ‘앞에서’로 옮겼습니다. ‘면전’도 가능하지만 현대 가독성을 위해 ‘앞에서’를 택했습니다.
- source_word: ይትሐጐሉ / ይትነቀሉ
