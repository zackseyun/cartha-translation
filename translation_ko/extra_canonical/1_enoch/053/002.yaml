base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/002.yaml
  text: And their hands commit lawless deeds[a], and all who support their lawless deeds the sinners devour. And the sinners shall be destroyed from before the Lord of Spirits, and from the face of his earth they shall be uprooted[d][c][b], and they shall not remain forever and ever.
  footnotes:
  - marker: a
    text: The line about 'my chains' and sinners who 'hunger for them' and 'eat them' is difficult in the Ethiopic. The translation keeps the imagery literal rather than smoothing it away; the sense may be that the instruments of judgment become the sinners' own portion.
    reason: lexical_alternative
  - marker: b
    text: The final clause may be rendered more literally, 'and they shall not remain forever and ever.' The OCR also shows uncertainty around the negative particle.
    reason: textual_variant
  - marker: c
    text: Or 'And my chains shall be for their hands to make fetters; and all who hunger for them—the sinners—shall eat them. And the sinners shall be driven'.
    reason: previous_rendering
  - marker: d
    text: Or 'they shall be banished'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 손은 불법을 행하고, 그들의 불법 행위를 지지하는 모든 자도 죄인들에게 삼켜집니다. 그리고 죄인들은 영들의 주 앞에서, 그리고 그의 땅의 얼굴 앞에서 뿌리째 뽑혀, 영원무궁토록 남아 있지 못할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 전승은 이 부분이 난해하여, 영어 POB도 ‘lawless deeds’와 관련된 직역을 유지합니다.
    reason: source_note
  - marker: b
    text: 마지막 구는 ‘영원무궁토록 남아 있지 못할 것입니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘뿌리째 뽑혀’는 교정 노트가 가리키는 표준 읽기 ‘uprooted’를 반영한 표현입니다.
    reason: textual_variant
  - marker: d
    text: ‘영들의 주’는 1 Enoch의 신적 칭호를 살린 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ወጌጋየ / ለጌጋይ
  english_pob_choice: my chains / for them
  chosen_korean: 불법을 행하고 / 불법 행위를 지지하는
  alternatives_korean:
  - 내 사슬을
  - 내 족쇄를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 제공된 영어 본문은 표면상 체인 이미지보다 ‘lawless deeds’의 의미를 본문 핵심으로 잡고 있어, 한국어는 그 의미를 직접 드러내는 쪽을 택했습니다. 다만 이 구절의 게에즈 전승은 난해하므로, ‘불법 행위’로 옮겨도 원문이 가진 심판적 이미지는 유지됩니다.
- source_word: ኃጥኣን
  english_pob_choice: the sinners
  chosen_korean: 죄인들
  alternatives_korean:
  - 그 죄인들
  - 죄인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 문맥의 집단 지칭이므로 복수형 ‘죄인들’이 자연스럽고, 한국어에서도 특정 집단을 가리키는 기능을 분명히 드러냅니다.
- source_word: ይበልዑ
  english_pob_choice: shall eat them
  chosen_korean: 삼켜집니다
  alternatives_korean:
  - 먹습니다
  - 먹어버립니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘먹다’이지만, 한국어에서는 심판 장면의 폭력성과 비유적 포식을 함께 살리기 위해 ‘삼키다’가 더 적절합니다. 대상이 문맥상 앞선 ‘불법 행위’에 묶여 있으므로 문장 전체를 매끈하게 만들었습니다.
- source_word: እምገጸ ለእግዚአ መነፈሳት
  english_pob_choice: from before the Lord of Spirits
  chosen_korean: 영들의 주 앞에서
  alternatives_korean:
  - 영들의 주의 앞에서
  - 영들의 주의 면전에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 고정된 신적 칭호는 한국어에서 ‘영들의 주’로 살리고, 게에즈의 ‘from before’는 ‘앞에서’로 옮겼습니다. ‘면전’도 가능하지만 현대 가독성을 위해 ‘앞에서’를 택했습니다.
- source_word: ይትሐጐሉ / ይትነቀሉ
  english_pob_choice: shall be uprooted
  chosen_korean: 뿌리째 뽑혀
  alternatives_korean:
  - 뽑혀
  - 제거되어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 편집 전통과 교정 노트가 가리키는 표준 읽기인 ‘uprooted’를 반영했습니다. ‘뿌리째 뽑히다’는 심판으로 인한 완전한 제거를 한국어 성어로도 잘 전달합니다.
- source_word: ወ[ኢ]ያነልቁ ለዓለመ ዓለም
  english_pob_choice: and they shall not remain forever and ever
  chosen_korean: 영원무궁토록 남아 있지 못할 것입니다
  alternatives_korean:
  - 영원무궁토록 존재하지 못할 것입니다
  - 영원무궁토록 남지 못할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 주석이 지적하듯 끝 절은 부정 입자와 관련된 본문 불확실성이 있어, ‘멸망하다’보다 더 문자적인 ‘남아 있지 못하다’로 보수적으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 종말론적 결과를 어떻게 표현할지
  chosen_reading: 죄인들은 하나님의 임재에서 제거되고, 땅에서 뿌리째 뽑혀, 영원히 남아 있지 못합니다.
  alternative_readings:
  - 죄인들이 완전히 멸망한다는 뜻으로 읽을 수 있습니다.
  - 영원한 추방을 강조하는 표현으로 읽을 수 있습니다.
  rationale: 게에즈 본문과 영어 POB 주석 모두 마지막 절을 문자적으로 확정하기 어렵지만, 전체 문맥은 분명한 심판과 추방의 공식입니다. 그래서 한국어 본문은 결과를 강하게 드러내되, 존재론적 소멸 여부는 과도하게 단정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
