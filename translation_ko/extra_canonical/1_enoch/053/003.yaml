translation:
  language: ko
  text: 이는 내가 형벌을 맡은 모든 천사들이 그곳에 머물며 사탄의 모든 도구를 준비하는 것을 보았기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 에티오피아어 OCR은 ‘준비하며’ 뒤가 불완전하게 보입니다. ‘사탄의 모든 도구’는 이 장의 바로 앞뒤 문맥에 근거해 보완한 표현이므로 신중한 복원으로 보아야 합니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그곳에 거하며’. 바탕이 되는 게에즈어 동사는 어떤 곳에 계속 머무르거나 체류함을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘사탄의 도구들을 준비하며’. 이는 ‘모든’을 드러내지 않은 이전 번역입니다.
    reason: previous_rendering
