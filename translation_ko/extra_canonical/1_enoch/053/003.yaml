  text: For I saw all the angels of punishment lodging there and preparing all the instruments of Satan[a][b][c].
  footnotes:
  - marker: a
    text: The Ethiopic OCR for this verse appears incomplete after 'and preparing.' The phrase 'instruments of Satan' is supplied from the immediate context of the chapter and should be treated as a cautious reconstruction.
    reason: textual_variant
  - marker: b
    text: Or 'dwelling there' instead of 'lodging there.' The underlying Ge'ez verb suggests remaining or staying in a place.
    reason: lexical_alternative
  - marker: c
    text: Or 'preparing instruments of Satan'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 내가 거기에서 형벌의 모든 천사들이 머물며 사탄의 모든 도구를 준비하는 것을 보았기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으르지 않은 복원으로는 ‘사탄의 모든 도구’가 본문 맥락상 보완됩니다.
    reason: textual_variant
  - marker: b
    text: ‘머물며’는 ‘거하며/숙박하며’에 해당할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘도구’는 ‘기구/무기/수단’으로도 옮길 수 있습니다.
    reason: lexical_alternative
