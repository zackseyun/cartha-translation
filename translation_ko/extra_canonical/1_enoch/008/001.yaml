  rationale: 구절 자체는 평가 형용사 없이 기술 항목을 나열하므로, 번역은 서술을 보존하고 독자가 문맥에서 의미를 읽도록 두는 편이 원문에 가깝습니다.
  doctrine_reference: 문맥적 긴장을 보존하고 해석을 과잉 주입하지 않음
