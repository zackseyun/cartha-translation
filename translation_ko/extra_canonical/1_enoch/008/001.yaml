base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
  footnotes:
  - marker: a
    text: The clause rendered 'what was behind them' reflects a difficult Ethiopic reading in the OCR witness (†ዘእምድኅሬሆሙ†). The sense may be corrupt or may point to things that followed from these arts; some translators smooth the line more heavily than the surviving wording warrants.
    reason: textual_variant
  - marker: b
    text: The cosmetic terms likely refer to eye-paint and related beautification practices, not merely abstract 'beauty.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 아자젤은 사람들에게 칼을 만드는 법과 칼끝 없는 칼, 방패, 흉갑을 가르쳤으며, 또 그들의 뒤에 있는 것과 그들의 일, 곧 팔찌와 장식품과 눈 화장과 눈꺼풀을 치장하는 일과 모든 종류의 값진 돌과 각종 물감을 그들에게 보여 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge‘ez의 †ዘእምድኅሬሆሙ†는 난해한 독법이라, 문맥상 직역에 가까운 표현을 유지했습니다.
    reason: textual_variant
  - marker: b
    text: 눈 화장과 눈꺼풀 치장에 이어지는 표현은 단순한 ‘아름다움’이 아니라 실제 화장·치장 행위를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: መሀሮሙ
  english_pob_choice: taught them
  chosen_korean: 가르쳤으며
  alternatives_korean:
  - 가르쳤습니다
  - 훈련시켰으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본적인 ‘가르치다’의 의미를 살리되, 서술 흐름에 맞게 연결형으로 처리했습니다.
- source_word: ገቢረ አሰይፍት
  english_pob_choice: to make swords
  chosen_korean: 칼을 만드는 법
  alternatives_korean:
  - 칼을 만들게 하는 일
  - 칼의 제작
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘만드는 일/법’의 제작 의미를 반영했습니다. 한국어에서는 자연스러운 목적어+명사화로 옮겼습니다.
- source_word: ዘእምድኅሬሆሙ
  english_pob_choice: what was behind them
  chosen_korean: 그들의 뒤에 있는 것
  alternatives_korean:
  - 그 뒤의 것
  - 그들 뒤에 따르는 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구절은 Ge‘ez 증거가 난해하므로, POB 주석처럼 의미를 과도하게 매끈하게 만들지 않고 직역에 가깝게 유지했습니다.
- source_word: እብነ እምኵሉ እብን
  english_pob_choice: every kind of costly stone
  chosen_korean: 모든 종류의 값진 돌
  alternatives_korean:
  - 모든 종류의 귀한 돌
  - 모든 보석
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 ‘costly stone’에 맞추어 ‘값진 돌’로 옮겨, 장식용 보석류라는 폭넓은 의미를 유지했습니다.
theological_decisions:
- issue: 무기와 장식 기술의 서술을 중립적 공예로 완화할지 여부
  chosen_reading: 본문의 기술 목록은 그대로 두고, 이 전승이 금지된 지식의 전달이라는 문맥적 긴장은 설명하지 않고 보존했습니다.
  alternative_readings:
  - ‘전쟁용’ 같은 해석어를 덧붙여 악의성을 명시함
  - 문화 발전처럼 중립적으로 순화함
  rationale: 구절 자체는 평가 형용사 없이 기술 항목을 나열하므로, 번역은 서술을 보존하고 독자가 문맥에서 의미를 읽도록 두는 편이 원문에 가깝습니다.
  doctrine_reference: 문맥적 긴장을 보존하고 해석을 과잉 주입하지 않음
