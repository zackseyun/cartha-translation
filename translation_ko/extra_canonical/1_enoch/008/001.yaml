base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
  footnotes:
  - marker: a
    text: The clause rendered 'what was behind them' reflects a difficult Ethiopic reading in the OCR witness (†ዘእምድኅሬሆሙ†). The sense may be corrupt or may point to things that followed from these arts; some translators smooth the line more heavily than the surviving wording warrants.
    reason: textual_variant
  - marker: b
    text: The cosmetic terms likely refer to eye-paint and related beautification practices, not merely abstract 'beauty.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 아자젤은 사람들에게 칼을 만드는 법과 칼과 단검과 방패와 흉갑을 가르쳤으며, 또 그들 뒤에 있는 것[a]과 그들의 일, 곧 팔찌와 장식품과 눈 화장과 눈꺼풀을 치장하는 일[b]과 모든 종류의 값진 돌과 각종 물감을 그들에게 보여 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge‘ez의 †ዘእምድኅሬሆሙ†는 난해한 독법이므로, 문맥상 직역에 가까운 표현을 유지했습니다.
    reason: textual_variant
  - marker: b
    text: 눈 화장과 눈꺼풀 치장에 이어지는 표현은 단순한 ‘아름다움’이 아니라 실제 화장·치장 행위를 가리키는 것으로 보입니다.
    reason: cultural_note
