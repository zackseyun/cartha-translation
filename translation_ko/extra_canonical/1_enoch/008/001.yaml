  - severity: low
    issue: 각주 표지의 위치
    rationale: '[a]는 난해한 Ge''ez 구절 바로 뒤에, [b]는 눈 화장·눈꺼풀 치장 표현 뒤에 두어 각주의 적용 범위를 분명히 하는 것이 좋습니다.'
