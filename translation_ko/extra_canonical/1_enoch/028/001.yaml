translation:
  language: ko
  text: 그곳에서 나는 산악 사막 한가운데를 지나 동쪽을 향해 갔습니다. 나는 나무로 가득한 황량하고 외로운 곳을 보았습니다. 그 위에서 물이 솟아 나왔습니다. 그것은 북서쪽을 향해 풍성한 물길처럼 흘러가며, 사방에서 구름과 이슬이 올라오게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምህየ
  english_pob_choice: from there
  chosen_korean: 거기서
  alternatives_korean:
  - 그곳에서
  - 그리하여 거기서
  - 그곳으로부터
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이전 장소를 가리키는 이격 표현이므로, 현대 한국어에서 자연스럽고 간결한 ‘거기서’로 옮겼습니다.
- source_word: ሖርኩ
  english_pob_choice: I went
  chosen_korean: 길을 갔습니다
  alternatives_korean:
  - 갔습니다
  - 여행했습니다
  - 떠났습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 이동 동사를 한국어에서 자연스럽게 풀어, 목적지보다 진행을 드러내는 ‘길을 갔습니다’로 옮겼습니다.
- source_word: መንገለ
  english_pob_choice: on a journey / toward
  chosen_korean: 동쪽을 향해
  alternatives_korean:
  - 동쪽으로
  - 동쪽을 향하여
  - 동쪽 쪽으로
  lexicon: Dillmann; Leslau, Comparative Dictionary of Geʽez
  rationale: 주어진 본문은 ‘동쪽’(ጽባሕ)까지 이어지므로, መንገለ의 방향 표지를 살려 ‘동쪽을 향해’로 옮겼습니다.
- source_word: ጽባሕ
  english_pob_choice: east
  chosen_korean: 동쪽
  alternatives_korean:
  - 해 뜨는 쪽
  - 동편
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지리적 방향어이므로 현대 표준어의 ‘동쪽’이 가장 직접적입니다.
