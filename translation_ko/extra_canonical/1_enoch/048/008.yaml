- source_word: ጽኑዓን
  english_pob_choice: the mighty
  chosen_korean: 용사들
  alternatives_korean:
  - 권세자들
  - 강한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 왕들과 짝을 이루는 강자들을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: እለ ይእኅዝዋ ለየብስ
  english_pob_choice: who possess the dry land
  chosen_korean: 그 땅을 소유한
  alternatives_korean:
  - 마른 땅을 차지한
