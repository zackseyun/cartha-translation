base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/008.yaml
  text: In those days the faces of the kings of the earth and the mighty who possess the dry land shall be humbled[a], because of the works of their hands; for on the day of their distress and affliction[d][c][b], they will not save themselves.
  footnotes:
  - marker: a
    text: Or possibly, 'their faces shall be cast down—the kings of the earth and the mighty.' The Ge'ez wording is somewhat compressed, and the relation of 'humble/lowly of face' to the following nouns is not fully certain.
    reason: alternative_reading
  - marker: b
    text: '''The dry land'' is literal. It may simply mean the inhabited earth/land under human rule.'
    reason: lexical_alternative
  - marker: c
    text: '''Works of their hands'' may carry an echo of self-made power or even idols, but the wording is left broad in the main text.'
    reason: cultural_note
  - marker: d
    text: Or 'the humble of face shall be put to shame, the kings of the earth and the mighty who possess the dry land'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 땅의 왕들과 그 땅을 소유한 용사들의 얼굴이 그들의 손의 행위 때문에 낮아질 것입니다. 이는 그들이 고난과 고통의 날에 자기 자신을 구원하지 못할 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዝንቱ መዋዕል
  english_pob_choice: In those days
  chosen_korean: 그날에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 시기를 여는 시간 부사구로 간결하게 살렸습니다.
- source_word: ነገሥተ ምድር
  english_pob_choice: the kings of the earth
  chosen_korean: 땅의 왕들
  alternatives_korean:
  - 세상의 왕들
  - 지상의 왕들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: apocalyptic한 통치자들을 가리키는 표현으로, ‘땅’은 지배 영역의 현실성을 그대로 보존합니다.
- source_word: ጽኑዓን
  english_pob_choice: the mighty
  chosen_korean: 용사들
  alternatives_korean:
  - 권세자들
  - 강한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 왕들과 짝을 이루는 강자들을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: እለ ይእኅዝዋ ለየብስ
  english_pob_choice: who possess the dry land
  chosen_korean: 그 땅을 소유한
  alternatives_korean:
  - 마른 땅을 차지한
  - 육지를 소유한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 ‘마른 땅’은 한국어에서 매우 부자연스러워, 본문이 뜻하는 현실 세계의 지배 영역을 드러내는 ‘땅’을 택했습니다.
- source_word: በእንተ ምግባረ እደዊሆሙ
  english_pob_choice: because of the works of their hands
  chosen_korean: 그들의 손의 행위 때문에
  alternatives_korean:
  - 그들의 손으로 한 일 때문에
  - 그들의 손으로 만든 것 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 행위의 책임을 분명히 하면서도, 우상숭배로 지나치게 좁히지 않도록 ‘행위’로 넓게 유지했습니다.
- source_word: ኢይድኅኑ ርእሶሙ
  english_pob_choice: they will not save themselves
  chosen_korean: 자기 자신을 구원하지 못할 것입니다
  alternatives_korean:
  - 스스로를 구원하지 못할 것입니다
  - 자기 목숨을 건지지 못할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반신반의적 ‘구원’ 개념을 직접 덧씌우지 않고, 문맥상의 자기구제 불능을 분명히 했습니다.
theological_decisions:
- issue: ‘the kings of the earth and the mighty’의 문장 주어 처리
  chosen_reading: 왕들과 용사들이 얼굴이 낮아지는 주어로 직접 이해했습니다.
  alternative_readings:
  - ‘낮아진 얼굴의 사람들’이라는 별도 집단을 가리키는 읽기
  - 왕들과 용사들이 아닌 다른 겸손한 자들을 지칭하는 읽기
  rationale: 수정된 지시문과 문맥상, 심판받는 지배층이 수치스러운 얼굴 상태가 되는 것으로 읽는 것이 가장 일관됩니다.
  doctrine_reference: 원문 문법 우선, 모호성은 해소하지 않고 문맥에 따라 최소한으로 정리
- issue: ‘works of their hands’의 함의
  chosen_reading: 본문에는 넓은 의미의 행위로 두고, 우상숭배로 한정하지 않았습니다.
  alternative_readings:
  - 그들의 우상
  - 그들이 만든 권력의 산물
  rationale: 어구가 우상숭배를 연상시킬 수는 있지만, 원문이 그 좁은 뜻을 반드시 요구하지는 않으므로 과잉해석을 피했습니다.
  doctrine_reference: 원문이 허용하는 범위 안에서만 함의 제시
