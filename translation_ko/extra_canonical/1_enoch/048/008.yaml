review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 심판받는 통치자들의 수치스러운 표정을 나타내는 구문은 한국어 관용 표현으로 자연스럽게 옮겨야 합니다. 또한 የብስ의 구체적인 ‘마른 땅’ 이미지를 본문 또는 각주에서 보존하는 편이 좋습니다.
  naturalness: 초안의 ‘얼굴이 … 낮아질 것입니다’와 ‘그들의 손의 행위’는 현대 표준 한국어로 다소 직역투입니다. ‘얼굴을 떨구게 될 것입니다’, ‘자기 손으로 한 일’이 문맥과 합쇼체에 더 자연스럽습니다.
  terminology: ጽኑዓን은 전투 전문 집단을 연상시키는 ‘용사들’보다 사회적·정치적 강자를 가리키는 ‘권세 있는 자들’이 적절합니다. ‘구원’은 원문의 자기 구제 불능을 충실히 전달하므로 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘용사들’
    rationale: 원문의 ‘강한 자들/권세자들’은 왕들과 병렬되는 권력층을 가리키며, ‘용사’는 군사적 전사를 지나치게 구체화할 수 있습니다.
  - severity: medium
    issue: ‘그 땅을 소유한’
    rationale: 원문의 የብስ는 문자적으로 ‘마른 땅’입니다. ‘그 땅’은 지시어를 보태고 원문의 구체적 어휘를 일반화합니다.
  - severity: low
    issue: ‘얼굴이 … 낮아질 것입니다’ 및 ‘손의 행위’
    rationale: 뜻은 대체로 맞지만 한국어 관용과 문체상 부자연스럽습니다. 수치와 낙담의 표정은 ‘얼굴을 떨구다’가 자연스럽고, ‘손으로 한 일’이 원문의 책임 귀속을 잘 보존합니다.
  revised_text: 그때에 땅의 왕들과 마른 땅을 차지한 권세 있는 자들은 자기 손으로 한 일 때문에 얼굴을 떨구게 될 것입니다[a]. 그들이 고난과 압박의 날에 스스로를 구원하지 못할 것이기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘얼굴이 낮아지게 될 것이다’입니다. 전해진 게에즈어 구문은 압축되어 있으며, 이를 ‘수치를 당하다’로 이해하는 번역도 가능합니다. 여기서는 왕들과 권세 있는 자들이 수치와 낙담으로 얼굴을 떨구는 것으로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마른 땅’은 직역입니다. 사람이 사는 땅 또는 인간의 지배 아래 있는 육지를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기 손으로 한 일’은 그들의 행위 전반을 가리키며, 우상이나 스스로 만든 권력에 대한 암시일 수도 있으나 본문에서는 넓게 유지했습니다.
    reason: cultural_note
  - marker: d
    text: ‘고난과 압박’은 두 개의 고통 표현을 함께 옮긴 것입니다.
    reason: lexical_note
  revision_rationale: 문장의 주어를 왕들과 권세 있는 자들로 분명히 유지하고, 그들의 얼굴이 수치로 낮아지는 이미지는 한국어 관용 표현인 ‘얼굴을 떨구다’로 옮겼습니다. ‘마른 땅’은 본문에 보존하되 이해를 돕는 설명을 각주에 두었습니다. 원문 구문의 전승 및 통사상 논의가 있으므로 수치/낙담의 의미를 각주에서 제한적으로 밝혔으며, 본문은 특정 교리적 해석을 덧붙이지 않습니다.
