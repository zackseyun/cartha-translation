- issue: 반복되는 3인칭 단수 지시어 ውእቱ의 지칭
  chosen_reading: 문맥상 한 분의 종말론적 인물로 이어지므로, ‘그는/그분은’으로 일관되게 옮겼습니다.
  alternative_readings:
  - ‘이분은’과 같은 중립형
  - 지시어를 약화해 반복을 줄이는 방식
  rationale: 앞뒤 문맥이 단수의 택함 받은 인물을 가리키므로, 인칭적·메시아적 초점을 유지하는 것이 source-direct합니다.
