  chosen_korean: 마음에 괴로움을 겪는 이들
  alternatives_korean:
  - 마음에 병든 이들
  - 마음이 아픈 이들
  - 마음에 고통받는 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 관용구가 신체 질병보다 내적 고통을 가리키므로, 이를 드러내는 ‘마음에 괴로움을 겪는 이들’로 옮겼습니다.
