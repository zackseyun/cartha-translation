base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/004.yaml
  text: He will be a staff for the righteous[a], so that they may lean on him and not fall; and he will be the light of the nations[c][b], and he will be hope for those who are troubled in heart.
  footnotes:
  - marker: a
    text: Or 'a light for the nations.' The Ge'ez phrase can be rendered either way; the main text keeps the compact construct sense.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'those who suffer/are sick in their heart.' The expression points to inward distress rather than physical illness alone.
    reason: lexical_alternative
  - marker: c
    text: Or 'And he will become a staff for the righteous, so that they may lean on him and not fall; and he will become the light of the nations, and he will become hope'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 의인들에게 지팡이가 되실 것이며, 그들은 그에게 기대어 넘어지지 않을 것입니다. 그는 민족들의 빛이 되시며, 마음에 괴로움을 겪는 이들의 희망이 되실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지팡이’는 ‘막대기’나 ‘홀’로도 옮길 수 있습니다. 그러나 여기서는 의인들이 그에게 기대어 넘어지지 않는다는 이미지 때문에 ‘지팡이’가 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘마음에 고통을 겪는 이들’ 또는 ‘마음에 병든 이들’입니다. 이 표현은 육체의 질병만이 아니라 내적인 괴로움을 가리킵니다.
    reason: source_note
lexical_decisions:
