  - 기대
  - 위로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 곤고한 이들에게 주어지는 미래 지향적 기대를 담되, 현대 한국어에서 가장 자연스러운 표준어인 ‘희망’을 택했습니다.
- source_word: ለእለ የሐምሙ በልቦሙ
