  text: For this reason[a], he was chosen and hidden before him before the world was created[c][b], and forever.
  footnotes:
  - marker: a
    text: Or 'in his presence.' The phrase 'before him' likely refers to God, but the translation keeps the Ge'ez relational wording.
    reason: lexical_alternative
  - marker: b
    text: The final phrase can also be understood more literally as 'unto eternity' or 'unto the age.'
    reason: lexical_alternative
  - marker: c
    text: Or 'before him before the world was created'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 때문에 그는 세상이 창조되기 전부터 영원토록 그 앞에서 택함을 받고 감추어져 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 앞에서’는 원문의 በቅድሜሁ를 직역한 표현으로, ‘그의 임재 안에서’라는 뜻으로도 옮길 수 있습니다. 문맥상 그 지시 대상은 하나님일 가능성이 크지만, 본문은 원문의 관계적 표현을 유지합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 표현은 더 문자적으로 ‘영원에 이르기까지’ 또는 ‘그 시대까지’로도 옮길 수 있습니다.
    reason: lexical_alternative
