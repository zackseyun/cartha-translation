base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/001.yaml
  text: In that place I saw the spring of righteousness[a], which is inexhaustible, and around it were many springs of wisdom. And all the thirsty drank from them and were filled with wisdom[f][e][d][c][b], and their dwelling was with the righteous and the holy and the chosen.
  footnotes:
  - marker: a
    text: The Ethiopic text has a difficult expression around 'around it,' with a repeated form in the OCR witness. The sense is likely that many springs of wisdom were situated around the spring of righteousness.
    reason: textual_variant
  - marker: b
    text: Or 'fountain of righteousness' ... 'fountains of wisdom.'
    reason: lexical_alternative
  - marker: c
    text: '''The holy'' may also be rendered ''the holy ones.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'drank from them and were filled'.
    reason: previous_rendering
  - marker: e
    text: Or 'around it were many springs of wisdom'.
    reason: previous_rendering
  - marker: f
    text: Or 'which does not fail'.
    reason: previous_rendering
translation:
  language: ko
  text: 그곳에서 나는 의의 샘을 보았는데, 그것은 고갈되지 않았습니다. 그 둘레에는 지혜의 샘들이 많았고, 목마른 모든 이들이 그것들에서 마시고 지혜로 가득 찼으며, 그들의 거처는 의인들과 거룩한 이들과 선택된 이들과 함께 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 샘의 끝없음 또는 헤아릴 수 없음의 뜻을 담고 있어, ‘고갈되지 않았습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  english_pob_choice: place
  chosen_korean: 그곳
  alternatives_korean:
  - 그 장소
  - 그 자리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비전 장면의 장소성을 자연스럽게 살리면서도, 한국어에서 과도하게 지리적이지 않게 간결하게 옮기기 위해 ‘그곳’을 선택했습니다.
- source_word: ነቅዐ ጽድቅ
  english_pob_choice: spring of righteousness
  chosen_korean: 의의 샘
  alternatives_korean:
  - 의의 샘물
  - 의 샘
  - 공의의 샘
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 샘의 물 이미지와 ‘의’의 사상적 핵심을 함께 보존하기 위해 ‘의의 샘’으로 옮겼습니다. ‘공의’는 가능하지만 본문은 지속적인 생명수 이미지를 강조합니다.
- source_word: ዘኢይትኄለቍ
  english_pob_choice: which is inexhaustible
  chosen_korean: 고갈되지 않았습니다
  alternatives_korean:
  - 다할 수 없었습니다
  - 헤아릴 수 없을 만큼 많았습니다
  - 무궁했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 핵심은 샘의 끝없음과 다함 없음이므로, 한국어로는 ‘고갈되지 않았습니다’가 가장 직접적으로 그 의미를 전달합니다.
- source_word: የአውዳ / አውዳ
  english_pob_choice: around it were many springs of wisdom
  chosen_korean: 그 둘레에는 지혜의 샘들이 많았고
  alternatives_korean:
  - 그 주위에는 지혜의 샘들이 많았고
  - 그것을 둘러 지혜의 샘들이 많았고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주변을 둘러싼 배치를 분명히 하면서도, 개정된 영어 주석이 반영한 동적인 ‘둘레’ 이미지를 한국어에 자연스럽게 담았습니다.
- source_word: ጽሙኣን
  english_pob_choice: the thirsty
  chosen_korean: 목마른 모든 이들
  alternatives_korean:
  - 갈증을 느끼는 모든 이들
  - 목마른 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명사적 표현을 살리되 한국어 문맥에서 유려하게 읽히도록 ‘목마른 모든 이들’로 옮겼습니다.
- source_word: ጽድቅ ... ጥበብ
  english_pob_choice: righteousness ... wisdom
  chosen_korean: 의 ... 지혜
  alternatives_korean:
  - 의로움 ... 지혜
  - 공의 ... 지혜
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 본문에서 ‘의’와 ‘지혜’는 각각 샘과 음료의 이미지로 연결되므로, 추상화를 줄이고 핵심 어휘를 직결시키는 번역을 택했습니다.
- source_word: ማኅደሪሆሙ
  english_pob_choice: their dwelling
  chosen_korean: 그들의 거처
  alternatives_korean:
  - 그들의 처소
  - 그들의 거주지
  - 그들의 집
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 공동 거주를 뜻하는 표현이므로, 일상적인 ‘집’보다 포괄적인 ‘거처’가 더 적합합니다.
- source_word: ጻድቃን ወቅዱሳን ወኅሩያን
  english_pob_choice: the righteous and the holy and the chosen
  chosen_korean: 의인들과 거룩한 이들과 선택된 이들
  alternatives_korean:
  - 의인들과 성도들과 택함 받은 이들
  - 의인들과 거룩한 자들과 택함 받은 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세 집단의 병렬을 보존하면서도, ‘성도’처럼 교회적 용어가 강해지는 것을 피하고 ‘거룩한 이들’, ‘선택된 이들’로 비교적 직접적으로 옮겼습니다.
theological_decisions:
- issue: ‘의의 샘’과 ‘지혜의 샘들’을 문자적 환상 이미지로 유지할지, 비유적으로 평탄화할지
  chosen_reading: 문자적 환상 이미지를 유지해, 샘과 마시는 행위와 충만함을 그대로 살렸습니다.
  alternative_readings:
  - 의와 지혜에 참여하는 상태를 추상적으로 풀어 쓰는 번역
  - 상징성을 전면에 드러내는 의역
  rationale: 원문과 영어 POB 모두 생명수 환상 형식을 유지하므로, 본문이 지닌 묵시문학적 힘을 보존하는 것이 적절합니다.
  doctrine_reference: 묵시문학 이미지 보존 / 문맥 우선 번역
- issue: 마지막 삼중 호칭을 교회 전통어로 좁힐지 여부
  chosen_reading: ‘의인들과 거룩한 이들과 선택된 이들’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 의인들과 성도들과 택함 받은 이들
  - 의인들과 성인들과 선택된 자들
  rationale: 본문은 세 범주를 평행적으로 제시하므로, ‘성도’나 ‘택함 받은 자’처럼 후대 교회 언어로 굳히기보다 원문의 범주감을 드러내는 쪽이 더 충실합니다.
  doctrine_reference: 용어 일관성 / 교회화 방지
