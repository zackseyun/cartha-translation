theological_decisions:
- issue: 마지막 호칭의 신학적 지시 대상
  chosen_reading: ‘그 앞에’의 대상과 마지막 ‘만군의 주’는 같은 장면 안에서 구별된 호칭 흐름을 이루며, 번역은 그 긴장을 풀지 않고 남겨 둡니다.
  alternative_readings:
  - 모든 동작과 찬양이 동일 인물에게만 향한다
  - 앞선 ‘그’와 마지막 주체가 완전히 다른 두 존재를 가리킨다
  rationale: 본문은 먼저 특정 대상 앞에서의 엎드림을 말한 뒤, 마지막에 분명한 신적 칭호로 마무리합니다. 원문의 단계적 호칭 구조를 해석으로 평평하게 만들지 않는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
