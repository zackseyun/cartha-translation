base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/005.yaml
  text: And all who dwell upon the dry land shall fall down and bow before him[a], and they shall praise and bless and sing to the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or 'who dwell on the earth.' The Ge'ez wording is more literally 'upon the dry land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 마른 땅에 사는[a] 모든 이가 그 앞에 엎드려 절하며, 그를 찬양하고 그를 송축하며 영들의 주께 노래할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅 위에 사는’. Ge'ez 본문은 더 문자적으로 ‘마른 땅 위에’를 말합니다.
    reason: lexical_alternative
