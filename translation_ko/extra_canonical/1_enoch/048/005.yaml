translation:
  language: ko
  text: 그리고 마른 땅 위에 거하는 모든 이들은 그 앞에 엎드려 절하고, 그들은 하늘에서 영광을 돌리고 복을 빌며 노래하여 만군의 주께 드릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마른 땅’은 본문의 Ge'ez가 더 문자적으로 가리키는 표현입니다. 영어 POB의 각주처럼, 보다 넓은 ‘땅’보다 이 구체적 표현을 우선 반영했습니다.
    reason: source_note
