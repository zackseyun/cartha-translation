base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/002.yaml
  text: And at that hour that Son of Man was named in the presence of the Lord of Spirits[b][a], and his name was before the Head of Days.
  footnotes:
  - marker: a
    text: Or 'was called.' The passive verb can denote designation or naming; 'was named' is chosen because the next clause repeats 'his name.'
    reason: lexical_alternative
  - marker: b
    text: '''Head of Days'' is a literal rendering of a divine title in the Parables. It is kept rather than replaced with a smoother traditional equivalent so the imagery remains visible.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 시간에 그 인자는 영들의 주[a] 앞에서 이름이 불렸으며, 그의 이름은 날들의 머리[b] 앞에 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘영들의 주’라고 합니다. 이는 이 문헌에서 사용되는 독특한 신칭입니다.
    reason: source_note
  - marker: b
    text: ‘날들의 머리’는 이 문맥의 독특한 신칭으로, 더 익숙한 표현으로 바꾸지 않았습니다.
    reason: cultural_note
