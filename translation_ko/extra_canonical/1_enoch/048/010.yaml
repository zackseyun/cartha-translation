  text: And on the day of their affliction[b][a], rest shall come upon the earth.
  footnotes:
  - marker: a
    text: Or 'affliction' or 'trouble' for 'distress.' The Ge'ez term denotes hardship or pressure; the exact nuance is not fully fixed by this short clause alone.
    reason: lexical_alternative
  - marker: b
    text: Or 'rest shall be upon the earth.' The verb can be rendered more literally as 'shall be' or 'shall come to be.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 고난의 날에 땅 위에 안식이 임할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘고난’, ‘환난’으로 옮길 수 있습니다. 게에즈어 용어는 압박이나 고통을 뜻하는 폭이 있어, 이 짧은 구절만으로 정밀한 뉘앙스를 단정하기는 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안식이 땅 위에 있을 것입니다’로도 옮길 수 있습니다. 동사는 보다 문자적으로는 ‘있다’ 또는 ‘되다’에 가깝습니다.
    reason: lexical_alternative
