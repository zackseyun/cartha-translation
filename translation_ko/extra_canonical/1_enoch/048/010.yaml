    text: 또는 ‘환난’, ‘곤경’으로 옮길 수 있습니다. 게에즈어 용어는 압박이나 고통을 뜻할 수 있으므로, 이 짧은 구절만으로 정확한 뉘앙스를 단정하기는 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘안식이 땅 위에 임할 것입니다’로도 옮길 수 있습니다. 동사는 더 문자적으로는 ‘있다’ 또는 ‘되다’에 가깝습니다.
