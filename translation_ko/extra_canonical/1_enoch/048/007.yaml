base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
  footnotes:
  - marker: a
    text: Or 'the holy ones.' The Ge'ez group term can denote consecrated people collectively.
    reason: lexical_alternative
  - marker: b
    text: '''The portion of the righteous'' may mean their allotted share, lot, or inheritance as righteous ones.'
    reason: lexical_alternative
  - marker: c
    text: Or 'by his will their life was established.' The final clause emphasizes that the life of the righteous depends on the Lord of Spirits' willing purpose.
    reason: lexical_alternative
  - marker: d
    text: Or 'And wisdom was poured out for the holy and for the righteous;'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 만군의 주님의 지혜가 그분을 거룩한 이들과 의인들에게 나타내셨습니다[a]. 이는 그들이 의인들의 몫[b]을 지켜 왔기 때문입니다. 곧 그들이 불의의 이 세상과 그 모든 행위와 그 길을 미워하고 멸시하였으며, 만군의 주님의 이름으로 그렇게 하였기 때문입니다. 그분의 이름으로 그들은 구원을 받으며, 그분의 선한 뜻으로 그들의 생명이 있게 되었습니다[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 자들’로도 옮길 수 있습니다. 게에즈의 집단 명칭은 성별된 사람들을 가리키는 집합어일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의인들의 몫’은 배당된 분깃, 몫, 또는 의인으로서의 상속분을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그분의 선한 뜻으로’는 ‘그분의 뜻으로’ 또는 ‘그분의 의지로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들의 생명이 세워졌습니다’로도 옮길 수 있습니다. 마지막 절은 그들의 생명이 주님의 뜻에 의존함을 강조합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ከሠተ
  english_pob_choice: has revealed
  chosen_korean: 나타내셨습니다
  alternatives_korean:
  - 드러내셨습니다
  - 밝히셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 활성 동사 ከሠተ는 단순한 정보 전달이 아니라 드러내어 알리는 행위이므로, 한국어에서는 ‘나타내다/드러내다’ 계열이 적절합니다.
- source_word: ቅዱሳን
  english_pob_choice: the holy
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도들
  - 거룩한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 집단 명칭이므로 직역에 가깝게 ‘거룩한 이들’로 두어 후대 교회 용어의 과잉을 피했습니다.
- source_word: ጻድቃን
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 이들
  - 의로운 사람들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 핵심 범주인 ‘the righteous’를 한국어 성경 문맥에서 자연스럽고 일관되게 ‘의인들’로 옮겼습니다.
- source_word: ክፍሎሙ
  english_pob_choice: the portion
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 몫과 몫의 소유
  - 상속분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단어는 몫, 분깃, 배당된 سهم을 모두 열 수 있으므로, 의미를 과도하게 특정하지 않는 ‘몫’이 가장 투명합니다.
- source_word: በስሙ
  english_pob_choice: in the name of
  chosen_korean: 그 이름으로
  alternatives_korean:
  - 주님의 이름 안에서
  - 이름으로 인해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 알레지언스와 근거를 함께 담는 관용구이므로, 한국어에서도 형식적이고 간결한 ‘그 이름으로’로 살렸습니다.
- source_word: ይድኅኑ
  english_pob_choice: they are saved
  chosen_korean: 그들은 구원을 받습니다
  alternatives_korean:
  - 그들은 구원받습니다
  - 그들은 구원을 얻습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 현재적/일반적 진술로 읽을 수 있으므로, 종결감이 있는 ‘구원을 받습니다’로 번역해 문맥의 보편성을 유지했습니다.
- source_word: በፈቃዱ
  english_pob_choice: by his good pleasure
  chosen_korean: 그분의 선한 뜻으로
  alternatives_korean:
  - 그분의 뜻으로
  - 그분의 기쁨으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 선의가 내포된 하나님의 의지를 드러내기 위해, 단순한 ‘뜻’보다 의미가 선명한 ‘선한 뜻’으로 옮겼습니다.
- source_word: ኮነ ሕይወቶሙ
  english_pob_choice: their life came to be
  chosen_korean: 그들의 생명이 있게 되었습니다
  alternatives_korean:
  - 그들의 생명이 되었습니다
  - 그들의 생명이 세워졌습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 창조적·존재론적 발생을 드러내는 표현이므로, 한국어에서는 ‘있게 되었습니다’로 의존성을 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘주님의 이름’의 번역에서 야훼 음역을 사용할지 여부
  chosen_reading: 만군의 주님의 이름
  alternative_readings:
  - 만군의 야훼의 이름
  - 야훼의 이름
  rationale: 본 절의 기초 문헌이 에녹서이므로, 본문 내 신적 칭호를 원문 흐름에 맞추어 ‘만군의 주님’으로 옮겼고, 관련 교차참조가 없는 단문에서는 과잉 주석화를 피했습니다.
  doctrine_reference: source-text transparency over retrojected OT citation formatting
- issue: ‘지혜’의 행위 주체성과 수동성
  chosen_reading: 만군의 주님의 지혜가 그분을 … 나타내셨습니다
  alternative_readings:
  - 만군의 주님의 지혜가 … 드러났습니다
  - 만군의 주님의 지혜가 …를 드러내셨습니다
  rationale: 게에즈 동사는 활성이며, 지혜가 능동적으로 드러내는 구성을 유지해야 하므로 수동형으로 흐리지 않고 주어-동사 관계를 살렸습니다.
  doctrine_reference: preserve source agency and rhetorical force
