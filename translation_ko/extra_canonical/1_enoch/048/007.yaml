base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
  footnotes:
  - marker: a
    text: Or 'the holy ones.' The Ge'ez group term can denote consecrated people collectively.
    reason: lexical_alternative
  - marker: b
    text: '''The portion of the righteous'' may mean their allotted share, lot, or inheritance as righteous ones.'
    reason: lexical_alternative
  - marker: c
    text: Or 'by his will their life was established.' The final clause emphasizes that the life of the righteous depends on the Lord of Spirits' willing purpose.
    reason: lexical_alternative
  - marker: d
    text: Or 'And wisdom was poured out for the holy and for the righteous;'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 영들의 주님의 지혜가 그분을 거룩한 이들과 의인들에게 드러냈습니다[a]. 그들은 의인들의 몫[b]을 지켜 왔으니, 이는 그들이 불의의 이 세상을 미워하고 멸시하였으며, 그 모든 행위와 길도 영들의 주님의 이름으로 미워하였기 때문입니다. 그분의 이름으로 그들은 구원을 받으며, 그분의 선한 뜻[c]으로 그들의 생명이 있게 되었습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 자들’로도 옮길 수 있습니다. 게에즈의 집단 명칭은 성별된 사람들을 가리키는 집합어일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의인들의 몫’은 배당된 분깃, 몫, 또는 의인으로서의 상속분을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그분의 선한 뜻으로’는 ‘그분의 뜻으로’ 또는 ‘그분의 의지로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들의 생명이 세워졌습니다’로도 옮길 수 있습니다. 마지막 절은 그들의 생명이 영들의 주님의 뜻에 의존함을 강조합니다.
    reason: previous_rendering
