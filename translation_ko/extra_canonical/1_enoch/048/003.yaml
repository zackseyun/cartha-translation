base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or 'in the presence of the Lord of Spirits.' The Ge'ez preposition can carry a courtly-presence sense as well as simple 'before.'
    reason: lexical_alternative
  - marker: b
    text: The verse stresses that this figure's naming precedes the creation of the sun and the heavenly stars' signs, underscoring pretemporal status.
    reason: cross_reference
  - marker: c
    text: Or "And before the sun was created, and before the signs of the heaven's stars were made, his name was called before the Lord of Spirits.".
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 해와 표징들이 창조되기 전에, 하늘의 별들이 만들어지기 전에, 그의 이름은 영들의 주님 앞에서 불렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘표징들’은 하늘의 징표나 표지를 뜻할 수 있으며, 별자리로 한정되지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 해와 표징들과 하늘의 별들이 창조되기 전에 그의 이름이 불렸음을 말합니다.
    reason: cross_reference
