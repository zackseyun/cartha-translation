base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or 'in the presence of the Lord of Spirits.' The Ge'ez preposition can carry a courtly-presence sense as well as simple 'before.'
    reason: lexical_alternative
  - marker: b
    text: The verse stresses that this figure's naming precedes the creation of the sun and the heavenly stars' signs, underscoring pretemporal status.
    reason: cross_reference
  - marker: c
    text: Or "And before the sun was created, and before the signs of the heaven's stars were made, his name was called before the Lord of Spirits.".
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 해와 별자리들이 창조되기 전에, 하늘의 별들이 만들어지기 전에, 그의 이름이 만군의 주님 앞에서 불렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별자리들’은 여기서 단순한 천문학적 별무리를 넘어서, 하늘의 표징·질서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 해와 하늘의 별들보다 앞선 선재성을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ዘእንበለ / እንበለ
  english_pob_choice: before
  chosen_korean: ~하기 전에
  alternatives_korean:
  - ~하기 앞서
  - ~하기도 전에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 개의 선행 시간절을 자연스럽게 살리기 위해 한국어에서는 반복되는 시간 부사를 '~하기 전에'로 옮겼습니다.
- source_word: ፀሐይ ወታእምር
  english_pob_choice: the sun and the signs
  chosen_korean: 해와 별자리들
  alternatives_korean:
  - 태양과 징표들
  - 해와 표징들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 별과 관련된 우주적 문맥에서 ታእምር는 단순한 '표지'보다 천체적 질서를 드러내는 뜻이 강하므로, 한국어에서는 '별자리들'로 옮겨 천문·묵시적 뉘앙스를 유지했습니다.
- source_word: ከዋክብተ ሰማይ
  english_pob_choice: the stars of heaven
  chosen_korean: 하늘의 별들
  alternatives_korean:
  - 하늘 별들
  - 천상의 별들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유격 구조를 자연스러운 현대 한국어로 살려 '하늘의 별들'로 옮겼고, 장엄한 우주적 표현을 유지했습니다.
- source_word: ተጸውዐ
  english_pob_choice: was called
  chosen_korean: 불렸습니다
  alternatives_korean:
  - 이름이 주어졌습니다
  - 호명되었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명명 행위이면서도 선포적 울림을 함께 살리기 위해 '불렸다'를 사용했습니다.
- source_word: እግዚአ መናፈስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주님
  alternatives_korean:
  - 영들의 주님
  - 영들의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 정식 호칭인 'Lord of Spirits'는 직역하면 '영들의 주님'이지만, 한국어에서 매우 낯선 중복을 줄이면서도 초월적 통치성을 드러내기 위해 '만군의 주님'으로 옮겼습니다.
theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 호칭 처리
  chosen_reading: 본문에서는 예배적 친숙어인 '주님'을 유지하되, 고유 호칭의 위엄을 살려 '만군의 주님'으로 번역했습니다.
  alternative_readings:
  - 영들의 주님
  - 영들의 주인
  - 만유의 주님
  rationale: 원문 제목의 특수성을 유지하면서도 한국어에서 자연스럽고 장엄한 호칭이 되도록 조정했습니다. 다만 이는 직역보다 해석적 요소가 있어, 차후 본문 일관성 검토가 필요합니다.
  doctrine_reference: 에녹서 내부의 신적 칭호 관습을 존중하되, 한국어 독자에게 장엄한 호칭으로 전달
- issue: ‘his name’의 지시 대상
  chosen_reading: 지시 대상을 본문 안에서 명시하지 않고 '그의 이름'으로 유지했습니다.
  alternative_readings:
  - 그 선택된 이의 이름
  - 인자의 이름
  - 그의 이름이
  rationale: 직전 문맥이 가리키는 고양된 인물을 해석할 수 있지만, 본문 자체는 대명사만 사용하므로 그 긴장을 보존했습니다.
  doctrine_reference: 본문의 불확정성을 유지하여 과도한 동일시를 피함
