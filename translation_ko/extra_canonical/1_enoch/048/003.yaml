  rationale: 명명 행위이면서도 선포적 울림을 함께 살리기 위해 '불렸다'를 사용했습니다.
- source_word: እግዚአ መናፈስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주님
  alternatives_korean:
  - 영들의 주님
  - 영들의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 정식 호칭인 'Lord of Spirits'는 직역하면 '영들의 주님'이지만, 한국어에서 매우 낯선 중복을 줄이면서도 초월적 통치성을 드러내기 위해 '만군의 주님'으로 옮겼습니다.
theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 호칭 처리
  chosen_reading: 본문에서는 예배적 친숙어인 '주님'을 유지하되, 고유 호칭의 위엄을 살려 '만군의 주님'으로 번역했습니다.
  alternative_readings:
  - 영들의 주님
  - 영들의 주인
  - 만유의 주님
  rationale: 원문 제목의 특수성을 유지하면서도 한국어에서 자연스럽고 장엄한 호칭이 되도록 조정했습니다. 다만 이는 직역보다 해석적 요소가 있어, 차후 본문 일관성 검토가 필요합니다.
  doctrine_reference: 에녹서 내부의 신적 칭호 관습을 존중하되, 한국어 독자에게 장엄한 호칭으로 전달
- issue: ‘his name’의 지시 대상
  chosen_reading: 지시 대상을 본문 안에서 명시하지 않고 '그의 이름'으로 유지했습니다.
  alternative_readings:
  - 그 선택된 이의 이름
  - 인자의 이름
  - 그의 이름이
  rationale: 직전 문맥이 가리키는 고양된 인물을 해석할 수 있지만, 본문 자체는 대명사만 사용하므로 그 긴장을 보존했습니다.
  doctrine_reference: 본문의 불확정성을 유지하여 과도한 동일시를 피함
