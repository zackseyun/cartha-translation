  naturalness: 합쇼체 문장으로 자연스럽고, ‘거룩한 이들’과 ‘의인들’의 병렬도 잘 유지됩니다. 비유의 상관 구조를 살린 ‘불 속의 짚처럼 그들은 …’이 현재 문장보다 더 매끄럽고 직접적입니다.
