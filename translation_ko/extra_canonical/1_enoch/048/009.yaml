base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/009.yaml
  text: And into the hands of my chosen ones I will deliver them[a], and like straw in the fire, so they will burn before the face of the holy ones; and like lead in water, they will sink before the face of the righteous[e][d][c][b], and no trace will be found for them.
  footnotes:
  - marker: a
    text: The opening phrase is literally 'in the hands of the chosen ones,' which may imply being given over to their power in judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'like stubble in the fire.'
    reason: lexical_alternative
  - marker: c
    text: The final clause means that nothing remained of them—no trace or remnant could be found.
    reason: lexical_alternative
  - marker: d
    text: Or 'of the chosen ones I saw them'.
    reason: previous_rendering
  - marker: e
    text: Or 'and they burned before the face of the holy ones like straw in the fire; and like lead in water they sank before the face of the righteous, and no trace was found'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 선택한 이들의 손에 그들을 넘겨 주고, 그래서 그들은 불 속의 짚처럼 거룩한 이들 앞에서 타버릴 것이며, 물 속의 납처럼 의인들 앞에서 가라앉을 것이고, 그들에게서는 아무 흔적도 발견되지 않을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내가 선택한 이들의 손에’는 문자적으로는 ‘그들의 손 안에’에 가깝지만, 여기서는 심판 집행의 주도권을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘짚’은 ‘straw’의 직역이며, 일부 전승에서는 ‘지푸라기’나 ‘들보리의 줄기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 단순히 보이지 않게 된다는 뜻이 아니라, 아무 자취도 남지 않는 완전한 소멸을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውስተ እዴሆሙ ለኅሩያን
  english_pob_choice: in the hands of my chosen ones
  chosen_korean: 내가 선택한 이들의 손에
  alternatives_korean:
  - 선택된 이들의 손안에
  - 내 선택한 자들의 손에
  - 그들의 권한 아래에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘손에’라는 구체적 이미지를 살리되, 문맥상 심판권 아래로 넘겨진다는 함의는 한국어 본문에서 과도하게 풀지 않고 남겨 두었습니다.
- source_word: እወድዮሙ
  english_pob_choice: I will deliver them
  chosen_korean: 그들을 넘겨 주고
  alternatives_korean:
  - 그들을 넘기고
  - 그들을 맡기고
  - 그들을 넘겨 주겠습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1인칭 단수 미완료형의 미래적 심판 행위를 반영해 ‘넘겨 주고’로 옮겼습니다. ‘맡기다’보다 강한 처분·인도 의미가 살아납니다.
- source_word: ከመ ሣዕር ውስተ እሳት ከመዝ ይውዕዩ
  english_pob_choice: like straw in the fire, so they will burn
  chosen_korean: 불 속의 짚처럼 ... 타버릴 것이며
  alternatives_korean:
  - 불 속의 짚처럼 ... 탈 것이며
  - 불 속의 지푸라기처럼 ... 타버릴 것이며
  - 불 속의 짚처럼 ... 불타 없어질 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비유의 핵심은 신속한 소멸이므로 ‘타버릴 것이며’로 직역보다 강도를 유지했습니다. ‘짚’은 ‘straw’의 자연스러운 한국어 대응입니다.
- source_word: እምቅድመ ገጸ ቅዱሳን / ጻድቃን
  english_pob_choice: before the face of the holy ones / before the face of the righteous
  chosen_korean: 거룩한 이들 앞에서 / 의인들 앞에서
  alternatives_korean:
  - 거룩한 자들 앞에서 / 의인들 앞에서
  - 성도들 앞에서 / 의인들 앞에서
  - 거룩한 이들 앞에서 / 의로운 이들 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘face of’는 한국어에서 자연스럽게 ‘앞에서’로 옮기되, 두 집단 명칭의 병렬을 유지했습니다. ‘holy ones’와 ‘righteous’는 여기서 서로 다른 표지로 남겨 두었습니다.
- source_word: ዐረር ውስተ ማይ
  english_pob_choice: lead in water
  chosen_korean: 물 속의 납처럼
  alternatives_korean:
  - 물 속의 납덩이처럼
  - 물에 든 납처럼
  - 물 속의 납과 같이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 무거워 가라앉는 이미지를 살리기 위해 구체적 금속명 ‘납’을 그대로 유지했습니다.
- source_word: ኢይትረከብ ሎሙ አሰር
  english_pob_choice: no trace will be found for them
  chosen_korean: 아무 흔적도 발견되지 않을 것입니다
  alternatives_korean:
  - 아무 자취도 발견되지 않을 것입니다
  - 그들에게서 흔적이 남지 않을 것입니다
  - 아무 흔적도 남지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 마지막 절은 완전한 소멸을 뜻하므로 ‘흔적’을 택해 EN POB의 의미를 유지했고, 수동형을 자연스러운 한국어로 풀었습니다.
theological_decisions:
- issue: ‘선택한 이들의 손’의 심판적 의미를 얼마나 명시할 것인가
  chosen_reading: 공간적 이미지는 보존하되, 심판 집행의 함의는 본문 안에서만 암시되도록 두었습니다.
  alternative_readings:
  - 그들의 권세 아래로 넘겨 주다
  - 선택한 이들이 심판권을 행사하도록 넘겨 주다
  rationale: 게에즈 표현은 문자적으로 ‘손 안에’이므로, 해석을 앞서 강하게 풀기보다 본문의 이미지와 긴장을 유지하는 것이 source-grounded합니다.
  doctrine_reference: 원문 이미지 보존과 과잉해석 억제
- issue: ‘거룩한 이들’과 ‘의인들’의 관계
  chosen_reading: 두 표현을 구별된 병렬 표지로 유지했습니다.
  alternative_readings:
  - 같은 집단을 반복 지칭하는 표현으로 통합
  - 거룩한 이들=천상 존재, 의인들=인간 신자들로 분화
  rationale: 문맥상 동일 집단일 수도 있지만, 본문이 두 명칭을 병렬로 제시하므로 한국어에서도 구분을 살려 남겨 두었습니다.
  doctrine_reference: 본문 내부의 용어 구분 보존
