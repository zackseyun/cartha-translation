  rationale: 이 절만으로는 지시 대상의 정체를 확정할 근거가 부족하므로, 해석을 닫지 않고 원문의 긴장과 상징성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 묵시적 이미지의 다의성을 보존하고, 본문 밖의 동일시를 서두르지 않음
