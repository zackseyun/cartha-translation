base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/044/001.yaml
  text: 'And another thing I saw concerning the lightning: how some of the stars arise and become lightning[b][a], and they are not able to leave it.'
  footnotes:
  - marker: a
    text: The final clause is uncertain. The Ge'ez likely means 'they are not able to leave off / cease,' though 'depart' is also possible.
    reason: lexical_alternative
  - marker: b
    text: Or 'how some stand out from the stars and become lightning, and they are not able to leave off.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 다른 일을 보았습니다. 곧 번개에 관하여, 별들 중 일부가 일어나 번개가 되고, 그것을 떠날 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절의 뜻은 다소 불확실합니다. 게에즈어는 ‘떠나다’ 또는 ‘그만두다’를 뜻할 가능성이 크지만, ‘버리다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면, ‘별들 중 일부가 일어나 번개가 되고, 그것을 떠날 수 없다’입니다.
    reason: previous_rendering
