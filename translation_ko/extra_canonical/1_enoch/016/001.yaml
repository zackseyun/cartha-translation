  english_pob_choice: the spirits that have gone out from the souls of their flesh
  chosen_korean: 그들의 혼과 그들의 육체에서 나온 그 영들
  alternatives_korean:
  - 그들의 몸과 혼에서 나온 영들
  - 그들의 육체에서 나온 혼령들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문구가 난해하므로 영어 POB가 보존한 ‘souls of their flesh’라는 이질적 구조를 너무 매끈하게 풀지 않고, ‘혼과 육체에서 나온’ 형태로 출처의 긴장을 유지했습니다.
- source_word: ዘእንበለ ኵነኔ
  english_pob_choice: without incurring judgment
  chosen_korean: 심판 없이
  alternatives_korean:
