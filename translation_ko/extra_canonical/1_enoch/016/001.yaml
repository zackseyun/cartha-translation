base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/016/001.yaml
  text: From the days of the slaughter and destruction and death of the giants[a], the spirits that have gone out from the souls of their flesh shall destroy without incurring judgment; thus they shall destroy until the day of the completion of the great judgment[d][c][b], when the great age shall be brought to its end.
  footnotes:
  - marker: a
    text: The opening clause is textually difficult in the OCR witness. The sense is that from the time marked by slaughter, destruction, and death, these spirits continue their ravaging activity.
    reason: textual_variant
  - marker: b
    text: '''The spirits that have gone out from the souls of their flesh'' is a very literal rendering of a difficult phrase. It likely refers to disembodied spirits associated with the Watchers'' offspring in the surrounding context.'
    reason: lexical_alternative
  - marker: c
    text: Or 'when the great world-order reaches its completion.' The Ge'ez term can carry the sense of 'age' or 'world.'
    reason: lexical_alternative
  - marker: d
    text: Or 'From the days of slaughter and destruction and death, the spirits'.
    reason: previous_rendering
translation:
  language: ko
  text: 거인들의 학살과 파괴와 죽음의 때부터, 그들의 혼과 그들의 육체에서 나온 그 영들은 심판 없이 파괴할 것이며, 그렇게 그들은 큰 심판의 완성이 이루어지는 날, 곧 큰 시대가 끝에 이를 때까지 파괴할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 이 시작 구절에서 ‘거인들’을 포함합니다. 영어 POB의 보정도 이를 반영합니다.
    reason: source_note
  - marker: b
    text: ‘그들의 혼과 그들의 육체에서 나온 그 영들’은 매우 난해한 표현으로, 문맥상 감시자 후손과 연결된 분리된 영적 존재들을 가리키는 것으로 이해할 수 있습니다.
    reason: theological_note
  - marker: c
    text: 게에즈 ዓለም은 ‘시대’ 또는 ‘세계질서’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: እመዋዕለ ቀትል ወሙስና ወሞተ ረዓይትኒ
  english_pob_choice: From the days of the slaughter and destruction and death of the giants
  chosen_korean: 거인들의 학살과 파괴와 죽음의 때부터
  alternatives_korean:
  - 거인들의 도살과 멸망과 죽음의 때부터
  - 거인들의 살육과 파멸과 죽음의 날부터
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 본문과 영어 POB 보정은 ‘거인들’(ረዓይት)을 분명히 포함하므로 이를 생략하지 않았고, 3중 재앙 표현은 ‘학살/파괴/죽음’으로 직역성이 있으면서도 문맥의 파국성을 살렸습니다.
- source_word: ወፅአ መናፍስት እምነፍሳት ሥጋሆሙ
  english_pob_choice: the spirits that have gone out from the souls of their flesh
  chosen_korean: 그들의 혼과 그들의 육체에서 나온 그 영들
  alternatives_korean:
  - 그들의 몸과 혼에서 나온 영들
  - 그들의 육체에서 나온 혼령들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문구가 난해하므로 영어 POB가 보존한 ‘souls of their flesh’라는 이질적 구조를 너무 매끈하게 풀지 않고, ‘혼과 육체에서 나온’ 형태로 출처의 긴장을 유지했습니다.
- source_word: ዘእንበለ ኵነኔ
  english_pob_choice: without incurring judgment
  chosen_korean: 심판 없이
  alternatives_korean:
  - 판결 없이
  - 정죄 없이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서의 핵심은 종결 심판에 이르지 않은 채 계속되는 파괴 활동이므로, 자연스러운 현대어로 ‘심판 없이’로 옮겼습니다.
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  english_pob_choice: until the day of the completion of the great judgment
  chosen_korean: 큰 심판의 완성이 이루어지는 날까지
  alternatives_korean:
  - 큰 심판이 완료되는 날까지
  - 큰 심판의 종결의 날까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘완성/성취’의 종말론적 어감을 살리면서, 게에즈의 명사적 구조를 한국어에서 자연스러운 서술로 풀었습니다.
- source_word: አመ ዓለም ዐቢይ ይትፌጸም
  english_pob_choice: when the great age shall be brought to its end
  chosen_korean: 곧 큰 시대가 끝에 이를 때까지
  alternatives_korean:
  - 곧 큰 세상이 끝날 때까지
  - 곧 큰 세계질서가 완성될 때까지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 footnote가 지적하듯 ዓለም은 ‘age/world-order’의 범위를 가지므로, 여기서는 창조 세계의 소멸보다 종말론적 ‘시대’의 종료를 분명히 했습니다.
theological_decisions:
- issue: ‘그들의 혼과 그들의 육체에서 나온 그 영들’의 정체
  chosen_reading: 본문의 난해함을 유지하면서, 거인들/감시자 후손과 연결된 분리된 영적 존재들이라는 배경을 암시하는 수준으로 번역했습니다.
  alternative_readings:
  - 거인들의 죽은 영혼들
  - 육체를 떠난 인간 영들
  rationale: 영어 POB와 게에즈 본문 모두 이 구절을 단순화하지 않으며, 주변 문맥의 위니자(Watchers) 전승과 연결되는 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 원문 우선, 난해한 종말론적/영적 표현은 해소하지 않고 보존
- issue: ዓለም의 번역
  chosen_reading: ‘큰 시대’로 번역해 종말론적 세계-질서의 완결을 드러냈습니다.
  alternative_readings:
  - 큰 세계
  - 큰 세상
  rationale: 문맥상 단순한 공간적 ‘세계’보다 시대적·질서적 종결이 더 강하므로, ‘시대’가 의미를 더 정확히 드러냅니다.
  doctrine_reference: 종말론적 어휘의 범위를 축소하지 않음
