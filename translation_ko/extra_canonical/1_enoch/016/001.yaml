  - 정죄 없이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서의 핵심은 종결 심판에 이르지 않은 채 계속되는 파괴 활동이므로, 자연스러운 현대어로 ‘심판 없이’로 옮겼습니다.
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  english_pob_choice: until the day of the completion of the great judgment
  chosen_korean: 큰 심판의 완성이 이루어지는 날까지
  alternatives_korean:
