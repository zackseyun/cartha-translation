translation:
  language: ko
  text: '이 모든 일이 있기 전에 에녹은 숨겨졌습니다. 사람의 자손 가운데는 그가 어디에 숨겨졌는지, 어디에 있는지, 그에게 무슨 일이 일어났는지를 아는 사람이 없었습니다. 그의 모든 행적은 그 시대에 거룩한 이들과 파수꾼들과 함께 이루어졌습니다.


    나 에녹은 위대한 주님, 곧 세상의 왕을 찬양하고 있었습니다. 그런데 보십시오, 파수꾼들이 나 에녹, 서기관을 불러 이렇게 말했습니다. “의의 서기관 에녹아, 가서 높은 하늘과 영원한 거룩한 처소를 버리고, 여자들과 관계하여 자신을 더럽히며, 사람의 자손들이 하는 것처럼 행하고, 아내들을 맞이하여 땅 위에서 큰 타락으로 자신을 더럽힌 하늘의 파수꾼들에게 알려라. ‘너희에게는 땅 위에서 평화도 죄 사함도 없을 것이다. 너희가 자기 자녀들을 기뻐하므로, 사랑하는 이들이 죽임당하는 것을 보게 될 것이며, 자기 자녀들이 멸망하는 것을 두고 슬퍼할 것이다. 너희는 영원히 간구하겠으나, 너희에게 자비도 평화도 없을 것이다.’”'
  philosophy: optimal-equivalence
