translation:
  language: ko
  text: 그리고 그날, 그것은 정확히 일곱 부분을 지닌 채 떠오르며, 나옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሠርቅ
  english_pob_choice: it rises
  chosen_korean: 떠오르고
  alternatives_korean:
  - 일어나고
  - 솟아오르고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체의 운동을 가리키는 동사로 이해하여, 단순한 ‘나오다’보다 하늘에서 밝아 오는 이미지를 살리는 ‘떠오르다’로 옮겼습니다.
- source_word: በይእቲ ዕለት
  english_pob_choice: on that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그 특정한 날에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시 대명사가 붙은 시간 표현을 자연스러운 한국어 시점 표지로 옮겼습니다.
- source_word: ሳብዐተ እደ ጥንቁቀ
  english_pob_choice: exactly seven parts
  chosen_korean: 정확히 일곱 몫으로
  alternatives_korean:
  - 일곱 부분으로
  - 일곱 몫으로 정확히
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 핵심은 ‘일곱’과 ‘정확히’의 수량성입니다. እደ를 단순한 ‘날’이나 ‘문’으로 돌리지 않고, 분할된 몫/부분의 의미를 살려 번역했습니다.
- source_word: ይወፅእ
  english_pob_choice: it comes out
  chosen_korean: 나오게 됩니다
  alternatives_korean:
  - 나옵니다
  - 밖으로 나갑니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동일한 운동 동사를 한국어로 중복 과장하지 않으면서, 천체가 특정한 개방부를 통해 ‘나오는’ 움직임을 간결하게 살렸습니다.
theological_decisions:
- issue: 천체를 가리키는 인칭 처리
  chosen_reading: ‘그것’으로 무인칭화하여 번역했습니다.
  alternative_readings:
  - ‘그’로 의인화하기
  - 주어를 생략하기
  rationale: 게에즈의 남성 단수 동사 형태를 감안하더라도, 이 절은 천문적 서술이므로 한국어에서는 무인칭이 더 자연스럽고 본문의 의미를 덜 왜곡합니다.
  doctrine_reference: 묵시적 우주론 서술을 현대 한국어 문체로 보존하되, 불필요한 의인화는 피합니다.
