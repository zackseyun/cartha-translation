  text: And on that day it rises with exactly seven parts[b][a], and it comes out.
  footnotes:
  - marker: a
    text: The underlying phrase may also be rendered 'through that eastern gate/portal.' The Ge'ez OCR is somewhat uncertain at this point, but the sense is of a specific horizon-opening used in the luminary's course.
