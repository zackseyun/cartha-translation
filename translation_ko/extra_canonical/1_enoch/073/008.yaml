  - marker: b
    text: Or 'And on that seventh day he turns back by that eastern opening, and he goes out.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그날에 그것은 정확히 일곱 몫으로 떠오르고, 나오게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 게에즈 표현은 ‘동쪽의 문/열림을 통해’로도 옮길 수 있습니다.
