base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/006.yaml
  text: And on the day it takes up a seventh part of half of its light[c][b][a], and its light becomes one and a half seventh parts.
  footnotes:
  - marker: a
    text: The underlying expression is literally 'seven hands,' an idiom for measured portions or units in this astronomical context.
    reason: lexical_alternative
  - marker: b
    text: The final numbers are difficult in English. The Ge'ez reads literally along the lines of 'seven parts, one and a half,' so the verse likely describes a fractional increase in the moon's light.
    reason: textual_variant
  - marker: c
    text: Or 'she rises, she takes seven parts from half of her light, and her light becomes seven parts and one half'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날에는 빛의 절반의 일곱째 몫을 취하고, 그 빛은 한 일곱째 몫 반이 됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈의 ‘일곱 손/몫’ 계열 표현은 이 천문 문맥에서 분량 단위를 가리키는 관용구로 이해됩니다.
    reason: source_note
  - marker: b
    text: 마지막 수량 표현은 게에즈 원문이 수학적으로 다소 난해하여, 분수의 증가를 가리키는 말로 읽는 것이 가장 자연스럽습니다.
    reason: textual_variant
  - marker: c
    text: '다른 가능한 옮김: “그리고 그 날에는 빛의 절반에서 일곱 몫을 취하고, 그 빛은 일곱 몫과 한 반이 됩니다.”'
    reason: alternative_reading
