base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/002.yaml
  text: And its circuit is like the circuit of heaven[a], and its chariots, by which it goes out, are driven by the wind[c][b]; and light is given to it by measure.
  footnotes:
  - marker: a
    text: The clause about the winds is difficult in the Ethiopic witness. The sense may be that its chariots proceed where the wind blows, or that they are driven along by winds.
    reason: textual_variant
  - marker: b
    text: Or 'according to measure' or 'by fixed measure.' The phrase emphasizes regulated, ordered distribution of light.
    reason: lexical_alternative
  - marker: c
    text: Or 'and its chariots are borne along by the winds'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 둘레는 하늘의 둘레와 같고, 그것이 나아갈 때 쓰는 수레들은 바람에 이끌려 갑니다.[a][c] 그리고 그것에는 빛이 분량에 따라 주어집니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 바람에 관한 이 절은 에티오피아어 사본에서 구문이 어렵습니다. 수레들이 바람이 부는 곳으로 나아간다는 뜻일 수도 있고, 바람에 의해 이끌려 간다는 뜻일 수도 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 '분량대로', '정해진 척도에 따라'. 이 표현은 빛이 질서 있고 규정된 방식으로 분배됨을 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 '그 수레들은 바람에 실려 갑니다'.
    reason: previous_rendering
lexical_decisions:
- source_word: ወክበቡ / ከመ ክበበ ሰማይ
  english_pob_choice: its circuit is like the circuit of heaven
  chosen_korean: 그 둘레는 하늘의 둘레와 같고
  alternatives_korean:
  - 그 순환은 하늘의 순환과 같고
  - 그 둘레는 하늘의 원주와 같고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''둘레''는 원형의 범위와 운동의 의미를 함께 살릴 수 있어 ''circuit''의 핵심을 자연스럽게 옮깁니다. ''하늘''은 본문의 우주적 어조를 살리기 위해 유지했습니다.'
- source_word: ሰረገላተ ዚአሁ
  english_pob_choice: its chariots
  chosen_korean: 그 수레들은 그것이 나아가는 수레들이며
  alternatives_korean:
  - 그 전차들은
  - 그 전차-구조물들은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''수레''는 본문의 시각적·우주적 이미지를 유지하면서도 한국어에서 이해하기 쉽습니다. 반복을 통해 ''chariots''와 이어지는 다음 절의 동작을 자연스럽게 받게 했습니다.'
- source_word: በኀበ ይጼዓን ነፋስ ትነፍስ
  english_pob_choice: are driven by the wind / are borne along by the winds
  chosen_korean: 바람에 실려 갑니다
  alternatives_korean:
  - 바람에 이끌려 갑니다
  - 바람에 떠밀려 갑니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 바람이 수레의 움직임을 매개하는 뜻을 살려, '실려 갑니다'로 자연스럽고 수동적인 이동을 표현했습니다. 복수 바람보다 단수 '바람'이 한국어에서는 더 매끄럽습니다.
- source_word: በመስፈርት
  english_pob_choice: by measure / according to measure
  chosen_korean: 정해진 분량대로
  alternatives_korean:
  - 분량에 따라
  - 측정된 한도대로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''measure''는 단순한 양이 아니라 질서 있게 정해진 배분을 뜻하므로, ''정해진 분량대로''로 옮겨 규정된 배분의 뉘앙스를 살렸습니다.'
- source_word: ይትወሀብ ሎቱ ብርሃን
  english_pob_choice: light is given to it
  chosen_korean: 빛은 정해진 분량대로 그것에게 주어집니다
  alternatives_korean:
  - 빛이 그것에게 주어집니다
  - 빛이 그것에 주어집니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형을 살려 빛이 스스로 생기는 것이 아니라 주어지는 것임을 드러냈습니다. 문맥상 'it'은 앞의 우주적 광체를 가리킵니다.
theological_decisions:
- issue: 우주적 이동 이미지를 현대 천문학 용어로 바꿀지 여부
  chosen_reading: '''둘레''와 ''수레''를 유지하여 비전적·우주적 이미지를 보존했습니다.'
  alternative_readings:
  - '''궤도''와 ''장치''로 현대화'
  - '''경로''와 ''이동 수단''으로 일반화'
  rationale: 이 본문은 질서 있게 운행되는 하늘의 형상을 그리는 묵시 문학이므로, 현대 과학 용어로 바꾸면 본문의 상징적 힘이 약해집니다.
  doctrine_reference: '번역 원칙: 장르적 이미지를 보존하고, 본문에 없는 현대적 과학 범주를 들이지 않습니다.'
