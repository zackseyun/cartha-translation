base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/004.yaml
  text: And in this way it rises[a], and its front, which is toward the east, comes out on the thirtieth morning, and on that day it becomes visible, and it shall be for you the head of the month, on the thirtieth day with the sun[e][d][c][b], in the gate from which the sun comes out.
  footnotes:
  - marker: a
    text: Or 'the beginning of the month.' The Ge'ez reads literally 'the head of the month,' a concrete idiom for the month's commencement.
    reason: lexical_alternative
  - marker: b
    text: The 'gate' is part of the Astronomical Book's recurring picture of heavenly bodies emerging through ordered portals of the sky.
    reason: cultural_note
  - marker: c
    text: Or 'And in this way it is hidden'.
    reason: previous_rendering
  - marker: d
    text: Or 'and its head is toward the east; it comes out'.
    reason: previous_rendering
  - marker: e
    text: Or 'thirty days'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이 그것이 떠오르고, 그 머리는 동쪽을 향하여 서른아침에 나와 그날에 드러나며, 서른째 날에는 여러분에게 달의 머리가 되는데, 해와 함께, 해가 나오는 문 안에서입니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘숨겨진다’로 옮길 수 있습니다. 지시된 동사는 이 문맥에서 달의 출현·소멸 주기를 묘사합니다.
    reason: alternative_reading
  - marker: b
    text: ‘문’은 『에녹서』의 반복되는 천체 출입구 도상에 속합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그 머리는 동쪽을 향하여 나오고’로 옮길 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘서른째 날’ 대신 ‘서른 날’로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: e
    text: 또는 ‘달의 시작’으로 옮길 수 있습니다. 그러나 여기서는 원문의 ‘머리’ 이미지를 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  english_pob_choice: it is hidden
  chosen_korean: 떠오르고
  alternatives_korean:
  - 숨겨지고
  - 드러나고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 달의 주기적 출현을 설명하는 구절이므로, POB의 영어 ‘it is hidden’ 계열과 대응되는 대비를 살리면서도 이어지는 ‘나와’와 자연스럽게 맞물리는 ‘떠오르다’를 본문에 두었습니다.
- source_word: ርእሱ / ርእሰ ወርኅ
  english_pob_choice: its front / the head of the month
  chosen_korean: 그 머리 / 달의 머리
  alternatives_korean:
  - 그 앞부분 / 달의 시작
  - 그 앞 / 월초
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 직유적·우주론적 이미지를 보존하기 위해 ‘head’를 추상화하지 않고 ‘머리’로 옮겼습니다. 달력 표현도 ‘월초’로 풀기보다 ‘달의 머리’로 유지해 원문의 기술적 어조를 살렸습니다.
- source_word: በሠላሳ ጽባሕ / ሠላሳ ዕለት
  english_pob_choice: on the thirtieth morning / on the thirtieth day
  chosen_korean: 서른아침에 / 서른째 날에는
  alternatives_korean:
  - 서른 번째 새벽에 / 서른 날에
  - 서른아침마다 / 서른째 날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간표현으로서의 순서값을 살려, ‘thirtieth morning’은 ‘서른아침’, ‘thirtieth day’는 판정된 수정에 맞춰 ‘서른째 날’로 옮겼습니다. 둘 다 천문·력법 문맥의 날짜 표지로 이해했습니다.
- source_word: በኆኅት እንተ ይወፅእ ፀሐይ
  english_pob_choice: in the gate from which the sun comes out
  chosen_korean: 해가 나오는 문 안에서
  alternatives_korean:
  - 해가 나오는 문에서
  - 해가 나오는 문을 통해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘gate’의 천상 출입구 이미지를 유지하기 위해 ‘문’으로 옮기고, 위치 격을 살려 ‘문 안에서’로 처리했습니다. 일반적 지평선 묘사로 평탄화하지 않았습니다.
theological_decisions:
- issue: 천문·력법 이미지를 현대식 언어로 평탄화할지 여부
  chosen_reading: 문, 머리, 나옴 같은 구체적 우주론 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 새달, 동쪽 지평선, 일출 지점으로 현대화하기
  rationale: 『에녹서』의 천문 장은 계시된 우주 질서를 고유한 도상으로 제시하므로, 현대 천문 용어로 바꾸면 본문의 문학적 세계와 상징 구조가 약화됩니다.
  doctrine_reference: '번역 원칙: apocalyptic imagery 보존; 현대적 설명어로 평탄화하지 않음.'
