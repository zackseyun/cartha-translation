  rationale: '''empty''와 ''without light''를 중첩하여 말하는 구조를 한국어에서도 두 겹으로 드러내기 위해 ''비어 있습니다''와 ''빛이 없이''를 함께 살렸습니다.'
- source_word: ዐሠርተ ራብዐተ እደ ብርሃኑ
  english_pob_choice: a fourteenth part of its light
  chosen_korean: 그 빛의 열넷째 몫
  alternatives_korean:
