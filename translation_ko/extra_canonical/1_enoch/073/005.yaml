  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천문적 묘사에서 ክበብ은 원이나 원반에 해당하므로, 현대 한국어에서 자연스러운 '원반'을 택해 시각적 형상을 분명히 했습니다.
- source_word: ባክ ዘአልቦ ብርሃነ
  english_pob_choice: empty, without light
  chosen_korean: 빛이 없이 비어 있습니다
