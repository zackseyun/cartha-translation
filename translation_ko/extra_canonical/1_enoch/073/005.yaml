  - 그 빛의 열네 몫
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 분수표현을 현대식으로 풀기보다, 본문의 수량적·반복적 리듬을 보존하는 '열넷째 몫'으로 옮겨 원문의 계산 구조를 드러냈습니다.
theological_decisions:
- issue: 천문 도상과 현대 과학적 설명의 관계
  chosen_reading: 이 절은 달의 위상을 현대 천문학식으로 설명하기보다, 계시적-천문학적 도식 안에서 분량을 계산하는 서술로 유지했습니다.
  alternative_readings:
  - 달의 차고 이지러짐에 대한 일반 진술로 풀어 쓰기
  - 현대 분수 표기로 정규화하기
  rationale: 에녹서의 천문책은 반복되는 몫과 비율로 천체의 질서를 묘사하므로, 그 수리적 어법을 완화하지 않고 그대로 드러내는 편이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: Original-language primacy; Preserve textual tension rather than resolve it
