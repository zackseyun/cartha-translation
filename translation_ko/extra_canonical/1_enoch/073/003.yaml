  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 분수의 의미를 살리면서도 한국어에서 자연스럽고 간결한 표현으로 옮겼습니다. '몫'은 비율적 분배를 암시합니다.
