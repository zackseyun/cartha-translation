base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/003.yaml
  text: And in every month its going out and its returning vary[a], and its days are like the days of the sun; and when its light is full[c][b], it is a seventh part of the light of the sun.
  footnotes:
  - marker: a
    text: The verse speaks of a luminary's cyclical 'going out' and 'returning,' likely technical or semi-technical astronomical language for its course. More interpretive renderings such as 'rising' and 'setting' are possible but not certain from the Ge'ez alone.
    reason: lexical_alternative
  - marker: b
    text: The darkening language likely refers to the moon's waning light in comparison with the sun, here quantified as one-seventh.
    reason: cultural_note
  - marker: c
    text: Or 'when it becomes dark, its light amounts to'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 매달 그 나감과 돌아옴은 달라지며, 그 날들의 수는 해의 날들의 수와 같고, 그 빛이 가득할 때에는 해의 빛의 칠분의 일입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሙፃኢሁ
  english_pob_choice: its going out
  chosen_korean: 그 출발
  alternatives_korean:
  - 그 나감
  - 그 나아감
  - 그 나가는 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 달의 운동을 지시하는 기술적 표현으로 보이며, ‘출발’은 방향성과 운동성을 유지하면서도 과도하게 천문학 용어로 고정하지 않습니다.
- source_word: ምብዋኢሁ
  english_pob_choice: its returning
  chosen_korean: 돌아옴
  alternatives_korean:
  - 그 들어옴
  - 그 되돌아옴
  - 그 돌아감
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ‘출발’과 짝을 이루는 대구를 살려, 입장/종말을 단정하는 표현보다 ‘돌아옴’이 원문의 병렬성을 잘 드러냅니다.
- source_word: ይትዌለጥ
  english_pob_choice: vary
  chosen_korean: 달라지며
  alternatives_korean:
  - 변하며
  - 구별되며
  - 달라집니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관측되는 주기적 변화라는 의미를 자연스럽게 전하면서, 단순한 '변하다'보다 문맥에 맞는 변동성을 드러냅니다.
- source_word: ይፄሪ
  english_pob_choice: when its light is full
  chosen_korean: 그 빛이 가득할 때에는
  alternatives_korean:
  - 그 빛이 충만할 때에는
  - 그 빛이 가득 차 있을 때에는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석된 수정 반영대로 ‘어두워질 때’가 아니라 달빛이 충만한 상태를 가리키므로, ‘가득할 때’로 직역에 가깝게 옮겼습니다.
- source_word: ሳብዓደ እደ
  english_pob_choice: a seventh part
  chosen_korean: 일곱째 몫
  alternatives_korean:
  - 일곱 부분
  - 일곱 분의 일
  - 일곱째 몫의 비율
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 분수의 의미를 살리면서도 한국어에서 자연스럽고 간결한 표현으로 옮겼습니다. '몫'은 비율적 분배를 암시합니다.
