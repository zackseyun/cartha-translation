  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/004.yaml
  text: And pain shall come upon them as upon a woman in labor[a], when her child comes to the mouth of the womb[c][b], and she is constrained in giving birth.
  footnotes:
  - marker: a
    text: Literally, 'to the mouth of the womb,' an anatomical expression intensifying the childbirth image.
    reason: lexical_alternative
  - marker: b
    text: The bracketed phrase in the source witness suggests textual uncertainty around the clause describing the woman's distress in labor; the translation reflects the received sense without over-specifying the syntax.
    reason: textual_variant
  - marker: c
    text: Or 'like a woman who is in labor'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들에게는 해산 중인 여인에게[a] 임하는 것처럼 고통이 닥칠 것이며, 아이가 자궁의 입구[b]에 이를 때, 그 여인은 해산하면서 압박을 받게 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해산하는 여인에게’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자궁의 입’입니다. 해부학적이고 생생한 출산의 이미지를 나타내는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 원문 증인에서는 여인의 해산 중 고통을 묘사하는 한 구절이 대괄호로 표시되어 있어 구문에 약간의 본문상 불확실성이 있습니다. 번역은 받아들여진 뜻을 따르되, 그 구문을 지나치게 특정하지 않았습니다.
    reason: textual_variant
