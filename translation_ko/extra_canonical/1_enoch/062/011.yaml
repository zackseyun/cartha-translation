translation:
  language: ko
  text: 그리고 그는 그들을 벌을 위해 천사들에게 넘겨주실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌과 함께 천사들에게 넘겨주실 것입니다.’ 게에즈 구조는 ‘벌을 위해’처럼 목적/결과로도, ‘벌과 함께’처럼 수단적으로도 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሜጥዎሙ
  english_pob_choice: and he will deliver them over
  chosen_korean: 그는 그들을 넘겨주실 것입니다
  alternatives_korean:
  - 그는 그들을 넘기실 것입니다
  - 그는 그들을 인도하실 것입니다
  - 그는 그들을 넘겨줄 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판적·법정적 맥락에서 단순한 ‘보내다’보다 ‘넘겨주다’가 타자에게 처분권이 넘어감을 더 잘 드러냅니다. 합쇼체 서술에 맞춰 ‘넘겨주실 것입니다’로 옮겼습니다.
- source_word: ለመላእክት
  english_pob_choice: to the angels
  chosen_korean: 천사들에게
  alternatives_korean:
  - 천사들로
  - 천사들 손에
  - 천사들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 수여·귀속의 대상을 가리키므로 ‘천사들에게’가 가장 직접적입니다. 본문이 천사들의 구체적 종류를 더 규정하지 않으므로 그대로 유지했습니다.
- source_word: በመቅሠፍት
  english_pob_choice: for punishment
  chosen_korean: 벌을 위해
  alternatives_korean:
  - 벌로
  - 징계를 위해
  - 형벌을 위해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 명사는 ‘벌/징벌/징계’의 뜻을 가지며, 전치사구는 목적·결과로도 읽힐 수 있습니다. POB의 긴장을 살리면서 자연스러운 한국어로는 ‘벌을 위해’가 가장 무난합니다.
theological_decisions:
- issue: 천사들의 역할을 얼마나 구체화할지
  chosen_reading: 천사들은 단순히 심판 집행의 수탁자로만 제시하고, 별도의 설명은 덧붙이지 않았습니다.
  alternative_readings:
  - 징벌하는 천사들로 구체화
  - 보호 천사들과 대비되는 특정 집행 천사로 해석
  rationale: 원문은 ‘천사들’만 말하며 직분이나 종류를 규정하지 않습니다. 본문의 절제된 표현을 따라, 심판의 기능은 ‘벌을 위해’로만 드러내고 천사 정체는 확장하지 않았습니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고, 사본이 말하지 않는 부분을 과도하게 해석하지 않습니다.
