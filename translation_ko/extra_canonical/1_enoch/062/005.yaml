base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/005.yaml
  text: And one half of them shall look at the other half[a], and they shall be terrified, and their faces shall fall[b], and pain shall seize them when they see that Son of Man sitting on the throne of his glory.
  footnotes:
  - marker: a
    text: Or 'their faces shall be cast down.' The Ge'ez idiom likely expresses visible shame or dread.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'that Son of Man' is retained as an apocalyptic title in the Parables, without importing later doctrinal wording beyond what this passage itself supports.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그들 중 한 절반은 다른 절반을 바라볼 것이며[a], 그들은 두려워 떨고 얼굴을 떨굴 것이며[b], 그들은 그의 영광의 왕좌에 앉아 계신 그 인자[c]를 볼 때 고통이 그들을 사로잡을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 절반’과 ‘다른 절반’은 무리가 둘로 나뉜 모습을 나타냅니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그들의 얼굴이 내려앉는다’는 뜻입니다. 수치와 공포로 얼굴을 아래로 떨구는 모습을 나타내는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 인자’는 이 문맥에서 특정한 묵시적 인물을 가리키는 칭호입니다. 원문의 지시사에 따라 ‘그’를 보존했습니다.
    reason: cross_reference
lexical_decisions:
- source_word: መንፈቆሙ ... ለመንፈቆሙ
  english_pob_choice: one half of them ... the other half
  chosen_korean: 한쪽 절반 ... 다른 절반
  alternatives_korean:
  - 그들의 절반들 ... 서로
  - 반씩 ... 서로에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복된 ‘절반’ 표현을 살려 실제로 둘로 갈라진 무리를 보이게 하며, 상호지시적 완화 표현은 피했습니다.
- source_word: ይሬእዩ
  english_pob_choice: shall look at / see
  chosen_korean: 바라볼 것이며 / 볼 때
  alternatives_korean:
  - 보게 될 것이며
  - 응시할 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 절은 대상을 향한 시선을, 마지막 절은 ‘보는’ 행위를 자연스럽게 구분해 살렸습니다.
- source_word: ይደነግጹ
  english_pob_choice: shall be terrified
  chosen_korean: 두려워 떨
  alternatives_korean:
  - 겁에 질리
  - 몹시 놀라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 공포의 강도를 유지하면서 한국어로는 ‘두려워 떨다’가 가장 직접적입니다.
- source_word: ይቴሕቱ ገጾሙ
  english_pob_choice: their faces shall fall
  chosen_korean: 그들의 얼굴은 내려앉을 것이며
  alternatives_korean:
  - 그들의 얼굴은 떨어질 것이며
  - 그들의 얼굴은 수그러질 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관용구가 지닌 ‘수치와 공포로 얼굴이 떨어짐’의 이미지를 직역에 가깝게 보존했습니다.
- source_word: ይእኅዞሙ ሕማም
  english_pob_choice: pain shall seize them
  chosen_korean: 고통이 그들을 사로잡을 것입니다
  alternatives_korean:
  - 고통이 그들을 붙들 것입니다
  - 아픔이 그들을 덮칠 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘사로잡다’는 능동적으로 붙드는 힘을 드러내어, 단순한 감각보다 압도적 고통의 이미지를 살립니다.
- source_word: መንበረ ስብሐቲሁ
  english_pob_choice: the throne of his glory
  chosen_korean: 그 영광의 왕좌
  alternatives_korean:
  - 그의 영광의 왕좌
  - 영광의 왕좌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘throne’의 왕권 이미지를 분명히 하기 위해 ‘왕좌’를 택했고, 소유격은 뒤의 문맥과 함께 자연스럽게 처리했습니다.
theological_decisions:
- issue: ወልደ ብእሲ를 한국어에서 어떻게 처리할지
  chosen_reading: 문맥상 종말론적 인물 호칭으로 보고 ‘그 인자’로 옮겼습니다.
  alternative_readings:
  - 그 사람의 아들
  - 그 인자라는 사람
  rationale: 이 본문은 ‘그 인자’가 왕좌에 앉아 계신 계시적 장면이므로, 단순한 인간 일반 표현보다 титular한 호칭으로 읽는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 본문 고유의 묵시적 칭호를 보존하고, 후대 교리 용어를 덧씌우지 않음
- issue: ‘that Son of Man’의 지시성을 한국어로 어떻게 반영할지
  chosen_reading: 별도 지시어를 과도하게 넣지 않고 문맥으로 처리했습니다.
  alternative_readings:
  - 그 인자
  - 그 저 인자
  rationale: 한국어에서 ‘that’를 억지로 드러내면 부자연스러워져, 계시 장면 전체가 이미 특정 인물을 가리킨다는 점으로 충분히 반영됩니다.
  doctrine_reference: 계시적 장면의 지시성 유지
