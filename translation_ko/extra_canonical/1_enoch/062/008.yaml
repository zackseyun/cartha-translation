  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘chosen’의 직접적 대응을 살리면서도 ‘선민’처럼 신학적 관용어로 굳히지 않고, 본문의 반복되는 선택 개념을 투명하게 전달합니다.
- source_word: ቅዱሳን
  english_pob_choice: holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
