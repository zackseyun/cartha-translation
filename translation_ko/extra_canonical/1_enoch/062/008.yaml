  - 그의 면전 앞에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판/현현의 전면적 대면을 나타내는 전치사구로서, 간결한 ‘그의 앞에’가 가장 직접적입니다.
theological_decisions:
- issue: ቅዱሳን(holy ones)의 지시 대상
  chosen_reading: 인간 의인 공동체로만 좁히지 않고, ‘거룩한 이들’로 넓게 유지했습니다.
  alternative_readings:
  - ‘성도’로 신자 공동체를 특정
  - ‘천상 존재’로 해석
  rationale: 영문 POB가 의도한 대로 본문은 종말론적 문맥에서 범주를 일부러 열어 둡니다. 한국어도 그 긴장을 유지해야 하며, 단정적 해석은 피하는 것이 source-faithful합니다.
  doctrine_reference: 해석을 과도하게 확정하지 말고 본문의 모호성을 보존
