  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 존재와 신실한 공동체를 모두 열어 두는 POB의 긴장을 따라, 교회적 용어인 ‘성도’보다 중립적인 ‘거룩한 이들’을 택했습니다.
- source_word: በቅድሜሁ
