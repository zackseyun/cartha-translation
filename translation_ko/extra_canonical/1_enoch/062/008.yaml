base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/008.yaml
  text: And the congregation of the chosen and the holy ones shall be sown[c][b][a], and all the chosen shall stand before him on that day.
  footnotes:
  - marker: a
    text: Or 'assembly' for 'congregation.'
    reason: lexical_alternative
  - marker: b
    text: '''Holy ones'' may denote the sanctified community, though in apocalyptic literature the term can also overlap with heavenly holy beings.'
    reason: lexical_alternative
  - marker: c
    text: Or 'shall be seen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 선택된 이들과 거룩한 이들의 회중이 뿌려질 것이며, 모든 선택된 이들이 그의 앞에 설 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘회중’은 ‘congregation’의 직역 가능성을 살린 표현이며, ‘모임’보다 집합체의 성격이 강합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거룩한 이들’은 인간 성도와 천상적 거룩한 존재 모두를 열어 두는 표현입니다.
    reason: theological_note
  - marker: c
    text: 이 동사는 ‘shall be seen’이 아니라 ‘shall be sown’으로 이해하는 것이 문맥과 어근에 부합합니다.
    reason: source_note
lexical_decisions:
- source_word: ወይዘራእ
