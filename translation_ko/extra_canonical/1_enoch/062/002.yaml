  verdict: revise
  source_fidelity: ‘만군의 주’는 원문의 እግዚእ መናፍስት(‘영들의 주’)와 다른 정착 칭호를 대입하므로 수정이 필요합니다. 또한 ዲቤሁ는 ‘그 위에’보다 사람을 가리키는 ‘그에게/그 위에’로 분명히 옮기는 편이 원문에 충실합니다. 사역 동사 ‘그를 … 앉히시고’와 미완료형 심판 서술은 대체로 잘 반영되었습니다.
  naturalness: ‘불법한 자들’은 현대 한국어에서 다소 부자연스럽고 법률적 의미로도 좁게 들릴 수 있어 ‘불법을 행하는 자들’로 다듬었습니다. ‘그의 입의 말’은 원문의 소유·신체 이미지를 보존하면서도 문어적 성경 번역 문맥에서 자연스럽습니다.
  terminology: 1에녹의 특유한 칭호는 번역 전통의 다른 칭호인 ‘만군의 주’로 기능적 치환하지 말고 ‘영들의 주’로 유지해야 합니다. መንፈሰ ጽድቅ은 교리적으로 특정하지 않은 ‘의의 영’이 적절하며, ‘성령’으로 바꾸지 않습니다.
  issues:
  - severity: high
    issue: ‘만군의 주’
    rationale: 원문은 문자적으로 ‘영들의 주’이며, ‘만군의 주’는 히브리 성경의 별도 칭호를 연상·대입합니다. 1에녹의 고유한 칭호와 원어의 어휘를 모두 흐립니다.
  - severity: medium
    issue: 각주 a의 기능적 치환 정당화
