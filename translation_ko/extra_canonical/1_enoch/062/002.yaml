  - severity: low
    issue: ‘그 위에 부어졌으며’의 지시 대상
    rationale: 한국어 ‘그 위’는 바로 앞의 ‘보좌’를 가리킬 여지가 있습니다. 원문의 남성 단수 목적어를 따라 ‘그에게’로 하면 대상은 명확해지되, 그 인물이 누구인지는 본문 문맥에 맡길 수 있습니다.
  - severity: low
