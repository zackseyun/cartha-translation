base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/002.yaml
  text: And the Lord of Spirits seated him on the throne of his glory[a], and the spirit of righteousness was poured out upon him, and the word of his mouth slays all the sinners[d][c][b], and all the lawless are destroyed from before his face.
  footnotes:
  - marker: a
    text: Or 'rested upon him' if the verb is taken less vividly; the Ethiopic wording naturally supports the stronger image 'was poured out upon him.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from before his face,' a judgment idiom for removal or destruction in the presence of the enthroned figure.
    reason: cultural_note
  - marker: c
    text: Or 'And the Lord of Spirits sat upon the throne of his glory'.
    reason: previous_rendering
  - marker: d
    text: Or 'put all the sinners to death, and all the lawless were destroyed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 영들의 주께서 그를 자기 영광의 보좌에 앉히시고, 의의 영이 그에게 부어졌으며, 그의 입의 말이 모든 죄인들을 죽이며, 모든 불법을 행하는 자들은 그의 얼굴 앞에서 멸망합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘그의 얼굴 앞에서’입니다. 이는 그의 현존 앞에서 제거되거나 멸망한다는 심판의 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: አንበረ
  english_pob_choice: seated him on the throne of his glory
  chosen_korean: 그를 영광의 보좌에 앉히시고
  alternatives_korean:
  - 그를 영광의 보좌에 앉게 하시고
  - 그를 영광의 보좌에 자리 잡게 하시고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈 동사 አንበረ는 사역적 의미로 ‘앉히다’가 정확하므로, 주어가 그를 보좌에 앉히시는 장면을 분명히 살렸습니다.
- source_word: እግዚእ መናፍስት
  english_pob_choice: Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영들의 주님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 칭호는 1에녹의 특유한 경배적 호칭으로, 한국어에서는 위엄과 군대적 총괄성을 드러내는 ‘만군의 주’가 가장 자연스럽고 기능적으로 가깝습니다.
- source_word: መንፈሰ ጽድቅ
  english_pob_choice: the spirit of righteousness
  chosen_korean: 의의 영
  alternatives_korean:
  - 의의 성령
  - 의로움의 영
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 결합어를 직역해 ‘영’을 유지했으며, 여기서는 삼위일체적 고정 용례가 아니라 의로움의 성격을 지닌 영으로 읽는 것이 소스에 더 충실합니다.
- source_word: ይቀትል / ይትሐጐሉ
  english_pob_choice: slays all the sinners / are destroyed
  chosen_korean: 모든 죄인들을 죽이고, 모든 불법한 자들은 ... 멸망합니다
  alternatives_korean:
  - 모든 죄인들을 죽이며, 모든 불법한 자들은 ... 멸망합니다
  - 모든 죄인들을 죽이고, 모든 불법한 자들은 ... 사라집니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사의 현재적/상시적 의미를 살려 심판의 효과를 현재형으로 옮겼으며, ‘멸망하다’는 형벌적 소멸의 뉘앙스를 유지합니다.
theological_decisions:
- issue: 보좌에 앉히는 주체와 ‘그’의 참조
  chosen_reading: 주체를 만군의 주로, ‘그’를 앞 절의 선택된 자로 두어 서술의 구별을 유지했습니다.
  alternative_readings:
  - ‘그’를 보좌 자체로 보는 읽기
  - 주체와 객체를 흐리게 처리하는 읽기
  rationale: 게으즈 원문과 EN POB의 개정 이력은 사역적 ‘앉히다’를 요구하므로, 왕위 부여의 주체와 수여 대상을 분리해 예언적 전위 장면을 보존했습니다.
  doctrine_reference: 본문 내 서술 관계 보존
- issue: ‘그의 얼굴 앞에서’의 심판 관용구
  chosen_reading: ‘그의 얼굴 앞에서’로 직역해 현존 앞의 추방/멸망이라는 심판 관용구를 살렸습니다.
  alternative_readings:
  - 그 앞에서
  - 그를 보지 못한 곳에서
  rationale: 게으즈어의 공간적-법정적 관용구를 완화하지 않고 유지해야 심판 장면의 위압성과 시적 평행법이 보존됩니다.
  doctrine_reference: 심판 관용구 보존
