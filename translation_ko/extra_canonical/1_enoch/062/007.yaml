base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/007.yaml
  text: For from the beginning the Son of Man was hidden[a], and the Most High kept him in the presence of his power[b], and revealed him to the chosen ones.
  footnotes:
  - marker: a
    text: Or 'before his power' or 'before his might.' The Ge'ez phrase is difficult, and this rendering keeps the imagery rather than smoothing it away.
    reason: lexical_alternative
  - marker: b
    text: Or 'before him'.
    reason: previous_rendering
translation:
  language: ko
  text: 처음부터[a] 인자는 숨겨져 있었고, 지극히 높으신 분께서는 그분의 권능 앞에서[b] 그를 지키셨으며, 택하신 이들에게 그를 나타내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 እምቅድሙ는 시간 부사로, ‘처음부터’ 또는 ‘시작부터’를 뜻합니다. 여기서는 공간적 ‘그 앞에서’로 읽지 않습니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그분의 권능 앞에서’입니다. 이 난해한 표현은 ‘권능’이라는 명사를 유지하여 관계적·공간적 이미지를 보존합니다. ‘그분 앞에서’로 이해할 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምቅድሙ
  english_pob_choice: from the beginning
  chosen_korean: 그 시작부터
  alternatives_korean:
  - 처음부터
  - 시작부터
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈어의 시간 부사로 읽어야 하므로, 공간적 ‘앞에서’가 아니라 시간적 선재성을 드러내는 ‘그 시작부터’로 옮겼습니다.
- source_word: ኅቡእ ኮነ
  english_pob_choice: was hidden
  chosen_korean: 숨겨져 있었고
  alternatives_korean:
  - 숨겨졌고
  - 감추어져 있었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구문은 상태적 숨김을 나타내므로, 단순 사건보다 지속 상태를 살린 ‘숨겨져 있었고’가 적절합니다.
- source_word: ልዑል
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님의 칭호로서 자연스럽고 공적 문체에 맞는 표현을 택했습니다. 한국어 교회어 ‘지극히 높으신 분’은 ‘Most High’의 존칭적 뉘앙스를 잘 살립니다.
- source_word: በቅድመ ኃይሉ
  english_pob_choice: in the presence of his power
  chosen_korean: 그의 권능의 앞에서
  alternatives_korean:
  - 그의 권능 앞에서
  - 그의 힘의 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구절은 난해하므로, POB의 이미지를 따라 공간적·관계적 긴장을 유지하는 쪽으로 옮겼습니다. ‘권능’은 단순한 힘보다 신적 능력을 더 잘 드러냅니다.
- source_word: ከሠቶ
  english_pob_choice: revealed him
  chosen_korean: 그를 나타내셨습니다
  alternatives_korean:
  - 그를 드러내셨습니다
  - 그를 보여 주셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 숨김과 대응되는 공개·계시의 뜻을 살리되, 한국어에서 예언적·묵시적 공개를 자연스럽게 표현하는 ‘나타내셨습니다’를 택했습니다.
theological_decisions:
- issue: “Son of Man”의 번역 방식
  chosen_reading: 인자
  alternative_readings:
  - 사람의 아들
  - 인자적 존재
  rationale: 이 구절은 묵시문학적 고유칭호로 기능하므로, 전통적이면서도 본문의 титular force를 살리는 ‘인자’를 유지했습니다. 다만 한국어 문장에서는 주어를 ‘인자’로 두어 칭호성을 분명히 했습니다.
  doctrine_reference: 본문 고유의 묵시적 칭호를 보존하고, 후대 기독론을 과잉 주입하지 않음.
- issue: ‘숨김’과 ‘계시’의 신학적 긴장
  chosen_reading: 숨겨져 있었고 ... 나타내셨습니다
  alternative_readings:
  - 영원 전부터 감추어졌고 ... 미리 보이셨습니다
  - 완전히 숨겨졌다가 ... 공개하셨습니다
  rationale: 본문은 선재적 숨김과 선택된 자들에게의 계시를 함께 말하므로, 이를 풀어 설명하기보다 긴장 자체를 유지하는 번역이 필요합니다.
  doctrine_reference: 묵시적 계시 구조를 보존하고 의미를 과도하게 확장하지 않음.
