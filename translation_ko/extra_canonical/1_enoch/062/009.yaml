base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/009.yaml
  text: And all the kings and the mighty and the exalted[a], and those who rule the dry land, shall fall down before him on their faces, and they shall bow down and set their hope on that Son of Man[c][b], and they shall petition him and seek mercy from him.
  footnotes:
  - marker: a
    text: Or 'those who govern the land.' The Ge'ez literally refers to ruling 'the dry land,' a concrete expression for terrestrial dominion.
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'bow down' may also be understood as 'do obeisance' or, in a stronger reading, 'worship.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and they shall petition him and seek mercy from him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 모든 왕들과 권세자들과 높임을 받은 자들과, 마른 땅을 다스리는 자들이 그 앞에서 얼굴을 땅에 대고 엎드릴 것이며, 그들은 그 인자에게 절하고 그에게 소망을 두며, 그에게 간청하고 그에게 긍휼을 구할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마른 땅’은 지상의 영역을 가리키는 보다 문자적인 표현입니다.
    reason: source_note
  - marker: b
    text: ‘절하다’는 여기서 예배로까지 갈 수 있는 경배의 뉘앙스를 포함합니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 ‘청하다/간청하다’와 ‘긍휼을 구하다’를 반복해, 청원의 강도를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: ነገሥት
  english_pob_choice: kings
  chosen_korean: 왕들
  alternatives_korean:
  - 통치자들
  - 임금들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본적인 정치 권력층을 가리키는 뜻이므로, 가장 직접적인 대응인 ‘왕들’을 살렸습니다.
- source_word: መዛዝእት
  english_pob_choice: the mighty
  chosen_korean: 권세자들
  alternatives_korean:
  - 강한 자들
  - 유력자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 힘보다 권력과 위세를 가진 자들을 가리키므로, 한국어에서 위계감을 드러내는 ‘권세자들’이 적절합니다.
- source_word: ልዑላን
  english_pob_choice: the exalted
  chosen_korean: 높임을 받은 자들
  alternatives_korean:
  - 높은 자들
  - 귀인들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 신분의 높음을 말하지만, 본문에서는 그 높음이 낮아지는 역설이 핵심이어서 ‘높임을 받은 자들’로 옮겨 그 뉘앙스를 드러냈습니다.
- source_word: እለ ይመልከዋ ለየብስ
  english_pob_choice: those who rule the dry land
  chosen_korean: 마른 땅을 다스리는 자들
  alternatives_korean:
  - 땅을 다스리는 자들
  - 그 땅을 지배하는 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지상의 영역을 가리키는 구체적 표현인 ‘마른 땅’을 유지해, 일반적인 ‘땅’으로 평탄화하지 않았습니다.
- source_word: ይሴፈዉ
  english_pob_choice: set their hope on
  chosen_korean: 소망을 두며
  alternatives_korean:
  - 기대하며
  - 바라며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대상을 향해 희망을 두는 방향성을 살리기 위해 ‘소망을 두다’로 옮겼습니다.
- source_word: ወልደ እጓለ እመሕያው
  english_pob_choice: that Son of Man
  chosen_korean: 그 인자
  alternatives_korean:
  - 그 사람의 아들
  - 그 인자 같은 분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구절에서는 종말론적 호칭으로 기능하므로, 본문 자체의 호칭성을 따라 ‘인자’를 유지했습니다.
- source_word: ይስእልዎ ወይስእሉ ኀቤሁ ምሕረተ
  english_pob_choice: they shall petition him and seek mercy from him
  chosen_korean: 그에게 간청하고 그에게 긍휼을 구할 것입니다
  alternatives_korean:
  - 그에게 청하고 그에게 자비를 구할 것입니다
  - 그에게 청원하고 그에게 긍휼을 청할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복된 청원 동작을 살리면서도 한국어 문장으로 자연스럽게 읽히도록 ‘간청하다’와 ‘긍휼을 구하다’를 사용했습니다.
theological_decisions:
- issue: ‘엎드리다/절하다’가 단순 예배인지 강제적 경배인지
  chosen_reading: ‘얼굴을 땅에 대고 엎드릴 것이다’와 ‘절하다’를 함께 두어, 강제적 굴복과 경의의 경계가 본문에 남도록 했습니다.
  alternative_readings:
  - ‘예배할 것이다’
  - ‘경배할 것이다’
  rationale: 게에즈 동사는 물리적 엎드림과 예를 모두 포함할 수 있으므로, 예배로 단정하지 않고 본문이 지닌 긴장을 유지했습니다.
  doctrine_reference: 본문의 경배 표현은 문맥에 따라 강제적 굴복과 존경의 의미를 함께 가질 수 있습니다.
