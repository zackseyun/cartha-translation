base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/001.yaml
  text: And thus the Lord commanded the kings and the mighty and the exalted[a], and those who dwell on the earth, and said, “Open your eyes and lift up your horns[b], if you are able to recognize the Chosen One.”
  footnotes:
  - marker: a
    text: '''Lift up your horns'' likely uses ''horns'' as an image of strength, status, or proud power; the translation keeps the image rather than replacing it with an abstract term.'
    reason: cultural_note
  - marker: b
    text: Or 'the Elect One.' The Ge'ez title is a formal designation in the Parables, not merely a descriptive adjective.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 주께서 왕들과 능한 자들과 높은 자들과 땅에 거하는 자들에게 명령하시며 말씀하십니다. "너희 눈을 뜨고 너희 뿔을 들어 올리십시오[a]. 너희가 택함 받은 이를 알아볼 수 있다면 말입니다[b]."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’을 그대로 살려 권세, 자만, 왕적 힘의 이미지를 보존했습니다.
    reason: cultural_note
  - marker: b
    text: 원문의 ሐሩይ는 단순한 형용사보다 ‘택함 받은 이’라는 공식적 칭호로 이해하는 것이 적절합니다.
    reason: lexical_alternative
