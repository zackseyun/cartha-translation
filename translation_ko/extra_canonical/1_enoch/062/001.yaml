review_pass:
  verdict: revise
  source_fidelity: 원문의 과거 서술(‘주께서 … 명령하시고 말씀하셨다’)과 명령의 조건절을 더 정확히 반영할 필요가 있습니다. ‘택함 받은 이’와 ‘뿔’의 이미지는 적절히 보존되었습니다.
  naturalness: 초안의 ‘명령하시며 말씀하십니다’는 과거 사건 서술 안에서 시제가 어색하고, ‘높은 자들’은 현대 한국어에서 다소 부자연스럽습니다. 조건절을 명령 앞에 두면 한국어 문장이 자연스럽고 의미도 유지됩니다.
  terminology: ‘주’, ‘왕들’, ‘뿔’, ‘택함 받은 이’는 본문과 묵시문학적 문체에 잘 맞습니다. ልዑላን은 단순히 신장이 높은 사람이 아니라 높은 지위의 사람들을 뜻하므로 이를 명시하는 편이 안전합니다.
  issues:
  - severity: medium
    issue: 서술 시제가 현재형으로 혼재됨
    rationale: 원문은 주께서 명령하고 말씀하신 과거 서술입니다. ‘명령하시며 말씀하십니다’ 대신 ‘명령하시고 말씀하셨습니다’가 원문과 한국어 문맥에 부합합니다.
  - severity: low
    issue: ‘높은 자들’의 의미가 모호하고 어색함
    rationale: ልዑላን은 높은 신분·지위의 사람들을 가리킵니다. ‘높은 지위에 있는 자들’이 의미를 더 정확하고 자연스럽게 전달합니다.
  - severity: low
    issue: 조건절의 한국어 표현
    rationale: ‘…할 수 있다면 말입니다’는 본문의 엄숙한 명령문에 비해 구어적이고 덧붙임처럼 들립니다. 조건절을 명령문 앞에 배치해 자연스럽게 처리할 수 있습니다.
  revised_text: 그리하여 주께서 왕들과 능한 자들과 높은 지위에 있는 자들과 땅에 사는 자들에게 명령하시고 말씀하셨습니다. “너희가 택함 받은 이를 알아볼 수 있다면, 너희 눈을 뜨고 너희 뿔을 들어 올리십시오[a].”
  revised_footnotes:
  - marker: a
    text: ‘뿔’은 권세, 위세, 또는 교만한 힘을 나타내는 이미지일 수 있습니다. 번역은 이 상징적 이미지를 추상화하지 않고 그대로 살렸습니다.
    reason: cultural_note
  - marker: b
    text: 원문의 ሐሩይ는 단순한 형용사라기보다 ‘택함 받은 이’라는 공식적 칭호로 이해될 수 있습니다. 또는 ‘선택된 이’.
    reason: lexical_alternative
  revision_rationale: 과거 서술 시제를 바로잡고, 사회적 지위를 뜻하는 표현을 명확히 했으며, 조건절을 자연스러운 현대 한국어 합쇼체 명령문으로 재구성했습니다. ‘뿔’의 문자적 상징과 ‘택함 받은 이’의 칭호성은 유지했습니다. 선택지 각주는 해당 표현에 직접 표지되지 않았으므로 독자의 혼동을 피하기 위해 제공하지 않습니다.
