  english_pob_choice: their faces will be filled with shame ... and darkness will be added to their faces
  chosen_korean: 그들의 얼굴은 수치로 가득할 것이고, 어둠이 그들의 얼굴에 더해질 것입니다
  alternatives_korean:
  - 그들의 얼굴은 수치로 채워질 것이고, 어둠이 그들의 얼굴에 덧입혀질 것입니다
  - 그들의 얼굴에는 수치가 가득하고, 어둠이 그 위에 더해질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 절은 얼굴-수치의 공개적 모욕 이미지를 살리고, 마지막 절은 ተወሰከ의 의미에 맞춰 '더해질'로 옮겨 축적되는 어둠을 유지했습니다.
theological_decisions:
- issue: 심판 장면의 anthropomorphic 표현 보존
  chosen_reading: '''그의 얼굴 앞에서''와 ''그들의 얼굴''을 그대로 살려, 추상적인 ''임재''나 ''수치감''으로 완화하지 않았습니다.'
  alternative_readings:
  - '''그의 임재 앞에서'''
  - '''그들의 얼굴에는 수치가 가득할 것이다'''
  rationale: 본문은 얼굴/대면/얼굴-수치의 연쇄를 통해 공개 재판의 수치를 그리므로, 종말론적 시각 이미지를 그대로 유지하는 것이 원문 이해에 유리합니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic imagery; original-language primacy over smoothing.'
