base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/010.yaml
  text: And the Lord of Spirits will drive them so that they hasten and go out from before his face[a], and their faces will be filled with shame[c][b], and darkness will be added to their faces.
  footnotes:
  - marker: a
    text: Or 'from his presence.' The Ge'ez reads more literally, 'from before his face.'
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be rendered 'darkness will be added to their faces.' The image is of shame intensified by judicial gloom.
    reason: lexical_alternative
  - marker: c
    text: Or 'darkness will be piled upon their faces.'.
    reason: previous_rendering
translation:
  language: ko
  text: 만군의 주, 영들의 주께서 그들을 몰아내시어 그들이 급히 나가 그의 얼굴 앞에서 물러가게 하실 것이며, 그들의 얼굴은 수치로 가득할 것이고, 어둠이 그들의 얼굴에 더해질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 얼굴 앞에서’는 문자적으로 ‘그의 얼굴 앞에서’이며, 영어 POB의 ‘from his presence’는 완화된 의미역입니다.
    reason: source_note
  - marker: b
    text: ‘어둠이 그들의 얼굴에 더해질 것입니다’는 수치와 함께 심판의 음울함이 누적되는 이미지를 반영합니다.
    reason: theological_note
lexical_decisions:
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 영들의 주
  alternatives_korean:
  - 영들의 주님
  - 영들의 주재
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 고유한 종말론적 칭호를 살리기 위해 직역적으로 옮겼습니다. '주님'보다 '주'가 칭호의 고정성을 더 분명히 드러냅니다.
- source_word: ይጐጕኦሙ
  english_pob_choice: will drive them on
  chosen_korean: 그들을 몰아내시어
  alternatives_korean:
  - 그들을 몰아가시어
  - 그들을 재촉하시어
  - 그들을 몰아붙이시어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 강제적으로 내몰리는 동작을 보이므로, 단순한 재촉보다 '몰아내시어'가 심판 장면의 압박감을 더 잘 살립니다.
- source_word: እምቅድመ ገጹ
  english_pob_choice: from before his face
  chosen_korean: 그의 얼굴 앞에서
  alternatives_korean:
  - 그의 임재 앞에서
  - 그의 얼굴 앞을 떠나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 '얼굴' 이미지를 보존하여, 추상화된 '임재'로 완화하지 않았습니다. courtly한 대면의 뉘앙스를 유지합니다.
- source_word: ገጾሙ ይመልእ ኃፍረተ / ጽልመት ይትዌሰክ ገጾሙ
  english_pob_choice: their faces will be filled with shame ... and darkness will be added to their faces
  chosen_korean: 그들의 얼굴은 수치로 가득할 것이고, 어둠이 그들의 얼굴에 더해질 것입니다
  alternatives_korean:
  - 그들의 얼굴은 수치로 채워질 것이고, 어둠이 그들의 얼굴에 덧입혀질 것입니다
  - 그들의 얼굴에는 수치가 가득하고, 어둠이 그 위에 더해질 것입니다
