base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/003.yaml
  text: And in that day all the kings and the mighty and the exalted[a], and those who possess the earth, shall stand up, and they shall see and recognize that he sits on the throne of his glory; and righteousness shall be judged before him[b], and no lying word shall be spoken before him.
  footnotes:
  - marker: a
    text: Or 'those who possess the earth' or 'those who rule the land/world.' The Ge'ez verb can denote holding, possessing, or exercising control.
    reason: lexical_alternative
  - marker: b
    text: The clause 'and righteousness shall be judged before him' is textually and syntactically difficult in the Ethiopic. The translation keeps the judicial sense of the wording rather than smoothing it into a more familiar expression.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그날에는 모든 왕들과 강한 자들과 높임을 받은 자들, 그리고 땅을 소유한 자들이 일어서서, 그분이 자기 영광의 보좌에 앉아 계신 것을 보고 알아보게 될 것입니다. 그리고 의가 그분 앞에서 심판을 받을 것이며, 그분 앞에서는 거짓된 말이 하나도 전해지지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅을 소유한 자들’로 옮긴 표현은 지배, 점유, 소유의 뜻을 모두 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의가 그분 앞에서 심판을 받을 것이며’는 에티오피아어 본문이 난해한 구문을 지닌 부분을 가능한 한 그대로 살린 번역입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ወይቀውሙ
  english_pob_choice: shall stand up
  chosen_korean: 일어서서
  alternatives_korean:
  - 서게 될 것입니다
  - 일어나게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 재판 장면의 육체적·공적 동작을 살리면서도, 부활로 단정하지 않기 위해 ‘일어서다’로 옮겼습니다.
- source_word: ኵሎሙ ነገሥት ወዐዚዛን ወልዑላን
  english_pob_choice: all the kings and the mighty and the exalted
  chosen_korean: 모든 왕들과 강한 자들과 높임을 받은 자들
  alternatives_korean:
  - 모든 왕들과 권세자들과 높은 자들
  - 모든 왕들과 ძლ력한 자들과 높은 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세 부류의 지배 엘리트를 점층적으로 구분해 주기 위해 ‘강한 자들’, ‘높임을 받은 자들’로 구별했습니다.
- source_word: ወእለ ይእኅዝዋ ለምድር
  english_pob_choice: and those who hold the earth
  chosen_korean: 그리고 땅을 소유한 자들
  alternatives_korean:
  - 그리고 땅을 가진 자들
  - 그리고 땅을 지배한 자들
  - 그리고 땅을 붙든 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지닌다/붙든다/다스린다의 여지가 있으나, 문맥상 세계에 대한 지배·점유를 폭넓게 가리키므로 ‘소유한 자들’이 가장 무난했습니다.
- source_word: ወይሬእይዎ ወያአምርዎ
  english_pob_choice: they shall see and recognize
  chosen_korean: 보고 알아보게 될 것입니다
  alternatives_korean:
  - 보고 알게 될 것입니다
  - 보고 인식하게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 시각 인식보다 ‘그가 누구인지 알아봄’까지 포함하는 동사쌍이므로 ‘알아보다’로 옮겼습니다.
- source_word: ወጽድቅ ቅድሜሁ ይትኴነን
  english_pob_choice: and righteousness shall be judged before him
  chosen_korean: 그리고 의가 그분 앞에서 심판을 받을 것이며
  alternatives_korean:
  - 그리고 의가 그분 앞에서 판결될 것이며
  - 그리고 의가 그분 앞에서 판단될 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문이 문법적으로 कठिन하고 POB도 법정적 의미를 유지하므로, ‘의’를 주어로 두고 ‘심판을 받다’로 옮겨 난점을 드러냈습니다.
theological_decisions:
- issue: 의가 ‘심판을 받는다’는 난해한 구절 처리
  chosen_reading: 문장을 매끈하게 바꾸지 않고, ‘의가 그분 앞에서 심판을 받을 것이며’로 난점을 보존했습니다.
  alternative_readings:
  - ‘의로운 판결이 그분 앞에 있을 것입니다’로 완화
  - ‘의가 그분 앞에 세워질 것입니다’로 해석
  rationale: 에티오피아어 본문의 문법·의미적 난점을 제거하지 않고 드러내는 것이 POB의 원칙에 맞습니다.
  doctrine_reference: 텍스트 난점 보존
- issue: 그분의 정체성
  chosen_reading: 지시 대명사 ‘그분’을 유지해, 앞문맥의 칭호를 여기서 임의로 다시 명시하지 않았습니다.
  alternative_readings:
  - ‘인자’로 명시
  - ‘만군의 주’로 명시
  rationale: 이 절 자체는 대명사로 진행하며, 현지 문구가 정체성을 재진술하지 않으므로 문맥의 긴장을 유지했습니다.
  doctrine_reference: 문맥적 모호성 보존
