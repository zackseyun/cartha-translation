  - 영광 돌리다
  - 칭송하다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 도식적으로 ‘bless and praise and exalt’의 병렬을 유지하면서, 예배 문맥에서 가장 자연스러운 표준어인 ‘찬양하다’를 택했습니다.
- source_word: የልዕልዎ
  english_pob_choice: exalt him
  chosen_korean: 높이다
  alternatives_korean:
  - 들어 높이다
  - 숭상하다
  - 영화롭게 하다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 ‘높이다/들어 올리다’ 의미를 직역에 가깝게 살리되, 현대 한국어에서 이해가 분명한 ‘높이다’를 사용했습니다.
- source_word: ኵሎሙ እለ ይእሕዝዋ ለምድር
  english_pob_choice: all who possess the earth
  chosen_korean: 땅을 소유한 모든 자들
  alternatives_korean:
  - 땅을 차지한 모든 자들
  - 땅을 붙든 모든 자들
  - 땅을 다스리는 모든 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 기본 의미가 ‘붙들다/소유하다’이므로, 영어 POB의 선택을 따라 ‘소유한’으로 옮겨 지배층의 현실적 소유 관계를 분명히 했습니다.
- source_word: ለዘይመልክ ኵሎ ዘኅቡእ
  english_pob_choice: him who rules over all that is hidden
  chosen_korean: 그는 숨겨진 모든 것을 다스리십니다
  alternatives_korean:
  - 그는 감추어진 모든 것을 다스리십니다
  - 그는 모든 숨은 것 위에 군림하십니다
  - 그는 모든 비밀을 다스리십니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 명시적 호칭 없이 상대적인 서술로 대상을 설명하므로, POB처럼 인물을 특정하지 않고 서술을 유지했습니다. ‘숨겨진 모든 것’은 ‘secrets’로 좁히지 않고 원문의 넓은 범위를 보존합니다.
theological_decisions:
- issue: ‘him who rules over all that is hidden’의 지시 대상
  chosen_reading: 주어를 본문 밖에서 특정하지 않고, 서술적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 주(主)님
  - 영들의 주
  - 인자/택함받은 이
  rationale: 에녹서의 해당 문맥은 여러 고양된 인물을 함께 암시할 수 있으므로, 본문이 주지 않는 호칭을 덧붙이지 않아 해석적 긴장을 보존했습니다.
  doctrine_reference: 본문이 제공하는 범위 안에서만 식별을 제한하는 원칙
- issue: ‘찬복하다’의 사용
  chosen_reading: 예배적 축복 응답을 위해 ‘찬복하다’를 사용했습니다.
  alternative_readings:
  - 축복하다
  - 복을 빌다
  rationale: 단순 상호 축복보다 상위 권세 앞에서의 찬미와 경배를 나타내는 표현이므로, 한국어에서 의미가 덜 흐려지는 방향으로 선택했습니다.
  doctrine_reference: 경배적 동작의 방향성 보존
