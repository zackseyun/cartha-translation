base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
  footnotes:
  - marker: a
    text: Or 'all who hold the earth.' The Ge'ez verb can denote holding or possessing; in context it likely refers to those who exercise earthly power.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'him who rules over all that is hidden' is left descriptive because the verse does not supply an explicit title for the figure.
    reason: alternative_reading
translation:
  language: ko
  text: 또한 왕들과 권세자들과 땅을 소유한 모든 자들은 그를 찬복하고 찬양하며 높일 것입니다. 그는 숨겨진 모든 것을 다스리십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅을 붙든 모든 자들’. 게에즈 동사는 붙들다 또는 소유하다의 뜻을 가질 수 있으며, 문맥상 지상의 권세를 행사하는 자들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숨겨진 모든 것을 다스리는 이’는 본문이 명시적 호칭을 주지 않으므로 설명적으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ይባርክዎ
  english_pob_choice: shall bless
  chosen_korean: 찬복하다
  alternatives_korean:
  - 축복하다
  - 복을 빌다
  - 찬송하다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 예배적·경배적 응답이므로 단순한 ‘축복하다’보다 신적 대상을 향한 찬미의 뉘앙스를 살린 ‘찬복하다’가 적절합니다.
- source_word: ይሴብሕዎ
  english_pob_choice: praise
  chosen_korean: 찬양하다
  alternatives_korean:
