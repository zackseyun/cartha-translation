base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
  footnotes:
  - marker: a
    text: Or 'all who hold the earth.' The Ge'ez verb can denote holding or possessing; in context it likely refers to those who exercise earthly power.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'him who rules over all that is hidden' is left descriptive because the verse does not supply an explicit title for the figure.
    reason: alternative_reading
translation:
  language: ko
  text: 또 왕들과 권세자들과 땅을 소유한[a] 모든 이들이 숨겨진 모든 것을 다스리시는 분을[b] 송축하고 찬양하며 높일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅을 붙든 모든 이들’. 게에즈 동사는 ‘붙들다’ 또는 ‘소유하다’를 뜻할 수 있으며, 문맥상 지상의 권세를 행사하는 자들을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘숨겨진 모든 것을 다스리시는 분’은 본문이 명시적인 호칭을 제시하지 않으므로 서술적으로 옮겼습니다.
    reason: alternative_reading
