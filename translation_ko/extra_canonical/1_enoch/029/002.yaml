    reason: source_note
  - marker: b
    text: 마지막 구절은 본문이 불완전하여, 뒤에 추가적인 나무들을 가리키는지 분명하지 않습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘향나무들, 곧 유향과 몰약의 향기로 향기로운 나무들이 있었고, 나무들도 있었습니다’로도 옮길 수 있습니다.
