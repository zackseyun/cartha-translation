base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/001.yaml
  text: And from there I went into another place[a], away from the wilderness[c][b]; and I drew near to the east of this mountain.
  footnotes:
  - marker: a
    text: The Ge'ez phrase literally refers to the direction of morning or sunrise; hence 'east.'
    reason: lexical_alternative
  - marker: b
    text: The term rendered 'wilderness' may also be understood as 'desert' or a barren region.
    reason: lexical_alternative
  - marker: c
    text: Or 'and I drew near to this mountain on the east.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그곳에서 나는 광야에서 멀리 떨어진 다른 곳으로 갔고, 이 산의 동쪽에 가까이 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어의 해당 표현은 문자적으로 ‘아침’ 또는 ‘해돋이의 방향’을 가리키며, 곧 동쪽을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘광야’는 ‘사막’ 또는 황량한 지역으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이 산의 동쪽으로 가까이 갔습니다’로 옮길 수 있습니다.
    reason: previous_rendering
