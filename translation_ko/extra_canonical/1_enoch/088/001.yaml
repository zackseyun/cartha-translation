theological_decisions:
- issue: 별을 인간적/천상적 존재로 직접 풀어쓸지 여부
  chosen_reading: 본문에서는 ‘별’을 유지하고, 손과 발의 결박을 통해 인격적 존재라는 함의를 남겼습니다.
  alternative_readings:
  - ‘천사’로 직접 번역하기
  - 남성 인칭 대명사로 인격화를 전면화하기
  rationale: Animal Apocalypse의 상징 체계를 번역이 해석으로 대체하지 않도록, 원문의 상징어를 그대로 보존했습니다.
  doctrine_reference: '원문 우선 원칙: 상징을 번역 단계에서 해석으로 해소하지 않음'
