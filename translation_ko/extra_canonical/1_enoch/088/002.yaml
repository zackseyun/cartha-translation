  text: And one of them drew a sword and gave it to those elephants and camels and donkeys[a], and they began to strike one another.
  footnotes:
  - marker: a
    text: The Ethiopic wording at the end is difficult. The sense is that, after receiving the sword, these animals turned to mutual violence; 'began to strike one another' is a cautious rendering.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그들 가운데 한 명이 칼을 뽑아 그 코끼리들과 낙타들과 당나귀들에게 주니, 그들이 서로를 치기 시작했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 표현은 게즈어 원문이 난해하므로, 여기서는 ‘서로를 치기 시작했습니다’로 조심스럽게 옮겼습니다.
    reason: textual_variant
