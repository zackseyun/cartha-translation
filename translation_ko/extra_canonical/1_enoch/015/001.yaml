  - 의의 필경사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘서기관’은 기록자이자 계시 전달자의 직함을 유지하고, 속격 관계는 ‘의의’로 직역해 원문의 문학적·신학적 결합을 보존했습니다.
- source_word: ቅረብ ዝየ
  english_pob_choice: Come near here
  chosen_korean: 여기로 가까이 오십시오
  alternatives_korean:
  - 이리 가까이 오십시오
  - 여기로 오십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령형과 지시 부사를 함께 살려 접근의 동작과 위치를 모두 드러냈습니다. 계시적 권위가 있는 직접 명령이므로 합쇼체 명령으로 옮겼습니다.
