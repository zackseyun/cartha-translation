base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/001.yaml
  text: 'And he answered me and said to me[a], and I heard: “Do not fear, Enoch, righteous man and scribe of righteousness. Come near here and hear my word.”'
  footnotes:
  - marker: a
    text: The Ethiopic text appears to repeat the verb 'hear' ('and I heard, I heard'). The English compresses the repetition for readability while preserving the sense of auditory reception before the direct speech.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내게 응답하여 내게 말했고, 내가 들었습니다. “두려워하지 마십시오, 에녹아, 의로운 사람이며 의의 서기관이여. 여기로 가까이 오십시오. 그리고 내 말을 들으십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈어 본문은 ‘그리고 내가 들었다’를 반복하는 듯한 형식을 보이지만, 한국어 본문에서는 직접화법의 개시를 위해 자연스럽게 압축했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ / ወይቤለኒ
  english_pob_choice: he answered me and said to me
  chosen_korean: 내게 응답하여 내게 말했고
  alternatives_korean:
  - 내게 대답하여 내게 말했고
  - 내게 응답하여 내게 이르렀고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사 모두 대화적 응답 공식을 이루므로, 한국어에서도 반복을 살려 ‘응답하여…말했고’로 옮겨 장중한 계시 대화의 흐름을 보존했습니다.
- source_word: ወሰምኩ፡ ሰማዕኩ
  english_pob_choice: and I heard
  chosen_korean: 내가 들었습니다
  alternatives_korean:
  - 그리고 내가 들었습니다
  - 내가 들었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 히브리·에티오피아식 중복 청취 표현은 한국어에서 과도하게 반복하지 않고 자연스럽게 압축하되, 뒤의 직접 화법으로 이어지는 청각적 수용을 살렸습니다.
- source_word: ብእሲ፡ ጻድቅ
  english_pob_choice: righteous man
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의인
  - 의로운 자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘righteous’의 핵심 의미를 살리면서도 1인칭 호칭문맥에서 자연스러운 한국어로 옮겼습니다. ‘의인’도 가능하지만, 뒤의 호칭과 병렬될 때 더 구어적으로 읽히는 ‘의로운 사람’을 택했습니다.
- source_word: ጻሓፊ፡ ጽድቅ
  english_pob_choice: scribe of righteousness
  chosen_korean: 의의 서기관
  alternatives_korean:
