  - 이런 까닭에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞선 진술에 대한 설명을 여는 인과 접속어로, 한국어에서는 간결한 ‘그러므로’가 가장 자연스럽고 문맥의 논리도 잘 드러냅니다.
- source_word: ወሀብክዎሙ
  english_pob_choice: I gave them
  chosen_korean: 내가 그들에게 ... 주어
