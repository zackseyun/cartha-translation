base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
  footnotes:
  - marker: a
    text: Literally, 'sow seed upon them.' The Ge'ez preserves a procreative metaphor drawn from sowing.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult. The sense appears to be that earthly life and activity would continue in the appointed way through procreation.
    reason: textual_variant
translation:
  language: ko
  text: 그러므로 내가 그들에게 여자들을 주었습니다. 그들이 그 여자들에게 씨를 뿌리고[a] 그 여자들에게서 자녀가 태어나게 하여, 이와 같이 땅 위에서 어떤 일도 그들에게 부족하지 않게 하려는 것이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 여자들에게 씨를 뿌리다’입니다. 게에즈 본문은 생식을 농경의 비유로 표현합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 난해합니다. 땅 위의 삶과 활동이 출산을 통하여 정해진 질서 안에서 계속되게 하려는 뜻으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
