base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
  footnotes:
  - marker: a
    text: Literally, 'sow seed upon them.' The Ge'ez preserves a procreative metaphor drawn from sowing.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult. The sense appears to be that earthly life and activity would continue in the appointed way through procreation.
    reason: textual_variant
translation:
  language: ko
  text: 그러므로 내가 그들에게 여자를 주어, 그들로 하여금 그들에게 씨를 뿌리고, 그들에게서 자녀가 태어나게 하였으니[a], 이리하여 땅 위에서 어떤 일도 그들에게 빠지지 않게 하려 함이었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들에게 씨를 뿌리다’입니다. 게에즈는 단순한 번식 표현보다 농경적 은유를 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 난해합니다. 뜻은 땅의 삶과 활동이 정해진 방식대로 계속되게 하려는 것으로 보입니다.
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 이런 까닭에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞선 진술에 대한 설명을 여는 인과 접속어로, 한국어에서는 간결한 ‘그러므로’가 가장 자연스럽고 문맥의 논리도 잘 드러냅니다.
- source_word: ወሀብክዎሙ
  english_pob_choice: I gave them
  chosen_korean: 내가 그들에게 ... 주어
  alternatives_korean:
  - 내가 그들에게 ... 주었으니
  - 내가 그들에게 ... 주었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접적인 신적 화법의 1인칭 과거를 살리되, 뒤따르는 목적절과 연결되도록 ‘주어’로 처리해 문장 흐름을 매끄럽게 했습니다.
- source_word: አንስቲያ
  english_pob_choice: women
  chosen_korean: 여자
  alternatives_korean:
  - 여인
  - 여성
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원어는 성별을 나타내는 일반 명사로서 혼인 상태를 특정하지 않으므로, ‘아내들’보다 넓은 ‘여자’가 소스에 더 충실합니다.
- source_word: ከመ ይዝርኡ
  english_pob_choice: so that they might sow seed
  chosen_korean: 그들로 하여금 그들에게 씨를 뿌리고
  alternatives_korean:
  - 그들로 하여금 씨를 뿌리게 하고
  - 그들이 그들 안에 씨를 뿌리게 하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 농경적·생식적 은유를 보존하기 위해 평이한 ‘낳다’로 바꾸지 않고 ‘씨를 뿌리다’를 유지했습니다.
- source_word: ወይትወለዱ ውሉደ በላዕሌሆን
  english_pob_choice: and offspring might be born to them
  chosen_korean: 그들에게서 자녀가 태어나게 하였으니
  alternatives_korean:
  - 그들에게서 후손이 나게 하였으니
  - 그들로부터 자녀가 나게 하였으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘자녀’는 ውሉደ의 넓은 의미를 자연스럽게 담고, ‘태어나게 하다’는 수동적 탄생의 뉘앙스를 분명히 합니다.
- source_word: ኢይትኀጐ ግብር
  english_pob_choice: no work ... might be lacking
  chosen_korean: 어떤 일도 ... 빠지지 않게
  alternatives_korean:
  - 어떤 일도 ... 모자라지 않게
  - 어떤 일도 ... 부족하지 않게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ግብር의 폭넓은 뜻(일/행위/일거리)을 살리면서도 문맥상 ‘땅 위의 삶과 활동’이 이어지게 하려면 ‘일’이 가장 무난합니다.
theological_decisions:
- issue: 여자를 주신 목적의 해석
  chosen_reading: 이 구절은 땅의 피조물에게는 출산과 계속되는 삶의 질서가 있다는 점을 설명하며, 그 질서를 보전하려는 의도를 드러냅니다.
  alternative_readings:
  - 혼인 제도만을 말하는 진술
  - 타락 이후의 소극적 허용을 말하는 진술
  rationale: 문맥상 핵심은 ‘씨를 뿌림’과 ‘태어남’을 통해 땅의 삶이 계속되게 하는 데 있으므로, 그 질서를 분명히 드러내되 과도하게 축소하지 않았습니다.
  doctrine_reference: 문맥의 신학적 긴장을 해소하지 말고, 본문이 말하는 창조 질서를 우선 드러냅니다.
