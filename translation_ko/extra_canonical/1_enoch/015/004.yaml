theological_decisions:
- issue: 원문의 세 번 반복되는 피/육 이미지와 천상 존재에서 인간적 출생으로의 전이를 어떻게 살릴 것인가
  chosen_reading: ‘여자들과 함께 자신을 더럽혔고’, ‘육의 피로 자녀를 낳았으며’, ‘사람의 피를 원하였고’, ‘그들이 하듯이 행하여’의 구조를 유지해, 타락이 혈육적 생성과 욕망으로 내려앉는 흐름이 보이게 했습니다.
  alternative_readings:
  - 더 매끈하게 ‘인간처럼 욕망하고 행동했다’로 통합할 수 있습니다.
  - ‘육과 피’를 ‘혈육’으로 바꿔 더 익숙하게 만들 수 있습니다.
  rationale: 이 절의 신학적 요지는 경계 침범과 육체화의 타락이므로, 반복되는 ‘피’와 ‘육’의 압력을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 의미 보존 우선; 본문이 의도한 존재론적 대비를 완화하지 않음.
