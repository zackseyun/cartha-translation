review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘사람의 피’를 유지한 점과 육/피의 대조를 살리려 한 점은 좋습니다. 그러나 원문의 마지막 구문은 ‘그들이 하듯이 행하다’에서 끝나지 않고 그 결과로 ‘육과 피’를 만들었다는 뜻을 이어 갑니다. 초안의 ‘행하여—죽고 멸망하는 육과 피를 낳았습니다’는 행위와 산출의 관계 및 마지막 관계절의 수식을 다소 불명료하게 만듭니다. 또한 첫 구절의 난해한 독법은 본문상 ‘여자들과 함께’로 단정하기보다 ‘여자들의 피로’라는 독법을 본문에 반영하고, 이문 가능성을 주석으로 밝혀 반복되는 ‘피’를 보존하는 편이 안전합니다.
  naturalness: ‘거룩한 영적인 존재들’은 한국어에서 형용사가 중첩되어 다소 무겁습니다. ‘거룩하고 영적인 존재들’이 자연스럽습니다. ‘육의 피’는 직역의 장점이 있으나 현대 한국어에서는 뜻이 불투명하므로 ‘육체의 피’로 옮기는 것이 의미를 보존하면서 더 명료합니다. ‘만들어 냈습니다’를 사용하면 원문의 동사와 한국어 문장 구조가 모두 분명해집니다.
  terminology: ‘영적인 존재들’, ‘영원한 생명’, ‘피’, ‘육체’는 문맥에 적절합니다. ‘육과 피’는 원문의 어순과 반복을 보존하므로 유지하되, 마지막 절은 이것이 죽고 멸망하는 인간적 존재를 가리킨다는 점을 문장 안에서 명확히 했습니다.
  issues:
  - severity: high
    issue: 마지막 절의 통사 및 의미가 불명료합니다.
    rationale: 원문은 ‘그들이 하듯이’와 ‘육과 피를 만들다’를 연결합니다. 초안은 대시 뒤에 ‘낳았습니다’를 배치하여 ‘그들이 하듯이 행하여’와 ‘육과 피’의 관계를 흐리고, 원문의 ‘만들다’와도 거리가 생깁니다.
  - severity: medium
    issue: 첫 번째 난해한 ‘피’ 독법이 본문에서 탈락했습니다.
    rationale: 제시된 게에즈 본문은 훼손/이문 표지가 있으나 ‘여자들의 피’로 읽는 전승을 지지하며, 이 절의 반복되는 피의 어휘를 보존합니다. 이 독법은 주석으로 이문 가능성을 밝혀 단정성을 피할 수 있습니다.
  - severity: low
    issue: ‘육의 피’가 현대 한국어에서 불투명합니다.
    rationale: ‘육체의 피’는 원문의 육/피 이미지를 삭제하지 않으면서도 자연스럽고 이해하기 쉽습니다.
  revised_text: 그러나 여러분은 거룩하고 영적인 존재들로서 영원한 생명을 살고 있었습니다. 그러나 여러분은 여자들의 피로[a] 자신을 더럽혔고, 육체의 피로 자녀를 낳았으며, 사람들의 피를 원하였습니다. 또 여러분은 그들이 하듯이, 죽고 멸망하는 육과 피를 만들어 냈습니다.[b]
  revised_footnotes:
  - marker: a
    text: 본문의 이 난해한 구절은 ‘여자들과 함께 자신을 더럽혔다’로도 옮길 수 있습니다. 현 번역은 반복되는 ‘피’의 표현을 보존하는 독법을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 마지막 구절은 직역하면 ‘육과 피, 곧 죽고 멸망하는 것들’입니다. 마지막 동사의 정확한 뉘앙스는 확정하기 어렵기에 ‘멸망하는’은 ‘사라지는’ 또는 ‘파괴되는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여자들과 함께 자신을 더럽혔고, 육체의 피로 자녀를 낳았으며, 사람들의 피를 원하였고, 그들이 하듯이 행하였다’로 옮길 수 있습니다. 이 번역은 마지막의 ‘육과 피’를 별도의 결과 구문으로 보지 않는 해석을 반영합니다.
    reason: previous_rendering
  revision_rationale: 원문과 영어 감사 기록이 지적한 피의 반복 및 마지막 구문의 ‘만들다’ 의미를 한국어 본문에 반영했습니다. 첫 구절의 훼손되었거나 논쟁적인 독법은 한 가지 해석을 교리적으로 확정하지 않도록 이문 주석을 덧붙였습니다. 모든 각주 표지는 본문 또는 각주 세트에서 유효하게 유지했습니다.
