base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/004.yaml
  text: But you were holy[a], spiritual beings, living eternal life. But you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired the blood of men, and you did as they do[c][b], producing flesh and blood—those who die and perish.
  footnotes:
  - marker: a
    text: The Ge'ez repeatedly emphasizes blood and flesh, underscoring the Watchers' unlawful move from spiritual existence into mortal, bodily generation and desire.
    reason: cultural_note
  - marker: b
    text: The final clause may also be rendered 'those who die and are destroyed'; the exact nuance of the last verb is difficult, but it clearly marks human mortality and ruin.
    reason: lexical_alternative
  - marker: c
    text: Or 'Yet you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired blood and flesh as humans do, and you acted as they act'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 여러분은 거룩한[a], 영적인 존재들로서 영원한 생명을 살고 있었습니다. 그런데 여러분은 여자들과 함께 자신을 더럽혔고, 육의 피로 자녀를 낳았으며, 사람의 피를 원하였고, 그들이 하듯이 행하여[c][b]—죽고 멸망하는 육과 피를 낳았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 거룩함과 영적 존재성을 함께 강조합니다.
    reason: source_note
  - marker: b
    text: 마지막 구절은 ‘죽고 멸망하는 자들’로도 옮길 수 있으며, 마지막 동사의 정확한 뉘앙스는 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘여자들과 함께 자신을 더럽혔고, 육의 피로 자녀를 낳았으며, 사람처럼 피와 육을 원하였고, 그들이 하는 대로 행하였다’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ቅዱሳን
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 거룩한 존재들
  lexicon: Dillmann
  rationale: 형용사적 술어로서의 ‘holy’를 살리되, 문맥상 존재를 가리키는 점은 뒤의 영적인 존재들로 충분히 드러나게 했습니다.
- source_word: መንፈሳውያን
  english_pob_choice: spiritual beings
  chosen_korean: 영적인 존재들
  alternatives_korean:
  - 영들
  - 영적인 자들
  lexicon: Dillmann
  rationale: 단순한 형용사 ‘영적인’만으로는 인격적 존재를 놓치기 쉬워, ‘존재들’을 보충해 원문이 말하는 비육체적 존재라는 뜻을 드러냈습니다.
- source_word: በደቡ አንስት
  english_pob_choice: you defiled yourselves with women
  chosen_korean: 여자들과 함께 자신을 더럽혔고
  alternatives_korean:
  - 여자들과 함께 스스로를 더럽혔고
  - 여자들로 말미암아 자신을 더럽혔고
  lexicon: Dillmann
  rationale: 원문의 부정·불법 결합을 자연스러운 한국어로 옮기기 위해 ‘자신을 더럽혔고’를 택했고, 관계의 대상은 ‘여자들과 함께’로 직역하지 않되 의미를 보존했습니다.
- source_word: ወገበርክሙ ከመ እሙንቱ ይገብሩ
  english_pob_choice: you did as they do
  chosen_korean: 그들이 하듯이 행하여
  alternatives_korean:
  - 그들이 하는 대로 행하여
  - 그들처럼 행하여
  lexicon: Dillmann
  rationale: 반복되는 ‘행하다’ 동사를 살려 인간의 방식에 맞춰 모방했다는 점을 드러냈습니다.
- source_word: ሥጋ ወደመ
  english_pob_choice: flesh and blood
  chosen_korean: 육과 피
  alternatives_korean:
  - 혈육
  - 살과 피
  lexicon: Dillmann
  rationale: 원문이 강조하는 물질성과 유한성을 유지하기 위해 관용적 ‘혈육’보다 덜 완화된 ‘육과 피’를 택했습니다.
theological_decisions:
- issue: 원문의 세 번 반복되는 피/육 이미지와 천상 존재에서 인간적 출생으로의 전이를 어떻게 살릴 것인가
  chosen_reading: ‘여자들과 함께 자신을 더럽혔고’, ‘육의 피로 자녀를 낳았으며’, ‘사람의 피를 원하였고’, ‘그들이 하듯이 행하여’의 구조를 유지해, 타락이 혈육적 생성과 욕망으로 내려앉는 흐름이 보이게 했습니다.
  alternative_readings:
  - 더 매끈하게 ‘인간처럼 욕망하고 행동했다’로 통합할 수 있습니다.
  - ‘육과 피’를 ‘혈육’으로 바꿔 더 익숙하게 만들 수 있습니다.
  rationale: 이 절의 신학적 요지는 경계 침범과 육체화의 타락이므로, 반복되는 ‘피’와 ‘육’의 압력을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 의미 보존 우선; 본문이 의도한 존재론적 대비를 완화하지 않음.
