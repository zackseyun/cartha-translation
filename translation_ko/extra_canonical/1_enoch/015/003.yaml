  - 저버리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 질책의 강도를 살리기 위해 단순한 ‘떠나다’보다 더 강한 ‘버리다’를 택했습니다.
- source_word: ሰማየ ልዑለ ወቅዱሰ ዘለዓለም
  english_pob_choice: the high and holy eternal heaven
  chosen_korean: 높은, 거룩한, 영원한 하늘
  alternatives_korean:
  - 높고 거룩하며 영원한 하늘
  - 높은 하늘, 거룩한 하늘, 영원한 하늘
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘에 겹쳐지는 형용사들을 한국어에서도 분명히 살려, 묵시적 수사와 열거의 힘을 유지했습니다.
- source_word: ሰከብክሙ
  english_pob_choice: lie with
  chosen_korean: 함께 누웠으며
  alternatives_korean:
  - 동침했으며
  - 잠자리를 같이했으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 성적 결합을 직접 지시하되 지나치게 노골적이지 않은 표현으로, 책망의 정식 문체를 보존했습니다.
- source_word: ረኩስክሙ
  english_pob_choice: defile yourselves
  chosen_korean: 더럽혔으며
  alternatives_korean:
  - 자신을 더럽혔으며
  - 부정하게 했으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 도덕적·정결적 규탄을 반영하기 위해 ‘더럽히다’ 계열을 사용했습니다.
- source_word: ውሉደ ረዓይተ
  english_pob_choice: giant sons
  chosen_korean: 거인 아들들을
  alternatives_korean:
  - 거인들을
  - 거인 같은 아들들을
  - 거인의 아들들을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 ‘giant sons’와 대조를 유지하되, 한국어에서는 자연스러운 명사구로 옮겼습니다. 'sons who were giants'의 의미도 크게 훼손하지 않습니다.
theological_decisions:
- issue: ‘땅의 자식들’의 대비를 한국어에서 약화하지 않을 것인지
  chosen_reading: ‘사람’으로 평탄화하지 않고 ‘땅의 자식들’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 사람들이 하는 대로
  - 인간들이 하는 대로
  rationale: 하늘 존재와 지상의 인간을 대비하는 종말론적 표현이므로, 단순한 ‘사람들’로 완화하면 원문의 대비가 희미해집니다.
  doctrine_reference: 원문 수사와 신학적 대비를 보존하는 번역 원칙
