base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/007.yaml
  text: And because of this I have not appointed wives for you[b][a], for the dwelling of the spiritual ones of heaven is in heaven.
  footnotes:
  - marker: a
    text: Or 'the spirits of heaven' / 'the heavenly spiritual beings.' The Ge'ez expression can be understood in more than one closely related way.
    reason: lexical_alternative
  - marker: b
    text: 'The repeated heaven-language is deliberate: these beings belong to heaven, and their dwelling is in heaven.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이 때문입니다. 나는 너희에게 아내들을 정해 주지 않았습니다[a][b]. 하늘의 영적인 이들의 거처는 하늘에 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 영들’ / ‘하늘의 영적인 존재들’로도 이해할 수 있습니다. 게으즈 표현은 서로 밀접한 두 가지 의미를 모두 허용합니다.
    reason: alternative_reading
  - marker: b
    text: 하늘을 반복하는 표현은 의도적입니다. 이들은 하늘에 속해 있으며, 그들의 거처도 하늘에 있습니다.
    reason: cultural_note
