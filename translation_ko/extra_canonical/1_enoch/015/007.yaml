  alternative_readings:
  - 하늘의 영들
  - 하늘의 영적인 존재들
  rationale: 게으즈 표현이 단순한 명사 ‘영들’로만 고정되지 않을 수 있으므로, 해석을 과도하게 닫지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
- issue: 아내들을 ‘여자들’이 아니라 ‘아내들’로 옮길지
  chosen_reading: ‘아내들’로 옮깁니다.
  alternative_readings:
  - 여자들
  - 여성들
  rationale: 문맥상 결합/배정된 배우자 관계를 말하므로, 일반적 ‘여자들’보다 ‘아내들’이 원문의 의미를 더 정확히 드러냅니다.
  doctrine_reference: Optimal equivalence with documented exception; preserve local passage sense rather than harmonizing broadly.
