base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/002.yaml
  text: 'And go[a], say to the watchers of heaven who have sent you to petition on their behalf: ''You ought to petition on behalf of men[b], and not men on your behalf.'''
  footnotes:
  - marker: a
    text: Or 'you should ask for men.' The Ge'ez verb is a general verb of asking/requesting; 'petition' is chosen here because the context is a formal appeal for mercy.
    reason: lexical_alternative
  - marker: b
    text: '''Men'' here means humankind collectively, not males only.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 가서, 너희를 보내어 그들을 대신하여 청원하게 한 하늘의 감시자들에게 말하라. ‘너희는 사람들을 위하여 청원해야 하며, 사람들에게 너희를 위하여 청원하게 해서는 안 됩니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감시자’는 여기서 일반적인 감시 행위가 아니라 『1 에녹』의 기술적 명칭입니다.
    reason: cultural_note
  - marker: b
    text: ‘사람들’은 남성만이 아니라 인류 전체를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ሑር
  english_pob_choice: go
  chosen_korean: 가서
  alternatives_korean:
  - 가라
  - 가고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령형 이동 동사를 자연스러운 현대 한국어로 옮기되, 뒤의 직접화법 지시와 연결되도록 ‘가서’로 처리했습니다.
- source_word: በሎሙ
  english_pob_choice: say to them
  chosen_korean: 말하라
  alternatives_korean:
  - 그들에게 말하라
  - 그들에게 전하라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 뒤의 인용문이 핵심이므로, 간결한 명령형 ‘말하라’로 직접화법 도입 기능을 살렸습니다.
- source_word: ለትጉሃነ ሰማይ
  english_pob_choice: watchers of heaven
  chosen_korean: 하늘의 감시자들에게
  alternatives_korean:
  - 하늘의 파수꾼들에게
  - 하늘의 깨어 있는 이들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 기술적 칭호를 유지하기 위해 ‘watchers’를 직설적으로 반영했습니다. 전통적 교회어인 ‘천사들’로 완화하지 않았습니다.
- source_word: ትስአል / ትስአሉ
  english_pob_choice: petition
  chosen_korean: 청원하다 / 청원해야 하며
  alternatives_korean:
  - 간구하다
  - 구하다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 청탁이 아니라 공식적 호소의 성격이 있으므로, POB의 ‘petition’을 따라 ‘청원하다’로 옮겼습니다.
- source_word: በእንቲአሆሙ / በእንተ ሰብእ / በእንቲአክሙ
  english_pob_choice: on their behalf / on behalf of men / on your behalf
  chosen_korean: 그들을 대신하여 / 사람들을 위하여 / 사람들에게 너희를 위하여
  alternatives_korean:
  - 그들을 위해 / 인간을 위해 / 너희를 위해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 대리·대상 관계를 드러내기 위해 ‘대신하여’, ‘위하여’, ‘너희를 위하여’를 구분해 번역했습니다. 마지막 절은 역전된 질서를 분명히 보여 주도록 직역성을 유지했습니다.
theological_decisions:
- issue: watchers의 용어를 한국어에서 어떻게 보존할 것인가
  chosen_reading: 하늘의 감시자들
  alternative_readings:
  - 하늘의 천사들
  - 하늘의 파수꾼들
  rationale: 이 절은 ‘감시자’라는 묵시문학적 범주 자체가 중요한 문맥이므로, 의미를 일반 천사 개념으로 흡수하지 않고 드러내는 쪽을 택했습니다.
  doctrine_reference: Preserve apocalyptic imagery and locally grounded key terms.
- issue: 문장의 권고/책무 뉘앙스
  chosen_reading: 너희는 사람들을 위하여 청원해야 하며, 사람들에게 너희를 위하여 청원하게 해서는 안 됩니다
  alternative_readings:
  - 너희는 사람들을 위해 간구해야 하며, 사람들에게 너희를 위해 간구하게 해서는 안 됩니다
  - 너희가 사람들을 위해 청원하는 것이 마땅하며, 사람들에게 너희를 위해 청원하게 해서는 안 됩니다
  rationale: 원문의 역전된 질서와 꾸짖음의 힘을 살리기 위해, 단순한 조언이 아니라 도덕적 적합성을 띤 책무 표현으로 옮겼습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
