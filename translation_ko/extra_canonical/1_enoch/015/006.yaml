  chosen_reading: 존재론적 범주는 확정하지 않고, 본문이 말하는 ‘영의 성격을 지닌 존재들’이라는 서술을 유지했습니다.
  alternative_readings:
  - 영들
  - 영적인 존재들
  - 정신적 존재들
  rationale: 이 구절은 타락 이전 감시자들의 상태를 대조적으로 제시하므로, 후대 교리적 정밀화를 덧씌우기보다 원문이 말하는 상태 묘사를 보존하는 편이 적절합니다.
  doctrine_reference: 원문 우선, 신학적 긴장 보존
