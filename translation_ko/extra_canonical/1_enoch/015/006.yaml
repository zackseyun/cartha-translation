  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 과거의 상태를 현재와 대조하는 시간 부사를 자연스럽게 살리면서, 단순한 순서상의 ‘먼저’보다 상태 전환의 대비를 분명히 합니다.
