base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/006.yaml
  text: But you, formerly, were spiritual beings, living an eternal life that does not die throughout all the generations of the world.
  footnotes:
  - marker: a
    text: Or 'spirits.' The Ge'ez term can be rendered more tersely, but the fuller wording in English helps preserve the predicative force of the line.
    reason: lexical_alternative
  - marker: b
    text: '''World'' may also be understood as ''age'' here, yielding the sense ''throughout all generations forever.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'living with eternal life'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 당신들은 이전에는, 영적 존재들로서, 죽지 않는 영원한 생명을 살아가고 있었고, 세상의 모든 세대를 두루 지나고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영들’. Geez 용어는 더 간결하게도 옮길 수 있지만, 여기서는 술어적 힘을 살리기 위해 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘세상’은 여기서 ‘시대’로도 이해될 수 있어, ‘세상의 모든 세대’는 ‘영원히 모든 세대를 통하여’라는 뜻이 될 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영원한 생명을 살아가는’.
    reason: previous_rendering
lexical_decisions:
- source_word: ቀዳሚ
  english_pob_choice: formerly
  chosen_korean: 이전에는
  alternatives_korean:
