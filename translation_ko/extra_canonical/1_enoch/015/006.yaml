  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 직설적 부정을 그대로 살려, 영원한 생명의 성격을 ‘죽지 않는’으로 분명하게 드러냅니다.
- source_word: ለኵሉ ትውልደ ዓለም
  english_pob_choice: throughout all the generations of the world
  chosen_korean: 세상의 모든 세대를 두루 지나고 있었습니다
  alternatives_korean:
