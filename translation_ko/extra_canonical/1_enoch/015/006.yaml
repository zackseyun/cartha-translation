  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘세계/세대’의 복합 표현을 한국어로 자연스럽게 풀면서, 지속의 범위를 ‘두루 지나고 있었습니다’로 옮겨 시간적 확장을 살렸습니다.
theological_decisions:
