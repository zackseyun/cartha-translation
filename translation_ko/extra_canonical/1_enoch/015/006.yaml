  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게즈의 ‘살다 + 생명’이라는 직접적인 구문 관계를 살려 ‘생명을 살아가다’로 옮기고, 과거 진행을 통해 원문의 지속적 상태를 반영했습니다.
- source_word: ዘኢይመውት
  english_pob_choice: that does not die
  chosen_korean: 죽지 않는
  alternatives_korean:
