  - 영적 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Geez 표현이 ‘영’의 성격을 지닌 존재들을 가리키므로, 한국어에서는 ‘영적 존재들’이 가장 직설적이면서도 지나치게 기술용어화하지 않습니다.
- source_word: ሕያዋነ ሕይወት
  english_pob_choice: living an eternal life
  chosen_korean: 영원한 생명을 살아가고 있었고
  alternatives_korean:
