base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
  footnotes:
  - marker: a
    text: The opening noun is contextually understood as the giant offspring of the Watchers and human women; a more generic rendering such as 'offspring' is possible at the lexical level.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'earth' is retained to reflect the Ge'ez wording and the verse's emphasis that these spirits belong to the earthly realm rather than the heavenly one.
    reason: cultural_note
translation:
  language: ko
  text: 이제 영들과 육체로부터 태어난 거인들[a]은 땅에서 악한 영들이라 불릴 것이며, 그들의 거처는 땅에 있을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 말은 감시자들과 인간 여자에게서 난 혼종 후손인 거인들을 가리킵니다. 더 일반적으로는 ‘후손들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅’이 두 번 반복되는 표현을 살려, 이 존재들이 하늘이 아니라 지상의 영역에 속함을 드러냅니다.
    reason: cultural_note
