base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
  footnotes:
  - marker: a
    text: The opening noun is contextually understood as the giant offspring of the Watchers and human women; a more generic rendering such as 'offspring' is possible at the lexical level.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'earth' is retained to reflect the Ge'ez wording and the verse's emphasis that these spirits belong to the earthly realm rather than the heavenly one.
    reason: cultural_note
translation:
  language: ko
  text: 이제 그 거인들[a]은 영들과 육체에게서 태어났으므로 땅에서 악한 영들로 불릴 것이며, 그들의 거처는 땅에 있을 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 말은 감시자들과 인간 여자에게서 난 혼종 후손인 거인들을 가리킵니다. 더 일반적으로는 ‘후손들’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅’이 두 번 반복되는 표현을 살려, 이 존재들이 하늘이 아니라 지상의 영역에 속함을 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: ረዓይት
  english_pob_choice: the giants
  chosen_korean: 거인들
  alternatives_korean:
  - 후손들
  - 강한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 감시자들과 인간 여자들에게서 난 혼종 후손을 가리키므로, 한국어에서는 직역보다 문맥적 의미를 살린 ‘거인들’이 가장 적절합니다.
- source_word: እመናፍስት ወሥጋ
  english_pob_choice: from spirits and flesh
  chosen_korean: 영들과 육체에게서
  alternatives_korean:
  - 영과 육체에게서
  - 영적인 존재들과 육체에게서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지혜화하거나 완화하지 않고, 기원에 대한 급진적인 이중 대비를 그대로 드러내기 위해 ‘영들과 육체에게서’로 옮겼습니다.
- source_word: መንፈሳት እኩያን
  english_pob_choice: evil spirits
  chosen_korean: 악한 영들
  alternatives_korean:
  - 악령들
  - 더러운 영들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문은 ‘영’을 말하되 그 성격을 ‘악한’으로 규정하므로, 한국어에서는 전통 교회어보다 직결된 ‘악한 영들’이 원문 긴장을 더 잘 보존합니다.
- source_word: ይሰመዩ
  english_pob_choice: will be called
  chosen_korean: 불릴 것이며
  alternatives_korean:
  - 이름 지어질 것이며
  - 알려질 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동 명명 공식을 살리기 위해 ‘불릴 것입니다’ 계열을 택했습니다.
- source_word: በዲበ ምድር / ወውስተ ምድር
  english_pob_choice: upon the earth / on the earth
  chosen_korean: 땅에서 / 땅에
  alternatives_korean:
  - 지상에서 / 지상에
  - 땅 위에서 / 땅에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 ‘땅’의 대조를 살리면서도 한국어 문맥에서 자연스럽게 읽히도록, 첫 절은 활동의 범위를 ‘땅에서’, 뒤 절은 거처를 ‘땅에’로 구분했습니다.
theological_decisions:
- issue: ‘거인들’의 정체와 후속 ‘악한 영들’ 규정
  chosen_reading: 본문의 거인들은 감시자와 인간 여자에게서 난 혼종 후손이며, 그들의 이후 상태가 ‘악한 영들’로 불린다는 진술을 그대로 유지합니다.
  alternative_readings:
  - 보다 일반적인 ‘후손들’로 완화할 수 있습니다.
  - ‘악한 영들’을 ‘더러운 영들’로 조정할 수 있습니다.
  rationale: 15장 문맥이 이 존재들의 기원과 이후 상태를 설명하므로, 한국어에서도 그 전환을 해소하지 않고 그대로 남겨야 합니다.
  doctrine_reference: 문맥 우선, 후대 악령론을 본문에 과잉 주입하지 않음
