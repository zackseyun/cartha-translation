base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/009.yaml
  text: And evil spirits came out from their flesh[a], because they were created from above; and from the holy Watchers was their beginning and first foundation[d][c][b]. They shall be evil spirits.
  footnotes:
  - marker: a
    text: Or 'went forth from their bodies.' The Ge'ez explicitly says 'from their flesh,' which preserves the bodily imagery.
    reason: lexical_alternative
  - marker: b
    text: '''Holy Watchers'' renders a phrase that may be read more literally as ''holy ones, watchers.'' In context it refers to the angelic Watchers.'
    reason: lexical_alternative
  - marker: c
    text: 'The final designation may be understood as a naming formula: after leaving the flesh, these beings are called ''evil spirits.'''
    reason: alternative_reading
  - marker: d
    text: Or 'And the souls of the wicked'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 악한 영들이 그들의 육체에서 나왔습니다[a]. 왜냐하면 그들은 위로부터 창조되었고, 거룩한 감시자들로부터 그들의 시작과 첫 기초가 나왔기 때문입니다[b][c][d]. 그들은 악한 영들이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 몸에서 나왔습니다’. 게에즈 본문은 분명히 ‘육체/살’을 말하므로 이 이미지를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감시자들’은 에녹서의 기술 용어로, 문맥상 천상 존재를 가리킵니다.
    reason: source_note
  - marker: c
    text: 또는 ‘거룩한 자들, 감시자들로부터’.
    reason: alternative_reading
  - marker: d
    text: 또는 ‘그들의 기원과 첫 근원’.
    reason: previous_rendering
lexical_decisions:
- source_word: ነፍሳት እኩያን
  english_pob_choice: evil spirits
  chosen_korean: 악한 영들
  alternatives_korean:
  - 악한 영혼들
  - 악한 혼들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 구문은 여기서 ‘악한 영들’ 또는 ‘악한 영혼들’의 뜻이지만, 문맥상 죽은 거인들의 비물질적 존재를 가리키므로 한국어에서는 ‘영들’이 가장 자연스럽고 POB의 최종 판독과도 맞습니다.
- source_word: ወጽኡ እምሥጋሆሙ
  english_pob_choice: came out from their flesh
  chosen_korean: 그들의 육체에서 나왔습니다
  alternatives_korean:
  - 그들의 몸에서 나왔습니다
  - 그들의 살에서 나왔습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈가 분명히 ‘살/육체’(flesh)를 쓰므로 이를 약화하지 않고 살렸습니다. 다만 한국어에서는 ‘육체’가 본문 이미지를 충분히 전달하면서도 매끄럽습니다.
- source_word: እምቅዱሳን ትጉሃን
  english_pob_choice: from the holy Watchers
  chosen_korean: 거룩한 감시자들로부터
  alternatives_korean:
  - 거룩한 자들, 감시자들로부터
  - 거룩한 파수자들로부터
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹 문맥의 기술 용어로서 ‘Watchers’를 유지하는 것이 중요하므로, 한국어에서는 의미를 드러내는 ‘감시자들’을 채택했습니다. ‘거룩한 자들’만으로는 기술 용어성이 약해집니다.
- source_word: ቀዳሚቶሙ ወቀዳሚ መሰረት
  english_pob_choice: their beginning and first foundation
  chosen_korean: 그들의 시작과 첫 기초
  alternatives_korean:
  - 그들의 시작과 첫 근본
  - 그들의 기원과 첫 기초
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복으로 원천성과 기초성을 강조하는 표현이어서, 두 명사 모두 살려 직역에 가깝게 옮겼습니다. ‘기초’는 다음 절들로 이어지는 기원 설명의 무게를 잘 드러냅니다.
- source_word: መንፈሰ እኩየ
  english_pob_choice: evil spirits
  chosen_korean: 악한 영들
  alternatives_korean:
  - 악한 영혼들
  - 악령들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결말의 명명식은 이 존재들의 최종 정체를 지시하므로, 본문 첫 문장과 같은 한국어 표현을 유지해 동일성을 분명히 했습니다. ‘악령들’은 해석이 강해 본문이 가진 직접성을 약화할 수 있습니다.
theological_decisions:
- issue: ‘from above’의 의미
  chosen_reading: 그들의 기원이 위로부터, 곧 하늘적 차원에서 비롯되었음을 뜻하며, 도덕적 승인이나 완전한 천사성을 뜻하지는 않습니다.
  alternative_readings:
  - 단순히 ‘처음에’ 또는 ‘일찍이’라는 뜻
  - 그들이 본래 천사였다는 뜻
  rationale: 문맥은 육체적 기원과 상층적 기원을 함께 대비하므로, 위로부터라는 공간적·우주론적 함의를 그대로 남겨야 합니다.
  doctrine_reference: 에녹서의 국지적 우주론을 본문 안에서 보존하고, 후대 교리로 단순화하지 않습니다.
- issue: 마지막 절의 진술 방식
  chosen_reading: ‘그들은 악한 영들이 될 것입니다’는 단순 설명이 아니라 이 존재들의 이름 붙이기/정체 선언으로 읽습니다.
  alternative_readings:
  - 미래 시제의 예언
  - 단순한 성격 묘사
  rationale: POB의 주석 전통처럼 마지막 문장은 결과 상태를 선언하는 명명 공식으로 이해하는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 본문의 종말론적·명명적 기능을 유지합니다.
