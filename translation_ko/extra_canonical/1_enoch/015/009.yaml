  source_fidelity: 첫 문장의 ‘악한 영들’은 게에즈의 절대형 명사+형용사 구문(‘악한 영들/영혼들’)과 최근 판정에 부합합니다. 그러나 초안은 ‘거룩한 감시자들로부터 그들의 시작과 첫 기초가 나왔다’라고 하여 원문의 기원 관계를 다소 부자연스럽게 처리하고, 영어 POB 주석의 핵심 대안 및 마지막 명명 공식 주석을 보존하지 못했습니다.
  naturalness: 합쇼체는 일관되지만, 문장 중간의 ‘왜냐하면’ 및 ‘시작과 첫 기초가 나왔다’는 현대 표준어에서 어색합니다. ‘이는 … 비롯되었기 때문입니다’로 고치면 원문의 반복적 기원 표현을 유지하면서도 자연스럽습니다.
  terminology: ‘악한 영들’은 ‘악령들’보다 해석을 덧붙이지 않아 적절합니다. ‘거룩한 감시자들’은 초안의 기술 용어 선택을 유지하되, 주석에서 ‘거룩한 자들, 감시자들’이라는 직역 가능성을 밝혀야 합니다. ‘첫 토대’는 ‘첫 기초’보다 자연스럽고 원문의 foundation 비유를 보존합니다.
