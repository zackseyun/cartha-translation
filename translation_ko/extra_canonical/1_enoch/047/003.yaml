base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/003.yaml
  text: In those days I saw the Head of Days[a], as he sat on the throne of his glory, and the books of the living were opened before him; and all his host, which is in the heights of heaven[e][d][c][b], and his council stood before him.
  footnotes:
  - marker: a
    text: Or 'the books of life.' The Ge'ez reads a plural expression, more literally 'the books of the living.'
    reason: lexical_alternative
  - marker: b
    text: '''Head of Days'' is rendered closely from the Ge''ez title here rather than harmonized to the more familiar ''Ancient of Days.'''
    reason: lexical_alternative
  - marker: c
    text: The phrase rendered 'his council' may also mean 'the circle around him' or 'his assembly,' referring to the heavenly court surrounding the enthroned figure.
    reason: lexical_alternative
  - marker: d
    text: Or 'while the throne of his glory was set'.
    reason: previous_rendering
  - marker: e
    text: Or 'his council'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 나는 「날들의 머리」를 보았습니다. 그가 자신의 영광의 보좌에 앉아 계실 때였고, 살아 있는 자들의 책들이 그분 앞에서 열렸으며, 하늘의 높은 곳에 있는 그의 모든 군대와 그의 회의가 그분 앞에 섰습니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '날들의 머리'입니다. 이 구절에서는 더 익숙한 '옛날부터 계신 이'로 조화시키지 않고, 에티오피아어 칭호를 가까이 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: '''살아 있는 자들의 책들''은 에티오피아어 복수형을 살린 표현입니다. 더 익숙한 ''생명책''으로 바꾸지 않았습니다.'
    reason: lexical_alternative
  - marker: c
    text: 에티오피아어 ዐውድ는 문자적으로 '둘레, 원'의 뜻을 지닙니다. 여기서는 보좌를 둘러선 천상 회합을 가리킨다고 보아 '회의'로 옮겼습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 '그의 영광의 보좌 위에'.
    reason: previous_rendering
  - marker: e
    text: 또는 '그의 회의'.
    reason: previous_rendering
lexical_decisions:
- source_word: ርእሰ መዋዕል
  english_pob_choice: the Head of Days
  chosen_korean: 날들의 머리
  alternatives_korean:
  - 날들의 어른
  - 날들의 으뜸
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez 칭호를 전통적 다니엘서 표현으로 평준화하지 않고, 구성요소를 살려 직접 옮겼습니다. '머리'는 문자성을 유지하면서도 위계적 우두머리 뜻을 드러냅니다.
- source_word: መጻሕፍተ ሕያዋን
  english_pob_choice: the books of the living
  chosen_korean: 살아 있는 자들의 책들
  alternatives_korean:
  - 생명책들
  - 살아 있는 이들의 책들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수형 '책들'과 '살아 있는 자들'이라는 지시를 그대로 보존해, 익숙한 단수형 '생명책'으로 평준화하지 않았습니다.
- source_word: ኵሉ ኃይሉ
  english_pob_choice: all his host
  chosen_korean: 그의 모든 군대
  alternatives_korean:
  - 그의 모든 무리
  - 그의 모든 천상 군대
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 법정의 집합체를 가리키므로, 추상적 '권세'보다 집단성을 드러내는 '군대'가 더 적절합니다.
- source_word: አውደ ዚአሁ
  english_pob_choice: his council
  chosen_korean: 그의 회의
  alternatives_korean:
  - 그의 원
  - 그의 모임
  - 그의 공의회
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문자적으로는 '둘러선 원/주변'의 뜻이 있지만, 보좌 주변의 천상 집단이라는 문맥에서 회합·법정적 의미를 살려 '회의'로 옮겼습니다.
theological_decisions:
- issue: Theophanic throne-room imagery in the clause 'as he sat on the throne of his glory'
  chosen_reading: 보좌에 앉아 계실 때
  alternative_readings:
  - 보좌에 앉으셨을 때
  - 그의 영광의 보좌 위에 계실 때
  rationale: 지속적 배경 상황을 나타내는 접속감각을 살리기 위해 '앉아 계실 때'로 옮겼습니다. 이는 즉위 장면의 정적인 배경을 유지하면서도 한국어 문장 흐름을 자연스럽게 합니다.
  doctrine_reference: 원문 서사 긴장 보존; 천상 법정 환상 묘사
