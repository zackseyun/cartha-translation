  alternative_readings:
  - 의인의 피
  - 의인 한 사람의 피
  rationale: 본문의 평행구조인 「의인들의 기도」와 맞물려, 박해받는 의인 공동체의 피 흘림을 드러내는 집합적 의미를 보존하는 편이 원문의 긴장을 가장 잘 살립니다.
  doctrine_reference: 원문이 허용하는 집합적/대표적 긴장을 해소하지 않고 유지합니다.
