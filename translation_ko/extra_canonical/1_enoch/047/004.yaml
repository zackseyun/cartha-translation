  rationale: 에녹서의 고유한 신적 칭호를 그대로 살리되, 한국어 문맥에서는 호격이 아닌 서술로 ‘영들의 주’가 가장 간결하고 투명합니다.
theological_decisions:
- issue: ‘의인들의 수’의 의미
  chosen_reading: 정해진 의인들의 수가 거의 차서, 그 완성이 임박했다는 뜻으로 읽습니다.
  alternative_readings:
  - 의인들에게 속한 심판/계산이 가까워졌다는 뜻
  - 의인들의 때가 가까워졌다는 뜻
  rationale: 게에즈 명사 자체는 수량을 가리키는 것이 가장 직접적이므로, 종말론적 ‘정해진 수의 완성’이라는 함의를 본문 수준에서만 반영했습니다.
  doctrine_reference: 원문 우선 원칙; 묵시적 함의를 설명하되 본문을 과도하게 해석하지 않음.
- issue: ‘의인들의 피가 … 갚음을 받았다’의 신학적 강도
  chosen_reading: 흘린 피가 하나님 앞에서 요구되었고, 그에 대한 보응이 이루어졌다는 뜻으로 읽습니다.
  alternative_readings:
  - 그 피가 영들의 주 앞에서 기억되었다는 뜻
  - 그 피가 영들의 주 앞에서 받아들여졌다는 뜻
  rationale: 문맥은 단순한 수용이 아니라 억울한 피에 대한 심판적 응답을 가리키므로, 한국어에서는 ‘갚음’으로 보응의 의미를 분명히 했습니다.
  doctrine_reference: 피의 보응/보복이라는 성경적 법정 언어를 보존하되, 본문이 허용하는 범위를 넘지 않음.
