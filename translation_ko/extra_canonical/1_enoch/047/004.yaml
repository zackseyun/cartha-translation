base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/004.yaml
  text: And the hearts of the holy ones shall be filled with joy[a], because the number of the righteous has drawn near, and the prayer of the righteous has been heard[c][b], and the blood of the righteous has been avenged before the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or 'the reckoning of the righteous has drawn near,' if the noun is taken in a more judicial sense rather than as a numerical total.
    reason: lexical_alternative
  - marker: b
    text: '''Has been accepted'' may also carry the sense that the blood of the righteous has come into favorable notice before God, with vindication implied by the context.'
    reason: lexical_alternative
  - marker: c
    text: Or 'has been accepted'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거룩한 이들의 마음은 기쁨으로 가득하게 될 것입니다. 이는 의인들의 수가 가까워졌고[a], 의인들의 기도가 들렸으며[c], 의인들의 피가 영들의 주 앞에서 요구되었기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들에 대한 셈’ 또는 ‘의인들에 대한 판결’이 가까워졌다는 뜻으로 이해할 수 있습니다. 그러나 이 말은 가장 직접적으로 ‘수’ 또는 ‘계수’를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역에 가까운 표현입니다. 흘린 의인의 피에 대해 책임과 보응을 요구하는 법정적 관용을 가리키며, 문맥상 그 피의 옹호와 보응을 함축합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘응답되었으며’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ቅዱሳን
  english_pob_choice: the holy ones
  chosen_korean: 성도들
  alternatives_korean:
  - 거룩한 자들
  - 거룩한 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시문맥에서 공동체적 하나님 백성을 가리키므로, 한국어에서는 가장 자연스럽고 관용적인 ‘성도들’로 옮기되, ecclesiastical한 오해를 피하기 위해 뜻을 유지했습니다.
- source_word: ኍልቈ ለጻድቅ
  english_pob_choice: the number of the righteous
  chosen_korean: 의인들의 수
  alternatives_korean:
  - 의인들의 계산
  - 의인들의 셈
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 명사는 수량/카운트를 가리킬 수 있으므로, 본문 흐름에 맞게 ‘수’로 옮겨 완결된 정수의 도달이라는 묵시적 뉘앙스를 살렸습니다.
- source_word: ጸሎቶሙ ለጻድቃን ተሰምዐ
  english_pob_choice: the prayer of the righteous has been heard
  chosen_korean: 의인들의 기도가 들려졌으며
  alternatives_korean:
  - 의인들의 기도가 들렸으며
  - 의인들의 기도가 응답되었으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동형의 핵심은 ‘들려짐/들림’이므로 이를 보존하되, 한국어에서는 자연스러운 수동 표현으로 정리했습니다.
- source_word: ተፈቅደ
  english_pob_choice: has been avenged
  chosen_korean: 갚음을 받았
  alternatives_korean:
  - 보응을 받았
  - 원수를 갚았
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 ‘받아들여졌다’가 아니라 요구되다/보응되다의 법정적·보복적 의미를 띠므로, 본문이 말하는 피의 vindication을 ‘갚음’으로 직접 반영했습니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 영들의 주
  alternatives_korean:
  - 영들의 주님
  - 영들의 주 하나님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 고유한 신적 칭호를 그대로 살리되, 한국어 문맥에서는 호격이 아닌 서술로 ‘영들의 주’가 가장 간결하고 투명합니다.
theological_decisions:
- issue: ‘의인들의 수’의 의미
  chosen_reading: 정해진 의인들의 수가 거의 차서, 그 완성이 임박했다는 뜻으로 읽습니다.
  alternative_readings:
  - 의인들에게 속한 심판/계산이 가까워졌다는 뜻
  - 의인들의 때가 가까워졌다는 뜻
  rationale: 게에즈 명사 자체는 수량을 가리키는 것이 가장 직접적이므로, 종말론적 ‘정해진 수의 완성’이라는 함의를 본문 수준에서만 반영했습니다.
  doctrine_reference: 원문 우선 원칙; 묵시적 함의를 설명하되 본문을 과도하게 해석하지 않음.
- issue: ‘의인들의 피가 … 갚음을 받았다’의 신학적 강도
  chosen_reading: 흘린 피가 하나님 앞에서 요구되었고, 그에 대한 보응이 이루어졌다는 뜻으로 읽습니다.
  alternative_readings:
  - 그 피가 영들의 주 앞에서 기억되었다는 뜻
  - 그 피가 영들의 주 앞에서 받아들여졌다는 뜻
  rationale: 문맥은 단순한 수용이 아니라 억울한 피에 대한 심판적 응답을 가리키므로, 한국어에서는 ‘갚음’으로 보응의 의미를 분명히 했습니다.
  doctrine_reference: 피의 보응/보복이라는 성경적 법정 언어를 보존하되, 본문이 허용하는 범위를 넘지 않음.
