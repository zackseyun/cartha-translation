  source_fidelity: 초안은 전반적인 절의 구조와 주요 어휘를 잘 따르지만, ተፈቅደ는 ‘받아들여졌다’가 아니라 ‘요구되었다/추궁되었다’라는 법정적 의미가 중심입니다. ‘피가 갚음을 받았다’는 그 결과인 보응을 본문에 앞당겨 확정하는 표현입니다. 원문의 법정적 관용과 해석의 여지를 보존하려면 ‘요구되었다’로 옮기는 것이 더 안전합니다.
  naturalness: ‘의인들의 수가 가까이 이르렀고’보다 ‘의인들의 수가 가까워졌고’가 현대 표준 한국어에서 자연스럽습니다. 또한 ‘성도들’은 자연스럽지만 교회 제도권의 ‘saints’라는 연상을 덧붙일 수 있으므로, 원문의 일반적인 묵시문학 용례를 보존하는 ‘거룩한 이들’이 적절합니다. ‘기도가 들렸으며’는 하나님이 들으셨다는 의미를 자연스럽게 전달합니다.
  terminology: ቅዱሳን은 ‘거룩한 이들’, ጻድቅ/ጻድቃን은 일관되게 ‘의인들’, እግዚአ መናፍስት은 에녹서의 정형 칭호인 ‘영들의 주’로 유지합니다. ተፈቅደ의 ‘요구되었다’에는 흘린 피에 대한 책임을 묻고 보응을 요구하는 의미가 포함되지만, 본문은 ‘보응되었다’라고 결과를 명시하지 않습니다.
