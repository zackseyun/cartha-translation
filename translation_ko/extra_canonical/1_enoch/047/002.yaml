base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/002.yaml
  text: In those days the holy ones who dwell in the heights of heaven shall unite with one voice[a], and they shall plead and pray and praise and give thanks and bless the name of the Lord of Spirits, on account of the blood of the righteous that has been poured out, and that the prayer of the righteous may not be in vain before the Lord of Spirits, that judgment may be executed for them[d][c][b], and that patience may not be theirs forever.
  footnotes:
  - marker: a
    text: Or 'the saints'; the term can denote holy beings generally. Because they are described as dwelling in the heights of heaven, the wording leaves open whether the reference is to angels, the heavenly righteous, or both.
    reason: lexical_alternative
  - marker: b
    text: The verb behind 'should not be in vain' is uncertain in this Ethiopic witness. The sense in context is likely that the prayer of the righteous is not to go unanswered or ineffective before the Lord of Spirits.
    reason: textual_variant
  - marker: c
    text: Or 'justice may be done for them.' The noun can be heard either as judicial sentence or as the execution of justice on behalf of the righteous.
    reason: lexical_alternative
  - marker: d
    text: Or 'and because the prayer of the righteous should not be in vain before the Lord of Spirits, so that judgment may be executed for them and patience may not be theirs forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날들에 하늘의 높은 곳에 거하는 거룩한 이들이 한 목소리로 연합하여, 의인들의 피가 흘려졌기 때문에, 또 의인들의 기도가 만군의 주 앞에서 헛되지 않게 하려고, 또 그들을 위하여 심판이 집행되게 하려고, 또 그들의 인내가 영원히 그들에게 있지 않게 하려고 간구하고, 기도하고, 찬양하고, 감사하고, 야훼 만군의 주의 이름을 찬송할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 이들’은 천상 존재, 하늘의 의인, 또는 둘 모두를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 아람/에티오피아 계통 본문 증거에서 이 동사의 정확한 힘은 불확실합니다. 문맥상 의인의 기도가 하나님 앞에서 무효로 돌아가지 않는다는 뜻으로 이해할 수 있습니다.
    reason: textual_variant
  - marker: c
    text: ‘심판’은 ‘정의가 이루어짐’으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 원문의 목적절은 ‘의인들의 기도가 헛되지 않게 하려고… 심판이 집행되게 하려고… 인내가 영원하지 않게 하려고’라는 병렬 구조를 이룹니다.
    reason: source_note
lexical_decisions:
- source_word: ቅዱሳን
  english_pob_choice: the holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도들
  - 거룩한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 거주라는 문맥을 살려 특정 교회 용어인 ‘성도’보다 중립적인 ‘거룩한 이들’로 옮겼습니다.
- source_word: በመልዕልተ ሰማያት
  english_pob_choice: in the heights of heaven
  chosen_korean: 하늘의 높은 곳에
  alternatives_korean:
  - 높은 하늘에
  - 하늘의 높이에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상적 공간성을 자연스럽게 살리면서도 과도하게 우주론을 특정하지 않도록 했습니다.
- source_word: በ፩ቃል
  english_pob_choice: with one voice
  chosen_korean: 한 목소리로
  alternatives_korean:
  - 한마음으로
  - 한 음성으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 공동의 선포와 탄원이라는 맥락에서 ‘한 목소리로’가 가장 직접적입니다.
- source_word: የኃብሩ
  english_pob_choice: shall unite
  chosen_korean: 연합하여
  alternatives_korean:
  - 함께 모여
  - 합쳐져
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 집합·결합 의미를 살리면서, 뒤의 ‘한 목소리로’와 잘 연결되도록 했습니다.
- source_word: ከመ ኢትጸራዕ
  english_pob_choice: should not be in vain before the Lord of Spirits
  chosen_korean: 만군의 주 앞에서 헛되지 않게 하려고
  alternatives_korean:
  - 만군의 주 앞에서 헛되게 되지 않게 하려고
  - 만군의 주 앞에서 허사로 돌아가지 않게 하려고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 목적절 구조를 살리되, ‘헛되지 않게’로 기도의 무효·무의미함을 자연스럽게 표현했습니다.
- source_word: ኵነኔ
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 법정 이미지를 한국어에서 가장 직관적으로 전달하는 말로 ‘심판’을 택했습니다.
- source_word: ትዕግሥት
  english_pob_choice: patience
  chosen_korean: 인내
  alternatives_korean:
  - 참음
  - 오래 참음
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지속적 기다림과 견딤의 의미를 함께 담기 위해 ‘인내’를 사용했습니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 고유 칭호를 한국어 성경에서 자연스럽게 기능하는 호칭으로 옮기되, 천상 존재들을 주관하시는 주권을 드러내는 ‘만군의 주’로 처리했습니다.
theological_decisions:
- issue: ቅዱሳን의 정체
  chosen_reading: 천상에 거하는 ‘거룩한 이들’로 두어, 인간 성도와 천상 존재의 구분을 확정하지 않았습니다.
  alternative_readings:
  - 성도들
  - 천사들
  rationale: 본문은 천상 거주와 예배/탄원 행위를 함께 제시하므로, 정체를 단정하기보다 본문의 모호성을 유지하는 편이 더 충실합니다.
  doctrine_reference: 의도된 모호성 보존
- issue: ἥ/ኵነኔ 관련 종말론적 청원
  chosen_reading: 의인들을 위한 심판 집행과 기도의 헛되지 않음이 함께 오도록 하는 청원 구조로 옮겼습니다.
  alternative_readings:
  - 그들을 위한 정의가 이루어지게 하려고
  - 그들에 대한 판결이 내려지게 하려고
  rationale: 본문의 목적절 연쇄를 유지해야 천상 존재들의 간구가 ‘의인의 피’에 대한 응답이라는 점이 선명해집니다.
  doctrine_reference: 종말론적 보응과 정의의 실행
