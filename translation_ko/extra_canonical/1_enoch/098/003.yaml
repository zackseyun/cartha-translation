base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/003.yaml
  text: Therefore they have no instruction or wisdom[a]; and because of this they will perish together with their possessions, and with all their glory and their honor. And in shame, and in slaughter, and in great destitution[c][b], their spirits will be cast into the furnace of fire.
  footnotes:
  - marker: a
    text: Or 'teaching' for 'instruction.' The pair 'instruction and wisdom' likely functions as a wisdom-category rather than two sharply separate ideas.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'in great destitution' is difficult; it may also be understood more broadly as 'in great misery' or 'in great affliction.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they will have no instruction or wisdom; and because of this they will perish together with their possessions, with all their glory'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 그들에게는 가르침도 지혜도 없으며, 그 때문에 그들은 자기들의 소유와 함께, 그리고 자기들의 모든 영광과 영예와 함께 멸망할 것입니다. 그리고 수치와 살육과 큰 궁핍 가운데 그들의 영은 불의 용광로 속으로 던져질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가르침’은 ‘instruction’의 번역으로, 여기서는 지식 전달보다 지혜 범주를 이루는 교훈을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 궁핍’은 원문의 난해한 표현으로, ‘큰 비참’이나 ‘큰 고난’으로도 이해될 수 있습니다.
    reason: lexical_alternative
