base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/009.yaml
  text: Woe to you[a], fools, for you will perish in your folly, and you oppress the wise[c][b], and good will not come upon you.
  footnotes:
  - marker: a
    text: The verb rendered 'you trust' may also be understood as 'you boast' or 'you rely' in relation to wealth.
    reason: lexical_alternative
  - marker: b
    text: Or 'good will not find you' / 'well-being will not reach you.' The Ge'ez expression is broad and may imply withheld blessing or prosperity.
    reason: lexical_alternative
  - marker: c
    text: Or 'for you trust in your wealth, and from your riches you drive away the wise'.
    reason: previous_rendering
translation:
  language: ko
  text: 어리석은 자들이여, 너희에게 화가 있습니다. 너희는 너희의 어리석음[a]으로 멸망할 것이며, 지혜로운 이들을 잊어버리고[c], 좋은 것이 너희에게 이르지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈 표현은 ‘어리석음’에 빠진 상태를 가리키며, 단순한 지적 부족보다 도덕적·영적 어리석음을 뜻합니다.
    reason: source_note
  - marker: b
    text: 마지막 구절은 ‘좋은 것’, ‘복된 것’, 또는 ‘번영’처럼 넓게 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 동사는 기본적으로 ‘잊다’를 뜻하며, 문맥상 ‘무시하다’ 또는 ‘등한시하다’로 이해될 수도 있습니다.
    reason: lexical_alternative
