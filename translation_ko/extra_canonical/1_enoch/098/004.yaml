theological_decisions:
- issue: 죄의 기원과 신적 기원 부정
  chosen_reading: 이 구절은 죄가 하나님에 의해 땅에 ‘보내진’ 것이 아니라, 인간이 자기 행위로 만들어낸 것이라고 말합니다.
  alternative_readings:
  - 죄가 본래 창조 질서의 일부가 아니라는 뜻으로만 읽을 수 있습니다.
  rationale: 수동형 ‘내려보내진 것이 아닙니다’와 ‘사람이 만들어냈다’의 대비가 인간 책임을 강하게 강조하므로, 그 긴장을 약화시키지 않도록 번역했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
