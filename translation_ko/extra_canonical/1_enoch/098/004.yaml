  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으른 직역보다 문맥상 비유의 평행성을 살려, 여성 종속의 이미지를 분명하게 하되 한국어에서 매끄럽게 읽히도록 했습니다.
