theological_decisions:
- issue: ‘너희 죄인들이 살 것이라고’의 주어·호칭 처리
  chosen_reading: ‘너희 죄인들이’는 경고의 직접 청자에 대한 호칭으로 처리하고, ‘살 것이라고 바라지 마십시오’로 옮겼습니다.
  alternative_readings:
  - 죄인들이 살 것이라고
  - 너희가 죄인으로서 살 것이라고
  rationale: 게어즈 동사 형태는 2인칭 복수에 걸리며, ‘죄인들’은 그 청자를 지칭하는 호격적/동격적 표현입니다. 따라서 한국어에서도 직접 호칭의 긴장을 살리는 것이 문법과 경고의 힘을 함께 보존합니다.
  doctrine_reference: Preserve grammatical force and prophetic address.
