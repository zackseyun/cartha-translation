base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/010.yaml
  text: And now know that you are prepared for the day of destruction[a], and do not hope that you sinners will live; rather, you will depart and die, for you do not know any ransom[d][c][b], because you have been made ready for it.
  footnotes:
  - marker: a
    text: Or 'for the day of slaughter.' The Ge'ez term can denote destructive ruin in a judgment setting and may carry the sharper sense of slaughter.
    reason: lexical_alternative
  - marker: b
    text: The clause 'that sinners will live' may also be understood more directly as 'that you sinners will live,' since the warning is addressed to the wicked.
    reason: lexical_alternative
  - marker: c
    text: '''Ransom'' here likely means a price or means of release from the coming judgment; the sense is that no escape remains.'
    reason: cultural_note
  - marker: d
    text: Or 'that sinners will live'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 너희는 멸망의 날을 위해 준비되었음을 알라. 그리고 너희 죄인들이 살 것이라고 바라지 마십시오. 오히려 너희는 떠나 죽을 것입니다. 너희는 어떤 속전도 알지 못하기 때문입니다. 이는 너희가 그 날을 위해 미리 마련되었기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸망의 날’은 심판적 파괴를 가리키며, 문맥상 ‘도살의 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘너희 죄인들이 살 것이라고’는 더 직접적으로 ‘너희 죄인들이 살 것이라고’로 이해될 수 있습니다.
    reason: previous_rendering
  - marker: c
    text: 여기서 ‘속전’은 다가오는 심판에서 풀려나게 하는 값 또는 해제 수단을 뜻합니다.
    reason: cultural_note
