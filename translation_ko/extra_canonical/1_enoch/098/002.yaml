  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 목록은 물질적 호사와 외적 위세의 누적이므로, 관계적 의미의 ‘존귀’보다 시각적·사회적 화려함을 드러내는 ‘장엄함’이 적절합니다.
- source_word: ከመ ማይ ይትከዐዉ
  english_pob_choice: they will be poured out like water
  chosen_korean: 물처럼 쏟아져 버릴 것입니다
  alternatives_korean:
