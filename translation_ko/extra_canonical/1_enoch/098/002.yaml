  rationale: 이 절은 외적 장식의 탐닉을 말하므로, 물건보다는 그 대상을 향한 선호를 드러내는 ‘아름다움’이 가장 무난합니다.
- source_word: ኅብረ
  english_pob_choice: companionship
  chosen_korean: 사귐
  alternatives_korean:
  - 교제
  - 동반
  - 친교
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '`ኅብረ`의 결합·동반 의미를 살리되, 음란하거나 호사스러운 동반 관계의 뉘앙스를 한국어로 비교적 간결하게 드러내기 위해 ‘사귐’을 택했습니다.'
- source_word: ወበዕበይ / ወበሥልጣን
  english_pob_choice: in greatness / in authority
  chosen_korean: 위대함과 권세
  alternatives_korean:
