theological_decisions:
- issue: 이 절의 비판 대상이 성적 문란인지, 사치 전반인지
  chosen_reading: 본문은 여자/처녀와의 비교를 포함하지만, 뒤이은 왕권·권세·은금·자주색·장엄함·음식의 열거가 사치와 호사 전반을 비판하는 흐름으로 읽히도록 유지했습니다.
  alternative_readings:
  - 성적 방종을 중심으로 한 비판
  - 사회적·경제적 사치를 중심으로 한 비판
  rationale: Ge'ez 비교구와 물질 목록이 함께 있으므로, 어느 한쪽으로만 좁히지 않고 긴장을 보존하는 편이 원문에 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
