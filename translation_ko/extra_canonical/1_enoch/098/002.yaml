  terminology: ‘너희 남자들’, ‘왕권’, ‘권세’, ‘은과 금’, ‘자주색 옷’은 적절합니다. 사치 목록의 ወክብር은 이 문맥에서 ‘장엄함’보다 ‘화려함’이 자연스럽습니다. 현 각주의 ‘호사와 방종’ 및 성적 함의는 본문의 어휘가 확정하지 않는 해석을 덧붙이므로 삭제하는 것이 좋습니다.
