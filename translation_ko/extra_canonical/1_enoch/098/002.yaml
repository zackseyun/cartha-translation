  - 위엄과 통치권
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 열거 구조를 유지하면서 `ዕበይ`의 크고 높은 상태는 ‘위대함’으로, `ሥልጣን`은 지배력을 드러내는 ‘권세’로 옮겼습니다.
- source_word: ወበብሩር / ወወርቅ / ወሜላት
  english_pob_choice: in silver and gold and purple
  chosen_korean: 은과 금과 자주색 옷
  alternatives_korean:
  - 은과 금과 자주색
  - 은과 금과 자주빛 비단
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '`ወሜላት`은 값비싼 염색 직물의 문화적 표지이므로, 색 자체보다 실제 사치품을 드러내는 ‘자주색 옷’으로 옮겼습니다.'
- source_word: ወክብር
  english_pob_choice: splendor
  chosen_korean: 장엄함
  alternatives_korean:
  - 영광
