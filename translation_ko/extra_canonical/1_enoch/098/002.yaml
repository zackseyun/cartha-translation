    rationale: 원문의 현재적 ‘love’와 맞지 않으며, 여자들과 처녀들이 각각 치장과 교제의 비교 대상이라는 구조가 한국어 문장에서 흐려집니다.
  - severity: medium
    issue: 각주가 본문에 없는 방종·호사 및 성적 관계의 해석을 단정적으로 보탬
    rationale: ‘교제’의 정확한 뉘앙스에는 여지가 있으나, 본문과 영어 감사 기록은 이를 우선 ‘companionship’으로 제시합니다. 현 각주는 불필요하게 특정 해석으로 좁힙니다.
