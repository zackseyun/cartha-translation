base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/002.yaml
  text: For you men love adornment on yourselves more than women[a], and companionship more than a virgin; in kingship and in greatness and in authority and in silver and gold and purple[d][c][b], and in splendor and in food they will be poured out like water.
  footnotes:
  - marker: a
    text: The phrases 'deeds of excess from women' and 'fellowship of excess from virgins' are difficult. The preposition literally reads 'from,' but the sense may be 'with women' and 'with virgins,' referring to indulgent or illicit association.
    reason: lexical_alternative
  - marker: b
    text: '''Purple'' likely refers to costly dyed cloth, a standard image of elite luxury and status.'
    reason: cultural_note
  - marker: c
    text: The final image may mean either that these luxuries are lavished wastefully or that they themselves will dissipate like water.
    reason: alternative_reading
  - marker: d
    text: Or 'For you have prepared for yourselves deeds of excess from women, and fellowship of excess from virgins;'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 너희 남자들은 여자들보다, 그리고 처녀들보다 더 아름다움과 사귐을 사랑하였으며, 왕권과 위대함과 권세와 은과 금과 자주색 옷과 장엄함과 음식에 있어서는 물처럼 쏟아져 버릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사귐’은 여기서 단순한 우정이 아니라, 호사와 방종이 뒤섞인 동반·교제의 관계를 가리킬 수 있습니다.
    reason: lexical_alternative
