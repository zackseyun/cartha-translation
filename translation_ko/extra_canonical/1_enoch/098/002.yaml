  source_fidelity: 현 번역은 2인칭 복수 호칭과 비교 구문, 그리고 마지막 수동 미래 표현을 대체로 반영합니다. 그러나 ሥነ는 이 문맥에서 ‘아름다움’ 일반보다 몸에 하는 ‘치장/장식’으로 옮기는 것이 정확하며, ‘사랑하였으며’라는 과거형은 현재적 ‘love’와 맞지 않습니다. 또한 마지막 동사의 복수 수동형이 앞의 사치 목록을 가리키도록 한국어 문장 구조를 명료하게 해야 합니다.
