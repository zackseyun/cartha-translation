  terminology: '''영,'' ''마음,'' ''죄,'' ''하늘,'' ''기록되다,'' and ''지극히 높으신 분'' are appropriate. ''기록되다'' suitably retains the register/document imagery without imposing a doctrinal interpretation.'
  issues:
