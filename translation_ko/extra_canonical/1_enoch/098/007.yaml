base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/007.yaml
  text: And do not imagine in your spirit[a], and do not say in your heart[c][b], that you do not know and do not see that every sin is written in heaven every day before the Most High.
  footnotes:
  - marker: a
    text: Or 'is recorded in heaven.' The image is of a heavenly written register of sins before God.
    reason: lexical_alternative
  - marker: b
    text: 'The phrase rendered ''every day'' may also carry the sense of continual presence: the record stands before the Most High day by day.'
    reason: lexical_alternative
  - marker: c
    text: Or '‘We do not know, and we do not see, that every sin is written down in heaven every day before the Most High.’'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희 영 안에서 상상하지 말고, 마음속으로도 너희가 알지 못하고 보지 못한다고 말하지 마십시오. 모든 죄는 하늘에 기록되어[a], 날마다 지극히 높으신 분 앞에 놓여 있습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘에 쓰여 있다’ 또는 ‘하늘에 기록되어 있다’로 옮길 수 있습니다. 죄가 천상 장부에 기록되는 이미지를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘날마다’는 그 기록이 날마다 지극히 높으신 분 앞에 계속 놓여 있음을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢታምስሉ
  english_pob_choice: do not imagine
  chosen_korean: 상상하지 말라
  alternatives_korean:
  - 생각하지 말라
  - 짐작하지 말라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 내적 자기기만을 경계하는 금지이므로, 단순한 '생각'보다 '상상하다'가 의도된 내면의 허구적 가정을 더 잘 드러냅니다.
- source_word: በመንፈስክሙ
  english_pob_choice: in your spirit
  chosen_korean: 영 안에서
  alternatives_korean:
  - 마음속에서
  - 속으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역상 '영'이 맞으며, 본문이 '마음'과 병렬로 내적 인간을 말하므로 심리학적 표현으로만 평탄화하지 않았습니다.
- source_word: በልብክሙ
  english_pob_choice: in your heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 마음 안에서
  - 속마음으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 성서적 관용어인 '마음'을 유지하되, 한국어에서 자연스러운 부사구로 옮겨 내적 발화를 살렸습니다.
- source_word: ኢታእምሩ / ወኢትሬእዩ
  english_pob_choice: you do not know and you do not see
  chosen_korean: 너희가 알지 못하고 보지 못한다는 식으로
  alternatives_korean:
  - 너희가 알지 못하고 보지 못한다고
  - 너희가 모르고 보지 못한다고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시문 속 간접화법을 반영해 2인칭 복수의 진술을 그대로 살렸고, '보지 못하다'는 도덕적·인식적 실명 이미지를 유지합니다.
- source_word: በሰማይ ይጸሐፍ
  english_pob_choice: is written down in heaven
  chosen_korean: 하늘에 … 기록되어 있기 때문입니다
  alternatives_korean:
  - 하늘에 … 기록되어 있습니다
  - 하늘에 … 쓰여 있기 때문입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천상 문서의 이미지를 한국어에서 가장 분명하게 드러내는 동사는 '기록되다'이며, 단순한 '쓰다'보다 심판 문맥의 등록부 뉘앙스를 보존합니다.
- source_word: በቅድሜሁ ለልዑል
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에
  alternatives_korean:
  - 지극히 높으신 이 앞에
  - 가장 높으신 분 앞에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 신적 칭호를 한국어 경어로 옮겨 위엄을 살렸고, '앞에'는 법정적·공적 진술의 위치성을 보존합니다.
theological_decisions:
- issue: 하늘에 기록된 죄의 장부 이미지
  chosen_reading: 죄들은 하나님 앞의 단순한 인지 대상이 아니라, 하늘에 날마다 기록되는 천상 문서의 대상으로 제시됩니다.
  alternative_readings:
  - 단지 하나님이 아신다는 일반적 진술
  - 상징적 표현으로만 약화하는 읽기
  rationale: 게즈 본문의 '기록되다'와 '하늘에'라는 표현이 실제 장부 이미지에 강하게 기울어 있으므로, 이를 일반적 전지 개념으로 평탄화하지 않았습니다.
  doctrine_reference: 묵시문학적 심판 이미지 보존
- issue: 직접 인용이 아닌 간접 진술
  chosen_reading: 게즈 동사형에 따라 '너희가 알지 못하고 보지 못한다는 식으로'라는 간접화법을 유지했습니다.
  alternative_readings:
  - '''우리는 알지 못하고 보지 못한다''라는 직접 인용'
  - 직접 따옴표로 처리
  rationale: 2인칭 복수 동사의 문법을 반영해야 하므로, 내용절로 처리하는 편이 원문 구조에 더 충실합니다.
  doctrine_reference: 문법-의미 일치
