    rationale: '''때문입니다'' makes the final statement the stated reason for the prohibition. The source/English audit presents the assertion as the embedded content following ''do not say,'' rather than requiring this Korean causal restructuring.'
  - severity: medium
    issue: Paraphrastic '…다는 식으로'
    rationale: This adds an idiomatic qualification not present in the source and weakens the direct content clause.
  - severity: medium
    issue: Omission of the continuing-presence nuance
    rationale: The source includes ሀሎ with 'every day,' supporting the sense that the written record stands/is present before the Most High day by day. The draft instead treats '날마다' only as modifying the writing.
  - severity: low
    issue: Register inconsistency
    rationale: The required modern formal-polite 합쇼체 should consistently use forms such as '마십시오' and '있습니다,' not mix them with '말라.'
  - severity: low
    issue: Footnote anchors are not placed at their referents
    rationale: Footnote a concerns '기록되어,' and footnote b concerns '날마다'; each should immediately follow the relevant wording.
