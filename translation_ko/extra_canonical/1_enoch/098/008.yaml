base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/008.yaml
  text: From now on[b][a], know that all your violence that you commit is being written down every day until the day of your judgment.
  footnotes:
  - marker: a
    text: Or 'your oppression'; the Ge'ez term can denote violent injustice, not only physical violence.
    reason: lexical_alternative
  - marker: b
    text: The wording evokes the apocalyptic theme that deeds are recorded in preparation for the day of judgment.
    reason: cross_reference
translation:
  language: ko
  text: 이제부터 아십시오. 여러분이 저지르는 모든 폭력[a]은 여러분의 심판의 날까지 날마다 기록되고 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘폭력’으로 옮긴 게에즈어 표현은 물리적 폭력뿐 아니라 압제와 폭력적 불의를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 행위가 심판의 날을 앞두고 기록된다는 묵시문학적 주제를 떠올리게 합니다.
    reason: cross_reference
