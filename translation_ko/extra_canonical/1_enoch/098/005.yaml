base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/005.yaml
  text: And barrenness was not given to a woman[a]; rather[c][b], because of the work of her hands she dies childless.
  footnotes:
  - marker: a
    text: Or 'sterility was not allotted to the woman.' The Ge'ez wording contrasts barrenness with death as the actual judgment.
    reason: lexical_alternative
  - marker: b
    text: '''The work of her hands'' is an idiom for her deeds or actions.'
    reason: cultural_note
  - marker: c
    text: Or 'to the woman; rather, because of the work of her hands she will die'.
    reason: previous_rendering
translation:
  language: ko
  text: 여자에게 불임이 주어지는 것이 아니라, 오히려 손으로 한 일 때문에 자녀 없이 죽습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여자에게 불임이 할당되는 것이 아닙니다.’ 원문은 불임과 실제 심판으로서의 죽음을 대조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손으로 한 일’은 그 사람의 행위나 행동을 가리키는 관용구입니다.
    reason: cultural_note
