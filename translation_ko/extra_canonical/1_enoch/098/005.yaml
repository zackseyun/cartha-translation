theological_decisions:
- issue: 일반 진술로서의 문장 형식
  chosen_reading: 이 절은 특정 한 사람의 예언이라기보다, 어떤 여자에게도 불임이 주어지지 않고 행위의 결과로 죽어 자녀 없이 끝난다는 일반 원리를 진술하는 것으로 옮겼습니다.
  alternative_readings:
  - 특정 여성에 대한 개별적 심판으로 읽을 수 있습니다.
  - ‘불임’ 자체보다 죽음이 실제 심판이라는 대비를 더 강하게 읽을 수 있습니다.
  rationale: 문맥의 격언적 성격과 원문의 무관사적 표현을 반영하기 위해, 특정 인물보다 일반 원리로 읽는 해석을 유지했습니다.
  doctrine_reference: 본문의 일반화된 경구성, 원문 우선 원칙
- issue: ‘손으로 한 일’의 도덕적 함의
  chosen_reading: ‘손으로 한 일’은 단순 노동이 아니라 행위 전체를 가리키는 관용구로 처리했으며, 구체적 죄목은 본문 밖에서 단정하지 않았습니다.
  alternative_readings:
  - 특정한 불법 행위나 폭력으로 좁혀 읽을 수 있습니다.
  - 단순한 일상적 행동으로 완화해 읽을 수 있습니다.
  rationale: 원문은 행위의 성격을 구체화하지 않으므로, 관용구로서의 의미만 보존하고 지나친 규정을 피했습니다.
  doctrine_reference: 문맥이 허용하는 범위 안에서만 해석
