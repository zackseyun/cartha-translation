  rationale: 수동태 ‘주다’의 뜻을 그대로 살려, 불임이 어떤 이에게 ‘주어지는’ 것으로 말하는 원문의 진술 방식을 유지했습니다.
- source_word: በእንተ ግብረ እዴሃ
