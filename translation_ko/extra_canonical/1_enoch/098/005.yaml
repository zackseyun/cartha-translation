  terminology: ‘불임,’ ‘손으로 한 일,’ and ‘자녀 없이’ faithfully convey the relevant terms. ‘손으로 한 일’ appropriately preserves the idiom without specifying the deeds. The notes should likewise use the generic wording rather than ‘그녀.’
