base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/001.yaml
  text: And now I swear to you[a], to the wise and to the foolish[b], that you will see much upon the earth.
  footnotes:
  - marker: a
    text: Or 'many things.' The Ge'ez expression emphasizes abundance in what the hearers are about to witness.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''And now I declare to you, to the wise and to the foolish: for you will see much upon the earth.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 이제 나는 지혜로운 이들과 어리석은 이들에게 맹세합니다. 너희는 땅 위에서 많은 것을 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 것’은 ‘많은 일들’로도 옮길 수 있습니다. 이 표현은 너희가 땅 위에서 보게 될 것이 풍성함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 지금
  - 이제는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 새로운 엄숙한 경고 발화를 여는 시간 표지이므로, 한국어에서는 간결한 ‘이제’가 가장 자연스럽고 문맥의 전환도 분명하게 드러냅니다.
- source_word: እምሕል
  english_pob_choice: I swear
  chosen_korean: 맹세합니다
  alternatives_korean:
  - 맹세하겠습니다
  - 선언합니다
  - 말합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사는 단순한 발화가 아니라 맹세 행위를 뜻하므로, 이를 약화하지 않고 직접적으로 ‘맹세합니다’로 옮겼습니다.
- source_word: ለጠቢባን ወለአብዳን
  english_pob_choice: to the wise and to the foolish
  chosen_korean: 지혜로운 자들에게와 어리석은 자들에게
  alternatives_korean:
  - 지혜로운 이들과 어리석은 이들에게
  - 지혜자들과 어리석은 자들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대조 구조를 살리기 위해 두 집단을 병렬로 유지했으며, ‘자들’은 집단성을 분명히 하면서도 본문의 도덕적 대비를 잘 드러냅니다.
- source_word: ብዙኅ ትሬእዩ ዲበ ምድር
  english_pob_choice: you will see much upon the earth
  chosen_korean: 땅 위에서 많은 것을 보게 될 것입니다
  alternatives_korean:
  - 땅 위에서 많은 것을 보게 됩니다
  - 땅 위에서 많은 일들을 보게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘많은 것’을 보게 된다는 아브스트랙트한 표현을 한국어에서 자연스럽게 풀어, 단순한 수량이 아니라 앞으로 목격할 풍성한 사건들을 포괄하게 했습니다.
theological_decisions:
- issue: 맹세문의 직접성
  chosen_reading: 발화자가 자기 자신을 내세워 청자에게 맹세하는 엄숙한 선포로 유지했습니다.
  alternative_readings:
  - 단순한 선언이나 예고로 완화하는 읽기
  - 강한 서두 표현으로 처리하되 맹세의 성격을 약화하는 읽기
  rationale: 문맥상 게에즈 동사는 반복되는 맹세 공식의 일부이므로, 이를 약화하면 본문의 수사적 긴장과 권위를 잃게 됩니다.
  doctrine_reference: 본문의 수사적 장치와 엄숙한 서약 형식을 보존함.
