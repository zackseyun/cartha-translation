  - 말합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 동사는 단순한 발화가 아니라 맹세 행위를 뜻하므로, 이를 약화하지 않고 직접적으로 ‘맹세합니다’로 옮겼습니다.
- source_word: ለጠቢባን ወለአብዳን
