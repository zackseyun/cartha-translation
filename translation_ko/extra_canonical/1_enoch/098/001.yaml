  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 새로운 엄숙한 경고 발화를 여는 시간 표지이므로, 한국어에서는 간결한 ‘이제’가 가장 자연스럽고 문맥의 전환도 분명하게 드러냅니다.
