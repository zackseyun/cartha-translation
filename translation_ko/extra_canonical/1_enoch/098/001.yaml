  - marker: a
    text: Or 'many things.' The Ge'ez expression emphasizes abundance in what the hearers are about to witness.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''And now I declare to you, to the wise and to the foolish: for you will see much upon the earth.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 이제 나는 너희에게, 지혜로운 자들에게와 어리석은 자들에게 맹세합니다. 너희는 땅 위에서 많은 것을 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘많은 것들’이지만, 문맥상 앞으로 목격하게 될 사건들의 풍성함을 가리키는 표현으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
