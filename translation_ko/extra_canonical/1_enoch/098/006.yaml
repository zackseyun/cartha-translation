revisions:
- from: 나는 너희 죄인들에게, 큰 거룩하신 분을 두고 맹세합니다. 너희의 모든 악한 행위는 하늘들에 드러나 있으며, 너희의 모든 폭력의 행위는 가려져 있거나 숨겨져 있지 않습니다.[a][b]
  to: 나는 죄인들인 너희에게 위대하시고 거룩하신 분[a]을 두고 맹세합니다. 너희의 모든 악한 행위는 하늘들[b]에 드러나 있으며, 너희가 저지른 폭력 행위 가운데 가려져 있거나 숨겨져 있는 것은 하나도 없습니다.
  rationale: The revision corrects unnatural Korean adjective stacking, removes an unnecessary quantifier in the final clause, and renders the negative-existential construction explicitly and idiomatically. It retains the source’s contrast between evil deeds disclosed in the heavens and violent deeds that are not covered or concealed. Footnote anchors have been moved to the expressions they explain.
