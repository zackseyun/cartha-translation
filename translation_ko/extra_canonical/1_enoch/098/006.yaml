base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/006.yaml
  text: I have sworn to you[a], sinners, by the Great Holy One, that all your evil deeds are revealed in the heavens[b], and none of your deeds of violence are covered or hidden.
  footnotes:
  - marker: a
    text: The final clause is textually difficult in the OCR witness. The Ge'ez likely conveys that the sinners' violent deeds are preserved in a heavenly record; more specific renderings such as 'inscribed' or 'sealed up' remain possible.
    reason: textual_variant
  - marker: b
    text: Or 'and your deeds of violence are written down and recorded.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 너희 죄인들에게, 큰 거룩하신 분을 두고 맹세합니다. 너희의 모든 악한 행위는 하늘들에 드러나 있으며, 너희의 모든 폭력의 행위는 가려져 있거나 숨겨져 있지 않습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 거룩하신 분’은 고정된 전례어보다 원문의 두 수식어를 직접 살린 표현입니다.
    reason: korean_style_note
  - marker: b
    text: ‘하늘들’은 게에즈 복수형을 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: መሐልኩ
  english_pob_choice: I have sworn
  chosen_korean: 맹세합니다
  alternatives_korean:
  - 맹세하였습니다
  - 맹세하노라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 맹세의 수행성을 살리면서도 한국어 합쇼체에 자연스럽게 맞추었습니다.
- source_word: ኃጥኣን
  english_pob_choice: sinners
  chosen_korean: 죄인들에게
  alternatives_korean:
  - 죄인들
  - 악인들에게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 خطاب의 직접 호칭을 유지하기 위해 ‘죄인들’보다 조사까지 포함한 ‘죄인들에게’로 옮겼습니다.
- source_word: በቅዱስ ዐቢይ
  english_pob_choice: by the Great Holy One
  chosen_korean: 큰 거룩하신 분을 두고
  alternatives_korean:
  - 위대하신 거룩한 분을 두고
  - 크신 거룩하신 분을 두고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 형용사를 모두 살리되, 한국어에서 신적 칭호로 과도하게 고정되지 않도록 ‘거룩하신 분’을 중심으로 자연스럽게 재구성했습니다.
- source_word: ኵሉ ግብርክሙ እኩይ + ግብረ ግፍዕ
  english_pob_choice: all your evil deeds / deeds of violence
  chosen_korean: 너희의 모든 악한 행위 / 너희의 모든 폭력의 행위
  alternatives_korean:
  - 너희의 모든 악한 일 / 너희의 모든 폭력의 일
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘행위’는 ግብር의 행위·업적 의미를 살리며, ግፍዕ는 단순한 악행보다 신체적·사회적 폭력의 뉘앙스를 드러내기 위해 ‘폭력의 행위’로 옮겼습니다.
- source_word: ክሡት ውእቱ በሰማያት
  english_pob_choice: are revealed in the heavens
  chosen_korean: 하늘들에 드러나 있으며
  alternatives_korean:
  - 하늘에 드러나 있으며
  - 하늘들에서 드러나 있으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수형 ‘하늘들’을 살려 에녹서의 우주론적 표현을 보존했고, ክሡት는 ‘드러나다’로 옮겨 공개·노출의 뜻을 유지했습니다.
- source_word: ክዱነ ወእኁቡአ
  english_pob_choice: covered or hidden
  chosen_korean: 가려져 있거나 숨겨져 있지 않습니다
  alternatives_korean:
  - 덮여 있거나 숨겨져 있지 않습니다
  - 가려지거나 숨겨지지 않습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부정 구문을 분명히 드러내기 위해 ‘~하지 않습니다’ 구조로 옮기고, 두 동사의 병렬을 유지했습니다.
theological_decisions:
- issue: 하늘들(복수)과 심판적 계시의 이미지
  chosen_reading: 하늘들에 드러나 있으며
  alternative_readings:
  - 하늘에 드러나 있으며
  - 하늘에서 드러나 있으며
  rationale: 단수 ‘하늘’로 평준화하지 않고 복수형을 살려, 본문의 묵시적 우주 질서와 공개적 심판 이미지를 보존했습니다.
  doctrine_reference: Apocalyptic cosmology should remain visible in translation.
- issue: 마지막 부정문을 ‘기록됨’이 아니라 ‘가려져/숨겨져 있지 않음’으로 번역
  chosen_reading: 너희의 모든 폭력의 행위는 가려져 있거나 숨겨져 있지 않습니다
  alternative_readings:
  - 기록되어 있습니다
  - 감추어져 있습니다
  rationale: 게에즈의 부정 존재 구문은 ‘숨김 없음’에 더 가깝기 때문에, 천상 기록론으로 과도하게 특정하지 않고 공개/비은폐의 대비를 유지했습니다.
  doctrine_reference: Preserve textual tension rather than harmonize into a single metaphor.
