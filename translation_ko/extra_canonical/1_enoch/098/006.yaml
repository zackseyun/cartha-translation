  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수형 ‘하늘들’을 살려 에녹서의 우주론적 표현을 보존했고, ክሡት는 ‘드러나다’로 옮겨 공개·노출의 뜻을 유지했습니다.
- source_word: ክዱነ ወእኁቡአ
  english_pob_choice: covered or hidden
  chosen_korean: 가려져 있거나 숨겨져 있지 않습니다
