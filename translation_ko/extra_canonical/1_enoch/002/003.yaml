theological_decisions:
- issue: 자연 관찰 명령의 어조
  chosen_reading: 직접적인 권면으로서의 명령형을 유지해, 피조세계를 통해 하나님의 질서를 보게 하는 문맥을 살렸습니다.
  alternative_readings:
  - 부드러운 서술형으로 완화
  - 권고형으로 약화
  rationale: 본문은 단순 정보 전달이 아니라 관찰을 촉구하는 문장 구조이므로, 명령적 힘을 유지하는 것이 원문 효과에 부합합니다.
  doctrine_reference: 창조 질서와 섭리에 대한 묵상
- issue: ‘온 땅’의 범위
  chosen_reading: 지리적 ‘땅’이 아니라 창조 전체를 향한 보편적 관찰로 읽었습니다.
  alternative_readings:
  - 특정 지역의 땅
  - 토지
  rationale: 게에즈 표현과 영어 POB의 ‘whole earth’가 모두 보편적 범위를 가리키므로, 축소하지 않는 것이 필요합니다.
  doctrine_reference: 창조의 보편성
