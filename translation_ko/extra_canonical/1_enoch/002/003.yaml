base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/003.yaml
  text: Look at the summer and the winter[a], how the whole earth is filled with water[b], and clouds and dew and rain rest upon it.
  footnotes:
  - marker: a
    text: The seasonal pair 'summer and winter' reflects the Ge'ez wording directly. In the Ethiopian setting, 'winter' may evoke the wet season more than a cold season in the modern English sense.
    reason: cultural_note
  - marker: b
    text: The term rendered 'dew' can be difficult in isolation, but in this list of weather phenomena it most likely refers to moisture such as dew rather than a non-meteorological sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 여름과 겨울을 보십시오[a]. 온 땅이 물로 가득 차 있고, 구름과 이슬[b]과 비가 그 위에 머뭅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어의 계절쌍을 그대로 옮긴 표현입니다. 에티오피아 문맥에서 ‘겨울’은 현대 한국어에서 말하는 추운 겨울보다 우기 또는 습한 계절을 떠올리게 할 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘이슬’로 옮긴 말은 단독으로는 뜻이 다소 불확실할 수 있습니다. 그러나 물, 구름, 비와 함께 열거되는 이 문맥에서는 이슬과 같은 수분 현상을 가리키는 것으로 보는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
