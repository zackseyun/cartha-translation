base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/002.yaml
  text: Look at the earth and understand concerning the works that are done upon it from the beginning to their completion[a], that none of the works of God changes[d][c][b], as they appear.
  footnotes:
  - marker: a
    text: Or 'all the works of God do not change.' The Ge'ez wording can be taken collectively or distributively.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be understood as 'while he shows [this]' or 'as it is shown,' depending on how the verbal form is construed.
    reason: alternative_reading
  - marker: c
    text: Or 'as he shows them'.
    reason: previous_rendering
  - marker: d
    text: Or 'the works that are done upon it from the beginning to its completion'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅을 보고, 그 위에서 처음부터 그 일들이 완성되기까지 이루어지는 일들을 깨달으십시오. 하나님의 모든 일은 드러나는 그대로 변하지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절은 문법적으로 ‘그가 이것을 보이시는 동안’ 또는 ‘그것이 보이는 대로’로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ርእይዋ
  english_pob_choice: Look at it / look
  chosen_korean: 보며
  alternatives_korean:
  - 살펴보십시오
  - 바라보십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대상을 먼저 관찰하라는 직접 명령을 자연스러운 현대 한국어로 살리기 위해 ‘보며’로 옮겼습니다.
- source_word: ለምድር
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 지구
  - 대지
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 우주적 관찰의 문맥에서 ‘땅’이 현대 한국어로 가장 자연스럽고, 넓은 창조 세계를 가리키는 기능을 유지합니다.
- source_word: ወለብዉ በእንተ ምግባር
  english_pob_choice: understand concerning the works
  chosen_korean: 이루어지는 일들을 이해하십시오
  alternatives_korean:
  - 일들을 살피십시오
  - 행위들을 이해하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ወለብዉ’의 인지적 도달을 ‘이해하십시오’로, ‘ምግባር’을 문맥상 ‘일들’로 옮겨 창조 질서의 관찰을 자연스럽게 드러냈습니다.
- source_word: ከመ ኢይትመየጥ ኵሉ ምግባረ ለአምላክ
  english_pob_choice: that none of the works of God changes
  chosen_korean: 하나님의 모든 일은 나타나는 대로 변하지 않습니다
  alternatives_korean:
  - 하나님의 모든 일은 변하지 않습니다
  - 하나님의 일들은 변하지 않습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 핵심은 하나님의 일들의 변동 없음이므로 이를 한국어에서 분명히 살리되, ‘나타나는 대로’로 후행 분사구의 보이는/드러나는 상태를 반영했습니다.
- source_word: እንዘ ያስተርኢ
  english_pob_choice: as they appear
  chosen_korean: 나타나는 대로
  alternatives_korean:
  - 보이는 대로
  - 드러나는 대로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영어 주석처럼 이 동사는 ‘보이게 하다’가 아니라 ‘나타나다/보이다’의 뜻이므로, 수동·중간적 뉘앙스를 살려 옮겼습니다.
theological_decisions:
- issue: 이 구절이 하나님의 절대적 불변성인지, 창조 질서 안에서 관찰되는 하나님의 일의 규칙성인지
  chosen_reading: 창조 세계를 관찰하며 하나님의 일들이 질서 있게 변치 않고 드러난다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 하나님이 어떤 일도 절대 바꾸지 않으신다는 형이상학적 진술
  - 계절 변화 같은 자연의 규칙성만 말하는 진술
  rationale: 문맥이 땅을 ‘보라’고 한 뒤 이해를 요구하므로, 구절은 창조의 질서 속에서 드러나는 하나님의 일의 안정성을 말하는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 우선; 신학적 긴장은 지나치게 체계화하지 않고 보존합니다.
