base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/001.yaml
  text: 'Consider all the works in heaven: how they do not alter their paths[a], and the lights in heaven, how all of them rise and set in order, each in its season[c][b], and do not transgress their appointed order.'
  footnotes:
  - marker: a
    text: Or 'do not change their courses.' The Ge'ez wording points to fixed heavenly paths.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'appointed order' may also be rendered 'ordinance' or 'rule,' emphasizing that the heavenly lights keep the order set for them.
    reason: lexical_alternative
  - marker: c
    text: Or 'transgress against their appointed order'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘의 모든 일들을 살피십시오. 그들이 어떻게 자기 길을 바꾸지 않는지, 그리고 하늘의 빛들이 어떻게 모두 제때에 떠올랐다가 저물며, 정해진 질서를 어기지 않는지 살피십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 길’은 영어 POB의 ‘paths’에 대응하며, 하늘의 고정된 운행 경로를 뜻합니다.
    reason: source_note
  - marker: b
    text: ‘정해진 질서’는 ‘규례’, ‘규칙’, ‘명령’으로도 옮길 수 있지만, 여기서는 우주적 질서와 규범성을 함께 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘제때에’는 ‘각기 그 계절에’ 또는 ‘각자의 때에’로도 옮길 수 있습니다.
    reason: lexical_alternative
