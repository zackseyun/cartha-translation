- from: 한옥이 쓴 책은 곧—[한옥이 참으로 모든 지혜의 표징을 기록하였으며, 모든 사람에게 칭찬을 받고 온 땅의 재판관이 되었습니다]—땅에 사는 내 모든 자녀와, 의와 평강을 행하는 장차 올 세대를 위한 것입니다.[a][b][c][d]
