  chosen_reading: 도입하지 않고, 원문이 분명히 지시하는 수신 범위인 ‘장차 올 세대’로 정리했습니다.
  alternative_readings:
  - 택함 받은 자들
  - 선택된 세대
  rationale: 제공된 정정 이력에 따라 이 절의 핵심은 ‘미래 세대’이며, 선택론적 용어는 본문이 요구하지 않습니다. 의미를 과장하지 않고 문맥의 수신 대상을 보존했습니다.
  doctrine_reference: Preserve the local referent of the passage; do not import later doctrinal terminology without source warrant.
