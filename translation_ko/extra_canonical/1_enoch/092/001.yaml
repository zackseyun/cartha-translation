  rationale: 수신자와 관계절의 연결은 유지하되, ‘마른 땅’의 어휘적 구체성을 복원했습니다. 불안정한 괄호 구절에는 원문이 요구하지 않는 ‘되었다’의 변화 의미를 피하고, 고유명은 표준 한국어 문헌에서 통용되는 ‘에녹’으로 통일했습니다. 각주도 실제 본문 앵커와 그 기능에 맞게 다시 배치했습니다.
