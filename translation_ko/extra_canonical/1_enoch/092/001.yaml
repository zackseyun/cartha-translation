- source_word: ስቡሕ
  english_pob_choice: praised among all people
  chosen_korean: 모든 사람에게 칭찬을 받고
  alternatives_korean:
  - 모든 사람 가운데서 칭찬을 받고
  - 모든 사람에게서 찬양을 받고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 피동적/수동적 뉘앙스를 살려 ‘칭찬을 받고’로 옮겼고, ‘among’의 관계성은 자연스러운 한국어 표현으로 처리했습니다.
- source_word: መኰንነ ኵሉ ምድር
