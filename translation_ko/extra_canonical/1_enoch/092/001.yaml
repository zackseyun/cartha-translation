  source_fidelity: 수신자인 ‘내 모든 자녀’는 ‘마른 땅에 살’이라는 관계절의 수식을 받고, ‘장차 올 세대’는 ‘의와 평강을 행하는’이라는 수식을 받는 것으로 옮긴 점은 적절합니다. 그러나 ‘땅에 사는’은 የብስ의 구체적인 ‘마른 땅/육지’ 의미를 약화합니다. 괄호 안의 불안정한 구절에서 መኰንነ는 ‘재판관’이라는 서술적 지위이지 ‘재판관이 되었습니다’라는 변화 완료를 요구하지 않습니다.
  naturalness: 초안의 ‘한옥이 쓴 책은 곧—…—… 위한 것입니다’는 ‘곧’과 대시 삽입 때문에 문장 골격이 다소 부자연스럽습니다. ‘이것은 … 위한 책입니다’로 정리하면 현대 한국어 합쇼체에서 자연스럽고, 원문의 표제적 성격도 유지됩니다.
  terminology: 한국어 성서 및 관련 문헌에서 통용되는 고유명은 ‘에녹’이므로 이를 사용했습니다. ‘의와 평강’은 원문의 윤리적·종말론적 어휘를 보존합니다. ‘마른 땅’은 직역적 어휘를 유지하되 주석으로 ‘육지’ 가능성을 밝혔습니다.
  issues:
