  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘재판관’은 판결/심판의 직능을 함께 살리면서도 한국어에서 지나치게 종교적 관용구로 굳지 않은 표현입니다.
- source_word: ለኵሎሙ ውሉድየ እለ የኃድሩ ዲበ የብስ
  english_pob_choice: for all my children who will dwell on the dry land
  chosen_korean: 땅에 사는 내 모든 자녀
