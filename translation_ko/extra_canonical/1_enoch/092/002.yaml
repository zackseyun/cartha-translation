  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부정 명령으로서 내면의 슬픔을 금하는 뜻을 살리되, ‘영’의 직접 목적어 구조를 한국어에서는 자연스럽게 풀어 옮겼습니다.
