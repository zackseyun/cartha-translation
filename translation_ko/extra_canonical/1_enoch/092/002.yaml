  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
  footnotes:
  - marker: a
    text: Or 'for everyone.' The Ge'ez phrase at the end is broad and may refer either to all things generally or to all persons.
    reason: lexical_alternative
translation:
  language: ko
  text: 시대들 때문에 여러분의 영이 슬퍼하지 않도록 하십시오. 거룩하고 위대하신 분께서 모두를 위하여[a] 날들을 정하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 것을 위하여’ 또는 ‘모든 사람을 위하여’. 문장 끝의 게에즈어 표현은 포괄적이어서, 모든 것 일반을 가리킬 수도 있고 모든 사람을 가리킬 수도 있습니다.
    reason: lexical_alternative
