  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
  footnotes:
  - marker: a
    text: Or 'for everyone.' The Ge'ez phrase at the end is broad and may refer either to all things generally or to all persons.
    reason: lexical_alternative
translation:
  language: ko
  text: 때들 때문에 여러분의 영이 슬퍼하지 않도록 하십시오. 왜냐하면 거룩하고 크신 분께서 모든 것들을 위하여 날들을 정해 두셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 사람을 위하여’. 문장 끝의 게에즈어 표현은 넓은 의미를 지니며, 모든 사물 일반 또는 모든 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: አትሕዝኑ
  english_pob_choice: Do not let ... be grieved
  chosen_korean: 슬퍼하지 않도록 하십시오
