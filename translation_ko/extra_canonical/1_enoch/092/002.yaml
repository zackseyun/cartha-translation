  chosen_korean: 모든 것들을 위하여
  alternatives_korean:
  - 모두를 위하여
  - 모든 사람을 위하여
  - 모든 것을 위하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 최종 수정 논의가 남긴 범위의 긴장을 보존하기 위해, 인물을 특정하지 않는 넓은 의미를 택했습니다. 게에즈어의 포괄성에 맞게 ‘모든 것들’을 유지하되 한국어에서는 ‘위하여’로 문맥을 자연스럽게 연결했습니다.
