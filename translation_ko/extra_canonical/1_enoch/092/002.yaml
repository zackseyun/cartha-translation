  rationale: 이 구절은 종말론적 시간 질서가 하나님께 속해 있다는 위로를 주므로, 대상을 인물로 좁히지 않고 포괄적 범위를 유지하는 편이 원문과 POB의 해석 긴장을 더 잘 보존합니다.
  doctrine_reference: 의미를 평탄화하지 말고, 문맥이 허용하는 범위의 모호성을 기록한다.
