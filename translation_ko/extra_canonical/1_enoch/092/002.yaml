  - 시대들로 인하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 전치사+복수 명사는 슬픔의 원인을 나타내므로, 한국어에서는 간결한 원인 표현으로 옮겼습니다. ‘때들’은 apocalyptic한 시기들의 복수성을 살립니다.
- source_word: ቅዱስ ወዐቢይ
