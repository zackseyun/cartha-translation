base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/003.yaml
  text: And the righteous one shall rise from sleep[a], and he shall arise and walk in the path of righteousness[d][c][b]; and all his path and his course shall be in goodness and in everlasting kindness.
  footnotes:
  - marker: a
    text: '"From sleep" may function as literal sleep imagery or as a figure for awakening into renewed life; the verse itself does not force one interpretation.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase could also be rendered "in everlasting mercy" or "in eternal favor," since the Ge'ez term can cover mercy, gentleness, and graciousness.
    reason: lexical_alternative
  - marker: c
    text: Or 'walk in the paths of righteousness'.
    reason: previous_rendering
  - marker: d
    text: Or 'and he shall arise'.
    reason: previous_rendering
translation:
  language: ko
  text: 의인은 잠에서 깨어날 것입니다[a]. 그는 일어나 의의 길로 걸을 것이며[c][d], 그의 모든 길과 그의 행로는 선함과 영원한 인자하심[b] 안에 있을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 문자적인 잠일 수도 있고, 새 생명으로 깨어나는 비유일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기의 말은 ‘영원한 자비’ 또는 ‘영원한 은총’으로도 옮길 수 있습니다. 원어는 긍휼, 온유, 호의의 범위를 포괄할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘의의 길들로 걸을’로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘일어나’로도 옮길 수 있습니다.
    reason: previous_rendering
