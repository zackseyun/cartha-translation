base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/002.yaml
  text: And I saw two rivers of fire[a], and the light of that fire shone like hyacinth[b], and I fell on my face before the Lord of Spirits.
  footnotes:
  - marker: a
    text: The Ge'ez term rendered 'hyacinth' likely refers to a gemstone; 'jacinth' is another possible English equivalent.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the light of that fire' is somewhat compressed in the Ge'ez and could also be understood more loosely as 'its fiery radiance.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나는 불의 두 강을 보았습니다. 그 불의 빛은 히아신스석[a]처럼 빛났습니다. 나는 영들의 주님 앞에 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 ያክንት은 보석을 가리키는 말로 보이며, ‘히아신스석’ 또는 ‘자신스석’으로 옮길 수 있습니다. 정확히 어떤 광물인지는 확실하지 않습니다.
    reason: lexical_alternative
