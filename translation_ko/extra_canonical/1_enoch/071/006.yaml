base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/006.yaml
  text: And my spirit saw the enclosure that surrounded that house of fire[a], and from its four sides were rivers full of living fire[d][c][b], and they surrounded that house.
  footnotes:
  - marker: a
    text: The repeated Ge'ez wording for 'encircle/surround' is retained in English as much as possible to preserve the verse's emphasis on enclosure.
    reason: lexical_alternative
  - marker: b
    text: '''Living fire'' is a literal rendering of an unusual phrase; it may denote fire that is animate, active, or intensely vital rather than ordinary flame.'
    reason: lexical_alternative
  - marker: c
    text: The term rendered 'sides' can also mean extremities or quarters; 'corners' is possible but less certain.
    reason: alternative_reading
  - marker: d
    text: Or 'the encircling wall that encircled that house of fire, and from its four sides were rivers full of living fire'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내 영이 그 집을 둘러싼 울타리를 보았고, 그 사방에서 생명 있는 불로 가득한 강들이 있었으며, 그것들이 그 집을 둘러쌌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 둘러쌈/포위의 동작을 반복해 강조하므로, 한국어도 이를 살려 장면의 폐쇄성과 압박감을 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘생명 있는 불’은 문자적으로는 매우 낯선 표현으로, 보통의 불보다 살아 움직이는 듯한 불을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘사방’은 여기의 ‘네 방향/네 변’에 해당할 수 있으며, ‘모서리들’로도 이해될 여지가 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: መንፈስየ
