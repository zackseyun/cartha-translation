base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/005.yaml
  text: And my spirit was covered in the heaven of heavens[a], and I saw there, in the midst of that light, something built of stones of hail[c][b], and in the midst of those stones were tongues of living fire.
  footnotes:
  - marker: a
    text: The line about what Enoch saw in the light is difficult in the Ethiopic. The translation renders it cautiously as a constructed thing or edifice within the radiance.
    reason: textual_variant
  - marker: b
    text: '''Stones of hail'' may also be understood as hailstones or possibly icy stones; the image is intentionally left concrete and strange.'
    reason: lexical_alternative
  - marker: c
    text: Or 'was taken up into'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내 영은 하늘들의 하늘에 가려졌습니다[a]. 나는 거기에서, 그 빛의 한가운데에, 우박 돌들로 지어진 어떤 것[c][b]을 보았고, 그 돌들 한가운데에는 살아 있는 불의 혀들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게이즈 동사는 ‘숨겨지다/가려지다’의 뜻을 지니며, 에녹 전승의 특유한 ‘감추어짐’ 표현을 반영했습니다.
    reason: source_note
  - marker: b
    text: ‘우박 돌들’은 우박덩이나 얼음 같은 돌을 뜻할 수도 있으며, 이미지는 의도적으로 구체적이고 낯섭니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 구문은 난해하여, POB는 이를 빛 속의 어떤 ‘건축된 것/구조물’로 조심스럽게 옮깁니다.
    reason: textual_variant
lexical_decisions:
- source_word: መንፈስየ
  english_pob_choice: my spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 영혼
  - 나의 영
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상적 상승 맥락의 개인적 영을 가리키므로, 의미를 과도하게 내면화하는 ‘영혼’보다 직접적인 ‘영’이 원문에 가깝습니다.
- source_word: ውስተ ሰማየ ሰማያት
  english_pob_choice: into the heaven of heavens
  chosen_korean: 하늘들의 하늘에
  alternatives_korean:
  - 하늘의 하늘에
  - 가장 높은 하늘에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 중첩된 셈어적 최고급 표현을 살려 ‘하늘들의 하늘’로 옮기면, 단순히 ‘가장 높은 하늘’로 평준화하는 것보다 원문의 장중함이 유지됩니다.
- source_word: ከመ ቦቱ ዘይትነደቅ
  english_pob_choice: something built
  chosen_korean: 어떤 것
  alternatives_korean:
  - 세워진 무언가
  - 지어진 구조물
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 구문은 구조가 다소 난해하므로, POB의 신중한 해석을 따라 대상이 분명한 건축물인지 단정하지 않고 ‘어떤 것’으로 열어 두었습니다.
- source_word: እምእብነ አስሐትያ
  english_pob_choice: stones of hail
  chosen_korean: 우박 돌들
  alternatives_korean:
  - 우박돌들
  - 얼음 돌들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘hailstones’의 구체적이고 낯선 이미지를 살리기 위해, 자연스러운 한국어로도 물질성을 드러내는 ‘우박 돌들’을 선택했습니다.
- source_word: እበን ልሳናተ እሳት ሕያው
  english_pob_choice: tongues of living fire
  chosen_korean: 살아 있는 불의 혀들
  alternatives_korean:
  - 살아 있는 불꽃들
  - 생생한 불의 혀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘혀들’은 불꽃의 형상을 문자적으로 보존하는 핵심 이미지이므로 유지했고, ‘living fire’는 ‘살아 있는 불’로 옮겨 불의 생동성을 살렸습니다.
theological_decisions:
- issue: Enoch의 상승/숨김 표현
  chosen_reading: ‘가려졌습니다’로 옮겨, 보이는 장소로의 이동이 아니라 신적 영역 안으로 감추어지는 환시적 수동성을 보존했습니다.
  alternative_readings:
  - ‘들려 올라갔습니다’
  - ‘숨겨졌습니다’
  rationale: 게이즈 동사의 의미는 단순한 상승보다 ‘감추어짐’에 가깝고, 에녹 문헌의 특유한 종말론적 이동 언어를 평면화하지 않는 것이 중요합니다.
  doctrine_reference: 에녹의 체험 방식은 단정하지 않고, 본문이 보존하는 환시적·신비적 긴장을 유지합니다.
