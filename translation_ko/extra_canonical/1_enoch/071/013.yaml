base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/013.yaml
  text: And that Head of Days came with Michael and Raphael and Gabriel and Phanuel[c][b][a], and thousands and ten thousands of angels who have no number.
  footnotes:
  - marker: a
    text: The title rendered 'Head of Days' is often translated more traditionally as 'Ancient of Days,' but the Ge'ez wording here is kept closer to its literal form to avoid over-harmonizing with Danielic phrasing.
    reason: lexical_alternative
  - marker: b
    text: The names are transliterated from the Ethiopic witness here rather than normalized to more familiar English forms.
    reason: cultural_note
  - marker: c
    text: Or 'Gabrieel'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날들의 머리이신 분께서 미카엘과 라파엘과 가브리엘과 판우엘, 그리고 그 수를 셀 수 없는 수천 수만의 천사들과 함께 오셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘날들의 머리’는 더 전통적으로 ‘옛날부터 계신 이’로 옮길 수도 있습니다. 그러나 여기서는 다니엘서의 표현과 과도하게 조화시키지 않기 위해 원문의 칭호를 가깝게 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 이름들은 한국어에서 널리 쓰이는 표기를 사용했습니다. 다만 ‘판우엘’은 에티오피아어 전승의 형태를 반영한 표기입니다.
    reason: cultural_note
  - marker: c
    text: ‘수천 수만’은 문자적으로 수천과 수만을 뜻합니다. 묵시 문학의 수량 관용을 반영하여 ‘천천과 만만’으로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሰ መዋዕል
  english_pob_choice: Head of Days
  chosen_korean: 날들의 머리이신 분
  alternatives_korean:
  - 날들의 우두머리
  - 옛날부터 계신 분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 표상을 살리되 한국어 문장으로 자연스럽게 옮기기 위해 ‘머리’의 비유를 유지했습니다. ‘옛날부터 계신 분’은 다니엘서의 ‘옛날부터 계신 이’와 쉽게 합쳐질 수 있어, POB의 의도대로 별도의 에녹적 칭호를 보존합니다.
- source_word: መጽአ
  english_pob_choice: came
  chosen_korean: 오셨으며
  alternatives_korean:
  - 왔으며
  - 도착하셨으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 환상 서술 속 존귀한 주체의 이동을 한국어로 자연스럽게 나타내기 위해 ‘오셨으며’를 택했습니다. 단순한 도착보다 서술의 장중함을 살립니다.
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  english_pob_choice: Michael and Raphael and Gabriel and Phanuel
  chosen_korean: 미카엘과 라파엘과 가브리엘과 판우엘
  alternatives_korean:
  - 미가엘과 라파엘과 가브리엘과 바누엘
  - 미카엘과 라파엘과 가브리엘과 파누엘
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아어 증거의 음가를 따라 음역하되, 한국어에서 통용되는 이름 형태와의 균형을 고려했습니다. ‘판우엘’은 Ge'ez 자형에 더 가까운 음역을 유지합니다.
- source_word: አእላፍ ወትእልፊተ
  english_pob_choice: thousands and ten thousands
  chosen_korean: 수천과 수만
  alternatives_korean:
  - 천천과 만만
  - 수천과 만만
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복적 천체적/묵시적 수량 표현을 한국어로 직접적이고 읽기 쉽게 옮겼습니다. ‘수천과 수만’이 수사적 과장과 셈할 수 없음을 함께 드러냅니다.
- source_word: እለ አልቦሙ ኍልቈ
  english_pob_choice: who have no number
  chosen_korean: 셀 수 없는
  alternatives_korean:
  - 헤아릴 수 없는
  - 수가 없는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문장 안에서 자연스럽게 뒤의 ‘천사들’을 수식하도록 압축했습니다. 원문의 ‘number가 없다’는 의미를 한국어 관용으로 충실히 반영합니다.
theological_decisions:
- issue: ‘Head of Days’의 칭호 보존 여부
  chosen_reading: 다니엘서의 익숙한 ‘옛날부터 계신 이’로 흡수하지 않고, ‘날들의 머리이신 분’으로 별도 칭호를 보존했습니다.
  alternative_readings:
  - 옛날부터 계신 분
  - 영원부터 계신 분
  rationale: 이 본문은 에녹서의 고유한 표현이므로, 다니엘서와의 자동 조화를 피하는 것이 원문 의미와 전승 차이를 드러냅니다. POB의 원칙대로 문구의 낯섦을 유지해도 한국어로 이해 가능하도록 옮겼습니다.
  doctrine_reference: 원천언어 우선 번역; 상호본문적 조화보다 문구의 고유한 신학적 긴장 보존
- issue: 천사 이름의 음역
  chosen_reading: 전통적 교회식 표기보다 Ge'ez 증거를 따라 음역했습니다.
  alternative_readings:
  - 미가엘/가브리엘/파누엘
  - 표준 교회 관용형
  rationale: POB의 감사 가능한 전승을 따르기 위해 이름도 가능한 한 증거 기반으로 처리했습니다. 다만 가브리엘은 한국어에서 가장 널리 알려진 형태를 택해 가독성을 확보했습니다.
  doctrine_reference: 원전 증거 우선과 한국어 가독성의 균형
