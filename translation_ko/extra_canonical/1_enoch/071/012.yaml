theological_decisions:
- issue: ሥሙረተ의 수용/호의 의미
  chosen_reading: ‘받아들여졌습니다’로 번역하여, 축복의 말이 절대자 앞에서 승인·수용되었음을 나타냈습니다.
  alternative_readings:
  - 기뻐하셨습니다
  - 좋게 여기셨습니다
  - 호의롭게 받으셨습니다
  rationale: 본문은 말이 단지 감정적으로 ‘좋았다’는 뜻보다, 하늘 법정적 장면에서 공식적으로 받아들여진다는 점을 강조합니다.
  doctrine_reference: Apocalyptic court language; preserve acceptance/approval nuance without softening to emotion.
