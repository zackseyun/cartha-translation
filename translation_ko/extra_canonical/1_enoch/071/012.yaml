base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/012.yaml
  text: And those blessings that went out from my mouth became acceptable before that Head of Days[a][b][c].
  footnotes:
  - marker: a
    text: Or 'was pleasing before that Head of Days.' The Ge'ez term rendered 'became acceptable' can also carry the sense of being pleasing or favorably received.
    reason: lexical_alternative
  - marker: b
    text: '''Head of Days'' is the Ge''ez title here. It is left distinct from the more familiar ''Ancient of Days'' so the wording of this passage is not silently harmonized to Daniel.'
    reason: cross_reference
  - marker: c
    text: Or 'the blessing that went out'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내 입에서 나온 그 복되움들이 그 날들의 머리 앞에서 받아들여졌습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘받아들여졌다’는 ‘기쁘게 여겨졌다’ 또는 ‘호의롭게 여겨졌다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 날들의 머리’는 여기의 Ge'ez 칭호를 살린 표현입니다. 다니엘의 더 익숙한 ‘옛적부터 항상 계신 이’로 조용히 맞추지 않기 위해 별도로 두었습니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘입에서 나온 축복이’.
    reason: previous_rendering
