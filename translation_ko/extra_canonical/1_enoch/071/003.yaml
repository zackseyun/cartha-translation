base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/003.yaml
  text: And the angel Mika'el[a], one of the chief angels, took hold of my right hand and raised me up, and brought me out to all the hidden things; and he showed me all the hidden things of mercy[c][b], and he showed me all the hidden things of righteousness.
  footnotes:
  - marker: a
    text: Or 'to all the secrets.' The Ge'ez repeatedly uses a term for things hidden or concealed; the repetition is preserved in the main text.
    reason: lexical_alternative
  - marker: b
    text: '''Chief angels'' more literally reflects ''heads/chiefs of the angels''; ''archangels'' is a possible but more technical rendering.'
    reason: lexical_alternative
  - marker: c
    text: '''Righteousness'' could also be rendered ''justice'' here.'
    reason: lexical_alternative
translation:
  language: ko
  text: 미카엘 천사[a], 곧 천사들의 우두머리들[b] 가운데 하나가 내 오른손을 붙들고 나를 일으켜 세워, 모든 숨겨진 것들로 나를 데리고 나가서, 자비의 숨겨진 것들[c]과 의의 숨겨진 것들을 모두 보여 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미카엘’로 음역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘천사들의 우두머리들’이며, ‘대천사’는 더 기술적인 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘숨겨진 것들’은 본문의 반복을 살린 번역이며, ‘비밀들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ ሚካኤል
