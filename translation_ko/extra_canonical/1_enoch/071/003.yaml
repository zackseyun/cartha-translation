  - 천사들의 머리들 가운데 하나
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역하면 ‘천사들의 머리/우두머리들 중 하나’이므로, 후대의 기술용어인 ‘대천사’를 과감히 고정하기보다 지위의 의미를 살린 표현을 택했습니다.
