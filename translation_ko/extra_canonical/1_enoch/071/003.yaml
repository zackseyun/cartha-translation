  rationale: 자비와 병렬을 이루는 종교·도덕적 어휘이므로, 한국어 성서 용례에 맞는 기본어 ‘의’를 택했습니다.
  doctrine_reference: 'Contested terms table: default rendering of δικαιοσύνη-field terms as ''의,'' with ''정의'' only where the context clearly demands a social or forensic sense.'
