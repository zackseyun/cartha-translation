  doctrine_reference: 'Translation philosophy: preserve ambiguity where the source is not fully determinate; translate titles/roles by meaning rather than tradition when possible.'
- issue: ጽድቅ의 한국어 대응을 ‘의’로 둘지 ‘정의’로 둘지 여부
