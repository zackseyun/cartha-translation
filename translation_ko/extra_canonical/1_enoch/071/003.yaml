  - 긍휼의 숨겨진 것들 / 의의 숨겨진 것들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ምሕረት은 여기서 ‘자비’가 가장 مباشرة하며, ጽድቅ은 이 문맥에서 ‘의’로 옮겨 자비와의 병렬을 간결하게 살렸습니다.
theological_decisions:
- issue: ‘천사들의 우두머리들’로 번역할 때 후대의 정형화된 ‘대천사’ 용어를 사용할지 여부
