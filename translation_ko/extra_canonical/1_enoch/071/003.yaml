  rationale: መልአከ는 ‘천사/사자’이며, 여기서는 하늘 존재를 가리키므로 ‘천사’로 옮기고 이름은 음역하여 인명을 보존했습니다.
- source_word: ፩እምአርእስተ መላእክት
  english_pob_choice: one of the chief angels
  chosen_korean: 천사들의 우두머리들 가운데 하나
