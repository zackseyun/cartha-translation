  rationale: 반복되는 ኅቡአት의 핵심은 ‘숨겨진/감추어진’ 상태이므로, ‘비밀’보다 원문의 반복과 시각적 대비를 살리는 표현을 사용했습니다.
- source_word: ኅቡአተ ምሕረት / ኅቡአተ ጽድቅ
  english_pob_choice: the hidden things of mercy / the hidden things of righteousness
