  text: And there came out from that house Mikael and Rufael and Gabr'el and Fanuel, and many holy angels without number.
  footnotes:
  - marker: a
    text: The names are transliterated from the Ge'ez forms rather than replaced with more familiar English spellings such as Michael, Raphael, Gabriel, and Phanuel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 집에서 미카엘과 루파엘과 가브르엘과 파누엘, 그리고 수없이 많은 거룩한 천사들이 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이름들은 익숙한 한국어 관습형보다 Ge'ez 형태를 따라 음역했습니다. 따라서 가브리엘은 가브르엘로, 라파엘은 루파엘로 표기했습니다.
    reason: lexical_alternative
