  source_fidelity: 원문은 ‘그 집에서’ 미카엘·루파엘·가브르엘·파누엘과 셀 수 없이 많은 거룩한 천사들이 함께 나왔다는 단일 서술입니다. 초안의 두 동사 연결은 원문에 없는 두 차례의 خروج/출현처럼 읽힐 수 있습니다. ‘수없이 많은’은 ብዙኃን 및 ‘그들의 수가 없다’는 관계절을 자연스럽게 함께 반영합니다.
  naturalness: ‘그 집에서 … 나왔습니다’와 단일 종결 서술이 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다. ‘수를 셀 수 없는 많은’보다 ‘수없이 많은’이 간결한 한국어 관용입니다.
  terminology: ‘거룩한 천사들’은 ቅዱሳን መላእክት을 적절히 보존합니다. 이름 음역 방침을 유지한다면 ገብርኤል의 자음군을 반영한 ‘가브르엘’이 관습형 ‘가브리엘’보다 일관됩니다. 나머지 미카엘, 루파엘, 파누엘은 제시된 원문 지향 표기와 부합합니다.
  issues:
