  - 세라핌/케루빔을 ‘스랍/그룹’으로 번역하고 오파님을 ‘바퀴들’로 옮기기
  - 세 존재를 모두 ‘천사들’로 일반화하기
  rationale: 본문은 보좌 주위의 특정 천상 존재들을 병렬로 열거하므로, 일반화나 직역으로 평탄화하기보다 고유한 묵시문학적 분류를 보존하는 편이 더 충실합니다.
  doctrine_reference: 묵시적 천상 질서의 특수성을 보존하는 번역 원칙
