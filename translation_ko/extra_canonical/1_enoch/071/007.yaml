  text: And around it were the seraphim and the cherubim and the ophannim[b][a], and these are those who do not sleep and who keep watch over the throne of his glory.
  footnotes:
  - marker: a
    text: '''Ophannim'' is a transliterated name for a heavenly order; the underlying sense is related to ''wheels.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'And around were'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 주위에는[b] 세라핌과 케루빔과 오파님[a]이 있었는데, 이들은 잠들지 않는 자들이며 그의 영광의 보좌를 지키고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오파님’은 하늘 존재 계급의 음역이며, ‘바퀴’라는 뜻과 관련이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그리고 주위에는 있었다’.
    reason: previous_rendering
