base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/008.yaml
  text: And I saw angels beyond number[a], thousands of thousands and ten thousand times ten thousand, surrounding that house; and Mikael and Rufael and Gabrʾel and Fanʾuel[b], and the holy angels who are above the heavens, were going in and coming out of that house.
  footnotes:
  - marker: a
    text: The immense-number formula is a conventional apocalyptic way of depicting an uncountable heavenly multitude; the translation keeps the wording close to the Ge'ez rather than replacing it with a more familiar biblical formula.
    reason: cultural_note
  - marker: b
    text: 'The names are transliterated from the Ge''ez forms here: Mikael, Rufael, Gabrʾel, Fanʾuel. More familiar English spellings are Michael, Raphael, Gabriel, and Phanuel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 수를 셀 수 없는 천사들, 곧 수천의 수천과 만만의 만만이 그 집을 둘러싸고 있는 것을 보았습니다.[a] 또 미카엘과 루파엘과 가브리엘과 파누엘,[b] 그리고 하늘들 위에 있는 거룩한 천사들이 그 집에 드나들고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘수를 셀 수 없는’과 이어지는 ‘수천의 수천과 만만의 만만’은 헤아릴 수 없이 많은 하늘의 무리를 나타내는 게에즈의 중첩 수량 표현을 가깝게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 이름들은 게에즈 본문의 형태를 따라 옮겼습니다. 더 익숙한 표기로는 미카엘, 라파엘, 가브리엘, 파누엘이 있습니다.
    reason: lexical_alternative
