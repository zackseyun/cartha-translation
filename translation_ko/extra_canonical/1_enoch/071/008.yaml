  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘holy’의 직접 대응은 ‘거룩한’이며, 천상 존재의 구별됨을 분명히 합니다.
- source_word: መልዕልተ ሰማያት
