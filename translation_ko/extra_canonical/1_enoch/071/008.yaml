revisions:
- from: 나는 수를 셀 수 없는 천사들과 — 수천의 수천, 만만의 만만 — 그 집을 둘러싸고 있는 것을 보았습니다. 그리고 미카엘과 루파엘과 가브리엘과 판누엘, 또 하늘들 위에 있는 거룩한 천사들이 그 집 안으로 들어가고 나오는 것이었습니다.[a][b]
  to: 나는 수를 셀 수 없는 천사들, 곧 수천의 수천과 만만의 만만이 그 집을 둘러싸고 있는 것을 보았습니다.[a] 또 미카엘과 루파엘과 가브리엘과 파누엘,[b] 그리고 하늘들 위에 있는 거룩한 천사들이 그 집에 드나들고 있었습니다.
  rationale: 문장의 주어와 수식 관계를 원문에 맞게 명료화했습니다. 무수한 천사들은 집을 둘러싸고 있으며, 미카엘·루파엘·가브리엘·파누엘 및 하늘들 위에 있는 거룩한 천사들은 그 집에 드나듭니다. ‘집’을 궁전이나 성전으로 해석하지 않았고, 수량 공식도 일반화하지 않았습니다. 각주 표지는 해당 표현 및 이름 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:01Z'
