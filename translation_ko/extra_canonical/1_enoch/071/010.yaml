  rationale: 문맥상 의복이 단순히 ‘번역 불가’라기보다 인간 언어로 충분히 묘사될 수 없다는 뜻이므로, ‘설명할 수 없었습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘날들의 머리’라는 호칭을 전통적 다니엘 7장의 ‘옛적부터 항상 계신 이’로 맞출지 여부
  chosen_reading: 본문의 게즈 표현을 따라 ‘날들의 머리’로 두었습니다.
  alternative_readings:
  - 옛적부터 항상 계신 이
  - 옛적부터 계신 이
  rationale: 전통적 해석은 가능한 독법이지만, 본문은 그 표현 자체를 직접 제시하므로 번역본에서도 원문 투명성을 우선해 전통적 조화를 피했습니다.
