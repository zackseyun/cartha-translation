base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/010.yaml
  text: And with them was the Head of Days[a], and his head was like white and pure wool[c][b], and his garment cannot be described.
  footnotes:
  - marker: a
    text: Or 'the Ancient of Days.' The traditional rendering reflects the likely Danielic resonance of the title, but the Ge'ez here reads more literally 'Head of Days.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase may also be understood as 'cannot be explained/interpreted.' The sense is that the garment surpasses ordinary description.
    reason: lexical_alternative
  - marker: c
    text: Or 'And among them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들과 함께[c] 날들의 머리[a]께서 계셨습니다. 그의 머리는 희고 순수한 양털 같았으며, 그의 옷은 묘사할 수 없었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛적부터 계신 이’입니다. 전통적 번역은 다니엘서와의 연관을 반영하지만, 게즈 본문은 더 문자적으로 ‘날들의 머리’라고 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 ‘묘사할 수 없다’ 또는 ‘해석할 수 없다’로도 이해할 수 있습니다. 뜻은 그 옷이 보통의 묘사를 넘어선다는 것입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그리고 그들 가운데’입니다.
    reason: previous_rendering
