base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/004.yaml
  text: And he showed me all the hidden things of the ends of heaven[a], and all the storehouses of the stars and the lights[c][b], from where they all come forth before the face of the holy ones.
  footnotes:
  - marker: a
    text: Or 'the stars and the luminaries.' The Ge'ez distinguishes stars from a broader class of heavenly lights.
    reason: lexical_alternative
  - marker: b
    text: '''Before the face of the holy ones'' is a literal rendering of a Semitic-style expression meaning ''in the presence of the holy ones.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'And he showed me all the hidden things of the ends of heaven, and all the storehouses of the stars and the lights, from where they come forth before the face of the holy ones.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 내게 하늘 끝에 있는 모든 숨겨진 것들과, 별들과 빛들이 모두 거룩한 자들 앞에 나오는 모든 곳간을 보여 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘 끝’은 우주적 경계를 가리키는 묵시문학적 표현입니다.
    reason: korean_style_note
  - marker: b
    text: ‘거룩한 자들 앞에’는 직역하면 ‘거룩한 자들의 얼굴 앞에’이며, 그들 앞에서 또는 그들이 있는 곳에서라는 뜻의 셈어식 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: አርአየኒ
  english_pob_choice: he showed me
  chosen_korean: 내게 보여 주셨습니다
  alternatives_korean:
  - 내게 드러내셨습니다
  - 내게 보게 하셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비전 서술의 인과적 ‘보여 줌’을 자연스러운 한국어로 옮기되, 계시적 뉘앙스는 과장하지 않았습니다.
- source_word: ኵሎ ኅቡኣተ
  english_pob_choice: all the hidden things
  chosen_korean: 모든 숨겨진 것들
  alternatives_korean:
  - 모든 비밀들
  - 모든 감추어진 것들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘숨겨진 것들’은 종교적 비밀주의로 좁히지 않으면서도 묵시적 은폐/계시의 긴장을 유지합니다.
- source_word: አጽናፈ ሰማይ
  english_pob_choice: the ends of heaven
  chosen_korean: 하늘의 끝들
  alternatives_korean:
  - 하늘의 극지들
  - 하늘의 가장자리들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 우주적 공간표현을 평이하게 살리기 위해 직역에 가까운 ‘하늘의 끝들’을 택했습니다.
- source_word: መዛግብተ ... ከዋክብት ወብርሃናት
  english_pob_choice: storehouses of the stars and the lights
  chosen_korean: 별들과 빛들의 모든 곳간
  alternatives_korean:
  - 별들과 광명들의 모든 창고
  - 별들과 광체들의 모든 곳간
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 천체를 보관하는 우주적 저장소 이미지를 살리기 위해 ‘곳간’을 썼고, ከዋክብት과 ወብርሃናት의 구분은 ‘별들과 빛들’로 보존했습니다.
- source_word: ኵሎሙ
  english_pob_choice: they all
  chosen_korean: 그것들은 모두
  alternatives_korean:
  - 그들 모두는
  - 모두
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 본문의 ‘모두’가 별과 빛 전체를 가리키는 명시적 강조이므로 한국어에도 반복해 넣어 누락을 방지했습니다.
- source_word: ለገጸ ቅዱሳን
  english_pob_choice: before the face of the holy ones
  chosen_korean: 거룩한 자들의 얼굴 앞에서
  alternatives_korean:
  - 거룩한 자들 앞에서
  - 거룩한 자들의 임재 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세미틱식 ‘얼굴 앞에서’를 살려 원문 감각을 보존하되, 한국어 독해를 위해 ‘얼굴 앞에서’로 풀었습니다.
theological_decisions:
- issue: ‘거룩한 자들’의 정체
  chosen_reading: 거룩한 자들
  alternative_readings:
  - 성도들
  - 천사들
  rationale: 우주 비전 문맥상 하늘 존재를 가리킬 가능성이 크지만, 본문 자체가 더 구체화하지 않으므로 해석을 닫지 않고 중립적으로 남겼습니다.
  doctrine_reference: 문맥이 허용하는 범위 안에서 종말론적·천상적 긴장을 보존
