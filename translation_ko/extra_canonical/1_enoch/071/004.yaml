- from: 그리고 그분은 내게 하늘의 끝들에 있는 모든 숨겨진 것들과, 별들과 빛들의 모든 곳간을 보여 주셨습니다. 그것들은 모두 거룩한 자들의 얼굴 앞에서 나옵니다.[a][b]
  to: 그리고 그는 내게 하늘 끝에 있는 모든 숨겨진 것들과, 별들과 빛들이 모두 거룩한 자들 앞에 나오는 모든 곳간을 보여 주었습니다.[a][b]
