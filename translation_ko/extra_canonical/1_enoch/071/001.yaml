  source_fidelity: 핵심 장면과 어휘는 대체로 충실합니다. ‘하늘들’, ‘거룩한 천사들의 아들들’, ‘불꽃 위를 걷는 것’, 흰 옷과 눈 같은 얼굴의 광휘를 잘 보존했습니다. 그러나 ‘들려 올려져’는 수동 이동을 중복하여 부자연스럽게 표현하므로, 원문의 ‘들려 올려짐’과 이어지는 상승을 자연스러운 한국어로 구분할 필요가 있습니다. 대괄호 친 본문의 불확실한 어형은 본문에 억지로 보충하지 않고 주석에서 밝혀야 합니다.
  naturalness: ‘그리고 이 일 뒤에’와 ‘들려 올려져’는 현대 표준어 합쇼체에서 다소 번역투이고 어색합니다. ‘그 후에 이런 일이 있었습니다’ 및 ‘이끌려 올려졌고’로 고치면 서사 전환과 환상적 이동이 자연스럽습니다. ‘또한’은 원문의 단순 접속에 비해 불필요하므로 ‘그리고’로 처리했습니다.
  terminology: ‘영’, ‘하늘들’, ‘거룩한 천사들의 아들들’은 유지하는 것이 적절합니다. 특히 낯선 친족 표현을 ‘천사들’로 평탄화하지 않은 점이 원문에 충실합니다. ‘눈처럼 빛났습니다’는 밝음과 백색의 비유를 자연스럽게 전달합니다.
