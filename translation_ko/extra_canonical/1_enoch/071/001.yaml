  lexicon: Dillmann
  rationale: 비전 속 상승·이동의 수동적 뉘앙스를 살리면서도, ‘영’이 외부로 옮겨지는 장면을 한국어로 자연스럽게 드러내기 위해 ‘들려 올려져’를 택했습니다.
- source_word: ተዐርገ ውስተ ሰማያት
  english_pob_choice: it ascended into the heavens
  chosen_korean: 하늘들로 올라갔습니다
  alternatives_korean:
  - 하늘로 올라갔습니다
  - 하늘들에 올라갔습니다
  lexicon: Dillmann
  rationale: 복수형 ‘하늘들’을 유지해 묵시문학적 우주관을 보존했고, ‘into the heavens’의 방향성을 자연스럽게 옮겼습니다.
- source_word: ለውሉዶሙ ለመላእክት ቅዱሳን
  english_pob_choice: the sons of the holy angels
  chosen_korean: 거룩한 천사들의 아들들
  alternatives_korean:
  - 거룩한 천사들의 자손
  - 거룩한 천사들
  lexicon: Dillmann
  rationale: 이상한 친족 표현을 평탄화하지 않고 직역에 가깝게 보존해, 본문이 실제로 말하는 관계적 표현의 긴장을 그대로 드러냈습니다.
- source_word: '[ወዐጸፎሙ]'
  english_pob_choice: their garments were white
  chosen_korean: 그들의 옷은 희었습니다
  alternatives_korean:
  - 그들의 의복은 희었습니다
  - 그들의 망토도 있었습니다
  lexicon: Dillmann
  rationale: 주석 처리된 어형의 불확실성을 본문에서 과도하게 확정하지 않고, 분명한 의미인 흰 옷의 상태를 본문에 두었습니다.
- source_word: ብሩሃን ገጾሙ ከመ በረድ
  english_pob_choice: their faces shone like snow
  chosen_korean: 그들의 얼굴은 눈처럼 빛났습니다
  alternatives_korean:
  - 그들의 얼굴은 눈처럼 희었습니다
  - 그들의 얼굴은 눈처럼 환했습니다
  lexicon: Dillmann
  rationale: ‘빛나다’로 얼굴의 광휘를 살리되, ‘눈처럼’으로 흰빛의 비교를 유지해 원문의 시각적 강도를 보존했습니다.
theological_decisions:
- issue: ‘sons of the holy angels’의 처리
  chosen_reading: 친족 표현을 그대로 살려 ‘거룩한 천사들의 아들들’로 옮겼습니다.
  alternative_readings:
  - 그 거룩한 천사들
  - 하늘의 존재들
  rationale: 본문의 낯선 표현을 조화시키지 않고 보존하는 것이 원문 우선 원칙에 더 부합합니다. 독자가 긴장을 인지하도록 두는 편이 이 본문의 의미 범위를 더 정직하게 전달합니다.
  doctrine_reference: 원문 우선과 해석적 평탄화 회피
- issue: 천사들의 옷과 얼굴의 광휘 표현
  chosen_reading: ‘희었습니다’와 ‘눈처럼 빛났습니다’로 색과 광휘를 분리해 표현했습니다.
  alternative_readings:
  - ‘흰 옷이었습니다, 그리고 얼굴도 희었습니다’
  - ‘옷이 희고 얼굴이 눈처럼 빛났습니다’
  rationale: 의복의 백색과 얼굴의 눈 같은 광휘를 분리해, 본문이 주는 두 겹의 시각적 대비를 유지했습니다.
  doctrine_reference: 상징적 광휘의 중첩 보존
