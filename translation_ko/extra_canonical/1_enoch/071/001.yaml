base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/001.yaml
  text: 'And after this it happened: my spirit was taken up[a], and it ascended into the heavens; and I saw the sons of the holy angels walking upon a flame of fire, and their garments were white[d][c][b], and their faces shone like snow.'
  footnotes:
  - marker: a
    text: The phrase 'the sons of the holy angels' is unusual and may be understood more broadly as angelic beings associated with the holy angels. The Ge'ez wording is retained rather than simplified.
    reason: lexical_alternative
  - marker: b
    text: The bracketed word in the source line is textually uncertain. The translation reflects the clear sense of radiance in the clause as a whole without pressing that uncertain form too far.
    reason: textual_variant
  - marker: c
    text: '''Like snow'' renders the comparison naturally in context as an image of dazzling whiteness and brightness.'
    reason: cultural_note
  - marker: d
    text: Or 'and their garments were white, and their faces shone like snow.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일 뒤에 내 영이[a] 들려 올려져 하늘들로 올라갔습니다. 그리고 나는 거룩한 천사들의 아들들이 불꽃 위를 걷는 것을 보았고, 그들의 옷은 희었습니다[b][c][d]. 또한 그들의 얼굴은 눈처럼 빛났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 영’은 비전 중 상승하는 주체를 그대로 살린 표현입니다.
    reason: source_note
  - marker: b
    text: 주석으로 처리된 어형은 본문 확정에 부담을 주지 않으므로, 번역은 분명한 의미만 따랐습니다.
    reason: textual_variant
  - marker: c
    text: ‘눈처럼’은 단순한 흰색보다 눈부신 희백의 이미지를 자연스럽게 전합니다.
    reason: cultural_note
  - marker: d
    text: 다른 가능한 읽기로는 ‘그들의 옷은 희었고, 그들의 얼굴은 눈처럼 빛났습니다’가 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ትትከበት መንፈስየ
  english_pob_choice: my spirit was taken up
  chosen_korean: 내 영이 들려 올려져
  alternatives_korean:
  - 내 영이 들려 올라가
  - 내 영이 취하여 올라가
  lexicon: Dillmann
  rationale: 비전 속 상승·이동의 수동적 뉘앙스를 살리면서도, ‘영’이 외부로 옮겨지는 장면을 한국어로 자연스럽게 드러내기 위해 ‘들려 올려져’를 택했습니다.
- source_word: ተዐርገ ውስተ ሰማያት
  english_pob_choice: it ascended into the heavens
  chosen_korean: 하늘들로 올라갔습니다
  alternatives_korean:
  - 하늘로 올라갔습니다
  - 하늘들에 올라갔습니다
  lexicon: Dillmann
  rationale: 복수형 ‘하늘들’을 유지해 묵시문학적 우주관을 보존했고, ‘into the heavens’의 방향성을 자연스럽게 옮겼습니다.
- source_word: ለውሉዶሙ ለመላእክት ቅዱሳን
  english_pob_choice: the sons of the holy angels
  chosen_korean: 거룩한 천사들의 아들들
  alternatives_korean:
  - 거룩한 천사들의 자손
  - 거룩한 천사들
  lexicon: Dillmann
  rationale: 이상한 친족 표현을 평탄화하지 않고 직역에 가깝게 보존해, 본문이 실제로 말하는 관계적 표현의 긴장을 그대로 드러냈습니다.
- source_word: '[ወዐጸፎሙ]'
  english_pob_choice: their garments were white
  chosen_korean: 그들의 옷은 희었습니다
  alternatives_korean:
  - 그들의 의복은 희었습니다
  - 그들의 망토도 있었습니다
  lexicon: Dillmann
  rationale: 주석 처리된 어형의 불확실성을 본문에서 과도하게 확정하지 않고, 분명한 의미인 흰 옷의 상태를 본문에 두었습니다.
- source_word: ብሩሃን ገጾሙ ከመ በረድ
  english_pob_choice: their faces shone like snow
  chosen_korean: 그들의 얼굴은 눈처럼 빛났습니다
  alternatives_korean:
  - 그들의 얼굴은 눈처럼 희었습니다
  - 그들의 얼굴은 눈처럼 환했습니다
  lexicon: Dillmann
  rationale: ‘빛나다’로 얼굴의 광휘를 살리되, ‘눈처럼’으로 흰빛의 비교를 유지해 원문의 시각적 강도를 보존했습니다.
theological_decisions:
- issue: ‘sons of the holy angels’의 처리
  chosen_reading: 친족 표현을 그대로 살려 ‘거룩한 천사들의 아들들’로 옮겼습니다.
  alternative_readings:
  - 그 거룩한 천사들
  - 하늘의 존재들
  rationale: 본문의 낯선 표현을 조화시키지 않고 보존하는 것이 원문 우선 원칙에 더 부합합니다. 독자가 긴장을 인지하도록 두는 편이 이 본문의 의미 범위를 더 정직하게 전달합니다.
  doctrine_reference: 원문 우선과 해석적 평탄화 회피
- issue: 천사들의 옷과 얼굴의 광휘 표현
  chosen_reading: ‘희었습니다’와 ‘눈처럼 빛났습니다’로 색과 광휘를 분리해 표현했습니다.
  alternative_readings:
  - ‘흰 옷이었습니다, 그리고 얼굴도 희었습니다’
  - ‘옷이 희고 얼굴이 눈처럼 빛났습니다’
  rationale: 의복의 백색과 얼굴의 눈 같은 광휘를 분리해, 본문이 주는 두 겹의 시각적 대비를 유지했습니다.
  doctrine_reference: 상징적 광휘의 중첩 보존
