theological_decisions:
- issue: ‘영’과 ‘능력의 영’의 문법적/의미적 방향성
  chosen_reading: ‘능력의 영 안에서’로 번역해, 내적 상태인지 도구적/원인적 표현인지 열어 두었습니다.
  alternative_readings:
  - 능력의 영으로
  - 능력의 영을 따라
  - 능력의 영에 의해
  rationale: 본문은 표현이 난해하므로, 해석을 한쪽으로 고정하지 않고 원문의 모호성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy §3, ambiguity preservation
- issue: ‘큰 소리로’와 생략 부호의 처리
  chosen_reading: ‘큰 소리로 외쳤습니다 …’로 옮겨, 본문의 단절/훼손 가능성을 드러냈습니다.
  alternative_readings:
  - 큰 소리로 외쳤습니다
  - 큰 외침으로 소리쳤습니다
  rationale: 영문 POB가 지적한 본문의 난독/결손을 반영해, 매끄럽게 메우지 않고 공백을 남기는 편이 자료비평적으로 정직합니다.
  doctrine_reference: Textual transparency principle
