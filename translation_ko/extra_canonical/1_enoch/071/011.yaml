base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/011.yaml
  text: And I fell on my face[a], and all my flesh melted away, and my spirit was transformed; and I cried out with a loud voice ... in the spirit of power[e][d][c][b], and I blessed and praised and exalted him.
  footnotes:
  - marker: a
    text: The clause after 'I cried out with a great voice' is textually difficult in this witness, and the ellipsis reflects an apparent gap or corruption in the OCR-derived text.
    reason: textual_variant
  - marker: b
    text: Or 'my spirit changed.' The Ge'ez verb is difficult, and the exact nuance is uncertain.
    reason: lexical_alternative
  - marker: c
    text: Or 'by a spirit of power' / 'through the spirit of power.' The phrase may describe either Enoch’s inward state or the empowering agency by which he spoke.
    reason: lexical_alternative
  - marker: d
    text: Or 'great voice'.
    reason: previous_rendering
  - marker: e
    text: Or 'and I blessed and praised and exalted.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 얼굴을 땅에 대고 엎드렸습니다[a]. 내 살이 모두 녹아내렸고, 내 영이 변했습니다[b]. 나는 큰 소리로 외쳤습니다[c] … 능력의 영 안에서 그를 송축하고 찬양하며 높였습니다[d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴을 땅에 대고’는 원문의 ‘내 얼굴 위에’라는 표현을 한국어 관용에 맞게 옮긴 것으로, 얼굴을 땅에 대고 엎드린 자세를 뜻합니다.
    reason: korean_style_note
  - marker: b
    text: 또는 ‘내 영이 변화했습니다.’ 게에즈어 동사는 난해하며, 변화의 정확한 뉘앙스는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘큰 목소리로’이며, ‘큰 소리로’는 그 관용적 의미를 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: 세 동사는 차례로 ‘송축하다’, ‘찬양하다’, ‘높이다’의 의미를 나타냅니다. 원문에는 목적어가 명시되지 않았으나, 문맥상 ‘그를’을 보충했습니다.
    reason: lexical_alternative
  - marker: e
    text: ‘큰 소리로 외쳤습니다’ 뒤의 본문은 이 전승에서 난해하며, 일부가 결손되었거나 훼손되었을 가능성이 있습니다. 생략 부호는 그 공백을 반영합니다. ‘능력의 영 안에서’는 내적 상태인지, 말하거나 송축하게 한 능력의 매개인지 확정하기 어렵습니다.
    reason: textual_variant
