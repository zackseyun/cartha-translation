base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/001.yaml
  text: In those days[a], if a fierce fire descends upon you, where will you flee, and where will you be delivered? And when he lifts up his voice against you[d][c][b], will you not be shaken and fear?
  footnotes:
  - marker: a
    text: The adjective with 'fire' can mean extraordinary, astonishing, or terrible; the sense here is likely destructive and awe-inspiring.
    reason: lexical_alternative
  - marker: b
    text: '''The word'' may carry the force of a judicial word, decree, or sentence in this context.'
    reason: lexical_alternative
  - marker: c
    text: 'The final question is rhetorical: the sense is that they certainly will be shaken and afraid.'
    reason: cultural_note
  - marker: d
    text: Or 'And when the word comes against you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날들에, 거센 불이 여러분 위에 내려오면, 어디로 도망가겠으며 어디에서 구원을 받겠습니까? 그리고 그가 여러분을 향해 자기 음성을 높이면, 여러분이 흔들리지 않고 두려워하지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거센’은 여기서 단지 강한 정도가 아니라, 파괴적이고 위협적인 성격을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  english_pob_choice: In those days
  chosen_korean: 그날들에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말 경고 문맥의 시간 부사구로, 한국어에서도 예언적·심판적 분위기를 살리면서 자연스럽게 압축했습니다.
- source_word: ዕፁብ እሳት
  english_pob_choice: a fierce fire
  chosen_korean: 거센 불
  alternatives_korean:
  - 무서운 불
  - 끔찍한 불
  - 놀라운 불
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 파괴적이고 압도적인 성격이 핵심이므로, ‘거센’이 과도한 설명 없이 위압감을 살립니다.
- source_word: በአይቴ ትነፍፁ
  english_pob_choice: where will you flee
  chosen_korean: 어디로 도망가겠으며
  alternatives_korean:
  - 어디로 피하겠으며
  - 어디로 달아나겠으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수사적 질문의 긴박함을 살리기 위해 ‘도망가다’를 택했고, 문장 연결은 한국어 문체에 맞춰 ‘-겠으며’로 처리했습니다.
- source_word: በአይቴ ትድኅኑ
  english_pob_choice: where will you be delivered
  chosen_korean: 어디에서 구원을 받겠습니까
  alternatives_korean:
  - 어디에서 구출되겠습니까
  - 어디에서 벗어나겠습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순한 탈출보다 ‘구원/구출’의 의미를 가지므로, 심판 문맥을 유지하면서도 현대 한국어로 명료하게 옮겼습니다.
- source_word: ይወዲ ቃሎ
  english_pob_choice: he lifts up his voice against you
  chosen_korean: 그가 여러분을 향해 자기 음성을 높이면
  alternatives_korean:
  - 그가 여러분을 향해 음성을 드높이면
  - 그가 여러분에게 자기 음성을 내면
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으스 원문의 ‘voice’와 동작성을 반영해 ‘음성을 높이다’로 옮겼고, 수식어 ‘자기’를 두어 원문의 3인칭 소유 의미를 살렸습니다.
- source_word: አኮ ትትመሀከዉ
  english_pob_choice: will you not be shaken
  chosen_korean: 흔들리지 않고
  alternatives_korean:
  - 동요하지 않고
  - 떨리지 않고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 반어적 질문이 예상하는 결과를 한국어에서는 자연스럽게 부정 서술로 풀어, 뒤의 ‘두려워하지 않겠습니까’와 평행을 이루게 했습니다.
theological_decisions:
- issue: ‘그의 음성을 높이면’의 주체와 심판적 뉘앙스
  chosen_reading: 주체를 ‘그가’로 두고, ‘자기 음성을 높이면’으로 번역해 발화 행위의 능동성과 위협성을 드러냈습니다.
  alternative_readings:
  - ‘말씀이 임하면’
  - ‘그의 말이 임하면’
  rationale: 주석된 개정에서 지적된 대로 이 구절은 단순히 ‘말이 오는’ 것이 아니라 누군가가 자기 음성을 높이는 장면이므로, 주체와 동작성을 유지하는 것이 본문 이해에 더 충실합니다.
  doctrine_reference: 원문 우선 원칙; 의미를 약화시키지 않고 문법적 주체를 보존함
