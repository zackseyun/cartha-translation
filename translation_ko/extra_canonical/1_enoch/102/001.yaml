  source_fidelity: 게으스어의 능동 주체와 ‘그의 음성을 높이다’라는 표현은 대체로 잘 반영했습니다. 그러나 원문의 부정 의문문은 ‘반드시 흔들리고 두려워하게 될 것’이라는 수사적 확언인데, 초안의 ‘흔들리지 않고 두려워하지 않겠습니까?’는 두 부정을 병렬하여 반대 의미(흔들리거나 두려워하지 않을 것처럼)를 나타냅니다.
  naturalness: ‘그날들에’와 ‘자기 음성’은 현대 표준 한국어에서 다소 어색합니다. ‘그 날들에’와, 소유자를 문맥상 함축하는 ‘음성을 높이면’이 자연스럽습니다. ‘구출되겠습니까’는 이 심판 장면에서 ‘구원을 받겠습니까’보다 물리적·심판적 구원의 뜻을 더 직접적으로 전달합니다.
  terminology: ‘거센 불’은 ዕፁብ의 파괴적이고 두려운 뉘앙스를 무리 없이 전달합니다. ‘음성을 높이다’는 원문의 능동적 발화와 ‘voice’를 보존하며, 특정 교리적 해석을 덧붙이지 않습니다.
