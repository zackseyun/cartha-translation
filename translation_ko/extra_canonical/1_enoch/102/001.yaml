  - 놀라운 불
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 파괴적이고 압도적인 성격이 핵심이므로, ‘거센’이 과도한 설명 없이 위압감을 살립니다.
- source_word: በአይቴ ትነፍፁ
  english_pob_choice: where will you flee
  chosen_korean: 어디로 도망가겠으며
  alternatives_korean:
  - 어디로 피하겠으며
  - 어디로 달아나겠으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수사적 질문의 긴박함을 살리기 위해 ‘도망가다’를 택했고, 문장 연결은 한국어 문체에 맞춰 ‘-겠으며’로 처리했습니다.
- source_word: በአይቴ ትድኅኑ
  english_pob_choice: where will you be delivered
  chosen_korean: 어디에서 구원을 받겠습니까
  alternatives_korean:
  - 어디에서 구출되겠습니까
  - 어디에서 벗어나겠습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순한 탈출보다 ‘구원/구출’의 의미를 가지므로, 심판 문맥을 유지하면서도 현대 한국어로 명료하게 옮겼습니다.
- source_word: ይወዲ ቃሎ
  english_pob_choice: he lifts up his voice against you
  chosen_korean: 그가 여러분을 향해 자기 음성을 높이면
  alternatives_korean:
  - 그가 여러분을 향해 음성을 드높이면
  - 그가 여러분에게 자기 음성을 내면
