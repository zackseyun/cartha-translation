translation:
  language: ko
  text: 모든 빛나는 것들이 큰 두려움으로 흔들릴 것이며, 온 땅이 흔들리고 떨며 두려워할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빛나는 것들’은 여기서 하늘의 광명체들을 가리킬 가능성이 높지만, 게으즈어 어휘 자체는 더 넓게 ‘빛들’로도 읽힙니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 마지막 동사는 제시 자료에서 OCR 오독 가능성이 있어, 의미상 두려움/놀람 계열로 읽을 여지가 있습니다.
    reason: textual_variant
