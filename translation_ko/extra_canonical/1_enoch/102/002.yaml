  text: And all the luminaries shall be shaken with great fear[b][a], and the whole earth shall be shaken and tremble and quake.
  footnotes:
  - marker: a
    text: Or 'all the lights.' The Ge'ez term can denote luminous things generally, but here likely refers to the heavenly luminaries in a cosmic judgment scene.
    reason: lexical_alternative
  - marker: b
    text: Or 'quake'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 광명체가 큰 두려움에 흔들리고, 온 땅이 흔들리며 떨고 진동할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광명체’는 문맥상 하늘의 빛나는 천체들을 가리키는 것으로 보입니다. 게으즈어 낱말은 더 넓게 ‘빛들’ 또는 ‘빛나는 것들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 동사는 ‘진동하다’로 옮겼으며, 문맥에 따라 ‘뒤흔들리다’ 또는 ‘지진이 일어나다’로도 옮길 수 있습니다.
    reason: lexical_alternative
