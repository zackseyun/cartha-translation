base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/005.yaml
  text: And do not grieve if your soul has gone down into Sheol in sorrow[a], and your flesh did not fare according to your goodness during your life; but wait for the day of the judgment of sinners[c][b], and for the day of curse and punishment.
  footnotes:
  - marker: a
    text: Or 'your flesh did not receive as your goodness deserved during your life.' The Ge'ez leaves the object of 'receive' unstated, so the line likely refers to lacking due recompense in earthly life.
    reason: lexical_alternative
  - marker: b
    text: '''Sheol'' is the realm of the dead in Jewish apocalyptic thought, not necessarily the later Christian concept of hell.'
    reason: cultural_note
  - marker: c
    text: Or 'your flesh did not receive according to your goodness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 근심하지 마십시오. 여러분의 영혼이 슬픔 가운데 스올[a]로 내려갔고, 여러분의 육신이 생애 동안 여러분의 선함에 상응하는 것을 얻지 못했더라도, 죄인들의 심판의 날과 저주와 형벌의 날을 기다리십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 스올은 유대 묵시사상에서 죽은 자들의 영역을 가리키며, 후대 기독교의 ‘지옥’과 반드시 같은 뜻은 아닙니다.
    reason: cultural_note
lexical_decisions:
- source_word: አት ኅዘኑ
  english_pob_choice: do not grieve
  chosen_korean: 근심하지 마십시오
  alternatives_korean:
  - 슬퍼하지 마십시오
  - 마음 아파하지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부정 명령의 정서적 금지를 자연스럽게 살리되, 현대 한국어에서 직설적이고 공적 문체에 맞는 표현을 택했습니다.
- source_word: ወረደት ነፍስክሙ ውስተ ሲኦል
  english_pob_choice: your soul has gone down into Sheol
  chosen_korean: 여러분의 영혼이 슬픔 가운데 스올로 내려갔고
  alternatives_korean:
  - 여러분의 혼이 스올로 내려갔고
  - 여러분의 영이 스올로 내려갔고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''내려갔고''로 하강 이미지를 보존하고, ሲኦል은 한국 교회어의 ''지옥''으로 약화시키지 않기 위해 스올을 유지했습니다.'
- source_word: ኢረከበ ሥጋክሙ በሕይወትክሙ በከመ ኂሩትክሙ
  english_pob_choice: your flesh did not fare according to your goodness
  chosen_korean: 여러분의 육신이 생애 동안 여러분의 선함에 따라 얻지 못했더라도
  alternatives_korean:
  - 여러분의 육신이 생애 동안 여러분의 선함에 따라 보상받지 못했더라도
  - 여러분의 육신이 살아 있는 동안 여러분의 선함에 맞게 받지 못했더라도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 목적어가 생략된 상태를 살리면서도 한국어로는 '얻지 못했다'로 자연스럽게 처리했습니다. '육신'은 문자적·신학적 긴장을 보존하기 위해 유지했습니다.
- source_word: አላ ጽንሑ
  english_pob_choice: but wait
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 참으십시오
  - 인내하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 뒤따르는 종말론적 시간표현들과 가장 자연스럽게 결합하는 명령으로, 단순 대기만이 아니라 미래의 판결을 향한 태도를 담습니다.
- source_word: መርገም ወመቅሠፍት
  english_pob_choice: curse and punishment
  chosen_korean: 저주와 형벌
  alternatives_korean:
  - 저주와 징벌
  - 저주와 재앙
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 명사의 병렬성을 살리면서, 최후의 판결에 뒤따르는 법정적·징계적 의미를 간결하게 전달했습니다.
theological_decisions:
- issue: ሲኦል의 한국어 처리
  chosen_reading: 스올을 유지하여 죽은 자의 세계라는 유대 묵시적 배경을 보존합니다.
  alternative_readings:
  - 지옥
  - 무덤
  - 음부
  rationale: '''지옥''은 후대 기독교적 형벌 장소로 기울 수 있고, ''무덤''은 범위를 지나치게 좁힙니다. ''스올''이 본문이 가진 사후 세계 이미지를 가장 덜 왜곡합니다.'
  doctrine_reference: 유대 묵시문학의 저승 개념을 보존하여 후대 교리 용어를 투사하지 않음.
- issue: 육신이 '얻지 못했다'는 절의 의미
  chosen_reading: 현세에서 의인들이 자기 선함에 상응하는 보답을 받지 못했다는 긴장을 남겨 둡니다.
  alternative_readings:
  - 육신이 생명을 얻지 못했다
  - 육신이 상급을 받지 못했다
  rationale: 문맥은 현재의 고난과 미래의 심판을 대비합니다. 따라서 본문이 암시하는 미보상 상태를 드러내되, 정확한 대상어가 생략된 긴장은 과도하게 해소하지 않았습니다.
  doctrine_reference: 명시되지 않은 보상 개념을 본문에 과잉 삽입하지 않음.
