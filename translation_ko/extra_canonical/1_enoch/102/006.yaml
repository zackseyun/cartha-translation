  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접 호칭의 2인칭 복수 동사를 한국어의 시점 표현으로 살려, 미래적 의미를 과도하게 보태지 않으면서도 문맥상 자연스럽게 옮겼습니다.
- source_word: ይብሉ
  english_pob_choice: will say
  chosen_korean: 말할 것입니다
  alternatives_korean:
  - 말할 것입니다
  - 말할 것입니다/이를 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순한 발화 동사이므로, 다음에 이어질 말의 내용을 여는 서술로 ‘말하다’를 택했습니다.
- source_word: ላዕሌክሙ
  english_pob_choice: concerning you
  chosen_korean: 여러분에 대해
  alternatives_korean:
  - 여러분에 관해
  - 여러분을 향해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 최종 수정처럼 이 전치사는 기본적으로 ‘~에 관하여’의 뜻이므로, 적대적 색채를 덧씌우지 않고 가장 직접적인 한국어로 옮겼습니다.
- source_word: ኃጥኣን
  english_pob_choice: the sinners
  chosen_korean: 죄인들이
  alternatives_korean:
  - 죄인들이
  - 죄인들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정관사가 있는 범주 명칭이므로 한국어에서는 집단을 가리키는 복수형으로 처리했습니다.
theological_decisions:
- issue: 발화 방향을 적대적으로 해석할지 여부
  chosen_reading: ‘말할 것입니다’로 두어, 죄인들이 죽은 이들에 대해 말하는 사실 자체를 드러냅니다.
  alternative_readings:
  - ‘여러분을 대적하여 말할 것입니다’
  - ‘여러분에 대해 악담할 것입니다’
  rationale: 게에즈 전치사와 동사는 기본적으로 ‘~에 관해 말하다’의 범위가 넓으므로, 본문이 분명히 말하는 것 이상으로 적대성을 본문에 고정하지 않았습니다. 이는 영어 POB의 최종 수정과도 일치합니다.
  doctrine_reference: Source-preserving ambiguity; avoid resolving lexical tension beyond the text.
