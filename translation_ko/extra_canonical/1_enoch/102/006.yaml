translation:
  language: ko
  text: 그리고 여러분이 죽을 때, 죄인들이 여러분에 대해 말할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሶበ
  english_pob_choice: And when
  chosen_korean: 그리고 … 때
  alternatives_korean:
