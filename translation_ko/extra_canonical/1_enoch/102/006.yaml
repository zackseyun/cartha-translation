  - 그리고 …할 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간을 여는 접속으로 이해하여, 다음 절의 상황을 자연스러운 한국어 조건·시점 표현으로 옮겼습니다.
- source_word: ትመውቱ
  english_pob_choice: you die
  chosen_korean: 여러분이 죽을 때
  alternatives_korean:
