theological_decisions:
- issue: ‘큰 영광’의 지시 대상
  chosen_reading: 하나님 또는 하나님의 압도적 현현을 가리키는 경외적 우회표현으로 두었습니다.
  alternative_readings:
  - 단순한 천상 광휘
  - 천상 법정의 영광 일반
  rationale: 원문은 하나님의 이름을 직접 부르지 않으면서도 심판 장면의 초월적 임재를 가리키므로, 의미를 특정한 설명어로 환원하지 않고 우회표현을 유지했습니다.
  doctrine_reference: apocalyptic reverential circumlocution
- issue: ‘평강’의 부정
  chosen_reading: 너희에게는 평강이 없을 것입니다로 옮겨 심판 선언의 절대적 부정을 드러냈습니다.
  alternative_readings:
  - 너희는 평강을 얻지 못할 것입니다
  - 너희에게 평안은 없을 것입니다
  rationale: 원문의 종결부는 단순한 정서 불안이 아니라 정죄 아래 놓인 자들에게 평강이 부재함을 선언하므로, 성서적 어휘인 ‘평강’을 유지했습니다.
  doctrine_reference: judgment oracle
