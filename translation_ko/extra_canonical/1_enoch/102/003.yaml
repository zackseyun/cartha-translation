  english_pob_choice: will seek to hide themselves from before the Great Glory
  chosen_korean: 그들은 큰 영광 앞에서 자신을 숨기려고 할 것입니다
  alternatives_korean:
  - 그들은 큰 영광 앞에서 숨으려 할 것입니다
  - 그들은 큰 영광의 임재 앞에서 몸을 숨기려 할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘앞에서/면전에서’라는 셈어식 표현을 한국어에서는 자연스럽게 ‘앞에서’로 살리되, 반사 의미인 ‘자신을 숨기다’를 넣어 회피의 뉘앙스를 보존했습니다.
- source_word: ዐቢይ ስብሐት
  english_pob_choice: the Great Glory
  chosen_korean: 큰 영광
  alternatives_korean:
