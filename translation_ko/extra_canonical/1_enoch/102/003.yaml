base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/003.yaml
  text: And all the angels will carry out their commands[a], and they will seek to hide themselves from before the Great Glory; and the children of the earth will tremble and be thrown into confusion. But you sinners are accursed forever[d][c][b], and there will be no peace for you.
  footnotes:
  - marker: a
    text: Or 'from the presence of the great glory.' The Ge'ez uses a Semitic-style expression literally meaning 'from before.'
    reason: lexical_alternative
  - marker: b
    text: '''The children of the earth'' is a literal expression; it can function broadly for earth''s inhabitants, especially humankind under judgment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'their commands'.
    reason: previous_rendering
  - marker: d
    text: Or 'the great glory'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 모든 천사들은 그들의 명령을 수행할 것이며, 그들은 큰 영광 앞에서 자신을 숨기려고 할 것입니다. 땅의 자녀들은 떨며 혼란에 빠질 것입니다. 그러나 너희 죄인들은 영원히 저주받을 것이며, 너희에게는 평강이 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅의 자녀들’은 문자적으로는 ‘땅의 자식들’이라는 표현이며, 여기서는 심판 아래 있는 인류 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰 영광’은 1 에녹에서 하나님을 가리키는 경외적 칭호로 기능할 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: መላእክት
  english_pob_choice: angels
  chosen_korean: 천사들
  alternatives_korean:
