  - 메신저들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥의 존재들은 하늘의 존재들이므로, 인간 사자를 뜻할 수 있는 넓은 표현보다 ‘천사들’이 종말론적 장면을 더 정확히 드러냅니다.
- source_word: ይፌጽሙ ትእዛዞሙ
