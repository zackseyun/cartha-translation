- source_word: ደቂቀ ምድር
  english_pob_choice: the children of the earth
  chosen_korean: 땅의 자녀들
  alternatives_korean:
  - 땅의 사람들
  - 땅의 주민들
  - 땅의 자손들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 친자 표현을 유지해야 묵시문학 특유의 강한 이미지가 살아나므로, 완화된 ‘주민들’보다 ‘땅의 자녀들’을 택했습니다.
- source_word: ይትሀወኩ
  english_pob_choice: be thrown into confusion
  chosen_korean: 혼란에 빠질 것입니다
  alternatives_korean:
  - 뒤흔들릴 것입니다
  - 당황할 것입니다
  - 어지러워질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 공포로 인한 동요와 방향 상실을 담기 위해, 단순한 감정 표현보다 상태 변화를 나타내는 ‘혼란에 빠지다’가 더 적절합니다.
