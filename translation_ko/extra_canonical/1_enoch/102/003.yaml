  - 그들의 명령을 이행할 것이며
  - 그들의 지시를 따를 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘완수하다’보다 명령을 실행한다는 뜻이 분명한 한국어 ‘수행하다’가 적절하며, POB의 수정 반영에 맞춰 복수 ‘명령들’로 옮겼습니다.
