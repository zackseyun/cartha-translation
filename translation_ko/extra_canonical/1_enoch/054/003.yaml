base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/003.yaml
  text: And there my eyes saw their instruments[d][c][b][a], as they were making iron chains without measure.
  footnotes:
  - marker: a
    text: The Ge'ez term rendered 'instruments' may also be understood more specifically as 'tools' or 'implements' associated with the work being done.
    reason: lexical_alternative
  - marker: b
    text: Or 'iron fetters.' The noun denotes devices for binding.
    reason: lexical_alternative
  - marker: c
    text: Literally 'without measure'; the phrase may also imply 'without limit' or 'immeasurable.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the instruments while they were making iron chains without measure'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기서 내 눈은 그들이 한량없이 철사슬들을 만들고 있는 그들의 도구들을 보았습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 게에즈어는 여기서 ‘도구’보다 더 구체적으로 ‘작업 도구’나 ‘작업에 쓰이는 기구’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘쇠족쇄들’입니다. 이 명사는 결박용 기구를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘한량없이’입니다. 이 표현은 ‘무제한으로’ 또는 ‘헤아릴 수 없이’라는 뜻도 담을 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘그들의 도구들을 보았는데, 그들이 한량없이 철사슬들을 만들고 있었습니다’입니다.
    reason: previous_rendering
