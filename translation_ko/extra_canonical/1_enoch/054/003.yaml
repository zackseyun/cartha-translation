theological_decisions:
- issue: 1인칭 시점과 환상 묘사의 긴장
  chosen_reading: ‘내 눈은 보았습니다’로 직역하되, 자연스러운 문장 안에 환상 보고의 긴박함을 보존했습니다.
  alternative_readings:
  - ‘내가 보았습니다’로 평이화
  - ‘내 눈으로 보았습니다’로 설명화
  rationale: 본문은 단순 서술이 아니라 묵시적 환시 보고이므로, 시각 기관을 전면에 두는 표현을 유지해 장면성을 약화시키지 않았습니다.
  doctrine_reference: Apocalyptic vision language should remain vivid and concrete.
- issue: ‘도구들’과 ‘철사슬들’의 관계
  chosen_reading: 도구와 철사슬을 별개 항목으로 두되, 사슬 제작 장면으로 읽히도록 배치했습니다.
  alternative_readings:
  - 도구들을 철사슬로 풀어 하나의 대상처럼 처리
  - 도구들만 언급하고 사슬은 설명으로 처리
  rationale: 원문은 작업 도구와 제작 중인 철사슬을 함께 제시하는 것으로 읽히므로, 둘을 모두 드러내되 해설적 확대는 피했습니다.
  doctrine_reference: Preserve concrete apocalyptic imagery without flattening the scene.
