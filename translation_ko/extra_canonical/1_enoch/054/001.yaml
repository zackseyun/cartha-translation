base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/001.yaml
  text: And I looked and turned to another part of the earth[b][a], and I saw there a deep valley with burning fire.
  footnotes:
  - marker: a
    text: Literally, 'another face of the earth,' an idiom for another region or side of the earth.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be rendered 'where fire was burning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 보니, 나는 몸을 돌려 땅의 다른 지역으로 향했으며, 거기서 타오르는 불이 있는 깊은 골짜기를 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘땅의 다른 얼굴’로, 땅의 다른 지역이나 편을 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘불이 타오르고 있는 곳에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
