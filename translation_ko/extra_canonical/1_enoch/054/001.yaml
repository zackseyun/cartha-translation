theological_decisions:
- issue: 환시 서술의 시점과 동작 흐름
  chosen_reading: ‘보니, … 보았습니다’로 두 단계의 시각 동사를 구분해 환시의 연속성을 살렸습니다.
  alternative_readings:
  - ‘내가 보고 돌아서서’
  - ‘내가 바라보고 방향을 돌리니’
  rationale: 원문은 ‘보다’와 ‘돌다’가 연속되어 시각적 전환을 강조하므로, 이를 한국어에서도 분리해 드러내는 편이 장면의 힘을 더 잘 보존합니다.
  doctrine_reference: 해석학적 서술 정확성
- issue: ‘another face of the earth’의 관용성
  chosen_reading: 본문은 ‘땅의 다른 지역’으로 옮기고, 문자적 관용은 각주로 보완하지 않았습니다.
  alternative_readings:
  - ‘땅의 다른 얼굴’
  - ‘땅의 다른 편’
  rationale: 한국어 독자가 즉시 이해할 수 있는 공간 표현을 우선하되, 원문의 관용적 이미지가 약화되지 않도록 ‘다른’이라는 대비를 유지했습니다.
  doctrine_reference: 텍스트-표현 등가성
