base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/007.yaml
  text: And in those days the punishment from the Lord of Spirits will come[b][a], and all the storehouses of the waters that are above the heavens [and the fountains that are beneath the heavens] and those beneath the earth will be opened.
  footnotes:
  - marker: a
    text: The bracketed clause in the OCR after 'above the heavens' appears to repeat the phrase about what is beneath, likely reflecting textual disturbance or duplication in the witness. The main translation follows the clearer sequence and renders the final clause once.
    reason: textual_variant
  - marker: b
    text: '''Storehouses of the waters'' reflects ancient cosmological imagery of heavenly reservoirs kept for divine use in judgment.'
    reason: cultural_note
translation:
  language: ko
  text: 그 날들에 영들의 주님에게서 벌이 닥칠 것이며, 하늘들 위에 있는 물들의 모든 저장고와 [하늘들 아래에 있는 샘들]과 땅 아래에 있는 샘들이 열릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 ‘하늘들 아래에 있는 샘들’은 현전 본문에 들어 있으나, 앞뒤의 ‘아래’ 표현과 반복되어 전승 과정의 중복 또는 본문 교란을 반영할 가능성이 있습니다. 번역은 이 구절을 대괄호 안에 보존합니다.
    reason: textual_variant
  - marker: b
    text: ‘물들의 저장고’와 하늘 및 땅 아래의 샘들은 심판 때 열릴 수 있는 우주적 물의 저장처를 상정하는 고대의 우주론적 이미지입니다.
    reason: cultural_note
