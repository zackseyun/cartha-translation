  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 저장고와 샘에 맞는 직접적 표현으로 ‘열리다’를 사용해, 물이 풀려 나오는 역동성을 유지했습니다.
theological_decisions:
- issue: 우주적 심판 이미지의 보존
  chosen_reading: 하늘 위와 하늘 아래, 땅 아래의 물이 실제로 열리는 우주론적 심판 장면으로 읽습니다.
  alternative_readings:
  - 비유적 심판 표현으로 완화하여 읽기
  - 단순히 비가 오는 자연현상으로 읽기
  rationale: 본문은 저장고와 샘, 하늘과 땅 아래라는 구체적 우주 질서를 제시하므로, 상징으로만 약화하지 않고 아포칼립스적 실재성을 유지해야 합니다.
  doctrine_reference: Apocalyptic cosmology should remain concrete rather than flattened into generic metaphor.
