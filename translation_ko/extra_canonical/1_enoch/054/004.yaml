base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/004.yaml
  text: And I asked the angel of peace who went with me[a], saying[b], “These chains of the instruments—for whom are they being prepared?”
  footnotes:
  - marker: a
    text: The Ge'ez phrase translated 'of the instruments' is uncertain in this witness; it may refer more specifically to implements or devices associated with punishment.
    reason: textual_variant
  - marker: b
    text: Or 'these bonds' / 'these fetters.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 나와 함께 가던 평화의 천사에게 물었습니다[a]. “이 쇠사슬들은[b] 누구를 위해 준비되고 있습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문의 ‘나와 함께 가던’에 해당하는 관계절을 살려, 동반자인 천사를 수식하는 표현으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 게에즈의 어휘는 여기서 형벌용 사슬/결박을 가리키는 것으로 보이지만, 본문 증거상 ‘도구/장치’의 뉘앙스가 완전히 배제되지는 않습니다.
    reason: textual_variant
