- source_word: ለመኑ ይዴለዉ
  english_pob_choice: for whom are they being prepared
  chosen_korean: 누구를 위해 준비되고 있습니까
  alternatives_korean:
  - 누구를 위해 마련되고 있습니까
  - 누구를 위해 만들어지고 있습니까
  - 누구를 위해 준비됩니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 미래 지향적 수동 의미를 살려 ‘준비되고 있습니까’로 옮겼습니다. 질문의 목적어는 누구인지 묻는 구조도 분명히 드러납니다.
theological_decisions:
- issue: 비전 속 형벌 도구의 구체성 유지
  chosen_reading: 추상적인 ‘벌’이나 ‘심판’으로 풀지 않고, 눈앞에 보이는 물체인 ‘쇠사슬들’과 ‘준비되고 있습니까’라는 표현을 유지했습니다.
  alternative_readings:
  - 이 형벌은 누구를 위한 것입니까
  - 이 결박은 누구에게 쓰이도록 마련되었습니까
  rationale: 본문은 심판의 일반론이 아니라 비전 속 대상과 그 용도를 묻는 장면이므로, 구체적 이미지가 흐려지지 않게 했습니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic imagery; do not flatten judgment formulas into generic prose.'
