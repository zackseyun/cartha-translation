base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/006.yaml
  text: And Michael and Gabriel and Raphael and Phanuel—they will seize them on that great day and cast them into the burning furnace on that day[a], so that the Lord of Spirits may take vengeance on them for their lawlessness[c][b], because they became servants of Satan and led astray those who dwell upon the dry land.
  footnotes:
  - marker: a
    text: Or 'take hold of them' for 'seize them'; the Ge'ez verb indicates forceful apprehension, but the exact nuance is difficult in this Ge'ez-only section.
    reason: lexical_alternative
  - marker: b
    text: Literally 'upon the dry land.' This may simply mean the earth's inhabitants, but the more concrete wording has been retained because the Parables survive effectively only in Ge'ez here.
    reason: lexical_alternative
  - marker: c
    text: The phrase rendered 'servants of Satan' is textually and lexically difficult; 'slaves of Satan' or, less likely, 'messengers of Satan' are possible.
    reason: textual_variant
translation:
  language: ko
  text: 미카엘과 가브리엘과 라파엘과 파누엘은 그 큰 날에 그들을 붙잡아 그 날에 타오르는 풀무 속으로 던질 것입니다. 그렇게 하여 주님은 그들의 불법에 대해 그들에게 복수하시고, 그들이 사탄의 종이 되어 마른 땅 위에 사는 자들을 그릇되게 했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙잡아’는 강제적 체포를, ‘그릇되게 했기 때문입니다’는 POB의 ‘led astray’를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: ያፀንዕዎሙ
  english_pob_choice: they will seize them
  chosen_korean: 그들을 붙잡아
  alternatives_korean:
  - 그들을 잡아
  - 그들을 사로잡아
  - 그들을 붙들어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 강제적인 체포 행위를 드러내면서도, ‘사로잡다’보다 덜 군사적이고 본문의 심판 장면에 자연스럽게 맞는 동사를 택했습니다.
- source_word: እቶን ዘይነድድ
  english_pob_choice: the burning furnace
  chosen_korean: 타오르는 풀무
  alternatives_korean:
  - 불타는 풀무
  - 불타는 화로
  - 타오르는 화덕
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 구체적 이미지인 furnace를 살리되, ‘풀무’는 한국어 성경 문체에서 불의 심판 도상으로 충분히 전달되므로 이를 택했습니다.
- source_word: ይትበቀል
  english_pob_choice: may take vengeance
  chosen_korean: 복수하시고
  alternatives_korean:
  - 보복하시고
  - 원수를 갚으시고
  - 응징하시고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 단순 처벌이 아니라 심판자의 응보 행위를 가리키므로, 본문의 강한 보복성을 유지하는 ‘복수하시다’를 사용했습니다.
- source_word: በዓመፃሆሙ
  english_pob_choice: for their lawlessness
  chosen_korean: 그들의 불법에 대해
  alternatives_korean:
  - 그들의 무법에 대해
  - 그들의 죄악에 대해
  - 그들의 불의에 대해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 법질서 위반과 반역적 악함을 함께 살리기 위해 ‘불법’을 택했습니다. 이는 단순한 도덕적 잘못보다 더 강한 심판 사유를 드러냅니다.
- source_word: ላእከ ሰሰይጣን
  english_pob_choice: servants of Satan
  chosen_korean: 사탄의 종이 되어
  alternatives_korean:
  - 사탄의 노예가 되어
  - 사탄의 하인이 되어
  - 사탄의 사자가 되어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본값은 ‘종’이지만, 여기서는 배신적 소속과 복종의 상태를 분명히 보여 주기 위해 ‘되다’ 구문으로 자연스럽게 옮겼습니다. POB의 ‘servants of Satan’ 선택도 이 방향을 지지합니다.
- source_word: እለ የኀድሩ ዲበ የብስ
  english_pob_choice: those who dwell upon the dry land
  chosen_korean: 마른 땅 위에 사는 자들
  alternatives_korean:
  - 땅 위에 사는 자들
  - 마른 땅에 거하는 자들
  - 육지에 사는 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB가 보존한 ‘dry land’의 구체성을 살려 ‘마른 땅 위에’로 옮겼습니다. 단순한 ‘땅’으로 평탄화하지 않기 위해 이 표현을 유지했습니다.
theological_decisions:
- issue: 보복·심판 언어를 얼마나 직접적으로 드러낼지
  chosen_reading: ‘복수하시고’와 불의의 형벌 이미지를 그대로 유지합니다.
  alternative_readings:
  - ‘심판하시고’로 완화합니다.
  - ‘응징하시고’로 바꿉니다.
  rationale: 이 본문은 종말론적 심판 장면이므로, 독자가 느껴야 할 응보의 무게를 흐리지 않도록 강한 보복 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘사탄의 종’의 사회적/신학적 뉘앙스
  chosen_reading: 존재론적 ‘노예’로 단정하지 않고, 사탄에게 속해 복종하는 상태를 나타내는 ‘종’으로 옮깁니다.
  alternative_readings:
  - ‘사탄의 노예’로 옮깁니다.
  - ‘사탄의 사자’로 옮깁니다.
  rationale: 게에즈 표현은 소속과 섬김을 분명히 하지만, 여기에 더 강한 제도적 노예제를 확정할 근거는 부족하므로, 서술적 긴장을 보존하는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 4
