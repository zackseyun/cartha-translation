  - 그들의 사자/천사를 덮음
  rationale: 최신 판독에 따라 본문의 신체 부위를 살리고, 에녹서의 가혹한 심판 이미지를 약화시키지 않기 위해 직역에 가깝게 유지했습니다.
  doctrine_reference: 본문의 심판 이미지를 완화하지 않음
