  rationale: 게에즈 본문이 난해하지만, 복수 대명사와 형벌 문맥을 고려하면 집합적 이해가 가장 무난합니다.
  doctrine_reference: 원문 우선, 난해 구절에서는 해석을 과도하게 단정하지 않음
- issue: ‘그들의 턱’을 덮는 형벌 이미지
  chosen_reading: 신체적 형벌을 가리키는 것으로 보존했습니다.
  alternative_readings:
