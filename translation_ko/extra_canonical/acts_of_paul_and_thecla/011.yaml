  text: '11:1 The devil then put evil counsel into their minds. One day, when they had gathered to consult together, they reasoned among themselves: “The virgin is a priestess of the great goddess Diana, and whatever she asks of her is granted, because she is a virgin and is therefore loved by all the gods.


    11:2 Now, then, let us hire some immoral young men. After we have made them sufficiently drunk and given them a large sum of money, let us order them to go and violate this virgin, promising them an even greater reward if they do it.”


    11:3 (For they had concluded among themselves that if they could violate her, the gods would no longer regard her, nor would Diana heal the sick for her.)


    11:4 They carried out this plan. The young men went to the mountain and came to the cave as fierce as lions, knocking at the door.


    11:5 The holy martyr Thecla, trusting in the God in whom she believed, opened the door, although she had already been warned of their plan. She said to them, “Young men, what is your business?”


    11:6 They replied, “Is anyone here whose name is Thecla?” She answered, “What do you want with her?” They said, “We intend to lie with her.”


    11:7 The blessed Thecla answered, “Although I am a lowly old woman, I am the servant of my Lord Jesus Christ. And although you have a vile design against me, you will not be able to accomplish it.” They replied, “It is impossible that we should not be able to do with you whatever we want.”


    11:8 While they were saying this, they seized her by force and intended to rape her. Then she said to them with the (greatest) gentleness, “Young men, be patient and see the glory of the Lord.”


    11:9 While they held her, she looked up to heaven and said, “O most reverend God, to whom no one can be compared, who glorifies yourself over your enemies; who delivered me from the fire and did not give me up to Thamyris or to Alexander; who delivered me from the wild beasts; who preserved me in the deep waters; who have everywhere been my helper and have glorified your name in me:


    11:10 Now also deliver me from the hands of these wicked and unreasonable men. Do not allow them to violate the chastity that I have preserved until now for your honor. For I love you, long for you, and worship you, O Father, Son, and Holy Spirit, forever. Amen.”


    11:11 Then a voice came from heaven, saying, “Do not be afraid, Thecla, my faithful servant, for I am with you. Look and see the place that has been opened for you. There your eternal dwelling shall be; there you shall receive the beatific vision.”


    11:12 The blessed Thecla looked and saw that the rock had opened wide enough for a person to enter. She did as she had been commanded, bravely escaped from the vile group, and entered the rock. It immediately closed so completely that no crack was visible where it had opened.


    11:13 The men stood utterly astonished at such a remarkable miracle and had no power to detain the servant of God. But as they caught hold of her veil, or hood, they tore off a piece of it.


    11:14 Even this happened by God’s permission, to confirm the faith of those who would come to see this venerable place and to convey blessings to people in succeeding ages who would believe in our Lord Jesus Christ with a pure heart.


    11:15 Thus suffered Thecla, that first martyr and apostle of God, and virgin. She came from Iconium at eighteen years of age. Afterward, partly through journeys and travels and partly through a monastic life in the cave, she lived for seventy-two years, so that she was ninety years old when the Lord translated her.


    11:16 Thus ends her life.


    11:17 The day kept sacred to her memory is the twenty-fourth of September, to the glory of the Father, the Son, and the Holy Spirit, now and forever. Amen.'
translation:
  language: ko
  text: '바울과 테클라 행전 — 제11장


    11:1 그때 악마가 그들의 마음에 악한 계책을 불어넣었습니다. 어느 날 그들은 함께 모여 의논하며 서로 이렇게 말했습니다. “그 처녀는 위대한 여신 디아나의 여사제입니다.[a] 그가 여신에게 무엇을 청하든 다 이루어집니다. 그가 처녀이므로 모든 신의 사랑을 받기 때문입니다.


    11:2 그러니 이제 방탕한 젊은이들을 몇 명 구합시다. 그들을 잔뜩 취하게 하고 많은 돈을 준 다음, 가서 이 처녀를 욕보이라고 시킵시다. 그렇게 하면 더 큰 보상을 주겠다고 약속합시다.”


    11:3 그들은 그 처녀를 욕보일 수만 있다면 신들이 더는 그를 돌보지 않을 것이며, 디아나도 그를 위하여 병자들을 고쳐 주지 않을 것이라고 서로 판단했던 것입니다.


    11:4 그들은 이 계책대로 실행했습니다. 젊은이들은 산으로 올라가 사자처럼 사납게 굴로 다가와 문을 두드렸습니다.


    11:5 거룩한 순교자 테클라는 자신이 믿는 하나님을 의지하여 문을 열었습니다. 그는 이미 그들의 계책을 알고 있었지만, 그들에게 물었습니다. “젊은이들이여, 무슨 일로 왔습니까?”


    11:6 그들이 대답했습니다. “이 안에 테클라라는 사람이 있습니까?” 테클라가 “그에게 무슨 볼일이 있습니까?” 하고 묻자, 그들이 말했습니다. “우리는 그와 동침하려고 합니다.”


    11:7 복된 테클라가 대답했습니다. “나는 보잘것없는 늙은 여자이지만 내 주 예수 그리스도의 종입니다. 여러분이 나를 해치려는 더러운 계략을 품었어도 그것을 이루지는 못할 것입니다.” 그들이 대답했습니다. “우리가 원하는 대로 당신에게 하지 못할 리 없습니다.”


    11:8 그들은 이렇게 말하면서 테클라를 억지로 붙잡고 강간하려 했습니다. 그러자 테클라는 지극히 온유하게 말했습니다. “젊은이들이여, 잠시 기다리고 주님의 영광을 보십시오.”[b]


    11:9 그들에게 붙들린 채 테클라는 하늘을 우러러보며 말했습니다. “아무도 견줄 수 없는 지극히 존귀하신 하나님, 원수들 위에 주님의 영광을 드러내시는 분, 저를 불에서 건지시고 타미리스에게도 알렉산더에게도 넘겨주지 않으신 분, 저를 들짐승들에게서 건지시고 깊은 물속에서 지켜 주신 분, 어디에서나 저를 도우시며 제 안에서 주님의 이름을 영화롭게 하신 분이시여,


    11:10 이제도 이 악하고 사리에 맞지 않는 자들의 손에서 저를 건져 주십시오. 제가 지금까지 주님을 공경하여 지켜 온 정절을 그들이 욕보이지 못하게 해 주십시오. 저는 주님을 사랑하고 사모하며, 성부와 성자와 성령이신 주님을 영원히 경배합니다. 아멘.”


    11:11 그때 하늘에서 음성이 들려왔습니다. “내 충실한 종 테클라야, 두려워하지 마라. 내가 너와 함께 있다. 보아라. 너를 위하여 열린 곳을 보아라. 그곳이 네 영원한 거처가 될 것이며, 그곳에서 너는 복된 환시를 보게 될 것이다.”[c]


    11:12 복된 테클라가 바라보니, 바위가 사람 하나가 들어갈 만큼 넓게 열려 있었습니다. 그는 명령받은 대로 용감하게 그 악한 무리에게서 벗어나 바위 속으로 들어갔습니다. 그러자 바위는 곧바로 완전히 닫혀, 열렸던 자리에는 틈 하나도 보이지 않았습니다.


    11:13 그 사람들은 이처럼 놀라운 기적을 보고 넋을 잃고 서 있었으며, 하나님의 종을 붙잡아 둘 힘이 없었습니다. 다만 그들은 테클라의 너울, 곧 머리쓰개를 붙잡다가 그 일부를 찢어 냈습니다.[d]


    11:14 이 일조차 하나님께서 허락하신 것이었습니다. 훗날 이 존귀한 장소를 보러 오는 이들의 믿음을 굳게 하고, 순수한 마음으로 우리 주 예수 그리스도를 믿을 후대 사람들에게 복을 전하게 하시려는 것이었습니다.


    11:15 이와 같이 하나님의 첫 순교자이며 사도이고 처녀인 테클라가 고난을 받았습니다.[e] 그는 열여덟 살에 이고니온을 떠나왔습니다. 그 뒤로 여행과 나그네 생활을 하기도 하고 굴에서 수도 생활을 하기도 하면서 일흔두 해를 살았습니다. 그리하여 아흔 살이 되었을 때 주님께서 그를 옮겨 가셨습니다.[f]


    11:16 이렇게 그의 생애가 끝납니다.


    11:17 그를 기념하여 거룩하게 지키는 날은 9월 24일입니다. 성부와 성자와 성령께 영광이 이제와 영원토록 있기를 빕니다. 아멘.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘디아나’는 로마식 이름이며 그리스의 아르테미스와 동일시됩니다. 이 번역은 제공된 영문 증거문의 명칭을 따릅니다.
    reason: 원어 전통을 직접 대조하지 못한 상태에서 신명 표기의 배경을 설명합니다.
  - marker: b
    text: 증거문에는 ‘지극히’에 해당하는 말이 괄호 안에 제시되어 있어, 본문에는 그 의미를 반영했습니다.
    reason: 영문 증거문이 표시한 괄호상의 불확실성을 독자에게 알립니다.
  - marker: c
    text: ‘복된 환시’는 전통적으로 하나님을 뵙는 복된 광경을 가리킬 수 있으나, 여기서는 특정한 후대 교리로 한정하지 않았습니다.
    reason: 신학적으로 함축적인 표현의 범위를 과도하게 확정하지 않습니다.
  - marker: d
    text: ‘너울’인지 ‘머리쓰개’인지 증거문 자체가 두 표현을 병기합니다.
    reason: 의복 명칭의 어휘적 불확실성을 보존합니다.
  - marker: e
    text: ‘첫’이 모든 그리스도교 순교자와 사도 가운데 첫째라는 뜻인지, 여성이나 특정 지역·전승 안에서 첫째라는 뜻인지는 이 증거문만으로 확정하기 어렵습니다.
    reason: 칭호의 실제 범위에 존재하는 모호성을 드러냅니다.
  - marker: f
    text: ‘옮겨 가셨다’는 표현은 죽음을 완곡하게 이르거나 기적적인 이동을 뜻할 수 있습니다. 증거문은 어느 쪽인지 명시하지 않습니다.
    reason: ‘translated’의 신학적·서사적 모호성을 보존합니다.
lexical_decisions:
- source_word: Diana
  choice: 디아나
  rationale: 제공된 영문 증거문의 명칭을 음역했습니다. 그리스 전통의 아르테미스와 동일시되지만, 직접적인 그리스어 본문 검토 전에는 증거문의 형태를 보존하는 편이 안전합니다.
- source_word: debauch / violate
  choice: 욕보이다
  rationale: 문맥상 성폭력을 뜻하며, 본문의 엄중함을 유지하면서도 반복 구절에서는 자연스럽고 품위 있는 한국어를 사용했습니다. 실제 시도 장면인 11:8에서는 의미를 명확히 하려고 ‘강간하려 했다’로 옮겼습니다.
- source_word: mean old woman
  choice: 보잘것없는 늙은 여자
  rationale: ‘mean’은 여기서 비열하다는 뜻보다 낮고 미천하다는 자기 낮춤으로 이해하여 번역했습니다.
- source_word: unreasonable men
  choice: 사리에 맞지 않는 자들
  rationale: 악함과 함께 이성적·도덕적 질서를 거스른다는 표현의 긴장을 보존했습니다.
- source_word: beatific vision
  choice: 복된 환시
  rationale: 후대의 특정 교리 용어로 과도하게 확정하지 않고, 하나님이 보여 주시는 복된 광경이라는 증거문의 의미를 유지했습니다.
- source_word: translated her
  choice: 그를 옮겨 가셨습니다
  rationale: 죽었다고 평준화하지 않고, 하나님이 다른 상태나 장소로 옮기셨다는 완곡하고 신학적인 표현을 보존했습니다.
theological_decisions:
- issue: 테클라를 ‘첫 순교자이며 사도’라고 부르는 결말의 칭호
  choice: 본문의 칭호를 그대로 보존했습니다.
