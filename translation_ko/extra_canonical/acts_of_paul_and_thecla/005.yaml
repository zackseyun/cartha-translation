  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/005.yaml
  text: '5:1 At last Thecla was missed, and her family and Thamyris searched for her in every street, as though she had been lost. But one of the gatekeeper’s fellow servants told them that she had gone out during the night.


    5:2 Then they questioned the gatekeeper, and he told them that she had gone to the prison to see the stranger.


    5:3 So they followed his directions and found her there. When they came out, they gathered a mob and went and told the governor everything that had happened.


    5:4 At this, he ordered Paul to be brought before his judgment seat.


    5:5 Meanwhile, Thecla lay wallowing on the prison floor, in the very place where Paul had sat while teaching her. So the governor also ordered her to be brought before his judgment seat. She received the summons with joy and went.


    5:6 When Paul was brought there, the mob cried out even more fiercely, “He is a magician! Let him die!”


    5:7 Nevertheless, the governor listened with pleasure to Paul’s discourses about the holy works of Christ. After convening a council, he summoned Thecla and said to her, “Why do you not marry Thamyris, according to the law of the Iconians?”


    5:8 She stood silent, with her eyes fixed on Paul. When she gave no answer, her mother, Theoclia, cried out, “Let the unjust creature be burned! Let her be burned in the middle of the theater for refusing Thamyris, so that all women may learn from her to avoid such practices!”


    5:9 Then the governor became exceedingly distressed and ordered Paul to be whipped out of the city and Thecla to be burned.


    5:10 So the governor arose and went immediately into the theater, and all the people went out to see the dreadful sight.


    5:11 But just as a lamb in the wilderness looks all around for its shepherd, Thecla looked around for Paul.


    5:12 As she looked at the multitude, she saw the Lord Jesus in the likeness of Paul and said to herself, “Paul has come to see me in my distress.” She fixed her eyes on him, but as she watched, he immediately ascended into heaven.


    5:13 Then the young men and women brought wood and straw for Thecla’s burning. When she was brought naked to the stake, the governor gazed in amazement at the greatness of her beauty and was moved to tears.


    5:14 When they had arranged the wood, the people commanded her to step onto it. She did so, first making the sign of the cross.


    5:15 Then the people set fire to the pile. Although the flame was exceedingly large, it did not touch her, for God had compassion on her and caused a great eruption from the earth beneath, while a cloud above poured down great quantities of rain and hail.


    5:16 Because of the rupture of the earth, very many were in great danger, and some were killed. The fire was extinguished, and Thecla was preserved.'
translation:
  language: ko
  text: '## 제5장[a]


    **5:1** 마침내 더클라가 보이지 않자, 가족들과 타미리스는 더클라가 길을 잃기라도 한 듯 거리마다 찾아다녔습니다. 그런데 문지기의 동료 종 하나가 더클라가 밤중에 나갔다고 그들에게 말했습니다.


    **5:2** 그러자 그들은 문지기를 추궁했고, 문지기는 더클라가 그 낯선 사람을 만나러 감옥에 갔다고 말했습니다.


    **5:3** 그들은 문지기가 알려 준 대로 가서 그곳에서 더클라를 찾았습니다. 그들은 밖으로 나온 뒤 무리를 모아 총독에게 가서 일어난 일을 모두 알렸습니다.


    **5:4** 그러자 총독은 바울을 자기 재판석 앞으로 데려오라고 명령했습니다.


    **5:5** 그동안 더클라는 감옥 바닥에 엎드린 채, 바울이 앉아서 자기를 가르치던 바로 그 자리를 떠나지 않고 있었습니다. 총독은 더클라도 자기 재판석 앞으로 데려오라고 명령했습니다. 더클라는 그 소환을 기쁘게 받아들이고 갔습니다.


    **5:6** 바울이 끌려오자 무리는 더욱 사납게 외쳤습니다. “이자는 마술사다! 죽여라!”


    **5:7** 그러나 총독은 그리스도의 거룩한 일들에 관한 바울의 말을 기꺼이 귀담아들었습니다. 총독은 회의를 소집한 뒤 더클라를 불러 말했습니다. “너는 어찌하여 이고니온 사람들의 법에 따라 타미리스와 혼인하지 않느냐?”


    **5:8** 더클라는 바울에게 시선을 고정한 채 아무 말 없이 서 있었습니다. 더클라가 대답하지 않자, 그의 어머니 테오클리아가 소리쳤습니다. “저 불의한 것을 불태우십시오! 타미리스를 거부한 저것을 극장 한가운데서 불태워, 모든 여자가 이것을 보고 그런 짓을 피하도록 하십시오!”


    **5:9** 총독은 몹시 괴로워하면서, 바울은 채찍질하여 성 밖으로 내쫓고 더클라는 불태우라고 명령했습니다.


    **5:10** 총독은 자리에서 일어나 곧바로 극장으로 갔고, 온 백성도 그 참혹한 광경을 보려고 밖으로 몰려갔습니다.


    **5:11** 그러나 광야의 어린양이 자기 목자를 찾으려고 사방을 둘러보듯, 더클라는 바울을 찾아 주위를 둘러보았습니다.


    **5:12** 더클라는 군중을 바라보다가 바울의 모습을 한 주 예수를 보았습니다. 그는 마음속으로 말했습니다. “내가 고난당하는 것을 보려고 바울이 왔구나.” 더클라는 그분에게 시선을 고정했지만, 그가 바라보는 동안 그분은 곧 하늘로 올라가셨습니다.


    **5:13** 젊은 남녀들이 더클라를 불태울 장작과 짚을 가져왔습니다. 더클라가 벌거벗은 채 장작더미 앞으로 끌려오자, 총독은 그의 빼어난 아름다움을 보고 놀라 눈물을 흘렸습니다.


    **5:14** 사람들이 장작을 다 쌓은 뒤 더클라에게 그 위로 올라가라고 명령했습니다. 더클라는 먼저 십자가 표를 한 다음 그 위로 올라갔습니다.


    **5:15** 사람들이 장작더미에 불을 붙였습니다. 불길이 몹시 거셌지만 더클라에게 닿지 않았습니다. 하나님께서 그를 불쌍히 여기셔서, 아래에서는 땅이 크게 갈라지게 하시고 위에서는 구름이 많은 비와 우박을 쏟아붓게 하셨기 때문입니다.


    **5:16** 땅이 갈라지는 바람에 아주 많은 사람이 큰 위험에 빠졌고, 일부는 죽었습니다. 불은 꺼졌고 더클라는 목숨을 건졌습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 현재 제공된 1820년 제러마이어 존스의 공용 영어 번역 증언을 바탕으로 마련한 잠정 초안입니다. 그리스어 및 고대 역본의 필사본 전통에 대한 직접 대조가 아직 남아 있으므로, 세부 표현은 원어 검토 뒤 달라질 수 있습니다.
    reason: 제공 자료가 그리스어 원문 자체가 아니라 영어 증언이며 원어 검토가 보류 중이라는 본문 비평상의 한계를 독자에게 투명하게 알립니다.
lexical_decisions:
- source_word: porter / gatekeeper
  choice: 문지기
  rationale: 가문의 출입문을 지키는 종이라는 문맥을 자연스럽고 간결하게 전달했습니다.
- source_word: judgement seat
  choice: 재판석
  rationale: 통치자가 공식적으로 심리하고 판결하는 자리를 나타내되 지나치게 현대적인 법정 용어는 피했습니다.
- source_word: magician
  choice: 마술사
  rationale: 초자연적 술법을 행한다는 군중의 적대적 고발을 직접 보존했습니다.
- source_word: holy works of Christ
  choice: 그리스도의 거룩한 일들
  rationale: ‘works’의 지시 대상을 특정 교리나 기적으로 좁히지 않고 원문 증거층의 폭을 유지했습니다.
- source_word: law of the Iconians
  choice: 이고니온 사람들의 법
  rationale: 도시 공동체의 법이나 관습을 가리킬 수 있는 표현의 여지를 남겼습니다.
- source_word: making the sign of the cross
  choice: 십자가 표를 하다
  rationale: 후대의 특정 교파적 몸짓이나 예식 방식으로 상세화하지 않고 증언의 표현을 그대로 전달했습니다.
- source_word: preserved
  choice: 목숨을 건졌다
  rationale: 화형에서 생존했다는 문맥상 뜻을 현대 한국어로 분명하게 표현했습니다.
theological_decisions:
- issue: 바울의 모습을 한 주 예수의 현현
  choice: ‘바울의 모습을 한 주 예수’로 번역
  alternative: 바울이 곧 예수라는 동일시로 해석
  rationale: 이 장면이 말하는 외형적 유사성을 보존하고, 인물의 존재론적 동일성으로 확장하지 않았습니다.
- issue: 십자가 표
  choice: 행위 자체만 간결히 진술
  alternative: 특정 전례적 성호 방식으로 설명
  rationale: 본문이 제공하는 범위를 넘어 후대 교파의 관행을 소급해 넣지 않았습니다.
- issue: 기적의 주체
  choice: 하나님께서 더클라를 불쌍히 여기셔서 자연 현상을 일으키셨다고 명시
  alternative: 우연한 자연재해로 완화
  rationale: 현존 영어 증언이 제시하는 신적 인과관계를 보존했습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 서술은 자연스럽고 존엄하게 유지하되, 군중과 인물의 직접 발화에는 문맥에 맞는 명령형과 해체를 사용했습니다. 고대 재판·극장·화형 장면의 역사적 거리를 보존하면서도 일반 독자가 즉시 이해할 수 있는 어휘를 택했습니다.
