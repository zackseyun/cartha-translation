review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언과 대조할 때 전반적인 사건 순서와 의미는 충실합니다. 다만 5:5의 ‘lay wallowing’은 단순히 엎드려 자리를 떠나지 않은 상태가 아니라 바닥에서 뒹구는 모습을 나타내므로 보완이 필요합니다. 5:12에서는 더클라를 가리키는 대명사가 남성형 ‘그는/그가’로 되어 있어 지시 대상이 잘못되었습니다. 5:13의 ‘stake’도 ‘장작더미 앞으로’보다 화형 기둥으로 옮기는 편이 정확합니다. 직접적인 그리스어 대조 자료는 제공되지 않았으므로, 본 평가는 우선 제공된 영어 증언에 근거합니다.
  naturalness: 합쇼체 서술은 대체로 자연스럽고, 직접 발화의 격앙된 어조도 잘 살아 있습니다. 다만 5:5는 ‘엎드린 채 … 떠나지 않고’가 원문의 동작을 약화하며, 5:12의 잘못된 성별 대명사는 한국어 독해를 현저히 방해합니다.
  terminology: 더클라, 타미리스, 테오클리아, 이고니온, 바울, 주 예수, 재판석, 십자가 표 등의 선택은 일관되고 적절합니다. ‘마술사’는 여기서 적대적 고발의 표현을 보존하는 무난한 번역입니다. ‘그리스도의 거룩한 일들’도 해석을 과도하게 좁히지 않습니다.
  issues:
  - severity: medium
    issue: 5:5 ‘lay wallowing on the ground’의 동작이 약화됨
    rationale: ‘감옥 바닥에 엎드린 채 … 떠나지 않고 있었습니다’는 뒹구는 상태와 동작을 ‘자리 고수’로 바꾸어 놓습니다. ‘감옥 바닥에서 뒹굴고 있었습니다’가 증언에 더 가깝습니다.
  - severity: high
    issue: 5:12 더클라를 가리키는 대명사가 남성형으로 번역됨
    rationale: ‘그는 마음속으로’, ‘그가 바라보는 동안’은 문맥상 더클라를 지시하지만 남성 인칭으로 읽혀 지시 대상과 성별을 잘못 전달합니다.
  - severity: medium
    issue: 5:13 ‘stake’의 장소·도구 표현이 부정확함
    rationale: ‘장작더미 앞으로’는 화형 기둥에 끌려온다는 증언을 일반적인 장작더미 앞 장면으로 바꿉니다. ‘화형 기둥으로’가 더 직접적입니다.
  revised_text: '## 제5장[a]


    **5:1** 마침내 더클라가 보이지 않자, 가족들과 타미리스는 더클라가 길을 잃기라도 한 듯 거리마다 찾아다녔습니다. 그런데 문지기의 동료 종 하나가 더클라가 밤중에 나갔다고 그들에게 말했습니다.


    **5:2** 그러자 그들은 문지기를 추궁했고, 문지기는 더클라가 그 낯선 사람을 만나러 감옥에 갔다고 말했습니다.


    **5:3** 그들은 문지기가 알려 준 대로 가서 그곳에서 더클라를 찾았습니다. 그들은 밖으로 나온 뒤 무리를 모아 총독에게 가서 일어난 일을 모두 알렸습니다.


    **5:4** 그러자 총독은 바울을 자기 재판석 앞으로 데려오라고 명령했습니다.


    **5:5** 그동안 더클라는 감옥 바닥에서, 바울이 앉아 자기를 가르치던 바로 그 자리에서 뒹굴고 있었습니다. 총독은 더클라도 자기 재판석 앞으로 데려오라고 명령했습니다. 더클라는 그 소환을 기쁘게 받아들이고 갔습니다.


    **5:6** 바울이 끌려오자 무리는 더욱 사납게 외쳤습니다. “이자는 마술사다! 죽여라!”


    **5:7** 그러나 총독은 그리스도의 거룩한 일들에 관한 바울의 말을 기꺼이 귀담아들었습니다. 총독은 회의를 소집한 뒤 더클라를 불러 말했습니다. “너는 어찌하여 이고니온 사람들의 법에 따라 타미리스와 혼인하지 않느냐?”


    **5:8** 더클라는 바울에게 시선을 고정한 채 아무 말 없이 서 있었습니다. 더클라가 대답하지 않자, 그의 어머니 테오클리아가 소리쳤습니다. “저 불의한 것을 불태우십시오! 타미리스를 거부한 저것을 극장 한가운데서 불태워, 모든 여자가 이것을 보고 그런 짓을 피하도록 하십시오!”


    **5:9** 총독은 몹시 괴로워하면서, 바울은 채찍질하여 성 밖으로 내쫓고 더클라는 불태우라고 명령했습니다.


    **5:10** 총독은 자리에서 일어나 곧바로 극장으로 갔고, 온 백성도 그 참혹한 광경을 보려고 밖으로 몰려갔습니다.


    **5:11** 그러나 광야의 어린양이 자기 목자를 찾으려고 사방을 둘러보듯, 더클라는 바울을 찾아 주위를 둘러보았습니다.


    **5:12** 더클라는 군중을 바라보다가 바울의 모습을 한 주 예수를 보았습니다. 더클라는 마음속으로 말했습니다. “내가 고난당하는 것을 보려고 바울이 왔구나.” 더클라는 그분에게 시선을 고정했지만, 더클라가 바라보는 동안 그분은 곧 하늘로 올라가셨습니다.


    **5:13** 젊은 남녀들이 더클라를 불태울 장작과 짚을 가져왔습니다. 더클라가 벌거벗은 채 화형 기둥으로 끌려오자, 총독은 그의 빼어난 아름다움을 보고 놀라 눈물을 흘렸습니다.


    **5:14** 사람들이 장작을 다 쌓은 뒤 더클라에게 그 위로 올라가라고 명령했습니다. 더클라는 먼저 십자가 표를 한 다음 그 위로 올라갔습니다.


    **5:15** 사람들이 장작더미에 불을 붙였습니다. 불길이 몹시 거셌지만 더클라에게 닿지 않았습니다. 하나님께서 그를 불쌍히 여기셔서, 아래에서는 땅이 크게 갈라지게 하시고 위에서는 구름이 많은 비와 우박을 쏟아붓게 하셨기 때문입니다.


    **5:16** 땅이 갈라지는 바람에 아주 많은 사람이 큰 위험에 빠졌고, 일부는 죽었습니다. 불은 꺼졌고 더클라는 목숨을 건졌습니다.'
