    **9:23** 그들의 목소리가 어찌나 컸던지 온 도시가 흔들리는 듯했습니다. 트리피나 자신도 이 기쁜 소식을 듣고 다시 일어나[c] 무리와 함께 데클라를 맞으러 달려갔습니다. 그는 데클라를 끌어안고 말했습니다. “이제 나는 죽은 이들의 부활이 있으리라는 것을 믿습니다. 이제 내 딸이 살아 있다는 것을 확신합니다. 그러니 내 딸 데클라여, 나와 함께 집으로 갑시다. 내가 가진 모든 것을 그대에게 넘겨주겠습니다.”


    **9:24** 그리하여 데클라는 트리피나와 함께 가서 그곳에 며칠 머물며 그에게 주님의 말씀을 가르쳤습니다. 그로 말미암아 많은 젊은 여자가 믿게 되었고, 트리피나의 집안에는 큰 기쁨이 넘쳤습니다.


