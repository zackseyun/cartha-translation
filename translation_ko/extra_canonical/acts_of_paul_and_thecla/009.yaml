  revised_text: '## 제9장


    **9:1** 그때 데클라는 트리피나에게서 데려 나와, 옷이 벗겨지고 허리띠가 채워진 채 맹수들과 싸우도록 정해진 곳에 던져졌습니다. 그러자 사자들과 곰들이 데클라를 향해 풀려났습니다.


    **9:2** 그런데 그중에서도 가장 사나운 암사자 한 마리가 데클라에게 달려와 데클라의 발 앞에 엎드렸습니다. 이를 본 여자 무리가 큰 소리로 외쳤습니다.


    **9:3** 이어서 암곰 한 마리가 사납게 데클라를 향해 달려들었으나, 암사자가 곰을 맞아 산산이 찢어 죽였습니다.


    **9:4** 또 사람을 잡아먹는 데 익숙한 알렉산드로의 수사자 한 마리가 데클라에게 달려들었습니다. 그러나 암사자가 그 수사자와 맞붙었고, 둘은 서로를 죽였습니다.


    **9:5** 데클라를 도왔던 암사자가 죽자 여자들은 더욱 근심했습니다.


    **9:6** 그 뒤에 그들은 다른 맹수들을 많이 끌어냈습니다. 그러나 데클라는 두 손을 하늘로 뻗고 서서 기도했습니다. 기도를 마친 뒤 몸을 돌려 물이 고인 웅덩이를 보고 말했습니다. “지금이 내가 세례를 받을 알맞은 때입니다.”


    **9:7** 그러고는 물속으로 몸을 던지며 말했습니다. “오, 나의 주 예수 그리스도시여, 주님의 이름으로 제가 이 마지막 날에 세례를 받습니다.” 여자들과 백성이 이를 보고 “물속으로 몸을 던지지 마시오!” 하고 외쳤습니다. 총독 자신도 물고기들(바다송아지들)[a]이 그토록 아름다운 여인을 삼킬 것이라고 생각하여 소리쳤습니다.


    **9:8** 이 모든 외침에도 데클라는 우리 주 예수 그리스도의 이름으로 물속에 몸을 던졌습니다.


