base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/007.yaml
  text: '7:1 Then Paul sent Onesiphorus and his family back to their own home. Taking Thecla with him, he went to Antioch.


    7:2 As soon as they entered the city, a Syrian named Alexander, a city magistrate who had performed many significant services for the city during his term, saw Thecla and fell in love with her. He tried to win Paul over with many costly gifts.


    7:3 But Paul told him, “I do not know the woman you are speaking about, nor does she belong to me.”


    7:4 But Alexander, being a person of great power in Antioch, seized her in the street and kissed her. Thecla would not tolerate this. Looking around for Paul, she cried out loudly in distress, “Do not force me, a stranger! Do not force me, a servant of God! I am one of the prominent people of Iconium, and I was forced to leave that city because I refused to marry Thamyris.”


    7:5 Then she seized Alexander, tore his coat, took the crown from his head, and made him look ridiculous in front of all the people.


    7:6 But Alexander, partly because he loved her and partly because he was ashamed of what had happened, brought her before the governor. When she admitted what she had done, the governor condemned her to be thrown to the beasts.'
translation:
  language: ko
  text: '7:1 그 뒤 바울은 오네시보로와 그의 가족을 그들의 집으로 돌려보냈습니다. 그리고 테클라를 데리고 안티오키아로 갔습니다.


    7:2 그들이 도시에 들어서자, 알렉산드로라는 시리아 사람이 테클라를 보고 사랑에 빠졌습니다. 그는 그 도시의 행정관으로, 재임 중에 도시를 위해 여러 가지 큰 공을 세운 사람이었습니다. 그는 값비싼 선물을 많이 주어 바울의 마음을 얻으려 했습니다.


    7:3 그러나 바울은 그에게 말했습니다. “나는 당신이 말하는 그 여자를 알지 못하며, 그 여자는 내게 속한 사람도 아닙니다.”


    7:4 알렉산드로는 안티오키아에서 큰 권세를 가진 사람이었으므로, 길거리에서 테클라를 붙잡아 입을 맞추었습니다. 테클라는 이를 참지 않았습니다. 테클라는 바울을 찾아 주위를 둘러보며 괴로운 목소리로 크게 외쳤습니다. “낯선 나를 강제로 대하지 마십시오! 하나님의 종인 나를 강제로 대하지 마십시오! 나는 이고니온의 주요 인물 가운데 한 사람이며, 타미리스와 결혼하려 하지 않았기 때문에 그 도시를 떠날 수밖에 없었습니다.”[a]


    7:5 그러고 나서 테클라는 알렉산드로를 붙잡아 그의 옷을 찢고, 그의 머리에서 관을 벗기고, 모든 사람 앞에서 그를 웃음거리로 만들었습니다.[b]


    7:6 알렉산드로는 한편으로는 테클라를 사랑했고 다른 한편으로는 일어난 일로 부끄러움을 느꼈기 때문에, 테클라를 총독에게 데리고 갔습니다. 테클라가 자신이 한 일을 인정하자, 총독은 테클라를 맹수들에게 던지라는 판결을 내렸습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘강제로 대하지 마십시오’는 원문의 강압을 뜻하는 표현을 옮긴 것입니다. 제공된 영어 증언만으로는 그 강압의 구체적 범위를 확정하기 어렵습니다. ‘이고니온의 주요 인물 가운데 한 사람’은 사회적으로 두드러진 인물이라는 뜻입니다.
    reason: 성적 행위를 본문에서 단정하지 않고 강압이라는 핵심 의미를 보존하며, ‘principal persons’를 가문이 아니라 개인의 지위로 옮긴 이유를 밝힙니다.
  - marker: b
    text: 여기서 ‘관’은 그 모양이나 정확한 성격이 밝혀지지 않은 머리 장식 또는 지위의 표지입니다.
    reason: ‘왕관’이나 특정 관직의 관모로 과도하게 구체화하지 않기 위해 설명합니다.
lexical_decisions:
- source_word: magistrate
  choice: 행정관
  rationale: 도시의 공직자라는 뜻을 자연스럽게 전달하되, 원자료에 대한 그리스어 검토가 끝나지 않은 상태에서 특정 관직명으로 좁히지 않았습니다.
- source_word: does she belong to me
  choice: 그 여자는 내 사람도 아닙니다
  rationale: 소유·보호·관계의 범위가 모호한 표현을 특정 관계로 단정하지 않고 한국어에서 가능한 모호성을 보존했습니다.
- source_word: Force me not
  choice: 나를 억지로 범하지 마십시오
  rationale: 문맥상 성적 강압을 가리키므로 단순히 ‘강요하지 마십시오’보다 위협의 성격을 분명히 하되, 행위의 구체적 정도는 확정하지 않았습니다.
- source_word: principal persons
  choice: 유력한 집안 사람
  rationale: ‘주요 인물들 가운데 하나’ 또는 ‘명문가 출신’일 수 있는 표현을 사회적 지위가 드러나는 자연스러운 한국어로 옮겼습니다.
- source_word: crown
  choice: 관
  rationale: 형태나 직무상 성격을 특정할 근거가 부족하므로 ‘왕관’이나 특정 관직의 관모로 좁히지 않았습니다.
- source_word: beasts
  choice: 맹수들
  rationale: 공개 처형에 쓰이는 야수라는 문맥을 한국어 독자가 바로 이해하도록 옮겼습니다.
theological_decisions:
- issue: ‘하나님의 종’의 성별 표현
  choice: 하나님의 종
  alternative: 하나님의 여종
  rationale: 신분과 헌신을 나타내는 표현을 성별화하지 않아 원문의 일반적 종 개념과 한국어의 익숙한 신앙 용례를 함께 보존했습니다.
- issue: 바울의 관계 부인
  choice: 알지 못하며, 내 사람도 아니다
  alternative: 그 여자는 내 소유가 아니다
  rationale: 바울의 말이 실제로 모른다는 뜻인지, 자신의 권한 아래 있지 않다는 법적·사회적 부인인지 생기는 긴장을 해소하지 않고 남겼습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 간결하고 품위 있게 유지하고, 폭력과 성적 강압은 완곡하게 지워 버리지 않되 선정적으로 확대하지 않았습니다. 이 초안은 제공된 공용 영어 증언을 바탕으로 하며 그리스어 및 역본 전승에 대한 직접 대조가 남아 있으므로, 관직명과 몇몇 사회적 표현은 의도적으로 넓게 번역했습니다.
