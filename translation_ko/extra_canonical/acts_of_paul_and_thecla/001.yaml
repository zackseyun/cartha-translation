  text: '1:1 When Paul went up to Iconium after fleeing from Antioch, Demas and Hermogenes became his companions, though at that time they were full of hypocrisy.


    1:2 But Paul, looking only to the goodness of God, did them no harm and loved them greatly.


    1:3 So he tried to make all the oracles and teachings of Christ, and the purpose of the gospel of God’s dearly loved Son, pleasing to them, instructing them in the knowledge of Christ as it had been revealed to him.


    1:4 A certain man named Onesiphorus heard that Paul had come to Iconium and quickly went out to meet him, together with his wife Lectra and his sons Simmia and Xeno, to invite him into their house.


    1:5 For Titus had given them a description of Paul’s appearance. They did not yet know him in person, but knew only his character.


    1:6 They went along the king’s highway toward Lystra and stood there waiting for him, comparing everyone who passed by with the description Titus had given them.


    1:7 At last they saw a man coming—namely, Paul—who was short, bald (or shaved) on the head, with crooked thighs, handsome legs, hollow eyes, and a crooked nose. He was full of grace, for sometimes he appeared as a man, and sometimes he had the face of an angel. Paul saw Onesiphorus and was glad.


    1:8 Onesiphorus said, “Greetings, servant of the blessed God.” Paul replied, “May the grace of God be with you and your family.”


    1:9 But Demas and Hermogenes were moved with envy, and, making a show of great religion, Demas said, “Are we not also servants of the blessed God? Why did you not greet us?”


    1:10 Onesiphorus replied, “Because I have not seen the fruits of righteousness in you. Nevertheless, if you are of that kind, you will also be welcome in my house.”


    1:11 Then Paul entered the house of Onesiphorus, and there was great joy among the family because of this. They devoted themselves to prayer, the breaking of bread, and listening to Paul preach the word of God concerning self-control and the resurrection, as follows:


    1:12 “Blessed are the pure in heart, for they shall see God.


    1:13 “Blessed are those who keep their flesh undefiled (or pure), for they shall be the temple of God.


    1:14 “Blessed are the self-controlled (or chaste), for God will reveal himself to them.


    1:15 “Blessed are those who abandon their worldly pleasures, for they shall be accepted by God.


    1:16 “Blessed are those who have wives as though they did not have them, for they shall be made angels of God.


    1:17 “Blessed are those who tremble at the word of God, for they shall be comforted.


    1:18 “Blessed are those who keep their baptism pure, for they shall find peace with the Father, Son, and Holy Spirit.


    1:19 “Blessed are those who pursue the wisdom (or teaching) of Jesus Christ, for they shall be called sons of the Most High.


    1:20 “Blessed are those who observe the instructions of Jesus Christ, for they shall dwell in eternal light.


    1:21 “Blessed are those who, for the love of Christ, abandon the glories of the world, for they shall judge angels, be placed at the right hand of Christ, and not suffer the bitterness of the last judgment.


    1:22 “Blessed are the bodies and souls of virgins, for they are acceptable to God and shall not lose the reward of their virginity. For the word of their (heavenly) Father shall prove effective for their salvation on the day of his Son, and they shall enjoy rest forevermore.”'
translation:
  language: ko
  text: '바울과 테클라 행전 — 제1장


    1:1 바울이 안티오키아에서 피신한 뒤 이고니온으로 올라갈 때, 데마와 헤르모게네스가 그의 길동무가 되었습니다. 그때 그들은 위선으로 가득 차 있었습니다.


    1:2 그러나 바울은 오직 하나님의 선하심만 바라보며 그들을 해치지 않고 매우 사랑했습니다.


    1:3 그래서 그는 자신에게 계시된 대로 그리스도를 아는 지식을 그들에게 가르치면서, 그리스도의 모든 말씀과 가르침과 하나님께서 지극히 사랑하시는 아들의 복음이 지닌 뜻을 그들이 기쁘게 받아들이도록 애썼습니다.


    1:4 오네시보로라는 사람이 바울이 이고니온에 왔다는 말을 듣고, 그를 자기 집으로 맞아들이려고 아내 렉트라와 두 아들 심미아와 제노를 데리고 서둘러 마중 나갔습니다.


    1:5 디도가 그들에게 바울의 생김새를 알려 주었기 때문입니다. 그들은 아직 바울의 얼굴은 알지 못하고 그의 사람됨만 알고 있었습니다.


    1:6 그들은 리스트라로 향하는 왕의 큰길로 나가 그곳에 서서 바울을 기다렸습니다. 그리고 지나가는 사람마다 디도가 알려 준 생김새와 견주어 보았습니다.


    1:7 마침내 그들은 한 사람이 다가오는 것을 보았는데, 그가 바로 바울이었습니다. 그는 키가 작고 머리가 벗겨졌거나 깎여 있었으며,[a] 넓적다리는 휘었으나 다리는 보기 좋았고, 눈은 움푹 들어갔으며 코는 굽어 있었습니다. 그는 은혜로 가득했습니다. 때로는 사람처럼 보였고 때로는 천사의 얼굴을 한 것처럼 보였습니다. 바울은 오네시보로를 보고 기뻐했습니다.


    1:8 오네시보로가 말했습니다. “복되신 하나님의 종이여, 평안하십시오.” 바울이 대답했습니다. “하나님의 은혜가 그대와 그대의 집안에 함께하기를 바랍니다.”


    1:9 그러나 데마와 헤르모게네스는 시기심에 사로잡혔습니다. 데마는 매우 경건한 체하며 말했습니다. “우리도 복되신 하나님의 종들이 아닙니까? 그런데 왜 우리에게는 인사하지 않았습니까?”


    1:10 오네시보로가 대답했습니다. “당신들에게서는 의의 열매를 보지 못했기 때문입니다. 하지만 당신들도 그러한 사람들이라면 내 집에서 환영받을 것입니다.”


    1:11 그 뒤 바울은 오네시보로의 집으로 들어갔고, 그 일로 온 집안에 큰 기쁨이 넘쳤습니다. 그들은 기도하고 빵을 떼며, 절제와 부활에 관하여 바울이 전하는 하나님의 말씀을 들었습니다. 바울은 이렇게 말했습니다.


    1:12 “마음이 깨끗한 사람들은 복이 있습니다. 그들이 하나님을 볼 것이기 때문입니다.


    1:13 “자기 몸을 더럽히지 않고 순결하게 지키는 사람들은 복이 있습니다.[b] 그들이 하나님의 성전이 될 것이기 때문입니다.


    1:14 “절제하며 정결을 지키는 사람들은 복이 있습니다.[c] 하나님께서 그들에게 자신을 나타내실 것이기 때문입니다.


    1:15 “세상의 쾌락을 버리는 사람들은 복이 있습니다. 하나님께서 그들을 받아 주실 것이기 때문입니다.


    1:16 “아내가 있어도 없는 사람처럼 사는 이들은 복이 있습니다.[d] 그들이 하나님의 천사들이 될 것이기 때문입니다.


    1:17 “하나님의 말씀 앞에서 떠는 사람들은 복이 있습니다. 그들이 위로받을 것이기 때문입니다.


    1:18 “자신의 세례를 순결하게 지키는 사람들은 복이 있습니다.[e] 그들이 성부와 성자와 성령과 더불어 평화를 누릴 것이기 때문입니다.


    1:19 “예수 그리스도의 지혜, 곧 가르침을 추구하는 사람들은 복이 있습니다.[f] 그들이 지극히 높으신 분의 아들들이라 불릴 것이기 때문입니다.


    1:20 “예수 그리스도의 가르침을 지키는 사람들은 복이 있습니다. 그들이 영원한 빛 가운데 살 것이기 때문입니다.


    1:21 “그리스도를 사랑하기 때문에 세상의 영광을 버리는 사람들은 복이 있습니다. 그들이 천사들을 심판하고 그리스도의 오른편에 서게 되며, 마지막 심판의 쓰라림을 겪지 않을 것이기 때문입니다.


    1:22 “처녀들의 몸과 영혼은 복이 있습니다. 그들은 하나님께서 기쁘게 받아 주시는 이들이며, 처녀로 지킨 삶의 상을 잃지 않을 것이기 때문입니다. 하늘 아버지의 말씀은 그 아들의 날에 그들을 구원하는 데 효력을 나타낼 것이며,[g] 그들은 영원히 안식을 누릴 것입니다.”


    [a] 전승의 표현은 ‘대머리인’ 또는 ‘머리를 민’ 것으로 이해될 수 있습니다.

    [b] ‘몸’은 직역하면 ‘육체’이며, ‘더럽히지 않고’는 ‘순결하게’로 옮길 수도 있습니다.

    [c] 이 말은 ‘절제하는’ 또는 문맥상 ‘정결을 지키는’이라는 뜻일 수 있습니다.

    [d] 혼인 관계 자체를 부정한다기보다, 아내가 있어도 없는 사람처럼 사는 태도를 말하는 표현입니다. 그 구체적 뜻은 본문에서 더 설명되지 않습니다.

    [e] ‘세례를 순결하게 지킨다’는 독특한 표현으로, 세례 이후의 순결한 삶 또는 세례의 온전함을 가리킬 수 있습니다.

    [f] 여기서 ‘지혜’로 옮긴 말은 ‘가르침’으로 이해할 수도 있습니다.

    [g] ‘그들의 아버지’로 읽을 수도 있으나, 문맥상 하늘 아버지를 가리키는 것으로 이해했습니다. ‘효력을 나타낼 것’이라는 표현의 구체적인 방식은 본문에 명시되어 있지 않습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승의 표현은 ‘대머리인’ 또는 ‘머리를 민’ 것으로 이해될 수 있습니다.
    reason: 외모 묘사의 어휘적 양자택일을 보존합니다.
  - marker: b
    text: ‘몸’은 직역하면 ‘육체’이며, ‘더럽히지 않고’는 ‘순결하게’로 옮길 수도 있습니다.
    reason: flesh와 undefiled/pure의 번역 가능성을 밝힙니다.
  - marker: c
    text: 이 말은 ‘절제하는’ 또는 문맥상 ‘정결을 지키는’이라는 뜻일 수 있습니다.
    reason: temperate/chaste의 의미 범위를 보존합니다.
  - marker: d
    text: 혼인 관계 자체를 부정한다기보다, 아내가 있어도 없는 사람처럼 사는 태도를 말하는 표현입니다. 그 구체적 뜻은 본문에서 더 설명되지 않습니다.
    reason: 모호한 금욕적 표현을 특정 교리로 확정하지 않도록 합니다.
  - marker: e
    text: ‘세례를 순결하게 지킨다’는 독특한 표현으로, 세례 이후의 순결한 삶 또는 세례의 온전함을 가리킬 수 있습니다.
    reason: 세례 관련 표현의 해석적 불확실성을 알립니다.
  - marker: f
    text: 여기서 ‘지혜’로 옮긴 말은 ‘가르침’으로 이해할 수도 있습니다.
    reason: wisdom/doctrine의 대안을 보존합니다.
  - marker: g
    text: ‘그들의 아버지’로 읽을 수도 있으나, 문맥상 하늘 아버지를 가리키는 것으로 이해했습니다. ‘효력을 나타낼 것’이라는 표현의 구체적인 방식은 본문에 명시되어 있지 않습니다.
    reason: 대명사의 지시 대상과 구원 효력 표현의 모호성을 밝힙니다.
lexical_decisions:
- source_word: oracles
  choice: 말씀
  rationale: ‘신탁’은 현대 독자에게 이교적 뉘앙스를 줄 수 있어, 그리스도에게서 나온 권위 있는 말이라는 문맥을 살려 ‘말씀’으로 옮겼습니다.
- source_word: temperance / self-control
  choice: 절제
  rationale: 성적 정결에 한정하지 않고 자제와 금욕을 함께 포괄하는 표현을 선택하되, 1:14에서는 가능한 ‘정결’의 의미를 각주로 보존했습니다.
- source_word: flesh
  choice: 몸
  rationale: 현대 한국어에서 자연스럽고 해당 문맥의 신체적 순결을 분명히 드러냅니다. 직역 ‘육체’는 각주에 밝혔습니다.
- source_word: king’s highway
  choice: 왕의 큰길
  rationale: 왕실 또는 공적 대로라는 고대적 표현을 보존하면서 한국어로 이해 가능하게 했습니다.
- source_word: wisdom (or doctrine)
  choice: 지혜, 곧 가르침
  rationale: 제시된 증거가 보존하는 두 의미를 본문에 함께 드러내어 하나로 단정하지 않았습니다.
- source_word: virgins
  choice: 처녀들
  rationale: 본문의 금욕적 문맥과 여성 복수 명사의 의미를 직접 보존했습니다.
theological_decisions:
- issue: 혼인한 사람이 ‘아내가 없는 것처럼’ 사는 복 선언
