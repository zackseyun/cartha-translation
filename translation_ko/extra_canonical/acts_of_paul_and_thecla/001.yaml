  rationale: 제시된 영어 증언만으로 어느 해석인지 확정할 수 없어 각주에 가능성을 제시했습니다.
- issue: 1:22 아버지의 말씀과 구원의 관계
  choice: 말씀이 구원에 효력을 나타낸다고 번역함
  alternative: 아버지의 말씀이 곧 그들을 구원한다고 번역함
  rationale: 도구성 또는 효력의 표현을 살리되 구원의 체계를 추가로 규정하지 않았습니다.
- issue: 성부·성자·성령과의 평화
