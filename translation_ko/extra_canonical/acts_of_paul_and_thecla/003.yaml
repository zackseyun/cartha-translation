lexical_decisions:
- source_word: refresh yourselves
  choice: 쉬며 기운을 차리십시오
  rationale: 식사와 환대를 통해 원기를 회복한다는 뜻을 현대 한국어로 자연스럽게 나타냈습니다.
- source_word: very splendid entertainment
  choice: 매우 성대한 잔치
  rationale: ‘entertainment’를 단순한 오락이 아니라 풍성한 음식과 포도주가 마련된 연회로 이해했습니다.
- source_word: doctrines
  choice: 무엇을 가르치는지
  rationale: ‘교리’보다 대화 문맥에 자연스럽고 일반 독자가 쉽게 이해할 수 있는 표현을 선택했습니다.
- source_word: governor
  choice: 총독
  rationale: 로마 행정관을 가리키는 증언 본문의 용어를 익숙한 역사적 직함으로 옮겼습니다.
- source_word: Caesar
  choice: 황제
  rationale: 개인 이름보다 로마 통치자의 칭호를 뜻하는 문맥이므로 기능적으로 분명한 표현을 사용했습니다.
- source_word: perverted / led astray
  choice: 그릇된 길로 이끌었고 / 미혹하여
  rationale: 도시 전체에 대한 고발과 테클라 개인에 대한 고발을 자연스럽게 구분하면서 원문의 비난조를 보존했습니다.
- source_word: imposter (magician)
  choice: 사기꾼[a]
  rationale: 본문에는 영어 증언의 주된 표현을 두고, 괄호 안 대안인 ‘마술사’를 각주에 보존했습니다.
theological_decisions:
- issue: 부활이 이미 이루어졌고 자녀 출산에 있다는 주장
  choice: 그 주장을 화자들의 말로서 그대로 보존
  alternative: 후대 정통 교리에 맞추어 의미를 수정하거나 설명을 본문에 삽입
  rationale: 이 대목은 데마와 헤르모게네스의 독특한 주장으로 제시되므로, 그 신학적 긴장과 이질성을 해소하지 않았습니다.
- issue: ‘하나님을 알게 되었을 때 다시 살아났다’는 표현
  choice: 시간 관계와 부활 언어를 직역에 가깝게 유지
  alternative: 영적 회심 또는 중생으로 명시하여 해석
  rationale: 증언 본문이 회심, 영적 부활, 인식의 변화를 명확히 구분하지 않으므로 특정 교리 용어로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 ‘-했습니다’로 통일하고, 대화에서는 관계와 상황에 따라 공손한 청유·요청과 적대적인 하대를 구분했습니다. 인명과 지명은 영어 증언을 바탕으로 데마, 헤르모게네스, 카스틸리우스, 오네시보로, 이고니온으로 음역했습니다. 직접적인 그리스어 원문 검토가 아직 이루어지지 않았으므로, 이 초안은 제공된 공용 영어 증언에 근거한 잠정 번역입니다.
