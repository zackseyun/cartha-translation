  revised_text: '바울과 테클라 행전 제2장


    2:1 바울이 오네시보로의 집에 있는 교회에서 이 설교를 전하고 있을 때, 테클라라는 한 처녀가 자기 집의 어느 창가에 앉아 있었습니다. 테클라의 어머니 이름은 테오클리아였고, 테클라는 타미리스라는 남자와 약혼한 사이였습니다.


    2:2 테클라는 그곳에서, 바울이 있는 집의 창문을 통하여 밤낮으로 바울의 설교를 들었습니다. 그 설교는 하나님과 사랑과 그리스도를 믿는 믿음과 기도에 관한 것이었습니다.


    2:3 테클라는 넘치는 기쁨으로 믿음의 가르침에 사로잡힐 때까지 창가를 떠나려 하지 않았습니다.[a]


    2:4 마침내 많은 여자들과 처녀들이 바울에게 들어가는 것을 보고, 테클라도 바울 앞에 나아가 그리스도의 말씀을 들을 자격이 있는 사람으로 여겨지기를 간절히 바랐습니다. 테클라는 아직 바울의 모습을 본 적이 없고, 오직 그의 설교만 들었을 뿐이었습니다.


    2:5 테클라가 아무리 타일러도 창가에서 떠나려 하지 않자, 테클라의 어머니는 타미리스를 불렀습니다. 타미리스는 이제 테클라와 결혼할 수 있으리라 기대하며 매우 기뻐서 왔습니다. 그가 테오클리아에게 물었습니다. “나의 테클라는 어디에 있습니까?”


    2:6 테오클리아가 대답했습니다. “타미리스, 내가 아주 이상한 일을 말씀드리겠습니다. 테클라는 사흘 동안 창가에서 꼼짝하지 않고, 먹지도 마시지도 않은 채 어떤 낯선 사람의 교묘하고 미혹하는 말에 온통 정신을 빼앗겨 있습니다. 평소 그토록 얌전하던 젊은 여자가 그 사람에게 이렇게까지 휘둘리다니, 타미리스, 나는 참으로 놀랍습니다.


    2:7 그 사람은 온 이고니온 성을 뒤흔들었고, 다른 이들과 마찬가지로 당신의 테클라마저 뒤흔들어 놓았습니다. 모든 여자들과 젊은 남자들이 그의 가르침을 받으려고 그에게 몰려갑니다. 그는 다른 모든 말에 더하여, 하나님은 오직 한 분이시며 그분만을 경배해야 하고 우리는 정결을 지키며 살아야 한다고 말합니다.[b]


    2:8 그런데도 내 딸 테클라는 창문에 붙은 거미줄처럼 그곳에 붙들린 채 바울의 말에 사로잡혀, 놀라울 만큼 열렬하고 큰 기쁨으로 그 말에 귀를 기울이고 있습니다. 그가 하는 말을 계속 들음으로써 이 젊은 여자가 미혹된 것입니다. 이제 당신이 가서 그 아이에게 말해 보십시오. 테클라는 당신과 약혼한 사이이니까요.”


    2:9 타미리스는 테클라에게 가서 인사하고, 테클라를 놀라게 하지 않으려고 조심스럽게 말했습니다. “테클라, 내 약혼녀여, 왜 그렇게 슬픈 모습으로 앉아 있습니까? 무슨 이상한 생각에 사로잡힌 것입니까? 나 타미리스를 돌아보고 부끄러워하십시오.”[c]


    2:10 테클라의 어머니도 같은 식으로 말했습니다. “얘야, 왜 그렇게 슬프게 앉아서 넋이 나간 사람처럼 아무 대답도 하지 않습니까?”


    2:11 그러자 그들은 몹시 울었습니다. 타미리스는 약혼녀를 잃었다며 울었고, 테오클리아는 딸을 잃었다며 울었으며, 여종들은 주인을 잃었다며 울었습니다. 그리하여 온 집안이 슬픔에 잠겼습니다.


    2:12 그러나 이 모든 일도 테클라의 마음을 움직이지 못했습니다. 테클라는 그들을 돌아보거나 눈길조차 주지 않고, 여전히 바울의 말에 귀를 기울였습니다.


    2:13 그때 타미리스는 거리로 달려 나가 바울에게 들어가고 그에게서 나오는 사람들이 누구인지 살펴보았습니다. 그러다가 격렬하게 논쟁하고 있는 두 남자를 보고 그들에게 물었습니다.


    2:14 “여러분, 여기서 무엇을 하고 있습니까? 안에 있는 여러분의 그 사람은 누구입니까? 그는 젊은 남자들과 처녀들의 마음을 미혹하여, 결혼하지 말고 지금 그대로 지내야 한다고 설득하고 있습니다.


    2:15 그가 누구인지 사실대로 알려 주면 상당한 돈을 드리겠습니다. 나는 이 성에서 높은 지위에 있는 사람입니다.”[d]


    2:16 데마와 헤르모게네스가 대답했습니다. “그가 정확히 누구인지는 우리도 말할 수 없습니다. 그러나 이것은 압니다. 그는 젊은 남자들에게서 그들의 (장차 맞이할) 아내를 빼앗고, 처녀들에게서 그들의 (장차 맞이할) 남편을 빼앗습니다. ‘여러분이 정결을 지키고 자기 육체를 더럽히지 않는 경우에만 장차 부활할 수 있다’고 가르치기 때문입니다.”[e]'
