  text: '4:1 Then Thamyris stood before the governor’s judgment seat and spoke loudly as follows:


    4:2 “Governor, I do not know where this man comes from, but he teaches that marriage is unlawful. Therefore, command him to explain before you why he proclaims such doctrines.”


    4:3 While he was speaking, Demas and Hermogenes (whispered to Thamyris, and) said, “Say that he is a Christian, and he will immediately be put to death.”


    4:4 But the governor was more deliberate. He called Paul and said, “Who are you? What do you teach? They seem to accuse you of serious crimes.”


    4:5 Then Paul spoke loudly, saying, “Since I am now called to give an account of my teachings, Governor, I ask you to hear me.


    4:6 “God, who is a God of vengeance and needs nothing except the salvation of his creatures, has sent me to turn them away from their wickedness and corruption, from all (sinful) pleasures, and from death, and to persuade them to sin no more.


    4:7 “For this reason, God sent his Son Jesus Christ, whom I proclaim and in whom I teach people to place their hope. He alone had such compassion on the deluded world that it might not be condemned, Governor, but might have faith, the fear of God, the knowledge of religion, and the love of truth.


    4:8 “So if I teach only those things that I received by revelation from God, what is my crime?”


    4:9 When the governor heard this, he ordered Paul to be bound and put in prison until he had more time to hear him fully.


    4:10 But during the night, Thecla took off her earrings and gave them to the prison guard, who opened the doors for her and let her in.


    4:11 After she gave a silver mirror to the jailer, she was allowed to enter the room where Paul was. Then she sat at his feet and heard from him the great things of God.


    4:12 When she saw that Paul was not afraid to suffer but, with divine assistance, conducted himself courageously, her faith increased so greatly that she kissed his chains.'
translation:
  language: ko
  text: '4:1 그때 다미리스가 총독의 재판석 앞에 서서 큰 소리로 이렇게 말했습니다.


    4:2 “총독님, 저는 이 사람이 어디서 왔는지 모릅니다. 그러나 그는 혼인이 허용되지 않는다고 가르치는 자입니다. 그러므로 그가 무슨 까닭으로 이런 가르침을 퍼뜨리는지 총독님 앞에서 밝히도록 명령해 주십시오.”


    4:3 그가 이렇게 말하고 있을 때, 데마와 헤르모게네스가 (다미리스에게 속삭이며) 말했습니다. “그가 그리스도인이라고 말하십시오. 그러면 곧 사형에 처해질 것입니다.”[a]


    4:4 그러나 총독은 좀 더 신중했습니다. 그는 바울을 불러 말했습니다. “너는 누구냐? 무엇을 가르치느냐? 이들이 너를 중대한 죄로 고발하는 듯하구나.”


    4:5 그러자 바울이 큰 소리로 말했습니다. “총독님, 이제 제 가르침에 관하여 해명하도록 부름받았으니, 제 말을 들어 주시기 바랍니다.


    4:6 보복하시는 하나님, 곧 아무것도 필요로 하지 않으시면서도 자신의 피조물들이 구원받기를 바라시는 하나님께서 저를 보내셨습니다.[b] 이는 그들을 악과 타락과 온갖 죄악 된 쾌락과 죽음에서 돌이키고, 더는 죄를 짓지 않도록 권하기 위함입니다.


    4:7 이 때문에 하나님께서는 자신의 아들 예수 그리스도를 보내셨습니다. 저는 그분을 선포하며 사람들이 그분께 소망을 두도록 가르칩니다. 오직 그분만이 미혹된 세상을 이토록 불쌍히 여기셨으니, 총독님, 이는 세상이 정죄받지 않고 믿음과 하나님을 경외함과 경건에 관한 지식과 진리에 대한 사랑을 갖게 하시려는 것입니다.[c]


    4:8 그러므로 제가 하나님께 계시로 받은 것만을 가르친다면, 제 죄가 무엇입니까?”


    4:9 총독은 이 말을 듣고, 자신이 더 한가해져 바울의 말을 충분히 들을 때까지 그를 결박하여 감옥에 가두라고 명령했습니다.


    4:10 그러나 밤이 되자 테클라는 귀고리를 빼서 감옥 문지기에게 주었습니다. 그러자 문지기가 문들을 열어 그를 안으로 들여보냈습니다.


    4:11 테클라는 간수에게 은거울도 선물하고 바울이 있는 방으로 들어가도록 허락받았습니다. 그는 바울의 발치에 앉아 그에게서 하나님의 위대한 일들을 들었습니다.


    4:12 테클라는 바울이 고난을 두려워하지 않고 하나님의 도움으로 담대하게 처신하는 것을 보았습니다. 그러자 그의 믿음이 크게 자라서 그는 바울의 쇠사슬에 입을 맞추었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 괄호 안의 말은 제공된 영어 증언의 괄호 표기를 그대로 반영한 것입니다. 문장 전승이나 편집상의 불확실성을 나타낼 수 있습니다.
    reason: 4:3의 parenthetical wording을 보존하고 그 성격을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 제공된 영어 증언은 직역하면 ‘자신의 피조물들의 구원 외에는 아무것도 필요로 하지 않으시는’이라고도 옮길 수 있습니다. 그리스어 및 고대 번역본 전승에 대한 직접 검토가 아직 필요합니다.
    reason: 신학적으로 긴장된 표현을 본문에서 과도하게 단정하지 않으면서 대안적 직역을 보존하기 위해서입니다.
  - marker: c
    text: ‘오직 그분만이’가 예수 그리스도를 가리키는 것으로 옮겼습니다. 다만 이 절의 문장 관계와 ‘경건에 관한 지식’의 정확한 뜻은 원어 전승을 직접 대조한 뒤 확정해야 합니다.
    reason: 4:7의 선행사와 종교 관련 어휘에 남아 있는 원문 불확실성을 명시하기 위해서입니다.
lexical_decisions:
- source_word: matrimony is unlawful
  choice: 혼인이 허용되지 않는다고
  rationale: 법적·도덕적 금지를 함께 시사하는 영어 증언의 표현을 보존하면서, 현대 한국어에서 자연스럽게 전달했습니다.
- source_word: God of vengeance
  choice: 보복하시는 하나님
  rationale: ‘심판하시는’으로 완화하지 않고 원문 증언에 나타난 vengeance의 강한 의미를 유지했습니다.
- source_word: fear of God
  choice: 하나님을 경외함
  rationale: 단순한 공포보다 종교적 외경과 순종을 포함하는 전통적 의미를 자연스럽게 나타냅니다.
- source_word: knowledge of religion
  choice: 경건에 관한 지식
  rationale: ‘종교 지식’이라는 현대적·제도적 뉘앙스를 피하면서도 supplied witness의 의미를 재현했습니다.
- source_word: great things of God
  choice: 하나님의 위대한 일들
  rationale: 하나님의 행위나 신비, 가르침으로도 이해될 수 있는 열린 표현을 유지했습니다.
theological_decisions:
- issue: 하나님이 ‘아무것도 필요로 하지 않으시나 구원만은 필요로 한다’는 역설적 표현
  choice: 아무것도 필요로 하지 않으시면서도 자신의 피조물들이 구원받기를 바라시는
  alternative: 자신의 피조물들의 구원 외에는 아무것도 필요로 하지 않으시는
  rationale: 하나님의 결핍을 직접 암시하는 한국어를 피하되, supplied witness의 역설은 각주에 보존했습니다.
- issue: 4:7의 구원 행위 주체와 관계절의 선행사
  choice: 예수 그리스도를 ‘오직 그분만이’ 세상을 불쌍히 여기신 분으로 연결
  alternative: 하나님이 세상을 불쌍히 여기셨다고 연결
  rationale: 가까운 선행사인 예수 그리스도를 따르는 영어 증언의 구문을 유지했으나, 원어 검토 전에는 문법적 관계가 잠정적임을 각주로 밝혔습니다.
- issue: 혼인에 관한 고발이 바울 자신의 정확한 교리인지 여부
  choice: 다미리스의 고발 발언으로만 제시
  alternative: 작품이 혼인을 본질적으로 불법이라고 선언하는 것으로 서술
  rationale: 서사 속 고발과 작품 자체의 신학적 주장을 동일시하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 총독에게 하는 말에는 격식을 갖춘 호칭과 청원형을 적용하고, 총독이 피고인 바울에게 하는 말은 권력관계를 반영해 해체에 가까운 문어적 명령·의문형으로 처리했습니다. 인명은 통용되는 한국어 음역인 다미리스, 데마, 헤르모게네스, 바울, 테클라를 사용했습니다. 현재 초안은 제공된 공용 영어 증언에 근거한 잠정 번역이며, 그리스어 및 고대 번역본 전승의 직접 검토가 필요합니다.
