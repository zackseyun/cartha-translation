    4:3 그가 이렇게 말하고 있을 때, 데마와 헤르모게네스가 (다미리스에게 속삭이며) 말했습니다. “그가 그리스도인이라고 말하십시오. 그러면 곧 사형에 처해질 것입니다.”[a]


    4:4 그러나 총독은 좀 더 신중했습니다. 그는 바울을 불러 말했습니다. “너는 누구냐? 무엇을 가르치느냐? 이들이 너를 중대한 죄로 고발하는 듯하구나.”


    4:5 그러자 바울이 큰 소리로 말했습니다. “총독님, 이제 제 가르침에 관하여 해명하도록 부름받았으니, 제 말을 들어 주시기 바랍니다.


    4:6 보복하시는 하나님, 곧 자신의 피조물들의 구원 외에는 아무것도 필요로 하지 않으시는 하나님께서 저를 보내셨습니다.[b] 이는 그들을 악과 타락과 온갖 죄악 된 쾌락과 죽음에서 돌이키고, 더는 죄를 짓지 않도록 권하기 위함입니다.


    4:7 이 때문에 하나님께서는 자신의 아들 예수 그리스도를 보내셨습니다. 저는 그분을 선포하며 사람들이 그분께 소망을 두도록 가르칩니다. 오직 그분만이 미혹된 세상을 이토록 불쌍히 여기셨으니, 총독님, 이는 세상이 정죄받지 않고 믿음과 하나님을 경외함과 종교에 관한 지식과 진리에 대한 사랑을 갖게 하시려는 것입니다.[c]


    4:8 그러므로 제가 하나님께 계시로 받은 것만을 가르친다면, 제 죄가 무엇입니까?”


    4:9 총독은 이 말을 듣고, 자신이 더 한가해져 바울의 말을 충분히 들을 때까지 그를 결박하여 감옥에 가두라고 명령했습니다.


    4:10 그러나 밤이 되자 테클라는 귀고리를 빼서 감옥 문지기에게 주었습니다. 그러자 문지기가 문들을 열어 그녀를 안으로 들여보냈습니다.


    4:11 테클라는 간수에게 은거울도 선물하고 바울이 있는 방으로 들어가도록 허락받았습니다. 그녀는 바울의 발치에 앉아 그에게서 하나님의 위대한 일들을 들었습니다.


    4:12 테클라는 바울이 고난을 두려워하지 않고 하나님의 도움으로 담대하게 처신하는 것을 보았습니다. 그러자 그녀의 믿음이 크게 자라서 그녀는 바울의 쇠사슬에 입을 맞추었습니다.'
