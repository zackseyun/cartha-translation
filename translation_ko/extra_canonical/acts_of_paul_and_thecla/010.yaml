review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the supplied English witness well, but it unnecessarily treats 10:2 as grammatically ambiguous even though the supplied wording, “has assisted me to baptize,” in context with “I have been baptized,” is best rendered ‘helped me be baptized.’ It also changes the stated furlong into a stadion and partially softens or expands a few expressions. The source-language text is not supplied beyond the notice that direct review is pending; therefore disputed or editorially supplied material is retained with square brackets rather than resolved conjecturally.
  naturalness: The overall 합쇼체 register is natural and appropriately elevated. Replacing masculine pronouns used for Thecla with her name or a feminine-neutral Korean construction improves clarity. A few expressions are made more idiomatic while retaining the witness’s rhetorical force.
  terminology: Established forms such as 바울, 테클라, 이코니온, 안티오키아, 오네시포로스, 셀레우키아, and 그리스도 are retained. ‘하나님의 말씀’ is suitable for ‘oracles of God’ in this context. ‘금욕 생활’ avoids importing a fully institutionalized later monastic system, while the footnote explains the witness’s wording. ‘펄롱’ is retained in the text instead of being replaced by the non-identical unit 스타디온.
  issues:
  - severity: medium
    issue: 10:2의 세례 문구와 각주
    rationale: 본문의 ‘I have been baptized’와 ‘assisted me to baptize’는 이 영어 증언 안에서는 테클라가 세례를 받도록 도움을 받았다는 뜻으로 자연스럽게 연결됩니다. ‘세례를 행하다’라는 대안은 이 증언의 문법과 문맥이 뒷받침하지 않으므로 본문 및 각주에서 제거해야 합니다.
  - severity: medium
    issue: 10:13에서 furlong을 stadion으로 교체함
    rationale: 펄롱과 스타디온은 같은 단위가 아니며(대략 201m와 185m), 증언에 없는 단위로 바꾸면 정확성이 떨어집니다. 본문에는 ‘펄롱’을 보존하고 각주에서 대략적 미터 환산만 제시하는 것이 안전합니다.
  - severity: low
    issue: 10:9의 대괄호 표시 누락
    rationale: 영어 POB가 [endeavouring]와 [to her opinion]을 보존하므로, 번역도 해당 보충·복원 표지를 유지해야 합니다.
  - severity: low
    issue: 10:16의 ‘several [miraculous] cures’ 처리
    rationale: ‘여러 병을 고쳐 주었습니다’는 여러 질병이라는 뜻으로 읽힐 수 있습니다. 원문의 복수 치유 행위 및 대괄호의 편집 표지를 보존하여 ‘여러 [기적적인] 병 고침을 행했습니다’로 옮기는 편이 낫습니다.
  - severity: low
    issue: 10:18의 ‘against this servant of Christ’
    rationale: ‘해칠지’는 원문의 ‘어떤 방법을 취할지’보다 더 구체적인 폭력 의도를 부가합니다. ‘어떻게 대처할지/어떤 조처를 할지’가 더 중립적입니다.
  revised_text: '10:1 바울은 테클라와 그 일행을 보고 크게 놀랐습니다. 또 다른 시련이 그들에게 닥치려는 줄로 생각했기 때문입니다.


    10:2 테클라가 이를 알아차리고 바울에게 말했습니다. “바울이여, 저는 세례를 받았습니다. 당신이 복음을 전하실 때 도우시는 분께서 제가 세례를 받도록 도와주셨습니다.”


    10:3 그러자 바울은 테클라를 데리고 헤르메스의 집으로 갔습니다. 테클라는 안티오키아에서 자신에게 일어난 모든 일을 바울에게 들려주었습니다. 그러자 바울은 몹시 놀랐고, 그 이야기를 들은 사람들은 모두 믿음 안에서 굳세어졌으며 트리피나의 행복을 위해 기도했습니다.


    10:4 그 뒤 테클라가 일어나 바울에게 말했습니다. “저는 이코니온으로 가겠습니다.” 바울이 대답했습니다. “가서 주님의 말씀을 가르치십시오.”


    10:5 한편 트리피나는 가난한 사람들을 구제하도록 많은 돈을 바울에게 보냈고, 테클라의 손을 빌려 옷도 보냈습니다.


    10:6 테클라는 이코니온으로 갔습니다. 오네시포로스의 집에 이르자, 바울이 앉아 가르치던 곳의 바닥에 엎드렸습니다. 눈물과 기도를 섞으며, 다음과 같이 하나님을 찬양하고 영화롭게 했습니다.


    10:7 “오, 제가 이 집에서 처음으로 빛을 받았던 이 집의 하나님이신 주님! 오, 살아 계신 하나님의 아들 예수님, 총독 앞에서도, 불 속에서도, 짐승들 가운데서도 저를 도우신 분이시여! 주님만이 영원무궁토록 하나님이십니다. 아멘.”


    10:8 돌아온 테클라는 타미리스는 죽고 어머니는 살아 있는 것을 알게 되었습니다. 그래서 어머니를 불러 말했습니다. “어머니 테오클리아, 하늘에 거하시는 주 하나님 한 분만 계신다는 것을 믿게 되실 수 있겠습니까? 큰 재물을 바라신다면 하나님께서 저를 통하여 어머니께 주실 것입니다. 딸을 다시 원하신다면, 제가 여기 있습니다.”


    10:9 테클라는 어머니를 [자기 생각으로] 설득하려고 이런 말과 그 밖의 많은 말을 했습니다. 그러나 어머니 테오클리아는 순교자 테클라가 한 말을 믿지 않았습니다.


    10:10 테클라는 말해도 소용없음을 깨닫고 온몸에 [십자가의] 표를 그은 뒤 집을 떠나 다프네로 갔습니다. 그곳에 이르러, 전에 바울과 오네시포로스를 만났던 동굴로 가서 땅에 엎드려 하나님 앞에서 울었습니다.


    10:11 그곳을 떠난 뒤, 테클라는 셀레우키아로 가서 많은 사람을 그리스도를 아는 지식으로 밝히 깨우쳤습니다.


    10:12 빛나는 구름이 여행하는 테클라를 인도했습니다.


    10:13 셀레우키아에 도착한 테클라는 주민들이 우상 숭배자들이었으므로 그들을 두려워하여, 도시 밖 약 한 펄롱[b] 떨어진 곳으로 갔습니다.


    10:14 테클라는 [그 구름의] 인도를 받아 칼라몬 또는 로데온이라고 하는 산으로 갔습니다. 거기에서 여러 해를 머무르며 마귀에게서 오는 수많은 혹독한 시험을 겪었습니다. 그러나 그리스도께 받은 도움으로 그것들을 합당하게 견뎌 냈습니다.


    10:15 마침내 몇몇 귀부인이 처녀 테클라에 관한 소문을 듣고 그를 찾아왔습니다. 그들은 테클라에게 하나님의 말씀을 배웠고, 그 가운데 많은 이가 세속을 버리고 테클라와 함께 금욕 생활을 했습니다.[c]


    10:16 이로써 테클라에 관한 좋은 소문이 사방으로 퍼졌습니다. 테클라는 여러 [기적적인] 병 고침을 행했습니다. 그래서 온 도시와 주변 지역의 사람들이 병자들을 그 산으로 데려왔는데, 그들이 동굴 입구에 이르기도 전에 어떤 병을 앓든 즉시 나았습니다.


    10:17 더러운 영들은 소리를 지르며 쫓겨났습니다. 사람들은 모두 자신들이 데려온 병자들이 낫는 것을 보고, 처녀 테클라에게 이러한 능력을 주신 하나님을 영화롭게 했습니다.


    10:18 그 결과 셀레우키아의 의사들은 더 이상 인정을 받지 못했고, 아무도 그들에게 관심을 두지 않아 생업의 모든 수입을 잃었습니다. 그러자 그들은 시기로 가득 차서 이 그리스도의 종에게 어떤 조처를 할지 궁리하기 시작했습니다.'
