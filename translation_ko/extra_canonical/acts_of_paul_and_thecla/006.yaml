  text: '6:1 Meanwhile, Paul, together with Onesiphorus, his wife, and children, was keeping a fast in a certain cave on the road from Iconium to Daphne.


    6:2 And when they had fasted for several days, the children said to Paul, “Father, we are hungry, and have not wherewithal to buy bread”; for Onesiphorus had left all his substance to follow Paul with his family.


    6:3 Then Paul, taking off his coat, said to the boy, “Go, child, buy bread, and bring it here.”


    6:4 But while the boy was buying the bread, he saw his neighbor Thecla and was surprised, and said to her, “Thecla, where are you going?”


    6:5 She replied, “I am in pursuit of Paul, having been delivered from the flames.”


    6:6 The boy then said, “I will bring you to him, for he is under great concern on your account and has been in prayer and fasting these six days.”


    6:7 When Thecla came to the cave, she found Paul on his knees praying and saying, “O holy Father, O Lord Jesus Christ, grant that the fire may not touch Thecla; but be her helper, for she is your servant.”


    6:8 Thecla then, standing behind him, cried out in these words: “O sovereign Lord, Creator of heaven and earth, the Father of your beloved and holy Son, I praise you that you have preserved me from the fire, to see Paul again.”


    6:9 Paul then arose, and when he saw her, said, “O God, who searches the heart, Father of my Lord Jesus Christ, I praise you that you have answered my prayer.”


    6:10 And there prevailed among them in the cave an entire affection for each other, Paul, Onesiphorus, and all who were with them being filled with joy.


    6:11 They had five loaves, some herbs, and water, and they solaced each other in reflections upon the holy works of Christ.


    6:12 Then Thecla said to Paul, “If you are pleased with it, I will follow you wherever you go.”


    6:13 He replied to her, “Persons are now much given to fornication, and you being handsome, I am afraid lest you should meet with greater temptation than the former, and should not withstand, but be overcome by it.”


    6:14 Thecla replied, “Grant me only the seal of Christ, and no temptation shall affect me.”


    6:15 Paul answered, “Thecla, wait with patience, and you shall receive the gift of Christ.”'
translation:
  language: ko
  text: '바울과 테클라 행전 — 제6장


    6:1 그동안 바울은 오네시보로와 그의 아내와 자녀들과 함께 이고니온에서 다프네로 가는 길가의 한 동굴에서 금식하고 있었습니다.


    6:2 여러 날 금식한 뒤에 자녀들이 바울에게 말했습니다. “아버지, 배가 고픈데 빵을 살 돈이 없습니다.” 오네시보로가 온 가족과 함께 바울을 따르려고 자기 재산을 모두 두고 왔기 때문입니다.


    6:3 그러자 바울은 겉옷을 벗어 소년에게 주며 말했습니다. “얘야, 가서 빵을 사서 이리 가져오너라.”


    6:4 소년은 빵을 사러 갔다가 이웃에 살던 테클라를 보고 놀라서 물었습니다. “테클라, 어디로 가십니까?”


    6:5 테클라가 대답했습니다. “나는 불길에서 구출되어 바울을 찾아가는 길입니다.”


    6:6 그러자 소년이 말했습니다. “제가 바울에게 데려다드리겠습니다. 바울은 테클라 때문에 몹시 염려하며 엿새 동안 기도하고 금식했습니다.”


    6:7 테클라가 동굴에 이르러 보니, 바울이 무릎을 꿇고 이렇게 기도하고 있었습니다. “거룩하신 아버지, 주 예수 그리스도시여, 불이 테클라에게 닿지 않게 하시고 그를 도와주십시오. 그는 주님의 종입니다.”[a]


    6:8 테클라는 바울 뒤에 서서 이렇게 외쳤습니다. “주권자이신 주님, 하늘과 땅을 지으신 분, 주님의 사랑받는 거룩한 아들의 아버지시여, 저를 불에서 지켜 주셔서 바울을 다시 보게 하셨으니 주님을 찬양합니다.”[a]


    6:9 바울은 일어나 테클라를 보고 말했습니다. “마음을 살피시는 하나님, 내 주 예수 그리스도의 아버지시여, 제 기도에 응답해 주셨으니 주님을 찬양합니다.”


    6:10 동굴에 있던 이들은 서로 온전한 사랑을 나누었고, 바울과 오네시보로와 그들과 함께 있던 모든 사람이 기쁨으로 가득 찼습니다.


    6:11 그들에게는 빵 다섯 개와 채소 조금과 물이 있었습니다. 그들은 그리스도의 거룩한 일들을 되새기며 서로 위로했습니다.


    6:12 그때 테클라가 바울에게 말했습니다. “허락하신다면, 어디로 가시든 제가 따라가겠습니다.”


    6:13 바울이 테클라에게 대답했습니다. “요즘 사람들은 음행에 깊이 빠져 있습니다. 당신은 아름다우므로, 이전보다 더 큰 유혹을 만나 견디지 못하고 굴복할까 염려됩니다.”


    6:14 테클라가 대답했습니다. “제게 그리스도의 인장만 베풀어 주십시오. 그러면 어떤 유혹도 저를 건드리지 못할 것입니다.”[b]


    6:15 바울이 대답했습니다. “테클라, 참고 기다리십시오. 그러면 그리스도의 선물을 받게 될 것입니다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 6:7-8의 호칭 배열과 대명사 관계는 제공된 영어 증언에서 다소 모호합니다. 직접적인 그리스어 및 역본 전승 검토가 필요합니다.
    reason: 기도의 대상과 성부·성자 호칭의 통사 관계를 번역에서 임의로 확정하지 않았음을 알립니다.
  - marker: b
    text: ‘그리스도의 인장’과 ‘그리스도의 선물’은 문맥상 입문 의례나 신적 보호를 암시할 수 있지만, 본문은 그 뜻이나 두 표현의 관계를 명시하지 않습니다.
    reason: 중요한 의례적·신학적 표현의 진정한 모호성을 보존합니다.
lexical_decisions:
- source_word: coat
  choice: 겉옷
  rationale: 고대 의복을 현대의 특정 서양식 ‘코트’로 오해하지 않도록 일반적인 외투성 의복으로 옮겼습니다. 문맥상 이것을 팔아 빵을 살 물품으로 준다는 뜻이 자연스럽게 드러나도록 ‘벗어 소년에게 주며’를 보충했습니다.
- source_word: Father
  choice: 아버지
  rationale: 자녀들이 바울을 존경하는 호칭으로 부르는 문맥을 그대로 보존했으며, 생물학적 부자 관계로 단정하지 않았습니다.
- source_word: servant
  choice: 종
  rationale: 신에 대한 소속과 섬김을 나타내는 전통적 종교 언어를 간결하고 존엄하게 유지했습니다.
- source_word: entire affection
  choice: 온전한 사랑
  rationale: 단순한 호감보다 공동체의 충만한 애정과 결속을 나타내되, 현대 한국어에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: herbs
  choice: 채소 조금
  rationale: 식사 문맥에서 먹는 풀이나 채소를 뜻하는 넓은 표현으로 처리하여 특정 식물을 단정하지 않았습니다.
- source_word: seal of Christ
  choice: 그리스도의 인장
  rationale: 세례·성령·보호 표지 등 가능한 의례적·신학적 함의를 하나로 확정하지 않고 원문의 상징 표현을 보존했습니다.
- source_word: gift of Christ
  choice: 그리스도의 선물
  rationale: ‘은사’, ‘세례’ 등으로 구체화하지 않고 모호성을 유지했습니다.
theological_decisions:
- issue: 6:7의 ‘거룩하신 아버지’와 ‘주 예수 그리스도’의 호격 관계
  choice: 두 호칭을 나란히 유지함
  alternative: 두 표현을 한 대상에 대한 연속 호칭으로 명시하거나, 성부와 성자에게 각각 드리는 기도로 분리함
  rationale: 제공된 증거만으로 지시 대상을 확정하기 어려우므로 문장의 신학적 긴장을 해소하지 않았습니다.
- issue: ‘그리스도의 인장’의 의미
  choice: 상징어를 그대로 보존함
  alternative: 세례, 성령의 인침, 보호의 표로 해설하여 번역함
  rationale: 직접적인 그리스어 검토가 대기 중이고 본문 자체가 의미를 명시하지 않으므로 특정 교파적 해석을 들여오지 않았습니다.
- issue: ‘그리스도의 선물’과 앞 절의 ‘인장’의 관계
  choice: 서로 다른 표현으로 유지함
  alternative: 둘 다 세례 또는 동일한 의례를 가리키는 것으로 통일함
  rationale: 두 표현이 동일한 대상을 가리킬 가능성은 있으나 본문이 이를 명시하지 않으므로 어휘 차이를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 존엄하면서도 평이하게 하고, 직접화법에서는 관계와 상황에 맞추어 높임말을 적용했습니다. 이 초안은 제공된 1820년 공공 영역 영어 증언을 토대로 한 잠정 번역이며, 그리스어 및 고대 역본 전승에 대한 직접 검토 후 어휘·통사 결정을 재평가해야 합니다.
