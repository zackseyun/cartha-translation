review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언을 기준으로 전반적으로 충실합니다. 다만 6:3의 ‘소년에게 주며’는 증언이 명시하는 행동(겉옷을 벗음과 말함)을 넘어 소년에게 옷을 건네주었다는 행동을 보충합니다. 6:7의 ‘그를’은 여성인 테클라를 남성 대명사로 가리키는 한국어 관습상 부정확하므로 이름을 반복하는 것이 안전합니다. 6:6은 ‘has been in prayer and fasting these six days’의 계속 상태를 더 분명히 반영하도록 고쳤습니다.
  naturalness: 현대 표준 한국어 합쇼체는 대체로 자연스럽고 일관됩니다. 6:14의 ‘저를 건드리지 못할 것입니다’는 다소 구어적이어서 ‘저에게 영향을 미치지 못할 것입니다’로 다듬었습니다. 나머지 직접화법의 관계별 높임말과 서술체는 적절합니다.
  terminology: 바울, 오네시보로, 테클라, 이고니온, 다프네 및 ‘그리스도의 인장’, ‘그리스도의 선물’은 적절합니다. ‘인장’과 ‘선물’의 관계를 세례나 특정 의례로 해석하지 않은 점도 좋습니다. 6:7–8의 기도 호칭에 관한 모호성은 주석으로 보존합니다.
  issues:
  - severity: medium
    issue: 6:3 ‘겉옷을 벗어 소년에게 주며’
    rationale: 제공된 증언은 바울이 겉옷을 벗고 소년에게 말한 사실만 명시합니다. 옷을 소년에게 실제로 건네주었다는 행위는 문맥상 추정될 수 있어도 번역 본문에 보충하지 않는 편이 안전합니다.
  - severity: high
    issue: 6:7의 테클라 지시어 ‘그를’
    rationale: 한국어의 일반적 용법에서 ‘그’는 남성을 가리키므로, 여성 인물 테클라를 가리키는 대명사로는 부정확합니다. 이름을 반복하여 지시 대상을 명확히 해야 합니다.
  - severity: low
    issue: 6:6 ‘엿새 동안 기도하고 금식했습니다’
    rationale: 영어 증언의 현재완료 진행 표현은 테클라가 찾아온 현재까지 이어지는 기도와 금식을 뜻합니다. ‘엿새째 … 하고 계십니다’가 시간적 뉘앙스를 더 잘 보존합니다.
  - severity: low
    issue: 6:14 ‘어떤 유혹도 저를 건드리지 못할 것입니다’
    rationale: ‘affect’의 넓은 의미를 한국어에서 더 자연스럽고 중립적으로 살리려면 ‘영향을 미치지 못할 것입니다’가 적절합니다.
  revised_text: '바울과 테클라 행전 — 제6장


    6:1 그동안 바울은 오네시보로와 그의 아내와 자녀들과 함께 이고니온에서 다프네로 가는 길에 있는 한 동굴에서 금식하고 있었습니다.


    6:2 여러 날 금식한 뒤에 자녀들이 바울에게 말했습니다. “아버지, 배가 고픈데 빵을 살 돈이 없습니다.” 오네시보로가 온 가족과 함께 바울을 따르려고 자기 재산을 모두 두고 왔기 때문입니다.


    6:3 그러자 바울은 겉옷을 벗고 소년에게 말했습니다. “얘야, 가서 빵을 사서 이리 가져오너라.”


    6:4 소년은 빵을 사러 갔다가 이웃에 살던 테클라를 보고 놀라서 물었습니다. “테클라, 어디로 가십니까?”


    6:5 테클라가 대답했습니다. “나는 불길에서 구출되어 바울을 찾아가는 길입니다.”


    6:6 그러자 소년이 말했습니다. “제가 바울에게 데려다드리겠습니다. 바울은 테클라 때문에 몹시 염려하며 엿새째 기도하고 금식하고 계십니다.”


    6:7 테클라가 동굴에 이르러 보니, 바울이 무릎을 꿇고 이렇게 기도하고 있었습니다. “거룩하신 아버지, 주 예수 그리스도시여, 불이 테클라에게 닿지 않게 하시고 테클라를 도와주십시오. 테클라는 주님의 종입니다.”[a]


    6:8 테클라는 바울 뒤에 서서 이렇게 외쳤습니다. “주권자이신 주님, 하늘과 땅을 지으신 분, 주님의 사랑받는 거룩한 아들의 아버지시여, 저를 불에서 지켜 주셔서 바울을 다시 보게 하셨으니 주님을 찬양합니다.”[a]


    6:9 바울은 일어나 테클라를 보고 말했습니다. “마음을 살피시는 하나님, 내 주 예수 그리스도의 아버지시여, 제 기도에 응답해 주셨으니 주님을 찬양합니다.”


    6:10 동굴에 있던 이들은 서로 온전한 사랑을 나누었고, 바울과 오네시보로와 그들과 함께 있던 모든 사람이 기쁨으로 가득 찼습니다.


    6:11 그들에게는 빵 다섯 개와 채소 조금과 물이 있었습니다. 그들은 그리스도의 거룩한 일들을 되새기며 서로 위로했습니다.


    6:12 그때 테클라가 바울에게 말했습니다. “허락하신다면, 어디로 가시든 제가 따라가겠습니다.”


    6:13 바울이 테클라에게 대답했습니다. “요즘 사람들은 음행에 깊이 빠져 있습니다. 당신은 아름다우므로, 이전보다 더 큰 유혹을 만나 견디지 못하고 굴복할까 염려됩니다.”


    6:14 테클라가 대답했습니다. “제게 그리스도의 인장만 베풀어 주십시오. 그러면 어떤 유혹도 저에게 영향을 미치지 못할 것입니다.”[b]


    6:15 바울이 대답했습니다. “테클라, 참고 기다리십시오. 그러면 그리스도의 선물을 받게 될 것입니다.”[b]'
