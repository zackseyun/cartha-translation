base_translation:
  language: en
  yaml_path: translation/extra_canonical/acts_of_paul_and_thecla/008.yaml
  text: '8:1 When the people saw this, they said, “The judgments passed in this city are unjust.” But Thecla asked the governor for the favor that her chastity would not be violated, but preserved until she was thrown to the beasts.


    8:2 The governor then asked who would take her in. A very rich widow named Trifina, whose daughter had recently died, asked to have her in her care, and she began to treat Thecla in her house as her own daughter.


    8:3 At last the day came when the beasts were to be brought out for display. Thecla was brought to the amphitheater and put into a den containing an exceedingly fierce lioness, in the presence of a multitude of spectators.


    8:4 Trifina accompanied Thecla without showing any alarm, and the lioness licked Thecla’s feet. The written notice stating her crime read: “Sacrilege.” Then the woman cried out, “O God, the judgments of this city are unrighteous!”


    8:5 After the beasts had been displayed, Trifina took Thecla home with her, and they went to bed. And behold, Trifina’s dead daughter appeared to her mother and said, “Mother, regard the young woman Thecla as your daughter in my place. Ask her to pray for me, so that I may be transferred to a state of happiness.”


    8:6 Then Trifina said sorrowfully, “My daughter Falconilla has appeared to me and instructed me to receive you in her place. Therefore, Thecla, I ask you to pray for my daughter, so that she may be transferred to a state of happiness and to eternal life.”


    8:7 When Thecla heard this, she immediately prayed to the Lord and said, “O Lord God of heaven and earth, Jesus Christ, Son of the Most High, grant that her daughter Falconilla may live forever.” When Trifina heard this, she groaned again and said, “O unrighteous judgments! O senseless wickedness, that such a person should (again) be thrown to the beasts!”


    8:8 The next morning, at daybreak, Alexander came to Trifina’s house and said, “The governor and the people are waiting. Bring out the criminal.”


    8:9 But Trifina rushed at him so violently that he became frightened and ran away. Trifina was a member of the royal family. She expressed her sorrow in this way and said, “Alas! I have trouble in my house for two reasons, and there is no one who will relieve me—either in the loss of my daughter or in my inability to save Thecla. But now, O Lord God, be the helper of your servant Thecla.”


    8:10 While she was saying this, the governor sent one of his own officers to bring Thecla. Trifina took her by the hand and went with her, saying, “I went with Falconilla to her grave, and now I must go with Thecla to the beasts.”


    8:11 When Thecla heard this, she prayed with tears and said, “O Lord God, in whom I have placed my confidence and found refuge, reward Trifina for her compassion toward me and for preserving my chastity.”


    8:12 Then there was a great noise in the amphitheater. The beasts roared, and the people cried out, “Bring in the criminal!”


    8:13 But the woman cried out and said, “Let the whole city suffer for such crimes, and order all of us, O governor, to receive the same punishment. O unjust judgment! O cruel sight!”


    8:14 Others said, “Let the whole city be destroyed for this vile act. Kill us all, O governor! O cruel sight! O unrighteous judgment!”'
translation:
  language: ko
  text: '**바울과 테클라 행전 8장**


    **8:1** 사람들이 이것을 보고 말했습니다. “이 도시에서 내리는 판결은 부당합니다.” 그러나 테클라는 짐승들에게 던져질 때까지 자기 순결이 침해되지 않고 지켜지게 해 달라고 총독에게 청했습니다.


    **8:2** 그러자 총독은 누가 테클라를 맡아 줄 것인지 물었습니다. 얼마 전에 딸을 잃은 트리피나라는 매우 부유한 과부가 테클라를 자기가 맡게 해 달라고 청했습니다. 트리피나는 자기 집에서 테클라를 친딸처럼 대하기 시작했습니다.


    **8:3** 마침내 짐승들을 사람들에게 내보이는 날이 왔습니다. 수많은 관중이 지켜보는 가운데 테클라는 원형 경기장으로 끌려가 몹시 사나운 암사자가 있는 우리에 갇혔습니다.


    **8:4** 트리피나는 조금도 두려워하는 기색 없이 테클라와 함께 갔고, 암사자는 테클라의 발을 핥았습니다. 테클라의 죄목을 적은 패에는 “신성 모독”이라고 쓰여 있었습니다.[a] 그러자 그 여인이 외쳤습니다. “오, 하나님! 이 도시의 판결은 불의합니다!”


    **8:5** 짐승들을 내보여 보인 뒤, 트리피나는 테클라를 데리고 집으로 돌아갔고 두 사람은 잠자리에 들었습니다. 그런데 보십시오. 죽은 트리피나의 딸이 어머니에게 나타나 말했습니다. “어머니, 젊은 여인 테클라를 저 대신 어머니의 딸로 여겨 주십시오. 그리고 제가 복된 상태로 옮겨지도록 테클라에게 저를 위해 기도해 달라고 부탁해 주십시오.”[b]


    **8:6** 그러자 트리피나가 슬픔에 잠겨 말했습니다. “내 딸 팔코닐라가 내게 나타나, 자기를 대신하여 그대를 딸로 받아들이라고 했습니다. 그러니 테클라여, 내 딸이 복된 상태와 영원한 생명으로 옮겨지도록 그 아이를 위해 기도해 주기를 바랍니다.”


    **8:7** 테클라는 이 말을 듣자 곧바로 주님께 기도했습니다. “하늘과 땅의 주 하나님, 지극히 높으신 분의 아들이신 예수 그리스도여, 이 여인의 딸 팔코닐라가 영원히 살게 해 주십시오.” 이 말을 들은 트리피나는 다시 탄식하며 말했습니다. “오, 불의한 판결이여! 오, 분별없는 악행이여! 이런 사람이 (또다시) 짐승들에게 던져져야 하다니!”[c]


    **8:8** 이튿날 새벽, 알렉산더가 트리피나의 집에 와서 말했습니다. “총독과 백성이 기다리고 있소. 죄인을 내보내시오.”


    **8:9** 그러나 트리피나가 사납게 달려들자 알렉산더는 겁을 먹고 달아났습니다. 트리피나는 왕실 일족이었습니다. 그는 슬픔을 이렇게 토로했습니다. “아, 내 집에 두 가지 근심이 닥쳤는데도 아무도 나를 도와주지 않는구나. 딸을 잃은 슬픔에서도, 테클라를 구하지 못하는 이 일에서도 나를 도와줄 이가 없구나. 그러나 이제, 오 주 하나님, 주님의 종 테클라를 도와주십시오.”


    **8:10** 트리피나가 이렇게 말하고 있을 때, 총독은 자기 관원 하나를 보내 테클라를 데려오게 했습니다. 트리피나는 테클라의 손을 잡고 함께 가며 말했습니다. “나는 팔코닐라와 함께 그 아이의 무덤까지 갔는데, 이제는 테클라와 함께 짐승들에게로 가야 하는구나.”


    **8:11** 이 말을 들은 테클라는 눈물을 흘리며 기도했습니다. “오 주 하나님, 제가 신뢰하고 피난처로 삼은 분이시여, 저를 불쌍히 여기고 제 순결을 지켜 준 트리피나에게 갚아 주십시오.”


    **8:12** 그때 원형 경기장에서는 큰 소란이 일었습니다. 짐승들은 울부짖었고 백성은 외쳤습니다. “죄인을 들여보내라!”


    **8:13** 그러나 그 여인은 소리 높여 외쳤습니다. “이런 죄악 때문에 온 도시가 벌을 받게 하십시오. 총독이여, 우리 모두에게도 똑같은 형벌을 내리십시오. 오, 부당한 판결이여! 오, 참혹한 광경이여!”


    **8:14** 다른 사람들도 말했습니다. “이 비열한 짓 때문에 온 도시가 멸망하게 하십시오. 총독이여, 우리를 모두 죽이십시오! 오, 참혹한 광경이여! 오, 불의한 판결이여!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신성 모독’은 제공된 영어 증언의 “Sacrilege”를 옮긴 것입니다. 정확한 그리스어 죄목과 그 의미 범위는 원문 대조가 필요합니다.
    reason: 죄목의 원어가 제시되지 않았으므로 잠정 번역임을 밝힙니다.
  - marker: b
    text: ‘복된 상태로 옮겨지다’는 제공된 영어 증언을 따른 잠정 표현입니다. 그리스어 및 고대 번역본 전승을 대조하면 ‘의인들의 처소’와 같은 다른 표현일 가능성을 검토해야 합니다.
    reason: 사후 상태에 관한 표현을 교리적으로 확정하지 않고 전승상의 불확실성을 알립니다.
  - marker: c
    text: 괄호 속 ‘또다시’는 제공된 영어 증언에 괄호로 들어 있는 말을 보존한 것입니다. 그리스어 및 번역본 전승의 지지 여부는 추가 검토가 필요합니다.
    reason: 영어 증언 자체가 표시한 본문상의 불확실성을 그대로 드러냅니다.
lexical_decisions:
- source_word: chastity
  choice: 순결
  rationale: 성적 침해를 피하고 정결한 상태를 보존해 달라는 문맥을 자연스럽고 직접적으로 전달합니다.
- source_word: she-lion
  choice: 암사자
  rationale: 동물의 성별을 명시하는 증언의 세부를 보존했습니다.
- source_word: Sacrilege
  choice: 신성 모독
  rationale: 죄목 표지에 적힌 종교적 범죄를 현대 한국어 독자가 즉시 이해할 수 있는 법적·종교적 표현으로 옮겼습니다.
- source_word: translated to a state of happiness
  choice: 복된 상태로 옮겨지다
  rationale: 사후 상태와 이동을 함께 암시하는 표현의 모호성을 교리적으로 구체화하지 않고 보존했습니다.
- source_word: royal family
  choice: 왕실 일족
  rationale: 트리피나의 높은 신분과 알렉산더가 물러난 배경을 간결하게 드러냅니다.
- source_word: amphitheatre
  choice: 원형 경기장
  rationale: 고대 공연·처형 공간을 일반 독자가 이해하기 쉬운 현대 표준어로 표현했습니다.
theological_decisions:
- issue: 죽은 팔코닐라를 위한 기도와 그의 사후 상태
  choice: 본문의 요청과 기도를 그대로 번역하되 ‘복된 상태’로 표현함
  alternative: 특정한 사후 세계의 장소나 구원 교리로 구체화함
  rationale: 본문 자체의 신학적 긴장을 보존하고 특정 교파의 죽은 이를 위한 기도 교리를 덧붙이거나 제거하지 않았습니다.
- issue: 예수 그리스도를 부르는 기도의 호칭 구조
  choice: ‘하늘과 땅의 주 하나님, 지극히 높으신 분의 아들이신 예수 그리스도여’로 연결함
  alternative: ‘주 하나님’과 ‘예수 그리스도’를 서로 다른 두 청자로 분리함
  rationale: 제공된 증언의 호격 연쇄가 지닌 문법적·신학적 긴장을 섣불리 해소하지 않았습니다.
- issue: 순결의 보존
  choice: 신체적·성적 침해로부터 순결이 지켜진다는 문맥을 유지함
  alternative: 추상적인 영적 순수성으로만 번역함
  rationale: 총독에게 보호를 청하고 트리피나가 이를 지켰다는 서사 문맥을 반영했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 서술은 단정하고 품위 있게, 탄원과 군중의 외침은 직접성과 긴박감을 살려 번역했습니다. 고대 그리스어 본문과 번역본 전승의 직접 대조 자료가 제공되지 않았으므로, 이 초안은 공개 영역 영어 증언을 비평적으로 활용한 잠정 번역입니다. 원어가 확인되지 않은 곳에서는 영어 증언보다 더 구체적인 신학적 의미를 부여하지 않았습니다.
