  naturalness: 서술과 대부분의 발화는 자연스러운 현대 한국어입니다. 그러나 ‘-구나’는 현대 공식 존대체와 섞일 때 문체적 불균질을 일으키므로 합쇼체로 통일하는 것이 안전합니다. 8:10의 ‘그 아이의 무덤’은 원문의 ‘그녀의 무덤’을 자연스럽게 풀어 쓴 것이나, 고유명사를 직접 되풀이하여 더 명료하게 했습니다.
