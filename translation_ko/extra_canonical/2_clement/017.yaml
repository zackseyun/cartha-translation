review_pass:
  verdict: revise
  source_fidelity: 전반적인 권면의 구조와 종말 심판의 묘사는 잘 보존되었습니다. 그러나 17.4의 ‘우리를, 각 사람을 그의 행위에 따라, 구속하실’이라는 관계를 ‘각 사람에게 그 행위에 따라 갚으시고 우리를 구속하실’로 바꾼 것은 원문의 구속 동사와 수식 관계를 실질적으로 변경합니다. 또한 불신자들의 발화에서 ‘우리를 알지 못했고’는 ‘주께서 계셨으나 우리가 주를 알지 못했고’로 대상이 분명해야 합니다.
  naturalness: 현대 표준 한국어 합쇼체는 대체로 자연스럽습니다. 다만 ‘영혼이 멸망하게 내버려 두는 것’은 원문의 단순한 멸망 진술보다 행위자의 방임을 강하게 암시하므로 ‘멸망한다면’으로 조정하는 편이 정확하고 자연스럽습니다. ‘생명으로 함께 모이게 합시다’도 목적과 결과가 다소 불분명하여 ‘생명에 이르도록 함께 모이게 되기를 힘씁시다’로 다듬었습니다.
  terminology: ‘회개’, ‘하나님’, ‘주님’, ‘장로들’, ‘영혼’, ‘의인’, ‘구속’, ‘모든 육체’는 문헌의 종교적·역사적 문맥과 현대 격식체에 적합합니다. ‘각 사람을 그 행위에 따라 구속하실’은 해석상 어려움이 있어도 행위에 따른 구속을 보상과 구속이라는 두 행위로 분리하지 않고 원문의 긴장을 유지합니다.
  issues:
  - severity: high
    issue: 17.4에서 ‘각 사람에게 그 행위에 따라 갚으시고 우리를 구속하실 때’라고 번역함
    rationale: 영어 증언의 ‘redeem us, each man according to his works’ 및 그 배후의 그리스어 구문은 구속 행위를 각 사람의 행위에 따른다는 표현과 연결합니다. ‘갚으시고’라는 별도 심판 행위를 보태면 의미와 신학적 긴장이 달라집니다.
  - severity: medium
    issue: 불신자들의 말에서 ‘우리는 알지 못했고’의 대상을 생략함
    rationale: 문맥상 알지 못한 대상은 예수/주님입니다. 한국어에서는 바로 앞의 ‘주께서 계셨으나’에 이어 ‘주를 알지 못했고’로 밝혀야 원문의 호소 대상과 의미가 유지됩니다.
  - severity: medium
    issue: ‘영혼이 멸망하게 내버려 두는 것’이라는 표현
    rationale: 원문은 하나님을 이미 아는 영혼이 멸망하는 일을 말하며, 누군가가 이를 방임한다는 별도 의미를 명시하지 않습니다.
  - severity: low
    issue: ‘또 이렇게 기록되어 있습니다’라는 서술 추가
    rationale: 인용의 성경적 배경은 각주로 밝힐 수 있으나, 본문은 이사야 인용을 ‘기록되어 있다’고 명시하지 않습니다. 추가 서술 없이 인용을 연결하는 편이 절제되어 있습니다.
