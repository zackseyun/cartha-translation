    그러므로 우리 모두가 구원받도록 서로 도우며, 약한 이들을 선을 향해 이끌어 올립시다. 그리고 서로를 돌이키게 하며 권면합시다.


    또한 우리가 지금 여기에서만 귀 기울이고 믿으면 된다고 생각하지 맙시다. 집으로 돌아간 뒤에도 주님의 계명들을 기억하고, 세속적인 욕망에 이끌려 다른 길로 끌려가지 맙시다. 오히려 이곳에 더 자주 모여 주님의 계명 안에서 전진하기를 힘씁시다. 그리하여 우리 모두가 한마음을 품고 생명에 이르도록 함께 모이게 되기를 힘씁시다.


    주님께서 말씀하셨습니다. “내가 모든 민족과 지파와 언어들을 모으러 온다.”[a] 이 말씀은 주님께서 나타나시는 날, 곧 오셔서 우리 각 사람을 그 행위에 따라 구속하실 때를 가리킵니다.[b]


    믿지 않는 이들은 그분의 영광과 권능을 볼 것입니다. 그들은 세상의 왕국이 예수께 주어진 것을 보고 놀라며 이렇게 말할 것입니다. “우리에게 화가 닥쳤구나! 주께서 계셨으나 우리는 주를 알지 못했고 믿지도 않았으며, 장로들이 우리의 구원에 관하여 말해 주었을 때에도 그들에게 순종하지 않았다.” 또한 “그들의 벌레는 죽지 않고 그들의 불은 꺼지지 않으며, 그들은 모든 육체에게 구경거리가 될 것이다.”[c]


    이 말씀은 심판의 그날을 가리킵니다. 그날 사람들은 우리 가운데 경건하지 않게 살며 예수 그리스도의 계명들을 거짓되게 다룬 이들을 보게 될 것입니다.[d]


    그러나 선을 행하고 고난을 견디며 영혼의 쾌락을 미워한 의인들은, 잘못을 저지르고 말이나 행위로 예수를 부인한 이들이 꺼지지 않는 불 속에서 혹독한 고통으로 벌받는 것을 볼 때 하나님께 영광을 돌리며 이렇게 말할 것입니다. “온 마음으로 하나님을 섬긴 이에게는 소망이 있을 것이다.”'
