base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/017.yaml
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
translation:
  language: ko
  text: '그러므로 우리 가운데 아무도 길에서 멸망하지 않도록 온 마음으로 회개합시다. 우리가 사람들을 우상에게서 떼어 내어 가르치는 일을 힘써 하라는 명령을 받았다면, 이미 하나님을 아는 영혼이 멸망하게 내버려 두는 것은 얼마나 더 큰 잘못이겠습니까!


    그러므로 우리 모두가 구원받도록 서로 도우며, 약한 이들도 선을 향해 이끌어 올립시다. 그리고 서로 돌이키게 하고 권면합시다.


    또한 우리가 지금 여기에서만 귀 기울이고 믿으면 된다고 생각하지 맙시다. 집으로 돌아간 뒤에도 주님의 계명들을 기억하고, 세속적인 욕망에 이끌려 다른 길로 끌려가지 맙시다. 오히려 이곳에 더 자주 모여 주님의 계명 안에서 전진하기를 힘씁시다. 그리하여 우리 모두가 한마음을 품고 생명으로 함께 모이게 합시다.


    주님께서 말씀하셨습니다. “내가 모든 민족과 지파와 언어들을 모으러 온다.”[a] 이 말씀은 주님께서 나타나시는 날, 곧 오셔서 각 사람에게 그 행위에 따라 갚으시고 우리를 구속하실 때를 가리킵니다.[b]


    믿지 않는 이들은 그분의 영광과 권능을 볼 것입니다. 그들은 세상의 왕국이 예수께 주어진 것을 보고 놀라며 이렇게 말할 것입니다. “우리에게 화가 닥쳤구나! 주께서 계셨으나 우리는 알지 못했고 믿지도 않았으며, 장로들이 우리의 구원에 관하여 말해 주었을 때에도 순종하지 않았다.” 또 이렇게 기록되어 있습니다. “그들의 벌레는 죽지 않고 그들의 불은 꺼지지 않으며, 그들은 모든 육체가 보는 구경거리가 될 것이다.”[c]


    이 말씀은 심판의 그날을 가리킵니다. 그날 사람들은 우리 가운데 경건하지 않게 살며 예수 그리스도의 계명들을 거짓되게 다룬 이들을 보게 될 것입니다.[d]


    그러나 선을 행하고 고난을 견디며 영혼의 쾌락을 미워한 의인들은, 잘못을 저지르고 말이나 행위로 예수를 부인한 이들이 꺼지지 않는 불 속에서 혹독한 고통으로 벌받는 것을 볼 때 하나님께 영광을 돌리며 이렇게 말할 것입니다. “온 마음으로 하나님을 섬긴 이에게는 소망이 있을 것이다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 이사야 66:18을 반영한 인용으로 보입니다. 전해지는 성경 본문과 이 문서의 인용 형태 사이에는 표현상의 차이가 있습니다.
    reason: 성경 인용의 출처와 형태의 차이를 독자에게 알립니다.
  - marker: b
    text: 현재 초안은 제공된 영어 증언을 토대로 하였습니다. ‘각 사람에게 그 행위에 따라’가 ‘구속하실’과 정확히 어떻게 연결되는지는 그리스어 본문을 직접 대조하여 재검토할 필요가 있습니다.
    reason: 직접적인 그리스어 검토가 보류된 상태에서 문법적·신학적 불확실성을 명시합니다.
  - marker: c
    text: 이 문장은 이사야 66:24을 반영합니다. ‘구경거리’는 공개적으로 보이는 대상이라는 뜻입니다.
    reason: 인용 배경과 다소 낯선 표현을 설명합니다.
  - marker: d
    text: ‘거짓되게 다룬’은 계명에 불충실하거나 계명을 왜곡했다는 뜻일 수 있습니다.
    reason: 영어 증언 자체가 허용하는 의미 범위를 보존합니다.
lexical_decisions:
- source_word: repent
  choice: 회개합시다
  rationale: 단순한 후회가 아니라 삶의 방향을 돌이키라는 종교적·윤리적 권면을 자연스럽게 나타냅니다.
- source_word: soul
  choice: 영혼
  rationale: 문맥의 인간 내면과 구원·멸망의 대상을 보존하며, 뒤의 ‘영혼의 쾌락’과 어휘적 연결도 유지합니다.
- source_word: presbyters
  choice: 장로들
  rationale: 초기 그리스도교 공동체의 직분 또는 연장자 집단이라는 역사적 의미를 특정 교파의 용어로 좁히지 않습니다.
- source_word: all flesh
  choice: 모든 육체
  rationale: 성경 인용문의 관용적이고 포괄적인 표현을 보존하며, ‘모든 사람’으로 해석해 단정하지 않습니다.
- source_word: dealt falsely with
  choice: 거짓되게 다룬
  rationale: 계명을 어기거나 왜곡하거나 배반했다는 여러 가능성을 하나로 제한하지 않고 원문의 긴장을 유지합니다.
- source_word: pleasures of the soul
  choice: 영혼의 쾌락
  rationale: 다소 낯선 원문 표현을 ‘육체적 쾌락’ 등으로 교정하지 않고 그대로 보존합니다.
theological_decisions:
- issue: ‘redeem us, each man according to his works’의 관계
  choice: ‘각 사람에게 그 행위에 따라 갚으시고 우리를 구속하실 때’
  alternative: ‘각 사람을 그의 행위에 따라 구속하실 때’
  rationale: 행위에 따른 심판과 구속을 직접 동일시하는 식으로 문법적·신학적 관계를 과도하게 확정하지 않기 위해 병렬적으로 제시했습니다.
- issue: 심판 장면에서 의인들이 형벌받는 이들을 봄
  choice: 본문의 불편한 종말론적 장면을 그대로 유지
  alternative: 상징적 의미로 완화하거나 생략
  rationale: 자료가 지닌 신학적 긴장을 번역자가 해소하지 않았습니다.
- issue: ‘There will be hope’의 시제와 확신 정도
  choice: ‘소망이 있을 것이다’
  alternative: ‘소망이 있다’
  rationale: 미래 지향적 진술과 원문의 표현 강도를 유지하며, 구원론적 결론을 더 강하게 만들지 않습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 공동체적 권면은 ‘-합시다’로, 설명과 예언적 진술은 ‘-습니다/-것입니다’로 옮겼습니다. 고대 문헌의 반복과 종말론적 엄숙함은 유지하되, 지나치게 고어적인 어순은 피했습니다. 다만 제공 자료가 영어 공공영역 증언이며 그리스어 원문 직접 검토가 보류되어 있으므로, 본문과 각주에 관련 불확실성을 드러냈습니다.
