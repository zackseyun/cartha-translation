base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: ko
  text: '또한 불의한 자들이 재물을 누리는 반면 하나님의 종들은 곤궁을 겪는 것을 본다고 해서, 이 일로 여러분의 마음이 흔들리지 않게 하십시오.


    그러므로 형제자매 여러분, 믿음을 가집시다. 우리는 장차 올 삶에서 면류관을 받도록 이 현세의 삶을 통해 훈련받고 있습니다.


    의로운 사람은 누구도 열매를 빨리 거두지 못하며, 그것을 기다립니다.


    하나님께서 의로운 이들에게 보상을 빨리 주셨다면, 우리는 곧바로 경건이 아니라 장사를 위해 자신을 훈련했을 것입니다. 경건한 것을 추구하지 않고 이익이 되는 것을 추구하면서도, 겉으로는 의로운 사람처럼 보였을 것입니다. 이 때문에 하나님의 심판은 올바르지 않은 영혼에 닥쳐 그 영혼을 사슬로 무겁게 짓누릅니다.


    보이지 않으시는 유일하신 하나님, 곧 진리의 아버지께서 우리에게 구원자이며 불멸의 통치자[a]이신 분을 보내셨습니다. 또한 그분을 통하여 우리에게 진리와 하늘의 삶을 드러내셨습니다. 그 하나님께 영원무궁토록 영광이 있기를 빕니다. 아멘.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불멸의 통치자’는 영어 증언의 ‘Prince of immortality’를 옮긴 것입니다. ‘불멸의 창시자’ 또는 ‘불멸로 이끄시는 분’으로도 이해할 여지가 있으며, 그리스어 원문에 대한 직접 검토가 필요합니다.
    reason: 제공된 자료가 그리스어 본문이 아니라 영어 번역 증언이며, 핵심 칭호의 원어 의미 범위를 확정할 수 없기 때문입니다.
lexical_decisions:
- source_word: straitened
  choice: 곤궁을 겪는
  rationale: 재정적 빈곤에만 한정하지 않고 압박과 어려움을 겪는 상태를 자연스러운 현대 한국어로 나타냈습니다.
- source_word: trained
  choice: 훈련받고 있습니다
  rationale: 현세의 삶이 미래의 면류관을 위한 훈련 과정이라는 반복되는 비유를 보존했습니다.
- source_word: commerce
  choice: 장사
  rationale: 경건을 이익 추구의 거래로 바꾸는 문맥상의 대조를 일반 독자가 쉽게 이해하도록 옮겼습니다.
- source_word: spirit
  choice: 영혼
  rationale: 심판을 받고 사슬에 눌리는 인격적 내면을 가리키는 문맥에 맞추되, 원문의 인간론을 지나치게 체계화하지 않았습니다.
- source_word: Prince of immortality
  choice: 불멸의 통치자
  rationale: Prince의 권위와 지도자적 의미를 살리면서 현대 한국어에서 오해하기 쉬운 '왕자'는 피했습니다.
theological_decisions:
- issue: 현세의 고난과 미래의 보상
  choice: 현세에서 훈련받고 장차 올 삶에서 면류관을 받는다는 시간적 긴장을 그대로 유지했습니다.
  alternative: 현세의 고난이 반드시 미래 보상을 획득하게 한다고 인과적으로 강화할 수 있습니다.
  rationale: 본문은 목적을 말하지만 공로 체계를 명시하지 않으므로 그 이상의 교리적 결론을 덧붙이지 않았습니다.
- issue: 의인의 보상이 지연되는 이유
  choice: 보상이 즉시 주어질 경우 경건이 이익 추구로 변질된다는 본문의 논리를 직접 보존했습니다.
  alternative: 보상 지연을 시험이나 성화에 관한 특정 교리로 명시할 수 있습니다.
  rationale: 본문 자체의 윤리적·수사적 설명을 넘어 특정 교파의 틀을 도입하지 않았습니다.
- issue: 구원자와 하나님 사이의 관계
  choice: 하나님께서 구원자를 보내시고 그분을 통하여 진리와 하늘의 삶을 드러내셨다는 문장 구조를 유지했습니다.
  alternative: 후대의 삼위일체 용어를 보충하거나 대명사의 지시 대상을 교리적으로 확정할 수 있습니다.
  rationale: 송영의 관계적 표현은 보존하되 원문에 없는 신학 용어는 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면과 송영의 장중함은 유지하되 고어체 표현은 피했습니다. 제공된 drafting basis에 명시된 대로 그리스어 원문 검토가 아직 이루어지지 않았으므로, 이번 초안은 공개 영역 영어 증언과 영어 POB를 비판적으로 대조한 잠정 번역입니다.
