review_pass:
  verdict: revise
  source_fidelity: 안정적으로 확인되는 그리스어 표현 및 제공된 영어 증언과 대조할 때, 초안은 전체 논증과 문장 순서를 대체로 충실히 보존합니다. 다만 πνεῦμα에 해당하는 표현을 ‘영혼’으로 확정한 것과, 구원자의 칭호를 ‘불멸의 통치자’로 좁힌 것은 원문의 어휘 범위를 충분히 보존하지 못합니다. ‘열매를 거두다’도 원문의 ‘열매를 받다/얻다’보다 수확 행위 쪽으로 의미를 이동시킵니다.
  naturalness: 합쇼체와 권면·송영의 문체는 자연스럽습니다. 그러나 ‘장사를 위해 자신을 훈련했을 것입니다’보다 ‘장사에 힘썼을 것입니다’가 가정법 문맥에서 더 자연스럽고, 마지막 송영은 관계절을 한 문장으로 연결해야 하나님이 보내시고 드러내신 분이라는 원문의 구조가 더 명료해집니다.
  terminology: ‘영’은 πνεῦμα의 개방성을 보존하며, ‘의롭지 않은 영’은 본문의 도덕적 평가를 직접 반영합니다. ἀρχηγός 계열 칭호는 단순 통치 권한만 뜻하지 않고 선도자·창시자 등의 범위를 지닐 수 있으므로 ‘불멸의 선도자’로 옮기고 각주에서 불확실성과 대안을 밝혔습니다. ‘불멸’은 제공된 영어 증언의 immortality를 따르되, 그리스어 전승에서 ‘불멸성/썩지 않음’으로 이해될 여지도 각주에 남겼습니다.
  issues:
  - severity: medium
    issue: ‘영혼’으로 πνεῦμα를 번역함
    rationale: πνεῦμα는 ‘영’의 의미 범위를 지니며, 여기서 ‘영혼’으로 번역하면 인간론적 의미를 불필요하게 확정합니다.
  - severity: medium
    issue: ‘불멸의 통치자’로 Prince of immortality/ἀρχηγός 계열 칭호를 번역함
    rationale: ‘통치자’는 ἀρχηγός의 선도자·시작자·창시자 의미를 배제하고 군주적 의미로 좁힙니다. 원어 직접 검토의 잠정성도 있으므로 더 넓은 번역과 각주가 필요합니다.
  - severity: low
    issue: ‘열매를 빨리 거두지 못하며’라는 표현
    rationale: 원문과 영어 증언은 의인이 열매를 빨리 ‘받지/얻지’ 않는다고 말합니다. ‘거두다’는 수확 주체의 행위가 두드러져 의미가 약간 달라집니다.
  - severity: low
