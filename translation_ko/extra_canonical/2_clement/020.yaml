    rationale: 문법상 가능한 번역이지만, 보내시고 드러내신 주체가 하나님임을 한 문장 안에서 유지하는 편이 원문의 관계절 구조와 지시 관계를 더 선명하게 합니다.
  revised_text: '불의한 이들이 재물을 누리고 하나님의 종들이 곤궁을 겪는 것을 본다고 해서, 이 사실 때문에도 여러분의 마음이 흔들리지 않게 하십시오.


    그러므로 형제자매 여러분, 믿음을 가집시다. 우리는 장차 올 삶에서 면류관을 받도록 이 현세의 삶에서 훈련을 받고 있습니다.


