base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: ko
  text: '그러므로 형제자매 여러분, 이제 곧 회개합시다. 선한 일을 하도록 정신을 차립시다. 우리는 많은 어리석음과 악함으로 가득하기 때문입니다. 우리 자신에게서 이전의 죄들을 지워 버립시다. 사람의 환심을 사는 자들로 드러나지 맙시다. 우리끼리만 서로를 기쁘게 하려 하지 말고, 우리의 의로운 행실로 밖에 있는 사람들도 기쁘게 하려 합시다. 그리하여 우리 때문에 그 이름이 모독을 받지 않게 합시다.


    주님께서 말씀하십니다. “내 이름이 모든 이방인 가운데서 어디서나 모독을 받는다.” 또 말씀하십니다. “그로 말미암아 내 이름이 모독을 받는 자에게 화가 있다.” 그 이름이 무엇 때문에 모독을 받습니까? 여러분이 내가 바라는 일들을 행하지 않기 때문입니다.


    이방인들이 우리 입에서 나오는 하나님의 말씀을 들으면, 그 말씀의 아름다움과 위대함에 놀랍니다. 그러나 우리의 행실이 우리가 말하는 말씀에 합당하지 않다는 것을 알게 되면, 곧 모독하기 시작하며 “이것은 헛된 이야기요 미혹이다”라고 말합니다.


    하나님께서 “너희를 사랑하는 사람들을 사랑한다 해도, 그것이 너희에게 무슨 칭찬을 받겠느냐? 오히려 너희 원수들과 너희를 미워하는 사람들을 사랑하면, 그것이 너희에게 칭찬을 받을 일이다”라고 말씀하신다는 것을 우리에게서 들을 때, 그들은 이 말씀의 지극한 선함에 놀랍니다. 그러나 우리가 우리를 미워하는 이들을 사랑하지 않을 뿐만 아니라 우리를 사랑하는 이들조차 사랑하지 않는 것을 보면, 그들은 우리를 비웃고 그 이름은 모독을 받습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: brethren
  choice: 형제자매 여러분
  rationale: 공동체 전체를 부르는 호칭이라는 문맥적 범위를 현대 한국어에서 분명하고 자연스럽게 나타냈습니다.
- source_word: be sober unto that which is good
  choice: 선한 일을 위해 정신을 차립시다
  rationale: 육체적 금주보다는 도덕적·영적 각성을 촉구하는 뜻을 살렸습니다.
- source_word: men pleasers
  choice: 사람의 환심을 사는 자들
  rationale: 단순히 남을 기쁘게 하는 행위가 아니라 사람의 인정을 얻으려는 태도를 나타냈습니다.
- source_word: those men that are without
  choice: 교회 밖의 사람들
  rationale: 공동체 외부 사람들을 가리키는 관용적 표현의 지시 대상을 독자가 이해하도록 옮겼습니다.
- source_word: the Name
  choice: 그 이름
  rationale: 하나님의 이름을 경외하여 직접 반복하지 않는 표현을 보존했습니다.
- source_word: oracles of God
  choice: 하나님의 말씀
  rationale: 신적 권위를 지닌 발언이라는 뜻을 현대 독자가 자연스럽게 이해할 수 있게 옮겼습니다.
- source_word: credit / thank
  choice: 칭찬
  rationale: 도덕적으로 인정받을 만한 가치 또는 공로라는 문맥을 과도한 공로 교리로 고정하지 않도록 표현했습니다.
theological_decisions:
- issue: ‘그 이름’의 지시 대상
  choice: 본문에서는 ‘그 이름’을 유지함
  alternative: ‘하나님의 이름’으로 명시함
  rationale: 문맥상 하나님을 가리키지만 원문의 경외적이고 함축적인 표현을 보존했습니다.
- issue: 외부 사람들을 ‘기쁘게 한다’는 권면
  choice: ‘의로운 행실로 … 기쁘게 하여’로 번역함
  alternative: ‘인정을 받게 하여’ 또는 ‘호감을 얻게 하여’
  rationale: 앞 문장의 사람 비위를 맞추는 태도와 구별하면서도, 제공된 증거의 ‘please’라는 긴장을 임의로 제거하지 않았습니다.
- issue: 마지막 문장의 불완전한 전승
  choice: 문장을 추측하여 복원하지 않고 말줄임과 각주로 표시함
  alternative: ‘우리를 미워하는 사람들은커녕 우리를 사랑하는 사람들조차 사랑하지 않는다’ 등으로 보충함
  rationale: 제공된 영어 증거 자체가 불완전하며 그리스어 원문 대조가 아직 완료되지 않았으므로, 개연성 있는 복원을 본문에 몰래 도입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 장중한 합쇼체를 사용했습니다. 공동체적 권면에는 ‘-합시다’를, 설명과 인용 도입에는 ‘-습니다’를 사용했습니다. 제공 자료가 그리스어 원문 자체가 아니라 공용 영어 번역 증거이며 원문 검토가 보류된 상태이므로, 번역은 잠정적이고 특히 마지막 불완전 문장은 복원하지 않았습니다.
