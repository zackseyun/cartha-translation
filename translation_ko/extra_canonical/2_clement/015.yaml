base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/015.yaml
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
translation:
  language: ko
  text: '나는 절제에 관하여 여러분에게 결코 하찮은 권고를 했다고 생각하지 않습니다.[a] 누구든지 이 권고를 실천하는 사람은 후회하지 않을 것이며, 자기 자신과 조언자인 나를 모두 구원할 것입니다.[b] 방황하며 멸망해 가는 한 영혼을 돌이켜 구원받게 하는 것은 결코 작은 보상이 아니기 때문입니다.


    말하는 사람은 믿음과 사랑으로 말하고, 듣는 사람은 믿음과 사랑으로 듣는다면, 이것이야말로 우리를 창조하신 하나님께 우리가 드릴 수 있는 보답입니다.


    그러므로 우리가 믿은 것들, 곧 의와 거룩함 안에 굳게 머뭅시다. 그러면 우리는 하나님 앞에서 담대할 수 있을 것입니다. 하나님께서는 이렇게 말씀하십니다. “네가 아직 말하고 있을 때에 내가 ‘보라, 내가 여기 있다’라고 말하겠다.”[c]


    이 말씀은 위대한 약속의 표입니다. 주님께서는 자신이 주시는 데 기꺼이 나서시는 정도가, 구하는 사람이 구하는 데 나서는 정도보다 더 크다고 말씀하시기 때문입니다.


    그러므로 우리가 이처럼 큰 인자하심에 참여하는 사람들이 되었으니, 이 많은 좋은 것들을 얻지 못하도록 우리 자신을 막지 맙시다. 이 말씀을 실천한 사람들에게 이 말씀이 주는 기쁨이 큰 만큼, 불순종한 사람들에게 이 말씀이 가져오는 정죄도 큽니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘절제’는 문맥상 욕망과 행위를 다스리는 덕목을 가리킵니다. 제공된 자료에는 그리스어 원문이 제시되지 않아 원어의 정확한 범위는 추후 대조가 필요합니다.
    reason: ‘continence’가 성적 금욕만을 뜻하는 것으로 좁게 오해될 수 있고, 직접적인 그리스어 검토가 보류되어 있음을 밝힙니다.
  - marker: b
    text: ‘나를 … 구원할 것입니다’라는 표현은 권고를 받은 사람의 순종이 권고자에게도 구원과 관련된 유익을 준다는 본문의 대담한 표현을 그대로 살린 것입니다. 그 구체적인 방식은 본문이 설명하지 않습니다.
    reason: 신학적 긴장을 해소하려는 의역을 피하고 독자에게 실제 표현의 난점을 알립니다.
  - marker: c
    text: 이 인용문은 이사야 58:9의 표현과 가깝습니다.
    reason: 본문의 성경 인용 배경을 식별하되, 제공된 영문 증거와 성경 본문 사이의 표현 차이를 본문에서 억지로 조정하지 않습니다.
lexical_decisions:
- source_word: continence (Greek source review pending; likely ἐγκράτεια-related terminology)
  choice: 절제
  rationale: 현대 한국어에서 성적 금욕에만 한정하지 않고 욕망과 행위를 다스리는 폭넓은 덕목을 자연스럽게 나타냅니다. 다만 제공 자료에 그리스어 본문이 없으므로 원어 형태는 확정하지 않았습니다.
- source_word: counsel
  choice: 권고
  rationale: 단순한 의견보다 청중에게 실천을 촉구하는 훈계의 성격을 살리면서도 지나치게 권위적인 뉘앙스를 피했습니다.
- source_word: convert a wandering and perishing soul
  choice: 방황하며 멸망해 가는 한 영혼을 돌이켜
  rationale: ‘convert’를 특정 제도적 개종으로 좁히지 않고 방향을 돌이키게 한다는 뜻으로 옮겼으며, ‘wandering’과 ‘perishing’의 병행 의미를 보존했습니다.
- source_word: recompense
  choice: 보답
  rationale: 하나님께 값을 치르거나 공로로 갚는다는 뜻으로 과도하게 읽히지 않으면서, 창조주께 응답하여 드리는 행위라는 문맥을 살립니다.
- source_word: kindness
  choice: 인자하심
  rationale: 하나님의 호의와 선하신 은혜를 나타내는 존엄한 신앙 언어로 옮겼습니다.
- source_word: begrudge ourselves
  choice: 우리 자신을 막지
  rationale: 직역인 ‘우리 자신에게 아까워하지’는 한국어로 불분명하므로, 스스로 좋은 것들을 얻지 못하게 하지 말라는 문맥상의 뜻을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 권고를 실천하는 사람이 자신과 권고자를 모두 ‘구원한다’는 표현
  choice: ‘자기 자신과 조언자인 나를 모두 구원할 것입니다’라고 그대로 보존
  alternative: ‘자신도 구원받고 권고자인 나에게도 구원이 되게 할 것입니다’ 또는 ‘나에게 보상을 안겨 줄 것입니다’
  rationale: 대리 구원이나 공로 교리를 단정하지 않고, 전승된 문장의 의도적인 긴장과 수사적 표현을 유지했습니다.
- issue: 하나님께 드리는 ‘보답’
  choice: 믿음과 사랑으로 말하고 듣는 행위를 창조주께 드리는 보답으로 표현
  alternative: ‘하나님의 은혜를 갚는 대가’ 또는 ‘구원의 공로’
  rationale: 본문의 응답 윤리는 살리되, 인간이 하나님의 은혜를 공로로 상환한다는 교리적 해석을 덧붙이지 않았습니다.
- issue: ‘우리가 믿은 것들’과 ‘의와 거룩함’의 관계
  choice: 동격 가능성을 드러내도록 ‘곧’을 사용
  alternative: 서로 독립된 세 항목으로 나열
  rationale: 영문 증거가 ‘the things which we believed, in righteousness and holiness’로 다소 모호하므로, 문맥상 의와 거룩함이 믿은 내용 또는 그 안에 머무는 삶을 설명하는 관계를 자연스럽게 제시하되 특정 교리를 확정하지 않았습니다.
- issue: 구하는 사람보다 주님이 더 기꺼이 주신다는 비교
  choice: 하나님의 자발적이고 풍성한 베푸심을 비교문의 형태로 유지
  alternative: 하나님이 인간의 요청 이전에 모든 것을 무조건 주신다고 해설
  rationale: 본문의 강조는 살리되 섭리나 기도 응답에 관한 체계적 교리를 추가하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 권면문의 엄숙함을 유지하되 고어체와 교파적 전문 용어를 피했습니다. 제공 자료가 그리스어 본문 자체가 아니라 공용 영문 번역 증거이므로, 원어 형태를 확정적으로 주장하지 않았으며 직접적인 그리스어 사본 전승 대조가 필요합니다.
