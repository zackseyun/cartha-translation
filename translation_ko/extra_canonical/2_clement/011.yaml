base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: ko
  text: '그러므로 우리는 깨끗한 마음으로 하나님을 섬깁시다. 그러면 의롭다 하심을 받을 것입니다. 그러나 하나님의 약속을 믿지 않아 그분을 섬기지 않는다면, 우리는 비참해질 것입니다.


    예언의 말씀도 이렇게 말합니다. “마음이 둘로 갈라져 속으로 의심하며 이렇게 말하는 자들은 비참합니다. ‘이런 일들은 우리 조상들의 시대에도 오래전부터 들어 왔습니다. 그러나 우리는 날마다 기다렸지만 그 가운데 아무것도 보지 못했습니다.’”


    어리석은 자들이여! 여러분 자신을 나무에 견주어 보십시오. 포도나무를 예로 들어 보십시오. 먼저 잎이 떨어지고, 그다음에 싹이 나며, 이어서 신 포도알이 맺히고, 마침내 포도가 완전히 익습니다.


    이와 같이 내 백성도 소요와 고난을 겪었지만, 그 뒤에는 좋은 것들을 받을 것입니다.


    그러므로 형제자매 여러분, 우리는 두 마음을 품지 말고 희망 가운데 끈기 있게 견딥시다. 그리하여 우리도 상을 받도록 합시다.


    각 사람에게 그 행위에 따른 보상을 갚아 주겠다고 약속하신 분은 신실하시기 때문입니다.


    그러므로 우리가 하나님 앞에서 의를 행한다면, 그분의 나라에 들어가 “귀가 듣지 못하고 눈이 보지 못했으며, 눈이 보지 못했고 사람의 마음에 떠오르지도 않은”[a] 약속들을 받을 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영어 증언에는 ‘눈이 보지 못했다’는 문구가 두 번 반복됩니다. 여기서는 그 반복을 그대로 보존했습니다. 그리스어 원문에 대한 직접 대조 검토는 아직 필요합니다.
    reason: 증언의 이례적인 반복과 원문 검토 미완료 상태를 독자에게 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: pure heart
  choice: 깨끗한 마음
  rationale: 윤리적·내면적 순수성을 평이하면서도 품위 있게 전달합니다.
- source_word: we shall be righteous
  choice: 의롭다 하심을 받을 것입니다
  rationale: 문맥상 하나님 앞에서 의로운 자로 인정되는 뜻을 자연스럽게 나타내되, 행위와 칭의의 관계를 특정 교리 체계로 단정하지 않도록 수동 표현을 사용했습니다.
- source_word: double-minded
  choice: 마음이 둘로 갈라져 / 두 마음을 품다
  rationale: 내적 동요와 불신을 뜻하는 비유를 첫 용례에서는 풀어 쓰고, 권면에서는 자연스러운 한국어 관용 표현으로 옮겼습니다.
- source_word: sour berry
  choice: 신 포도알
  rationale: 익기 전 포도 열매의 성장 단계를 현대 독자가 쉽게 이해하도록 구체화했습니다.
- source_word: recompense of his works
  choice: 그 행위에 따른 보상
  rationale: 각 사람의 행위에 상응하는 갚음을 나타내며, 보상의 성격을 상이나 형벌 한쪽으로 제한하지 않습니다.
theological_decisions:
- issue: 의와 하나님 섬김의 관계
  choice: ‘의롭다 하심을 받을 것입니다’로 번역
  alternative: ‘의로워질 것입니다’ 또는 ‘의로운 사람이 될 것입니다’
  rationale: 영어 증언의 미래 수동적 의미를 살리면서도, 이것이 도덕적 변화인지 판정인지에 관한 긴장을 완전히 해소하지 않기 위한 선택입니다.
- issue: 행위에 따른 보상
  choice: ‘그 행위에 따른 보상’으로 번역
  alternative: ‘그 행위의 삯’ 또는 ‘행한 대로 갚음’
  rationale: 약속하신 분의 신실하심과 각 사람의 행위에 상응하는 결과를 함께 보존하되, 특정 구원론적 결론을 덧붙이지 않았습니다.
- issue: 마지막 인용문의 중복
  choice: ‘눈이 보지 못했으며, 눈이 보지 못했고’를 그대로 유지
  alternative: 중복 하나를 삭제
  rationale: 제공된 증언에 같은 구절이 반복되어 있으므로 본문비평상 불확실성을 숨기지 않고 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면은 공동체적이고 설교적인 어조를 유지했으며, ‘brethren’은 오늘날 혼성 독자 공동체를 자연스럽게 가리키도록 ‘형제자매 여러분’으로 옮겼습니다. 제공 자료가 공용 영어 번역 증언에 기반하고 그리스어 직접 검토가 미완료 상태이므로, 이 초안은 해당 증언을 충실히 반영하면서도 불확실한 반복을 각주로 표시했습니다.
