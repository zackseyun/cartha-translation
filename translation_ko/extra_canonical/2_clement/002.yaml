    rationale: 영어 증언은 ‘not those things which stand, but those which are falling’이며, 원문의 중성적 표현이 보존된 번역입니다. 이어지는 인간 구원의 적용과 연결되지만, 이 문장 자체에서는 ‘것들’이라는 비유적·포괄적 표현을 보존하는 것이 안전합니다.
