    rationale: ‘have God’은 특정 집단이나 구체적 신앙 행위를 규정하지 않습니다. ‘하나님을 가진 듯 보이던 이들’이 다소 낯설더라도 본문의 의도적 모호성을 더 잘 유지합니다.
