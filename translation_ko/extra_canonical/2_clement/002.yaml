  naturalness: 현대 표준 한국어 합쇼체가 일관되고, 권면의 청유형도 자연스럽습니다. 다만 ‘우리 교회는 … 불임이었기’는 비유임을 감안해도 다소 거칠게 들릴 수 있으나, 저자가 의도적으로 불임 비유를 교회에 적용하므로 유지할 수 있습니다. ‘자녀들을 받기 전’은 ‘자녀들이 주어지기 전’이 더 자연스럽고 원문에 가깝습니다.
  terminology: ‘멸망해 가는 이들’, ‘구원’, ‘의인’, ‘죄인’, ‘그리스도’는 적절합니다. ‘버림받은 여인’은 인용문의 ‘황량한/버려진’ 상태를 간명하게 전달하나, 해설에서는 ‘황폐하고 하나님께 버림받은 듯’으로 두 요소를 구별하는 편이 더 충실합니다. 성경 인용의 출처를 밝히는 각주는 적절하며, 복음서의 직접 사용 본문을 단정하지 않는 점도 좋습니다.
