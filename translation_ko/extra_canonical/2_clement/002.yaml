base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: ko
  text: '“아이를 낳지 못한 불임 여인아, 기뻐하십시오. 산고를 겪지 않은 여인아, 목청껏 외치십시오. 버림받은 여인의 자녀가 남편 있는 여인의 자녀보다 더 많기 때문입니다.”[a] 여기서 “아이를 낳지 못한 불임 여인아, 기뻐하십시오”라고 한 것은 우리를 두고 한 말입니다. 우리 교회는 자녀들을 받기 전에는 불임이었기 때문입니다.


    또 “산고를 겪지 않은 여인아, 목청껏 외치십시오”라고 한 뜻은 이러합니다. 우리는 해산하는 여인들처럼 지쳐 버리지 말고, 꾸밈없는 마음으로 하나님께 계속 기도를 드립시다.


    또 “버림받은 여인의 자녀가 남편 있는 여인의 자녀보다 더 많기 때문입니다”라고 한 것은, 우리 백성이 버림받아 하나님께도 외면당한 듯 보였기 때문입니다. 그러나 이제 우리는 믿게 되어, 하나님을 모시고 있는 듯 보이던 이들보다 더 많아졌습니다.


    또 다른 성경에는 “나는 의인들을 부르러 온 것이 아니라 죄인들을 부르러 왔다”라고 기록되어 있습니다.[b]


    이 말씀의 뜻은 이러합니다. 멸망해 가는 이들을 구원하는 것이 마땅합니다.


    참으로 위대하고 놀라운 일은 서 있는 이들이 아니라 쓰러져 가는 이들을 바로 세우는 것입니다.


    그리스도께서도 이와 같이 멸망해 가는 이들을 구원하기를 원하셨습니다. 그분은 이미 멸망해 가던 우리에게 오셔서 우리를 부르셨고, 많은 사람을 구원하셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이사야 54:1을 인용한 말씀입니다.
    reason: 고대 저자가 이름을 밝히지 않은 성경 인용문의 출처를 독자에게 알려 줍니다.
  - marker: b
    text: 이 말씀은 마가복음 2:17과 평행 본문인 마태복음 9:13, 누가복음 5:32에 나옵니다.
    reason: 복음서 인용의 위치와 평행 전승을 밝히되, 어느 복음서를 직접 사용했는지는 단정하지 않습니다.
lexical_decisions:
- source_word: στεῖρα / barren
  choice: 불임 여인
  rationale: 단순히 자녀가 없는 상태보다 출산하지 못하는 상태를 가리키는 비유를 분명히 하면서도, 뒤따르는 교회 해석과 연결되도록 했습니다.
- source_word: ἐρήμου / desolate
  choice: 버림받은 여인
  rationale: 황폐함과 관계적 단절을 함께 함축하는 문맥을 살리고, 이어지는 ‘하나님께 외면당한 듯 보였다’는 해설과 자연스럽게 연결했습니다.
- source_word: μετὰ ἁπλότητος / with simplicity
  choice: 꾸밈없는 마음으로
  rationale: ‘단순함’이라는 직역이 지적 단순성으로 오해되지 않도록, 진실하고 나뉘지 않은 태도를 나타냈습니다.
- source_word: ἀπολλυμένους / those perishing
  choice: 멸망해 가는 이들
  rationale: 진행 중인 위기와 구원의 필요를 나타내며, 단순히 길을 잃었다는 의미로 약화하지 않았습니다.
- source_word: στηρίζειν / establish
  choice: 바로 세우다
  rationale: 쓰러져 가는 이들을 굳게 세우고 지탱한다는 대조를 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 이사야의 불임 여인 비유가 가리키는 대상
  choice: 저자의 해석대로 ‘우리’와 ‘우리 교회’를 명시
  alternative: 이스라엘이나 이방 교회로 교리적으로 특정
  rationale: 본문 자체가 교회 공동체에 적용하지만 그 정체를 더 좁게 규정하지 않으므로, 후대의 교파적 해석을 덧붙이지 않았습니다.
- issue: ‘하나님을 가진 듯 보이던 이들’의 정체
  choice: ‘하나님을 모시고 있는 듯 보이던 이들’로 유지
  alternative: 유대인으로 명시
  rationale: 문맥상 특정 집단을 암시할 수 있으나 본문이 직접 이름 붙이지 않으므로 모호성을 보존했습니다.
- issue: ‘의인’과 ‘죄인’의 부르심
  choice: 인용문의 대조를 그대로 보존
  alternative: 스스로 의롭다고 여기는 사람들로 풀이
  rationale: 본문이 ‘의인’을 수사적 또는 자칭 범주라고 명시하지 않으므로 해석을 본문에 삽입하지 않았습니다.
- issue: 그리스도가 ‘멸망해 가는 것들’을 구원함
  choice: 문맥상 사람을 가리키는 ‘이들’로 표현
  alternative: 중성적 ‘것들’로 직역
  rationale: 뒤의 ‘우리’와 ‘많은 사람’을 통해 인격적 대상이 분명해지므로 자연스러운 한국어를 택했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 성경 인용은 존중하는 명령형으로, 저자의 권면은 공동체적 청유형으로 옮겼습니다. 문체는 예배문처럼 지나치게 고풍스럽지 않으면서도 초기 그리스도교 권면문의 장중함을 유지했습니다. 제공 자료가 영어 공용 번역 증언을 중심으로 하며 그리스어 직접 대조가 보류되어 있다는 점을 고려해, 세부 문법을 과도하게 확정하지 않았습니다.
