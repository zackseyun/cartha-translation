review_pass:
  verdict: revise
  source_fidelity: 경기·관·부정행위·인·꺼지지 않는 불의 비유와 반복 구조는 영어 증언에 대체로 충실합니다. 다만 ‘straight course’는 단순한 ‘곧은 길’보다 경주 비유를 드러내는 ‘곧은 코스’로 옮기는 편이 낫고, ‘come near to the crown’은 ‘관 가까이에는 이르다’보다 ‘관에 가까이 가다’가 자연스럽고 정확합니다. ‘인장을 지키다’는 한국어 결합이 다소 부자연스러워, 원문의 해석상 개방성은 유지하면서 ‘인을 지키다’로 수정합니다.
  naturalness: 합쇼체의 권면 어조는 잘 유지되어 있습니다. 그러나 ‘곧은 길로 달리며, 썩지 않을 경기에 임합시다’는 두 비유의 관계가 어색하고, ‘경기에 나선 사람도’는 대조·양보의 연결이 매끄럽지 않습니다. 이를 현대 표준어의 경주 어휘로 다듬었습니다.
  terminology: ἀγών의 운동 경기/경주 은유는 ‘경기’와 ‘겨루다’로 유지하되, 달리는 장면에서는 ‘경주 코스’로 명시했습니다. στέφανος의 ‘관’, σφραγίς의 의미를 한정하지 않는 ‘인’, 성경 인용의 ‘모든 육체’는 보존했습니다. ‘구더기’는 이사야 인용에서 ‘worm’의 구체적 이미지를 잘 살립니다.
  issues:
  - severity: medium
    issue: ‘곧은 길로 달리며, 썩지 않을 경기에 임합시다’의 비유 관계가 불명확함
    rationale: 영어 증언의 ‘run in the straight course, the incorruptible contest’는 경주 코스와 썩지 않는 경주를 밀접하게 연결합니다. ‘썩지 않는 경주라는 곧은 코스를 달립시다’로 옮기면 두 요소와 운동 비유가 함께 보존됩니다.
  - severity: low
    issue: ‘관 가까이에는 이르도록’의 어색한 결합
    rationale: ‘come near to the crown’은 관 자체에 가까이 감을 뜻하므로 ‘관에 가까이 가도록’이 더 자연스럽습니다.
  - severity: medium
    issue: ‘인장을 지키지 않은’의 한국어 관용성과 상징어의 처리
    rationale: 원문상 의미를 교리적으로 특정하지 않아야 하나, ‘인장’을 ‘지키다’는 물리적 도구를 보관한다는 뜻으로 읽히기 쉽습니다. 전통적·상징적 표현인 ‘인’을 사용하면 원문의 열려 있는 표현을 더 잘 보존합니다.
