  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: ko
  text: '그러므로 형제 여러분, 경기가 가까이 닥쳤음을 알고 힘써 겨룹시다. 썩어 없어질 경기에는 많은 사람이 나서지만, 모두가 관을 받는 것은 아니며, 오직 수고를 아끼지 않고 용감하게 겨룬 사람들만 받습니다.


    그러므로 우리 모두가 관을 받도록 힘써 겨룹시다.


    그러므로 곧은 길로 달리며, 썩지 않을 경기에 임합시다. 우리도 관을 받도록 다 함께 몰려가 힘써 겨룹시다. 모두가 관을 받을 수 없다면, 적어도 관 가까이에는 이르도록 합시다.


    우리는 썩어 없어질 경기에 나선 사람도 부정한 짓을 한 것으로 드러나면, 먼저 매를 맞고 나서 경기장에서 쫓겨난다는 것을 알아야 합니다.


    여러분은 어떻게 생각합니까? 썩지 않을 경기에서 부정한 짓을 한 사람은 어떤 일을 당하겠습니까?


    인장을 지키지 않은 사람들을 두고 그분께서 이렇게 말씀하십니다. “그들의 구더기는 죽지 않고 그들의 불은 꺼지지 않으며, 그들은 모든 육체가 보는 구경거리가 될 것이다.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 이사야 66:24을 인용한 것입니다. 전승된 본문은 “그들은 모든 육체가 보는 구경거리가 될 것이다”라는 내용을 포함합니다.
    reason: 성경 인용의 출처를 밝히고, 인용문의 독특한 종말론적 이미지를 독자가 알아볼 수 있게 합니다.
lexical_decisions:
- source_word: ἀγωνίζεσθαι / ἀγών (as reflected in the witness)
  choice: 힘써 겨루다 / 경기
  rationale: 운동 경기의 비유와 치열한 분투의 뜻을 함께 살리되, 문맥에 따라 동사에는 ‘힘써’를 보태 자연스러운 현대 한국어로 옮겼습니다.
- source_word: φθαρτός / ἄφθαρτος (as reflected in the witness)
  choice: 썩어 없어질 / 썩지 않을
  rationale: 일시적인 경기와 영원한 성격의 경기 사이의 대조를 보존했습니다.
- source_word: στέφανος / στεφανοῦσθαι (as reflected in the witness)
  choice: 관 / 관을 받다
  rationale: 고대 경기의 승리자에게 주는 관이라는 이미지를 유지하며, 왕관으로 오해될 수 있는 ‘면류관’보다 일상 독해가 쉬운 표현을 택했습니다.
- source_word: σφραγίς (as reflected in the witness)
  choice: 인장
  rationale: 세례, 신앙 표지, 종말론적 소유 표지 등으로 해석될 수 있는 표현을 특정 교리로 한정하지 않고 물리적·상징적 의미가 모두 가능한 말로 보존했습니다.
- source_word: πᾶσα σάρξ (scriptural quotation as reflected in the witness)
  choice: 모든 육체
  rationale: ‘모든 사람’으로 평탄화하지 않고 성경 인용문의 어휘와 낯선 긴장을 보존했습니다.
theological_decisions:
- issue: ‘인장’의 의미
  choice: ‘인장을 지키지 않은 사람들’로 직역에 가깝게 유지
  alternative: ‘세례의 표를 지키지 않은 사람들’ 또는 ‘믿음을 지키지 않은 사람들’
  rationale: 본문 자체가 인장의 정체를 명시하지 않으므로 특정 성례전적 또는 교리적 해석을 본문에 삽입하지 않았습니다.
- issue: 모두가 관을 받는다는 권면과 ‘모두가 받을 수 없다면’이라는 문장의 긴장
  choice: 두 진술을 모두 그대로 보존
  alternative: 후자를 개인적 실패 가능성이나 수사적 과장으로 해설하여 조화
  rationale: 저자가 남긴 권면과 현실적 조건 사이의 긴장을 번역에서 해소하지 않았습니다.
- issue: 마지막 심판 이미지의 주체와 범위
  choice: ‘그분께서’와 ‘모든 육체’를 유지
  alternative: ‘하나님께서’와 ‘모든 사람’으로 명시
  rationale: 인용을 소개하는 대명사의 지시 대상과 성경적 표현의 범위를 번역자가 과도하게 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 반복되는 경기·달리기·관의 비유를 통일성 있게 보존했으며, 엄숙한 권면의 어조를 유지했습니다. 다만 제공 자료가 직접적인 그리스어 본문이 아니라 공공영역 영어 증언이고 원문 검토가 보류된 상태이므로, 어휘 판단은 해당 증언과 알려진 성경 인용의 표현에 근거한 잠정적 출판 초안입니다.
