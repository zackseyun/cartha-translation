base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: ko
  text: '그러므로 우리도 감사하는 사람들 가운데, 하나님을 섬겨 온 사람들 가운데 있는 것으로 드러나고, 심판받는 경건하지 않은 사람들 가운데 들지 않도록 합시다.


    나 자신도 참으로 큰 죄인입니다. 나는 아직 유혹에서 벗어나지 못했고, 여전히 마귀의 올가미 한가운데 있습니다. 그러나 다가올 심판을 두려워하기에, 적어도 의에 가까이 다가가는 데까지는 이를 수 있도록 힘써 의를 좇습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공공 영역 영어 증언 본문을 바탕으로 한 잠정 번역입니다. 그리스어 원문에 대한 직접 검토가 아직 필요합니다. 특히 ‘마귀의 올가미’, ‘이를 수 있도록’, 마지막 절의 인과 관계는 원문 검토에 따라 조정될 수 있습니다.
    reason: 사용 가능한 자료가 그리스어 본문 자체가 아니라 영어 증언이며, 직접 원어 검토가 보류 중임을 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: give thanks
  choice: 감사하는
  rationale: 감사를 표현하거나 드리는 행위를 자연스럽고 직접적으로 나타냈습니다.
- source_word: have served God
  choice: 하나님을 섬겨 온
  rationale: 완료적 뉘앙스를 살리면서 지속된 섬김을 현대 한국어로 자연스럽게 표현했습니다.
- source_word: ungodly
  choice: 경건하지 않은 사람들
  rationale: 특정 교파적 용어를 피하면서 하나님을 공경하지 않는다는 윤리·종교적 의미를 보존했습니다.
- source_word: engines of the devil
  choice: 마귀의 올가미
  rationale: 영어 고어의 ‘장치·계략’ 이미지를 문맥에 맞게 이해하기 쉬운 위험과 속박의 비유로 옮겼습니다. 다만 직접 그리스어 검토 전의 잠정적 선택입니다.
- source_word: follow after righteousness
  choice: 의를 좇습니다
  rationale: 의로움을 추구한다는 운동성과 지속성을 간결하고 장중하게 보존했습니다.
theological_decisions:
- issue: 감사하는 이들과 하나님을 섬긴 이들의 관계
  choice: 병렬된 두 집단 또는 두 묘사로 읽힐 수 있게 반복 구조를 유지함
  alternative: ‘감사하며 하나님을 섬겨 온 사람들’로 하나의 집단으로 통합
  rationale: 영어 증언 본문의 반복되는 ‘among those’를 살려 원문의 가능한 병렬성과 강조를 성급히 해소하지 않았습니다.
- issue: 의에 가까이 감과 심판에 대한 두려움의 관계
  choice: 심판에 대한 두려움을 의를 좇는 동기로 표현함
  alternative: 심판을 두려워하는 동안 의에 가까이 가려 한다고 시간적 관계로 표현
  rationale: 제공된 두 영어 자료가 인과적 관계를 지지하지만, 직접 그리스어 검토가 남아 있어 단정적 교리 해석은 피했습니다.
- issue: 화자의 죄인 됨과 의 추구
  choice: 현재의 심각한 죄인 됨과 계속되는 의 추구를 함께 보존함
  alternative: 회개 이후의 상태로 완화하여 번역
  rationale: 본문의 신학적 긴장을 그대로 두고 화자의 자기평가를 약화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 합쇼체를 사용했습니다. 권면은 ‘-도록 합시다’, 자기 고백은 평서형 합쇼체로 옮겨 자연스럽고도 품위 있는 낭독 문체를 유지했습니다. 원문 언어 검토가 보류된 상태이므로 과도한 의역과 교리적 명료화를 피했습니다.
