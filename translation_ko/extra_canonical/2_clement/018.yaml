    text: 이 번역은 제공된 공공 영역 영어 증언 본문을 바탕으로 한 잠정 번역입니다. 그리스어 원문에 대한 직접 검토가 아직 필요합니다. 특히 ‘마귀의 계략들’, ‘의에 가까이 갈 수 있을 만큼’, 마지막 절에서 심판에 대한 두려움과 의의 추구가 맺는 관계는 원문 검토에 따라 조정될 수 있습니다.
