base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: ko
  text: '그러나 주께서 말씀하십니다. “어떤 종도 두 주인을 섬길 수 없다.” 우리가 하나님과 재물을 함께 섬기려 한다면, 그것은 우리에게 아무 유익도 없습니다.


    사람이 온 세상을 얻고도 자기 생명[a]을 잃는다면 무슨 유익이 있겠습니까?


    현세와 오는 세상은 서로 원수입니다.


    현세는 간음과 더러움과 탐욕과 속임을 말하지만, 오는 세상은 이런 것들과 작별하라고 합니다.


    그러므로 우리는 둘 모두와 벗이 될 수 없습니다. 하나와 작별하고 다른 하나와 사귀어야 합니다.


    여기에 있는 것들은 보잘것없고 잠시뿐이며 사라질 것이므로 미워하고, 저기에 있는 것들은 선하고 사라지지 않으므로 사랑하는 편이 더 낫다는 것을 생각합시다.


    우리가 그리스도의 뜻을 행하면 안식을 얻을 것입니다. 그러나 그렇게 하지 않고 그분의 계명에 불순종한다면, 아무것도 우리를 영원한 형벌에서 건져 내지 못할 것입니다.


    또한 성경은 에스겔서에서 이렇게 말합니다. “노아와 욥과 다니엘이 일어난다 해도, 사로잡혀 있는 자기 자녀들을 구해 내지 못할 것이다.”[b]


    이처럼 의로운 사람들조차 자기들의 의로운 행위로 자녀들을 구해 낼 수 없다면, 우리가 받은 세례를 깨끗하고 더럽힘 없이 지키지 않을 경우 무슨 확신으로 하나님의 나라에 들어가겠습니까? 또 우리에게 거룩하고 의로운 행위가 있음이 드러나지 않는다면, 누가 우리를 변호해 주겠습니까?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘생명’으로 옮긴 말은 문맥에 따라 ‘목숨’ 또는 ‘영혼’으로도 이해할 수 있습니다.
    reason: 원어 표현이 지닌 의미 범위를 하나로 고정하지 않기 위해서입니다.
  - marker: b
    text: 이 인용은 에스겔 14:14, 20을 떠올리게 하지만, 여기 전해진 문구는 오늘날의 에스겔서 본문과 정확히 같지 않습니다.
    reason: 저자가 전하는 성경 인용의 독특한 형태를 보존하면서 독자에게 본문 차이를 알리기 위해서입니다.
lexical_decisions:
- source_word: mammon
  choice: 재물
  rationale: 고유어처럼 음역하기보다 문맥상 하나님과 경쟁하는 부와 소유를 현대 독자가 즉시 이해하도록 ‘재물’로 옮겼습니다.
- source_word: soul (Greek source term likely ψυχή; direct review pending)
  choice: 생명
  rationale: 인용 전승에서 ‘목숨/생명’과 ‘영혼’의 뜻이 겹칠 수 있으므로 본문에는 자연스러운 ‘생명’을 두고 각주에서 의미 범위를 밝혔습니다.
- source_word: this age / the future
  choice: 현세 / 오는 세상
  rationale: 현재의 시대와 장차 올 시대를 대조하는 종말론적 구조를 분명히 하면서 현대 한국어로 자연스럽게 표현했습니다.
- source_word: keep our baptism pure and undefiled
  choice: 우리가 받은 세례를 깨끗하고 더럽힘 없이 지키다
  rationale: ‘세례’를 단순한 기억이나 신앙 일반으로 풀어 쓰지 않고, 원문 증언의 구체적인 표현과 윤리적 요청을 유지했습니다.
- source_word: advocate
  choice: 변호해 줄 사람
  rationale: 법정적 이미지를 살리되 특정한 교리적 중보자 해석을 본문에 덧붙이지 않았습니다.
theological_decisions:
- issue: 두 주인과 재물의 관계
  choice: 하나님과 재물을 함께 섬길 수 없다는 절대적 대조를 유지했습니다.
  alternative: 재물을 단지 ‘돈을 사랑하는 태도’로 한정해 의역할 수 있습니다.
  rationale: 본문은 태도만이 아니라 두 주인을 섬기는 행위 자체를 대조하므로 긴장을 완화하지 않았습니다.
- issue: 세례와 하나님 나라 입성의 관계
  choice: 세례를 깨끗하게 지키지 않을 경우 하나님 나라에 들어갈 확신이 없다는 조건문을 그대로 보존했습니다.
  alternative: 세례를 ‘신앙’이나 ‘세례 서약’으로 해석하여 완화할 수 있습니다.
  rationale: 그러한 해석은 특정 교리 체계를 본문에 주입할 수 있으므로, 본문의 성례적·윤리적 긴장을 해소하지 않았습니다.
- issue: 거룩하고 의로운 행위와 변호
  choice: 행위의 필요성을 말하는 수사적 질문을 그대로 유지했습니다.
  alternative: 행위를 믿음의 증거라고 명시하거나 구원의 공로가 아니라고 보충할 수 있습니다.
  rationale: 본문 자체가 그 관계를 체계적으로 설명하지 않으므로 어느 한 교파적 해석으로 확정하지 않았습니다.
- issue: 에스겔 인용의 형태
  choice: 제시된 증언의 ‘일어나다’, ‘사로잡혀 있는 자녀들’이라는 형태를 본문에 유지했습니다.
  alternative: 현대 에스겔서 본문에 맞추어 인용문을 교정할 수 있습니다.
  rationale: 이 문헌이 실제로 전하는 인용 형태를 보존하는 것이 우선이며, 차이는 각주에서 알렸습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면은 ‘생각합시다’, 수사적 질문은 ‘겠습니까?’로 옮겨 설교적 성격을 살렸습니다. 고어체와 교파 특유의 용어는 피했습니다. 제공 자료가 공용 영어 번역 증언에 근거하고 그리스어 직접 검토가 아직 보류 중이므로, 어휘 판단은 잠정적이며 출판 전 그리스어 사본 전통과 대조해야 합니다.
