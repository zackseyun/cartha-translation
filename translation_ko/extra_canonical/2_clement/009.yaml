base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/009.yaml
  text: 'Let none of you say that this flesh is not judged and does not rise again.


    Understand this: In what were you saved? In what did you recover your sight, if not in this flesh?


    Therefore, we ought to guard the flesh as a temple of God.


    For just as you were called in the flesh, you will also come in the flesh.


    If Christ the Lord, who saved us, was first spirit and then became flesh, and called us in that way, in the same way we also will receive our reward in this flesh.


    Therefore, let us love one another, so that we all may enter the kingdom of God.


    While we have time to be healed, let us place ourselves in the hands of God the physician, giving him something in return.


    What shall we give in return? Repentance from a sincere heart.


    For he discerns all things beforehand and knows what is in our hearts.


    Therefore, let us give him eternal praise, not only from our lips but also from our hearts, so that he may receive us as sons.


    For the Lord also said, “These are my brothers, those who do the will of my Father.”'
translation:
  language: ko
  text: '여러분 가운데 아무도 이 육신은 심판받지도 않고 다시 살아나지도 않는다고 말하지 마십시오.


    깨달으십시오. 여러분이 바로 이 육신 안에 있지 않았다면, 무엇 안에서 구원을 받았으며 무엇 안에서 다시 보게 되었겠습니까?


    그러므로 우리는 육신을 하나님의 성전으로 지켜야 합니다.


    여러분이 육신 안에서 부르심을 받은 것처럼, 육신 안에서 오게 될 것입니다.[a]


    우리를 구원하신 주 그리스도께서 처음에는 영이셨으나 육신이 되셔서 그렇게 우리를 부르셨다면, 우리도 이 육신 안에서 우리의 상을 받을 것입니다.


    그러므로 우리 모두가 하나님의 나라에 들어갈 수 있도록 서로 사랑합시다.


    치유받을 시간이 있는 동안, 의사이신 하나님의 손에 우리 자신을 맡기고 그분께 보답을 드립시다.


    어떤 보답입니까? 진실한 마음에서 나오는 회개입니다.


    그분은 모든 것을 미리 아시며 우리 마음속에 있는 것을 아십니다.


    그러므로 입술로만이 아니라 마음으로도 그분께 영원한 찬양을 드립시다. 그러면 그분이 우리를 아들로 받아 주실 것입니다.[b]


    주님께서도 “내 아버지의 뜻을 행하는 이들이 바로 내 형제들이다”라고 말씀하셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오게 될 것입니다’는 원문에도 목적지나 사건이 명시되어 있지 않습니다.
    reason: 심판, 부활, 하나님 나라 가운데 하나로 의미를 제한하지 않고 원문의 모호성을 보존합니다.
  - marker: b
    text: ‘아들’은 원문을 따른 표현이며, 문맥에서는 하나님께 받아들여지는 신자들을 집단적으로 가리킵니다.
    reason: 원문의 어휘를 보존하면서 현대 독자가 배타적 성별 표현으로 오해하지 않도록 설명합니다.
lexical_decisions:
- source_word: σάρξ
  choice: 육신
  rationale: 이 단락의 핵심인 현재의 몸과 그 부활의 연속성을 보존하면서도, 반복되는 신학적 논증이 자연스럽게 이어지게 했습니다.
- source_word: ἀνίσταται
  choice: 다시 살아나다
  rationale: 육신의 부활을 가리키는 문맥을 일반 독자가 분명히 이해할 수 있도록 옮겼습니다.
- source_word: ἀνεβλέψατε
  choice: 다시 보게 되다
  rationale: 문자적으로 시력을 회복한다는 뜻을 보존하여, 이것이 비유적 깨달음인지 실제 치유인지 단정하지 않았습니다.
- source_word: θεραπευθῆναι / τῷ θεραπεύοντι θεῷ
  choice: 치유받다 / 치료하시는 하나님
  rationale: 원문의 반복을 살리고, 영어 증언의 ‘의사이신 하나님’과 ‘그분의 손에’처럼 원문에 명시되지 않은 비유 요소는 덧붙이지 않았습니다.
- source_word: ἀντιμισθία
  choice: 보답
  rationale: 하나님께 값을 치른다는 거래적 인상보다, 이어지는 ‘진실한 마음의 회개’가 하나님께 드리는 응답이라는 의미를 전달합니다.
- source_word: μισθός
  choice: 상
  rationale: 종말론적 보응이라는 뜻을 간결하고 자연스럽게 나타냅니다.
theological_decisions:
- issue: 그리스도께서 ‘처음에는 영이셨으나 육신이 되셨다’는 진술
  choice: 원문의 순서와 긴장을 그대로 보존했습니다.
  alternative: 성육신에 관한 후대의 교리 용어로 풀어 설명할 수 있습니다.
  rationale: 본문이 말하는 범위를 넘어 특정 교리 체계로 해석하거나 완화하지 않기 위해서입니다.
- issue: 육신 안에서 ‘오게 될 것’의 목적지 또는 사건
  choice: 목적어를 보충하지 않고 ‘오게 될 것입니다’로 옮겼습니다.
  alternative: ‘심판대 앞에 나아갈 것입니다’ 또는 ‘하나님 나라에 들어갈 것입니다’로 구체화할 수 있습니다.
  rationale: 원문 자체가 목적지나 사건을 명시하지 않으므로 그 모호성을 보존했습니다.
- issue: υἱούς의 성별과 관계 표현
  choice: ‘아들로’
  alternative: ‘자녀로’
  rationale: 원문의 남성 복수 명사를 보존하되 한국어에서 집단적 신분을 자연스럽게 나타냈습니다. 문맥상 신자 전체를 가리킬 가능성은 각주로 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 권면은 ‘-합시다’, 금지는 ‘-지 마십시오’, 진술은 ‘-습니다’로 통일했습니다. 반복되는 ‘육신’을 의도적으로 유지하여 단락의 부활 논증이 드러나게 했습니다. 제공된 영어 증언을 대조 자료로 활용하되, 확인 가능한 그리스어 전승의 어휘와 구문을 우선하여 번역했습니다.
