  terminology: ‘육신’, ‘심판받다’, ‘다시 살아나다’, ‘상’, ‘회개’는 문맥상 적절합니다. 하나님을 ‘치료하시는 하나님’이라고만 하면 원문의 ‘의사’ 비유가 일반화되므로 ‘의사이신 하나님’으로 옮기는 편이 더 정확합니다.
