base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: ko
  text: '그러므로 그분께서 우리에게 이토록 큰 자비를 베푸셨음을 생각해 보십시오. 무엇보다도 살아 있는 우리는 이 죽은 신들에게 제물을 바치지도 않고 그들을 숭배하지도 않으며, 그분을 통하여 진리의 아버지를 알게 되었습니다. 그렇다면 그분을 아는 일이란, 우리가 그분을 알게 해 주신 이를 부인하지 않는 것 말고 무엇이겠습니까?


    그분께서 친히 말씀하십니다. “누구든지 나를 시인하면, 나도 아버지 앞에서 그를 시인하겠다.”[a]


    그러므로 우리가 구원받게 해 주신 그분을 참으로 시인한다면, 이것이 우리의 상입니다.


    그러면 우리는 무엇으로 그분을 시인합니까? 그분께서 말씀하신 것을 행하고 그분의 계명에 불순종하지 않으며, 입술로만 그분을 공경하지 않고 온 마음과 온 생각으로 그분을 공경함으로써 시인합니다.


    또한 그분께서는 이사야서에서 이렇게 말씀하십니다. “이 백성이 입술로는 나를 공경하지만, 그들의 마음은 내게서 멀리 떠나 있다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마태복음 10:32 및 누가복음 12:8과 비교하십시오. 인용문은 전승된 형태가 복음서 본문과 조금 다릅니다.
    reason: 예수 말씀의 인용 출처와 문구 차이를 알립니다.
  - marker: b
    text: 이사야 29:13과 비교하십시오. 이 문구는 신약성경의 인용 형태(마태복음 15:8; 마가복음 7:6)와도 가깝습니다.
    reason: 이사야 인용의 배경과 전승상의 연관성을 알립니다.
lexical_decisions:
- source_word: 'ὁμολογέω (영어 증언: confess)'
  choice: 시인하다
  rationale: 문맥상 단순한 고백을 넘어 그리스도께 대한 충성을 공개적으로 인정하고 부인하지 않는다는 뜻을 살리며, 뒤따르는 ‘부인하다’와의 대조도 보존했습니다.
- source_word: 'πατὴρ τῆς ἀληθείας (영어 증언: Father of truth)'
  choice: 진리의 아버지
  rationale: 속격 관계를 해석적으로 풀지 않고 원문의 신학적 표현과 가능한 의미의 폭을 보존했습니다.
- source_word: 'μισθός (영어 증언: reward)'
  choice: 상
  rationale: 행위의 대가라는 뜻을 과도하게 체계화하지 않으면서 문맥의 보상 개념을 자연스럽게 전달합니다.
- source_word: 'καρδία / διάνοια (영어 증언: heart / mind)'
  choice: 마음 / 생각
  rationale: 서로 구별되는 내적 차원을 나타내되 현대 한국어에서 이해하기 쉬운 표현을 택했습니다.
theological_decisions:
- issue: ‘시인함’과 구원의 관계
  choice: ‘구원받게 해 주신 그분을 참으로 시인한다면, 이것이 우리의 상입니다’로 조건적 진술을 그대로 보존했습니다.
  alternative: 시인하는 행위가 구원의 공로이거나 이미 받은 구원의 단순한 증거라고 명시하는 번역
  rationale: 본문은 구원, 시인, 상의 관계를 말하지만 이를 특정 구원론 체계로 명확히 규정하지 않으므로 긴장을 해소하지 않았습니다.
- issue: 대명사 ‘그분’의 지시 대상
  choice: 문맥상 하나님과 그리스도를 구별하되, 원문 증언의 반복되는 대명사가 지닌 연결성을 유지했습니다.
  alternative: 모든 대명사를 ‘예수 그리스도’ 또는 ‘하나님’으로 명시
  rationale: 필요 이상의 해석적 명시를 피하고, 독자가 문맥을 따라 지시 대상을 파악하도록 했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 고대 기독교 권면문의 엄숙함은 유지하되, ‘제사하다’보다 ‘제물을 바치다’, ‘명령’보다 종교 문맥에 익숙한 ‘계명’을 사용해 일반 독자의 이해를 도왔습니다. 제공 자료가 공공 영역 영어 증언이며 그리스어 직접 검토가 보류 중이므로, 어휘 관련 판단은 잠정적입니다.
