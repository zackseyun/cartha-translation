  - severity: low
    issue: ‘온 생각으로’의 직역적 어감
    rationale: 마음과 διάνοια의 구별은 유지해야 하나, ‘온 생각으로 공경하다’는 현대 한국어에서 다소 부자연스럽습니다. ‘온 마음과 온 정신을 다하여 공경하다’가 전인적 공경이라는 문맥을 더 자연스럽게 전달합니다.
