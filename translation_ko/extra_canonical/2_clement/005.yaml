    주님께서 말씀하십니다. “너희는 늑대들 가운데 있는 어린양들과 같을 것이다.”


    그러자 베드로가 주님께 대답하여 말했습니다. “그러면 늑대들이 어린양들을 찢으면 어떻게 됩니까?”


    예수께서 베드로에게 말씀하셨습니다. “어린양들은 죽은 뒤에 늑대들을 두려워하지 마십시오. 너희도 너희를 죽이고 그 밖에는 너희에게 아무것도 할 수 없는 자들을 두려워하지 마십시오. 오히려 너희가 죽은 뒤에 영혼과 몸을 불의 게헨나[a]에 던질 권세를 가지신 분을 두려워하십시오.”


    형제 여러분, 여러분도 알다시피 이 육신으로 이 세상에 나그네로 머무는 일은 보잘것없고 잠시뿐입니다. 그러나 그리스도의 약속은 크고 놀랍습니다. 곧 장차 올 나라의 안식과 영원한 생명입니다.


    그러면 우리가 이것들을 얻기 위해 할 수 있는 일이 무엇이겠습니까? 거룩함과 의로움 가운데 살아가고, 이 세상에 속한 것들을 우리에게 낯선 것으로 여기며, 그것들을 바라지 않는 것뿐입니다.


    우리가 그것들을 얻고자 하면 의로운 길에서 벗어나기 때문입니다.'
