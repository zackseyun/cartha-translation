review_pass:
  verdict: revise
  source_fidelity: 전반적으로 영어 증언의 논지와 구조를 충실히 따릅니다. 다만 베드로의 질문에서 ‘찢어 죽이면’은 영어 증언의 ‘tear’보다 죽음의 의미를 추가하므로 ‘찢으면’으로 고쳐야 합니다. 마지막 문장의 ‘차지하려고 탐내면’도 ‘desire to obtain’의 의미를 다소 중복·과장하므로 ‘얻고자 하면’이 더 정확합니다.
  naturalness: 현대 표준 한국어로 대체로 자연스럽지만, 인용문 안의 명령형이 서술적 ‘말아야 한다’와 비격식 명령형 ‘말라’로 섞여 있습니다. 대상 변이를 합쇼체로 통일하여 직접적인 권면으로 다듬었습니다. ‘이 세상에서 나그네로 머무는 삶’은 반복적이므로 ‘이 세상에서의 나그네살이’로 간결하게 했습니다.
  terminology: ‘게헨나’, ‘영혼과 몸’, ‘안식’, ‘영원한 생명’은 적절합니다. ἀδελφοί는 원문의 남성 복수 호칭에 대응하는 ‘형제 여러분’으로 옮겼습니다. 기존 각주의 ‘하나님의 최종 심판의 장소’라는 단정은 본문 자체의 지명·불의 표상을 넘어선 해설이므로, 지명 유래와 본문 표현을 설명하는 중립적 각주로 조정했습니다.
  issues:
  - severity: medium
    issue: ‘늑대들이 어린양들을 찢어 죽이면’
    rationale: 영어 증언은 ‘tear the lambs’라고만 하며, ‘죽이다’라는 결과를 명시하지 않습니다. 죽음의 함의를 본문에 추가하지 않도록 ‘찢으면’으로 수정합니다.
  - severity: medium
    issue: 인용문 명령형의 높임말·문체 혼용
    rationale: 번역의 목표 문체가 현대 formal-polite 합쇼체인데, ‘말아야 한다’, ‘말라’, ‘두려워하라’가 혼재합니다. 인용문도 ‘두려워하지 마십시오/두려워하십시오’로 통일합니다.
  - severity: low
    issue: ‘차지하려고 탐내면’의 중복적 해석
    rationale: ‘desire to obtain’은 얻기를 바라는 행위이며, ‘차지하다’와 ‘탐내다’를 함께 쓰면 소유욕을 중첩해 강화합니다. ‘그것들을 얻고자 하면’이 문맥상 충분합니다.
  - severity: low
    issue: 각주의 종말론적 단정
    rationale: 게헨나의 어원과 본문의 불 이미지 설명은 가능하나, ‘최종 심판의 장소’라는 해설은 이 짧은 본문이 직접 명시하는 범위를 넘습니다. 중립적으로 조정합니다.
