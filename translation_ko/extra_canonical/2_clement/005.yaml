  text: 'Therefore, brethren, let us forsake our sojourn in this world and do the will of Him who called us, and let us not be afraid to depart from this world.


    For the Lord says, “You shall be as lambs in the midst of wolves.”


    But Peter answered and said to Him, “What then, if the wolves should tear the lambs?”


    Jesus said to Peter, “Let not the lambs fear the wolves after they are dead; and you also, do not fear those who kill you and are not able to do anything to you; but fear Him who, after you are dead, has power over soul and body to cast them into the Gehenna of fire.”


    And you know, brethren, that the sojourn of this flesh in this world is mean and for a short time, but the promise of Christ is great and marvelous, even the rest of the kingdom that shall be and of life eternal.


    What then can we do to obtain them, but walk in holiness and righteousness, consider these worldly things as alien to us, and not desire them?


    For when we desire to obtain these things, we fall away from the righteous path.'
translation:
  language: ko
  text: '그러므로 형제 여러분, 우리는 이 세상에서의 나그네살이를 버리고 우리를 부르신 분의 뜻을 행합시다. 그리고 이 세상을 떠나는 것을 두려워하지 맙시다.


    주님께서 말씀하십니다. “너희는 늑대들 가운데 있는 어린양들과 같을 것이다.”


    그러자 베드로가 주님께 대답하여 말했습니다. “그러면 늑대들이 어린양들을 찢으면 어떻게 됩니까?”


    예수께서 베드로에게 말씀하셨습니다. “어린양들은 죽은 뒤에 늑대들을 두려워하지 마십시오. 너희도 너희를 죽이고 그 밖에는 너희에게 아무것도 할 수 없는 자들을 두려워하지 마십시오. 오히려 너희가 죽은 뒤에 영혼과 몸을 불의 게헨나[a]에 던질 권세를 가지신 분을 두려워하십시오.”


    형제 여러분, 여러분도 알다시피 이 육신으로 이 세상에 나그네로 머무는 일은 보잘것없고 잠시뿐입니다. 그러나 그리스도의 약속은 크고 놀랍습니다. 곧 장차 올 나라의 안식과 영원한 생명입니다.


    그러면 우리가 이것들을 얻기 위해 할 수 있는 일이 무엇이겠습니까? 거룩함과 의로움 가운데 살아가고, 이 세상에 속한 것들을 우리에게 낯선 것으로 여기며, 그것들을 바라지 않는 것뿐입니다.


    우리가 그것들을 얻고자 하면 의로운 길에서 벗어나기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게헨나는 ‘힌놈 골짜기’에서 유래한 이름입니다. 본문은 이를 ‘불의 게헨나’라고 부릅니다.
    reason: 원문의 지명과 불의 표상을 보존하면서, 본문이 직접 말하는 범위를 넘는 교리적 설명은 피하기 위해서입니다.
lexical_decisions:
- source_word: παροικία
  choice: 나그네로 머무는 삶
  rationale: 일시적으로 타향에 거주한다는 뜻을 살리면서 현대 한국어 독자가 자연스럽게 이해하도록 옮겼습니다.
- source_word: ἄρνες
  choice: 어린양들
  rationale: 비유의 연약함과 원문의 복수형을 보존했습니다.
- source_word: γέεννα πυρός
  choice: 불의 게헨나
  rationale: 고유한 지명을 일반적인 ‘지옥’으로 평준화하지 않고 원문의 장소명과 불의 심상을 함께 보존했습니다.
- source_word: μικρά ... καὶ ὀλιγοχρόνιος
  choice: 보잘것없고 잠시뿐
  rationale: 현세 육신의 체류가 미미하고 짧다는 두 의미를 구별해 반영했습니다.
- source_word: ἀνάπαυσις
  choice: 안식
  rationale: 단순한 휴식보다 종말론적 약속의 뉘앙스를 지닌 말로 옮겼습니다.
- source_word: τὰ κοσμικὰ
  choice: 이 세상에 속한 것들
  rationale: 물질만으로 범위를 좁히지 않고 세상적인 것 전반을 가리키는 표현으로 번역했습니다.
theological_decisions:
- issue: 죽음 이후 두려움과 심판 권세의 표현
  choice: ‘죽은 뒤’라는 시간 표현과 영혼과 몸 모두에 대한 권세를 그대로 유지했습니다.
  alternative: 죽음 뒤에는 박해자가 해칠 수 없다는 뜻으로 풀어 쓰거나 영혼만의 심판으로 조정할 수 있습니다.
  rationale: 본문의 긴장과 인간 구성에 관한 표현을 특정 교리 체계에 맞추어 해소하지 않았습니다.
- issue: ‘그리스도의 약속’과 왕국의 안식 및 영원한 생명의 관계
  choice: ‘곧 장차 올 왕국의 안식과 영원한 생명’으로 병렬 관계를 유지했습니다.
  alternative: 약속을 오직 왕국의 안식으로 한정하거나 영원한 생명을 안식의 수식어로 처리할 수 있습니다.
  rationale: 문법적 결합의 여지를 지나치게 좁히지 않으면서 한국어로 읽히는 구조를 택했습니다.
- issue: 인용된 주님의 말씀의 정경 복음서와의 관계
  choice: 본문이 제시하는 대로 예수와 베드로의 대화로 번역했습니다.
  alternative: 현존 복음서의 유사 구절에 맞추어 표현을 바꿀 수 있습니다.
  rationale: 저자가 전하는 인용의 독자적 형태를 정경 복음서 문구로 동화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 공동체를 향한 ἀδελφοί는 포괄적 호칭인 ‘형제자매 여러분’으로 옮겼고, 권면에서는 ‘합시다’, 직접 인용의 명령에서는 문맥에 맞게 ‘-라’를 사용했습니다. 제공 자료가 영어 공공영역 증언을 중심으로 하며 그리스어 직접 검토가 보류되었다는 한계를 감안해, 불확실한 부분은 과도하게 해석하지 않았습니다.
