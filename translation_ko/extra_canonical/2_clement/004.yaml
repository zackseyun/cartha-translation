  source_fidelity: 대체로 영어 증언의 논지와 권면 목록을 충실히 옮겼습니다. 그러나 ‘if ye do these things’를 ‘이런 일을 행하더라도’로 옮긴 것은 양보 조건으로 바꾸어 원문의 조건을 훼손합니다. 또한 ‘not ... men but God’은 비교급보다 배타적 대조로 번역하는 편이 정확합니다.
  naturalness: 현대 표준 한국어 합쇼체로 전반적으로 자연스럽습니다. 다만 ‘그와 반대되는 행실로는 하지 맙시다’는 무엇을 하지 말라는지 목적어가 빠져 부자연스럽고, ‘내쫓으며’는 직접화법에 이어지는 동작을 연결할 때 ‘내쫓고’가 더 매끄럽습니다.
  terminology: ‘주님’, ‘의를 행하다’, ‘간음’, ‘절제’, ‘자비’, ‘탐욕’, ‘불법을 행하는 자들’은 문맥과 성서적 어법에 적절합니다. ‘형제자매 여러분’은 공동체 전체에 대한 호칭으로 자연스럽습니다. 인용문에 대한 각주는 정경 구절과의 관계 및 전승의 불확실성을 과도하게 단정하지 않고 잘 처리합니다.
