base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: ko
  text: '그러므로 우리는 그분을 주님이라고 부르기만 해서는 안 됩니다. 그것만으로는 우리를 구원하지 못하기 때문입니다.


    그분께서 이렇게 말씀하십니다. “나에게 ‘주님’이라고 말하는 사람이 모두 구원받는 것은 아니며, 의를 행하는 사람이 구원받을 것이다.”[a]


    그러므로 형제자매 여러분, 우리는 행실로 그분을 고백합시다. 곧 서로 사랑하고, 간음하지 않으며, 서로 헐뜯거나 시기하지 말고, 절제하며 자비롭고 친절하게 행동합시다. 또한 서로 아픔을 함께 느끼며 탐욕을 부리지 말아야 합니다. 이와 같은 행실로 그분을 고백하고, 그와 반대되는 행실로는 하지 맙시다.


    우리는 사람보다 하나님을 더 두려워해야 합니다.


    그러므로 여러분이 이런 일을 행하더라도, 주님께서는 이렇게 말씀하셨습니다. “너희가 내 품 안에서 나와 함께 모여 있을지라도 내 계명들을 지키지 않으면, 나는 너희를 내쫓으며 이렇게 말할 것이다. ‘내게서 떠나가라. 나는 너희가 어디에서 왔는지 알지 못한다. 불법을 행하는 자들아.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마태복음 7:21과 유사한 주님의 말씀입니다. 이 문헌의 표현은 정경 본문의 정확한 인용이라기보다 초기 전승의 형태를 반영할 수 있습니다.
    reason: 독자가 인용의 배경과 표현 차이를 이해하도록 돕기 위해서입니다.
  - marker: b
    text: 이 말씀은 마태복음 7:23, 누가복음 13:25–27과 유사한 요소들을 결합한 형태입니다. ‘내 품 안에서 나와 함께 모여 있다’는 표현의 정확한 전승 배경은 불확실합니다.
    reason: 복합 인용 가능성과 전승상의 모호성을 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: 'Lord (Greek: κύριος, presumed)'
  choice: 주님
  rationale: 그리스도에 대한 호칭으로 자연스럽고 존중을 담은 표준 한국어 표현입니다.
- source_word: doeth righteousness (Greek wording pending review)
  choice: 의를 행하다
  rationale: 윤리적 실천을 뜻하는 표현을 교리적으로 확대하지 않고, 원문 증언의 ‘행하다’와 ‘의’의 결합을 보존했습니다.
- source_word: confess Him in our works
  choice: 행실로 그분을 고백하다
  rationale: 말뿐인 호칭과 실제 삶의 대조를 유지하면서 ‘works’를 문맥상 자연스러운 ‘행실’로 옮겼습니다.
- source_word: temperate
  choice: 절제하다
  rationale: 자기 통제와 절제의 윤리적 의미를 간결하게 전달합니다.
- source_word: have fellow-feeling
  choice: 서로 아픔을 함께 느끼다
  rationale: 단순한 동정 이상으로 서로의 처지를 함께 느낀다는 뜻을 일상적으로 이해하기 쉽게 표현했습니다.
- source_word: covetous
  choice: 탐욕을 부리다
  rationale: 재물이나 소유를 지나치게 탐하는 태도를 자연스러운 현대 한국어로 나타냈습니다.
- source_word: workers of iniquity
  choice: 불법을 행하는 자들
  rationale: 성경적 인용 어법을 살리면서 행위의 지속적 성격을 보존했습니다.
theological_decisions:
- issue: 주님을 부르는 것과 구원의 관계
  choice: “그것만으로는 우리를 구원하지 못한다”로 번역
  alternative: “그분은 우리를 구원하지 않으실 것이다”
  rationale: 지시어 ‘this’가 주님이라고 부르기만 하는 행위를 가리킨다는 문맥을 분명히 하되, 행위 구원이나 신앙·행위 관계에 관한 특정 교파의 체계를 덧붙이지 않았습니다.
- issue: ‘의를 행하는 사람’의 구원 진술
  choice: 조건적 진술을 그대로 보존
  alternative: 칭의 또는 성화의 결과로 해설하여 번역
  rationale: 본문이 제시하는 윤리적 긴장과 직접적 권면을 해설로 완화하거나 교리적으로 재구성하지 않았습니다.
- issue: 마지막 주님 말씀의 조건 구조
  choice: “이런 일을 행하더라도 … 계명들을 지키지 않으면”으로 연결
  alternative: 첫 조건을 인용문 밖의 구원 조건으로 분리
  rationale: 전승 문장의 다소 긴장된 논리를 유지하면서, 외적 공동체 결속이나 일부 선행보다 계명 준수가 중요하다는 문맥을 드러냈습니다.
- issue: ‘내 품 안에서’의 의미
  choice: 공간적·관계적 은유를 그대로 유지
  alternative: “내 곁에” 또는 “내 교회 안에”로 해석
  rationale: 표현의 진정한 모호성과 친밀성의 이미지를 보존하고 교회론적 의미를 임의로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 직접적인 그리스어 대조가 아직 이루어지지 않았으므로, 특히 인용문의 조건 구조와 ‘내 품 안에서’에 해당하는 표현은 그리스어 원문 검토 뒤 재확인해야 합니다. 권면의 장중함을 유지하되 일반 독자가 이해할 수 있도록 문장을 다듬었고, ‘brethren’은 공동체 전체를 포괄하는 자연스러운 표현인 ‘형제자매 여러분’으로 옮겼습니다.
