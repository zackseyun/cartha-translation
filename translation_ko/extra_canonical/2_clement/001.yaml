base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: ko
  text: '형제자매 여러분, 우리는 예수 그리스도를 하나님으로, 곧 산 사람과 죽은 사람의 심판자로 여겨야 합니다.


    또 우리는 우리의 구원을 하찮게 여겨서는 안 됩니다. 우리가 그분을 하찮게 여기면 받을 것도 하찮으리라고 기대하기 때문입니다.[a] 이 일을 하찮은 일인 듯 듣는 사람들도 죄를 짓고 있으며, 우리도 죄를 짓고 있습니다. 우리가 어디에서 불림을 받았는지, 누구에게 불림을 받았는지, 어느 곳으로 불림을 받았는지, 또 예수 그리스도께서 우리를 위하여 얼마나 많은 고난을 견디셨는지 알지 못하기 때문입니다.


    그러면 우리가 그분께 무엇으로 보답하겠습니까? 그분이 우리에게 주신 선물에 합당한 어떤 열매를 맺겠습니까? 우리가 그분께 얼마나 많은 거룩한 의무를 빚지고 있습니까![b]


    그분은 우리에게 빛을 선물로 주셨고, 아버지가 자녀를 부르듯 우리를 자녀라 불러 주셨으며,[c] 멸망해 가던 우리를 구원하셨습니다.


    그러면 우리가 그분께 어떤 찬양을 드리겠습니까? 우리가 받은 것들에 대하여 무엇으로 보답하겠습니까?


    우리는 생각하는 능력이 불구가 된 채, 돌과 나무와 금과 은과 청동, 곧 사람이 만든 것들을 숭배했습니다. 우리의 온 삶은 죽음이나 다름없었습니다. 그렇게 어둠에 휩싸이고 시야가 짙은 안개로 가득했던 우리가 다시 보게 되었습니다. 그분의 뜻으로 우리를 둘러싼 구름을 벗어 버린 것입니다.


    그분은 우리를 불쌍히 여기시고 가엾게 여기셔서 구원하셨습니다. 우리 안에 심한 미혹과 멸망을 보셨기 때문입니다. 우리에게는 그분에게서 오는 희망 말고는 구원받을 희망이 전혀 없었습니다.


    그분은 존재하지 않던 우리를 부르셨고, 존재하지 않던 상태에서 우리가 존재하게 되기를 뜻하셨습니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 먼저 ‘우리의 구원’을 하찮게 여기지 말라고 한 뒤, 곧이어 ‘그분’을 하찮게 여긴다고 표현합니다. ‘그분’은 예수 그리스도를 가리키는 것으로 보이지만, 두 표현의 긴밀한 연결을 그대로 살렸습니다.
    reason: 대명사의 지시 대상과 구원-구원자 사이의 원문상 전환을 보존하기 위해서입니다.
  - marker: b
    text: ‘거룩한 의무’로 옮긴 그리스어는 하나님께 합당하게 드려야 할 거룩하고 경건한 행위들을 뜻할 수 있습니다. 일부 번역은 이를 ‘자비’ 또는 ‘은혜’로 이해합니다.
    reason: 희귀하고 문맥상 난해한 어휘 ὅσια의 번역 가능성을 알리기 위해서입니다.
  - marker: c
    text: 직역하면 ‘아버지처럼 우리를 아들들이라고 불러 주셨으며’입니다. 여기서는 공동체 전체를 포괄하는 자연스러운 한국어로 ‘자녀’라 옮겼습니다.
    reason: 원문의 부자 이미지를 밝히면서 한국어에서 남성만을 지칭하는 것으로 오해되지 않게 하기 위해서입니다.
  - marker: d
    text: 이 표현은 하나님께서 존재하지 않던 것을 존재하게 하시는 창조를 떠올리게 할 수도 있고, 하나님의 백성이 아니던 이들을 불러 새 백성으로 삼으신다는 뜻일 수도 있습니다. 본문은 어느 한 해석으로 한정하지 않습니다.
    reason: 원문의 의도적인 존재론적·구원론적 중의성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: φρονεῖν περὶ
  choice: …로 여기다 / …을 하찮게 여기다
  rationale: 단순히 생각한다는 뜻보다 대상에 대한 판단과 태도를 나타내므로, 문맥에 따라 ‘여기다’로 옮겼습니다. 반복되는 μικρὰ φρονεῖν의 연결도 유지했습니다.
- source_word: κριτοῦ ζώντων καὶ νεκρῶν
  choice: 산 사람과 죽은 사람의 심판자
  rationale: 초기 그리스도교의 정형적 표현을 자연스러운 현대 한국어로 보존했습니다.
- source_word: ἀντιμισθία
  choice: 보답
  rationale: 받은 은혜에 대응하여 돌려드리는 것을 가리키지만 거래적 대가라는 인상을 피하도록 ‘보답’으로 옮겼습니다.
- source_word: ὅσια
  choice: 거룩한 의무
  rationale: ‘자비’가 아니라 하나님께 마땅히 드려야 할 경건하고 거룩한 행위를 가리키는 말로 이해했습니다. 문구의 난해함은 각주로 밝혔습니다.
- source_word: πλάνον καὶ ἀπώλειαν
  choice: 미혹과 멸망
  rationale: πλάνος가 여기서는 방황이나 오류의 상태를 나타내며, ἀπώλεια와 함께 영적 위기를 표현하므로 전통성과 가독성을 함께 고려했습니다.
- source_word: οὐκ ὄντας / ἐκ μὴ ὄντος εἶναι
  choice: 존재하지 않던 우리 / 존재하지 않던 상태에서 존재하다
  rationale: 존재에 관한 원문의 대조를 해석으로 좁히지 않고 그대로 드러냈습니다.
theological_decisions:
- issue: 예수 그리스도와 하나님의 관계
  choice: “예수 그리스도를 하나님으로”
  alternative: “예수 그리스도를 하나님에 관하여 생각하듯이”
  rationale: ὡς περὶ θεοῦ는 그리스도를 하나님으로 여겨야 한다는 직접적인 진술로 읽히며, 원문의 높은 그리스도론을 완화하거나 교리적으로 확장하지 않았습니다.
- issue: ‘구원’과 ‘그분’ 사이의 지시 관계
  choice: 구원을 하찮게 여기는 것과 그분을 하찮게 여기는 것을 연속하여 보존
  alternative: 둘을 모두 ‘구원’ 또는 모두 ‘그리스도’로 통일
  rationale: 원문은 τῆς σωτηρίας에서 περὶ αὐτοῦ로 전환합니다. 이를 교정하지 않고 신학적 긴장을 유지했습니다.
- issue: ‘존재하지 않던 우리’의 의미
  choice: 존재론적 표현을 본문에 유지
  alternative: 이방인으로서 하나님의 백성이 아니었던 상태로 명시
  rationale: 문맥상 하나님의 백성이 아니던 이들의 부르심을 가리킬 수 있으나, 창조 또는 회심의 언어로도 들릴 수 있으므로 특정 해석으로 제한하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용하되, 설교적 권면과 수사적 질문의 장중함을 유지했습니다. ἀδελφοί는 혼성 공동체를 향한 호칭으로 보아 ‘형제자매 여러분’으로 자연화했습니다. 신적 지시 대명사는 ‘그분’으로 통일했고, 지나치게 고어적인 표현은 피했습니다.
