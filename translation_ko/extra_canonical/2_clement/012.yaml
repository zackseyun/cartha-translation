base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/012.yaml
  text: 'Therefore let us await the kingdom of God betimes in love and righteousness, since we do not know the day of God’s appearing.


    For the Lord himself, being asked by a certain person when his kingdom would come, said, “When the two shall be one, and the outside as the inside, and the male with the female, neither male nor female.”


    Now the two are one when we speak truth among ourselves, and in two bodies there shall be one soul, without dissimulation.


    And by the outside as the inside he means this: by the inside he means the soul, and by the outside the body. Therefore, in like manner as the body appears, so also let your soul be manifest by its good works.


    And by the male with the female, neither male nor female, he means this: that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should have no thought of him as a male.


    “These things, if you do,” he says, “the kingdom of my Father shall come.”'
translation:
  language: ko
  text: '그러므로 우리는 하나님의 나타나실 날을 알지 못하므로, 사랑과 의 가운데서 하나님의 나라를 일찍부터 기다립시다.


    주님께서 친히 어떤 사람에게 그분의 나라가 언제 오겠느냐는 질문을 받으시고 이렇게 말씀하셨습니다. “둘이 하나가 되고, 바깥이 안과 같아지며, 남자와 여자가 남자도 여자도 아니게 될 때이다.”[a]


    둘이 하나가 된다는 것은 우리가 서로 진실을 말하고, 두 몸에 거짓 없는 한 영혼이 있을 때를 뜻합니다.


    바깥이 안과 같아진다는 말씀의 뜻은 이렇습니다. 안은 영혼을, 바깥은 몸을 뜻합니다. 그러므로 몸이 드러나듯이, 여러분의 영혼도 선한 행실로 드러나게 하십시오.


    남자와 여자가 남자도 여자도 아니게 된다는 말씀의 뜻은 이렇습니다. 형제가 자매를 볼 때 그녀를 여자로 여기는 생각을 품지 않고, 자매가 형제를 볼 때 그를 남자로 여기는 생각을 품지 않는 것입니다.[b]


    그분께서 말씀하십니다. “너희가 이 일들을 행하면 내 아버지의 나라가 올 것이다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 말씀은 정경 복음서에 같은 형태로 전해지지 않습니다. 유사한 전승이 다른 초기 그리스도교 문헌에도 나타납니다. 여기서는 이 문헌에 전해진 독특한 표현을 그대로 살렸습니다.
    reason: 독자가 낯선 인용을 정경 복음서의 직접 인용으로 오해하지 않도록 문헌적 성격을 알립니다.
  - marker: b
    text: 이 대목은 남녀의 존재 자체를 부정한다기보다, 이어지는 저자의 설명에 따르면 형제자매를 성적 대상으로 바라보지 않는 태도를 가리킵니다.
    reason: 난해한 표현을 저자 자신의 해설 범위 안에서 이해하도록 돕습니다.
lexical_decisions:
- source_word: betimes
  choice: 일찍부터
  rationale: 공개 영역 영어 증언의 고어적 의미인 ‘일찍, 때맞추어’를 살리되, 문맥상 하나님의 나라를 미리부터 깨어 기다린다는 뜻으로 자연스럽게 옮겼습니다.
- source_word: appearing
  choice: 나타나실 날
  rationale: ‘오심’으로 단정하여 재림 교리를 본문에 덧씌우지 않고, 증언이 보존한 ‘나타남’의 의미를 유지했습니다.
- source_word: without dissimulation
  choice: 거짓 없는
  rationale: 위선이나 가장이 없는 진실한 일치를 평이하고 직접적으로 표현했습니다.
- source_word: soul
  choice: 영혼
  rationale: 몸과 대조되는 내적 존재를 가리키는 전통적이며 일반 독자에게 익숙한 표현을 사용했습니다.
theological_decisions:
- issue: ‘둘이 하나’, ‘바깥과 안’, ‘남자와 여자’라는 비정경적 주님 말씀의 해석
  choice: 본문 자체의 인용과 이어지는 저자의 해설을 그대로 구분하여 보존했습니다.
  alternative: 공관복음이나 바울 서신의 유사 구절에 맞추어 조화시키는 번역
  rationale: 이 문헌 특유의 표현과 신학적 긴장을 번역자가 임의로 해소하지 않기 위해서입니다.
- issue: ‘남자도 여자도 아니게’의 의미
  choice: 저자의 설명대로 서로를 성적 대상으로 여기지 않는 태도를 나타내도록 번역했습니다.
  alternative: 성별 자체의 폐지 또는 사회적 역할의 동일화로 명시하는 번역
  rationale: 증언이 제시하는 해설의 범위를 넘어 특정 교리나 현대적 논쟁을 본문에 투사하지 않았습니다.
- issue: 마지막 문장의 화자
  choice: 문맥에 따라 ‘주님께서 말씀하십니다’라고 밝혔습니다.
  alternative: 단순히 ‘그가 말합니다’로 옮겨 지시 대상을 열어 두는 번역
  rationale: 앞선 직접 인용의 화자가 주님이라는 문맥을 자연스러운 한국어로 분명히 하되, 인용 내용은 그대로 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 ‘기다립시다’, ‘드러나게 하십시오’로 품위 있고 이해하기 쉽게 처리했으며, 직접 인용은 고풍스럽게 만들지 않고도 엄숙함을 유지했습니다. 다만 제공된 자료가 영어 증언이며 그리스어 원문 대조가 보류된 상태이므로, ‘일찍부터’와 세 병렬 어구의 세부 문법은 추후 그리스어 사본 전통에 따른 검토가 필요합니다.
