base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: ko
  text: '그러므로 나의 형제자매 여러분, 우리를 부르신 아버지의 뜻을 행하여 생명을 얻읍시다. 악덕은 우리 죄의 길잡이이므로 버리고, 오히려 덕을 힘써 추구합시다. 불경건에서 달아나, 악한 일들이 우리를 덮치지 못하게 합시다.


    우리가 선을 행하는 데 힘쓰면, 평화가 우리를 뒤따를 것입니다.


    그러나 사람들은 장차 올 약속보다 이 세상에서 누리는 즐거움을 더 좋아하여 인간적인 두려움을 불러들입니다. 이 때문에 사람은 행복에 이를 수 없습니다.[a]


    그들은 이 세상에서 누리는 즐거움이 얼마나 큰 고통을 가져오는지, 장차 올 약속이 얼마나 큰 기쁨을 가져오는지 알지 못합니다.


    그들이 참으로 이런 일을 자기들끼리만 하고 있다면 그나마 참을 만했을 것입니다. 그러나 이제 그들은 순진한 영혼들에게 계속 악을 가르치면서, 자기들과 자기들의 말을 듣는 이들이 받을 정죄가 갑절이 되리라는 것을 알지 못합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장의 고대 본문과 문장 구조는 이해하기 어렵습니다. ‘행복에 이를 수 없습니다’는 ‘좋은 것을 찾을 수 없습니다’ 또는 앞 문장의 ‘평화를 찾을 수 없습니다’라는 뜻일 가능성도 있습니다. 여기서는 전승된 번역 증거의 흐름을 따랐습니다.
    reason: 제공된 자료는 그리스어 본문을 직접 대조한 것이 아니라 공용 영역 영어 번역 증거를 토대로 하며, 해당 문장은 특히 구문과 지시 관계가 불분명하므로 불확실성을 독자에게 알립니다.
lexical_decisions:
- source_word: ἀρετή (virtue)
  choice: 덕
  rationale: 도덕적 탁월함과 선한 품성을 함께 가리키는 말로, 문맥상 반대어인 ‘악덕’과 자연스럽게 대응합니다.
- source_word: κακία (vice/wickedness)
  choice: 악덕
  rationale: 단순한 개별 악행보다 죄로 앞서 이끄는 악한 성향을 나타내므로 ‘악덕’으로 옮겼습니다.
- source_word: πρόδρομος (forerunner)
  choice: 길잡이
  rationale: 앞서 가며 뒤따르는 것을 이끈다는 비유를 자연스러운 한국어로 전달하면서, 악덕이 죄에 선행한다는 관계를 보존합니다.
- source_word: ἀσέβεια (ungodliness)
  choice: 불경건
  rationale: 하나님을 향한 경외와 올바른 태도의 결여라는 종교적 의미를 보존합니다.
- source_word: εἰρήνη (peace)
  choice: 평화
  rationale: 선을 행하는 사람을 인격화하여 뒤따르는 대상으로 제시한 표현을 그대로 살렸습니다.
- source_word: ἀπόλαυσις (enjoyment)
  choice: 누리는 즐거움
  rationale: 현재의 향락이나 만족을 뜻하되 문맥에 없는 과도한 도덕적 판단을 덧붙이지 않습니다.
- source_word: ἐπαγγελία (promise)
  choice: 약속
  rationale: 장차 성취될 하나님의 약속이라는 종말론적 함의를 해설로 확정하지 않고 원문의 표현을 유지합니다.
theological_decisions:
- issue: ‘살기 위하여’가 가리키는 생명의 성격
  choice: ‘생명을 얻읍시다’
  alternative: ‘살아갑시다’
  rationale: 단순한 현세적 생활보다 부르심과 순종에 연결된 생명을 암시하지만, 영생으로 명시하여 의미를 좁히지는 않았습니다.
- issue: 선행과 평화의 관계
  choice: ‘평화가 우리를 뒤따를 것입니다’
  alternative: ‘우리가 평화를 얻게 될 것입니다’
  rationale: 원문의 인격화와 역설적인 추격 이미지를 보존하고, 이를 기계적인 공로-보상 관계로 풀어 쓰지 않았습니다.
- issue: 갑절의 정죄를 받는 대상
  choice: ‘자기들과 자기들의 말을 듣는 이들이 받을 정죄가 갑절’
  alternative: ‘자기들은 가르친 죄와 행한 죄로 이중 정죄’
  rationale: 본문은 자신들과 청자들을 함께 언급하므로, 갑절의 정확한 산정 방식을 교리적으로 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 공동체를 향한 권면은 ‘-읍시다’, 교훈적 진술은 ‘-습니다’로 통일했습니다. ‘brethren’은 현대 독자가 성별을 포괄하는 공동체 호칭으로 이해하도록 ‘형제자매 여러분’으로 옮겼습니다. 문체는 장중함을 유지하되 고어체를 피했습니다. 제공된 원자료가 그리스어 직접 검토 전의 영어 증거이므로, 특히 3단락의 난해한 구문은 각주로 투명하게 표시했습니다.
