    issue: ‘부활의 썩지 않는 열매’
    rationale: 제시된 어휘는 ἀθάνατος(불멸의)입니다. ‘썩지 않는’은 보통 ἄφθαρτος 계열에 더 가까우므로 ‘불멸의 열매’로 고치는 것이 정확합니다.
  - severity: medium
    issue: ‘여러분 자신에게 구원과 생명을 마련하는 것’
    rationale: 영어 증언의 ‘give salvation and life to yourselves’ 및 능동적 표현을 ‘마련하다’가 완화합니다. ‘스스로에게 ... 주는 것’이 더 직접적입니다.
  - severity: medium
    issue: 마지막 문장의 ‘위에서 우리 조상들과 함께 다시 살아나’
    rationale: ‘위에서’의 수식 범위와 장소 의미가 한국어에서 불명확합니다. 원문의 상방/천상 표현을 각주로 유보하면서 본문은 ‘하늘에서’로 자연스럽게 옮길 수 있습니다.
  - severity: low
    issue: ‘경건과 하나님의 선하심을 힘써 추구하려는’
    rationale: 영어 증언은 ‘study ... labor’이며, ‘추구’는 연구·공부의 대상을 실천적으로 좇는 뜻으로 이동시킬 수 있습니다. ‘배우는 일에 수고하려는’이 더 가깝습니다.
