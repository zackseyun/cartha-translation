base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: ko
  text: '## 클레멘스2서 19장


    그러므로 형제자매 여러분, 진리의 하나님의 말씀을 들은 뒤에[a] 나는 여러분에게 이 권면을 읽어 드립니다. 이는 여러분이 기록된 말씀에 주의를 기울여, 여러분 자신과 여러분 가운데서 이를 읽는 사람을 모두 구원받게 하려는 것입니다. 내가 여러분에게 보답으로 바라는 것은, 온 마음으로 회개하여 여러분 자신에게 구원과 생명을 마련하는 것입니다. 우리가 이렇게 하면, 경건과 하나님의 선하심을 힘써 추구하려는 모든 젊은이에게 목표를 세워 주게 될 것입니다.


    누가 우리를 타일러 불의에서 돌이켜 의로 향하게 할 때, 어리석은 우리는 불쾌해하거나 분개하지 맙시다. 우리 가슴속에 있는 두 마음과 믿음 없음 때문에, 우리는 때때로 악한 일을 하면서도 그것을 깨닫지 못합니다. 헛된 욕망이 우리의 생각을 어둡게 하기 때문입니다.


    그러므로 끝까지 구원받도록 의를 실천합시다. 이 명령들에 순종하는 사람들은 복이 있습니다. 이 세상에서 잠시 고난을 겪더라도, 그들은 부활의 썩지 않는 열매를 거둘 것입니다.


    그러므로 경건한 사람은 지금 이 시대에 고생하더라도 슬퍼하지 마십시오. 복된 때가 그를 기다리고 있습니다. 그는 위에서[b] 우리 조상들과 함께 다시 살아나, 슬픔 없는 영원 속에서 기뻐할 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 그리스어 표현은 축약되어 있어 뜻이 분명하지 않습니다. ‘진리의 하나님에 관한 말씀 다음으로’ 또는 ‘진리의 하나님께서 말씀하신 뒤에’라는 뜻으로도 이해할 수 있습니다.
    reason: 도입부의 ‘진리의 하나님 다음에/뒤에’라는 표현에는 생략된 말이 있는 듯하며, 전승 번역도 이를 서로 다르게 보충합니다.
  - marker: b
    text: ‘위에서’는 하늘을 가리키는 표현일 수 있습니다.
    reason: 원문은 ‘하늘’이라는 명사를 직접 쓰지 않고 ‘위에서/위로’를 뜻하는 말을 사용합니다.
lexical_decisions:
- source_word: ἔντευξις
  choice: 권면
  rationale: 문맥상 회중에게 읽어 주며 회개와 의로운 삶을 촉구하는 담화이므로, 일반적인 ‘청원’보다 ‘권면’이 적합합니다.
- source_word: διψυχία
  choice: 두 마음
  rationale: 서로 갈리는 충성과 내적 동요를 나타내는 표현의 비유를 보존하고, 이를 단순히 ‘의심’으로 축소하지 않았습니다.
- source_word: σκοπός
  choice: 목표
  rationale: 본보기라는 함의도 가능하지만, 원문의 기본적인 ‘목표·지향점’을 유지했습니다.
- source_word: προστάγματα
  choice: 명령들
  rationale: 권고보다 강한 규범적 의미를 지닌 말을 직접적으로 옮겼습니다.
- source_word: ἀθάνατος
  choice: 썩지 않는
  rationale: 부활의 열매가 죽음과 소멸에 지배되지 않는다는 뜻을 자연스러운 성서적 한국어로 나타냈습니다.
- source_word: ἀναβιώσας
  choice: 다시 살아나
  rationale: 단순히 계속 산다는 뜻보다 재차 살아남, 곧 부활의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 사람의 회개 행위와 구원의 관계
  choice: ‘여러분 자신과 … 읽는 사람을 모두 구원받게 하려는 것’, ‘여러분 자신에게 구원과 생명을 마련하는 것’으로 번역
  alternative: ‘구원을 확증하다’ 또는 ‘하나님께 구원받다’로 풀어 번역
  rationale: 원문 권면의 강한 능동 표현과 긴장을 유지하되, 특정 교파의 구원론에 맞추어 인과관계를 약화하거나 재규정하지 않았습니다.
- issue: ‘부활의 열매’의 성격
  choice: ‘부활의 썩지 않는 열매’
  alternative: ‘영원한 생명이라는 부활의 열매’
  rationale: 원문이 열매를 별도로 ‘영원한 생명’이라고 명시하지 않으므로 해석을 본문에 덧붙이지 않았습니다.
- issue: 의인의 장래 장소
  choice: ‘위에서 … 다시 살아나’로 본문을 두고 각주로 하늘의 가능성을 설명
  alternative: ‘하늘에서 다시 살아나’
  rationale: ‘위에서/위로’를 뜻하는 표현을 곧바로 특정한 사후 세계 지형으로 확정하지 않고 원문의 공간적 표현을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 장중한 합쇼체를 사용했습니다. 회중에게 낭독되는 초기 그리스도교 권면문의 직접성과 반복을 살렸으며, 성별을 포괄하는 호칭 ‘형제자매 여러분’을 유지했습니다. 제공 자료가 그리스어 본문 자체가 아니라 공용 영역 영어 증언을 중심으로 하며 원어 검토가 보류된 상태임을 고려해, 특히 불확실한 도입부는 각주로 투명하게 표시했습니다.
