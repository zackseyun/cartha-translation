base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: ko
  text: '그러므로 형제자매 여러분, 우리가 우리 아버지 하나님의 뜻을 행한다면, 해와 달보다 먼저 창조된 영적인 첫 교회에 속하게 될 것입니다. 그러나 우리가 주님의 뜻을 행하지 않는다면, “내 집이 강도들의 소굴이 되었다”라고 말하는 성경 말씀에 속하게 될 것입니다. 그러므로 우리는 구원받을 수 있도록 생명의 교회에 속하는 편을 택합시다.


    여러분은 살아 있는 교회가 그리스도의 몸이라는 사실을 모르지 않을 것입니다. 성경에 “하나님께서 사람을 남자와 여자로 지으셨다”라고 기록되어 있기 때문입니다. 남자는 그리스도이고 여자는 교회입니다. 또한 책들과 사도들은 교회가 이제 처음 생긴 것이 아니라 처음부터 있었다고 분명히 밝힙니다. 교회는 영적이었으며, 우리 예수님도 영적이셨습니다. 그러나 예수님께서는 우리를 구원하시기 위해 마지막 날들에 나타나셨습니다.


    영적인 교회는 그리스도의 육체 안에 나타났습니다. 이로써 우리 가운데 누구든지 육체 안에서 그 교회를 지키고 더럽히지 않으면 성령 안에서 그 교회를 다시 받게 된다는 것을 우리에게 보여 주었습니다.[a] 이 육체는 영의 대응물이기 때문입니다. 그러므로 그 대응물을 더럽힌 사람은 아무도 원본을 자기 몫으로 받지 못할 것입니다. 그러므로 형제자매 여러분, 그분께서 말씀하신 것은 이것입니다. “여러분이 영에 참여할 수 있도록 육체를 지키십시오.”


    그러나 육체가 교회이고 영이 그리스도라고 한다면, 육체를 욕되게 한 사람은 교회를 욕되게 한 것입니다. 그러므로 그런 사람은 그리스도이신 영에 참여하지 못할 것입니다.


    성령이 이 육체에 결합되면, 이 육체가 자기 몫으로 받을 수 있는 생명과 불멸은 참으로 큽니다. 주님께서 그분이 택하신 이들을 위하여 마련하신 것들은 아무도 말하거나 자세히 설명할 수 없습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘육체’는 그리스도의 육체, 신자의 육체, 또는 육체로 나타난 교회를 서로 연결하는 표현으로 읽힐 수 있습니다. 본문은 이 관계를 명확히 구분하지 않습니다.
    reason: 육체·교회·영의 연쇄 비유를 특정 교리적 해석으로 고정하지 않고, 본문에 있는 다층적 관계를 보존하기 위해서입니다.
lexical_decisions:
- source_word: brethren
  choice: 형제자매 여러분
  rationale: 공동체 전체를 향한 호칭의 포괄적 의미를 현대 한국어로 자연스럽게 전달했습니다.
- source_word: first Church
  choice: 첫 교회
  rationale: 시간적으로 선재하는 교회라는 문맥을 보존하고, 이를 ‘초대 교회’처럼 역사적 제도로 오해하게 할 표현은 피했습니다.
- source_word: Church of life
  choice: 생명의 교회
  rationale: ‘생명에 속한 교회’와 ‘생명을 주는 교회’ 사이의 가능한 함의를 좁히지 않고 속격 표현을 유지했습니다.
- source_word: Books
  choice: 성경의 책들
  rationale: 대문자 표기가 가리키는 권위 있는 문서 모음을 일반 독자가 이해할 수 있게 하되, 정확한 정경 범위를 단정하지 않았습니다.
- source_word: counterpart and copy / original
  choice: 모형이며 사본 / 원형
  rationale: 육체와 영 사이의 대응 및 사본-원형 비유를 일관되게 살렸습니다.
- source_word: dealt wantonly with
  choice: 함부로 다루다
  rationale: 훼손·모욕·방종의 의미 가능성을 열어 두면서도 현대 한국어에서 이해하기 쉬운 표현을 택했습니다.
- source_word: partake of
  choice: 참여하다
  rationale: 영 또는 그리스도와의 실제적 공유를 나타내되 특정 성례 교리로 한정하지 않았습니다.
theological_decisions:
- issue: 선재하는 영적 교회
  choice: 교회가 해와 달보다 먼저 창조되었고 처음부터 있었다는 진술을 그대로 보존했습니다.
  alternative: 이를 하나님의 계획이나 예정 속에만 존재했다는 뜻으로 풀어 번역할 수 있습니다.
  rationale: 본문 자체의 강한 선재 언어를 특정 교리 체계에 맞추어 약화하지 않았습니다.
- issue: 남자=그리스도, 여자=교회라는 해석
  choice: 저자의 유형론적 동일시를 직접적으로 옮겼습니다.
  alternative: ‘남자는 그리스도를 상징하고 여자는 교회를 상징한다’라고 해설적으로 완화할 수 있습니다.
  rationale: 원문의 신학적 긴장과 해석 방식을 번역자가 대신 해소하지 않았습니다.
- issue: 교회가 마지막 날들에 나타난 목적문의 주어
  choice: ‘교회는 그분께서 우리를 구원하시도록 … 나타났습니다’로 옮겼습니다.
  alternative: ‘그분은 우리를 구원하시려고 나타나셨습니다’ 또는 ‘교회는 우리를 구원하려고 나타났습니다’로 이해할 수 있습니다.
  rationale: 전승된 문장의 성별 대명사와 논리적 연결에 불확실성이 있어, 교회의 현현과 예수의 구원 행위를 함께 드러내는 번역을 택하고 각주로 모호성을 밝혔습니다.
- issue: 육체·교회·영·그리스도의 관계
  choice: 본문의 연속적인 동일시와 유비를 그대로 유지했습니다.
  alternative: ‘육체’를 개인의 몸이나 그리스도의 몸 가운데 하나로 일관되게 해석하여 풀어 쓸 수 있습니다.
  rationale: 문단은 ‘육체’를 여러 층위로 사용하는 듯하므로 하나의 해석으로 고정하지 않았습니다.
- issue: 성령과 육체의 결합
  choice: ‘성령께서 이 육체와 결합하시면’으로 번역했습니다.
  alternative: ‘성령이 이 육체에 더해지시면’이라고 옮길 수 있습니다.
  rationale: 결합의 의미를 보존하되 그 방식에 관한 후대의 교리적 설명을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 권면은 ‘-합시다’, 설명과 경고는 ‘-습니다/-것입니다’로 통일했습니다. 다만 제공 자료가 그리스어 본문 자체가 아니라 공용 영어 증언이며 직접적인 그리스어 검토가 보류된 상태이므로, 이 번역은 해당 증언에 근거한 잠정 출판 초안입니다. 증언의 ‘Christ>’에 붙은 꺾쇠는 명백한 조판 잔재로 보고 번역하지 않았습니다.
