id: 2CLEM.014
reference: 2 Clement — 2 Clem. 14
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'Wherefore, brethren, if we do the will of God our Father, we shall be of the first Church, which is spiritual, which was created before the sun and the moon; but if we do not the will of the Lord, we shall be of the scripture that saith, My house was made a den of robbers. So therefore let us choose rather to be of the Church of life, that we may be saved.


    And I do not suppose ye are ignorant that the living Church is the body of Christ: for the scripture saith, God made man, male and female. The male is Christ and the female is the Church. And the Books and the Apostles plainly declare that the Church existeth not now for the first time, but hath been from the beginning: for she was spiritual, as our Jesus also was spiritual, but was manifested in the last days that He might save us.


    Now the Church, being spiritual was manifested in the flesh of Christ, thereby showing us that if any of us guard her in the flesh and defile her not, he shall receive her again in the Holy Spirit: for this flesh is the counterpart and copy of the spirit. No man therefore, when he hath defiled the copy, shall receive the original for his portion. This therefore is what He meaneth, brethren; Guard ye the flesh, that ye may partake of the spirit.


    But if we say that the flesh is the Church and the spirit is Christ, then he that hath dealt wantonly with the flesh hath dealt wantonly with the Church. Such and one therefore shall not partake of the spirit, which is Christ&gt;.


    So excellent is the life and immortality which this flesh can receive as its portion, if the Holy Spirit be joined to it. No man can declare or tell those things which the Lord hath prepared for His elect.'
