  english_witness: 'Therefore, brethren, since we have found no small opportunity for repentance, seeing that we have time, let us turn again unto God that called us, while we have still One that receiveth us.


    For if we bid farewell to these enjoyments and conquer our soul in refusing to fulfill its evil lusts, we shall be partakers of the mercy of Jesus.


