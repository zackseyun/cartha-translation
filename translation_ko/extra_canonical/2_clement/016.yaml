base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/016.yaml
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance, seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
translation:
  language: ko
  text: '16 그러므로 형제자매 여러분, 우리에게 회개할 기회가 적지 않고 아직 시간이 있으니, 우리를 부르신 하나님께 돌아갑시다. 우리를 받아 주시는 분이 아직 계실 때에 그렇게 합시다.


    우리가 이 세상의 향락을 끊어 버리고, 우리 영혼의 악한 욕망을 채워 주지 않음으로써 그것을 이겨 낸다면, 예수님의 자비에 참여하게 될 것입니다.


    여러분도 알다시피 심판의 날은 이미 불타는 화덕처럼 다가오고 있습니다. 하늘의 권능들은 녹아내리고 온 땅은 불에 녹는 납처럼 될 것이며, 그때 사람들의 은밀한 행위와 드러난 행위가 나타날 것입니다.


    그러므로 자선은 죄를 회개하는 것과 마찬가지로 좋은 일입니다.[a] 금식은 기도보다 낫고, 자선은 그 둘보다 낫습니다. 사랑은 많은 죄를 덮으며, 선한 양심에서 나오는 기도는 죽음에서 건져 냅니다. 이런 것들로 가득한 사람은 누구나 복이 있습니다. 자선은 죄의 짐을 벗겨 주기 때문입니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영어 증언의 “sin&gt;”은 전승 내용이 아니라 부호가 잘못 입력된 것으로 보아 문장 경계로 처리했습니다. 그리스어 원문에 대한 직접 대조가 필요합니다.
    reason: 입력 자료의 손상된 문장 부호와 원어 검토 미완료 상태를 투명하게 알립니다.
  - marker: b
    text: 이 절의 ‘자선’은 특히 궁핍한 이들에게 재물을 베푸는 행위를 뜻합니다. ‘죄의 짐을 벗겨 준다’는 강한 표현은 해석으로 완화하지 않고 보존했습니다.
    reason: 핵심 용어의 구체적 의미와 신학적으로 민감한 표현을 설명합니다.
lexical_decisions:
- source_word: brethren
  choice: 형제자매 여러분
  rationale: 공동체 전체를 향한 호칭의 포괄적 의미를 현대 표준 한국어로 자연스럽게 드러냈습니다.
- source_word: repentance
  choice: 회개
  rationale: 죄에서 돌이켜 하나님께 돌아간다는 초기 그리스도교의 핵심 의미를 보존하는 익숙하고 정확한 용어입니다.
- source_word: conquer our soul
  choice: 우리 영혼의 … 욕망을 … 이겨 내다
  rationale: 영혼 자체를 적으로 보는 듯한 오해를 피하면서, 자기 영혼 안의 악한 욕망을 제어한다는 문맥적 뜻을 표현했습니다.
- source_word: powers of the heavens
  choice: 하늘의 권능들
  rationale: 천체인지 영적 권세인지 확정하지 않고 원문의 잠재적 모호성을 보존했습니다.
- source_word: almsgiving
  choice: 자선
  rationale: 가난한 이들에게 재물을 베푸는 행위를 가리키는 말로, 현대 독자가 이해하기 쉽고 문맥상 반복에도 적합합니다.
- source_word: good conscience
  choice: 선한 양심
  rationale: 도덕적으로 바른 내면에서 나오는 기도라는 의미를 직결되게 보존했습니다.
theological_decisions:
- issue: 자선이 죄의 짐을 벗겨 준다는 표현
  choice: 인과적 표현을 본문 그대로 보존
  alternative: 자선을 단지 이미 받은 용서의 증거로 해설하여 번역
  rationale: 본문은 자선과 죄의 짐 사이에 직접적인 관계를 말하므로, 특정 교리 체계에 맞추어 약화하거나 재해석하지 않았습니다.
- issue: 사랑이 많은 죄를 덮는다는 말의 대상
  choice: 누구의 죄인지 명시하지 않음
  alternative: 사랑을 행하는 사람 자신의 죄 또는 타인의 죄라고 특정
  rationale: 제공된 증거가 대상의 범위를 확정하지 않으므로 신학적 긴장을 유지했습니다.
- issue: 심판의 날이 이미 다가온다는 종말론적 시제
  choice: 이미 … 다가오고 있습니다
  alternative: 언젠가 올 것입니다
  rationale: 심판의 임박성을 나타내는 증언의 힘을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 권면문의 엄숙함과 종말론적 긴박성을 살렸습니다. 제공 자료가 그리스어 본문 자체가 아니라 공용 영역 영어 증언이며 원어 검토가 보류된 상태이므로, 이번 문안은 그 한계를 반영한 출판 초안입니다. 성경 인용을 연상시키는 대목은 지나치게 고어화하지 않고 자연스럽고 품위 있게 옮겼습니다.
