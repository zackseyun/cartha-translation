translation:
  language: ko
  text: '그러므로 우리가 땅에 있는 동안 회개합시다. 우리는 장인의 손에 있는 진흙이기 때문입니다.


    토기장이가 그릇을 만들다가 그것이 손안에서 비틀어지거나 찌그러지면 다시 빚습니다. 그러나 일단 불타는 가마에 넣고 나면 더는 고칠 수 없습니다. 이와 같이 우리도 아직 회개할 시간이 있을 때, 이 세상에 있는 동안 육신으로 행한 악한 일들을 온 마음으로 회개합시다. 그리하여 주님을 통해 구원받도록 합시다.


    우리가 세상을 떠난 뒤에는 그곳에서 더 이상 죄를 고백할 수도 없고 회개할 수도 없습니다.


    그러므로 형제자매 여러분, 우리가 아버지의 뜻을 행하고 육신을 깨끗하게 지키며 주님의 계명들을 지킨다면 영원한 생명을 받을 것입니다.


    주님께서 복음서에서 이렇게 말씀하십니다. “여러분이 작은 것을 지키지 못했다면 누가 여러분에게 큰 것을 맡기겠습니까? 내가 여러분에게 말합니다. 가장 작은 것에 신실한 사람은 많은 것에도 신실합니다.”[a]


    그러므로 이 말씀의 뜻은 이렇습니다. “육신을 깨끗하게 지키고 인장을 더럽히지 마십시오. 그리하여 우리가 생명을 받도록 합시다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 말씀은 누가복음 16:10–12와 표현과 주제가 비슷하지만, 현존하는 정경 복음서의 문구와 정확히 일치하지는 않습니다. 본문은 이를 ‘복음서’에 있는 주님의 말씀으로 인용합니다.
    reason: 인용문의 출처와 현존 복음서 본문 사이의 관계를 독자가 오해하지 않도록 하기 위함입니다.
  - marker: b
    text: ‘인장’이 구체적으로 무엇을 가리키는지는 이 문맥에서 명시되지 않습니다. 원문의 비유와 해석의 여지를 그대로 남겼습니다.
    reason: 세례 등 특정한 신학적 해석을 번역문에 선입견으로 삽입하지 않기 위함입니다.
lexical_decisions:
- source_word: craftsman
  choice: 장인
  rationale: 토기장이 비유를 포괄하면서도 ‘만드는 이의 손’이라는 원문의 형상을 자연스럽고 품위 있게 보존했습니다.
- source_word: flesh
  choice: 육신
  rationale: 단순히 ‘몸’으로 풀어 신학적 긴장을 없애지 않고, 인간의 육체적 존재와 그 안에서의 행위를 함께 가리킬 수 있는 전통적이면서도 이해 가능한 표현을 택했습니다.
- source_word: make confession
  choice: 죄를 고백하다
  rationale: 문맥상 단순한 진술이 아니라 회개와 연결된 고백이므로 목적어를 보충해 현대 독자가 뜻을 분명히 알게 했습니다.
- source_word: seal
  choice: 인장
  rationale: 그 의미를 세례, 신앙 고백, 성령 등으로 특정하지 않고 원문의 비유적 표현과 해석의 여지를 보존했습니다.
- source_word: life eternal / life
  choice: 영원한 생명 / 생명
  rationale: 앞 문단의 명시적 ‘영원한 생명’과 마지막 문장의 간결한 ‘생명’을 구별하여 원문 증언의 표현 차이를 유지했습니다.
theological_decisions:
- issue: 사후에는 고백과 회개를 할 수 없다는 진술
  choice: 단정적 문장으로 그대로 번역
  alternative: 교리적 설명이나 예외를 덧붙임
  rationale: 본문 자체의 엄중한 권면을 보존하고 특정 교파의 사후 상태 교리를 끌어들이지 않았습니다.
- issue: ‘육신을 깨끗하게 지킨다’의 의미
  choice: 표현을 그대로 유지
  alternative: 성적 순결, 도덕적 순결 또는 육체 보존으로 구체화
  rationale: 문맥이 윤리적 순결을 암시하지만 범위를 명시적으로 한정하지 않으므로 genuine ambiguity를 보존했습니다.
- issue: ‘인장’의 정체
  choice: 해석하지 않고 ‘인장’으로 번역
  alternative: 세례의 인장, 성령의 인치심 등으로 명시
  rationale: 전승사적으로 여러 해석이 가능한 표현이므로 특정 교리로 확정하지 않았습니다.
- issue: ‘작은 것’과 ‘큰 것’의 복음서 인용
  choice: 인용문의 비유적 대비를 유지
  alternative: 육신과 영생을 직접 대입해 의역
  rationale: 이어지는 저자의 적용과 인용 자체를 구별하고, 인용에 내재한 개방성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 공동체를 향한 권면은 ‘합시다’로, 인용 속 명령은 ‘하십시오’로 옮겼습니다. 고대 문헌의 엄숙함을 유지하되 지나치게 고어적인 어순과 어휘는 피했습니다. 현재 제공된 자료가 공공 영역 영어 증언이며 그리스어 직접 대조가 보류되어 있으므로, 단정적 원문 비평이나 과도한 어원 해석은 피하고 증언에 나타난 반복, 도공의 비유, ‘육신’과 ‘인장’의 긴장을 보존했습니다.
