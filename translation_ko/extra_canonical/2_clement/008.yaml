    rationale: 원문의 ‘brethren’를 번역문에서 성별 포괄 표현으로 확장할 필요는 없습니다. 현대 한국어의 공동체 호칭으로도 자연스러운 ‘형제 여러분’이 원문 표현을 더 가깝게 보존합니다.
