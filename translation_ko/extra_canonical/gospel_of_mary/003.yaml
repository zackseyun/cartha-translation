translation:
  language: ko
  text: '그때 마리아가 일어나 그들 모두에게 인사했습니다. 마리아가 형제자매들에게 말했습니다. “울거나 슬퍼하지 말고, 마음이 갈라지게 하지 마십시오. 그분의 은혜가 여러분 모두와 함께하며 여러분을 지켜 줄 것이기 때문입니다. 오히려 그분의 위대하심을 찬양합시다. 그분이 우리를 준비시키시고 우리를 참된 인간이 되게 하셨기 때문입니다.”[a]


    마리아가 이렇게 말하자, 그들의 마음을 선한 것[b]으로 돌이켰고, 그들은 [구원자]의 말씀을 놓고 [토론하기 시작했습니다].


    베드로가 마리아에게 말했습니다. “자매여, 우리는 구원자께서 다른 모든 여자보다 자매를 더 사랑하셨다는 것을 압니다. 자매가 기억하는 구원자의 말씀, 곧 자매는 알지만 우리는 알지 못하고 들어 보지도 못한 것들을 우리에게 말해 주십시오.”


    마리아가 대답했습니다. “여러분에게 감추어진 것을 말씀드리겠습니다.” 그러고는 그들에게 이런 말을 들려주기 시작했습니다. 마리아가 말했습니다. “저는 환상 가운데 주님을 뵙고 그분께 ‘주님, 오늘 제가 환상 가운데 주님을 뵈었습니다’라고 말씀드렸습니다.


    “주님이 제게 대답하셨습니다. ‘나를 보고도 흔들리지 않았으니, 너는 복이 있다. 마음이 있는 곳에 보물도 있기 때문이다.’[c]


    “제가 주님께 여쭈었습니다. ‘주님, 그러면 환상을 보는 사람은 그것을 영혼 안에서 봅니까, 아니면 영 안에서 봅니까?’


    “구원자께서 대답하셨습니다. ‘그 사람은 영혼 안에서도, 영 안에서도 보지 않는다. 그 둘 사이에 [있는] 마음이 환상을 [보는] 것이다. 그리고 그것이 […][d]


    11쪽부터 14쪽까지는 소실되었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘참된 인간’은 직역하면 ‘인간들’입니다. 영어 증언의 대문자 표기는 완성되거나 온전한 인간됨을 강조할 가능성이 있습니다.
    reason: 번역에서 보충한 ‘참된’의 근거와 원문의 개방성을 알리기 위해서입니다.
  - marker: b
    text: ‘선한 것’은 ‘선’ 또는 ‘선하신 분’으로도 이해할 수 있습니다.
    reason: 추상명사와 인격적 호칭 사이의 의미 가능성을 보존하기 위해서입니다.
  - marker: c
    text: 여기서 ‘마음’은 ‘지성’ 또는 ‘정신’으로도 옮길 수 있으며, 이어지는 문장에서는 영혼과 영 사이에서 환상을 보는 기능을 가리킵니다.
    reason: 핵심 인식론 용어의 번역상 불확실성을 밝히기 위해서입니다.
  - marker: d
    text: 대괄호는 훼손된 본문에 대한 보충을, 줄임표는 본문이 끊겼음을 나타냅니다. 이 뒤의 필사본 11쪽부터 14쪽까지가 소실되었습니다.
    reason: 복원된 표현과 물리적 결락을 독자가 구별하도록 하기 위해서입니다.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: 형제자매들
  rationale: 청중 전체를 자연스럽게 포괄하면서 영어 증언의 괄호가 나타내는 성별 포괄성을 본문에 반영했습니다.
- source_word: Humans
  choice: 참된 인간
  rationale: 대문자 표기가 시사하는 완성되거나 온전한 인간됨의 강조를 살리되, 특정 교파적 인간론으로 단정하지 않았습니다.
- source_word: the Good
  choice: 선한 것
  rationale: 추상적·실체적 의미의 가능성을 보존하고 고유명사적 신학 개념으로 과도하게 확정하지 않았습니다.
- source_word: mind
  choice: 마음
  rationale: 환상 인식의 중간 기능을 가리키는 문맥에서 현대 독자가 이해하기 쉬운 표현을 택했습니다. 다만 지성·정신이라는 의미 가능성은 각주에 밝혔습니다.
- source_word: soul / spirit
  choice: 영혼 / 영
  rationale: 두 요소의 구별을 그대로 유지하고 하나의 개념으로 합치지 않았습니다.
- source_word: Savior
  choice: 구원자
  rationale: 인물의 칭호를 자연스럽고 직접적으로 옮기며 ‘구세주’보다 원문의 기능적 의미를 투명하게 드러냈습니다.
theological_decisions:
- issue: ‘made us Humans’의 인간론적 함의
  choice: ‘우리를 참된 인간이 되게 하셨다’로 번역
  alternative: ‘우리를 인간으로 만드셨다’
  rationale: 강조된 Humans의 뉘앙스를 전달하되 신격화, 영지 획득 등 특정 해석을 본문에 주입하지 않았습니다.
- issue: 환상이 영혼이나 영이 아니라 그 사이의 mind로 보인다는 진술
  choice: 세 요소의 긴장과 구별을 그대로 유지
  alternative: 마음을 영혼 또는 이성과 동일시
  rationale: 본문 자체의 독특한 인간 이해를 익숙한 교리 체계로 조화시키지 않았습니다.
- issue: ‘the Good’의 정체
  choice: ‘선한 것’으로 열어 둠
  alternative: ‘선하신 분’ 또는 ‘하나님’
  rationale: 인격적 존재인지 최고선이라는 추상 개념인지 현 자료만으로 확정하지 않았습니다.
- issue: 구원자가 마리아를 다른 모든 여자보다 더 사랑했다는 진술
  choice: 비교 표현을 그대로 보존
  alternative: ‘특별히 사랑했다’로 완화
  rationale: 인물 관계에 관한 본문의 긴장을 축소하거나 교리적으로 재해석하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 대화는 존중 관계가 드러나도록 높임말로 옮겼고, 문장은 일반 독자가 이해할 수 있게 자연스럽게 다듬되 대괄호, 줄임표, 결락 표시는 보존했습니다. 현재 초안은 제공된 공용 영어 증언에 근거한 잠정 번역이며, 콥트어·그리스어 원문 대조가 필요합니다.
