  yaml_path: translation/extra_canonical/gospel_of_mary/005.yaml
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: ko
  text: '그러자 안드레가 형제자매들에게 말했습니다. “그 여자가 한 말에 관해서는 여러분이 하고 싶은 말을 하십시오. 나는 구원자께서 이런 말씀을 하셨다고 믿지 않습니다. 이 가르침들은 다른 사상처럼 보이기 때문입니다.”[a]


    베드로도 같은 우려를 드러내며 말했습니다. 그는 구원자에 관하여 그들에게 물었습니다. “그분이 우리도 모르는 사이에 한 여자와 말씀하시고, 우리에게는 공개적으로 말씀하지 않으셨다는 것입니까? 이제 우리가 돌아서서 모두 그 여자의 말을 들어야 합니까? 그분이 우리보다 그 여자를 더 아끼셨다는 것입니까?”


    그러자 마리아가 울며 베드로에게 말했습니다. “나의 형제 베드로여, 무슨 생각을 하고 계십니까? 내가 이것을 내 마음속에서 혼자 지어냈거나 구원자에 관해 거짓말한다고 정말로 생각하십니까?”


    레위가 베드로에게 대답했습니다. “베드로여, 당신은 늘 화를 냈습니다. 이제 보니 당신은 대적자들처럼 이 여자와 논쟁하고 있습니다. 그러나 구원자께서 그 여자를 합당하게 여기셨다면, 그 여자를 배척하는 당신은 누구입니까? 분명 구원자께서는 그 여자를 아주 잘 아십니다. 그래서 우리보다 그 여자를 더 사랑하신 것입니다.


    “도리어 우리는 부끄러워하며, 온전한 인간성을 옷 입고,[b] 그분이 우리에게 지시하신 대로 그것을 우리 것으로 삼아 복음을 전해야 합니다. 구원자께서 말씀하신 것 외에 다른 규칙이나 다른 법을 세워서는 안 됩니다.”


    [레위가 이 말을 하자],[c] 그들은 나가서 가르치고 복음을 전하기 시작했습니다.


    마리아에 따른


    복음'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 콥트어와 그리스어 원문에 대한 직접 대조 검토가 아직 필요합니다.
    reason: 자료 자체가 원어 검토 대기 상태임을 독자에게 투명하게 밝히기 위해서입니다.
  - marker: b
    text: 영어 증언은 ‘Humanity’를 대문자로 표기합니다. 이것이 의인화된 개념이나 특정 전문 용어인지 확정하지 않고 ‘온전한 인간성’으로 옮겼습니다.
    reason: 원문의 신학적·문법적 해석 가능성을 성급히 하나로 고정하지 않기 위해서입니다.
  - marker: c
    text: 대괄호는 전승 본문의 결손 부분을 보충한 복원 표시를 보존한 것입니다.
    reason: 번역자가 보충한 말과 보존된 본문을 구별하기 위해서입니다.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: 형제자매들
  rationale: 영어 증언이 괄호로 공동체의 남녀 구성원을 함께 나타내므로, 현대 한국어에서 포괄적이고 자연스러운 공동체 호칭으로 옮겼습니다.
- source_word: Savior
  choice: 구원자
  rationale: 인명이나 후대의 교회적 칭호로 특정하지 않고, 증언에 나타난 호칭의 기능을 직접 보존했습니다.
- source_word: different ideas
  choice: 다른 사상
  rationale: 단순히 ‘이상한 생각’으로 평가를 강화하지 않고, 안드레가 이 가르침을 자신들이 아는 가르침과 이질적인 것으로 본다는 뜻을 보존했습니다.
- source_word: made her worthy
  choice: 그 여자를 합당하게 여기셨다면
  rationale: ‘합당하게 만들다’라는 직역이 한국어에서 부자연스러워, 인정·선택의 의미를 열어 두는 표현을 택했습니다.
- source_word: perfect Humanity
  choice: 온전한 인간성
  rationale: 영어 증언의 대문자 표기는 주석으로 알리고, 본문에서는 인격체나 고유명사로 성급히 확정하지 않는 자연스러운 한국어를 사용했습니다.
- source_word: gospel
  choice: 복음
  rationale: 가르치고 선포하는 기쁜 소식이라는 초기 그리스도교 문맥의 통용어를 사용했습니다.
- source_word: The Gospel According to Mary
  choice: 마리아에 따른 복음
  rationale: 작가가 마리아라는 뜻으로 단정하기보다, 전승의 표제 형식을 살리는 ‘~에 따른’을 사용했습니다.
theological_decisions:
- issue: 구원자가 마리아를 ‘더 사랑했다’는 진술
  choice: 그래서 우리보다 그 여자를 더 사랑하신 것입니다
  alternative: 그래서 그분은 우리보다 그 여자를 더 총애하셨습니다
  rationale: 본문의 도전적인 비교를 완화하거나 영적 사랑으로 해설하지 않고 그대로 보존했습니다. 다만 ‘총애’는 지위 부여의 의미를 더할 수 있어 피했습니다.
- issue: 여성의 권위에 대한 갈등
  choice: ‘여자’를 반복하여 논쟁의 성별 차원이 드러나게 함
  alternative: 이 사람 또는 마리아로 완곡하게 처리
  rationale: 베드로와 레위의 발언에 나타난 성별과 권위의 긴장을 현대적 완곡어법으로 지우지 않았습니다.
- issue: perfect Humanity의 개념
  choice: 온전한 인간성
  alternative: 완전한 인간 / 완전한 인성
  rationale: 구체적 신학 체계나 의인화된 존재로 단정하지 않으면서, ‘옷 입다’와 ‘자기 것으로 삼다’라는 비유적 긴장을 유지했습니다.
- issue: 규칙과 법의 금지 범위
  choice: 구원자께서 말씀하신 것 외에 다른 규칙이나 다른 법을 세워서는 안 됩니다
  alternative: 구원자의 말씀을 넘어서는 교리를 만들지 마십시오
  rationale: ‘교리’로 범위를 좁히거나 특정 교회 제도를 겨냥하도록 해석하지 않고, 증언의 rule/law 병렬을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 대화는 품위를 유지하되 일상 독자가 이해할 수 있도록 자연스럽게 구성했으며, 베드로와 마리아와 레위 사이의 권위 갈등 및 본문에 남아 있는 신학적 긴장을 완화하지 않았습니다. 직접적인 콥트어·그리스어 검토가 아직 이루어지지 않았으므로 확정본이 아니라 출판용 잠정 초안입니다.
