  text: '“Then will [matter] be [destroyed], or not?”


    The Savior said, “Every nature, every form, every creature exists in and with each other, but they’ll dissolve again into their own roots, because the nature of matter dissolves into its nature alone. Anyone who has ears to hear should hear!”


    Peter said to him, “Since you’ve explained everything to us, tell us one more thing. What’s the sin of the world?”


    The Savior said, “Sin doesn’t exist, but you’re the ones who make sin when you act in accordance with the nature of adultery, which is called ‘sin.’ That’s why the Good came among you, up to the things of every nature in order to restore it within its root.”


    Then he continued and said, “That’s why you get sick and die, because [you love what tricks you. Anyone who] can understand should understand!


    “Matter [gave birth to] a passion that has no image because it comes from what’s contrary to nature. Then confusion arises in the whole body. That’s why I told you to be content at heart. If you’re discontented, find contentment in the presence of the various images of nature. Anyone who has ears to hear should hear!”'
translation:
  language: ko
  text: '“그러면 [물질]은[a] [소멸됩니까], 아니면 그렇지 않습니까?”


    구원자께서 말씀하셨습니다. “모든 본성과 모든 형상과 모든 피조물은 서로 안에서, 서로와 함께 존재합니다. 그러나 그것들은 다시 저마다의 뿌리로 해체될 것입니다. 물질의 본성은 오직 그 자체의 본성으로 해체되기 때문입니다. 들을 귀가 있는 사람은 들으십시오!”


    베드로가 그분께 말했습니다. “저희에게 모든 것을 설명해 주셨으니, 한 가지만 더 말씀해 주십시오. 세상의 죄란 무엇입니까?”


    구원자께서 말씀하셨습니다. “죄는 존재하지 않습니다. 다만 여러분이 ‘죄’라고 불리는 간음의 본성에 따라 행동할 때, 바로 여러분이 죄를 만들어 냅니다.[b] 그래서 선이[c] 여러분 가운데로 왔으며, 모든 본성에 속한 것들에까지 이르렀습니다. 그것을 그 뿌리 안에 회복시키기 위해서입니다.”


    그러고 나서 그분은 계속 말씀하셨습니다. “그래서 여러분은 병들고 죽습니다. [여러분을 속이는 것을 사랑하기 때문입니다. 이것을] 이해할 수 있는 사람은 이해하십시오![d]


    “물질은 본성에 어긋나는 것에서 비롯되었기 때문에 형상이 없는 욕정을 [낳았습니다].[a] 그러면 온몸에 혼란이 일어납니다. 그래서 내가 여러분에게 마음으로 만족하라고 말한 것입니다. 만족하지 못한다면, 자연의 여러 형상이 있는 가운데서 만족을 찾으십시오. 들을 귀가 있는 사람은 들으십시오!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 필사본의 결손을 문맥에 따라 복원한 부분입니다.
    reason: 본문 전승의 불확실성과 편집상 복원을 독자에게 알립니다.
  - marker: b
    text: ‘죄는 존재하지 않습니다’와 ‘죄를 만들어 냅니다’의 관계는 존재론적 진술, 행위의 결과, 또는 둘 다로 이해될 수 있습니다.
    reason: 본문의 의도적인 신학적 긴장을 한 가지 해석으로 제한하지 않습니다.
  - marker: c
    text: ‘선’은 ‘선한 분’으로도 이해될 수 있으나, 여기서는 추상적 원리와 인격적 존재 사이의 모호성을 남겼습니다.
    reason: 명사화된 ‘the Good’의 문법적·신학적 폭을 보존합니다.
  - marker: d
    text: 이 대괄호 구절은 본문이 손상되어 있어 정확한 표현과 범위가 불확실합니다.
    reason: 긴 결손부의 복원이 잠정적임을 분명히 합니다.
lexical_decisions:
- source_word: matter
  choice: 물질
  rationale: 우주론적 문맥의 핵심 용어를 현대 한국어에서 가장 직접적이고 중립적인 말로 옮겼습니다. 대괄호는 전승 본문의 결손 또는 편집상 복원을 보존합니다.
- source_word: nature
  choice: 본성
  rationale: 존재의 고유한 성질이나 질서를 가리키는 반복 용어로 일관되게 번역했습니다. 마지막 문장의 ‘images of nature’에서는 문맥상 집합적·현상적 의미를 살려 ‘자연의 여러 형상’으로 옮겼습니다.
- source_word: form / image
  choice: 형상
  rationale: 형태 이상의 철학적·우주론적 함의를 보존하면서도 두 영어 표현 사이의 가능한 연관성을 드러냅니다.
- source_word: roots / root
  choice: 뿌리
  rationale: 각 존재가 기원으로 돌아가거나 회복된다는 원문의 비유를 해석으로 풀지 않고 유지했습니다.
- source_word: the Good
  choice: 선
  rationale: 인격적 호칭인지 추상적 원리인지 확정하지 않고 명사화된 표현의 모호성을 보존했습니다.
- source_word: passion
  choice: 욕정
  rationale: 단순한 감정보다 무질서한 욕망을 나타내는 문맥을 반영하되, 특정 교리 체계의 전문어는 피했습니다.
theological_decisions:
- issue: “죄는 존재하지 않습니다”의 의미
  choice: 진술을 그대로 보존하고, 이어지는 ‘죄를 만들어 냅니다’와의 긴장을 유지했습니다.
  alternative: ‘죄는 본래 존재하는 실체가 아닙니다’처럼 존재론적으로 풀어 번역할 수 있습니다.
  rationale: 후자의 해석은 이해를 돕지만 본문이 남겨 둔 신학적·존재론적 긴장을 미리 해소하므로 채택하지 않았습니다.
- issue: ‘간음’의 범위
  choice: ‘간음의 본성’으로 직역에 가깝게 옮겼습니다.
  alternative: ‘불충실함의 성향’ 또는 우주론적 혼합을 뜻하는 상징어로 해석할 수 있습니다.
  rationale: 성적·윤리적 의미와 상징적 의미 가운데 하나를 단정하지 않았습니다.
- issue: ‘선’의 인격성
  choice: ‘선’으로 번역했습니다.
  alternative: ‘선한 분’으로 인격화할 수 있습니다.
  rationale: ‘the Good’이 구원자 또는 신적 원리를 가리킬 가능성을 열어 두고, 원문 증거 없이 인격성을 확정하지 않았습니다.
- issue: ‘그것을 그 뿌리 안에 회복시키다’의 지시 대상
  choice: 단수 대명사 ‘그것’을 유지했습니다.
  alternative: ‘모든 것을 각각의 뿌리로 회복시키다’로 명시할 수 있습니다.
  rationale: 지시 대상과 수의 불명확성을 해석으로 정리하지 않고 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 구원자의 직접 명령은 ‘-십시오’로, 제자들의 질문은 공손한 말투로 옮겼습니다. 문장은 일반 독자가 따라갈 수 있도록 다듬되 반복되는 우주론적 핵심어와 난해함은 임의로 평이하게 풀지 않았습니다. 제공 자료가 공공 영역 영어 번역 증언에 기반하며 콥트어·그리스어 직접 대조가 아직 이루어지지 않았으므로, 본 번역은 잠정적 출판 초안입니다.
