base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: ko
  text: '복되신 분께서 이 말씀을 마치시고, 그들 모두에게 인사하며 말씀하셨습니다. “평화가 여러분과 함께하기를 바랍니다! 나의 평화를 얻으십시오. 아무도 ‘보십시오, 여기 있습니다!’ 또는 ‘보십시오, 저기 있습니다!’라고 말하며 여러분을 미혹하지 못하게 조심하십시오. 인자가 여러분 안에 있기 때문입니다.[a] 그분을 따르십시오! 그분을 찾는 이들은 그분을 발견할 것입니다.


    “그러므로 가서 하나님 나라에 관한 복음을 전하십시오.[b] 내가 여러분에게 준 것 외에 어떤 규정도 세우지 말고, 입법자처럼 법을 만들지도 마십시오. 그러다가 여러분이 그것에 얽매일 수 있습니다.” 이 말씀을 마치시고 그분은 떠나셨습니다.


    그러나 그들은 슬퍼하며 몹시 울었습니다. 그들이 말했습니다. “우리가 어떻게 이방인들에게 가서 인자의 나라에 관한 복음을 전할 수 있겠습니까?[b] 그들이 그분도 살려 두지 않았는데, 어찌 우리를 살려 두겠습니까?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러분 안에’는 제공된 영어 증거문을 따른 잠정 번역입니다. 콥트어와 그리스어 잔존 본문을 직접 검토하면 ‘안에’와 ‘가운데’의 의미 범위를 다시 확인해야 합니다.
    reason: 내재성과 공동체적 현존 사이의 해석 가능성을 성급히 확정하지 않기 위해서입니다.
  - marker: b
    text: 제공된 증거문은 앞에서는 ‘나라에 관한 복음’, 뒤에서는 ‘인자의 나라에 관한 복음’이라고 서로 다르게 전합니다. 앞의 ‘하나님’은 문맥을 분명하게 하려고 보충한 말이며, 원문 직접 검토 전까지 잠정적입니다.
    reason: 증거문 안의 표현 차이를 보존하고 번역자의 보충을 공개하기 위해서입니다.
lexical_decisions:
- source_word: the Blessed One
  choice: 복되신 분
  rationale: 존칭과 칭호의 성격을 보존하면서도 특정한 교파적 호칭을 덧붙이지 않았습니다.
- source_word: Peace be with you
  choice: 평화가 여러분과 함께하기를 바랍니다
  rationale: 인사와 축원의 기능을 자연스러운 현대 한국어 합쇼체로 옮겼습니다.
- source_word: Acquire my peace
  choice: 나의 평화를 얻으십시오
  rationale: 단순히 평화를 누리라는 뜻으로 완화하지 않고 ‘획득하다/얻다’라는 적극적 명령을 보존했습니다.
- source_word: Son of Humanity
  choice: 인자
  rationale: 직역하면 ‘인류의 아들/사람의 아들’이지만, 한국어 종교 문헌에서 통용되는 간결한 칭호를 사용했습니다. 다만 이 칭호가 지닌 의미의 폭을 특정 교리로 한정하지 않았습니다.
- source_word: Gentiles
  choice: 이방인들
  rationale: 유대인 밖의 민족들을 가리키는 전통적이고 이해 가능한 표현을 채택했습니다.
- source_word: lawgiver
  choice: 입법자
  rationale: 법을 정하고 부과하는 인물이라는 일반적 의미를 살려, 특정 인물을 명시하지 않았습니다.
theological_decisions:
- issue: 인자가 ‘여러분 안에’ 존재한다는 진술
  choice: 인자가 여러분 안에 있기 때문입니다
  alternative: 인자가 여러분 가운데 있기 때문입니다
  rationale: 제공된 증거문이 within you로 제시되어 있으므로 내재성을 나타내는 번역을 본문에 유지했습니다. 다만 원어 검토가 아직 이루어지지 않았음을 각주로 밝혔습니다.
- issue: ‘나라’와 ‘인자’의 관계
  choice: 첫 문장은 ‘하나님 나라에 관한 복음’, 마지막 문장은 ‘인자의 나라에 관한 복음’
  alternative: 두 곳 모두 ‘나라에 관한 복음’ 또는 ‘인자의 나라에 관한 복음’
  rationale: 제공된 영어 증거문 자체가 두 표현을 달리 제시하므로 이를 억지로 통일하지 않고 긴장과 변이를 보존했습니다. 첫 문장의 ‘하나님’은 한국어에서 단독 ‘나라’가 불분명해지는 것을 피하기 위한 문맥적 보충이며 각주로 표시했습니다.
- issue: 규정과 법에 얽매일 위험
  choice: 그러다가 여러분이 그것에 얽매일 수 있습니다
  alternative: 그것에 얽매이지 않도록 하십시오
  rationale: 결과의 가능성을 나타내는 영어 witness의 ‘lest/or you may’를 명령형으로 강화하지 않고 경고의 가능성으로 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 명령은 위엄을 유지하되 지나치게 고어적인 표현을 피했습니다. 이 초안은 제공된 공개 영역 영어 증거문을 바탕으로 한 잠정 번역이며, Papyrus Berolinensis 8502,1의 콥트어 본문과 그리스어 단편에 대한 직접 검토가 필요합니다.
