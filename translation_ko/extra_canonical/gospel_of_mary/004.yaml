base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/004.yaml
  text: 'Desire said, “I did not see you going down, but now I see you going up. So why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you did not see or know me. To you I was just a garment, and you did not recognize me.” When it said these things, it left, rejoicing greatly.


    Again, it came to the third power, called “Ignorance.” [It] questioned the soul and [said], “Where are you going? You are bound in wickedness. Since you are bound, do not judge!”


    [And] the soul said, “Why do you judge me, since I have not judged? I was bound, even though I have not bound. They did not recognize me, but I have recognized that everything will dissolve—both the things of the [earth] and the things of [heaven].”


    When the soul had overcome the third power, it went up and saw the fourth power, which took seven forms:


    The first form is Darkness;

    The second, Desire;

    The third, Ignorance;

    The fourth, Zeal for Death;

    The fifth, the Kingdom of the Flesh;

    The sixth, the Foolish “Wisdom” of Flesh;

    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They ask the soul, “Where do you come from, you murderer, and where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed, what surrounds me has been overcome, my desire is gone, and ignorance has died. In a [world] I was released from a world, [and] in a type from a type which is above, and from the chain of forgetfulness, which exists only for a time. From now on, I will receive the rest of the time of the season of the age in silence.”


    When Mary had said these things, she fell silent, because the Savior had spoken with her up to this point.'
translation:
  language: ko
  text: '욕망이 말했습니다. “네가 내려갈 때에는 내가 너를 보지 못했는데, 이제 네가 올라가는 것은 보인다. 그런데 네가 내게 속해 있으면서 어찌하여 거짓말하느냐?”


    영혼이 대답했습니다. “나는 너를 보았지만, 너는 나를 보지도 알지도 못했다. 나는 네게 그저 옷과 같았는데, 너는 나를 알아보지 못했다.” 영혼은 이렇게 말하고 크게 기뻐하며 떠났습니다.


    영혼은 다시 ‘무지’라 불리는 셋째 권세에 이르렀습니다. [그 권세가][a] 영혼을 심문하며 [말했습니다]. “어디로 가느냐? 너는 악에 매여 있다. 네가 매여 있으니 판단하지 마라!”


    [그러자][b] 영혼이 말했습니다. “나는 판단하지 않았는데, 어찌하여 네가 나를 판단하느냐? 나는 매였으나 누구도 매지 않았다.[c] 그들은 나를 알아보지 못했지만, 나는 모든 것이 풀어져 사라질 것을 깨달았다. 곧 [땅]에 있는 것들과 [하늘]에 있는 것들이 모두 그러할 것이다.”


    영혼은 셋째 권세를 이기고 위로 올라가, 일곱 형상을 취한 넷째 권세를 보았습니다.


    첫째 형상은 어둠이며,

    둘째는 욕망,

    셋째는 무지,

    넷째는 죽음을 향한 열정,

    다섯째는 육신의 왕국,

    여섯째는 육신의 어리석은 ‘지혜’,

    일곱째는 분노의 ‘지혜’입니다.


    이것들이 진노의 일곱 권세입니다.


    그 권세들이 영혼에게 묻습니다. “살인자여, 너는 어디에서 왔으며, 공간을 정복한 자여, 어디로 가느냐?”[d]


    영혼이 대답했습니다. “나를 묶던 것은 죽임을 당했고, 나를 둘러싸던 것은 정복되었으며, 내 욕망은 사라졌고 무지는 죽었다. 나는 한 [세계] 안에서 한 세계로부터 풀려났고, 한 형상 안에서 위에 있는 형상으로부터 풀려났으며,[e] 잠시만 존재하는 망각의 사슬에서도 풀려났다. 이제부터 나는 침묵 가운데 시대의 때가 이루어지는 동안의 안식을 받을 것이다.”[f]


    마리아는 이렇게 말한 뒤 잠잠해졌습니다. 구원자께서 그때까지 마리아와 말씀하셨기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호는 현존 본문의 결손을 번역자가 보충했음을 나타냅니다.
    reason: 제공된 증거 본문의 복원 표지를 보존하기 위해서입니다.
  - marker: b
    text: ‘그러자’는 결손된 접속 표현의 문맥상 보충입니다.
    reason: 원문의 대괄호 표지를 한국어 본문에서도 드러내기 위해서입니다.
  - marker: c
    text: 직역하면 “나는 매였으나 매지 않았다”입니다. 무엇을 또는 누구를 매지 않았는지는 밝혀져 있지 않습니다.
    reason: 목적어가 없는 난해한 원문을 자연스럽게 옮기면서도 그 불확실성을 기록하기 위해서입니다.
  - marker: d
    text: ‘살인자’와 ‘공간을 정복한 자’가 영혼을 비난하는 말인지, 영혼의 승리를 역설적으로 인정하는 말인지는 분명하지 않습니다.
    reason: 호칭의 신학적·수사적 양면성을 보존하기 위해서입니다.
  - marker: e
    text: ‘한 형상 안에서 위에 있는 형상으로부터’라는 구절은 문법과 의미가 모두 불분명합니다. 특정한 우주론적 단계로 해석하지 않고 문장 구조를 가깝게 보존했습니다.
    reason: 실제 본문의 난해함을 임의로 해소하지 않기 위해서입니다.
  - marker: f
    text: ‘시대의 때가 이루어지는 동안의 안식’에 해당하는 표현은 시간 관계가 모호합니다. ‘영원한 안식’으로 단순화하지 않았습니다.
    reason: 종말론적 시간 표현의 긴장과 불확실성을 유지하기 위해서입니다.
lexical_decisions:
- source_word: Desire
  choice: 욕망
  rationale: 인격화된 권세의 이름이므로 의미를 직접 보존하고 이름처럼 일관되게 옮겼습니다.
- source_word: power
  choice: 권세
  rationale: 단순한 능력보다 인격화되어 지배하는 세력을 나타내는 문맥을 살렸습니다.
- source_word: Ignorance
  choice: 무지
  rationale: 지식의 결여를 뜻하는 추상명사가 권세의 고유한 명칭으로 쓰인 점을 보존했습니다.
- source_word: soul
  choice: 영혼
  rationale: 상승하며 권세들과 대화하는 주체라는 본문의 용례에 맞는 통상적이고 중립적인 번역입니다.
- source_word: Zeal for Death
  choice: 죽음을 향한 열정
  rationale: ‘zeal’의 강렬한 지향성을 보존하되 특정 교리적 의미를 덧붙이지 않았습니다.
- source_word: Kingdom of the Flesh
  choice: 육신의 왕국
  rationale: ‘flesh’와 ‘kingdom’의 상징적 긴장을 해소하지 않고 직역에 가깝게 유지했습니다.
- source_word: space
  choice: 공간
  rationale: 우주적 영역이나 장소를 뜻할 가능성을 특정한 영지주의 체계로 단정하지 않고 열린 표현을 택했습니다.
- source_word: rest
  choice: 안식
  rationale: 단순 휴식보다 종말론적·영적 함의를 가질 수 있으나 이를 과도하게 규정하지 않는 성서적 한국어를 사용했습니다.
theological_decisions:
- issue: 영혼이 ‘옷’이었다는 진술
  choice: “그저 옷과 같았다”로 번역
  alternative: “나는 네게 옷이었다”
  rationale: 존재론적 동일시를 확정하지 않으면서도 영혼이 욕망에게 외적 덮개처럼 인식되었다는 비유를 보존했습니다.
- issue: “I have not bound”의 목적어 부재
  choice: “누구도 매지 않았다”
  alternative: “나는 매지 않았다”
  rationale: 한국어 문장을 성립시키기 위해 최소한의 목적어를 보충하되, 누구 또는 무엇을 매지 않았는지는 특정하지 않았습니다.
- issue: 세계와 형상에서 풀려남을 말하는 난해한 구절
  choice: 통사 구조와 반복을 최대한 보존
  alternative: 우주론적 단계에서 해방되었다고 해설적으로 의역
  rationale: 본문의 우주론을 특정 체계로 정리하지 않고 진정한 모호성과 긴장을 남겼습니다.
- issue: 마지막 ‘시대의 때’와 ‘안식’
  choice: 시간 표현의 중첩을 유지
  alternative: “영원한 안식”으로 단순화
  rationale: 원문의 난해한 시간 구조를 교리적으로 ‘영원’이라 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 인용 속 권세와 영혼의 직접 발화는 원문의 단호함을 살리기 위해 해라체로 옮겼습니다. 제공 자료가 영어 공개 번역 증거이며 콥트어·그리스어 직접 검토가 아직 이루어지지 않았으므로, 대괄호 복원과 난해한 구문을 보수적으로 유지한 잠정 출판 초안입니다.
