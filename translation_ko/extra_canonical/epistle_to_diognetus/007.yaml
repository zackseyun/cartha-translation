base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/007.yaml
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
translation:
  language: ko
  text: '7. 내가 말했듯이, 그들에게 맡겨진 것은 땅에서 나온 어떤 발견도 아닙니다. 그들은 죽을 인간이 고안한 것을 그토록 세심하게 지키려는 것도 아니며, 인간의 신비를 관리하는 일을 맡은 것도 아닙니다.


    오히려 만물의 전능하신 창조주, 보이지 않으시는 하나님께서 친히 하늘로부터 인간들 가운데 인간의 이해를 뛰어넘는 진리와 거룩한 가르침을 심으시고, 그것을 그들의 마음에 굳게 자리 잡게 하셨습니다. 하나님께서는 누군가 생각할 법하듯이, 하급자나 천사나 통치자나 땅의 일을 다스리는 자들 가운데 하나나 하늘의 경륜을 맡은 자들 가운데 하나를 보내신 것이 아닙니다. 도리어 만물을 지으시고 창조하신 바로 그분을 보내셨습니다. 하나님께서는 그분을 통하여 하늘을 만드셨고, 그분을 통하여 바다를 제 경계 안에 가두셨습니다. 모든 원소가 그분의 신비로운 질서를 충실히 지키며, [해]는 낮의 운행을 지키도록 그분에게서 그 척도까지 받았습니다.[a] 달은 밤에 빛나라는 그분의 명령에 순종하고, 별들은 달의 운행을 따르며 그분께 순종합니다. 그분을 통하여 모든 것이 질서 있게 배치되고 경계가 정해지며 복종하게 되었습니다. 곧 하늘과 하늘에 있는 것들, 땅과 땅에 있는 것들, 바다와 바다에 있는 것들, 불과 공기와 심연, 높은 곳에 있는 것들과 깊은 곳에 있는 것들, 그 둘 사이에 있는 것들입니다. 하나님께서 바로 그분을 그들에게 보내셨습니다.


    그러면 하나님께서 그분을 보내신 것은, 누군가 생각할 법하듯이, 지배권을 세우고 두려움과 공포를 불러일으키게 하시려는 것이었겠습니까?


    그렇지 않습니다. 하나님께서는 온유함[과] 겸손함 가운데 그분을 보내셨습니다.[b] 왕이 왕인 자기 아들을 보내듯이 보내셨습니다. 하나님으로서 보내셨고, [사람으로서] 사람들에게 보내셨으며,[c] 구원자로서 보내셨습니다. 강제하지 않고 설득하셨으니, 강제는 하나님의 속성이 아니기 때문입니다.


    하나님께서는 박해하게 하지 않고 부르게 하시려고 그분을 보내셨으며, 심판하게 하지 않고 사랑하게 하시려고 보내셨습니다.


    그러나 하나님께서는 심판하러 그분을 보내실 것입니다. 그러니 누가 그분 앞에서 견딜 수 있겠습니까?


    ……[그대는 보지 못합니까?] 사람들이 그리스도인들로 하여금 주님을 부인하게 하려고 그들을 맹수들에게 내던지지만, 그들이 굴복하지 않는 것을 말입니다.[d]


    그대는 그들이 더 많이 형벌을 받을수록 다른 이들이 그만큼 더 늘어나는 것을 보지 못합니까?


    이것들은 사람이 하는 일로 보이지 않습니다. 이것들은 하나님의 능력이며, 그분이 함께 계신다는 증거입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 속 ‘해’는 전승 본문의 결손을 문맥에 따라 보충한 말입니다.
    reason: 복원된 본문임을 독자에게 알리고 확실성을 과장하지 않기 위해서입니다.
  - marker: b
    text: ‘과’는 전승상 보충되었거나 불확실한 연결어임을 대괄호로 표시했습니다.
    reason: 제공된 증언의 본문 비평 표시를 보존하기 위해서입니다.
  - marker: c
    text: 대괄호 속 ‘사람으로서’는 전승 본문의 보충을 나타냅니다.
    reason: 기독론적으로 중요한 구절의 본문 불확실성을 투명하게 드러내기 위해서입니다.
  - marker: d
    text: 이 지점 앞에는 원고의 결손이 있으며, ‘그대는 보지 못합니까?’는 문맥에 따른 복원입니다.
    reason: 생략 부호와 대괄호가 나타내는 결손 및 복원 사실을 설명하기 위해서입니다.
lexical_decisions:
- source_word: earthly discovery
  choice: 땅에서 나온 어떤 발견
  rationale: 인간적 기원을 뜻하는 표현을 ‘세속적’으로 교리화하지 않고 공간적 은유를 살렸습니다.
- source_word: dispensation / administration
  choice: 관리하는 일 / 경륜
  rationale: 인간의 신비에 대해서는 자연스러운 ‘관리’를, 하늘의 질서에 대해서는 고대 신학 문맥을 반영하는 ‘경륜’을 사용하되 의미 차이를 드러냈습니다.
- source_word: Artificer and Creator
  choice: 지으시고 창조하신 분
  rationale: 서로 가까운 두 조물주 호칭의 중첩을 보존하면서 현대 독자에게 자연스럽게 표현했습니다.
- source_word: mysteries
  choice: 신비로운 질서
  rationale: 원소들이 ‘지킨다’는 문맥에서 비밀 교의가 아니라 창조 세계에 부여된 감추어진 명령·질서를 가리키도록 옮겼습니다.
- source_word: abyss
  choice: 심연
  rationale: 우주론적 깊음을 나타내는 고전적 어감을 유지했습니다.
- source_word: summoning
  choice: 부르게 하시려고
  rationale: 초청과 소명의 의미를 열어 두고, ‘소환’의 강압적 뉘앙스를 피했습니다.
- source_word: presence
  choice: 그분 앞에서 / 그분이 함께 계심
  rationale: 첫 문맥은 심판 때의 대면, 마지막 문맥은 현존의 증거라는 각각의 한국어 문맥에 맞추되 동일한 신학적 지시를 유지했습니다.
theological_decisions:
- issue: 보내는 분과 보내심을 받은 분의 관계
  choice: ‘하나님’과 ‘그분’을 구별하여 반복
  alternative: 모든 대명사를 ‘성부’와 ‘성자’로 명시
  rationale: 본문이 말하는 구별과 높은 기독론은 보존하되, 원문 증거보다 구체적인 후대의 위격 용어를 삽입하지 않았습니다.
- issue: ‘as God’의 번역
  choice: ‘하나님으로서 보내셨고’
  alternative: ‘하나님을 보내듯 보내셨고’
  rationale: 영어 증언과 알려진 문장 구조가 허용하는 직접적 술어 의미를 살리면서도, 전체 문장의 역설과 긴장을 해소하지 않았습니다.
- issue: ‘as [a man] unto men’의 본문 상태
  choice: ‘[사람으로서] 사람들에게’
  alternative: 괄호 없이 ‘사람으로서 사람들에게’
  rationale: 보충·복원된 말이라는 증언의 표시를 보존하여 본문 확실성을 과장하지 않았습니다.
- issue: 초림과 심판의 대비
  choice: ‘심판하게 하지 않고 사랑하게 하시려고’와 미래 심판을 병치
  alternative: 첫 문장을 ‘정죄하지 않고’로 완화
  rationale: 현재의 사랑과 장래의 심판 사이에 놓인 본문의 신학적 긴장을 그대로 유지했습니다.
- issue: ‘force is no attribute of God’
  choice: ‘강제는 하나님의 속성이 아닙니다’
  alternative: ‘하나님께서는 강요하지 않으십니다’
  rationale: 보편적 명제의 강도를 약화하거나 특정 교리 체계로 제한하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 논증적이고 장엄한 고대 서신의 어조를 유지하되 지나치게 한문투인 표현은 피했습니다. 긴 우주론적 열거는 원문의 수사적 축적을 보존했고, 대명사 지시가 신학적으로 중요한 곳에서는 ‘하나님’과 ‘그분’을 적절히 반복하여 한국어의 모호성을 줄였습니다. 다만 이번 초안은 제공된 공용 영어 증언에 근거한 잠정 번역이며, 그리스어 원문 대조가 아직 필요합니다.
