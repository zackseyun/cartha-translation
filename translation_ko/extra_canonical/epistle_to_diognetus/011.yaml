base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: ko
  text: '## 디오그네투스에게 보낸 서신 11장


    내가 전하는 것은 낯선 가르침도 아니고 그릇된 논쟁도 아닙니다. 오히려 나는 사도들의 제자가 되어 이방인들의 교사로 나섰으며, 진리의 제자가 되고자 나아오는 이들에게 전해 받은 가르침을 합당하게 전합니다.


    올바로 가르침을 받고 말씀과 벗이 된 사람이라면, 말씀이 제자들에게 공개적으로 밝혀 주신 가르침을 분명히 알고자 하지 않겠습니까? 말씀께서는 그들에게 나타나셔서 그것을 숨김없이 말씀하셨습니다. 믿지 않는 사람들은 말씀을 알아보지 못했지만, 말씀께서는 자신이 신실하다고 여기신 제자들에게 그것을 들려주셨고, 그들은 아버지의 신비를 배웠습니다.


    그 때문에 그분께서는 말씀이 세상에 나타나시도록 말씀을 보내셨습니다.[a] 말씀께서는 그 백성에게 모욕을 당하셨으나 사도들을 통하여 선포되셨고, 이방인들에게 믿음을 받으셨습니다.


    이 말씀께서는 처음부터 계셨고, 새롭게 나타나셨으나 오래전부터 계신 분으로 드러나셨으며, 성도들의 마음속에서 언제나 젊게 태어나십니다.


    곧 말씀께서는 영원하신 분이며, 오늘 아들로 인정되신 분입니다.[b] 그분을 통하여 교회는 풍성해지고, 은혜는 성도들 가운데 펼쳐져 더욱 넘칩니다. 이 은혜는 깨달음을 주고, 신비를 드러내며, 때를 알리고, 신실한 이들로 말미암아 기뻐하며, 은혜를 찾는 이들에게 주어집니다. 그들은 믿음의 보증을 깨뜨리지 않고 선조들이 세운 경계를 넘어서지 않습니다.[c]


    그리하여 율법에 대한 경외가 찬송되고, 예언자들의 은혜가 인정되며, 복음서들의 믿음이 굳게 세워지고, 사도들의 전승이 보존되며, 교회의 기쁨이 크게 넘칩니다.


    그대가 이 은혜를 근심하게 하지 않는다면, 말씀이 원하시는 때에 자신이 원하시는 이들의 입을 통하여 들려주시는 가르침을 깨닫게 될 것입니다.


    명령하시는 말씀의 뜻에 따라 우리가 온갖 수고를 다해 말하도록 이끌린 모든 일에서, 우리는 우리에게 계시된 것들을 사랑하기 때문에 그대와 함께 그것들을 나누는 사람이 됩니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그분’이 누구를 가리키는지는 제공된 영어 증거문만으로 확정하기 어렵습니다. 문맥상 말씀을 보내신 분을 가리키지만, 직접적인 그리스어 본문 검토가 필요합니다.
    reason: 대명사의 지시 대상을 성부 또는 하나님으로 무리하게 명시하지 않고 본문의 모호성을 알립니다.
  - marker: b
    text: ‘오늘 아들로 인정되신’은 영원하신 말씀과 ‘오늘’이라는 표현을 나란히 놓습니다. 어느 특정 사건을 뜻하는지는 이 문장 자체에서 명시되지 않습니다.
    reason: 성육신, 세례, 부활, 영원 발생 가운데 하나로 해석을 고정하지 않습니다.
  - marker: c
    text: ‘선조들이 세운 경계’는 물려받은 믿음의 규범을 뜻할 수 있으나, 정확히 어떤 경계를 가리키는지는 분명하지 않습니다.
    reason: 후대의 특정 교파적 전통이나 교회 직제를 본문에 소급해 넣지 않습니다.
  - marker: d
    text: 이 번역은 소실된 코덱스 아르겐토라텐시스의 사본 계통을 반영한 J. B. 라이트풋의 공개 영역 영어 번역을 바탕으로 한 잠정 번역입니다. 고대 그리스어 본문에 대한 직접 검토는 아직 이루어지지 않았습니다.
    reason: 원어 검토가 보류된 자료 상태와 번역 근거를 독자에게 투명하게 밝힙니다.
lexical_decisions:
- source_word: Word (λόγος, source-language review pending)
  choice: 말씀
  rationale: 초기 그리스도교 문헌의 인격적 로고스 용례를 살리면서 한국어 성경 독자에게 익숙하고 자연스러운 표현을 선택했습니다.
- source_word: Gentiles
  choice: 이방인들
  rationale: 유대 민족 밖의 사람들을 가리키는 역사적·종교적 범주를 보존합니다.
- source_word: mysteries
  choice: 신비
  rationale: 비밀 정보만을 뜻하는 ‘비밀’보다 계시를 통해 알려지는 하나님의 감추어진 일을 나타내기에 적절합니다.
- source_word: engendered always young
  choice: 언제나 젊게 태어나십니다
  rationale: 비유적이고 역설적인 원문의 이미지를 설명으로 평탄화하지 않고 보존했습니다.
- source_word: pledges of faith
  choice: 믿음의 보증
  rationale: 서약·보증·맡겨진 신앙 내용을 함께 암시하는 표현의 폭을 유지했습니다.
- source_word: tradition
  choice: 전승
  rationale: 단순한 관습보다 사도들에게서 이어져 전해진 가르침이라는 문맥을 드러냅니다.
theological_decisions:
- issue: 말씀을 보내는 주체
  choice: ‘그분께서는 … 말씀을 보내셨습니다’로 번역하고 각주로 지시 대상의 불확실성을 밝혔습니다.
  alternative: ‘아버지께서는 말씀을 보내셨습니다’ 또는 ‘하나님께서는 말씀을 보내셨습니다’
  rationale: 제공된 영어 증거문은 대명사 He를 사용하며, 직접적인 그리스어 검토가 미완료 상태이므로 주체를 교리적으로 확정하지 않았습니다.
- issue: ‘오늘 아들로 인정되셨다’의 의미
  choice: 시간 표현과 ‘인정되다/여겨지다’의 긴장을 그대로 보존했습니다.
  alternative: ‘오늘 아들로 태어나셨다’ 또는 ‘오늘 아들로 선포되셨다’
  rationale: 영원하심과 ‘오늘’ 아들로 인정됨이 나란히 놓인 역설을 특정한 성육신·부활·영원 발생 해석으로 해소하지 않았습니다.
- issue: 은혜의 인격적 묘사
  choice: ‘신실한 이들로 말미암아 기뻐하며’로 옮겼습니다.
  alternative: ‘신실한 이들을 기뻐하며’
  rationale: 영어 증거문의 ‘rejoices over the faithful’가 지닌 관계 방향을 과도하게 특정하지 않으면서 자연스러운 한국어로 표현했습니다.
- issue: ‘선조들이 세운 경계’의 정체
  choice: 일반적인 ‘선조들’로 유지했습니다.
  alternative: ‘교부들의 경계’ 또는 ‘조상들의 경계’
  rationale: 사도적 전승이나 공동체의 선대 권위를 가리킬 수 있으나 특정한 후대 교회 제도나 교리 체계로 한정하지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용했습니다. 초기 그리스도교 문헌의 장중함과 반복적 수사 구조를 유지하되, 지나치게 고어적인 표현은 피했습니다. ‘말씀’은 인격적 주체이므로 높임을 적용했고, 문단 구조는 제공된 증거문의 논리적 흐름을 따랐습니다. 직접 원어 검토가 미완료이므로 의미가 불확실한 대목은 본문에서 단정하지 않고 각주로 표시했습니다.
