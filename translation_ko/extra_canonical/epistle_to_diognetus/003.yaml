base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/003.yaml
  text: 'Next, I think you are especially eager to hear why they do not practice their religion in the same way as the Jews.


    The Jews, then, do well when they avoid the kind of worship described above and claim to reverence the one God of the universe and regard him as Master. But when they offer him worship by methods like those already mentioned, they are completely mistaken.


    For the Greeks display their foolishness by offering these things to senseless and deaf images. But the Jews, thinking that they are presenting them to God as though he needed them, should rightly consider this folly rather than religious worship.


    For he who made heaven and earth and everything in them, and who provides us all with what we need, cannot himself need any of the things that he supplies to those who imagine they are giving them to him.


    But those who think they can offer sacrifices to him with blood, fat, and whole burnt offerings, and honor him with such honors, seem to me no different from those who show the same respect toward deaf images. For the first group thinks it proper to make offerings to things unable to receive the honor, while the other makes offerings to one who needs nothing.'
translation:
  language: ko
  text: '3


    다음으로, 그리스도인들이 왜 유대인들과 같은 방식으로 종교를 실천하지 않는지 당신이 특히 듣고 싶어 하신다고 생각합니다.


    유대인들은 앞에서 말한 종류의 예배를 피하고, 우주의 한 분 하나님을 공경하며 그분을 주님으로 여긴다고 할 때에는 잘하는 것입니다. 그러나 앞서 언급한 것과 비슷한 방식으로 그분께 예배를 드릴 때에는 완전히 잘못하고 있습니다.


    그리스인들은 감각도 없고 듣지도 못하는 형상들에게 이런 것들을 바침으로써 어리석음을 드러냅니다. 그런데 유대인들은 마치 하나님께서 그런 것들을 필요로 하시는 것처럼 생각하여 그분께 바칩니다. 그러므로 이를 종교적 예배가 아니라 어리석은 일로 여기는 것이 마땅합니다.


    하늘과 땅과 그 안에 있는 모든 것을 지으시고 우리 모두에게 필요한 것을 공급하시는 분께서, 사람들이 그분께 드린다고 생각하는 바로 그들에게 친히 공급하신 것들 가운데 어느 하나라도 필요로 하실 수는 없습니다.


    그러나 피와 기름과 온전한 번제로 그분께 제사를 드리고 그런 존경으로 그분을 높인다고 생각하는 사람들은, 듣지 못하는 형상들에게 같은 존경을 표하는 사람들과 조금도 다르지 않아 보입니다. 한쪽은 그 존경을 받아 누릴 수 없는 것들에게 예물을 바치는 것이 합당하다고 여기고, 다른 쪽은 아무것도 필요로 하지 않으시는 분께 예물을 바치기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: practice their religion / θρησκεία 계열로 추정
  choice: 종교를 실천하다
  rationale: 공적 예배만이 아니라 종교적 관행 전반을 가리키는 문맥을 자연스러운 현대 한국어로 전달했습니다. 다만 직접적인 그리스어 대조가 아직 이루어지지 않았으므로 잠정적입니다.
- source_word: Master
  choice: 주님
  rationale: 하나님을 만물의 주권자로 인정한다는 뜻을 존중하면서, 한국어 종교 문맥에서 자연스럽고 품위 있게 표현했습니다.
- source_word: senseless and deaf images
  choice: 감각도 없고 듣지도 못하는 형상들
  rationale: '''senseless''를 단순히 ''무의미한''으로 오해하지 않도록 지각 능력이 없다는 뜻을 풀어 옮겼고, 우상이라는 해석을 본문에 과도하게 덧붙이지 않기 위해 ''형상''을 택했습니다.'
- source_word: whole burnt offerings
  choice: 온전한 번제
  rationale: 제물 전체를 불살라 드리는 제사의 성격을 드러내면서 성경 문체와 일반 독자의 이해를 함께 고려했습니다.
- source_word: participate in the honor
  choice: 그 존경을 받아 누리다
  rationale: 예물이 표현하는 존경에 실제로 참여하거나 그것을 향유할 능력이 없다는 대조를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 유대교 제사에 대한 저자의 논박
  choice: 저자의 비판을 역사적 문맥 그대로 직접적으로 번역했습니다.
  alternative: 현대의 유대교 일반에 대한 평가처럼 완화하거나 재구성할 수 있습니다.
  rationale: 본문의 논증과 긴장을 보존하되, 원문에 없는 현대적 일반화나 교파적 해설을 더하지 않았습니다.
- issue: 하나님의 무필요성과 희생 제사
  choice: 하나님은 인간이 드리는 물질을 필요로 하지 않으신다는 저자의 주장을 그대로 보존했습니다.
  alternative: 제사의 상징적·언약적 기능을 설명하여 비판의 범위를 제한할 수 있습니다.
  rationale: 그런 설명은 본문에 명시되어 있지 않으므로 삽입하지 않았습니다. 이 대목이 성경의 제사 규정과 일으키는 신학적 긴장도 해소하지 않았습니다.
- issue: 두 집단의 비교
  choice: 형상에게 바치는 이들과 아무것도 필요로 하지 않으시는 하나님께 바치는 이들을 저자가 '조금도 다르지 않다'고 비교하는 강도를 유지했습니다.
  alternative: ‘어떤 면에서는 비슷하다’처럼 완화할 수 있습니다.
  rationale: 논박의 수사적 강도를 약화하지 않으면서도 이를 번역자의 판단이 아니라 저자의 견해로 드러내기 위해 ‘보입니다’를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 그리스어 본문에 대한 직접 검토가 보류된 자료이므로, 제공된 공공 영역 영어 증언과 감수용 영어 POB를 대조해 작성한 잠정 번역입니다. 반복되는 ‘바치다’, ‘필요로 하다’, ‘존경’의 어휘 연결을 살려 논증 구조가 드러나게 했습니다.
