base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: ko
  text: '그러나 또한 음식에 관한 그들의 까다로운 규정, 안식일에 관한 미신, 할례의 허망함, 금식과 초하루 절기에 나타나는 위선은 우스꽝스럽고 생각할 가치조차 없다는 것을, 내가 굳이 가르쳐 드릴 필요는 [없다고][a] 생각합니다.


    하나님께서 사람이 쓰도록 창조하신 것들 가운데 어떤 것은 잘 지어진 것으로 받아들이면서, 다른 것은 쓸모없고 불필요하다고 물리치는 것이 불경한 일이 아니겠습니까?


    또 하나님께서 안식일에는 어떤 선한 일도 하지 못하게 하셨다는 듯이 하나님을 두고 거짓말하는 것이 신성모독이 아니겠습니까?


    또 육체를 베어 낸 것을 선택받았다는 표지로 자랑하며, 그것 때문에 자신들이 하나님의 특별한 사랑을 받는다는 듯이 여기는 것이 우스꽝스럽지 않겠습니까?


    또 별과 달을 살피고 달과 날을 지키며, 하나님께서 정하신 질서와 계절의 변화를 자기들 욕망에 따라 구분하여 어떤 때는 축제로, 다른 때는 애도의 기간으로 삼는 일을, 누가 경건의 표현으로 여기겠습니까? 오히려 훨씬 더 어리석은 일로 여기지 않겠습니까?


    그러므로 그리스도인들이 유대인들에게 널리 퍼진 어리석음과 오류, 그리고 그들의 지나친 세세함과 교만을 멀리하는 것이 옳다는 점은 이미 충분히 배우셨다고 생각합니다. 그러나 그리스도인들 고유의 신앙이 지닌 신비에 대해서는, 사람이 가르쳐 줄 수 있으리라고 기대하지 마십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘없다고’는 전승 본문의 뜻을 바로잡기 위해 보충된 말입니다. 이를 빼면 문맥과 반대되는 뜻이 됩니다.
    reason: 제공된 원문 증거와 영어 증언이 [not]이라는 본문 복원 표지를 보존하므로 한국어에서도 대괄호로 표시했습니다.
lexical_decisions:
- source_word: scruples concerning meats
  choice: 음식에 관한 그들의 까다로운 규정
  rationale: 단순한 양심의 거리낌보다 음식 구별에 관한 세세한 종교적 준수를 비판하는 문맥을 자연스럽게 전달했습니다.
- source_word: superstition relating to the Sabbath
  choice: 안식일에 관한 미신
  rationale: 원문의 강한 논박 어조를 완화하지 않고 보존했습니다.
- source_word: dissimulation
  choice: 위선
  rationale: 겉으로 꾸미거나 진실을 감춘다는 비판적 의미를 간결하게 나타냈습니다.
- source_word: new moons
  choice: 초하루 절기
  rationale: 달 자체가 아니라 초하루에 행하는 종교적 준수를 가리키므로 독자가 뜻을 알 수 있게 번역했습니다.
- source_word: mutilation of the flesh
  choice: 육체를 베어 낸 것
  rationale: 할례를 비판적으로 묘사하는 원문의 수사적 강도를 살리되 현대 한국어에서 지나치게 의학적인 표현은 피했습니다.
- source_word: token of election
  choice: 선택받았다는 표지
  rationale: 신적 선택의 징표라는 의미를 교파적 전문용어에 치우치지 않게 표현했습니다.
- source_word: arrangements of God
  choice: 하나님께서 정하신 질서
  rationale: 창조 세계와 시간에 부여된 배열·질서라는 폭넓은 뜻을 보존했습니다.
- source_word: their own religion
  choice: 그리스도인들 고유의 신앙
  rationale: 현대 한국어에서 ‘종교’보다 문맥상 자연스럽고, 앞의 유대 관습과 대비되는 그리스도교 신앙을 분명히 했습니다.
theological_decisions:
- issue: 안식일 규정에 대한 저자의 비판 범위
  choice: ‘어떤 선한 일도 하지 못하게 하셨다’는 주장에 대한 비판으로 번역
  alternative: 안식일 준수 자체를 전면 부정하는 것으로 번역
  rationale: 본문은 하나님이 안식일에 모든 선행을 금하셨다는 식의 진술을 거짓이라고 공격하므로, 그 이상의 교리적 결론을 덧붙이지 않았습니다.
- issue: 할례와 하나님의 사랑의 관계
  choice: 할례 때문에 특별한 사랑을 받는다는 자랑을 비판하는 것으로 표현
  alternative: 하나님이 유대인을 사랑하지 않으신다는 단정
  rationale: 본문의 논지는 육체의 표지를 선택과 특별한 사랑의 근거로 자랑하는 태도에 있으므로, 하나님의 사랑 자체에 관한 더 넓은 주장을 삽입하지 않았습니다.
- issue: 사람에게서 배울 수 없는 신비
  choice: ‘사람이 가르쳐 줄 수 있으리라고 기대하지 마십시오’로 열린 표현 유지
  alternative: 오직 직접 계시로만 알 수 있다고 명시
  rationale: 본문이 인간 교육의 한계를 말하지만 그 대안의 방식은 이 절에서 명시하지 않으므로 신학적으로 보충하지 않았습니다.
- issue: 유대인들에 대한 고대 논박의 거친 표현
  choice: 역사적 저자의 비판적 어조를 본문에 보존
  alternative: 현대적 감수성에 맞게 완곡하게 순화
  rationale: 원문의 역사적·신학적 긴장을 숨기지 않았습니다. 다만 ‘common’은 모든 유대인에 대한 본질적 규정처럼 들리지 않도록 ‘널리 퍼진’으로 처리했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 논박문의 반복되는 수사 의문과 날카로운 어조를 유지하면서도 문장을 오늘날 독자가 이해할 수 있게 정돈했습니다. 직접 그리스어 대조가 아직 이루어지지 않았으므로, 제공된 공용 영어 증언과 감사된 영어 POB를 바탕으로 한 잠정 출판 초안입니다.
