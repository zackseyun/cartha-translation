  yaml_path: translation/extra_canonical/epistle_to_diognetus/002.yaml
  text: 'Come, then, clear your mind of all the preconceptions that occupy it, throw off the habit that leads you astray, and become, as it were, a new person from the beginning—someone ready to hear a new account, just as you yourself confessed. Look not only with your eyes but also with your understanding at the substance and form of those whom you call and regard as gods.


    Is not one of them stone, like what we tread underfoot, and another bronze, no better than the vessels forged for our use; another wood, which has already rotted; another silver, which needs someone to guard it so that it is not stolen; another iron, which is corroded by rust; and another earthenware, no more attractive than what is supplied for the most dishonorable service?


    Are not all these made of perishable material? Are they not fashioned by iron and fire? Did not the sculptor make one, the bronze-worker another, the silversmith another, and the potter another? Before they were molded into these shapes by the skills of these various craftspeople, could not each of them have been reshaped and made to resemble these various utensils? Could not the vessels now made from the same material, if they came into the hands of the same craftspeople, be made like these gods?


    Could not these things that you now worship be made again by human hands into vessels like the rest? Are they not all deaf and blind? Are they not without souls, without senses, and motionless? Do they not all rot and decay?


    These things you call gods; to these you are slaves; these you worship; and you end up becoming altogether like them.


    Therefore you hate the Christians because they do not consider these things to be gods.


    For do not you yourselves, who now regard and worship them, despise them much more? Do you not rather mock and insult them by leaving those made of stone and earthenware unguarded, while locking up those made of silver and gold at night and setting guards over them by day to prevent them from being stolen?


    As for the honors you think you offer them, if they can perceive them, you actually punish them by these honors; but if they cannot perceive them, you reproach them by trying to appease them with the blood and fat of sacrificial victims.


    Let one of you undergo this treatment; let him submit to having these things done to him. No, not even a single person would willingly submit to such punishment, because he has feeling and reason. But a stone submits because it has no feeling. Therefore you convict its sensibility.


    Well, I could say much more about the Christians not being enslaved to gods such as these. But if anyone considers what has been said insufficient, I think it unnecessary to say more.'
translation:
  language: ko
  text: '그러므로 이제 그대의 마음을 사로잡고 있는 온갖 선입견을 깨끗이 떨쳐 버리고, 그대를 그릇된 길로 이끄는 습관을 벗어 버리십시오. 그대 자신이 고백한 대로, 새로운 이야기를 들으려는 사람답게 처음부터 새사람이 되십시오. 그대들이 신이라고 부르며 여기는 것들이 어떤 재료로, 어떤 모양으로 되어 있는지 눈으로만 보지 말고 이성으로도 살펴보십시오.


    그 가운데 하나는 우리가 발로 밟고 다니는 것과 같은 돌이 아닙니까? 다른 하나는 우리가 쓰려고 만든 그릇보다 나을 것이 없는 청동이고, 또 다른 하나는 이미 썩어 버린 나무가 아닙니까? 또 하나는 도둑맞지 않도록 사람이 지켜야 하는 은이고, 다른 하나는 녹이 스는 쇠이며, 또 다른 하나는 가장 천한 용도에 쓰이는 그릇보다 조금도 더 아름답지 않은 질그릇이 아닙니까?


    이 모든 것은 썩어 없어질 재료로 된 것이 아닙니까? 쇠 연장과 불로 만들어진 것이 아닙니까?[a] 하나는 조각가가, 다른 하나는 청동 세공인이, 또 다른 하나는 은세공인이, 또 다른 하나는 도공이 만들지 않았습니까? 여러 장인의 솜씨로 지금의 모양이 되기 전에는, 그것들 하나하나를 다른 모양으로 바꾸어 갖가지 생활 도구처럼 만들 수도 있지 않았겠습니까? 지금 같은 재료로 만든 그릇들도 같은 장인들의 손에 들어가면 저 신상들과 같은 모양으로 만들어질 수 있지 않겠습니까?


    그대들이 지금 숭배하는 이것들도 사람의 손으로 다시 만들어 다른 그릇들과 같은 것이 될 수 있지 않겠습니까? 그것들은 모두 듣지도 보지도 못하지 않습니까? 혼도 없고 감각도 없으며 움직이지도 못하지 않습니까? 모두 썩고 부패하지 않습니까?


    그대들은 이런 것들을 신이라고 부르고, 이런 것들의 종이 되며, 이런 것들을 숭배합니다. 그러다가 마침내 그것들과 완전히 닮아 갑니다.


    그러므로 그대들은 그리스도인들이 이것들을 신으로 여기지 않는다는 이유로 그들을 미워합니다.


    그러나 지금 이것들을 신으로 여기고 숭배하는 그대들이 오히려 그것들을 훨씬 더 업신여기는 것이 아닙니까? 돌과 질그릇으로 된 것은 지키지 않은 채 숭배하면서, 은과 금으로 된 것은 도둑맞지 않게 밤에는 가두어 두고 낮에는 경비를 세우니, 오히려 그것들을 조롱하고 모욕하는 것이 아닙니까?


    그대들은 그것들에게 영예를 바친다고 생각합니다. 그러나 그것들이 이를 느낄 수 있다면 그 영예로 오히려 그것들을 괴롭히는 셈이고, 느낄 수 없다면 희생 제물의 피와 기름으로 달래려 함으로써 오히려 그것들을 모욕하는 셈입니다.


    그대들 가운데 한 사람이라도 이런 대우를 받아 보게 하십시오. 이런 일들을 자기에게 하도록 내버려 두게 하십시오. 아닙니다. 감각과 이성이 있으므로 단 한 사람도 그런 고통을 기꺼이 받아들이지 않을 것입니다. 그러나 돌은 감각이 없으므로 그대로 당합니다. 그러므로 그대들은 그 돌에 감각이 있음을 입증하는 셈입니다.[b]


    그리스도인들이 이런 신들의 종이 되지 않는다는 점에 관해서라면 나는 이 밖에도 많은 말을 할 수 있습니다. 그러나 지금까지 한 말이 부족하다고 여기는 사람이 있다 해도, 나는 더 말하는 것이 쓸데없다고 생각합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘쇠 연장과 불’은 신상 제작에 쓰이는 도구와 공정을 가리키는 표현입니다.
    reason: 영어 증언의 ‘forged by iron and fire’가 문자적으로는 다소 모호하여 문맥상의 의미를 밝혔습니다.
  - marker: b
    text: ‘그 돌에 감각이 있음을 입증하는 셈입니다’라는 말은 바로 앞의 ‘돌은 감각이 없다’는 진술과 긴장을 이룹니다. 현존 증언의 문면을 고치지 않고 그대로 살렸습니다. 직접적인 그리스어 원문 검토가 이루어지면 재확인이 필요합니다.
    reason: 전승 또는 번역상의 난점일 가능성이 있으나, 제공된 자료만으로 ‘없음’으로 교정할 근거가 충분하지 않습니다.
lexical_decisions:
- source_word: prepossessions
  choice: 선입견
  rationale: 마음을 미리 점유하여 판단을 흐리는 관념이라는 문맥을 현대 한국어로 자연스럽게 전달합니다.
- source_word: intellect
  choice: 이성
  rationale: 단순한 시각적 관찰과 대비되는 숙고와 분별의 능력을 나타냅니다.
- source_word: substance
  choice: 재료
  rationale: 이어지는 돌·청동·나무·은 등의 물질 목록에 맞추어 추상적인 ‘본질’보다 구체적인 제작 재료를 가리키도록 했습니다.
- source_word: gods
  choice: 신 / 신상
  rationale: 논증의 대상은 신으로 숭배되는 제작물이므로 일반적으로는 ‘신’, 물리적 형상을 강조하는 대목에서는 ‘신상’으로 문맥화했습니다.
- source_word: propitiating
  choice: 달래려 하다
  rationale: 피와 기름을 바쳐 호의를 얻거나 노여움을 누그러뜨리려는 제의 행위를 교파적 전문용어 없이 표현합니다.
- source_word: soul-less
  choice: 혼도 없다
  rationale: 고대 인간론적 어휘를 ‘생명’으로 단순화하지 않고, 원문의 구별과 긴장을 보존합니다.
theological_decisions:
- issue: 우상과 숭배자의 유사성
  choice: ‘마침내 그것들과 완전히 닮아 갑니다’로 보존
  alternative: 영적으로 무감각해진다는 뜻으로 풀어 번역
  rationale: 원문 증언의 수사적·신학적 함의를 특정 해석으로 제한하지 않았습니다.
- issue: 마지막 ‘감각을 입증한다’ 문장의 역설 또는 본문 난점
  choice: 문면대로 번역하고 각주로 긴장을 알림
  alternative: ‘감각이 없음을 입증한다’로 교정
  rationale: 제공된 증언은 앞 문장과 긴장되지만, 그 긴장을 임의로 해소할 직접 그리스어 검토 자료가 없으므로 보존했습니다.
- issue: 희생 제의 비판의 범위
  choice: 우상에게 바치는 피와 기름의 행위에 한정
  alternative: 모든 희생 제의에 대한 보편적 비판으로 확대
  rationale: 문맥을 넘어서는 교리적 일반화를 피했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 저자가 디오그네투스 개인에게 권면하는 첫머리에서는 단수 ‘그대’를, 우상 숭배자들을 집단적으로 논박하는 대목에서는 복수 ‘그대들’을 사용하여 영어 증언의 수 변화를 반영했습니다. 반복되는 수사 의문과 병렬 구조를 유지하되, ordinary modern readers가 따라가기 쉽도록 문장을 적절히 나누었습니다. 직접 그리스어 원문 검토가 보류된 상태이므로 이 초안은 제공된 공공 영역 영어 증언과 감사된 POB 상담층에 근거한 잠정 출판 초안입니다.
