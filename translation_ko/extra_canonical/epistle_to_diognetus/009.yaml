base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/009.yaml
  text: 'Having already planned everything in His mind with His Son, He permitted us during the former time to be borne along by disorderly impulses as we desired, led astray by pleasures and lusts, not at all because He took delight in our sins, but because He bore with us; not because He approved of the past season of iniquity, but because He was creating the present season of righteousness. Thus, being convicted in the past time by our own deeds as unworthy of life, we might now be made deserving by the goodness of God; and, having made clear our inability to enter into the kingdom of God of ourselves, we might be enabled by the ability of God.


    And when our iniquity had been fully accomplished, and it had been made perfectly manifest that punishment and death were expected as its recompense, the season came which God had ordained, when henceforth He should manifest His goodness and power. O the exceeding great kindness and love of God! He hated us not, neither rejected us, nor bore us malice, but was long-suffering and patient; and in pity for us took upon Himself our sins, and Himself parted with His own Son as a ransom for us: the holy for the lawless, the guileless for the evil, the just for the unjust, the incorruptible for the corruptible, the immortal for the mortal.


    For what else but His righteousness would have covered our sins?


    In whom was it possible for us, lawless and ungodly people, to have been justified, save only in the Son of God?


    O the sweet exchange! O the inscrutable creation! O the unexpected benefits! That the iniquity of many should be concealed in One Righteous Man, and the righteousness of One should justify many that are iniquitous!


    Having then in the former time demonstrated the inability of our nature to obtain life, and having now revealed a Savior able to save even creatures which have no ability, He willed that for both reasons we should believe in His goodness and should regard Him as nurse, father, teacher, counselor, physician, mind, light, honor, glory, strength, and life.'
translation:
  language: ko
  text: '하나님께서는 이처럼 모든 것을 이미 마음속에서 그분의 아들과 함께 계획하신 뒤, 지난날에는 우리가 원하는 대로 무질서한 충동에 휩쓸리고 쾌락과 욕망에 미혹되도록 내버려 두셨습니다. 그것은 결코 그분께서 우리의 죄를 기뻐하셨기 때문이 아니라 우리를 참아 주셨기 때문이며, 지나간 불의의 때를 좋게 여기셨기 때문이 아니라 지금의 의의 때를 마련하고 계셨기 때문입니다. 그리하여 지난날에는 우리 자신의 행위로 말미암아 생명을 누리기에 합당하지 않다는 판결을 받은 우리가 이제는 하나님의 선하심으로 합당하게 되고, 우리 스스로는 하나님의 나라에 들어갈 수 없다는 사실이 분명해진 뒤에는 하나님의 능력으로 들어갈 수 있게 하려 하신 것입니다.


    우리의 불의가 가득 차고 그 대가로 형벌과 죽음이 기다리고 있다는 사실이 완전히 드러났을 때, 마침내 하나님께서 정하신 때, 곧 그분의 선하심과 능력을 나타내실 때가 왔습니다. 오, 하나님의 지극히 크신 인자하심과 사랑이여! 그분은 우리를 미워하지도, 버리지도, 원한을 품지도 않으셨습니다. 오히려 오래 참고 인내하셨으며, 우리를 불쌍히 여기셔서 우리의 죄를 친히 짊어지시고 그분의 아들을 우리를 위한 몸값으로 내어 주셨습니다. 거룩하신 분을 불법한 자들을 위하여, 속임이 없으신 분을 악한 자들을 위하여, 의로우신 분을 불의한 자들을 위하여, 썩지 않으시는 분을 썩을 자들을 위하여, 죽지 않으시는 분을 죽을 자들을 위하여 내어 주신 것입니다.


    그분의 의가 아니고 무엇이 우리의 죄를 덮을 수 있었겠습니까?


    불법하고 경건하지 않은 우리가 하나님의 아들 안에서가 아니고 누구 안에서 의롭다 하심을 받을 수 있었겠습니까?


    오, 감미로운 맞바꿈이여! 오, 헤아릴 수 없는 창조의 역사여![a] 오, 뜻밖의 은혜여! 많은 사람의 불의가 의로우신 한 분 안에 감추어지고, 한 분의 의가 불의한 많은 사람을 의롭게 하다니!


    이처럼 하나님께서는 지난날에는 우리 본성이 생명을 얻을 능력이 없음을 보여 주셨고, 이제는 무능한 피조물까지도 구원하실 수 있는 구원자를 드러내셨습니다. 하나님께서는 이 두 가지로 말미암아 우리가 그분의 선하심을 믿고, 그분을 양육자와 아버지와 스승과 조언자와 의사와 지혜[b]와 빛과 영예와 영광과 능력과 생명으로 여기기를 바라셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘창조의 역사’는 제공된 영어 증거문의 ‘creation’을 옮긴 것입니다. 이 말은 문맥상 하나님의 놀라운 구원 행위나 경륜을 가리킬 수도 있으므로, 그리스어 원문 대조가 필요합니다.
    reason: 직접적인 그리스어 검토가 보류된 상태에서 의미론적 불확실성을 보존하기 위해서입니다.
  - marker: b
    text: ‘지혜’는 제공된 영어 증거문의 ‘mind’를 문맥에 맞게 옮긴 것입니다. 직역하면 ‘정신’ 또는 ‘마음’이 될 수 있으며, 정확한 뜻은 그리스어 원문 대조가 필요합니다.
    reason: 열거문의 자연스러움을 확보하되 기초 증거문의 잠재적 다의성을 밝히기 위해서입니다.
lexical_decisions:
- source_word: ransom
  choice: 몸값
  rationale: 대속의 배경을 지닌 ‘ransom’의 거래·해방 이미지를 살리되 특정 교리 체계로 좁히지 않았습니다.
- source_word: the just / One Righteous Man
  choice: 의로우신 분 / 의로우신 한 분
  rationale: 그리스도를 가리키는 문맥을 존중하면서 원문의 수사적 반복과 단수성을 보존했습니다.
- source_word: covered / concealed
  choice: 덮다 / 감추어지다
  rationale: 두 문장의 서로 다른 은유를 하나로 평준화하지 않고 각각 유지했습니다.
- source_word: nurse
  choice: 양육자
  rationale: 현대 한국어에서 ‘유모’보다 성별과 시대적 한정이 덜하고, 돌보고 길러 주는 기능을 자연스럽게 전달합니다.
- source_word: mind
  choice: 지혜
  rationale: 문맥상 하나님을 신뢰하고 의지할 대상으로 열거하는 표현에 맞추어 자연스럽게 옮겼으나, 영어 증거문의 직역은 ‘정신/마음’일 수 있어 각주로 불확실성을 밝혔습니다.
theological_decisions:
- issue: ‘made deserving’의 자격·공로 함의
  choice: 하나님의 선하심으로 합당하게 되고
  alternative: 하나님의 선하심으로 자격을 얻게 되고
  rationale: 수동성과 하나님의 선하심이라는 근거를 보존하면서, 인간의 자력 공로를 암시할 수 있는 표현은 피했습니다.
- issue: 하나님이 ‘우리의 죄를 친히 짊어지셨다’는 표현의 주어
  choice: 증거문에 따라 하나님을 문법적 주어로 유지
  alternative: 그 아들이 우리의 죄를 짊어지셨다
  rationale: 뒤이어 아들을 내어 주셨다는 구절과 긴장이 있지만, 증거문이 가진 표현을 교리적으로 재구성하지 않았습니다.
- issue: ‘One Righteous Man’과 ‘One’의 정체
  choice: 의로우신 한 분 / 한 분
  alternative: 예수 그리스도
  rationale: 문맥상 하나님의 아들을 뜻하지만, 본문의 호칭과 수사적 여백을 그대로 보존했습니다.
- issue: ‘creation’의 의미
  choice: 창조의 역사
  alternative: 경륜 / 새 창조 / 계획
  rationale: 제공된 영어 증거문만으로 의미를 확정하기 어려워 직역 계열을 택하고 각주에서 원어 대조 필요성을 표시했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 긴 대조 문장은 원문의 장중한 수사와 반복을 살리면서도 문장 경계를 조정해 일반 독자가 따라가기 쉽게 했습니다. ‘불법한 자’, ‘경건하지 않은’, ‘의롭다 하심’ 등은 초기 기독교 문헌의 법정적·윤리적 어조를 유지하는 범위에서 사용했습니다. 이 초안은 제공된 공공영역 영어 증거문을 바탕으로 한 잠정 번역이며, 소실된 Codex Argentoratensis의 전사 자료와 그리스어 본문에 대한 직접 검토가 필요합니다.
