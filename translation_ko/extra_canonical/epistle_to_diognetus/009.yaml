    불법하고 경건하지 않은 우리가 하나님의 아들 안에서가 아니고 누구 안에서 의롭다 하심을 받을 수 있었겠습니까?



    오, 감미로운 맞바꿈이여! 오, 헤아릴 수 없는 이루심이여![a] 오, 뜻밖의 은혜여! 많은 사람의 불의가 의로우신 한 분 안에 감추어지고, 한 분의 의가 불의한 많은 사람을 의롭게 하다니!



    이처럼 하나님께서는 지난날에는 우리 본성이 생명을 얻을 능력이 없음을 보여 주셨고, 이제는 무능한 피조물까지도 구원하실 수 있는 구원자를 드러내셨습니다. 하나님께서는 이 두 가지로 말미암아 우리가 그분의 선하심을 믿고, 그분을 양육자와 아버지와 스승과 조언자와 의사와 지성[b]과 빛과 영예와 영광과 능력과 생명으로 여기기를 바라셨습니다.'
