  revised_text: '한마디로 말해, 몸 안에서 혼이 하는 역할을 그리스도인들이 세상에서 합니다.


    혼은 몸의 모든 지체에 두루 퍼져 있고, 그리스도인들은 세상의 여러 도시에 두루 퍼져 있습니다.


    혼은 몸 안에 살지만 몸에 속한 것은 아닙니다. 이와 같이 그리스도인들도 세상 안에 살지만 세상에 속한 것은 아닙니다.


    보이지 않는 혼은 보이는 몸 안에 지켜져 있습니다. 이와 같이 그리스도인들이 세상에 있다는 것은 알려져 있지만, 그들의 경건은 보이지 않은 채 남아 있습니다.[a]


    육체는 혼에게 아무런 해도 입지 않았으면서 혼을 미워하고 맞서 싸웁니다. 혼이 육체가 쾌락을 누리지 못하게 하기 때문입니다. 이와 같이 세상도 그리스도인들에게 아무런 해도 입지 않았으면서 그들을 미워합니다. 그리스도인들이 세상이 쾌락을 누리지 못하게 하기 때문입니다.


    혼은 자기를 미워하는 육체와 그 지체들을 사랑합니다. 이와 같이 그리스도인들도 자기를 미워하는 사람들을 사랑합니다.


    혼은 몸 안에 갇혀 있지만, 오히려 몸을 붙들어 줍니다. 이와 같이 그리스도인들도 감옥에 갇혀 있는 것처럼 세상 안에 붙들려 있지만, 오히려 그들이 세상을 붙들어 줍니다.


    혼은 불멸하지만 죽을 수밖에 없는 장막 안에 삽니다. 이와 같이 그리스도인들도 썩어 없어질 것들 가운데 나그네로 살면서, 하늘에 있는 썩지 않음을 기다립니다.


    혼은 먹고 마시는 일로 모질게 다루어질 때 더욱 자랍니다. 이와 같이 그리스도인들도 벌을 받을 때 날마다 더욱더 늘어납니다.[b]


    하나님께서 그들에게 맡기신 임무가 이토록 크므로, 그들은 그것을 저버려서는 안 됩니다.'
