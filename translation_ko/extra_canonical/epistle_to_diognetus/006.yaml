base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/006.yaml
  text: 'In a word, what the soul is in a body, Christians are in the world.


    The soul is spread throughout all the members of the body, and Christians throughout the various cities of the world.


    The soul lives in the body, yet it is not of the body. In the same way, Christians live in the world, yet they are not of the world.


    The soul, which is invisible, is guarded within the visible body. In the same way, Christians are recognized as being in the world, yet their religion remains invisible.


    The flesh hates the soul and wages war against it, though it has suffered no wrong, because it is forbidden to indulge in pleasures. In the same way, the world hates Christians, though it has suffered no wrong from them, because they oppose its pleasures.


    The soul loves the flesh that hates it, and loves the body''s members. In the same way, Christians love those who hate them.


    The soul is enclosed in the body, yet it holds the body together. In the same way, Christians are kept in the world as in a prison, yet they themselves hold the world together.


    The soul, though itself immortal, lives in a mortal tent. In the same way, Christians live as strangers among perishable things while they await the imperishability that is in the heavens.


    The soul improves when treated harshly with respect to food and drink. In the same way, when Christians are punished, they increase more and more each day.


    So great is the role to which God has appointed them, and they are not permitted to refuse it.'
translation:
  language: ko
  text: '한마디로 말해, 몸 안에서 혼이 하는 역할을 그리스도인들이 세상에서 합니다.


    혼은 몸의 모든 지체에 두루 퍼져 있고, 그리스도인들은 세상의 여러 도시에 두루 퍼져 있습니다.


    혼은 몸 안에 살지만 몸에 속한 것은 아닙니다. 이와 같이 그리스도인들도 세상 안에 살지만 세상에 속한 것은 아닙니다.


    보이지 않는 혼은 보이는 몸 안에 지켜져 있습니다. 이와 같이 그리스도인들이 세상에 있다는 것은 알려져 있지만, 그들의 경건은 보이지 않은 채 남아 있습니다.[a]


    육체는 혼에게 아무런 해도 입지 않았으면서 혼을 미워하고 맞서 싸웁니다. 혼이 육체가 쾌락을 누리지 못하게 하기 때문입니다. 이와 같이 세상도 그리스도인들에게 아무런 해도 입지 않았으면서 그들을 미워합니다. 그리스도인들이 세상이 쾌락을 누리지 못하게 하기 때문입니다.


    혼은 자기를 미워하는 육체와 그 지체들을 사랑합니다. 이와 같이 그리스도인들도 자기를 미워하는 사람들을 사랑합니다.


    혼은 몸 안에 갇혀 있지만, 오히려 몸을 붙들어 줍니다. 이와 같이 그리스도인들도 감옥에 갇혀 있는 것처럼 세상 안에 붙들려 있지만, 오히려 그들이 세상을 붙들어 줍니다.


    혼은 불멸하지만 죽을 수밖에 없는 장막 안에 삽니다. 이와 같이 그리스도인들도 썩어 없어질 것들 가운데 나그네로 살면서, 하늘에 있는 썩지 않음을 기다립니다.


    혼은 먹고 마시는 일로 모질게 다루어질 때 더욱 자랍니다. 이와 같이 그리스도인들도 벌을 받을 때 날마다 더욱더 늘어납니다.[b]


    하나님께서 그들에게 맡기신 임무가 이토록 크므로, 그들은 그것을 저버려서는 안 됩니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경건’은 그리스어 θεοσέβεια를 옮긴 말로, 하나님을 경외하고 예배하는 삶을 가리킵니다.
    reason: 원문의 핵심어가 단순한 내적 믿음 일반보다 하나님을 향한 경외와 경건을 뜻함을 반영합니다.
  - marker: b
    text: ‘늘어납니다’는 수가 많아진다는 뜻을 기본으로 하면서, 문맥상 박해 가운데 더욱 자라고 강해지는 뉘앙스도 내포할 수 있습니다.
    reason: 그리스어 αὐξάνεται의 증가·성장 의미를 한쪽으로 과도하게 제한하지 않습니다.
lexical_decisions:
- source_word: soul (Greek source review pending)
  choice: 혼
  rationale: 몸과 대비되는 인간의 비물질적 생명 원리를 가리키는 고대의 혼-몸 비유를 유지하면서, 문맥상 반복되는 전문적 대응 관계를 선명하게 보존했습니다.
- source_word: religion
  choice: 신앙
  rationale: 현대 한국어에서 ‘종교’가 제도나 종교 체계를 주로 떠올리게 할 수 있어, 외적으로 보이지 않는 그리스도인들의 믿음과 경건한 삶을 자연스럽게 포괄하는 ‘신앙’을 택했습니다. 다만 고대 그리스어 직접 대조가 필요합니다.
- source_word: hold together
  choice: 하나로 붙들어 주다
  rationale: 단순히 보존한다는 뜻보다 몸과 세상의 결속을 유지한다는 비유를 드러내고, 혼과 그리스도인의 평행 구조를 같은 표현으로 보존했습니다.
- source_word: mortal tabernacle / tent
  choice: 죽을 장막
  rationale: 임시 거처라는 비유적 성격과 죽을 수밖에 없는 몸의 성격을 함께 살렸습니다.
- source_word: imperishability
  choice: 썩지 않음
  rationale: 추상 명사인 불멸성으로 단정하기보다 ‘썩어 없어질 것들’과의 어휘적 대조를 보존했습니다.
- source_word: office / role
  choice: 자리
  rationale: 하나님이 정해 맡기신 역할·직분을 뜻하되 교회 제도상의 특정 직분으로 오해되지 않도록 넓고 자연스러운 표현을 택했습니다.
theological_decisions:
- issue: ‘세상에 속하지 않음’의 의미
  choice: 세상 안에 살지만 세상에 속한 것은 아니다
  alternative: 세상에서 유래하지 않았다
  rationale: 존재의 기원과 윤리적 소속을 모두 함축할 수 있는 표현을 유지하여 신학적 의미를 한쪽으로 제한하지 않았습니다.
- issue: 그리스도인들이 세상을 ‘붙든다’는 진술
  choice: 그들이 세상을 하나로 붙들어 준다
  alternative: 그들이 세상을 보존한다
  rationale: 원문의 대담한 혼-몸 평행을 약화하거나 특정한 섭리론으로 풀이하지 않고 비유 자체를 그대로 제시했습니다.
- issue: 박해 속에서 그리스도인들이 ‘증가한다’는 의미
  choice: 날마다 더욱 늘어난다
  alternative: 날마다 더욱 강해진다
  rationale: 수적 증가와 영적 성장을 모두 열어 둘 가능성이 있어, 공급된 증거의 ‘increase’를 직접 반영하고 각주로 중의성을 밝혔습니다.
- issue: 하늘에 있는 ‘썩지 않음’
  choice: 하늘에 있는 썩지 않음을 기다린다
  alternative: 하늘의 불멸을 기다린다
  rationale: 부활, 영생, 불멸 가운데 하나로 명시적으로 환원하지 않고 추상적이고 종말론적인 표현을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 반복되는 ‘혼—그리스도인’ 평행 구조를 문단마다 유지해 수사적 리듬을 살렸습니다. 제공 자료가 고대 그리스어 본문 자체가 아니라 J. B. Lightfoot의 공개 영어 증언이며 원어 검토가 보류된 상태이므로, 원어 표제어를 확정적으로 재구성하지 않고 중요한 잠정 판단을 각주와 결정 사항에 명시했습니다.
