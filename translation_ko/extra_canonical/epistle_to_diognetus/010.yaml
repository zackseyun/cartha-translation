base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/010.yaml
  text: 'If you also desire this faith, first grasp the full knowledge of the Father.


    For God loved those for whose sake he made the world, to whom he subjected everything on earth, to whom he gave reason and understanding, whom alone he permitted to look up to heaven, whom he created in his own image, to whom he sent his only-begotten Son, to whom he promised the kingdom in heaven, and to whom he will give it—those who have loved him.


    And when you have attained this full knowledge, with what joy do you think you will be filled? How will you love him who loved you first?


    By loving him, you will imitate his goodness. Do not be amazed that a human being can imitate God. One can, if God wills it.


    For happiness does not consist in ruling over one’s neighbors, desiring to have more than weaker people, possessing wealth, or using force against inferiors. No one can imitate God in these matters; indeed, these things lie outside his greatness.


    But whoever takes upon himself his neighbor’s burden, whoever desires to benefit someone worse off in an area where he himself is better off, and whoever supplies those in need with possessions he received from God, becoming a god to those who receive them from him—this person imitates God.


    Then, although you are placed on earth, you will see that God lives in heaven. Then you will begin to declare the mysteries of God. Then you will both love and admire those who are punished because they refuse to deny God. Then you will condemn the deceit and error of the world, when you perceive the true life that is in heaven, when you despise the apparent death that is here on earth, and when you fear the real death reserved for those who will be condemned to the eternal fire, which will punish those delivered over to it until the end.


    Then you will admire those who endure, for righteousness’ sake, the fire that lasts only for a season, and you will count them blessed when you perceive that fire...'
translation:
  language: ko
  text: '그대도 이 믿음을 원한다면, 먼저 아버지를 온전히 아는 지식을 붙드십시오.


    하나님께서는 세상을 바로 그들을 위하여 지으실 만큼 사람들을 사랑하셨습니다.[a] 땅에 있는 모든 것을 그들에게 복종시키셨고, 그들에게 이성과 지성을 주셨으며, 오직 그들만 하늘을 우러러보게 하셨습니다. 그들을 자신의 형상대로 지으셨고, 그들에게 자신의 독생자를 보내셨으며, 하늘에 있는 나라를 약속하셨고, 자신을 사랑한 이들에게 그 나라를 주실 것입니다.


    그대가 이 온전한 지식에 이르면, 얼마나 큰 기쁨으로 가득 차겠습니까? 그대를 먼저 사랑하신 분을 얼마나 사랑하게 되겠습니까?


    그분을 사랑하면 그분의 선하심을 본받게 될 것입니다. 사람이 하나님을 본받을 수 있다는 사실을 놀랍게 여기지 마십시오. 하나님께서 원하시면 사람은 그렇게 할 수 있습니다.


    행복은 이웃을 지배하는 데 있지 않고, 자신보다 약한 사람보다 더 많이 가지려는 데 있지도 않으며, 재물을 소유하고 자기보다 낮은 사람들에게 힘을 휘두르는 데 있지도 않습니다. 이런 일로는 아무도 하나님을 본받을 수 없습니다. 오히려 이런 것들은 그분의 위대하심과는 아무 상관이 없습니다.


    그러나 이웃의 짐을 스스로 지는 사람, 자신이 더 나은 처지에 있는 바로 그 점에서 더 어려운 처지에 있는 사람을 도우려는 사람, 하나님께 받은 재물을 궁핍한 이들에게 나누어 주어 그것을 받는 이들에게 하나님과 같은 존재가 되는 사람은 하나님을 본받는 사람입니다.[b]


    그러면 그대는 땅에 있으면서도 하나님께서 하늘에 살아 계심을 보게 될 것입니다. 그때 그대는 하나님의 신비를 선포하기 시작할 것입니다. 하나님을 부인하지 않는다는 이유로 형벌받는 이들을 사랑하고 경탄하게 될 것입니다. 하늘에 있는 참생명을 깨닫고, 이 땅에서 죽음처럼 보이는 것을 하찮게 여기며, 영원한 불에 넘겨져 끝까지 형벌받을 자들을 위하여 마련된 참된 죽음을 두려워할 때, 그대는 세상의 속임수와 미혹을 정죄하게 될 것입니다.


    그때 그대는 의를 위하여 잠시 타는 불을 견디는 이들에게 경탄할 것이며, 그 불을 깨닫게 될 때 그들을 복되다고 여길 것입니다…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 문장은 ‘하나님께서는 사랑하셨다’ 뒤의 목적어가 빠진 듯합니다. 문맥에 따라 ‘사람들을’을 보충했습니다. 그리스어 원문에 대한 직접 검토가 필요합니다.
    reason: 공급된 자료가 영어 번역 증언에 근거하며, 목적어 결락 가능성을 투명하게 밝혀야 합니다.
  - marker: b
    text: ‘하나님과 같은 존재’는 도움을 받는 이들에게 하나님의 선하심을 나타내는 사람을 가리키는 비유적 표현입니다.
    reason: 원문의 대담한 표현을 보존하면서 인간이 본질적으로 하나님이 된다는 오해를 피합니다.
  - marker: c
    text: 이 대목은 전승이 여기서 끊긴 것을 나타내기 위해 말줄임표를 그대로 두었습니다.
    reason: 사본 손상 또는 본문 복원 문제의 신호를 보존합니다.
lexical_decisions:
- source_word: full knowledge of the Father
  choice: 아버지를 온전히 아는 지식
  rationale: 단순한 정보가 아니라 충만한 인식을 뜻하는 표현을 살리면서도, 한국어에서 이해하기 쉽도록 풀어 옮겼습니다.
- source_word: reason and mind
  choice: 이성과 지성
  rationale: 서로 가까우나 구별되는 인간의 사고 능력 두 측면을 유지했습니다.
- source_word: only begotten Son
  choice: 독생자
  rationale: 초기 기독교 문헌의 전통적 신학 용어를 보존하되, 원문의 유일성과 아들됨을 압축적으로 전달합니다.
- source_word: imitator of God
  choice: 하나님을 본받는 사람
  rationale: 직역투인 ‘모방자’보다 자연스럽고 존엄한 현대 한국어 표현을 택했습니다.
- source_word: mysteries of God
  choice: 하나님의 신비
  rationale: 감추어진 신적 진리를 가리키는 의미를 보존하며 특정 성례전적 해석으로 좁히지 않았습니다.
- source_word: apparent death / real death
  choice: 죽음처럼 보이는 것 / 참된 죽음
  rationale: 현세의 육체적 죽음과 궁극적 심판의 죽음을 대조하는 수사적 긴장을 유지했습니다.
theological_decisions:
- issue: ‘God loved’ 뒤 목적어가 전승문에 명시되지 않은 문제
  choice: ‘사람들을’로 최소 보충하고 각주로 알림
  alternative: 목적어 없이 ‘하나님께서는 사랑하셨습니다’로 옮김
  rationale: 한국어 문장의 명료성을 확보하되, 보충 사실과 원문 전승의 불확실성을 숨기지 않았습니다.
- issue: 도움을 주는 사람이 받는 이들에게 ‘a God’가 된다는 표현
  choice: ‘하나님과 같은 존재가 되는’으로 번역
  alternative: ‘하나님이 되는’ 또는 ‘신과 같은 사람이 되는’
  rationale: 인간의 신격화를 단정하지 않으면서도, 하나님의 공급하시는 선하심을 매개한다는 대담한 원문 비유를 보존했습니다.
- issue: 영원한 불과 ‘끝까지’의 관계
  choice: ‘영원한 불에 넘겨져 끝까지 형벌받을’로 번역
  alternative: ‘영원히 형벌할 불’로 해석적 통합
  rationale: ‘영원한’과 ‘끝까지’라는 두 표현을 모두 유지하고 형벌의 양태나 기간에 관한 추가 교리 해석을 넣지 않았습니다.
- issue: ‘if God wills it’의 주체성과 가능성
  choice: ‘하나님께서 원하시면 사람은 그렇게 할 수 있습니다’
  alternative: ‘하나님의 뜻 안에서만 가능합니다’
  rationale: 하나님의 뜻과 인간의 본받음 사이의 긴장을 설명으로 해소하지 않고 문장 그대로 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 독자에게 직접 말하는 단수 호칭은 고풍스럽지만 존엄한 ‘그대’로 통일했고, 장황한 관계절은 한국어 호흡에 맞게 나누되 반복과 점층 구조는 살렸습니다. 현재 초안은 제공된 공공 영역 영어 증언을 바탕으로 하므로, 출판 확정 전에 그리스어 자료에 대한 직접 대조가 필요합니다.
