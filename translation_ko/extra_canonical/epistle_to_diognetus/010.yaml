review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언을 기준으로 볼 때, 초안은 문단 구조와 반복적 권면, 핵심 어휘를 대체로 충실히 반영합니다. 다만 ‘a God’를 ‘하나님과 같은 존재’로 완화한 것은 원문의 대담한 비유를 좁히며, 영원한 불에 관한 관계절에서는 ‘그 불에 넘겨진 이들’과 ‘그 불이 형벌함’의 관계가 다소 불명확해졌습니다. 그리스어 원문 직접 대조는 아직 보류되어 있으므로, 목적어 결락과 끝의 절단은 영어 증언의 상태로서만 각주 처리합니다.
  naturalness: 현대 격식체로 전반적으로 자연스럽습니다. 그러나 ‘아버지를 온전히 아는 지식’과 ‘그 불을 깨닫게 될 때’는 한국어 결합이 다소 부자연스럽습니다. 이를 ‘아버지에 관한 온전한 지식’ 및 ‘그 불을 보게 될 때’로 다듬고, 직접 호칭 ‘그대’는 생략하여 합쇼체의 일관성과 자연스러움을 높였습니다.
  terminology: ‘아버지’, ‘독생자’, ‘하나님의 형상’, ‘하나님의 신비’, ‘하나님을 본받다’는 적절합니다. ‘reason and mind’는 ‘이성과 지성’으로 구별한 선택을 유지할 수 있습니다. ‘a God’는 해석적으로 완화하지 않고 ‘하나님이 됩니다’로 옮기되, 비유적·수사적 용법이라는 각주를 덧붙이는 편이 원문 충실성과 비교파적 표현 원칙에 맞습니다.
  issues:
  - severity: medium
    issue: ‘a God to those who receive them from him’를 ‘하나님과 같은 존재’로 완화함
    rationale: 영어 증언은 수혜자들에게 ‘a God’가 된다고 명시합니다. 존재론적·교리적 결론을 덧붙이지 않는 범위에서 ‘하나님이 됩니다’로 보존하고, 비유적 수사임을 각주에서 설명해야 합니다.
  - severity: medium
    issue: 영원한 불의 관계절이 다소 모호하게 재구성됨
    rationale: 증언은 영원한 불에 정죄될 이들과 그 불에 넘겨져 끝까지 형벌받는 이들을 연결합니다. ‘영원한 불에 정죄될 이들, 곧 그 불에 넘겨져 끝까지 형벌을 받을 이들’로 관계를 명시하는 것이 안전합니다.
  - severity: low
    issue: 일부 어휘 결합의 부자연스러움
    rationale: ‘아버지를 온전히 아는 지식’, ‘그 불을 깨닫게 될 때’보다 ‘아버지에 관한 온전한 지식’, ‘그 불을 보게 될 때’가 현대 표준 한국어에 더 자연스럽고 의미도 보존합니다.
  - severity: low
    issue: 각주 a가 그리스어 전승 자체의 결락처럼 단정될 소지
    rationale: 현재 제공된 자료는 영어 공공영역 증언이며 그리스어 직접 검토가 보류되어 있습니다. 결락 언급은 ‘제공된 영어 증언’의 문장 상태로 한정해야 합니다.
  revised_text: '여러분도 이 믿음을 원하신다면, 먼저 아버지에 관한 온전한 지식을 얻으십시오.


    하나님께서는 세상을 바로 그들을 위하여 지으셨으며, 그 사람들을 사랑하셨습니다.[a] 땅에 있는 모든 것을 그들에게 복종시키셨고, 그들에게 이성과 지성을 주셨으며, 오직 그들만 하늘을 우러러보게 하셨습니다. 그들을 자신의 형상대로 지으셨고, 그들에게 자신의 독생자를 보내셨으며, 하늘에 있는 나라를 약속하셨고, 자신을 사랑한 이들에게 그 나라를 주실 것입니다.


    이 온전한 지식에 이르면, 얼마나 큰 기쁨으로 가득 차겠습니까? 여러분을 먼저 사랑하신 분을 얼마나 사랑하게 되겠습니까?


    그분을 사랑하면 그분의 선하심을 본받게 될 것입니다. 사람이 하나님을 본받을 수 있다는 사실을 놀랍게 여기지 마십시오. 하나님께서 원하시면 그렇게 할 수 있습니다.


    행복은 이웃을 지배하는 데 있지 않고, 자신보다 약한 사람보다 더 많이 가지려는 데 있지도 않으며, 재물을 소유하고 자기보다 낮은 사람들에게 힘을 휘두르는 데 있지도 않습니다. 이런 일로는 아무도 하나님을 본받을 수 없습니다. 참으로 이런 것들은 그분의 위대하심 밖에 있습니다.


    그러나 이웃의 짐을 스스로 지는 사람, 자신이 더 나은 처지에 있는 바로 그 점에서 더 어려운 처지에 있는 사람을 도우려는 사람, 하나님께 받은 재물을 궁핍한 이들에게 나누어 주어 그것을 받는 이들에게 하나님이 되는 사람, 곧 이런 사람은 하나님을 본받는 사람입니다.[b]


    그러면 여러분은 땅에 있으면서도 하나님께서 하늘에 살아 계심을 보게 될 것입니다. 그러면 하나님의 신비를 선포하기 시작할 것입니다. 하나님을 부인하지 않기 때문에 형벌받는 이들을 사랑하고 경탄하게 될 것입니다. 하늘에 있는 참생명을 깨닫고, 이 땅에서 겉으로 드러나는 죽음을 업신여기며, 영원한 불에 정죄될 이들, 곧 그 불에 넘겨져 끝까지 형벌을 받을 이들을 위하여 마련된 참된 죽음을 두려워할 때, 세상의 속임수와 오류를 정죄하게 될 것입니다.


    그러면 여러분은 의를 위하여 잠시뿐인 불을 견디는 이들에게 경탄할 것이며, 그 불을 보게 될 때 그들을 복되다고 여길 것입니다…[c]'
