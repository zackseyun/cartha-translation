base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/012.yaml
  text: 'Confronted with these truths and listening to them attentively, you will know how much God bestows on those who love him rightly. They become a paradise of delight, a flourishing tree that grows within them, bears every kind of fruit, and is adorned with various fruits.


    For in this garden a tree of knowledge and a tree of life have been planted. Yet the tree of knowledge does not kill; disobedience kills.


    For the Scriptures state clearly that from the beginning God planted a tree [of knowledge and a tree] of life in the midst of Paradise, revealing life through knowledge. Because our first parents did not use it genuinely, they were made naked through the serpent’s deceit.


    For there is neither life without knowledge nor sound knowledge without true life. Therefore, one tree is planted near the other.


    Discerning the force of this, and blaming the knowledge practiced apart from the truth of the injunction that leads to life, the apostle says, “Knowledge puffs up, but love builds up.”


    For the person who supposes that he knows anything without the true knowledge testified by life is ignorant. He is deceived by the serpent because he did not love life. But the one who recognizes and desires life with fear plants in hope, expecting fruit.


    Let your heart be knowledge, and your life true reason, properly understood.


    If you bear the tree and pluck its fruit, you will always gather the harvest God looks for—a harvest which the serpent does not touch and deceit does not infect. Eve is not corrupted but is believed on as a virgin,


    and salvation is set forth, and the apostles are filled with understanding, and the Passover of the Lord goes forward, and the congregations are gathered together, and [all things] are arranged in order. As He teaches the saints, the Word is gladdened, through whom the Father is glorified. To him be glory forever and ever. Amen.'
translation:
  language: ko
  text: '이 진리들을 마주하고 주의 깊게 들으면, 여러분은 하나님께서 그분을 올바르게 사랑하는 이들에게 얼마나 많은 것을 베푸시는지 알게 될 것입니다. 그들은 기쁨의 낙원이 되고, 그들 안에서 자라나 온갖 열매를 맺으며 여러 가지 열매로 아름답게 꾸며진 무성한 나무가 됩니다.


    이 동산에는 지식의 나무와 생명의 나무가 심겨 있습니다. 그러나 지식의 나무가 죽이는 것이 아니라 불순종이 죽입니다.


    성경은 하나님께서 태초부터 낙원 한가운데에 [지식의 나무와] 생명의 나무를 심으시고 지식을 통하여 생명을 드러내셨다고 분명히 말합니다.[a] 그러나 우리의 첫 조상들은 그것을 참되게 사용하지 않았으므로 뱀의 속임수로 말미암아 벌거벗게 되었습니다.


    지식 없이는 생명도 없고, 참된 생명 없이는 온전한 지식도 없습니다. 그러므로 한 나무가 다른 나무 가까이에 심겨 있습니다.


    사도는 이 사실의 뜻을 분별하고, 생명으로 이끄는 계명의 진리와 동떨어져 행해지는 지식을 책망하여 이렇게 말합니다. “지식은 사람을 교만하게 하지만 사랑은 세워 줍니다.”


    삶으로 입증되는 참된 지식 없이 무엇인가를 안다고 여기는 사람은 무지합니다. 그는 생명을 사랑하지 않았기 때문에 뱀에게 속은 것입니다. 그러나 두려움으로 생명을 깨닫고 갈망하는 사람은 열매를 기대하며 소망 가운데 심습니다.


    여러분의 마음은 지식이 되고, 여러분의 삶은 올바로 깨달은 참된 이성이 되게 하십시오.[b]


    여러분이 그 나무를 품고 그 열매를 딴다면, 하나님께서 바라시는 수확을 언제나 거두게 될 것입니다. 뱀이 손대지 못하고 속임수가 더럽히지 못하는 수확입니다. 하와는 타락하지 않고 오히려 처녀로서 믿어지며,[c]


    구원이 펼쳐지고, 사도들은 깨달음으로 충만해지며, 주님의 유월절은 계속 진행되고, 회중들은 함께 모이며, [모든 것이] 질서 있게 정돈됩니다.[d] 말씀이 성도들을 가르치실 때 기뻐하시며, 그분을 통하여 아버지께서 영광을 받으십니다. 그분께 영광이 영원무궁토록 있기를 빕니다. 아멘.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 전승 과정의 훼손이나 후대의 본문 복원을 나타내는 영어 증언의 표시를 그대로 보존한 것입니다.
    reason: 본문의 문헌적 불확실성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘참된 이성’에 해당하는 표현은 ‘참된 말’ 또는 ‘참된 로고스’로 이해될 가능성이 있습니다. 그리스어 원문에 대한 직접 검토가 필요합니다.
    reason: 영어 증언만으로는 핵심어의 정확한 의미 범위를 확정하기 어렵기 때문입니다.
  - marker: c
    text: ‘하와는 … 처녀로서 믿어진다’는 문장은 전승상 난해합니다. 교회나 마리아를 상징한다고 풀이하기도 할 수 있으나, 본문은 그 대상을 명시하지 않습니다.
    reason: 이례적인 진술을 조화시키거나 특정 해석으로 고정하지 않기 위해서입니다.
  - marker: d
    text: 대괄호 안의 ‘모든 것이’는 영어 증언에 보존된 복원 표시입니다.
    reason: 필사본 상태와 보충 가능성을 투명하게 드러내기 위해서입니다.
lexical_decisions:
- source_word: Paradise of delight
  choice: 기쁨의 낙원
  rationale: 창세기의 동산 이미지를 보존하면서도 현대 한국어에서 자연스럽고 장엄하게 들리도록 옮겼습니다.
- source_word: knowledge
  choice: 지식
  rationale: 본문 전체에서 생명과 짝을 이루고 고린도전서의 인용과도 연결되는 핵심 반복어이므로 일관되게 보존했습니다.
- source_word: charity
  choice: 사랑
  rationale: 고린도전서 8:1의 문맥에서 현대 한국어 독자에게 명료하며, 낡은 표현인 ‘자선’이 불러올 의미 축소를 피합니다.
- source_word: true reason
  choice: 참된 이성
  rationale: 원문 검토 전 영어 증언의 철학적 표현을 성급히 ‘말씀’이나 ‘신앙’으로 해석하지 않고 긴장을 보존했습니다.
- source_word: Passover of the Lord
  choice: 주님의 유월절
  rationale: 고대 그리스도교 문맥에서 유월절과 부활절의 의미가 겹칠 수 있으나, 영어 증언이 지닌 성경적 표현을 우선 보존했습니다.
- source_word: congregations
  choice: 회중들
  rationale: 특정 교파의 제도적 용어를 피하면서 모인 공동체라는 복수 의미를 나타냈습니다.
- source_word: the Word
  choice: 말씀
  rationale: 인격적으로 가르치고 기뻐하며 아버지를 영화롭게 하는 로고스 지칭을 한국어 기독교 문체에 맞게 표현했습니다.
theological_decisions:
- issue: 지식의 나무와 죽음의 관계
  choice: 지식의 나무 자체가 아니라 불순종이 죽인다고 명시
  alternative: 지식 자체가 죽음을 초래한다고 의역
  rationale: 본문이 의도적으로 지식과 불순종을 구별하므로 그 신학적 긴장을 그대로 보존했습니다.
- issue: 지식과 생명의 상호 관계
  choice: 지식 없이는 생명이 없고 참된 생명 없이는 온전한 지식도 없다고 대칭적으로 번역
  alternative: 생명이 지식보다 우선한다고 해설적으로 정리
  rationale: 본문의 상호 의존적 진술을 특정 교리 체계로 단순화하지 않았습니다.
- issue: 하와에 관한 난해한 문장
  choice: ‘하와는 타락하지 않고 오히려 처녀로서 믿어지며’로 유지
  alternative: 교회 또는 마리아를 가리키는 비유로 명시
  rationale: 영어 증언 자체가 이례적이며 원어 검토도 보류된 상태이므로, 가능한 상징적 대상을 본문 안에서 확정하지 않았습니다.
- issue: 말씀의 인격성 및 대명사 지시
  choice: 말씀을 인격적 주체로 번역하고, 그분을 통하여 아버지가 영광받는다고 표현
  alternative: ‘말’ 또는 ‘가르침’이라는 비인격적 의미
  rationale: 가르치고 기뻐하며 아버지를 영화롭게 한다는 문맥이 인격적 로고스 이해를 강하게 지지합니다.
- issue: 마지막 송영의 수신자
  choice: ‘그분께’로 모호성을 유지
  alternative: ‘아버지께’ 또는 ‘말씀께’로 확정
  rationale: 영어 증언의 관계대명사 연결이 지시 대상을 완전히 명료하게 확정하지 않으므로 한국어에서도 불필요하게 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 고대 권면문의 장엄함은 유지하되 지나치게 고어적인 어미와 한자어는 피했습니다. 현재 초안은 제공된 공용 영어 증언을 바탕으로 하며, 그리스어 원문 직접 대조가 보류되어 있으므로 문헌적으로 불확실한 곳은 각주와 대괄호로 명시했습니다.
