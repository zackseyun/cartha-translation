base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: ko
  text: '도대체 그분이 오시기 전에 하나님이 어떤 분이신지 안 사람이 누구였습니까?


    아니면 그대는 잘난 체하는 철학자들의 공허하고 터무니없는 말을 받아들이십니까? 그들 가운데 어떤 이들은 하나님이 불이라고 했고—그들은 자기들이 가게 될 곳을 하나님이라고 부르는 셈입니다—다른 이들은 물이라고 했으며, 또 다른 이들은 하나님께서 창조하신 원소들 가운데 다른 무엇이라고 했습니다.


    그러나 이런 주장 가운데 어느 하나라도 받아들일 만하다면, 다른 어떤 피조물이라도 마찬가지로 하나님이라고 내세울 수 있을 것입니다.


    아닙니다. 이 모든 것은 마술사들의 속임수요 기만입니다.


    아무도 그분을 보거나 알아보지 못했으나, 그분께서 자신을 드러내셨습니다.


    그분께서는 믿음을 통하여 [자신을][a] 드러내셨습니다. 오직 믿음을 통해서만 하나님을 볼 수 있도록 허락되기 때문입니다.


    만물을 지으시고 질서 있게 배열하신 우주의 주인이시며 창조주이신 하나님께서는 사람을 사랑하실 뿐 아니라 오래 참으시는 분으로 드러나셨습니다.


    참으로 그분께서는 언제나 그러하셨고 지금도 그러하시며 앞으로도 그러하실 것입니다. 그분께서는 인자하시고 선하시며 격정에 휘둘리지 않으시고 참되십니다. 오직 그분만이 선하십니다.


    그분께서는 크고 말로 다 할 수 없는 계획을 세우시고, 그것을 오직 자신의 아들에게만 알려 주셨습니다.


    그분께서 그 지혜로운 뜻을 신비로 간직하고 지키시는 동안에는, 우리를 소홀히 여기시고 돌보지 않으시는 듯했습니다.


    그러나 사랑하시는 아들을 통하여 그것을 계시하시고 처음부터 마련해 두신 뜻을 나타내셨을 때, 그분께서는 이 모든 선물을 한꺼번에 우리에게 주셨습니다. 곧 그분의 은택에 참여하고, 우리 가운데 아무도 전혀 기대하지 못했을 [신비들을][b] 보고 깨닫게 하셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신을’은 문맥상 보충한 말입니다. 제공된 번역 증거에도 보충어로 표시되어 있습니다.
    reason: 번역 증거가 괄호로 나타낸 보충을 독자에게 알리고 문법적 명료성을 확보합니다.
  - marker: b
    text: ‘신비들을’은 문맥상 보충한 말입니다. 무엇을 보고 깨닫는지 제공된 번역 증거가 명시적으로 보충합니다.
    reason: 목적어가 원문 증거에서 명시되지 않았을 가능성을 숨기지 않기 위해 표시했습니다.
lexical_decisions:
- source_word: what God was
  choice: 하나님이 어떤 분이신지
  rationale: 하나님의 본질을 묻는 표현을 현대 한국어에서 자연스럽고 인격적으로 전달했습니다.
- source_word: elements
  choice: 원소들
  rationale: 불과 물을 우주의 근본 구성 요소로 보던 고대 철학의 문맥을 반영했습니다.
- source_word: quackery and deceit
  choice: 속임수요 기만
  rationale: 허황된 사술과 의도적 기만이라는 이중 의미를 간결하게 살렸습니다.
- source_word: long-suffering
  choice: 오래 참으시는
  rationale: 인간을 향한 하나님의 지속적인 인내를 나타내는 전통적이면서도 이해하기 쉬운 표현입니다.
- source_word: dispassionate
  choice: 격정에 휘둘리지 않으시고
  rationale: 감정이 전혀 없다는 단정 대신, 비이성적 격정에 지배되지 않는다는 고대적 의미를 자연스럽게 전달했습니다.
- source_word: benefits
  choice: 은택
  rationale: 하나님께서 베푸시는 선하고 유익한 것들을 포괄하면서 문체의 품위를 유지합니다.
theological_decisions:
- issue: “그분이 오시기 전에”의 주체
  choice: 대명사 ‘그분’을 유지함
  alternative: ‘하나님께서 오시기 전에’ 또는 ‘아들이 오시기 전에’로 명시함
  rationale: 제공된 증거에서 대명사의 선행사가 명시되지 않으므로, 특정한 기독론적 해석으로 고정하지 않고 원문의 긴장을 보존했습니다.
- issue: 믿음과 하나님을 봄의 관계
  choice: ‘오직 믿음을 통해서만 하나님을 볼 수 있도록 허락된다’
  alternative: 믿음 자체가 하나님을 보여 준다고 번역함
  rationale: 수동적 허락의 뉘앙스와 믿음의 유일한 매개성을 함께 보존하되, 그 작동 방식을 과도하게 설명하지 않았습니다.
- issue: 하나님의 ‘dispassionate’ 속성
  choice: ‘격정에 휘둘리지 않으시고’
  alternative: ‘감정이 없으시고’ 또는 ‘노하지 않으시고’
  rationale: 하나님의 무감정성을 단정하거나 특정 감정 하나로 축소하지 않고, 고대 신학적 표현이 지닌 비격정성의 의미를 전달했습니다.
- issue: 아들에게만 알려 준 계획
  choice: ‘오직 자신의 아들에게만 알려 주셨습니다’
  alternative: ‘아들과만 의논하셨습니다’
  rationale: 계획의 전달이라는 증거의 의미를 따르며, 성부와 성자의 협의 방식에 관한 추가 교리를 도입하지 않았습니다.
