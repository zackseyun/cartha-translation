  terminology: '"원소들", "오래 참으시는", "격정에 휘둘리지 않으시고"는 문맥과 신학적 절제를 잘 반영합니다. "은택"도 장중한 문체에서는 가능하나, 마지막 열거에서는 "은택에 참여하는 것"으로 명사구를 분명히 해야 합니다. 괄호성 보충어인 "자신을"과 "신비들을"에 대한 각주는 적절합니다.'
