base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: ko
  text: '## 디오그네투스에게 보낸 편지 5장


    그리스도인들은 사는 곳이나 말이나 관습으로 다른 사람들과 구별되지 않습니다.


    그들은 자기들만의 도시에 따로 살지도 않고, 남다른 언어를 쓰지도 않으며, 유별난 생활 방식을 따르지도 않습니다.


    또한 그들은 재주 있는 사람들의 지성이나 탐구로 찾아낸 어떤 고안을 지니고 있지도 않으며, 어떤 이들이 그러하듯 사람이 만든 교리를 따르지도 않습니다.


    오히려 그들은 각자에게 주어진 처지에 따라 그리스인들과 비그리스인들의 도시들에 살면서, 옷과 음식과 그 밖의 생활 방식에서는 그 지방의 관습을 따릅니다. 그러면서도 그들이 드러내는 그들 고유의 시민으로서의 삶의 방식은 놀랍고, 누구나 인정하듯 기대를 뛰어넘습니다.


    그들은 자기 나라에 살지만 나그네처럼 삽니다. 시민으로서 모든 것을 함께 누리지만, 이방인처럼 온갖 고난을 견딥니다. 그들에게는 모든 타국이 고향이고, 모든 고향이 타국입니다.


    그들도 다른 모든 사람처럼 혼인하고 자녀를 낳지만, 자녀를 버리지는 않습니다.[a]


    그들은 음식을 함께 나누지만, 아내는 함께 나누지 않습니다.


    그들은 육신 안에 있지만 육신을 따라 살지는 않습니다.


    그들은 땅에서 살아가지만, 그들의 시민권은 하늘에 있습니다.


    그들은 정해진 법을 따르면서도 자신의 삶으로 그 법을 뛰어넘습니다.


    그들은 모든 사람을 사랑하지만, 모든 사람에게 박해를 받습니다.


    그들은 알려지지 않지만 유죄 판결을 받습니다. 죽임을 당하지만 생명을 얻습니다.


    그들은 가난하지만 많은 사람을 부유하게 합니다. 모든 것이 모자라지만 모든 것이 넉넉합니다.


    그들은 모욕을 당하지만 그 모욕 가운데서 영광을 받습니다. 비방을 당하지만 의롭다고 인정받습니다.


    그들은 욕을 먹어도 축복하고, 업신여김을 당해도 존중합니다.


    선을 행하고도 악을 행한 사람처럼 벌을 받습니다. 벌을 받으면서도 마치 생명을 얻는 사람들처럼 기뻐합니다.


    유대인들은 그들을 이방인으로 여겨 공격하고, 그리스인들은 그들을 박해합니다. 그러나 그들을 미워하는 이들조차 자기들이 왜 적대하는지 그 까닭을 말하지 못합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 고대 사회에서 자녀, 특히 갓난아이를 내다 버려 죽게 하거나 다른 사람이 데려가게 하던 관행을 가리킵니다.
    reason: ‘자녀를 버린다’는 표현의 역사적 의미를 현대 독자가 오해하지 않도록 설명합니다.
lexical_decisions:
- source_word: locality / γῇ (source-language correspondence provisional)
  choice: 사는 곳
  rationale: ‘지역’보다 일상적이면서도 거주지에 따른 구별이라는 뜻을 분명히 전달합니다.
- source_word: barbarians
  choice: 이방인들
  rationale: 고대 그리스인의 관점에서 그리스어를 쓰지 않는 민족들을 가리키는 말입니다. 현대 한국어의 ‘야만인’이 불필요하게 주는 비하감을 피하되 역사적 대조는 보존했습니다.
- source_word: constitution of their own citizenship
  choice: 시민 생활의 질서
  rationale: 단순한 법적 ‘시민권’이 아니라 공동체가 실제로 드러내는 삶의 방식과 질서를 가리키므로 이렇게 옮겼습니다.
- source_word: sojourners
  choice: 나그네
  rationale: 자기 나라에 거주하면서도 임시 체류자처럼 산다는 역설을 자연스럽고 품위 있게 살립니다.
- source_word: in the flesh / according to the flesh
  choice: 육신 안에 / 육신을 따라
  rationale: ‘육신’의 두 용례 사이에 있는 의도적인 대조를 해소하지 않고 그대로 보존했습니다.
- source_word: citizenship
  choice: 시민권
  rationale: 땅에서의 삶과 하늘에 속한 정체성을 시민적 언어로 대비하는 원문의 비유를 유지합니다.
- source_word: table / bed
  choice: 식탁 / 잠자리
  rationale: 재산 공유와 성적 문란을 대조하는 간결한 병행을 한국어에서 직접적이되 점잖게 표현했습니다.
theological_decisions:
- issue: ‘육신을 따라 살지 않는다’의 의미
  choice: 원문의 신학적 표현을 직역에 가깝게 보존
  alternative: 육체적 욕망을 따라 살지 않습니다
  rationale: 이 표현이 욕망, 죄성, 현세적 삶 가운데 어느 하나만을 뜻한다고 단정하지 않고 바울 문헌을 연상시키는 신학적 긴장을 남겼습니다.
- issue: 하늘의 시민권
  choice: ‘그들의 시민권은 하늘에 있습니다’
  alternative: 그들의 본향은 하늘에 있습니다
  rationale: ‘본향’으로 바꾸면 거주지 개념이 강해지므로, 앞뒤 문맥의 시민·이방인·법이라는 정치적 비유를 보존했습니다.
- issue: 죽음과 생명의 역설
  choice: ‘죽임을 당하지만 생명을 얻습니다’
  alternative: 죽임을 당하지만 다시 살아납니다
  rationale: 부활을 함축할 수 있으나 시간적 순서나 구체적 교리를 본문보다 더 명시하지 않았습니다.
- issue: 유대인과 그리스인의 적대 행위
  choice: 고대 문헌의 집단 명칭과 주장을 보존
  alternative: 일부 유대인들과 일부 그리스인들
  rationale: 본문의 수사적 일반화를 역사적 증언으로 보존하되, 번역에서 ‘모든’이라는 말을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 짧고 반복적인 대조 문장을 살려 원문의 권면적·변증적 리듬을 보존했습니다. 현재 제공된 직접 근거는 공공 영역 영어 번역 증언이며, 실전된 Codex Argentoratensis의 사본 전승에 대한 그리스어 원문 대조는 아직 필요하므로 원어 표기는 잠정적으로만 참고했습니다.
