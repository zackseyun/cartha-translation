source:
  text: 'And in proportion as a man seeth that his bishop is silent, let him fear him the more. For every one whom the Master of the household sendeth to be steward over His own house, we ought so to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praiseth your orderly conduct in God, for that ye all live according to truth, and that no heresy hath a home among you: nay, ye do not so much as listen to any one, if he speak of aught else save concerning Jesus Christ in truth.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'And in proportion as a man seeth that his bishop is silent, let him fear him the more. For every one whom the Master of the household sendeth to be steward over His own house, we ought so to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praiseth your orderly conduct in God, for that ye all live according to truth, and that no heresy hath a home among you: nay, ye do not so much as listen to any one, if he speak of aught else save concerning Jesus Christ in truth.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: ko
  text: '누구든지 감독이 침묵하고 있는 것을 볼수록, 그를 더욱 두려워해야 합니다.[a] 집주인이 자기 집의 관리 일을 맡기기 위해 보내는 사람은 누구든지, 우리는 그를 보내신 분을 맞아들이듯 그 사람을 맞아들여야 합니다. 그러므로 분명히 우리는 감독을 주님 자신처럼 여겨야 합니다.[b]


    오네시모는 자진하여 하나님 안에서 여러분이 지키는 질서를 크게 칭찬합니다. 여러분 모두가 진리대로 살고 있으며, 여러분 가운데에는 어떤 이단도 자리 잡고 있지 않기 때문입니다. 더욱이 여러분은 예수 그리스도에 관하여 진리 안에서 말하는 사람 외에는 아무에게도 귀를 기울이지 않습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워해야 합니다’는 공포뿐 아니라 경외하거나 깊이 존중하는 태도를 가리킬 수도 있습니다.
    reason: φοβείσθω의 의미 범위를 보존하여 이 표현을 공포로만 한정하지 않습니다.
  - marker: b
    text: ‘주님 자신처럼’은 감독과 주님이 동일하다는 진술이 아니라, 보냄을 받은 이를 보낸 이처럼 맞아들인다는 앞선 비유를 따른 강한 비교 표현입니다.
    reason: ὡς αὐτὸν τὸν κύριον의 강도를 유지하면서 문맥적 비유와의 연결을 밝힙니다.
  - marker: c
    text: 직역하면 ‘예수 그리스도에 관하여 진리 안에서 말하는 사람 외에는 아무에게도’라는 뜻입니다. ‘진리 안에서’가 말하는 방식이나 내용 모두와 관련될 수 있습니다.
    reason: 제한 표현과 ἐν ἀληθείᾳ의 결합에서 가능한 의미 범위를 보존합니다.
lexical_decisions:
- source_word: σιγῶντα
  choice: 말없이 있는
  rationale: 단순히 발언하지 않는 상태뿐 아니라 절제된 침묵을 나타낼 수 있으므로, 동기를 덧붙이지 않고 자연스럽게 옮겼습니다.
- source_word: φοβείσθω
  choice: 두려워해야 합니다
  rationale: ‘두려워하다’와 ‘경외하다/존중하다’의 의미 범위를 지닌 표현입니다. 본문의 강한 어감을 약화하지 않기 위해 직역에 가까운 표현을 본문에 두고 각주로 범위를 밝혔습니다.
- source_word: οἰκοδεσπότης / οἰκονομίαν
  choice: 집주인 / 자기 집안일을 맡기려고
  rationale: 가정과 관리 책임의 비유를 현대 독자가 이해하기 쉽게 표현하면서, 파송과 위임의 관계를 보존했습니다.
- source_word: προσβλέπειν
  choice: 여겨야 합니다
  rationale: 문맥상 단순히 바라본다는 뜻보다 어떤 지위와 관계 속에서 대한다는 뜻이 두드러지므로 ‘여기다’로 옮겼습니다.
- source_word: εὐταξίαν
  choice: 질서 있게 살아가는 것
  rationale: 공동체의 정돈된 상태와 행실을 가리키는 말이므로 추상 명사 ‘질서’만 쓰지 않고 삶의 모습으로 풀어 옮겼습니다.
- source_word: αἵρεσις
  choice: 이단
  rationale: 이 문맥에서는 공동체 안의 분파적·그릇된 가르침을 가리키는 초기 기독교 용례에 따라 ‘이단’을 선택했습니다.
- source_word: πλέον ἢ περὶ Ἰησοῦ Χριστοῦ λαλοῦντος ἐν ἀληθείᾳ
  choice: 예수 그리스도에 관하여 진실하게 말하는 것이 아닌 다른 말을 하는
  rationale: 구문의 핵심인 예수 그리스도에 관한 참된 말과 그 밖의 말을 대조하되, ‘진리 안에서’가 말하는 방식 또는 내용과 연결될 수 있는 여지를 각주에 남겼습니다.
theological_decisions:
- issue: 감독을 ‘주님 자신처럼’ 여긴다는 표현
  choice: 비교 표현을 그대로 보존함
  alternative: 감독을 ‘주님의 대리자로’ 존중해야 한다고 설명적으로 번역함
  rationale: 원문은 ὡς αὐτὸν τὸν κύριον이라는 강한 비교를 사용하지만 감독과 주님이 동일 존재라고 명시하지는 않습니다. 해석적 완화를 본문에 넣지 않고 비교의 긴장을 유지했습니다.
- issue: 감독에 대한 ‘두려움’의 성격
  choice: ‘두려워해야 합니다’로 번역함
  alternative: ‘더욱 존경해야 합니다’ 또는 ‘더욱 경외해야 합니다’
  rationale: φοβέομαι의 의미 범위를 특정한 교회론적 태도로 좁히지 않고 강한 원문 표현을 보존했습니다.
- issue: ‘이단’의 의미 범위
  choice: 초기 공동체 안에 자리 잡는 그릇된 가르침을 가리키는 말로 제시함
  alternative: ‘분파’로 번역함
  rationale: αἵρεσις에는 분파와 이단의 의미가 모두 가능하지만, 이어지는 예수 그리스도에 관한 참된 말과의 대조 때문에 여기서는 ‘이단’이 문맥에 더 적합합니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 초기 교회의 직분명 ἐπίσκοπος는 역사적 문맥에 맞추어 ‘감독’으로 옮겼으며, 문장은 권면문의 엄숙함을 유지하되 고어체나 교파 특유의 표현은 피했습니다. 제공된 자료에는 그리스어 본문 자체가 수록되지 않았으므로, 중간 판본에서 널리 확인되는 그리스어 문구를 기준으로 검토하되 최종 출판 전 지정 원문 판본과의 대조가 필요합니다.
