revisions:
- from: '누구든 감독이 말없이 있는 것을 볼수록 그를 더욱 두려워해야 합니다.[a] 집주인이 자기 집안일을 맡기려고 보내는 사람은 누구나, 그를 보낸 분을 맞아들이듯이 우리가 그 사람을 맞아들여야 하기 때문입니다. 그러므로 분명히 우리는 감독을 주님 자신처럼 여겨야 합니다.[b]


    오네시모는 여러분이 하나님 안에서 질서 있게 살아가는 것을 몸소 크게 칭찬합니다. 여러분 모두가 진리를 따라 살고 있으며, 여러분 가운데에는 어떤 이단도 자리 잡고 있지 않기 때문입니다. 더욱이 여러분은 예수 그리스도에 관하여 진실하게 말하는 것이 아닌 다른 말을 하는 사람에게는 귀를 기울이지도 않습니다.[c]'
  to: '누구든지 감독이 침묵하고 있는 것을 볼수록, 그를 더욱 두려워해야 합니다.[a] 집주인이 자기 집의 관리 일을 맡기기 위해 보내는 사람은 누구든지, 우리는 그를 보내신 분을 맞아들이듯 그 사람을 맞아들여야 합니다. 그러므로 분명히 우리는 감독을 주님 자신처럼 여겨야 합니다.[b]


    오네시모는 자진하여 하나님 안에서 여러분이 지키는 질서를 크게 칭찬합니다. 여러분 모두가 진리대로 살고 있으며, 여러분 가운데에는 어떤 이단도 자리 잡고 있지 않기 때문입니다. 더욱이 여러분은 예수 그리스도에 관하여 진리 안에서 말하는 사람 외에는 아무에게도 귀를 기울이지 않습니다.[c]'
  rationale: ‘몸소’를 ‘자진하여’로 고쳐 오네시모의 자발성을 보존했습니다. 관리 위임 비유의 수식 관계를 명확히 하고, 마지막 문장은 원문의 제한 구조를 따라 ‘참되게 그리스도에 관하여 말하는 사람 외에는 듣지 않는다’는 뜻을 자연스러운 한국어로 옮겼습니다. 감독과 주님에 관한 강한 비교 및 ‘두려움’의 의미 범위는 본문과 각주에서 유지했습니다.
