    rationale: 본문은 예수 그리스도에 관하여 진리 안에서 말하는 사람을 제외하고는 아무에게도 귀 기울이지 않는다는 취지입니다. 현 번역은 ‘다른 말’의 내용과 말하는 방식의 부정을 겹치게 하여 이 구조를 흐립니다.
  - severity: low
    issue: οἰκονομία의 위임·관리 의미가 다소 약화됨
    rationale: ‘집안일’도 가능한 번역이지만, 여기서는 집주인이 특정인을 자기 집의 관리 책임에 파견하는 비유이므로 ‘집의 관리 일’이 더 적절합니다.
