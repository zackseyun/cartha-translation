source:
  text: 'But if any one propound Judaism unto you, hear him not: for it is better to hear Christianity from a man who is circumcised than Judaism from one uncircumcised. But if either the one or the other speak not concerning Jesus Christ, I look on them as tombstones and graves of the dead, whereon are inscribed only the names of men.


    Shun ye therefore the wicked arts and plottings of the prince of this world, lest haply ye be crushed by his devices, and wax weak in your love. But assemble yourselves all together with undivided heart. And


    I give thanks to my God, that I have a good conscience in my dealings with you, and no man can boast either in secret or openly, that I was burdensome to any one in small things or in great. Yea and for all among whom I spoke, it is my prayer that they may not turn it into a testimony against themselves.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'But if any one propound Judaism unto you, hear him not: for it is better to hear Christianity from a man who is circumcised than Judaism from one uncircumcised. But if either the one or the other speak not concerning Jesus Christ, I look on them as tombstones and graves of the dead, whereon are inscribed only the names of men.


    Shun ye therefore the wicked arts and plottings of the prince of this world, lest haply ye be crushed by his devices, and wax weak in your love. But assemble yourselves all together with undivided heart. And


    I give thanks to my God, that I have a good conscience in my dealings with you, and no man can boast either in secret or openly, that I was burdensome to any one in small things or in great. Yea and for all among whom I spoke, it is my prayer that they may not turn it into a testimony against themselves.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: ko
  text: '그러나 누가 여러분에게 유대교를 가르치려 한다면, 그의 말을 듣지 마십시오. 할례받지 않은 사람에게서 유대교를 듣는 것보다 할례받은 사람에게서 그리스도교를 듣는 편이 더 낫습니다. 그러나 어느 쪽이든 예수 그리스도에 관하여 말하지 않는다면, 나는 그들을 사람들의 이름만 새겨진 묘비와 죽은 자들의 무덤으로 여깁니다.


    그러므로 이 세상 통치자의 악한 술책과 음모를 피하십시오. 그의 계략에 짓눌려 여러분의 사랑이 약해지는 일이 없게 하십시오. 오히려 여러분 모두가 나뉘지 않은 마음으로 함께 모이십시오. 그리고[a]


    나는 여러분을 대하면서 선한 양심을 지니고 있음을 두고 나의 하나님께 감사드립니다. 아무도 은밀하게든 공개적으로든, 작은 일이든 큰일이든, 내가 누구에게 짐을 지웠다고 자랑할 수 없습니다. 또한 내가 그들 가운데서 말했던 모든 이를 위하여 기도하니, 그들이 그것을 자신들에게 불리한 증언으로 바꾸지 않기를 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 본문은 여기서 ‘그리고’라는 접속사로 갑자기 끊깁니다.
    reason: 공급된 영어 증언에 보존된 비완결 접속사를 본문에서 유지하되, 독자가 이를 단순 오탈자로 오해하지 않도록 알립니다.
lexical_decisions:
- source_word: Judaism
  choice: 유대교
  rationale: 문맥에서 그리스도교와 대조되는 가르침과 종교적 입장을 가리키므로 현대 독자가 분명히 이해할 수 있는 통용어를 사용했습니다.
- source_word: Christianity
  choice: 그리스도교
  rationale: ‘유대교’와의 대칭을 살리고, 특정 현대 교파의 명칭으로 좁혀 읽히지 않도록 했습니다.
- source_word: prince of this world
  choice: 이 세상 통치자
  rationale: ‘통치자’라는 정치적·영적 권세의 뉘앙스를 보존하면서, 본문이 그 존재를 명시적으로 사탄이라고 풀어 쓰지 않는 점을 존중했습니다.
- source_word: undivided heart
  choice: 한마음으로
  rationale: 분열되지 않은 내적 태도와 공동체적 일치를 자연스러운 현대 한국어로 나타냈습니다.
- source_word: was burdensome
  choice: 짐을 지웠다
  rationale: 재정적 부담만으로 한정하지 않고, 상대에게 부담이 되었다는 폭넓은 뜻을 유지했습니다.
theological_decisions:
- issue: 할례 여부와 그리스도교·유대교의 대조
  choice: 원문의 역설적 비교를 그대로 보존함
  alternative: 할례를 문자적 표지보다 신학적 은유로 해설하여 번역함
  rationale: 본문은 할례받은 사람과 받지 않은 사람을 실제 대조 항목으로 제시하므로, 별도의 교리적 해석을 번역문에 끌어들이지 않았습니다.
- issue: 예수 그리스도에 관하여 말하지 않는 두 부류에 대한 복수 지칭
  choice: ‘그들을’로 옮김
  alternative: ‘그를’로 단수화함
  rationale: 두 부류 가운데 어느 쪽이든 해당될 수 있다는 집합적 의미와 영어 증언의 복수 표현을 살렸습니다.
- issue: ‘그것을 자신들에게 불리한 증언으로 바꾸다’의 지시 대상
  choice: ‘그것을’로 모호성을 유지함
  alternative: 이그나티우스의 설교나 그의 무부담 행실로 지시 대상을 특정함
  rationale: 가용한 증언만으로 대명사의 정확한 지시 대상을 확정하기 어려우므로 신학적·수사적 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면에서는 ‘-십시오’를, 자기 진술과 기도에서는 자연스러운 합쇼체를 적용했습니다. 현재 제공 자료는 그리스어 원문 직접 검토가 보류된 상태이므로, 공공 영역 영어 증언을 근거로 한 잠정 출판 초안입니다.
