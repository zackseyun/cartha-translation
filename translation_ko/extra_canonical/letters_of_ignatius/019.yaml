source:
  text: 'My spirit is made an offscouring for the Cross, which is a stumbling-block to them that are unbelievers, but to us salvation and life eternal. Where is the wise? Where is the disputer? Where is the boasting of them that are called prudent?


    For our God, Jesus the Christ, was conceived in the womb by Mary according to a dispensation, of the seed of David but also of the Holy Ghost; and He was born and was baptized that by His passion He might cleanse water.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'My spirit is made an offscouring for the Cross, which is a stumbling-block to them that are unbelievers, but to us salvation and life eternal. Where is the wise? Where is the disputer? Where is the boasting of them that are called prudent?


    For our God, Jesus the Christ, was conceived in the womb by Mary according to a dispensation, of the seed of David but also of the Holy Ghost; and He was born and was baptized that by His passion He might cleanse water.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: ko
  text: '내 영은 십자가를 위하여 찌꺼기처럼 여김을 받습니다. 그 십자가는 믿지 않는 이들에게는 걸림돌이지만, 우리에게는 구원이며 영원한 생명입니다. 지혜로운 사람이 어디에 있습니까? 논쟁하는 사람이 어디에 있습니까? 슬기롭다고 불리는 이들의 자랑은 어디에 있습니까?


    우리의 하나님이신 예수 그리스도께서는 하나님의 경륜을 따라 마리아의 태중에 잉태되셨습니다. 그분은 다윗의 씨에서 나셨으나 또한 성령으로 나셨습니다. 그분이 태어나 세례를 받으신 것은 자신의 고난으로 물을 깨끗하게 하시기 위함이었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 특히 ‘찌꺼기’, ‘하나님의 경륜’, ‘다윗의 씨에서 나셨으나 또한 성령으로 나셨습니다’, ‘고난으로 물을 깨끗하게 하시기’에 해당하는 표현은 중간 교정본 그리스어 원문을 직접 대조하여 확정할 필요가 있습니다.
    reason: 사용자가 제공한 자료에 그리스어 원문 검토가 아직 이루어지지 않았다고 명시되어 있으므로, 출판 단계에서의 본문 확정 한계를 투명하게 밝혔습니다.
lexical_decisions:
- source_word: περίψημα (reflected by “offscouring/refuse”)
  choice: 찌꺼기처럼 여김을 받습니다
  rationale: 자신을 남을 위해 버려지는 찌꺼기나 폐물에 비유하는 강한 자기비하의 뉘앙스를 살리되, 현대 독자가 이해할 수 있도록 비유임을 드러냈습니다.
- source_word: σταυρός (“Cross”)
  choice: 십자가
  rationale: 초기 그리스도교 문맥에서 예수의 십자가 사건과 그 상징을 함께 가리키는 통상적이고 자연스러운 표현입니다.
- source_word: σκάνδαλον (“stumbling-block”)
  choice: 걸림돌
  rationale: 불신자에게 십자가가 거부와 넘어짐의 원인이 된다는 바울 서신의 어감을 보존합니다.
- source_word: οἰκονομία (“dispensation”)
  choice: 하나님의 경륜
  rationale: 역사 속에서 이루어지는 하나님의 구원 계획과 섭리를 뜻하는 신학적 함의를 보존하고, 행위 주체를 명확히 했습니다.
- source_word: σπέρμα Δαυίδ (“seed of David”)
  choice: 다윗의 씨
  rationale: 혈통과 메시아적 계보를 함께 암시하는 고대 표현을 보존했습니다.
- source_word: πάθος (“passion/suffering”)
  choice: 고난
  rationale: 그리스도의 수난과 죽음을 포괄하는 전통적 의미를 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 예수 그리스도를 ‘우리의 하나님’이라고 부르는 구절
  choice: 우리의 하나님이신 예수 그리스도
  alternative: 우리 하나님에게 속한 예수 그리스도
  rationale: 제공된 증언과 중간 교정본 그리스어 전통의 일반적 독법은 ‘우리의 하나님 예수 그리스도’를 직접적인 동격 표현으로 이해하므로 이를 명시적으로 보존했습니다.
- issue: ‘다윗의 씨’와 ‘성령’의 관계
  choice: 그분은 다윗의 씨에서 나셨으나 또한 성령으로 나셨습니다
  alternative: 다윗의 씨에서, 또한 성령에게서 잉태되셨습니다
  rationale: 인성과 성령에 의한 잉태를 함께 진술하는 병렬 구조와 ‘그러나 또한’의 긴장을 유지했습니다. 다만 정확한 전치사 관계는 그리스어 원문 직접 대조가 필요합니다.
- issue: 세례와 물의 정결
  choice: 자신의 고난으로 물을 깨끗하게 하시기 위함
  alternative: 고난을 통해 물을 정결하게 하시기 위함
  rationale: 본문의 역설적인 인과 관계를 교리적으로 풀어 쓰지 않고 그대로 보존했습니다. 이것이 세례수 일반의 성별인지 다른 의미인지 번역에서 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 수사적 질문의 반복과 초기 그리스도교 문헌 특유의 압축된 신학적 진술을 유지하되, 과도하게 고어적인 문장은 피했습니다. 원어 직접 검토가 보류된 상태이므로 번역의 잠정성을 각주에 명시했습니다.
