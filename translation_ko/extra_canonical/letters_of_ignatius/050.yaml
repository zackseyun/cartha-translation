base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: ko
  text: '그러므로 죽음을 가져오는 열매를 맺는 그 악한 곁가지들을 피하십시오. 누구든지 그 열매를 맛보면 곧 죽습니다. 그들은 아버지께서 심으신 것이 아니기 때문입니다.


    그들이 아버지께서 심으신 것이었다면, 십자가의 가지들로 드러났을 것이며 그 열매도 썩지 않았을 것입니다. 그 십자가는 그분께서 자신의 수난 가운데 자신의 지체인 우리를 부르시는 십자가입니다.[a] 머리가 지체들 없이 있을 수는 없습니다. 하나님께서 하나 됨을 약속하시며, 이 하나 됨은 바로 그분 자신이시기 때문입니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 수식 관계가 압축되어 있습니다. 여기서는 십자가를 통하여, 그분께서 자신의 수난 가운데 자신의 지체인 우리를 부르신다는 뜻으로 옮겼습니다.
    reason: 수난, 십자가, 그리고 ‘그분의 지체인 우리’의 관계를 보존하면서 한국어 문장으로 명료하게 제시하기 위해서입니다.
  - marker: b
    text: ‘이 하나 됨은 바로 그분 자신’은 하나님이 하나 됨의 근원이나 보증이라는 설명으로 풀 수도 있으나, 본문은 강한 동일시 표현을 그대로 보존합니다.
    reason: 신학적 긴장을 해설적 번역으로 미리 해소하지 않기 위해서입니다.
lexical_decisions:
- source_word: vile offshoots
  choice: 악한 곁가지들
  rationale: 식물과 접붙임의 비유를 유지하면서, 도덕적으로 해로운 집단을 가리키는 경멸적 뉘앙스를 현대 한국어로 자연스럽게 전달했습니다.
- source_word: deadly fruit
  choice: 죽음을 가져오는 열매
  rationale: 단순히 ‘치명적인’이라 하기보다 맛보는 즉시 죽는다는 이어지는 문맥과 인과성을 분명히 살렸습니다.
- source_word: the Father’s planting
  choice: 아버지께서 심으신 것
  rationale: 신적 기원과 식재 비유를 함께 보존하고, 불필요하게 교리적 전문어를 덧붙이지 않았습니다.
- source_word: branches of the Cross
  choice: 십자가의 가지들
  rationale: 다소 낯선 원문의 혼합 은유를 매끄럽게 바꾸거나 해소하지 않고 그대로 보존했습니다.
- source_word: passion
  choice: 수난
  rationale: 그리스도의 고난과 죽음을 가리키는 고대 기독교 문맥에 적합하면서도 널리 이해되는 표현입니다.
- source_word: members
  choice: 지체
  rationale: 몸의 구성 부분이라는 은유와 교회 공동체적 함의를 함께 유지하는 전통적이면서 이해 가능한 용어입니다.
- source_word: union
  choice: 하나 됨
  rationale: ‘연합’보다 일반 독자에게 자연스럽고, 결합의 구체적 성격을 과도하게 규정하지 않습니다.
theological_decisions:
- issue: 십자가를 통한 부르심과 수난의 문법적 관계
  choice: ‘그 십자가를 통하여 그분은 수난을 겪으시고, … 우리를 부르십니다’로 번역
  alternative: ‘그분은 수난을 통하여 그 십자가로 우리를 부르십니다’
  rationale: 제공된 영어 증언의 ‘the Cross whereby He through His passion inviteth us’는 수식 관계가 다소 압축적입니다. 본문에는 자연스러운 독해를 제시하되, 각 요소의 관계가 다르게 이해될 수 있음을 각주로 밝혔습니다.
- issue: ‘이 하나 됨은 바로 그분 자신’의 지시 대상
  choice: 하나님 자신이 하나 됨이라는 역설적 진술을 그대로 유지
  alternative: 하나님이 하나 됨의 보증 또는 근원이시라고 설명적으로 번역
  rationale: 원문의 강한 동일시와 신학적 긴장을 설명으로 약화하거나 특정 교리 체계에 맞추지 않았습니다.
- issue: 머리의 지시 대상
  choice: 본문에서 명시적으로 ‘그리스도’라고 보충하지 않음
  alternative: ‘그리스도라는 머리’
  rationale: 문맥상 그리스도를 가리킬 가능성이 높지만, 제공된 증언에 없는 명사를 본문에 삽입하지 않아 원문의 은유와 여지를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 ‘피하십시오’로 직접적이되 품위 있게 표현했고, 식물·몸·머리의 연속된 은유는 낯설더라도 삭제하거나 현대적 개념으로 치환하지 않았습니다. 다만 그리스어 원문 검토가 보류된 상태이므로, 이 초안은 제공된 공용 영역 영어 증언에 근거한 잠정 번역입니다.
