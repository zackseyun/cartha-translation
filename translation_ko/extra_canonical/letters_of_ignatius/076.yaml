base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: ko
  text: 테오포로스라고도 하는 이그나티오스가, 아버지 하나님과 사랑받으시는 예수 그리스도의 교회에 문안드립니다. 이 교회는 자비로 모든 은혜를 받아 믿음과 사랑으로 충만하고, 어떤 은사도 부족하지 않으며, 지극히 존귀하고 거룩한 보화들을 지니고 있습니다. 곧 아시아의 스미르나에 있는 교회에, 흠 없는 영과 하나님의 말씀 안에서 풍성히 문안드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 중간형 그리스어 사본 전통에 대한 직접 대조가 아직 이루어지지 않았으므로, 어휘와 구문은 원문 검토 뒤 조정될 수 있습니다.
    reason: 제공 자료가 직접적인 그리스어 원문 검토가 아니라 공용 영어 증언에 의존한다는 한계를 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: 테오포로스
  rationale: 고유한 별칭으로 보존해 음역했습니다. ‘하나님을 지닌 자’ 또는 ‘하나님께서 지니신 자’라는 어원적 중의성을 본문에서 단정하지 않았습니다.
- source_word: Jesus Christ the Beloved
  choice: 사랑받으시는 예수 그리스도
  rationale: ‘사랑하시는’보다 피동 의미를 분명히 하되, 누구에게 사랑받는지는 원문의 수식 관계대로 열어 두었습니다.
- source_word: grace
  choice: 은혜 / 은사
  rationale: 첫 용례는 교회가 자비로 받은 포괄적인 호의와 선물을 뜻해 ‘은혜’로, ‘어떤 grace도 부족하지 않다’는 용례는 구체적 부여물의 뉘앙스를 살려 ‘은사’로 옮겼습니다.
- source_word: bearing holy treasures
  choice: 거룩한 보화들을 지니고
  rationale: 비유를 해석으로 풀지 않고 ‘보화’의 이미지를 보존했습니다.
- source_word: in a blameless spirit and in the word of God
  choice: 흠 없는 영과 하나님의 말씀 안에서
  rationale: ‘영’이 인간의 영인지 성령과 관련된 표현인지 확정하지 않고 형식적 병렬과 전치사적 관계를 유지했습니다.
- source_word: abundant greeting
  choice: 풍성히 문안드립니다
  rationale: 서신 인사말의 기능을 자연스러운 한국어로 나타내면서 ‘abundant’의 강조를 보존했습니다.
theological_decisions:
- issue: ‘하나님 아버지와 사랑받으시는 예수 그리스도의 교회’의 소유·관계 구조
  choice: ‘아버지 하나님과 사랑받으시는 예수 그리스도의 교회’
  alternative: ‘아버지 하나님과 그분께 사랑받으시는 예수 그리스도께 속한 교회’
  rationale: ‘사랑받으시는’의 행위 주체와 교회의 관계를 원문 증거 이상으로 특정하지 않았습니다.
- issue: ‘grace’의 반복이 동일 개념인지 은혜와 은사로 구별되는지
  choice: 문맥에 따라 ‘은혜’와 ‘은사’를 병용
  alternative: 두 곳 모두 ‘은혜’
  rationale: 첫 표현의 총체성과 둘째 표현의 결핍 없는 부여물이라는 뉘앙스를 현대 한국어에서 자연스럽게 드러냈으나, 원어 검토 전의 잠정적 판단입니다.
- issue: ‘흠 없는 영’의 정체
  choice: ‘영’으로 그대로 보존
  alternative: ‘흠 없는 마음’ 또는 ‘성령 안에서 흠 없이’
  rationale: 인간의 내적 태도나 성령을 가리킨다고 단정하지 않아 신학적 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 서신의 길고 수식적인 인사 구조는 두 문장으로 나누어 가독성을 높였고, 존엄한 문체와 반복적 수사 효과는 유지했습니다. 원어 검토가 보류된 상태이므로 확정적 해석을 피했습니다.
