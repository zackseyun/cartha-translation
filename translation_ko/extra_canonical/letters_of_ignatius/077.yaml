  source_fidelity: 핵심 기독론적 진술(‘하나님이신 예수 그리스도’, 다윗의 후손, 하나님의 아들), 세례의 목적, 본디오 빌라도와 헤롯 아래에서의 수난, 부활과 유대인·이방인의 포괄성은 충실히 보존되었습니다. 다만 마지막 구절의 ‘그분의 교회라는 한 몸’은 소유·관계가 다소 불명확하므로 ‘그분의 교회의 한 몸’으로 바로잡는 편이 원문의 교회-몸 관계를 더 정확히 드러냅니다. 또한 ‘사랑에 굳게 뿌리내리고’는 원문의 반복된 전치사구(‘사랑 안에서, 그리스도의 피 안에서’)를 약화하므로 이를 보존했습니다.
  naturalness: 전체적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘육신과 영으로’가 ‘못 박힌’ 상태를 수식함을 더 분명히 하고, ‘한 몸’ 관련 표현을 자연스럽게 다듬었습니다.
  terminology: ‘하나님이신’, ‘동정녀’, ‘본디오 빌라도’, ‘분봉왕 헤롯’, ‘의’, ‘고난’, ‘부활’, ‘성도’, ‘이방인’은 문맥과 격조에 적절합니다. ‘수난’도 가능하지만, 여기서는 기존의 ‘고난’이 본문의 넓은 πάθος 의미를 불필요하게 좁히지 않습니다.
  issues:
