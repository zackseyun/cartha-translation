    rationale: 원문은 ‘그분의 교회의 한 몸’이라는 소유·관계 구조입니다. 초안의 ‘교회라는 한 몸’은 교회가 몸이라는 설명처럼 읽힐 수 있어, ‘한 몸 안에서’라는 공동체적 범위를 충분히 드러내지 못합니다.
