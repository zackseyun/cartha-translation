id: IGN.026
reference: Letters of Ignatius — IgnMagn. 3
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: ko
  text: '그렇습니다. 여러분도 감독이 젊다고 해서 그를 얕보아서는 안 됩니다. 오히려 하나님 아버지의 능력에 따라 그에게 모든 존경을 드려야 합니다. 내가 알기로 거룩한 장로들 또한 그의 겉으로 드러나는 젊음을 이용하지 않고, 하나님 안에서 지혜로운 이에게 하듯 그에게 양보합니다. 그러나 그들은 그 감독 자신에게가 아니라 예수 그리스도의 아버지, 곧 모든 이의 감독이신 분께 그렇게 합니다.


    그러므로 여러분을 원하신 분의 명예를 위하여, 여러분은 거짓됨 없이 순종해야 합니다.[a] 사람이 속이는 것은 이 눈에 보이는 감독이라기보다 보이지 않는 그분입니다. 그런 경우 그는 육신이 아니라, 감추어진 것들을 아시는 하나님께 책임을 져야 합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “여러분을 원하신 분”이 누구를 가리키는지는 이 문맥과 제공된 영어 증언만으로 확정하기 어렵습니다.
    reason: 영어 증언이 보존한 지시 대상의 모호성을 유지하며, 하나님이나 감독으로 성급히 특정하지 않기 위해서입니다.
lexical_decisions:
- source_word: presume upon / taken advantage of
  choice: 가볍게 여기다 / 젊음을 이용하다
  rationale: 감독의 젊음을 빌미로 권위를 업신여기거나 부당하게 처신한다는 문맥을 자연스러운 현대 한국어로 구분해 옮겼습니다.
- source_word: render unto him all reverence
  choice: 그에게 온전한 존경을 표하다
  rationale: ‘모든 존경’을 직역하기보다 존중을 빠짐없이 드린다는 뜻을 품위 있고 명료하게 표현했습니다.
- source_word: give place to him
  choice: 그에게 자리를 내어 주다
  rationale: 단순한 공간 양보가 아니라 그의 직분과 판단을 인정하여 따르는 비유적 의미를 보존했습니다.
- source_word: without dissimulation
  choice: 꾸밈없이
  rationale: 겉으로만 순종하는 위선이나 가장이 없는 진실한 태도를 간결하게 나타냅니다.
- source_word: reckon with
  choice: 상대하다
  rationale: 행위의 궁극적 대상과 책임 소재를 가리키는 표현으로, 현대 독자가 쉽게 이해할 수 있게 옮겼습니다.
theological_decisions:
- issue: ‘모든 이의 감독’의 지시 대상과 감독 호칭
  choice: 예수 그리스도의 아버지 하나님을 ‘모든 이의 감독’으로 표현
  alternative: ‘만물의 감독자’ 또는 교회 직분명과 구별되는 ‘보살피시는 분’
  rationale: 본문이 인간 감독의 권위를 아버지 하나님께 연결하는 긴장을 유지하고, 반복되는 ‘감독’의 수사적 대응도 보존했습니다.
- issue: ‘그에게가 아니라 아버지께’의 의미
  choice: 장로들이 감독에게 양보하는 행위가 궁극적으로 아버지께 드리는 것임을 명시
  alternative: 감독 개인에게는 전혀 존경을 돌리지 않는다는 식으로 해석
  rationale: 앞 문장의 ‘그에게 온전한 존경’과 충돌하지 않도록, 가시적 직분자를 향한 존경의 궁극적 대상이 하나님이라는 구조를 살렸습니다.
- issue: ‘여러분을 원하신 분’의 정체
  choice: 본문에서 특정하지 않고 그대로 보존
  alternative: 하나님 또는 감독으로 명시
  rationale: 제공된 증거가 지시 대상을 확정하지 않으므로 신학적으로 섣불리 해소하지 않았습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 초기 교회의 직분 용어는 ‘감독’과 ‘장로’로 일관되게 옮겼으며, 권위에 관한 본문의 강한 어조를 유지하되 고어체나 특정 교파의 직제 용어는 피했습니다. 제공 자료가 공공 영역 영어 증언에 기초하고 그리스어 직접 검토가 아직 남아 있으므로, 단정하기 어려운 지시 관계는 각주로 보존했습니다.
