revisions:
- from: '그렇습니다. 여러분은 감독이 젊다고 해서 그를 가볍게 여겨서는 안 됩니다. 오히려 아버지 하나님의 권능에 따라 그에게 온전한 존경을 표해야 합니다. 내가 듣기로는 거룩한 장로들도 겉으로 드러난 그의 젊음을 이용하지 않고, 하나님 안에서 지혜로운 사람에게 하듯 그에게 자리를 내어 줍니다. 그러나 실상 그들이 자리를 내어 드리는 분은 그가 아니라 예수 그리스도의 아버지, 곧 모든 이의 감독이신 분입니다.


    그러므로 여러분을 원하신 분을 공경하기 위해, 여러분은 꾸밈없이 순종하는 것이 마땅합니다.[a] 사람이 속이는 것은 눈에 보이는 이 감독이라기보다 눈에 보이지 않는 그분입니다. 이런 사람은 육신을 상대하는 것이 아니라, 감추어진 것들을 아시는 하나님을 상대하는 것입니다.'
  to: '그렇습니다. 여러분도 감독이 젊다고 해서 그를 얕보아서는 안 됩니다. 오히려 하나님 아버지의 능력에 따라 그에게 모든 존경을 드려야 합니다. 내가 알기로 거룩한 장로들 또한 그의 겉으로 드러나는 젊음을 이용하지 않고, 하나님 안에서 지혜로운 이에게 하듯 그에게 양보합니다. 그러나 그들은 그 감독 자신에게가 아니라 예수 그리스도의 아버지, 곧 모든 이의 감독이신 분께 그렇게 합니다.


    그러므로 여러분을 원하신 분의 명예를 위하여, 여러분은 거짓됨 없이 순종해야 합니다.[a] 사람이 속이는 것은 이 눈에 보이는 감독이라기보다 보이지 않는 그분입니다. 그런 경우 그는 육신이 아니라, 감추어진 것들을 아시는 하나님께 책임을 져야 합니다.'
  rationale: 수정은 제공된 영어 증언의 의미 구조를 더 정확하고 자연스러운 현대 한국어로 드러내는 데 한정했습니다. 장로들의 ‘양보’가 물리적 자리 양보가 아니라 감독의 직분을 인정하는 태도임을 밝히고, 그 행위가 감독 개인에게 궁극적으로 향하는 것이 아니라 모든 이의 감독이신 하나님 아버지께 향한다는 대조를 보존했습니다. 또한 ‘명예를 위하여’와 ‘하나님께 책임을 져야 합니다’로 후반부의 목적과 책임의 의미를 회복했습니다.
