revisions:
- from: '내가 여러분에게 하늘의 일들을 써 보낼 수 없겠습니까? 그러나 여러분이 갓난아이와 같으므로, 내가 여러분에게 해를 끼치게 될까 두렵습니다. 그러니 나를 양해해 주십시오. 여러분이 그것들을 받아들일 수 없어 목이 막히는 일이 없도록 말입니다.


    나 자신도 비록 결박되어 있고, 하늘의 일들과 천사들의 대열과 권세들의 집결, 곧 보이는 것들과 보이지 않는 것들을 이해할 수 있다 해도, 그것 때문에 이미 제자가 된 것은 아닙니다. 하나님께서 우리에게 부족하지 않으시도록, 우리에게는 아직 많은 것이 부족하기 때문입니다.[a]'
