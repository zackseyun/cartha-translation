    For I myself also, albeit I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible---I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: ko
  text: '내가 여러분에게 하늘의 일들을 써 보낼 수 없겠습니까? 그러나 여러분이 갓난아이들이므로, 내가 여러분에게 해를 끼칠까 두렵습니다. 그러니 저를 양해해 주십시오. 여러분이 그것들을 받아들일 수 없어 질식할까 염려됩니다.


    나 자신도 비록 결박되어 있으면서 하늘의 일들과 천사들의 대열과 권세들의 집결, 곧 보이는 것들과 보이지 않는 것들을 이해할 수 있다 해도, 그렇다고 해서 나는 아직 제자가 아닙니다. 우리가 하나님을 잃지 않도록, 우리에게는 아직 많은 것이 부족합니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: heavenly things (Greek review pending)
  choice: 하늘의 일들
  rationale: ‘천상적인 것들’보다 자연스럽고 이해하기 쉬우면서도, 지상과 대비되는 영적·천상적 실재라는 폭넓은 뜻을 유지했습니다.
- source_word: babes / infants (Greek review pending)
  choice: 갓난아이와 같으므로
  rationale: 독자들을 문자적으로 갓난아이라고 단정하지 않고 비유적 의미를 분명히 하면서, 뒤따르는 ‘받아들이다’와 ‘목이 막히다’의 섭취 이미지를 보존했습니다.
- source_word: arrays of the angels
  choice: 천사들의 대열
  rationale: 천사들이 질서 있게 배열된 모습을 나타내는 군사적·질서적 이미지를 간결하게 살렸습니다.
- source_word: musterings of the principalities
  choice: 권세들의 집결
  rationale: ‘principalities’의 초월적 권세 의미와 ‘musterings’의 소집·집합 이미지를 보존했습니다. 직접 그리스어 검토 전이므로 존재들의 정확한 위계는 단정하지 않았습니다.
- source_word: disciple
  choice: 제자
  rationale: 초기 그리스도교 문맥에서 배움과 따름을 함께 나타내는 통상적이고 비종파적인 표현입니다.
theological_decisions:
- issue: 결박과 천상 지식이 제자 됨을 입증하는지 여부
  choice: ‘그것 때문에 이미 제자가 된 것은 아닙니다’로 번역
  alternative: ‘그런 지식이 있어도 나는 제자가 아닙니다’
  rationale: 저자는 자신의 제자 됨 자체를 전면 부정하기보다, 결박과 신비한 지식만으로 제자 됨이 완성되거나 입증되는 것은 아니라는 긴장을 나타내는 것으로 읽힐 수 있습니다. 원문 검토 전이므로 더 단정적인 해석을 피했습니다.
- issue: 마지막 목적절에서 인간의 부족함과 하나님의 비부족성 사이의 역설
  choice: ‘하나님께서 우리에게 부족하지 않으시도록’이라는 다소 역설적인 표현을 유지
  alternative: ‘우리가 하나님에게서 끊어지지 않도록’ 또는 ‘우리에게 하나님이 모자라지 않도록’
  rationale: 제공된 고대 번역 증언의 의도적으로 역설적인 문장을 교리적으로 매끄럽게 풀어 쓰지 않고 보존했습니다. 가능한 의미는 각주에 제시하되 본문에서는 하나로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 문장은 위엄을 유지하되 일반 독자가 이해할 수 있도록 구성했으며, ‘목이 막히다’와 같은 원문의 생생한 비유 및 마지막 문장의 신학적 긴장을 평탄화하지 않았습니다. 제공 자료가 영어 공개 영역 증언이고 그리스어 검토가 보류된 상태이므로, 세부 어휘 선택은 잠정적입니다.
