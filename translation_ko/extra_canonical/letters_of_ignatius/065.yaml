base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: ko
  text: 여러분의 이 감독은 공동체를 위한 직무를 맡고 있습니다. 내가 보기에 그는 이 직무를 자기 뜻으로 얻은 것도, 사람들을 통해 얻은 것도 아니며, 헛된 영광을 구하려고 맡은 것도 아닙니다. 오히려 하나님 아버지와 주 예수 그리스도를 사랑하는 가운데 맡았습니다. 나는 그의 너그러움에 놀랐습니다. 그는 침묵하면서도 헛된 말을 하는 사람들보다 더 큰 힘을 발휘합니다.[a] 그는 수금이 줄들과 조화를 이루듯 계명들과 조화를 이루고 있습니다. 그러므로 내 영혼은 하나님을 향한 그의 뜻을 복되다 합니다. 내가 보기에 그 뜻은 덕스럽고 온전합니다. 그는 흔들리지 않고 노여움에 휩쓸리지 않으며, 하나님의 모든 너그러움 안에서 살아갑니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 오래된 영어 번역은 이 문장을 ‘그의 침묵은 다른 사람들의 말보다 더 강합니다’라고 옮깁니다. 그러나 그리스어 전승은 비교 대상을 ‘헛된 말을 하는 사람들’로 더 구체적으로 나타냅니다.
    reason: 제공된 영어 증언과 중세 전승 그리스어 표현 사이의 차이를 독자에게 알리고 본문의 대조를 투명하게 제시합니다.
  - marker: b
    text: ‘하나님의 모든 너그러움 안에서’는 하나님의 너그러움을 본받는 삶, 하나님에게서 오는 너그러움 안의 삶, 또는 온전히 경건한 너그러움으로 사는 태도를 가리킬 수 있습니다.
    reason: 속격 표현이 지닌 의미의 여지를 한 가지 신학적 해석으로 제한하지 않기 위해 덧붙였습니다.
lexical_decisions:
- source_word: ministry / διακονία
  choice: 직무
  rationale: 감독이 공동체를 위해 맡은 공적 섬김과 책임을 함께 나타내며, 현대 한국어에서 자연스럽고 품위 있게 들리도록 했습니다.
- source_word: the common weal / εἰς τὸ κοινὸν ἀνήκουσαν
  choice: 공동체를 위한
  rationale: 단순한 추상적 ‘공익’보다 교회 공동체 전체에 관계된 직무라는 문맥을 자연스럽게 전달합니다.
- source_word: vain glory / κενοδοξία
  choice: 헛된 영광
  rationale: 자기 과시와 공허한 명예욕을 뜻하는 표현의 신학적·윤리적 무게를 보존합니다.
- source_word: forbearance / ἐπιείκεια
  choice: 너그러움
  rationale: 인내뿐 아니라 온화함, 관용, 절제된 태도를 포괄하는 말로 옮겼습니다.
- source_word: godly mind / τὴν εἰς θεὸν αὐτοῦ γνώμην
  choice: 하나님을 향한 그의 뜻
  rationale: 단순히 ‘경건한 마음’으로 평면화하지 않고 하나님을 지향하는 판단과 의향이라는 방향성을 살렸습니다.
- source_word: imperturbable and calm / ἀκίνητον … καὶ ἀόργητον
  choice: 흔들리지 않고 노여움에 휩쓸리지 않으며
  rationale: 내적 안정과 분노하지 않는 성품이라는 두 요소를 구별하여 구체적으로 표현했습니다.
theological_decisions:
- issue: 감독의 직무를 얻은 근원
  choice: ‘자기 뜻으로’도 ‘사람들을 통해’서도 얻지 않았다고 번역
  alternative: 하나님의 직접 임명이라고 명시
  rationale: 본문이 인간적 기원과 매개를 부정하고 하나님 사랑 안에서의 직무를 말하지만, 임명의 구체적 방식까지 단정하지 않으므로 암시를 교리적 진술로 확대하지 않았습니다.
- issue: 침묵의 능력과 비교 대상
  choice: 침묵하면서도 ‘헛된 말을 하는 사람들’보다 더 큰 힘을 발휘한다고 번역
  alternative: 그의 침묵이 다른 사람들의 일반적인 말보다 강하다고 번역
  rationale: 중세 전승 그리스어의 비교 대상에 담긴 ‘헛된 말을 하는 이들’이라는 윤리적 대조를 살리되, 침묵 자체를 절대화하지 않았습니다.
- issue: ‘하나님의 모든 너그러움 안에서’의 의미
  choice: 소유·근원 관계를 열어 둔 직역에 가까운 표현 유지
  alternative: ‘하나님께서 주시는 인내로’ 또는 ‘온전히 경건한 인내로’라고 해석
  rationale: 하나님의 성품을 본받는다는 뜻인지, 하나님에게서 오는 은혜인지, 경건한 태도인지 확정하지 않고 원문의 신학적 여지를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 초기 그리스도교 서신의 권면과 찬사의 품위를 유지했습니다. 긴 원문 문장을 짧게 나누어 일반 독자가 쉽게 이해하도록 했으며, 수금의 비유와 반복되는 윤리적 어휘는 보존했습니다. 제공 자료가 공공 영역 영어 증언을 중심으로 하고 원문 검토가 보류되었다고 밝히지만, 확인 가능한 중세 전승 그리스어 표현을 우선 고려하여 영어 증언의 평면화를 보완했습니다.
