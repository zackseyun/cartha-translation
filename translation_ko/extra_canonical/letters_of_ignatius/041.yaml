base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: ko
  text: '여러분이 예수 그리스도께 순종하듯 감독에게 순종하고 있으므로, 여러분이 사람을 따라 사는 것이 아니라 우리를 위하여 죽으신 예수 그리스도를 따라 살고 있음이 내게 분명합니다. 이는 여러분이 그분의 죽음을 믿어 죽음을 피하게 하시려는 것이었습니다.


    그러므로 여러분이 늘 해 오던 대로 감독 없이 아무것도 하지 않아야 합니다. 또한 우리의 소망이신 예수 그리스도의 사도들에게 순종하듯 장로단에도 순종하십시오. 우리가 그분 안에서 산다면 그분 안에 있는 사람으로 드러날 것입니다.


    이와 같이 예수 그리스도의 신비를 섬기는 집사들은 모든 사람을 모든 면에서 기쁘게 해야 합니다. 그들은 음식과 음료를 섬기는 집사가 아니라 하나님의 교회를 섬기는 종들이기 때문입니다. 그러므로 그들은 불을 피하듯 비난받을 일을 경계해야 합니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공공 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 중간본 그리스어 사본 전통에 대한 직접 검토가 아직 필요합니다.
    reason: 사용자가 제공한 자료가 영어 증언문이며 그리스어 원문 검토가 보류 중임을 독자에게 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: bishop (Greek source review pending; likely ἐπίσκοπος)
  choice: 감독
  rationale: 초기 교회의 직분을 나타내는 말로서 한국어 독자에게 비교적 널리 알려진 ‘감독’을 사용했습니다. 후대 교단 제도를 본문에 소급해 확정하지 않습니다.
- source_word: presbytery (likely πρεσβυτέριον)
  choice: 장로단
  rationale: 개별 장로가 아니라 장로들로 이루어진 집단을 가리키는 의미를 살렸습니다.
- source_word: deacons (likely διάκονοι)
  choice: 집사들
  rationale: 문맥상 교회의 직분자를 가리키므로 통용되는 명칭인 ‘집사’를 사용하되, 이어지는 섬김의 의미도 드러나게 했습니다.
- source_word: mysteries (likely μυστήρια)
  choice: 신비
  rationale: 성례나 비밀로 좁혀 단정하지 않고, 그리스도와 관련된 거룩한 실재라는 원문의 폭을 보존했습니다.
- source_word: be found in him
  choice: 그분 안에 있는 사람으로 드러날 것입니다
  rationale: 단순한 위치 표현보다 종말론적 판명 또는 인정을 함축할 수 있는 ‘발견되다’의 수동적 뉘앙스를 자연스러운 한국어로 살렸습니다.
- source_word: blame
  choice: 비난받을 일
  rationale: 직분자가 책망이나 비난을 초래할 행위를 경계한다는 뜻으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 감독에 대한 순종과 그리스도에 대한 순종의 비교
  choice: ‘예수 그리스도께 순종하듯 감독에게 순종’
  alternative: 감독에게 순종하는 것이 곧 그리스도께 순종하는 것이라고 동일시
  rationale: ‘as to’의 비교 구조를 보존하여 두 권위를 완전히 동일시하지 않았습니다.
- issue: ‘그분의 죽음을 믿는다’의 의미
  choice: 그분의 죽음을 믿어
  alternative: 그분의 죽음으로 말미암아 믿어 / 그분의 죽으심에 참여하여
  rationale: 제공된 증거가 지닌 목적·수단 관계와 표현상의 긴장을 그대로 두고 교리적으로 확대 해석하지 않았습니다.
- issue: 집사들이 모든 사람을 기쁘게 해야 한다는 명령
  choice: 모든 사람을 모든 면에서 기쁘게 해야 합니다
  alternative: 모든 사람에게 전적으로 인정받아야 합니다
  rationale: 원문 검토가 보류된 상황에서 영어 증언문의 강한 표현을 완화하지 않고 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 공손한 합쇼체를 사용했습니다. 권면에서는 ‘-십시오’, 설명에서는 ‘-습니다’를 사용했으며, 초기 교회 직분 용어는 현대 특정 교단의 제도를 전제하지 않도록 절제하여 번역했습니다.
