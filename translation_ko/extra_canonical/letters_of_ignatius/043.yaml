  english_witness: 'I have many deep thoughts in God: but I take the measure of myself, lest I perish in my boasting. For now I ought to be the more afraid and not to give heed to those that would puff me up: for they that say these things to me are a scourge to me.


    For though I desire to suffer, yet I know not whether I am worthy: for the envy of the devil is unseen indeed by many, but against me it wages the fiercer war. So then I crave gentleness, whereby the prince of this world is brought to nought.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: ko
  text: '나는 하나님 안에서 깊은 생각을 많이 품고 있습니다. 그러나 자랑하다가 멸망하지 않도록 내 분수를 헤아립니다. 지금 나는 더욱 두려워해야 하며, 나를 우쭐하게 만들려는 이들의 말에 귀를 기울이지 말아야 합니다. 그런 말을 내게 하는 사람들은 내게 채찍과 같기 때문입니다.


    나는 고난받기를 바라지만, 내가 그럴 자격이 있는지는 알지 못합니다. 악마의 시기는 많은 사람에게 보이지 않지만, 나를 상대로는 더욱 거세게 싸움을 벌입니다. 그러므로 나는 온유함을 간절히 구합니다. 이 온유함으로 이 세상의 통치자가 무력해집니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deep thoughts in God
  choice: 하나님 안에서 깊은 생각
  rationale: 직접 그리스어 대조가 보류된 상태이므로 영어 증언의 의미와 ‘in God’의 관계적 표현을 과도하게 해석하지 않고 보존했습니다.
- source_word: take the measure of myself
  choice: 내 분수를 헤아립니다
  rationale: 자기 자신을 절제하고 한계를 인식한다는 뜻을 자연스러운 현대 한국어로 나타냈습니다.
- source_word: puff me up
  choice: 나를 우쭐하게 만들다
  rationale: 칭찬으로 교만해지게 한다는 비유적 의미를 일반 독자가 이해하기 쉽게 옮겼습니다.
- source_word: a scourge to me
  choice: 내게 채찍과 같다
  rationale: 고통과 영적 위험을 주는 존재라는 원문의 강한 비유를 유지했습니다.
- source_word: gentleness
  choice: 온유함
  rationale: 초기 기독교 윤리 문맥에 어울리는 dignified한 용어이며, 단순한 부드러움보다 성품과 태도를 함께 드러냅니다.
- source_word: the prince of this world
  choice: 이 세상의 통치자
  rationale: 요한계 문헌과 초기 기독교 전통에서 익숙한 표현을 쓰되, 정체를 본문 안에서 추가로 규정하지 않았습니다.
- source_word: brought to nought
  choice: 무력해집니다
  rationale: 완전한 존재 소멸로 오해될 수 있는 표현을 피하면서 그 권세와 활동이 효력을 잃는 뜻을 전달했습니다.
theological_decisions:
- issue: ‘고난받을 자격’의 의미
  choice: 내가 그럴 자격이 있는지는 알지 못합니다
  alternative: 내가 합당한지는 알지 못합니다
  rationale: 순교 또는 고난을 받을 만한 영적 자격에 대한 화자의 불확실성을 해소하지 않고 보존했습니다.
- issue: 악마의 ‘시기’가 보이지 않는다는 진술
  choice: 악마의 시기는 많은 사람에게 보이지 않지만
  alternative: 악마의 질투는 많은 이가 알아차리지 못하지만
  rationale: ‘envy’를 악마의 공격 자체로 바꾸지 않고 감정·동기의 표현으로 유지했으며, ‘unseen’도 인식되지 않는다는 해석으로 단정하지 않았습니다.
- issue: 온유함이 세상의 통치자를 무력하게 하는 방식
  choice: 이 온유함으로 이 세상의 통치자가 무력해집니다
  alternative: 이 온유함을 통하여 이 세상의 통치자는 아무것도 아닌 것이 됩니다
  rationale: 수단 관계를 보존하되, 악마의 존재론적 소멸을 주장하는 듯한 과잉 해석은 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 다만 이 초안은 제공된 공용 영어 증언에 근거하며, 중간본 그리스어 사본 전통에 대한 직접 검토가 보류되어 있으므로 어휘상 세부 의미는 잠정적입니다.
