id: IGN.025
reference: Letters of Ignatius — IgnMagn. 2
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: Forasmuch then as I was permitted to see you in the person of Damas your godly bishop and your worthy presbyters Bassus and Apollonius and my fellow-servant the deacon Zotion, of whom I would fain have joy, for that he is subject to the bishop as unto the grace of God and to the presbytery as unto the law of Jesus Christ:--
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: Forasmuch then as I was permitted to see you in the person of Damas your godly bishop and your worthy presbyters Bassus and Apollonius and my fellow-servant the deacon Zotion, of whom I would fain have joy, for that he is subject to the bishop as unto the grace of God and to the presbytery as unto the law of Jesus Christ:--
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: ko
  text: 그러므로 나는 여러분의 경건한 감독 다마스와 존경받는 장로 바수스와 아폴로니우스, 그리고 나와 함께 섬기는 부제 조티온을 통해 여러분을 만나는 것이 허락되었습니다. 나는 조티온으로 말미암아 기뻐하고 싶습니다. 그는 하나님의 은혜를 대하듯 감독에게 복종하고, 예수 그리스도의 법을 대하듯 장로단에게 복종하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 중간 판본 그리스어 사본 전통에 대한 직접 대조가 아직 필요합니다.
    reason: 원문 언어 검토가 보류된 상태라는 자료상의 한계를 독자에게 투명하게 밝힙니다.
lexical_decisions:
- source_word: godly
  choice: 경건한
  rationale: 하나님을 향한 신앙적 품성을 나타내면서도 감독 자체를 신격화하지 않는 자연스러운 표현입니다.
- source_word: presbyters / presbytery
  choice: 장로 / 장로단
  rationale: 개별 직분자들과 그 집단을 구별하며 초기 교회의 직분 용어를 일관되게 전달합니다.
- source_word: fellow-servant
  choice: 나와 함께 섬기는
  rationale: 직역투인 ‘동료 종’보다 자연스러우면서 공동의 섬김이라는 뜻을 보존합니다.
- source_word: deacon
  choice: 부제
  rationale: 초기 교회의 직분을 가리키는 역사적 교회 용어로 옮겼습니다.
- source_word: is subject to
  choice: 복종하다
  rationale: 권위 아래 자신을 두는 의미를 분명히 전달하며, 두 병렬 구절에서 같은 표현을 유지합니다.
- source_word: law
  choice: 법
  rationale: 예수 그리스도의 규범적 권위를 드러내는 원문의 강한 표현을 완화하지 않았습니다.
theological_decisions:
- issue: 감독과 하나님의 은혜, 장로단과 그리스도의 법 사이의 비유
  choice: ‘대하듯’을 사용해 비유 관계로 번역
  alternative: 감독을 하나님의 은혜 자체로, 장로단을 예수 그리스도의 법 자체로 동일시하는 번역
  rationale: 영어 증언의 ‘as unto’가 나타내는 비교의 구조를 보존하고, 교회 직분과 신적 실재를 단정적으로 동일시하지 않았습니다.
- issue: 교회 직분에 대한 복종의 강도
  choice: ‘복종하다’
  alternative: ‘따르다’ 또는 ‘존중하다’
  rationale: 본문의 권위 관계를 약화하지 않되, 그 범위나 교리적 함의를 본문 이상으로 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 교회의 직분 명칭은 역사성을 살리되 일반 독자가 이해할 수 있는 용어로 옮겼으며, 길게 이어지는 원문의 문장은 의미 관계가 선명하도록 두 문장으로 나누었습니다.
