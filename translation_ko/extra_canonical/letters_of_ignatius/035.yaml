  source_fidelity: 대체로 제공된 영어 증언을 충실히 따르지만, 첫 문장의 ‘해 주십시오’는 원문의 기원/소망 표현을 수신자에게 하는 요청처럼 바꿉니다. ‘예수 그리스도께서 계시므로’도 영어 증언의 ‘you have Jesus Christ within you’보다 한 단계 해석적인 서술입니다. 인용문은 제공된 증언의 법정적 ‘self-accuser’를 잘 보존합니다.
  naturalness: 현대 한국어로 대체로 자연스럽고 합쇼체도 유지됩니다. 다만 ‘여러분으로 말미암아 기쁨을 누리게 해 주십시오’는 어색하며, ‘자유로운 여러분 가운데 어느 누구’는 ‘자유로운 여러분 가운데 어느 한 사람’이 더 매끄럽습니다.
  terminology: ‘사슬에 매여’, ‘교만해지지 않다’, ‘자신을 고발하다’는 적절합니다. ‘여러분 안에 예수 그리스도를 지니고’는 원문의 소유 구문을 보존하면서도 특정 교리적 설명을 덧붙이지 않습니다. 인용문 각주는 잠언 18:17과의 관련 및 그리스어 본문 대조 보류 사실을 적절히 알립니다.
