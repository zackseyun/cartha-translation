base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: ko
  text: 내가 자격이 있다면, 모든 일에서 여러분으로 말미암아 기쁨을 누리게 해 주십시오. 나는 비록 사슬에 매여 있지만, 자유로운 여러분 가운데 어느 누구와도 견줄 수 없습니다. 여러분 안에 예수 그리스도께서 계시므로, 여러분이 교만해지지 않는다는 것을 나는 압니다. 또한 내가 여러분을 칭찬할 때면 여러분이 오히려 더욱 부끄러워한다는 것도 압니다. 기록된 말씀과 같습니다. “의인은 자신을 고발합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 잠언 18:17의 고대 그리스어 번역 전통을 반영한 인용으로 보입니다. 현재 번역은 제공된 영어 증언을 바탕으로 한 잠정 번역이며, 중간본 그리스어 본문과의 직접 대조가 필요합니다.
    reason: 인용문의 출처와 번역의 잠정적 성격을 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: χαίροιμί ὑμῶν (probable underlying Greek)
  choice: 여러분으로 말미암아 기쁨을 누리게 해 주십시오
  rationale: 영어 증언의 ‘have joy of you’를 현대 한국어로 자연스럽게 옮기면서, 공동체를 두고 기뻐한다는 관계적 뜻을 보존했습니다.
- source_word: δεδεμένος / bonds (source-language review pending)
  choice: 사슬에 매여 있지만
  rationale: 문자적인 구금 상태를 나타내는 표현을 유지했습니다.
- source_word: ἐλευθέρων / at liberty (source-language review pending)
  choice: 자유로운
  rationale: 결박된 이그나티우스와 자유로운 수신자들의 대조를 간결하게 살렸습니다.
- source_word: φυσιόω / puffed up (source-language review pending)
  choice: 교만해지지 않는다
  rationale: ‘부풀다’라는 비유를 직역하기보다 문맥상 의미인 교만을 일반 독자가 분명히 이해하도록 표현했습니다.
- source_word: ἑαυτοῦ κατήγορος / self-accuser (probable citation wording)
  choice: 자신을 고발합니다
  rationale: 법정적 어감을 보존하고, ‘자책하다’처럼 심리적 의미로 축소하지 않았습니다.
theological_decisions:
- issue: ‘여러분 안에 예수 그리스도께서 계시다’의 의미
  choice: 여러분 안에 예수 그리스도께서 계시므로
  alternative: 여러분이 예수 그리스도를 마음에 모시고 있으므로
  rationale: 그리스도의 내주에 관한 원문의 직접적인 표현과 그 신학적 긴장을 유지하고, 해석적인 경건 문구로 바꾸지 않았습니다.
- issue: 의인이 자신을 고발한다는 인용문의 성격
  choice: “의인은 자신을 고발합니다.”
  alternative: “의인은 먼저 자신을 책망합니다.”
  rationale: 제시된 증언의 법정적 표현을 보존했습니다. 다만 직접 그리스어 대조가 아직 이루어지지 않았으므로 인용문의 정확한 형태는 각주에서 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 원문의 겸손과 수신자들을 향한 따뜻한 칭찬을 살리되 과도하게 고풍스럽거나 교파적인 표현은 피했습니다. 제공 자료상 그리스어 원문 검토가 보류되어 있으므로, 영어 공공 영역 증언을 토대로 작성한 잠정 출판 초안입니다.
