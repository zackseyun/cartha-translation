base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: ko
  text: '이 가운데 어느 것도 여러분에게 숨겨져 있지 않습니다. 여러분이 예수 그리스도를 향한 믿음과 사랑 안에서 온전하다면 말입니다. 이것들이 생명의 시작과 끝이기 때문입니다. 믿음은 시작이고 사랑은 끝입니다. 이 둘이 하나로 결합되어 있는 것이 하나님이며,[a] 그 밖의 모든 것은 이 둘을 따라 참된 고결함에 이릅니다.


    믿음을 고백하는 사람은 죄를 짓지 않고, 사랑을 지닌 사람은 미워하지 않습니다.[b] 나무는 그 열매로 드러납니다. 이와 같이 그리스도께 속한다고 고백하는 사람들도 그 행실로 알아볼 수 있습니다. 참으로 그 일은 이제 말로 고백하는 데 있지 않고, 끝까지 믿음의 능력 안에 있는 사람에게서 드러납니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “이 둘이 하나로 결합되어 있는 것이 하나님”이라는 표현은 현존 영어 증언문의 난해한 문구를 그대로 살린 것입니다. 믿음과 사랑이 곧 하나님이라는 뜻인지, 그 일치 안에 하나님이 계신다는 뜻인지는 직접적인 그리스어 검토 전에는 확정하기 어렵습니다.
    reason: 신학적으로 긴장된 표현의 진정한 모호성을 보존하고 번역의 잠정성을 알리기 위해서입니다.
  - marker: b
    text: “죄를 짓지 않고”와 “미워하지 않습니다”는 원문의 단정적인 대조를 반영합니다. 이를 ‘습관적으로 죄짓지 않는다’와 같은 뜻으로 제한하지 않았습니다.
    reason: 본문 자체가 명시하지 않은 교리적 한정을 번역에 삽입하지 않기 위해서입니다.
  - marker: c
    text: “그 일”은 영어 증언문에서 대문자로 적힌 “the Work”에 해당합니다. 여기서는 특정한 전문 용어로 단정하지 않았으며, 문맥상 그리스도께 속한 사람임을 행실로 드러내는 일을 가리키는 것으로 옮겼습니다.
    reason: 영어 증언문의 대문자 표기를 한국어에서 신학적 고유명사로 과도하게 확정하지 않기 위해서입니다.
lexical_decisions:
- source_word: perfect
  choice: 온전하다
  rationale: 도덕적 무결점으로만 좁혀질 수 있는 ‘완벽하다’보다, 믿음과 사랑 안에서 성숙하고 완결된 상태를 나타내는 표현을 택했습니다.
- source_word: beginning and end of life
  choice: 생명의 시작과 끝
  rationale: 증언문이 지닌 대구 구조와 신학적 함의를 그대로 보존했습니다.
- source_word: true nobility
  choice: 참된 고결함
  rationale: 신분적 ‘귀족성’보다는 덕성과 삶의 품격을 가리키는 문맥에 맞추면서 원문의 격조를 살렸습니다.
- source_word: professing faith / profess to be Christ's
  choice: 믿음을 고백하다 / 그리스도께 속한다고 고백하다
  rationale: 단순한 주장보다 공개적인 신앙 고백의 뜻을 담되, 실제 행실과 대비되는 문맥을 유지했습니다.
- source_word: the Work
  choice: 그 일
  rationale: 영어 증언문의 대문자 표기는 따르지 않았습니다. 현 단계에서는 그것이 특정한 전문 용어나 고유 개념임을 확정할 직접 그리스어 검토가 없기 때문입니다.
- source_word: power of faith
  choice: 믿음의 능력
  rationale: ‘능력’이라는 강한 표현을 약화하지 않고 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: ‘the two being found in unity are God’의 관계 규정
  choice: 이 둘이 하나로 결합되어 있는 것이 하나님이며
  alternative: 이 둘이 하나가 될 때 하나님께 이르며 / 이 둘은 하나님에게서 나온다
  rationale: 믿음과 사랑의 일치를 곧바로 하나님과 연결하는 증언문의 긴장된 진술을 교리적으로 완화하거나 설명하지 않았습니다.
- issue: 믿음을 고백하는 사람은 죄를 짓지 않는다는 절대적 진술
  choice: 믿음을 고백하는 사람은 죄를 짓지 않고
  alternative: 참으로 믿는 사람은 죄 가운데 살지 않고
  rationale: 반복적 죄나 생활 방식으로 의미를 제한하는 해석을 본문에 덧붙이지 않고, 증언문의 단정적 표현을 유지했습니다.
- issue: 사랑을 지닌 사람은 미워하지 않는다는 진술
  choice: 사랑을 지닌 사람은 미워하지 않습니다
  alternative: 사랑하는 사람은 증오를 품지 않습니다
  rationale: 믿음과 사랑, 죄와 미움의 평행 구조를 보존하고 교리적 보충 설명을 피했습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되, 초기 그리스도교 서신의 권면문다운 장중함을 유지했습니다. 문장을 지나치게 고어적으로 만들지 않았고, ‘믿음—사랑’, ‘시작—끝’, ‘고백—행실’의 대구를 선명하게 살렸습니다. 제공 자료가 공공 영역 영어 증언문이며 직접 그리스어 검토가 보류된 상태이므로, 난해하거나 신학적으로 민감한 대목은 본문에서 임의로 해소하지 않고 각주로 밝혔습니다.
