    rationale: ‘교회의 감독’은 문법적으로 가능하나 소유·소속 관계가 중첩되어 읽기가 불편합니다. ‘스미르나인들의 교회 감독’은 원문의 ‘bishop of the church of the Smyrnaeans’를 간결하게 보존합니다.
