  yaml_path: translation/extra_canonical/letters_of_ignatius/090.yaml
  text: Ignatius, who is also called Theophorus, to Polycarp, bishop of the church of the Smyrnaeans—or rather, one who has God the Father and Jesus Christ as his bishop—abundant greeting.
translation:
  language: ko
  text: 테오포로스라고도 하는 이그나티오스가, 스미르나인들의 교회의 감독인 폴리카르포스, 아니 오히려 하나님 아버지와 예수 그리스도를 감독으로 모신 이에게 풍성한 문안을 드립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 현재 공개 영역 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 중간형 그리스어 사본 전통에 대한 직접 원문 검토가 필요합니다. ‘테오포로스’는 ‘하나님을 모신 자’ 또는 ‘하나님께서 안으신 자’로 이해될 수 있습니다.
    reason: 직접 그리스어 원문 검토가 보류된 자료적 한계와 별칭의 어원적 중의성을 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: Theophorus (Θεοφόρος)
  choice: 테오포로스
  rationale: 고유한 별칭으로 음역하여 ‘하나님을 모신 자’ 또는 ‘하나님께서 안으신 자’일 수 있는 어원적 중의성을 본문에서 임의로 해소하지 않았습니다.
- source_word: bishop (ἐπίσκοπος)
  choice: 감독
  rationale: 초기 교회의 직분 명칭과 이어지는 하나님 아버지 및 예수 그리스도에 대한 수사적 반복을 함께 보존합니다.
- source_word: Smyrnaeans
  choice: 스미르나인들
  rationale: 도시 주민을 가리키는 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: abundant greeting
  choice: 풍성한 문안을 드립니다
  rationale: 서신 머리말의 인사 기능과 ‘풍성히’라는 강조를 모두 살리면서 한국어 합쇼체로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘하나님 아버지와 예수 그리스도를 감독으로 모신’의 수식 대상
  choice: 폴리카르포스를 가리키도록 번역
  alternative: 스미르나인들의 교회를 가리키는 것으로 번역
  rationale: 제시된 고대 번역 증거와 영어 대조본의 문장 구조를 따랐습니다. 다만 그리스어 원문 직접 검토가 보류되어 있으므로 각주에 잠정성을 밝혔습니다.
- issue: God the Father and Jesus Christ에 단수 ‘bishop’가 연결되는 표현
  choice: ‘감독으로 모신’으로 수의 충돌을 피하면서 원문의 결합을 보존
  alternative: ‘감독들로 모신’ 또는 ‘두 감독으로 모신’
  rationale: 원 증거의 단수 표현이 만드는 신학적·수사적 긴장을 복수화하여 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서신 머리말답게 한 문장으로 유지하되, ‘아니 오히려’라는 자기수정적 수사를 살렸습니다. ‘모신’은 사람인 폴리카르포스와 신적 감독의 관계를 자연스럽고 공경하는 어감으로 표현합니다.
