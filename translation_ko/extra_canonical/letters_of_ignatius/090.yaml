    rationale: 원문과 영어 POB는 ‘who has God ... as his bishop’가 폴리카르포스를 가리킵니다. 한국어에서 ‘자신의 감독으로 모신 폴리카르포스’라고 하여 수식 대상을 분명히 하되, 원문의 단수 ‘bishop’은 그대로 유지합니다.
