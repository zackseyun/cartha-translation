base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: ko
  text: 테오포로스라고도 하는 이그나티오스가, 아버지 하나님의 충만하심으로 크게 복을 받고, 영원 전부터 미리 정해져 영원히 지속되고 변하지 않는 영광을 누리며, 아버지와 우리 하나님 예수 그리스도의 뜻에 따라 참된 수난 안에서 하나가 되고 선택받은, 모든 축하를 받기에 합당한 [아시아의][a] 에페소 교회에 문안합니다. 예수 그리스도 안에서 흠 없는 기쁨으로 풍성히 문안합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아시아의’는 이 영어 증거문에서 대괄호로 표시된 복원어입니다.
    reason: 증거문의 본문 비평적 복원 신호를 보존하기 위해 표지와 설명을 함께 제시했습니다.
lexical_decisions:
- source_word: Theophorus
  choice: 테오포로스
  rationale: 이름 또는 칭호의 의미가 이 증거문만으로 확정되지 않으므로 해석하지 않고 음역했습니다.
- source_word: plentitude of God the Father
  choice: 아버지 하나님의 충만하심
  rationale: 신학적 함의를 임의로 축소하지 않으면서 원문의 추상적 표현을 보존했습니다.
- source_word: foreordained before the ages
  choice: 영원 전부터 미리 정해져
  rationale: 시간 이전의 예정이라는 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: a true passion
  choice: 참된 수난
  rationale: passion을 일반적인 감정이 아니라 그리스도의 고난을 가리킬 가능성이 큰 전승적 표현으로 보존하되, 그 관계를 본문에서 더 구체적으로 단정하지 않았습니다.
- source_word: all felicitation
  choice: 모든 축하를 받기에 합당한
  rationale: 칭송이나 복됨으로 의역해 의미를 좁히지 않고 영어 증거문의 축하·찬사의 뜻을 살렸습니다.
- source_word: blameless joy
  choice: 흠 없는 기쁨
  rationale: 윤리적·종교적 뉘앙스를 지닌 ‘blameless’를 간결하게 보존했습니다.
theological_decisions:
- issue: ‘Jesus Christ our God’의 호칭 관계
  choice: 우리 하나님 예수 그리스도
  alternative: 우리의 하나님이신 예수 그리스도
  rationale: 예수 그리스도에게 ‘우리 하나님’이라는 호칭이 직접 연결되는 문장 구조를 유지하면서도 한국어에서 불필요한 설명을 덧붙이지 않았습니다.
- issue: ‘united and elect in a true passion’의 수식 관계
  choice: 참된 수난 안에서 하나가 되고 선택받은
  alternative: 참된 수난으로 연합되고 선택받은
  rationale: ‘in’의 영역·관계적 모호성을 유지하고, 수난이 수단이라고 단정하지 않았습니다.
- issue: 교회를 여성 대명사로 지칭하는 표현
  choice: 대명사를 반복하지 않고 ‘교회’로 명시
  alternative: 그녀에게
  rationale: 한국어에서 교회를 여성 대명사로 받으면 부자연스럽고 오해를 낳으므로 문법적 성은 재현하지 않되 수신자가 교회임은 분명히 했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서간 머리말의 장중한 연속 구조는 유지하되, 지나치게 긴 수식 관계가 불명확해지지 않도록 한국어 어순을 조정했습니다. 현재 초안은 제공된 공용 영어 증거문에 근거한 잠정 번역이며, 중간 판본 그리스어 본문에 대한 직접 검토가 필요합니다.
