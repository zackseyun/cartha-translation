source:
  text: Ignatius, who is also Theophorus, unto her which hath been blessed in greatness through the plentitude of God the Father; which hath been foreordained before the ages to be forever and unto abiding and unchangeable glory, united and elect in a true passion, by the will of the Father and of Jesus Christ our God; even unto the church which is at Ephesus [of Asia], worthy of all felicitation; abundant greeting in Christ Jesus and in blameless joy.
