base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: ko
  text: '여러분은 지금까지 어느 누구도 시기하지 않았고, 다른 이들을 가르쳤습니다. 나는 여러분이 가르치며 명하신 그 교훈들이 굳게 지켜지기를 바랍니다.


    다만 나를 위하여, 내가 안으로나 밖으로나 능력을 지니도록 기도해 주십시오. 그리하여 내가 말만 하는 것이 아니라 원하기도 하며, 그리스도인이라 불리기만 하는 것이 아니라 실제로 그런 사람으로 드러나게 해 주십시오. 내가 실제로 그런 사람으로 드러난다면 그리스도인이라 불릴 수도 있고, 세상에 더 이상 보이지 않게 될 때 참으로 신실한 사람이 될 수도 있습니다.


    눈에 보이는 것은 아무것도 선하지 않습니다.[a] 우리 하나님 예수 그리스도께서는 아버지 안에 계시므로 오히려 더욱 분명히 나타나십니다.[b] 이 일은 설득의 말에 달린 것이 아닙니다. 그리스도교는 위대함에 속한 것이며, 세상에게 미움을 받을 때 그러합니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈에 보이는 것’은 세상의 평가와 외적 명성처럼 현세에 드러나는 것을 가리킬 수 있습니다. 이 문장은 모든 가시적 피조물이 악하다는 체계적 주장으로 단정할 필요는 없습니다.
    reason: 문장만 떼어 읽을 때 물질세계 전체를 악으로 규정하는 것으로 오해할 가능성을 줄이되, 원문의 단정적 표현은 본문에 그대로 보존합니다.
  - marker: b
    text: ‘아버지 안에 계시므로’와 ‘더욱 분명히 나타나십니다’의 관계는 역설적입니다. 보이지 않는 아버지 안에 계신 그리스도께서 신실한 증언, 특히 죽음에 이르는 증언을 통해 더욱 드러나신다는 문맥으로 이해할 수 있습니다.
    reason: 원문의 압축된 신학적 역설을 한 가지 교리적 해석으로 본문 안에서 확정하지 않기 위해 설명합니다.
  - marker: c
    text: ‘위대함’으로 옮긴 말은 ‘힘’ 또는 ‘큰 능력’의 뉘앙스를 포함할 수 있습니다. 뜻은 그리스도교의 진실성이 말재주보다 세상의 미움 속에서 드러나는 실제적 힘에 있다는 것으로 이해할 수 있습니다.
    reason: 그리스어 μεγέθους의 의미 폭과 제공된 영어 증언의 ‘might’를 함께 알리면서 원문의 대조를 보존합니다.
lexical_decisions:
- source_word: ἐβασκάνατε
  choice: 시기하지 않았고
  rationale: 누군가의 선한 몫이나 성취를 못마땅해하는 뜻을 나타냅니다. 영어 증언의 ‘begrudged’보다 그리스어 동사의 기본 의미를 직접 반영했습니다.
- source_word: βέβαια ᾖ
  choice: 굳게 지켜지기를
  rationale: 교훈이 확고하고 유효하게 남는다는 뜻을 자연스러운 한국어로 나타냈습니다.
- source_word: δύναμιν
  choice: 능력
  rationale: 내적 의지와 외적 실천을 모두 감당하게 하는 힘이라는 문맥을 보존했습니다.
- source_word: εὑρεθῶ
  choice: 실제로 그런 사람으로 드러나게
  rationale: 단순히 ‘발견되다’보다 검증을 거쳐 실상이 밝혀진다는 의미를 전달합니다.
- source_word: φαίνωμαι / φαίνεται
  choice: 보이지 않게 / 나타나십니다
  rationale: 같은 어근이 만드는 ‘세상에서 사라짐’과 ‘더욱 나타남’의 역설적 연결을 살렸습니다.
- source_word: πεισμονῆς
  choice: 설득의 말
  rationale: 수사적 말이나 말로 남을 납득시키는 행위를 가리키는 표현으로 이해하되, 단순히 ‘웅변’으로 좁히지 않았습니다.
- source_word: μεγέθους
  choice: 위대함
  rationale: 제공된 영어 증언의 ‘might’보다 그리스어 ‘크기, 위대함’에 가까운 표현을 택했습니다.
- source_word: Χριστιανισμός
  choice: 그리스도교
  rationale: 개인의 ‘그리스도인 됨’만이 아니라 그리스도인의 신앙과 삶의 실재 전체를 가리키는 명사형을 반영했습니다.
theological_decisions:
- issue: ‘세상에 더 이상 보이지 않게 될 때’의 의미
  choice: 순교와 죽음을 암시하되 본문에서 명시적으로 풀어 쓰지 않음
  alternative: ‘내가 순교하여 죽을 때’로 번역
  rationale: 문맥상 순교를 가리키지만 원문은 ‘세상에 보이지 않다’라는 간접적이고 역설적인 표현을 사용하므로 그 긴장을 보존했습니다.
- issue: ‘우리 하나님 예수 그리스도’의 문법적 관계
  choice: 예수 그리스도를 ‘우리 하나님’으로 직접 호칭
  alternative: ‘우리 하나님의 예수 그리스도’
  rationale: 그리스어 동격 구조를 자연스럽게 반영하며, 예수 그리스도에 대한 본문의 높은 기독론적 표현을 약화하지 않았습니다.
- issue: 그리스도교와 세상의 미움의 관계
  choice: ‘세상에게 미움을 받을 때 그러합니다’로 조건적·시간적 표현을 유지
  alternative: ‘세상의 미움을 이겨 내는 강력한 종교입니다’
  rationale: 원문의 ὅταν이 가진 ‘~할 때’의 구조를 보존하고, 승리나 저항이라는 해석을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 순교 문맥의 긴장과 ‘보이지 않음/나타남’의 반복을 보존했으며, 문장을 지나치게 교리적으로 풀어 쓰지 않았습니다. 제공 자료는 중간형 그리스어 전승을 지목하지만 직접 대조가 아직 완료되지 않았다고 명시하므로, 알려진 그리스어 문구와 공공 영역 영어 증언을 함께 참조한 출판 전 검토용 초안입니다.
