  naturalness: 현대 표준 한국어와 합쇼체는 자연스럽고, 문장 연결도 명료합니다. “그와 따로 행동합니다”가 원문의 관계적 대조를 더 직접적이고 자연스럽게 살립니다.
  terminology: “그리스도인”, “주교”, “선한 양심”, “명령”은 적절합니다. 특히 ‘명령’의 주체를 특정하지 않은 것은 제공된 증거의 모호성을 보존합니다.
