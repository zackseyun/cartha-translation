id: IGN.027
reference: Letters of Ignatius — IgnMagn. 4
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: It is therefore meet that we not only be called Christians, but also be such; even as some persons have the bishop's name on their lips, but in everything act apart from him. Such men appear to me not to keep a good conscience, for as much as they do not assemble themselves together lawfully according to commandment.
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: It is therefore meet that we not only be called Christians, but also be such; even as some persons have the bishop's name on their lips, but in everything act apart from him. Such men appear to me not to keep a good conscience, for as much as they do not assemble themselves together lawfully according to commandment.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: ko
  text: 그러므로 우리는 그리스도인이라고 불리기만 할 것이 아니라 실제로 그리스도인이 되어야 마땅합니다. 어떤 사람들은 주교의 이름을 입에 올리면서도 모든 일에서 그와 무관하게 행동합니다. 그런 사람들은 명령에 따라 합당하게 함께 모이지 않으므로, 제게는 선한 양심을 지키지 않는 듯합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 중간 판본 그리스어 사본 전통에 대한 직접 검토가 아직 필요합니다.
    reason: 원문 자료 설명에 그리스어 원문 검토가 보류 중이라고 명시되어 있으므로 번역의 증거 수준을 투명하게 밝혔습니다.
lexical_decisions:
- source_word: be called Christians, but also be such
  choice: 그리스도인이라고 불리기만 할 것이 아니라 실제로 그리스도인이 되어야
  rationale: 명칭과 실제 삶의 대조를 자연스러운 현대 한국어로 분명히 살렸습니다.
- source_word: bishop
  choice: 주교
  rationale: 초기 교회 직분을 가리키는 통상적이고 널리 이해되는 한국어 명칭을 사용했습니다.
- source_word: have the bishop's name on their lips
  choice: 주교의 이름을 입에 올리면서도
  rationale: 입으로 주교를 인정하거나 언급한다는 비유적 표현을 보존하면서 자연스럽게 옮겼습니다.
- source_word: act apart from him
  choice: 그와 무관하게 행동합니다
  rationale: 주교와 분리되어 독자적으로 행동한다는 뜻을 과도하게 교리화하지 않고 표현했습니다.
- source_word: lawfully according to commandment
  choice: 명령에 따라 합당하게
  rationale: 규범이나 명령에 부합한다는 의미를 살리되, 현대 한국어에서 지나치게 법률적인 인상을 주는 표현은 피했습니다.
- source_word: keep a good conscience
  choice: 선한 양심을 지키다
  rationale: 윤리적·신앙적 함의를 가진 원문의 표현을 직관적으로 보존했습니다.
theological_decisions:
- issue: 주교와 공동 집회의 관계
  choice: 주교와 무관하게 행동하며 명령에 따른 합당한 집회를 하지 않는다는 진술로 번역
  alternative: 주교의 명시적 허가 없이는 모든 집회가 불법이라는 뜻으로 강화
  rationale: 제공된 증거가 말하는 권위와 공동체 질서의 연관성은 유지하되, 특정 교회 정치 체계를 본문에 덧붙이지 않았습니다.
- issue: ‘명령’의 주체와 내용
  choice: 주체를 특정하지 않고 ‘명령에 따라’로 유지
  alternative: 하나님의 명령 또는 주교의 명령으로 명시
  rationale: 제공된 영어 증거만으로는 명령의 주체를 확정하기 어려우므로 본문의 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 초기 교회의 권면문다운 단호함은 유지하되, 일반 독자가 쉽게 이해할 수 있도록 문장 구조를 간결하게 다듬었습니다.
