base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/016.yaml
  text: 'It is better to be silent and to be than to speak and not to be. It is a fine thing to teach, if the speaker practices. Now there is one teacher who spoke, and it came to pass. Indeed, even the things he has done in silence are worthy of the Father.


    Whoever truly possesses the word of Jesus is also able to listen to his silence, so that he may be perfect—so that through his speech he may act, and through his silence he may be known.


    Nothing is hidden from the Lord; even our secrets are near to him. Therefore, let us do everything knowing that he dwells in us, so that we may be his temples and he himself may be in us as our God. This is so, and it will also be made clear before our eyes through the love that we rightly bear toward him.'
translation:
  language: ko
  text: '말하면서도 실제로는 그렇지 않은 것보다, 침묵하면서 참으로 존재하는 것이 더 낫습니다. 가르치는 사람이 자신이 가르치는 것을 실천한다면, 가르치는 일은 훌륭합니다. 선생은 한 분이십니다. 그분이 말씀하시자 그대로 이루어졌습니다. 참으로 그분이 침묵 가운데 행하신 일들까지도 아버지께 합당합니다.


    예수님의 말씀을 참으로 지닌 사람은 그분의 침묵에도 귀 기울일 수 있습니다. 이는 그가 온전해져서, 말로는 행하고 침묵으로는 알려지게 하려는 것입니다.


    주님께는 아무것도 숨겨져 있지 않으며, 우리의 은밀한 것들까지도 그분 가까이에 있습니다. 그러므로 그분이 우리 안에 거하신다는 것을 알고 모든 일을 합시다. 그리하여 우리는 그분의 성전이 되고, 그분 자신은 우리 안에서 우리의 하나님으로 계시게 합시다. 이것은 사실이며, 우리가 그분께 마땅히 품는 사랑을 통해 우리 눈앞에도 분명히 드러날 것입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 중간 판본 그리스어 전통을 반영한 공개 영역 영어 번역 증언본을 바탕으로 한 잠정 번역입니다. 그리스어 원문과의 직접 대조가 아직 필요합니다.
    reason: 제공된 자료가 직접적인 그리스어 본문이 아니라 영어 증언본이며, 출발어 검토가 보류 중이라는 본문 비평상의 한계를 독자에게 알립니다.
lexical_decisions:
- source_word: to keep silence and to be
  choice: 침묵하면서 참으로 존재하는 것
  rationale: 단순한 생존보다 말과 실재의 일치를 대조하는 문맥을 살리되, ‘존재하다’라는 역설적 표현을 보존했습니다.
- source_word: one teacher
  choice: 선생은 한 분이십니다
  rationale: 유일성을 강조하는 표현을 자연스러운 한국어 어순으로 옮겼습니다.
- source_word: possesseth the word of Jesus
  choice: 예수님의 말씀을 참으로 지닌
  rationale: ‘소유하다’의 뜻을 유지하면서도 한국어에서 지나치게 물질적으로 들리지 않도록 ‘지니다’를 선택했습니다.
- source_word: hearken unto His silence
  choice: 그분의 침묵에도 귀 기울이다
  rationale: 역설적인 원문 이미지를 해소하지 않고 그대로 보존했습니다.
- source_word: temples
  choice: 성전
  rationale: 신적 거처라는 종교적 함의를 살리고, 복수 의미는 ‘우리는 … 성전이 되고’라는 집합적 문장으로 나타냈습니다.
- source_word: our secrets
  choice: 우리의 은밀한 것들
  rationale: 숨은 생각·행위·사정을 폭넓게 포함할 수 있도록 특정 의미로 좁히지 않았습니다.
theological_decisions:
- issue: ‘한 분의 선생’과 이어지는 대명사의 지시 대상
  choice: 문맥상 예수님을 가리키는 ‘그분’으로 번역
  alternative: 하나님 또는 아버지를 직접 명시
  rationale: 다음 문단의 ‘예수님의 말씀’과 연결되지만, 본문에 이름을 덧붙이지 않아 원문의 대명사 구조를 유지했습니다.
- issue: ‘침묵 가운데 행하신 일들’의 의미
  choice: 행위의 구체적 내용을 규정하지 않음
  alternative: 숨은 사역, 성육신, 수난 등 특정 사건으로 해석
  rationale: 본문 자체가 어떤 일을 뜻하는지 명시하지 않으므로 신학적으로 특정하지 않았습니다.
- issue: ‘through his silence he may be known’의 주어와 의미
  choice: 제자의 침묵을 통해 그가 알려진다는 구조를 유지
  alternative: 침묵을 통해 하나님 또는 예수님이 알려진다고 해석
  rationale: 영어 증언본의 문법적 흐름을 따르되, 직접 그리스어 검토 전에는 모호성을 과도하게 해소하지 않았습니다.
- issue: 내주와 성전 언어
  choice: 그분이 우리 안에 거하시며 우리가 그분의 성전이 된다는 표현을 그대로 보존
  alternative: 비유적 임재 또는 교회론적 의미로 설명적 번역
  rationale: 본문의 강한 내주 표현을 특정 교리 체계로 제한하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 교부 문헌의 권면조와 역설적 병행 구조를 살리면서도 고어투는 피했습니다. ‘말씀/침묵’, ‘말/행함’, ‘성전/내주’의 반복과 긴장을 유지했습니다.
