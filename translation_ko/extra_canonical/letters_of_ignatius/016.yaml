  naturalness: 현대 격식체는 대체로 자연스럽습니다. 다만 ‘침묵하면서 참으로 존재하는 것’은 부가된 강조 때문에 다소 설명적으로 들리고, ‘그분 자신은 … 계시게 합시다’는 한국어에서 어색합니다. 목적절들을 ‘~하도록’으로 정리하면 원문의 권면 구조가 더 자연스럽게 살아납니다.
  terminology: ‘예수님의 말씀’, ‘아버지’, ‘주님’, ‘성전’, ‘하나님’은 문맥과 한국어 기독교 문헌 관습에 적절합니다. ‘한 분의 선생’도 원문의 유일성 표현을 보존합니다. 원문이 특정하지 않는 침묵 가운데의 행위를 해석적으로 한정하지 않은 점은 적절합니다.
  issues:
