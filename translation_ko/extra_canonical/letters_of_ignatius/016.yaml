    rationale: ‘침묵하고 존재하다’와 ‘말하고 존재하지 않다’의 역설 자체가 출발문의 표현이며, ‘참으로’에 해당하는 별도의 강조는 없습니다.
  - severity: medium
    issue: ‘그분 자신은 우리 안에서 우리의 하나님으로 계시게 합시다’가 부자연스럽고 의미가 흔들립니다.
    rationale: 출발문은 우리가 성전이 되고 그분 자신이 우리 안에 우리의 하나님으로 계시도록 하자는 목적절입니다. 현 번역은 독자가 하나님을 ‘계시게 하자’고 권하는 것으로 읽을 수 있습니다.
