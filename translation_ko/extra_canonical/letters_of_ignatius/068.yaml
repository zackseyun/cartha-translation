base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: ko
  text: 그러므로 한 성찬에 참여하도록 힘쓰십시오. (우리 주 예수 그리스도의 살은 하나이고, 그분의 피 안에서 하나 됨을 위한 잔도 하나이며, 제단도 하나이기 때문입니다. 이는 한 감독이 장로단과 나의 동료 종들인 집사들과 함께 있는 것과 같습니다.) 그리하여 여러분이 무엇을 하든 하나님을 따라 행하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 중간본 계열 그리스어 본문에 대한 직접 검토가 아직 필요합니다.
    reason: 사용 가능한 자료가 그리스어 원문 자체가 아니라 영어 증언문이며, 원어 검토가 보류 중이라는 본문 자료의 한계를 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: one eucharist
  choice: 하나의 성찬
  rationale: 교회의 공동 식사와 감사 예식을 가리키는 역사적 용어를 현대 한국어 독자가 알아볼 수 있도록 ‘성찬’으로 옮겼으며, 반복되는 ‘하나’의 강조를 보존했습니다.
- source_word: one flesh
  choice: 살은 하나이고
  rationale: 성찬 문맥에서 ‘몸’으로 평준화하지 않고, 증언문이 제시하는 flesh의 구체적 표현을 ‘살’로 보존했습니다.
- source_word: one cup unto union in His blood
  choice: 그분의 피 안에서 하나 되게 하는 잔도 하나이며
  rationale: ‘unto union’의 방향·목적 의미를 살리되, 연합의 관계가 ‘그분의 피 안에서’ 이루어진다는 문장 구조를 유지했습니다.
- source_word: one altar
  choice: 제단도 하나
  rationale: 초기 교회 예배 문맥의 altar를 일반적인 ‘상’으로 약화하지 않고 전통적이며 이해 가능한 ‘제단’으로 옮겼습니다.
- source_word: presbytery
  choice: 장로단
  rationale: 개별 장로가 아니라 장로들의 집합체를 뜻하므로 ‘장로단’으로 옮겼습니다.
- source_word: after God
  choice: 하나님을 따라
  rationale: ‘하나님의 뜻에 따라’라고 뜻을 보충해 단정하지 않고, 원문의 압축성과 가능한 의미 폭을 보존했습니다.
theological_decisions:
- issue: ‘하나의 성찬’과 교회 직분의 일치가 맺는 관계
  choice: 성찬, 제단, 감독, 장로단, 집사의 병행 구조를 그대로 유지했습니다.
  alternative: 현대 교회 행정이나 특정 교단의 성찬론에 맞게 관계를 풀어서 설명할 수 있습니다.
  rationale: 본문 자체의 교회 일치 강조는 보존하되, 특정 교단의 직제나 성례 이해를 본문에 추가하지 않기 위해서입니다.
- issue: ‘그분의 피 안에서 하나 되게 하는 잔’의 의미
  choice: 잔이 피 안에서의 하나 됨을 지향하거나 이루는 표현으로 번역했습니다.
  alternative: ‘그분의 피와 연합하게 하는 잔’ 또는 ‘그분의 피의 연합을 위한 잔’으로 옮길 수 있습니다.
  rationale: 직접 그리스도의 피와 연합한다는 해석과 공동체가 그 피 안에서 하나 된다는 해석 사이의 긴장을 섣불리 해소하지 않으려 했습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 권면은 ‘힘쓰십시오’로 자연스럽고 엄숙하게 표현하고, 괄호 안의 반복 구조는 초기 교회 문헌 특유의 수사적 병행이 드러나도록 유지했습니다. ‘감독·장로단·집사’는 역사적 직분 명칭으로 번역하되 현대 특정 교단의 제도와 동일시하는 설명은 덧붙이지 않았습니다.
