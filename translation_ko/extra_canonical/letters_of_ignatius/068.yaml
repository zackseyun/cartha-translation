- from: 그러므로 여러분은 하나의 성찬을 지키도록 힘쓰십시오. (우리 주 예수 그리스도의 살은 하나이고, 그분의 피 안에서 하나 되게 하는 잔도 하나이며, 제단도 하나이기 때문입니다. 마찬가지로 감독도 하나이고, 장로단과 나의 동료 종들인 집사들이 그와 함께합니다.) 이는 여러분이 무엇을 하든 하나님을 따라 행하게 하려는 것입니다.[a]
  to: 그러므로 한 성찬에 참여하도록 힘쓰십시오. (우리 주 예수 그리스도의 살은 하나이고, 그분의 피 안에서 하나 됨을 위한 잔도 하나이며, 제단도 하나이기 때문입니다. 이는 한 감독이 장로단과 나의 동료 종들인 집사들과 함께 있는 것과 같습니다.) 그리하여 여러분이 무엇을 하든 하나님을 따라 행하십시오.[a]
  rationale: ‘한 성찬에 참여하다’로 동사의 의미를 더 가깝게 반영하고, 감독·장로단·집사의 비교 병행을 재구성했습니다. 마지막 ἵνα절은 목적을 유지하면서도 원문의 직접적인 권면으로 옮겼습니다. ‘그분의 피 안에서 하나 됨’은 제공된 영어 증언의 표현을 보존하여, 피와 연합의 관계에 관한 해석을 추가하지 않습니다.
