source:
  text: 'For some are wont of malicious guile to hawk about the Name, while they do certain other things unworthy of God. These men ye ought to shun, as wild-beasts; for they are mad dogs, biting by stealth; against whom ye ought to be on your guard, for they are hard to heal.


    There is one only physician, of flesh and of spirit, generate and in- generate, God in man, true Life in death, Son of Mary and Son of God, first passible and then impassible, Jesus Christ our Lord.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'For some are wont of malicious guile to hawk about the Name, while they do certain other things unworthy of God. These men ye ought to shun, as wild-beasts; for they are mad dogs, biting by stealth; against whom ye ought to be on your guard, for they are hard to heal.


    There is one only physician, of flesh and of spirit, generate and in- generate, God in man, true Life in death, Son of Mary and Son of God, first passible and then impassible, Jesus Christ our Lord.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: ko
  text: '어떤 이들은 악의에 찬 속임수로 그 이름을 팔아 다니면서, 하나님께 합당하지 않은 다른 일들을 합니다. 여러분은 이런 자들을 들짐승처럼 피해야 합니다. 그들은 몰래 물어뜯는 미친 개들이기 때문입니다. 그들을 경계하십시오. 그들은 고치기 어렵습니다.


    의사는 오직 한 분이십니다. 육신에 속하면서도 영에 속하시고, 나셨으면서도 나지 않으셨으며, 사람 안에 계신 하나님이시고, 죽음 가운데 있는 참생명이시며, 마리아의 아들이시자 하나님의 아들이시고, 처음에는 고난을 받으실 수 있었으나 그 뒤에는 고난을 받으실 수 없게 되신 분, 곧 우리 주 예수 그리스도이십니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “나셨으면서도 나지 않으셨으며”와 “처음에는 고난을 받으실 수 있었으나 그 뒤에는 고난을 받으실 수 없게 되신”은 현존 영어 증언의 역설적인 짝말을 그대로 살린 번역입니다. 이는 일반적으로 그리스도의 인성과 신성, 그리고 고난 전후의 상태를 함께 말하는 것으로 이해되지만, 그 설명을 본문에 덧붙이지 않았습니다. 그리스어 원문에 대한 직접 검토가 필요합니다.
    reason: 제공된 자료가 공개 영역 영어 번역 증언에 기초하며 그리스어 원문 검토가 보류되어 있고, 신학적으로 논쟁적인 대조 표현을 독자에게 알릴 필요가 있습니다.
lexical_decisions:
- source_word: the Name
  choice: 그 이름
  rationale: 그리스도교 신앙 고백과 예수의 이름을 가리키는 함축을 보존하되, 보충 해석을 본문에 넣지 않았습니다.
- source_word: hawk about / peddle
  choice: 팔아 다니다
  rationale: 이름을 자기 이익을 위해 떠벌리며 유통하는 부정적 상업 비유를 자연스러운 현대 한국어로 살렸습니다.
- source_word: physician
  choice: 의사
  rationale: 치유자라는 은유를 직접 보존하면서 현대 독자가 쉽게 이해할 수 있는 말을 택했습니다.
- source_word: generated and ungenerated
  choice: 나셨으면서도 나지 않으셨으며
  rationale: 상반되는 두 술어의 긴장을 해소하지 않고 출생·기원에 관한 병치를 그대로 보존했습니다.
- source_word: passible / impassible
  choice: 고난을 받으실 수 있었으나 / 고난을 받으실 수 없게 되신
  rationale: 단순히 실제 고난을 받았다는 뜻보다 고난 가능성과 불가능성의 대조를 드러냈습니다.
theological_decisions:
- issue: ‘나셨으면서도 나지 않으셨다’는 역설
  choice: 상반되는 표현을 본문에 그대로 유지함
  alternative: 육신으로는 나셨으나 신성으로는 나지 않으셨다
  rationale: 후자의 해석은 전통적으로 타당할 수 있으나 원문 증거 검토가 보류된 상태에서 본문이 명시하지 않은 설명을 삽입하지 않았습니다.
- issue: ‘사람 안에 계신 하나님’의 관계
  choice: 사람 안에 계신 하나님
  alternative: 사람이 되신 하나님
  rationale: 영어 증언의 ‘God in man’이 지닌 표현상의 긴장을 보존하고 성육신 교리를 설명식으로 확정하지 않았습니다.
- issue: 고난 가능성의 시간적 대조
  choice: 처음에는 … 그 뒤에는
  alternative: 육신으로는 고난을 받으시고 부활 뒤에는 고난을 받지 않으시는
  rationale: 시간적 순서는 보존하되, 부활이라는 해석적 표지를 본문에 추가하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 단호하고 명료하게, 그리스도론적 병렬 문장은 장중한 리듬과 역설을 유지하도록 구성했습니다. 원문 그리스어 직접 검토가 보류되어 있으므로 제공된 중간형 본문 전통의 영어 증언과 영어 POB를 대조하여 작성한 잠정 출판 초안입니다.
