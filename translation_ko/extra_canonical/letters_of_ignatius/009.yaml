  revision_rationale: 그리스어 어휘상 ‘다툼’을 유지하되, 어려운 자기비하·자기헌신의 비유를 본문에서 ‘희생 제물’로 단정하지 않도록 조정했습니다. 또한 첫 문장을 자연스러운 합쇼체 금지 표현으로 고치고, 나머지 대조와 역설은 해설적으로 완화하지 않았습니다.
