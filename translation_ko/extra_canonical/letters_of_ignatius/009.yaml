review_pass:
  verdict: revise
  source_fidelity: 'The rendering of ἔρις as ‘다툼’ accords with the Middle-recension Greek wording and should be retained despite the supplied English witness’s ‘lust/desire.’ The self-offering language, however, should not be sharpened in the main text into a literal ‘희생 제물’: περίψημα is a severe self-abasing metaphor with a sacrificial or propitiatory association, but is not simply the ordinary word for a sacrifice. The revision retains its self-giving force while placing its difficult semantic range in a footnote.'
  naturalness: The draft is generally clear and maintains modern formal-polite Korean. ‘아무도 여러분을 속이지 못하게 하십시오’ is less idiomatic as an imperative than ‘아무도 여러분을 미혹하지 않게 하십시오.’ The revised parallel clauses also avoid the slightly heavy repetition of ‘~에 속한 일들.’
  terminology: ‘하나님,’ ‘육신,’ ‘성령,’ ‘믿음,’ ‘불신앙,’ and ‘예수 그리스도 안에서’ are suitable and consistently formal. ‘봉헌합니다’ appropriately renders the author’s self-dedicatory language without asserting a particular atoning function.
  issues:
  - severity: medium
    issue: ‘희생 제물’ is too determinate for περίψημα in the main text.
    rationale: The word can denote refuse/offscouring and, in certain contexts, a person cast away for others’ benefit. Its sacrificial resonance is important but should remain explanatory rather than be made the sole textual sense.
  - severity: low
    issue: The opening prohibition is awkwardly phrased.
    rationale: ‘속이지 못하게 하십시오’ can suggest preventing someone from being able to deceive. ‘미혹하지 않게 하십시오’ more naturally conveys the Greek prohibition in formal Korean.
  revised_text: '8


    그러므로 아무도 여러분을 미혹하지 않게 하십시오. 여러분이 실제로 미혹되지 않고 있는 것은 여러분이 온전히 하나님의 것이기 때문입니다. 여러분 가운데 여러분을 괴롭힐 수 있는 다툼이 전혀 뿌리내리지 않을 때, 여러분은 참으로 하나님을 따라 사는 것입니다. 나는 여러분을 위하여 자신을 내어놓으며[a], 모든 시대에 널리 알려진 에베소 사람들의 교회를 위하여 자신을 봉헌합니다.


    육신에 속한 사람들은 성령에 속한 일을 할 수 없고, 성령에 속한 사람들도 육신에 속한 일을 할 수 없습니다. 믿음이 불신앙의 일을 할 수 없고 불신앙도 믿음의 일을 할 수 없는 것과 같습니다. 그렇지만 여러분이 육신을 따라 하는 일들조차 영적인 것입니다. 여러분이 모든 일을 예수 그리스도 안에서 하기 때문입니다.'
  revised_footnotes:
  - marker: a
    text: 그리스어 περίψημα는 문자적으로 ‘찌꺼기’나 ‘버려지는 것’을 가리키며, 다른 이를 위하여 내어버려지는 사람이라는 강한 자기비하의 비유로도 쓰입니다. 고대 용례에서는 희생적·속죄적 연상이 있을 수 있으나, 여기서 그 의미를 한 가지로 확정하기는 어렵습니다.
