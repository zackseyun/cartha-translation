base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: ko
  text: '8


    그러므로 아무도 여러분을 속이지 못하게 하십시오. 사실 여러분은 속지 않습니다. 여러분이 온전히 하나님의 것이기 때문입니다. 여러분을 괴롭힐 수 있는 다툼이 하나도 여러분 가운데 뿌리내리지 않을 때, 여러분은 참으로 하나님을 따라 사는 것입니다. 나는 여러분을 위한 희생 제물이 되며[a], 모든 세대에 널리 알려진 에베소 사람들의 교회를 위하여 나 자신을 성별합니다.


    육신에 속한 사람들은 성령에 속한 일들을 행할 수 없고, 성령에 속한 사람들도 육신에 속한 일들을 행할 수 없습니다. 마찬가지로 믿음은 불신앙에 속한 일들을 행할 수 없고, 불신앙도 믿음에 속한 일들을 행할 수 없습니다. 그러나 여러분이 육신을 따라 행하는 일들조차 영적인 것입니다. 여러분은 모든 일을 예수 그리스도 안에서 행하기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 표현은 문자적으로 ‘여러분의 찌꺼기’ 또는 ‘여러분을 대신하여 버려지는 것’이라는 강한 자기비하의 뜻을 지닐 수 있으며, 고대에는 다른 사람을 위한 희생 제물을 가리키는 비유로도 쓰였습니다.
    reason: ‘희생 제물’이라는 본문 번역만으로는 περίψημα의 문자적 충격과 의미 범위를 모두 전달하기 어렵기 때문입니다.
lexical_decisions:
- source_word: ἔρις
  choice: 다툼
  rationale: 중간본 그리스어 전승의 어휘는 ‘욕망’보다 ‘다툼, 분쟁’을 뜻하므로, 제공된 영어 증언의 “lust/desire”를 따르지 않고 그리스어 의미를 반영했습니다.
- source_word: κατὰ θεὸν ζῆτε
  choice: 하나님을 따라 사는 것입니다
  rationale: ‘하나님의 뜻대로’처럼 의미를 미리 풀어 확정하지 않고, 원문의 관계적·규범적 표현을 보존했습니다.
- source_word: περίψημα ὑμῶν
  choice: 나는 여러분을 위한 희생 제물이 되며
  rationale: 문자적으로는 ‘긁어 낸 찌꺼기/버리는 것’을 가리킬 수 있으나, 여기서는 타인을 위해 자신을 내어놓는 제의적·자기비하적 용법을 자연스러운 한국어로 옮겼습니다. 다만 원문의 강한 비유는 각주에 밝혔습니다.
- source_word: ἁγνίζομαι
  choice: 나 자신을 성별합니다
  rationale: 제의적 맥락에서 자신을 정결하게 하거나 봉헌한다는 뜻을 살리되, 곧바로 ‘제물로 바친다’와 완전히 동일시하지 않았습니다.
- source_word: σαρκικοί / κατὰ σάρκα
  choice: 육신에 속한 / 육신을 따라
  rationale: ‘육체적’으로 단순 환원하지 않고, 초기 그리스도교 문헌의 윤리적·존재론적 대비를 드러내는 전통적이면서 이해 가능한 표현을 사용했습니다.
- source_word: πνευματικοί / πνευματικά
  choice: 성령에 속한 사람들 / 영적인 것
  rationale: 사람을 가리키는 용례에서는 성령과의 관계를 분명히 하고, 행위의 성격을 가리키는 마지막 문장에서는 원문의 포괄성을 보존해 ‘영적인’으로 옮겼습니다.
- source_word: ἀπιστία
  choice: 불신앙
  rationale: 단순한 심리적 ‘의심’이 아니라 믿음에 맞서는 상태와 행위를 나타내므로 ‘불신앙’을 택했습니다.
theological_decisions:
- issue: 육신과 성령의 대조
  choice: 두 영역에 속한 행위의 양립 불가능성을 원문 그대로 진술했습니다.
  alternative: 육신 자체를 악한 실체로 규정하거나, 신자가 육체로 행하는 일은 모두 자동으로 거룩하다고 해설하는 번역
  rationale: 본문은 ‘육신에 속한 것’과 ‘성령에 속한 것’을 대조하면서도, 에베소 교인들이 ‘육신을 따라’ 하는 일조차 그리스도 안에서는 영적이라고 역설합니다. 이 긴장을 교리적으로 해소하지 않았습니다.
- issue: ‘예수 그리스도 안에서’의 의미
  choice: 공동체의 모든 행위가 이루어지는 관계적 영역으로 직역에 가깝게 보존했습니다.
  alternative: ‘예수 그리스도의 명령대로’ 또는 ‘예수 그리스도의 능력으로’
  rationale: 원문은 방식, 권위, 능력 가운데 하나만을 명시하지 않으므로 특정 해석으로 좁히지 않았습니다.
- issue: 저자의 자기봉헌 표현
  choice: 희생 제물의 비유와 자신을 성별한다는 표현을 나란히 유지했습니다.
  alternative: 저자가 교회를 속죄한다는 의미로 확정
  rationale: 그리스도의 속죄와 동일한 효력을 주장한다고 단정하지 않고, 순교를 앞둔 저자의 헌신적·제의적 비유로 남겨 두었습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 초기 그리스도교 서신에 맞는 엄숙함을 유지하되 불필요한 고어는 피했습니다. 제공된 영어 증언보다 중간본 그리스어 본문의 어휘를 우선하여 ἔρις를 ‘다툼’으로 옮겼습니다. 장 번호는 식별을 위해 제시했습니다.
