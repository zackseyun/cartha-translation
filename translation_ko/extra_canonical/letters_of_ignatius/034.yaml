base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: ko
  text: 내가 사랑하는 여러분, 내가 이런 말을 하는 것은 여러분 가운데 누구라도 이런 생각을 품고 있다는 말을 들어서가 아닙니다. 오히려 여러분 가운데 누구보다도 못한 사람인 제가 여러분이 미리 경계하여 헛된 가르침의 올무에 빠지지 않기를 바랍니다. 도리어 예수 그리스도의 탄생과 수난과, 본디오 빌라도가 총독으로 있던 때에 일어난 부활을 굳게 확신하십시오. 이 모든 일은 우리의 소망이신 예수 그리스도께서 참으로 확실하게 이루신 일입니다. 여러분 가운데 아무도 이 소망에서 벗어나지 않기를 바랍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: my dearly beloved
  choice: 내가 사랑하는 여러분
  rationale: 애정 어린 호칭을 현대 한국어의 자연스럽고 품위 있는 복수 존칭으로 옮겼습니다.
- source_word: being less than any of you
  choice: 나는 여러분 모두보다 못한 사람이기에
  rationale: 저자의 겸양을 약화하거나 별도의 신학적 의미를 덧붙이지 않고 보존했습니다.
- source_word: betimes
  choice: 때를 놓치지 않고
  rationale: 위험이 닥치기 전에 미리 경계하라는 뜻을 자연스러운 현대어로 나타냈습니다.
- source_word: vain doctrine
  choice: 헛된 가르침
  rationale: 내용이 공허하고 진실하지 않은 가르침이라는 의미를 간결하게 살렸습니다.
- source_word: passion
  choice: 수난
  rationale: 예수의 고난과 죽음을 가리키는 초기 그리스도교 문맥의 전통적이면서도 널리 이해되는 표현을 선택했습니다.
- source_word: governorship of Pontius Pilate
  choice: 본디오 빌라도가 총독으로 있던 때
  rationale: 사건의 역사적 시점을 평이하고 정확하게 드러냅니다.
theological_decisions:
- issue: 탄생·수난·부활의 역사성
  choice: ‘일어난’과 ‘참으로, 확실히’를 유지하여 실제 역사적 사건이라는 강조를 보존했습니다.
  alternative: ‘의미 있는 진리’처럼 비역사적으로 풀어 쓰기
  rationale: 본문은 본디오 빌라도의 통치 시기를 명시하고 사건들이 실제로 일어났음을 거듭 강조하므로 이를 약화하지 않았습니다.
- issue: ‘done by Jesus Christ’의 행위/경험 주체 모호성
  choice: 본문에는 영어 증언의 표면적 구문을 따라 ‘예수 그리스도께서 이루신 일’로 두고, 각주에 ‘예수 그리스도께 일어난 일’이라는 대안을 제시했습니다.
  alternative: 예수 그리스도께 일어난 일입니다.
  rationale: 직접 그리스어 검토가 보류된 상태에서, 탄생과 수난과 부활 모두를 ‘그리스도가 행했다’고 단정하면 어색할 수 있으므로 증언의 형식과 문맥상 가능한 의미를 함께 보존했습니다.
- issue: ‘our hope’의 지시 관계
  choice: ‘우리의 소망이신 예수 그리스도’와 ‘이 소망’을 연결했습니다.
  alternative: ‘이 일들에 대한 소망’으로 해석
  rationale: 가까운 선행 표현이 예수 그리스도를 ‘우리의 소망’으로 부르므로 인격적 지시를 유지하되, 한국어에서도 문맥적 연결이 드러나게 했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 초기 그리스도교 서신의 권면과 애정 어린 어조를 유지하면서도, ‘여러분’, ‘가르침’, ‘총독으로 있던 때’ 등 일반 독자가 이해하기 쉬운 표현을 택했습니다. 직접 그리스어 원문 검토가 아직 이루어지지 않았으므로 제공된 공용 영어 증언을 토대로 한 잠정 초안입니다.
