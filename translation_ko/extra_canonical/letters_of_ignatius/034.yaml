    rationale: 현 초안의 ‘본디오 빌라도가 총독으로 있던 때에 일어난 그분의 탄생과 수난과 부활’은 시기 한정이 세 사건 모두에 걸리는 것으로 만듭니다. 그리스어 관계절은 여성 단수이며 가장 가까운 선행사인 ‘부활’을 수식하므로, 이를 한국어에서 드러내야 합니다.
  - severity: medium
    issue: ‘그분의’의 불명확한 선행사
    rationale: 예수 그리스도라는 이름은 다음 문장에서 처음 나오므로 ‘그분의 탄생’은 독자가 선행사를 찾게 합니다. ‘예수 그리스도의 탄생과 수난과 부활’로 명시하는 것이 안전합니다.
  - severity: low
    issue: 행위/경험 주체 대안 각주
    rationale: 본문의 ‘예수 그리스도께서 이루신 일’은 제공된 영어 증언의 ‘done by Jesus Christ’ 및 그리스어의 수동 행위자 표현을 따른 것입니다. ‘예수 그리스도께 일어난 일’이라는 대안은 본문이 보존하는 행위 주체를 불필요하게 약화하므로 삭제하는 것이 좋습니다.
