  naturalness: 합쇼체와 서신의 격식은 대체로 적절합니다. 그러나 ‘[그리스도] 하나님의 일꾼으로 잘 맞아들였습니다’는 수식 관계가 잠시 불분명하고, ‘내 결박도 그러합니다’ 및 ‘하나도 보상을 잃지 않을 것입니다’는 현대 한국어에서 다소 어색합니다. 문장 구조를 정돈하면 자연스럽고 명료해집니다.
