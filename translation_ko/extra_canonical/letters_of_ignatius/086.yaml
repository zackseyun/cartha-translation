base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: ko
  text: '10


    여러분은 하나님의 일을 위해 나를 따라온 필론과 라이오스 아가토푸스를 [그리스도] 하나님의 일꾼으로 잘 맞아들였습니다.[a] 그들도 여러분이 모든 면에서 그들에게 새 힘을 주었으므로 여러분을 두고 주님께 감사드립니다. 여러분이 한 일은 하나도 보상을 잃지 않을 것입니다.[b]


    내 영은 여러분을 위해 바쳐져 있습니다. 내 결박도 그러합니다.[c] 여러분은 이 결박을 업신여기지도, 부끄러워하지도 않았습니다. 완전한 신실함이신 분, 곧 예수 그리스도께서도 여러분을 부끄러워하지 않으실 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그리스도’는 제공된 본문에서 대괄호 안에 있으며, 사본 본문을 보충하거나 복원한 말임을 나타냅니다. 그리스어 원문에 대한 직접 검토는 아직 이루어지지 않았습니다.
    reason: 본문의 불확실성을 독자에게 투명하게 알리고 대괄호 표지를 설명하기 위해서입니다.
  - marker: b
    text: 직역하면 ‘여러분에게는 아무것도 잃어버려지지 않을 것입니다’입니다. 문맥상 베푼 섬김이 헛되지 않으리라는 뜻으로 이해할 수 있습니다.
    reason: 수동형 표현의 가능한 보상 함의를 드러내면서 해석의 범위를 과도하게 확정하지 않기 위해서입니다.
  - marker: c
    text: ‘내 결박도 그러합니다’는 이그나티우스가 갇힌 채 매여 있는 상태도 여러분을 위해 바쳐졌다는 뜻으로 읽힙니다.
    reason: 생략된 술어를 한국어 독자가 파악하도록 돕되 원문의 압축된 표현을 본문에 유지하기 위해서입니다.
lexical_decisions:
- source_word: Philo and Rhaius Agathopus
  choice: 필론과 라이오스 아가토푸스
  rationale: 그리스계 인명을 현대 한국어 음역 관행에 맞추되, 제공된 영어 증언의 이름 구분을 그대로 보존했습니다.
- source_word: in the cause of God
  choice: 하나님의 일을 위해
  rationale: ‘하나님의 대의’보다 자연스럽고 일반 독자가 이해하기 쉬우면서도 하나님을 위한 사역이라는 뜻을 유지합니다.
- source_word: ministers
  choice: 일꾼
  rationale: 교파별 직분 명칭으로 한정하지 않고 봉사자·사역자라는 넓은 의미를 전달합니다.
- source_word: refreshed
  choice: 새 힘을 주었으므로
  rationale: 단순한 접대 이상으로 위로하고 필요를 채워 준 행위를 자연스러운 현대 한국어로 나타냅니다.
- source_word: bonds
  choice: 결박
  rationale: 투옥 상태와 그리스도를 위한 고난을 함께 환기하는 원문의 구체적 이미지를 보존합니다.
- source_word: perfect faithfulness
  choice: 완전한 신실함이신 분
  rationale: 추상명사적 술어가 지닌 강조를 유지하고 이를 단순히 ‘신실하신 분’으로 평준화하지 않았습니다.
theological_decisions:
- issue: '[Christ] God의 본문 상태와 수식 관계'
  choice: '[그리스도] 하나님'
  alternative: 그리스도 하나님의 / 하나님의
  rationale: 제공된 증언의 대괄호를 본문 복원 신호로 보존했습니다. 직접 그리스어 검토가 아직 이루어지지 않았으므로 ‘그리스도’의 확정 여부나 문법적 관계를 단정하지 않았습니다.
- issue: ‘Nothing shall be lost to you’의 의미
  choice: 여러분이 한 일은 하나도 보상을 잃지 않을 것입니다
  alternative: 여러분에게는 아무것도 잃어버린 것이 없을 것입니다
  rationale: 문맥상 그들의 환대가 하나님 앞에서 헛되지 않다는 뜻을 드러내되, 구체적인 보상의 성격은 규정하지 않았습니다.
- issue: ‘My spirit is devoted for you’의 헌신 표현
  choice: 내 영은 여러분을 위해 바쳐져 있습니다
  alternative: 내 영이 여러분을 대신합니다 / 내 영은 여러분의 것입니다
  rationale: 애정과 자기헌신의 강한 관용 표현을 보존하면서도 속죄적 대속이라는 교리적 의미를 불필요하게 부여하지 않았습니다.
- issue: 예수 그리스도와 ‘완전한 신실함’의 동일시
  choice: 완전한 신실함이신 분, 곧 예수 그리스도
  alternative: 완전한 신실함을 지니신 예수 그리스도
  rationale: 제공된 증언의 병치와 추상명사적 강조를 살려 예수 그리스도를 ‘완전한 신실함’으로 서술하는 긴장을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 기독교 서신의 엄숙함을 유지하되 ‘대의’, ‘수종자’ 같은 고어적·교파적 표현은 피했습니다. 제공 자료가 영어 공용 증언에 기반하며 그리스어 직접 검토가 보류된 상태이므로, 대괄호와 의미상의 불확실성을 명시적으로 보존했습니다.
