source:
  text: 'They therefore that gainsay the good gift of God perish by their questionings. But it were expedient for them to have love, that they may also rise again.


    It is therefore meet that ye should abstain from such, and not speak of them either privately or in public; but should give heed to the Prophets, and especially to the Gospel, wherein the passion is shown unto us and the resurrection is accomplished.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'They therefore that gainsay the good gift of God perish by their questionings. But it were expedient for them to have love, that they may also rise again.


    It is therefore meet that ye should abstain from such, and not speak of them either privately or in public; but should give heed to the Prophets, and especially to the Gospel, wherein the passion is shown unto us and the resurrection is accomplished.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: ko
  text: '그러므로 하나님의 선한 선물을 거슬러 말하는 사람들은 논쟁으로 말미암아 멸망합니다. 그러나 그들이 사랑을 품어 그들 또한 다시 살아나는 편이 더 나을 것입니다.


    그러므로 여러분은 그런 사람들을 멀리하고, 사적으로든 공개적으로든 그들에 관해 말하지 않는 것이 마땅합니다. 오히려 예언자들에게 귀를 기울이고, 특히 복음에 귀를 기울이십시오. 복음 안에서 수난이 우리에게 드러나며 부활이 이루어졌습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιλέγοντες
  choice: 거슬러 말하는 사람들
  rationale: 단순한 의견 차이보다 하나님의 선물에 반박하고 맞서는 뜻을 살리되, 교리적 의미를 과도하게 특정하지 않았습니다.
- source_word: τῇ δωρεᾷ τοῦ θεοῦ
  choice: 하나님의 선한 선물
  rationale: 영어 증언의 ‘good gift’를 반영하면서도, 문맥상 이 선물이 정확히 무엇을 가리키는지 본문에서 단정하지 않았습니다.
- source_word: διὰ τὸ συζητεῖν
  choice: 논쟁을 일삼다가
  rationale: 논박·논쟁 때문에 파멸에 이른다는 인과를 자연스러운 현대 한국어로 나타냈습니다.
- source_word: ἀγαπᾶν
  choice: 사랑을 실천하여
  rationale: ‘사랑을 가지다’보다 동사적이고 윤리적인 능동성을 자연스럽게 전달합니다.
- source_word: τοῖς προφήταις
  choice: 예언자들의 말씀
  rationale: 사람 자체보다 그들이 전한 증언에 주의를 기울이라는 문맥을 한국어에서 분명하게 했습니다.
- source_word: τὸ πάθος
  choice: 그분의 수난
  rationale: 초기 그리스도교 문맥에서 예수 그리스도의 고난과 죽음을 가리키는 전문적이면서 널리 이해되는 표현을 택했습니다.
- source_word: τετελείωται
  choice: 완성되었습니다
  rationale: 완료형의 성취·완결성을 보존하고, 단순히 ‘기록되었다’나 ‘증명되었다’로 풀어 신학적 긴장을 해소하지 않았습니다.
theological_decisions:
- issue: ‘하나님의 선한 선물’의 구체적 지시 대상
  choice: 구체적으로 규정하지 않음
  alternative: 성찬 또는 성찬의 빵으로 명시
  rationale: 인접 문맥이 성찬을 시사할 수 있으나, 이 문장 자체의 표현은 더 넓으며 제공된 자료에는 직접적인 그리스어 검토가 아직 완료되지 않았으므로 본문의 포괄성을 유지했습니다.
- issue: ‘다시 살아나다’의 의미
  choice: 그들 또한 다시 살아나다
  alternative: 영적으로 회복되다 또는 종말에 부활하다로 특정
  rationale: ἀναστῶσιν이 회복과 부활의 함의를 함께 불러일으킬 수 있으므로 어느 하나로 제한하지 않았습니다.
- issue: 복음 안에서 부활이 ‘완성되었다’는 진술
  choice: 원문의 성취·완결 어감을 유지
  alternative: 부활이 기록되었다 또는 선포되었다
  rationale: 낯선 표현을 평탄화하지 않고 복음 사건과 복음 증언 사이의 신학적 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 권면은 명료하게 하되 논쟁적 대상을 비하하는 어휘는 피했습니다. 제공된 원자료가 공용 영어 증언이며 직접적인 그리스어 원문 검토가 보류된 상태라는 점을 고려해, 확정하기 어려운 지시 관계와 신학적 함의는 각주로 보존했습니다.
