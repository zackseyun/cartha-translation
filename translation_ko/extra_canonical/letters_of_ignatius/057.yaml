base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a slave even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: ko
  text: '나는 모든 교회에 편지를 쓰며, 여러분이 나를 막지만 않는다면 내가 하나님을 위하여 자청하여 죽는다는 것을 모든 사람에게 알립니다. 여러분에게 권합니다. 때에 맞지 않는 친절을 내게 베풀지 마십시오. 나를 들짐승들에게 내어 주십시오. 나는 그것들을 통하여 하나님께 이를 수 있습니다. 나는 하나님의 밀이며, 들짐승들의 이빨에 갈려 [그리스도의] 순전한 빵으로 드러나게 하십시오.[a]


    오히려 들짐승들을 부추겨서 그것들이 내 무덤이 되고, 내 몸의 어느 부분도 남기지 않게 하십시오. 그리하여 내가 잠든 뒤에 누구에게도 짐이 되지 않게 하십시오. 세상이 내 몸조차 보지 못하게 될 때, 나는 참으로 예수 그리스도의 제자가 될 것입니다. 이 도구들을 통하여 내가 하나님께 드리는 제물로 드러나도록, 나를 위하여 주님께 간구해 주십시오.


    나는 베드로와 바울처럼 여러분에게 명령하지 않습니다. 그들은 사도들이었으나, 나는 유죄 선고를 받은 사람입니다. 그들은 자유인이었으나, 나는 바로 이 시간까지 종입니다. 그러나 내가 고난을 받는다면, 나는 예수 그리스도의 해방인이 될 것이며, 그분 안에서 자유인으로 일어날 것입니다.[b] 이제 나는 사슬에 매인 채 모든 욕망을 버리는 법을 배우고 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘[그리스도의]’는 제공된 영어 증거문에서 본문 복원상의 불확실성을 나타내는 대괄호 안에 들어 있습니다. 그 표지를 그대로 보존했습니다.
    reason: 본문 비평상의 불확실성 보존
  - marker: b
    text: ‘해방인’은 고대 사회에서 종의 신분에서 풀려난 사람을 가리킵니다. 여기서는 현재의 ‘종’ 신분과 예수 그리스도 안에서의 자유를 대조하는 표현입니다.
    reason: 고대 법적 신분 용어와 수사적 대조 설명
lexical_decisions:
- source_word: attain unto God
  choice: 하나님께 이르다
  rationale: 순교를 통해 하나님께 도달한다는 원문의 강한 표현을 완화하거나 교리적으로 풀어 쓰지 않고 보존했습니다.
- source_word: God's wheat / pure bread
  choice: 하나님의 밀알 / 순전한 빵
  rationale: 밀과 빵으로 이어지는 비유를 자연스럽게 연결하면서 제의적·성찬적 함의를 단정하지 않았습니다.
- source_word: fallen asleep
  choice: 잠들다
  rationale: 죽음을 가리키는 초기 그리스도교의 완곡한 비유를 그대로 살렸습니다.
- source_word: instruments
  choice: 도구들
  rationale: 바로 앞의 들짐승들을 가리키는 비유적 표현을 보존했습니다.
- source_word: convict
  choice: 죄수
  rationale: 사법적 구금 상태를 나타내는 대조를 현대 한국어에서 분명하게 전달합니다.
- source_word: freed-man
  choice: 해방하신 사람
  rationale: 고대의 법적 신분인 해방노예라는 배경을 살리되, 한국어 본문에서 오해하기 쉬운 직역 대신 주종 관계의 대조를 드러냈습니다.
- source_word: every desire
  choice: 모든 욕망
  rationale: 대상을 특정하지 않는 포괄적 표현을 유지해 원문의 해석 가능성을 좁히지 않았습니다.
theological_decisions:
- issue: '[of Christ]의 본문성'
  choice: 대괄호를 유지한 ‘[그리스도의]’
  alternative: 대괄호 없이 ‘그리스도의’로 본문에 포함하거나 아예 생략
  rationale: 제공된 증거문이 표시한 본문 복원상의 불확실성을 독자에게 그대로 알렸습니다.
- issue: 순교를 통한 하나님 도달 표현
  choice: ‘그것들을 통하여 하나님께 이를 수 있습니다’
  alternative: ‘그것들을 통하여 하나님과 함께할 수 있습니다’
  rationale: 원문의 직접적이고 긴장감 있는 표현을 후대의 교리적 설명으로 완화하지 않았습니다.
- issue: ‘참으로 제자’가 되는 시점
  choice: 미래 조건문을 그대로 유지
  alternative: ‘참된 제자임이 입증될 것입니다’
  rationale: 순교 후에야 참된 제자가 된다는 듯한 원문의 수사적·신학적 긴장을 해소하지 않았습니다.
- issue: ‘rise free in Him’의 의미
  choice: ‘그분 안에서 자유롭게 부활할 것입니다’
  alternative: ‘그분 안에서 자유인으로 일어날 것입니다’
  rationale: 부활을 암시하는 독법을 반영하되, 자유라는 핵심 어휘와 그리스도 안이라는 결합을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 순교를 청하는 대목의 절박함과 dignified한 서신 문체를 유지하되, ‘야수’보다 일반 독자에게 자연스러운 ‘들짐승’을 택했습니다. 제공 자료가 직접적인 그리스어 검토 전 단계임을 고려하여, 영어 공공영역 증거문에 나타난 모호성과 대괄호 표지를 보수적으로 보존했습니다.
