revisions:
- from: '나는 모든 교회에 편지를 쓰며, 내가 기꺼이 하나님을 위하여 죽는다는 것을 모든 사람에게 알립니다. 다만 여러분이 나를 가로막지 마십시오. 나는 여러분에게 권합니다. 때에 맞지 않는 친절을 내게 베풀지 마십시오. 내가 들짐승들에게 내어 맡겨지게 하십시오. 나는 그것들을 통하여 하나님께 이를 수 있습니다. 나는 하나님의 밀알이며, 들짐승들의 이빨에 갈려 [그리스도의] 순전한 빵으로 드러날 것입니다.[a]


