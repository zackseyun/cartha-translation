base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: ko
  text: '여러분의 기도 가운데 시리아에 있는 교회를 기억해 주십시오. 그 교회는 나를 대신하여 하나님을 목자로 모시고 있습니다. 예수 그리스도만이 그 교회의 감독이 되실 것입니다. 그분과 여러분의 사랑이 말입니다.[a]


    그러나 나는 그들 가운데 하나라고 불리는 것이 부끄럽습니다. 나는 그들 가운데 가장 마지막인 사람이며 때 아닌 때에 태어난 자와 같아서, 그럴 자격이 없기 때문입니다.[b] 그러나 만일 내가 하나님께 이른다면, 누군가가 되도록 자비를 입었습니다.[c]


    나의 영이 여러분에게 문안하며, 예수 그리스도의 이름으로 나를 단순한 나그네로서가 아니라 받아 준 교회들의 사랑도 여러분에게 문안합니다. 내가 육신을 따라 가는 길에 있지 않았던 교회들까지도 도시에서 도시로 나보다 앞서 갔습니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분과 여러분의 사랑’은 압축적이고 해석하기 어려운 표현입니다. 예수 그리스도께서 홀로 감독이 되시며 로마 교회의 사랑이 그 돌봄에 함께한다는 뜻으로 이해할 수 있습니다.
    reason: 원문의 병치 구조는 누구 또는 무엇이 감독 역할을 하는지에 관해 문법적 긴장을 남깁니다.
  - marker: b
    text: ‘때 아닌 때에 태어난 자’는 문자적으로 유산되거나 때 이르게 태어난 존재를 가리키는 강한 자기비하의 비유입니다.
    reason: 고대 표현의 충격과 비유적 성격을 현대 독자에게 밝혀 줍니다.
  - marker: c
    text: ‘하나님께 이른다면’은 이 편지의 문맥에서 특히 순교를 통해 하나님께 가는 일을 암시하지만, 그 의미를 그것에만 한정하지는 않습니다.
    reason: 신학적 함의를 설명하면서도 원문의 개방성을 보존합니다.
  - marker: d
    text: ‘육신을 따라’는 여기서 일차적으로 이그나티우스가 실제로 지나가던 지상의 여행 경로를 가리키는 듯합니다. 그 경로에 있지 않은 교회들도 대표자들을 보내어 도시마다 그를 미리 맞았습니다.
    reason: 고대적 관용구와 당시의 영접 관행을 이해하도록 돕되, 표현이 지닌 더 넓은 울림을 단정하지 않습니다.
lexical_decisions:
- source_word: ποιμήν / shepherd (witness)
  choice: 목자
  rationale: 교회를 돌보는 하나님의 역할을 나타내는 초기 그리스도교의 목양 비유를 그대로 보존했습니다.
- source_word: ἐπίσκοπος / bishop (witness)
  choice: 감독
  rationale: 후대 교파의 직제 명칭을 과도하게 투영하지 않으면서 초기 교회의 감독 직무를 나타내는 통용 번역을 택했습니다.
- source_word: ἔκτρωμα / untimely birth (witness)
  choice: 때가 차기 전에 태어난 자
  rationale: 문자적 이미지와 자기비하의 힘을 살리되 현대 독자가 이해할 수 있게 표현했습니다.
- source_word: καταντήσω εἰς θεόν / attain unto God (witness)
  choice: 하나님께 이르다
  rationale: 순교, 구원 또는 하나님과의 연합 중 하나로 의미를 한정하지 않고 원문의 방향성과 신학적 긴장을 보존했습니다.
- source_word: κατὰ σάρκα / according to the flesh (witness)
  choice: 육신을 따라
  rationale: 실제 여행 경로를 가리킬 가능성이 크지만, 바울적·신학적 울림도 남도록 관용구를 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: ‘예수 그리스도만’과 ‘여러분의 사랑’의 관계
  choice: ‘곧 그분과 여러분의 사랑입니다’로 병치를 유지
  alternative: 여러분의 사랑이 예수 그리스도와 함께 감독 역할을 한다고 명시
  rationale: 문장 구조가 압축적이고 해석상 난점이 있으므로, 사랑을 인격적 감독과 완전히 동일시하거나 단순한 보조 수단으로 규정하지 않았습니다.
- issue: ‘하나님께 이르다’의 의미
  choice: 목표 지향적 표현을 그대로 보존
  alternative: 순교하여 하나님과 함께 있게 되다
  rationale: 문맥상 순교가 강하게 암시되지만 표현 자체가 지닌 더 넓은 종말론적·영적 의미를 좁히지 않았습니다.
- issue: ‘누군가가 되다’의 의미
  choice: 역설적 자기비하를 유지
  alternative: 참된 제자가 되다 또는 존귀한 사람이 되다
  rationale: 저자가 자신의 무가치함과 자비를 대조하는 표현을 특정 교리적 신분으로 해설하지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하고, 초기 그리스도교 서신의 엄숙하면서도 개인적인 어조를 살렸습니다. 다만 직접적인 그리스어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언과 감사된 영어 POB를 중심으로 작성한 잠정 번역입니다.
