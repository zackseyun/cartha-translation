    그러나 나는 그들 가운데 하나라고 불리는 것이 부끄럽습니다. 나는 그들 중 가장 작은 자요 때가 차기 전에 태어난 자와 같아서, 그럴 자격이 없기 때문입니다.[b] 그러나 내가 참으로 하나님께 이른다면, 누군가가 되도록 자비를 입었습니다.[c]


    나의 영이 여러분에게 문안하며, 예수 그리스도의 이름으로 나를 단순한 나그네가 아니라 받아 준 교회들의 사랑도 여러분에게 문안합니다. 육신을 따라 정해진 내 여정에 놓이지 않았던 교회들까지도 도시에서 도시로 나보다 앞서 갔습니다.[d]'
