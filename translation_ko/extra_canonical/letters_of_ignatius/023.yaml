  yaml_path: translation/extra_canonical/letters_of_ignatius/023.yaml
  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: ko
  text: 테오포로스라고도 불리는 이그나티우스는 우리 구주 그리스도 예수 안에서 하나님 아버지의 은혜로 복을 받은, 마이안드로스강[a]변의 마그네시아에 있는 교회에 그리스도 예수 안에서 문안드립니다. 하나님 아버지와 예수 그리스도 안에서 넘치는 문안을 기원합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마이안드로스강은 소아시아 서부를 흐르는 고대의 강으로, 오늘날 튀르키예의 뷔위크 멘데레스강입니다.
    reason: 고대 도시 마그네시아의 지리적 구별을 돕습니다.
lexical_decisions:
- source_word: Theophorus
  choice: 테오포로스
  rationale: 칭호의 의미를 본문에서 단정해 번역하지 않고 고유한 호칭으로 음역하여, 원문의 형태와 해석 가능성을 보존했습니다.
- source_word: blessed through the grace
  choice: 은혜로 복을 받은
  rationale: 수단을 나타내는 ‘through’를 ‘-로’로 살리고, 수동 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: on the Maeander
  choice: 마이안드로스강 유역의
  rationale: 도시의 지리적 위치를 나타내는 표현으로 이해하기 쉽게 옮기되 고대 지명을 유지했습니다.
- source_word: abundant greeting / pleista chairein
  choice: 한없는 기쁨이 있기를 빕니다
  rationale: 서신 인사말의 ‘기뻐하다/평안하기를 빌다’라는 뜻과 강조의 뉘앙스를 자연스러운 축원문으로 표현했습니다.
theological_decisions:
- issue: ‘in whom I salute’의 선행사
  choice: ‘그리스도 안에서’로 명시
  alternative: ‘그분 안에서’로 대명사 유지
  rationale: 제공된 증거에서 가장 가까운 선행사는 ‘우리 구주 그리스도 예수’이며, 한국어에서 모호한 대명사를 피하면서도 그리스도와의 연합이라는 표현을 보존했습니다.
- issue: 교회를 여성 단수로 지칭하는 영어 표현
  choice: ‘교회’와 ‘여러분’으로 자연스럽게 전환
  alternative: ‘그에게’ 또는 ‘그녀에게’로 문법적 성을 반영
  rationale: 한국어에는 교회를 여성 명사로 지칭하는 문법 관습이 없으므로, 공동체인 교회와 그 구성원을 자연스럽게 가리키도록 옮겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 서신의 장중한 인사 형식은 유지하되 지나치게 고어적인 표현은 피했습니다. 제공 자료가 공개 영역 영어 번역 증언에 기초하고 있으며 그리스어 원문 대조가 아직 보류 중이므로, ‘테오포로스’의 뜻과 세부 구문은 단정적으로 확장하지 않았습니다.
