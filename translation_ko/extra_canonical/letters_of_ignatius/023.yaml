revisions:
- from: 테오포로스라고도 하는 이그나티우스가, 우리 구주 그리스도 예수 안에서 하나님 아버지의 은혜로 복을 받은 마이안드로스강[a] 유역의 마그네시아 교회에 문안드립니다. 나는 그리스도 안에서 여러분에게 문안하며, 하나님 아버지와 예수 그리스도 안에서 한없는 기쁨이 있기를 빕니다.
  to: 테오포로스라고도 불리는 이그나티우스는 우리 구주 그리스도 예수 안에서 하나님 아버지의 은혜로 복을 받은, 마이안드로스강[a]변의 마그네시아에 있는 교회에 그리스도 예수 안에서 문안드립니다. 하나님 아버지와 예수 그리스도 안에서 넘치는 문안을 기원합니다.
  rationale: 문안의 두 요소를 구별하여, 첫째는 그리스도 예수 안에서 마그네시아 교회에 드리는 문안으로, 둘째는 하나님 아버지와 예수 그리스도 안에서 드리는 풍성한 문안의 기원으로 옮겼습니다. ‘테오포로스’는 해석을 강요하지 않고 음역으로 유지했으며, 지리 수식은 도시를 가리키도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:45:53Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 수신 교회에 대한 문안과 축원을 두 문장으로 나누는 과정에서, 원문의 ‘in whom I salute’와 ‘I wish her abundant greeting’을 각각 ‘나는 그리스도 안에서 여러분에게 문안하며’와 ‘한없는 기쁨’으로 옮겼습니다. 이 때문에 문안이 중복되고, ‘abundant greeting’의 서신 인사말 의미가 ‘기쁨’으로 바뀌었습니다. 또한 ‘Magnesia on the Maeander’는 강 유역 일반이 아니라 마이안드로스강과 관련하여 구별되는 도시명입니다.
  naturalness: ‘마이안드로스강 유역의 마그네시아 교회’도 이해되지만, 고대 도시의 통상적 지리 수식으로는 ‘마이안드로스강변의 마그네시아에 있는 교회’가 더 자연스럽고 정확합니다. ‘넘치는 문안을 기원합니다’는 고대 서신의 축원 형식을 현대 격식체로 자연스럽게 재현합니다.
  terminology: ‘테오포로스’는 뜻을 단정하지 않는 음역으로 유지합니다. ‘우리 구주 그리스도 예수’, ‘하나님 아버지’, ‘예수 그리스도’도 제공된 증언의 용어를 보존합니다. ‘in whom’은 가장 가까운 선행사인 그리스도 예수를 따라 ‘그리스도 예수 안에서’로 명시합니다.
  issues:
  - severity: medium
    issue: ‘abundant greeting’을 ‘한없는 기쁨’으로 번역함
    rationale: 원문 증언의 greeting/chairein은 서신의 문안·축원 공식입니다. 기쁨이라는 정서만으로 옮기면 문안이라는 행위와 형식이 사라집니다.
  - severity: medium
    issue: 문안 표현의 중복 및 주어·대상의 변경
    rationale: 초안은 첫 문장에서 이미 교회에 문안한 뒤 둘째 문장에서 다시 ‘여러분에게 문안’합니다. 원문은 그리스도 안에서 교회에 문안하고 이어 하나님 아버지와 예수 그리스도 안에서 풍성한 문안을 기원합니다.
  - severity: low
    issue: ‘마이안드로스강 유역’ 표현
    rationale: 원문의 지명 수식은 마그네시아를 다른 동명 도시와 구별하는 ‘on the Maeander’입니다. ‘강변의 마그네시아’가 도시명 수식으로 더 직접적입니다.
  revised_text: 테오포로스라고도 불리는 이그나티우스는 우리 구주 그리스도 예수 안에서 하나님 아버지의 은혜로 복을 받은, 마이안드로스강[a]변의 마그네시아에 있는 교회에 그리스도 예수 안에서 문안드립니다. 하나님 아버지와 예수 그리스도 안에서 넘치는 문안을 기원합니다.
