base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: ko
  text: '그러므로 내가 여러분에게 권면합니다. 그러나 권면하는 이는 내가 아니라 예수 그리스도의 사랑입니다. 오직 그리스도인의 양식만을 취하고, 이질적인 풀, 곧 이단을 멀리하십시오.


    그런 자들은 심지어 예수 그리스도에 독을 섞고, 겉으로 정직한 체하여 다른 이들을 속입니다. 이는 마치 치명적인 약을 꿀을 탄 포도주에 섞어 먹이는 사람들과 같습니다. 그리하여 이를 알지 못하는 사람은 아무런 두려움 없이 그것을 마시고, 해로운 쾌감 속에서 죽음을 들이킵니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영문 증언을 바탕으로 한 잠정 번역입니다. 중간 개정본 그리스어 사본 전통에 대한 직접 대조가 아직 필요합니다.
    reason: 원문 자료 설명에 그리스어 원문 검토가 보류 중이라고 명시되어 있으므로 번역의 증거 한계를 투명하게 밝힙니다.
lexical_decisions:
- source_word: Christian food
  choice: 그리스도인의 양식
  rationale: 공급된 영문 증언의 음식 비유를 유지하면서도 현대 한국어에서 품위 있고 자연스럽게 읽히도록 옮겼습니다.
- source_word: strange herbage
  choice: 이질적인 풀
  rationale: 양식과 풀의 대조적 비유를 보존하되, 단순히 ‘낯선’보다 공동체의 가르침과 어울리지 않는다는 뜻을 드러냅니다.
- source_word: heresy
  choice: 이단
  rationale: 초기 그리스도교 문헌의 교리적·분파적 맥락에서 통용되는 표준 용어를 사용했습니다.
- source_word: imposing upon others by a show of honesty
  choice: 겉으로 정직한 체하여 다른 이들을 속입니다
  rationale: 외관상의 선량함 또는 신뢰성을 이용한 기만이라는 의미를 자연스러운 한국어로 전달했습니다.
- source_word: honeyed wine
  choice: 꿀을 탄 포도주
  rationale: 고대의 음료 이미지를 구체적으로 보존하며 독을 달콤함으로 감추는 비유를 명료하게 합니다.
- source_word: drinketh in death
  choice: 죽음을 들이킵니다
  rationale: 죽음을 음료처럼 마신다는 강렬한 원문의 비유를 유지했습니다.
theological_decisions:
- issue: ‘내가 아니라 예수 그리스도의 사랑’의 행위 주체
  choice: 사랑을 권면의 주체로 의인화하여 그대로 보존했습니다.
  alternative: ‘예수 그리스도를 사랑하는 마음으로 권면합니다’처럼 동기로 해석할 수 있습니다.
  rationale: 공급된 증언은 ‘the love of Jesus Christ’를 주체처럼 제시하므로, 그 신학적·수사적 긴장을 해소하지 않았습니다.
- issue: ‘예수 그리스도에 독을 섞는다’는 비유
  choice: 예수 그리스도라는 이름 또는 가르침에 독성 있는 교훈을 혼합한다는 이미지를 직역에 가깝게 보존했습니다.
  alternative: ‘예수 그리스도의 가르침에 거짓 교훈을 섞는다’로 의미를 풀어 쓸 수 있습니다.
  rationale: 그리스도 자신과 거짓 가르침의 충격적인 혼합이라는 표현을 설명적으로 약화하지 않기 위해 비유를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면문의 엄숙함과 음식·독·포도주·죽음으로 이어지는 비유망을 보존하면서, 일반 독자가 이해할 수 있도록 문장을 나누고 고어적 표현은 피했습니다.
