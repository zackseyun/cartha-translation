  terminology: ‘이단’과 ‘그리스도인의 양식’은 공급된 영문 증언을 충실히 따른 선택입니다. ‘그리스도인의 양식’은 문자적으로 개인 그리스도인의 음식처럼도 읽힐 수 있으나, 여기서는 비유적 표현을 보존하기 위해 유지할 수 있습니다. ‘예수 그리스도의 사랑’의 의인화도 해소하지 않고 보존합니다.
