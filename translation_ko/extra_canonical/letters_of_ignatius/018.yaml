  source_fidelity: 초안은 제공된 영어 증언의 논지와 문장 관계를 대체로 충실히 옮깁니다. 다만 ‘the ill odor of the teaching’을 ‘악취 나는 기름’으로 옮기면 악취의 수식 대상이 ‘가르침’에서 ‘기름’으로 바뀌므로, 원문의 은유적 결합을 더 정확히 드러내야 합니다.
  naturalness: 합쇼체와 전체 문체는 자연스럽습니다. ‘교회 위에 썩지 않음을 불어 넣으시려는’보다 ‘교회에 썩지 않음을 불어넣으시려고’가 현대 한국어에서 더 자연스럽고, ‘악취 나는 가르침으로 기름 바르다’는 원문의 의도된 향유/악취 대조를 유지하면서도 문장 성분 관계를 분명히 합니다.
  terminology: ‘향유’, ‘썩지 않음’, ‘이 세상의 통치자’, ‘은혜의 선물’은 영어 증언의 표현 폭을 적절히 보존합니다. ‘하나님의 지식, 곧 예수 그리스도’는 영어 증언의 동격 구조를 유지하며, 해당 속격의 가능한 이해는 각주로 알리는 방식이 적절합니다.
  issues:
