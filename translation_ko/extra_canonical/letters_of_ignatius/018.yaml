base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: ko
  text: '이 때문에 주님께서는 머리에 향유를 받으셨습니다. 그것은 교회 위에 썩지 않음을 불어 넣으시려는 것이었습니다. 이 세상의 통치자가 가르치는 악취 나는 기름을 바르지 마십시오. 그러면 그가 여러분을 사로잡아, 여러분 앞에 놓인 생명을 빼앗지 못할 것입니다.


    그런데 우리는 왜 모두 지혜롭게 걸으며, 하나님의 지식[a], 곧 예수 그리스도를 받아들이지 않습니까? 주님께서 참으로 보내 주신 은혜의 선물을 알지 못한 채, 우리는 왜 어리석음 속에서 멸망합니까?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 지식’은 ‘하나님에 관한 지식’ 또는 ‘하나님을 아는 지식’으로도 이해할 수 있습니다. 제공된 자료는 공개 영역 영어 번역 증언에 근거하며, 그리스어 원문에 대한 직접 검토는 아직 필요합니다.
    reason: 표현의 목적격·주격적 가능성을 보존하고, 현재 초안의 자료적 한계를 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: ointment
  choice: 향유
  rationale: 머리에 붓거나 바르는 향기로운 기름이라는 고대의 이미지를 자연스러운 현대 한국어로 보존했습니다.
- source_word: incorruption
  choice: 썩지 않음
  rationale: 불멸이나 영생으로 의미를 미리 한정하지 않고, 부패하지 않는 상태를 가리키는 표현의 폭과 신학적 긴장을 유지했습니다.
- source_word: prince of this world
  choice: 이 세상의 통치자
  rationale: ‘임금’보다 현대 독자에게 명료하면서도, 해당 존재를 특정 명칭으로 단정하지 않는 표현을 택했습니다.
- source_word: walk prudently
  choice: 지혜롭게 걸으며
  rationale: 생활 방식을 뜻하는 ‘걷다’의 성서적 은유를 보존하면서 prudently의 뜻을 ‘지혜롭게’로 전달했습니다.
- source_word: knowledge of God
  choice: 하나님의 지식
  rationale: ‘하나님에 관한 지식’과 ‘하나님을 아는 지식’ 사이의 가능한 의미 폭을 섣불리 좁히지 않았습니다.
- source_word: gift of grace
  choice: 은혜의 선물
  rationale: ‘은혜’와 ‘선물’이 함께 이루는 강조를 유지하여 단순히 ‘은사’로 축약하지 않았습니다.
theological_decisions:
- issue: ‘하나님의 지식’과 ‘예수 그리스도’의 관계
  choice: ‘하나님의 지식, 곧 예수 그리스도’로 병치했습니다.
  alternative: ‘예수 그리스도 안에서 하나님을 아는 지식’
  rationale: 영어 증언이 나타내는 직접적인 동격 구조를 보존하고, 그 관계를 수단이나 영역으로 해석해 넣지 않았습니다.
- issue: ‘썩지 않음’의 의미
  choice: 추상명사적 표현을 그대로 유지했습니다.
  alternative: ‘불멸의 생명’ 또는 ‘영원한 생명’
  rationale: 원문의 개념을 특정한 구원론적 풀이로 좁히지 않고 교회에 전달되는 비부패성의 이미지를 살렸습니다.
- issue: 향유와 악취 나는 가르침의 대조
  choice: 두 문장 모두 기름 바름의 은유를 유지했습니다.
  alternative: 두 번째 문장을 ‘악한 가르침에 물들지 마십시오’로 의역
  rationale: 그리스도께서 받으신 향유와 세상 통치자의 악취 나는 가르침 사이의 수사적 대조를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문장은 일반 독자가 이해할 수 있도록 다듬되, 향유·악취·불어 넣음·걸음이라는 연속된 비유와 권면의 엄숙한 어조를 유지했습니다. 제공된 영어 공개 영역 증언을 우선 자료로 삼은 잠정 초안이며, 중간본 그리스어 전승에 대한 직접 대조가 필요합니다.
