source:
  text: 'For this cause the Lord received ointment on His head, that He might breathe incorruption upon the Church. Be not anointed with the ill odor of the teaching of the prince of this world, lest he lead you captive and rob you o the life which is set before you.


    And wherefore do we not all walk prudently, receiving the knowledge of God, which is Jesus Christ? Why perish we in our folly, not knowing the gift of grace which the Lord hath truly sent?'
