  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'The farthest bounds of the universe shall profit me nothing, neither the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest bounds of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Bestow not on the world one who desireth to be God''s, neither allure him with material things. Suffer me to receive the pure light. When I am come thither, then shall I be a man.


    Permit me to be an imitator of the passion of my God. If any man hath Him within himself, let him understand what I desire, and let him have fellow-feeling with me, for he knoweth the things which straiten me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: ko
  text: '우주의 가장 먼 끝도 내게는 아무 유익이 없고, 이 세상 왕국들도 그러합니다. 땅끝까지 다스리는 것보다 예수 그리스도를 위해 죽는 것이 내게는 더 좋습니다. 우리를 위해 죽으신 그분을 나는 찾고, [우리를 위해] 다시 살아나신 그분을 나는 갈망합니다.[a]


    해산의 산고가 내게 닥쳤습니다. 형제들이여, 나를 참아 주십시오. 내가 사는 것을 가로막지 말고, 내가 죽기를 바라지 마십시오. 하나님의 것이 되기를 바라는 이를 세상에 넘겨주지 말고, 물질적인 것들로 그를 유혹하지도 마십시오. 내가 순전한 빛을 받도록 허락해 주십시오. 내가 그곳에 이르면, 나는 사람이 될 것입니다.


    내 하나님의 수난을 본받는 사람이 되도록 허락해 주십시오. 누구든지 자기 안에 그분을 모시고 있다면, 내가 무엇을 바라는지 깨닫고 나와 함께 아파해 주십시오. 그는 나를 옥죄는 것들이 무엇인지 알고 있기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘[우리를 위해]’는 공급된 영어 증언에서 대괄호로 표시된 보충어입니다. 그 표지를 그대로 보존했습니다.
    reason: 본문 전승 또는 번역상 보충임을 독자가 알 수 있게 하기 위해서입니다.
lexical_decisions:
- source_word: the farthest bounds of the universe / earth
  choice: 우주의 가장 먼 끝 / 땅끝
  rationale: 공급된 증언의 공간적 극한 표현을 자연스러운 현대 한국어로 보존하면서, universe와 earth의 차이를 유지했습니다.
- source_word: profit me nothing
  choice: 내게는 아무 유익이 없고
  rationale: 실용적·영적 유익 모두를 열어 두는 일반적 표현으로 옮겼습니다.
- source_word: the pangs of a new birth
  choice: 새로 태어나는 산고
  rationale: 출산의 고통과 새로운 탄생이라는 역설적 이미지를 함께 보존했습니다.
- source_word: pure light
  choice: 순전한 빛
  rationale: 도덕적 순결, 혼합되지 않음, 초월적 빛의 함의를 특정 교리로 한정하지 않도록 했습니다.
- source_word: passion
  choice: 수난
  rationale: 단순한 감정이 아니라 그리스도의 고난과 죽음을 가리키는 초기 그리스도교 용례를 반영했습니다.
- source_word: the things that constrain me
  choice: 나를 옥죄는 것들
  rationale: 외적 압박과 내적 절박함을 모두 수용할 수 있도록 구체적 대상을 확정하지 않았습니다.
theological_decisions:
- issue: ‘Do not hinder me from living; do not desire my death’의 역설
  choice: ‘내가 사는 것을 가로막지 말고, 내가 죽기를 바라지 마십시오’로 직역에 가깝게 보존
  alternative: ‘순교하여 참생명을 얻는 일을 막지 마십시오’라고 해설적으로 번역
  rationale: 육체적 죽음을 생명으로 부르는 신학적 긴장을 본문 안에서 풀어 설명하지 않고 그대로 유지했습니다.
- issue: ‘then shall I be a man’의 의미
  choice: ‘그때에야 나는 참으로 사람이 될 것입니다’
  alternative: ‘그때에야 나는 완전한 사람이 될 것입니다’
  rationale: 완전성에 관한 특정 인간론을 과도하게 부과하지 않으면서 문맥의 성취 강조를 전달했습니다.
- issue: ‘the passion of my God’의 높은 그리스도론
  choice: ‘나의 하나님의 수난’
  alternative: ‘나의 하나님이신 그리스도의 수난’
  rationale: 원문의 충격적이고 압축된 표현을 보존하고, 지시 대상을 본문 밖에서 확장하지 않았습니다.
- issue: ‘has Him within himself’의 내주 표현
  choice: ‘자기 안에 그분을 모시고 있다면’
  alternative: ‘그분이 그 사람 안에 계시다면’
  rationale: 한국어로 자연스럽게 내주를 나타내되, 그 방식에 관한 교파적 설명은 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면과 간청에는 ‘-십시오’를 써서 긴박함과 존엄성을 함께 살렸고, 고어체는 피했습니다. 다만 직접 그리스어 대조가 아직 이루어지지 않았으므로, 공급된 공공 영역 영어 증언과 감사된 영어 POB를 바탕으로 한 잠정 번역입니다.
