  terminology: ‘수난’, ‘순전한 빛’, ‘하나님의 것이 되기를 바라는 이’, ‘내 하나님의 수난’은 원문의 표현과 신학적 긴장을 특정 교리로 해설하지 않고 유지합니다. ‘참으로’는 원문에 명시되지 않은 해석적 강화이므로 제거했습니다.
