    그러므로 나는 하느님의 이름 안에서 오네시모를 통하여 여러분의 온 공동체를 맞이하였습니다. 그는 말로 다 표현할 수 없을 만큼 사랑이 넘치는 사람이며, 또한 육신으로는[c] 여러분의 감독입니다. 나는 여러분이 예수 그리스도에 따라 그를 사랑하고, 여러분 모두가 그와 같은 사람이 되기를 기도합니다. 여러분이 이처럼 훌륭한 감독을 두도록 여러분에게 합당하게 허락하신 분은 복되십니다.


    [a] 이 말은 제공된 증언에서 대괄호로 표시되어 있으며, 보충되었거나 본문 상태가 불확실한 부분임을 나타냅니다.


    [b] 직역에 가깝게는 “하느님의 피 안에서 마음이 불붙어”입니다. 신성과 수난을 함께 말하는 원문의 강한 표현을 완화하지 않았습니다.


    [c] “육신으로는”은 제공된 증언에서 대괄호로 표시된 표현입니다. 그 정확한 함의는 단정하지 않았습니다.'
