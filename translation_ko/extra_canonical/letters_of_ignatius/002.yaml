translation:
  language: ko
  text: '하느님 안에서 여러분의 지극히 사랑받는 이름을 기쁘게 맞이합니다. 여러분은 본래 마땅히 그 이름을 지니고 있으며, [올곧고 덕스러운 마음으로][a] 우리 구원자 예수 그리스도를 믿고 사랑합니다. 여러분은 하느님을 본받는 사람들이며, 하느님의 피로 마음에 불이 붙어[b] 여러분에게 걸맞은 일을 온전히 이루었습니다.


    여러분은 내가 공동의 이름과 소망을 위하여 결박된 채 시리아에서 오는 길이라는 소식을 들었습니다. 또 내가 여러분의 기도로 로마에서 맹수들과 싸우는 일을 끝까지 감당하여, 그렇게 함으로써 제자가 될 수 있기를 바란다는 말을 듣고는 서둘러 나를 찾아왔습니다.


    그러므로 나는 하느님의 이름으로 오네시모를 통해 여러분 모두를 맞아들였습니다. 그는 말로 다 표현할 수 없을 만큼 사랑이 넘치는 사람이며, 육신으로는[c] 여러분의 감독입니다. 나는 여러분이 예수 그리스도의 뜻에 따라 그를 사랑하고, 여러분 모두가 그와 같은 사람이 되기를 기도합니다. 여러분이 이처럼 훌륭한 감독을 두도록 여러분에게 합당하게 허락하신 분은 복되십니다.


    [a] 이 구절은 전승 본문의 불확실성 또는 보충된 문구를 나타내는 대괄호 안에 전해집니다.

    [b] 직역하면 “하느님의 피 안에서 다시 불붙어”입니다. 신성과 수난을 함께 말하는 원문의 강한 표현을 그대로 살렸습니다.

    [c] “육신으로는”은 감독의 구체적이고 현실적인 직무를 가리킬 수 있으나, 그 정확한 함의는 단정하지 않았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절은 전승 본문의 불확실성 또는 보충된 문구를 나타내는 대괄호 안에 전해집니다.
    reason: 제공된 증언에서 대괄호로 표시된 본문 상태를 독자에게 알리기 위해서입니다.
  - marker: b
    text: 직역하면 “하느님의 피 안에서 다시 불붙어”입니다. 신성과 수난을 함께 말하는 원문의 강한 표현을 그대로 살렸습니다.
    reason: 자연스러운 본문 번역과 특이한 원문 어법을 함께 제시하기 위해서입니다.
  - marker: c
    text: “육신으로는”은 감독의 구체적이고 현실적인 직무를 가리킬 수 있으나, 그 정확한 함의는 단정하지 않았습니다.
    reason: ‘육신으로’의 해석적 모호성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: well beloved name
  choice: 지극히 사랑받는 이름
  rationale: ‘이름’을 명성이나 공동체 정체성으로 풀어 쓰지 않고, 증언 본문의 표현과 그 모호성을 보존했습니다.
- source_word: the common Name and hope
  choice: 공동의 이름과 소망
  rationale: ‘이름’을 곧바로 예수의 이름으로 명시하지 않고, 공동체가 함께 고백하는 이름이라는 원문의 여지를 남겼습니다.
- source_word: in the blood of God
  choice: 하느님의 피로
  rationale: 낯설지만 신학적으로 중요한 표현을 완화하거나 ‘그리스도의 피’로 바꾸지 않았습니다.
- source_word: bishop
  choice: 감독
  rationale: 후대 교단의 직제 명칭을 직접 투영하지 않으면서 초기 그리스도교 공동체의 감독 직무를 나타내는 일반적 번역어를 사용했습니다.
- source_word: fighting the wild beasts
  choice: 맹수들과 싸우는 일
  rationale: 순교 상황을 구체적으로 암시하는 표현을 은유화하지 않고 보존했습니다.
- source_word: congenial work
  choice: 여러분에게 걸맞은 일
  rationale: ‘본성에 맞는/동류의’라는 난해한 함의를 자연스러운 한국어로 옮기되 특정 행위를 임의로 규정하지 않았습니다.
theological_decisions:
- issue: ‘하느님의 피’라는 신성과 수난의 결합
  choice: 하느님의 피
  alternative: 그리스도의 피
  rationale: 본문의 의도적인 신학적 긴장을 그대로 보존하고 더 익숙한 표현으로 대체하지 않았습니다.
- issue: ‘제자가 되다’와 순교의 관계
  choice: 그렇게 함으로써 제자가 될 수 있기를
  alternative: 참된 제자로 인정받기를
  rationale: 순교가 제자됨을 가능하게 한다는 강한 표현을 유지하면서, 인정이나 공로라는 해석을 덧붙이지 않았습니다.
- issue: 오네시모를 ‘육신으로’ 감독이라 부르는 표현
  choice: 육신으로는 여러분의 감독
  alternative: 현세에서 여러분의 감독
  rationale: 육신과 영의 대비 가능성을 제거하지 않고 원문의 구체적 표현을 남겼습니다.
- issue: 감독을 받은 것이 수신자들에게 ‘합당하다’는 진술
  choice: 여러분에게 합당하게 허락하신
  alternative: 여러분이 받을 만하기 때문에 주신
  rationale: 공로에 따른 보상으로 단정하지 않고 ‘합당함’의 의미 범위를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 문장은 긴 원문 구조를 읽기 쉬운 단위로 나누되 논리적 연결은 유지했습니다. ‘하느님’, ‘감독’, ‘맹수’, ‘결박’처럼 고대 교회 문헌에 어울리는 품위 있는 어휘를 사용했으며, 제공 자료가 영어 공용 증언이고 그리스어 직접 검토가 아직 보류 중이므로 본 초안은 잠정적입니다.
