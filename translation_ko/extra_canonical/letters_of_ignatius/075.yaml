base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: ko
  text: '11


    길리기아 출신의 집사 필론은 좋은 평판을 받는 사람으로, 지금도 하나님의 말씀 안에서 나를 섬기고 있습니다. 또한 레오스 아가토푸스는 택함받은 사람으로서, 이 세상살이를 버리고 시리아에서부터 나를 따라왔습니다. 이 두 사람도 여러분에 대해 증언합니다. 여러분이 그들을 영접해 주었으므로, 나도 여러분을 두고 하나님께 감사드립니다. 내가 믿기로는 주님께서도 여러분을 영접하실 것입니다. 그러나 그들을 모욕한 사람들도 예수 그리스도의 은혜로 구원받기를 바랍니다.


    트로아스에 있는 형제자매들의 사랑이 여러분에게 문안합니다. 나는 이곳에서 부로스의 손을 빌려 여러분에게 이 글을 씁니다. 에베소 사람들과 서머나 사람들이 존경의 뜻으로 그를 나와 함께 보내 주었습니다. 주님, 곧 예수 그리스도께서 그들을 존귀하게 하실 것입니다. 그들은 육신과 혼과 영으로, 믿음과 사랑과 하나 됨 가운데 그분께 소망을 두고 있습니다. 우리 모두의 소망이신 그리스도 예수 안에서 평안하십시오.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάκονος (as reflected in “the deacon”)
  choice: 집사
  rationale: 초기 그리스도교 공동체의 직분을 나타내는 통상적이고 이해하기 쉬운 한국어 표현을 사용했습니다.
- source_word: λόγος θεοῦ (as reflected in “the word of God”)
  choice: 하나님의 말씀
  rationale: 교회 문헌의 맥락과 한국어 성경 독자의 익숙함을 살리면서도 원문의 의미를 직접적으로 보존합니다.
- source_word: ἀποταξάμενος τῷ βίῳ (as reflected in “having bidden farewell to this present life”)
  choice: 이 세상살이를 버리고
  rationale: 단순히 죽었다는 뜻으로 오해되지 않도록, 현재의 삶의 방식이나 세속적 삶을 단념했다는 긴장을 보존했습니다.
- source_word: μαρτυροῦσιν ὑμῖν (as reflected in “bear witness to you”)
  choice: 여러분에 대해 증언합니다
  rationale: 문맥상 필론과 아가토푸스가 필라델피아 공동체의 영접을 증언한다는 의미로 읽되, 직접 그리스어 대조가 아직 남아 있음을 고려해 간결하게 옮겼습니다.
- source_word: εἰς λόγον τιμῆς (as reflected in “as a mark of honor”)
  choice: 존경의 뜻으로
  rationale: 문자적 구조보다 파송 행위가 표현하는 존중의 의미를 자연스러운 현대 한국어로 전달했습니다.
- source_word: ὁμόνοια (as reflected in “concord”)
  choice: 하나 됨
  rationale: 단순한 의견 일치보다 공동체적 조화와 연합을 나타내는 문맥적 의미를 일상 독자에게 분명히 전달합니다.
theological_decisions:
- issue: ‘이 세상 삶에 작별했다’는 표현의 의미
  choice: ‘이 세상살이를 버리고’로 번역하여 금욕적·제자도적 단념으로 읽힐 여지를 보존했습니다.
  alternative: ‘현세의 삶에 작별하고’ 또는 죽음을 뜻하는 표현
  rationale: 문맥상 아가토푸스는 살아서 이그나티우스를 따르고 있으므로 육체적 죽음으로 단정하지 않았습니다.
- issue: 주님이 영접하신다는 진술
  choice: ‘내가 믿기로는 주님께서도 여러분을 영접하실 것입니다’로 옮겼습니다.
  alternative: 구원의 확정을 더 강하게 표현하는 번역
  rationale: 저자의 신뢰를 나타내는 표현과 미래적 소망을 유지하고, 특정 구원론적 체계를 덧붙이지 않았습니다.
- issue: 그들을 모욕한 사람들을 위한 기원
  choice: ‘예수 그리스도의 은혜로 구원받기를 바랍니다’로 옮겼습니다.
  alternative: ‘속량받기를’
  rationale: ‘redeemed’의 신학적 무게를 유지하면서 일반 독자가 바로 이해할 수 있는 표현을 택했습니다. 이는 정죄가 아니라 은혜를 구하는 기원입니다.
- issue: 육신·혼·영의 삼중 표현
  choice: ‘육신과 혼과 영으로’를 그대로 보존했습니다.
  alternative: ‘온 존재로’
  rationale: 인간 구성에 관한 특정 교리로 해석하지 않으면서 원문 전승에 나타난 삼중 병렬과 그 신학적 긴장을 유지했습니다.
- issue: ‘그들’의 지시 대상
  choice: 문법적 복수형을 유지하여 ‘그들을 존귀하게 하실 것’이라고 번역했습니다.
  alternative: 에베소와 서머나 공동체 또는 부로스를 명시
  rationale: 제공된 증거만으로 지시 대상을 하나로 확정하지 않고 원문의 대명사적 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 고대 교회 서신의 존엄성과 목회적 온기를 살리되, 지나치게 고어적인 표현은 피했습니다. 인명은 중간본 그리스어 전승을 잠정적으로 반영하여 ‘필론, 레오스 아가토푸스, 부로스’로 적었습니다. 다만 제공 자료가 공용 영어 번역 증언에 기초하고 있고 직접적인 그리스어 원문 검토가 아직 완료되지 않았으므로, 인명 표기와 일부 구문은 출판 전에 중간본 그리스어 전승과 대조해야 합니다.
