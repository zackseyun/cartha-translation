review_pass:
  verdict: revise
  source_fidelity: 첫 단락의 “this will surely be”는 조건이 충족될 때 ‘그렇게 될 것’이라는 진술입니다. 초안의 “그렇게 할 수 있을 것입니다”는 가능·능력의 뜻을 더하여 원문의 서술을 바꿉니다. 또한 “without the bishop and presbytery and deacons”는 특정 승인 절차나 단순 부재로 한정하지 않고, 이 직분자들과 분리되어 행동한다는 넓은 뜻으로 옮겨야 합니다.
  naturalness: 합쇼체와 직분 용어는 대체로 자연스럽습니다. 다만 첫 단락의 결론을 ‘그리될 것입니다’로 하면 원문의 다소 압축된 지시 관계를 유지하면서도 한국어로 읽을 수 있습니다.
  terminology: ‘감독’, ‘장로단’, ‘집사’, ‘사도들의 규례’, ‘성소’는 제공된 영어 증언의 어휘를 충실히 따릅니다. [God]의 대괄호는 본문상 신호이므로 [하나님]으로 보존하고, 해당 위치에 각주를 붙입니다.
  issues:
  - severity: medium
    issue: “this will surely be”를 “그렇게 할 수 있을 것입니다”로 번역함
    rationale: 원문 증언은 능력이나 허용이 아니라 결과의 확실성을 말합니다. ‘할 수 있다’는 의미를 추가하지 않아야 합니다.
  - severity: low
    issue: 각주 a의 표지가 문장 끝에 있어 [하나님]의 대괄호 표기와 직접 연결되지 않음
    rationale: 각주가 바로 그 본문상 표기를 설명하므로 [하나님] 뒤에 붙이는 편이 앵커가 명확합니다.
  - severity: low
    issue: 각주 b가 ‘성소’ 비유를 교회 공동 질서로 단정적으로 해설함
    rationale: 제공된 증언만으로 비유의 구체적 지시 대상을 확정하지 않는 편이 적절합니다. 직분 용어와 정결 언어만 설명하도록 절제합니다.
  revised_text: '그러므로 여러분은 그런 사람들을 경계하십시오. 여러분이 교만해지지 않고 [하나님][a] 예수 그리스도와 감독과 사도들의 규례에서 떨어지지 않는다면, 반드시 그리될 것입니다.


    성소 안에 있는 사람은 깨끗하지만, 성소 밖에 있는 사람은 깨끗하지 않습니다. 곧 감독과 장로단과 집사들과 떨어져서 무엇이든 하는 사람은 양심이 깨끗하지 않습니다.[b]'
  revised_footnotes:
  - marker: a
    text: ‘[하나님]’의 대괄호는 제공된 본문 증거에 있는 표기를 보존한 것으로, 이 낱말의 본문상 불확실성을 나타냅니다. 이 번역은 공개 영역 영어 번역 증언을 바탕으로 하며, 그리스어 원문 대조가 아직 필요합니다.
    reason: 본문 변이 신호와 번역 근거의 한계를 투명하게 밝힙니다.
