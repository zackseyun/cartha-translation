    text: ‘장로단’은 한 명의 장로가 아니라 장로들로 이루어진 집단을 뜻합니다. 여기서 ‘성소’와 ‘깨끗함’이라는 표현은 본문이 사용하는 정결 언어를 그대로 옮긴 것입니다.
    reason: 고대 교회 직분의 집합적 용법과 정결 언어를 설명하되, 비유의 구체적 지시 대상을 단정하지 않습니다.
