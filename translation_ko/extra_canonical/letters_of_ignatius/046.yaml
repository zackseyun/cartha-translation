source:
  text: 'Be ye therefore on your guard against such men. And this will surely be, if ye be not puffed up and if ye be inseparable from [God] Jesus Christ and from the bishop and from the ordinances of the Apostles.


    He that is within the sanctuary is clean; but he that is without the sanctuary is not clean, that is, he that doeth aught without the bishop and presbytery and deacons, this man is not clean in his conscience.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Be ye therefore on your guard against such men. And this will surely be, if ye be not puffed up and if ye be inseparable from [God] Jesus Christ and from the bishop and from the ordinances of the Apostles.


    He that is within the sanctuary is clean; but he that is without the sanctuary is not clean, that is, he that doeth aught without the bishop and presbytery and deacons, this man is not clean in his conscience.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: ko
  text: '그러므로 여러분은 그런 사람들을 경계하십시오. 여러분이 교만해지지 않고, [하나님] 예수 그리스도와 감독과 사도들의 규례에서 떨어지지 않는다면, 분명 그렇게 할 수 있을 것입니다.[a]


    성소 안에 있는 사람은 깨끗하지만, 성소 밖에 있는 사람은 깨끗하지 않습니다. 곧 감독과 장로단과 집사들을 떠나 무슨 일이든 하는 사람은 양심이 깨끗하지 않습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘[하나님]’의 대괄호는 제공된 본문 증거에 있는 표기를 보존한 것으로, 이 낱말의 본문상 불확실성을 나타냅니다. 이 초안은 공개 영역 영어 번역 증언을 바탕으로 하며 그리스어 원문 대조가 아직 필요합니다.
    reason: 본문 변이 신호와 번역 근거의 한계를 투명하게 밝히기 위해서입니다.
  - marker: b
    text: ‘장로단’은 한 명의 장로가 아니라 장로들로 이루어진 집단을 뜻합니다. ‘성소’와 ‘깨끗함’은 교회의 공동 질서 안과 밖을 제의적 정결 언어로 표현한 비유입니다.
    reason: 고대 교회 직분 용어와 정결 비유가 현대 독자에게 오해되지 않도록 설명하기 위해서입니다.
lexical_decisions:
- source_word: be on your guard
  choice: 경계하십시오
  rationale: 위험한 사람들을 주의하라는 권면을 현대의 정중하고 분명한 명령형으로 옮겼습니다.
- source_word: puffed up
  choice: 교만해지다
  rationale: 자만하여 부풀어 오른다는 비유의 뜻을 자연스러운 현대 한국어로 전달했습니다.
- source_word: inseparable from
  choice: …에서 떨어지지 않다
  rationale: 그리스도 및 교회 직분·사도적 규례와의 긴밀한 결속을 자연스럽게 나타냅니다.
- source_word: ordinances of the Apostles
  choice: 사도들의 규례
  rationale: 전승, 명령, 규정 가운데 무엇을 구체적으로 가리키는지 확정하지 않고 포괄적인 ‘규례’로 보존했습니다.
- source_word: sanctuary
  choice: 성소
  rationale: 경계 안과 밖의 정결 비유를 살리면서 제의적 어감을 보존했습니다.
- source_word: presbytery
  choice: 장로단
  rationale: 개별 장로가 아니라 장로들의 집합적 회의체를 가리키는 표현으로 옮겼습니다.
- source_word: clean in his conscience
  choice: 양심이 깨끗하다
  rationale: 정결 언어와 내적 양심의 판단을 함께 보존했습니다.
theological_decisions:
- issue: '[God] Jesus Christ의 괄호 표기'
  choice: '[하나님] 예수 그리스도'
  alternative: 하나님이신 예수 그리스도 / 예수 그리스도
  rationale: 제공된 증거에서 대괄호는 본문상의 불확실성을 알리는 신호이므로, 이를 해소하지 않고 그대로 보존했습니다.
- issue: 교회 직분자들 ‘없이’ 행한다는 표현
  choice: 감독과 장로단과 집사들을 떠나 … 하는
  alternative: 감독과 장로단과 집사들의 승인 없이 … 하는
  rationale: 원문의 범위를 특정한 승인 절차로 좁히지 않고, 직분자들과 분리되어 독자적으로 행동한다는 폭넓은 의미를 유지했습니다.
- issue: 성소 안과 밖의 정결
  choice: 비유를 직역에 가깝게 유지
  alternative: 교회 공동체 안에 있는 사람은 올바르다
  rationale: 제의적 정결 이미지와 교회 질서의 관계를 독자가 판단할 수 있도록 신학적 비유를 풀어 없애지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 단호하되 과도하게 권위적인 문투를 피했고, 고대 교회 질서를 나타내는 ‘감독·장로단·집사’와 제의적 이미지인 ‘성소·깨끗함’을 dignified하고 이해 가능한 형태로 유지했습니다. 직접 그리스어 검토가 아직 이루어지지 않았으므로 잠정 번역입니다.
