  english_witness: 'I salute you from Smyrna, together with the churches of God that are present with me; men who refreshed me in all ways both in flesh and in spirit.


    My bonds exhort you, which for Jesus Christ''s sake I bear about, entreating that I may attain unto God; abide ye in your concord and in prayer one with another. For it becometh you severally, and more especially the presbyters, to cheer the soul of your bishop unto the honor of the Father [and to the honor] of Jesus Christ and of the Apostles.


    I pray that ye may hearken unto me in love, lest I be for a testimony against you by having so written. And pray ye also for me who have need of your love in the mercy of God, that I may be vouchsafed the lot which I am eager to attain, to the end that I be not found reprobate.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: ko
  text: '나는 서머나에서 여러분에게 문안합니다. 여기 나와 함께 있는 하나님의 교회들도 함께 문안합니다. 그들은 육신으로나 영으로나 모든 면에서 나에게 새 힘을 북돋아 주었습니다.


    내가 예수 그리스도를 위하여 지고 다니는 이 사슬이 여러분에게 권면합니다. 나는 하나님께 이를 수 있기를 간청합니다. 여러분은 서로 한마음으로 화목하며 함께 기도하는 가운데 굳게 머무르십시오. 여러분 각 사람은, 특히 장로들은, 아버지와 [또한] 예수 그리스도와 사도들의 영예를 위하여 여러분의 감독의 마음에 용기를 북돋아 주는 것이 마땅합니다.[a]


    나는 여러분이 사랑으로 내 말을 들어 주기를 바랍니다. 내가 이렇게 써 보낸 일로 여러분을 거슬러 증언하는 증인이 되지 않게 하려는 것입니다. 여러분도 나를 위하여 기도해 주십시오. 나는 하나님의 자비 안에서 여러분의 사랑이 필요합니다. 그리하여 내가 간절히 이르려는 몫을 허락받고, 버림받은 자로 드러나지 않기를 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장의 대괄호는 전승 또는 편집상의 복원 신호를 보존한 것입니다. 현재 번역은 제공된 영어 증언을 바탕으로 하며, 그리스어 원문에 대한 직접 대조가 필요합니다.
    reason: 제공된 원자료가 ‘[and to the honor]’라는 복원 표지를 명시하며, 그리스어 원문 검토가 아직 완료되지 않았기 때문입니다.
lexical_decisions:
- source_word: flesh and spirit (σάρξ / πνεῦμα presumed behind witness)
  choice: 육신으로나 영으로나
  rationale: 신체적·영적 양면을 자연스럽게 나타내면서 초기 그리스도교 문헌의 대조를 보존했습니다.
- source_word: bonds
  choice: 사슬
  rationale: 단순한 추상적 ‘속박’보다 수감 상태와 그가 몸에 지닌 결박을 구체적으로 전달합니다.
- source_word: attain unto God
  choice: 하나님께 이르다
  rationale: 순교와 죽음 이후의 귀결을 직접 해설하지 않고 원문의 신학적 함축과 긴장을 보존했습니다.
- source_word: presbyters
  choice: 장로들
  rationale: 초기 교회의 직분 명칭을 현대 한국어 성서·교회 용례에 맞게 옮겼습니다.
- source_word: bishop
  choice: 감독
  rationale: 후대의 특정 교단 직제와 곧바로 동일시하지 않으면서 ἐπίσκοπος에 대응하는 통상적 역사 용어를 사용했습니다.
- source_word: lot / destiny
  choice: 몫
  rationale: 추정되는 κλῆρος 계열의 제비·분깃 의미를 살리고 ‘운명’이라는 결정론적 뉘앙스를 피했습니다.
- source_word: reprobate
  choice: 버림받은 자
  rationale: 시험에서 인정받지 못한다는 의미와 신학적 무게를 모두 담되 최종적 정죄로 과도하게 단정하지 않았습니다.
theological_decisions:
- issue: ‘하나님께 이르다’의 의미
  choice: 표현을 그대로 보존
  alternative: 순교하여 하나님과 함께 있게 되다
  rationale: 문맥상 순교를 가리킬 가능성이 크지만, 본문 자체의 간결하고 함축적인 표현을 해설로 대체하지 않았습니다.
- issue: 감독의 ‘soul’을 북돋우라는 표현
  choice: 감독의 마음에 용기를 북돋아 주다
  alternative: 감독의 영혼을 위로하다
  rationale: ψυχή/영혼의 문자성을 다소 완화하되, 감독 개인의 내적 생명과 용기를 돌보라는 뜻을 자연스러운 한국어로 전달했습니다.
- issue: 아버지와 예수 그리스도의 영예에 관한 복원 표지
  choice: 아버지와 [또한] 예수 그리스도와 사도들의 영예
  alternative: 아버지와 예수 그리스도와 사도들의 영예
  rationale: 제공된 증거에서 두 번째 ‘영예’ 구절이 복원임을 나타내므로 대괄호 신호를 보존하되 한국어 문장에서는 ‘또한’만 괄호 안에 두어 반복을 피했습니다.
- issue: ‘증인이 되다’의 심판 언어
  choice: 여러분을 거슬러 증언하는 증인이 되다
  alternative: 여러분을 고발하게 되다
  rationale: 저자의 편지가 불순종을 입증하는 증언이 될 수 있다는 법정적·성서적 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 교회 서신의 장중함은 유지하되 고어체를 피했습니다. 수신자가 복수인 점을 ‘여러분’으로 분명히 했고, 문단 구조는 제공된 증언을 따랐습니다. 직접 그리스어 검토가 보류된 상태이므로 어휘 판단은 중간본 그리스어 전승을 반영한 공공 영역 영어 증언과 영어 POB 자문층을 비판적으로 활용한 잠정안입니다.
