    But the Gospel hath a singular preeminence in the advent of the Savior, even our Lord Jesus Christ, and His passion and resurrection. For the beloved Prophets in their preaching pointed to Him; but the Gospel is the completion of immortality. All things together are good, if ye believe through love.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: ko
  text: '제사장들도 마찬가지로 훌륭하지만, 지성소를 맡으신 대제사장은 더 뛰어나십니다. 하나님의 감추어진 일들은 오직 그분께만 맡겨졌기 때문입니다. 그분 자신이 아버지께로 들어가는 문이십니다. 그 문을 통하여 아브라함과 이삭과 야곱이 들어가며, 예언자들과 사도들과 온 교회도 들어갑니다. 이 모든 것은 하나님의 하나 됨 안에서 함께 모입니다.


    그러나 복음은 구주, 곧 우리 주 예수 그리스도께서 오신 일과 그분의 고난과 부활에서 유일하게 뛰어납니다. 사랑받는 예언자들은 선포를 통해 그분을 가리켰지만, 복음은 불멸의 완성입니다.[a] 여러분이 사랑을 통하여 믿는다면, 이 모든 것은 함께 선합니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불멸의 완성’은 복음이 불멸을 완결하거나 충만하게 한다는 뜻일 수 있습니다. 원문의 압축된 표현을 살려 번역했습니다.
    reason: 독자가 난해한 신학적 결합을 번역상의 오류로 오해하지 않도록 하면서 의미를 하나로 확정하지 않기 위함입니다.
  - marker: b
    text: ‘사랑을 통하여 믿는다면’은 믿음이 사랑을 매개로 나타나거나 작용한다는 뜻으로 이해할 수 있으나, 둘의 정확한 관계는 문장이 명시하지 않습니다.
    reason: 믿음과 사랑의 관계에 대한 본문의 진정한 모호성을 보존하기 위함입니다.
lexical_decisions:
- source_word: priests / High-priest
  choice: 제사장들 / 대제사장
  rationale: 성전 제의의 대비를 보존하면서 현대 한국어 성경 독자에게 익숙한 용어를 사용했습니다.
- source_word: holy of holies
  choice: 지성소
  rationale: 성전의 가장 거룩한 곳을 가리키는 정착된 한국어 표현입니다.
- source_word: hidden things of God
  choice: 하나님의 감추어진 일들
  rationale: ‘비밀’로 좁혀 해석하지 않고, 하나님께 속하여 감추어진 것들이라는 의미 폭을 유지했습니다.
- source_word: door of the Father
  choice: 아버지께로 들어가는 문
  rationale: 문이 아버지께 속한다는 뜻과 아버지께 이르게 하는 문이라는 문맥적 기능을 자연스럽게 드러냈습니다.
- source_word: unity of God
  choice: 하나님의 하나 됨
  rationale: 추상적인 ‘일치’보다 신적 통일성을 나타내되, 후대의 교리적 전문어로 과도하게 규정하지 않았습니다.
- source_word: Gospel
  choice: 복음
  rationale: 메시지와 구원 사건을 함께 가리킬 수 있는 전통적이고 일반적인 번역어입니다.
- source_word: completion of immortality
  choice: 불멸의 완성
  rationale: 난해한 결합을 해설로 풀어 확정하지 않고 원문의 신학적 긴장을 보존했습니다.
- source_word: believe through love
  choice: 사랑을 통하여 믿다
  rationale: 사랑과 믿음의 관계를 ‘사랑으로 말미암아’ 또는 ‘사랑 안에서’로 단정하지 않고 매개를 나타내는 표현을 유지했습니다.
theological_decisions:
- issue: 대제사장의 정체
  choice: 문맥상 그리스도를 가리키도록 존칭을 사용하되 이름을 본문에 덧붙이지 않음
  alternative: ‘그리스도이신 대제사장’이라고 명시
  rationale: 후속 문장의 ‘그분 자신이 문’이라는 진술은 그리스도론적 독해를 강하게 시사하지만, 해당 문장에 없는 이름을 보충하지 않았습니다.
- issue: 족장·예언자·사도·교회가 문을 통하여 들어감
  choice: 각 집단이 모두 그 문을 통하여 들어간다는 병렬 구조를 보존
  alternative: 그리스도 안에서 구원받거나 아버지께 나아간다고 해설
  rationale: ‘들어간다’의 목적과 구원론적 방식을 번역자가 추가로 규정하지 않았습니다.
- issue: 복음과 불멸의 관계
  choice: ‘복음은 불멸의 완성’으로 직역에 가깝게 보존
  alternative: ‘복음은 불멸을 완전히 이루어 줍니다’
  rationale: 복음이 불멸을 완결하는 사건인지, 완성된 계시인지에 관한 원문의 압축성과 모호성을 유지했습니다.
- issue: ‘이 모든 것은 함께 선하다’의 범위
  choice: 앞서 언급된 제사장·예언자·복음 등의 전체를 포괄할 수 있도록 그대로 둠
  alternative: 옛 제도와 복음은 모두 선하다고 명시
  rationale: 지시 범위를 특정 신학 체계에 맞추어 좁히지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 고대 교회 문헌의 장중함은 유지하되 ‘유일하게 뛰어납니다’, ‘함께 모입니다’처럼 오늘날 일반 독자가 이해할 수 있는 표현을 택했습니다. 제공 자료가 공용 영어 번역 증언에 근거하고 그리스어 직접 검토가 대기 중이므로, 세부 어휘와 통사 판단은 잠정적입니다.
