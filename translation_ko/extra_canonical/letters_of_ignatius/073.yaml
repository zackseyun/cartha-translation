    rationale: 여기서 ‘singular’는 배타적으로 유일하다는 주장이라기보다 특별하고 두드러진 탁월성을 나타냅니다. ‘특별한 탁월함을 지닙니다’가 비교의 뉘앙스를 보존합니다.
