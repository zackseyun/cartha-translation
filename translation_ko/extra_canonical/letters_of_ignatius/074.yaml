revisions:
- from: '여러분의 기도와 그리스도 예수 안에서 품은 따뜻한 연민에 응답하여, 시리아의 안티오키아에 있는 교회가 평안을 누리게 되었다는 소식이 제게 전해졌습니다. 그러므로 하나님의 교회인 여러분은 집사 한 사람을 뽑아 그곳으로 하나님의 사절로 보내는 것이 마땅합니다. 그는 그들이 함께 모였을 때 그들을 축하하고 그 이름을 찬양하게 될 것입니다.[a]


    이러한 섬김을 감당할 자격이 있다고 인정받는 사람은 예수 그리스도 안에서 복이 있으며, 여러분 자신도 영광을 받을 것입니다. 여러분이 원하기만 한다면 하나님의 이름을 위하여 이 일을 하는 것은 불가능하지 않습니다. 가까이 있는 교회들은 감독들을 보냈고, 다른 교회들은 장로들과 집사들을 보냈습니다.[b]'
  to: '여러분의 기도와 여러분이 그리스도 예수 안에서 품고 있는 깊은 긍휼에 따라, 시리아의 안티오키아에 있는 교회가 평안을 누리고 있다는 소식이 제게 전해졌습니다. 그러므로 하나님의 교회로서 여러분은 집사 한 사람을 세워 그곳에 하나님의 사절로 가게 하는 것이 마땅합니다. 그가 그들이 함께 모일 때 그들과 함께 기뻐하고 그 이름을 영화롭게 하도록 말입니다.[a]



    이러한 섬김에 합당하다고 여김을 받을 사람은 예수 그리스도 안에서 복이 있으며, 여러분 자신도 영광을 받을 것입니다. 여러분이 원한다면, 하나님의 이름을 위하여 이 일을 하는 것은 불가능하지 않습니다. 가까이 있는 교회들은 감독들을 보냈고, 다른 교회들은 장로들과 집사들을 보냈습니다.[b]'
  rationale: 원문의 문법적 관계와 목적 표현을 더 분명히 하고, ‘함께 기뻐하다’와 ‘영화롭게 하다’라는 핵심 동사의 의미를 반영했습니다. 직무 용어와 ‘그 이름’의 의도적 비특정성은 유지했으며, 불확정적인 역사 배경이나 교파적 해석은 덧붙이지 않았습니다.
