    Blessed in Jesus Christ is he that shall be counted worthy of such a ministration; and ye yourselves shall be glorified. Now if ye desire it, it is not impossible for you to do this for the name of God; even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: ko
  text: '여러분의 기도와 여러분이 그리스도 예수 안에서 품고 있는 깊은 긍휼에 따라, 시리아의 안티오키아에 있는 교회가 평안을 누리고 있다는 소식이 제게 전해졌습니다. 그러므로 하나님의 교회로서 여러분은 집사 한 사람을 세워 그곳에 하나님의 사절로 가게 하는 것이 마땅합니다. 그가 그들이 함께 모일 때 그들과 함께 기뻐하고 그 이름을 영화롭게 하도록 말입니다.[a]



    이러한 섬김에 합당하다고 여김을 받을 사람은 예수 그리스도 안에서 복이 있으며, 여러분 자신도 영광을 받을 것입니다. 여러분이 원한다면, 하나님의 이름을 위하여 이 일을 하는 것은 불가능하지 않습니다. 가까이 있는 교회들은 감독들을 보냈고, 다른 교회들은 장로들과 집사들을 보냈습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 이름’은 원문이 사용한 경외의 표현입니다. 이 문맥에서 지시 대상을 하나님 또는 그리스도 가운데 하나로 단정하지 않고 본문의 표현을 유지했습니다.
    reason: ‘이름’의 지시 대상에 관한 해석상의 여지를 보존하면서, 독자가 완곡한 표현임을 알 수 있게 합니다.
  - marker: b
    text: 여기서 ‘감독’, ‘장로’, ‘집사’는 초기 교회의 직무 명칭입니다. 이를 후대 어느 한 교파의 직제와 곧바로 동일시해서는 안 됩니다.
    reason: 역사적 직무 용어에 현대 교파의 고유한 의미가 과도하게 투영되는 것을 막기 위해 설명합니다.
lexical_decisions:
- source_word: tender sympathy
  choice: 따뜻한 연민
  rationale: 그리스도 안에서 다른 교회의 형편을 깊이 헤아리고 함께 아파하는 정서를 자연스러운 현대 한국어로 나타냈습니다.
- source_word: hath peace
  choice: 평안을 누리게 되었다
  rationale: 단순한 내적 평안보다는 안티오키아 교회의 분쟁이나 박해가 가라앉은 상태를 포괄하도록 표현했습니다.
- source_word: deacon
  choice: 집사
  rationale: 초기 교회의 직무 명칭을 한국어 기독교 문헌에서 널리 쓰이는 용어로 옮겼습니다.
- source_word: God's ambassador
  choice: 하나님의 사절
  rationale: 공적인 대표로 파송된다는 의미를 살리되, 후대의 특정 교회 직제 개념을 덧붙이지 않았습니다.
- source_word: the Name
  choice: 그 이름
  rationale: 하나님 또는 그리스도를 경외하여 직접 지칭하지 않는 초기 그리스도교적 표현의 여지를 보존했습니다.
- source_word: ministration
  choice: 섬김
  rationale: 직무와 봉사의 의미를 함께 지니면서도 현대 독자가 쉽게 이해하도록 옮겼습니다.
- source_word: bishops ... presbyters and deacons
  choice: 감독들…장로들과 집사들
  rationale: 초기 교회 직무들의 구별을 유지하는 통상적 한국어 명칭을 사용했습니다.
theological_decisions:
- issue: ‘그 이름’의 지시 대상
  choice: 본문에서 ‘그 이름’으로 유지
  alternative: ‘하나님의 이름’ 또는 ‘예수 그리스도의 이름’으로 명시
  rationale: 영어 증언이 보존한 완곡하고 신학적으로 함축적인 표현을 특정 대상으로 단정하지 않았습니다.
- issue: 안티오키아 교회가 얻은 ‘평안’의 성격
  choice: ‘평안을 누리게 되었다’로 포괄적으로 번역
  alternative: ‘박해가 그쳤다’ 또는 ‘분쟁이 해결되었다’
  rationale: 제공된 증언만으로는 평안의 구체적 원인을 확정할 수 없으므로 역사적 상황을 본문에 삽입하지 않았습니다.
- issue: 직무 명칭의 후대 교파적 의미
  choice: 감독·장로·집사로 직역하되 초기 교회 문맥으로 제시
  alternative: 주교·사제·부제 또는 감독자·원로·봉사자
  rationale: 원문의 구별을 보존하면서 특정 현대 교단의 직제와 동일시하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 초기 교회 서신의 권면답고 품위 있는 어조를 유지했습니다. 다만 직접적인 그리스어 대조가 아직 이루어지지 않았으므로, 이 초안은 제공된 공용 영어 증언을 바탕으로 한 잠정 번역입니다.
