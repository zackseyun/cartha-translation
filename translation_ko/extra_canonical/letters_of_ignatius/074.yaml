review_pass:
  verdict: revise
  source_fidelity: 초안은 문단 구성과 핵심 내용, 직무 명칭의 구별을 대체로 충실히 전달합니다. 다만 ‘기도와 … 연민에 응답하여’는 원문의 근거·상응 관계를 다소 부자연스럽게 만들며, συγχαρῆναι는 단순히 상대를 ‘축하하다’보다 그들과 ‘함께 기뻐하다’에 가깝습니다. 또한 ‘그 이름을 찬양하다’보다 ‘그 이름을 영화롭게 하다/영광을 돌리다’가 δοξάσαι를 더 정확히 반영합니다.
  naturalness: 현대 합쇼체는 전반적으로 안정적입니다. 그러나 ‘집사 한 사람을 뽑아 … 보내는’은 원문의 ‘집사를 세워 … 가게 하다’라는 파송 목적을 약간 재구성하며, 뒤의 ‘그는 … 하게 될 것입니다’는 목적 표현을 단순 미래 서술로 바꿉니다. 이를 목적절로 고치면 더 자연스럽고 정확합니다.
  terminology: ‘집사’, ‘감독’, ‘장로’는 초기 교회 직무의 구별을 보존하는 적절한 용어입니다. ‘따뜻한 연민’은 가능하나, 원문의 내장·심장이라는 비유적 표현이 가리키는 깊은 애정과 긍휼을 ‘깊은 긍휼’로 옮기는 편이 문맥에 더 적절합니다. ‘그 이름’은 본문에서 그대로 유지해야 합니다.
  issues:
  - severity: medium
    issue: ‘기도와 … 연민에 응답하여’
    rationale: κατὰ는 여기서 소식이 전해진 사정의 근거 또는 그들의 기도와 그리스도 안의 깊은 마음에 상응하는 결과를 나타냅니다. 한국어 ‘응답하여’는 기도와 연민 모두가 답변을 받았다는 구조를 만들 수 있어 ‘따라/말미암아’가 더 안전합니다.
  - severity: medium
    issue: ‘그들을 축하하고’
    rationale: συγχαρῆναι는 ‘함께 기뻐하다’라는 뜻입니다. 안티오키아 교회의 평안을 기뻐하는 맥락에서는 일방적으로 축하하는 것보다 함께 기뻐한다고 번역하는 편이 정확합니다.
  - severity: medium
    issue: ‘그 이름을 찬양하게 될 것입니다’
    rationale: δοξάσαι는 ‘영화롭게 하다, 영광을 돌리다’입니다. 또한 문맥상 집사를 세우는 목적을 나타내므로 미래 진술보다 ‘하도록’으로 옮겨야 합니다.
  - severity: low
    issue: ‘뽑아 … 보내는’
    rationale: χειροτονῆσαι διάκονον과 뒤따르는 목적구는 집사를 세워 파송하는 행위를 말합니다. ‘집사를 세워 … 가게 하는’은 선택 절차를 불필요하게 특정하지 않고 원문의 구조를 잘 살립니다.
