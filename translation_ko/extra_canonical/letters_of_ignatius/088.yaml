  english_witness: 'The love of the brethren which are in Troas saluteth you; from whence also I write to you by the hand of Burrhus, whom ye sent with me jointly with the Ephesians your brethren. He hath refreshed me in all ways. And I would that all imitated him, for he is an ensample of the ministry of God. The Divine grace shall requite him in all things.


    I salute your godly bishop and your venerable presbytery [and] my fellow-servants the deacons, and all of you severally and in a body, in the name of Jesus Christ, and in His flesh and blood, in His passion and resurrection, which was both carnal and spiritual, in the unity of God and of yourselves. Grace to you, mercy, peace, patience, always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: ko
  text: '트로아스에 있는 형제자매들의 사랑이 여러분에게 문안합니다. 나는 그곳에서 부로의 손을 빌려 여러분에게 이 편지를 씁니다. 부로는 여러분이 에베소의 형제자매들과 함께 나의 동행으로 보내 준 사람입니다. 그는 모든 면에서 나에게 새 힘을 주었습니다. 나는 모든 사람이 그를 본받기를 바랍니다. 그는 하나님을 섬기는 일의 본이기 때문입니다. 하나님의 은혜가 모든 일에서 그에게 갚아 주실 것입니다.


    나는 여러분의 경건한 감독과 존경받는 장로회와[a] 나의 동료 종인 집사들에게 문안하며, 또한 여러분 모두에게 한 사람 한 사람, 또 공동체 전체로서 문안합니다. 예수 그리스도의 이름 안에서, 그분의 살과 피 안에서, 육적이면서 영적인 그분의 고난과 부활 안에서, 그리고 하나님과 여러분 자신의 연합 안에서 문안합니다. 은혜와 자비와 평화와 인내가 언제나 여러분에게 있기를 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 문장의 이 자리에는 연결어 ‘그리고’가 보충된 것으로 표시되어 있습니다.
    reason: 제공된 영어 증거의 대괄호 [and]가 나타내는 본문 복원 신호를 보존하기 위해서입니다.
lexical_decisions:
- source_word: 'ἡ ἀγάπη τῶν ἀδελφῶν (English witness: “The love of the brethren”)'
  choice: 형제자매들의 사랑
  rationale: ἀδελφοί 계열의 공동체적 포괄성을 현대 한국어로 자연스럽게 드러내되, 문안의 주체가 ‘사랑’이라는 독특한 표현을 보존했습니다.
- source_word: 'διὰ Βούρρου / English witness: “by the hand of Burrhus”'
  choice: 부로의 손을 빌려
  rationale: 편지를 전달하거나 기록하는 매개를 나타내는 관용적 표현을 살리면서 현대 독자가 이해할 수 있게 옮겼습니다.
- source_word: 'πρεσβυτέριον / English witness: “presbytery”'
  choice: 장로회
  rationale: 개별 장로가 아니라 장로들의 집단 또는 회의를 가리키는 뜻을 반영했습니다.
- source_word: 'διάκονοι / English witness: “deacons”'
  choice: 집사들
  rationale: 초기 교회의 직무 명칭을 한국어 성서·교회사 문맥에서 널리 이해되는 말로 옮겼습니다.
- source_word: σαρκικός / πνευματικός (as reflected in the witness)
  choice: 육적이면서 영적인
  rationale: 고난과 부활을 함께 수식하는 원문의 신학적 긴장과 병치를 해소하지 않고 유지했습니다.
- source_word: 'ἕνωσις / English witness: “unity”'
  choice: 연합
  rationale: 하나님 및 공동체와의 결속을 가리키는 표현으로, 추상적인 ‘일치’보다 관계적 의미를 드러냅니다.
theological_decisions:
- issue: 그리스도의 고난과 부활이 ‘육적이며 영적’이라는 병렬 표현
  choice: ‘육적이면서 영적인 그분의 고난과 부활’로 두 사건 모두를 수식하도록 보존
  alternative: ‘육체의 고난과 영적인 부활’로 각각 나누어 연결
  rationale: 제공된 증거는 두 형용사가 고난과 부활을 함께 규정하는 문법적·신학적 긴장을 담고 있으므로, 특정 교리적 해석으로 분배하지 않았습니다.
- issue: ‘하나님과 여러분 자신의 연합’의 관계
  choice: 두 연합 대상을 병렬로 유지
  alternative: ‘하나님 안에서 여러분이 서로 하나 됨’으로 해석
  rationale: 하나님과의 연합인지, 공동체 상호 간의 연합인지, 혹은 둘 다인지 생길 수 있는 의미의 폭을 좁히지 않았습니다.
- issue: ‘하나님의 사역/섬김’의 의미
  choice: ‘하나님을 섬기는 일’
  alternative: ‘하나님의 직무’ 또는 ‘하나님께서 맡기신 사역’
  rationale: 소유격의 방향을 과도하게 교리화하지 않으면서 문맥상 부로의 봉사를 자연스럽게 나타냈습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 교회의 직무 명칭은 ‘감독, 장로회, 집사’로 통일했고, 문체는 서신의 존엄성과 따뜻한 공동체적 어조를 함께 살렸습니다. 제공 자료가 그리스어 직접 대조 전 단계임을 고려하여, 영어 공공영역 증거에 나타난 모호성과 복원 표시를 보존했습니다.
