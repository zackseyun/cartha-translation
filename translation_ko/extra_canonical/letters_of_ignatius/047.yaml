base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: ko
  text: '여러분 가운데 그런 일이 있다는 것을 내가 알았기 때문은 아닙니다. 오히려 나는 사랑하는 여러분을 위하여 일찍부터 깨어 살피고 있습니다. 내가 마귀의 올무를 미리 내다보기 때문입니다. 그러므로 여러분은 온유함으로 무장하고, 주님의 살인 믿음 안에서, 또 예수 그리스도의 피인 사랑 안에서 자신을 새롭게 하십시오.[a]


    여러분 가운데 아무도 자기 이웃에게 원한을 품지 마십시오. 몇몇 어리석은 사람들 때문에 경건한 무리가 모독을 받지 않도록 이방인들에게 빌미를 주지 마십시오. 기록된 바, “몇몇 사람 앞에서 내 이름이 헛되이 모독받게 하는 그 사람에게 화가 있습니다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 살인 믿음’과 ‘예수 그리스도의 피인 사랑’은 공급된 고대 번역 증언의 직접적인 은유를 보존한 표현입니다. 이를 특정한 성례전 해석으로 한정하지 않았습니다.
    reason: 현대 독자가 이례적인 동일시를 오역으로 여기거나, 반대로 특정 교리로 성급히 확정하지 않도록 하기 위해서입니다.
  - marker: b
    text: 이 경고는 성경적 표현들을 결합하거나 변형하여 인용한 것으로 보입니다. 공급된 영어 증언의 ‘몇몇 사람 앞에서’와 ‘헛되이’를 보존했으나, 그리스어 본문과 인용 출처에 대한 직접 검토가 필요합니다.
    reason: 인용 문구의 형태와 출처가 불확실하다는 문헌적 상황을 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: keep watch over you betimes
  choice: 여러분을 위하여 일찍부터 깨어 살피고 있습니다
  rationale: 직접 그리스어 검토가 보류된 상태에서 영어 증언의 ‘betimes’가 지닌 선제적·시의적절한 돌봄의 뜻을 살리고, 권위적으로 감시한다는 인상을 피했습니다.
- source_word: arm yourselves with gentleness
  choice: 온유함으로 무장하고
  rationale: 무장이라는 역설적 비유와 온유라는 덕목을 함께 보존했습니다.
- source_word: recover yourselves
  choice: 자신을 새롭게 하십시오
  rationale: 회복·갱신의 의미를 자연스러운 현대 한국어로 표현했습니다. 직접 그리스어 확인 전에는 더 구체적인 교리적 의미를 부여하지 않았습니다.
- source_word: faith which is the flesh of the Lord
  choice: 주님의 살인 믿음
  rationale: 믿음과 주님의 살을 동일시하는 원문의 대담한 은유를 완화하거나 설명적으로 바꾸지 않았습니다.
- source_word: love which is the blood of Jesus Christ
  choice: 예수 그리스도의 피인 사랑
  rationale: 사랑과 그리스도의 피를 연결하는 평행적 은유를 그대로 유지했습니다.
- source_word: bear a grudge
  choice: 원한을 품다
  rationale: 이웃에 대한 지속적인 악감정이라는 뜻을 현대 표준어로 명료하게 전달합니다.
- source_word: Gentiles
  choice: 이방인들
  rationale: 초기 그리스도교 문맥에서 공동체 밖의 비그리스도인을 가리키는 전통적이면서도 이해 가능한 표현을 택했습니다.
- source_word: the godly multitude
  choice: 경건한 무리
  rationale: 공동체 다수를 뜻하는 표현을 보존하되, 특정 교단적 정체성을 덧붙이지 않았습니다.
- source_word: vainly blasphemed
  choice: 헛되이 모독받다
  rationale: 공급된 영어 증언의 ‘vainly’를 생략하지 않았으며, 신성모독과 일반적 비방 사이의 문맥적 긴장을 ‘모독’으로 남겼습니다.
theological_decisions:
- issue: 믿음과 주님의 살, 사랑과 예수 그리스도의 피의 관계
  choice: ‘주님의 살인 믿음’, ‘예수 그리스도의 피인 사랑’으로 직접적인 동일시를 보존했습니다.
  alternative: ‘주님의 살과 관련된 믿음’, ‘예수 그리스도의 피로 나타난 사랑’처럼 해설적으로 풀 수 있습니다.
  rationale: 공급된 증언의 문법적·신학적 긴장을 특정 성례전 교리나 순수한 상징으로 단정하지 않기 위해서입니다.
- issue: 마지막 경고문의 성경 인용 여부와 정확한 출처
  choice: 인용부호를 사용하고 ‘기록된 바’를 최소한으로 보충했습니다.
  alternative: 인용 소개 없이 ‘이는 … 때문입니다’로 이어 번역할 수 있습니다.
  rationale: 영어 증언의 ‘for Woe…’가 권위 있는 인용을 암시하지만, 문구가 단일 성경 본문과 정확히 일치하는지는 직접 그리스어 및 인용 전통 검토가 필요합니다.
- issue: ‘My name’의 화자
  choice: 인용 안에서 ‘내 이름’을 그대로 유지했습니다.
  alternative: ‘하나님의 이름’ 또는 ‘주님의 이름’으로 화자를 명시할 수 있습니다.
  rationale: 공급된 증언이 남긴 화자상의 모호성을 교리적으로 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면의 엄숙함과 초기 그리스도교 문헌의 비유를 살리면서도 과도한 고어체는 피했습니다. 현재 자료가 공용 영역 영어 증언이며 그리스어 원문 검토가 보류된 상태이므로, 번역은 잠정적이고 출처상의 불확실성을 각주에 명시했습니다.
