base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/064.yaml
  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: ko
  text: 테오포로스라고도 하는 이그나티우스는[a] 아시아의 필라델피아에 있는, 아버지 하나님과 예수 그리스도의 교회에 문안합니다. 이 교회는 자비를 입었고, 하나님께서 이루시는 일치 안에 굳게 세워졌으며, 우리 주님의 수난과 흔들림 없는 그분의 부활을 기뻐하고, 온갖 자비 가운데서 확신으로 가득 차 있습니다. 나는 예수 그리스도의 피 안에서 이 교회에 문안합니다. 이 교회는 영원하고 한결같은 기쁨입니다.[b] 특히 교회가 감독과 그와 함께 있는 장로들, 그리고 예수 그리스도의 뜻을 따라 임명된 집사들과 하나가 되어 있다면 더욱 그러합니다. 그분께서는 자신의 뜻에 따라 성령으로 그들을 굳세게 하시고 든든히 세우셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘테오포로스’는 그리스어 별칭으로, ‘하나님을 모시는 사람’ 또는 ‘하나님께서 안으신 사람’이라는 뜻으로 이해될 수 있습니다.
    reason: 별칭의 어원적 중의성을 본문에서 하나로 단정하지 않기 위해서입니다.
  - marker: b
    text: 그리스어 문법에 따르면 ‘영원하고 한결같은 기쁨’은 ‘이 교회’를 가리키는 것으로 보는 것이 자연스럽습니다. 다만 제공된 옛 영어 번역의 구두점은 이 표현이 ‘예수 그리스도의 피’를 가리키는 듯 읽힐 수 있습니다.
    reason: 그리스어 전승과 제공된 공용 영어 증언 사이에서 생기는 지시 대상의 차이를 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: 'Theophorus (Greek: Θεοφόρος)'
  choice: 테오포로스
  rationale: 고유한 별칭을 음역하여 보존했습니다. 이 말의 어원적 의미는 둘 이상의 방식으로 이해될 수 있으므로 본문에서 하나로 확정하지 않고 각주에 밝혔습니다.
- source_word: passion
  choice: 수난
  rationale: 단순한 고통이 아니라 예수의 체포와 고난과 죽음을 아우르는 초기 그리스도교 용례를 간결하고 품위 있게 전달합니다.
- source_word: concord of God
  choice: 하나님께서 이루시는 일치
  rationale: 속격의 의미를 자연스러운 한국어로 옮기되, 일치의 근원과 기준이 하나님께 있음을 드러냈습니다.
- source_word: bishop / presbyters / deacons
  choice: 감독 / 장로들 / 집사들
  rationale: 초기 교회의 직분 명칭을 한국어 그리스도교 문헌에서 널리 통용되는 말로 옮겼으며, 후대의 특정 교단 제도를 본문에 덧씌우지 않았습니다.
- source_word: eternal and abiding joy
  choice: 영원하고 한결같은 기쁨
  rationale: 시간적 지속성과 변함없는 성격을 모두 살리면서 현대 독자가 이해하기 쉬운 표현을 택했습니다.
theological_decisions:
- issue: ‘영원하고 한결같은 기쁨’이 가리키는 대상
  choice: ‘이 교회’를 가리키도록 별도 문장으로 번역
  alternative: ‘예수 그리스도의 피’를 영원하고 한결같은 기쁨이라고 번역
  rationale: 중간본 그리스어 전승의 문법상 여성형 관계대명사는 여성명사인 ‘교회’를 받는 것으로 이해하는 것이 자연스럽습니다. 제공된 영문 증언은 구두점 때문에 ‘피’를 받는 듯 보일 수 있어 그 차이를 각주에 밝혔습니다.
- issue: 마지막 절에서 굳세게 하고 세우는 주체
  choice: 앞에 나온 예수 그리스도를 받는 ‘그분’으로 유지
  alternative: 성령을 주어로 명시
  rationale: 제공된 문장의 대명사 구조를 존중하고 예수 그리스도와 성령의 관계를 임의로 재구성하지 않았습니다.
- issue: 교회의 일치와 직분자들의 관계
  choice: ‘하나가 되어 있다면’이라는 조건적 표현을 유지
  alternative: 직분자에게 복종한다고 의역
  rationale: 원문의 일치 개념을 후대의 권위·복종 언어로 확대하지 않고 신학적 긴장을 그대로 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서두의 긴 헌사 구조는 의미 관계가 흐려지지 않도록 여러 문장으로 나누었고, 초기 교회 문헌다운 장중함은 유지했습니다. 직접적인 그리스어 대조가 아직 최종 완료되지 않았다는 자료 상태를 고려하여, 논쟁 가능한 부분은 본문에서 과도하게 확정하지 않고 각주로 제시했습니다.
