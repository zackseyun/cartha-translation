  revised_footnotes:
  - marker: a
    text: ‘테오포로스’는 그리스어 별칭으로, ‘하나님을 모시는 사람’ 또는 ‘하나님께서 안으신 사람’이라는 뜻으로 이해될 수 있습니다.
    reason: 별칭의 어원적 중의성을 본문에서 하나로 단정하지 않기 위해서입니다.
  revision_rationale: The revision retains the supplied witness’s meaning and formal-polite register, while avoiding an interpretively narrowed rendering of ‘concord of God,’ clarifying the scope of ‘without wavering,’ and removing an unsupported, potentially confusing source-critical footnote. The revised text and footnote set are complete.
