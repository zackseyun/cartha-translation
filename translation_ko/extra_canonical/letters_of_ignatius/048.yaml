review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal assertions and the repeated emphasis on the reality of Christ's birth, bodily life, suffering, death, and resurrection. However, the final phrase, “in Christ Jesus,” belongs after the emphatic parenthetical repetition that the Father will raise believers; moving it earlier weakens the source's syntactic and rhetorical arrangement. “예수 그리스도와 무관한 말을” can also be read merely as speech on an unrelated topic, whereas the source concerns speech that sets Jesus Christ aside.
  naturalness: The Korean is generally fluent, clear, and consistently in modern formal-polite register. “귀를 막으십시오” is a natural contextual rendering of the imperative to be deaf, though the revised wording makes the object of resistance more direct.
  terminology: 'Key terms are suitable: “다윗의 혈통,” “본디오 빌라도,” “십자가에 못 박혀,” “땅 아래 있는 이들,” and “참된 생명.” The repeated “참으로” appropriately retains the polemical emphasis. “일으키다” consistently represents resurrection language and preserves the parallel between Christ and believers.'
  issues:
  - severity: medium
    issue: The placement of “그리스도 예수 안에서” is altered.
    rationale: The source places “in Christ Jesus” after the parenthetical insistence, “His Father, I say, will raise us.” The draft attaches it earlier to the first prediction of believers' resurrection. Restoring the sequence better preserves the original emphasis and syntax.
  - severity: low
    issue: “예수 그리스도와 무관한 말을” may understate the exclusionary force of “apart from Jesus Christ.”
    rationale: It may mean simply a topic unrelated to Jesus Christ. “예수 그리스도를 떠나 … 말하는” more clearly conveys speech that proceeds while setting Christ aside, without over-specifying the disputed nuance.
  revised_text: '그러므로 누구든지 예수 그리스도를 떠나 여러분에게 말하거든, 귀를 막으십시오. 그분은 다윗의 혈통에서 나셨고 마리아의 아들이셨습니다. 그분은 참으로 태어나셨고 먹고 마셨으며, 본디오 빌라도 치하에서 참으로 박해를 받으셨습니다. 또 하늘에 있는 이들과 땅에 있는 이들과 땅 아래 있는 이들이 보는 앞에서 참으로 십자가에 못 박혀 죽으셨습니다.


    더욱이 그분은 참으로 죽은 이들 가운데서 일으킴을 받으셨으니, 그분의 아버지께서 그분을 일으키셨습니다. 그와 같이 그분의 아버지께서는 그분을 믿는 우리도 일으키실 것입니다. 다시 말합니다. 그분의 아버지께서 우리를 그리스도 예수 안에서 일으키실 것입니다. 그리스도 예수를 떠나서는 우리에게 참된 생명이 없습니다.'
  revised_footnotes: []
  revision_rationale: The revision restores the source's final rhetorical sequence, retaining the explicit repeated identification of the Father as the one who raises believers before locating that raising “in Christ Jesus.” It also revises the opening to avoid reducing speech “apart from Jesus Christ” to merely incidental subject matter. “일으킴을 받으셨습니다” makes the passive resurrection formulation explicit and is immediately clarified by the following statement that the Father raised him.
