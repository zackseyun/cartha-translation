source:
  text: 'Be ye deaf therefore, when any man speaketh to you apart from Jesus Christ, who was of the race of David, who was the Son of Mary, who was truly born and ate and drank, was truly persecuted under Pontius Pilate, was truly crucified and died in the sight of those in heaven and those on earth and those under the earth;


    who moreover was truly raised from the dead, His Father having raised Him, who in the like fashion will so raise us also who believe on Him--His Father, I say, will raise us--in Christ Jesus, apart from whom we have not true life.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Be ye deaf therefore, when any man speaketh to you apart from Jesus Christ, who was of the race of David, who was the Son of Mary, who was truly born and ate and drank, was truly persecuted under Pontius Pilate, was truly crucified and died in the sight of those in heaven and those on earth and those under the earth;


    who moreover was truly raised from the dead, His Father having raised Him, who in the like fashion will so raise us also who believe on Him--His Father, I say, will raise us--in Christ Jesus, apart from whom we have not true life.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: ko
  text: '그러므로 누구든지 예수 그리스도와 무관한 말을 여러분에게 하거든, 귀를 막으십시오. 그분은 다윗의 혈통에서 나셨고 마리아의 아들이셨습니다. 그분은 참으로 태어나셨고 먹고 마셨으며, 본디오 빌라도 치하에서 참으로 박해를 받으셨습니다. 또 하늘에 있는 이들과 땅에 있는 이들과 땅 아래 있는 이들이 보는 앞에서 참으로 십자가에 못 박혀 죽으셨습니다.


    더욱이 그분은 참으로 죽은 이들 가운데서 살아나셨으니, 그분의 아버지께서 그분을 일으키셨습니다. 그와 같이 그분의 아버지께서는 그분을 믿는 우리도 그리스도 예수 안에서 일으키실 것입니다. 다시 말합니다. 그분의 아버지께서 우리를 일으키실 것입니다. 그리스도 예수를 떠나서는 우리에게 참된 생명이 없습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: apart from Jesus Christ
  choice: 예수 그리스도와 무관한
  rationale: 그리스도에게서 분리되거나 그리스도를 배제한 가르침이라는 뜻을 자연스럽게 전달하면서도 문맥의 배타성을 보존했습니다.
- source_word: of the race of David
  choice: 다윗의 혈통에서 나셨고
  rationale: 역사적·육체적 계보를 나타내는 표현으로 옮겨 그리스도의 실제 인간성을 강조하는 문맥을 살렸습니다.
- source_word: truly
  choice: 참으로
  rationale: 반복되는 ‘truly’를 모두 명시하여 가현설을 반박하는 원문의 수사적 강조를 보존했습니다.
- source_word: those under the earth
  choice: 땅 아래 있는 이들
  rationale: 대상의 정체를 해석적으로 한정하지 않고 고대의 삼층적 표현이 지닌 여지를 유지했습니다.
- source_word: raised
  choice: 일으키셨습니다 / 일으키실 것입니다
  rationale: 죽은 이들 가운데서의 부활과 신자들의 장래 부활에 같은 동사를 사용하여 문장의 대응 관계를 보존했습니다.
- source_word: true life
  choice: 참된 생명
  rationale: 단순한 생존이 아니라 그리스도 안에 있는 궁극적 생명을 가리키는 신학적 무게를 유지했습니다.
theological_decisions:
- issue: 그리스도의 인간적 삶과 수난의 실재성
  choice: ‘참으로’를 반복하여 탄생, 박해, 십자가 죽음, 부활의 실제성을 명시했습니다.
  alternative: 한국어의 반복을 줄여 ‘실제로’를 한두 번만 사용할 수 있습니다.
  rationale: 이 단락은 그리스도의 몸과 고난이 겉모습뿐이었다는 견해에 맞서 각 사건의 실재성을 반복적으로 강조하므로 반복 자체가 핵심입니다.
- issue: 아버지가 그리스도와 신자들을 일으키신다는 진술
  choice: 부활의 행위자를 모두 ‘그분의 아버지’로 유지하고, 신자들의 부활은 ‘그리스도 예수 안에서’ 일어난다고 옮겼습니다.
  alternative: 문장을 매끄럽게 하려고 반복된 ‘그분의 아버지’를 생략할 수 있습니다.
  rationale: 원문의 의도적인 반복과 그리스도의 부활 및 신자들의 부활 사이의 평행을 보존했습니다.
- issue: ‘그리스도를 떠나서는’의 배타적 생명 진술
  choice: ‘그리스도 예수를 떠나서는 우리에게 참된 생명이 없습니다’로 옮겼습니다.
  alternative: ‘그리스도 예수 없이는’으로 더 간결하게 옮길 수 있습니다.
  rationale: 공간적 분리와 관계적 단절을 함께 암시하는 표현을 유지하되 특정 교파적 구원 체계를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 교부 문헌의 엄숙함을 유지하되 지나치게 고어적인 어순은 피했습니다. 제공 자료가 중간본 그리스어 전통을 지목하지만 직접적인 그리스어 본문 검토는 아직 이루어지지 않았으므로, 이번 초안은 명시된 공용 영어 증언과 영어 POB를 대조해 작성한 잠정 번역입니다.
