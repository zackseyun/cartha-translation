base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: ko
  text: '그러므로 진리의 [빛의] 자녀로서 분열과 그릇된 가르침을 피하십시오. 목자가 있는 곳에서는 양들처럼 그를 따르십시오.


    그럴듯해 보이는 많은 이리들이 해로운 쾌락으로 하나님의 경주를 달리는 이들을 사로잡기 때문입니다. 그러나 여러분이 하나로 연합해 있으면, 그들은 발붙일 곳을 찾지 못할 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: 진리의 [빛의] 자녀
  rationale: 대괄호로 표시된 ‘of the light’를 그대로 보존하면서, ‘진리의’가 수식하는 관계를 성급히 해소하지 않았습니다.
- source_word: shun division and wrong doctrines
  choice: 분열과 그릇된 가르침을 피하십시오
  rationale: 공동체의 분열과 교리적 오류를 나란히 경계하는 뜻을 현대 한국어로 명료하게 옮겼습니다.
- source_word: specious wolves
  choice: 그럴듯해 보이는 많은 이리들
  rationale: 겉으로는 설득력 있고 매력적으로 보이지만 실상은 위험하다는 의미를 드러냈습니다.
- source_word: baneful delights
  choice: 해로운 쾌락
  rationale: 즐거움을 주지만 파괴적인 결과를 낳는다는 긴장을 간결하게 보존했습니다.
- source_word: the runners in God's race
  choice: 하나님의 경주를 달리는 이들
  rationale: 신앙생활을 경주에 비유하는 원문의 이미지를 유지했습니다.
- source_word: where ye are at one
  choice: 여러분이 하나로 연합해 있는 곳
  rationale: 단순한 공간적 동거가 아니라 공동체적 일치와 연합을 나타내도록 옮겼습니다.
theological_decisions:
- issue: ‘목자’의 구체적 지시 대상
  choice: 목자가 있는 곳에서는 양들처럼 그를 따르십시오
  alternative: 감독이 있는 곳에서는 그를 따르십시오
  rationale: 제공된 증거가 ‘shepherd’라는 은유를 사용하므로, 이를 특정 교회 직분으로 단정하지 않고 목자와 양의 이미지를 보존했습니다.
- issue: ‘진리의 [빛의] 자녀’의 문법적 관계
  choice: 진리의 [빛의] 자녀
  alternative: 빛과 진리의 자녀
  rationale: 대괄호로 전승상의 불확실성이 표시되어 있으므로 이를 유지하고, ‘빛’과 ‘진리’의 관계를 임의로 병렬화하지 않았습니다.
- issue: 일치가 거짓 교사들의 활동을 막는다는 표현
  choice: 그들이 발붙일 곳을 찾지 못할 것입니다
  alternative: 그들이 들어올 자리가 없을 것입니다
  rationale: 공동체의 연합이 위험한 자들의 영향력이 자리 잡지 못하게 한다는 의미를 자연스럽게 전달하되, 절대적 무오류나 구원론적 주장을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 권면의 엄숙함과 목자·양, 이리, 경주라는 비유를 보존했습니다. 다만 직접적인 그리스어 검토가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언과 영어 POB를 바탕으로 한 잠정 초안입니다.
