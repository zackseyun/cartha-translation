source:
  text: 'Forasmuch as in answer to my prayer to God it hath been granted me to see your godly countenances, so that I have obtained even more than I asked; for wearing bonds in Christ Jesus I hope to salute you, if it be the Divine will that I should be counted worthy to reach unto the end;


    for the beginning verily is well ordered, if so be I shall attain unto the goal, that I may receive mine inheritance without hindrance. For I dread your very love, lest it do me an injury; for it is easy for you to do what ye will, but for me it is difficult to attain unto God, unless ye shall spare me.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Forasmuch as in answer to my prayer to God it hath been granted me to see your godly countenances, so that I have obtained even more than I asked; for wearing bonds in Christ Jesus I hope to salute you, if it be the Divine will that I should be counted worthy to reach unto the end;


    for the beginning verily is well ordered, if so be I shall attain unto the goal, that I may receive mine inheritance without hindrance. For I dread your very love, lest it do me an injury; for it is easy for you to do what ye will, but for me it is difficult to attain unto God, unless ye shall spare me.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: ko
  text: '하나님께 드린 제 기도에 응답하여, 하나님께 합당한 여러분의 모습을 뵙도록 제게 허락되었으므로, 저는 제가 청한 것보다 더 많은 것을 얻었습니다. 저는 그리스도 예수 안에서 사슬에 매인 채 여러분에게 문안할 수 있기를 바랍니다. 제가 끝에 이르기에 합당한 사람으로 여겨지는 것이 하나님의 뜻이라면 말입니다.


    출발은 잘 마련되어 있습니다. 제가 목표에 이르러 아무 방해 없이 제 상속분을 받을 수만 있다면 말입니다. 저는 여러분의 사랑 자체가 혹시 제게 해가 될까 두렵습니다. 여러분은 원하시는 일을 쉽게 하실 수 있지만, 여러분이 저를 그냥 두어 주지 않으시면 제가 하나님께 이르기는 어렵기 때문입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여러분이 나를 아껴 주지 않으시면’입니다. 여기서 ‘아껴 주다’는 문맥상 수신자들이 저자를 구하거나 그의 길에 개입하지 말고 그대로 두라는 요청을 가리키는 것으로 이해될 수 있습니다.
    reason: ‘spare me’의 문자적 표현과, 문맥에서 요청하는 바를 함께 밝혀 역설적인 표현을 자연스럽게 이해하도록 돕습니다.
lexical_decisions:
- source_word: godly countenances
  choice: 경건한 얼굴
  rationale: 제공된 영어 증언의 표현을 자연스러운 현대 한국어로 옮기되, 수신자들의 신앙적 성품을 가리키는 뜻을 보존했습니다.
- source_word: wearing bonds in Christ Jesus
  choice: 그리스도 예수 안에서 사슬에 매인 채
  rationale: 실제 투옥 상태와 그리스도와의 연대를 함께 드러내도록 ‘안에서’를 유지했습니다.
- source_word: reach unto the end / attain unto the goal
  choice: 끝까지 이르다 / 목표에 이르다
  rationale: 첫 표현의 종말론적·순교적 여운과 둘째 표현의 경주 비유를 구별해 살렸습니다.
- source_word: receive mine inheritance
  choice: 제 몫의 유산을 받다
  rationale: 상속·분깃의 의미를 보존하면서도 한국어에서 자연스럽게 이해되도록 했습니다.
- source_word: unless ye shall spare me
  choice: 여러분이 저를 그대로 내버려 두지 않으시면
  rationale: 문맥상 로마 신자들이 구명 활동으로 그의 순교를 막지 말라는 요청으로 읽히지만, 구체적 행동을 본문에 덧붙이지 않고 ‘개입하지 않다’는 뜻만 표현했습니다.
theological_decisions:
- issue: ‘하나님께 이르다’의 의미
  choice: 표현을 그대로 보존
  alternative: 순교하여 하나님과 함께하게 되다
  rationale: 문맥에는 순교의 뜻이 강하지만, 본문이 지닌 신학적 긴장과 함축을 해설적으로 확정하지 않았습니다.
- issue: ‘끝’과 ‘목표’의 관계
  choice: 서로 다른 표현으로 번역
  alternative: 둘 다 ‘끝까지 이르다’로 통일
  rationale: 목적지와 경주 목표라는 겹치는 이미지를 평면화하지 않기 위해 구별했습니다.
- issue: 수신자들의 사랑이 해가 될 가능성
  choice: 역설을 그대로 유지
  alternative: 구명하려는 사랑이 순교를 방해한다고 명시
  rationale: 사랑 자체가 해가 될 수 있다는 원문의 긴장을 보존하고, 배경 설명은 각주에 두었습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고어적 영어 어순은 피하면서도 서신의 장중함과 순교를 앞둔 긴박함을 유지했습니다. 제공 자료에 명시된 대로 그리스어 직접 검토가 아직 남아 있으므로, 특히 ‘godly countenances’, ‘inheritance’, ‘spare me’에 해당하는 어휘는 잠정적입니다.
