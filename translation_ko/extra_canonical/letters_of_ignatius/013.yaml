    Ye are the high-road of those that are on their way to die unto God. Ye are associates in the mysteries with Paul, who was sanctified, who obtained a good report, who is worthy of all felicitation; in whose foot-steps I would fain be found treading, when I shall attain unto God; who in every letter maketh mention of you in Christ Jesus.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: ko
  text: '나는 내가 누구이며 누구에게 글을 쓰는지 압니다. 나는 유죄 판결을 받은 사람이고, 여러분은 자비를 입은 사람들입니다. 나는 위험에 처해 있고, 여러분은 굳게 세워져 있습니다.


    여러분은 하나님을 위하여 죽임을 당하러 가는 이들이 지나간 큰길입니다.[a] 여러분은 거룩하게 되고 좋은 증언을 받았으며 온갖 축하를 받아 마땅한 바울과 함께 신비에 참여한 사람들입니다.[b] 내가 하나님께 이르게 될 때, 그의 발자취를 따르는 사람으로 발견되기를 바랍니다. 그는 편지마다 그리스도 예수 안에서 여러분을 언급합니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님을 위하여’는 ‘하나님께로’라고 옮길 수도 있습니다. ‘죽임을 당하러 가는 이들’은 처형과 순교를 향해 이동하던 사람들을 가리킵니다.
    reason: 전치사구의 목적성과 방향성 사이의 진정한 모호성을 보존하고 역사적 문맥을 설명합니다.
  - marker: b
    text: ‘신비에 참여한 사람들’은 직역하면 ‘함께 비의에 든 사람들’입니다. 바울과 깊은 영적 신비를 공유한다는 뜻으로 이해할 수 있습니다.
    reason: συμμύσται의 고대 입문 용어적 배경을 알리되 특정 성례전 해석을 확정하지 않습니다.
  - marker: c
    text: ‘편지마다’는 ‘모든 편지에서’라고도 옮길 수 있습니다.
    reason: ἐν πάσῃ ἐπιστολῇ의 분배적 표현을 투명하게 제시합니다.
lexical_decisions:
- source_word: κατάκριτος
  choice: 유죄 판결을 받은 사람
  rationale: 단순히 수감된 상태보다 유죄 선고 아래 있다는 뜻을 살리되, 문맥상 화자가 죄수임을 자연스럽게 드러냅니다.
- source_word: ἠλεημένοι
  choice: 자비를 입은 사람들
  rationale: 완료 수동의 의미를 반영하여 이미 자비를 받은 상태를 나타냅니다.
- source_word: ἐστηριγμένοι
  choice: 굳게 세워져 있습니다
  rationale: 확고하게 된 지속 상태를 나타내는 완료 수동의 뉘앙스를 보존합니다.
- source_word: πάροδος
  choice: 지나간 큰길
  rationale: 에베소인들이 순교를 향해 이동하던 이들의 통행로였다는 공간적 비유를 자연스럽게 전달합니다.
- source_word: εἰς θεὸν ἀναιρουμένων
  choice: 하나님을 위하여 죽임을 당하러 가는 이들
  rationale: ἀναιρέω의 피살·처형 의미와 εἰς θεόν의 방향성 또는 목적성을 함께 살리며, 이를 단순히 ‘하나님 안에서 죽다’로 평면화하지 않습니다.
- source_word: συμμύσται
  choice: 함께 신비에 참여한 사람들
  rationale: 고대의 비의 입문 어휘를 그대로 종교의식 전문어로 옮기기보다, 바울과 영적 신비를 공유한다는 의미를 이해하기 쉽게 나타냅니다.
- source_word: ἀξιομακαρίστου
  choice: 온갖 축하를 받아 마땅한
  rationale: 칭송하고 복되다 일컬을 만하다는 강한 찬사의 뜻을 문맥에 맞게 표현합니다.
- source_word: θεοῦ ἐπιτύχω
  choice: 하나님께 이르게 될 때
  rationale: 이그나티우스 문헌에서 순교를 통하여 하나님께 도달한다는 반복적 표현을 보존하되, 그 과정을 교리적으로 더 구체화하지 않습니다.
theological_decisions:
- issue: εἰς θεόν의 의미
  choice: 하나님을 위하여
  alternative: 하나님께로 / 하나님 안에서
  rationale: 표현에는 목적과 방향의 긴장이 있으므로 본문에서는 순교의 헌신적 목적을 살리고, 각주에서 방향성의 가능성을 밝혔습니다.
- issue: συμμύσται의 신비 언어
  choice: 바울과 함께 신비에 참여한 사람들
  alternative: 바울과 함께 비의에 입문한 사람들
  rationale: 원문의 신비 종교적 어감을 완전히 지우지 않으면서도, 특정한 후대 성례전 교리를 본문에 주입하지 않습니다.
- issue: 하나님께 이른다는 표현
  choice: 원문의 종말론적·순교적 표현을 그대로 유지
  alternative: 구원을 얻다 / 천국에 들어가다
  rationale: 이그나티우스가 의도한 표현보다 더 구체적인 구원론적 해석을 덧붙이지 않습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 첫 문단의 대조적 병렬 구조를 유지했고, 둘째 문단은 긴 원문 문장을 독자가 따라가기 쉽도록 여러 문장으로 나누었습니다. 제공 자료는 그리스어 직접 검토가 미완료라고 명시하므로, 중간 교정본 전승에서 알려진 그리스어 어휘와 공개 영역 영어 증언을 함께 대조한 잠정 출판 초안입니다.
