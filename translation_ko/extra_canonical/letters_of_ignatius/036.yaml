  english_witness: 'Do your diligence therefore that ye be confirmed in the ordinances of the Lord and of the Apostles, that ye may prosper in all things whatsoever ye do in flesh and spirit, by faith and by love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, and with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, as Jesus Christ was to the Father [according to the flesh], and as the Apostles were to Christ and to the Father, that there may be union both of flesh and of spirit.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: ko
  text: '그러므로 주님과 사도들의 규례 안에 굳게 서도록 온 힘을 다하십시오. 그러면 여러분이 육과 영으로, 믿음과 사랑으로, 아들과 아버지와 성령 안에서, 처음과 끝에, 존경받는 감독과 더불어, 잘 엮인 영적 화관과 같은 장로단과 더불어, 또 하나님을 따라 살아가는 집사들과 더불어, 무슨 일을 하든지 모든 일에서 형통할 것입니다.


    감독에게 순종하고 서로에게도 순종하십시오. 예수 그리스도께서 아버지께 [육신을 따라][a] 순종하셨고, 사도들이 그리스도와 아버지께 순종했던 것과 같이 하십시오. 그리하여 육과 영이 하나 되게 하십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘육신을 따라’는 제공된 영문 증언에서 대괄호로 표시되어 있습니다. 그리스어 사본 전통에 대한 직접 검토가 아직 이루어지지 않았으므로 그 표지를 보존했습니다.
    reason: 본문의 대괄호가 나타내는 문헌적 불확실성을 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: ordinances
  choice: 규례
  rationale: 주님과 사도들이 정한 가르침과 질서를 함께 포괄하면서도 현대 독자가 이해할 수 있는 격조 있는 표현입니다.
- source_word: prosper
  choice: 형통하다
  rationale: 단순한 물질적 번영으로 제한하지 않고, 행하는 일이 잘 이루어진다는 폭넓은 뜻을 보존합니다.
- source_word: presbytery
  choice: 장로단
  rationale: 개별 장로가 아니라 장로들로 이루어진 공동체적 회의체를 가리키는 의미를 살렸습니다.
- source_word: fitly wreathed spiritual circlet
  choice: 잘 엮인 영적 화관
  rationale: 장로단의 조화로운 결속을 화관에 비유한 원문의 독특한 이미지를 평면화하지 않고 보존했습니다.
- source_word: walk after God
  choice: 하나님을 따라 살아가다
  rationale: ‘걷다’라는 관용적 은유의 윤리적 의미를 자연스러운 현대 한국어로 전달합니다.
- source_word: union
  choice: 하나 됨
  rationale: 조직적 일치뿐 아니라 육과 영의 통합을 나타내는 문맥에 맞으며, 지나치게 교리적으로 한정하지 않습니다.
theological_decisions:
- issue: 예수 그리스도의 아버지께 대한 순종과 ‘육신을 따라’의 관계
  choice: ‘[육신을 따라]’를 대괄호 안에 그대로 보존
  alternative: 대괄호 없이 본문에 통합하거나 생략
  rationale: 제공된 증거가 이를 본문상의 신호로 제시하므로, 그리스도론적 함의를 임의로 확정하지 않고 불확실성을 드러냈습니다.
- issue: ‘in the Son and Father and in the Spirit’의 삼위 언어
  choice: ‘아들과 아버지와 성령 안에서’로 어순과 전치사적 관계를 보존
  alternative: ‘성부와 성자와 성령 안에서’
  rationale: 본문의 이례적인 순서와 관계 표현을 교리적으로 익숙한 정형문으로 바꾸지 않았습니다.
- issue: 감독과 상호 순종의 병렬 관계
  choice: ‘감독에게 순종하고 서로에게도 순종하십시오’
  alternative: 상호 순종을 감독 권위 아래의 순종으로 종속시킴
  rationale: 두 명령의 병렬성을 유지하여 교회 직분에 관한 특정 교파적 해석을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용했으며, 초기 교회의 직분 명칭은 ‘감독·장로단·집사’로 일관되게 옮겼습니다. 문장은 공적 낭독에 적합하도록 격조를 유지하되 지나치게 고어적인 표현은 피했습니다. 이 초안은 제공된 공용 영문 증언과 영어 POB를 바탕으로 한 잠정 번역이며, 중간본 그리스어 전통에 대한 직접 원문 검토가 필요합니다.
