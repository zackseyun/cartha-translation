base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: ko
  text: '저는 여러분에게, 그리고 여러분이 하나님의 영예를 위하여 스미르나로 보낸 이들에게 헌신합니다. 저는 그곳에서 주님께 감사드리며 여러분에게 이 글을 씁니다. 또한 여러분을 사랑하듯 폴리카르포스를 사랑합니다. 저를 기억해 주십시오. 저도 예수 그리스도께서 여러분을 기억해 주시기를 바랍니다.


    시리아에 있는 교회를 위하여 기도해 주십시오. 저는 그곳에서 죄수로 로마까지 끌려가고 있습니다. 저는 그곳 신자들 가운데 가장 보잘것없는 사람이지만, 하나님의 영예를 위한 사람으로 드러날 자격이 있다고 여김받았습니다.[a] 우리의 공통된 소망이신 하나님 아버지와 예수 그리스도 안에서 평안히 지내십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자격이 있다고 여김받았습니다’는 자신에게 본래 자격이 있었다는 뜻이라기보다, 그러한 영예를 받기에 합당한 사람으로 인정되었다는 수동적 표현입니다. 이 구절의 그리스어 직접 대조는 아직 필요합니다.
    reason: ‘counted worthy’가 공로 주장으로 오해되지 않도록 수동적 의미를 밝히고, 현재 초안의 자료적 한계를 투명하게 표시합니다.
lexical_decisions:
- source_word: I am devoted to you
  choice: 저는 여러분에게 … 헌신합니다
  rationale: 제공된 영어 증언의 의미를 직접적이고 품위 있는 현대 한국어로 옮겼습니다. 배후 그리스어의 관용적 뉘앙스는 직접 대조가 끝나지 않았으므로 ‘목숨을 대신 내놓다’와 같은 더 강한 표현을 본문에 확정하지 않았습니다.
- source_word: for the honor of God
  choice: 하나님의 영예를 위하여
  rationale: ‘honor’를 ‘영광’으로 동화하지 않고 ‘영예’로 옮겨, 하나님께 돌아가는 존귀와 명예라는 표현상의 결을 보존했습니다.
- source_word: the very last of the faithful
  choice: 신자들 가운데 가장 보잘것없는 사람
  rationale: 단순한 시간적 ‘마지막’보다는 자기 비하와 낮춤을 나타내는 문맥적 의미를 자연스러운 한국어로 전달했습니다.
- source_word: our common hope
  choice: 우리의 공통된 소망
  rationale: 예수 그리스도가 공동체 모두가 함께 품는 소망이라는 뜻을 보존했으며, ‘common’을 생략하지 않았습니다.
- source_word: Fare ye well
  choice: 평안히 지내십시오
  rationale: 고대 서신의 작별 인사를 현대 독자가 이해하기 쉬우면서도 격조 있는 합쇼체로 옮겼습니다.
theological_decisions:
- issue: ‘하나님의 영예를 위한 사람으로 드러날 자격이 있다고 여김받았다’는 진술의 의미
  choice: 수난과 투옥이 하나님의 영예와 연결된다는 원문의 긴장을 그대로 유지했습니다.
  alternative: 하나님께서 순교자로 선택하셨다 / 구원받을 자격이 있다고 인정하셨다
  rationale: 제공된 증언은 ‘순교자’나 ‘구원’을 명시하지 않습니다. 특정 교리적 해석을 본문에 덧붙이지 않고, ‘counted worthy’와 ‘be found’를 모두 드러냈습니다.
- issue: ‘우리의 공통된 소망’의 문법적 적용 범위
  choice: 하나님 아버지와 예수 그리스도 안에서 작별을 고하고, ‘소망’은 문장 구조상 예수 그리스도와 직접 연결되도록 번역했습니다.
  alternative: 하나님 아버지와 예수 그리스도 두 분 모두를 하나의 ‘공통된 소망’으로 명시
  rationale: 제공된 영어 증언의 어순과 수식 관계를 존중하면서도, 배후 그리스어 직접 검토 전에는 적용 범위를 확대해 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 고대 서신의 엄숙함은 유지하되 지나치게 고어적인 어휘와 교파 특유의 표현은 피했습니다. 이 초안은 제공된 공용 영어 증언을 우선 근거로 삼은 잠정 번역이며, 중간 교정본 그리스어 전승과의 직접 대조가 완료되면 특히 첫 문장의 헌신 관용구와 ‘합당히 여김받다/드러나다’ 구절을 재검토해야 합니다.
