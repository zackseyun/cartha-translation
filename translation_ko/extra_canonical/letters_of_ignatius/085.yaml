  english_witness: 'It is reasonable henceforth that we wake to soberness, while we have [still] time to repent and turn to God. It is good to recognize God and the bishop. He that honoreth the bishop is honored of God; he that doeth aught without the knowledge of the bishop rendereth service to the devil.


    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: ko
  text: '이제부터 우리가 정신을 차리고 깨어 있는 것이 마땅합니다. 아직 회개하여 하나님께로 돌아갈 시간이 있는 동안 말입니다. 하나님과 감독을 인정하는 것은 좋은 일입니다. 감독을 존중하는 사람은 하나님께 존중을 받고, 감독이 모르게 무슨 일이든 하는 사람은 마귀를 섬기는 것입니다.


    그러므로 여러분은 합당한 분들이므로, 모든 것이 은혜 가운데 여러분에게 풍성하기를 바랍니다. 여러분은 모든 면에서 제게 새 힘을 주었으며, 예수 그리스도께서도 여러분에게 새 힘을 주실 것입니다. 여러분은 제가 없을 때에도 함께 있을 때에도 저를 아껴 주었습니다. 하나님께서 여러분에게 보답해 주시기를 바랍니다. 여러분이 그분을 위하여 모든 것을 견디어 내면, 그분께 이르게 될 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wake to soberness (νήψωμεν / related wording, source review pending)
  choice: 정신을 차리고 깨어 있는
  rationale: 영어 증언의 ‘wake’와 ‘soberness’를 함께 살리면서, 도덕적·영적 각성을 자연스러운 현대 한국어로 표현했습니다.
- source_word: recognize (ἐπιγινώσκειν, source review pending)
  choice: 인정하는
  rationale: 단순히 알아보거나 지적으로 아는 것보다 권위와 관계를 받아들이는 문맥을 반영하되, ‘순종하다’로 과도하게 구체화하지 않았습니다.
- source_word: bishop (ἐπίσκοπος)
  choice: 감독
  rationale: 초기 그리스도교 문헌에서 직분을 나타내는 통상적인 한국어 번역어를 사용했습니다.
- source_word: refreshed (ἀνέπαυσαν / related wording, source review pending)
  choice: 새 힘을 주었으며
  rationale: 문맥상 위로와 안식을 주었다는 뜻을 자연스럽게 전달하며, 뒤따르는 그리스도의 보답과 평행을 유지했습니다.
- source_word: cherished (ἐτηρήσατε / related wording, source review pending)
  choice: 아껴 주었습니다
  rationale: 영어 증언의 관계적 온기를 살리면서도 지나치게 감상적인 표현을 피했습니다.
- source_word: attain unto Him
  choice: 그분께 이를 것입니다
  rationale: 목적지·도달의 의미와 신학적 여운을 보존하고, 이를 구원이나 연합 같은 특정 교리 용어로 좁히지 않았습니다.
theological_decisions:
- issue: 감독이 알지 못하는 가운데 행하는 것과 마귀를 섬기는 것의 강한 대조
  choice: 원문의 단정적 긴장을 그대로 보존했습니다.
  alternative: 감독의 승인 없이 교회 일을 하는 사람은 잘못을 범합니다.
  rationale: 대상을 ‘교회 일’로 제한하거나 표현을 완화할 직접 근거가 제공된 증언에 없으므로, ‘무슨 일이든’과 ‘마귀를 섬긴다’는 날카로운 진술을 유지했습니다.
- issue: ‘for whose sake’의 선행사
  choice: ‘그분을 위하여’로 옮겨 하나님을 가리키는 대명사의 모호성을 어느 정도 유지했습니다.
  alternative: ‘하나님을 위하여’ 또는 ‘예수 그리스도를 위하여’
  rationale: 영어 증언에서는 문법상 가까운 선행사가 하나님이지만 그리스도론적 문맥과 대명사 연결의 여지가 있습니다. 특정 이름을 반복해 해석을 고정하지 않았습니다.
- issue: 하나님 및 감독을 ‘recognize’한다는 병렬 표현
  choice: 둘 다 ‘인정하다’로 병렬 처리했습니다.
  alternative: 하나님을 알고 감독에게 순종하다.
  rationale: 서로 다른 동사를 넣으면 원문의 수사적 병렬과 의도된 긴장을 해석적으로 풀어 버릴 수 있으므로 동일한 표현을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 권면문의 엄숙함과 공동체적 온기를 함께 살렸습니다. 제공 자료가 중간본 그리스어 전통을 지목하지만 직접 원어 검토가 보류된 상태이므로, 공공 영역 영어 증언과 영어 POB를 대조한 잠정 출판 초안입니다. 본문에 각주가 없으므로 각주 표지도 사용하지 않았습니다.
