  english_witness: 'Therefore let us not be insensible to His goodness. For if He should imitate us according to our deeds, we are lost. For this cause, seeing that we are become His disciples, let us learn to live as beseemeth Christianity. For whoso is called by another name besides this, is not of God.


    Therefore put away the vile leaven which hath waxed stale and sour, and betake yourselves to the new leaven, which is Jesus Christ. Be ye salted in Him, that none among you grow putrid, seeing that by your savor ye shall be proved.


    It is monstrous to talk of Jesus Christ and to practice Judaism. For Christianity did not believe in Judaism, but Judaism in Christianity, wherein every tongue believed and was gathered together unto God.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: ko
  text: '그러므로 우리는 그분의 선하심에 둔감해지지 맙시다. 그분께서 우리의 행위대로 우리를 본받으신다면, 우리는 망하고 말 것입니다. 그러므로 그분의 제자가 된 우리는 그리스도교를 따라 사는 법을 배웁시다. 이 이름 외에 다른 이름으로 불리는 사람은 누구든지 하나님께 속한 사람이 아닙니다.


    그러므로 묵고 시어 버린 악한 누룩을 버리고, 새 누룩, 곧 예수 그리스도로 바뀌십시오. 그분 안에서 소금에 절여지십시오. 그러면 여러분 가운데 아무도 썩지 않을 것입니다. 여러분의 향기로 여러분이 판명될 것이기 때문입니다.[a]


    예수 그리스도를 말하면서 유대교를 실천하는 것은 터무니없는 일입니다.[b] 그리스도교가 유대교를 믿은 것이 아니라, 유대교가 그리스도교를 믿었습니다. 모든 언어가 그리스도교를 믿어 하나님께로 모였습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소금에 절여지다’, ‘썩다’, ‘향기로 판명되다’는 서로 이어지는 비유입니다. 여기서 ‘향기’는 맛이 아니라 냄새를 가리키며, 제시된 영어 증언과 그리스어 전승의 표현을 따라 옮겼습니다.
    reason: 소금·부패·냄새의 연결을 드러내고, ‘맛’으로 오해하지 않게 하기 위해서입니다.
  - marker: b
    text: 여기서 ‘유대교를 실천하다’는 이 문헌의 고대 논쟁적 맥락에 속하는 표현입니다. 이를 현대 유대인이나 유대교 일반에 대한 평가로 확대해서는 안 됩니다.
    reason: 역사적 논쟁 문구가 현대 집단을 향한 비방으로 오용되는 것을 막기 위해서입니다.
  - marker: c
    text: ‘모든 언어’는 여러 언어와 민족에 속한 사람들을 가리키는 집단적 표현입니다. 본문은 이를 의인화하여, 그들이 그리스도교를 믿고 하나님께로 모였다고 말합니다.
    reason: 관용적 표현과 의인화된 문장 구조를 명확히 하면서 본문의 표현을 보존하기 위해서입니다.
lexical_decisions:
- source_word: Christianity (Χριστιανισμός, source-language review pending)
  choice: 그리스도교
  rationale: ‘그리스도교에 합당하게’와 ‘그리스도교가 … 믿은 것’이라는 문맥에서 신앙과 삶의 길을 가리키는 명칭으로 자연스럽고 격조 있게 옮겼습니다.
- source_word: leaven
  choice: 누룩
  rationale: 옛 누룩과 새 누룩의 대조 및 발효 비유를 그대로 보존했습니다.
- source_word: Be ye salted in Him
  choice: 그분 안에서 소금으로 맛을 내어
  rationale: 부패 방지와 맛이라는 이어지는 비유를 살리면서도 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: savor
  choice: 풍기는 맛
  rationale: 소금 비유와 판별의 의미를 함께 보존하되, 냄새로만 한정하지 않았습니다.
- source_word: practice Judaism
  choice: 유대교의 관습을 따르다
  rationale: 단순히 유대인으로 사는 것 일반이 아니라 문맥상 종교적 실천을 가리키도록 옮겼습니다.
- source_word: every tongue
  choice: 모든 언어를 쓰는 사람들
  rationale: ‘모든 혀’라는 직역보다 자연스러우며, 여러 언어권 민족을 포괄하는 셈어적 표현의 뜻을 전달합니다.
theological_decisions:
- issue: ‘다른 이름’이 가리키는 범위
  choice: 이 이름이 아닌 다른 이름으로 불리는 사람
  alternative: 그리스도인이 아닌 다른 이름을 지닌 사람
  rationale: ‘이 이름’의 정확한 지시 대상을 본문이 명시적으로 풀지 않으므로 해석을 덧붙이지 않고 모호성을 보존했습니다.
- issue: ‘Judaism believed in Christianity’의 의인화와 신학적 긴장
  choice: 유대교가 그리스도교를 믿었다
  alternative: 유대교인들이 그리스도교를 믿게 되었다
  rationale: 원문 증거로 제시된 영어 증언의 대조적 의인화를 유지하고, 이를 역사적 집단 전체에 관한 단정으로 바꾸지 않았습니다.
- issue: 하나님께 속함
  choice: 하나님께 속한 사람이 아닙니다
  alternative: 하나님에게서 난 사람이 아닙니다
  rationale: ‘of God’의 소속 관계를 자연스럽게 나타내며, 출생이나 기원에 관한 특정 교리를 불필요하게 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 권면은 ‘-합시다/하십시오’, 진술은 ‘-습니다’로 통일했습니다. 다만 제공 자료가 중간 전승 그리스어 본문 자체가 아니라 공공 영역 영어 번역 증언이며 그리스어 직접 검토가 보류된 상태이므로, 어휘와 구문 판단은 잠정적입니다.
