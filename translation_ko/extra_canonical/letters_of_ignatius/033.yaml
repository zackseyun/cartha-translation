revisions:
- from: '그러므로 우리는 그분의 선하심을 깨닫지 못하는 사람이 되지 맙시다. 그분께서 우리의 행위대로 우리를 대하신다면, 우리는 멸망할 것입니다. 그러므로 그분의 제자가 된 우리는 그리스도교에 합당하게 살아가는 법을 배웁시다. 이 이름이 아닌 다른 이름으로 불리는 사람은 누구든지 하나님께 속한 사람이 아닙니다.


    그러므로 묵어서 시어 버린 악한 누룩을 버리고, 새 누룩 곧 예수 그리스도께로 나아가십시오. 그분 안에서 소금으로 맛을 내어, 여러분 가운데 아무도 썩지 않게 하십시오. 여러분은 풍기는 맛으로 판별될 것이기 때문입니다.[a]


    예수 그리스도를 말하면서 유대교의 관습을 따르는 것은 터무니없는 일입니다.[b] 그리스도교가 유대교를 믿은 것이 아니라, 유대교가 그리스도교를 믿었기 때문입니다. 그리스도교 안에서 모든 언어를 쓰는 사람들이 믿었고 하나님께로 함께 모였습니다.[c]'
  to: '그러므로 우리는 그분의 선하심에 둔감해지지 맙시다. 그분께서 우리의 행위대로 우리를 본받으신다면, 우리는 망하고 말 것입니다. 그러므로 그분의 제자가 된 우리는 그리스도교를 따라 사는 법을 배웁시다. 이 이름 외에 다른 이름으로 불리는 사람은 누구든지 하나님께 속한 사람이 아닙니다.


    그러므로 묵고 시어 버린 악한 누룩을 버리고, 새 누룩, 곧 예수 그리스도로 바뀌십시오. 그분 안에서 소금에 절여지십시오. 그러면 여러분 가운데 아무도 썩지 않을 것입니다. 여러분의 향기로 여러분이 판명될 것이기 때문입니다.[a]


    예수 그리스도를 말하면서 유대교를 실천하는 것은 터무니없는 일입니다.[b] 그리스도교가 유대교를 믿은 것이 아니라, 유대교가 그리스도교를 믿었습니다. 모든 언어가 그리스도교를 믿어 하나님께로 모였습니다.[c]'
  rationale: 제시된 영어 증언을 재확인하고, 검토 가능한 그리스어 전승의 핵심 어휘와 구문—‘우리 행위대로 본받다’, 새 누룩으로 변화됨, 소금에 절여짐, 냄새/향기로 판명됨, 모든 언어의 의인화—을 반영했습니다. 고대의 논쟁적 ‘유대교를 실천하다’라는 표현은 완화하거나 현대 집단 일반에 적용하지 않고, 필요한 역사적 한정은 각주에 두었습니다.
