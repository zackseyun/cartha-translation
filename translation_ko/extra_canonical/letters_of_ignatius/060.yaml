base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: ko
  text: '이 세상의 통치자는 나를 갈기갈기 찢고 하나님을 향한 내 마음을 타락시키려 합니다. 그러므로 여러분 가운데 가까이 있는 사람은 아무도 그를 돕지 마십시오. 오히려 내 편에, 곧 하나님의 편에 서십시오. 예수 그리스도를 말하면서 동시에 세상을 갈망하지 마십시오. 시기심이 여러분 안에 자리 잡지 못하게 하십시오.


    내가 여러분과 함께 있을 때 설령 나 자신이 여러분에게 간청하더라도, 내 말을 따르지 마십시오. 오히려 내가 여러분에게 써 보내는 이 말을 믿으십시오. [이는][a] 내가 살아 있으면서도 죽음을 갈망하며 여러분에게 쓰고 있기 때문입니다. 내 욕망은 십자가에 못 박혔고, 내 안에는 물질적인 것을 갈망하는 불이 없습니다. 다만 살아 있는 물이 내 안에서 말하며, “아버지께로 오라” 하고 내 속에서 외칩니다.


    나는 썩어 없어질 양식이나 이 생의 쾌락을 즐기지 않습니다. 내가 바라는 것은 하나님의 빵, 곧 다윗의 씨에서 나신 그리스도의 살이며, 마실 것으로는 그분의 피, 곧 썩지 않는 사랑을 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이는’에 해당하는 말은 전승 본문에서 보충된 것으로 표시되기도 합니다.
    reason: 제공된 증언 본문의 대괄호 [For]가 나타내는 편집적 복원 신호를 보존하기 위해서입니다.
lexical_decisions:
- source_word: 'ὁ ἄρχων τοῦ αἰῶνος τούτου (witness: “The prince of this world”)'
  choice: 이 세상의 통치자
  rationale: 요한 문헌을 연상시키는 전통적 표현을 유지하면서도 현대 독자가 이해하기 쉬운 ‘통치자’를 사용했습니다.
- source_word: 'συνεργείτω (witness: “abet him”)'
  choice: 그를 돕지 마십시오
  rationale: 악한 의도에 협력한다는 뜻을 평이하고 직접적으로 전달합니다.
- source_word: 'ζῆλος (witness: “envy”)'
  choice: 시기심
  rationale: 문맥상 공동체 안의 질투·시기를 가리키는 것으로 보아 자연스러운 현대어를 택했습니다.
- source_word: 'ὁ ἐμὸς ἔρως (witness: “My lust”)'
  choice: 내 욕망
  rationale: ‘ἔρως’의 강렬한 갈망이라는 폭을 보존하고, 성적 의미로만 좁혀질 수 있는 ‘정욕’은 피했습니다.
- source_word: 'ὕδωρ ζῶν (witness: “living water”)'
  choice: 살아 있는 물
  rationale: 성서적 울림을 보존하는 직역적 표현입니다.
- source_word: 'ἄρτον θεοῦ (witness: “the bread of God”)'
  choice: 하나님의 빵
  rationale: 성찬적·요한복음적 표현의 구체성을 살리고, 뒤의 ‘그리스도의 살’과 연결되도록 했습니다.
- source_word: 'σάρξ (witness: “flesh”)'
  choice: 살
  rationale: 육체 일반보다 먹는 빵과 연결되는 충격적이고 구체적인 은유를 보존합니다.
- source_word: 'ἀγάπη ἄφθαρτος (witness: “love incorruptible”)'
  choice: 썩지 않는 사랑
  rationale: ‘불멸의 사랑’으로 해석을 좁히지 않고 부패하지 않음이라는 원문의 대비를 살렸습니다.
theological_decisions:
- issue: ‘내 욕망은 십자가에 못 박혔다’가 무엇을 가리키는가
  choice: 대상을 특정하지 않고 ‘내 욕망’으로 보존
  alternative: ‘세상에 대한 내 욕망’ 또는 ‘내 육적 정욕’
  rationale: 그리스어 표현은 강렬한 욕망 자체를 가리킬 수 있으며, 세속적 욕망인지 그리스도를 향한 사랑인지에 관한 해석적 긴장을 번역에서 미리 해소하지 않았습니다.
- issue: 그리스도의 살과 피에 관한 성찬적 언어
  choice: ‘하나님의 빵…그리스도의 살’, ‘그분의 피’로 직접 보존
  alternative: ‘그리스도께서 주시는 영적 양식’처럼 설명적으로 의역
  rationale: 본문의 구체적 성찬 언어를 희석하거나 특정 교파의 성찬론으로 확대하지 않았습니다.
- issue: ‘그분의 피, 곧 썩지 않는 사랑’의 관계
  choice: 동격 구조를 유지
  alternative: ‘그분의 피와 썩지 않는 사랑’
  rationale: 피와 사랑을 동일시하거나 긴밀히 설명하는 원문의 문법적·신학적 긴장을 그대로 남겼습니다.
- issue: ‘아버지께로 오라’의 화자
  choice: 살아 있는 물이 말하는 구조를 유지
  alternative: 성령 또는 그리스도가 말한다고 명시
  rationale: 본문이 화자를 명시적으로 동일시하지 않으므로 교리적 해석을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 순교를 향한 강렬한 어조와 성서적 이미지는 유지하되, 고어체와 교파 특유의 전문 용어는 피했습니다. 직접 그리스어 대조가 아직 완료되지 않았으므로, 제공된 중간본 계열의 공용 영어 증언과 알려진 그리스어 어구를 바탕으로 한 잠정 출판 초안입니다.
