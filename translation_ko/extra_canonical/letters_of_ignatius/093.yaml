    rationale: 복수성을 기계적으로 드러낸 ‘때들’은 현대 한국어에서 부자연스럽습니다. ‘시기를 살피십시오’는 복수형이 포괄하는 여러 시기·정세의 뜻을 자연스럽게 전달하며, 뒤의 ‘모든 때 위에’와의 연결도 유지합니다.
