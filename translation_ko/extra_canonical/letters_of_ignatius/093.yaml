source:
  text: 'Let not those that seem to be plausible and yet teach strange doctrine dismay thee. Stand thou firm, as an anvil when it is smitten. It is the part of a great athlete to receive blows and be victorious. But especially must we for God''s sake endure all things, that He also may endure us.


    Be thou more diligent than thou art. Mark the seasons. Await Him that is above every season, the Eternal, the Invisible, who became visible for our sake, the Impalpable, the Impassible, who suffered for our sake, who endured in all ways for our sake.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Let not those that seem to be plausible and yet teach strange doctrine dismay thee. Stand thou firm, as an anvil when it is smitten. It is the part of a great athlete to receive blows and be victorious. But especially must we for God''s sake endure all things, that He also may endure us.


    Be thou more diligent than thou art. Mark the seasons. Await Him that is above every season, the Eternal, the Invisible, who became visible for our sake, the Impalpable, the Impassible, who suffered for our sake, who endured in all ways for our sake.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: ko
  text: '그럴듯해 보이면서도 낯선 교리를 가르치는 자들 때문에 낙심하지 마십시오. 두들겨 맞는 모루처럼 굳게 서십시오. 얻어맞고도 승리하는 것이 위대한 경기자의 몫입니다. 무엇보다도 우리는 하나님을 위하여 모든 것을 견뎌야 합니다. 그리하여 하나님께서도 우리를 참아 주시게 해야 합니다.[a]


    지금보다 더 부지런히 힘쓰십시오. 때들을 분별하십시오.[b] 모든 때 위에 계신 분을 기다리십시오. 그분은 영원하신 분, 보이지 않으시지만 우리를 위하여 보이게 되신 분, 만질 수 없는 분, 고난을 겪을 수 없으시지만 우리를 위하여 고난을 겪으신 분, 우리를 위하여 온갖 방식으로 견디신 분입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “하나님께서도 우리를 참아 주시게”는 제공된 영어 증언의 직역에 가깝습니다. 여기에는 상호적인 ‘견딤’의 역설이 있으며, 그리스어 원문 대조가 아직 필요합니다.
    reason: 현대 독자에게 이례적으로 들릴 수 있는 표현이며, 직접적인 그리스어 검토가 보류되어 있음을 밝힙니다.
  - marker: b
    text: “때들”은 여러 시기나 정세를 가리킬 수 있습니다. 곧이어 나오는 “모든 때 위에 계신 분”과의 언어적 연결을 살린 표현입니다.
    reason: 복수형과 이어지는 시간 초월적 묘사의 관계를 설명합니다.
lexical_decisions:
- source_word: plausible
  choice: 그럴듯해 보이는
  rationale: 설득력이나 신빙성이 있어 보이지만 실제 가르침은 그릇되다는 대조를 자연스럽게 살렸습니다.
- source_word: strange doctrine
  choice: 낯선 교리
  rationale: 단순히 새로운 가르침인지 그릇된 이설인지 확정하지 않고 원문의 이질성에 대한 경계감을 보존했습니다.
- source_word: anvil
  choice: 모루
  rationale: 타격을 받으면서도 흔들리지 않는 원문의 금속 가공 비유를 그대로 유지했습니다.
- source_word: athlete
  choice: 경기자
  rationale: 고대 경기의 선수라는 뜻을 담되 현대 독자가 이해하기 쉬운 표현을 택했습니다.
- source_word: Mark the seasons
  choice: 때들을 분별하십시오
  rationale: 단순 관찰보다 시기와 상황을 주의 깊게 알아차리라는 권면을 나타내며, 복수형의 폭도 살렸습니다.
- source_word: Impalpable
  choice: 만질 수 없는 분
  rationale: 신체적 접촉이나 감각으로 붙잡을 수 없다는 의미를 평이하게 전달했습니다.
- source_word: Impassible
  choice: 고난을 겪을 수 없는 분
  rationale: 신적 불수난성을 가리키는 역설을 교리적으로 완화하지 않고 이어지는 ‘고난을 겪으신’과 대조되게 했습니다.
theological_decisions:
- issue: ‘that He also may endure us’의 의미
  choice: 하나님께서도 우리를 참아 주시게
  alternative: 하나님께서도 우리를 견디어 주시게 / 우리를 받아 주시게
  rationale: 표현의 불편한 상호성과 역설을 지우지 않으면서 한국어에서 뜻이 통하도록 옮겼습니다. ‘받아 주시게’는 의미를 지나치게 해석합니다.
- issue: 불수난성과 그리스도의 고난 사이의 역설
  choice: 고난을 겪을 수 없으시지만 … 고난을 겪으신 분
  alternative: 고난받지 않으시는 분이지만 … 고난받으신 분
  rationale: 원문의 긴장을 해소하지 않고, 동일한 어근을 반복하여 역설을 선명하게 보존했습니다.
- issue: ‘Him’의 지시 대상
  choice: 모든 때 위에 계신 분 … 그분은
  alternative: 그리스도 / 하나님
  rationale: 문맥상 그리스도를 가리키는 것이 분명해 보이지만, 본문에 명시되지 않은 이름을 삽입하지 않아 원문의 지시 방식을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 목회적 권면의 단호함과 초기 기독교 문헌 특유의 연속적인 역설을 보존하되, 일상 독자도 이해할 수 있도록 문장을 정돈했습니다. 제공 자료가 공용 영어 번역 증언에 기반하고 그리스어 직접 검토가 보류된 상태이므로, 특히 [a]의 표현은 잠정적입니다.
