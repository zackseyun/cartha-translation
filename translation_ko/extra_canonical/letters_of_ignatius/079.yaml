source:
  text: 'For I know and believe that He was in the flesh even after the resurrection;


    and when He came to Peter and his company, He said to them, Lay hold and handle me, and see that I am not a demon without a body. And straightway they touched Him, and they believed, being joined unto His flesh and His blood. Wherefore also they despised death, nay they were found superior to death. And after His resurrection He [both ate with them and drank with them as one in the flesh, though spiritually He was united with the Father.'
