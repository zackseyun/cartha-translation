base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: ko
  text: '나는 그분이 부활하신 뒤에도 육체를 지니고 계셨음을 알고 또 믿습니다.


    그분은 베드로와 그 일행에게 오셨을 때 이렇게 말씀하셨습니다. “나를 붙잡아 만져 보고, 내가 몸 없는 영이 아님을 알아보십시오.” 그러자 그들은 곧 그분을 만졌고, 그분의 살과 피에 결합되어 믿게 되었습니다. 그러므로 그들은 죽음을 업신여겼으며, 참으로 죽음보다 강한 이들로 드러났습니다. 그분은 부활하신 뒤에 [육체를 지닌 이로서 그들과 함께 먹고 마시기도 하셨으나, 영적으로는 아버지와 하나 되어 계셨습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 본문에는 이 문장 앞에 짝이 맞지 않는 대괄호가 있습니다. 본문 상태나 후대의 보충 범위를 표시한 흔적일 수 있으므로 그대로 보존했습니다. 이 번역은 제공된 공용 영어 증언을 바탕으로 한 잠정 번역이며, 그리스어 원문 직접 검토가 필요합니다.
    reason: 공급 자료가 표시한 본문상의 대괄호와 원어 검토의 한계를 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: in the flesh (Greek source review pending)
  choice: 육체를 지니고
  rationale: 단순히 ‘육신 안에’라고 옮기기보다 실제 몸을 지닌 상태라는 문맥상의 주장을 자연스럽고 분명하게 전달했습니다.
- source_word: demon without a body / bodiless demon (Greek source review pending)
  choice: 몸 없는 영
  rationale: 공급된 영어 증언의 ‘demon’을 곧바로 현대 한국어의 강한 악령 개념으로 한정하지 않고, 비육체적 영적 존재라는 대조점이 드러나게 했습니다. 그리스어 직접 검토 뒤 ‘귀신’ 또는 ‘영’의 확정이 필요합니다.
- source_word: being joined unto His flesh and His blood (Greek source review pending)
  choice: 그분의 살과 피에 결합되어
  rationale: ‘살과 피’라는 구체적 표현과 ‘결합’의 신학적 긴장을 해설로 풀지 않고 보존했습니다.
- source_word: despised death
  choice: 죽음을 업신여겼으며
  rationale: 죽음을 두려워하지 않았다는 뜻으로 약화하지 않고, 원 증언의 강한 표현을 유지했습니다.
- source_word: were found superior to death
  choice: 죽음보다 강한 이들로 드러났습니다
  rationale: ‘우월하다’의 딱딱함을 피하면서도 죽음을 넘어섰다는 역설적 주장을 보존했습니다.
- source_word: spiritually He was united with the Father
  choice: 영적으로는 아버지와 하나 되어 계셨습니다
  rationale: 육체성과 아버지와의 영적 연합을 대립시키지 않으면서, 공급된 증언의 표현을 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 부활 뒤 그리스도의 육체성
  choice: ‘부활하신 뒤에도 육체를 지니고 계셨음’으로 명시
  alternative: ‘부활 뒤에도 육신 안에 계셨음’
  rationale: 가현설을 반박하는 문맥의 실제 육체성을 분명히 하되 추가 교리 설명은 넣지 않았습니다.
- issue: ‘그분의 살과 피에 결합되어’의 의미
  choice: 모호성을 그대로 보존
  alternative: 그분의 실제 몸을 만져 확신했다는 뜻으로 의역
  rationale: 이 표현이 접촉, 신앙적 연합 또는 성찬적 함의를 지닐 가능성을 번역에서 하나로 확정하지 않았습니다.
- issue: 아버지와의 영적 연합
  choice: ‘영적으로는 아버지와 하나 되어’
  alternative: ‘영 안에서 아버지와 연합하여’
  rationale: 존재론적·관계적 의미를 특정 교리 체계로 과도하게 규정하지 않고 원문의 긴장을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 존중하는 합쇼체를 사용했습니다. 초기 그리스도교 문헌의 논증적이고 장중한 어조를 유지하되, ordinary readers가 이해하기 어려운 직역투는 피했습니다. 인용문의 명령도 문서 전체의 격식에 맞춰 ‘-십시오’체로 처리했습니다.
