  yaml_path: translation/extra_canonical/letters_of_ignatius/096.yaml
  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: ko
  text: '감독에게 유의하십시오. 그러면 하나님께서도 여러분에게 유의하실 것입니다. 나는 감독과 장로들과 집사들에게 복종하는 이들을 위하여 내 목숨을 담보로 섭니다.[a] 하나님 앞에서 내가 그들과 함께 몫을 얻을 수 있기를 바랍니다. 하나님의 청지기와 보좌자와 일꾼으로서, 서로 함께 수고하고 함께 싸우며 함께 달리고 함께 고난을 받고 함께 쉬며 함께 일어나십시오.


    여러분이 복무하는 지휘관을 기쁘게 해 드리십시오. 여러분은 그분에게서 보수도 받을 것입니다. 여러분 가운데 아무도 탈영병으로 드러나지 않게 하십시오. 여러분의 세례는 방패로, 믿음은 투구로, 사랑은 창으로, 인내는 온몸을 덮는 갑옷으로 여러분과 함께 있게 하십시오. 여러분이 마땅히 배정될 것을 받을 수 있도록, 여러분의 행위가 여러분의 증표가 되게 하십시오.[b] 그러므로 하나님께서 여러분과 함께하시는 것처럼, 여러분도 온유하게 서로 오래 참으십시오. 내가 언제나 여러분으로 말미암아 기뻐할 수 있기를 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 목숨을 담보로 섭니다’는 그리스어 ἀντίψυχον을 옮긴 것입니다. 이는 단순한 호의나 헌신보다 강하게, 다른 이들을 위하여 자기 생명을 보증으로 내놓는다는 뜻을 나타냅니다.
    reason: 원문의 강한 자기-담보 관용구를 설명하되, 그것을 특정 속죄 교리로 단정하지 않습니다.
  - marker: b
    text: ‘증표’는 상업·급여의 비유에서 수령을 위해 제시하는 증명서 또는 영수증을 가리킵니다. 이어지는 ‘마땅히 배정될 것’도 그 비유 안에서 장차 받을 몫을 뜻합니다.
    reason: ἀποδείξεις와 τὰ ἐπιβαλλόμενα의 비유적·관용적 성격을 보존하고, 행위와 보상의 신학적 관계를 본문 이상으로 해석하지 않습니다.
lexical_decisions:
- source_word: bishop
  choice: 감독
  rationale: 초기 교회의 직분 명칭을 현대 한국어에서 널리 통용되는 역사적 용어로 옮겼습니다.
- source_word: presbyters
  choice: 장로들
  rationale: 감독 및 집사와 병렬된 복수 직분을 살렸습니다.
- source_word: assessors
  choice: 배석자
  rationale: 청지기와 일꾼 사이에 놓인 행정·재판적 비유를 성급히 해석하지 않고 보존했습니다.
- source_word: Captain
  choice: 지휘관
  rationale: 이어지는 군 복무, 보수, 탈영병, 무장 비유와 자연스럽게 연결되는 표현입니다.
- source_word: baptism
  choice: 세례
  rationale: 원문의 성례적 명칭을 직접 보존했습니다.
- source_word: deposits / assets due
  choice: 예치금 / 마땅히 받을 것
  rationale: 행실을 맡겨 둔 자산에 비유하고 나중에 되돌려 받는다는 금융 비유를 유지하되, 한국어로 이해 가능하게 표현했습니다.
- source_word: long-suffering
  choice: 오래 참다
  rationale: 단순한 수동적 인내보다 타인을 향한 지속적 관용을 나타내는 표현을 택했습니다.
theological_decisions:
- issue: 직분자들에 대한 복종과 헌신의 범위
  choice: 감독과 장로들과 집사들에게 복종하는 이들을 위하여 나 자신을 바칩니다
  alternative: 그들에게 복종하는 이들을 대신하여 나는 희생됩니다
  rationale: 헌신 또는 희생을 암시하는 표현의 강도를 완전히 한쪽으로 확정하지 않으면서, 한국어 본문은 자연스럽게 구성하고 각주에 가능성을 밝혔습니다.
- issue: 행실과 보상의 관계
  choice: 행실을 예치금으로 삼아 마땅히 받을 것을 돌려받는다
  alternative: 행위를 담보로 맡겨 정당한 보수를 받는다
  rationale: 공로 교리를 덧붙이지 않고 본문의 상업적 비유와 미래 보상의 긴장을 그대로 두었습니다.
- issue: 하나님의 오래 참으심
  choice: 하나님께서 여러분을 오래 참아 주시는 것처럼
  alternative: 하나님께서 여러분과 함께하시는 것처럼
  rationale: 영어 증언의 ‘as God is with you’는 비교의 의미가 생략되었을 수 있으나, 문맥상 오래 참으심을 보충하는 번역이 자연스럽습니다. 다만 직접 그리스어 검토가 필요합니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 권면의 반복과 군사·금융 비유를 유지하면서도 문장을 현대 독자가 따라갈 수 있게 다듬었습니다. 제공 자료가 공용 영어 증언에 기초하고 그리스어 직접 검토가 보류된 상태이므로, 특히 ‘devoted’, ‘assessors’, 마지막 비교절은 잠정 번역입니다.
