- from: '감독에게 유의하십시오. 그러면 하나님께서도 여러분에게 유의하실 것입니다. 나는 감독과 장로들과 집사들에게 복종하는 이들을 위하여 나 자신을 바칩니다.[a] 하나님 앞에서 나도 그들과 함께 몫을 얻도록 허락해 주시기를 바랍니다. 하나님의 청지기와 배석자와 일꾼답게, 서로 함께 수고하고 함께 싸우며 함께 달리고 함께 고난받고 함께 눕고 함께 일어나십시오.


