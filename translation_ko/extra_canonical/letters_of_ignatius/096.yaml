review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 그리스어 중간본의 ἀντίψυχον은 단순히 ‘위하여 자신을 바친다’보다 ‘목숨을 담보로 하는 보증/대속물’이라는 강한 관용적 표현입니다. 또한 마지막 ὡς ὁ θεὸς μεθ᾽ ὑμῶν은 ‘하나님께서 여러분과 함께하시는 것처럼’이며, 하나님의 오래 참으심을 보충해서는 안 됩니다. ἀποδείξεις와 τὰ ἐπιβαλλόμενα는 각각 ‘증표/영수증’ 및 ‘마땅히 배정되는 것’이라는 상업·급여 비유를 보존하는 편이 좋습니다.
  naturalness: 합쇼체와 권면의 반복은 대체로 자연스럽습니다. 다만 ‘배석자’는 현대 한국어에서 법정의 배석 판사 등을 우선 연상시키므로, 직역적이면서도 덜 오해되는 ‘보좌자’가 적절합니다. ‘그 군대에서 복무하며 … 지휘관’도 관계절이 다소 무거워 문장을 나누었습니다.
  terminology: 감독, 장로들, 집사들, 세례, 믿음, 사랑, 인내는 적절합니다. ‘지휘관’은 군사 비유를 잘 살립니다. ‘보좌자’는 πάρεδροι의 본래적 의미를 보존하면서 특정 교회 직분이나 재판 제도로 단정하지 않습니다.
  issues:
  - severity: high
    issue: ‘나는 … 위하여 나 자신을 바칩니다’
    rationale: ἀντίψυχον은 ‘헌신’ 일반이 아니라 자기 생명을 대신 내놓는 보증 또는 대속의 언어입니다. 본문에서 그 강도를 보존해야 하며, 각주로 약화할 문제가 아닙니다.
  - severity: high
    issue: ‘하나님께서 여러분을 오래 참아 주시는 것처럼’
    rationale: 원문과 영어 증언 모두 ‘as God is with you’라고 하며, 오래 참으심이라는 내용을 보충하지 않습니다. 이는 문맥상 추정으로도 본문에 넣을 수 없는 의미 변화입니다.
  - severity: medium
    issue: ‘배석자’
    rationale: πάρεδροι는 곁에 앉아 돕는 자들을 가리키며, ‘배석자’는 현대 법률 용례로 지나치게 좁게 들릴 수 있습니다.
  - severity: medium
    issue: ‘행실을 예치금으로 삼으십시오’
