base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: ko
  text: '훌륭한 제자들을 사랑한다고 해서 그것이 그대에게 칭찬거리가 되는 것은 아닙니다. 오히려 더 해로운 자들을 온유함으로 복종시키십시오. 모든 상처가 같은 연고로 낫는 것은 아닙니다. 날카로운 통증은 온찜질로 가라앉히십시오.


    모든 일에서 뱀처럼 슬기롭고 언제나 비둘기처럼 순진하십시오. 그대가 육과 영으로 이루어진 것은 눈앞에 보이는 것들에 알맞게 대처하게 하려는 것입니다. 보이지 않는 것들은 그대에게 드러나도록 기도하십시오. 그리하여 그대가 아무것도 부족하지 않고 모든 영적 은사에 풍성하게 되십시오.


    때가 그대를 필요로 합니다. 마치 항해사들이 바람을 필요로 하고 폭풍에 시달리는 선원이 항구를 필요로 하는 것과 같습니다. 이는 그것이 하나님께 이르기 위함입니다.[a] 하나님의 경기자답게 정신을 차리십시오. 상은 썩지 않음과 영원한 생명이며, 그대도 이를 확신하고 있습니다. 모든 일에서 나는 그대에게 온전히 헌신합니다. 그대가 소중히 여겨 준 나의 결박도 그러합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것이’가 무엇을 가리키는지는 제공된 영어 증언에서 분명하지 않습니다. ‘그대가 하나님께 이르도록’이라는 뜻일 가능성도 있습니다. 그리스어 원문 대조가 필요합니다.
    reason: 대명사의 지시 대상을 임의로 확정하지 않고 실제 문헌상의 모호성을 독자에게 알리기 위함입니다.
lexical_decisions:
- source_word: good scholars
  choice: 훌륭한 제자들
  rationale: 문맥상 가르침을 잘 따르는 이들을 가리키는 표현으로 보아, 현대 독자가 자연스럽게 이해할 수 있도록 옮겼습니다. 그리스어 원문 검토 전의 잠정적 선택입니다.
- source_word: pestilent
  choice: 해로운 자들
  rationale: 사람에게 해악을 끼치거나 다루기 어려운 이들이라는 뜻을 살리되, 질병을 연상시키는 지나치게 직역적인 표현은 피했습니다.
- source_word: bring ... to submission
  choice: 복종시키십시오
  rationale: 권면의 강도를 보존했습니다. 다만 수단이 ‘온유함’임을 함께 밝혀 강압으로 오해되지 않게 했습니다.
- source_word: salve / fomentations
  choice: 연고 / 온찜질
  rationale: 서로 다른 상처와 통증에 서로 다른 치료법을 쓴다는 의학적 비유를 현대어로 명확히 전달했습니다.
- source_word: prudent / guileless
  choice: 슬기롭고 / 순진하십시오
  rationale: 마태복음 10:16을 떠올리게 하는 대조를 보존하면서 자연스러운 현대 한국어를 사용했습니다.
- source_word: humor the things which appear before thine eyes
  choice: 눈앞에 보이는 것들에 알맞게 대처하다
  rationale: ‘humor’를 비위를 맞춘다는 뜻으로 좁히지 않고, 가시적·현실적 사정에 적절히 응한다는 의미로 옮겼습니다.
- source_word: the season
  choice: 때
  rationale: 특정한 시기 또는 기회를 뜻하는 표현의 폭을 유지했습니다.
- source_word: incorruption
  choice: 썩지 않음
  rationale: 불멸로 단정하기보다 부패하지 않는 상태라는 원표현의 구체성과 신학적 여지를 보존했습니다.
- source_word: my bonds
  choice: 나의 결박
  rationale: 투옥 상태와 실제 사슬을 함께 암시하는 초기 기독교 서신의 표현을 보존했습니다.
theological_decisions:
- issue: 육과 영의 관계
  choice: ‘육과 영으로 이루어진’이라고 병렬적으로 옮김
  alternative: ‘몸과 영혼을 지닌’ 또는 인간 본성에 관한 교리적 설명으로 확장
  rationale: 제공된 증거가 말하는 이중 표현을 그대로 유지하고 특정 인간론을 덧붙이지 않았습니다.
- issue: ‘그것이 하나님께 이르기 위함’의 대명사 지시 대상
  choice: 모호한 대명사를 본문에 보존하고 각주로 밝힘
  alternative: ‘그대가 하나님께 이르기 위함’ 또는 ‘때가 하나님께 이르기 위함’으로 확정
  rationale: 영어 증언 자체가 지시 대상을 모호하게 보존하며, 직접적인 그리스어 검토가 보류되어 있으므로 해석을 단정하지 않았습니다.
- issue: 영적 은사
  choice: ‘모든 영적 은사’
  alternative: ‘모든 영적인 선물’
  rationale: 초기 기독교 문맥에서 자연스럽고 널리 이해되는 표현이지만, 구체적인 은사 목록이나 후대 교파적 체계를 전제하지 않았습니다.
- issue: 하나님의 경기자
  choice: 금욕과 신앙의 훈련을 나타내는 경기 비유를 그대로 보존
  alternative: ‘하나님의 군사’ 등 다른 비유로 치환
  rationale: 원문의 운동 경기 이미지를 유지하여 상과 훈련의 연결을 살렸습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 목회적 권면의 따뜻함과 명령문의 힘을 함께 살렸으며, 고풍스러운 영어 표현은 평이하고 품위 있는 현대어로 바꾸었습니다. 다만 제공 자료가 공공 영역 영어 번역 증언이고 그리스어 원문 검토가 보류되어 있으므로, 어휘 판단과 문장 구조는 잠정적입니다.
