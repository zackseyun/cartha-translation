  naturalness: 현 초안에는 ‘이는 그것이 하나님께 이르기 위함입니다’처럼 한국어에서 지시 대상과 문장 연결이 모두 부자연스러운 부분, 그리고 ‘나의 결박도 그러합니다’처럼 술어의 적용 관계가 불명확한 부분이 있습니다. 이를 현대 표준 한국어 합쇼체의 자연스러운 권면 문장으로 다듬었습니다.
