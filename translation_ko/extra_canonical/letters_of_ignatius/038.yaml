    rationale: 제공된 영어 증언은 ‘The Ephesians from Smyrna’이며, 뒤의 ‘from whence also I write’가 이그나티오의 편지 발신지 역시 스미르나임을 잇습니다. ‘스미르나에서 온 에베소 교회 사람들’ 및 ‘스미르나에서’로 옮기면 이 지리적 관계가 분명해집니다.
  - severity: medium
