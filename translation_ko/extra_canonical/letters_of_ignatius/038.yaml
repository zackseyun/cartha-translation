base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: ko
  text: 스미르나에 있는 에베소 교우들이 여러분에게 문안합니다. 나도 이곳에서 여러분에게 이 편지를 씁니다. 그들은 여러분과 마찬가지로 하나님의 영광을 위하여 이곳에서 나와 함께 있으며, 스미르나 교회의 감독 폴리카르포스와 더불어 모든 일에서 나를 위로해 주었습니다. 참으로 다른 모든 교회도 예수 그리스도의 존귀 안에서 여러분에게 문안합니다. 하나님께 속한 화합 가운데 평안히 지내며, 굳건한 영, 곧 예수 그리스도를 지니십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘굳건한 영, 곧 예수 그리스도’는 제공된 영어 증언의 표현을 따라 옮긴 것입니다. 여기서 ‘영’을 단순히 ‘마음가짐’으로 풀지 않고, 예수 그리스도와 직접 연결되는 원문의 신학적 긴장을 보존했습니다. 이 번역은 중간 전승 그리스어 본문에 대한 직접 검토가 이루어지기 전의 잠정안입니다.
    reason: 독자가 이례적인 동격 표현을 번역 오류로 오해하지 않도록 하고, 현재 초안의 자료적 한계를 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: salute / greet
  choice: 문안합니다
  rationale: 초기 그리스도교 서신의 인사 관용을 살리면서도 현대 한국어 독자가 자연스럽게 이해할 수 있는 격식 있는 표현입니다.
- source_word: bishop
  choice: 감독
  rationale: 후대 교파의 직제 명칭을 본문에 과도하게 투영하지 않으면서, 초기 교회의 직임을 나타내는 전통적이고 널리 이해되는 번역어를 택했습니다.
- source_word: in the honor of Jesus Christ
  choice: 예수 그리스도의 존귀 안에서
  rationale: 영어 증언의 전치사적 표현과 추상명사 ‘honor’를 평탄화하지 않고 보존했습니다. ‘존귀’는 단순한 사회적 명예보다 그리스도께 돌려지는 높임의 뜻을 담습니다.
- source_word: godly concord
  choice: 하나님께 속한 화합
  rationale: ‘경건한 화합’보다 뜻이 명료하면서도, 이 화합의 성격과 근원이 하나님께 있음을 나타냅니다.
- source_word: steadfast spirit
  choice: 굳건한 영
  rationale: ‘spirit’을 마음가짐으로 축소하지 않고 ‘영’으로 옮겨, 뒤따르는 예수 그리스도와의 동일시가 지닌 신학적 긴장을 보존했습니다.
- source_word: possess
  choice: 지니십시오
  rationale: 강한 소유·보유의 명령을 유지하되 한국어에서 부자연스러운 ‘소유하십시오’는 피했습니다.
theological_decisions:
- issue: ‘굳건한 영’과 예수 그리스도의 관계
  choice: ‘굳건한 영, 곧 예수 그리스도’로 동격을 직접 보존함
  alternative: ‘예수 그리스도께서 주시는 굳건한 마음을 지니십시오’
  rationale: 대안은 ‘영’을 ‘마음’으로 바꾸고 그리스도를 영의 수여자로 해석하여 원문의 놀라운 동일시를 해소합니다. 현재 확보된 영어 증언의 ‘which is Jesus Christ’를 그대로 존중했습니다.
- issue: ‘여러분과 마찬가지로’가 수식하는 내용
  choice: 에베소 교우들과 수신자 모두가 하나님의 영광을 위하여 있다는 뜻으로 연결함
  alternative: 에베소 교우들이 이그나티오와 함께 있는 것처럼 수신자들도 함께 있다는 뜻으로 연결함
  rationale: 영어 증언의 ‘for the glory of God, as also are ye’에서 가장 가까운 서술어와 자연스럽게 연결하되, 직접 그리스어 검토 전까지 통사적 가능성을 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 고대 서신의 품위와 공동체적 어조를 유지했습니다. ‘교우들’은 단순한 지역 주민이 아니라 에베소 교회 구성원들을 가리킨다는 점을 자연스럽게 드러냅니다. 인명은 현대 한국어에서 널리 쓰이는 ‘폴리카르포스’를 사용했습니다. 제공 자료에는 그리스어 직접 대조가 보류되어 있으므로, 본 초안은 공공 영역 영어 증언과 감사된 영어 POB를 토대로 한 잠정적 최적 등가 번역입니다.
