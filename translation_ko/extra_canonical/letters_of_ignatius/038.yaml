    rationale: ‘as also are ye’가 ‘for the glory of God’에 이어지는 관계를 한국어에서도 ‘여러분도 그러하듯이’로 밝혀야, 수신자들이 이그나티오와 물리적으로 함께 있다는 뜻으로 오독될 가능성을 줄일 수 있습니다.
