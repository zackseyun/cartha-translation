review_pass:
  verdict: revise
  source_fidelity: 수신자에게 문안하는 이들은 영어 증언상 ‘스미르나에서 온 에베소 사람들’이며, 이그나티오도 그곳(스미르나)에서 편지를 쓴다고 말합니다. 초안의 ‘스미르나에 있는 에베소 교우들’과 ‘이곳’은 대체로 뜻이 통하지만, 출발지 및 지시 대상의 연결을 더 분명히 할 필요가 있습니다. 또한 ‘as also are ye’는 ‘하나님의 영광을 위하여’에 연결되는 표현이므로 이를 한국어 문장에서도 명시하는 편이 안전합니다.
  naturalness: 합쇼체와 서신 인사말의 격식은 적절합니다. 다만 ‘예수 그리스도의 존귀 안에서’는 현대 한국어에서 다소 직역투입니다. ‘예수 그리스도를 공경하며’는 해당 인사의 성격을 자연스럽게 드러내면서도 의미를 유지합니다.
  terminology: ‘감독’, ‘폴리카르포스’, ‘문안합니다’, ‘굳건한 영’은 적절합니다. ‘하나님께 속한 화합’보다는 ‘하나님께 합당한 화합’이 godly/theoprepēs의 성격을 더 직접적으로 나타냅니다. 마지막의 ‘굳건한 영, 곧 예수 그리스도’는 해석적으로 완화하지 않고 유지해야 합니다.
  issues:
