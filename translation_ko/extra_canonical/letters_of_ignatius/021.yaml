id: IGN.021
reference: Letters of Ignatius — IgnEph. 20
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'If Jesus Christ should count me worthy through your prayer, and it should be the Divine will, in my second tract, which I intend to write to you, I will further set before you the dispensation whereof I have begun to speak, relating to the new man Jesus Christ, which consisteth in faith towards Him and in love towards Him, in His passion and resurrection,


    especially if the Lord should reveal aught to me. Assemble yourselves together in common, every one of you severally, man by man, in grace, in one faith and one Jesus Christ, who after the flesh was of David''s race, who is Son of Man and Son of God, to the end that ye may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live for ever in Jesus Christ.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'If Jesus Christ should count me worthy through your prayer, and it should be the Divine will, in my second tract, which I intend to write to you, I will further set before you the dispensation whereof I have begun to speak, relating to the new man Jesus Christ, which consisteth in faith towards Him and in love towards Him, in His passion and resurrection,


    especially if the Lord should reveal aught to me. Assemble yourselves together in common, every one of you severally, man by man, in grace, in one faith and one Jesus Christ, who after the flesh was of David''s race, who is Son of Man and Son of God, to the end that ye may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live for ever in Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: ko
  text: '여러분의 기도를 통하여 예수 그리스도께서 나를 합당하게 여겨 주시고 또 뜻이 허락한다면, 내가 여러분에게 쓰려고 하는 두 번째 글에서, 내가 이미 말하기 시작한 경륜, 곧 새 사람 예수 그리스도에 관한 것을 여러분에게 더 설명드리겠습니다. 그것은 그분을 향한 믿음과 그분을 향한 사랑, 그분의 수난과 부활에 있습니다.[a] 특히 주께서 내게 무엇인가를 계시해 주신다면 그렇게 하겠습니다.


    여러분은 은혜 안에서, 한 믿음과 한 분 예수 그리스도 안에서, 각 사람이 이름대로 함께 모이십시오.[b] 그분은 육신으로는 다윗의 혈통에서 나셨고, 사람의 아들이시며 하나님의 아들이십니다. 그리하여 여러분은 흐트러지지 않는 마음으로 감독과 장로단에 순종하고, 한 빵을 떼십시오. 이 빵은 불멸의 약이며, 우리가 죽지 않고 예수 그리스도 안에서 영원히 살게 하는 해독제입니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그분을 향한 믿음과 그분을 향한 사랑”은 “그분의 믿음과 그분의 사랑”으로도 옮길 수 있습니다.
    reason: 그리스어 속격 대명사는 대상과 소유·주체 가운데 어느 의미인지를 문법만으로 완전히 확정하기 어렵습니다.
  - marker: b
    text: “각 사람이 이름대로”는 모든 구성원이 각자 빠짐없이 모인다는 뜻으로 이해할 수 있습니다.
    reason: 원문의 κατ᾽ ἄνδρα와 ἐξ ὀνόματος가 결합된 압축적 표현을 보존하면서 그 의미를 설명합니다.
  - marker: c
    text: “해독제”는 죽음을 막는 치료제라는 의학적 비유입니다. 원문은 한 빵을 떼는 일을 이 비유로 직접 묘사합니다.
    reason: 강한 성례적·의약적 은유를 특정한 후대 교리로 한정하지 않으면서 독자가 비유의 연결을 이해하도록 돕습니다.
lexical_decisions:
- source_word: οἰκονομία
  choice: 경륜
  rationale: 어떤 일을 이루어 가는 질서와 계획이라는 원문의 폭을 보존합니다. ‘하나님의 계획’이라고 풀면 원문에 명시되지 않은 주체를 보충하게 되므로 본문에서는 ‘경륜’을 유지했습니다.
- source_word: καινὸς ἄνθρωπος
  choice: 새 사람
  rationale: 그리스어의 직설적 표현과 초기 그리스도교 문헌의 신학적 울림을 함께 보존합니다.
- source_word: πάθος
  choice: 수난
  rationale: 예수의 고난과 죽음을 가리키는 문맥에 맞는 전통적이면서도 현대 독자가 이해할 수 있는 표현입니다.
- source_word: πρεσβυτέριον
  choice: 장로단
  rationale: 개별 장로가 아니라 장로들로 이루어진 집단 또는 회의를 가리키는 집합적 의미를 반영합니다.
- source_word: φάρμακον ἀθανασίας
  choice: 불멸의 약
  rationale: 의약적 은유를 약화하지 않고 그대로 살렸습니다.
- source_word: ἀντίδοτος
  choice: 해독제
  rationale: 앞선 ‘약’과 이어지는 강한 의약적 비유를 보존합니다.
- source_word: διὰ παντός
  choice: 영원히
  rationale: ‘언제나, 줄곧’이라는 시간적 지속을 이 문맥에서 자연스럽게 전달합니다.
theological_decisions:
- issue: ἐν τῇ αὐτοῦ πίστει καὶ ἐν τῇ αὐτοῦ ἀγάπῃ의 주체와 대상
  choice: 그분을 향한 믿음과 그분을 향한 사랑
  alternative: 그분의 믿음과 그분의 사랑
  rationale: 속격 대명사는 문법적으로 소유·주체 또는 대상을 나타낼 수 있습니다. 문맥상 신자들이 그리스도를 믿고 사랑한다는 뜻이 자연스럽지만, 원문의 형식적 모호성을 각주에서 밝혔습니다.
- issue: ‘한 빵’과 불멸의 약이라는 표현의 성례적 함의
  choice: 비유를 해설하거나 특정 교리로 규정하지 않고 원문 그대로 번역
  alternative: 성찬 또는 성체라고 명시
  rationale: 문맥에는 공동의 빵 나눔에 대한 강한 신학적 의미가 있으나, 원문이 여기서 특정한 후대 교리 체계를 명시하지 않으므로 해석을 본문에 삽입하지 않았습니다.
- issue: ‘뜻’의 주체
  choice: 뜻이 허락한다면
  alternative: 하나님의 뜻이라면
  rationale: 전승된 그리스어 표현은 단순히 ‘뜻이라면/뜻이 있다면’으로 읽히며 주체가 생략되어 있습니다. 문맥상 하나님의 뜻을 가리킬 가능성이 크지만 본문에서는 생략을 보존했습니다.
- issue: ‘사람의 아들’의 의미
  choice: 사람의 아들
  alternative: 인자
  rationale: 여기서는 ‘하나님의 아들’과 병렬되어 참된 인간성과 신적 아들 됨을 함께 고백하는 표현으로 보입니다. 일반 독자에게 투명한 ‘사람의 아들’을 사용하되 특정 칭호 해석으로 좁히지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 그리스도교 문헌의 장중함을 유지하되 문장을 적절히 나누어 가독성을 높였습니다. ‘경륜’, ‘수난’, ‘감독’, ‘장로단’은 문헌의 역사적·신학적 성격을 보존하기 위해 채택했으며, 불필요한 교파적 용어 확장은 피했습니다. 제공 자료가 영어 공공영역 증언을 주된 drafting basis로 명시하므로, 중간 전승 그리스어 본문에서 널리 확인되는 어휘와 구문을 대조해 번역하되 최종 비평판 대조가 필요합니다.
