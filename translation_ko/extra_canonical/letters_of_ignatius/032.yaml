id: IGN.032
reference: Letters of Ignatius — IgnMagn. 9
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'If then those who had walked in ancient practices attained unto newness of hope, no longer observing Sabbaths but fashioning their lives after the Lord''s day, on which our life also arose through Him and through His death which some men deny--a mystery whereby we attained unto belief, and for this cause we endure patiently, that we may be found disciples of Jesus Christ our only teacher--


    if this be so, how shall we be able to live apart from Him? seeing that even the prophets, being His disciples, were expecting Him as their teacher through the Spirit. And for this cause He whom they rightly awaited, when He one, raised them from the dead.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'If then those who had walked in ancient practices attained unto newness of hope, no longer observing Sabbaths but fashioning their lives after the Lord''s day, on which our life also arose through Him and through His death which some men deny--a mystery whereby we attained unto belief, and for this cause we endure patiently, that we may be found disciples of Jesus Christ our only teacher--


    if this be so, how shall we be able to live apart from Him? seeing that even the prophets, being His disciples, were expecting Him as their teacher through the Spirit. And for this cause He whom they rightly awaited, when He one, raised them from the dead.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: ko
  text: '그러므로 옛 관습에 따라 살아가던 사람들이 새로운 소망에 이르러, 더 이상 안식일을 지키지 않고 주님의 날을 따라 살아갔다면,[a] 그날에 우리의 생명도 그분을 통하여, 또 그분의 죽음을 통하여 솟아올랐습니다. 어떤 이들은 이를 부인합니다. 이것은 우리가 믿음에 이르게 된 신비이며, 이 때문에 우리는 인내합니다. 우리의 유일한 스승이신 예수 그리스도의 제자로 드러나기 위해서입니다.



    그렇다면 우리가 어떻게 그분을 떠나 살 수 있겠습니까? 예언자들조차 그분의 제자였으며, 성령 안에서 그분을 자기들의 스승으로 기다렸습니다. 그러므로 그들이 마땅히 기다리던 그분은 친히 오셔서 그들을 죽은 이들 가운데서 일으키셨습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어는 직역하면 ‘주님의 것에 따라 살아가며’입니다. 일반적으로 생략된 ‘날’을 보충하여 ‘주님의 날’로 이해하지만, 생략된 명사를 다른 방식으로 이해할 여지도 제시되어 왔습니다.
    reason: κυριακή 뒤에 ‘날’에 해당하는 명사가 명시되지 않은 문법적·해석적 여지를 알립니다.
  - marker: b
    text: 그리스어는 ‘현존하여’ 또는 ‘와서’라는 뜻의 표현을 사용합니다. 여기서 ‘그들’은 문법상 앞에서 말한 예언자들을 가리킵니다. 공개 영역 영어 증언의 ‘when he one’은 이 부분을 불명료하게 옮긴 것입니다.
    reason: παρών의 의미와 목적어 αὐτούς의 선행사를 밝히고, 영어 증언의 불명료함을 투명하게 알립니다.
lexical_decisions:
- source_word: ἐν παλαιοῖς πράγμασιν ἀναστραφέντες
  choice: 옛 관습에 따라 살아가던
  rationale: ‘옛 일들 가운데서 행하다’라는 뜻을 문맥에 맞는 자연스러운 한국어로 옮겼으며, 이를 곧바로 모세 율법 전체와 동일시하지 않았습니다.
- source_word: εἰς καινότητα ἐλπίδος ἦλθον
  choice: 새로운 소망에 이르러
  rationale: ‘소망의 새로움에 이르다’라는 원문의 운동성과 새로움의 의미를 보존했습니다.
- source_word: μηκέτι σαββατίζοντες
  choice: 더 이상 안식일을 지키지 않고
  rationale: 동사 σαββατίζω의 관습적·종교적 실천 의미를 평이하게 표현했습니다.
- source_word: κατὰ κυριακὴν ζῶντες
  choice: 주님의 날을 따라 살아갔습니다
  rationale: κυριακή를 초기 그리스도교 용례에 따라 ‘주님의 날’로 이해하되, 생략된 명사와 구문의 모호성을 각주에 밝혔습니다.
- source_word: ἡ ζωὴ ἡμῶν ἀνέτειλεν
  choice: 우리의 생명도 … 솟아올랐습니다
  rationale: ἀνατέλλω의 ‘돋다, 솟아오르다’라는 비유를 살려 부활 및 새 생명의 울림을 보존했습니다.
- source_word: τὸ πιστεύειν
  choice: 믿게 되었습니다
  rationale: 직역인 ‘믿는 것을 얻었다’보다 자연스럽게 옮기면서 믿음에 이르게 되었다는 뜻을 유지했습니다.
- source_word: ὑπομένομεν
  choice: 인내합니다
  rationale: 고난 아래 머물며 견딘다는 지속적 태도를 간결하고 격조 있게 표현했습니다.
- source_word: παρὼν ἤγειρεν
  choice: 오셔서 … 일으키셨습니다
  rationale: 공개 영역 영어 증언의 불명료한 ‘when He one’ 대신 그리스어 παρών(와서, 현존하여)의 뜻을 반영했습니다.
theological_decisions:
- issue: ‘주님의 날’과 그리스도인의 삶의 관계
  choice: ‘주님의 날을 따라 살아갔다’로 번역
  alternative: ‘주님의 방식에 따라 살았다’ 또는 ‘주님의 생명을 따라 살았다’
  rationale: 통상적인 본문 이해와 초기 그리스도교 용례를 따르면서도, 그리스어에 ‘날’이 명시되어 있지 않다는 점을 각주로 보존했습니다.
- issue: ‘우리의 생명’이 솟아오른 매개
  choice: ‘그분과 그분의 죽음을 통하여’라는 병렬 구조를 유지
  alternative: ‘그분의 죽음을 통하여 그분 안에서’처럼 관계를 해석하여 재구성
  rationale: 원문의 δι’ αὐτοῦ καὶ τοῦ θανάτου αὐτοῦ가 지닌 압축된 신학적 긴장을 풀어서 단정하지 않았습니다.
- issue: 예언자들을 죽은 이들 가운데서 일으키신다는 진술
  choice: 목적어 ‘그들을’을 예언자들로 유지
  alternative: 이를 일반적인 죽은 자들의 부활이나 영적 각성으로 해석
  rationale: 문법상 가장 가까운 선행 대상인 예언자들을 그대로 받았으며, 독특한 신학적 진술을 익숙한 교리 표현으로 바꾸지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 긴 원문 문장을 여러 문장으로 나누어 일반 독자가 따라가기 쉽게 했으나, 논리적 연결과 신학적 긴장은 유지했습니다. ‘안식일’, ‘성령’, ‘죽은 이들 가운데서 일으키다’ 등 초기 그리스도교 문헌에 적합한 용어를 사용하되 특정 교파의 전문 표현은 피했습니다.
