  - severity: low
    issue: ‘제자가 되기 시작한 사람이며’ 및 ‘여기고 말하기 때문입니다’의 번역투
    rationale: 원문은 이제 제자가 되기 시작한다는 자기 고백과 수신자들을 동료 학습자로 대하는 발화입니다. 불필요한 명사와 인과적 설명을 제거하면 더 자연스럽고 직접적입니다.
  - severity: low
    issue: 첫 문단의 ‘훈계’와 둘째 문단의 ‘권면’
    rationale: 두 표현은 서로 다른 맥락의 admonition/exhortation을 자연스럽게 구별하며, 원문의 반복으로 오해될 위험도 없습니다.
