source:
  text: 'I do not command you, as though I were somewhat. For even though I am in bonds for the Name''s sake, I am not yet perfected in Jesus Christ. [For] now am I beginning to be a disciple; and I speak to you as to my school-fellows. For I ought to be trained by you for the contest in faith, in admonition, in endurance, in long-suffering.


    But, since love doth not suffer me to be silent concerning you, therefore was I forward to exhort you, that ye run in harmony with the mind of God: for Jesus Christ also, our inseparable life, is the mind of the Father, even as the bishops that are settled in the farthest parts of the earth are in the mind of Jesus Christ.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'I do not command you, as though I were somewhat. For even though I am in bonds for the Name''s sake, I am not yet perfected in Jesus Christ. [For] now am I beginning to be a disciple; and I speak to you as to my school-fellows. For I ought to be trained by you for the contest in faith, in admonition, in endurance, in long-suffering.


    But, since love doth not suffer me to be silent concerning you, therefore was I forward to exhort you, that ye run in harmony with the mind of God: for Jesus Christ also, our inseparable life, is the mind of the Father, even as the bishops that are settled in the farthest parts of the earth are in the mind of Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: ko
  text: '나는 내가 대단한 사람인 양 여러분에게 명령하지 않습니다. 비록 그 이름을 위하여 결박되어 있지만, 나는 아직 예수 그리스도 안에서 온전하게 되지 못했습니다. [a]나는 이제 막 제자가 되기 시작하며, 여러분에게 함께 배우는 이들에게 하듯 말합니다. 나는 믿음과 훈계와 인내와 오래 참음에 관하여 여러분에게 훈련을 받아야 합니다.


    그러나 사랑이 여러분에 대하여 침묵하지 못하게 하므로, 나는 여러분이 하나님의 뜻과 조화를 이루어 달려가도록 열심히 권면하였습니다. 우리에게서 떼어 놓을 수 없는 생명이신 예수 그리스도께서 아버지의 뜻이신 것처럼, 땅끝의 모든 곳에 세워진 감독들도 예수 그리스도의 뜻 안에 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영문 증언은 이 문장 첫머리의 연결어 ‘이는/왜냐하면’을 대괄호로 표시하여, 본문 복원에 따른 표현임을 알립니다. 한국어 본문에서도 그 신호를 보존하였습니다.
    reason: 제공된 증언에 나타난 본문 복원 표지를 독자에게 알리기 위함입니다.
lexical_decisions:
- source_word: for the Name's sake
  choice: 그 이름을 위하여
  rationale: ‘이름’이 누구를 가리키는지 본문이 명시하지 않는 신학적 함축을 보존하였습니다.
- source_word: school-fellows
  choice: 함께 배우는 이들
  rationale: 문자적인 학교 용어보다 자연스럽게 제자도의 공동 학습 관계를 드러내면서도, 저자가 자신을 그들과 같은 배움의 자리에 둔다는 뜻을 보존하였습니다.
- source_word: contest
  choice: 경기
  rationale: 훈련과 연결되는 운동 경기의 비유를 유지하였습니다.
- source_word: long-suffering
  choice: 오래 참음
  rationale: ‘endurance’와의 병렬을 살리기 위해 이를 각각 ‘인내’와 ‘오래 참음’으로 구별하였습니다.
- source_word: mind
  choice: 뜻
  rationale: 문맥상 의향·뜻·지향을 나타내는 표현으로 읽되, 하나님·그리스도·감독들을 잇는 반복 구조를 동일한 말로 유지하였습니다.
- source_word: bishops
  choice: 감독들
  rationale: 초기 그리스도교 직분을 가리키는 전통적이고 널리 이해되는 한국어 명칭을 사용하였습니다.
theological_decisions:
- issue: ‘그 이름’의 지시 대상
  choice: 대상을 보충하지 않고 ‘그 이름’으로 유지함
  alternative: ‘예수의 이름’ 또는 ‘그리스도의 이름’
  rationale: 문맥상 그리스도를 가리킬 가능성이 높지만, 증언 본문 자체의 완곡한 표현과 함축을 보존하였습니다.
- issue: ‘예수 그리스도는 아버지의 뜻’이라는 진술
  choice: ‘예수 그리스도께서도 아버지의 뜻이십니다’로 직접 옮김
  alternative: ‘아버지의 뜻과 하나이십니다’ 또는 ‘아버지의 뜻을 나타내십니다’
  rationale: 원문의 강한 동일시와 신학적 긴장을 해설적으로 완화하지 않았습니다.
- issue: 감독들이 ‘예수 그리스도의 뜻 안에’ 있다는 표현
  choice: 관계의 성격을 풀어 쓰지 않고 그대로 유지함
  alternative: ‘예수 그리스도의 뜻에 일치합니다’
  rationale: 소속, 일치, 지향을 함께 함축할 수 있는 표현의 여지를 보존하였습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용하였으며, 초기 그리스도교 권면문의 겸손하고 장중한 어조를 유지하였습니다. 그리스어 원문에 대한 직접 검토가 아직 이루어지지 않았으므로, 제공된 공용 영문 증언과 감수용 영문 POB를 바탕으로 한 잠정 번역입니다.
