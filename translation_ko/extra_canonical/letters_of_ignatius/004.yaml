  terminology: ‘그 이름’, ‘예수 그리스도’, ‘감독들’, ‘인내/오래 참음’의 구별은 적절합니다. 반복되는 mind는 신학적으로 해설하지 않고 ‘뜻’으로 통일할 수 있습니다. ‘우리와 떼어 놓을 수 없는 생명’은 자연스럽지만, 원문의 관계를 더 분명히 하여 ‘우리에게서 떼어 놓을 수 없는 생명’으로 다듬었습니다.
