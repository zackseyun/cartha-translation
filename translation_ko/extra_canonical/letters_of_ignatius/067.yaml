base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: ko
  text: '해로운 풀들을 멀리하십시오. 그것들은 예수 그리스도의 경작에 속한 것이 아니며, 아버지께서 심으신 것도 아니기 때문입니다. 내가 여러분 가운데서 발견한 것은 분열이 아니라 가려짐입니다.[a]


    하나님과 예수 그리스도께 속한 사람들은 모두 감독과 함께 있습니다. 또한 회개하여 교회의 하나 됨 안으로 들어오는 사람들도 하나님께 속하게 되어, 예수 그리스도를 따라 살도록 할 것입니다. 나의 형제자매 여러분, 속지 마십시오.


    분열을 일으키는 사람을 따르는 이는 누구든지 하나님의 나라를 상속받지 못합니다. 낯선 가르침을 따라 사는 이는 누구든지 그리스도의 수난과 교제가 없습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가려짐’은 제공된 영어 증언의 ‘filtering’에 상응하는 이례적 표현입니다. 그리스어 διυλισμός는 문맥상 가려 냄이나 정화의 뉘앙스를 지닐 수 있으나, 여기서는 그 뜻을 하나로 확정하지 않았습니다.
    reason: 이 표현의 정확한 비유적 의도는 확정하기 어려우므로, 해석적으로 ‘정화’나 ‘분별’로 평탄화하지 않고 불확실성을 보존합니다.
lexical_decisions:
- source_word: noxious herbs
  choice: 해로운 풀들
  rationale: 농경과 심기의 비유를 유지하면서도 현대 독자가 즉시 이해할 수 있는 표현으로 옮겼습니다.
- source_word: husbandry
  choice: 경작물
  rationale: 뒤따르는 ‘심으신 것’과 농경 비유의 결을 맞추고, 사람이나 가르침을 식물에 빗대는 원문의 긴장을 보존했습니다.
- source_word: filtering
  choice: 걸러 냄
  rationale: 제공된 영어 증언 자체가 이례적인 표현을 해석하지 않고 보존하므로, ‘정화’나 ‘분별’로 단정하지 않고 문자적이고 열린 표현을 택했습니다.
- source_word: unity of the Church
  choice: 교회의 하나 됨
  rationale: 제도적 통합만을 뜻하는 것으로 좁히지 않으면서 공동체적 일치를 자연스러운 현대 한국어로 나타냈습니다.
- source_word: strange doctrine
  choice: 낯선 가르침
  rationale: ‘이단’처럼 후대의 교리적 판정을 직접 도입하지 않고, 공동체에 이질적인 가르침이라는 의미를 보존했습니다.
- source_word: passion
  choice: 그리스도의 수난
  rationale: 초기 그리스도교 문맥에서 예수 그리스도의 고난과 죽음을 가리키는 관용적 용례를 반영하되, 참여의 성격은 본문이 규정하는 것 이상으로 설명하지 않았습니다.
theological_decisions:
- issue: 감독과 함께하는 것과 하나님께 속하는 것의 관계
  choice: ‘하나님과 예수 그리스도께 속한 사람들은 모두 감독과 함께합니다’로 진술
  alternative: 감독에게 복종해야만 구원받는다는 조건문으로 풀어 씀
  rationale: 본문의 공동체적 진술을 그대로 유지하고, 구원의 절대 조건에 관한 후대의 교회론적 체계로 확대하지 않았습니다.
- issue: ‘교회의 하나 됨’으로 들어오는 회개자의 상태
  choice: ‘하나님께 속하게 되어, 예수 그리스도를 따라 살게 될 것’으로 번역
  alternative: 이미 자동적으로 구원받는다고 명시
  rationale: 목적과 결과가 맞물린 원문의 표현을 보존하고, 구원론적 단계를 본문보다 세밀하게 확정하지 않았습니다.
- issue: 수난과의 교제
  choice: ‘그리스도의 수난에 참여하지 못합니다’
  alternative: 성찬 참여 자격이 없다는 뜻으로 한정
  rationale: ‘교제’가 함축하는 참여를 표현하되, 그것을 특정 성례전이나 단일한 교리 개념으로 제한하지 않았습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 권면과 경고의 단호함은 유지하되 고어체는 피했습니다. 제공 자료가 공공 영역 영어 증언이며 그리스어 원문 직접 검토가 보류된 상태이므로, 특히 ‘filtering’은 해석적으로 평탄화하지 않고 각주로 불확실성을 밝혔습니다.
