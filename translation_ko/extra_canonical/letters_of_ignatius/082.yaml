base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: ko
  text: '아무도 속지 마십시오. 하늘에 있는 존재들과 천사들의 영광과 보이는 통치자들과 보이지 않는 통치자들까지도, 그리스도[곧 하나님이신 분]의 피를 믿지 않는다면 그들 역시 심판을 받게 될 것입니다. 받아들일 수 있는 사람은 받아들이십시오. 아무도 직분 때문에 교만해지지 마십시오. 믿음과 사랑이 가장 중요하며, 그 무엇도 이것들보다 앞설 수 없기 때문입니다.


    우리에게 이른 예수 그리스도의 은혜에 관하여 낯선 교리를 주장하는 자들이 어떻게 하나님의 뜻을 거스르는지 유의해 보십시오. 그들은 사랑에도, 과부에게도, 고아에게도, 고난받는 사람에게도, 갇힌 사람에게도, 굶주리거나 목마른 사람에게도 관심이 없습니다. 그들은 성찬[a]과 기도를 멀리합니다. 성찬이 우리 구주 예수 그리스도의 살, 곧 우리의 죄를 위하여 고난받았으며 아버지께서 선하심으로 다시 일으키신 그 살임을 인정하지 않기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성찬’으로 옮긴 말은 본래 ‘감사’를 뜻합니다.
    reason: 제공된 영어 증언의 괄호 풀이 thanksgiving을 자연스러운 한국어 본문을 해치지 않으면서 보존하기 위해서입니다.
lexical_decisions:
- source_word: heavenly beings
  choice: 하늘에 있는 존재들
  rationale: 직접 그리스어 검토가 보류된 상태에서 영어 증언의 포괄적 표현을 유지하고, 특정 천상 존재의 계급으로 한정하지 않았습니다.
- source_word: rulers visible and invisible
  choice: 보이는 통치자들과 보이지 않는 통치자들
  rationale: 가시적·비가시적 권세를 함께 가리키는 병렬 구조를 보존했습니다.
- source_word: office
  choice: 직분
  rationale: 공동체 안의 지위나 직책을 뜻하는 문맥에 맞추되 성직의 특정 체계로 좁히지 않았습니다.
- source_word: mind of God
  choice: 하나님의 뜻
  rationale: 한국어에서 자연스럽게 하나님의 의향과 의지를 나타내면서 문맥의 윤리적 대조를 살렸습니다.
- source_word: eucharist (thanksgiving)
  choice: 성찬[a]
  rationale: 현대 한국어 독자가 이해하기 쉬운 통용어를 본문에 두고, 원어의 감사 의미는 각주에서 밝혔습니다.
- source_word: flesh
  choice: 살
  rationale: 그리스도의 실제 육체와 수난을 강조하는 논지를 흐리지 않도록 구체적인 표현을 택했습니다.
- source_word: raised up
  choice: 다시 일으키신
  rationale: 부활을 가리키면서도 영어 증언의 동사적 표현을 살리고, 추상 명사로 바꾸지 않았습니다.
theological_decisions:
- issue: ‘그리스도[곧 하나님이신 분]’이라는 괄호 구절의 본문 상태
  choice: 대괄호를 그대로 보존
  alternative: 괄호 없이 본문에 통합하거나 삭제
  rationale: 제공된 증언이 이 구절을 본문 비평상의 신호로 제시하므로, 그 신학적 진술을 확정하거나 배제하지 않고 불확실성을 드러냈습니다.
- issue: 성찬과 그리스도의 살의 관계
  choice: ‘성찬이 … 살 … 임을 인정하지 않는다’로 직접 진술
  alternative: 상징적 의미로 풀어 번역
  rationale: 본문이 제시하는 강한 동일성 진술과 성육신·수난 논증을 해석적으로 약화하거나 특정 교파의 성찬론으로 재구성하지 않았습니다.
- issue: ‘받아들일 수 있는 사람은 받아들이라’의 대상
  choice: 대상을 보충하지 않고 모호성을 유지
  alternative: 이 가르침 또는 그리스도의 피를 받아들이라고 명시
  rationale: 짧은 격언형 문장의 지시 대상이 분명하지 않으므로 번역에서 임의로 확정하지 않았습니다.
- issue: 아버지의 선하심과 부활 행위의 관계
  choice: ‘아버지께서 선하심으로 다시 일으키신’
  alternative: ‘선하신 아버지께서 다시 살리신’
  rationale: 아버지의 선하심이 부활 행위의 방식이나 동기로 연결되는 원 증언의 구조를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면과 경고에는 단정하고 엄숙한 문체를 유지하되, 고어적 어순은 피했습니다. 다만 직접 그리스어 원문 검토가 아직 보류되어 있으므로, 제공된 중간 본문계열의 공공 영역 영어 증언을 근거로 한 잠정 출판 초안입니다.
