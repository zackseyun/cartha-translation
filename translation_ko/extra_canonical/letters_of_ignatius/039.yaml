base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: ko
  text: 테오포로스라고도 하는 이그나티우스가 예수 그리스도의 아버지이신 하나님의 사랑을 받는 교회, 곧 아시아의 트랄레스에 있는 거룩한 교회에 문안합니다. 이 교회는 선택받았고 하나님께 합당하며, 우리의 소망이신 예수 그리스도의 수난을 통하여 육과 영으로 평화를 누리고, 우리가 그분께로 부활함으로써 그 소망에 이릅니다.[a] 나 또한 사도들의 방식에 따라 하나님의 충만함 가운데 이 교회에 문안하며, 넘치는 기쁨이 있기를 바랍니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리가 그분께로 부활함으로써’에 해당하는 구절은 제공된 영어 증언을 따른 잠정 번역입니다. 그리스어 원문을 직접 검토하면 문장 구조와 의미 관계가 달라질 수 있습니다.
    reason: 원자료가 그리스어 직접 대조 이전의 영어 증언이며, 이 구절의 통사 관계가 특히 불확실합니다.
  - marker: b
    text: ‘넘치는 기쁨이 있기를 바랍니다’는 고대 서신의 풍성한 인사 표현을 자연스럽게 옮긴 것입니다. 직역하면 ‘많이 기뻐하기를’ 또는 ‘풍성한 문안을’에 가깝습니다.
    reason: 원문의 서신 관용구가 한국어 직역으로는 어색하며 ‘문안’과 ‘기쁨’의 의미가 겹칩니다.
lexical_decisions:
- source_word: Theophorus (Θεοφόρος 추정)
  choice: 테오포로스
  rationale: 고유한 별칭의 의미를 본문에서 단정해 번역하지 않고 음역하여, ‘하나님을 지닌 자’ 또는 ‘하나님께서 지니신 자’로 이해될 수 있는 어원적 여지를 보존했습니다.
- source_word: passion (πάθος 추정)
  choice: 수난
  rationale: 예수 그리스도의 고난과 죽음을 가리키는 초기 그리스도교의 문맥을 존중하면서도 현대 한국어 독자가 이해할 수 있는 전통적이고 품위 있는 표현을 택했습니다.
- source_word: in flesh and spirit
  choice: 육과 영으로
  rationale: 인간 존재의 두 측면 또는 공동체적 평화의 범위를 나타낼 수 있는 원문의 병렬 구조를 해소하지 않고 유지했습니다.
- source_word: Divine plenitude
  choice: 하나님의 충만함 가운데
  rationale: ‘충만함’의 신학적 밀도를 보존하되, 한국어에서 자연스럽도록 관계를 나타내는 표현을 보충했습니다.
- source_word: abundant greeting (πλεῖστα χαίρειν 추정)
  choice: 넘치는 기쁨이 있기를 바랍니다
  rationale: 서신의 관용적 인사말이 지닌 ‘문안하다/기뻐하다’의 언어유희와 풍성한 축원의 뜻을 자연스러운 한국어로 전달했습니다.
theological_decisions:
- issue: ‘우리의 부활’과 ‘그분께로’의 관계
  choice: 우리가 그분께로 부활함으로써 그 소망에 이릅니다
  alternative: 그분 안에서 우리의 부활을 통하여 그분은 우리의 소망이십니다
  rationale: 제공된 증언의 ‘our resurrection unto Him’이라는 방향성을 보존하려 했으나, 그리스어 직접 대조가 아직 이루어지지 않았으므로 문법적 관계를 확정하지 않고 각주로 잠정성을 밝혔습니다.
- issue: ‘하나님께 합당한’의 수식 대상
  choice: 교회가 하나님께 합당하다고 번역
  alternative: 하나님께서 선택하신 존귀한 교회
  rationale: 영어 증언의 ‘elect and worthy of God’이라는 병렬 수식을 그대로 보존하여 교회에 적용했습니다.
- issue: ‘사도들의 방식’의 의미
  choice: 사도들의 방식에 따라
  alternative: 사도적 권위로
  rationale: 이 표현을 교리적 권위 주장으로 확대하지 않고 서신의 인사 방식에 대한 묘사로 남겨 두었습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 그리스도교 서신의 장중함은 유지하되 지나치게 고어적인 표현은 피했습니다. 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 중간판 그리스어 사본 전통에 대한 직접 검토가 필요합니다.
