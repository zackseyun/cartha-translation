  source_fidelity: 핵심 구절 κατὰ Χριστὸν Ἰησοῦν은 시간적으로 ‘그리스도 예수 이후에’라는 뜻보다 ‘그리스도 예수에 따라/그분을 따라’라는 뜻으로 옮기는 것이 문맥과 그리스어 용법에 부합합니다. 따라서 초안의 본문 선택은 대체로 적절합니다. 다만 영어 증언의 ‘divine prophets’는 단순히 ‘하나님의 예언자들’보다 예언자들의 신적 영감 또는 거룩한 성격을 강조하므로 ‘거룩한 예언자들’로 옮기는 편이 더 가깝습니다. 또한 ‘그들은 … 하려 했습니다’는 원문의 목적절에 예언자들의 별도 의도를 다소 보태므로, 목적을 직접 나타내도록 다듬었습니다.
