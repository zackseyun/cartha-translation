source:
  text: 'Be not seduced by strange doctrines nor by antiquated fables, which are profitless. For if even unto this day we live after the manner of Judaism, we avow that we have not received grace:


    for the divine prophets lived after Christ Jesus. For this cause also they were persecuted, being inspired by His grace to the end that they which are disobedient might be fully persuaded that there is one God who manifested Himself through Jesus Christ His Son, who is His Word that proceeded from silence, who in all things was well-pleasing unto Him that sent Him.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Be not seduced by strange doctrines nor by antiquated fables, which are profitless. For if even unto this day we live after the manner of Judaism, we avow that we have not received grace:


    for the divine prophets lived after Christ Jesus. For this cause also they were persecuted, being inspired by His grace to the end that they which are disobedient might be fully persuaded that there is one God who manifested Himself through Jesus Christ His Son, who is His Word that proceeded from silence, who in all things was well-pleasing unto Him that sent Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: ko
  text: '낯선 가르침이나 아무 유익도 없는 옛이야기에 미혹되지 마십시오. 우리가 오늘날까지도 유대교를 따라 산다면, 우리는 은혜를 받지 못하였음을 인정하는 것입니다.


    거룩한 예언자들은 그리스도 예수를 따라 살았습니다. 이 때문에 그들도 박해를 받았습니다. 그들은 그분의 은혜로 영감을 받아, 순종하지 않는 이들이 그분의 아들 예수 그리스도를 통하여 자신을 나타내신 한 분 하나님이 계심을 온전히 확신하도록 하였습니다. 그 아들은 침묵에서 나오신 그분의 말씀이시며, 모든 일에서 자신을 보내신 분을 기쁘시게 하셨습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: strange doctrines
  choice: 낯선 가르침
  rationale: 이질적이고 공동체를 미혹하는 교훈이라는 뜻을 자연스러운 현대 한국어로 전달했습니다.
- source_word: antiquated fables
  choice: 옛이야기
  rationale: 오래되었다는 이유만으로 권위를 주장하지만 유익하지 않은 이야기라는 문맥을 살렸습니다. ‘신화’는 현대 독자에게 특정 장르로 좁게 들릴 수 있어 피했습니다.
- source_word: after the manner of Judaism
  choice: 유대교의 방식대로
  rationale: 그리스도 이후에도 유대교적 삶의 체계를 따르는 것을 가리키되, 유대 민족 자체를 비하하는 표현이 되지 않도록 했습니다.
- source_word: His Word that proceeded from silence
  choice: 침묵에서 나오신 하나님의 말씀
  rationale: ‘침묵’과 ‘나오다’라는 독특한 원문의 신학적 표상을 해석으로 평준화하지 않고 보존했습니다.
- source_word: well-pleasing
  choice: 기쁘시게 하셨습니다
  rationale: 보내신 분의 뜻에 전적으로 합당했다는 관계적 의미를 자연스러운 합쇼체로 표현했습니다.
theological_decisions:
- issue: 예언자들이 ‘그리스도 예수 이후/따라’ 살았다는 표현
  choice: 그리스도 예수를 따라 살았습니다
  alternative: 그리스도 예수에 따라 살았습니다 / 그리스도 예수 이후에 살았습니다
  rationale: 문맥은 예언자들이 시간적으로 예수 이후에 살았다는 뜻이 아니라 그리스도를 지향하고 그분에 따른 삶을 살았다는 역설적 진술로 이해하는 것이 자연스럽습니다. 다만 직접 그리스어 검토가 보류되어 있어 각주로 불확실성을 밝혔습니다.
- issue: 하나님의 자기 계시와 아들의 관계
  choice: 그 하나님께서는 자신의 아들 예수 그리스도를 통하여 자신을 나타내셨습니다
  alternative: 그분은 자신의 아들 예수 그리스도를 통하여 나타나셨습니다
  rationale: 하나님이 아들을 통하여 자신을 계시하셨다는 구문을 분명히 하면서도, 성부와 성자를 동일 인격으로 합치는 해석은 피했습니다.
- issue: 말씀이 침묵에서 나왔다는 진술
  choice: 침묵에서 나오신 하나님의 말씀
  alternative: 침묵 가운데서 나온 그분의 말씀
  rationale: 이그나티우스의 압축적이고 신학적으로 긴장된 표현을 설명적으로 해소하지 않고 그대로 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 권면적인 합쇼체를 사용했습니다. 초기 기독교 문헌의 엄숙함을 유지하되 ‘고백하는 셈입니다’, ‘감동을 받아’처럼 일반 독자가 이해할 수 있는 표현을 택했습니다. 원어 검토가 보류된 자료이므로 확정하기 어려운 구절은 본문에서 과도하게 해석하지 않고 각주로 표시했습니다.
