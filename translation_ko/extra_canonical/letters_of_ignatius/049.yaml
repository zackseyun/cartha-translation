  english_witness: But if it were as certain persons who are godless, that is unbelievers, say, that He suffered only in semblance, being themselves mere semblance, why am I in bonds? And why also do I desire to fight with wild beasts? So I die in vain. Truly then I lie against the Lord.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: ko
  text: 그러나 하나님을 인정하지 않는 어떤 사람들, 곧 믿지 않는 사람들이 말하듯이 그분께서 겉으로만 고난을 받으신 것이라면—그들 자신도 겉모습에 불과한 자들입니다—나는 왜 결박되어 있습니까? 또 나는 왜 들짐승들과 싸우기를 바랍니까? 그렇다면 나는 헛되이 죽는 것입니다. 참으로 그렇다면 나는 주님을 두고 거짓말하는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless, that is unbelievers
  choice: 하나님을 인정하지 않는 어떤 사람들, 곧 믿지 않는 사람들
  rationale: ‘godless’를 단순한 도덕적 비난인 ‘불경건한’으로만 옮기지 않고, 이어지는 동격 설명 ‘unbelievers’와 자연스럽게 연결했습니다.
- source_word: suffered only in semblance
  choice: 겉으로만 고난을 받으신
  rationale: 고난이 실제가 아니라 외관상으로만 일어났다는 주장을 명료하게 전달하면서도 후대의 교리 용어를 본문에 직접 도입하지 않았습니다.
- source_word: being themselves mere semblance
  choice: 그들 자신도 겉모습에 불과한 자들입니다
  rationale: ‘semblance’의 반복을 살려 반어적 말맛을 보존했습니다.
- source_word: in bonds
  choice: 결박되어
  rationale: 투옥 상태를 나타내는 고대 서신의 표현을 존엄하고 익숙한 성서 문체로 옮겼습니다.
- source_word: fight with wild beasts
  choice: 들짐승들과 싸우기
  rationale: 공개 경기장에서 맹수와 맞서는 상황을 가리키되, 영어 증언이 확정하지 않는 구체적 배경을 덧붙이지 않았습니다.
- source_word: lie against the Lord
  choice: 주님을 두고 거짓말하는 것
  rationale: 주님에 관하여 거짓 증언한다는 뜻을 자연스럽게 나타내며, 원문의 다소 압축된 관계를 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: 그리스도의 고난이 실제였는지 외관에 불과했는지에 관한 논박
  choice: ‘겉으로만 고난을 받으신 것이라면’으로 조건문과 논박 구조를 보존했습니다.
  alternative: ‘고난받는 것처럼 보이셨을 뿐이라면’
  rationale: 본문은 특정 집단의 주장을 반박하지만 그들의 체계를 상세히 규정하지 않으므로, 역사적 명칭이나 후대의 교리 분류를 첨가하지 않았습니다.
- issue: ‘그들 자신도 mere semblance’의 의미
  choice: ‘그들 자신도 겉모습에 불과한 자들’이라는 반어를 그대로 유지했습니다.
  alternative: ‘그들 자신도 실재하지 않는 자들’
  rationale: 존재론적 부정으로 단정하기보다 동일 어휘의 수사적 되받아침을 보존했습니다.
- issue: 순교의 의미와 거짓 증언의 결론
  choice: ‘헛되이 죽는 것’과 ‘주님을 두고 거짓말하는 것’을 조건문의 귀결로 제시했습니다.
  alternative: ‘나는 까닭 없이 죽고, 주님께 거짓말하는 셈입니다’
  rationale: 실제 고난의 부정이 저자의 결박과 순교 열망을 무의미하게 만든다는 논증을 유지하면서, ‘against’를 ‘주님께’로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문장은 존엄한 서신 문체를 유지하되 일반 독자가 이해할 수 있도록 구성했으며, 삽입된 반어는 대시로 구분했습니다. 직접 그리스어 대조가 아직 이루어지지 않았으므로 공공 영역 영어 증언을 바탕으로 한 잠정 초안입니다.
