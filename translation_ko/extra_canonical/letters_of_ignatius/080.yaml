source:
  text: 'But these things I warn you, dearly beloved, knowing that ye yourselves are so minded. Howbeit I watch over you betimes to protect you from wild beasts in human form--men whom not only should ye not receive, but, if it were possible, not so much as meet [them]; only pray ye for them, if haply they may repent. This indeed is difficult, but Jesus Christ, our true life, hath power over it.


    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'But these things I warn you, dearly beloved, knowing that ye yourselves are so minded. Howbeit I watch over you betimes to protect you from wild beasts in human form--men whom not only should ye not receive, but, if it were possible, not so much as meet [them]; only pray ye for them, if haply they may repent. This indeed is difficult, but Jesus Christ, our true life, hath power over it.


    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: ko
  text: '그러나 사랑하는 여러분, 여러분 자신도 그렇게 생각하고 있음을 알면서도 나는 이 일들을 경고합니다. 그럼에도 나는 사람의 모습을 한 들짐승들에게서 여러분을 지키려고 미리 살핍니다. 그런 사람들은 맞아들이지 말아야 할 뿐 아니라, 할 수만 있다면 만나지도 마십시오. 다만 그들이 혹시 회개할 수 있도록 기도하십시오. 참으로 이것은 어려운 일이지만, 우리의 참생명이신 예수 그리스도께서는 그것을 이루실 능력이 있으십니다.


    우리 주님께서 이 일들을 겉모습으로만 겪으셨다면, 나도 겉모습으로만 갇힌 사람일 것입니다. 그렇다면 내가 어찌하여 죽음과 불과 칼과 들짐승들에게 나 자신을 내어주었겠습니까? 그러나 칼에 가까우면 하나님께 가깝고, 들짐승들과 함께하면 하나님과 함께합니다. 오직 예수 그리스도의 이름을 위한 일이 되게 하여, 우리가 그분과 함께 고난받게 하십시오. 나는 모든 것을 견딥니다. 완전한 사람이신 그분께서 친히 내게 힘을 주시기 때문입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 중간본 그리스어 전승에 대한 직접 검토가 아직 필요합니다.
    reason: 직접적인 그리스어 원문 검토가 보류 중이라는 자료상의 한계를 독자에게 투명하게 밝힙니다.
lexical_decisions:
- source_word: wild beasts in human form
  choice: 사람의 모습을 한 들짐승들
  rationale: 적대자들을 짐승에 빗댄 강한 은유를 완화하지 않고 자연스러운 한국어로 보존했습니다.
- source_word: receive
  choice: 맞아들이다
  rationale: 단순히 의견을 받아들이는 것이 아니라 사람을 공동체나 집에 영접하는 의미를 드러냅니다.
- source_word: in semblance
  choice: 겉모습으로만
  rationale: 주님의 고난이 실제가 아니라 외관상으로만 일어났다는 주장을 나타내며, 두 문장에서 반복되는 논증 구조를 보존합니다.
- source_word: our true life
  choice: 우리의 참생명
  rationale: 그리스도가 생명의 근원이자 생명 자체라는 압축된 고백을 명사구로 유지했습니다.
- source_word: perfect Man
  choice: 완전한 사람
  rationale: 그리스도의 참된 인간성을 강조하는 표현을 성별에 불필요하게 한정하지 않으면서 그대로 전달했습니다.
theological_decisions:
- issue: 그리스도의 고난이 외관상 사건이었다는 주장에 대한 반박
  choice: ‘겉모습으로만 겪으셨다면’과 ‘겉모습으로만 갇힌 사람’을 평행하게 번역했습니다.
  alternative: ‘가상으로’ 또는 ‘환상으로’
  rationale: 특정 후대 교리 용어를 본문에 직접 끌어오지 않고, 이그나티우스의 조건 논증과 반복을 보존했습니다.
- issue: ‘in the name of Jesus Christ’가 수식하는 대상
  choice: ‘오직 예수 그리스도의 이름을 위한 일이 되게 하여’로 번역했습니다.
  alternative: ‘오직 예수 그리스도의 이름 안에서’
  rationale: 고난과 투옥이 그리스도의 이름 때문에 이루어진다는 문맥적 의미를 자연스럽게 표현하되, 전치사구의 범위를 지나치게 확정하지 않았습니다.
- issue: ‘perfect Man’의 그리스도론적 강조
  choice: ‘완전한 사람이신 그분’
  alternative: ‘완전한 인간이신 분’ 또는 ‘온전한 사람이신 분’
  rationale: 참된 인간성을 명시하면서도 한국어에서 dignified하고 이해하기 쉬운 표현을 택했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 권면 부분은 명료한 명령형으로, 순교 고백 부분은 짧고 반복적인 대구를 살려 번역했습니다. ‘들짐승’, ‘칼’, ‘하나님과 함께’ 같은 강렬한 원문 이미지는 완화하지 않았습니다.
