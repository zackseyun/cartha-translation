review_pass:
  verdict: revise
  source_fidelity: 수정안은 핵심 대조와 논증을 보존합니다. 특히 마지막 문장은 영어 증언의 다소 완곡한 “Only let it be”를 따르기보다, ‘예수 그리스도의 이름 안에서 그분과 함께 고난을 받기 위하여 모든 것을 견딘다’는 원문의 압축된 목적 표현에 맞추었습니다. ‘겉모습으로만’의 반복도 보존했습니다.
  naturalness: 초안의 ‘미리 살핍니다’, ‘갇힌 사람일 것입니다’, ‘그 일을 이루실 능력이 있으십니다’, ‘일이 되게 하여’는 각각 현대 한국어에서 부자연스럽거나 원문의 현재적·목적적 연결을 흐립니다. 이를 ‘미리 지켜 드립니다’, ‘갇혀 있는 것입니다’, ‘이 일을 능히 이루실 수 있습니다’, ‘…위하여 모든 것을 견딥니다’로 고쳤습니다. 합쇼체의 권면과 고백의 문체도 유지했습니다.
  terminology: ‘사람의 모습을 한 들짐승들’, ‘맞아들이다’, ‘회개하다’, ‘겉모습으로만’, ‘우리의 참생명’, ‘완전한 인간’은 강한 은유와 그리스도론적 대조를 불필요하게 교리화하지 않고 전달합니다. ‘완전한 인간’은 여기서 성별을 특정하지 않는 현대 한국어 표현입니다.
  issues:
  - severity: medium
    issue: ‘나는 … 미리 살핍니다’
    rationale: 보호를 위해 미리 지킨다는 뜻을 ‘살피다’로 옮기면 단순 관찰처럼 들려 보호 행위가 약화됩니다.
  - severity: medium
    issue: ‘나도 겉모습으로만 갇힌 사람일 것입니다’
    rationale: 조건절에 따른 현재의 역설적 결론을 미래·추정처럼 표현하여 원문의 단호한 논증이 약해집니다.
  - severity: high
    issue: ‘오직 예수 그리스도의 이름을 위한 일이 되게 하여, 우리가 그분과 함께 고난받게 하십시오’
    rationale: 원문의 ‘예수 그리스도의 이름 안에서 그분과 함께 고난을 받기 위하여 모든 것을 견딘다’는 목적 연결을 독자에게 하는 명령으로 바꾸며, ‘모든 것을 견딘다’와의 문법적 연결을 끊습니다.
  revised_text: '그러나 사랑하는 여러분, 여러분 자신도 그렇게 생각하고 있음을 알기에, 나는 이 일들에 관하여 여러분에게 미리 경고합니다. 그럼에도 나는 사람의 모습을 한 들짐승들에게서 여러분을 지키려고 미리 지켜 드립니다. 그런 사람들은 맞아들이지 말아야 할 뿐 아니라, 할 수만 있다면 그들을 만나지도 마십시오. 다만 그들이 혹시 회개할 수 있도록 기도하십시오. 이 일은 참으로 어렵습니다. 그러나 우리의 참생명이신 예수 그리스도께서는 이 일을 능히 이루실 수 있습니다.


    우리 주님께서 이 일들을 겉모습으로만 겪으셨다면, 나 역시 겉모습으로만 갇혀 있는 것입니다. 그렇다면 내가 어찌하여 죽음과 불과 칼과 들짐승들에게 나 자신을 내어주었겠습니까? 그러나 칼 가까이에 있으면 하나님 가까이에 있고, 들짐승들과 함께 있으면 하나님과 함께 있습니다. 나는 오직 예수 그리스도의 이름 안에서 그분과 함께 고난을 받기 위하여 모든 것을 견딥니다. 완전한 인간이신 그분께서 친히 나를 강하게 하시기 때문입니다.[a]'
  revised_footnotes:
