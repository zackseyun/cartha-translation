  - severity: low
    issue: ‘하나님께 참여하다’의 현대 한국어 어법
    rationale: 의미 보존의 의도는 타당하지만 ‘~께 참여하다’는 자연스러운 결합이 아닙니다. ‘하나님 안에 참여하다’가 참여의 의미 폭을 보존하면서 더 자연스럽습니다.
