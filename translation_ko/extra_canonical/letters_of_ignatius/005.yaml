  english_witness: 'So then it becometh you to run in harmony with the mind of the bishop; which thing also ye do. For your honorable presbytery, which is worthy of God, is attuned to the bishop, even as its strings to a lyre. Therefore in your concord and harmonious love Jesus Christ is sung.


    And do ye, each and all, form yourselves into a chorus, that being harmonious in concord and taking the key note of God ye may in unison sing with one voice through Jesus Christ unto the Father, that He may both hear you and acknowledge you by your good deeds to be members of His Son. It is therefore profitable for you to be in blameless unity, that ye may also be partakers of God always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: ko
  text: '그러므로 여러분은 감독의 뜻과 조화를 이루어 함께 달리는 것이 마땅합니다. 실제로 여러분은 그렇게 하고 있습니다. 하나님께 합당한 여러분의 존귀한 장로회는 수금의 줄들이 수금에 맞추어지듯 감독과 조율되어 있습니다. 그러므로 여러분의 일치와 조화로운 사랑 가운데서 예수 그리스도께서 노래로 울려 퍼지십니다.


    여러분은 한 사람 한 사람 모두가 합창단을 이루십시오. 그리하여 일치 가운데 조화를 이루고 하나님께서 주시는 음을 받아, 한마음 한목소리로 예수 그리스도를 통하여 아버지께 노래하십시오. 그러면 아버지께서 여러분의 노래를 들으시고, 여러분의 선한 행실을 통하여 여러분이 그분의 아들의 지체임을 알아보실 것입니다. 그러므로 여러분이 언제나 하나님께 참여할 수 있도록 흠 없는 일치 안에 머무는 것이 유익합니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 번역 증언과 중간형 그리스어 전승에 관한 제한된 정보를 바탕으로 한 잠정 번역입니다. 그리스어 원문에 대한 직접 대조가 이루어지면 어휘와 문장 구조가 조정될 수 있습니다.
    reason: 제공 자료가 ‘source-language review pending’이라고 명시하므로 번역 근거의 한계를 독자에게 투명하게 알립니다.
lexical_decisions:
- source_word: γνώμη τοῦ ἐπισκόπου (inferred from the Middle-recension Greek tradition)
  choice: 감독의 뜻
  rationale: ‘mind’를 현대 한국어에서 자연스럽게 표현하되, 감독의 판단·의향이라는 폭을 보존했습니다.
- source_word: πρεσβυτέριον (inferred)
  choice: 장로회
  rationale: 개별 장로들이 아니라 장로들의 집합적 회의를 가리키는 표현으로 옮겼습니다.
- source_word: συνηρμοσμένον / musical attunement imagery (inferred)
  choice: 조율되어 있습니다
  rationale: 수금과 합창으로 이어지는 음악적 비유를 일관되게 살렸습니다.
- source_word: μέλη τοῦ υἱοῦ αὐτοῦ (inferred)
  choice: 그분의 아들의 지체
  rationale: ‘members’를 단순 구성원이 아니라 몸의 지체라는 초기 그리스도교적 비유가 드러나도록 번역했습니다.
- source_word: μετέχειν θεοῦ (inferred)
  choice: 하나님께 참여하다
  rationale: ‘하나님을 나누어 갖다’, ‘하나님과 교제하다’로 의미를 좁히지 않고 참여의 강한 표현과 신학적 긴장을 보존했습니다.
theological_decisions:
- issue: 감독과 공동체의 조화
  choice: ‘감독의 뜻과 조화를 이루어 함께 달리는 것’
  alternative: ‘감독의 생각에 복종하는 것’
  rationale: 본문의 달리기와 음악적 조화 이미지를 보존하고, 원문이 명시하지 않은 절대적 복종 개념을 덧붙이지 않았습니다.
- issue: ‘예수 그리스도께서 노래된다’라는 수동 표현
  choice: ‘예수 그리스도께서 노래로 울려 퍼지십니다’
  alternative: ‘여러분이 예수 그리스도를 찬양합니다’
  rationale: 그리스도가 노래의 내용이 된다는 독특한 수동 구조를 유지하면서 한국어로 자연스럽게 표현했습니다.
- issue: 하나님의 인정과 선한 행실의 관계
  choice: ‘선한 행실을 통하여 … 알아보실 것’
  alternative: ‘선행 때문에 구원하실 것’
  rationale: 본문은 선행을 아들의 지체임을 알아보는 표지로 말하므로, 공로에 의한 구원이라는 해석을 끌어들이지 않았습니다.
- issue: 하나님께 참여함
  choice: 직역에 가까운 ‘하나님께 참여하다’
  alternative: ‘하나님과 늘 교제하다’
  rationale: 존재론적 참여와 관계적 교제 사이의 가능한 의미 폭을 성급히 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 교회의 직분명은 ‘감독’, ‘장로회’로 옮겼고, 수금·조율·합창·음이라는 연속된 음악 비유를 유지했습니다. 문체는 존엄성을 지키되 일반 독자가 이해할 수 있도록 고어적 표현을 피했습니다.
