base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: ko
  text: '악한 술책들을 피하십시오. 아니, 오히려 이런 일들에 관해 이야기하십시오.[a] 나의 자매들에게 주님을 사랑하고 육으로나 영으로나 자기 남편에게 만족하라고 말하십시오. 이와 같이 나의 형제들에게도 예수 그리스도의 이름으로, 주님께서 교회를 사랑하신 것처럼 자기 아내를 사랑하라고 명하십시오.


    누구든지 주님의 육체를 존귀하게 하려고 정결한 삶을 지킬 수 있다면, 자랑하지 말고 그렇게 하십시오.[b] 자랑한다면 그는 길을 잃은 것입니다. 또 감독 외의 사람에게까지 그것이 알려진다면 그는 더럽혀진 것입니다.[c] 남자든 여자든 혼인할 때에는 감독의 동의를 받아 결합하는 것이 마땅합니다. 이는 그 혼인이 욕정에 따른 것이 아니라 주님을 따르는 것이 되게 하려는 것입니다.[d] 모든 일을 하나님의 영광을 위하여 하십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 문장의 ‘이런 일들’이 정확히 무엇을 가리키는지는 문맥상 분명하지 않습니다. ‘악한 술책’을 직접 행하지 말고 그것을 분별하도록 말하라는 뜻으로 이해할 수 있습니다.
    reason: 대명사의 지시 대상과 명령문의 역설적 전환이 모호합니다.
  - marker: b
    text: 여기서 ‘정결한 삶’은 문맥상 혼인하지 않은 채 절제하며 사는 것을 가리킬 수 있습니다. 다만 제공된 영어 증언만으로 그 의미를 ‘독신’으로 완전히 한정하지 않았습니다.
    reason: 그리스어 원문 직접 검토가 보류되어 있으며 용어의 의미 범위를 보존해야 합니다.
  - marker: c
    text: ‘감독 외의 사람에게까지 알려진다면’은 제공된 영어 증언을 따른 잠정 번역입니다. 그리스어 본문을 직접 대조하면 문장 구조와 의미가 달리 확정될 수 있습니다.
    reason: 특히 ‘beyond the bishop’의 문법과 본문 전승을 원어로 재검토해야 합니다.
  - marker: d
    text: ‘주님을 따르는 혼인’은 욕정만을 좇는 결합과 대조되는, 주님의 뜻에 합당한 혼인을 뜻합니다.
    reason: ‘after the Lord’의 압축된 표현을 설명하되 특정 교파의 혼인 교리를 덧붙이지 않습니다.
lexical_decisions:
- source_word: 'κακοτεχνίας (witness: “evil arts”)'
  choice: 악한 술책들
  rationale: ‘기예’라는 중립적 의미보다 해로운 계략이나 행위를 가리키는 문맥을 살리되, 구체적으로 마술이나 이단 책략으로 한정하지 않았습니다.
- source_word: 'ἁγνεία (witness: “chastity”)'
  choice: 정결한 삶
  rationale: 문맥상 혼인하지 않고 절제하는 상태를 가리킬 가능성이 크지만, 한국어 ‘독신’으로 의미를 완전히 고정하지 않고 정결과 절제의 폭을 보존했습니다.
- source_word: 'ἐπίσκοπος (witness: “bishop”)'
  choice: 감독
  rationale: 초기 교회 직분을 나타내는 전통적이고 비교적 중립적인 한국어 표현을 사용했습니다.
- source_word: 'ἐπιθυμία (witness: “concupiscence”)'
  choice: 욕정
  rationale: 혼인의 동기가 주님이 아니라 육체적 욕망에 지배되는 상태라는 대조를 자연스럽고 직접적으로 전달합니다.
- source_word: 'σάρξ (witness: “flesh”)'
  choice: 육체 / 육
  rationale: ‘주님의 육체’에서는 성육신한 몸을 분명히 하고, 부부 관계의 ‘육으로나 영으로나’에서는 원문의 대구를 보존했습니다.
theological_decisions:
- issue: ‘주님의 육체를 존귀하게 하려고’의 의미
  choice: 성육신하신 주님의 육체를 존중하기 위한 정결이라는 표현을 그대로 보존
  alternative: 자기 몸으로 주님께 영광을 돌리기 위한 정결
  rationale: 영어 증언의 문법상 ‘the flesh of the Lord’가 목적어이며, 이를 신자의 몸으로 바꾸면 신학적 긴장이 해소되므로 그대로 두었습니다.
- issue: 감독에게 알려지는 것과 감독의 승인 사이의 의미
  choice: 감독 외에까지 알려져 자랑거리가 되는 상황으로 번역
  alternative: 감독에게 알려지지 않으면 더럽혀진다는 뜻
  rationale: 제공된 증언은 ‘known beyond the bishop’이므로 공개적 과시를 경계하는 흐름을 따랐지만, 그리스어 직접 대조가 필요함을 각주에 밝혔습니다.
- issue: 혼인과 감독의 동의
  choice: 공동체적·교회적 동의를 요구하는 권면으로 직역
  alternative: 감독이 혼인의 유효성을 성사적으로 부여한다는 해석
  rationale: 본문이 말하는 동의는 보존하되, 후대의 특정 혼인 성사론이나 교회법을 소급해 넣지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 저자가 폴리카르포스에게 공동체를 권면하도록 요청하는 직접적이고 목회적인 어조를 유지했습니다. 다만 제공 자료가 공공 영역 영어 증언에 기초하고 그리스어 원문 검토가 보류된 상태이므로, 특히 첫 문장, 정결 관련 표현, 감독에게 알려지는 문제는 잠정 번역으로 처리했습니다.
