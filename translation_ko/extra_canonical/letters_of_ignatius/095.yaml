  verdict: revise
  source_fidelity: 전반적으로 영어 증언의 논지와 문단 구조를 충실히 따릅니다. 다만 ‘let him so abide’는 폴리카르포스에게 하는 지시 안에서 제3자를 허용하는 표현인데, 초안의 ‘그렇게 하십시오’는 수신자에게 직접 적용하는 말로 바뀌어 있습니다. 이를 바로잡았습니다. 또한 혼인이 ‘after the Lord’가 되게 한다는 표현은 ‘주님을 따르는 것’보다 ‘주님을 따라 이루어진 것’이 원문의 혼인 자체에 대한 수식을 더 잘 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 대체로 자연스럽습니다. ‘육으로나 영으로나 자기 남편에게 만족하라’는 직역의 대구는 유지하되, ‘만족하며 지내도록’으로 다듬어 한국어 연결을 자연스럽게 했습니다. ‘그는 길을 잃은 것입니다’는 도덕적·영적 파국을 뜻하는 원문의 강한 표현에 비해 다소 완곡하고 다른 의미로 들릴 수 있어 ‘망한 것입니다’로 수정했습니다.
  terminology: ‘감독’, ‘정결’, ‘욕정’, ‘주님의 육체’는 영어 증언 및 초기 교회 문맥을 과도하게 교리화하지 않고 적절히 보존합니다. ‘beyond the bishop’의 정확한 그리스어 구문은 직접 검토 전까지 불확실하므로, ‘감독 외의 사람에게까지’라는 잠정 번역과 유보 각주를 유지합니다.
  issues:
