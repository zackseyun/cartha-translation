base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: ko
  text: 그분께서는 우리를 위하여 이 모든 일을 겪으셨습니다.[a] 그분께서는 참으로 고난을 겪으셨고, 또한 참으로 자신을 일으키셨습니다. 어떤 믿지 않는 자들이 말하듯이, 그분께서 겉모습으로만 고난을 겪으신 것이 아닙니다. 오히려 겉모습에 불과한 것은 그들 자신입니다. 그들이 생각하는 대로 그들에게도 그렇게 될 것입니다. 그들은 몸이 없고 악령과도 같기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 편집본은 이 문장 뒤에 “우리가 구원받게 하시려고”라는 말을 복원하여 넣습니다. 직접적인 그리스어 원문 검토는 아직 이루어지지 않았습니다.
    reason: 제공된 증거문의 대괄호 복원 신호와 현재 자료의 잠정성을 독자에게 투명하게 알립니다.
lexical_decisions:
- source_word: suffered
  choice: 고난을 겪으셨습니다
  rationale: 단순히 수동적으로 당했다는 뜻보다 실제 수난을 겪었다는 문맥을 자연스럽고 품위 있게 전달합니다.
- source_word: truly
  choice: 참으로
  rationale: 그리스도의 고난과 일으킴이 겉모습만이 아니라 실제였다는 대조를 보존합니다.
- source_word: in semblance
  choice: 겉모습으로만
  rationale: 가현적 고난이라는 주장을 전문 신학 용어 없이 현대 독자에게 분명하게 전달합니다.
- source_word: mere semblance
  choice: 겉모습에 불과한 것
  rationale: 앞선 '겉모습으로만'과의 수사적 말놀이와 역전을 살립니다.
- source_word: raised Himself
  choice: 자신을 일으키셨습니다
  rationale: 증거문이 지닌 재귀적 표현을 그대로 보존하며, 이를 수동형 부활 표현으로 바꾸어 신학적 긴장을 해소하지 않습니다.
- source_word: bodiless and demon-like
  choice: 몸이 없고 악령과도 같기
  rationale: 두 서술을 모두 유지하되, 'demon-like'를 현대 한국어에서 자연스러운 비교 표현으로 옮겼습니다.
theological_decisions:
- issue: 그리스도의 일으킴에 사용된 재귀 표현
  choice: 자신을 일으키셨습니다
  alternative: 살아나셨습니다 / 일으켜지셨습니다
  rationale: 영어 증거문이 명시하는 자기 일으킴을 보존하고, 행위 주체에 관한 신학적 함의를 임의로 바꾸지 않았습니다.
- issue: 반대자들의 운명에 관한 표현
  choice: 그들이 생각하는 대로 그들에게도 그렇게 될 것입니다
  alternative: 그들이 믿는 일이 그들에게도 일어날 것입니다
  rationale: 의견과 그 결과 사이의 의도적인 대응을 유지하면서, 구체적으로 무엇이 일어날지는 원문 증거가 남긴 함축으로 보존합니다.
- issue: 구원 목적절의 복원 표시
  choice: 본문에서 복원 구절을 생략하고 각주로 알림
  alternative: '[우리가 구원받게 하시려고]를 본문에 삽입'
  rationale: 제공된 영어 증거문에서 대괄호가 복원 신호이며 직접 그리스어 검토가 보류 중이므로, 불확실한 구절을 확정 본문처럼 싣지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 초기 기독교 문헌의 논박적 어조는 유지하되, 불필요하게 난해한 교리 용어는 피했습니다. 이 초안은 제공된 공용 영어 증거문에 근거한 잠정 번역이며, 중간형 그리스어 전승에 대한 직접 검토가 필요합니다.
