base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: ko
  text: '나는 지금 스미르나에서, 온갖 축하를 받을 만한 에베소 사람들의 편으로 여러분에게 이 글을 씁니다. 내게 매우 소중한 크로코스도 다른 많은 이들과 함께 내 곁에 있습니다.


    하나님의 영광을 위하여 시리아에서 로마로 나보다 먼저 간 이들에 관해서는, 여러분이 이미 지시를 받았으리라 믿습니다. 그들에게도 내가 가까이 왔다는 것을 알려 주십시오. 그들은 모두 하나님께도 여러분에게도 합당한 이들이니, 여러분이 모든 면에서 그들을 돌보아 주는 것이 마땅합니다.[a]


    나는 9월 칼렌다이 아흐레 전에 이 글을 씁니다.[b] 예수 그리스도를 인내하며 기다리면서 끝까지 평안하십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌보아 주다’로 옮긴 말은 그들을 맞아 쉬게 하고, 격려하며, 필요한 도움을 베푸는 뜻을 함께 포함할 수 있습니다.
    reason: ‘refresh’가 지닌 환대와 지원의 폭을 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘칼렌다이’는 로마력에서 매달 첫날입니다. 날짜를 세는 고대 로마의 포괄 계산법에 따르면 ‘9월 칼렌다이 아흐레 전’은 오늘날의 8월 24일에 해당합니다.
    reason: 고대 날짜 표현을 본문에 보존하면서 현대 독자가 그 날짜를 이해하도록 돕기 위해서입니다.
lexical_decisions:
- source_word: by the hand of the Ephesians
  choice: 에베소 사람들의 손을 빌려
  rationale: 편지의 전달이나 필사를 맡은 에베소 사람들을 가리키는 표현으로 이해하되, 구체적인 전달 방식을 단정하지 않고 관용적 이미지를 보존했습니다.
- source_word: worthy of all felicitation
  choice: 온갖 축하를 받아 마땅한
  rationale: 칭송이나 축복으로도 이해될 수 있는 표현을 과도하게 신학화하지 않고, 제공된 고대 번역 증거의 ‘felicitation/congratulation’을 자연스럽게 반영했습니다.
- source_word: refresh them
  choice: 그들에게 새 힘을 북돋아 주는
  rationale: 물질적 접대만으로 한정하지 않고 환대·격려·지원 전반을 포괄하도록 옮겼습니다.
- source_word: patient waiting
  choice: 인내로 기다리면서
  rationale: 수동적인 대기보다 끈기 있는 종말론적 기다림이라는 긴장을 살렸습니다.
theological_decisions:
- issue: ‘worthy of God and of you’의 합당성
  choice: 하나님께도 여러분에게도 합당한 이들
  alternative: 하나님과 여러분에게 존귀한 이들
  rationale: 인물의 내재적 공로나 구원 자격을 단정하지 않고 원문의 병렬 구조와 가치 판단을 보존했습니다.
- issue: 마지막 권면에서 기다림의 대상
  choice: 예수 그리스도를 인내로 기다리면서
  alternative: 예수 그리스도의 인내 안에서
  rationale: 제공된 영어 증거가 목적격 대상의 기다림으로 이해하지만, 그리스도에게 속한 인내라는 해석 가능성도 있으므로 문맥상 가장 자연스러운 본문을 택하되 사적 교리를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하고, 초기 그리스도교 서신의 정중하고 긴박한 어조를 유지했습니다. 현재 제공 자료는 중간본 그리스어 전통을 표방하지만 직접적인 그리스어 본문 검토가 아직 이루어지지 않았으므로, 본 초안은 명시된 공공 영역 영어 증거와 감사용 영어 POB를 바탕으로 한 잠정 번역입니다.
