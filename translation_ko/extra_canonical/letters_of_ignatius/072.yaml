  english_witness: 'I therefore did my own part, as a man composed unto union. But where there is division and anger, there God abideth not. Now the Lord forgiveth all men when they repent, if repenting they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who shall strike off every fetter from you; and I entreat you,


    Do ye nothing in a spirit of factiousness but after the teaching of Christ. For I heard certain persons saying, If I find it not in the charters, I believe it not in the Gospel. And when I said to them, It is written, they answered me That is the question. But as for me, my charter is Jesus Christ, the inviolable charter is His cross and His death and His resurrection, and faith through Him; wherein I desire to be justified through your prayers.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: ko
  text: '그러므로 나는 일치를 이루도록 조율된 사람으로서 내가 맡은 몫을 다했습니다. 그러나 분열과 분노가 있는 곳에는 하나님께서 머무르지 않으십니다. 주님께서는 모든 사람이 회개할 때 용서하십니다. 곧 그들이 회개하여 하나님의 일치와 감독의 협의회로 돌아올 때입니다.[a] 나는 여러분에게서 모든 사슬을 끊어 버리실 예수 그리스도의 은혜를 믿습니다. 그리고 여러분에게 권합니다.


    당파심으로는 아무것도 하지 말고, 그리스도의 가르침을 따라 하십시오. 어떤 이들이 “문서들에서 찾지 못하면, 나는 그것을 복음 안에 있다고 믿지 않습니다”라고 말하는 것을 내가 들었기 때문입니다.[b] 내가 그들에게 “기록되어 있습니다”라고 하자, 그들은 “바로 그것이 쟁점입니다”라고 대답했습니다. 그러나 나에게 문서는 예수 그리스도이십니다. 훼손할 수 없는 문서는 그분의 십자가와 죽음과 부활이며, 그분을 통한 믿음입니다.[c] 이 안에서 나는 여러분의 기도를 통하여 의롭다 하심을 받기 원합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감독의 협의회’는 공급된 영어 증거의 “the council of the bishop”를 옮긴 것입니다. 감독의 뜻, 감독을 중심으로 한 협의, 또는 감독과 연결된 회중을 뜻할 가능성이 있으며, 그 범위는 그리스어 원문 검토가 필요합니다.
    reason: 교회 직제에 관한 특정 해석을 확정하지 않고 잠정 번역의 한계를 밝히기 위해서입니다.
  - marker: b
    text: ‘문서들’은 권위 있는 기록들을 가리키는 표현입니다. 여기서 정확히 어떤 문서군을 뜻하는지는 논쟁의 여지가 있습니다.
    reason: ‘헌장’, ‘성경 문서’, ‘기록 보관물’ 등 가능한 의미를 하나로 단정하지 않기 위해서입니다.
  - marker: c
    text: ‘그분을 통한 믿음’은 그리스도를 매개로 한 믿음으로 읽을 수 있으나, ‘그분에 대한 믿음’이라는 뜻도 배제하지 않습니다.
    reason: 원어 검토가 보류된 상태에서 신학적으로 중요한 중의성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: composed unto union
  choice: 일치를 이루도록 조율된
  rationale: ‘composed’의 정돈되고 조화롭게 맞추어진 뉘앙스와 ‘union’의 일치 지향성을 함께 살렸습니다. 단순히 ‘일치에 헌신한’으로 풀어 원문의 비유를 지우지 않았습니다.
- source_word: council of the bishop
  choice: 감독의 협의회
  rationale: ‘council’의 회의체·협의라는 의미를 보존하되, 이것이 감독 개인의 ‘뜻’인지 감독을 중심으로 한 회중적 협의인지 공급된 영어 증거만으로 확정하지 않았습니다.
- source_word: charters
  choice: 문서들
  rationale: 문맥상 권위 있는 기록 문서를 가리키는 반복어입니다. 한국어의 ‘헌장’은 제도적 문서로 지나치게 좁게 들릴 수 있어 ‘문서’를 택하고 반복 이미지를 유지했습니다.
- source_word: fetter
  choice: 사슬
  rationale: 속박을 끊는 강한 비유를 자연스러운 현대 한국어로 보존했습니다.
- source_word: justified
  choice: 의롭다 하심을 받다
  rationale: 법정적·신학적 함의를 지닌 수동 표현을 보존하고, 단순히 ‘옳다고 인정받다’로 약화하지 않았습니다.
theological_decisions:
- issue: 하나님의 일치와 감독의 협의회로 돌아옴과 용서의 관계
  choice: 조건문 구조를 그대로 유지
  alternative: 감독에게 복종해야만 하나님께 용서받는다는 뜻으로 명시
  rationale: 본문의 긴장된 조건 표현은 보존하되, 교회 제도에 관한 특정 교파의 해석을 덧붙이지 않았습니다.
- issue: 예수 그리스도와 십자가·죽음·부활을 ‘문서’라고 부르는 비유
  choice: 반복되는 ‘문서’ 비유를 유지
  alternative: ‘나의 권위’ 또는 ‘나의 성경’으로 해설 번역
  rationale: 저자가 기록 권위 논쟁에 응답하면서 그리스도 사건을 권위 있는 문서에 빗대는 수사적 긴장을 그대로 살렸습니다.
- issue: ‘그분을 통한 믿음’의 의미
  choice: 그분을 통한 믿음
  alternative: 그분에 대한 믿음 / 그분의 신실하심
  rationale: 공급된 증거만으로 목적격·매개적 의미를 단정하지 않고 중의성을 보존했습니다.
- issue: 기도를 통하여 의롭다 하심을 받음
  choice: 여러분의 기도를 통하여 의롭다 하심을 받기 원합니다
  alternative: 여러분의 기도 덕분에 옳다고 인정받기를 바랍니다
  rationale: 기도와 칭의의 관계를 체계신학적으로 해소하지 않고 원문의 표현을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 초기 그리스도교 서신에 어울리는 존엄성을 유지하되 지나친 고어체는 피했습니다. 공급 자료상 그리스어 원문 검토가 보류되어 있으므로 공공 영역 영어 증거와 영어 POB를 대조한 잠정 원고입니다. 인용문의 말투는 정중체로 통일하고, 반복되는 ‘문서’ 이미지를 의도적으로 보존했습니다.
