    reason: 인용문의 성경적 배경과 초기 그리스도교 문헌에서의 연관성을 밝힙니다.
  revision_rationale: 실제 경험을 전제로 하는 첫 문장의 논증, μακαρίζω의 의미, ‘빵을 결핍하다’라는 비구체적 표현, 그리고 감독에게 복종함으로써 자신을 하나님께 드린다는 마지막 목적절을 보존했습니다. 제단과 하나님의 빵에 관한 해석적 여지는 각주에서만 제한적으로 설명했습니다.
