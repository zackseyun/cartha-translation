    그러므로 함께 모이는 모임에 나오지 않는 사람은 그 일로 교만을 드러내며 자신을 분리한 것입니다. “하나님께서는 교만한 자들을 대적하신다”라고 기록되어 있기 때문입니다.[b] 그러므로 감독을 대적하지 않도록 힘씁시다. 그에게 복종함으로써 우리 자신을 하나님께 드리도록 합시다.'
  revised_footnotes:
  - marker: a
    text: ‘제단의 영역 안’은 공동체의 예배와 성찬적 친교 안에 있음을 가리키는 표현으로 이해될 수 있습니다. ‘하나님의 빵’도 성찬을 강하게 연상시키지만, 본문은 그 표현을 더 구체적으로 한정하지 않습니다.
