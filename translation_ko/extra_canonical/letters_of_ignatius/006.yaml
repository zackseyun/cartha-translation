    rationale: 분리의 결과를 강조하는 부사 ‘이미’는 원문에 명시되지 않아 삭제하는 편이 안전합니다.
  revised_text: '여러분의 감독과 짧은 시간에 나눈 교제가 인간적인 방식에 따른 것이 아니라 성령을 따른 것이었는데, 교회가 예수 그리스도와 결합되어 있고 예수 그리스도께서 아버지와 결합되어 계시듯이 그와 긴밀히 결합되어 있는 여러분을 제가 얼마나 더욱 복되다고 여기겠습니까! 이는 모든 일이 하나 됨 가운데 조화를 이루게 하려는 것입니다.


