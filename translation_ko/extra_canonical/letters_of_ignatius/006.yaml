base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: ko
  text: '여러분의 감독과 짧은 시간 동안 나눈 교제가 단지 인간적인 것이 아니라 영적인 것이었다면, 교회가 예수 그리스도와 결합되어 있고 예수 그리스도께서 아버지와 결합되어 계시듯이 감독과 긴밀히 결합되어 있는 여러분을 두고 제가 얼마나 더 기뻐하겠습니까! 이는 모든 것이 하나 됨 안에서 조화를 이루게 하려는 것입니다.


    아무도 속지 마십시오. 누구든지 제단의 경계 안에 있지 않으면 하나님의 빵을 받지 못합니다.[a] 한두 사람의 기도도 그토록 큰 힘이 있다면, 감독과 온 교회의 기도는 얼마나 더 큰 힘이 있겠습니까!


    그러므로 함께 모이는 자리에 나오지 않는 사람은 그 일로 이미 교만을 드러내며 스스로를 갈라놓은 것입니다. 성경에 “하나님께서는 교만한 자들을 대적하신다”라고 기록되어 있기 때문입니다.[b] 그러므로 감독을 대적하지 않도록 힘씁시다. 그리하여 하나님께 복종하는 사람들이 됩시다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제단의 경계 안’은 공동체의 예배와 성찬적 친교 안에 있음을 나타내는 표현으로 이해될 수 있습니다. ‘하나님의 빵’ 역시 성찬을 강하게 연상시키지만, 여기서는 원문의 비유적 표현을 그대로 살렸습니다.
    reason: 제의적 표현을 특정한 후대 제도나 교리로 단정하지 않으면서 독자의 이해를 돕기 위함입니다.
  - marker: b
    text: 잠언 3:34의 그리스어 번역문과 야고보서 4:6, 베드로전서 5:5에 나오는 표현입니다.
    reason: 인용문의 성경적 출처와 초기 그리스도교 문헌 안의 연관성을 밝혀 줍니다.
lexical_decisions:
- source_word: συνήθεια
  choice: 교제
  rationale: 단순한 대화보다 지속적인 관계와 친교를 나타내는 문맥에 맞추되, 지나치게 제도적인 의미는 피했습니다.
- source_word: πνευματικήν
  choice: 영적인 것
  rationale: ‘성령 안에서’로 단정할 수도 있으나, 형용사의 의미 범위를 보존하여 인간적인 관계와 대비되는 영적 성격으로 옮겼습니다.
- source_word: συνανακεκραμένους
  choice: 긴밀히 결합되어 있는
  rationale: ‘섞이다, 결합되다’라는 강한 연합의 뜻을 자연스러운 현대 한국어로 나타냈습니다.
- source_word: θυσιαστήριον
  choice: 제단
  rationale: 초기 그리스도교 문맥의 제의적·공동체적 심상을 유지하고, 이를 곧바로 특정한 교회 제도로 환원하지 않았습니다.
- source_word: ὑστερεῖται
  choice: 받지 못합니다
  rationale: ‘결핍되다, 누리지 못하다’의 결과를 자연스럽게 표현하면서 배제의 구체적 방식은 단정하지 않았습니다.
- source_word: ἐπὶ τὸ αὐτό
  choice: 함께 모이는 자리
  rationale: 직역하면 ‘한곳에/함께’이며, 문맥상 공동체의 집회를 가리키므로 현대 독자가 이해하기 쉽게 옮겼습니다.
- source_word: διέκρινεν
  choice: 스스로를 갈라놓은 것입니다
  rationale: 자신을 구별하거나 분리했다는 뜻을 살리되, 공식적 출교로 과도하게 구체화하지 않았습니다.
- source_word: ὑποτασσόμενοι
  choice: 복종하는 사람들이 됩시다
  rationale: 감독에게 맞서지 않는 태도와 하나님께 대한 복종의 관계를 원문의 목적절에 따라 보존했습니다.
theological_decisions:
- issue: 감독과 교회의 결합을 그리스도론적 연합에 비유하는 표현
  choice: ‘교회가 예수 그리스도와 … 예수 그리스도께서 아버지와 결합되어 계시듯이’로 비유 구조를 그대로 유지함
  alternative: 감독에게 절대적으로 복종하라는 교리적 명제로 풀어씀
  rationale: 원문은 두 관계를 유비적으로 배열하므로, 후대의 특정 교회 정치 체계를 본문에 덧씌우지 않았습니다.
- issue: ‘제단의 경계 안’과 ‘하나님의 빵’의 의미
  choice: 제의적·성찬적 함의를 가진 은유를 그대로 보존함
  alternative: 교회 회원권 또는 성찬 참여만을 뜻한다고 명시함
  rationale: 문맥상 공동체 집회와 성찬의 함의가 강하지만, 표현의 상징적 범위를 하나의 제도적 해석으로 제한하지 않았습니다.
- issue: πνευματικήν의 주체
  choice: ‘영적인 것’으로 번역함
  alternative: ‘성령 안에서’로 번역함
  rationale: 성령의 작용을 함축할 수 있으나 형용사 자체가 반드시 명시적 주체를 확정하지 않으므로 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 장중한 합쇼체를 사용했습니다. 권면에서는 ‘-십시오/-읍시다’를 사용하고, 문장 구조는 공개 영역 영어 증언과 알려진 중간 개정 그리스어 전승의 어휘·통사 정보를 대조하여 자연스럽게 다듬었습니다. 다만 제공 자료가 직접적인 그리스어 대조를 ‘검토 대기’로 명시하므로, 확정하기 어려운 지점은 각주와 번역 결정에 투명하게 표시했습니다.
