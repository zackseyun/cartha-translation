- from: '나는 시리아에서 로마에 이르기까지, 땅과 바다에서 밤낮으로 맹수들과 싸우고 있습니다. 곧 열 마리 표범 같은 한 무리의 군인들 사이에 묶여 있는데, 그들은 친절하게 대해 줄수록 더욱 악해질 뿐입니다. 그러나 나는 그들의 악행을 통해 더욱 온전한 제자가 되어 갑니다. 그렇다고 이것으로 내가 의롭다 하심을 받는 것은 아닙니다.


