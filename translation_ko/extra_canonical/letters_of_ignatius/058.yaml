    May I have joy of the beasts that have been prepared for me; and I pray that I may find them prompt; nay I will entice them that they may devour me promptly, not as they have done to some, refusing to touch them through fear. Yea though of themselves they should not be willing while I am ready, I myself will force them to it.


    Bear with me. I know what is expedient for me. Now am I beginning to be a disciple. May naught of things visible and things invisible envy me; that I may attain unto Jesus Christ. Come fire and cross and grapplings with wild beasts, [cuttings and manglings,] wrenching of bones, hacking of limbs, crushings of my whole body, come cruel tortures of the devil to assail me. Only be it mine to attain unto Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: ko
  text: '나는 시리아에서 로마에 이르기까지, 땅과 바다에서 밤낮으로 맹수들과 싸우고 있습니다. 나는 열 마리 표범, 곧 한 무리의 군인들 사이에 묶여 있습니다. 그들은 친절하게 대해 줄수록 더욱 악해질 뿐입니다. 그러나 나는 그들의 악행을 통해 더욱 제자가 되어 갑니다. 그렇다고 해서 이로 말미암아 내가 의롭다 하심을 받는 것은 아닙니다.


    나를 위해 마련된 맹수들을 만나게 되기를 바랍니다. 나는 그 맹수들이 내게 신속히 닥치기를 기도합니다. 나는 그들이 어떤 이들에게 그랬던 것처럼 두려워하여 내게 손대기를 거부하지 않고, 신속히 나를 삼키도록 그들을 유인하겠습니다. 내가 준비되어 있는데도 그들이 스스로 원하지 않는다면, 내가 직접 그들을 억지로라도 그렇게 하게 하겠습니다.


    나를 참아 주십시오. 나는 무엇이 내게 유익한지 알고 있습니다. 이제 나는 제자가 되기 시작합니다. 보이는 것이든 보이지 않는 것이든, 그 무엇도 나를 시기하지 않게 하십시오. 그리하여 내가 예수 그리스도께 이를 수 있게 하십시오. 불과 십자가와 맹수들과의 격투, [베이고 찢기는 일,] 뼈가 부서지고 팔다리가 잘리며 온몸이 으스러지는 일, 마귀의 잔혹한 고문이 내게 닥치게 하십시오. 오직 내가 예수 그리스도께 이를 수만 있다면 됩니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηριομαχῶ / “fight with wild beasts”
  choice: 맹수들과 싸우고 있습니다
  rationale: 실제 맹수와의 처형을 내다보면서도 군인들의 가혹한 호송을 비유하는 중의성을 유지했습니다.
- source_word: δέκα λεοπάρδοις / “ten leopards”
  choice: 열 마리 표범 같은 … 군인들
  rationale: 군인들을 ‘표범’이라 부르는 은유임을 자연스럽게 드러내되 강렬한 원문 이미지를 보존했습니다.
- source_word: μαθητεύομαι / “become a disciple”
  choice: 제자가 되어 갑니다
  rationale: 고난을 통해 제자됨이 완성되어 간다는 진행적 의미를 살렸습니다.
- source_word: δεδικαίωμαι / “am justified”
  choice: 의롭다 하심을 받는
  rationale: 수동 완료형의 법정적·신학적 울림을 보존하면서, 고난 자체가 칭의의 근거라는 뜻을 부인하는 대조를 유지했습니다.
- source_word: ἐπιτύχω Ἰησοῦ Χριστοῦ / “attain to Jesus Christ”
  choice: 예수 그리스도께 이르다
  rationale: 단순히 만난다거나 얻는다고 해석을 좁히지 않고, 순교를 통해 그리스도께 도달한다는 방향성을 보존했습니다.
- source_word: κολάσεις τοῦ διαβόλου / “tortures of the devil”
  choice: 마귀의 … 고문
  rationale: ‘마귀가 가하는 고문’과 ‘마귀에게서 비롯된 고문’ 사이의 관계를 과도하게 규정하지 않았습니다.
theological_decisions:
- issue: 고난과 칭의의 관계
  choice: “그렇다고 이것으로 내가 의롭다 하심을 받는 것은 아닙니다”로 명시적 부정을 보존
  alternative: “그러나 그것 때문에 내가 무죄인 것은 아닙니다”
  rationale: ‘justify’의 법정적 의미와 신학적 긴장을 유지하고, 순교나 고난을 구원의 공로로 읽도록 만들지 않았습니다.
- issue: “이제야 제자가 되기 시작한다”의 의미
  choice: 순교를 앞둔 제자됨의 절정에 관한 역설로 그대로 번역
  alternative: “이제 나는 참된 제자임을 입증하게 됩니다”
  rationale: ‘입증’으로 풀면 제자됨의 시작이라는 원문의 충격과 긴장이 사라지므로 직역에 가까운 표현을 택했습니다.
- issue: 맹수들을 강제로 달려들게 한다는 표현
  choice: 저자의 극단적인 순교 열망을 완화하지 않고 보존
  alternative: “그들이 달려들도록 자극하겠습니다”
  rationale: 현대 독자에게 불편할 수 있으나 본문의 역사적·신학적 긴장을 편집적으로 순화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 초기 그리스도교 순교 문헌에 어울리는 장중함을 유지하되 고어체는 피했습니다. 대괄호는 제공된 증언 본문에서 전승상의 손상 또는 복원을 표시하는 신호이므로 그대로 보존했습니다. 직접적인 그리스어 대조가 아직 완료되지 않았다는 자료상의 한계 때문에, 제공된 공공영역 영어 증언과 POB 검토층을 바탕으로 원문의 중의성과 문장 구조를 가능한 한 보수적으로 반영했습니다.
