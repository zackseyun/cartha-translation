base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: ko
  text: '16


    형제자매 여러분, 속지 마십시오. 가정을 무너뜨리는 자들은 하나님의 나라를 상속받지 못할 것입니다.[a]


    육신을 따라 이런 일을 하는 자들도 죽음을 당했다면, 악한 가르침으로 하나님께 속한 믿음, 곧 예수 그리스도께서 그 믿음을 위하여 십자가에 못 박히신 그 믿음을 타락시키는 사람은 얼마나 더 큰 벌을 받겠습니까?[b] 그런 사람은 자신을 더럽힌 자가 되어 꺼지지 않는 불 속으로 들어갈 것입니다. 그의 말을 듣는 사람도 마찬가지입니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가정을 무너뜨리는 자들’은 문자적으로 집이나 가정을 파괴하거나 타락시키는 자들을 가리킵니다. 여기서 특정한 죄의 유형만을 뜻하는지는 확정하기 어렵습니다.
    reason: 복합어의 의미 범위를 보존하고 과도하게 특정한 해석을 피하기 위해서입니다.
  - marker: b
    text: ‘하나님께 속한 믿음’은 ‘하나님의 믿음’이라고도 옮길 수 있으며, 하나님을 향한 믿음이나 하나님께 속한 신앙을 가리킬 수 있습니다. ‘그 믿음을 위하여’는 바로 앞의 믿음을 받습니다.
    reason: 그리스어 속격과 관계대명사의 연결을 설명하고 신학적 의미를 하나로 고정하지 않기 위해서입니다.
  - marker: c
    text: ‘듣는’은 단순히 귀로 듣는 것뿐 아니라 그 가르침을 받아들이거나 따르는 뜻을 포함할 수 있습니다.
    reason: 원어 동사의 문맥적 의미 범위를 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: οἰκοφθόροι (as attested in the Middle-recension Greek tradition)
  choice: 가정을 무너뜨리는 자들
  rationale: ‘집/가정’을 뜻하는 요소와 ‘파괴하다/타락시키다’를 뜻하는 요소를 함께 살렸습니다. 문맥이 특정 형태의 가정 파괴를 가리킬 가능성은 있으나, 본문 자체보다 좁게 한정하지 않았습니다.
- source_word: κατὰ σάρκα
  choice: 육신을 따라
  rationale: 초기 그리스도교 문헌의 신학적·윤리적 긴장을 보존하면서도 한국어로 이해 가능한 직역에 가깝게 옮겼습니다.
- source_word: πίστιν θεοῦ
  choice: 하나님께 속한 믿음
  rationale: 속격의 의미를 ‘하나님을 믿는 믿음’으로 단정하지 않고, 하나님과 관련되고 하나님께 속한 믿음이라는 폭을 유지했습니다.
- source_word: ἐν κακῇ διδαχῇ
  choice: 악한 가르침으로
  rationale: 수단 또는 영역을 나타내는 표현을 자연스러운 한국어로 옮겼습니다.
- source_word: τὸ πῦρ τὸ ἄσβεστον
  choice: 꺼지지 않는 불
  rationale: 원문의 강한 심판 이미지를 완화하거나 교리적으로 확장하지 않고 그대로 보존했습니다.
- source_word: ὁ ἀκούων αὐτοῦ
  choice: 그의 말을 듣는 사람
  rationale: ‘듣다’에는 단순히 청취하는 것뿐 아니라 받아들이고 따르는 뜻도 있을 수 있으므로 본문은 넓게 옮기고 각주에서 의미 범위를 밝혔습니다.
theological_decisions:
- issue: ‘하나님의 믿음’이라는 속격 표현
  choice: 하나님께 속한 믿음
  alternative: 하나님을 믿는 믿음 / 하나님께서 주신 신앙
  rationale: 원문의 속격이 지닌 관계적 모호성을 보존하고, 믿음의 대상이나 기원을 번역자가 단정하지 않도록 했습니다.
- issue: 육신을 따라 행한 자들이 맞은 결과
  choice: 죽음을 당했다면
  alternative: 사형을 당했다면 / 죽었다면
  rationale: 해당 동사는 죽음에 이른 사실을 나타내며 문맥상 처벌로서의 죽음일 수 있습니다. ‘사형’으로 제도화해 단정하지 않으면서 수동적 뉘앙스를 살렸습니다.
- issue: 악한 교훈을 전하는 자와 듣는 자의 심판
  choice: 둘 다 꺼지지 않는 불에 들어간다는 병행 구조를 유지
  alternative: 듣는 자의 책임을 완화하여 해설
  rationale: 본문의 엄중한 병행 진술을 그대로 두고, 청자의 책임 조건을 번역자가 별도로 제한하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면과 심판의 엄중함은 유지하되 고어적 어순은 피했습니다. ‘형제자매 여러분’은 공동체 전체를 향한 호칭으로 자연스럽게 풀어 썼습니다. 제공 자료는 공용 영어 증언을 기초로 하며 그리스어 원문 검토가 대기 중이라고 명시하지만, 알려진 중간형 그리스어 전승의 핵심 어휘와 구문을 우선적으로 반영한 잠정 출판 초안입니다.
