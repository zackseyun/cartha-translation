  naturalness: 합쇼체와 전반적 문체는 자연스럽습니다. 그러나 ‘하나님께 지극히 합당한 이름을 짊어질 자격’은 ‘이름을 지니다’라는 원문의 표현에 비해 다소 무겁고, ‘그 안에서’는 한국어에서 지시 대상이 불명료합니다. ‘여러 교회를 찬양합니다’도 가능하나 ‘교회들을 노래합니다’라는 찬양·기림의 비유를 ‘교회들을 찬미합니다’로 옮기면 문맥상 더 분명합니다.
  terminology: ‘이 세상 통치자’와 ‘하나 됨’은 특정 교리적 해석을 덧붙이지 않아 적절합니다. ‘예수님’ 대신 문헌 전체에서 일관되게 ‘예수 그리스도’를 사용하면 초기 교회 문헌의 격식과 호칭의 일관성이 더 좋습니다. ‘하나님께 지극히 합당한 이름’은 가능하나, 최상급의 강도를 살린 ‘더없이 하나님께 합당한 이름’이 더 자연스럽습니다.
