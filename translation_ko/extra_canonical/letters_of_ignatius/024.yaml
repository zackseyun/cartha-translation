source:
  text: 'When I learned the exceeding good order of your love in the ways of God, I was gladdened and I determined to address you in the faith of Jesus Christ.


    For being counted worthy to bear a most godly name, in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ''s, our never-failing life--and union of faith and of love which is preferred before all things, and--what is more than all--an union with Jesus and with the Father, in whom if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'When I learned the exceeding good order of your love in the ways of God, I was gladdened and I determined to address you in the faith of Jesus Christ.


    For being counted worthy to bear a most godly name, in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ''s, our never-failing life--and union of faith and of love which is preferred before all things, and--what is more than all--an union with Jesus and with the Father, in whom if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: ko
  text: '여러분이 하나님을 따르는 사랑 안에서 지극히 질서 있게 살아간다는 소식을 듣고, 나는 기뻐하며 예수 그리스도를 믿는 믿음 안에서 여러분에게 말을 건네기로 했습니다.


    나는 이 결박을 몸에 지니고 다니는 가운데 하나님께 지극히 합당한 이름을 짊어질 자격을 얻었으므로,[a] 여러 교회를 찬양합니다. 그리고 그 교회들 안에 우리의 끊임없는 생명이신 예수 그리스도께 속한 육체와 영의 하나 됨이 있고,[b] 무엇보다 앞서는 사랑과 믿음의 하나 됨이 있으며, 그 모든 것보다 더 중요한 예수님과 아버지와의 하나 됨이 있기를 기도합니다. 우리가 그 안에서 이 세상 통치자의 온갖 모욕을 참고 견디어 벗어나면, 하나님께 이르게 될 것입니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님께 지극히 합당한 이름’이 정확히 어떤 이름을 가리키는지는 이 문장에 명시되어 있지 않습니다. 그리스도인이라는 이름이나 이냐시오스의 신앙적 증언을 가리킬 수 있습니다.
    reason: 모호한 ‘이름’을 특정 칭호로 단정하지 않기 위해서입니다.
  - marker: b
    text: ‘예수 그리스도께 속한 육체와 영’은 그리스도의 육체와 영을 가리킬 수도 있고, 교회 공동체의 육체적·영적 삶이 그리스도께 속한다는 뜻일 수도 있습니다.
    reason: 속격 구조가 허용하는 genuine ambiguity를 보존하기 위해서입니다.
  - marker: c
    text: ‘그 안에서’는 문법상 아버지를 가리킬 수 있으나, 앞에 나온 예수님과 아버지와의 하나 됨 전체를 받아 이해할 수도 있습니다.
    reason: 관계대명사의 선행사를 번역자가 임의로 하나로 확정하지 않기 위해서입니다.
lexical_decisions:
- source_word: τὸ πολυεύτακτον τῆς κατὰ θεὸν ἀγάπης
  choice: 하나님을 따르는 사랑 안에서 지극히 질서 있게 살아간다는 것
  rationale: ‘κατὰ θεόν’은 하나님을 기준으로 하고 하나님을 향하는 삶의 방향을 나타내며, ‘πολυεύτακτον’은 사랑의 탁월한 질서와 단정함을 가리킵니다. 한국어에서는 추상 명사구보다 공동체의 삶을 표현하는 문장이 자연스럽습니다.
- source_word: ἐν πίστει Ἰησοῦ Χριστοῦ
  choice: 예수 그리스도를 믿는 믿음 안에서
  rationale: 속격은 예수 그리스도를 대상으로 하는 믿음 또는 그분에게서 비롯된 신실함으로 읽힐 수 있으나, 이 문맥에서는 수신자에게 말하는 신앙의 영역을 나타내는 일반적 의미를 본문에 채택했습니다.
- source_word: ὀνόματος θεοπρεπεστάτου
  choice: 하나님께 지극히 합당한 이름
  rationale: ‘θεοπρεπέστατος’의 최상급 의미를 살리되, 그 이름이 정확히 무엇인지 본문이 밝히지 않으므로 특정 칭호로 한정하지 않았습니다.
- source_word: ᾄδω τὰς ἐκκλησίας
  choice: 여러 교회를 찬양합니다
  rationale: 직역하면 ‘교회들을 노래합니다’이지만, 문맥상 여러 교회를 기리고 찬미한다는 뜻을 자연스러운 현대 한국어로 표현했습니다.
- source_word: τοῦ διαπαντὸς ἡμῶν ζῆν
  choice: 우리의 끊임없는 생명이신
  rationale: 예수 그리스도를 공동체가 언제나 살아가는 생명으로 묘사하는 표현입니다. ‘끊임없는’으로 지속성을 살렸습니다.
- source_word: τοῦ ἄρχοντος τοῦ αἰῶνος τούτου
  choice: 이 세상 통치자
  rationale: 초기 그리스도교 문맥에서 적대적 영적 권세를 가리키지만, 본문 자체의 간접적 명칭을 유지하여 ‘사탄’으로 명시하지 않았습니다.
- source_word: θεοῦ τευξόμεθα
  choice: 하나님께 이르게 될 것입니다
  rationale: ‘하나님을 얻다/만나다/도달하다’의 의미 범위를 지닌 표현으로, 목적지에 도달한다는 이냐시오스의 순교 여정 문맥을 살렸습니다.
theological_decisions:
- issue: ‘예수 그리스도의 육체와 영’이라는 속격의 관계
  choice: 예수 그리스도께 속한 육체와 영
  alternative: 예수 그리스도의 육체와 영 / 예수 그리스도 안에서 이루어지는 육체와 영
  rationale: 그리스도 자신의 육체와 영을 뜻할 수도 있고 공동체의 육체적·영적 일치를 그리스도께 귀속하는 말일 수도 있습니다. ‘속한’은 양쪽 가능성을 완전히 닫지 않습니다.
- issue: ‘예수님과 아버지와의 하나 됨’의 성격
  choice: 관계적 연합을 뜻하는 ‘하나 됨’
  alternative: 본질적 동일성 또는 제도적 일치로 구체화
  rationale: 원문의 ἕνωσις를 번역하되 후대의 정교한 교리 용어를 소급해 넣지 않았습니다.
- issue: ‘그 안에서’의 선행사
  choice: 대명사적 표현을 유지
  alternative: ‘아버지 안에서’ 또는 ‘예수님과 아버지 안에서’로 명시
  rationale: 단수 관계대명사의 문법적 선행사는 아버지로 볼 수 있지만, 바로 앞의 ‘예수님과 아버지와의 하나 됨’ 전체와 연결될 여지도 있어 모호성을 보존했습니다.
- issue: 구원과 인내의 관계
  choice: 조건문 구조를 그대로 유지
  alternative: 인내가 공로로 구원을 획득한다거나 이미 보장된 구원을 입증한다고 해설
  rationale: 본문의 긴장과 권면을 유지하고 특정 교파의 구원론으로 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 초기 교회 문헌의 장중함은 유지하되 지나치게 고어적인 ‘하나님께 도달하리라’, ‘능욕’ 같은 표현은 피했습니다. 제공 자료는 공공 영역 영어 증언을 직접적인 drafting basis로 밝히고 있으나, 중간 전승 그리스어의 알려진 어휘와 통사 구조를 우선 검토해 번역 결정을 구성했습니다. 정식 출판 전에는 지정된 그리스어 비평 본문에 대한 직접 대조가 필요합니다.
