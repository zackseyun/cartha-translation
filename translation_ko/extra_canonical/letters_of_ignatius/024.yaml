  - severity: high
    issue: ‘예수님과 아버지와의 하나 됨’이 연합의 대상을 잘못 연결할 수 있습니다.
    rationale: 원문은 예수 그리스도 및 아버지와 이루는 연합을 말합니다. 현재 표현은 ‘예수님과 아버지’ 두 분 사이의 하나 됨으로 읽힐 수 있습니다.
  - severity: medium
