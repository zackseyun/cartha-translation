base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: ko
  text: '8


    저는 더 이상 사람들의 방식대로 살기를 원하지 않습니다. 여러분이 원한다면 그렇게 될 것입니다. 여러분도 원함을 받도록[a] 원하십시오. 이 짧은 편지로 여러분에게 간청합니다. 저를 믿어 주십시오.


    제가 진실을 말하고 있다는 것을 예수 그리스도께서 여러분에게 분명히 밝혀 주실 것입니다. 예수 그리스도는 그릇됨이 없는 입이시며, 그분 안에서 아버지께서 참되게 말씀하셨습니다.[b]


    제가 목적에 이르도록[c] 저를 위해 기도해 주십시오. [성령을 통하여.][d] 저는 육신을 따라 여러분에게 쓴 것이 아니라 하나님의 뜻을 따라 썼습니다. 제가 고난을 받는다면, 여러분이 원한 것입니다. 제가 버림받는다면, 여러분이 미워한 것입니다.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘원함을 받다’는 원문의 수동 표현을 반영합니다. 누가 원하는지는 명시되어 있지 않으며, 하나님이 암시되었을 가능성이 있습니다.
    reason: 수동태의 행위자와 신학적 함의를 확정하지 않기 위해서입니다.
  - marker: b
    text: ‘그분 안에서’는 예수 그리스도를 가리킵니다. 일부 번역 전승은 마지막 ‘참되게’를 대괄호로 표시합니다.
    reason: 대명사의 지시 대상과 제공된 영어 증언에 나타난 본문 불확실성을 알리기 위해서입니다.
  - marker: c
    text: 무엇에 이르는지는 이 문장에 명시되어 있지 않습니다. 문맥상 이그나티우스가 바라던 순교의 완성과 하나님께 이르는 일을 가리키는 것으로 이해할 수 있습니다.
    reason: 생략된 목적어를 본문에서 섣불리 확정하지 않기 위해서입니다.
  - marker: d
    text: ‘성령을 통하여’는 제공된 영어 증언에서 대괄호 안에 있으며, 본문 전승상 불확실한 말로 취급됩니다.
    reason: 직접적인 그리스어 사본 대조가 아직 이루어지지 않은 상태에서 구절의 불확실성을 투명하게 표시하기 위해서입니다.
  - marker: e
    text: 직역하면 ‘내가 고난을 받는다면, 여러분이 원했습니다. 내가 버림받는다면, 여러분이 미워했습니다’입니다. 무엇을 원했고 누구를 미워했는지는 문법상 생략되어 있습니다.
    reason: 마지막 문장의 압축된 대구와 의도적인 날카로움을 보존하면서 생략된 요소를 설명하기 위해서입니다.
lexical_decisions:
- source_word: 'κατὰ ἀνθρώπους ζῆν (English witness: “live after the manner of men”)'
  choice: 사람들의 방식대로 살다
  rationale: 단순히 ‘인간으로 살다’라는 뜻으로 오해되지 않도록, 인간적인 삶의 방식이나 기준을 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: 'θελήσατε … θεληθῆτε (English witness: “Desire ye, that ye yourselves also may be desired”)'
  choice: 여러분도 원함을 받도록 원하십시오
  rationale: 능동형과 수동형이 반복되는 수사 구조를 보존했습니다. 수동형의 행위자가 하나님인지 다른 주체인지는 본문이 명시하지 않으므로 번역에서 확정하지 않았습니다.
- source_word: 'τὸ ἀψευδὲς στόμα (English witness: “the unerring mouth”)'
  choice: 그릇됨이 없는 입
  rationale: 예수 그리스도를 아버지의 참된 말씀을 전하는 ‘입’으로 부르는 원문의 강렬한 은유를 풀어 없애지 않고 유지했습니다.
- source_word: 'ἐπιτύχω (English witness: “I may attain”)'
  choice: 목적에 이르다
  rationale: 목적어가 명시되지 않은 표현을 보존하면서도 한국어 문장이 성립하도록 ‘목적에’를 최소한으로 보충했습니다. 문맥상 순교의 성취를 가리킬 가능성이 크지만 본문에 직접 삽입하지 않았습니다.
- source_word: 'κατὰ σάρκα / κατὰ γνώμην θεοῦ (English witness: “according to the flesh / according to the mind of God”)'
  choice: 육신을 따라 / 하나님의 뜻을 따라
  rationale: 대조를 보존하되, γνώμη는 여기서 단순한 지적 ‘생각’보다 의향·뜻을 나타내므로 자연스러운 한국어인 ‘뜻’을 선택했습니다.
- source_word: 'ἀποδοκιμασθῶ (English witness: “I shall be rejected”)'
  choice: 버림받다
  rationale: 시험에서 탈락하거나 승인받지 못한다는 의미를 포함하는 수동 표현입니다. 문맥의 엄중함과 의도적 모호성을 함께 살렸습니다.
theological_decisions:
- issue: ‘원함을 받다’라는 신적 수동태 가능성
  choice: 행위자를 밝히지 않고 수동 표현을 유지함
  alternative: ‘하나님께서 여러분을 원하시도록’ 또는 ‘하나님의 기쁨을 받도록’
  rationale: 하나님이 암시된 행위자일 수 있으나, 현 단계의 증거와 본문 자체는 이를 명시하지 않습니다. 특정한 신학 해석을 본문에 넣지 않았습니다.
- issue: ‘목적에 이르다’의 목적
  choice: 본문에서는 목적을 명시하지 않음
  alternative: ‘순교에 이르다’ 또는 ‘하나님께 이르다’
  rationale: 서신 전체의 문맥은 순교와 하나님께 도달함을 강하게 시사하지만, 이 문장의 동사에는 목적어가 드러나지 않습니다. 암시는 각주에서 설명했습니다.
- issue: ‘성령을 통하여’의 본문 지위
  choice: 대괄호와 각주로 표시함
  alternative: 본문에 확정적으로 포함하거나 완전히 제외함
  rationale: 제공된 공용 영어 증언이 이 구절을 대괄호로 제시하므로, 그 불확실성을 독자에게 그대로 드러냈습니다. 그리스어 사본 전통에 대한 직접 대조 전에는 확정하지 않았습니다.
- issue: 고난과 버림에 대한 독자들의 책임을 표현하는 마지막 대구
  choice: ‘여러분이 원한 것입니다 / 여러분이 미워한 것입니다’로 직설성을 유지함
  alternative: ‘여러분이 그것을 원한 셈입니다 / 여러분이 나를 미워한 셈입니다’
  rationale: 원문 증언의 생략과 날카로운 대조를 보존했습니다. 대상이나 논리 관계를 번역자가 보충하여 해석을 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 순교를 앞둔 간청의 긴박함과 원문의 반복·대구를 살리되, 일반 독자가 이해할 수 있도록 최소한으로 다듬었습니다. 제공 자료가 공용 영어 번역 증언이며 그리스어 직접 검토가 보류된 상태이므로, 대괄호 구절과 핵심 모호성은 각주로 투명하게 표시했습니다.
