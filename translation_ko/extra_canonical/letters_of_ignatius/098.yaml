base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: ko
  text: '나는 트로아스에서 네아폴리스로 갑자기 배를 타고 떠나게 되어 모든 교회에 편지를 쓸 수 없었습니다. 그 뜻이 명하는 대로[a], 하나님의 뜻을 지닌 사람답게 앞에 있는 교회들에도 편지를 써 주십시오. 그들도 같은 일을 하게 하려는 것입니다. 할 수 있는 이들은 사절을 보내고, 나머지는 당신이 보내는 사람들을 통해 편지를 보내게 하십시오. 그리하여 여러분이 영원히 기억될 일로 영광을 받게 하십시오. 이는 당신에게 걸맞은 일입니다.


    나는 모든 이에게 이름을 불러 문안합니다. 특히 에피트로포스의 아내와 그의 온 집안, 그리고 자녀들의 집안에 문안합니다. 내가 사랑하는 아탈로스에게 문안합니다. 시리아로 가도록 지명될 사람에게 문안합니다. 은혜가 언제나 그와 함께하고, 그를 보내는 폴리카르포스와 함께하기를 빕니다.


    우리 하나님 예수 그리스도 안에서 여러분이 언제나 강건하기를 빕니다. 그분 안에서, 하나님의 하나 됨과 감독 안에 머무르십시오.[b] 내가 매우 사랑하는 이름, 알케에게 문안합니다. 주님 안에서 강건하십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 뜻이 명하는 대로’입니다. 문맥상 하나님의 뜻을 가리키는 것으로 보이지만, 이 구절에는 ‘하나님의’라는 말이 직접 나오지 않습니다.
    reason: 신적 주체를 본문에서 보충해 확정하지 않고 원문의 생략과 문맥적 의미를 함께 알리기 위해서입니다.
  - marker: b
    text: ‘감독’으로 옮긴 말은 돌봄이나 감독 행위를 뜻할 수도 있고, 교회의 감독 직무를 가리킬 수도 있습니다.
    reason: ἐπισκοπή의 어휘적·교회론적 중의성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: ταῖς ἔμπροσθεν ἐκκλησίαις
  choice: 앞에 있는 교회들
  rationale: 이그나티오스의 이동 경로상 앞쪽에 있는 교회들을 가리키는 공간적 표현을 유지했습니다.
- source_word: θεοῦ γνώμην κεκτημένος
  choice: 하나님의 뜻을 지닌 사람답게
  rationale: γνώμη가 문맥에서 하나님의 생각·뜻·판단을 나타내므로, 특정한 교리적 의미로 좁히지 않고 자연스럽게 옮겼습니다.
- source_word: πεζούς
  choice: 사절
  rationale: 문자적으로는 걸어서 가는 사람들을 가리킬 수 있으나, 여기서는 교회가 파견하는 인편 또는 사절이라는 기능을 드러냈습니다.
- source_word: αἰωνίῳ ἔργῳ
  choice: 영원히 기억될 일
  rationale: 직역인 ‘영원한 일’보다 문맥상 오래도록 기념될 행위라는 뜻을 자연스럽게 전달하되 과도하게 해석하지 않았습니다.
- source_word: Ἔρρωσθε
  choice: 강건하기를 빕니다 / 강건하십시오
  rationale: 고대 서신의 작별 인사이면서 본래 ‘강건하라’는 의미를 지닌 표현을 문맥에 따라 기원문과 권고문으로 옮겼습니다.
theological_decisions:
- issue: τὸ θέλημα의 주체
  choice: 본문에는 ‘그 뜻’으로 두고 각주에서 문자적 형태를 설명함
  alternative: ‘하나님의 뜻’
  rationale: 문맥상 하나님의 뜻일 가능성이 높지만 해당 구절 자체에는 ‘하나님의’가 명시되지 않으므로 본문에서 이를 확정하지 않았습니다.
- issue: ἑνότητι θεοῦ의 관계
  choice: 하나님의 하나 됨
  alternative: 하나님과의 하나 됨
  rationale: 속격이 ‘하나님께 속한 하나 됨’인지 ‘하나님과 이루는 하나 됨’인지 확정하지 않고 원문의 긴장을 보존했습니다.
- issue: ἐπισκοπῇ의 의미
  choice: 감독
  alternative: 돌보심 / 감독 직분
  rationale: 일반적인 감독·보살핌과 교회 감독 직무를 모두 가리킬 여지가 있어 어느 한쪽으로 교리적으로 한정하지 않았습니다.
- issue: ἐν θεῷ ἡμῶν Ἰησοῦ Χριστῷ의 그리스도 호칭
  choice: 우리 하나님 예수 그리스도
  alternative: 우리의 하나님 안에서, 예수 그리스도 안에서
  rationale: 전승된 문구의 직접적인 문법 관계를 따라 예수 그리스도를 ‘우리 하나님’으로 부르는 표현을 유지했습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되, 고대 서신의 정중하고 간결한 문체를 살렸습니다. 수신자 개인에게 하는 요청과 공동체 전체를 향한 인사를 구별했으며, 인명과 지명은 그리스어 형태에 가까운 한국어 음역을 사용했습니다. 제공 자료가 공용 영역 영어 증언을 중심으로 하고 직접적인 그리스어 원문 검토가 보류 중이라고 명시되어 있으므로, 확정하기 어려운 문법·본문 문제는 각주와 결정 사항에서 신중히 밝혔습니다.
