review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 대체로 영어 증언의 내용과 흐름을 따르지만, 단수 수신자인 폴리카르포스를 향한 요청을 ‘여러분’으로 바꾼 점, 에피트로포스의 자녀들에 관한 인사를 ‘자녀들의 집안’으로 확장한 점, 그리고 ‘divine will’을 각주와 달리 본문에서 ‘그 뜻’으로만 처리한 점은 충실성을 약화합니다. ‘은혜가 ... 함께하기를 빕니다’도 원문의 서술적 미래 표현보다 기원으로 바뀌어 있어 바로잡았습니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 단수 청자에게는 ‘당신’을, 공동체 전체를 향한 작별 인사에는 ‘여러분’을 사용했습니다. ‘앞에 있는 교회들’은 이동 경로상의 의미가 자연스럽게 드러나는 ‘앞쪽의 교회들’로, ‘하나님의 하나 됨’은 한국어에서 더 명료한 ‘하나님께 속한 하나 됨’으로 다듬었습니다.
  terminology: θεοῦ γνώμην은 ‘하나님의 뜻을 지닌’으로 유지하되, τὸ θεῖον θέλημα는 별개의 표현이므로 ‘신적인 뜻’으로 옮겼습니다. ἐπισκοπή는 ‘감독’으로 유지하고 각주에서 돌봄/감독 행위와 직무적 의미의 가능성을 밝혔습니다. ‘우리 하나님 예수 그리스도’라는 호칭도 보존했습니다.
  issues:
  - severity: high
    issue: 단수 수신자를 복수 ‘여러분’으로 번역함
    rationale: ‘그리하여 당신이 영광을 받게 하십시오’에 해당하는 영어 증언의 you는 이 서신의 직접 수신자인 폴리카르포스를 가리킵니다. 초안의 ‘여러분’은 청자 범위를 바꿉니다.
  - severity: high
    issue: 에피트로포스의 자녀들에 대한 인사를 ‘자녀들의 집안’으로 확장함
    rationale: 제공된 영어 POB의 ‘those of her children’은 다소 불명료하지만, 공용 영역 영어 증언은 ‘her children’s’로 전하며 ‘집안’이라는 명사를 반복하지 않습니다. 안전하게 ‘그 자녀들에게’로 옮겨 불필요한 확대를 피해야 합니다.
  - severity: medium
    issue: ‘Divine will’의 번역과 각주 설명이 불일치함
    rationale: 본문은 ‘그 뜻’이라고만 하고 각주는 문맥상 하나님의 뜻이라고 설명하지만, 영어 증언은 ‘the Divine will’이라고 명시합니다. ‘신적인 뜻’으로 번역하면 명시된 수식은 보존하면서도 ‘하나님의’로 교리적으로 보충하지 않습니다.
  - severity: medium
    issue: ‘Grace shall be’가 기원문으로 전환됨
    rationale: 영어 증언은 ‘은혜가 ... 함께할 것이다’라는 서술적 미래 표현입니다. 한국어도 ‘함께할 것입니다’로 유지하는 편이 가깝습니다.
  - severity: low
    issue: ‘앞에 있는 교회들’의 한국어가 다소 부자연스러움
    rationale: 공간적·여정상의 ‘ahead’ 의미를 보존하면서 ‘앞쪽의 교회들’로 다듬는 것이 자연스럽습니다.
