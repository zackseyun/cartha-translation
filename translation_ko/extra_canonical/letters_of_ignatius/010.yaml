  english_witness: 'But I have learned that certain persons passed through you from yonder, bringing evil doctrine; whom ye suffered not to sow seed in you, for ye stopped your ears, so that ye might not receive the seed sown by them; forasmuch as ye are stones of a temple, which were prepared beforehand for a building of God the Father, being hoisted up to the heights through the engine of Jesus Christ, which is the Cross, and using for a rope the Holy Spirit; while your faith is your windlass, and love is the way that leadeth up to God.


    So then ye are all companions in the way, carrying your God and your shrine, your Christ and your holy things, being arrayed from head to foot in the commandments of Jesus Christ. And I too, taking part in the festivity, am permitted by letter to bear you company and to rejoice with you, that ye set not your love on anything after the common life of men, but only on God.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: ko
  text: '그러나 저는 어떤 사람들이 저쪽에서 와서 그릇된 가르침을 가지고 여러분을 거쳐 지나갔다는 말을 들었습니다. 여러분은 그들이 여러분 안에 씨를 뿌리도록 허락하지 않았습니다. 그들이 뿌린 씨를 받아들이지 않으려고 귀를 막았기 때문입니다. 여러분은 아버지 하나님의 성전을 이루는 돌들이며, 아버지 하나님의 건축을 위하여 미리 준비된 이들입니다. 여러분은 예수 그리스도의 들어 올리는 장치, 곧 십자가를 통하여 높은 곳으로 끌어올려지고, 성령을 밧줄로 사용합니다. 여러분의 믿음은 권양기이며, 사랑은 하나님께로 이끄는 길입니다.


    그러므로 여러분은 모두 길의 동료들입니다. 여러분은 하나님을 지닌 이들이며 성전을 지닌 이들이고, 그리스도를 지닌 이들이며 거룩한 것들을 지닌 이들입니다.[a] 여러분은 온몸을 예수 그리스도의 계명으로 단장하고 있습니다. 나도 이 축제에 참여하는 이로서, 편지를 통하여 여러분과 함께하고 함께 기뻐할 수 있게 되었습니다. 이는 여러분이 인간의 삶을 따라 아무것도 사랑하지 않고 하나님을 따라 사랑했기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님을 지닌 이들’, ‘성전을 지닌 이들’, ‘그리스도를 지닌 이들’, ‘거룩한 것들을 지닌 이들’은 원문의 반복되는 압축 병렬 표현을 가능한 한 그대로 옮긴 것입니다. 특히 ‘성전’과 ‘거룩한 것들’의 구체적 지시 대상은 본문만으로 단정하기 어렵습니다.
    reason: 제의적·상징적 병렬의 해석 가능성을 보존하고, 특정 교리적 또는 물질적 지시 대상으로 한정하지 않기 위함입니다.
lexical_decisions:
- source_word: evil doctrine (Greek source review pending)
  choice: 악한 가르침
  rationale: ‘그릇된’보다 원문의 도덕적·영적 부정성을 직접 보존하면서도 현대 한국어에서 자연스럽습니다.
- source_word: engine / lifting device
  choice: 기중 장치
  rationale: 십자가를 건축 현장의 들어 올리는 장치에 비유하는 연속된 심상을 살리고, 현대 독자가 기능을 알아볼 수 있게 했습니다.
- source_word: windlass
  choice: 도르래
  rationale: 엄밀히는 권양기 계열의 장치를 가리킬 수 있으나, 건축 은유 속에서 밧줄을 통해 들어 올리는 기능을 일반 독자에게 명료하게 전달합니다.
- source_word: companions in the way
  choice: 길을 함께 가는 동행자들
  rationale: 여정의 실제 심상과 공동의 신앙 여정이라는 함의를 함께 보존합니다.
- source_word: shrine
  choice: 성소
  rationale: ‘신전’은 앞 문단의 성전 은유와 혼동될 수 있어, 몸에 지니는 거룩한 처소·성물을 포괄할 수 있는 표현을 택했습니다.
- source_word: arrayed from head to foot
  choice: 머리부터 발끝까지 … 단장하고
  rationale: 의복의 심상을 유지하면서 자연스럽고 dignified한 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘carrying your God and your shrine, your Christ and your holy things’의 문법과 상징
  choice: ‘자신의 하나님과 성소, 자신의 그리스도와 거룩한 것들을 지니고 가며’로 직역에 가깝게 보존
  alternative: ‘하나님을 모신 성전이며 그리스도와 거룩한 것들을 품고’처럼 해석적으로 풀어쓰기
  rationale: 원문의 병렬적이고 압축된 제의 이미지는 해석상 난점이 있으므로 특정 교리적 의미로 환원하지 않았습니다.
- issue: 마지막 문장의 ‘after the common life of men’의 의미
  choice: ‘보통 사람들의 삶을 따라’로 옮기고 각주로 잠정성을 밝혔습니다.
  alternative: ‘인간의 통상적인 생활 방식에 속한 어떤 것도’ 또는 ‘세상 방식에 따라’
  rationale: 인간적 생활 방식이나 세속적 욕망을 가리킬 수 있으나, 직접 그리스어 검토 전에는 범위를 단정하지 않는 것이 적절합니다.
- issue: 하나님께로 ‘올라가는’ 건축 은유
  choice: 높은 곳으로 들어 올려지고 사랑을 하나님께로 올라가는 길로 표현
  alternative: 영적 성숙이나 구원으로 명시하여 의역
  rationale: 원문의 수직적 건축·순례 심상을 보존하고 구체적인 구원론적 체계로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 건축 장비, 성전, 순례, 의복, 축제의 연속된 은유를 가능한 한 유지하되, 지나치게 고어적인 표현은 피했습니다. 제공 자료가 중간형 그리스어 전승 자체가 아니라 공용 영어 번역 증언문이므로 본문과 어휘 선택은 잠정적이며, 출판 확정 전 그리스어 원문 대조가 필요합니다.
