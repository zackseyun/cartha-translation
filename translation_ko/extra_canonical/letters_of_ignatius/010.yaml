revisions:
- from: '그러나 저쪽에서 온 어떤 사람들이 악한 가르침을 가지고 여러분 가운데를 지나갔다는 말을 들었습니다. 여러분은 그들이 여러분 안에 씨를 뿌리도록 내버려 두지 않았습니다. 그들이 뿌리는 씨를 받아들이지 않으려고 귀를 막았기 때문입니다. 여러분은 성전을 이루는 돌들로서, 아버지 하나님의 건물을 위해 미리 준비되었습니다. 여러분은 예수 그리스도의 기중 장치, 곧 십자가를 통해 높은 곳으로 들어 올려지고, 성령을 밧줄로 삼습니다. 여러분의 믿음은 도르래이고, 사랑은 하나님께로 올라가는 길입니다.


    그러므로 여러분은 모두 길을 함께 가는 동행자들입니다. 여러분은 자신의 하나님과 성소, 자신의 그리스도와 거룩한 것들을 지니고 가며,[a] 머리부터 발끝까지 예수 그리스도의 계명으로 단장하고 있습니다. 나도 이 축제에 참여하여, 편지로나마 여러분과 동행하며 함께 기뻐할 수 있게 되었습니다. 여러분이 보통 사람들의 삶을 따라 그 어떤 것도 사랑하지 않고 오직 하나님만 사랑하기 때문입니다.[b]'
  to: '그러나 저는 어떤 사람들이 저쪽에서 와서 그릇된 가르침을 가지고 여러분을 거쳐 지나갔다는 말을 들었습니다. 여러분은 그들이 여러분 안에 씨를 뿌리도록 허락하지 않았습니다. 그들이 뿌린 씨를 받아들이지 않으려고 귀를 막았기 때문입니다. 여러분은 아버지 하나님의 성전을 이루는 돌들이며, 아버지 하나님의 건축을 위하여 미리 준비된 이들입니다. 여러분은 예수 그리스도의 들어 올리는 장치, 곧 십자가를 통하여 높은 곳으로 끌어올려지고, 성령을 밧줄로 사용합니다. 여러분의 믿음은 권양기이며, 사랑은 하나님께로 이끄는 길입니다.


    그러므로 여러분은 모두 길의 동료들입니다. 여러분은 하나님을 지닌 이들이며 성전을 지닌 이들이고, 그리스도를 지닌 이들이며 거룩한 것들을 지닌 이들입니다.[a] 여러분은 온몸을 예수 그리스도의 계명으로 단장하고 있습니다. 나도 이 축제에 참여하는 이로서, 편지를 통하여 여러분과 함께하고 함께 기뻐할 수 있게 되었습니다. 이는 여러분이 인간의 삶을 따라 아무것도 사랑하지 않고 하나님을 따라 사랑했기 때문입니다.'
  rationale: 건축 현장의 비유(십자가=들어 올리는 장치, 성령=밧줄, 믿음=권양기)를 기능상 정확하게 정비했습니다. 둘째 문단에서는 원문의 -φοροι 반복과 명사 병렬을 보존하되 ‘자신의’라는 비원문적 소유 강조를 제거했습니다. 마지막 문장은 원문의 회고적 인과와 ‘인간의 삶을 따라’ 대 ‘하나님을 따라’의 대조를 회복했습니다. 불필요해진 기존 b 각주는 삭제했습니다.
