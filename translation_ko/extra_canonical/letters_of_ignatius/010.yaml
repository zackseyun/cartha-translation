review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 건축·상승의 은유를 대체로 보존하지만, ‘windlass’를 ‘도르래’로 옮긴 것은 장치의 기능상 정확하지 않고, 마지막 문장은 원문의 과거 시제와 ‘하나님을 따라/하나님에 따라’라는 대조를 ‘오직 하나님만 사랑하기 때문’으로 좁히고 인과 관계를 바꾸었습니다. 또한 δεύτε 문단의 압축된 -φοροι 병렬은 ‘자신의 …을 지니고’보다 ‘…을 지닌 이들’로 옮겨야 소유격을 덧붙이지 않고 원문의 명칭형 병렬을 더 충실히 반영합니다.
  naturalness: ‘기중 장치’는 다소 기술 문서적이며, 이어지는 밧줄·권양기 비유에서는 ‘들어 올리는 장치’가 현대 한국어로 더 자연스럽습니다. ‘여러분 가운데를 지나갔다는’은 ‘여러분을 거쳐 지나갔다는’보다 부자연스럽고 의미가 달라질 수 있어 고쳤습니다. 합쇼체의 격식은 유지했습니다.
  terminology: ‘권양기’는 밧줄을 감아 끌어올리는 windlass에 알맞습니다. ‘성전 지닌 이들’, ‘그리스도를 지닌 이들’, ‘거룩한 것들을 지닌 이들’은 θεοφόροι·ναοφόροι·χριστοφόροι·ἁγιοφόροι의 반복적 합성어 형태를 해석적으로 특정하지 않고 반영합니다. ‘하나님을 따라’는 κατὰ θεόν의 대조를 보존하며, 이를 ‘하나님만 사랑하다’로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘windlass’를 ‘도르래’로 번역함
    rationale: 도르래는 회전 바퀴를 이용하는 장치이고, windlass는 밧줄을 감아 하중을 끌어올리는 권양 장치입니다. 원문의 건축 비유에서 믿음은 밧줄을 작동시키는 권양기이므로 ‘권양기’가 더 정확합니다.
  - severity: high
    issue: 마지막 문장의 의미·시제·연결을 변경함
    rationale: 원문은 ‘여러분이 인간의 삶을 따라 아무것도 사랑하지 않고 하나님을 따라 사랑했기 때문에’라는 회고적 이유입니다. 초안은 현재적 권면처럼 만들고 ‘오직 하나님만’이라는 배타성을 추가하여 의미 범위를 좁혔습니다.
  - severity: medium
    issue: ‘carrying your God and your shrine …’에 ‘자신의’를 반복해 넣음
    rationale: 원문의 -φοροι 병렬은 소유를 강조하지 않는 명칭형 표현입니다. ‘자신의’는 불필요한 소유 뉘앙스를 더하며, ‘성소’는 ναός의 성전 이미지보다 좁을 수 있습니다.
  - severity: low
    issue: ‘passed through you’를 ‘여러분 가운데를 지나갔다’로 옮김
