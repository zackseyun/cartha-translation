base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: ko
  text: '어떤 사람들이 육신을 따라 나를 속이려 했지만, 하나님에게서 난 영은 속지 않습니다. 그 영은 자신이 어디에서 와서 어디로 가는지 알고, 감추어진 것들을 살펴 알아내기 때문입니다. 내가 여러분 가운데 있을 때 나는 큰 소리로 외쳤고, 하나님의 음성으로 이렇게 말했습니다. “감독과 장로단과 집사들에게 주의를 기울이십시오.”


    그런데 어떤 이들은 내가 몇몇 사람의 분열을 미리 알고 있었기 때문에 이런 말을 했다고 의심했습니다. 그러나 내가 그분 안에서 결박되어 있는데, 바로 그분께서 내가 이것을 사람의 육신에게서 배우지 않았다는 증인이십니다. 오히려 성령께서 선포하시며 이렇게 말씀하신 것입니다. “감독 없이 아무것도 하지 마십시오. 여러분의 육신을 하나님의 성전으로 지키십시오. 연합을 소중히 여기고, 분열을 피하십시오. 예수 그리스도께서 친히 아버지를 본받으신 것처럼, 여러분도 예수 그리스도를 본받는 사람이 되십시오.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 중간 판본 전통의 공용 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 그리스어 원문에 대한 직접 대조가 아직 이루어지지 않았으므로, 특히 ‘영/성령’과 일부 명령문의 정확한 뉘앙스는 원문 검토 뒤 조정될 수 있습니다.
    reason: 사용자가 제공한 자료에 그리스어 본문이 없고 ‘source-language review pending’이라고 명시되어 있으므로 번역의 자료적 한계를 투명하게 밝혔습니다.
lexical_decisions:
- source_word: κατὰ σάρκα / after (according to) the flesh
  choice: 육신을 따라
  rationale: 단순히 ‘인간적으로’라고 풀어 신학적·수사적 긴장을 제거하지 않고, 초기 그리스도교 문헌의 ‘육신’ 어휘를 보존했습니다.
- source_word: τὸ πνεῦμα / the spirit
  choice: 영 / 성령
  rationale: 첫 문맥에서는 원문 증거 검토가 아직 미완료이므로 ‘영’의 가능한 지시 대상을 단정하지 않았고, 뒤의 ‘성령의 선포’에서는 하나님에게서 오는 계시 주체라는 문맥과 영어 증언을 따라 ‘성령’으로 옮겼습니다.
- source_word: ἐπισκόπῳ / bishop
  choice: 감독
  rationale: 후대 교단의 특정 직제 명칭을 소급해 넣지 않으면서 초기 교회의 직분 용어를 익숙한 한국어 성서·교회사 용례로 표현했습니다.
- source_word: πρεσβυτερίῳ / presbytery
  choice: 장로단
  rationale: 개별 장로가 아니라 집합적 회의체 또는 장로들의 무리를 가리키는 뜻을 살렸습니다.
- source_word: διακόνοις / deacons
  choice: 집사들
  rationale: 초기 교회의 직분을 나타내는 통상적인 한국어 표현을 사용했습니다.
- source_word: ἕνωσιν / union
  choice: 연합
  rationale: 조직적 통합만이 아니라 공동체적 하나 됨을 나타내도록 ‘연합’을 선택했습니다.
- source_word: σχίσματα / divisions
  choice: 분열
  rationale: 공동체 내부의 갈라짐이라는 강한 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘영’의 정체
  choice: 첫 단락에서는 ‘영’, 둘째 단락에서는 ‘성령’
  alternative: 두 곳 모두 ‘성령’ 또는 두 곳 모두 ‘영’
  rationale: 첫 단락의 표현은 요한복음 3:8 및 고린도전서 2:10을 연상시키지만 직접 그 정체를 확정하기에는 제공된 자료가 제한적입니다. 반면 둘째 단락에서는 말하고 선포하는 계시의 주체가 분명하여 ‘성령’으로 번역했습니다.
- issue: 교회 직분자들에 대한 명령의 강도
  choice: ‘주의를 기울이십시오’
  alternative: ‘복종하십시오’ 또는 ‘순종하십시오’
  rationale: 제공된 영어 증언의 ‘Give ye heed to / Pay attention to’를 넘어서 복종의 의미를 덧붙이지 않았습니다.
- issue: ‘그분 안에서 결박되어 있다’의 의미
  choice: 은유를 그대로 보존
  alternative: ‘그분 때문에 갇혀 있다’
  rationale: 그리스도와의 연합 및 그분을 위한 투옥이라는 두 층위가 함께 들릴 수 있으므로 한쪽으로 해소하지 않았습니다.
- issue: 그리스도의 아버지 모방
  choice: ‘아버지를 본받으신 것처럼’
  alternative: ‘아버지께 순종하신 것처럼’
  rationale: ‘imitator’의 평행 구조를 유지하고, 후대의 신학적 설명을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 교회 문헌의 엄숙한 권면조는 유지하되 지나치게 고어적인 표현은 피했습니다. 인용된 명령문은 일관되게 ‘-십시오’로 옮겼고, ‘감독·장로단·집사’는 교회사적 의미를 보존하는 통상 용어를 사용했습니다.
