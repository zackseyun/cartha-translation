id: IGN.081
reference: Letters of Ignatius — IgnSmyrn. 5
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'But certain persons ignorantly deny Him, or rather have been denied by Him, being advocates of death rather than of the truth; and they have not been persuaded by the prophecies nor by the law of Moses, nay nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if a man praiseth me, but blasphemeth my Lord, not confessing that He was a bearer of flesh? Yet he that affirmeth not this, doth thereby deny Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing--nay, far be it from me even to remember them, until they repent and return to the passion, which is our resurrection.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'But certain persons ignorantly deny Him, or rather have been denied by Him, being advocates of death rather than of the truth; and they have not been persuaded by the prophecies nor by the law of Moses, nay nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if a man praiseth me, but blasphemeth my Lord, not confessing that He was a bearer of flesh? Yet he that affirmeth not this, doth thereby deny Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing--nay, far be it from me even to remember them, until they repent and return to the passion, which is our resurrection.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/081.yaml
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent and return to the passion, which is our resurrection.'
translation:
  language: ko
  text: '그러나 어떤 사람들은 무지하여 그분을 부인합니다. 아니, 오히려 그분께 부인당한 사람들입니다. 그들은 진리의 편보다 죽음의 편을 드는 자들입니다. 그들은 예언의 말씀들에도, 모세의 율법에도 설득되지 않았고, 바로 오늘까지도 복음에도, 우리 각자가 겪는 고난에도 설득되지 않았습니다. 그들이 우리에 대해서도 같은 생각을 품고 있기 때문입니다.


    누가 나를 칭찬하면서도 내 주님을 모독하며, 그분께서 육신을 지니신 분이심을 고백하지 않는다면, 그것이 내게 무슨 유익이 있겠습니까? 그러나 이것을 말하지 않는 사람은 그로써 그분을 완전히 부인하는 것이며, 자신은 시체를 지닌 자입니다.[a]


    그러나 믿지 않는 그들의 이름을 글로 기록하는 것은 마땅하지 않다고 여겼습니다. 아니, 그들이 회개하여 우리의 부활인 그 수난으로 돌아올 때까지는 그들의 이름을 기억하는 일조차 결코 하지 않겠습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘시체를 지닌 자’는 ‘육신을 지니신 분’과 대조되는 수사적 표현입니다.
    reason: 그리스어의 의도적인 합성어 대조를 드러내되, 그 이미지에 원문에 없는 지속적 행위의 뜻을 덧붙이지 않기 위해서입니다.
  - marker: b
    text: ‘우리의 부활인 그 수난’은 수난과 우리의 부활을 동일격으로 연결하는 표현입니다.
    reason: 원문의 문법적 연결을 보존하며, 이를 특정한 교리 체계에 따라 인과 관계로 풀어쓰지 않기 위해서입니다.
lexical_decisions:
- source_word: advocates of death
  choice: 죽음을 두둔하는 자들
  rationale: 진리와 죽음의 대조 및 적극적으로 죽음의 편을 드는 논쟁적 뉘앙스를 보존했습니다.
- source_word: bearer of flesh
  choice: 육신을 지니신 분
  rationale: 그리스도께서 실제 육체를 지니셨다는 문맥의 핵심을 자연스럽고도 명시적으로 나타냈습니다.
- source_word: bearer of a corpse
  choice: 시체를 지고 다니는 자
  rationale: 앞의 ‘육신을 지니신 분’과 대조되는 충격적인 이미지를 완화하지 않고 보존했습니다.
- source_word: passion
  choice: 수난
  rationale: 그리스도의 고난과 죽음을 가리키는 초기 기독교 문맥의 통상적이고 품위 있는 표현을 택했습니다.
theological_decisions:
- issue: ‘or rather have been denied by Him’의 주체와 태
  choice: 그분께 부인당했습니다
  alternative: 그분을 알지 못했습니다
  rationale: 수동태의 역전과 심판적 긴장을 그대로 보존하고 설명적으로 바꾸지 않았습니다.
- issue: 그리스도의 육체성 고백
  choice: 그분께서 육신을 지니신 분이셨음
  alternative: 그분께서 육신으로 오셨음
  rationale: 증언문의 독특한 ‘육신을 지닌 자’ 형상을 유지하며 성육신에 관한 특정 후대 공식으로 대체하지 않았습니다.
- issue: ‘the passion, which is our resurrection’의 관계
  choice: 우리의 부활인 그 수난
  alternative: 우리를 부활시키는 그 수난
  rationale: 수난과 부활을 동일격으로 잇는 원문의 신학적 긴장을 인과관계로 풀어 쓰지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 초기 기독교 권면문의 엄숙하고 논쟁적인 어조를 유지했습니다. 다만 제공된 자료가 공용 영어 번역 증언에 근거하고 원문 그리스어 검토가 보류된 상태이므로, 어휘와 통사에 관한 최종 확정 전 직접 원문 대조가 필요합니다.
