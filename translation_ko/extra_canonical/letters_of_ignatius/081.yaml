  - severity: low
    issue: ‘시체를 지고 다니는 자’
    rationale: νεκροφόρος의 충격적인 합성어와 σαρκοφόρος의 대조는 잘 포착했으나, ‘지고 다니는’은 원문에 없는 반복·이동의 뉘앙스를 보탭니다.
