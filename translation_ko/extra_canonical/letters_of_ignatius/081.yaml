review_pass:
  verdict: revise
  source_fidelity: 대체로 충실합니다. 그러나 그리스어의 μοι(‘내게’)는 실제 본문에 있는 말이므로 영어 증언의 대괄호를 한국어 본문과 각주에 그대로 보존할 이유가 없습니다. 또한 νεκροφόρος는 ‘시체를 지고 다니는’이라는 지속적 행위를 뜻한다기보다 ‘시체를 지닌/메고 있는 자’라는 수사적 조어이므로, 앞의 ‘육신을 지니신 분’과의 형태상 대조를 더 가깝게 유지하는 편이 좋습니다.
  naturalness: 현대 합쇼체와 전체 논쟁적 문체는 적절합니다. 다만 ‘그들을 기억하는 것조차 내게서 멀리 있기를 바랍니다’는 원문의 강한 관용적 금지를 다소 부자연스럽게 옮깁니다. ‘그들의 이름을 기억하는 일조차 결코 하지 않겠습니다’가 자연스럽고 문맥상 분명합니다.
