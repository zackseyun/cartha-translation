    issue: 마지막 문장의 관용 표현
    rationale: ‘far be it from me’에 해당하는 강한 거부 표현은 ‘내게서 멀리 있기를 바랍니다’보다 ‘결코 하지 않겠습니다’로 옮길 때 자연스럽고 단호합니다.
