review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 그리스어 중간 장문 전승의 ὅπερ καὶ ποιεῖς는 ‘실제로 당신이 그렇게 하고 있습니다’라는 확인으로 읽히며, 초안의 ‘그렇게 하지 않고 있습니다’는 반대로 옮겼습니다. 이는 제공된 영어 증거 및 English POB의 ‘as indeed you do not’와도 충돌하지만, 원문을 우선해야 합니다. 또한 마지막 문장은 목적·경계(‘…되지 않도록’)를 나타내야 합니다.
  naturalness: 전반적으로 합쇼체와 문단 구성은 자연스럽습니다. 다만 ‘모든 사람을 이름을 불러 찾아보십시오’는 목적어 구성상 다소 어색하여 ‘한 사람씩 이름을 불러 찾으십시오’로 다듬는 것이 자연스럽습니다. ‘공동체의 비용’은 해석을 한 단계 보태므로 본문에서는 ‘공적 비용’으로 보존하는 편이 안전합니다.
  terminology: ‘과부’, ‘보호자’, ‘모임’, ‘더 나은 자유’, ‘욕망의 종’은 본문의 개방성을 대체로 보존합니다. 현대 한국어에서는 법적 예속 상태를 명확히 하는 ‘남녀 노예들’이 ‘남자든 여자든 종들’보다 자연스럽고 분명합니다. 하나님에게서 오는 자유는 ‘하나님께로부터’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘as indeed thou doest not’에 따른 부정 번역
    rationale: 그리스어 ὅπερ καὶ ποιεῖς는 앞선 ‘하나님 없이 아무것도 하지 말라’는 권면을 수신자가 بالفعل 실천하고 있음을 확인합니다. 초안의 ‘그렇게 하지 않고 있습니다’는 정반대 뜻입니다. 제공된 영어 번역 계열의 부정은 원문과 대조할 때 따를 수 없습니다.
  - severity: medium
    issue: 마지막 경계절의 인과화
    rationale: ‘lest they be found slaves of lust’는 해방을 바라지 말아야 하는 목적/경계이지, 이미 그 결과가 발생할 수 있다는 별도 인과 설명이 아닙니다. ‘…되지 않도록’으로 옮겨야 합니다.
  - severity: low
    issue: ‘공동체의 비용’의 의미 특정
    rationale: κοινῷ는 ‘공동의/공적 비용으로’라는 표현입니다. 교회 공동체 재원으로 한정하지 않기 위해 본문은 ‘공적 비용’으로 두고 역사적 가능성은 각주에서 제한적으로 설명하는 것이 좋습니다.
