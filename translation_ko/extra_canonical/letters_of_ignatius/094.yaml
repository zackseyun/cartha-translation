source:
  text: 'Let not widows be neglected. After the Lord be thou their protector. Let nothing be done without thy consent; neither do thou anything without the consent of God, as indeed thou doest not. Be steadfast.


    Let meetings be held more frequently. Seek out all men by name.


    Despise not slaves, whether men or women. Yet let not these again be puffed up, but let them serve the more faithfully to the glory of God, that they may obtain a better freedom from God. Let them not desire to be set free at the public cost, lest they be found slaves of lust.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
