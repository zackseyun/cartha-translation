    Despise not slaves, whether men or women. Yet let not these again be puffed up, but let them serve the more faithfully to the glory of God, that they may obtain a better freedom from God. Let them not desire to be set free at the public cost, lest they be found slaves of lust.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be slaves of lust.'
translation:
  language: ko
  text: '과부들을 소홀히 대하지 마십시오. 주님 다음으로 당신이 그들의 보호자가 되십시오. 당신의 동의 없이는 아무 일도 이루어지지 않게 하십시오. 또한 하나님 없이 아무 일도 하지 마십시오. 실제로 당신은 그렇게 하고 있습니다. 굳건히 서십시오.


    모임을 더 자주 가지십시오. 모든 사람을 한 사람씩 이름을 불러 찾으십시오.


    남녀 노예들을 업신여기지 마십시오. 그러나 그들이 도리어 우쭐해지지 않게 하고, 하나님의 영광을 위하여 더욱 충실히 섬기게 하십시오. 그리하여 그들이 하나님께로부터 더 나은 자유를 얻게 하십시오. 그들이 공적 비용으로 해방되기를 바라지 않게 하십시오. 그들이 욕망의 종으로 판명되지 않도록 하십시오.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 권고는 고대 노예제 사회의 상황을 전제로 합니다. ‘공적 비용’(직역하면 ‘공동의 비용’)은 공동 기금으로 노예를 해방하는 일을 가리킬 수 있습니다. ‘더 나은 자유’와 ‘욕망의 종’은 법적 해방과 하나님께로부터 받는 자유를 대조하는 표현이지만, 그 자유의 성격을 본문은 더 규정하지 않습니다.
    reason: 고대의 역사적 맥락을 밝혀 현대 독자가 이 문장을 노예제에 대한 보편적 승인으로 오해하지 않도록 하되, 본문이 명시하지 않은 제도적 세부 사항이나 교리적 해석은 덧붙이지 않습니다.
lexical_decisions:
- source_word: widows
  choice: 과부들
  rationale: 고대 교회가 특별히 돌보던 배우자를 잃은 여성 집단을 가리키므로, 문맥상 분명하고 자연스러운 표현을 택했습니다.
- source_word: protector
  choice: 보호자
  rationale: 돌보고 지키는 책임을 간결하게 나타내며, 원문 증거가 확정되기 전에는 더 구체적인 직분 의미를 덧붙이지 않았습니다.
- source_word: meetings
  choice: 모임
  rationale: 교회의 집회일 가능성이 크지만, 제공된 영어 증거의 포괄성을 보존하기 위해 '예배'로 좁히지 않았습니다.
- source_word: Seek out all men by name
  choice: 모든 사람을 이름을 불러 찾아보십시오
  rationale: 개개인을 알아보고 직접 살피라는 뜻을 자연스럽게 전달하면서 성별 포괄적 의미를 보존했습니다.
- source_word: slaves, whether men or women
  choice: 남자든 여자든 종들
  rationale: 고대의 법적·사회적 예속 상태를 숨기지 않되, 한국어 역사·성경 문체에 맞게 '종'으로 옮겼습니다.
- source_word: better freedom
  choice: 더 나은 자유
  rationale: 현세의 법적 해방과 하나님이 주시는 더 높은 자유 사이의 의도적인 긴장을 해소하지 않고 직역에 가깝게 보존했습니다.
- source_word: public cost
  choice: 공동체의 비용
  rationale: 공적 기금 또는 교회 공동체의 재원을 뜻할 수 있어, 현대 한국어에서 문맥을 이해할 수 있도록 표현했습니다.
- source_word: lust
  choice: 욕망
  rationale: 성적 정욕만으로 한정될 수 있는 '음욕'보다 넓은 의미를 보존했습니다.
theological_decisions:
- issue: 감독의 권위와 하나님의 뜻 사이의 관계
  choice: '''당신의 동의''와 ''하나님의 동의''를 병렬로 유지했습니다.'
  alternative: 하나님의 '뜻'이나 '허락'으로 의역할 수 있습니다.
  rationale: 공동체 안에서 수신자의 감독권을 강조하면서도 그 권위가 하나님께 종속된다는 본문의 긴장을 그대로 남겼습니다.
- issue: 종들이 하나님에게서 얻는 '더 나은 자유'
  choice: 영적 자유라고 명시하지 않고 '더 나은 자유'로 유지했습니다.
  alternative: '''참된 자유'' 또는 ''영적인 자유''로 해석해 옮길 수 있습니다.'
  rationale: 현세적 해방과 종말론적·영적 자유의 대비가 암시되지만, 본문이 그 성격을 명시하지 않으므로 해석을 확정하지 않았습니다.
- issue: 공동 비용으로 이루어지는 해방에 대한 경고
  choice: 권고의 역사적 맥락을 그대로 번역하고 각주로 난점을 밝혔습니다.
  alternative: 현대적 적용을 고려해 완화하거나 생략할 수 있습니다.
  rationale: 노예제를 승인하는 일반 원칙으로 확대하지 않으면서도 고대 공동체를 향한 실제 권고를 삭제하지 않았습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 수신자는 단수이므로 '당신'을 유지했습니다. 다만 제공 자료가 공용 영어 번역 증거에 기초하고 그리스어 원문 검토가 아직 이루어지지 않았으므로, 어휘의 세부 뉘앙스는 잠정적입니다.
