  english_witness: 'But as touching my fellow servant Burrhus, who by the will of God is your deacon blessed in all things, I pray that he may remain with me to the honor of yourselves and of your bishop. Yea, and Crocus also, who is worthy of God and of you whom I received as an ensample of the love which ye bear me, hath relieved me in all ways--even so may the Father of Jesus Christ refresh him--together with Onesimus and Burrhus and Euplus and Fronto; in whom I saw you all with the eyes of love.


    May I have joy of you always, if so be I an worthy of it. It is therefore meet for you in every way to glorify Jesus Christ who glorified you; that being perfectly joined together in one submission, submitting yourselves to your bishop and presbytery, ye may be sanctified in all things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: ko
  text: '나의 동료 종 부로에 관해서 말씀드립니다. 그는 하나님의 뜻에 따라 여러분의 집사로 섬기며 모든 면에서 복을 받은 사람입니다. 그가 여러분과 여러분의 감독에게 영예가 되도록 내 곁에 머물러 있기를 청합니다. 또한 하나님과 여러분에게 합당한 사람인 크로고도 있습니다. 나는 여러분이 내게 품은 사랑의 본보기로 그를 맞아들였는데, 그는 모든 면에서 나를 편안하게 해 주었습니다. 예수 그리스도의 아버지께서 그에게도 편안함을 주시기를 바랍니다. 오네시모와 부로와 유블로와 프론도에게도 그렇게 해 주시기를 바랍니다. 나는 사랑의 눈으로 그들 안에서 여러분 모두를 보았습니다.


    내가 참으로 그럴 자격이 있다면, 언제나 여러분으로 말미암아 기뻐하기를 바랍니다. 그러므로 여러분을 영광스럽게 하신 예수 그리스도께 모든 면에서 영광을 돌리는 것이 여러분에게 마땅합니다. 한 순종 안에서 온전히 하나로 결합되고, 여러분의 감독과 원로단에 순종하여, 모든 면에서 거룩하게 되십시오.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공공 영역 영어 증언 본문을 중심으로 작성한 잠정 번역입니다. 중간 판본의 그리스어 사본 전통에 대한 직접 대조가 아직 필요합니다.
    reason: 요청 자료 자체가 그리스어 원문 검토 대기 상태라고 밝히므로, 본문의 문헌적 한계를 독자에게 투명하게 알립니다.
lexical_decisions:
- source_word: σύνδουλος / “fellow servant” (영어 증언 본문)
  choice: 동료 종
  rationale: 그리스도를 함께 섬기는 관계를 드러내면서도 원문의 종됨 이미지를 보존했습니다.
- source_word: διάκονος / “deacon” (영어 증언 본문)
  choice: 집사
  rationale: 초기 교회의 직무 명칭으로 통용되는 현대 한국어 표현을 사용했습니다.
- source_word: ἐπίσκοπος / “bishop” (영어 증언 본문)
  choice: 감독
  rationale: 후대의 교파적 직제 명칭을 직접 투영하기보다, 초기 교회 문맥에서 비교적 중립적인 역사적 직함을 택했습니다.
- source_word: πρεσβυτέριον / “presbytery” (영어 증언 본문)
  choice: 원로단
  rationale: 개별 원로들이 아니라 집합적 지도 기구를 가리키는 점을 살리고, 특정 현대 교단의 ‘노회’와 동일시하지 않았습니다.
- source_word: ἀναπαύω / “relieved … refresh” (영어 증언 본문)
  choice: 편안하게 해 주다 / 편안함을 주다
  rationale: 도움, 쉼, 위로가 겹치는 표현의 의미 범위를 지나치게 좁히지 않으면서 두 용례의 어휘적 연결을 유지했습니다.
- source_word: ὀφθαλμοῖς ἀγάπης / “with the eyes of love” (영어 증언 본문)
  choice: 사랑의 눈으로
  rationale: 비유의 독특한 형상을 그대로 보존했습니다.
theological_decisions:
- issue: 감독과 원로단에 대한 순종과 성화의 관계
  choice: 목적·결과를 나타내는 흐름을 유지하되, 순종 자체가 자동으로 성화를 만들어 낸다고 해설하지 않았습니다.
  alternative: ‘순종함으로써 거룩해지십시오’처럼 직접적인 수단 관계로 번역
  rationale: 제공된 증언 본문의 구문은 결합, 순종, 성화 사이의 관계를 함축하지만 그 인과성을 완전히 규정하지 않으므로 긴장을 보존했습니다.
- issue: ‘예수 그리스도의 아버지’라는 표현
  choice: 예수 그리스도의 아버지
  alternative: 하나님 아버지
  rationale: 초기 기독교 문헌의 명시적 관계 표현을 일반화하지 않고 그대로 살렸습니다.
- issue: ‘한 순종’의 대상
  choice: 대상을 덧붙이지 않고 ‘한 순종 안에서’로 번역
  alternative: ‘감독에게 한마음으로 순종하며’
  rationale: ‘한 순종’과 뒤따르는 감독·원로단에 대한 순종의 관계를 번역자가 완전히 동일시하지 않도록 원문의 압축성과 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 인명은 그리스어형에 가까운 관용 음역(부로, 크로고, 오네시모, 유블로, 프론도)을 적용했습니다. 문장은 낭독 가능성을 위해 적절히 나누되, 반복과 병행 구조 및 권면의 엄숙함은 유지했습니다.
