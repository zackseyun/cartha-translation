    그때부터 온갖 주술과 주문이 풀렸고, 악에 대한 무지가 사라졌으며, 옛 왕국은 무너졌습니다. 하나님께서 영원한 생명의 새로움을 위하여 사람의 모습으로 나타나셨을 때, 하나님의 뜻 가운데 완성되어 있던 것이 효력을 발휘하기 시작했습니다. 그때부터 모든 것이 뒤흔들렸으니, 죽음을 없애는 일이 시작되었기 때문입니다.'
