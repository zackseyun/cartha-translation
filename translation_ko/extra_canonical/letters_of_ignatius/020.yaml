base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: ko
  text: '이 세상의 통치자에게는 마리아의 동정과 그의 출산, 그리고 주님의 죽음도 감추어져 있었습니다. 이 셋은 크게 선포되어야 할 신비이며, 하나님의 침묵 가운데 이루어진 것입니다. 그러면 그것들은 어떻게 여러 시대에 드러났습니까?


    하늘에 한 별이 나타나 모든 별보다 더 밝게 빛났습니다. 그 빛은 말로 표현할 수 없었고, 그 별의 낯선 모습은 놀라움을 자아냈습니다. 다른 모든 별자리와 해와 달은 그 별을 둘러싸고 합창단을 이루었지만, 그 별은 그 모든 것보다 훨씬 더 밝게 빛났습니다. 다른 것들과 전혀 닮지 않은 이 낯선 현상이 어디에서 왔는지 몰라 모두 어리둥절했습니다.


    그때부터 온갖 주술과 주문이 풀렸고, 악에 대한 무지가 사라졌으며, 옛 왕국은 무너졌습니다. 하나님께서 영원한 생명의 새로움을 위하여 사람의 모습으로 나타나셨을 때, 하나님의 뜻 가운데 완성되어 있던 것이 효력을 나타내기 시작했습니다. 그때부터 모든 것이 뒤흔들렸으니, 죽음을 없애는 일이 시작되었기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince/ruler of this world (Greek review pending)
  choice: 이 세상의 통치자
  rationale: ‘prince’를 계급적 ‘왕자’로 오해하지 않도록 통치 권세를 나타내는 자연스러운 표현을 택했습니다.
- source_word: virginity
  choice: 동정
  rationale: 마리아가 아이를 낳기 전의 동정 상태를 가리키는 초기 기독교 문맥의 간결하고 품위 있는 표현입니다.
- source_word: mysteries to be cried aloud
  choice: 크게 선포되어야 할 신비
  rationale: 감추어진 ‘신비’와 공개적으로 널리 외치는 역설을 보존했습니다.
- source_word: in the silence of God
  choice: 하나님의 침묵 가운데
  rationale: 모호하고 신학적으로 긴장된 원문 표현을 설명하여 해소하지 않고 그대로 살렸습니다.
- source_word: formed themselves into a chorus
  choice: 합창단을 이루었지만
  rationale: 천체들이 별을 중심으로 조화를 이루는 시적 비유를 유지했습니다.
- source_word: ignorance of wickedness
  choice: 악에 대한 무지
  rationale: ‘악 자체인 무지’와 ‘악에 관한 무지’ 사이의 가능한 의미 가운데 영어 증언의 표면적 구문을 따르되, 직접 그리스어 검토 전에는 과도한 해석을 피했습니다.
- source_word: ancient kingdom
  choice: 옛 왕국
  rationale: 그 왕국의 정체를 사탄의 지배 등으로 명시하지 않아 원문의 함축성을 보존했습니다.
- source_word: unto newness of everlasting life
  choice: 영원한 생명의 새로움을 위하여
  rationale: 목적·결과·방향의 관계가 다소 열린 표현임을 유지하면서 한국어 문장으로 자연스럽게 연결했습니다.
- source_word: abolishing of death was taken in hand
  choice: 죽음을 없애는 일이 시작되었습니다
  rationale: 관용적 수동 표현의 뜻을 현대 한국어로 명료하게 전달했습니다.
theological_decisions:
- issue: 마리아의 동정과 출산 및 주님의 죽음이 통치자에게 감추어졌다는 진술
  choice: 세 사건을 나란히 놓아 그대로 번역함
  alternative: 통치자를 사탄으로 명시하거나 각 사건이 감추어진 방식을 설명함
  rationale: 본문이 명시하지 않은 존재의 정체나 은폐 방식을 교리적으로 보충하지 않았습니다.
- issue: ‘하나님의 침묵’과 ‘크게 선포되어야 할 신비’의 긴장
  choice: 두 표현을 모두 직설적으로 보존함
  alternative: ‘하나님의 은밀한 계획’처럼 뜻을 풀어 번역함
  rationale: 침묵 속에서 이루어졌으나 크게 선포되는 역설이 본문의 핵심 수사이므로 해소하지 않았습니다.
- issue: 하나님께서 사람의 모습으로 나타나셨다는 성육신 표현
  choice: ‘하나님께서 … 사람의 모습으로 나타나셨을 때’
  alternative: ‘하나님께서 사람이 되셨을 때’
  rationale: 제공된 증언의 ‘in human likeness’를 따르며, 성육신의 양태에 관한 후대의 정식화나 반대로 가현설적 함의를 번역문에 덧붙이지 않았습니다.
- issue: 천체 현상의 역사성·상징성
  choice: 본문의 서술과 시적 의인화를 그대로 제시함
  alternative: 베들레헴 별로 특정하거나 순전히 상징적 환상으로 설명함
  rationale: 본문 자체가 역사적·상징적 성격을 명시적으로 판정하지 않으므로 어느 쪽으로도 확정하지 않았습니다.
- issue: 죽음의 폐지 과정
  choice: ‘죽음을 없애는 일이 시작되었다’
  alternative: 죽음이 즉시 완전히 소멸했다고 번역함
  rationale: ‘was taken in hand/began’의 개시적 성격을 살려 이미 시작된 사건과 아직 전개되는 결과 사이의 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 초기 기독교 문헌에 어울리는 품위와 시적 장엄함을 유지했습니다. 제공 자료가 공공 영역 영어 증언이며 중간 전승 그리스어 본문에 대한 직접 검토가 보류되어 있으므로, 그리스어 원어를 확정적으로 재구성하지 않고 증언에 드러난 모호성을 보존했습니다. 각주가 필요할 정도의 본문 이형 정보가 제공되지 않아 각주를 두지 않았습니다.
