base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: ko
  text: '여러분의 기도는 시리아의 안티오키아에 있는 교회에까지 이르렀습니다. 그 교회에서 온 저는 하나님께 지극히 합당한 결박에 매인 채 모든 이에게 문안합니다. 저는 그 교회에 속할 자격조차 없는 사람이며, 그들 가운데 가장 작은 사람입니다. 그러나 하나님의 뜻에 따라 제가 이런 영예를 얻었습니다. 이는 제 양심에 거리낌이 없어서가 아니라[a] 하나님의 은혜로 된 일입니다. 저는 그 은혜를 온전히 받아, 여러분의 기도를 통하여 하나님께 이르기를 기도합니다.[b]


    그러므로 여러분의 일이 땅에서도 하늘에서도 온전해지려면, 여러분의 교회가 하나님의 영예를 위하여 ‘하나님의 사절’을 한 사람 뽑아야 마땅합니다.[c] 그가 시리아까지 가서, 그들이 평화를 누리고 본래의 위상을 되찾았으며 그들의 공동체가 다시 회복된 것을 함께 기뻐하게 하십시오.[d]


    그러므로 여러분 가운데 한 사람을 편지와 함께 보내는 것이 합당하다고 저는 생각했습니다. 그는 하나님께서 뜻하신 대로 그들에게 찾아온 평온을 두고 그들과 함께 하나님께 영광을 돌리고, 그들이 여러분의 기도로 이미 항구에 이르렀음을 함께 기뻐할 것입니다.[e] 여러분은 온전한 사람들이니 온전한 것을 생각하십시오. 여러분이 선을 행하고자 하면, 하나님께서는 그것을 이루도록 마련해 주실 준비가 되어 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 양심에 거리낌이 없어서가 아니라’에 해당하는 그리스어 표현은 뜻이 쉽지 않습니다. ‘제 자신의 의식이나 공로로 된 것이 아니라’ 또는 ‘제가 스스로 관여해서 된 것이 아니라’로도 이해할 수 있습니다.
    reason: 난해한 원문과 영어 증언의 ‘not of my own complicity’가 지닌 해석상 불확실성을 공개합니다.
  - marker: b
    text: ‘하나님께 이르다’는 말은 ‘하나님을 얻다’로도 옮길 수 있습니다.
    reason: 신학적으로 중요한 속격 목적어 구문의 진정한 의미 범위를 보존합니다.
  - marker: c
    text: ‘하나님의 사절’은 원문에서 ‘하나님’과 ‘사절’을 결합해 만든 듯한 독특한 표현입니다. 여기서 ‘뽑다’는 말은 공동체가 사람을 선택하거나 지명한다는 뜻일 수 있습니다.
    reason: 희귀어와 선출 동사의 의미를 특정 후대 직분 체계로 좁히지 않습니다.
  - marker: d
    text: ‘본래의 위상’은 문자적으로 ‘고유한 크기’를, ‘공동체’는 문자적으로 ‘몸을 이룬 단체’를 뜻합니다. 안티오키아 교회가 정상적인 공동체 상태를 되찾았다는 비유적 표현으로 보입니다.
    reason: 원문의 신체·규모 비유와 번역의 해석적 성격을 밝힙니다.
  - marker: e
    text: 일부 문장 구조에서는 ‘그들이 여러분의 기도로 이미 항구에 이르고 있었기 때문에’로 이해할 수도 있습니다. ‘항구’는 안전과 평화를 나타내는 비유입니다.
    reason: 시제와 인과 관계의 미묘함 및 항해 비유를 설명합니다.
lexical_decisions:
- source_word: θεοπρεπεστάτοις δεσμοῖς
  choice: 하나님께 지극히 합당한 결박
  rationale: ‘하나님께 어울리는/합당한’이라는 복합 형용사의 뜻과 결박을 영예롭게 보는 역설을 유지했습니다.
- source_word: ἐσχάτος αὐτῶν
  choice: 그들 가운데 가장 작은 사람
  rationale: 문자적 ‘마지막 사람’이 나타내는 자기 낮춤을 현대 한국어에서 자연스럽게 전달했습니다.
- source_word: θεοπρεσβευτήν
  choice: ‘하나님의 사절’
  rationale: ‘하나님’과 ‘사절’을 결합한 희귀한 표현의 성격을 살리고, 특정한 후대 교회 직분명으로 규정하지 않았습니다.
- source_word: μέγεθος
  choice: 본래의 위상
  rationale: 문자적으로는 ‘크기/규모’이나 문맥상 교회가 정상 상태와 지위를 회복했다는 비유로 보아 ‘위상’으로 옮겼습니다.
- source_word: σωματεῖον
  choice: 공동체
  rationale: ‘몸을 이룬 단체/결사’를 뜻하는 말로, 단순한 물리적 규모가 아니라 교회의 조직된 공동체성을 나타냅니다.
- source_word: εὐδία
  choice: 평온
  rationale: 본래 맑고 잔잔한 날씨를 가리키며 여기서는 박해나 혼란 뒤의 평화를 비유하므로 ‘평온’으로 옮겼습니다.
- source_word: λιμένος
  choice: 항구
  rationale: 안전과 안정을 뜻하는 원문의 항해 비유를 그대로 보존했습니다.
- source_word: τέλειοι / τέλεια
  choice: 온전한 사람들 / 온전한 것
  rationale: 같은 어근의 반복을 유지하여 윤리적·영적 성숙과 그에 걸맞은 생각의 연계를 드러냈습니다.
theological_decisions:
- issue: ‘하나님께 이르다’의 의미
  choice: 하나님께 이르다
  alternative: 하나님을 얻다 / 하나님과 연합하다
  rationale: ἐπιτυγχάνειν θεοῦ의 목표 지향적 표현을 해석적으로 확정하지 않고, 이그나티우스의 순교 소망과 신학적 긴장을 보존했습니다.
- issue: 안티오키아 교회의 회복 성격
  choice: 평화, 본래의 위상, 공동체의 회복
  alternative: 감독제 또는 특정 교회 제도의 복구로 명시
  rationale: 본문은 회복을 말하지만 어떤 제도나 직분이 복구되었는지는 명시하지 않으므로 후대 교파적 해석을 넣지 않았습니다.
- issue: 사절의 직분 여부
  choice: 한 사람을 뽑아 ‘하나님의 사절’로 보냄
  alternative: 성직자나 공식 교회 직분자로 임명함
  rationale: χειροτονῆσαι가 공동체의 선출·지명을 가리킬 수 있으나 고정된 성직 임명으로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 공동체에 보내는 권면은 위엄을 유지하되 낡은 한문투를 피했습니다. ‘결박’, ‘하나님의 사절’, ‘항구’처럼 저자의 특징적인 역설과 비유는 평이하게 풀어 없애지 않았습니다. 제공 자료가 공공 영역 영어 증언이며 그리스어 직접 대조가 보류된 상태라는 점을 감안해, 난해하거나 다의적인 곳은 각주로 투명하게 표시했습니다.
