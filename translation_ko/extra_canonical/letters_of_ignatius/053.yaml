  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: Ignatius, who is also Theophorus, unto her that hath found mercy in the bountifulness of the Father Most High and of Jesus Christ His only Son; to the church that is beloved and enlightened through the will of Him who willed all things that are, by faith and love towards Jesus Christ our God; even unto her that hath the presidency in the country of the region of the Romans, being worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father's name; which church also I salute in the name of Jesus Christ the Son of the Father; unto them that in flesh and spirit are united unto His every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain; abundant greeting in Jesus Christ our God in blamelessness.
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: Ignatius, who is also Theophorus, unto her that hath found mercy in the bountifulness of the Father Most High and of Jesus Christ His only Son; to the church that is beloved and enlightened through the will of Him who willed all things that are, by faith and love towards Jesus Christ our God; even unto her that hath the presidency in the country of the region of the Romans, being worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father's name; which church also I salute in the name of Jesus Christ the Son of the Father; unto them that in flesh and spirit are united unto His every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain; abundant greeting in Jesus Christ our God in blamelessness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: ko
  text: 테오포로스라고도 하는 이그나티오스가, 지극히 높으신 아버지와 그분의 외아들 예수 그리스도의 풍성하심 가운데 자비를 입은 교회에 문안합니다. 곧 존재하는 모든 것을 뜻하신 분의 뜻을 따라 사랑받고 빛을 받으며, 우리 하나님 예수 그리스도를 향한 믿음과 사랑 안에 있는 교회, 로마인들의 지역에서 주재하는 교회에 문안합니다. 이 교회는 하나님께 합당하고, 존귀함과 축하와 찬양과 성공을 받기에 합당하며, 순결함에 합당하고, 사랑을 주재하며, 그리스도의 법을 따라 살고, 아버지의 이름을 지니고 있습니다. 이 교회에 나도 아버지의 아들이신 예수 그리스도의 이름으로 문안합니다. 육과 영으로 그분의 모든 계명에 하나 되어 있고, 흔들림 없이 하나님의 은혜로 충만하며, 온갖 이질적인 얼룩이 걸러져 깨끗해진 여러분에게, 흠 없음 가운데 우리 하나님 예수 그리스도 안에서 넘치는 문안을 드립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεοφόρος (Theophorus, via witness)
  choice: 테오포로스
  rationale: ‘하나님을 지닌 자’ 등으로 뜻을 확정하지 않고 고유한 별칭을 음역하여 원문의 함축을 보존했습니다.
- source_word: προκάθηται / presidency (via witness)
  choice: 주재하다
  rationale: 교회론적 직위나 관할권으로 구체화하지 않고, 반복되는 ‘앞에 자리하여 이끈다’는 표현을 동일한 말로 살렸습니다.
- source_word: προκαθημένη τῆς ἀγάπης / presidency of love (via witness)
  choice: 사랑을 주재하며
  rationale: 난해한 속격 관계를 ‘사랑으로 다스린다’나 특정 제도적 수위권으로 해석하지 않고 긴장을 유지했습니다.
- source_word: ἀποδιυλισμένοι / filtered clear (via witness)
  choice: 걸러져 깨끗해진
  rationale: 여과의 구체적 이미지를 추상적인 ‘정결해진’으로 대체하지 않고 보존했습니다.
- source_word: ἀλλοτρίου χρώματος / foreign stain (via witness)
  choice: 이질적인 얼룩
  rationale: ‘이단’이나 ‘죄’로 대상을 특정하지 않고 외부적·낯선 오염이라는 모호성을 유지했습니다.
- source_word: ἀμώμως / in blamelessness (via witness)
  choice: 흠 없음 가운데
  rationale: 윤리적 완전성의 교리로 확대하지 않고 인사말을 수식하는 원문의 명사적 표현을 반영했습니다.
theological_decisions:
- issue: 예수 그리스도를 ‘우리 하나님’으로 부르는 표현
  choice: 우리 하나님 예수 그리스도
  alternative: 우리의 하나님이신 예수 그리스도
  rationale: 원 증언의 직접적인 호칭을 보존하면서도 한국어에서 불필요한 해설적 계사를 덧붙이지 않았습니다.
- issue: 로마 교회의 ‘주재’와 ‘사랑의 주재’
  choice: 두 곳 모두 ‘주재하다’로 번역
  alternative: ‘다스리다’, ‘수위권을 가지다’, ‘사랑으로 이끌다’
  rationale: 반복을 보존하고, 보편적 관할권 또는 단순한 모범적 지도력 가운데 어느 하나로 단정하지 않았습니다.
- issue: ‘육과 영으로’의 결합 대상
  choice: 그분의 모든 계명에 하나 되어 있고
  alternative: 서로 육과 영으로 연합하여
  rationale: 제공된 증언의 통사 관계를 따라 연합을 ‘모든 계명’과 연결하되, ‘육과 영’이라는 인간 존재의 이중 표현을 유지했습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되, 고대 서신의 장중하고 누적적인 문장 구조와 반복을 가능한 한 보존했습니다. 다만 현재 자료는 그리스어 원문 직접 대조가 아직 이루어지지 않은 공용 영어 증언에 기초하므로, ‘주재하다’, ‘사랑을 주재하다’, ‘걸러져 깨끗해진’ 같은 핵심 표현은 향후 중간본 그리스어 본문 검토가 필요합니다.
