base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: ko
  text: '폴리카르포스에게 보낸 편지 1


    하나님 안에 있는 그대의 뜻이 움직이지 않는 바위 위에 세워진 듯 굳건한 것을 기쁘게 받아들입니다. 그대의 흠 없는 얼굴을 뵐 자격을 얻었으니, 나는 크게 영광을 돌립니다. 그 얼굴을 하나님 안에서 누리기를 기도합니다.


    그대가 입은 은혜 안에서 계속 달려가며, 모든 사람을 권면하여 그들이 구원받게 하십시오. 육신의 일과 영의 일 모두에 온갖 열심을 기울여 그대가 맡은 자리를 지키십시오.[a] 연합을 돌보십시오. 연합보다 더 좋은 것은 없습니다. 주께서도 그대를 감당해 주시듯 모든 사람을 감당하십시오. 지금도 그렇게 하듯, 사랑으로 모든 사람을 참아 내십시오.


    끊임없는 기도에 전념하십시오. 지금 가진 것보다 더 큰 분별력을 구하십시오. 깨어 있으면서 잠들지 않는 영을 지니십시오. 하나님의 방식대로 한 사람 한 사람에게 말씀하십시오.[b] 완전한 경기자처럼 모든 이의 병을 짊어지십시오. 수고가 더 많은 곳에 큰 유익도 많습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그대가 맡은 자리를 지키십시오’에 해당하는 그리스어 표현은 문자적으로 ‘그대의 자리’를 가리킵니다. 문맥상 맡겨진 직분 또는 책임을 뜻할 수 있으며, ‘그 자리를 옹호하십시오’로 옮길 수도 있습니다.
    reason: 직분 수행이라는 문맥을 드러내되, 원문의 자리·지위 및 옹호의 의미 범위를 보존합니다.
  - marker: b
    text: ‘하나님의 방식대로’에 해당하는 그리스어 표현은 드문 표현입니다. ‘하나님의 성품에 맞게’ 또는 ‘하나님을 본받아’로도 이해할 수 있습니다.
    reason: 난해한 구문의 해석 가능성을 알리면서 본문은 특정한 해석을 단정하지 않게 합니다.
lexical_decisions:
- source_word: γνώμη
  choice: 뜻
  rationale: 단순한 지적 ‘생각’뿐 아니라 하나님을 향한 내적 성향과 판단을 함께 나타낼 수 있도록 ‘뜻’으로 옮겼습니다.
- source_word: ὑπερδοξάζω
  choice: 더없이 하나님께 영광을 돌립니다
  rationale: 강조 접두사가 담긴 매우 큰 찬양을 자연스러운 현대 한국어로 나타내고, 문맥상 영광의 대상이 하나님임을 밝혔습니다.
- source_word: τὸν τόπον
  choice: 직분
  rationale: 문자적으로는 ‘자리’이지만 수신자 폴리카르포스가 맡은 책임과 역할을 가리키므로 ‘직분’으로 옮겼습니다.
- source_word: ἕνωσις
  choice: 연합
  rationale: 공동체의 결속과 일치를 가리키되 획일성을 뜻하지 않도록 ‘연합’을 선택했습니다.
- source_word: σύνεσις
  choice: 깨달음
  rationale: 분별하고 이해하는 능력을 뜻하므로 학문적 ‘지식’보다 폭넓은 ‘깨달음’으로 옮겼습니다.
- source_word: νόσους
  choice: 병약함
  rationale: 문자적 질병뿐 아니라 공동체 구성원의 약함까지 포괄할 가능성을 보존했습니다.
- source_word: ἀθλητής
  choice: 경기자
  rationale: 고대 경기에서 훈련하고 견디는 사람이라는 비유를 살리면서 현대 독자가 이해하기 쉬운 말을 택했습니다.
- source_word: κέρδος
  choice: 유익
  rationale: 물질적 이익으로 좁혀 읽지 않도록 수고에 따르는 폭넓은 결실을 나타냈습니다.
theological_decisions:
- issue: πάντας παρακαλεῖν ἵνα σώζωνται에서 권면과 구원의 관계
  choice: 모든 사람이 구원받도록 그들을 권면하십시오
  alternative: 모든 사람을 권면하여 구원하십시오
  rationale: 권면자가 직접 구원을 이루는 것으로 단정하지 않고, 목적절의 의미와 수동태의 신학적 여지를 보존했습니다.
- issue: 주께서 수신자를 ‘감당하신다’는 표현
  choice: 주께서도 그대를 감당해 주시듯
  alternative: 주께서도 그대를 참아 주시듯
  rationale: βάσταζε의 ‘떠받치다, 짊어지다, 감당하다’라는 폭을 유지하여 단순히 결점을 참는다는 뜻으로 축소하지 않았습니다.
- issue: ‘육신과 영’의 관계
  choice: 육신과 영으로 온갖 정성을 다하여
  alternative: 몸과 마음을 다하여
  rationale: σαρκικῇ τε καὶ πνευματικῇ의 대조적 표현을 보존하되, 육신을 악한 것으로 규정하는 해석은 덧붙이지 않았습니다.
- issue: κατὰ ὁμοήθειαν θεοῦ의 난해한 의미
  choice: 하나님께서 사람을 대하시는 방식에 따라
  alternative: 하나님의 성품에 맞게
  rationale: 하나님을 본받아 각 사람을 개별적으로 대하라는 흐름을 살렸으나, 원문 표현이 드물고 해석 가능성이 열려 있음을 각주로 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 ‘-하십시오’로 통일하여 목회적 권위와 따뜻함을 함께 살렸고, 지나치게 고어적인 표현은 피했습니다. 제공된 자료에는 그리스어 원문 검토가 보류되었다고 적혀 있으나, 현존하는 중간본 그리스어 문구를 우선 검토하고 공개 영역 영어 증언과 POB 영어를 대조하여 번역했습니다.
