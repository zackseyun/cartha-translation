base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: ko
  text: '내 형제들의 집안 사람들과 그 아내들과 자녀들에게 문안합니다. 과부라 불리는 처녀들에게도 문안합니다. 아버지의 능력 안에서 여러분에게 작별 인사를 전합니다. 나와 함께 있는 필론도 여러분에게 문안합니다.


    타비아의 집안에 문안하며, 그 여자가 육체와 영의 믿음과 사랑 안에 굳게 서기를 기도합니다.[a] 내가 매우 사랑하는 이름인 알케와, 비할 데 없는 다프누스와, 에우텍누스에게 문안하며, 모든 사람에게 한 사람 한 사람 이름을 불러 문안합니다. 하나님의 은혜 안에서 평안히 지내십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그 여자가 육체와 영의 믿음과 사랑 안에 굳게 서기를”입니다. ‘육체와 영의’가 정확히 무엇을 어떻게 수식하는지는 분명하지 않습니다.
    reason: 제공된 자료는 공용 영어 번역 증언에 근거하며 그리스어 원문 검토가 보류되어 있으므로, 문법적 모호성을 독자에게 알립니다.
lexical_decisions:
- source_word: households
  choice: 집안 사람들 / 집안
  rationale: 단순한 건물이 아니라 가족과 그 집에 속한 공동체를 가리키므로 문맥에 따라 자연스럽게 옮겼습니다.
- source_word: virgins who are called widows
  choice: 과부라 불리는 처녀들
  rationale: 역설적이고 불분명한 고대 공동체 호칭을 해소하지 않고 그대로 보존했습니다.
- source_word: in the power of the Father
  choice: 아버지의 능력 안에서
  rationale: 관계적·신학적 표현의 범위를 좁히지 않고 전치사구를 보존했습니다.
- source_word: grounded
  choice: 굳게 서다
  rationale: 믿음과 사랑에 확고히 뿌리내리거나 견고해진다는 뜻을 자연스러운 한국어로 표현했습니다.
- source_word: both of flesh and of spirit
  choice: 육체와 영의
  rationale: 양자의 관계가 모호한 원문 증거의 긴장을 유지하고 ‘육적·영적 사랑’ 등으로 임의 해석하지 않았습니다.
- source_word: all by name
  choice: 모든 사람에게 한 사람 한 사람 이름을 불러
  rationale: 각 사람을 개별적으로 기억하여 문안한다는 관용 표현의 의미를 드러냈습니다.
theological_decisions:
- issue: ‘과부라 불리는 처녀들’의 공동체적 신분
  choice: 표현의 역설과 모호성을 본문에 유지함
  alternative: 금욕 생활을 하는 과부들 또는 교회 직분명으로 해석함
  rationale: 그리스어 원문 검토가 아직 이루어지지 않았고, 제공된 증거만으로 특정 제도나 직분을 단정할 수 없습니다.
- issue: ‘육체와 영의 믿음과 사랑’의 수식 관계
  choice: ‘육체와 영의’가 믿음과 사랑 전체에 걸릴 수 있는 형태로 번역함
  alternative: 육체의 사랑과 영의 사랑으로 분리하거나 육신과 영혼 모두의 믿음으로 풀이함
  rationale: 영어 증언 자체가 문법적·신학적 관계를 확정하지 않으므로 해석을 좁히지 않았습니다.
- issue: 마지막 작별 표현의 의미
  choice: ‘하나님의 은혜 안에서 평안히 지내십시오’
  alternative: ‘하나님의 은혜 안에서 구원받으십시오’ 또는 단순히 ‘안녕히 계십시오’
  rationale: 작별 인사의 기능과 ‘은혜 안에서’라는 신학적 표현을 함께 살리되 구원론적 의미를 추가하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 서신의 반복적인 문안 형식은 유지하되, 이름은 필론, 타비아, 알케, 다프누스, 에우텍누스로 음역했습니다. 제공된 원문란은 실제 그리스어가 아니라 공용 영어 증언이며 직접 원어 검토가 보류된 상태이므로, 확정적 재구성보다 증거에 충실한 잠정 번역을 택했습니다.
