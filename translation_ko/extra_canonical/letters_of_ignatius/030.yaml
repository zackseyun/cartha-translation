base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: ko
  text: '그러므로 주님께서도 아버지 없이 아무것도 하지 않으시고, [그분과 하나 되어][a] 친히 하시든 사도들을 통하여 하시든 그렇게 하셨듯이, 여러분도 감독과 장로들 없이 아무것도 하지 마십시오. 또한 다른 이들과 떨어져서 자기 생각만 옳다고 여기려 하지 마십시오. 오히려 공동의 기도 하나, 간구 하나, 한마음, 한 소망이 있게 하십시오. 흠 없는 사랑과 기쁨 가운데 그렇게 하십시오. 이 모든 것은 곧 예수 그리스도이시니,[b] 그분보다 더 좋은 것은 아무것도 없습니다.


    여러분 모두 서둘러 함께 모이십시오. 한 성전, 곧 하나님께 나아가듯 하고, 한 제단, 곧 한 분 예수 그리스도께 나아가듯 하십시오. 그분은 한 분이신 아버지에게서 나오셨고, 그 한 분과 함께 계시며, 그 한 분께로 가셨습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호는 제공된 영어 증거문에서 이 구절이 보충 또는 복원된 표현으로 표시되어 있음을 보존한 것입니다. 그리스어 원문 대조가 필요합니다.
    reason: 현재 초안은 직접적인 그리스어 검토가 보류된 상태이므로 증거문의 본문 불확실성 표시를 독자에게 알립니다.
  - marker: b
    text: ‘이 모든 것은’에 해당하는 관계 표현은 ‘한 소망’을 가리킬 수도 있고, 앞에 열거된 공동체의 기도와 일치와 사랑과 기쁨 전체를 가리킬 수도 있습니다.
    reason: 영어 증거문에 남아 있는 문법적·해석적 모호성을 한 가지로 단정하지 않기 위해서입니다.
  - marker: c
    text: ‘한 분’은 문맥상 아버지를 가리킵니다. 마지막 동사는 ‘떠나갔다’로도 직역할 수 있으나, 여기서는 아버지께로 향했다는 뜻을 드러내어 옮겼습니다.
    reason: 반복되는 ‘One’의 지시 대상과 이동 동사의 번역 선택을 설명합니다.
lexical_decisions:
- source_word: bishop (Greek ἐπίσκοπος presumed; source-language review pending)
  choice: 감독
  rationale: 초기 교회 직분을 가리키는 전통적이고 비교적 중립적인 한국어 표현을 사용했습니다. 후대 교단의 구체적 직제 의미를 과도하게 덧씌우지 않았습니다.
- source_word: presbyters (Greek πρεσβύτεροι presumed; source-language review pending)
  choice: 장로들
  rationale: 복수형을 보존하면서 현대 한국어 독자에게 익숙한 초기 교회 지도자 명칭으로 옮겼습니다.
- source_word: one mind
  choice: 한마음
  rationale: 단순히 동일한 의견만이 아니라 공동체의 일치된 뜻과 태도를 자연스럽게 나타냅니다.
- source_word: altar
  choice: 제단
  rationale: 제의적 비유를 약화하지 않고 원문의 성전 이미지와 연결되도록 직역에 가깝게 보존했습니다.
- source_word: came forth ... is with ... departed unto
  choice: 나오셨고 … 함께 계시며 … 가셨습니다
  rationale: 아버지와 그리스도의 관계와 움직임을 나타내는 병렬 구조를 유지하되, ‘떠나셨다’가 아버지와의 단절을 암시하지 않도록 문맥상 목적지를 드러내는 ‘가셨습니다’를 택했습니다.
theological_decisions:
- issue: 감독과 장로들 없이 아무것도 하지 말라는 권고의 범위
  choice: 원문의 강한 공동체적 권고를 그대로 유지했습니다.
  alternative: 교회 행정이나 예배에만 한정하여 풀어 쓸 수 있습니다.
  rationale: 본문 자체가 적용 범위를 명시적으로 제한하지 않으므로 번역에서 교단적 직제론이나 적용 범위를 추가하지 않았습니다.
- issue: ‘which is Jesus Christ’의 선행사
  choice: ‘이 모든 것은 곧 예수 그리스도이시니’로 옮겨 앞의 사랑, 기쁨, 기도, 마음, 소망 전체와 연결될 가능성을 열어 두었습니다.
  alternative: ‘한 소망, 곧 예수 그리스도’로 한정할 수 있습니다.
  rationale: 제공된 영어 증거문은 관계절의 선행사가 문법적으로 모호하므로 이를 특정 명사 하나로 확정하지 않았습니다.
- issue: ‘one’의 반복이 가리키는 대상
  choice: ‘한 분이신 아버지’와 이어지는 ‘그 한 분’을 사용했습니다.
  alternative: 모든 반복을 단순히 ‘하나’로 옮기거나, 매번 ‘아버지’로 명시할 수 있습니다.
  rationale: 문맥상 아버지를 가리키는 인격적 표현을 살리면서도 원문의 반복과 신학적 수사 구조를 보존했습니다.
- issue: 그리스도께서 아버지에게서 나오시고 아버지께 가셨다는 표현
  choice: 시간적·관계적 진술을 해설 없이 보존했습니다.
  alternative: 성육신과 승천을 명시하여 의역할 수 있습니다.
  rationale: 본문이 그 사건들을 직접 명명하지 않으므로 후대의 교리적 설명을 번역문에 삽입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 초기 기독교 권면문의 엄숙함과 반복적 수사를 살렸습니다. ‘여러분’, ‘감독’, ‘장로들’을 사용하여 고어체와 특정 교단에 치우친 용어를 피했습니다. 다만 제공 자료가 공공 영역 영어 증거문에 기초하고 그리스어 원문 검토가 보류된 상태이므로, 대괄호와 주요 모호성을 각주로 명시한 잠정 출판 초안입니다.
