  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서, 병렬된 ‘하나/한 분’의 수사와 모이라는 권면을 자연스럽게 드러냅니다. ‘여러분끼리 따로’는 ‘apart from others’의 공동체적 대조를 한국어답게 표현합니다.
  terminology: ‘감독’, ‘장로들’, ‘제단’, ‘예수 그리스도’, ‘아버지’는 유지하는 것이 적절합니다. ‘한 분’은 인격적 대상인 아버지와 그리스도를 가리키는 자리에서 사용하고, 성전·제단·기도·간구·소망에는 ‘한’을 사용했습니다.
  issues:
