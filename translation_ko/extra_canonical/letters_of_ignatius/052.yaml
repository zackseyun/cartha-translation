    text: 공급된 영어 증언은 ‘나 또한’에 해당하는 말을 대괄호([also])로 표시합니다. 이는 편집자가 보충한 말이라는 신호이므로, 한국어 본문에는 확정하여 넣지 않았습니다. 그리스어 사본 전통의 직접 대조가 더 필요합니다.
