base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: ko
  text: '트랄레스인들에게 보낸 이그나티우스의 편지 13장


    스미르나 사람들과 에베소 사람들의 사랑이 여러분에게 문안합니다. 여러분의 기도 가운데 시리아에 있는 교회를 기억해 주십시오. 나는 그들 가운데 가장 보잘것없는 사람이므로 그 교회의 일원이라 불릴 자격조차 없습니다.[a]


    예수 그리스도 안에서 평안하십시오. 주교에게 계명에 순종하듯 순종하고, 장로단에게도 그와 같이 순종하십시오. 또 여러분은 저마다 나뉘지 않은 마음으로 서로 사랑하십시오.


    나의 영은 여러분을 위하여 바쳐집니다. 지금뿐 아니라 내가 하나님께 이르게 될 때에도 그러합니다.[b] 나는 아직도 위험 가운데 있습니다. 그러나 아버지께서는 예수 그리스도 안에서 신실하시므로, 나의 간구와 여러분의 간구를 이루어 주실 것입니다. 우리가 그분 안에서 흠 없는 사람으로 드러나기를 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 공급된 영어 증언에는 ‘그 교회의 일원’ 앞에 편집자가 보충한 ‘[또한]’이 표시되어 있습니다. 현 단계에서는 그 말을 본문에 넣지 않았습니다. 그리스어 사본 전통을 직접 대조한 뒤 재검토해야 합니다.
    reason: 공급 자료가 원문 대조 전의 영어 공용 증언이며, 대괄호가 편집적 복원 신호임을 투명하게 밝혔습니다.
  - marker: b
    text: ‘나의 영은 … 바쳐집니다’라는 표현의 정확한 뉘앙스는 그리스어 원문과 이본을 직접 대조한 뒤 확정해야 합니다. 여기서는 공급된 영어 증언의 제의적 표현을 보존했습니다.
    reason: 원어 검토가 보류된 상태에서 ‘offered up’의 제의적·헌신적 의미를 과도하게 확정하지 않기 위해 표시했습니다.
lexical_decisions:
- source_word: the love of the Smyrnaeans and Ephesians
  choice: 스미르나 사람들과 에베소 사람들의 사랑
  rationale: 공동체 자체가 아니라 그들의 사랑이 문안한다는 원문의 의인화된 표현을 보존했습니다.
- source_word: the church which is in Syria
  choice: 시리아에 있는 교회
  rationale: 초기 그리스도교 문헌의 지역 공동체 지칭을 자연스럽고 직접적으로 옮겼습니다.
- source_word: bishop
  choice: 주교
  rationale: 초기 교회의 단일 감독 직분을 가리키는 역사적 용례에 맞추되, 후대 교파 제도를 본문에 덧씌우지 않았습니다.
- source_word: presbytery
  choice: 장로단
  rationale: 개별 장로 한 사람이 아니라 장로들의 집단을 가리키는 뜻을 드러냈습니다.
- source_word: undivided heart
  choice: 나뉘지 않은 마음
  rationale: 단순한 성실성보다 분열되지 않은 온전한 마음이라는 비유를 유지했습니다.
- source_word: attain unto God
  choice: 하나님께 이르게 되다
  rationale: 순교와 하나님께 도달함을 연결하는 이그나티우스의 표현을 해설적으로 풀지 않고 보존했습니다.
- source_word: unblamable
  choice: 흠 없는 사람
  rationale: 도덕적·종말론적 함의를 모두 열어 두는 표현으로 옮겼습니다.
theological_decisions:
- issue: 주교 및 장로단에 대한 순종의 성격
  choice: 주교에게 계명에 순종하듯 순종하고, 장로단에게도 그와 같이 순종하십시오
  alternative: 주교를 계명처럼 여기며 복종하고 장로회에도 복종하십시오
  rationale: 비교 표현의 긴장을 유지하면서도 주교 자체를 하나님의 계명과 동일시한다고 단정하지 않았습니다.
- issue: ‘하나님께 이르다’의 의미
  choice: 내가 하나님께 이르게 될 때
  alternative: 내가 순교하여 하나님께 갈 때
  rationale: 문맥상 순교를 암시하지만 본문이 직접 명시하지 않는 내용을 번역문에 삽입하지 않았습니다.
- issue: 아버지의 신실하심과 간구의 성취
  choice: 아버지께서는 예수 그리스도 안에서 신실하시므로, 나의 간구와 여러분의 간구를 이루어 주실 것입니다
  alternative: 아버지께서 나와 여러분의 청원을 반드시 그대로 허락하실 것입니다
  rationale: 신실하심을 기계적인 소원 성취로 해석하지 않고, 공급된 증언의 문장 관계를 보존했습니다.
- issue: ‘그분 안에서’의 지시 대상
  choice: 그분 안에서
  alternative: 예수 그리스도 안에서
  rationale: 가까운 선행어로 예수 그리스도가 있으나 아버지도 언급되므로, 대명사의 잠재적 모호성을 본문에서 성급히 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 초기 교회 문헌다운 장중함은 유지하되 고어체는 피했습니다. 공급된 자료가 영어 공용 증언이며 그리스어 원문 검토가 아직 보류되어 있으므로, 특히 편집적 보충어와 ‘나의 영은 바쳐집니다’의 원어 뉘앙스는 각주에서 잠정성을 밝혔습니다.
