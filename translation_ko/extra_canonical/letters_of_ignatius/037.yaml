  english_witness: Knowing that ye are full of God, I have exhorted you briefly. Remember me in your prayers, that I may attain unto God; and remember also the church which is in Syria, whereof I am not worthy to be called a member. For I have need of your united prayer and love in God, that it may be granted to the church which is in Syria to be refreshed by the dew of your fervent supplication.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: ko
  text: 여러분이 하나님으로 충만하다는 것을 알기에, 나는 짧게 권면했습니다. 내가 하나님께 이를 수 있도록 여러분의 기도 가운데 나를 기억해 주십시오. 또한 시리아에 있는 교회를 기억해 주십시오. 나는 그 교회의 일원이라 불릴 자격조차 없습니다. 시리아에 있는 교회가 여러분의 간절한 간구라는 이슬로 새 힘을 얻도록, 나는 하나님 안에서 드리는 여러분의 한마음 된 기도와 사랑을 필요로 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영역 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 중간 전승본의 그리스어 원문에 대한 직접 검토가 필요합니다.
    reason: 원자료 설명에 그리스어 원문 검토가 아직 이루어지지 않았다고 명시되어 있으므로 번역의 증거적 한계를 투명하게 밝혔습니다.
lexical_decisions:
- source_word: full of God
  choice: 하나님으로 충만하다
  rationale: 신적 임재와 충만을 나타내는 표현을 자연스럽고 신학적으로 열어 둔 한국어로 보존했습니다.
- source_word: exhorted
  choice: 권면했습니다
  rationale: 격려뿐 아니라 신앙적 권고를 포함하는 문맥의 의미 폭을 살렸습니다.
- source_word: attain unto God
  choice: 하나님께 이르다
  rationale: 순교와 죽음을 통해 하나님께 도달한다는 문맥적 함의를 직접 풀어 쓰지 않고 원문의 긴장과 여지를 보존했습니다.
- source_word: united prayer
  choice: 한마음 된 기도
  rationale: 공동체가 일치하여 드리는 기도라는 뜻을 현대 한국어로 분명하게 나타냈습니다.
- source_word: refreshed by the dew
  choice: 이슬로 새 힘을 얻다
  rationale: 이슬의 은유를 유지하면서 ‘refreshment’를 자연스럽게 전달했습니다.
- source_word: fervent supplication
  choice: 간절한 간구
  rationale: 열렬함과 청원의 성격을 함께 드러내는 관용적 표현을 택했습니다.
theological_decisions:
- issue: ‘하나님께 이르다’의 의미
  choice: 은유적이고 종말론적인 표현을 그대로 유지했습니다.
  alternative: ‘순교하여 하나님께 가다’라고 명시할 수 있습니다.
  rationale: 제공된 증거는 순교라는 문맥을 암시하지만 이 문장 자체가 그것을 명시하지 않으므로 해석을 본문에 삽입하지 않았습니다.
- issue: 시리아 교회가 얻는 새 힘의 주체와 방식
  choice: 교회가 간구의 이슬로 새 힘을 얻도록 한다고 옮겼습니다.
  alternative: ‘평안을 되찾도록’ 또는 ‘회복되도록’ 옮길 수 있습니다.
  rationale: ‘refreshed’의 포괄적 의미와 이슬의 시적 이미지를 보존하고, 특정한 역사적 결과로 한정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 초기 그리스도교 서신의 장중함을 유지하되 일반 독자가 이해할 수 있도록 문장을 간결하게 구성했습니다. ‘나는/여러분’은 서신의 직접성을 살리고, ‘교회의 일원’은 현대 독자에게 자연스럽게 전달되도록 선택했습니다.
