    Let us show ourselves their brothers by our forbearance; but let us be zealous to be imitators of the Lord, vying with each other who shall suffer the greater wrong, who shall be defrauded, who shall be set at nought; that no herb of the devil be found in you: but in all purity and temperance abide ye in Christ Jesus, with your flesh and with your spirit.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: ko
  text: '나머지 모든 사람을 위해서도 끊임없이 기도하십시오. 그들에게도 회개할 희망이 있어 하나님을 발견할 수 있기 때문입니다. 그러므로 적어도 여러분의 행실을 보고 배우게 하십시오.


    그들이 분노를 터뜨릴 때에는 온유하고, 거만한 말을 할 때에는 겸손하며, 모욕할 때에는 기도로 맞서고, 잘못에 빠져 있을 때에는 믿음 안에서 굳건하며, 사납게 대할 때에는 부드럽게 대하십시오. 보복하여 그들을 본받으려 애쓰지 마십시오.


    오히려 오래 참음으로 우리가 그들의 형제임을 보여 줍시다. 그리고 주님을 본받는 사람이 되기를 힘쓰며, 누가 더 큰 부당한 일을 당할지, 누가 빼앗길지, 누가 업신여김을 받을지를 두고 서로 앞서려고 합시다. 그리하여 여러분 가운데서 마귀의 풀 한 포기도 발견되지 않게 하십시오.[a] 육신으로나 영으로나 온전히 순결하고 절제하며 그리스도 예수 안에 머무르십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마귀의 풀’은 공동체 안에 뿌리내리거나 자라나는 악을 식물에 빗댄 표현입니다.
    reason: 직역한 고대 비유가 현대 독자에게 낯설 수 있어 의미를 간단히 밝혔습니다.
lexical_decisions:
- source_word: the rest of mankind
  choice: 나머지 모든 사람
  rationale: 교회 공동체 밖의 사람들을 가리키는 포괄적 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: find God
  choice: 하나님을 발견하다
  rationale: 단순히 지식으로 아는 것보다 회개를 통해 하나님께 이르게 된다는 원문의 비유적 표현을 보존했습니다.
- source_word: works
  choice: 행실
  rationale: 개별적인 업적보다 삶에서 드러나는 행동과 본보기를 뜻하는 문맥에 맞추었습니다.
- source_word: railings
  choice: 모욕
  rationale: 상대를 헐뜯고 욕하는 언어적 공격을 일반 독자가 분명히 이해하도록 표현했습니다.
- source_word: requital
  choice: 보복하다
  rationale: 같은 방식으로 되갚는 행위를 간결하고 직접적으로 나타냈습니다.
- source_word: forbearance
  choice: 오래 참음
  rationale: 해를 당하면서도 보복하지 않고 견디는 태도를 드러내며, 문맥의 윤리적 무게를 보존합니다.
- source_word: herb of the devil
  choice: 마귀의 풀 한 포기
  rationale: 악의 씨앗이나 싹을 연상시키는 원문의 생생한 식물 비유를 해석적으로 대체하지 않고 살렸습니다.
- source_word: temperance
  choice: 절제
  rationale: 욕망과 행동을 제어하는 덕목을 나타내는 자연스럽고 널리 이해되는 표현입니다.
- source_word: abide
  choice: 머무르다
  rationale: 그리스도와의 지속적인 관계와 삶의 상태를 나타내는 전통적이면서도 자연스러운 표현입니다.
theological_decisions:
- issue: ‘회개할 희망’의 주체와 가능성
  choice: 그들에게도 회개할 희망이 있다고 번역함
  alternative: 그들의 회개를 바라는 희망이 우리에게 있다고 번역할 수 있음
  rationale: 제공된 영어 증언의 문법적 모호성을 억지로 교리화하지 않으면서, 가장 직접적인 독법을 본문에 반영했습니다.
- issue: ‘하나님을 발견하다’의 구원론적 의미
  choice: 비유적 표현을 그대로 보존함
  alternative: 하나님을 알게 되다 또는 하나님께 돌아오다
  rationale: 원문 검토가 아직 이루어지지 않았으므로 회심, 인식, 구원 가운데 하나로 의미를 좁히지 않았습니다.
- issue: 육신과 영의 관계
  choice: ‘육신으로나 영으로나’로 병렬성을 보존함
  alternative: 몸과 마음을 다하여
  rationale: 인간 존재의 두 측면을 구분하는 고대 문헌의 표현을 현대적 심신 개념으로 환원하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면의 반복 구조와 대조법을 살리되 지나치게 고어적인 표현은 피했습니다. 다만 제공 자료가 중간 계열 그리스어 본문 자체가 아니라 공용 영어 번역 증언이며 직접적인 그리스어 검토가 보류된 상태이므로, 이 번역은 해당 증언과 POB 상담층을 대조해 작성한 잠정 출판 초안입니다.
