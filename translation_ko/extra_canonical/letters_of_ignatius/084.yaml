    Wheresoever the bishop shall appear, there let the people be; even as where Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatsoever he shall approve, this is well-pleasing also to God; that everything which ye do may be sure and valid.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: ko
  text: '[그러나] 분열을 피하십시오. 분열은 악의 시작이기 때문입니다. 여러분 모두는 예수 그리스도께서 아버지를 따르시듯 감독을 따르고, 사도들을 대하듯 장로단을 대하십시오. 또 하나님의 계명을 존중하듯 집사들을 존중하십시오. 아무도 감독과 무관하게 교회에 속한 일을 하지 마십시오. 감독 아래에서 행해지거나 감독이 맡긴 사람이 행하는 성찬례를 유효한 것으로 여기십시오.


    감독이 있는 곳에는 어디든지 회중도 있어야 합니다. 이와 같이 예수 그리스도께서 계시는 곳에는 보편 교회가 있습니다.[a] 감독과 무관하게 세례를 베풀거나 애찬을 여는 것은 허용되지 않습니다.[b] 그러나 감독이 승인하는 것은 무엇이든 하나님께서도 기뻐하시는 것입니다. 그리하여 여러분이 하는 모든 일이 확실하고 유효하게 될 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보편 교회’는 모든 지역과 신자를 아우르는 교회를 뜻합니다. 여기서 이 표현을 후대의 특정 교파명으로 한정할 필요는 없습니다.
    reason: ‘universal Church’와 그 배후의 고대 용어가 지닌 역사적·신학적 범위를 독자가 오해하지 않도록 설명합니다.
  - marker: b
    text: ‘애찬’은 초기 그리스도인들이 함께 나누던 공동 식사를 가리킵니다. 성찬례와의 정확한 관계는 시대와 공동체에 따라 달리 이해될 수 있습니다.
    reason: 현대 독자에게 생소한 초기 그리스도교 관습을 설명하되 성찬례와의 관계를 단정하지 않습니다.
lexical_decisions:
- source_word: ἐπίσκοπος (inferred from the Greek tradition; direct review pending)
  choice: 감독
  rationale: 초기 교회의 직분 명칭을 전통적이면서도 널리 이해되는 말로 옮겼습니다. 현대 교단의 구체적인 감독제도를 본문에 소급해 넣지는 않습니다.
- source_word: πρεσβυτέριον (inferred; direct review pending)
  choice: 장로단
  rationale: 개별 장로가 아니라 장로들로 이루어진 집단을 가리키는 의미를 보존합니다.
- source_word: διάκονοι (inferred; direct review pending)
  choice: 집사들
  rationale: 초기 그리스도교 직분을 가리키는 통상적인 한국어 성서·교회사 용어를 사용했습니다.
- source_word: εὐχαριστία (inferred; direct review pending)
  choice: 성찬례
  rationale: 감사 행위와 공동체의 성찬 의식을 함께 가리키는 역사적 예전 용어로 옮겼으며, 특정 교파의 성찬 이해로 한정하지 않았습니다.
- source_word: καθολικὴ ἐκκλησία (inferred; direct review pending)
  choice: 보편 교회
  rationale: 여기서 'καθολικός'는 후대의 특정 교파명이라기보다 전체적·보편적 교회를 뜻하므로 '가톨릭교회'가 아닌 '보편 교회'로 옮겼습니다.
- source_word: ἀγάπη (inferred; direct review pending)
  choice: 애찬
  rationale: 일반적인 사랑이 아니라 초기 그리스도인의 공동 식사를 가리키는 문맥이므로 역사적 용어인 '애찬'을 사용했습니다.
theological_decisions:
- issue: 감독의 권한 아래 있는 성찬례의 유효성
  choice: ‘감독이 주관하거나 감독이 맡긴 사람이 주관하는 성찬례를 유효한 것으로 여기십시오’로 번역
  alternative: ‘감독이 있는 곳에서 거행되거나 그가 위임한 이가 거행하는 성찬만 참된 성찬이다’
  rationale: 증언문의 제도적 강조를 보존하되, ‘under the bishop’를 반드시 감독의 물리적 참석으로 좁히지 않았습니다. 또한 ‘valid’를 ‘참된’으로 옮겨 성찬의 본질에 관한 후대 논쟁을 선결하지 않았습니다.
- issue: 감독과 무관한 교회 행위의 금지
  choice: ‘감독과 무관하게’
  alternative: ‘감독 없이’ 또는 ‘감독의 허락 없이’
  rationale: 영어 증언의 ‘apart from’이 물리적 부재, 권한 밖의 행동, 승인 없는 행동 가운데 어느 하나로만 고정되지 않도록 다소 넓게 보존했습니다.
- issue: ‘보편 교회’의 의미
  choice: ‘예수 그리스도께서 계시는 곳에는 보편 교회가 있습니다’
  alternative: ‘예수께서 계신 곳에는 가톨릭교회가 있다’
  rationale: 초기 문헌의 보편성 진술을 보존하면서 후대의 특정 교파 정체성을 본문에 소급하지 않았습니다.
- issue: 집사들을 존중하는 방식
  choice: ‘하나님의 계명을 존중하듯 집사들을 존중하십시오’
  alternative: ‘하나님의 명령을 받들듯 집사들을 받드십시오’
  rationale: 비교 구문의 긴장을 유지하되 집사들을 하나님의 계명과 동일시하거나 예배 대상으로 읽히지 않도록 자연스럽게 표현했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 권면의 단호함과 초기 교회 문헌의 dignified한 어조를 살리되, 지나치게 고어적인 표현은 피했습니다. 제공 자료가 공용 영어 번역 증언에 기초하고 그리스어 직접 검토가 아직 이루어지지 않았으므로, 그리스어 표제어와 세부 판단은 모두 잠정적입니다. 대괄호로 전승된 첫 접속어는 원문 자료의 불확실성을 그대로 드러내기 위해 ‘[그러나]’로 보존했습니다.
