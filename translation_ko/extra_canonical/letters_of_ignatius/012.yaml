id: IGN.012
reference: Letters of Ignatius — IgnEph. 11
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is--the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from Him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot to be always a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the Apostles in the power of Jesus Christ.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is--the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from Him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot to be always a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the Apostles in the power of Jesus Christ.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/012.yaml
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is—the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot always to be a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the apostles in the power of Jesus Christ.'
translation:
  language: ko
  text: '지금은 마지막 때입니다. 그러므로 이제 경외하는 마음을 품고 하나님의 오래 참으심을 두려워합시다. 그 오래 참으심이 우리에게 심판이 되지 않도록 해야 합니다. 장차 올 진노를 두려워하든지, 지금 있는 은혜를 사랑하든지 해야 합니다. 둘 중 하나입니다. 다만 우리가 참된 생명에 이르도록 그리스도 예수 안에서 발견되기만 하면 됩니다.


    예수 그리스도 외에는 아무것도 여러분의 눈에 빛나지 않게 하십시오. 나는 그분 안에서 나의 결박, 곧 영적인 진주들을 지니고 다닙니다. 나는 여러분의 기도를 통하여 그 안에서 다시 일어나기를 바랍니다.[a] 또한 그 기도에 언제나 참여하는 사람이 되기를 바랍니다. 그리하여 예수 그리스도의 능력 안에서 언제나 사도들과 함께 있었던 에베소의 그리스도인들의 무리 가운데서 발견되기를 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 안에서’는 앞의 ‘결박’, 곧 ‘영적인 진주들’을 가리킵니다. 저자는 자신의 결박을 영적인 진주에 비유하며, 에베소 교인들의 기도를 통하여 그 결박과 관련하여 다시 일어나기를 소망합니다. ‘다시 일어나다’는 부활을 가리키는 표현으로 이해될 수 있습니다.
    reason: 결박/영적 진주와 ‘다시 일어나다’ 사이의 관계를 한국어 본문에서 과도하게 해석하지 않고, 대명사의 선행사와 부활적 함의를 독자가 확인하도록 돕습니다.
lexical_decisions:
- source_word: last times
  choice: 마지막 때
  rationale: 초기 그리스도교의 종말론적 표현을 자연스럽고 익숙한 한국어로 보존했습니다.
- source_word: long-suffering of God
  choice: 하나님의 오래 참으심
  rationale: 하나님의 인내를 뜻하는 전통적 의미를 분명하고 현대적인 표현으로 옮겼습니다.
- source_word: glitter in your eyes
  choice: 여러분의 눈에 찬란하게 보이다
  rationale: 단순한 시각적 반짝임보다 마음을 사로잡는 매력이라는 비유를 살렸습니다.
- source_word: my bonds, my spiritual pearls
  choice: 나의 결박, 곧 영적인 진주들
  rationale: 투옥의 사슬을 영예로운 진주에 빗댄 병치를 보존했습니다.
- source_word: were ever of one mind with the Apostles
  choice: 사도들과 늘 한마음이었던
  rationale: 지속적인 일치와 연대를 나타내되 교리적 동일성으로 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: 하나님의 오래 참으심이 심판으로 바뀐다는 표현
  choice: 그것이 우리를 향한 심판으로 바뀌지 않게 하려는 것입니다
  alternative: 하나님의 오래 참으심이 우리에게 정죄가 되지 않게 하려는 것입니다
  rationale: 원문의 역설적 긴장을 유지하면서 ‘judgment’를 특정한 정죄 교리로 좁히지 않았습니다.
- issue: 장차 올 진노와 현재의 은혜 사이의 양자택일
  choice: 둘 가운데 하나입니다
  alternative: 어느 쪽이든 선택해야 합니다
  rationale: 권면의 날카로운 대조를 보존하되 인간의 선택에 관한 체계적 교리를 덧붙이지 않았습니다.
- issue: unto true life
  choice: 참된 생명에 이르도록
  alternative: 참된 생명을 위하여
  rationale: 그리스도 안에서 발견됨과 생명의 관계를 목적·결과의 열린 표현으로 남겼습니다.
- issue: rise again
  choice: 다시 살아나기를
  alternative: 부활하기를
  rationale: 부활을 가리킬 가능성을 살리면서도 공급된 영어 증거문이 지닌 표현상의 폭을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 공동체적 ‘-합시다’로, 명령은 dignified한 ‘-하게 하십시오’로 처리했습니다. 현재 초안은 제공된 공개 영역 영어 증거문을 바탕으로 한 잠정 번역이며, 중간판 그리스어 전승에 대한 직접 원문 검토가 필요합니다.
