    rationale: 원문은 하나님의 오래 참으심이 우리에게 심판이 되지 않도록 두려워하라고 권합니다. 현행 문장은 앞선 권면의 목적을 설명하는 문장으로 바꾸어 논리와 긴장을 약화합니다.
  - severity: medium
    issue: ‘이 결박을 지닌 채 다시 살아나기를’
    rationale: 결박/영적 진주를 받는 관계 표현을 ‘지닌 채’라는 방식으로 단정합니다. 결박을 가리키는 선행사를 문맥상 밝히되, ‘그 안에서’라는 표현과 주석으로 관계를 보존하는 편이 안전합니다.
  - severity: medium
    issue: ‘사도들과 늘 한마음이었던’
    rationale: 영어 증거문은 ‘one mind’로 번역하지만, 중간판 그리스어의 표현은 기본적으로 사도들과 ‘함께 있었다/동행했다’는 뜻입니다. 원어 우선 원칙상 교리적·심리적 일치로 구체화하지 않는 것이 좋습니다.
