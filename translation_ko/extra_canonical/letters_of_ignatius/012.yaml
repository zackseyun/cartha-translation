- from: '지금은 마지막 때입니다. 그러므로 이제부터 경외하는 마음을 품고, 하나님의 오래 참으심을 두려워합시다. 그것이 우리를 향한 심판으로 바뀌지 않게 하려는 것입니다. 우리는 장차 올 진노를 두려워하거나 지금 있는 은혜를 사랑해야 합니다. 둘 가운데 하나입니다. 다만 참된 생명에 이르도록 그리스도 예수 안에서 발견되기만 합시다.


