base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: ko
  text: '그러므로 하나님께 감사드리고 그분의 영광을 위하여 더욱 자주 함께 모이기에 힘쓰십시오. 여러분이 자주 함께 모이면 사탄의 세력은 무너지고, 여러분의 믿음 안에서의 일치 가운데 그의 해악은 무력해집니다.


    평화보다 나은 것은 아무것도 없습니다. 평화 안에서는 하늘에 속한 것들과 땅에 속한 것들의 모든 전쟁이 폐지됩니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: thanksgiving to God
  choice: 하나님께 감사드리고
  rationale: 예배적 감사의 방향을 분명히 하면서 현대 한국어에서 자연스럽고 공손한 표현을 사용했습니다.
- source_word: His glory
  choice: 그분께 영광을 돌리기
  rationale: ‘그분의 영광을 위하여’도 가능하지만, 모임의 목적을 자연스럽게 드러내는 관용적 표현을 택했습니다.
- source_word: powers of Satan
  choice: 사탄의 세력
  rationale: 복수형 ‘powers’가 가리키는 영향력과 권세를 집합적으로 전달하며, 불필요하게 구체적인 영적 존재들로 한정하지 않았습니다.
- source_word: concord of your faith
  choice: 여러분의 믿음이 이루는 화합
  rationale: ‘믿음의 화합’이 지닐 수 있는 모호함을 줄이되, 믿음과 공동체적 일치의 관계를 보존했습니다.
- source_word: abolished
  choice: 사라집니다
  rationale: 싸움이 종식되고 제거된다는 뜻을 자연스러운 현대 한국어로 표현했습니다.
theological_decisions:
- issue: ‘하늘과 땅의 모든 싸움’의 범위
  choice: 하늘에 있는 것들과 땅에 있는 것들의 모든 싸움
  alternative: 하늘과 땅에 있는 모든 존재의 전쟁
  rationale: 제공된 증거가 직접 그 대상을 ‘존재’로 규정하지 않으므로, 원문 증거의 포괄성과 긴장을 그대로 남겼습니다.
- issue: 공동체의 모임과 사탄의 세력 붕괴 사이의 관계
  choice: 조건·결과 구조를 그대로 유지
  alternative: 모임 자체에 자동적인 영적 효력이 있다고 해설
  rationale: 증언의 강한 인과 표현을 보존하되, 특정 성례론이나 교회론을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 권면은 ‘힘쓰십시오’로 품위 있게 표현하고, 전체 문장은 일반 독자가 이해하기 쉽도록 다듬었습니다. 다만 직접적인 그리스어 검토가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언에 근거한 잠정 번역입니다.
