base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: ko
  text: 그러므로 모든 것에는 끝이 있고, 생명과 죽음이라는 이 두 가지가 함께 우리 앞에 놓여 있으니, 사람은 저마다 자기에게 속한 곳으로 갈 것입니다. 마치 두 종류의 화폐, 곧 하나님의 화폐와 세상의 화폐가 있고 각각 그 고유한 형상이 새겨져 있는 것과 같습니다. 믿지 않는 이들에게는 이 세상의 형상이 새겨져 있지만, 믿는 이들에게는 사랑 안에서 예수 그리스도를 통하여 아버지 하나님의 형상이 새겨져 있습니다. 그분을 통하여 우리가 스스로 선택하여 그분의 수난에 참여하고자 죽음을 받아들이지 않는다면, 그분의 생명이 우리 안에 있지 않습니다.—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: end
  choice: 끝
  rationale: 만물의 종결과 귀결을 함께 암시하는 간결한 표현을 유지했습니다.
- source_word: two coinages
  choice: 두 종류의 화폐
  rationale: 서로 다른 주권과 소속을 나타내는 주화 비유를 현대 독자가 이해할 수 있도록 옮겼습니다.
- source_word: stamp
  choice: 형상
  rationale: 주화에 새겨진 도상이라는 구체적 의미와 그것이 나타내는 소속의 의미를 함께 살렸습니다.
- source_word: his own place
  choice: 자기에게 속한 곳
  rationale: 단순한 목적지뿐 아니라 각자의 영적 소속에 따른 귀결이라는 비유적 여지를 보존했습니다.
- source_word: passion
  choice: 수난
  rationale: 그리스도의 고난과 죽음을 가리키는 초기 기독교 문맥에 맞는 통용 표현을 선택했습니다.
theological_decisions:
- issue: ‘through whom’의 선행사와 기능
  choice: 예수 그리스도를 가리키는 ‘그분을 통하여’로 유지
  alternative: 그리스도의 수난을 통하여
  rationale: 제공된 증거 본문의 문법적 연결을 따르되, 뒤따르는 수난 참여와의 긴장을 풀어 설명하지 않았습니다.
- issue: ‘die unto his passion’의 의미
  choice: ‘그분의 수난에 참여하고자 죽음을 받아들이다’
  alternative: ‘그분의 수난을 본받아 죽다’ 또는 ‘그분의 수난에 대하여 죽다’
  rationale: 직역만으로는 한국어에서 의미가 불분명하므로 참여의 뜻을 드러냈지만, 순교만을 뜻한다고 제한하지 않았습니다.
- issue: 인간의 자발적 선택
  choice: ‘스스로 선택하여’
  alternative: ‘기꺼이’
  rationale: 원문의 자유로운 선택이라는 강조를 보존하되 특정한 자유의지 교리를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면문에 맞는 장중함을 유지하면서도 ‘화폐’와 ‘형상’의 비유가 자연스럽게 이어지도록 문장을 나누었습니다. 제공 자료가 영어 공용 증거문이며 그리스어 직접 검토가 보류 중이므로, 최종 구두점과 ‘그분의 수난에 참여하고자 죽음’이라는 구절은 원문 대조 시 재검토가 필요합니다. 끝의 긴 대시는 다음 절로 문장이 이어짐을 보존합니다.
