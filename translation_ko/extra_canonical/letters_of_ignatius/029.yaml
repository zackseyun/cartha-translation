review_pass:
  verdict: revise
  source_fidelity: 첫 문단에서 집사들을 ‘함께 섬기십시오’라는 별도 명령의 대상으로 처리한 것은 영어 증언의 문장 구조와 맞지 않습니다. 집사들은 감독·장로와 함께 앞선 권면의 맥락에서 언급되지만, 특히 그들이 그리스도의 집사 직분을 맡은 이들이라는 설명을 받습니다. 이를 서술로 바로잡았습니다. 그 밖에는 ‘육신을 따라’, ‘세상들이 있기 전’, ‘썩지 않음’ 등 해석을 좁히지 않는 선택이 증언의 표현을 대체로 잘 보존합니다.
  naturalness: 합쇼체 권면문으로 전반적으로 자연스럽습니다. 다만 ‘앞서 말한 이들을 통해’는 ‘그 사람들 안에서/in the persons’의 의미를 다소 도구적으로 바꾸므로 ‘그 사람들 안에서’로 고쳤습니다. ‘사도들의 회의’는 현대 한국어에서 다소 어색하여 ‘사도들의 평의회’로 다듬었습니다.
  terminology: 감독, 장로들, 집사들, 집사 직분은 초기 교회 직분을 가리키는 일관되고 적절한 용어입니다. ‘하나님께 합당한 화합’, ‘하나님을 닮도록’, ‘육신을 따라’, ‘썩지 않음’도 신학적·문학적 폭을 과도하게 제한하지 않습니다.
  issues:
  - severity: high
    issue: 집사들에 대한 문장 구조가 명령문으로 변경됨
    rationale: ‘나에게 지극히 사랑스러운 집사들도 함께 섬기십시오’는 집사들에게 별도로 섬기라고 명하는 뜻이 되지만, 영어 증언은 집사들이 그리스도의 집사 직분을 맡았다는 설명을 덧붙입니다. 집사들을 서술적 병렬 항목으로 복원해야 합니다.
  - severity: medium
    issue: ‘in the aforementioned persons’의 관계 표현
    rationale: ‘이들을 통해’는 그 사람들이 회중을 보게 한 매개라는 뜻을 더합니다. 증언의 표현은 그 사람들 안에서 회중 전체를 보았다는 뜻이므로 ‘그 사람들 안에서’가 더 가깝습니다.
  - severity: low
