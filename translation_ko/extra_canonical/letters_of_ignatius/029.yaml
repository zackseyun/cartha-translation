    그러므로 여러분 모두는 하나님을 닮도록 힘쓰고 서로 존중하십시오. 아무도 이웃을 육신을 따라 대하지 말고, 언제나 예수 그리스도 안에서 서로 사랑하십시오. 여러분 사이에 여러분을 갈라놓을 만한 것이 아무것도 없게 하십시오. 오히려 썩지 않음의 본보기와 교훈이 되도록, 감독과 여러분을 이끄는 이들과 하나가 되십시오.'
  revised_footnotes: []
  revision_rationale: 핵심 수정은 집사들에 관한 문법적 관계를 영어 증언에 맞추어 명령이 아닌 설명적 병렬로 회복한 것입니다. 또한 첫 문장의 관계와 ‘council’의 한국어 표현을 다듬었습니다. 제공된 자료가 영어 증언을 매개로 하며 그리스어 직접 검토가 보류되어 있으므로, 논쟁 가능성이 있는 수식 관계와 ‘썩지 않음’의 함의는 확정적으로 해석하지 않았습니다.
