  witness_license: Public domain witness
  english_witness: 'Seeing then that in the aforementioned persons I beheld your whole people in faith and embraced them, I advise you, be ye zealous to do all things in godly concord, the bishop presiding after the likeness of God and the presbyters after the likeness of the council of the Apostles, with the deacons also who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore do ye all study conformity to God and pay reverence one to another; and let no man regard his neighbor after the flesh, but love ye one another in Jesus Christ always. Let there be nothing among you which shall have power to divide you, but be ye united with the bishop and with them that preside over you as an ensample and a lesson of incorruptibility.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/029.yaml
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
translation:
  language: ko
  text: '그러므로 나는 앞서 말한 이들을 통해 믿음 안에서 여러분의 온 회중을 보았고 그들을 끌어안았습니다. 이제 여러분에게 권합니다. 하나님께 합당한 화합 가운데 모든 일을 행하기를 힘쓰십시오. 감독은 하나님의 모습을 따라 주재하고, 장로들은 사도들의 회의의 모습을 따르며, 나에게 지극히 사랑스러운 집사들도 함께 섬기십시오. 이 집사들은 예수 그리스도의 집사 직분을 맡은 사람들입니다. 그분은 세상들이 있기 전부터 아버지와 함께 계셨고, 마지막 때에 나타나셨습니다.


    그러므로 여러분 모두는 하나님을 닮도록 힘쓰고 서로 존중하십시오. 아무도 이웃을 육신을 따라 대하지 말고, 언제나 예수 그리스도 안에서 서로 사랑하십시오. 여러분 사이에 여러분을 갈라놓을 만한 것이 아무것도 없게 하십시오. 오히려 썩지 않음의 본보기와 교훈이 되도록, 감독과 여러분을 이끄는 이들과 하나가 되십시오.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly concord
  choice: 하나님께 합당한 화합
  rationale: 단순한 인간적 조화가 아니라 하나님과 관련된 경건한 일치를 나타내면서도 자연스러운 현대 한국어로 옮겼습니다.
- source_word: bishop
  choice: 감독
  rationale: 초기 교회 직분명에 해당하는 전통적이고 널리 이해되는 번역을 사용했습니다.
- source_word: presbyters
  choice: 장로들
  rationale: 초기 그리스도교 문헌에서 통용되는 직분명으로 옮겼습니다.
- source_word: deacons / diaconate
  choice: 집사들 / 집사 직분
  rationale: 사람과 맡겨진 사역·직분을 구별하면서 어근의 연관성을 유지했습니다.
- source_word: before the worlds
  choice: 세상들이 있기 전부터
  rationale: 복수형 ‘worlds/ages’의 우주적·시간적 폭을 성급히 하나의 개념으로 제한하지 않도록 복수의 느낌을 살렸습니다.
- source_word: after the flesh
  choice: 육신을 따라
  rationale: 초기 그리스도교의 신학적 긴장을 보존하고 단순히 ‘외모로’나 ‘인간적으로’라고 해석해 좁히지 않았습니다.
- source_word: incorruptibility
  choice: 썩지 않음
  rationale: 도덕적 청렴성만으로 축소하지 않고 부패와 죽음을 넘어서는 신학적 함의를 보존했습니다.
theological_decisions:
- issue: 감독·장로·집사와 하나님·사도들의 유비
  choice: ‘모습을 따라’라는 유비적 표현을 유지함
  alternative: 감독이 하나님을 ‘대표한다’거나 장로들이 사도들과 동일한 권위를 가진다고 명시함
  rationale: 본문은 유사성과 배열을 말하지만 존재론적 동일성이나 구체적인 교회 정치 체계를 직접 규정하지 않으므로 그 긴장을 그대로 두었습니다.
- issue: 그리스도의 선재
  choice: ‘세상들이 있기 전부터 아버지와 함께 계셨고’로 번역함
  alternative: ‘영원부터 아버지와 함께 계셨고’
  rationale: 그리스도의 선재를 분명히 하되, 원문 검토가 보류된 상황에서 ‘영원’이라는 해석적 확대를 피하고 제공된 증거의 표현을 보존했습니다.
- issue: 하나님과의 conformity
  choice: ‘하나님을 닮도록 힘쓰고’
  alternative: ‘하나님께 복종하기를 힘쓰고’ 또는 ‘하나님과 일치하기를 힘쓰고’
  rationale: ‘conformity’의 모방·상응 의미를 살리면서, 존재론적 합일이나 단순 복종으로 한정하지 않았습니다.
- issue: 마지막 문장의 목적·기능 관계
  choice: ‘썩지 않음의 본보기와 교훈이 되도록’으로 연결함
  alternative: 감독과 지도자들이 본보기라는 뜻으로 확정함
  rationale: 영어 증언만으로는 ‘본보기와 교훈’이 연합 자체를 가리키는지 지도자들을 가리키는지 모호할 수 있어, 한국어에서 가능한 한 단정적 귀속을 피했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 권면문의 엄숙함과 초기 교회 문헌의 직분 용어를 유지했습니다. 제공 자료가 그리스어 직접 검토 전의 공공 영역 영어 증언에 근거하므로, 번역은 잠정적이며 특히 ‘하나님을 닮음’, ‘세상들’, 마지막 구절의 수식 관계는 그리스어 대조가 필요합니다.
