    rationale: 영어 증언의 [unto God]은 완성의 목적·귀속을 표시합니다. ‘하나님께 이르도록’은 이동·도달의 의미를 덧붙입니다. 본문 불확실성은 대괄호와 각주로 계속 표시하되, ‘[하나님을 위하여]’로 옮기는 것이 더 가깝습니다.
  - severity: medium
