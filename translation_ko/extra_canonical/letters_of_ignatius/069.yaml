    Yea, and we love the prophets also, because they too pointed to the Gospel in their preaching and set their hope on Him and awaited Him; in whom also having faith they were saved in the unity of Jesus Christ, being worthy of all love and admiration as holy men, approved of Jesus Christ and numbered together in the Gospel of our common hope.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: ko
  text: '형제자매 여러분, 제 마음은 여러분을 향한 사랑으로 가득 넘칩니다. 저는 한없이 기뻐하며 여러분의 안전을 지켜봅니다. 그러나 그렇게 하는 이는 제가 아니라 예수 그리스도이십니다. 저는 그분을 위하여 결박되어 있지만, 아직 온전해지지 못했으므로 오히려 더욱 두렵습니다. 그러나 여러분의 기도가 저를 [하나님께 이르도록][a] 온전하게 해 줄 것입니다. 그리하여 제가 자비를 입게 된 그 유업에 이를 수 있기를 바랍니다. 저는 복음을 예수님의 육체로 여기고 그 안으로 피하며, 사도들을 교회의 장로회로 여기고 그 안으로 피합니다.


    참으로 우리는 예언자들도 사랑합니다. 그들 역시 선포할 때 복음을 가리켰고, 그분께 소망을 두었으며, 그분을 기다렸기 때문입니다. 그들 또한 그분을 믿어 예수 그리스도와 하나 됨 안에서 구원을 받았습니다. 그들은 모든 사랑과 존경을 받기에 합당한 거룩한 사람들이며, 예수 그리스도께 인정을 받았고, 우리가 함께 소망하는 복음 안에 함께 이름이 올랐습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님께 이르도록’은 제공된 영어 증언에서 대괄호로 표시된 복원문입니다. 직접 그리스어 본문 검토가 필요합니다.
    reason: 본문 전승 또는 편집상 불확실성을 독자에게 숨기지 않기 위해서입니다.
  - marker: b
    text: ‘함께 이름이 올랐습니다’는 ‘함께 계수되었습니다’ 또는 ‘함께 포함되었습니다’로도 옮길 수 있습니다. 여기서는 예언자들이 공동의 소망인 복음에 속한다는 뜻으로 이해했습니다.
    reason: 제공된 영어 증언의 ‘numbered together’가 지닌 다소 압축된 표현과 번역 가능성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: ἀδελφοί / brethren (Greek review pending)
  choice: 형제자매 여러분
  rationale: 공동체 전체를 향한 호칭을 현대 표준 한국어로 자연스럽게 전달했습니다. 직접 그리스어 대조가 아직 보류 중임을 명시합니다.
- source_word: δεσμοί / bonds (Greek review pending)
  choice: 그분을 위하여 결박되어
  rationale: 문맥상 그리스도께 속한 죄수로서의 결박을 나타내되, ‘그분의 결박을 입다’라는 부자연스러운 직역은 피했습니다.
- source_word: σάρξ / flesh (Greek review pending)
  choice: 육체
  rationale: 복음을 ‘예수님의 육체’로 표현하는 충격적이고 신학적인 은유를 완화하지 않고 보존했습니다.
- source_word: πρεσβυτέριον / presbytery (Greek review pending)
  choice: 장로회
  rationale: 개별 장로가 아니라 장로들로 이루어진 회의체라는 의미를 간결하고 교파 편향 없이 나타냅니다.
- source_word: ἐν ἑνότητι / in the unity (Greek review pending)
  choice: 하나 됨 안에서
  rationale: 예수 그리스도와 관련된 연합·일치의 의미를 어느 한 교리 체계로 좁히지 않고 보존했습니다.
- source_word: ἐναριθμέω / numbered together (Greek review pending)
  choice: 함께 이름이 올랐습니다
  rationale: 공동의 복음 안에 포함되고 계수되었다는 수동적 의미를 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘yet not I, but Jesus Christ’가 무엇을 수식하는지
  choice: 앞 문장의 ‘여러분의 안전을 지켜봅니다’와 연결했습니다.
  alternative: ‘기뻐하는’ 주체 또는 단락 전체의 행위를 그리스도께 돌리는 것으로 읽을 수 있습니다.
  rationale: 제공된 중간 전승 영어 증언의 구두점과 문장 구조를 따르되, 그리스도가 이그나티우스를 통해 돌본다는 긴장을 유지했습니다.
- issue: ‘[unto God]’의 본문 지위
  choice: 본문에 대괄호를 유지하고 각주로 복원 표지임을 밝혔습니다.
  alternative: 대괄호 구절을 생략하여 ‘여러분의 기도가 저를 온전하게 해 줄 것입니다’로 번역할 수 있습니다.
  rationale: 제공된 증언 자체가 해당 표현의 불확실성을 표시하므로 이를 확정된 본문처럼 처리하지 않았습니다.
- issue: 예언자들의 구원과 그리스도의 관계
  choice: ‘그분을 믿어 예수 그리스도와 하나 됨 안에서 구원을 받았습니다’로 번역했습니다.
  alternative: ‘그분 안에서 믿음을 지녀’ 또는 ‘그분에 대한 믿음 안에서’로 옮길 수 있습니다.
  rationale: 그리스도를 향한 믿음과 그리스도 안의 일치를 모두 드러내면서, 후대의 특정 구원론 공식을 본문에 덧붙이지 않았습니다.
- issue: 복음·육체 및 사도·장로회의 병행 은유
  choice: 두 대상을 각각 피난처로 삼는 강한 병행 표현을 유지했습니다.
  alternative: ‘복음과 사도들의 가르침에 의지한다’처럼 의미를 풀어 쓸 수 있습니다.
  rationale: 원문의 독특한 교회론적·그리스도론적 은유를 설명적 의역으로 해소하지 않기 위해서입니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 초기 그리스도교 서신의 장중하고 목회적인 어조를 유지했습니다. ‘형제자매’, ‘장로회’, ‘하나 됨’처럼 일반 독자가 이해할 수 있는 표현을 택했고, ‘복음을 예수님의 육체로’라는 낯선 은유는 원문의 긴장을 살리기 위해 그대로 두었습니다. 다만 현재 제공 자료는 공공영역 영어 증언이며 직접 그리스어 대조가 보류 중이므로, 그리스어 표제어와 세부 통사 판단은 모두 잠정적입니다.
