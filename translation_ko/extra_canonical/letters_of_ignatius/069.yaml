  naturalness: 전반적으로 현대 한국어와 합쇼체가 안정적입니다. 다만 ‘그 안으로 피합니다’의 반복은 한국어에서 다소 무겁고, ‘함께 이름이 올랐습니다’는 명부에 이름을 올리는 현대 행정적 뉘앙스를 불러일으킵니다. ‘피난처로 삼습니다’ 및 ‘함께 포함되었습니다’가 더 자연스럽고 본문의 수동적 포함 의미에도 가깝습니다.
  terminology: ‘복음’, ‘육체’, ‘사도들’, ‘장로회’, ‘예수 그리스도’는 유지할 수 있습니다. ‘교회의 장로회’는 presbytery의 집단적 뜻을 적절히 보존합니다. ‘우리의 공동 소망의 복음’은 ‘Gospel of our common hope’의 소유·수식 관계를 유지하면서도 특정 교리적 해석을 더하지 않습니다.
