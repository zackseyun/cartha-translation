source:
  text: 'I have learned that ye have a mind unblamable and steadfast in patience, not from habit, but by nature, according as Polybius your bishop informed me, who by the will of God and of Jesus Christ visited me in Smyrna; and so greatly did he rejoice with me in my bonds in Christ Jesus, that in him I beheld the whole multitude of you.


    Having therefore received your godly benevolence at his hands, I gave glory, forasmuch as I had found you to be imitators of God, even as I had learned.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'I have learned that ye have a mind unblamable and steadfast in patience, not from habit, but by nature, according as Polybius your bishop informed me, who by the will of God and of Jesus Christ visited me in Smyrna; and so greatly did he rejoice with me in my bonds in Christ Jesus, that in him I beheld the whole multitude of you.


    Having therefore received your godly benevolence at his hands, I gave glory, forasmuch as I had found you to be imitators of God, even as I had learned.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: ko
  text: '여러분의 감독 폴리비오스가 내게 알려 준 대로, 여러분에게는 책망할 데 없는 마음이 있고, 습관에서가 아니라 본성에서 우러나오는 한결같은 인내가 있다는 것을 나는 알게 되었습니다. 그는 하나님과 예수 그리스도의 뜻에 따라 스미르나에 있는 나를 찾아왔습니다. 그리고 그리스도 예수 안에서 사슬에 매인 나와 함께 크게 기뻐하였으므로, 나는 그에게서 여러분 모두를 보았습니다.


    그러므로 나는 그를 통해 하나님을 따르는 여러분의 호의를 받아들이고 하나님께 영광을 돌렸습니다. 내가 전해 들은 그대로, 여러분이 하나님을 본받는 사람들이라는 것을 확인했기 때문입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 중간판 그리스어 사본 전통과의 직접 대조가 필요합니다.
    reason: 제공 자료에 그리스어 본문 자체가 없고 원어 검토가 보류되어 있으므로, 번역 근거의 한계를 투명하게 밝혔습니다.
lexical_decisions:
- source_word: mind (Greek source review pending)
  choice: 마음
  rationale: 사고와 뜻을 함께 포괄하는 자연스러운 현대 한국어로 옮겼습니다. 그리스어 원문 대조 전에는 더 좁은 의미로 확정하지 않았습니다.
- source_word: steadfast in patience
  choice: 한결같은 인내
  rationale: 지속성과 견고함을 자연스럽게 드러내면서도 인내라는 핵심 개념을 보존했습니다.
- source_word: not from habit, but by nature
  choice: 습관에서가 아니라 본성에서 우러나오는
  rationale: 후천적 반복과 내재된 성향의 대조를 분명히 살렸습니다.
- source_word: bonds / chains
  choice: 사슬에 매인
  rationale: 투옥 상태를 구체적이고 dignified하게 전달하며, 초기 그리스도교 문헌의 결박 이미지를 보존했습니다.
- source_word: godly benevolence / goodwill
  choice: 하나님을 따르는 여러분의 호의
  rationale: 단순히 ‘경건한’이라는 성품 묘사로 단정하지 않고, 하나님을 기준으로 한 호의라는 관계적 의미를 열어 두었습니다.
- source_word: imitators of God
  choice: 하나님을 본받는 사람들
  rationale: 직역의 의미를 유지하면서 현대 독자가 자연스럽게 이해하도록 명사구로 옮겼습니다.
theological_decisions:
- issue: ‘하나님과 예수 그리스도의 뜻’의 관계
  choice: 하나님과 예수 그리스도의 뜻에 따라
  alternative: 하나님 곧 예수 그리스도의 뜻에 따라
  rationale: 제공된 증거의 병렬 표현을 보존하고, 두 이름의 관계를 번역에서 신학적으로 미리 확정하지 않았습니다.
- issue: ‘하나님을 본받는 사람들’의 의미
  choice: 표현을 그대로 보존
  alternative: 하나님의 성품을 닮은 사람들
  rationale: 모방의 범위나 방식에 관한 해석을 덧붙이지 않고 원문의 신학적 긴장을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 교회 직분명은 ‘감독’으로 옮겼고, 문장을 적절히 나누어 일반 독자의 가독성을 높였습니다. 원어 본문이 제공되지 않았으므로 영어 공개 영역 증언과 감사용 POB 문안을 비판적으로 참고한 잠정 초안입니다.
