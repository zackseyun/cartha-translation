  english_witness: 'Seeing that the church which is in Antioch of Syria hath peace, as it hath been reported to me, through your prayers, I myself also have been the more comforted since God hath banished my care; if so be I may through suffering attain unto God, that I may be found a disciple through your intercession.


    It becometh thee, most blessed Polycarp, to call together a godly council and to elect some one among you who is very dear to you and zealous also, who shall be fit to bear the name of God''s courier--to appoint him, I say, that he may go to Syria and glorify your zealous love unto the glory of God.


    A Christian hath no authority over himself, but giveth his time to God. This is God''s work, and yours also, when ye shall complete it: for I trust in the Divine grace, that ye are ready for an act of well doing which is meet for God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/097.yaml
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  language: ko
  text: '시리아의 안티오키아에 있는 교회가 여러분의 기도로 평화를 누리게 되었다는 소식을 들었습니다. 그리하여 하나님께서 제 염려를 없애 주셨으므로 저도 더욱 큰 위로를 받았습니다. 참으로 제가 고난을 통해 하나님께 이를 수 있고, 여러분의 중보로 제자임이 드러나기를 바랍니다.[a]


    지극히 복되신 폴리카르포스여, 그대는 하나님께 합당한 회의를 소집하고, 여러분 가운데서 여러분이 무척 사랑하며 열심도 있는 사람 하나를 뽑는 것이 마땅합니다. 그는 ‘하나님의 심부름꾼’이라는 이름을 지니기에 합당한 사람이어야 합니다.[b] 그를 임명하여 시리아로 가게 하고, 하나님께 영광이 되도록 여러분의 열성 어린 사랑을 드러내게 하십시오.


    그리스도인은 자기 자신을 마음대로 할 권리가 없으며, 자신의 시간을 하나님께 내어 드립니다.[c] 여러분이 이 일을 완수하면, 이것은 하나님의 일이면서 또한 여러분의 일이 됩니다. 여러분이 하나님께 합당한 선행을 할 준비가 되어 있다고 저는 하나님의 은혜 안에서 확신합니다. 여러분의 진실한 열정이 얼마나 뜨거운지 알기에, 이렇게 짧은 편지로 권면했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 단락의 세부 문구는 제공된 영어 증언본을 따라 옮겼습니다. 중간 개정본 그리스어 사본 전통에 대한 직접 대조가 아직 필요합니다.
    reason: 특히 마지막 절의 문구는 그리스어 본문 대조 결과에 따라 조정될 가능성이 있으므로 번역의 잠정적 근거를 투명하게 밝힙니다.
  - marker: b
    text: ‘하나님의 심부름꾼’은 하나님을 섬기는 임무를 맡아 다른 교회로 파견되는 사람을 가리키는 명예로운 표현입니다.
    reason: 현대 독자가 이를 일상적인 잡무를 맡은 사람이라는 낮은 뜻으로 오해하지 않도록 설명합니다.
  - marker: c
    text: ‘자신의 시간을 하나님께 내어 드린다’는 말은 자신의 삶과 시간을 하나님을 섬기는 데 바친다는 뜻입니다.
    reason: 직역투 표현의 의미를 분명히 하면서 그리스도인의 자기 헌신이라는 문맥을 보존합니다.
lexical_decisions:
- source_word: peace
  choice: 평화를 누리게 되었다
  rationale: 교회가 안정과 평온을 되찾은 상태를 자연스러운 현대 한국어로 표현했습니다.
- source_word: attain unto God
  choice: 하나님께 이르다
  rationale: 순교의 고난을 통해 하나님께 도달한다는 이그나티오스의 표현을 해석적으로 완화하지 않고 보존했습니다.
- source_word: godly council
  choice: 하나님께 합당한 회의
  rationale: 단순히 종교적인 회의라는 뜻보다 하나님께 어울리고 하나님을 기쁘시게 하는 모임이라는 뉘앙스를 살렸습니다.
- source_word: God’s courier
  choice: 하나님의 심부름꾼
  rationale: 교회들의 소식을 전하고 실제 임무를 수행할 파견자를 평이하고 품위 있게 표현했습니다.
- source_word: giveth his time to God
  choice: 자신의 시간을 하나님께 내어 드립니다
  rationale: 자기 시간을 자유롭게 처분하지 않고 하나님을 섬기는 일에 바친다는 의미를 현대 한국어로 명료하게 전달했습니다.
- source_word: act of well doing
  choice: 선행
  rationale: 하나님께 합당한 구체적인 좋은 일을 간결하고 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 고난을 통해 하나님께 이름
  choice: ‘고난을 통해 하나님께 이를 수 있고’로 유지
  alternative: ‘고난을 견디고 하나님과 함께할 수 있고’
  rationale: 순교와 하나님께 도달함 사이의 강한 신학적 연결을 원문의 긴장 그대로 보존하고, 이를 일반적인 인내나 사후의 위로로 축소하지 않았습니다.
- issue: 그리스도인의 자기 권한
  choice: ‘자기 자신을 마음대로 할 권리가 없다’
  alternative: ‘그리스도인은 자유가 없다’
  rationale: 그리스도인의 자유 전체를 부정하는 교리적 일반화가 되지 않도록, 자기 시간과 삶을 하나님께 맡긴다는 문맥상의 뜻을 유지했습니다.
- issue: 하나님의 일과 공동체의 일의 관계
  choice: ‘하나님의 일이면서 또한 여러분의 일’
  alternative: ‘하나님께서 여러분을 통해 하시는 일’
  rationale: 신적 행위와 인간의 책임을 하나로 환원하지 않고 둘을 병렬하는 본문의 표현을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 폴리카르포스에게 직접 말하는 부분에서는 존중을 나타내되 지나치게 고어적인 어투는 피했습니다. 순교, 중보, 인간의 책임과 하나님의 일 사이의 신학적 긴장은 설명적으로 해소하지 않고 본문에 남겼습니다. 이 초안은 제공된 공용 영어 증언본에 근거한 잠정 번역이며, 그리스어 원문 직접 검토 후 재감사가 필요합니다.
