    issue: ‘하나님의 심부름꾼’ 및 이를 ‘명예로운 표현’으로 규정한 주석
    rationale: 공적 파견자를 뜻하는 표현을 일상 잡무의 ‘심부름’으로 낮춰 들리게 할 수 있고, ‘명예로운’이라는 평가는 본문이 명시하는 뜻을 넘어섭니다. ‘하나님의 전령’과 어휘 설명이 더 안전합니다.
