review_pass:
  verdict: revise
  source_fidelity: 영어 증언본의 큰 흐름은 대체로 따랐으나, 몇몇 표현이 원문의 조건성·시제 관계 및 수신자 구분을 약화하거나 바꾸었습니다. 특히 ‘평화를 누리게 되었다’는 완료된 변화로 들리며, ‘여러분이 이 일을 완수하면 … 됩니다’는 이미 하나님의 일이자 그들의 일이라는 진술을 미래적 결과로 바꿉니다. ‘하나님의 심부름꾼’도 θεοδρόμος(하나님의 전령/사자)의 공적 파견 문맥을 충분히 드러내지 못합니다. 그리스어 직접 대조가 보류된 상황이므로 첫 단락의 잠정성 주석은 유지하는 것이 적절합니다.
  naturalness: 전반적으로 현대 한국어 문장은 자연스럽지만, 폴리카르포스 한 사람에게 하는 직접 권면에서 ‘그대’와 ‘여러분’을 연속해 사용하여 수신자가 불분명합니다. 폴리카르포스님을 단수로 직접 부르고, ‘여러분 가운데서’는 그가 속한 공동체를 가리키도록 문장을 정리하면 자연스럽습니다. ‘진실한 열정이 얼마나 뜨거운지’보다 ‘진실함의 열정’을 살린 표현이 원문에 더 가깝습니다.
  terminology: ‘하나님께 이르다’, ‘중보’, ‘그리스도인’, ‘하나님의 은혜’는 유지할 수 있습니다. 다만 ‘하나님의 전령’이 파견되어 소식을 전하는 사람이라는 문맥과 격식에 더 알맞습니다. ‘회의’는 현대 행정 회의의 느낌이 강하므로 ‘모임’을 사용했습니다.
  issues:
  - severity: medium
    issue: 안티오키아 교회의 평화가 ‘누리게 되었다’고 번역됨
    rationale: 영어 증언본은 교회가 평화를 ‘가지고 있다/누리고 있다’고 보고할 뿐, 그 평화가 이제 막 생겼다는 변화 자체를 명시하지 않습니다.
  - severity: medium
    issue: 폴리카르포스에게 하는 단수 권면과 공동체를 가리키는 복수 표현이 혼재함
    rationale: ‘그대는’ 뒤에 ‘여러분 가운데서 여러분이’가 이어져 문법적 수신자가 흔들립니다. 폴리카르포스님이 공동체 가운데서 사람을 선출하도록 요청받는 구조를 드러내야 합니다.
