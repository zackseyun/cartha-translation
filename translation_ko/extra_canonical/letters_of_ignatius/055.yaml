revisions:
- from: '나는 여러분이 사람들을 기쁘게 하는 이들이 아니라 하나님을 기쁘시게 하는 이들이 되기를 바랍니다. 사실 여러분은 이미 하나님을 기쁘시게 하고 있습니다. 나 자신도 하나님께 이르는 데 이와 같은 기회를 다시는 얻지 못할 것이며, 여러분도 침묵한다면 이보다 더 고귀한 일로 칭송받을 수 없을 것입니다. 여러분이 침묵하여 나를 그대로 내버려 둔다면 나는 하나님의 말씀이 되겠지만, 여러분이 내 육신을 원한다면 나는 다시 한낱 외침에 지나지 않게 될 것입니다.[a]


    그러니 제단이 아직 준비되어 있는 동안, 내가 하나님께 전제로 부어지게 해 주는 것 말고는 아무것도 내게 허락하지 마십시오.[b] 그러면 여러분은 사랑 안에서 한 합창대가 되어, 하나님께서 시리아의 감독을 동쪽에서 불러 서쪽에서 발견되게 해 주신 은혜를 두고 예수 그리스도 안에서 아버지께 노래할 수 있을 것입니다. 세상에서 떠나 하나님께로 가라앉는 것은 좋은 일입니다. 그리하여 내가 하나님께로 떠오르려는 것입니다.[c]'
  to: '나는 여러분이 사람들의 비위를 맞추지 말고 하나님을 기쁘시게 하기를 바랍니다. 여러분은 실제로 그렇게 하고 있습니다. 나 자신도 이처럼 하나님께 이를 기회를 결코 얻을 수 없고, 여러분도 나에 관하여 침묵한다면 이보다 더 나은 일을 한 것으로 이름을 남길 수 없습니다. 여러분이 나에 관하여 침묵한다면, 나는 하나님의 말씀이 될 것입니다. 그러나 여러분이 내 육신을 원한다면, 나는 다시 달음질이 될 것입니다.[a]



    오직 내가 하나님께 전제로 부어지게 해 달라고 청해 주십시오. 제단이 아직 마련되어 있는 동안 말입니다.[b] 그러면 여러분은 사랑 안에서 합창대가 되어 예수 그리스도 안에서 아버지께 노래하십시오. 하나님께서 시리아의 감독을 동쪽에서 불러내어 서쪽에서 발견되기에 합당하게 여기셨기 때문입니다. 내가 세상에서 하나님께로 저물어 그분께로 떠오를 수 있다면, 그것은 좋은 일입니다.[c]'
  rationale: 그리스어 중간본 전통의 어휘와 통사를 우선하여 핵심 은유(λόγος/δρόμος), 권면의 어조(ᾄσητε), 그리고 해넘이와 떠오름의 이미지(δῦναι/ἀνατείλω)를 바로잡았습니다. 전제와 감독 같은 기존의 적절한 용어는 유지했으며, 순교의 의미를 특정 교리 체계로 해석하지 않았습니다.
