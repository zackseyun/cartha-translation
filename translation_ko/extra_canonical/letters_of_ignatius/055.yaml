  witness_license: Public domain witness
  english_witness: 'For I would not have you to be men-pleasers but to please God, as indeed ye do please Him. For neither shall I myself ever find an opportunity such as this to attain unto God, nor can ye, if ye be silent, win the credit of any nobler work. For, if ye be silent and leave me alone, I am a word of God; but if ye desire my flesh, then shall I be again a mere cry.


    Nay grant me nothing more than that I be poured out a libation to God, while there is still an altar ready; that forming yourselves into a chorus in love ye may sing to the Father in Jesus Christ, for that God hath vouchsafed that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, that I may rise unto Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: ko
  text: '나는 여러분이 사람들의 비위를 맞추지 말고 하나님을 기쁘시게 하기를 바랍니다. 여러분은 실제로 그렇게 하고 있습니다. 나 자신도 이처럼 하나님께 이를 기회를 결코 얻을 수 없고, 여러분도 나에 관하여 침묵한다면 이보다 더 나은 일을 한 것으로 이름을 남길 수 없습니다. 여러분이 나에 관하여 침묵한다면, 나는 하나님의 말씀이 될 것입니다. 그러나 여러분이 내 육신을 원한다면, 나는 다시 달음질이 될 것입니다.[a]



    오직 내가 하나님께 전제로 부어지게 해 달라고 청해 주십시오. 제단이 아직 마련되어 있는 동안 말입니다.[b] 그러면 여러분은 사랑 안에서 합창대가 되어 예수 그리스도 안에서 아버지께 노래하십시오. 하나님께서 시리아의 감독을 동쪽에서 불러내어 서쪽에서 발견되기에 합당하게 여기셨기 때문입니다. 내가 세상에서 하나님께로 저물어 그분께로 떠오를 수 있다면, 그것은 좋은 일입니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님의 말씀’(λόγος)과 ‘달음질’(δρόμος)은 의도적으로 대조된 비유입니다. 여기서 ‘달음질’은 단순한 외침이 아니라 달려가는 경주 또는 과정의 이미지를 가리킵니다.
    reason: 그리스어 δρόμος의 의미를 반영하고, 낯선 은유를 독자가 이해하도록 돕습니다.
  - marker: b
    text: ‘전제’는 포도주 같은 액체를 제단에 부어 드리는 제사를 가리킵니다. 여기서는 저자가 자신의 죽음을 하나님께 드리는 제물에 비유합니다.
    reason: 현대 독자에게 생소할 수 있는 제의 용어와 순교 비유를 설명합니다.
  - marker: c
    text: ‘저물다’와 ‘떠오르다’는 해가 지고 다시 떠오르는 이미지를 이룹니다. 저자는 세상에서는 지지만 하나님께로 떠오르기를 바란다는 역설을 표현합니다.
    reason: 그리스어 δῦναι와 ἀνατείλω의 연결된 천체 이미지를 드러냅니다.
lexical_decisions:
- source_word: men-pleasers
  choice: 사람들을 기쁘게 하는 이들
  rationale: 성경적 울림을 유지하면서도 현대 독자가 곧바로 이해할 수 있도록 풀어 옮겼습니다.
- source_word: attain unto God
  choice: 하나님께 이르다
  rationale: 순교를 통해 하나님께 도달한다는 이 문맥의 표현을 과도하게 교리화하지 않고 보존했습니다.
- source_word: a word of God / a mere cry
  choice: 하나님의 말씀 / 한낱 외침
  rationale: 의미 있는 ‘말씀’과 덧없는 ‘외침’의 수사적 대조를 그대로 살렸습니다.
- source_word: libation
  choice: 전제
  rationale: 제단에 액체를 부어 드리는 제의적 이미지를 정확히 나타내는 한국어 성경 용어를 사용했습니다.
- source_word: bishop
  choice: 감독
  rationale: 후대 교파의 직제 명칭으로 좁히지 않고 초기 그리스도교 문헌의 직분어를 중립적으로 옮겼습니다.
- source_word: set from the world unto God
  choice: 세상에서 떠나 하나님께로 가라앉다
  rationale: 해가 지듯 ‘지는/가라앉는’ 동작과 이어지는 ‘떠오르다’의 역설적 이미지를 보존했습니다.
theological_decisions:
- issue: ‘하나님의 말씀’이라는 자기 지칭
  choice: 문자적 은유를 유지함
  alternative: ‘하나님의 메시지가 된다’로 해설적으로 번역함
  rationale: 저자가 자신의 순교를 하나님의 유의미한 말과 연결하는 긴장을 해소하지 않았습니다.
- issue: 순교와 ‘하나님께 이름’의 관계
  choice: ‘하나님께 이르다’로 보존함
  alternative: ‘하나님과 함께 있게 되다’ 또는 ‘구원을 얻다’
  rationale: 원문의 목적지 이미지를 유지하고, 구원론적 체계를 번역문에 덧붙이지 않았습니다.
- issue: ‘예수 그리스도 안에서’의 수식 관계
  choice: 아버지께 노래하는 행위를 수식하도록 배치함
  alternative: 하나님이 은혜를 베푸신 방식을 수식함
  rationale: 영어 증언문에 나타난 통사 구조를 따르되 원문 검토가 필요할 수 있는 여지는 남겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 순교를 권하는 대목의 엄숙함과 합창·전제·해넘이의 시적 이미지를 살리되, 고어투와 교파 특유의 표현은 피했습니다. 제공 자료가 공용 영어 증언문에 기초하고 그리스어 검토가 보류된 상태이므로, 특히 마지막 문장의 이미지와 ‘word/cry’ 대조는 잠정적입니다.
