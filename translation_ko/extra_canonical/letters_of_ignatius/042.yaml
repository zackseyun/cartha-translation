base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: ko
  text: '이와 같이 모든 사람은 집사들을 예수 그리스도처럼 존중하고, 감독을 아버지의 표상으로 존중하며, 장로들을 하나님의 평의회와 사도들의 연합으로 존중하십시오. 이들이 없이는 교회라고 불리지도 않습니다.[a]


    여러분도 이 일들에 관하여 그렇게 생각하고 있다고 나는 확신합니다. 나는 여러분의 감독 안에서 드러난 여러분의 사랑의 본을 받았고, 그 본을 지금 나와 함께 지니고 있습니다. 그의 몸가짐 자체가 큰 가르침이며, 그의 온유함은 힘입니다. 내 생각에는 하나님을 믿지 않는 사람들조차 그를 존경합니다.


    나는 여러분을 사랑하기에 이렇게 여러분을 아낍니다. 그를 위하여 더 엄하게 쓸 수도 있었지만, 그렇게 할 자격이 내게 있다고 여기지 않았습니다. 결박된 사람인 내가 마치 사도인 것처럼 여러분에게 명령하는 것은 합당하지 않다고 여겼기 때문입니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 감독·장로·집사가 없이는 그 공동체가 ‘교회’라고 불리지도 않는다는 강한 표현입니다. 이를 특정한 후대 교회 제도에 관한 해설로 좁히지 않았습니다.
    reason: 원문의 강한 명명 표현을 유지하면서 특정 교파의 후대 제도로 단정하지 않기 위해서입니다.
  - marker: b
    text: ‘결박된 사람’은 그리스어 표현이 가리키는 구금 또는 속박의 상태를 옮긴 것입니다. 이것만으로 법적 유죄 판결 여부를 확정하지는 않습니다.
    reason: 영어 증언의 ‘convict’보다 넓은 그리스어 표현의 의미를 보존하기 위해서입니다.
lexical_decisions:
- source_word: deacons / bishop / presbyters
  choice: 집사들 / 감독 / 장로들
  rationale: 초기 그리스도교의 직분 명칭을 현대 한국어에서 널리 통용되는 말로 옮기되, 후대 교파별 직제 의미를 덧붙이지 않았습니다.
- source_word: a type of the Father
  choice: 아버지의 표상
  rationale: ‘type’이 지닌 대표·모형의 뜻을 살리면서 감독을 아버지와 동일시하는 표현으로 오해되지 않게 했습니다.
- source_word: the council of God / the college of Apostles
  choice: 하나님의 의회 / 사도들의 모임
  rationale: 공동으로 숙의하는 집단이라는 병렬 구조를 보존하되, ‘college’를 현대 교육기관인 대학으로 오해하지 않도록 ‘모임’으로 옮겼습니다.
- source_word: there is not even the name of a church
  choice: 교회라는 이름조차 성립하지 않습니다
  rationale: 단순히 명칭이 없다는 뜻보다 그러한 공동체가 교회라고 불릴 수 없다는 문맥적 의미를 자연스럽게 전달하면서도 단정의 강도를 유지했습니다.
- source_word: gentleness is power
  choice: 온유함은 힘입니다
  rationale: 역설적인 명사문을 풀어 설명하지 않고 그대로 보존했습니다.
- source_word: convict
  choice: 유죄 판결을 받은 사람
  rationale: 단순한 수감 상태보다 유죄 선고를 받은 처지를 나타내는 영어 증언의 의미를 반영했습니다.
theological_decisions:
- issue: 감독을 ‘아버지의 type’으로 부르는 표현
  choice: 아버지의 표상
  alternative: 아버지의 모형 / 아버지를 대표하는 이
  rationale: 성부와 감독의 존재론적 동일시를 피하면서 원문의 대표적·상징적 관계를 열어 두었습니다.
- issue: 직분자들이 없으면 교회라는 이름조차 없다는 진술
  choice: 강한 배타적 문장을 그대로 유지
  alternative: 이들이 없이는 교회가 온전하지 않습니다
  rationale: ‘온전하지 않다’로 완화하면 증언문이 가진 교회론적 긴장이 사라지므로, 특정 후대 교회 정치 체계를 해설로 수입하지 않은 채 강도를 보존했습니다.
- issue: 이그나티우스의 사도적 권위와 자기 한계
  choice: 사도처럼 명령할 자격이 없다는 대조를 유지
  alternative: 사도가 아니므로 명령하지 않습니다
  rationale: 본문은 자신의 처지와 사도의 권위를 대조하므로, 사도직에 관한 후대의 이론으로 확장하지 않고 수사적 자기 절제를 살렸습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면에는 ‘존중하십시오’를 쓰고, 서간의 1인칭 진술은 자연스럽고 품위 있게 다듬었습니다. 고대 교회 직분어는 익숙한 한국어 용례를 따랐으나 후대 교파의 직제 개념은 주입하지 않았습니다. 제공 자료가 영어 공용 번역 증언이며 그리스어 검토가 보류된 상태이므로 번역은 잠정적입니다.
