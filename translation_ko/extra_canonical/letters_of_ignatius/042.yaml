  - severity: low
    issue: 첫 문장의 병렬 목적어
    rationale: ‘감독은 … 존중하며, 장로들은 … 존중하십시오’는 목적격 조사가 생략되어 약간 어색합니다. 각 직분을 목적어로 분명히 하면 권면의 병렬이 선명해집니다.
