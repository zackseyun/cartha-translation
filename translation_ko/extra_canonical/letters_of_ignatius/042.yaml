  source_fidelity: 수정이 필요합니다. 특히 마지막 문장의 그리스어 δεδεμένος는 통상 ‘결박된 사람/죄수(사슬에 매인 사람)’를 뜻하며, 영어 증언의 ‘convict’를 따라 ‘유죄 판결을 받은 사람’으로 확정한 것은 근거가 부족합니다. 또한 장로들에 대한 병렬 표현의 σύνδεσμον ἀποστόλων는 단순한 ‘사도들의 모임’보다 ‘사도들의 결속/연합’에 가깝습니다.
  naturalness: 전반적으로 격식 있는 현대 한국어로 자연스럽습니다. 다만 첫 문장의 목적어 병렬을 명시하고, ‘교회라는 이름조차 성립하지 않습니다’는 원문의 ‘교회라고 불리지 않는다’에 더 가까운 표현으로 고치는 것이 좋습니다.
  terminology: 집사·감독·장로는 적절합니다. ‘아버지의 표상’도 type(τύπος)의 대표·모형 의미를 무리 없이 보존합니다. ‘하나님의 의회’는 현대 한국어에서 정치 제도를 연상하므로 ‘하나님의 평의회’가 더 자연스럽고, σύνδεσμος는 ‘사도들의 연합’으로 옮깁니다.
  issues:
  - severity: medium
    issue: ‘유죄 판결을 받은 사람’
    rationale: 그리스어 δεδεμένος는 결박됨 또는 구금 상태를 가리키며 유죄 선고를 직접 진술하지 않습니다. 영어 공용 증언의 ‘convict’를 그대로 좇아 법적 유죄를 확정하면 의미가 과도하게 좁아집니다.
  - severity: medium
    issue: ‘사도들의 모임’
    rationale: 그리스어 σύνδεσμον은 결속, 유대, 연합의 뜻입니다. 단순한 집합 또는 모임으로 옮기면 결속의 뉘앙스가 약해집니다.
  - severity: low
    issue: ‘교회라는 이름조차 성립하지 않습니다’
