    그때 피스티스는 우두머리 아르콘의 불경함을 보고 격분했습니다. 보이지 않는 이가 말했습니다. “사마엘아, 곧 ‘눈먼 신’아[a], 네가 잘못 알고 있다. 너보다 먼저 존재한 불멸의 빛의 사람이 있다. 그는 네가 빚어 만든 형상들 가운데 나타날 것이다. 그는 토기장이의 그릇을 짓밟듯 너를 멸시하며 짓밟을 것이며, 너는 네게 속한 자들과 함께 네 어머니인 심연으로 곤두박질칠 것이다. 이는 네 모든 일이 끝날 때, 진리가 드러낸 결핍 전체가 폐지될 것이기 때문이다. 그 결핍은 존재하기를 그치고, 마치 한 번도 존재한 적이 없었던 것처럼 될 것이다.”


    이렇게 말한 뒤, 피스티스는 물 가운데 자기 위대함의 형상을 나타냈습니다. 그런 다음 물러나 다시 위로 올라가 자기 빛 속으로 들어갔습니다.'
