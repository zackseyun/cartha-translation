base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: ko
  text: '하늘들이 그 군대와 모든 통치 체계와 함께 자리를 잡자, 태초의 어버이는 교만해졌습니다. 천사의 온 군대가 그에게 경배했고, 모든 신과 그 천사들도 그에게 찬양과 경배를 바쳤습니다. 그는 의기양양해져서 그들에게 거듭 자랑했습니다. “나는 스스로 충족한다.”


    그는 말했습니다. “내가 바로 하나님이며, 나 말고는 존재하는 것이 아무것도 없다.” 그가 이렇게 말했을 때, 말로 표현하는 모든 불멸자에게 죄를 지었고, 그들은 그 일로 그를 고발했습니다.


    그때 피스티스는 우두머리 아르콘의 불경함을 보고 격분했습니다. 보이지 않는 그 여자가 말했습니다. “사마엘아, 네가 잘못 알고 있다.” 사마엘은 ‘눈먼 신’이라는 뜻입니다.[a] “너보다 먼저 존재한 불멸의 빛의 사람이 있다. 그는 네가 빚어 만든 형상들 가운데 나타날 것이다. 그는 토기장이의 그릇을 짓밟듯 너를 멸시하며 짓밟을 것이며, 너는 네게 속한 자들과 함께 네 어머니인 심연으로 곤두박질칠 것이다. 네 모든 일이 완결될 때, 진리가 드러낸 결핍 전체가 폐지될 것이기 때문이다. 그 결핍은 존재하기를 그치고, 마치 한 번도 존재한 적이 없었던 것처럼 될 것이다.”


    이렇게 말한 뒤, 피스티스는 물 위에 자기 위대함의 형상을 나타냈습니다. 그런 다음 다시 위로 올라가 자기 빛 속으로 물러갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사마엘’은 여기서 ‘눈먼 신’이라는 뜻으로 풀이됩니다. 이는 이 문헌 자체가 제시하는 어원 설명입니다.
    reason: 본문이 직접 제공하는 이름 풀이를 보존하면서, 확정적인 역사언어학적 어원 주장과 구별했습니다.
lexical_decisions:
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: 성별을 특정하지 않는 ‘Parent’의 폭을 보존하면서 원초적 존재라는 뜻을 자연스럽고 장중하게 전달했습니다.
- source_word: hosts
  choice: 군대
  rationale: 천상 존재들의 조직된 무리를 가리키는 전통적이면서도 이해하기 쉬운 표현입니다.
- source_word: government
  choice: 통치 체계
  rationale: 단순한 ‘정부’보다 천상 영역의 지배 질서와 기구라는 의미를 분명히 했습니다.
- source_word: self-sufficient
  choice: 스스로 충족한다
  rationale: 자존적 존재라는 주장과 부족함이 없다는 주장을 모두 열어 두며, 뒤의 ‘결핍’과도 의미상 대비됩니다.
- source_word: deathless ones who use verbal articulation
  choice: 말로 표현하는 모든 불멸자
  rationale: 난해한 원문 증언의 표현을 과도하게 해석하지 않고 언어적 발화 능력을 보존했습니다.
- source_word: chief archon
  choice: 우두머리 아르콘
  rationale: 고대 영지주의 문헌의 전문 명칭 ‘아르콘’을 보존하되 위계적 의미를 한국어로 밝혔습니다.
- source_word: man of light
  choice: 빛의 사람
  rationale: ‘사람/인간’의 모호성과 상징성을 유지하고 남성적 호칭으로 지나치게 구체화하지 않았습니다.
- source_word: forms you have shaped
  choice: 네가 빚어 만든 형상들
  rationale: 창조 행위를 연상시키는 조형의 뜻과 ‘forms’의 형상 개념을 함께 살렸습니다.
- source_word: Abyss
  choice: 심연
  rationale: 고유한 우주론적 영역의 성격을 드러내기 위해 문맥상 특정 명칭처럼 번역했습니다.
- source_word: deficiency
  choice: 결핍
  rationale: 영지주의적 우주론의 핵심 개념을 ‘불완전함’ 등으로 풀어 단정하지 않고 직역에 가까운 용어로 보존했습니다.
theological_decisions:
- issue: ‘I am the one who is God’에서 신 호칭의 처리
  choice: 내가 바로 하나님이며
  alternative: 내가 바로 신이며
  rationale: 발화자가 유일신적 절대성을 주장하는 문맥을 살리되, 이 문장이 서술자의 신학적 승인으로 오해되지 않도록 직접 인용 안에 유지했습니다.
- issue: 피스티스의 정체와 성별
  choice: 음역 ‘피스티스’를 유지하고 ‘보이지 않는 그 여자’로 지시
  alternative: ‘믿음’으로 번역하거나 여성 신격으로 명시
  rationale: 이름이면서 ‘믿음’이라는 뜻을 지닐 가능성을 번역으로 확정하지 않았고, 주어진 증언의 여성 대명사는 보존했습니다.
- issue: 빛의 사람의 정체
  choice: ‘불멸의 빛의 사람’으로만 제시
  alternative: 그리스도, 원형 인간 등으로 특정
  rationale: 본문이 명시하지 않은 특정 교리적 동일시를 도입하지 않았습니다.
- issue: 결핍의 종말
  choice: ‘폐지’되고 ‘존재하기를 그친다’고 번역
  alternative: 구원, 소멸, 무화 같은 체계적 신학 용어로 해석
  rationale: 본문의 강한 존재론적 표현을 유지하면서 그 작동 방식을 별도 교리로 설명하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서사는 장중하되 일반 독자가 이해할 수 있게 구성했으며, 아르콘·피스티스처럼 문헌 고유의 전문 명칭은 음역했습니다. 고대 콥트어 원문에 대한 직접 검토가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역입니다.
