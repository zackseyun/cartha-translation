  text: 'Then the Primal Parent gave those who dwelt with him an opinion regarding the man. Each one of them then cast his sperm into the center of the navel of the earth.


    From that day, the seven archons fashioned man together with his body to resemble their own body, yet his likeness resembled the man who had appeared to them. His shaping occurred one part at a time, and their leader formed the brain as well as the nervous system.


    Afterward, he appeared like the one who had existed prior to him. He became [] a man possessing a soul, and he was called Adam, that is, “Father,” in accord with the name of the one who had existed prior to him. When they had completed Adam, he forsook him like a lifeless vessel, since he had taken on form like an abortion, without a spirit inside him.


    When the chief archon recalled the speech of Pistis, he feared that the true man might enter into his shaped form and become its lord. This is why he departed from his shaped form for forty days; it then lacked a soul. He retreated and forsook it.


    On the fortieth day, Sophia Zoe sent her breath into Adam, who was without soul. He began to move on the ground, and he was unable to stand erect.


    Next, when the seven archons arrived, they saw him and became deeply troubled. They approached him and seized him, and he spoke to the breath inside him: “Who are you? And from where did you come to here?”


    It answered and said: “I have come from the force of the man in order to ruin your work.” Upon hearing this, they glorified him, because he granted them respite from the fear and the apprehension in which they found themselves.


    They then called that day “Rest,” because they had rested from work. When they saw that Adam was able to stand erect, they rejoiced, and they took him and placed him inside Paradise, and they retreated up to their heavens.'
translation:
  language: ko
  text: '그때 태초의 어버이는 자기와 함께 사는 이들에게 그 사람에 관한 의견을 내놓았습니다. 그러자 그들은 저마다 땅의 배꼽 한가운데에 자기 씨를 쏟았습니다.


    그날부터 일곱 통치자는 사람과 그의 몸을 함께 빚어 자기들의 몸과 닮게 하였으나, 그의 모습은 그들에게 나타났던 사람을 닮았습니다. 그는 한 부분씩 빚어졌고, 그들의 우두머리는 뇌와 신경계를 만들었습니다.


    그 뒤 그는 자기보다 먼저 있던 이와 같은 모습으로 나타났습니다. 그는 [] 혼을 지닌 사람이 되었고, 자기보다 먼저 있던 이의 이름을 따라 아담, 곧 “아버지”라고 불렸습니다.[a] 그들이 아담을 다 만들었을 때, 그는 아담을 생명 없는 그릇처럼 내버렸습니다. 아담은 자기 안에 영이 없는 채 유산된 태아 같은 형체를 갖추었기 때문입니다.


    우두머리 통치자는 피스티스가 한 말을 떠올리고, 참사람이 자기가 빚은 형체 안으로 들어가 그 주인이 될까 두려워했습니다. 그래서 그는 자기가 빚은 형체에서 사십 일 동안 떠나 있었고, 그 형체에는 그때 혼이 없었습니다. 그는 물러가 그것을 내버렸습니다.


    사십 일째 되는 날, 소피아 조에는 혼이 없는 아담에게 자기 숨결을 보내었습니다.[b] 아담은 땅 위에서 움직이기 시작했으나 똑바로 일어설 수 없었습니다.


    그 뒤 일곱 통치자가 와서 그를 보고 크게 동요했습니다. 그들은 그에게 다가가 그를 붙잡았고, 우두머리 통치자는 그의 안에 있는 숨결에게 말했습니다. “너는 누구냐? 어디에서 이리로 왔느냐?”[c]


    그 숨결이 대답했습니다. “나는 그 사람의 힘으로부터 왔다. 너희가 만든 것을 무너뜨리려는 것이다.” 이 말을 듣고 그들은 그를 찬양했습니다. 그가 그들이 사로잡혀 있던 두려움과 불안에서 벗어나 잠시 안도하게 해 주었기 때문입니다.[d]


    그들은 일을 그치고 쉬었으므로 그날을 “쉼”이라고 불렀습니다. 그들은 아담이 똑바로 설 수 있는 것을 보고 기뻐했습니다. 그리고 그를 데려다가 낙원 안에 두고, 자기들의 하늘들로 물러 올라갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문에는 “그는 [] 혼을 지닌 사람이 되었다”라고 되어 있습니다. 대괄호는 전승에 결락 또는 복원이 불확실한 부분이 있음을 나타냅니다. 또한 여기서 ‘아담’을 “아버지”라고 풀이하는 것은 이 문헌 자체의 설명입니다.
    reason: 사본상의 공백과 특이한 어원 설명을 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘혼’, ‘영’, ‘숨결’은 이 대목에서 서로 다른 표현으로 나타나므로 구별하여 옮겼습니다.
    reason: 원문의 인간론적 긴장과 어휘 구별을 보존하기 위해서입니다.
  - marker: c
    text: 공급된 영어 증언은 “그가 … 말했습니다”라고만 하므로 말하는 이가 명시적으로 확정되지는 않습니다. 문맥상 우두머리 통치자로 옮겼습니다.
    reason: 대명사의 지시 대상에 해석상의 불확실성이 있음을 밝히기 위해서입니다.
  - marker: d
    text: 통치자들이 누구를 찬양했는지, 또 파괴의 선언이 어떻게 그들에게 안도를 주었는지는 문장 자체로 분명하지 않습니다.
    reason: 역설적이고 모호한 인과관계를 번역에서 임의로 해소하지 않았음을 밝히기 위해서입니다.
lexical_decisions:
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: 성별을 원문 증거 이상으로 확정하지 않으면서도 원초적 부모라는 호칭의 의미를 자연스럽게 보존했습니다.
- source_word: archons
  choice: 통치자들
  rationale: 이 문헌의 우주적 지배자들을 뜻하는 전문 용어의 기능을 살리되 일반 독자가 이해할 수 있도록 번역했습니다.
- source_word: sperm
  choice: 씨
  rationale: 생식 물질이라는 뜻과 창조 서사의 문학적 어감을 함께 유지하는 자연스러운 표현입니다.
- source_word: soul / spirit / breath
  choice: 혼 / 영 / 숨결
  rationale: 본문이 구별하는 세 개념을 하나로 합치지 않고 각각 구별해 번역했습니다.
- source_word: the man / true man
  choice: 그 사람 / 참사람
  rationale: 일반적 인간과 초월적 원형으로 보이는 존재 사이의 문맥상 구별을 보존하되, 해석을 과도하게 덧붙이지 않았습니다.
- source_word: Sophia Zoe
  choice: 소피아 조에
  rationale: 고유명으로 음역하여 ‘지혜’와 ‘생명’이라는 뜻풀이가 곧 인물의 정체라는 해석을 본문에 강제하지 않았습니다.
- source_word: Paradise
  choice: 낙원
  rationale: 한국어 종교 문헌에서 널리 이해되는 품위 있는 대응어입니다.
- source_word: Rest
  choice: 쉼
  rationale: 일을 그치고 쉬었다는 본문의 어희를 유지하며 특정한 후대 교리 용어로 한정하지 않았습니다.
theological_decisions:
- issue: 아담 안의 혼·영·숨결의 관계
  choice: 혼, 영, 숨결을 서로 다른 말로 유지했습니다.
  alternative: 모두 ‘영혼’ 또는 ‘생명’으로 통일할 수 있습니다.
  rationale: 본문은 아담이 혼이 없거나 영이 없는 상태와 소피아 조에가 보낸 숨결을 서로 긴장 속에서 서술하므로 이를 조화시키지 않았습니다.
- issue: ‘그 사람’의 정체
  choice: 고유한 교리적 칭호를 덧붙이지 않고 ‘그 사람’ 및 ‘참사람’으로 번역했습니다.
  alternative: ‘원형 인간’, ‘천상의 인간’ 등으로 명시할 수 있습니다.
  rationale: 그 정체에 관한 해석 가능성을 열어 두고 원문이 보이는 표현상의 차이만 보존했습니다.
- issue: 통치자들이 숨결의 말을 듣고 찬양한 까닭
  choice: 문장의 역설을 그대로 두었습니다.
  alternative: 목적어나 인과관계를 보충하여 누구를 왜 찬양했는지 명시할 수 있습니다.
  rationale: 그들이 자기들의 작품을 파괴하겠다는 존재를 찬양하며 안도했다는 대목은 의미가 팽팽하고 다소 불명확하므로 임의로 해결하지 않았습니다.
- issue: 아담이라는 이름과 ‘아버지’의 관계
  choice: 본문의 어원 설명을 그대로 제시하고 각주로 불확실성을 밝혔습니다.
  alternative: 통상적인 히브리어 어원인 ‘사람/인류’ 또는 ‘땅’에 맞추어 수정할 수 있습니다.
  rationale: 이 문헌 자체의 이름 해석은 보존하되 일반적인 어원과 동일시하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 품위 있고 읽기 쉽게 다듬되, 영지주의 계열 문헌의 전문 개념과 반복, 모호성은 가능한 한 유지했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 공급된 공개 영역 영어 증언에 근거한 잠정 초안입니다.
