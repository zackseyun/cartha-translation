translation:
  language: ko
  text: '이와 같이 혼돈의 태초 부모는 자기 아들 사바오트와 그가 그 안에 거하던 영광을 보았습니다. 그리고 사바오트가 혼돈의 모든 권세 가운데 가장 위대하다는 것을 깨닫자 그를 시기했습니다. 그는 격분하여 자기 자신의 죽음에서 죽음을 낳았습니다. 그리고 죽음은 여섯째 하늘을 맡게 되었습니다. 사바오트가 그곳에서 위로 올려졌기 때문입니다. 이와 같이 혼돈의 여섯 권세의 수가 채워졌습니다.


    양성을 지닌 존재인 죽음은 자기 자신의 본성과 결합하여 양성을 지닌 일곱 자녀를 낳았습니다. 남성 자녀들의 이름은 이러합니다.


    시기,

    격분,

    눈물,

    신음,

    고통,

    울음,

    쓰라린 탄식.


    여성 자녀들의 이름은 이러합니다.


    격분,

    아픔,

    욕정,

    신음,

    저주,

    쓰라림,

    다툼.


    그들은 서로 성관계를 맺었고, 각자가 일곱 자녀를 낳았습니다. 그리하여 양성을 지닌 마흔아홉 악령이 되었습니다.[a]


    그들의 이름과 그들이 미치는 영향은 《솔로몬의 책》에서 찾아볼 수 있습니다.


    이들 앞에서, 사바오트와 함께 거하던 조에는 양성을 지닌 선한 일곱 힘을 창조했습니다. 남성들의 이름은 시기하지 않는 이, 복된 이, 기뻐하는 이, 참된 이, 질투하지 않는 이, 사랑받는 이, 신실한 이입니다. 여성들의 이름은 평화, 기쁨, 즐거움, 복됨, 진리, 사랑, 피스티스입니다.[b] 이 힘들로부터 선하고 순수한 많은 영이 생겨납니다.


    그들이 미치는 영향과 그 작용은 《열둘 아래 하늘의 운명 구조》에서 찾아볼 수 있습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 증거 본문에는 ‘합계’와 ‘마흔아홉’ 사이에 빈 대괄호가 있어, 사본의 훼손이나 복원 표시가 있었음을 시사합니다. 문맥상 수는 마흔아홉입니다.
    reason: 전승 자료의 공백 신호를 숨기지 않으면서 본문을 읽기 쉽게 제시하기 위해서입니다.
  - marker: b
    text: ‘피스티스’는 그리스어 이름을 음역한 것으로, 문맥에 따라 ‘믿음’, ‘신실함’ 또는 ‘신뢰’를 뜻할 수 있습니다.
    reason: 이름과 개념어 사이의 의미 중의성을 보존하기 위해서입니다.
  - marker: c
    text: 마지막 책 제목은 전승이 불확실하여 잠정적으로 옮겼습니다. 직역하면 ‘열둘 아래에 있는 하늘의 운명의 구조들’에 가깝습니다.
    reason: 직접 콥트어 대조가 아직 이루어지지 않은 문헌 제목의 불확실성을 알리기 위해서입니다.
lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: 혼돈의 태초 부모
  rationale: 성별을 불필요하게 확정하지 않으면서 원문의 원초적 부모라는 표현을 자연스럽고 장중하게 보존했습니다.
- source_word: androgynous
  choice: 양성을 지닌
  rationale: 남성과 여성의 성격을 함께 지닌 존재라는 뜻을 현대 독자가 이해하기 쉽게 표현했습니다.
- source_word: authorities
  choice: 권세
  rationale: 우주적 통치 세력 또는 지배자를 가리키는 종교 문헌의 의미를 보존합니다.
- source_word: Death
  choice: 죽음
  rationale: 의인화된 존재이지만 원문의 보통명사와 고유명사 사이의 긴장을 그대로 유지했습니다.
- source_word: Zoe
  choice: 조에
  rationale: 인명으로 음역하여, 그리스어로 ‘생명’을 뜻한다는 의미를 본문에서 단정하지 않았습니다.
- source_word: Pistis
  choice: 피스티스
  rationale: 목록 안의 이름으로 음역하여 ‘믿음’ 또는 ‘신실함’ 가운데 하나로 해석을 고정하지 않았습니다.
- source_word: demons
  choice: 악령
  rationale: 현대 한국어 독자가 자연스럽게 이해할 수 있는 종교적 존재 명칭을 택했습니다.
- source_word: Argumentativeness
  choice: 다툼
  rationale: 논쟁을 일삼는 성향을 인격화한 이름을 간결하고 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 죽음이 누구에게서 나왔고 누가 여섯째 하늘을 맡았는가
  choice: 태초 부모가 자기 자신의 죽음에서 죽음을 낳았고, 죽음이 여섯째 하늘을 맡았다고 번역
  alternative: 대명사를 사바오트 또는 태초 부모를 가리키는 것으로 해석
  rationale: 제공된 증거에서 가장 가까운 문법적 선행사는 의인화된 ‘죽음’이지만, 전승의 복잡성을 교리적으로 확대 해석하지 않았습니다.
- issue: 조에가 창조한 ‘일곱’ 힘과 남녀 이름 목록의 관계
  choice: 양성을 지닌 일곱 힘에 남성명 일곱과 여성명 일곱이 대응하는 구조로 유지
  alternative: 열네 힘으로 수정
  rationale: 본문이 명시하는 ‘일곱’을 보존하고, 각 양성적 힘에 남성명과 여성명이 대응할 가능성을 열어 두었습니다.
- issue: Pistis의 의미
  choice: 피스티스로 음역
  alternative: 믿음 또는 신앙으로 번역
  rationale: 이름이면서 그리스어 개념어일 수 있는 중의성을 보존하고 특정 신학적 의미로 확정하지 않았습니다.
- issue: 문헌 제목들의 정체
  choice: 제공된 증거에 따라 제목처럼 표기하되 확정적 정경 지위를 암시하지 않음
  alternative: 알려진 성경 문헌과 동일시
  rationale: 본문 밖의 문헌을 특정 정경 또는 후대 저작과 섣불리 동일시하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 서술은 장중하고 명료하게 유지했습니다. 인명과 개념명은 목록의 병렬성을 살렸으며, 원문 검토가 아직 보류 중이므로 제공된 공용 영어 증거를 바탕으로 한 잠정 번역입니다. 영어 증거에 끼어 있던 사본 쪽수 [6]은 본문에서 제외했습니다.
