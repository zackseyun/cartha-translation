    The Primal Adam, of Light, is imbued with spirit, and he appeared on the first day. The second Adam is imbued with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created entity of the earth, namely, the man of the Law, and he appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day, and the descendants of the earthly Adam multiplied and filled the earth, and from inside them they made all kinds of technological skills possessed by the Adam imbued with soul. However, all of them dwelt in ignorance.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: ko
  text: '그 여자는 먼저 첫째 아르콘으로 말미암아 아벨을 임신했습니다. 그리고 일곱 권세자와 그들의 천사들로 말미암아 다른 자녀들을 낳았습니다. 모든 일은 태초의 부모가 미리 생각한 바에 따라 이루어졌습니다. 이는 태초의 어머니가 자기 안에 모든 씨를 품되, 우주의 운명과 그 구조들에 뒤섞이고 결합된 채 품게 하려는 것이었습니다. 또한 정의가 하와에 관하여 미리 세운 계획이 실행에 옮겨졌습니다. 곧 권세자들이 빚어 만든 형상들이 빛을 가두는 곳이 되고, 빛은 그 형상들을 통하여 그들을 책망하게 된다는 것이었습니다.


    빛에 속한 태초의 아담은 영을 지니고 있으며, 첫째 날에 나타났습니다. 둘째 아담은 혼을 지니고 있으며, ‘아프로디테’라고 불리는 여섯째 날에 나타났습니다. 셋째 아담은 땅에서 창조된 존재, 곧 율법의 사람이며, 낮은 ‘안식일’ 다음의[a] ‘태양의 날’이라고 불리는 여덟째 날에 나타났습니다. 땅에 속한 아담의 후손들은 번성하여 땅을 가득 채웠고, 그들 가운데서 혼을 지닌 아담이 가진 온갖 기술을 만들어 냈습니다. 그러나 그들은 모두 무지 속에서 살았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 원문 전승에는 결락 또는 복원 불확실성을 나타내는 흔적이 있습니다. ‘다음의’는 문맥에 따른 잠정적 연결입니다.
    reason: 제공된 증언의 “[following] []” 표시는 본문 손상이나 복원의 불확실성을 나타내므로 독자에게 알릴 필요가 있습니다.
lexical_decisions:
- source_word: archon
  choice: 아르콘
  rationale: 이 문헌의 특수한 우주론적 지배자를 가리키므로 일반어 ‘통치자’로 평준화하지 않고 음역했습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 인격적 존재들과 그 천사들을 가리키는 문맥을 살리기 위해 추상명사 ‘권세들’보다 ‘권세자들’을 택했습니다.
- source_word: Primal Parent / Primal Mother
  choice: 태초의 부모 / 태초의 어머니
  rationale: 상호 대응하는 원초적 존재의 호칭을 자연스럽고 일관된 한국어로 옮겼습니다. ‘부모’의 성별 비특정성도 보존했습니다.
- source_word: spirit / soul
  choice: 영 / 혼
  rationale: 서로 구별되는 인간론적 범주이므로 각각 ‘영’과 ‘혼’으로 구분했습니다.
- source_word: shaped forms
  choice: 빚어 만든 형상들
  rationale: 형성·조형된 외적 형상이라는 뜻을 드러내면서도 배후 행위자인 권세자들과의 관계를 보존했습니다.
- source_word: technological skills
  choice: 기술
  rationale: 현대의 첨단기술로 좁혀 읽히는 것을 피하고 제작·기예 전반을 포괄하도록 옮겼습니다.
- source_word: ignorance
  choice: 무지
  rationale: 이 문헌에서 구원론적 함의를 가질 수 있는 ‘알지 못함’의 상태를 간결하게 보존했습니다.
theological_decisions:
- issue: 빛이 누구를 책망하는가
  choice: 빛은 그 형상들을 통하여 그들을 책망하게 된다는 것
  alternative: 그 형상들을 통하여 그것이 그들을 책망한다
  rationale: 영어 대명사 it의 선행사를 문맥상 ‘빛’으로 보되, 책망의 대상인 권세자들을 ‘그들’로 유지했습니다.
- issue: 태초의 아담과 빛의 관계
  choice: 빛에 속한 태초의 아담
  alternative: 빛으로 된 태초의 아담
  rationale: ‘of Light’가 기원·소속·재료 가운데 어느 뜻인지 확정하지 않고 ‘속한’으로 관계성을 열어 두었습니다.
- issue: 세 아담의 성격 구별
  choice: 영을 지닌 / 혼을 지닌 / 땅에서 창조된
  alternative: 영으로 충만한 / 혼으로 충만한 / 땅의 피조물
  rationale: 세 아담의 대조를 분명히 하되, ‘imbued’가 반드시 충만함을 뜻한다고 과도하게 확정하지 않았습니다.
- issue: 하와에 관한 정의의 계획
  choice: 정의가 하와에 관하여 미리 세운 계획
  alternative: 의가 하와를 위해 예정한 계획
  rationale: Justice를 의인화된 우주론적 존재 또는 원리로 읽을 여지를 보존하고, ‘regarding’를 목적·수혜 의미로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 고대 우주론의 전문 호칭은 필요한 경우 음역하고, 나머지는 일반 독자가 이해할 수 있는 말로 옮겼습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로 제공된 공용 영어 증언을 바탕으로 한 잠정 번역입니다.
