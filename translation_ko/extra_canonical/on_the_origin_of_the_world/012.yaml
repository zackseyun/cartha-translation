translation:
  language: ko
  text: '그다음에 정의가 낙원을 창조했습니다.[a] 낙원은 아름다웠으며, 달의 궤도와 해의 궤도 바깥, 기쁨의 땅 안쪽, 동쪽의 돌들 가운데에 자리 잡고 있었습니다. 아름답고 흡족하게 하는 나무들 사이에는 욕망이 깃들어 있습니다. 또 하나님의 뜻에 따라 영원한 생명의 나무가 낙원 북쪽에 나타났습니다. 이는 시대가 완성될 때 비천하게 빚어진 형체들에서 나올 성도들의 영혼이 죽지 않게 하려는 것이었습니다. 생명나무의 빛깔은 해와 비슷하고, 그 가지들은 아름답습니다. 잎은 편백나무의 잎과 비슷하고, 열매는 희게 익은 포도송이와 비슷합니다. 그 높이는 하늘에 닿습니다.


    그 곁에는 하나님의 능력을 지닌 지식의 나무가 있습니다. 그 광채는 환히 찬 보름달과 비슷하고, 그 가지들은 아름답습니다. 잎은 무화과나무 잎과 비슷하고, 열매는 맛좋고 흡족하게 하는 대추야자와 비슷합니다. 이 나무는 낙원 북쪽에 있습니다. 이는 영혼들을 악령들의 무기력한 잠에서 흔들어 깨워 생명나무에 가까이 가게 하고, 그 열매를 먹게 하며, 그렇게 함으로써 권세자들과 그 천사들을 규탄하게 하려는 것입니다.


    이 나무가 미친 영향은 거룩한 성경에 자세히 기록되어 있습니다. 곧 이렇습니다. “너는 낙원에 있는 지식의 나무이다. 첫 사람이 네 열매를 먹자 그의 마음이 열렸고, 그는 자기의 여자 짝을 사랑했으며, [본문 훼손][b] 다른 낯선 형상들을 규탄하고 심지어 업신여겼다.”


    그 뒤에 올리브나무가 싹을 틔웠습니다. 이는 마지막 날들에 나타날 의로운 왕들과 대제사장들을 거룩하게 하려는 것이었습니다. 그들이 받게 될 기름부음을 마련하도록 올리브나무가 첫 아담의 빛에서 나타났기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 나그함마디 문서 II,5의 콥트어 원문에 대한 직접 대조는 아직 이루어지지 않았습니다.
    reason: 직접 원어 검토가 보류된 상태라는 자료상의 한계를 독자에게 투명하게 알립니다.
  - marker: b
    text: 이 지점의 원문은 훼손되었거나 복원이 불확실하여 내용 일부가 빠져 있습니다.
    reason: 영어 증언의 빈 대괄호가 표시한 본문 결락을 임의로 보충하지 않고 보존합니다.
lexical_decisions:
- source_word: Justice
  choice: 정의
  rationale: 추상적 덕목이 창조 행위의 주체로 의인화된 표현을 해석으로 풀지 않고 보존했습니다.
- source_word: Paradise
  choice: 낙원
  rationale: 한국어 종교 문헌에서 널리 이해되며, 이 문맥의 우주론적 장소를 자연스럽게 가리킵니다.
- source_word: Land of Delight
  choice: 기쁨의 땅
  rationale: 고유한 우주론적 지명처럼 보이도록 대문자 의미를 살리되, 지나치게 감각적인 ‘쾌락’으로 한정하지 않았습니다.
- source_word: desire
  choice: 욕망
  rationale: 나무들 사이에 거주하는 듯한 원문의 독특한 의인화와 의미 긴장을 유지했습니다.
- source_word: the tree of eternal life / the tree of life
  choice: 영원한 생명의 나무 / 생명나무
  rationale: 첫 언급의 수식 의미를 충실히 살리고, 뒤의 통상적 명칭은 간결한 ‘생명나무’로 옮겼습니다.
- source_word: lowly shaped forms
  choice: 비천하게 빚어진 형체들
  rationale: 형성되거나 빚어진 몸의 뉘앙스를 유지하면서 그 형체에 대한 낮은 평가도 보존했습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 단순한 제도적 당국보다 초월적 지배 세력일 수 있는 문맥을 살리되 정체를 단정하지 않았습니다.
- source_word: female companion
  choice: 여자 짝
  rationale: ‘아내’나 특정 인물로 확정하지 않고, 성별과 동반자 관계를 모두 드러냈습니다.
- source_word: anointing
  choice: 기름부음
  rationale: 올리브나무, 왕, 대제사장의 문맥과 연결되는 의례적 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘정의’가 낙원을 창조하는 주체로 제시됨
  choice: ‘정의가 … 창조했습니다’로 직접 번역
  alternative: ‘정의의 존재가’ 또는 특정 신적 존재의 이름으로 해석
  rationale: 본문의 의인화와 우주론적 긴장을 그대로 두고 존재론적 정체를 교리적으로 확정하지 않았습니다.
- issue: 성도들의 영혼이 죽지 않게 되는 목적 진술
  choice: ‘죽지 않게 하려는 것’
  alternative: ‘불멸을 얻게 하려는 것’
  rationale: deathless의 직접적 의미를 살려, 영혼이 본래 불멸인지 후에 불멸을 얻는지에 관한 논쟁을 불필요하게 확정하지 않았습니다.
- issue: 지식의 나무의 긍정적 기능
  choice: 영혼을 깨워 생명나무로 이끈다는 진술을 그대로 보존
  alternative: 창세기 전통에 맞추어 부정적 유혹의 나무로 재해석
  rationale: 이 문헌 자체의 독특한 신학적 서술을 다른 정경 해석으로 수정하지 않았습니다.
- issue: ‘거룩한 성경’ 인용문의 출처와 권위
  choice: 본문의 명칭을 그대로 번역
  alternative: 특정 정경 문헌이나 알려진 구절로 식별
  rationale: 공급된 증거만으로 인용 출처를 특정할 수 없으므로 모호성을 유지했습니다.
- issue: 첫 아담의 빛과 기름부음의 관계
  choice: 인과관계를 원문 순서대로 유지
  alternative: 성령, 메시아 또는 특정 성례로 명시
  rationale: 본문이 명시하지 않은 교단적·교리적 동일시를 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 우주론적 묘사는 읽기 쉽게 문장을 나누었으나 나무들의 위치, 외양, 목적에 관한 반복 구조는 유지했습니다. 영어 증언에 있던 필사본 쪽수 [11], [12]는 본문 내용이 아니므로 제외했고, 실제 주석 표지는 [a], [b]로 명시했습니다.
