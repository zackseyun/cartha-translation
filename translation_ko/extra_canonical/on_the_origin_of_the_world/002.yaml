  text: 'After the natural form of the deathless beings had finished developing out of infinity, a likeness called Sophia emanated from Pistis. She exercised her will and became a created being like the primordial light. Immediately, her will appeared in the likeness of heaven, possessing an incomprehensible size between the deathless beings and the beings that came into existence afterward, resembling [. . .]. She acted as a veil separating humanity from the beings above.


    Now, the aeon of Truth has no external shadow, because the infinite light dwells everywhere within it. Its exterior, however, is a shadow called “Darkness.” From it appeared a host that ruled over the darkness, and the hosts that came into being afterward called the shadow “Infinite Chaos.” From it every kind of divinity sprang upward [. . .] together with the entire place, with the further result that shadow came after the first [] created being. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow then realized that something more powerful than itself existed and became envious. When it had become pregnant through its own will, it immediately gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, this jealousy was found to be an aborted fetus with no spirit within it. It came into being as a shadow within an immense watery substance. The bile that had come from the shadow was then thrust into a region of Chaos.


    From that day, a watery substance has been evident, and what sank down within it gushed away while remaining visible within Chaos. As with a woman giving birth to a child, when all her accumulated matter gushes out, so matter came into being from a shadow and was driven away from it, yet it did not leave Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter remained within Chaos, dwelling in one of its regions. After these things had happened, Pistis arrived and appeared above the matter of Chaos, which had been expelled like an aborted fetus, since no spirit dwelled within it, for it was entirely infinite darkness and bottomless water. When Pistis saw what had resulted from her defect, she became troubled. Her distress appeared as a frightful created being that hurried toward her in Chaos. She turned toward it and blew into its face within the Abyss, which lies beneath [] all the heavens. Pistis Sophia then willed that the being without spirit should be formed into a likeness and should rule over matter and all her hosts. For the first time, an androgynous archon resembling a lion appeared from the waters, possessing great authority within himself and not knowing where he had come from.


    As Pistis Sophia watched him moving about in the watery depths, she said to him, “Child, pass over here,” which is the same as yalda-baoth. From that day, the law of articulate speech appeared and extended to the gods, the angels, and humanity. What had come into being through articulate speech was brought to completion by the gods, the angels, and humanity.


    Now, the archon Yaltabaoth was unaware of the power of Pistis. He did not see her face but instead saw in the water the likeness that spoke with him. Because of that voice, he called himself “Yald<ab>aoth.” The perfect ones, however, call him “Ariael,” because he resembled a lion.


    When he had gained authority over matter, Pistis Sophia withdrew upward into her light.'
translation:
  language: ko
  text: '불멸하는 존재들의 본래 형상이 무한으로부터 다 펼쳐져 나온 뒤, 그때 피스티스에게서 소피아라고 불리는 한 형상이 유출되었습니다. 소피아가 자신의 뜻을 발휘하자 태초의 빛과 같은 피조된 존재가 되었고, 곧 그의 뜻은 하늘의 형상으로 나타났습니다. 그것은 불멸하는 존재들과 그 뒤에 생겨난 존재들 사이에 자리하며 헤아릴 수 없이 광대했고, […]을 닮았습니다. 소피아는 인류와 위에 있는 존재들을 갈라놓는 휘장과 같은 구실을 했습니다.


    진리의 아이온[a]에는 바깥 그림자가 없습니다. 무한한 빛이 그 안 모든 곳에 머물기 때문입니다. 그러나 그 바깥에는 ‘어둠’이라고 불리는 그림자가 있습니다. 그 그림자에서 어둠 위를 다스리는 무리가 나타났고, 그 뒤에 생겨난 무리들은 그 그림자를 ‘무한한 혼돈’이라고 불렀습니다. 그 혼돈에서 온갖 신적 존재가 […] 온 영역과 함께 위로 솟아났습니다. 그리하여 그림자는 첫 번째 [] 피조된 존재보다 뒤에 있게 되었습니다. 그것은 앞서 말한 피스티스에게서 비롯되어 심연 <안에> 나타났습니다.[b]


    그 뒤 그림자는 자기보다 더 강한 것이 있음을 깨닫고 시기했습니다. 자기 뜻으로 잉태하자 곧 질투를 낳았습니다. 그날부터 모든 아이온과 그 세계들을 지배하는 질투의 법칙이 드러났습니다. 그런데 그 질투는 그 안에 영이 전혀 없는 유산된 태아로 밝혀졌습니다. 그것은 거대한 물질 속에서 그림자로 생겨났습니다. 이어서 그림자에서 생긴 쓸개즙이 혼돈의 한 영역으로 내던져졌습니다.


    그날부터 물질이 드러났고, 그 안으로 가라앉은 것은 혼돈 속에 보이는 채로 흘러나갔습니다. 여자가 아이를 낳을 때 그 안에 쌓여 있던 것이 모두 쏟아져 나오는 것처럼, 물질[c]도 그림자에서 생겨나 그 그림자로부터 밀려났지만 혼돈 밖으로 나가지는 않았습니다.


    얄다바오트의 출현


    도리어 물질은 혼돈 안의 한 영역에 머물렀습니다. 이런 일들이 일어난 뒤 피스티스가 와서 혼돈의 물질 위에 나타났습니다. 그 물질은 유산된 태아처럼 내버려졌으며 그 안에는 영이 전혀 머물지 않았습니다. 그것은 온통 무한한 어둠이며 밑바닥 없는 물이었기 때문입니다. 피스티스는 자신의 결함에서 비롯된 것을 보고 근심했습니다. 그 근심은 무시무시한 피조물로 나타나 혼돈 속에서 그에게 달려왔습니다. 피스티스는 그것을 향해 몸을 돌리고, 모든 하늘 아래 []에 있는 심연 속에서 그 얼굴에 숨을 불어넣었습니다. 피스티스 소피아가 영 없는 그 존재를 한 형상으로 빚어 물질과 자신의 모든 무리를 다스리게 하려고 뜻하자, 사자를 닮은 양성적 통치자[d]가 처음으로 물에서 나타났습니다. 그는 자기 안에 큰 권세를 지녔지만 자신이 어디에서 생겨났는지는 알지 못했습니다.


    피스티스 소피아는 그가 깊은 물속에서 이리저리 움직이는 것을 보고 말했습니다. “아이야, 이리로 건너오너라.” 이 말은 ‘얄다-바오트’와 같은 뜻입니다.[e] 그날부터 분명한 말의 법칙이 나타나 신들과 천사들과 인류에게까지 미쳤습니다. 분명한 말로 생겨난 것은 신들과 천사들과 인류에 의해 완성되었습니다.


    그런데 통치자 얄타바오트는 피스티스의 능력을 알지 못했습니다. 그는 피스티스의 얼굴을 보지 못하고, 물속에서 자기에게 말하는 형상만 보았습니다. 그 목소리 때문에 그는 자신을 ‘얄드<아브>아오트’라고 불렀습니다.[f] 그러나 완전한 이들은 그가 사자를 닮았기 때문에 그를 ‘아리아엘’이라고 부릅니다.


    그가 물질을 다스릴 권세를 얻자, 피스티스 소피아는 위에 있는 자신의 빛 속으로 물러갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이온’은 이 문헌에서 시대를 뜻할 수도 있고, 초월적 영역이나 존재 질서를 가리킬 수도 있는 전문용어입니다.
    reason: 낯선 우주론 용어의 의미 범위를 설명합니다.
  - marker: b
    text: '[…]와 []는 사본의 결락 또는 판독 불가능한 부분을, 꺾쇠 < >는 편집자가 보충한 말을 나타냅니다.'
    reason: 본문에 보존한 비평 기호를 독자가 이해하도록 합니다.
  - marker: c
    text: 이 단락의 ‘물질’은 물과 물질적 실체가 겹치는 표현일 가능성이 있습니다. 직접적인 콥트어 대조가 이루어지기 전까지 번역은 잠정적입니다.
    reason: 영어 witness의 ‘watery substance’와 ‘matter’ 사이의 어휘적 불확실성을 공개합니다.
  - marker: d
    text: ‘통치자’는 흔히 ‘아르콘’으로 음역되는 말로, 이 문헌에서는 우주적 지배 권세를 지닌 존재를 가리킵니다.
    reason: 전문용어를 평이하게 번역하면서 그 기술적 의미를 보존합니다.
  - marker: e
    text: 본문은 “아이야, 이리로 건너오너라”라는 말과 ‘얄다-바오트’라는 이름을 연결합니다. 이 말장난의 정확한 형태는 원어 검토가 필요합니다.
    reason: 문헌 내부의 어원 설명과 현대의 검증 가능성을 구별합니다.
  - marker: f
    text: 이름의 서로 다른 표기인 ‘얄다바오트’, ‘얄타바오트’, ‘얄드<아브>아오트’, ‘얄다-바오트’를 공급된 witness에 따라 보존했습니다. <아브>는 편집자가 복원한 부분입니다.
    reason: 이형 표기와 본문 복원 표지를 평준화하지 않기 위해서입니다.
lexical_decisions:
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌에서는 시간의 시대뿐 아니라 초월적 영역 또는 존재 질서를 가리키는 전문용어이므로 음역하여 의미의 다층성을 보존했습니다.
- source_word: emanated
  choice: 유출되었습니다
  rationale: 영지주의적 우주 발생의 연속적 발출이라는 개념을 살리면서도 특정 교파의 해석을 덧붙이지 않았습니다.
- source_word: archon
  choice: 통치자
  rationale: 권세를 행사하는 지배 존재라는 기본 의미를 일반 독자가 이해할 수 있게 옮겼으며, 첫 등장 각주에서 전문용어의 성격을 밝혔습니다.
- source_word: likeness
  choice: 형상
  rationale: 단순한 외모 이상의 모상·닮음의 의미를 유지하고 문단 전체에서 일관되게 사용했습니다.
- source_word: watery substance / matter
  choice: 물질 / 물질
  rationale: 영어 witness의 watery substance와 matter는 한국어에서 모두 ‘물질’로 겹칠 수 있어, 전자는 문맥에 따라 ‘거대한 물질’ 또는 ‘물질’로 옮겼습니다. 다만 기초 콥트어 대조 전에는 물과 물질의 어휘 관계가 잠정적입니다.
- source_word: articulate speech
  choice: 분명한 말
  rationale: 단순한 발성보다 뜻을 갖추어 표현된 언어를 나타내되, 난해한 ‘분절 언어’보다 자연스러운 표현을 택했습니다.
- source_word: androgynous
  choice: 양성적
  rationale: 남성과 여성의 성격을 함께 지녔다는 원문의 긴장을 중립적이고 간결하게 보존했습니다.
theological_decisions:
- issue: 피스티스와 소피아의 관계
  choice: ‘피스티스에게서 소피아라고 불리는 한 형상이 유출되었다’고 번역
  alternative: 피스티스 소피아를 처음부터 하나의 복합 고유명으로 처리
  rationale: 첫 문장은 둘을 구별하는 듯하고 뒤에서는 ‘피스티스 소피아’라는 결합 명칭을 사용하므로, 문헌 자체의 관계 변화와 모호성을 그대로 남겼습니다.
- issue: 질투의 의인화와 산출
  choice: 그림자가 잉태하여 질투를 낳았다고 직역에 가깝게 표현
  alternative: 시기심이 생겼다는 심리적 비유로 평준화
  rationale: 우주론적 존재 발생과 감정의 의인화가 겹치는 본문의 신학적 긴장을 해소하지 않았습니다.
- issue: 영이 없는 유산된 태아
  choice: 충격적인 출생·유산 이미지를 유지
  alternative: 불완전한 산물로 완곡하게 번역
  rationale: 물질과 질투의 기원을 묘사하는 원문의 강한 상징을 교리적으로 완화하지 않았습니다.
- issue: 얄다바오트의 이름 유래
  choice: 본문의 언어유희 주장을 그대로 번역하고 각주로 잠정성을 표시
  alternative: 현대 어원학에 따라 설명 또는 수정
  rationale: 고대 문헌이 제시하는 해석을 본문에서 보존하되, 공급된 영어 witness만으로는 원어 말장난을 검증할 수 없음을 밝혔습니다.
