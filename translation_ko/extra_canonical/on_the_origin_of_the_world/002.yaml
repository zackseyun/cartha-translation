  revised_text: '불멸하는 존재들의 본래 형상이 무한으로부터 다 펼쳐져 나온 뒤, 그때 피스티스에게서 소피아라고 불리는 한 형상이 유출되었습니다. 소피아는 자신의 뜻을 발휘하여 태초의 빛과 같은 피조된 존재가 되었고, 곧 그녀의 뜻은 하늘의 형상으로 나타났습니다. 그것은 불멸하는 존재들과 그 뒤에 생겨난 존재들 사이에 자리하며 헤아릴 수 없이 광대했고, […]을 닮았습니다. 소피아는 인류와 위에 있는 존재들을 갈라놓는 휘장과 같은 구실을 했습니다.



    진리의 아이온[a]에는 바깥 그림자가 없습니다. 무한한 빛이 그 안 모든 곳에 머물기 때문입니다. 그러나 그 바깥에는 ‘어둠’이라는 이름으로 불리는 그림자가 있습니다. 그 그림자에서 어둠 위를 다스리는 한 무리가 나타났고, 그 뒤에 생겨난 무리들은 그 그림자를 ‘무한한 혼돈’이라고 불렀습니다. 그 그림자, 곧 무한한 혼돈에서 온갖 신적 존재가 […] 온 영역과 함께 위로 솟아났습니다. 그 결과 그림자는 첫 번째 [] 피조된 존재 뒤에 있게 되었습니다. 그것은 앞서 말한 피스티스에게서 비롯되어 심연 <안에> 나타났습니다.[b]



    그 뒤 그림자는 자기보다 더 강한 것이 있음을 깨닫고 시기했습니다. 자기 뜻으로 잉태하자 곧 질투를 낳았습니다. 그날부터 모든 아이온과 그 세계들 가운데 지배적인 질투의 법칙이 드러났습니다. 그런데 그 질투는 그 안에 영이 전혀 없는 유산된 태아로 드러났습니다. 그것은 거대한 물의 실체 속에서 그림자로 생겨났습니다. 이어서 그림자에서 생긴 쓸개즙이 혼돈의 한 영역으로 내던져졌습니다.



    그날부터 물의 실체가 드러났고, 그 안으로 가라앉은 것은 혼돈 속에 보이는 채로 흘러나갔습니다. 여자가 아이를 낳을 때 그 안에 쌓여 있던 것이 모두 쏟아져 나오는 것처럼, 물질[c]도 그림자에서 생겨나 그 그림자로부터 밀려났지만 혼돈 밖으로 나가지는 않았습니다.



    얄다바오트의 출현



    도리어 물질은 혼돈 안, 그 한 영역에 머물렀습니다. 이런 일들이 일어난 뒤 피스티스가 와서 혼돈의 물질 위에 나타났습니다. 그 물질은 유산된 태아처럼 내쳐졌으며, 그 안에는 영이 전혀 머물지 않았습니다. 그것은 온통 무한한 어둠이며 밑바닥 없는 물이었기 때문입니다. 피스티스는 자신의 결함에서 비롯된 것을 보고 근심했습니다. 그 근심은 무시무시한 피조된 존재로 나타나 혼돈 속에서 피스티스에게 달려왔습니다. 피스티스는 그것을 향해 몸을 돌리고, [] 모든 하늘 아래에 있는 심연 속에서 그 얼굴에 숨을 불어넣었습니다. 피스티스 소피아가 영 없는 그 존재를 한 형상으로 빚어 물질과 자신의 모든 무리를 다스리게 하려고 뜻하자, 사자를 닮은 양성적 통치자[d]가 처음으로 물에서 나타났습니다. 그는 자기 안에 큰 권세를 지녔지만 자신이 어디에서 생겨났는지는 알지 못했습니다.



    피스티스 소피아는 그가 깊은 물속에서 이리저리 움직이는 것을 보고 말했습니다. “아이야, 이리로 건너오너라.” 이 말은 ‘얄다-바오트’와 같은 뜻입니다.[e] 그날부터 분절된 말의 법칙이 나타나 신들과 천사들과 인류에게까지 미쳤습니다. 분절된 말로 말미암아 생겨난 것은 신들과 천사들과 인류에 의해 완성되었습니다.



    그런데 통치자 얄타바오트는 피스티스의 능력을 알지 못했습니다. 그는 피스티스의 얼굴을 보지 못하고, 물속에서 자기에게 말하는 형상만 보았습니다. 그 목소리 때문에 그는 자신을 ‘얄드<아브>아오트’라고 불렀습니다.[f] 그러나 완전한 이들은 그가 사자를 닮았기 때문에 그를 ‘아리아엘’이라고 부릅니다.



