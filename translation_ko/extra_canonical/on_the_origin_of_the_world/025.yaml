  revised_text: '이제 우리는 우리의 세계를 살펴보겠습니다. 그리하여 그 구조와 통치에 관한 설명을 정확하게 마무리하려는 것입니다. 그러면 창조 때부터 시대의 완성에 이르기까지 드러나 온, 보이지 않는 아이온을 향한 신실함이 어떻게 발견되었는지가 분명해질 것입니다.


    이제 나는 죽지 않는 사람에 관한 주요 주제로 나아가겠습니다. 그에게 속한 존재들을 논하면서 그들이 어떻게 이곳에 있게 되었는지를 밝히겠습니다.


    심지어 물질에서 만들어진 [만들어진 아담의] [] 혈통으로 수많은 사람이 생겨나고[a], 세계에 이미 사람이 가득 찼을 때, 통치자들이 그 세계의 주인이었습니다. 곧 그들은 무지로 그 세계를 종살이하게 했습니다. 그 까닭은 무엇입니까? 다음과 같습니다. 죽지 않는 아버지께서는 아이온들과 그들의 우주 가운데 진리의 결핍이 생겼음을 알고 계십니다. 그분은 멸망의 통치자들이 빚어 만든 피조물들을 통하여 그 통치자들을 무로 돌리고자 하셨을 때, 여러분의 형상들, 곧 순전함의 복된 작은 영들을 멸망의 세계로 내려보내셨습니다. 그들은 지식과 무관한 자들이 아닙니다. 모든 지식이 그들에게 나타난 한 천사 안에 깃들어 있기 때문입니다. 그는 아버지 앞에서 능력이 부족하지 않으므로, <그가> 그들에게 지식을 줄 수 있습니다.[b] 그들이 멸망의 세계에 나타나면, 그들은 통치자들과 그 군대를 책망하는 것으로서 파괴될 수 없음의 구조를 즉시 드러냅니다.


    이와 같이 복된 존재들이 권세자들이 빚은 형상으로 나타났을 때, 그들은 시기를 받았습니다. 권세자들은 시기한 나머지 자기들의 씨를 그들의 씨와 결합하여 그들을 더럽히려 했습니다. 그러나 그렇게 할 수 없었습니다.


    그 뒤 복된 존재들이 빛나는 형상으로 나타났을 때, 그들은 여러 방식으로 나타났습니다. 그들은 서로 다른 아이온들에서 와서, 멸망에 속한 빚어진 형상들을 통하여 보이게 된 교회에 자기들의 지식을 알려 주었습니다. 그 교회는 권세자들의 씨가 [그 교회와] 결합되었기 때문에 온갖 종류의 씨를 품고 있는 것으로 드러났습니다.[c]


    그때 구원자는 그들 모두를 [(하나로)] 만드셨습니다.[d] 그들의 영들은 분명히 더 뛰어나며, 복되고 [] 여러 방식으로 선택받았습니다. 또한 왕이 없는 다른 존재들도 여럿 있는데, 그들은 그들이 존재하기 전에 존재했던 모든 이보다 뛰어납니다.[e]


    그러므로 네 종족이 있습니다. 셋은 여덟째 하늘의 왕들에게 속하지만, 넷째 종족은 왕이 없고 완전하며, 그 모두 가운데 가장 높습니다. 이들이야말로 자기 아버지의 거룩한 곳에 들어갈 자들이기 때문입니다. 그들은 안식과 평온, 영원하고 말로 다 할 수 없는 영광, 끝없는 기쁨을 얻을 것입니다.


    더욱이 그들은 죽지 않으므로 죽음의 영역 안에서 왕들입니다. 그들은 카오스의 신들과 그 군대를 책망할 것입니다.'
