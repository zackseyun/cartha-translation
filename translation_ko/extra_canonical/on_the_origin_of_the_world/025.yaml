  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: ko
  text: '이제 우리는 우리의 세계를 살펴보겠습니다. 그리하여 그 구조와 통치에 관한 설명을 정확하게 마무리하려는 것입니다. 그러면 창조 때부터 시대의 완성에 이르기까지 나타나 온, 보이지 않는 아이온을 향한 신실함이 어떻게 발견되었는지가 분명해질 것입니다.


    이제 나는 죽지 않는 사람에 관한 주요 주제로 나아가겠습니다. 그에게 속한 존재들을 논하면서 그들이 어떻게 이곳에 있게 되었는지를 밝히겠습니다.


    심지어 물질로부터 만들어진 [아담의] 혈통을 따라 수많은 사람이 생겨나고[a], 세계에 이미 사람이 가득 찼을 때, 통치자들이 세계의 주인이었습니다. 곧 그들은 무지로 세계를 종살이하게 했습니다. 그 까닭은 무엇입니까? 다음과 같습니다. 죽지 않는 아버지께서는 아이온들과 그들의 우주 가운데 진리의 결핍이 생겼음을 알고 계십니다. 그분은 멸망의 통치자들이 빚어 만든 피조물들을 통하여 그 통치자들을 무로 돌리고자 하셨을 때, 여러분의 형상들, 곧 순전함의 복된 작은 영들을 멸망의 세계로 내려보내셨습니다. 그들은 지식과 무관한 자들이 아닙니다. 모든 지식이 그들에게 나타난 한 천사 안에 깃들어 있기 때문입니다. 그는 아버지 앞에서 능력이 부족하지 않으므로, <그가> 그들에게 지식을 줄 수 있습니다.[b] 그들이 멸망의 세계에 나타나면, 즉시 파괴될 수 없음의 구조를 드러내어 통치자들과 그 군대를 책망합니다.


    이와 같이 복된 존재들이 권세자들이 빚은 형상으로 나타났을 때, 권세자들은 그들을 시기했습니다. 권세자들은 시기한 나머지 자기들의 씨를 그들의 씨와 결합하여 그들을 더럽히려 했습니다. 그러나 그렇게 할 수 없었습니다.


    그 뒤 복된 존재들이 빛나는 형상으로 나타났을 때, 그들은 여러 방식으로 나타났습니다. 그들은 서로 다른 아이온들에서 와서, 멸망의 빚어진 형상들을 통하여 보이게 된 교회에 자기들의 지식을 드러냈습니다. 그 교회는 권세자들의 씨가 [그 교회와] 결합되었기 때문에 온갖 종류의 씨를 품고 있는 것으로 드러났습니다.[c]


    그때 구원자는 그들 모두를 [(하나로)] 만드셨습니다.[d] 그들의 영들은 분명히 더 뛰어나며, 복되고 […] 여러 방식으로 선택받았습니다. 또한 왕이 없는 다른 존재들도 여럿 있는데, 그들은 자기들보다 먼저 존재한 모든 자보다 뛰어납니다.[e]


    그러므로 네 종족이 있습니다. 셋은 여덟째 하늘의 왕들에게 속하지만, 넷째 종족은 왕이 없고 완전하며, 그 모두 가운데 가장 높습니다. 이들이야말로 자기 아버지의 거룩한 곳에 들어갈 자들이기 때문입니다. 그들은 안식과 평온, 영원하고 말로 다 할 수 없는 영광, 끝없는 기쁨을 얻을 것입니다.


    더욱이 그들은 죽지 않으므로 죽음의 영역 안에서 왕들입니다. 그들은 카오스의 신들과 그 군대를 책망할 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 사본에는 결락이 있어 아담과 인류의 혈통을 잇는 정확한 문장 형태가 불확실합니다.
    reason: 손상된 본문의 복원 불확실성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘<그가>’는 문맥에 따라 보충된 말입니다. 이 문장의 대명사 관계와 구문은 불확실합니다.
    reason: 각괄호 복원과 천사·아버지 사이의 지시 관계가 확정적이지 않음을 보존하기 위해서입니다.
  - marker: c
    text: ‘그 교회와’는 결락된 목적어를 문맥에 따라 보충한 것입니다. ‘교회’는 원문 전승에서 여성 대명사로 다시 지칭됩니다.
    reason: 보충된 문구와 대명사의 문법적 배경을 설명하기 위해서입니다.
  - marker: d
    text: ‘하나로’는 손상되었거나 불확실한 본문의 복원입니다.
    reason: 구원자가 모두를 창조했다는 뜻과 하나로 만들었다는 뜻 사이의 본문 불확실성을 표시하기 위해서입니다.
  - marker: e
    text: 이 문단에는 결락이 있으며, 마지막 비교 구문의 정확한 형태도 불확실합니다.
    reason: 복된 영들과 왕 없는 존재들의 관계 및 선후 비교가 손상된 증거에 의존함을 밝히기 위해서입니다.
lexical_decisions:
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌의 우주론적 전문어가 단순한 ‘시대’나 ‘영원’으로 축소되지 않도록 음역했습니다. 다만 ‘consummation of the age’는 문맥상 시간적 의미이므로 ‘시대의 완성’으로 옮겼습니다.
- source_word: archons
  choice: 통치자들
  rationale: 영지주의 문헌의 전문적 함의를 지니면서도 일반 독자가 기능을 이해할 수 있도록 ‘통치자들’로 옮겼습니다.
- source_word: authorities
  choice: 권세자들
  rationale: archons와의 어휘상 구별을 유지하면서 지배 세력이라는 의미를 살렸습니다.
- source_word: deathless man
  choice: 죽지 않는 사람
  rationale: ‘불멸의 인간’보다 원문의 반복적 deathless 표현을 직접 보존하고, 성별을 과도하게 특정하지 않는 표현을 택했습니다.
- source_word: indestructibility
  choice: 파괴될 수 없음
  rationale: 추상적·우주론적 성격을 유지하되 ‘불멸’과 동일시하지 않고 원문의 구별을 보존했습니다.
- source_word: church
  choice: 교회
  rationale: 공동체를 뜻할 가능성도 있으나, 제공된 증거의 ‘church’를 보존했습니다. 후속 콥트어 검토에서 어휘 확인이 필요합니다.
- source_word: races
  choice: 종족
  rationale: 우주론적으로 구분되는 네 부류를 가리키므로 ‘세대’나 ‘민족’보다 ‘종족’이 문맥에 적합합니다.
- source_word: Chaos
  choice: 카오스
  rationale: 일반적인 ‘혼돈’ 상태가 아니라 의인화·영역화된 우주론적 고유 개념일 가능성을 살리기 위해 음역했습니다.
theological_decisions:
- issue: 보이지 않는 아이온과 신실함의 관계
  choice: ‘보이지 않는 아이온을 향한 신실함’
  alternative: ‘보이지 않는 아이온의 신실함’
  rationale: 영어 증거의 ‘faithfulness to’를 따라 방향성을 보존하되, 그 신실함의 주체가 누구인지 본문이 명시하지 않는 긴장을 그대로 두었습니다.
- issue: 아버지가 통치자들을 무로 돌리는 수단
  choice: ‘그들이 빚어 만든 피조물들을 통하여’
  alternative: ‘그들이 빚은 존재들 때문에’
  rationale: 피조물이 통치자들을 폐하는 도구가 된다는 역설적인 수단 관계를 해소하지 않고 보존했습니다.
- issue: 권세자들의 씨와 복된 존재들의 씨의 결합
  choice: 결합은 이루어졌으나 더럽히는 데에는 실패한 것으로 번역
  alternative: 결합 시도 자체가 실패한 것으로 번역
  rationale: 이어지는 문단이 권세자들의 씨가 교회와 결합되었다고 말하므로, ‘그렇게 할 수 없었다’는 말을 결합 자체보다 더럽히려는 목적의 실패로 읽었습니다.
- issue: 왕이 없는 넷째 종족
  choice: ‘왕이 없고 완전하며’
  alternative: ‘왕에게 속하지 않으며 완전하고’
  rationale: ‘kingless’의 정치적·우주론적 긴장을 직접 보존하고 특정 교리 체계로 풀어 쓰지 않았습니다.
- issue: censure/condemn의 강도
  choice: ‘책망하다’
  alternative: ‘정죄하다’
  rationale: 제공된 공공 영역 증거의 censure가 지닌 비판·폭로의 의미를 살리고, 최종 심판이라는 교리적 의미를 과도하게 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 일반 독자가 따라갈 수 있도록 문장을 적절히 나누었으나, 아이온·통치자·권세자·씨·왕 없는 종족 등 문헌 특유의 우주론적 긴장과 반복은 유지했습니다. 현재 초안은 제공된 공공 영역 영어 증거를 직접 대조해 작성했으며, 콥트어 원문 검토가 아직 이루어지지 않았으므로 결락부, 대명사 지시, 전문어는 후속 원어 검토 대상입니다.
