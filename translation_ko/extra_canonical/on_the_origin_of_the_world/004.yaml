  revised_text: '혼돈 가운데 양성적 존재 일곱이 나타났습니다. 그들에게는 남성 이름과 여성 이름이 모두 있습니다.


    여성 이름은 프로노이아입니다. 삼바타스는 “한 주”라는 뜻이며,[a]


    그의 아들은 야오라 불리고, 그의 여성 이름은 통치권입니다.


    사바오트의 여성 이름은 신성입니다.


    아도나이오스의 여성 이름은 왕권입니다.


    엘라이오스의 여성 이름은 질투입니다.


    오라이오스의 여성 이름은 부이며,


    아스타파이오스의 [여성] 이름은 […] 소피아입니다.[b]


    이들은 혼돈의 일곱 하늘에 속한 일곱 권세입니다. 이들은 피스티스의 뜻에 따라, 자기들보다 먼저 존재하던 죽지 않는 구조에 상응하는 양성적 존재로 태어났습니다. 곧 처음부터 존재했던 것의 형상이 끝까지 다스리게 하려는 뜻이었습니다.


    이 이름들이 발휘하는 능력과 남성 존재들의 힘은 《예언자 모세의 대천사적 본성》에서 찾아볼 수 있고, 여성 존재들의 이름이 지닌 힘은 《노라이아 제1서》에서 찾아볼 수 있습니다.[c]


    태초의 어버이 얄다바오트는 큰 권세들을 지니고 있었으므로, 말로 자기 자손마다 하늘을 하나씩 창조했습니다. 그는 그것들을 좋은 거처로 만들었고, 각 하늘마다 일곱 배나 뛰어난 큰 영광들을 창조했습니다. 곧 보좌와 궁전과 신전과 병거와 처녀 영들이며, 보이지 않는 존재에 이르기까지 그들의 영광도 창조했습니다.[d] 각각은 자기 하늘에 이 모든 것, 곧 강대한 신들의 군대와 주들과 천사들과 대천사들을 셀 수 없이 무수히 지니고 있었으며, 그들이 섬기도록 하였습니다.


    이 일들에 관한 이야기는 《오라이아 제1서사》에 정확히 기록되어 있습니다.[e]


    그것들은 이 하늘에서 소피아에게 속한 여섯째 하늘에 이르기까지 완성되었습니다.[f]


    이 하늘과 땅은 그 모든 것 아래에 살던 말썽꾼의 공격을 받았습니다. 혼돈의 군대는 자기들 아래에 있는 하늘을 공격한 자가 누구인지 알았으므로, 여섯 하늘이 격렬하게 흔들렸습니다. 피스티스는 그 말썽꾼이 일으킨 균열을 알아차리고 자기 영을 보내 그를 결박한 뒤 타르타로스에 내던졌습니다.


    [그날부터] 하늘은 그 땅과 함께 […] 얄다바오트의 딸이며 그 모든 것 아래에 사는 소피아를 통하여 굳게 세워져 있습니다.[g]'
