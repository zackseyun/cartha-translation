base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/004.yaml
  text: 'Seven androgynous beings appeared in Chaos. They have both masculine and feminine names:


    The feminine name is Pronoia, Sambathas, which means “week,”

    and his son is named Yao, whose feminine name is Rulership.

    Sabaoth, whose feminine name is Divinity.

    Adonaios, whose feminine name is Kingship.

    Elaios, whose feminine name is Jealousy.

    Oraios, whose feminine name is Wealth,

    and Astaphaios, whose [feminine] name [] is Sophia.


    These are the seven powers belonging to the seven heavens of Chaos. They were born as androgynous beings, corresponding to the deathless structure that existed before them, in accordance with the desire of Pistis—namely, that the likeness of what had existed from the beginning would rule until the end.


    You will discover the power exerted by these names, as well as the power of the male beings, in the (book) The Archangelic (Nature) of the Prophet Moses, and the power of the names of the female beings in the First Book of Noraia.


    Now the Primal Parent Yaldabaoth, since he possessed great authorities, created heavens for each of his offspring by speaking them into being. He made them good as dwelling places, and in each heaven he created great glories, each seven times as excellent: thrones, palaces, temples, chariots, and virginal spirits, (all the way) up to an unseen one, along with their glories. Each one possessed these in its own heaven: mighty hosts of gods, lords, angels, and archangels, countless myriads, so that they might serve.


    You will find the account of these events precisely described in the First Narration of Oraia.


    And they were completed, from this heaven up to the sixth heaven, which belongs to Sophia.


    This heaven and earth were attacked by the mischief-maker who lived beneath them all, and the six heavens trembled violently, because the hosts of Chaos knew who had attacked the heaven located beneath them. When Pistis became aware of the fracture caused by the mischief-maker, she sent out her spirit, bound him, and cast him down into Tartaros.


    [From that day], the heaven, together with [] its earth, has been established through Sophia, the daughter of Yaldabaoth, who dwells beneath them all.'
translation:
  language: ko
  text: '혼돈 가운데 양성적 존재 일곱이 나타났습니다. 그들에게는 남성 이름과 여성 이름이 모두 있습니다.


    여성 이름은 프로노이아인 삼바타스이며, 그 뜻은 “한 주”입니다.[a]

    그의 아들은 야오라 불리며, 그의 여성 이름은 통치권입니다.

    사바오트의 여성 이름은 신성입니다.

    아도나이오스의 여성 이름은 왕권입니다.

    엘라이오스의 여성 이름은 질투입니다.

    오라이오스의 여성 이름은 부이며,

    아스타파이오스의 [여성] 이름은 […] 소피아입니다.[b]


    이들은 혼돈의 일곱 하늘에 속한 일곱 권세입니다. 이들은 피스티스의 뜻에 따라, 자기들보다 먼저 존재하던 죽지 않는 구조에 상응하는 양성적 존재로 태어났습니다. 곧 처음부터 존재했던 것의 형상이 끝까지 다스리게 하려는 뜻이었습니다.


    이 이름들이 발휘하는 능력과 남성 존재들의 힘은 《예언자 모세의 대천사적 본성》에서 찾아볼 수 있고, 여성 존재들의 이름이 지닌 힘은 《노라이아 제1서》에서 찾아볼 수 있습니다.[c]


    태초의 어버이 얄다바오트는 큰 권세들을 지니고 있었으므로, 말로 명하여 자기 자손마다 하늘을 하나씩 창조했습니다. 그는 그것들을 좋은 거처로 만들었고, 각 하늘마다 일곱 배나 뛰어난 큰 영광들을 창조했습니다. 곧 보좌와 궁전과 신전과 병거와 처녀 영들이며, 보이지 않는 존재에 이르기까지 그들의 영광도 창조했습니다.[d] 각 존재는 자기 하늘에 이 모든 것을 지니고 있었습니다. 섬기게 하려고 강대한 신들의 군대와 주들과 천사들과 대천사들을 셀 수 없이 무수히 두었습니다.


    이 일들에 관한 이야기는 《오라이아 제1서사》에 정확히 기록되어 있습니다.[e]


    그것들은 이 하늘에서 소피아에게 속한 여섯째 하늘에 이르기까지 완성되었습니다.[f]


    이 하늘과 땅은 그 모든 것 아래에 살던 말썽꾼의 공격을 받았습니다. 혼돈의 군대는 자기들 아래에 있는 하늘을 공격한 자가 누구인지 알았으므로, 여섯 하늘이 격렬하게 흔들렸습니다. 피스티스는 그 말썽꾼이 일으킨 균열을 알아차리고 자기 영을 보내 그를 결박한 뒤 타르타로스에 내던졌습니다.


    [그날부터] 하늘은 그 땅과 함께 […] 얄다바오트의 딸이며 그 모든 것 아래에 사는 소피아를 통하여 굳게 세워져 있습니다.[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “프로노이아”는 ‘선견’ 또는 ‘섭리’를 뜻할 수 있습니다. “삼바타스”와 “한 주”의 관계는 전승의 명명 방식에 따른 것입니다.
    reason: 독자가 음역된 이름과 뜻풀이의 관계를 이해하도록 돕습니다.
  - marker: b
    text: 이 대목의 본문은 손상되어 있습니다. 대괄호와 생략 부호는 불확실하거나 빠진 부분을 나타냅니다.
    reason: 사본의 결락과 편집상 보충을 투명하게 표시합니다.
  - marker: c
    text: 여기에 언급된 두 문헌의 제목은 전승된 명칭을 잠정적으로 옮긴 것입니다.
    reason: 고대 문헌 제목의 복원과 동일성이 확실하지 않을 수 있음을 알립니다.
  - marker: d
    text: “보이지 않는 존재에 이르기까지”가 앞의 목록 가운데 무엇을 수식하는지는 분명하지 않습니다.
    reason: 문장 구조상의 실제 모호성을 보존합니다.
  - marker: e
    text: “오라이아”는 앞의 “노라이아”와 관련된 이름일 가능성이 있으나, 여기서는 제시된 형태를 구별하여 옮겼습니다.
    reason: 서로 다른 표기를 임의로 동일시하지 않습니다.
  - marker: f
    text: “이 하늘에서”가 정확히 어느 하늘을 가리키는지, 그리고 하늘들의 계산 방식은 본문만으로 분명하지 않습니다.
    reason: 우주론적 순서를 억지로 조화하지 않습니다.
  - marker: g
    text: 문장 가운데 결락이 있으며, “[그날부터]”도 보충된 표현입니다. 따라서 하늘과 땅이 확립된 방식에 관한 문장은 일부 불확실합니다.
    reason: 결락과 보충으로 인한 해석의 한계를 밝힙니다.
lexical_decisions:
- source_word: androgynous
  choice: 양성적
  rationale: 남성과 여성의 이름을 함께 지닌 존재라는 문맥을 보존하면서도, 현대 한국어에서 비교적 정확하고 품위 있게 전달합니다.
- source_word: Chaos
  choice: 혼돈
  rationale: 우주론적 영역을 가리키는 고유한 개념으로 이해할 수 있도록 일관되게 번역했습니다.
- source_word: powers / authorities
  choice: 권세 / 권세들
  rationale: 우주적 통치 능력과 지배 권한을 나타내는 문맥을 살렸습니다. 서로 다른 문맥에서 ‘능력’과 ‘권세’를 구별했습니다.
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: 성별을 단정하지 않으면서 원문의 부모·시원자 의미를 자연스럽게 보존합니다.
- source_word: by means of verbal articulation
  choice: 말로 명하여
  rationale: 발화로 창조한다는 뜻을 자연스럽게 전달하되, 창조 방식에 관한 함의를 과도하게 확정하지 않습니다.
- source_word: glories
  choice: 영광들
  rationale: 복수의 천상적 실재 또는 위엄을 가리키는 낯선 용법을 단수로 평준화하지 않고 보존했습니다.
- source_word: mischief-maker
  choice: 말썽꾼
  rationale: 악의적 교란자라는 뜻은 전달하되 ‘악마’ 같은 특정 신학적 정체성을 덧씌우지 않았습니다.
- source_word: Tartaros
  choice: 타르타로스
  rationale: 고대 우주론의 지명을 일반적인 ‘지옥’으로 해석하지 않고 음역했습니다.
theological_decisions:
- issue: 피스티스와 소피아의 명칭
  choice: 피스티스, 소피아로 음역
  alternative: 믿음, 지혜로 번역
  rationale: 이 문맥에서는 인격적·우주론적 존재의 고유명으로 기능하므로 뜻풀이 번역이 정체성을 흐릴 수 있습니다.
- issue: 여성 이름에 붙은 추상 명사
  choice: 통치권, 신성, 왕권, 질투, 부
  alternative: 여주권자, 여신, 여왕 등 인격 명칭으로 의역
  rationale: 증거가 제시하는 추상적 여성 이름을 그대로 유지하여 신학적 체계를 임의로 인격화하지 않았습니다.
- issue: ‘죽지 않는 구조’의 성격
  choice: 죽지 않는 구조
  alternative: 불멸의 원형 체계
  rationale: 선재하는 구조가 원형인지 체계인지 확정하지 않고 원문의 긴장을 보존했습니다.
- issue: 소피아를 통한 하늘과 땅의 확립
  choice: 소피아를 통하여 굳게 세워져 있습니다
  alternative: 소피아가 하늘과 땅을 세웠습니다
  rationale: 매개 또는 수단을 나타내는 표현을 보존하여 소피아의 정확한 행위자 역할을 과도하게 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고유한 우주론적 이름은 음역하고, 일반 독자가 이해하기 어려운 곳은 각주로 설명했습니다. 제공된 영어 공개 번역 증거를 바탕으로 한 잠정 번역이며, 콥트어 원문에 대한 직접 검토가 아직 필요합니다. 원문의 반복, 복수형, 성별 긴장, 결락과 문법적 모호성을 가능한 한 보존했습니다.
