review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증인과 영어 POB 대조본을 기준으로 볼 때, 전반적으로 이름, 결락 표지, 우주론적 용어, 그리고 피스티스·소피아의 인격적 명칭을 충실히 보존했습니다. 다만 천상 존재들의 목록에서 ‘각각이 지니고 있었다’는 구문과 그 뒤의 ‘섬기도록’의 관계가 한국어 초안에서는 별도의 불분명한 행위자가 ‘두었다’는 뜻으로 바뀌어 있습니다. 원문의 목록·소유 구문으로 바로 연결해야 합니다. 또한 ‘삼바타스’가 포함된 손상되고 구문상 불안정한 도입부는 인명 동격으로 단정하지 않는 편이 더 안전합니다.
  naturalness: 합쇼체는 일관되고 대체로 자연스럽습니다. ‘각 존재는 … 지니고 있었습니다. 섬기게 하려고 … 두었습니다’는 문법상 주체가 바뀌고 의미도 어색하므로 수정이 필요합니다. ‘태초의 어버이’와 ‘양성적 존재’는 이 잠정적 영어 증인에 근거한 중립적 선택으로 유지할 수 있습니다.
  terminology: 혼돈, 권세, 태초의 어버이, 타르타로스, 피스티스, 소피아 등의 처리는 일관되고 특정 교리적 해석을 부과하지 않습니다. ‘보이지 않는 존재’와 손상된 본문 표지는 계속 보존해야 합니다. 문헌 제목은 복원된 고대 제목으로 단정하지 않고 잠정적 음역임을 각주에서 밝히는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 천상 존재들의 소유 목록에 새로운 행위자와 행위를 도입함
    rationale: ‘각 존재는 자기 하늘에 이 모든 것을 지니고 있었습니다. 섬기게 하려고 … 두었습니다’는 ‘두었습니다’의 주체를 명시하지 않으며, 영어 증인의 ‘Each one possessed these … mighty hosts … so that they might serve’를 별도 배치 행위로 바꿉니다. 군대·주·천사·대천사들을 각 하늘에 속한 소유 목록으로 연결하고 ‘섬기도록’만 목적절로 남겨야 합니다.
  - severity: low
