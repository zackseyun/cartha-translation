base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: ko
  text: '물속에 비친 피스티스의 형상을 본 태초의 어버이는 크게 슬퍼했습니다. 특히 물속에서 처음 자기를 불렀던 목소리와 닮은 그녀의 목소리를 들었을 때 더욱 그러했습니다. 그는 자기에게 이름을 준 이가 바로 그녀였음을 깨닫고 신음했습니다. 그는 자기 죄를 부끄러워했습니다. 그리고 죽지 않는 빛의 사람이 자기보다 먼저 존재했다는 사실을 분명히 알게 되자 몹시 동요했습니다. 전에 그가 모든 신과 그들의 천사들에게 “하느님인 이는 바로 나다. 나 말고는 존재하는 것이 아무것도 없다”라고 선언했기 때문입니다. 자기보다 먼저 다른 누군가가 존재했다는 것을 그들이 알아내어 자기를 고발할까 두려워했던 것입니다.


    그러나 그는 분별력이 없어서 고발당할 가능성을 비웃으며 경솔하게 행동했습니다. 그가 말했습니다. “만일 […] 무엇인가가 나보다 먼저 존재했다면, 앞으로 나오게 하여 우리가 그 빛을 보게 하자.” 그러자 곧, 보십시오! 위쪽 제팔천에서 빛이 나와 땅의 모든 하늘을 지나갔습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 콥트어 원문 대조는 아직 이루어지지 않았습니다. 인용문 속 […]는 전승 자료의 본문 결손 또는 복원 불확실성을 나타냅니다.
    reason: 직접적인 콥트어 검토가 보류된 상태와 영어 증언의 대괄호 표지를 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: Pistis
  choice: 피스티스
  rationale: 고유명으로 보존하여 ‘믿음’이라는 뜻으로 해석해 번역함으로써 인물명과 추상명사의 긴장을 미리 해소하지 않았습니다.
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: 성별을 불필요하게 확정하지 않으면서 원문의 기원적 부모 이미지를 자연스럽고 장중하게 전달합니다.
- source_word: deathless man of light
  choice: 죽지 않는 빛의 사람
  rationale: ‘불멸의 광명인’처럼 교리화하거나 전문용어화하지 않고 구성 요소와 수식 관계를 보존했습니다.
- source_word: denounce
  choice: 고발하다
  rationale: 단순한 비난보다 권위자의 거짓 주장을 폭로하고 문제 삼는 문맥을 살렸습니다.
- source_word: eighth heaven
  choice: 제팔천
  rationale: 고대 우주론의 층위를 나타내는 명칭으로 간결하게 옮겼습니다.
- source_word: all the heavens of the earth
  choice: 땅의 모든 하늘
  rationale: 낯선 우주론적 표현을 평탄화하지 않고 원문의 속격 관계와 모호성을 보존했습니다.
theological_decisions:
- issue: ‘I am the one who is God’의 신적 자기 선언
  choice: “하느님인 이는 바로 나다”
  alternative: “나는 하느님이다”
  rationale: 배타적 강조를 살리되 이 발언을 본문의 서술자가 승인하는 신앙고백처럼 다듬지 않았습니다.
- issue: 피스티스의 정체
  choice: 피스티스를 고유명으로 음역
  alternative: ‘믿음’으로 번역
  rationale: 인격적 존재인지 상징적 개념인지에 관한 본문의 긴장을 독자가 볼 수 있도록 해석을 유보했습니다.
- issue: ‘deathless man of light’의 존재론적 성격
  choice: 직역에 가까운 ‘죽지 않는 빛의 사람’
  alternative: ‘불멸의 광명인’
  rationale: 특정 영지주의 체계의 전문 술어를 덧씌우지 않고 증언의 표현 자체를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 장중하되 일반 독자가 이해할 수 있도록 문장을 적절히 나누었고, ‘보십시오!’는 원문의 돌연한 주의 환기 표현을 보존했습니다. 신명은 현대 한국어에서 자연스러운 ‘하느님’을 택했으며 특정 교파의 해석을 덧붙이지 않았습니다.
