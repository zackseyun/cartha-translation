base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: ko
  text: '앞서 말한 아르콘들에게로 돌아가 그들을 설명해 보겠습니다.


    일곱 아르콘이 자기들의 하늘에서 땅으로 내던져졌을 때, 그들은 자신들을 섬기게 하려고 수많은 악령의 천사들을 만들어 냈습니다. 이 천사들은 인류에게 갖가지 미혹과 마술과 약물과 우상 숭배와 살육과 제단과 신전과 희생 제사와, 땅에 속한 모든 악령에게 바치는 전제를 가르쳤습니다. 그들은 불의의 신들과 정의의 신들이 합의하여 생겨난 운명과 함께 일했습니다. 이렇게 세상이 생겨난 뒤 세상은 길을 잃고 끊임없이 혼란에 빠졌습니다. 창조 때부터 시대의 종말에 이르기까지 땅의 모든 사람이 악령들을 숭배했기 때문입니다. 곧 정의의 천사들과 불의한 인간들이 그러했습니다.[a]


    이렇게 세상은 혼란과 무지와 혼미 가운데 존재하게 되었습니다. 참사람이 나타날 때까지 그들은 모두 길을 잃었습니다.[b]


    이 주제에 관해서는 이 정도로 충분합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “정의의 천사들과 불의한 인간들”이 정확히 무엇을 수식하는지는 문법적으로 분명하지 않습니다. 악령을 숭배한 이들을 가리킬 수도 있고, 서로 대조되는 집단들을 가리킬 수도 있습니다.
    reason: 영어 증언과 POB 상담문이 모두 인정하는 진정한 통사적 모호성을 보존하기 위해서입니다.
  - marker: b
    text: “참사람”은 특별한 칭호일 수 있으나, 이 대목만으로 그 정체를 더 구체적으로 확정할 수 없습니다.
    reason: 특정 신학적 동일시를 본문에 덧붙이지 않기 위해서입니다.
lexical_decisions:
- source_word: archons
  choice: 아르콘
  rationale: 이 문헌의 우주론적 지배자들을 가리키는 전문 용어이므로 음역하여 고유한 의미 영역을 보존했습니다.
- source_word: demonic angels
  choice: 악령의 천사들
  rationale: ‘악령들’과 ‘천사들’의 결합을 지우지 않으면서도 현대 한국어로 이해할 수 있게 옮겼습니다.
- source_word: potions
  choice: 약물
  rationale: 약제·묘약·독약 가운데 어느 하나로 의미를 좁히지 않도록 포괄적으로 번역했습니다.
- source_word: libations
  choice: 전제
  rationale: 제의에서 액체를 부어 바치는 행위를 가리키는 정식 종교 용어를 사용했습니다.
- source_word: fate
  choice: 운명
  rationale: 인격화되었을 가능성을 살리되 별도의 고유명사로 단정하지 않았습니다.
- source_word: true man
  choice: 참사람
  rationale: 일반적인 ‘진정한 인간’보다 본문의 구원론적·원형적 호칭 가능성을 보존하는 간결한 표현을 택했습니다.
theological_decisions:
- issue: ‘정의의 천사들과 불의한 인간들’의 문법적 귀속
  choice: 앞 문장의 악령 숭배 주체를 보충하는 병렬 표현으로 본문에 두되 각주로 모호성을 밝혔습니다.
  alternative: 악령들의 두 부류, 또는 서로 대조되는 별개의 집단을 가리키는 말로 해석할 수 있습니다.
  rationale: 제공된 증거 자체가 문법적으로 모호하므로 특정 교리적 해석으로 확정하지 않았습니다.
- issue: ‘the true man’의 정체
  choice: ‘참사람’이라는 호칭으로 번역하고 특정 인물과 동일시하지 않았습니다.
  alternative: ‘진정한 인간’ 또는 특정 구원자를 지칭하는 칭호로 해석할 수 있습니다.
  rationale: 문맥상 특별한 종말론적·구원론적 존재일 수 있지만 제공된 본문만으로 그 정체를 명시할 수 없습니다.
- issue: ‘consummation (of the age)’
  choice: 시대의 종말
  alternative: 완성 또는 성취
  rationale: 시간적 종결의 뜻을 자연스럽게 전달하되, 원문 검토가 보류된 상태이므로 각주에서 의미 가능성을 알렸습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 전문 용어 ‘아르콘’과 제의 용어 ‘전제’는 정확성을 위해 유지했고, 나머지 문장은 일반 독자가 따라가기 쉽도록 나누었습니다. 콥트어 원문 대조가 보류되어 있으므로 제공된 공공 영역 영어 증언을 직접적인 초안 근거로 삼았으며, 불확실한 구절은 확정적으로 해소하지 않았습니다.
