base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: ko
  text: '태초의 어버이는 그 빛이 아름답게 빛나는 것을 보고 놀라 몹시 부끄러워했습니다. 그 빛이 나올 때, 그 안에 참으로 놀라운 사람의 형상이 나타났습니다. 태초의 어버이와 함께 살던 프로노이아 말고는 아무도 그 형상을 보지 못했습니다. 그러나 그 형상의 빛은 하늘의 모든 무리에게 나타났고, 그 때문에 그들은 모두 동요했습니다.


    그때 프로노이아는 그 사자를 보고 사랑에 빠졌습니다. 그러나 사자는 프로노이아가 어둠 속에 산다는 이유로 그를 몹시 싫어했습니다. 프로노이아는 사자를 끌어안고 싶었지만 그럴 수 없었습니다. 사랑을 식힐 수 없게 되자, 프로노이아는 자기 빛을 땅 위에 쏟았습니다. 그날부터 그 사자는 “빛의 아담”이라 불렸습니다. 이 이름을 번역하면 “빛나는 피의 사람”이라는 뜻입니다. 그리고 그의 위로 땅, 곧 거룩한 아다만이 펼쳐졌습니다.[a] 이 이름을 번역하면 “금강석의 거룩한 땅”이라는 뜻입니다.


    그날부터 모든 권세는 처녀의 피를 귀하게 여겼고, 땅은 처녀의 피로 말미암아 정결해졌습니다. 또한 물은 물속에서 태초의 어버이에게 나타났던 피스티스 소피아의 형상을 통하여 정결해졌습니다. 그러므로 “물들을 통하여 (그것이 나타났다)”라고 말한 것은 옳습니다. 거룩한 물은 모든 것에 생명을 주므로, [b] 모든 것을 정결하게 합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승문에 이 지점의 필사본 쪽수 ‘[7]’이 끼어 있으나, 본문 내용이 아니므로 번역문에서는 생략했습니다. ‘아다만’과 ‘아담’, 그리고 ‘금강석의’에 해당하는 말 사이에는 어원적 말놀이가 있는 듯합니다.
    reason: 필사본 쪽수 표지를 본문과 구별하고 번역만으로 충분히 전달하기 어려운 명칭의 말놀이를 설명합니다.
  - marker: b
    text: 전승문에는 이 자리에 빈 대괄호가 있어, 본문이 손상되었거나 복원이 필요할 가능성을 알립니다.
    reason: 본문 증언의 결락 또는 불확실성 신호를 보존합니다.
lexical_decisions:
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: ‘Parent’의 성별 비한정성을 보존하면서도 ‘Primal’의 시간적·원초적 의미를 자연스러운 한국어로 나타냈습니다.
- source_word: Pronoia
  choice: 프로노이아
  rationale: 작품 안의 고유한 신화적 존재명으로 보고 음역했습니다. 이를 단순히 ‘섭리’로 번역하여 특정 신학 개념과 동일시하지 않았습니다.
- source_word: Adam of Light
  choice: 빛의 아담
  rationale: 명칭의 구조와 이어지는 어원 풀이를 보존했습니다.
- source_word: radiant man of blood
  choice: 빛나는 피의 사람
  rationale: ‘light/radiant’, ‘blood’, ‘man’ 사이의 의도적인 어원적·상징적 결합을 해소하지 않고 직설적으로 살렸습니다.
- source_word: Adaman / Adamantine
  choice: 아다만 / 금강석의
  rationale: ‘Adaman’은 고유명으로 음역하고, 뒤의 해설에서는 adamantine의 광물 이미지를 드러내어 말놀이를 가능한 범위에서 보존했습니다.
- source_word: authority
  choice: 권세
  rationale: 이 문헌의 우주론적 통치 세력을 가리키는 용례에 맞추되, 정체를 더 구체적으로 규정하지 않았습니다.
- source_word: Pistis Sophia
  choice: 피스티스 소피아
  rationale: 복합 고유명으로 음역하여 ‘믿음’이나 ‘지혜’로 번역할 때 생길 수 있는 성격 규정을 피했습니다.
- source_word: holy water
  choice: 거룩한 물
  rationale: 전통적인 ‘성수’가 특정 후대 의례를 연상시킬 수 있어, 원문의 일반적인 명사구를 투명하게 옮겼습니다.
theological_decisions:
- issue: 태초의 어버이와 프로노이아 및 빛의 형상 사이의 관계
  choice: 원문 증언의 서술 관계만 옮기고 각 존재의 위계나 본질을 규정하지 않음
  alternative: 이들을 특정 정통·영지주의 신학 체계의 고정된 인물들과 명시적으로 동일시함
  rationale: 본문 자체의 신화적 긴장과 모호성을 보존하고 외부 교리 체계를 번역에 들이지 않기 위해서입니다.
- issue: 처녀의 피가 땅을 정결하게 한다는 진술
  choice: ‘처녀의 피로 말미암아 정결해졌다’로 직접 보존
  alternative: 상징적 의미를 풀이하거나 특정 구원론적 사건으로 해석함
  rationale: 원문의 인과 진술을 유지하되 그 신학적 의미를 번역자가 확정하지 않았습니다.
- issue: ‘물들을 통하여 (그것이 나타났다)’의 불완전한 인용
  choice: 괄호와 대명사의 불확정성을 보존
  alternative: 주어를 피스티스 소피아나 형상으로 명시함
  rationale: 영어 증언에서도 보충된 표현으로 제시되며, 콥트어 직접 대조가 보류된 상태이므로 지시 대상을 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 신화적·우주론적 명칭은 대체로 음역하고, 문장은 일반 독자가 따라갈 수 있도록 짧고 명료하게 나누었습니다. 다만 현재 제공된 drafting basis가 공공 영역 영어 증언이며 콥트어 직접 검토가 보류되어 있으므로, 어원 풀이와 불완전한 인용의 세부 표현은 잠정적입니다.
