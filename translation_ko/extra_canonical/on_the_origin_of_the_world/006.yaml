  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/006.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, heard the voice of Pistis, he sang praises to her. At Pistis’s command, he denounced his father [and mother] [], and he praised her because she had taught them about the deathless man and his light. Then Pistis Sophia pointed her finger and poured some of the light from her own light onto him, as a denunciation of his father. When Sabaoth was illuminated, he received great authority over all the hosts of Chaos. From that day on, he has been called “Lord of Hosts.”


    He despised his father, the Darkness, and his mother, the Abyss. He hated his sister, the thought of the Primal Parent, who had moved back and forth over the waters. Because of his light, all the authorities of Chaos became jealous of him. When they grew troubled, they waged a great war in the seven heavens.


    When Pistis Sophia witnessed the war, she sent seven archangels from her light to Sabaoth. They carried him up to the seventh heaven and stood before him as attendants. She also sent him three additional archangels and established for him the kingdom that is over everyone, so that he could dwell above the twelve gods of Chaos.


    Now, when Sabaoth had received the dwelling place of rest as a reward for his repentance, Pistis also gave him her daughter Zoe, together with great authority, so that she could teach him about everything that exists in the eighth heaven. Because he possessed authority, before anything else he built a palace for himself. It is immense and magnificent, seven times larger than all those that exist in the seven heavens. In front of [] his palace, he created an immense throne that stood on a four-faced chariot called “Cherubin.”


    The Cherubin have eight shapes on each of the four corners: forms of lions, calves, humans, and eagles, so that all the forms total sixty-four. Seven archangels stand in front of it. He [4] is the eighth, and he possesses authority. All the forms total seventy-two. In addition, the seventy-two gods derived their shape from this chariot so that they could rule over the seventy-two languages of the nations. At that throne he also created serpent-like angels called “Seraphin,” who always glorify him.'
translation:
  language: ko
  text: '얄다바오트의 아들 사바오트는 피스티스의 음성을 듣고 그를 찬양했습니다. 그는 피스티스의 명령에 따라 자기 아버지[와 어머니][a]를 규탄했고, 피스티스가 그들에게 죽지 않는 사람과 그의 빛에 관해 가르쳐 주었기 때문에 그를 찬양했습니다. 그러자 피스티스 소피아는 손가락으로 가리키며, 그의 아버지를 규탄한다는 뜻으로 자기 빛에서 나온 빛 일부를 사바오트에게 부어 주었습니다. 사바오트는 빛을 받은 뒤 카오스의 모든 군대를 다스릴 큰 권세를 얻었습니다. 그날부터 그는 ‘만군의 주’라고 불렸습니다.


    그는 자기 아버지인 어둠과 자기 어머니인 심연을 업신여겼으며, 물 위를 오가던 태초 부모의 생각인 자기 누이를 미워했습니다. 그의 빛 때문에 카오스의 모든 권세자가 그를 시기하게 되었습니다. 그들은 동요한 끝에 일곱 하늘에서 큰 전쟁을 벌였습니다.


    피스티스 소피아는 그 전쟁을 보고 자기 빛에서 일곱 대천사를 사바오트에게 보냈습니다. 그들은 사바오트를 일곱째 하늘로 들어 올렸고, 그의 앞에 시종으로 섰습니다. 피스티스 소피아는 대천사 셋을 더 그에게 보내고, 그가 카오스의 열두 신 위에 머물도록 모든 존재 위에 있는 왕국을 그를 위해 세워 주었습니다.


    사바오트가 회개의 보상으로 안식의 거처를 차지하자, 피스티스는 큰 권세와 함께 자기 딸 조에도 그에게 주었습니다. 이는 조에가 여덟째 하늘에 있는 모든 것에 관해 그를 가르치게 하려는 것이었습니다. 사바오트는 권세를 지니고 있었으므로 무엇보다 먼저 자기를 위한 궁전을 지었습니다. 그 궁전은 거대하고 장엄했으며, 일곱 하늘에 있는 모든 궁전을 합친 것보다 일곱 배나 컸습니다. 그는 자기 궁전 앞에[b] 거대한 보좌를 만들었는데, 그 보좌는 ‘케루빈’이라고 불리는 네 얼굴의 병거 위에 놓여 있었습니다.


    케루빈의 네 모퉁이에는 각각 여덟 형상이 있는데, 곧 사자와 송아지와 사람과 독수리의 형상입니다. 그래서 모든 형상을 합하면 예순넷입니다. 그 앞에는 일곱 대천사가 서 있습니다. 사바오트 자신이 여덟째이며 권세를 지니고 있습니다.[c] 모든 형상을 합하면 일흔둘입니다. 또한 일흔두 신은 이 병거에서 자기들의 형상을 얻었는데, 이는 민족들의 일흔두 언어를 다스리게 하려는 것이었습니다. 사바오트는 그 보좌 곁에 ‘세라핀’이라고 불리는 뱀 같은 천사들도 만들었으며, 이들은 언제나 그를 찬양합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘와 어머니’는 전승 본문에서 복원되었거나 불확실한 부분입니다. 그 뒤에도 판독할 수 없는 결락이 있습니다.
    reason: 제공된 증언의 “[and mother] []”라는 본문 손상 및 복원 신호를 독자에게 알립니다.
  - marker: b
    text: ‘앞에’에 이어지는 원문에는 결락이 있습니다.
    reason: 제공된 증언의 “in front of [] his palace”에 표시된 본문 손상을 보존합니다.
  - marker: c
    text: 일부 판본에 이 지점의 사본 쪽수 ‘4’가 본문 사이에 표시되어 있으나, 문장의 일부가 아니므로 번역문에서는 생략했습니다.
    reason: 영어 증언의 “[4]”가 내용상 숫자가 아니라 편집상의 쪽수 표지임을 설명합니다.
lexical_decisions:
- source_word: Pistis / Pistis Sophia
  choice: 피스티스 / 피스티스 소피아
  rationale: 인격적 존재의 고유명으로 음역하여, 일반명사 ‘믿음’이나 ‘지혜’로 번역할 때 생길 수 있는 의미의 단순화를 피했습니다.
- source_word: Sabaoth / Yaldabaoth / Zoe
  choice: 사바오트 / 얄다바오트 / 조에
  rationale: 본문의 신화적 인물 이름을 일관되게 음역했습니다.
- source_word: Chaos
  choice: 카오스
  rationale: 이 작품의 우주론적 영역을 가리키는 고유한 명칭으로 보고 음역했습니다.
- source_word: authorities
  choice: 권세자
  rationale: 인격적 우주 세력들을 가리키므로 추상명사 ‘권세’보다 ‘권세자’가 문맥에 적합합니다.
- source_word: hosts
  choice: 군대
  rationale: 카오스에 속한 집단적 세력이라는 의미를 자연스럽게 전달하되, 칭호 ‘Lord of Hosts’에서는 전통적으로 알아보기 쉬운 ‘만군의 주’를 사용했습니다.
- source_word: deathless man
  choice: 죽지 않는 사람
  rationale: ‘불멸의 인간’보다 원문의 묘사적 성격을 살리고 특정 교리적 전문어로 고정하지 않았습니다.
- source_word: Cherubin / Seraphin
  choice: 케루빈 / 세라핀
  rationale: 이형 복수형을 작품 속 병거와 천사 집단의 명칭으로 보존하고, 통상적 성경 용어와의 성급한 동일시를 피했습니다.
- source_word: Primal Parent
  choice: 태초 부모
  rationale: 성별이 명시되지 않은 parent의 포괄성과 원초적 존재라는 뜻을 함께 보존했습니다.
theological_decisions:
- issue: 사바오트가 받은 권세의 관계
  choice: ‘카오스의 모든 군대를 다스릴 큰 권세’
  alternative: ‘카오스의 모든 군대에 맞설 큰 권세’
  rationale: 영어 증언의 against는 대항과 우위 양쪽 가능성이 있으나, 뒤이어 사바오트가 상위 왕국에 세워지고 카오스의 신들 위에 거한다는 문맥에 따라 통치적 우위를 본문에 반영했습니다.
- issue: 피스티스 소피아와 피스티스의 동일성
  choice: 본문에 나타나는 호칭을 각각 그대로 유지
  alternative: 모두 ‘피스티스 소피아’로 통일
  rationale: 원문 증언이 두 호칭을 번갈아 쓰므로 동일 인물인지 호칭상의 구분인지 번역자가 확정하지 않았습니다.
- issue: ‘Lord of Hosts’의 칭호
  choice: ‘만군의 주’
  alternative: ‘군대들의 주’
  rationale: 독자가 칭호의 성서적 울림을 인식할 수 있도록 관용적 표현을 택했지만, 문맥상 사바오트에게 적용된다는 본문의 긴장을 그대로 두었습니다.
- issue: 누이의 동격 표현
  choice: ‘태초 부모의 생각인 자기 누이’
  alternative: ‘자기 누이, 곧 태초 부모의 생각’
  rationale: 누이가 ‘태초 부모’ 자체가 아니라 그 존재의 ‘생각’이라는 동격 관계를 보존했습니다.
- issue: 형상 수의 산정
  choice: 예순넷과 일흔둘을 모두 그대로 보존
  alternative: 수치를 조화시키거나 설명적으로 수정
  rationale: 본문 내부의 계산 또는 구성에 긴장이 있어도 이를 교정하지 않고 전승된 수치를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 신화적·우주론적 고유명은 음역하고, 문장은 일반 독자가 따라갈 수 있도록 나누되 반복되는 계보와 공간 구조는 보존했습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역이며, 대괄호로 드러난 복원과 결락은 각주로 명시했습니다.
