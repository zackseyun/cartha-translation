    그러나 죽지 않는 인간이 자기들을 모른 체하지 않으리라는 것을 알게 되자, 그들은 불안해졌습니다. 오히려 나무로 변한 그 여성 존재를 두려워해야 했기 때문입니다. 그들은 말했습니다. “어쩌면 이 존재가 참된 인간인지도 모른다. 이 존재는 우리 위에 안개를 드리웠고, 더럽혀진 여성이 그를 닮았다고 우리에게 가르쳤다. 그러면 우리는 패배할 것이다.”


