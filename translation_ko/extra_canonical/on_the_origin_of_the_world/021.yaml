base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/021.yaml
  text: 'Allow me to say next that, once the archons had seen him and the female being who lived with him unknowingly going astray like beasts, they were extremely happy.


    When they learned that the deathless man would not ignore them, they became upset, because they would instead have to fear the female being who had turned herself into a tree. They said, “Perhaps this is the real man, this being who cast a mist over us and taught us that she who had been defiled resembles him. Then we will be defeated.”


    Then all seven devised schemes together. They nervously approached Adam and Eve and said to him, “You may eat the fruit of any of the trees created for you in Paradise. But concerning the tree of knowledge, restrain yourself and do not eat from it. If you eat, you will die.” After causing deep anxiety within them, they withdrew to their authorities.


    Then the cleverest of all creatures approached, the one called “Beast.” When he saw the likeness of their mother Eve, he said to her, “What did God say to you? Was it, ‘Do not eat from the tree of knowledge’?”


    She said, “He not only said, ‘Do not eat from it,’ but also, ‘Do not touch it, or you will die.’”


    He said to her, “Do not be afraid. With death you will not die, because he knows that when you eat [] from it, your reasoning will become sober, and you will become like gods, knowing the difference between evil and good humans. In fact, he said this to you out of jealousy, to keep you from eating from it.”


    Eve now had confidence in the teacher’s words. She looked at the tree and recognized that it was beautiful and satisfying, and she desired it. She took some of its fruit and ate it. She also gave some to her husband, and he ate it as well. Then their minds were opened, because when they ate, the light of knowledge shone upon them. When they clothed themselves with embarrassment, they realized that they were naked without knowledge. When they became sober, they realized that they were naked, and they fell in love with each other. When they realized that those who had shaped them had the forms of beasts, they hated them. They had become acutely aware.'
translation:
  language: ko
  text: '이어서 말씀드리겠습니다. 아르콘들[a]은 그 남자와 그와 함께 살던 여성 존재가 짐승들처럼 영문도 모른 채 길을 잃고 헤매는 것을 보고 크게 기뻐했습니다.


    그러나 죽지 않는 인간이 자기들을 모른 체하지 않으리라는 것을 알게 되자, 그들은 불안해졌습니다. 오히려 나무로 변한 그 여성 존재를 두려워해야 했기 때문입니다. 그들은 말했습니다. “어쩌면 이 존재가 참된 인간인지도 모른다. 이 존재는 우리 위에 안개를 드리웠고, 더럽혀진 여성이 그를 닮았다고 우리에게 가르쳤다. 그러면 우리는 패배할 것이다.”


    그때 그 일곱은 함께 계략을 꾸몄습니다. 그들은 불안한 마음으로 아담과 하와에게 다가가 그에게 말했습니다. “낙원에서 너희를 위하여 창조된 모든 나무의 열매는 먹어도 된다. 그러나 지식의 나무에 대해서는 자제하여 그 열매를 먹지 말아라. 먹으면 죽을 것이다.” 그들은 두 사람의 마음속에 깊은 불안을 일으킨 뒤 자기들의 권세자들에게로 물러갔습니다.


    그때 모든 피조물 가운데 가장 영리하며 ‘짐승’이라고 불리는 자가 다가왔습니다. 그는 그들의 어머니 하와의 모습을 보고 하와에게 말했습니다. “하나님께서 너희에게 무엇이라고 말씀하셨느냐? ‘지식의 나무 열매를 먹지 말아라’라고 하셨느냐?”


    하와가 말했습니다. “그분은 ‘그 열매를 먹지 말아라’라고 하셨을 뿐 아니라, ‘그것에 손을 대지도 말아라. 그러면 너희가 죽을 것이다’라고도 하셨습니다.”


    그가 하와에게 말했습니다. “두려워하지 말아라. 너희는 죽음으로는 결코 죽지 않을 것이다. 너희가 그 열매를 먹으면[b] 너희의 이성이 맑아지고, 신들과 같이 되어 악한 인간들과 선한 인간들의 차이를 알게 되리라는 것을 그가 알고 있기 때문이다. 사실 그가 너희에게 그렇게 말한 것은 질투심에서, 너희가 그 열매를 먹지 못하게 하려는 것이었다.”


    이제 하와는 그 교사의 말을 신뢰하게 되었습니다. 하와는 그 나무를 바라보고 그것이 아름답고 만족스러운 줄을 알았으며, 그것을 원했습니다. 하와는 그 열매를 조금 따서 먹고 자기 남편에게도 주었으며, 남편도 먹었습니다. 그러자 두 사람의 정신이 열렸습니다. 그들이 먹었을 때 지식의 빛이 그들 위에 비쳤기 때문입니다. 그들이 수치심을 옷처럼 걸쳤을 때, 자신들이 지식 없이 벌거벗었다는 것을 깨달았습니다. 그들이 정신을 차렸을 때, 자신들이 벌거벗었다는 것을 깨닫고 서로 사랑하게 되었습니다. 또한 자기들을 빚어 만든 자들이 짐승의 모습을 하고 있다는 것을 깨닫자 그들을 미워했습니다. 두 사람은 매우 또렷이 깨닫게 되었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아르콘’은 ‘통치자’ 또는 ‘권세자’를 뜻하며, 이 문헌에서는 세상을 지배하는 특정 세력들을 가리키는 전문 용어로 쓰입니다.
    reason: 음역된 전문 용어를 일반 독자에게 설명합니다.
  - marker: b
    text: 현존 본문에는 이 대목에 빠졌거나 복원이 불확실한 부분이 있습니다.
    reason: 제공된 증거 본문의 빈 대괄호가 나타내는 사본상의 공백 또는 불확실성을 알립니다.
lexical_decisions:
- source_word: archons
  choice: 아르콘들
  rationale: 이 문헌의 우주론에서 특정 지배 세력들을 가리키는 전문 용어이므로 일반어인 ‘통치자들’로 완전히 치환하지 않고 음역하여 문헌적 성격을 보존했습니다.
- source_word: deathless man
  choice: 죽지 않는 인간
  rationale: ‘불멸자’처럼 추상적 명칭으로 바꾸지 않고, 죽음이 없다는 원문의 묘사를 직접 살렸습니다.
- source_word: Beast
  choice: ‘짐승’이라고 불리는 자
  rationale: 고유한 호칭처럼 쓰인 점을 따옴표로 나타내면서도 한국어 독자가 자연스럽게 이해하도록 했습니다.
- source_word: reasoning will grow sober
  choice: 이성이 깨어나고
  rationale: 술 취함에서 깨어나는 비유와 인식 능력의 회복을 함께 전달하는 자연스러운 표현을 택했습니다.
- source_word: clothed themselves with embarrassment
  choice: 수치심을 옷처럼 걸쳤을 때
  rationale: 수치심과 옷 입기의 결합이라는 낯선 원문 이미지를 평탄화하지 않고 비유로 보존했습니다.
- source_word: shaped them
  choice: 자기들을 빚어 만든
  rationale: 창조 일반보다 형상을 빚는 행위를 강조하는 표현을 유지했습니다.
theological_decisions:
- issue: ‘God’와 아르콘 집단의 관계
  choice: 본문의 ‘God’를 그대로 ‘하나님’으로 옮기되, 그 정체를 본문 밖의 교리로 규정하지 않았습니다.
  alternative: ‘신’ 또는 특정 아르콘의 이름으로 해석하여 번역할 수 있습니다.
  rationale: 이 대목 자체가 지시 대상의 정체를 명시적으로 해설하지 않으므로 문헌의 긴장과 모호성을 유지했습니다.
- issue: ‘real man’의 의미
  choice: ‘참된 인간’
  alternative: ‘진짜 사람’ 또는 ‘원형적 인간’
  rationale: 일상적 의미와 우주론적·원형적 의미가 모두 가능하므로, 특정 체계적 해석을 강제하는 ‘원형적’은 피했습니다.
- issue: 선악 인식의 목적어
  choice: ‘악한 인간들과 선한 인간들의 차이’
  alternative: ‘선과 악의 차이’
  rationale: 제공된 증거 본문에 humans가 명시되어 있어, 익숙한 창세기 표현으로 고쳐 쓰지 않고 인간들을 가리키는 낯선 문구를 보존했습니다.
- issue: ‘their mother Eve’의 대명사 범위
  choice: ‘그들의 어머니 하와’
  alternative: ‘그의 어머니 하와’ 또는 ‘우리의 어머니 하와’
  rationale: ‘그들’이 정확히 누구를 포함하는지 본문만으로 확정하지 않고 복수 대명사의 모호성을 유지했습니다.
- issue: ‘fell in love with each other’
  choice: ‘서로 사랑하게 되었습니다’
  alternative: ‘서로 욕정을 품게 되었습니다’
  rationale: 제공된 증거는 사랑의 성격을 한정하지 않으므로 성적 욕망으로 좁혀 번역하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 격조를 유지하되 과도한 고어와 교회 전문어를 피했습니다. 직접 인용에서는 인물 관계와 고대 서사의 분위기에 맞추어 해라체를 사용했습니다. 고대 콥트어 원문에 대한 직접 검토가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증거문과 감사용 영어 POB를 대조한 잠정 출판 초안입니다.
