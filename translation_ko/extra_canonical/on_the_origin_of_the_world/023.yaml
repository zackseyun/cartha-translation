  revised_text: '그리하여 소피아 조에는 어둠의 아르콘들이 자기 동료들에게 저주를 내리는 것을 보고 격분했습니다. 그녀는 온전한 권능을 지니고 첫째 하늘에서 나와 그 아르콘들을 뒤쫓아 [그들의] 하늘들에서 몰아낸 뒤, 범법의 세계로 내던졌습니다. 그리하여 그들이 땅에서 사악한 귀신의 모습으로 살게 했습니다.


