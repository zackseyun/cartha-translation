base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/023.yaml
  text: 'So, when Sophia Zoe saw the archons of darkness placing a curse on her companions, she became furious. Leaving the first heaven with full power, she pursued those archons, drove them out of [their] heavens, and threw them down into the world of transgression, making them dwell there as wicked demons on the earth.


    [She sent out a bird], [] which would spend its thousand years in Paradise in their world—a living creature endowed with soul, called the “phoenix.” It kills itself and comes back to life in order to bear witness to the judgment (decreed) against them, because they mistreated Adam and his race, even to the consummation of the age.


    There are three kinds of men, along with their descendants, until the consummation of the world: those endowed with spirit, those endowed with soul, and the earthly. Similarly, there are three phoenixes <inside> Paradise: the first is deathless, and the second lives for 1,000 years. Concerning the third, it is written in the sacred Scripture that it is consumed. Similarly, there are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, so also does the water hydri in Egypt symbolize those who descend into the baptism of a true man.


    The two bulls in Egypt have a symbolic meaning, [14] namely, the sun and the moon. This is a symbol of Sabaoth, because Sophia obtained the universe from the day she fashioned the sun and the moon, placing a seal on her heaven until the age ends.


    The worm born from the phoenix also symbolizes a human being, concerning whom it is written, “The just man will blossom like a phoenix,” [15] and the phoenix first appears alive, then dies and rises again, serving as a symbol of what will happen at the consummation of the age.


    These powerful symbols appeared only in Egypt and nowhere else, to indicate [] that it resembles the Paradise of God.'
translation:
  language: ko
  text: '그리하여 소피아 조에는 어둠의 아르콘들이 자기 동료들에게 저주를 내리는 것을 보고 격분했습니다. 그는 온전한 권능을 지니고 첫째 하늘에서 나와 그 아르콘들을 뒤쫓아 [그들의] 하늘들에서 몰아낸 뒤, 범법의 세계로 내던졌습니다. 그리하여 그들이 땅에서 사악한 귀신의 모습으로 살게 했습니다.


    [그는 새 한 마리를 보냈습니다.] [본문 결락][a] 그 새는 그들의 세계에 있는 낙원에서 천 년을 보내게 될, 혼을 지닌 생물로서 ‘피닉스’라 불립니다. 그것은 스스로 목숨을 끊었다가 다시 살아납니다. 아담과 그의 자손을 학대한 그들에게 내려진 심판을 시대의 종말까지 증언하기 위해서입니다.


    세상 끝날까지 사람은 그 자손들과 더불어 세 부류로 나뉩니다. 곧 영을 지닌 사람들, 혼을 지닌 사람들, 땅에 속한 사람들입니다. 이와 마찬가지로 낙원 <안에는> 세 피닉스가 있습니다. 첫째는 죽지 않고, 둘째는 천 년을 삽니다. 셋째에 관해서는 거룩한 성경에 그것이 불살라진다고 기록되어 있습니다. 마찬가지로 세례도 셋입니다. 첫째는 영적인 세례이고, 둘째는 불로 베푸는 세례이며, 셋째는 물로 베푸는 세례입니다.


    피닉스가 천사들을 상징하는 것과 꼭 마찬가지로, 이집트의 ‘물 히드리’[b]는 참된 사람의 세례 속으로 내려가는 이들을 상징합니다.


    이집트의 두 황소에도 상징적 의미가 있으니,[c] 곧 해와 달입니다. 이것은 사바오트의 상징입니다. 소피아가 해와 달을 빚은 날부터 자기 하늘에 인을 치고, 시대가 끝날 때까지 우주를 얻었기 때문입니다.


    피닉스에게서 태어나는 벌레도 사람을 상징합니다. 이에 관해 “의인은 피닉스처럼 꽃필 것이다”라고 기록되어 있습니다.[d] 피닉스는 처음에는 살아 있는 모습으로 나타났다가 죽고 다시 살아나므로, 시대의 종말에 일어날 일을 상징합니다.


    이 강력한 상징들은 다른 어느 곳도 아닌 이집트에만 나타났습니다. 이는 [본문 결락][e] 이집트가 하나님의 낙원과 닮았음을 가리키기 위한 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호는 증거 본문에 결락 또는 편집상 보충이 있음을 나타냅니다. ‘그는 새 한 마리를 보냈습니다’도 복원된 문구입니다.
    reason: 손상된 전승 상태와 번역자가 보충한 부분을 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘물 히드리’가 가리키는 대상은 현재의 증거 본문만으로 확정하기 어렵기에 음역했습니다.
    reason: 불확실한 고대 명칭을 자의적으로 해석하지 않기 위해서입니다.
  - marker: c
    text: 증거 본문의 각주 번호 [14]가 붙은 지점입니다. 현 자료에는 그 각주의 내용이 제공되지 않았습니다.
    reason: 제공된 영문 증거의 주석 흔적을 유실하지 않기 위해서입니다.
  - marker: d
    text: 증거 본문은 “의인은 피닉스처럼 꽃필 것이다”라고 인용합니다. 이는 시편 92:12의 ‘종려나무’를 뜻하는 말과 ‘피닉스’ 사이의 언어적 연관 또는 언어유희를 반영할 수 있습니다. 증거 본문의 각주 번호는 [15]입니다.
    reason: 인용문의 형태가 일반적인 성경 번역과 다른 까닭을 설명하되, 직접 원문 검토 전에는 단정하지 않기 위해서입니다.
  - marker: e
    text: 이 자리에는 증거 본문이 표시한 결락이 있습니다.
    reason: 문장 사이에 원래 내용이 빠졌을 가능성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: Sophia Zoe
  choice: 소피아 조에
  rationale: 고유한 인물명을 번역어로 풀어 신학적 동일시를 강요하지 않고 음역했습니다.
- source_word: archons
  choice: 아르콘들
  rationale: 문헌의 전문 용어와 우주론적 함의를 보존하기 위해 음역하고, 문맥상 ‘어둠의 아르콘들’로 제시했습니다.
- source_word: plenary power
  choice: 온전한 권능
  rationale: 권한의 충만함을 나타내되 지나치게 행정적인 표현을 피했습니다.
- source_word: world of transgression
  choice: 범법의 세계
  rationale: 도덕적·우주론적 의미를 모두 열어 두는 직역에 가까운 표현입니다.
- source_word: imbued with spirit / soul / earthly
  choice: 영을 지닌 / 혼을 지닌 / 땅에 속한
  rationale: 세 부류의 병렬 구조와 영·혼·땅의 구별을 해석으로 평준화하지 않았습니다.
- source_word: phoenix
  choice: 피닉스
  rationale: 불사조라는 해석적 번역보다 원문의 상징과 뒤따르는 언어유희를 보존하는 음역을 택했습니다.
- source_word: water hydri
  choice: 물 히드리
  rationale: 지시 대상과 원형이 불확실하므로 추측하여 특정 동식물이나 의례 기물로 번역하지 않았습니다.
- source_word: true man
  choice: 참된 사람
  rationale: 특정 교리적 인간론으로 확정하지 않고 원문의 긴장과 모호성을 유지했습니다.
- source_word: consummation of the age/world
  choice: 시대의 종말 / 세상 끝날
  rationale: 각 문맥의 ‘age’와 ‘world’ 구별을 가능한 한 반영하면서 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 사람의 세 부류
  choice: ‘영을 지닌 사람들, 혼을 지닌 사람들, 땅에 속한 사람들’이라는 구분을 그대로 보존했습니다.
  alternative: 영적인 사람, 정신적인 사람, 육적인 사람 등으로 교리화하여 번역할 수 있습니다.
  rationale: 본문 자체의 인간 분류를 특정 종파의 체계나 바울 서신의 용어와 성급히 동일시하지 않기 위해서입니다.
- issue: 피닉스의 죽음과 부활
  choice: 본문이 제시하는 자살·재생 및 종말론적 상징을 그대로 진술했습니다.
  alternative: 그리스도의 죽음과 부활에 대한 직접적인 예표로 명시할 수 있습니다.
  rationale: 본문은 종말에 일어날 일의 상징이라고만 하므로 특정 대상을 보충하지 않았습니다.
- issue: 사바오트와 해·달의 상징 관계
  choice: 대명사의 지시가 완전히 명확하지 않은 상태를 유지하며 ‘이것은 사바오트의 상징입니다’로 옮겼습니다.
  alternative: 두 황소 또는 해와 달 가운데 하나를 명시적으로 사바오트와 동일시할 수 있습니다.
  rationale: 영어 증거 본문 자체의 통사적 모호성을 임의로 해소하지 않기 위해서입니다.
- issue: 소피아가 우주를 ‘얻음’
  choice: 난해하더라도 ‘우주를 얻었기 때문’으로 보존했습니다.
  alternative: 우주를 다스렸다거나 소유했다고 해석하여 매끄럽게 만들 수 있습니다.
  rationale: 직접 콥트어 대조가 이루어지지 않은 상황에서 획득·소유·지배 가운데 하나로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 우주론의 전문 명칭은 필요한 경우 음역했으며, 문장은 일반 독자가 따라갈 수 있도록 다듬되 반복과 병렬 구조를 보존했습니다. 이 초안은 제공된 공공 영역 영어 증거에 근거한 잠정 번역이며, 콥트어 원문 직접 검토가 아직 이루어지지 않았으므로 결락, ‘물 히드리’, 소피아의 우주 획득, 일부 대명사 지시 관계는 확정하지 않았습니다.
