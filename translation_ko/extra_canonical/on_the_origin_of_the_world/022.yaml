  source_fidelity: 제시된 영어 증언을 기준으로 전체 흐름, 결락 표지, 핵심 용어 및 모호한 지시 대상은 대체로 충실히 보존했습니다. 다만 ‘When he had seen them, he assigned names to their creatures’는 아담이 이름을 붙인 대상이 ‘그들이 만든 피조물’인 것처럼 옮겨져, 증언의 어색하지만 비확정적인 표현에 창조 주체를 보탰습니다. 또한 ‘their lifespans’은 지시 대상이 불확정적인데, 본문상 ‘그들의 수명’은 바로 앞의 집정자들을 자연스럽게 가리키게 하므로 모호성을 충분히 보존하지 못합니다. ‘recovered from every test’도 ‘이겨 내자’보다 ‘모든 시험에서 회복되자’가 증언의 표현을 더 직접적으로 반영합니다. 직접 콥트어 대조가 보류된 상태이므로 이러한 판단은 제공된 영어 증언에 한정됩니다.
  naturalness: 합쇼체와 문단 구성은 전반적으로 자연스럽고 장중합니다. ‘지식의 나무 때와 같이’는 현대 한국어로 다소 부자연스러워 ‘지식의 나무의 경우처럼’으로 다듬는 것이 좋습니다. ‘그들이 만든 피조물들’은 자연스럽지만 원문에 없는 해석을 수반하므로, 자연스러움을 조금 양보하여 ‘그 피조물들에게’로 처리하는 편이 안전합니다.
  terminology: ‘집정자들’, ‘권세자들’, ‘스승’, ‘죽지 않는’, ‘케루빈’, ‘시대의 완성’은 제공된 증언의 구별과 문헌 특유의 표현을 대체로 잘 살립니다. ‘케루빈’은 고유 명칭으로 유지하고, 관련성만 언급하는 주석은 본문을 창세기 전승과 동일시하지 않아 적절합니다.
  issues:
  - severity: medium
    issue: 동물 명명 구절에 ‘그들이 만든’이 첨가됨
    rationale: 증언은 ‘he assigned names to their creatures’라고 할 뿐, 그 피조물의 창조 주체를 이 문장에서 명시하지 않습니다. ‘그들이 만든 피조물들’은 집정자들이 창조자라는 해석을 문장에 추가합니다.
  - severity: medium
    issue: 수명의 소유자를 본문 문법상 집정자들로 좁힘
    rationale: ‘their lifespans’의 복수 소유격은 제공된 증언에서 지시 대상이 분명하지 않습니다. ‘집정자들은 … 그들의 수명’은 한국어 문맥에서 집정자들의 수명으로 읽히므로, ‘수명을 줄이려’로 두고 주석에서 모호성을 밝혀야 합니다.
  - severity: low
    issue: ‘recovered from every test’의 의미가 ‘이겨 내다’로 강화됨
    rationale: ‘회복되다’라는 증언의 표현은 시험을 극복했다는 뜻으로 단정되지 않습니다. ‘모든 시험에서 회복되자’가 더 안전합니다.
  - severity: low
    issue: ‘지식의 나무 때와 같이’가 비문에 가까움
    rationale: ‘as is the case with the tree of knowledge’를 ‘지식의 나무의 경우처럼’으로 옮기면 의미와 현대적 자연스러움을 함께 확보합니다.
  revised_text: '집정자들은 (아담과 하와가) 자기들에게 내린 명령을 어겼다는 것을 깨닫자, 그들이 받은 도움의 결과가 어떠한지 보려고 지진과 큰 위협을 일으키며 낙원으로 들어와 아담과 하와에게 다가갔습니다. 그러자 아담과 하와는 심하게 떨며 낙원의 나무들 아래에 숨었습니다. 집정자들은 그들이 어디 있는지 알지 못하여 말했습니다. “아담아, 네가 어디 있느냐?”


    아담이 말했습니다. “제가 여기 있습니다. 당신들이 두려워 숨었습니다. 부끄러웠기 때문입니다.” 그러자 그들은 무지한 채 그에게 말했습니다. “네가 그 나무의 열매를 먹지 않았다면, 네가 몸에 두른 이 부끄러움을 누가 네게 알려 주었느냐?”


    아담이 말했습니다. “당신들이 제게 주신 여자, 바로 그 여자가 제게 주어서 제가 먹었습니다.”


    그러자 그들은 그 여자에게 [본문 결락] 말했습니다. “네가 무슨 일을 한 것이냐?”[a]


    여자가 대답했습니다. “스승이 저를 부추겨서 제가 먹었습니다.”


    그때 집정자들이 스승에게 다가갔습니다. 그로 말미암아 그들의 눈이 흐려져서 그에게 아무 일도 할 수 없었습니다. 그들은 무력했으므로 그를 저주했습니다.


    그 뒤에 그들은 여자에게 다가가 그 여자와 그 후손들을 저주했습니다.


    여자 다음으로 그들은 아담을 저주했고, 아담 때문에 땅과 농작물도 저주했습니다. 그들은 자기들이 창조한 모든 것을 저주했습니다. 그들에게는 복이 없습니다. 선은 악에서 나올 수 없습니다.


    그날부터 권세자들은 자기들보다 더 강한 무언가가 있다는 것을 참으로 깨달았습니다.


    그들은 자기들의 명령이 지켜지지 않았다는 것만 알았습니다. 오직 죽지 않는 인간 때문에 엄청난 질투가 세상에 들어왔습니다.


    집정자들은 자기들의 아담이 다른 종류의 지식을 얻었다는 것을 깨닫자 그를 시험하려 했습니다. 그들은 온갖 길짐승과 땅의 들짐승과 하늘의 새를 한데 모아 아담 앞으로 데려왔습니다. 아담이 그것들을 무엇이라고 부를지 알아보기 위해서였습니다. 아담은 그것들을 보고 그 피조물들에게 이름을 붙였습니다.


    아담이 모든 시험에서 회복되자 그들은 불안해졌습니다. 그들은 함께 모여 계략을 꾸미며 말했습니다. “보라, 아담을! 그가 빛과 어둠의 차이를 아니 우리 가운데 하나처럼 되었다. 이제 그가 지식의 나무의 경우처럼 속임에 넘어가 생명나무에까지 다가가 그 열매를 먹고, 죽지 않게 되어 주인이 될지도 모른다. 그러면 그는 우리와 우리의 모든 영광을 몹시 싫어하고 업신여길 것이다. 또 우리를 우리의 우주와 함께 정죄할 것이다. 자, 그를 낙원에서 [본문 결락] 그가 취해진 땅으로 쫓아내자. 그리하여 이제부터는 우리의 능력을 넘어서는 것은 아무것도 알지 못하게 하자.”[b] 이렇게 그들은 아담을 그의 아내와 함께 낙원에서 쫓아냈습니다. 그러나 그들이 저지른 이 일만으로는 충분하지 않았습니다. 오히려 그들은 두려워졌습니다.


    그들은 낙원으로 들어가 생명나무에 다가갔고, ‘케루빈’이라 불리는 불붙은 생물들, 곧 거대하고 무시무시한 존재들로 그 나무를 에워쌌습니다.[c] 또 그들 사이에 불타는 칼을 두어 무시무시하게 계속 빙빙 돌게 했습니다. 땅에 속한 어떤 존재도 결코 그곳에 들어가지 못하게 하려는 것이었습니다.


    집정자들은 아담을 질투했기 때문에 수명을 줄이려 했습니다.[d] 그러나 처음부터 정해진 운명 때문에 그렇게 할 수 없었습니다. 빛나는 천체들의 운행에 따라 각자에게 천 년의 수명이 정해져 있었기 때문입니다. 그렇지만 집정자들이 이 일을 이룰 수 없었는데도 악을 행한 자들이 저마다 십 년씩 빼앗아, 온전한 수명은 구백삼십 년이 되었습니다. 이 세월은 고통과 쇠약과 악의에 찬 혼란 속에서 흘러갑니다. 그날부터 시대의 완성에 이르기까지 삶은 이와 같았습니다.'
  revised_footnotes:
  - marker: a
    text: 이 지점에는 전승된 본문에 결락이 있습니다.
    reason: 제시된 증언의 대괄호 공백을 독자에게 명확히 알리기 위해서입니다.
  - marker: b
    text: ‘낙원에서’ 다음에는 전승된 본문에 결락이 있습니다.
    reason: 문장 중간의 자료상 공백을 보존하기 위해서입니다.
  - marker: c
    text: ‘케루빈’은 제시된 증언의 Cherubin을 음역한 이름입니다. 창세기 전승의 ‘그룹들’과 관련된 표현으로 보이지만, 여기서는 자료의 형태를 보존했습니다.
    reason: 낯선 고유 명칭을 설명하면서도 성급한 정규화를 피하기 위해서입니다.
  - marker: d
    text: ‘수명’의 정확한 소유자 또는 대상은 제시된 증언의 복수 소유격 때문에 문맥상 모호합니다.
    reason: 복수 소유격의 지시 대상을 번역에서 임의로 확정하지 않기 위해서입니다.
  revision_rationale: 제시된 영어 증언을 우선 기준으로 삼아, 창조 주체의 불필요한 보충을 제거하고 수명의 지시 대상이 불확정적이라는 점을 본문과 주석에서 보존했습니다. 또한 ‘회복되다’와 지식의 나무 비교 표현을 증언에 더 가깝고 자연스러운 한국어로 조정했습니다. 결락 표지와 기존 주석 앵커는 모두 유지했습니다.
