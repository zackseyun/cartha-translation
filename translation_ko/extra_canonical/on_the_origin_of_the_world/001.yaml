translation:
  language: ko
  text: '[] 우주의 신들과 인간들을 막론하고 모두가 카오스 이전에는 아무것도 존재하지 않았다고 말합니다. 그러나 나는 그들과 달리 그들 모두가 잘못되었음을 입증하겠습니다. 그들은 카오스의 기원뿐 아니라 그 뿌리도 알지 못하기 때문입니다. 그 증거는 다음과 같습니다.


    카오스에 관하여 말하자면, 모든 사람은 그것이 일종의 어둠이라고 주장하기를 [] 좋아합니다. 그러나 실제로 카오스는 ‘어둠’이라는 이름으로 불리는 그림자에서 생겨났고, 그 그림자는 처음부터 존재해 온 한 피조물에서 생겨났습니다. 더구나 그 피조물은 카오스가 생겨나기 전에 분명히 존재했으며, 카오스는 그 앞선 피조물 뒤에 생겨났습니다.


    그러므로 이제 우리는 이 일의 실상과 더불어, 카오스가 그로부터 밀려 나온 최초의 피조물을 살펴봅시다. 그러면 진리가 분명히 입증될 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Chaos
  choice: 카오스
  rationale: 고대 우주론의 특정 원초적 실재를 가리키는 명칭이므로 일반어인 ‘혼돈’으로 의미를 좁히지 않고 음역했습니다.
- source_word: cosmic gods
  choice: 우주의 신들
  rationale: 우주 영역에 속한 신적 존재들이라는 표현을 자연스럽게 보존했습니다.
- source_word: root
  choice: 뿌리
  rationale: 기원과 나란히 쓰인 은유를 유지하여 원문의 개념적 긴장을 보존했습니다.
- source_word: created entity
  choice: 피조물
  rationale: 창조되어 존재하는 실재라는 뜻을 간결하고 품위 있게 전달하되, 그 정체를 특정하지 않았습니다.
- source_word: was propelled
  choice: 밀려 나온
  rationale: 단순한 발생보다 강한 운동성을 지닌 수동 표현을 보존했습니다.
theological_decisions:
- issue: 카오스 이전 존재의 성격
  choice: ‘한 피조물’과 ‘최초의 피조물’로 번역하여 창조된 실재라는 진술을 유지했습니다.
  alternative: ‘창조된 존재’ 또는 ‘첫 창조물’
  rationale: 이 존재의 인격성이나 정확한 위상을 본문 이상으로 규정하지 않았습니다.
- issue: ‘어둠’과 그림자의 관계
  choice: 카오스가 ‘어둠’이라는 이름의 그림자에서 생겨났다고 번역했습니다.
  alternative: 카오스 자체를 곧 어둠으로 동일시하는 번역
  rationale: 본문은 통념과 달리 카오스, 그림자, 선행 피조물을 구별하므로 그 구별을 보존했습니다.
- issue: 입증을 말하는 화자의 태도
  choice: ‘입증하겠습니다’와 ‘살펴봅시다’를 사용했습니다.
  alternative: 더 권위적인 선언형 또는 논쟁적인 표현
  rationale: 논증적 어조를 유지하면서 현대 한국어의 정중하고 자연스러운 합쇼체로 옮겼습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 논증적이고 장중한 도입부의 어조를 유지하되 일반 독자가 이해할 수 있도록 문장을 나누었습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언을 잠정적 근거로 삼았습니다. 원문의 대괄호는 사본 훼손 또는 복원 표지일 가능성을 존중하여 그대로 보존했습니다.
