base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: ko
  text: '그때 권세자들은 자기들이 빚어 만든 형상이 살아나 일어섰다는 보고를 받고 크게 동요했습니다. 그들은 무슨 일이 일어났는지 알아보려고 일곱 대천사를 보냈습니다.


    그들이 아담에게 다가갔습니다. 그들은 하와가 아담과 이야기하는 것을 보고 서로 말했습니다. “이 빛나는 여자는 도대체 어떤 존재인가? 빛 속에서 우리에게 나타났던 그 형상과 닮았다. 자, 이 여자를 붙잡아 우리 씨를 그 여자 안에 쏟아 넣자. 그러면 그 여자가 더럽혀져 자기 빛으로 올라가지 못할 것이며, 그 여자가 낳는 자들은 도리어 우리의 지배 아래 있게 될 것이다. 그러나 아담에게는 알리지 말자. 그는 우리 가운데 하나가 아니기 때문이다. 그 대신 그를 깊이 잠들게 하고, 그가 잠든 동안 이 여자가 그의 갈비뼈에서 생겨났다고 가르치자. 그러면 그의 아내가 그에게 순종하고, 그가 아내를 다스리는 주인이 될 것이다.”


    그러나 하와는 하나의 힘이었으므로 그들의 결정을 비웃었습니다. 하와는 그들의 눈에 안개가 끼게 하고, 남몰래 자기 형상을 아담 곁에 남겨 두었습니다.


    하와는 지식의 나무 안으로 들어가 거기에 머물렀습니다. 그들이 하와를 뒤쫓자, 하와는 자신이 그 나무 안으로 들어가 나무가 되었음을 그들에게 드러냈습니다. 그러자 눈먼 존재들은 크게 두려워하며 달아났습니다.


    그 뒤 그들은 혼미한 상태에서 벗어나 아담에게 다가갔습니다. 그들은 이 여자의 형상 [a]이 아담과 함께 있는 것을 보고 그것이 진짜 하와라고 여겨 크게 동요했으며, 충동적으로 행동했습니다. 그들은 그 여자에게 다가가 붙잡고 자기들의 씨를 그 여자 위에 쏟았습니다.


    그들은 악의를 품고 이 일을 저질렀으며, 자연적인 방식과 음란한 방식으로 그 여자를 더럽혔습니다. 먼저 그들은 자기들과 이야기하며 “너희보다 먼저 존재한 것은 무엇이냐?”라고 말했던 그 여자의 목소리의 봉인을 더럽혔습니다.[b] 이렇게 함으로써 그들은 시대가 완성될 때, 말로 자신들이 참사람에게서 태어났다고 선언할 이들을 더럽히려 했습니다. 그러나 그들은 자기들이 더럽힌 것이 바로 자기들의 몸이었다는 사실을 알지 못한 채 길을 잃었습니다. 권세자들과 그 천사들이 온갖 방식으로 더럽힌 것은 그 형상이었기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승 본문에는 이 지점에 결락 또는 복원이 필요한 부분을 나타내는 빈 표시가 있습니다.
    reason: 제공된 증거 본문의 빈 대괄호를 독자에게 의미 있는 본문비평 정보로 보존하기 위해서입니다.
  - marker: b
    text: ‘목소리의 봉인’은 본문의 상징적 표현입니다. 정확히 무엇을 가리키는지는 분명하지 않습니다.
    reason: 난해한 표현을 본문에서 임의로 해석하지 않고 그 불확실성을 알리기 위해서입니다.
lexical_decisions:
- source_word: authorities
  choice: 권세자들
  rationale: 이 문헌의 우주론적 통치 세력을 가리키는 기술적 성격을 살리면서도 현대 한국어 독자가 이해할 수 있는 표현입니다.
- source_word: shaped form / likeness
  choice: 빚어 만든 형상 / 형상
  rationale: ‘form’과 ‘likeness’의 연관성을 유지하되, 첫 표현에서는 그들이 만들었다는 행위를 분명히 드러냈습니다.
- source_word: force
  choice: 힘
  rationale: 하와가 단순히 강하다는 뜻으로 풀지 않고, 존재론적 실재 또는 능력을 가리킬 수 있는 원문의 긴장을 보존했습니다.
- source_word: seed
  choice: 씨
  rationale: 성적 의미와 후손·생식의 의미가 함께 작용하므로 완곡하게 바꾸지 않고 중의성을 보존했습니다.
- source_word: tree of knowledge
  choice: 지식의 나무
  rationale: 창세기 전승을 연상시키면서도 본문에 없는 ‘선악’을 덧붙이지 않았습니다.
- source_word: seal of her voice
  choice: 그 여자의 목소리의 봉인
  rationale: 난해한 상징 표현을 해석하여 평준화하지 않고 그대로 보존했습니다.
- source_word: true man
  choice: 참사람
  rationale: 보통명사적 인간과 원형적·구원론적 인물을 모두 가리킬 가능성을 열어 두고, 특정 교리의 고유명사로 확정하지 않았습니다.
- source_word: consummation (of the age)
  choice: 시대가 완성될 때
  rationale: 종말론적 함의를 유지하면서 괄호에 의존하지 않는 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 하와의 기원에 관한 권세자들의 주장
  choice: 권세자들이 잠든 아담에게 가르치려 한 기만적 설명으로 명시
  alternative: 본문 서술자의 사실 진술처럼 번역
  rationale: 문맥상 갈비뼈 기원은 권세자들의 계략 속 발언이므로 그 화행을 그대로 보존했습니다.
- issue: 하와가 ‘힘’이라는 진술
  choice: ‘하나의 힘’으로 직역에 가깝게 유지
  alternative: ‘강한 존재’ 또는 ‘신적 능력’
  rationale: 하와의 존재론적 지위를 특정 체계로 단정하지 않고 원문의 모호성을 유지했습니다.
- issue: ‘그들의 몸’의 지시 대상
  choice: ‘자기들의 몸’으로 번역하되 별도 해설로 확정하지 않음
  alternative: 아담의 물질적 몸 또는 권세자들이 만든 형상으로 명시
  rationale: 본문 자체가 이어지는 ‘형상’과 복잡하게 연결하므로 해석적 동일시를 강요하지 않았습니다.
- issue: 성폭력 묘사의 표현
  choice: 행위의 폭력성과 모욕을 감추지 않되 선정적으로 확대하지 않음
  alternative: 완곡어법으로 축소하거나 세부를 노골적으로 확장
  rationale: 본문의 윤리적·서사적 충격을 충실히 전달하면서 현대의 dignified register를 지켰습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 장중하되 과도하게 고어적이지 않게 했으며, 직접화법은 자연스럽고 위협적인 의도를 분명히 드러내도록 구성했습니다. 제공 자료가 콥트어 직접 대조 전의 영어 공개 번역 증언에 근거하므로, 의미가 불확실한 대목은 해석으로 메우지 않고 형상, 힘, 목소리의 봉인, 참사람 등의 표현을 보존했습니다.
