    그들이 아담에게 다가갔습니다. 그들은 하와가 아담과 이야기하는 것을 보고 서로 말했습니다. “이 빛나는 여자는 도대체 어떤 존재입니까? 빛 속에서 우리에게 나타났던 그 형상과 닮았습니다. 자, 이 여자를 붙잡아 우리 씨를 그 여자 안에 넣읍시다. 그러면 그 여자가 더럽혀져 자기 빛으로 올라가지 못할 것이며, 그 여자가 낳는 자들은 도리어 우리의 지배 아래 있게 될 것입니다. 그러나 아담에게는 알리지 맙시다. 그는 우리 가운데 하나가 아니기 때문입니다. 그 대신 그를 깊이 잠들게 하고, 그가 잠든 동안 이 여자가 그의 갈비뼈에서 생겨났다고 가르칩시다. 그러면 그의 아내가 그에게 순종하고, 그가 아내를 다스리는 주인이 될 것입니다.”


