base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/011.yaml
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  language: ko
  text: '양성적 존재인 에로스는 그 태초의 피에서 나타났습니다. 그의 남성적 요소는 히미레리스[a]인데, 이는 빛에서 나온 불입니다. 그와 함께 거하는 여성적 요소는 피로 이루어진 영혼이며, 프로노이아의 실체에서 비롯됩니다. 그는 빼어나게 아름답고, 카오스에 창조된 모든 존재를 뛰어넘는 매력을 지니고 있습니다.


    그때 모든 신과 그 천사들은 에로스를 바라보고 그를 사랑하게 되었습니다. 에로스는 그들 모두의 안에 자신을 드러내어 그들을 불타오르게 했습니다. 하나의 등불에서 여러 등불이 불을 받아도 동일한 하나의 빛이 그 모두에 있고 처음 등불은 줄어들지 않는 것처럼, 에로스도 카오스에 창조된 모든 존재 안에 자신을 퍼뜨렸으나 줄어들지 않았습니다. 에로스가 빛과 어둠의 한가운데에 나타난 것처럼, 또 에로스의 성적 결합이 천사들과 인류의 한가운데에서 이루어진 것처럼, 태초의 쾌락도 땅에서 피어났습니다. 대지 뒤에 여자가 따랐고, 여자 뒤에 혼인이 따랐으며, 혼인 뒤에 출생이, 출생 뒤에 쇠퇴가 따랐습니다.


    에로스 뒤에는 땅에 흘려진 그 피에서 포도나무가 돋아났습니다. 이 때문에 포도주를 마시는 이들에게 성적 결합을 향한 욕망이 생깁니다.


    포도나무 뒤에는 무화과나무와 석류나무가 땅에서 돋아났고, 그 밖의 온갖 나무도 모두 돋아났습니다. 각 종류는 권세자들과 그 천사들의 [] 씨에서 자기 씨를 받았습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘히미레리스’는 전승된 이름을 음역한 것입니다. 정확한 형태와 어원은 콥트어 원문 대조가 필요합니다.
    reason: 제공된 자료가 영어 공개 번역 증언에 기초하며 직접적인 콥트어 검토가 아직 이루어지지 않았기 때문입니다.
  - marker: b
    text: 원문 증언에는 ‘씨’ 앞에 판독할 수 없는 부분을 나타내는 빈 대괄호([])가 있습니다. 문장의 정확한 관계는 불확실합니다.
    reason: 사본의 결락 신호와 그로 인한 통사적 모호성을 숨기지 않고 보존하기 위해서입니다.
lexical_decisions:
- source_word: androgynous entity
  choice: 양성적 존재
  rationale: 남성과 여성의 요소를 함께 지닌 존재라는 문맥을 자연스럽게 전달하면서도 이를 현대의 특정 성 정체성 개념으로 한정하지 않았습니다.
- source_word: Eros
  choice: 에로스
  rationale: 고유한 신화적 존재를 가리키므로 음역했으며, 문맥상 사랑이나 욕망이라는 추상명사로 환원하지 않았습니다.
- source_word: Himireris
  choice: 히미레리스
  rationale: 의미가 확정되지 않은 고유명으로 보고 음역하여 불확실성을 보존했습니다.
- source_word: Pronoia
  choice: 프로노이아
  rationale: 이 문헌의 인격화되거나 실체화된 신화적 개념일 수 있으므로 ‘섭리’로 해석해 버리지 않고 음역했습니다.
- source_word: Chaos
  choice: 카오스
  rationale: 단순한 ‘혼돈’ 상태가 아니라 신화적 영역 또는 실재를 가리키는 용법을 살리기 위해 음역했습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 초월적 통치 존재들을 가리키는 문헌적 용례를 반영하되, 특정 영지주의 체계의 전문용어를 과도하게 덧씌우지 않았습니다.
- source_word: sexual union
  choice: 성적 결합
  rationale: 원문의 육체적·생식적 의미를 완곡하게 지우지 않으면서도 품위 있는 현대 한국어로 옮겼습니다.
- source_word: decline
  choice: 쇠퇴
  rationale: 출생 이후의 약화·소멸 과정을 넓게 열어 두고, ‘죽음’처럼 더 구체적인 의미로 단정하지 않았습니다.
theological_decisions:
- issue: 에로스의 남성적·여성적 구성 요소
  choice: 두 요소를 본문 진술 그대로 병렬적으로 제시했습니다.
  alternative: 이를 남녀 양성 또는 영혼과 육체에 관한 특정 교리로 해설할 수 있습니다.
  rationale: 본문의 신화적 인간론과 존재론을 특정 교파나 현대 범주의 체계로 해소하지 않기 위해서입니다.
- issue: 빛과 불 및 등불의 비유
  choice: 에로스가 여러 존재 안에 퍼져도 줄어들지 않는다는 역설을 그대로 보존했습니다.
  alternative: 에로스를 신적 발출이나 성령의 내주로 명시할 수 있습니다.
  rationale: 본문은 그런 동일시를 직접 밝히지 않으므로 독자가 느낄 수 있는 신학적 긴장을 유지했습니다.
- issue: ‘천사들과 인류의 한가운데’라는 불분명한 공간 표현
  choice: 한가운데라는 공간적 표현을 유지했습니다.
  alternative: ‘천사들과 인간들 사이에서’ 또는 ‘천사와 인류 가운데서’로 평탄화할 수 있습니다.
  rationale: 영어 증언 자체의 다소 모호한 구조를 임의로 관계적 또는 집단적 의미로 확정하지 않았습니다.
- issue: 대지-여자-혼인-출생-쇠퇴의 연쇄
  choice: 의인화 가능성이 있는 ‘대지’와 보통명사 ‘여자’를 구분하고 연쇄 구조를 반복해 살렸습니다.
  alternative: 모두 추상적 우주 발생 단계나 고유한 신적 존재로 명시할 수 있습니다.
  rationale: 본문이 고유명과 보통명사의 경계를 명확히 하지 않으므로 해석을 열어 두었습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 신화적 고유명은 음역하고, 반복과 연쇄가 중요한 대목은 문장 리듬을 살려 번역했습니다. 제공된 공개 영어 번역 증언을 우선 검토층으로 삼은 잠정 초안이며, 콥트어 원문 대조 뒤 고유명·통사·결락 부분을 재검토해야 합니다.
