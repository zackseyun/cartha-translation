base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: ko
  text: '태초의 프시케는 자기와 함께 살던 에로스를 사랑하여, 자기 피를 그와 땅 위에 쏟았습니다. 그 피에서 첫 장미가 땅을 뚫고 돋아났습니다. 장미는 가시덤불 속에서 나타날 빛에게 기쁨을 주는 근원으로서 그 덤불에서 피어났습니다.


    그 뒤에는 향기롭고 아름다운 꽃들이 저마다 다른 종류로 땅에서 돋아났습니다. 그 꽃들은 프로노이아의 처녀 딸들에게서 나왔습니다. 딸들은 저마다 에로스를 사랑하게 되자 자기 피를 그와 땅 위에 쏟았습니다.


    그 뒤에는 모든 풀이 저마다 다른 종류로 땅에서 돋아났으며, 그 안에 권세자들과 그들의 천사들의 씨를 지니고 있었습니다.


    그 뒤에는 권세자들이 물에서 기어 다니는 것들과 새들을 비롯하여 저마다 다른 종류의 동물을 만들었으며, 그 동물들은 그 안에 권세자들과 그들의 천사들의 씨를 지니고 있었습니다.


    그러나 이 모든 일에 앞서, 그가 첫날에 나타났을 때 그는 땅에 이틀가량 머물렀습니다. 그러고는 하늘에 있는 아래쪽 프로노이아를 떠나 자기 빛을 향해 올라갔습니다. 그러자 곧 어둠이 온 우주를 뒤덮었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 문단의 ‘그’가 누구를 가리키는지는 제공된 문헌 증거만으로 분명하지 않습니다. 또한 이 초안은 공개 영역 영어 번역 증언을 바탕으로 했으며, 콥트어 원문 대조는 아직 이루어지지 않았습니다.
    reason: 실질적인 대명사 모호성과 원문 검토 상태를 독자에게 알리기 위해 덧붙였습니다.
lexical_decisions:
- source_word: Psyche
  choice: 프시케
  rationale: 고유한 신화적 존재의 이름으로 보아 번역어 ‘영혼’으로 환원하지 않고 음역했습니다.
- source_word: Eros
  choice: 에로스
  rationale: 일반명사 ‘사랑’과 구별되는 인물명으로 보존하여 음역했습니다.
- source_word: Pronoia
  choice: 프로노이아
  rationale: 이 문헌의 고유한 신화적 존재 또는 원리를 가리키므로 ‘섭리’로 해석해 고정하지 않고 음역했습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 우주적 지배 세력을 가리키는 복수 명칭의 성격을 살리되 특정 교파의 전문 용어를 덧씌우지 않았습니다.
- source_word: cosmos
  choice: 온 우주
  rationale: 단순한 ‘세상’보다 우주 전체라는 범위를 자연스러운 현대 한국어로 나타냈습니다.
- source_word: plants
  choice: 풀
  rationale: 문맥상 땅에서 돋는 식물 전체를 포괄하면서도 앞의 꽃 및 뒤의 동물과 자연스럽게 구별되도록 옮겼습니다.
theological_decisions:
- issue: 마지막 문단의 남성 단수 대명사가 가리키는 대상
  choice: ‘그’로 두어 지시 대상을 확정하지 않음
  alternative: 앞 문맥의 에로스 등 특정 존재의 이름을 명시함
  rationale: 제공된 증거에서 선행사가 분명하지 않으므로 원문의 모호성을 보존했습니다.
- issue: ‘그들의 천사들의 씨’의 의미
  choice: 문자적이고 관계가 열린 표현을 유지함
  alternative: 권세자와 천사에게서 비롯된 생명력이나 본성을 뜻한다고 해석함
  rationale: ‘씨’가 혈통, 본질, 생식 능력 가운데 무엇을 뜻하는지 본문만으로 확정할 수 없습니다.
- issue: 가시덤불 속에서 나타날 ‘빛’의 정체
  choice: ‘빛’으로만 옮김
  alternative: 특정 구원자나 신적 존재로 명시함
  rationale: 본문이 정체를 직접 밝히지 않으므로 신학적으로 해소하지 않았습니다.
- issue: ‘아래쪽 프로노이아’의 공간적 관계
  choice: ‘하늘에 있는 아래쪽 프로노이아’
  alternative: ‘아래 하늘의 프로노이아’ 또는 ‘낮은 섭리’
  rationale: 제공된 영어 증거의 구문적 모호성을 최소한으로 정리하되, 프로노이아를 추상적 ‘섭리’로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 프시케, 에로스, 프로노이아는 신화적 고유 명칭으로 음역했고, 반복되는 창조 순서는 ‘그 뒤에는’으로 일관되게 살렸습니다. 원문 대조가 보류된 상태이므로 제공된 공개 영역 영어 증언과 감수용 영어 POB를 비판적으로 참조한 잠정 출판 초안입니다.
