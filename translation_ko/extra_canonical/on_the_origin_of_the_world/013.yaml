  revised_text: '원초의 프시케는 자기와 함께 살던 에로스를 사랑하여, 자기 피를 에로스 위와 땅 위에 쏟았습니다. 그 피에서 첫 장미가 땅으로부터 돋아났는데, 가시덤불에서 나와 그 덤불 안에서 나타날 빛을 기쁘게 할 근원이 되었습니다.


    그 뒤에는 향기롭고 아름다운 꽃들이 저마다 다른 종류로 땅에서 돋아났습니다. 그 꽃들은 프로노이아의 처녀 딸들 각각에게서 나왔습니다. 그 딸들은 에로스를 사랑하게 되자 자기 피를 에로스 위와 땅 위에 쏟았습니다.


    그 뒤에는 모든 식물이 저마다 다른 종류로 땅에서 돋아났으며, 그 안에 권세자들과 그들의 천사들의 씨를 지니고 있었습니다.


    그 뒤에는 권세자들이 물에서 기어 다니는 것들과 새들을 비롯하여 저마다 다른 종류의 동물을 만들었으며, 그 동물들은 그 안에 권세자들과 그들의 천사들의 씨를 지니고 있었습니다.


    그러나 이 모든 일에 앞서, 그가 첫날에 나타났을 때 그는 땅에 약 이틀 동안 머물렀습니다. 그러고는 하늘에 있는 아래쪽 프로노이아를 떠나 자기 빛을 향해 올라갔습니다. 곧 어둠이 온 우주를 뒤덮었습니다.[a]'
