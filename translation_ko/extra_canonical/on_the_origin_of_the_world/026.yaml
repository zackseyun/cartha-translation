  english_witness: 'The all-superior Logos was dispatched solely for this reason: that he could announce the unknown. He said, “Nothing that is hidden is not revealed, and what is unknown will be known,” and these were dispatched to make known what is hidden, even the seven authorities of Chaos as well as their impiety, and in this way they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: ko
  text: '모든 것을 뛰어넘는 로고스가 파견된 것은 오직 이 이유 때문이었습니다. 곧 알려지지 않은 것을 선포하기 위해서였습니다. 그가 말했습니다. “감추어진 것 가운데 드러나지 않을 것은 없고, 알려지지 않은 것은 알려질 것이다.” 그리고 이들은 감추어진 것, 곧 카오스의 일곱 권세와 그들의 불경함까지도 알리려고 파견되었습니다.[a] 이렇게 해서 그들은 사형 선고를 받았습니다.


    모든 완전한 이들이 아르콘들이 빚어 놓은 형상으로 나타나 비할 데 없는 진리를 드러냈을 때, 그들은 신들의 모든 지혜를 부끄럽게 만들었습니다. 신들에게 정해진 운명은 정죄임이 드러났고,[b] 그들의 군대는 시들어 버렸습니다. 그들의 지배권은 흩어졌고, 그들의 예지는 영광과 함께 아무것도 아닌 것이 되었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “이들”이 누구를 가리키는지는 전승 문구에서 분명하지 않습니다.
    reason: 복수 지시어의 진정한 모호성을 보존하기 위해서입니다.
  - marker: b
    text: 직역하면 “그들의 운명은 정죄인 것으로 드러났습니다”입니다. 여기서 “그들”의 지시 대상은 다소 불분명합니다.
    reason: 소유 대명사의 선행사와 ‘fate’ 및 ‘censure’의 결합이 불명확하다는 점을 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: Logos
  choice: 로고스
  rationale: 문헌의 우주론적·인격적 전문 개념을 ‘말씀’이나 ‘이성’ 가운데 하나로 한정하지 않고 음역하여 의미의 폭을 보존했습니다.
- source_word: Chaos
  choice: 카오스
  rationale: 일반적인 ‘혼돈’ 상태가 아니라 권세들과 연결된 우주론적 영역 또는 실재를 가리킬 수 있으므로 고유 개념처럼 음역했습니다.
- source_word: authorities
  choice: 권세
  rationale: 단순한 행정 권한보다 인격화된 우주적 세력이라는 문맥을 살렸습니다.
- source_word: archons
  choice: 아르콘들
  rationale: 이 문헌군의 특정 우주적 지배자들을 가리키는 전문 용어이므로 ‘통치자들’로 평준화하지 않고 음역했습니다.
- source_word: perfect ones
  choice: 완전한 이들
  rationale: 영적 집단을 가리키는 문헌의 표현을 해석적으로 확대하지 않고 직접적으로 옮겼습니다.
- source_word: forethought
  choice: 예지
  rationale: 미리 생각하거나 계획하는 능력이라는 뜻을 간결하게 나타내되, 별도의 신학적 고유명사로 확정하지 않았습니다.
theological_decisions:
- issue: ‘these were dispatched’의 복수 지시 대상
  choice: ‘이들은 … 파견되었습니다’로 모호성을 유지
  alternative: 로고스 또는 완전한 이들을 지시 대상으로 명시
  rationale: 제공된 증거만으로 복수 대명사의 선행사를 확정할 수 없으므로 원문의 불분명함을 보존했습니다.
- issue: 사형 선고를 받은 대상
  choice: ‘그들은’로 유지
  alternative: 카오스의 일곱 권세라고 명시
  rationale: 문맥상 일곱 권세일 가능성이 높지만 대명사의 범위를 번역문에서 단정하지 않았습니다.
- issue: ‘their fate’의 소유 대상
  choice: 문맥상 ‘신들에게 정해진 운명’으로 표현하되 각주 처리
  alternative: 완전한 이들의 운명 또는 아르콘들의 운명
  rationale: 앞 문장의 가장 가까운 복수 명사인 ‘신들’을 자연스러운 선행사로 보았지만, 영어 증언 자체의 지시 관계가 완전히 명백하지 않음을 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 문헌 고유의 우주론적 전문어인 로고스, 카오스, 아르콘은 음역하고, 나머지는 일반 독자가 이해할 수 있는 자연스러운 어휘로 옮겼습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 제공된 공용 영어 증언에 근거한 잠정 번역입니다.
