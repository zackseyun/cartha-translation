    rationale: ‘예지’는 주로 미래를 미리 앎을 뜻하지만, forethought는 미리 세운 생각·사려·계획을 뜻할 수 있습니다. 이 문맥에서는 ‘계획’이 과도한 신학적 함의 없이 더 가깝습니다.
  revised_text: '모든 것을 뛰어넘는 로고스가 파견된 것은 오직 이 한 가지 이유 때문이었습니다. 곧 미지의 것을 선포하기 위해서였습니다. 그는 말씀하셨습니다. “감추어진 것 가운데 드러나지 않을 것은 없고, 알려지지 않은 것은 알려질 것이다.” 그리고 이들은 감추어진 것, 곧 카오스의 일곱 권세와 그들의 불경함까지도 알리려고 파견되었습니다.[a] 이렇게 해서 그들은 사형 선고를 받았습니다.


