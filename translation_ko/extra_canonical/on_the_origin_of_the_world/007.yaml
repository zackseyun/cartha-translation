  revised_text: '그 뒤에 그는 천사들의 회중, 곧 헤아릴 수 없이 많은 수천과 수만을 창조했습니다. 그 회중은 여덟째 하늘의 회중을 닮았습니다. 또한 그는 “이스라엘”, 곧 “하느님을 보는 사람”이라 불리는 맏아들과 “예수 그리스도”라 불리는 또 다른 존재를 창조했습니다. 이 존재는 위쪽 여덟째 하늘에 거하는 구원자를 닮았으며, 그의 오른편 거룩한 보좌에 앉아 있습니다. 그의 왼편에는 거룩한 영의 동정녀가 보좌에 앉아 그를 찬양하고 있습니다. 일곱 동정녀는 그 앞에 서서 서른 개의 수금과 리라와 […] 나팔을 들고[a] 그를 찬양합니다. 천사의 모든 군대도 그를 찬양하고 칭송합니다.



