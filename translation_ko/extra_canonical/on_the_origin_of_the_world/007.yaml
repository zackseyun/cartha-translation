    The place he sits is on a throne of light <in a> large cloud covering him, and no one dwelt with him inside the cloud except Sophia, <the daughter of> Pistis, who taught him concerning all the entities that exist inside the eighth heaven, in order to be able to create the likenesses of those entities, so that his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now, Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day, right has been called “justice,” and left has been called “evil.” On account of this, all of them obtained an aeon in the assembly of justice, and evil stands over [5] every created entity.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/007.yaml
  text: 'After this, he created an assembly of angels—countless thousands and tens of thousands—which looked like the assembly in the eighth heaven. He also created a firstborn called “Israel,” that is, “the Man Who Sees God,” and another being called “Jesus Christ.” This being looks like the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne, glorifying him. The seven virgins stand before her, holding thirty harps, lyres, and [] trumpets and glorifying him. All the angelic hosts glorify him and praise him.


    The place where he sits is a throne of light <in a> great cloud that covers him. No one lived with him inside the cloud except Sophia, <the daughter of> Pistis. She taught him about all the beings that exist within the eighth heaven so that he could create likenesses of them and his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day on, the right has been called “justice,” and the left has been called “evil.” Because of this, all of them received an aeon in the assembly of justice, and evil stands over every created being [5].'
translation:
  language: ko
  text: '그 뒤에 그는 천사들의 회중을 창조했습니다. 그 수는 헤아릴 수 없이 많은 천의 천 배요 만의 만 배였으며, 그 회중은 여덟째 하늘의 회중을 닮았습니다. 또한 그는 “이스라엘”, 곧 “하느님을 보는 사람”이라 불리는 맏아들을 창조했고, “예수 그리스도”라 불리는 또 다른 존재도 창조했습니다. 이 존재는 위쪽 여덟째 하늘에 거하는 구원자를 닮았으며, 그의 오른편 거룩한 보좌에 앉아 있습니다. 그의 왼편에는 거룩한 영의 동정녀가 보좌에 앉아 그를 찬양하고 있습니다. 일곱 동정녀는 그 앞에 서서 서른 개의 수금과 리라와 […] 나팔을 들고[a] 그를 찬양합니다. 천사의 모든 군대도 그를 찬양하고 칭송합니다.


    그가 앉아 있는 곳은 그를 덮은 큰 구름 <속의> 빛의 보좌입니다.[b] 그 구름 안에는 피스티스의 <딸인> 소피아 외에는 아무도 그와 함께 거하지 않았습니다.[c] 소피아는 여덟째 하늘 안에 존재하는 모든 것에 관해 그를 가르쳤습니다. 이는 그가 그것들의 형상을 만들어, 카오스의 하늘들과 그 군대가 완결될 때까지 자신의 통치가 지속되게 하려는 것이었습니다.


    그런데 피스티스 소피아는 그를 어둠에서 떼어 내어 자기 오른편으로 불렀고, 원초의 어버이는 자기 왼편에 두었습니다. 그날부터 오른편은 “정의”라 불리고 왼편은 “악”이라 불렸습니다. 이 때문에 그들은 모두 정의의 회중 안에서 하나의 아이온을 받았으며, 악은 창조된 모든 것 위에 서 있습니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호로 표시된 부분은 전승 본문에 결락이 있음을 나타냅니다. 따라서 나팔 앞에 다른 말이나 수식어가 있었을 가능성이 있습니다.
    reason: 원문 증거의 결락 신호를 보존하고 독자가 문장이 불완전하게 전해졌음을 알 수 있게 합니다.
  - marker: b
    text: 꺾쇠괄호 안의 “속의”는 번역 증언에서 문맥에 따라 보충된 말입니다.
    reason: 편집자가 복원한 요소를 확정된 본문과 구별합니다.
  - marker: c
    text: 꺾쇠괄호 안의 “딸인”은 번역 증언에서 보충된 말입니다.
    reason: 피스티스와 소피아의 관계를 나타내는 말이 편집적 복원임을 밝힙니다.
  - marker: d
    text: 이 대목의 영어 증언에는 문장 중간에 사본 면수로 보이는 “[5]”가 있습니다. 이는 본문 내용이 아니므로 번역문에는 넣지 않았습니다.
    reason: 제공된 증언의 편집·면수 표지를 기록하되 본문 의미와 혼동하지 않게 합니다.
lexical_decisions:
- source_word: assembly
  choice: 회중
  rationale: 천사들의 모임과 여덟째 하늘의 대응 집단을 가리키므로, 제도화된 교회라는 함의를 피하면서도 집합체의 성격을 살렸습니다.
- source_word: countless thousands and myriads
  choice: 헤아릴 수 없이 많은 천의 천 배요 만의 만 배
  rationale: 엄청난 수를 나타내는 고대식 누적 표현을 단순히 ‘수없이 많았다’로 평탄화하지 않고 장엄한 과장법을 보존했습니다.
- source_word: firstborn
  choice: 맏아들
  rationale: 단순한 ‘첫 존재’보다 친족·상속의 함의를 지닌 표현이므로 성별을 포함한 전통적 의미를 보존했습니다.
- source_word: the Man Who Sees God
  choice: 하느님을 보는 사람
  rationale: 이스라엘이라는 이름에 본문이 직접 붙인 해석을 어원학적으로 교정하지 않고 그대로 옮겼습니다.
- source_word: holy Spirit
  choice: 거룩한 영
  rationale: 이 문헌의 독특한 신화적 용례를 특정 교파의 정형화된 삼위일체 호칭으로 미리 확정하지 않도록 구성 요소를 투명하게 번역했습니다.
- source_word: harps / lyres
  choice: 수금 / 리라
  rationale: 서로 다른 악기 명칭을 하나로 합치지 않았으며, 두 번째 악기는 고대 악기임을 드러내도록 음역했습니다.
- source_word: consummation
  choice: 완결
  rationale: ‘멸망’이나 ‘종말’로 의미를 좁히지 않고, 어떤 질서가 정해진 끝에 이른다는 의미를 유지했습니다.
- source_word: Chaos
  choice: 카오스
  rationale: 일반적인 무질서가 아니라 이 우주론 안의 명명된 영역을 가리키므로 고유명사처럼 음역했습니다.
- source_word: Primal Parent
  choice: 원초의 어버이
  rationale: 성별을 원문보다 구체화하지 않으면서 최초의 부모·근원적 조상이라는 뜻을 보존했습니다.
- source_word: aeon
  choice: 아이온
  rationale: 시대, 영원, 세계 영역 가운데 어느 뜻인지 문맥상 확정하기 어려워 전문 용어를 음역해 다의성을 보존했습니다.
- source_word: evil stands over every created entity
  choice: 악은 창조된 모든 것 위에 서 있습니다
  rationale: ‘지배한다’나 ‘감시한다’로 해석을 확정하지 않고 공간적·권세적 긴장을 함께 지닌 표현을 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: “예수 그리스도”와 위쪽 구원자의 관계
  choice: “예수 그리스도”라 불리는 존재가 위쪽 구원자를 ‘닮았다’고 번역
  alternative: 두 존재를 동일한 존재로 표현
  rationale: 본문은 아래에서 창조된 존재와 여덟째 하늘의 구원자 사이에 유사성을 말하므로, 둘을 교리적으로 동일시하지 않았습니다.
- issue: 오른편과 왼편을 가리키는 소유자의 모호성
  choice: 반복되는 대명사를 ‘그의’로 유지
  alternative: 사바오트 또는 구원자 등 특정 이름으로 명시
  rationale: 제공된 증거에서 대명사의 지시 대상이 완전히 명시되지 않으므로 번역에서 임의로 확정하지 않았습니다.
- issue: 거룩한 영의 동정녀
  choice: 문법적 관계를 그대로 보존
  alternative: 동정녀를 성령 자체 또는 별도의 특정 신격으로 설명
  rationale: ‘of’ 관계가 정체성, 소속, 기원 중 무엇인지 해석하지 않고 본문의 신화적 긴장을 유지했습니다.
- issue: 오른편은 정의, 왼편은 악이라는 대응
  choice: 평가적 대조를 그대로 번역
  alternative: 상징적 또는 윤리적 해설을 본문에 삽입
  rationale: 현대적 가치 판단으로 완화하거나 교리화하지 않고 문헌 자체의 우주론적 분류를 보존했습니다.
- issue: ‘그들은 모두’의 지시 대상
  choice: 대명사를 유지
  alternative: 천사들, 존재들 또는 오른편에 속한 자들로 특정
  rationale: 선행 대상이 불분명하므로 genuine ambiguity를 남겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 우주론의 장엄함을 살리되 문장은 ordinary modern readers가 따라갈 수 있도록 나누었습니다. ‘소피아’, ‘피스티스’, ‘카오스’, ‘아이온’은 이 문헌의 기술적·고유명사적 성격을 보존하기 위해 음역했습니다. 콥트어 원문 직접 검토가 아직 이루어지지 않았으므로, 제공된 공용 영어 증언의 대명사·통사적 모호성과 편집 기호를 신중히 유지한 잠정 출판 초안입니다.
