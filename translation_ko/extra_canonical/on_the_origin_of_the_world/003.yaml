  naturalness: 합쇼체가 일관되며 대체로 자연스럽습니다. 다만 손상된 구절에서 ‘그것은 [] … 영으로 나타났습니다’는 선행사와 문장 관계가 다소 불분명하므로 ‘그 발성은 … 영으로 모습을 드러냈습니다’로 명료하게 다듬었습니다. ‘마른 것은’도 ‘마른 부분은’으로 고쳤습니다.
