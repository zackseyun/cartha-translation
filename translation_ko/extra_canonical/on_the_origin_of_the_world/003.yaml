    rationale: ‘Eee-a-o’는 바로 앞의 ‘eee!’와 의도적으로 연결됩니다. ‘이에아오’는 첫 음절의 장·반복 효과를 약화시킵니다. ‘이이이-아-오’는 잠정 음역임을 전제하면서 그 연결과 분절을 더 투명하게 보존합니다.
