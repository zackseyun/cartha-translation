base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: ko
  text: '아르콘[a]은 자기의 크기를 보았습니다. 그러나 물과 어둠 너머로는 아무것도 볼 수 없었으므로, 자기 말고는 아무도 보지 못했습니다. 그래서 그는 존재하는 것은 자기뿐이라고 생각했습니다. 그의 […]은 발성을 통해 완성되었으며, 그것은 [] 물 위를 이리저리 움직이는 영으로 나타났습니다.[b] 그 영이 나타나자 아르콘은 물로 된 물질을 갈라놓았고, 마른 것은 다른 곳으로 분리되었습니다. 그는 물질로 자기가 거처할 곳을 빚어 만들고 그것을 “하늘”이라고 불렀습니다. 또 아르콘은 물질로 발판을 빚어 만들고 그것을 “땅”이라고 불렀습니다.


    그때 아르콘에게 자기 본성과 일치하는 생각이 떠올랐습니다. 그는 발성을 통해 남성과 여성을 함께 지닌 존재를 창조했습니다. 아르콘이 입을 열어 그에게 옹알이하는 소리를 냈습니다. 그 존재는 눈이 열리자 자기 아버지를 바라보며 “이이이!” 하고 소리를 냈습니다. 그러자 그의 아버지는 그에게 “이에아오”라는 이름을 붙였습니다.[c]


    그런 다음 아르콘은 둘째 아들을 창조하고 그에게 옹알이하는 소리를 냈습니다. 그 아들은 눈을 뜨자 자기 아버지에게 “에!” 하고 소리를 냈습니다. 그의 아버지는 그에게 “엘로아이”라는 이름을 붙였습니다.


    그런 다음 아르콘은 셋째 아들을 창조하고 그에게 옹알이하는 소리를 냈습니다. 그 아들은 눈을 뜨자 자기 아버지에게 “아스스스!” 하고 소리를 냈습니다. 그의 아버지는 그에게 “아스타파이오스”라는 이름을 붙였습니다.


    이 셋이 그 아버지의 아들들입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아르콘’은 ‘통치자’ 또는 ‘지배자’를 뜻하는 말로, 이 문헌에서는 우주를 다스리는 특정 존재를 가리킵니다.
    reason: 전문 용어의 의미를 일반 독자에게 설명하되 본문에서는 고유한 용례를 보존하기 위해서입니다.
  - marker: b
    text: 이 대목의 본문은 손상되어 있습니다. […]과 []는 전승 본문에 있는 결락 또는 불확실한 부분을 나타냅니다. 콥트어 원문에 대한 직접 검토가 아직 남아 있습니다.
    reason: 제공된 영어 증거문이 보존한 본문 손상과 번역의 잠정성을 명시하기 위해서입니다.
  - marker: c
    text: “이이이”, “에”, “아스스스”라는 소리와 “이에아오”, “엘로아이”, “아스타파이오스”라는 이름은 서로 소리상 연결되어 있습니다. 정확한 한국어 음역은 콥트어 원문 검토에 따라 조정될 수 있습니다.
    reason: 세 아들의 발성과 이름 사이의 말소리 연결을 독자가 알아볼 수 있게 하고, 잠정적 음역임을 밝히기 위해서입니다.
lexical_decisions:
- source_word: archon
  choice: 아르콘
  rationale: 이 문헌의 고유한 우주론적 통치자를 가리키는 전문 용어이므로 일반적인 ‘통치자’로 환원하지 않고 음역했습니다.
- source_word: verbal articulation
  choice: 발성
  rationale: 말이나 소리를 입으로 내는 행위와 그 창조적 기능을 함께 간결하게 드러냅니다.
- source_word: androgyne
  choice: 남성과 여성을 함께 지닌 존재
  rationale: 현대 독자가 이해하기 쉬우면서도 원문의 양성적 성격을 특정 생물학적·교리적 개념으로 좁히지 않습니다.
- source_word: cooing sound
  choice: 옹알이하는 소리
  rationale: 정확한 음성의 성격이 불확실한 상황에서, 이름을 낳는 비언어적이고 반복적인 발성을 자연스러운 한국어로 표현했습니다.
- source_word: footstool
  choice: 발판
  rationale: 하늘의 거처와 대비되는 땅의 낮은 위치를 나타내는 공간적 비유를 보존했습니다.
theological_decisions:
- issue: 아르콘이 자신만 존재한다고 여기는 장면
  choice: ‘존재하는 것은 자기뿐’이라고 생각한 것으로 번역
  alternative: 아르콘이 실제 유일한 존재였다고 단정
  rationale: 본문은 그의 제한된 시야에서 생긴 생각을 서술하므로, 그 판단을 서술자의 확정적 진술로 바꾸지 않았습니다.
- issue: 물 위를 움직이는 영의 정체
  choice: 선행하는 손상된 표현을 받는 ‘그것’이 영으로 나타났다고 유지
  alternative: 그 영을 창조주의 영이나 특정 신적 존재로 명시
  rationale: 본문의 결락과 대명사 관계가 허용하는 모호성을 보존하고 특정 신학적 동일시를 피했습니다.
- issue: 양성적 존재와 이어지는 ‘아들’ 호칭의 긴장
  choice: 처음에는 남성과 여성을 함께 지닌 존재로, 뒤에서는 본문대로 아들로 번역
  alternative: 전 구절을 한 성별 표현으로 통일
  rationale: 본문 자체의 성별 표현 사이에 있는 긴장을 해소하지 않고 그대로 남겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 문장은 일반 독자가 따라가기 쉽도록 나누되 반복되는 창조 서술의 의식적 리듬을 유지했습니다. 제공 자료가 공개 영어 증거문에 기초하고 콥트어 원문 검토가 아직 이루어지지 않았으므로, 결락과 불확실성을 숨기지 않았습니다.
