translation:
  language: ko
  text: '시대가 완결되기 전에, 온 영역이 큰 천둥소리에 뒤흔들릴 것입니다. 그러면 아르콘들은 다가오는 자신들의 죽음을 [두려워하여] 슬퍼할 것입니다.[a] 천사들은 자신들의 인간성 때문에 탄식하고, 악령들은 자신들의 때를 두고 울며, 그들의 인간성은 다가오는 죽음 앞에서 신음하고 비명을 지를 것입니다.


    그때 그 시대가 시작되고, 그들은 혼란에 빠질 것입니다. 그들의 왕들은 불의 칼에 취하고, 서로 전쟁을 벌여 땅이 피 흘림에 취하게 하며, 바다들은 그 전쟁들로 요동칠 것입니다. 그때 해는 어두워지고 달은 그 빛을 가릴 것입니다. 하늘의 별들은 제 궤도를 따라 돌기를 멈출 것입니다. 그리고 여자의 궁창이 있는 곳, 곧 혼돈의 모든 군대 위에 있는 큰 군대로부터 거대한 천둥소리가 터져 나올 것입니다.


    그 여자는 첫 창조물을 낳은 뒤, 이성의 지혜로운 불을 벗어 놓고 이성 없는 진노를 입을 것입니다.


    그다음 그 여자는 자신이 태초의 어버이와 함께 창조한 혼돈의 신들을 뒤쫓을 것입니다. 그들을 심연으로 내던질 것입니다. 그들은 악하기 때문에 멸망할 것입니다. 그들은 화산처럼 되어 서로를 삼키다가 마침내 태초의 어버이의 능력으로 멸망할 것입니다.


    그들을 멸망시킨 뒤, 그는 자기 자신에게로 돌아서서 더는 존재하지 않을 때까지 자신마저 멸할 것입니다.[b] 그들의 하늘들은 서로 포개져 무너지고, 그 군대들은 불에 삼켜질 것입니다. 그들의 아이온들도 뒤엎어질 것이며, 그의 하늘은 추락하여 둘로 산산이 깨질 것입니다. 그의 [별들은 …] 땅으로 떨어지고, [땅은 그것들을] 견디지 [못할 것입니다]. 그것들은 심연으로 떨어지고, 심연도 뒤엎어질 것입니다. 빛은 어둠을 [이기고] 없애 버릴 것입니다. 어둠은 마치 [한 번도] 존재한 적이 없는 것처럼 될 것이며, 어둠의 근원은 흩어지고 결핍은 뿌리째 뽑혀 어둠 속으로 내던져질 것입니다. 빛은 위로 물러나 자기 뿌리로 돌아가고, 나지 않은 이의 영광이 나타나 모든 아이온을 가득 채울 것입니다. 그때 예언들과 왕들의 글들이 드러나고, ‘완전한 이들’이라 불리는 사람들을 통하여 성취될 것입니다.


    그러나 나지 않은 아버지 안에서 완전해지지 못한 이들은 자신들의 아이온들과 죽지 않는 이들의 왕국들에서 영광을 얻을 것이지만, 왕 없는 아이온에는 결코 들어가지 못할 것입니다. 각 사람은 자신이 나온 곳으로 가야 하기 때문입니다. 각 사람은 자신의 행위와 지식으로 자기 본성을 드러낼 것입니다.


    [a] 이 구절의 원문은 훼손되어 있어, ‘두려워하여’는 문맥에 따른 복원입니다.

    [b] 이 대목에서는 대명사의 지시 대상이 불분명합니다. 앞 문장의 ‘태초의 어버이’를 가리킬 수도 있고, 멸망하는 혼돈의 통치자 가운데 하나를 가리킬 수도 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 원문은 훼손되어 있어, ‘두려워하여’는 문맥에 따른 복원입니다.
    reason: 대괄호로 표시된 복원과 결락의 흔적을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 이 대목에서는 대명사의 지시 대상이 불분명합니다. 앞 문장의 ‘태초의 어버이’를 가리킬 수도 있고, 멸망하는 혼돈의 통치자 가운데 하나를 가리킬 수도 있습니다.
    reason: 신학적으로 중요한 행위 주체를 번역자가 임의로 확정하지 않기 위해서입니다.
lexical_decisions:
- source_word: archons
  choice: 아르콘들
  rationale: 작품의 고유한 우주론적 통치자들을 일반적인 ‘통치자들’과 구별하면서도 음역어로 그 특수성을 보존했습니다.
- source_word: aeon(s)
  choice: 아이온(들)
  rationale: ‘시대’와 ‘영적 영역’ 양쪽의 뜻을 지닐 수 있는 전문 용어이므로, 우주론적 실재를 가리키는 곳에서는 음역해 의미를 좁히지 않았습니다.
- source_word: Abyss
  choice: 심연
  rationale: 우주론적 장소라는 문맥을 살리면서 현대 한국어 독자에게 자연스럽고 장중하게 들리는 표현을 택했습니다.
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: 원문의 성별 비특정적 부모 호칭을 보존하고 특정한 부계·모계 존재로 단정하지 않았습니다.
- source_word: unbegotten one / unbegotten Father
  choice: 나지 않은 이 / 나지 않은 아버지
  rationale: ‘창조되지 않은’보다 출생·발생의 부재를 직접 나타내며, 두 표현의 호칭 차이도 유지했습니다.
- source_word: humanity
  choice: 인간성
  rationale: 문맥상 ‘인류’인지 ‘그들에게 속한 인간적 요소’인지 모호하므로 소유 표현과 함께 ‘인간성’으로 옮겨 긴장을 보존했습니다.
- source_word: kingless aeon
  choice: 왕 없는 아이온
  rationale: ‘왕이 없는’이라는 역설적 표현을 해석적으로 바꾸지 않고 그대로 보존했습니다.
- source_word: consummation of the age
  choice: 시대의 완결
  rationale: 단순한 시간적 ‘끝’보다 완성·종결의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘완전한 이들’의 정체
  choice: 인용 부호를 사용한 ‘완전한 이들’
  alternative: ‘성도들’ 또는 특정 영지주의 집단명
  rationale: 본문 자체의 명칭을 유지하고 후대 교파적 범주를 덧씌우지 않았습니다.
- issue: 빛과 어둠의 최종 대립
  choice: 빛이 어둠을 이기고 없앤다는 문면을 직접 보존
  alternative: 선하신 신이 악을 심판한다고 교리적으로 풀어쓰기
  rationale: 작품 고유의 우주론적 표현과 비인격적 묘사를 유지했습니다.
- issue: 완전해지지 못한 이들의 종말
  choice: 영광은 얻지만 왕 없는 아이온에는 들어가지 못한다고 번역
  alternative: 구원 또는 정죄로 양분하여 해석
  rationale: 본문이 제시하는 단계적·복합적 운명을 이분법으로 단순화하지 않았습니다.
- issue: 자기 자신을 멸하는 주체
  choice: 남성 단수 대명사 ‘그’를 유지하고 각주로 불확실성을 표시
  alternative: 태초의 어버이 또는 특정 아르콘을 본문에서 명시
  rationale: 영어 증언 자체에서 선행사가 불분명하며 콥트어 직접 검토도 보류 중이므로 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 묵시문학의 장중함을 유지했습니다. 현재 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 직접 대조가 필요합니다. 본문 훼손은 대괄호와 줄임표로 보존했고, 삽입된 필사본 쪽수 [17]은 내용이 아니므로 제외했습니다. ‘아르콘’, ‘아이온’ 같은 작품 고유의 우주론 용어는 과도한 해설 번역을 피하고 음역했습니다.
