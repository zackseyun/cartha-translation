base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: ko
  text: '쉼의 날이 지난 뒤, 소피아는 하와라고 불리는 자기 딸 조에를 가르치는 이로 보냈습니다. 영혼 없는 아담을 일으켜 세워, 그가 낳게 될 이들이 빛의 그릇이 되게 하려는 것이었습니다.


    [그때] […] 하와가[a] 자기의 남자 짝이 엎드려 있는 것을 보고 그를 불쌍히 여겨 말했습니다. “아담아, 살아나라! 땅 위에 일어서라!”


    그녀가 한 말은 곧바로 행동으로 이루어졌습니다. 아담은 일어서자 재빨리 눈을 떴습니다. 그는 그녀를 보고 말했습니다. “너는 ‘살아 있는 이들의 어머니’라고 불릴 것이다. 네가 나에게 생명을 주었기 때문이다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호는 전승 본문의 손상 또는 편집자가 복원한 부분을 나타냅니다. 여기에는 복원된 말과 판독할 수 없는 공백이 이어집니다.
    reason: 제공된 증거의 “[When] []”라는 본문 상태를 독자에게 보이고, 불확실한 부분을 매끄럽게 메워 확정하지 않기 위해서입니다.
lexical_decisions:
- source_word: Sophia
  choice: 소피아
  rationale: 인물의 고유명으로 음역했습니다. ‘지혜’라는 이름의 뜻을 본문에 대신 넣으면 인물명과 보통명사의 경계가 흐려질 수 있습니다.
- source_word: Zoe
  choice: 조에
  rationale: 인물의 고유명으로 음역하여 ‘생명’이라는 뜻을 해석적으로 본문에 대입하지 않았습니다.
- source_word: day of rest
  choice: 쉼의 날
  rationale: 제공된 증거가 특정 종교의 정식 명칭인 ‘안식일’을 확정하지 않으므로, 표현의 일반성과 모호성을 보존했습니다.
- source_word: soulless Adam
  choice: 영혼 없는 아담
  rationale: 원문의 인간론적 긴장을 완화하여 ‘생기 없는’ 등으로 바꾸지 않고 직접적으로 옮겼습니다.
- source_word: vessels of light
  choice: 빛의 그릇
  rationale: 그릇이 빛을 담는지, 빛에 속하는지에 관한 비유의 여지를 보존하는 간결한 번역입니다.
- source_word: male companion
  choice: 남자 짝
  rationale: 관계를 배우자나 동료로 확정하지 않으면서 성별과 대응 관계를 함께 드러냈습니다.
- source_word: Mother of the Living
  choice: 살아 있는 이들의 어머니
  rationale: ‘생명의 어머니’로 추상화하지 않고 살아 있는 존재들을 가리키는 표현으로 옮겼습니다.
theological_decisions:
- issue: 하와가 아담에게 생명을 주는 역할
  choice: “네가 나에게 생명을 주었기 때문이다”라고 직접 번역
  alternative: 창세기의 익숙한 표현에 맞추어 ‘모든 산 자의 어머니’로 조정
  rationale: 이 문헌 특유의 생명 부여 역할과 신학적 긴장을 다른 전승에 맞추어 약화하지 않았습니다.
- issue: 아담의 ‘영혼 없음’
  choice: 영혼 없는 아담
  alternative: 생명 없는 아담 또는 생기 없는 아담
  rationale: ‘영혼’과 ‘생명’을 동일시하지 않고, 제공된 증거가 제시하는 구별을 유지했습니다.
- issue: ‘그가 낳게 될 이들’의 범위
  choice: 대상을 구체적으로 규정하지 않음
  alternative: 아담의 자손 또는 인류
  rationale: 후손이나 인류 전체라고 명시하면 원문보다 범위를 좁히거나 넓힐 수 있으므로 관계절 구조를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용하되, 서사 문체는 간결하고 품위 있게 유지했습니다. 명령문은 장면의 직접성과 힘을 살리기 위해 ‘살아나라’, ‘일어서라’를 사용했습니다. 이 초안은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역이며, 콥트어 원문 대조가 이루어지면 어휘와 손상부 표기를 재검토해야 합니다.
