base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/014.yaml
  text: '[] As she desired, Sophia, who lived in the lower heaven, received authority from Pistis. She formed great shining bodies and every star, and she placed them in the sky to shine on the earth and to determine signs of time, seasons, years, months, days, nights, minutes, and so on. In this way, the whole expanse of the sky was adorned.


    Now, when Adam of Light desired to enter his light, namely, the eighth heaven, he could not do so because of the poverty that had mingled with his light. Then he created an immense aeon for himself. Within that aeon he created six aeons and their adornments, six in number, which were seven times greater than the heavens of Chaos and their adornments.


    Now all these aeons and their adornments exist within the infinity that lies between the eighth heaven and the Chaos beneath it. They are counted together with the universe that belongs to poverty.


    If you wish to learn their structure, you will find it written in the Seventh World of the Prophet Hieralias.'
translation:
  language: ko
  text: '[] 아래 하늘에 거하던 소피아는 자신이 바라던 대로 피스티스에게서 권한을 받았습니다. 그는 크고 빛나는 천체들과 모든 별을 빚어, 땅을 비추고 때의 표지와 계절과 해와 달과 날과 밤과 분과 그 밖의 것들을 정하도록 하늘에 두었습니다. 이렇게 하늘의 온 영역이 장식되었습니다.


    그런데 빛의 아담은 자기 빛, 곧 여덟째 하늘로 들어가고자 하는 마음을 품었으나, 그의 빛에 뒤섞인 결핍 때문에 들어갈 수 없었습니다. 그래서 그는 자신을 위하여 광대한 아이온 하나를 창조했고, 그 아이온 안에 여섯 아이온과 그 각각의 장식, 곧 모두 여섯 장식을 창조했습니다. 이것들은 카오스의 하늘들과 그 장식들보다 일곱 배 뛰어났습니다.


    이 모든 아이온과 그 장식들은 여덟째 하늘과 그 아래의 카오스 사이에 펼쳐진 무한한 영역 안에 존재하며, 결핍에 속한 우주와 함께 헤아려집니다.


    그 구조를 알고 싶다면, 예언자 히에랄리아스의 『일곱째 세계』에 기록된 것을 찾아볼 수 있습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sophia
  choice: 소피아
  rationale: 고유한 신화적 존재의 이름으로 음역하여, 일반 명사 ‘지혜’와의 구별을 유지했습니다.
- source_word: Pistis
  choice: 피스티스
  rationale: 고유명으로 취급해 음역했으며, ‘믿음’으로 번역하여 인물성과 개념성을 한쪽으로 확정하지 않았습니다.
- source_word: shining bodies
  choice: 빛나는 천체들
  rationale: 별과 함께 하늘에 배치되는 큰 발광체라는 문맥을 자연스럽게 전달했습니다.
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌에서 존재자·세계·시대 영역을 함께 가리킬 수 있는 전문 용어이므로 ‘영겁’이나 ‘세계’로 단일화하지 않고 음역했습니다.
- source_word: poverty
  choice: 결핍
  rationale: 우주론적 원리 또는 영역을 가리키는 용법을 살리면서도 현대 한국어에서 의미를 이해할 수 있도록 했습니다.
- source_word: Chaos
  choice: 카오스
  rationale: 이 문헌의 고유한 우주론적 영역을 가리키므로 일반적인 ‘혼돈’으로 의미를 축소하지 않고 음역했습니다.
- source_word: adornments
  choice: 장식
  rationale: 하늘 또는 아이온을 구성하고 꾸미는 요소라는 반복 어휘를 보존했습니다.
- source_word: infinity
  choice: 무한한 영역
  rationale: 공간적 위치를 나타내는 문맥을 자연스럽게 전달하되, 추상 개념인지 우주론적 영역인지의 여지를 남겼습니다.
theological_decisions:
- issue: ‘his light’와 ‘the eighth heaven’의 관계
  choice: ‘자기 빛, 곧 여덟째 하늘’
  alternative: ‘자기의 빛인 여덟째 하늘’
  rationale: 원문의 동격 설명을 보존하면서 두 표현이 완전히 동일한 실체인지에 관한 과도한 해석은 피했습니다.
- issue: ‘poverty’의 인격성 또는 우주론적 지위
  choice: ‘결핍’으로 번역하되 고유명사 표기는 하지 않음
  alternative: ‘빈곤’ 또는 ‘결핍자’
  rationale: 제공된 증거만으로 인격적 존재임을 확정하지 않고, 빛에 섞이며 우주가 속할 수 있는 원리·영역이라는 긴장을 유지했습니다.
- issue: ‘seven times superior’의 성격
  choice: ‘일곱 배 뛰어났습니다’
  alternative: ‘일곱 배 더 컸습니다’
  rationale: 원문 증언의 비교가 크기만을 뜻한다고 단정하지 않고 우월성의 폭넓은 의미를 보존했습니다.
- issue: 여섯 아이온과 여섯 장식의 수 관계
  choice: ‘여섯 아이온과 그 각각의 장식, 곧 모두 여섯 장식’
  alternative: ‘여섯 아이온과 여섯 장식’
  rationale: 영어 증언의 다소 난해한 수식 관계를 최소한으로 명료화하면서, 장식이 여섯이라는 정보를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 문체는 고대 우주론 문헌에 어울리도록 품위를 유지하되, ‘천체’, ‘영역’, ‘구조’ 등 일반 독자가 이해할 수 있는 표현을 택했습니다. 제공 자료는 콥트어 직접 대조가 아직 이루어지지 않은 영어 공개 번역 증언이므로 초안은 잠정적입니다. 첫머리의 빈 대괄호 ‘[]’는 사본 훼손 또는 복원 표지일 가능성을 고려하여 그대로 보존했습니다. 별도 각주가 없어 본문 각주 표지는 사용하지 않았습니다.
