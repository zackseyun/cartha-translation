base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: ko
  text: '하와는 최초의 처녀이며, 남편 없이 첫아이를 낳은 이입니다. 그는 스스로 자신의 산파가 되었습니다. 그 때문에 그가 이렇게 말했다고 여겨집니다.


    나는 내 어머니의 일부인 이이며,

    나는 어머니인 이입니다.

    나는 아내인 이이며,

    나는 처녀인 이입니다.

    나는 임신한 이이며,

    나는 산파인 이입니다.

    나는 산고를 덜어 주는 이입니다.

    나의 남편은 나를 낳은 이이며,

    나는 그의 어머니인 이입니다.

    그는 나의 아버지이며 나의 주입니다.

    그는 나의 힘인 이입니다.

    그가 무엇을 바라든, 그는 이치에 맞게 말합니다.

    나는 되어 가는 중입니다.

    비록 이미 한 남자를 주로 낳았지만 말입니다.[a]


    이제 이 일들은 사바오트와 그의 그리스도의 뜻에 따라, 권세자들이 빚어 만든 형상들 속으로 들어갈 영혼들에게 드러났습니다.[b] 이 영혼들을 두고 거룩한 음성이 말했습니다. “번성하고 무성해져라. 창조된 모든 존재를 다스려라.” 그들은 자기들에게 정해진 운명에 따라 태초의 어버이에게 사로잡힌 이들이었습니다. 이렇게 그들은 시대가 완결될 때까지 빚어진 형상이라는 감옥 안에 갇혔습니다. <…>[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 두 행은 문법과 의미가 불확실합니다. 특히 ‘주로’는 ‘주인인 자로서’ 또는 ‘주인으로 삼아’와 같은 뜻일 가능성도 있습니다.
    reason: 원문의 진정한 통사적·신학적 모호성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 여기서 ‘형상들’은 권세자들이 빚어 만든 몸이나 형체를 가리킬 수 있으나, 번역에서는 그 대상을 더 좁게 확정하지 않았습니다.
    reason: 우주론적 해석을 본문에 단정적으로 삽입하지 않기 위해서입니다.
  - marker: c
    text: <…>는 전승된 본문에 결손이 있음을 나타냅니다. 또한 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역이며, 콥트어 사본에 대한 직접 검토가 필요합니다.
    reason: 본문 결손과 현재 번역의 자료적 한계를 투명하게 표시하기 위해서입니다.
lexical_decisions:
- source_word: first virgin
  choice: 최초의 처녀
  rationale: 시간적·원형적 의미를 모두 열어 두면서 원문의 직설적인 표현을 보존했습니다.
- source_word: served as her own midwife
  choice: 스스로 자신의 산파가 되었습니다
  rationale: 하와가 출산자이면서 산파라는 역설을 풀어 없애지 않고 자연스러운 한국어로 옮겼습니다.
- source_word: shaped forms
  choice: 빚어 만든 형상들 / 빚어진 형상
  rationale: 형태를 부여하여 제작했다는 의미를 살리고, 단순한 ‘몸’으로 해석을 제한하지 않았습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 이 문헌의 우주론적 존재들을 가리키는 전문적 용례를 유지하며, 추상적인 ‘권세’와 구별했습니다.
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: 성별을 원문 이상으로 특정하지 않으면서 시원적 부모라는 뜻을 전달했습니다.
- source_word: consummation of the age
  choice: 시대가 완결될 때
  rationale: 종말론적 함의를 유지하되 특정 교파의 고정된 종말론 용어를 덧씌우지 않았습니다.
theological_decisions:
- issue: ‘한 남자를 주로 낳았다’는 구절의 통사적·신학적 모호성
  choice: 비록 이미 한 남자를 주로 낳았지만 말입니다
  alternative: 비록 이미 주인인 한 남자를 낳았지만 말입니다
  rationale: ‘as a lord’가 낳은 남자의 지위를 나타내는지, 출산 행위와 다른 방식으로 연결되는지 불분명하므로 다소 낯선 구조를 보존하고 각주로 알렸습니다.
- issue: 사바오트와 ‘그의 그리스도’의 관계
  choice: 사바오트와 그의 그리스도
  alternative: 사바오트와 그에게 속한 그리스도
  rationale: 소유격의 관계를 신학적으로 확정하지 않고 표면적 구조를 유지했습니다.
- issue: 영혼들이 형상에 들어가는 것과 포로가 되는 것의 관계
  choice: 별개의 문장 흐름을 유지
  alternative: 형상에 들어갔기 때문에 포로가 되었다고 인과적으로 연결
  rationale: 원문 증거가 명시하지 않은 인과관계를 보충하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 시적 자기 선언에서는 반복되는 ‘나는 …인 이입니다’를 유지하여 원문의 병행법과 역설을 살렸고, 산문부에서는 일반 독자가 따라갈 수 있도록 문장을 적절히 나누었습니다. 직접 콥트어 검토가 아직 이루어지지 않았으므로 확정적 표현을 피했습니다.
