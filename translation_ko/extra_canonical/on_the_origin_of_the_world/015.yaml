  revised_text: '빛의 아담이 카오스 안으로 물러나기 전에, 권세자들은 그를 알아보고 태초의 어버이를 조롱했습니다. 태초의 어버이가 그들에게 “내가 바로 하나님이다. 나보다 먼저 존재한 이는 아무도 없다”라고 거짓말했기 때문입니다.


    그들은 그에게 다가가 물었습니다. “우리의 일을 망친 신이 바로 이자가 아닙니까?”


    그가 대답했습니다. “그렇습니다. 이자가 더는 우리의 일을 망치지 못하게 하고 싶다면, 자, 흙으로 사람을 만들어 우리를 섬기게 합시다. 우리 몸의 형상을 따라, 또 닮음[a], 이 존재의 닮음을 따라 만듭시다. 그러면 그가 자기 닮은 모습을 바라보고 그것을 사랑하게 되어, 더는 우리의 일을 망치지 않을 것입니다. 오히려 우리는 빛에서 태어난 자들을 이 아이온이 지속되는 내내 우리의 종으로 만들 것입니다.”[b]


    이 모든 일은 피스티스의 선견에 따라 일어났습니다. 그리하여 사람이 그의 닮은 모습으로 나타나고, 그들의 빚어진 형체 때문에 그들을 고발하게 하려는 것이었습니다. 그리고 그들의 빚어진 형체는 빛을 가두는 장소가 되었습니다.


    그때 권세자들은 사람을 만드는 데 필요한 지식을 얻었습니다. 사바오트와 함께 사는 소피아 조에는 그들이 하려는 일을 미리 내다보고 있었습니다. 그들이 눈멀었으므로, 소피아 조에는 그들의 결정을 조롱했습니다. 그들은 자기들의 이익에 거슬러 무지한 채 그를 만들었고, 자신들이 무슨 일을 하려는지 깨닫지 못했습니다.


    소피아 조에는 그들보다 앞서 자기 사람을 먼저 만들었습니다. 이는 그 사람이 권세자들이 빚은 형체에게 그들을 미워하는 법을 알려 주어, 그렇게 그들에게서 벗어나게 하려는 것이었습니다.


    그 교사는 다음과 같이 생겨났습니다. 소피아가 빛 한 방울이 내려가게 하자, 그것이 물 위로 흘러내렸고 곧바로 양성의 사람이 나타났습니다.[c] 소피아는 먼저 그 빛방울을 여성의 몸으로 빚었습니다. 그 뒤에는 그 몸을 사용하여, 전에 나타났던 어머니의 닮은 모습으로 그것을 빚었고, 열두 달 만에 완성했습니다.


    이렇게 양성의 사람이 생겨났습니다. 그리스인들은 이를 헤르마프로디테스라고 부르며, 히브리인들은 그 어머니를 ‘조에의 하와’, 곧 생명의 여성 교사라고 부릅니다.[d] 그녀의 아이는 주인인 피조물입니다. 그 뒤 권세자들은 그것을 [e] ‘짐승’이라고 불렀는데, 이는 그것이 이미 빚어진 피조물들을 미혹하게 하려는 것이었습니다. ‘짐승’의 뜻은 ‘교사’입니다. 그것이 모든 존재 가운데 가장 영리한 것으로 드러났기 때문입니다.[f]'
