translation:
  language: ko
  text: '빛의 아담이 카오스 안으로 물러나기 전에, 권세자들은 그를 알아보고 태초의 어버이를 조롱했습니다. 태초의 어버이가 그들에게 “내가 바로 하나님이다. 나보다 먼저 존재한 이는 아무도 없다”라고 거짓말했기 때문입니다.


    그들은 그에게 다가가 물었습니다. “우리의 일을 망친 신이 바로 이자가 아닙니까?”


    그가 대답했습니다. “그렇다. 이자가 더는 우리의 일을 망치지 못하게 하고 싶다면, 자, 흙으로 사람을 만들어 우리를 섬기게 하자. 우리 몸의 형상을 따라, 또 이 존재의 닮음을 따라 [a] 만들자. 그러면 그가 자기 닮은 모습을 바라보고 그것을 사랑하게 되어, 더는 우리의 일을 망치지 않을 것이다. 오히려 우리는 빛에서 태어난 자들을 이 아이온이 지속되는 내내 우리의 종으로 만들 것이다.”[b]


    이 모든 일은 피스티스의 선견에 따라 일어났습니다. 그리하여 사람이 그의 닮은 모습으로 나타나고, 권세자들이 빚어 놓은 형체 때문에 그들을 고발하게 하려는 것이었습니다. 그리고 그들이 빚은 형체는 빛을 가두는 장소가 되었습니다.


    그때 권세자들은 사람을 만드는 데 필요한 지식을 얻었습니다. 사바오트와 함께 사는 소피아 조에는 그들이 하려는 일을 미리 내다보고 있었습니다. 그들이 눈멀었으므로, 소피아 조에는 그들의 결정을 조롱했습니다. 그들은 자기들의 이익에 거슬러 무지한 채 그를 만들었고, 자신들이 무슨 일을 하려는지 깨닫지 못했습니다.


    소피아 조에는 그들보다 앞서 자기 사람을 먼저 만들었습니다. 이는 그 사람이 권세자들이 빚은 형체에게 그들을 미워하는 법을 알려 주어, 그렇게 그들에게서 벗어나게 하려는 것이었습니다.


    그 교사는 다음과 같이 생겨났습니다. 소피아가 빛 한 방울을 내려보내자, 그것이 물 위로 흘러내렸고 곧바로 양성의 사람이 나타났습니다.[c] 소피아는 먼저 그 빛방울을 여성의 몸으로 빚었습니다. 그 뒤에는 그 몸을 사용하여, 전에 나타났던 어머니의 닮은 모습으로 그것을 빚었고, 열두 달 만에 완성했습니다.


    이렇게 양성의 사람이 생겨났습니다. 그리스인들은 이를 헤르마프로디테스라고 부르며, 히브리인들은 그 어머니를 ‘조에의 하와’, 곧 생명의 여성 교사라고 부릅니다.[d] 그의 아이는 주인인 피조물입니다. 그 뒤 권세자들은 [e] 그것을 ‘짐승’이라고 불렀는데, 이는 그것이 빚어 놓은 피조물들을 미혹하게 하려는 것이었습니다. ‘짐승’의 뜻은 ‘교사’입니다. 그것이 모든 존재 가운데 가장 영리한 것으로 드러났기 때문입니다.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 자리에는 전승 본문의 결락 또는 불확실한 복원 표시가 있습니다.
    reason: 제공된 증언의 대괄호 표시를 보존하고 그 성격을 알립니다.
  - marker: b
    text: ‘아이온’은 이 문헌에서 우주적 시대나 영역을 가리킬 수 있는 전문 용어입니다.
    reason: 단순한 시간 표현으로 의미가 축소되는 것을 막습니다.
  - marker: c
    text: ‘양성의 사람’은 본문상 남성과 여성의 특성을 함께 지닌 인간 존재를 가리킵니다.
    reason: 현대 한국어에서 생길 수 있는 오해를 줄입니다.
  - marker: d
    text: ‘조에’는 그리스어로 ‘생명’을 뜻합니다. 따라서 ‘조에의 하와’는 본문이 이어서 풀이하는 ‘생명의 여성 교사’와 연결됩니다.
    reason: 고유명사의 언어유희와 본문 자체의 해석을 전달합니다.
  - marker: e
    text: 이 자리에는 전승 본문의 결락 또는 불확실한 복원 표시가 있습니다.
    reason: 제공된 증언의 두 번째 대괄호 표시를 보존합니다.
  - marker: f
    text: 마지막 문단에서 ‘그의 아이’, ‘그것’, ‘빚어 놓은 피조물들’이 각각 누구를 가리키는지는 문법적으로 불분명합니다. 번역은 이를 하나로 단정하지 않았습니다.
    reason: 실제 증언의 모호성과 신학적 긴장을 보존합니다.
lexical_decisions:
- source_word: authorities
  choice: 권세자들
  rationale: 우주적 지배 세력을 가리키는 전문적 의미를 유지하면서도 현대 한국어 독자가 이해할 수 있는 표현입니다.
- source_word: Primal Parent
  choice: 태초의 어버이
  rationale: 성별을 단정하지 않고 원초적 부모라는 의미를 보존했습니다.
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌의 우주론적 전문 용어가 단순히 ‘세대’나 ‘영원’으로 환원되지 않도록 음역했습니다.
- source_word: forethought
  choice: 선견
  rationale: 미리 내다보고 의도한 계획이라는 의미를 간결하게 전달하되, 별도의 위격인지 일반 명사인지 단정하지 않았습니다.
- source_word: androgynous human
  choice: 양성의 사람
  rationale: 남성과 여성의 성적 특성을 함께 지닌 존재라는 문맥을 보존하고 현대의 성 정체성 범주로 치환하지 않았습니다.
- source_word: Hermaphrodites
  choice: 헤르마프로디테스
  rationale: 그리스어 명칭이라는 본문의 설명을 살리기 위해 고유명사로 음역했습니다.
- source_word: the Beast
  choice: 짐승
  rationale: 본문의 명명과 이어지는 해석을 그대로 보존했습니다.
theological_decisions:
- issue: ‘하나님’이라고 자칭하는 태초의 어버이의 정체
  choice: 본문의 호칭과 비판을 그대로 두고 참 하나님과 동일시하거나 분리한다는 해설을 본문에 넣지 않았습니다.
  alternative: ‘거짓 신’ 또는 특정 영지주의적 통치자의 이름으로 명시할 수 있습니다.
  rationale: 본문 자체가 자칭과 거짓말이라는 긴장을 제시하므로 독자가 그 긴장을 접하도록 보존했습니다.
- issue: ‘그의 닮은 모습’에서 대명사의 지시 대상
  choice: ‘그의’를 유지했습니다.
  alternative: 빛의 아담, 태초의 어버이, 또는 다른 선행 존재로 지시 대상을 명시할 수 있습니다.
  rationale: 제공된 증거만으로 지시 대상을 확정하기 어려워 모호성을 해소하지 않았습니다.
- issue: 마지막 문단의 피조물·주인·짐승·교사의 관계
  choice: 문장의 대명사와 역설적 명칭을 가능한 한 그대로 보존했습니다.
  alternative: 각 대명사의 지시 대상을 특정 인물이나 뱀으로 명시할 수 있습니다.
  rationale: 영어 증언 자체가 이 구절의 모호성을 밝히며, 직접 콥트어 검토도 보류 중이므로 조화시키지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 자연스럽게 다듬되 고대 우주론의 전문 명칭인 피스티스, 소피아 조에, 사바오트, 아이온은 음역하거나 최소한으로 설명했습니다. 제공 자료는 공공 영역 영어 증언에 근거하며 직접적인 콥트어 대조가 보류 중이므로, 결락 표시와 대명사의 모호성을 의도적으로 보존한 잠정 출판 초안입니다.
