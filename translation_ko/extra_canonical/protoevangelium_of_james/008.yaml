  terminology: ‘주 하나님’, ‘성전’, ‘성소’, ‘지성소’, ‘대제사장’, ‘표징’, ‘홀아비’, ‘지팡이’의 선택은 일관되고 적절합니다. ‘방울 열두 개가 달린 예복’도 제공된 증언의 robe with twelve bells를 과도하게 특정하지 않아 안전합니다.
  issues:
