base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/008.yaml
  text: 'Her parents went down, marveling, praising, and glorifying the Lord God because the child had not turned back. Mary remained in the Temple of the Lord. She was nurtured like a dove and received food from the hand of an angel.


    When she became twelve years old, the priests held a council and said, “Look, Mary has been in the Temple of the Lord for twelve years. What should we do about her so that she will not defile the sanctuary of the Lord our God?” They said to the chief priest, “You stand at the altar of the Lord. Go in and pray about her. If the Lord God reveals anything to you, we will do it.”


    The chief priest went in, taking the robe with twelve bells into the Holy of Holies, and prayed about her. And look! An angel of the Lord stood nearby and said, “Zechariah, Zechariah, go out and assemble the widowers of the people, and let each of them bring a staff. The man whom the Lord God points out with a sign—she will be his wife.”


    The heralds went throughout the whole surrounding region of Judea and sounded the trumpet of the Lord. And look! All the men rushed in.'
translation:
  language: ko
  text: '## 야고보 원복음서 8장 — 열두 살이 된 마리아


    (1) 마리아의 부모는 아이가 뒤돌아오지 않은 것을 놀랍게 여기며 주 하나님을 찬양하고 영화롭게 하면서 내려갔습니다. 마리아는 주님의 성전에 머물렀습니다. 그는 비둘기처럼 양육받았고, 천사의 손에서 음식을 받아먹었습니다.


    (2) 마리아가 열두 살이 되었을 때, 제사장들이 회의를 열어 말했습니다. “보십시오. 마리아가 주님의 성전에 있은 지 열두 해가 되었습니다.[a] 그가 우리 주 하나님의 성소를 부정하게 하지 않도록 우리가 그를 어떻게 해야 하겠습니까?” 그들은 대제사장에게 말했습니다. “당신은 주님의 제단 앞에 서는 분입니다. 들어가서 그 아이를 두고 기도하십시오. 주 하나님께서 당신에게 무엇이든 밝혀 주시면, 우리가 그대로 행하겠습니다.”


    (3) 대제사장은 방울 열두 개가 달린 예복을 가지고 지성소로 들어가, 마리아를 두고 기도했습니다. 그런데 보십시오! 주님의 천사가 곁에 서서 말했습니다. “스가랴야, 스가랴야, 나가서 백성 가운데 홀아비들을 불러 모으고, 저마다 지팡이 하나씩을 가져오게 하여라. 주 하나님께서 표징으로 가리키시는 사람, 그 사람의 아내가 마리아가 될 것이다.”[b]


    전령들은 유대 온 지방으로 두루 내려가 주님의 나팔을 불었습니다. 그런데 보십시오! 남자들이 모두 급히 모여들었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 앞 문장은 마리아가 열두 살이 되었다고 하고, 이어지는 말은 그가 성전에 있은 지 열두 해가 되었다고 합니다. 이 시간 표현의 긴장을 본문 그대로 두었습니다.
    reason: 앞 장들의 연대와 조화시키려고 숫자나 표현을 임의로 고치지 않고, 제공된 증언에 나타나는 난점을 독자에게 알립니다.
  - marker: b
    text: 제공된 영어 증언은 선택된 사람이 마리아의 ‘남편’이 되고 마리아가 그의 ‘아내’가 된다고 표현합니다. 이를 ‘보호자’로 바꾸지 않았습니다.
    reason: 관계의 성격에 관한 본문의 명시적 표현과 후대의 해석 가능성을 구별합니다.
lexical_decisions:
- source_word: Temple / sanctuary / Holy of Holies
  choice: 성전 / 성소 / 지성소
  rationale: 영어 증언이 구별하는 세 공간 용어를 한국어에서도 구분하여, 건물 전체와 거룩한 구역과 가장 안쪽 성역의 차이를 보존했습니다.
- source_word: pollute / defile
  choice: 부정하게 하다
  rationale: 문맥상 의례적 부정을 가리킬 가능성이 있으므로 단순한 도덕적 ‘더럽힘’보다 제의적 함의를 살렸으며, 그 원인을 본문 밖에서 단정하지 않았습니다.
- source_word: robe with twelve bells
  choice: 방울 열두 개가 달린 예복
  rationale: 제사장 의복이라는 문맥을 자연스럽게 드러내되, 직접 그리스어 대조가 끝나지 않은 상태에서 특정 의복 명칭으로 과도하게 확정하지 않았습니다.
- source_word: widowers
  choice: 홀아비들
  rationale: 배우자를 잃은 남자들이라는 뜻을 분명히 보존하며, 더 넓은 의미의 독신 남성으로 일반화하지 않았습니다.
- source_word: staff
  choice: 지팡이
  rationale: 표징을 받기 위해 각 사람이 가져오는 물건을 전통적이고 자연스러운 한국어로 옮겼습니다.
- source_word: look!
  choice: 보십시오!
  rationale: 서사의 돌연한 전환과 주의 환기 기능을 살리기 위해 감탄 표현을 유지했습니다.
theological_decisions:
- issue: 마리아가 성소를 ‘부정하게’ 할 가능성
  choice: 본문의 제의적 우려를 그대로 번역하되 이유를 명시하지 않음
  alternative: 월경 때문에 성전을 더럽힐 것이라고 해설적으로 번역
  rationale: 제공된 증언 본문은 부정의 구체적 원인을 밝히지 않으므로, 배경 추론을 본문에 삽입하지 않았습니다.
- issue: 선택된 남자와 마리아의 관계
  choice: ‘그 사람의 아내가 마리아가 될 것이다’
  alternative: ‘그 사람이 마리아의 보호자가 될 것이다’
  rationale: 제공된 증언은 wife로 명시하므로 혼인 관계 표현을 보존했습니다. 후대 전승이나 조화 해석에 따라 보호자 관계로 약화하지 않았습니다.
- issue: 천사가 주는 음식
  choice: 서술을 그대로 유지
  alternative: 상징적·비유적 양육으로 설명
  rationale: 본문이 천사의 손에서 실제로 음식을 받았다고 서술하므로 해석적 완화를 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 종교 서사의 품위를 유지하되 지나치게 고어적인 어휘는 피했습니다. 반복되는 ‘보십시오!’와 ‘스가랴야, 스가랴야’를 보존해 구전적 서사 리듬을 살렸습니다. 다만 직접적인 그리스어 원문 검토가 아직 이루어지지 않았으므로, 본 초안은 제공된 공공 영역 영어 증언과 감수용 영어 POB를 바탕으로 한 잠정 번역입니다.
