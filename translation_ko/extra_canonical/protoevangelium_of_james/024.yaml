translation:
  language: ko
  text: '제24장 사가랴를 애도함


    (1) 인사드리는 시각이 되자 제사장들이 왔습니다. 그러나 사가랴는 관례대로 그들을 맞아 축복하지 않았습니다. 제사장들은 사가랴를 기다리며 서 있었습니다. 축복으로 그에게 인사하고 지극히 높으신 하나님께 영광을 돌리려는 것이었습니다.


    (2) 그러나 그가 오래도록 나오지 않자 모두 두려워했습니다. 그들 가운데 한 사람이 용기를 내어 성소 안으로 들어갔습니다. 그는 주님의 제단 곁에 피가 엉겨 있는 것을 보았습니다. 그때 이런 음성이 들렸습니다. “사가랴가 살해되었다. 그의 원수를 갚을 이가 올 때까지 그의 피는 지워지지 않을 것이다!”[a]


    그 사람은 이 말을 듣고 두려워했습니다. 그는 나가서 자신이 보고 들은 것을 제사장들에게 알렸습니다.


    (3) 그러자 제사장들은 용기를 내어 안으로 들어가 일어난 일을 보았습니다. 성전의 널판들이 울부짖었고,[b] 제사장들은 자기 옷을 위에서 아래까지 찢었습니다. 그들은 사가랴의 시신은 찾지 못했지만, 그의 피가 돌처럼 굳어 있는 것을 발견했습니다. 그들은 두려워하며 밖으로 나가, 사가랴가 살해되었다고 온 백성에게 알렸습니다. 백성의 모든 지파가 이 소식을 듣고 그를 애도하며 사흘 밤낮을 울었습니다.


    (4) 사흘 뒤에 제사장들은 사가랴를 대신할 사람을 정하려고 회의를 열었습니다. 제비는 시므온에게 떨어졌습니다. 성령께서 그에게, 육신을 입은 그리스도를 보기 전에는 죽음을 보지 않을 것이라고 알려 주셨기 때문입니다.[c]


    [a] “원수를 갚을 이”는 살해된 사가랴의 피에 대해 복수하거나 공의를 집행할 인물을 가리키지만, 그 인물이 누구인지는 본문이 밝히지 않습니다.


    [b] “성전의 널판들”은 제공된 영어 증언의 표현을 따른 잠정 번역입니다. 그리스어 사본 전통에 대한 직접 대조가 필요합니다.


    [c] “죽음을 보지 않을 것”과 “육신을 입은 그리스도”는 원문의 성경적 어감을 보존한 표현입니다. 뜻은 시므온이 육신으로 나타난 그리스도를 보기 전에는 죽지 않으리라는 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “원수를 갚을 이”는 살해된 사가랴의 피에 대해 복수하거나 공의를 집행할 인물을 가리키지만, 그 인물이 누구인지는 본문이 밝히지 않습니다.
    reason: ‘avenger’의 의미 범위와 인물의 불확정성을 설명합니다.
  - marker: b
    text: “성전의 널판들”은 제공된 영어 증언의 표현을 따른 잠정 번역입니다. 그리스어 사본 전통에 대한 직접 대조가 필요합니다.
    reason: 이례적인 건축 용어이며 직접적인 그리스어 검토가 아직 이루어지지 않았음을 투명하게 밝힙니다.
  - marker: c
    text: “죽음을 보지 않을 것”과 “육신을 입은 그리스도”는 원문의 성경적 어감을 보존한 표현입니다. 뜻은 시므온이 육신으로 나타난 그리스도를 보기 전에는 죽지 않으리라는 것입니다.
    reason: 직역적 관용구를 이해하도록 돕되 본문에서는 그 표현을 보존합니다.
lexical_decisions:
- source_word: hour of greeting
  choice: 인사드리는 시각
  rationale: 정해진 예전적 인사 시간일 가능성을 남기면서도, 제공된 증언의 표현을 과도하게 구체화하지 않았습니다.
- source_word: sanctuary
  choice: 성소
  rationale: 제단이 있는 거룩한 내부 공간이라는 문맥에 맞추고, 일반적인 ‘성전’과 구별했습니다.
- source_word: avenger
  choice: 원수를 갚을 이
  rationale: 개인적 복수자와 공의를 집행하는 보복자라는 의미 범위를 모두 열어 두며, 특정 인물로 단정하지 않았습니다.
- source_word: panels of the Temple
  choice: 성전의 널판들
  rationale: 기이한 의인화를 평범한 건축 묘사로 약화하지 않고 제공된 증언의 구체성을 보존했습니다. 다만 그리스어 직접 검토가 필요합니다.
- source_word: had turned to stone
  choice: 돌처럼 굳어 있는 것
  rationale: 피가 문자 그대로 돌로 변했다는 뜻과 돌같이 굳었다는 묘사 사이의 여지를 어느 정도 보존하면서 자연스러운 한국어로 옮겼습니다.
- source_word: the Christ in the flesh
  choice: 육신을 입은 그리스도
  rationale: ‘육신’이라는 신학적·성경적 어휘를 유지하되, 성육신에 관한 후대의 특정 교리 공식을 본문에 덧붙이지 않았습니다.
theological_decisions:
- issue: 사가랴의 피를 갚을 인물의 정체
  choice: ‘그의 원수를 갚을 이’로 번역하고 정체를 특정하지 않음
  alternative: 하나님이나 특정 메시아적 인물을 명시함
  rationale: 본문 자체가 그 인물을 밝히지 않으므로 모호성을 보존했습니다.
- issue: 시므온이 그리스도를 보는 방식
  choice: ‘육신을 입은 그리스도’를 본다고 표현함
  alternative: ‘성육신하신 그리스도’ 또는 ‘아기 예수’를 본다고 해석적으로 구체화함
  rationale: 제공된 증언의 표현과 신학적 긴장을 유지하고, 본문보다 더 구체적인 동일시를 피했습니다.
- issue: 성령의 전달 방식
  choice: ‘성령께서 그에게 … 알려 주셨다’
  alternative: 예언했다, 계시했다, 약속했다
  rationale: 전달 방식이 명시되지 않은 상태에서 어느 한 형태로 제한하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 합쇼체를 사용했습니다. 외경 문헌에 어울리는 장중함을 유지하되 지나치게 고어적인 표현은 피했습니다. 인명은 한국어 성경에서 널리 쓰이는 ‘사가랴’, ‘시므온’을 사용했습니다. 제공 자료에 그리스어 본문이 없고 원어 검토가 보류되어 있으므로, 특히 ‘인사드리는 시각’과 ‘성전의 널판들’은 공개 영역 영어 증언에 근거한 잠정 번역입니다.
