  naturalness: 현대 표준 한국어 합쇼체로 전반적으로 자연스럽습니다. 다만 ‘자세를 잡으십시오’보다 ‘자세를 취하십시오’가 공식적 지시문으로 조금 더 자연스럽고, 첫 문장의 ‘검사’와 뒤의 ‘검사했습니다’는 문맥상 필요한 신체 검사의 성격을 유지합니다.
  terminology: ‘무법’, ‘살아 계신 하나님’, ‘만유의 주님’, ‘경배합니다’, ‘구원과 기쁨’, ‘의롭다 하심을 받은 채’는 제공된 증거의 어조와 의미 범위를 대체로 잘 보존합니다. ‘의롭다 하심을 받은 채’는 δικαιόω 계열일 가능성이 있는 표현의 법정적·종교적 울림을 보존하되, 특정 교리 체계로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: (2)의 ‘give me the back to the poor’에 ‘돌려보내’라는 방향성을 부가함
    rationale: 영어 증거 자체가 불명확한 난구이며, ‘보내다’는 원문 증거에 없는 이동·추방의 뉘앙스를 더할 수 있습니다. ‘다시 … 내어 주십시오’가 ‘back’과 ‘to the poor’를 보존하면서 해석적 보충을 줄입니다.
  - severity: low
    issue: ‘자세를 잡으십시오’의 관용성
    rationale: 의미 오류는 아니나, 검사를 앞둔 공식적 지시로는 ‘자세를 취하십시오’가 더 자연스럽습니다.
