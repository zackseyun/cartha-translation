translation:
  language: ko
  text: '## 야고보 원복음서 20장 — 살로메의 검사


    **(1)** 산파가 안으로 들어가 말했습니다. “마리아, 자세를 잡으십시오. 당신에 관하여 결코 가볍지 않은 검사가 있을 것입니다.”


    살로메가 마리아를 검사했습니다. 그러자 살로메가 부르짖어 말했습니다. “나의 무법과 불신앙 때문에 화가 나에게 닥쳤습니다! 내가 살아 계신 하나님을 시험했기 때문입니다. 보십시오! 내 손이 불타며 내게서 떨어져 나가고 있습니다!”


    **(2)** 살로메는 주님 앞에 무릎을 꿇고 말했습니다. “내 조상들의 하나님, 제가 아브라함과 이삭과 야곱의 자손임을 기억해 주십시오. 이스라엘 백성 앞에서 저를 본보기로 삼지 마시고, 저를 가난한 이들에게 돌려보내 주십시오.[a] 주님, 제가 주님의 이름으로 사람들을 고쳐 주었고 제 품삯을 주님에게서 받았음을 주님께서 아십니다.”


    **(3)** 보십시오! 주님의 천사가 나타나 살로메에게 말했습니다. “살로메, 살로메, 만유의 주님께서 네 기도를 들으셨다. 네 손을 아기에게 가져가 그를 들어 올려라. 그러면 네가 구원과 기쁨을 얻을 것이다.”


    **(4)** 보십시오! 살로메는 기뻐하며 아기에게 가서 그를 들어 올리고 말했습니다. “이스라엘에 위대한 왕이 태어나셨으므로, 나는 그분께 경배합니다.” 그러자 곧 살로메가 나았고, 의롭다 하심을 받은 채 동굴에서 나갔습니다.[b]


    보십시오! 한 음성이 말했습니다. “살로메, 살로메, 그 아기가 예루살렘에 들어갈 때까지 네가 본 놀라운 일들을 알리지 마라.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “저를 가난한 이들에게 돌려보내 주십시오”라는 구절은 제공된 번역 증거에서도 뜻이 분명하지 않습니다. 어려운 표현을 해석으로 매끄럽게 바꾸지 않고 그대로 살렸습니다. 그리스어 사본 전통에 대한 직접 검토가 필요합니다.
    reason: 의미가 불확실한 난구를 독단적으로 해결하지 않고 독자에게 알리기 위함입니다.
  - marker: b
    text: “의롭다 하심을 받은 채”는 ‘나았다’와 별도로 이어지는 표현입니다. 이것이 정확히 어떤 종류의 인정이나 회복을 뜻하는지는 본문이 더 설명하지 않습니다.
    reason: 치유와 칭의적 표현 사이의 구별 및 신학적 긴장을 보존하기 위함입니다.
lexical_decisions:
- source_word: position yourself
  choice: 자세를 잡으십시오
  rationale: 검사를 앞두고 몸의 자세를 취하라는 직접적인 지시를 자연스럽게 전달하되, 원문 증거 없이 구체적인 검사 자세를 덧붙이지 않았습니다.
- source_word: no small test
  choice: 결코 가볍지 않은 검사
  rationale: 완곡한 부정 표현을 보존하면서도 현대 독자가 이것이 실제 검사를 가리킨다는 점을 이해할 수 있게 했습니다.
- source_word: lawlessness
  choice: 무법
  rationale: 단순한 실수보다 하나님을 거스른 행위라는 강한 윤리적 의미를 유지했습니다.
- source_word: the Lord of All
  choice: 만유의 주님
  rationale: 보편적 주권을 나타내는 칭호를 간결하고 장중하게 옮겼습니다.
- source_word: worship
  choice: 경배합니다
  rationale: 아기에게 향한 종교적 존숭의 강도를 약화하지 않았습니다.
- source_word: justified
  choice: 의롭다 하심을 받은 채
  rationale: 단순히 치료되었다거나 용서받았다고 바꾸지 않고 법정적·신학적 함의를 가진 표현을 보존했습니다.
theological_decisions:
- issue: 살로메가 아기를 향해 한 행위의 성격
  choice: 그분께 경배합니다
  alternative: 그분께 절합니다
  rationale: 제공된 증거의 ‘worship’가 나타내는 종교적 의미를 보존하되, 이 행위에 관한 후대의 교리적 설명은 덧붙이지 않았습니다.
- issue: ‘구원과 기쁨’에서 구원의 범위
  choice: 구원과 기쁨을 얻을 것이다
  alternative: 치유와 기쁨을 얻을 것이다
  rationale: 문맥상 육체적 치유가 포함되지만 ‘salvation’을 치유로만 제한하지 않아 본문의 신학적 폭과 긴장을 유지했습니다.
- issue: 동굴을 떠날 때의 상태
  choice: 의롭다 하심을 받은 채
  alternative: 정당함을 인정받고
  rationale: ‘justified’를 치유와 구별하여 옮기고, 그 의미가 무죄 판정·용서·회복 가운데 어느 하나로만 축소되지 않게 했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 장중하되 쉽게 읽히도록 했고, 직접 인용 안에서는 인물 관계와 발화 상황에 따라 존댓말과 명령형을 구분했습니다. 제공 자료가 공공 영역 영어 번역 증거이며 그리스어 원문 직접 검토가 아직 이루어지지 않았으므로, 특히 난구는 잠정적으로 옮기고 각주로 한계를 밝혔습니다.
