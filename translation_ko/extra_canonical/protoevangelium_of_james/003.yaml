translation:
  language: ko
  text: '(1) 안나는 하늘을 뚫어지게 바라보다가 월계수에 있는 참새 둥지를 보았습니다. 안나는 슬피 탄식하며 혼잣말로 말했습니다.


    “아, 내 신세야! 누가 나를 낳았는가? 어떤 모태가 나를 품어 낳았는가? 나는 이스라엘 백성 앞에서 저주거리로 태어나 멸시를 받았다. 사람들은 나를 조롱하고 내 하나님이신 주님의 성전에서 나를 내쫓았다.


    (2) “아, 내 신세야! 나는 무엇과 같은가? 나는 하늘의 새들과도 같지 않구나. 주님, 하늘의 새들조차 주님 앞에서 새끼를 낳기 때문이다.


    “아, 내 신세야! 나는 무엇과 같은가? 나는 가축들과도 같지 않구나. 주님, 가축들조차 주님 앞에서 새끼를 낳기 때문이다.


    “아, 내 신세야! 나는 무엇과 같은가? 나는 땅의 들짐승들과도 같지 않구나. 주님, 땅의 들짐승들조차 주님 앞에서 새끼를 낳기 때문이다.


    (3) “아, 내 신세야! 나는 무엇과 같은가? 나는 이 물들과도 같지 않구나. 주님, 이 물들조차 고요하면서도 출렁이고, 그 속의 물고기들은 주님을 찬양하기 때문이다.


    “아, 내 신세야! 나는 무엇과 같은가? 나는 이 땅과도 같지 않구나. 주님, 땅은 제때에 열매를 내어 주님을 찬양하기 때문이다.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 그리스어 사본 전통에 대한 직접 대조 검토는 아직 이루어지지 않았습니다.
    reason: 직접적인 원어 검토가 보류 중이라는 자료상의 한계를 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: looked intently toward heaven
  choice: 하늘을 뚫어지게 바라보다가
  rationale: 지속적이고 간절한 시선을 현대 한국어로 자연스럽게 드러냈습니다.
- source_word: laurel tree
  choice: 월계수
  rationale: 식물의 구체적 명칭을 보존했습니다.
- source_word: as a curse before the people of Israel
  choice: 이스라엘 백성 앞에서 저주거리로
  rationale: 안나 자신이 문자 그대로 저주 그 자체라는 뜻으로 단정하지 않고, 공동체 안에서 저주받은 존재처럼 취급된다는 원문의 긴장을 보존했습니다.
- source_word: fruitful
  choice: 새끼를 낳다 / 열매를 내다
  rationale: 동물과 땅에 동일한 영어 표현이 반복되지만, 한국어에서는 각각의 대상에 맞는 자연스러운 결실 표현을 사용하면서 불임과 풍요의 대조를 유지했습니다.
- source_word: animals / wild beasts of the earth
  choice: 가축들 / 땅의 들짐승들
  rationale: 서로 이어지는 두 동물 범주가 겹치지 않도록 길들인 짐승과 야생 짐승의 대조로 옮겼습니다.
- source_word: serene yet churn
  choice: 고요하면서도 출렁이고
  rationale: 정적과 움직임이 함께 나타나는 다소 역설적인 표현을 해소하지 않고 보존했습니다.
- source_word: bless you
  choice: 주님을 찬양하다
  rationale: 피조물이 하나님께 복을 준다는 오해를 피하면서, 하나님을 송축하고 높인다는 문맥상의 의미를 현대 한국어로 전달했습니다.
theological_decisions:
- issue: 안나가 자신을 ‘저주’라고 부르는 표현
  choice: 저주거리로 태어나다
  alternative: 저주받은 자로 태어나다
  rationale: 안나의 탄식을 신적 판결에 관한 객관적 선언으로 확정하지 않고, 이스라엘 공동체 앞에서 겪은 수치와 배척에 초점을 두었습니다.
- issue: 피조물의 ‘결실’과 안나의 불임 사이의 대조
  choice: 새와 짐승은 ‘새끼를 낳다’, 땅은 ‘열매를 내다’로 구체화
  alternative: 모두 ‘결실하다’로 통일
  rationale: 생식과 땅의 소산을 잇는 수사적 평행은 유지하되, 일반 독자가 즉시 이해할 수 있는 자연스러운 한국어를 택했습니다.
- issue: 물고기가 주님을 ‘bless’하는 행위
  choice: 주님을 찬양하다
  alternative: 주님을 송축하다
  rationale: 신학적 방향성을 보존하면서도 일상 독자에게 더 분명한 표현을 사용했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체의 서술과 탄식 속 해라체 독백을 조합했습니다. 반복되는 ‘아, 내 신세야!’와 ‘나는 무엇과 같은가?’를 유지하여 애가의 운율과 점층적 구조를 살렸으며, 전반적으로 자연스럽고 장중하되 지나치게 고어적인 표현은 피했습니다.
