    rationale: ‘as a curse before the people of Israel’의 수치와 배척은 잘 드러나지만, ‘저주거리’는 조롱의 대상이라는 뜻을 앞당겨 넣습니다. ‘이스라엘 백성 앞에서 저주받은 자로 태어났다’가 영어 증언의 표현을 더 직접적으로 보존합니다.
