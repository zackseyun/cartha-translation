translation:
  language: ko
  text: '야고보 원복음서 — 제1장 요아킴의 곤경


    (1) 이스라엘 열두 지파의 기록에 따르면, 요아킴은 매우 부유한 사람이었습니다. 그는 주님께 바치는 예물을 두 몫으로 드리며 마음속으로 말했습니다. “한 몫은 온 백성을 위하여 내 넉넉한 소유에서 드리고, 다른 한 몫은 내가 용서받고 속죄하기 위하여 주 하나님께 드려야겠다.”


    (2) 마침 주님의 큰 날이 다가오자 이스라엘 백성이 예물을 바치고 있었습니다. 그러나 르우벨이 요아킴 앞을 가로막고 말했습니다. “당신은 이스라엘에서 자식을 낳지 못했으므로, 먼저 예물을 바치는 것이 옳지 않습니다.”


    (3) 요아킴은 몹시 슬퍼하여 백성의 열두 지파 기록을 찾아가면서 마음속으로 말했습니다. “이스라엘의 열두 지파 기록을 살펴보고, 이스라엘에서 자식을 낳지 못한 사람이 나뿐인지 알아보아야겠다.” 그는 그 기록을 조사하여, 이스라엘의 의로운 사람들은 모두 자녀를 두었다는 것을 알게 되었습니다. 그리고 족장 아브라함이 말년에 이르렀을 때 주 하나님께서 그에게 아들 이삭을 주셨다는 사실을 기억했습니다.


    (4) 요아킴은 몹시 슬퍼하여 아내에게 돌아가지 않고 광야로 들어가 그곳에 장막을 쳤습니다. 그는 사십 일 밤낮을 금식하며 마음속으로 말했습니다. “주 나의 하나님께서 나를 돌아보실 때까지 먹거나 마시러 내려가지 않겠다. 기도가 나의 음식과 음료가 될 것이다.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 그리스어 사본 전승에 대한 직접 대조는 아직 이루어지지 않았습니다. 특히 1절과 3절의 ‘기록’, 2절의 ‘주님의 큰 날’, 4절의 ‘나를 돌아보실’은 그리스어 검토에 따라 조정될 수 있습니다.
    reason: 원자료 자체가 그리스어 원문 검토 대기 상태임을 독자에게 알리고, 주요 불확실성을 투명하게 표시하기 위해서입니다.
lexical_decisions:
- source_word: histories / (history)
  choice: 기록
  rationale: 제공된 증거에서 ‘history’는 열두 지파에 관한 계보·문서·기록을 가리킬 수 있습니다. 한국어 본문에서는 자연스러운 ‘기록’을 택하되, 직접적인 그리스어 대조가 아직 이루어지지 않았으므로 특정 문서 유형으로 좁히지 않았습니다.
- source_word: doubled the gifts
  choice: 예물을 두 몫으로 드리며
  rationale: 단순히 양을 두 배로 늘렸다는 뜻보다 이어지는 두 가지 목적에 따라 두 몫을 바쳤다는 문맥을 살렸습니다.
- source_word: forgiveness, to atone for me
  choice: 내가 용서받고 속죄하기 위하여
  rationale: 용서와 속죄라는 두 표현의 신학적 긴장을 없애지 않고 모두 보존했습니다.
- source_word: great day of the Lord
  choice: 주님의 큰 날
  rationale: 특정 절기명이나 종말론적 전문 용어로 단정하지 않고 증거의 표현을 가깝게 유지했습니다.
- source_word: considers me
  choice: 나를 돌아보실
  rationale: 한국어로 자연스러우면서도 하나님께서 요아킴의 처지를 살피고 응답하신다는 의미를 담습니다. ‘인정하다’나 ‘받아들이다’로 의미를 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: 요아킴의 추가 예물과 속죄의 관계
  choice: ‘용서받고 속죄하기 위하여’라고 번역하여 예물의 목적에 관한 진술을 그대로 제시했습니다.
  alternative: 예물이 죄를 자동으로 제거한다는 교리적 설명을 덧붙이거나, 반대로 단순한 감사 예물로 약화할 수 있습니다.
  rationale: 본문의 고대 종교적 언어를 보존하되 특정 교단의 희생·공로 교리를 끌어들이지 않았습니다.
- issue: 자녀 없음과 예물 봉헌 자격의 관계
  choice: 르우벨의 발언으로만 제시하고 서술자의 승인처럼 표현하지 않았습니다.
  alternative: 자녀 없음이 실제 율법상 결격 사유였다고 단정할 수 있습니다.
  rationale: 본문은 르우벨의 판단을 인용할 뿐이므로 그 정당성을 번역자가 확정해서는 안 됩니다.
- issue: ‘주님의 큰 날’의 성격
  choice: 모호한 표현을 그대로 유지했습니다.
  alternative: 유월절·속죄일 같은 특정 절기 또는 최후 심판의 날로 명시할 수 있습니다.
  rationale: 제공된 영어 증거와 아직 검토되지 않은 그리스어 전승만으로는 어느 해석도 확정하기 어렵습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 ‘-었습니다’, 인용된 독백은 자연스러운 ‘-겠다/-것이다’를 사용했습니다. 인명은 한국어 성서 전통에 익숙한 ‘요아킴, 르우벨, 아브라함, 이삭’을 채택했습니다. 제공된 영어 증언이 유일한 직접 drafting basis이므로 번역을 확정본처럼 과도하게 다듬지 않고 원문 검토 대기 상태를 각주로 밝혔습니다.
