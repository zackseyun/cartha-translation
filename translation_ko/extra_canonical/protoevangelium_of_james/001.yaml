  - severity: low
    issue: 4절의 ‘아내에게 돌아가지 않고’
    rationale: source는 ‘아내에게 가지 않고’라고만 하며, 이전에 아내와 떨어져 있었거나 귀가해야 했다는 전제를 명시하지 않습니다.
