  source_fidelity: 전반적으로 제공된 영어 증언의 의미를 충실히 옮겼습니다. 그러나 2절의 ‘stood before him’은 단순히 그의 앞에 서서 이의를 제기한 것이므로 ‘앞을 가로막고’는 과도한 동작을 보탭니다. 또한 요아킴에 대해 ‘자식을 낳지 못했다’고 하면 남성 주어와 어울리지 않으므로 ‘자녀가 없었다’로 고쳐야 합니다. 4절의 ‘didn’t go to his wife’도 귀가를 전제하는 ‘아내에게 돌아가지 않고’보다 원문의 비특정적 표현을 보존하는 ‘아내에게 가지 않고’가 안전합니다.
  naturalness: 현대 표준 한국어 합쇼체로 대체로 자연스럽습니다. 다만 ‘기록을 찾아가면서’는 문서 또는 기록을 찾아 열람하는 문맥에서 다소 어색하므로 ‘기록을 찾아가’로 다듬었습니다. 인용된 독백의 ‘-겠다/-것이다’는 자연스럽고 적절합니다.
  terminology: ‘요아킴, 르우벨, 아브라함, 이삭’, ‘예물’, ‘주 하나님’, ‘속죄’, ‘광야’, ‘장막’은 적절합니다. ‘기록’은 영어 증언의 괄호 친 (history)가 가리키는 문서 유형의 불확실성을 불필요하게 특정하지 않는 안전한 선택입니다. 관련 잠정성 각주는 해당 표현들에 직접 표지하여 앵커와 주석 범위를 일치시켰습니다.
