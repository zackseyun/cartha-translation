translation:
  language: ko
  text: '(1) 그때 아우구스투스 왕에게서 유대 베들레헴에 사람이 얼마나 있는지 등록하라는 명령이 내려왔습니다.[a]


    요셉이 말했습니다. “내 아들들은 등록하겠습니다. 그러나 이 아이는 어떻게 해야 합니까? 이 아이를 무엇으로 등록해야 합니까? 내 아내로 등록하자니 부끄럽고, 내 딸로 등록하자니 이스라엘 백성이 이 아이가 내 딸이 아니라는 것을 압니다. 오늘은 주님의 날이니, 주님께서 원하시는 대로 하겠습니다.”


    (2) 요셉은 나귀에 안장을 얹고 마리아를 그 위에 태웠습니다. 그의 아들이 나귀를 이끌고 사무엘이 뒤따랐습니다.


    그들이 삼 마일쯤 되는 곳에 가까이 이르렀을 때,[b] 요셉이 돌아보니 마리아가 슬퍼하고 있었습니다. 요셉은 “아마도 그 아이 안에 계신 이가 그 아이를 괴롭게 하는 모양이다”라고 생각했습니다.


    요셉이 다시 돌아보니 마리아가 웃고 있었습니다. 그래서 마리아에게 말했습니다. “마리아, 어찌 된 일입니까? 내가 보니 그대의 얼굴이 한때는 웃다가도 또 슬퍼합니다.”


    마리아가 그에게 말했습니다. “제 눈에 두 백성이 보이기 때문입니다.[c] 하나는 울며 통곡하고, 하나는 기뻐하며 크게 즐거워합니다.”


    (3) 그들이 길 한가운데에 이르렀을 때, 마리아가 요셉에게 말했습니다. “요셉, 저를 나귀에서 내려 주십시오. 제 안에 계신 이가 밖으로 나오려고 밀어붙이십니다.”


    요셉은 마리아를 나귀에서 내려 주고 말했습니다. “이 황망한 처지에 내가 그대를 어디로 데려가 몸을 피하게 하겠습니까? 이곳은 광야입니다.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직접 그리스어 대조가 아직 이루어지지 않은 잠정 번역입니다. ‘아우구스투스 왕’과 등록 명령의 범위는 제공된 영어 증언을 따랐습니다.
    reason: 원어 검토 미완료 및 정경 병행 본문과의 무의식적 조화를 방지하기 위함입니다.
  - marker: b
    text: ‘삼 마일’은 출발점에서 약 삼 마일 떨어진 지점 또는 길의 셋째 이정표를 뜻할 수 있습니다.
    reason: 거리 표현의 가능한 의미를 보존하기 위함입니다.
  - marker: c
    text: ‘제 눈에’라는 특이한 표현은 환상 가운데 본다는 뜻일 수 있습니다. ‘두 백성’은 ‘두 사람’ 또는 ‘두 무리’로도 옮길 수 있습니다.
    reason: 제공된 영어 증언의 비정상적 표현과 수적·집단적 모호성을 독단적으로 해소하지 않기 위함입니다.
  - marker: d
    text: ‘황망한 처지’에 해당하는 표현은 출산이 임박한 마리아의 난처하고 다급한 상태를 가리키는 것으로 보이지만, 정확한 뉘앙스는 그리스어 대조가 필요합니다.
    reason: 불확실한 어휘의 의미를 투명하게 알리기 위함입니다.
lexical_decisions:
- source_word: Augustus the king
  choice: 아우구스투스 왕
  rationale: 제공된 증거의 칭호를 그대로 보존하여, 정경 누가복음의 ‘황제’라는 익숙한 표현으로 평준화하지 않았습니다.
- source_word: this child
  choice: 이 아이
  rationale: 요셉이 마리아를 가리키는 다소 거리감 있는 표현을 보존했습니다.
- source_word: the one inside her
  choice: 그 아이 안에 계신 이
  rationale: 태아를 가리키는 완곡한 표현을 유지하면서 존대 지시를 사용해 문맥의 존엄성을 살렸습니다.
- source_word: two people
  choice: 두 백성
  rationale: ‘울며 통곡하는 쪽’과 ‘기뻐하는 쪽’이라는 집단적 대조에 맞추어 번역했으나, 원문 검토 전의 잠정 선택임을 각주로 밝혔습니다.
- source_word: awkwardness
  choice: 황망한 처지
  rationale: 출산이 임박한 곤란하고 다급한 상황을 현대 한국어로 자연스럽고 품위 있게 나타냈으며, 신체적 의미로 과도하게 구체화하지 않았습니다.
- source_word: wilderness
  choice: 광야
  rationale: 사람이 거주하거나 피신할 곳이 없는 황량한 장소라는 성서적 어감을 유지했습니다.
theological_decisions:
- issue: 마리아가 본 ‘두 사람/두 백성’의 정체
  choice: 두 백성으로 옮기되 해석하지 않음
  alternative: 두 사람, 두 무리 또는 이스라엘과 이방인으로 명시
  rationale: 본문 자체가 그 정체를 밝히지 않으므로 특정 구원사적 해석을 본문에 넣지 않았습니다.
- issue: ‘주님의 날’의 의미
  choice: 오늘은 주님의 날
  alternative: 주님께서 정하실 날 또는 심판의 날로 해설
  rationale: 시간적·신학적 의미가 불확실하므로 표현의 긴장을 그대로 보존했습니다.
- issue: 태중의 존재에 대한 표현
  choice: 제 안에 계신 이
  alternative: 아기 또는 예수님
  rationale: 본문이 이름이나 신분을 직접 명시하지 않으므로 독자가 문맥에서 이해하도록 두었습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 간결하고 품위 있게 유지하고, 대화에서는 인물 관계를 지나치게 현대화하지 않으면서도 일반 독자가 이해할 수 있도록 했습니다. 본문은 제공된 공공 영역 영어 증언에 근거한 잠정 초안이며, 그리스어 원문 검토 후 특히 ‘두 사람/백성’, ‘삼 마일’, ‘awkwardness’에 해당하는 표현을 재검토해야 합니다.
