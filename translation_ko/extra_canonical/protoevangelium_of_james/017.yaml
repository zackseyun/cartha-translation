    요셉이 다시 돌아보니 마리아가 웃고 있었습니다. 그래서 마리아에게 말했습니다. “마리아, 어찌 된 일입니까? 내가 보니 그대의 얼굴은 한때 웃고, 또 한때 슬퍼합니다.”


    마리아가 그에게 말했습니다. “제 눈에는 두 사람이 보이기 때문입니다.[b] 한 사람은 울고 슬퍼하며, 한 사람은 기뻐하고 크게 즐거워합니다.”


    (3) 그들이 길 한가운데에 이르렀을 때, 마리아가 요셉에게 말했습니다. “요셉, 저를 나귀에서 내려 주십시오. 제 안에 있는 이가 밖으로 나오려고 밀어붙입니다.”


