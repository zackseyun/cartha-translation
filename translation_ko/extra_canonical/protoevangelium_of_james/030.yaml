base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/030.yaml
  text: '(1) And look! Joseph was preparing to leave for Judea when a great commotion arose in Bethlehem of Judea. For magi came, saying, “Where is the king of the Jews? For we saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers and sent for the magi, and they told him about the star.


    (3) And look! They saw stars in the East. The stars led the magi until they came to the cave, and the star stood over the child’s head. When the magi saw him with his mother Mary, they took gifts from their bags: gold, frankincense, and myrrh.


    After being warned by the angel, they returned to their country by another way.'
translation:
  language: ko
  text: '(1) 보십시오! 요셉이 유대로 떠날 채비를 하고 있을 때, 유대의 베들레헴에 큰 소동이 일어났습니다. 박사들[a]이 와서 말했습니다. “유대인의 왕이 어디에 계십니까? 우리가 동방에서 그분의 별을 보고 그분께 경배하러 왔습니다.”


    (2) 헤롯은 이 말을 듣고 불안해했습니다. 그는 관리들을 보내고 박사들을 불러오게 했으며, 박사들은 그에게 그 별에 관해 말해 주었습니다.


    (3) 보십시오! 그들은 동방에서 별들을 보았습니다.[b] 그 별들은 박사들을 이끌어 동굴에 이르게 했고, 그 별은 아기의 머리 위에 멈추어 섰습니다. 박사들은 아기가 그의 어머니 마리아와 함께 있는 것을 보고, 자루에서 예물 곧 금과 유향과 몰약을 꺼냈습니다.


    그들은 천사에게 경고를 받고 다른 길로 자기 나라에 돌아갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘박사들’은 현대의 학위 소지자라기보다, 별을 관찰하고 해석하던 동방의 지혜자들을 가리킵니다.
    reason: ‘magi’의 역사적 의미를 밝혀 현대 한국어의 오해를 줄입니다.
  - marker: b
    text: 이 대목은 먼저 복수인 ‘별들’이라고 했다가, 이어서 단수인 ‘그 별’이라고 말합니다.
    reason: 제공된 본문 증거에 나타나는 수의 변화를 보존하고 독자에게 알립니다.
lexical_decisions:
- source_word: magi
  choice: 박사들
  rationale: 고대의 점성술·제사·학문과 관련된 이들을 가리키는 말입니다. 한국어 성서 전통에서 널리 이해되는 ‘박사들’을 사용하되, 현대적 학위 소지자라는 오해를 막기 위해 각주를 붙였습니다.
- source_word: worship
  choice: 경배하다
  rationale: 왕적 인물 앞에 엎드려 예를 표하는 행위와 종교적 숭배의 함의를 함께 열어 두는 격조 있는 표현입니다.
- source_word: commotion
  choice: 큰 소동
  rationale: 공동체 안에 일어난 두드러진 동요와 소란을 자연스러운 현대 한국어로 나타냅니다.
- source_word: cave
  choice: 동굴
  rationale: 이 작품의 탄생 장소 전승을 그대로 보존하며, 정경 복음서의 ‘집’이나 ‘구유’로 바꾸지 않았습니다.
- source_word: frankincense
  choice: 유향
  rationale: 향료로 쓰인 수지를 가리키는 전통적이고 정확한 성서 용어입니다.
- source_word: myrrh
  choice: 몰약
  rationale: 향료 및 약재로 사용된 수지를 가리키는 통용 성서 용어입니다.
theological_decisions:
- issue: 박사들이 아기에게 한 행위의 성격
  choice: 그분께 경배하러
  alternative: 그분께 절하러
  rationale: 원문 계열의 표현은 왕에게 드리는 존경과 종교적 경배 양쪽의 뉘앙스를 지닐 수 있으므로, 문맥의 높은 존숭을 보존하되 그 의미를 교리적으로 더 좁혀 설명하지 않았습니다.
- issue: 복수 ‘별들’에서 단수 ‘별’로 바뀌는 표현
  choice: ‘별들’을 먼저 쓰고 이어서 ‘그 별’을 사용
  alternative: 전체를 단수 ‘별’로 통일
  rationale: 전승 본문의 문법적·서사적 긴장을 교정하거나 조화시키지 않고 그대로 드러냈습니다.
- issue: 천사의 경고 방식
  choice: 천사에게 경고를 받고
  alternative: 꿈에 천사의 지시를 받고
  rationale: 제공된 증거에는 꿈이라는 수단이 명시되지 않으므로 정경 마태복음의 세부를 끌어오지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 반복되는 ‘보십시오!’는 서사의 주의를 환기하는 표현으로 살렸습니다. 고유한 외경 전승의 ‘동굴’과 복수·단수 별의 전환을 정경 본문에 맞추어 조화시키지 않았습니다. 다만 직접 그리스어 대조가 아직 보류된 자료이므로, 제공된 공공 영역 영어 증언과 감수용 영어 POB를 바탕으로 한 잠정 출판 초안입니다.
