base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/022.yaml
  text: '(1) When Herod realized that the magi had tricked him, he became angry. He sent out his killers and ordered them to kill every infant two years old and younger.


    (2) When Mary heard that the infants were being killed, she was afraid. She took her child, wrapped him in cloths, and laid him in a feeding trough for cows.


    (3) When Elizabeth heard that they were looking for John, she took him into the hills and searched for a place to hide him, but there was nowhere to hide. Then Elizabeth groaned and said, “Mountain of God, take in a mother with her child,” because Elizabeth could not climb any higher. Immediately, the mountain split open and received her, and a light shone through the mountain for her. For an angel of the Lord was with them, protecting them.'
translation:
  language: ko
  text: '(1) 헤롯은 박사들이 자기를 속였다는 것을 알고 몹시 화가 났습니다. 그는 살해자들을 보내어 두 살 이하의 아기들을 모두 죽이라고 명령했습니다.


    (2) 마리아는 아기들이 죽임을 당하고 있다는 소식을 듣고 두려워했습니다. 그는 자기 아기를 데려다가 포대기로 싸서 소 여물통에 눕혔습니다.


    (3) 엘리사벳은 사람들이 요한을 찾고 있다는 소식을 듣고 그를 데리고 산지로 올라가 숨길 곳을 찾아보았지만, 숨을 곳이 없었습니다. 그때 엘리사벳은 신음하며 말했습니다. “하나님의 산이여, 아이를 데리고 있는 어머니를 받아 주십시오.” 엘리사벳은 더 높이 올라갈 수 없었기 때문입니다. 그러자 곧 산이 갈라져 그를 받아들였고, 산속에서 그를 위하여 빛이 비쳤습니다. 주님의 천사가 그들과 함께하며 그들을 지켜 주고 있었기 때문입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 그리스어 필사본 전통에 대한 직접 검토가 필요합니다.
    reason: 원문 언어 검토가 아직 이루어지지 않았다는 자료상의 한계를 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: magi
  choice: 박사들
  rationale: 한국어 성서 독자에게 익숙한 표현을 사용하되, 이들이 왕이나 특정한 수의 인물이었다는 정보를 덧붙이지 않았습니다.
- source_word: killers
  choice: 살해자들
  rationale: 단순한 ‘군인들’로 구체화하지 않고, 살해 임무를 받은 자들이라는 원문의 거친 의미를 보존했습니다.
- source_word: infants
  choice: 아기들
  rationale: 일상적으로 이해하기 쉬우면서 어린아이들을 가리키는 문맥에 자연스러운 표현입니다.
- source_word: manger for cows
  choice: 소 여물통
  rationale: 전통적 용어인 ‘구유’보다 현대 독자가 즉시 이해하기 쉬운 구체적 표현을 택했습니다.
- source_word: Mountain of God
  choice: 하나님의 산
  rationale: 산을 직접 부르는 호격을 유지하고 소유·관계 표현의 신학적 함의를 임의로 풀어 쓰지 않았습니다.
- source_word: took/received her
  choice: 그를 받아들였고
  rationale: 산이 엘리사벳을 받아 숨겨 주는 초자연적 장면을 자연스럽게 전달하며, 목적어나 방식에 없는 세부를 보태지 않았습니다.
theological_decisions:
- issue: 산이 갈라지고 빛이 비친 사건의 서술 방식
  choice: 기적을 본문의 사건 서술 그대로 옮김
  alternative: 환상이나 상징으로 해석하여 번역함
  rationale: 본문은 이를 실제 사건처럼 서술하므로 번역에서 그 성격을 재해석하지 않았습니다.
- issue: 주님의 천사의 보호 대상
  choice: 복수형 ‘그들’을 유지함
  alternative: 엘리사벳과 요한 또는 엘리사벳만으로 명시함
  rationale: 공급된 증거의 복수 대명사가 가리키는 범위를 번역자가 단정하지 않고 genuine ambiguity를 보존했습니다.
- issue: 마지막 원인절의 관계
  choice: 천사의 동행과 보호가 앞선 구출 장면의 근거가 되도록 ‘때문입니다’로 연결함
  alternative: 독립적인 부연 문장으로 처리함
  rationale: 영어 증거의 ‘For’가 나타내는 설명적·인과적 관계를 자연스러운 한국어로 드러냈습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서사는 간결하게 유지하고, 직접 인용에서는 산을 부르는 호격과 간청의 어조를 살렸습니다. 전통적으로 익숙한 인명 표기인 헤롯, 마리아, 엘리사벳, 요한을 사용했습니다.
