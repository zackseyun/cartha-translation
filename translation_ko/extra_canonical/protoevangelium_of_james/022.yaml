  terminology: ‘박사들’, ‘살해자들’, ‘아기들’, ‘소 여물통’, ‘하나님의 산’, ‘주님의 천사’는 제공된 영어 증거의 의미 범위와 등록에 대체로 부합합니다. ‘박사들’은 한국어 성서 전통에서 magi를 가리키는 익숙한 표현이며, 인원수나 신분을 과도하게 특정하지 않습니다.
