    text: ‘왕좌’는 문자적으로 옮긴 것입니다. 이 말이 가리키는 자리의 정확한 성격이나 상징적 의미는 이 대목만으로 확정되지 않습니다. ‘자주색 실’은 직역하면 ‘자주색 것’입니다.
    reason: ‘왕좌’라는 구체적 표현을 보존하면서, 그것으로 왕권 또는 특정한 상징을 단정하지 않도록 합니다.
  - marker: b
    text: ‘하나님의 말씀으로’는 ‘하나님의 말씀으로 말미암아’ 또는 ‘하나님의 말씀을 통하여’로도 옮길 수 있습니다.
    reason: 잉태와 ‘말씀’의 관계에 있는 도구·기원상의 모호성을 보존합니다.
