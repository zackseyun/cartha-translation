    reason: 공급된 영어 증언의 전치사구가 나타내는 기원 관계와 ‘주님’ 및 ‘살아 계신 하나님’의 동격 관계를 한국어에서 과도하게 좁히지 않습니다.
  revision_rationale: 원문의 구체적 표현인 ‘왕좌’와 여성형 ‘여종’을 회복하고, 예수의 이름을 부르는 진술을 명령이 아닌 미래의 예고로 옮겼습니다. 또한 문장을 현대 표준 한국어 합쇼체에 맞게 다듬되, 하나님의 말씀을 통한 잉태 및 ‘주님, 곧 살아 계신 하나님에게서’라는 표현의 해석상 여지는 각주로 보존했습니다.
