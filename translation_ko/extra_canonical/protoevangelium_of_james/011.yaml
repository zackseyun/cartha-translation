  text: '(1) She took the pitcher and went to fill it with water, and look! A voice said to her, “Rejoice, blessed one! The Lord is with you. Blessed are you among women.”


    Mary looked around to the right and the left to see where the voice might be coming from. She became terrified and went into her house. After setting down the pitcher, she took up the purple, sat upon her throne, and spun the purple.


    (2) And look! An angel of the Lord stood before her and said, “Do not be afraid, Mary, because you have found grace before the Lord of All. You will conceive from God’s word.”


    When Mary heard this, she questioned herself, saying, “Will I conceive from the Lord, the living God, and give birth as all women give birth?”


    (3) The angel of the Lord said to her, “Not like that, Mary, because the power of God will overshadow you. Therefore, the holy one who will be born from you will be called the Son of the Most High. You will call his name Jesus, because he will save his people from their sins.”


    Mary said, “Look, I am the servant of the Lord. May it happen to me according to your word.”'
translation:
  language: ko
  text: '(1) 마리아는 물동이를 들고 물을 길으러 갔습니다. 그런데 보십시오! 한 음성이 마리아에게 말했습니다. “기뻐하십시오, 은혜를 입은 이여! 주님께서 그대와 함께하십니다. 그대는 여자들 가운데 복을 받았습니다.”


    마리아는 그 음성이 어디에서 들려오는지 알아보려고 오른쪽과 왼쪽을 둘러보았습니다. 마리아는 몹시 두려워 집 안으로 들어갔습니다. 물동이를 내려놓은 뒤 자주색 실을 집어 들고 자기 자리에 앉아 그 실을 잣았습니다.[a]


    (2) 그런데 보십시오! 주님의 천사가 마리아 앞에 서서 말했습니다. “두려워하지 마십시오, 마리아. 그대는 만유의 주님 앞에서 은혜를 입었습니다. 그대는 하나님의 말씀으로 잉태할 것입니다.”[b]


    이 말을 듣고 마리아는 스스로 물었습니다. “내가 살아 계신 하나님이신 주님으로 말미암아 잉태하여, 모든 여자가 아이를 낳듯이 낳게 되는 것입니까?”[c]


    (3) 주님의 천사가 마리아에게 말했습니다. “그런 방식이 아닙니다, 마리아. 하나님의 능력이 그대를 덮을 것이기 때문입니다. 그러므로 그대에게서 태어날 거룩한 이는 지극히 높으신 분의 아들이라 불릴 것입니다. 그대는 그의 이름을 예수라 지어야 합니다. 그가 자기 백성을 그들의 죄에서 구원할 것이기 때문입니다.”


    마리아가 말했습니다. “보십시오, 저는 주님의 종입니다. 말씀하신 대로 제게 이루어지기를 바랍니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 자리’에 해당하는 말은 문자적으로 ‘왕좌’ 또는 ‘높은 자리’로 옮길 수도 있습니다. ‘자주색 실’은 직역하면 ‘자주색 것’입니다.
    reason: 직역이 불러올 수 있는 왕권적 함의를 피하면서 원문의 구체적 표현을 공개하기 위해서입니다.
  - marker: b
    text: ‘하나님의 말씀으로’는 ‘하나님의 말씀으로 말미암아’ 또는 ‘하나님의 말씀을 통하여’로도 이해할 수 있습니다.
    reason: 잉태와 ‘말씀’의 관계에 있는 도구·기원상의 모호성을 보존하기 위해서입니다.
  - marker: c
    text: ‘주님으로 말미암아’는 ‘주님에게서’로도 옮길 수 있습니다.
    reason: 공급된 영어 증언의 전치사구가 나타내는 기원 관계를 한국어에서 단정적으로 좁히지 않기 위해서입니다.
lexical_decisions:
- source_word: χαῖρε (inferred from the Greek tradition; review pending)
  choice: 기뻐하십시오
  rationale: 인사말의 기능만 살린 ‘평안하십시오’보다 ‘기뻐하라’라는 어휘적 의미를 보존했습니다.
- source_word: κεχαριτωμένη / blessed one (source-language form pending verification)
  choice: 은혜를 입은 이여
  rationale: ‘복된 이’도 가능하지만, 뒤이어 나오는 ‘은혜를 입었다’와의 의미 연관을 살리고 과도한 교리적 함의를 피했습니다.
- source_word: πορφύρα / the purple
  choice: 자주색 실
  rationale: 문맥상 마리아가 잣고 있는 자주색 직물 재료를 뜻하므로, 현대 독자가 행위를 이해하도록 ‘실’을 보충했습니다.
- source_word: θρόνος / throne (source-language verification pending)
  choice: 자기 자리
  rationale: 직역 ‘왕좌’는 왕권을 과도하게 암시할 수 있어 일상적인 좌석 의미로 옮기고 각주에 직역을 밝혔습니다.
- source_word: κύριος τῶν ὅλων / Lord of All (source-language verification pending)
  choice: 만유의 주님
  rationale: 모든 것의 주권자라는 의미를 간결하고 장중하게 표현했습니다.
- source_word: ἐκ λόγου θεοῦ / from God’s word (source-language verification pending)
  choice: 하나님의 말씀으로
  rationale: ‘말씀을 통하여’와 ‘말씀으로 말미암아’ 사이의 도구·기원상 모호성을 유지했습니다.
- source_word: ἐπισκιάσει / overshadow (source-language verification pending)
  choice: 덮을 것입니다
  rationale: 누가복음 수태고지 전승과 연결되는 은유를 해설적으로 풀지 않고 보존했습니다.
- source_word: δοῦλη / servant (source-language verification pending)
  choice: 종
  rationale: ‘여종’도 가능하지만 현대 한국어에서 불필요한 성별 강조를 피하면서 낮은 신분과 복종의 뜻을 유지했습니다.
theological_decisions:
- issue: ‘하나님의 말씀으로 잉태한다’의 의미
  choice: 하나님의 말씀으로 잉태할 것입니다
  alternative: 하나님의 말씀을 받아 잉태할 것입니다 / 하나님의 말씀으로 말미암아 잉태할 것입니다
  rationale: ‘말씀’이 선언의 수단인지 인격적 로고스인지 본문만으로 확정하지 않고 원문의 긴장을 보존했습니다.
- issue: 마리아의 질문에서 잉태의 주체·근원
  choice: 살아 계신 하나님이신 주님으로 말미암아 잉태하여
  alternative: 살아 계신 주 하나님에게서 잉태하여
  rationale: 공급된 증언의 ‘from the Lord, the living God’를 반영하되 자연스러운 한국어로 옮겼으며, 성적 결합을 암시하는 표현은 피했습니다.
- issue: 성령의 명시 여부
  choice: 하나님의 능력이 그대를 덮을 것
  alternative: 성령이 그대에게 임할 것
  rationale: 공급된 본문은 ‘하나님의 능력’이라고 하므로 정경 누가복음의 표현을 끌어와 ‘성령’으로 바꾸지 않았습니다.
- issue: ‘거룩한 이’의 호칭
  choice: 지극히 높으신 분의 아들
  alternative: 지극히 높으신 이의 아들 / 가장 높으신 분의 아들
  rationale: 전통적 성서 어법을 사용하되 본문 이상의 기독론적 설명을 덧붙이지 않았습니다.
- issue: 예수라는 이름과 구원의 이유
  choice: 그가 자기 백성을 그들의 죄에서 구원할 것
  alternative: 그가 자신의 백성을 죄에서 구원할 것
  rationale: ‘그들의 죄’라는 복수 소유 관계를 드러내어 구원의 대상과 문제를 모두 명확히 했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 간결하고 장중하게 유지했으며, 천사와 마리아의 대화에서는 존대법을 일관되게 적용했습니다. ‘보십시오!’를 반복하여 원문의 현시적 감탄을 살렸습니다. 다만 현재 제공된 drafting basis가 공용 영어 번역 증언이고 그리스어 직접 검토가 대기 중이므로, 그리스어 어형에 관한 판단은 모두 잠정적입니다.
