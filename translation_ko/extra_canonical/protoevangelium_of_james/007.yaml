  - severity: low
    issue: 직접 발화의 종결 표현이 합쇼체와 혼재됨
    rationale: 서술은 ‘-습니다’체인데 제사장의 발화만 ‘-셨다/-것이다’로 되어 있습니다. 목표 register인 현대 공식 합쇼체에 맞춰 통일할 수 있습니다.
