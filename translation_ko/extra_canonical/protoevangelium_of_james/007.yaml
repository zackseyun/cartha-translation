translation:
  language: ko
  text: '**제7장 마리아가 성전으로 가다**


    **(1)** 안나는 여러 달 동안 아이를 보살폈습니다. 아이가 두 살이 되었을 때 요아킴이 말했습니다. “우리가 서원한 것을 지키도록 아이를 주님의 성전으로 데려갑시다. 그래야 주님께서 우리에게 진노하시거나 우리의 예물을 받아들이지 않으시는 일이 없을 것입니다.”


    그러나 안나가 말했습니다. “아이가 아버지나 어머니를 찾지 않도록 세 살이 될 때까지 기다립시다.”


    요아킴이 말했습니다. “그렇게 기다립시다.”


    **(2)** 아이가 세 살이 되자 요아킴이 말했습니다. “히브리인들의 정결한 딸들을 불러 모읍시다. 저마다 등불을 들고 그 불을 밝히게 합시다. 그러면 아이가 뒤돌아서지 않고, 그 마음도 주님의 성전에서 떠나 다른 데로 이끌리지 않을 것입니다.” 그들은 주님의 성전에 올라갈 때까지 그대로 했습니다.


    제사장은 아이를 맞아 입 맞추고 말했습니다. “주 하나님께서 모든 세대 가운데 네 이름을 크게 높이셨다. 마지막 날들에 주님께서 너를 통하여 이스라엘 백성을 위한 자신의 구속을 드러내실 것이다.”[a]


    **(3)** 제사장은 아이를 제단의 셋째 층계에 앉혔습니다.[b] 주 하나님께서는 아이에게 은혜를 부어 주셨습니다. 아이는 두 발로 춤을 추었고, 이스라엘 온 집안이 그 아이를 사랑했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신의 구속’은 주님께서 이루시는 구원 또는 해방을 뜻합니다. 이 문장은 그 구속이 마리아를 통하여 드러날 것이라고 말하지만, 그 방식은 더 설명하지 않습니다.
    reason: 마리아와 구속의 관계를 과도하게 교리화하지 않으면서 문장의 주체와 모호성을 분명히 합니다.
  - marker: b
    text: ‘제단의 셋째 층계’는 제단으로 이어지는 층계 가운데 셋째 층계를 가리키는 것으로 보입니다.
    reason: 표현의 공간적 의미가 현대 독자에게 낯설 수 있으므로 최소한으로 설명하되, 구체적 성전 구조를 추정하지 않습니다.
lexical_decisions:
- source_word: Temple of the Lord
  choice: 주님의 성전
  rationale: ‘성전’은 문맥상 예루살렘의 성소를 자연스럽고 분명하게 가리키며, 반복되는 표현을 일관되게 보존합니다.
- source_word: promise we made
  choice: 우리가 서원한 것
  rationale: 아이를 주님께 바치기로 한 앞선 약속이라는 제의적 맥락을 드러내기 위해 단순한 ‘약속’보다 ‘서원’을 택했습니다.
- source_word: gift
  choice: 예물
  rationale: 주님께 바쳐지는 아이를 가리키는 제의적 함의를 살리되, 아이와 예물을 완전히 동일시하는 해석을 덧붙이지 않습니다.
- source_word: pure daughters of the Hebrews
  choice: 히브리인들의 정결한 딸들
  rationale: ‘pure’를 도덕적 순결이나 처녀 신분으로 단정하지 않고 ‘정결한’으로 옮겨 원문의 범위를 보존합니다.
- source_word: lamps
  choice: 등불
  rationale: 행렬에서 불을 밝혀 드는 기구를 가리키는 일반적이고 자연스러운 표현입니다.
- source_word: redemption
  choice: 구속
  rationale: 이스라엘을 해방하고 건져 내는 신학적 의미를 간결하게 담는 전통적이면서도 현대 독자에게 통용되는 말입니다.
- source_word: all the house of Israel
  choice: 이스라엘 온 집안
  rationale: 집합적 공동체를 나타내는 성서적 표현을 유지하면서도 자연스러운 한국어 어순으로 옮겼습니다.
theological_decisions:
- issue: 마리아를 통한 종말의 구속
  choice: “너를 통하여 … 자신의 구속을 드러내실 것이다”
  alternative: “너를 통하여 … 이스라엘 백성을 구속하실 것이다”
  rationale: 마리아가 구속의 주체라는 인상을 피하고, 주님이 자신의 구속을 마리아를 통하여 계시한다는 문장의 신학적 긴장을 그대로 유지했습니다.
- issue: ‘마지막 날들’의 시간적 의미
  choice: 마지막 날들에
  alternative: 마지막 때에
  rationale: 복수형 표현과 종말론적 여운을 보존하며, 특정 사건이나 교리 체계로 좁히지 않았습니다.
- issue: 아이에게 부어진 은혜
  choice: 아이에게 은혜를 부어 주셨습니다
  alternative: 아이 위에 은총을 쏟으셨습니다
  rationale: 은혜의 성격이나 결과를 교리적으로 규정하지 않고 서술 자체를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체 서술을 사용했습니다. 대화는 인물 관계와 고대 서사의 품위를 살려 ‘-ㅂ시다’와 선언형을 사용했습니다. 접속사 ‘그리고’의 기계적 반복은 줄였지만 사건의 연쇄와 반복 구조는 유지했습니다. 제공 자료가 공공 영역 영어 증언을 기초로 하며 그리스어 사본 전통에 대한 직접 검토가 아직 이루어지지 않았으므로, 이 초안은 잠정적입니다.
