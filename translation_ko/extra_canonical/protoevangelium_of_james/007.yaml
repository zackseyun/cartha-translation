  terminology: ‘주님의 성전’, ‘서원’, ‘예물’, ‘정결한 딸들’, ‘등불’, ‘은혜’는 문맥에 적합합니다. ‘구속’은 유지하되, 소유·대상 관계를 ‘이스라엘 백성의 구속’으로 바로잡는 것이 원문의 의미 관계를 더 잘 보존합니다.
  issues:
