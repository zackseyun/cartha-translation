  rationale: ‘살지고’라는 비명시적 의미를 제거하여 제물의 묘사를 제공된 증언에 맞추었습니다. 마지막 안나의 선언은 원문의 역설과 반복을 유지하면서 자연스러운 한국어로 다듬었습니다. ‘문’은 원문의 gate를 과도하게 ‘대문’으로 특정하지 않도록 조정했습니다. 그 밖의 시제 긴장, 성별의 비특정성, 과부 비유, 그리고 ‘첫날’의 불명확한 시간 표현은 보존했습니다.
  reviewer_model: gpt-5.6-terra
