translation:
  language: ko
  text: '야고보의 원복음 4장 — 주님의 약속


    (1) 보십시오! 주님의 천사가 안나 곁에 서서 말했습니다. “안나야, 안나야, 주님께서 네 기도를 들으셨다. 네가 잉태하여 아이를 낳을 것이며, 네 자손은 온 세상에서 사람들의 입에 오를 것이다.”


    안나가 말했습니다. “주 하나님께서 살아 계심을 두고 맹세합니다. 제가 아들을 낳든 딸을 낳든, 그 아이를 제 하나님이신 주님께 예물로 바치겠습니다. 그러면 그 아이는 평생 주님을 섬길 것입니다.”


    (2) 보십시오! 두 천사가 안나에게 와서 말했습니다. “보아라, 네 남편 요아킴이 양 떼와 함께 오고 있다.” 이는 주님의 천사가 요아킴에게 내려가 이렇게 말했기 때문입니다. “요아킴아, 요아킴아, 주 하나님께서 네 기도를 들으셨다. 여기서 내려가거라. 보아라, 네 아내 안나가 태중에 아이를 잉태하였다.”


    (3) 요아킴은 곧 내려가 목자들을 불러 말했습니다. “흠도 티도 없는 어린양 열 마리를 내게 가져오시오. 그 열 마리는 주 하나님께 드릴 것이오. 또 제사장들과 장로들에게 줄 어린 송아지 열두 마리를 가져오고, 온 백성에게 줄 숫염소 백 마리도 가져오시오.”


    (4) 보십시오! 요아킴이 양 떼와 함께 왔고, 안나는 문에 서 있었습니다. 안나는 양 떼와 함께 오는 요아킴을 보자 곧 달려가 그의 목을 끌어안고 말했습니다. “이제야 주 하나님께서 내게 큰 복을 주셨음을 압니다. 보십시오! 과부가 더는 과부가 아니며, 태중에 아이가 없던 이가 아이를 잉태했습니다.”


    요아킴은 첫날을 자기 집에서 쉬었습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: angel of the Lord
  choice: 주님의 천사
  rationale: 성경 문체와의 연속성을 유지하면서도 현대 독자가 자연스럽게 이해할 수 있는 표현을 택했습니다.
- source_word: offspring
  choice: 자손
  rationale: 태어날 한 아이를 가리키면서도 그 아이와 관련된 후대 또는 계보까지 포괄할 수 있는 원문의 의미 폭을 보존했습니다.
- source_word: will be spoken of
  choice: 사람들의 입에 오를 것이다
  rationale: 칭송인지 단순한 언급인지 확정하지 않고, 온 세계에 널리 알려진다는 뜻을 자연스럽게 나타냈습니다.
- source_word: bring it as a gift
  choice: 그 아이를 … 예물로 바치겠습니다
  rationale: 아이를 성별하여 하나님께 드리겠다는 제의적 뉘앙스를 분명하고 품위 있게 전달했습니다.
- source_word: minister to him
  choice: 주님을 섬길 것입니다
  rationale: 성소 봉사 가능성을 배제하지 않되, 원문이 명시하지 않은 구체적 직무를 덧붙이지 않았습니다.
- source_word: without spot or blemish
  choice: 흠도 티도 없는
  rationale: 희생 제물의 온전함을 나타내는 관용적 성경 표현을 사용했습니다.
- source_word: tender calves
  choice: 살지고 어린 송아지
  rationale: 어리고 좋은 상태의 송아지라는 뜻을 자연스럽게 전달하되, 구체적 제의 등급은 부가하지 않았습니다.
- source_word: widow
  choice: 과부
  rationale: 요아킴이 살아 있는데도 안나가 자신을 과부에 빗대는 본문의 역설적 표현을 완화하거나 해석하지 않고 그대로 보존했습니다.
- source_word: rested for the first day
  choice: 첫날을 자기 집에서 쉬었습니다
  rationale: 다소 불분명한 시간 표현을 해석적으로 고치지 않고 가까이 보존했습니다.
theological_decisions:
- issue: 안나가 낳을 아이의 성별과 헌신
  choice: 아들이든 딸이든 아이를 주님께 예물로 바치고 평생 섬기게 한다는 서원을 그대로 번역했습니다.
  alternative: 후대 전승에 따라 아이를 마리아로 명시하거나 성전 봉헌의 세부 내용을 덧붙이는 번역
  rationale: 이 대목 자체가 아직 아이의 성별이나 이름을 밝히지 않으므로, 후대의 정보를 앞당겨 넣지 않았습니다.
- issue: 잉태의 시점
  choice: 안나에게는 미래형으로, 요아킴에게는 이미 잉태한 것으로 전해지는 서술상의 긴장을 그대로 유지했습니다.
  alternative: 두 천사의 말을 같은 시제로 통일하는 번역
  rationale: 본문의 시간적 긴장이나 전승 층위를 번역자가 임의로 해소하지 않기 위해서입니다.
- issue: ‘과부가 더는 과부가 아니다’라는 선언
  choice: 문자적 역설을 보존했습니다.
  alternative: ‘남편에게 버림받은 듯했던 여자가 다시 남편을 맞았다’처럼 의미를 풀어 쓰는 번역
  rationale: 본문이 사용하는 비유적·사회적 표현의 신학적 및 문학적 긴장을 독자에게 남겨 두었습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 천사의 직접 발화에는 서사적 권위를 살리는 해라체를 적용했습니다. 반복되는 ‘보십시오/보아라’를 유지하여 원문의 주의 환기와 성경적 서사 리듬을 보존했습니다. 제공 자료상 그리스어 사본 전통에 대한 직접 대조가 아직 이루어지지 않았으므로, 본 초안은 명시된 공개 영역 영어 증언과 감수용 영어 POB를 바탕으로 한 잠정적 원전 지향 번역입니다.
