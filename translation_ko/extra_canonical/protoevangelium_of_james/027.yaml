translation:
  language: ko
  text: (1) 요셉은 그곳에서 동굴 하나를 발견하여 마리아를 그리로 데려갔습니다. 그리고 자기 아들들을 마리아 곁에 있게 한 뒤, 베들레헴 지방에서 히브리인 산파를 찾으러 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 그리스어 사본 전통에 대한 직접 검토가 아직 필요합니다.
    reason: 현재 자료가 영어 증언에 의존하며 원어 검토가 미완료라는 본문 비평상의 한계를 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: cave
  choice: 동굴
  rationale: 출산 장소로 발견한 자연적인 굴을 가리키는 일반적이고 명료한 현대 한국어입니다.
- source_word: stationed his sons with her
  choice: 자기 아들들을 마리아 곁에 있게 한 뒤
  rationale: 아들들이 마리아와 함께 머물며 곁을 지키도록 했다는 뜻을 자연스럽게 전달하되, 원문 증거보다 구체적인 임무를 덧붙이지 않았습니다.
- source_word: Hebrew midwife
  choice: 히브리인 산파
  rationale: 산파의 민족적·공동체적 정체성을 나타내는 표현을 그대로 보존했습니다.
- source_word: region of Bethlehem
  choice: 베들레헴 지방
  rationale: 도시 내부로 한정하지 않고 베들레헴 주변 지역까지 포함할 수 있는 범위를 유지했습니다.
theological_decisions:
- issue: 요셉의 아들들과 마리아의 관계
  choice: 자기 아들들
  alternative: 그의 아들들 또는 마리아의 의붓아들들
  rationale: 본문은 이들을 단순히 요셉의 아들들이라고 부르므로, 마리아와의 관계나 가족 구성에 관한 후대의 해석을 본문에 끌어들이지 않았습니다.
- issue: 산파를 찾은 목적
  choice: 목적을 별도로 명시하지 않음
  alternative: 마리아의 해산을 돕게 하려고
  rationale: 문맥상 출산을 돕기 위한 행동으로 보이지만, 제시된 문장 자체에는 목적절이 없으므로 번역문에 명시적으로 보충하지 않았습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 인명 ‘마리아’는 영어 증언의 대명사가 가리키는 대상을 자연스럽게 드러내기 위해 사용했으며, 문장은 사건의 연속성을 명료하게 전달하도록 나누었습니다.
