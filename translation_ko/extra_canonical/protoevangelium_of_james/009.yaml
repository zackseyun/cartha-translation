id: PROJ.009
reference: 'Protoevangelium of James — Chapter 9: Joseph Protects Mary'
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: '(1) And Joseph threw down his axe, and went to their meeting. And when they had all gathered, they went to the priest with their staffs. And having taken all their staffs, he went into the Temple and prayed. And when he had finished the prayer, he took the staffs, went out, and gave them back. But there wasn’t a sign among them. And Joseph took his staff last, and look! A dove went from the staff, and flew upon Joseph’s head. And the priest said to Joseph, “You’ve been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she’s young. I won’t be a laughingstock among the people of Israel.”


    And the priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore; how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things won’t happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care, and said to her, “Mary, I’ve taken you from the Temple of the Lord, and now I bring you to my house. I’m going away to build houses, but I’ll come back to you. The Lord will protect you.”'
