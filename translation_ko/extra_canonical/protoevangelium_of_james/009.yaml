  yaml_path: translation/extra_canonical/protoevangelium_of_james/009.yaml
  text: '(1) Joseph threw down his axe and went to meet them. When they had all gathered, they went to the priest with their staffs. The priest took all their staffs, entered the Temple, and prayed. When he had finished praying, he took the staffs, went out, and gave them back. But there was no sign among them. Joseph took his staff last, and look! A dove went from the staff and flew upon Joseph’s head. The priest said to Joseph, “You have been chosen to welcome the virgin of the Lord into your own care.”


    (2) But Joseph refused, saying, “I have sons and am an old man, but she is young. I will not be a laughingstock among the people of Israel.”


    The priest said, “Joseph, fear the Lord your God, and remember what God did to Dathan, Abiron, and Kore—how the earth opened and swallowed them all because of their rebellion. And now fear, Joseph, so that these things will not happen in your house.”


    (3) And being afraid, Joseph welcomed her into his care and said to her, “Mary, I have taken you from the Temple of the Lord, and now I bring you to my house. I am going away to build houses, but I will come back to you. The Lord will protect you.”'
translation:
  language: ko
  text: '(1) 요셉은 도끼를 내려놓고 그들의 모임으로 갔습니다. 모두 모이자, 그들은 저마다 지팡이를 들고 제사장에게 갔습니다. 제사장은 그들의 지팡이를 모두 받아 성전 안으로 들어가 기도했습니다. 기도를 마친 뒤에는 지팡이들을 들고 나와 돌려주었습니다. 그러나 그 가운데 아무런 표징도 없었습니다. 요셉이 마지막으로 자기 지팡이를 받았는데, 보십시오! 비둘기 한 마리가 지팡이에서 나와 요셉의 머리 위로 날아갔습니다.[a] 제사장이 요셉에게 말했습니다. “당신은 주님의 처녀를 맡아 보살필 사람으로 선택되었습니다.”[b]


    (2) 그러나 요셉은 거절하며 말했습니다. “내게는 아들들이 있고 나는 늙은 사람인데, 이 아이는 젊습니다. 내가 이스라엘 백성 가운데서 웃음거리가 될까 두렵습니다.”[c]


    제사장이 말했습니다. “요셉, 주 당신의 하나님을 두려워하고, 하나님께서 다단과 아비론과 고레에게 하신 일을 기억하십시오. 그들이 반역했기 때문에 땅이 갈라져 그들을 모두 삼켜 버렸습니다.[d] 그러니 이제 두려워하십시오, 요셉. 이런 일이 당신의 집안에 일어나지 않게 하십시오.”


    (3) 요셉은 두려워서 마리아를 맡아 보살피기로 하고, 마리아에게 말했습니다. “마리아, 내가 당신을 주님의 성전에서 데려왔고, 이제 내 집으로 데려갑니다. 나는 집들을 지으러 떠나지만, 당신에게 돌아오겠습니다. 주님께서 당신을 지켜 주실 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리 위로 날아갔다’는 표현은 비둘기가 머리 위에 내려앉았다는 뜻일 수도 있습니다. 제공된 영어 증거만으로는 동작의 끝을 확정하기 어렵습니다.
    reason: 그리스어 원문 대조가 아직 이루어지지 않았고, 전치사 표현에 의미상의 여지가 있습니다.
  - marker: b
    text: ‘맡아 보살피다’는 표현은 마리아를 자기 보호 아래 받아들이라는 뜻입니다. 이 문장 자체는 혼인 관계를 명시하지 않습니다.
    reason: 후대의 교리적 전제를 본문에 미리 넣지 않고 관계의 성격에 남아 있는 긴장을 보존합니다.
  - marker: c
    text: ‘이 아이’는 젊은 마리아를 가리키는 자연스러운 한국어 표현입니다. 원 증거의 대조는 요셉의 노년과 마리아의 젊음 사이에 있습니다.
    reason: 한국어에서 여성을 낮춰 부르는 인상을 피하면서 연령 대조를 분명히 합니다.
  - marker: d
    text: 다단과 아비론과 고레의 반역과 심판 이야기는 민수기 16장에 나옵니다. 이름의 형태는 이 문헌의 전승을 따라 적었습니다.
    reason: 독자가 인용 배경과 통상적인 성경 이름 형태의 차이를 이해하도록 돕습니다.
lexical_decisions:
- source_word: axe
  choice: 도끼
  rationale: 목수인 요셉의 작업 도구를 자연스럽고 직접적으로 옮겼습니다.
- source_word: staffs
  choice: 지팡이
  rationale: 표징을 기다리며 각 사람이 가져온 막대기를 가리키는 문맥에서 현대 독자가 쉽게 이해할 수 있는 표현입니다.
- source_word: sign
  choice: 표징
  rationale: 단순한 흔적이 아니라 하나님의 선택을 드러내는 초자연적 징표라는 문맥을 살렸습니다.
- source_word: virgin of the Lord
  choice: 주님의 처녀
  rationale: 후대의 교회 용어나 특정 교리적 호칭으로 바꾸지 않고 원문의 소유·헌신 관계를 보존했습니다.
- source_word: welcome ... into your own care
  choice: 맡아 보살피다
  rationale: 단순히 집에 맞아들이는 것뿐 아니라 보호하고 돌보는 책임을 함께 나타냅니다.
- source_word: build houses
  choice: 집들을 짓다
  rationale: 복수형의 의미를 보존하여 요셉이 건축 일을 하러 떠난다는 진술을 그대로 살렸습니다.
theological_decisions:
- issue: 비둘기가 지팡이에서 나온 방식
  choice: 지팡이에서 나와 요셉의 머리 위로 날아갔습니다
  alternative: 지팡이 위에서 날아올라 요셉의 머리 위에 내려앉았습니다
  rationale: 제공된 증거가 ‘from the staff’와 ‘flew upon’을 전하므로, 발생 방식이나 착지 여부를 더 구체적으로 단정하지 않았습니다.
- issue: 요셉과 마리아의 관계
  choice: 맡아 보살피다
  alternative: 아내로 맞아들이다 / 약혼하다
  rationale: 이 대목 자체는 보호와 돌봄을 강조하므로 혼인 관계를 명시적으로 덧붙이지 않았습니다.
- issue: 다단·아비론·고레에 대한 심판의 범위
  choice: 땅이 갈라져 그들을 모두 삼켜 버렸습니다
  alternative: 그들의 집안과 소유까지 모두 삼켰습니다
  rationale: 제공된 본문의 표현 범위를 넘는 민수기 본문의 세부 사항을 수입하지 않았습니다.
- issue: 요셉의 거절 동기
  choice: 웃음거리가 될까 두렵습니다
  alternative: 웃음거리가 되지 않겠습니다
  rationale: 거절 발언의 우려와 정서를 자연스러운 한국어로 전달하되, 그의 명예에 대한 염려를 교리적으로 미화하거나 비난하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 간결하고 공적인 문체로 유지하되 대화는 자연스럽게 다듬었습니다. ‘보십시오!’는 갑작스러운 표징을 알리는 감탄을 보존합니다. 이 초안은 제공된 공용 영어 증거에 근거한 잠정 번역이며, 그리스어 사본 전통과의 직접 대조가 필요합니다.
