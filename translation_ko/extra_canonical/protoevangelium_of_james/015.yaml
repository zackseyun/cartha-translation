translation:
  language: ko
  text: '(1) 서기관 안나스가 요셉에게 와서 말했습니다. “요셉, 어찌하여 우리 일행 가운데 모습을 보이지 않았습니까?”


    요셉이 그에게 말했습니다. “여행으로 지쳐서 돌아온 첫날에는 쉬었기 때문입니다.”


    안나스가 몸을 돌렸다가 마리아가 임신한 것을 보았습니다.


    (2) 그는 서둘러 제사장에게 가서 말했습니다. “당신이 보증해 준 요셉이 크나큰 불법을 저질렀습니다.”


    제사장이 물었습니다. “무슨 일입니까?”


    그가 말했습니다. “요셉이 주님의 성전에서 데려간 처녀를 더럽혔습니다. 그는 그 여자의 혼인을 훔치고도[a] 이스라엘 백성에게 밝히지 않았습니다.”


    제사장이 대답했습니다. “요셉이 그런 일을 했습니까?”


    서기관 안나스가 그에게 말했습니다. “관리들을 보내십시오. 그러면 그 처녀가 임신한 것을 보게 될 것입니다.”


    관리들이 가서 보니 그의 말과 같았습니다. 그들은 마리아를 요셉과 함께 법정으로 데려갔습니다.


    (3) 대제사장이 마리아에게 말했습니다. “마리아, 어찌하여 이런 일을 했습니까? 어찌하여 그대의 영혼을 욕되게 하고 주 그대의 하나님을 잊었습니까? 그대는 지성소에서 자랐고 천사의 손에서 음식을 받았으며, 그 천사의 찬송을 듣고 그 앞에서 춤을 추었습니다.[b] 그런데 어찌하여 이런 일을 했습니까?”


    마리아는 몹시 슬피 울며 말했습니다. “주 하나님께서 살아 계심을 두고 맹세합니다. 저는 하나님 앞에서 순결하며, 남자를 안 적이 없습니다!”


    (4) 제사장이 말했습니다. “요셉, 어찌하여 이런 일을 했습니까?”


    요셉이 말했습니다. “주 나의 하나님께서 살아 계심과 하나님의 진실하신 증언을 두고 맹세합니다. 저는 그 여자에게 결백합니다.”[c]


    제사장이 말했습니다. “거짓 증언을 하지 말고 진실을 말하십시오. 그대는 그 여자의 혼인을 훔치고도 이스라엘 백성에게 밝히지 않았고, 그대의 자손을 복되게 하실 능하신 분의 손 아래 머리를 숙이지도 않았습니다.”[d]


    그러자 요셉은 아무 말도 하지 않았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그 여자의 혼인을 훔치고도”는 전달된 영어 증언의 이례적인 표현을 보존한 것입니다. 혼인을 몰래 가로챘다거나 정당한 혼인 절차를 숨겼다는 뜻일 수 있으나, 그 정확한 의미는 그리스어 원문 검토가 필요합니다.
    reason: 난해한 관용 표현을 임의로 해소하지 않기 위해서입니다.
  - marker: b
    text: 전달된 영어 증언은 직역하면 “그것의 찬송을 듣고 그것 앞에서 춤을 추었다”라고 되어 있어 대명사의 지시 대상이 분명하지 않습니다. 여기서는 문맥상 천사를 가리키는 것으로 옮겼습니다.
    reason: 대명사의 genuine ambiguity를 독자에게 알리기 위해서입니다.
  - marker: c
    text: “그 여자에게 결백합니다”는 직역하면 “그 여자에 대하여 순결합니다”입니다.
    reason: 자연스러운 한국어와 원문의 관계적이고 이례적인 표현을 함께 보존하기 위해서입니다.
  - marker: d
    text: “그대의 자손을 복되게 하실 능하신 분의 손”은 전달된 영어 증언 자체가 난해합니다. 하나님께 복을 구하며 정식 혼인 절차에 복종하지 않았다는 책망으로 이해될 수 있으나 확정하기 어렵습니다.
    reason: 신학적·문법적 난점을 단정적으로 풀지 않기 위해서입니다.
lexical_decisions:
- source_word: scribe
  choice: 서기관
  rationale: 유대 종교·법률 문맥에서 통용되는 현대 한국어 명칭을 사용했습니다.
- source_word: traveling group
  choice: 일행
  rationale: 함께 길을 다니는 집단이라는 뜻을 자연스럽게 전달하면서 집단의 성격을 과도하게 특정하지 않았습니다.
- source_word: acted very lawlessly
  choice: 크나큰 불법을 저질렀습니다
  rationale: 행위의 심각성과 법·율법을 어겼다는 고발의 성격을 함께 보존했습니다.
- source_word: officers
  choice: 관리들
  rationale: 성전 또는 법정의 집행 인력일 수 있는 모호성을 유지하고 현대의 경찰로 좁히지 않았습니다.
- source_word: court
  choice: 법정
  rationale: 심문과 재판이 이루어지는 자리라는 문맥을 분명하게 전달했습니다.
- source_word: known a man
  choice: 남자를 안 적이 없습니다
  rationale: 성관계를 뜻하는 고대의 완곡한 표현을 한국어 성서 문체로 보존했습니다.
- source_word: pure toward her
  choice: 그 여자에게 결백합니다
  rationale: 요셉이 마리아와 부정한 관계를 맺지 않았다는 문맥을 자연스럽게 전달하되 원문의 관계적 표현은 각주로 밝혔습니다.
theological_decisions:
- issue: 천사의 찬송과 춤의 지시 대상
  choice: 그 천사의 찬송을 듣고 그 앞에서 춤을 추었습니다
  alternative: 그것의 찬송을 듣고 그것 앞에서 춤을 추었습니다
  rationale: 영어 증언의 대명사 표현은 어색하고 선행사가 불명확할 수 있습니다. 문맥상 천사를 가리키는 것으로 읽어 자연스럽게 옮겼으나, 그 불확실성을 각주에 표시했습니다.
- issue: 요셉이 맹세에서 주장하는 순결의 성격
  choice: 저는 그 여자에게 결백합니다
  alternative: 저는 그 여자에 대하여 순결합니다
  rationale: 한국어에서 자연스러운 법정 진술로 옮겼으며, 성적 순결 또는 무죄의 함의를 한쪽으로 완전히 고정하지 않도록 원문의 직역을 각주에 남겼습니다.
- issue: 능하신 손과 자손의 복
  choice: 그대의 자손을 복되게 하실 능하신 분의 손 아래
  alternative: 그대의 씨를 복 주어야 할 능한 손 아래
  rationale: ‘능한 손’의 주체를 하나님으로 이해할 수 있게 하되 이름을 본문에 직접 보충하지 않았습니다. 복의 대상도 후손이라는 통상적 의미로 옮기고 난해성을 각주에 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 존대 없는 문어체로 유지하고, 인물들의 직접 발화는 공적 심문 상황에 맞게 합쇼체로 옮겼습니다. 반복적인 ‘그리고’는 원문의 연쇄적 서술감을 해치지 않는 범위에서 한국어답게 조정했습니다. 이 초안은 제공된 공공 영역 영어 증언과 영어 POB 검토층에 근거한 잠정 번역이며, 그리스어 사본 전통에 대한 직접 검토가 남아 있습니다.
