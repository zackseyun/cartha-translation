  text: '(1) And look! A woman was coming down from the mountain, and she said to me, “Man, where are you going?”


    I said, “I am looking for a Hebrew midwife.”


    She replied, “Are you from Israel?”


    I said to her, “Yes.”


    Then she said, “And who is the one giving birth in the cave?”


    I said, “My betrothed.”


    She said to me, “She is not your wife?”


    I said to her, “Mary was raised in the Temple of the Lord, and it was decided by lot that she would be my wife. Yet she is not my wife, but she has conceived from the Holy Spirit.”


    The midwife said, “Really?”


    Joseph said to her, “Come and see.”


    And the midwife went with him.


    (2) They stood in front of the cave, and a bright cloud overshadowed the cave. The midwife said, “My soul is magnified today, because my eyes have seen something wonderful. Salvation has been born to Israel!”


    Immediately the cloud withdrew from the cave, and a great light appeared in the cave, so that their eyes could not bear it. A little later, the light withdrew until an infant appeared. He came and took the breast of his mother, Mary.


    The midwife cried out and said, “How great today is for me, because I have seen this new miracle!”


    (3) The midwife went out from the cave, and Salome met her.


    She said to her, “Salome, Salome, I must describe a new sight to you. A virgin has given birth, which is against her nature!”


    Salome said, “As the Lord my God lives, unless I examine her condition, I will not believe that the virgin has given birth.”'
translation:
  language: ko
  text: '**야고보 원복음서 19장 — 예수님의 탄생**


    (1) 보십시오! 한 여자가 산에서 내려오고 있었습니다. 그 여자가 내게 말했습니다. “여보시오, 어디로 가십니까?”


    내가 말했습니다. “히브리인 산파를 찾고 있습니다.”


    그 여자가 물었습니다. “당신은 이스라엘 사람입니까?”


    내가 그 여자에게 말했습니다. “그렇습니다.”


    그러자 그 여자가 말했습니다. “동굴에서 해산하는 이는 누구입니까?”


    내가 말했습니다. “내 약혼녀입니다.”


    그 여자가 내게 말했습니다. “당신의 아내가 아닙니까?”


    내가 그 여자에게 말했습니다. “마리아는 주님의 성전에서 자랐고, 제비를 뽑아 내 아내가 되도록 정해졌습니다. 그러나 아직 내 아내는 아닙니다. 마리아는 성령으로 잉태했습니다.”[a]


    산파가 말했습니다. “정말입니까?”


    요셉이 그 여자에게 말했습니다. “와서 보십시오.”


    산파는 요셉과 함께 갔습니다.


    (2) 두 사람이 동굴 앞에 섰을 때, 빛나는 구름이 동굴을 덮었습니다.[b] 산파가 말했습니다. “오늘 내 영혼이 높임을 받습니다. 내 눈이 놀라운 일을 보았기 때문입니다. 이스라엘을 위한 구원이 태어났습니다!”[c]


    곧 구름이 동굴에서 걷히고 동굴 안에 큰 빛이 나타났습니다. 그들의 눈은 그 빛을 견딜 수 없었습니다. 잠시 뒤 그 빛이 차츰 사라지자 아기가 모습을 드러냈습니다. 아기는 어머니 마리아에게 다가가 젖을 물었습니다.


    산파가 외쳤습니다. “오늘은 내게 얼마나 놀라운 날입니까! 내가 이 새로운 기적을 보았습니다!”


    (3) 산파가 동굴에서 나오자 살로메가 그 여자를 만났습니다.


    산파가 살로메에게 말했습니다. “살로메, 살로메, 내가 당신에게 새로운 광경을 이야기해야겠습니다. 처녀가 아이를 낳았습니다. 이는 처녀의 본성으로는 있을 수 없는 일입니다!”[d]


    살로메가 말했습니다. “주 나의 하나님께서 살아 계심을 두고 맹세합니다. 내가 직접 그 여자의 상태를 확인하지 않고서는 처녀가 아이를 낳았다는 말을 믿지 않겠습니다.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “성령으로”는 잉태의 기원이나 방식을 나타내는 표현입니다. 이 대목은 마리아가 요셉의 아내로 정해졌으나 아직 그의 아내는 아니라고 말하는 본문의 긴장을 그대로 간직합니다.
    reason: 혼인 상태와 성령 잉태에 관한 본문의 진술을 독자가 과도하게 조화시키지 않도록 설명합니다.
  - marker: b
    text: “덮었습니다”는 구름이 동굴을 감싸거나 그 위에 드리웠다는 뜻으로도 이해할 수 있습니다.
    reason: 공간적 이미지의 가능한 범위를 보존합니다.
  - marker: c
    text: 본문은 “구원자”가 아니라 “구원”이 태어났다고 표현합니다.
    reason: 인격적 칭호로 해석해 바꾸지 않은 번역상의 선택을 밝힙니다.
  - marker: d
    text: 직역하면 “그녀의 본성에 어긋나는” 또는 “그녀의 본성으로는 불가능한”이라는 뜻입니다.
    reason: 고대 표현의 의미와 번역의 풀어쓴 정도를 알립니다.
  - marker: e
    text: “상태를 확인하다”는 신체 검사를 뜻하지만, 이 절 자체는 검사 방식이나 신체 부위를 명시하지 않습니다.
    reason: 본문의 완곡함과 모호성을 보존합니다.
lexical_decisions:
- source_word: Hebrew midwife
  choice: 히브리인 산파
  rationale: 민족적 수식과 직업을 분명히 드러내면서 현대 독자가 자연스럽게 이해할 수 있도록 옮겼습니다.
- source_word: betrothed
  choice: 약혼녀
  rationale: 혼인이 정해졌으나 부부 관계가 아직 성립하지 않았다는 이어지는 문맥과 긴장을 보존합니다.
- source_word: overshadowed
  choice: 덮었습니다
  rationale: 구름이 동굴 위나 주변을 감싸는 장면을 자연스럽게 전달하되, 신학적 의미를 번역에서 과도하게 확정하지 않았습니다.
- source_word: salvation
  choice: 구원
  rationale: 개인이나 구원자를 명시하지 않는 추상명사의 형태를 그대로 유지했습니다.
- source_word: condition
  choice: 상태
  rationale: 살로메가 신체 검사를 요구한다는 뜻은 유지하면서도 본문이 여기서 구체적으로 밝히지 않은 검사 방식이나 신체 부위를 덧붙이지 않았습니다.
theological_decisions:
- issue: 마리아와 요셉의 혼인 상태
  choice: “아내가 되도록 정해졌습니다. 그러나 아직 내 아내는 아닙니다”
  alternative: “법적으로는 아내지만 아직 동침하지 않았습니다”
  rationale: 전승의 다소 긴장된 표현을 법률적·교리적으로 조화시키지 않고 그대로 보존했습니다.
- issue: 성령에 의한 잉태
  choice: “성령으로 잉태했습니다”
  alternative: “성령에게서 아이를 가졌습니다”
  rationale: 수단·기원을 모두 함축할 수 있는 표현을 사용하여 원문 전승의 신학적 진술을 간결하게 유지했습니다.
- issue: “구원”의 정체
  choice: “이스라엘을 위한 구원이 태어났습니다”
  alternative: “이스라엘의 구원자가 태어났습니다”
  rationale: 추상명사 ‘구원’을 인격적 칭호 ‘구원자’로 바꾸지 않아 원문의 표현과 신학적 여운을 보존했습니다.
- issue: 처녀 출산과 본성
  choice: “이는 처녀의 본성으로는 있을 수 없는 일입니다”
  alternative: “자연법칙에 어긋나는 일입니다”
  rationale: ‘그녀의 본성’이라는 개별적 표현을 살리면서, 현대 한국어에서 오해 없이 이해되도록 풀어 옮겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 읽기 쉬운 문장으로 나누되 반복적인 대화 구조와 고대 서사의 긴박함을 유지했습니다. 다만 제공된 자료가 영어 공개 번역 증언이며 그리스어 원문 대조가 아직 이루어지지 않았으므로, 이 초안은 그리스어 사본 전통에 대한 직접 검토 뒤 재확인해야 합니다.
