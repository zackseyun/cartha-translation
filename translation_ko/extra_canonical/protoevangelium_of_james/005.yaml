  yaml_path: translation/extra_canonical/protoevangelium_of_james/005.yaml
  text: '(1) The next day, Joachim offered his gifts, saying to himself, “If the Lord God is reconciled to me, the plate worn by the priest will make it clear to me.” Joachim offered his gifts and watched the priest’s plate as the priest went up to the altar of the Lord. He saw no sin in it. Joachim said, “Now I know that the Lord God has been reconciled to me and has sent all my sins away from me.” He went down from the Temple of the Lord justified and returned to his house.


    (2) About six months were completed, and in the seventh month Anna gave birth. She said to her midwife, “What is it?”


    The midwife said, “It is a girl!”


    Anna said, “My soul is magnified this day!” Then she laid her child down.


    When her days were completed, Anna cleansed her flow of blood. She gave her breast to the child and named her Mary.'
translation:
  language: ko
  text: '(1) 이튿날 요아킴은 예물을 바치면서 속으로 말했습니다. “주 하나님께서 나와 화해하셨다면, 제사장이 착용한 패가 그것을 내게 분명히 보여 줄 것이다.” 요아킴은 예물을 바치고, 제사장이 주님의 제단으로 올라갈 때 그 패를 유심히 살펴보았습니다. 그는 그 패에서 죄를 보지 못했습니다.[a] 요아킴이 말했습니다. “이제 나는 주 하나님께서 나와 화해하시고 내 모든 죄를 내게서 멀리 보내셨다는 것을 안다.” 그는 의롭다 하심을 받고 주님의 성전에서 내려와 자기 집으로 돌아갔습니다.[b]


    (2) 여섯 달가량이 차고 일곱째 달에 안나가 아이를 낳았습니다.[c] 안나가 산파에게 물었습니다. “무엇입니까?”


    산파가 대답했습니다. “딸입니다!”


    안나가 말했습니다. “오늘 내 영혼이 크게 높아졌습니다!”[d] 그러고는 아이를 눕혔습니다.


    정해진 날들이 다 차자, 안나는 피의 유출에서 자신을 정결하게 했습니다.[e] 그리고 아이에게 젖을 물리고 이름을 마리아라고 지었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘패’가 정확히 무엇이며, 그 안에서 ‘죄를 보지 못했다’는 말이 어떤 표징을 가리키는지는 본문에 분명히 설명되어 있지 않습니다.
    reason: 제사장 복식과 표징에 관한 본문의 실제 모호성을 보존하기 위해서입니다.
  - marker: b
    text: ‘의롭다 하심을 받고’는 요아킴이 하나님께 받아들여졌거나 옳다고 인정받은 상태로 성전을 떠났다는 뜻일 수 있습니다.
    reason: 법정적·종교적 의미 범위를 독자가 이해하도록 돕되 하나로 확정하지 않기 위해서입니다.
  - marker: c
    text: 일곱째 달에 출산했다는 시간 표현은 전승 본문 그대로입니다.
    reason: 현대의 통상적인 임신 기간에 맞추어 본문을 고치지 않았음을 알리기 위해서입니다.
  - marker: d
    text: 직역하면 ‘오늘 내 영혼이 크게 되었다’ 또는 ‘높아졌다’입니다. 기쁨과 영예로 마음이 크게 고양되었다는 뜻으로 이해할 수 있습니다.
    reason: 후대의 익숙한 성서 문구로 동일시하거나 의미를 단순화하지 않기 위해서입니다.
  - marker: e
    text: 산후 출혈이 끝난 뒤 행한 정결을 가리키는 표현입니다.
    reason: 고대의 출산 및 정결 관습을 현대 독자가 이해하도록 돕기 위해서입니다.
lexical_decisions:
- source_word: plate worn by the priest
  choice: 제사장이 착용한 패
  rationale: 제사장 복식에 부착된 물건이라는 의미는 드러내되, 그 정확한 정체를 단정하지 않도록 일반적인 ‘패’를 사용했습니다.
- source_word: reconciled to me
  choice: 나와 화해하셨다
  rationale: 하나님과 요아킴 사이의 관계가 회복되었다는 표현을 직접 보존했습니다.
- source_word: sent all my sins away from me
  choice: 내 모든 죄를 내게서 멀리 보내셨다
  rationale: ‘용서하셨다’로 매끄럽게 바꾸지 않고, 죄를 보내 버린다는 원문의 구체적 비유를 살렸습니다.
- source_word: justified
  choice: 의롭다 하심을 받고
  rationale: 단순히 ‘기뻐하며’나 ‘결백해져서’로 풀지 않고 법정적·종교적 함의를 보존했습니다.
- source_word: My soul is magnified
  choice: 내 영혼이 크게 높아졌습니다
  rationale: 수동적이거나 상태적인 표현의 낯섦을 유지하면서도 현대 한국어로 이해할 수 있게 옮겼습니다.
- source_word: cleansed her flow of blood
  choice: 피의 유출에서 자신을 정결하게 했습니다
  rationale: 산후 출혈 및 정결 의례와 관련된 표현을 완곡하게 지우지 않고 보존했습니다.
theological_decisions:
- issue: 제사장의 패에서 죄를 보았는지 여부
  choice: ‘그 패에서 죄를 보지 못했다’를 그대로 유지
  alternative: 패의 광채나 표징을 보고 자신의 제물이 받아들여졌음을 알았다고 해설
  rationale: 본문 자체의 모호한 표징을 특정한 제사장 복식이나 기적으로 단정하지 않았습니다.
- issue: 요아킴이 성전에서 내려올 때의 상태
  choice: ‘의롭다 하심을 받고’
  alternative: ‘자신이 의롭다는 확신을 얻어’ 또는 ‘정당함을 인정받아’
  rationale: ‘justified’의 신학적 긴장을 유지하고 주관적 확신으로 축소하지 않았습니다.
- issue: 안나의 산후 정결
  choice: 피의 유출에서 자신을 정결하게 했다고 번역
  alternative: 산후 회복이 끝났다고 의역
  rationale: 정결 의례와 신체적 출혈이 함께 암시되는 표현을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 품위 있고 읽기 쉽게 다듬되, 제사장의 패, 죄의 표징, ‘의롭다 하심’, 안나의 영혼이 높아졌다는 표현 등 원문 증언의 낯섦과 신학적 긴장은 유지했습니다. 제공된 자료가 공개 영역 영어 증언에 기반하고 그리스어 원문 검토가 아직 예정되어 있으므로, 원어 형태를 확정적으로 재구성하지 않았습니다.
