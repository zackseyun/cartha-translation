base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/021.yaml
  text: '(1) Look! Joseph was preparing to go into Judea when a great commotion arose in Bethlehem of Judea. Magi arrived, asking, “Where is the king of the Jews? We saw his star in the East and have come to worship him.”


    (2) When Herod heard this, he was disturbed. He sent officers to the magi, summoned the chief priests, and questioned them in his palace. He asked them, “What has been written about the Christ? Where will he be born?”


    They answered him, “In Bethlehem of Judea, for that is what is written.” Then he released them—the chief priests.


    He questioned the magi, asking them, “What sign did you see concerning the one who has been born king?”


    The magi answered, “We saw an immense star shining among the other stars and dimming them so greatly that they were no longer visible. So we knew that a king had been born for Israel, and we came to worship him.”


    Herod told them, “Go and search. If you find him, report back to me so that I too may come and worship him.”


    (3) The magi went, and look! The star they had seen in the East led them until they came to the cave, and it stood over the head of the cave. When they saw him with his mother Mary, the magi took gifts from their bags: gold, frankincense, and myrrh.


    After an angel warned them not to go into Judea, they returned to their own country by another way.'
translation:
  language: ko
  text: '(1) 보십시오! 요셉이 유대로 떠날 채비를 하고 있을 때, 유대 베들레헴에 큰 소동이 일어났습니다. 박사들[a]이 와서 물었습니다. “유대인의 왕으로 나신 분이 어디에 계십니까? 우리는 동방에서[b] 그분의 별을 보고 그분께 경배하러 왔습니다.”


    (2) 헤롯은 이 말을 듣고 불안해졌습니다. 그는 관리들을 박사들에게 보내고, 대제사장들을 불러 궁전에서 심문하며 말했습니다. “그리스도에 관하여 무엇이라고 기록되어 있습니까? 그는 어디에서 태어날 것입니까?”


    그들이 헤롯에게 대답했습니다. “유대 베들레헴입니다. 그렇게 기록되어 있기 때문입니다.” 그러자 헤롯은 그들, 곧 대제사장들을 놓아주었습니다.


    또 헤롯은 박사들에게 물었습니다. “왕으로 나신 분에 관하여 여러분은 무슨 표징을 보았습니까?”


    박사들이 대답했습니다. “우리는 다른 별들 사이에서 빛나는 엄청나게 큰 별을 보았습니다. 그 별이 다른 별들의 빛을 너무도 흐리게 하여 그것들이 전혀 보이지 않을 정도였습니다. 그래서 우리는 이스라엘을 위한 왕이 태어나셨음을 알고 그분께 경배하러 왔습니다.”


    헤롯이 그들에게 말했습니다. “가서 찾아보십시오. 그를 찾거든 내게 알려 주십시오. 나도 가서 그에게 경배하겠습니다.”


    (3) 박사들이 길을 떠났습니다. 보십시오! 그들이 동방에서 보았던 별이 그들을 인도하여 동굴에 이르게 하였고, 동굴 입구 위에[c] 멈추어 섰습니다. 그들이 아기와 그의 어머니 마리아를 보고는 자루에서 예물, 곧 금과 유향과 몰약을 꺼냈습니다.


    그들은 천사에게서 유대로 가지 말라는 경고를 받고[d], 다른 길로 자기 나라에 돌아갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘박사들’은 고대에 별을 관찰하고 꿈이나 징조를 해석하던 현자들을 가리킵니다.
    reason: 현대 한국어에서 ‘박사’가 학위 소지자만을 뜻하는 것으로 오해될 수 있습니다.
  - marker: b
    text: ‘동방에서’는 ‘동쪽에서’ 또는 ‘별이 떠오를 때’로 이해될 수도 있습니다.
    reason: 기초가 된 증언의 표현이 장소와 천문 현상 사이의 해석 가능성을 남깁니다.
  - marker: c
    text: 직역하면 ‘동굴의 머리 위에’입니다. 동굴의 앞쪽이나 입구 위를 가리키는 것으로 보입니다.
    reason: 비유적인 공간 표현을 자연스럽게 옮기면서 직역의 형태도 보존합니다.
  - marker: d
    text: 본문은 ‘헤롯에게 돌아가지 말라’가 아니라 ‘유대로 가지 말라’고 되어 있습니다.
    reason: 익숙한 마태복음 본문과 조화시키지 않고 이 문헌 고유의 표현을 보존합니다.
lexical_decisions:
- source_word: magi
  choice: 박사들
  rationale: 한국어 성서 독자에게 익숙한 표현을 사용하되, 현대적 의미의 학위 소지자로 오해될 수 있어 각주에서 고대의 점성술·꿈 해석 등에 숙련된 현자들이라는 뜻을 밝혔습니다.
- source_word: worship
  choice: 경배하다
  rationale: 왕에게 예를 갖추어 엎드리는 행위와 종교적 숭배의 가능성을 함께 담아, 본문이 지닌 의미의 폭을 보존합니다.
- source_word: Christ
  choice: 그리스도
  rationale: 고유한 칭호로 정착한 한국어 성서 용례를 따르며 ‘기름부음받은 이’라는 배경을 교파적으로 확장하지 않았습니다.
- source_word: in the East
  choice: 동방에서
  rationale: 장소 또는 별이 떠오르는 방향으로 이해할 여지가 있어 전통적이면서도 간결한 표현을 택하고 각주로 모호성을 보존했습니다.
- source_word: head of the cave
  choice: 동굴 입구 위
  rationale: 문맥상 동굴의 앞쪽 또는 입구 위를 가리키는 표현으로 자연스럽게 옮겼으며, 직역 가능성은 각주에 밝혔습니다.
theological_decisions:
- issue: 박사들이 아기에게 한 행위의 성격
  choice: 경배하다
  alternative: 절하다
  rationale: 왕에 대한 복종과 종교적 숭배 중 하나로 한정하지 않고 원문의 신학적 긴장을 유지합니다.
- issue: ‘이스라엘을 위한 왕’의 관계 표현
  choice: 이스라엘을 위한 왕
  alternative: 이스라엘의 왕
  rationale: 제시된 증거의 ‘for Israel’이 나타내는 수혜·관계의 뉘앙스를 ‘이스라엘의 왕’으로 단순 확정하지 않았습니다.
- issue: 천사의 경고 내용
  choice: 유대로 가지 말라는 경고
  alternative: 헤롯에게 돌아가지 말라는 경고
  rationale: 마태복음과 조화시키지 않고 제공된 증언의 난해한 지리 표현을 그대로 보존했습니다.
- issue: 그리스도의 출생에 관한 서술의 시제
  choice: 그는 어디에서 태어날 것입니까?
  alternative: 그는 어디에서 태어났습니까?
  rationale: 헤롯의 질문에 나타난 미래적 표현을 보존하여 앞선 ‘나신 분’이라는 표현과의 서사적 긴장을 제거하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 반복되는 ‘보십시오!’와 연결 구조는 고대 서사의 생동감을 살리기 위해 유지하되, 지나친 번역투는 줄였습니다. 그리스어 원문 대조가 아직 이루어지지 않았으므로, 제공된 공개 영역 영어 증언을 토대로 작성한 잠정 출판 초안입니다.
