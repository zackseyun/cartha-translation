translation:
  language: ko
  text: '## 야고보 원복음서 20장 — 살로메의 확인


    (1) 그 여자가 안으로 들어가 산모의 자세를 잡아 주었고[a], 살로메는 산모의 상태를 살펴보았습니다. 그러자 살로메가 부르짖었습니다. “내가 살아 계신 하나님을 시험했구나. 보십시오! 내 손이 불타며 내게서 떨어져 나가고 있습니다!”


    (2) 그 여자가 주님께 기도하자, 바로 그때 산파가 나았습니다.[b]


    (3) 보십시오! 주님의 천사가 살로메 앞에 서서 말했습니다. “네 기도가 주 하나님 앞에 상달되었다. 가서 그 아이를 만져라. 그러면 네가 구원을 받을 것이다.”


    (4) 살로메가 그대로 하자 나았습니다. 살로메가 경배하고 동굴에서 나갈 때, 보십시오! 주님의 천사가 말하는 음성이 들렸습니다. “살로메야, 살로메야, 그 아이가 예루살렘에 들어갈 때까지 네가 본 놀라운 일들을 알리지 마라.”[c]


    [a] 이 문장의 ‘그 여자’와 ‘산모’에 해당하는 대명사의 지시 대상은 전승 문맥에서 다소 모호합니다.


    [b] 본문은 기도한 이를 대명사로 가리킨 뒤, 나은 이를 ‘산파’라고 부릅니다. 이 둘을 모두 살로메라고 단정하지 않고 표현상의 차이를 보존했습니다.


    [c] ‘그 아이가 예루살렘에 들어갈 때까지’는 그때까지 알리지 말라는 시간적 제한으로 옮겼습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장의 ‘그 여자’와 ‘산모’에 해당하는 대명사의 지시 대상은 전승 문맥에서 다소 모호합니다.
    reason: 영어 증언의 모호한 대명사를 한국어 문법상 일부 명료화하면서도 불확실성을 독자에게 알립니다.
  - marker: b
    text: 본문은 기도한 이를 대명사로 가리킨 뒤, 나은 이를 ‘산파’라고 부릅니다. 이 둘을 모두 살로메라고 단정하지 않고 표현상의 차이를 보존했습니다.
    reason: 살로메와 산파의 동일성에 관한 본문의 표현상 긴장을 보존합니다.
  - marker: c
    text: ‘그 아이가 예루살렘에 들어갈 때까지’는 그때까지 알리지 말라는 시간적 제한으로 옮겼습니다.
    reason: 영어 ‘until’이 지닌 시간적 기능을 명시하되 사건의 신학적 정체는 규정하지 않습니다.
lexical_decisions:
- source_word: living God
  choice: 살아 계신 하나님
  rationale: 성서적 울림을 유지하면서도 현대 한국어에서 자연스럽고 존중하는 표현입니다.
- source_word: examined her condition
  choice: 산모의 상태를 살펴보았습니다
  rationale: 제공된 영어 증언이 신체 부위를 완곡하게 표현하므로, 원어 검토가 끝나기 전까지 그 완곡성과 불확실성을 유지했습니다.
- source_word: on fire and falling away from me
  choice: 불타며 내게서 떨어져 나가고 있습니다
  rationale: 형벌의 강렬한 신체적 묘사를 약화하거나 비유로 바꾸지 않고 보존했습니다.
- source_word: healed
  choice: 나았습니다
  rationale: 신체가 회복되는 문맥에 맞는 평이한 현대어이며, 치유의 주체를 본문 이상으로 명시하지 않습니다.
- source_word: salvation
  choice: 구원
  rationale: 신체적 치유와 더 넓은 구원의 의미가 함께 열려 있도록 전통적이면서 포괄적인 용어를 사용했습니다.
- source_word: wonderful things
  choice: 놀라운 일들
  rationale: ‘기적’으로 의미를 좁히지 않고 목격한 비범한 사건들을 가리키도록 옮겼습니다.
theological_decisions:
- issue: 살로메가 하나님을 ‘시험했다’는 고백
  choice: 내가 살아 계신 하나님을 시험했구나
  alternative: 내가 살아 계신 하나님을 의심했구나
  rationale: 본문의 강한 법정적·종교적 표현을 단순한 심리적 의심으로 완화하지 않았습니다.
- issue: 아이를 만지는 행위와 구원의 관계
  choice: 가서 그 아이를 만져라. 그러면 네가 구원을 받을 것이다
  alternative: 가서 그 아이를 만져 치유를 받아라
  rationale: 본문의 ‘구원’을 ‘치유’로만 축소하지 않고, 행위와 약속 사이의 직접적인 연결도 그대로 유지했습니다.
- issue: 기도한 여자와 치유된 산파의 동일성
  choice: 대명사와 ‘산파’의 표현상 차이를 유지
  alternative: 살로메가 기도하자 살로메가 나았습니다
  rationale: 제공된 증언이 지닌 인물 지칭의 긴장과 모호성을 교리적 또는 서사적으로 해소하지 않았습니다.
- issue: 예루살렘 입성 전까지의 발설 금지
  choice: 그 아이가 예루살렘에 들어갈 때까지 … 알리지 마라
  alternative: 그 아이가 예루살렘에 들어오면 … 알려라
  rationale: ‘until’의 자연스러운 금지 명령 해석을 따르되, 시점을 별도의 사건과 동일시하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 읽기 쉬운 문장으로 구성하되 ‘보십시오!’, 반복 호격, 직접 명령 등 원문의 극적 특징을 살렸습니다. 제공 자료가 공공 영역 영어 증언이며 그리스어 직접 검토가 보류 중이므로, 신체 검사 표현과 대명사 지시 관계를 과도하게 확정하지 않았습니다.
