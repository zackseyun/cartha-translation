base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/010.yaml
  text: '(1) A council of the priests met and said, “Let us make a veil for the Temple of the Lord.”


    The priest said, “Call the pure virgins from the tribe of David to me.” The officers went out and searched, and they found seven. Then the priest remembered that the child Mary was from the tribe of David and was pure before God. So the officers went out and brought her.


    (2) They brought them into the Temple of the Lord, and the priest said, “Cast lots for me to determine who will spin the gold, the white, the linen, the silk, the violet, the scarlet, and the true purple.”


    The lot for the true purple and the scarlet fell to Mary, and she took them to her house. This was when Zechariah became silent, and Samuel took his place until Zechariah could speak. Mary took the scarlet and was spinning it.'
translation:
  language: ko
  text: '(1) 제사장들이 회의를 열고 말했습니다. “주님의 성전을 위한 휘장을 만듭시다.”


    제사장이 말했습니다. “다윗 지파의 정결한 처녀들을 내게 불러오시오.” 관리들이 나가 찾아서 일곱 명을 찾아냈습니다. 그때 제사장은 어린 마리아도 다윗 지파 출신이며 하나님 앞에서 정결하다는 것을 기억했습니다. 관리들은 나가서 마리아를 데려왔습니다.


    (2) 그들은 처녀들을 주님의 성전 안으로 데려왔습니다. 제사장이 말했습니다. “누가 금빛 실과 흰 실과 아마실과 명주실과 자주색 실과 진홍색 실과 순자색 실을 잣을지 정하도록 나를 위해 제비를 뽑으시오.”[a]


    순자색 실과 진홍색 실의 제비가 마리아에게 돌아갔고, 마리아는 그것들을 자기 집으로 가져갔습니다. 이때 즈가리야가 말을 하지 못하게 되었고, 그가 다시 말할 수 있을 때까지 사무엘이 그 자리를 맡았습니다.[b] 마리아는 진홍색 실을 가져다가 잣고 있었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 열거된 말들은 재료와 색채의 명칭으로 보입니다. 제공된 영어 증언에는 ‘금, 흰색, 아마, 비단, 자주색, 진홍색, 순자색’이 서로 구별되어 있으나, 그 정확한 직물 형태와 일부 색채의 차이는 그리스어 원문 대조가 필요합니다.
    reason: 직접적인 그리스어 검토가 보류된 상태에서 서로 다른 직물·색채 항목을 보존하고 번역상의 불확실성을 알립니다.
  - marker: b
    text: 여기 나오는 사무엘이 누구인지, 또 그가 정확히 어떤 자리를 대신 맡았는지는 제공된 본문만으로 분명하지 않습니다.
    reason: 독자가 이 인물을 구약의 사무엘로 단정하거나 구체적인 성전 직무를 추정하지 않도록 본문의 모호성을 보존합니다.
lexical_decisions:
- source_word: veil
  choice: 휘장
  rationale: 성전 안에 쓰이는 직물이라는 문맥에 맞고, 현대 한국어 성경 독자에게도 자연스럽고 품위 있는 용어입니다.
- source_word: pure virgins
  choice: 정결한 처녀들
  rationale: 의례적·도덕적 함의를 섣불리 한쪽으로 규정하지 않고 ‘pure’와 ‘virgins’를 각각 보존했습니다.
- source_word: officers
  choice: 관리들
  rationale: 구체적인 직책이 불분명하므로 ‘경비병’이나 ‘성전 시종’으로 좁히지 않고 일반적인 직무 명칭으로 옮겼습니다.
- source_word: spin
  choice: 실을 잣다
  rationale: 직물 제작을 위한 섬유 작업을 가리키는 자연스러운 한국어 표현입니다.
- source_word: gold / white / linen / silk / violet / scarlet / true purple
  choice: 금빛 실 / 흰 실 / 아마실 / 명주실 / 자주색 실 / 진홍색 실 / 순자색 실
  rationale: 서로 구별된 재료·색채 항목을 모두 보존하되, 한국어 문장에서는 잣는 대상임을 분명히 하려고 ‘실’을 보충했습니다. ‘금’은 금속 자체인지 금빛 재료인지 불확실하여 ‘금빛 실’로 옮겼습니다.
- source_word: true purple
  choice: 순자색 실
  rationale: 일반 자주색과 구별되는 별도 항목임을 살리면서 ‘진정한 자주색’보다 직물 색채명으로 자연스럽게 표현했습니다.
- source_word: fell silent
  choice: 말을 하지 못하게 되었다
  rationale: 단순히 자발적으로 침묵했다기보다 발화 능력을 잃은 상태를 나타내지만, 원인이나 신학적 해석은 덧붙이지 않았습니다.
theological_decisions:
- issue: ‘하나님 앞에서 정결하다’의 의미
  choice: 하나님 앞에서 정결하다
  alternative: 하나님이 보시기에 순결하다
  rationale: 정결이 의례적 상태인지 도덕적 순결인지 본문만으로 확정하지 않고 원문의 긴장을 보존했습니다.
- issue: 즈가리야의 침묵
  choice: 말을 하지 못하게 되었다
  alternative: 벙어리가 되었다
  rationale: 상태를 분명히 하면서도 현대 독자에게 거칠거나 낙인적으로 들릴 수 있는 표현을 피했고, 그 원인에 관한 교리적 설명을 삽입하지 않았습니다.
- issue: 사무엘의 신원과 직무
  choice: 사무엘이 그 자리를 맡았다
  alternative: 사무엘이 제사장 직무를 대신했다
  rationale: 제공된 증거는 사무엘이 누구인지와 정확히 어떤 직무를 맡았는지 밝히지 않으므로 구체화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 간결하고 품위 있게 유지했으며, 반복되는 접속사는 자연스러운 한국어 흐름에 맞게 일부 조정했습니다. 다만 현재 초안은 제공된 공용 영어 증언을 토대로 한 잠정 번역이며, 그리스어 원문 직접 검토가 필요합니다.
