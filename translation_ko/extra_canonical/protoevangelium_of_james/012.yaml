  yaml_path: translation/extra_canonical/protoevangelium_of_james/012.yaml
  text: '(1) She made the purple and the scarlet and took it to the priest. The priest received it, blessed her, and said, “Mary, the Lord God has magnified your name, and you will be blessed among all the generations of the earth.”


    (2) Mary rejoiced and went to her cousin Elizabeth. She knocked at the door. Elizabeth heard, threw down the scarlet, and rushed to the door. She opened it, blessed Mary, and said, “How is it that the mother of my Lord should come to me? For look, the one in me leaped and blessed you!”


    But Mary had forgotten the mysteries that the angel Gabriel had told her. She looked intently into heaven and said, “Lord, who am I, that all the women of the earth will bless me?”


    (3) She stayed with Elizabeth for three months. Day by day, her womb grew larger, and Mary became afraid. She went to her house and hid herself from the people of Israel. She was sixteen years old when these mysteries happened to her.'
translation:
  language: ko
  text: '## 야고보 원복음서 12장 — 마리아가 엘리사벳을 찾아가다


    **(1)** 마리아는 자줏빛 실과 다홍빛 실로 맡은 일을 마치고 그것을 제사장에게 가져갔습니다. 제사장은 그것을 받아 들고 마리아를 축복하며 말했습니다. “마리아여, 주 하나님께서 그대의 이름을 높이셨습니다. 그대는 땅의 모든 세대 가운데서 복을 받을 것입니다.”


    **(2)** 마리아는 기뻐하며 친족[a] 엘리사벳에게 갔습니다. 마리아가 문을 두드리자, 엘리사벳은 그 소리를 듣고 다홍빛 실을 내려놓은 채 문으로 달려갔습니다. 엘리사벳은 문을 열고 마리아를 축복하며 말했습니다. “내 주의 어머니께서 내게 오시다니, 어찌 된 일입니까? 보십시오. 내 안에 있는 이가 뛰놀며 그대를 축복했습니다!”


    그러나 마리아는 천사 가브리엘이 자기에게 알려 준 신비로운 일들[b]을 잊고 있었습니다. 마리아는 하늘을 우러러보며 말했습니다. “주님, 제가 누구이기에 땅의 모든 여자가 저를 복되다 하겠습니까?”


    **(3)** 마리아는 엘리사벳과 함께 석 달을 지냈습니다. 날이 갈수록 배가 불러 오자 마리아는 두려워졌습니다. 마리아는 자기 집으로 돌아가 이스라엘 백성의 눈을 피해 숨어 지냈습니다. 이 신비로운 일들이 마리아에게 일어났을 때, 마리아는 열여섯 살이었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘친족’에 해당하는 말은 반드시 사촌만을 뜻하지 않고, 더 넓은 친척 관계를 가리킬 수 있습니다.
    reason: 영어 증언의 ‘cousin’이 혈연관계를 지나치게 구체화할 수 있어 의미 범위를 밝혔습니다.
  - marker: b
    text: ‘신비로운 일들’은 가브리엘이 알려 준 감추어진 뜻이나 계시, 그리고 그와 관련된 사건들을 가리킬 수 있습니다.
    reason: ‘mysteries’의 의미를 한 가지 교리적 해석으로 제한하지 않기 위해 설명했습니다.
lexical_decisions:
- source_word: purple and scarlet
  choice: 자줏빛 실과 다홍빛 실
  rationale: 문맥상 마리아가 맡아 작업하던 직물 재료를 가리키므로 색 이름만 쓰지 않고 ‘실’을 밝혀 현대 독자가 자연스럽게 이해하도록 했습니다.
- source_word: cousin / female relative
  choice: 친족
  rationale: 헬라어 전승에서 특정한 사촌 관계보다 넓은 친족 관계를 뜻할 가능성을 보존했습니다.
- source_word: mysteries
  choice: 신비로운 일들
  rationale: 초자연적 계시와 사건을 가리키는 표현의 여지를 남기면서도, 특정 교리의 전문 용어로 한정하지 않았습니다.
- source_word: the one in me
  choice: 내 안에 있는 이
  rationale: 태아를 가리키는 원문의 완곡하고 인격적인 표현을 해설로 풀지 않고 그대로 보존했습니다.
- source_word: all the generations of the earth
  choice: 땅의 모든 세대
  rationale: 민족이나 시대 가운데 어느 한쪽으로 의미를 좁히지 않고 원문의 세대적 표현을 유지했습니다.
theological_decisions:
- issue: 마리아가 받을 복의 표현
  choice: 복을 받을 것입니다
  alternative: 복되다 일컬어질 것입니다
  rationale: 첫 발언의 수동적 축복 표현을 직접적으로 옮기되, 뒤에 나오는 마리아 자신의 ‘복되다 하다’와 문맥상 구별했습니다.
- issue: 엘리사벳 태중의 아이가 마리아를 축복한다는 진술
  choice: 내 안에 있는 이가 뛰놀며 그대를 축복했습니다
  alternative: 내 태중의 아이가 기뻐 뛰놀았습니다
  rationale: 정경 복음서의 평행 표현으로 동화하거나 의미를 완화하지 않고, 이 문헌 자체의 독특한 진술과 신학적 긴장을 보존했습니다.
- issue: 마리아가 가브리엘의 말을 잊었다는 진술
  choice: 잊고 있었습니다
  alternative: 미처 기억하지 못했습니다
  rationale: 마리아의 상태를 완화하거나 조화시키지 않고 전승의 직설적인 표현을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체 서술을 사용했습니다. 반복되는 접속사와 짧은 문장의 고대 서사적 리듬은 어느 정도 살리되, 한국어에서 지나치게 번역투로 들리는 부분은 자연스럽게 연결했습니다. 직접 헬라어 대조가 아직 완료되지 않았다는 자료 상태를 고려하여, 구체적인 친족 관계나 ‘신비’의 성격을 단정하지 않았습니다.
