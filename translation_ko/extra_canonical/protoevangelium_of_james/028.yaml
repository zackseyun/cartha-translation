translation:
  language: ko
  text: '(1) 요셉은 산에서 내려오는 한 여인을 만나 데려왔습니다.[a] 요셉이 산파에게 말했습니다. “마리아는 제 약혼녀입니다. 마리아는 주님의 성전에서 자랐으며, 성령으로 잉태했습니다.”


    산파는 요셉과 함께 갔습니다. (2) 그들이 동굴 앞에 이르자, 어두운 구름이 동굴을 뒤덮었습니다. 산파가 말했습니다. “오늘 내 영혼이 높임을 받았습니다.[b] 오늘 내 눈으로 놀라운 일을 보았기 때문입니다. 이스라엘을 위한 구원이 태어났습니다!”


    그러자 곧 구름이 동굴에서 걷히고, 동굴 안에 큰 빛이 나타났습니다. 그들의 눈은 그 빛을 견딜 수 없었습니다. 잠시 뒤 그 빛이 차츰 사라지면서 한 아기가 모습을 드러냈습니다. 아기는 다가가 어머니 마리아의 젖을 물었습니다.


    산파가 외쳤습니다. “오늘은 참으로 위대한 날입니다. 내가 이 새로운 기적을 보았기 때문입니다!”


    (3) 산파가 동굴 밖으로 나오자 살로메가 그를 만났습니다.


    산파가 살로메에게 말했습니다. “살로메, 살로메, 내가 당신에게 새로운 광경을 이야기해 주어야겠습니다. 처녀가 아이를 낳았습니다. 이는 그의 본성에 어긋나는 일입니다!”


    살로메가 말했습니다. “주 나의 하나님께서 살아 계심을 두고 맹세합니다. 내가 손가락을 넣어 그의 상태를 살펴보지 않고서는, 그 처녀가 아이를 낳았다는 것을 믿지 않겠습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절 첫 문장의 전승 문구는 압축적이고 구문이 불분명합니다. 여기서는 요셉이 산에서 내려오는 여인을 만나 산파로 데려왔다는 뜻으로 옮겼습니다.
    reason: 제공된 영어 증언 자체가 괄호로 불확실성을 표시하며, 그리스어 전승에 대한 직접 대조가 아직 이루어지지 않았기 때문입니다.
  - marker: b
    text: 직역하면 “오늘 내 영혼이 크게 되었습니다” 또는 “높여졌습니다”입니다.
    reason: 일상적인 기쁨의 표현으로 평탄화하지 않고, 찬가를 연상시키는 독특한 표현을 보존하면서 의미를 안내하기 위해서입니다.
lexical_decisions:
- source_word: betrothed
  choice: 약혼녀
  rationale: 당시의 법적·사회적 약혼 관계를 현대 독자가 자연스럽게 이해하도록 하되, 이미 혼인한 아내로 바꾸지 않았습니다.
- source_word: overshadowed
  choice: 뒤덮었습니다
  rationale: 구름이 동굴 위에 드리워지는 초자연적 장면을 자연스러운 한국어로 전달했습니다.
- source_word: Salvation
  choice: 구원
  rationale: 추상적 사건과 태어난 아기를 함께 가리킬 수 있는 원문의 신학적 중의성을 보존했습니다.
- source_word: took the breast
  choice: 젖을 물었습니다
  rationale: 갓난아기의 수유 행동을 현대 한국어에서 자연스럽고 품위 있게 표현했습니다.
- source_word: condition
  choice: 상태
  rationale: 원문 증언의 완곡성을 유지하면서 뒤따르는 신체 검사의 성격을 임의로 더 구체화하지 않았습니다.
theological_decisions:
- issue: 성령 잉태와 성전 양육의 관계
  choice: “마리아는 주님의 성전에서 자랐으며, 성령으로 잉태했습니다”로 병렬 제시
  alternative: 성전에서 자랐기 때문에 성령으로 잉태했다는 인과적 표현
  rationale: 본문이 명시하지 않은 인과관계나 교리적 설명을 덧붙이지 않았습니다.
- issue: “이스라엘을 위한 구원”의 지시 대상
  choice: 구원을 인격화하거나 곧바로 특정 칭호로 풀지 않음
  alternative: “이스라엘의 구원자께서 태어나셨습니다”
  rationale: 구원 자체가 태어났다는 본문의 긴장과 시적 표현을 보존했습니다.
- issue: 처녀 출산에 대한 살로메의 검증 요구
  choice: 신체 검사의 불편한 구체성을 완화하거나 삭제하지 않음
  alternative: “직접 확인하지 않고서는”과 같은 일반화
  rationale: 이후 서사 전개에 중요한 살로메의 불신과 실제 검증 의도를 충실히 남겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 반복되는 접속사는 한국어 서사 흐름에 맞게 일부 조정했으나 장면의 연속성과 반복 강조는 유지했습니다. 제공 자료가 공공 영역 영어 증언이며 그리스어 원문 검토가 보류된 상태이므로, 특히 첫 문장과 세부 어휘의 번역은 잠정적입니다.
