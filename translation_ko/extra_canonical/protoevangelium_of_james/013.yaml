  text: '(1) She was in her sixth month. And look! Joseph came from his building, entered the house, and found her pregnant. He struck his face, threw himself on the ground in sackcloth, and wept bitterly, saying, “How can I face the Lord God? What prayer can I offer concerning this young girl, since I received her as a virgin from the Temple of the Lord God and did not protect her? Who has set this trap for me? Who has done this evil thing in my house? Who has defiled the virgin? Am I not reliving the story of Adam? For while Adam was giving glory during the hour of prayer, the serpent came, found Eve alone, and deceived her. And now it has happened to me!”


    (2) Joseph got up from the sackcloth, called her, and said to her, “God cared for you. Why have you done this? You have forgotten the Lord your God. Why have you humiliated your soul? You were nourished in the Holy of Holies and received food from the hand of an angel!”


    (3) She wept bitterly, saying, “I am pure, and I have not known a man!”


    Joseph said to her, “Then where did this thing in your womb come from?”


    She said, “As the Lord my God lives, I do not know where it came from!”'
translation:
  language: ko
  text: '(1) 마리아가 임신한 지 여섯 달째였습니다. 보십시오! 요셉이 건축 일을 하던 곳에서 돌아와 집에 들어갔다가, 마리아가 임신한 것을 알게 되었습니다. 요셉은 자기 얼굴을 치고 자루옷을 입은 채 땅에 엎드려 몹시 울며 말했습니다. “내가 어떻게 주 하나님을 뵐 수 있겠습니까? 이 소녀를 두고 무슨 기도를 드릴 수 있겠습니까? 나는 주 하나님의 성전에서 이 소녀를 처녀인 채로 맡았으나 지켜 주지 못했습니다. 누가 나에게 이런 덫을 놓았습니까? 누가 내 집에서 이런 악한 일을 저질렀습니까? 누가 이 처녀를 더럽혔습니까? 내가 지금 아담의 일을 다시 겪고 있는 것이 아닙니까? 아담이 기도하는 시간에 하나님께 영광을 돌리고 있을 때, 뱀이 와서 홀로 있는 하와를 발견하고 속였습니다. 그런데 이제 그 일이 나에게도 일어났습니다!”


    (2) 요셉은 자루옷을 깔고 앉았던 자리에서 일어나 마리아를 불러 말했습니다. “하나님께서 너를 돌보셨는데, 어찌하여 이런 일을 하였느냐? 너는 주 너의 하나님을 잊었구나. 어찌하여 네 영혼을 욕되게 하였느냐? 너는 지성소에서 양육받고 천사의 손에서 음식을 받아먹지 않았느냐!”


    (3) 마리아는 몹시 울며 말했습니다. “저는 깨끗합니다. 저는 남자를 안 적이 없습니다!”[a]


    요셉이 마리아에게 말했습니다. “그러면 네 태중에 있는 이것은 어디에서 생겼느냐?”


    마리아가 말했습니다. “주 나의 하나님께서 살아 계심을 두고 맹세하지만, 저는 이것이 어디에서 생겼는지 모릅니다!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남자를 알다’는 여기서 남자와 성관계를 맺는다는 뜻의 완곡한 표현입니다.
    reason: 현대 독자가 문자적 인식 행위로 오해하지 않도록 성서적 관용 표현을 설명합니다.
lexical_decisions:
- source_word: in her sixth month
  choice: 임신한 지 여섯 달째
  rationale: 문맥상 임신 기간을 가리키므로 한국어에서 오해 없이 자연스럽게 밝혔습니다.
- source_word: from his building
  choice: 건축 일을 하던 곳에서
  rationale: ‘building’이 건물 자체인지 건축 작업인지 영어 증언만으로 확정하기 어렵지만, 요셉이 건축 일을 마치고 돌아온다는 문맥을 자연스럽게 전달했습니다.
- source_word: sackcloth
  choice: 자루옷
  rationale: 슬픔과 회개의 표지인 고대의 거친 천옷을 전통적이고 이해 가능한 표현으로 옮겼습니다.
- source_word: Holy of Holies
  choice: 지성소
  rationale: 성전의 가장 거룩한 곳을 가리키는 정착된 한국어 성서 용어를 사용했습니다.
- source_word: known a man
  choice: 남자를 안 적이 없습니다
  rationale: 성관계를 뜻하는 성서적 완곡어법을 보존하면서 각주로 의미를 밝혔습니다.
- source_word: humiliated your soul
  choice: 네 영혼을 욕되게 하였느냐
  rationale: 도덕적 수치와 자기 훼손의 뉘앙스를 보존하되, 특정 교리적 해석으로 좁히지 않았습니다.
theological_decisions:
- issue: 마리아의 임신 원인에 대한 서술
  choice: 이것이 어디에서 생겼는지 모릅니다
  alternative: 성령으로 잉태되었다고 명시
  rationale: 이 장면에서 마리아 자신이 원인을 모른다고 진술하는 서사적 긴장을 그대로 보존하고, 다른 전승의 설명을 본문에 끌어오지 않았습니다.
- issue: 요셉의 아담·하와 유비
  choice: 원문의 비난과 자기 연루 의식을 그대로 유지
  alternative: 마리아를 하와와 직접 동일시하거나 유비를 완화
  rationale: 요셉의 관점에서 제시되는 수사적 질문과 신학적 긴장을 해소하지 않았습니다.
- issue: ‘깨끗하다’의 의미
  choice: 저는 깨끗합니다
  alternative: 저는 결백합니다 또는 저는 처녀입니다
  rationale: 의례적·성적·도덕적 함의를 함께 지닐 수 있는 표현의 폭을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 품위 있고 쉽게 읽히도록 다듬었으며, 대화에서는 관계와 장면에 맞게 요셉이 마리아에게 하대하고 마리아는 공손하게 응답하도록 했습니다. 직접 그리스어 대조가 아직 이루어지지 않았으므로, 제공된 공용 영어 증언과 감수된 영어 POB를 토대로 작성한 잠정 번역입니다.
