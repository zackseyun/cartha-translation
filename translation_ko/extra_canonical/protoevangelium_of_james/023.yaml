translation:
  language: ko
  text: '(1) 그러나 헤롯은 요한을 찾으며 관리들을 즈가리야에게 보내 이렇게 물었습니다. “네 아들을 어디에 숨겼느냐?”


    그러자 즈가리야가 그들에게 대답했습니다. “나는 하나님의 일꾼이며 하나님의 성전에서 섬기고 있습니다.[a] 내가 어찌 내 아들이 어디 있는지 알겠습니까?”


    (2) 관리들은 돌아가 이 모든 일을 헤롯에게 보고했습니다. 헤롯은 화를 내며 말했습니다. “그의 아들이 이스라엘의 왕이 되려 하고 있다!”[b]


    헤롯은 관리들을 다시 보내 즈가리야에게 이렇게 말하게 했습니다. “사실대로 말하여라. 네 아들이 어디 있느냐? 네 목숨이 내 손에 달려 있다는 것을 알지 않느냐?”


    관리들은 돌아가 이 말을 헤롯에게 보고했습니다.


    (3) 즈가리야가 말했습니다. “당신이 내 피를 흘리면 나는 하나님의 순교자가 될 것입니다.[c] 당신이 주님의 성전 입구에서 무고한 피를 흘리는 것이므로, 주님께서 내 영을 받아 주실 것입니다.”


    동틀 무렵 즈가리야는 살해되었으나, 이스라엘 백성은 그가 살해된 줄을 알지 못했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 증언은 직역하면 “나는 하나님의 일꾼이며 하나님의 성전에 앉아 있습니다”입니다. 여기서는 성전 직무를 수행한다는 뜻으로 옮겼습니다. 그리스어 원문 직접 검토가 필요합니다.
    reason: ‘sit’의 문자적 의미와 직무적 의미 사이의 불확실성을 공개하기 위해서입니다.
  - marker: b
    text: 또는 “그의 아들이 이스라엘의 왕이 되려 한다!” 문맥상 이는 헤롯의 두려움이나 판단을 나타내며, 서술자가 그 내용을 사실로 확증하는 말은 아닙니다.
    reason: ‘is about to’의 임박성·의도성 가능성과 화자 관점을 보존하기 위해서입니다.
  - marker: c
    text: ‘순교자’에 해당하는 말은 본래 ‘증인’이라는 뜻도 지닙니다. 이 문맥에서는 무고하게 피 흘려 죽는 하나님의 증인을 가리킵니다.
    reason: 용어의 역사적 의미 폭과 본문 문맥의 죽음 의미를 함께 전달하기 위해서입니다.
lexical_decisions:
- source_word: minister of God
  choice: 하나님의 일꾼
  rationale: 영어 증언의 ‘minister’가 예배 봉사자 또는 성전 직무자를 가리킬 수 있으므로, 현대 한국어에서 교파적 직함으로 오해되기 쉬운 ‘목회자’나 ‘성직자’를 피하고 폭넓은 표현을 택했습니다.
- source_word: sit in God’s Temple
  choice: 하나님의 성전에서 섬기고 있습니다
  rationale: 문자적으로는 ‘앉아 있습니다’이지만 문맥상 성전에서 직무를 수행한다는 뜻일 가능성이 큽니다. 다만 직접 그리스어 검토가 남아 있어 각주로 직역 가능성을 밝혔습니다.
- source_word: martyr of God
  choice: 하나님의 순교자
  rationale: ‘martyr’의 증언자라는 어원적 폭과 죽임당하는 증인이라는 문맥을 보존하기 위해 전통적이면서도 이해하기 쉬운 ‘순교자’를 사용했습니다.
- source_word: spirit
  choice: 영
  rationale: 죽음의 문맥에서 주님이 받아 주시는 인간의 ‘영’을 가리키는 표현으로 옮겼으며, ‘영혼’으로 확대 해석하지 않았습니다.
- source_word: at the entrance of the Temple of the Lord
  choice: 주님의 성전 입구에서
  rationale: 살해 장소를 나타내는 공간 표현을 간결하고 직접적으로 보존했습니다.
theological_decisions:
- issue: 요한이 이스라엘의 왕이 될 것이라는 헤롯의 판단
  choice: ‘그의 아들이 이스라엘의 왕이 되려 하고 있다’로 화자의 판단으로 제시
  alternative: 요한이 실제로 왕이 되도록 예정되었다는 확정적 진술
  rationale: 본문은 헤롯의 분노 섞인 발언을 전할 뿐 그 판단의 진실성을 승인하지 않습니다. 따라서 서술자의 신학적 단정으로 바꾸지 않았습니다.
- issue: 즈가리야의 ‘순교자’ 지위가 성립하는 조건
  choice: ‘당신이 내 피를 흘리면 … 될 것입니다’로 조건성을 보존
  alternative: ‘나는 하나님의 순교자입니다’로 현재의 확정된 신분을 표현
  rationale: 영어 증언에 나타난 조건 구조를 유지하여 살해와 순교자 됨의 관계를 임의로 해소하지 않았습니다.
- issue: 주님이 즈가리야의 영을 받으시는 근거
  choice: 무고한 피를 흘리는 살해 행위와 연결
  alternative: 즈가리야 개인의 공로나 특정한 사후세계 교리로 설명
  rationale: 본문이 제시하는 인과 관계만 보존하고 별도의 교리 체계를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 자연스럽고 장중하게 유지하되 고어체를 피했습니다. 인명은 현대 한국어 성경에서 널리 쓰이는 ‘헤롯, 요한, 즈가리야’를 따랐습니다. 직접 그리스어 대조가 아직 이루어지지 않았으므로, supplied public-domain English witness에 의존한 잠정 번역이며 특히 ‘sit’과 ‘is about to’는 원문 검토 후 재조정할 수 있습니다.
