    issue: 어린 염소들의 물 마시는 장면의 표현
    rationale: ‘그 주둥이가 물에 잠겨 있었으나’는 단수 지시어 연결이 다소 어색하고, 주둥이 전체가 잠겼다는 인상을 줄 수 있습니다. 원문의 ‘their mouths were in the water’는 ‘주둥이를 물에 담그고 있었으나’로 자연스럽고 충분히 충실하게 옮길 수 있습니다.
  - severity: low
    issue: 마지막 문장의 ‘resumed its course’ 반영
    rationale: ‘다시 움직이기 시작했습니다’도 핵심 뜻은 전달하지만, 원문은 멈춘 모든 것이 본래 진행하던 흐름을 재개한 뜻입니다. ‘본래의 움직임을 되찾았습니다’가 이 뉘앙스를 더 잘 보존합니다.
