  text: '(1) He found a cave there, brought her (to it), stationed his sons with her, and went to look for a Hebrew midwife in the region of Bethlehem.


    (2) Now I, Joseph, was wandering, yet not wandering. I looked up at the dome of heaven and saw it standing still. I looked into the sky and was astonished to see that even the birds of heaven were motionless. I looked at the ground and saw a bowl lying there, and workers reclining. Their hands were in the bowl, and they were chewing but not chewing. They were picking up food but not picking it up, and they were bringing it to their mouths but not bringing it to their mouths. Instead, all their faces were looking upward.


    I saw sheep being driven, but the sheep stood still. The shepherd lifted his hand to strike them, but his hand was raised. I looked into the torrent of the river and saw young goats with their mouths in the water, but they were not drinking.


    Then suddenly, everything resumed its course.'
translation:
  language: ko
  text: '야고보 원복음서 18장 — 시간이 멈추다


    (1) 요셉은 그곳에서 동굴 하나를 발견하고 그 여인을 그 안으로 데려갔습니다. 그리고 자기 아들들을 그 여인 곁에 있게 한 뒤, 베들레헴 지방에서 히브리인 산파를 찾으러 갔습니다.


    (2) 그때 나 요셉은 이리저리 걷고 있었으나 걷고 있지 않았습니다.[a] 내가 하늘의 둥근 천장을 올려다보니 그것은 멈추어 있었습니다.[b] 또 하늘을 바라보니 하늘의 새들마저 움직이지 않는 것이 보여 놀랐습니다. 땅을 내려다보니 그곳에는 그릇 하나가 놓여 있었고, 일꾼들은 비스듬히 기대어 있었습니다. 그들의 손은 그릇 안에 있었으며, 그들은 씹고 있었으나 씹고 있지 않았습니다. 음식을 집어 들고 있었으나 집어 들지 않았고, 입으로 가져가고 있었으나 가져가지 않았습니다. 오히려 그들의 얼굴은 모두 위를 향하고 있었습니다.


    나는 몰려가던 양들도 보았으나, 양들은 멈추어 서 있었습니다. 목자는 양들을 치려고 손을 들었으나, 그의 손은 든 채로 있었습니다. 내가 세차게 흐르는 강물을 바라보니 어린 염소들이 보였습니다. 그 주둥이가 물에 잠겨 있었으나, 물을 마시지는 않았습니다.


    그러다가 갑자기 모든 것이 다시 움직이기 시작했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘걷고 있었으나 걷고 있지 않았습니다’는 시간과 움직임이 멈춘 체험을 역설적으로 표현한 문장입니다. 뜻을 하나로 단정하지 않고 문장의 긴장을 그대로 살렸습니다.
    reason: 독자가 의도적인 모순을 번역 오류로 오해하지 않도록 하면서도 본문의 모호성을 보존하기 위해서입니다.
  - marker: b
    text: ‘하늘의 둥근 천장’은 하늘을 머리 위에 펼쳐진 둥근 덮개처럼 묘사하는 고대적 표현입니다.
    reason: 현대 독자에게 낯선 우주론적 영상을 간단히 설명하기 위해서입니다.
lexical_decisions:
- source_word: cave
  choice: 동굴
  rationale: 문맥상 사람이 들어갈 수 있는 자연적인 굴을 가리키므로 현대 한국어에서 가장 평이하고 정확한 표현을 선택했습니다.
- source_word: Hebrew midwife
  choice: 히브리인 산파
  rationale: 민족적 수식과 산파라는 역할을 모두 보존했습니다. ‘유대인’으로 바꾸지 않아 제시된 증언의 표현을 유지했습니다.
- source_word: wandering but not wandering
  choice: 이리저리 걷고 있었으나 걷고 있지 않았습니다
  rationale: 시간 정지의 역설적인 체험을 설명으로 풀지 않고, 원문의 의도적인 모순 구조를 보존했습니다. 그리스어 직접 대조 전의 잠정 선택입니다.
- source_word: dome of heaven
  choice: 하늘의 둥근 천장
  rationale: 고대 우주관의 시각적 이미지를 살리면서도 ‘궁창’보다 일반 독자에게 즉시 이해되는 표현을 사용했습니다.
- source_word: torrent of the river
  choice: 세차게 흐르는 강물
  rationale: 급하고 거센 물살이라는 의미를 자연스러운 한국어로 드러냈습니다.
- source_word: resumed its course
  choice: 다시 움직이기 시작했습니다
  rationale: 멈추었던 세계의 운동이 한꺼번에 재개되었다는 장면을 간결하고 자연스럽게 전달했습니다.
theological_decisions:
- issue: 시간 정지 환상의 성격
  choice: 요셉이 목격한 현상을 서술하되 그 원인이나 본질을 규정하지 않음
  alternative: 기적, 환상, 또는 우주적 사건이라고 명시함
  rationale: 본문 자체가 현상을 묘사할 뿐 해석을 확정하지 않으므로 그 신학적·문학적 긴장을 그대로 남겼습니다.
- issue: ‘하늘의 둥근 천장’의 우주론적 표현
  choice: 고대적 공간 이미지를 유지함
  alternative: 단순히 ‘하늘’ 또는 ‘우주’로 현대화함
  rationale: 본문의 고대 우주관을 지우거나 현대 과학적 개념으로 대체하지 않기 위해서입니다.
- issue: 요셉의 역설적 행동 묘사
  choice: ‘걷고 있었으나 걷고 있지 않았다’는 모순을 유지함
  alternative: 요셉의 의식만 활동하고 몸은 멈추었다고 해설함
  rationale: 본문이 명시하지 않은 심리적·초자연적 설명을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 반복과 역설은 이 장면의 핵심 문학 장치이므로 자연스럽게 다듬되 삭제하지 않았습니다. 초안은 제공된 공공 영역 영어 증언과 감수용 영어 POB를 바탕으로 작성했으며, 그리스어 사본 전통에 대한 직접 대조가 아직 필요합니다.
