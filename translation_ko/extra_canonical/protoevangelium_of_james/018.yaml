  naturalness: 합쇼체는 일관되고 문체도 대체로 자연스럽습니다. ‘어린 염소들이 보였습니다. 그 주둥이가…’는 지시 대상 연결이 다소 어색하므로, 염소들을 주어로 하여 한 문장으로 처리하는 편이 명료합니다. ‘그의 손은 든 채로 있었습니다’는 손이 들린 상태로 고정되었음을 자연스럽게 전달합니다.
  terminology: ‘동굴’, ‘히브리인 산파’, ‘하늘의 둥근 천장’은 제공된 증언의 의미와 고대적 이미지를 적절히 보존합니다. ‘하늘의 둥근 천장’에 대한 설명 각주도 유익합니다. 역설적 반복인 ‘걷고 있었으나 걷고 있지 않았습니다’ 및 ‘씹고 있었으나 씹고 있지 않았습니다’는 해설로 환원하지 않고 유지한 것이 적절합니다.
  issues:
