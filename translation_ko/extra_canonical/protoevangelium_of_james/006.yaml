  text: '(1) Day by day, the child grew stronger. When she was six months old, her mother stood her on the ground to see whether she could stand. She walked seven steps and came to her mother’s breast. Her mother picked her up and said, “As the Lord my God lives, you will not walk on this ground again until I bring you into the Temple of the Lord.”


    She made a sanctuary in her bedroom and did not allow anything sacrilegious or impure to pass through it. She called the pure daughters of the Hebrews, and they played with her.


    (2) When the child became one year old, Joachim held a great feast and invited the chief priests, the priests, the scribes, the elders, and all the people of Israel. Joachim brought the child to the priests, and they blessed her, saying, “God of our ancestors, bless this child and give her a name that will be spoken forever among all generations.”


    All the people said, “So be it. Amen!”


    They brought her to the chief priests, and they blessed her, saying, “Most High God, look upon this child and bless her with a final blessing that cannot be surpassed.”


    (3) Her mother took her up to the sanctuary of her bedroom and nursed the child. Anna made a song to the Lord God, saying:


    “I will sing a holy song to the Lord my God, because God has visited me and removed the criticism of my enemies.


    “And the Lord God has given me the fruit of God’s justice, singular yet manifold before God.


    “Who will report to Reubel’s people that Anna nurses a child? ‘Listen, listen, twelve tribes of Israel: Anna nurses a child!’”


    Anna rested in the sanctuary of her bedroom. Then she went and ministered to them. When dinner was over, they went down rejoicing and glorifying the God of Israel.'
translation:
  language: ko
  text: '제6장 마리아의 첫해


    (1) 아이는 날마다 튼튼하게 자랐습니다. 아이가 여섯 달이 되었을 때, 어머니는 아이가 설 수 있는지 알아보려고 땅에 세웠습니다. 아이는 일곱 걸음을 걸어 어머니의 품으로 왔습니다. 어머니는 아이를 안아 올리며 말했습니다. “주 나의 하나님께서 살아 계심을 두고 맹세한다. 내가 너를 주님의 성전으로 데려갈 때까지 너는 다시 이 땅을 걷지 않을 것이다.”


    어머니는 자기 침실에 성소를 마련하고, 신성을 더럽히거나 부정한 것은 아무것도 그곳을 지나가지 못하게 했습니다. 그리고 히브리인들의 정결한 딸들을 불러 아이와 함께 놀게 했습니다.


    (2) 아이가 한 살이 되었을 때, 요아킴은 큰 잔치를 열고 대제사장들과 제사장들과 율법학자들과 장로들과 이스라엘의 온 백성을 불렀습니다. 요아킴이 아이를 제사장들에게 데려가자, 그들은 아이를 축복하며 말했습니다. “우리 조상들의 하나님, 이 아이를 복 주시고, 그 이름이 모든 세대에 영원히 불리게 해 주십시오.”


    그러자 온 백성이 말했습니다. “그렇게 되기를 빕니다. 아멘!”


    사람들은 아이를 대제사장들에게 데려갔고, 그들은 아이를 축복하며 말했습니다. “지극히 높으신 하나님, 이 아이를 굽어보시고, 그보다 더할 수 없는 마지막 복을 내려 주십시오.”


    (3) 아이의 어머니는 아이를 침실의 성소로 데리고 올라가 젖을 먹였습니다. 안나는 주 하나님께 노래를 지어 불렀습니다.


    “주 나의 하나님께 거룩한 노래를 부르겠습니다.

    하나님께서 나를 찾아오셔서

    내 원수들의 비난을 없애 주셨기 때문입니다.


    주 하나님께서 내게 하나님의 의의 열매를 주셨습니다.

    그 열매는 하나이면서도 하나님 앞에서는 여럿입니다.[a]


    안나가 아이에게 젖을 먹인다는 소식을

    누가 레우벨의 백성에게 전하겠습니까?[b]

    ‘들으십시오, 들으십시오, 이스라엘의 열두 지파여!

    안나가 아이에게 젖을 먹입니다!’”


    안나는 자기 침실의 성소에서 쉬었습니다. 그런 다음 나가서 손님들의 시중을 들었습니다. 저녁 식사가 끝나자, 그들은 기뻐하며 이스라엘의 하나님께 영광을 돌리면서 내려갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “하나이면서도 … 여럿입니다”는 제공된 영어 증거문의 역설적이고 모호한 표현을 그대로 살린 것입니다. 정확한 문구는 그리스어 본문을 직접 검토해야 합니다.
    reason: 의미가 불확실한 표현을 특정 교리로 해소하지 않기 위해서입니다.
  - marker: b
    text: “레우벨”은 제공된 영어 증거문에 적힌 이름을 음역한 것입니다. 인명과 구문의 정확한 형태는 그리스어 본문을 직접 검토해야 합니다.
    reason: 증거문 자체가 이 이름을 보존하며, 원어 검토가 아직 이루어지지 않았기 때문입니다.
lexical_decisions:
- source_word: sanctuary
  choice: 성소
  rationale: 침실 안에 따로 구별하여 거룩하게 마련한 공간이라는 제의적 뉘앙스를 보존했습니다.
- source_word: sacrilegious or impure
  choice: 신성을 더럽히거나 부정한 것
  rationale: 거룩한 것을 침범한다는 뜻과 의례적·도덕적 부정의 뜻을 구별하여 함께 살렸습니다.
- source_word: scribes
  choice: 율법학자들
  rationale: 현대 독자가 직무를 이해하기 쉽도록 하면서 유대교 문맥을 드러냈습니다.
- source_word: visited me
  choice: 나를 찾아오셔서
  rationale: 하나님의 은혜로운 개입을 뜻하는 전통적 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: fruit of God’s justice
  choice: 하나님의 의의 열매
  rationale: justice가 지닌 하나님의 올바름·의로움이라는 신학적 함의를 ‘의’로 보존하고, 해석을 ‘공의’나 ‘구원 행위’로 좁히지 않았습니다.
- source_word: ministered to them
  choice: 손님들의 시중을 들었습니다
  rationale: 잔치 문맥에서 참석자들을 섬겼다는 실제 행위를 분명히 드러냈습니다.
theological_decisions:
- issue: 마리아를 위해 마련한 공간의 성격
  choice: ‘성소’라고 하여 서술의 강한 거룩함 언어를 유지했습니다.
  alternative: ‘거룩한 방’ 또는 ‘깨끗한 공간’
  rationale: 원문 증거로 제공된 번역문이 sanctuary를 반복하므로, 이를 약화하거나 후대 교리로 확대하지 않았습니다.
- issue: ‘하나이면서도 여럿’인 의의 열매
  choice: 역설적 표현을 그대로 보존했습니다.
  alternative: 마리아 한 사람을 통해 많은 복이 온다는 뜻으로 풀어쓰기
  rationale: 문구 자체가 모호하며 직접 그리스어 검토도 남아 있으므로 특정 신학적 해석으로 확정하지 않았습니다.
- issue: ‘마지막 복’의 의미
  choice: ‘그보다 더할 수 없는 마지막 복’으로 옮겼습니다.
  alternative: ‘완전한 복’ 또는 ‘최고의 복’
  rationale: final과 unsurpassed를 모두 드러내되, 종말론적 의미나 특정 축복 의례로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용했습니다. 서술은 명료하고 품위 있게 유지하되 고어체를 피했으며, 기도와 노래는 운문형 줄바꿈으로 리듬을 살렸습니다. 이 초안은 제공된 공용 영어 증거문과 감사된 영어 POB를 대조하여 작성한 잠정 번역으로, 그리스어 사본 전통에 대한 직접 검토가 필요합니다.
