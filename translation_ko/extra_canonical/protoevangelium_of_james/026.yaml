translation:
  language: ko
  text: 현존하는 가장 이른 사본인 보드머 파피루스 V(3세기 말 또는 4세기 초의 것으로 추정됨)에는 18–21장의 훨씬 짧은 판본이 들어 있습니다. 그 판본을 아래에 제시합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: earliest manuscript
  choice: 현존하는 가장 이른 사본
  rationale: ‘가장 이른 사본’이 원문 자체의 최초 형태라는 뜻으로 오해되지 않도록, 현재 알려져 전하는 사본 가운데 가장 이르다는 의미를 분명히 했습니다.
- source_word: Papyrus Bodmer V
  choice: 보드머 파피루스 V
  rationale: 한국어에서 알아보기 쉬운 통용 음역을 사용하고 사본 번호는 로마 숫자로 보존했습니다.
- source_word: dating to the late third or early fourth century
  choice: 3세기 말 또는 4세기 초의 것으로 추정됨
  rationale: 사본의 연대 판정이 추정임을 자연스럽게 드러내면서 두 시기 사이의 불확실성을 보존했습니다.
- source_word: a much shorter version
  choice: 훨씬 짧은 판본
  rationale: 내용의 단순한 요약이 아니라 본문 형태가 다른 판본을 가리키므로 ‘판본’으로 옮겼습니다.
- source_word: is provided below
  choice: 아래에 제시합니다
  rationale: 부록의 안내문에 어울리는 현대 한국어 합쇼체로 자연스럽게 표현했습니다.
