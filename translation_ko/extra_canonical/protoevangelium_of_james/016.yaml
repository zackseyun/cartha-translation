translation:
  language: ko
  text: '(1) 제사장이 말했습니다. “주님의 성전에서 데려간 그 처녀를 돌려보내시오.”


    요셉은 눈물을 흘렸습니다.


    대제사장이 말했습니다. “내가 당신에게 주님의 책망의 물[a]을 마시게 하겠소. 그러면 그 물이 당신의 죄를 당신 눈앞에 드러낼 것이오.”


    (2) 제사장은 그 물을 가져다가 요셉에게 주어 마시게 하고 그를 광야로 보냈습니다. 요셉은 아무런 해도 입지 않고 돌아왔습니다.


    또 마리아에게도 그 물을 주어 마시게 하고 그녀를 광야로 보냈습니다. 마리아도 아무런 해도 입지 않고 돌아왔습니다.


    그들의 죄가 드러나지 않자, 온 백성이 놀랐습니다.


    (3) 제사장이 말했습니다. “주 하나님께서 당신들의 죄를 드러내지 않으셨으니, 나도 당신들을 심판하지 않겠소.” 그러고는 두 사람을 놓아주었습니다.


    요셉은 기뻐하며 이스라엘의 하나님께 영광을 돌리면서 마리아를 데리고 자기 집으로 갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 책망의 물’은 죄의 유무를 드러내기 위해 마시게 한 시험의 물을 가리킵니다. 민수기 5:11-31의 의례를 떠올리게 하지만, 이 표현의 정확한 형태는 그리스어 본문을 직접 대조할 필요가 있습니다.
    reason: 현대 독자에게 생소한 의례 용어를 설명하고, 상호본문적 관련성을 가능성으로만 제시하기 위해서입니다.
lexical_decisions:
- source_word: virgin
  choice: 처녀
  rationale: 문맥상 마리아의 신분을 가리키는 전통적이고 자연스러운 표현이며, 본문이 강조하는 성적 결백의 쟁점을 보존합니다.
- source_word: water of the Lord’s rebuke
  choice: 주님의 책망의 물
  rationale: 의례적 시험을 가리키는 낯선 명칭을 설명적으로 풀어 없애지 않고 직역에 가깝게 보존했습니다.
- source_word: wilderness
  choice: 광야
  rationale: 성서 및 고대 유대 문맥에 맞는 정착된 용어를 사용했습니다.
- source_word: unharmed
  choice: 아무런 해도 입지 않고
  rationale: 시험 뒤에 처벌이나 신체적 손상이 나타나지 않았다는 의미를 자연스럽게 전달합니다.
- source_word: judge
  choice: 심판하다
  rationale: 제사장이 죄를 판정하고 정죄하는 사법적·종교적 행위를 함께 담도록 했습니다.
- source_word: set them free
  choice: 두 사람을 놓아주었습니다
  rationale: 구금이나 고발 상태에서 풀어 주었다는 문맥적 의미를 분명히 하되 무죄 판결이라는 해석을 과도하게 덧붙이지 않았습니다.
theological_decisions:
- issue: 시험의 결과와 두 사람의 결백
  choice: ‘죄가 드러나지 않았다’는 본문의 소극적 진술을 유지했습니다.
  alternative: 두 사람이 무죄임이 입증되었다고 명시할 수 있습니다.
  rationale: 본문은 시험 결과를 하나님의 비계시와 무사 귀환으로 묘사하므로, 이를 체계적 무죄 선언으로 확대하지 않았습니다.
- issue: ‘당신의 죄를 당신 눈앞에 드러낸다’의 의미
  choice: 원문의 다소 모호한 표현을 그대로 살렸습니다.
  alternative: 죄의 증거가 몸에 나타난다고 설명할 수 있습니다.
  rationale: 직접 그리스어 대조가 아직 이루어지지 않았고, supplied witness 자체가 지닌 모호성을 보존하는 편이 안전합니다.
- issue: 민수기 5장의 의례와의 관계
  choice: 본문 안에서는 특정 율법 의례라고 단정하지 않았습니다.
  alternative: ‘저주의 쓴 물’ 등 민수기 5장의 용어로 번역할 수 있습니다.
  rationale: 분명한 상호본문적 연관 가능성은 있으나, 직접적인 그리스어 검토 없이 동일한 전문 용어로 확정하면 본문의 독자적 표현을 지울 수 있습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 ‘-했습니다’로 통일하고, 제사장들의 직접화법은 고대 배경과 공적 심문 상황을 반영해 ‘-하시오/-하겠소’체로 처리했습니다. 현재 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 그리스어 사본 전통에 대한 직접 검토가 필요합니다.
