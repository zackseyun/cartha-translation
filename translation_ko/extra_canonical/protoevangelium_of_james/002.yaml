  text: '(1) Now his wife, Anna, mourned and lamented for two reasons. She said, “I lament because I am a widow and because I have no child.”


    (2) Now the great day of the Lord was approaching, and her servant Juthine said to her, “How long will you humiliate your soul? Look, the great day of the Lord has approached, and it is not right for you to grieve. Take this headband that the leader of the workplace gave me. It is not right for me to wear it, since I am your servant and it bears a royal mark.”


    (3) Anna said, “Get away from me! I will not do this. The Lord God has greatly humiliated me. Perhaps a trickster gave this to you, and you have come to make me share in your sin.”


    Juthine the servant replied, “Why should I curse you, since you haven’t heard my voice? The Lord God has made your womb infertile, to give you no fruit in Israel.”


    (4) And Anna was very grieved. She removed her garment of mourning, washed her head, and put on her wedding garment. At about the ninth hour, she went down into her garden to walk around. She saw a laurel tree and sat beneath it. After resting, she petitioned the Lord, saying, “God of my ancestors, bless me and hear my prayer, just as you blessed our mother Sarah and gave her a son, Isaac.”'
translation:
  language: ko
  text: '야고보 원복음서 2장 — 안나의 곤경


    (1) 그의 아내 안나는 두 가지 일로 슬피 울며 애통해했습니다. 안나는 말했습니다. “나는 과부가 된 처지를 두고 애통하고, 자식이 없는 것을 두고 애통합니다.”


    (2) 주님의 큰 날이 가까이 오고 있었습니다.[a] 그때 안나의 여종 유틴[b]이 말했습니다. “언제까지 자신을 낮추며 괴로워하시렵니까? 보십시오. 주님의 큰 날이 가까이 왔으니, 슬퍼하시는 것은 옳지 않습니다. 이 머리띠를 받으십시오. 일터의 여주인이 제게 준 것입니다.[c] 저는 주인님의 여종이므로 이것을 두르는 것이 합당하지 않습니다. 이것에는 왕실의 표지가 있습니다.”


    (3) 안나가 말했습니다. “내게서 물러가거라! 나는 그런 일을 하지 않겠다. 주 하나님께서 나를 크게 낮추셨다. 어쩌면 어떤 사기꾼이 이것을 네게 주었고, 너는 나를 네 죄에 끌어들이려고 왔는지도 모른다.”


    그러자 여종 유틴이 말했습니다. “주인님이 제 말을 듣지 않으셨는데, 제가 무엇 때문에 주인님을 저주하겠습니까? 주 하나님께서 주인님의 태를 열매 맺지 못하게 하셔서, 이스라엘 가운데 아무 열매도 주지 않으셨습니다.”


    (4) 안나는 몹시 슬퍼했습니다. 그는 상복을 벗고 머리를 씻은 뒤 혼례복을 입었습니다. 제9시쯤 되어[d] 안나는 거닐려고 자기 동산으로 내려갔습니다. 월계수 한 그루를 보고 그 아래에 앉았습니다. 잠시 쉰 뒤에 주님께 간청하며 말했습니다. “제 조상들의 하나님, 저를 복 주시고 제 기도를 들어 주십시오. 우리 어머니 사라를 복 주시고 그에게 아들 이삭을 주셨던 것처럼 해 주십시오.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 큰 날’은 문맥상 큰 종교 절기를 가리키는 듯하지만, 어느 절기인지는 본문이 밝히지 않습니다.
    reason: 특정 절기로 단정하지 않으면서 현대 독자에게 가능한 문맥을 알려 줍니다.
  - marker: b
    text: ‘유틴’은 그리스어 인명 Ἰουθίν을 옮긴 것입니다. 사본과 번역 전통에서는 이름의 표기가 달라질 수 있습니다.
    reason: 낯선 고유명의 음역이 잠정적임을 밝힙니다.
  - marker: c
    text: ‘일터의 여주인’에 해당하는 표현은 ‘작업장의 책임자’ 또는 ‘그 일을 맡은 여주인’으로도 이해할 수 있습니다.
    reason: 전승 문구의 모호성을 한 가지 사회적 직책으로 고정하지 않습니다.
  - marker: d
    text: 제9시는 해 뜰 때부터 시간을 세던 방식으로 대략 오늘날의 오후 3시 무렵입니다.
    reason: 고대 시간 체계를 현대 독자가 이해하도록 돕습니다.
lexical_decisions:
- source_word: δύο θρήνους / δύο κοπετούς (reflected in the witness as “for two reasons”)
  choice: 두 가지 일로 슬피 울며 애통해했습니다
  rationale: 두 겹의 탄식이라는 반복적 수사와 두 원인—과부 됨과 자식 없음—을 자연스러운 한국어로 함께 보존했습니다.
- source_word: ταπεινοῖς τὴν ψυχήν σου
  choice: 자신을 낮추며 괴로워하시렵니까
  rationale: 직역인 ‘영혼을 낮추다’를 완전히 지우지 않으면서, 문맥상 금식·애도·자기 괴로움의 의미가 독자에게 전달되도록 했습니다.
- source_word: ἡ μεγάλη ἡμέρα κυρίου
  choice: 주님의 큰 날
  rationale: 특정 절기라는 해석으로 확정하지 않고 원문의 표현과 종교적 긴장을 보존했습니다.
- source_word: κεφαλοδέσμιον
  choice: 머리띠
  rationale: 머리에 두르는 장식물이라는 뜻을 간결하고 현대적인 말로 옮겼습니다.
- source_word: χαρακτῆρα βασιλικόν
  choice: 왕실의 표지
  rationale: ‘왕의 표/문양/도장’ 가운데 하나로 과도하게 구체화하지 않고 왕실과 관련된 식별 표시라는 폭을 유지했습니다.
- source_word: ἄκαρπον (sense reflected by “infertile / no fruit”)
  choice: 태를 열매 맺지 못하게 하셔서
  rationale: 불임의 의미와 이어지는 ‘열매’ 비유를 모두 보존했습니다.
- source_word: δάφνη
  choice: 월계수
  rationale: 식물명을 일반 독자가 알아볼 수 있는 통용 한국어로 옮겼습니다.
- source_word: ὥραν ἐνάτην
  choice: 제9시
  rationale: 고대의 시간 표기를 본문에 보존하고 현대 시각은 각주에서 설명했습니다.
theological_decisions:
- issue: ‘주님의 큰 날’의 성격
  choice: 본문에서 ‘주님의 큰 날’로 유지
  alternative: ‘주님의 큰 명절’ 또는 특정 유대 절기명
  rationale: 현 단계의 전승 본문은 어느 절기인지 명시하지 않으므로 종말론적 ‘주의 날’이나 특정 축일로 단정하지 않았습니다.
- issue: 하나님이 안나의 태를 불임으로 만드셨다는 유틴의 발언
  choice: 화자의 주장 그대로 직접화법으로 보존
  alternative: ‘태가 열매 맺지 못하게 되었다’처럼 행위 주체를 흐림
  rationale: 이 말은 서술자의 확정적 교리 진술이 아니라 유틴의 거친 응답입니다. 따라서 발언의 신학적 긴장을 약화하거나 승인하는 해설을 본문에 덧붙이지 않았습니다.
- issue: ‘이스라엘 가운데 열매’의 의미
  choice: ‘아무 열매도 주지 않으셨습니다’로 비유 유지
  alternative: ‘자손을 주지 않으셨습니다’로 해석적 명료화
  rationale: 자녀를 가리키는 문맥은 분명하지만, ‘열매’가 지닌 자손·생산성·공동체적 명예의 함의를 보존했습니다.
- issue: 사라를 ‘우리 어머니’라 부르는 표현
  choice: ‘우리 어머니 사라’로 보존
  alternative: ‘우리 조상 사라’
  rationale: 이스라엘 공동체의 어머니라는 친족적·언약적 표현을 일반화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 기도와 고대 종교 서사의 품위를 살렸습니다. 대화에서는 여종이 안나에게 ‘주인님’과 존댓말을 쓰고, 안나는 여종에게 하대하는 관계를 자연스럽게 드러냈습니다. 다만 제공 자료 자체가 ‘그리스어 원문 검토 대기’ 상태이므로, 특히 유틴의 이름, ‘일터의 여주인’, 왕실 표지에 관한 문구는 향후 그리스어 사본 전통과 대조해 재검토해야 합니다.
