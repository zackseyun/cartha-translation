  yaml_path: translation/extra_canonical/protoevangelium_of_james/014.yaml
  text: '(1) Joseph was very afraid and kept quiet about her as he considered what to do. Joseph said, “If I hide her sin, I will be found resisting the law of the Lord. But if I reveal her to the people of Israel, I am afraid that what is inside her might be angelic, and I will be found handing innocent blood over to the judgment of death. So what will I do about her? I will secretly release her from me.”


    Night overtook him. (2) And look! An angel of the Lord appeared to him in a dream and said, “Do not fear this child, for the one in her is from the Holy Spirit. She will give birth to a son, and you will call his name ‘Jesus,’ because he will save his people from their sins.”


    Joseph awoke from his sleep and glorified the God of Israel, who had shown him grace. And he protected her.'
translation:
  language: ko
  text: '제14장 요셉의 꿈


    (1) 요셉은 몹시 두려워하며 그 여자에 관한 일을 입 밖에 내지 않은 채, 어떻게 해야 할지 곰곰이 생각했습니다. 요셉은 말했습니다. “내가 그 여자의 죄를 숨기면 주님의 율법을 거스른 사람으로 드러날 것입니다. 그러나 그 여자를 이스라엘 백성 앞에 드러내면, 그 여자 안에 있는 것이 혹시 천사에게서 비롯된 것일까 두렵습니다.[a] 그러면 나는 죄 없는 피를 죽음의 심판에 넘긴 사람으로 드러날 것입니다. 그러니 그 여자를 어떻게 해야 하겠습니까? 그 여자를 남몰래 나와의 관계에서 풀어 주어야겠습니다.”[b]


    그러는 사이 밤이 닥쳤습니다. (2) 그런데 보십시오! 주님의 천사가 꿈속에서 요셉에게 나타나 말했습니다. “이 아이를 두려워하지 마라. 그 여자 안에 있는 이는 성령으로부터 왔다. 그 여자는 아들을 낳을 것이며, 너는 그의 이름을 ‘예수’라고 불러라. 그가 자기 백성을 그들의 죄에서 구원할 것이기 때문이다.”


    요셉은 잠에서 깨어나, 자신에게 은혜를 베푸신 이스라엘의 하나님께 영광을 돌렸습니다. 그리고 그 여자를 지켜 주었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사에게서 비롯된 것’은 태중의 존재가 천사 자체라는 뜻인지, 천상적 기원이나 작용과 관련되었다는 뜻인지 분명하지 않은 표현입니다.
    reason: 원문의 신학적·존재론적 모호성을 독자에게 알리기 위해 덧붙였습니다.
  - marker: b
    text: 직역하면 ‘그 여자를 몰래 나에게서 풀어 주겠다’입니다. 이것이 이혼인지 파혼인지 본문만으로는 확정하기 어렵습니다.
    reason: 관계를 끝내려는 행위를 특정한 혼인 법률 용어로 과도하게 규정하지 않기 위해 덧붙였습니다.
lexical_decisions:
- source_word: kept quiet about her
  choice: 그 여자에 관한 일을 입 밖에 내지 않은 채
  rationale: 단순히 침묵했다는 뜻과 그녀의 사정을 공개하지 않았다는 문맥을 자연스럽게 함께 전달했습니다.
- source_word: angelic
  choice: 천사에게서 비롯된 것
  rationale: 태중의 존재 자체가 천사라는 뜻인지 천사와 관련된 기원을 가리키는지 확정하지 않고, 원문의 이례적이고 불확실한 표현을 보존했습니다.
- source_word: release her from me
  choice: 그 여자를 남몰래 나와의 관계에서 풀어 주어야겠습니다
  rationale: ‘버리다’나 특정한 법률 용어로 단정하지 않고, 요셉과의 관계에서 조용히 놓아준다는 원문의 표현을 살렸습니다.
- source_word: the one in her is from the Holy Spirit
  choice: 그 여자 안에 있는 이는 성령으로부터 왔다
  rationale: ‘성령으로 잉태되었다’로 명시화하지 않고, 태중의 존재와 그 기원에 관한 원문의 문장 구조를 유지했습니다.
- source_word: protected her
  choice: 그 여자를 지켜 주었습니다
  rationale: 물리적 보호에만 한정되지 않는 지속적인 돌봄과 보호의 의미를 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 태중의 존재가 ‘천사적’일 가능성
  choice: 천사에게서 비롯된 것일까
  alternative: 천사일까 / 천사적인 것일까
  rationale: 천사 자체인지, 천상적 기원이나 작용을 뜻하는지 모호하므로 존재론적 결론을 내리지 않았습니다.
- issue: 성령과 태중의 존재의 관계
  choice: 성령으로부터 왔다
  alternative: 성령으로 잉태되었다
  rationale: 제공된 증거가 말하는 기원 관계만 번역하고, 익숙한 정경 문구로 조화시키지 않았습니다.
- issue: 요셉이 취하려 한 조치의 법적 성격
  choice: 나와의 관계에서 풀어 주다
  alternative: 이혼하다 / 파혼하다
  rationale: 혼인 또는 약혼의 정확한 법적 단계가 제공된 본문만으로 확정되지 않으므로 특정 제도 용어를 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서사는 읽기 쉽게 다듬되 반복과 돌연한 감탄인 ‘그런데 보십시오!’를 유지했습니다. 현재 초안은 제공된 공용 영어 증언과 영어 POB를 대조하여 작성했으며, 그리스어 사본 전통에 대한 직접 검토가 아직 필요합니다.
