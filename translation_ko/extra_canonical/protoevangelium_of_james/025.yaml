base_translation:
  language: en
  yaml_path: translation/extra_canonical/protoevangelium_of_james/025.yaml
  text: '(1) Now I, James, wrote this account in Jerusalem when there was unrest over Herod’s death. I went into the wilderness until the unrest in Jerusalem had died down. I glorified the Lord God, who gave me the wisdom to write this account.


    (2) And grace will be with all who fear the Lord. Amen.'
translation:
  language: ko
  text: '(1) 나 야고보는 헤롯의 죽음으로 소요가 일어났을 때 예루살렘에서 이 이야기를 기록했습니다. 나는 예루살렘의 소요가 가라앉을 때까지 광야로 들어가 있었습니다. 그리고 이 이야기를 기록할 지혜를 내게 주신 주 하나님께 영광을 돌렸습니다.


    (2) 주님을 경외하는 모든 이와 함께 은혜가 있을 것입니다. 아멘.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: history / account
  choice: 이야기
  rationale: 공급된 영어 증언의 ‘history’와 영어 POB의 ‘account’를 함께 고려하여, 역사적 기록을 뜻하면서도 현대 한국어 독자가 자연스럽게 이해할 수 있는 ‘이야기’를 선택했습니다.
- source_word: commotion / unrest
  choice: 소요
  rationale: 헤롯의 죽음을 둘러싼 공적 혼란과 동요를 간결하고 품위 있게 나타냅니다.
- source_word: wilderness
  choice: 광야
  rationale: 고대 유대 지역의 인적 드문 황야를 가리키는 성서 문체의 익숙한 표현을 유지했습니다.
- source_word: fear the Lord
  choice: 주님을 경외하다
  rationale: 단순한 공포가 아니라 하나님을 두려워하며 공경하는 종교적 의미를 보존합니다.
- source_word: grace
  choice: 은혜
  rationale: 신적 호의와 베풂을 나타내는 전통적이면서도 현대 한국어에서 이해 가능한 표현입니다.
theological_decisions:
- issue: 은혜가 함께하는 대상과 문장의 시제
  choice: ‘주님을 경외하는 모든 이와 함께 은혜가 있을 것입니다’로 옮김
  alternative: ‘주님을 경외하는 모든 이에게 은혜가 있기를 바랍니다’
  rationale: 공급된 증언의 미래 진술 ‘will be’를 축원형으로 바꾸지 않고 그대로 보존했습니다.
- issue: 저자의 자기 지칭
  choice: ‘나 야고보’로 명시
  alternative: ‘나, 야고보’ 또는 ‘나 야고보가’
  rationale: 결론부의 저자 주장 자체를 완화하거나 강화하지 않고 직접적으로 전달했습니다.
- issue: 하나님 호칭
  choice: ‘주 하나님’
  alternative: ‘주이신 하나님’
  rationale: 공급된 증언의 ‘the Lord God’을 전통적 호칭으로 보존하되 특정 교파적 해석을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 문헌의 결론부다운 간결하고 장중한 어조를 유지했습니다. 다만 직접적인 그리스어 원문 대조가 아직 이루어지지 않았으므로, 공급된 공용 영어 증언에 근거한 잠정 번역입니다.
