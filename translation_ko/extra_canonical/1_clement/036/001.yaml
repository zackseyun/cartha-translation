  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τῶν προσφορῶν ἡμῶν은 ‘우리의 예물들의’보다 ‘우리가 드리는 예물의’로 옮겨야 한국어에서 자연스럽게 소유·관계가 드러납니다. 또한 προστάτην καὶ βοηθόν은 모두 인물을 가리키므로 ‘보호자이자 도우심’의 병렬은 맞지 않습니다.
  naturalness: 초안의 ‘우리의 예물들의’, ‘우리의 약함의’, ‘도우심이십니다’는 현대 표준 한국어 합쇼체로는 부자연스럽거나 문법적 관계가 불명료합니다. ‘사랑하는 여러분’, ‘우리가 드리는 예물의’, ‘우리의 연약함을 보호하시고 도우시는 분’이 자연스럽습니다.
  terminology: Ἰησοῦν Χριστόν은 영어 POB의 확정 선택과 후기 1세기 문맥에 맞추어 ‘예수 그리스도’로 유지합니다. ἀρχιερεύς는 ‘대제사장’, προσφοραί는 ‘예물’, ἀσθένεια는 문맥에 맞춰 ‘연약함’으로 번역합니다.
