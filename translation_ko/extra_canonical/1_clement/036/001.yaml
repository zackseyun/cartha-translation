revisions:
- from: 이것이, 사랑하는 이들이여, 우리가 우리의 구원을 발견한 길입니다. 곧 예수 그리스도이시며, 우리의 예물들의 대제사장이시고, 우리의 약함의 보호자이자 도우심이십니다.[a]
