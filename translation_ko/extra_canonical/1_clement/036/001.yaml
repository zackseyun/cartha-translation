id: 1CLEM.36.1
reference: 1 Clement 36:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Αὕτη ἡ ὁδός, ἀγαπητοί, ἐν ᾗ εὕρομεν τὸ σωτήριον ἡμῶν, Ἰησοῦν Χριστόν, τὸν ἀρχιερέα τῶν προσφορῶν ἡμῶν, τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/001.yaml
  text: 'This is the way, beloved, in which we found our salvation: Jesus Christ, the high priest of our offerings, the protector and helper of our weakness.'
  footnotes:
  - marker: a
    text: Or 'Jesus the Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 여러분, 이것이 우리가 구원을 발견한 길입니다. 곧 예수 그리스도[a]이시며, 우리가 드리는 예물의 대제사장이시고 우리의 연약함을 보호하시고 도우시는 분이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예수 메시아’.
    reason: Χριστός는 여기서 ‘그리스도’로 번역하되, 영어 POB 감사 기록에 보존된 대안적 어원·칭호 번역을 제시합니다.
lexical_decisions:
- source_word: Αὕτη ἡ ὁδός
  english_pob_choice: This is the way
  chosen_korean: 이것이 … 길입니다
  alternatives_korean:
  - 이것이 … 길입니다
  - 이것이 … 도입니다
  lexicon: ὁδός
  rationale: ὁδός는 문자 그대로 ‘길’이 자연스럽고, 문맥상 신앙의 삶의 방식까지 포괄하되 추상화된 ‘도’보다 직접적 표현이 원문의 힘을 더 잘 드러냅니다.
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 이들이여
  alternatives_korean:
  - 사랑하는 여러분
  - 사랑하는 자들이여
  lexicon: ἀγαπητοί
  rationale: 호칭적 부름을 살리면서도 현대 한국어 합쇼체의 자연스러운 직접 호격으로 옮겼습니다.
- source_word: τὸ σωτήριον ἡμῶν
  english_pob_choice: our salvation
  chosen_korean: 우리의 구원
  alternatives_korean:
  - 우리의 구원
  - 우리의 구원의 길
  lexicon: σωτήριον
  rationale: σωτήριον은 구원 사건/은총 자체를 가리키므로, 본문 흐름에서 이미 앞의 ‘길’과 중첩되는 추가 해석 없이 ‘우리의 구원’으로 옮겼습니다.
- source_word: τὸν προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν
  english_pob_choice: the protector and helper of our weakness
  chosen_korean: 우리의 약함의 보호자이자 도우심
  alternatives_korean:
  - 우리의 약함의 보호자이자 도우미
  - 우리의 연약함을 지키시고 돕는 분
  lexicon: προστάτην / βοηθόν / ἀσθένεια
  rationale: προστάτης와 βοηθός의 병렬성을 살려 ‘보호자이자 도우심’으로 옮기되, ἀσθένεια는 ‘연약함’보다 원문이 가진 취약성/무기력을 더 직접적으로 드러내기 위해 ‘약함’으로 두었습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 예수 그리스도
  alternative_readings:
  - 예수 메시아
  - 예수 그리스도(주석상 ‘메시아’ 가능)
  rationale: 주어진 POB 개정 판단에 따라 1세기 후반 교회 문맥에서 Χριστός는 고유명사화된 칭호로 기능하므로, 본문은 ‘그리스도’로 두고 별도 메시아 해석은 본문에 억지로 넣지 않았습니다.
  doctrine_reference: late first-century Christological usage; POB revision note
- issue: 예수의 직분 표지
  chosen_reading: 대제사장이시고
  alternative_readings:
  - 대제사장이시며
  - 우리의 예물들의 대제사장이시고
  rationale: ἀρχιερεύς를 교리적으로 약화시키지 않으면서도 문맥상 예물과 연결된 관계를 유지해, 그리스도의 제사장직을 분명히 보이도록 했습니다.
  doctrine_reference: Christ's high-priestly office in early Christian paraenesis
