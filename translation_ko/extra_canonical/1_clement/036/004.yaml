id: 1CLEM.36.4
reference: 1 Clement 36:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ δὲ τῷ υἱῷ αὐτοῦ οὕτως· εἶπεν ὁ δεσπότης· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε· αἴτησαι παρ’ ἐμοῦ, καὶ δώσω σοι ἔϑνη τὴν κληρονομίαν σου καὶ τὴν κατάσχεσίν σου τὰ πέρατα τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/004.yaml
  text: 'But concerning his Son[a], the Master spoke thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance,

    and the ends of the earth as your possession.”'
  footnotes:
  - marker: a
    text: Or 'But concerning his Son it says thus:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 그의 아들[a]에 관해서는 주권자께서 이렇게 말씀하셨습니다. 「너는 내 아들이다. 오늘 내가 너를 낳았다. 나에게 구하라. 그러면 내가 나라들을 네 유업으로, 땅 끝들을 네 소유로 주겠다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 그의 아들에 관해서는 이렇게 말합니다.”
    reason: 영어 POB의 대안 번역 각주(“Or ‘But concerning his Son it says thus:’”)를 해당 어구에 맞추어 옮겼습니다.
lexical_decisions:
- source_word: ἐπὶ δὲ τῷ υἱῷ αὐτοῦ
  english_pob_choice: But concerning his Son
  chosen_korean: 그러나 그의 아들에 관하여는
  alternatives_korean:
  - 그의 아들에 대해서는
  - 그의 아들에 관하여 말씀드리면
  lexicon: ἐπί + dat.; περί적 의미
  rationale: 문맥상 시편 인용 도입부이므로 ‘관하여는’으로 대상 전환을 자연스럽게 드러내되, POB의 ‘concerning’ 의미를 유지했습니다.
- source_word: εἶπεν ὁ δεσπότης
  english_pob_choice: the Master spoke thus
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 주님이 말씀하셨습니다
  - 주인이 말씀하셨습니다
  lexicon: δεσπότης
  rationale: 1 클레멘스에서 하나님을 가리키는 호칭으로 기능하므로, 본문 흐름에 맞게 주어를 생략하지 않고 존대 동사로 처리했습니다. ‘주인’은 한국어에서 인간 소유자 뉘앙스가 강해 부적절합니다.
- source_word: Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε
  english_pob_choice: You are my Son; today I have begotten you
  chosen_korean: 너는 내 아들이다. 오늘 내가 너를 낳았다
  alternatives_korean:
  - 너는 내 아들이다. 오늘 내가 너를 낳았다.
  - 너는 내 아들이다. 오늘 내가 너를 출생시켰다
  lexicon: γεγέννηκα
  rationale: 시편 2편의 직접 인용으로서 ‘낳았다’가 자연스럽고, POB의 begotten을 과도하게 신학화하지 않으면서도 출생/출생시키다의 의미를 보존합니다.
- source_word: ἔϑνη
  english_pob_choice: the nations
  chosen_korean: 나라들을
  alternatives_korean:
  - 민족들을
  - 이방 나라들을
  lexicon: ἔθνη
  rationale: 시편 인용의 보편적 지배 범위를 살리되, 1차적으로는 ‘민족들’보다 현대 한국어에서 더 자연스러운 ‘나라들’을 택했습니다.
- source_word: τὴν κληρονομίαν σου καὶ τὴν κατάσχεσίν σου
  english_pob_choice: as your inheritance ... as your possession
  chosen_korean: 네 유업으로, 땅 끝들을 네 소유로
  alternatives_korean:
  - 네 상속으로, 땅 끝들을 네 소유로
  - 네 몫으로, 땅 끝들을 네 차지로
  lexicon: κληρονομία / κατάσχεσις
  rationale: κληρονομία는 상속된 몫이라는 의미를 살려 ‘유업’으로, κατάσχεσις는 점유/소유의 결과를 드러내어 ‘소유’로 옮겼습니다. ‘땅 끝들’은 원문 복수를 유지했습니다.
theological_decisions:
- issue: δεσπότης의 신적 호칭 처리
  chosen_reading: δεσπότης를 하나님을 가리키는 권위 있는 호칭으로 보고 본문에서 ‘말씀하셨습니다’로 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘주인’으로 직역
  - ‘주권자’로 의역
  rationale: 1 클레멘스의 성구 인용 문맥에서 δεσπότης는 단순한 인간 주인이 아니라 하나님을 지시하는 호칭이므로, 한국어에서는 전면적인 직역보다 신학적 기능을 유지하는 번역이 더 정확합니다.
  doctrine_reference: 하나님의 주권과 성경 인용의 문맥적 호칭
- issue: γεγέννηκά σε의 번역과 출생 언어
  chosen_reading: ‘오늘 내가 너를 낳았다’로 옮겨 시편 2편의 인용력을 보존했습니다.
  alternative_readings:
  - ‘오늘 내가 너를 낳아 주었다’
  - ‘오늘 내가 너를 낳았다’의 완화형
  rationale: 이 구절은 그리스도론적 논의의 핵심 인용이지만, 본문 자체는 시편의 어법을 재현합니다. 과도한 설명을 덧붙이지 않고 직설적 표현을 유지해야 원문의 긴장감이 살아납니다.
  doctrine_reference: 시편 2:7의 메시아적 인용
