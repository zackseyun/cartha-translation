- from: 그러나 그의 아들에 관하여는 이렇게 말씀하셨습니다. 「너는 내 아들이다. 오늘 내가 너를 낳았다. 나에게 구하라. 그러면 내가 나라들을 네 유업으로, 땅 끝들을 네 소유로 주겠다.」[a]
