  terminology: δεσπότης는 여기서 하나님을 가리키는 호칭이지만 κύριος(주님)와 동일시하지 않고 ‘주권자’로 옮기는 것이 어휘적 구별과 원문의 호칭을 보존합니다. κληρονομία는 ‘유업’, κατάσχεσις는 ‘소유’로 적절합니다.
