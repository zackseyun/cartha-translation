  rationale: 원문의 대명사와 인용 형식을 중립적으로 유지하고, 시편 인용의 관용적 왕권 표현인 ‘오른편’을 사용했습니다. 특히 ‘발의 발판’을 자연스러운 한국어인 ‘발판’으로 고쳐 원수들이 발판이 되는 원문의 의미 관계를 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
