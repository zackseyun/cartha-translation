  yaml_path: translation/extra_canonical/1_clement/036/005.yaml
  text: 'And again he says to him:

    “Sit at my right hand,

    until I make your enemies a footstool for your feet.”'
translation:
  language: ko
  text: '그리고 다시 그에게 말씀하십니다.


    「내 오른편에 앉으십시오.

    내가 당신의 원수들을 당신의 발판으로 둘 때까지。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν λέγει πρὸς αὐτόν
  english_pob_choice: And again he says to him
  chosen_korean: 그리고 다시 그분께 말씀하십니다
  alternatives_korean:
  - 그리고 다시 그에게 말씀하십니다
  - 그리고 또 그에게 말씀하십니다
  lexicon: λέγω
  rationale: 반복을 나타내는 πάλιν은 ‘다시’로, λέγει는 현재시제로 생생하게 이어지는 진술을 살려 ‘말씀하십니다’로 옮겼습니다. 대상은 문맥상 ‘그분’으로 자연스럽게 받았습니다.
- source_word: Κάϑου ἐκ δεξιῶν μου
  english_pob_choice: Sit at my right hand
  chosen_korean: 내 오른쪽에 앉아 있으십시오
  alternatives_korean:
  - 내 오른편에 앉아 있으십시오
  - 내 오른쪽에 앉으십시오
  lexicon: κάθημαι
  rationale: 명령형은 단순 위치 이동보다 ‘앉아 있으십시오’가 왕좌/존귀의 자리를 더 분명히 드러냅니다. ἐκ δεξιῶν은 관용적으로 ‘오른쪽에’로 옮겼습니다.
- source_word: ὑποπόδιον τῶν ποδῶν σου
  english_pob_choice: a footstool for your feet
  chosen_korean: 당신의 발의 발판
  alternatives_korean:
  - 당신의 발판
  - 당신의 발 아래 발판
  lexicon: ὑποπόδιον
  rationale: ‘발판’은 문자적 이미지를 유지하면서도 한국어에서 자연스럽습니다. τῶν ποδῶν σου의 중복된 소유 표현은 원문의 강조를 살려 ‘당신의 발의 발판’으로 반영했습니다.
theological_decisions:
- issue: 왕의 오른편 좌정 이미지
  chosen_reading: ‘내 오른쪽에 앉아 있으십시오’로 옮겨, 단순한 위치 설명이 아니라 존귀와 통치 참여의 초청을 드러냈습니다.
  alternative_readings:
  - 오른편에 앉아 있으십시오
  - 내 오른편에 앉으십시오
  rationale: 시편 인용의 왕권적 배경을 흐리지 않으면서도 한국어로는 가장 직접적이고 공손한 명령형을 택했습니다.
  doctrine_reference: 시 110:1 인용 전통
