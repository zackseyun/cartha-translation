translation:
  language: ko
  text: 그렇다면 적들은 누구입니까? 악한 자들과 그의 뜻에 맞서는 자들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνες οὖν οἱ ἐχθροί
  english_pob_choice: Who then are the enemies?
  chosen_korean: 그렇다면 누구를 적이라고 하겠습니까?
  alternatives_korean:
  - 그렇다면 누구가 적입니까?
  - 그렇다면 적은 누구입니까?
  lexicon: ἐχθροί
  rationale: ἐχθροί는 단순한 ‘반대자’보다 관계적 적대성을 가진 ‘적’이 자연스럽고, 질문형 구조를 살려 문장의 논쟁적 흐름을 유지했습니다.
- source_word: οἱ φαῦλοι
  english_pob_choice: the wicked
  chosen_korean: 악한 자들
  alternatives_korean:
  - 악인들
  - 비열한 자들
  lexicon: φαῦλοι
  rationale: φαῦλοι는 POB의 ‘wicked’에 맞춰 도덕적 악을 가리키는 표현으로 옮겼고, 한국어에서는 ‘악한 자들’이 가장 직접적입니다.
- source_word: ἀντιτασσόμενοι τῷ θελήματι αὐτοῦ
  english_pob_choice: those who set themselves against his will
  chosen_korean: 그의 뜻에 맞서 자신을 세우는 자들
  alternatives_korean:
  - 그의 뜻을 거스르는 자들
  - 그의 뜻에 대적하는 자들
  lexicon: ἀντιτάσσω + θέλημα
  rationale: ἀντιτασσόμενοι는 단순한 내적 반감이 아니라 능동적으로 대항하는 뜻이 있어 ‘맞서 자신을 세우는’으로 풀었고, θέλημα은 여기서 하나님의 ‘뜻’으로 자연스럽게 읽힙니다.
theological_decisions:
- issue: οἱ 하나의 관사 아래 두 서술어의 관계
  chosen_reading: ‘악한 자들과 그의 뜻에 맞서 자신을 세우는 자들’을 한 묶음의 적으로 제시했습니다.
  alternative_readings:
  - ‘악한 자들, 그리고 그의 뜻에 맞서 자신을 세우는 자들’처럼 분리해서 읽는 방식
  rationale: 그리스어의 단일 관사 οἱ가 두 표현을 함께 묶으므로, 한국어도 분리된 두 집단보다 하나의 정의적 묘사로 읽히도록 했습니다.
  doctrine_reference: 문법-의미 관찰
