  terminology: φαῦλοι는 이 문맥에서 ‘악한 자들’로 옮길 수 있습니다. θέλημα는 문맥상 ‘그의 뜻’으로 적절하며, 원문이 명시하지 않은 ‘하나님의’는 보충하지 않았습니다.
