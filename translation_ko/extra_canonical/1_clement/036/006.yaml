  source_fidelity: 질문의 뜻은 대체로 충실하나, τίνες οἱ ἐχθροί는 ‘누구를 적이라고 하겠습니까?’보다 ‘적들은 누구입니까?’가 원문의 직접적인 정의 질문을 더 정확히 재현합니다. ἀντιτασσόμενοι는 하나님의 뜻에 능동적으로 대항하는 이들을 가리키며, ‘맞서는’이 이를 충실히 전달합니다.
