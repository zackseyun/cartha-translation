id: 1CLEM.36.2
reference: 1 Clement 36:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τούτου ἀτενίζομεν εἰς τὰ ὕψη τῶν οὐρανῶν, διὰ τούτου ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ, διὰ τούτου ἠνεῴχθησαν ἡμῶν οἱ ὀφθαλμοὶ τῆς καρδίας, διὰ τούτου ἡ ἀσύνετος καὶ ἐσκοτωμένη διάνοια ἡμῶν ἀναθάλλει εἰς τὸ φῶς, διὰ τούτου ἠθέλησεν ὁ δεσπότης τῆς ἀϑανάτου γνώσεως ἡμᾶς γεύσασϑαι, ὃς ὢν ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ, τοσούτῳ μείζων ἐστὶν ἀγγέλων, ὅσῳ διαφορώτερον ὄνομα κεκληρονόμηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/002.yaml
  text: Through him we fix our gaze on the heights of the heavens; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.
translation:
  language: ko
  text: 그를 통해 우리는 하늘의 높은 곳들을 응시합니다. 그를 통해 우리는 티 없고 지극히 높은 그의 모습을 거울로 보듯 바라봅니다. 그를 통해 우리 마음의 눈이 열렸습니다. 그를 통해 우리의 분별력 없고 어두워진 생각이 빛 가운데로 돋아납니다. 그를 통해 주재자께서는 우리가 불멸의 지식을 맛보게 하기를 원하셨습니다. 그는 그분의 위엄의 광채이시며, 더 뛰어난 이름을 상속받으신 만큼 천사들보다 더 크십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리서 1:3–4를 인용하거나 매우 밀접하게 따릅니다.
    reason: 마지막 절의 표현과 논증은 히브리서 1:3–4에 직접적으로 대응합니다. 기존 본문의 [a] 표지에 대응하는 내용을 제공합니다.
lexical_decisions:
- source_word: διὰ τούτου
  english_pob_choice: Through him
  chosen_korean: 그를 통해
  alternatives_korean:
  - 그로 말미암아
  - 그 안에서
  lexicon: διά + gen.
  rationale: 원문의 반복적 매개 관계를 살리기 위해 문장마다 같은 구조의 ‘그를 통해’를 유지했습니다.
- source_word: ἐνοπτριζόμεθα τὴν ἄμωμον καὶ ὑπερτάτην ὄψιν αὐτοῦ
  english_pob_choice: we behold as in a mirror his spotless and most exalted countenance
  chosen_korean: 흠 없고 가장 높으신 그의 얼굴을 거울에 비추어 보듯 봅니다
  alternatives_korean:
  - 거울처럼 그의 흠 없고 가장 높으신 얼굴을 봅니다
  - 그의 흠 없고 지극히 높은 모습을 거울로 보듯 봅니다
  lexicon: ἐνοπτρίζομαι, ἄμωμος, ὑπερτάτος, ὄψις
  rationale: ἐνοπτριζόμεθα의 ‘거울에 비추어 보듯’이라는 비유를 보존하고, ὄψις는 문맥상 ‘얼굴/모습’ 가운데 더 직접적인 ‘얼굴’로 옮겼습니다.
- source_word: ὁ δεσπότης τῆς ἀϑανάτου γνώσεως
  english_pob_choice: the Master ... immortal knowledge
  chosen_korean: 주인께서는 ... 죽지 않는 지식
  alternatives_korean:
  - 주께서는 ... 불멸의 지식
  - 주인께서는 ... 영원한 지식
  lexicon: δεσπότης, ἀθάνατος, γνῶσις
  rationale: δεσπότης는 권위 있는 ‘주인’으로, ἀθάνατος는 문맥상 ‘죽지 않는’으로 직역해 지식의 불멸성을 드러냈습니다.
- source_word: ἀπαύγασμα τῆς μεγαλοσύνης αὐτοῦ
  english_pob_choice: the radiance of his majesty
  chosen_korean: 그분의 위엄의 광채이시며
  alternatives_korean:
  - 그분의 위엄에서 비치는 광채이시며
  - 그분의 영광의 광채이시며
  lexicon: ἀπαύγασμα, μεγαλοσύνη
  rationale: ἀπαύγασμα는 단순한 빛남보다 ‘광채’가 더 적합하며, μεγαλοσύνη는 ‘위엄’으로 옮겨 위대함의 품격을 살렸습니다.
theological_decisions:
- issue: ‘마음의 눈’과 ‘생각’의 내적 계시 이미지
  chosen_reading: ‘마음의 눈’과 ‘어리석고 어두워진 생각이 빛으로 솟아남’을 영적 인식의 회복으로 읽었습니다.
  alternative_readings:
  - 단순한 지적 깨달음으로 축소
  - 시적 장식으로 약화
  rationale: 본문은 외적 정보가 아니라 내적 인식의 개방과 변화를 연속적으로 묘사하므로, 영적·인지적 회복의 긴장을 유지했습니다.
  doctrine_reference: 성화와 조명의 언어
- issue: ‘주인’(δεσπότης)과 그리스도 지칭
  chosen_reading: δεσπότης를 ‘주인’으로 두어 본문의 권위 언어를 유지했습니다.
  alternative_readings:
  - 주님
  - 주권자
  rationale: 이 단락은 존칭적 신앙어보다 지배권을 가진 주재자를 가리키는 표현이어서, 전통적 교회 언어보다 원문의 긴장을 더 잘 드러내는 ‘주인’을 택했습니다.
  doctrine_reference: 그리스도의 주권
