- from: 그를 통해 우리는 하늘의 높은 곳들을 응시합니다. 그를 통해 우리는 흠 없고 가장 높으신 그의 얼굴을 거울에 비추어 보듯 봅니다. 그를 통해 우리 마음의 눈이 열렸습니다. 그를 통해 우리 어리석고 어두워진 생각이 빛으로 솟아납니다. 그를 통해 주인께서는 우리가 죽지 않는 지식을 맛보게 하기를 원하셨습니다. 그는 그분의 위엄의 광채이시며, 더 뛰어난 이름을 상속받으셨기에 천사들보다 그만큼 더 크십니다.[a]
  to: 그를 통해 우리는 하늘의 높은 곳들을 응시합니다. 그를 통해 우리는 티 없고 지극히 높은 그의 모습을 거울로 보듯 바라봅니다. 그를 통해 우리 마음의 눈이 열렸습니다. 그를 통해 우리의 분별력 없고 어두워진 생각이 빛 가운데로 돋아납니다. 그를 통해 주재자께서는 우리가 불멸의 지식을 맛보게 하기를 원하셨습니다. 그는 그분의 위엄의 광채이시며, 더 뛰어난 이름을 상속받으신 만큼 천사들보다 더 크십니다.[a]
