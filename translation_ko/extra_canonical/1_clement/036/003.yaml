  source_fidelity: 인용 서두와 능동 동사 ‘만드십니다’는 원문의 γέγραπται … και …를 잘 반영합니다. 다만 πνεύματα의 복수형을 한국어에서 ‘바람들’로 기계적으로 드러내면 자연스럽지 않습니다. 또한 πυρὸς φλόγα는 통상 ‘불꽃’으로 옮기는 것이 정확하고 자연스럽습니다.
  naturalness: ‘바람들’과 ‘불의 화염’은 현대 표준 한국어에서 다소 부자연스럽고 중복적으로 들립니다. ‘바람’과 ‘불꽃’이 간결하며 시편 인용의 한국어 문체에도 어울립니다. 소유 표현은 높임과 지시 대상을 명확히 하는 ‘그분의’가 ‘자기’보다 자연스럽습니다.
  terminology: ἄγγελοι는 ‘천사들’, λειτουργοί는 여기서 하나님의 봉사자/섬기는 이라는 기능을 나타내므로 ‘섬기는 이들’로 옮겼습니다. πνεύματα는 이 인용의 문맥과 영어 POB의 선택에 따라 ‘바람’으로 유지하되, 영/바람의 어휘적 중의성을 주석으로 과도하게 해소하지 않았습니다.
