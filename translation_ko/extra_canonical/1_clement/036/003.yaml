  text: γέγραπται γὰρ οὕτως· ‘Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036/003.yaml
  text: 'For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”'
translation:
  language: ko
  text: 이는 이렇게 기록되어 있습니다. 「그분은 자기 천사들을 바람들로, 자기 일꾼들을 불의 화염으로 삼으십니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται γὰρ οὕτως
  english_pob_choice: 'For it is written thus:'
  chosen_korean: 이는 이렇게 기록되어 있습니다
  alternatives_korean:
  - 기록되었으니 이와 같습니다
  - 왜냐하면 이렇게 기록되어 있기 때문입니다
  lexicon: γράφω
  rationale: 문맥의 인용 서두를 자연스럽고 공적으로 열기 위해 ‘기록되어 있습니다’를 택했고, γὰρ의 설명 기능은 앞선 진술을 뒷받침하는 연결로 암시했습니다.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  english_pob_choice: his angels
  chosen_korean: 자기 천사들을
  alternatives_korean:
  - 그의 천사들을
  - 그분의 천사들을
  lexicon: ἄγγελος
  rationale: 소유 대명사 αὐτοῦ를 반영하되, 지시 대상이 하나님이므로 한국어에서는 ‘자기’가 가장 간결하고 원문 가까운 소유 표현입니다.
- source_word: πνεύματα
  english_pob_choice: winds
  chosen_korean: 바람들로
  alternatives_korean:
  - 영들로
  - 바람으로
  lexicon: πνεῦμα
  rationale: 영역상 ‘바람’이 자연스러운 뜻이며, 여기서는 천사들을 바람으로 ‘만든다’는 진술이므로 복수형 효과를 살려 ‘바람들로’로 옮겼습니다.
- source_word: τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα
  english_pob_choice: his ministers a flame of fire
  chosen_korean: 자기 일꾼들을 불의 화염으로
  alternatives_korean:
  - 자기 섬기는 이들을 불꽃으로
  - 자기 봉사자들을 불꽃으로
  lexicon: λειτουργός
  rationale: λειτουργούς는 공적 예배/봉사의 뉘앙스를 지닌 ‘일꾼’으로 옮겼고, πυρὸς φλόγα는 직역에 가까운 ‘불의 화염’으로 보존하여 이미지의 강도를 살렸습니다.
theological_decisions:
- issue: 하나님의 행위 주체를 직접 드러내는 번역
  chosen_reading: ‘그분은…삼으십니다’로 번역해 시편 인용의 주어가 하나님임을 분명히 했습니다.
  alternative_readings:
  - ‘그는…만드십니다’
  - ‘그분은…하십니다’
  rationale: 본문의 인용은 하나님이 천사들을 그분의 사자적 도구로 세우시는 주권적 행위를 말하므로, 주체를 흐리지 않는 능동 표현이 적절합니다.
  doctrine_reference: divine sovereignty; citation clarity
