  terminology: κραταιᾶς χειρός는 ‘강한 손’, κόσμος는 원문의 의도적인 보편성을 보존하여 ‘어느 세상’으로 유지했습니다. γραφεῖον은 관용적으로 ‘성경’으로 옮길 수 있습니다.
