  language: ko
  text: “내가 어디로 가며, 주님의 얼굴을 피하여 어디에 숨겠습니까? 내가 하늘에 올라가도 주님께서 거기에 계시며, 땅의 가장 먼 끝으로 가도 거기에 주님의 오른손이 있으며, 심연에 누워도 거기에 주님의 영이 계십니다.”
