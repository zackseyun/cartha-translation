  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἵνα 이하의 목적절과 수동태 σκεπασθῶμεν은 ‘그의 자비로 … 보호를 받도록’으로 옮기는 편이 원문에 더 가깝습니다. 또한 κρίματα는 복수이므로 ‘심판들’로 반영했습니다.
  naturalness: ‘가려 주실 것입니다’는 한국어에서 무엇을 가린다는 뜻으로도 들리고, 원문의 목적법·수동태와도 거리가 있습니다. ‘보호를 받도록 합시다’가 현대 표준어 합쇼체에서 자연스럽습니다. ‘악한 행위를 바라는’은 ‘악한 행위를 위한’보다 욕망의 목적 대상을 더 분명히 합니다.
  terminology: φοβηθῶμεν은 문맥의 심판 경고를 보존하여 ‘두려워하고’로, μιαρὰς ἐπιθυμίας는 ‘더러운 욕망’으로 유지했습니다. σκεπασθῶμεν은 보호의 의미를 살려 ‘보호를 받다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘그러면 그의 자비로 장차 올 심판에서 우리를 가려 주실 것입니다’
