id: 1CLEM.28.1
reference: 1 Clement 28:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντων οὖν βλεπομένων καὶ ἀκουομένων, φοβηθῶμεν αὐτὸν καὶ ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας, ἵνα τῷ ἐλέει αὐτοῦ σκεπασθῶμεν ἀπὸ τῶν μελλόντων κριμάτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028/001.yaml
  text: Therefore, since all things are seen and heard, let us fear him and leave behind the foul desires for wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.
  footnotes:
  - marker: a
    text: Or 'the foul desires that belong to wicked deeds'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 모든 것이 보이고 들리는 이상, 그분을 두려워하고 악한 행위를 바라는 더러운 욕망을 버립시다.[a] 그리하여 그분의 자비로 장차 올 심판들로부터 보호를 받도록 합시다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악한 행위에 속한 더러운 욕망”.
    reason: φαύλων ἔργων의 속격은 ‘악한 행위를 바라는’으로 이해할 수 있으나, 소유·관련의 관계로 이해하는 번역도 가능합니다.
lexical_decisions:
- source_word: Πάντων οὖν βλεπομένων καὶ ἀκουομένων
  english_pob_choice: Therefore, since all things are seen and heard
  chosen_korean: 그러므로 모든 것이 보고 들려지는 이상
  alternatives_korean:
  - 그러므로 모든 것이 보이고 들려지는 이상
  - 그러므로 모든 것을 보고 들으시는 분이 계시므로
  lexicon: βλέπω / ἀκούω
  rationale: 수동 분사구를 한국어 조건 표현으로 옮겨, ‘모든 것이’ 하나님 앞에서 감추어지지 않는다는 의미를 자연스럽게 드러냈습니다.
- source_word: φοβηθῶμεν αὐτὸν
  english_pob_choice: let us fear him
  chosen_korean: 우리가 그를 두려워하며
  alternatives_korean:
  - 우리가 그를 경외하며
  - 그를 두려워합시다
  lexicon: φοβέομαι
  rationale: 문맥상 경외를 포함하지만, 본문의 도덕적 경고와 심판 대비를 살려 ‘두려워하다’를 기본으로 두었습니다.
- source_word: ἀπολίπωμεν φαύλων ἔργων μιαρὰς ἐπιθυμίας
  english_pob_choice: leave behind the foul desires for wicked deeds
  chosen_korean: 악한 행위를 위한 더러운 욕망을 버립시다
  alternatives_korean:
  - 악한 행위를 향한 더러운 욕망을 버립시다
  - 더러운, 악한 행위를 바라는 욕망을 버립시다
  lexicon: ἀπολείπω / μιαρός / ἐπιθυμία / φαῦλος
  rationale: 영어 개정의 관계를 따라 ‘욕망’과 ‘악한 행위’를 목적 관계로 살렸고, μιαράς는 도덕적 오염을 드러내는 ‘더러운’으로 옮겼습니다.
- source_word: σκεπασθῶμεν
  english_pob_choice: we may be sheltered
  chosen_korean: 가려 주실 것입니다
  alternatives_korean:
  - 보호를 받게 될 것입니다
  - 덮어 주실 것입니다
  lexicon: σκέπω
  rationale: 직역적 ‘가리다/덮다’의 이미지를 유지하되, 한국어에서 자연스러운 보호 의미가 드러나도록 옮겼습니다.
theological_decisions:
- issue: ‘all things are seen and heard’의 신학적 함의
  chosen_reading: 하나님 앞에서 모든 행위와 욕망이 감추어지지 않는다는 경고로 읽었습니다.
  alternative_readings:
  - 일반적 도덕 감시 진술로 읽기
  - 인간 사회의 공개성에 대한 진술로 읽기
  rationale: 뒤따르는 두려움과 심판 언급이 있어, 단순한 관찰이 아니라 종말론적 책임을 강조하는 문맥으로 반영했습니다.
  doctrine_reference: 심판과 하나님의 전지성에 관한 기독교적 고백
