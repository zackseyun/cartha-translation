  to: 그러므로 모든 것이 보이고 들리는 이상, 그분을 두려워하고 악한 행위를 바라는 더러운 욕망을 버립시다.[a] 그리하여 그분의 자비로 장차 올 심판들로부터 보호를 받도록 합시다.
