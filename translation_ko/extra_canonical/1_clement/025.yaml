base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025.yaml
  text: Let us consider the remarkable sign that takes place in the eastern regions[a], that is, in the areas around Arabia. For there is a bird that is called the phoenix. This creature, being the only one of its kind, lives for five hundred years; and when it has now come near to its departure in death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies. But as its flesh decays, a certain worm is produced, and being nourished from the moisture of the dead creature, it grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis. And in daytime, in the sight of all, it flies to the altar of the sun and places them there, and so sets out back again. So then the priests inspect the records of the times[b][c][a], and they find that it has come when
    the five hundredth year has been completed.
  footnotes:
  - marker: a
    text: The phoenix was a well-known ancient bird tradition used as an example of renewal or return to life.
    reason: cultural_note
    anchor_ref: '25:2'
  - marker: a
    text: The Greek word rendered 'nest' can also denote an enclosed structure or chamber; the imagery here is of a self-made aromatic resting place for death and renewal.
    reason: lexical_alternative
    anchor_ref: '25:2'
  - marker: c
    text: Heliopolis means 'City of the Sun.'
    reason: cultural_note
    anchor_ref: '25:4'
  - marker: b
    text: Or 'the end of its life'.
    reason: previous_rendering
translation:
  language: ko
  text: 동방 지역 — 곧 아라비아 주변 지방에서 일어나는 이 놀라운 표징을 보십시오. 곧, 불사조라 불리는 새가 있습니다. 이 새는 그 종류가 하나뿐인 존재로서 오백 년을 살다가, 죽음으로 떠날 때가 가까워지면 유향과 몰약과 다른 향료들로 자기 자신을 위해 둥지를 만듭니다. 때가 차면 그 안으로 들어가 죽습니다. 그러나 살점이 썩어 가면 어떤 구더기 하나가 생기고, 죽은 짐승의 수분으로 자라서 날개가 돋습니다. 그런 뒤 그것이 튼튼해지면, 이전 것의 뼈가 있는 그 둥지를 들어 올려, 그것을 지고 아라비아 땅에서 이집트까지, 이른바 헬리오폴리스로 여행합니다. 그리고 낮에, 모든 사람이 보는 앞에서, 그것들을 태양의 제단 위에 내려놓고는 다시 되돌아갑니다. 그러므로 제사장들은 시대의 기록을 살펴보고, 오백째 해가 다 찬 때에 그것이 와 있었음을 알아냅니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράδοξον σημεῖον
  english_pob_choice: remarkable sign
  chosen_korean: 놀라운 표징
  alternatives_korean:
  - 경이로운 표징
  - 이상한 표징
  - 신기한 표징
  lexicon: LSJ
  rationale: παράδοξον의 ‘기이하고 놀라운’ 뉘앙스를 살리되, 기적을 단정하는 표현으로 과도하게 밀지 않기 위해 ‘놀라운 표징’으로 옮겼습니다.
- source_word: τὸ γινόμενον
  english_pob_choice: takes place
  chosen_korean: 일어나는
  alternatives_korean:
  - 발생하는
  - 생기는
  - 일어나는 일이 되는
  lexicon: LSJ
  rationale: 현재적·서술적 진행을 자연스럽게 살리는 표현으로, 반복적 현상임을 드러냅니다.
- source_word: μονογενὲς
  english_pob_choice: the only one of its kind
  chosen_korean: 그 종류가 하나뿐인
  alternatives_korean:
  - 유일한
  - 단 하나뿐인
  - 독특한
  lexicon: LSJ
  rationale: 동물학적 맥락에서 ‘외아들/독생’이 아니라 종의 유일성을 말하므로, ‘그 종류가 하나뿐인’으로 구체화했습니다.
- source_word: ἀπόλυσιν τοῦ ἀποθανεῖν
  english_pob_choice: its departure in death
  chosen_korean: 죽음으로 떠날 때
  alternatives_korean:
  - 죽음에 이르러 떠날 때
  - 죽어 떠날 때
  - 생을 마치고 떠날 때
  lexicon: LSJ
  rationale: ἀπόλυσις의 ‘떠남/출발’과 죽음의 완곡한 결합을 유지하기 위해, ‘종말’보다 ‘떠날 때’ 계열로 살렸습니다.
- source_word: σηκόν
  english_pob_choice: nest
  chosen_korean: 둥지
  alternatives_korean:
  - 집
  - 보금자리
  - 우리
  lexicon: LSJ
  rationale: 불사조 전승에서 새가 스스로 만드는 구조물을 가장 자연스럽게 전달하는 한국어로 ‘둥지’를 택했습니다.
- source_word: βλεπόντων πάντων
  english_pob_choice: in the sight of all
  chosen_korean: 모든 사람이 보는 앞에서
  alternatives_korean:
  - 모두가 보는 가운데
  - 사람들 앞에서
  - 모든 이의 눈앞에서
  lexicon: LSJ
  rationale: 공적인 목격성을 분명하게 보존하는 표현입니다.
theological_decisions:
- issue: 불사조 전승의 처리
  chosen_reading: 본문에서는 전승을 그대로 서술하되, 역사적 진위에 대한 판단을 본문에 주입하지 않았습니다.
  alternative_readings:
  - ‘전해지기로는’ 같은 거리두기 표현을 전면에 두는 방식
  - 전설임을 암시하는 의역
  rationale: 그리스어 본문은 이를 ‘놀라운 표징’으로 직접 제시하므로, 수사적 힘을 보존하고 평가는 주석층으로 남기는 것이 원문 중심에 더 가깝습니다.
  doctrine_reference: 원어 우선 원칙; 수사적 힘 보존
