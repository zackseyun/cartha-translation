  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
  footnotes:
  - marker: a
    text: Or 'whose lawless deeds were forgiven, and whose sins were covered'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 기록되어 있습니다.[a] 「불법한 행위들을 용서받고 죄들이 가려진 이들은 복됩니다. 주께서 죄를 결코 죄로 여기지 않으시고, 그의 입에 속임수가 없는 사람은 복됩니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “불법한 행위들을 용서받았고 죄들이 가려졌던 이들은 복됩니다.”
    reason: 그리스어 부정과거 수동형 ἀφέθησαν과 ἐπεκαλύφθησαν을 과거로 옮길 수 있는 번역 가능성을 반영합니다. 본문은 복 선언의 일반적·지속적 효력을 살려 현재적 상태로 번역했습니다.
