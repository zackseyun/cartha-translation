source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Μακάριοι, ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνήρ, οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν, οὐδέ ἐστιν ἐν τῷ στόματι αὐτοῦ δόλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/006.yaml
  text: For it is written[a], “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and in whose mouth there is no deceit.”
  footnotes:
  - marker: a
    text: Or 'whose lawless deeds were forgiven, and whose sins were covered'.
    reason: previous_rendering
translation:
  language: ko
  text: 기록되기를, 「복되다, 불법이 용서받고 죄들이 덮인 사람들은! 복되다, 주께서 죄를 결코 계산하지 않으실 사람, 그리고 그의 입에는 속임수가 전혀 없는 사람!」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται γάρ
  english_pob_choice: For it is written
  chosen_korean: 기록되기를
  alternatives_korean:
  - 기록되었습니다
  - 기록되어 있습니다
  lexicon: γράφω
  rationale: 인용 서두로서 성경 인용 공식을 자연스럽게 살리되, 과거 완료 느낌보다 현재 유효한 기록이라는 점을 드러내기 위해 「기록되기를」을 택했습니다.
- source_word: ἀνομίαι
  english_pob_choice: lawless deeds
  chosen_korean: 불법
  alternatives_korean:
  - 무법한 행위
  - 율법 없는 행위
  - 불법 행위
  lexicon: ἀνομία
  rationale: ἁμαρτίαι와 병렬되는 법적·도덕적 위반을 간결하게 살리기 위해 「불법」을 사용했습니다.
- source_word: λογίσηται κύριος ἁμαρτίαν
  english_pob_choice: the Lord will certainly not reckon ... sin
  chosen_korean: 주께서 죄를 결코 계산하지 않으실
  alternatives_korean:
  - 주께서 죄를 결코 헤아리지 않으실
  - 주께서 죄를 결코 돌리지 않으실
  lexicon: λογίζομαι
  rationale: λογίζομαι의 회계적·법정적 의미를 살려 「계산하다」를 택했고, οὐ μὴ로 강화된 부정을 「결코」로 반영했습니다.
- source_word: δόλος
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 간계
  lexicon: δόλος
  rationale: 입 안에 있는 도덕적 결핍을 한국어로 직접적이고 평이하게 전달할 수 있는 말로 「속임수」를 선택했습니다.
theological_decisions:
- issue: 인용문의 시제와 보편적 진술
  chosen_reading: 복되다, 불법이 용서받고 죄들이 덮인 사람들은
  alternative_readings:
  - 복되다, 불법이 용서받았고 죄들이 덮였던 사람들은
  - 복되다, 불법이 용서받은 사람들과 죄들이 덮인 사람들은
  rationale: 그리스어 aorist 수동형이 인용문에서는 일반적·격언적 상태를 나타내므로, 한국어도 현재형으로 옮겨 지속적 효력을 살렸습니다.
  doctrine_reference: 시 32:1 LXX 인용의 격언적 용법
