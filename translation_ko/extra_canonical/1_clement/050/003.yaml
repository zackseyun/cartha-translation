reference: 1 Clement 50:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον, ἀλλ’ οἱ ἐν ἀγάπῃ τελειωθέντες κατὰ τὴν τοῦ θεοῦ χάριν ἔχουσιν χῶρον εὐσεβῶν, οἳ ₅ φανερωθήσονται ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/003.yaml
  text: All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, who will be revealed in the visitation of the kingdom of Messiah.
translation:
  language: ko
  text: 아담부터 오늘에 이르기까지 모든 세대가 지나갔습니다. 그러나 하나님의 은혜에 따라 사랑 안에서 온전하게 된 이들은, 그리스도의 나라가 찾아오는 때에 드러날 경건한 이들 가운데 자리를 얻었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온전하게 된’은 그리스어 τελειωθέντες를 옮긴 말입니다. 이는 사랑 안에서 완성됨을 뜻하며, 여기서는 특정 교리 체계에 따라 더 좁게 풀이하지 않았습니다.
    reason: τελειωθέντες의 완성·종결 의미를 보충하되 교리적 과잉 해석을 피합니다.
  - marker: b
    text: ‘그리스도의 나라가 찾아오는 때’는 그리스어 ‘그리스도의 나라의 ἐπισκοπή’(방문, 돌봄, 살핌, 개입)를 옮긴 것입니다. 이 문맥에서는 장차 있을 나라의 방문 또는 개입을 가리킵니다.
    reason: ἐπισκοπή의 의미 범위와 문맥상 사건적 의미를 설명합니다.
lexical_decisions:
- source_word: αἱ γενεαὶ πᾶσαι ἀπὸ Ἀδὰμ ἕως τῆσδε τῆς ἡμέρας παρῆλθον
  english_pob_choice: All the generations from Adam until this day have passed away
  chosen_korean: 아담으로부터 오늘에 이르기까지의 모든 세대는 지나갔습니다
  alternatives_korean:
  - 아담부터 오늘까지의 모든 세대는 사라졌습니다
  - 아담으로부터 오늘날까지의 모든 세대는 지나갔습니다
  lexicon: γενεαί=세대; παρῆλθον=지나갔습니다/사라졌습니다
  rationale: γενεαί는 단순한 사람들의 집합보다 시간 속의 ‘세대’가 자연스럽고, παρῆλθον은 소멸보다는 ‘지나가다’가 원문의 완료된 경과를 잘 드러냅니다.
- source_word: οἱ ἐν ἀγάπῃ τελειωθέντες
  english_pob_choice: those who were perfected in love
  chosen_korean: 사랑 안에서 완전하게 된 이들은
  alternatives_korean:
  - 사랑 가운데 온전하게 된 이들은
  - 사랑 안에서 성숙하게 된 이들은
  lexicon: τελειωθέντες=완전하게 된/온전하게 된
  rationale: τελειόω의 종결·완성 뉘앙스를 살리되, 한국어에서 과도하게 교리화하지 않도록 ‘완전하게 된’으로 옮겼습니다.
- source_word: χῶρον εὐσεβῶν
  english_pob_choice: a place among the godly
  chosen_korean: 경건한 이들 가운데 설 자리를 얻었고
  alternatives_korean:
  - 경건한 이들 가운데 자리를 얻었고
  - 경건한 자들 가운데 몫을 얻었고
  lexicon: χῶρον=자리/공간; εὐσεβῶν=경건한 이들
  rationale: χῶρον은 단순한 ‘장소’보다 공동체 안의 ‘설 자리’가 문맥상 자연스럽고, εὐσεβῶν은 ‘경건한 이들’로 인격적 집합을 살렸습니다.
- source_word: ἐν τῇ ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ
  english_pob_choice: in the visitation of the kingdom of Messiah
  chosen_korean: 그리스도의 나라의 살핌 가운데
  alternatives_korean:
  - 그리스도의 나라의 방문 가운데
  - 그리스도의 나라가 임하실 때
  lexicon: ἐπισκοπή=살핌/방문; Χριστός=그리스도
  rationale: ἐπισκοπή는 ‘감독’ 계열 어휘의 동사적·명사적 배경을 고려하면 단순한 방문보다 ‘살핌’이 문맥의 돌봄과 심판적 돌봄을 함께 보존합니다. Χριστοῦ는 본문 전통과 영어 POB의 조정 내역을 반영해 ‘그리스도’로 옮겼습니다.
theological_decisions:
- issue: ἐπισκοπή의 의미 범위
  chosen_reading: 하나님의 나라/메시아 나라의 종말론적 ‘살핌’으로 이해하여, 단순한 시각적 방문이나 정치적 점령으로 좁히지 않았습니다.
  alternative_readings:
  - 방문
  - 감독
  - 임재
  rationale: 문맥상 최종 드러남과 관련된 종말론적 개입을 가리키므로, 한국어에서는 돌봄과 심판을 함께 함축하는 ‘살핌’이 가장 덜 축소적입니다.
  doctrine_reference: 종말론, 그리스도의 통치
