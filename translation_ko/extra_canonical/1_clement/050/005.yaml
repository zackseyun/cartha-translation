    rationale: εἰς τὸ ἀφεθῆναι는 죄 사함을 나타내는 목적 표현입니다. 한국어에서는 ‘…용서받도록 하기 위함입니다’로 옮기면 목적 관계와 수동 의미를 명료하게 보존합니다.
  - severity: low
