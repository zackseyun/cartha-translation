  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι ἐσμὲν, ἀγαπητοί, εἰ τὰ προστάγματα τοῦ θεοῦ ἐποι₁₀ οῦμεν ἐν ὁμονοίᾳ ἀγάπης, εἰς τὸ ἀφεθῆναι ἡμῖν δι’ ἀγάπης τὰς ἁμαρτίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/005.yaml
  text: Blessed are we[a], beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us.
  footnotes:
  - marker: a
    text: Or 'in the harmony of love'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 사랑의 일치 안에서 하나님의 명령들을 행한다면, 복된 자들입니다[a] — 사랑을 통해 우리의 죄가 우리에게 용서되게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι ἐσμὲν
  english_pob_choice: Blessed are we
  chosen_korean: 우리는 복된 자들입니다
  alternatives_korean:
  - 우리는 복됩니다
  - 우리는 복이 있습니다
  lexicon: μακάριος
  rationale: 직역보다 문장 서두의 선언성을 살리면서도 현대 한국어에서 자연스러운 형식으로 옮겼습니다. '복된 자들'은 공동체 전체에 대한 선언을 분명히 보여 줍니다.
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 이들이여
  alternatives_korean:
  - 사랑하는 자들이여
  - 사랑하는 벗들이여
  lexicon: ἀγαπητοί
  rationale: 호칭으로 쓰인 ἀγαπητοί를 한국어의 직접 호명으로 살리기 위해 선택했습니다. 다만 본문 흐름을 해치지 않도록 본문에는 과도한 호격을 두지 않았습니다.
- source_word: ἐν ὁμονοίᾳ ἀγάπης
  english_pob_choice: in the harmony of love
  chosen_korean: 사랑의 일치 안에서
  alternatives_korean:
  - 사랑의 조화 안에서
  - 사랑의 합심 가운데
  lexicon: ὁμονοία
  rationale: 1 Clement의 ὁμονοία는 단순한 감성적 '조화'보다 공동체적 '일치'에 가깝기 때문에, 사랑의 관계 안에서의 공동체적 합일을 드러내는 '일치'로 옮겼습니다.
- source_word: τὰ προστάγματα τοῦ θεοῦ ... ἀφεθῆναι ... τὰς ἁμαρτίας
  english_pob_choice: the commandments of God ... our sins may be forgiven us
  chosen_korean: 하나님의 명령들 ... 우리의 죄가 우리에게 용서되게 하려는 것입니다
  alternatives_korean:
  - 하나님의 계명들 ... 우리의 죄가 우리에게 사함되게 하려는 것입니다
  - 하나님의 명령들 ... 우리의 죄가 우리에게 사죄되게 하려는 것입니다
  lexicon: προστάγματα / ἀφεθῆναι / ἁμαρτίαι
  rationale: προστάγματα는 단순한 일반 규범이 아니라 하나님이 주시는 명령이므로 '명령들'로 직역했고, ἀφεθῆναι는 '용서되다'로 풀어 결과적 의미를 자연스럽게 살렸습니다. ἁμαρτίαι는 문맥상 '죄'가 가장 직접적입니다.
theological_decisions:
- issue: 죄 사함의 방식과 매개
  chosen_reading: 사랑을 통해 우리의 죄가 용서되도록 하는 진술로 옮겼습니다.
  alternative_readings:
  - 사랑으로 우리의 죄가 사함되도록
  - 사랑을 통해 우리의 죄가 용서받도록
  rationale: 그리스어 δι’ ἀγάπης는 수단/매개를 나타내며, 본문은 인간의 사랑이 죄 사함을 '획득'한다기보다 사랑이 그 사함에 이르는 방식으로 제시합니다. 한국어에서는 이 뉘앙스를 보존했습니다.
  doctrine_reference: 죄 사함과 은혜의 수단에 관한 본문 해석
