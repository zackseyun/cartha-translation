revisions:
- from: 우리는 사랑의 일치 안에서 하나님의 명령들을 행한다면, 복된 자들입니다[a] — 사랑을 통해 우리의 죄가 우리에게 용서되게 하려는 것입니다.
  to: 사랑하는 이들이여, 우리가 사랑의 일치[a] 가운데서 하나님의 명령들을 행한다면 우리는 복된 자들입니다. 이는 사랑을 통하여 우리의 죄가 용서받도록 하기 위함입니다.
  rationale: 누락된 호격 ἀγαπητοί를 복원했습니다. 목적을 나타내는 εἰς τὸ ἀφεθῆναι를 한국어의 분명한 목적 표현으로 다듬되, 사랑을 ‘통하여’라는 διὰ의 매개 의미와 죄 사함의 수동 표현을 유지했습니다. 또한 각주 표지를 ὁμονοίᾳ ἀγάπης의 번역어에 옮겨 구조와 내용을 일치시켰습니다.
