id: 1CLEM.50.2
reference: 1 Clement 50:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς ἱκανὸς ἐν αὐτῇ εὑρεθῆναι, εἰ μὴ οὓς ἂν καταξιώσῃ ὁ θεός; δεηθῶμεν οὖν καὶ αἰτώμεθα ἀπὸ τοῦ ἐλέους αὐτοῦ, ἵνα ἐν ἀγάπῃ εὑρεθῶμεν δίχα προσκλίσεως ἀνθρωπίνης, ἄμωμοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/002.yaml
  text: Who is sufficient to be found in it, except those whom God may count worthy? Therefore let us pray and ask from his mercy that we may be found in love, without human partiality, blameless.
translation:
  language: ko
  text: 그 가운데서 합당하다고 인정받을 수 있는 사람이 누구이겠습니까? 하나님께서 합당하다고 여기시는 이들 외에 누가 있겠습니까? 그러므로 우리도 그의 긍휼로부터 간구하고 구합시다. 그렇게 해서 사람의 편파성 없이 사랑 안에서 발견되고, 흠 없는 자들이 되게 해 주십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸς ... εὑρεθῆναι
  english_pob_choice: Who is sufficient to be found in it
  chosen_korean: 합당하다고 인정받을 수 있는 사람이 누구이겠습니까?
  alternatives_korean:
  - 그 가운데 발견될 만한 사람이 누구이겠습니까?
  - 그 안에서 충분하다고 여겨질 사람이 누구이겠습니까?
  lexicon: ἱκανός
  rationale: ἱκανός는 단순한 능력보다 ‘자격/충분함’을 함께 담으므로, 한국어에서는 ‘합당하다’와 ‘인정받다’를 결합해 문맥의 심사·판정 뉘앙스를 살렸습니다.
- source_word: καταξιώσῃ ὁ θεός
  english_pob_choice: those whom God may count worthy
  chosen_korean: 하나님께서 합당하다고 여기시는 이들
  alternatives_korean:
  - 하나님께서 자격을 주시는 이들
  - 하나님께서 합당하다고 인정하시는 이들
  lexicon: καταξιόω
  rationale: καταξιόω는 ‘합당하다고 여기다/자격을 주다’의 판정 동사를 가지므로, 하나님의 평가 행위를 드러내는 ‘합당하다고 여기시는’으로 옮겼습니다.
- source_word: αἰτώμεθα ... ἐν ἀγάπῃ ... δίχα προσκλίσεως ἀνθρωπίνης
  english_pob_choice: pray and ask ... that we may be found in love, without human partiality
  chosen_korean: 간구하고 구합시다. 그렇게 해서 사람의 편파성 없이 사랑 안에서 발견되고
  alternatives_korean:
  - 간구하고 구합시다. 그렇게 해서 사랑 안에서, 사람의 치우침 없이 발견되고
  - 기도하며 구합시다. 그렇게 해서 사람의 편견 없이 사랑 안에서 발견되고
  lexicon: αἰτέω / ἀγάπη / προσκλίσις
  rationale: δεηθῶμεν과 αἰτώμεθα의 연속성을 살려 ‘간구하고 구합시다’로 두 동사를 구분했고, ἀγάπη는 프로젝트 기본어 ‘사랑’으로, προσκλίσις는 외형상 편견보다 ‘치우침/편파성’이 더 직접적이므로 ‘편파성’으로 옮겼습니다.
- source_word: ἄμωμοι
  english_pob_choice: blameless
  chosen_korean: 흠 없는 자들이 되게 해 주십시오
  alternatives_korean:
  - 흠 없는 이들이 되게 해 주십시오
  - 책망받을 것 없는 자들이 되게 해 주십시오
  lexicon: ἄμωμος
  rationale: ἄμωμος의 제의적·윤리적 무흠성을 함께 보존하기 위해 한국어 성경의 익숙한 ‘흠 없는’ 표현을 택했습니다.
theological_decisions:
- issue: 공동체적 청원의 문장 종결 방식
  chosen_reading: ‘되게 해 주십시오’로 마무리하여, 본문 전체를 공동체의 기도/청원으로 읽히게 했습니다.
  alternative_readings:
  - ‘되게 하소서’
  - ‘되게 하옵소서’
  rationale: 문맥상 δεηθῶμεν/αἰτώμεθα는 공동체적 간구이므로, 현대 합쇼체의 청원형으로 자연스럽게 옮기되 기도적 간청의 톤은 유지했습니다.
  doctrine_reference: 공동체 기도와 청원문의 형식
