  source_fidelity: ‘이 복된 일’은 μακαρισμός가 가리키는 복됨/복의 상태를 개별 사건으로 바꾸므로 적절하지 않습니다. 또한 διὰ Ἰησοῦ Χριστοῦ는 하나님께서 택하신 행위의 매개를 나타내므로, 한국어에서는 ‘하나님께서 우리 주 예수 메시아를 통하여 택하신’으로 결속시키는 편이 명확합니다. 송영의 대상은 직전의 예수 메시아이며, 현행 ‘그분께’는 이를 충실히 보존합니다.
  naturalness: ‘이 복은’이 ‘이 복된 일’보다 현대 표준어에서 자연스럽고, 복된 상태/복의 의미를 무리 없이 전달합니다. ‘우리 주 예수 메시아’는 자연스러운 한국어 호칭 어순입니다. 송영은 현대 합쇼체 기원문으로 유지했습니다.
  terminology: Χριστός는 프로젝트 용례에 따라 ‘메시아’로 유지했습니다. ἐκλελεγμένους는 ‘택하신 이들’로, δόξα 및 εἰς τοὺς αἰῶνας τῶν αἰώνων은 ‘영광’과 ‘영원무궁토록’으로 옮겼습니다.
