id: 1CLEM.50.7
reference: 1 Clement 50:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος ὁ μακαρισμὸς ἐγένετο ἐπὶ τοὺς ἐκλελεγ₁₅ μένους ὑπὸ τοῦ θεοῦ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/007.yaml
  text: This blessedness came upon those chosen by God through Jesus Messiah our Lord[a], to whom be the glory forever and ever. Amen.
  footnotes:
  - marker: a
    text: Or 'This blessing, then, came upon'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 복은 하나님께서 우리 주 예수 메시아를 통하여 택하신 이들에게 임하였습니다.[a] 그분께 영광이 영원무궁토록 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러므로 이 복은”.
    reason: previous_rendering
lexical_decisions:
- source_word: οὗτος ὁ μακαρισμός
  english_pob_choice: This blessedness
  chosen_korean: 이 복된 일
  alternatives_korean:
  - 이 복
  - 이 복됨
  lexicon: μακαρισμός
  rationale: μακαρισμός는 단순한 '축복'보다 결과로 주어지는 복된 상태를 가리키므로, 문맥을 살려 '복된 일'로 옮겼습니다.
- source_word: ἐπὶ τοὺς ἐκλελεγμένους
  english_pob_choice: came upon those chosen
  chosen_korean: 택하신 이들에게 임하였습니다
  alternatives_korean:
  - 선택받은 이들에게 임하였습니다
  - 뽑으신 이들에게 닥하였습니다
  lexicon: ἐκλέγομαι
  rationale: ἐκλελεγμένους는 하나님의 주권적 선택을 나타내므로 '택하신 이들'로 옮기고, ἐγένετο ἐπὶ의 도래 감각은 '임하였습니다'로 살렸습니다.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  english_pob_choice: through Jesus Messiah our Lord
  chosen_korean: 예수 메시아 우리 주를 통해
  alternatives_korean:
  - 우리 주 예수 그리스도를 통해
  - 예수 그리스도 우리 주를 통해
  lexicon: Χριστός
  rationale: POB의 메시아 용례를 따라 Χριστός를 '메시아'로 유지했고, διὰ는 수단·매개를 드러내는 '…를 통해'로 처리했습니다.
- source_word: ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων
  english_pob_choice: to whom be the glory forever and ever
  chosen_korean: 그분께 영광이 영원무궁토록 있기를 빕니다
  alternatives_korean:
  - 그분께 영광이 세세토록 있기를 빕니다
  - 그분께 영광이 영원히 영원히 있기를 빕니다
  lexicon: δόξα
  rationale: 헌송 공식의 소망형을 자연스러운 한국어로 옮기되, εἰς τοὺς αἰῶνας τῶν αἰώνων의 중첩 영속성을 '영원무궁토록'으로 살렸습니다.
theological_decisions:
- issue: Χριστός의 표기
  chosen_reading: 예수 메시아
  alternative_readings:
  - 예수 그리스도
  rationale: 이 프로젝트의 기본 용례에 따라 Χριστός를 직함으로 읽을 때 '메시아'를 유지하여 유대적·구원사적 뉘앙스를 보존했습니다.
  doctrine_reference: POB glossary / Χριστός titular default
- issue: 영광 송영의 종결 형식
  chosen_reading: 그분께 영광이 영원무궁토록 있기를 빕니다. 아멘.
  alternative_readings:
  - 그분께 영광이 세세토록 있나이다. 아멘.
  - 그분께 영광이 영원히 영원히 있기를 빕니다. 아멘.
  rationale: 본문의 ᾧ ἡ δόξα는 서술보다 송영에 가까워 한국어에서도 기원형을 유지했고, 현대 합쇼체로 예배문체를 과장 없이 살렸습니다.
  doctrine_reference: doxology register / source form preservation
