id: 1CLEM.50.4
reference: 1 Clement 50:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Εἰσέλθετε εἰς τὰ ταμεῖα μικρὸν ὅσον ὅσον, ἕως οὗ παρέλθῃ ἡ ὀργὴ καὶ ὁ θυμός μου, καὶ μνησθήσομαι ἡμέρας ἀγαθῆς, καὶ ἀναστήσω ὑμᾶς ἐκ τῶν θηκῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050/004.yaml
  text: For it is written, “Enter into your chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.”
translation:
  language: ko
  text: 기록되었으니, 여러분은 얼마 동안 방으로 들어가 있으십시오. 내 진노와 분노가 지나갈 때까지이며, 그러면 내가 좋은 날을 기억하고 여러분을 여러분의 무덤에서 일으키겠습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  english_pob_choice: For it is written
  chosen_korean: 기록되었으니
  alternatives_korean:
  - 기록되어 있습니다
  - 성경에 기록되었으니
  lexicon: γράφω
  rationale: 인용 도입 공식으로 처리하되, 한국어에서 자연스러운 문어체인 ‘기록되었으니’를 택해 원문이 제시하는 권위 있는 인용 구조를 살렸습니다.
- source_word: τὰ ταμεῖα
  english_pob_choice: your chambers
  chosen_korean: 방
  alternatives_korean:
  - 방들
  - 내실
  - 내실들
  lexicon: ταμεῖον
  rationale: POB가 ‘your chambers’로 정리한 바와 같이 ‘inner’를 덧붙이지 않고, 다소 넓은 의미의 ‘방’으로 옮겨 원문의 일반적 공간 지시를 유지했습니다.
- source_word: μικρὸν ὅσον ὅσον
  english_pob_choice: for a very little while
  chosen_korean: 얼마 동안
  alternatives_korean:
  - 아주 잠시 동안
  - 지극히 잠깐
  lexicon: μικρόν
  rationale: 반복 강조가 있는 짧은 기간 표현이므로 한국어에서는 과도하게 직역하지 않고도 ‘매우 짧은 기간’을 전달하는 ‘얼마 동안’으로 옮겼습니다.
- source_word: παρέλθῃ ἡ ὀργὴ καὶ ὁ θυμός μου
  english_pob_choice: until my wrath and anger pass by
  chosen_korean: 내 진노와 분노가 지나갈 때까지
  alternatives_korean:
  - 내 진노와 분노가 지나갈 때까지
  - 내 노와 분이 지나갈 때까지
  lexicon: ὀργή / θυμός
  rationale: 두 감정어를 구별하지 않고 각각 ‘진노’와 ‘분노’로 옮겨, 원문이 병렬로 쌓아 올린 강도를 보존했습니다.
- source_word: θηκαῖς / θηκῶν
  english_pob_choice: tombs
  chosen_korean: 무덤
  alternatives_korean:
  - 무덤들
  - 묘실
  - 무덤 속
  lexicon: θήκη
  rationale: POB의 ‘tombs’를 따라 ‘무덤’으로 옮겼고, 복수성은 문맥상 자연스럽게 드러나므로 별도 표시는 하지 않았습니다.
theological_decisions:
- issue: ‘좋은 날’을 기억하겠다는 표현의 의미
  chosen_reading: 하나님이 구원과 회복의 때를 염두에 두고 행동하신다는 약속으로 읽었습니다.
  alternative_readings:
  - 단순히 과거의 좋은 날을 떠올린다는 의미
  - 애매한 시적 표현으로 보아 직역만 유지하는 읽기
  rationale: 원문과 POB 모두 미래적 회복의 문맥에 놓여 있으므로, ‘기억하다’를 감정적 회상보다 언약적/구원사적 주의로 이해하는 편이 문맥에 더 맞습니다.
  doctrine_reference: 구원사적 기억 모티프
- issue: ‘여러분을 무덤에서 일으키겠습니다’의 종말론적 뉘앙스
  chosen_reading: 죽음에서의 회복과 일으켜 세우심을 분명히 드러내는 종말론적 표현으로 유지했습니다.
  alternative_readings:
  - 비유적으로 공동체의 회복을 뜻하는 읽기
  - 완곡하게 ‘데려오겠다’로 약화하는 번역
  rationale: 원문 동사 ἀναστήσω는 단순한 이동보다 ‘일으켜 세우다’의 힘을 가지므로, 부활적 뉘앙스를 흐리지 않도록 직접적으로 번역했습니다.
  doctrine_reference: 부활/회복 표현
