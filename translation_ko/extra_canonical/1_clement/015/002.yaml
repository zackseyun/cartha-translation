revisions:
- from: 이는 어느 곳에서 이렇게 말합니다. 「이 백성은 입술로 나를 존경하지만, 그들의 마음은 나에게서 멀리 떨어져 있습니다」.[a]
  to: 이는 어딘가에서 이렇게 말하기 때문입니다. 「이 백성은 입술로는 나를 공경하지만, 그들의 마음은 내게서 멀리 있습니다.」
  rationale: 인용문의 출처를 특정하지 않는 που를 ‘어딘가에서’로 유지하고, γάρ를 ‘이는 … 때문입니다’로 반영했습니다. 입술과 마음의 대조를 ‘입술로는’으로 드러냈으며, τιμάω는 ‘공경하다’로, πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ는 ‘내게서 멀리 있습니다’로 옮겼습니다. 제공되지 않은 각주에 연결된 표지는 삭제했습니다.
