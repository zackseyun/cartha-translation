  text: For somewhere it says, “This people honors me with their lips, but their heart is far from me.”
translation:
  language: ko
  text: 이는 어느 곳에서 이렇게 말합니다. 「이 백성은 입술로 나를 존경하지만, 그들의 마음은 나에게서 멀리 떨어져 있습니다」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  english_pob_choice: For somewhere it says
  chosen_korean: 이는 어느 곳에서 이렇게 말합니다
  alternatives_korean:
  - 어딘가에서 말합니다
  - 어느 곳에서 말씀하십니다
  lexicon: λέγει γάρ που
  rationale: 문맥상 정확한 출처를 특정하지 않는 인용 도입이므로, POB의 ‘somewhere’ 취지를 살려 출처 미지정성을 유지했습니다.
- source_word: τοῖς χείλεσιν με τιμᾷ
  english_pob_choice: honors me with their lips
  chosen_korean: 입술로 나를 존경하지만
  alternatives_korean:
  - 입술로 나를 공경하지만
  - 입술로 나를 높이지만
  lexicon: τιμάω
  rationale: τιμάω는 단순한 말하기가 아니라 ‘존경/공경’의 의미가 강하므로, 외적 예배의 형식을 드러내는 ‘존경하다’로 옮겼습니다.
- source_word: ἡ δὲ καρδία αὐτῶν πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  english_pob_choice: but their heart is far from me
  chosen_korean: 그들의 마음은 나에게서 멀리 떨어져 있습니다
  alternatives_korean:
  - 그들의 마음은 나에게서 멉니다
  - 그들의 마음은 내게서 멀리 있습니다
  lexicon: πόρρω ἀπέστιν ἀπ᾽ ἐμοῦ
  rationale: ‘far from me’의 거리감과 분리를 분명히 드러내기 위해 ‘멀리 떨어져 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 외적 존경과 내적 거리의 대비
  chosen_reading: 겉으로는 존경하지만 마음은 하나님에게서 멀어진 상태라는 대비를 그대로 살렸습니다.
  alternative_readings:
  - 단순한 위선 비판으로 완화하는 번역
  - ‘예배한다’로 바꾸어 종교적 행위에 한정하는 번역
  rationale: 인용문의 핵심은 말과 마음의 불일치이므로, ‘입술’과 ‘마음’의 대비를 약화하지 않고 유지했습니다.
  doctrine_reference: 사 29:13; 마 15:8-9
