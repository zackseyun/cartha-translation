review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast between persons characterized by godly peace and those who seek peace hypocritically. However, ‘평화를 이루는’ can suggest actively producing or establishing peace, whereas εἰρηνεύουσιν most directly denotes being/ living at peace. κολληθῶμεν also carries a stronger sense of attachment than the relatively broad ‘함께하다.’
  naturalness: The current wording is understandable, but the coordinated construction ‘함께하고 … 함께하지 말아야 합니다’ is less balanced as a Korean hortatory appeal. A paired ‘결속하고 … 결속하지 맙시다’ is natural formal-polite Korean and better reflects the Greek exhortation.
  terminology: ‘경건하게’ accurately renders the manner implied by μετ᾽ εὐσεβείας, and ‘위선적으로’ likewise renders μεθ᾽ ὑποκρίσεως without making godliness or hypocrisy the object of peace. ‘결속하다’ suitably conveys κολλάω in this communal-ethical context.
  issues:
  - severity: medium
    issue: ‘평화를 이루는’ somewhat over-specifies εἰρηνεύουσιν.
    rationale: The Greek verb normally means ‘be/live at peace’ or ‘live peaceably’; it does not necessarily assert the active establishment of peace.
  - severity: low
    issue: ‘함께하다’ weakens κολληθῶμεν, and the two Korean exhortations are not fully parallel.
    rationale: κολλάω means to join or cleave oneself to. Repeating ‘결속하다’ preserves this force and gives the positive and negative clauses balanced hortatory wording.
  - severity: low
    issue: The text contains a footnote anchor although no Korean footnote is supplied or needed.
    rationale: The English audit footnote reflects a prior English rendering rather than a source-based ambiguity requiring preservation in Korean. Removing the unsupported anchor resolves the dangling reference.
  revised_text: 그러므로 경건하게 평화롭게 지내는 이들과는 결속하고, 위선적으로 평화를 바라는 이들과는 결속하지 맙시다.
  revised_footnotes: []
  revision_rationale: The revision renders εἰρηνεύουσιν as ‘평화롭게 지내는,’ retains the modal force of ‘경건하게’ and ‘위선적으로,’ and uses ‘결속하다’ for the stronger relational sense of κολληθῶμεν. The unsupported footnote anchor is removed.
