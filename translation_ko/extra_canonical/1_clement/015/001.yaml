translation:
  language: ko
  text: 그러므로 우리는 경건함으로 평화를 이루는 이들과 함께하고, 위선으로 평화를 원하는 이들과는 함께하지 말아야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  english_pob_choice: let us join ourselves to
  chosen_korean: 우리는 ...와 함께하고
  alternatives_korean:
  - 우리는 ...에 붙어야 합니다
  - 우리는 ...와 연합해야 합니다
  lexicon: κολλάω
  rationale: 직역하면 ‘붙다/달라붙다’이지만, 이 문맥에서는 사람들과의 결속을 권면하는 뜻이므로 자연스러운 ‘함께하다’로 옮기되, 강한 결속의 뉘앙스는 유지했습니다.
- source_word: μετ᾽ εὐσεβείας εἰρηνεύουσιν
  english_pob_choice: those who live in peace with godliness
  chosen_korean: 경건함으로 평화를 이루는 이들
  alternatives_korean:
  - 경건하게 평화롭게 사는 이들
  - 경건과 함께 평화를 누리는 이들
  lexicon: εὐσέβεια / εἰρηνεύω
  rationale: μέτ᾽ εὐσεβείας는 평화의 ‘방식/동반 특성’을 나타내므로, ‘경건함으로’로 처리해 평화의 대상이 아니라 방식임을 살렸습니다.
- source_word: μεθ᾽ ὑποκρίσεως βουλομένοις εἰρήνην
  english_pob_choice: those who desire peace with hypocrisy
  chosen_korean: 위선으로 평화를 원하는 이들
  alternatives_korean:
  - 위선 가운데 평화를 바라는 이들
  - 위선적으로 평화를 추구하는 이들
  lexicon: ὑπόκρισις / βούλομαι / εἰρήνη
  rationale: 두 번째 절도 ‘위선’이 평화의 대상이 아니라 수단·동반 태도임을 반영해, ‘위선으로 평화를 원하는’으로 옮겼습니다.
theological_decisions:
- issue: 권면의 강도와 공동체적 분별
  chosen_reading: 본문은 단순한 교제 권고가 아니라, 경건한 평화를 추구하는 이들과의 결속과 위선적 평화 추구를 하는 이들과의 구별을 함께 요구합니다.
  alternative_readings:
  - 단순히 평화를 사랑하는 사람을 구별하는 권면
  - 모든 평화 추구를 긍정하는 일반적 권고
  rationale: 그리스어의 대조 구조(μετ᾽ εὐσεβείας / μεθ᾽ ὑποκρίσεως)를 살려, 평화 자체보다 그 평화의 성격을 분별하라는 윤리적 긴장을 유지했습니다.
  doctrine_reference: 교회 윤리와 공동체 분별
