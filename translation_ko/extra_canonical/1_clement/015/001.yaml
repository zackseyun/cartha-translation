revisions:
- from: 그러므로 우리는 경건함으로 평화를 이루는 이들과 함께하고, 위선으로 평화를 원하는 이들과는 함께하지 말아야 합니다.[a]
  to: 그러므로 경건하게 평화롭게 지내는 이들과는 결속하고, 위선적으로 평화를 바라는 이들과는 결속하지 맙시다.
  rationale: The revision renders εἰρηνεύουσιν as ‘평화롭게 지내는,’ retains the modal force of ‘경건하게’ and ‘위선적으로,’ and uses ‘결속하다’ for the stronger relational sense of κολληθῶμεν. The unsupported footnote anchor is removed.
  reviewer_model: gpt-5.6-terra
