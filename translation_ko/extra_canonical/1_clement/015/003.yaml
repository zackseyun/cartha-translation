lexical_decisions:
- source_word: καὶ πάλιν
  english_pob_choice: And again
  chosen_korean: 다시 말하면
  alternatives_korean:
  - 그리고 다시
  - 또
  lexicon: —
  rationale: 앞선 인용을 이어 받는 반복 인용 표지로 보아, 단순 접속보다 인용의 재도입을 드러내는 표현이 자연합니다.
- source_word: Τῷ στόματι αὐτῶν
  english_pob_choice: With their mouth
  chosen_korean: 그들의 입으로는
  alternatives_korean:
  - 그들의 입으로
  - 입으로는
  lexicon: —
  rationale: 도구·수단의 의미를 살리되 대비를 분명히 하기 위해 조사 ‘-으로는’를 사용했습니다.
- source_word: εὐλογοῦσαν
  english_pob_choice: they were blessing
  chosen_korean: 축복하였으나
  alternatives_korean:
  - 축복하고 있었으나
  - 복을 빌고 있었으나
  lexicon: —
  rationale: 과거 진행상보다 행위의 지속적 양상을 무리 없이 담아, 뒤의 대조를 살리는 과거형으로 옮겼습니다.
- source_word: κατηρῶντο
  english_pob_choice: they were cursing
  chosen_korean: 저주하였습니다
  alternatives_korean:
  - 저주하고 있었습니다
  - 저주하였으나
  lexicon: —
  rationale: 앞의 ‘축복하다’와 직접 대조되는 강한 반의어로, 표준적이고 분명한 ‘저주하다’를 유지했습니다.
theological_decisions:
- issue: 인용문 내부의 동사 시제와 대조
  chosen_reading: 행위의 내적 모순을 드러내는 대조문으로 읽고, 한국어에서도 ‘축복하였으나 / 저주하였습니다’의 병렬 대조를 분명히 했습니다.
  alternative_readings:
  - 진행상 중심으로 ‘축복하고 있었으나 / 저주하고 있었습니다’로 옮김
  rationale: 본문의 핵심은 말과 마음의 위선적 불일치에 있으므로, 시제의 미세한 차이보다 윤리적 대조가 선명하게 드러나도록 했습니다.
  doctrine_reference: 위선에 대한 성경적 경고
