lexical_decisions:
- source_word: παρρησιάσομαι
  english_pob_choice: I will speak boldly
  chosen_korean: 나는 담대하게 말하겠습니다
  alternatives_korean:
  - 나는 공개적으로 말하겠습니다
  - 나는 자신 있게 말하겠습니다
  lexicon: παρρησιάζομαι
  rationale: 동사의 핵심은 ‘거리낌 없이, 담대하게 말하다’이므로, 현대 한국어에서는 ‘담대하게 말하다’가 가장 자연스럽고 의미를 정확히 살립니다.
- source_word: ἐν αὐτῷ
  english_pob_choice: in him
  chosen_korean: 그분 안에서
  alternatives_korean:
  - 그분에게서
  - 그분을 위해
  lexicon: ἐν + αὐτός
  rationale: 직역의 ‘그 안에서’는 한국어에서 다소 모호하므로, 문맥상 인칭 지시를 살려 ‘그분 안에서’로 옮겨 그 대상 안에서/그분에 의존하여 말하는 뜻을 보존했습니다.
theological_decisions:
- issue: 인용문에서의 1인칭 발화의 주체와 지시대상
  chosen_reading: 화자가 야훼를 의식하며 그분 안에서 담대히 말하는 것으로 이해했습니다.
  alternative_readings:
  - ‘그분을 위해’라는 목적적 뉘앙스
  - 단순한 위치 표현으로서 ‘그 안에서’
  rationale: 문맥상 시편 인용의 신학적 울림을 유지하면서도, 영어 POB의 최신 수정처럼 의미를 과도하게 풀어 쓰지 않고 원문의 표현을 보존했습니다.
  doctrine_reference: 시편 인용의 담대함과 하나님 의존의 표상
