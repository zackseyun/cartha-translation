revisions:
- from: 그러므로 거짓된 입술들, 곧 의인에게 불법을 말하는 입술들은 벙어리가 되게 하십시오. 또 다시 말하기를, “주님께서 모든 거짓된 입술과 자랑하는 혀를 멸하실 것이며, ‘우리는 우리의 혀를 높이겠습니다. 우리의 입술은 우리에게 속해 있습니다. 누가 우리를 주관합니까?’”[a][b]
  to: 그러므로 의인을 거슬러 불의를 말하는 속이는 입술은 말을 못 하게 하소서. 또다시 말합니다. “주님께서 모든 속이는 입술과 큰소리치는 혀, 곧 ‘우리는 우리의 혀를 높이겠습니다. 우리의 입술은 우리에게 속해 있습니다. 누가 우리의 주인입니까?’라고 말하는 자들을 멸하시기를 바랍니다.”
  rationale: 기원문의 기원형 어조를 ‘하소서/바랍니다’로 유지하고, δεύτερη 인용에서 ‘입술과 혀’ 및 ‘말하는 자들’이 모두 멸망의 목적어가 되도록 문장을 완결했습니다. 적대의 대상(의인)과 ἀνομία의 의미를 자연스러운 현대 표준어로 명료화했으며, 내용 없는 각주 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:15Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 기원형(γενηθήτω)과 δεύτερη 인용의 기원적 어조를 한국어에서 분명히 유지해야 합니다. 또한 κατὰ τοῦ δικαίου ἀνομίαν은 ‘의인을 거슬러 불의/불법을 말하는’이라는 적대적 방향을 드러내는 편이 정확합니다.
  naturalness: ‘입술들이 벙어리가 되게 하십시오’와 ‘멸하실 것이며’는 각각 현대 한국어에서 어색하거나 문장이 미완결됩니다. 사람을 가리키는 데 부정적으로 쓰일 수 있는 ‘벙어리’ 대신 입술의 의인화를 살린 ‘말을 못 하게’가 자연스럽습니다.
  terminology: δόλια는 ‘속이는’, μεγαλορρήμων은 ‘큰소리치는’, μεγαλύνω는 ‘혀를 높이다’, κύριος는 문맥상 ‘우리의 주인’으로 옮겨, 주님의 호칭과 권위 거부라는 대조를 보존했습니다.
  issues:
  - severity: medium
    issue: 첫 기원문의 ‘벙어리가 되게 하십시오’
    rationale: γενηθήτω는 인용된 기원/명령형입니다. 한국어에서는 ‘말을 못 하게 하소서’가 그 어조와 입술에 대한 비유를 더 자연스럽게 보존하며, ‘벙어리’의 현대적 비하 가능성도 피합니다.
  - severity: high
    issue: 두 번째 인용문의 문장 구조가 미완결됨
    rationale: ‘주님께서 … 멸하실 것이며’ 뒤에 이어지는 ‘those who say’에 해당하는 목적어가 문법적으로 연결되지 않습니다. Ἐξολεθρευθῆσαν의 기원적 어조와 목적어 열거를 완결된 한국어 문장으로 재구성해야 합니다.
  - severity: medium
    issue: ‘의인에게 불법을 말하는’의 결합
    rationale: κατὰ τοῦ δικαίου는 ‘의인을 거슬러’라는 적대 방향이고, ἀνομίαν은 여기서 ‘불의’를 뜻합니다. ‘불법을 말하다’는 한국어 결합이 부자연스럽고 의미도 다소 불명확합니다.
  - severity: low
    issue: 근거 없는 [a][b] 각주 표지
    rationale: 제공된 초안에는 표지에 대응하는 각주 내용이 없습니다. 독자가 확인할 수 없는 표지는 삭제하는 것이 구조적으로 안전합니다.
  revised_text: 그러므로 의인을 거슬러 불의를 말하는 속이는 입술은 말을 못 하게 하소서. 또다시 말합니다. “주님께서 모든 속이는 입술과 큰소리치는 혀, 곧 ‘우리는 우리의 혀를 높이겠습니다. 우리의 입술은 우리에게 속해 있습니다. 누가 우리의 주인입니까?’라고 말하는 자들을 멸하시기를 바랍니다.”
