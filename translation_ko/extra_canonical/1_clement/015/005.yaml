id: 1CLEM.15.5
reference: 1 Clement 15:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο ἄλαλα γενηθήτω τὰ χείλη τὰ δόλια τὰ λαλοῦντα κατὰ τοῦ δικαίου ἀνομίαν. καὶ πάλιν· Ἐξολεθρευθῆσαν κύριος πάντα τὰ χείλη τὰ δόλια, γλῶσσαν μεγαλοῤῥήμονα, τοὺς εἰπόντας· Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν, τὰ χείλη ἡμῶν παρ᾽ ἡμῖν ἐστιν· τίς ἡμῶν κύριός ἐστιν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/005.yaml
  text: Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will magnify our tongue; our lips are our own; who is lord over us?’”
translation:
  language: ko
  text: 그러므로 거짓된 입술들, 곧 의인에게 불법을 말하는 입술들은 벙어리가 되게 하십시오. 또 다시 말하기를, “주님께서 모든 거짓된 입술과 자랑하는 혀를 멸하실 것이며, ‘우리는 우리의 혀를 높이겠습니다. 우리의 입술은 우리에게 속해 있습니다. 누가 우리를 주관합니까?’”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλαλα γενηθήτω
  english_pob_choice: let ... become mute
  chosen_korean: 벙어리가 되게 하십시오
  alternatives_korean:
  - 침묵하게 하십시오
  - 말 못하게 하십시오
  lexicon: ἄλαλος
  rationale: ‘mute’의 상태 변화를 동사구로 살려 원문 명령의 강도를 유지하되, 문맥상 입술에 대한 의인화를 자연스럽게 전달했습니다.
- source_word: τὰ χείλη τὰ δόλια
  english_pob_choice: the deceitful lips
  chosen_korean: 거짓된 입술들
  alternatives_korean:
  - 속이는 입술들
  - 간사한 입술들
  lexicon: χείλη / δόλιος
  rationale: δόλιος의 핵심을 ‘거짓된/속이는’으로 옮겨 입술의 도덕적 성격을 드러냈고, 복수성을 살리기 위해 ‘입술들’로 처리했습니다.
- source_word: κατὰ τοῦ δικαίου ἀνομίαν
  english_pob_choice: lawlessness against the righteous
  chosen_korean: 의인에게 불법을 말하는
  alternatives_korean:
  - 의인에 대하여 불법을 말하는
  - 의인에게 무법을 행하는
  lexicon: δίκαιος / ἀνομία
  rationale: 전치사 구문을 직역적으로 반복하기보다, ‘말하는’과 결합해 원문이 가리키는 ‘의인에 대한 불법적 발화’라는 의미를 한국어로 분명히 했습니다.
- source_word: γλῶσσαν μεγαλοῤῥήμονα
  english_pob_choice: the boastful tongue
  chosen_korean: 자랑하는 혀
  alternatives_korean:
  - 거만한 혀
  - 큰소리치는 혀
  lexicon: γλῶσσα / μεγαλορρήμων
  rationale: μεγαλορρήμων을 단순한 수사적 과장으로 보지 않고 ‘자랑하는’으로 옮겨, 혀의 허세와 자기과시를 드러냈습니다.
- source_word: Τὴν γλῶσσαν ἡμῶν μεγαλυνοῦμεν
  english_pob_choice: We will magnify our tongue
  chosen_korean: 우리는 우리의 혀를 높이겠습니다
  alternatives_korean:
  - 우리는 우리의 혀를 크게 하겠습니다
  - 우리는 우리의 혀를 자랑하겠습니다
  lexicon: μεγαλύνω
  rationale: ‘magnify’의 직결 의미를 유지하되 한국어에서 자연스럽고 문체상 격이 맞는 ‘높이다’로 옮겨, 자기과시의 뉘앙스를 보존했습니다.
- source_word: τίς ἡμῶν κύριός ἐστιν;
  english_pob_choice: who is lord over us?
  chosen_korean: 누가 우리를 주관합니까?
  alternatives_korean:
  - 누가 우리 주인입니까?
  - 누가 우리 위에 있습니까?
  lexicon: κύριος
  rationale: 문맥상 지배·주권 부인을 드러내는 표현이므로, 관계 호칭인 ‘주인’보다 의미를 분명히 하는 ‘주관하다’를 택했습니다.
theological_decisions:
- issue: 인용문에서의 κύριος 번역과 주권 고백/부정의 대비
  chosen_reading: 첫 번째 κύριος는 인용을 시작하는 ‘주님’으로, 마지막 τίς ἡμῶν κύριός ἐστιν;는 ‘누가 우리를 주관합니까?’로 옮겨 하나님/주권에 대한 반항적 질문을 드러냈습니다.
  alternative_readings:
  - 모든 κύριος를 ‘주’로 일관
  - 마지막 문장을 ‘누가 우리의 주님입니까?’로 번역
  rationale: 이 구절은 인용문 안에서 주님의 행위와 인간의 주권 선언이 대비되므로, 앞은 경외적 호칭, 뒤는 권위 거부의 의미가 드러나는 동사형 표현이 더 적절합니다.
  doctrine_reference: 하나님의 주권
- issue: γενηθήτω와 Ἐξολεθρευθῆσαν의 기원문/저주문 어조
  chosen_reading: 두 절구 모두 기원형을 살려 명령/소원조의 한국어로 번역했습니다.
  alternative_readings:
  - 서술형으로 완화
  - 예언형으로 재구성
  rationale: 시편 인용의 저주적·간구적 성격을 약화하지 않기 위해, 한국어에서도 직접적인 기원문 어조를 유지했습니다.
  doctrine_reference: 성경 인용의 시적-예언적 수사
