source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπὸ τῆς ταλαιπωρίας τῶν πτωχῶν καὶ τοῦ στεναγμοῦ τῶν πενήτων νῦν ἀναστήσομαι, λέγει κύριος· θήσομαι ἐν σωτηρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/006.yaml
  text: ‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety.’
translation:
  language: ko
  text: “가난한 이들의 비참함과 궁핍한 이들의 탄식 때문에, 이제 내가 일어나겠습니다.” 주님께서 말씀하십니다. “내가 안전한 곳에 두겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῆς ταλαιπωρίας τῶν πτωχῶν
  english_pob_choice: the misery of the poor
  chosen_korean: 가난한 이들의 비참함
  alternatives_korean:
  - 가난한 자들의 고통
  - 빈자들의 비참함
  lexicon: ταλαιπωρία / πτωχός
  rationale: ταλαιπωρία는 단순한 ‘가난’보다 겪는 비참함·고난의 상태를 가리키므로, POB의 ‘misery’를 살려 ‘비참함’으로 옮겼습니다.
- source_word: τοῦ στεναγμοῦ τῶν πενήτων
  english_pob_choice: the groaning of the needy
  chosen_korean: 궁핍한 이들의 탄식
  alternatives_korean:
  - 가난한 이들의 신음
  - 궁핍한 자들의 신음
  lexicon: στεναγμός / πενής
  rationale: στεναγμός은 ‘신음’도 가능하지만 탄식·한숨의 뉘앙스를 포함하므로, 문맥상 호소의 울림을 살려 ‘탄식’으로 옮겼습니다.
- source_word: νῦν ἀναστήσομαι
  english_pob_choice: now I will arise
  chosen_korean: 이제 내가 일어나리라
  alternatives_korean:
  - 지금 내가 일어나겠다
  - 이제 내가 일어나겠습니다
  lexicon: νῦν / ἀνίστημι
  rationale: 예언적 선언의 힘을 살리기 위해 직설적 미래 ‘일어나리라’를 사용했고, ‘now’는 ‘이제’로 자연스럽게 반영했습니다.
- source_word: θήσομαι ἐν σωτηρίῳ
  english_pob_choice: I will set him in safety
  chosen_korean: 내가 그를 안전한 곳에 두겠다
  alternatives_korean:
  - 내가 그를 안전하게 두겠다
  - 내가 그를 구원 안에 두겠다
  lexicon: τίθημι / σωτήριον
  rationale: σωτήριον은 단순한 물리적 안전만이 아니라 보호·구원의 상태를 가리킬 수 있지만, 여기서는 POB의 ‘in safety’를 따라 ‘안전한 곳’으로 풀어 옮겼습니다.
theological_decisions:
- issue: 주님의 직접 화법과 예언 인용의 톤
  chosen_reading: 주님의 직접 발화로 처리하되, 한국어는 현대적 예언 선언체로 유지했습니다.
  alternative_readings:
  - 주님께서 말씀하시기를 …
  - 주님께서 말씀하십니다 …
  rationale: 본문은 인용된 신적 발화이므로 인용부호를 유지했고, 회중이 읽기 쉬운 합쇼체로 정리해 원문의 선언성을 보존했습니다.
  doctrine_reference: 성경 인용/예언적 발화의 문체 보존
- issue: μονάδικον 목표대상 '그를'의 유지
  chosen_reading: ‘그를’로 단수 대상을 유지했습니다.
  alternative_readings:
  - 그것을
  - 그들을
  rationale: 영어 POB와 그리스어 모두 단수 목적어를 반영하므로, 일반화하지 않고 단수 인칭을 보존해야 합니다.
  doctrine_reference: 원문 대명사 수 일치
