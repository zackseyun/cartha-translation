source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν καὶ τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν, ἡ δὲ καρδία αὐτῶν οὐκ εὐθεῖα μετ᾽ αὐτοῦ, οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015/004.yaml
  text: And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.”
translation:
  language: ko
  text: 그리고 다시 말합니다. “그들은 입으로 그를 사랑했으며, 혀로 그에게 거짓말을 했습니다. 그러나 그들의 마음은 그에게 진실하지 않았고, 그의 언약에 신실하지 않았습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησαν αὐτὸν τῷ στόματι αὐτῶν
  english_pob_choice: They loved him with their mouth
  chosen_korean: 입으로는 그를 사랑했으며
  alternatives_korean:
  - 입으로 그를 사랑했으며
  - 입술로 그를 사랑했으며
  lexicon: ἀγαπάω
  rationale: 입으로만 하는 사랑이라는 대조를 살리기 위해 '입으로는'으로 처리했고, στόμα를 직역해 '입'을 택해 표현의 자연스러움과 원문의 대비를 함께 살렸습니다.
- source_word: τῇ γλώσσῃ αὐτῶν ἐψεύσαντο αὐτόν
  english_pob_choice: with their tongue they lied to him
  chosen_korean: 혀로는 그에게 거짓말을 했습니다
  alternatives_korean:
  - 혀로 그를 속였습니다
  - 혀로는 그에게 거짓을 말했습니다
  lexicon: γλῶσσα / ψεύδομαι
  rationale: ‘혀’와 ‘거짓말하다’의 병렬을 유지해 외적 언행의 위선을 드러내기 위해 직설적으로 옮겼습니다.
- source_word: ἡ δὲ καρδία αὐτῶν οὐκ εὐθεῖα μετ᾽ αὐτοῦ
  english_pob_choice: but their heart was not upright with him
  chosen_korean: 그러나 그들의 마음은 그와 함께 바르지 않았고
  alternatives_korean:
  - 그러나 그들의 마음은 그와 올바르지 않았고
  - 그러나 그들의 마음은 그에게 정직하지 않았고
  lexicon: καρδία / εὐθύς
  rationale: καρδία를 관용적으로 ‘마음’으로 옮기고, εὐθεῖα의 도덕적·관계적 뉘앙스를 ‘바르지 않았다’로 살렸습니다.
- source_word: οὐδὲ ἐπιστώθησαν ἐν τῇ διαθήκῃ αὐτοῦ
  english_pob_choice: nor were they faithful in his covenant
  chosen_korean: 그의 언약에 대해서도 신실하지 않았습니다
  alternatives_korean:
  - 그의 언약 안에서 신실하지 않았습니다
  - 그의 언약에 충실하지 않았습니다
  lexicon: ἐπιστόω / διαθήκη
  rationale: POB의 ‘faithful’에 맞추되, ἐπιστώθησαν의 ‘신실함/충실함’ 범위를 살려 관계적 신뢰를 드러내는 ‘신실하다’를 택했습니다.
theological_decisions:
- issue: 언약에 대한 불성실의 진술을 덜 법정적으로 번역할지 여부
  chosen_reading: ‘그의 언약에 대해서도 신실하지 않았습니다’로 번역해 언약 관계에서의 불충실성을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘그의 언약 안에서 신실하지 않았습니다’
  - ‘그의 언약을 지키지 않았습니다’
  rationale: 본문은 단순한 규정 위반보다 하나님과의 언약 관계에 대한 내적 불충실을 병렬적으로 비판하므로, 관계적 차원을 살리는 번역이 더 적합합니다.
  doctrine_reference: 언약 신실성 / 외적 고백과 내적 충성의 불일치
