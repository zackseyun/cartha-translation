  source_fidelity: 전반적으로 그리스어의 병렬과 대조를 충실히 반영합니다. 다만 μετ᾽ αὐτοῦ를 직역한 ‘그와 함께 바르지 않았고’는 한국어에서 관계적 의미가 불분명하고 부자연스럽습니다. 여기서는 마음이 그에게 곧고 진실하지 않았다는 뜻이므로 ‘그에게 진실하지 않았고’가 의미를 더 정확히 전달합니다. ‘언약에 신실하지 않았습니다’는 ἐν τῇ διαθήκῃ의 언약 관계/범위의 뜻을 자연스럽게 살립니다.
  naturalness: ‘그와 함께 바르지 않았다’는 현대 표준어 합쇼체 문장으로 어색합니다. ‘그에게 진실하지 않았다’는 자연스럽고, 입·혀·마음의 대비도 보존합니다. 인용문 뒤의 근거 없는 [a] 표지는 삭제하는 것이 적절합니다.
  terminology: ‘언약’과 ‘신실하다’는 διαθήκη와 ἐπιστώθησαν에 적합합니다. ‘진실하지 않았다’는 καρδία가 하나님을 향해 올바르고 성실하지 않았다는 문맥적 뜻을 과도한 교리적 해석 없이 전달합니다.
  issues:
