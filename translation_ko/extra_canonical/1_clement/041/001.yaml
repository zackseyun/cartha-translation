id: 1CLEM.41.1
reference: 1 Clement 41:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041/001.yaml
  text: Let each of us, brothers, please God in his own rank, maintaining a good conscience, not overstepping the fixed rule of his ministry, with dignity.
  footnotes:
  - marker: a
    text: Or 'in his own appointed rank be pleasing to God, being in a good conscience, not overstepping the fixed rule of his own ministry, with dignity.'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리 각 사람은, 형제들이여, 자기의 자리에서 하나님을 기쁘시게 하며, 선한 양심을 지키고, 자기 직무의 정해진 규범을 넘어서지 말며, 품위 있게 해야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕκαστος ἡμῶν
  english_pob_choice: Let each of us
  chosen_korean: 우리 각 사람은
  alternatives_korean:
  - 우리 각자는
  - 각 사람은
  lexicon: ἕκαστος
  rationale: 포괄적 권면을 자연스럽게 살리면서도 공동체 내부의 각 개인을 분명히 드러내기 위해 ‘우리 각 사람은’을 택했습니다.
- source_word: ἐν τῷ ἰδίῳ τάγματι
  english_pob_choice: in his own rank
  chosen_korean: 자기의 자리에서
  alternatives_korean:
  - 자기 고유의 등급에서
  - 자기에게 맡겨진 순서에서
  lexicon: τάγμα
  rationale: 군사적·질서적 뉘앙스를 유지하되 한국어 독자에게 지나치게 딱딱하지 않게 ‘자리’로 옮겼습니다. ‘own’은 ‘자기/고유의’로만 반영하고, ‘appointed’ 같은 의미는 넣지 않았습니다.
- source_word: εὐαρεστείτω τῷ θεῷ
  english_pob_choice: please God
  chosen_korean: 하나님을 기쁘시게 하며
  alternatives_korean:
  - 하나님을 기쁘게 하며
  - 하나님께서 기뻐하시게 하며
  lexicon: εὐαρεστέω
  rationale: 직역형보다 한국어에서 자연스러운 결과 의미를 살려 ‘기쁘시게 하다’로 옮겼습니다. 하나님 주어의 의향을 자연스럽게 표현합니다.
- source_word: ἐν ἀγαθῇ συνειδήσει ὑπάρχων
  english_pob_choice: maintaining a good conscience
  chosen_korean: 선한 양심을 지키고
  alternatives_korean:
  - 좋은 양심을 유지하며
  - 선한 양심 가운데 있으면서
  lexicon: συνείδησις
  rationale: 지속 상태를 나타내는 분사를 한국어 행위 표현으로 풀어, ‘좋은’보다 윤리적 뉘앙스가 분명한 ‘선한 양심’을 사용했습니다.
- source_word: μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα
  english_pob_choice: not overstepping the fixed rule of his ministry
  chosen_korean: 자기 직무의 정해진 규범을 넘어서지 말며
  alternatives_korean:
  - 자기 섬김의 정해진 규칙을 벗어나지 말며
  - 자기 봉사의 정해진 기준을 넘어서지 말며
  lexicon: λειτουργία / κανών
  rationale: λειτουργία는 여기서 제의적 ‘봉사/직무’의 넓은 뜻이므로 ‘직무’로, κανών은 ‘규범/기준’으로 옮겨 과도하게 교회 제도화하지 않았습니다.
- source_word: ἐν σεμνότητι
  english_pob_choice: with dignity
  chosen_korean: 품위 있게
  alternatives_korean:
  - 단정하게
  - 위엄 있게
  lexicon: σεμνότης
  rationale: 행동 태도의 절제와 존엄을 함께 담는 한국어로 ‘품위 있게’가 가장 무난하고 문맥에 잘 맞습니다.
theological_decisions:
- issue: 공동체 권면의 어조
  chosen_reading: 명령형의 권면을 한국어에서는 부드러운 합쇼체 권고로 옮겼습니다.
  alternative_readings:
  - 직설적 명령형으로 옮김
  - 보다 설교체적으로 강화함
  rationale: 본문은 공동체 전체에 대한 규범적 권면이므로, 권위는 유지하되 한국어 문체상 읽기 자연스러운 권고형으로 처리했습니다.
  doctrine_reference: 교회 질서와 공동체 윤리
- issue: ‘직무’와 ‘규범’의 표현
  chosen_reading: λειτουργία와 κανών을 교회 제도 용어로 과도하게 고정하지 않고, 문맥상 일반적 봉사 질서로 옮겼습니다.
  alternative_readings:
  - ‘예배 직분’으로 특정화
  - ‘율례’로 성서적 어휘화
  rationale: 1 클레멘스의 문맥은 교회 질서와 봉사를 다루지만, 본절 자체는 일반적인 봉사 규범을 말하므로 한국어에서도 그 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 교회 질서와 봉사
- issue: 하나님을 기쁘시게 함의 의미
  chosen_reading: ‘please God’를 도덕적 호감보다 관계적·언약적 기쁨의 개념으로 이해해 ‘기쁘시게 하다’로 번역했습니다.
  alternative_readings:
  - ‘하나님께 호감을 얻다’
  - ‘하나님께 받아들여지다’
  rationale: 문맥은 사람의 외형적 체면이 아니라 하나님 앞에서의 올바른 태도를 강조하므로, 기쁨의 관계성을 살리는 번역이 더 적절합니다.
  doctrine_reference: 하나님 앞의 삶
