review_pass:
  verdict: revise
  source_fidelity: 초안은 제사의 장소가 예루살렘과 성전 앞 제단으로 제한된다는 핵심을 대체로 반영합니다. 그러나 ‘흠이 없는지 확인받은’의 대상이 제사들로 읽힐 수 있어, 헬라어의 단수 분사 τὸ προσφερόμενον(드려질 제물)을 명시하는 편이 정확합니다. 또한 ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον은 ‘성전 앞 제단에서’로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: 초안의 ‘항상 드리는 제사’, ‘기도하는 제사’, ‘드리는 것이라’는 다소 부자연스럽거나 반복적입니다. ‘끊임없이 드리는 제사’, ‘기도의 제사’, ‘드려집니다’를 사용하면 현대 표준 한국어 합쇼체에 더 자연스럽습니다.
  terminology: ‘성소’보다 ναός에 대응하는 ‘성전’이 적절합니다. λειτουργοί는 문맥상 ‘봉사자들’로 유지할 수 있으며, ‘앞서 언급한’은 영어 감사본과 문맥을 충실히 반영합니다. πλημμελεία는 ‘범법’보다 제의적·윤리적 의미를 열어 두는 ‘허물’이 자연스럽습니다.
