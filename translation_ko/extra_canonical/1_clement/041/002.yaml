    rationale: 원문의 τὸ προσφερόμενον은 ‘드려질 제물’을 가리키지만, 초안은 ‘그것들’(제사들)이 흠 없음을 확인받는 듯이 읽힐 수 있습니다.
  - severity: low
    issue: 제의 용어와 문체의 부자연스러움
    rationale: ‘항상 드리는 제사와 기도하는 제사’는 ἐνδελεχισμοῦ ἢ εὐχῶν의 병렬을 매끄럽게 드러내지 못합니다.
  - severity: low
    issue: ναός의 번역
    rationale: ‘성소’는 보다 넓거나 다른 제의 공간을 뜻할 수 있으므로, 여기서는 ‘성전’이 원문에 더 직접적으로 대응합니다.
