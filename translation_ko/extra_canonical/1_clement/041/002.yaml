revisions:
- from: 형제들아 항상 드리는 제사와 기도하는 제사와 죄와 범법에 관한 제사는 모든 곳에서 드리는 것이 아니요 오직 예루살렘에서만 드리는 것이라 그리고 그곳에서도 그것들은 모든 곳에서 드려지는 것이 아니라, 이미 언급한 대제사장과 봉사자들에 의해 흠이 없는지 확인받은 후에 성소 앞, 제단에서 드려집니다.
  to: 형제 여러분, 끊임없이 드리는 제사나 기도의 제사나 죄와 허물에 관한 제사는 어느 곳에서나 드려지는 것이 아니라 오직 예루살렘에서만 드려집니다. 그러나 այնտեղ에서도 모든 곳에서 드려지는 것이 아니라, 성전 앞 제단에서, 대제사장과 앞서 언급한 봉사자들이 드릴 제물에 흠이 있는지를 살핀 뒤에 드려집니다.
  rationale: 문장의 병렬 구조와 합쇼체를 다듬고, 제물의 흠을 검사하는 행위의 대상을 명시했습니다. 장소 표현은 원문의 성전과 제단의 관계를 보존하면서 자연스러운 한국어로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
