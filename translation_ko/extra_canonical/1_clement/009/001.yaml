id: 1CLEM.9.1
reference: 1 Clement 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὸ ὑπακούσωμεν τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει αὐτοῦ, καὶ ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ προσπέσωμεν καὶ ἐπιστρέψωμεν ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ, ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/001.yaml
  text: Therefore let us obey his majestic and glorious purpose, and, becoming suppliants for his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.
  footnotes:
  - marker: a
    text: Or 'suppliants of his mercy and kindness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리는 그의 위엄 있고 영광스러운 뜻에 순종합시다. 또 그의 자비와 친절을 구하는 간청자가 되어 그 앞에 엎드려 그의 긍휼로 돌아가며, 헛된 수고와 다툼과 죽음으로 이끄는 시기를 버립시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ ὑπακούσωμεν
  english_pob_choice: Therefore let us obey
  chosen_korean: 그러므로 우리는 … 순종합시다
  alternatives_korean:
  - 그러므로 우리가 …에 복종합시다
  - 그러므로 우리는 …에 순종하겠습니다
  lexicon: ὑπακούω
  rationale: 원문의 권고적 1인칭 복수 청유를 자연스러운 합쇼체 청유로 옮겼고, ὑπακούω는 단순 청취가 아니라 권위에 대한 순종이므로 ‘순종하다’가 적절합니다.
- source_word: τῇ μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει
  english_pob_choice: his majestic and glorious purpose
  chosen_korean: 그의 위엄 있고 영광스러운 뜻
  alternatives_korean:
  - 그의 장엄하고 영광스러운 계획
  - 그의 크고 영광스러운 뜻
  lexicon: βουλή
  rationale: βουλή는 ‘뜻/결의/계획’의 폭이 있으나 문맥상 하나님의 의지와 목적을 함께 가리키므로 ‘뜻’으로 두고, μεγαλοπρεπής·ἔνδοξος의 중첩을 ‘위엄 있고 영광스러운’으로 살렸습니다.
- source_word: ἱκέται γενόμενοι τοῦ ἐλέους καὶ τῆς χρηστότητος αὐτοῦ
  english_pob_choice: becoming suppliants for his mercy and kindness
  chosen_korean: 그의 자비와 친절을 구하는 간청자가 되어
  alternatives_korean:
  - 그의 자비와 친절을 구하는 간구자가 되어
  - 그의 자비와 친절에 대하여 간청하는 자가 되어
  lexicon: ἱκέτης / ἔλεος / χρηστότης
  rationale: ἱκέτης는 단순한 요청자보다 낮은 자세의 ‘간청자’가 한국어에서 더 잘 드러나며, 목적격적 의미를 따라 ‘~을 구하는’으로 옮겼습니다. χρηστότης는 본문에서 인자함/선함의 뉘앙스를 가지므로 일상적이되 지나치게 약화되지 않게 ‘친절’로 두었습니다.
- source_word: ἐπὶ τοὺς οἰκτιρμοὺς αὐτοῦ
  english_pob_choice: turn to his compassions
  chosen_korean: 그의 긍휼로 돌아가며
  alternatives_korean:
  - 그의 긍휼을 향하여 돌이키며
  - 그의 자비로운 마음으로 돌아가며
  lexicon: οἰκτιρμός
  rationale: ἐπί + 대상을 따라 ‘~로/에게로’의 방향을 살렸고, οἰκτιρμοί는 하나님의 긍휼의 실제적 표현이므로 ‘긍휼’이 가장 직접적입니다.
- source_word: ἀπολιπόντες τὴν ματαιοπονίαν τήν τε ἔριν καὶ τὸ εἰς θάνατον ἄγον ζῆλος
  english_pob_choice: leaving behind fruitless toil, as well as strife and the jealousy that leads to death
  chosen_korean: 헛된 수고와 다툼과 죽음으로 이끄는 시기를 버립시다
  alternatives_korean:
  - 헛된 수고와 다툼과 죽음으로 이끄는 질투를 버립시다
  - 헛수고와 다툼과 죽음에 이르는 시기를 버립시다
  lexicon: ματαιοπονία / ἔρις / ζῆλος
  rationale: ματαιοπονία는 ‘헛된 수고’가 어휘적 의미를 가장 잘 드러내며, ἔρις는 ‘다툼’, ζῆλος는 문맥상 파괴적 경쟁심/질투로서 POB의 ‘jealousy’를 따라 ‘시기’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 뜻에 대한 응답 동사군의 뉘앙스
  chosen_reading: ‘순종합시다’와 ‘그 앞에 엎드려’와 ‘돌아가며’의 연쇄로, 단순 감정 변화가 아니라 회개와 복종의 총체적 전환을 드러냈습니다.
  alternative_readings:
  - ‘듣읍시다’로 완화
  - ‘무릎 꿇읍시다’만 강조
  rationale: 본문은 청취보다 순종을 요구하고, suppliant 이미지와 prostration이 함께 있어 예배적·회개적 전환을 모두 담아야 합니다.
  doctrine_reference: 회개와 순종, 하나님의 자비에 대한 의탁
