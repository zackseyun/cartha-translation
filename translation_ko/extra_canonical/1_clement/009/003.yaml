  to: 에녹을 본보기로 삼읍시다. 그는 순종 가운데 의롭게 발견되어 옮겨졌으며[a], 그의 죽음은 발견되지 않았습니다.
  rationale: 권면의 인칭을 원문의 1인칭 복수로 회복하고, ‘의롭게 발견되어’라는 수동 표현을 보존했습니다. 또한 ‘하늘로’라는 비명시적 보충을 हट고 μετετέθη의 대안적 뉘앙스는 해당 어구에 연결된 각주로 처리했습니다.
