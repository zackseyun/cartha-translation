  source_fidelity: 초안은 에녹의 옮겨짐과 죽음이 발견되지 않았다는 진술을 대체로 보존합니다. 그러나 λάβωμεν은 독자에게 권하는 1인칭 복수 권면(“본보기로 삼읍시다”)인데, “생각해 보십시오”는 2인칭 명령으로 바뀝니다. 또한 δικαίως εὑρεθείς는 ‘의롭게 발견되다’라는 표현을 보존하는 편이 ‘의롭게 여겨지다’보다 원문에 가깝습니다.
  naturalness: “에녹을 본보기로 삼읍시다”는 문맥상 자연스럽고 합쇼체의 권면 형식도 살립니다. “순종 가운데 의롭게 발견되어”는 다소 문어적이지만 고전 신앙 문헌의 격식에 알맞으며 원문의 수동 표현을 충실히 반영합니다.
  terminology: ‘에녹’은 한국어 성경 전통에 맞습니다. μετετέθη에는 목적지인 ‘하늘’이 명시되어 있지 않으므로 본문에서는 ‘옮겨졌으며’로 옮기고, 영어 감사 이력의 대안적 의미는 각주로 보존하는 것이 안전합니다.
