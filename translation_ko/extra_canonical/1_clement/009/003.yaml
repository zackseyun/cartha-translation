  text: λάβωμεν Ἐνώχ, ὃς ἐν ὑπακοῇ δικαίως εὑρεθεὶς μετετέθη, καὶ οὐχ εὑρέθη αὐτοῦ θάνατος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/003.yaml
  text: Let us take Enoch[a], who, having been found righteous in obedience, was taken up, and his death was not found.
  footnotes:
  - marker: a
    text: Or 'was transferred'.
    reason: previous_rendering
translation:
  language: ko
  text: 에녹을 본보기로 삼읍시다. 그는 순종 가운데 의롭게 발견되어 옮겨졌으며[a], 그의 죽음은 발견되지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “데려감을 받았으며.”
    reason: μετετέθη의 수동형이 가리키는 에녹의 특별한 옮겨짐을 보존하면서, 원문에 명시되지 않은 목적지를 본문에 덧붙이지 않기 위한 대안 번역입니다.
lexical_decisions:
- source_word: Ἐνώχ
  english_pob_choice: Enoch
  chosen_korean: 에녹
  alternatives_korean:
  - 에노크
  lexicon: 고유명사
  rationale: 성경에서 널리 확립된 음역을 따랐습니다.
- source_word: ἐν ὑπακοῇ δικαίως εὑρεθεὶς
  english_pob_choice: having been found righteous in obedience
  chosen_korean: 순종 안에서 의롭게 여겨졌고
  alternatives_korean:
  - 순종 가운데 의롭게 발견되었고
  - 순종으로 의롭다 함을 받았고
  lexicon: ὑπακοή / δικαίως / εὑρίσκω
  rationale: 직역적 ‘발견되다’보다 문맥상 ‘의롭게 여겨지다’가 수동적 판정의 의미를 더 자연스럽게 드러내며, ἐν ὑπακοῇ는 그 상태/범위를 ‘순종 안에서’로 보존했습니다.
- source_word: μετετέθη
  english_pob_choice: was taken up
  chosen_korean: 하늘로 옮겨졌으며
  alternatives_korean:
  - 들려 올라갔으며
  - 옮겨졌으며
  lexicon: μετατίθημι
  rationale: English audit의 수정처럼 이 동사는 단순한 ‘이동/전달’이 아니라 에녹의 신적 인수(인양) 전승을 가리키므로, 한국어에서도 초자연적 수동을 분명히 하는 표현을 택했습니다.
- source_word: οὐχ εὑρέθη αὐτοῦ θάνατος
  english_pob_choice: his death was not found
  chosen_korean: 그의 죽음은 발견되지 않았습니다
  alternatives_korean:
  - 그의 죽음은 찾아지지 않았습니다
  - 그의 죽음은 없다고 드러나지 않았습니다
  lexicon: εὑρίσκω / θάνατος
  rationale: 직접적인 그리스어 표현을 유지하되, 한국어에서는 관용적으로 자연스러운 수동형으로 옮겨 ‘죽음이 발견되지 않았다’는 문맥을 보존했습니다.
theological_decisions:
- issue: 에녹의 μετατίθημι(옮김) 의미
  chosen_reading: 에녹이 하나님께 의해 하늘로 옮겨졌다는 초자연적 인수로 읽었습니다.
  alternative_readings:
  - 단순히 장소가 바뀌었다는 의미
  - 중립적인 ‘전달/이동’ 의미
  rationale: 1 Clement의 에녹 언급은 창 5:24와 히 11:5의 전통을 배경으로 하므로, 문맥상 신적 옮김의 의미를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 창세기 5:24; 히브리서 11:5
