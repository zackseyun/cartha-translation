  text: Let us fix our gaze on those who served perfectly in his majestic glory.
translation:
  language: ko
  text: 그분의 장엄한 영광 안에서 온전히 섬긴 이들을 바라봅시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσωμεν
  english_pob_choice: Let us fix our gaze
  chosen_korean: 바라봅시다
  alternatives_korean:
  - 주목합시다
  - 시선을 고정합시다
  - 응시합시다
  lexicon: ἀτενίζω
  rationale: 공동 권면의 뉘앙스를 살리면서도 한국어에서 자연스럽고 과도하게 딱딱하지 않은 권유형으로 옮겼습니다.
- source_word: λειτουργήσαντας
  english_pob_choice: served
  chosen_korean: 섬긴
  alternatives_korean:
  - 봉사한
  - 예배한
  - 사역한
  lexicon: λειτουργέω
  rationale: 영어 POB의 'served'를 따르되, 한국어에서 공적·헌신적 섬김을 가장 무난하게 드러내는 '섬기다'를 사용했습니다.
- source_word: τελείως
  english_pob_choice: perfectly
  chosen_korean: 온전히
  alternatives_korean:
  - 완전히
  - 완벽하게
  - 완전하게
  lexicon: τελείως
  rationale: 도덕적·기능적 완전성을 지나치게 기계적으로 느끼게 하지 않도록 '온전히'로 옮겨, 행위의 충실성과 성실함을 살렸습니다.
- source_word: τῇ μεγαλοπρεπεῖ δόξῃ αὐτοῦ
  english_pob_choice: in his majestic glory
  chosen_korean: 그분의 장엄한 영광 안에서
  alternatives_korean:
  - 그분의 위엄 있는 영광 안에서
  - 그분의 위대한 영광 안에서
  - 그분의 찬란한 영광 안에서
  lexicon: μεγαλοπρεπής + δόξα
  rationale: 여격구를 자연스러운 한국어로 풀어 '안에서'로 처리했고, μεγαλοπρεπεῖ의 장중함은 '장엄한'으로 반영했습니다.
theological_decisions:
- issue: 주어 지시 방식
  chosen_reading: 직접적인 인칭대명사 대신 '그분'을 사용했습니다.
  alternative_readings:
  - 그의
  - 하나님의
  - 주님의
  rationale: 문맥상 하나님을 가리키지만, 한국어 합쇼체 본문에서는 문장 흐름을 해치지 않는 범위에서 경외감을 유지하는 '그분'이 가장 중립적입니다.
  doctrine_reference: 문맥 지시 대명사 선택
