id: 1CLEM.9.4
reference: 1 Clement 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Νῶε πιστὸς εὑρεθεὶς διὰ τῆς λειτουργίας αὐτοῦ παλιγγενεσίαν κόσμῳ ἐκήρυξεν, καὶ διέσωσεν δι’ αὐτοῦ ὁ δεσπότης τὰ εἰσελθόντα ἐν ὁμοίᾳ ζῷα εἰς τὴν κιβωτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009/004.yaml
  text: Noah[a], having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master preserved the animals that entered the ark in pairs.
  footnotes:
  - marker: a
    text: Or 'in harmony, two by two'.
    reason: previous_rendering
translation:
  language: ko
  text: 노아는 믿음직한 사람으로 드러나, 그의 직분을 통해 세상에 새 창조를 선포하였고, 그를 통해 주인께서 방주에 들어간 짐승들을 한 쌍씩 보존하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸς εὑρεθεὶς
  english_pob_choice: having been found faithful
  chosen_korean: 믿음직한 사람으로 드러나
  alternatives_korean:
  - 신실하다고 드러나
  - 믿음이 있는 것으로 드러나
  lexicon: πιστός
  rationale: πιστός는 단순한 내면 상태보다 ‘충실함/믿음직함’이 드러난 상태를 가리키므로, 자연스러운 한국어로 그 평가적 뉘앙스를 살렸습니다.
- source_word: διὰ τῆς λειτουργίας αὐτοῦ
  english_pob_choice: through his ministry
  chosen_korean: 그의 직분을 통해
  alternatives_korean:
  - 그의 섬김을 통해
  - 그의 봉사를 통해
  lexicon: λειτουργία
  rationale: λειτουργία는 일반적 봉사보다 공적·제의적 직무의 색채가 있어, 본문 문맥상 ‘직분’을 선택했습니다.
- source_word: παλιγγενεσίαν κόσμῳ ἐκήρυξεν
  english_pob_choice: proclaimed regeneration to the world
  chosen_korean: 세상에 새 창조를 선포하였고
  alternatives_korean:
  - 세상에 거듭남을 선포하였고
  - 세상에 중생을 선포하였고
  lexicon: παλιγγενεσία
  rationale: παλιγγενεσία는 개인의 ‘거듭남’보다 우주적·종말론적 ‘새 생성/새 창조’의 의미가 강하므로, 문맥에 맞게 옮겼습니다.
- source_word: ὁ δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주인께서
  alternatives_korean:
  - 주께서
  - 주재자께서
  lexicon: δεσπότης
  rationale: δεσπότης는 단순한 κύριος보다 소유권과 주권을 강하게 드러내므로, 여기서는 ‘주인’이 원문의 지배적 의미를 더 직접적으로 반영합니다.
- source_word: τὰ εἰσελθόντα ... ζῷα
  english_pob_choice: the animals that entered the ark
  chosen_korean: 방주에 들어간 짐승들을
  alternatives_korean:
  - 방주에 들어간 동물들을
  - 방주에 들어간 생물들을
  lexicon: ζῷα
  rationale: ζῷα는 여기서 일반적인 ‘생물’보다 홍수 기사 맥락의 구체적 피조물인 ‘짐승들’이 더 자연스럽습니다.
- source_word: ἐν ὁμοίᾳ
  english_pob_choice: in pairs
  chosen_korean: 한 쌍씩
  alternatives_korean:
  - 짝지어
  - 짝으로
  lexicon: ὁμοίος
  rationale: 수량을 직접 말하지 않지만, 방주 입장 문맥에서 ‘한 쌍씩’이 한국어로 가장 자연스럽게 대응하며, 영어 POB의 수정 취지와도 맞습니다.
theological_decisions:
- issue: παλιγγενεσία의 신학적 범위
  chosen_reading: 개인의 회심 경험보다 세상 차원의 새 창조 선포로 읽었습니다.
  alternative_readings:
  - 개인의 거듭남 선포
  - 윤리적 개혁 선언
  rationale: 본문은 노아를 통해 ‘κόσμῳ’에 대한 선언을 말하므로, 개인 구원 용어로 축소하지 않고 우주적 갱신의 뜻을 살렸습니다.
  doctrine_reference: 새 창조/종말론적 회복
