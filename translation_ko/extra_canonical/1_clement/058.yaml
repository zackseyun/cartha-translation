source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα. 2. δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
  pages:
  - 333
  - 335
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058.yaml
  text: 'Let us therefore submit ourselves to his all-holy and glorious name[a], fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell secure, having placed our confidence in the most holy name of his majesty.


    Accept our counsel, and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, who are the faith and the hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, will thus be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever[d][c][b]. Amen.'
  footnotes:
  - marker: a
    text: Or 'through Wisdom,' if the phrase is taken as a more personified allusion rather than a general reference to wisdom as the medium of warning.
    reason: lexical_alternative
  - marker: b
    text: 'The clause ''who are the faith and the hope of the elect'' is syntactically compressed in Greek and may also be understood appositionally: ''and the faith and hope of the elect.'''
    reason: alternative_reading
  - marker: c
    text: '''Those being saved'' renders a present participle, preserving the sense of an ongoing state rather than only a completed result.'
    reason: lexical_alternative
  - marker: d
    text: Or 'this one will be enrolled'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 우리는 그의 지극히 거룩하고 영광스러운 이름에 복종합시다. 그리고 지혜를 통하여 미리 선포된, 불순종하는 자들에 대한 위협을 피하여, 그의 위엄의 가장 거룩한 이름 안에서 안전하게 거하며 확신을 두도록 합시다.


    우리의 권면을 받아들이십시오. 그러면 여러분에게는 후회가 없을 것입니다. 하나님께서 살아 계시고, 주 예수 메시아께서 살아 계시며, 성령께서 살아 계시고, 또 선택된 자들의 믿음과 희망이 되십니다. 그러므로 겸손과 간절한 온유함으로, 후회 없이 하나님께서 주신 의로운 요구들과 명령들을 행하는 사람은, 예수 메시아를 통하여 구원받는 이들의 수에 등록되고 포함될 것입니다. 그를 통하여 영원무궁토록 그에게 영광이 있을 것입니다. 아멘.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  english_pob_choice: Let us therefore submit ourselves
  chosen_korean: 복종합시다
  alternatives_korean:
  - 우리 자신을 복종시키십시오
  - 복종해야 합니다
  lexicon: BDAG
  rationale: 권면형 수동/사역 뉘앙스를 한국어 합쇼체의 공동 권면인 ‘복종합시다’로 옮겨, 공동체적 촉구의 힘을 살렸습니다.
- source_word: παναγίῳ καὶ ἐνδόξῳ ὀνόματι
  english_pob_choice: his all-holy and glorious name
  chosen_korean: 지극히 거룩하고 영광스러운 이름
  alternatives_korean:
  - 온전히 거룩하고 영광스러운 이름
  - 가장 거룩하고 영광스러운 이름
  lexicon: LSJ
  rationale: 복합 강조를 살리기 위해 ‘지극히’로 παναγίῳ의 절대적 강도를 나타내고, ὄνομα는 신학적 함의를 유지하여 ‘이름’으로 직역했습니다.
- source_word: διὰ τῆς σοφίας
  english_pob_choice: through wisdom
  chosen_korean: 지혜를 통하여
  alternatives_korean:
  - 지혜로
  - 지혜를 통해
  lexicon: LSJ
  rationale: 원문의 매개/수단 관계를 드러내기 위해 ‘통하여’를 택했고, 본문 주석 가능성은 본문이 아니라 주석층에서 처리하도록 했습니다.
- source_word: πνεῦμα τὸ ἅγιον
  english_pob_choice: the Holy Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 거룩한 영
  - 성스러운 영
  lexicon: BDAG
  rationale: 삼중 증언의 문맥에서 하나님의 영을 가리키는 분명한 신학적 용법이므로, 한국어 교회 언어에 맞는 ‘성령’을 사용했습니다.
- source_word: ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν
  english_pob_choice: who are the faith and the hope of the elect
  chosen_korean: 선택된 자들의 믿음과 희망이 되십니다
  alternatives_korean:
  - 선택된 자들의 믿음과 희망이십니다
  - 선택된 자들의 믿음과 소망이 되십니다
  lexicon: BDAG
  rationale: 압축된 그리스어 구조를 한국어에서 자연스럽게 풀어, 직전의 삼중 증언 주어들에 연결되는 술어적 설명으로 옮겼습니다. 또한 ἐλπὶς는 문맥상 ‘희망’보다 교회어법의 ‘소망’이 가능하지만, 여기서는 영어 POB의 선택을 따라 ‘희망’을 유지했습니다.
- source_word: τῶν σῳζομένων
  english_pob_choice: those being saved
  chosen_korean: 구원받는 이들
  alternatives_korean:
  - 구원받고 있는 이들
  - 구원될 이들
  lexicon: BDAG
  rationale: 진행상 현재분사의 지속성을 살리되, 한국어에서는 과도하게 어색한 진행형보다 ‘구원받는 이들’로 현재적 상태와 과정을 함께 보이게 했습니다.
- source_word: ἐντεταγμένος καὶ ἐλλόγιμος
  english_pob_choice: will thus be enrolled and counted
  chosen_korean: 등록되고 포함될 것입니다
  alternatives_korean:
  - 명부에 오르고 셈해질 것입니다
  - 기록되고 간주될 것입니다
  lexicon: LSJ
  rationale: 행정/명부 비유를 살리면서도 현대 한국어에서 이해되도록 ‘등록되고 포함될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: κύριος Ἰησοῦς Χριστός의 Χριστός 처리
  chosen_reading: 예수 메시아
  alternative_readings:
  - 예수 그리스도
  - 주 예수 메시아
  rationale: 이 단락에서는 Χριστός의 칭호성이 살아 있으므로 프로젝트 기본어인 ‘메시아’를 유지해 신학적 의미를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 지혜를 통한 위협의 성격
  chosen_reading: 지혜를 통하여 미리 선포된 위협
  alternative_readings:
  - 지혜 자체의 인격적 발화
  - 지혜로 말한 위협
  rationale: 본문은 지혜의 인격화 가능성을 열어 두지만, 본문층에서는 그 가능성을 확정하지 않고 원문의 매개 표현을 유지했습니다.
  doctrine_reference: 원문의 해석 유보 원칙
