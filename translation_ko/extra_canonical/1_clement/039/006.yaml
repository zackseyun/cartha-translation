  text: He breathed on them, and they died because they lacked wisdom.
translation:
  language: ko
  text: 그가 그들에게 숨을 불어넣었고, 그들은 지혜가 없었기 때문에 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεφύσησεν
  english_pob_choice: He breathed on them
  chosen_korean: 그들에게 숨을 불어넣자
  alternatives_korean:
  - 그들 위에 숨을 내쉬자
  - 그들에게 불어넣자
  lexicon: ἐμφυσάω
  rationale: 동사의 ‘숨을 불어넣다/내쉬다’라는 직접적 이미지를 살리되, 한국어에서 가장 자연스러운 서술형으로 옮겼습니다.
- source_word: ἐτελεύτησαν
  english_pob_choice: they died
  chosen_korean: 그들은 죽었습니다
  alternatives_korean:
  - 그들이 끝났습니다
  - 그들이 생명을 마쳤습니다
  lexicon: τελευτάω
  rationale: 문맥상 실제 죽음을 가리키므로 직설적으로 ‘죽었습니다’로 옮겼습니다.
- source_word: παρὰ τὸ μὴ ἔχειν αὐτοὺς σοφίαν
  english_pob_choice: because they lacked wisdom
  chosen_korean: 지혜가 없었기 때문에
  alternatives_korean:
  - 지혜를 갖지 못했기 때문에
  - 지혜가 없어서
  lexicon: παρά + τὸ μὴ ἔχειν
  rationale: 원문의 원인 구문을 한국어 인과 표현으로 자연스럽게 옮기되, ‘없었기 때문에’로 결핍의 의미를 분명히 했습니다.
- source_word: σοφίαν
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 현명함
  lexicon: σοφία
  rationale: 시문맥에서 일반적 지적 능력보다 분별과 통찰의 ‘지혜’가 더 직접적인 대응어입니다.
theological_decisions:
- issue: 문장의 인과 관계 표현
  chosen_reading: 죽음의 이유를 ‘지혜가 없었기 때문에’로 직접 진술했습니다.
  alternative_readings:
  - ‘지혜가 없어서 죽었습니다’
  - ‘지혜가 부족하여 죽었습니다’
  rationale: 영어 POB의 revised reading이 인과를 분명히 하므로, 한국어도 원인의 단순 설명을 유지해 서술의 힘을 살렸습니다.
  doctrine_reference: source fidelity / discourse clarity
