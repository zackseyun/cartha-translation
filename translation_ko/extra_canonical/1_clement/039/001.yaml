  source_fidelity: ἀσύνετοι는 감각의 둔함이나 무감각을 뜻하기보다 이해력·분별의 결여를 가리키므로, ‘무감각하고’는 원문의 의미 범위에서 벗어납니다. 또한 χλευάζουσιν과 μυκτηρίζουσιν의 병렬은 각각 ‘조롱하다’와 ‘코웃음 치다/비웃다’로 구별해 드러낼 수 있습니다. βουλόμενοι는 조롱 행위의 이유를 단정하는 접속 표현보다, 스스로를 높이려는 의도를 나타내는 분사로 옮기는 편이 가깝습니다.
  naturalness: ‘어리석고, 분별 없고, 미련하고, 배우지 못한 사람들’은 원문의 누적적 비난 어조를 유지하면서 현대 표준 한국어로 자연스럽습니다. ‘코웃음 칩니다’는 합쇼체 문장에 맞고, 앞 동사와의 의미상 차이도 보존합니다.
