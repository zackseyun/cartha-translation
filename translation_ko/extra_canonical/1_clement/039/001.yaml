  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: ko
  text: 어리석고, 무감각하고, 미련하며, 배우지 못한 사람들은 우리를 조롱하고 비웃습니다 — 자기들 생각으로 스스로를 높이려 하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄφρονες
  english_pob_choice: foolish
  chosen_korean: 어리석고
  alternatives_korean:
  - 미련하고
  - 우매하고
  lexicon: ἄφρων
  rationale: 지적 결핍보다 분별 없음에 초점이 있어, 현대 표준어로 자연스러운 ‘어리석고’로 옮겼습니다.
- source_word: ἀσύνετοι
  english_pob_choice: senseless
  chosen_korean: 무감각하고
  alternatives_korean:
  - 무분별하고
  - 분별 없는
  lexicon: ἀσύνετος
  rationale: 단순한 지능 부족보다 이해와 판단의 둔함을 드러내는 말로 보아 ‘무감각하고’로 표현했습니다.
- source_word: μωροὶ
  english_pob_choice: stupid
  chosen_korean: 미련하며
  alternatives_korean:
  - 우둔하며
  - 어리석으며
  lexicon: μωρός
  rationale: 앞의 ‘어리석고’와 중복을 피하면서도 경멸적 뉘앙스를 살리기 위해 ‘미련하며’를 택했습니다.
- source_word: ἀπαίδευτοι
  english_pob_choice: untaught
  chosen_korean: 배우지 못한 사람들은
  alternatives_korean:
  - 무학한 사람들은
  - 교육받지 못한 사람들은
  lexicon: ἀπαίδευτος
  rationale: 형식적 교육의 부재를 가리키는 말이므로, 현대 독자에게 자연스러운 ‘배우지 못한 사람들’로 옮겼습니다.
theological_decisions:
- issue: 화자의 비난적 열거를 한국어에서 어떻게 유지할지
  chosen_reading: 네 개의 형용사를 그대로 이어, 조롱의 대상이 되는 사람들을 강하게 규정하는 어조를 유지했습니다.
  alternative_readings:
  - 부드럽게 완화해 ‘분별 없는 사람들’ 정도로 처리
  - 형용사 일부를 묶어 한 번만 표현
  rationale: 원문은 연속된 경멸어로 청중의 태도를 비판하므로, 한국어에서도 그 수사적 강도를 보존하는 것이 적절합니다.
  doctrine_reference: 수사적 보존과 의미 충실성
