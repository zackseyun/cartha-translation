  - 우매하고
  lexicon: ἄφρων
  rationale: 지적 결핍보다 분별 없음에 초점이 있어, 현대 표준어로 자연스러운 ‘어리석고’로 옮겼습니다.
- source_word: ἀσύνετοι
  english_pob_choice: senseless
