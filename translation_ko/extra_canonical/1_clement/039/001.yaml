  lexicon: ἀσύνετος
  rationale: 단순한 지능 부족보다 이해와 판단의 둔함을 드러내는 말로 보아 ‘무감각하고’로 표현했습니다.
- source_word: μωροὶ
  english_pob_choice: stupid
  chosen_korean: 미련하며
  alternatives_korean:
  - 우둔하며
  - 어리석으며
  lexicon: μωρός
  rationale: 앞의 ‘어리석고’와 중복을 피하면서도 경멸적 뉘앙스를 살리기 위해 ‘미련하며’를 택했습니다.
- source_word: ἀπαίδευτοι
  english_pob_choice: untaught
  chosen_korean: 배우지 못한 사람들은
  alternatives_korean:
  - 무학한 사람들은
  - 교육받지 못한 사람들은
  lexicon: ἀπαίδευτος
  rationale: 형식적 교육의 부재를 가리키는 말이므로, 현대 독자에게 자연스러운 ‘배우지 못한 사람들’로 옮겼습니다.
