  text: Foolish and senseless and stupid and untaught men mock us and sneer at us, wanting to exalt themselves in their own thoughts.
translation:
  language: ko
  text: 어리석고 분별 없고 미련하며 배우지 못한 사람들은 우리를 조롱하고 코웃음 치며, 자기들의 생각으로 스스로를 높이려 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄφρονες
  english_pob_choice: foolish
  chosen_korean: 어리석고
  alternatives_korean:
