id: 1CLEM.39.9
reference: 1 Clement 39:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας· κολαβρισθείησαν ἐπὶ θύραις ἡσόνων, καὶ οὐκ ἔσται ὁ ἐξαιρούμενος· ἃ γὰρ ἐκείνοις ἡτοίμασας, δίκαιοι ἕδονται, αὐτοὶ δὲ ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/009.yaml
  text: May their sons be far from safety; may they be crushed at the gates by the lowly[a], and there will be no one to rescue them. For what you prepared for them, the righteous will eat, but they themselves will not be delivered from evils.
  footnotes:
  - marker: a
    text: Or 'For what things you prepared for them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 아들들이 안전에서 멀어지게 하시고, 낮은 자들의 성문에서 짓밟히게 하시며, 그들을 구해 줄 자도 없게 하십시오. 그들이 마련한 것을 의인들이 먹을 것이지만, 그들은 악에서 건져지지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόγένοιντο οἱ υἱοὶ αὐτῶν ἀπὸ σωτηρίας
  english_pob_choice: May their sons be far from safety
  chosen_korean: 그들의 아들들이 안전함에서 멀어지게 하시고
  alternatives_korean:
  - 그들의 아들들이 구원에서 멀어지게 하시고
  - 그들의 아들들이 안전으로부터 멀어지게 하시고
  lexicon: σωτηρία
  rationale: 문맥상 단순한 ‘안전/구원’의 결핍을 말하므로, 시적·저주적 청원 형식에 맞게 ‘안전함’으로 옮겼습니다.
- source_word: ἐπὶ θύραις ἡσόνων
  english_pob_choice: at the gates by the lowly
  chosen_korean: 비천한 자들에 의해 성문에서 짓밟히게 하시며
  alternatives_korean:
  - 낮은 자들에 의해 성문에서 짓밟히게 하시며
  - 비천한 자들의 성문 앞에서 짓밟히게 하시며
  lexicon: ἡσόνων
  rationale: POB의 ‘the lowly’는 수동 피해의 행위를 드러내므로, 한국어에서는 ‘비천한 자들에 의해’로 행위 주체를 분명히 했습니다.
- source_word: οὐκ ἔσται ὁ ἐξαιρούμενος
  english_pob_choice: there will be no one to rescue them
  chosen_korean: 그들을 구해 줄 자도 없게 하십시오
  alternatives_korean:
  - 건져 줄 자도 없게 하십시오
  - 그들을 빼낼 자도 없게 하십시오
  lexicon: ἐξαιρέω
  rationale: 구체적 탈출 행위보다 ‘구해 주다/건져 주다’의 의미가 자연스럽고, 앞뒤의 재난 문맥에도 잘 맞습니다.
- source_word: δίκαιοι ἕδονται
  english_pob_choice: the righteous will eat
  chosen_korean: 의인들이 먹을 것이나
  alternatives_korean:
  - 의인들이 먹을 것이며
  - 의인들이 그것을 먹을 것이나
  lexicon: δίκαιοι / ἕδονται
  rationale: LXX 인용의 짧고 단정적인 대조를 살리기 위해 간결하게 ‘먹을 것이나’로 처리했습니다.
- source_word: ἐκ κακῶν οὐκ ἐξαίρετοι ἔσονται
  english_pob_choice: they themselves will not be delivered from evils
  chosen_korean: 그들은 스스로 악에서 건져지지 못할 것이기 때문입니다
  alternatives_korean:
  - 그들은 악들에서 건져지지 못할 것이기 때문입니다
  - 그들 자신은 재난에서 벗어나지 못할 것이기 때문입니다
  lexicon: ἐκ κακῶν / ἐξαίρετοι
  rationale: 복수형 κακά를 ‘악’으로 포괄적으로 옮기되, ‘건져지다’로 앞의 ἐξαιρούμενος와 어휘 대조를 유지했습니다.
theological_decisions:
- issue: 1인칭/주어 생략형의 청원체 처리
  chosen_reading: 직접 주어를 드러내지 않고 3인칭 청원형을 한국어 간접명령으로 옮겼습니다.
  alternative_readings:
  - ‘원하옵나이다’식 기도문체
  - 직설형 미래로 옮김
  rationale: 헬라어의 저주적 소원형을 현대 한국어 합쇼체의 간접청원으로 자연스럽게 재현하면서, 본문의 시적·예언적 어조를 유지했습니다.
  doctrine_reference: 문체/화용상 판단
