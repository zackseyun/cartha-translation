revisions:
- from: 그들의 아들들이 안전함에서 멀어지게 하시고, 비천한 자들에 의해 성문에서 짓밟히게 하시며, 그들을 구해 줄 자도 없게 하십시오. 이는 주께서 그들을 위해 예비하신 것을 의인들이 먹을 것이나, 그들은 스스로 악에서 건져지지 못할 것이기 때문입니다.[a]
  to: 그들의 아들들이 안전에서 멀어지게 하시고, 낮은 자들의 성문에서 짓밟히게 하시며, 그들을 구해 줄 자도 없게 하십시오. 그들이 마련한 것을 의인들이 먹을 것이지만, 그들은 악에서 건져지지 못할 것입니다.
  rationale: 본문은 욥기 5:4–5의 칠십인역 인용으로 보이며, 후반절의 OCR 오류는 인용문의 문맥과 의미를 훼손합니다. 이를 ‘그들이 마련한 것’으로 바로잡고, 성문 구절의 전치사·속격 관계를 한국어에 반영했습니다. 근거가 없는 각주 표지는 삭제했습니다.
