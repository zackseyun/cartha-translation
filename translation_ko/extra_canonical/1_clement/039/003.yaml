id: 1CLEM.39.3
reference: 1 Clement 39:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται· Οὐκ ἦν μορφὴ πρὸ ὀφθαλμῶν μου, ἀλλʼ ἢ αὔραν καὶ φωνὴν ἤκουονʼ
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/003.yaml
  text: 'It is written: “There was no form before my eyes[a], but I heard only a breath and a voice.”'
  footnotes:
  - marker: a
    text: Or 'For it is written, “No form was before my eyes; rather, I was hearing'.
    reason: previous_rendering
translation:
  language: ko
  text: 기록되었으되, 내 눈앞에는 형체가 없었고, 나는 오직 숨결과 음성만 들었습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  english_pob_choice: It is written
  chosen_korean: 기록되었으되
  alternatives_korean:
  - 기록되어 있습니다
  - 기록되었지만
  lexicon: γράφω
  rationale: 서두의 수동 완료형을 한국어 성경 문체에 맞게 간결하게 살리되, 불필요한 ‘for’를 덧붙이지 않았습니다.
- source_word: Οὐκ ἦν μορφὴ
  english_pob_choice: There was no form
  chosen_korean: 형체가 없었고
  alternatives_korean:
  - 형상이 없었고
  - 모양이 없었고
  lexicon: μορφή
  rationale: μορφή는 여기서 눈에 보이는 외형을 가리키므로 ‘형체’가 가장 직접적입니다.
- source_word: ἀλλʼ ἢ
  english_pob_choice: but only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그저
  lexicon: ἀλλά
  rationale: 부정문 뒤의 ἀλλʼ ἢ는 ‘다만/오직 ~만’의 제한 의미이므로, ‘but rather’보다 ‘오직’이 원문의 초점을 더 정확히 드러냅니다.
- source_word: αὔραν καὶ φωνὴν ἤκουον
  english_pob_choice: a breath and a voice
  chosen_korean: 숨결과 음성
  alternatives_korean:
  - 바람과 음성
  - 숨과 소리
  lexicon: αὔρα, φωνή
  rationale: αὔρα는 단순한 바람보다 희미하게 감지되는 ‘숨결’이 문맥에 더 가깝고, φωνή는 일반적인 ‘소리’보다 ‘음성’이 더 적절합니다.
theological_decisions:
- issue: 직접 인용의 어조와 시제 처리
  chosen_reading: 본문의 인용은 서술체로 처리하고, ἤκουον의 미완료는 한국어에서는 자연스럽게 ‘들었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘듣고 있었습니다’
  - ‘계속 듣고 있었습니다’
  rationale: 한국어에서 지속적 청각 경험을 어색하게 과장하지 않으면서도, 본문의 회상적 증언 성격을 충분히 보존합니다.
  doctrine_reference: 번역 문체/서술 시제
