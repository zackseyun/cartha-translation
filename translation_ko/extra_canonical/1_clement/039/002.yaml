  text: For what can a mortal do? Or what strength has one born of earth?
translation:
  language: ko
  text: 죽을 수밖에 없는 사람이 무엇을 할 수 있습니까? 아니면 땅에서 난 사람이 무슨 힘을 가지겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ δύναται θνητός;
  english_pob_choice: For what can a mortal do?
  chosen_korean: 죽을 수밖에 없는 사람이 무엇을 할 수 있습니까?
  alternatives_korean:
  - 죽을 수 있는 사람이 무엇을 할 수 있습니까?
  - 한낱 인간이 무엇을 할 수 있습니까?
  lexicon: θνητός
  rationale: θνητός는 단순히 ‘필멸의’가 아니라 죽음을 피할 수 없는 인간의 한계를 가리키므로, 의미를 드러내는 ‘죽을 수밖에 없는 사람’으로 옮겼습니다.
- source_word: ἰσχὺς
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 능력
  - 권세
  - 강함
  lexicon: ἰσχύς
  rationale: 이 문맥에서는 실제로 발휘되는 역량을 묻는 표현이어서, 가장 자연스럽고 직접적인 ‘힘’으로 옮겼습니다.
- source_word: γηγενοῦς
  english_pob_choice: one born of earth
  chosen_korean: 흙에서 난 자
  alternatives_korean:
  - 땅에서 난 자
  - 세상에서 난 자
  - 흙으로부터 난 사람
  lexicon: γηγενής
  rationale: γηγενοῦς는 ‘땅/흙에서 태어난’ 존재를 뜻하므로, 창조-피조물의 대비를 살리기 위해 ‘흙에서 난 자’로 옮겼습니다.
theological_decisions:
- issue: 인간의 유한성과 피조성의 대비
  chosen_reading: 이 절은 ‘죽을 수밖에 없는 사람’과 ‘흙에서 난 자’를 병렬하여 인간의 근본적 무력함을 강조합니다.
  alternative_readings:
  - 단순한 수사적 겸양으로 약하게 읽기
  - ‘흙’의 이미지를 완화해 일반적 인간 의미로만 읽기
  rationale: 그리스어 병렬구조가 인간의 죽음성과 피조성을 함께 강조하므로, 두 표현 모두 약화하지 않고 유지했습니다.
  doctrine_reference: 창 2:7; 전 3:20; 고전 15:47
