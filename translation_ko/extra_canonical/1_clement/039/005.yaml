  revision_rationale: 원문의 비교 강조(하늘조차 그러하다면, 진흙으로 된 집에 사는 이들은 더욱 그러함)를 한국어의 자연스러운 수사 의문으로 옮겼습니다. ‘같은 진흙’ 절의 주체를 우리 자신으로 바로잡고, 좀의 비유와 절들의 단순 병렬을 유지했습니다.
