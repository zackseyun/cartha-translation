revisions:
- from: 하늘들조차도 그분 앞에서는 깨끗하지 못합니다. 하물며 진흙집에 사는 자들은 말할 것도 없습니다. 그 진흙은 우리도 역시 같은 진흙으로 빚어진 것이기 때문입니다. 그분은 그들을 좀이 갉아먹듯 치시니, 아침부터 저녁까지 그들은 더 이상 존재하지 않습니다. 그들은 스스로를 도울 수 없었기에 멸망했습니다.[a]
  to: 하늘들조차 그분 앞에서는 깨끗하지 못합니다. 하물며 진흙으로 된 집에 사는 이들은 어떠하겠습니까? 우리 자신도 같은 진흙으로 이루어졌습니다. 그분은 좀이 하는 것처럼 그들을 치셨고, 아침부터 저녁까지 그들은 더 이상 존재하지 않게 됩니다. 그들은 스스로를 도울 수 없었기에 망했습니다.[a]
  rationale: 원문의 비교 강조(하늘조차 그러하다면, 진흙으로 된 집에 사는 이들은 더욱 그러함)를 한국어의 자연스러운 수사 의문으로 옮겼습니다. ‘같은 진흙’ 절의 주체를 우리 자신으로 바로잡고, 좀의 비유와 절들의 단순 병렬을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:50Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 반영했지만, ‘그 진흙은 우리도 ... 빚어진 것’은 원문의 관계절을 잘못 연결하여 진흙 자체가 빚어졌다는 뜻이 됩니다. 또한 원문의 접속 흐름과 ‘좀처럼’의 비유는 보다 직접적으로 유지하는 편이 안전합니다.
  naturalness: 현재 문안은 ‘그 진흙은 우리도 역시 같은 진흙으로 빚어진 것이기 때문입니다’가 문법적으로도 의미상으로도 부자연스럽습니다. 수정안은 현대 표준 한국어 합쇼체로 자연스럽게 정리했습니다.
  terminology: ‘하늘들’, ‘깨끗하지 못합니다’, ‘진흙으로 된 집’, ‘좀’은 원문의 이미지와 한국어 관용 사이에서 무난합니다. ‘멸망했습니다’ 대신 ‘망했습니다’를 사용해 ἀπώλοντο의 일반적 ‘파멸하다/망하다’를 과도하게 신학화하지 않았습니다.
  issues:
  - severity: high
    issue: 같은 진흙으로 빚어진 주체의 오류
    rationale: ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν은 거주자들, 곧 ‘우리 자신도 같은 진흙으로 이루어졌다’는 뜻입니다. 현 번역은 ‘그 진흙’이 빚어졌다고 하여 문법 관계와 의미가 바뀝니다.
  - severity: medium
    issue: 원문에 없는 인과 접속의 첨가
    rationale: ‘...이기 때문입니다’는 원문의 관계절을 이유절로 재구성합니다. 문장을 독립시켜 인간 역시 같은 진흙으로 이루어졌다는 진술을 보존하는 것이 더 충실합니다.
  - severity: low
    issue: ‘치시니’의 인과적 연결
    rationale: ἔπαισεν ... καὶ의 단순 연결은 ‘치셨고’가 더 가깝습니다. ‘치시니’는 뒤 절이 그 행위의 결과라는 인상을 더합니다.
