id: 1CLEM.39.5
reference: 1 Clement 39:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐρανοὺς δὲ οὐχὶ καθαρὴς ἐνώπιον αὐτοῦ· ἐὰ δὲ, οἱ κατοικοῦντες οἰκίας πηλίνας, ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμέν. ἔπαισεν αὐτοὺς σητὸς τρόπον, καὶ ἀπὸ πρωΐθεν ἕως ἑσπέρας οὐκ ἔτι εἰσίν· παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/005.yaml
  text: Even the heavens are not clean before him; how much less those who dwell in houses of clay[a], from the same clay of which we ourselves also are made. He struck them like a moth, and from morning until evening they are no more; because they are unable to help themselves, they perished.
  footnotes:
  - marker: a
    text: Or 'from which we ourselves also are from the same clay.'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘들조차도 그분 앞에서는 깨끗하지 못합니다. 하물며 진흙집에 사는 자들은 말할 것도 없습니다. 그 진흙은 우리도 역시 같은 진흙으로 빚어진 것이기 때문입니다. 그분은 그들을 좀이 갉아먹듯 치시니, 아침부터 저녁까지 그들은 더 이상 존재하지 않습니다. 그들은 스스로를 도울 수 없었기에 멸망했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανοὺς
  english_pob_choice: the heavens
  chosen_korean: 하늘들
  alternatives_korean:
  - 하늘
  - 하늘나라들
  lexicon: 하늘
  rationale: 복수형 하늘들을 살려 우주적 범위를 보이되, 한국어에서 자연스러운 표현으로 다듬었습니다.
- source_word: καθαρὴς ἐνώπιον αὐτοῦ
  english_pob_choice: are not clean before him
  chosen_korean: 그분 앞에서는 깨끗하지 못합니다
  alternatives_korean:
  - 그분 앞에서 부정하지 않습니다
  - 그분 앞에서는 정결하지 못합니다
  lexicon: 깨끗하다 / 정결하다
  rationale: 도덕적·의례적 ‘정결’보다 일반적 부정 상태를 가리키는 문맥이어서, 직역성이 있으면서도 현대 한국어로 자연한 ‘깨끗하지 못합니다’를 택했습니다.
- source_word: οἰκίας πηλίνας
  english_pob_choice: houses of clay
  chosen_korean: 진흙집
  alternatives_korean:
  - 토기집
  - 흙집
  lexicon: 진흙
  rationale: 인간의 덧없고 연약한 육체를 비유하는 원뜻을 살려, ‘clay’를 ‘진흙’으로 옮기고 결합 표현은 간결하게 처리했습니다.
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  english_pob_choice: from the same clay of which we ourselves also are made
  chosen_korean: 그 진흙은 우리도 역시 같은 진흙으로 빚어진 것이기 때문입니다
  alternatives_korean:
  - 우리도 같은 진흙에서 나왔기 때문입니다
  - 우리가 모두 그와 같은 진흙이기 때문입니다
  lexicon: 같은 진흙 / 빚어진
  rationale: POB의 수정된 의미를 반영해 같은 재료에서 빚어진 동일성을 드러내되, 한국어 문장으로는 ‘빚어진’이 형성·창조의 이미지를 가장 잘 전달합니다.
- source_word: ἔπαισεν αὐτοὺς σητὸς τρόπον
  english_pob_choice: He struck them like a moth
  chosen_korean: 그분은 그들을 좀이 갉아먹듯 치시니
  alternatives_korean:
  - 그분은 그들을 좀처럼 치시니
  - 그분은 그들을 나방처럼 치시니
  lexicon: 좀
  rationale: σητός는 ‘옷좀/좀벌레’ 계열의 작은 해충 이미지를 가리키므로, 단순한 나방보다 ‘좀이 갉아먹다’가 파괴의 뉘앙스를 더 분명히 드러냅니다.
theological_decisions:
- issue: 인간의 비천함을 ‘깨끗하지 못함’과 ‘진흙집’으로 병치하는 방식
  chosen_reading: 하늘조차도 하나님 앞에서 깨끗하지 못하며, 사람은 진흙집에 사는 존재라는 대비를 그대로 유지했습니다.
  alternative_readings:
  - 정결하지 못합니다로 더 의례적으로 옮김
  - 몸을 ‘흙집’으로 완화하여 번역
  rationale: 문맥은 천상조차 하나님의 절대적 기준 아래 부족하며, 인간은 본질적으로 연약하다는 점을 강조하므로 이 긴장을 약화하지 않았습니다.
  doctrine_reference: 창조론적 인간 이해, 하나님의 절대 거룩하심
- issue: ‘스스로를 도울 수 없었기에’의 인과 구조
  chosen_reading: 무력함 때문에 멸망했다는 인과를 그대로 살렸습니다.
  alternative_readings:
  - 자구책을 찾지 못해서
  - 그들이 도움을 받지 못해서
  rationale: 그들의 파멸 원인을 외부 결핍이 아니라 자기 무능으로 제시하는 원문의 논리를 유지했습니다.
  doctrine_reference: 인간의 자기구원 불가능성
