  rationale: 조건절 전체의 주어를 주님으로 분명히 하여 원문의 욥기 인용 논증을 회복했습니다. 두 수사 의문문을 유지했고, βροτός의 필멸성 및 ἄμεμπτος의 무흠성을 자연스러운 합쇼체로 반영했습니다. παίδων과 κατὰ의 해석 범위는 각주에 남겨 본문의 단정성을 피했습니다.
  reviewer_model: gpt-5.6-terra
