- from: 그러면 어떻게 되겠습니까? 죽을 수밖에 없는 사람이 주 앞에서 깨끗하겠습니까? 아니면 자기 행위 때문에 흠 없다고 할 수 있겠습니까? 그가 자기 자녀들도 믿지 않는데, 자기 천사들에 대해서는 무엇인가 비뚤어진 것을 생각해 냈습니다.[a]
