id: 1CLEM.39.4
reference: 1 Clement 39:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί γάρ; μὴ καθαρὸς ἔσται βροτὸς ἐναντί κυρίου; ἢ ἀπὸ τῶν ἔργων αὐτοῦ ἄμεμπτος ἀνήρ, εἰ κατὰ παίδων αὐτοῦ οὐ πιστεύει, κατὰ δὲ ἀγγέλων αὐτοῦ σκολιὸν τι ἐπενόησεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/004.yaml
  text: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless because of his works[a], if he does not trust his children, and has conceived something crooked against his angels?
  footnotes:
  - marker: a
    text: Or 'if he does not trust even his own servants, and has perceived something crooked even in his angels?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 어떻게 되겠습니까? 죽을 수밖에 없는 사람이 주 앞에서 깨끗하겠습니까? 아니면 자기 행위 때문에 흠 없다고 할 수 있겠습니까? 그가 자기 자녀들도 믿지 않는데, 자기 천사들에 대해서는 무엇인가 비뚤어진 것을 생각해 냈습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βροτὸς
  english_pob_choice: a mortal
  chosen_korean: 죽을 수밖에 없는 사람
  alternatives_korean:
  - 인간
  - 필멸의 사람
  - 죽을 존재
  lexicon: βροτός
  rationale: βροτός는 단순한 '사람'보다 죽을 운명을 지닌 존재를 가리키므로, 문맥의 대조를 살려 '죽을 수밖에 없는 사람'으로 풀었습니다.
- source_word: ἐναντί κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 주께 대하여
  - 야훼 앞에서
  lexicon: ἐναντί
  rationale: 전치사적 표현을 자연스럽게 '주 앞에서'로 옮겼고, 여기서 κύριος는 직접 인용문 안의 신적 칭호이지만 한국어 본문은 문맥상 '주'가 가장 간결합니다.
- source_word: ἄμεμπτος
  english_pob_choice: blameless
  chosen_korean: 흠 없다고
  alternatives_korean:
  - 책망할 것이 없다고
  - 비난받지 않겠습니까
  - 책망 없다고
  lexicon: ἄμεμπτος
  rationale: 도덕적·법정적 무결함을 함께 담기 위해 '흠 없다고'를 택했습니다.
- source_word: παιδίων
  english_pob_choice: his children
  chosen_korean: 자기 자녀들
  alternatives_korean:
  - 자기 아이들
  - 자기 종들
  - 자기 하인들
  lexicon: παίδων
  rationale: 직전 영어 전통 번역의 'servants'는 개정에서 폐기되었고, 원문 παίδων은 'children'이 더 직접적이므로 '자기 자녀들'로 옮겼습니다.
- source_word: ἐπενόησεν
  english_pob_choice: has conceived
  chosen_korean: 생각해 냈습니다
  alternatives_korean:
  - 궁리했습니다
  - 상상했습니다
  - 마음먹었습니다
  lexicon: ἐπενόησεν
  rationale: 이 동사는 단순 지각이 아니라 마음속에 꾸며 내는 행위를 가리키므로, '생각해 냈습니다'로 소리 나는 내적 구상을 살렸습니다.
theological_decisions:
- issue: 구절 전체의 질문 형식과 논증 흐름
  chosen_reading: 수사적 질문들을 그대로 살려, 인간의 청결/흠없음 가능성을 하나님의 기준 아래에서 부정하는 논증으로 읽었습니다.
  alternative_readings:
  - 서술문처럼 평이하게 다듬는 읽기
  - 도덕 훈계 문장으로 완화하는 읽기
  rationale: 이 구절은 욥기 인용의 수사적 장치가 핵심이므로, 질문형을 유지해야 대조와 논박의 힘이 보존됩니다.
  doctrine_reference: 욥 4:17-18 인용 맥락; 인간의 의로움에 대한 제한적 평가
