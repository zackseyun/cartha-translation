base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/007.yaml
  text: But call out[a], if anyone will answer you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the one gone astray to death.
  footnotes:
  - marker: a
    text: Or 'if you will see'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 외쳐 보십시오. 누가 당신에게 응답하겠습니까? 또 거룩한 천사들 가운데 누구를 보겠습니까? 분노는 어리석은 사람을 죽이고, 질투는 길을 잃은 사람을 죽입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικάλεσαι
  english_pob_choice: call out
  chosen_korean: 외치십시오
  alternatives_korean:
  - 부르십시오
  - 호소하십시오
  lexicon: ἐπικαλέω
  rationale: 단순한 ‘부르다’보다 큰 소리로 상대의 응답을 요구하는 뜻을 살려, 문맥상 가장 자연스러운 명령형으로 ‘외치십시오’를 택했습니다.
- source_word: ὑπακούσεται
  english_pob_choice: answer you
  chosen_korean: 대답하면
  alternatives_korean:
  - 응답하면
  - 들으면
  lexicon: ὑπακούω
  rationale: 이 구절에서는 ‘순종하다’보다 ‘응답하다/대답하다’의 뜻이 더 적절하므로, 한국어에서는 관계에 맞는 자연스러운 ‘대답하면’으로 옮겼습니다.
- source_word: ἁγίων ἀγγέλων
  english_pob_choice: holy angels
  chosen_korean: 거룩한 천사들
  alternatives_korean:
  - 성스러운 천사들
  - 성도들의 천사들
  lexicon: ἅγιος + ἄγγελος
  rationale: ἅγιος의 기본적 의미를 살려 ‘거룩한’으로 옮기고, 천사의 복수성을 분명히 하기 위해 복수형을 반영했습니다.
- source_word: ἀναιρεῖ / θανατοῖ
  english_pob_choice: kills / puts ... to death
  chosen_korean: 죽이고 / 죽음에 이르게 하기
  alternatives_korean:
  - 죽입니다 / 죽게 합니다
  - 생명을 앗아갑니다
  lexicon: ἀναιρέω / θανατόω
  rationale: 두 동사의 반복적·강조적 병렬을 살려 각각 ‘죽이고’와 ‘죽음에 이르게 하기’로 구분해 번역했습니다.
theological_decisions:
- issue: 분노와 질투의 인과 관계를 어떻게 표현할지
  chosen_reading: 분노는 어리석은 사람을 죽이고, 질투는 길을 잃은 사람을 죽음에 이르게 합니다
  alternative_readings:
  - 분노가 어리석은 사람을 죽입니다, 질투가 길을 잃은 사람을 죽음에 이르게 합니다
  - 분노는 어리석은 이를 죽이고, 질투는 그릇된 이를 죽게 합니다
  rationale: 헬라어의 병렬 경고를 그대로 살려 두 악덕이 각각 다른 대상을 파멸로 이끈다는 점을 분명히 했습니다.
  doctrine_reference: 윤리적 경고의 병렬 구조 보존
