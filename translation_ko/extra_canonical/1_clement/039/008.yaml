  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐγὼ δὲ ἑώρακα ἄφρονας ῥίζας βάλλοντας, ἀλλʼ εὐθέως ἐβρώθη αὐτῶν ἡ δίαιτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039/008.yaml
  text: But I have seen fools taking root, yet immediately their dwelling was consumed.
translation:
  language: ko
  text: 그러나 저는 어리석은 자들이 뿌리를 내리는 것을 보았지만, 곧바로 그들의 거처가 삼켜졌습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ
  english_pob_choice: But I have seen
  chosen_korean: 그러나 저는 … 보았지만
  alternatives_korean:
  - 그런데 저는 … 보았습니다
  - 하지만 저는 … 보았습니다
  lexicon: δὲ
  rationale: δὲ는 앞 문맥에 대한 전환을 나타내므로, 단순한 나열보다 역접/전환 느낌이 살아 있는 ‘그러나’로 옮겼습니다.
- source_word: ἄφρονας
  english_pob_choice: fools
  chosen_korean: 어리석은 자들
  alternatives_korean:
  - 바보들
  - 미련한 자들
  lexicon: ἄφρων
  rationale: 직설적 조롱보다 원문의 평가적 뉘앙스를 살리면서도 현대 합쇼체에 맞는 ‘어리석은 자들’로 옮겼습니다.
- source_word: ῥίζας βάλλοντας
  english_pob_choice: taking root
  chosen_korean: 뿌리를 내리는
  alternatives_korean:
  - 뿌리를 뻗는
  - 뿌리를 심는
  lexicon: ῥίζα + βάλλω
  rationale: 직역상 ‘뿌리를 던지다’이지만 관용적으로 ‘뿌리를 내리다’가 원문의 생장 이미지를 가장 자연스럽게 전달합니다.
- source_word: δίαιτα
  english_pob_choice: dwelling
  chosen_korean: 거처
  alternatives_korean:
  - 생활
  - 살림집
  - 식생활
  lexicon: δίαιτα
  rationale: δίαιτα는 본래 삶의 방식/생활을 가리킬 수 있으나 여기서는 ‘삼켜졌다’와 결합해 실질적 삶의 터전이나 거주지를 가리키는 것으로 보아 ‘거처’로 옮겼습니다.
theological_decisions:
- issue: '''their dwelling was consumed''의 의미 범위'
  chosen_reading: ‘그들의 거처가 삼켜졌습니다’로 옮겨, 단순한 소멸이 아니라 예기치 않은 심판적 파괴의 이미지를 살렸습니다.
  alternative_readings:
  - ‘그들의 거처가 불타 버렸습니다’
  - ‘그들의 삶이 삼켜졌습니다’
  rationale: ἐβρώθη는 ‘먹히다/삼켜지다’의 수동형으로, 주어를 잃게 하는 급작스러운 파괴의 이미지를 강하게 담습니다. ‘거처’는 δίαιτα의 문맥상 가장 무난한 구체화입니다.
  doctrine_reference: 심판적 전복 이미지의 보존
- issue: ‘뿌리를 내리는’과 이후 ‘삼켜짐’의 대비
  chosen_reading: 성공적으로 정착하는 것처럼 보이던 악인의 상태가 즉시 붕괴되는 대비를 유지했습니다.
  alternative_readings:
  - ‘뿌리를 내렸으나’
  - ‘자라났으나’
  rationale: 원문은 단순한 성장 묘사가 아니라 일시적 번영과 갑작스러운 소멸의 대조를 이루므로, 이 긴장을 약화시키지 않도록 처리했습니다.
  doctrine_reference: 의인/악인의 대조라는 문맥적 신학
