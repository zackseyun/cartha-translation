revisions:
- from: 그러나 저는 어리석은 자들이 뿌리를 내리는 것을 보았지만, 곧바로 그들의 거처가 삼켜졌습니다.[a][b]
  to: 그러나 저는 어리석은 자들이 뿌리를 내리는 것을 보았습니다. 하지만 그들의 거처는 곧바로 휩쓸려 사라졌습니다.
  rationale: 첫 절의 δὲ는 ‘그러나’로, 둘째 절의 ἀλλʼ는 ‘하지만’으로 각각 반영하여 대조를 분명히 했습니다. 완료형 ἑώρακα는 자연스러운 과거 경험 진술로 옮겼습니다. ‘휩쓸려 사라졌습니다’는 ἐβρώθη의 갑작스러운 수동적 파괴를 한국어 관용에 맞게 나타내며, 원문에 없는 파괴 주체나 수단은 보태지 않았습니다. 대응 각주가 없는 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
