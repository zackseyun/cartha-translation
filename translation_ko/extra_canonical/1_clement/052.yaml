base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052.yaml
  text: The Master of all is without need[a], brothers; he has need of nothing except that confession be made to him. For the chosen David says, “I will confess to the Lord, and it will please him more than a young bull bringing forth horns and hoofs. Let the poor see and be glad.” And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you[c][b], and you will glorify me.” For a sacrifice to God is a broken spirit.
  footnotes:
  - marker: a
    text: Or 'thanksgiving be offered to him' or 'praise be made to him'; the Greek verb can carry the sense of confession, acknowledgment, thanksgiving, or praise in biblical usage.
    reason: lexical_alternative
  - marker: b
    text: The quotations in this chapter draw on Psalmic language, especially Psalm 68:31(32 LXX) and Psalm 49:14-15, 19(50:14-15, 17 MT/LXX numbering differs).
    reason: cross_reference
  - marker: c
    text: Or 'bringing forth horns and hoofs'.
    reason: previous_rendering
translation:
  language: ko
  text: 만물의 주인은 아무것도 필요로 하지 않으십니다, 형제자매 여러분. 그분께는 오직 그분께 감사를 드리는 것만이 필요합니다. 선택받은 다윗이 말합니다. 「내가 주님께 감사드리겠습니다. 그것이 뿔과 굽을 내밀고 있는 어린 수소보다 그분을 더 기쁘시게 할 것입니다. 가난한 이들은 보고 기뻐하십시오.」 그리고 또 말합니다. 「하나님께 제사로 찬양의 제사를 드리고, 가장 높으신 분께 드린 서원들을 갚으십시오. 그리고 고난의 날에 나를 부르십시오. 내가 당신을 건져내고, 당신은 나를 영화롭게 할 것입니다.」 하나님께 드리는 제사는 상한 영입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπροσδεής
  english_pob_choice: without need
  chosen_korean: 아무것도 필요로 하지 않으십니다
  alternatives_korean:
  - 필요가 없으십니다
  - 무엇 하나 필요하지 않으십니다
  lexicon: LSJ
  rationale: Ἀπροσδεής는 ‘필요가 없음/부족함이 없음’의 뜻이므로, 현대 한국어에서 자연스럽고 단정한 ‘아무것도 필요로 하지 않으십니다’로 옮겨 무결핍성을 분명히 했습니다.
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 지배자
  - 소유주
  lexicon: LSJ
  rationale: 본문은 κύριος가 아니라 δεσπότης를 쓰므로, 호칭적 ‘주님’보다 권위와 소유 관계를 드러내는 ‘주인’이 어휘 구분을 살리기에 적합합니다.
- source_word: ἐξομολογεῖσθαι
  english_pob_choice: that confession be made to him
  chosen_korean: 그분께 감사를 드리는 것
  alternatives_korean:
  - 그분께 고백하는 것
  - 그분께 인정하는 것
  - 그분께 찬양하는 것
  lexicon: LSJ
  rationale: 이 동사는 고백, 인정, 감사, 찬양을 모두 포괄할 수 있으며, 인용된 시편 문맥상 감사와 공적 찬양이 함께 살아 있습니다. 한국어에서는 독자에게 가장 직접적인 예배 행위인 ‘감사를 드리는 것’으로 넓게 받았습니다.
- source_word: κέρατα ἐκφέροντα καὶ ὁπλάς
  english_pob_choice: bringing forth horns and hoofs
  chosen_korean: 뿔과 굽을 내밀고 있는
  alternatives_korean:
  - 뿔과 굽을 지니고 있는
  - 뿔과 굽이 솟아나는
  - 뿔과 굽을 자라고 있는
  lexicon: LSJ
  rationale: ἐκφέροντα는 여기서 짐승의 신체 특징이 ‘나오다/내밀리다’는 생장상을 가리키므로, ‘내밀고 있는’이 원문의 생동감을 유지하면서도 ‘낳다’는 뉘앙스를 피합니다.
- source_word: πνεῦμα συντετριμμένον
  english_pob_choice: a broken spirit
  chosen_korean: 상한 영
  alternatives_korean:
  - 깨어진 영
  - 통회하는 영
  - 부서진 영
  lexicon: LSJ
  rationale: 시편적 어법을 살리되, συντετριμμένον의 파괴/분쇄 이미지를 너무 해석적으로 바꾸지 않기 위해 ‘상한 영’을 택했습니다. 여기서는 ‘성령’이 아니라 사람의 내적 영을 가리킵니다.
theological_decisions:
- issue: δεσπότης와 κύριος의 구분
  chosen_reading: 첫 절의 δεσπότης는 ‘주인’으로, 인용문 속 κύριος는 ‘주님’으로 구별하여 옮겼습니다.
  alternative_readings:
  - 모두 ‘주님’으로 통일
  - 모두 ‘주’로 번역
  rationale: 원문은 서술부의 δεσπότης와 시편 인용의 κύριος를 구별하므로, 한국어에서도 동일한 호칭으로 평준화하지 않고 원문 대조가 보이도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; consistency of key terms, or documented exception.'
- issue: ἐξομολογεῖσθαι의 의미 범위
  chosen_reading: 감사와 공적 찬양을 포함하는 ‘감사를 드리는 것’으로 처리했습니다.
  alternative_readings:
  - 고백하는 것
  - 찬양하는 것
  - 감사와 찬양을 드리는 것
  rationale: 본문과 뒤따르는 시편 인용은 하나님 앞의 인정과 예배를 가리키므로, 단일어로 좁히기보다 감사 행위를 중심으로 넓게 포괄하는 번역이 문맥에 더 잘 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.'
