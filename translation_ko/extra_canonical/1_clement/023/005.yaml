id: 1CLEM.23.5
reference: 1 Clement 23:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας ταχὺ καὶ ἐξαίφνης τελειωθήσεται τὸ θέλημα αὐτοῦ, συνεπιμαρτυρούσης καὶ τῆς γραφῆς, ὅτι ταχὺ ἥξει καὶ οὐ χρονιεῖ, καὶ ἐξαίφνης ἥξει ὁ κύριος εἰς τὸν ναὸν αὐτοῦ, καὶ ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/005.yaml
  text: Truly, his will shall be accomplished quickly and suddenly, as the Scripture also bears witness, saying, “Quickly he will come and will not delay,” and, “Suddenly the Lord will come to his temple, even the Holy One whom you expect.”
translation:
  language: ko
  text: 참으로 그의 뜻은 속히, 갑자기 이루어질 것입니다. 성경도 이를 증언하며 이렇게 말합니다. “속히 그가 오실 것이며 지체하지 않으실 것입니다.” 그리고 “갑자기 주께서 그의 성전으로 오실 것이며, 곧 너희가 기다리는 거룩하신 이입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “속히 그가 오실 것이며 지체하지 않으실 것입니다”는 하박국 2:3을 반영한 인용입니다. 이 절의 표현은 칠십인역 본문과 정확히 일치하지 않습니다.
    reason: 첫 인용의 성경적 배경을 밝히되, 1클레멘트의 인용 형태를 정경 본문과 동일시하지 않도록 합니다.
  - marker: b
    text: “갑자기 주께서 그의 성전으로 오실 것이며”라는 표현은 말라기 3:1을 반영합니다. 이어지는 “너희가 기다리는 거룩하신 이”는 이 편지의 현존 그리스어 본문에 따른 표현입니다.
    reason: 둘째 인용의 성경적 배경과 현존 1클레멘트 본문의 독특한 표현을 구별하여 제시합니다.
lexical_decisions:
- source_word: ἐπ’ ἀληθείας / ταχὺ καὶ ἐξαίφνης
  english_pob_choice: Truly ... quickly and suddenly
  chosen_korean: 참으로 ... 속히, 갑자기
  alternatives_korean:
  - 진실로 ... 빨리, 갑자기
  - 참으로 ... 신속히, 갑자기
  lexicon: ἐπ’ ἀληθείας; ταχὺ; ἐξαίφνης
  rationale: 서두의 확언을 ‘참으로’로 살리고, 두 부사는 시간의 급박함과 돌발성을 함께 드러내도록 ‘속히, 갑자기’로 옮겼습니다.
- source_word: τελειωθήσεται τὸ θέλημα αὐτοῦ
  english_pob_choice: his will shall be accomplished
  chosen_korean: 그의 뜻은 ... 이루어질 것입니다
  alternatives_korean:
  - 그의 뜻은 ... 완성될 것입니다
  - 그의 뜻은 ... 성취될 것입니다
  lexicon: τελειόω; θέλημα
  rationale: θέλημα는 단순한 ‘의지’보다 문맥상 ‘뜻’이 자연스럽고, τελειωθήσεται는 종결·완성을 포함하므로 ‘이루어지다’로 과도한 신학적 해석 없이 표현했습니다.
- source_word: ἡ γραφή ... ὅτι ... καὶ ... καὶ ...
  english_pob_choice: the Scripture also bears witness, saying, ... and, ...
  chosen_korean: 성경도 또한 이를 증언하여 이르기를, ... 그리고 ...라고 합니다
  alternatives_korean:
  - 성경도 또한 이를 증언하여 말하기를, ... 그리고 ...라고 합니다
  - 성경도 또한 이를 증언합니다. ... 그리고 ...
  lexicon: ἡ γραφή; συνεπιμαρτυρούσης
  rationale: γραφή를 일반화하지 않고 ‘성경’으로 번역해 권위를 유지했고, συνεπιμαρτυρούσης는 ‘함께 증언하다’의 의미를 살려 ‘이를 증언하여’로 처리했습니다.
- source_word: ὁ κύριος ... ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε
  english_pob_choice: the Lord ... even the Holy One whom you expect
  chosen_korean: 주께서 ... 곧 너희가 기다리는 거룩하신 이
  alternatives_korean:
  - 주님께서 ... 곧 너희가 기대하는 거룩하신 분
  - 주께서 ... 곧 너희가 기다리는 성자
  lexicon: κύριος; ὁ ἅγιος; προσδοκάω
  rationale: 원문은 야훼 인용의 성격을 갖는 예언적 문맥이지만, 1 Clement의 인용 구조를 해치지 않도록 본문에서는 ‘주’로 두고, ὁ ἅγιος는 칭호의 선명함을 살려 ‘거룩하신 이’로 옮겼습니다.
theological_decisions:
- issue: 성경 인용의 연결 방식과 이중 인용의 보존
  chosen_reading: 본문이 스스로 성경의 증언을 호출한 뒤 두 개의 인용을 병렬로 제시하는 구조를 그대로 살렸습니다.
  alternative_readings:
  - 한 문장으로 매끈하게 합쳐 번역하는 방식
  - 두 인용 사이의 연결어를 약화시키는 방식
  rationale: 저자는 ‘성경도 또한 이를 증언한다’는 방식으로 예언의 권위를 세우며, 두 인용의 병렬성과 긴장감을 유지하는 것이 문장 구조상 중요합니다.
  doctrine_reference: 성경 증언의 자기해석적 권위
