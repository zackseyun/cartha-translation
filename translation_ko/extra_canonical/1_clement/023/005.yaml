revisions:
- from: 참으로 그의 뜻은 속히, 갑자기 이루어질 것입니다. 성경도 또한 이를 증언하여 이르기를, 「“속히 그가 오실 것이며 지체하지 않으실 것이다.”」 그리고 「“갑자기 주께서 그의 성전으로 오실 것이며, 곧 너희가 기다리는 거룩하신 이가 오실 것이다.”」라고 합니다.[a][b]
  to: 참으로 그의 뜻은 속히, 갑자기 이루어질 것입니다. 성경도 이를 증언하며 이렇게 말합니다. “속히 그가 오실 것이며 지체하지 않으실 것입니다.” 그리고 “갑자기 주께서 그의 성전으로 오실 것이며, 곧 너희가 기다리는 거룩하신 이입니다.”[a][b]
  rationale: The revision removes the unsupported second coming verb, presents ‘the Holy One whom you expect’ as an appositional identification of the Lord, repairs quotation structure, and uses natural modern formal-polite Korean. The footnotes identify the biblical echoes without claiming exact verbal identity where the patristic citation differs from the standard canonical wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:48Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the affirmation, the rapid and sudden accomplishment of God's will, and the two-scripture-witness structure. However, its second quotation adds a second finite verb ('거룩하신 이가 오실 것이다') that is not present in Greek. ὁ ἅγιος, ὃν ὑμεῖς προσδοκᾶτε is appositional to 'the Lord' ('namely/even the Holy One whom you expect').
  naturalness: The nested Korean and Western quotation marks are malformed and interrupt reading. '성경도 또한' is slightly redundant, and a direct quotation introduction is more natural as '성경도 이를 증언하며 이렇게 말합니다.'
  terminology: ‘뜻,’ ‘성경,’ ‘주,’ ‘성전,’ and ‘거룩하신 이’ are suitable formal Korean renderings. ‘거룩하신 이’ should remain an appositional title without supplying an additional coming clause.
  issues:
  - severity: high
    issue: The second citation supplies an extra predicate.
    rationale: The Greek reads 'and suddenly the Lord will come to his temple, and the Holy One whom you expect.' The latter noun phrase identifies or further describes the Lord; it does not say separately that the Holy One will come.
  - severity: medium
    issue: Quotation punctuation is structurally malformed.
    rationale: The text uses Korean quotation marks containing unmatched doubled Western quotation marks, making the two cited statements unclear.
  - severity: low
    issue: Citation introduction is unnecessarily repetitive and somewhat stiff.
    rationale: ‘성경도 또한 이를 증언하여 이르기를’ can be rendered more naturally while preserving συνεπιμαρτυρούσης ('also bearing witness').
  revised_text: 참으로 그의 뜻은 속히, 갑자기 이루어질 것입니다. 성경도 이를 증언하며 이렇게 말합니다. “속히 그가 오실 것이며 지체하지 않으실 것입니다.” 그리고 “갑자기 주께서 그의 성전으로 오실 것이며, 곧 너희가 기다리는 거룩하신 이입니다.”[a][b]
