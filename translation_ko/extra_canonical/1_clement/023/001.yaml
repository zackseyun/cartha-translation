id: 1CLEM.23.1
reference: 1 Clement 23:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατὴρ ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν, ἠπίως τε καὶ προσηνῶς τὰς χάριτας αὐτοῦ ἀποδίδοι τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/001.yaml
  text: The compassionate and altogether beneficent Father has tender affections for those who fear him, and gently and kindly gives his gracious gifts to those who come to him with a single-minded heart.
translation:
  language: ko
  text: 자비로우시고 모든 면에서 선을 베푸시는 아버지께서는 자기를 두려워하는 이들에게 너그러우신 마음을 지니시며, 단순한 마음으로 그에게 나아오는 이들에게는 그분의 은혜를 부드럽고 친절하게 베푸십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ οἰκτίρμων κατὰ πάντα καὶ εὐεργετικὸς πατήρ
  english_pob_choice: The compassionate and altogether beneficent Father
  chosen_korean: 자비로우시고 모든 면에서 선을 베푸시는 아버지
  alternatives_korean:
  - 긍휼이 많으시고 모든 면에서 은혜로운 아버지
  - 불쌍히 여기시며 전적으로 선을 행하시는 아버지
  lexicon: οἰκτίρμων, εὐεργετικός, πατήρ
  rationale: οἰκτίρμων은 단순한 감정이 아니라 자비를 베푸는 성격을 가리키므로 ‘자비로우시고’로 옮겼고, εὐεργετικός은 ‘유익한’보다 행위의 선함이 드러나도록 ‘선을 베푸시는’으로 풀었습니다.
- source_word: ἔχει σπλάγχνα ἐπὶ τοὺς φοβουμένους αὐτόν
  english_pob_choice: has tender affections for those who fear him
  chosen_korean: 자기를 두려워하는 이들에게 너그러우신 마음을 지니시며
  alternatives_korean:
  - 그를 두려워하는 이들에게 부드러운 심정을 품으시며
  - 그분을 경외하는 이들을 향해 깊은 긍휼을 가지시며
  lexicon: σπλάγχνα, φοβούμενοι
  rationale: σπλάγχνα는 문자적으로 ‘내장’이지만 정서적 애정을 뜻하므로 한국어 관용을 살려 ‘마음’으로 처리했고, φοβέομαι는 여기서 공포보다 경외의 두려움을 포함하므로 ‘두려워하는 이들’로 유지했습니다.
- source_word: ἠπίως τε καὶ προσηνῶς ... ἀποδίδοι
  english_pob_choice: gently and kindly gives
  chosen_korean: 부드럽고 친절하게 베푸십니다
  alternatives_korean:
  - 온화하고 다정하게 주십니다
  - 다정하고 온유하게 돌려주십니다
  lexicon: ἠπίως, προσηνῶς, ἀποδίδωμι
  rationale: 두 부사는 태도의 온화함을 중첩해 강조하므로 ‘부드럽고 친절하게’로 자연스럽게 살렸고, ἀποδίδωμι는 문맥상 ‘돌려주다’보다 은혜를 ‘베푸시다’가 의미를 더 잘 드러냅니다.
- source_word: τοῖς προσερχομένοις αὐτῷ ἁπλῇ διανοίᾳ
  english_pob_choice: to those who come to him with a single-minded heart
  chosen_korean: 단순한 마음으로 그에게 나아오는 이들에게
  alternatives_korean:
  - 순전한 마음으로 그분께 나아오는 이들에게
  - 한결같은 마음으로 그에게 가까이 오는 이들에게
  lexicon: προσερχόμενοι, ἁπλῇ διανοίᾳ
  rationale: προσερχόμενοι는 ‘다가오다/나아오다’의 예배적 뉘앙스가 있어 ‘나아오는’으로 옮겼고, ἁπλῇ διανοίᾳ는 분열되지 않은 내면을 뜻하므로 POB의 ‘single-minded heart’를 반영해 ‘단순한 마음’으로 번역했습니다.
theological_decisions:
- issue: φοβουμένους αὐτόν의 번역상 두려움과 경외의 긴장
  chosen_reading: ‘자기를 두려워하는 이들’로 옮겨 경외를 포함한 두려움의 긴장을 유지했습니다.
  alternative_readings:
  - ‘그분을 경외하는 이들’로 완화해 표현
  - ‘그분을 두려워하며 섬기는 이들’로 풀어 설명
  rationale: 본문은 하나님 앞의 경외를 긍정적으로 말하지만, 단순히 ‘경외하다’로만 고정하면 φοβέομαι가 가진 엄중함이 약해질 수 있어 원문의 긴장을 보존했습니다.
  doctrine_reference: 하나님 경외
- issue: 하나님의 은혜를 주는 방식의 인격적 표현
  chosen_reading: ‘그분의 은혜를 부드럽고 친절하게 베푸십니다’로, 은혜의 선물성과 인격적 배려를 함께 드러냈습니다.
  alternative_readings:
  - ‘그분의 은혜를 주십니다’로 간단히 처리
  - ‘그분의 친절한 선물을 주십니다’로 의미를 풀어 옮김
  rationale: ἀποδίδωμι와 χάριτες의 결합은 단순 전달보다 호의의 적극적 부여를 시사하므로, 한국어에서 자연스러운 동시에 주체적 베풂을 드러내는 표현을 선택했습니다.
  doctrine_reference: 은혜
