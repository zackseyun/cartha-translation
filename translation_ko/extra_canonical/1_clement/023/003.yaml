- from: 이 성경 구절이 우리에게서 멀리 있게 하십시오[a]. 「마음이 갈라진 사람들은, 자기 영혼 안에서 의심하는 사람들은 불쌍합니다. 그들은 ‘이런 일들은 우리 조상들의 때에도 들었습니다. 보십시오, 우리는 늙어 가는데도 이런 일 가운데 아무것도 우리에게 일어나지 않았습니다’라고 말합니다」.
  to: '이 성경 말씀이 우리에게서 멀리 떠나가게 하소서[a]. 성경은 이렇게 말합니다: 「두 마음을 품은 사람들, 마음속으로 의심하는 사람들은 비참합니다. 그들은 ‘우리는 우리 조상들의 시대에도 이런 일들을 들었습니다. 보십시오, 우리는 늙어 가는데도 이런 일은 하나도 우리에게 일어나지 않았습니다’라고 말합니다.」'
  rationale: 3인칭 명령법의 소망적 배제, ταλαίπωροι의 강한 비참함, δίψυχοι의 이중성을 더 정확히 반영하고, 인용문의 한국어 문장 구조와 부정 표현을 자연스럽게 다듬었습니다. διατάζοντες의 해석상 불확실성은 영어 POB의 ‘doubt’를 따라 ‘의심하는’으로 유지했습니다.
