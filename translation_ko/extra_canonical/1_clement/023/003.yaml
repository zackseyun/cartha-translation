id: 1CLEM.23.3
reference: 1 Clement 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πόρρω γενέσθω ἀφ’ ἡμῶν ἡ γραφὴ αὕτη, ὅπου λέγει· Ταλαίπωροί εἰσιν οἱ δίψυχοι, οἱ διατάζοντες τῇ ψυχῇ, οἱ λέγοντες· Ταῦτα ἠκούσαμεν καὶ ἐπὶ τῶν πατέρων ἡμῶν, καὶ ἰδοὺ, γηράσκομεν, καὶ οὐδὲν ἡμῖν τούτων συνέβηκεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/003.yaml
  text: Let this scripture be far from us[a], where it says, “Wretched are the double-minded, those who doubt in their soul, who say, ‘These things we heard even in the days of our fathers, and behold, we have grown old, and none of these things has happened to us.’”
  footnotes:
  - marker: a
    text: Or 'Far be from us this scripture'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 성경 구절이 우리에게서 멀리 있게 하십시오[a]. 「마음이 갈라진 사람들은, 자기 영혼 안에서 의심하는 사람들은 불쌍합니다. 그들은 ‘이런 일들은 우리 조상들의 때에도 들었습니다. 보십시오, 우리는 늙어 가는데도 이런 일 가운데 아무것도 우리에게 일어나지 않았습니다’라고 말합니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρρω γενέσθω ἀφ’ ἡμῶν
  english_pob_choice: Let this scripture be far from us
  chosen_korean: 이 성경 구절이 우리에게서 멀리 있게 하십시오
  alternatives_korean:
  - 이 성경 구절을 우리에게서 멀리 두십시오
  - 이 성경 구절이 우리에게서 멀리 있게 하소서
  lexicon: γενέσθω / πόρρω ἀπό
  rationale: ἡ γραφὴ αὕτη를 단순히 ‘성경’이 아니라 문맥상 인용되는 ‘성경 구절’로 살리면서, γενέσθω의 명령적 뉘앙스를 한국어의 합쇼체 청유·명령으로 자연스럽게 옮겼습니다.
- source_word: οἱ δίψυχοι
  english_pob_choice: the double-minded
  chosen_korean: 마음이 갈라진 사람들
  alternatives_korean:
  - 두 마음을 품은 사람들
  - 양심이 갈라진 사람들
  lexicon: δίψυχος
  rationale: ‘double-minded’의 관용적 뜻을 따르되, ‘두 마음’보다 내적 분열이 더 분명하게 드러나도록 ‘마음이 갈라진’으로 옮겼습니다.
- source_word: οἱ διατάζοντες τῇ ψυχῇ
  english_pob_choice: those who doubt in their soul
  chosen_korean: 자기 영혼 안에서 의심하는 사람들
  alternatives_korean:
  - 자기 영혼을 흔드는 사람들
  - 마음속에서 흔들리는 사람들
  lexicon: διατάσσω / ψυχή
  rationale: POB의 해석을 따라 ‘waver’가 아니라 ‘doubt’의 의미를 반영하되, ψυχή를 ‘영혼’으로 직접 살려 내적 차원의 흔들림을 분명히 했습니다.
- source_word: Ταλαίπωροί εἰσιν
  english_pob_choice: Wretched are
  chosen_korean: 불쌍합니다
  alternatives_korean:
  - 비참합니다
  - 고통스럽습니다
  lexicon: ταλαίπωρος
  rationale: 원문은 강한 불행·비참함을 나타내지만, 한국어 문맥에서 직설적 비난보다 예언적 탄식에 가까운 뉘앙스를 살려 ‘불쌍합니다’로 옮겼습니다.
theological_decisions:
- issue: 인용문의 시작과 종결을 한국어에서 어떻게 처리할지
  chosen_reading: 본문 안에 「 」로 직접 인용을 두고, 서두의 권면적 선언과 내부 인용을 분리했습니다.
  alternative_readings:
  - 모든 문장을 한 문장으로 직역해 인용부호 없이 처리
  - ‘성경 구절’과 인용문을 더 강하게 분리해 두 문장으로 나누기
  rationale: 원문은 인용 도입과 직접 인용이 분명하므로, 한국어에서도 경구적 권면과 예언 인용을 분리해 독자가 구조를 바로 파악하도록 했습니다.
  doctrine_reference: 성경 인용의 문학적 구조 보존
- issue: ‘우리 조상들의 때’의 시간적 표현
  chosen_reading: ‘우리 조상들의 때에도’로 옮겨 공동체의 전승된 회의감을 살렸습니다.
  alternative_readings:
  - ‘우리 조상들의 날에도’
  - ‘우리 조상의 시대에도’
  rationale: ἡμῶν τῶν πατέρων은 단순한 개인 경험이 아니라 공동체적 기억을 가리키므로, 한국어도 세대 전승의 뉘앙스를 유지했습니다.
  doctrine_reference: 공동체적 기억과 경고의 수용
- issue: ‘보십시오’의 감탄사 처리
  chosen_reading: ἰδοὺ를 ‘보십시오’로 옮겨 독자에게 시각적·수사적 전환을 유지했습니다.
  alternative_readings:
  - ‘보라’
  - ‘여기 보십시오’
  rationale: 직접 인용 속 감탄적 주의를 표하는 기능을 살리되, 현대 한국어 합쇼체에 맞게 조정했습니다.
  doctrine_reference: 수사적 감탄의 기능 보존
