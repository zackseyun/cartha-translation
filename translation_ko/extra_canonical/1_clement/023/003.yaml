  - severity: medium
    issue: ‘불쌍합니다’
    rationale: ταλαίπωροι는 고난스럽고 비참한 상태를 강하게 선언합니다. ‘불쌍합니다’는 화자의 연민에 초점이 옮겨가므로 ‘비참합니다’로 수정하는 것이 적절합니다.
  - severity: low
    issue: ‘자기 영혼 안에서’ 및 ‘이런 일 가운데 아무것도’
    rationale: 두 표현은 각각 직역투이고 부자연스럽습니다. ‘마음속으로’, ‘이런 일은 하나도’가 의미를 보존하면서 현대 표준어로 자연스럽습니다.
