review_pass:
  verdict: revise
  source_fidelity: 서두의 γενέσθω는 3인칭 명령법(소망·배제의 표현)이므로, 독자에게 직접 지시하는 듯한 ‘있게 하십시오’보다 ‘떠나가게 하소서’가 더 가깝습니다. ταλαίπωροι는 단순한 연민보다 비참함·고난의 상태를 나타내므로 ‘비참합니다’가 적절합니다. 인용문의 나머지 의미는 대체로 충실하나, ‘이런 일 가운데 아무것도’는 원문의 부정 범위를 자연스럽게 드러내지 못합니다.
  naturalness: ‘성경 구절’은 가능하지만, 인용을 도입하는 ἡ γραφὴ αὕτη에는 한국어 성경 문체의 ‘이 성경 말씀’이 더 자연스럽습니다. ‘자기 영혼 안에서 의심하는’은 다소 직역투이므로 ‘마음속으로 의심하는’으로 다듬었습니다. 인용문은 ‘말합니다:’으로 도입하고 내부 발화를 한 문장으로 연결하면 현대 한국어 문장 구조가 분명해집니다.
  terminology: δίψυχοι는 전통적으로 ‘두 마음을 품은’으로 이해되며, 이는 ‘마음이 갈라진’보다 원어의 이중성을 직접 보존합니다. ψυχή는 이 문맥에서 심리적 내면을 뜻하므로 ‘마음속으로’가 ‘영혼 안에서’보다 자연스럽고 과도한 실체화를 피합니다. διατάζοντες의 정확한 어감에는 불확실성이 있으나, 영어 POB의 ‘doubt’를 따라 ‘의심하는’으로 유지합니다.
  issues:
