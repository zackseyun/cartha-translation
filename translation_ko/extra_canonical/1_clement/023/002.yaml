  source_fidelity: 첫 절의 διψυχῶμεν은 ‘두 마음을 품다’로 적절히 옮겼으며, 둘째 절의 ἰνδάλλομαι 계열 동사는 이에 단순히 중복되지 않는 ‘의심하다/주저하다’의 의미로 구별해야 합니다. 다만 ψυχή를 ‘영’으로 옮기면 한국어에서 영혼-육체 이분법 또는 성령을 연상할 수 있고, 이 문맥의 내적 주체라는 뜻에는 ‘마음’이 더 정확합니다. ὑπερβαλλούσαις는 ‘넘치고’보다 ‘뛰어난’이 비교·탁월의 뜻을 더 직접적으로 반영합니다.
  naturalness: ‘우리의 영이 의심하지도 맙시다’는 주어와 청유형의 결합이 다소 부자연스럽습니다. ‘우리 마음이 … 의심하지 않게 합시다’로 하면 집단적 단수 ψυχή를 자연스럽게 살리면서 현대 합쇼체 문장이 됩니다.
  terminology: ‘두 마음을 품다’, ‘마음’, ‘선물들’은 문맥과 현대 표준어에 적절합니다. ‘그분’은 하나님을 가리키는 대명사로서 존칭을 유지합니다.
