id: 1CLEM.23.2
reference: 1 Clement 23:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ μὴ διψυχῶμεν, μηδὲ ἐνδυλλιεσθω ἡ ψυχὴ ἡμῶν ἐπὶ ταῖς ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/002.yaml
  text: Therefore let us not be double-minded[a], nor let our soul be doubtful concerning his surpassing and glorious gifts.
  footnotes:
  - marker: a
    text: Or 'nor let our soul be inwardly divided'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리가 두 마음을 품지 말고, 그의 넘치고 영광스러운 선물들에 대해 우리의 영이 의심하지도 맙시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ μὴ διψυχῶμεν
  english_pob_choice: let us not be double-minded
  chosen_korean: 우리가 두 마음을 품지 말고
  alternatives_korean:
  - 우리가 의심하지 말고
  - 우리가 갈팡질팡하지 말고
  lexicon: διψυχέω
  rationale: 두 마음을 품다는 표현이 διψυχῶμεν의 핵심 이미지인 내적 분열과 양분된 태도를 가장 자연스럽게 드러냅니다.
- source_word: μηδὲ ἐνδυλλιεσθω ἡ ψυχὴ ἡμῶν
  english_pob_choice: nor let our soul be doubtful
  chosen_korean: 우리의 영이 의심하지도 맙시다
  alternatives_korean:
  - 우리의 영이 주저하지도 맙시다
  - 우리의 영이 망설이지도 맙시다
  lexicon: ἰνδάλλομαι / ψυχή
  rationale: 개정된 영어가 반영하듯 이 동사는 단순한 분열의 반복이 아니라 ‘의심하다/주저하다’의 뜻을 가지므로, ψυχή는 문맥상 사람의 내면을 가리키는 ‘영’으로 옮겼습니다.
- source_word: ἐπὶ ταῖς ὑπερβαλλούσαις καὶ ἐνδόξοις δωρεαῖς αὐτοῦ
  english_pob_choice: concerning his surpassing and glorious gifts
  chosen_korean: 그의 넘치고 영광스러운 선물들에 대해
  alternatives_korean:
  - 그의 뛰어나고 영광스러운 선물들에 대해
  - 그의 탁월하고 영화로운 선물들에 대해
  lexicon: ὑπερβάλλω, ἔνδοξος, δωρεά
  rationale: ὑπερβαλλούσαις는 ‘넘치고/탁월한’의 과잉·우월성을, ἐνδόξοις는 ‘영광스러운’을, δωρεαῖς는 은사적 의미를 살려 ‘선물들’로 옮겼습니다.
theological_decisions:
- issue: διψυχέω와 ἰνδάλλομαι의 구분을 어떻게 살릴 것인가
  chosen_reading: ‘두 마음을 품지 말고’와 ‘의심하지도 맙시다’를 나란히 두어, 첫 번째는 분열된 내적 태도, 두 번째는 하나님의 선물에 대한 구체적 의심을 구별해 드러냈습니다.
  alternative_readings:
  - 두 표현을 모두 ‘의심하지 말고’로 통일
  - 두 표현을 모두 ‘주저하지 말고’로 통일
  rationale: 본문은 동일한 뜻의 반복이 아니라 서로 다른 뉘앙스를 병치하므로, 한국어도 그 긴장을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 인간의 내적 분열과 하나님의 은사에 대한 신뢰
- issue: ψυχή의 번역 범위
  chosen_reading: 이 문맥에서는 ‘영’으로 번역해 내면의 중심을 나타내되, 지나치게 영혼-육체 이분법으로 굳히지 않았습니다.
  alternative_readings:
  - 영혼
  - 마음
  rationale: 문맥상 ψυχή는 단지 감정이 아니라 판단과 신뢰가 이루어지는 내적 주체를 가리키므로, 현대 한국어에서 가장 넓고 중립적인 ‘영’이 적절합니다.
  doctrine_reference: 인간 내면의 통합성과 신앙적 신뢰
