revisions:
- from: 어리석은 사람들이여, 자신들을 나무와 비교해 보십시오. 포도나무를 보십시오. 처음에는 잎이 떨어지고, 그다음에는 새순이 나고, 그다음에는 잎이, 그다음에는 꽃이 피며, 그 뒤에는 덜 익은 포도송이가 나오고, 그다음에는 잘 익은 포도송이가 나타납니다. 짧은 시간 안에 나무의 열매가 익는 것을 보지 않습니까?[a]
  to: 어리석은 자들이여, 여러분 자신을 나무에 비추어 보십시오. 포도나무를 보십시오. 처음에는 잎이 떨어지고, 이어서 싹이 나고, 이어서 잎이 나고, 이어서 꽃이 피고, 그 뒤에는 풋포도와 이어서 포도송이가 나타납니다. 나무의 열매가 짧은 시간 안에 익는 것을 보십시오.
  rationale: 원문이 말하는 포도 성장의 순서와 복수 동사 παρίστανται에 연결된 ‘풋포도와 포도송이’를 보존했습니다. ‘잘 익은’이라는 추가 의미와 의문문 전환을 제거했으며, 원문에 근거하지 않는 영어 감사 이력의 대안 독법은 한국어 각주로 옮기지 않았습니다.
