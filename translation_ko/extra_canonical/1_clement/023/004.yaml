review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. σταφυλή는 ‘잘 익은 포도송이’가 아니라 ‘포도송이/송이’를 뜻하며, 원문은 그 성숙도를 명시하지 않습니다. 또한 마지막 ὁρᾶτε는 수사 의문문으로 바꾸기보다 ‘보십시오’라는 명령으로 유지하는 편이 정확합니다. 잎과 꽃의 단계에도 각각의 발생·개화 동작을 명시하는 것이 원문의 병렬을 더 충실히 반영합니다.
  naturalness: 전반적으로 현대 표준 한국어와 합쇼체에 잘 맞습니다. 다만 ‘잎이, 그다음에는 꽃이 피며’는 앞 단계와 병렬성이 약하고, ‘잘 익은 포도송이’는 불필요하게 의미를 보탭니다. 수정문은 자연스러운 단계적 열거와 권면조를 유지합니다.
  terminology: ὄμφαξ는 ‘풋포도’로, σταφυλή는 성숙 여부를 첨가하지 않은 ‘포도송이’로 옮겼습니다. ξύλον과 ἄμπελος는 문맥에 따라 각각 ‘나무’와 ‘포도나무’로 유지했습니다.
  issues:
  - severity: medium
    issue: σταφυλή를 ‘잘 익은 포도송이’로 번역함
    rationale: σταφυλή는 포도송이를 뜻하지만 ‘잘 익은’이라는 성숙 의미는 본문에 없습니다. 앞선 ὄμφαξ(풋포도)와의 순서는 보존하되, 뒤 항목에 명시되지 않은 성숙도를 더하지 않아야 합니다.
  - severity: low
    issue: ὁρᾶτε를 ‘보지 않습니까?’라는 의문문으로 전환함
    rationale: 원문의 현재 명령형은 청자에게 보라고 촉구합니다. ‘보십시오’가 문법적 형태와 수사적 직접성을 보존합니다.
  - severity: low
    issue: 잎과 꽃의 단계에서 동작 표현의 병렬이 약함
    rationale: 원문은 잎, 꽃, 풋포도, 포도송이가 순차적으로 나타나는 과정을 열거합니다. ‘잎이 나고, 꽃이 피고’로 명시하면 한국어에서도 과정과 병렬이 선명해집니다.
  revised_text: 어리석은 자들이여, 여러분 자신을 나무에 비추어 보십시오. 포도나무를 보십시오. 처음에는 잎이 떨어지고, 이어서 싹이 나고, 이어서 잎이 나고, 이어서 꽃이 피고, 그 뒤에는 풋포도와 이어서 포도송이가 나타납니다. 나무의 열매가 짧은 시간 안에 익는 것을 보십시오.
