id: 1CLEM.23.4
reference: 1 Clement 23:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὦ ἀνόητοι, συμβάλετε ἑαυτοὺς ξύλῳ· λάβετε ἄμπελον· πρῶτον μὲν φυλλορροεῖ, εἶτα βλαστὸς γίνεται, εἶτα φύλλον, εἶτα ἄνθος, καὶ μετὰ ταῦτα ὄμφαξ, εἶτα σταφυλὴ παρίστανται. ὁρᾶτε, ὅτι ἐν καιρῷ ὀλίγῳ εἰς πέπειρον καταντᾷ ὁ καρπὸς τοῦ ξύλου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/023/004.yaml
  text: 'You foolish ones[a], compare yourselves to a tree: take a vine. First it sheds its leaves, then a shoot appears, then a leaf, then a flower, and after these the unripe grape and then the full cluster appear. You see that in a short time the fruit of the tree comes to maturity.'
  footnotes:
  - marker: a
    text: Or 'and after these comes the unripe grape, then the full cluster appears. You see that in a little season'.
    reason: previous_rendering
translation:
  language: ko
  text: 어리석은 자들이여, 여러분 자신을 나무에 비추어 보십시오. 포도나무를 보십시오. 처음에는 잎이 떨어지고, 이어서 싹이 나고, 이어서 잎이 나고, 이어서 꽃이 피고, 그 뒤에는 풋포도와 이어서 포도송이가 나타납니다. 나무의 열매가 짧은 시간 안에 익는 것을 보십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἀνόητοι
  english_pob_choice: You foolish ones
  chosen_korean: 어리석은 사람들이여
  alternatives_korean:
  - 어리석은 자들이여
  - 어리석도다
  lexicon: ἀνόητοι
  rationale: 호격 감탄을 살리되, 현대 한국어 합쇼체에서 직접적인 호칭으로 자연스럽게 옮기기 위해 ‘어리석은 사람들이여’를 선택했습니다. 고어적 ‘-도다’는 피했습니다.
- source_word: συμβάλετε ἑαυτοὺς ξύλῳ
  english_pob_choice: compare yourselves to a tree
  chosen_korean: 자신들을 나무와 비교해 보십시오
  alternatives_korean:
  - 스스로를 나무와 견주어 보십시오
  - 나무와 자신을 대조해 보십시오
  lexicon: συμβάλλω + ἑαυτούς + ξύλον
  rationale: 비교 행위와 대상이 분명하므로 ‘비교해 보십시오’로 직역에 가깝게 살렸고, ξύλον은 문맥상 특정 목재가 아니라 일반적인 ‘나무’로 옮겼습니다.
- source_word: ὄμφαξ ... σταφυλή παρίστανται
  english_pob_choice: the unripe grape ... the full cluster appear
  chosen_korean: 덜 익은 포도송이가 나오고, 그다음에는 잘 익은 포도송이가 나타납니다
  alternatives_korean:
  - 청포도가 나오고, 그다음에는 포도송이가 나타납니다
  - 덜 익은 포도와 온전한 송이가 드러납니다
  lexicon: ὄμφαξ, σταφυλή, παρίστημι
  rationale: 영어 POB의 문맥을 따르되, ὄμφαξ를 단순 ‘포도’로 뭉개지 않고 ‘덜 익은 포도송이’로 구체화했습니다. παρίστανται는 복수형이므로 두 항목이 함께 ‘나타납니다’로 처리했습니다.
- source_word: ἐν καιρῷ ὀλίγῳ
  english_pob_choice: in a short time
  chosen_korean: 짧은 시간 안에
  alternatives_korean:
  - 잠시 후
  - 이내에
  lexicon: ἐν καιρῷ ὀλίγῳ
  rationale: 문맥상 시간의 짧음을 나타내므로 자연스러운 현대어 ‘짧은 시간 안에’로 옮겼습니다.
theological_decisions:
- issue: 수사적 경고의 어조
  chosen_reading: 본문의 호격과 명령형을 살려, 단순한 설명문이 아니라 청중을 꾸짖으며 깨우치는 수사적 경고로 번역했습니다.
  alternative_readings:
  - 완곡한 권면조로 낮추는 번역
  - 설명적 산문으로 평탄화하는 번역
  rationale: 원문은 ὦ ἀνόητοι와 여러 명령형을 통해 강한 책망과 예시를 제시하므로, 이를 약화시키지 않는 것이 본문의 효과를 보존합니다.
  doctrine_reference: 본문의 권면/책망 수사 유지 원칙
- issue: 과실 비유의 단계적 진행
  chosen_reading: 잎이 떨어짐에서 시작해 새순, 잎, 꽃, 덜 익은 포도, 잘 익은 포도송이로 이어지는 순차적 과정을 그대로 드러냈습니다.
  alternative_readings:
  - 단순히 ‘열매가 맺힌다’로 요약
  - 이미 성숙한 결과만 강조
  rationale: 이 구절의 설득력은 자연의 순서를 세밀하게 관찰하라는 데 있으므로, 단계적 진행을 보존해야 비유의 논증력이 유지됩니다.
  doctrine_reference: 자연 관찰을 통한 교훈적 논증
