id: 1CLEM.17.4
reference: 1 Clement 17:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλ’ αὐτὸς ἑαυτοῦ κατηγορεῖ λέγων· Οὐδεὶς καθαρὸς ἀπὸ ῥύπου, οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/004.yaml
  text: But he himself accuses himself[a], saying, “No one is clean from defilement, not even if his life is one day.”
  footnotes:
  - marker: a
    text: Or 'brings accusation against himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 그 자신도 스스로를 고발하며 말합니다. 「누구도 더러움에서 깨끗하지 않으며, 그 생명이 하루뿐일지라도 그렇습니다」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: 접속사
  rationale: 문맥상 앞선 주장에 대한 반전을 자연스럽게 살리되, 문어체 합쇼체에 맞는 직접적인 대조를 유지합니다.
- source_word: ἑαυτοῦ κατηγορεῖ
  english_pob_choice: accuses himself
  chosen_korean: 스스로를 고발하며
  alternatives_korean:
  - 자신을 고발하며
  - 자기 자신을 고발하며
  - 자기 자신을 고소하며
  lexicon: κατηγορέω
  rationale: 영어 POB의 직역적 의미를 따르면서도, 한국어에서 반성적·법정적 울림이 있는 ‘고발하다’를 택해 자기비판의 강도를 보존했습니다.
- source_word: Οὐδεὶς καθαρὸς ἀπὸ ῥύπου
  english_pob_choice: No one is clean from defilement
  chosen_korean: 누구도 더러움에서 깨끗하지 않으며
  alternatives_korean:
  - 아무도 더러움에서 깨끗하지 않으며
  - 어떤 사람도 더러움에서 깨끗하지 않으며
  - 누구도 부정함에서 깨끗하지 않으며
  lexicon: καθαρός / ῥύπος
  rationale: ῥύπος를 의례적 ‘부정함’보다 더 일상적이면서도 오염의 이미지를 살리는 ‘더러움’으로 옮겼고, καθαρός는 상태를 나타내는 ‘깨끗하다’로 보존했습니다.
- source_word: οὐδ’ ἂν μιᾶς ἡμέρας ἡ ζωὴ αὐτοῦ
  english_pob_choice: not even if his life is one day
  chosen_korean: 그 생명이 하루뿐일지라도 그렇습니다
  alternatives_korean:
  - 그의 생명이 하루라도 그럴 수 없으며
  - 그의 생명이 하루일지라도 그렇습니다
  - 비록 그의 생명이 하루뿐일지라도 그렇습니다
  lexicon: 시간 표현
  rationale: 원문의 양보적 조건을 한국어의 ‘-일지라도’로 자연스럽게 살리되, 생명이 극히 짧아도 예외가 없다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 보편적 인간 부정성의 강도
  chosen_reading: ‘누구도’와 ‘하루뿐일지라도’를 함께 살려, 극단적으로 짧은 생애에도 예외가 없다는 전면적 진술로 옮겼습니다.
  alternative_readings:
  - ‘아무도’로 더 평이하게 옮길 수 있습니다.
  - ‘비록 그의 생명이 하루라도’로 조건을 더 직접적으로 드러낼 수 있습니다.
  rationale: 문장은 인간의 보편적 결함을 일반론으로 말하므로, 약화시키지 않고 전면적 범위를 보존하는 것이 중요합니다.
  doctrine_reference: 인간 보편죄성에 대한 일반적 성찰
- issue: ‘고발하다’의 법정적 뉘앙스
  chosen_reading: 자기 자신에 대한 비판을 단순한 ‘비난’보다 법정적·공적 뉘앙스가 있는 ‘고발’로 옮겼습니다.
  alternative_readings:
  - ‘자책한다’는 심리적 뉘앙스로 순화할 수 있습니다.
  - ‘비난한다’로 더 일반화할 수 있습니다.
  rationale: 그리스어 κατηγορέω는 단순한 감정 표현보다 공식적 고발의 뉘앙스를 가지므로, 이를 살리는 편이 원문의 힘을 유지합니다.
  doctrine_reference: 어휘의 법정적 의미 보존
