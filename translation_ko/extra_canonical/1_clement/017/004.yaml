revisions:
- from: 그러나 그 자신도 스스로를 고발하며 말합니다. 「누구도 더러움에서 깨끗하지 않으며, 그 생명이 하루뿐일지라도 그렇습니다」[a]
  to: 그러나 그는 친히 자신을 고발하며 이렇게 말합니다. 「아무도 더러움에서 깨끗하지 않으며, 그의 생명이 하루밖에 되지 않는다 해도 그렇습니다」[a]
  rationale: 원문의 강조(αὐτός)는 ‘친히’로, 재귀적 고발은 ‘자신을 고발하며’로, 인용문의 양보 조건은 ‘그의 생명이 하루밖에 되지 않는다 해도’로 명확히 옮겼습니다. 의미를 신학적으로 확대하지 않았으며, 기존 각주 표지도 유지했습니다.
  reviewer_model: gpt-5.6-terra
