id: 1CLEM.17.5
reference: 1 Clement 17:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Μωσῆς πιστὸς ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ ἐκλήθη, καὶ διὰ τῆς ὑπηρεσίας αὐτοῦ ἐκρίνεν ὁ θεὸς Αἴγυπτον διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν· ἀλλὰ κἀκεῖνος δοξασθεὶς μεγάλως οὐκ ἐμεγαλοφρόνησεν, ἀλλ’ εἶπεν ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου· Τίς εἰμι ἐγώ, ὅτι με πέμπεις; Ἐγὼ δέ εἰμι ἰσχνόφωνος καὶ βραδύγλωσσος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/005.yaml
  text: Moses was called faithful in all his house[a], and through his service God judged Egypt through their plagues and torments; yet even he, though greatly glorified, did not become arrogant, but said, when a divine message was given to him at the bush, “Who am I, that you send me? For I am weak-voiced and slow of tongue.”
  footnotes:
  - marker: a
    text: Or 'did not become high-minded'.
    reason: previous_rendering
translation:
  language: ko
  text: 모세는 그의 온 집에서 신실한 사람으로 불렸습니다[a]. 그리고 그의 섬김을 통해 하나님께서 이집트에 그들의 재앙들과 고통들을 통해 심판을 내리셨습니다. 그러나 그 역시 크게 영광을 받았음에도 교만해지지 않았고, 떨기나무에서 그에게 신적 메시지가 주어졌을 때 이렇게 말했습니다. "내가 누구이기에, 당신이 나를 보내십니까? 나는 목소리가 약하고 혀가 더딥니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστὸς
  english_pob_choice: faithful
  chosen_korean: 신실한
  alternatives_korean:
  - 충실한
  - 믿음직한
  lexicon: faithful
  rationale: 모세의 성품을 단순한 기능 충실성보다 인격적 신실함으로 옮기는 것이 자연스럽고, 본문 대비(교만하지 않음)에도 잘 맞습니다.
- source_word: διὰ τῆς ὑπηρεσίας αὐτοῦ
  english_pob_choice: through his service
  chosen_korean: 그의 섬김을 통해
  alternatives_korean:
  - 그의 봉사를 통해
  - 그의 사역을 통해
  lexicon: service
  rationale: ὑπηρεσία는 일반적 봉사보다 섬김/봉사의 행위를 가리키므로, 문맥상 모세의 수행을 드러내는 ‘섬김’을 택했습니다.
- source_word: ἐκρίνεν ... διὰ τῶν μαστίγων καὶ τῶν αἰκισμάτων αὐτῶν
  english_pob_choice: God judged Egypt through their plagues and torments
  chosen_korean: 하나님께서 이집트에 그들의 재앙들과 고통들을 통해 심판을 내리셨습니다
  alternatives_korean:
  - 하나님께서 이집트를 그들의 재앙들과 고통들을 통해 심판하셨습니다
  - 하나님께서 그들의 재앙과 고문으로 이집트를 심판하셨습니다
  lexicon: judge / plagues / torments
  rationale: διὰ가 반복되므로 ‘통해’로 유지해 원문의 매개성을 살렸고, μαστίγγες/αἰκισμοί는 재앙들과 고통들로 옮겨 병렬 구조를 보존했습니다.
- source_word: ἀλλ’ εἶπεν ... χρηματισμοῦ αὐτῷ δεδομένου
  english_pob_choice: but said, when a divine message was given to him
  chosen_korean: 그에게 신적 메시지가 주어졌을 때 이렇게 말했습니다
  alternatives_korean:
  - 그에게 신탁이 주어졌을 때 이렇게 말했습니다
  - 그에게 하나님의 응답이 주어졌을 때 이렇게 말했습니다
  lexicon: divine message
  rationale: χρηματισμός는 단순한 말이 아니라 신적 전달을 가리키므로, 한국어에서는 지나치게 교회적이거나 예언서적 뉘앙스로 굳히지 않고 ‘신적 메시지’로 옮겼습니다.
- source_word: ἰσχνόφωνος καὶ βραδύγλωσσος
  english_pob_choice: weak-voiced and slow of tongue
  chosen_korean: 목소리가 약하고 혀가 더딥니다
  alternatives_korean:
  - 목소리가 약하고 말이 더딥니다
  - 말소리가 약하고 혀가 둔합니다
  lexicon: weak-voiced / slow of tongue
  rationale: 두 형용사의 병렬성을 유지하면서, 현대 한국어에서 자연스럽고 직관적으로 모세의 언어적 약점을 드러내는 표현으로 다듬었습니다.
theological_decisions:
- issue: 모세의 자기 진술에서 의도된 겸손/무능 인식의 표현
  chosen_reading: 교만해지지 않았고
  alternative_readings:
  - 높은 마음을 품지 않았고
  - 거만해지지 않았고
  rationale: μεγαλοφρονέω의 부정형은 단순한 자긍심 부재가 아니라 교만·오만의 거부이므로, 현대 독자에게 오해를 줄 수 있는 ‘높은 마음’보다 ‘교만해지지 않음’이 본문 의미를 더 정확히 전달합니다.
  doctrine_reference: 모세의 겸손과 하나님의 주권적 부르심
- issue: 모세의 발화체 예문에서 δέ의 대비를 한국어로 처리하는 방식
  chosen_reading: ‘내가 누구이기에…?’로 이어지는 직접 화법을 유지하되 앞머리 연결은 자연스러운 서술로 처리
  alternative_readings:
  - ‘그러나 나는…’로 시작하는 대조적 직역
  - ‘그런데 나는…’로 옮기는 방식
  rationale: 본문의 강조점은 모세의 자기비하와 부르심에 대한 부적격감이므로, 한국어에서는 과도한 접속어보다 직접 인용의 힘을 살리는 것이 더 충실합니다.
  doctrine_reference: 부르심 앞에서의 인간의 비자격성과 하나님의 선택
