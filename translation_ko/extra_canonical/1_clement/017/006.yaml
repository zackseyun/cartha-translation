  text: And again he says, “But I am steam from a pot.”
translation:
  language: ko
  text: 그리고 다시 이렇게 말합니다. “그러나 나는 솥에서 나는 김과 같습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν λέγει
  english_pob_choice: And again he says
  chosen_korean: 그리고 다시 이렇게 말합니다
  alternatives_korean:
  - 그리고 다시 말합니다
  - 또 다시 말합니다
  lexicon: καὶ πάλιν / λέγει
  rationale: 반복 인용 표지를 자연스럽게 살리면서, 문맥상 직접 인용을 예고하는 ‘이렇게 말합니다’를 사용했습니다.
- source_word: ἀτμὶς
  english_pob_choice: steam
  chosen_korean: 김
  alternatives_korean:
  - 수증기
  - 증기
  lexicon: ἀτμίς
  rationale: 솥에서 나오는 뜨거운 기운을 한국어로 가장 자연스럽게 전달하는 표현으로 ‘김’을 택했습니다. ‘수증기’는 과학적이지만 다소 설명적이며, ‘증기’는 현대어로는 기계적 뉘앙스가 있어 문맥이 덜 살아납니다.
- source_word: ἀπὸ χύτρας
  english_pob_choice: from a pot
  chosen_korean: 솥에서 나는
  alternatives_korean:
  - 냄비에서 나는
  - 그릇에서 나는
  lexicon: ἀπὸ χύτρας
  rationale: χύτρας를 단순한 일반 ‘pot’보다 한국어 문화권에서 더 즉각적으로 떠오르는 조리 용기인 ‘솥’으로 옮겼고, 출처 관계는 ‘-에서 나는’으로 풀어 자연스럽게 연결했습니다.
theological_decisions:
- issue: 비유적 자의식 표현의 유지
  chosen_reading: 원문의 자기비하적·이미지적 표현을 그대로 살려 ‘나는 솥에서 나는 김과 같습니다’로 옮겼습니다.
  alternative_readings:
  - ‘나는 솥에서 올라오는 수증기와 같습니다’
  - ‘나는 솥의 김과 같습니다’
  rationale: 이 구절은 의미 설명보다 강한 이미지 자체가 핵심이므로, 과도한 풀이나 현대적 설명을 덜어 원문의 낯섦과 생생함을 유지했습니다.
  doctrine_reference: source fidelity / figurative speech
