id: 1CLEM.17.2
reference: 1 Clement 17:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐμαρτυρήθη μεγάλως Ἀβραὰμ καὶ φίλος προσηγορεύθη τοῦ θεοῦ, καὶ λέγει ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ ταπεινοφρονῶν· Ἐγὼ δέ εἰμι γῆ καὶ σποδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/002.yaml
  text: Abraham received great testimony and was called the friend of God, and gazing intently on the glory of God, he said with humility, “But I am dust and ashes.”
translation:
  language: ko
  text: 아브라함은 크게 증언을 받았고 하나님의 친구라고 불렸으며, 하나님의 영광을 뚫어지게 바라보며 겸손하게 말했습니다. 「그러나 저는 흙과 재일 뿐입니다」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτυρήθη μεγάλως
  english_pob_choice: received great testimony
  chosen_korean: 크게 증언을 받았고
  alternatives_korean:
  - 큰 증언을 받았고
  - 크게 증언되어
  lexicon: μαρτυρέω
  rationale: 수동형의 결과를 살리면서도 자연스러운 한국어로 옮기기 위해 ‘증언을 받다’를 택했습니다. ‘크게’는 μεγάλως의 강도를 반영합니다.
- source_word: φίλος προσηγορεύθη τοῦ θεοῦ
  english_pob_choice: was called the friend of God
  chosen_korean: 하나님의 친구라고 불렸으며
  alternatives_korean:
  - 하나님의 벗이라고 불렸으며
  - 하나님의 친구로 불렸으며
  lexicon: προσαγορεύω
  rationale: 호칭의 결과를 분명히 드러내기 위해 ‘…라고 불리다’를 사용했고, φίλος는 성경적이고 직관적인 ‘친구’로 옮겼습니다.
- source_word: ἀτενίζων εἰς τὴν δόξαν τοῦ θεοῦ
  english_pob_choice: gazing intently on the glory of God
  chosen_korean: 하나님의 영광을 뚫어지게 바라보며
  alternatives_korean:
  - 하나님의 영광을 응시하며
  - 하나님의 영광을 집중하여 바라보며
  lexicon: ἀτενίζω / δόξα
  rationale: ἀτενίζων의 집중적 시선을 ‘뚫어지게 바라보다’로 살렸고, δόξα는 문맥상 ‘영광’이 가장 직접적입니다.
- source_word: ταπεινοφρονῶν
  english_pob_choice: with humility
  chosen_korean: 겸손하게
  alternatives_korean:
  - 마음을 낮추어
  - 겸허하게
  lexicon: ταπεινοφρονέω
  rationale: 영어 POB의 단순한 ‘with humility’를 따라, 행동 부사로 자연스럽게 정리했습니다.
- source_word: γῆ καὶ σποδός
  english_pob_choice: dust and ashes
  chosen_korean: 흙과 재일 뿐입니다
  alternatives_korean:
  - 먼지와 재일 뿐입니다
  - 흙과 재입니다
  lexicon: γῆ / σποδός
  rationale: 관용적 자기를 낮추는 표현을 한국어로 자연스럽게 살리되, source의 물질 이미지를 유지했습니다.
theological_decisions:
- issue: 아브라함의 자기비하 발언의 어조
  chosen_reading: 직설적인 자기 낮춤을 유지해, 하나님의 영광 앞에서 인간의 피조성과 비천함을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 낮춘 표현으로 조정
  - 경건한 겸손만 강조
  rationale: 본문은 단순한 예의가 아니라 창조주와 피조물의 간극을 강하게 드러내므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 창 18:27의 전통적 자기 인식과 관련된 겸손의 어조
- issue: '''하나님의 친구''의 직역성'
  chosen_reading: ‘하나님의 친구’라는 호칭을 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님과 친한 사람’처럼 풀어 번역
  - ‘하나님의 벗’으로 문학적 조정
  rationale: 호칭 자체가 아브라함의 특별한 관계를 요약하므로, 관용화하지 않고 직접적으로 전달했습니다.
  doctrine_reference: 약 2:23의 아브라함 전통
