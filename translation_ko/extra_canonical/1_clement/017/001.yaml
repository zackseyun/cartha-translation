  source_fidelity: 수정이 필요합니다. δέρμασιν αἰγείοις καὶ μηλωταῖς는 ‘염소 가죽과 양가죽’의 순서와 대조를 나타내는데, 초안의 ‘가죽옷과 염소 가죽옷’은 두 항목을 잘못 옮기고 순서도 바꾸었습니다. 또한 τοὺς προφήτας는 열거한 세 인물을 모두 받으므로 ‘예언자들인’으로 처리해야 합니다.
  naturalness: ‘염소 가죽과 양가죽을 걸치고 다니며’는 현대 표준 한국어에서 자연스럽고, 원문의 지속적·반복적 행위를 무리 없이 반영합니다. 후반부의 중복된 ‘말합니다’는 한 문장으로 정리하는 편이 자연스럽습니다.
