id: 1CLEM.17.1
reference: 1 Clement 17:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Μιμηταὶ γενώμεθα κἀκείνων, οἵτινες ἐν δέρμασιν αἰγείοις καὶ μηλωταῖς περιεπάτησαν κηρύσσοντες τὴν ἔλευσιν τοῦ Χριστοῦ· λέγομεν δὲ Ἠλίαν καὶ Ἐλισαιέ, ἔτι δὲ καὶ Ἰεζεκιὴλ, τοὺς προφήτας· πρὸς τούτοις καὶ τοὺς μεμαρτυρημένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/001.yaml
  text: Let us become imitators also of those who went about in goatskins and sheepskins, proclaiming the coming of the Christ. We mean Elijah and Elisha, and also Ezekiel, the prophets; and besides these, those who have been commended.
  footnotes:
  - marker: a
    text: Or 'those who have received testimony'.
    reason: previous_rendering
  - marker: b
    text: Or 'Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리도 염소 가죽과 양가죽을 걸치고 다니며 그리스도의 오심을 선포한 이들을 본받읍시다. 곧 예언자들인 엘리야와 엘리사와 에스겔, 그리고 그 밖에 칭찬을 받은 이들입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘증언을 받은 이들’ 또는 ‘인정을 받은 이들’.
    reason: μεμαρτυρημένους는 문자적으로는 ‘증언을 받은’이라는 뜻일 수 있으나, 이 문맥에서는 칭찬·승인의 긍정적 의미를 띱니다.
  - marker: b
    text: 또는 ‘메시아’.
    reason: Χριστός의 어원적 번역 가능성을 제시하되, 본문은 초기 기독교 용례에 맞추어 ‘그리스도’를 유지합니다.
lexical_decisions:
- source_word: Μιμηταὶ γενώμεθα
  english_pob_choice: Let us become imitators
  chosen_korean: 본받읍시다
  alternatives_korean:
  - 따라갑시다
  - 모범으로 삼읍시다
  lexicon: μιμητής
  rationale: 권면형 공동체 문맥에서 ‘본받다’가 의미를 자연스럽게 살리면서도 모방의 윤리적 촉구를 유지합니다.
- source_word: δέρμασιν αἰγείοις καὶ μηλωταῖς
  english_pob_choice: goatskins and sheepskins
  chosen_korean: 가죽옷과 염소 가죽옷
  alternatives_korean:
  - 염소가죽과 양가죽
  - 염소 가죽옷과 양털 외투
  lexicon: δέρμα / μηλωτή
  rationale: 두 개의 피복을 구분해 주되, 한국어에서 자연스러운 의복 표현으로 옮겨 독자의 이해를 돕습니다.
- source_word: τὴν ἔλευσιν τοῦ Χριστοῦ
  english_pob_choice: the coming of the Christ
  chosen_korean: 그리스도의 오심
  alternatives_korean:
  - 메시아의 오심
  - 그리스도의 오시는 일
  lexicon: ἔλευσις / Χριστός
  rationale: 원문이 Χριστόν을 사용하므로 직접적으로 ‘그리스도’로 옮기되, 예언적 도래의 의미를 살려 ‘오심’으로 표현합니다.
- source_word: τοὺς μεμαρτυρημένους
  english_pob_choice: those who have been commended
  chosen_korean: 칭찬을 받은 이들
  alternatives_korean:
  - 공인된 이들
  - 증언을 받은 이들
  lexicon: μαρτυρέω
  rationale: 수동 완료분사가 이 문맥에서 ‘평판이 좋다/칭찬받다’는 승인 의미를 띠므로, 긍정적 평가를 드러내는 표현을 선택했습니다.
- source_word: Ἠλίαν καὶ Ἐλισαιέ, ἔτι δὲ καὶ Ἰεζεκιὴλ
  english_pob_choice: Elijah and Elisha, and also Ezekiel
  chosen_korean: 엘리야와 엘리사, 그리고 예언자 에스겔
  alternatives_korean:
  - 엘리야와 엘리사, 그리고 에스겔
  - 엘리야, 엘리사, 그리고 에스겔
  lexicon: 고유명사 / τοὺς προφήτας
  rationale: 원문이 인물들을 ‘예언자들’로 다시 규정하므로, 에스겔 앞에 예언자 표지를 붙여 문장 구조를 분명히 했습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 여기서는 ‘메시아’가 아니라 ‘그리스도’를 사용했습니다.
  alternative_readings:
  - 메시아
  - 기름부음 받은 이
  rationale: 제공된 영어 POB도 ‘Christ’를 채택하고 있으며, 이 시점의 그리스어 문맥에서는 칭호가 이미 고유명사처럼 기능하므로 직역보다 형식대응을 택했습니다.
  doctrine_reference: 초기 기독론 용례와 명칭화된 Χριστός의 수용
- issue: ‘칭찬을 받은 이들’의 신학적 뉘앙스
  chosen_reading: 하나님의 승인/인정을 받은 이들로 읽되, 한국어 본문에는 ‘칭찬’으로 옮겼습니다.
  alternative_readings:
  - 증언을 받은 이들
  - 인정받은 이들
  rationale: μαρτυρέω의 수동 완료는 단순한 증언 수령이 아니라 공적으로 좋게 평가된 상태를 가리키므로, 문맥상 ‘칭찬’이 가장 가까운 자연어 대응입니다.
  doctrine_reference: 성경 인물에 대한 공동체적·하나님 앞의 승인 언어
