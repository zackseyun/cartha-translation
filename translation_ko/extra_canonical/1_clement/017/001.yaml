  to: 우리도 염소 가죽과 양가죽을 걸치고 다니며 그리스도의 오심을 선포한 이들을 본받읍시다. 곧 예언자들인 엘리야와 엘리사와 에스겔, 그리고 그 밖에 칭찬을 받은 이들입니다.[a][b]
  rationale: 원문의 피복 어휘와 순서를 바로잡고, ‘예언자들’이 세 인물 전체를 가리키도록 문장 구조를 조정했습니다. ‘그리스도’와 ‘칭찬을 받은 이들’은 제공된 영어 POB의 어휘 결정을 따르면서 한국어 문맥에 맞게 유지했습니다.
