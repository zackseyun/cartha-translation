  - severity: medium
    issue: ἀπεχόμενος의 번역 및 각주 표지 위치
    rationale: ‘멀리하고 있었습니다’도 의미권 안에 있으나, ἀπέχομαι의 ‘삼가다, 멀리하다’라는 자기 절제의 뜻을 ‘삼가다’가 더 직접적으로 드러냅니다. 영어 감사 이력의 대안 번역 각주는 해당 표현 바로 뒤에 붙여야 합니다.
