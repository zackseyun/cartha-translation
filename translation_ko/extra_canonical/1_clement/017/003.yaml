reference: 1 Clement 17:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ δὲ καὶ περὶ Ἰὼβ οὕτως γέγραπται· Ἰὼβ δὲ ἦν δίκαιος καὶ ἄμεμπτος, ἀληθινός, θεοσεβής, ἀπεχόμενος ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017/003.yaml
  text: 'And concerning Job it is thus written: “Now Job was righteous and blameless[a], true, God-fearing, abstaining from every evil.”'
  footnotes:
  - marker: a
    text: Or 'and turning away from every evil thing'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 욥에 관해서는 이렇게 기록되어 있습니다. 「욥은 의롭고 흠이 없으며, 참되고 하나님을 경외하며, 모든 악을 멀리하고 있었습니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  english_pob_choice: righteous
  chosen_korean: 의롭고
  alternatives_korean:
  - 의로운
  - 공의로운
  lexicon: δίκαιος
  rationale: 의롭다는 의미를 직접 반영하되, 문장 흐름에 맞게 서술적 형용사로 처리했습니다.
- source_word: ἄμεμπτος
  english_pob_choice: blameless
  chosen_korean: 흠이 없으며
  alternatives_korean:
  - 책잡을 데 없으며
  - 비난받을 데 없으며
  lexicon: ἄμεμπτος
  rationale: 도덕적·평판적 결함이 없다는 뜻을 자연스럽게 살리기 위해 ‘흠이 없으며’로 옮겼습니다.
- source_word: ἀληθινός
  english_pob_choice: 'true'
  chosen_korean: 참되고
  alternatives_korean:
  - 진실하고
  - 진정한
  lexicon: ἀληθινός
  rationale: 인격적 진실성과 신뢰성을 함께 담는 가장 간결한 현대 한국어 표현으로 보았습니다.
- source_word: θεοσεβής
  english_pob_choice: God-fearing
  chosen_korean: 하나님을 경외하며
  alternatives_korean:
  - 하나님을 두려워하며
  - 경건하며
  lexicon: θεοσεβής
  rationale: 단순한 종교성보다 하나님 앞의 경외를 드러내는 표현이 원문의 의미를 더 잘 반영합니다.
- source_word: ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  english_pob_choice: abstaining from every evil
  chosen_korean: 모든 악을 멀리하고 있었습니다
  alternatives_korean:
  - 모든 악에서 절제하고 있었습니다
  - 모든 악을 삼가고 있었습니다
  lexicon: ἀπέχομαι
  rationale: ἐκκλίνω류의 ‘돌이킴’이 아니라 ‘떨어져 있음/삼감’의 뉘앙스를 살려, 현재분사의 지속성을 드러내면서도 한국어로는 자연스럽게 표현했습니다.
theological_decisions:
- issue: 욥의 품성 열거를 도덕적 칭찬으로만 약화시키지 않는 표현
  chosen_reading: ‘의롭고 흠이 없으며, 참되고 하나님을 경외하며’로 직설적으로 옮겨 욥의 인물됨을 본문 그대로 드러냈습니다.
  alternative_readings:
  - ‘정직하고 결함 없으며’처럼 더 완곡하게 옮김
  - ‘경건한’으로 θεοσεβής를 일반화함
  rationale: 본문은 욥을 규범적 모범으로 제시하므로, 평가적 어조를 약화시키지 않되 현대어로 분명하게 유지했습니다.
  doctrine_reference: 성경의 인물 평가를 있는 그대로 전달하는 원문 충실성 원칙
