- from: 또 욥에 관해서는 이렇게 기록되어 있습니다. 「욥은 의롭고 흠이 없으며, 참되고 하나님을 경외하며, 모든 악을 멀리하고 있었습니다.」[a]
  to: 또 욥에 관해서는 이렇게 기록되어 있습니다. “욥은 의롭고 흠이 없으며, 진실하고 하나님을 경외하며, 모든 악을 삼가는 사람이었습니다.”[a]
  rationale: 원문의 다섯 품성 서술을 유지하되, ἀληθινός를 인격적 ‘진실함’으로, ἀπεχόμενος를 지속적인 ‘삼감’으로 자연스럽고 정확하게 옮겼습니다. 대안 각주는 본문 의미를 바꾸지 않고 이전 영어 번역의 ‘turning away’ 가능성을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:14Z'
