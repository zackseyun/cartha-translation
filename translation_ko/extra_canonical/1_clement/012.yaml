base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012.yaml
  text: Because of faith and hospitality[a], Rahab the prostitute was saved. 2 For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their country, and he sent men to seize them, so that, once captured, they might be put to death. 3 So Rahab, being hospitable, welcomed them and hid them in the upper room under the stalks of flax. 4 But when the men from the king came and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed,” while she pointed them toward another road. 5 And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.” 6 And they said to her, “It shall be so, as you have spoken to us. But when you know
    that we are arriving, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.” 7 And they added that they would give her a sign, that she should hang a scarlet cord from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God. 8 You see, beloved, that in the woman not only faith[b][c][d], but also prophecy was present.
  footnotes:
  - marker: a
    text: 'Clement interprets Rahab''s scarlet sign typologically: the visible scarlet marker points beyond the Joshua narrative to redemption through the Lord''s blood.'
    reason: cross_reference
    anchor_ref: '12:7'
  - marker: d
    text: The Greek at the end of the verse is textually awkward in this OCR witness; the sense is that Rahab misdirected the king's men by indicating another way.
    reason: textual_variant
    anchor_ref: '12:4'
  - marker: c
    text: That 'prophecy' was present in Rahab means Clement sees more than faithful action in her; he sees a prophetic sign in her words and in the scarlet token.
    reason: lexical_alternative
    anchor_ref: '12:8'
  - marker: b
    text: Or 'there came to be not only faith, but also prophecy'.
    reason: previous_rendering
translation:
  language: ko
  text: 믿음과 나그네를 잘 대접함으로 라합은 그 창녀였던 몸으로도 구원을 받았습니다. 2 여호수아 눈의 아들이 여리고로 정탐꾼들을 보냈을 때, 그 땅의 왕은 그들이 와서 자기들의 나라를 정탐하러 왔다는 것을 알고 사람들을 보내어 그들을 잡게 하였으니, 잡히면 죽이려는 것이었습니다. 3 그러나 나그네를 잘 대접하던 라합은 그들을 맞아들여, 아마짚 줄기 아래 다락에 숨겼습니다. 4 그런데 왕의 사람들이 와서 말했습니다. “우리 땅의 정탐꾼들이 당신에게 들어왔으니, 그들을 끌어내십시오. 왕이 그렇게 명령합니다.” 그러자 그녀가 대답했습니다. “여러분이 찾는 그 사람들은 참으로 내게 들어왔지만, 곧바로 떠나버렸습니다.” 그러고는 그녀가 그들을 다른 길로 가리켰습니다. 5 그리고 그녀가 그 사람들에게 말했습니다. “나는 야훼 하나님께서 이 땅을 여러분에게 넘겨주고 계신다는 것을 분명히 압니다. 여러분에 대한 두려움과 떨림이 이 땅의 주민들에게 덮쳤기 때문입니다. 그러므로 여러분이 그것을 차지하게 될 때에, 나와 내 아버지의 집을 보존해 주십시오.” 6 그러자 그들이 그녀에게 말했습니다. “그렇게 될 것입니다. 당신이 우리에게 말한 그대로입니다. 그러나 우리가 도착하는 것을 당신이 알게 되면, 당신의 사람들을 모두 당신 지붕 아래로 모으십시오. 그러면 그들은 보존될 것입니다. 집 밖에서 발견되는 사람은 누구든지 멸망할 것입니다.” 7 그리고 그들은 그녀에게 표징을 주겠다고 덧붙였으니, 그녀가 자기 집에서 붉은 끈을 달아 놓아야 했습니다. 그것은 주의 피를 통해 하나님을 믿고 바라보는 모든 사람에게 속량이 있을 것임을 분명히 보여 주기 위한 것이었습니다. 8 사랑하는 여러분, 그 여자에게는 믿음만이 아니라 예언도 있었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  english_pob_choice: faith
  chosen_korean: 믿음
  alternatives_korean:
  - 신뢰
  - 신실함
  lexicon: BDAG
  rationale: 문맥상 라합의 하나님을 향한 믿음과 1절의 paraenetic 강조를 살려 표준적인 ‘믿음’으로 옮겼습니다.
- source_word: φιλοξενία / φιλόξενος
  english_pob_choice: hospitality / being hospitable
  chosen_korean: 나그네를 잘 대접함 / 나그네를 잘 대접하던
  alternatives_korean:
  - 환대
  - 손님 대접
  lexicon: BDAG
  rationale: ‘낯선 이를 사랑함’이라는 어원을 살리면서도 한국어에서는 자연스럽고 구체적인 표현인 ‘나그네를 잘 대접하다’로 옮겨 1절과 3절의 어휘 연결을 보존했습니다.
- source_word: πόρνη
  english_pob_choice: prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 몸파는 여자
  lexicon: BDAG
  rationale: 원문과 POB의 노골성을 유지해야 하므로 완곡한 표현보다 직접적인 ‘창녀’를 택했습니다.
- source_word: λινοκαλάμη
  english_pob_choice: stalks of flax
  chosen_korean: 아마짚 줄기
  alternatives_korean:
  - 아마 줄기
  - 삼대
  lexicon: LSJ
  rationale: 플럭스(flax) 재료를 구체적으로 드러내면서도 현대 한국어에서 이해 가능한 식물명과 부위를 결합했습니다.
- source_word: κύριος ὁ θεός
  english_pob_choice: the Lord God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 주님 하나님
  lexicon: BDAG
  rationale: 출처에서 κύριος가 여호와 인용/암시가 아니라 일반 호칭이라도, 본문 자체의 여호와 지칭에 해당하므로 프로젝트 기본값인 ‘야훼’를 적용했습니다.
- source_word: διασώσατέ / διασωθήσονται
  english_pob_choice: preserve me / they will be preserved
  chosen_korean: 보존해 주십시오 / 보존될 것입니다
  alternatives_korean:
  - 구해 주십시오 / 구원받을 것입니다
  - 살려 주십시오 / 살아남을 것입니다
  lexicon: BDAG
  rationale: 두 동사는 생명 보존의 의미를 가지지만, 5–6절의 맥락에서는 단순한 구출보다 집과 사람의 안전한 보전이 핵심이므로 ‘보존하다’로 대응했습니다.
- source_word: κόκκινον
  english_pob_choice: scarlet cord
  chosen_korean: 붉은 끈
  alternatives_korean:
  - 주홍 끈
  - 홍색 줄
  lexicon: LSJ
  rationale: 한국어에서는 색채와 물체를 간결하게 드러내는 ‘붉은 끈’이 자연스럽고, 표징으로서의 기능도 분명히 전달합니다.
- source_word: λύτρωσις
  english_pob_choice: redemption
  chosen_korean: 속량
  alternatives_korean:
  - 구속
  - 구원
  lexicon: BDAG
  rationale: 문맥이 단순한 구조보다 대속적 해방을 가리키므로, 전통적이면서도 의미가 선명한 ‘속량’을 선택했습니다.
theological_decisions:
- issue: 라합의 표징에 대한 기독론적 해석
  chosen_reading: ‘주의 피를 통해… 속량이 있을 것’이라는 설명을 라합 서사의 단순한 상징이 아니라, 클레멘스가 라합의 붉은 표징을 그리스도론적으로 해석한 주석으로 그대로 유지했습니다.
  alternative_readings:
  - 붉은 끈을 단순한 구출 표지로만 처리함
  - ‘주의 피’를 일반적 희생의 상징으로 약화함
  rationale: 그리스어와 POB가 분명히 표징에서 신학적 해석으로 넘어가므로, 그 긴장을 누그러뜨리지 않고 보존했습니다.
  doctrine_reference: 원문 우선, 유형론적 독해 보존
- issue: 라합에게서 ‘믿음’과 ‘예언’의 공존
  chosen_reading: 마지막 절의 γέγονεν을 ‘있었습니다’로 옮겨, 라합 안에 믿음과 예언이 실제로 ‘존재했다’는 진술로 유지했습니다.
  alternative_readings:
  - ‘생겨났습니다’로 과정화함
  - ‘예언적 행위가 있었다’로 축소함
  rationale: 본문은 단순히 행동의 결과를 말하는 것이 아니라 라합 안에서 발견된 두 은사를 병렬로 제시합니다.
  doctrine_reference: 문장 상태 유지, 수사적 병렬 보존
