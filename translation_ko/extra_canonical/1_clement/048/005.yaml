review_pass:
  verdict: revise
  source_fidelity: 그리스어의 반복된 ἤτω τις는 각 덕목에 대한 일반적 권면입니다. ‘신실하다’, ‘지식을 풀어 설명할 수 있다’, ‘말을 분별하는 데 지혜롭다’, ‘행실에 있어서 순결하다’는 각 구절의 뜻을 충실히 반영합니다. λόγων의 복수는 한국어에서 ‘말을’로 자연스럽게 포괄할 수 있으며, ἁγνός는 단순한 청결보다 도덕적 순결을 뜻하므로 ‘순결해야 합니다’가 더 정확합니다.
  naturalness: ‘한 사람은’의 네 차례 반복은 현대 한국어에서 다소 부자연스럽고, ‘말들’도 이 문맥에서는 어색합니다. 첫 문장의 ‘어떤 사람이든’이 τις의 비특정성을 자연스럽게 나타내며, 뒤 문장들의 주어는 생략해도 권면의 병렬성이 유지됩니다.
  terminology: ‘신실하다’는 πιστός의 공동체적·도덕적 충실성을 잘 전달합니다. ‘지식을 풀어 설명하다’는 γνῶσιν ἐξεπεῖν의 해설·진술 의미를 유지합니다. ‘순결하다’는 ἁγνός에 적절하며 특정 교파적 해석을 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ‘한 사람은’의 반복
    rationale: 원문의 반복 구조를 기계적으로 따르면서 현대 한국어 문체가 경직되었습니다. ‘어떤 사람이든’으로 비특정 일반성을 한 번 제시하고 병렬 서술을 이어 가는 편이 자연스럽습니다.
  - severity: low
    issue: ‘말들을 분별하다’
    rationale: λόγων은 복수이나 한국어에서는 이와 같은 일반적 대상에 단수형 ‘말을’이 자연스럽습니다.
  - severity: medium
    issue: ‘깨끗해야 합니다’
    rationale: ἁγνός는 행위와 관련된 도덕적 순결을 가리킵니다. ‘순결해야 합니다’가 의미를 더 정확히 보존합니다.
  - severity: low
    issue: 무내용 각주 표지 [a]
    rationale: 제시된 각주 내용이 없으므로 표지를 유지할 근거가 없습니다. 표지와 각주를 제거해 구조를 정리합니다.
  revised_text: 어떤 사람이든 신실해야 합니다. 지식을 풀어 설명할 수 있어야 합니다. 말을 분별하는 데 지혜로워야 합니다. 행실에 있어서 순결해야 합니다.
