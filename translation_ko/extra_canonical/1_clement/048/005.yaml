  text: Let one be faithful; let one be able to expound knowledge; let one be wise in discerning words; let one be pure in works.
translation:
  language: ko
  text: 어떤 사람이든 신실해야 합니다. 지식을 풀어 설명할 수 있어야 합니다. 말을 분별하는 데 지혜로워야 합니다. 행실에 있어서 순결해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τις
  english_pob_choice: one
  chosen_korean: 한 사람
  alternatives_korean:
  - 어떤 사람
  - 누구든지
  lexicon: indefinite pronoun
  rationale: 영어 POB의 'one'처럼 성별을 특정하지 않는 일반적 인칭으로 옮기되, 한국어에서는 반복되는 행위 주체를 자연스럽게 받치도록 '한 사람'을 사용했습니다.
- source_word: πιστός
  english_pob_choice: faithful
  chosen_korean: 신실해야 합니다
  alternatives_korean:
  - 믿음직해야 합니다
  - 믿음이 있어야 합니다
  lexicon: faithful
  rationale: 단순한 내적 신념보다 공동체적·도덕적 신실성을 드러내기 위해 '신실하다'를 택했습니다.
- source_word: γνῶσιν ἐξεπεῖν
  english_pob_choice: be able to expound knowledge
  chosen_korean: 지식을 풀어 설명할 수 있어야 합니다
  alternatives_korean:
  - 지식을 말해 낼 수 있어야 합니다
  - 지식을 해석할 수 있어야 합니다
  lexicon: expound/explain knowledge
  rationale: '''ἐξεπεῖν''의 발화·해설 뉘앙스를 살려, 지식을 단순히 ''아는'' 것이 아니라 풀어서 설명하는 능력으로 옮겼습니다.'
- source_word: διακρίσει λόγων
  english_pob_choice: discerning words
  chosen_korean: 말들을 분별하는 데
  alternatives_korean:
  - 말을 분별하는 데
  - 말의 분별에서
  lexicon: discerning/words
  rationale: 복수형 λόγων을 반영해 '말들'로 옮겼고, 지혜의 영역을 드러내기 위해 '분별하는 데 지혜롭다'로 구성했습니다.
theological_decisions:
- issue: 성별을 특정하지 않는 συνεχ적 권면의 전달
  chosen_reading: '''τις''를 남성 일반어로 좁히지 않고 ''한 사람''으로 번역했습니다.'
  alternative_readings:
  - '''한 남자'''
  - '''어떤 이'''
  rationale: 영어 POB가 revised 'one'으로 정리한 것을 따라, 원문이 요구하지 않는 성별 한정을 피하면서 일반적 권면의 보편성을 유지했습니다.
  doctrine_reference: 문맥상 직분/덕목 일반을 권면하는 수사로 이해
