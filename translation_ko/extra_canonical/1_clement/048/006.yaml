base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/006.yaml
  text: For he ought to be all the more humble[a], the greater he seems to be, and to seek what is beneficial to all, and not what is his own.
  footnotes:
  - marker: a
    text: Or 'Yet by so much the more he ought to be humble, by as much as he seems to be greater'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 더 큰 사람으로 여겨질수록 더욱 겸손해야 하고,[a] 모든 이에게 유익한 것을 구하며 자기 것을 구하지 말아야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 더 크게 여겨질수록 그만큼 더 겸손해야 합니다.”
    reason: τοσούτῳ μᾶλλον … ὅσῳ μᾶλλον의 비례적 상관 구문을 보다 직역적으로 드러내는 대안 번역입니다.
lexical_decisions:
- source_word: ταπεινοφρονεῖν
  english_pob_choice: to be all the more humble
  chosen_korean: 더욱 겸손해야 하며
  alternatives_korean:
  - 더 겸손해야 하며
  - 낮은 마음을 가져야 하며
  lexicon: ταπεινοφρονεῖν
  rationale: ‘겸손하다’는 현대 한국어에서 가장 자연스럽게 낮은 마음가짐을 드러내며, 동사적 의무를 ‘-해야 하며’로 살렸습니다.
- source_word: δοκεῖ μᾶλλον μείζων εἶναι
  english_pob_choice: the greater he seems to be
  chosen_korean: 더 크게 여겨질수록
  alternatives_korean:
  - 더 크다고 보일수록
  - 더 위대해 보일수록
  lexicon: δοκεῖν / μείζων
  rationale: 외양상 더 크게 ‘여겨진다’는 뉘앙스를 살려, 실제 크기보다 인식상의 우위를 강조했습니다.
- source_word: τὸ κοινωφελὲς πᾶσιν
  english_pob_choice: what is beneficial to all
  chosen_korean: 모든 이에게 유익한 것을
  alternatives_korean:
  - 모두에게 유익한 것을
  - 공동의 유익을
  lexicon: κοινωφελές
  rationale: 공익적 의미를 직역하되, 한국어 문장에서는 목적어로 자연스럽게 들리도록 ‘유익한 것’을 택했습니다.
- source_word: τὸ ἑαυτοῦ
  english_pob_choice: what is his own
  chosen_korean: 자기 것을
  alternatives_korean:
  - 자기 자신의 것을
  - 자신에게 속한 것을
  lexicon: ἑαυτοῦ
  rationale: 대조 구조를 간결하게 유지하면서, 공동선과 대비되는 개인적 이익을 분명히 했습니다.
theological_decisions:
- issue: 공동체적 유익과 개인적 이익의 대비
  chosen_reading: ‘모든 이에게 유익한 것’을 구하고 ‘자기 것’을 구하지 말라는 권면으로, 지도자/은사를 받은 사람의 자세를 공동체 우선의 윤리로 드러냈습니다.
  alternative_readings:
  - 공익을 추구하고 사익을 추구하지 말라는 식의 사회윤리적 일반화
  - 자기 유익을 버리고 남의 유익만을 찾으라는 과도한 확대
  rationale: 본문은 추상적 도덕론보다 교회 공동체 안에서의 태도를 말하므로, 공동체적 책임을 유지하면서도 과도한 일반화를 피했습니다.
  doctrine_reference: 교회 윤리, 겸손, 공동체적 덕목
