review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the proportional construction τοσούτῳ μᾶλλον ... ὅσῳ μᾶλλον, the obligation ὀφείλει, and the contrast between what benefits all and what is one's own. However, ‘더 크게 여겨질수록’ can naturally be understood as physical size in Korean; μείζων here concerns perceived greatness or standing.
  naturalness: The sentence is fluent in modern formal-polite Korean. Specifying ‘더 큰 사람으로’ removes an avoidable ambiguity while retaining the Greek’s sense that the greatness is a matter of appearance or estimation. The footnote anchor should be paired with an actual Korean footnote.
  terminology: ‘겸손해야’, ‘모든 이에게 유익한 것’, and ‘자기 것’ are appropriate, natural equivalents. ‘자기 것’ retains the Greek’s broad wording rather than unnecessarily narrowing it to material possessions or personal profit.
  issues:
  - severity: low
    issue: ‘더 크게 여겨질수록’ is semantically ambiguous in Korean.
    rationale: In ordinary Korean it may suggest being regarded as physically larger. The comparative μείζων in this context denotes being considered greater in standing or importance; ‘더 큰 사람으로 여겨질수록’ conveys this naturally.
  - severity: medium
    issue: The draft contains the anchor [a] but supplies no corresponding Korean footnote.
    rationale: An anchored note must be provided so that the note structure is complete and the alternative proportional rendering is available to readers.
