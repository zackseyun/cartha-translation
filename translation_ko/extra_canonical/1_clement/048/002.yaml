id: 1CLEM.48.2
reference: 1 Clement 48:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πύλη γὰρ δικαίσύνης ἀνεῳγυῖα εἰς ζωὴν αὐτὴ, καθὼς γέγραπται· Ἀνοίξατέ μοι πύλας δικαιοσύνης· εἰσελθὼν ἐν αὐταῖς ἐξομολογήσομαι τῷ κυρίῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/002.yaml
  text: 'For this is the gate of righteousness[a], opened unto life itself, just as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.”'
  footnotes:
  - marker: a
    text: Or 'For a gate of righteousness has been opened—this very gate into life—'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 의의 문이요, 생명으로 열린 문입니다. “내게 의의 문들을 열어 주십시오. 내가 그 문들로 들어가 여호와께 감사드리겠습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύλη γὰρ δικαίσύνης
  english_pob_choice: For this is the gate of righteousness
  chosen_korean: 이는 의의 문이요
  alternatives_korean:
  - 의의 문입니다
  - 의로움의 문입니다
  lexicon: πύλη, δικαιοσύνη
  rationale: 그리스어의 동일시 구조를 살려 ‘이는’으로 시작했고, δικαιοσύνη는 이 문맥에서 윤리적 ‘의’로 보는 것이 자연스러워 ‘의의 문’으로 옮겼습니다.
- source_word: ἀνεῳγυῖα εἰς ζωὴν
  english_pob_choice: opened unto life itself
  chosen_korean: 생명으로 열린 문입니다
  alternatives_korean:
  - 생명에 이르도록 열린 문입니다
  - 생명 자체로 열린 문입니다
  lexicon: ἀνοίγω, ζωή
  rationale: ‘열린’이라는 완료적 상태를 살리되, εἰς ζωὴν은 목적·지향을 드러내므로 ‘생명으로’로 간결하게 옮겼습니다.
- source_word: Ἀνοίξατέ μοι πύλας δικαιοσύνης
  english_pob_choice: Open to me the gates of righteousness
  chosen_korean: “내게 의의 문들을 열어 주십시오
  alternatives_korean:
  - “내게 의의 문들을 여십시오
  - “의의 문들을 내게 열어 주십시오
  lexicon: Ἀνοίξατέ μοι, πύλας δικαιοσύνης
  rationale: 복수형 πύλας를 그대로 살려 ‘문들’로 옮겼고, 간청형은 현대 한국어에서 자연스러운 ‘열어 주십시오’로 표현했습니다.
- source_word: ἐξομολογήσομαι τῷ κυρίῳ
  english_pob_choice: I will give thanks to the Lord
  chosen_korean: 내가 그 문들로 들어가 여호와께 감사드리겠습니다
  alternatives_korean:
  - 내가 그 문들로 들어가 주님께 감사드리겠습니다
  - 내가 그 문들로 들어가 여호와를 찬송하겠습니다
  lexicon: ἐξομολογέομαι, κύριος
  rationale: ἐξομολογέομαι는 여기서 ‘감사/찬양의 고백’을 뜻하므로 ‘감사드리겠습니다’로 옮겼고, 시편 인용으로 보이는 κύριος는 야훼로 처리했습니다.
theological_decisions:
- issue: 시편 인용 속 κύριος의 지칭
  chosen_reading: 본문의 τῷ κυρίῳ는 야훼를 가리키는 시편 인용으로 보고 ‘여호와’ 대신 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 일반화하여 번역
  - 전통적 교회 번역에 따라 ‘여호와’로 번역
  rationale: 이 단락은 명시적 인용문으로, 원문 인용의 야훼 지칭을 드러내는 것이 POB의 출처 추적 원칙에 더 부합합니다.
  doctrine_reference: OT citation / divine-name rendering
