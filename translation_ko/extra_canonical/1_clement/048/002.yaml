  to: 이는 생명 자체에 이르도록 열린 의의 문입니다.[a] “내게 의의 문들을 열어 주십시오. 내가 그 문들로 들어가 주님께 감사드리겠습니다.”
  rationale: 첫 문장을 원문의 특정한 ‘의의 문’에 대한 동일시로 유지하면서, ἀνεῳγυῖα의 완료 상태와 εἰς ζωὴν의 지향, αὐτή의 강조를 ‘생명 자체에 이르도록 열린’으로 옮겼습니다. 인용문은 복수 ‘문들’과 미래의 감사 표현을 유지했습니다. κύριος는 그리스어 본문과 영어 POB에 맞추어 ‘주님’으로 보존했습니다. 영어 POB 감사 주석에 대응하는 한국어 주석을 앵커와 함께 제공합니다.
