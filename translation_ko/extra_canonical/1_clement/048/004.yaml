  to: 그러므로 많은 문이 열려 있으나, 의로움 안에 있는 이 문이 곧 그리스도 안에 있는 문입니다. 그 문으로 들어가 거룩함과 의로움 가운데서 자기 길을 바르게 이끌며, 모든 일을 동요함 없이 이루는 모든 이는 복된 사람들입니다.
  rationale: 반복된 관사와 생략된 ‘문’을 살려 ‘의로움 안에 있는 이 문’과 ‘그리스도 안에 있는 문’의 동일시를 명시했습니다. εἰσελθόντες의 선행 행위와 κατευθύνοντες 및 ἐπιτελοῦντες의 계속 행위를 한국어 연결 구조로 자연스럽게 보존했습니다. 근거 없는 본문 각주 표지는 제거했습니다.
