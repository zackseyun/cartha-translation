id: 1CLEM.48.4
reference: 1 Clement 48:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πολλῶν οὖν πυλῶν ἀνεῳγυιῶν ἡ ἐν δικαιοσύνῃ αὕτη ἡ ἐστὶν ἡ ἐν Χριστῷ, ἐν ᾗ μακάριοι πάντες οἱ εἰσελθόντες καὶ κατευθύνοντες τὴν πορείαν αὐτῶν ἐν ὁσιότητι καὶ δικαιοσύνῃ, ἀταράχως πάντα ἐπιτελοῦντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/004.yaml
  text: Therefore[a], though many gates stand open, this gate in righteousness is the one in Christ, in which all who have entered and are directing their course in holiness and righteousness, accomplishing all things without disturbance[b], are blessed.
  footnotes:
  - marker: a
    text: Or 'this is the gate in righteousness—the one in the Messiah'.
    reason: previous_rendering
  - marker: b
    text: Or 'who entered through it and who direct'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 많은 문이 열려 있으나, 의로움 안에 있는 이 문이 곧 그리스도 안에 있는 문입니다. 그 문으로 들어가 거룩함과 의로움 가운데서 자기 길을 바르게 이끌며, 모든 일을 동요함 없이 이루는 모든 이는 복된 사람들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶν / ἡ ἐν δικαιοσύνῃ αὕτη ... ἡ ἐν Χριστῷ
  english_pob_choice: though many gates stand open, this gate in righteousness is the one in Christ
  chosen_korean: 많은 문이 열려 있지만, 이 의로움의 문 곧 메시아 안에 있는 그 문
  alternatives_korean:
  - 이 의의 문
  - 이 의로움 안에 있는 문
  - 메시아 안에 있는 의의 문
  lexicon: πύλη / δικαιοσύνη / Χριστός
  rationale: 원문의 반복된 여성형 관사 구조를 살려 ‘이 의로움의 문’과 ‘그 문’으로 대응시켰고, δικαιοσύνη는 여기서 추상적 ‘의’보다 문의 성격을 드러내는 ‘의로움’이 문맥상 자연스럽습니다. Χριστός는 이 문맥에서 고유명사적 용법이지만, 1세기 문헌의 메시아적 배경을 드러내기 위해 ‘메시아’로 옮겼습니다.
- source_word: ἐν ᾗ
  english_pob_choice: in which
  chosen_korean: 그 문 안에서
  alternatives_korean:
  - 그 안에서
  - 그곳에서
  lexicon: ἐν + 관계대명사
  rationale: 관계대명사 ᾗ가 앞선 ‘문’을 가리키므로, 한국어에서는 자연스럽게 ‘그 문 안에서’로 처리해 관계를 분명히 했습니다.
- source_word: εἰσελθόντες καὶ κατευθύνοντες τὴν πορείαν αὐτῶν
  english_pob_choice: who have entered and are directing their course
  chosen_korean: 들어간 모든 이들, 그리고 거룩함과 의로 자기 길을 바로잡으며
  alternatives_korean:
  - 들어와 자기 길을 바로잡는 이들
  - 들어가고 자기 여정을 이끄는 이들
  - 들어가서 자기 길을 곧게 하는 이들
  lexicon: εἰσελθόντες / κατευθύνοντες τὴν πορείαν
  rationale: aorist participle와 present participle의 대비를 살리되, πορείαν을 직역한 ‘여정’보다 한국어에서 ‘자기 길’이 더 자연스러워 선택했습니다. κατευθύνοντες는 단순 이동이 아니라 방향을 바로잡는 뉘앙스가 있어 ‘바로잡으며’로 옮겼습니다.
- source_word: ἀταράχως πάντα ἐπιτελοῦντες
  english_pob_choice: accomplishing all things without disturbance
  chosen_korean: 방해받음 없이 모든 일을 이루는
  alternatives_korean:
  - 평온하게 모든 일을 이루는
  - 흔들림 없이 모든 일을 이루는
  - 어지럽힘 없이 모든 일을 수행하는
  lexicon: ἀταράχως / ἐπιτελοῦντες
  rationale: ἀταράχως는 내적 평정만이 아니라 방해·혼란이 없는 상태를 포함하므로, POB의 ‘without disturbance’에 맞춰 ‘방해받음 없이’로 옮겼습니다. ἐπιτελοῦντες는 ‘성취하다/이루다’의 완료적 뉘앙스를 살려 ‘이루는’으로 처리했습니다.
theological_decisions:
- issue: Χριστῷ의 번역어 선택
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: POB의 기본 용례와 본문의 메시아적 호칭을 반영해 ‘메시아’로 옮겼습니다. 다만 뒤집기식 설명이 아니라 ‘안에 있는’이라는 관계를 살려 문장 안에서 고유명사처럼 읽히게 했습니다.
  doctrine_reference: 그리스도론 / 메시아 칭호
- issue: ‘복됩니다’의 문장 종결
  chosen_reading: 복됩니다
  alternative_readings:
  - 복되다
  - 복이 있습니다
  rationale: μακάριοι πάντες는 선언적 복을 나타내므로, 합쇼체에서 서술적으로 단정하는 ‘복됩니다’가 가장 직접적입니다.
  doctrine_reference: 복 선언 (beatitude)
