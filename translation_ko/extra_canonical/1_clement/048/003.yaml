id: 1CLEM.48.3
reference: 1 Clement 48:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: αὕτη ἡ πύλη τοῦ κυρίου· δίκαιοι εἰσελεύσονται ἐν αὐτῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/003.yaml
  text: “This is the gate of the Lord; the righteous will enter through it.”
translation:
  language: ko
  text: 이것이 주님의 문입니다. 의인들은 그 문으로 들어갈 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πύλη
  english_pob_choice: the gate
  chosen_korean: 문
  alternatives_korean:
  - 문지방
  - 성문
  - 입구
  lexicon: πύλη
  rationale: 문맥상 출입을 가리키는 상징적 표현으로, 한국어에서는 가장 자연스러운 대응인 ‘문’이 직접성과 가독성을 함께 살립니다. '성문'은 도시 문으로 한정될 수 있어 여기서는 좁습니다.
- source_word: τοῦ κυρίου
  english_pob_choice: of the Lord
  chosen_korean: 주님의
  alternatives_korean:
  - 주님의 문
  - 주님의 성문
  - 주님의 문간
  lexicon: κύριος
  rationale: 주(κύριος)를 예수/하나님을 가리키는 경칭으로 읽어 한국어 교회 문맥에 자연스러운 '주님'을 택했습니다. 소유격은 '-의'로 직역하기보다 관용적으로 '주님의'로 살렸습니다.
- source_word: δίκαιοι
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  - 의롭다 하심을 받은 사람들
  lexicon: δίκαιος
  rationale: 복수 주어의 보편적 의미를 살려 '의인들'로 번역했습니다. '의로운 사람들'은 설명적이고, '의롭다 하심을 받은 사람들'은 본문 이상으로 신학적 해석을 덧붙입니다.
- source_word: εἰσελεύσονται ἐν αὐτῇ
  english_pob_choice: will enter through it
  chosen_korean: 그 문으로 들어갈 것입니다
  alternatives_korean:
  - 그 안으로 들어갈 것입니다
  - 그 문을 통해 들어갈 것입니다
  - 그것으로 들어갈 것입니다
  lexicon: εἰσέρχομαι + ἐν
  rationale: 동사와 전치사의 결합을 한국어에서는 목적지/수단을 함께 드러내는 '그 문으로 들어가다'로 자연스럽게 옮겼습니다. '그것으로'는 한국어상 어색하고, '안으로'는 문(문턱/문틀)의 이미지를 약화합니다.
theological_decisions:
- issue: ‘주님의 문’의 주어적/상징적 의미
  chosen_reading: 이 표현은 단순한 건축물의 문이라기보다 하나님께 속한 प्रवेश의 상징으로 읽되, 본문이 허락하는 범위 안에서만 직역했습니다.
  alternative_readings:
  - ‘주님의 성전 문’으로 구체화
  - ‘구원의 문’으로 해석적 확장
  rationale: 본문에는 성전이나 구원이라는 추가 명사가 없으므로, 상징성은 유지하되 해석을 과도하게 덧붙이지 않았습니다.
  doctrine_reference: 본문 충실성 및 절제된 상징 해석
- issue: ‘의인들’의 범위
  chosen_reading: 문맥상 하나님 앞에서 의로운 자들 전체를 가리키는 일반적 표현으로 처리했습니다.
  alternative_readings:
  - 언약 공동체 안의 의인
  - 종말론적 심판을 통과한 자
  rationale: 원문은 범주를 열어 둔 간명한 진술이므로, 특정 교리 체계로 좁히지 않고 일반적 의인 표지를 유지했습니다.
  doctrine_reference: δικαιος의 일반적 의미 보존
