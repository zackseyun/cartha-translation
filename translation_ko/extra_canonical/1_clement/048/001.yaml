id: 1CLEM.48.1
reference: 1 Clement 48:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐξάρωμεν οὖν τοῦτο ἐν τάχει καὶ προσπέσωμεν τῷ δεσπότῃ καὶ κλαύσωμεν ἱκετεύοντες αὐτόν, ὅπως ἵλεως γενόμενος ἐπικαταλλαγῇ ἡμῖν καὶ ἐπὶ τὴν σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν ἀποκαταστήσῃ ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048/001.yaml
  text: Let us therefore put this away quickly, and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the solemn and pure conduct of our brotherly love.
  footnotes:
  - marker: a
    text: Or 'the pure conduct befitting our solemn brotherly love.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이 일을 속히 버리고, 주님 앞에 엎드려 울며 그분께 간청합시다. 그러면 그분이 은혜로우신 분이 되셔서 우리와 화목하시고, 우리를 형제 사랑의 엄숙하고 순결한 행실로 다시 돌이키실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο ἐν τάχει ἐξάρωμεν
  english_pob_choice: put this away quickly
  chosen_korean: 이 일을 속히 버리고
  alternatives_korean:
  - 이것을 빨리 치워 버리고
  - 이 일을 신속히 없애고
  lexicon: ἐξαίρω
  rationale: 문맥상 당장 제거해야 할 문제를 가리키므로, 한국어에서는 자연스럽고 직접적인 「버리고」로 옮겨 긴급성을 살렸습니다.
- source_word: τῷ δεσπότῃ
  english_pob_choice: the Master
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주권자
  lexicon: δεσπότης
  rationale: 권위를 지닌 호칭이지만, 기도와 간구의 대상이라는 점을 살려 예배적 호칭인 「주님」을 택했습니다.
- source_word: ἐπικαταλλαγῇ ἡμῖν
  english_pob_choice: he may be reconciled to us
  chosen_korean: 우리와 화목하시고
  alternatives_korean:
  - 우리와 화해하시고
  - 우리와 다시 화목하게 되시고
  lexicon: ἐπικαταλλάσσω
  rationale: 동사가 상호 화목의 회복을 뜻하므로, 관계 회복을 분명히 드러내는 「화목하시고」로 처리했습니다.
- source_word: τὴν σεμνὴν ... ἁγνὴν ἀγωγήν
  english_pob_choice: the solemn and pure conduct
  chosen_korean: 엄숙하고 순결한 행실
  alternatives_korean:
  - 경건하고 순결한 행실
  - 엄정하고 깨끗한 행실
  lexicon: σεμνός; ἁγνός; ἀγωγή
  rationale: 두 형용사가 모두 ἀγωγή(행실)를 수식하므로, 어순을 보존하면서도 한국어에서 의미가 살아나도록 「엄숙하고 순결한 행실」로 옮겼습니다.
theological_decisions:
- issue: δεσπότης 호칭의 한국어 처리
  chosen_reading: 직역적 「주님」보다 관계적·예배적 호칭으로 읽히는 「주님」을 본문에 사용했습니다.
  alternative_readings:
  - 주인
  - 전능하신 주인
  rationale: 이 문맥은 피조물이 주께 엎드려 간구하는 장면이므로, 한국어 독자에게도 경배와 간구의 정서를 살리는 호칭이 적절합니다.
  doctrine_reference: 그리스도의 주되심과 기도 대상의 존칭 표현
