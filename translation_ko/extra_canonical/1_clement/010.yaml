base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010.yaml
  text: Abraham[v3], who was called the friend, was found faithful in that he became obedient to the words of God. 2 And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a small land and a weak kindred and a little house, he might inherit the promises of God. For he says to him, 3 “Go out from your land and from your kindred and from your father’s house into the land that I will show you; and I will make you into a great nation, and I will bless you and magnify your name[v6], and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.” 4 And again, when he was separated from Lot, God said to him, “Lift up your eyes and see from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see, I will give to you and to your seed forever. 5 And I will make your seed like the sand
    of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.” 6 And again he says, “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your seed be.’” And Abraham believed God, and it was counted to him for righteousness. 7 Because of faith and hospitality a son was given to him in old age[v7], and through obedience he offered him as a sacrifice to God on one of the mountains that he showed him.
  footnotes:
  - marker: v3
    text: Clement's citation follows the Greek scriptural form and reads 'tribes of the earth' here rather than the more familiar English wording 'families of the earth.'
    reason: lexical_alternative
  - marker: v6
    text: Or 'it was reckoned to him as righteousness.'
    reason: lexical_alternative
  - marker: v7
    text: The phrase 'because of faith and hospitality' preserves Clement's wording and paraenetic emphasis on Abraham's concrete virtue toward others.
    reason: cross_reference
translation:
  language: ko
  text: 아브라함은 「친구」라고 불린 사람으로서, 하나님의 말씀에 순종하여 종속되지 않는 믿음이 있는 사람으로 드러났습니다. 2 그는 순종함으로 자기 땅과 친족과 아버지의 집을 떠났습니다. 그렇게 해서 작은 땅과 약한 친족과 작은 집을 뒤로 남겨 두고도 하나님의 약속을 상속받으려는 것이었습니다. 하나님께서 그에게 말씀하시기를, 3 「네 땅과 네 친족과 네 아버지의 집에서 나와 내가 네게 보여 줄 땅으로 가라. 내가 너를 큰 민족이 되게 하고 너를 복 주며 네 이름을 크게 하리니, 너는 복을 받을 것이다. 또 너를 복 주는 자들에게 복을 주고 너를 저주하는 자들에게는 저주를 내리겠다. 땅의 모든 지파가 네 안에서 복을 받을 것이다.」 4 또 그가 롯과 갈라섰을 때 하나님께서 그에게 말씀하셨습니다. 「네 눈을 들어 네가 지금 있는 곳에서 북쪽과 남쪽과 동쪽과 바다를 바라보아라. 네가 보는 이 모든 땅을 내가 너와 네 씨에게 영원히 주겠다. 5 내가 네 씨를 땅의 모래처럼 만들겠다. 땅의 모래를 셀 수 있는 사람이 있다면 네 씨도 셀 수 있을 것이다.」 6 또 이렇게 말씀하셨습니다. 「하나님이 아브라함을 밖으로 이끌어 내시고 그에게 말씀하셨다. ‘하늘을 바라보고 별들을 세어 보아라. 셀 수 있으면 세어 보라. 네 씨도 그와 같을 것이다.’」 아브라함은 하나님을 믿었고, 그것이 그에게 의로 여겨졌습니다. 7 믿음과 나그네를 잘 대접함 때문에 그에게 늙어서 아들이 주어졌고, 순종으로 그는 하나님께 그것을 제물로 바쳤습니다. 하나님께서 그에게 보여 주신 산들 가운데 하나에서였습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φίλος προσαγορευθείς
  english_pob_choice: who was called the friend
  chosen_korean: 「친구」라고 불린 사람
  alternatives_korean:
  - 하나님의 친구라고 불린 사람
  - 그 친구라고 불린 사람
  lexicon: BDAG
  rationale: 아브라함의 호칭적 표현을 살리되, 본문 자체에는 ‘하나님의’가 없으므로 과잉 해석을 피했습니다.
- source_word: πιστὸς εὑρέθη ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι
  english_pob_choice: was found faithful in that he became obedient
  chosen_korean: 하나님의 말씀에 순종하여 종속되지 않는 믿음이 있는 사람으로 드러났습니다
  alternatives_korean:
  - 신실한 사람으로 드러났습니다
  - 믿음이 있는 것으로 드러났습니다
  lexicon: BDAG
  rationale: 원문의 ‘faithful’와 ‘became obedient’의 결합을 함께 살리려 했습니다. 다만 ‘종속되지 않는’은 원문에 없는 표현이므로 부적절하여 제거하는 것이 옳습니다.
- source_word: ὑπακοῇ
  english_pob_choice: in obedience
  chosen_korean: 순종함으로
  alternatives_korean:
  - 순종 가운데
  - 순종하여
  lexicon: BDAG
  rationale: 아브라함의 출발이 순종의 방식으로 이루어졌다는 점을 자연스러운 한국어로 옮겼습니다.
- source_word: συγγένεια
  english_pob_choice: kindred
  chosen_korean: 친족
  alternatives_korean:
  - 친족 집안
  - 혈족
  lexicon: BDAG
  rationale: 가족 집단을 가리키는 말로, 한국어에서 가장 직접적이고 무난한 대응어입니다.
- source_word: ἐπαγγελίας
  english_pob_choice: promises
  chosen_korean: 약속
  alternatives_korean:
  - 약속들
  - 언약의 약속
  lexicon: BDAG
  rationale: 복수형이지만 한국어에서는 문맥상 집합적으로 ‘약속’이라 옮기면 자연스럽습니다.
- source_word: φυλαὶ
  english_pob_choice: tribes
  chosen_korean: 지파
  alternatives_korean:
  - 족속
  - 가문
  lexicon: BDAG
  rationale: 클레멘트의 그리스어는 친숙한 ‘families’가 아니라 ‘tribes’를 따르므로 그 차이를 반영했습니다.
- source_word: σπέρμα
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 후손
  lexicon: BDAG
  rationale: 아브라함 언약의 상징적·성경적 용례를 살리기 위해 ‘씨’를 유지했습니다.
- source_word: ἐλογίσθη αὐτῷ εἰς δικαιοσύνην
  english_pob_choice: it was counted to him for righteousness
  chosen_korean: 그것이 그에게 의로 여겨졌습니다
  alternatives_korean:
  - 그에게 의로 계산되었습니다
  - 그에게 의로 간주되었습니다
  lexicon: BDAG
  rationale: 의의 산정이라는 신학적 표현을 한국어 성경 문체로 간결하게 옮겼습니다.
- source_word: φιλοξενίαν
  english_pob_choice: hospitality
  chosen_korean: 나그네를 잘 대접함
  alternatives_korean:
  - 환대
  - 접대
  lexicon: BDAG
  rationale: 단순한 예절보다 ‘낯선 이를 맞아들임’의 함의를 드러내려면 이 표현이 더 분명합니다.
theological_decisions:
- issue: 아브라함의 믿음과 순종의 관계
  chosen_reading: 아브라함은 믿음으로 의롭다 여겨졌고, 그 믿음은 순종과 나그네 대접이라는 실제 행위로 드러났다고 번역했습니다.
  alternative_readings:
  - 믿음만을 강조해 순종과 환대의 연결을 약화시키는 번역
  - 행위 공로처럼 읽히지 않도록 표현을 더 완화하는 번역
  rationale: 클레멘트의 문맥은 아브라함을 행위 없는 추상적 신앙이 아니라 구체적 순종의 본보기로 제시합니다. 다만 공로주의로 흐르지 않도록 ‘의로 여겨졌습니다’로 마무리했습니다.
  doctrine_reference: 믿음과 행위의 관계를 문맥대로 유지하되 공로주의는 피함
- issue: ‘친구’ 호칭의 범위
  chosen_reading: 본문의 호칭을 단순한 별칭으로 두고, ‘하나님의 친구’로 확장하지 않았습니다.
  alternative_readings:
  - 전통적 문구에 맞춰 ‘하나님의 친구’로 옮김
  rationale: 원문에는 정관사와 호칭만 있고 ‘하나님의’는 명시되지 않습니다. 따라서 주석 없는 확장은 피하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 원문 밖의 신학적 확장 자제
