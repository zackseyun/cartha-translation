id: 1CLEM.05
reference: 1 Clement 5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀλλʼ ἵνα τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα, ἔλθωμεν ἐπὶ τοὺς ἔγγιστα γενομένους ἀθλητάς· λάβωμεν τῆς γενεᾶς ἡμῶν τὰ γενναῖα ὑποδείγματα. 2. διὰ ζῆλον καὶ φθόνον οἱ μέγιστοι καὶ δικαιότατοι στῦλοι ἐδιώχθησαν καὶ ἕως θανάτου ἤθλησαν. 3. λάβωμεν πρὸ ὀφθαλμῶν ἡμῶν τοὺς ἀγαθοὺς ἀποστόλους· 4. Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης. 5. διὰ ζῆλον καὶ ἔριν Παῦλος ὑπομονῆς βραβεῖον ἔδειξεν, 6. ἑπτάκις δεσμὰ φορέσας, φυγαδευθείς, λιθασθείς, κῆρυξ γενόμενος ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει, τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν, 7. δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
  pages:
  - 267
  - 269
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005.yaml
  text: 'But to leave the examples of the ancients[a], let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation. Because of jealousy and envy, the greatest and most righteous pillars were persecuted and contended even to death. Let us set before our eyes the good apostles: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the place of glory that was due him. Because of jealousy and strife, Paul showed the prize of endurance: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith, having taught righteousness to the whole world and having come to the farthest limit of the west; and having borne witness before the rulers, so he was released from the world and went to the holy place[f][e][d][c][b], having become the greatest pattern
    of endurance.'
  footnotes:
  - marker: a
    text: Or 'champions'; the Greek keeps an athletic-contest image throughout the chapter.
    reason: lexical_alternative
  - marker: b
    text: '''Having borne witness'' may also carry the sense ''having suffered martyrdom'' in this context.'
    reason: lexical_alternative
  - marker: c
    text: '''The farthest limit of the west'' is often understood as a reference to the western extremity of the Roman world; some identify it specifically with Spain, though the text itself does not name the place.'
    reason: cultural_note
  - marker: d
    text: '''Righteousness'' could also be rendered ''justice'' here.'
    reason: lexical_alternative
  - marker: e
    text: Or 'to stop with the examples of the ancients'.
    reason: previous_rendering
  - marker: f
    text: Or 'showed what is the prize of endurance'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 옛 예들의 경우를 그만두고, 우리 시대와 가장 가까운 경기자들에게로 나아갑시다. 우리 세대에서 나온 고귀한 본보기들을 받아들입시다. 시기와 질투 때문에 가장 위대하고 가장 의로운 기둥들이 박해를 받았고, 죽음에 이르기까지 싸웠습니다. 우리 눈앞에 선한 사도들을 두십시오. 베드로는 부당한 시기 때문에 한두 번이 아니라 여러 번의 고난을 견뎌 내고, 그렇게 증언한 뒤 마땅히 그에게 돌아갈 영광의 자리로 갔습니다. 시기와 다툼 때문에 바울은 인내의 상을 보여 주었습니다. 그는 일곱 번이나 쇠사슬을 차고, 추방당하고, 돌에 맞고, 동쪽과 서쪽에서 전령이 되었으며, 그의 믿음의 고귀한 명성을 얻었습니다. 온 세상에 의를 가르치고, 서쪽의 가장 끝까지 이르렀으며, 통치자들 앞에서 증언한 뒤 그는 세상에서 풀려나 거룩한 곳으로 갔고, 인내의 가장 큰 본보기가 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθλητάς
  english_pob_choice: athletes
  chosen_korean: 경기자들
  alternatives_korean:
  - 선수들
  - 운동선수들
  - 투쟁자들
  lexicon: LSJ
  rationale: 본문의 경쟁·경기 은유를 살리기 위해 ‘경기자들’을 택했습니다. 일반적인 ‘선수들’보다 수사적이고, 단순한 ‘본보기들’로 평평해지지 않습니다.
- source_word: ὑποδείγματα
  english_pob_choice: examples
  chosen_korean: 본보기들
  alternatives_korean:
  - 예들
  - 모범들
  - 모델들
  lexicon: BDAG
  rationale: 앞뒤 문맥에서 따라야 할 사례라는 기능을 드러내면서도 자연스러운 표준어로 옮겼습니다. 반복되는 예시적 기능을 유지합니다.
- source_word: ζῆλον / φθόνον
  english_pob_choice: jealousy and envy
  chosen_korean: 시기와 질투
  alternatives_korean:
  - 시기와 부러움
  - 열심과 질투
  - 질투와 시기
  lexicon: BDAG
  rationale: 두 악덕이 병렬로 제시되므로 한국어에서도 구분되는 쌍으로 살렸습니다. ‘열심’은 오해를 낳으므로 배제했습니다.
- source_word: στῦλοι
  english_pob_choice: pillars
  chosen_korean: 기둥들
  alternatives_korean:
  - 지주들
  - 버팀목들
  - 지도자들
  lexicon: LSJ
  rationale: 공동체를 떠받치는 은유를 직설적으로 보존했습니다. ‘지도자들’로 바꾸면 비유적 힘이 약해집니다.
- source_word: μαρτυρήσας
  english_pob_choice: having borne witness
  chosen_korean: 증언한 뒤
  alternatives_korean:
  - 증언한 뒤
  - 순교한 뒤
  - 증거한 뒤
  lexicon: BDAG
  rationale: 기본 의미인 ‘증언’으로 옮기되, 이 문맥에서 가능한 순교 뉘앙스를 본문에 과잉 확정하지 않기 위해 완곡하게 처리했습니다.
- source_word: ὀφειλόμενον τόπον τῆς δόξης
  english_pob_choice: the place of glory that was due him
  chosen_korean: 마땅히 그에게 돌아갈 영광의 자리
  alternatives_korean:
  - 그에게 주어진 영광의 자리
  - 그가 받아야 할 영광의 자리
  - 정해진 영광의 자리
  lexicon: LSJ
  rationale: ὀφειλόμενον의 ‘빚진/마땅한’ 뉘앙스를 살리면서, 공로주의적으로 들리지 않도록 ‘돌아갈’로 표현했습니다.
- source_word: κῆρυξ
  english_pob_choice: herald
  chosen_korean: 전령
  alternatives_korean:
  - 선포자
  - 사자
  - 헤럴드
  lexicon: BDAG
  rationale: 공식 선포자의 뉘앙스를 살리면서도 현대 한국어에서 낯설지 않게 옮겼습니다. 교회직분 용어로 좁히지 않았습니다.
- source_word: ὑπομονῆς βραβεῖον
  english_pob_choice: the prize of endurance
  chosen_korean: 인내의 상
  alternatives_korean:
  - 인내의 상급
  - 견딤의 상
  - 인내의 보상
  lexicon: BDAG
  rationale: 경기 비유의 ‘상’을 살리면서, ὑπομονή를 ‘인내’로 번역해 문맥의 덕목을 분명히 했습니다.
- source_word: τὸ τέρμα τῆς δύσεως
  english_pob_choice: the farthest limit of the west
  chosen_korean: 서쪽의 가장 끝
  alternatives_korean:
  - 서쪽의 끝
  - 서쪽의 극한
  - 서쪽의 가장 먼 경계
  lexicon: LSJ
  rationale: 지리적 수사를 과도하게 특정하지 않으면서, 서방의 극점을 뜻하는 표현력을 유지했습니다.
- source_word: τὸν ἅγιον τόπον
  english_pob_choice: the holy place
  chosen_korean: 거룩한 곳
  alternatives_korean:
  - 성스러운 곳
  - 거룩한 장소
  - 성소
  lexicon: BDAG
  rationale: 본문이 특정 지점을 명시하지 않으므로 넓게 ‘거룩한 곳’으로 두었습니다. ‘성소’는 의미를 지나치게 구체화할 수 있습니다.
theological_decisions:
- issue: μαρτυρήσας의 의미 범위
  chosen_reading: 본문에는 ‘증언한 뒤’로 두어, 증언과 순교 가능성을 모두 열어 두었습니다.
  alternative_readings:
  - 순교한 뒤
  - 증언하며
  rationale: 이 문맥은 후대의 순교 의미를 강하게 떠올리게 하지만, 그리스어 자체는 먼저 ‘증언’입니다. 한국어 본문에서 의미를 확정적으로 좁히지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: 의미의 긴장 보존
- issue: 베드로의 ‘영광의 자리’
  chosen_reading: ‘마땅히 그에게 돌아갈 영광의 자리’로 옮겨, 보상·배당의 뉘앙스를 살리되 공로주의로는 굳히지 않았습니다.
  alternative_readings:
  - 그에게 주어진 영광의 자리
  - 그가 받아야 할 영광의 자리
  rationale: ὀφειλόμενον은 ‘빚진/마땅한’ 의미를 지니므로 이를 드러내야 합니다. 다만 신학적으로 행위 공로를 단정하지 않도록 한국어 어휘를 조절했습니다.
  doctrine_reference: 원어 우선성과 은혜-보상 긴장 보존
- issue: τὸ τέρμα τῆς δύσεως의 지리적 지시
  chosen_reading: ‘서쪽의 가장 끝’으로 일반화했습니다.
  alternative_readings:
  - 스페인
  - 로마 서쪽
  - 서방의 끝
  rationale: 본문 자체는 특정 지역명을 말하지 않으므로, 주석적 확정을 본문에 들여오지 않았습니다.
  doctrine_reference: 본문의 범위를 넘는 특정화 자제
