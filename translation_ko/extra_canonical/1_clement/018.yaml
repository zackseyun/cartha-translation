base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018.yaml
  text: 'And what shall we say about David[a], who has been testified to? concerning whom God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”


    But he too says to God:


    “Have mercy on me, O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawless deed.

    Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.

    Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged.

    For behold, in lawless deeds I was conceived,

    and in sins my mother conceived me.

    For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.

    You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.

    You will make me hear gladness and rejoicing;

    the bones that have been humbled will rejoice.

    Turn your face away from my sins,

    and blot out all my lawless deeds.

    Create in me a clean heart, O God,

    and renew a right spirit within me.

    Do not cast me away from your presence,

    and do not take your Holy Spirit from me.

    Restore to me the joy of your salvation[b],

    and strengthen me with a ruling spirit.

    I will teach the lawless your ways,

    and the ungodly will turn back to you.

    Deliver me from bloodguilt, O God, the God of my salvation.

    My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.

    For if you had desired sacrifice, I would have given it;

    in whole burnt offerings you will not delight.

    A sacrifice to God is a broken spirit[c][d][e][f][g][h];

    a broken and humbled heart God will not despise.”'
  footnotes:
  - marker: a
    text: The wording combines language known from scriptural testimony about David; Clement invokes David as one already publicly attested by God.
    reason: cross_reference
    anchor_ref: '18:1'
  - marker: b
    text: The Greek here reads 'my mother nursed me,' a form differing from the more familiar Psalm wording often rendered 'my mother conceived me.'
    reason: textual_variant
    anchor_ref: '18:5'
  - marker: h
    text: Or 'with a governing spirit' or 'with a noble spirit.' The Greek suggests a leading, ruling quality rather than merely inward freedom.
    reason: lexical_alternative
    anchor_ref: '18:12'
  - marker: g
    text: Literally 'from bloods,' an idiom commonly expressing bloodguilt.
    reason: lexical_alternative
    anchor_ref: '18:14'
  - marker: f
    text: '''Broken'' could also be rendered ''crushed'' or, more interpretively, ''contrite.'''
    reason: lexical_alternative
    anchor_ref: '18:17'
  - marker: e
    text: Or 'To him God said'.
    reason: previous_rendering
  - marker: d
    text: Or 'and in sins my mother nursed me.'.
    reason: previous_rendering
  - marker: c
    text: Or 'My tongue will rejoice in your righteousness.'.
    reason: previous_rendering
translation:
  language: ko
  text: '「다윗에 관해서는, 그가 증언받은 사람이라고 하는데, 하나님께서 그에 대해 이렇게 말씀하셨습니다. ‘내 마음에 맞는 사람, 이새의 아들 다윗을 내가 발견했으며, 영원한 긍휼로 내가 그에게 기름을 부었습니다.’


    그도 하나님께 이렇게 말합니다.


    ‘하나님, 당신의 큰 긍휼에 따라 저를 불쌍히 여기시고, 당신의 풍성한 자비에 따라 제 불법을 지워 주십시오.


    제 죄악에서 저를 더욱 씻어 주시고, 제 죄에서 저를 깨끗하게 해 주십시오.


    내가 내 불법을 알고 있으며, 내 죄가 늘 내 앞에 있기 때문입니다.


    당신께만 제가 죄를 지었고, 당신 앞에서 악을 행하였으니, 당신께서 말씀하실 때 의롭다 하심을 받으시고, 당신이 심판받으실 때 이기시게 하려는 것입니다.


    보십시오, 내가 불법 가운데서 태어났고, 죄 가운데서 내 어머니가 나를 잉태하셨습니다.


    보십시오, 당신은 진리를 사랑하셨습니다. 당신의 지혜에 속한 숨겨진 것들과 비밀한 것들을 제게 알리셨습니다.


    당신은 우슬초로 저를 뿌리실 것이니, 그러면 제가 깨끗해질 것입니다. 저를 씻으시면, 눈보다 더 희어질 것입니다.


    당신은 저로 하여금 기쁨과 즐거움을 듣게 하실 것이니, 낮아졌던 뼈들이 즐거워할 것입니다.


    당신의 얼굴을 제 죄들에서 돌이키시고, 제 모든 불법을 지워 주십시오.


    하나님, 제 안에 깨끗한 마음을 창조하시고, 제 속 깊은 곳에 바른 영을 새롭게 하십시오.


    저를 당신의 앞에서 내쫓지 마시고, 당신의 거룩한 영을 제게서 거두지 마십시오.


    당신의 구원의 기쁨을 제게 회복시켜 주시고, 지휘하는 영으로 저를 굳게 세워 주십시오.


    제가 불법한 자들에게 당신의 길들을 가르치면, 불경한 자들이 당신께 돌아올 것입니다.


    하나님, 제 구원의 하나님이시여, 저를 피의 책임에서 건져 주십시오.


    제 혀는 당신의 의를 크게 찬양할 것입니다.


    주님, 당신은 제 입을 여실 것이고, 제 입술은 당신의 찬송을 선포할 것입니다.


    당신이 제사를 원하셨더라면 제가 그것을 드렸을 것이나, 번제는 당신이 기뻐하지 않으실 것입니다.


    하나님께 드리는 제사는 상한 영입니다. 상하고 낮아진 마음을 하나님께서는 멸시하지 않으실 것입니다.’」[a][b][c][d][e][f]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμαρτυρημένῳ
  english_pob_choice: has been testified to
  chosen_korean: 증언받은 사람
  alternatives_korean:
  - 증언된 사람
  - 증거된 사람
  lexicon: BDAG
  rationale: 다윗이 이미 하나님께 공적으로 증언된 인물이라는 점을 살리되, 한국어에서는 대상 인물로 자연스럽게 읽히도록 옮겼습니다.
- source_word: κατὰ τὴν καρδίαν μου
  english_pob_choice: according to my heart
  chosen_korean: 내 마음에 맞는
  alternatives_korean:
  - 내 마음을 따른
  - 내 마음과 일치하는
  lexicon: BDAG
  rationale: 직역의 구조를 유지하면서도 한국어에서 통하는 표현으로 옮겨, 전통적 관용구로 완전히 굳히지 않았습니다.
- source_word: ἀνόμημα / ἀνομία
  english_pob_choice: lawless deed / lawlessness
  chosen_korean: 불법 / 불법한 자들
  alternatives_korean:
  - 무법 / 무법한 자들
  - 죄악 / 악한 자들
  lexicon: BDAG
  rationale: 영어 POB가 의도한 법-무법 어휘 연결을 살려, 싱글은 구체적 행위, 복수의 명사형은 그에 속한 사람들을 드러내도록 번역했습니다.
- source_word: πνεύματι ἡγεμονικῷ
  english_pob_choice: with a ruling spirit
  chosen_korean: 지휘하는 영
  alternatives_korean:
  - 다스리는 영
  - 인도하는 영
  lexicon: LSJ
  rationale: 이 형용사는 단순히 ‘원하는’이 아니라 이끄는/통치하는 성격을 가리키므로, 한국어도 그 주도적 의미를 드러내도록 했습니다.
- source_word: ἐξ αἱμάτων
  english_pob_choice: from bloodguilt
  chosen_korean: 피의 책임
  alternatives_korean:
  - 피 흘림의 죄
  - 피의 죄책
  lexicon: BDAG
  rationale: 직접적인 피 자체보다 ‘피를 흘리게 한 책임’이라는 관용적 의미를 살려 한국어 독자가 의미를 바로 이해하게 했습니다.
theological_decisions:
- issue: πνεύματι ἡγεμονικῷ의 번역
  chosen_reading: ‘지휘하는 영’으로 옮겨, 영의 내적 자유보다 인도·통치의 성격을 드러냈습니다.
  alternative_readings:
  - ‘자유로운 영’
  - ‘고결한 영’
  - ‘온유한 영’
  rationale: 본문의 그리스어는 전통적 관용보다 리더십·주도성을 더 강하게 시사하므로, 원문 의미를 약화시키지 않도록 했습니다.
  doctrine_reference: original-language primacy; preserve source tension
