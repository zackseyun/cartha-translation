base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/039.yaml
  text: 'Foolish and senseless and stupid and untaught men mock us and sneer at us[a], wanting to exalt themselves in their own thoughts. For what can a mortal do? Or what strength belongs to one born of earth? For it is written, “No form was before my eyes; but I heard only a breath and a voice: What then? Shall a mortal be clean before the Lord? Or shall a man be blameless before him because of his works, if he does not trust even his own servants, and has perceived something crooked even in his angels? Even the heavens are not clean before him. How much less those who dwell in houses of clay, from which we ourselves also are made of the same clay. He struck them like a moth, and from morning until evening they are no more; because they were unable to help themselves, they perished. He breathed on them, and they died, because they had no wisdom. But call out, if anyone will listen to you, or if you will see any of the holy angels; for anger kills the foolish man, and jealousy puts the
    one gone astray to death. And I have seen fools taking root, but immediately their way of life was consumed. May their sons be far from safety; may they be crushed at the doors of the lesser, and there will be no one to rescue them. For what they prepared, the righteous will eat[g][f][e][d][c][b], but they themselves will not be delivered from evils.”'
  footnotes:
  - marker: a
    text: The citation in this chapter draws on Job language in a form not identical to standard English versions of Job 4–5.
    reason: cross_reference
  - marker: b
    text: '''Servants'' translates παῖδες here in the sense of attendants; ''children'' is a possible lexical alternative but fits the context less well.'
    reason: lexical_alternative
  - marker: c
    text: '''Jealousy'' could also be rendered ''envy'' or, less likely in this context, ''zeal.'''
    reason: lexical_alternative
  - marker: d
    text: The wording behind 'their dwelling was consumed' is difficult; the Greek term can also suggest manner of life or estate.
    reason: alternative_reading
  - marker: e
    text: Or 'rather, I was hearing a breath and a voice'.
    reason: previous_rendering
  - marker: f
    text: Or 'from which we ourselves also are from the same clay'.
    reason: previous_rendering
  - marker: g
    text: Or 'what things you prepared for them'.
    reason: previous_rendering
translation:
  language: ko
  text: 어리석고 무지하며 미련하고 배우지 못한 사람들이 우리를 비웃고 조롱하며, 자기 생각으로 스스로를 높이려 합니다. 이는 죽을 인간이 무엇을 할 수 있으며, 흙에서 난 자가 무슨 힘을 가졌겠습니까? 기록되기를, 「내 눈앞에는 어떤 형상도 없었고, 오직 한숨과 소리만 들었습니다. 그러니 어찌 죽을 인간이 주님 앞에서 깨끗할 수 있으며, 자기 행위 때문에 한 사람이 흠없다고 할 수 있겠습니까? 그가 자기 종들마저 믿지 않고, 자기 천사들 가운데서도 어떤 굽은 것을 생각해 냈다면 말입니다. 하늘조차도 그 앞에서 깨끗하지 않습니다. 하물며 진흙 집에 사는 자들이랴. 우리도 그와 같은 진흙으로 지음받았기 때문입니다. 그는 그들을 좀이 갉아먹듯 치셨고, 아침부터 저녁까지 그들은 더 이상 존재하지 않습니다. 그들이 스스로를 도울 수 없었기에 멸망했습니다. 그는 그들에게 숨을 불어넣으셨고, 그들은 지혜가 없었기에 죽었습니다. 그러나 누군가가 당신에게 귀를 기울일지, 혹은 당신이 거룩한 천사들 중 누구라도 보게 될지 모르니 외치십시오. 분노는 어리석은 사람을 죽이고, 질투는 길을 잃은 사람을 죽음에 이르게 합니다. 나는 어리석은 자들이 뿌리를 내리는 것을 보았지만, 곧 그들의 거처가 삼켜졌습니다. 그들의 아들들이 안전함에서 멀어지게 하소서. 그들이 낮은 자들의 문들에서 짓눌리게 하시고, 그들을 건져 줄 자가 없게 하소서. 그들이 예비한 것을 의인들이 먹을 것이며, 그들은 재앙에서 건짐받지 못할 것입니다.」[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄφρονες καὶ ἀσύνετοι καὶ μωροὶ καὶ ἀπαίδευτοι
  english_pob_choice: foolish and senseless and stupid and untaught
  chosen_korean: 어리석고 무지하며 미련하고 배우지 못한
  alternatives_korean:
  - 어리석고 분별없고 어둡고 훈련받지 못한
  - 우매하고 분별없으며 미련하고 미숙한
  lexicon: LSJ
  rationale: 네 개의 누적된 비난을 한국어에서도 서로 구별되는 표현으로 살려서 수사적 강도를 유지했습니다.
- source_word: χλευάζουσιν / μυκτηρίζουσιν
  english_pob_choice: mock / sneer at
  chosen_korean: 비웃고 조롱하며
  alternatives_korean:
  - 비웃고 멸시하며
  - 조롱하고 깔보며
  lexicon: LSJ
  rationale: 서로 다른 두 동사를 대응시켜 경멸의 이중 동작을 살렸습니다.
- source_word: θνητός / γηγενοῦς
  english_pob_choice: mortal / one born of earth
  chosen_korean: 죽을 인간 / 흙에서 난 자
  alternatives_korean:
  - 필멸의 인간 / 땅에서 난 자
  - 죽을 존재 / 흙의 자녀
  lexicon: LSJ
  rationale: 인간의 유한성과 흙의 기원이라는 대비를 직설적으로 드러냈습니다.
- source_word: οἰκίας πηλίνας
  english_pob_choice: houses of clay
  chosen_korean: 진흙 집
  alternatives_korean:
  - 토기 같은 집
  - 흙집
  lexicon: LSJ
  rationale: 비유의 핵심인 연약한 육체를 한국어에서 자연스럽고 생생하게 전달했습니다.
- source_word: ἔπαισεν αὐτοὺς σητὸς τρόπον / ἐνεφύσησεν αὐτοῖς
  english_pob_choice: He struck them like a moth / He breathed on them
  chosen_korean: 좀이 갉아먹듯 치셨고 / 그들에게 숨을 불어넣으셨고
  alternatives_korean:
  - 나방처럼 치셨고 / 그들에게 숨을 내쉬셨고
  - 좀처럼 갉아먹으셨고 / 그들에게 불어넣으셨고
  lexicon: LSJ
  rationale: 시편·욥기 계열의 시적 이미지를 살리되, 두 동사의 행위성을 유지했습니다.
- source_word: δίαιτα
  english_pob_choice: dwelling
  chosen_korean: 거처
  alternatives_korean:
  - 삶의 방식
  - 살림
  lexicon: LSJ
  rationale: 문맥상 갑작스러운 소멸의 대상이 되는 것을 가리키는 말로 가장 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 주님/야훼 호칭의 처리
  chosen_reading: 직접 인용된 구약 어구의 κύριος를 주님으로 번역했습니다.
  alternative_readings:
  - 야훼로 옮김
  - 주로 옮김
  rationale: 이 절은 1클레멘스의 인용문 안에서 주님-인간 대비를 드러내므로, 본문 내부의 호칭을 과도하게 확정하지 않는 형태가 적절합니다.
  doctrine_reference: 인용문 내 호칭의 문맥 보존
- issue: παῖδες의 의미
  chosen_reading: 종들로 옮겼습니다.
  alternative_readings:
  - 자녀들
  - 종/시종
  rationale: 천사들과 병렬되는 문맥에서 하나님의 자녀보다 시종·종의 뜻이 더 잘 맞습니다.
  doctrine_reference: 문맥적 어휘 일치
