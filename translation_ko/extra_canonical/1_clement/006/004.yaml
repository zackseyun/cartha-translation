  terminology: ζῆλος는 이 문맥에서 ‘시기’로, ἔρις는 ‘다툼’으로 옮기는 것이 적절합니다. ἔθνη는 국가 제도보다 집단/민족을 가리킬 수 있으므로 ‘나라들’보다 ‘민족들’이 원어에 더 가깝습니다.
