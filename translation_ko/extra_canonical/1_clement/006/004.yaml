  source_fidelity: 그리스어에서 ‘시기와 다툼’(ζῆλος καὶ ἔρις)은 원인구가 아니라 동사의 주어이며, ‘큰 도시들’과 ‘큰 민족들’을 직접 파괴한 것으로 서술됩니다. 현 번역의 ‘~으로 인해’ 및 피동 표현은 영어 감사 번역에는 맞지만 원문의 문장 관계를 약화합니다.
