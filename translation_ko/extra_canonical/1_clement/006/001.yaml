revisions:
- from: 이 사람들에게, 곧 거룩하게 행한 이들에게 많은 택하심을 받은 사람들의 큰 무리가 모였는데, 그들은 시기 때문에 많은 모욕과 고문을 당하여 우리 가운데서 가장 아름다운 본보기가 되었습니다.[a]
  to: 이 경건하게 살아온 사람들에게는 택함을 받은 이들의 큰 무리가 모여들었습니다. 이들은 시기 때문에 많은 학대와 고문을 겪고, 우리 가운데서 가장 훌륭한 본보기가 되었습니다.[a]
  rationale: 원문의 통사 관계, 곧 경건하게 살아온 이들에게 택함 받은 큰 무리가 모여들고 그들이 시기로 인한 학대와 고문을 겪어 공동체 안의 뛰어난 본보기가 되었다는 흐름을 유지했습니다. 동시에 한국어에서 불필요하게 중첩된 수식과 어색한 동격을 해소하고, αἰκία의 의미 범위를 더 정확히 반영했습니다.
  reviewer_model: gpt-5.6-terra
