id: 1CLEM.6.1
reference: 1 Clement 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Τούτοις τοῖς ἀνδράσιν ὁσίως πολιτευσαμενοις συνηθροίσθη πολὺ πλῆθος ἐκλεκτῶν, οἵτινες πολλαῖς αἰκίαις καὶ βασάνοις διὰ ζῆλος παθόντες ὑπόδειγμα κάλλιστον ἐγένοντο ἐν ἡμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006/001.yaml
  text: To these men, who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.
  footnotes:
  - marker: a
    text: Or 'having suffered through jealousy many outrages and tortures'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 사람들에게, 곧 거룩하게 행한 이들에게 많은 택하심을 받은 사람들의 큰 무리가 모였는데, 그들은 시기 때문에 많은 모욕과 고문을 당하여 우리 가운데서 가장 아름다운 본보기가 되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁσίως πολιτευσαμενοις
  english_pob_choice: who had conducted themselves in holiness
  chosen_korean: 거룩하게 행한 이들
  alternatives_korean:
  - 거룩하게 살아온 이들
  - 경건하게 행한 이들
  lexicon: ὁσίως, πολιτεύομαι
  rationale: ὁσίως는 단순한 내면 상태보다 삶의 행실을 가리키므로, ‘거룩하게 행한’으로 간결하게 살려 문맥상의 품위를 유지했습니다.
- source_word: ἐκλεκτῶν
  english_pob_choice: the elect
  chosen_korean: 택하심을 받은 사람들
  alternatives_korean:
  - 택함을 받은 자들
  - 선택된 자들
  lexicon: ἐκλεκτός
  rationale: ‘선택된’보다 신학적·문맥적 의미가 분명한 ‘택하심을 받은’이 한국어 독자에게 더 자연스럽고, 군체성을 살립니다.
- source_word: αἰκίαις καὶ βασάνοις
  english_pob_choice: many outrages and tortures
  chosen_korean: 많은 모욕과 고문
  alternatives_korean:
  - 많은 폭행과 고문
  - 많은 학대와 고문
  lexicon: αἰκία, βάσανος
  rationale: αἰκία는 폭력적 학대뿐 아니라 수치와 모욕의 성격도 포함하므로 ‘모욕’으로, βάσανος는 분명하게 ‘고문’으로 옮겼습니다.
- source_word: διὰ ζῆλος
  english_pob_choice: because of jealousy
  chosen_korean: 시기 때문에
  alternatives_korean:
  - 질투 때문에
  - 시기심으로 인해
  lexicon: ζῆλος
  rationale: 여기서는 원인 관계가 핵심이므로, 영어 POB의 수정판 흐름을 따라 ‘~때문에’로 풀어 자연스럽게 표기했습니다.
theological_decisions:
- issue: ἐκλεκτῶν의 번역을 ‘선택된 자들’이 아니라 ‘택하심을 받은 사람들’로 할지
  chosen_reading: ‘택하심을 받은 사람들’은 하나님의 주도성을 드러내면서도 공동체적 집합을 자연스럽게 나타냅니다.
  alternative_readings:
  - 선택된 자들
  - 택함을 받은 자들
  rationale: 본 구절은 신분 표지라기보다 공동체적 정체성을 서술하므로, 수동적 뉘앙스를 살린 표현이 더 적절합니다.
  doctrine_reference: 선택/부르심의 수동성에 대한 성서적 일반 용례
- issue: διὰ ζῆλος를 원인으로 읽어 ‘시기 때문에’로 옮길지, 수단적 뉘앙스를 살려 다른 방식으로 옮길지
  chosen_reading: 원인 의미가 가장 자연스럽고, 영어 POB의 audit trail과도 일치하므로 ‘시기 때문에’로 옮깁니다.
  alternative_readings:
  - 시기로 인해
  - 시기 속에서
  rationale: 그들의 고난의 원인을 분명히 하여 문장의 논리와 수사적 힘을 유지합니다.
  doctrine_reference: 수난의 원인 설명에 대한 문맥 해석
