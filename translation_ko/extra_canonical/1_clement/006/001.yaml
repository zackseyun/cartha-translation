review_pass:
  verdict: revise
  source_fidelity: 초안은 문장의 기본 구조와 원인 관계(διὰ ζῆλος), 그리고 고난과 모범이라는 핵심 의미를 대체로 충실히 옮겼습니다. 다만 αἰκίαις는 단순한 언어적 ‘모욕’보다 가혹한 학대·가해를 포괄하므로 ‘학대’가 더 적절합니다. 또한 ἐκλεκτῶν은 ‘택함을 받은 이들’로 간결하게 옮겨 원문의 명사화된 형용사와 집합적 의미를 보존하는 편이 낫습니다.
  naturalness: ‘이 사람들에게, 곧 … 이들에게’는 지시어와 동격 구성이 겹쳐 다소 어색하며, ‘많은 택하심을 받은 사람들의 큰 무리’도 ‘많은/큰’의 중첩으로 읽힙니다. 문장을 둘로 나누고 ‘경건하게 살아온’, ‘모여들었습니다’, ‘가장 훌륭한 본보기’로 다듬으면 현대 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ὁσίως πολιτευσαμένοις는 여기서 ‘거룩하게 행한’보다 삶의 행실을 가리키는 ‘경건하게 살아온’이 자연스럽습니다. ἐκλεκτῶν은 특정 교리 체계를 덧붙이지 않는 ‘택함을 받은 이들’로 옮겼습니다. αἰκίαις καὶ βασάνοις는 ‘많은 학대와 고문’으로 구별했으며, ζῆλος는 문맥상 ‘시기’로 유지했습니다.
  issues:
  - severity: medium
    issue: αἰκίαις를 ‘모욕’으로 한정함
    rationale: αἰκία는 모욕적 대우를 포함할 수 있으나, 이 문맥에서는 폭력적·가혹한 학대의 의미가 더 넓고 적절합니다.
  - severity: low
    issue: ‘많은 택하심을 받은 사람들의 큰 무리’의 수식 중첩
    rationale: πολὺ πλῆθος는 ‘큰 무리’이며, ἐκλεκτῶν은 그 무리를 한정합니다. ‘많은’이 택함 받은 사람들을 직접 수식하는 듯하여 한국어 문장이 무거워집니다.
  - severity: low
    issue: ‘거룩하게 행한’ 및 지시어 반복의 어색함
    rationale: 원문의 경건한 삶이라는 뜻은 유지하되, 현대 한국어에서는 ‘경건하게 살아온 사람들’과 같은 표현이 더 자연스럽습니다.
  revised_text: 이 경건하게 살아온 사람들에게는 택함을 받은 이들의 큰 무리가 모여들었습니다. 이들은 시기 때문에 많은 학대와 고문을 겪고, 우리 가운데서 가장 훌륭한 본보기가 되었습니다.[a]
