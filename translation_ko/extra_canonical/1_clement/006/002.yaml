review_pass:
  verdict: revise
  source_fidelity: 그리스어는 여성들이 시기(ζῆλος) 때문에 박해를 받아 ‘다나이스와 디르케들’로 언급되고, 혹독한 학대를 겪은 뒤 믿음의 확고한 경주에 이르러 상을 받았다고 말합니다. 초안의 ‘무사히’는 βέβαιον(‘확고한’)을 도달 방식으로 옮겨 의미가 바뀌며, ‘목표’는 δρόμον(경주/달음질)을 충분히 반영하지 못합니다.
  naturalness: 영문 표기 Danaids, Dircae를 그대로 둔 것은 한국어 본문에 부자연스럽습니다. 통용 음역과 ‘처럼’을 사용하면 문장 관계와 고전적 암시가 자연스러워집니다.
  terminology: ζῆλος는 문맥상 ‘시기’가 적절합니다. ‘믿음의 확고한 경주’는 πίστεως βέβαιον δρόμον을 보존하며, γέρας는 ‘고귀한 상’으로 옮깁니다. ‘육신으로는 약했지만’은 τῷ σώματι의 양보를 자연스럽게 나타냅니다.
  issues:
  - severity: medium
    issue: ‘무사히 믿음의 목표에 도달했고’
    rationale: βέβαιον은 ‘무사히’가 아니라 믿음의 δρόμος(경주)가 ‘확고함’을 뜻합니다. 또한 δρόμον은 단순한 ‘목표’보다 ‘경주’로 옮겨야 합니다.
  - severity: low
    issue: Danaids와 Dircae의 영문 표기
    rationale: 표준 한국어 성서 문체에서는 한국어 음역을 사용하고, 고전 신화적 암시는 주석으로 설명하는 편이 자연스럽습니다.
  - severity: low
    issue: ‘질투’
    rationale: 이 문맥에서 ζῆλος는 개인적 질투보다 공동체를 해치는 ‘시기’로 옮기는 것이 더 자연스럽습니다.
  revised_text: 시기 때문에 여성들은 다나이스와 디르케들처럼 박해를 받았습니다. 그들은 끔찍하고 불경한 학대를 겪은 뒤 믿음의 확고한 경주에 이르렀으며, 육신으로는 약했지만 고귀한 상을 받았습니다.
  revised_footnotes:
  - marker: '1'
    text: '다나이스: 그리스 신화에서 다나오스의 딸들입니다. 여기서는 박해받은 여성들을 비유적으로 가리키는 표현입니다.'
    reason: 고전 고유명사의 지시 대상과 비유적 용법을 밝혀 독자의 이해를 돕습니다.
  - marker: '2'
    text: '디르케들: 그리스 신화의 디르케를 떠올리게 하는 복수형 표현입니다. 여기서는 박해받은 여성들을 비유적으로 가리키는 표현입니다.'
    reason: 고전 고유명사의 지시 대상과 비유적 용법을 밝혀 독자의 이해를 돕습니다.
  revision_rationale: ‘무사히 … 목표에 도달했다’를 ‘믿음의 확고한 경주에 이르렀다’로 고쳐 βέβαιον과 δρόμον의 수식 관계 및 경주 은유를 보존했습니다. 고유명사는 한국어 음역으로 바꾸고, 문맥상 필요한 최소한의 주석을 제시했습니다.
