id: 1CLEM.4.9
reference: 1 Clement 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος ἐποίησεν Ἰωσὴφ μέχρι θανάτου διωχθῆναι καὶ μέχρι δουλείας εἰσελθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/009.yaml
  text: Jealousy caused Joseph to be persecuted even to death and to enter into slavery[a].
  footnotes:
  - marker: a
    text: Or 'persecuted even to death and to come even into slavery'.
    reason: previous_rendering
translation:
  language: ko
  text: 질투는 요셉을 죽음에 이르기까지 박해하게 했고, 그를 노예 상태로 들어가게 했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  english_pob_choice: Jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 투기
  lexicon: ζῆλος
  rationale: 이 문맥에서는 요셉을 향한 악한 감정과 박해의 원인이므로, 긍정적 열심이 아닌 부정적 의미의 ‘질투’가 가장 직접적입니다.
- source_word: ἐποίησεν ... διωχθῆναι
  english_pob_choice: caused Joseph to be persecuted
  chosen_korean: 요셉을 … 박해하게 했습니다
  alternatives_korean:
  - 요셉을 … 핍박하게 했습니다
  - 요셉이 … 박해를 받게 했습니다
  lexicon: ποιέω + διώκω
  rationale: 원문은 질투가 원인행위를 하고 요셉이 박해받는 결과를 겪는 구조이므로, 원인-결과를 살린 ‘박해하게 했습니다’로 옮겼습니다.
- source_word: μέχρι θανάτου
  english_pob_choice: to the point of death / even to death
  chosen_korean: 죽음에 이르기까지
  alternatives_korean:
  - 죽음까지
  - 죽을 지경까지
  lexicon: μέχρι + θάνατος
  rationale: μέχρι는 한계·도달점을 나타내므로 실제 죽음의 발생을 단정하지 않도록 ‘죽음에 이르기까지’로 렌더링했습니다.
- source_word: δουλείας εἰσελθεῖν
  english_pob_choice: to enter into slavery
  chosen_korean: 노예 상태로 들어가게 했습니다
  alternatives_korean:
  - 노예살이로 들어가게 했습니다
  - 종살이로 들어가게 했습니다
  lexicon: δουλεία + εἰσέρχομαι
  rationale: 여기서 δουλεία는 단순한 봉사가 아니라 강제적 예속 상태를 가리키므로, 그 긴장을 드러내는 ‘노예 상태’를 택했습니다.
theological_decisions:
- issue: μέχρι θανάτου가 실제 사망을 뜻하는지, 한계/도달을 뜻하는지
  chosen_reading: 요셉이 실제로 죽었다는 뜻이 아니라, 죽음의 경계까지 이르는 박해를 받았다는 뜻으로 읽었습니다.
  alternative_readings:
  - 질투가 요셉을 실제로 죽게 했다는 읽기
  - ‘죽음에 이르기까지’를 단순한 과장으로 읽는 방식
  rationale: 문맥상 야곱-요셉 전승을 요약하는 진술이므로, 실제 죽음이 아니라 생명의 위협에 이르는 박해로 이해하는 것이 원문과 서사 모두에 더 잘 맞습니다.
  doctrine_reference: 서사 문맥과 헬라어 한계표현(μέχρι)의 의미
- issue: δουλεία의 번역 톤
  chosen_reading: ‘노예 상태’로 번역해 예속의 실질성을 분명히 했습니다.
  alternative_readings:
  - ‘종살이’로 완화하는 번역
  - 전통적 교회어휘를 따라 ‘종살이’로 옮기는 방식
  rationale: 원문은 요셉의 사회적 추락과 강제 예속을 강조하므로, 독자가 상태의 무게를 놓치지 않도록 ‘노예 상태’를 사용했습니다.
  doctrine_reference: 사회적·서사적 의미 보존
