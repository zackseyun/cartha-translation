reference: 1 Clement 4:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ζῆλος Δαθὰν καὶ Ἀβειρὼν ζῶντας κατήγαγεν εἰς ᾅδου διὰ τὸ στασιάσαι αὐτοὺς πρὸς τὸν θεράποντα τοῦ θεοῦ Μωυσῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/012.yaml
  text: Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses[a], the servant of God.
  footnotes:
  - marker: a
    text: Or 'Moses, the attendant of God.'.
    reason: previous_rendering
translation:
  language: ko
  text: 시기심이 다단과 아비람을 살아 있는 채로 하데스로 끌어내렸습니다. 그들은 하나님의 종 모세에게 반역하였기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  english_pob_choice: Jealousy
  chosen_korean: 시기심
  alternatives_korean:
  - 질투
  - 시기
  lexicon: ζῆλος
  rationale: 문맥상 단순한 열심이 아니라 공동체를 파괴하는 부정적 감정이므로, 문맥을 살리면서도 원문의 강도를 유지하는 ‘시기심’으로 옮겼습니다.
- source_word: ζῶντας κατήγαγεν εἰς ᾅδου
  english_pob_choice: brought ... down alive into Hades
  chosen_korean: 살아 있는 채로 하데스로 끌어내렸습니다
  alternatives_korean:
  - 살아 있는 채로 음부로 끌어내렸습니다
  - 살아서 하데스로 내려보냈습니다
  lexicon: ζῶντας / κατήγαγεν / ᾅδης
  rationale: ‘alive’와 하강 동사를 모두 살리되, 고전적 종교어 ‘음부’보다 원지명 ‘하데스’를 택해 본문의 직접성을 유지했습니다.
- source_word: θεράποντα τοῦ θεοῦ Μωυσῆν
  english_pob_choice: Moses, the servant of God
  chosen_korean: 하나님의 종 모세
  alternatives_korean:
  - 하나님의 시종 모세
  - 하나님을 섬기는 모세
  lexicon: θεράπων
  rationale: θεράπων은 단순한 수행원이 아니라 고귀한 ‘하나님의 종’이라는 성서적 호칭으로 쓰이므로, 이를 약화하지 않고 한국어 관용과 신학적 무게를 살렸습니다.
- source_word: στασιάσαι
  english_pob_choice: rebelled
  chosen_korean: 반역하였기 때문입니다
  alternatives_korean:
  - 분쟁을 일으켰기 때문입니다
  - 반란을 일으켰기 때문입니다
  lexicon: στασιάζω
  rationale: 단순한 다툼보다 권위에 대한 공개적 저항을 뜻하므로, 본문의 윤리적·정치적 강도를 드러내는 ‘반역하다’를 택했습니다.
theological_decisions:
- issue: θεράπων의 신학적 격조
  chosen_reading: 모세를 ‘하나님의 종’으로 번역해, 하나님이 세우신 지도자에 대한 반역이라는 본문의 경고를 보존했습니다.
  alternative_readings:
  - ‘하나님의 시종’으로 완화하기
  - ‘하나님의 종’ 대신 이름만 두기
  rationale: 이 구절은 민수기 전승과 히브리서의 모세 표상을 떠올리게 하므로, 호칭의 경외감이 약화되지 않도록 했습니다.
  doctrine_reference: 민 12:7; 히 3:5
- issue: ᾅδης의 번역
  chosen_reading: 지명으로서 ‘하데스’를 유지했습니다.
  alternative_readings:
  - ‘음부’로 전통화하기
  - ‘저승’으로 문화화하기
  rationale: POB의 일관된 원천-직역 원칙에 따라, 본문이 지시하는 사후 세계 표현의 고유성을 보존했습니다.
  doctrine_reference: 사후 세계 용어의 원문 보존
