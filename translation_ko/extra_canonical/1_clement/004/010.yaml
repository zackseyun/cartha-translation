  to: 시기 때문에 모세는 이집트 왕 파라오 앞을 떠나 도망칠 수밖에 없었습니다. 그가 자기 동족에게서 「누가 너를 우리 위에 재판관이나 법관으로 세웠느냐? 어제 네가 이집트인을 죽인 것처럼 나도 죽이려는 것이냐?」라는 말을 들었을 때였습니다.
