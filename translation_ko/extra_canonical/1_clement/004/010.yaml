  text: ζῆλος φυγεῖν ἠνάγκασεν Μωυσῆν ἀπὸ προσώπου Φαραὼ βασιλέως Αἰγύπτου ἐν τῷ ἀκοῦσαι αὐτὸν ἀπὸ τοῦ ὁμοφύλου· Τίς σε κατέστησεν κριτὴν ἢ δικαστὴν ἐφʼ ἡμῶν; μὴ ἀνελεῖν με σὺ θέλεις, ὃν τρόπον ἀνεῖλες ἐχθὲς τὸν Αἰγύπτιον;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/010.yaml
  text: Jealousy compelled Moses to flee from the presence of Pharaoh king of Egypt[a], when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’
  footnotes:
  - marker: a
    text: Or 'ruler or judge'.
    reason: previous_rendering
translation:
  language: ko
  text: 시기 때문에 모세는 이집트 왕 파라오 앞을 떠나 도망칠 수밖에 없었습니다. 그가 자기 동족에게서 「누가 너를 우리 위에 재판관이나 법관으로 세웠느냐? 어제 네가 이집트인을 죽인 것처럼 나도 죽이려는 것이냐?」라는 말을 들었을 때였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  english_pob_choice: Jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 열심
  lexicon: ζῆλος
  rationale: 여기서는 모세를 도망하게 만든 부정적 동기로 쓰였으므로, 중립적/긍정적 ‘열심’보다 ‘질투’가 원문의 힘과 문맥을 더 정확히 드러냅니다.
- source_word: ἀπὸ προσώπου
  english_pob_choice: from the presence of
  chosen_korean: ~의 앞에서
  alternatives_korean:
  - ~의 얼굴에서
  - ~의 면전에서
  lexicon: πρόσωπον
  rationale: 영문 POB의 ‘presence’를 반영하되, 한국어에서는 인물의 직접적 대면을 자연스럽게 나타내는 ‘~의 앞에서’가 가장 무난합니다.
- source_word: κριτὴν ἢ δικαστὴν
  english_pob_choice: judge or magistrate
  chosen_korean: 재판관이나 판관
  alternatives_korean:
  - 재판관이나 치리자
  - 재판관이나 중재자
  lexicon: κριτής / δικαστής
  rationale: Clement의 본문은 출애굽기 LXX의 ‘ruler’가 아니라 ‘judge or magistrate’의 이중 법정 용어를 쓰므로, 둘 다 사법적 직책임이 드러나도록 번역했습니다.
- source_word: ὁμοφύλου
  english_pob_choice: fellow tribesman
  chosen_korean: 자기 동족
  alternatives_korean:
  - 동족
  - 같은 민족 사람
  lexicon: ὁμόφυλος
  rationale: 직역하면 ‘같은 지파/동족’이지만, 한국어에서는 본문이 강조하는 같은 편의 사람이라는 관계를 살려 ‘자기 동족’으로 옮겼습니다.
theological_decisions:
- issue: 모세의 도피 원인 서술
  chosen_reading: 질투가 모세를 도망하게 한 직접 원인으로 유지했습니다.
  alternative_readings:
  - 분노가 모세를 도망하게 했다고 완화할 수 있음
  - 질투를 관계 갈등의 배경 정도로 약화할 수 있음
  rationale: 그리스어 문장은 ζῆλος를 원인으로 분명히 놓으므로, 도덕적·감정적 긴장을 희석하지 않고 그대로 살렸습니다.
  doctrine_reference: 문맥 충실성
