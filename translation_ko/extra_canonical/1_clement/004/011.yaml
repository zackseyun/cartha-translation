  yaml_path: translation/extra_canonical/1_clement/004/011.yaml
  text: Because of jealousy Aaron and Miriam lodged outside the camp.
translation:
  language: ko
  text: 시기 때문에 아론과 미리암은 진 밖에서 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  english_pob_choice: Because of jealousy
  chosen_korean: 시기 때문에
  alternatives_korean:
  - 질투 때문에
  - 시기심 때문에
  lexicon: διὰ + ζῆλος
  rationale: 원문은 원인 표현이며, ζῆλος는 여기서 부정적 감정인 ‘시기’로 옮기는 것이 자연스럽습니다. ‘시기심’도 가능하지만 문장이 더 간결한 ‘시기’로 충분합니다.
- source_word: Ἀαρὼν καὶ Μαριὰμ
  english_pob_choice: Aaron and Miriam
  chosen_korean: 아론과 미리암
  alternatives_korean:
  - 아론과 마리아
  lexicon: 고유명사
  rationale: 성경에서 널리 알려진 형태를 따랐습니다. ‘Miriam’은 한국어 성경 전통에서 ‘미리암’이 적절합니다.
- source_word: ἔξω τῆς παρεμβολῆς
  english_pob_choice: outside the camp
  chosen_korean: 진 밖에서
  alternatives_korean:
  - 진영 밖에서
  - 캠프 밖에서
  lexicon: παρεμβολή
  rationale: 군사·광야 문맥의 파레μβολή는 ‘진’이 원문의 이미지와 성경적 용례를 가장 직접적으로 살립니다. ‘진영’도 가능하지만 더 간결한 ‘진’을 채택했습니다.
- source_word: ηὐλίσθησαν
  english_pob_choice: lodged
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 묵었습니다
  - 숙박했습니다
  lexicon: αὐλίζομαι
  rationale: ‘lodged’는 단순한 체류를 뜻하므로 ‘머물렀습니다’가 가장 자연스럽습니다. ‘묵었습니다’는 숙박 뉘앙스가 더 강합니다.
theological_decisions:
- issue: 시기(ζῆλος)의 정서적 뉘앙스
  chosen_reading: 행동의 원인이 되는 부정적 시기심을 분명히 드러내되, 과도하게 해석하지는 않았습니다.
  alternative_readings:
  - 질투
  - 시기심
  rationale: 문맥상 인물의 죄책을 암시하지만, 원문은 원인 진술에 머무르므로 해설을 덧붙이지 않고 감정 명사만 유지했습니다.
  doctrine_reference: 문맥 주해 원칙
