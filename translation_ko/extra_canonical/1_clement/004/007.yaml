  source_fidelity: ὁρᾶτε is well represented by the direct formal-polite imperative “보십시오.” ζῆλος καὶ φθόνος may be rendered “질투와 시기,” and κατειργάσατο is accurately conveyed by “초래했습니다.” However, ἀδελφοί is specifically “brothers,” and “형제자매 여러분” adds an explicit referent not present in the Greek while weakening the deliberate repetition with ἀδελφοκτονία.
  naturalness: “형제살해” should be spaced as “형제 살해” or, more idiomatically as a compact abstract noun here, rendered “형제 살인.” “형제 여러분” is a natural formal Korean communal address.
  terminology: “형제 여러분” / “형제 살인” preserves the Greek rhetorical recurrence of ἀδελφ- (“brother-”) without introducing gender-inclusive expansion. The supplied [a] anchor has no corresponding Korean footnote and must be resolved.
  issues:
  - severity: medium
    issue: ‘형제자매 여러분’ expands ἀδελφοί.
    rationale: The Greek has the conventional plural address ‘brothers’; although it addresses the community, explicit ‘자매’ is not stated. ‘형제 여러분’ is idiomatic and more source-close.
  - severity: low
    issue: Dangling footnote anchor [a].
    rationale: The translated text contains [a], but the draft provides no Korean footnote. A corresponding note is supplied in the revision.
  - severity: low
    issue: ‘형제살해’ lacks standard spacing and is less idiomatic than ‘형제 살인.’
    rationale: ‘형제 살인’ naturally expresses fratricide in Korean while retaining the lexical and rhetorical link to ‘형제 여러분.’
