translation:
  language: ko
  text: 보십시오, 형제 여러분, 질투와 시기가 형제 살인을 초래했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “형제를 죽임”.
    reason: ἀδελφοκτονία는 ‘형제 살인’이라는 압축된 명사와 ‘형제를 죽임’이라는 설명적 표현으로 옮길 수 있습니다.
lexical_decisions:
- source_word: ὁρᾶτε
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보아라
  - 보세요
  lexicon: ὁρᾶτε
  rationale: 직설적 경고/호소의 느낌을 살리면서도 합쇼체를 유지하기 위해 ‘보십시오’로 옮겼습니다.
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제자매 여러분
  alternatives_korean:
  - 형제 여러분
  - 형제들
  lexicon: ἀδελφοί
  rationale: 회중 전체를 향한 호칭으로 자연스럽게 들리도록 했으며, 남성형 복수의 관용적 한국어 대응을 좁게 한정하지 않았습니다.
- source_word: ζῆλος καὶ φθόνος
  english_pob_choice: jealousy and envy
  chosen_korean: 질투와 시기
  alternatives_korean:
  - 열심과 시기
  - 질투와 부러움
  lexicon: ζῆλος / φθόνος
  rationale: 두 명사가 병렬로 주는 부정적 정서를 그대로 살려 ‘질투와 시기’로 옮겼습니다.
- source_word: ἀδελφοκτονίαν
  english_pob_choice: fratricide
  chosen_korean: 형제살해
  alternatives_korean:
  - 형제살인
  - 형제간 살해
  lexicon: ἀδελφοκτονία
  rationale: 라틴계 추상어보다 원문의 ‘형제’ 반복을 드러내는 직역형을 택해, POB의 audit trail이 지적한 수사적 효과를 한국어에서도 보존했습니다.
theological_decisions:
- issue: ἀδελφοί를 ‘형제들’로 제한할지, 더 포괄적으로 옮길지
  chosen_reading: 공동체 전체를 향한 호칭으로 이해해 ‘형제자매 여러분’으로 옮겼습니다.
  alternative_readings:
  - 형제 여러분
  - 형제들
  rationale: 문맥상 독자 집단 전체를 부르는 수사적 호칭이므로, 현대 한국어에서 배제감을 줄이면서도 경고의 직접성을 유지했습니다.
  doctrine_reference: 공동체 호칭의 현대 한국어 수용 방식
- issue: ἀδελφοκτονίαν의 의미를 추상명사 ‘fratricide’에 맞출지, 설명적 구문으로 풀지
  chosen_reading: ‘형제살해’로 직결해 원문의 충격성과 ‘형제’의 반복을 보존했습니다.
  alternative_readings:
  - 형제 살해
  - 형제의 살해
  rationale: 본절은 도덕적 비난을 강화하는 짧은 진술이므로, 설명을 덧붙이기보다 압축된 명사구를 유지하는 편이 원문의 수사 구조에 더 가깝습니다.
  doctrine_reference: 수사적 압축과 도덕 경고의 보존
