  source_fidelity: 현 초안은 인용 도입부인 Γέγραπται γὰρ οὕτως(“이는 이렇게 기록되어 있기 때문입니다”)를 누락했습니다. 또한 τῶν προβάτων에는 ‘자기’라는 소유 표현이 없고, στεάτων은 단순 ‘기름’보다 제물의 ‘기름진 부분들’을 뜻합니다. ἤνεγκεν의 목적어는 앞의 θυσίαν을 받아 아벨에게도 ‘제물’을 보충하는 것이 한국어에서 분명합니다.
  naturalness: ‘아벨도 또한’은 다소 중복적으로 들리므로 ‘아벨도’로 자연스럽게 옮기되, αὐτός의 병렬 강조는 문맥상 유지했습니다. ‘양의 첫 새끼들’과 ‘기름진 부분들’은 현대 표준어에서 이해 가능하면서 원문의 복수와 출처 표현을 보존합니다.
  terminology: θυσία는 문맥상 ‘제물’로 유지할 수 있습니다. πρωτοτόκων은 ‘첫 새끼들’, στεάτων은 제의 문맥의 ‘기름진 부분들’로 옮기는 편이 정확합니다. θεῷ는 한국어 성경 관례에 따라 ‘하나님께’로 처리했습니다.
