  to: 이는 이렇게 기록되어 있기 때문입니다. “며칠이 지난 뒤에 카인은 땅의 열매 가운데서 하나님께 제물을 드렸습니다. 아벨도 양의 첫 새끼들과 그것들의 기름진 부분들 가운데서 제물을 드렸습니다.”
