  text: Γέγραπται γὰρ οὕτως· Καὶ ἐγένετο μεθ' ἡμέρας, ἤνεγκεν Κάϊν ἀπὸ τῶν καρπῶν τῆς γῆς θυσίαν τῷ θεῷ, καὶ Ἄβελ ἤνεγκεν καὶ αὐτὸς ἀπὸ τῶν πρωτοτόκων τῶν προβάτων καὶ ἀπὸ τῶν στεάτων αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/001.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth an offering to God, and Abel also brought from the firstborn of the sheep and from their fat portions.'
translation:
  language: ko
  text: 이는 이렇게 기록되어 있기 때문입니다. “며칠이 지난 뒤에 카인은 땅의 열매 가운데서 하나님께 제물을 드렸습니다. 아벨도 양의 첫 새끼들과 그것들의 기름진 부분들 가운데서 제물을 드렸습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν
  english_pob_choice: an offering
  chosen_korean: 제물
  alternatives_korean:
  - 헌물
  - 희생제사
  lexicon: θυσία
  rationale: 여기서는 제사 행위의 일반적 ‘offering’보다 하나님께 드리는 예물 자체를 가리키므로, 간결하고 본문에 충실한 ‘제물’이 적절합니다.
- source_word: πρωτοτόκων τῶν προβάτων
  english_pob_choice: from the firstborn of the sheep
  chosen_korean: 자기 양의 맏배들
  alternatives_korean:
  - 양의 첫 새끼들
  - 양 떼의 첫 새끼들
  lexicon: πρωτότοκος
  rationale: πρωτότοκος는 ‘첫 태어난 것’의 의미를 살려 ‘맏배들’로 옮겼고, ‘sheep’은 문맥상 양으로 자연스럽게 처리했습니다.
- source_word: στεάτων
  english_pob_choice: their fat portions
  chosen_korean: 그 기름
  alternatives_korean:
  - 그 기름진 것
  - 기름 덩어리
  lexicon: στεάτη
  rationale: 희생 제물의 가장 좋은 부분을 뜻하는 표현이므로, 직역이면서도 한국어에서 이해되는 ‘그 기름’으로 옮겼습니다.
- source_word: μεθ' ἡμέρας
  english_pob_choice: after some days
  chosen_korean: 며칠이 지난 뒤에
  alternatives_korean:
  - 며칠 후에
  - 몇 날이 지난 뒤에
  lexicon: μετά
  rationale: 시간 경과를 나타내는 관용구로, 서술 흐름을 살리면서도 자연스러운 한국어인 ‘며칠이 지난 뒤에’로 옮겼습니다.
theological_decisions:
- issue: Genesis 제물 서술에서 ‘희생제사’로 과도하게 규정할지 여부
  chosen_reading: 본문은 두 형제가 하나님께 드린 제물의 종류와 출처를 말하며, 여기서는 제사 체계 전체를 설명하기보다 ‘제물’을 중심으로 유지했습니다.
  alternative_readings:
  - 희생제사
  - 예배 제물
  rationale: 헬라어 θυσίαν은 문맥상 분명 ‘드린 것’이지만, 본문 자체는 제의적 평가를 명시하지 않으므로 과도한 신학적 해석을 피했습니다.
  doctrine_reference: 본문-기반 서술 유지
- issue: καὶ αὐτὸς의 강조를 한국어에서 어떻게 살릴지
  chosen_reading: ‘아벨도 또한’으로 옮겨 카인과 아벨의 병렬과 아벨의 자기적 강조를 함께 드러냈습니다.
  alternative_readings:
  - 아벨도
  - 아벨 역시
  rationale: 원문은 아벨의 행위도 덧붙여 강조하므로, 단순한 병렬보다 ‘도 또한’이 수사적 균형을 더 잘 보여줍니다.
  doctrine_reference: 문맥 강조 보존
