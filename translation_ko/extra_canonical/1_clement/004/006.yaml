id: 1CLEM.4.6
reference: 1 Clement 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν Κάϊν πρὸς Ἄβελ τὸν ἀδελφὸν αὐτοῦ· Διέλθωμεν εἰς τὸ πεδίον. καὶ ἐγένετο ἐν τῷ εἶναι αὐτοὺς ἐν τῷ πεδίῳ, ἀνέστη Κάϊν ἐπʼ Ἄβελ τὸν ἀδελφὸν αὐτοῦ καὶ ἀπέκτεινεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/006.yaml
  text: And Cain said to Abel his brother[a], ‘Let us go into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.
  footnotes:
  - marker: a
    text: Or 'Let us go through into the field.'.
    reason: previous_rendering
translation:
  language: ko
  text: 카인은 자기 형제 아벨에게 말했습니다. 「들로 들어갑시다.[a]」 그들이 들에 있을 때에 카인이 자기 형제 아벨에게 달려들어 그를 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “들로 지나갑시다.”
    reason: Διέρχομαι의 가능한 문자적 번역을 제시합니다. 문맥상 본문 번역 ‘들로 들어갑시다’가 더 자연스럽습니다.
lexical_decisions:
- source_word: Διέλθωμεν εἰς τὸ πεδίον
  english_pob_choice: Let us go into the field.
  chosen_korean: 「들로 들어갑시다.」
  alternatives_korean:
  - 「들에 들어갑시다.」
  - 「들판으로 들어갑시다.」
  - 「들로 가봅시다.」
  lexicon: Διέρχομαι / εἰς + 장소
  rationale: 본문은 ‘가로질러 지나가다’보다 장소로 ‘들어가다’는 뜻이 더 자연스럽고, POB 수정 내역도 이 구절을 ‘go into the field’로 조정했습니다. 한국어에서는 ‘들로 들어갑시다’가 가장 직접적입니다.
- source_word: ἐν τῷ πεδίῳ
  english_pob_choice: in the field
  chosen_korean: 들에
  alternatives_korean:
  - 들판에
  - 밭에
  - 평야에
  lexicon: πεδίον
  rationale: πεδίον은 일반적으로 ‘들, 평야, 벌판’을 뜻하므로, 문맥상 자연스럽고 간결한 ‘들’로 옮겼습니다.
- source_word: ἀνέστη ... καὶ ἀπέκτεινεν αὐτόν
  english_pob_choice: Cain rose up against Abel ... and killed him.
  chosen_korean: 카인이 자기 형제 아벨에게 일어나 그를 죽였습니다.
  alternatives_korean:
  - 카인이 아벨에게 일어나 그를 죽였습니다.
  - 카인이 아벨을 향해 일어나 그를 죽였습니다.
  lexicon: ἀνίστημι / ἀποκτείνω
  rationale: ἀνέστη는 단순히 ‘일어났다’보다 공격적 행동의 개시를 드러내므로 ‘...에게 일어나’로 옮겼고, ἀπέκτεινεν은 직접적으로 ‘죽였습니다’로 번역했습니다.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  english_pob_choice: his brother
  chosen_korean: 자기 형제
  alternatives_korean:
  - 자기 형제인
  - 자기 동생
  - 그의 형제
  lexicon: ἀδελφός
  rationale: 반복되는 ‘형제’ 표지를 한국어에서도 살려, 카인과 아벨의 관계를 본문이 강조하는 방식대로 유지했습니다.
theological_decisions:
- issue: 카인의 말의 범위와 장면 전개
  chosen_reading: 직접 인용부호를 유지하고, 뒤의 서술 ‘그들이 들에 있을 때에’와 구분해 사전 유인과 살해의 전개를 드러냈습니다.
  alternative_readings:
  - 인용부호 없이 서술문으로 평평하게 처리
  - 쉼표로만 연결해 장면 구분을 약화
  rationale: 본문은 말-이동-살해의 순서를 분명히 보여 주므로, 장면 전환을 한국어에서도 유지하는 것이 내러티브와 신학적 긴장을 보존합니다.
  doctrine_reference: 창세기 4장 전승 인용의 서사 구조 보존
- issue: 직접 폭력 행위의 표현
  chosen_reading: ‘일어나 그를 죽였습니다’로 직역성을 유지해 폭력의 즉시성과 의도성을 분명히 했습니다.
  alternative_readings:
  - ‘그를 쳐 죽였습니다’
  - ‘그를 살해했습니다’
  rationale: 원문은 단순한 사망이 아니라 능동적 살해를 말하므로, 완곡하게 누르지 않고 서술의 날카로움을 살렸습니다.
  doctrine_reference: 가인의 살인에 대한 성경적 증언
