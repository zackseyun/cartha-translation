  source_fidelity: Διέλθωμεν εἰς τὸ πεδίον은 ‘들로 들어갑시다’로 적절히 옮겼습니다. 그러나 ἀνέστη ... ἐπʼ Ἄβελ은 공격적으로 맞선 행위를 뜻하는데, 초안의 ‘아벨에게 일어나’는 한국어로 부자연스럽고 의미가 불명확합니다. ‘아벨에게 달려들어’가 문맥상 공격의 개시와 뒤따르는 살해를 정확하고 자연스럽게 드러냅니다.
  naturalness: ‘카인이 자기 형제 아벨에게 일어나’는 현대 표준 한국어에서 통용되는 결합이 아닙니다. 또한 영어 감사 이력의 대안 번역 각주는 발화문에 붙어야 하므로, 살해 서술 끝의 [a]를 인용문 안의 해당 어구 뒤로 옮겨야 합니다.
  terminology: ‘자기 형제 아벨’, ‘들’, ‘죽였습니다’는 관계 강조와 폭력 행위의 직접성을 잘 보존합니다. 합쇼체 서술 및 직접 인용의 ‘들로 들어갑시다’도 일관됩니다.
  issues:
  - severity: medium
    issue: ‘아벨에게 일어나’는 ἀνέστη ... ἐπʼ Ἄβελ의 부자연스러운 직역입니다.
    rationale: 한국어에서는 공격의 대상에 ‘일어나다’라고 하지 않으므로 뜻이 불투명합니다. ‘아벨에게 달려들어’는 ἐπί와 결합한 ἀνίστημι의 적대적·공격적 용법을 자연스럽게 전달합니다.
  - severity: low
