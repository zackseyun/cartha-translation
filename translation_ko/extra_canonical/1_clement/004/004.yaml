  to: 그리고 하나님께서 카인에게 말씀하셨습니다. “왜 네가 근심하게 되었으며, 왜 네 얼굴이 어두워졌습니까? 만일 네가 바르게 드리고도 바르게 나누지 않으면, 죄를 지은 것이 아닙니까?”
