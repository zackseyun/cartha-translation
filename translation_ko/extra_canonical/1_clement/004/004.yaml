id: 1CLEM.4.4
reference: 1 Clement 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν ὁ θεὸς πρὸς Κάϊν· Ἱνατί περίλυπος ἐγένου, καὶ ἱνατί συνέπεσεν τὸ πρόσωπόν σου; οὐκ ἐὰν ὀρθῶς προσενέγκῃς, ὀρθῶς δὲ μὴ διέλῃς, ἥμαρτες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/004.yaml
  text: And God said to Cain, ‘Why have you become grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned?’
translation:
  language: ko
  text: 그리고 하나님이 카인에게 말씀하셨습니다. “어찌하여 당신은 근심하게 되었으며, 어찌하여 당신의 얼굴이 가라앉았습니까? 만일 바르게 드리고도 바르게 나누지 않으면, 당신은 죄를 지은 것이 아닙니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  english_pob_choice: grieved
  chosen_korean: 근심하게 되었으며
  alternatives_korean:
  - 슬퍼하게 되었으며
  - 몹시 근심하게 되었으며
  lexicon: περίλυπος
  rationale: POB의 ‘grieved’를 과장하지 않고, 문맥상 내적 침울함을 드러내는 ‘근심하다’로 옮겼습니다.
- source_word: συνέπεσεν τὸ πρόσωπόν σου
  english_pob_choice: your face fallen
  chosen_korean: 당신의 얼굴이 가라앉았습니까
  alternatives_korean:
  - 당신의 얼굴이 떨어졌습니까
  - 당신의 얼굴이 어두워졌습니까
  lexicon: πρόσωπον + συνέπτω
  rationale: 얼굴이 ‘떨어지다’의 직역보다 한국어로 자연스럽고 상태 변화를 잘 드러내는 표현을 택했습니다.
- source_word: ὀρθῶς προσενέγκῃς ... ὀρθῶς δὲ μὴ διέλῃς
  english_pob_choice: offer rightly ... divide rightly
  chosen_korean: 바르게 드리고도 바르게 나누지
  alternatives_korean:
  - 올바르게 바치고도 올바르게 나누지
  - 제대로 제물로 드리고도 제대로 나누지
  lexicon: προσενέγκῃς / διέλῃς
  rationale: 제의적 행위를 살리되, POB의 대칭 구조를 따라 ‘바르게 드리고’와 ‘바르게 나누지’로 대응시켰습니다.
- source_word: ἥμαρτες
  english_pob_choice: have you not sinned?
  chosen_korean: 죄를 지은 것이 아닙니까
  alternatives_korean:
  - 죄를 지은 것이 아니냐
  - 죄를 범한 것이 아닙니까
  lexicon: ἁμαρτάνω
  rationale: 수사 의문문의 반문성을 유지하면서도 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: Cain에게 직접 질문하는 하나님의 화법의 존중 표현
  chosen_reading: 직접 인용문 안에서는 2인칭을 ‘당신’으로 두어 하나님 말씀의 직접성과 공적 호소성을 살렸습니다.
  alternative_readings:
  - ‘네가’로 친밀하게 옮김
  - 이름 반복 없이 생략
  rationale: 이 문맥은 서술자의 진술보다 하나님의 직접 발화이므로, 합쇼체 본문 안에서도 경어를 유지해 말씀의 위상을 드러냈습니다.
  doctrine_reference: 신적 발화의 직접성 및 경외의 언어
