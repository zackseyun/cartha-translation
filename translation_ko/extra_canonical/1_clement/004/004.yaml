  - severity: low
    issue: ‘얼굴이 가라앉았습니까’의 관용성
    rationale: 직역적 의미는 전달되지만, 낙담·침울한 안색을 뜻하는 이 문맥에서는 ‘얼굴이 어두워졌습니까’가 현대 한국어에서 더 자연스럽습니다.
  revised_text: 그리고 하나님께서 카인에게 말씀하셨습니다. “왜 네가 근심하게 되었으며, 왜 네 얼굴이 어두워졌습니까? 만일 네가 바르게 드리고도 바르게 나누지 않으면, 죄를 지은 것이 아닙니까?”
