  to: 하나님께서는 아벨과 그의 예물들을 돌아보셨으나, 가인과 그의 제사들은 돌아보지 않으셨습니다.[a]
  rationale: 원문의 병렬 구조와 δῶρα/θυσίαι의 어휘적 구별을 보존하기 위해 ‘예물들’과 ‘제사들’을 구별했습니다. ‘돌아보다’는 ἐπὶ + βλέπειν 및 προσέχειν이 이 문맥에서 나타내는 호의적 주목/관심을 자연스럽게 전달하되, ‘받으셨다’처럼 수용을 본문보다 강하게 단정하지 않습니다.
  reviewer_model: gpt-5.6-terra
