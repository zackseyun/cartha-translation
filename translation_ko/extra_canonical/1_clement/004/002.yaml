id: 1CLEM.4.2
reference: 1 Clement 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶδεν ὁ θεὸς ἐπὶ Ἄβελ καὶ ἐπὶ τοῖς δώροις αὐτοῦ, ἐπὶ δὲ Κάϊν καὶ ἐπὶ ταῖς θυσίαις αὐτοῦ οὐ προσέσχεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/002.yaml
  text: And God looked upon Abel and upon his gifts[a], but to Cain and to his sacrifices he paid no heed.
  footnotes:
  - marker: a
    text: Or 'but upon Cain and upon his sacrifices he did not pay attention.'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서는 아벨과 그의 제물들을 보셨지만, 가인과 그의 제물에는 눈길을 두지 않으셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν ὁ θεός ἐπὶ
  english_pob_choice: looked upon
  chosen_korean: 보셨지만
  alternatives_korean:
  - 눈길을 두셨지만
  - 살피셨지만
  - 바라보셨지만
  lexicon: θεός / ἐπί
  rationale: ἐπὶ와 함께 쓰인 ‘보다’는 단순 시선이 아니라 호의적 관심을 내포하므로, 자연스럽되 의미를 살려 ‘보셨지만’으로 옮겼습니다.
- source_word: τοῖς δώροις αὐτοῦ
  english_pob_choice: his gifts
  chosen_korean: 그의 제물들을
  alternatives_korean:
  - 그의 선물들을
  - 그의 예물들을
  - 그의 제사드린 것들을
  lexicon: δῶρα
  rationale: 문맥상 창세기 제사 이야기의 헌물이며, 단순한 ‘선물’보다 제의적 성격을 드러내는 ‘제물들’이 원문 의도를 더 잘 반영합니다.
- source_word: θυσίαις αὐτοῦ
  english_pob_choice: his sacrifices
  chosen_korean: 그의 제물에는
  alternatives_korean:
  - 그의 희생제사에는
  - 그의 희생제물에는
  - 그의 제사에는
  lexicon: θυσία
  rationale: 앞의 δῶρα와 병렬을 살려 같은 범주의 제의적 헌물을 가리키는 표현으로 ‘제물’ 계열을 유지했습니다.
- source_word: οὐ προσέσχεν
  english_pob_choice: paid no heed
  chosen_korean: 눈길을 두지 않으셨습니다
  alternatives_korean:
  - 주의를 기울이지 않으셨습니다
  - 돌보지 않으셨습니다
  - 가리키지 않으셨습니다
  lexicon: προσέχω
  rationale: προσέχω는 ‘주의를 기울이다/돌보다/주목하다’의 뜻이므로, 영어 POB의 ‘paid no heed’를 살리면서도 한국어에서 가장 자연스럽게 무관심을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 하나님의 시선이 아벨에게는 향하고 가인에게는 향하지 않는 대조
  chosen_reading: 호의와 수용의 차이를 드러내는 서술로 번역했습니다.
  alternative_readings:
  - 단순한 관찰로 완화하는 번역
  - 심판적 거절로 강하게 해석하는 번역
  rationale: 본문의 동사는 단순히 ‘보다’가 아니라 제물에 대한 인정/수용의 차이를 암시하므로, 지나치게 약화하거나 과도하게 신학화하지 않고 대조 자체를 유지했습니다.
  doctrine_reference: 창세기 4장 계열의 제사 수납/불수납 전승
