  text: διὰ ζῆλος Δαυὶδ φθόνον ἔσχεν οὐ μόνον ὑπὸ τῶν ἀλλοφύλων, ἀλλὰ καὶ ὑπὸ Σαοὺλ βασιλέως Ἰσραὴλ ἐδιώχθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/013.yaml
  text: Because of jealousy David incurred envy not only from the foreigners[a], but was also persecuted by Saul king of Israel.
  footnotes:
  - marker: a
    text: Or 'incurred envy not only from the foreigners'.
    reason: previous_rendering
translation:
  language: ko
  text: 질투 때문에 다윗은 이방인들에게서 시기를 받았을 뿐 아니라, 이스라엘 왕 사울에게 박해를 받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  english_pob_choice: Because of jealousy
  chosen_korean: 질투 때문에
  alternatives_korean:
  - 질투로 인해
  - 질투로 말미암아
  lexicon: διά + ζῆλος
  rationale: 원문의 원인 관계를 자연스러운 한국어로 풀되, 과도한 해석 없이 간명하게 옮겼습니다.
- source_word: φθόνον ἔσχεν
  english_pob_choice: incurred envy
  chosen_korean: 시기를 받았습니다
  alternatives_korean:
  - 시기를 샀습니다
  - 질투를 받았습니다
  - 시기의 대상이 되었습니다
  lexicon: φθόνος
  rationale: 그리스어 관용구는 ‘~의 시기의 대상이 되다’라는 뜻이므로, 한국어에서는 수동적 관계를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: ὑπὸ τῶν ἀλλοφύλων / ὑπὸ Σαοὺλ βασιλέως Ἰσραὴλ
  english_pob_choice: from the foreigners ... by Saul king of Israel
  chosen_korean: 이방인들로부터만이 아니라 이스라엘의 왕 사울에게서도
  alternatives_korean:
  - 외국인들에게서만이 아니라 ... 사울 왕에게서도
  - 이방 민족들에게서만이 아니라 ... 사울 이스라엘 왕에게서도
  lexicon: ὑπό + γενitive
  rationale: ὑπό는 행위자/원천를 표시하므로 두 절 모두에서 ‘~에게서/로부터’로 일관되게 살렸고, ἀλλόφυλοι는 문맥상 ‘이방인들’로 옮겼습니다.
- source_word: Σαοὺλ βασιλέως Ἰσραὴλ
  english_pob_choice: Saul king of Israel
  chosen_korean: 이스라엘의 왕 사울
  alternatives_korean:
  - 사울 이스라엘 왕
  - 이스라엘 왕 사울
  lexicon: apposition
  rationale: 직역적 호칭보다 한국어 서술 흐름에 맞게 동격 구조를 자연스럽게 정리했습니다.
