id: 1CLEM.4.8
reference: 1 Clement 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ζῆλος ὁ πατὴρ ἡμῶν Ἰακὼβ ἀπέδρα ἀπὸ προσώπου Ἠσαῦ τοῦ ἀδελφοῦ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004/008.yaml
  text: Because of jealousy our father Jacob fled from the face of Esau his brother.
translation:
  language: ko
  text: 질투 때문에 우리 조상 야곱은 그의 형 에서의 얼굴 앞에서 도망했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλος
  english_pob_choice: Because of jealousy
  chosen_korean: 질투 때문에
  alternatives_korean:
  - 시기 때문에
  - 질투로 인해
  lexicon: ζῆλος
  rationale: English POB가 jealousy를 택한 점을 따라, 관계를 깨뜨리는 감정의 원인을 직접 드러내는 ‘질투’로 옮겼습니다.
- source_word: ὁ πατὴρ ἡμῶν Ἰακώβ
  english_pob_choice: our father Jacob
  chosen_korean: 우리 조상 야곱
  alternatives_korean:
  - 우리 아버지 야곱
  - 우리 선조 야곱
  lexicon: πατήρ
  rationale: 문맥상 혈연적 아버지라기보다 믿음의 조상/조상이라는 집단적 호칭이 자연스러워 ‘우리 조상’으로 옮겼습니다.
- source_word: ἀπέδρα ἀπὸ προσώπου
  english_pob_choice: fled from the face of
  chosen_korean: …의 얼굴 앞에서 도망했습니다
  alternatives_korean:
  - …의 앞에서 도망했습니다
  - …을 피해 달아났습니다
  lexicon: ἀποδιδράσκω / πρόσωπον
  rationale: 직역하면 ‘얼굴 앞에서’이지만 한국어에서는 매우 낯설 수 있어, 원문의 이미지가 보이도록 ‘얼굴 앞에서 도망했습니다’로 유지했습니다.
- source_word: τοῦ ἀδελφοῦ αὐτοῦ
  english_pob_choice: his brother
  chosen_korean: 그의 형 에서
  alternatives_korean:
  - 그의 형제 에서
  - 형 에서
  lexicon: ἀδελφός
  rationale: 형제관계가 분명하므로 ‘형’으로 옮기고, 대상이 에서임을 자연스럽게 붙였습니다.
theological_decisions:
- issue: ‘우리 아버지/조상 야곱’의 호칭
  chosen_reading: 공동체가 믿음의 계보 안에서 야곱을 자기 조상으로 부르는 표현으로 처리했습니다.
  alternative_readings:
  - 직접적 생물학적 ‘아버지’로 유지
  - ‘선조’로 일반화
  rationale: 1 Clement의 수신 공동체가 성경 인물을 자기 정체성의 계보 안에 두는 수사이므로, 한국어에서도 그 공동체적 호칭을 살렸습니다.
  doctrine_reference: 공동체 기억과 언약 계보의 수사적 사용
- issue: ‘얼굴 앞에서’의 공간적 표현
  chosen_reading: 원문 이미지인 πρόσωπον을 약화시키지 않고, 서술문 안에서 이해 가능한 정도로 유지했습니다.
  alternative_readings:
  - ‘에서를 피해 도망했습니다’로 의역
  - ‘에서의 얼굴에서 도망했습니다’로 더 직역
  rationale: 원문은 단순한 탈출이 아니라 상대의 존재/면전 앞에서의 도주를 말하므로, 이미지 보존을 우선했습니다.
  doctrine_reference: 본문의 수사적 이미지 보존
