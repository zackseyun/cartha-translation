  text: “잠잠하십시오. 그의 돌이킴은 당신을 향해 있으며, 당신은 그를 다스리게 될 것입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσύχασον
  english_pob_choice: Be still
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 가만히 있으십시오
  - 고요히 하십시오
  lexicon: ἡσυχάζω
  rationale: 명령형으로서 ‘조용히/잠잠히 하다’의 뜻을 살리되, 합쇼체의 직접 권면에 자연스럽고 문맥상 강한 정적을 전달합니다.
- source_word: ἀποστροφή
  english_pob_choice: his turning
  chosen_korean: 그의 돌이킴
  alternatives_korean:
  - 그의 돌아섬
  - 그의 전환
  lexicon: ἀποστροφή
  rationale: ‘돌이킴’은 방향 전환의 기본 의미를 비교적 सीधे하고 성경적으로 전달하며, 단순한 물리적 ‘돌아섬’보다 목적성 있는 전환을 드러냅니다.
- source_word: ἄρξεις
  english_pob_choice: you shall rule over him
  chosen_korean: 당신은 그를 다스리게 될 것입니다
  alternatives_korean:
  - 당신이 그를 지배하게 될 것입니다
  - 당신은 그 위에 군림하게 될 것입니다
  lexicon: ἄρχω
  rationale: ‘다스리다’는 통치/지배의 의미를 유지하면서도 한국어에서 가장 중립적이고 본문에 충실한 표현입니다.
