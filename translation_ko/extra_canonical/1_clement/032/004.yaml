id: 1CLEM.32.4
reference: 1 Clement 32:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/004.yaml
  text: And so we also[a], having been called through his will in Christ Jesus, are not justified by ourselves, nor by our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, by which the Almighty God has justified all who have been from the beginning. To him be the glory forever and ever[b]. Amen.
  footnotes:
  - marker: a
    text: Or 'Messiah Jesus'.
    reason: previous_rendering
  - marker: b
    text: Or 'works that we have done'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 우리도 그의 뜻에 따라 예수 그리스도 안에서 부르심을 받았으므로, 우리 자신으로 말미암아 의롭다 함을 얻는 것이 아니라, 우리의 지혜나 분별이나 경건이나, 마음의 거룩함 가운데 우리가 행한 일들로 말미암아 의롭다 함을 얻는 것도 아니며, 오직 믿음으로 말미암습니다. 이 믿음을 통해 전능하신 하나님께서는 처음부터 있었던 모든 사람을 의롭다 하셨습니다. 그분께 영광이 세세토록 있기를 빕니다. 아멘.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  english_pob_choice: in Christ Jesus
  chosen_korean: 예수 그리스도 안에서
  alternatives_korean:
  - 메시아 예수 안에서
  - 그리스도 예수 안에서
  lexicon: Χριστός
  rationale: 이 구절은 1세기 교회 서신의 고정 표현에 가까워, 본문을 과도하게 유대화하기보다 표준적인 호칭 구조를 살려 옮겼습니다. 한국어에서는 자연스러운 서신체 관용에 따라 ‘예수 그리스도 안에서’를 택했습니다.
- source_word: δικαιούμεθα / ἐδικαίωσεν
  english_pob_choice: are justified / has justified
  chosen_korean: 의롭다 함을 얻는 것이 아니라 / 의롭다 하셨습니다
  alternatives_korean:
  - 칭의받는 것이 아니라 / 칭의하셨습니다
  - 의롭게 여기심을 받는 것이 아니라 / 의롭게 여기셨습니다
  lexicon: δικαιόω
  rationale: δικαιόω는 법정적·언약적 ‘의롭다 선고하다’의 의미를 담으므로, 한국어에서는 교회적 진부어보다 문맥이 드러나는 ‘의롭다 함을 얻다/의롭다 하다’를 사용했습니다.
- source_word: σοφίας ἢ συνέσεως ἢ εὐσεβείας
  english_pob_choice: wisdom or understanding or godliness
  chosen_korean: 지혜나 분별이나 경건
  alternatives_korean:
  - 지혜나 깨달음이나 경건
  - 지혜나 총명이나 경건
  lexicon: σοφία / σύνεσις / εὐσέβεια
  rationale: σύνεσις는 단순한 지식보다 분별·통찰에 가깝고, εὐσέβεια는 외적 종교행위보다 경건한 삶의 태도를 가리키므로 각각의 결을 살려 옮겼습니다.
- source_word: ἔργων ὧν κατειργασάμεθα
  english_pob_choice: works that we have done
  chosen_korean: 우리가 행한 일들
  alternatives_korean:
  - 우리가 성취한 일들
  - 우리가 이룬 일들
  lexicon: κατεργάζομαι
  rationale: 이 동사는 단순히 ‘하다’보다 ‘행해 이루다’의 뉘앙스가 있으나, 문맥상 자랑의 대상인 행위를 평이하게 드러내기 위해 ‘행한 일들’로 옮겼습니다.
- source_word: παντοκράτωρ θεός
  english_pob_choice: the Almighty God
  chosen_korean: 전능하신 하나님
  alternatives_korean:
  - 만유를 다스리시는 하나님
  - 전능의 하나님
  lexicon: παντοκράτωρ
  rationale: 공식적 예배체 문체와 잘 맞는 ‘전능하신 하나님’을 유지하되, 본문이 지닌 존칭적 호칭성을 살렸습니다.
theological_decisions:
- issue: ‘하늘/세상’이 아닌 ‘의롭다 함’의 공적 선언성
  chosen_reading: 본문의 δικαιόω를 단순한 도덕적 개선이 아니라 하나님 앞에서의 의롭다 하심으로 표현했습니다.
  alternative_readings:
  - 도덕적으로 옳게 만듦
  - 죄 사함만을 뜻함
  rationale: 문맥은 인간의 공로를 배제하고 하나님의 선포를 강조하므로, ‘의롭다 함을 얻다/의롭다 하다’가 가장 정확합니다.
  doctrine_reference: 칭의(의롭다 하심) 이해
- issue: ἔστω ἡ δόξα의 기원문을 한국어 예배체로 처리
  chosen_reading: ‘그분께 영광이 세세토록 있기를 빕니다’로 옮겨, 찬양의 소망적·기도적 어조를 유지했습니다.
  alternative_readings:
  - 그분께 영광이 영원무궁토록 있습니다
  - 그분께 영광이 영원무궁하리이다
  rationale: 문장의 기능은 진술보다 송영이므로, 현대 한국어에서 자연스러운 예배적 서술로 재현했습니다.
  doctrine_reference: 송영(doxology)
