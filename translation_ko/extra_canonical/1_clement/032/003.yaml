  rationale: 원문의 οὐ δι’ … ἀλλὰ διὰ … 대조와 두 수동 동사 ἐδοξάσθησαν, ἐμεγαλύνθησαν을 한국어 문장 안에서 명확히 보존했습니다. ‘모두’는 원문의 범위를 유지하고, ‘그렇게 되었습니다’는 앞의 ‘영광을 받고 크게 된’ 내용을 받아 중복을 피하면서도 원인 대조를 분명히 합니다. 근거 없는 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:47Z'
