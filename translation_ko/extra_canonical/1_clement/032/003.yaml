id: 1CLEM.32.3
reference: 1 Clement 32:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οὖν ἐδοξάσθησαν καὶ ἐμεγαλύνθησαν οὐ δι’ αὑτῶν ἢ τῶν ἔργων αὐτῶν ἢ τῆς δικαιοπραγίας ἧς κατειργάσαντο, ἀλλὰ διὰ τοῦ θελήματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/003.yaml
  text: Therefore all were glorified and magnified, not through themselves or through their works or through the righteous deeds that they did, but through his will.
translation:
  language: ko
  text: 그러므로 모든 사람이 자기 자신이나 자기들의 행위나 자신들이 행한 의로운 행위로 말미암은 것이 아니라, 오직 그의 뜻으로 말미암아 영광을 받았고 크게 되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  english_pob_choice: were glorified
  chosen_korean: 영광을 받았고
  alternatives_korean:
  - 영광스럽게 되었습니다
  - 영화롭게 되었습니다
  lexicon: δοξάζω
  rationale: 수동 의미를 살리면서도 한국어에서 자연스럽게 ‘영광을 받다’로 옮겨, 뒤의 ‘크게 되었습니다’와 병렬을 이루게 했습니다.
- source_word: ἐμεγαλύνθησαν
  english_pob_choice: were magnified
  chosen_korean: 크게 되었습니다
  alternatives_korean:
  - 높아졌습니다
  - 존귀하게 되었습니다
  lexicon: μεγαλύνω
  rationale: 직역식 ‘크게 하다’보다 수동형의 결과를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: δικαιοπραγίας
  english_pob_choice: righteous deeds
  chosen_korean: 의로운 행위
  alternatives_korean:
  - 의로운 일
  - 의의 행위
  lexicon: δικαιοπραγία
  rationale: 명사형의 행위성을 살리되, 한국어에서 지나치게 교리화된 표현을 피하고 본문 대비를 분명히 했습니다.
- source_word: διὰ τοῦ θελήματος αὐτοῦ
  english_pob_choice: through his will
  chosen_korean: 오직 그의 뜻으로 말미암아
  alternatives_korean:
  - 그의 뜻을 통해
  - 그의 뜻에 의해
  lexicon: θέλημα
  rationale: 원인/매개를 나타내는 διά를 살려 ‘말미암아’로 옮기고, 앞의 부정 대조를 ‘오직’으로 분명히 했습니다.
theological_decisions:
- issue: 사람의 공로나 행위가 아닌 하나님의 뜻이 근거라는 대조
  chosen_reading: 모든 영광과 큰 됨의 근거를 자기 자신과 행위가 아니라 하나님의 뜻에 둡니다.
  alternative_readings:
  - 인간의 선행이 일부 공로를 가진다는 완화된 표현
  - 하나님의 뜻과 인간 행위를 병렬적으로 인정하는 표현
  rationale: 본문의 οὐ... ἀλλὰ... 대조가 공적 원인을 철저히 배제하고 하나님의 뜻만을 원인으로 제시하므로, 이를 흐리지 않도록 유지했습니다.
  doctrine_reference: 은혜와 공로의 대조
