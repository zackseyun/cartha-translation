id: 1CLEM.32.1
reference: 1 Clement 32:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἐὰν τις καθ’ ἓν ἕκαστον εἰλικρινῶς κατανοήσῃ, ἐπιγνώσεται μεγαλεῖα τῶν ὑπ’ αὐτοῦ δεδομένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/001.yaml
  text: If anyone sincerely considers this point by point, he will recognize the greatness of the gifts given by him.
  footnotes:
  - marker: a
    text: Or 'Whoever sincerely considers each thing one by one will recognize'.
    reason: previous_rendering
translation:
  language: ko
  text: 누구든지 이것을 하나하나 진실하게 살펴보면, 그분께서 주신 선물들의 위대함을 깨닫게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃ ἐὰν τις
  english_pob_choice: If anyone
  chosen_korean: 누구든지 이것을
  alternatives_korean:
  - 만일 누구든지
  - 누구든지 이것을
  lexicon: conditional relative pronoun + indefinite pronoun
  rationale: 그리스어는 ἐὰν τις의 조건문이면서 앞의 Ὃ가 지시대명사적 목적어로 기능하므로, 단순한 ‘누구든지’보다 ‘이것을’까지 드러내어 문장 구조를 반영했습니다.
- source_word: καθ’ ἓν ἕκαστον
  english_pob_choice: point by point
  chosen_korean: 각 항목마다
  alternatives_korean:
  - 하나하나
  - 한 가지씩
  lexicon: adverbial distributive phrase
  rationale: ‘점별로’보다는 한국어에서 자연스럽고 분배적 뉘앙스를 살리는 ‘각 항목마다’를 택해, 개별적으로 차례차례 살피는 의미를 전달했습니다.
- source_word: κατανοήσῃ
  english_pob_choice: considers
  chosen_korean: 진지하게 살펴보면
  alternatives_korean:
  - 고려하면
  - 깊이 살피면
  lexicon: comprehend/consider carefully
  rationale: 단순한 지적 검토보다 주의를 기울여 파악하는 의미가 강하므로, ‘진지하게 살펴보면’으로 옮겼습니다.
- source_word: μεγαλεῖα
  english_pob_choice: the greatness
  chosen_korean: 위대함
  alternatives_korean:
  - 큰일들
  - 장엄함
  - 위대한 일들
  lexicon: great things / greatness
  rationale: 문맥상 하나님의 선물들의 탁월함을 가리키므로 추상명사 ‘위대함’이 가장 간결하면서도 원문의 감탄적 의미를 살립니다.
- source_word: ὑπ’ αὐτοῦ δεδομένων δωρεῶν
  english_pob_choice: gifts given by him
  chosen_korean: 그분이 주신 은사들의
  alternatives_korean:
  - 그분이 주신 선물들의
  - 그분에게서 받은 은혜의 선물들의
  lexicon: gift/donation; divine referent implied by context
  rationale: δώρεα는 ‘선물/은사’의 뜻이 가능하나, 교부 문맥의 은혜로운 부여를 반영해 ‘은사’로 옮기되, 주체를 분명히 드러내어 ‘그분이 주신’으로 처리했습니다.
theological_decisions:
- issue: 선물의 주체를 직접적으로 밝히는지 여부
  chosen_reading: 본문의 αὐτοῦ는 문맥상 하나님/주께서 주신 선물을 가리키므로, 한국어 본문에서는 ‘그분’으로 표현해 명시적 신적 지시를 유지했습니다.
  alternative_readings:
  - 문맥에 맞춰 ‘하나님이 주신’으로 구체화
  - 중립적으로 ‘그가 주신’으로 유지
  rationale: 원문이 인칭대명사만 사용하므로, 본문에는 과잉 해석을 피하면서도 문맥상 신적 주체를 놓치지 않도록 ‘그분’이 적절합니다.
  doctrine_reference: source-level referent identification
- issue: '논리 구조: 조건문과 결과문의 연결'
  chosen_reading: ‘누구든지 … 살펴보면, … 깨닫게 될 것입니다’로 조건-결과를 분명히 살렸습니다.
  alternative_readings:
  - ‘누구든지 … 살핀다면, … 알게 될 것입니다’
  - ‘… 살펴보는 사람은 … 알아차릴 것입니다’
  rationale: 그리스어의 ἐὰν + 접속법과 미래 시제를 한국어의 조건-결과 구조로 자연스럽게 재현해, 교훈적 문장성을 유지했습니다.
  doctrine_reference: discourse coherence
