revisions:
- from: 그에게서 제사장들과 레위 사람들, 곧 하나님의 제단에서 섬기는 모든 이들이 나왔습니다. 그에게서 주 예수께서 육신을 따라 나셨습니다. 그에게서 유다에 따른 왕들과 통치자들과 지도자들이 나왔습니다. 그리고 그의 남은 홀들은 작은 영광에 있지 않습니다. 이는 하나님께서 약속하시며 말씀하신 바, “네 씨가 하늘의 별들 같을 것이다”라는 말씀과 같습니다.[a]
  to: 하나님의 제단에서 섬기는 모든 제사장과 레위 사람들은 그에게서 나왔습니다. 주 예수께서도 육신을 따라 그에게서 나셨습니다. 유다에 속한 왕들과 통치자들과 지도자들도 그에게서 나왔습니다. 그의 나머지 홀들도 적지 않은 영광을 누리고 있습니다. 이는 하나님께서 “네 씨가 하늘의 별들과 같게 될 것이다”라고 약속하신 것과 같습니다.
  rationale: 계보를 나타내는 반복된 ἐξ αὐτοῦ를 한국어 문장마다 ‘그에게서 나왔습니다/나셨습니다’로 유지했습니다. 제단 봉사자를 제사장과 레위 사람 전체에 한정하는 원문의 수식 관계를 자연스럽게 앞세웠습니다. σκῆπτρα는 본문에서 ‘홀들’로 보존하고, ‘적지 않은 영광’을 통해 원문의 부정 완곡법을 살렸습니다. 영어 감사 기록의 대안 표기는 한국어 본문에 적용될 별도 번역 선택지를 제공하지 않으므로 각주 표지와 각주는 두지 않았습니다.
