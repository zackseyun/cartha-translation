id: 1CLEM.32.2
reference: 1 Clement 32:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032/002.yaml
  text: For from him are priests and Levites[a], all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining scepters are in no small glory, just as God promised, saying, “Your seed will be as the stars of heaven.”
  footnotes:
  - marker: a
    text: Or 'are not in small glory'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님의 제단에서 섬기는 모든 제사장과 레위 사람들은 그에게서 나왔습니다. 주 예수께서도 육신을 따라 그에게서 나셨습니다. 유다에 속한 왕들과 통치자들과 지도자들도 그에게서 나왔습니다. 그의 나머지 홀들도 적지 않은 영광을 누리고 있습니다. 이는 하나님께서 “네 씨가 하늘의 별들과 같게 될 것이다”라고 약속하신 것과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερεῖς καὶ λευῖται
  english_pob_choice: priests and Levites
  chosen_korean: 제사장들과 레위 사람들
  alternatives_korean:
  - 제사장들과 레위인들
  - 제사장들과 레위인들
  lexicon: ἱερεύς, Λευίτης
  rationale: ἱερεῖς는 제사장들로, λευῖται는 혈통·직분을 드러내기 위해 레위 사람들로 옮겼습니다. 교회직 호칭보다 성전 맥락의 역사적 집단을 살리는 것이 원문에 가깝습니다.
- source_word: οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ
  english_pob_choice: all who minister at the altar of God
  chosen_korean: 하나님의 제단에서 섬기는 모든 이들
  alternatives_korean:
  - 하나님의 제단에서 봉사하는 모든 이들
  - 하나님의 제단에서 시중드는 모든 이들
  lexicon: λειτουργέω, θυσιαστήριον
  rationale: λειτουργοῦντες는 예배적 봉사를 뜻하므로 ‘섬기는’으로 자연스럽게 옮겼고, θυσιαστηρίῳ는 제단으로 유지해 제의적 배경을 보존했습니다.
- source_word: τὸ κατὰ σάρκα
  english_pob_choice: according to the flesh
  chosen_korean: 육신을 따라
  alternatives_korean:
  - 육체를 따라
  - 혈통상
  lexicon: σάρξ
  rationale: POB의 ‘according to the flesh’를 직역하되, 한국어에서 더 자연스러운 ‘육신을 따라’로 옮겨 육체적 출생/혈통의 의미를 살렸습니다.
- source_word: σκῆπτρα
  english_pob_choice: scepters
  chosen_korean: 홀들
  alternatives_korean:
  - 홀
  - 왕홀
  - 지팡이들
  lexicon: σκῆπτρον
  rationale: σκῆπτρα를 POB의 ‘scepters’에 맞춰 홀들로 옮겼습니다. 단순한 ‘지팡이’보다 왕권 표지라는 상징을 보존합니다.
theological_decisions:
- issue: “주 예수”의 칭호와 “육신을 따라”의 결합
  chosen_reading: 주 예수께서 참된 인간 혈통 안에서 다윗/유다 계열에 속하신다는 진술로 읽고, 칭호는 그대로 ‘주 예수’로 유지했습니다.
  alternative_readings:
  - 예수님
  - 주 예수 그리스도
  rationale: 원문은 κυριος Ἰησοῦς와 τὸ κατὰ σάρκα를 병치하여 그분의 주되심과 역사적 혈통을 함께 말합니다. 한국어에서도 둘을 분리하지 않고 유지하는 편이 신학적 긴장을 살립니다.
  doctrine_reference: 기독론, 성육신
