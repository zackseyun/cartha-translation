source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
  pages:
  - 343
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064.yaml
  text: Finally[a], may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has called upon his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity[b], and sound judgment, for the pleasing of his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages[d][c]. Amen.
  footnotes:
  - marker: a
    text: Or 'every soul that calls upon his magnificent and holy name.' The Greek participle may be taken in relation to invoking the name, though the passive sense 'called by' better fits the form.
    reason: lexical_alternative
  - marker: b
    text: '''A people for his own possession'' echoes covenant language from the Greek Scriptures; compare expressions in Exodus 19:5 and Deuteronomy 7:6.'
    reason: cross_reference
  - marker: c
    text: The final doxology most likely gives glory to God through Jesus Messiah, though some may hear the wording as more directly christological because of the immediately preceding relative clause.
    reason: alternative_reading
  - marker: d
    text: Or 'that has been called by his magnificent and holy name'.
    reason: previous_rendering
translation:
  language: ko
  text: 마지막으로, 모든 것을 살피시는 하나님이시며 영들의 주인이시고 모든 육체의 주님이신 분, 곧 주 예수 메시아와 우리를 그를 통해 자기 소유의 백성이 되도록 선택하신 분께서, 그분의 크고 거룩한 이름을 부르는 모든 영혼에게 믿음과 두려움과 평강과 인내와 오래 참음과 절제와 순결과 건전한 판단력을 주셔서, 우리 대제사장이시며 보호자이신 예수 메시아를 통해 그분의 이름을 기쁘시게 하게 하시기를 바랍니다. 그분께 영광과 위엄과 권세와 존귀가 이제와 영원 무궁한 세월에 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντεπόπτης
  english_pob_choice: all-seeing
  chosen_korean: 모든 것을 살피시는
  alternatives_korean:
  - 모든 것을 보시는
  - 전부를 보시는
  lexicon: LSJ
  rationale: 하나님의 전지와 감찰을 드러내는 도서적·예배적 표현으로, ‘모든 것을 살피시는’이 원문의 높임과 포괄성을 자연스럽게 살립니다.
- source_word: δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός
  english_pob_choice: Master of spirits and Lord of all flesh
  chosen_korean: 영들의 주인이시고 모든 육체의 주님이신
  alternatives_korean:
  - 영들의 주님이시고 모든 육체의 주이신
  - 영들의 주인이시며 모든 육체의 주님이신
  lexicon: BDAG
  rationale: δεσπότης는 κύριος와 구별되는 소유·지배의 뉘앙스를 가져 ‘주인’으로, κύριος는 문맥상 반복되는 호칭이므로 ‘주님’으로 구분했습니다.
- source_word: λαὸν περιούσιον
  english_pob_choice: a people for his own possession
  chosen_korean: 자기 소유의 백성이 되도록
  alternatives_korean:
  - 자기 소유의 백성으로
  - 자기 소유로 삼은 백성이 되도록
  lexicon: BDAG
  rationale: 출 19:5, 신 7:6의 언약 언어를 살리되, 한국어에서 소유 관계를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ
  english_pob_choice: that has called upon his magnificent and holy name
  chosen_korean: 그분의 크고 거룩한 이름을 부르는
  alternatives_korean:
  - 그분의 크고 거룩한 이름으로 불린
  - 그분의 크고 거룩한 이름을 부른
  lexicon: BDAG
  rationale: 이 분사는 중간태 관용구 ἐπικαλεῖσθαι τὸ ὄνομα의 용례에 따라 ‘이름을 부르는’으로 번역하는 것이 문법과 관용 모두에 맞습니다.
- source_word: σωφροσύνην
  english_pob_choice: sound judgment
  chosen_korean: 건전한 판단력
  alternatives_korean:
  - 절제된 판단
  - 분별력
  lexicon: BDAG
  rationale: ἐγκράτεια(절제)와 구별되도록, 신중함·분별·절도를 함께 담는 현대적 표현으로 옮겼습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 문맥은 직함의 힘이 살아 있는 예배적 문장이므로, 본 프로젝트 기본어휘에 따라 ‘메시아’로 옮겨 원어의 칭호성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 결미 송영의 수신자
  chosen_reading: 그분께 영광과 위엄과 권세와 존귀가 ... 있기를
  alternative_readings:
  - 예수 메시아께 드리는 송영
  - 하나님께 드리는 송영
  rationale: 가장 가까운 선행사는 하나님이지만, 직전의 ‘그를 통해’라는 매개 구조를 보존하여 송영의 대상과 매개를 둘 다 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
