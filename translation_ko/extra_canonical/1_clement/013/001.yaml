id: 1CLEM.13.1
reference: 1 Clement 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονήσωμεν οὖν, ἀδελφοί, ἀποθέμενοι πᾶσαν ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς, καὶ ποιήσωμεν τὸ γεγραμμένον (λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον· Μὴ καυχάσθω ὁ σοφὸς ἐν τῇ σοφίᾳ αὐτοῦ μηδὲ ὁ ἰσχυρὸς ἐν τῇ ἰσχύϊ αὐτοῦ μηδὲ ὁ πλούσιος ἐν τῷ πλούτῳ αὐτοῦ, ἀλλ’ ἢ ὁ καυχώμενος ἐν κυρίῳ καυχάσθω, τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην), μάλιστα μεμνημένοι τῶν λόγων τοῦ κυρίου Ἰησοῦ, οὓς ἐλάλησεν διδάσκων ἐπιείκειαν καὶ μακροθυμίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/001.yaml
  text: 'Let us therefore be humble, brothers, laying aside all arrogance and conceit and foolishness and fits of anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience.'
  footnotes:
  - marker: a
    text: Or '“Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord,” to seek him and to do judgment and righteousness—'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 형제 여러분, 모든 오만과 거만함과 어리석음과 분노를 벗어 버리고, 겸손합시다. 또 성령께서 말씀하시듯이 기록된 것을 행합시다. 「지혜로운 자는 자기 지혜를 자랑하지 말며, 강한 자는 자기 힘을 자랑하지 말며, 부유한 자는 자기 부를 자랑하지 말라. 오직 자랑하는 자는 주 안에서 자랑하라. 이는 그를 찾고, 정의와 의를 행하게 하려 함이다」—특히 주 예수께서 말씀하신 것들을 기억합시다. 그분은 온유와 오래 참음을 가르치시면서 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  english_pob_choice: Let us therefore be humble
  chosen_korean: 겸손합시다
  alternatives_korean:
  - 마음을 낮춥시다
  - 겸허합시다
  lexicon: ταπεινοφρονέω
  rationale: 권고형 공동체 호소를 자연스러운 합쇼체 권면으로 옮기되, 단순 상태 진술보다 결단을 요구하는 뉘앙스를 살렸습니다.
- source_word: ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς
  english_pob_choice: all arrogance and conceit and foolishness and fits of anger
  chosen_korean: 모든 오만과 거만함과 어리석음과 분노
  alternatives_korean:
  - 모든 허세와 교만과 어리석음과 격분
  - 모든 자만과 뽐냄과 우매함과 화남
  lexicon: ἀλαζονεία / τύφος / ἀφροσύνη / ὀργή
  rationale: 서로 다른 결함들을 구분해 나열하는 구조를 보존했고, ὀργάς는 반복적·폭발적 분노의 복수형이지만 한국어에서는 복수성을 자연스럽게 통합해 표현했습니다.
- source_word: τὸ γεγραμμένον … λέγει γὰρ τὸ πνεῦμα τὸ ἅγιον
  english_pob_choice: what is written—for the Holy Spirit says
  chosen_korean: 기록된 것을 행합시다. 「… 성령께서 말씀하시듯이
  alternatives_korean:
  - 기록된 것을 행합시다. 「… 성령께서 말씀하십니다
  - 기록된 것을 실천합시다. 「… 성령이 말씀하시니
  lexicon: γέγραπται / λέγει
  rationale: ‘기록된 것’과 그 내용 전체를 구분해 옮기면서, 인용 도입을 한국어에서 자연스러운 ‘말씀하시듯이’로 처리해 직접 발화보다 인용 도입에 가깝게 보이도록 했습니다.
- source_word: κρίμα καὶ δικαιοσύνην
  english_pob_choice: judgment and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 판단과 의
  - 심판과 의
  lexicon: κρίμα / δικαιοσύνη
  rationale: κριμα는 문맥상 개인적 판단보다 하나님 앞의 공정한 판정과 실행을 가리키므로 ‘정의’로, δικαιοσύνη는 바울서신 전통과 일치하게 ‘의’로 유지했습니다.
theological_decisions:
- issue: 성령의 발화와 성경 인용의 경계
  chosen_reading: 인용문 전체를 성령의 말씀으로 처리하고, 그 안에 ‘그를 찾고, 정의와 의를 행하게 하려 함이다’까지 포함했습니다.
  alternative_readings:
  - 인용문을 ‘주 안에서 자랑하라’에서 끝내고 뒤 문구를 클레멘스의 해설로 분리
  - 내주 인용을 줄여 한국어 따옴표를 더 일찍 닫기
  rationale: 그리스어는 τοῦ ἐκζητεῖν αὐτὸν καὶ ποιεῖν κρίμα καὶ δικαιοσύνην을 인용 내용 안에 유지하므로, 이를 밖으로 빼면 원문 구조와 audit trail을 훼손합니다.
  doctrine_reference: 성경 인용의 경계와 저자-성령 발화 구조
- issue: 주 예수의 말씀을 가리키는 호칭
  chosen_reading: ‘주 예수’와 ‘그분’의 지시를 그대로 살렸습니다.
  alternative_readings:
  - 예수님
  - 주님 예수
  rationale: 원문 Ἰησοῦς 앞의 κυρίου를 반영해 호칭의 주권성을 유지하면서도 한국어 문장에서는 과도한 반복을 피했습니다.
  doctrine_reference: 그리스도의 주권 호칭
