  to: '이 계명과 이 명령들로 우리 자신을 굳세게 하여, 그분의 거룩한 말씀들[a]에 순종하는 이들로서 살아가도록 합시다. 겸손한 마음을 품으면서 말입니다. 거룩한 말씀이 이렇게 말합니다:'
