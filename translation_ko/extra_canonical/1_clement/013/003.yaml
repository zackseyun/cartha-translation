id: 1CLEM.13.3
reference: 1 Clement 13:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ταύτῃ τῇ ἐντολῇ καὶ τοῖς παραγγέλμασι τούτοις στηρίξωμεν ἑαυτοὺς εἰς τὸ πορεύεσθαι ὑπηκόους ὄντας τοῖς ἁγιοπρεπέσι λόγοις αὐτοῦ, ταπεινοφρονοῦντες· φησὶν γὰρ ὁ ἅγιος λόγος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/003.yaml
  text: 'By this command and these injunctions let us strengthen ourselves to walk as those who are obedient to his holy words[a], being humble-minded. For the holy word says:'
  footnotes:
  - marker: a
    text: Or 'holy and fitting words'.
    reason: previous_rendering
translation:
  language: ko
  text: '이 계명과 이 명령들로 우리 자신을 굳세게 하여, 그분의 거룩한 말씀들[a]에 순종하는 이들로서 살아가도록 합시다. 겸손한 마음을 품으면서 말입니다. 거룩한 말씀이 이렇게 말합니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩함에 합당한 말씀들’.
    reason: ἁγιοπρεπέσι는 단순히 ‘거룩한’이라는 뜻으로도 쓰일 수 있으나, ‘거룩함에 합당한’ 또는 ‘거룩함을 드러내는’이라는 합성 형용사의 뉘앙스를 지닙니다.
lexical_decisions:
- source_word: ἐντολῇ
  english_pob_choice: command
  chosen_korean: 계명
  alternatives_korean:
  - 명령
  - 분부
  lexicon: ἐντολή
  rationale: 윤리적·권면적 문맥에서 ἐντολή는 단순한 지시보다 규범적 요구를 가리키므로, 한국어에서는 ‘계명’이 소스의 무게를 잘 드러냅니다.
- source_word: παραγγέλμασι
  english_pob_choice: injunctions
  chosen_korean: 명령들
  alternatives_korean:
  - 훈령들
  - 지시들
  lexicon: παράγγελμα
  rationale: ἐντολή와 짝을 이루는 복수 표현이므로 중복을 피하면서도 공적 권면의 강도를 살리는 ‘명령들’로 옮겼습니다.
- source_word: ἁγιοπρεπέσι λόγοις
  english_pob_choice: holy words
  chosen_korean: 거룩한 말씀들
  alternatives_korean:
  - 거룩함에 합당한 말씀들
  - 거룩에 어울리는 말씀들
  lexicon: ἁγιοπρεπής + λόγος
  rationale: 이 형용사는 ‘거룩함에 합당한/거룩을 드러내는’ 뜻이지만, 문맥상 자연스러운 한국어로는 ‘거룩한 말씀들’이 가장 직접적이며, POB의 최신 판단처럼 의미를 과도하게 분해하지 않습니다.
- source_word: στηρίξωμεν ἑαυτοὺς εἰς τὸ πορεύεσθαι
  english_pob_choice: let us strengthen ourselves to walk
  chosen_korean: 우리 자신을 굳세게 하여 … 걸어가며
  alternatives_korean:
  - 우리 자신을 세워 … 살도록
  - 우리 자신을 강하게 하여 … 행하도록
  lexicon: στηρίζω + πορεύομαι
  rationale: ‘굳세게 하다’는 내부적 결단과 지속적 삶의 태도를 함께 살리고, πορεύεσθαι는 단발적 행동보다 삶의 걸음을 뜻하므로 ‘걸어가다’로 옮겼습니다.
theological_decisions:
- issue: ὑπηκόους ὄντας의 관계 표현
  chosen_reading: ‘순종하는 자들처럼’으로 옮겨, ‘걷는 것’이 순종의 방식임을 드러냈습니다.
  alternative_readings:
  - ‘순종하는 상태로’
  - ‘순종하며’
  rationale: 직역하면 ‘순종하는 존재들로서’이지만, 한국어에서는 존재론적 표현보다 행위 양태를 밝히는 방식이 더 자연스럽고, 본문의 권면 의도를 잘 전달합니다.
  doctrine_reference: 윤리적 권면 문맥에서의 행위 양태 표현
- issue: φησὶν γὰρ ὁ ἅγιος λόγος의 의인화
  chosen_reading: ‘거룩한 말씀이 말씀하십니다’로 처리했습니다.
  alternative_readings:
  - ‘거룩한 말씀이 말합니다’
  - ‘거룩한 말씀이 이르십니다’
  rationale: 원문은 ‘거룩한 말씀’이 말하는 것으로 의인화하므로, 한국어에서도 주어의 인격적 발화를 살리되 과도한 장중함은 피했습니다.
  doctrine_reference: 성경/거룩한 말씀의 의인화 표현
