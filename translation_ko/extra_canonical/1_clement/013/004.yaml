translation:
  language: ko
  text: “내가 누구를 돌아보겠습니까? 온유하고 조용하며 내 말 앞에서 떠는 사람 외에?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπὶ τίνα ἐπιβλέψω
  english_pob_choice: Upon whom shall I look
  chosen_korean: “내가 누구를 보겠습니까?”
  alternatives_korean:
  - “누구를 바라보겠습니까?”
  - “내가 누구를 주목하겠습니까?”
  lexicon: ἐπιβλέπω
  rationale: 문맥상 단순한 시선의 이동이 아니라 하나님이 ‘돌아보는/주목하는’ 대상을 묻는 말이므로, 자연스러운 현대 한국어 질문형으로 옮기되 원문의 반문성을 살렸습니다.
- source_word: πρᾶον καὶ ἡσύχιον
  english_pob_choice: gentle and quiet
  chosen_korean: 온유하고 조용하며
  alternatives_korean:
  - 온유하고 차분하며
  - 순하고 잠잠하며
  lexicon: πρᾶος / ἡσύχιος
  rationale: πρᾶος는 ‘온유한’이 가장 직접적이고, ἡσύχιος는 ‘조용한/차분한’의 정적 뉘앙스를 가지므로 두 형용사를 모두 살려 병렬로 옮겼습니다.
- source_word: τρέμοντά μου τὰ λόγια
  english_pob_choice: trembles at my words
  chosen_korean: 내 말을 떠는
  alternatives_korean:
  - 내 말을 떨며
  - 내 말을 두려워하는
  lexicon: τρέμω + τὰ λόγια
  rationale: τρέμω는 문자적으로 ‘떨다’이지만, 여기서는 하나님의 말씀 앞에서의 경외와 떨림을 포함하므로 직역을 유지하되 한국어 어법에 맞게 목적어를 자연스럽게 붙였습니다.
theological_decisions:
- issue: 반문 구조와 단일 인물 묘사
  chosen_reading: ‘온유하고 조용하며 내 말을 떠는 그 사람’으로 한 사람을 가리키는 구조를 유지했습니다.
  alternative_readings:
  - ‘온유하고 조용한 사람과 내 말을 떠는 사람’처럼 둘로 나누는 읽기
  rationale: 그리스어는 단일 관사 τὸν이 세 서술어를 함께 지배하므로, 한국어에서도 한 사람의 세 특징으로 읽히게 해야 문법과 의미를 보존할 수 있습니다.
  doctrine_reference: Greek syntax / discourse coherence
