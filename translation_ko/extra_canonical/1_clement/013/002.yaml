id: 1CLEM.13.2
reference: 1 Clement 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ εἶπεν· Ἐλεεῖτε, ἵνα ἐλεηθῆτε· ἀφίετε, ἵνα ἀφεθῇ ὑμῖν· ὡς ποιεῖτε, οὕτω ποιηθήσεται ὑμῖν· ὡς δίδοτε, οὕτως δοθήσεται ὑμῖν· ὡς κρίνετε, οὕτως κριθήσεσθε· ὡς χρηστεύεσθε, οὕτως χρηστευθήσεται ὑμῖν· ᾧ μέτρῳ μετρεῖτε, ἐν αὐτῷ μετρηθήσεται ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013/002.yaml
  text: 'For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that you may be forgiven. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.”'
translation:
  language: ko
  text: 그러므로 이렇게 말씀하셨습니다. “긍휼을 베풀어라. 그러면 긍휼을 입을 것이다. 용서하여라. 그러면 너희도 용서받을 것이다. 너희가 하는 대로 너희에게도 그렇게 이루어질 것이다. 너희가 주는 대로 너희에게도 그렇게 주어질 것이다. 너희가 판단하는 대로 너희도 판단받을 것이다. 너희가 친절을 베푸는 대로 너희에게도 친절이 베풀어질 것이다. 너희가 재는 그 바로 그 잣대로 너희에게도 잴 것이다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεεῖτε / ἐλεηθῆτε
  english_pob_choice: Show mercy / receive mercy
  chosen_korean: 긍휼을 베풀어라 / 긍휼을 입을 것이다
  alternatives_korean:
  - 자비를 베풀어라 / 자비를 입을 것이다
  - 불쌍히 여기라 / 불쌍히 여김을 받을 것이다
  lexicon: ἐλεέω
  rationale: 동사 형태와 수동형을 살려 능동-수동 대응을 분명히 하면서도, 보편적 교회어인 ‘긍휼’을 사용해 상호성 문맥을 자연스럽게 표현했습니다.
- source_word: ἀφίετε / ἀφεθῇ
  english_pob_choice: Forgive / you may be forgiven
  chosen_korean: 용서하여라 / 너희도 용서받을 것이다
  alternatives_korean:
  - 사하여라 / 너희도 사함을 받을 것이다
  - 용서하라 / 너희가 용서함을 받을 것이다
  lexicon: ἀφίημι
  rationale: 수동형 ἀφεθῇ ὑμῖν을 한국어에서 직접적인 수동으로 옮겨, ‘너희도 용서받을 것이다’로 맞췄습니다.
- source_word: χρηστεύεσθε / χρηστευθήσεται
  english_pob_choice: show kindness / kindness will be shown
  chosen_korean: 친절을 베푸는 대로 / 친절이 베풀어질 것이다
  alternatives_korean:
  - 친절하게 대하는 대로 / 친절하게 대함을 받을 것이다
  - 선하게 대하는 대로 / 선하게 대함을 받을 것이다
  lexicon: χρηστεύομαι
  rationale: 영어 POB의 ‘kindness’에 맞추되, 동사의 행위성을 살리기 위해 ‘친절을 베풀다’로 옮겼습니다. 다만 한국어에서는 이 표현이 다소 해석적이어서 문맥상 ‘베풀다’ 구조를 유지했습니다.
- source_word: ᾧ μέτρῳ μετρεῖτε … μετρηθήσεται
  english_pob_choice: With the measure by which you measure, it will be measured to you
  chosen_korean: 너희가 재는 그 바로 그 잣대로 너희에게도 잴 것이다
  alternatives_korean:
  - 너희가 측량하는 그 척도로 너희에게도 측량될 것이다
  - 너희가 재는 그 기준대로 너희에게도 재일 것이다
  lexicon: μέτρον / μετρέω
  rationale: ‘measure’를 추상적 ‘기준’보다 구체적 ‘잣대’로 살려 반복되는 상호성 비유를 더 선명하게 드러냈습니다.
theological_decisions:
- issue: 인용문 도입부의 화자 지시
  chosen_reading: ‘그러므로 이렇게 말씀하셨습니다’로 옮겨, 인용문의 권위 있는 진술 성격을 유지했습니다.
  alternative_readings:
  - ‘이와 같이 말씀하셨습니다’
  - ‘이렇게 말씀하셨습니다’
  rationale: 그리스어 οὕτως γὰρ εἶπεν은 뒤따르는 격언적 인용을 도입하는 표현이므로, 과장 없이 자연스러운 서술형으로 처리했습니다.
  doctrine_reference: 성경 인용과 권위 있는 전승 진술
