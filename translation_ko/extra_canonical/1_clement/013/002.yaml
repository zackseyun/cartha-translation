review_pass:
  verdict: revise
  source_fidelity: The draft generally preserves the reciprocal sequence and the active/passive contrasts. However, γάρ is causal ('for'), not inferential ('therefore'), and the final clause should retain the passive sense more clearly. The unsupported footnote anchor should also be removed.
  naturalness: The quoted imperatives in the draft use 해라체, contrary to the requested modern formal-polite 합쇼체. Several passive expressions can be made more idiomatic while retaining the Greek reciprocity.
  terminology: ‘긍휼’ appropriately renders ἐλεεῖτε/ἐλεηθῆτε in this formal ecclesial register. ‘용서,’ ‘친절,’ and ‘잣대’ are clear and do not introduce doctrinal interpretation.
  issues:
  - severity: medium
    issue: The introduction renders γάρ as ‘그러므로.’
    rationale: 'γάρ gives the reason for the preceding statement: ‘For thus he said,’ rather than an inference, ‘Therefore.’'
  - severity: medium
    issue: The direct-speech imperatives are in 해라체 (‘베풀어라,’ ‘용서하여라’).
    rationale: The requested target register is modern formal-polite 합쇼체; ‘베푸십시오’ and ‘용서하십시오’ meet that requirement.
  - severity: low
    issue: The final clause says ‘너희에게도 잴 것이다.’
    rationale: The Greek μετρηθήσεται is passive. ‘너희에게도 재어질 것입니다’ preserves the passive reciprocity and is natural Korean.
  - severity: low
    issue: The text contains an [a] anchor without a supplied footnote.
    rationale: An unpaired anchor is structurally unsupported and should be removed.
  revised_text: 그가 이렇게 말씀하셨기 때문입니다. “긍휼을 베푸십시오. 그러면 긍휼을 입을 것입니다. 용서하십시오. 그러면 여러분도 용서받을 것입니다. 여러분이 하는 대로 여러분에게도 그렇게 이루어질 것입니다. 여러분이 주는 대로 여러분에게도 그렇게 주어질 것입니다. 여러분이 판단하는 대로 여러분도 판단받을 것입니다. 여러분이 친절을 베푸는 대로 여러분도 친절을 받을 것입니다. 여러분이 재는 그 잣대로 여러분에게도 재어질 것입니다.”
