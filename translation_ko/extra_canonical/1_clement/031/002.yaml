id: 1CLEM.31.2
reference: 1 Clement 31:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τίνος χάριν ηὐλογήθη ὁ πατὴρ ἡμῶν Ἀβραάμ, οὐχὶ δικαιοσύνην καὶ ἀλήθειαν διὰ πίστεως ποιήσας;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/002.yaml
  text: For what reason was our father Abraham blessed? Was it not because he did righteousness and truth through faith?
translation:
  language: ko
  text: 우리 조상 아브라함이 무슨 이유로 복을 받았습니까? 믿음을 통해 의와 진리를 행한 것이 아니었습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος χάριν
  english_pob_choice: For what reason
  chosen_korean: 무슨 이유로
  alternatives_korean:
  - 왜
  - 어떤 이유로
  lexicon: τίς + χάριν
  rationale: 원문의 이유 질문을 자연스러운 현대 한국어로 옮기면서도, 단순한 '왜'보다 서술적·수사적 뉘앙스를 살렸습니다.
- source_word: ηὐλογήθη
  english_pob_choice: was our father Abraham blessed
  chosen_korean: 복을 받았습니까
  alternatives_korean:
  - 복을 받으셨습니까
  - 복되게 되셨습니까
  lexicon: εὐλογέω
  rationale: 능동형 영문 관찰을 유지하되, 한국어에서는 수동적 결과를 자연스럽게 드러내는 '복을 받다'로 옮겼습니다.
- source_word: δικαιοσύνην καὶ ἀλήθειαν
  english_pob_choice: righteousness and truth
  chosen_korean: 의와 진리
  alternatives_korean:
  - 의와 참됨
  - 의와 진실
  lexicon: δικαιοσύνη / ἀλήθεια
  rationale: δικαιοσύνη는 통상적인 '의'로, ἀλήθεια는 문맥상 추상적 '진리'로 옮겨 원문의 덕목 짝을 보존했습니다.
- source_word: διὰ πίστεως ποιήσας
  english_pob_choice: did ... through faith
  chosen_korean: 믿음을 통해 … 행한
  alternatives_korean:
  - 믿음으로 … 행한
  - 믿음을 따라 … 한
  lexicon: ποιέω + διά + πίστις
  rationale: applied_revisions의 'did righteousness and truth through faith'를 반영해, ποιήσας를 과도하게 해석하지 않고 '행한'으로 대응했습니다.
theological_decisions:
- issue: 아브라함의 복의 근거를 무엇으로 제시하는가
  chosen_reading: 복은 아브라함이 믿음을 통해 의와 진리를 행한 데서 설명됩니다.
  alternative_readings:
  - 복은 믿음 자체 때문이라고만 읽을 수 있습니다.
  - 복은 행위와 믿음의 결합으로만 읽을 수 있습니다.
  rationale: 원문은 '믿음을 통해'라는 매개를 유지한 채 '의와 진리'를 행한 사실을 복의 이유로 제시하므로, 믿음과 행위를 둘 다 지우지 않도록 옮겼습니다.
  doctrine_reference: 믿음과 행위의 관계에 대한 본문 자체의 균형을 보존하는 번역 원칙
