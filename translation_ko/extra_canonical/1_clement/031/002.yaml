  terminology: 아브라함, 복, 믿음, 의, 진리 모두 안정적이고 널리 통용되는 성서 한국어 용어입니다. '우리 조상'은 πατὴρ ἡμῶν의 공동 조상이라는 관용적 의미를 자연스럽게 전달합니다.
