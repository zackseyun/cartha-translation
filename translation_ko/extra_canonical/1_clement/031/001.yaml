id: 1CLEM.31.1
reference: 1 Clement 31:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Κολληθῶμεν οὖν τῇ εὐλογίᾳ αὐτοῦ καὶ ἴδωμεν, τίνες αἱ ὁδοὶ τῆς εὐλογίας. ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/001.yaml
  text: Let us therefore cling to his blessing, and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning.
translation:
  language: ko
  text: 그러므로 우리도 그의 복되심에 굳게 붙들리고, 또 축복의 길들이 무엇인지 봅시다. 처음부터 일어난 일들을 펼쳐 봅시다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  english_pob_choice: Let us therefore cling
  chosen_korean: 굳게 붙들리고
  alternatives_korean:
  - 붙어 있읍시다
  - 매달립시다
  - 굳게 붙읍시다
  lexicon: κολλάω
  rationale: 공동체적 권면으로서 ‘cling’의 밀착·고착 의미를 살리되, 한국어에서 자연스러운 합쇼체로 ‘굳게 붙들리다’의 수동적 결속감을 살렸습니다.
- source_word: τῇ εὐλογίᾳ αὐτοῦ
  english_pob_choice: his blessing
  chosen_korean: 그의 복되심에
  alternatives_korean:
  - 그의 축복에
  - 그의 복에
  lexicon: εὐλογία
  rationale: 뒤의 ‘축복의 길들’과 반복을 맞추되, 단순한 행위로서의 축복보다 하나님의 복된 은총과 선함의 상태를 함께 드러내도록 ‘복되심’으로 옮겼습니다.
- source_word: αἱ ὁδοὶ τῆς εὐλογίας
  english_pob_choice: the ways of blessing
  chosen_korean: 축복의 길들이
  alternatives_korean:
  - 복의 길들이
  - 복되심의 길들이
  lexicon: ὁδοί / εὐλογία
  rationale: ‘ways’의 복수성을 유지하고, 문맥상 삶의 방식·행로라는 뜻을 살려 ‘길들’로 번역했습니다.
- source_word: ἀνατυλίξωμεν
  english_pob_choice: Let us unfold
  chosen_korean: 펼쳐 봅시다
  alternatives_korean:
  - 풀어 봅시다
  - 펴 봅시다
  lexicon: ἀνατυλίσσω
  rationale: 말씀·사건을 차례로 드러내어 살펴보는 뉘앙스를 살리기 위해 ‘펼쳐 봅시다’를 선택했습니다.
theological_decisions:
- issue: ‘his blessing’과 ‘the ways of blessing’의 반복적 구조
  chosen_reading: 하나님의 복 주심 자체와 그 복에 합당한 삶의 길을 함께 묶는 권면으로 읽었습니다.
  alternative_readings:
  - 단순히 물질적 축복을 가리키는 표현으로 읽기
  - 추상적 ‘복’의 일반 원리로만 읽기
  rationale: 본문은 축복을 대상화하기보다 그 복에 ‘붙들리고’ 그 길을 ‘보라’고 말하므로, 복의 상태와 복의 방식이 함께 제시된 것으로 옮겼습니다.
  doctrine_reference: 성화와 신앙의 실천적 응답
- issue: ‘from the beginning’의 역사적 서술
  chosen_reading: 교회의 기억 속에서 처음부터 일어난 일들을 차례로 되짚는 역사적 회고로 읽었습니다.
  alternative_readings:
  - 창조론적 ‘태초’로 확대하기
  - 단순한 시간적 서두 표현으로 축소하기
  rationale: 앞뒤 문맥상 추상적 교의보다 공동체가 이미 알고 있는 시작부터의 일들을 정리해 보자는 권면이므로, 서사적 회고를 드러냈습니다.
  doctrine_reference: 구속사적 기억
