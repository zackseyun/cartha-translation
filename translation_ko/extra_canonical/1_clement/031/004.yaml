base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/004.yaml
  text: Jacob[a], with humility, departed from his land because of his brother and went to Laban and served, and to him was given the twelve-sceptered people of Israel.
  footnotes:
  - marker: a
    text: Or 'the twelve-sceptered people'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 겸손한 마음으로 자기 땅을 떠나 그의 형 때문에 라반에게 가서 라반을 섬겼으며, 그에게는 이스라엘의 열두 지파가 주어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘이스라엘의 열두 왕홀을 가진 것’ 또는 ‘열두 왕홀을 가진 이스라엘’입니다. 여기서 ‘왕홀’은 ‘지파’를 가리키는 성서적 표현입니다.
    reason: δωδεκάσκηπτρον의 문자적 왕홀 이미지를 보존하면서, 문맥상 지시 대상인 ‘열두 지파’를 본문에서 명확히 합니다.
lexical_decisions:
- source_word: μετὰ ταπεινοφροσύνης
  english_pob_choice: with humility
  chosen_korean: 겸손함으로
  alternatives_korean:
  - 겸손하게
  - 낮은 마음으로
  lexicon: ταπεινοφροσύνη
  rationale: 행위의 태도를 나타내는 전치사구이므로 ‘겸손함으로’가 본문 의미를 자연스럽게 살리면서도 도덕적 성격을 유지합니다.
- source_word: ἐξεχώρησεν τῆς γῆς αὐτοῦ
  english_pob_choice: departed from his land
  chosen_korean: 자기 땅을 떠나
  alternatives_korean:
  - 자기 땅에서 물러나
  - 그의 땅을 떠나
  lexicon: ἐκχωρέω
  rationale: ‘떠나다’가 이동의 기본 의미를 가장 직접적으로 전달하며, 소유격 대명사는 문맥상 ‘자기’로 자연스럽게 옮겼습니다.
- source_word: ἐδούλευσεν
  english_pob_choice: served
  chosen_korean: 섬겼으며
  alternatives_korean:
  - 노역했으며
  - 종살이했으며
  - 봉사했으며
  lexicon: δουλεύω
  rationale: 여기서는 단순한 일반적 봉사보다 종속된 섬김의 뉘앙스가 있으나, 한국어 본문에서는 문맥을 해치지 않는 범위에서 ‘섬기다’로 옮기고, 필요 이상으로 현대적 부정 뉘앙스가 강한 ‘노역하다’는 피했습니다.
- source_word: τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ
  english_pob_choice: the twelve tribes of Israel
  chosen_korean: 이스라엘의 열두 지파
  alternatives_korean:
  - 이스라엘의 열두 홀기
  - 이스라엘의 열두 왕홀
  - 이스라엘의 열두 홀대
  lexicon: δωδεκάσκηπτρον
  rationale: 그리스어 합성어의 직역형보다, 본문과 청중이 즉시 알아들을 성서적 관용구인 ‘열두 지파’가 이 표현의 지시 대상을 가장 분명하게 전달합니다.
theological_decisions:
- issue: δωδεκάσκηπτρον의 이미지와 의미 범위
  chosen_reading: 상징적 표현을 ‘이스라엘의 열두 지파’로 옮겨, 본문이 의도한 언약 공동체의 집합적 의미를 드러냈습니다.
  alternative_readings:
  - ‘열두 홀기를 가진 백성’처럼 합성어 이미지를 살리는 번역
  - ‘열두 홀대를 가진 이스라엘’ 같은 직역
  rationale: 이 문맥에서 핵심은 물건의 형상이 아니라 야곱에게서 이스라엘 공동체가 주어졌다는 사실이므로, 수신자가 즉시 이해할 수 있는 성서적 관용을 택했습니다.
  doctrine_reference: 문맥적 의미 우선과 상징적 언어의 관용적 번역
