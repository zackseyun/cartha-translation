review_pass:
  verdict: revise
  source_fidelity: 초안은 γινώσκων τὸ μέλλον과 ἡδέως를 대체로 충실히 옮겼습니다. 그러나 προσήγετο는 중간태와 수동태로 모두 이해될 여지가 있는 형태이며, 본문 자체에는 재귀대명사가 없습니다. 따라서 ‘자신을 … 바쳤습니다’는 가능한 해석이지만 행위 주체와 능동성을 확정합니다. ‘희생 제물로 나아갔습니다’는 제의적 맥락을 보존하면서 이 문법적 여지를 과도하게 해소하지 않습니다. 또한 ‘있었기에’는 앎과 행위 사이의 명시적 인과관계를 보탭니다.
  naturalness: ‘확신을 가지고 앞으로 일어날 일을 알면서, 기꺼이 희생 제물로 나아갔습니다’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. ‘자신 있게 알고’보다 πεποιθήσεως의 명사적 확신의 뉘앙스도 더 잘 드러납니다.
  terminology: ‘이사악’, ‘희생 제물’, ‘기꺼이’는 적절합니다. προσήγετο의 태와 재귀성을 확정하는 ‘자신을 … 바쳤습니다’는 피하는 것이 좋습니다. 영어 감사 기록의 대안 어순은 한국어 각주에서도 보존합니다.
  issues:
  - severity: medium
    issue: ‘자신을 희생 제물로 바쳤습니다’가 προσήγετο의 태와 명시되지 않은 재귀 목적어를 확정합니다.
    rationale: προσήγετο는 문맥상 자기를 바치는 중간태로 읽을 수 있으나, 수동적 ‘이끌려/바쳐져 나아감’도 문법적으로 배제되지 않습니다. 본문에 없는 ‘자신을’을 넣어 자발적 능동 행위만으로 고정하지 않는 편이 안전합니다.
  - severity: low
    issue: ‘알고 있었기에’가 인과 관계를 명시합니다.
    rationale: 분사 γινώσκων은 주로 동시적 상황을 나타내며, 원문은 앎이 희생으로 나아간 직접 원인이라고 명시하지 않습니다.
  revised_text: 이사악은 확신을 가지고 앞으로 일어날 일을 알면서, 기꺼이 희생 제물로 나아갔습니다.[a]
