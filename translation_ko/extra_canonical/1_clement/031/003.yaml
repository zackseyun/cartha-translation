base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031/003.yaml
  text: Isaac[a], knowing with confidence what was to come, gladly offered himself as a sacrifice.
  footnotes:
  - marker: a
    text: Or 'knowing what was to come with confidence'.
    reason: previous_rendering
translation:
  language: ko
  text: 이사악은 확신을 가지고 앞으로 일어날 일을 알면서, 기꺼이 희생 제물로 나아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앞으로 일어날 일을 확신하며 알고’.
    reason: 영어 POB 감사 기록에 보존된 μετὰ πεποιθήσεως의 결합 범위에 관한 대안 어순을 한국어에서도 반영합니다.
lexical_decisions:
- source_word: μετὰ πεποιθήσεως
  english_pob_choice: knowing with confidence
  chosen_korean: 자신 있게
  alternatives_korean:
  - 확신을 가지고
  - 믿음으로 확신하며
  lexicon: πεποίθησις
  rationale: 지속적인 내적 확신을 나타내는 말로, 한국어에서는 자연스럽게 ‘자신 있게’ 또는 ‘확신을 가지고’로 옮길 수 있습니다. 여기서는 문장 흐름을 간결하게 살리기 위해 ‘자신 있게’를 택했습니다.
- source_word: γινώσκων τὸ μέλλον
  english_pob_choice: what was to come
  chosen_korean: 다가올 일을
  alternatives_korean:
  - 장차 일어날 일을
  - 앞으로 올 일을
  lexicon: γινώσκω
  rationale: 단순한 미래 지식보다 ‘다가올 일’ 전체를 아는 뜻이므로, 자연스러운 현대어로 압축해 옮겼습니다.
- source_word: ἡδέως
  english_pob_choice: gladly
  chosen_korean: 기꺼이
  alternatives_korean:
  - 즐겁게
  - 마음 기쁘게
  lexicon: ἡδέως
  rationale: 자발성과 기꺼이 받아들이는 태도를 드러내는 부사로, 제의적 자기 헌신 문맥에 가장 잘 맞습니다.
- source_word: προσήγετο θυσία
  english_pob_choice: offered himself as a sacrifice
  chosen_korean: 자신을 희생 제물로 바쳤습니다
  alternatives_korean:
  - 자신을 제물로 드렸습니다
  - 희생 제물로 자신을 내놓았습니다
  lexicon: προσάγω
  rationale: 영어 POB의 수정처럼 ‘드러눕게 하다’나 ‘끌려가다’보다 ‘바치다/드리다’가 προσήγετο의 제의적 ‘제시/봉헌’ 의미를 더 직접적으로 반영합니다.
theological_decisions:
- issue: 이사악의 행위 묘사
  chosen_reading: 이사악이 스스로를 희생 제물로 바치는 자발적 헌신으로 옮겼습니다.
  alternative_readings:
  - 수동적으로 희생당한 것으로만 읽는 번역
  - 단순히 순응한 것으로 약화하는 번역
  rationale: 본문은 이사악의 미래를 아는 확신과 기꺼운 제의적 자기 헌신을 함께 제시하므로, 자발성과 희생의 긴장을 보존해야 합니다.
  doctrine_reference: 창 22장 전승을 해석하는 1 클레멘스의 수사와 제의적 자기헌신 이해
