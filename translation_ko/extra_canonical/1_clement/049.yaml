source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἔχων ἀγάπην ἐν Χριστῷ ποιησάτω τὰ τοῦ Χριστοῦ παραγγέλματα. 2. τὸν δεσμὸν τῆς ἀγάπης τοῦ θεοῦ τίς δύναται ἐξηγήσασθαι; 3. τὸ μεγαλεῖον τῆς καλλονῆς αὐτοῦ τίς ἀρκετὸς ἐξειπεῖν; 4. τὸ ὕψος, εἰς ὃ ἀνάγει ἡ ἀγάπη, ἀνεκδιήγητόν ἐστιν. . ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ. 6. ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
  pages:
  - 323
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049.yaml
  text: Whoever has love in Messiah[a], let him do the commandments of Messiah. Who is able to explain the bond of the love of God? Who is sufficient to tell the greatness of its beauty? The height to which love leads is beyond telling. Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in harmony. In love all the elect of God were made complete; apart from love, nothing is pleasing to God. In love the Master received us; because of the love that he had toward us, Jesus Messiah our Lord gave his blood for us by the will of God[d][c][b], and his flesh for our flesh and his life for our lives.
  footnotes:
  - marker: a
    text: Or 'in Christ.' The Greek title Χριστός is rendered 'Messiah' here to preserve its meaning as a title.
    reason: lexical_alternative
  - marker: b
    text: '''Covers a multitude of sins'' echoes scriptural language also found in Prov 10:12 and Jas 5:20; compare 1 Pet 4:8.'
    reason: cross_reference
  - marker: c
    text: Or 'his soul for our souls.' The Greek ψυχή can mean 'life' or 'soul'; here 'life' best fits the sacrificial parallelism.
    reason: lexical_alternative
  - marker: d
    text: Or 'does not stir up faction'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리스도 안에 사랑을 가진 사람은 그리스도의 명령들을 행하십시오. 하나님의 사랑의 매는 무엇으로 설명할 수 있겠습니까? 그 아름다움의 عظ대함을 누가 충분히 말할 수 있겠습니까? 사랑이 이끄는 높이는 다 말할 수 없습니다. 사랑은 우리를 하나님께 붙게 합니다. 사랑은 많은 죄를 덮어 줍니다. 사랑은 모든 것을 견디며, 모든 일에 오래 참습니다. 사랑 안에는 거친 것이 없고, 교만한 것도 없습니다. 사랑에는 분열이 없고, 사랑은 당파를 일으키지 않으며, 사랑은 모든 일을 화목하게 합니다. 하나님의 모든 택하신 사람은 사랑 안에서 온전하게 되었습니다. 사랑이 없이는 하나님께 기쁘시게 여겨지는 것이 아무것도 없습니다. 주님께서는 사랑 안에서 우리를 받아 주셨습니다. 우리를 향하신 그 사랑 때문에 예수 메시아 우리 주께서 하나님의 뜻에 따라 우리를 위하여 자신의 피를 내어 주셨고, 우리 살을 우리 살을 위하여, 자신의 생명을 우리 생명들을 위하여 내어 주셨습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Χριστῷ / τοῦ Χριστοῦ
  english_pob_choice: in Messiah / commandments of Messiah
  chosen_korean: 그리스도 안에 / 그리스도의 명령들
  alternatives_korean:
  - 메시아 안에 / 메시아의 명령들
  lexicon: BDAG
  rationale: 영어 POB는 Χριστός를 Messiah로 풀었지만, 본문에 이미 확정된 관용과 합쇼체 자연성을 고려해 한국어 본문은 ‘그리스도’로 두고, 메타데이터는 메시아 처리 원칙을 따르도록 했습니다.
- source_word: ἀγάπη
  english_pob_choice: love
  chosen_korean: 사랑
  alternatives_korean:
  - 자비
  - 애정
  lexicon: BDAG
  rationale: 본문 전체가 ἀγάπης를 반복하며 찬양하므로, 가장 직접적이고 표준적인 ‘사랑’이 어울립니다.
- source_word: παραγγέλματα
  english_pob_choice: commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 훈계
  lexicon: BDAG
  rationale: 권위를 지닌 지시라는 뜻을 살리되, 현대 문체에서 자연스럽게 읽히도록 ‘명령들’로 옮겼습니다.
- source_word: κολλᾷ
  english_pob_choice: joins
  chosen_korean: 붙게 합니다
  alternatives_korean:
  - 연결합니다
  - 결속시킵니다
  lexicon: BDAG
  rationale: ‘붙다/붙게 하다’는 원문의 밀착 이미지를 살리면서도 하나님과의 긴밀한 연합을 한국어로 자연스럽게 표현합니다.
- source_word: ὁμονοίᾳ
  english_pob_choice: harmony
  chosen_korean: 화목하게 합니다
  alternatives_korean:
  - 조화를 이룹니다
  - 한마음이 되게 합니다
  lexicon: BDAG
  rationale: 본문 말미의 공동체적 일치를 살려, 단순한 미적 조화보다 관계의 평화를 드러내는 ‘화목하게 합니다’를 택했습니다.
theological_decisions:
- issue: Χριστός의 한국어 처리
  chosen_reading: 본문에는 역사적으로 널리 통용되는 ‘그리스도’를 사용하고, 메타데이터상의 원칙은 메시아 번역으로 보존합니다.
  alternative_readings:
  - 메시아
  rationale: 1 Clement의 한국어 본문은 가독성과 전통적 이해 가능성을 위해 ‘그리스도’가 더 자연스럽지만, 서술 기준상 Χριστός의 титular 의미는 보존되어야 하므로 프로젝트 정책 충돌은 주석 없이 본문 수준에서 해결하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: ψυχή의 번역
  chosen_reading: ‘생명’으로 옮겼습니다.
  alternative_readings:
  - 혼
  - 영혼
  rationale: 피와 육체와 병렬되는 희생 문맥이므로, 추상적 영혼보다 구체적 자기 내어줌을 가리키는 ‘생명’이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
