id: 1CLEM.2.3
reference: 1 Clement 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: μεστοί τε ὁσίας βουλῆς, ἐν ἀγαϑῇ προϑυμίᾳ μετ’ εὐσεβοῦς πεποιϑήσεως ἐξετείνατε τὰς χεῖρας ὑμῶν πρὸς τὸν παντοκράτορα ϑεόν, ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι, εἴ τι ἀκόντες ἡμάρτετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/003.yaml
  text: And being full of holy purpose[a], with good zeal and devout confidence you stretched out your hands to God Almighty, imploring him to be merciful, if in anything you had sinned unintentionally.
  footnotes:
  - marker: a
    text: Or 'unwillingly'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거룩한 뜻으로 가득 차, 선한 열심과 경건한 확신으로 여러분은 전능하신 하나님께 손을 뻗어 올리고, 혹시라도 무심결에 죄를 지었다면 그분이 자비를 베푸시기를 간청했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεστοί τε ὁσίας βουλῆς
  english_pob_choice: being full of holy purpose
  chosen_korean: 거룩한 뜻으로 가득 차
  alternatives_korean:
  - 거룩한 계획으로 가득 차
  - 거룩한 의도로 가득 차
  lexicon: βούλη
  rationale: βουλῆς는 단순한 ‘계획’보다 의지와 의도, 결의가 함께 있는 ‘뜻’이 자연스럽고 원문의 도덕적 성격을 잘 살립니다.
- source_word: ἐν ἀγαϑῇ προϑυμίᾳ
  english_pob_choice: with good zeal
  chosen_korean: 선한 열심과
  alternatives_korean:
  - 좋은 열의로
  - 선한 열정과
  lexicon: προθυμία
  rationale: προθυμίᾳ는 감정적 열정보다 ‘열심/열의’가 더 정확하며, ἀγαθῇ를 ‘선한’으로 살려 도덕적 긍정을 드러냈습니다.
- source_word: μετ’ εὐσεβοῦς πεποιϑήσεως
  english_pob_choice: with devout confidence
  chosen_korean: 경건한 확신으로
  alternatives_korean:
  - 경건한 신뢰로
  - 경건한 담대함으로
  lexicon: πεποίθησις
  rationale: πεποιθήσεως는 ‘확신’이 핵심이며, εὐσεβοῦς를 ‘경건한’으로 두어 하나님을 향한 태도를 분명히 했습니다.
- source_word: ἱκετεύοντες αὐτὸν ἵλεων γενέσϑαι
  english_pob_choice: imploring him to be merciful
  chosen_korean: 그분이 자비를 베푸시기를 간청했습니다
  alternatives_korean:
  - 그분이 너그러우시기를 간청했습니다
  - 그분이 자비롭게 되시기를 간구했습니다
  lexicon: ἵλεως
  rationale: ἵλεων γενέσθαι는 ‘자비로운/호의적인 상태가 되다’이므로 자연스러운 한국어로 ‘자비를 베푸시다’로 옮겼습니다.
- source_word: ἀκόντες ἡμάρτετε
  english_pob_choice: you had sinned unintentionally
  chosen_korean: 무심결에 죄를 지었다면
  alternatives_korean:
  - 부주의하게 죄를 지었다면
  - 의도치 않게 죄를 지었다면
  lexicon: ἄκων
  rationale: 최근 POB 수정처럼 ἀκόντες는 ‘억지로’가 아니라 ‘비의도적/무심결’의 범주이므로, 출처 의미를 살려 옮겼습니다.
theological_decisions:
- issue: 전능하신 하나님에 대한 호칭과 문장 내 존칭 처리
  chosen_reading: ‘전능하신 하나님께’로 두고, 직접 화법이 아닌 서술문 전체는 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘하나님 전능자께’
  - ‘전능하신 분께’
  rationale: τὸν παντοκράτορα θεόν의 직접적 의미를 살리되, 한국어 예배체의 과장된 표현보다 본문 정보 전달을 우선했습니다.
  doctrine_reference: 하나님의 전능성
