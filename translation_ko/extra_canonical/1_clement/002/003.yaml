  revision_rationale: 비의도적 죄라는 ἀκόντες의 의미를 ‘의도치 않게’로 명확히 하고, 하나님을 향해 손을 뻗는 행위를 자연스럽고 정확하게 옮겼습니다. 나머지 어휘와 문체는 유지했으며, 대안 독법 각주를 해당 낱말에 직접 연결했습니다.
