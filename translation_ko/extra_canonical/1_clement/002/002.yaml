language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως εἰρήνη βαϑεῖα καὶ λιπαρὰ ἐδέδοτο πᾶσιν καὶ ἀκόρεστος πόϑος εἰς ἀγαϑοποιΐαν, καὶ πλήρης πνεύματος ἁγίου ἐπέχυσις ἐπὶ πάντας ἐγίνετο·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/002.yaml
  text: Thus deep and rich peace had been given to all[a], and an insatiable desire for doing good, and a full outpouring of the Holy Spirit came upon all;
  footnotes:
  - marker: a
    text: Or 'was given'.
    reason: previous_rendering
translation:
  language: ko
  text: 이처럼 깊고 풍성한 평강이 모든 사람에게 주어졌고[a], 선을 행하려는 만족할 줄 모르는 바람과 성령의 충만한 부어주심이 모든 사람에게 임했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη βαθεῖα καὶ λιπαρά
  english_pob_choice: deep and rich peace
  chosen_korean: 깊고 풍성한 평강
  alternatives_korean:
  - 깊고 비옥한 평강
  - 깊고 넉넉한 평강
  lexicon: εἰρήνη → 평강; βαθεῖα → 깊은; λιπαρά → 풍성한
  rationale: βαθεῖα는 깊이를, λιπαρά는 단순한 'rich'보다 풍성하고 넉넉한 상태를 가리켜 한국어로는 ‘깊고 풍성한 평강’이 가장 자연스럽고 source-direct합니다.
- source_word: ἀκόρεστος πόθος εἰς ἀγαθοποιΐαν
  english_pob_choice: an insatiable desire for doing good
  chosen_korean: 선을 행하려는 만족할 줄 모르는 바람
  alternatives_korean:
  - 선을 행하려는 끝없는 갈망
  - 선행을 향한 식지 않는 욕구
  lexicon: ἀκόρεστος → 만족할 줄 모르는; πόθος → 바람/갈망; ἀγαθοποιΐα → 선을 행함
  rationale: πόθος는 강한 열망이지만 문맥상 과도한 감정어보다 ‘바람’이 균형이 좋고, ἀγαθοποιΐα는 행위성을 살려 ‘선을 행하려는’으로 풀었습니다.
- source_word: πλήρης πνεύματος ἁγίου ἐπέχυσις
  english_pob_choice: a full outpouring of the Holy Spirit
  chosen_korean: 성령의 충만한 부어주심
  alternatives_korean:
  - 성령의 완전한 쏟아부으심
  - 성령의 가득한 부으심
  lexicon: πνεῦμα ἅγιον → 성령; ἐπέχυσις → 부어주심/쏟아부으심; πλήρης → 충만한
  rationale: 여기서는 ‘Holy Spirit’의 명시적 표현이므로 ‘성령’이 적절하며, ἐπέχυσις의 이미지인 ‘부어주심’을 살리되 πλήρης는 상태를 나타내는 ‘충만한’으로 옮겼습니다.
theological_decisions:
- issue: 평강과 성령의 관계를 어떤 순서와 강도로 제시할지
  chosen_reading: 평강이 먼저 ‘주어졌고’, 이어서 선행에 대한 열망과 성령의 부어주심이 모든 사람에게 임한 것으로 옮겼습니다.
  alternative_readings:
  - 평강과 성령의 부어주심을 병렬적으로 묶는 번역
  - 성령의 부어주심을 앞세우는 번역
  rationale: 원문의 문장 흐름은 평강의 선행 상태를 배경으로 삼아 이후의 내적·영적 충만을 덧붙이므로, 한국어에서도 그 누적적 전개를 보존하는 것이 좋습니다.
  doctrine_reference: 문맥적 서술의 순차성
