review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. 그러나 ἐδέδοτο의 과거완료는 ‘주어졌고’보다 ‘주어져 있었고’로 나타내는 편이 정확합니다. 또한 ἐγίνετο는 성령의 부어 주심이 단순히 ‘임했다’는 완료 사건이라기보다 ‘일어나고 있었다/이루어지고 있었다’는 미완료적 서술입니다.
  naturalness: ‘성령의 충만한 부어주심이 … 임했습니다’는 명사구와 서술어의 결합이 다소 부자연스럽고, 시상도 약화합니다. ‘성령이 모든 사람에게 충만히 부어지고 있었습니다’가 현대 표준 한국어에서 자연스럽습니다. πόθος에는 ‘바람’보다 강한 ‘열망’이 더 알맞습니다.
  terminology: ‘평강’과 ‘성령’은 적절합니다. 다만 ἀκόρεστος πόθος는 ‘만족할 줄 모르는 바람’보다 ‘채워지지 않는/끝없는 열망’으로 옮겨 강도를 보존하는 것이 좋습니다.
  issues:
