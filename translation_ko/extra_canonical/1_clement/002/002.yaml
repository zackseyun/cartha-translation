    issue: ἐδέδοτο의 과거완료가 약화됨
    rationale: ‘주어졌고’는 단순 과거로도 읽힙니다. 문맥상 이미 주어져 지속된 상태를 가리키는 과거완료이므로 ‘주어져 있었고’가 적절합니다.
  - severity: medium
    issue: ἐγίνετο의 미완료상 및 ἐπέχυσις의 표현이 충분히 반영되지 않음
    rationale: ‘임했습니다’는 완료된 단회 사건처럼 들리며, ‘성령의 … 부어주심’은 다소 어색합니다. 원문은 성령의 충만한 부어짐이 모든 사람에게 일어나고 있던 상태를 묘사합니다.
  - severity: low
    issue: πόθος의 강도가 ‘바람’에서 약화됨
    rationale: πόθος는 강한 갈망·열망을 뜻하며, ἀκόρεστος가 이를 더욱 강화합니다.
