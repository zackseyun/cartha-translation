id: 1CLEM.2.4
reference: 1 Clement 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἦν ὑμῖν ἡμέρας τε καὶ νυκτὸς ὑπὲρ πάσης τῆς ἀδελφότητος, εἰς τὸ σώζεσϑαι μετ’ ἐλέους καὶ συνειδήσεως τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/004.yaml
  text: Day and night you were concerned for the whole brotherhood[a], so that the number of his elect might be saved with mercy and conscientiousness.
  footnotes:
  - marker: a
    text: Or 'your concern was'.
    reason: previous_rendering
translation:
  language: ko
  text: 낮과 밤으로 너희는 온 형제 공동체를 위하여 애썼습니다[a]. 이는 그분께서 택하신 이들의 수가 자비와 양심으로 구원을 받도록 한 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희에게는 온 형제 공동체를 위한 밤낮의 애씀이 있었습니다.”
    reason: 문두의 표현은 ‘너희는 애썼습니다’로도, ‘너희에게 애씀이 있었습니다’로도 옮길 수 있는 구문이므로 대안을 제시합니다.
lexical_decisions:
- source_word: ἡμέρας τε καὶ νυκτός
  english_pob_choice: Day and night
  chosen_korean: 낮과 밤으로
  alternatives_korean:
  - 밤낮으로
  - 날마다 밤마다
  lexicon: ἡμέρα, νύξ
  rationale: 시간의 지속성을 자연스럽게 살리되, 한국어에서 가장 압축적이고 구어체로도 무리 없는 표현을 택했습니다.
- source_word: ὑμῖν ἦν
  english_pob_choice: you were concerned / you had a struggle
  chosen_korean: 너희는 … 애썼습니다
  alternatives_korean:
  - 너희에게는 … 분투가 있었습니다
  - 너희는 … 걱정했습니다
  lexicon: εἰμί + dative; ἀγών (audit context)
  rationale: 영문 POB의 완화된 표현보다, 감사·헌신의 뉘앙스를 살리는 한국어로 ‘애쓰다’를 택해 공동체를 위한 적극적 수고를 드러냈습니다.
- source_word: τῆς ἀδελφότητος
  english_pob_choice: the whole brotherhood
  chosen_korean: 온 형제 공동체
  alternatives_korean:
  - 온 형제들
  - 온 형제단
  lexicon: ἀδελφότης
  rationale: 형제성 자체보다 공동체적 실체가 분명하므로 ‘형제 공동체’로 옮겨, 전체성을 나타내는 ‘온’을 함께 살렸습니다.
- source_word: τὸν ἀριθμὸν τῶν ἐκλεκτῶν αὐτοῦ
  english_pob_choice: the number of his elect
  chosen_korean: 그분의 택하신 이들의 수
  alternatives_korean:
  - 그분의 택함받은 이들의 수
  - 그분의 선택된 이들의 수
  lexicon: ἐκλεκτός
  rationale: ἐκλεκτῶν을 교회 전통어 ‘성도’로 풀지 않고, ‘택하신 이들’로 직역해 선택의 의미를 보존했습니다.
- source_word: μετ’ ἐλέους καὶ συνειδήσεως
  english_pob_choice: with mercy and conscientiousness
  chosen_korean: 자비와 양심으로
  alternatives_korean:
  - 자비와 양심을 가지고
  - 긍휼과 양심으로
  lexicon: ἔλεος, συνείδησις
  rationale: ἐλέους는 ‘자비’로, συνειδήσεως는 추상명사 그대로 ‘양심’으로 옮겨 영어 POB의 ‘conscientiousness’가 가리키는 내적 책임감을 반영했습니다.
theological_decisions:
- issue: 윤리적/영적 태도 표현인 μετ’ ἐλέους καὶ συνειδήσεως의 해석
  chosen_reading: 구원은 단지 결과가 아니라 자비와 양심에 근거한 태도와 함께 제시된다고 읽었습니다.
  alternative_readings:
  - 구원의 방식 자체를 묘사하는 표현으로 읽을 수 있음
  - 공동체적 실천의 조건으로 읽을 수 있음
  rationale: 문장 구조상 목적절의 수단/동반 상태를 나타내므로, 교리화하지 않고 원문의 윤리적 긴장을 유지했습니다.
  doctrine_reference: 초대교회 윤리와 구원 언어의 결합
