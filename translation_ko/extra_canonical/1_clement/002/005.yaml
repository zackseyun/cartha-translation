  text: εἰλικρινεῖς καὶ ἀκέραιοι ἦτε καὶ ἀμνησίκακοι εἰς ἀλλήλους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/005.yaml
  text: You were sincere and guileless and free from resentment toward one another.
translation:
  language: ko
  text: 여러분은 진실하고 간사함이 없으며, 서로에게 원한을 품지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰλικρινεῖς
  english_pob_choice: sincere
  chosen_korean: 진실하고
  alternatives_korean:
  - 성실하고
  - 순전하고
  - 진솔하고
  lexicon: εἰλικρινής
  rationale: 외식이나 불순물이 없는 태도를 가리키므로, POB의 “sincere”에 맞춰 자연스럽게 ‘진실하고’로 옮겼습니다.
- source_word: ἀκέραιοι
  english_pob_choice: guileless
  chosen_korean: 간사함이 없으며
  alternatives_korean:
  - 흠이 없으며
  - 순결하며
  - 속임수가 없으며
  lexicon: ἀκέραιος
  rationale: 의도적 궤계나 간계가 없다는 뜻을 살려, 도덕적 결함보다 ‘간사함’의 부재를 드러냈습니다.
- source_word: ἀμνησίκακοι
  english_pob_choice: free from resentment
  chosen_korean: 원한을 품지 않았습니다
  alternatives_korean:
  - 악을 기억하지 않았습니다
  - 앙심이 없었습니다
  - 서운함을 품지 않았습니다
  lexicon: ἀμνησίκακος
  rationale: 문자적으로는 ‘악을 기억하지 않음’이지만, 문맥상 관계적 정서의 핵심은 분노와 보복심이 남지 않은 상태이므로 ‘원한을 품지 않았다’로 자연화했습니다.
- source_word: εἰς ἀλλήλους
  english_pob_choice: toward one another
  chosen_korean: 서로에게
  alternatives_korean:
  - 서로를 향해
  - 서로에 대하여
  - 서로 사이에
  lexicon: εἰς + ἀλλήλους
  rationale: 관계의 방향성을 간결하게 드러내기 위해 ‘서로에게’로 번역했습니다.
theological_decisions:
- issue: 본문의 세 덕목을 어떻게 한국어에서 구분해 드러낼지
  chosen_reading: 진실함, 간사함 없음, 원한 없음이라는 세 층위를 각각 살려 공동체 윤리의 실제성을 보이게 했습니다.
  alternative_readings:
  - 성실·무흠·무원한처럼 보다 압축된 번역
  - 순전·정직·용서처럼 종교적 어휘를 강화한 번역
  rationale: 그리스어는 성격과 관계 윤리를 병렬적으로 제시하므로, 한국어에서도 서로 겹치되 구별되는 덕목으로 읽히도록 했습니다.
  doctrine_reference: 공동체 윤리와 화해의 실천
