base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/006.yaml
  text: Every faction and every schism was detestable to you.
translation:
  language: ko
  text: 모든 당파와 모든 분열은 여러분에게 가증스러운 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσα στάσις
  english_pob_choice: Every faction
  chosen_korean: 모든 당파
  alternatives_korean:
  - 모든 분쟁
  - 모든 소요
  - 모든 내분
  lexicon: στάσις
  rationale: 이 문맥에서 στάσις는 단순한 폭동보다 내부의 편당·분파적 대립을 가리키므로, POB의 “faction”에 맞춰 ‘당파’로 옮겼습니다.
- source_word: πᾶν σχίσμα
  english_pob_choice: every schism
  chosen_korean: 모든 분열
  alternatives_korean:
  - 모든 갈라짐
  - 모든 분파
  - 모든 분리
  lexicon: σχίσμα
  rationale: σχίσμα는 공동체를 찢는 분열을 뜻하므로, 교회적 관용어를 지나치게 만들지 않으면서도 직접적인 ‘분열’로 렌더링했습니다.
- source_word: βδέλυκτον
  english_pob_choice: detestable
  chosen_korean: 가증스러운
  alternatives_korean:
  - 혐오스러운
  - 역겨운
  - 가증한
  lexicon: βδέλυκτος
  rationale: 도덕적·종교적 혐오를 나타내는 강한 평가를 유지하기 위해 ‘가증스러운’을 선택했습니다.
- source_word: ὑμῖν
  english_pob_choice: to you
  chosen_korean: 여러분에게
  alternatives_korean:
  - 너희에게
  - 당신들에게
  lexicon: σύ
  rationale: 직접 청중을 향한 복수 2인칭을 현대 한국어의 공손한 복수 대명사 ‘여러분’으로 옮겨, 합쇼체 문체를 유지했습니다.
theological_decisions:
- issue: 공동체 내부 갈등에 대한 강한 윤리적 판단
  chosen_reading: ‘당파’와 ‘분열’ 모두를 가증한 것으로 진술해, 단순한 의견 차이가 아니라 공동체를 깨는 죄성 있는 분열을 드러내게 했습니다.
  alternative_readings:
  - ‘분쟁’으로 완화해 일반적 갈등으로 읽는 방법
  - ‘소요’로 더 정치적 폭동을 상정하는 방법
  rationale: 그리스어 본문과 POB의 ‘faction / schism’ 구분을 보존하면서, 1클레멘트의 공동체 권면 맥락에서 도덕적 평가를 선명하게 전달해야 합니다.
  doctrine_reference: 교회 일치와 공동체 내 분파주의에 대한 경고
- issue: 수신자 지시 대상의 문체
  chosen_reading: 직접 대면하는 복수 청중을 ‘여러분’으로 처리해, 고어적 종교체 대신 현대 합쇼체의 거리감을 유지했습니다.
  alternative_readings:
  - ‘너희’로 더 직역하는 방법
  - 호칭을 생략하고 수동문으로 처리하는 방법
  rationale: 본문의 2인칭 복수를 자연스럽게 재현하면서도, 한국어 출판문체에 맞는 공손성을 확보하기 위한 선택입니다.
  doctrine_reference: 해당 없음
