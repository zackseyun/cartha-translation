base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/007.yaml
  text: You mourned over the trespasses of your neighbors; you considered their shortcomings to be your own. Doing good[a], ready for every good work.
  footnotes:
  - marker: a
    text: Or 'Beneficent, ready for every good work,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이웃의 허물에 대해 슬퍼하셨고, 그들의 부족함을 자기 자신의 것으로 여기셨습니다. 선을 행하는 사람들로서, 모든 선한 일에 준비된 사람들이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τοῖς παραπτώμασιν τῶν πλησίον ἐπενϑεῖτε
  english_pob_choice: You mourned over the trespasses of your neighbors
  chosen_korean: 이웃의 허물에 대해 슬퍼하셨고
  alternatives_korean:
  - 이웃의 죄과 때문에 애통하셨고
  - 이웃의 잘못을 두고 통곡하셨고
  lexicon: παράπτωμα, πλησίον, ἐπενθέω
  rationale: ἐπενθέω는 단순한 감정보다 ‘슬퍼하다/애통하다’의 의미가 강하며, παραπτώματα는 ‘허물’이 자연스럽고 source의 도덕적 넘어짐을 잘 드러냅니다.
- source_word: τὰ ὑστερήματα αὐτῶν ἴδια ἐκρίνετε
  english_pob_choice: you considered their shortcomings to be your own
  chosen_korean: 그들의 부족함을 자기 자신의 것으로 여기셨습니다
  alternatives_korean:
  - 그들의 결핍을 자기 것으로 판단하셨습니다
  - 그들의 모자람을 당신의 것으로 간주하셨습니다
  lexicon: ὑστέρημα, κρίνω
  rationale: ἐκρίνετε는 여기서 ‘판단하다’보다 ‘여기다/간주하다’가 문맥에 맞고, ἴδια는 ‘자기 자신의 것’이라는 소유감 있는 표현을 살립니다.
- source_word: ἀγαθοποιοί
  english_pob_choice: Doing good
  chosen_korean: 선을 행하는 사람들로서
  alternatives_korean:
  - 선을 행하는 자들로서
  - 선행하는 이들로서
  lexicon: ἀγαθοποιός
  rationale: ἀγαθοποιοί는 형용사적 실질명사로 읽히므로, ‘Doing good’에 맞춰 상태 묘사보다 주격 설명인 ‘선을 행하는 사람들로서’로 옮겼습니다.
- source_word: ἕτοιμοι εἰς πᾶν ἔργον ἀγαθόν
  english_pob_choice: ready for every good work
  chosen_korean: 모든 선한 일에 준비된 사람들이었습니다
  alternatives_korean:
  - 모든 선한 일에 항상 준비되어 있었습니다
  - 모든 좋은 일마다 준비가 되어 있었습니다
  lexicon: ἕτοιμοι, ἔργον ἀγαθόν
  rationale: ἕτοιμοι는 ‘준비된’이 직설적이고, πᾶν ἔργον ἀγαθόν은 ‘모든 선한 일’이 가장 자연스럽습니다.
theological_decisions:
- issue: 이 문장이 독립된 무동사 절로 끝나는 구조
  chosen_reading: 끝의 ἀγαθοποιοί, ἕτοιμοι …를 ‘선을 행하는 사람들로서, … 준비된 사람들이었습니다’라고 보완해 한국어에서 완결된 서술로 만들었습니다.
  alternative_readings:
  - ‘선을 행하며, 모든 선한 일에 준비된’
  - ‘선행자들, 모든 선한 일에 준비된’
  rationale: 그리스어는 무동사 병렬 구문이므로, 한국어에서는 의미를 훼손하지 않는 범위에서 자연스러운 완료형 서술을 보완하는 것이 적절합니다.
  doctrine_reference: 문법/수사 구조 보전
