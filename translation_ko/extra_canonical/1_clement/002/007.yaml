    rationale: ‘선을 행하는 사람들로서, 모든 선한 일에 준비된 사람들이었습니다’는 ‘~로서’가 뒤의 서술에 어색하게 연결되고 ‘사람들’이 반복됩니다. 원문의 두 병렬 술어를 ‘선을 행하는 이들이셨고, … 준비가 되어 있으셨습니다’로 옮기는 편이 정확하고 자연스럽습니다.
