  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: σεβασμίῳ πολιτείᾳ κεκοσμημένοι πάντες ἐν φόβῳ αὐτοῦ ἐτελελεῖτε· τὰ προστάγματα καὶ τὰ δικαιώματα τοῦ κυρίου ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν ἐγέγραπτο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/008.yaml
  text: adorned with a venerable way of life[a], you conducted yourselves entirely in his fear; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
  footnotes:
  - marker: a
    text: Or 'carried everything through'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희는 존귀한 삶으로 단장되어, 그의 두려움 안에서 온전히 행하였습니다. 주님의 명령들과 의로운 요구들은 너희 마음의 판에 새겨져 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεβασμίῳ πολιτείᾳ
  english_pob_choice: adorned with a venerable way of life
  chosen_korean: 존귀한 삶으로 단장되어
  alternatives_korean:
  - 경건한 삶으로 단장되어
  - 존경할 만한 시민적 삶으로 장식되어
  lexicon: σεβασμίος, πολιτεία
  rationale: πολιτείᾳ를 단순한 ‘시민권’보다 삶의 방식 전체로 이해해, POB의 ‘venerable way of life’에 맞춰 품위와 공적 성격을 함께 살렸습니다.
- source_word: ἐν φόβῳ αὐτοῦ ἐτελελεῖτε
  english_pob_choice: you conducted yourselves entirely in his fear
  chosen_korean: 그의 두려움 안에서 온전히 행하였습니다
  alternatives_korean:
  - 그를 두려워하며 온전히 살았습니다
  - 그의 경외 안에서 모든 것을 수행하였습니다
  lexicon: φόβος, τελέω
  rationale: τελέω를 ‘수행하다/행하다’로, φόβος를 하나님에 대한 경외와 두려움이 함께 있는 표현으로 살려 문맥의 엄숙함을 보존했습니다.
- source_word: τὰ προστάγματα καὶ τὰ δικαιώματα τοῦ κυρίου
  english_pob_choice: the commandments and the righteous requirements of the Lord
  chosen_korean: 주님의 명령들과 의로운 요구들은
  alternatives_korean:
  - 주님의 명령들과 의로운 규례들은
  - 주님의 계명들과 의로운 판단들은
  lexicon: προστάγματα, δικαιώματα
  rationale: προστάγματα는 ‘명령들’, δικαιώματα는 단순 규례보다 ‘의로운 요구들’로 옮겨, 두 명사의 차이를 유지했습니다.
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας ὑμῶν
  english_pob_choice: had been written on the tablets of your hearts
  chosen_korean: 너희 마음의 판에 새겨져 있었습니다
  alternatives_korean:
  - 너희 마음의 돌판에 새겨져 있었습니다
  - 너희 마음의 넓은 면에 기록되어 있었습니다
  lexicon: πλάτη, καρδία
  rationale: πλάτη는 여기서 ‘판/돌판’의 표상으로 이해하는 것이 자연스러우며, καρδία는 ‘마음’으로 직역해 비유적 내면성을 분명히 했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주(主)
  rationale: 이 문맥의 κύριος는 일반 호칭이지만 문장 전체의 예배적·권면적 톤을 살리기 위해 ‘주님’으로 번역했습니다.
  doctrine_reference: 기독론 / 성경 번역 관례
- issue: “his fear”의 신학적 뉘앙스
  chosen_reading: 그의 두려움
  alternative_readings:
  - 그의 경외
  - 그를 두려워함
  rationale: φόβος에는 경외와 두려움이 함께 있어, 한쪽으로만 평탄화하지 않고 긴장을 남기는 표현을 선택했습니다.
  doctrine_reference: 하나님 경외
