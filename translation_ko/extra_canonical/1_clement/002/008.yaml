- from: 너희는 존귀한 삶으로 단장되어, 그의 두려움 안에서 온전히 행하였습니다. 주님의 명령들과 의로운 요구들은 너희 마음의 판에 새겨져 있었습니다.[a]
  to: 너희는 존귀한 삶으로 단장되어, 그분을 경외하며 모든 일을 행하였습니다. 주님의 명령들과 의로운 요구들은 너희 마음의 판에 새겨져 있었습니다.
  rationale: The revision supplies ‘모든 일을’ for πάντα and replaces the literalistic, unclear possessive construction with idiomatic Korean that represents ἐν φόβῳ αὐτοῦ as reverent fear directed toward the Lord. It retains the draft’s sound treatment of the venerable way of life, the paired legal terms, and the tablet imagery. The unsupported legacy footnote marker is removed.
