id: 1CLEM.2.1
reference: 1 Clement 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Πάντες τε ἐταπεινοφρονεῖτε μηδὲν ἀλαζονευόμενοι, ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες, ἧδον διδόντες ἢ λαμβάνοντες· τοῖς ἐφοδίοις τοῦ Χριστοῦ ἀρκούμενοι καὶ προσέχοντες, τοὺς λόγους αὐτοῦ ἐπιμελῶς ἐνεστερνισμένοι ἦτε τοῖς σπλάγχνοις, καὶ τὰ παθήματα αὐτοῦ ἦν πρὸ ὀφϑαλμῶν ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002/001.yaml
  text: And all of you were humble-minded, boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of the Messiah, and paying close attention to his words, you had embraced them carefully in your hearts, and his sufferings were before your eyes.
  footnotes:
  - marker: a
    text: Or 'inward parts'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 여러분은 모두 겸손한 마음을 품고 아무것도 자랑하지 않았으며, 요구하기보다 오히려 복종하고, 받기보다 주는 것을 더 기쁘게 여기며; 메시아께서 주시는 공급에 만족하고, 그의 말씀에 주의를 기울여 마음 깊이 간직하였으며, 그의 고난이 여러분의 눈앞에 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  english_pob_choice: you were humble-minded
  chosen_korean: 겸손한 마음을 품고
  alternatives_korean:
  - 겸손한 마음이었고
  - 겸손하게 생각하고
  lexicon: ταπεινοφρονέω
  rationale: 단순한 태도보다 내적 자세를 드러내는 표현이어서, 한국어에서는 ‘겸손한 마음을 품다’로 옮겨 현재의 성향을 자연스럽게 살렸습니다.
- source_word: μηδὲν ἀλαζονευόμενοι
  english_pob_choice: boasting in nothing
  chosen_korean: 아무것도 자랑하지 않았으며
  alternatives_korean:
  - 아무것도 허세 부리지 않았으며
  - 아무 일도 뽐내지 않았으며
  lexicon: ἀλαζονεύομαι
  rationale: 문맥상 허풍·과시를 가리키므로, 공적 문체에서 자연스럽고 직접적인 ‘자랑하다’로 처리했습니다.
- source_word: ὑποτασσόμενοι μᾶλλον ἢ ὑποτάσσοντες
  english_pob_choice: submitting rather than demanding submission
  chosen_korean: 요구하기보다 오히려 복종하고
  alternatives_korean:
  - 복종받기보다 오히려 복종하고
  - 남을 복종시키기보다 스스로 복종하고
  lexicon: ὑποτάσσω
  rationale: 대구를 한국어에서 선명하게 살리기 위해 능동적 지배를 ‘요구하다’로 풀었고, 대비항은 ‘복종하다’로 유지했습니다.
- source_word: ἧδον διδόντες ἢ λαμβάνοντες
  english_pob_choice: taking more pleasure in giving than in receiving
  chosen_korean: 받기보다 주는 것을 더 기쁘게 여기며
  alternatives_korean:
  - 받는 것보다 주는 것을 더 즐거워하며
  - 받기보다 주는 것을 더 좋아하며
  lexicon: δίδωμι / λαμβάνω
  rationale: 감정의 우선순위를 나타내는 비교 구조를 자연스럽게 살려, ‘더 기쁘게 여기며’로 번역했습니다.
- source_word: τοῖς ἐφοδίοις τοῦ Χριστοῦ
  english_pob_choice: the provisions of the Messiah
  chosen_korean: 메시아께서 주시는 공급에
  alternatives_korean:
  - 메시아의 공급에
  - 메시아께서 마련해 주시는 필요에
  lexicon: ἐφόδιον
  rationale: ἐφόδιον은 여행·생활을 위한 준비물과 공급을 뜻하므로, 본문 취지를 살려 ‘공급’으로 옮겼습니다.
- source_word: τοὺς λόγους αὐτοῦ ... ἐνεστερνισμένοι ... τοῖς σπλάγχνοις
  english_pob_choice: you had embraced them carefully in your hearts
  chosen_korean: 그의 말씀에 주의를 기울여 마음 깊이 간직하였으며
  alternatives_korean:
  - 그의 말씀을 마음으로 받아들였으며
  - 그의 말씀을 깊이 품었으며
  lexicon: ἐνεστερνίζομαι / σπλάγχνα
  rationale: σπλάγχνα의 문자적 ‘내장’ 이미지는 영어 본문처럼 현대 한국어에선 과도하게 신체적이므로, 심정과 수용을 함께 살리는 ‘마음 깊이 간직하다’로 옮겼습니다.
theological_decisions:
- issue: Χριστός의 호칭 처리
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: 이 프로젝트의 기본 용례를 따라 titulary 의미를 드러내는 ‘메시아’를 사용해, 고유명사화된 교회 용어보다 원어의 직능적 뉘앙스를 살렸습니다.
  doctrine_reference: Christology / title translation policy
- issue: σπλάγχνα의 비유적 의미
  chosen_reading: 마음 깊이 간직하다
  alternative_readings:
  - 심장에
  - 내장에
  rationale: 본문의 정서적·관계적 의미가 핵심이므로, 해부학적 이미지를 그대로 옮기기보다 초기 기독교 그리스어의 비유적 용법을 반영했습니다.
  doctrine_reference: Anthropology / idiomatic Semitic-Hellenistic metaphor
