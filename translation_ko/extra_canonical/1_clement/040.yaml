source:
  edition: Funk 1901 (normalized OCR)
  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους. 2. τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις. 3. ποῦ τε καὶ διὰ τίνων ἐπιτελεῖσθαι θέλει, αὐτὸς ὥρισεν τῇ ὑπερτάτῃ αὐτοῦ βουλήσει, ἵνʼ ὁσίως πάντα γινόμενα ἐν εὐδοκήσει εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ. 4. οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν. 5. τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
  pages:
  - 313
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040.yaml
  text: Therefore[a], since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. He commanded that both the offerings and the ministries be performed, and not take place casually or disorderly, but at fixed times and hours. And where and through whom he wants them to be performed, he himself determined by his supreme will, so that, all things being done in holiness[b], they might be acceptable to his will with approval. Therefore those who make their offerings at the prescribed times are both acceptable and blessed; for by following the lawful ordinances of the Master they do not go astray. For to the high priest his own ministries have been given, and to the priests their own place has been assigned, and upon the Levites their own services are laid[c][d][e]; the layman is bound by the layman's ordinances.
  footnotes:
  - marker: a
    text: Or 'well-pleasing and acceptable to his will.' The Greek expression is emphatic, combining favorable regard and acceptability.
    reason: lexical_alternative
    anchor_ref: '40:3'
  - marker: b
    text: The verb can also mean 'do not miss the mark' or 'do not transgress.'
    reason: lexical_alternative
    anchor_ref: '40:4'
  - marker: e
    text: Clement appeals to the ordered roles of Israel's worship—high priest, priests, Levites, and layman—as an analogy for proper order in the community.
    reason: cross_reference
    anchor_ref: '40:5'
  - marker: d
    text: Or 'do everything in order that the Master commanded'.
    reason: previous_rendering
  - marker: c
    text: Or 'at the appointed times that have been prescribed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이러한 일들이 우리에게 분명하므로, 또 우리가 하나님의 지식의 깊은 곳을 들여다보았으므로, 우리는 모든 것을 질서 있게, 곧 주인께서 정해진 때들에 행하라고 명하신 그대로 해야 합니다. 그분은 제물과 사역이 수행되어야 하며, 우연히나 무질서하게가 아니라 정해진 때와 시간에 이루어져야 한다고 명하셨습니다. 또한 어디서 누구를 통해 그것들이 이루어지기를 원하시는지, 그분 자신이 자신의 가장 높은 뜻으로 정하셨으니, 모든 것이 거룩함 가운데 이루어져 그분의 뜻에 기꺼이 받아들여질 수 있게 하려는 것입니다. 그러므로 정해진 때에 자기 제물을 바치는 사람들은 받아들여질 뿐 아니라 복됩니다. 그들은 주인의 합법적인 규정을 따름으로 길을 벗어나지 않기 때문입니다. 대제사장에게는 그만의 사역이 주어졌고, 제사장들에게는 그들만의 자리가 정해졌으며, 레위인들에게는 그들만의 봉사가 맡겨졌습니다. 평민은 평민의 규정에 매여 있습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων οὖν ἡμῖν ὄντων τούτων
  english_pob_choice: since these things are plain to us
  chosen_korean: 이러한 일들이 우리에게 분명하므로
  alternatives_korean:
  - 이러한 일들이 우리에게 명백하므로
  - 이러한 일들이 우리에게 드러나 있으므로
  lexicon: LSJ
  rationale: προδήλων의 분명함·명백함을 살리되, 문맥의 논증적 연결을 자연스럽게 반영했습니다.
- source_word: ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως
  english_pob_choice: have peered into the depths of the divine knowledge
  chosen_korean: 하나님의 지식의 깊은 곳을 들여다보았으므로
  alternatives_korean:
  - 하나님의 지식의 깊이를 자세히 살펴보았으므로
  - 신적 지식의 깊은 곳에 고개를 숙여 들여다보았으므로
  lexicon: LSJ
  rationale: ‘들여다보다’로 육체적이고 집중적인 관찰 이미지를 살리면서, ‘깊은 곳’으로 βάθη의 공간적 비유를 유지했습니다.
- source_word: ὁ δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주인께서
  alternatives_korean:
  - 주께서
  - 주인님께서
  - 주권자께서
  lexicon: LSJ
  rationale: δεσπότης는 κύριος보다 강한 지배·명령의 뉘앙스가 있어, 본문에서의 권위와 규정성을 살리는 ‘주인’이 적합합니다.
- source_word: κατὰ καιροὺς τεταγμένους / ὡρισμένοις καιροῖς καὶ ὥραις
  english_pob_choice: at the appointed times / at fixed times and hours
  chosen_korean: 정해진 때들 / 정해진 때와 시간
  alternatives_korean:
  - 예정된 때들 / 정해진 시기와 시간
  - 지정된 때들 / 지정된 때와 시각
  lexicon: LSJ
  rationale: καιρός와 ὥρα의 시간 어휘를 구별하되, 한국어에서는 ‘정해진 때’와 ‘시간’으로 자연스럽게 옮겼습니다.
- source_word: τοῖς νομίμοις τοῦ δεσπότου
  english_pob_choice: the lawful ordinances of the Master
  chosen_korean: 주인의 합법적인 규정
  alternatives_korean:
  - 주인의 합법한 규정
  - 주인의 정당한 규례
  - 주인의 법도
  lexicon: LSJ
  rationale: νομίμοις는 단순한 ‘법’보다 규범적·질서적 의미가 있어 ‘합법적인 규정’으로 옮겨, 문맥의 질서 강조를 살렸습니다.
- source_word: ὁ λαϊκὸς ἄνθρωπος ... τοῖς λαϊκοῖς προστάγμασιν δέδεται
  english_pob_choice: the layman is bound by the layman's ordinances
  chosen_korean: 평민은 평민의 규정에 매여 있습니다
  alternatives_korean:
  - 일반인은 일반인의 규정에 매여 있습니다
  - 속인은 속인의 규정에 매여 있습니다
  lexicon: LSJ
  rationale: 라틴/교회 전통의 후대 용어보다, 제의적 대조를 드러내는 ‘평민’이 본문의 대조 구조를 더 직접적으로 반영합니다.
theological_decisions:
- issue: δεσπότης의 한국어 신학적 뉘앙스
  chosen_reading: 주인
  alternative_readings:
  - 주
  - 주님
  - 주권자
  rationale: 이 문맥에서는 언약적 호칭보다 명령권을 가진 분의 권위를 드러내는 것이 핵심이므로, ‘주인’이 δεσπότης의 강도를 더 잘 보존합니다.
  doctrine_reference: 원어 우선 원칙; 용어 구분 보존
- issue: 제의적/사회적 직분 대비를 한국어로 어떻게 살릴지
  chosen_reading: 대제사장-제사장-레위인-평민의 질서 있는 대비를 유지
  alternative_readings:
  - 교회 직분으로 일반화
  - 단순히 ‘지도자들’과 ‘평신도’로 완화
  rationale: 클레멘스의 논증은 이스라엘 예배 질서의 예시를 그대로 사용하므로, 한국어에서도 그 구조를 희석하지 않고 유지해야 합니다.
  doctrine_reference: 본문의 수사 구조 보존; 문맥 우선 번역
