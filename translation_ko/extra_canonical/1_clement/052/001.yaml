id: 1CLEM.52.1
reference: 1 Clement 52:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀπροσδεής, ἀδελφοί, ὁ δεσπότης ὑπάρχει τῶν ἁπάντων· οὐδενὸς οὐδὲν χρῄζει εἰ μὴ τὸ ἐξομολογεῖσθαι αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/001.yaml
  text: The Master of all is without need, brothers; he needs nothing from anyone except that confession be made to him.
  footnotes:
  - marker: a
    text: Or 'he has need of nothing'.
    reason: previous_rendering
translation:
  language: ko
  text: 만물의 주인께서는 아무것도 필요로 하지 않으십니다, 형제 여러분. 그는 사람에게서 아무것도 필요로 하지 않으시며, 다만 사람들이 그분께 고백하는 것만을 원하십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπροσδεής
  english_pob_choice: is without need
  chosen_korean: 아무것도 필요로 하지 않으십니다
  alternatives_korean:
  - 필요가 없으십니다
  - 아무런 필요도 없으십니다
  lexicon: ἀπροσδεής
  rationale: 형용사의 핵심 의미인 ‘필요가 없음’을 살리되, 뒤의 `οὐδενὸς οὐδὲν χρῄζει`와 함께 읽힐 때 자연스럽게 반복 강조가 되도록 했습니다.
- source_word: ὁ δεσπότης
  english_pob_choice: The Master
  chosen_korean: 만물의 주인
  alternatives_korean:
  - 주인
  - 주님
  lexicon: δεσπότης
  rationale: δεσπότης는 단순한 호칭 ‘주님’보다 소유·통치의 뉘앙스가 강하므로, `τῶν ἁπάντων`과 결합된 의미를 드러내기 위해 ‘만물의 주인’으로 옮겼습니다.
- source_word: οὐδενὸς οὐδὲν χρῄζει
  english_pob_choice: he needs nothing from anyone
  chosen_korean: 사람에게서 아무것도 필요로 하지 않으시며
  alternatives_korean:
  - 아무에게서도 아무것도 필요로 하지 않으시며
  - 어느 누구에게서도 아무것도 요구하지 않으시며
  lexicon: χρῄζω
  rationale: 개정된 영어의 관계적 강조를 반영해, 단순한 ‘없다’보다 ‘~에게서’ 구조로 원문의 ‘from anyone’ 뉘앙스를 분명히 했습니다.
- source_word: τὸ ἐξομολογεῖσθαι αὐτῷ
  english_pob_choice: that confession be made to him
  chosen_korean: 사람들이 그분께 고백하는 것만을 원하십니다
  alternatives_korean:
  - 그분께 고백하는 것뿐입니다
  - 그분께 자백하는 것만을 바라십니다
  lexicon: ἐξομολογέομαι
  rationale: 이 문맥에서 고백은 죄의 자백이라기보다 하나님께 드리는 인정·고백의 행위이므로 ‘고백하다’로 두고, 무생물 주어형보다 한국어에서 자연스러운 행위 주어로 풀었습니다.
theological_decisions:
- issue: δεσπότης의 위상 표현
  chosen_reading: ‘만물의 주인’으로 번역해, 하나님의 절대적 소유권과 통치권을 드러냈습니다.
  alternative_readings:
  - 주인
  - 주님
  rationale: 본문의 `τῶν ἁπάντων`이 포함된 보편적 지배를 반영해야 하므로, 단순 호칭보다 창조주-주권자의 의미를 드러내는 표현이 필요합니다.
  doctrine_reference: 하나님의 주권
- issue: ἐξομολογεῖσθαι의 신학적 방향
  chosen_reading: ‘그분께 고백하는 것’으로 번역해, 하나님이 필요로 하시는 것은 인간의 공로가 아니라 하나님께 대한 진실한 인정과 회개임을 드러냈습니다.
  alternative_readings:
  - 자백하는 것
  - 감사하는 것
  rationale: 문맥상 하나님께 결핍을 채워 드리는 것이 아니라, 인간이 하나님 앞에서 자신의 위치를 인정하는 행위가 유일한 요구사항으로 제시됩니다.
  doctrine_reference: 회개와 고백
