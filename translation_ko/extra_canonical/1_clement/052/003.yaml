source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Θῦσον τῷ θεῷ θυσίαν αἰνέσεως καὶ ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/003.yaml
  text: And again he says, “Offer to God a sacrifice of praise, and pay your vows to the Most High; and call upon me in the day of your affliction, and I will deliver you, and you will glorify me.”
translation:
  language: ko
  text: 그리고 다시 이렇게 말씀하십니다. 「하나님께 감사의 제사를 드리고, 지극히 높으신 이에게 네 서원을 갚아라. 그리고 네 환난의 날에 나를 부르라. 내가 너를 건져내겠고, 너는 나를 영화롭게 할 것이다」.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θῦσον τῷ θεῷ θυσίαν αἰνέσεως
  english_pob_choice: Offer to God a sacrifice of praise
  chosen_korean: 하나님께 감사의 제사를 드리고
  alternatives_korean:
  - 하나님께 찬양의 제사를 바치고
  - 하나님께 찬미의 제사를 드리고
  lexicon: θυσία αἰνέσεως
  rationale: 히브리서식 ‘찬양의 제사’와 의미가 겹치지만, 여기서는 제사 행위보다 감사와 찬송의 응답을 드러내기 위해 ‘감사의 제사’를 택했습니다. ‘드리다’는 제의적 헌신을 자연스럽게 살립니다.
- source_word: ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου
  english_pob_choice: pay your vows to the Most High
  chosen_korean: 지극히 높으신 이에게 네 서원을 갚아라
  alternatives_korean:
  - 지극히 높으신 이께 네 서원을 이행하라
  - 지극히 높으신 분께 네 서원을 돌려드려라
  lexicon: ἀποδίδωμι / εὐχαί
  rationale: εὐχάς는 단순한 ‘기도’가 아니라 서원(맹세/헌신의 약속)을 가리키므로, ‘갚다’라는 동사를 살려 의무 이행의 뉘앙스를 유지했습니다.
- source_word: ἐπικαλέσαι με ἐν ἡμέρᾳ θλίψεώς σου
  english_pob_choice: call upon me in the day of your affliction
  chosen_korean: 네 환난의 날에 나를 부르라
  alternatives_korean:
  - 네 고난의 날에 나를 부르라
  - 네 고통의 날에 나를 부르라
  lexicon: ἐπικαλέομαι / θλῖψις
  rationale: ἐπικαλέομαι는 단순 호명이 아니라 도움을 청해 부르는 뜻이므로 ‘부르다’로 간결하게 옮겼고, θλίψεώς는 상황적 압박을 살려 ‘환난’으로 번역했습니다.
- source_word: ἐξελοῦμαί σε
  english_pob_choice: I will deliver you
  chosen_korean: 내가 너를 건져내겠고
  alternatives_korean:
  - 내가 너를 구해 주겠고
  - 내가 너를 구출하겠고
  lexicon: ἐξαιρέω
  rationale: ‘deliver’의 일반적 구원어보다, 위험한 상태에서 끌어내는 동작성이 있어 ‘건져내다’가 원문의 긴박함을 더 잘 드러냅니다.
theological_decisions:
- issue: 하나님을 직접 부르는 인용문 안의 1인칭·2인칭 및 명령형 처리
  chosen_reading: 인용된 신적 발화는 한국어에서 직접 명령형과 1인칭 약속형을 자연스럽게 살려, 「부르라 / 건져내겠고 / 영화롭게 할 것이다」로 옮겼습니다.
  alternative_readings:
  - 부르십시오 / 건져드리겠습니다 / 영화롭게 하겠습니다
  rationale: 시편 인용의 시적 병렬을 보존하면서도, 본문이 전달하는 약속-응답 구조를 선명하게 유지하기 위한 선택입니다.
  doctrine_reference: 시편 50:14-15 병행 인용의 서사·예배 문맥
