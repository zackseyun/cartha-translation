id: 1CLEM.52.2
reference: 1 Clement 52:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ· Ἐξομολογήσομαι τῷ κυρίῳ, καὶ ἀρέσει αὐτῷ ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς· ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/052/002.yaml
  text: For the chosen David says[a], “I will give thanks to the Lord, and it will please him more than a young bull with horns and hooves. Let the poor see and be glad.”
  footnotes:
  - marker: a
    text: Or 'bringing forth horns and hoofs'.
    reason: previous_rendering
translation:
  language: ko
  text: 택함을 받은 다윗이 말합니다. “내가 주님께 감사하겠습니다. 그것은 뿔과 발굽이 자라나는 어린 수소보다 그분을 더 기쁘시게 할 것입니다. 가난한 이들이여, 보고 기뻐하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησὶ γὰρ ὁ ἐκλεκτὸς Δαυίδ
  english_pob_choice: For the chosen David says
  chosen_korean: 선택된 다윗이 말합니다
  alternatives_korean:
  - 택하신 다윗이 말합니다
  - 선택된 다윗이 말하십니다
  lexicon: ἐκλεκτός
  rationale: ἐκλεκτός는 ‘선택된/택하신’의 뜻이므로, 문맥상 다윗을 가리키는 서술형으로 자연스럽게 옮겼습니다. 공적 인용문 도입이므로 합쇼체를 유지했습니다.
- source_word: Ἐξομολογήσομαι τῷ κυρίῳ
  english_pob_choice: I will give thanks to the Lord
  chosen_korean: 내가 주님께 감사하겠습니다
  alternatives_korean:
  - 내가 주님을 찬송하겠습니다
  - 내가 주님께 고백하겠습니다
  lexicon: ἐξομολογέομαι
  rationale: 이 구절에서는 ἐξομολογέομαι가 ‘감사하다’의 의미로 쓰이므로, 영어 POB의 수정된 해석을 반영해 ‘감사하겠습니다’로 옮겼습니다. ‘고백하다’는 한국어에서 죄 고백으로 오해될 수 있어 피했습니다.
- source_word: ὑπὲρ μόσχον νέον κέρατα ἐκφέροντα καὶ ὁπλάς
  english_pob_choice: more than a young bull with horns and hooves
  chosen_korean: 젊은 수송아지, 곧 뿔과 굽을 내미는 수송아지보다
  alternatives_korean:
  - 젊은 수송아지, 곧 뿔과 발굽을 내미는 수송아지보다
  - 젊은 송아지가 뿔과 굽을 내미는 것보다
  lexicon: μόσχος / κέρας / ὁπλή / ἐκφέρω
  rationale: κέρατα ἐκφέροντα καὶ ὁπλάς는 단순한 소유가 아니라 ‘뿔과 굽을 내밀며 자라는’ 형상을 가리키므로, ‘뿔과 굽을 내미는’으로 직역에 가깝게 살렸습니다. ὁπλάς는 현대 한국어에서 ‘발굽’보다 간결한 ‘굽’으로 옮겼습니다.
- source_word: ἰδέτωσαν πτωχοὶ καὶ εὐφρανθήτωσαν
  english_pob_choice: Let the poor see and be glad
  chosen_korean: 가난한 이들은 보고 기뻐하십시오
  alternatives_korean:
  - 가난한 이들은 보고 즐거워하십시오
  - 가난한 이들이 보고 기뻐하게 하십시오
  lexicon: πτωχοὶ / εὐφρανθήτωσαν
  rationale: 직접 명령형의 호소를 살리되, 한국어 공적 문체에 맞게 ‘기뻐하십시오’로 옮겼습니다. ‘즐거워하십시오’도 가능하지만, 본문의 감정은 ‘기쁨’이 더 직접적입니다.
theological_decisions:
- issue: 인용문 내부의 화자 표지와 명령형의 어조
  chosen_reading: 다윗의 말을 소개하는 서술은 합쇼체로 유지하고, 인용문 마지막 명령은 공동체를 향한 직접 호소로서 공적 명령형 ‘기뻐하십시오’로 옮겼습니다.
  alternative_readings:
  - 인용 전체를 더 평이한 해라체로 낮추는 방식
  - 마지막을 완곡한 청유형으로 바꾸는 방식
  rationale: 이 절은 시편 인용을 통해 청자에게 즉각적 반응을 요구하므로, 원문의 호소력을 살리면서도 한국어 독자에게 자연스러운 공적 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 시편 인용의 수사적 기능과 성경 인용의 직접화
