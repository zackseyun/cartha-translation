  - 깨어진
  - 찢긴
  lexicon: συντρίβω
  rationale: ‘상한’도 가능하지만, 본문은 하나님 앞에서 꺾이고 깨진 상태를 말하므로 더 직설적인 ‘부서진’이 원문 긴장을 잘 드러냅니다.
theological_decisions:
- issue: ‘제물’과 ‘부서진 영’의 관계 표현
  chosen_reading: 하나님께 드리는 참된 제물은 외적 희생이 아니라 부서진 영입니다.
  alternative_readings:
  - ‘희생’ 중심으로 읽기
  - ‘겸손한 마음’으로 완화하기
  rationale: 본문은 제의적 용어를 쓰면서도 실제로 하나님이 받으시는 것은 내적 상태임을 강조하므로, 이를 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 시 51:17의 회개/겸손한 영 이해
