lexical_decisions:
- source_word: θυσία
  english_pob_choice: a sacrifice
  chosen_korean: 제물
  alternatives_korean:
  - 희생제물
  - 희생
  - 제사
  lexicon: θυσία
  rationale: 문맥상 하나님께 드리는 ‘제물’의 의미가 분명하므로, 현대 한국어에서 자연스럽고 종교적 무게를 유지하는 ‘제물’로 옮겼습니다.
- source_word: τῷ θεῷ
  english_pob_choice: to God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 하나님 앞에
  lexicon: θεός
  rationale: 여기서는 수혜/대상 표지로서 ‘하나님께’가 가장 간결하고 자연스럽습니다.
- source_word: πνεῦμα
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 마음
  - 영혼
  - 숨결
  lexicon: πνεῦμα
  rationale: 원어는 인간 내면의 영적 실재를 가리키므로, 신학적·어휘적으로 가장 직접적인 ‘영’을 유지했습니다.
- source_word: συντετριμμένον
  english_pob_choice: broken
  chosen_korean: 부서진
  alternatives_korean:
