revisions:
- from: 그러면 환난을 참아 견디는 이들을 위해 예비된 것들이 무엇입니까? 세대들의 창조주이시며 아버지이신 분, 지극히 거룩하신 그분 자신이 그것들의 분량과 아름다움을 아십니다.[a][b]
  to: 그러면 인내하는 이들에게 예비된 것들은 무엇입니까? 시대들의 창조주시며 아버지이신 지극히 거룩하신 분께서 친히 그것들의 분량과 아름다움을 아십니다.
  rationale: 목적어 없는 ὑπομένουσιν을 '인내하는 이들'로 유지하여 원문의 범위를 보존했습니다. αἰώνων은 '시대들'로 옮겼고, αὐτός의 강조는 '친히'로 자연스럽게 나타냈습니다. 폐기된 영어 이전 번역을 전제로 한 각주 앵커들은 삭제했습니다.
