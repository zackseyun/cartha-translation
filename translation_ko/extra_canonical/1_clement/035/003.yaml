review_pass:
  verdict: revise
  source_fidelity: '''환난을''은 그리스어 τοῖς ὑπομένουσιν에 없는 목적어를 보충하므로 삭제해야 합니다. αἰώνων은 ''세대들''보다 시간적 시대들을 뜻하는 ''시대들''이 더 직접적입니다. 나머지 핵심 의미, 곧 예비된 것들과 그것들의 분량 및 아름다움을 하나님만 아신다는 진술은 보존됩니다.'
  naturalness: '''지극히 거룩하신 그분 자신이''보다 서술 주어를 ''지극히 거룩하신 분께서 친히''로 처리하면 현대 한국어 합쇼체에서 더 자연스럽고 αὐτός의 강조도 살아납니다. 수혜 대상을 ''인내하는 이들에게''로 옮기면 ''위해''보다 간결하고 원문의 여격에 가깝습니다.'
  terminology: δημιουργός는 '창조주', πατήρ는 '아버지', πανάγιος는 '지극히 거룩하신', αἰῶνες는 이 문맥에서 '시대들'로 번역합니다. 특정 시련인 '환난'을 도입하지 않습니다.
  issues:
  - severity: medium
    issue: 원문에 없는 '환난'의 첨가
    rationale: ὑπομένουσιν은 목적어 없이 '인내하는/견디는 이들'이라고만 말합니다. 환난을 명시하면 인내의 대상을 불필요하게 한정합니다.
  - severity: low
    issue: αἰώνων을 '세대들'로 번역
    rationale: '''세대''는 보통 사람들의 세대·generation을 가리키므로, 시간의 시대들/ages를 가리키는 αἰῶνες와의 대응이 약합니다.'
  - severity: medium
    issue: '[a][b] 각주의 근거 및 내용 부재'
    rationale: 제시된 영어 각주 a와 b는 이전의 폐기된 영어 표현에 관한 것이며, 현 그리스어 본문이나 한국어 번역에 적용될 내용이 아닙니다. 한국어 본문에서는 앵커와 각주를 제거해야 합니다.
  revised_text: 그러면 인내하는 이들에게 예비된 것들은 무엇입니까? 시대들의 창조주시며 아버지이신 지극히 거룩하신 분께서 친히 그것들의 분량과 아름다움을 아십니다.
