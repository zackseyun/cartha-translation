id: 1CLEM.35.3
reference: 1 Clement 35:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τίνα οὖν ἄρα ἐστὶν τὰ ἑτοιμασμένα τοῖς ὑπομένουσιν; ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων ὁ πανάγιος αὐτὸς γινώσκει τὴν ποσότητα καὶ τὴν καλλονὴν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/003.yaml
  text: What then are the things prepared for those who patiently endure? The Creator and Father of the ages[a], the all-holy one himself[b], knows their measure and their beauty.
  footnotes:
  - marker: a
    text: Or 'What then, therefore,'.
    reason: previous_rendering
  - marker: b
    text: Or 'for those who patiently endure for him?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 환난을 참아 견디는 이들을 위해 예비된 것들이 무엇입니까? 세대들의 창조주이시며 아버지이신 분, 지극히 거룩하신 그분 자신이 그것들의 분량과 아름다움을 아십니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα οὖν ἄρα ἐστὶν
  english_pob_choice: What then
  chosen_korean: 그러면 ... 무엇입니까?
  alternatives_korean:
  - 그렇다면 ... 무엇입니까?
  - 그런즉 ... 무엇입니까?
  lexicon: source connective + interrogative
  rationale: οὖν ἄρα의 논리적 귀결을 살리되, 영어 POB가 중복된 'then, therefore'를 정리한 흐름에 맞춰 자연스러운 한국어 추론 질문으로 옮겼습니다.
- source_word: τοῖς ὑπομένουσιν
  english_pob_choice: for those who patiently endure
  chosen_korean: 환난을 참아 견디는 이들을 위해
  alternatives_korean:
  - 인내하는 이들을 위해
  - 견디는 이들을 위해
  lexicon: ὑπομένω
  rationale: 단순한 '기다리다'보다 시련 속에서 끝까지 견디는 뜻이 강하므로, 문맥상 '환난을 참아 견디다'로 구체화했습니다.
- source_word: ὁ δημιουργὸς καὶ πατὴρ τῶν αἰώνων
  english_pob_choice: The Creator and Father of the ages
  chosen_korean: 세대들의 창조주이시며 아버지이신 분
  alternatives_korean:
  - 시대들의 창조주이시며 아버지이신 분
  - 영원들의 창조주이시며 아버지이신 분
  lexicon: δημιουργός; πατήρ; αἰῶνες
  rationale: αἰώνων은 여기서 '세대들/시대들'로 이해할 수 있으나, 문맥의 우주적·시간적 총체성을 살리기 위해 '세대들'을 택했고, 직함 구조를 유지했습니다.
- source_word: ὁ πανάγιος αὐτὸς
  english_pob_choice: the all-holy one himself
  chosen_korean: 지극히 거룩하신 그분 자신
  alternatives_korean:
  - 완전히 거룩하신 그분 자신
  - 온전히 거룩하신 그분 자신
  lexicon: πανάγιος
  rationale: πανάγιος의 전면적 거룩함을 '지극히 거룩하신'으로 옮겨, 존칭과 속성 강조를 함께 살렸습니다.
theological_decisions:
- issue: αἰώνων의 번역 범위
  chosen_reading: '''세대들''로 옮기되, 하나님의 창조·주권이 시간의 구분 전체를 포괄한다는 함의를 보존했습니다.'
  alternative_readings:
  - '''시대들'''
  - '''영원들'''
  rationale: 본문은 창조주와 아버지라는 칭호에 연결되어 있어 단순한 연대기보다 피조 세계의 모든 시대/질서를 포괄하는 표현이 적절합니다.
  doctrine_reference: 하나님의 창조주권과 섭리
- issue: αὐτὸς의 강조 처리
  chosen_reading: '''그분 자신''으로 옮겨 주어의 자가 강조를 드러냈습니다.'
  alternative_readings:
  - '''직접'''
  - 생략
  rationale: 문장 말미의 αὐτός는 단순 대명사보다 강조 기능이 강하므로, 한국어에서도 주체의 직접성을 명시하는 것이 자연스럽습니다.
  doctrine_reference: 신적 자아강조
