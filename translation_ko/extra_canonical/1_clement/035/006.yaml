  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα γὰρ οἱ πράσσοντες στυγητοὶ τῷ θεῷ ὑπάρχουσιν· οὐ μόνον δὲ οἱ πράσσοντες αὐτά, ἀλλὰ καὶ οἱ συνευδοκοῦντες αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/006.yaml
  text: For those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them.
translation:
  language: ko
  text: 이런 것들을 행하는 자들은 하나님께 가증한 자들입니다. 행하는 자들만이 아니라, 그것들을 좋게 여기고 동의하는 자들도 그렇습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγητοὶ τῷ θεῷ
  english_pob_choice: hateful to God
  chosen_korean: 하나님께 가증한 자들
  alternatives_korean:
  - 하나님께 미운 자들
  - 하나님께 혐오스러운 자들
  - 하나님께 증오받는 자들
  lexicon: στυγητός
  rationale: στυγητοί는 단순한 감정적 ‘미움’보다 강한 혐오·가증함을 뜻하므로, 한국어에서는 ‘가증한 자들’이 source의 강도를 가장 잘 드러냅니다.
- source_word: οἱ πράσσοντες
  english_pob_choice: those who practice
  chosen_korean: 행하는 자들
  alternatives_korean:
  - 실행하는 자들
  - 계속 행하는 자들
  - 이런 일을 하는 자들
  lexicon: πράσσω
  rationale: πράσσοντες는 단발적 행위보다 지속적 실천을 가리키는 경우가 많아, 간결하게 ‘행하는 자들’로 옮기되 문맥상 반복적 실천을 유지합니다.
- source_word: συνευδοκοῦντες αὐτοῖς
  english_pob_choice: those who approve of them
  chosen_korean: 그것들을 좋게 여기고 동의하는 자들
  alternatives_korean:
  - 그것들에 동조하는 자들
  - 그들을 승인하는 자들
  - 그것들을 찬동하는 자들
  lexicon: συνευδοκέω
  rationale: συνευδοκοῦντες는 단순한 관망이 아니라 적극적 승인·찬동을 뜻하므로, ‘좋게 여기고 동의하는’으로 두 층위를 함께 살렸습니다.
theological_decisions:
- issue: 하나님과의 관계를 나타내는 서술
  chosen_reading: ‘하나님께 가증한 자들’로 번역해 도덕적 비난이 아니라 하나님 앞에서의 실제적 반감·부정성을 드러냈습니다.
  alternative_readings:
  - 하나님께 미운 자들
  - 하나님께 혐오스러운 자들
  rationale: 문맥은 행위의 객관적 심각성을 경고하므로, 약한 정서어보다 강한 평가어가 본문의 경고 기능을 더 잘 전달합니다.
  doctrine_reference: 윤리적 경고와 하나님의 거룩하심
- issue: 행위자와 동조자의 동등한 책임
  chosen_reading: 행하는 자들뿐 아니라 그것들을 승인하는 자들도 함께 포함해, 본문이 책임을 행위와 동조 모두에 확장함을 살렸습니다.
  alternative_readings:
  - 행하는 자들만이 아니라 그들을 지지하는 자들도
  - 행하는 자들뿐 아니라 찬동하는 자들도
  rationale: 그리스어의 οὐ μόνον… ἀλλὰ καί 구조는 단순 반복이 아니라 동조의 죄책을 추가하므로, 이를 분명하게 드러내야 합니다.
  doctrine_reference: 도덕적 공모와 동조의 책임
