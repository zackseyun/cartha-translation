  text: ἡμεῖς οὖν ἀγωνιζώμεθα εὑρεθῆναι ἐν τῷ ἀριθμῷ τῶν ὑπομενόντων αὐτόν, ὅπως μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/004.yaml
  text: Therefore let us strive to be found among the number of those who wait for him[a], so that we may share in the promised gifts.
  footnotes:
  - marker: a
    text: Or 'patiently endure him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리는 그를 기다리는[a] 사람들의 수에 들도록 힘써야 합니다. 그렇게 하여 약속된 선물들을 함께 누리도록 해야 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 인내하며 기다리는’.
    reason: ὑπομένω는 여기서 ‘기다리다’가 문맥상 적절하지만, 동사의 인내·지속 의미를 반영하는 대안적 뉘앙스를 보존합니다. ‘그를 견디다’라고 하면 하나님을 견뎌야 할 대상으로 오해할 수 있으므로 피했습니다.
lexical_decisions:
- source_word: ἀγωνιζώμεθα
  english_pob_choice: let us strive
  chosen_korean: 힘써야 합니다
  alternatives_korean:
  - 분투해야 합니다
  - 애써야 합니다
  - 노력해야 합니다
  lexicon: ἀγωνίζομαι
  rationale: 공적 권면의 뉘앙스를 살리면서도 한국어에서 자연스럽고 격식 있는 권면으로 옮기기 위해 ‘힘써야 합니다’를 택했습니다.
- source_word: ὑπομενόντων αὐτόν
  english_pob_choice: those who wait for him
  chosen_korean: 그를 기다리는 자들
  alternatives_korean:
  - 그를 인내하는 자들
  - 그를 참아 견디는 자들
  - 그를 기다리며 버티는 자들
  lexicon: ὑπομένω
  rationale: 공식 영문 수정에 따라 여기서는 ‘인내하다’보다 ‘기다리다’가 문맥에 더 맞으며, 대상이 하나님일 때 ‘그를 기다리다’라는 뜻을 자연스럽게 드러냅니다.
- source_word: ἐν τῷ ἀριθμῷ
  english_pob_choice: among the number
  chosen_korean: 무리 가운데서
  alternatives_korean:
  - 숫자 안에서
  - 그 수 가운데
  - 그 무리 안에
  lexicon: ἀριθμός
  rationale: ‘number’의 수량적 표현을 한국어에서는 집합적 소속감을 드러내는 ‘무리 가운데서’로 옮겨, 문맥상의 ‘그들 가운데 포함되다’는 의미를 살렸습니다.
- source_word: ἐπηγγελμένων δωρεῶν
  english_pob_choice: the promised gifts
  chosen_korean: 약속된 선물
  alternatives_korean:
  - 약속하신 선물
  - 약속된 은사들
  - 약속된 선물들
  lexicon: δωρεά
  rationale: δώρεα의 기본 의미인 ‘선물’을 유지하되, 복수성을 한국어에서 자연스럽게 처리하기 위해 총칭적 단수로 옮겼습니다.
theological_decisions:
- issue: ὑπομενόντων αὐτόν의 의미
  chosen_reading: ‘그를 기다리는 자들’로 옮겨, 하나님을 ‘견디는’ 대상으로 만들지 않았습니다.
  alternative_readings:
  - 그를 인내하는 자들
  - 그를 참아 견디는 자들
  rationale: 수정된 POB 주석과 같이 여기서 ὑπομένω는 대상을 고통으로 전제하는 ‘견디다’보다, 주를 소망하며 ‘기다리다/기다려 바라다’는 의미가 더 적절합니다.
  doctrine_reference: 시편적 소망 언어와 하나님을 향한 신뢰의 표현
