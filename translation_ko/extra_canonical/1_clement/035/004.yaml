revisions:
- from: 그러므로 우리는 그를 기다리는 자들의 무리 가운데서 발견되도록 힘써야 합니다. 그래야 약속된 선물을 함께 받게 됩니다.[a]
  to: 그러므로 우리는 그를 기다리는[a] 사람들의 수에 들도록 힘써야 합니다. 그렇게 하여 약속된 선물들을 함께 누리도록 해야 합니다.
  rationale: 원문의 권면(ἀγωνιζώμεθα), 소속·포함 표현(ἐν τῷ ἀριθμῷ), 하나님을 기다리는 의미(ὑπομενόντων αὐτόν), 그리고 약속된 선물들에 참여하는 목적(μεταλάβωμεν τῶν ἐπηγγελμένων δωρεῶν)을 더 직접적이고 자연스러운 현대 한국어로 반영했습니다. 각주는 관련 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:48Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 μεταλάβωμεν은 단순히 ‘받다’보다 약속된 선물에 ‘함께 참여하다/누리다’는 뜻을 나타내며, δωρεῶν의 복수도 살리는 편이 좋습니다. ἐν τῷ ἀριθμῷ는 ‘사람들의 수에 들다’로 옮기면 원문의 포함·소속 표현을 더 직접적으로 반영합니다.
  naturalness: ‘그를 기다리는 자들의 무리 가운데서 발견되도록’도 이해되지만, 현대 표준어 합쇼체에서는 ‘그를 기다리는 사람들의 수에 들도록’이 더 자연스럽고 간결합니다. 목적절은 ‘그렇게 하여 … 누리도록’으로 연결하면 논리 관계가 분명합니다.
  terminology: ‘기다리다’는 αὐτόν을 목적어로 하는 ὑπομένω의 문맥상 의미에 적절합니다. 영어 감사 기록의 대안 독법은 한국어 각주로 보존하되, 본문은 ‘기다리다’를 유지합니다. δωρεῶν은 ‘선물들’로 복수성을 보존했습니다.
  issues:
  - severity: medium
    issue: 각주 표지가 문장 끝에 놓여 있고 한국어 각주 내용이 제공되지 않았습니다.
    rationale: 영어 감사 기록의 대안 독법은 ὑπομενόντων αὐτόν에 관한 것이므로 해당 어구에 표지를 붙이고 한국어로 각주를 제공해야 합니다.
  - severity: low
    issue: ‘함께 받게 됩니다’는 μεταλάβωμεν의 참여·향유 의미와 목적절의 관계를 충분히 드러내지 못할 수 있습니다.
    rationale: ‘약속된 선물들을 함께 누리도록’은 약속된 은혜에 참여한다는 뜻을 자연스럽게 전달합니다.
