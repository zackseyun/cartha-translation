lexical_decisions:
- source_word: ἐλέγξω
  english_pob_choice: I will rebuke you
  chosen_korean: 내가 너를 책망하고
  alternatives_korean:
  - 내가 너를 꾸짖고
  - 내가 너를 질책하고
  lexicon: ἐλέγχω
  rationale: 책망은 단순한 감정적 꾸중보다 잘못을 드러내어 바로잡는 뜻을 담아, POB의 'rebuke'를 자연스럽게 옮깁니다.
- source_word: παραστήσω
  english_pob_choice: set it before your face
  chosen_korean: 네 앞에 그것을 두겠습니다
  alternatives_korean:
  - 네 얼굴 앞에 세우겠습니다
  - 네 앞에 내세우겠습니다
  lexicon: παρίστημι
  rationale: ‘두다’는 대상이 앞에 놓여 드러나게 하는 의미를 살리며, ‘it’을 자연스럽게 보충해 그리스어의 목적어를 반영합니다.
- source_word: κατὰ πρόσωπόν σου
  english_pob_choice: before your face
  chosen_korean: 네 앞에
  alternatives_korean:
  - 네 얼굴 앞에
  - 네 면전에서
  lexicon: κατὰ πρόσωπον
  rationale: 관용적으로 ‘면전’도 가능하지만, 현대 한국어에서는 ‘네 앞에’가 직역성을 유지하면서도 더 자연스럽습니다.
