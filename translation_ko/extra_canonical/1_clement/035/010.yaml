  source_fidelity: 그리스어의 미래형 ἐλέγξω와 παραστήσω, 그리고 대격 목적어 σε 및 κατὰ πρόσωπόν σου의 대면적 표현은 대체로 반영되었습니다. 다만 παραστήσω는 단순히 물건을 ‘두다’보다 ‘앞에 제시하다/내보이다’라는 의미가 더 분명하므로 이를 한국어에서 드러내는 편이 낫습니다. 목적어는 본문에서 명시되지 않으므로 영어 감사 이력과 같이 ‘그것’을 보충하되, 그 선행 내용을 특정하지 않습니다.
  naturalness: 초안의 ‘네 앞에 그것을 두겠습니다’도 이해되지만 목적어를 앞세운 ‘그것을 네 앞에 제시하겠습니다’가 현대 한국어 어순으로 더 자연스럽고, 문맥 없이도 동작의 뜻이 더 분명합니다. ‘너’와 합쇼체 종결의 결합은 성서 인용체에서 가능하며, 이를 ‘당신’으로 바꾸면 한국어에서 불필요하게 대립적이거나 어색해질 수 있으므로 유지합니다.
  terminology: ‘책망하다’는 ἐλέγχω의 잘못을 드러내어 꾸짖고 바로잡는 뉘앙스를 무리 없이 담습니다. ‘제시하다’는 παραστήσω의 ‘앞에 세우다, 내놓다’에 적절하며, 교리적 해석을 더하지 않습니다.
