  text: 사랑하는 여러분, 하나님의 선물들이 얼마나 복되고 놀랍습니까!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς μακάρια καὶ θαυμαστὰ
  english_pob_choice: How blessed and marvelous
  chosen_korean: 얼마나 복되고 놀라운지요
  alternatives_korean:
  - 얼마나 복되며 놀라운지요
  - 어찌 그리 복되고 놀라운지요
  lexicon: μακάριος; θαυμαστός
  rationale: μακάρια와 θαυμαστὰ를 각각 ‘복되다’와 ‘놀랍다’로 살려, 축복의 상태와 경이로움을 함께 드러냈습니다.
- source_word: τὰ δῶρα
  english_pob_choice: the gifts
  chosen_korean: 하나님의 선물들
  alternatives_korean:
  - 하나님의 은사들
  - 하나님의 선물
  lexicon: δῶρον
  rationale: δῶρα는 문자적으로 ‘선물들’이므로, 문맥상 하나님께서 주시는 은혜의 선물을 자연스럽게 반영했습니다.
- source_word: τοῦ θεοῦ
  english_pob_choice: of God
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님께서 주신
  - 하나님이 주신
  lexicon: θεός
  rationale: 소유격을 한국어 관형격 ‘하나님의’로 옮겨 선물의 근원이 하나님이심을 분명히 했습니다.
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 여러분
  alternatives_korean:
  - 사랑하는 이들이여
  - 사랑하는 자들아
  lexicon: ἀγαπητός
  rationale: 호칭어로서의 ἀγαπητοί를 현대 한국어 독자에게 자연스러운 직접 호칭인 ‘사랑하는 여러분’으로 옮겼습니다.
