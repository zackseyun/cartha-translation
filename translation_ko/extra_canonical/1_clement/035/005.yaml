id: 1CLEM.35.5
reference: 1 Clement 35:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πῶς δὲ ἔσται τοῦτο, ἀγαπητοί; ἐὰν ἐστηργιμένῃ ἢ ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν, ἐὰν ἐκζητήσωμεν τὰ εὐάρεστα καὶ εὐπρόσδεκτα αὐτῷ, ἐὰν ἐπιτελέσωμεν τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ καὶ ἀκολουθήσωμεν τῇ ὁδῷ τῆς ἀληθείας, ἀπορρίψαντες ἀφ’ ἑαυτῶν πᾶσαν ἀδικίαν καὶ πονηρίαν, πλεονεξίαν, ἔρεις, κακοηθείας τε καὶ δόλους, ψιθυρισμούς τε καὶ καταλαλιάς, θεοστυγίαν, ὑπερηφανίαν τε καὶ ἀλαζονείαν, κενοδοξίαν τε καὶ ἀφιλοξενίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/005.yaml
  text: But how will this be[a], beloved? If our mind is firmly fixed on God in faithfulness, if we seek the things pleasing and acceptable to him, if we do the things that are fitting for his blameless will and follow the way of truth, having cast away from ourselves all unrighteousness and wickedness, greed, strife, malice and deceit, whisperings and slanders, hatred of God, pride and arrogance[c][b], vainglory and inhospitality.
  footnotes:
  - marker: a
    text: Or 'has been fixed'.
    reason: previous_rendering
  - marker: b
    text: Or 'belong to his blameless purpose'.
    reason: previous_rendering
  - marker: c
    text: Or 'malicious habits and deceits, whisperings and slanders, hatred of God, pride and arrogance, empty glory and lack of hospitality'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 이것이 어떻게 가능하겠습니까, 사랑하는 이들이여? 우리 마음이 하나님을 향하여 신실하게 굳게 서 있고, 그분께 기쁘고 받아들여질 만한 것들을 찾으며, 그분의 흠 없는 뜻에 합당한 일들을 행하고 진리의 길을 따르며, 우리 자신에게서 모든 불의와 악함, 탐욕, 다툼, 악의와 속임수, 수군거림과 중상, 하나님을 미워함, 교만과 오만, 헛된 자랑과 환대하지 않음을 내버릴 때 가능합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς δὲ ἔσται τοῦτο
  english_pob_choice: But how will this be
  chosen_korean: 그러면 이것이 어떻게 가능하겠습니까
  alternatives_korean:
  - 이것이 어떻게 되겠습니까
  - 그런데 이것이 어떻게 이루어지겠습니까
  lexicon: πῶς; ἔσται
  rationale: 수사적 질문의 힘을 살리면서도 한국어에서 자연스러운 가능성 질문으로 옮겼습니다.
- source_word: ἡ διάνοια ἡμῶν πιστῶς πρὸς τὸν θεόν
  english_pob_choice: our mind is firmly fixed on God in faithfulness
  chosen_korean: 우리의 마음이 믿음 안에서 하나님께 굳게 고정되어 있고
  alternatives_korean:
  - 우리의 생각이 신실하게 하나님을 향해 굳게 서 있고
  - 우리의 마음이 하나님께 충실히 고정되어 있고
  lexicon: διάνοια; πιστῶς
  rationale: διάνοια는 단순한 지성보다 내적 마음·생각의 중심을 가리키므로 ‘마음’으로 풀었고, πιστῶς는 관계적 신실함의 상태를 ‘믿음 안에서’로 자연스럽게 드러냈습니다.
- source_word: τὰ ἀνήκοντα τῇ ἀμώμῳ βουλήσει αὐτοῦ
  english_pob_choice: the things that are fitting for his blameless will
  chosen_korean: 그분의 흠 없는 뜻에 합당한 일들
  alternatives_korean:
  - 그분의 흠 없는 뜻에 맞는 것들
  - 그분의 흠 없는 뜻에 어울리는 것들
  lexicon: ἀνήκοντα; ἀμώμῳ βουλήσει
  rationale: ἀνήκοντα는 ‘속하는’보다 ‘합당한/마땅한’이 더 정확하며, βουλήσει는 여기서 ‘목적’보다 ‘뜻/의지’가 원문에 가깝습니다.
- source_word: κακοηθείας τε καὶ δόλους ... κενοδοξίαν τε καὶ ἀφιλοξενίαν
  english_pob_choice: malice and deceit ... vainglory and inhospitality
  chosen_korean: 악함과 속임수와 수군거림과 중상과 하나님을 미워함과 교만과 오만과 헛된 자랑과 비호의
  alternatives_korean:
  - 악의와 속임수와 ... 헛된 영광과 불친절
  - 악독과 기만과 ... 자만과 손님을 대접하지 않음
  lexicon: κακοηθείας; δόλους; θεοστυγίαν; κενοδοξίαν; ἀφιλοξενίαν
  rationale: 열거의 어조를 살리되, κακοηθείας는 단순한 ‘행동 습관’이 아니라 악한 성품/악함으로, κενοδοξίαν은 관용적으로 ‘헛된 자랑’으로, ἀφιλοξενίαν은 ‘비호의’로 옮겨 현대 한국어에서 과도하게 설명적이지 않게 했습니다.
theological_decisions:
- issue: πιστῶς πρὸς τὸν θεόν의 신학적 뉘앙스
  chosen_reading: 믿음 안에서 하나님께 굳게 고정되어 있고
  alternative_readings:
  - 하나님께 신실하게 고정되어 있고
  - 하나님을 향해 충실히 서 있고
  rationale: πιστῶς는 단순 심리 상태가 아니라 하나님과의 신실한 관계를 가리키므로, 믿음과 신실함의 결합을 드러내는 표현을 택했습니다.
  doctrine_reference: 믿음과 신실함의 결합
