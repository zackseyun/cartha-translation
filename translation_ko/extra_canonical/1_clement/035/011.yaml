id: 1CLEM.35.11
reference: 1 Clement 35:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: σύνετε δὴ ταῦτα, οἱ ἐπιλανθανόμενοι τοῦ θεοῦ, μήποτε ἁρπάσῃ ὡς λέων, καὶ μὴ ᾖ ὁ ῥυόμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/011.yaml
  text: Understand these things[a], then, you who forget God, lest he seize you like a lion, and there be no one to rescue.
  footnotes:
  - marker: a
    text: Or 'lest he seize like a lion'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것을 깨달으십시오[a], 하나님을 잊는 사람들이여. 그렇지 않으면 그가 사자처럼 여러분을 덮치실 것이며, 구해 줄 이가 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 사자처럼 덮치실까 하여.”
    reason: 그리스어 ὡς λέων(“사자처럼”)의 수식 관계를 달리 드러낼 수 있는 영어 POB 감사 이력의 대안을 보존합니다.
lexical_decisions:
- source_word: σύνετε δὴ ταῦτα
  english_pob_choice: Understand these things
  chosen_korean: 이것을 깨달으십시오
  alternatives_korean:
  - 이것들을 이해하십시오
  - 이것을 아십시오
  lexicon: σύνετε / ταῦτα
  rationale: σύνετε는 단순한 지식 획득보다 ‘분별하여 알아차리다, 깨닫다’의 뉘앙스가 있어, 경고문맥에 맞게 ‘깨달으십시오’로 옮겼습니다.
- source_word: οἱ ἐπιλανθανόμενοι τοῦ θεοῦ
  english_pob_choice: you who forget God
  chosen_korean: 하나님을 잊는 사람들이여
  alternatives_korean:
  - 하나님을 잊는 여러분
  - 하나님을 잊어버리는 자들이여
  lexicon: ἐπιλανθάνομαι + τοῦ θεοῦ
  rationale: 직역하면 ‘하나님을 잊는’이지만, 호명하는 구조를 살려 한국어에서는 직접 호격으로 자연스럽게 표현했습니다.
- source_word: ἁρπάσῃ ὡς λέων
  english_pob_choice: he seize you like a lion
  chosen_korean: 사자처럼 여러분을 덮치실
  alternatives_korean:
  - 사자처럼 여러분을 붙잡으실
  - 사자처럼 여러분을 낚아채실
  lexicon: ἁρπάζω / λέων
  rationale: ἁρπάζω는 ‘갑자기 잡아채다, 덮치다’의 급박함을 띠므로, ‘덮치다’가 한국어에서 위협성과 돌발성을 가장 자연스럽게 전달합니다.
- source_word: ὁ ῥυόμενος
  english_pob_choice: there be no one to rescue
  chosen_korean: 구해 줄 이가
  alternatives_korean:
  - 구원할 이가
  - 건져 줄 이가
  lexicon: ῥύομαι
  rationale: ῥύομαι는 ‘위기에서 구해 내다’의 뜻이므로, 문맥상 과장 없이 ‘구해 줄 이’로 옮겼습니다.
theological_decisions:
- issue: 하나님을 잊는 자들에게 주어지는 경고의 직접성
  chosen_reading: 직접 호격과 종결 경고를 유지해, 본문이 단순한 교훈이 아니라 심판 경고임을 드러냈습니다.
  alternative_readings:
  - 하나님을 잊는 여러분
  - 하나님을 잊는 자들
  rationale: 원문은 경고를 청중에게 직접 던지는 형식이므로, 완곡하게 풀기보다 호격과 조건절의 긴장을 살렸습니다.
  doctrine_reference: 본문 수사와 심판 경고의 문맥
