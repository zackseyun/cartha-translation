id: 1CLEM.35.7
reference: 1 Clement 35:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γὰρ ἡ γραφή· Τί δὲ ἀπαγγέλλεις εἰπεῖν ὁ θεός· Ἱνατί σὺ διηγεῖ τὰ δικαιώματά μου, καὶ ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/007.yaml
  text: For the Scripture says, “But to the wicked God says, Why do you recount my statutes, and take up my covenant on your lips?
translation:
  language: ko
  text: 성경은 이렇게 말합니다. 「악한 자에게 하나님은 말씀하십니다. ‘어찌하여 네가 내 율례들을 늘어놓으며, 내 언약을 네 입술에 올려놓느냐?’」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  english_pob_choice: For the Scripture says
  chosen_korean: 성경은 이렇게 말합니다
  alternatives_korean:
  - 성경이 말합니다
  - 기록된 성경은 말합니다
  lexicon: γραφή
  rationale: 인용 도입 공식은 현재형으로 처리하고, 한국어에서는 자연스럽게 ‘성경은 이렇게 말합니다’로 옮겨 인용의 권위를 분명히 했습니다.
- source_word: ὁ θεός
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 신
  lexicon: Θεός
  rationale: 프로테스탄트 표준 용례에 따라 Θεός는 ‘하나님’으로 옮겼습니다.
- source_word: τὰ δικαιώματά μου
  english_pob_choice: my statutes
  chosen_korean: 내 율례들
  alternatives_korean:
  - 내 규례들
  - 내 의로운 요구들
  lexicon: δικαίωμα
  rationale: POB의 ‘statutes’를 따라 δικαιώματα를 법적-계약적 규범인 ‘율례들’로 옮겼고, 문맥상 다수형을 살렸습니다.
- source_word: ἀναλαμβάνεις τὴν διαθήκην μου ἐπὶ στόματός σου
  english_pob_choice: take up my covenant on your lips
  chosen_korean: 내 언약을 네 입술에 올려놓느냐
  alternatives_korean:
  - 내 언약을 네 입에 두느냐
  - 내 언약을 네 입에 담느냐
  lexicon: διαθήκη, στόμα
  rationale: στόμα를 직역하면 ‘입’이지만, POB의 ‘on your lips’를 반영해 구어적이면서도 문어적인 ‘입술’로 옮겨 수사적 표현을 살렸습니다.
theological_decisions:
- issue: 악한 자에 대한 하나님의 발화 방식
  chosen_reading: 본문은 하나님이 ‘악한 자’에게 직접 책망하시는 인용으로 읽고, 인용부호 안에서 직접 발화를 유지했습니다.
  alternative_readings:
  - 성경 기자의 일반적 진술로 완화하는 읽기
  rationale: 헬라어 인용 공식이 하나님의 직접 발화를 전제하므로, 수사적 긴장과 권위를 약화시키지 않도록 직접 인용 구조를 유지했습니다.
  doctrine_reference: 성경의 인용 권위와 신적 발화의 직접성
