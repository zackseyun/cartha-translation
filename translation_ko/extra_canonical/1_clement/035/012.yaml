id: 1CLEM.35.12
reference: 1 Clement 35:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: θυσία αἰνέσεως δοξάσει με, καὶ ἐκεῖ ὁδός, ἣν δείξω αὐτῷ τὸ σωτήριον τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/012.yaml
  text: A sacrifice of praise will glorify me, and there is the way by which I will show him the salvation of God.”
translation:
  language: ko
  text: 찬양의 제사가 나를 영화롭게 할 것입니다. 그리고 그곳에는 내가 그에게 하나님의 구원을 보여 줄 길이 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία αἰνέσεως
  english_pob_choice: A sacrifice of praise
  chosen_korean: 찬양의 제사
  alternatives_korean:
  - 찬송의 제사
  - 찬미의 제사
  lexicon: θυσία; αἴνεσις
  rationale: θυσία의 제사성을 분명히 살리면서 αἴνεσις는 시편적 예배 표현에 맞게 ‘찬양’으로 옮겼습니다.
- source_word: δοξάσει με
  english_pob_choice: will glorify me
  chosen_korean: 나를 영화롭게 할 것입니다
  alternatives_korean:
  - 나를 영광스럽게 할 것입니다
  - 나를 찬양할 것입니다
  lexicon: δοξάζω
  rationale: 도ξάζω의 결과를 ‘영화롭게 하다’로 직역에 가깝게 유지하여, 하나님께 돌려지는 영광의 의미를 보존했습니다.
- source_word: ἐκεῖ ὁδός
  english_pob_choice: there is the way
  chosen_korean: 거기에 … 길이 있습니다
  alternatives_korean:
  - 거기에 길이 있습니다
  - 그곳에 길이 있습니다
  lexicon: ὁδός
  rationale: 직역상 ‘길’이지만, 문맥상 뒤의 ‘보여 주다’와 연결되도록 존재를 드러내는 자연스러운 한국어로 정리했습니다.
- source_word: τὸ σωτήριον τοῦ θεοῦ
  english_pob_choice: the salvation of God
  chosen_korean: 하나님의 구원
  alternatives_korean:
  - 하나님께서 주시는 구원
  - 하나님의 구원의 길
  lexicon: σωτήριον; θεός
  rationale: σωτήριον을 명사적으로 ‘구원’으로 옮기고, 소유격 τοῦ θεοῦ는 표준적인 ‘하나님의’로 처리했습니다.
theological_decisions:
- issue: 인용문의 1인칭 발화 유지
  chosen_reading: ‘나를 영화롭게 할 것입니다’와 ‘내가 그에게 … 보여 줄’의 1인칭을 그대로 보존했습니다.
  alternative_readings:
  - 서술형으로 완화하여 표현하기
  rationale: 원문이 하나님의 직접 발화로 되어 있으므로, 화자의 직접성을 약화하지 않고 유지했습니다.
  doctrine_reference: 신적 발화의 직접성
- issue: ‘하나님의 구원’의 소유격 의미
  chosen_reading: 구원을 하나님께 속한 것으로 옮겨, 출처와 주체를 함께 드러냈습니다.
  alternative_readings:
  - 하나님에 대한 구원
  - 하나님이 주시는 구원
  rationale: 문맥상 구원은 하나님에게서 나오는 구원이며, 본문 자체가 그 출처를 강조합니다.
  doctrine_reference: 구원의 신적 기원
