id: 1CLEM.35.9
reference: 1 Clement 35:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα ἐποίήσας, καὶ ἐσίγησα· ὑπέλαβες, ἄνομε, ὅτι ἔσομαι ὅμοιος σοι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/009.yaml
  text: These things you did, and I kept silent; you supposed, lawless one, that I would be like you.
translation:
  language: ko
  text: 이러한 일들을 행하시고도 저는 잠잠하셨는데, 불법한 자여, 네가 나와 같을 것이라고 생각하였도다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ἐποίησας
  english_pob_choice: These things you did
  chosen_korean: 이러한 일들을 행하시고도
  alternatives_korean:
  - 이것들을 행하셨고
  - 이런 일들을 하셨고
  lexicon: ταῦτα; ποιέω
  rationale: 원문의 지시대명사와 행위 완료를 살려 '이러한 일들'과 '행하시고도'로 옮겨, 앞선 행위가 현재 절의 대조를 여는 흐름을 드러냈습니다.
- source_word: καὶ ἐσίγησα
  english_pob_choice: and I kept silent
  chosen_korean: 저는 잠잠하셨는데
  alternatives_korean:
  - 내가 침묵하였는데
  - 그리고 나는 잠잠했습니다
  lexicon: σιγάω
  rationale: σιγάω의 '침묵하다'를 문어적으로 '잠잠하다'로 옮기되, 앞뒤 문맥상 화자 자신을 가리키는 1인칭을 유지했습니다.
- source_word: ἄνομε
  english_pob_choice: lawless one
  chosen_korean: 불법한 자여
  alternatives_korean:
  - 무법한 자여
  - 악한 자여
  lexicon: ἄνομος
  rationale: ἄνομος의 법/율법에 대한 위반성을 살려 '불법한 자'로 직역적이면서도 호격 어감이 살아나게 했습니다.
- source_word: ἔσομαι ὅμοιος σοι
  english_pob_choice: I would be like you
  chosen_korean: 네가 나와 같을 것이라고 생각하였도다
  alternatives_korean:
  - 내가 너와 같아질 것이라고 생각하였도다
  - 내가 너처럼 될 것이라 여겼도다
  lexicon: ἔσομαι; ὅμοιος
  rationale: 원문의 직유 비교를 '나와 같을 것'으로 보존하고, ὑπέλαβες의 추측 의미를 '생각하였도다'로 반영했습니다.
theological_decisions:
- issue: 화자의 자기 동일성보다 상대의 오판을 드러내는 구문 처리
  chosen_reading: '''네가 나와 같을 것이라고 생각하였도다''로 옮겨, 하나님/발화자의 침묵을 허용으로 오해한 상대의 판단을 강조했습니다.'
  alternative_readings:
  - '''내가 너와 같을 것이라고 생각하였도다'''
  - '''내가 너처럼 될 것이라 여겼도다'''
  rationale: 원문은 화자가 아니라 상대가 '내가 같을 것이다'라고 추측한 오판을 말하므로, 주체-객체 관계를 한국어에서 분명히 해야 합니다.
  doctrine_reference: 시 50:21의 인용/재현 맥락에서 하나님의 침묵을 승인으로 오해하는 인간의 왜곡된 인식
