  terminology: ‘불멸’, ‘의’, ‘광채’, ‘담대함’, ‘믿음’, ‘확신’, ‘절제’, ‘거룩함’은 이 문맥에서 무난합니다. ἁγιασμός의 넓은 의미를 ‘거룩함’으로 유지했습니다.
