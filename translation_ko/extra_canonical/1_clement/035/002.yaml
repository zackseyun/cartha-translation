language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ζωὴ ἐν ἀθανασίᾳ, λαμπρότης ἐν δικαιοσύνῃ, ἀλήθεια ἐν παρρησίᾳ, πίστις ἐν πεποιθήσει, ἐγκράτεια ἐν ἁγιασμῷ· καὶ ταῦτα ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/002.yaml
  text: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness; and all these things fall under our understanding.
translation:
  language: ko
  text: 불멸 안에 생명이 있고, 의 안에 광채가 있으며, 담대함 안에 진리가 있고, 확신 안에 믿음이 있으며, 거룩함 안에 절제가 있습니다. 이 모든 것이 우리의 생각에 떠올랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴ ἐν ἀθανασίᾳ
  english_pob_choice: life in immortality
  chosen_korean: 생명은 불멸 안에 있고
  alternatives_korean:
  - 생명이 불멸 안에 있고
  - 생명은 불멸 가운데 있고
  lexicon: ζωή / ἀθανασία
  rationale: ἐν + dative의 관계를 직역하되, 자연스러운 한국어 병렬 구조를 위해 ‘안에 있다’로 옮겼습니다. ἀθανασία는 ‘영생’보다 본문의 추상명사 대비를 살리는 ‘불멸’이 더 직접적입니다.
- source_word: λαμπρότης ἐν δικαιοσύνῃ
  english_pob_choice: splendor in righteousness
  chosen_korean: 광채는 의 안에 있으며
  alternatives_korean:
  - 찬란함은 의 안에 있으며
  - 영광은 의 안에 있으며
  lexicon: λαμπρότης / δικαιοσύνη
  rationale: λαμπρότης는 ‘영광’보다 빛의 성격을 드러내는 ‘광채’가 더 가깝고, δικαιοσύνη는 본문 어휘상 ‘의’로 유지했습니다.
- source_word: ἀλήθεια ἐν παρρησίᾳ
  english_pob_choice: truth in boldness
  chosen_korean: 진리는 담대함 안에 있고
  alternatives_korean:
  - 진리는 담대함 가운데 있고
  - 진리는 확언 안에 있고
  lexicon: ἀλήθεια / παρρησία
  rationale: παρρησία를 단순한 ‘대담함’보다 공개적이고 두려움 없는 태도를 가리키는 ‘담대함’으로 옮겼습니다.
- source_word: πίστις ἐν πεποιθήσει
  english_pob_choice: faith in confidence
  chosen_korean: 믿음은 확신 안에 있으며
  alternatives_korean:
  - 믿음은 신뢰 안에 있으며
  - 믿음은 확신 가운데 있으며
  lexicon: πίστις / πεποίθησις
  rationale: πίστις는 프로젝트 기본어인 ‘믿음’을 유지하고, πεποίθησις는 결과적 의미를 살려 ‘확신’으로 옮겼습니다.
- source_word: ἐγκράτεια ἐν ἁγιασμῷ
  english_pob_choice: self-control in holiness
  chosen_korean: 절제는 거룩함 안에 있으며
  alternatives_korean:
  - 자제는 거룩함 안에 있으며
  - 절제는 성결 안에 있으며
  lexicon: ἐγκράτεια / ἁγιασμός
  rationale: ἐγκράτεια는 윤리적 절제의 표준어인 ‘절제’가 적절하고, ἁγιασμός는 과정/상태를 모두 포괄할 수 있는 ‘거룩함’이 무난합니다.
- source_word: ὑπέπεπτεν πάντα τῇ διανοίᾳ ἡμῶν
  english_pob_choice: and all these things fall under our understanding
  chosen_korean: 그리고 이 모든 것은 우리의 이해 아래 놓여 있습니다.
  alternatives_korean:
  - 그리고 이 모든 것은 우리의 이해에 속합니다.
  - 그리고 이 모든 것은 우리의 이해 아래 있습니다.
  lexicon: ὑπέπεπτεν / διανοία
  rationale: ὑπέπεπτεν의 ‘아래 놓이다’라는 하강/종속 이미지를 살리면서, διανοία는 ‘이해’로 옮겨 인지적 범위를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 문장 말미의 관계 표현(under our understanding)
  chosen_reading: ‘우리의 이해 아래 놓여 있습니다’로 직역해 목록 전체가 인지 아래 포괄된다는 의미를 유지했습니다.
  alternative_readings:
  - ‘우리의 이해에 속합니다’
  - ‘우리의 이해로 파악됩니다’
  rationale: 원문 ὑπέπεπτεν의 종속성을 약화시키는 해석적 확장보다, 목록이 이해의 범주 아래 놓인다는 이미지를 보존하는 편이 더 원문에 충실합니다.
  doctrine_reference: source-driven lexical fidelity
