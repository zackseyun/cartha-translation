id: 1CLEM.35.8
reference: 1 Clement 35:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ δὲ ἐμίσησας παιδείαν καὶ ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω. εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ, καὶ μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις. τὸ στόμα σου ἐπλεόνασεν κακίαν, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα. καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις, καὶ κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035/008.yaml
  text: Yet you hated discipline[a], and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with adulterers. Your mouth overflowed with evil, and your tongue was weaving deceit. Sitting, you were slandering your brother[b], and against your mother's son you were laying a stumbling block.
  footnotes:
  - marker: a
    text: Or 'adulterers'.
    reason: previous_rendering
  - marker: b
    text: Or 'kept weaving deceit. Sitting down, you were slandering your brother, and against the son of your mother you were laying'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 당신은 훈계를 미워하고 내 말을 뒤로 던져 버렸습니다. 당신이 도둑을 보았을 때는 그와 함께 달려갔고, 간음하는 자와 당신의 몫을 함께 두었습니다. 당신의 입은 악으로 넘쳤고, 당신의 혀는 속임수를 엮고 있었습니다. 앉아서 당신은 형제를 헐뜯었고, 어머니의 아들에게는 걸림돌을 놓았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείαν
  english_pob_choice: discipline
  chosen_korean: 훈계
  alternatives_korean:
  - 징계
  - 교훈
  - 훈련
  lexicon: παιδεία
  rationale: 여기서는 단순한 교육보다 책망과 교정의 성격이 강하므로, POB의 "discipline"을 한국어로는 문맥상 가장 직접적인 "훈계"로 옮겼습니다.
- source_word: ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω
  english_pob_choice: cast my words behind you
  chosen_korean: 내 말을 뒤로 던져 버렸습니다
  alternatives_korean:
  - 내 말을 뒤로 내버렸습니다
  - 내 말을 등 뒤로 밀어 놓았습니다
  lexicon: ἐκβάλλω + εἰς τὰ ὀπίσω
  rationale: 원문의 동작성(버리다/내팽개치다)과 방향성(뒤로)을 살리기 위해 직역보다 강한 동사구를 택했습니다.
- source_word: μετὰ μοιχοῦ τὴν μερίδα σου ἐτίθεις
  english_pob_choice: you placed your share with adulterers
  chosen_korean: 간음하는 자와 당신의 몫을 함께 두었습니다
  alternatives_korean:
  - 간음하는 자들과 당신의 몫을 함께 두었습니다
  - 간음하는 자와 함께 당신의 몫을 두었습니다
  lexicon: μοιχός / μερίς
  rationale: 그리스어 μοιχοῦ는 단수 속격이지만, 한국어에서는 범주적 일반성을 살려 단수의 대표형으로 옮길 수 있어 문맥상 자연스러운 "간음하는 자"를 선택했습니다. "몫"은 μερίδα의 분깃/배분의 의미를 반영했습니다.
- source_word: καθημένος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις
  english_pob_choice: Sitting, you were slandering your brother
  chosen_korean: 앉아서 당신은 형제를 헐뜯었고
  alternatives_korean:
  - 앉아 있으면서 당신은 형제를 비방했고
  - 앉은 채 당신은 형제를 헐뜯었고
  lexicon: καθήμενος / καταλαλέω
  rationale: καθήμενος는 상태를 나타내는 분사이므로 "앉아서"로 옮기고, κατελάλεις는 공공연히 비난하는 뉘앙스를 살려 "헐뜯다"를 택했습니다.
- source_word: κατὰ τοῦ υἱοῦ τῆς μητρός σου
  english_pob_choice: against your mother's son
  chosen_korean: 어머니의 아들
  alternatives_korean:
  - 당신의 어머니의 아들
  - 어머니의 아들
  lexicon: υἱὸς τῆς μητρός σου
  rationale: POB의 문맥처럼 자연스러운 친족표현을 유지하되, 직역성을 해치지 않도록 "어머니의 아들"로 남겼습니다.
theological_decisions:
- issue: 이 구절의 죄 목록을 한국어에서 어떻게 누적적으로 드러낼지
  chosen_reading: 한 절 안에서 비난의 누적과 진행성을 살리기 위해 과거 완료형보다 연속된 완료·과정 표현을 사용했습니다.
  alternative_readings:
  - 단순 과거로 평면화하는 번역
  - 더 문학적인 압축 번역
  rationale: 원문은 일련의 불순종과 악행을 연속적으로 열거하므로, 한국어에서도 그 축적감을 유지하는 것이 수사와 경고의 힘을 보존합니다.
  doctrine_reference: 시편적 책망/예언적 고발의 수사 보존
- issue: μοιχοῦ의 해석을 단수 일반형으로 둘지 복수로 넓힐지
  chosen_reading: 한국어 본문에서는 대표 단수형 "간음하는 자"를 사용하되, 필요시 주석 없이도 일반 범주로 읽히게 했습니다.
  alternative_readings:
  - 간음하는 자들과
  - 간음자들
  rationale: 그리스어 형태는 단수 속격이지만 한국어에서는 범주적 단수로 자연스럽게 기능할 수 있어, 문법과 문체를 함께 만족하는 번역을 선택했습니다.
  doctrine_reference: 원문 형태 보존과 자연스러운 범주적 단수
