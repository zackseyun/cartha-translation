id: 1CLEM.33.6
reference: 1 Clement 33:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οὖν πάντα τελειώσας ἐπῄνεσεν αὐτὰ καὶ ηὐλόγησεν καὶ εἶπεν· Αὐξάνεσθε καὶ πληθύνεσθε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/006.yaml
  text: So then, having completed all these things, he praised them and blessed them and said, “Be fruitful and multiply.”
translation:
  language: ko
  text: 그러므로 그는 이 모든 것을 완성하신 뒤에 그들을 칭찬하고 복을 빌어 주며 말씀하셨습니다. 「생육하고 번성하십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα οὖν πάντα τελειώσας
  english_pob_choice: having completed all these things
  chosen_korean: 이 모든 것을 완성하신 뒤에
  alternatives_korean:
  - 이 모든 일을 마치고
  - 이 모든 것을 끝마친 뒤에
  lexicon: τελειόω
  rationale: τελειώσας는 단순한 종료보다 ‘완성하다/마치다’의 의미가 있어, POB의 수정 방향에 맞춰 ‘완성하신 뒤에’로 옮겼습니다.
- source_word: ἐπῄνεσεν αὐτὰ
  english_pob_choice: he praised them
  chosen_korean: 그들을 칭찬하고
  alternatives_korean:
  - 그들을 찬양하고
  - 그것들을 칭찬하고
  lexicon: ἐπαινέω
  rationale: ἐπῄνεσεν은 일반적인 ‘칭찬하다’가 가장 자연스럽고, 대상은 직전의 복수 목적어를 받아 ‘그들’로 표현했습니다.
- source_word: ηὐλόγησεν
  english_pob_choice: blessed
  chosen_korean: 복을 빌어 주며
  alternatives_korean:
  - 축복하고
  - 축복해 주며
  lexicon: εὐλογέω
  rationale: εὐλογέω는 단순 선언보다 복을 빌어 주는 행위를 드러내므로, 한국어에서 의미를 분명히 하는 표현을 택했습니다.
- source_word: Αὐξάνεσθε καὶ πληθύνεσθε
  english_pob_choice: Be fruitful and multiply
  chosen_korean: 생육하고 번성하십시오
  alternatives_korean:
  - 번성하고 번식하십시오
  - 열매 맺고 많아지십시오
  lexicon: LXX formula; Gen 1:22, 28
  rationale: 이 표현은 창세기의 정형구를 직접 반영하므로, POB의 ‘Be fruitful and multiply’에 맞춰 표준적이면서 원전 친화적인 한국어로 옮겼습니다.
theological_decisions:
- issue: 창세기 정형축복구의 인용/반향을 어떻게 살릴 것인가
  chosen_reading: 「생육하고 번성하십시오」로 번역해 창세기 1장과 9장의 축복 공식을 즉시 알아볼 수 있게 했습니다.
  alternative_readings:
  - ‘생육하고 번성하라’의 명령형을 직설적으로 옮김
  - ‘열매 맺고 번성하십시오’처럼 의미 번역을 강화
  rationale: 이 문구는 단순한 일반 축원이 아니라 창조-언약의 축복 공식을 재현하므로, 한국어 독자가 성경적 반향을 인지하도록 정형구를 유지하는 것이 중요합니다.
  doctrine_reference: 창 1:22, 28; 9:1
