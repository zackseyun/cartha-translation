id: 1CLEM.33.3
reference: 1 Clement 33:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/003.yaml
  text: For by his exceedingly great might he established the heavens[a], and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power.
  footnotes:
  - marker: a
    text: Or 'he enclosed it'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 그분의 지극히 크신 능력으로 하늘들을 세우시고[a], 그분의 헤아릴 수 없는 지혜로 그것들을 질서 있게 정하셨기 때문입니다. 또한 그분은 땅을 그것을 둘러싼 물에서 갈라 내시고, 자기 뜻의 견고한 기초 위에 세우셨습니다. 그리고 그 위를 다니는 살아 있는 피조물들이 그분 자신의 질서에 따라 존재하도록 명하셨습니다. 바다와 그 안의 살아 있는 피조물들을 미리 마련하신 뒤, 자신의 능력으로 그것을 가두셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것들을 가두셨습니다.”
    reason: 영어 POB 감사 기록의 대안 번역을 해당 하늘들의 정립/배치 구절에 정확히 연결했습니다.
lexical_decisions:
- source_word: παμμεγεθεστάτῳ αὐτοῦ κράτει
  english_pob_choice: his exceedingly great might
  chosen_korean: 그분의 지극히 크신 능력
  alternatives_korean:
  - 그분의 매우 큰 능력
  - 그분의 지극히 عظ대한 힘
  lexicon: κράτος
  rationale: κράτος의 권능·능력을 살려, 자연스러운 한국어에서 ‘능력’으로 옮기되 παμμεγεθεστάτῳ의 최상급 강조는 ‘지극히’로 반영했습니다.
- source_word: ἀκαταλήπτῳ αὐτοῦ συνέσει
  english_pob_choice: his incomprehensible understanding
  chosen_korean: 그분의 헤아릴 수 없는 지혜
  alternatives_korean:
  - 그분의 알 수 없는 이해
  - 그분의 파악할 수 없는 총명
  lexicon: σύνεσις
  rationale: σύνεσις는 단순 지적 이해보다 분별·지혜의 뉘앙스가 있어, 문맥상 창조 질서를 세우는 능력을 살리는 ‘지혜’로 옮겼습니다.
- source_word: ἐνέκλεισεν
  english_pob_choice: he enclosed it
  chosen_korean: 그것을 가두셨습니다
  alternatives_korean:
  - 그것을 둘러막으셨습니다
  - 그것을 둘러싸셨습니다
  lexicon: ἐνκλείω
  rationale: 마지막 절은 바다의 경계를 정하시는 뜻을 드러내므로, 단순한 ‘둘러싸다’보다 경계 설정을 보여 주는 ‘가두다’가 원문의 동작을 더 직접적으로 반영합니다.
- source_word: ὕδατος / θάλασσαν
  english_pob_choice: the water ... the sea
  chosen_korean: 물 / 바다
  alternatives_korean:
  - 물결 / 대양
  - 물 / 바닷물
  lexicon: ὕδωρ
  rationale: 앞부분의 ὕδωρ는 땅을 둘러싼 물로, 뒤의 θάλασσα는 질서가 부여된 바다로 구분해 옮겼습니다.
theological_decisions:
- issue: 하늘들을 세우고 그것들을 질서 있게 둔 창조 묘사의 병렬성
  chosen_reading: ‘하늘들을 세우시고 … 그것들을 질서 있게 두셨습니다’로 병렬을 유지해 창조 행위의 두 측면을 모두 드러냈습니다.
  alternative_readings:
  - ‘하늘을 세우셨습니다’로 단순화
  - ‘하늘들을 정하셨습니다’로 통합
  rationale: Greek text와 English audit trail 모두 ‘established’와 ‘ordered them’을 구분하므로, 한국어에서도 창조와 질서를 별도로 보여 주는 구성이 필요합니다.
  doctrine_reference: 창조론 일반; 시적 병렬 보존
