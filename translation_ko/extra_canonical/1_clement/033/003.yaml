    rationale: ἐκέλευσεν εἶναι는 하나님이 피조물들에게 존재하도록 명하셨다는 뜻입니다. ‘그분 자신의 질서에 따라 존재하도록 명하셨습니다’가 구문과 의미를 더 충실히 전달합니다.
