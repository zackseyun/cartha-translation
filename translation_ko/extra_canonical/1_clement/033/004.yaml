id: 1CLEM.33.4
reference: 1 Clement 33:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πᾶσι τὸ ἐξοχώτατον καὶ παμμέγεθες κατὰ διάνοιαν, ἄνθρωπον, ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν ἔπλασεν τῆς ἑαυτοῦ εἰκόνος χαρακτῆρα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/004.yaml
  text: Above all[a], with his holy and undefiled hands he formed man, the most excellent and exceedingly great work according to his mind, as the imprint of his own image.
  footnotes:
  - marker: a
    text: Or 'the most excellent and truly great being in understanding'.
    reason: previous_rendering
translation:
  language: ko
  text: 무엇보다도 그분은 거룩하고 더럽혀지지 않은 손으로, 그분의 마음에 따라 가장 뛰어나고 지극히 큰 작품, 곧 그분 자신의 형상의 새김인 사람을 지으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리 옮기면, ‘이해력 면에서 가장 뛰어나고 참으로 위대한 존재’입니다.
    reason: κατὰ διάνοιαν의 수식 범위는 논의될 수 있습니다. 본문은 문맥과 영어 POB 감사 기록을 따라 창조주의 마음에 따른 창조 작품으로 옮기되, 이전의 사람의 이해력에 연결하는 해석 가능성을 각주에 보존합니다.
lexical_decisions:
- source_word: ἐπὶ πᾶσι
  english_pob_choice: Above all
  chosen_korean: 무엇보다도
  alternatives_korean:
  - 가장 먼저
  - 무엇보다
  lexicon: source_note
  rationale: 우선순위 강조를 자연스럽게 살리되, 문두의 수사적 전환을 한국어로 과도하게 풀지 않기 위해 간결하게 옮겼습니다.
- source_word: ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν
  english_pob_choice: with his holy and undefiled hands
  chosen_korean: 거룩하고 더럽혀지지 않은 손으로
  alternatives_korean:
  - 거룩하고 흠 없는 손으로
  - 거룩하고 부정하지 않은 손으로
  lexicon: source_note
  rationale: ἱεραῖς는 ‘거룩한’, ἀμιάντοις는 ‘더럽혀지지 않은/흠 없는’ 의미를 살려, 손의 순결성과 성별됨을 함께 드러냈습니다.
- source_word: τὸ ἐξοχώτατον καὶ παμμέγεθες κατὰ διάνοιαν
  english_pob_choice: the most excellent and exceedingly great work according to his mind
  chosen_korean: 가장 뛰어나고 매우 큰 작품이었으며, 그분의 마음에 따른
  alternatives_korean:
  - 가장 탁월하고 지극히 큰 작품이었으며, 그분의 생각에 따른
  - 가장 뛰어나고 엄청나게 큰 작품이었으며, 그분의 지성에 따른
  lexicon: source_note
  rationale: τὸ ἐξοχώτατον καὶ παμμέγεθες를 사람 자체의 가치보다 하나님의 창조 행위가 빚은 ‘작품’으로 이해한 영어 전승을 반영했고, κατὰ διάνοιαν은 ‘마음에 따른’으로 직역과 가독성의 균형을 맞췄습니다.
- source_word: τῆς ἑαυτοῦ εἰκόνος χαρακτῆρα
  english_pob_choice: as the imprint of his own image
  chosen_korean: 그분 자신의 형상의 새김입니다
  alternatives_korean:
  - 그분 자신의 형상의 인장입니다
  - 그분 자신의 형상의 흔적입니다
  lexicon: source_note
  rationale: χαρακτήρ의 ‘새긴 표상/각인’ 의미를 살려 ‘새김’으로 옮겨, 인간이 하나님의 형상을 반영하는 존재라는 이미지성을 유지했습니다.
theological_decisions:
- issue: 사람을 형상의 ‘새김’으로 묘사하는 표현의 범위
  chosen_reading: 인간을 하나님 형상의 직접적 ‘인장/표식’이 아니라 그 형상이 ‘새겨진’ 존재로 읽어, 창조론적 존엄과 수동성을 함께 유지했습니다.
  alternative_readings:
  - ‘인장’으로 번역해 더 정적이고 결과물적인 뉘앙스를 주는 읽기
  - ‘흔적’으로 번역해 더 약하게 만드는 읽기
  rationale: 본문의 χαρακτήρ는 단순 유사성이 아니라 새겨진 표지를 가리키므로, 지나치게 약화하거나 추상화하지 않으면서도 원문의 형상 언어를 보존했습니다.
  doctrine_reference: 창조론, 하나님의 형상
