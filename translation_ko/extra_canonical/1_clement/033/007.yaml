  source_fidelity: 원문의 권유법 ἴδωμεν은 ‘우리가 보아야 할 것은 …입니다’보다 ‘살펴봅시다’와 같이 직접적인 공동 권면으로 옮기는 편이 충실합니다. δεύτε 절의 αὐτὸς δὲ는 ‘주님 자신도’로 보존했으며, aorist 분사 κοσμήσας는 주님의 단장이 기쁨에 앞서는 완료된 행위임을 나타내므로 ‘단장하신 뒤’로 반영했습니다.
  naturalness: 초안은 문법적으로 가능하지만 ‘우리가 보아야 할 것은 … 것입니다’가 원문의 간결한 권면을 명사절 설명문으로 바꾸어 다소 무겁습니다. ‘…했음을 살펴봅시다’가 현대 표준어 합쇼체에서 자연스럽고 직접적입니다.
  terminology: ‘의인’, ‘주님’, ‘선한 일들’, ‘단장’은 문맥과 원문의 비유를 적절히 반영합니다. ‘주님 자신도’는 αὐτὸς δὲ의 강조와 첨가를 과장하지 않고 전달합니다.
