id: 1CLEM.33.7
reference: 1 Clement 33:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, ὅτι ἐν ἔργοις ἀγαθοῖς πάντες ἐκοσμήθησαν οἱ δίκαιοι, καὶ αὐτὸς δὲ ὁ κύριος ἔργοις ἀγαθοῖς ἑαυτὸν κοσμήσας ἐχάρη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/007.yaml
  text: Let us see that all the righteous were adorned with good works[a], and that the Lord himself also, having adorned himself with good works[b], rejoiced.
  footnotes:
  - marker: a
    text: Or 'Let us see, then, that'.
    reason: previous_rendering
  - marker: b
    text: Or 'and that the Lord himself, adorning himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리가 보아야 할 것은, 모든 의인들이 선한 일들로 단장되었다는 것과, 주님 자신도 또한 선한 일들로 자신을 단장하시고 기뻐하셨다는 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  english_pob_choice: Let us see that
  chosen_korean: 우리가 보아야 할 것은
  alternatives_korean:
  - 우리가 보아야 합니다
  - 우리가 살펴볼 것은
  lexicon: ἰδέω
  rationale: 여기서는 권유형 접속사 없는 권면적 관찰로 읽히므로, 단순한 정보 전달보다 공동의 주의를 촉구하는 한국어로 옮겼습니다.
- source_word: ἐν ἔργοις ἀγαθοῖς
  english_pob_choice: with good works
  chosen_korean: 선한 일들로
  alternatives_korean:
  - 좋은 행위로
  - 선행으로
  lexicon: ἔργον / ἀγαθός
  rationale: 직역의 ‘선한 일들’은 원문의 복수성과 행위의 성격을 살리며, 한국어에서는 도구격으로 자연스럽게 단장 수단을 나타냈습니다.
- source_word: ἐκοσμήθησαν / κοσμήσας
  english_pob_choice: were adorned / having adorned himself
  chosen_korean: 단장되었다 / 자신을 단장하시고
  alternatives_korean:
  - 꾸며졌다 / 자신을 꾸미시고
  - 장식되었다 / 장식하시고
  lexicon: κοσμέω
  rationale: κοσμέω의 핵심 이미지는 외형적 꾸밈보다 ‘단장’에 더 가깝고, 수동형과 분사형의 연결도 한국어에서 ‘단장되었다… 단장하시고’로 유지했습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: κύριος
  rationale: 문맥상 그리스도에 대한 호칭으로 읽히므로, 한국어 경건 문체에서 자연스러운 ‘주님’을 사용했습니다.
theological_decisions:
- issue: 의인과 주님의 ‘선한 일들로 단장됨’의 관계
  chosen_reading: 의인들의 모습은 주님의 자기 단장과 대비가 아니라, 그분을 따르는 모범으로 제시됩니다.
  alternative_readings:
  - 단순한 윤리 교훈으로 축소
  - 의복 이미지로만 제한
  rationale: 문장은 단장 이미지를 통해 의인들의 삶과 주님의 본을 연결하므로, 도덕적 장식이 아니라 실천적 모범성과 영예의 이미지를 함께 살렸습니다.
  doctrine_reference: 성화와 그리스도의 본받음
