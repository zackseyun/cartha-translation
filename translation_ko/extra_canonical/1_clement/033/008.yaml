source:
  edition: Funk 1901 (normalized OCR)
  text: ἔχοντες οὖν τοῦτον τὸν ὑπογραμμὸν ἀόκνως προσέλθωμεν τῷ θελήματι αὐτοῦ· ἐξ ὅλης τῆς ἰσχύος ἡμῶν ἐργασώμεθα ἔργον δικαιοσύνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/008.yaml
  text: Having[a], then, this pattern, let us draw near to his will without hesitation. With all our strength let us do the work of righteousness.
  footnotes:
  - marker: a
    text: Or 'come eagerly to his will'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이 본을 지니고, 그분의 뜻을 향해 주저함 없이 나아갑시다. 우리의 모든 힘을 다해 의의 일을 합시다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχοντες οὖν τοῦτον τὸν ὑπογραμμὸν
  english_pob_choice: Having, then, this pattern
  chosen_korean: 그러므로 이 본을 가지고
  alternatives_korean:
  - 그러므로 이 모범을 가지고
  - 그러므로 이 표본을 가지고
  lexicon: ὑπογραμμός
  rationale: ὑπογραμμός는 글을 따라 쓰게 하는 ‘본/모범’의 뜻이므로, 한국어로는 문맥상 자연한 ‘본’을 택했습니다.
- source_word: προσέλθωμεν τῷ θελήματι αὐτοῦ
  english_pob_choice: let us draw near to his will
  chosen_korean: 그의 뜻에 … 나아갑시다
  alternatives_korean:
  - 그의 뜻으로 다가갑시다
  - 그의 뜻에 접근합시다
  lexicon: προσέρχομαι + θέλημα
  rationale: προσέρχομαι는 단순한 ‘접근’보다 목표를 향해 ‘나아가다/다가가다’가 자연스러워, 추상명사 ‘뜻’에는 ‘나아갑시다’가 가장 직접적입니다.
- source_word: ἀόκνως
  english_pob_choice: without hesitation
  chosen_korean: 주저함 없이
  alternatives_korean:
  - 머뭇거림 없이
  - 망설임 없이
  lexicon: ἀόκνως
  rationale: ἀόκνως는 ‘게으르게’보다 ‘주저함/망설임 없이, 지체하지 않고’의 뜻이므로, 동작의 태도를 살리는 ‘주저함 없이’를 선택했습니다.
- source_word: ἐργασώμεθα ἔργον δικαιοσύνης
  english_pob_choice: let us do the work of righteousness
  chosen_korean: 의의 일을 합시다
  alternatives_korean:
  - 의의 일을 하합시다
  - 의의 사역을 합시다
  lexicon: ἔργον δικαιοσύνης
  rationale: 직역적 중복인 ‘일을 하다/일을 행하다’를 한국어에서 자연스럽게 풀어 ‘의의 일’을 유지하되, ‘righteousness’는 본문 의미를 따라 ‘의’로 옮겼습니다.
theological_decisions:
- issue: 직접 청유의 어조
  chosen_reading: “나아갑시다”, “합시다”로 공동체적 권면의 청유를 유지했습니다.
  alternative_readings:
  - “나아가야 합니다”처럼 서술형 권고로 완화
  - “나아갑시다” 대신 더 중립적인 표현 사용
  rationale: 본문의 1인칭 복수 청유(προσέλθωμεν, ἐργασώμεθα)는 단순 설명이 아니라 공동체를 함께 행동으로 부르는 권면이므로, 합쇼체 청유로 살렸습니다.
  doctrine_reference: 공동체 권면의 수사와 명령/권면형 청유 유지
