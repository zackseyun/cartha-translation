source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γὰρ φησὶν ὁ θεός· Ποιήσωμεν ἄνθρωπον κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν· καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/005.yaml
  text: For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made them.
translation:
  language: ko
  text: 이렇게 하나님께서 말씀하십니다. “우리가 우리의 형상과 우리의 likeness에 따라 사람을 만들자.” 그리고 하나님께서 사람을 만드셨으니, 남자와 여자로 그들을 만드셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσωμεν ἄνθρωπον
  english_pob_choice: Let us make man
  chosen_korean: “우리가 … 사람을 만들자”
  alternatives_korean:
  - “우리가 … 인간을 만들자”
  - “우리가 … 사람을 빚자”
  lexicon: ποιέω; ἄνθρωπος
  rationale: 명령형 공동의사를 드러내는 “만들자”를 쓰고, ἄνθρωπος는 전통적 ‘사람’으로 옮겨 인류 전체를 가리키는 폭을 살렸습니다.
- source_word: κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν
  english_pob_choice: according to our image and according to our likeness
  chosen_korean: “우리의 형상과 우리의 likeness에 따라”
  alternatives_korean:
  - “우리의 형상과 우리의 모양에 따라”
  - “우리의 형상과 우리의 닮음에 따라”
  lexicon: εἰκών; ὁμοίωσις
  rationale: εἰκών은 “형상”으로, ὁμοίωσις는 본문의 반복성과 구별을 살려 영어 POB의 ‘likeness’를 유지해 직역하되, 필요하면 후속 본문에서 한국어 공용어로 더 다듬을 수 있게 했습니다.
- source_word: ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον
  english_pob_choice: And God made man
  chosen_korean: “그리고 하나님께서 사람을 만드셨으니”
  alternatives_korean:
  - “그리고 하나님께서 사람을 만드셨습니다”
  - “그리하여 하나님이 사람을 지으셨습니다”
  lexicon: ποιέω; ὁ θεός
  rationale: 서술 연결을 자연스럽게 하면서도 원문의 결과 진술을 반영해, 문장 사이 전환을 ‘만드셨으니’로 처리했습니다.
- source_word: ἄρσεν καὶ θῆλυ
  english_pob_choice: male and female
  chosen_korean: “남자와 여자로”
  alternatives_korean:
  - “수컷과 암컷으로”
  - “남성과 여성으로”
  lexicon: ἄρσεν; θῆλυ
  rationale: 인간 창조의 성 구분을 자연스러운 현대 한국어로 옮기되, 동물학적 뉘앙스가 강한 “수컷/암컷”은 피했습니다.
theological_decisions:
- issue: 신적 화법에서의 직접 인용 서두와 공동의사 표현
  chosen_reading: “이렇게 하나님께서 말씀하십니다. ‘우리가 … 만들자’”로 옮겨, 창조 선언의 권위와 복수형 화자를 그대로 드러냈습니다.
  alternative_readings:
  - “하나님이 말씀하시기를 …”
  - “하나님께서 말씀하셨습니다. ‘내가 … 만들겠다’”
  rationale: 본문은 신적 발화의 형식을 강조하며, 복수형 ‘우리’는 출처 텍스트의 신학적 긴장을 보존해야 하므로 평탄화하지 않았습니다.
  doctrine_reference: 창 1:26; 1클레멘스 33:5
