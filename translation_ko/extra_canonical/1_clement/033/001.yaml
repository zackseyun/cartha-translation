id: 1CLEM.33.1
reference: 1 Clement 33:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/001.yaml
  text: What then shall we do, brothers? Shall we cease from doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work.
  footnotes:
  - marker: a
    text: Or 'Shall we grow idle in doing good'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 형제 여러분, 어떻게 하겠습니까? 선을 행하는 일을 그만두고 사랑을 버리겠습니까? 주님께서 우리 가운데 이런 일이 일어나도록 결코 허락하지 않으시기를 바랍니다. 오히려 간절함과 열심을 다하여 서둘러 모든 선한 일을 완수합시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선을 행하는 일에 게을러지겠습니까?”
    reason: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας에 대한 영어 POB 감사 기록의 이전 번역을 한국어로 보존합니다. 본문은 전치사 ἀπό를 고려하여 ‘그만두고’로 유지합니다.
lexical_decisions:
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제 여러분
  alternatives_korean:
  - 형제들
  - 형제자매 여러분
  lexicon: ἀδελφοί
  rationale: 공동체를 향한 직접 호칭이므로 한국어에서는 자연스럽고 공손한 호격인 ‘형제 여러분’으로 옮겼습니다.
- source_word: ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας
  english_pob_choice: Shall we cease from doing good
  chosen_korean: 선을 행하는 일을 그만두고
  alternatives_korean:
  - 선을 행하는 일에서 게을러지고
  - 선을 행하는 일을 쉬고
  lexicon: ἀργέω + ἀπό
  rationale: POB의 수정 반영대로 ‘게을러지다’보다 ‘그만두다/중단하다’가 ἀργέω ἀπό의 의미를 더 정확히 드러내므로, 완전한 중단이라는 긴장을 살렸습니다.
- source_word: ἐγκαταλίπωμεν τὴν ἀγάπην
  english_pob_choice: abandon love
  chosen_korean: 사랑을 버리겠습니까
  alternatives_korean:
  - 사랑을 떠나겠습니까
  - 사랑을 저버리겠습니까
  lexicon: ἐγκαταλείπω
  rationale: ‘버리다’는 대상과의 관계를 끊는 뉘앙스를 잘 나타내며, ἀγάπη를 일반적 정서가 아니라 공동체적 실천으로도 읽을 수 있게 합니다.
- source_word: ὁ δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주께서
  alternatives_korean:
  - 주인께서
  - 주님께서
  lexicon: δεσπότης
  rationale: 이 단어는 권위 있는 주재자를 가리키므로 직역하면 ‘주인’이지만, 문맥상 기도/소망의 어조에 맞게 한국어에서는 ‘주’로 간결하게 처리하되 존대형을 유지했습니다.
- source_word: πᾶν ἔργον ἀγαθόν
  english_pob_choice: every good work
  chosen_korean: 모든 선한 일
  alternatives_korean:
  - 모든 좋은 일
  - 모든 선한 행위
  lexicon: πᾶς + ἔργον ἀγαθός
  rationale: ‘ἔργον’은 단순한 ‘행동’보다 수행해야 할 ‘일/업’의 성격이 강하므로, 한국어에서는 교회적이되 과장되지 않은 ‘선한 일’로 옮겼습니다.
theological_decisions:
- issue: 공동체 권면에서 1인칭 복수와 직접 호소의 어조
  chosen_reading: ‘그러면 형제 여러분, 어떻게 하겠습니까?’와 ‘우리 가운데서’로 공동체 전체를 포함하는 권면으로 유지했습니다.
  alternative_readings:
  - ‘그러면 형제들, 우리가 무엇을 하겠습니까?’
  - ‘우리 안에서 이런 일이 일어나도록’
  rationale: 원문은 화자를 포함한 공동체적 질문과 요청이므로, 한국어에서도 배제 없이 함께 책임지는 어조를 살리는 것이 적절합니다.
  doctrine_reference: 교회론/공동체 윤리
- issue: δεσπότης의 위계성과 경건한 호칭
  chosen_reading: δεσπότης는 위엄 있는 주재자 표현으로 이해하되, 본문 흐름상 한국어 본문에서는 ‘주’로 자연화했습니다.
  alternative_readings:
  - ‘주인’으로 직역
  - ‘주님’으로 완화
  rationale: ‘주인’은 관계의 질감을 드러내지만 현대 한국어에서 다소 거칠 수 있고, ‘주님’은 지나치게 후대 교회어로 들릴 수 있어, 본문 맥락의 긴장과 가독성을 함께 고려했습니다.
  doctrine_reference: 주권/경배 언어
