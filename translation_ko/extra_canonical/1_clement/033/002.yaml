  text: αὐτὸς γὰρ ὁ δημιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐπὶ τοῖς ἔργοις αὐτοῦ ἀγάλλεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033/002.yaml
  text: For the Creator and Master of all himself rejoices in his works.
translation:
  language: ko
  text: 모든 것의 창조주이시며 주인이신 그분께서 친히 자신이 하신 일들을 기뻐하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργὸς
  english_pob_choice: Creator
  chosen_korean: 창조주
  alternatives_korean:
  - 창조자
  - 만드신 분
  lexicon: δημιουργός
  rationale: 만물을 지으신 분이라는 창조 행위를 분명히 드러내기 위해 ‘창조주’를 택했습니다.
- source_word: δεσπότης τῶν ἁπάντων
  english_pob_choice: Master of all
  chosen_korean: 모든 것의 주인이신
  alternatives_korean:
  - 만유의 주인이신
  - 모든 것의 통치자이신
  lexicon: δεσπότης
  rationale: δεσπότης의 지배적 권위를 살리되, 한국어에서 자연스럽고 문맥에 맞게 ‘주인’으로 옮겼습니다.
- source_word: ἐπὶ τοῖς ἔργοις αὐτοῦ
  english_pob_choice: in his works
  chosen_korean: 자기의 일들로
  alternatives_korean:
  - 자기의 일들 안에서
  - 자기의 일들로 말미암아
  lexicon: ἐπὶ + dative
  rationale: ἐπὶ τοῖς ἔργοις는 단순한 장소가 아니라 ‘~로 인해/~에 대하여’의 뉘앙스를 담아, 기뻐하시는 근거를 살리는 ‘~로’로 처리했습니다.
theological_decisions:
- issue: 하나님께서 자신의 일들을 기뻐하신다는 표현의 인칭 유지
  chosen_reading: ‘그분 자신’과 ‘기뻐하십니다’로 옮겨, 창조주가 피조물 위에 계신 분이면서도 자기 행위를 긍정적으로 기뻐하신다는 점을 그대로 유지했습니다.
  alternative_readings:
  - 주어를 생략해 더 간결하게 번역
  - ‘즐거워하십니다’로 완화
  rationale: 원문의 αὐτὸς γάρ는 강조를 띠므로 주어를 분명히 살렸고, ἀγάλλεται의 강한 기쁨을 약화시키지 않도록 ‘기뻐하십니다’로 번역했습니다.
  doctrine_reference: 창조주 하나님의 주권과 자기 행위의 선함에 대한 고백
