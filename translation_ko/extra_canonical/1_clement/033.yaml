source:
  edition: Funk 1901 (normalized OCR)
  text: Τί οὖν ποιήσωμεν, ἀδελφοί; ἀργήσωμεν ἀπὸ τῆς ἀγαθοποιΐας καὶ ἐγκαταλίπωμεν τὴν ἀγάπην; μηδαμῶς τοῦτό ἐάσει ὁ δεσπότης ἐφ’ ἡμῖν γε γενηθῆναι, ἀλλὰ σπεύσωμεν μετὰ ἐκτενείας καὶ προθυμίας πᾶν ἔργον ἀγαθὸν ἐπιτελεῖν. 2. αὐτὸς γὰρ ὁ δημιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐπὶ τοῖς ἔργοις αὐτοῦ ἀγάλλεται. 3. τῷ γὰρ παμμεγεθεστάτῳ αὐτοῦ κράτει οὐρανοὺς ἐστήριξεν καὶ τῇ ἀκαταλήπτῳ αὐτοῦ συνέσει διεκύβευσεν αὐτούς· τὴν τε γῆν διεχώρισεν ἀπὸ τοῦ περιέχοντος αὐτὴν ὕδατος καὶ ἔδρασεν ἐπὶ τὸν ἀσφαλῆ τοῦ ἰδίου βουλήματος θεμέλιον· τὰ τε ἐν αὐτῇ ζῷα φοιτώντα τῇ ἑαυτοῦ διατάξει ἐκέλευσεν εἶναι· τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ ζῷα προετοιμάσας ἐνέκλεισεν τῇ ἑαυτοῦ δυνάμει. . ἐπὶ πᾶσι τὸ ἐξοχώτατον καὶ παμμέγεθες κατὰ διάνοιαν, ἄνθρωπον, ταῖς ἱεραῖς καὶ ἀμιάντοις χερσὶν ἔπλασεν τῆς ἑαυτοῦ εἰκόνος χαρακτῆρα. 5. οὕτως γὰρ φησὶν ὁ θεός· Ποιήσωμεν ἄνθρωπον κατ’ εἰκόνα καὶ καθ’ ὁμοίωσιν ἡμετέραν· καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς. . ταῦτα οὖν πάντα τελειώσας ἐπῄνεσεν αὐτὰ καὶ ηὐλόγησεν
    καὶ εἶπεν· Αὐξάνεσθε καὶ πληθύνεσθε. 7. ἴδωμεν, ὅτι ἐν ἔργοις ἀγαθοῖς πάντες ἐκοσμήθησαν οἱ δίκαιοι, καὶ αὐτὸς δὲ ὁ κύριος ἔργοις ἀγαθοῖς ἑαυτὸν κοσμήσας ἐχάρη. 8. ἔχοντες οὖν τοῦτον τὸν ὑπογραμμὸν ἀόκνως προσέλθωμεν τῷ θελήματι αὐτοῦ· ἐξ ὅλης τῆς ἰσχύος ἡμῶν ἐργασώμεθα ἔργον δικαιοσύνης.
  language: Greek
  pages:
  - 303
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/033.yaml
  text: What then shall we do[a], brothers? Shall we grow idle in doing good and abandon love? May the Master never allow this to happen among us. Rather, let us hasten with earnestness and eagerness to accomplish every good work. For the Creator and Master of all himself rejoices in his works. For by his exceedingly great might he established the heavens, and by his incomprehensible understanding he ordered them. He also separated the earth from the water that surrounds it and fixed it upon the secure foundation of his own purpose. And the living creatures that move about on it he commanded to exist by his own ordinance. Having prepared the sea and the living creatures in it, he enclosed it by his own power. Above all, with his holy and undefiled hands he formed man, the most excellent and truly great being in understanding, as the imprint of his own image. For thus God says, “Let us make man according to our image and according to our likeness.” And God made man; male and female he made
    them. So then, when he had finished all these things, he praised them and blessed them and said, “Increase and multiply.” Let us see that all the righteous were adorned with good works, and that the Lord himself[b], adorning himself with good works, rejoiced. Having, then, this pattern, let us come without hesitation to his will[f][e][d][c]. With all our strength let us work the work of righteousness.
  footnotes:
  - marker: a
    text: Or 'with fervor and readiness' for 'with earnestness and eagerness.'
    reason: lexical_alternative
  - marker: b
    text: The wording echoes Gen 1:26–28.
    reason: cross_reference
  - marker: c
    text: '''Man'' here carries a representative sense for humanity in the creation account, as shown by the following phrase ''male and female he made them.'''
    reason: cultural_note
  - marker: d
    text: Or 'example' for 'pattern'; the Greek term can denote a model set before someone for imitation.
    reason: lexical_alternative
  - marker: e
    text: Or 'Let us see, then, that'.
    reason: previous_rendering
  - marker: f
    text: Or 'let us come eagerly'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 우리는 어떻게 하겠습니까, 형제 여러분? 선행하기를 게을리하고 사랑을 버리겠습니까? 주인이 우리에게 그런 일이 일어나도록 결코 허락하지 않으십니다. 오히려 우리는 간절함과 열심으로 서둘러 모든 선한 일을 이루어 냅시다. 만물을 지으시고 다스리시는 분 자신이 그분의 일들로 기뻐하십니다. 참으로 그분은 지극히 크신 능력으로 하늘들을 세우시고, 헤아릴 수 없는 이해로 그것들을 질서 있게 두셨습니다. 또한 그분은 땅을 그것을 둘러싼 물에서 갈라 놓으시고, 자기 뜻의 견고한 기초 위에 세우셨습니다. 또 그 위를 다니는 살아 있는 것들은 자기의 규례로 존재하게 하셨습니다. 바다와 그 안의 살아 있는 것들을 예비하신 뒤에는, 자기의 능력으로 그것을 가두셨습니다. 무엇보다도, 이해에 있어 가장 탁월하고 참으로 위대한 존재인 사람을 거룩하고 더럽혀지지 않은 손으로 자기 형상의 흔적으로 빚으셨습니다. 그러므로 하나님께서 이렇게 말씀하셨습니다. 「우리의 형상대로, 우리의 모양과 같이 사람을 만들자.」 그리고 하나님께서 사람을 만드셨습니다. 남자와 여자로 그들을 만드셨습니다. 그러므로 이 모든 것을 완성하신 뒤에 그분은 그것들을 칭찬하시고 복을 주시며 말씀하셨습니다. 「생육하고 번성하라.」 우리 모두가 선한 일로 단장되었다는 것과, 주님 자신도 선한 일로 자신을 단장하시고 기뻐하셨다는 것을 보도록 합시다. 그러므로 이 본을 가지고 주님의 뜻으로 주저함 없이 나아갑시다. 온 힘을 다해 의의 일을 이루어 냅시다.[a][b][c][d][e][f]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργήσωμεν
  english_pob_choice: shall we grow idle
  chosen_korean: 게을리하고
  alternatives_korean:
  - 게을러지고
  - 나태해지고
  - 쉬어 버리고
  lexicon: LSJ
  rationale: 행동을 멈추는 것보다 선행에 대해 느슨해지고 소홀해지는 뉘앙스를 살리기 위해 동사구로 옮겼습니다.
- source_word: ἀγαθοποιΐας
  english_pob_choice: doing good
  chosen_korean: 선행하기
  alternatives_korean:
  - 선을 행하기
  - 좋은 일을 하기
  - 선한 일을 행하기
  lexicon: LSJ
  rationale: 추상명사의 활동성을 자연스러운 한국어로 풀어, ‘선한 행위’라는 뜻을 분명히 했습니다.
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주
  - 주권자
  - 임자
  lexicon: LSJ
  rationale: κύριος와 구별되는 강한 소유·권위의 뉘앙스를 살려, 이 문맥에서는 ‘주인’이 가장 투명합니다.
- source_word: ἐκτενείας καὶ προθυμίας
  english_pob_choice: earnestness and eagerness
  chosen_korean: 간절함과 열심
  alternatives_korean:
  - 열성과 준비
  - 간절성과 기꺼움
  - 진지함과 적극성
  lexicon: LSJ
  rationale: 두 명사를 한국어의 병렬로 옮겨, 지속적 긴장과 자원하는 열의를 함께 드러냈습니다.
- source_word: ἐπιτελεῖν
  english_pob_choice: to accomplish
  chosen_korean: 이루어 내다
  alternatives_korean:
  - 완성하다
  - 성취하다
  - 수행하다
  lexicon: BDAG
  rationale: 단순 시작이 아니라 끝까지 완수한다는 의미를 담기 위해 결과 지향적 표현을 택했습니다.
- source_word: δημιουργὸς
  english_pob_choice: Creator
  chosen_korean: 만물을 지으시고 다스리시는 분
  alternatives_korean:
  - 창조주
  - 조물주
  - 만드신 분
  lexicon: LSJ
  rationale: 단일 호칭을 풀어, 이어지는 창조 행위 전체와 통치권을 함께 드러내는 문맥적 번역을 사용했습니다.
- source_word: διεκύβευσεν
  english_pob_choice: ordered
  chosen_korean: 질서 있게 두셨습니다
  alternatives_korean:
  - 배열하셨습니다
  - 정돈하셨습니다
  - 배치하셨습니다
  lexicon: LSJ
  rationale: 난해한 동사를 우주 질서 형성의 문맥에 맞게, 과도한 기술어 없이 ‘질서 있게 두다’로 옮겼습니다.
- source_word: ἄνθρωπον
  english_pob_choice: man
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 인류
  - 남자
  lexicon: BDAG
  rationale: 이어지는 ‘남자와 여자로’와의 연결을 유지하면서도, 한국어에서는 대표적 인류 지시로 ‘사람’이 가장 자연스럽습니다.
- source_word: ἔργον δικαιοσύνης
  english_pob_choice: the work of righteousness
  chosen_korean: 의의 일
  alternatives_korean:
  - 의의 일들
  - 의로운 일
  - 정의의 일
  lexicon: BDAG
  rationale: 여기서는 윤리적·신앙적 의로움의 실천을 가리키므로, 프로젝트 기본어인 ‘의’를 유지했습니다.
theological_decisions:
- issue: δεσπότης와 κύριος의 구별
  chosen_reading: 앞부분의 δεσπότης는 ‘주인’, 뒤의 κύριος는 ‘주님’으로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통일
  - 둘 다 ‘주’로 번역
  rationale: 원문은 다른 호칭을 의도적으로 병치하므로, 한국어에서도 권위의 성격 차이를 유지하는 편이 본문 투명성에 유리합니다.
  doctrine_reference: 'DOCTRINE.md: consistency of key terms, or documented exception'
- issue: ἄνθρωπον의 대표성
  chosen_reading: ‘사람’으로 옮기되, 남녀 창조와 연결되는 인류 대표 의미를 살렸습니다.
  alternative_readings:
  - 인간
  - 인류
  rationale: 창세기 인용과 직후의 ‘남자와 여자로’가 대표적 인류를 가리키는 흐름을 형성하므로, 성별 포괄성을 유지하면서도 본문 연결을 훼손하지 않는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: gender-accurate over gender-neutral'
