id: 1CLEM.8.3
reference: 1 Clement 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Μετανοήσατε, οἶκος Ἰσραήλ, ἀπὸ τῆς ἀνομίας ὑμῶν· εἶπον τοῖς υἱοῖς τοῦ λαοῦ μου· Ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ καὶ ἐὰν ὦσιν πυρρότεραι κόκκου καὶ μελανώτεραι σάκκου, καὶ ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας καὶ εἴπητε· Πάτερ, ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: ko
  text: “회개하라, 이스라엘 집이여, 너희의 불법에서. 내가 내 백성의 자손들에게 말하기를, ‘너희 죄가 땅에서 하늘에 이를지라도, 또 그것들이 홍보다는 더 붉고 굵은 베보다는 더 검을지라도, 너희가 온 마음으로 내게 돌아와 “아버지”라고 말하면, 내가 거룩한 백성에게 하듯 너희에게 귀를 기울이겠다.’”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετανοήσατε
  english_pob_choice: Repent
  chosen_korean: 회개하라
  alternatives_korean:
  - 회개하십시오
  - 돌아오라
  lexicon: μετανοέω
  rationale: 직접 명령의 촉구를 유지하면서, 한국어 성경에서 널리 쓰이지만 본문이 요구하는 도덕적·언약적 전환을 드러내는 표현으로 옮겼습니다.
- source_word: ἀνομία
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 율법 없음
  - 무법
  - 불의
  lexicon: ἀνομία
  rationale: 단순한 비행보다 하나님의 질서와 율법을 거스르는 상태를 짧고 직접적으로 드러내므로 ‘불법’이 가장 근접합니다.
- source_word: ἐπιστραφῆτε πρὸς με ἐξ ὅλης τῆς καρδίας
  english_pob_choice: you turn to me with your whole heart
  chosen_korean: 너희가 온 마음으로 내게 돌아와
  alternatives_korean:
  - 너희가 온 마음을 다하여 내게 돌아와
  - 너희가 온 마음으로 내게로 돌이켜
  lexicon: ἐπιστρέφω
  rationale: 회심/귀환의 방향성을 살리되, 조건절의 흐름에 맞게 한국어로 자연스럽게 ‘돌아와’로 정리했습니다.
- source_word: ἐπακούσομαι ὑμῶν ὡς λαοῦ ἁγίου
  english_pob_choice: I will listen to you as to a holy people
  chosen_korean: 내가 거룩한 백성에게 하듯 너희에게 귀를 기울이겠다
  alternatives_korean:
  - 내가 거룩한 백성으로서의 너희 말을 듣겠다
  - 내가 거룩한 백성처럼 너희를 들으리라
  lexicon: ἐπακούω
  rationale: 단순히 ‘듣다’보다 응답을 염두에 둔 ‘귀를 기울이다’가 동사의 청유적·호의적 뉘앙스를 더 잘 드러냅니다.
theological_decisions:
- issue: ‘Πάτερ’의 호칭과 문맥 내 화자 관계
  chosen_reading: 회개하여 돌아온 백성이 하나님을 ‘아버지’로 부르는 언약적 친밀함을 유지했습니다.
  alternative_readings:
  - 단순한 가족 호칭
  - 기도 관용구로 축소
  rationale: 본문은 회개와 응답 약속을 연결하므로, ‘아버지’는 단순 호칭이 아니라 회복된 관계의 표지로 읽는 것이 문맥에 맞습니다.
  doctrine_reference: 언약 갱신과 회복된 하나님-백성 관계
