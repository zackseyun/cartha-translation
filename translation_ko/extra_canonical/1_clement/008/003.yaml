base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/003.yaml
  text: “Repent, O house of Israel, of your lawlessness. I said to the sons of my people, ‘If your sins should be from the earth to heaven, and if they are redder than scarlet and blacker than sackcloth, and you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’”
translation:
  language: ko
  text: “이스라엘 집이여, 너희의 불법에서 회개하십시오. 내가 내 백성의 자녀들에게 이렇게 말하였습니다. ‘너희의 죄가 땅에서 하늘까지 이를 만큼 많고[a], 진홍색보다 더 붉으며 굵은 베옷보다 더 검더라도, 너희가 온 마음으로 내게 돌아와 “아버지”라고 말하면, 내가 거룩한 백성의 말을 듣듯이 너희의 말을 듣겠습니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘너희의 죄가 땅에서 하늘까지 있고’입니다. 이는 죄의 엄청난 범위를 나타내는 표현입니다.
    reason: ἀπὸ τῆς γῆς ἕως τοῦ οὐρανοῦ의 압축된 공간 표현과 한국어의 자연스러운 범위 해석을 연결합니다.
