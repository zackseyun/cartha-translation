id: 1CLEM.8.2
reference: 1 Clement 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ αὐτὸς δὲ ὁ δεσπότης τῶν ἁπάντων περὶ μετανοίας ἐλάλησεν μετὰ ὅρκου· Ζῶ γὰρ ἐγώ, λέγει κύριος, οὐ βούλομαι τὸν θάνατον τοῦ ἁμαρτωλοῦ ὡς τὴν μετάνοιαν, προστιθεὶς καὶ γνώμην ἀγαθήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/002.yaml
  text: 'And the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord[b][a], “I do not desire the death of the sinner so much as his repentance,” adding also a good judgment:'
  footnotes:
  - marker: a
    text: Or 'and the Master himself of all things also spoke'.
    reason: previous_rendering
  - marker: b
    text: Or 'adding also a good intention:'.
    reason: previous_rendering
translation:
  language: ko
  text: 또한 만물의 주인이신 그분 자신도 맹세로 회개에 관하여 말씀하셨습니다. 「내가 살아 있음을 두고 맹세한다. 주님께서 말씀하신다. 나는 죄인의 죽음보다 그가 회개하는 것을 원한다.」라고 하시며, 또한 좋은 권면을 덧붙이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘좋은 판단[의견]’입니다. 여기서는 이어지는 권고의 말씀을 가리킵니다.
    reason: γνώμην ἀγαθήν의 가능한 의미 범위를 보이되, 문맥상 권고를 도입한다는 기능을 설명합니다.
lexical_decisions:
- source_word: ὁ δεσπότης τῶν ἁπάντων
  english_pob_choice: the Master of all things
  chosen_korean: 만물의 주인이신 그분
  alternatives_korean:
  - 모든 것의 주인이신 분
  - 만물의 주인
  lexicon: δεσπότης
  rationale: δεσπότης는 단순한 소유주가 아니라 절대적 주권을 지닌 ‘주인’의 뉘앙스를 가지므로, POB의 ‘Master of all things’를 따라 ‘만물의 주인’ 계열로 옮겼습니다. 자연스러운 한국어를 위해 서술형으로 ‘주인이신 그분’이라 했습니다.
- source_word: ἐλάλησεν ... μετὰ ὅρκου
  english_pob_choice: spoke ... with an oath
  chosen_korean: 맹세를 두고 말씀하셨습니다
  alternatives_korean:
  - 맹세하며 말씀하셨습니다
  - 맹세와 함께 말씀하셨습니다
  lexicon: λαλέω / ὅρκος
  rationale: ὅρκος는 단순 강조가 아니라 맹세를 뜻하므로 이를 드러냈고, λαλέω는 격식 있는 문맥에서 ‘말씀하다’가 적절합니다.
- source_word: γνώμην ἀγαθήν
  english_pob_choice: a good judgment
  chosen_korean: 좋은 판단
  alternatives_korean:
  - 좋은 의견
  - 좋은 판정
  - 좋은 뜻
  lexicon: γνώμη
  rationale: 본문의 γνώμη는 8:3의 이어지는 인용문을 예고하는 ‘판단/진술’에 가까워, 영어 개정판의 ‘judgment’를 반영하되 한국어에서는 문맥상 가장 자연스러운 ‘판단’으로 옮겼습니다.
theological_decisions:
- issue: YHWH 인용문에서 ‘주님’ 호칭 유지와 직접화법의 구분
  chosen_reading: 「내가 살아 있는 한, 주님께서 말씀하십니다.」
  alternative_readings:
  - 「내가 살아 있는 한, 주님이 말씀하십니다.」
  - 「내가 살아 있는 한, 야훼께서 말씀하십니다.」
  rationale: 이 절은 창 22:16 계열의 서약 공식을 끌어오지만, 여기서는 인용문 내부의 화자 표지를 자연스럽게 유지하는 것이 우선입니다. 본문 자체가 야훼 대체 표기 문제를 직접 요구하지는 않으므로, 외부 문맥 없이도 읽히는 ‘주님’으로 처리했습니다.
  doctrine_reference: OT citation / divine speech register
- issue: ‘죄인의 죽음’과 ‘회개’를 대비하는 비교구조 보존
  chosen_reading: 나는 죄인의 죽음을 그 회개만큼 원하지 않습니다
  alternative_readings:
  - 나는 죄인의 죽음보다 회개를 더 원합니다
  - 나는 죄인의 죽음을 바라지 않고 오히려 회개를 원합니다
  rationale: οὐ βούλομαι ... ὡς ...는 단순한 선호가 아니라 죽음과 회개의 대비를 이루므로, ‘만큼’ 구문으로 비교 관계를 살렸습니다. 이렇게 해야 원문의 긴장과 강조가 약화되지 않습니다.
  doctrine_reference: repentance / divine mercy
