  naturalness: 초안의 ‘맹세를 두고’와 ‘그 회개만큼 원하지 않습니다’는 현대 표준 한국어에서 다소 어색하거나 의미가 불분명합니다. 직접 인용문 안의 ‘주님께서 말씀하십니다’는 삽입 화자 표지로 처리하면 자연스럽습니다.
