  yaml_path: translation/extra_canonical/1_clement/008/001.yaml
  text: The ministers of the grace of God spoke through the Holy Spirit concerning repentance,
translation:
  language: ko
  text: 하나님의 은혜의 일꾼들은 성령으로 말하며 회개에 관하여 말하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ λειτουργοὶ
  english_pob_choice: The ministers
  chosen_korean: 일꾼들
  alternatives_korean:
  - 사역자들
  - 봉사자들
  - 섬기는 이들
  lexicon: λειτουργός
  rationale: λειτουργοὶ는 단순 직함보다 공적 섬김의 역할을 가리키므로, 문맥에 맞게 ‘일꾼들’로 옮겨 기능적 의미를 살렸습니다.
- source_word: τῆς χάριτος τοῦ θεοῦ
  english_pob_choice: of the grace of God
  chosen_korean: 하나님의 은혜의
  alternatives_korean:
  - 하나님의 은혜에 속한
  - 하나님의 은혜를 전하는
  - 하나님의 은혜 가운데 있는
  lexicon: χάρις
  rationale: ‘은혜’는 프로젝트 기본 용례를 따르고, 속격 연결은 자연스러운 한국어로 ‘하나님의 은혜의’라고 처리했습니다.
- source_word: διὰ πνεύματος ἁγίου
  english_pob_choice: through the Holy Spirit
  chosen_korean: 성령으로
  alternatives_korean:
  - 성령을 통해
  - 거룩한 영으로
  - 성령 안에서
  lexicon: πνεῦμα ἅγιον
  rationale: 행위의 매개를 나타내는 διὰ는 한국어에서 ‘-으로’가 가장 간결하고 자연스러워 ‘성령으로’로 옮겼습니다.
- source_word: περὶ μετανοίας
  english_pob_choice: concerning repentance
  chosen_korean: 회개에 관하여
  alternatives_korean:
  - 회개에 대하여
  - 회개를 두고
  - 회개에 대해
  lexicon: μετάνοια
  rationale: περὶ + 속격은 주제 표지이므로, 내용의 초점을 살려 ‘회개에 관하여’로 번역했습니다.
theological_decisions:
- issue: ‘영’과 ‘성령’의 구분
  chosen_reading: 여기서는 πνεύματος ἁγίου가 명시적으로 나오므로 ‘성령’으로 옮겼습니다.
  alternative_readings:
  - ‘거룩한 영’
  - ‘성스러운 영’
  rationale: 문법적으로도 의미상으로도 하나님의 영을 가리키는 표현이 분명하므로, 프로젝트 기본값에 따라 ‘성령’을 사용했습니다.
  doctrine_reference: 성령의 인격성과 하나님의 사역 매개성
