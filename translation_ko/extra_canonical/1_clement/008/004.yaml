id: 1CLEM.8.4
reference: 1 Clement 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἐν ἑτέρῳ τόπῳ λέγει οὕτως· Λούσασθε καὶ καθαροὶ γένεσθε, ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου· παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν, μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίσιν, ῥύσασθε ἀδικούμενον, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν· καὶ δεῦτε καὶ διελεγχθῶμεν, λέγει κύριος· καὶ ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡς χιόνα λευκανῶ· ἐὰν δὲ ὦσιν ὡς κόκκινον, ὡς ἔριον λευκανῶ· καὶ ἐὰν θέλητε καὶ εἰσακούσητέ μου, τὰ ἀγαθὰ τῆς γῆς φάγεσθε· ἐὰν δὲ μὴ θέλητε μηδὲ εἰσακούσητέ μου, μάχαιρα ὑμᾶς κατέδεται· τὸ γὰρ στόμα κυρίου ἐλάλησεν ταῦτα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/004.yaml
  text: 'And in another place he says thus: “Wash and become clean; remove your wicked deeds from before my eyes[a], from your souls; cease from your wickednesses, learn to do good, seek justice, rescue the one being wronged, judge for the orphan, and give justice to the widow. And come, and let us reason together,” says the Lord. “Even if your sins are like crimson, I will whiten them like snow; and if they are like scarlet, I will whiten them like wool. But if you are willing and listen to me, you shall eat the good things of the land; but if you are not willing and do not listen to me, a sword will devour you; for the mouth of the Lord has spoken these things.”'
  footnotes:
  - marker: a
    text: Or 'remove your wicked deeds from before my eyes'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다른 곳에서 이렇게 말씀하십니다. 「씻고 깨끗해지십시오. 내 눈앞에서 너희 영혼의 악한 일들을 없애십시오. 너희의 악한 일들을 그치고, 선을 행하는 법을 배우며, 공의를 구하십시오. 억울한 일을 당하는 사람을 구해 주고, 고아를 변호하며, 과부의 권리를 바로 세우십시오. 자, 오십시오. 우리 함께 따져 봅시다.」 주님께서 말씀하십니다. 「너희의 죄가 주홍빛 같을지라도 내가 눈처럼 희게 하겠고, 진홍빛 같을지라도 양털처럼 희게 하겠습니다. 그러나 너희가 원하고 내 말을 들으면 땅의 좋은 것들을 먹을 것입니다. 그러나 너희가 원하지 않고 내 말을 듣지 않으면 칼이 너희를 삼킬 것입니다. 주님의 입이 이렇게 말씀하셨기 때문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λούσασθε καὶ καθαροὶ γένεσθε
  english_pob_choice: Wash and become clean
  chosen_korean: 씻으십시오. 그러면 깨끗해질 것입니다
  alternatives_korean:
  - 몸을 씻으십시오. 그리고 깨끗해지십시오
  - 씻고 깨끗해지십시오
  lexicon: λούω / καθαρός
  rationale: 명령과 결과를 자연스러운 한국어로 살리되, 단순한 의례적 세정이 아니라 정결의 상태 변화를 드러내도록 옮겼습니다.
- source_word: ἀφέλεσθε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου
  english_pob_choice: remove your wicked deeds from your souls before my eyes
  chosen_korean: 너희의 영혼에서 너희의 악한 행위들을 내 눈앞에서 제거하십시오
  alternatives_korean:
  - 내 눈앞에서 너희의 악한 행위들을 너희 영혼에서 제거하십시오
  - 너희 영혼에서 악한 행위를 없애십시오
  lexicon: ἀφέλεσθε / πονηρία / ψυχή
  rationale: 그리스어의 어순에 맞춰 '내 눈앞에서'와 '너희의 영혼에서'를 모두 살렸고, πονηρίας는 행동의 악함을 나타내는 '악한 행위들'로 구체화했습니다.
- source_word: παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν
  english_pob_choice: cease from your wickednesses
  chosen_korean: 너희의 악행에서 떠나십시오
  alternatives_korean:
  - 너희의 악행을 그치십시오
  - 너희의 악한 일들을 멈추십시오
  lexicon: παύσασθε / πονηρίαι
  rationale: 반복을 피하면서도 '그만두다'보다 관계적·행위적 이탈을 드러내는 '떠나십시오'를 택했습니다.
- source_word: ἐκζητήσατε κρίσιν ... δικαιώσατε χήραν
  english_pob_choice: seek justice ... and give justice to the widow
  chosen_korean: 정의를 추구하며 ... 과부에게 의를 베푸십시오
  alternatives_korean:
  - 공의를 구하며 ... 과부를 의롭게 하십시오
  - 정의를 찾고 ... 과부를 변호하십시오
  lexicon: κρίσις / δικαιόω
  rationale: κρίσις는 여기서 사회적·재판적 정의의 요청이므로 '정의'로, δικαιώσατε는 과부의 권리를 바로 세우는 뜻을 살려 '의를 베푸십시오'로 옮겼습니다.
- source_word: τὰ ἀγαθὰ τῆς γῆς
  english_pob_choice: the good things of the land
  chosen_korean: 땅의 좋은 것
  alternatives_korean:
  - 땅의 좋은 소산
  - 그 땅의 좋은 것들
  lexicon: ἀγαθά / γῆ
  rationale: 히브리어 이사야 인용의 관용적 표현을 살리되, 현대 한국어에서 과장되지 않게 간결하게 표현했습니다.
theological_decisions:
- issue: 인용문 안에서의 주님의 발화와 화자 표지
  chosen_reading: 인용부를 유지하고 '주님께서 말씀하십니다'로 화자 전환을 분명히 했습니다.
  alternative_readings:
  - 구두점을 덜 나누어 단일 긴 인용으로 처리
  - '''야훼께서 말씀하십니다''로 표기'
  rationale: 본문은 이사야 1장의 직접 인용으로, 예언자적 말씀의 발화자를 분명히 보여 주는 구조를 보존하는 것이 중요합니다. 여기서는 ελλην어 κύριος의 인용이지만 POB의 본문 관례에 따라 본문 음역은 유지하고, 별도의 OT citation 주석 없이 '주님'으로 처리했습니다.
  doctrine_reference: 본문 인용 구조 및 예언자적 발화 표지
