  verdict: revise
  source_fidelity: 그리스어의 핵심 요소들은 대체로 반영되었으나, ἀπὸ τῶν ψυχῶν ὑμῶν와 ἀπέναντι τῶν ὀφθαλμῶν μου의 관계를 드러내는 한국어 어순이 부자연스럽고 의미 연결이 불분명합니다. 또한 ἐκζητήσατε κρίσιν, κρίνατε ὀρφανῷ, δικαιώσατε χήραν의 사회·재판적 요청은 더 직접적으로 옮기는 편이 정확합니다.
  naturalness: 합쇼체의 명령형은 대체로 일관되지만, “너희의 영혼에서 너희의 악한 행위들을 내 눈앞에서 제거하십시오”는 현대 한국어로 매우 어색합니다. “우리 서로 따져 봅시다”도 하나님과 청자 사이의 초청이라는 문맥에서 ‘서로’가 불필요하게 대립적인 뉘앙스를 낼 수 있습니다.
  terminology: κρίσις는 여기서 추상적 ‘정의’보다는 공정한 판결·권리 회복을 포함하는 ‘공의’가 적절하며, 고아와 과부에 대한 동사들은 ‘변호하다/권리를 바로 세우다’로 옮겨 사회적 न्याय의 뜻을 보존했습니다. πονηρίαι는 반복을 살려 ‘악한 일들’로 처리했습니다.
  issues:
  - severity: medium
    issue: ‘영혼에서’와 ‘내 눈앞에서’의 배치가 부자연스럽고 수식 관계가 불명확함
