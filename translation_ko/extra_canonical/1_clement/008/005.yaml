id: 1CLEM.8.5
reference: 1 Clement 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντας οὖν τοὺς ἀγαπητοὺς αὐτοῦ βουλόμενος μετανοίας μετασχεῖν ἐστήριξεν τῷ παντοκρατορικῷ βουλήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008/005.yaml
  text: Therefore[a], desiring all his beloved ones to share in repentance, he established it by his almighty will.
  footnotes:
  - marker: a
    text: Or 'established it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 자기의 모든 사랑받는 이들이 회개에 참여하게 하시고자, 그분은 자신의 전능하신 뜻으로 그것을 확정하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας τοὺς ἀγαπητοὺς αὐτοῦ
  english_pob_choice: all his beloved ones
  chosen_korean: 자기의 모든 사랑받는 이들
  alternatives_korean:
  - 그의 모든 사랑하는 자들
  - 그의 모든 사랑받는 자들
  lexicon: ἀγαπητοί
  rationale: ἀγαπητοί는 단순한 감정적 ‘사랑하는 사람들’보다 하나님께서 특별히 사랑하시는 대상이라는 뉘앙스가 있어, 관계를 살리되 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: μετανοίας μετασχεῖν
  english_pob_choice: to share in repentance
  chosen_korean: 회개에 참여하게 하시고자
  alternatives_korean:
  - 회개를 함께 누리게 하시고자
  - 회개를 받게 하시고자
  lexicon: μετανοία / μετασχεῖν
  rationale: μετασχεῖν은 단순 보유가 아니라 ‘참여하다/나누다’의 의미이므로, 회개를 대상화해 ‘참여하다’로 살렸습니다.
- source_word: ἐστήριξεν
  english_pob_choice: established it
  chosen_korean: 확정하셨습니다
  alternatives_korean:
  - 세우셨습니다
  - 견고하게 하셨습니다
  - 확증하셨습니다
  lexicon: στηρίζω
  rationale: 본문 문맥에서는 앞선 약속과 선언을 하나님 뜻으로 굳게 정하신 의미가 강하므로, 물리적 ‘세우다’보다 ‘확정하다’가 더 정확합니다.
- source_word: τῷ παντοκρατορικῷ βουλήματι αὐτοῦ
  english_pob_choice: by his almighty will
  chosen_korean: 자신의 전능하신 뜻으로
  alternatives_korean:
  - 자신의 전능하신 의지로
  - 그의 전능하신 계획으로
  lexicon: παντοκρατορικός / βούλημα
  rationale: παντοκρατορικός은 ‘전능하신’으로, βούλημα은 단순 의지보다 정해진 뜻·결단의 뉘앙스가 있어 ‘뜻’이 가장 균형 잡힙니다.
theological_decisions:
- issue: 회개에 참여하게 하시고자라는 목적 구조
  chosen_reading: 하나님이 사랑받는 자들을 회개에 참여하도록 의도하신 목적을 그대로 반영했습니다.
  alternative_readings:
  - 회개를 받게 하시고자
  - 회개하도록 하시며
  rationale: 부정확하게 인과로 풀기보다, 분사 구조가 나타내는 목적성을 보존하는 편이 본문 의미를 더 잘 드러냅니다.
  doctrine_reference: 하나님의 주권적 뜻과 회개로의 초청
- issue: ἐστήριξεν의 의미를 ‘확정’으로 반영
  chosen_reading: 앞선 약속/선언을 하나님의 전능한 뜻 안에서 확정하셨다는 뜻으로 읽었습니다.
  alternative_readings:
  - 설정하셨습니다
  - 확인하셨습니다
  - 견고하게 하셨습니다
  rationale: 문맥상 새로운 행위를 만들기보다 이미 말해진 회개 약속을 굳게 정하신 의미가 더 자연스럽고, 이는 POB 영어 수정 내역의 ‘established’와도 조응합니다.
  doctrine_reference: 하나님의 신실하신 선언과 뜻의 확정
