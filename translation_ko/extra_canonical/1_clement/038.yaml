base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038.yaml
  text: Therefore let our whole body be joined together in Messiah Jesus[2], and let each one be subject to his neighbor, just as he was appointed in his own gift. 2. Let the strong take care of the weak, and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he gave him one through whom his lack may be filled up. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not bear witness to himself, but let him allow himself to be borne witness to by another. Let the one who is pure in the flesh not boast, knowing that it is another who supplies him with self-control. 3. Let us therefore consider, brothers, from what material we came to be, what and who we were when we entered into the world, from what tomb and darkness the one who formed us and created us brought us into his world, having prepared his good gifts before we were born. 4. Since, then, we have all these things from him, we ought in every
    way to give thanks to him, to whom be the glory for the ages of ages[c][b][a][4][2][2]. Amen.
  footnotes:
  - marker: '2'
    text: Or 'be joined together' or 'be knit together' for the opening exhortation about the whole body in Messiah Jesus.
    reason: lexical_alternative
  - marker: '2'
    text: '''Pure in the flesh'' may especially imply bodily chastity, but the Greek expression is broader than a narrowly technical term.'
    reason: lexical_alternative
  - marker: '2'
    text: The clause 'because he gave him one through whom his lack may be filled up' is syntactically compressed; the sense is likely that God has provided the poor person with someone through whom his need is supplied.
    reason: alternative_reading
  - marker: '4'
    text: Literally, 'for the ages of ages,' a traditional doxological expression.
    reason: lexical_alternative
  - marker: a
    text: Or 'Let the rich supply the poor'.
    reason: previous_rendering
  - marker: b
    text: Or 'supplies him self-control'.
    reason: previous_rendering
  - marker: c
    text: Or 'according as he was appointed in his own gift'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리 전체 몸이 메시아 예수 안에서 하나로 묶이도록 하고, 각 사람은 자기 이웃에게 복종하십시오. 이는 각 사람이 자기 은사 안에서 정해졌기 때문입니다. 2. 강한 사람은 약한 사람을 돌보고, 약한 사람은 강한 사람을 존중하십시오. 부유한 사람은 가난한 사람에게 공급하고, 가난한 사람은 하나님께 감사하십시오. 하나님께서 자기 부족함이 채워질 한 사람을 그에게 주셨기 때문입니다. 지혜로운 사람은 자기 지혜를 말로가 아니라 선한 일들로 드러내십시오. 마음이 겸손한 사람은 자기 자신을 증언하지 말고, 다른 사람이 그를 증언하도록 두십시오. 육체적으로 순결한 사람은 자랑하지 마십시오. 자기 절제는 다른 이가 그에게 공급해 준다는 것을 알고 있기 때문입니다. 3. 그러므로 형제들아, 우리가 어떤 재료로 지음 받았는지, 우리가 세상에 들어올 때 어떤 존재였고 누구였는지, 우리를 빚으시고 지으신 분이 우리를 자기 세계로 이끌어 내신 그 무덤과 어둠이 무엇이었는지를 생각해 봅시다. 그는 우리가 태어나기 전에 이미 자기 좋은 선물들을 준비하셨습니다. 4. 그러므로 우리가 이 모든 것을 그분에게서 받았으니, 우리는 모든 면에서 그분께 감사드려야 합니다. 그분께 영광이 영원무궁토록 있습니다. 아멘.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνξέσθω
  english_pob_choice: be joined together
  chosen_korean: 하나로 묶이도록 하고
  alternatives_korean:
  - 서로 이어지도록 하고
  - 결합되도록 하고
  - 하나가 되도록 하고
  lexicon: LSJ
  rationale: 신체 전체가 함께 유지되는 공동체적 결속을 살리되, 한국어에서 자연스럽고 능동적인 권면형으로 옮겼습니다.
- source_word: ἐν Χριστῷ Ἰησοῦ
  english_pob_choice: in Messiah Jesus
  chosen_korean: 메시아 예수 안에서
  alternatives_korean:
  - 그리스도 예수 안에서
  - 메시아이신 예수 안에서
  lexicon: BDAG
  rationale: Χριστός를 직함으로 읽어 ‘메시아’로 옮기되, 본문 안의 결합 표현은 한국어에서 가장 간명하게 처리했습니다.
- source_word: ὑποτασσέσθω
  english_pob_choice: be subject to
  chosen_korean: 복종하십시오
  alternatives_korean:
  - 순종하십시오
  - 복종하게 하십시오
  - 종속되십시오
  lexicon: BDAG
  rationale: 상호 질서의 문맥을 유지하면서도, 문장 구조상 명령형 권면을 분명히 드러내는 표현을 택했습니다.
- source_word: ἐπιμελείσθω / ἐντρεπέσθω / ἐπιχορηγείτω
  english_pob_choice: take care of / respect / supply
  chosen_korean: 돌보고 / 존중하십시오 / 공급하고
  alternatives_korean:
  - 살펴주고 / 경외하십시오 / 제공하고
  - 보살피고 / 예우하십시오 / 보태고
  lexicon: BDAG
  rationale: 각 동사의 윤리적 기능을 구분해, 강한 자·약한 자·부자·가난한 자의 상호 책임을 한국어로도 선명하게 살렸습니다.
- source_word: ἁγνὸς ἐν τῇ σαρκί
  english_pob_choice: pure in the flesh
  chosen_korean: 육체적으로 순결한 사람
  alternatives_korean:
  - 몸에서 순결한 사람
  - 육신에 있어 순결한 사람
  - 몸의 순결한 사람
  lexicon: BDAG
  rationale: 본문이 단순한 도덕적 순결이 아니라 육체/몸의 차원을 포함하는 표현이므로, 지나치게 성적 의미로만 좁히지 않되 몸의 영역을 분명히 했습니다.
- source_word: ἐκ ποίας ὕλης ... ἐκ ποίου τάφου καὶ σκότους
  english_pob_choice: from what material ... from what tomb and darkness
  chosen_korean: 어떤 재료로 지음 받았는지 ... 그 무덤과 어둠이 무엇이었는지
  alternatives_korean:
  - 어떤 물질로 ... 어떤 무덤과 어둠으로부터
  - 어떤 본질에서 ... 어떤 무덤과 어둠에서
  lexicon: LSJ
  rationale: ὕλη의 물질적 감각과 τάφος/σκότος의 강렬한 이미지가 살아 있도록 직역을 바탕으로 자연스러운 한국어로 조정했습니다.
theological_decisions:
- issue: Χριστῷ Ἰησοῦ의 번역을 이름형이 아니라 직함형으로 유지할지
  chosen_reading: 메시아 예수
  alternative_readings:
  - 그리스도 예수
  - 그리스도이신 예수
  rationale: 프로젝트 기본어휘에 따라 Χριστός는 직함일 때 ‘메시아’로 옮겨야 하며, 본문도 공동체적 권면 속에서 그 직함적 의미가 분명합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: ἁγνὸς ἐν τῇ σαρκί의 범위를 성적 순결로 한정할지
  chosen_reading: 육체적으로 순결한 사람
  alternative_readings:
  - 몸에서 정결한 사람
  - 성적으로 순결한 사람
  rationale: 본구절은 육체/몸의 차원을 말하지만, 문맥상 용어를 좁혀 단정하기보다 넓은 신체적 순결을 보존하는 것이 더 안전합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
