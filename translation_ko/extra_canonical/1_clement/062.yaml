  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Περὶ μὲν τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν καὶ τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν, ἱκανῶς ἐπεστείλαμεν ὑμῖν, ἄνδρες ἀδελφοί. 2. περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους. . καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
  pages:
  - 341
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062.yaml
  text: Now concerning the matters that pertain to our religion[a], and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers. For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance, we have touched on every point, reminding you that you ought to please the Almighty God in holiness, in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were mentioned before, were well-pleasing, humbling themselves before the Father and God and Creator and all people[f][e][d][c][b]. And we have urged these things all the more because we clearly knew that we were writing to faithful and highly esteemed men who have pored over the sayings of God's training.
  footnotes:
  - marker: a
    text: Or 'our worship' or 'our devotion' for 'our religion.'
    reason: lexical_alternative
  - marker: b
    text: The address 'brothers' renders a masculine Greek form; the chapter is addressed to the Corinthian church as a body.
    reason: cultural_note
  - marker: c
    text: '''Free from resentment'' could also be rendered ''not bearing grudges'' or ''without remembering wrongs.'''
    reason: lexical_alternative
  - marker: d
    text: '''The sayings of God''s training'' may also be rendered ''the oracles of God''s instruction.'''
    reason: lexical_alternative
  - marker: e
    text: Or 'have been deeply instructed in'.
    reason: previous_rendering
  - marker: f
    text: Or 'in what concerns the Father and God and Creator and all people'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 종교에 속한 일들과—경건하고 의롭게 삶을 이끌고자 하는 이들에게 가장 유익한 일들에 관하여는—우리가 여러분에게 충분히 편지하였습니다, 형제들이여. 믿음과 회개와 참된 사랑과 절제와 건전한 마음과 인내에 관하여는 우리가 모든 점을 두루 다루면서, 여러분이 전능하신 하나님을 거룩함과 의와 진리와 오래 참음 가운데 기쁘시게 해 드려야 함을 일깨워 드렸습니다. 또한 서로 같은 마음을 품고, 원한을 품지 않으며, 사랑과 평강 가운데 열심 있는 온유함을 가지고, 이전에 언급된 우리의 조상들처럼 아버지이시며 하나님이시며 창조주이시고 또 모든 사람에 대하여 자신을 낮추며 기쁘시게 해 드렸습니다. 그리고 우리가 분명히 알고 있었던 것은, 여러분이 신실하고 매우 존중받는 사람들이며, 하나님의 훈육의 말씀들을 깊이 익힌 사람들이라는 점이었기에, 우리는 이 일들을 더욱더 권하였습니다.[a][b][c][d][e][f]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρησκεία
  english_pob_choice: religion
  chosen_korean: 종교
  alternatives_korean:
  - 예배
  - 경건
  - 신앙
  lexicon: BDAG
  rationale: θρησκεία는 단지 예배 행위만이 아니라 종교적 삶의 영역 전체를 가리키므로, 한국어에서는 문맥상 가장 넓은 대응인 ‘종교’가 적절합니다.
- source_word: διευθύνειν
  english_pob_choice: to order their way
  chosen_korean: 삶을 이끌다
  alternatives_korean:
  - 길을 바로잡다
  - 행로를 정하다
  - 방향을 잡다
  lexicon: LSJ
  rationale: ‘바로 세우다’보다 moral direction의 흐름을 살리면서도 자연스럽게 읽히도록 ‘삶을 이끌다’로 옮겼습니다.
- source_word: σωφροσύνη
  english_pob_choice: sound-mindedness
  chosen_korean: 건전한 마음
  alternatives_korean:
  - 절제된 정신
  - 신중함
  - 분별
  lexicon: BDAG
  rationale: 이 단어는 단순한 절제보다 분별 있고 균형 잡힌 정신 상태를 포함하므로, ‘건전한 마음’이 의미 범위를 비교적 잘 살립니다.
- source_word: ἐψηλαφήσαμεν πάντα τόπον
  english_pob_choice: we have touched on every point
  chosen_korean: 모든 점을 두루 다루면서
  alternatives_korean:
  - 모든 부분을 더듬어 보면서
  - 모든 사항을 살피면서
  - 모든 점을 훑으면서
  lexicon: LSJ
  rationale: 직역하면 어색한 관용구이므로, ‘두루 다루다’로 포괄성과 충분한 논의를 자연스럽게 드러냈습니다.
- source_word: ὁσίως εὐαρεστεῖν
  english_pob_choice: to please ... in holiness
  chosen_korean: 거룩함 가운데 기쁘시게 해 드리다
  alternatives_korean:
  - 경건하게 기쁘시게 하다
  - 거룩하게 하나님을 기쁘시게 하다
  - 거룩하게 하나님을 만족시키다
  lexicon: BDAG
  rationale: ὁσίως는 경건하고 거룩한 방식으로 행하는 태도를 가리키므로, 한국어에서는 ‘거룩함 가운데’로 방식의 의미를 살렸습니다.
- source_word: ὑπενήγκαμεν
  english_pob_choice: we have urged
  chosen_korean: 권하였습니다
  alternatives_korean:
  - 강조하였습니다
  - 권면하였습니다
  - 힘주어 말하였습니다
  lexicon: LSJ
  rationale: 문맥상 단순 전달이 아니라 강한 권면이므로 ‘권하다/권면하다’가 적절하며, 종결은 현대 합쇼체에 맞춰 정리했습니다.
- source_word: λόγια τῆς παιδείας τοῦ θεοῦ
  english_pob_choice: the sayings of God's training
  chosen_korean: 하나님의 훈육의 말씀들
  alternatives_korean:
  - 하나님의 가르침의 말씀들
  - 하나님의 훈련의 말씀들
  - 하나님의 교훈의 말씀들
  lexicon: BDAG
  rationale: παιδεία는 단순 지식 전달보다 훈육·형성의 의미가 있어, 문맥의 교육적·규범적 뉘앙스를 살려 ‘훈육’으로 옮겼습니다.
theological_decisions:
- issue: ἄνδρες ἀδελφοί의 남성형 호칭을 어떻게 처리할지
  chosen_reading: ‘형제들이여’로 직접 호칭을 유지했습니다.
  alternative_readings:
  - 형제자매들이여
  - 여러분
  - 사랑하는 이들이여
  rationale: 그리스어의 직접 호칭 형식을 보존하되, 회중 전체를 향한 문맥은 유지했습니다. 이후의 ἀνδράσιν은 ‘사람들’이 아니라 남성형을 반영해 ‘사람들’로 일반화하지 않고 별도 지칭을 살렸습니다.
  doctrine_reference: Gender-accurate translation over gender-neutral smoothing
- issue: τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους의 관계를 어떻게 옮길지
  chosen_reading: ‘아버지이시며 하나님이시며 창조주이시고 또 모든 사람에 대하여 자신을 낮추며’로 옮겼습니다.
  alternative_readings:
  - ‘아버지와 하나님과 창조주와 모든 사람을 향하여’
  - ‘아버지와 하나님과 창조주와 모든 사람 앞에서’
  rationale: 여기서 핵심은 조상들의 겸손이 특정 대상들에 대한 태도라는 점이므로, 단순한 전치사 반복보다 관계를 드러내는 표현으로 옮겼습니다. 다만 ‘자신을 낮추며’는 뒤의 ταπεινοφρονοῦντες를 반영합니다.
  doctrine_reference: Preserve relational force while making idiom readable
