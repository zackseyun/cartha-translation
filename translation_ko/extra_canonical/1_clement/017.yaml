- source_word: ἐπὶ τῆς βάτου χρηματισμοῦ αὐτῷ δεδομένου
  english_pob_choice: when a divine message was given to him at the bush
  chosen_korean: 떨기나무에서 그에게 신탁이 주어졌을 때
  alternatives_korean:
