- source_word: ἄμεμπτος, ἀληθινός, θεοσεβής, ἀπεχόμενος ἀπὸ παντὸς κακοῦ
  english_pob_choice: righteous and blameless, true, God-fearing, and abstaining from every evil
  chosen_korean: 의롭고 흠이 없으며 참되고 하나님을 경외하며 모든 악에서 떠나 있었습니다
  alternatives_korean:
  - 의롭고 흠이 없으며 참되며 하나님을 경외하고 모든 악을 멀리하며
