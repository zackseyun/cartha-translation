  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/017.yaml
  text: 'Let us also become imitators of those who went about in goatskins and sheepskins[a], proclaiming the coming of the Messiah. We mean Elijah and Elisha, and also Ezekiel, and the prophets; and besides these, those who have been testified to. 2. Abraham was greatly testified to and was called the friend of God, and looking intently at the glory of God, he says in humility, “But I am dust and ashes.” 3. And moreover, concerning Job it is thus written: “Now Job was righteous and blameless, true, God-fearing, and abstaining from every evil.” 4. But he himself accuses himself, saying, “No one is clean from defilement, not even if his life is but one day.” 5. Moses was called faithful in all his house, and through his service God judged Egypt through the plagues and their torments; yet even he, though greatly glorified, did not become high-minded, but said, when a divine message was given to him at the bush, “Who am I, that you send me? But I am weak-voiced and slow of tongue.” 6. And again
    he says[b][c][d][e], “But I am steam from a pot.”'
  footnotes:
  - marker: a
    text: The clothing imagery recalls the scriptural description of prophetic hardship and may echo Hebrews 11:37.
    reason: cross_reference
    anchor_ref: '17:1'
  - marker: e
    text: The wording reflects a traditional scriptural citation about human impurity and brevity of life; the exact form differs from the standard text of Job in some manuscripts.
    reason: textual_variant
    anchor_ref: '17:4'
  - marker: d
    text: Or “steam from a pot.” The image emphasizes frailty and insubstantiality.
    reason: lexical_alternative
    anchor_ref: '17:6'
  - marker: c
    text: Or 'by their plagues and torments'.
    reason: previous_rendering
  - marker: b
    text: Or 'And concerning Job'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 우리도 그들처럼 본받는 자가 됩시다. 그들은 염소 가죽과 양 가죽을 입고 다니며 메시아의 오심을 선포했습니다. 우리는 엘리야와 엘리사, 그리고 에스겔, 곧 예언자들을 말합니다. 이 밖에도 증언을 받은 사람들도 있습니다. 2. 아브라함은 크게 증언을 받았고 하나님의 친구라고 불렸으며, 하나님의 영광을 뚫어지게 바라보며 겸손하게 말했습니다. 「나는 흙이요 재입니다」. 3. 또 욥에 관하여는 이렇게 기록되어 있습니다. 「욥은 의롭고 흠이 없으며 참되고 하나님을 경외하며 모든 악에서 떠나 있었습니다」. 4. 그러나 그는 스스로를 고발하여 이렇게 말합니다. 「사람의 생명이 하루뿐이라 해도, 더러운 것에서 깨끗한 이는 아무도 없습니다」. 5. 모세는 자기 집안의 모든 일에 신실한 사람으로 불렸고, 그의 섬김을 통해 하나님께서는 이집트를 그들에게 내리신 재앙과 고통으로 심판하셨습니다. 그러나 그도 크게 영광을 받았지만 교만해지지 않았습니다. 오히려 떨기나무에서 그에게 신탁이 주어졌을 때 이렇게 말했습니다. 「제가 누구이기에, 당신이 저를 보내십니까? 저는 말이 약하고 혀가 느립니다」. 6. 또 다시 말합니다. 「나는 솥에서 올라오는 수증기와 같습니다」.[a][b][c][d][e]
  philosophy: optimal-equivalence
