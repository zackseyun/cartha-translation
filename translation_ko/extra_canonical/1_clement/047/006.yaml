  to: 사랑하는 여러분, 매우 굳건하고 오래된 고린도 교회가 한두 사람 때문에 장로들과 맞서 분쟁을 일으킨다는 말을 듣는 것은 참으로 부끄럽고, 그리스도 안에서의 행실[a]에 합당하지 않은 일입니다.
  rationale: 원문의 판단 구조를 한국어에서 한 문장으로 재구성하여 αἰσχρά의 반복 강조(‘참으로 부끄럽고’)와 ἀνάξια의 병렬 판단을 보존했습니다. ‘고린도 교회’는 ἐκκλησία의 통상적 한국어 성서 용례를 따르며, ‘장로들과 맞서 분쟁을 일으킨다’는 πρὸς와 στασιάζειν의 대항적·분열적 성격을 함께 반영합니다. 각주는 관련 어구에 직접 배치했습니다.
