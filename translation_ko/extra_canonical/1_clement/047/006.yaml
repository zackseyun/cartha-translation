source:
  edition: Funk 1901 (normalized OCR)
  text: αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/006.yaml
  text: It is shameful[a], beloved—very shameful and unworthy of conduct in Christ—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons.
  footnotes:
  - marker: a
    text: Or 'conduct in the Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 여러분, 매우 굳건하고 오래된 고린도 교회가 한두 사람 때문에 장로들과 맞서 분쟁을 일으킨다는 말을 듣는 것은 참으로 부끄럽고, 그리스도 안에서의 행실[a]에 합당하지 않은 일입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘메시아 안에서의 행실’.
    reason: ἐν Χριστῷ를 ‘그리스도 안에서’로 옮긴 본문 번역을 유지하되, 영어 POB 감사 이력에 보존된 대안적 호칭 번역을 제시합니다.
lexical_decisions:
- source_word: αἰσχρά / λίαν αἰσχρὰ
  english_pob_choice: shameful / very shameful
  chosen_korean: 부끄러운 일이며—참으로 부끄럽고
  alternatives_korean:
  - 수치스러운
  - 창피한
  - 참으로 수치스럽고
  lexicon: αἰσχρός
  rationale: 두 번 반복된 수치 표현을 한국어에서도 중복 강세로 살려, 단순한 도덕적 흠이 아니라 공개적으로 수치스러운 성격을 드러내도록 했습니다.
- source_word: ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς
  english_pob_choice: unworthy of conduct in Christ
  chosen_korean: 그리스도 안에서의 행실에 합당하지 않습니다
  alternatives_korean:
  - 그리스도 안의 삶에 합당하지 않습니다
  - 메시아 안에서의 행실에 합당하지 않습니다
  - 그리스도 안에서의 처신에 어울리지 않습니다
  lexicon: ἀγωγή
  rationale: ἀγωγή를 단순한 ‘행동’보다 삶의 방식·행실로 옮겨, ‘~에 합당하지 않다’는 평가를 자연스럽고 직설적으로 전달했습니다.
- source_word: ἐκκλησία
  english_pob_choice: church
  chosen_korean: 회중
  alternatives_korean:
  - 교회
  - 공동체
  lexicon: ἐκκλησία
  rationale: 본문은 제도 기관보다 모인 신자들의 집합체를 가리키므로, 1세기적 감각을 살려 ‘회중’으로 옮겼습니다.
- source_word: στασιάζειν πρὸς τοὺς πρεσβυτέρους
  english_pob_choice: is in revolt against the elders
  chosen_korean: 장로들을 상대로 분쟁을 일으킨다는
  alternatives_korean:
  - 장로들에게 반란을 일으킨다는
  - 장로들을 거슬러 다툰다는
  - 장로들에게 대항해 소요를 일으킨다는
  lexicon: στασιάζω / πρεσβύτερος
  rationale: στασιάζειν은 단순한 말다툼보다 집단적 분열·소요의 뉘앙스가 있어 ‘분쟁을 일으킨다’로, πρεσβυτέρους는 교회 직분 맥락의 ‘장로들’로 옮겼습니다.
theological_decisions:
- issue: ἐν Χριστῷ의 번역 관용
  chosen_reading: 그리스도 안에서
  alternative_readings:
  - 메시아 안에서
  - 그리스도에게 속한
  rationale: 영문 POB의 최신 감수처럼, 1세기 교회 내에서 고정된 관용구로 기능하는 표현이므로 ‘메시아’보다 표준 교회어인 ‘그리스도 안에서’를 유지했습니다.
  doctrine_reference: 초대교회 관용구와 기독론적 호칭의 관행
