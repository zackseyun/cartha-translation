    rationale: προσκλίσεις는 편향, 편들기, 당파적 기울어짐을 가리키며, 여기서는 ‘편파를 보였다’가 자연스럽게 이를 전달합니다. ‘일으키다’는 보통 소요·논쟁·분열 등에 결합하므로 본문의 표현을 불필요하게 사건화합니다.
