source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπ’ ἀληθείας πνευματικῶς ἐπέστειλεν ὑμῖν περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ, διὰ τὸ καὶ τότε προσκλίσεις ὑμᾶς πεποιῆσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/003.yaml
  text: In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had made partialities.
translation:
  language: ko
  text: 참으로 그는 자기 자신과 게바와 아볼로에 관하여 영적인 방식으로 여러분에게 편지를 썼습니다. 그때에도 여러분이 편파를 보였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  english_pob_choice: In truth
  chosen_korean: 참으로
  alternatives_korean:
  - 진실로
  - 사실로
  lexicon: ἐπ’ ἀληθείας
  rationale: 서두의 강조 표현을 자연스러운 합쇼체로 살리되, 문장 전체의 수사적 힘을 약화시키지 않도록 ‘참으로’로 옮겼습니다.
- source_word: πνευματικῶς
  english_pob_choice: spiritually
  chosen_korean: 영적으로
  alternatives_korean:
  - 성령 안에서
  - 영 안에서
  lexicon: πνευματικῶς
  rationale: 영적 방식/성격을 나타내는 부사이므로, POB의 수정 취지에 맞춰 ‘in the Spirit’보다 직접적인 ‘영적으로’로 옮겼습니다.
- source_word: προσκλίσεις
  english_pob_choice: partialities
  chosen_korean: 편파를 일으켰기
  alternatives_korean:
  - 편파를 보였기
  - 당파심을 드러냈기
  - 분파를 만들었기
  lexicon: προσκλίσεις
  rationale: 단순한 내적 태도보다 실제로 사람을 기울게 하는 편향/편파의 결과를 가리키므로, ‘편파를 일으키다’로 옮겨 분열적 뉘앙스를 살렸습니다.
- source_word: Κηφᾶ τε καὶ Ἀπολλώ
  english_pob_choice: Cephas and Apollos
  chosen_korean: 게바와 아볼로
  alternatives_korean:
  - 케파와 아볼로
  - 베드로와 아볼로
  lexicon: 고유명사
  rationale: 교회 전통보다 헬라어 음가를 따라 ‘게바’를 유지하고, 통용 표기인 ‘아볼로’를 사용했습니다.
theological_decisions:
- issue: πνευματικῶς의 의미를 '성령 안에서'로 구체화할지 여부
  chosen_reading: 행위 방식의 부사로서 ‘영적으로’라고 옮겨, 본문이 명시하지 않는 성령 직접 언급을 추가하지 않았습니다.
  alternative_readings:
  - 성령 안에서 편지했습니다
  - 영 안에서 편지했습니다
  rationale: 원문은 πνευματικῶς를 사용해 글의 성격을 묘사할 뿐이므로, 해석을 과도하게 특정하지 않고 문맥상 충분한 ‘영적으로’를 선택했습니다.
  doctrine_reference: 본문 문맥 및 부사 용법
