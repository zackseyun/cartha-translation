  to: 참으로 그는 자기 자신과 게바와 아볼로에 관하여 영적인 방식으로 여러분에게 편지를 썼습니다. 그때에도 여러분이 편파를 보였기 때문입니다.
  rationale: 원문의 의미와 영어 POB 감사 기록의 ‘spiritually’ 및 ‘partialities’를 보존하면서, 한국어의 자연스러운 연어와 문장 구조를 바로잡았습니다. ‘편파를 보이다’는 원문이 말하는 편향적 편들기를 전달하되, ‘분파를 만들다’처럼 더 강한 조직적 분열을 단정하지 않습니다.
