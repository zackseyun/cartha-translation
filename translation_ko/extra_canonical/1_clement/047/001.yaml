  text: Take up the letter of the blessed Paul the apostle.
translation:
  language: ko
  text: 바울 사도인 복된 바울의 편지를 받아 보십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναλάβετε
  english_pob_choice: Take up
  chosen_korean: 받아 보십시오
  alternatives_korean:
  - 취하십시오
  - 들어 보십시오
  - 펴 보십시오
  lexicon: ἀναλαμβάνω
  rationale: 문맥상 단순히 ‘집어 들다’보다 서신을 꺼내어 읽고 확인하라는 촉구이므로, 현대 한국어에서 자연스럽고 행위의 완료를 포함하는 ‘받아 보십시오’를 택했습니다.
- source_word: τὴν ἐπιστολήν
  english_pob_choice: the letter
  chosen_korean: 편지
  alternatives_korean:
  - 서신
  - 편지글
  lexicon: ἐπιστολή
  rationale: 고전적 서신 형식이지만 현대 독자에게는 ‘편지’가 가장 직접적으로 전달되므로 이를 사용했습니다.
- source_word: τοῦ μακαρίου Παύλου τοῦ ἀποστόλου
  english_pob_choice: of the blessed Paul the apostle
  chosen_korean: 사도인 복된 바울의
  alternatives_korean:
  - 복된 바울 사도의
  - 사도 바울의 복된
  lexicon: μακάριος / ἀπόστολος
  rationale: μακάριος는 단순 칭찬이 아니라 ‘복된’이라는 축복적 형용사이므로 유지했고, ἀπόστολος는 ‘사도’로 옮기되 ‘바울 사도’의 명사구를 한국어 어순에 맞춰 재배열했습니다.
theological_decisions:
- issue: μακάριος의 뉘앙스
  chosen_reading: ‘복된’은 바울에 대한 경건한 축복적 평가로 유지합니다.
  alternative_readings:
  - ‘행복한’
  - ‘복이 있는’
  rationale: 본문은 바울의 사도직을 높이 평가하는 문맥이므로, 일상적 감정 상태를 뜻하는 ‘행복한’보다 축복·존귀의 의미를 드러내는 ‘복된’이 더 적절합니다.
  doctrine_reference: 성경 본문 내 칭송적 형용사의 기본 의미 보존
