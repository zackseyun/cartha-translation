id: 1CLEM.47.4
reference: 1 Clement 47:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλ’ ἡ πρόσκλισις ἐκείνη ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν· προσεκλίθητε γὰρ ἀποστόλοις μεμαρτυρημένοις καὶ ἀνδρὶ δεδοκιμασμένῳ παρ’ αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/004.yaml
  text: But that partiality brought less sin upon you; for you inclined yourselves toward apostles who had been approved[a], and toward a man approved by them.
  footnotes:
  - marker: a
    text: Or 'were aligning yourselves with apostles of approved testimony, and with a man tested by them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 그 부분적인 편파는 여러분에게 덜한 죄를 가져왔습니다. 왜냐하면 여러분이 승인받은 사도들 쪽으로, 그리고 그들에 의해 승인받은 한 사람 쪽으로 기울었기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πρόσκλισις
  english_pob_choice: partiality
  chosen_korean: 부분적인 편파
  alternatives_korean:
  - 편파
  - 치우침
  - 편향
  lexicon: πρόσκλισις
  rationale: 문맥상 단순한 ‘기울어짐’보다 사람을 편드는 태도를 가리키므로, ‘편파’를 중심으로 하되 수식어를 붙여 원문의 부분성(그 부분적인 편향)을 드러냈습니다.
- source_word: ἧσσον ἁμαρτίαν
  english_pob_choice: brought less sin upon you
  chosen_korean: 여러분에게 덜한 죄를 가져왔습니다
  alternatives_korean:
  - 여러분에게 더 적은 죄를 가져왔습니다
  - 여러분의 죄를 덜하게 했습니다
  lexicon: ἧσσον + ἁμαρτίαν προσήνεγκεν
  rationale: 죄의 정도가 ‘적어졌다’는 비교를 살려, 단순히 결과를 약화시키지 않도록 ‘덜한 죄를 가져왔습니다’로 옮겼습니다.
- source_word: προσεκλίθητε
  english_pob_choice: you inclined yourselves toward
  chosen_korean: 여러분이 … 쪽으로 기울었기 때문입니다
  alternatives_korean:
  - 여러분이 … 쪽으로 기울었기 때문입니다
  - 여러분이 … 편에 섰기 때문입니다
  - 여러분이 … 쪽으로 마음을 기울였기 때문입니다
  lexicon: προσεκλίθητε
  rationale: 동사의 방향성을 살려 ‘~쪽으로 기울다’로 번역했고, 영어 POB의 ‘inclined yourselves toward’에 대응하면서도 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: μεμαρτυρημένοις / δεδοκιμασμένῳ
  english_pob_choice: had been approved / approved by them
  chosen_korean: 승인받은 / 그들에 의해 승인받은
  alternatives_korean:
  - 입증된 / 그들에 의해 입증된
  - 검증된 / 그들에 의해 검증된
  - 인정받은 / 그들에 의해 인정받은
  lexicon: μεμαρτυρημένοις, δεδοκιμασμένῳ
  rationale: 두 분사 모두 결과 상태를 강조하므로, 시험의 과정보다 인정·승인된 상태를 드러내는 ‘승인받은’을 선택했습니다. 다만 동일어 반복이 너무 단조롭지 않도록 첫 번째는 집합적 대상(사도들), 두 번째는 단수 인물에 맞춰 문장 구조를 달리했습니다.
theological_decisions:
- issue: 사도들과 한 인물에 대한 ‘승인/입증’의 반복
  chosen_reading: 사도들은 이미 승인받은 사람들로, 그들과 연계된 한 사람도 그들에 의해 승인받은 인물로 제시했습니다.
  alternative_readings:
  - 입증된 증언을 가진 사도들
  - 시험을 거친 사도들
  rationale: 원문은 두 분사를 병렬로 두어 신뢰성과 공적 인정의 상태를 강조합니다. 이를 약화시키지 않기 위해 ‘시험을 거친’보다 결과 상태인 ‘승인받은’을 유지했습니다.
  doctrine_reference: 교회 권위와 사도적 신뢰성에 대한 고대 문헌의 수사
