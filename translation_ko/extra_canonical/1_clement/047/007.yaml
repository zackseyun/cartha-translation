- from: 그리고 그 소문은 우리에게만이 아니라 우리와 갈린 자들에게도 퍼져, 너희의 어리석음 때문에 주님의 이름에까지 심지어 비방이 더해지며, 너희 자신에게는 위험을 불러오고 있습니다.[a][b]
  to: 그리고 그 소문은 우리에게만 아니라 우리와 멀어진 이들에게도 전해졌습니다. 그 결과 너희의 어리석음 때문에 주님의 이름이 비방까지 받게 되고, 너희는 자신들에게 위험을 초래합니다.
