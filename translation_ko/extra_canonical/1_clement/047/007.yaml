  source_fidelity: 핵심 의미는 대체로 충실하지만, ἡ ἀκοή의 도달을 ‘퍼져’로 옮긴 것은 다소 느슨하며, ‘우리와 갈린 자들’은 원문의 ἑτεροκλινεῖς ἀφ’ ἡμῶν가 가리키는 우리와 소원하거나 다른 편에 있는 이들을 불필요하게 분열 집단처럼 들리게 할 수 있습니다. 또한 결과 절에서 비방이 주님의 이름에 가해지는 인과관계를 더 분명히 드러낼 필요가 있습니다.
  naturalness: ‘우리에게만이 아니라’는 현대 표준어로 ‘우리에게만 아니라’가 자연스럽습니다. 원문의 두 결과를 문장으로 명료하게 분리하고, 합쇼체 종결을 유지하도록 다듬었습니다.
  terminology: κύριος는 ‘주님’, ἀφροσύνη는 ‘어리석음’으로 적절합니다. βλασφημία는 이 문맥에서 ‘비방’으로 옮길 수 있으나, ‘주님의 이름이 비방을 받게 되다’라고 표현하는 편이 한국어 관용과 원문의 수동 표현을 함께 살립니다.
