id: 1CLEM.47.7
reference: 1 Clement 47:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/007.yaml
  text: And the report has reached not only us[a], but also those who are estranged from us, so that even blasphemies are brought upon the name of the Lord because of your foolishness[b], while you bring danger upon yourselves.
  footnotes:
  - marker: a
    text: Or 'those who are of a different mind from us'.
    reason: previous_rendering
  - marker: b
    text: Or 'so that blasphemies'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 소문은 우리에게만이 아니라 우리와 갈린 자들에게도 퍼져, 너희의 어리석음 때문에 주님의 이름에까지 심지어 비방이 더해지며, 너희 자신에게는 위험을 불러오고 있습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀκοή
  english_pob_choice: the report
  chosen_korean: 그 소문
  alternatives_korean:
  - 그 보고
  - 그 소식
  lexicon: ἀκοή
  rationale: 문맥상 단순한 ‘들음’이 아니라 퍼져 나간 소문/보고를 가리키므로, 자연스럽고 경고의 뉘앙스를 살린 ‘소문’을 택했습니다.
- source_word: τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν
  english_pob_choice: those who are estranged from us
  chosen_korean: 우리와 갈린 자들
  alternatives_korean:
  - 우리와 뜻이 다른 이들
  - 우리에게서 멀어진 이들
  lexicon: ἑτεροκλινής + ἀπό
  rationale: 공동체 내부의 단순한 의견 차이보다, 우리로부터 떨어져 나온/떨어진 사람들을 뜻하는 방향성이 강하므로 ‘우리와 갈린 자들’로 옮겼습니다.
- source_word: βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου
  english_pob_choice: blasphemies are brought upon the name of the Lord
  chosen_korean: 주님의 이름에까지 심지어 비방이 더해지며
  alternatives_korean:
  - 주님의 이름에까지 심지어 신성모독이 가해지며
  - 주님의 이름 위에 심지어 비방이 덮이며
  lexicon: βλασφημία + ἐπιφέρω
  rationale: βλασφημία는 여기서 대중이 이해할 수 있는 ‘비방’이 가장 직접적이며, ἐπιφέρεσθαι의 수동적 결과를 ‘더해지며’로 살려 이름에 가해지는 누적적 손상을 표현했습니다.
- source_word: ὑμετέραν ἀφροσύνην
  english_pob_choice: your foolishness
  chosen_korean: 너희의 어리석음
  alternatives_korean:
  - 너희의 무분별함
  - 너희의 어리석은 행실
  lexicon: ἀφροσύνη
  rationale: 도덕적 판단을 드러내되 과도하게 해석하지 않기 위해, ‘어리석음’으로 직역에 가깝게 옮겼습니다.
- source_word: ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι
  english_pob_choice: while you bring danger upon yourselves
  chosen_korean: 너희 자신에게는 위험을 불러오고 있습니다
  alternatives_korean:
  - 너희 자신에게 위험을 만들어 내고 있습니다
  - 너희 자신을 위험에 빠뜨리고 있습니다
  lexicon: κίνδυνον ἐξεργάζομαι
  rationale: ‘위험을 만들어 내다/불러오다’의 결과적 뉘앙스를 살리되, 한국어로 자연스러운 현재 진행형으로 정리했습니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 본문의 κυρίου는 예수/주께 대한 호칭으로 읽히므로, 한국어에서 경외와 지칭성을 함께 담는 ‘주님’을 택했습니다.
  doctrine_reference: 그리스도론적 호칭의 일반적 한국어 용례
- issue: βλασφημία의 강도
  chosen_reading: 비방
  alternative_readings:
  - 신성모독
  - 모독
  rationale: 이 구절은 공동체의 어리석음으로 인해 주님의 이름이 외부에서 훼손되는 상황을 말하므로, 법정적·교리적 용어보다 대외적 명예 훼손을 드러내는 ‘비방’이 문맥에 더 맞습니다.
  doctrine_reference: 교회 윤리와 공적 증언
