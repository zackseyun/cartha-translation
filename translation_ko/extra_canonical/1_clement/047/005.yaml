revisions:
- from: 그러므로 이제 누가 여러분을 잘못된 길로 이끌었는지 살피고, 여러분의 널리 알려진 형제 사랑의 품위를 떨어뜨린 사람이 누구인지 살피십시오.[a][b]
  to: 그러나 이제 어떤 이들이 여러분을 그릇된 길로 이끌고 여러분의 널리 알려진 형제 사랑의 품위를 떨어뜨렸는지 살피십시오.
  rationale: 접속사의 의미를 ‘그러나’로 바로잡고, 복수 주어 ‘어떤 이들이’가 ‘이끌고’와 ‘떨어뜨렸는지’의 두 동작을 함께 수행하도록 문장을 재구성했습니다. 원문이나 영어 감사 기록에서 번역상 남겨 둘 실질적 이문·모호성이 없으므로 각주 표지는 제거했습니다.
