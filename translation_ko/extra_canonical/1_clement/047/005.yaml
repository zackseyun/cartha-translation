id: 1CLEM.47.5
reference: 1 Clement 47:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: νυνὶ δὲ κατανοήσατε, τίνες ὑμᾶς διέστρεψαν καὶ τὸ σεμνὸν τῆς περιβοήτου φιλαδελφίας ὑμῶν ἐμείωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047/005.yaml
  text: But now consider who led you astray and diminished the dignity of your renowned brotherly love[a][b].
  footnotes:
  - marker: a
    text: Or 'who it is that has perverted you'.
    reason: previous_rendering
  - marker: b
    text: Or 'widely spoken-of'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 이제 어떤 이들이 여러분을 그릇된 길로 이끌고 여러분의 널리 알려진 형제 사랑의 품위를 떨어뜨렸는지 살피십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ κατανοήσατε
  english_pob_choice: But now consider
  chosen_korean: 그러므로 이제 … 살피십시오
  alternatives_korean:
  - 하지만 이제 … 생각하십시오
  - 그러나 이제 … 고려하십시오
  lexicon: κατανοέω
  rationale: 단순한 지적 요청보다 원인을 분별해 보라는 뉘앙스가 있어 ‘살피다’로 옮기고, 문맥 연결은 ‘그러므로 이제’로 자연스럽게 살렸습니다.
- source_word: τίνες ὑμᾶς διέστρεψαν
  english_pob_choice: who led you astray
  chosen_korean: 누가 여러분을 잘못된 길로 이끌었는지
  alternatives_korean:
  - 누가 여러분을 빗나가게 했는지
  - 누가 여러분을 왜곡했는지
  lexicon: διεστρέφω
  rationale: 형태상 복수 주체가 분명하므로 ‘누가’로 유지했고, 사람을 오도한 결과를 드러내기 위해 직역적 ‘왜곡하다’보다 ‘잘못된 길로 이끌다’를 택했습니다.
- source_word: τὸ σεμνὸν … ἐμείωσαν
  english_pob_choice: diminished the dignity
  chosen_korean: …의 품위를 떨어뜨린
  alternatives_korean:
  - …의 존귀함을 줄인
  - …의 품격을 낮춘
  lexicon: σεμνός
  rationale: σεμνὸν은 단순한 크기 감소보다 품격·품위의 훼손을 가리키므로 ‘품위’를 사용해 문맥의 도덕적·공동체적 톤을 보존했습니다.
- source_word: τῆς περιβοήτου φιλαδελφίας ὑμῶν
  english_pob_choice: your renowned brotherly love
  chosen_korean: 여러분의 널리 알려진 형제 사랑
  alternatives_korean:
  - 여러분의 유명한 형제 사랑
  - 여러분의 널리 회자되는 형제 사랑
  lexicon: φιλαδελφία, περιβόητος
  rationale: φιλαδελφία는 교회적 관용어인 ‘형제 사랑’으로, περιβοήτου는 과장된 ‘유명한’보다 공적 평판을 살리는 ‘널리 알려진’으로 옮겼습니다.
theological_decisions:
- issue: 공동체적 책망의 수사 방식
  chosen_reading: 개인을 겨냥한 추상적 비난보다, 복수의 가해자와 그들이 훼손한 공동체의 명예를 함께 드러내는 문장으로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘여러분을 미혹한 자들’이라고만 번역할 수 있음
  - ‘형제 사랑의 존귀함’을 더 직접적으로 ‘존귀함’으로 옮길 수 있음
  rationale: 원문은 복수 주체와 공동체적 손상을 함께 제시하므로, 한국어에서도 책망의 대상과 상처의 범위를 분명히 드러내는 것이 의미 보존에 유리합니다.
  doctrine_reference: 공동체 윤리와 형제 사랑(1 Clement의 교회 권면 맥락)
- issue: register choice in imperative
  chosen_reading: 권면체로서 ‘살피십시오’를 반복하여, 촉구와 경고의 강도를 유지했습니다.
  alternative_readings:
  - ‘생각하십시오’
  - ‘주의하십시오’
  rationale: 원문의 명령형은 단순 숙고가 아니라 책임 있는 분별을 요구하므로, 합쇼체 권면으로 강도를 살렸습니다.
  doctrine_reference: 권면적 명령의 문체 보존
