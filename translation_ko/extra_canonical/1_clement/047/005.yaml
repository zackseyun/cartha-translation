review_pass:
  verdict: revise
  source_fidelity: 원문의 δέ는 앞 문맥에 대한 대조·전환이므로 ‘그러므로’보다 ‘그러나’가 적절합니다. 또한 τίνες와 διέστρεψαν/ἐμείωσαν은 모두 복수이며, 두 동사는 같은 주어를 공유합니다. 초안은 두 번째 절에 ‘사람이 누구인지’를 덧붙여 단수의 별도 행위자처럼 만들고 명령을 불필요하게 반복합니다.
  naturalness: ‘그러나 이제 어떤 이들이 … 이끌고 … 떨어뜨렸는지 살피십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 책망하는 권면의 문체도 유지합니다.
  terminology: φιλαδελφία의 ‘형제 사랑’, σεμνόν의 ‘품위’, περιβοήτου의 ‘널리 알려진’은 문맥과 교회적 관용을 무리 없이 반영합니다. ‘그릇된 길로 이끌다’는 διέστρεψαν의 비유적 오도를 자연스럽게 옮깁니다.
  issues:
  - severity: medium
    issue: 접속사 δέ를 ‘그러므로’로 번역함
    rationale: δέ는 일반적으로 ‘그러나/그런데’의 대조·전환을 나타내며, 원문에는 ‘그러므로’에 해당하는 추론 접속사가 없습니다.
  - severity: high
    issue: 동일한 복수 주어와 병렬 동작이 두 개의 별도 의문절로 분리됨
    rationale: τίνες가 διέστρεψαν과 ἐμείωσαν 양쪽의 주어입니다. ‘… 떨어뜨린 사람이 누구인지’는 단수 주어를 도입하고 원문의 단일 질문 및 병렬 구조를 훼손합니다.
  - severity: low
    issue: ‘살피십시오’의 불필요한 반복
    rationale: 원문에는 κατανοήσατε라는 명령이 한 번만 있으며, 한국어에서도 한 번의 명령으로 두 동작을 함께 목적절 안에 두는 편이 더 자연스럽습니다.
  revised_text: 그러나 이제 어떤 이들이 여러분을 그릇된 길로 이끌고 여러분의 널리 알려진 형제 사랑의 품위를 떨어뜨렸는지 살피십시오.
