source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα, ἀγαπητοί, οὐ μόνον ὑμᾶς νουθετοῦντες ἐπεστέλλομεν, ἀλλὰ καὶ ἑαυτοὺς ὑπομιμνήσκοντες· ἐν γὰρ τῷ αὐτῷ ἐσμὲν σκάμματι, καὶ ὁ αὐτὸς ἡμῖν ἀγὼν ἐπίκειται. 2. διὸ ἀπολίπωμεν τὰς κενὰς καὶ ματαίας φροντίδας, καὶ ἔλθωμεν ἐπὶ τὸν εὐκλεῆ καὶ σεμνὸν τῆς παραδόσεως ἡμῶν κανόνα. 3. καὶ ἴδωμεν, τί καλὸν καὶ τί τερπνὸν καὶ τί προσδεκτὸν τῷ ποιήσαντι ἡμᾶς. . ἀτενίσωμεν εἰς τὸ αἷμα τοῦ Χριστοῦ καὶ γνῶμεν, ὡς ἔστιν τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ, ὅτι διὰ τὴν ἡμετέραν σωτηρίαν ἐκχυθὲν παντὶ τῷ κόσμῳ μετανοίας χάριν διήνεγκεν. 5. διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν. 6. Νῶε ἐκήρυξεν μετάνοιαν, καὶ οἱ ὑπακούσαντες ἐσώθησαν. 7. Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
  pages:
  - 271
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007.yaml
  text: These things[a], beloved, we have written not only to admonish you, but also to remind ourselves; for we are in the same arena, and the same struggle lies before us. Therefore let us leave behind empty and futile concerns, and let us come to the glorious and solemn rule of our tradition. And let us see what is good, and what is pleasing, and what is acceptable to the one who made us. Let us fix our gaze on the blood of the Messiah and understand how precious it is to God, his Father, because[a], having been poured out for our salvation, it brought the grace of repentance to the whole world. Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn back to him. Noah proclaimed repentance, and those who obeyed were saved. Jonah proclaimed destruction to the Ninevites; but when they repented of their sins, they appeased God by their supplication and received salvation[b][c][d][d][e],
    though they were strangers to God.
  footnotes:
  - marker: a
    text: Or 'the blood of Christ.' The Greek title Χριστός is rendered 'Messiah' here as a title.
    reason: lexical_alternative
    anchor_ref: '7:4'
  - marker: a
    text: '''Brought the grace of repentance to the whole world'' may also be understood as ''brought an opportunity for repentance to the whole world.'''
    reason: alternative_reading
    anchor_ref: '7:4'
  - marker: e
    text: Literally, 'gave a place for repentance.'
    reason: lexical_alternative
    anchor_ref: '7:5'
  - marker: d
    text: Or 'appeased God' / 'propitiated God'; the Greek verb can carry the sense of making atonement or seeking divine favor.
    reason: lexical_alternative
    anchor_ref: '7:7'
  - marker: d
    text: See Jonah 3 for the Ninevites' repentance after Jonah's proclamation of overthrow.
    reason: cross_reference
    anchor_ref: '7:7'
  - marker: c
    text: Or 'made atonement before God'.
    reason: previous_rendering
  - marker: b
    text: Or 'Yonah'.
    reason: previous_rendering
translation:
  language: ko
  text: 이러한 일들을, 사랑하는 이들이여, 우리는 여러분을 훈계하려고만이 아니라 우리 자신을 깨우치려고도 편지했습니다. 왜냐하면 우리는 같은 경기장에 있고, 우리에게도 같은 싸움이 놓여 있기 때문입니다. 그러므로 우리가 비어 있고 헛된 걱정들을 버리고, 우리 전통의 영광스럽고도 엄숙한 규범으로 나아갑시다. 그리고 우리를 만드신 분께 좋은 것, 기쁜 것, 그리고 받아들여질 만한 것이 무엇인지 보도록 합시다. 메시아의 피를 주목하고, 그것이 그의 아버지이신 하나님께 얼마나 귀한 것인지 깨닫읍시다. 그 피는 우리의 구원을 위하여 흘려져 온 세상에 회개의 은혜를 가져왔습니다[a]. 모든 세대를 지나가며 살펴보고, 세대에서 세대로 주께서는 자기에게 돌아오기를 원하는 이들에게 회개의 자리를 주셨다는 것을 자세히 배웁시다[e]. 노아는 회개를 선포했고, 순종한 이들은 구원받았습니다. 요나[a]는 니느웨 사람들에게 멸망을 선포했습니다. 그러나 자기들의 죄를 회개한 그들은 간구로 하나님을 달래어[d] 구원을 받았고[c][d], 비록 하나님에게서 멀리 떨어진 사람들이었음에도 그러했습니다.[b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκάμματι
  english_pob_choice: arena
  chosen_korean: 경기장
  alternatives_korean:
  - 운동장
  - 원형경기장
  - 경쟁장
  lexicon: LSJ
  rationale: ἀγών과 함께 쓰인 경쟁 비유를 살리기 위해, 공동의 겨룸터라는 이미지를 자연스럽게 전달하는 ‘경기장’을 택했습니다.
- source_word: ἀγών
  english_pob_choice: struggle
  chosen_korean: 싸움
  alternatives_korean:
  - 경기
  - 투쟁
  - 경쟁
  lexicon: BDAG
  rationale: 본문의 권면적 문맥에서는 단순한 경기보다 긴박한 대결의 뉘앙스가 살아야 하므로 ‘싸움’이 가장 자연스럽습니다.
- source_word: κανόνα
  english_pob_choice: rule
  chosen_korean: 규범
  alternatives_korean:
  - 규칙
  - 표준
  - 법칙
  lexicon: BDAG
  rationale: παραδόσεως와 결합된 κανών은 공동체를 이끄는 권위 있는 기준이므로, 교회 제도어를 과도하게 고정하지 않는 ‘규범’이 적절합니다.
- source_word: τοῦ Χριστοῦ
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 크리스토스
  lexicon: BDAG
  rationale: 직함으로 기능하는 Χριστός는 프로젝트 기본어인 ‘메시아’로 옮겨, 고유명사화된 전통 번역보다 원뜻을 드러냈습니다.
- source_word: μετανοίας χάριν
  english_pob_choice: the grace of repentance
  chosen_korean: 회개의 은혜
  alternatives_korean:
  - 회개의 기회
  - 회개할 기회
  - 회개 은총
  lexicon: BDAG
  rationale: χάρις를 단순한 ‘기회’로 낮추기보다, 회개 자체가 은혜로 주어진다는 문맥을 살려 ‘회개의 은혜’로 옮겼습니다.
- source_word: μετανοίας τόπον
  english_pob_choice: a place for repentance
  chosen_korean: 회개의 자리
  alternatives_korean:
  - 회개할 자리
  - 회개의 기회
  - 회개의 공간
  lexicon: BDAG
  rationale: 직역적 이미지인 ‘place’를 유지하되, 한국어에서 지나치게 물리적으로 들리지 않도록 ‘자리’로 자연화했습니다.
- source_word: ἐξιλάσαντο
  english_pob_choice: made atonement before God
  chosen_korean: 하나님을 달래어
  alternatives_korean:
  - 하나님께 속죄하여
  - 하나님을 화목하게 하여
  - 하나님께 간청하여
  lexicon: LSJ
  rationale: 문맥상 니느웨 사람들의 간구가 하나님의 호의를 구하는 방향으로 제시되므로, 단순한 정서 완화보다 ‘달래어’가 원문 동사를 더 직접적으로 반영합니다.
- source_word: ἱκετεύσαντες
  english_pob_choice: by their supplication
  chosen_korean: 간구로
  alternatives_korean:
  - 탄원으로
  - 애원하여
  - 간청하여
  lexicon: BDAG
  rationale: ἱκετεύω의 격식을 살리면서도 문장 흐름을 자연스럽게 하기 위해 도구적 표현 ‘간구로’를 사용했습니다.
- source_word: ἀλλότριοι τοῦ θεοῦ
  english_pob_choice: strangers to God
  chosen_korean: 하나님에게서 멀리 떨어진 사람들이
  alternatives_korean:
  - 하나님과 낯선 사람들이
  - 하나님께 속하지 않은 사람들이
  - 하나님에게서 소외된 사람들이
  lexicon: BDAG
  rationale: 관계적 거리와 외부자성을 함께 드러내기 위해, 직역의 낯섦을 유지하면서도 한국어로는 ‘멀리 떨어진’이 가장 이해하기 쉽습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 본문에서 Χριστός는 이름보다 칭호로 기능하므로, 프로젝트 기본 용례에 따라 ‘메시아’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: ἐξιλάσαντο τὸν θεόν의 뉘앙스
  chosen_reading: 하나님을 달래어
  alternative_readings:
  - 하나님께 속죄하여
  - 하나님을 화목하게 하여
  - 하나님께 간청하여
  rationale: 니느웨인의 회개와 간구가 하나님의 응답을 이끌어 냈다는 서술을 살리되, 지나치게 교리화된 ‘속죄’로 고정하지 않기 위해 중간 강도의 표현을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
