id: 1CLEM.7.2
reference: 1 Clement 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὸ ἀπολίπωμεν τὰς κενὰς καὶ ματαίας φροντίδας, καὶ ἔλθωμεν ἐπὶ τὸν εὐκλεῆ καὶ σεμνὸν τῆς παραδόσεως ἡμῶν κανόνα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/002.yaml
  text: Therefore let us leave behind empty and futile concerns[a], and let us come to the glorious and venerable rule of our tradition.
  footnotes:
  - marker: a
    text: Or 'solemn'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리는 헛되고 무익한 염려들을 버리고, 우리 전통의 영화롭고 존귀한 규범으로 나아갑시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς κενὰς καὶ ματαίας φροντίδας
  english_pob_choice: empty and futile concerns
  chosen_korean: 헛되고 무익한 염려들
  alternatives_korean:
  - 헛되고 헛된 걱정들
  - 공허하고 무익한 염려들
  - 헛되고 쓸모없는 근심들
  lexicon: κενός, μάταιος, φροντίς
  rationale: κενάς/ματαίας는 단순히 감정적 '걱정'보다 비어 있고 결과가 없는 사태를 가리키므로, '염려들'로 풀되 '헛되고 무익한'을 붙여 공허함과 무익함을 함께 드러냈습니다.
- source_word: ἔλθωμεν ἐπὶ
  english_pob_choice: let us come to
  chosen_korean: 나아갑시다
  alternatives_korean:
  - 가봅시다
  - 이르러 갑시다
  - 향합시다
  lexicon: ἔρχομαι + ἐπί
  rationale: 직역상의 '오다'보다 목적지/방향을 향한 결단을 자연스럽게 드러내는 '나아갑시다'가 권면 문맥에 더 맞습니다.
- source_word: τὸν εὐκλεῆ καὶ σεμνὸν ... κανόνα
  english_pob_choice: the glorious and venerable rule
  chosen_korean: 영화롭고 존귀한 … 규범
  alternatives_korean:
  - 영광스럽고 엄숙한 … 규범
  - 영예롭고 경건한 … 기준
  - 영화롭고 경건한 … 법규
  lexicon: εὐκλεής, σεμνός, κανών
  rationale: εὐκλεῆ는 '영화로운'으로, σεμνὸν은 POB의 'venerable'에 맞춰 '존귀한'으로 옮겨 존엄성과 경외의 뉘앙스를 살렸고, κανών은 전통의 'rule'을 현대 한국어로 분명히 드러내는 '규범'으로 옮겼습니다.
- source_word: τῆς παραδόσεως ἡμῶν
  english_pob_choice: of our tradition
  chosen_korean: 우리 전통의
  alternatives_korean:
  - 우리의 전통의
  - 우리에게 전해진 전통의
  - 우리 유전의
  lexicon: παράδοσις
  rationale: παράδοσις는 단순 관습이 아니라 전승된 신앙 전통을 가리키므로, 문맥상 자연스러운 '우리 전통'으로 유지했습니다.
theological_decisions:
- issue: 권면형 공동체 언어의 반영
  chosen_reading: '''버리고''와 ''나아갑시다''로 공동체를 함께 포함하는 권면의 톤을 유지했습니다.'
  alternative_readings:
  - '''버립시다''와 ''가봅시다''처럼 더 평이한 표현'
  - 개인적 권면으로 완화하는 표현
  rationale: 원문 ἀπολίπωμεν, ἔλθωμεν은 모두 1인칭 복수 권면형이므로, 공동체가 함께 결단하는 문장 구조를 보존하는 것이 중요합니다.
  doctrine_reference: 공동체 권면의 수사 구조
