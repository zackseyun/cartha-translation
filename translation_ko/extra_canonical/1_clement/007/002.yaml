    rationale: εὐκλεής는 영광 일반보다 명성·명예와 관련된 ‘찬양받는, 영예로운’의 의미가 두드러집니다.
  revised_text: 그러므로 우리는 헛되고 무익한 염려들을 버리고, 우리 전통의 영예롭고 존귀한[a] 규범으로 나아갑시다.
