    rationale: 영어 POB의 각주가 σεμνός의 대안 번역을 설명하므로, 한국어에서도 ‘존귀한’에 앵커를 붙이고 대응 각주를 제공해야 독자가 주석의 대상과 내용을 알 수 있습니다.
  - severity: low
