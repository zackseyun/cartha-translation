  to: 그러므로 우리는 헛되고 무익한 염려들을 버리고, 우리 전통의 영예롭고 존귀한[a] 규범으로 나아갑시다.
  rationale: 의미와 권면의 어조는 유지하되, 세μνός에 관한 필수 각주를 해당 단어에 직접 연결했습니다. 또한 εὐκλεής를 현대 한국어에서 더 자연스러운 ‘영예로운’으로 다듬었습니다.
