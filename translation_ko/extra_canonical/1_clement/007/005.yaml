id: 1CLEM.7.5
reference: 1 Clement 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διέλθωμεν εἰς τὰς γενεὰς πάσας καὶ καταμάθωμεν, ὅτι ἐν γενεᾷ καὶ γενεᾷ μετανοίας τόπον ἔδωκεν ὁ δεσπότης τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/005.yaml
  text: Let us pass through all the generations and learn carefully that in generation after generation the Master gave a place for repentance to those willing to turn to him.
translation:
  language: ko
  text: 모든 세대를 지나가며 자세히 살펴봅시다. 그러면 세대마다 회개할 자리를 주셔서, 자신에게로 돌아오려는 이들이 그것을 얻게 하신 분이 계심을 알게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλθωμεν εἰς τὰς γενεὰς πάσας
  english_pob_choice: Let us pass through all the generations
  chosen_korean: 모든 세대를 지나가며
  alternatives_korean:
  - 모든 세대를 통과해 보며
  - 모든 세대를 두루 지나가며
  lexicon: διέρχομαι + γενεά
  rationale: 권면형 1인칭 복수의 흐름을 살리면서, ‘모든 세대’를 두루 살핀다는 의미를 자연스러운 합쇼체로 옮겼습니다.
- source_word: καταμάθωμεν
  english_pob_choice: learn carefully
  chosen_korean: 자세히 살펴봅시다
  alternatives_korean:
  - 주의 깊게 배웁시다
  - 면밀히 알아봅시다
  lexicon: καταμανθάνω
  rationale: 단순한 학습보다 ‘면밀히 확인하고 살핌’의 뉘앙스가 강하므로, 조사적 의미를 드러내는 표현을 택했습니다.
- source_word: ὁ δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 주인님
  lexicon: δεσπότης
  rationale: 본문의 δεσπότης는 통상적 경칭인 κύριος보다 강한 ‘주인/주권자’의 의미가 있어, 관계의 위계를 살리는 ‘주인’으로 옮겼습니다.
- source_word: μετανοίας τόπον ἔδωκεν
  english_pob_choice: gave a place for repentance
  chosen_korean: 회개할 자리를 주셔서
  alternatives_korean:
  - 회개할 기회를 주셔서
  - 회개의 자리를 마련해 주셔서
  lexicon: μετάνοια + τόπος + δίδωμι
  rationale: ‘자리’는 문자적 τόπος를 살리되 한국어에서 자연스럽게 ‘기회/여지’의 의미도 드러내며, POB의 ‘place for repentance’를 유지합니다.
- source_word: τοῖς βουλομένοις ἐπιστρέψαι ἐπ᾽ αὐτόν
  english_pob_choice: to those willing to turn to him
  chosen_korean: 자신에게로 돌아오려는 이들이
  alternatives_korean:
  - 그에게로 돌아오려는 이들이
  - 그에게 돌아오기를 원하는 이들이
  lexicon: βούλομαι + ἐπιστρέφω + ἐπ᾽ αὐτόν
  rationale: 최신 영문 수정처럼 ἐπιστρέψαι ἐπ᾽ αὐτόν에는 ‘back’이 명시되지 않으므로, ‘돌아오다’보다 방향성을 살린 ‘자신에게로 돌아오다’를 택했습니다.
theological_decisions:
- issue: δεσπότης의 권위 표현
  chosen_reading: ‘주인’으로 번역해, 본문의 주권적 권위와 회개의 허락이 주인의 판단에 달려 있음을 드러냈습니다.
  alternative_readings:
  - 주님
  - 주권자
  rationale: 이 문맥은 친밀한 신앙 호칭보다 통치적·법적 뉘앙스가 강하므로, 전통적 ‘주님’보다 더 직접적인 권위 표현이 적절합니다.
  doctrine_reference: 하나님의 주권과 회개의 허용
- issue: ἐπ᾽ αὐτόν의 방향성
  chosen_reading: ‘자신에게로 돌아오다’로 옮겨, 회개의 종착점을 하나님 자신으로 명시했습니다.
  alternative_readings:
  - 그에게로 돌아오다
  - 그분께로 돌아서다
  rationale: POB의 최신 수정이 반영하듯 ‘turn back’의 비표지적 확대를 피하고, 헬라어 전치사의 방향성을 자연스럽게 전달합니다.
  doctrine_reference: 회개와 하나님께로의 전환
