- from: 메시아의 피를 주의 깊게 바라보고, 그것이 그의 하나님과 아버지께 얼마나 귀한지 알아야 합니다[a]. 이는 우리의 구원을 위하여 쏟아져, 온 세상에 회개의 은혜를 가져다주었기 때문입니다.
  to: 메시아의 피를 주의 깊게 바라봅시다. 그리고 그 피가 그의 하나님과 아버지께 얼마나 귀한지 알아봅시다[a]. 그 피는 우리의 구원을 위하여 쏟아져, 온 세상에 회개의 은혜를 가져다주었습니다.
