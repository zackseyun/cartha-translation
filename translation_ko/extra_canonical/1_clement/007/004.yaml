base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/004.yaml
  text: Let us fix our gaze on the blood of Messiah and understand how precious it is to his God and Father[a], because, having been poured out for our salvation, it brought the grace of repentance to the whole world.
  footnotes:
  - marker: a
    text: Or 'to God, his Father'.
    reason: previous_rendering
translation:
  language: ko
  text: 메시아의 피를 주의 깊게 바라봅시다. 그리고 그 피가 그의 하나님과 아버지께 얼마나 귀한지 알아봅시다[a]. 그 피는 우리의 구원을 위하여 쏟아져, 온 세상에 회개의 은혜를 가져다주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님, 그의 아버지께.”
    reason: 그리스어 τῷ θεῷ καὶ πατρὶ αὐτοῦ는 본문처럼 ‘그의 하나님과 아버지’로 옮길 수 있으며, 영어 감사본에 보존된 대안적 구두점/수식 범위 표현도 각주로 반영합니다.
lexical_decisions:
- source_word: ἀτενίσωμεν εἰς
  english_pob_choice: Let us fix our gaze on
  chosen_korean: 주의 깊게 바라보고
  alternatives_korean:
  - 눈을 고정하고
  - 응시하고
  lexicon: ἀτενίζω
  rationale: 단순한 ‘보다’보다 시선을 붙들고 집중해 관찰하는 뜻을 살려, 권고형의 초점을 유지하는 표현으로 옮겼습니다.
- source_word: Χριστοῦ
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: Χριστός
  rationale: 프로젝트 기본어를 따라 титуляр 의미를 살린 ‘메시아’를 사용했습니다.
- source_word: τὸ αἷμα
  english_pob_choice: the blood
  chosen_korean: 피
  alternatives_korean:
  - 혈액
  - 피 흘림
  lexicon: αἷμα
  rationale: 희생과 구속의 의미를 가진 문자적 ‘피’를 유지했습니다.
- source_word: τίμιον τῷ θεῷ καὶ πατρὶ αὐτοῦ
  english_pob_choice: precious to his God and Father
  chosen_korean: 그의 하나님과 아버지께 얼마나 귀한지
  alternatives_korean:
  - 그의 하나님이시며 아버지께 얼마나 값진지
  - 그의 하나님과 아버지께 얼마나 소중한지
  lexicon: τίμιος
  rationale: τῷ θεῷ καὶ πατρὶ αὐτοῦ의 단일 관사 구조와 αὐτοῦ를 반영해 ‘그의 하나님과 아버지께’로 자연스럽게 옮겼고, 귀함의 가치를 드러내는 ‘귀한’으로 처리했습니다.
- source_word: μετανοίας χάριν
  english_pob_choice: the grace of repentance
  chosen_korean: 회개의 은혜
  alternatives_korean:
  - 회개를 위한 은혜
  - 회개 은혜
  lexicon: χάρις
  rationale: χάρις의 핵심 의미를 살리되, ‘회개의 은혜’라는 결합으로 원문의 목적적·선물적 뉘앙스를 간결하게 반영했습니다.
theological_decisions:
- issue: Father as Christ’s God
  chosen_reading: ‘그의 하나님과 아버지’로 옮겨, 아버지가 메시아의 하나님이라는 관계를 드러냈습니다.
  alternative_readings:
  - ‘하나님이시며 그의 아버지’
  - ‘그의 하나님께 그리고 아버지께’
  rationale: 그리스어의 단일 관사와 소유대명사 구조가 단순 호칭이 아니라 관계 규정을 말하므로, 본문이 가진 기독론적 긴장을 약화시키지 않도록 그대로 드러냈습니다.
  doctrine_reference: Christology
