  source_fidelity: 원문의 권유법 ἀτενίσωμεν과 γνῶμεν은 함께 청자를 초대하는 형태이므로, ‘알아야 합니다’보다 ‘바라봅시다/알아봅시다’가 정확합니다. 또한 ἐκχυθέν(쏟아져)과 διήνεγκεν(가져다주었습니다)의 주어는 메시아의 피이므로 이를 분명히 드러냈습니다. ‘그의 하나님과 아버지’는 τῷ θεῷ καὶ πατρὶ αὐτοῦ의 관계 표현을 충실히 보존합니다.
  naturalness: 합쇼체의 권유형을 병렬로 사용하고, ‘그 피가’라는 명시적 주어를 넣어 인과관계와 분사구문의 수식을 자연스럽고 분명하게 했습니다.
  terminology: Χριστός는 프로젝트 선택을 따라 ‘메시아’로 유지했습니다. αἷμα는 ‘피’, μετανοίας χάριν은 ‘회개의 은혜’로 유지했습니다. ‘그의 하나님과 아버지’는 그리스어와 영어 감사본의 표현을 반영합니다.
