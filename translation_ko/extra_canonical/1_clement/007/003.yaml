id: 1CLEM.7.3
reference: 1 Clement 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἴδωμεν, τί καλὸν καὶ τί τερπνὸν καὶ τί προσδεκτὸν τῷ ποιήσαντι ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/003.yaml
  text: And let us see what is good, and what is delightful, and what is acceptable to the one who made us.
translation:
  language: ko
  text: 그리고 우리가 보아야 합니다. 무엇이 선한지, 무엇이 기쁜지, 그리고 우리를 지으신 분께 무엇이 받아들여질 만한지 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἴδωμεν
  english_pob_choice: And let us see
  chosen_korean: 그리고 우리가 보아야 합니다
  alternatives_korean:
  - 그리고 보아야 합니다
  - 그리고 우리가 살펴보아야 합니다
  lexicon: ἴδωμεν
  rationale: 권유형을 살리되, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다. 단순 명령보다 공동의 숙고를 촉구하는 뉘앙스를 반영합니다.
- source_word: καλὸν
  english_pob_choice: good
  chosen_korean: 선한
  alternatives_korean:
  - 좋은
  - 선한 것
  lexicon: καλόν
  rationale: 도덕적·가치 판단의 넓은 뜻을 살려 ‘선한’으로 옮겼습니다. 문맥상 단순한 편의적 ‘좋은’보다 원뜻에 가깝습니다.
- source_word: τερπνὸν
  english_pob_choice: delightful
  chosen_korean: 기쁜
  alternatives_korean:
  - 기쁜
  - 즐거운
  - 마음에 드는
  lexicon: τερπνόν
  rationale: POB의 ‘delightful’이 가리키는 감각적·정서적 즐거움을 한국어에서 간결하게 살리기 위해 ‘기쁜’을 택했습니다. 세 형용사의 구분도 유지합니다.
- source_word: προσδεκτὸν
  english_pob_choice: acceptable
  chosen_korean: 받아들여질 만한
  alternatives_korean:
  - 받아들여지는
  - 기뻐하실 만한
  - 가납될 만한
  lexicon: προσδεκτόν
  rationale: 사람의 주관적 호감보다 ‘받아들임’을 드러내는 수동적 의미를 살렸습니다. 대상이 하나님이므로 경어적 표현은 문장 전체에서 충분히 유지됩니다.
- source_word: τῷ ποιήσαντι ἡμᾶς
  english_pob_choice: to the one who made us
  chosen_korean: 우리를 지으신 분께
  alternatives_korean:
  - 우리를 만드신 분께
  - 우리를 지으신 이에게
  lexicon: ποιήσαντι
  rationale: ‘지으신’은 창조 행위를 보다 성경적이고 직접적으로 드러냅니다. ‘분께’는 하나님을 향한 존대와 문맥의 목적격을 함께 반영합니다.
theological_decisions:
- issue: 하나님 지칭의 경어와 인칭 처리
  chosen_reading: ‘우리’를 포함한 권유형으로 시작하고, 창조주를 ‘우리를 지으신 분’이라 하여 대상의 위격을 존중하는 간접 호칭을 사용했습니다.
  alternative_readings:
  - ‘우리 창조주께’
  - ‘우리를 만드신 분께’
  rationale: 본문은 하나님께 직접 기도하는 형식이 아니라 공동의 성찰을 요청하는 문장입니다. 따라서 2인칭 기도체보다 서술형 존대를 유지하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 창조주 하나님에 대한 경외 표현
- issue: 세 형용사의 병렬 보존
  chosen_reading: ‘선한지, 기쁜지, 받아들여질 만한지’로 세 항목을 각각 분리해 옮겼습니다.
  alternative_readings:
  - ‘좋고, 즐겁고, 받아들여지는지’
  rationale: 원문은 τί를 반복해 세 형용사를 병렬적으로 강조합니다. 한국어도 같은 구조를 유지해 판단의 세 차원을 구분하도록 했습니다.
  doctrine_reference: 수사적 병렬과 의미 구분
