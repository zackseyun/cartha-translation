id: 1CLEM.7.7
reference: 1 Clement 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰωνᾶς Νινευίταις καταστροφὴν ἐκήρυξεν· οἱ δὲ μετανοήσαντες ἐπὶ τοῖς ἁμαρτήμασιν αὐτῶν ἐξιλάσαντο τὸν θεὸν ἱκετεύσαντες καὶ ἔλαβον σωτηρίαν, καίπερ ἀλλότριοι τοῦ θεοῦ ὄντες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/007.yaml
  text: Jonah proclaimed destruction to the Ninevites; but they[a], having repented of their sins, made atonement to God by their supplication and received salvation, though they were strangers to God.
  footnotes:
  - marker: a
    text: Or 'made atonement before God'.
    reason: previous_rendering
translation:
  language: ko
  text: 요나는 니느웨 사람들에게 멸망을 선포했습니다. 그러나 그들은 자기들의 죄를 회개하고 간구하여 하나님을 달래고 구원을 받았습니다. 비록 하나님께 낯선 사람들이었지만 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님 앞에서 속죄하여.” 그리스어는 ‘하나님’을 직접 목적어로 하여, 하나님을 달래거나 달래심을 얻는다는 뜻을 나타냅니다.
    reason: 영어 POB 감사 기록의 대안 번역을 한국어로 반영하면서, 본문의 직접 목적어 구조에 관한 번역상 쟁점을 설명합니다.
lexical_decisions:
- source_word: καταστροφὴν ἐκήρυξεν
  english_pob_choice: proclaimed destruction
  chosen_korean: 멸망을 선포했습니다
  alternatives_korean:
  - 파멸을 선포했습니다
  - 재앙을 선포했습니다
  lexicon: κηρύσσω
  rationale: ἐκήρυξεν은 공개적으로 선포하다의 뜻이므로 ‘선포했습니다’로 옮기고, καταστροφὴν은 직접적 심판 경고를 살려 ‘멸망’으로 옮겼습니다.
- source_word: ἐξιλάσαντο τὸν θεόν
  english_pob_choice: made atonement to God
  chosen_korean: 하나님을 달래어
  alternatives_korean:
  - 하나님께 속죄하여
  - 하나님을 화목하게 하여
  lexicon: ἐξιλάσκομαι
  rationale: 이 동사는 여기서 하나님을 직접 목적어로 취하므로, ‘하나님께’가 아니라 ‘하나님을’로 옮겨 원문의 통사와 강한 화해/달램의 뉘앙스를 살렸습니다.
- source_word: ἱκετεύσαντες
  english_pob_choice: by their supplication
  chosen_korean: 간구함으로
  alternatives_korean:
  - 애원함으로
  - 간청함으로
  lexicon: ἱκετεύω
  rationale: 형식적으로는 간절한 청원을 뜻하므로, 예배적·공손한 어감을 살리되 지나치게 의역하지 않도록 ‘간구함으로’로 옮겼습니다.
- source_word: ἀλλότριοι τοῦ θεοῦ ὄντες
  english_pob_choice: though they were strangers to God
  chosen_korean: 비록 하나님과는 낯선 사람들이었기 때문입니다
  alternatives_korean:
  - 비록 하나님에게서 멀리 떨어진 사람들이었기 때문입니다
  - 비록 하나님과는 이방인이었기 때문입니다
  lexicon: ἀλλότριος
  rationale: ἀλλότριοι는 단순한 지리적 ‘이방인’보다 관계적 소외를 강조하므로, ‘낯선 사람들이’로 옮겨 관계적 거리감을 드러냈습니다.
theological_decisions:
- issue: ἐξιλάσαντο τὸν θεόν의 신학적 강도
  chosen_reading: ‘하나님을 달래어’로 직역에 가깝게 옮겨, Nineveh의 회개와 간구가 하나님의 진노/심판과 관련된 실제적 전환을 가져온다는 점을 드러냈습니다.
  alternative_readings:
  - ‘하나님께 속죄하여’
  - ‘하나님 앞에서 속죄하여’
  - ‘하나님을 화목하게 하여’
  rationale: 공식적인 속죄 제도 용어로 평탄화하면 본문의 수사적 충격이 약해지므로, 원문의 직접 목적어 구조를 보존하는 번역을 택했습니다.
  doctrine_reference: 회개와 간구가 하나님의 심판 선고 앞에서 응답을 이끌어낸다는 성경적 회개 이해
