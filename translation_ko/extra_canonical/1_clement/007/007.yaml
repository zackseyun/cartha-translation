  naturalness: ‘하나님과는 낯선 사람들이었기 때문입니다’는 문장 끝의 인과 표현 때문에 부자연스럽고 의미상 어긋납니다. 양보절을 ‘...사람들이었지만’으로 처리하면 현대 표준 한국어 합쇼체에서 자연스럽습니다.
