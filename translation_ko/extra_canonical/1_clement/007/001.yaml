source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα, ἀγαπητοί, οὐ μόνον ὑμᾶς νουθετοῦντες ἐπεστέλλομεν, ἀλλὰ καὶ ἑαυτοὺς ὑπομιμνήσκοντες· ἐν γὰρ τῷ αὐτῷ ἐσμὲν σκάμματι, καὶ ὁ αὐτὸς ἡμῖν ἀγὼν ἐπίκειται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/007/001.yaml
  text: These things, beloved, we have written not only to admonish you, but also to remind ourselves; for we are in the same arena, and the same struggle lies before us.
translation:
  language: ko
  text: 사랑하는 여러분, 우리는 이 일들을 여러분에게 경계시키는 것만이 아니라 우리 자신에게도 상기시키려고 썼습니다. 왜냐하면 우리는 같은 경기장에 있고, 같은 싸움이 우리 앞에 놓여 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 여러분
  alternatives_korean:
  - 사랑하는 이들
  - 사랑하는 자들
  lexicon: ἀγαπητοί
  rationale: 호칭의 친밀함과 공동체적 어조를 살리면서도 현대 한국어 합쇼체에 자연스럽게 맞도록 풀어 옮겼습니다.
- source_word: νουθετοῦντες
  english_pob_choice: admonish
  chosen_korean: 경계시키는
  alternatives_korean:
  - 권면하는
  - 훈계하는
  lexicon: νουθετέω
  rationale: 단순한 조언보다 경고와 훈계를 함께 담는 동사를 택해, 본문의 실제 기능을 보다 직접적으로 드러냈습니다.
- source_word: ὑπομιμνήσκοντες
  english_pob_choice: remind
  chosen_korean: 상기시키려고
  alternatives_korean:
  - 기억나게 하려고
  - 떠올리게 하려고
  lexicon: ὑπομιμνῄσκω
  rationale: 저자들이 독자뿐 아니라 자기 자신도 동일한 권면 아래 둔다는 의미를 살려 ‘상기시키다’로 옮겼습니다.
- source_word: σκάμματι
  english_pob_choice: arena
  chosen_korean: 경기장
  alternatives_korean:
  - 운동장
  - 싸움터
  lexicon: σκάμμα
  rationale: 원래는 경주·경기의 경계선이 있는 경기장을 가리키므로, 비유적 긴장감을 유지하면서도 현대 독자가 이해하기 쉬운 표현으로 옮겼습니다.
theological_decisions:
- issue: 같은 자리에서 받는 권면이라는 공동체적 자기포함
  chosen_reading: 저자들이 독자를 향해 말하면서 동시에 자신들도 동일한 도덕적·영적 경계 아래 있음을 함께 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 우리가 여러분을 훈계할 뿐 아니라 우리도 훈계받는다는 식의 대칭화
  - 독자 중심의 일방적 권면으로 약화
  rationale: 원문은 권면의 우위가 아니라 공동 참여와 자기성찰을 강조하므로, 저자와 독자를 같은 싸움에 놓는 구조를 보존했습니다.
  doctrine_reference: 공동체적 권면과 자기성찰의 상호성
