review_pass:
  verdict: revise
  source_fidelity: 원문의 대조 구조와 공동 참여의 비유는 대체로 충실합니다. 다만 νουθετοῦντες의 뜻에는 경고만이 아니라 권면·훈계의 성격이 있으므로 ‘경계시키는 것’은 다소 좁고 한국어로도 부자연스럽습니다. ἐπίκειται의 ‘눈앞에 닥쳐/놓여 있다’는 의미는 유지되어야 합니다.
  naturalness: ‘여러분에게 경계시키는 것만이 아니라’는 현대 한국어에서 어색한 결합입니다. ‘여러분을 권면할 뿐 아니라’가 합쇼체 문맥에서 자연스럽습니다. ‘이 일들’도 ‘이것들을’이 더 자연스럽습니다.
  terminology: ἀγαπητοί는 ‘사랑하는 여러분’으로 적절합니다. σκάμματι는 비유적 경기·투쟁의 장을 가리키므로 ‘같은 경기장’은 안전한 번역입니다. ἀγών은 여기서 ‘싸움’으로 옮길 수 있으며, 과도하게 특정 운동 종목으로 한정하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘경계시키는 것’
    rationale: νουθετέω는 경고를 포함할 수 있으나 기본적으로 권면·훈계하여 바로잡는다는 뜻입니다. 또한 ‘누구에게 경계시키다’는 표현은 자연스럽지 않습니다.
  - severity: low
    issue: ‘이 일들을’
    rationale: 문법적으로 가능하지만, 지시대명사 Ταῦτα는 이 문맥에서 ‘이것들을’이 더 자연스러운 현대 한국어입니다.
  revised_text: 사랑하는 여러분, 우리는 여러분을 권면할 뿐 아니라 우리 자신도 일깨우기 위해 이것들을 썼습니다. 이는 우리가 같은 경기장에 있으며, 같은 싸움이 우리 앞에 놓여 있기 때문입니다.
