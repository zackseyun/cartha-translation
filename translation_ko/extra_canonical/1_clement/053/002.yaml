  text: 모세가 산에 올라가 사십 주 사십 야를 금식하며 부끄러워한 후에 하나님이 그에게 이르시되 모세야 모세야 속히 여기서 내려오라 네가 애굽 땅에서 인도하여 낸 네 백성이 불법을 행하고 내가 그들에게 명령한 도를 속히 떠나 자기를 위하여 우상을 부어 만들었느니라
