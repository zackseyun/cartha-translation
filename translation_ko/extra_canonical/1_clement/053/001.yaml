id: 1CLEM.53.1
reference: 1 Clement 53:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐπίστασθε γὰρ καὶ καλῶς ἐπίστασθε τὰς ἱερὰς γραφάς, ἀγαπητοί, καὶ ἐγκεκύφατε εἰς τὰ λόγια τοῦ θεοῦ. πρὸς ἀνάμνησιν οὖν ταῦτα γράφομεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053/001.yaml
  text: For you know the holy Scriptures—and know them well, beloved—and you have pored over the oracles of God. Therefore we write these things for your remembrance.
  footnotes:
  - marker: a
    text: Or 'bent closely over the sayings'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 이들이여, 여러분은 거룩한 성경을 알고 있으며, 또 그것을 잘 알고 있습니다. 그리고 여러분은 하나님의 말씀을 깊이 탐독해 왔습니다.[a] 그러므로 우리는 여러분이 기억하도록 이러한 것들을 씁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 말씀을 몸을 굽혀 자세히 살펴보았습니다.’
    reason: ἐγκεκύφατε(ἐγκύπτω)는 본래 ‘몸을 굽혀 들여다보다’라는 뜻이며, 여기서는 하나님의 말씀을 면밀히 연구했다는 비유적 의미입니다.
lexical_decisions:
- source_word: τὰς ἱερὰς γραφάς
  english_pob_choice: the holy Scriptures
  chosen_korean: 거룩한 성경
  alternatives_korean:
  - 거룩한 성경 기록
  - 거룩한 성구들
  lexicon: γραφή
  rationale: 여기서는 특정 본문 묶음인 성경을 가리키므로, 직역형인 ‘성경 기록’보다 한국어에서 자연스럽고도 성스러움이 살아 있는 ‘거룩한 성경’이 적절합니다.
- source_word: ἐπίστασθε ... καὶ καλῶς ἐπίστασθε
  english_pob_choice: you know ... and know them well
  chosen_korean: 여러분은 ... 알고 있으며, 또 그것을 잘 알고 있습니다
  alternatives_korean:
  - 여러분은 ... 잘 알고 있으며
  - 여러분은 ... 분명히 알고 있습니다
  lexicon: ἐπίστασθε
  rationale: 동사의 반복이 강조를 이루므로, 단순히 한 번만 ‘잘 압니다’로 처리하지 않고 ‘알고 있으며, 또 ... 잘 알고 있습니다’로 중복 강조를 살렸습니다.
- source_word: ἐγκεκύφατε εἰς τὰ λόγια τοῦ θεοῦ
  english_pob_choice: you have pored over the oracles of God
  chosen_korean: 하나님의 말씀을 깊이 탐독해 왔습니다
  alternatives_korean:
  - 하나님의 말씀을 깊이 들여다보셨습니다
  - 하나님의 말씀 위로 몸을 굽혀 살펴보셨습니다
  lexicon: ἐγκύπτω; λόγια τοῦ θεοῦ
  rationale: ἐγκύπτω의 문자적 이미지를 살리되, 문맥상 ‘깊이 탐독하다/들여다보다’가 가장 자연스럽습니다. λόγια는 POB의 ‘oracles’ 취지를 따라 단순한 ‘말씀들’보다 권위 있는 하나님의 말씀으로 옮겼습니다.
- source_word: πρὸς ἀνάμνησιν
  english_pob_choice: for your remembrance
  chosen_korean: 여러분의 기억을 위해
  alternatives_korean:
  - 여러분이 기억하도록
  - 여러분의 상기를 위해
  lexicon: ἀνάμνησις
  rationale: 의도는 독자들의 회상을 촉발하는 것이므로, 한국어에서 문장 흐름이 자연스러운 ‘기억을 위해’로 옮겼습니다.
theological_decisions:
- issue: τὰς ἱερὰς γραφάς와 τὰ λόγια τοῦ θεοῦ의 병렬 의미
  chosen_reading: ‘거룩한 성경’과 ‘하나님의 말씀’을 병렬로 두어, 기록된 성경과 하나님의 권위 있는 말씀을 함께 가리키는 흐름을 유지했습니다.
  alternative_readings:
  - 둘 다 ‘성경’으로 평준화
  - 둘 다 ‘말씀’으로 평준화
  rationale: 본문은 독자들이 이미 성경을 알고 있고 더 나아가 하나님의 말씀을 깊이 파고들었음을 말하므로, 두 표현의 뉘앙스를 너무 일찍 하나로 흡수하지 않는 편이 좋습니다.
  doctrine_reference: 성경의 권위와 계시의 언어 사용에 대한 본문 내 구분
