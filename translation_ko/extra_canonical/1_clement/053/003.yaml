  text: 주님께서 그에게 말씀하셨습니다. “내가 너에게 한 번 두 번 말하며 이르기를, ‘내가 이 백성을 보았습니다. 보십시오, 이 백성은 목이 뻣뻣합니다. 나를 내버려 두십시오. 내가 그들을 멸망시키고 그들의 이름을 하늘 아래에서 지워 버리겠습니다. 그리고 내가 너를 크고 놀라우며 이 백성보다 더 큰 민족이 되게 하겠습니다.’라고 하였습니다.”
