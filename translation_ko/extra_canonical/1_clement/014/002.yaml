revisions:
- from: 그러므로 우리가 사소한 해가 아니라 오히려 큰 위험을 당하게 될 것입니다. 우리가 사람들의 욕망에 무모하게 우리 자신을 내맡기면, 그들은 다툼과 분열에 빠져들어 우리를 좋은 것에서 멀어지게 할 것입니다.[a]
  to: 그러므로 우리가 다툼과 분열에 빠져 우리를 좋은 것에서 멀어지게 하려는 사람들의 욕망에 무모하게 자신을 내맡긴다면, 우리는 예사로운 해가 아니라, 오히려 큰 위험을 겪게 될 것입니다.
  rationale: 조건절 안에서 ‘다툼과 분열에 빠져 우리를 좋은 것에서 멀어지게 하려는’이 ‘사람들’을 수식하도록 재구성하여 원문의 관계절과 목적/결과 표현을 보존했습니다. βλάβη와 κίνδυνος의 대비는 ‘예사로운 해가 아니라, 오히려 큰 위험’으로 자연스럽게 옮겼습니다. 현행 본문에 적용되지 않는 각주 앵커는 삭제했습니다.
