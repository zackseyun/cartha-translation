id: 1CLEM.14.2
reference: 1 Clement 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/002.yaml
  text: For we will incur no ordinary harm[a], but rather great danger, if we recklessly hand ourselves over to the desires of men who fall into strife and factions, so as to estrange us from what is good.
  footnotes:
  - marker: a
    text: Or 'who are bent on plunging us into strife and factions'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리가 사소한 해가 아니라 오히려 큰 위험을 당하게 될 것입니다. 우리가 사람들의 욕망에 무모하게 우리 자신을 내맡기면, 그들은 다툼과 분열에 빠져들어 우리를 좋은 것에서 멀어지게 할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλάβην ... οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν
  english_pob_choice: no ordinary harm ... but rather great danger
  chosen_korean: 사소한 해가 아니라 오히려 큰 위험
  alternatives_korean:
  - 보통 아닌 해가 아니라 오히려 큰 위험
  - 평범하지 않은 손해가 아니라 오히려 큰 위험
  lexicon: βλάβη, κίνδυνος
  rationale: βλάβην과 κίνδυνον의 대비를 한국어에서도 ‘해’와 ‘위험’으로 살려, 단순한 손실보다 훨씬 큰 위협이라는 긴장을 유지했습니다.
- source_word: ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς
  english_pob_choice: if we recklessly hand ourselves over
  chosen_korean: 우리가 ... 무모하게 우리 자신을 내맡기면
  alternatives_korean:
  - 우리가 ... 위험을 무릅쓰고 우리 자신을 내주면
  - 우리가 ... 경솔하게 우리 자신을 맡기면
  lexicon: ῥιψοκινδύνως, ἐπιδῶμεν ἑαυτοὺς
  rationale: ῥιψοκινδύνως의 ‘위험을 가볍게 여기는 무모함’을 살려 ‘무모하게’로 옮기고, ἑαυτοὺς는 자기 자신을 스스로 넘겨주는 뉘앙스를 살려 ‘우리 자신을 내맡기다’로 번역했습니다.
- source_word: τοῖς θελήμασιν τῶν ἀνθρώπων
  english_pob_choice: the desires of men
  chosen_korean: 사람들의 욕망
  alternatives_korean:
  - 사람들의 뜻
  - 사람들의 소원
  lexicon: θέλημα
  rationale: θέλημα를 문맥상 단순한 ‘뜻’보다 더 강한 내적 추동으로 읽어, POB의 ‘desires’를 따라 ‘욕망’으로 옮겼습니다.
- source_word: πίπτουσιν εἰς ἔριν καὶ στάσεις
  english_pob_choice: who fall into strife and factions
  chosen_korean: 다툼과 분열에 빠져들어
  alternatives_korean:
  - 다툼과 분열에 빠지는
  - 다툼과 파당에 떨어져
  lexicon: πίπτουσιν, ἔρις, στάσις
  rationale: πίπτουσιν의 진행성을 살려 ‘빠져들어’로 옮기고, ἔρις와 στάσις는 한국어에서 자연스럽고 구분되는 ‘다툼과 분열’로 렌더링했습니다.
- source_word: εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος
  english_pob_choice: so as to estrange us from what is good
  chosen_korean: 우리를 좋은 것에서 멀어지게 할 것입니다
  alternatives_korean:
  - 우리를 선한 것에서 소외시키려는 것입니다
  - 우리를 좋은 것을 빼앗아 버리게 할 것입니다
  lexicon: ἀπαλλοτριῶσαι, τοῦ καλοῦ ἔχοντος
  rationale: ἀπαλλοτριῶσαι는 ‘소외시키다, 멀어지게 하다’의 의미를 가지므로, ‘좋은 것’에서 관계적·도덕적으로 멀어지게 된다는 효과를 자연스럽게 드러냈습니다.
