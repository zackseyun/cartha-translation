    rationale: ‘그들은 다툼과 분열에 빠져들어 우리를 좋은 것에서 멀어지게 할 것입니다’는 원문의 사람들을 수식하는 관계절과 εἰς τὸ 부정사구의 목적/결과 관계를 미래의 독립 진술로 바꿉니다. 이를 명사구 내부의 수식으로 처리해야 합니다.
