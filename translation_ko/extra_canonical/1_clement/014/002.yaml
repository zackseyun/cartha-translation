    rationale: οὐ τὴν τυχοῦσαν은 단순히 ‘사소한’이라기보다 ‘예사롭지 않은/보통이 아닌’ 해를 뜻합니다. ‘예사로운 해가 아니라’가 원문의 부정적 관용과 한국어 표현을 함께 살립니다.
