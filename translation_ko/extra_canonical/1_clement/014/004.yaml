revisions:
- from: '기록되기를: 「온전한 자들은 땅을 차지할 것이며, 무죄한 자들은 그 위에 남겨질 것입니다. 그러나 불법을 행하는 자들은 거기서 멸망될 것입니다.」[a]'
  to: 기록되어 있습니다. “선한 이들은 땅에 살 것이며, 악의 없는 이들은 그 땅 위에 남을 것입니다. 그러나 법을 어기는 이들은 그 땅에서 멸절될 것입니다.”
  rationale: 그리스어의 어휘 범위와 통사에 맞추어 ‘선한 이들/땅에 살다/악의 없는 이들/그 땅에서 멸절되다’로 조정했습니다. 이는 영어 감사 번역의 ‘upright’와 ‘destroyed from it’보다 원문을 우선하며, 특정 교리적 상속 해석을 덧붙이지 않습니다. 고아 각주 표지도 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:14Z'
review_pass:
  verdict: revise
  source_fidelity: ‘온전한 자들’은 χρηστοί의 일반적 의미(선한, 착한)보다 강하며, οἰκήτορες γῆς는 ‘땅을 차지하다’가 아니라 문자적으로 ‘땅에 거주하다’입니다. 또한 ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς는 단순히 그곳에서 멸망하는 것이 아니라 그 땅에서 제거·멸절되는 뜻입니다.
  naturalness: 합쇼체 인용문에서는 ‘기록되어 있습니다’와 ‘땅에 살 것입니다/그 땅에서 멸절될 것입니다’가 자연스럽고, 원문의 대조적 격언체도 유지합니다.
  terminology: χρηστοί는 문맥상 ‘선한 이들’, ἄκακοι는 법정적 무죄 선언보다 ‘악의 없는 이들’로 옮기는 것이 적절합니다. παρανομοῦντες는 ‘법을 어기는 이들’로 원문의 현재분사와 법 위반의 의미를 무리 없이 반영합니다.
  issues:
  - severity: medium
    issue: χρηστοί를 ‘온전한 자들’로 번역함
    rationale: ‘온전한’은 완전함·흠없음의 의미를 더하여 χρηστός의 기본적인 선함·착함보다 강한 표현입니다.
  - severity: medium
    issue: οἰκήτορες γῆς를 ‘땅을 차지할 것’으로 번역함
    rationale: οἰκήτωρ는 거주자이며, 이 구절의 동사는 소유·상속을 뜻하지 않고 ‘땅에 거주하다’를 뜻합니다.
  - severity: medium
    issue: ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς를 ‘거기서 멸망될 것’으로 번역함
    rationale: ἀπό는 땅으로부터의 축출·제거를 나타내며, ἐξολεθρεύω의 강한 멸절 의미도 반영하는 편이 좋습니다.
  - severity: low
    issue: '[a] 각주 표지가 있으나 대응하는 한국어 각주가 없음'
    rationale: 번역문 안의 표지는 실제 각주와 연결되어야 합니다. 이 번역에는 의미 있는 별도 각주가 필요하지 않으므로 표지를 삭제합니다.
  revised_text: 기록되어 있습니다. “선한 이들은 땅에 살 것이며, 악의 없는 이들은 그 땅 위에 남을 것입니다. 그러나 법을 어기는 이들은 그 땅에서 멸절될 것입니다.”
