id: 1CLEM.14.4
reference: 1 Clement 14:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/004.yaml
  text: 'For it is written: “The upright will inhabit the land[a], and the innocent will be left upon it; but those who act lawlessly will be destroyed from it.”'
  footnotes:
  - marker: a
    text: Or 'those who transgress the law will be destroyed from it'.
    reason: previous_rendering
translation:
  language: ko
  text: '기록되기를: 「온전한 자들은 땅을 차지할 것이며, 무죄한 자들은 그 위에 남겨질 것입니다. 그러나 불법을 행하는 자들은 거기서 멸망될 것입니다.」[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χρηστοὶ
  english_pob_choice: The upright
  chosen_korean: 온전한 자들
  alternatives_korean:
  - 의로운 자들
  - 정직한 자들
  - 선한 자들
  lexicon: χρηστός
  rationale: 이 단어는 단순한 도덕적 ‘선함’보다 품행과 성품이 바로 선 사람을 가리키므로, 시편적 문맥에 맞게 ‘온전한 자들’로 옮겼습니다.
- source_word: οἰκήτορες γῆς
  english_pob_choice: will inhabit the land
  chosen_korean: 땅을 차지할 것이며
  alternatives_korean:
  - 땅에 거할 것이며
  - 땅을 거주할 것이며
  lexicon: οἰκήτωρ / γῆ
  rationale: ‘거주하다’보다 언약적·시적 의미를 살려, 땅을 몫으로 받아 누린다는 함의를 지닌 ‘차지하다’로 자연스럽게 옮겼습니다.
- source_word: παρανομοῦντες
  english_pob_choice: those who act lawlessly
  chosen_korean: 불법을 행하는 자들
  alternatives_korean:
  - 율법을 범하는 자들
  - 법을 어기는 자들
  lexicon: παρανομέω
  rationale: 문맥상 ‘율법을 범하다’도 가능하지만, 보다 직설적으로 ‘불법을 행하다’로 옮겨 원문의 법 질서 위반을 드러냈습니다.
- source_word: ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς
  english_pob_choice: will be destroyed from it
  chosen_korean: 거기서 멸망될 것입니다
  alternatives_korean:
  - 그곳에서 뿌리 뽑힐 것입니다
  - 그 땅에서 제거될 것입니다
  lexicon: ἐξολεθρεύω + ἀπό
  rationale: ‘destroyed from it’의 어색함을 피하면서도, 완전한 파멸의 뜻을 보존하기 위해 ‘멸망되다’로 옮겼습니다.
theological_decisions:
- issue: 시편적 인용에서 땅/토지의 의미를 어떻게 살릴 것인가
  chosen_reading: ‘땅을 차지할 것입니다’로 번역해 언약적 상속의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘땅에 거할 것입니다’
  - ‘땅을 소유할 것입니다’
  rationale: 원문의 γῆ는 단순한 지리적 땅보다 의인에게 주어지는 몫이라는 함의를 지니므로, 시편 인용의 약속성을 드러내는 표현을 택했습니다.
  doctrine_reference: 시 37편의 의인-악인 대비와 상속 모티프
