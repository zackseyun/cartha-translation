  terminology: θεῷ는 문맥상 ‘하나님’으로 자연스럽게 옮길 수 있습니다. ζῆλος는 여기서 부정적 공동체 갈등을 가리키므로 ‘시기’가 자연스럽고, μυσεροῦ ζήλους는 ‘혐오스러운 시기’로 번역합니다. ἀρχηγοῖς는 ‘시기를 일으키는 자들’로 옮겨 단순 참여자나 일반 지도자가 아니라 그 시기의 발단·주동자라는 뜻을 반영합니다.
