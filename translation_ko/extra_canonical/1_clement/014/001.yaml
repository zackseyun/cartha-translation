  source_fidelity: 핵심 대조와 ἀρχηγοί의 ‘일으키는 자들/주동자들’ 의미는 대체로 반영되었습니다. 그러나 μυσεροῦ를 ‘미운’으로 옮긴 것은 현대 한국어에서 부자연스럽고 평가의 강도도 충분히 전달하지 못합니다. ‘혐오스러운’으로 고쳐 원문의 강한 부정적 평가를 살리는 것이 적절합니다.
