id: 1CLEM.14.1
reference: 1 Clement 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/001.yaml
  text: It is right, then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are the instigators of hateful jealousy.
  footnotes:
  - marker: a
    text: Or 'leaders in hateful jealousy'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 형제들아, 우리가 하나님께 순종하는 사람이 되는 것이, 오만함과 무질서 속에서 미운 질투의 원인이 되는 자들을 따르는 것보다 옳고 거룩합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαιον οὖν καὶ ὅσιον
  english_pob_choice: It is right, then, and holy
  chosen_korean: 옳고 거룩합니다
  alternatives_korean:
  - 옳습니다, 그러므로 거룩합니다
  - 의롭고 거룩합니다
  lexicon: δίκαιον, ὅσιος
  rationale: δίκαιον과 ὅσιον을 각각 단순한 ‘옳음’과 ‘거룩함’으로 살려, 윤리적 적합성과 경건성을 함께 드러냈습니다.
- source_word: ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ
  english_pob_choice: for us to become obedient to God
  chosen_korean: 우리가 하나님께 순종하는 사람이 되는 것
  alternatives_korean:
  - 우리가 하나님께 복종하는 것이
  - 우리가 하나님께 순종하게 되는 것이
  lexicon: ὑπήκοος, γίνομαι
  rationale: ‘obedient’의 상태 변화를 반영해 ‘순종하는 사람이 되는 것’으로 옮겨, 행위만이 아니라 사람됨의 방향을 살렸습니다.
- source_word: τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν
  english_pob_choice: to follow those who, in arrogance and disorder, are the instigators of hateful jealousy
  chosen_korean: 오만함과 무질서 속에서 미운 질투의 원인이 되는 자들을 따르는 것
  alternatives_korean:
  - 오만함과 무질서 가운데 미운 질투를 일으키는 자들을 따르는 것
  - 오만과 무질서에 있는 미운 질투의 선동자들을 따르는 것
  lexicon: ἀλαζονεία, ἀκαταστασία, μυσερός, ζῆλος, ἀρχηγός, ἐξακολουθέω
  rationale: POB의 수정된 ‘instigators’에 따라 ἀρχηγοῖς를 ‘원인/선동자’ 계열로 옮겼고, μυσεροῦ ζήλους는 ‘미운 질투’로 직접 표현해 본문의 부정적 정서를 보존했습니다.
theological_decisions:
- issue: The clause contrasts obedience to God with following factional leaders in the Corinthian conflict.
  chosen_reading: 문장의 대조를 살려 ‘하나님께 순종하는 것’과 ‘오만함과 무질서 속에서 미운 질투의 원인이 되는 자들을 따르는 것’을 대비시켰습니다.
  alternative_readings:
  - 그냥 도덕적 권면으로 완화해 옮김
  - ‘질투의 지도자들’로 중립화함
  rationale: 이 문맥은 단순한 일반 윤리가 아니라 공동체 분열을 조장하는 자들과 하나님께 대한 순종을 대조합니다.
  doctrine_reference: 교회 질서와 분열 경계에 대한 1 Clement의 목회적 권면
