- from: 그리고 다시 이렇게 말씀합니다. “내가 불의한 사람이 레바논의 백향목들처럼 아주 높이 들리고 높아진 것을 보았습니다. 내가 지나가 보니, 보라, 그는 없었고, 내가 그의 자리를 찾았으나 찾지 못했습니다. 순결을 지키고 올바름을 살피십시오. 평화로운 사람에게는 남은 것이 있기 때문입니다.”[a][b]
  to: 그리고 다시 이렇게 말합니다. “내가 악인이 크게 높아지고 레바논의 백향목들처럼 우뚝 솟은 것을 보았습니다. 내가 지나가 보니, 보라, 그는 없었고, 그가 있던 곳을 찾아보았으나 찾지 못했습니다. 순전함을 지키고 정직함을 살피십시오. 평화로운 사람에게는 남은 것이 있기 때문입니다.”
  rationale: 원문 그리스어를 우선하여 핵심 어휘를 바로잡고, 병렬된 상승 이미지와 시편 인용의 관찰·권면 구조를 자연스러운 현대 한국어 합쇼체로 유지했습니다. 마지막 ‘남은 것’은 ἐγκατάλειμμα의 의미를 특정 교리적 또는 해석적 결론으로 한정하지 않도록 그대로 보존했습니다. 제공되지 않은 각주에 대응하지 않는 표지는 삭제했습니다.
