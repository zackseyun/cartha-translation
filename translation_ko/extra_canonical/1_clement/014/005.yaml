language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Εἶδον ἀσεβῆ ὑπερυψούμενον καὶ ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου· καὶ παρῆλθον καὶ ἰδοὺ, οὐκ ἦν, καὶ ἐξεζήτησα τὸν τόπον αὐτοῦ, καὶ οὐχ εὗρον. φύλασσε ἀκακίαν καὶ ἴδε εὐθύτητα, ὅτι ἐστὶν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014/005.yaml
  text: 'And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness, because there is a remnant for a peaceable man.”'
translation:
  language: ko
  text: 그리고 다시 이렇게 말합니다. “내가 악인이 크게 높아지고 레바논의 백향목들처럼 우뚝 솟은 것을 보았습니다. 내가 지나가 보니, 보라, 그는 없었고, 그가 있던 곳을 찾아보았으나 찾지 못했습니다. 순전함을 지키고 정직함을 살피십시오. 평화로운 사람에게는 남은 것이 있기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβῆ
  english_pob_choice: the ungodly
  chosen_korean: 불의한 사람
  alternatives_korean:
  - 경건하지 않은 사람
  - 악한 사람
  lexicon: ἀσεβής
  rationale: 문맥상 단순한 종교적 무신경보다 하나님께 대한 불의와 그에 따른 삶의 왜곡을 드러내므로, ‘불의한 사람’이 POB의 의미를 더 직접적으로 전달합니다.
- source_word: ὑπερυψούμενον καὶ ἐπαιρόμενον
  english_pob_choice: highly exalted and lifted up
  chosen_korean: 아주 높이 들리고 높아진
  alternatives_korean:
  - 극도로 높여지고 치켜세워진
  - 몹시 높임을 받고 떠받들린
  lexicon: ὑπερυψόω / ἐπαίρω
  rationale: 두 동사의 중복된 상승 이미지를 살리되, 한국어에서도 과장된 고양 상태가 느껴지도록 ‘아주 높이 들리고 높아진’으로 옮겼습니다.
- source_word: ἀκακίαν
  english_pob_choice: innocence
  chosen_korean: 순결
  alternatives_korean:
  - 무죄
  - 순진함
  - 악이 없음
  lexicon: ἀκακία
  rationale: 도덕적 무해함과 청결한 삶을 함께 가리키는 표현이어서, 단순 법정적 ‘무죄’보다 윤리적 결을 담는 ‘순결’이 더 가깝습니다.
- source_word: εὐθύτητα
  english_pob_choice: uprightness
  chosen_korean: 올바름
  alternatives_korean:
  - 정직
  - 바름
  - 곧음
  lexicon: εὐθύτης
  rationale: 직선성의 은유를 유지하면서도 한국어에서 자연스럽게 의롭고 반듯한 삶을 나타내는 말로 ‘올바름’을 택했습니다.
- source_word: ἐγκατάλειμμα
  english_pob_choice: a remnant
  chosen_korean: 남은 것이
  alternatives_korean:
  - 남은 자가
  - 잔존분이
  - 남은 무리가
  lexicon: ἐγκατάλειμμα
  rationale: 이 문맥에서는 집단명칭보다 ‘평화로운 사람’에게 남겨진 몫이나 유산의 뉘앙스가 강하므로, 너무 민족적·종말론적으로 좁히지 않고 ‘남은 것’으로 처리했습니다.
- source_word: ἀνθρώπῳ εἰρηνικῷ
  english_pob_choice: for a peaceable man
  chosen_korean: 평화로운 사람에게
  alternatives_korean:
  - 평화를 사랑하는 사람에게
  - 화평한 사람에게
  lexicon: ἀνθρώπῳ εἰρηνικῷ
  rationale: 형용사 εἰρηνικός은 단순히 내면이 শান্ত한 상태보다 평화와 화목을 지향하는 사람을 가리키므로, 표준적이고 이해 가능한 ‘평화로운 사람’으로 옮겼습니다.
theological_decisions:
- issue: 시편 인용의 어투와 1인칭/직설적 문장 처리
  chosen_reading: 원문의 예언적 인용 구조를 살려 “그가 없었습니다… 찾지 못했습니다”처럼 직접 인용의 서술 리듬을 유지했습니다.
  alternative_readings:
  - 서술을 더 매끈하게 재구성하여 인용 표지를 약화시키는 방식
  - 완전한 문어체 성서식 어순으로 재배열하는 방식
  rationale: 이 절은 시편 인용을 다시 인용하는 구조이므로, 서술의 반복과 단절감을 보존해야 구절의 증언적 효과가 살아납니다.
  doctrine_reference: 성경 인용의 문학적 형식 보존
