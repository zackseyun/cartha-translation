    issue: ἀσεβῆ를 ‘불의한 사람’으로 번역함
    rationale: ἀσεβής는 불의 일반보다 불경함·사악함을 뜻합니다. ‘악인’이 원문의 의미와 인용된 시편의 어조를 더 잘 보존합니다.
  - severity: medium
    issue: ὑπερυψούμενον καὶ ἐπαιρόμενον의 한국어 표현이 어색함
    rationale: ‘아주 높이 들리고 높아진’은 수동적 의미를 불필요하게 강화하고 한국어 반복도 부자연스럽습니다. 높아짐과 솟아오름의 병렬을 살려야 합니다.
  - severity: medium
    issue: ἀκακίαν을 ‘순결’로 번역함
    rationale: ‘순결’은 현대 한국어에서 성적 순결을 우선 연상시킬 수 있습니다. 원어의 무악함·흠 없음을 위해 ‘순전함’이 더 적합합니다.
  - severity: low
    issue: 내용 없는 각주 표지 [a][b]가 본문에 남아 있음
    rationale: 제공된 translation_notes 및 각주 자료에 해당 표지의 주석이 없으므로, 독자에게 미해결 참조처럼 보이는 표지는 제거해야 합니다.
