translation:
  language: ko
  text: 서로에게, 우리를 지으신 분의 긍휼과 온유에 따라 친절하게 대합시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηστευσώμεθα
  english_pob_choice: Let us be kind
  chosen_korean: 친절하게 대합시다
  alternatives_korean:
  - 서로 친절합시다
  - 서로에게 은혜롭게 합시다
  lexicon: χρηστεύομαι
  rationale: 권면형 공통행위로서의 동사 의미를 살려, 단순 상태 진술이 아니라 ‘대하다’의 상호적 행위를 드러냈습니다.
- source_word: ἑαυτοῖς
  english_pob_choice: to one another
  chosen_korean: 서로에게
  alternatives_korean:
  - 우리 자신에게
  - 자기 자신에게
  lexicon: ἑαυτοῖς
  rationale: 문맥상 자기애가 아니라 공동체 내부의 상호 권면이므로, 반사대명사의 상호적 용법을 한국어의 ‘서로에게’로 옮겼습니다.
- source_word: εὐσπλαγχνίαν καὶ γλυκύτητα
  english_pob_choice: the compassion and gentleness
  chosen_korean: 긍휼과 온유
  alternatives_korean:
  - 불쌍히 여김과 부드러움
  - 자비와 다정함
  lexicon: εὐσπλαγχνία / γλυκύτης
  rationale: 두 명사 모두 품성의 내적 태도를 가리키므로, 교회적이면서도 원문에 가까운 표준어로 ‘긍휼과 온유’를 택했습니다.
- source_word: τοῦ ποιήσαντος ἡμᾶς
  english_pob_choice: the One who made us
  chosen_korean: 우리를 지으신 분
  alternatives_korean:
  - 우리를 만드신 분
  - 우리를 지으신 이
  lexicon: ποιέω
  rationale: 창조 행위를 가리키는 분사구문을 자연스러운 존칭 서술로 풀어, 하나님 지칭을 직설적으로 확정하지 않으면서도 원문의 호칭 기능을 살렸습니다.
theological_decisions:
- issue: ποιήσαντος ἡμᾶς의 신학적 지칭
  chosen_reading: ‘우리를 지으신 분’으로 번역해 하나님을 직접 명시하지 않고도 창조주를 가리키는 표현을 보존했습니다.
  alternative_readings:
  - ‘하나님’으로 명시하기
  - ‘우리를 만드신 창조주’로 풀기
  rationale: 원문은 일반적 분사구문으로 창조주를 암시하지만 명칭을 직접 쓰지 않으므로, 과도한 명시화를 피하고 문맥이 요구하는 창조-윤리 논리를 유지했습니다.
  doctrine_reference: 창조주-피조물 관계에 근거한 윤리 권면
- issue: ἑαυτοῖς의 상호적 해석
  chosen_reading: ‘서로에게’로 이해하여 공동체 상호 권면으로 옮겼습니다.
  alternative_readings:
  - 재귀적으로 ‘우리 자신에게’
  - 개인적 자기수양으로 해석
  rationale: 본문은 분열을 다루는 권면 속에 있어, 자기지시보다 상호적 화해와 친절을 요구하는 것으로 읽는 것이 문맥에 부합합니다.
  doctrine_reference: 교회 공동체의 상호 사랑과 화평
