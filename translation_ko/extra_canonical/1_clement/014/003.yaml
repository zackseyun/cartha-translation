lexical_decisions:
- source_word: χρηστευσώμεθα
  english_pob_choice: Let us be kind
  chosen_korean: 친절하게 대합시다
  alternatives_korean:
  - 서로 친절합시다
  - 서로에게 은혜롭게 합시다
  lexicon: χρηστεύομαι
  rationale: 권면형 공통행위로서의 동사 의미를 살려, 단순 상태 진술이 아니라 ‘대하다’의 상호적 행위를 드러냈습니다.
- source_word: ἑαυτοῖς
