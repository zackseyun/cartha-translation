id: 1CLEM.25.2
reference: 1 Clement 25:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὄρνεον γάρ ἐστιν, ὃ προσονομάζεται φοῖνιξ· τοῦτο μονογενὲς ὑπάρχον ζῇ ἔτη πεντακόσια, γενόμενόν τε ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό, σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων, εἰς ὃν πληρωθέντος τοῦ χρόνου εἰσέρχεται καὶ τελευτᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/002.yaml
  text: For there is a bird that is called the phoenix. This creature[a], being the only one of its kind, lives for five hundred years; and when it has now come near to the time of its death, it makes for itself a nest from frankincense and myrrh and the other spices. When the time has been fulfilled, it enters into it and dies.
  footnotes:
  - marker: a
    text: Or 'the end of its life'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런데 거기에는 ‘피닉스’라고 불리는 새가 있습니다. 이 새는 자기 종족 가운데 하나뿐인 존재로서 오백 년을 삽니다. 그리고 이제 죽을 때가 가까워지면, 유향과 몰약과 다른 향료들로 자기 자신을 위해 둥지를 만듭니다. 때가 차면 그 안으로 들어가 죽습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄρνεον
  english_pob_choice: a bird
  chosen_korean: 새
  alternatives_korean:
  - 조류
  - 새 한 마리
  lexicon: ὄρνεον
  rationale: 일반 명사로서의 ‘새’를 쓰되, 문맥상 특정 전설적 존재를 가리키므로 과도하게 학술적이거나 설명적인 표현은 피했습니다.
- source_word: μονογενὲς ὑπάρχον
  english_pob_choice: being the only one of its kind
  chosen_korean: 자기 종족 가운데 하나뿐인 존재로서
  alternatives_korean:
  - 그 종류가 유일한 존재로서
  - 유일무이한 존재로서
  lexicon: μονογενής
  rationale: ‘유일한/한 종류뿐인’이라는 뜻을 살리면서, 한국어에서 자연스럽고 원문의 존재론적 강조가 드러나도록 옮겼습니다.
- source_word: ἤδη πρὸς ἀπόλυσιν τοῦ ἀποθανεῖν αὐτό
  english_pob_choice: when it has now come near to the time of its death
  chosen_korean: 이제 죽을 때가 가까워지면
  alternatives_korean:
  - 이제 죽음의 시기에 이르면
  - 이제 죽으려 할 무렵이면
  lexicon: ἀπόλυσις / ἀποθανεῖν
  rationale: POB의 수정 취지를 따라 단순히 ‘생의 끝’이 아니라 죽음 자체를 분명히 드러내되, 한국어로는 ‘죽을 때가 가까워지다’가 가장 자연스럽습니다.
- source_word: σηκὸν ἑαυτῷ ποιεῖ ἐκ λιβάνου καὶ σμύρνης καὶ τῶν λοιπῶν ἀρωμάτων
  english_pob_choice: it makes for itself a nest from frankincense and myrrh and the other spices
  chosen_korean: 유향과 몰약과 다른 향료들로 자기 자신을 위해 둥지를 만듭니다
  alternatives_korean:
  - 유향과 몰약과 다른 향품들로 자기 둥지를 지읍니다
  - 유향과 몰약과 그 밖의 향료들로 자기에게 둥지를 만듭니다
  lexicon: σηκός / λιβανός / σμύρνα / ἀρώματα
  rationale: ‘둥지’는 POB의 기본 대응을 따르되, 재료 목록은 원문의 열거를 그대로 살려 ‘유향·몰약·다른 향료들’로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 직접화법 없이 전설적 예시를 서술하는 방식
  chosen_reading: 이 절은 교리 진술이 아니라 피닉스에 대한 설명적 서술로 처리했습니다.
  alternative_readings:
  - 상징적 의미를 덧붙여 해석하는 방식
  - 본문을 도덕적 교훈으로 재구성하는 방식
  rationale: 원문은 새의 생애를 예시적으로 서술할 뿐이므로, 의미를 확장하지 않고 서술체를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 문맥 보존 및 과잉해석 방지
- issue: ‘죽음의 때’와 ‘죽을 때가 가까워지면’의 선택
  chosen_reading: POB의 수정에 맞추어 죽음 자체를 명시하되, 한국어에서는 자연스러운 ‘죽을 때가 가까워지면’으로 풀었습니다.
  alternative_readings:
  - 생의 끝이 가까워지면
  - 죽음의 시기에 이르면
  rationale: ἀπόλυσις와 τοῦ ἀποθανεῖν의 결합은 단순한 ‘생의 끝’보다 죽음의 도래를 더 직접적으로 말하므로 그 긴장을 약화시키지 않아야 합니다.
  doctrine_reference: 본문 의미 보존
