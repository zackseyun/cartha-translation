  to: 피닉스라고 불리는 새가 있기 때문입니다. 이 새는 그 종류가 하나뿐이며 오백 년을 삽니다. 그리고 죽음에 이를 때가 가까워지면[a], 유향과 몰약과 그 밖의 향료들로 자기를 위해 둥지를 만듭니다. 때가 차면 그 안으로 들어가 죽습니다.
