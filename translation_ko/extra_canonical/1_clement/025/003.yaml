id: 1CLEM.25.3
reference: 1 Clement 25:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: σηπομένης δὲ τῆς σαρκὸς σκώληξ τις γεννᾶται, ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ· εἶτα γενναῖος γενόμενος αἴρει τὸν σηκὸν ἐκεῖνον, ὅπου τὰ ὀστᾶ τοῦ προγεγονότος ἐστίν, καὶ ταῦτα βαστάζων διανύει ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/003.yaml
  text: But as its flesh decays[a], a certain worm is produced, which, being nourished from the moisture of the dead creature, grows wings. Then, when it has become strong, it lifts up that nest in which are the bones of the one that came before, and carrying them it travels from the land of Arabia as far as Egypt, to the city called Heliopolis.
  footnotes:
  - marker: a
    text: Or 'and being nourished from the moisture of the dead creature, it grows wings'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 그 육체가 썩어 갈 때, 어떤 벌레 하나가 생기는데, 그것은 죽은 짐승의 수분에서 양육되어 날개가 돋습니다. 그러다가 그것이 장성하면, 그 이전 것의 뼈들이 있는 그 보금자리를 들어 올리고, 그것들을 지고 아라비아 땅에서 이집트에 이르기까지, 이른바 헬리오폴리스로 여행합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σηπομένης δὲ τῆς σαρκὸς
  english_pob_choice: But as its flesh decays
  chosen_korean: 그러나 그 육체가 썩어 갈 때
  alternatives_korean:
  - 그러나 그 살이 부패할 때
  - 그 육체가 썩어 가는 동안
  lexicon: σαρξ
  rationale: σάρξ는 여기서 ‘살’보다 문맥상 죽어 가는 몸 전체를 가리키는 표현이 자연스러워 ‘육체’로 옮기되, 현재 진행의 부패 과정을 나타내기 위해 ‘썩어 갈 때’로 처리했습니다.
- source_word: ὃς ἐκ τῆς ἰκμάδος τοῦ τετελευτηκότος ζώου ἀνατρεφόμενος πτεροφυεῖ
  english_pob_choice: which, being nourished from the moisture of the dead creature, grows wings
  chosen_korean: 그것은 죽은 짐승의 수분에서 양육되어 날개가 돋습니다
  alternatives_korean:
  - 죽은 짐승의 수분으로 자라 날개가 생깁니다
  - 죽은 생물의 즙을 먹고 자라 날개가 돋습니다
  lexicon: ἰκμάς / ζῷον / ἀνατρέφω / πτεροφυέω
  rationale: ἰκμάς는 ‘수분, 즙’의 뜻이므로 해석을 과장하지 않고 ‘수분’으로 옮겼고, ἀνατρεφόμενος의 수동적 양육 뉘앙스를 살려 ‘양육되어’로 처리했습니다. πτεροφυεῖ는 직역하면 ‘날개가 돋다’이므로 이를 유지했습니다.
- source_word: αἴρει τὸν σηκὸν ἐκεῖνον
  english_pob_choice: it lifts up that nest
  chosen_korean: 그 이전 것의 뼈들이 있는 그 보금자리를 들어 올리고
  alternatives_korean:
  - 그 보금자리를 들어 올리고
  - 그 둥지를 들어 올리고
  lexicon: σηκός
  rationale: σηκός는 새의 둥지/보금자리를 가리킬 수 있으나, 이어지는 ‘뼈들’과 결합하여 단순한 둥지보다 ‘보금자리’가 더 구체적으로 살아 있는 구조를 드러내므로 이를 선택했습니다.
- source_word: ἀπὸ τῆς Ἀραβικῆς χώρας ἕως τῆς Αἰγύπτου εἰς τὴν λεγομένην Ἡλιούπολιν
  english_pob_choice: from the land of Arabia as far as Egypt, to the city called Heliopolis
  chosen_korean: 아라비아 땅에서 이집트에 이르기까지, 이른바 헬리오폴리스로
  alternatives_korean:
  - 아라비아 지역에서 이집트까지, 이른바 헬리오폴리스로
  - 아라비아 땅으로부터 이집트의 이른바 헬리오폴리스까지
  lexicon: Ἀραβική χώρα / Αἴγυπτος / Ἡλιούπολις
  rationale: 지명 열거의 흐름을 보존하기 위해 ‘땅에서 …에 이르기까지’ 구조를 살렸고, λεγομένην은 ‘이른바’로 옮겨 지명 호칭의 주석적 성격을 드러냈습니다.
theological_decisions:
- issue: 이 구절이 전승된 자연사적 예시를 어떻게 다룰지
  chosen_reading: 교훈적 수사로서의 자연사적 예시를 그대로 보존했습니다.
  alternative_readings:
  - 비유적으로 완화하여 옮김
  - 설명적 주석을 덧붙여 상징화함
  rationale: 본문은 부활/재생의 예증으로 쓰이는 자연사 서술을 직접 제시하므로, 의미를 약화시키지 않고 서술의 생생함을 유지하는 것이 source-direct에 부합합니다.
  doctrine_reference: 1 Clement의 예증적 논증 방식
