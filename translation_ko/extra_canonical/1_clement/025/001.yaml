id: 1CLEM.25.1
reference: 1 Clement 25:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἴδωμεν τὸ παράδοξον σημεῖον τὸ γινόμενον ἐν τοῖς ἀνατολικοῖς τόποις, τουτέστιν τοῖς περὶ τὴν Ἀραβίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/001.yaml
  text: Let us consider the remarkable sign that takes place in the eastern regions, that is, in the areas around Arabia.
translation:
  language: ko
  text: 이 놀라운 표적을, 곧 아라비아 주변의 동쪽 지역에서 일어나는 이 표적을 살펴봅시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδωμεν
  english_pob_choice: Let us consider
  chosen_korean: 살펴봅시다
  alternatives_korean:
  - 생각해 봅시다
  - 보아야 합니다
  lexicon: ἴδωμεν
  rationale: 권면형 공동 초대로서 단순한 ‘보다’보다 내용을 숙고하라는 뉘앙스를 살려 ‘살펴봅시다’로 옮겼습니다.
- source_word: τὸ παράδοξον σημεῖον
  english_pob_choice: the remarkable sign
  chosen_korean: 이 놀라운 표적
  alternatives_korean:
  - 이 기이한 표적
  - 이 놀라운 징조
  lexicon: παράδοξον / σημεῖον
  rationale: παράδοξον의 ‘비상함/기이함’과 σημεῖον의 ‘표적’ 성격을 함께 드러내되, 한국어에서 자연스러운 ‘놀라운 표적’을 택했습니다.
- source_word: ἐν τοῖς ἀνατολικοῖς τόποις
  english_pob_choice: in the eastern regions
  chosen_korean: 동쪽 지역에서
  alternatives_korean:
  - 동방 지역에서
  - 동쪽 지방에서
  lexicon: ἀνατολικοῖς τόποις
  rationale: 지리적 범위를 자연스럽게 전달하면서도, 문맥상 특정한 동쪽 방위를 뜻하는 표현을 과도하게 고정하지 않기 위해 ‘동쪽 지역에서’로 처리했습니다.
- source_word: τουτέστιν τοῖς περὶ τὴν Ἀραβίαν
  english_pob_choice: that is, in the areas around Arabia
  chosen_korean: 곧 아라비아 주변의
  alternatives_korean:
  - 즉 아라비아 둘레의
  - 말하자면 아라비아 인근의
  lexicon: τουτέστιν / περὶ τὴν Ἀραβίαν
  rationale: τουτέστιν의 설명 기능을 ‘곧’으로 풀고, περὶ + 대격의 둘레/주변 의미를 살려 ‘아라비아 주변의’로 옮겼습니다.
theological_decisions:
- issue: σημεῖον을 단순한 ‘징후’가 아니라 공동체가 주목해야 할 ‘표적’으로 볼지 여부
  chosen_reading: ‘표적’으로 옮겨, 단순 현상 설명이 아니라 의미를 지닌 사건임을 드러냈습니다.
  alternative_readings:
  - 징조
  - 표지
  rationale: 문맥의 수사적 목적은 독자에게 신기한 사건을 보게 하는 것이므로, 해석적 무게를 유지하는 ‘표적’이 가장 적절합니다.
  doctrine_reference: 공동체 권면의 서사적 표지 이해
