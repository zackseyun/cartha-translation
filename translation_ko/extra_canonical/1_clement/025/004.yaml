id: 1CLEM.25.4
reference: 1 Clement 25:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἡμέρας, βλεπόντων πάντων, ἐπιπτὰς ἐπὶ τὸν τοῦ ἡλίου βωμὸν τίθησιν αὐτὰ καὶ οὕτως εἰς τοὐπίσω ἀφορμᾷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/025/004.yaml
  text: And by day[a], in the sight of all, it flies to the altar of the sun, places them there, and so starts back.
  footnotes:
  - marker: a
    text: Or 'And in daytime, in the sight of all, it flies to the altar of the sun and places them there, and so sets out back again.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 낮에, 모든 사람이 보는 앞에서, 그것은 태양의 제단으로 날아가 그것들을 거기에 놓고, 그렇게 해서 되돌아 출발합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρας
  english_pob_choice: by day
  chosen_korean: 낮에
  alternatives_korean:
  - 대낮에
  - 낮 동안에
  lexicon: ἡμέρα
  rationale: 시간의 부사적 용법을 자연스러운 현대 한국어로 옮기되, 단순한 ‘낮’보다 문장 연결이 자연한 ‘낮에’를 택했습니다.
- source_word: βλεπόντων πάντων
  english_pob_choice: in the sight of all
  chosen_korean: 모든 사람이 보는 앞에서
  alternatives_korean:
  - 모든 사람 앞에서
  - 누구나 보는 앞에서
  lexicon: βλέπω
  rationale: 공개적으로 목격되는 장면이라는 점을 분명히 드러내기 위해 관용적인 표현으로 옮겼습니다.
- source_word: ἐπιπτὰς ἐπὶ τὸν τοῦ ἡλίου βωμὸν
  english_pob_choice: it flies to the altar of the sun
  chosen_korean: 태양의 제단으로 날아가
  alternatives_korean:
  - 태양의 제단 위로 날아가
  - 해의 제단으로 날아가
  lexicon: βωμός
  rationale: βωμός를 ‘제단’으로 직역하고, ἐπιπτὰς의 급작스러운 움직임을 ‘날아가’로 살렸습니다. ‘태양의’는 원문의 τοῦ ἡλίου를 그대로 반영합니다.
- source_word: τίθησιν αὐτὰ
  english_pob_choice: places them there
  chosen_korean: 그것들을 거기에 놓고
  alternatives_korean:
  - 그것들을 거기에 두고
  - 그것을 거기에 놓고
  lexicon: τίθημι
  rationale: 대상을 가리키는 복수 대명사 αὐτὰ를 반영해 ‘그것들을’로 옮겼고, 동작의 단순함을 유지했습니다.
- source_word: εἰς τοὐπίσω ἀφορμᾷ
  english_pob_choice: so starts back
  chosen_korean: 그렇게 해서 되돌아 출발합니다
  alternatives_korean:
  - 그렇게 되돌아갑니다
  - 그리하여 돌아서서 출발합니다
  lexicon: ἀφορμάω
  rationale: 단순히 ‘돌아가다’보다, 출발/발진의 뉘앙스를 가진 ἀφορμᾷ를 살리기 위해 ‘되돌아 출발합니다’로 옮겼습니다.
