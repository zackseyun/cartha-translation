  yaml_path: translation/extra_canonical/1_clement/025/005.yaml
  text: So then the priests inspect the records of the times[a], and they find that it came when the five-hundredth year was completed.
  footnotes:
  - marker: a
    text: Or 'when the five hundredth year has been completed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 제사장들은 연대 기록을 살펴보고, 오백 번째 해가 찼을 때 그것이 왔다는 것을 알아냅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “오백 번째 해가 완료되었을 때.”
    reason: πεπληρωμένου의 ‘완료된’ 뉘앙스를 보존하는 대안 번역입니다.
lexical_decisions:
- source_word: οἱ οὖν ἱερεῖς
  english_pob_choice: So then the priests
  chosen_korean: 그러므로 제사장들은
  alternatives_korean:
  - 그리하여 제사장들은
  - 그러니 제사장들은
  lexicon: ἱερεῖς
  rationale: οἱ οὖν은 문맥상 결론을 잇는 연결어이므로 ‘그러므로’로 옮기고, ἱερεῖς는 일반적으로 ‘제사장들’이 가장 직접적인 대응입니다.
- source_word: τὰς ἀναγραφὰς τῶν χρόνων
  english_pob_choice: the records of the times
  chosen_korean: 시대의 기록들을
  alternatives_korean:
  - 시간의 기록들을
  - 연대 기록들을
  lexicon: ἀναγραφή / χρόνοι
  rationale: ἀναγραφάς는 단순한 ‘기록’이 아니라 목록화된 기록이라는 뜻이 강하고, τῶν χρόνων은 연대의 흐름을 가리키므로 자연스럽게 ‘시대의 기록들’로 옮겼습니다.
- source_word: πεντακοσιοστοῦ ἔτους πεπληρωμένου
  english_pob_choice: at the completion of the five-hundredth year
  chosen_korean: 오백 년째 해가 끝났을 때
  alternatives_korean:
  - 오백째 해가 완료되었을 때
  - 오백 년째 해의 완성 때
  lexicon: πεντακοσιοστοῦ ἔτους / πεπληρωμένου
  rationale: 완료된 상태를 나타내는 분사구를 한국어의 시간 부사절로 풀어, 오백 번째 해가 ‘끝난 시점’을 분명히 드러냈습니다.
- source_word: ἐληλυθέναι
  english_pob_choice: it came
  chosen_korean: 그것이 왔음을
  alternatives_korean:
  - 그것이 이르렀음을
  - 그것이 도착했음을
  lexicon: ἐληλυθέναι
  rationale: 보고된 사실을 나타내는 부정법이므로 직접 서술이 아니라 간접화된 ‘왔음을’으로 처리해, POB의 수정 의도와 문법 기능을 함께 살렸습니다.
theological_decisions:
- issue: 제사장이 연대 기록을 살핀다는 서술의 기능
  chosen_reading: 본문은 제사장들의 문헌 검토를 통해 사건의 때가 확인된다는 역사적 진술로 읽었습니다.
  alternative_readings:
  - 상징적 예언 성취를 강조하는 독법
  - 단순한 연대 계산의 문장으로만 축소하는 독법
  rationale: 그리스어는 예언적 상징을 과장하지도, 단순 계산으로 축소하지도 않고 기록 조사와 시점 확인을 함께 말합니다.
  doctrine_reference: 성경 해석의 문법-역사적 읽기
