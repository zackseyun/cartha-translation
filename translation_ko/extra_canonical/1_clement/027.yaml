  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027.yaml
  text: So then[a], let our souls be bound to this hope by the One who is faithful in his promises and righteous in his judgments. He who commanded us not to lie will much more not himself lie; for nothing is impossible with God, except to lie. Therefore let faith in him be rekindled in us, and let us understand that all things are near to him. By a word of his majesty he established all things, and by a word he is able to overturn them[b]. Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away. All things are before him, and nothing has escaped his purpose. The heavens declare the glory of God, and the firmament proclaims the work of his hands; day pours forth speech to day, and night announces knowledge to night[d][c]; and there are no words or utterances whose voices are not heard.
  footnotes:
  - marker: a
    text: The final sentence echoes Psalm 19:1–3(4 LXX), cited as scriptural support for God's all-seeing sovereignty and manifest glory in creation.
    reason: cross_reference
  - marker: b
    text: Or 'nothing will pass by from the things decreed by him'—that is, none of God's determinations will fail to stand.
    reason: lexical_alternative
  - marker: c
    text: Or 'let our souls be bound to this hope in the One who is faithful'.
    reason: previous_rendering
  - marker: d
    text: Or 'Since the heavens declare the glory of God,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리의 영혼은, 그 약속들에 신실하시고 그 심판들에 의로우신 이에게 이 희망으로 묶여 있어야 합니다. 거짓말하지 말라고 명령하신 분께서 자신은 더욱더 거짓말하지 않으실 것입니다. 하나님께는 거짓말하는 것을 제외하고는 불가능한 것이 없습니다. 그러므로 그분에 대한 믿음이 우리 안에서 다시 불붙게 하고, 모든 것이 그분 가까이에 있음을 깨닫게 합시다. 그분은 그분의 위엄의 말씀으로 만물을 세우셨고, 말씀으로 그것들을 뒤엎으실 수도 있습니다. 누가 그분께 “무엇을 하셨습니까?”라고 말하겠습니까? 또 누가 그분의 능력의 힘을 견디겠습니까? 그분이 원하실 때, 또 그분이 원하시는 대로, 모든 일을 하실 것이며, 그분이 정하신 것들 가운데 하나도 결코 지나가 버리지 않을 것입니다. 만물이 그분 앞에 있으며, 아무것도 그분의 뜻에서 벗어나지 않았습니다. 하늘들은 하나님의 영광을 선포하고, 궁창은 그분 손의 일을 알리며, 낮은 낮에게 말을 쏟아내고, 밤은 밤에게 지식을 알리며, 그들의 소리가 들리지 않는 말이나 발언은 없습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν
  english_pob_choice: let our souls be bound to this hope
  chosen_korean: 우리의 영혼은 이 희망으로 묶여 있어야 합니다
  alternatives_korean:
  - 이 희망에 매여 있어야 합니다
  - 이 희망에 붙들려 있어야 합니다
  lexicon: LSJ
  rationale: προσδεδέσθωσαν의 ‘묶이다/결속되다’ 이미지를 살리되, 현대 한국어에서는 상태를 나타내는 ‘~되어야 합니다’로 옮겨 지속적 결속을 드러냈습니다.
- source_word: τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν
  english_pob_choice: the One who is faithful in his promises and righteous in his judgments
  chosen_korean: 그 약속들에 신실하시고 그 심판들에 의로우신 이
  alternatives_korean:
  - 약속들에 신실하시고 심판들에 의로우신 이
  - 약속에 신실하고 판결에 의로우신 분
  lexicon: BDAG
  rationale: πιστός/δίκαιος의 병렬을 ‘신실하시고… 의로우신’으로 살리고, ἐπαγγελίαι·κρίματα는 문맥상 복수성을 유지해 ‘약속들/심판들’로 옮겼습니다.
- source_word: ἀναζωπυρησάτω οὖν ἡ πίστις αὐτοῦ ἐν ἡμῖν
  english_pob_choice: let faith in him be rekindled in us
  chosen_korean: 그분에 대한 믿음이 우리 안에서 다시 불붙게 하고
  alternatives_korean:
  - 그분에 대한 믿음이 우리 안에서 다시 살아나게 하고
  - 그분을 향한 믿음이 우리 안에서 다시 타오르게 하고
  lexicon: LSJ
  rationale: 불을 다시 지핀다는 동사를 자연스러운 한국어 관용으로 풀되, ‘믿음’의 대상이 그분임을 분명히 했습니다.
- source_word: ἐν λόγῳ τῆς μεγαλωσύνης αὐτοῦ
  english_pob_choice: By a word of his majesty
  chosen_korean: 그분의 위엄의 말씀으로
  alternatives_korean:
  - 그분의 위엄의 한 말씀으로
  - 그분의 위엄 있는 말씀으로
  lexicon: BDAG
  rationale: ἐν λόγῳ는 수단을 나타내므로 ‘~으로’로 옮기고, μεγαλοσύνη를 ‘위엄’으로 번역해 장엄한 창조적 발화를 살렸습니다.
- source_word: ἐρεύγεται ῥῆμα
  english_pob_choice: pours forth speech
  chosen_korean: 말을 쏟아내고
  alternatives_korean:
  - 말을 토해내고
  - 말을 흘려보내고
  lexicon: LSJ
  rationale: 시적이고 풍성한 발화를 뜻하는 동사를 직역보다 자연스럽게 살려, 시편 인용의 리듬을 유지했습니다.
theological_decisions:
- issue: 하나님의 거짓말 불가능성
  chosen_reading: ‘하나님께는 거짓말하는 것을 제외하고는 불가능한 것이 없습니다’로 옮겨, 전능을 약화시키지 않으면서 거짓말은 하나님의 성품에 반하는 것임을 분명히 했습니다.
  alternative_readings:
  - ‘하나님께는 아무것도 불가능하지 않습니다’
  - ‘하나님은 거짓말하실 수 없습니다’
  rationale: 본문은 능력의 한계를 말하는 것이 아니라, 거짓말이 하나님의 본성과 양립할 수 없다는 점을 강조합니다.
  doctrine_reference: 하나님의 전능성과 सत्य성(진실하심)을 함께 보존
