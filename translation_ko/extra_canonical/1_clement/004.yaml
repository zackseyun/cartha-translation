base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/004.yaml
  text: 'For it is written thus: “And it came to pass after some days that Cain brought from the fruits of the earth a sacrifice to God[a], and Abel also brought from the firstborn of the sheep and from their fat portions. And God looked upon Abel and upon his gifts, but to Cain and to his sacrifices he paid no attention. And Cain was greatly grieved, and his face fell. And God said to Cain, ‘Why have you become deeply grieved, and why has your face fallen? If you offer rightly, but do not divide rightly, have you not sinned? Be still; his turning is toward you, and you shall rule over him.’ And Cain said to Abel his brother, ‘Let us go out into the field.’ And it came to pass, while they were in the field, Cain rose up against Abel his brother and killed him.” You see, brothers, jealousy and envy brought about brother-murder. Because of jealousy our father Jacob fled from the face of Esau his brother. Jealousy caused Joseph to be persecuted even to death and to come even into slavery. Jealousy
    compelled Moses to flee from the face of Pharaoh king of Egypt, when he heard from his fellow tribesman, ‘Who appointed you judge or magistrate over us? Do you want to kill me, as you killed the Egyptian yesterday?’ Because of jealousy Aaron and Miriam lodged outside the camp. Jealousy brought Dathan and Abiram down alive into Hades because they rebelled against Moses, the attendant of God. Because of jealousy David incurred envy not only from the foreigners[b][c][d][e][e][f], but was also persecuted by Saul king of Israel.'
  footnotes:
  - marker: a
    text: The wording of the Genesis citation is difficult in Greek and likely reflects the Septuagint form of Genesis 4:7. 'Do not divide rightly' may also be understood as 'do not apportion rightly' or 'do not distinguish rightly.'
    reason: lexical_alternative
    anchor_ref: '4:4'
  - marker: f
    text: The pair 'jealousy and envy' renders two related but distinct Greek terms, ζῆλος and φθόνος.
    reason: lexical_alternative
    anchor_ref: '4:7'
  - marker: e
    text: '''Hades'' is the Greek term for the realm of the dead.'
    reason: cultural_note
    anchor_ref: '4:12'
  - marker: e
    text: See Numbers 16 for the rebellion of Dathan and Abiram against Moses.
    reason: cross_reference
    anchor_ref: '4:12'
  - marker: d
    text: Or 'but upon Cain and upon his sacrifices he did not pay attention.'.
    reason: previous_rendering
  - marker: c
    text: Or 'Let us go through into the field.'.
    reason: previous_rendering
  - marker: b
    text: Or 'Who appointed you ruler or judge over us?'.
    reason: previous_rendering
translation:
  language: ko
  text: 기록된 바와 같습니다. “며칠 후에 가인은 땅의 열매로 하나님께 제물을 드렸고, 아벨도 자기의 양 떼의 맏배들과 그 기름기로 드렸습니다. 하나님께서는 아벨과 그의 예물에는 눈을 돌리셨으나, 가인과 그의 제물에는 눈길을 두지 않으셨습니다. 가인은 몹시 근심하였고, 얼굴이 떨어졌습니다. 하나님께서 가인에게 말씀하셨습니다. ‘어찌하여 네가 깊이 근심하느냐, 어찌하여 네 얼굴이 떨어졌느냐? 네가 올바르게 드리면서도 올바르게 나누지 않으면, 죄를 지은 것이 아니냐? 잠잠하라. 그의 돌아섬은 네게 있고, 너는 그를 다스릴 것이다.’ 가인이 자기 형제 아벨에게 말했습니다. ‘들로 나가자.’ 그들이 들에 있었을 때, 가인이 자기 형제 아벨에게 일어나 그를 죽였습니다.” 형제 여러분, 보십시오. 질투와 시기는 형제 살인을 일으켰습니다. 질투 때문에 우리 조상 야곱은 자기 형 에서의 얼굴을 피해 달아났습니다. 질투는 요셉을 죽음에 이르기까지 박해받게 했고, 노예가 되게까지 했습니다. 질투는 모세가 이집트 왕 바로의 얼굴을 피해 달아나도록 강요했습니다. 그가 동족에게서 이런 말을 들었기 때문입니다. ‘누가 너를 우리 위에 심판관이나 재판관으로 세웠느냐? 네가 어제 이집트인을 죽인 것처럼 나도 죽이려 하느냐?’ 질투 때문에 아론과 미리암은 진 밖에 묵었습니다. 질투는 다단과 아비람이 하나님의 시종 모세를 거슬러 반역했기 때문에 그들을 산 채로 하데스로 내려가게 했습니다. 질투 때문에 다윗은 이방인들에게서뿐 아니라 이스라엘 왕 사울에게서도 시기를 받았습니다.”[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν
  english_pob_choice: sacrifice
  chosen_korean: 제물
  alternatives_korean:
  - 희생제물
  - 제사
  lexicon: LSJ
  rationale: 여기서는 제의적 ‘희생’보다 헌정된 예물의 성격을 살리면서도, 뒤의 δώροις(예물)와 구별되는 제의적 의미를 유지하는 ‘제물’이 가장 자연스럽습니다.
- source_word: πρωτοτόκων
  english_pob_choice: firstborn
  chosen_korean: 맏배들
  alternatives_korean:
  - 첫 새끼들
  - 맏것들
  lexicon: LSJ
  rationale: 양 떼의 첫 태생이라는 동물 제물 맥락을 반영해 ‘맏배들’로 옮겨, 단순한 출생 순서를 넘는 제의적 우선성을 드러냈습니다.
- source_word: οὐ προσέσχεν
  english_pob_choice: did not pay attention
  chosen_korean: 눈길을 두지 않으셨습니다
  alternatives_korean:
  - 돌보지 않으셨습니다
  - 주시하지 않으셨습니다
  lexicon: LSJ
  rationale: 하나님의 비수용을 직역체로만 두기보다, ‘주의를 기울이다/눈길을 두다’의 관용을 살려 자연스럽게 표현했습니다.
- source_word: συνέπεσεν τῷ προσώπῳ
  english_pob_choice: his face fell
  chosen_korean: 얼굴이 떨어졌습니다
  alternatives_korean:
  - 얼굴빛이 어두워졌습니다
  - 낯이 떨어졌습니다
  lexicon: LSJ
  rationale: 원문의 신체적 관용을 살리되 한국어 성경체에서 읽히도록 ‘얼굴이 떨어지다’로 직역에 가깝게 옮겼습니다.
- source_word: ὀρθῶς δὲ μὴ διέλῃς
  english_pob_choice: do not divide rightly
  chosen_korean: 올바르게 나누지 않으면
  alternatives_korean:
  - 올바르게 분별하지 않으면
  - 올바르게 분배하지 않으면
  lexicon: LSJ
  rationale: 이 구절은 난해하므로 원문의 모호성을 해치지 않도록 ‘나누다’의 기본 의미를 유지해 해석을 과도하게 좁히지 않았습니다.
- source_word: ζῆλος / φθόνος
  english_pob_choice: jealousy and envy
  chosen_korean: 질투와 시기
  alternatives_korean:
  - 시기와 질투
  - 질투와 부러움
  lexicon: BDAG
  rationale: 두 개의 관련된 악덕을 구분해 반복시키는 수사 효과를 살리기 위해 ‘질투’와 ‘시기’를 함께 사용했습니다.
- source_word: ἀδελφοκτονίαν
  english_pob_choice: brother-murder
  chosen_korean: 형제 살인
  alternatives_korean:
  - 친형제 살해
  - 형제 살해
  lexicon: LSJ
  rationale: 합성어의 충격을 유지하면서도 현대 한국어에서 즉시 이해되도록 ‘형제 살인’으로 옮겼습니다.
- source_word: ὁμοφύλου
  english_pob_choice: fellow tribesman
  chosen_korean: 동족
  alternatives_korean:
  - 동족 사람
  - 같은 겨레
  lexicon: LSJ
  rationale: 모세의 대화 상대를 혈연·민족적 연대가 있는 자로 가리키므로, 현대 한국어에서 가장 포괄적이고 자연스러운 ‘동족’을 택했습니다.
- source_word: ᾅδου
  english_pob_choice: Hades
  chosen_korean: 하데스
  alternatives_korean:
  - 음부
  - 사망의 세계
  lexicon: BDAG
  rationale: 그리스어 고유 용어를 보존해 본문의 우주론적 범주를 유지했습니다.
theological_decisions:
- issue: 하나님이 가인과 그의 제물에 대해 ‘눈길을 두지 않으셨다’는 표현
  chosen_reading: 하나님의 비수용을 직접적으로 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 받아들이지 않으셨습니다
  - 인정하지 않으셨습니다
  rationale: 본문은 제의의 수용 여부를 서술하므로, 심리적 완곡어보다 원문의 판정적 뉘앙스를 살리는 것이 적절합니다.
  doctrine_reference: 하나님의 판단과 제의 수용의 구별
