  rationale: 누락된 ‘도살장으로 끌려감’을 복원하고, 두 비유와 결론의 상관 구조를 명시했습니다. ‘고난을 당하시면서도’는 그리스어의 수난과 침묵의 연결을 자연스럽게 옮기며, 마지막 문장은 원문 및 영어 POB의 법정적·수동적 표현을 유지합니다. 영어 전용 대안 번역 각주는 한국어에서 불필요하므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:54Z'
