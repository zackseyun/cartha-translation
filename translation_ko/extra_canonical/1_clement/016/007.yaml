id: 1CLEM.16.7
reference: 1 Clement 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν, καὶ αὐτὸς διὰ τὸ κεκακῶσθαι οὐκ ἀνοίγει τὸ στόμα. ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείραντος ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/007.yaml
  text: 'And the Lord gave him over for our sins,

    and he[a], because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and as a lamb before its shearer is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.'
  footnotes:
  - marker: a
    text: Or 'and like a lamb before the one shearing it is voiceless'.
    reason: previous_rendering
translation:
  language: ko
  text: '주께서는 우리의 죄들 때문에 그를 넘겨주셨고,

    그는 고난을 당하시면서도 자기 입을 열지 않으십니다.

    그는 도살장으로 끌려가는 양처럼,

    털 깎는 이 앞에서 소리 없는 어린양처럼,

    이와 같이 자기 입을 열지 않으십니다.

    그의 굴욕 가운데서 그의 판결은 거두어졌습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서는
  alternatives_korean:
  - 주님께서는
  - 주께서
  lexicon: κύριος
  rationale: 여기서는 인용문 전체의 주체로서 ‘주’를 유지하되, 한국어 서술문 흐름에 맞게 주격 조사와 높임을 살려 번역했습니다.
- source_word: παρέδωκεν αὐτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  english_pob_choice: gave him over for our sins
  chosen_korean: 그를 넘겨주셨고, 우리의 죄들 때문에
  alternatives_korean:
  - 그를 내주셨고, 우리의 죄들 때문에
  - 우리의 죄들로 말미암아 그를 넘겨주셨고
  lexicon: παραδίδωμι
  rationale: 단순한 ‘주시다’보다 ‘넘겨주다’가 희생적 인도와 인계의 뉘앙스를 더 직접적으로 드러내며, ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν은 ‘우리의 죄들 때문에’로 원인/대가 관계를 살렸습니다.
- source_word: κεκακῶσθαι / οὐκ ἀνοίγει τὸ στόμα
  english_pob_choice: because of being afflicted / does not open his mouth
  chosen_korean: 고난을 받으셨기에 자기 입을 열지 않으십니다
  alternatives_korean:
  - 괴로움을 당하셨기에 자기 입을 열지 않으십니다
  - 괴롭힘을 당하셨기에 자기 입을 열지 않으십니다
  lexicon: κακόω
  rationale: 영어 POB의 ‘afflicted’를 따라 ‘고난을 받다’로 옮기되, 무고한 수난의 맥락을 보존했습니다. ‘자기 입을 열지 않으십니다’는 반복되는 히브리 시편/이사야식 관용을 자연스럽게 살립니다.
- source_word: ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη
  english_pob_choice: In his humiliation his judgment was taken away
  chosen_korean: 그의 굴욕 속에서 그의 판결은 거두어졌습니다
  alternatives_korean:
  - 그의 낮아짐 속에서 그의 판결은 빼앗겼습니다
  - 그의 비천함 속에서 그의 재판은 제거되었습니다
  lexicon: ταπείνωσις / κρίσις / αἴρω
  rationale: ταπείνωσις는 단순한 겸손보다 수치와 낮아짐의 상태를 가리켜 ‘굴욕’이 더 강하게 대응하며, κρίσις는 문맥상 ‘재판’보다 ‘판결’이 더 결과 중심입니다.
theological_decisions:
- issue: 주어와 수난의 인과를 어떻게 드러낼지
  chosen_reading: 주께서 그를 넘겨주신 행위와, 그가 고난을 받음에도 침묵하시는 모습이 함께 메시아의 대속적 수난으로 읽히도록 배치했습니다.
  alternative_readings:
  - 문장별로 단순 병렬하여 인과를 약화시키는 방식
  - ‘대속’ 용어를 본문에 직접 삽입하는 방식
  rationale: 원문은 이사야의 고난받는 종 전승을 직접 호출하며, 인과와 침묵의 결합이 핵심입니다. 해설어를 덧붙이기보다 문장 구조로 그 의미를 드러내는 편이 source-grounded입니다.
  doctrine_reference: 이사야 53장 전승, 고난받는 종 모티프
- issue: ‘판결’의 의미 범위
  chosen_reading: ‘판결’로 두어 משפט 계열의 법적·사법적 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘재판’으로 옮겨 절차적 측면을 강조하는 방식
  - ‘정의’로 옮겨 윤리적 의미를 부각하는 방식
  rationale: ἡ κρίσις αὐτοῦ는 여기서 법정적 판단/선고를 가리키므로, 결과로서의 판결을 뜻하는 ‘판결’이 가장 오해가 적습니다.
  doctrine_reference: 사법적 무죄 박탈과 종의 고난
