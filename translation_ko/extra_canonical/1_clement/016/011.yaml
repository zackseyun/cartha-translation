    reason: περὶ ἁμαρτίας의 제의적 함의와 원문의 목적어 생략을 밝혀, 본문에 해석적 보충을 하지 않으면서 자연스러운 이해를 돕습니다.
lexical_decisions:
- source_word: ἐὰν δῶτε
  english_pob_choice: If you give
  chosen_korean: 만일 … 드리면
  alternatives_korean:
  - 만일 … 주면
  - 만일 … 바치면
  lexicon: ἐὰν + aorist subjunctive
  rationale: 조건문을 자연스러운 합쇼체로 옮기되, 희생 제의 문맥에서 ‘드리다’가 헌납·제의적 행위를 가장 잘 드러냅니다.
- source_word: περὶ ἁμαρτίας
  english_pob_choice: for sin
  chosen_korean: 죄를 위해
  alternatives_korean:
  - 죄를 위한
  - 죄를 위한 제물로
  lexicon: περὶ ἁμαρτίας
  rationale: 원문에는 ‘제물’이 명시되지 않으므로 본문은 ‘죄를 위해’로 두고, 제의적 의미는 독자가 문맥에서 읽도록 유지합니다.
- source_word: ἡ ψυχὴ ὑμῶν
  english_pob_choice: your soul
  chosen_korean: 너희 영혼은
  alternatives_korean:
  - 너희 혼은
  - 너희 생명은
  lexicon: ψυχή
  rationale: ψυχή는 여기서 인격의 내적 생명/존재를 가리키므로, 기존 교회어법을 따라 ‘영혼’을 택하되 과도한 영지주의적 뉘앙스는 피합니다.
- source_word: σπέρμα μακρόβιον
  english_pob_choice: long-lived offspring
  chosen_korean: 오래 사는 씨
  alternatives_korean:
  - 오래 사는 후손
  - 장수하는 씨
  lexicon: σπέρμα + μακρόβιος
  rationale: σπέρμα는 ‘후손’일 수도 있지만 문자적으로는 ‘씨’가 더 직접적이며, μακρόβιον의 장수·오래 삶의 의미를 ‘오래 사는’으로 살렸습니다.
theological_decisions:
- issue: περὶ ἁμαρτίας의 제의적 함의
  chosen_reading: 죄를 위한 제의적 드림을 암시하는 표현으로 유지합니다.
  alternative_readings:
  - 죄를 위한 제물로 드리면
  - 죄를 위해 바치면
  rationale: 영어 POB의 후속 수정이 ‘offering’을 명시하지 않도록 되돌린 만큼, 한국어도 원문의 간접적 제의 표현을 보존해 해석의 긴장을 유지합니다.
  doctrine_reference: LXX 제의 어법(레위기/히브리서의 죄제물 어구)
