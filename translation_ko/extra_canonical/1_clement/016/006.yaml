base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/006.yaml
  text: 'We all went astray like sheep;

    each man went astray in his own way[a].'
  footnotes:
  - marker: a
    text: Or 'All we like sheep went astray;'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 모두 양처럼 길을 잃었고, 사람마다 자기 길로 길을 잃었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες
  english_pob_choice: We all
  chosen_korean: 우리는 모두
  alternatives_korean:
  - 우리 모두는
  - 모두 우리가
  lexicon: πάντες
  rationale: 주어의 포괄성을 앞세워 ‘모두’를 분명히 살리되, 한국어 문장 흐름에 맞게 ‘우리는 모두’로 자연스럽게 옮겼습니다.
- source_word: ὡς πρόβατα
  english_pob_choice: like sheep
  chosen_korean: 양처럼
  alternatives_korean:
  - 양들처럼
  - 양과 같이
  lexicon: ὡς + πρόβατα
  rationale: 비유표현을 직역하되 한국어에서 가장 간결하고 익숙한 ‘-처럼’ 구조로 옮겨 비유성을 유지했습니다.
- source_word: ἐπλανήθημεν / ἐπλανήθη
  english_pob_choice: went astray / went astray
  chosen_korean: 길을 잃었고 / 길을 잃었습니다
  alternatives_korean:
  - 방황했고 / 방황했습니다
  - 빗나갔고 / 빗나갔습니다
  lexicon: πλανάω
  rationale: ‘길을 잃다’는 원문의 윤리적·존재론적 이탈을 한국어로 직관적으로 드러내며, 반복되는 동사를 두 문장에 일관되게 살렸습니다.
- source_word: τῇ ὁδῷ αὐτοῦ
  english_pob_choice: in his own way
  chosen_korean: 자기 길로
  alternatives_korean:
  - 자기 길을 따라
  - 자기 방식으로
  lexicon: ὁδός
  rationale: ‘길’은 원문에서 삶의 방향과 행로를 가리키므로, 단순한 방식이 아니라 각 사람의 독자적 행로를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 보편적 타락/이탈의 반복 강조
  chosen_reading: ‘우리는 모두’와 ‘사람마다’의 이중 표현으로 공동체 전체와 개인 각각의 이탈을 함께 드러냈습니다.
  alternative_readings:
  - ‘우리 모두가’ 한 번으로 압축
  - ‘각 사람은’만 강조
  rationale: 원문은 전체성(πάντες)과 개별성(ἄνθρωπος)의 병치를 통해 보편적 방황을 강조하므로, 두 층위를 모두 보존했습니다.
  doctrine_reference: 인간의 보편적 죄성에 대한 성서적 증언
- issue: ‘자기 길’의 자기중심성
  chosen_reading: ‘자기 길로’는 단순한 우회가 아니라 각 사람이 자기 기준을 따르는 이탈을 나타내도록 유지했습니다.
  alternative_readings:
  - ‘자기 방식으로’
  - ‘자기 뜻대로’
  rationale: 원문 ὁδός는 행로·삶의 길을 뜻하므로, 윤리적 자기결정의 뉘앙스를 살리면서도 본래의 ‘길’ 이미지를 보존했습니다.
  doctrine_reference: 지혜문학과 예언서의 ‘길’ 모티프
