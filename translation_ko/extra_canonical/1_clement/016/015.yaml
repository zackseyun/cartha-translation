id: 1CLEM.16.15
reference: 1 Clement 16:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν αὐτὸς φησίν· Ἐγὼ δὲ εἰμι σκώληξ καὶ οὐκ ἄνθρωπος, ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/015.yaml
  text: 'And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people[a].'
  footnotes:
  - marker: a
    text: Or 'despised by the people'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 다시 그분께서 친히 말씀하십니다.


    “그러나 나는 벌레이며 사람이 아니고, 사람들의 수치이며 백성의 멸시입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν
  english_pob_choice: And again
  chosen_korean: 그리고 다시
  alternatives_korean:
  - 또다시
  - 그리고 또
  lexicon: καὶ πάλιν
  rationale: 인용이 반복됨을 자연스럽게 드러내면서도 원문의 단순한 접속·반복 구조를 유지합니다.
- source_word: αὐτὸς φησίν
  english_pob_choice: he himself says
  chosen_korean: 그분께서 친히 말씀하십니다
  alternatives_korean:
  - 그분께서 말씀하십니다
  - 그가 친히 말합니다
  lexicon: αὐτός + φημί
  rationale: 강조 대명사의 자기 지시를 ‘친히’로 살리고, 문맥상 인용 주체를 존중하는 합쇼체로 옮겼습니다.
- source_word: σκώληξ
  english_pob_choice: worm
  chosen_korean: 벌레
  alternatives_korean:
  - 구더기
  - 벌레
  lexicon: σκώληξ
  rationale: 시적 비하 표현의 일반성을 살리기 위해 한국어에서 덜 구체적인 ‘벌레’를 택했습니다.
- source_word: ὄνειδος ἀνθρώπων καὶ ἐξουθένημα λαοῦ
  english_pob_choice: a reproach of men and despised by the people
  chosen_korean: 사람들의 수치이며 백성의 멸시입니다
  alternatives_korean:
  - 사람들의 수치이며 백성의 멸시입니다
  - 사람들의 모욕이며 백성의 멸시입니다
  - 사람들의 수치이며 백성의 경멸입니다
  lexicon: ὄνειδος; ἐξουθένημα
  rationale: 두 병렬 명사구를 한국어에서도 명사구로 맞추어, ‘despised by the people’처럼 동사화하지 않고 수치/멸시의 병렬을 유지했습니다.
theological_decisions:
- issue: 시적 자기비하 표현의 강도
  chosen_reading: ‘벌레이며 사람이 아니고’와 ‘수치/멸시’의 직설적 표현을 그대로 살렸습니다.
  alternative_readings:
  - ‘미천한 존재이며 사람답지 않고’처럼 완화
  - ‘모욕을 당하고 멸시받는 사람’처럼 서술화
  rationale: 원문은 의도적으로 강한 비하와 공적 수치를 말하므로, 완화하지 않고 수사적 충격을 보존했습니다.
  doctrine_reference: 시편 인용의 문학적-신학적 정직성
