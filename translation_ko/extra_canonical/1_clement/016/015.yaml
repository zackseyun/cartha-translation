  revision_rationale: The revision preserves the Greek's emphatic introduction and its poetic sequence of predicate expressions. It clarifies that the speaker is the object of reproach and contempt, keeps the final two phrases as balanced noun predicates, improves idiomatic formal Korean, and removes an unsupported footnote anchor.
