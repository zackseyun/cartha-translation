- from: '그리고 다시 그분께서 친히 말씀하십니다.


    “그러나 나는 벌레이며 사람이 아니고, 사람들의 수치이며 백성의 멸시입니다.”[a]'
  to: '또 그분께서 친히 말씀하십니다.


    “그러나 나는 벌레요 사람이 아니며, 사람들에게 치욕거리요 백성에게 멸시거리입니다.”'
  rationale: The revision preserves the Greek's emphatic introduction and its poetic sequence of predicate expressions. It clarifies that the speaker is the object of reproach and contempt, keeps the final two phrases as balanced noun predicates, improves idiomatic formal Korean, and removes an unsupported footnote anchor.
