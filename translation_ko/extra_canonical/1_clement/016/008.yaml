id: 1CLEM.16.8
reference: 1 Clement 16:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ . ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου ἤκει εἰς θάνατον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/008.yaml
  text: 'Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.'
translation:
  language: ko
  text: 그의 세대를 누가 말하겠습니까? 그의 생명이 땅에서 거두어졌기 때문입니다. 내 백성의 불법들 때문에 그는 죽음에 이르렀습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεά
  english_pob_choice: generation
  chosen_korean: 세대
  alternatives_korean:
  - 족속
  - 출생 세대
  - 사람들
  lexicon: γενεά
  rationale: 문맥상 ‘그의 세대’를 직접 묻는 질문이므로, 가장 자연스럽고 원문의 폭을 유지하는 ‘세대’를 택했습니다.
- source_word: αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ
  english_pob_choice: For his life is taken from the earth.
  chosen_korean: 그의 생명이 땅에서 거두어졌기 때문입니다
  alternatives_korean:
  - 그의 생명이 땅에서 취해졌기 때문입니다
  - 그의 생명이 땅에서 제거되었기 때문입니다
  lexicon: αἴρω
  rationale: 수동적 ‘거두어지다’는 생명이 땅에서 제거되는 이미지를 자연스럽게 살리면서도 원문의 수동 뉘앙스를 유지합니다.
- source_word: ἀνομίαις
  english_pob_choice: lawless deeds
  chosen_korean: 불법들
  alternatives_korean:
  - 율법 없는 행위들
  - 무법한 행위들
  - 불의들
  lexicon: ἀνομία
  rationale: 법/율법을 어기는 행위를 직접적으로 드러내기 위해 ‘불법들’로 옮겼습니다. 복수형도 반영했습니다.
- source_word: λαοῦ μου
  english_pob_choice: my people
  chosen_korean: 내 백성의
  alternatives_korean:
  - 내 백성들의
  - 내 ժողովուրդ의
  - 내 ժողովրդի
  lexicon: λαός
  rationale: 하나님/화자의 소유격이 분명하므로 ‘내 백성’으로 옮기고, 앞의 전치사구와 자연스럽게 연결했습니다.
theological_decisions:
- issue: 인용문의 화자와 메시아적 적용 가능성
  chosen_reading: 본문의 직접 의미를 따라, 고난받는 인물의 운명에 대한 탄식으로 번역하고 메시아적 해석은 본문 밖에 남겨두었습니다.
  alternative_readings:
  - 사 53장과 연결된 메시아 예언으로 번역을 더 해석적으로 처리
  - 기독론적 함의를 본문 안에 암시적으로 강화
  rationale: 이 절은 히브리 성경의 고난받는 종 전통을 떠올리게 하지만, 여기서는 그 연결을 번역문에 과도하게 주입하지 않고 그리스어 문장의 서술과 질문을 보존하는 것이 안전합니다.
  doctrine_reference: 성경 본문 해석의 역사적-문법적 우선성
