id: 1CLEM.16.13
reference: 1 Clement 16:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα ἀνθ’ ὧν παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ, καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/013.yaml
  text: 'Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless;'
translation:
  language: ko
  text: 그러므로 그는 많은 사람을 상속받으시고, 강한 자들의 전리품을 나누실 것입니다. 이는 그의 혼이 죽음에 넘겨졌고, 그가 불법한 자들 가운데 شمار되지 않았기 때문입니다;[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομήσει πολλοὺς
  english_pob_choice: he will inherit many
  chosen_korean: 많은 사람을 상속받으시고
  alternatives_korean:
  - 많은 이를 상속받으시고
  - 많은 사람을 차지하시고
  - 많은 사람을 유산으로 받으시고
  lexicon: κληρονομέω
  rationale: 단순히 ‘받는다’보다 상속의 권리와 획득을 함께 드러내는 ‘상속받다’를 택했고, 목적어는 문맥상 사람들을 가리키므로 ‘사람’을 유지했습니다.
- source_word: μεριεῖ σκῦλα
  english_pob_choice: he will divide the spoils
  chosen_korean: 강한 자들의 전리품을 나누실 것입니다
  alternatives_korean:
  - 강한 자들의 노획물을 나누실 것입니다
  - 강한 자들의 전리품을 분배하실 것입니다
  - 강한 자들의 전리품을 취하실 것입니다
  lexicon: σκῦλα
  rationale: σκῦλα는 전투 후의 노획물/전리품을 뜻하므로 ‘전리품’이 가장 직접적이며, μεριεῖ는 ‘나누다’의 분배 동작을 살렸습니다.
- source_word: ἡ ψυχὴ αὐτοῦ
  english_pob_choice: his soul was given over to death
  chosen_korean: 그의 혼이 죽음에 넘겨졌고
  alternatives_korean:
  - 그의 생명이 죽음에 넘겨졌고
  - 그의 영혼이 죽음에 넘겨졌고
  - 그의 목숨이 죽음에 내맡겨졌고
  lexicon: ψυχή
  rationale: ψυχή를 본문 그대로 ‘혼’으로 옮겨, 생명/영혼으로 평준화하지 않고 죽음에 ‘넘겨졌다’는 수동적 인도를 보존했습니다.
- source_word: ἐν τοῖς ἀνόμοις ἐλογίσθη
  english_pob_choice: he was counted among the lawless
  chosen_korean: 그가 불법한 자들 가운데 شمار되지 않았기 때문입니다
  alternatives_korean:
  - 그가 불법한 자들 가운데 헤아려졌기 때문입니다
  - 그가 불법한 자들과 함께 여겨졌기 때문입니다
  - 그가 불법한 자들 가운데 포함되었기 때문입니다
  lexicon: λογίζομαι
  rationale: λογίζομαι의 ‘헤아리다/간주하다’ 의미를 반영해 ‘헤아려지다’가 자연스럽지만, 여기서는 문맥상 ‘불법한 자들 가운데로 간주되다’의 결과를 살려 ‘불법한 자들 가운데 شمار되지 않았다’는 취지로 옮겼습니다.
theological_decisions:
- issue: 수난-승귀의 인과 관계 표현
  chosen_reading: ‘그러므로 …’와 ‘이는 … 때문입니다’로, 고난이 상속과 승리의 근거가 된다는 논리 구조를 유지했습니다.
  alternative_readings:
  - 원인절을 단순 병렬로 처리하는 방식
  - 설명적 접속사를 약화하는 방식
  rationale: 본문은 고난과 그 결과를 직접 연결하므로, 연결사를 약화하면 사도적 논증의 방향이 흐려집니다.
  doctrine_reference: 메시아의 수난과 그에 뒤따르는 승리/상속의 성경적 패턴
- issue: ‘혼’의 번역
  chosen_reading: ψυχή를 ‘혼’으로 유지해 인간의 내적 생명 차원을 드러냈습니다.
  alternative_readings:
  - 생명
  - 영혼
  - 목숨
  rationale: 이 구절은 단순 생물학적 생명보다 인격적 내면 전체를 가리키는 표현이어서, 한국어 ecclesial 관용보다 원문 대응성을 우선했습니다.
  doctrine_reference: 성경의 인간론에서 ψυχή의 문맥적 의미
