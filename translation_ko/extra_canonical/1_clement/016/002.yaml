revisions:
- from: '하나님의 위엄의 홀인 주 예수 메시아께서는 교만과 자만의 화려함 속에 오신 것이 아니라, 능히 그러하셨음에도 겸손 가운데 오셨습니다. 이는 성령께서 그분에 대하여 말씀하신 바와 같기 때문입니다. 곧 이렇게 말씀합니다.


    「주님, 우리가 전한 말을 누가 믿었습니까?

    그리고 주님의 팔이 누구에게 나타났습니까?

    우리는 그분을 앞에 선포했습니다.

    마치 어린아이 같았고,

    마른 땅의 뿌리 같았습니다.

    그에게는 모양도 영광도 없었고,

    우리가 그를 보아도

    그에게는 모양도 아름다움도 없었습니다.

    그러나 그의 모습은 멸시를 받았고,

    사람들의 모습보다 훨씬 못했습니다.

    그는 고난과 수고 가운데 있는 사람이었으며

    연약함을 견디는 법을 아는 사람이었습니다.

    그의 얼굴은 외면을 당했기 때문입니다. 그분은 멸시를 받았고 인정받지 못했습니다。」[a][b][c]'
  to: '하나님의 위엄의 홀, 곧 주 예수 메시아께서는 능히 그렇게 하실 수 있으셨지만, 허세와 교만 속에 오시지 않고 겸손히 오셨습니다. 성령께서 그분에 관하여 말씀하신 것과 같습니다. 말씀하시기를,


    「주님, 우리가 전한 말을 누가 믿었습니까?


