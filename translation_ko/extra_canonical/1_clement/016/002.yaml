review_pass:
  verdict: revise
  source_fidelity: 현 번역은 핵심 대조(권능이 있으나 겸손히 오심)와 이사야 인용의 전반적 의미를 대체로 전달합니다. 그러나 καθὼς를 인과적 ‘이는 … 때문입니다’로 옮긴 점, 목적어가 없는 ἀνηγγείλαμεν에 ‘그분을’을 보충한 점, ‘우리가 그를 보아도’의 양보 표현, ‘훨씬’의 과도한 강화, 그리고 ἀπέστραπται를 ‘외면을 당했다’로 해석한 점은 그리스어의 문법 및 의미를 수정할 필요가 있습니다.
  naturalness: ‘하나님의 위엄의 홀인 주 예수 메시아’는 한국어에서 수식 관계가 다소 불분명합니다. ‘하나님의 위엄의 홀, 곧 주 예수 메시아’로 동격을 분명히 하고, 인용문에서는 문장 종결과 병렬을 정리하면 현대 격식체로 더 자연스럽습니다.
  terminology: ‘홀’, ‘위엄’, ‘주 예수 메시아’, ‘성령’은 적절합니다. κόμπος는 단순한 ‘화려함’보다 ‘허세’ 또는 ‘과시’가 더 정확하며, πληγή는 이 문맥에서 ‘고난’으로 옮기는 것이 안전합니다.
  issues:
  - severity: medium
    issue: καθὼς를 ‘이는 … 때문입니다’로 번역함
    rationale: καθὼς는 여기서 성령의 발화와 앞선 진술을 비교하는 ‘…하신 것과 같이’이며, 이유를 나타내는 접속 표현이 아닙니다.
  - severity: high
    issue: ἀνηγγείλαμεν에 목적어 ‘그분을’을 추가함
    rationale: 그리스어에는 명시적 목적어가 없습니다. 목적어를 넣으면 논쟁적·비정상적 인용문의 문법적 모호성이 사라집니다.
  - severity: medium
    issue: ‘우리가 그를 보아도’ 및 ‘훨씬 못했습니다’
    rationale: καὶ εἴδομεν αὐτόν은 단순 서술 ‘우리가 그를 보았고’이며, 원문에는 양보 의미가 없습니다. ‘훨씬’도 비교 표현 παρὰ에 없는 강도입니다.
  - severity: medium
    issue: ἀπέστραπται τὸ πρόσωπον αὐτοῦ를 ‘그의 얼굴은 외면을 당했기 때문입니다’로 번역함
    rationale: 본문은 그의 얼굴이 ‘돌려져 있다/돌아가 있다’는 표현입니다. 누가 그를 외면했다는 명시적 행위자로 바꾸지 않아야 합니다.
  - severity: low
    issue: 기존 각주 표지가 인용문 끝에 일괄 배치되고 내용이 한국어 본문과 연결되지 않음
    rationale: 각주 표지는 해당 어구 바로 뒤에 배치하고, 원문의 실제 모호성에 맞는 한국어 각주로 정리해야 합니다.
