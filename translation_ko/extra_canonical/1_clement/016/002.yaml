reference: 1 Clement 16:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ, ὁ κύριος Ἰησοῦς Χριστός, οὐχ ἦλθεν ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας, καίπερ δυνάμενος, ἀλλὰ ταπεινοφρονῶν, καθὼς τὸ πνεῦμα τὸ ἅγιον περὶ αὐτοῦ ἐλάλησεν· φησὶν γάρ· . Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη; ἀνηγγείλαμεν ἐναντίον αὐτοῦ, ὡς παιδίον, ὡς ῥίζα ἐν γῇ διψώσῃ· οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα, καὶ εἴδομεν αὐτόν, καὶ οὐκ εἶχεν εἶδος οὐδὲ κάλλος, ἀλλὰ τὸ εἶδος αὐτοῦ ἄτιμον, ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων· ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ καὶ εἰδὼς φέρειν μαλακίαν ὅτι ἀπέστραπται τὸ πρόσωπον αὐτοῦ, ἠτιμάσθη καὶ οὐκ ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/002.yaml
  text: 'The scepter of the majesty of God[a], the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though being able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    lacking beyond the appearance of men;

    a man being in affliction and toil

    and knowing how to bear weakness,

    because his face is turned away[c][b];

    he was dishonored and not esteemed.”'
  footnotes:
  - marker: a
    text: Or 'failing beyond the appearance of men;'.
    reason: previous_rendering
  - marker: b
    text: Or 'a man being in plague and toil'.
    reason: previous_rendering
  - marker: c
    text: Or 'We announced him before him,'.
    reason: previous_rendering
translation:
  language: ko
  text: '하나님의 위엄의 홀, 곧 주 예수 메시아께서는 능히 그렇게 하실 수 있으셨지만, 허세와 교만 속에 오시지 않고 겸손히 오셨습니다. 성령께서 그분에 관하여 말씀하신 것과 같습니다. 말씀하시기를,


    「주님, 우리가 전한 말을 누가 믿었습니까?


    주님의 팔이 누구에게 나타났습니까?


    우리는 그 앞에서 전하였습니다.[a]


    어린아이처럼,


    메마른 땅의 뿌리처럼 말입니다.


    그에게는 모습도 영광도 없었고,


    우리가 그를 보았으나,


    그에게는 모습도 아름다움도 없었습니다.


    오히려 그의 모습은 멸시받았고,


    사람들의 모습보다 못하였습니다.[b]


    그는 고난과 수고 가운데 있는 사람이었으며,


    연약함을 견디는 법을 아는 사람이었습니다.


    그의 얼굴이 돌려져 있었기 때문입니다.[c]


    그는 멸시받았고 인정받지 못했습니다.」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘우리는 그 앞에서 전하였습니다.’입니다. 그리스어에는 ‘전하였다’의 명시적 목적어가 없습니다.
    reason: ἀνηγγείλαμεν에는 명시적 목적어가 없으므로, 본문에 없는 ‘그분을’을 보충하지 않고 문법적 모호성을 보존합니다.
  - marker: b
    text: 또는 ‘사람들의 모습에 비하여 부족하였습니다.’
    reason: ἐκλεῖπον παρὰ τὸ εἶδος τῶν ἀνθρώπων의 비교적·관용적인 표현은 정확한 세부 의미가 다소 불확실합니다.
  - marker: c
    text: 또는 ‘그의 얼굴이 돌아서 있었기 때문입니다.’
    reason: ἀπέστραπται는 ‘돌리다/돌아서다’ 계열의 표현입니다. 본문은 누가 그를 외면했다는 행위자를 명시하지 않습니다.
lexical_decisions:
- source_word: τὸ σκῆπτρον τῆς μεγαλωσύνης τοῦ θεοῦ
  english_pob_choice: The scepter of the majesty of God
  chosen_korean: 하나님의 위엄의 홀
  alternatives_korean:
  - 하나님의 위엄의 지팡이
  - 하나님의 장엄의 홀
  lexicon: σκῆπτρον = 홀/권위의 상징; μεγαλωσύνη = 위엄, 장엄
  rationale: 왕권의 상징인 σκῆπτρον을 ‘홀’로 살리고, μεγαλωσύνη는 신앙적 완곡어법보다 직역에 가까운 ‘위엄’으로 옮겨 원문의 장엄한 이미지를 유지했습니다.
- source_word: ὁ κύριος Ἰησοῦς Χριστός
  english_pob_choice: the Lord Jesus Messiah
  chosen_korean: 주 예수 메시아
  alternatives_korean:
  - 주 예수 그리스도
  - 주님이신 예수 메시아
  lexicon: Χριστός(호칭) = 메시아
  rationale: POB의 일관된 용례에 따라 Χριστός를 ‘메시아’로 옮겼고, 주어적 호칭은 ‘주 예수’로 간결하게 살렸습니다.
- source_word: ἐν κόμπῳ ἀλαζονείας οὐδὲ ὑπερηφανίας
  english_pob_choice: in the pomp of arrogance or pride
  chosen_korean: 교만과 자만의 화려함 속에
  alternatives_korean:
  - 오만과 교만의 과시 속에
  - 허세와 자만의 호기 속에
  lexicon: κόμπος = 허세, 과시; ἀλαζονεία/ὑπερηφανία = 교만, 자만, 오만
  rationale: 두 개의 부정적 태도를 병렬로 살리되, ‘화려함 속에’로 겉치레의 뉘앙스를 전달해 원문의 ‘pomp’와 ‘boastful display’를 반영했습니다.
- source_word: ἄνθρωπος ἐν πληγῇ ὢν καὶ πόνῳ
  english_pob_choice: a man being in suffering and toil
  chosen_korean: 고난과 수고 가운데 있는 사람이었으며
  alternatives_korean:
  - 상처와 수고 가운데 있는 사람이었으며
  - 고통과 수고 가운데 있는 사람이었으며
  lexicon: πληγή = 상처, 매, 타격, 고난; πόνῳ = 수고, 고통
  rationale: 이 구절은 이사야의 고난받는 종 전승을 반영하므로, 현대 독자에게 질병 의미를 강하게 떠올리게 하는 ‘역병’류 표현은 피하고 ‘고난’으로 넓고 정확하게 옮겼습니다.
theological_decisions:
- issue: 성령의 발화 방식
  chosen_reading: “성령께서 그분에 대하여 말씀하신 바와 같기 때문입니다”로 옮겨, 본문이 시편/이사야 인용을 성령의 말씀으로 해석하는 점을 분명히 했습니다.
  alternative_readings:
  - ‘거룩한 영이’로 중성적으로 옮김
  - ‘성령께서 그에 관하여 예언하셨습니다’로 의역
  rationale: 그리스도론적 해석이 아니라, 인용된 예언을 성령의 직접 발화로 제시하는 본문 구조를 보존하기 위해서입니다.
  doctrine_reference: 성경의 예언적 발화와 성령의 감동에 관한 일반적 정경적 이해
- issue: 인용문 안의 주어 지시
  chosen_reading: ‘우리는 그분을 앞에 선포했습니다’로 두어, 그리스어 ἀνηγγείλαμεν의 무목적 직접형을 그대로 반영했습니다.
  alternative_readings:
  - ‘우리는 그분 앞에서 선포했습니다’
  - ‘우리는 그를 앞에 선포했습니다’
  rationale: 영어 POB의 수정처럼, 원문에 없는 목적어를 추가해 특정한 타동사 구문으로 굳히지 않으려 했습니다.
  doctrine_reference: 본문의 문법적 긴장을 보존하는 번역 원칙
