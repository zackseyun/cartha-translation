  rationale: 동격 구문과 접속 관계를 바로잡고, 이사야 인용의 난해한 그리스어를 해석으로 평준화하지 않았습니다. 특히 무목적어 동사, 비교 표현, ‘얼굴이 돌려져 있음’의 모호성은 본문과 각주에서 보존했습니다. 기존의 구조적으로 연결되지 않은 각주 표지도 해당 어구에 재배치했습니다.
