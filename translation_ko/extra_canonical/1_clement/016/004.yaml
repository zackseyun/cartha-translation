  - severity: medium
    issue: περὶ ἡμῶν을 ‘우리를 대신해’로 확정함
    rationale: 이 표현은 ‘우리를 위하여/우리와 관련하여’를 뜻할 수 있으며, ‘대신해’는 본문이 명시하지 않는 특정 대속적 관계를 강화합니다.
