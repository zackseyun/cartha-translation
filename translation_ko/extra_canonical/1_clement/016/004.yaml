  text: 이분은 우리의 죄를 짊어지시며 우리를 위하여 고통을 겪으십니다. 그러나 우리는 그가 고통과 상처와 학대 가운데 있는 줄로 여겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역: “이분은 우리의 죄를 짊어지시며 우리를 위하여 고통을 겪으십니다. 그러나 우리는 그가 수고와 재앙과 학대 가운데 있는 줄로 여겼습니다.”'
    reason: 영어 POB 감사 이력에 보존된 이전 번역의 대안을 반영합니다. 다만 본문은 πόνος를 ‘고통’, πληγή를 ‘상처’로 번역하여 그리스어에 더 가깝게 옮깁니다.
lexical_decisions:
- source_word: ἁμαρτίας ἡμῶν φέρει
  english_pob_choice: bears our sins
  chosen_korean: 우리의 죄를 짊어지며
  alternatives_korean:
  - 우리의 죄를 지며
  - 우리의 죄를 담당하며
  lexicon: φέρω
  rationale: 여기서 φέρει는 단순한 ‘가지다’보다 죄의 부담을 ‘짊어지다’로 드러내는 것이 사역적·대속적 뉘앙스를 잘 살립니다.
- source_word: περὶ ἡμῶν ὀδυνᾶται
  english_pob_choice: suffers on our behalf
  chosen_korean: 우리를 대신해 고통받으셨고
  alternatives_korean:
  - 우리를 위해 고통받으시며
  - 우리에게서 고통을 겪으시며
  lexicon: ὀδυνάομαι
  rationale: ὀδυνᾶται는 단순한 감정적 ‘아픔’보다 실제적인 고통을 가리키므로, ‘고통받다’로 옮기되 περὶ ἡμῶν은 ‘우리를 대신해’로 대속적 방향을 분명히 했습니다.
- source_word: ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει
  english_pob_choice: in pain and under a blow and in affliction
  chosen_korean: 고통 가운데 있고 매 맞으며 괴로워하는
  alternatives_korean:
  - 고통 가운데 있고 한 번 맞은 상태이며 괴로워하는
  - 아픔 가운데 있고 채찍질을 당하며 곤고한
  lexicon: πόνος / πληγή / κάκωσις
  rationale: πόνος는 ‘고통’, πληγή는 ‘매 맞음/타격’, κάκωσις는 ‘괴로움’으로 옮겨, 세 개의 병렬 표현이 주는 강도를 한국어에서도 구분해 살렸습니다.
theological_decisions:
- issue: 이사야 53장 인용문의 대속성 표현
  chosen_reading: ‘우리를 대신해’와 ‘죄를 짊어지며’를 함께 써서, 고난이 단순한 동정적 고통이 아니라 대표적·대속적 고난임을 드러냈습니다.
  alternative_readings:
  - ‘우리를 위해’로 더 완만하게 옮길 수 있음
  - ‘죄를 담당하며’로 제도적·제의적 뉘앙스를 더 강하게 낼 수 있음
  rationale: 문맥이 이사야 53장의 고난받는 종 전승이므로, 해석을 희석하지 않고 1 Clement의 수용 의도를 한국어로도 보존하는 편이 본문에 충실합니다.
  doctrine_reference: 대속/대리 고난
