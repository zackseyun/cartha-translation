id: 1CLEM.16.16
reference: 1 Clement 16:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πάντες οἱ θεωροῦντές με ἐξεμυκτήρισάν με, ἐλάλησαν ἐν χείλεσιν, ἐκίνησαν κεφαλήν· Ἤλπισεν ἐπὶ κύριον, ῥυσάσθω αὐτόν, σωσάτω αὐτόν, ὅτι θέλει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/016.yaml
  text: 'All who saw me mocked me;

    they spoke with their lips,

    they shook their heads:

    ‘He hoped in the Lord; let him rescue him;

    let him save him[a], because he delights in him.’'
  footnotes:
  - marker: a
    text: Or 'All who see me mocked me;\nthey spoke with their lips,\nthey shook their head:'.
    reason: previous_rendering
translation:
  language: ko
  text: '나를 보는 모든 사람들이 나를 비웃었습니다.

    그들은 입술로 말하고,

    머리를 흔들었습니다.


    “주님께 소망을 두었다니, 그를 구원하게 하십시오.

    그를 살리게 하십시오. 그가 그를 기뻐하시기 때문입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες οἱ θεωροῦντές με
  english_pob_choice: All who saw me
  chosen_korean: 나를 보는 모든 사람들이
  alternatives_korean:
  - 나를 본 모든 사람들이
  - 나를 바라보는 모든 이들이
  lexicon: θεωρέω
  rationale: 현재분사 θεωροῦντές를 한국어에서는 자연스러운 진행형/관형형으로 살려 ‘보는’으로 옮기되, 영어 POB의 과거 시제 조정은 문맥상 성립하므로 지나친 시제 고정은 피했습니다.
- source_word: ἐξεμυκτήρισάν με
  english_pob_choice: mocked me
  chosen_korean: 나를 비웃었습니다
  alternatives_korean:
  - 나를 조롱했습니다
  - 나를 비웃고 업신여겼습니다
  lexicon: ἐκμυκτηρίζω
  rationale: 동사는 단순 조롱보다 코웃음치며 업신여기는 뉘앙스가 있어, 표준적이고 직설적인 ‘비웃었습니다’로 옮겼습니다.
- source_word: ἐλάλησαν ἐν χείλεσιν
  english_pob_choice: they spoke with their lips
  chosen_korean: 그들은 입술로 말하고
  alternatives_korean:
  - 그들은 입술로만 말하고
  - 그들은 헛되이 말하고
  lexicon: λαλέω + ἐν χείλεσιν
  rationale: 직역을 유지하되 한국어에서 어색하지 않게 ‘입술로 말하고’로 처리했습니다. 이는 말의 공허함/겉치레를 드러내는 히브리 시적 표현을 보존합니다.
- source_word: ἐκίνησαν κεφαλήν
  english_pob_choice: they shook their heads
  chosen_korean: 머리를 흔들었습니다
  alternatives_korean:
  - 고개를 저었습니다
  - 머리를 저었습니다
  lexicon: κινέω κεφαλήν
  rationale: 그리스어의 관용적 수치를 한국어 관용표현으로 자연스럽게 옮겼습니다. ‘고개를 저었습니다’도 가능하지만, 원문의 ‘κεφαλήν’을 살려 ‘머리’를 택했습니다.
- source_word: κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 인용문 안의 κύριος는 예수/메시아가 아닌 하나님 지시로 쓰였지만, 1 Clement의 기독교적 경외어법에서는 ‘주님’이 가장 자연스럽고, 본문 내부에서의 직접적인 야훼 표기는 이 단락만으로 확정하기 어렵습니다.
- source_word: ὅτι θέλει αὐτόν
  english_pob_choice: because he delights in him
  chosen_korean: 그가 그를 기뻐하시기 때문입니다
  alternatives_korean:
  - 그를 원하시기 때문입니다
  - 그를 좋아하시기 때문입니다
  lexicon: θέλω
  rationale: θέλει는 단순한 ‘원하다’보다 호의·기쁨의 뉘앙스를 띠므로, 시편 인용의 문맥에 맞게 ‘기뻐하시기’로 옮겼습니다.
theological_decisions:
- issue: 인용문 속 κύριος의 처리
  chosen_reading: 본문에는 ‘주님’으로 두고, 야훼로 확정 표기는 하지 않았습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절은 시편 인용을 담지만, 1 Clement의 그리스어 본문만으로 이 자리의 κύριος를 번역 본문에서 야훼로 고정할 충분한 단서가 제한적입니다. 따라서 신약적 경외어법을 반영하는 ‘주님’을 택했습니다.
  doctrine_reference: 시편 인용의 신정칭호 처리 원칙
