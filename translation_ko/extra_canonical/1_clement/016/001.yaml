revisions:
- from: 그러므로 메시아는 겸손한 마음을 가진 이들에게 속하십니다. 그러나 자기 자신을 높여 그의 양 떼 위에 군림하는 이들에게는 속하지 않으십니다.[a]
  to: 그러므로 메시아께서는 겸손한 마음을 지닌 이들의 편이시며, 그의 양 떼 위에서 자신을 높이는 이들의 편은 아니십니다.
  rationale: 확정된 ‘양 떼’ 판독을 따르되, ‘군림하다’라는 해석적 강화는 ‘자신을 높이다’로 조정했습니다. 또한 소속의 대조를 자연스러운 합쇼체 문장으로 옮겼습니다. OCR 오류에 근거한 영어 감사 이력의 대안은 본문 각주로 유지하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:53Z'
review_pass:
  verdict: revise
  source_fidelity: 개정 이력에서 확정한 본문(οὐκ ἐπαιρομένων ἐπὶ τὸ ποίμνιον αὐτοῦ)에 따르면, 그리스도께서 겸손한 이들에게 속하시며 그의 양 떼 위에서 자신을 높이는 이들에게는 속하지 않으신다는 대조가 핵심입니다. 초안은 이 의미를 대체로 반영하지만, ‘군림하는’은 ἐπαιρομένων(자신을 높이는)보다 권위 행사의 뜻을 다소 강하게 더합니다.
  naturalness: ‘메시아는 … 이들에게 속하십니다’는 한국어에서 다소 직역투이며, 사람들에 대한 그리스도의 관계를 표현할 때도 어색하게 들릴 수 있습니다. ‘… 이들의 편이십니다’가 자연스럽고 원문의 소속·대조 구문을 유지합니다.
  terminology: ‘메시아’, ‘겸손한 마음을 지닌 이들’, ‘양 떼’는 적절합니다. ‘양 떼 위에서 자신을 높이는’은 ποίμνιον과 ἐπαίρω의 비유적·비판적 표현을 과장하지 않고 보존합니다.
  issues:
  - severity: medium
    issue: ‘군림하는’이 원문의 동사보다 의미를 강화합니다.
    rationale: ἐπαίρω는 여기서 자신을 높이거나 우쭐대는 행위를 가리키며, 실제 지배·통치 행위까지 명시하지는 않습니다.
  - severity: low
    issue: ‘이들에게 속하십니다’가 한국어에서 부자연스럽습니다.
    rationale: 원문의 ‘~의 것이다’라는 소속 표현은 ‘~의 편이다’로 옮기면 현대 표준어에서 자연스럽고 의미도 유지됩니다.
  - severity: medium
    issue: 현 영어 각주의 ‘두려움’ 대안은 OCR 오독에서 비롯된 것이므로 한국어 본문 각주로 보존해서는 안 됩니다.
    rationale: 제공된 개정 이력은 φόβον이 실제 본문의 이문이 아니라 ποίμνιον을 잘못 읽은 OCR 오류임을 명시합니다. 이를 유효한 번역 대안처럼 제시하면 본문비평상 오해를 낳습니다.
  revised_text: 그러므로 메시아께서는 겸손한 마음을 지닌 이들의 편이시며, 그의 양 떼 위에서 자신을 높이는 이들의 편은 아니십니다.
  revised_footnotes: []
  revision_rationale: 확정된 ‘양 떼’ 판독을 따르되, ‘군림하다’라는 해석적 강화는 ‘자신을 높이다’로 조정했습니다. 또한 소속의 대조를 자연스러운 합쇼체 문장으로 옮겼습니다. OCR 오류에 근거한 영어 감사 이력의 대안은 본문 각주로 유지하지 않았습니다.
