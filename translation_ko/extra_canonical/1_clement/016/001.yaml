id: 1CLEM.16.1
reference: 1 Clement 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταπεινοφρονῶντω γὰρ ἐστὶν ὁ Χριστός, οὐχ ἐπιρριπμένων ἐπὶ τὸν φόβον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/001.yaml
  text: For the Messiah belongs to the humble-minded, not to those who exalt themselves over his flock.
  footnotes:
  - marker: a
    text: Or 'not to those who throw themselves upon his fear.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 메시아는 겸손한 마음을 가진 이들에게 속하십니다. 그러나 자기 자신을 높여 그의 양 떼 위에 군림하는 이들에게는 속하지 않으십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονῶντω
  english_pob_choice: the humble-minded
  chosen_korean: 겸손한 마음을 가진 이들
  alternatives_korean:
  - 겸손한 자들
  - 겸손한 마음의 사람들
  lexicon: ταπεινόφρων
  rationale: 형용사적 성격을 살려 단순한 품성보다 ‘마음의 태도’를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: ὁ Χριστός
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: Χριστός
  rationale: 프로젝트 기본값에 따라 직함적 Χριστός는 ‘메시아’로 옮겨, 문맥의 왕적·구원사적 의미를 직접 드러냈습니다.
- source_word: ἐπαιρομένων ἐπὶ τὸ ποίμνιον αὐτοῦ (source-adjudicated reading)
  english_pob_choice: those who exalt themselves over his flock
  chosen_korean: 자기 자신을 높여 그의 양 떼 위에 군림하는 이들
  alternatives_korean:
  - 그의 양 떼 위에 스스로 높아지는 이들
  - 그의 양 떼를 업신여기며 높아지는 이들
  lexicon: ἐπαίρω + ποίμνιον
  rationale: 공인된 판독에 따라 ‘자기 자신을 높이다’와 ‘양 떼’를 모두 살렸고, ‘군림하다’로 권위 남용의 뉘앙스를 자연스럽게 표현했습니다.
theological_decisions:
- issue: OCR에 반영된 ‘φόβος/φοβον’ 계열의 오독을 따를지, 주석된 실제 본문 ‘ποίμνιον’ 판독을 따를지
  chosen_reading: 실제 본문 의미에 따라 ‘그의 양 떼 위에 군림하는 이들’로 번역했습니다.
  alternative_readings:
  - ‘그의 두려움 위에 몸을 던지는 이들’
  - ‘그의 경외 위에 몰려드는 이들’
  rationale: 제공된 개정 이력에서 OCR 오독이 명시적으로 교정되었으므로, 본문 의미와 1 클레멘트의 교회적 논지를 따라 ‘양 떼’ 판독을 채택했습니다.
  doctrine_reference: 본문비평 및 교회 질서에 대한 문맥적 독해
