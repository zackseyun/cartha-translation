source:
  edition: Funk 1901 (normalized OCR)
  text: αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἁμαρτίας ἡμῶν καὶ μεμαλάκισται διὰ τὰς ἀνομίας ἡμῶν. παιδεία εἰρήνης ἡμῶν ἐπ’ αὐτόν· τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/005.yaml
  text: 'But he was wounded because of our sins

    and was afflicted because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.'
translation:
  language: ko
  text: 그러나 그는 우리의 죄들 때문에 상처를 입었고, 우리의 불법 행위들 때문에 고난을 당했습니다. 우리의 평강을 위한 징계가 그에게 내렸고, 그가 입은 멍으로 우리는 나음을 얻었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτραυματίσθη
  english_pob_choice: was wounded
  chosen_korean: 상처를 입었고
  alternatives_korean:
  - 부상을 입었고
  - 상처받았고
  lexicon: τραυματίζω
  rationale: 육체적 상처를 분명히 드러내면서도 문맥의 병행구조를 살려 자연스럽게 옮겼습니다.
- source_word: μεμαλάκισται
  english_pob_choice: was afflicted
  chosen_korean: 고난을 당했습니다
  alternatives_korean:
  - 연약해졌습니다
  - 괴로움을 겪었습니다
  lexicon: μαλακίζω
  rationale: 영어 POB의 수정판처럼 단순한 ‘약해지다’보다 수난·고통의 결과를 드러내는 표현이 문맥에 더 적합합니다.
- source_word: ἀνομίας
  english_pob_choice: lawless deeds
  chosen_korean: 불법들
  alternatives_korean:
  - 무법 행위들
  - 율법을 어긴 일들
  lexicon: ἀνομία
  rationale: 도덕적·언약적 질서를 거스르는 행위를 압축적으로 나타내는 기본 대응어로 ‘불법들’을 택했습니다.
- source_word: παιδεία εἰρήνης ἡμῶν
  english_pob_choice: The chastisement of our peace
  chosen_korean: 우리의 평강을 위한 징계
  alternatives_korean:
  - 우리의 평강을 위한 징벌
  - 우리의 평화를 위한 책망
  lexicon: παιδεία
  rationale: παιδεία의 교정·훈육·징계 의미를 살리되, 결과로서의 평강과의 관계를 한국어 어순에서 명확히 했습니다.
- source_word: τῷ μώλωπι αὐτοῦ
  english_pob_choice: by his bruise
  chosen_korean: 그의 멍으로
  alternatives_korean:
  - 그의 상처로
  - 그가 맞은 상처로
  lexicon: μώλωψ
  rationale: 원문의 신체적 ‘멍/타박상’ 이미지를 직접적으로 살려, 치료의 수단이 된 상처를 선명하게 표현했습니다.
theological_decisions:
- issue: 구원-치유 메타포의 유지
  chosen_reading: ‘그의 멍으로 우리가 나음을 얻었습니다’로 번역해 신체적 치유 이미지와 대속적 함의를 함께 보존했습니다.
  alternative_readings:
  - ‘그의 상처로 우리가 치유되었습니다’
  - ‘그의 매맞음으로 우리가 회복되었습니다’
  rationale: 본문은 단순한 위로가 아니라 고난받는 한 분의 상처를 통한 회복을 말하므로, 치유 언어를 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 사 53:5 전통적 수난-치유 도상
