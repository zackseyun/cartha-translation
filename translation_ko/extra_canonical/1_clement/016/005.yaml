  to: 그러나 그는 우리의 죄들 때문에 상처를 입었고, 우리의 불법 행위들 때문에 고난을 당했습니다. 우리의 평강을 위한 징계가 그에게 내렸고, 그가 입은 멍으로 우리는 나음을 얻었습니다.
