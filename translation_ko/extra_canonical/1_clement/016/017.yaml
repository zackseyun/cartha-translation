review_pass:
  verdict: revise
  source_fidelity: 원문의 명령형 Ὁρᾶτε, ‘본’(ὑπογραμμός), 주님의 자기 낮춤, 그리고 ‘그분의 은혜의 멍에’라는 비유는 대체로 잘 반영되었습니다. 그러나 αὐτοῦ(‘그분의’)가 한국어 본문에서 빠졌고, ‘그를 통해’는 선행하는 ‘주’와의 지시 관계가 다소 불분명합니다.
  naturalness: ‘보십시오, … 무엇인지.’는 한국어에서 문장 종결이 유보된 듯하여 다소 부자연스럽고, ‘들어온 우리인 우리는’은 불필요한 중복입니다. 명령의 대상과 내용을 자연스럽게 연결하고 관계절을 간결하게 정리할 필요가 있습니다.
  terminology: ‘본’, ‘주’, ‘은혜의 멍에’는 문맥과 한국어 기독교 문헌의 관용에 잘 맞습니다. 다만 소유격을 보존하여 ‘그분의 은혜의 멍에’로 해야 합니다. ἄνδρες의 호격은 이 문맥에서 성별을 전면화하지 않는 ‘사랑하는 이들이여’로 자연스럽게 옮길 수 있습니다.
