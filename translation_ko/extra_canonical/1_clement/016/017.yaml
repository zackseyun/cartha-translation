id: 1CLEM.16.17
reference: 1 Clement 16:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἄνδρες ἀγαπητοί, τίς ὁ ὑπογραμμὸς· δεδομένoς ἡμῖν· εἰ γὰρ ὁ κύριος οὕτως ἐταπεινοφρόνησεν, τί ποιήσωμεν ἡμεῖς οἱ ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ δι’ αὐτοῦ ἐλθόντες;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/017.yaml
  text: See[a], beloved men, what is the pattern given to us. For if the Lord so humbled himself, what should we do, we who through him have come under the yoke of his grace?
  footnotes:
  - marker: a
    text: Or 'You see, beloved men, what the pattern given to us is.'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 이들이여, 우리에게 주어진 본이 무엇인지 보십시오. 주께서 이처럼 자신을 낮추셨다면, 그분을 통하여 그분의 은혜의 멍에 아래로 들어온 우리는 무엇을 해야 하겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 살펴보십시오
  lexicon: ἐκκλησιαστική 권고형 동사
  rationale: 문맥상 단순 진술이 아니라 청중의 주의를 환기하는 명령형이므로, 합쇼체 권고로 자연스럽게 옮겼습니다.
- source_word: ἄνδρες ἀγαπητοί
  english_pob_choice: beloved men
  chosen_korean: 사랑하는 사람들이여
  alternatives_korean:
  - 사랑하는 남성들이여
  - 사랑하는 형제들이여
  lexicon: 호격 표현
  rationale: ἀνδρες를 문자적으로는 ‘남자들’로 볼 수 있으나, 한국어에서 직접 호격으로 부를 때 성별을 강조하는 표현은 어색할 수 있어, 호소력을 살리되 의미를 과도하게 좁히지 않는 표현을 택했습니다.
- source_word: ὑπογραμμὸς
  english_pob_choice: pattern
  chosen_korean: 본
  alternatives_korean:
  - 모범
  - 표본
  - 본보기
  lexicon: 행동 규범/본보기
  rationale: 단순한 예시보다 뒤따라야 할 규범적 ‘본’이라는 뉘앙스가 있어, 문맥상 가장 압축적인 ‘본’을 사용했습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께서는
  lexicon: κύριος
  rationale: 여기서는 예수의 자기 낮춤을 가리키므로 ‘주’의 주권성과 직접성을 살려 ‘주께서’로 옮겼습니다.
- source_word: ὑπὸ τὸν ζυγὸν τῆς χάριτος αὐτοῦ
  english_pob_choice: under the yoke of his grace
  chosen_korean: 은혜의 멍에 아래로
  alternatives_korean:
  - 은혜의 멍에 아래에
  - 그분의 은혜의 멍에 아래로
  lexicon: ζυγός / χάρις
  rationale: ‘멍에’의 이미지와 ‘아래로 들어옴’이라는 이동 방향을 함께 살려, 단순 상태표현보다 원문의 도상성을 드러냈습니다.
theological_decisions:
- issue: 주님의 자기 낮춤과 본받음의 연결
  chosen_reading: 주께서 자신을 낮추신 사실이 곧 공동체의 행위 기준이 됩니다.
  alternative_readings:
  - 단순한 겸손의 모범 제시
  - 도덕적 겸비 권면만 강조
  rationale: 문장은 예수의 낮아지심을 예시가 아니라 공동체 윤리의 근거로 제시하므로, ‘본’과 수사의 연결을 보존했습니다.
  doctrine_reference: 그리스도의 모범적 겸비와 신자 윤리의 연속성
- issue: ‘은혜의 멍에’의 표현
  chosen_reading: ‘은혜’가 멍에의 수식어로 유지되도록 직역했습니다.
  alternative_readings:
  - ‘은혜 아래’로 완화
  - ‘은혜의 법’ 등으로 의역
  rationale: 원문은 χάρις를 ‘멍에’와 결합시켜 역설적이고 긴장된 이미지를 만들므로, 이를 평탄화하지 않고 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 은혜와 순종의 긴장 관계
