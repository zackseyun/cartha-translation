revisions:
- from: 주님께서는 그의 영혼의 고통을 덜어 주시고, 그에게 빛을 보이시며 이해로 그를 빚으시고, 많은 사람을 잘 섬기는 의로운 사람을 의롭다 하시며, 그분 자신이 그들의 죄를 짊어지실 것입니다.[a]
  to: 주님께서는 그의 영혼의 고통을 없애고, 그에게 빛을 보이며, 깨달음으로 그를 빚고, 많은 사람을 충실히 섬기는 의로운 이를 의롭다 하기를 바라십니다.[a] 그리고 그가 친히 그들의 죄를 짊어질 것입니다.
  rationale: 주님의 바람을 나타내는 βούλεται를 ‘바라십니다’로 명시하고, 그에 딸린 부정사들의 병렬 구조를 유지했습니다. 마지막 문장은 αὐτός의 강조를 ‘그가 친히’로 옮기되, 직전의 ‘의로운 이’를 선행사로 유지했습니다. 이는 본문의 문법을 따르며 특정 속죄 교리를 본문보다 앞서 확정하지 않습니다.
