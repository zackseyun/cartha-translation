id: 1CLEM.16.12
reference: 1 Clement 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κύριος βούλεται ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς· καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/012.yaml
  text: 'And the Lord wills to remove the anguish of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins[a].'
  footnotes:
  - marker: a
    text: Or 'who serves well many'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서는 그의 영혼의 고통을 없애고, 그에게 빛을 보이며, 깨달음으로 그를 빚고, 많은 사람을 충실히 섬기는 의로운 이를 의롭다 하기를 바라십니다.[a] 그리고 그가 친히 그들의 죄를 짊어질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “많은 사람을 잘 섬기는 의로운 이.”
    reason: εὖ δουλεύοντα πολλοῖς의 어순 및 수식 범위에 관한 기존 영어 감사 기록의 대안을 한국어로 보존합니다.
lexical_decisions:
- source_word: κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: κύριος
  rationale: 이 문맥에서 κύριος는 인격적으로 행위하시는 주체를 가리키므로, 한국어에서는 직접적이고 존칭에 맞는 주님으로 옮겼습니다.
- source_word: ἀφελεῖν ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ
  english_pob_choice: to remove the anguish of his soul
  chosen_korean: 그의 영혼의 고통을 덜어 주시고
  alternatives_korean:
  - 그의 영혼의 고통을 제거하시고
  - 그의 영혼의 수고를 덜어 주시고
  lexicon: ἀφαιρέω + πόνος + ψυχή
  rationale: ἀφελεῖν ἀπό는 단순한 제거보다 ‘~에서 덜어내다/벗기다’의 뉘앙스가 있어, πόνου를 영혼의 고통으로 자연스럽게 풀어 옮겼습니다.
- source_word: πλάσαι τῇ συνέσει
  english_pob_choice: to form him with understanding
  chosen_korean: 이해로 그를 빚으시고
  alternatives_korean:
  - 분별로 그를 빚으시고
  - 이해력을 주어 그를 빚으시고
  lexicon: πλάσσω + σύνεσις
  rationale: πλάσαι는 ‘빚다/형성하다’의 이미지가 강하므로 이를 살렸고, συνέσις는 단순 지식보다 이해·분별의 의미가 있어 ‘이해’로 옮겼습니다.
- source_word: δικαιῶσαι δίκαιον
  english_pob_choice: to justify the righteous one
  chosen_korean: 의로운 사람을 의롭다 하시며
  alternatives_korean:
  - 의로운 이를 의롭다 하시며
  - 의인을 의롭다 하시며
  lexicon: δικαιόω + δίκαιος
  rationale: δικαιῶσαι와 δίκαιον의 같은 어근을 한국어에서도 ‘의롭다 하시다/의로운 사람’으로 대응시켜, 선언적 법정 의미를 살렸습니다.
- source_word: εὖ δουλεύοντα πολλοῖς
  english_pob_choice: who serves many well
  chosen_korean: 많은 사람을 잘 섬기는
  alternatives_korean:
  - 많은 사람들에게 잘 봉사하는
  - 여러 사람을 훌륭히 섬기는
  lexicon: δουλεύω + εὖ + πολλοί
  rationale: δουλεύοντα는 단순 봉사가 아니라 ‘섬기다’의 종속적 뉘앙스가 있어 ‘잘 섬기는’으로 옮겼고, πολλοῖς는 ‘많은 사람을’로 자연스럽게 처리했습니다.
- source_word: ἀνοίσει
  english_pob_choice: will bear
  chosen_korean: 짊어지실 것입니다
  alternatives_korean:
  - 담당하실 것입니다
  - 질 것입니다
  lexicon: ἀναφέρω
  rationale: ἀνοίσει는 죄를 ‘들어 올려 지다/짊어지다’의 속죄적 이미지를 갖기에, 죄책을 떠맡는 뜻이 드러나는 ‘짊어지다’를 선택했습니다.
theological_decisions:
- issue: 마지막 절의 ‘그들의 죄를 짊어지실 것입니다’의 주어 지시
  chosen_reading: 주님께서 친히 그들의 죄를 짊어지시는 것으로 번역했습니다.
  alternative_readings:
  - ‘그가’ 그들의 죄를 짊어질 것입니다
  - ‘그 자신이’ 그들의 죄를 짊어지실 것입니다
  rationale: 그리스어 αὐτός의 강조를 살리되, 한국어에서는 주어 중복을 줄여 의미를 선명하게 했습니다. 이는 대속적 부담의 주체가 주님임을 강조합니다.
  doctrine_reference: 속죄/대속의 주체성
