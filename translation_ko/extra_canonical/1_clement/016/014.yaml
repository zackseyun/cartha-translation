  source_fidelity: 그리스어의 모든 요소를 충실히 반영합니다. ἁμαρτίας πολλῶν ἀνήνεγκε는 ‘많은 사람의 죄를 지고’로, 죄를 짊어졌다는 뜻을 자연스럽게 전달합니다. διὰ + 대격의 원인 용법도 ‘그들의 죄 때문에’에 보존되어 있으며, παρεδόθη의 수동태는 ‘넘겨지셨습니다’로 적절히 표현되었습니다.
  naturalness: 문장은 간결하고 현대 표준 한국어의 합쇼체에 맞습니다. ‘넘겨지셨습니다’는 수동적 ‘넘겨짐/내어줌’을 보존하면서도 문맥상 자연스럽습니다.
  terminology: ‘죄’, ‘지다’, ‘넘겨지다’는 고난과 관련된 본문의 어휘를 과도하게 해설하거나 특정 교리로 한정하지 않고 적절히 옮깁니다. ‘많은 사람’은 πολλῶν의 무표지 복수 표현을 자연스럽게 재현합니다.
