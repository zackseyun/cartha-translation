translation:
  language: ko
  text: 그는 많은 사람의 죄를 지고, 그들의 죄 때문에 넘겨지셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁμαρτίας πολλῶν ἀνήνεγκε
  english_pob_choice: he bore the sins of many
  chosen_korean: 많은 사람의 죄를 지고
  alternatives_korean:
  - 많은 사람의 죄를 담당하고
  - 많은 이들의 죄를 짊어지고
  lexicon: ἀναφέρω
  rationale: ἀνήνεγκε는 단순한 ‘들어 올리다’보다 죄를 ‘짊어지다/지다’는 대속적 뉘앙스를 살리는 것이 자연스럽습니다.
- source_word: παρεδόθη
  english_pob_choice: was given over
  chosen_korean: 넘겨지셨습니다
  alternatives_korean:
  - 내주어지셨습니다
  - 넘겨졌습니다
  lexicon: παραδίδωμι
  rationale: 영문 POB의 ‘given over’를 따라, 배신·처분·인도됨의 수동 의미를 담되 한국어로는 더 자연스러운 ‘넘겨지셨습니다’로 옮겼습니다.
- source_word: διὰ τὰς ἁμαρτίας αὐτῶν
  english_pob_choice: because of their sins
  chosen_korean: 그들의 죄 때문에
  alternatives_korean:
  - 그들의 죄로 인해
  - 그들의 죄로 말미암아
  lexicon: διά + accusative
  rationale: 원인의 διά를 그대로 살려 ‘때문에’로 옮기되, 원문처럼 행동의 이유를 분명히 드러냈습니다.
theological_decisions:
- issue: 대속적 수난의 표현
  chosen_reading: ‘많은 사람의 죄를 지고’와 ‘죄 때문에 넘겨지셨습니다’로, 죄를 대신 짊어지는 의미와 넘겨짐의 수동성을 함께 드러냈습니다.
  alternative_readings:
  - ‘죄를 담당하고’로 더 해설적으로 옮김
  - ‘인도되셨습니다’로 더 중립적으로 옮김
  rationale: 본문은 단순한 고난 서술을 넘어 죄와 관련된 대속적 전달을 말하므로, 그 긴장을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 이사야 53장 고난받는 종 전통, 신약의 수난/속죄 언어
