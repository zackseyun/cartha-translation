id: 1CLEM.16.10
reference: 1 Clement 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016/010.yaml
  text: 'And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he committed no lawlessness,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the affliction.'
translation:
  language: ko
  text: 그리고 나는 그의 장례를 대신하여 악인들을 주고, 그의 죽음을 대신하여 부자들을 주겠습니다. 그는 아무 불법도 행하지 않았고, 그의 입에서는 어떤 속임수도 발견되지 않았습니다. 그리고 주님은 그를 그 고난에서 깨끗하게 하기를 원하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς πονηροὺς / τοὺς πλουσίους
  english_pob_choice: the wicked / the rich
  chosen_korean: 악인들 / 부자들
  alternatives_korean:
  - 악한 자들 / 유력자들
  - 죄인들 / 부유한 자들
  lexicon: πονηρός, πλούσιος
  rationale: POB의 직접 대응을 따라 각각 ‘악인들’과 ‘부자들’로 옮겨, 도덕적 평가와 사회경제적 신분의 대비를 분명히 했습니다.
- source_word: ἀντὶ τῆς ταφῆς αὐτοῦ / ἀντὶ τοῦ θανάτου αὐτοῦ
  english_pob_choice: in place of his burial / in place of his death
  chosen_korean: 그의 장례를 대신하여 / 그의 죽음을 대신하여
  alternatives_korean:
  - 그의 매장 대신 / 그의 죽음 대신
  - 그의 묻힘을 대신하여 / 그의 죽음에 대신하여
  lexicon: ἀντί + 명사
  rationale: ἀντί의 대치 의미를 살려 ‘대신하여’로 옮기고, ταφή는 장례/매장의 장례적 행위를 가리키므로 ‘장례’가 자연스럽습니다.
- source_word: ἀνομίαν οὐκ ἐποίησεν
  english_pob_choice: he committed no lawlessness
  chosen_korean: 아무 불법도 행하지 않았고
  alternatives_korean:
  - 그는 어떤 불법도 저지르지 않았고
  - 그는 법을 어긴 일이 없었고
  lexicon: ἀνομία, ποιέω
  rationale: ‘committed no lawlessness’의 동사적 뉘앙스를 살려 ‘행하지 않았습니다’로 옮겼고, ἀνομία는 본문 관례에 맞춰 ‘불법’으로 렌더링했습니다.
- source_word: δόλος ἐν τῷ στόματι αὐτοῦ
  english_pob_choice: deceit found in his mouth
  chosen_korean: 그의 입에서는 어떤 속임수도 발견되지 않았습니다
  alternatives_korean:
  - 그 입에서 어떤 속임수도 드러나지 않았습니다
  - 그 입에 거짓이 발견되지 않았습니다
  lexicon: δόλος, στόμα
  rationale: ‘found in his mouth’의 문장 구조를 보존하면서, δόλος를 ‘속임수’로 옮겨 단순한 거짓말보다 넓은 기만의 뜻을 살렸습니다.
- source_word: κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς
  english_pob_choice: And the Lord wills to cleanse him from the affliction
  chosen_korean: 그리고 주님은 그를 그 고난에서 깨끗하게 하기를 원하십니다
  alternatives_korean:
  - 그리고 주님은 그를 그 상처에서 깨끗하게 하기를 원하십니다
  - 그리고 주님은 그를 그 재앙에서 정결하게 하기를 원하십니다
  lexicon: βούλομαι, καθαρίζω, πληγή
  rationale: βούλεται는 단순한 의도보다 의지/원함의 표현이므로 ‘원하십니다’로 옮겼고, πληγή는 문맥상 ‘affliction’에 맞춰 ‘고난’으로 넓게 번역했습니다.
theological_decisions:
- issue: 원문의 비난과 회복 진술을 어떻게 유지할 것인가
  chosen_reading: 이 구절은 메시아적 고난에 대한 예언적 인용/적용으로 읽히는 문맥을 그대로 두고, 평가적 진술(불법 없음, 속임수 없음)과 회복 의지(주님이 깨끗하게 하시려 함)를 모두 유지했습니다.
  alternative_readings:
  - 단순한 도덕적 모범 진술로만 축소하는 읽기
  - 후반부의 치유/회복 의지를 약화시키는 읽기
  rationale: 본문은 무죄 선언과 회복 의지를 함께 제시하므로, 어느 한쪽을 축소하면 1 Clement의 논증 구조가 흐려집니다.
  doctrine_reference: Christological reading in 1 Clement 16 and Isaianic echo
- issue: ‘주님’의 지시 대상을 어떻게 처리할 것인가
  chosen_reading: κύριος는 문맥상 야훼를 가리키는 성경 인용의 어법을 따르되, 이 문맥에서는 별도 주석 없이 ‘주님’으로 두었습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 1 Clement의 인용은 구약적 어조를 반영하지만, 본문 자체는 직접적인 LXX 성구 표지 없이 문장 속에 삽입되어 있어 독자 흐름을 위해 ‘주님’이 가장 안정적입니다.
  doctrine_reference: OT citation in early Christian exhortation
