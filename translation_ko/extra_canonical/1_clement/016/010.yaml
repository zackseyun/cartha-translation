  verdict: revise
  source_fidelity: ‘장례’는 ταφή가 가리키는 매장·묻힘보다 넓고 의례 자체를 연상시킬 수 있습니다. 또한 πληγή는 넓게 ‘고난’으로 옮길 수 있으나, 이 문맥의 구체적 ‘상처/타격’의 뜻이 약해집니다. ‘상처’로 옮겨 원문의 표현을 더 가깝게 보존하는 것이 안전합니다.
  naturalness: 문장 전체는 현대 표준 한국어 합쇼체로 대체로 자연스럽습니다. 다만 ‘그의 장례를 대신하여’보다 ‘그의 매장 대신’이 간결하고 정확하며, 후반부는 목적어와 출처를 인접시켜 ‘그 상처에서 그를 정결하게’로 하면 구조가 더 분명합니다.
  terminology: ‘악인들’, ‘부자들’, ‘불법’, ‘속임수’, ‘주님’은 적절합니다. καθαρίζω에는 성서 문맥에서 ‘정결하게 하다’가 더 일관된 대응이며, ταφή는 ‘매장’이 적합합니다.
