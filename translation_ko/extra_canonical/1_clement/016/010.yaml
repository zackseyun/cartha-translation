    rationale: ταφή는 장례 전반보다는 매장 또는 묻힘을 가리킵니다. ‘장례’는 의례의 의미를 더하여 원문의 지시 대상을 넓힐 수 있습니다.
  - severity: low
    issue: πληγή를 ‘고난’으로 번역함
    rationale: ‘고난’은 가능한 넓은 해석이지만, πληγή의 상처·타격이라는 구체성이 약해집니다. 이 인용문의 낯선 표현을 보존하기 위해 ‘상처’가 더 직접적입니다.
  - severity: low
    issue: καθαρίσαι를 ‘깨끗하게 하다’로 번역함
    rationale: 의미상 가능하나, 성서적·종교적 정결의 어조를 지닌 καθαρίζω에는 ‘정결하게 하다’가 더 적절합니다.
