base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/016.yaml
  text: 'For Messiah belongs to the humble-minded[a], not to those who exalt themselves over his flock. The scepter of the majesty of God, the Lord Jesus Messiah, did not come in the pomp of arrogance or pride, though he was able, but in humility, just as the Holy Spirit spoke concerning him. For it says:


    “Lord, who has believed our report?

    and to whom has the arm of the Lord been revealed?

    We announced him before him,

    like a child,

    like a root in thirsty ground.

    He has no form nor glory,

    and we saw him,

    and he had neither form nor beauty,

    but his appearance was dishonored,

    failing beyond the appearance of men;

    a man being in plague and toil

    and knowing how to bear weakness,

    because his face is turned away;

    he was dishonored and not esteemed.

    This one bears our sins

    and suffers pain on our behalf,

    and we considered him to be in toil

    and in plague and in affliction.

    But he was wounded because of our sins

    and has been weakened because of our lawless deeds.

    The chastisement of our peace was upon him;

    by his bruise we were healed.

    All we like sheep went astray;

    each man went astray in his own way.

    And the Lord gave him over for our sins,

    and he, because of being afflicted,

    does not open his mouth.

    Like a sheep he was led to slaughter,

    and like a lamb before the one shearing it is voiceless,

    so he does not open his mouth.

    In his humiliation his judgment was taken away.

    Who will describe his generation?

    For his life is taken from the earth.

    Because of the lawless deeds of my people he came to death.

    And I will give the wicked in place of his burial,

    and the rich in place of his death;

    because he did no lawless deed,

    nor was deceit found in his mouth.

    And the Lord wills to cleanse him from the blow[b].

    If you give an offering for sin,

    your soul will see a long-lived offspring.

    And the Lord wills to take away from the toil of his soul,

    to show him light and to form him with understanding,

    to justify the righteous one who serves many well;

    and he himself will bear their sins.

    Because of this he will inherit many,

    and he will divide the spoils of the strong,

    because his soul was given over to death,

    and he was counted among the lawless.

    And he bore the sins of many,

    and because of their sins he was given over.”


    And again he himself says,

    “But I am a worm and not a man,

    a reproach of men and despised by the people.

    All who see me mocked me;

    they spoke with their lips,

    they shook their head:

    ‘He hoped in the Lord; let him rescue him;

    let him save him, because he delights in him.’”


    You see, beloved men, what the pattern given to us is. For if the Lord so humbled himself, what should we do[f][e][d][c], we who through him have come under the yoke of his grace?'
  footnotes:
  - marker: a
    text: The opening clause is textually and syntactically difficult. The sense conveyed is that the Messiah is aligned with humility, not with self-assertive intimidation before his fear.
    reason: textual_variant
  - marker: b
    text: The long central section is a citation of Isaiah 53 in Septuagintal form, with wording that differs at points from both the Hebrew text and familiar English Bible tradition.
    reason: cross_reference
  - marker: c
    text: '''Pattern'' translates ὑπογραμμός, a term for a model or copy set before someone for imitation.'
    reason: lexical_alternative
  - marker: d
    text: 'The final exhortation turns the prophetic portrait of the suffering Lord into a moral summons for the church: humility is not only admired in him but required of those under his grace.'
    reason: cross_reference
  - marker: e
    text: Or 'not to those who throw themselves upon his fear.'.
    reason: previous_rendering
  - marker: f
    text: Or 'If you give for sin,'.
    reason: previous_rendering
translation:
  language: ko
  text: "그러므로 메시아는 겸손한 마음을 가진 이들에게 속하며, 자기 양 떼 위로 스스로 높아지는 이들에게 속하지 않습니다. 하나님의 위엄의 홀인 주 예수 메시아께서는 교만과 자만의 허세 가운데 오지 않으셨고 — 비록 능히 그러실 수 있었지만 — 오직 겸손 가운데 오셨습니다. 이는 성령께서 그에 관하여 말씀하신 것과 같습니다. 그분은 말씀하십니다. \n\n「주님, 우리의 말을 누가 믿었습니까?\n주님의 팔이 누구에게 나타났습니까?\n우리는 그를 그 앞에 알렸습니다.\n마치 아이처럼,\n마른 땅의 뿌리처럼.\n그에게는 형체도 영광도 없었습니다.\n우리는 그를 보았지만,\n그에게는 형체도 아름다움도 없었습니다.\n그의 모습은 수치를 당하여\n사람들의 모습보다 더 초라하였습니다.\n그는 재앙과 수고 가운데 있는 사람이었고,\n연약함을 견디는 법을 알고 있었습니다.\n그의 얼굴이 가려졌기 때문입니다.\n그는 멸시를 받았고 귀히 여기지 않았습니다.\n이 사람은 우리의 죄를 지고\n우리 대신 고통을 당합니다.\n우리는 그를 수고와 재앙과 고난 가운데 있는 사람으로 여겼습니다.\n그러나 그는 우리의 죄들 때문에 찔렸고,\n우리의 불법 행위들 때문에 약해졌습니다.\n우리의 평강을 위한 징계가 그에게 임하였고,\n그의 상처로 우리는 낫게 되었습니다.\n우리는 모두 양처럼 길을 잃었고,\n각 사람은 자기 길로 흩어졌습니다.\n야훼께서는 우리의 죄들 때문에 그를 넘겨주셨고,\n그는 고난을 당하므로 입을 열지 않습니다.\n도살장으로 끌려가는 양처럼,\n그리고 털 깎는 자 앞의 잠잠한 어린 양처럼,\n그도 자기 입을 열지 않습니다.\n그의 낮아짐 가운데 그의 재판은 옮겨졌습니다.\n그의 세대를 누가 말하겠습니까?\n그의 생명이 땅에서 끊어졌기 때문입니다.\n내 백성의 불법 행위들 때문에 그는 죽음에 이르렀습니다.\n나는 그의 장례를 대신하여 악한 자들을,\n그의 죽음을 대신하여 부한 자들을 주겠습니다.\n그가 어떤 불법 행위도 하지 않았고,\n그의 입에서 속임수도 발견되지 않았기\
    \ 때문입니다.\n야훼께서는 그를 그 매질에서 깨끗하게 하기를 원하십니다.\n만일 여러분이 죄를 위한 제물을 드린다면,\n여러분의 영혼은 오래 사는 자손을 보게 될 것입니다.\n야훼께서는 그의 영혼의 수고를 덜어 주시고,\n그에게 빛을 보이시며 이해로 그를 빚으시고,\n많은 사람을 잘 섬기는 의로운 이를 의롭다 하시며,\n그가 그들의 죄들을 짊어질 것입니다.\n그러므로 그는 많은 사람을 상속받고,\n강한 자들의 전리품을 나눌 것입니다.\n그의 영혼이 죽음에 넘겨졌고,\n그는 불법한 자들 가운데 하나로 여겨졌기 때문입니다.\n그는 많은 사람의 죄를 짊어졌고,\n그들의 죄들 때문에 넘겨졌습니다.」\n\n그리고 다시 그분은 말씀하십니다. \n\n「그러나 나는 벌레요 사람이 아니며,\n사람들의 비방거리요 백성의 멸시거리입니다.\n나를 보는 자마다 나를 조롱하였고,\n입술을 내밀어 말하며 머리를 흔들었습니다.\n‘그가 야훼를 신뢰했으니, 그분께서 그를 건져 내시게 하십시오.\n그분께서 그를 구원하게 하십시오. 그분이 그를 기뻐하셨기 때문입니다.’」\n\n사랑하는 남자들이여, 보십시오. 우리에게 주어진 본이 무엇인지 보십시오. 주께서 이렇게 자신을 낮추셨다면, 그분을 통해 그분의 은혜의 멍에 아래 들어온 우리가 무엇을 해야 하겠습니까?[a][b]"
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονῶν / ταπεινοφρονῶντω
  english_pob_choice: humble-minded
  chosen_korean: 겸손한 마음을 가진
  alternatives_korean:
  - 겸손한
  - 마음이 낮은
  - 온유한
  lexicon: LSJ
  rationale: 내적 태도를 가리키는 말이므로 단순 형용사보다 ‘마음을 가진’으로 풀어 겸손의 내적 성격을 살렸습니다.
- source_word: σκῆπτρον τῆς μεγαλωσύνης
  english_pob_choice: the scepter of the majesty
  chosen_korean: 하나님의 위엄의 홀
  alternatives_korean:
  - 위엄의 홀
  - 장엄의 홀
  - 영광의 홀
  lexicon: LSJ
  rationale: 왕권의 비유를 유지하기 위해 ‘홀’을 택했고, μεγαλωσύνη는 하나님께 속한 장엄한 위엄으로 풀었습니다.
- source_word: ὑπογραμμός
  english_pob_choice: pattern
  chosen_korean: 본
  alternatives_korean:
  - 본보기
  - 모범
  - 패턴
  lexicon: BDAG
  rationale: 본문의 결론부는 모방을 위한 제시된 예를 가리키므로, 한국어에서도 짧고 직접적인 ‘본’이 가장 자연스럽습니다.
- source_word: περὶ ἁμαρτίας
  english_pob_choice: an offering for sin
  chosen_korean: 죄를 위한 제물
  alternatives_korean:
  - 속죄제물
  - 죄제물
  - 죄를 위한 희생제물
  lexicon: LXX usage
  rationale: 칠십인역의 제사 용법을 반영하되, ‘제물’로 번역해 희생 제사의 의미를 분명히 했습니다.
- source_word: ἀνομία / ἀνόμοις
  english_pob_choice: lawless deed(s) / the lawless
  chosen_korean: 불법 행위들 / 불법한 자들
  alternatives_korean:
  - 법 없는 일들 / 법 없는 자들
  - 무법 행위들 / 무법한 자들
  - 불의한 행위들 / 불의한 자들
  lexicon: BDAG
  rationale: 도덕적 추상어보다 하나님 뜻에 대한 위반을 직접 드러내는 ‘불법’ 계열을 택했습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 단락은 예수를 왕적·성경적 범주로 제시하므로, 직함의 뜻을 살리는 ‘메시아’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 이사야 53 인용의 대속적 언어
  chosen_reading: 죄를 지고, 우리 대신 고통을 당하고, 우리의 죄들 때문에 찔리고, 그의 상처로 낫게 되었다는 표현을 유지
  alternative_readings:
  - 일반적인 고난 묘사로 완화
  rationale: 본문의 신학적 긴장은 단순한 모범담이 아니라 대속적 고난과 죄 짐을 포함하므로, 이를 약화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
