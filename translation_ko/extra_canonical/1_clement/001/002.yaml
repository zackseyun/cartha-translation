id: 1CLEM.1.2
reference: 1 Clement 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τίς γὰρ παρεπιδημήσας πρὸς ὑμᾶς τὴν πανάρετον καὶ βεβαίαν ὑμῶν πίστιν οὐκ ἐδοκίμασεν; τήν τε σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν οὐκ ἐθαύμασεν; καὶ τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος οὐκ ἐκήρυξεν; καὶ τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν οὐκ ἐμακάρισεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/002.yaml
  text: For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?
translation:
  language: ko
  text: 어떤 나그네가 여러분 가운데 머무르며 여러분의 온갖 선함과 견고한 믿음을 칭찬하지 않았겠습니까? 여러분의 절제롭고 온유한 메시아 안의 경건을 감탄하지 않았겠습니까? 여러분의 환대의 장엄한 성품을 선포하지 않았겠습니까? 또 여러분의 완전하고 확실한 지식을 복되다고 여기지 않았겠습니까?[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπιδημήσας
  english_pob_choice: after staying among you
  chosen_korean: 여러분 가운데 머무르며
  alternatives_korean:
  - 여러분과 함께 체류하며
  - 여러분 사이에 잠시 머물며
  lexicon: παρεπιδημέω
  rationale: 단순한 방문이 아니라 공동체 안에 잠시 머무른 상태를 드러내도록 ‘머무르며’로 옮겼습니다.
- source_word: πανάρετον καὶ βεβαίαν πίστιν
  english_pob_choice: all-virtuous and steadfast faith
  chosen_korean: 온갖 선함과 견고한 믿음
  alternatives_korean:
  - 온전히 덕스러운 믿음과 흔들림 없는 믿음
  - 모든 덕을 갖춘 견고한 믿음
  lexicon: πανάρετος / βεβαίος / πίστις
  rationale: πανάρετον을 도덕적 총체성으로서 ‘온갖 선함’으로 살리고, βεβαίαν은 믿음의 안정성과 확실성을 ‘견고한’으로 반영했습니다.
- source_word: σώφρονα καὶ ἐπιεικῆ ἐν Χριστῷ εὐσέβειαν
  english_pob_choice: sober and gentle godliness in Messiah
  chosen_korean: 절제롭고 온유한 메시아 안의 경건
  alternatives_korean:
  - 신중하고 관대한 메시아 안의 경건
  - 절제 있고 너그러운 메시아 안의 경건
  lexicon: σώφρων / ἐπιεικής / εὐσέβεια / ἐν Χριστῷ
  rationale: σώφρονα와 ἐπιεικῆ의 두 덕목을 각각 ‘절제롭고 온유한’으로 대응시키고, ἐν Χριστῷ는 본문 표지에 맞춰 ‘메시아 안의’로 유지했습니다.
- source_word: τὸ μεγαλοπρεπὲς τῆς φιλοξενίας ὑμῶν ἦθος
  english_pob_choice: the magnificent character of your hospitality
  chosen_korean: 여러분의 환대의 장엄한 성품
  alternatives_korean:
  - 여러분의 환대의 위엄 있는 태도
  - 여러분 환대의 위대한 품성
  lexicon: μεγαλοπρεπές / φιλοξενία / ἦθος
  rationale: φιλοξενίας ἦθος는 환대의 ‘성품/태도’를 가리키므로 관계적 실천의 품격을 드러내는 ‘성품’으로 옮겼습니다.
- source_word: τὴν τελείαν καὶ ἀσφαλῆ γνῶσιν
  english_pob_choice: your complete and sure knowledge
  chosen_korean: 여러분의 완전하고 확실한 지식
  alternatives_korean:
  - 여러분의 온전하고 안전한 지식
  - 여러분의 완전하며 확실한 앎
  lexicon: τελεία / ἀσφαλής / γνῶσις
  rationale: γνῶσις는 단순 정보보다 ‘지식/앎’의 축을 가지므로 문맥상 자연스러운 ‘지식’을 택하고, τελεία와 ἀσφαλῆ는 각각 ‘완전하고 확실한’으로 살렸습니다.
theological_decisions:
- issue: Χριστός의 번역어 선택
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - 크리스토스
  rationale: 이 기록은 예수 호칭으로서의 Χριστός를 일관되게 표지하는 본문이므로, 프로젝트 기본어에 따라 ‘메시아’로 유지했습니다. 영어 POB의 일시적 Christ 환원은 합보/합식의 편의에 따른 것으로 보이지만, 원문 기반 한국어 본문에서는 신학적 표지성을 살리는 번역이 더 적절합니다.
  doctrine_reference: DOCTRINE.md Χριστός 표기 원칙
