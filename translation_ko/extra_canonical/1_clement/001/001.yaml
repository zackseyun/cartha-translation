id: 1CLEM.1.1
reference: 1 Clement 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ τὰς αἰφνιδίους καὶ ἐπαλλήλους γενομένας ἡμῖν συμφορὰς καὶ περιστάσεις, ἀδελφοί, βράδιον νομίζομεν ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων, ἀγαπητοί, τῆς τε ἀλλοτρίας καὶ ξένης τοῖς ἐκλεκτοῖς τοῦ θεοῦ, μιαρᾶς καὶ ἀνοσίου στάσεως, ἣν ὀλίγα πρόσωπα προπετῆ καὶ αὐθάδη ὑπέρχοντα εἰς τοσοῦτον ἀπονοίας ἐξέκαυσαν, ὥστε τὸ σεμνὸν καὶ περιβόητον καὶ πᾶσιν ἀνθρώποις ἀξιαγάπητον ὄνομα ὑμῶν μεγάλως βλασφημηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/001.yaml
  text: Because of the sudden and repeated misfortunes and crises that have happened to us, brothers, we consider that we have been somewhat slow in turning our attention to the matters disputed among you, beloved—namely, the alien and strange uprising, defiled and unholy, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of madness that your dignified and widely spoken-of name, worthy of love among all people, has been greatly blasphemed.
  footnotes:
  - marker: a
    text: Or 'the matters being sought from us among you'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리에게 갑자기 그리고 거듭 닥친 불행과 환난들 때문에, 형제 여러분, 우리는 여러분 가운데서 문제 삼는 일들에 대해—사랑하는 여러분—응답하는 일을 다소 늦게 했다고 생각합니다. 곧 하나님의 택하신 이들에게는 낯설고 이질적인, 더럽고 불경한 반역인데, 몇몇 경솔하고 제멋대로인 사람들이 극도의 망령됨으로 그것을 부추겨, 여러분의 품위 있고 널리 알려졌으며 모든 사람에게 사랑받을 만한 이름이 크게 비방을 받게 되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰφνιδίους καὶ ἐπαλλήλους ... συμφορὰς καὶ περιστάσεις
  english_pob_choice: the sudden and repeated misfortunes and crises
  chosen_korean: 갑자기 그리고 거듭 닥친 불행과 환난들
  alternatives_korean:
  - 갑작스럽고 연이은 불행과 곤경들
  - 돌연하고 계속된 재난과 위기들
  lexicon: αἰφνίδιος, ἐπάλληλος, συμφορά, περίστασις
  rationale: 두 형용사는 ‘갑자기/거듭’의 시간적 강도를 함께 보이므로 둘 다 살렸고, συμφορα와 περιστάσεις는 단순한 감정이 아니라 실제로 닥친 불운과 압박 상황을 가리켜 ‘불행과 환난들’로 옮겼습니다.
- source_word: ἐπιστροφὴν πεποιῆσθαι περὶ τῶν ἐπιζητουμένων παρʼ ὑμῖν πραγμάτων
  english_pob_choice: to turn our attention to the matters disputed among you
  chosen_korean: 여러분 가운데서 문제 삼는 일들에 대해 응답하는 일
  alternatives_korean:
  - 여러분 가운데서 논쟁 중인 사안들에 주의를 돌리는 일
  - 여러분 사이에서 다투어지는 일들에 답하는 일
  lexicon: ἐπιστροφή, ἐπιζητέω, πράγματα
  rationale: 수정된 영문 전승처럼 ‘disputed among you’의 의미를 따라, ἐπιστροφή는 단순한 심리 변화보다 ‘응답/돌봄을 돌리는 일’의 방향성으로 풀었고, πράγματα는 추상적 ‘문제’보다 실제 분쟁 사안을 드러내는 ‘일들’로 살렸습니다.
- source_word: ἀλλοτρίας καὶ ξένης ... στάσεως
  english_pob_choice: the alien and strange uprising
  chosen_korean: 낯설고 이질적인, 더럽고 불경한 반역
  alternatives_korean:
  - 외래적이고 생소한 반란
  - 이질적이고 이상한 소요
  lexicon: ἀλλοτρία, ξένη, στάσις
  rationale: στάσις는 단순한 분쟁보다 공동체를 뒤흔드는 반역·분열의 성격이 있어 ‘반역’으로 옮겼고, ἀλλοτρία/ξένη는 공동체 바깥의 ‘낯설고 이질적인’ 성격을 표현했습니다.
- source_word: βλασφημηθῆναι
  english_pob_choice: has been greatly blasphemed
  chosen_korean: 크게 비방을 받게 되었습니다
  alternatives_korean:
  - 크게 신성모독을 당하게 되었습니다
  - 크게 훼손되어 말해지게 되었습니다
  lexicon: βλασφημέω
  rationale: 문맥상 하나님의 이름 자체보다 공동체의 명예가 공격받는 상황이므로, 한국어에서는 종교적 낯설음을 줄이면서도 원문의 ‘악의적 모독/비난’ 강도를 반영하는 ‘비방을 받다’로 처리했습니다.
theological_decisions:
- issue: ‘하나님의 택하신 이들’과 반역의 관계
  chosen_reading: 반역은 ‘하나님의 택하신 이들’에게는 외부적이고 부정한 사태로 묘사됩니다.
  alternative_readings:
  - 단순한 교회 내 갈등으로만 축소하는 읽기
  - 정치적 소요로만 한정하는 읽기
  rationale: 원문은 στάσις를 공동체 내부 분쟁이면서도 하나님이 택하신 이들에게는 낯설고 부정한 것으로 규정하므로, 그 신학적 평가를 보존했습니다.
  doctrine_reference: 교회론/선택사상
