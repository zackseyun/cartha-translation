revisions:
- from: 우리에게 갑자기 그리고 거듭 닥친 불행과 환난들 때문에, 형제 여러분, 우리는 여러분 가운데서 문제 삼는 일들에 대해—사랑하는 여러분—응답하는 일을 다소 늦게 했다고 생각합니다. 곧 하나님의 택하신 이들에게는 낯설고 이질적인, 더럽고 불경한 반역인데, 몇몇 경솔하고 제멋대로인 사람들이 극도의 망령됨으로 그것을 부추겨, 여러분의 품위 있고 널리 알려졌으며 모든 사람에게 사랑받을 만한 이름이 크게 비방을 받게 되었습니다.[a]
  to: 형제 여러분, 우리에게 갑작스럽고 거듭된 불행과 곤경이 닥쳤기 때문에, 사랑하는 여러분 가운데서 논쟁이 되는 일들에 우리가 주의를 돌리는 것이 다소 늦었다고 생각합니다. 곧 하나님의 택하신 이들에게는 낯설고 이질적인, 더럽고 불경한 분열에 관한 일입니다. 몇몇 경솔하고 제멋대로인 사람들이 이 분열을 그토록 광기의 지경까지 불붙여, 여러분의 존엄하고 널리 알려져 모든 사람에게 사랑받을 만한 이름이 크게 모욕을 받게 되었습니다.
  rationale: 원문의 장문 구문을 두 문장으로 나누되, ‘논쟁이 되는 일들’과 그 일을 규정하는 ‘분열’의 관계를 분명히 했습니다. ἐπιστροφή의 ‘주의를 돌림’, στάσις의 공동체 분열, ἐξέκαυσαν의 격화, 그리고 ὥστε의 결과를 보존했습니다. 근거 없는 ‘응답’의 뜻과 고아가 된 주석 표지는 제거했습니다.
