id: 1CLEM.1.3
reference: 1 Clement 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπροσωπολήμπτως γὰρ πάντα ἐποιεῖτε καὶ ἐν τοῖς νομίμοις τοῦ θεοῦ ἐπορεύεσθε, ὑποτασσόμενοι τοῖς ἡγουμένοις ὑμῶν καὶ τιμὴν τὴν καϑήκουσαν ἀπονέμοντες τοῖς παρ’ ὑμῖν πρεσβυτέροις· νέοις τε μέτρα καὶ σεμνὰ νοεῖν ἐπετρέπετε· γυναξὶν τε ἐν ἀμώμῳ καὶ σεμνῇ καὶ ἁγνῇ συνειδήσει πάντα ἐπιτελεῖν παρηγγέλλετε, στεργούσας καϑηκόντως τοὺς ἄνδρας ἑαυτῶν· ἐν τε τῷ κανόνι τῆς ὑποταγῆς ὑπάρχουσας τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν ἐδιδάσκετε, πάνυ σωφρονούσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001/003.yaml
  text: For you did everything without partiality[a], and you walked in the ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were directing the younger men to think moderate and dignified thoughts. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and you taught them, being under the rule of submission, to manage the affairs of the household with dignity[b], showing complete self-control.
  footnotes:
  - marker: a
    text: Or 'and, being within the rule of submission, to manage'.
    reason: previous_rendering
  - marker: b
    text: Or 'to think thoughts marked by moderation and dignity'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 여러분이 편파 없이 모든 일을 하였고, 하나님의 규례들 안에서 걸어가며, 여러분의 지도자들에게 순복하고 여러분 가운데 있는 장로들에게 마땅한 존경을 드렸기 때문입니다. 또 여러분은 젊은이들에게 절제되고 품위 있는 생각을 하도록 권하셨습니다. 그리고 여자들에게는 흠 없고 품위 있고 순결한 양심으로 모든 일을 행하며, 자기 남편들을 마땅히 사랑하도록 명하셨습니다. 또한 복종의 규범 아래 있는 이들로서, 가정의 일들을 품위 있게 돌보며 온전히 절제하도록 가르치셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπροσωπολήμπτως
  english_pob_choice: without partiality
  chosen_korean: 편파 없이
  alternatives_korean:
  - 차별 없이
  - 외모를 보지 않고
  - 사람을 가리지 않고
  lexicon: ἀπροσωπολήμπτως
  rationale: ‘사람을 외모로 판단하지 않음’의 뜻을 간명하게 살리기 위해 ‘편파 없이’를 택했습니다. 한국어에서 행위의 공정성을 직접 드러냅니다.
- source_word: τοῖς νομίμοις τοῦ θεοῦ
  english_pob_choice: the ordinances of God
  chosen_korean: 하나님의 규례들
  alternatives_korean:
  - 하나님의 명령들
  - 하나님의 법도들
  - 하나님의 율례들
  lexicon: νόμιμος / νόμιμα
  rationale: 본문의 의미는 추상적인 ‘법적 정당성’보다 하나님께 속한 마땅한 규범들이므로, POB의 ‘ordinances’에 맞춰 ‘규례들’로 옮겼습니다.
- source_word: ὑποτασσόμενοι
  english_pob_choice: submitting yourselves
  chosen_korean: 순복하고
  alternatives_korean:
  - 복종하고
  - 스스로 복종하며
  - 자신을 낮추어
  lexicon: ὑποτάσσω
  rationale: 바울서신 외의 권면문맥에서 위계적 복종을 다소 분명히 드러내되, 한국어 합쇼체의 문체에 맞는 ‘순복하다’를 사용했습니다.
- source_word: γυναξὶν ... ἐπιτελεῖν παρηγγέλλετε
  english_pob_choice: you were instructing the women to carry out all things
  chosen_korean: 여자들에게는 ... 모든 일을 행하며 ... 명하셨습니다
  alternatives_korean:
  - 여자들에게는 ... 모든 일을 하도록 권하셨습니다
  - 여자들에게는 ... 모든 것을 실행하도록 지시하셨습니다
  lexicon: παραγγέλλω / ἐπιτελέω
  rationale: 여기서는 단순 권유보다 실제 지시의 힘이 있고, ἐπιτελεῖν은 ‘이행하다/행하다’의 뜻이므로 자연스러운 ‘모든 일을 행하며’로 옮겼습니다.
- source_word: ἐν τε τῷ κανόνι τῆς ὑποταγῆς
  english_pob_choice: being under the rule of submission
  chosen_korean: 복종의 규범 아래 있는 이들로서
  alternatives_korean:
  - 복종의 질서 아래 있는 이들로서
  - 순복의 규칙 아래 있는 이들로서
  - 복종의 원칙 아래 있는 이들로서
  lexicon: κανών / ὑποταγή
  rationale: κανών은 ‘규범/기준’의 뜻이 강하므로 ‘규범’으로, ὑποταγή는 관계적 복종을 나타내어 ‘복종의 규범 아래’로 결합해 살렸습니다.
- source_word: τὰ κατὰ τὸν οἶκον σεμνῶς οἰκουρεῖν
  english_pob_choice: to manage the affairs of the household with dignity
  chosen_korean: 가정의 일들을 품위 있게 돌보며
  alternatives_korean:
  - 집안일을 품위 있게 살피며
  - 가사의 일을 품위 있게 다루며
  - 가정의 일을 단정하게 관리하며
  lexicon: οἰκουρέω / σεμνῶς
  rationale: οἰκουρέω는 단순 관리보다 가정 안의 일들을 돌보는 뜻이 강해 ‘돌보다’로 옮겼고, σεμνῶς는 ‘품위 있게’가 가장 직접적입니다.
theological_decisions:
- issue: 여성에 대한 권면에서 남편을 ‘사랑하다’의 강도와 뉘앙스
  chosen_reading: ‘자기 남편들을 마땅히 사랑하도록’으로 옮겨, 애정과 의무의 두 요소를 함께 드러냈습니다.
  alternative_readings:
  - ‘자기 남편들을 사랑하도록’
  - ‘자기 남편들에게 친절하도록’
  rationale: στεργούσας는 일반적인 ἀγαπάω보다 가족적 애착과 자연스러운 애정을 더 강하게 시사하므로, 단순한 윤리 명령으로 약화시키지 않기 위해 ‘마땅히 사랑하다’를 택했습니다.
  doctrine_reference: 가정 윤리와 성별 권면의 문맥 보존
- issue: 마지막 절의 주체 관계와 동사 연쇄
  chosen_reading: ‘또한 ... 가르치셨습니다’로 독립된 동사 ἐδιδάσκετε를 반영했습니다.
  alternative_readings:
  - 마지막 절을 앞선 ‘명하셨습니다’에 종속시키는 읽기
  rationale: 그리스어의 미완료 직설법 연쇄에서 ἐδιδάσκετε는 별개의 주동사이므로, 한국어에서도 마지막 권면을 독립된 서술로 보존해야 문장 구조와 수사가 살아납니다.
  doctrine_reference: 본문 문법 보존
