review_pass:
  verdict: revise
  source_fidelity: 전반적인 동사 연쇄와 권면의 대상은 잘 반영했으나, γυναξὶν 절에서 부정사 ἐπιτελεῖν을 ‘행하며’로 처리하여 명령 내용의 병렬성이 약해졌습니다. 또한 ἐν τῷ κανόνι τῆς ὑποταγῆς는 ‘복종의 규범 아래 있는 이들로서’보다 ‘복종의 질서 안에서’가 원문의 관계와 한국어 문법을 더 정확히 드러냅니다.
  naturalness: ‘하나님의 규례들 안에서 걸어가며’와 ‘복종의 규범 아래 있는 이들로서’는 그리스어 어순을 지나치게 따르므로 현대 표준 한국어로 다소 부자연스럽습니다. ‘하나님의 규례를 따라 살아가며’, ‘복종의 질서 안에서’로 다듬는 것이 자연스럽습니다.
  terminology: ὑποταγή를 ‘복종’으로 유지하되, κανών과 결합한 표현은 ‘규범 아래’보다 ‘질서 안에서’가 자연스럽고 의미상 안전합니다. νέοις는 문맥상 젊은 남성들을 가리키므로 명시했습니다. 제공된 영어 감사 추적의 각주 a/b는 해당 위치의 대안 번역과 일치하지 않으며, 한국어 본문 끝의 [a][b] 앵커도 근거가 없으므로 제거해야 합니다.
  issues:
  - severity: medium
    issue: 여성에 대한 권면절의 동사 구조가 약화되었습니다.
    rationale: ἐπιτελεῖν과 στεργούσας는 γυναξὶν에 관련된 권면 내용입니다. ‘모든 일을 행하며’는 앞의 ‘명하셨습니다’에 대한 목적 구문을 불완전하게 만들므로, ‘모든 일을 행하고 … 사랑하도록’으로 옮겨야 합니다.
  - severity: medium
    issue: 마지막 절의 ‘복종의 규범 아래 있는 이들로서’는 부자연스럽고 관계 표현이 불명확합니다.
    rationale: ἐν τῷ κανόνι τῆς ὑποταγῆς는 여성들이 복종의 규범 또는 질서 안에 있다는 상태를 나타냅니다. ‘복종의 질서 안에서’가 이를 자연스럽게 보존합니다.
  - severity: medium
    issue: 각주 앵커 [a][b]가 본문 끝에 잘못 배치되어 있고 제공된 영어 각주 내용도 앵커와 대응하지 않습니다.
    rationale: 영어 감사 추적에서 a는 ‘without partiality’ 뒤, b는 마지막 가사 관리 표현 뒤에 붙어 있으나 각주 내용은 서로 다른 구절의 대안 번역을 가리킵니다. 이 한국어 번역에는 필요한 본문 변이 또는 번역상 각주가 없으므로 앵커와 각주를 제거합니다.
  - severity: low
    issue: ‘규례들 안에서 걸어가며’는 직역투입니다.
    rationale: ἐν τοῖς νομίμοις ... ἐπορεύεσθε의 비유적 ‘행하다/살다’를 ‘규례를 따라 살아가며’로 옮기면 의미를 보존하면서 자연스럽습니다.
  revised_text: 이는 여러분이 편파 없이 모든 일을 하였고, 하나님의 규례를 따라 살아가며, 여러분의 지도자들에게 순복하고 여러분 가운데 있는 장로들에게 마땅한 존경을 드렸기 때문입니다. 또 여러분은 젊은 남성들에게 절제되고 품위 있는 생각을 하도록 권하셨습니다. 그리고 여성들에게는 흠 없고 품위 있고 순결한 양심으로 모든 일을 행하고, 자기 남편을 마땅히 사랑하도록 명하셨습니다. 또한 그들이 복종의 질서 안에서 가정의 일을 품위 있게 돌보고 매우 절제하도록 가르치셨습니다.
