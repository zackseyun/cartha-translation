base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/006.yaml
  text: 'To these men[2], who had conducted themselves in holiness, there was gathered a great multitude of the elect, who, having suffered many outrages and tortures because of jealousy, became a most beautiful example among us.


    2. Because of jealousy, women, being persecuted as Danaids and Dirces, after suffering terrible and unholy abuses, reached the sure course of faith and received a noble reward, though weak in body.


    3[2]. Jealousy estranged wives from their husbands and altered what was spoken by our father Adam: “This now is bone of my bones and flesh of my flesh.”


    4[3]. Jealousy and strife have torn down great cities and uprooted great nations.'
  footnotes:
  - marker: '2'
    text: Danaids and Dirce are figures from Greek myth. Clement invokes them allusively to describe the women’s persecution; the exact force of the comparison is debated.
    reason: cultural_note
  - marker: '2'
    text: Or “the firm race of faith.” The Greek δρόμος can evoke a race-course as well as a course or path.
    reason: lexical_alternative
  - marker: '3'
    text: Quotation from Gen 2:23.
    reason: cross_reference
translation:
  language: ko
  text: '이 사람들에게는, 거룩하게 살아간 자들에게, 많은 선택된 이들의 큰 무리가 모여들었는데, 그들은 질투 때문에 많은 모욕과 고문을 당하고서 우리 가운데서 가장 아름다운 본보기가 되었습니다.


    2. 질투 때문에 박해를 받은 여자들은 다나이스와 디르케들처럼 되어, 끔찍하고 불경한 학대를 겪은 뒤 믿음의 확실한 길에 이르렀고, 몸은 약했지만 고귀한 상을 받았습니다.


    3. 질투는 아내들을 남편들에게서 멀어지게 했고, 우리 조상 아담을 통해 말씀하신 것을 바꾸어 놓았습니다. “이제 이것은 내 뼈 중의 뼈요 내 살 중의 살이다.”


    4. 질투와 다툼은 큰 도시들을 무너뜨렸고 큰 민족들을 뿌리째 뽑아 버렸습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁσίως πολιτευσαμενοις
  english_pob_choice: who had conducted themselves in holiness
  chosen_korean: 거룩하게 살아간 자들
  alternatives_korean:
  - 거룩한 삶을 산 자들
  - 경건하게 처신한 이들
  lexicon: LSJ
  rationale: πολιτεύομαι의 공적·윤리적 삶의 뉘앙스를 살리면서, ὁσίως의 성스러운 도덕성을 한국어에서 자연스럽게 드러내기 위해 ‘거룩하게 살아간’으로 옮겼습니다.
- source_word: ἐκλεκτῶν
  english_pob_choice: the elect
  chosen_korean: 선택된 이들
  alternatives_korean:
  - 택함을 받은 자들
  - 선민
  lexicon: LSJ
  rationale: 초기 기독교적 집단 정체성을 담는 말이지만, 한국어에서 과도한 교회 용어화를 피하면서도 선택됨의 의미를 분명히 하기 위해 ‘선택된 이들’로 옮겼습니다.
- source_word: ὑπόδειγμα κάλλιστον
  english_pob_choice: a most beautiful example
  chosen_korean: 가장 아름다운 본보기가
  alternatives_korean:
  - 가장 훌륭한 본보기
  - 가장 뛰어난 본
  lexicon: LSJ
  rationale: κάλλιστον의 미학적 색채를 보존하기 위해 ‘아름다운’을 살렸고, ὑπόδειγμα는 도덕적 모범의 의미를 담아 ‘본보기’로 옮겼습니다.
- source_word: τὸν τῆς πίστεως βέβαιον δρόμον
  english_pob_choice: the sure course of faith
  chosen_korean: 믿음의 확실한 길
  alternatives_korean:
  - 믿음의 확실한 경주
  - 믿음의 견고한 노정
  lexicon: LSJ
  rationale: δρόμος의 ‘길/코스’ 가능성을 한국어의 자연스러운 표현으로 살렸고, βέβαιον의 확실성과 안정감을 ‘확실한’으로 반영했습니다.
- source_word: ἀνόσια
  english_pob_choice: unholy
  chosen_korean: 불경한
  alternatives_korean:
  - 경건치 않은
  - 성스러움을 더럽힌
  lexicon: LSJ
  rationale: ἀνόσια의 종교적 금기 위반과 거룩함에 대한 침해를 드러내기 위해 단순한 ‘심한’이나 ‘추한’보다 ‘불경한’이 더 적절합니다.
- source_word: ἔρις
  english_pob_choice: strife
  chosen_korean: 다툼
  alternatives_korean:
  - 분쟁
  - 논쟁
  lexicon: LSJ
  rationale: 공동체를 분열시키는 갈등을 한국어에서 직접적으로 전달하기 위해 ‘다툼’으로 옮겼습니다.
theological_decisions:
- issue: Δαναΐδες καὶ Δίρκαι의 처리
  chosen_reading: 신화적 암시를 보존하여 ‘다나이스와 디르케들’로 음역했습니다.
  alternative_readings:
  - 다나이스와 디르케 같은 여자들
  - 다나이스와 디르케로 비유된 여자들
  rationale: 본문은 압축된 문화적 암시를 사용하므로, 해석을 본문에 덧씌우지 않고 독자가 주석을 통해 확인하도록 음역을 유지했습니다.
  doctrine_reference: 원문 우선 원칙; 해석적 확장 억제
- issue: ζῆλος의 반복
  chosen_reading: 세 번 반복되는 ‘질투’를 그대로 유지했습니다.
  alternative_readings:
  - 시기
  - 열심
  rationale: 문맥상 공동체를 파괴하는 정념으로서의 ζῆλος이 일관되게 기능하므로, 한 단어로 통일해 서술의 수사적 반복을 살렸습니다.
  doctrine_reference: 어휘 반복의 신학적·수사학적 기능 보존
