  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029.yaml
  text: 'Therefore let us come near to him in holiness of soul[a], lifting up to him hands that are pure and undefiled, loving our gentle and compassionate Father, who has made us a chosen portion for himself.


    2. For thus it is written:

    “When the Most High divided the nations,

    when he scattered the sons of Adam,

    he fixed the boundaries of the nations

    according to the number of the angels of God.

    The Lord’s portion became his people Jacob,

    Israel the measuring-line of his inheritance.”


    3. And in another place he says:

    “Behold, the Lord takes for himself a nation from the midst of nations,

    as a man takes the firstfruits of his threshing floor[b][c];

    and from that nation the holy of holies shall come forth.”'
  footnotes:
  - marker: a
    text: The citation reflects the Greek wording as given here, including 'according to the number of the angels of God.' Other textual traditions of Deuteronomy differ at this point.
    reason: textual_variant
    anchor_ref: '29:2'
  - marker: c
    text: '''The holy of holies'' is a literal rendering of the Greek phrase and may be understood in more than one way in this context.'
    reason: lexical_alternative
    anchor_ref: '29:3'
  - marker: b
    text: Or 'And the Lord’s portion became his people Jacob,'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 우리도 영혼의 거룩함 가운데 그에게 나아가야 합니다. 곧 깨끗하고 더럽혀지지 않은 손을 그에게 들어 올리며, 온유하고 동정심 많은 우리 아버지를 사랑해야 합니다. 그분은 우리를 자기 자신을 위한 선택된 몫으로 삼으셨습니다.


    2. 이는 이렇게 기록되어 있기 때문입니다.

    “지극히 높으신 이가 민족들을 나누실 때,

    아담의 아들들을 흩으실 때,

    민족들의 경계를 정하셨으니

    하나님의 천사들의 수에 따라 하셨습니다.

    주님의 몫은 그의 백성 야곱이 되었고,

    이스라엘은 그의 기업의 측량줄이 되었습니다.”


    3. 또 다른 곳에서는 이렇게 말씀하십니다.

    “보십시오, 주님은 민족들 가운데서 한 민족을 자기에게 취하십니다.

    마치 사람이 자기 타작마당의 첫 열매를 거두는 것처럼[a][b],

    그리고 그 민족에게서 지극히 거룩한 것이 나올 것입니다.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέλθωμεν
  english_pob_choice: let us come near
  chosen_korean: 그에게 나아가야 합니다
  alternatives_korean:
  - 그에게 가까이 가야 합니다
  - 그에게 나아가야 합니다
  lexicon: BDAG
  rationale: προσ-의 접근성을 살려 단순한 ‘가다’보다 예배적·제의적 접근의 뉘앙스를 드러냈습니다.
- source_word: ἐν ὁσιότητι ψυχῆς
  english_pob_choice: in holiness of soul
  chosen_korean: 영혼의 거룩함 가운데
  alternatives_korean:
  - 영혼의 거룩함으로
  - 영혼의 경건함 가운데
  lexicon: BDAG
  rationale: ὁσιότης의 도덕·종교적 거룩함과 ψυχή의 내면성을 함께 살리기 위해 직역을 약간 다듬었습니다.
- source_word: ἐκλογῆς μέρος
  english_pob_choice: a chosen portion
  chosen_korean: 선택된 몫
  alternatives_korean:
  - 선택된 부분
  - 택하신 몫
  lexicon: BDAG
  rationale: 선택과 몫/분깃의 이미지를 함께 보존하되, 한국어에서 자연스러운 표현으로 정리했습니다.
- source_word: μερὶς κυρίου ... σχοίνισμα κληρονομίας
  english_pob_choice: the Lord’s portion ... the measuring-line of his inheritance
  chosen_korean: 주님의 몫 ... 그의 기업의 측량줄
  alternatives_korean:
  - 주님의 분깃 ... 그의 기업의 줄
  - 주님의 몫 ... 그의 유업의 측량선
  lexicon: BDAG
  rationale: 몫/기업의 구약적 분깃 이미지를 유지하고, σχοίνισμα를 문자적인 ‘측량줄’로 옮겨 상속·토지 배분의 비유를 보존했습니다.
- source_word: ἅγια ἁγίων
  english_pob_choice: the holy of holies
  chosen_korean: 지극히 거룩한 것
  alternatives_korean:
  - 지성소
  - 가장 거룩한 것
  lexicon: BDAG
  rationale: 이 구절에서는 대상이 인물/실재/공동체로도 읽힐 수 있는 모호성이 있어, 전통 용어인 ‘지성소’로 좁히지 않고 문자적 의미를 살렸습니다.
theological_decisions:
- issue: 1인칭 권면의 어조와 제의적 접근 표현
  chosen_reading: ‘그에게 나아가야 합니다’로 옮겨 공동체적 권면과 하나님께 대한 예배적 접근을 함께 드러냈습니다.
  alternative_readings:
  - 그에게 가까이 가야 합니다
  - 그에게 와야 합니다
  rationale: 본문의 hortatory subjunctive는 단순 이동이 아니라 하나님께 다가가는 예배적 초청이므로, 한국어에서도 그 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
- issue: ἅγια ἁγίων의 해석
  chosen_reading: ‘지극히 거룩한 것’으로 번역해 최종 구절의 의미 범위를 열어 두었습니다.
  alternative_readings:
  - 지성소
  - 가장 거룩한 것
  - 지극히 거룩한 이
  rationale: 클레멘트의 인용문은 이 표현을 어떤 단일 교리 범주로 고정하기보다, 매우 성스러운 실재의 출현을 말하는 것으로 읽히므로 번역에서 모호성을 유지했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
