base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011.yaml
  text: 'Because of hospitality and godliness[a], Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.


    For when his wife went out with him, being of a different mind and not in harmony, she was set forth as a sign to this end, so that she became a pillar of salt to this very day[d][c][b], in order that it might be known to all that the double-minded and those who doubt the power of God come to judgment and become a warning to all generations.'
  footnotes:
  - marker: a
    text: Fire and sulfur echoes the judgment on Sodom in Genesis 19.
    reason: cross_reference
  - marker: b
    text: Or 'the wayward' for 'those who turn aside' (ἑτεροκλινεῖς).
    reason: lexical_alternative
  - marker: c
    text: '''Double-minded'' translates δίψυχοι, literally suggesting a divided inner life.'
    reason: lexical_alternative
  - marker: d
    text: Or 'she was set forth as a sign'.
    reason: previous_rendering
translation:
  language: ko
  text: '나그네를 잘 대접하는 것과 경건함 때문에 롯은 소돔에서 구원을 받았습니다. 그 주변 온 지역이 불과 유황으로 심판받았을 때입니다. 여기서 주님께서는, 자기에게 희망을 두는 사람들을 버리지 않으시고, 그러나 빗나간 자들은 벌과 고통에 처하신다는 것을 분명히 보여 주셨습니다.


    또 그의 아내가 그와 함께 나올 때, 생각이 다르고 한마음이 아니었으므로, 그녀는 이 목적을 위해 표징으로 세워져 오늘까지 소금 기둥이 되었습니다. 이는 모든 사람에게, 마음이 둘로 나뉜 자들과 하나님의 능력에 대해 의심하는 자들이 심판에 이르며 모든 세대에 대한 경고가 됨을 알게 하려는 것이었습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
