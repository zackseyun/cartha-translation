  chosen_reading: 그녀는 이 목적을 위해 표징으로 세워져… 모든 세대에 대한 경고가 됨
  alternative_readings:
  - 그녀는 표징으로 제시되어… 예가 됨
  - 그녀는 표징이 되어… 경고가 됨
  rationale: 본문은 단순한 역사 서술이 아니라, 그녀의 변화를 모든 세대에 대한 경고로 기능하게 합니다. 이를 살려 예표성과 경고성을 함께 유지했습니다.
  doctrine_reference: 1 Clement의 권면적 문맥과 창세기 19장의 심판 전통
