id: 1CLEM.51.2
reference: 1 Clement 51:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ γὰρ μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι ἑαυτοὺς θέλουσιν μᾶλλον αἰκίαις περιπίπτειν ἢ τοὺς πλησίον· μᾶλλον δὲ ἑαυτῶν κατάγνωσιν φέρουσιν ἢ τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/002.yaml
  text: For those who conduct themselves with fear and love desire rather to fall into mistreatment themselves than their neighbors[a]; indeed[b], they bear condemnation of themselves rather than of the harmony that has been handed down to us well and justly.
  footnotes:
  - marker: a
    text: Or 'desire rather to fall into mistreatment themselves than to bring it upon their neighbors'.
    reason: previous_rendering
  - marker: b
    text: Or 'bear condemnation of themselves than of the harmony'.
    reason: previous_rendering
translation:
  language: ko
  text: 두려움과 사랑으로 살아가는 이들은 이웃들이 학대를 당하는 것보다 차라리 자신들이 학대를 당하기를 원합니다. 더욱이 그들은 우리에게 훌륭하고 올바르게 전해져 온 그 일치를 정죄하기보다 자신들에 대한 정죄를 감수합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιτευόμενοι
  english_pob_choice: conduct themselves
  chosen_korean: 행하는 이들
  alternatives_korean:
  - 살아가는 이들
  - 시민처럼 행하는 이들
  lexicon: πολιτεύομαι
  rationale: 정치적 ‘시민권 행사’보다 삶의 태도와 행실을 가리키는 문맥이므로, ‘행하다’로 간결하게 옮기되 도덕적 생활의 뉘앙스를 살렸습니다.
- source_word: φόβου καὶ ἀγάπης
  english_pob_choice: fear and love
  chosen_korean: 두려움과 사랑
  alternatives_korean:
  - 경외와 사랑
  - 두려움과 애정
  lexicon: φόβος, ἀγάπη
  rationale: φόβος의 기본 감각을 ‘두려움’으로 보되, 1클레멘트의 경건한 태도 문맥을 해치지 않도록 과도한 신학적 보정은 하지 않았습니다.
- source_word: αἰκίαις περιπίπτειν
  english_pob_choice: fall into mistreatment
  chosen_korean: 학대를 당하다
  alternatives_korean:
  - 모욕을 당하다
  - 핍박에 빠지다
  lexicon: αἰκία, περιπίπτω
  rationale: ‘떨어지다/빠지다’의 역동성을 한국어에서 자연스럽게 살리기 위해 수동적 피해를 드러내는 ‘학대를 당하다’를 택했습니다.
- source_word: τοὺς πλησίον
  english_pob_choice: their neighbors
  chosen_korean: 이웃들에게
  alternatives_korean:
  - 이웃들보다
  - 이웃들에게 그런 일을
  lexicon: πλησίον
  rationale: 수정된 영어 감사본처럼 행위의 대상이 되는 ‘이웃들’을 보존하되, 한국어에서는 ‘이웃들에게’로 자연스럽게 풀었습니다.
- source_word: κατάγνωσιν φέρουσιν
  english_pob_choice: bear condemnation of themselves
  chosen_korean: 자기들에 대하여 정죄를 가져옵니다
  alternatives_korean:
  - 자기들에게 정죄를 받습니다
  - 자기들 위에 정죄를 지닙니다
  lexicon: κατάγνωσις, φέρω
  rationale: κατάγνωσις와 φέρω의 결합은 ‘정죄를 가져오다/가하다’의 의미이므로, 단순히 ‘받다’보다 능동적 결과를 드러내는 표현을 택했습니다.
- source_word: τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας
  english_pob_choice: the harmony that has been handed down to us well and justly
  chosen_korean: 우리에게 잘리고도 바르게 전해진 그 일치
  alternatives_korean:
  - 우리에게 잘하고 바르게 전해진 그 화합
  - 우리에게 훌륭하고 올바르게 전해진 그 조화
  lexicon: παραδίδωμι, καλῶς, δικαίως, ὁμοφωνία
  rationale: ὁμοφωνία를 단순한 ‘조화’보다 공동체의 ‘일치’로 옮기고, καλῶς/δικαίως는 전달의 질을 나타내는 부사로 보아 ‘잘리고도 바르게’가 아니라 ‘잘하고도 바르게’가 의도되었으나 원문상 ‘잘’과 ‘바르게’의 두 축을 유지했습니다.
theological_decisions:
- issue: ‘두려움’(φόβος)의 어조
  chosen_reading: 경건한 경외를 완전히 대체하지 않고, 본문 표면의 ‘두려움’ 어휘를 유지했습니다.
  alternative_readings:
  - 경외
  - 경외심
  rationale: 문맥상 신앙적 태도를 가리키지만, 원어의 직접성을 보존하기 위해 보다 해석적인 ‘경외’로 완전히 치환하지 않았습니다.
  doctrine_reference: 경건/윤리 어휘의 직접 번역 원칙
- issue: ‘ὁμοφωνία’의 공동체적 의미
  chosen_reading: ‘일치’로 번역하여 공동체의 한목소리와 합의의 의미를 드러냈습니다.
  alternative_readings:
  - 화합
  - 조화
  rationale: ὁμοφωνία는 단순 감정적 화목보다 공동체가 함께 같은 소리를 내는 합의 상태를 가리키므로, 교회적 용어로 고정하지 않고 의미를 직접 드러냈습니다.
  doctrine_reference: 공동체 일치/질서에 관한 서술
