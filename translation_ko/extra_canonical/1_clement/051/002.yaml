- from: 두려움과 사랑으로 행하는 이들은 이웃들에게 그런 일을 당하기보다, 차라리 자기들이 학대를 당하기를 원합니다. 참으로 그들은 우리에게 잘리고도 바르게 전해진 그 일치에 대하여가 아니라, 자기들에 대하여 정죄를 가져옵니다.[a][b]
