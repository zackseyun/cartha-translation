  - severity: medium
    issue: ‘자기들에 대하여 정죄를 가져옵니다’
    rationale: κατάγνωσιν φέρειν의 대조를 현대 한국어에서 자연스럽게 드러내지 못합니다. 자신들에 대한 정죄를 감수하는 것과 일치를 정죄하는 것을 대조하는 표현이 적절합니다.
