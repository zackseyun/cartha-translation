id: 1CLEM.51.1
reference: 1 Clement 51:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/001.yaml
  text: Therefore, whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those, too, who became leaders of revolt and division ought to consider the common hope.
  footnotes:
  - marker: a
    text: Or 'And those who became leaders of revolt and division ought to consider the common good of our hope.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리가 어떤 적대자의 계략을 통해 잘못하고 지은 모든 죄는 용서받게 해 주시기를 구합시다. 그리고 반란과 분열의 우두머리가 된 이들도 우리의 공동의 희망을 생각해야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου
  english_pob_choice: whatever things we have done wrong and committed through any schemes of the adversary
  chosen_korean: 어떤 적대자의 계략을 통해 잘못하고 지은 모든 죄
  alternatives_korean:
  - 우리가 그 대적의 술수로 저지른 모든 잘못
  - 적대자의 어떤 계책으로 범한 모든 죄
  lexicon: παραπίπτω/ποιέω + διά + τοῦ ἀντικειμένου
  rationale: 두 동사는 단순한 일반 오류보다 실제로 저지른 잘못과 범행의 뉘앙스를 가지므로, ‘잘못하고 지은’으로 살리고 διά τινος τῶν τοῦ ἀντικειμένου는 ‘적대자의 계략을 통해’로 옮겨 원문의 수단·원인을 드러냈습니다.
- source_word: ἀξιώσωμεν ἀφεθῆναι ἡμῖν
  english_pob_choice: let us ask that they be forgiven us
  chosen_korean: 용서받게 해 주시기를 구합시다
  alternatives_korean:
  - 우리에게 용서되기를 구합시다
  - 사해 주시기를 청합시다
  lexicon: ἀξιόω + ἀφίημι
  rationale: 직역의 ‘용서되기를’은 가능하지만 한국어 문장 흐름을 위해 ‘용서받게 해 주시기를’로 다듬되, 피동적 결과와 간구의 뜻을 유지했습니다.
- source_word: καὶ ἐκεῖνοι δέ
  english_pob_choice: And those, too
  chosen_korean: 그리고 … 이들도
  alternatives_korean:
  - 그리고 그들도
  - 또한 그 사람들도
  lexicon: καί + ἐκεῖνοι + δέ
  rationale: δὲ의 첨가적 연결을 살리기 위해 ‘그리고’와 ‘이들도’를 사용해 앞선 회개 요청과의 연결을 유지했습니다.
- source_word: τὸ κοινὸν τῆς ἐλπίδος
  english_pob_choice: the common hope
  chosen_korean: 우리의 공동의 희망
  alternatives_korean:
  - 공동의 희망
  - 우리의 공통된 희망
  lexicon: κοινός
  rationale: 공동체적·공유된 희망이라는 의미를 살리기 위해 ‘공동의 희망’으로 옮겼고, 문맥상 화자의 공동체에 속한 희망임을 분명히 하기 위해 ‘우리의’를 보탰습니다.
theological_decisions:
- issue: 반란과 분열의 우두머리들을 향한 권면의 어조
  chosen_reading: 책망보다 회개와 공동체 회복을 촉구하는 권면으로 읽었습니다.
  alternative_readings:
  - 도덕적 비난을 강화하는 읽기
  - 중립적 설명문으로 완화하는 읽기
  rationale: 원문은 ‘해야 합니다(ὀφείλουσιν)’로 의무를 진술하지만, 전체 문맥은 공동의 회개와 화해를 지향하므로 권면의 강도를 유지하되 비난을 과장하지 않았습니다.
  doctrine_reference: 교회 일치와 회개 권면
- issue: ‘공동의 희망’의 공동체성
  chosen_reading: 희망을 개인적 소망이 아니라 공동체가 함께 붙드는 동일한 희망으로 이해했습니다.
  alternative_readings:
  - ‘희망의 공동선’으로 읽기
  - 단순히 ‘희망을 함께 생각하다’로 약화하는 읽기
  rationale: Greek의 τὸ κοινὸν τῆς ἐλπίδος는 공유된 희망을 가리키므로, 한국어에서도 공동체적 공유를 드러내는 표현을 유지했습니다.
  doctrine_reference: 성도의 공동체적 소망
