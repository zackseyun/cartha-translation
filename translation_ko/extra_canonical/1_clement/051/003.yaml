  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하나, ὧν τὸ κρίμα를 단순히 ‘그들의 심판’이라고 하면 한국어에서 다소 모호하고 부자연스럽습니다. ‘그들에 대한 심판’으로 하여 심판의 대상 관계를 분명히 하는 것이 적절합니다. 또한 비교절의 연결은 원문의 καθὼς를 더 자연스럽게 반영하도록 다듬을 수 있습니다.
  naturalness: ‘자기의 죄과들을’은 중복된 소유 표현과 복수 표지가 다소 무겁습니다. ‘자신의 허물을’이 현대 표준어에서 자연스럽고 문맥상 충분히 정확합니다. 원문의 비교·근거 관계는 별도 문장으로 ‘…것처럼 말입니다’라고 처리하면 합쇼체를 유지하면서도 매끄럽습니다.
  terminology: παραπτώματα는 ‘허물’로 옮겨 범죄·과실을 포괄하는 표현을 유지했습니다. σκληρύνω는 윤리적 완고함을 나타내는 ‘완고하게 하다’가 적절합니다. θεράπων τοῦ θεοῦ는 성서적 관용에 따라 ‘하나님의 종’으로 유지합니다. κρίμα는 ‘그들에 대한 심판’으로 번역하여 판결·처벌을 포함하는 폭을 보존합니다.
  issues:
  - severity: medium
    issue: 각주 표지가 원문의 해당 구절과 떨어져 있습니다.
