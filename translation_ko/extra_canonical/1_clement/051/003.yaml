id: 1CLEM.51.3
reference: 1 Clement 51:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/003.yaml
  text: For it is good for a man to confess his transgressions rather than to harden his heart[a], just as the heart of those who rebelled against Moses, the servant of God, was hardened, whose judgment became evident.
  footnotes:
  - marker: a
    text: Or 'confess concerning his transgressions'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람이 자신의 허물을 고백하는 것이[a] 자기 마음을 완고하게 하는 것보다 좋습니다. 하나님의 종 모세에게 반역한 자들의 마음이 완고해졌고 그들에 대한 심판이 분명히 드러났던 것처럼 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신의 허물에 관하여 고백하는 것’.
    reason: περὶ τῶν παραπτωμάτων의 전치사 περὶ를 명시적으로 반영하는 대안 번역입니다.
lexical_decisions:
- source_word: ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων
  english_pob_choice: confess his transgressions
  chosen_korean: 자기의 죄과들을 고백하다
  alternatives_korean:
  - 자기의 허물들을 고백하다
  - 자기의 죄과에 관하여 고백하다
  lexicon: ἐξομολογέομαι
  rationale: ‘고백하다’가 한국어에서 가장 자연스럽게 죄를 인정하는 행위를 드러내며, περὶ는 영어 POB의 처리처럼 의미상 직접목적어로 풀어도 무리가 없어 ‘죄과들을’로 옮겼습니다.
- source_word: σκληρῦναι τὴν καρδίαν
  english_pob_choice: to harden his heart
  chosen_korean: 자기 마음을 완고하게 하는 것
  alternatives_korean:
  - 자기 마음을 굳게 하는 것
  - 자기 হৃদ를 완강하게 하는 것
  lexicon: σκληρύνω
  rationale: σκληρύνω의 결과 상태를 한국어에서 ‘완고하게 하다’로 옮기면 단순한 물리적 ‘굳힘’보다 윤리적·영적 경직을 더 분명히 살릴 수 있습니다.
- source_word: θεράποντα τοῦ θεοῦ
  english_pob_choice: the servant of God
  chosen_korean: 하나님의 종
  alternatives_korean:
  - 하나님의 시종
  - 하나님을 섬기는 이
  lexicon: θεράπων
  rationale: POB의 ‘servant of God’를 한국어 성서 관용과 본문 문맥에 맞게 ‘하나님의 종’으로 옮겼으며, θεράπων의 존귀한 섬김 뉘앙스도 무난히 담습니다.
- source_word: ὧν τὸ κρίμα πρόδηλον ἐγενήθη
  english_pob_choice: whose judgment became evident
  chosen_korean: 그들의 심판은 분명해졌습니다
  alternatives_korean:
  - 그들의 판결은 드러났습니다
  - 그들의 심판은 명백해졌습니다
  lexicon: κρίμα
  rationale: κρίμα를 여기서는 ‘심판’으로 옮겨 결과적 판단/형벌의 의미를 살리고, πρόδηλον ἐγενήθη는 ‘분명해졌습니다’로 직접적이고 형식적으로 표현했습니다.
theological_decisions:
- issue: 반역한 자들과 모세의 대비를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘모세에 대하여 반역한 자들’로 직역에 가깝게 두어, 단순 불평이 아니라 권위에 대한 반역이라는 긴장을 유지했습니다.
  alternative_readings:
  - ‘모세를 거슬러 대적한 자들’
  - ‘모세에게 반기를 든 자들’
  rationale: στασιασάντων은 정치적·공동체적 반역의 뉘앙스가 있어, 더 약한 표현으로 완화하지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 본문 문맥 보존과 경고적 권면의 강도 유지
- issue: ‘심판’의 의미를 사법적 판결로 좁힐지, 종말론적 심판까지 열어둘지
  chosen_reading: ‘심판’으로 넓게 두어, 본문이 말하는 드러난 결과와 하나님의 판정 가능성을 모두 열어두었습니다.
  alternative_readings:
  - ‘판결’
  - ‘형벌’
  rationale: κρίμα는 상황에 따라 판결·정죄·심판을 포괄할 수 있으므로, 여기서는 문맥을 넘지 않으면서도 신학적 함의를 보존하는 일반어를 택했습니다.
  doctrine_reference: 어휘의 의미 범위 보존
