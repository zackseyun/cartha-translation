  - severity: low
    issue: ‘그들의 심판은 분명해졌습니다’가 다소 어색하고 대상 관계가 불명확합니다.
    rationale: ὧν은 반역자들을 가리키며 κρίμα는 그들에 관련된 심판입니다. ‘그들에 대한 심판이 분명히 드러났습니다’가 한국어 문장과 원문의 의미 모두에 더 충실합니다.
  - severity: low
    issue: ‘이는 … 것과 같으며’의 비교절 연결이 부자연스럽습니다.
    rationale: καθὼς는 앞 진술을 역사적 사례로 뒷받침합니다. ‘…것처럼 말입니다’가 이 기능을 자연스럽게 전달합니다.
