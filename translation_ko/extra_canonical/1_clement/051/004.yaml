  - 살아서
  lexicon: ζάω
  rationale: ‘살아 있는 상태로’라는 지속적 상태를 드러내어, 단순한 부사 ‘산 채로’보다 문장 흐름에 맞게 풀었습니다.
theological_decisions:
- issue: 죽음이 주체로서 사람들을 ‘목양한다’는 비유
  chosen_reading: 죽음을 의인화된 지배 주체로 그대로 유지했습니다.
  alternative_readings:
  - 죽음이 그들을 붙들 것입니다
  - 죽음이 그들을 다스릴 것입니다
  rationale: 원문이 ποιμανεῖ를 통해 역설적 의인화를 사용하므로, 그 충격을 완화하지 않고 그대로 드러내는 편이 본문 효과에 더 충실합니다.
