  language: ko
  text: 그들은 살아 있는 채로 하데스로 내려갔고, 죽음이 그들을 목양할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  english_pob_choice: Hades
  chosen_korean: 하데스
  alternatives_korean:
  - 음부
  - 저승
  lexicon: ᾅδης
  rationale: POB가 지시하는 고유명사적 지하 영역을 살리기 위해 음역 ‘하데스’를 유지하고, 전통적 신학어인 ‘음부’보다 원문 대응을 우선했습니다.
- source_word: ποιμανεῖ
  english_pob_choice: will shepherd
  chosen_korean: 목양할 것입니다
  alternatives_korean:
  - 목자처럼 다스릴 것입니다
  - 목자로 삼을 것입니다
  - 돌볼 것입니다
  lexicon: ποιμαίνω
  rationale: 동사의 기본 이미지인 ‘목자처럼 이끌고 다스림’을 살리면서도 한국어에서 충분히 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: ζῶντες
