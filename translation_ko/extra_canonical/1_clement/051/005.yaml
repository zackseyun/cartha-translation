id: 1CLEM.51.5
reference: 1 Clement 51:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051/005.yaml
  text: 'Pharaoh and his army and all the leaders of Egypt, both the chariots and those who rode in them, were sunk into the Red Sea and perished for no other cause than this: their foolish hearts were hardened after the signs and wonders had taken place in the land of Egypt through Moses, the servant of God.'
translation:
  language: ko
  text: 바로와 그의 군대와 이집트의 모든 지도자들과 그들의 병거들과 그 위에 탄 자들은, 다른 어떤 이유 때문이 아니라 이집트 땅에서 하나님의 종 모세를 통해 표징들과 기적들이 일어난 뒤 그들의 어리석은 마음이 완고해졌기 때문에 홍해에 가라앉아 멸망했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡγούμενοι
  english_pob_choice: leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 통치자들
  - 우두머리들
  lexicon: ἡγέομαι
  rationale: 영어 POB의 'leaders'를 따라 계급적·행정적 우두머리라는 뜻을 살리되, 한국어에서는 가장 중립적인 '지도자들'이 자연스럽습니다.
- source_word: ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν
  english_pob_choice: were sunk into the Red Sea
  chosen_korean: 홍해에 가라앉아
  alternatives_korean:
  - 홍해 속으로 잠겨
  - 홍해에 빠져
  lexicon: βυθίζω
  rationale: βυθίζω의 '가라앉다/침몰하다'를 직접 살려, 사건의 수동성과 심판성을 드러내는 표현으로 옮겼습니다.
- source_word: ἀσυνέτους καρδίας
  english_pob_choice: foolish hearts
  chosen_korean: 어리석은 마음
  alternatives_korean:
  - 무지한 마음
  - 분별 없는 마음
  lexicon: ἀσύνετος
  rationale: ἀσύνετος는 단순한 지식 부족보다 분별 없음과 어리석음을 포함하므로, POB의 'foolish'에 맞춰 '어리석은'으로 옮겼습니다.
- source_word: θεράποντος τοῦ θεοῦ
  english_pob_choice: the servant of God
  chosen_korean: 하나님의 종
  alternatives_korean:
  - 하나님을 섬기는 자
  - 하나님의 일꾼
  lexicon: θεράπων
  rationale: θεράπων의 공손한 봉사자/섬기는 자 뉘앙스를 한국어 성경에서 자연스러운 '종'으로 옮기되, Θεός는 프로젝트 기본어인 '하나님'을 유지했습니다.
theological_decisions:
- issue: '''다른 어떤 이유 때문이 아니라''라는 배타적 원인 진술의 표현'
  chosen_reading: 심판의 원인을 단일화하여 '다른 어떤 이유 때문이 아니라'로 옮겼습니다.
  alternative_readings:
  - '''오직 이 이유 때문에'''
  - '''그 어떤 다른 까닭으로도 아니고'''
  rationale: 본문의 οὐ διʼ ἄλλην τινὰ αἰτίαν은 단순 서술이 아니라 원인 배제를 통한 해석이므로, 영어 POB의 구조를 따라 명시적으로 살렸습니다.
  doctrine_reference: 신적 심판의 공정성과 인간의 완고함에 대한 서술
