source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἐὰν τις καθ’ ἓν ἕκαστον εἰλικρινῶς κατανοήσῃ, ἐπιγνώσεται μεγαλεῖα τῶν ὑπ’ αὐτοῦ δεδομένων δωρεῶν. 2. ἐξ αὐτοῦ γὰρ ἱερεῖς καὶ λευῖται πάντες οἱ λειτουργοῦντες τῷ θυσιαστηρίῳ τοῦ θεοῦ· ἐξ αὐτοῦ ὁ κύριος Ἰησοῦς τὸ κατὰ σάρκα· ἐξ αὐτοῦ βασιλεῖς καὶ ἄρχοντες καὶ ἡγούμενοι κατὰ τὸν Ἰούδαν· τὰ δὲ λοιπὰ σκῆπτρα αὐτοῦ οὐκ ἐν μικρᾷ δόξῃ ὑπάρχουσιν, ὡς ἐπαγγειλαμένου τοῦ θεοῦ, ὅτι ἔσται τὸ σπέρμα σου ὡς οἱ ἀστέρες τοῦ οὐρανοῦ. 3. πάντες οὖν ἐδοξάσθησαν καὶ ἐμεγαλύνθησαν οὐ δι’ αὑτῶν ἢ τῶν ἔργων αὐτῶν ἢ τῆς δικαιοπραγίας ἧς κατειργάσαντο, ἀλλὰ διὰ τοῦ θελήματος αὐτοῦ. 4. καὶ ἡμεῖς οὖν, διὰ θελήματος αὐτοῦ ἐν Χριστῷ Ἰησοῦ κληθέντες, οὐ δι’ ἑαυτῶν δικαιούμεθα οὐδὲ διὰ τῆς ἡμετέρας σοφίας ἢ συνέσεως ἢ εὐσεβείας ἢ ἔργων ὧν κατειργασάμεθα ἐν ὁσιότητι καρδίας, ἀλλὰ διὰ τῆς πίστεως, δ’ ἧς πάντας τοὺς ἀπ’ αἰῶνος ὁ παντοκράτωρ θεὸς ἐδικαίωσεν· ᾧ ἔστω ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
  pages:
  - 301
  - 303
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/032.yaml
  text: If anyone sincerely considers each thing one by one[a], he will recognize the greatness of the gifts given by him. For from him are priests and Levites, all who minister at the altar of God; from him is the Lord Jesus according to the flesh; from him are kings and rulers and leaders according to Judah; and his remaining tribes are not in small glory, just as God promised, saying, “Your seed will be as the stars of heaven.” Therefore all were glorified and made great, not through themselves or through their works or through the righteous deeds that they accomplished, but through his will. And so we also, having been called through his will in Messiah Jesus, are not justified through ourselves, nor through our own wisdom or understanding or godliness or works that we have done in holiness of heart, but through faith, through which the Almighty God justified all who have been from the beginning. To him be the glory forever and ever[e][d][c][b]. Amen.
  footnotes:
  - marker: a
    text: Or 'are in no little glory.' The Greek uses a litotes, an understated way of expressing significant honor.
    reason: lexical_alternative
  - marker: b
    text: '''According to the flesh'' likely refers to Jesus'' descent in human lineage from the patriarchal line, especially Judah; compare similar early Christian genealogical language.'
    reason: cross_reference
  - marker: c
    text: Some may prefer 'Christ Jesus' here. We render Χριστῷ as 'Messiah' where the title's meaning remains active.
    reason: lexical_alternative
  - marker: d
    text: Or 'Whoever sincerely considers each thing one by one will recognize'.
    reason: previous_rendering
  - marker: e
    text: Or 'according to Judah'.
    reason: previous_rendering
translation:
  language: ko
  text: 만일 누가 각각의 것을 하나하나 진실하게 살펴본다면, 그분께서 주신 선물들의 위대함을 깨닫게 될 것입니다. 그분에게서 제사장들과 레위인들, 곧 하나님의 제단에서 봉사하는 모든 이들이 나왔습니다. 그분에게서 육신에 따른 주 예수께서 나왔습니다. 그분에게서 유다에 따른 왕들과 통치자들과 지도자들이 나왔습니다. 그리고 그분의 나머지 지파들도 작은 영광에 있는 것이 아니니, 이는 하나님께서 약속하시기를 “너의 씨는 하늘의 별들과 같을 것이다”라고 하셨기 때문입니다. 그러므로 그들 모두는 자기들로 말미암아도, 자기들의 행위로 말미암아도, 또는 그들이 행한 의로운 행위로 말미암아도 높임을 받은 것이 아니라, 오직 그분의 뜻으로 말미암아 영광을 받고 크게 되었습니다. 이와 같이 우리도 그분의 뜻으로 말미암아 메시아 예수 안에서 부르심을 받았으므로, 우리 자신으로 말미암아 의롭다 하심을 받는 것이 아니며, 우리의 지혜나 깨달음이나 경건이나, 또 마음의 거룩함 가운데서 우리가 행한 일들로 말미암는 것도 아니라, 믿음을 통해서입니다. 그 믿음을 통해 전능하신 하나님께서는 처음부터 있어 온 모든 사람을 의롭다 하셨습니다. 그분께 영광이 영원무궁토록 있기를 빕니다. 아멘.[a][b][c][d][e]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰλικρινῶς κατανοήσῃ
  english_pob_choice: sincerely considers each thing one by one
  chosen_korean: 각각의 것을 하나하나 진실하게 살펴본다면
  alternatives_korean:
  - 성실하게 하나하나 살펴본다면
  - 진심으로 각 항목을 검토한다면
  lexicon: LSJ / BDAG
  rationale: εἰλικρινῶς의 투명하고 진실한 태도와 κατανοήσῃ의 주의 깊은 숙고를 함께 살리기 위해 ‘진실하게 살펴본다면’으로 옮겼습니다.
- source_word: μεγαλεῖα
  english_pob_choice: the greatness
  chosen_korean: 위대함
  alternatives_korean:
  - 큰 일들
  - 위대한 것들
  lexicon: LSJ
  rationale: 문맥상 개별 사건보다 하나님이 주신 선물들의 크고 놀라운 성격을 가리키므로, 추상 명사 ‘위대함’이 가장 자연스럽습니다.
- source_word: λειτουργοῦντες τῷ θυσιαστηρίῳ
  english_pob_choice: minister at the altar
  chosen_korean: 하나님의 제단에서 봉사하는
  alternatives_korean:
  - 하나님의 제단에서 섬기는
  - 하나님의 제단에서 예배를 드리는
  lexicon: BDAG
  rationale: λειτουργέω의 공적·제의적 봉사 성격을 살리면서도 한국어에서 너무 제의적 전문용어로 굳어지지 않게 ‘봉사하는’으로 옮겼습니다.
- source_word: τὸ κατὰ σάρκα
  english_pob_choice: according to the flesh
  chosen_korean: 육신에 따른
  alternatives_korean:
  - 육신을 따라
  - 육체에 따른
  lexicon: BDAG
  rationale: 예수의 인격을 육체적 계보와 연결하는 고전적 표현을 유지하기 위해 직역에 가까운 ‘육신에 따른’을 선택했습니다.
- source_word: κατὰ τὸν Ἰούδαν
  english_pob_choice: according to Judah
  chosen_korean: 유다에 따른
  alternatives_korean:
  - 유다의 계열에
  - 유다 지파에 따른
  lexicon: BDAG
  rationale: 족보적·계열적 관계를 드러내기 위해 ‘유다에 따른’으로 직행하되, 해설 없이도 유다 지파 계보를 떠올릴 수 있게 했습니다.
- source_word: σκῆπτρα
  english_pob_choice: remaining tribes
  chosen_korean: 나머지 지파들
  alternatives_korean:
  - 남은 홀들
  - 남은 통치권들
  lexicon: LSJ
  rationale: 문맥상 실제 홀보다 이스라엘의 지파 단위를 가리키므로, POB의 해석을 따라 ‘나머지 지파들’로 옮겼습니다.
- source_word: δικαιούμεθα / ἐδικαίωσεν
  english_pob_choice: are justified / justified
  chosen_korean: 의롭다 하심을 받는 것이 아니며 / 의롭다 하셨습니다
  alternatives_korean:
  - 의롭다 함을 받는 것이 아니며 / 의롭다 하셨습니다
  - 의롭게 되는 것이 아니며 / 의롭게 하셨습니다
  lexicon: BDAG
  rationale: 한국어 교회 전통과의 연속성 및 법정적 선언의 힘을 살리기 위해 ‘의롭다 하심’ 표현을 유지했습니다.
- source_word: πίστεως
  english_pob_choice: faith
  chosen_korean: 믿음
  alternatives_korean:
  - 신뢰
  - 신실함
  lexicon: BDAG
  rationale: 프로젝트 기본값에 따라 πίστις는 ‘믿음’으로 옮겨, 이후 신학 논의에서 행위와의 관계를 분리해 다룰 수 있도록 했습니다.
- source_word: παντοκράτωρ
  english_pob_choice: Almighty
  chosen_korean: 전능하신
  alternatives_korean:
  - 만유를 다스리시는
  - 전능한
  lexicon: BDAG
  rationale: 성경적 표준 표현을 따르면서도 현대 한국어 문장 흐름에 맞게 형용사형으로 자연스럽게 처리했습니다.
- source_word: Χριστῷ Ἰησοῦ
  english_pob_choice: Messiah Jesus
  chosen_korean: 메시아 예수
  alternatives_korean:
  - 그리스도 예수
  - 기름부음 받은 예수
  lexicon: BDAG
  rationale: Χριστός의 титул적 의미를 살려 프로젝트 기본값인 ‘메시아’로 옮겼습니다.
theological_decisions:
- issue: ‘육신에 따른’과 유다 계보 표현의 범위
  chosen_reading: 예수의 역사적·족보적 계보를 가리키되, 표현 자체는 ‘육신에 따른’으로 남겨 성육신과 혈통적 연관을 함께 열어 둡니다.
  alternative_readings:
  - 단순히 인간성을 뜻한다
  - 오로지 유다 지파 혈통만을 뜻한다
  rationale: τὸ κατὰ σάρκα와 κατὰ τὸν Ἰούδαν이 병렬로 놓여 있어, 하나는 더 넓은 ‘육신’ 표현이고 다른 하나는 더 구체적인 유다 계열 지시로 읽는 것이 자연스럽습니다. 둘을 과도하게 하나로 평면화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it.'
- issue: 믿음과 의롭다 하심의 관계
  chosen_reading: 의롭다 하심은 인간의 지혜·경건·행위가 아니라 믿음을 통해 주어지며, 하나님의 주권적 뜻이 그 배경을 이룹니다.
  alternative_readings:
  - 믿음 대신 충성/신실함이 핵심이다
  - 행위 강조를 우회한 단순 겸손 권면이다
  rationale: 본문은 자기 행위 배제와 믿음을 통한 의롭다 하심을 분명히 말하므로, 이를 윤리적 겸손만으로 약화시키지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: contested terms πίστις; preserve theological tension without erasing lexical force.'
