base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054.yaml
  text: Who then among you is noble? Who is compassionate? Who is full of love? Let him say[a], ‘If because of me there are faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah be at peace with the elders who have been appointed.’ The one who has done this will obtain for himself great honor in Messiah, and every place will receive him. For the earth is the Lord’s, and its fullness[f][e][d][c][b]. These things those who live the unregretted way of life of God have done and will do.
  footnotes:
  - marker: a
    text: Or 'schisms' for 'divisions'; the Greek term can carry specifically ecclesial overtones.
    reason: lexical_alternative
  - marker: b
    text: '''The multitude'' may refer to the gathered congregation or the larger body of believers, not merely a crowd in the modern sense.'
    reason: cultural_note
  - marker: c
    text: Psalm 24:1.
    reason: cross_reference
  - marker: d
    text: The phrase 'the unrepented citizenship of God' is difficult. Possible senses include 'the irrevocable commonwealth of God' or 'the way of life in God's commonwealth that brings no regret.'
    reason: lexical_alternative
  - marker: e
    text: Or 'fully assured in love'.
    reason: previous_rendering
  - marker: f
    text: Or 'the unrepented citizenship of God'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 여러분 가운데 누가 고귀합니까? 누가 동정심이 많습니까? 누가 사랑이 충만합니까? 그가 말해야 합니다. 「내 탓으로 분열과 다툼과 갈라짐이 있다면, 나는 물러나고 떠나서 여러분이 원하는 어디로든 가겠습니다. 그리고 나는 무리가 명령하는 것을 따르겠습니다. 다만 메시아의 양 떼만은 임명된 장로들과 함께 평화를 누리게 하십시오.」 이 일을 행한 사람은 메시아 안에서 자기에게 큰 명예를 얻게 될 것이며, 어느 곳이든 그를 받아들일 것입니다. 땅과 그 안에 가득한 모든 것이 주님의 것이기 때문입니다. 하나님이 후회하지 않으시는 삶의 방식을 살아가는 사람들은 이런 일들을 해 왔고, 또 그렇게 할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναῖος
  english_pob_choice: noble
  chosen_korean: 고귀합니까
  alternatives_korean:
  - 고결합니까
  - 기품이 있습니까
  lexicon: LSJ
  rationale: 사회적 신분보다 도덕적·인격적 탁월함을 묻는 수사적 질문이므로, 한국어에서는 ‘고귀하다’가 가장 자연스럽고 격조를 살립니다.
- source_word: εὔσπλαγχνος
  english_pob_choice: compassionate
  chosen_korean: 동정심이 많습니까
  alternatives_korean:
  - 긍휼이 많습니까
  - 자비롭습니까
  lexicon: LSJ
  rationale: 내장/마음의 깊은 연민을 가리키는 표현이라서, 현대 한국어에서는 ‘동정심이 많다’가 감정의 뉘앙스를 잘 살립니다.
- source_word: πεπληροφορημένος ἀγάπης
  english_pob_choice: full of love
  chosen_korean: 사랑이 충만합니까
  alternatives_korean:
  - 사랑으로 충만합니까
  - 사랑으로 가득합니까
  lexicon: LSJ
  rationale: 완료 분사와 속격의 결합이 사랑으로 형성된/가득 찬 상태를 가리키므로, 한국어에서는 상태를 드러내는 ‘충만하다’가 무난합니다.
- source_word: σχίσματα
  english_pob_choice: divisions
  chosen_korean: 갈라짐
  alternatives_korean:
  - 분열
  - 분리
  lexicon: LSJ
  rationale: 교회적 균열을 뜻하지만, 현행 한국어에서 ‘갈라짐’은 관계의 파열과 공동체 분리를 직접 드러내어 문맥에 잘 맞습니다.
- source_word: τὸ ποίμνιον τοῦ Χριστοῦ
  english_pob_choice: the flock of Messiah
  chosen_korean: 메시아의 양 떼
  alternatives_korean:
  - 그리스도의 양 떼
  - 메시아의 무리
  lexicon: LSJ
  rationale: ποιμνίον의 목자-양 비유를 그대로 살리고, Χριστός는 프로젝트 원칙에 따라 ‘메시아’로 옮겼습니다.
- source_word: τοῦ πλήθους
  english_pob_choice: the multitude
  chosen_korean: 무리가
  alternatives_korean:
  - 회중이
  - 큰 무리가
  lexicon: LSJ
  rationale: πλῆθος의 기본 의미를 유지하되, 한국어 문장에서는 자연스럽게 주어화하여 ‘무리가’로 처리했습니다.
- source_word: πρεσβυτέρων
  english_pob_choice: elders who have been appointed
  chosen_korean: 임명된 장로들
  alternatives_korean:
  - 세워진 장로들
  - 세운 장로들
  lexicon: LSJ
  rationale: 교회 질서의 맥락에서 연장자보다 직분적 의미가 분명하므로 ‘장로들’이 적절하고, 수동적 뉘앙스는 ‘임명된’으로 살렸습니다.
- source_word: κλέος
  english_pob_choice: honor
  chosen_korean: 명예
  alternatives_korean:
  - 영예
  - 영광
  lexicon: LSJ
  rationale: 자기 과시적 ‘영광’보다 공동체가 인정하는 ‘명예’가 문맥의 칭찬 어조에 더 잘 맞습니다.
- source_word: πολιτευόμενοι τὴν ἀμεταμέλητον πολιτείαν τοῦ θεοῦ
  english_pob_choice: those who live the unregretted way of life of God
  chosen_korean: 하나님이 후회하지 않으시는 삶의 방식을 살아가는 사람들
  alternatives_korean:
  - 하나님의 후회 없는 시민권을 살아가는 사람들
  - 하나님의 돌이킬 수 없는 공동생활을 사는 사람들
  lexicon: LSJ
  rationale: πολιτεύεσθαι의 시민적/삶의 방식 뉘앙스를 살리면서도, ἀμεταμέλητος의 ‘후회하지 않으시는’ 의미를 한국어로 자연스럽게 드러내기 위해 이렇게 옮겼습니다.
theological_decisions:
- issue: Χριστοῦ의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 단락에서 Χριστός는 호칭적 의미가 살아 있으므로, 프로젝트 기준에 따라 ‘메시아’로 일관했습니다.
  doctrine_reference: Translate titles; transliterate names.
- issue: ἀμεταμέλητον πολιτείαν τοῦ θεοῦ의 난해한 표현
  chosen_reading: 하나님이 후회하지 않으시는 삶의 방식
  alternative_readings:
  - 하나님의 후회 없는 시민권
  - 하나님의 돌이킬 수 없는 삶의 방식
  rationale: 정치적·시민적 은유를 완전히 지우지 않으면서도 한국어에서 오해를 줄이기 위해, ‘시민권’ 대신 보다 중립적인 ‘삶의 방식’을 택했습니다.
  doctrine_reference: Preserve theological tension rather than over-smoothing.
