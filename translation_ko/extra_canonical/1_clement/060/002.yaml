base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/002.yaml
  text: Do not count every sin of your servants and maidservants[a], but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers.
  footnotes:
  - marker: a
    text: Or 'Do not count every sin of your male slaves and female slaves against them'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 종들과 여종들의 모든 죄를 헤아리지 마십시오. 오히려 당신의 진리로 우리를 깨끗하게 하시고, 우리의 걸음을 곧게 하셔서 마음의 거룩함 안에서 걷고, 당신 앞과 우리의 통치자들 앞에서 선하고 기쁜 일들을 행하게 하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ λογίσῃ πᾶσαν ἁμαρτίαν
  english_pob_choice: Do not count every sin
  chosen_korean: 모든 죄를 헤아리지 마십시오
  alternatives_korean:
  - 모든 죄를 계산하지 마십시오
  - 어떤 죄도 기록하지 마십시오
  lexicon: λογίζομαι; πᾶς
  rationale: 부정문+πᾶσαν은 ‘아무 죄도/모든 죄를’의 의미로 이해하는 것이 source-grounded하므로, ‘헤아리다’로 회계적·판정적 뉘앙스를 살렸습니다.
- source_word: δούλων σου καὶ παιδισκῶν
  english_pob_choice: your servants and maidservants
  chosen_korean: 당신의 종들과 여종들
  alternatives_korean:
  - 당신의 노예들과 여노예들
  - 당신의 남종들과 여종들
  lexicon: δοῦλος; παιδίσκη
  rationale: 1 Clement의 LXX적 기도문 문맥에서는 ‘종/여종’이 가장 자연스럽고, POB의 문체도 이를 유지하되 종속 상태를 과도하게 현대화하지 않도록 했습니다.
- source_word: καθαρισμὸν τῆς σῆς ἀληθείας
  english_pob_choice: the cleansing of your truth
  chosen_korean: 당신의 진리로 우리를 깨끗하게 하시고
  alternatives_korean:
  - 당신의 진리의 깨끗하게 하심으로
  - 당신의 진리의 정결로
  lexicon: καθαρισμός; ἀλήθεια
  rationale: 직역적 명사구보다 한국어 기도문답게 동사화하여, ‘진리’가 수단/매개로 작동하는 점을 분명히 했습니다.
- source_word: κατεύθυνον τὰ διαβήματα ἡμῶν
  english_pob_choice: direct our steps
  chosen_korean: 우리의 걸음을 곧게 하셔서
  alternatives_korean:
  - 우리의 발걸음을 인도하셔서
  - 우리의 걸음을 바르게 하셔서
  lexicon: κατευθύνω; διαβήματα
  rationale: ‘steps’를 한국어 관용에 맞게 ‘걸음’으로 옮기고, ‘곧게 하다’로 방향을 바로잡는 의미를 살렸습니다.
theological_decisions:
- issue: κληρονομική/공적 기도 문맥에서의 ‘여종들’ 표현과 사회적 함의
  chosen_reading: ‘여종들’로 번역하되, 본문이 실제로 종속된 여성 종들을 함께 포함하는 공적 기도문임을 드러냈습니다.
  alternative_readings:
  - ‘여자 종들’
  - ‘여종노릇하는 자들’
  rationale: 본문은 가정적 소속이 아니라 공동체 전체의 기도이며, 그리스어의 남성/여성 종을 병기한 구조를 그대로 반영하는 것이 source에 충실합니다.
  doctrine_reference: LXX-형 기도문, 사회적 실재를 지우지 않는 번역 원칙
