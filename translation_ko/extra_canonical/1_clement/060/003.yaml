id: 1CLEM.60.3
reference: 1 Clement 60:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/003.yaml
  text: Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your exalted arm, and rescue us from those who hate us unjustly.
translation:
  language: ko
  text: 예, 주재님, 평화 가운데 우리 위에 선하게 당신의 얼굴을 비추어 주시어, 우리가 당신의 강한 손의 보호를 받고 당신의 높으신 팔로 모든 죄에서 건짐을 받게 하시며, 우리를 부당하게 미워하는 자들에게서 우리를 구해 주소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주인님
  alternatives_korean:
  - 주님
  - 주인
  lexicon: δέσποτα
  rationale: 호칭의 직접성을 살리되 한국어 기도문에서 자연스러운 존칭으로 옮겼습니다. 본문은 하나님께 드리는 간청이지만, 기존 POB의 Master를 반영해 주님보다 더 관계적·주종적 뉘앙스를 남겼습니다.
- source_word: ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς
  english_pob_choice: make your face shine upon us
  chosen_korean: 당신의 얼굴을 우리에게 비추어 주셔서
  alternatives_korean:
  - 당신의 얼굴이 우리 위에 빛나게 하셔서
  - 얼굴의 빛을 우리 위에 비추어 주셔서
  lexicon: ἐπιφαίνω / πρόσωπον
  rationale: 직역적인 ‘얼굴이 빛나다’보다 한국어에서 의미가 분명한 ‘비추다’를 사용해 축복/은총의 관용구를 살렸습니다. ‘우리에게’는 ἐφ’ ἡμᾶς의 방향성을 반영합니다.
- source_word: τῇ χειρί σου τῇ κραταιᾷ
  english_pob_choice: your mighty hand
  chosen_korean: 당신의 강한 손
  alternatives_korean:
  - 당신의 능한 손
  - 당신의 강력한 손
  lexicon: χείρ / κραταιός
  rationale: κραταιᾷ는 단순한 세기보다 힘의 우세를 나타내므로 ‘강한’으로 옮겼습니다. 한국어 기도문에서 익숙하지만 낡지 않은 표현을 택했습니다.
- source_word: τῷ βραχίονί σου τῷ ὑψηλῷ
  english_pob_choice: your exalted arm
  chosen_korean: 당신의 높으신 팔
  alternatives_korean:
  - 당신의 높이 들린 팔
  - 당신의 높여진 팔
  lexicon: βραχίων / ὑψηλός
  rationale: latest revision의 ‘exalted arm’을 반영해 ὑψηλός의 위엄·높은 지위를 살렸습니다. ‘팔’은 구원 능력의 상징으로 자연스럽게 유지했습니다.
- source_word: ἀδίκως
  english_pob_choice: unjustly
  chosen_korean: 부당하게
  alternatives_korean:
  - 억울하게
  - 불의하게
  lexicon: ἀδίκως
  rationale: ‘불의하게’는 도덕적 평가가 강하고, ‘억울하게’는 피해자의 감정을 지나치게 전면화할 수 있어, 원문의 행위 방식에 가까운 ‘부당하게’를 택했습니다.
theological_decisions:
- issue: 하나님께 드리는 간구에서의 호칭과 존칭 수준
  chosen_reading: 직접 기도문의 어조를 유지하면서도 한국어에서는 ‘주인님’과 명령형 간구 ‘-하소서/-주소서’를 사용했습니다.
  alternative_readings:
  - ‘주님’으로 완화
  - 평서형 청원으로 중화
  rationale: 본문은 긴급한 청원과 직접 호칭이 결합된 기도문이므로, 존칭을 유지하되 종속성과 간구의 절박함이 드러나도록 했습니다.
  doctrine_reference: 기도문 문체와 성경적 간구의 직접 호칭
- issue: ‘모든 죄’의 범위
  chosen_reading: καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας를 ‘모든 죄에서 건져지며’로 직결했습니다.
  alternative_readings:
  - ‘모든 죄책에서’
  - ‘모든 잘못에서’
  rationale: ἁμαρτία를 도덕적·영적 죄로 유지하는 것이 본문의 구원 요청과 가장 직접적으로 맞습니다. 죄책으로 옮기면 결과 상태를 과도하게 해석할 수 있습니다.
  doctrine_reference: 죄와 구원, 정결의 언어
