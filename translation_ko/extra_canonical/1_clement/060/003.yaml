  to: 예, 주재님, 평화 가운데 우리 위에 선하게 당신의 얼굴을 비추어 주시어, 우리가 당신의 강한 손의 보호를 받고 당신의 높으신 팔로 모든 죄에서 건짐을 받게 하시며, 우리를 부당하게 미워하는 자들에게서 우리를 구해 주소서.
