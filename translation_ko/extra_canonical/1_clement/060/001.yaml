  source_fidelity: 원문의 호격과 2인칭 기도 형식, 찬양의 술어 열거, 그리고 용서 청원은 대체로 잘 반영했습니다. 다만 διὰ τῶν ἐνεργουμένων은 단순한 ‘일하심’보다 하나님께서 행하신 일들을 가리키며, ἑδράσαι는 이미 생겨난 것들을 ‘굳게 세우다/견고하게 하다’라는 뜻입니다. 또한 οἰκουμένη는 ‘거주하는 땅’보다 ‘사람이 사는 세상’이 자연스럽고 의미상 정확합니다.
