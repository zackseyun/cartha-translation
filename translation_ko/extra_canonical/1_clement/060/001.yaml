base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/001.yaml
  text: For you have made manifest the everlasting order of the world through your workings. You, Lord, created the inhabited earth, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you. O merciful and compassionate one, forgive us our lawless deeds and our unrighteous acts and our trespasses and failings.
  footnotes:
  - marker: a
    text: Or 'trust in you, merciful and compassionate. Forgive us'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님, 주님께서는 행하신 일들을 통하여 세상의 영원한 질서를 드러내셨습니다. 주님, 주님께서는 사람이 사는 세상을 창조하셨습니다. 주님은 모든 세대에 걸쳐 신실하시고, 심판에 의로우시며, 권능과 위엄에 놀라우시고, 창조하심에 지혜로우시며, 생겨난 것들을 굳게 세우심에 분별력이 있으시고, 보이는 것들 안에서 선하시며, 주님께 의지하는 이들에게 신실하신 분이십니다. 자비롭고 긍휼이 많으신 분이여, 우리의 불법과 불의와 범과와 과실을 용서해 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “주님께 의지하는 이들에게 신실하시며, 자비롭고 긍휼이 많으신 분이여, 용서해 주십시오.”
    reason: 영어 POB 감사 이력에 보존된 이전 구두점 처리에 관한 대안 번역을 한국어로 제시합니다. 본문의 채택 번역은 그리스어 호격 ἐλεῆμον καὶ οἰκτίρμον을 용서 청원의 직접 호칭으로 처리합니다.
lexical_decisions:
- source_word: ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς / ὁ ἀγαθὸς / πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ
  english_pob_choice: faithful throughout all generations / good in the things that are seen / faithful toward those who have put their trust in you
  chosen_korean: 신실하시며 / 선하시고 / 주님께 의지하는 이들에게 신실하십니다
  alternatives_korean:
  - 믿음직하시며 / 좋으시고 / 주님을 신뢰하는 이들에게 믿음직하십니다
  - 충실하시며 / 선하시오며 / 주님께 भरो...
  lexicon: πίστος / ἀγαθός
  rationale: 문맥상 하나님의 지속적 신뢰성과 선하심을 함께 살려야 하므로 ‘신실하시다’와 ‘선하시다’로 구분해 옮겼습니다.
- source_word: τὴν οἰκουμένην
  english_pob_choice: the inhabited earth
  chosen_korean: 거주하는 땅
  alternatives_korean:
  - 온 땅
  - 세상
  lexicon: οἰκουμένη
  rationale: 단순한 ‘세상’보다 사람이 거주하는 세계라는 뉘앙스를 살리기 위해 ‘거주하는 땅’으로 옮겼습니다.
- source_word: τὰς ἀνομίας ... τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας
  english_pob_choice: our lawless deeds and our unrighteous acts and our trespasses and failings
  chosen_korean: 우리의 불법과 불의와 잘못과 허물
  alternatives_korean:
  - 우리의 율법 없는 행위와 불의와 범과와 실수
  - 우리의 불법 행위와 불의한 행위와 허물과 실수
  lexicon: ἀνομία / ἀδικία / παράπτωμα / πλημμέλεια
  rationale: 네 개의 죄목을 각각 구별하되, 한국어에서 과도하게 중복되거나 종교어화되지 않도록 ‘불법, 불의, 잘못, 허물’로 간결하게 대응했습니다.
- source_word: ἐλεῆμον καὶ οἰκτίρμον
  english_pob_choice: O merciful and compassionate one
  chosen_korean: 자비롭고 긍휼이 많으신 분이여
  alternatives_korean:
  - 자비롭고 불쌍히 여기시는 분이여
  - 자비와 긍휼이 풍성하신 분이여
  lexicon: vocative adjectives
  rationale: 그리스어에서 호격으로 주님께 직접 호소하는 전환이므로, 앞 문장의 서술어에서 분리해 직접 호칭 형태로 옮겼습니다.
theological_decisions:
- issue: ‘주님’의 호칭과 직접 기도문 형식
  chosen_reading: 본문 전체를 하나님께 드리는 직접 기도로 읽고, 한국어에서는 주님을 반복 호칭하여 청원문의 경건한 호흡을 유지했습니다.
  alternative_readings:
  - 서술문처럼 평서로 처리
  - 호칭을 한 번만 두고 뒤를 서술적으로 번역
  rationale: 본문은 찬양에서 청원으로 넘어가는 기도문이며, 그리스어의 2인칭 직접주소와 호격이 이를 분명히 하므로 한국어도 기도체를 유지해야 합니다.
  doctrine_reference: liturgical register; Greek vocative and imperative structure
- issue: ‘ἄφες ἡμῖν’의 청원 강도
  chosen_reading: ‘용서해 주십시오’로 옮겨, 단순 정보 전달이 아니라 간청의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 용서하십시오
  - 사하여 주십시오
  rationale: 본문의 aorist imperative는 정중하지만 분명한 요청이므로, 현대 합쇼체 기도문에 맞는 ‘주십시오’ 형식이 가장 자연스럽습니다.
  doctrine_reference: imperative prayer register
