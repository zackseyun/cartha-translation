  terminology: ‘신실하시다’, ‘선하시다’, ‘자비롭고 긍휼이 많으신 분이여’는 적절합니다. 죄목 네 항목은 원문의 열거를 보존하도록 ‘불법, 불의, 범과, 과실’로 구별했습니다. 기존 [a] 앵커에는 한국어 각주가 없으므로, 영어 감사 이력의 각주를 한국어로 제공했습니다.
