base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060/004.yaml
  text: Give harmony and peace to us and to all who dwell on the earth[a], just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.
  footnotes:
  - marker: a
    text: Or 'Give harmony and peace to us and to all who dwell on the earth, just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name, and to our rulers and leaders upon the earth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리와 땅에 사는 모든 사람에게 조화를 주시고 평강을 주십시오. 옛 우리 조상들에게 그들이 거룩함과 믿음과 진리 가운데서 주님을 부르며, 전능하시고 모든 덕이 충만하신 주님의 이름에 순종하게 하셨던 것처럼 그렇게 하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὸς ὁμόνοιαν
  english_pob_choice: Give harmony
  chosen_korean: 조화를 주시고
  alternatives_korean:
  - 화합을 주시고
  - 일치를 주시고
  - 화목을 주시고
  lexicon: ὁμόνοια
  rationale: 1 Clement에서 ὁμόνοια는 단순한 감정적 친화보다 공동체적·공적 질서의 ‘조화’를 가리키므로, POB의 최신 영어 선택을 따라 자연스러운 표준어로 옮겼습니다.
- source_word: καὶ εἰρήνην
  english_pob_choice: and peace
  chosen_korean: 평강을 주십시오
  alternatives_korean:
  - 평화를 주십시오
  - 안녕을 주십시오
  lexicon: εἰρήνη
  rationale: 교회 문맥에서 εἰρήνη는 단순한 전쟁 부재보다 하나님의 복된 평안을 포함하므로, 본 프로젝트 기본어인 ‘평강’을 유지했습니다.
- source_word: τοῖς κατοικοῦσιν τὴν γῆν
  english_pob_choice: who dwell on the earth
  chosen_korean: 땅에 사는 모든 사람
  alternatives_korean:
  - 땅에 거주하는 모든 이
  - 세상에 사는 모든 사람
  lexicon: κατοικοῦσιν τὴν γῆν
  rationale: 직역을 유지하되 한국어에서 자연스럽게 들리도록 ‘땅에 사는’으로 옮기고, 범위를 분명히 하려고 ‘모든 사람’을 보탰습니다.
- source_word: ἐπικαλουμένων σε αὐτῶν ... ὑπηκόους γινομένους
  english_pob_choice: when they called upon you ... becoming obedient
  chosen_korean: 그들이 거룩함과 믿음과 진리 가운데서 주님을 부르며, ... 순종하게 하셨던 것처럼
  alternatives_korean:
  - 그들이 ... 당신을 부르며 ... 복종하게 되도록
  - 그들이 ... 주님께 간구하며 ... 순종하는 자가 되도록
  lexicon: ἐπικαλουμένων / ὑπηκόους γινομένους
  rationale: 분사 구조를 살려 ‘부르며’와 ‘순종하게 하셨던 것처럼’으로 연결해, 조상들이 하나님을 부른 결과 순종에 이른다는 문맥을 드러냈습니다.
theological_decisions:
- issue: 1인칭 청원과 조상들에 대한 비교절의 관계
  chosen_reading: ‘우리와 ...에게 조화를 주십시오’가 주절이고, ‘옛 우리 조상들에게 ... 하셨던 것처럼’은 비교절로 처리했습니다.
  alternative_readings:
  - ‘우리와 ... 조화를 주시며 ...’로 이어지는 연속 청원
  - 조상들이 아니라 현재 청원자들이 순종하는 것으로 읽는 해석
  rationale: 그리스어 분사와 비교절 구조는 조상들을 수식하는 삽입절이므로, 청원 대상인 ‘우리’를 중심으로 한국어 문장을 재구성해야 문법과 논리가 맞습니다.
  doctrine_reference: 문법-의미 일치, 비교절 처리
- issue: ὁσίως ἐν πίστει καὶ ἀληθείᾳ의 종교적 어조
  chosen_reading: ‘거룩함과 믿음과 진리 가운데서’로 비교적 직역했습니다.
  alternative_readings:
  - ‘경건함으로, 믿음과 진리로’
  - ‘성결과 믿음과 진실 가운데서’
  rationale: ὁσίως를 단순한 예절이 아니라 하나님 앞에서의 거룩한 태도로 보아 ‘거룩함’으로 옮겨, 뒤의 ‘믿음과 진리’와 함께 조상들의 기도 자세를 보존했습니다.
  doctrine_reference: 경건/거룩의 어휘 유지
