  rationale: 원문의 비교절은 조상들이 하나님을 부르던 때에 그들에게 조화와 평강을 주신 일을 회고합니다. 이어지는 대격 분사는 현재 청원자들이 하나님의 이름과 세상 통치자들에게 순종하게 되기를 구하는 말로 번역했습니다. 한국어에서는 이 관계를 정확하고 자연스럽게 드러내기 위해 두 문장으로 나누었고, 대안적 연결 가능성은 각주로 보존했습니다.
