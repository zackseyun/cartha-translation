- from: 우리와 땅에 사는 모든 사람에게 조화를 주시고 평강을 주십시오. 옛 우리 조상들에게 그들이 거룩함과 믿음과 진리 가운데서 주님을 부르며, 전능하시고 모든 덕이 충만하신 주님의 이름에 순종하게 하셨던 것처럼 그렇게 하십시오.[a]
