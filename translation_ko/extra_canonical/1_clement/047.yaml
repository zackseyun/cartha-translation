  text: Ἀναλάβετε τὴν ἐπιστολὴν τοῦ μακαρίου Παύλου τοῦ ἀποστόλου. 2. τί πρῶτον ὑμῖν ἐν ἀρχῇ τοῦ εὐαγγελίου ἔγραψεν; . ἐπ’ ἀληθείας πνευματικῶς ἐπέστειλεν ὑμῖν περὶ ἑαυτοῦ τε καὶ Κηφᾶ τε καὶ Ἀπολλώ, διὰ τὸ καὶ τότε προσκλίσεις ὑμᾶς πεποιῆσθαι. 4. ἀλλ’ ἡ πρόσκλισις ἐκείνη ἧσσον ἁμαρτίαν ὑμῖν προσήνεγκεν· προσεκλίθητε γὰρ ἀποστόλοις μεμαρτυρημένοις καὶ ἀνδρὶ δεδοκιμασμένῳ παρ’ αὐτοῖς. 5. νυνὶ δὲ κατανοήσατε, τίνες ὑμᾶς διέστρεψαν καὶ τὸ σεμνὸν τῆς περιβοήτου φιλαδελφίας ὑμῶν ἐμείωσαν. 6. αἰσχρά, ἀγαπητοί, καὶ λίαν αἰσχρὰ καὶ ἀνάξια τῆς ἐν Χριστῷ ἀγωγῆς ἀκούεσθαι, τὴν βεβαιοτάτην καὶ ἀρχαίαν Κορνθίων ἐκκλησίαν δι’ ἓν ἢ δύο πρόσωπα στασιάζειν πρὸς τοὺς πρεσβυτέρους. 7. καὶ ἡ ἀκοὴ οὐ μόνον εἰς ἡμᾶς ἐχώρησεν, ἀλλὰ καὶ εἰς τοὺς ἑτεροκλινεῖς ὑπάρχοντας ἀφ’ ἡμῶν, ὥστε καὶ βλασφημίας ἐπιφέρεσθαι τῷ ὀνόματι κυρίου διὰ τὴν ὑμετέραν ἀφροσύνην, ἑαυτοῖς δὲ κίνδυνον ἐξεργάζεσθαι.
  language: Greek
  pages:
  - 321
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/047.yaml
  text: Take up the letter of the blessed Paul the apostle[a]. What did he first write to you at the beginning of the gospel? In truth, he wrote to you spiritually about himself and Cephas and Apollos, because even then you had formed factions. But that factionalism brought less sin upon you; for you had aligned yourselves with apostles of approved testimony, and with a man approved by them. But now consider who it is that has perverted you and diminished the dignity of your widely spoken-of brotherly love. It is shameful, beloved—very shameful, and unworthy of conduct in Messiah—that it should be heard that the very steadfast and ancient church of the Corinthians is in revolt against the elders because of one or two persons. And this report has reached not only us, but also those who are alienated from us, so that blasphemies are brought upon the name of the Lord because of your foolishness[h][g][f][e][d][c][b], while you also create danger for yourselves.
  footnotes:
  - marker: a
    text: The reference is to Paul's earlier letter to the Corinthians, especially the opening discussion of party divisions (compare 1 Corinthians 1:10–12).
    reason: cross_reference
  - marker: b
    text: Cephas is Peter.
    reason: cultural_note
  - marker: c
    text: Or 'he wrote to you spiritually.' The Greek adverb can be taken more generally, but the main text preserves the likely sense of Spirit-shaped admonition.
    reason: lexical_alternative
  - marker: d
    text: '''Brotherly love'' renders a familial term for mutual affection within the believing community.'
    reason: lexical_alternative
  - marker: e
    text: Or 'is rebelling' / 'is in dissension.' The Greek verb is stronger than a mild disagreement.
    reason: lexical_alternative
  - marker: f
    text: Or 'tested by them'.
    reason: previous_rendering
  - marker: g
    text: Or 'those who are of a different mind from us'.
    reason: previous_rendering
  - marker: h
    text: Or 'work danger for yourselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 사도인 복된 바울의 편지를 받아 보십시오[a]. 그가 복음의 시작에서 여러분에게 맨 먼저 무엇을 썼습니까? 참으로 그는 자기 자신과 게바와 아볼로에 관하여 영으로 여러분에게 편지했습니다[c]. 그때에도 여러분은 파당을 지었기 때문입니다. 그러나 그 파당은 여러분에게 덜한 죄를 가져왔습니다. 왜냐하면 여러분은 입증된 증언을 지닌 사도들과, 그들에 의해 입증된 사람에게 편을 들었기 때문입니다[f]. 그런데 이제는 누가 여러분을 뒤틀어 놓았고, 널리 알려진 여러분의 형제 사랑의 품위를 떨어뜨렸는지 생각해 보십시오[d]. 사랑하는 이들이여, 수치스럽습니다—참으로 몹시 수치스럽고, 메시아 안에서의 행실에 합당하지 않습니다. 코린토스의 그 견고하고도 오래된 회중이 단지 한두 사람 때문에 장로들을 거슬러 반역하고 있다는 말이 들리다니 말입니다[e]. 이 소문은 우리에게만 이른 것이 아니라 우리와 멀어진 사람들에게도 이르러, 여러분의 어리석음 때문에 주님의 이름에 대한 비방이 일어나고 있으며, 여러분 자신에게도 위험을 만들어 내고 있습니다[g][h].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναλάβετε
  english_pob_choice: Take up
  chosen_korean: 받아 보십시오
  alternatives_korean:
  - 들어 보십시오
  - 집어 드십시오
  - 다시 펼쳐 보십시오
  lexicon: LSJ
  rationale: 편지를 실제로 손에 들어 다시 검토하라는 뜻을 살리되, 한국어에서 자연스럽고 공손한 명령형으로 옮겼습니다.
- source_word: πνευματικῶς
  english_pob_choice: spiritually / in the Spirit
  chosen_korean: 영으로
  alternatives_korean:
  - 영적으로
  - 성령 안에서
  lexicon: BDAG
  rationale: 부사 자체의 형식과 1세기 교정적 뉘앙스를 함께 살리기 위해 ‘영으로’로 옮겼습니다.
- source_word: προσκλίσεις / προσεκλίθητε
  english_pob_choice: factions / were aligning yourselves
  chosen_korean: 파당을 지었습니다 / 편을 들었습니다
  alternatives_korean:
  - 분파를 만들었습니다 / 가담했습니다
  - 당파를 지었습니다 / 기울었습니다
  lexicon: LSJ
  rationale: 명사와 동사의 연계를 드러내면서, 분열적 당파 형성을 한국어로 분명하게 표현했습니다.
- source_word: μεμαρτυρημένοις / δεδοκιμασμένῳ
  english_pob_choice: of approved testimony / approved by them
  chosen_korean: 입증된 증언을 지닌 사도들과, 그들에 의해 입증된 사람
  alternatives_korean:
  - 검증된 증언을 지닌 사도들과, 그들에 의해 검증된 사람
  - 인정받은 증언을 지닌 사도들과, 그들이 인정한 사람
  lexicon: BDAG
  rationale: 두 형용사의 반복된 평가 의미를 살려, 단순한 ‘승인’보다 공적 입증과 검증의 뉘앙스를 드러냈습니다.
- source_word: φιλαδελφίας
  english_pob_choice: brotherly love
  chosen_korean: 형제 사랑
  alternatives_korean:
  - 형제애
  - 신자 간 사랑
  lexicon: BDAG
  rationale: 공동체 내부의 가족적 애정을 가리키는 표현을 직역에 가깝게 옮겼습니다.
- source_word: στασιάζειν
  english_pob_choice: is in revolt
  chosen_korean: 반역하고
  alternatives_korean:
  - 내란을 일으키고
  - 분열하고
  lexicon: BDAG
  rationale: 단순한 의견 차이보다 강한 반역적·소요적 의미를 살렸습니다.
- source_word: ἑτεροκλινεῖς ἀφ’ ἡμῶν
  english_pob_choice: those who are alienated from us
  chosen_korean: 우리와 멀어진 사람들
  alternatives_korean:
  - 우리와 다른 생각을 가진 사람들
  - 우리에게서 떨어져 나온 사람들
  lexicon: LSJ
  rationale: 관계적 거리감의 의미를 살리되, 과도하게 신학적·정치적으로 규정하지 않도록 했습니다.
- source_word: κίνδυνον ἐξεργάζεσθαι
  english_pob_choice: create danger for yourselves
  chosen_korean: 여러분 자신에게도 위험을 만들어 내고 있습니다
  alternatives_korean:
  - 여러분 자신에게도 위험을 자초하고 있습니다
  - 여러분 자신에게도 위험을 불러오고 있습니다
  lexicon: BDAG
  rationale: 능동적으로 위험을 산출한다는 뜻을 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: Χριστῷ의 번역
  chosen_reading: 메시아 안에서
  alternative_readings:
  - 그리스도 안에서
  rationale: 이 문맥에서는 칭호 의미가 살아 있으므로 프로젝트 기본어인 ‘메시아’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 야훼/주님의 이름과 비방
  chosen_reading: 주님의 이름에 대한 비방
  alternative_readings:
  - 주님의 이름이 모독을 받음
  - 주님의 이름에 대한 모독
  rationale: 본문의 βλασφημίας를 비방/모독 계열로 자연스럽게 살리되, 여기서는 NT 인용이 아니라 1 Clement의 표현이므로 ‘주님’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve source-level theological force without smoothing tensions.'
