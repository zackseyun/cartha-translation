  text: 질투와 시기로 인해 가장 위대하고 가장 의로운 기둥들은 박해를 받았고, 죽음에 이르기까지 싸웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλον καὶ φθόνον
  english_pob_choice: Because of jealousy and envy
  chosen_korean: 질투와 시기로 인해
  alternatives_korean:
  - 질투와 시기 때문에
  - 질투와 시기 때문에 생겨
  lexicon: ζῆλος / φθόνος
  rationale: 두 명사는 원문의 병렬을 살려 구분해 옮기되, 문맥상 원인 관계를 자연스럽게 드러내는 ‘~로 인해’를 사용했습니다.
- source_word: οἱ μέγιστοι καὶ δικαιότατοι στῦλοι
  english_pob_choice: the greatest and most righteous pillars
  chosen_korean: 가장 크고 가장 의로운 기둥들은
  alternatives_korean:
  - 가장 위대하고 가장 의로운 기둥들은
  - 가장 큰 의인들이
  lexicon: μέγιστος / δικαιότατος / στῦλος
  rationale: ‘기둥들’은 비유를 유지해 지도자적 인물을 가리키는 원문 이미지를 살렸고, δικαιότατοι는 ‘가장 의로운’으로 직역에 가깝게 반영했습니다.
- source_word: ἐδιώχθησαν
  english_pob_choice: were persecuted
  chosen_korean: 박해를 받았고
  alternatives_korean:
  - 박해당했고
  - 쫓김을 받았고
  lexicon: διώκω
  rationale: 수동형의 박해 의미를 현대 문체로 자연스럽게 살렸습니다.
- source_word: ἕως θανάτου ἤθλησαν
  english_pob_choice: struggled even unto death
  chosen_korean: 죽음에 이르기까지 싸웠습니다
  alternatives_korean:
  - 죽기까지 싸웠습니다
  - 죽음에 이르도록 경주했습니다
  lexicon: ἀθλέω
  rationale: ἤθλησαν의 운동/투쟁 비유를 ‘싸우다’로 풀되, ‘죽음에 이르기까지’로 종결 한계를 보존했습니다.
theological_decisions:
- issue: 순교적 투쟁의 비유 유지
  chosen_reading: ‘싸웠습니다’로 번역해 단순한 고난이 아니라 끝까지 견디는 투쟁성을 드러냈습니다.
  alternative_readings:
  - ‘경주했습니다’
  - ‘분투했습니다’
  rationale: ἀθλέω는 경기·투쟁의 이미지를 포함하므로, 한국어에서도 그 긴장감을 살리는 표현이 적절합니다.
