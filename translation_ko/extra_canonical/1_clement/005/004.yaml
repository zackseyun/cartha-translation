  source_fidelity: 원문의 '한 고난도 두 고난도 아니라 많은 고난'이라는 수량 대조에서 πόνους(고난들)를 '번'으로 세면 고난 자체보다 횟수를 세는 뉘앙스가 됩니다. 또한 ὀφειλόμενον은 그에게 마땅히 돌아갈 곳이라는 뜻이므로 '그에게 속한'보다 이를 직접 드러내는 편이 정확합니다.
  naturalness: '''한 가지나 두 가지가 아니라 많은 고난을''은 현대 한국어에서 자연스럽게 원문의 대조를 재현합니다. ''마땅히 그에게 돌아갈 영광의 곳''도 문맥상 자연스럽고 과도한 신학적 해설을 더하지 않습니다.'
  terminology: '''불의한 질투'', ''고난'', ''증언'', ''영광''은 각각 ζῆλος ἄδικος, πόνοι, μαρτυρήσας, δόξα에 충실합니다. μαρτυρήσας를 ''순교하다''로 확대하지 않고 ''증언하고''로 유지했습니다.'
