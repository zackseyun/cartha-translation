id: 1CLEM.5.4
reference: 1 Clement 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Πέτρον, ὃς διὰ ζῆλον ἄδικον οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους, καὶ οὕτω μαρτυρήσας ἐπορεύθη εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/004.yaml
  text: Peter, who because of unrighteous jealousy endured not one or two but many sufferings, and so, having borne witness, went to the glorious place that was due him.
translation:
  language: ko
  text: 베드로는 불의한 질투 때문에 한두 번이 아니라 여러 번의 고난을 견디셨고, 그렇게 증언한 뒤 마땅히 그에게 속한 영광의 자리로 가셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλον ἄδικον
  english_pob_choice: because of unrighteous jealousy
  chosen_korean: 불의한 질투 때문에
  alternatives_korean:
  - 불의한 시기심 때문에
  - 부당한 질투 때문에
  lexicon: διὰ + accusative; ζῆλος; ἄδικος
  rationale: 원문의 원인 표현을 간결하게 살리되, ζῆλον ἄδικον의 도덕적 결함을 '불의한'으로 드러냈습니다.
- source_word: οὐχ ἕνα οὐδὲ δύο, ἀλλὰ πλείονας ὑπήνεγκεν πόνους
  english_pob_choice: not one or two but many sufferings endured
  chosen_korean: 한두 번이 아니라 여러 번의 고난을 견디셨고
  alternatives_korean:
  - 하나도 둘도 아니고 여러 번의 고난을 겪으셨고
  - 한 번도 두 번도 아니라 많은 고난을 받으셨고
  lexicon: οὐχ ἕνα οὐδὲ δύο ... πλείονας; ὑποφέρω; πόνος
  rationale: 헬라어의 관용적 대조를 한국어의 '한두 번'으로 자연스럽게 옮기고, πόνους는 '고난'으로 렌더링해 수난의 강도를 유지했습니다.
- source_word: μαρτυρήσας
  english_pob_choice: having borne witness
  chosen_korean: 증언한 뒤
  alternatives_korean:
  - 증언하고 나서
  - 증언한 후
  lexicon: μαρτυρέω
  rationale: 문맥상 순교적 '증언'의 의미를 살리면서, 뒤따르는 이동 동작과의 시간 관계를 자연스럽게 표현했습니다.
- source_word: εἰς τὸν ὀφειλόμενον τόπον τῆς δόξης
  english_pob_choice: went to the glorious place that was due him
  chosen_korean: 마땅히 그에게 속한 영광의 자리로
  alternatives_korean:
  - 그에게 마땅한 영광의 곳으로
  - 빚진 바 된 영광의 처소로
  lexicon: ὀφείλω; τόπος; δόξα
  rationale: ὀφειλόμενον을 단순한 '도착'이 아니라 '마땅히 받아야 할' 의미로 살리고, τόπος τῆς δόξης는 문맥에 맞게 '영광의 자리'로 옮겼습니다.
theological_decisions:
- issue: 베드로의 죽음/순교를 직접 암시하는 표현
  chosen_reading: '''증언한 뒤''와 ''영광의 자리''를 함께 살려, 순교를 노골적으로 설명하지 않되 수난과 증언이 이어지는 암시를 보존했습니다.'
  alternative_readings:
  - '''순교한 뒤''로 명시함'
  - '''증언을 마친 뒤''로 완화함'
  rationale: 본문은 μαρτυρήσας와 영광의 자리의 결합으로 베드로의 마지막을 암시하므로, 한국어도 과도한 해설 없이 그 긴장을 유지해야 합니다.
  doctrine_reference: 성인의 증언과 고난, 그리고 사후 영광에 대한 초대교회적 기억
