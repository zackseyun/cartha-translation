source:
  edition: Funk 1901 (normalized OCR)
  text: ἑπτάκις δεσμὰ φορέσας, φυγαδευθείς, λιθασθείς, κῆρυξ γενόμενος ἔν τε τῇ ἀνατολῇ καὶ ἐν τῇ δύσει, τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος ἔλαβεν,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/006.yaml
  text: having worn chains seven times, having been driven into exile, having been stoned, having become a herald both in the east and in the west, he received the noble renown of his faith,
translation:
  language: ko
  text: 그는 일곱 번이나 사슬에 매였고, 유배되었으며, 돌에 맞았고, 동쪽과 서쪽에서 선포자가 되어, 그 믿음으로 말미암은 고귀한 명성을 얻었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμὰ φορέσας
  english_pob_choice: having worn chains
  chosen_korean: 사슬을 차고 있었고
  alternatives_korean:
  - 사슬을 지니고 있었고
  - 쇠사슬을 두르고 있었고
  lexicon: δεσμός
  rationale: ‘사슬’은 구속의 상태를 자연스럽게 드러내며, 완료 분사 표현을 한국어 서술로 풀어 합쇼체 문장 흐름에 맞췄습니다.
- source_word: φυγαδευθείς
  english_pob_choice: having been driven into exile
  chosen_korean: 유배되었으며
  alternatives_korean:
  - 추방되었으며
  - 망명하게 되었으며
  lexicon: φυγαδεύω
  rationale: 원문의 외적 강제성을 살리기 위해 ‘유배되다’를 택했고, 영어 POB의 ‘driven into exile’와도 대응합니다.
- source_word: κῆρυξ γενόμενος
  english_pob_choice: having become a herald
  chosen_korean: 전령이 되었으며
  alternatives_korean:
  - 선포자가 되었으며
  - 사자가 되었으며
  lexicon: κῆρυξ
  rationale: κῆρυξ는 단순한 전달자보다 공적 선포자를 뜻하므로, ‘전령’으로 옮겨 공적 선포의 뉘앙스를 유지했습니다.
- source_word: τὸ γενναῖον τῆς πίστεως αὐτοῦ κλέος
  english_pob_choice: the noble renown of his faith
  chosen_korean: 그의 믿음의 고귀한 명성을
  alternatives_korean:
  - 그의 믿음의 고귀한 영예를
  - 그의 믿음의 장한 명성을
  lexicon: κλέος
  rationale: κλέος의 ‘명성/영예’ 의미를 살리되, γενναῖον의 품격을 ‘고귀한’으로 반영해 직역을 과도하게 어색하지 않게 조정했습니다.
theological_decisions:
- issue: ‘동쪽과 서쪽’의 범위 표현
  chosen_reading: 동쪽과 서쪽에서 모두
  alternative_readings:
  - 동방과 서방에서
  - 동쪽과 서쪽에 걸쳐
  rationale: 지리적 총칭을 자연스럽게 전달하는 표현으로, 원문의 양쪽 범위를 평행적으로 유지했습니다.
  doctrine_reference: 문학적 표현의 범위 보존
