  source_fidelity: 원문의 연속된 부정과거 분사들은 바울이 겪은 일을 열거한 뒤, 마지막 주동사 ‘얻었습니다’로 귀결됩니다. 초안의 ‘차고 있었고’는 지속 상태를 강하게 나타내므로, ‘일곱 번이나 사슬에 매였고’로 고쳐 각 사건의 완료된 경험을 자연스럽게 반영했습니다. κῆρυξ는 단순 전달자인 ‘전령’보다 공적으로 알리는 ‘선포자’가 더 정확합니다.
  naturalness: ‘그의 믿음의 고귀한 명성’은 한국어에서 수식 관계가 다소 부자연스럽습니다. ‘그 믿음으로 말미암은 고귀한 명성’은 원문의 τῆς πίστεως 속격과 κλέος의 관계를 자연스럽게 전달합니다.
  terminology: δεσμά는 구금의 사슬을 가리키므로 ‘사슬에 매이다’가 적절합니다. φυγαδευθείς는 강제로 내쫓김을 뜻하므로 ‘유배되었으며’를 유지할 수 있습니다. κῆρυξ γενόμενος은 ‘선포자가 되어’로, κλέος는 ‘명성’으로 옮겼습니다.
  issues:
