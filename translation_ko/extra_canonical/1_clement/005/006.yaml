    issue: ‘사슬을 차고 있었고’
    rationale: φορέσας의 사건적 ‘사슬을 지님/겪음’을 지속상 ‘차고 있었다’로 바꾸며, ‘차다’는 한국어에서 사슬보다는 수갑·족쇄와 더 흔히 결합합니다.
  - severity: medium
    issue: ‘전령이 되었으며’
    rationale: κῆρυξ는 공적 선포자·전달관을 뜻하며, 일반적 소식을 전달하는 사람으로 이해되기 쉬운 ‘전령’은 선포의 의미를 충분히 드러내지 못합니다.
  - severity: low
    issue: ‘그의 믿음의 고귀한 명성’
    rationale: 원문의 뜻을 크게 훼손하지는 않지만 한국어 속격 연결이 어색합니다.
