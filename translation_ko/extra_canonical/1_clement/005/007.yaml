revisions:
- from: 그는 온 세상에 의를 가르치고, 서쪽의 끝까지 가서 통치자들 앞에서 증언한 뒤, 이처럼 세상을 떠나 거룩한 곳으로 갔으며, 인내의 가장 큰 본이 되었습니다.[a]
  to: 그는 온 세상에 의를 가르치고, 서쪽의 끝까지 가서 통치자들 앞에서 증언한 뒤, 그렇게 세상을 떠나 거룩한 곳으로 갔으며, 인내의 가장 위대한 본보기가 되었습니다.
  rationale: 원문의 세 aorist 분사(가르치고, 이르고, 증언한 뒤)가 주동사 ‘세상을 떠났다’로 이어지는 흐름을 유지했습니다. ἀπηλλάγη τοῦ κόσμου는 불필요한 해방 신학의 뉘앙스를 더하지 않고 ‘세상을 떠나다’로 옮겼습니다. ὑπογραμμός은 현대적으로 자연스러운 ‘본보기’로 조정했으며, 내용상 근거 없는 [a] 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:46Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문을 충실히 옮겼습니다. δικαιοσύνην, τὸ τέρμα τῆς δύσεως, ἐπὶ τῶν ἡγουμένων, ἀπηλλάγη τοῦ κόσμου, εἰς τὸν ἅγιον τόπον을 각각 ‘의’, ‘서쪽의 끝’, ‘통치자들 앞’, ‘세상을 떠나다’, ‘거룩한 곳’으로 처리한 것은 문맥과 그리스어 용법에 맞습니다. 다만 문장 끝의 ‘가장 큰 본’은 μέγιστος ὑπογραμμός의 뜻은 전달하지만 현대 표준 한국어로는 다소 어색합니다.
  naturalness: 합쇼체 문체와 문장 흐름은 대체로 자연스럽습니다. 그러나 ‘인내의 가장 큰 본’보다 ‘인내의 가장 위대한 본보기’가 현대 문어에서 더 자연스럽고, ὑπογραμμός의 따라 본받을 표본이라는 뉘앙스도 더 분명히 나타냅니다. 또한 본문에 대응하는 주석 내용이 없이 [a] 표지만 남아 있어 제거해야 합니다.
  terminology: ‘의’는 성서 한국어의 확립된 표현으로 적절합니다. ‘거룩한 곳’은 τὸν ἅγιον τόπον의 비특정적 장소 표현을 보존합니다. ‘통치자들’도 ἡγουμένων에 적합합니다. ‘본보기’는 ὑπογραμμός에 대한 자연스럽고 정확한 대응어입니다.
