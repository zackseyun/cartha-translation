id: 1CLEM.5.7
reference: 1 Clement 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: δικαιοσύνην διδάξας ὅλον τὸν κόσμον, καὶ ἐπὶ τὸ τέρμα τῆς δύσεως ἐλθὼν καὶ μαρτυρήσας ἐπὶ τῶν ἡγουμένων, οὕτως ἀπηλλάγη τοῦ κόσμου καὶ εἰς τὸν ἅγιον τόπον ἐπορεύθη, ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/007.yaml
  text: having taught righteousness to the whole world[a], and having come to the farthest limit of the west, and having borne witness before the rulers, thus he departed from the world and went to the holy place, having become the greatest example of endurance.
  footnotes:
  - marker: a
    text: Or 'west; and having borne witness before the rulers, so he was released from the world'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 온 세상에 의를 가르치고, 서쪽의 끝까지 가서 통치자들 앞에서 증언한 뒤, 그렇게 세상을 떠나 거룩한 곳으로 갔으며, 인내의 가장 위대한 본보기가 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνην
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: δικαιοσύνη
  rationale: POB의 'righteousness'를 소리대로 옮기기보다, 한국어 성서 문맥에서의 핵심 개념인 '의'로 옮겨 원문의 윤리·신앙적 요구를 유지했습니다.
- source_word: ἐπὶ τὸ τέρμα τῆς δύσεως
  english_pob_choice: to the farthest limit of the west
  chosen_korean: 서쪽의 끝까지
  alternatives_korean:
  - 서쪽 끝까지
  - 서쪽의 가장 먼 곳까지
  lexicon: τέρμα / δύσις
  rationale: 지리적 극점을 간명하게 드러내는 표현으로 옮겼고, 'farthest limit'의 강조를 한국어 자연성 안에서 보존했습니다.
- source_word: ἐπὶ τῶν ἡγουμένων
  english_pob_choice: before the rulers
  chosen_korean: 통치자들 앞에서
  alternatives_korean:
  - 지도자들 앞에서
  - 관리들 앞에서
  lexicon: ἡγούμενοι
  rationale: ἡγούμενοι는 단순한 추상적 '지도자'보다 실제 권세를 가진 통치층을 가리키므로, 문맥에 맞게 '통치자들'로 옮겼습니다.
- source_word: ὑπομονῆς γενόμενος μέγιστος ὑπογραμμός
  english_pob_choice: having become the greatest example of endurance
  chosen_korean: 인내의 가장 큰 본이 되었습니다
  alternatives_korean:
  - 인내의 가장 큰 모범이 되었습니다
  - 인내의 가장 큰 본보기가 되었습니다
  lexicon: ὑπογραμμός / ὑπομονή
  rationale: ὑπογραμμός은 단순한 사례가 아니라 따라야 할 '본/모범'이므로, 한국어에서 가장 직접적인 대응인 '본'을 채택해 반복·모방의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ἀπηλλάγη τοῦ κόσμου의 의미
  chosen_reading: '''세상을 떠나다''로 옮겨, 본문이 암시하는 죽음/떠남의 완곡한 표현을 살렸습니다.'
  alternative_readings:
  - '''세상에서 풀려나다'''
  - '''세상으로부터 해방되다'''
  rationale: 문법상 수동형이지만, 이 구문은 관용적으로 '떠나다' 혹은 '죽다'를 뜻할 수 있습니다. POB의 수정 취지를 따라 불필요한 신학적 수동 해석을 피하면서도 본문의 흐름을 자연스럽게 반영했습니다.
  doctrine_reference: 본문 내 서술적 표현에 대한 관용구 해석
- issue: εἰς τὸν ἅγιον τόπον의 번역
  chosen_reading: '''거룩한 곳''으로 유지해, 장소적·상징적 열린 의미를 보존했습니다.'
  alternative_readings:
  - '''성소'''
  - '''거룩한 장소'''
  rationale: 원문은 특정 성전 내부를 명시하지 않으므로, 지나치게 특정한 종교 용어보다 문맥이 허용하는 범위의 일반적 표현을 택했습니다.
  doctrine_reference: 상징적/지리적 장소 표현
