    rationale: 의미는 통하지만 ‘큰 본’은 통상적 결합이 아닙니다. μέγιστος ὑπογραμμός의 비교·모범 의미를 보존하면서 ‘인내의 가장 위대한 본보기’로 다듬는 것이 자연스럽습니다.
