  - 우리 앞에 두십시오
  - 우리의 눈앞에 제시하십시오
  lexicon: λαμβάνω + πρό + ὀφθαλμός
  rationale: 직역하면 ‘눈앞에 두자’이지만, 한국어에서는 자연스럽고 출판 가능한 명령형으로 ‘눈앞에 두십시오’가 원문의 비유적 요청을 가장 간결하게 살립니다.
- source_word: τοὺς ἀγαθοὺς
  english_pob_choice: the good
  chosen_korean: 선한
  alternatives_korean:
  - 좋은
  - 착한
  - 유익한
  lexicon: ἀγαθός
  rationale: 여기서는 도덕적·품성적 평가가 자연스러우므로 ‘좋은’보다 ‘선한’이 원문의 가치 판단을 더 분명하게 드러냅니다.
- source_word: ἀποστόλους
  english_pob_choice: apostles
  chosen_korean: 사도들
  alternatives_korean:
