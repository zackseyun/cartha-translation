  - 파송된 자들
  lexicon: ἀπόστολος
  rationale: 교회 전통과 한국어 성경용례를 고려하면 ‘사도들’이 가장 투명하며, 본문의 문맥에서도 직무적 칭호를 그대로 살릴 수 있습니다.
theological_decisions:
