translation:
  language: ko
  text: 질투와 다툼 때문에 바울은 인내의 상을 드러냈습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ ζῆλον καὶ ἔριν
  english_pob_choice: Because of jealousy and strife
  chosen_korean: 질투와 다툼 때문에
  alternatives_korean:
  - 시기와 분쟁 때문에
  - 질투와 분쟁 때문에
  lexicon: διὰ + accusative; ζῆλος; ἔρις
  rationale: διὰ는 원인을 나타내므로 ‘때문에’로 옮기고, ζῆλος와 ἔρις는 각각 ‘질투’와 ‘다툼’이 본문의 긴장감을 자연스럽게 전달합니다.
- source_word: Παῦλος
  english_pob_choice: Paul
  chosen_korean: 바울
  alternatives_korean:
  - 파울로스
  - 폴
  lexicon: Παῦλος
  rationale: 한국어에서 확립된 인명 형태인 ‘바울’을 사용해 가독성과 관용을 살렸습니다.
- source_word: ὑπομονῆς βραβεῖον
  english_pob_choice: the prize of endurance
  chosen_korean: 인내의 상
  alternatives_korean:
  - 인내의 상급
  - 참음의 상
  lexicon: ὑπομονή; βραβεῖον
  rationale: βραβεῖον은 경기 맥락의 ‘상/상급’이며, ὑπομονή는 단순한 참음보다 지속적 견딤을 가리켜 ‘인내’로 옮겼습니다.
- source_word: ἔδειξεν
  english_pob_choice: showed
  chosen_korean: 드러냈습니다
  alternatives_korean:
  - 보여 주었습니다
  - 보였습니다
  - 가리켰습니다
  lexicon: δείκνυμι
  rationale: 문맥상 단순 시각적 ‘보이다’보다, 인내의 상을 사람들 앞에 분명히 제시했다는 뜻을 살려 ‘드러냈습니다’로 옮겼습니다.
theological_decisions:
- issue: 문장 구조상 ‘인내의 상’을 무엇으로 처리할지
  chosen_reading: 바울이 인내의 상을 사람들에게 분명히 제시한 것으로 읽었습니다.
  alternative_readings:
  - 바울이 인내의 상이 무엇인지 보여 주었다는 설명적 읽기
  - 바울이 인내의 상 자체를 증거로 나타냈다는 읽기
  rationale: ἔδειξεν은 본문에서 설명을 덧붙이기보다 ‘보여 주다/드러내다’의 직접적 행위로 이해하는 것이 가장 자연스럽습니다. 영어 POB의 최신 수정도 이 방향을 지지합니다.
  doctrine_reference: 본문 해석상 선택
