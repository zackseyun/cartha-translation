  - severity: medium
    issue: ‘받아들입시다’가 λαβώμεν의 문맥적 의미를 약화함
    rationale: 여기서 ‘취하다’는 고귀한 사례들을 선택하여 제시·고찰한다는 수사적 의미입니다. ‘취합시다’가 그 기능을 더 잘 드러냅니다.
  revised_text: 그러나 이제 옛 본보기들은 그만 이야기하고, 우리 시대에 가장 가까운 때에 살았던 경기자들에게로 나아갑시다. 우리 세대의 고귀한 본보기들을 취합시다.[a]
