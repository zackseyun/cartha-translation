revisions:
- from: 그러나 옛 본보기들에서 멈추지 말고, 우리 시대와 가장 가까운 시기에 살았던 경기자들에게로 나아갑시다. 우리 세대에서 고귀한 본보기들을 받아들입시다.[a]
  to: 그러나 이제 옛 본보기들은 그만 이야기하고, 우리 시대에 가장 가까운 때에 살았던 경기자들에게로 나아갑시다. 우리 세대의 고귀한 본보기들을 취합시다.[a]
  rationale: 첫 절을 ‘옛 본보기들을 그만 이야기하고’로 고쳐 παύω와 속격의 결합이 나타내는 ‘그 논의를 그치다’라는 의미를 보존했습니다. ‘경기자들’과 ‘고귀한 본보기들’은 유지하되, 마지막 동사는 사례를 취해 제시한다는 문맥에 맞게 ‘취합시다’로 조정했습니다.
