id: 1CLEM.5.1
reference: 1 Clement 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀλλʼ ἵνα τῶν ἀρχαίων ὑποδειγμάτων παυσώμεθα, ἔλθωμεν ἐπὶ τοὺς ἔγγιστα γενομένους ἀθλητάς· λάβωμεν τῆς γενεᾶς ἡμῶν τὰ γενναῖα ὑποδείγματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/005/001.yaml
  text: But to cease from the ancient examples, let us come to the athletes who lived nearest to our own time. Let us take the noble examples from our own generation.
  footnotes:
  - marker: a
    text: Or 'But to stop with the examples of the ancients,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 이제 옛 본보기들은 그만 이야기하고, 우리 시대에 가장 가까운 때에 살았던 경기자들에게로 나아갑시다. 우리 세대의 고귀한 본보기들을 취합시다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 옛 본보기들은 여기까지 하고.”
    reason: 앞 문구의 수사적 전환, 곧 옛 사례의 논의를 그치고 더 최근의 사례로 넘어가는 뜻을 제시합니다.
lexical_decisions:
- source_word: παυσώμεθα τῶν ἀρχαίων ὑποδειγμάτων
  english_pob_choice: But to cease from the ancient examples
  chosen_korean: 옛 본보기들에서 멈추지 말고
  alternatives_korean:
  - 옛 본보기들을 끝으로 삼지 말고
  - 옛 예들에서 그치고
  lexicon: παύω; ὑπόδειγμα
  rationale: παυσώμεθα는 단순히 ‘중단하다’가 아니라 ‘~에서 멈추다/그만두다’의 뉘앙스이므로, 한국어에서는 ‘~에서 멈추지 말고’로 처리해 앞부분에서 벗어나 다음 대상으로 넘어가는 흐름을 살렸습니다.
- source_word: τοὺς ἔγγιστα γενομένους ἀθλητάς
  english_pob_choice: the athletes who lived nearest to our own time
  chosen_korean: 우리 시대와 가장 가까운 시기에 살았던 경기자들에게로
  alternatives_korean:
  - 우리 시대에 가장 가까웠던 운동 선수들에게로
  - 가장 최근 시대의 투사들에게로
  lexicon: ἀθλητής
  rationale: ἀθλητάς는 본문 맥락상 신앙적 투쟁을 비유하는 ‘경기자/투사’이므로, 현대적 ‘운동 선수’보다 문맥 보존력이 있는 ‘경기자’로 옮겼습니다.
- source_word: τῆς γενεᾶς ἡμῶν τὰ γενναῖα ὑποδείγματα
  english_pob_choice: the noble examples from our own generation
  chosen_korean: 우리 세대에서 고귀한 본보기들을
  alternatives_korean:
  - 우리 세대의 고귀한 예들을
  - 우리 نسل의 훌륭한 본을
  lexicon: γενεά; γενναῖος; ὑπόδειγμα
  rationale: γενναῖα는 단순한 ‘좋은’보다 ‘고귀한, 고결한’의 강도가 있어 ‘고귀한’으로 살렸고, ὑποδείγματα는 반복되는 ‘examples’보다 ‘본보기들’이 한국어에서 더 자연스럽고 시사성이 있습니다.
theological_decisions:
- issue: 수사적 전환의 톤
  chosen_reading: ‘그러나 … 멈추지 말고 … 나아갑시다’로, 앞선 본보기들을 완전히 폐기하기보다 논의 초점을 옛 사례에서 더 가까운 시대의 모범으로 옮기는 권면으로 읽었습니다.
  alternative_readings:
  - ‘옛 예들을 그치고’처럼 단순한 목록 종료로 읽는 해석
  - ‘옛 본보기들을 버리고’처럼 가치 절하로 읽는 해석
  rationale: πaυσώμεθα + γεν. 구문은 ‘옛 예들을 끊어버리다’가 아니라 ‘그것들에서 물러나 다음 단계로 가자’는 흐름을 만들며, 영어 POB의 수정 취지도 이 전환을 보존합니다.
  doctrine_reference: 문학적 수사 이해
