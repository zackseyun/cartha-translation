id: 1CLEM.58.1
reference: 1 Clement 58:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑποταχθῶμεν οὖν τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ φυγόντες τὰς προειρημένας διὰ τῆς σοφίας τοῖς ἀπειθοῦσιν ἀπειλάς, ἵνα κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/001.yaml
  text: Let us therefore submit ourselves to his all-holy and glorious name, fleeing the threats previously spoken through wisdom against the disobedient, so that we may dwell, trusting in the most holy name of his majesty.
  footnotes:
  - marker: a
    text: Or 'dwell secure, having placed our confidence in'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리는 그의 지극히 거룩하고 영광스러운 이름에 순종하며, 지혜를 통해 불순종하는 자들에게 미리 선포된 위협을 피하여, 그의 위엄의 가장 거룩한 이름을 신뢰하며 거기에 머물게 되기를 바랍니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποταχθῶμεν
  english_pob_choice: submit ourselves
  chosen_korean: 순종하며
  alternatives_korean:
  - 복종하며
  - 자기를 낮추어 따르며
  lexicon: ὑποτάσσω
  rationale: 공동체적 권면으로서의 ‘submit ourselves’를 한국어에서 가장 자연스럽게 살리되, 위계적 뉘앙스가 과도한 ‘복종’보다 ‘순종’이 본문의 호소를 잘 드러냅니다.
- source_word: τῷ παναγίῳ καὶ ἐνδόξῳ ὀνόματι αὐτοῦ
  english_pob_choice: his all-holy and glorious name
  chosen_korean: 그의 지극히 거룩하고 영광스러운 이름
  alternatives_korean:
  - 그의 온전히 거룩하고 영광스러운 이름
  - 그의 아주 거룩하고 영광스러운 이름
  lexicon: παναγίος, ἐνδόξος, ὄνομα
  rationale: παναγίῳ의 강한 최상급을 ‘지극히 거룩하고’로 옮기고, ὄνομα는 하나님의 이름 자체에 대한 경외를 드러내는 ‘이름’으로 유지했습니다.
- source_word: φυγόντες τὰς ... ἀπειλάς
  english_pob_choice: fleeing the threats previously spoken
  chosen_korean: 미리 선포된 위협을 피하여
  alternatives_korean:
  - 전에 말해진 위협을 피하여
  - 앞서 선포된 위협을 피하여
  lexicon: φυγόντες, προειρημένας, ἀπειλάς
  rationale: ‘fleeing’은 단순 회피보다 적극적 이탈을 뜻하므로 ‘피하여’로 옮기고, προειρημένας는 ‘미리 선포된’으로 이전 발화를 자연스럽게 반영했습니다.
- source_word: κατασκηνώσωμεν πεποιθότες ἐπὶ τὸ ὀσιώτατον τῆς μεγαλωσύνης αὐτοῦ ὄνομα
  english_pob_choice: dwell, trusting in the most holy name of his majesty
  chosen_korean: 머물게 되기를 바랍니다… 거기에 신뢰하며
  alternatives_korean:
  - 거주하며 확신을 두고
  - 안주하며 믿고
  lexicon: κατασκηνόω, πεποιθότες, ὀσιώτατος, μεγαλωσύνη
  rationale: κατασκηνώσωμεν은 ‘거주하다/장막을 치다’의 정착감을 살려 ‘머물게 되기를’로 풀고, πεποιθότες는 중복 번역을 피하면서 ‘신뢰하며’로 간결하게 반영했습니다.
theological_decisions:
- issue: 하나님의 ‘이름’에 대한 복종과 신뢰의 관계
  chosen_reading: 본문은 하나님의 이름 자체에 순종하고 그 이름 안에 머무는 신앙적 자세를 병렬적으로 요청합니다.
  alternative_readings:
  - ‘이름’은 단지 호칭이므로 실제 대상은 하나님 자신이다
  - ‘머무른다’는 단순 심리적 안정의 표현이다
  rationale: 그리스어가 ὄνομα를 반복하며 경외와 신뢰를 연결하므로, 이를 추상화하지 않고 이름-임재의 긴장감을 유지했습니다.
  doctrine_reference: 하나님의 이름, 경외, 신뢰에 관한 성서적 언어(출 3:15; 시 20:7)
