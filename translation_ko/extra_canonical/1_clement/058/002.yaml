id: 1CLEM.58.2
reference: 1 Clement 58:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: δέξασθε τὴν συμβουλὴν ἡμῶν, καὶ ἔσται ἀμεταμέλητα ὑμῖν. ζῇ γὰρ ὁ θεὸς καὶ ζῇ ὁ κύριος Ἰησοῦς Χριστὸς καὶ τὸ πνεῦμα τὸ ἅγιον, ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν, ὅτι ὁ ποιήσας ἐν ταπεινοφροσύνῃ μετ᾽ ἐκτενοῦς ἐπιεικείας ἀμεταμελήτως τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα· οὕτως ἐντεταγμένος καὶ ἐλλόγιμος ἔσται εἰς τὸν ἀριθμὸν τῶν σῳζομένων διὰ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐστὶν αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/058/002.yaml
  text: Accept our counsel[a], and you will have no cause for regret. For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit, and the faith and hope of the elect, so surely the one who in humility, with earnest gentleness, without regret carries out the righteous requirements and commandments given by God, this one will be enrolled and counted among the number of those being saved through Jesus Messiah, through whom be the glory to him forever and ever. Amen.
  footnotes:
  - marker: a
    text: Or 'who are the faith and the hope'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 권고를 받아들이십시오. 그러면 여러분에게 후회가 없을 것입니다. 하나님이 살아 계시고, 주 예수 메시아가 살아 계시며, 성령과 택하신 이들의 믿음과 희망도 살아 있음을 두고 말씀드립니다. 겸손한 마음으로 한결같은 관용을 지니고, 하나님께서 주신 의로운 규정과 명령을 후회 없이 실행하는 사람은 예수 메시아를 통하여 구원받는 이들의 수에 편입되고 그들 가운데 헤아려질 것입니다. 예수 메시아를 통하여 그분께 영광이 영원무궁하도록 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέξασθε τὴν συμβουλὴν ἡμῶν
  english_pob_choice: Accept our counsel
  chosen_korean: 우리의 권고를 받아들이십시오
  alternatives_korean:
  - 우리의 충고를 받아들이십시오
  - 우리의 권면을 받아들이십시오
  lexicon: δέχομαι / συμβουλή
  rationale: συμβουλή는 단순한 ‘충고’보다 공동체적 권고·권면의 성격이 있어 ‘권고’로 옮기고, 공적인 호소에 맞게 합쇼체 명령으로 처리했습니다.
- source_word: ζῇ γὰρ ὁ θεὸς ... ζῇ ὁ κύριος Ἰησοῦς Χριστός ... καὶ τὸ πνεῦμα τὸ ἅγιον
  english_pob_choice: For as God lives, and the Lord Jesus Messiah lives, and the Holy Spirit
  chosen_korean: 하나님이 살아 계시고, 주 예수 메시아가 살아 계시고, 성령
  alternatives_korean:
  - 하나님은 살아 계시고, 주 예수 메시아는 살아 계시고, 성령
  - 하나님이 살아 있고, 주 예수 메시아가 살아 있고, 성령
  lexicon: ζάω / κύριος Ἰησοῦς Χριστός / πνεῦμα τὸ ἅγιον
  rationale: 반복되는 ζῇ를 ‘살아 계시고’로 살려 맹세 공식의 현장성을 유지했고, Χριστός는 이 프로젝트 기본어인 ‘메시아’를 따랐으며, τὸ πνεῦμα τὸ ἅγιον은 신적 영을 가리키므로 ‘성령’으로 옮겼습니다.
- source_word: ἥ τε πίστις καὶ ἡ ἐλπὶς τῶν ἐκλεκτῶν
  english_pob_choice: the faith and hope of the elect
  chosen_korean: 택하신 이들의 믿음과 희망
  alternatives_korean:
  - 택하신 이들의 믿음과 소망
  - 택하신 이들의 믿음과 바람
  lexicon: πίστις / ἐλπίς / ἐκλεκτοί
  rationale: πίστις는 기본어 ‘믿음’으로, ἐλπίς는 현대 한국어에서 자연스럽고 문맥에 맞는 ‘희망’으로 옮겼습니다. 여기서는 ‘the faith and hope’가 공동체적 증언 항목처럼 병렬되므로 별도의 주어로 돌리지 않았습니다.
- source_word: τὰ ὑπὸ τοῦ θεοῦ δεδομένα δικαιώματα καὶ προστάγματα
  english_pob_choice: the righteous requirements and commandments given by God
  chosen_korean: 하나님이 주신 의로운 규정과 명령
  alternatives_korean:
  - 하나님이 주신 의로운 요구와 명령
  - 하나님이 주신 의로운 규례와 명령
  lexicon: δικαιώματα / προστάγματα
  rationale: δικαιώματα는 여기서 ‘의로운 요구’보다 제도적·규범적 뉘앙스가 강해 ‘규정’으로, προστάγματα는 ‘명령’으로 옮겨 병렬을 살렸습니다.
theological_decisions:
- issue: 맹세 공식 안에서 하나님, 주 예수 메시아, 성령, 그리고 ‘믿음과 희망’을 함께 증언자로 세우는 표현
  chosen_reading: 본문이 의도하는 수사적 맹세 구조를 그대로 살려, 뒤의 ‘믿음과 희망’도 살아 있는 증언 항목처럼 한국어로 유지했습니다.
  alternative_readings:
  - ‘믿음과 희망’을 별도의 관념적 진술로 약화시키는 번역
  - 문장을 평이한 조건문으로 바꾸는 번역
  rationale: 그리스어는 ‘믿음과 희망’을 상대절로 만들지 않고 맹세적 병렬 안에 두므로, 이상하게 보이더라도 그 긴장을 보존하는 편이 원문의 힘을 더 정확히 전달합니다.
  doctrine_reference: source-grounded rhetoric; applied revision on ἥ τε πίστις καὶ ἡ ἐλπὶς
