base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/009.yaml
  text: 'Therefore let us obey his majestic and glorious purpose, and, becoming suppliants of his mercy and kindness, let us fall before him and turn to his compassions, leaving behind fruitless toil, as well as strife and the jealousy that leads to death.


    Let us fix our gaze on those who ministered perfectly to his majestic glory.


    Let us take Enoch, who, having been found righteous in obedience, was taken up, and his death was not found.


    Noah, having been found faithful, through his ministry proclaimed regeneration to the world, and through him the Master saved the living creatures that entered the ark in harmony.'
translation:
  language: ko
  text: '그러므로 우리는 그의 장엄하고 영광스러운 뜻에 순종합시다. 그의 자비와 친절을 간구하는 자가 되어, 그 앞에 엎드려 그의 긍휼을 바라보고, 헛된 수고와 다툼과 죽음에 이르게 하는 질투를 버립시다.


    그의 장엄한 영광을 온전히 섬긴 이들을 주시합시다.


    우리는 에녹을 보십시오. 그는 순종 가운데 의롭게 판정되어 들려 올라갔고, 그의 죽음은 발견되지 않았습니다.


    노아는 신실하다고 판정받아 그의 섬김을 통해 세상에 새로움을 선포했고, 그를 통해 주인께서 방주 안으로 들어간 살아 있는 피조물들을 조화롭게 구원하셨습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγαλοπρεπεῖ καὶ ἐνδόξῳ βουλήσει
  english_pob_choice: his majestic and glorious purpose
  chosen_korean: 그의 장엄하고 영광스러운 뜻
  alternatives_korean:
  - 그의 위엄 있고 영광스러운 계획
  - 그의 장엄하고 영화로운 목적
  lexicon: βουλήσις / βουλή
  rationale: βουλή를 단순한 ‘계획’보다 의도와 결단을 아우르는 ‘뜻’으로 옮기되, μεγαλοπρεπής와 ἔνδοξος의 중첩을 ‘장엄하고 영광스러운’으로 살렸습니다.
- source_word: ἱκέται
  english_pob_choice: suppliants
  chosen_korean: 간구하는 자
  alternatives_korean:
  - 청원자
  - 간청하는 자
  lexicon: ἱκέτης
  rationale: ἱκέτης의 예배적·굴복적 뉘앙스를 살리기 위해 단순한 ‘구하는 사람’보다 겸손한 태도를 드러내는 표현을 택했습니다.
- source_word: χρηστότητος / οἰκτιρμοὺς
  english_pob_choice: kindness / compassions
  chosen_korean: 친절 / 긍휼
  alternatives_korean:
  - 선하심 / 자비
  - 인자하심 / 불쌍히 여기심
  lexicon: χρηστότης / οἰκτιρμός
  rationale: 두 명사를 서로 겹치지 않게 분리해, χρηστότης는 선의가 드러나는 ‘친절’, οἰκτιρμοί는 연민의 내적 움직임을 드러내는 ‘긍휼’로 옮겼습니다.
- source_word: ματαιοπονίαν
  english_pob_choice: fruitless toil
  chosen_korean: 헛된 수고
  alternatives_korean:
  - 헛된 노동
  - 무익한 애씀
  lexicon: ματαιοπονία
  rationale: POB가 채택한 ‘fruitless toil’의 무익함과 소모성을 자연스러운 한국어로 압축해 ‘헛된 수고’로 옮겼습니다.
- source_word: τελείως λειτουργήσαντας
  english_pob_choice: those who ministered perfectly
  chosen_korean: 온전히 섬긴 이들
  alternatives_korean:
  - 완전하게 봉사한 이들
  - 완벽히 직무를 수행한 이들
  lexicon: λειτουργέω
  rationale: λειτουργέω는 제의적·공적 섬김을 포함하므로, 한국어에서 지나치게 직역된 ‘봉사’보다 문맥에 맞는 ‘섬기다’를 택해 완전성을 ‘온전히’로 살렸습니다.
theological_decisions:
- issue: 노아의 전언 내용
  chosen_reading: ‘세상에 새로움’을 선포했다는 문맥을 유지했습니다.
  alternative_readings:
  - ‘중생’ 또는 ‘새 창조’를 선포했다는 해석
  - 홍수 심판과 연관된 회복 선포
  rationale: ἀναγέννησις 계열 표현을 도식적으로 교리어로 고정하지 않고, 영어 POB의 ‘regeneration’과 그리스어의 새로움/갱신 의미를 함께 살리는 표현으로 남겼습니다.
  doctrine_reference: 1 Clement 9:4; ἀναγέννησις 어휘 범위
