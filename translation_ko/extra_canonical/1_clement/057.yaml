base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057.yaml
  text: 'Therefore[a], you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart. Learn to submit, putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of the Messiah than, while seeming preeminent, to be cast out from his hope.


    For thus says all-virtuous Wisdom: “Behold, I will bring forth to you a word from my breath[a], and I will teach you my message. Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you. For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs. Therefore they will eat the fruits of their own way and be filled with their own ungodliness. For because they were wronging the innocent, they will be slain, and examination will destroy the ungodly; but the one who hears me will dwell, trusting in hope[b][c][d],
    and will be at rest without fear from every evil.”'
  footnotes:
  - marker: a
    text: Or 'to be found small and notable/recognized within the flock of the Messiah.' The Greek term can denote being accounted or held in regard.
    reason: lexical_alternative
    anchor_ref: '57:2'
  - marker: a
    text: '''To be cast out from his hope'' may also be understood as ''excluded from the hope in him.'''
    reason: alternative_reading
    anchor_ref: '57:2'
  - marker: d
    text: This extended citation echoes Proverbs 1:23-33 in a form close to the Greek wisdom tradition.
    reason: cross_reference
    anchor_ref: 57:3-7
  - marker: c
    text: The Greek word rendered 'examination' is rare and difficult; it may also suggest 'scrutiny' or 'testing.'
    reason: lexical_alternative
    anchor_ref: '57:7'
  - marker: b
    text: Or 'the uprising'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 여러분, 곧 분쟁의 기초를 놓은 사람들이여, 장로들에게 순종하고 회개에 이르도록 징계받으십시오. 마음의 무릎을 꿇으십시오. 교만하고 거만한 여러분의 혀의 자기주장을 버리고 순종하는 법을 배우십시오. 메시아의 양 떼 안에서 작고도 인정받는 사람들로 발견되는 것이, 높은 자리에 있는 듯 보이다가 그의 희망에서 쫓겨나는 것보다 여러분에게 더 낫습니다.


    이와 같이 모든 덕을 갖춘 지혜가 말씀하십니다. "보십시오, 내가 내 호흡의 말씀을 여러분에게 전하고, 내 메시지를 여러분에게 가르치겠습니다. 내가 불렀으나 너희는 듣지 않았고, 내가 말을 펼쳤으나 너희는 주의를 기울이지 않았으며, 내 권고를 무효로 만들고 내 책망에 순종하지 않았습니다. 그러므로 나도 너희의 파멸을 보고 비웃겠고, 멸망이 너희에게 닥치고 갑작스런 소란이 너희에게 이르며, 너희의 전복이 폭풍처럼 임하거나 환난과 포위가 너희에게 닥칠 때 즐거워하겠습니다. 너희가 나를 부를 때 나는 너희에게 귀를 기울이지 않을 것이며, 악한 사람들이 나를 찾겠지만 찾지 못할 것입니다. 그들은 지혜를 미워했고 주님의 두려움을 택하지 않았으며, 내 권고를 들으려 하지 않았고 내 책망을 조롱했습니다. 그러므로 그들은 자기 길의 열매를 먹고 자기 불경으로 가득 찰 것입니다. 그들이 무고한 이들을 해쳤기 때문에 살해될 것이며, 심문이 불경한 자들을 멸망시킬 것입니다. 그러나 나를 듣는 자는 희망을 믿고 거기에 거하며, 어떤 악에서도 두려움 없이 평안할 것입니다."[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβολὴν τῆς στάσεως
  english_pob_choice: laid the foundation of the rebellion
  chosen_korean: 분쟁의 기초를 놓은
  alternatives_korean:
  - 반란의 기초를 놓은
  - 반역의 기초를 놓은
  - 소요의 기초를 놓은
  lexicon: LSJ
  rationale: καταβολή의 ‘놓다/기초’ 이미지를 살리고, στάσις는 이 문맥에서 교회 내 분열과 반목을 가리키므로 ‘분쟁’으로 옮겼습니다.
- source_word: ὑποτάγητε
  english_pob_choice: submit yourselves
  chosen_korean: 순종하고
  alternatives_korean:
  - 복종하고
  - 자신을 복종시키고
  - 자신을 따르게 하고
  lexicon: BDAG
  rationale: 명령형의 권면성을 살리면서 한국어에서 자연스러운 자기수용적 태도를 드러내기 위해 ‘순종하다’를 택했습니다.
- source_word: πρεσβυτέροις
  english_pob_choice: elders
  chosen_korean: 장로들
  alternatives_korean:
  - 노인들
  - 원로들
  - 장로급 사람들
  lexicon: BDAG
  rationale: 이 단어는 연장자 일반이 아니라 회중 지도자들을 가리키므로 교회적 용례를 살려 ‘장로들’로 옮겼습니다.
- source_word: παιδεύθητε εἰς μετάνοιαν
  english_pob_choice: be disciplined unto repentance
  chosen_korean: 회개에 이르도록 징계받으십시오
  alternatives_korean:
  - 회개하도록 훈련받으십시오
  - 회개로 인도되는 교정을 받으십시오
  lexicon: BDAG
  rationale: παιδεύω의 교정·훈련·징계 의미를 모두 고려해, 회개를 목표로 하는 징계라는 방향성을 분명히 했습니다.
- source_word: κάμψαντες τὰ γόνατα τῆς καρδίας
  english_pob_choice: bending the knees of your heart
  chosen_korean: 마음의 무릎을 꿇으십시오
  alternatives_korean:
  - 마음의 무릎을 굽히십시오
  - 마음의 무릎을 꺾으십시오
  lexicon: LSJ
  rationale: 은유를 직역에 가깝게 유지해 내적 겸손을 선명하게 드러냈습니다.
- source_word: ἀλαζόνα καὶ ὑπερήφανον ... αὐθάδειαν
  english_pob_choice: the arrogant and proud self-will
  chosen_korean: 교만하고 거만한 여러분의 혀의 자기주장
  alternatives_korean:
  - 허세와 오만한 고집
  - 교만하고 오만한 혀의 고집
  lexicon: BDAG
  rationale: αὐθάδεια의 ‘자기주장/고집’ 뉘앙스를 살리되, 여기서는 ‘혀’에 연결된 말의 태도라는 점을 반영했습니다.
- source_word: ἐλλογίμους
  english_pob_choice: esteemed
  chosen_korean: 인정받는
  alternatives_korean:
  - 존중받는
  - 귀히 여겨지는
  - 평가받는
  lexicon: LSJ
  rationale: ‘계산되다/평가되다’의 뜻을 살려, 공동체 안에서 가치 있게 여겨지는 상태를 자연스럽게 표현했습니다.
- source_word: ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ
  english_pob_choice: to be cast out from his hope
  chosen_korean: 그의 희망에서 쫓겨나는
  alternatives_korean:
  - 그의 희망에서 내쫓기는
  - 그 안에 있는 희망에서 제외되는
  lexicon: BDAG
  rationale: 원문의 거친 경고를 유지하기 위해 ‘쫓겨나다’를 택했고, genitive의 모호성은 본문 그대로 남겼습니다.
- source_word: πνοῆς ῥῆσιν
  english_pob_choice: a word from my breath
  chosen_korean: 내 호흡의 말씀
  alternatives_korean:
  - 내 숨의 말씀
  - 내 영의 말씀
  - 내 호흡에서 나온 말씀
  lexicon: LSJ
  rationale: πνοή의 기본적 ‘호흡/숨’ 이미지를 유지하면서, 말씀의 출처를 압축적으로 드러냈습니다.
- source_word: ἐξέτασμος
  english_pob_choice: examination
  chosen_korean: 심문
  alternatives_korean:
  - 조사
  - 검증
  - 시험
  lexicon: LSJ
  rationale: 희귀한 단어이지만 이 문맥에서는 재난적 심판의 성격이 강하므로, 단순한 ‘검사’보다 강한 ‘심문’으로 옮겼습니다.
theological_decisions:
- issue: Χριστοῦ의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 여기서 Χριστός는 호칭적 제목으로 기능하므로, 프로젝트 기본정책에 따라 ‘메시아’로 옮겨 그 의미를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 잠언 전승 인용의 신학적 뉘앙스
  chosen_reading: 지혜가 직접 말하는 경고로 유지
  alternative_readings:
  - 단순한 교훈 인용으로 완화
  - 후대 기독교적 해석을 덧씌움
  rationale: 본문은 지혜 전승의 재현된 음성을 통해 심판과 회개의 긴장을 강조하므로, 그 강도를 약화시키지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
