translation:
  language: ko
  text: 그러므로 우리는 선한 일을 하는 데 힘써야 합니다. 만물이 그에게서 비롯되기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖν ... ἡμᾶς εἶναι
  english_pob_choice: we must be
  chosen_korean: 우리는 ... 해야 합니다
  alternatives_korean:
  - 우리는 ... 할 필요가 있습니다
  - 우리는 ... 되어야 합니다
  lexicon: δεῖ
  rationale: δεῖ의 필연성을 한국어의 의무 표현으로 옮기되, 1인칭 복수에 맞게 자연스러운 합쇼체로 처리했습니다.
- source_word: προθύμους
  english_pob_choice: eager
  chosen_korean: 열심이어야 합니다
  alternatives_korean:
  - 열심히 해야 합니다
  - 기꺼이 해야 합니다
  - 간절해야 합니다
  lexicon: πρόθυμος
  rationale: 단순한 감정적 열심이 아니라 자발적이고 준비된 태도를 가리켜, 행위 앞의 적극성과 자원성을 함께 드러내는 ‘열심이어야 합니다’로 옮겼습니다.
- source_word: εἰς ἀγαθοποιΐαν
  english_pob_choice: for doing good
  chosen_korean: 선한 일을 하기에
  alternatives_korean:
  - 선행을 위해
  - 선한 일을 하도록
  - 선행에
  lexicon: ἀγαθοποιΐα
  rationale: εἰς가 지향/목적을 나타내는 점을 살려 ‘...하기에’로 풀었고, 추상명사보다 한국어에서 더 자연스러운 ‘선한 일’을 선택했습니다.
- source_word: ἐξ αὐτοῦ γάρ ἐστιν τὰ πάντα
  english_pob_choice: for from him are all things
  chosen_korean: 왜냐하면 만물이 그에게서 나왔기 때문입니다
  alternatives_korean:
  - 왜냐하면 모든 것이 그에게서 있기 때문입니다
  - 왜냐하면 모든 것이 그로부터 있기 때문입니다
  lexicon: ἐξ αὐτοῦ
  rationale: ἐκ/ἐξ의 출처·근원의 의미를 살려 ‘그에게서 나왔기 때문입니다’로 옮겨, 존재의 기원을 강조했습니다.
theological_decisions:
- issue: 만물의 근원 진술
  chosen_reading: 만물은 그에게서 나왔습니다.
  alternative_readings:
  - 만물은 그로부터 있습니다
  - 만물이 그에게 속해 있습니다
  rationale: 문맥상 하나님을 궁극적 근원으로 제시하는 진술이므로, 소유보다 기원과 발생의 의미가 분명한 표현을 택했습니다.
  doctrine_reference: 창조론 / 하나님 섭리
