  to: 그러므로 우리는 선한 일을 하는 데 힘써야 합니다. 만물이 그에게서 비롯되기 때문입니다.
  rationale: προθύμους εἶναι εἰς ἀγαθοποιΐαν을 자연스러운 합쇼체로 ‘선한 일을 하는 데 힘써야 합니다’로 옮겼습니다. ἐξ αὐτοῦ ... ἐστιν은 과거의 발생만을 뜻하기보다 만물의 근원이 그에게 있음을 진술하므로 ‘만물이 그에게서 비롯되기 때문입니다’로 조정했습니다. 원문에 근거한 별도 주석 필요성이 없으므로 이전 영어 렌더링을 가리키는 각주는 제거했습니다.
