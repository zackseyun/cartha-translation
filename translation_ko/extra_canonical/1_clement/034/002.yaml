  naturalness: ‘선한 일을 하기에 열심이어야 합니다’는 이해되지만 다소 경직됩니다. ‘선한 일을 하는 데 힘써야 합니다’가 현대 표준어 합쇼체에서 자연스럽고, προθύμους의 적극적 태도도 충분히 전달합니다.
  terminology: ἀγαθοποιΐαν은 ‘선한 일을 하는 것’으로, τὰ πάντα는 ‘만물’로 적절히 옮겼습니다. ‘그에게서 비롯되다’는 ἐξ αὐτοῦ의 근원·출처 의미를 보존하며, 불필요하게 특정 교리를 덧붙이지 않습니다.
  issues:
