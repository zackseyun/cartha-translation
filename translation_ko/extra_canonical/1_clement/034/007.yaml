base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/007.yaml
  text: So then[a], let us also, having been gathered together in concord with one mind, cry out to him earnestly as from one mouth, so that we may become sharers in his great and glorious promises.
  footnotes:
  - marker: a
    text: Or 'gathered together in concord to the same place'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리도 한마음으로 한곳에 모여, 마치 한 입에서 나오는 것처럼 그분께 간절히 외쳐, 그분의 크고 영광스러운 약속의 참여자가 되게 합시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁμονοίᾳ
  english_pob_choice: in concord
  chosen_korean: 한마음으로
  alternatives_korean:
  - 화합하여
  - 일치하여
  lexicon: ὁμονοία
  rationale: 공동체적 일치와 조화를 자연스럽게 드러내는 한국어로 ‘한마음으로’를 선택했습니다.
- source_word: ἐπὶ τὸ αὐτὸ συναχθέντες
  english_pob_choice: having been gathered together
  chosen_korean: 한곳에 모여
  alternatives_korean:
  - 함께 모여
  - 한 자리에 모여
  lexicon: συνάγω
  rationale: POB의 개정처럼 별도의 장소성을 과도하게 강조하지 않되, 모임의 실제성을 살려 ‘한곳에 모여’로 옮겼습니다.
- source_word: τῇ συνειδήσει
  english_pob_choice: with one mind
  chosen_korean: 한마음으로
  alternatives_korean:
  - 한 양심으로
  - 한 의식으로
  lexicon: συνείδησις
  rationale: 이 문맥에서는 내면의 판단/의식이라기보다 공동체적 내적 일치가 핵심이어서 ‘한마음’으로 자연스럽게 표현했습니다.
- source_word: ἐκτενῶς
  english_pob_choice: earnestly
  chosen_korean: 간절히
  alternatives_korean:
  - 열심히
  - 간곡히
  lexicon: ἐκτενῶς
  rationale: 간청의 강도와 진심을 함께 드러내는 표현으로 ‘간절히’가 가장 적절합니다.
- source_word: μετόχους ἡμᾶς γενέσθαι τῶν μεγάλων καὶ ἐνδόξων ἐπαγγελιῶν αὐτοῦ
  english_pob_choice: become sharers in his great and glorious promises
  chosen_korean: 그분의 크고 영광스러운 약속의 참여자가 되게
  alternatives_korean:
  - 그분의 크고 영광스러운 약속에 참여하게
  - 그분의 크고 영광스러운 약속을 함께 누리게
  lexicon: μέτοχος / ἐπαγγελία
  rationale: ‘참여자’로 관계성을 분명히 하고, promises를 단순한 물건처럼 만들지 않으면서도 ‘약속의 참여자’라는 원문의 구조를 보존했습니다.
theological_decisions:
- issue: 공동체적 일치의 강조 방식
  chosen_reading: ‘한마음으로 한곳에 모여’와 ‘마치 한 입에서 나오는 것처럼’으로 공동체의 일치와 단일한 증언을 함께 살렸습니다.
  alternative_readings:
  - ‘한마음으로 함께 모여’
  - ‘한 목소리로’
  rationale: 본문은 단지 소리의 합창이 아니라 내적 일치에서 나오는 공동 청원을 말하므로, 외적 목소리와 내적 일치를 둘 다 보이게 했습니다.
  doctrine_reference: 교회론
