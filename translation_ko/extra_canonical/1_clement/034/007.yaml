revisions:
- from: 그러므로 우리도 한마음으로 한곳에 모여, 마치 한 입에서 나오는 것처럼 그분께 간절히 외쳐, 그분의 크고 영광스러운 약속의 참여자가 되게 합시다.[a]
  to: 그러므로 우리도 화합하여 함께 모이고 한 양심으로, 마치 한 입에서 나오는 것처럼 그분께 간절히 부르짖어, 우리가 그분의 크고 영광스러운 약속들에 참여하는 이들이 되게 합시다.[a]
  rationale: 원문의 두 일치 관련 표현을 임의로 하나로 합치지 않고 구별했습니다. ‘함께 모이고’는 ἐπὶ τὸ αὐτό의 장소성 여부를 열어 두며, 목적절과 복수형 ‘약속들’을 한국어 문장 안에서 자연스럽게 보존했습니다.
