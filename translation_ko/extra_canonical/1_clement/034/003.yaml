review_pass:
  verdict: revise
  source_fidelity: προλέγει는 ‘미리 말씀하십니다’로 적절히 반영되었습니다. 다만 인용문의 ‘주님이시며’는 그리스어의 명사구를 한국어에서 부자연스럽고 문법적으로 불완전하게 처리한 것입니다. 또한 ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ는 각 사람 자신의 행위를 기준으로 한다는 뜻이므로 이를 명시하는 편이 충실합니다.
  naturalness: 합쇼체와 성경 인용 문체는 대체로 적절하지만, ‘보십시오, 주님이시며’는 현대 표준 한국어에서 자연스럽지 않습니다. 문장을 나누어 ‘주님이십니다’로 처리하면 원문의 압축된 선언 형식을 무리 없이 재현할 수 있습니다.
  terminology: ‘주님’, ‘상급’, ‘그분 앞에’는 문맥과 한국어 성경 문체에 잘 맞습니다. ‘그 행위대로’는 지시 대상이 다소 모호할 수 있으므로 ‘자기가 한 일에 따라’로 명료하게 옮깁니다.
  issues:
  - severity: medium
    issue: 인용문 첫 절의 ‘주님이시며’
    rationale: ὁ κύριος는 접속 어미 ‘-시며’에 직접 대응하지 않으며, 한국어 문장으로도 서술이 완결되지 않습니다. 원문에 명시되지 않은 ‘오심’을 보충하지 않고, 최소한의 계사로 선언문을 구성하는 것이 안전합니다.
  - severity: low
    issue: ‘그 행위대로’의 소유 관계 불명확
    rationale: αὐτοῦ는 각 사람(ἑκάστῳ)을 가리킵니다. ‘자기가 한 일에 따라’는 각 개인의 행위라는 관계를 자연스럽고 분명하게 드러냅니다.
  - severity: low
    issue: '[a] 표지에 대응하는 한국어 각주 부재'
    rationale: 번역문에 [a]가 남아 있으므로, 영어 감사 기록의 대안 어순을 반영한 한국어 각주를 제공하여 표지와 각주의 구조를 일치시킵니다.
  revised_text: 그분께서는 우리에게 미리 말씀하십니다. 「보십시오, 주님이십니다. 그분의 상급이 그분 앞에 있어, 각 사람에게 자기가 한 일에 따라 갚아 주십니다.」[a]
