id: 1CLEM.34.3
reference: 1 Clement 34:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: προλέγει γὰρ ἡμῖν· Ἰδοὺ ὁ κύριος, καὶ ὁ μισθὸς αὐτοῦ πρὸ προσώπου αὐτοῦ, ἀποδοῦναι ἑκάστῳ κατὰ τὸ ἔργον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/003.yaml
  text: For he says beforehand to us[a], “Behold, the Lord, and his reward is before him, to repay each one according to his work.”
  footnotes:
  - marker: a
    text: Or 'For he says beforehand to us'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 미리 우리에게 말씀하십니다. 「보십시오, 주님이시며, 그의 상급이 그분 앞에 있어, 각 사람에게 그 행위대로 갚으십니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προλέγει
  english_pob_choice: says beforehand
  chosen_korean: 미리 우리에게 말씀하십니다
  alternatives_korean:
  - 미리 우리에게 말하십니다
  - 우리에게 미리 예고하십니다
  - 우리에게 미리 말씀하십니다
  lexicon: προλέγω
  rationale: 단순한 과거형 진술보다 앞서 말해 두는 행위를 드러내기 위해 ‘미리 말씀하십니다’로 옮겼고, POB 수정안의 중립적 의미를 따랐습니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인이시다
  lexicon: κύριος
  rationale: 본문의 인용절에서 하나님을 가리키는 호칭이므로 한국어 예배·성경 문체에 맞는 ‘주님’을 택했습니다.
- source_word: ὁ μισθὸς αὐτοῦ
  english_pob_choice: his reward
  chosen_korean: 그의 상급
  alternatives_korean:
  - 그의 보상
  - 그의 삯
  - 그의 대가
  lexicon: μισθός
  rationale: 문맥상 보상적 의미이되, 심판과 보응의 뉘앙스를 살리기 위해 ‘상급’을 사용했습니다.
- source_word: πρὸ προσώπου αὐτοῦ
  english_pob_choice: before him
  chosen_korean: 그분 앞에
  alternatives_korean:
  - 그분 앞에
  - 그의 얼굴 앞에
  - 그분 면전에서
  lexicon: πρὸ προσώπου
  rationale: 직역하면 ‘얼굴 앞에’이지만 한국어에서는 어색하므로, 원문의 공간적 전면성을 살려 ‘그분 앞에’로 옮겼습니다.
- source_word: κατὰ τὸ ἔργον αὐτοῦ
  english_pob_choice: according to his work
  chosen_korean: 그 행위대로
  alternatives_korean:
  - 그의 행위대로
  - 그 일대로
  - 그가 한 일에 따라
  lexicon: ἔργον
  rationale: 개인의 행위를 기준으로 한 보응이라는 뜻을 간명하게 드러내기 위해 ‘행위대로’로 옮겼습니다.
theological_decisions:
- issue: 인용문의 주어와 문장 구조를 한국어에서 어떻게 처리할지
  chosen_reading: 주어를 살려 ‘그가 미리 우리에게 말씀하십니다’로 시작하고, 인용문 안에서 종말론적 보응 선언을 직접 제시했습니다.
  alternative_readings:
  - ‘그가 우리에게 미리 말씀하십니다’
  - ‘그가 미리 우리에게 말합니다’
  rationale: 그리스어 προλέγει가 단순 발화가 아니라 앞서 말해 주는 기능을 가지므로, 문장 전체의 권위를 유지하면서도 한국어에서 자연스럽게 읽히도록 구성했습니다.
  doctrine_reference: 성경 인용의 권위와 하나님의 심판/보응 교리
