  source_fidelity: 그리스어의 προτρέπεται(권면하다), πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ(그분을 온 마음으로 믿는), ἀργούς μηδὲ παρειμένους(게으르거나 소홀한), ἐπὶ πᾶν ἔργον ἀγαθόν(모든 선한 일에)을 전반적으로 잘 반영합니다. 다만 원문의 '우리에게'는 권면의 수혜자이므로 한국어 문장에서는 부사격으로 직접 연결하는 편이 정확하고 자연스럽습니다.
  naturalness: 초안의 '우리에게는, ... 권면하십니다'는 주제 표지 '-는'과 쉼표 때문에 문장 연결이 다소 어색합니다. 또한 '게으르거나 나태하다'는 의미가 상당히 겹칩니다. '게으르거나 소홀하지'가 각 그리스어 형용사의 병렬을 더 자연스럽게 구별합니다.
  terminology: '''그분'', ''온 마음으로 믿는'', ''선한 일'', ''권면하십니다''는 현대 한국어 합쇼체와 문맥에 적절합니다. παρειμένους에는 ''나태한''보다 특정 선한 일을 행함에 있어 ''소홀한''이 더 잘 맞습니다.'
  issues:
  - severity: medium
    issue: 문장 연결과 병렬 어휘
    rationale: '''우리에게는''은 이 문장에서 대조적 주제처럼 들리므로 ''우리에게''가 자연스럽습니다. 또한 ''게으르거나 나태하다''는 중복되는 경향이 있어, ἀργούς와 παρειμένους의 구별을 ''게으르거나 소홀하다''로 옮기는 것이 좋습니다.'
