id: 1CLEM.34.4
reference: 1 Clement 34:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: προτρέπεται οὖν ἡμᾶς πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ, μὴ ἀργοὺς μηδὲ παρειμένους εἶναι ἐπὶ πᾶν ἔργον ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/004.yaml
  text: Therefore he urges us, who believe in him with our whole heart, not to be idle or negligent in every good work.
translation:
  language: ko
  text: 그러므로 그분을 온 마음으로 믿는 우리에게는, 모든 선한 일에 게으르거나 나태하지 말라고 권면하십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτρέπεται
  english_pob_choice: he urges
  chosen_korean: 권면하십니다
  alternatives_korean:
  - 촉구하십니다
  - 권고하십니다
  lexicon: προτρέπω
  rationale: 권면하십니다는 단순한 정보 전달보다 적극적인 권고·권면의 뉘앙스를 살리며, 문맥상 공동체를 향한 권면에 자연스럽습니다.
- source_word: πιστεύοντας ἐξ ὅλης τῆς καρδίας ἐπ᾽ αὐτῷ
  english_pob_choice: who believe in him with our whole heart
  chosen_korean: 그분을 온 마음으로 믿는 우리에게는
  alternatives_korean:
  - 그분에게 온 마음으로 믿는 우리에게는
  - 온 마음을 다해 그분을 믿는 우리에게는
  lexicon: πιστεύω + ἐξ ὅλης τῆς καρδίας + ἐπ᾽ αὐτῷ
  rationale: ἐπ᾽ αὐτῷ의 '그분 안에/그분을 향해'라는 관계를 한국어의 '그분을 믿는'으로 자연스럽게 옮기되, ἐξ ὅλης τῆς καρδίας는 '온 마음으로'로 반영했습니다.
- source_word: ἀργοὺς μηδὲ παρειμένους
  english_pob_choice: not to be idle or negligent
  chosen_korean: 게으르거나 나태하지 말라고
  alternatives_korean:
  - 게으르거나 느슨하지 말라고
  - 무기력하거나 소홀하지 말라고
  lexicon: ἀργός + παρειμένος
  rationale: ἀργοὺς는 '게으르다', παρειμένους는 '나태하다/풀어지다'에 가깝기 때문에 두 표현을 병렬로 살려 중복을 피했습니다.
- source_word: ἐπὶ πᾶν ἔργον ἀγαθόν
  english_pob_choice: in every good work
  chosen_korean: 모든 선한 일에
  alternatives_korean:
  - 모든 좋은 일에
  - 모든 선한 행실에
  lexicon: πᾶν ἔργον ἀγαθόν
  rationale: πᾶν은 '모든'으로, ἔργον ἀγαθόν은 윤리적 행위를 가리키는 문맥에 맞게 '선한 일'로 옮겼습니다.
theological_decisions:
- issue: 권면 주체의 처리
  chosen_reading: 본문의 τρί인칭 수동형/중간형 표현을 한국어에서는 자연스럽게 '그분께서 권면하십니다'로 처리했습니다.
  alternative_readings:
  - '''그러므로 우리를 권면합니다''로 일반화'
  - '''따라서 그가 권면합니다''로 직역'
  rationale: 영문 POB의 he는 문맥상 앞선 그리스도/주체를 가리키며, 한국어에서는 대상 중심의 자연스러운 문장으로 옮기는 것이 의미를 더 분명히 합니다.
  doctrine_reference: 문맥상 지시 대상 해석
- issue: 믿음의 방향성과 마음의 전체성
  chosen_reading: '''그분을 온 마음으로 믿는''을 유지해 πιστεύω의 신뢰 관계와 καρδία의 전인적 헌신을 함께 드러냈습니다.'
  alternative_readings:
  - '''그분 안에서 믿는'''
  - '''전심으로 믿는'''
  rationale: 문맥은 단순한 지적 동의가 아니라 전인적 신뢰를 말하므로, '온 마음으로'로 καρδία의 강조를 살렸습니다.
  doctrine_reference: 믿음과 전인적 헌신
