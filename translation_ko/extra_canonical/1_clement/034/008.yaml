id: 1CLEM.34.8
reference: 1 Clement 34:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ· Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν καὶ ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη, ὅσα ἡτοίμασεν τοῖς ὑπομένουσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/008.yaml
  text: For he says[a], “Eye has not seen, and ear has not heard, and it has not entered into the heart of man, the things that he prepared for those who wait for him.”
  footnotes:
  - marker: a
    text: Or 'it has not arisen upon the heart of man'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말씀하십니다[a]. “눈으로 보지 못했고, 귀로 듣지 못했으며, 사람의 마음에 올라오지도 못한 것들을, 그를 기다리는 이들을 위해 하나님께서 예비하셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ
  english_pob_choice: For he says
  chosen_korean: 그가 말씀하십니다
  alternatives_korean:
  - 그가 말합니다
  - 말씀하시기 때문입니다
  lexicon: λέγω
  rationale: 인용 도입부의 말하기 동사를 자연스럽게 옮기되, 성경 문맥에서의 권위 있는 발화라는 점을 살려 ‘말씀하십니다’를 택했습니다.
- source_word: Ὀφθαλμὸς οὐκ εἶδεν καὶ οὖς οὐκ ἤκουσεν
  english_pob_choice: Eye has not seen, and ear has not heard
  chosen_korean: 눈으로 보지 못했고, 귀로 듣지 못했으며
  alternatives_korean:
  - 눈이 보지 못했고, 귀가 듣지 못했으며
  - 눈은 보지 못했고, 귀는 듣지 못했습니다
  lexicon: ὀφθαλμός / οὖς / ὁράω / ἀκούω
  rationale: 헬라어의 관용적 병렬을 한국어에서도 간결하게 유지하면서, 신체 기관을 주어로 삼는 직역조를 피하고 자연스러운 서술로 옮겼습니다.
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  english_pob_choice: it has not entered into the heart of man
  chosen_korean: 사람의 마음에 올라오지도 못한
  alternatives_korean:
  - 사람의 마음에 들어오지도 못한
  - 사람의 마음에 떠오르지도 못한
  lexicon: ἀναβαίνω + ἐπί / καρδία
  rationale: 히브리어식 관용구를 반영해 ‘마음에 떠오르다/오르다’의 의미를 살렸고, 앞선 영어 전승의 ‘entered into the heart’와도 대응되도록 ‘올라오지도 못한’으로 처리했습니다.
- source_word: τοῖς ὑπομένουσιν αὐτόν
  english_pob_choice: for those who wait for him
  chosen_korean: 그를 기다리는 이들을 위해
  alternatives_korean:
  - 그를 참아 기다리는 이들을 위해
  - 그를 인내하며 기다리는 이들을 위해
  lexicon: ὑπομένω
  rationale: ὑπομένω는 단순 대기가 아니라 견디며 기다림을 포함할 수 있으므로, 문맥상 자연한 ‘기다리는’으로 옮기되 의미의 긴장을 과도하게 풀지는 않았습니다.
theological_decisions:
- issue: 하나님을 가리키는 주어의 명시성
  chosen_reading: 문맥상 예언/성경 인용의 발화 주체를 한국어 본문에서는 ‘하나님께서’로 분명히 밝혔습니다.
  alternative_readings:
  - 그가 예비하셨습니다
  - 주님께서 예비하셨습니다
  rationale: 원문은 앞선 인용 맥락의 주체를 생략적으로 이어가므로, 한국어에서는 독자가 발화 주체를 즉시 파악하도록 명시했습니다.
  doctrine_reference: 문맥 명시화의 번역상 보조
