  naturalness: ‘사람의 마음에 올라오지도 못한’은 이해 가능하지만 현대 한국어에서는 다소 직역조입니다. ‘사람의 마음에 떠오르지도 못한’이 자연스럽습니다. 인용 도입의 γάρ는 앞 문맥에 의존하는 접속사이므로 ‘왜냐하면’으로 보존할 수 있습니다.
  terminology: ‘그를 기다리는 이들’은 τοῖς ὑπομένουσιν αὐτόν의 기본 뜻을 유지합니다. 다만 문체상 ‘그분’을 사용해 인용문의 예비하시는 분과의 지시 관계를 드러내되, ‘하나님’이라는 명칭을 본문에 추가하지 않았습니다. ‘말씀하십니다’는 존대 문체에 적절합니다.
