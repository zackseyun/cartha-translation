revisions:
- from: 우리의 자랑과 담대함이 그분 안에 있게 하십시오. 그의 뜻에 우리 자신을 복종시킵시다. 그의 천사들 전체의 무리를 생각해 보십시오. 그들이 어떻게 그의 뜻을 따라 서서 섬기는지 말입니다.
  to: 우리의 자랑과 담대함이 그분 안에 있게 합시다. 그분의 뜻에 우리 자신을 복종시킵시다. 그분의 천사들의 온 무리를 살펴봅시다. 그들이 그분의 뜻을 받들어 곁에 서서 섬기는지를 말입니다.
  rationale: 원문의 연속된 공동체 권면을 한국어 청유형으로 일관되게 유지했습니다. ‘온 무리’는 τὸ πᾶν πλῆθος를, ‘곁에 서서 섬기다’는 παρεστῶτες λειτουργοῦσιν을 반영합니다. 의미상 안전한 범위에서만 자연스러운 한국어 결합을 위해 ‘뜻을 받들어’를 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:46Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 세 권면은 모두 1인칭 복수 권면법/청유적 표현으로 이어집니다(ἔστω, ὑποτασσώμεθα, κατανοήσωμεν). 초안은 마지막 권면을 존대 명령형 ‘생각해 보십시오’로 바꾸어 화자·청자 관점을 불필요하게 전환했습니다. 또한 παρεστῶτες는 천사들이 가까이 서 있는 상태를, λειτουργοῦσιν τῷ θελήματι αὐτοῦ는 그분의 뜻을 받들어 섬기는 행위를 나타냅니다.
  naturalness: ‘우리의 자랑과 담대함이 그분 안에 있게 합시다’와 ‘살펴봅시다’는 현대 표준 한국어의 합쇼체 공동 권면으로 자연스럽습니다. ‘그분의 뜻을 받들어 곁에 서서 섬기는지’는 원문의 두 동작과 관계를 매끄럽게 보존합니다.
  terminology: καύχημα은 ‘자랑’, παρρησία는 ‘담대함’으로 유지할 수 있습니다. λειτουργέω는 여기서 특정 교단적 의미를 덧붙이지 않고 ‘섬기다’로 옮기되, 여격 목적어인 ‘그분의 뜻’과의 자연스러운 결합을 위해 ‘받들어’를 보충했습니다.
  issues:
  - severity: medium
    issue: 권면 인칭의 불일치
    rationale: κατανοήσωμεν은 1인칭 복수 권면법인데, 초안의 ‘생각해 보십시오’는 2인칭 존대 명령입니다. 앞선 ‘복종시킵시다’와도 병렬을 이루도록 ‘살펴봅시다’로 옮겨야 합니다.
  - severity: low
    issue: παρεστῶτες의 공간적 뉘앙스가 약함
    rationale: ‘서서 섬기는지’도 핵심 뜻은 전달하지만, ‘곁에 서서’가 ‘곁에/가까이 서 있는’ παρεστῶτες를 더 충실히 드러냅니다.
  revised_text: 우리의 자랑과 담대함이 그분 안에 있게 합시다. 그분의 뜻에 우리 자신을 복종시킵시다. 그분의 천사들의 온 무리를 살펴봅시다. 그들이 그분의 뜻을 받들어 곁에 서서 섬기는지를 말입니다.
