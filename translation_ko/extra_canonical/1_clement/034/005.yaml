source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ καύχημα ἡμῶν καὶ ἡ παρρησία ἔστω ἐν αὐτῷ· ὑποτασσώμεθα τῷ θελήματι αὐτοῦ· κατανοήσωμεν τὸ πᾶν πλῆθος τῶν ἀγγέλων αὐτοῦ, πῶς τῷ θελήματι αὐτοῦ λειτουργοῦσιν παρεστῶτες.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/005.yaml
  text: Let our boasting and our boldness be in him. Let us submit ourselves to his will. Let us consider the whole multitude of his angels, how they stand by and minister to his will.
translation:
  language: ko
  text: 우리의 자랑과 담대함이 그분 안에 있게 합시다. 그분의 뜻에 우리 자신을 복종시킵시다. 그분의 천사들의 온 무리를 살펴봅시다. 그들이 그분의 뜻을 받들어 곁에 서서 섬기는지를 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καύχημα ἡμῶν
  english_pob_choice: our boasting
  chosen_korean: 우리의 자랑
  alternatives_korean:
  - 우리의 뽐냄
  - 우리의 자랑거리
  lexicon: καύχημα
  rationale: 자랑의 내용 자체를 가리키므로, 과도한 부정어감이 있는 ‘뽐냄’보다 중립적인 ‘자랑’이 원문의 의미와 POB의 직역성을 더 잘 보존합니다.
- source_word: ἡ παρρησία
  english_pob_choice: our boldness
  chosen_korean: 담대함
  alternatives_korean:
  - 확신
  - 당당함
  lexicon: παρρησία
  rationale: 공적이고 거리낌 없는 태도를 가리키는 말이므로, 한국어에서는 ‘담대함’이 가장 자연스럽고 본문 대비가 선명합니다.
- source_word: κατανοήσωμεν
  english_pob_choice: Let us consider
  chosen_korean: 생각해 보십시오
  alternatives_korean:
  - 살펴봅시다
  - 고려합시다
  lexicon: κατανοέω
  rationale: 문맥상 천사들의 질서정연한 섬김을 주의 깊게 관찰하라는 권면이어서, ‘생각해 보십시오’로 자연스럽게 옮겼습니다.
- source_word: λειτουργοῦσιν παρεστῶτες
  english_pob_choice: they stand by and minister
  chosen_korean: 서서 섬기는지
  alternatives_korean:
  - 서서 봉사하는지
  - 곁에 서서 섬기는지
  lexicon: λειτουργέω
  rationale: ‘공적 봉사/섬김’의 의미를 살리되, 천사들이 ‘서 있다’는 동작도 함께 드러나도록 결합해 옮겼습니다.
theological_decisions:
- issue: 권면의 사람 호칭과 명령형의 결합
  chosen_reading: 첫 두 문장은 공동체 권면형으로 번역하고, 뒤의 관찰 권면은 청자 직접 권면 형태로 옮겼습니다.
  alternative_readings:
  - 모두 1인칭 청유로 통일
  - 모두 2인칭 명령형으로 통일
  rationale: 원문은 공동체적 자기결단(ὑποτασσώμεθα)과 관찰 권면(κατανοήσωμεν)을 연속적으로 제시하므로, 한국어에서도 그 기능 차이를 드러내는 것이 적절합니다.
  doctrine_reference: 수사적 명령/청유의 문맥 보존
