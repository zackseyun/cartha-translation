revisions:
- from: 좋은 일꾼은 담대하게 자기 일의 빵을 받습니다. 그러나 나태하고 무기력한 사람은 자기 고용주의 눈을 마주쳐 볼 수 없습니다.
  to: 훌륭한 일꾼은 거리낌 없이 자기 노동으로 얻은 빵을 받습니다. 그러나 나태하고 해이한 사람은 자기 고용주의 눈을 마주 볼 수 없습니다.
  rationale: 노동의 보상이라는 ‘빵’의 비유를 보존하면서 한국어에서 뜻이 분명하도록 속격 관계를 풀었습니다. 또한 나태함과 해이함의 병렬을 통해 νωθρός와 παρειμένος의 구별을 살리고, 고용주 앞에서 정면으로 시선을 맞추지 못하는 수사적 이미지를 자연스럽게 유지했습니다.
  reviewer_model: gpt-5.6-terra
