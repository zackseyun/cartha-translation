id: 1CLEM.34.1
reference: 1 Clement 34:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁ ἀγαθὸς ἐργάτης μετὰ παρρησίας λαμβάνει τὸν ἄρτον τοῦ ἔργου αὐτοῦ, ὁ νωθρὸς καὶ παρειμένος οὐκ ἀντοφθαλμεῖ τῷ ἐργοδότῃ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/001.yaml
  text: The good worker receives with boldness the bread of his labor, but the sluggish and negligent man cannot look his employer in the eye.
translation:
  language: ko
  text: 훌륭한 일꾼은 거리낌 없이 자기 노동으로 얻은 빵을 받습니다. 그러나 나태하고 해이한 사람은 자기 고용주의 눈을 마주 볼 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἐργάτης
  english_pob_choice: The good worker
  chosen_korean: 좋은 일꾼
  alternatives_korean:
  - 선한 일꾼
  - 착한 일꾼
  lexicon: ἀγαθός; ἐργάτης
  rationale: ἀγαθός는 도덕적 선함뿐 아니라 품질이 좋은 상태도 가리킬 수 있어, 문맥상 자연스러운 ‘좋은’으로 옮겼고 ἐργάτης는 직분보다 일반적인 노동자를 가리키므로 ‘일꾼’이 적절합니다.
- source_word: μετὰ παρρησίας
  english_pob_choice: with boldness
  chosen_korean: 담대하게
  alternatives_korean:
  - 용감하게
  - 거리낌 없이
  lexicon: παρρησία
  rationale: παρρησία는 단순한 용기보다 ‘자유롭고 거리낌 없는 담대함’을 뜻하므로, 한국어에서는 간결하게 ‘담대하게’로 옮겨 원문의 힘을 살렸습니다.
- source_word: τὸν ἄρτον τοῦ ἔργου αὐτοῦ
  english_pob_choice: the bread of his labor
  chosen_korean: 자기 일의 빵
  alternatives_korean:
  - 자기 노동의 빵
  - 일해서 얻는 빵
  lexicon: ἄρτος; ἔργον
  rationale: 직역에 가까운 ‘빵’을 유지해 생계와 보상을 함께 드러내고, τοῦ ἔργου는 ‘노동’보다 더 넓은 ‘일’로 옮겨 표현의 자연스러움을 확보했습니다.
- source_word: οὐκ ἀντοφθαλμεῖ
  english_pob_choice: cannot look his employer in the eye
  chosen_korean: 눈을 마주쳐 볼 수 없습니다
  alternatives_korean:
  - 감히 쳐다보지 못합니다
  - 정면으로 바라볼 수 없습니다
  lexicon: ἀντοφθαλμέω
  rationale: 이 동사는 ‘눈을 맞대어 바라보다/정면으로 응시하다’의 뜻이므로, 관용적으로 이해되는 ‘눈을 마주쳐 보다’로 풀어 한국어 독자가 수치심과 위축을 느끼는 뉘앙스를 자연스럽게 받도록 했습니다.
- source_word: τῷ ἐργοδότῃ αὐτοῦ
  english_pob_choice: his employer
  chosen_korean: 자기 고용주
  alternatives_korean:
  - 자기 주인
  - 고용한 사람
  lexicon: ἐργοδότης
  rationale: ἐργοδότης는 고용 관계의 주체를 가리키므로, 현대 독자에게 관계를 분명히 하는 ‘고용주’가 적절합니다. 단, 전통적 위계감이 강한 ‘주인’은 여기서는 과도할 수 있어 배제했습니다.
theological_decisions:
- issue: 노동과 보상의 비유
  chosen_reading: ‘빵’과 ‘일’의 이미지를 유지해 노동의 정당한 열매와 수고의 대가를 드러냈습니다.
  alternative_readings:
  - ‘생계’나 ‘삯’으로 의미를 더 직접 풀어 설명하는 읽기
  rationale: 원문은 일반적 도덕 교훈을 넘어서 노동자의 생계와 태도를 대비시키는 비유적 표현이므로, 이미지 자체를 보존하는 것이 문맥에 충실합니다.
  doctrine_reference: 사회윤리/일상적 권면
- issue: ‘눈을 마주쳐 볼 수 없다’는 수치의 표현
  chosen_reading: 무기력한 자가 고용주 앞에서 위축되고 떳떳하지 못한 상태를 드러내는 표현으로 살렸습니다.
  alternative_readings:
  - ‘고개를 들지 못합니다’
  - ‘부끄러워 쳐다보지 못합니다’
  rationale: ἀντοφθαλμέω의 시선 이미지가 핵심이므로, 단순한 도덕 평가보다 관계적 위축을 드러내는 번역이 원문 효과를 잘 전달합니다.
  doctrine_reference: 수치/위축의 수사
