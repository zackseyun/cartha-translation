review_pass:
  verdict: revise
  source_fidelity: 원문의 대조 구조와 핵심 어휘는 대체로 반영되어 있습니다. 다만 τὸν ἄρτον τοῦ ἔργου αὐτοῦ의 속격은 단순히 ‘자기 일의 빵’이라고 하면 한국어에서 의미 관계가 불분명하므로 ‘자기 노동으로 얻은 빵’으로 밝혀 옮기는 편이 충실합니다. παρειμένος는 여기서 ‘무기력한’보다 의무에 느슨하고 해이한 상태를 가리키므로 ‘해이한’이 더 가깝습니다.
  naturalness: ‘자기 일의 빵’과 ‘눈을 마주쳐 볼 수 없습니다’는 직역의 흔적이 있어 다소 부자연스럽습니다. ‘자기 노동으로 얻은 빵’ 및 ‘고용주의 눈을 마주 볼 수 없습니다’는 원문의 이미지와 관용적 한국어를 함께 살립니다.
  terminology: ἐργοδότης를 현대적 고용 관계를 나타내는 ‘고용주’로 옮긴 것은 적절합니다. ἀγαθὸς ἐργάτης는 도덕적 의미로 한정하지 않고 일의 질을 나타내도록 ‘훌륭한 일꾼’으로 다듬었습니다. παρρησία는 이 문맥에서 ‘거리낌 없이’가 담대함과 자유로운 확신의 뉘앙스를 더 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘자기 일의 빵’의 의미 관계가 불명확함
    rationale: τοῦ ἔργου는 노동에서 나오는 빵, 곧 노동의 대가/생계를 나타냅니다. 한국어의 ‘일의 빵’은 자연스럽지 않고 그 관계를 충분히 드러내지 못합니다.
  - severity: low
    issue: παρειμένος를 ‘무기력한’으로 번역함
    rationale: παρειμένος는 단순한 활력 부족보다는 느슨하고 태만하며 의무를 소홀히 하는 상태를 뜻하므로 ‘해이한’이 문맥과 영어 감사 번역의 ‘negligent’에 더 부합합니다.
  - severity: low
    issue: ‘눈을 마주쳐 볼 수 없습니다’의 어색한 결합
    rationale: ἀντοφθαλμεῖ의 정면으로 눈을 맞대는 이미지는 유지하되, ‘눈을 마주 볼 수 없습니다’가 현대 표준어에서 더 자연스럽습니다.
  revised_text: 훌륭한 일꾼은 거리낌 없이 자기 노동으로 얻은 빵을 받습니다. 그러나 나태하고 해이한 사람은 자기 고용주의 눈을 마주 볼 수 없습니다.
