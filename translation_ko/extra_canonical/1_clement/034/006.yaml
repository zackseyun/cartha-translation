  - severity: low
    issue: σαβαώθ를 ‘사바오스’로 표기함
    rationale: 그리스어 철자를 따른 표기이지만, 표준 한국어 성경 및 신학적 관용 표기는 히브리어 어형에 따른 ‘사바옷’입니다.
  - severity: low
