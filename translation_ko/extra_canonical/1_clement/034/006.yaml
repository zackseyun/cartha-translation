id: 1CLEM.34.6
reference: 1 Clement 34:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γὰρ ἡ γραφή· Μύριαι μυριάδες παρειστήκεισαν αὐτῷ, καὶ χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ ἐκέκραγον· Ἅγιος, ἅγιος, ἅγιος κύριος σαβαώθ, πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/034/006.yaml
  text: For the Scripture says, “Myriads of myriads stood by him, and thousands of thousands ministered to him,” and they cried out, “Holy, holy, holy is the Lord Sabaoth; all creation is full of his glory.”
translation:
  language: ko
  text: 성경이 말씀하기를, 「무수한 무리가 그 곁에 서 있었고, 수천의 수천이 그를 섬기고 있었으며, 그들이 외쳤습니다. “거룩하다, 거룩하다, 거룩하다, 주 사바오스여. 온 피조물이 그의 영광으로 가득합니다.”」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μύριαι μυριάδες
  english_pob_choice: Myriads of myriads
  chosen_korean: 무수한 무리
  alternatives_korean:
  - 만만의 무리
  - 수만의 수만
  - 만의 만
  lexicon: μυριάς
  rationale: English POB의 ‘Myriads of myriads’를 한국어에서 자연스럽고 장중하게 살리기 위해 수량을 문자적으로 계산하기보다 ‘무수한 무리’로 옮겼습니다. 원문의 압도적 다수를 과장 없이 전달합니다.
- source_word: παρειστήκεισαν
  english_pob_choice: stood by him
  chosen_korean: 그 곁에 서 있었고
  alternatives_korean:
  - 그 앞에 서 있었고
  - 그 옆에 서 있었고
  - 그에게 시중들고 있었고
  lexicon: παρίστημι
  rationale: 동사 자체는 단순히 ‘서 있다’는 뜻이므로, 문맥상 보좌/대기하는 자세를 드러내는 ‘그 곁에 서 있었고’로 번역했습니다.
- source_word: ἐλειτούργουν
  english_pob_choice: ministered to him
  chosen_korean: 그를 섬기고 있었으며
  alternatives_korean:
  - 그에게 봉사하고 있었으며
  - 그를 시중들고 있었으며
  - 그를 예배하고 있었으며
  lexicon: λειτουργέω
  rationale: 이 동사는 공적 섬김과 예배적 봉사를 함께 가질 수 있으므로, 과도하게 제도화하지 않고 POB의 ‘ministered to him’을 반영해 ‘섬기고 있었습니다’로 옮겼습니다.
- source_word: κύριος σαβαώθ
  english_pob_choice: the Lord Sabaoth
  chosen_korean: 주 사바오스여
  alternatives_korean:
  - 만군의 주여
  - 만군의 하나님이여
  - 주 만군의 여호와여
  lexicon: κύριος + σαβαώθ
  rationale: 본문은 LXX/전통 인용의 호칭을 보존하므로, ‘Sabaoth’를 음역한 POB 흐름을 따라 ‘사바오스’를 유지했습니다. 호칭 형식은 직접 인용문이므로 감탄형 종결로 처리했습니다.
- source_word: πλήρης πᾶσα ἡ κτίσις τῆς δόξης αὐτοῦ
  english_pob_choice: all creation is full of his glory
  chosen_korean: 온 피조물이 그의 영광으로 가득합니다
  alternatives_korean:
  - 온 창조세계가 그의 영광으로 가득합니다
  - 모든 피조물이 그의 영광으로 충만합니다
  - 전체 피조계가 그의 영광으로 가득합니다
  lexicon: κτίσις
  rationale: κτίσις는 창조물 전체를 가리키므로 ‘피조물’로 옮기되, ‘온’으로 전체성의 강조를 살렸습니다. ‘영광으로 가득합니다’는 원문의 상태 서술을 자연스럽게 반영합니다.
theological_decisions:
- issue: 본절의 직접 인용문 안에서의 호칭 및 감탄형 처리
  chosen_reading: ‘주 사바오스여’처럼 호칭을 살리고, 이어지는 찬송은 직접 발화로서 감탄형/선언형으로 옮겼습니다.
  alternative_readings:
  - ‘주 만군의 하나님이여’로 의역
  - 평서형으로 완화
  rationale: 본문은 천상 예배의 인용을 전면에 두므로, 한국어에서도 호칭의 낯섦을 유지해 원문 인용의 격식을 보존하는 것이 더 충실합니다.
  doctrine_reference: 성경 인용의 문체 보존, 예배 언어의 형식성
