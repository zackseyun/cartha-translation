revisions:
- from: 성경이 말씀하기를, 「무수한 무리가 그 곁에 서 있었고, 수천의 수천이 그를 섬기고 있었으며, 그들이 외쳤습니다. “거룩하다, 거룩하다, 거룩하다, 주 사바오스여. 온 피조물이 그의 영광으로 가득합니다.”」[a][b]
  to: 성경은 이렇게 말합니다. “만만의 무리가 그 앞에 서 있었고, 천천의 무리가 그를 섬기고 있었으며, 그들은 외쳤습니다. ‘거룩하다, 거룩하다, 거룩하다, 주 사바옷이여. 온 창조가 그의 영광으로 가득합니다.’”
  rationale: 원문의 수량 반복(‘만만’, ‘천천’)과 천상 장면의 ‘그 앞에 서 있었다’를 보존했습니다. ‘사바옷’은 음역 호칭을 유지하되 한국어의 통용 표기로 바로잡았고, 인용 구조와 불필요한 주석 앵커를 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:47Z'
review_pass:
  verdict: revise
  source_fidelity: ‘무수한 무리’는 μύριαι μυριάδες(‘만만’, 곧 ‘만의 만’)의 반복된 수량 표현을 일반적 다수로 약화합니다. 또한 σαβαώθ의 한국어 관용 음역은 ‘사바옷’이며, παρειστήκεισαν은 이 천상 법정/예배 장면에서 ‘그 앞에 서 있었다’가 더 적절합니다.
  naturalness: 합쇼체와 인용 구조를 정리하여, 성경의 진술과 그들이 외친 찬송을 명확히 구분했습니다. ‘천천의 무리’는 현대 한국어에서 다소 문어적이지만 원문의 수량 반복과 장중한 인용 문체를 자연스럽게 보존합니다.
  terminology: ‘주 사바옷이여’는 영어 POB의 ‘Lord Sabaoth’ 및 원문의 음역 호칭을 보존하면서 한국어 성경·신학 문헌의 통상 표기인 ‘사바옷’을 사용합니다. κτίσις는 ‘온 창조’로 옮겨 집합적 범위를 드러냈습니다.
  issues:
