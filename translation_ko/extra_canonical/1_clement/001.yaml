base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/001.yaml
  text: 'Because of the sudden and successive misfortunes and crises that have happened to us[1], brothers, we consider that we have been somewhat slow in turning our attention to the matters being raised among you, beloved—namely, the alien and strange, defiled and unholy uprising, foreign to the chosen of God, which a few rash and self-willed persons have kindled to such a pitch of folly that your dignified and renowned name, worthy of love among all people, has been greatly blasphemed.


    For who, after staying among you, did not approve your all-virtuous and steadfast faith? Who did not admire your sober and gentle godliness in Messiah? Who did not proclaim the magnificent character of your hospitality? And who did not count blessed your complete and sure knowledge?


    For you did everything without partiality, and you walked in the lawful ordinances of God, submitting yourselves to your leaders and giving the honor that is fitting to the elders among you. You were permitting the younger men to think thoughts marked by moderation and dignity. And you were instructing the women to carry out all things with a blameless and dignified and pure conscience, loving their own husbands as is fitting; and, being within the rule of submission, to manage the affairs of the household with dignity[3][2], being altogether self-controlled.'
  footnotes:
  - marker: '1'
    text: Or 'dissension,' 'rebellion,' or 'sedition' for στάσις; the term denotes a grave communal rupture, not a minor disagreement.
    reason: lexical_alternative
  - marker: '2'
    text: '''In Messiah'' translates ἐν Χριστῷ with Χριστός understood as a title; many English versions retain ''in Christ.'''
    reason: lexical_alternative
  - marker: '3'
    text: '''Brothers'' renders ἀδελφοί. The address may include the whole congregation, but the Greek form is masculine.'
    reason: cultural_note
translation:
  language: ko
  text: '우리에게 일어난 갑작스럽고 연이은 불행과 곤경 때문에, 형제 여러분, 우리는 여러분 가운데서 제기된 일들에 대해 다소 늦게 돌아보게 되었다고 생각합니다, 사랑하는 여러분. 곧, 하나님의 택하신 이들에게는 낯설고도 이질적인, 더럽고도 불경한 반란입니다. 몇몇 경솔하고 제멋대로인 사람들이 그것을 어리석음의 극한까지 부채질하여, 모든 사람에게 사랑받을 만한 여러분의 품위 있고 널리 알려진 이름이 크게 모독을 당하게 하였습니다.


    여러분 가운데 머물렀던 사람이라면 누가 여러분의 온갖 덕을 갖추고 굳건한 믿음을 칭찬하지 않았겠습니까? 누가 여러분의 절제 있고 온화한, 메시아 안의 경건을 감탄하지 않았겠습니까? 누가 여러분의 환대의 장엄한 품격을 선포하지 않았겠습니까? 또 누가 여러분의 온전하고 확실한 지식을 복되다고 여기지 않았겠습니까?


    여러분은 편파 없이 모든 일을 하였고, 하나님의 합당한 규례를 따라 걸었으며, 여러분의 지도자들에게 순종하고 여러분 가운데 있는 장로들에게 마땅한 존경을 드렸습니다. 또한 젊은 남자들에게는 절제와 품위가 드러나는 생각을 품도록 허락하였습니다. 그리고 여자들에게는 흠 없고 품위 있고 깨끗한 양심으로 모든 일을 행하고, 자기 남편들을 마땅한 대로 사랑하며, 순종의 규범 안에 있으면서 집안일을 품위 있게 돌보고, 온전히 절제하도록 가르치셨습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βράδιον
  english_pob_choice: somewhat slow
  chosen_korean: 다소 늦게
  alternatives_korean:
  - 다소 더디게
  - 조금 늦게
  lexicon: LSJ
  rationale: 사과하는 서두의 지연감을 살리면서도 현대 합쇼체 문맥에 자연스럽게 맞췄습니다.
- source_word: ἐπιστροφὴν πεποιῆσθαι
  english_pob_choice: to turn our attention
  chosen_korean: 돌아보게 되었다
  alternatives_korean:
  - 관심을 돌리게 되었다
  - 다시 돌아오게 되었다
  lexicon: LSJ
  rationale: 물리적 ‘복귀’가 아니라 문제를 다시 주목하는 뜻이므로, 서신체에 맞게 ‘돌아보다’ 계열로 옮겼습니다.
- source_word: στάσεως
  english_pob_choice: uprising
  chosen_korean: 반란
  alternatives_korean:
  - 소요
  - 분열
  - 반역
  lexicon: BDAG
  rationale: 단순한 의견 충돌이 아니라 공동체를 무너뜨리는 गंभीर한 분열을 가리켜, 그 강도를 드러내는 표현을 택했습니다.
- source_word: βλασφημηθῆναι
  english_pob_choice: has been greatly blasphemed
  chosen_korean: 크게 모독을 당하게 하였습니다
  alternatives_korean:
  - 크게 비방을 당하게 하였습니다
  - 크게 훼방을 당하게 하였습니다
  lexicon: BDAG
  rationale: 이름이 당한 심각한 훼손을 살리기 위해 강한 종교적·도덕적 모욕의 뜻을 유지했습니다.
- source_word: ἐν Χριστῷ
  english_pob_choice: in Messiah
  chosen_korean: 메시아 안의
  alternatives_korean:
  - 그리스도 안의
  lexicon: BDAG
  rationale: 본 프로젝트의 용례에 따라 Χριστός의 칭호성을 살려 ‘메시아’로 옮겼습니다.
theological_decisions:
- issue: Χριστός의 칭호 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 영어 POB의 감수 기록과 프로젝트 기본 용례에 맞추어, 고유명사화보다 칭호 의미를 살려야 하는 문맥에서는 ‘메시아’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: ἀδελφοί의 호칭 처리
  chosen_reading: 형제 여러분
  alternative_readings:
  - 형제자매 여러분
  - 여러분
  rationale: 그리스어 형태를 존중하되 한국어 독자에게는 서신적 호칭으로 자연스럽게 들리도록 ‘여러분’을 덧붙였습니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral.'
- issue: αὐθάδη의 성격
  chosen_reading: 제멋대로인
  alternative_readings:
  - 고집 센
  - 거만한
  rationale: 교회 분열을 일으킨 인물들의 자기의지적 성격을 드러내는 말로, 단순한 성격 평가보다 ‘제멋대로’가 문맥상 가장 직접적입니다.
  doctrine_reference: 'PHILOSOPHY.md: Preserve ecclesial language and make reasoning auditable.'
