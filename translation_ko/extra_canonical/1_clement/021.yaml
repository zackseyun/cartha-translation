source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας. . λέγει γάρ που· Πνεῦμα κυρίου λύχνος ἐρευνῶν τὰ ταμιεῖα τῆς γαστρός. 3. ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα. . δίκαιον οὖν ἐστίν, μὴ λειποτακτεῖν ἡμᾶς ἀπὸ τοῦ θελήματος αὐτοῦ. 5. μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ. 6. τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα. 7. τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος ἐνδειξάσθωσαν, τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα ἀποδειξάτωσαν, τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν, τὴν ἀγάπην αὐτῶν μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν
    τοῖς φοβουμένοις τὸν θεὸν ὁσίως ἴσην παρεχέτωσαν. 8. τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ. 9. ἐρευνητὴς γάρ ἐστιν ἐννοιῶν καὶ ἐνθυμήσεων· οὗ ἡ πνοὴ αὐτοῦ ἐν ἡμῖν ἐστίν, καὶ ὅταν θέλῃ, ἀνελεῖ αὐτήν.
  language: Greek
  pages:
  - 291
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021.yaml
  text: See to it[a], beloved, that his many good gifts do not become a judgment against us all, if we do not live in a manner worthy of him and with one accord do what is good and pleasing before him. For somewhere it says, “The Spirit of the Lord is a lamp, searching the storerooms of the belly.” Let us see how near he is, and that none of our thoughts, nor the reasonings we carry on, has escaped his notice. Therefore it is right that we should not desert his will[b]. Rather, let us offend foolish and senseless men, men who are puffed up and boast in the arrogance of their speech, rather than God. Let us have reverence for the Lord Jesus the Messiah, whose blood was given for us; let us respect those who lead us; let us honor the elders; let us train the younger in the discipline of the fear of God; let us direct our women toward what is good. Let them show the lovely character of purity; let them demonstrate the sincere intention of their gentleness; let them make the moderation of their
    tongue evident through silence; let them extend their love not according to partialities, but equally to all who fear God in holiness. Let our children partake of the discipline that is in the Messiah. Let them learn what strength humility has before God, what pure love is able to do before God, how his fear is good and great and saves all who conduct themselves in it in holiness, with a pure mind. For he is a searcher of thoughts and intentions. His breath is in us, and whenever he wills[c][d], he will take it away.
  footnotes:
  - marker: a
    text: The citation echoes Proverbs 20:27. The Greek wording here reads literally, 'The Spirit of the Lord is a lamp, searching the storerooms of the belly.'
    reason: cross_reference
    anchor_ref: '21:2'
  - marker: b
    text: Or 'our wives' for 'our women'; the Greek term can bear either sense depending on context.
    reason: lexical_alternative
    anchor_ref: '21:6'
  - marker: d
    text: '''Breath'' here refers to the life-breath God gives and can remove at will, not necessarily to the Holy Spirit mentioned in the earlier citation.'
    reason: lexical_alternative
    anchor_ref: '21:9'
  - marker: c
    text: Or 'what humility has strength before God'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 이들아, 그의 많은 선하신 은혜가 우리 모두에게 심판이 되지 않도록 주의하십시오. 우리가 그분에 합당하게 살아가며, 한마음으로 그분 앞에서 선하고 기쁜 일을 하지 않는다면 그렇게 될 수 있습니다. 어딘가에 이렇게 말합니다. 「주님의 영은 등불이 되어, 배의 은밀한 곳들을 살피십니다.」 우리가 그분이 얼마나 가까이 계신지, 그리고 우리가 품는 생각들과 우리가 행하는 생각의 논리들이 그분의 눈을 피한 적이 없다는 것을 보도록 합시다. 그러므로 우리는 그분의 뜻을 저버리지 않는 것이 옳습니다. 오히려 우리는 어리석고 무지하며, 자기들의 말의 오만함 속에서 부풀어 오르고 자랑하는 사람들에게 상처를 주는 편이, 하나님께 상처를 주는 것보다 낫습니다. 우리 주 예수 메시아께 경외를 드립시다. 그분의 피가 우리를 위하여 주어졌습니다. 우리를 이끄는 이들을 존중하고, 장로들을 공경하며, 젊은이들을 하나님 경외의 훈련으로 길러 내고, 우리 여자들을 선한 것들을 향하도록 바로잡읍시다. 그들은 순결의 사랑스러운 품성을 나타내고, 온유함의 진실한 뜻을 드러내며, 침묵을 통해 자기들의 혀의 절제됨을 분명히 하고, 편애에 따라 사랑하지 말고, 거룩함 안에서 하나님을 경외하는 모든 이에게 똑같이 사랑을 베풀게 하십시오. 우리 자녀들은 메시아 안에 있는 훈련에 참여하게 하십시오. 그들이 하나님 앞에서 겸손이 얼마나 힘이 있는지, 순수한 사랑이 하나님 앞에서 무엇을 할 수 있는지, 그리고 그분의 경외가 얼마나 선하고 크며, 깨끗한 마음으로 그것 안에서 거룩하게 살아가는 모든 이를 구원하는지를 배우게 하십시오. 그분은 생각과 의도의 살피는 이이십니다. 그분의 숨결은 우리 안에 있으며, 그분께서 원하실 때 그것을 거두어 가실 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐεργεσίαι
  english_pob_choice: good gifts
  chosen_korean: 선하신 은혜
  alternatives_korean:
  - 좋은 선물들
  - 선한 베푸심들
  - 은택
  lexicon: LSJ
  rationale: 하나님으로부터 주어지는 benefaction의 뉘앙스를 살리기 위해 단순한 '좋은 일'보다 은혜/베푸심 계열을 택했습니다. 문맥상 복수의 선물성 은혜이므로 '선하신 은혜'가 자연스럽고 경고의 효과를 유지합니다.
- source_word: πολιτευόμενοι
  english_pob_choice: live in a manner worthy
  chosen_korean: 그분에 합당하게 살아가며
  alternatives_korean:
  - 시민처럼 살아가며
  - 행실을 하며
  - 삶을 다스리며
  lexicon: BDAG
  rationale: 공동체적·윤리적 삶의 방식을 뜻하므로, 직역적 '시민처럼'보다 '합당하게 살아가며'로 옮겨 책임 있는 삶의 요구를 살렸습니다.
- source_word: ὁμονοίας
  english_pob_choice: with one accord
  chosen_korean: 한마음으로
  alternatives_korean:
  - 화합하여
  - 일치하여
  - 동의하여
  lexicon: LSJ
  rationale: 회중적 일치를 강조하는 표현이라 '한마음으로'가 가장 자연스럽고 간결합니다.
- source_word: ταμιεῖα τῆς γαστρός
  english_pob_choice: the storerooms of the belly
  chosen_korean: 배의 은밀한 곳들
  alternatives_korean:
  - 배의 창고들
  - 배의 내실들
  - 배 속 깊은 곳들
  lexicon: LSJ
  rationale: 시편/잠언의 인용에서 신체 내부의 은밀한 공간을 가리키는 시적 비유를 살리되, 한국어에서 지나치게 낯선 '창고' 이미지는 완화했습니다.
- source_word: ἐννοιῶν
  english_pob_choice: thoughts
  chosen_korean: 생각들
  alternatives_korean:
  - 의념들
  - 뜻들
  - 마음의 내용들
  lexicon: BDAG
  rationale: 내면의 인지 내용을 뜻하므로 가장 자연스러운 '생각들'을 택했습니다.
- source_word: διαλογισμῶν
  english_pob_choice: reasonings
  chosen_korean: 생각의 논리들
  alternatives_korean:
  - 이성적 숙고들
  - 분별들
  - 논의들
  lexicon: BDAG
  rationale: ἐννοιῶν과 구별되는 숙고·추론의 측면을 살리기 위해 단순 반복을 피하고 '논리들'로 구분했습니다.
- source_word: προσκόψωμεν
  english_pob_choice: offend
  chosen_korean: 상처를 주는
  alternatives_korean:
  - 걸려 넘어지게 하는
  - 노하게 하는
  - 실족하게 하는
  lexicon: BDAG
  rationale: 대조는 하나님보다 사람을 우선시하는 태도를 지적하는 것이므로, 한국어에서 관계적·도덕적 충돌을 담는 '상처를 주는'을 사용했습니다.
- source_word: ἐντραπῶμεν
  english_pob_choice: have reverence for
  chosen_korean: 경외를 드립시다
  alternatives_korean:
  - 두려워합시다
  - 부끄러워합시다
  - 존중합시다
  lexicon: BDAG
  rationale: 이 문맥에서는 수치심보다 경외와 존중의 결합이 핵심이므로, 예수께 향한 예배적 태도를 드러내는 표현을 택했습니다.
- source_word: παιδεύσωμεν ... τὴν παιδείαν
  english_pob_choice: train ... in the discipline
  chosen_korean: 훈련으로 길러 내고
  alternatives_korean:
  - 훈계로 교육하고
  - 징계로 가르치고
  - 교훈으로 훈련하고
  lexicon: BDAG
  rationale: 반복 어근의 형성과 교정의 뉘앙스를 살리되, 한국어에서 가장 자연스러운 형성어로 옮겼습니다.
- source_word: διορθωσώμεθα
  english_pob_choice: direct
  chosen_korean: 바로잡읍시다
  alternatives_korean:
  - 지도합시다
  - 정돈합시다
  - 인도합시다
  lexicon: LSJ
  rationale: 가정과 삶의 질서를 바로 세우는 의미를 담되, 비난조가 되지 않도록 했습니다.
- source_word: ἀξιαγάπητον
  english_pob_choice: lovely
  chosen_korean: 사랑스러운
  alternatives_korean:
  - 사랑받을 만한
  - 보기 좋은
  - 아름다운
  lexicon: LSJ
  rationale: 칭찬의 형용사로서 '사랑스러운'이 가장 간결하게 가치를 드러냅니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 문맥에서 Χριστός는 고유명사보다 титular force가 살아 있는 호칭이므로 프로젝트 기본어인 '메시아'를 유지했습니다.
  doctrine_reference: 'Project glossary: Χριστός (titular) → 메시아.'
- issue: πνοή의 의미
  chosen_reading: 숨결
  alternative_readings:
  - 영
  - 생명
  - 호흡
  rationale: 이전 인용문의 Πνεῦμα κυρίου와 혼동하지 않도록, 인간에게 주어졌다가 거두어질 수 있는 생명의 호흡으로 구분해야 합니다.
  doctrine_reference: 'Project glossary: πνεῦμα (divine) vs. πνοή (life-breath) distinction.'
