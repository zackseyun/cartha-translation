id: 1CLEM.59.2
reference: 1 Clement 59:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡμεῖς δὲ ἀθῷοι ἐσόμεθα ἀπὸ ταύτης τῆς ἁμαρτίας καὶ αἰτησόμεθα ἐκτενῆ τὴν δέησιν καὶ ἱκεσίαν ποιούμενοι, ὅπως τὸν ἀριθμὸν τὸν κατηριθμημένον τῶν ἐκλεκτῶν αὐτοῦ ἐν ὅλῳ τῷ κόσμῳ διαφυλάξῃ ἄθραυστον ὁ δημιουργὸς τῶν ἁπάντων διὰ τοῦ ἠγαπημένου παιδὸς αὐτοῦ Ἰησοῦ Χριστοῦ, δι᾽ οὗ ἐκάλεσεν ἡμᾶς ἀπὸ σκότους εἰς φῶς, ἀπὸ ἀγνωσίας εἰς ἐπίγνωσιν δόξης ὀνόματος αὐτοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/002.yaml
  text: But we will be innocent of this sin[a], and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact the number of his elect that has been counted throughout the whole world, through his beloved servant Jesus Christ, through whom he called us from darkness into light, from ignorance into the knowledge of the glory of his name,
  footnotes:
  - marker: a
    text: Or 'beloved child Jesus the Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 우리는 이 죄에 대하여 무죄할 것이며, 간절한 간구와 탄원을 드리며, 만물을 지으신 이께서 그의 사랑받는 종 예수 그리스도를 통하여 온 세상에 걸쳐 수를 헤아려 둔 그의 택하신 이들의 수를 흠 없이 지켜 주시기를 구할 것입니다. 그를 통하여 그분은 우리를 어둠에서 빛으로, 무지에서 그분 이름의 영광에 대한 지식으로 부르셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθῷοι ἐσόμεθα
  english_pob_choice: we will be innocent
  chosen_korean: 우리는 이 죄에 대하여 무죄할 것이며
  alternatives_korean:
  - 우리는 이 죄에서 벗어나 있을 것이며
  - 우리는 이 죄에 대해 결백할 것이며
  lexicon: ἀθῷος
  rationale: 문맥상 공동체가 이 죄에 연루되지 않는다는 뜻을 살리기 위해 ‘무죄하다’를 택했습니다. ‘결백하다’보다 죄책의 부재를 더 직접적으로 드러냅니다.
- source_word: ἱκεσίαν
  english_pob_choice: supplication
  chosen_korean: 탄원
  alternatives_korean:
  - 간청
  - 간절한 호소
  lexicon: ἱκεσία
  rationale: δεήσις와 병렬로 놓인 보다 강한 청원어이므로, 단순한 ‘간청’보다 공적·절박한 뉘앙스의 ‘탄원’이 적절합니다.
- source_word: ὁ δημιουργὸς τῶν ἁπάντων
  english_pob_choice: the Creator of all
  chosen_korean: 만물을 지으신 이
  alternatives_korean:
  - 모든 것의 창조자
  - 만물의 창조주
  lexicon: δημιουργός
  rationale: 하나님 호칭으로서의 자연스러운 한국어를 택하되, 원문의 동사적 성격을 살려 ‘지으신 이’로 옮겼습니다.
- source_word: τοῦ ἠγαπημένου παιδὸς αὐτοῦ
  english_pob_choice: his beloved servant
  chosen_korean: 그의 사랑받는 종
  alternatives_korean:
  - 그의 사랑받는 아들
  - 그의 사랑하는 종
  lexicon: παῖς
  rationale: 수정된 영문 본문과 회복된 예언-종(servant) 전승을 따라 ‘종’으로 옮겼습니다. ‘사랑받는’은 ἠγαπημένου의 수동적 의미를 반영합니다.
- source_word: Ἰησοῦ Χριστοῦ
  english_pob_choice: Jesus Christ
  chosen_korean: 예수 그리스도
  alternatives_korean:
  - 예수 메시아
  lexicon: Χριστός
  rationale: 1세기 라틴권·교회적 정착 용례를 고려해 고유명으로 굳어진 ‘그리스도’를 유지했습니다. 이 문맥에서는 титulus보다 이름형이 더 자연스럽습니다.
- source_word: ἐπίγνωσιν
  english_pob_choice: the knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 온전한 지식
  - 충만한 앎
  lexicon: ἐπίγνωσις
  rationale: 최신 영문 개정처럼 의미를 과도하게 강화하지 않고, 원문의 핵심인 ‘앎/지식’을 간결하게 살렸습니다.
theological_decisions:
- issue: παῖς를 '종'으로 옮길지 '아들/어린아이'로 옮길지
  chosen_reading: ‘사랑받는 종 예수 그리스도’로 옮겨 이사야의 주의 종 전승과 초기 기독교 예전적 언어를 보존했습니다.
  alternative_readings:
  - 사랑받는 아들 예수 그리스도
  - 사랑받는 어린아이 예수 그리스도
  rationale: 이 문구는 LXX 이사야의 ‘종’ 언어를 반향하므로, 단순한 친밀성보다 구속사적·예언적 연속성을 드러내는 번역이 더 적합합니다.
  doctrine_reference: 이사야 52:13-53장, 사도행전 3:13
