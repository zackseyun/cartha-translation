revisions:
- from: 그러나 만일 어떤 이들이 우리를 통해 그분이 말씀하신 것들을 거역한다면, 그들은 자기 자신을 범죄와 적지 않은 위험에 얽어매는 줄 알게 하십시오.[a]
  to: 그러나 어떤 이들이 그분께서 우리를 통하여 말씀하신 것들에 불순종한다면, 그들은 자신을 허물과 적지 않은 위험에 얽어매게 될 것을 알아 두어야 합니다.
  rationale: 원문의 중개 표현(‘그분께서 우리를 통하여 말씀하신’), 조건절, 미래의 자기 결박이라는 경고를 보존했습니다. 3인칭 복수 명령법은 한국어에서 자연스러운 ‘알아 두어야 합니다’로 옮겼으며, 논쟁적 교리 해석이나 원문에 없는 법적 의미를 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:55Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 조건절과 경고의 기본 의미는 대체로 반영되어 있습니다. 그러나 γινωσκέτωσαν은 3인칭 복수 명령법으로 ‘그들이 알도록 하라/알아 두게 하라’는 뜻인데, 초안의 ‘알게 하십시오’는 청자를 향한 2인칭 명령으로 바꾸어 주체 관계가 달라집니다. 또한 παράπτωμα는 법률적 ‘범죄’보다 ‘허물/잘못/범과’에 가까운 말입니다.
  naturalness: ‘그들은 … 알아 두어야 합니다’는 현대 표준 한국어 합쇼체에서 3인칭 명령·권고의 의미를 자연스럽게 전달합니다. ‘자기 자신을 … 얽어매는 줄’보다 미래 결과를 드러내는 ‘자신을 … 얽어매게 될 것’이 원문의 미래형과 더 잘 맞습니다.
  terminology: ἀπειθέω는 이 문맥에서 ‘불순종하다’가 가장 직접적이며, παράπτωμα는 ‘허물’로 옮겨 불필요한 형사법적 의미를 피했습니다. κινδύνῳ οὐ μικρῷ의 완곡한 강조는 ‘적지 않은 위험’으로 유지했습니다.
  issues:
  - severity: medium
    issue: γινωσκέτωσαν의 인칭 및 명령 대상
    rationale: 3인칭 복수 명령법을 ‘알게 하십시오’로 옮기면 독자가 누군가에게 그들을 알게 하라는 명령으로 이해할 수 있습니다. 원문은 불순종하는 이들이 그 결과를 알도록 하는 경고입니다.
  - severity: low
    issue: παραπτώσει를 ‘범죄’로 번역
    rationale: παράπτωμα는 일반적으로 허물, 잘못, 범과를 뜻하며 반드시 법률상 범죄를 가리키지 않습니다. ‘범죄’는 원문보다 법적·형사적 뉘앙스를 강하게 합니다.
  - severity: low
    issue: 불필요한 각주 표지 [a]
    rationale: 제공된 각주 내용이 없으므로 표지만 남기지 않는 것이 완결된 본문 형식에 적절합니다.
