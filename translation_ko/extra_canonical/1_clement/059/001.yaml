id: 1CLEM.59.1
reference: 1 Clement 59:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἐὰν δέ τινες ἀπειθήσωσιν τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις, γινωσκέτωσαν, ὅτι παραπτώσει καὶ κινδύνῳ οὐ μικρῷ ἑαυτοὺς ἐνδήσουσιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/001.yaml
  text: But if some disobey the things spoken by him through us, let them know that they will entangle themselves in transgression and in no small danger.
translation:
  language: ko
  text: 그러나 만일 어떤 이들이 우리를 통해 그분이 말씀하신 것들을 거역한다면, 그들은 자기 자신을 범죄와 적지 않은 위험에 얽어매는 줄 알게 하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  english_pob_choice: disobey
  chosen_korean: 거역한다면
  alternatives_korean:
  - 불순종한다면
  - 순종하지 않는다면
  lexicon: ἀπειθέω
  rationale: 단순한 ‘순종하지 않음’보다 권위를 거슬러 거부하는 뉘앙스를 살려, 경고문의 강도를 드러내는 ‘거역하다’를 선택했습니다.
- source_word: τοῖς ὑπ᾽ αὐτοῦ δι᾽ ἡμῶν εἰρημένοις
  english_pob_choice: the things spoken by him through us
  chosen_korean: 그분이 말씀하신 것들을 우리를 통해
  alternatives_korean:
  - 그분께서 우리를 통해 말씀하신 것들을
  - 그분에 의해 우리를 통해 말해진 것들을
  lexicon: λέγω / εἴρηται + 중개구문
  rationale: 직역형의 어순보다, 원문의 ‘그분이 우리를 통해 말씀하신 내용’이라는 중개 관계를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: παραπτώσει
  english_pob_choice: transgression
  chosen_korean: 범죄
  alternatives_korean:
  - 허물
  - 잘못
  - 과실
  lexicon: παράπτωμα
  rationale: 문맥상 단순 실수보다 분명한 위반·죄책을 가리키므로, 한국어에서 가장 직접적인 ‘범죄’를 택했습니다.
- source_word: κινδύνῳ οὐ μικρῷ
  english_pob_choice: in no small danger
  chosen_korean: 적지 않은 위험
  alternatives_korean:
  - 작지 않은 위험
  - 적은 정도가 아닌 위험
  - 지극히 큰 위험
  lexicon: κίνδυνος + οὐ μικρός
  rationale: 완곡한 부정 강조를 살리면서도, 경고의 강도를 과장하지 않도록 ‘적지 않은 위험’으로 옮겼습니다.
theological_decisions:
- issue: 명령문에서의 주체와 청자 관계
  chosen_reading: 후반부의 γινωσκέτωσαν을 공동체가 경고를 받아들이도록 하는 직접 명령으로 보고 ‘알게 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘알아두게 하십시오’
  - ‘그들이 알게 하십시오’
  rationale: 원문은 위반자들에게 결과를 인지시키는 권고형 명령이므로, 한국어에서도 공동체를 향한 실천적 경고로 유지했습니다.
  doctrine_reference: 교회 권징/권면의 문맥(본문 차원의 공동체적 경고)
