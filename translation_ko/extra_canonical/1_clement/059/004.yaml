id: 1CLEM.59.4
reference: 1 Clement 59:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀξιόμεν σε, δέσποτα, βοηθὸν γενέσθαι καὶ ἀντιλήμπτορα ἡμῶν. τοὺς ἐν θλίψει ἡμῶν ῥῦσαι, τοὺς ταπεινοὺς ἐλέησον, τοὺς πεπτωκότας ἔγειρον, τοῖς δεομένοις ἐπιφάνηθι, τοὺς ἀσθενεῖς ἴασαι, τοὺς πλανωμένους τοῦ λαοῦ σου ἐπίστρεψον· χόρτασον τοὺς πεινῶντας, λύτρωσαι τοὺς δεσμίους ἡμῶν, ἐξανάστησον τοὺς ἀσθενοῦντας, παράκαλεσον τοὺς ὀλιγοψυχούντας· γνωτώσαν σε ἅπαντα τὰ ἔθνη, ὅτι σὺ εἶ ὁ θεὸς μόνος καὶ Ἰησοῦς Χριστὸς ὁ παῖς σου καὶ ἡμεῖς λαός σου καὶ πρόβατα τῆς νομῆς σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/004.yaml
  text: We ask you[a], Master, to be our helper and protector. Rescue those of us in affliction, have mercy on the lowly, raise up the fallen, appear to those in need, heal the weak, turn back those of your people who wander. Feed the hungry, redeem our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and Jesus Messiah is your servant, and we are your people and the sheep of your pasture.
  footnotes:
  - marker: a
    text: Or 'turn back the wandering of your people'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 주님, 당신께서 우리의 도우심과 보호자가 되어 주시기를 간청합니다. 환난 가운데 있는 이들을 건져 주시고, 낮은 이들을 긍휼히 여기시며, 넘어져 있는 이들을 일으켜 주시고, 필요한 이들에게 나타나시며, 약한 이들을 고쳐 주시고, 당신의 백성 가운데서 떠도는 이들을 돌이켜 주십시오. 굶주린 이들을 먹이시고, 우리의 갇힌 이들을 속량하시며, 병든 이들을 일으켜 세우시고, 마음이 낙심한 이들을 위로해 주십시오. 모든 민족이 당신만이 하나님이시며, 예수 메시아가 당신의 종이시고, 우리는 당신의 백성이며 당신의 목장의 양이라는 것을 알게 하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιόμεν σε, δέσποτα
  english_pob_choice: We ask you, Master
  chosen_korean: 우리는 주님, 당신께서… 주시기를 간청합니다
  alternatives_korean:
  - 우리는 당신께 간구합니다, 주인님
  - 우리는 주님, 당신께 청합니다
  lexicon: ἀξιόω; δέσποτα
  rationale: δέσποτα는 단순한 ‘주인’보다 상하 관계가 강한 호칭이므로, 한국어에서는 직역적 ‘주님’보다 공손한 청원 전체로 옮기되 호칭의 위계를 살렸습니다.
- source_word: βοηθὸν ... καὶ ἀντιλήμπτορα
  english_pob_choice: helper and protector
  chosen_korean: 도우심과 보호자
  alternatives_korean:
  - 도우심과 돕는 이
  - 도우시는 분과 붙드시는 분
  lexicon: βοηθός; ἀντιλήμπτωρ
  rationale: 두 명사는 기능적으로 겹치지만 완전히 같지는 않으므로, 한국어에서는 ‘도우심’과 ‘보호자’로 구분해 도움과 붙드심의 이중 의미를 살렸습니다.
- source_word: ἐπιφάνηθι
  english_pob_choice: appear
  chosen_korean: 나타나시며
  alternatives_korean:
  - 보여 주시며
  - 드러나시며
  lexicon: ἐπιφαίνω
  rationale: 단순한 시각적 출현보다 ‘필요한 이들에게 나타나시는’ 구원의 현현을 드러내기 위해 ‘나타나시다’를 택했습니다.
- source_word: λύτρωσαι τοὺς δεσμίους ἡμῶν
  english_pob_choice: redeem our prisoners
  chosen_korean: 우리의 갇힌 이들을 속량하시며
  alternatives_korean:
  - 우리의 죄수들을 구원하시며
  - 우리의 포로들을 풀어 주시며
  lexicon: λυτρόω; δεσμίος
  rationale: δεσμίους는 단순히 ‘죄수’보다 ‘갇힌 자들/포로들’에 가깝고, λύτρωσαι는 대가를 치르는 해방의 뉘앙스가 있어 ‘속량하다’로 옮겼습니다.
- source_word: Ἰησοῦς Χριστὸς ὁ παῖς σου
  english_pob_choice: Jesus Messiah is your servant
  chosen_korean: 예수 메시아가 당신의 종이시고
  alternatives_korean:
  - 예수 메시아가 당신의 아들이시고
  - 예수 그리스도가 당신의 종이시고
  lexicon: παῖς; Χριστός
  rationale: παῖς는 여기서 ‘아들’보다 ‘종/종된 자’의 의미가 문맥상 우세하고, Χριστός는 프로젝트 기본어휘에 따라 ‘메시아’로 유지했습니다.
theological_decisions:
- issue: δέσποτα의 호칭 강도와 기도체의 격식
  chosen_reading: ‘주님, 당신께서… 주시기를 간청합니다’로 옮겨, 호칭의 강한 주권성과 청원의 간절함을 함께 살렸습니다.
  alternative_readings:
  - ‘주인님’으로 직접 번역
  - ‘주재자’로 번역
  rationale: 한국어 기도문에서 지나치게 낯선 직역은 의미를 흐릴 수 있어, 존칭 체계 안에서 원문의 위계를 보존하는 방식이 가장 적절합니다.
  doctrine_reference: 1 Clement의 공동체 기도문/그리스도론적 청원
- issue: παῖς σου의 기독론적 번역
  chosen_reading: ‘예수 메시아가 당신의 종이시고’로 번역해, 메시아의 종됨과 종/섬김의 의미를 드러냈습니다.
  alternative_readings:
  - ‘당신의 아들이시고’
  - ‘당신의 종이요 사랑하는 이’
  rationale: 본문의 παῖς는 문맥상 자녀보다 종/종된 존재를 가리키는 방향이 강하므로, 신학적 긴장을 지우지 않기 위해 ‘종’으로 유지했습니다.
  doctrine_reference: 메시아의 종됨과 사역적 복종
