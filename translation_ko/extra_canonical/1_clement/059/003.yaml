id: 1CLEM.59.3
reference: 1 Clement 59:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐλπίζειν ἐπὶ τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου, ἀνοίξας τοὺς ὀφθαλμοὺς τῆς καρδίας ἡμῶν εἰς τὸ γινώσκειν σε τὸν μόνον ὕψιστον ἐν ὑψίστοις, ἅγιον ἐν ἁγίοις ἀναπαυόμενον· τὸν ταπεινοῦντα ὕβριν ὑπερηφάνων, τὸν διαλύοντα λογισμοὺς ἐθνῶν, τὸν ποιοῦντα ταπεινοὺς εἰς ὕψος καὶ τοὺς ὑψηλοὺς ταπεινοῦντα, τὸν πλουτίζοντα καὶ πτωχίζοντα, τὸν ἀποκτείνοντα καὶ ζῳοποιοῦντα καὶ ζῆν ποιοῦντα, μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός· τὸν ἐπιβλέποντα ἐν τοῖς ἀβύσσοις, τὸν ἐπόπτην ἀνθρωπίνων ἔργων, τὸν τῶν κινδυνευόντων βοηθόν, τὸν τῶν ἀπηλπισμένων σωτῆρα, τὸν παντὸς πνεύματος κτίστην καὶ ἐπίσκοπον· τὸν πληθύνοντα ἔθνη ἐπὶ γῆς καὶ ἐκ πάντων ἐκλεγόμενον τοὺς ἀγαπῶντάς σε διὰ Ἰησοῦ Χριστοῦ τοῦ ἠγαπημένου παιδός σου, δι’ οὗ ἡμᾶς ἐπαίδευσας, ἥγιασας, ἐτίμησας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059/003.yaml
  text: to hope in your name[a], the source of all creation, having opened the eyes of our heart so that we might know you, the only Most High among the highest, the Holy One resting among the holy ones; the one who humbles the insolence of the proud, who frustrates the plans of the nations, who exalts the humble and humbles the exalted, who makes rich and makes poor, who kills and gives life, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations on the earth and from among them all chooses those who love you through Jesus Messiah, your beloved servant, through whom you instructed us, sanctified us[b], and honored us.
  footnotes:
  - marker: a
    text: Or 'your name, the source from which all creation first came'.
    reason: previous_rendering
  - marker: b
    text: Or 'holy, resting among the holy'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 이름에 소망을 둡니다[a]. 그것은 모든 창조의 근원이시며, 우리 마음의 눈을 여셔서 우리가 오직 지극히 높으신 이들 가운데 계시는 지극히 높으신 분, 거룩한 이들 가운데 쉬시는 거룩한 분을 알게 하시기 위함입니다. 교만한 자들의 오만을 낮추시고, 민족들의 계획을 무너뜨리시며, 낮은 자를 높이시고 높은 자를 낮추시며, 부요하게도 하시고 가난하게도 하시며, 죽이기도 하시고 살리기도 하시며, 영들의 유일한 은혜의 주인이시며 모든 육체의 하나님이십니다. 깊은 곳을 살피시며, 인간의 행위를 감찰하시는 분, 위험에 처한 이들의 도움자이시며, 소망 없는 이들의 구원자이시며, 모든 영의 창조자이자 감독이십니다. 땅 위에 민족들을 많게 하시고, 그들 모두 가운데서 당신을 사랑하는 이들을 예수 메시아, 당신의 사랑받는 종을 통해 택하셨습니다. 그분을 통해 우리를 가르치시고, 거룩하게 하시고, 존귀하게 하셨습니다[b].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπίζειν ἐπὶ
  english_pob_choice: to hope in
  chosen_korean: 소망을 둡니다
  alternatives_korean:
  - 바랍니다
  - 희망합니다
  lexicon: ἐλπίζω
  rationale: 여기서는 단순한 감정이 아니라 하나님께 대한 신뢰와 기대를 나타내므로, 현대 한국어에서 자연스럽고 신앙적 뉘앙스를 살리는 ‘소망을 두다’로 옮겼습니다.
- source_word: τὸ ἀρχέγονον πάσης κτίσεως ὄνομά σου
  english_pob_choice: the source of all creation
  chosen_korean: 모든 창조의 근원이시며
  alternatives_korean:
  - 모든 창조의 근원이신 이름이시며
  - 모든 피조물의 시작이시며
  lexicon: ἀρχέγονος
  rationale: 영어 POB의 해석을 따르되, Greek의 ‘이름’과 ‘근원’ 사이의 긴장을 살려 이름을 곧 창조의 근원으로 찬양하는 구조를 유지했습니다.
- source_word: ὕψιστον ἐν ὑψίστοις
  english_pob_choice: the only Most High among the highest
  chosen_korean: 오직 지극히 높으신 이들 가운데 계시는 지극히 높으신 분
  alternatives_korean:
  - 지극히 높은 것들 가운데 가장 높으신 분
  - 가장 높은 이들 중 유일하게 높으신 분
  lexicon: ὕψιστος
  rationale: ‘among the highest’의 군사적·위계적 대비를 살리면서, 하나님을 묘사하는 서술적 칭호가 되도록 자연스럽게 다듬었습니다.
- source_word: ἅγιον ἐν ἁγίοις ἀναπαυόμενον
  english_pob_choice: the Holy One resting among the holy ones
  chosen_korean: 거룩한 이들 가운데 쉬시는 거룩한 분
  alternatives_korean:
  - 성도들 가운데 쉬시는 거룩한 이
  - 거룩한 자들 가운데 안식하시는 거룩한 분
  lexicon: ἅγιος
  rationale: 개정된 영어 POB처럼 형용사가 아니라 실질적 호칭으로 읽히도록 ‘거룩한 분’으로 처리했고, ἁγίοις는 복수의 ‘거룩한 이들’로 옮겼습니다.
- source_word: μόνον εὐεργέτην πνευμάτων καὶ θεὸν πάσης σαρκός
  english_pob_choice: the only benefactor of spirits and God of all flesh
  chosen_korean: 영들의 유일한 은혜의 주인이시며 모든 육체의 하나님
  alternatives_korean:
  - 영들의 유일한 은인 이시며 모든 육체의 하나님
  - 영들의 유일한 선하신 분이시며 모든 육체의 하나님
  lexicon: εὐεργέτης
  rationale: εὐεργέτης는 단순한 ‘은인’보다 후원·은혜 베풂의 공적 성격이 있어, 한국어에서 그 의미를 살린 ‘은혜의 주인’으로 옮겼습니다.
theological_decisions:
- issue: Χριστοῦ / 메시아 번역
  chosen_reading: 예수 메시아
  alternative_readings:
  - 예수 그리스도
  - 예수 왕
  rationale: 프로젝트 기본 용례에 따라 Χριστός를 ‘메시아’로 옮겨 예수의 칭호적 의미를 드러냈습니다.
  doctrine_reference: 'POB glossary: Χριστός (titular) = 메시아'
- issue: ἅγιον ἐν ἁγίοις의 구조
  chosen_reading: 거룩한 이들 가운데 쉬시는 거룩한 분
  alternative_readings:
  - 거룩한 자들 가운데 쉬시는 거룩한 분
  - 거룩함 가운데 쉬시는 거룩한 분
  rationale: 수식어 나열이 아니라 하나님을 가리키는 실질적 호칭과 그 거처를 구분해, 본문의 찬양 문법을 한국어로 보존했습니다.
  doctrine_reference: 문법·수사 구조의 보존
