    rationale: ἐλπίζειν은 문맥상 청원에 이어지는 부정사이며, ὄνομά σου는 ‘모든 창조의 근원’과 함께 목적어를 이룹니다. ‘그것은’으로 새 문장을 시작하면 구문과 지시 대상이 불명확해집니다.
