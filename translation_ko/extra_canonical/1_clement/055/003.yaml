translation:
  language: ko
  text: 수많은 여인들이 하나님의 은혜로 힘을 얻어, 많은 용감한 일들을 이루었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλαὶ γυναῖκες
  english_pob_choice: Many women
  chosen_korean: 수많은 여인들
  alternatives_korean:
  - 많은 여자들
  - 많은 여성들
  lexicon: γυνή
  rationale: 문맥상 단순한 성별 표지보다 예시적·서술적 강조가 있어, 현대 한국어에서 자연스럽고 격조 있는 ‘여인들’로 옮겼습니다.
- source_word: ἐνδυναμωθεῖσαι
  english_pob_choice: strengthened
  chosen_korean: 힘을 얻어
  alternatives_korean:
  - 강하게 되어
  - 능력을 받아
  lexicon: ἐνδυναμόω
  rationale: 수동 분사로서 외부로부터 힘을 부여받은 상태를 나타내므로, 직역보다도 원인과 결과가 분명한 ‘힘을 얻어’가 적절합니다.
- source_word: διὰ τῆς χάριτος τοῦ θεοῦ
  english_pob_choice: through the grace of God
  chosen_korean: 하나님의 은혜로
  alternatives_korean:
  - 하나님의 은혜를 통해
  - 하나님의 은혜 덕분에
  lexicon: χάρις
  rationale: διὰ + 속격의 수단/매개 의미를 한국어 조사 ‘-로’로 자연스럽게 반영하고, χάρις는 프로젝트 기본어인 ‘은혜’를 유지했습니다.
- source_word: ἀνδρεῖα
  english_pob_choice: courageous deeds
  chosen_korean: 용감한 일들
  alternatives_korean:
  - 용맹한 일들
  - 남자다운 일들
  lexicon: ἀνδρεῖα
  rationale: 여성에게 적용된 수사적 긴장을 보존하되, 현대어에서 오해를 부르는 성별화 표현은 피하고 핵심 의미인 ‘용감함, 용맹함’을 살렸습니다.
theological_decisions:
- issue: ἀνδρεῖα의 성별 수사와 의미
  chosen_reading: ‘용감한 일들’로 번역해, 여성들이 하나님 은혜로 영웅적 용기를 보였다는 점을 드러냈습니다.
  alternative_readings:
  - ‘남자다운 일들’
  - ‘용맹한 일들’
  rationale: 어근상 ἀνήρ와의 연관은 주석적으로 중요하지만, 본문 의미는 남성성의 칭찬이 아니라 용기와 담대함의 행위입니다. 따라서 성별 고정관념을 재생산하지 않으면서도 수사적 힘을 보존했습니다.
  doctrine_reference: 성경 해석에서 수사적 어원보다 문맥적 의미를 우선하는 원칙
- issue: 하나님의 은혜가 능력의 근원이라는 진술
  chosen_reading: 여인들의 성취를 하나님의 은혜에 직접 연결했습니다.
  alternative_readings:
  - 은혜를 수단으로만 보는 읽기
  - 인간적 역량을 강조하는 읽기
  rationale: 본문의 수동 분사와 전치사구는 행위의 원천이 하나님께 있음을 분명히 하므로, 번역에서도 그 인과 관계를 유지했습니다.
  doctrine_reference: 은혜-능력 연계에 대한 신약적 구원론/성화 이해
