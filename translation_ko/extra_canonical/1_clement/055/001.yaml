id: 1CLEM.55.1
reference: 1 Clement 55:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/001.yaml
  text: 'And so, to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.'
translation:
  language: ko
  text: 그리고 여러 민족에게서도 본보기를 들겠습니다. 많은 왕과 통치자들이 어떤 전염병의 위기가 닥쳤을 때 신탁의 지시를 받고, 자기 자신을 죽음에 내맡겼습니다. 자기들의 피를 통하여 시민들을 구하려는 것이었습니다. 또 많은 이들이 자기 도시를 떠났습니다. 내분이 더 오래 계속되지 않게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθνῶν
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: ἐθνῶν
  rationale: 여기서는 이스라엘-이방 구분의 신학적 대비보다 일반적인 ‘민족들’의 사례 제시가 핵심이므로, 문맥상 자연스럽고 폭넓은 ‘민족들’을 택했습니다.
- source_word: λοιμικοῦ τινος ἐνστάντος καιροῦ
  english_pob_choice: when some pestilential crisis had arisen
  chosen_korean: 어떤 전염병 같은 위기가 닥쳤을 때
  alternatives_korean:
  - 어떤 역병의 때가 닥쳤을 때
  - 전염병 같은 재난이 일어났을 때
  lexicon: λοιμικός / καιρός
  rationale: λοιμικοῦ는 문자적으로 역병/전염병의 성격을 가리키므로, 추상화해도 그 재난성은 살리되 ‘위기’와 결합해 문맥의 비유적 폭을 유지했습니다.
- source_word: χρησμοδοτηθέντες
  english_pob_choice: being instructed by oracles
  chosen_korean: 신탁의 지시를 받고
  alternatives_korean:
  - 신탁을 통해 지시를 받아
  - 신탁의 응답을 받고
  lexicon: χρησμοδοτέω
  rationale: 동사가 ‘신탁을 받아 지시되다’는 뜻이므로, 제의적·예언적 뉘앙스를 살려 ‘신탁의 지시를 받고’로 옮겼습니다.
- source_word: στασιάζωσιν
  english_pob_choice: be torn by faction
  chosen_korean: 분열로 시달리지 않게
  alternatives_korean:
  - 당파 싸움에 휩싸이지 않게
  - 내분이 일어나지 않게
  lexicon: στασιάζω
  rationale: στασίς 계열의 핵심은 단순 갈등보다 공동체 내부의 분열과 소요이므로, 결과 절의 목적을 살려 ‘분열로 시달리지 않게’로 옮겼습니다.
theological_decisions:
- issue: 본문의 ‘왕과 통치자들’이 자발적으로 죽음에 자신을 내맡기는 행위의 의미
  chosen_reading: 이 문장은 순교 찬양이 아니라 공동체 보전을 위해 자발적 희생을 한 이교 세계의 사례를 제시합니다.
  alternative_readings:
  - 영웅적 자기희생 일반
  - 순교적 자기헌신의 직접적 모범
  rationale: 문맥상 클레멘스는 민족들 가운데서도 유익한 사례를 끌어와 교훈을 강화하고 있으며, 그 행위의 종교적 정당성보다 공동체 구제와 분열 방지가 강조됩니다.
  doctrine_reference: 수사적 예시와 덕 윤리의 맥락
