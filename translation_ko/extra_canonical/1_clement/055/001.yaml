revisions:
- from: 그리하여 민족들 가운데서도 본을 들자면, 많은 왕과 통치자들이 어떤 전염병 같은 위기가 닥쳤을 때, 신탁의 지시를 받고 자기들을 죽음에 내맡겼습니다. 이는 자기들의 피로 시민들을 구하려는 것이었습니다. 또한 많은 이들이 자기 도시를 떠났는데, 더 이상 분열로 시달리지 않게 하려는 것이었습니다.[a]
  to: 그리고 여러 민족에게서도 본보기를 들겠습니다. 많은 왕과 통치자들이 어떤 전염병의 위기가 닥쳤을 때 신탁의 지시를 받고, 자기 자신을 죽음에 내맡겼습니다. 자기들의 피를 통하여 시민들을 구하려는 것이었습니다. 또 많은 이들이 자기 도시를 떠났습니다. 내분이 더 오래 계속되지 않게 하려는 것이었습니다.
  rationale: 원문의 수사적 전환(‘그리고’), 이방 세계의 사례 제시, 신탁을 받은 뒤의 자기희생, 그리고 도시를 떠난 목적을 유지했습니다. 마지막 목적절은 στασιάζωσιν의 능동적 내분 의미와 ἐπὶ πλεῖον의 지속성을 반영하도록 고쳤습니다. 내용 없는 주석 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:52Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 논지와 순서를 잘 반영합니다. 다만 στασιάζωσιν은 ‘분열로 시달리다’라는 수동적 상태보다 ‘내분/당파 싸움을 일으키다·계속하다’라는 능동적 행위를 가리키므로 수정이 필요합니다. ἐπὶ πλεῖον의 ‘더 오래/더 심하게’라는 비교적 증대의 뜻도 명시하는 편이 정확합니다.
  naturalness: ‘민족들 가운데서도 본을 들자면’과 ‘전염병 같은 위기’는 다소 어색하거나 의미 범위가 흐립니다. 현대 표준어 합쇼체에서는 ‘여러 민족에게서 본보기를 들겠습니다’, ‘어떤 전염병의 위기가 닥쳤을 때’가 더 자연스럽습니다.
  terminology: ‘신탁의 지시를 받고’, ‘죽음에 내맡겼습니다’, ‘자기들의 피를 통하여’, ‘시민들’은 적절합니다. ἐθνῶν은 이 문맥에서 특정 신학적 ‘이방인’ 대조를 강제하지 않으므로 ‘여러 민족’으로 옮길 수 있습니다.
  issues:
  - severity: medium
    issue: στασιάζωσιν을 ‘분열로 시달리지 않게’로 번역함
    rationale: 원문은 도시의 구성원들이 내분 또는 당파 싸움을 계속 벌이는 것을 막는다는 뜻입니다. ‘시달리다’는 행위 주체와 능동적 의미를 약화합니다.
  - severity: low
    issue: ἐπὶ πλεῖον의 증대·지속 의미가 충분히 드러나지 않음
    rationale: ‘더 이상’도 문맥상 가능하지만, 여기서는 ‘더 오래’ 또는 ‘더 심하게’ 내분하지 않도록 한다는 뜻을 살리는 것이 좋습니다.
  - severity: low
    issue: 문장 끝의 [a]에 대응하는 번역 주석이 없음
    rationale: 제공된 주석 내용이 없으므로 근거 없는 표지를 제거하여 본문과 주석 세트를 일치시킵니다.
  revised_text: 그리고 여러 민족에게서도 본보기를 들겠습니다. 많은 왕과 통치자들이 어떤 전염병의 위기가 닥쳤을 때 신탁의 지시를 받고, 자기 자신을 죽음에 내맡겼습니다. 자기들의 피를 통하여 시민들을 구하려는 것이었습니다. 또 많은 이들이 자기 도시를 떠났습니다. 내분이 더 오래 계속되지 않게 하려는 것이었습니다.
