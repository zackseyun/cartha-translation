id: 1CLEM.55.4
reference: 1 Clement 55:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἰουδὶθ ἡ μακαρία, ἐν συγκλεισμῷ οὔσης τῆς πόλεως, ᾐτήσατο παρὰ τῶν πρεσβυτέρων ἐαθῆναι αὐτὴν ἐξελθεῖν εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/004.yaml
  text: The blessed Judith[a], when the city was under siege, asked the elders to permit her to go out into the camp of the foreigners.
  footnotes:
  - marker: a
    text: Or 'asked from the elders'.
    reason: previous_rendering
translation:
  language: ko
  text: 복된 유디트는 성읍이 포위되어 있을 때, 장로들에게 그녀가 나가 이방인들의 진영으로 들어가도록 허락해 달라고 요청했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰουδὶθ ἡ μακαρία
  english_pob_choice: The blessed Judith
  chosen_korean: 복된 유디트
  alternatives_korean:
  - 복 있는 유디트
  - 축복받은 유디트
  lexicon: 인명/형용사
  rationale: μακαρία는 단순한 감정적 ‘복됨’보다 신적 복을 받은 상태를 가리키므로, 문맥을 살려 ‘복된’으로 옮겼고 고유명사는 현대 표기법에 따라 ‘유디트’로 적었습니다.
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  english_pob_choice: when the city was under siege
  chosen_korean: 성이 포위된 동안
  alternatives_korean:
  - 도성이 봉쇄된 동안
  - 성이 포위 상태에 있을 때
  lexicon: 구문/상황 묘사
  rationale: συγκλεισμός는 단순한 폐쇄보다 적의 포위로 인해 갇힌 상황을 가리키므로, 자연스러운 한국어로 ‘포위된 동안’이라 옮겼습니다.
- source_word: παρὰ τῶν πρεσβυτέρων
  english_pob_choice: asked the elders
  chosen_korean: 장로들에게
  alternatives_korean:
  - 장로들로부터
  - 장로들에게서
  lexicon: 전치사/대상
  rationale: παρά + 속격의 ‘~에게서/로부터’가 있지만, 여기서는 요청의 대상이므로 한국어 동사 ‘요청하다’와 함께 ‘장로들에게’로 풀어 자연스럽게 처리했습니다.
- source_word: ἐαθῆναι αὐτὴν ἐξελθεῖν
  english_pob_choice: to permit her to go out
  chosen_korean: 자신이 나가서
  alternatives_korean:
  - 그녀가 나가도록
  - 그녀를 내보내도록
  lexicon: 동사구
  rationale: 수동부정사 ἐαθῆναι는 ‘허락받다’의 의미이므로, 한국어에서는 문장 전체를 ‘허락해 달라고 요청하다’로 자연스럽게 재구성했습니다.
- source_word: εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων
  english_pob_choice: into the camp of the foreigners
  chosen_korean: 이방인들의 진영으로
  alternatives_korean:
  - 외국인들의 진영으로
  - 낯선 민족들의 진영으로
  lexicon: 명사구
  rationale: παρεμβολή는 군사적 ‘진영’이고, ἀλλόφυλοι는 이스라엘 관점에서 ‘이방인들’이므로 그 긴장을 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 유디트 서술의 평가적 형용사 μακαρία
  chosen_reading: ‘복된’은 인물의 도덕적 칭찬만이 아니라 하나님의 복을 받은 서술로 읽히도록 유지했습니다.
  alternative_readings:
  - ‘행복한’으로 약화해서 번역
  - 단순한 수식어로 처리
  rationale: 본문은 서사적 평가를 담은 칭찬 표현이므로, 한국어에서도 그 신학적·서술적 무게를 보존하는 편이 적절합니다.
  doctrine_reference: 축복/복됨의 성서적 서술
- issue: ‘이방인들’의 민족적 구분
  chosen_reading: ἀλλοφύλοι를 중성화하지 않고 ‘이방인들’로 옮겨, 본문이 전제하는 이스라엘-타민족 경계를 드러냈습니다.
  alternative_readings:
  - ‘외국인들’로 완화
  - ‘낯선 사람들’로 일반화
  rationale: 문맥상 군사적 상대 진영을 가리키며, 단순 국적보다 언약 공동체 바깥의 타자를 가리키는 뉘앙스를 유지해야 합니다.
  doctrine_reference: 성서의 언약적 타자 구분
