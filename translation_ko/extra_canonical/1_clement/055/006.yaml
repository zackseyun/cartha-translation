revisions:
- from: 믿음에 온전한 에스더도 마찬가지로 자기 자신을 위험에 내맡겨, 멸망하려 하던 이스라엘의 열두 지파를 구해 내려고 했습니다. 그는 금식과 스스로를 낮춤으로 모든 것을 살피시는 주, 곧 영원들의 하나님께 간구했으며, 그분은 그녀의 영의 낮아짐을 보시고, 그녀가 위험을 무릅쓴 그 백성을 구하셨습니다.[a][b][c]
