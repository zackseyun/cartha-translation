  text: οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/006.yaml
  text: And no less also Esther[a], perfect according to faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, who were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[c][b], rescued the people for whose sake she had faced danger.
  footnotes:
  - marker: a
    text: Or 'perfect according to faith'.
    reason: previous_rendering
  - marker: b
    text: Or 'the twelve-tribed people'.
    reason: previous_rendering
  - marker: c
    text: Or 'humiliation'.
    reason: previous_rendering
translation:
  language: ko
  text: 믿음에 온전한 에스더도 마찬가지로 자기 자신을 위험에 내맡겨, 멸망하려 하던 이스라엘의 열두 지파를 구해 내려고 했습니다. 그는 금식과 스스로를 낮춤으로 모든 것을 살피시는 주, 곧 영원들의 하나님께 간구했으며, 그분은 그녀의 영의 낮아짐을 보시고, 그녀가 위험을 무릅쓴 그 백성을 구하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πίστιν
  english_pob_choice: perfect according to faith
  chosen_korean: 믿음에 온전한
  alternatives_korean:
  - 믿음대로 온전한
  - 믿음에 따라 완전한
  lexicon: κατά + πίστις
  rationale: κατά는 이 문맥에서 ‘~에 따라/근거하여’의 의미로 읽히므로, ‘믿음에 온전한’으로 옮겨 원문의 관계를 드러냈습니다.
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραήλ
  english_pob_choice: the twelve tribes
  chosen_korean: 이스라엘의 열두 지파
  alternatives_korean:
  - 이스라엘의 열두 지파들
  - 이스라엘의 열두 부족
  lexicon: δωδεκάφυλον
  rationale: δωδεκάφυλον은 집합명사로서 ‘열두 지파’라는 공동체 전체를 가리키므로, 한국어에서도 자연스럽고 정확한 집합 표현을 택했습니다.
- source_word: τῆς ταπεινώσεως
  english_pob_choice: humiliation
  chosen_korean: 스스로를 낮춤
  alternatives_korean:
  - 겸비
  - 자기 낮춤
  - 겸손하게 함
  lexicon: ταπείνωσις
  rationale: 금식과 병렬되는 자발적 자기 낮춤의 의미가 핵심이므로, 수동적·모욕적 뉘앙스가 강한 ‘굴욕’ 계열 대신 ‘스스로를 낮춤’을 사용했습니다.
- source_word: τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς
  english_pob_choice: the humility of her soul
  chosen_korean: 그녀의 영의 낮아짐
  alternatives_korean:
  - 그녀의 마음의 낮아짐
  - 그녀의 영혼의 겸비
  lexicon: ταπεινός + ψυχή
  rationale: ψυχή를 문맥상 인간 내면의 생명/자아로 보아 ‘영’으로 풀어, 겸허한 내적 태도를 한국어로 전달했습니다.
theological_decisions:
- issue: 에스더의 기도 대상 표현
  chosen_reading: “모든 것을 살피시는 주, 곧 영원들의 하나님”으로 옮겨, 헬라어의 중첩된 호칭을 유지했습니다.
  alternative_readings:
  - ‘만물을 살피시는 주 하나님’
  - ‘영원하신 하나님’
  rationale: δεσπότης와 θεὸς τῶν αἰώνων을 한 호칭으로 평탄화하지 않고 병렬적으로 드러내어, 원문이 강조하는 하나님의 주권성과 영원성을 함께 보존했습니다.
  doctrine_reference: 하나님의 주권과 영원성
- issue: ‘그녀의 영의 낮아짐’의 해석
  chosen_reading: 내면의 자발적 자기 낮춤을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 외적 수치
  - 단순한 겸손
  rationale: 본문의 νηστεία와 함께 나온 ταπείνωσις는 자발적 금식 수행과 연결되므로, 수치심이 아니라 하나님 앞에서의 의도적 낮아짐으로 읽는 것이 적절합니다.
  doctrine_reference: 경건의 자기 겸비
