id: 1CLEM.55.5
reference: 1 Clement 55:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/005.yaml
  text: So then[a], handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.
  footnotes:
  - marker: a
    text: Or 'giving herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord delivered Holofernes into the hand of a woman.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 그녀는 위험에 자신을 내맡기고 나가서, 자신의 고향과 포위된 백성을 사랑했기 때문입니다. 그리고 주께서 홀로페르네스를 여자의 손에 넘기셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοῦσα ἑαυτὴν τῷ κινδύνῳ
  english_pob_choice: handing herself over to danger
  chosen_korean: 위험에 자신을 내맡기고
  alternatives_korean:
  - 위험에 자신을 내주고
  - 위험에 자신을 맡기고
  lexicon: παραδίδωμι
  rationale: 본문의 ‘자기 자신을 내어줌/넘겨줌’ 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 문학적인 합쇼체로 옮겼습니다.
- source_word: δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ
  english_pob_choice: because of love for her homeland and for the people
  chosen_korean: 자신의 고향과 포위된 백성을 사랑했기 때문입니다
  alternatives_korean:
  - 조국과 백성을 사랑했기 때문입니다
  - 고향과 그 백성을 사랑했기 때문입니다
  lexicon: ἀγάπη / πατρίς / λαός
  rationale: δι’ ἀγάπην은 원인·동기로서 ‘~했기 때문입니다’로 풀었고, πατρίς는 여기서 ‘조국’보다 문맥상 덜 관념적인 ‘고향’이 자연스러워 보였습니다.
- source_word: τοῦ ὄντος ἐν συγκλεισμῷ
  english_pob_choice: the people who were under siege
  chosen_korean: 포위된 백성
  alternatives_korean:
  - 포위 속에 있던 백성
  - 포위당한 백성
  lexicon: συγκλεισμός
  rationale: ‘포위된’으로 수동적 상태를 분명히 하여, 성읍이 포위된 상황을 간결하게 전달했습니다.
- source_word: παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας
  english_pob_choice: the Lord handed Holofernes over into the hand of a woman
  chosen_korean: 주께서 홀로페르네스를 여자의 손에 넘기셨습니다
  alternatives_korean:
  - 주께서 홀로페르네스를 한 여자의 손에 넘기셨습니다
  - 주님께서 홀로페르네스를 여인의 손에 넘기셨습니다
  lexicon: παραδίδωμι / κύριος
  rationale: 앞 절의 παραδοῦσα와 같은 동사를 ‘넘기셨습니다’로 맞추어 반복 효과를 살렸고, ἐν χειρὶ θηλείας는 직역 성격을 유지하되 한국어로는 ‘여자의 손에’가 가장 직접적입니다.
theological_decisions:
- issue: κύριος의 표기
  chosen_reading: 주께서
  alternative_readings:
  - 주님께서
  - 야훼께서
  rationale: 이 문맥의 κύριος는 서술적 칭호로 쓰였으며, 1 클레멘스 본문 자체는 구약 인용 표지를 명시하지 않으므로 기본적으로 ‘주’로 옮겼습니다.
  doctrine_reference: 기본 용례 원칙; 구약 인용 시 야훼 표기는 명시적 인용/알루전이 필요합니다.
