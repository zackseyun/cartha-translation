id: 1CLEM.55.2
reference: 1 Clement 55:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπιστάμεθα πολλοὺς ἐν ἡμῖν παραδεδωκότας ἑαυτοὺς εἰς δεσμά, ὅπως ἑτέρους λυτρώσωνται· πολλοὶ ἑαυτοὺς παρέδωκαν εἰς δουλείαν, καὶ λαβόντες τὰς τιμὰς αὐτῶν ἑτέρους ἐψώμισαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055/002.yaml
  text: We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery, and after receiving the price for themselves, they fed others.
translation:
  language: ko
  text: 우리는 우리 가운데 많은 이들이 다른 이들을 속량하기 위해 스스로를 쇠사슬에 넘겼다는 것을 압니다. 많은 이들이 스스로를 노예 상태에 내어주었고, 자기들을 위한 값을 받은 뒤 다른 이들을 먹여 살렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδεδωκότας ἑαυτοὺς εἰς δεσμά
  english_pob_choice: handed themselves over to chains
  chosen_korean: 스스로를 쇠사슬에 넘겼다는 것
  alternatives_korean:
  - 스스로를 쇠사슬에 내어주었다는 것
  - 자기들을 쇠사슬에 넘겼다는 것
  lexicon: παραδίδωμι / δεσμά
  rationale: ‘넘기다’와 ‘쇠사슬’로 자발적 투항과 구속 상태를 함께 드러냈습니다. “내어주다”도 가능하지만, 본문은 타인을 위해 자신을 구속에 맡긴 행위를 강조하므로 더 직접적인 표현을 택했습니다.
- source_word: ἑτέρους λυτρώσωνται
  english_pob_choice: so that they might ransom others
  chosen_korean: 다른 이들을 속량하기 위해
  alternatives_korean:
  - 다른 이들을 구속하기 위해
  - 다른 이들을 대속하기 위해
  lexicon: λυτρόω
  rationale: 문맥상 단순한 ‘구출’보다 값으로 풀어주는 의미가 분명하므로 ‘속량’이 가장 가깝습니다. ‘대속’은 신학적 색채가 강해 여기서는 동사적 의미를 살리기 위해 피했습니다.
- source_word: εἰς δουλείαν
  english_pob_choice: into slavery
  chosen_korean: 노예 상태에
  alternatives_korean:
  - 종살이에
  - 종의 신분에
  - 노예로
  lexicon: δουλεία
  rationale: POB의 ‘slavery’에 대응해 bonded status를 분명히 드러내는 ‘노예 상태’를 택했습니다. 이 단락은 자발적 자기 헌신의 극단성을 강조하므로 완곡한 ‘종살이’보다 직설적 표현이 적절합니다.
- source_word: λαβόντες τὰς τιμὰς αὐτῶν
  english_pob_choice: after receiving the price for themselves
  chosen_korean: 자기들을 위한 값을 받은 뒤
  alternatives_korean:
  - 자기들의 값을 받은 뒤
  - 그들의 값을 받은 뒤
  - 자기들에 대한 대가를 받은 뒤
  lexicon: τιμή
  rationale: τιμάς는 여기서 명예가 아니라 ‘값/대가’의 뜻으로 보이므로, 문맥을 살려 ‘값’을 사용했습니다. 소유대명사 αὐτῶν은 ‘자기들을 위한’으로 옮겨, 그 값이 자신과 관련된 것임을 드러냈습니다.
theological_decisions:
- issue: 자기희생의 성격과 구속 언어
  chosen_reading: 본문은 타인을 위한 실제적 자기희생과 값으로 풀어주는 행위를 함께 말하며, 이를 중화하지 않고 ‘속량’과 ‘노예 상태’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 덕행 일반을 가리키는 비유로 완화
  - ‘구원’ 중심으로 재표현
  rationale: 헬라어 동사들이 지닌 구속·대가·헌신의 긴장을 유지하는 것이 문맥과 수사에 더 충실합니다.
  doctrine_reference: 1 Clement 55:2 문맥의 순교적 자기헌신
