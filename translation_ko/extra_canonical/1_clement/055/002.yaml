review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 εἰς δεσμά는 자발적으로 결박/구금 상태에 들어간다는 뜻인데, ‘쇠사슬에 넘겼다’는 한국어 결합이 다소 부자연스럽습니다. 또한 τὰς τιμὰς αὐτῶν은 문맥상 자신들을 노예로 내어준 대가, 곧 ‘몸값’을 가리키므로 그렇게 명시하는 편이 자연스럽고 정확합니다.
  naturalness: ‘스스로를 쇠사슬에 넘겼다’, ‘노예 상태에 내어주었다’, ‘자기들을 위한 값’은 모두 직역의 흔적이 있어 현대 표준 한국어로 매끄럽지 않습니다. ‘스스로를 결박에 내주다’, ‘스스로를 노예로 내주다’, ‘자신들의 몸값’이 문맥과 문체에 더 잘 맞습니다.
  terminology: ‘속량’은 λυτρώσωνται의 값으로 풀어 준다는 의미를 적절히 보존합니다. δουλεία는 ‘노예 상태’보다 ‘노예로’가 문장 안에서 자연스럽고 의미도 충분히 전달합니다. τιμάς는 여기서 명예가 아니라 자기 자신에 대해 받은 대가이므로 ‘몸값’이 적절합니다.
  issues:
