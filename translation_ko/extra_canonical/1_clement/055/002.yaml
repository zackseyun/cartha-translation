    issue: ‘쇠사슬에 넘겼다’라는 표현
    rationale: παραδεδωκότας ἑαυτοὺς εἰς δεσμά의 자발적 자기 내맡김을 전달하려 하나, 한국어에서는 무엇을 ‘쇠사슬에 넘긴다’고 하지 않아 어색합니다. ‘결박에 내주다’가 더 자연스럽습니다.
  - severity: medium
    issue: ‘자기들을 위한 값’
    rationale: τὰς τιμὰς αὐτῶν은 자신들을 노예로 내어준 데 대해 받은 값을 뜻합니다. ‘자신들의 몸값’이 소유 관계와 매매 문맥을 더 분명하고 자연스럽게 나타냅니다.
