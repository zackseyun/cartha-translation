    issue: 포르투나토스가 ‘우리에게서 보낸 사람들’에 포함되는 범위가 불명확합니다.
    rationale: 그리스어의 이름 열거와 σύν 구문은 포르투나토스도 파견된 일행의 일부로 제시합니다. 초안의 ‘A와 B를 F와 함께’는 한국어에서 F를 별도의 동행자로 읽게 할 수 있으므로, 세 이름을 파견된 사람들의 동격으로 열거하는 것이 안전합니다.
  - severity: low
