  source_fidelity: 원문의 τοὺς ἀπεσταλμένους(‘우리에게서 보낸 사람들’)은 클라우디오스 에페보스, 발레리오스 비톤, 그리고 포르투나토스 세 사람 전체를 가리키는 것으로 읽는 것이 자연스럽습니다. 초안의 ‘클라우디오스 에페보스와 발레리오스 비톤을 포르투나토스와 함께’도 가능한 표현이지만, 포르투나토스가 앞의 두 사람과 별도로 동행할 뿐 ‘우리에게서 보낸 사람들’에는 속하지 않는 듯한 여지를 남깁니다. 세 사람을 동격으로 명시하는 편이 원문의 범위를 더 충실히 보존합니다. 문두의 δέ는 한국어에서 반드시 대조 접속사 ‘그런데’로 옮길 필요가 없는 가벼운 연결사입니다.
  naturalness: ‘평안과 기쁨 가운데 속히 우리에게 돌려보내 주십시오’는 현대의 정중한 합쇼체로 자연스럽고, 요청의 어조도 보존합니다. 인명들을 ‘곧’ 뒤에 동격으로 배열하면 문장 구조와 수식 범위가 더욱 명료해집니다.
  terminology: ‘돌려보내다’는 ἀναπέμψατε의 귀환·회송 의미를 잘 반영합니다. 인명 표기는 초안의 그리스어 계열 음역을 유지하여 불필요한 표기 체계 변경을 피했습니다.
  issues:
