  text: Now send back to us quickly, in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—
translation:
  language: ko
  text: 우리에게서 보낸 사람들, 곧 클라우디오스 에페보스와 발레리오스 비톤 그리고 포르투나토스를 평안과 기쁨 가운데 속히 우리에게 돌려보내 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεσταλμένους
  english_pob_choice: the men sent from us
  chosen_korean: 우리에게서 보낸 사람들
  alternatives_korean:
  - 우리에게서 파송된 사람들
  - 우리에게서 보낸 자들
  lexicon: ἀποστέλλω
  rationale: 완료분사로서 이미 ‘보내진’ 상태를 나타내므로, 한국어에서는 관계절처럼 자연스럽게 ‘우리에게서 보낸 사람들’로 옮겨 현재 요청의 대상이 누구인지 분명히 했습니다.
- source_word: ἐν εἰρήνῃ μετὰ χαρᾶς
  english_pob_choice: in peace and with joy
  chosen_korean: 평안과 기쁨 가운데
  alternatives_korean:
  - 평안하고 기쁜 마음으로
  - 평화와 기쁨 속에
  lexicon: εἰρήνη / χαρά
  rationale: 두 전치사구의 병렬을 한국어에서도 한 덩어리로 살려 ‘평안과 기쁨 가운데’로 간결하게 처리했습니다.
- source_word: ἐν τάχει ἀναπέμψατε
  english_pob_choice: send back ... quickly
  chosen_korean: 속히 … 돌려보내십시오
  alternatives_korean:
  - 빨리 … 보내십시오
  - 재빨리 … 돌려보내십시오
  lexicon: ἀναπέμπω
  rationale: ἀναπέμπω는 단순한 ‘보내다’보다 ‘되돌려 보내다’의 뉘앙스가 있어 ‘돌려보내십시오’로 옮겼고, ἐν τάχει는 ‘속히’로 자연스럽게 표현했습니다.
- source_word: Κλαύδιον Ἔφηβον καὶ Οὐαλέριον Βίτωνα ... Φορτουνάτῳ
  english_pob_choice: Claudius Ephebus and Valerius Bito, together with Fortunatus
  chosen_korean: 클라우디오스 에페보스와 발레리오스 비톤을 포르투나토스와 함께
  alternatives_korean:
  - 클라우디우스 에페부스와 발레리우스 비토를 포르투나투스와 함께
  - 클라우디오스 에페보스와 발레리우스 비톤, 그리고 포르투나토스
  lexicon: 고유명사 음역
  rationale: 그리스어 인명은 현대 외래어 표기법에 맞춰 음역하되, 이미 교회권에서 널리 알려진 형태와 너무 어긋나지 않도록 조정했습니다.
theological_decisions:
- issue: 이 구절의 화행은 축복문이 아니라 공동체적 요청입니다.
  chosen_reading: 명령형 청유가 아닌 정중한 부탁형으로 옮겼습니다.
  alternative_readings:
  - 명령형으로 옮김
  - 간청조로 과장함
  rationale: 본문의 ἀναπέμψατε는 분명한 요청이지만, 편지 맥락상 상대를 압박하는 명령조보다 정중한 합쇼체 부탁이 더 정확합니다.
  doctrine_reference: 서신체 화행 보존
