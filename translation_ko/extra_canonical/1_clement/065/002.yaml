id: 1CLEM.65.2
reference: 1 Clement 65:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὅπως θᾶττον τὴν εὐξαπεῖσαν καὶ
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/065/002.yaml
  text: so that they may report to us all the sooner the peace and concord we have prayed for and desired[a], in order that we too may more quickly rejoice concerning your good order.
  footnotes:
  - marker: a
    text: Or 'so that they may report to us all the sooner the peace and concord for which we have prayed earnestly.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 우리가 기도하며 바란 평강과 화합을 우리에게 더 속히 보고하게 하시고, 우리도 여러분의 좋은 질서를 두고 더 빨리 기뻐하게 하시려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως θᾶττον
  english_pob_choice: so that they may report to us all the sooner
  chosen_korean: 더 속히 보고하게 하시고
  alternatives_korean:
  - 더 빨리 알리게 하시고
  - 더 서둘러 전하게 하시고
  lexicon: ὅπως + θᾶττον
  rationale: 목적을 나타내는 ὅπως와 비교급 부사 θᾶττον의 결합을 자연스러운 목적절로 살려, ‘더 속히’라는 시간적 긴박함을 유지했습니다.
- source_word: τὴν εὐξαπεῖσαν καὶ ἐπιποθήτην
  english_pob_choice: the peace and concord we have prayed for and desired
  chosen_korean: 우리가 기도하며 바란 평강과 화합
  alternatives_korean:
  - 우리가 간절히 기도하며 바란 평화와 화목
  - 우리가 바라며 구한 평강과 일치
  lexicon: εὐξαπεῖσαν / ἐπιποθήτην
  rationale: 본문의 OCR이 일부 훼손되어 있으나, 영어 POB와 수정 이력을 따라 ‘기도하다’와 ‘바라다/갈망하다’의 두 뉘앙스를 함께 살렸고, εἰρήνη 계열은 POB 기본어휘에 맞춰 ‘평강’으로 옮겼습니다.
- source_word: εὐσταθείας
  english_pob_choice: your good order
  chosen_korean: 여러분의 좋은 질서
  alternatives_korean:
  - 여러분의 선한 질서
  - 여러분의 안정된 질서
  lexicon: εὐσταθεία
  rationale: 교회적 전통어를 과하게 덧씌우지 않고, 공동체의 안정된 배열과 질서를 드러내는 직역형 표현으로 ‘좋은 질서’를 택했습니다.
theological_decisions:
- issue: 마지막 목적절의 포함 여부
  chosen_reading: ‘우리도 여러분의 좋은 질서를 두고 더 빨리 기뻐하게 하시려는 것입니다’까지 본문에 포함했습니다.
  alternative_readings:
  - 첫 번째 목적절만 번역하고 뒤의 기쁨 진술은 생략하는 방식
  - 뒤 문장을 의역해 ‘우리도 기뻐하도록’ 정도로 완화하는 방식
  rationale: 영어 POB 수정 이력에서 누락된 δεύτερο half를 복원해야 하며, 본문이 공동체 간 상호 기쁨의 목적을 분명히 말하므로 전체 목적 구조를 유지했습니다.
  doctrine_reference: 본문 구조 보존과 상호 권면의 공동체 신학
