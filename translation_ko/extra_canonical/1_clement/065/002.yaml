translation:
  language: ko
  text: 이는 그들이 우리가 기도하고 갈망해 온 평강과 화합을 우리에게 더 속히 보고하여, 우리도 여러분의 안정된 질서를 두고 더 빨리 기뻐할 수 있도록 하기 위함입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 우리가 간절히 기도해 온 평강과 화합을 우리에게 더 속히 알리고, 우리도 여러분의 안정된 상태를 두고 더 빨리 기뻐할 수 있도록.’
    reason: εὐκταίαν의 ‘기도로 구한/바란’ 뉘앙스와 εὐσταθεία의 ‘안정, 확고함’ 의미 범위를 밝혀, 본문의 표현상 여지를 보존합니다.
