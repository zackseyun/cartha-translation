base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/013.yaml
  text: 'Let us therefore be humble[a], brothers, laying aside all arrogance and conceit and foolishness and anger, and let us do what is written—for the Holy Spirit says: “Let not the wise man boast in his wisdom, nor the strong in his strength, nor the rich in his riches, but let the one who boasts boast in the Lord, to seek him and to do judgment and righteousness”—especially remembering the words of the Lord Jesus, which he spoke while teaching gentleness and patience. 2 For thus he said: “Show mercy, so that you may receive mercy. Forgive, so that it may be forgiven you. As you do, so it will be done to you. As you give, so it will be given to you. As you judge, so you will be judged. As you show kindness, so kindness will be shown to you. With the measure by which you measure, it will be measured to you.” 3 By this command and these charges let us strengthen ourselves so as to walk in obedience to his holy words, being humble-minded. For the holy word says: “Upon whom shall I look,
    except upon the gentle and quiet one[f][e][d][c][b], and the one who trembles at my words?”'
  footnotes:
  - marker: a
    text: The citation combines wording known from Jeremiah 9:23–24 (LXX numbering differs) with the call to do judgment and righteousness.
    reason: cross_reference
  - marker: b
    text: The sayings in verse 2 echo material known from the Gospel tradition, especially forms similar to Matthew 5:7; 6:14; 7:2 and Luke 6:31, 36–38.
    reason: cross_reference
  - marker: c
    text: '''Holy and fitting words'' renders ἁγιοπρεπέσι λόγοις, literally words befitting holiness or sacred propriety.'
    reason: lexical_alternative
  - marker: d
    text: The final citation echoes Isaiah 66:2, with 'gentle and quiet' reflecting Clement's wording here.
    reason: cross_reference
  - marker: e
    text: Or 'boast in the Lord,” to seek him and to do judgment and righteousness—'.
    reason: previous_rendering
  - marker: f
    text: Or 'holy and fitting words'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 형제들이여, 우리 모두 교만과 자만과 어리석음과 분노를 다 벗어 버리고, 겸손한 마음을 품읍시다. 그리고 기록된 것을 행합시다. 곧 성령께서 말씀하십니다. “지혜로운 사람은 자기 지혜를 자랑하지 말고, 강한 사람은 자기 힘을 자랑하지 말고, 부유한 사람은 자기 재물을 자랑하지 마십시오. 그러나 자랑하는 사람은 주 안에서 자랑하십시오. 이는 그를 찾고 정의와 의를 행하게 하려는 것입니다.” 특히 주 예수께서 온유와 오래 참음을 가르치시며 하신 말씀을 기억해야 합니다. 2 그분은 이렇게 말씀하셨습니다. “긍휼을 베푸십시오. 그러면 긍휼을 입을 것입니다. 용서하십시오. 그러면 여러분도 용서받을 것입니다. 여러분이 행하는 대로, 그대로 여러분에게 행해질 것입니다. 여러분이 주는 대로, 그대로 여러분에게 주어질 것입니다. 여러분이 판단하는 대로, 그대로 여러분이 판단받을 것입니다. 여러분이 친절을 베푸는 대로, 그대로 여러분에게 친절이 베풀어질 것입니다. 여러분이 재는 그 잣대로, 여러분에게도 그대로 재일 것입니다.” 3 이 명령과 이 훈계들로 우리 자신을 굳게 하여, 그의 거룩에 합당한 말씀에 순종하는 사람으로 걸어가며, 겸손한 마음을 품읍시다. 거룩한 말씀이 말씀하십니다. “내가 누구를 바라보겠느냐? 곧 온유하고 조용하며, 내 말을 떠는 마음으로 받는 사람을 바라보겠다.”[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταπεινοφρονήσωμεν
  english_pob_choice: Let us therefore be humble
  chosen_korean: 그러므로 … 겸손한 마음을 품읍시다
  alternatives_korean:
  - 겸손합시다
  - 마음을 낮춥시다
  lexicon: LSJ; BDAG
  rationale: 권면형 접속사 οὖν의 흐름을 살리면서, 동사의 내적 태도(겸손한 마음)를 한국어로 자연스럽게 옮겼습니다.
- source_word: ἀλαζονείαν καὶ τύφος καὶ ἀφροσύνην καὶ ὀργάς
  english_pob_choice: all arrogance and conceit and foolishness and anger
  chosen_korean: 교만과 자만과 어리석음과 분노
  alternatives_korean:
  - 허세와 우쭐댐과 어리석음과 화
  - 허풍과 교만과 어리석음과 분노
  lexicon: LSJ; BDAG
  rationale: 네 항목의 뉘앙스를 구분하되, 한국어 독자에게도 읽히는 비슷한 강도의 악덕 목록으로 유지했습니다.
- source_word: τὸ γεγραμμένον
  english_pob_choice: what is written
  chosen_korean: 기록된 것
  alternatives_korean:
  - 기록된 말씀
  - 성경에 기록된 것
  lexicon: LSJ; BDAG
  rationale: 원문의 포괄적 표현을 살려 특정 정경 용어로 과도하게 좁히지 않았습니다.
- source_word: ἁγιοπρεπέσι λόγοις
  english_pob_choice: words befitting holiness / his holy words
  chosen_korean: 그의 거룩에 합당한 말씀
  alternatives_korean:
  - 그의 거룩한 말씀
  - 거룩에 어울리는 말씀
  lexicon: LSJ; BDAG
  rationale: 합성형용사 ἁγιοπρεπής의 핵심인 '거룩에 합당함'을 보존해 단순한 '거룩한'으로 평평하게 만들지 않았습니다.
- source_word: πρᾶον καὶ ἡσύχιον
  english_pob_choice: the gentle and quiet one
  chosen_korean: 온유하고 조용하며
  alternatives_korean:
  - 온유하고 고요하며
  - 온유하고 शांत한
  lexicon: LSJ; BDAG
  rationale: 인용문의 이중 형용사를 현대 한국어로 간결하게 살렸고, 뒤의 동사구와 연결되도록 자연스러운 수식을 택했습니다.
theological_decisions:
- issue: κύριος의 처리와 예수에 대한 지칭
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 문맥의 κύριος는 먼저 인용문 안에서 일반적 '주'로, 이어서 '주 예수'로 이어집니다. 한국어 본문에서는 이중 사용을 유지해 구약 인용의 울림과 예수 호칭을 함께 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
- issue: δικαιοσύνη의 번역
  chosen_reading: 의
  alternative_readings:
  - 정의
  - 의로움
  rationale: κρίμα와 병렬된 전형적 성경어법을 반영해 '정의와 의'로 두 낱말의 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: δικαιοσύνη → 의'
- issue: ἀδελφοί의 번역
  chosen_reading: 형제들이여
  alternative_readings:
  - 형제자매들이여
  - 여러분
  rationale: 그리스어의 남성 복수 호칭을 그대로 살려 회중적 권면의 음성을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
