  text: ἡμέρα τε καὶ νὺξ τὸν τεταγμένον ὑπ᾽ αὐτοῦ δρόμον ἀνύουσιν, μηδὲν ἀλλήλαις ἐμποδίζοντα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/002.yaml
  text: Day and night complete the course appointed by him, hindering one another in nothing.
translation:
  language: ko
  text: 낮과 밤은 그분께서 정하신 길을 서로 조금도 방해하지 않고 끝까지 갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμέρα τε καὶ νὺξ
  english_pob_choice: Day and night
  chosen_korean: 낮과 밤
  alternatives_korean:
  - 해와 밤
  - 주야
  lexicon: ἡμέρα / νύξ
  rationale: 시간의 두 대조를 자연스럽고 직관적인 한국어로 옮겼습니다. '주야'는 문어적이지만 다소 경직되어, 본문의 평이한 진술에는 '낮과 밤'이 더 적합합니다.
- source_word: τὸν τεταγμένον ὑπ᾽ αὐτοῦ δρόμον
  english_pob_choice: the course appointed by him
  chosen_korean: 그에게서 정해진 달음
  alternatives_korean:
  - 그가 정하신 길
  - 그가 지정하신 코스
  lexicon: τάσσω / δρόμος
  rationale: δρόμος는 단순한 '길'보다 '달음, 경주, 달려감'의 뜻이 살아 있어, 정해진 진행을 강조하는 '달음'으로 옮겼습니다. ὑπ᾽ αὐτοῦ는 원인·행위 주체를 드러내므로 '그에게서 정해진'으로 처리했습니다.
- source_word: ἀνύουσιν
  english_pob_choice: complete
  chosen_korean: 완수합니다
  alternatives_korean:
  - 마칩니다
  - 이룹니다
  lexicon: ἀνύω
  rationale: 목적된 과정을 끝까지 수행해 나간다는 뜻을 살려 '완수합니다'로 옮겼습니다. 단순한 종결보다 과정의 성취를 더 잘 드러냅니다.
- source_word: μηδὲν ἀλλήλαις ἐμποδίζοντα
  english_pob_choice: hindering one another in nothing
  chosen_korean: 서로 아무 것도 방해하지 않으며
  alternatives_korean:
  - 서로 아무 것도 가로막지 않으며
  - 서로 전혀 방해하지 않으며
  lexicon: ἐμποδίζω
  rationale: 상호 간의 방해가 전혀 없다는 부정을 한국어로 자연스럽게 풀어 '서로 아무 것도 방해하지 않으며'로 옮겼습니다. '아무 것도'는 μηδέν의 강한 부정을 반영합니다.
theological_decisions:
- issue: 우주적 질서의 인격화
  chosen_reading: 낮과 밤을 주체로 두되, 창조 질서가 주어진 궤도를 충실히 수행하는 모습으로 표현했습니다.
  alternative_readings:
  - 낮과 밤이 자기에게 정해진 과정을 수행한다는 보다 직역적인 표현
  - 낮과 밤이 각각 맡은 일을 다한다는 의역
  rationale: 본문은 자연 현상에 질서와 복종의 이미지를 부여하지만, 이를 과도하게 인격화하지 않도록 '달음'과 '완수합니다'로 균형을 잡았습니다.
  doctrine_reference: 창조 질서와 섭리
- issue: 문장 종결의 문체
  chosen_reading: 서술적 진술이므로 합쇼체 평서문으로 마무리했습니다.
  alternative_readings:
  - 시적 종결형
  - 비격식 문체
  rationale: 1 Clement의 문맥은 교훈적 산문이므로, 현대 한국어의 공적·문어적 톤을 유지하는 것이 적절합니다.
  doctrine_reference: 문체 일관성
