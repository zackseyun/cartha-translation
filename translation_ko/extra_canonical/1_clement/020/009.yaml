lexical_decisions:
- source_word: καιροὶ ἐαρινοὶ καὶ θερινοὶ καὶ μετοπωρινοὶ καὶ χειμερινοὶ
  english_pob_choice: The seasons of spring and summer and autumn and winter
  chosen_korean: 봄, 여름, 가을, 겨울의 절기들
  alternatives_korean:
  - 봄과 여름과 가을과 겨울
  - 춘하추동의 절기들
  lexicon: καιρός / ἐαρινός / θερινός / μετοπωρινός / χειμερινός
  rationale: 계절들을 단순 나열하는 영어 POB의 의미를 따르되, 계절에 붙은 형용사들을 한국어 자연문으로 압축해 '절기들'로 옮겨 시간의 순환성을 살렸습니다.
- source_word: ἐν εἰρήνῃ
  english_pob_choice: in peace
  chosen_korean: 평안하게
  alternatives_korean:
  - 평강 가운데
  - 평안 속에서
  lexicon: εἰρήνη
  rationale: 여기서는 분쟁의 부재보다 조화로운 질서를 뜻하므로, 서술부 전체를 매끄럽게 하는 부사형 '평안하게'를 택했습니다.
- source_word: μεταπαραδιδόασιν ἀλλήλοις
  english_pob_choice: give way to one another
  chosen_korean: 서로에게 자리를 내줍니다
  alternatives_korean:
  - 서로에게 넘겨줍니다
  - 서로에게 양보합니다
  lexicon: μεταπαραδίδωμι
  rationale: 직역의 '넘겨줍니다'보다 계절의 순환을 더 분명히 드러내는 한국어 관용을 택하되, 상호 교대의 뜻은 유지했습니다.
theological_decisions:
- issue: 자연의 질서와 평안의 표현
  chosen_reading: 이 구절은 계절의 교대가 하나님이 주신 질서 아래 평안하게 이루어짐을 말하므로, '평안하게'로 자연스러운 조화의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 평강 가운데 서로에게 자리를 내줍니다
  - 평안 속에서 서로에게 양보합니다
  rationale: 문맥상 교리 진술보다 창조 질서의 조화가 중심이므로, 신학적 용어를 과도하게 부각하지 않고 본문의 이미지가 살아나도록 옮겼습니다.
  doctrine_reference: 창조 질서와 섭리
