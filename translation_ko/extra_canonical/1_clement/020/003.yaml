id: 1CLEM.20.3
reference: 1 Clement 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἥλιός τε καὶ σελήνη, ἀστέρων τε χοροὶ κατὰ τὴν διαταγὴν αὐτοῦ ἐν ὁμονοίᾳ δίχα πάσης παρεκβάσεως ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/003.yaml
  text: The sun and the moon and the choirs of stars[a], according to his ordinance, move in concord, without any deviation, along the courses assigned to them.
  footnotes:
  - marker: a
    text: Or 'move in harmony, without any deviation, within the bounds assigned to them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 해와 달과 별들의 무리도 그의 명령에 따라, 조금도 벗어남 없이, 자신들에게 정해진 길을 따라 조화롭게 나아갑니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαταγή
  english_pob_choice: according to his ordinance
  chosen_korean: 그의 명령에 따라
  alternatives_korean:
  - 그의 규례에 따라
  - 그의 법도에 따라
  - 그의 명령대로
  lexicon: διαταγή
  rationale: 천체의 질서를 정하는 표현으로서 ‘명령’이 권위와 정연한 질서를 함께 드러내며, POB의 ‘ordinance’도 무리 없이 반영합니다.
- source_word: ἐν ὁμονοίᾳ
  english_pob_choice: move in concord
  chosen_korean: 조화롭게
  alternatives_korean:
  - 일치하여
  - 화합하여
  - 한마음으로
  lexicon: ὁμονοία
  rationale: 1 Clement에서 중요한 공통체적 덕목인 ὁμονοία를 한국어로 자연스럽게 살리되, 천체의 질서 있는 운행이라는 문맥에 맞게 ‘조화롭게’로 옮겼습니다.
- source_word: ἐξελίσσουσιν τοὺς ἐπιτεταγμένους αὐτοῖς ὁρισμούς
  english_pob_choice: move ... along the courses assigned to them
  chosen_korean: 자신들에게 정해진 길을 따라 나아갑니다
  alternatives_korean:
  - 자신들에게 정해진 경계를 따라 나아갑니다
  - 자신들에게 부여된 한계를 따라 진행합니다
  - 자신들에게 정해진 경로를 따라 나아갑니다
  lexicon: ἐξελίσσω / ὁρισμός
  rationale: POB의 최신 영어가 ‘courses assigned’로 다듬어진 점을 따라, ὁρισμούς를 ‘길’로 풀어 천체의 진행 경로를 자연스럽게 표현했습니다.
- source_word: δίχα πάσης παρεκβάσεως
  english_pob_choice: without any deviation
  chosen_korean: 조금도 벗어남 없이
  alternatives_korean:
  - 어떠한 일탈도 없이
  - 전혀 어긋남 없이
  - 조금도 치우침 없이
  lexicon: παρέκβασις
  rationale: ‘deviation’의 의미를 직역 과잉 없이 살리면서, 원문의 절대적 부정을 한국어로 분명하게 드러냈습니다.
theological_decisions:
- issue: 천체의 질서를 인격화된 순종으로 제시하는 비유
  chosen_reading: 해와 달과 별들의 무리가 하나님의 정하신 질서에 맞춰 어긋남 없이 움직이는 것으로 번역했습니다.
  alternative_readings:
  - 단순한 자연 현상 묘사로만 옮김
  - 비유적 순종성을 약화시켜 ‘규칙적으로 움직인다’로 축소
  rationale: 이 문장은 단순 천문학 설명이 아니라 창조 질서의 질서정연함을 강조하는 수사이므로, 순종과 조화의 뉘앙스를 유지했습니다.
  doctrine_reference: 창조 질서, 섭리
