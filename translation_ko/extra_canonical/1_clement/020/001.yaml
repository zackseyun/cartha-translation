source:
  edition: Funk 1901 (normalized OCR)
  text: Οἱ οὐρανοὶ τῇ διοικήσει αὐτοῦ σαλευόμενοι ἐν εἰρήνῃ ὑποτάσσονται αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/001.yaml
  text: The heavens, revolving by his governance, submit to him in peace.
  footnotes:
  - marker: a
    text: Or 'shaken'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘들은 그의 다스리심으로 움직이면서도, 평강 가운데 그에게 복종합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοί
  english_pob_choice: The heavens
  chosen_korean: 하늘들은
  alternatives_korean:
  - 하늘이
  - 하늘들
  lexicon: οὐρανός
  rationale: 복수 정관사와 복수 명사를 살려 천체적 ‘하늘들’의 이미지를 유지했습니다. 단수화하면 원문의 범위감이 약해집니다.
- source_word: τῇ διοικήσει αὐτοῦ
  english_pob_choice: by his governance
  chosen_korean: 그의 다스리심으로
  alternatives_korean:
  - 그의 통치로
  - 그의 관리로
  - 그의 섭리로
  lexicon: διοίκησις
  rationale: διοίκησις는 단순 관리보다 질서 있는 통치·운영의 뉘앙스가 강하므로, 하나님의 주권적 다스림을 드러내는 표현을 택했습니다.
- source_word: σαλευόμενοι
  english_pob_choice: revolving
  chosen_korean: 움직이면서도
  alternatives_korean:
  - 흔들리면서도
  - 회전하면서도
  - 요동하면서도
  lexicon: σαλεύω
  rationale: 영문 POB의 수정처럼 ‘흔들리다’보다 우주적 질서 속의 규칙적 운동을 살려야 하므로, 폭력적 교란을 피하는 중립적 동사를 사용했습니다.
- source_word: ἐν εἰρήνῃ
  english_pob_choice: in peace
  chosen_korean: 평강 가운데
  alternatives_korean:
  - 평화 가운데
  - 평강 속에서
  lexicon: εἰρήνη
  rationale: POB의 일관된 어휘를 따라 εἰρήνη를 ‘평강’으로 옮겨, 단순한 정서적 평온보다 질서 있는 화목 상태를 표현했습니다.
- source_word: ὑποτάσσονται αὐτῷ
  english_pob_choice: submit to him
  chosen_korean: 그에게 복종합니다
  alternatives_korean:
  - 그에게 순복합니다
  - 그에게 굴복합니다
  - 그에게 복종하고 있습니다
  lexicon: ὑποτάσσω
  rationale: 하늘의 자발적 질서를 나타내는 동사로서 ‘복종합니다’가 가장 직접적입니다. ‘굴복합니다’는 패배 뉘앙스가 강합니다.
theological_decisions:
- issue: cosmic motion versus violent disturbance
  chosen_reading: 하늘들의 움직임을 질서 있는 운동으로 읽어, 평강과 양립하는 창조 질서를 드러냈습니다.
  alternative_readings:
  - 하늘들이 흔들리면서도 그에게 복종합니다
  - 하늘들이 요동하면서도 그에게 복종합니다
  rationale: 문맥과 문장 후반의 ἐν εἰρήνῃ가 우주적 불안정이 아니라 질서와 조화를 강조하므로, ‘흔들림’보다 ‘움직임/운행’을 택했습니다.
  doctrine_reference: 창조 질서와 하나님의 주권
