  to: 하늘들은 그분의 다스리심으로 움직이며[a] 평강 가운데 그분께 복종합니다.
  rationale: 양보 의미를 제거하고 각주를 해당 분사에 직접 연결했습니다. ‘움직이며’는 질서 있는 천체 운동이라는 문맥 및 영어 POB의 ‘revolving’을 수용하되, 그리스어가 직접 명시하지 않는 회전 운동으로 의미를 고정하지 않습니다.
