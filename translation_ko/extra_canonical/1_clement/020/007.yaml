  yaml_path: translation/extra_canonical/1_clement/020/007.yaml
  text: For he said, “Thus far you shall come, and your waves shall be broken within you.”
translation:
  language: ko
  text: 그가 말씀하셨기 때문입니다. “여기까지는 올 것이며, 네 파도는 네 안에서 부서질 것이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως ὧδε
  english_pob_choice: Thus far
  chosen_korean: 이제까지는
  alternatives_korean:
  - 여기까지는
  - 이만큼까지는
  - 이때까지는
  lexicon: ἕως ὧδε
  rationale: 시간·한계의 경계를 자연스럽고 격식 있게 나타내기 위해 「이제까지는」을 택했습니다. POB의 'Thus far'와 같은 의미 범위를 유지합니다.
- source_word: ἥξεις
  english_pob_choice: you shall come
  chosen_korean: 오너라
  alternatives_korean:
  - 올 것이다
  - 오게 될 것이다
  - 오리라
  lexicon: ἥκω
  rationale: 미래 도착/진입의 도상적 표현을 한국어의 직접적인 명령형이 아니라 인용문 안의 예정적·한계적 진술로 옮기되, 문맥상 경계선 설정의 힘을 살리기 위해 간결한 종결형을 사용했습니다.
- source_word: τὰ κύματά σου
  english_pob_choice: your waves
  chosen_korean: 너의 파도는
  alternatives_korean:
  - 네 파도는
  - 그대의 파도는
  - 당신의 파도는
  lexicon: κῦμα
  rationale: 원문의 소유격과 복수성을 분명히 드러내기 위해 「너의 파도는」으로 옮겼습니다. 대상은 바다의 비유적 파도입니다.
- source_word: ἐν σοὶ συντριβήσεται
  english_pob_choice: shall be broken within you
  chosen_korean: 네 안에서 부서질 것이다
  alternatives_korean:
  - 네 안에서 산산이 부서질 것이다
  - 네 속에서 깨질 것이다
  - 네 안에서 무너질 것이다
  lexicon: συντρίβω
  rationale: συντρίβω의 핵심 의미인 '부서지다/산산이 깨지다'를 유지하되, 과도한 의역을 피하고 한국어에서 자연스러운 「부서질 것이다」로 옮겼습니다.
theological_decisions:
- issue: 인용문의 화자 표지
  chosen_reading: 그가 말씀하셨습니다
  alternative_readings:
  - 그가 말했습니다
  - 그가 이르셨습니다
  rationale: 원문 εἶπεν γάρ· 는 단순한 서술이지만, 인용된 권위 있는 발화를 드러내기 위해 공손한 서술 「말씀하셨습니다」를 사용했습니다.
  doctrine_reference: 성경 인용의 권위성과 서술문체
