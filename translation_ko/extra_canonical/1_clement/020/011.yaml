id: 1CLEM.20.11
reference: 1 Clement 20:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα πάντα ὁ μέγας, διμιουργὸς καὶ δεσπότης τῶν ἁπάντων ἐν εἰρήνῃ καὶ ὁμονοίᾳ προσέταξεν εἶναι, εὐεργετῶν τὰ πάντα, ὑπερεκπερισσῶς δὲ ἡμᾶς τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/011.yaml
  text: All these things the great Creator and Master of all has appointed to be in peace and harmony, doing good to all things, but exceedingly more to us who have fled for refuge to his mercies through our Lord Jesus Messiah,
translation:
  language: ko
  text: 이 모든 것을 위대한 창조주이시며 만물의 주인이신 분께서 평강과 화목 안에 있게 하도록 명하셨습니다. 그는 만물을 선하게 대하시며, 우리 주 예수 메시아를 통해 그분의 자비에 피하여 들어온 우리에게는 더욱더 그러하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μέγας, διμιουργὸς καὶ δεσπότης τῶν ἁπάντων
  english_pob_choice: the great Creator and Master of all
  chosen_korean: 위대한 창조주이시며 만물의 주인이신 분
  alternatives_korean:
  - 위대한 창조주이시며 만유의 주님
  - 위대한 조물주이시며 모든 것의 주인
  lexicon: διμιουργός, δεσπότης
  rationale: διμιουργὸς는 단순한 ‘창조자’보다 창조 행위를 드러내는 ‘창조주’가 자연스럽고, δεσπότης는 통상적 교회어인 ‘주님’보다 소유·통치의 강한 뉘앙스를 살리는 ‘주인’이 더 직접적입니다.
- source_word: ἐν εἰρήνῃ καὶ ὁμονοίᾳ
  english_pob_choice: in peace and harmony
  chosen_korean: 평강과 화목 안에
  alternatives_korean:
  - 평화와 화합 안에
  - 평강과 일치 안에
  lexicon: εἰρήνη, ὁμονοία
  rationale: εἰρήνη는 프로젝트 표준대로 ‘평강’으로 두고, ὁμονοία는 단순 조화보다 공동체적 일치와 친목을 함께 드러내는 ‘화목’이 문맥에 잘 맞습니다.
- source_word: ὑπερεκπερισσῶς
  english_pob_choice: exceedingly more
  chosen_korean: 더욱더
  alternatives_korean:
  - 지극히 더
  - 한없이 더
  lexicon: ὑπερεκπερισσῶς
  rationale: 부사가 강조하는 과잉적 정도를 한국어에서 자연스럽게 살리되 과도하게 장황하지 않도록 ‘더욱더’로 압축했습니다.
- source_word: τοὺς προσπεφευγότας τοῖς οἰκτιρμοῖς αὐτοῦ
  english_pob_choice: those who have fled for refuge to his mercies
  chosen_korean: 그분의 자비에 피하여 들어온 우리
  alternatives_korean:
  - 그분의 자비로 피신한 우리
  - 그분의 자비를 의지해 도망쳐 온 우리
  lexicon: προσφεύγω, οἰκτιρμοί
  rationale: ‘피하여 들어오다’는 피난/의탁의 함의를 살리고, οἰκτιρμοί는 ‘긍휼들’의 직역보다 한국어에서 더 이해되는 ‘자비’로 옮겼습니다.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  english_pob_choice: through our Lord Jesus Messiah
  chosen_korean: 우리 주 예수 메시아를 통해
  alternatives_korean:
  - 우리 주 예수 그리스도를 통해
  - 우리의 주님 예수 메시아를 통해
  lexicon: κύριος, Ἰησοῦ Χριστός
  rationale: POB의 Χριστός를 ‘메시아’로 유지해 칭호성을 드러내고, κύριος는 관계의 주권을 나타내는 ‘우리 주’로 옮겼습니다.
theological_decisions:
- issue: δεσπότης의 권위 표현
  chosen_reading: ‘주인’으로 옮겨 창조주가 만물에 대해 가지는 절대적 소유권과 통치를 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 완화해 번역
  - ‘통치자’로 설명적 번역
  rationale: 이 문맥은 단순한 경건 호칭보다 창조주와 만물의 관계를 강하게 진술하므로, 전통 교회어보다 직접적인 권위어를 택했습니다.
  doctrine_reference: 창조주-피조물 구분, 하나님의 절대 주권
