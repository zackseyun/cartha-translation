id: 1CLEM.20.8
reference: 1 Clement 20:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὠκεανὸς ἀπέραντος ἀνθρώποις καὶ οἱ μετ᾽ αὐτὸν κόσμοι ταγαῖς τοῦ δεσπότου διευθύνονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/008.yaml
  text: The ocean, impassable to men, and the worlds beyond it are directed by the ordinances of the Master.
translation:
  language: ko
  text: 바다는 사람들에게 건널 수 없지만, 그 바다 너머의 세계들도 주님의 정하신 질서에 따라 다스려집니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠκεανὸς ἀπέραντος ἀνθρώποις
  english_pob_choice: The ocean, impassable to men
  chosen_korean: 바다는 사람들에게 건널 수 없지만
  alternatives_korean:
  - 사람들에게 건널 수 없는 바다는
  - 인간에게는 건널 수 없는 바다는
  lexicon: ὠκεανός; ἀπέραντος
  rationale: ἀπέραντος의 ‘impassable’ 의미를 살려 ‘건널 수 없다’로 옮기고, 앞말을 자연스럽게 한국어 문장으로 재배열했습니다.
- source_word: οἱ μετ᾽ αὐτὸν κόσμοι
  english_pob_choice: the worlds beyond it
  chosen_korean: 그 바다 너머의 세계들도
  alternatives_korean:
  - 그 뒤의 세계들도
  - 그 너머의 세계들도
  lexicon: κόσμοι
  rationale: κόσμοι를 단순한 ‘세계들’로 살리되, 위치 관계를 드러내기 위해 ‘너머의’로 보완했습니다.
- source_word: ταγαῖς
  english_pob_choice: the ordinances
  chosen_korean: 정하신 질서
  alternatives_korean:
  - 명령들
  - 법령들
  - 규례들
  lexicon: ταγή
  rationale: revision pass의 ‘ordinances’를 반영하되, 복수형 명사보다 ‘정하신 질서’가 문맥상 우주를 규정하는 배열과 통치를 더 자연스럽게 드러냅니다.
- source_word: τοῦ δεσπότου
  english_pob_choice: of the Master
  chosen_korean: 주님의
  alternatives_korean:
  - 주인의
  - 주재자의
  lexicon: δεσπότης
  rationale: δεσπότης는 단순한 소유주보다 권세 있는 주재를 가리키므로, 본문 맥락에서 자연스럽게 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: δεσπότης의 호칭 강도
  chosen_reading: ‘주님’으로 번역하되, 권위와 주재성을 잃지 않도록 문맥 전체를 ‘정하신 질서에 따라 다스려집니다’로 마무리했습니다.
  alternative_readings:
  - ‘주인’
  - ‘주재자’
  rationale: 한국어에서 ‘주님’은 예배적 뉘앙스가 강하지만, 여기서는 우주를 다스리는 절대 권위를 나타내므로 가장 자연스럽고도 무게감 있는 대응입니다.
  doctrine_reference: 창조주/섭리주 하나님의 주권
- issue: διευθύνονται의 수동 표현
  chosen_reading: ‘다스려집니다’로 옮겨, 바다와 세계들이 외부의 질서 아래 놓여 있음을 드러냈습니다.
  alternative_readings:
  - ‘인도됩니다’
  - ‘지배됩니다’
  rationale: διευθύνονται는 ‘곧게 이끌다/관리하다’의 수동형이므로, 단순한 지도보다 통치와 질서의 뉘앙스를 함께 살리는 표현이 적절합니다.
  doctrine_reference: 섭리와 통치
