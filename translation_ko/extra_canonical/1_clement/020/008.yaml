  - severity: low
    issue: ‘정하신 질서’는 ταγαῖς의 의미를 다소 추상화합니다.
    rationale: ταγαί는 명령, 지시, 규정의 복수형으로, 우주의 질서라는 문맥과 조화되지만 ‘정하신 질서’는 원문의 명령적·규범적 어감을 약화할 수 있습니다.
