  source_fidelity: 원문의 병렬 구조(ὠκεανὸς ... καὶ οἱ ... κόσμοι)와 διευθύνονται의 수동 의미를 살려야 합니다. 초안의 ‘하지만’은 원문에 없는 대조를 만들며, ‘정하신 질서’는 ταγαῖς(명령·규정·규례)의 복수적이고 규범적인 어감을 다소 추상화합니다.
  naturalness: ‘사람들이 건널 수 없는 바다와 그 너머의 세계들은 … 인도됩니다’는 현대 표준 한국어의 격식 있는 문체로 자연스럽고, 원문의 병렬 관계도 명료하게 드러냅니다.
  terminology: δεσπότου는 이 문맥에서 창조주적 절대 권위를 가리키므로 ‘주님의’가 적절합니다. ταγαῖς는 ‘명령들’로 옮겨 ‘ordinances’ 및 원문의 규정·명령의 의미를 보존했습니다. διευθύνονται는 ‘인도됩니다’로 옮겨 수동적 통솔·지도 의미를 유지했습니다.
  issues:
