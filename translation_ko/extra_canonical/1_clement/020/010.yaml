id: 1CLEM.20.10
reference: 1 Clement 20:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνέμων σταθμοὶ κατὰ τὸν ἴδιον καιρὸν τὴν λειτουργίαν αὐτῶν ἀπροσκόπως ἐπιτελοῦσιν· ἀέναοί τε πηγαί, πρὸς ἀπόλαυσιν καὶ ὑγείαν δημιουργηθεῖσαι, δίχα ἐλλείψεως παρέχονται τοῖς πρὸς ζωὴν ἀνθρώποις μαζούς· τά τε ἐλάχιστα τῶν ζῴων τὰς συνελεύσεις αὐτῶν ἐν ὁμονοίᾳ καὶ εἰρήνῃ ποιοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/010.yaml
  text: The courses of the winds[a], each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail provide their breasts for the life of men[b]. And the smallest of living creatures hold their gatherings in harmony and peace.
  footnotes:
  - marker: a
    text: Or 'without stumbling'.
    reason: previous_rendering
  - marker: b
    text: Or 'Even the smallest'.
    reason: previous_rendering
translation:
  language: ko
  text: 바람의 운행은 저마다 제때에 막힘없이 자기 직무를 수행하며[a], 끊임없이 흐르는 샘들은 즐거움과 건강을 위해 지음 받아 부족함 없이 사람들에게 생명을 위한 젖을 내어 줍니다. 그리고 가장 작은 생물들은[b] 조화와 평화 가운데 그들의 모임을 이룹니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘걸림 없이’.
    reason: ἀπροσκόπως의 어원적·대안적 표현을 제시하되, 문맥상 본문 ‘막힘없이’가 더 자연스럽습니다.
  - marker: b
    text: 또는 ‘가장 작은 생물들마저’.
    reason: τε를 첨가·상승 강조로 해석하는 가능한 번역을 제시합니다. 본문은 단순 병렬을 따라 ‘그리고’로 옮겼습니다.
lexical_decisions:
- source_word: ἀνέμων σταθμοὶ
  english_pob_choice: The courses of the winds
  chosen_korean: 바람의 운행
  alternatives_korean:
  - 바람의 길
  - 바람의 경로
  - 바람의 코스
  lexicon: σταθμός
  rationale: 문맥상 바람의 정해진 흐름·운행을 가리키므로, 한국어에서는 자연스럽고 시적인 ‘운행’으로 풀어 예측 가능한 진행성과 질서를 살렸습니다.
- source_word: ἀπροσκόπως ἐπιτελοῦσιν
  english_pob_choice: fulfill their service without hindrance
  chosen_korean: 막힘 없이 수행하고
  alternatives_korean:
  - 장애 없이 수행하고
  - 걸림 없이 이행하고
  - 방해 없이 완수하고
  lexicon: ἀπροσκόπως
  rationale: ‘without hindrance’라는 수정된 POB 판단을 따라, 바람이 자기 역할을 방해 없이 수행한다는 뜻을 한국어의 자연스러운 합쇼체로 옮겼습니다.
- source_word: μαζούς
  english_pob_choice: their breasts
  chosen_korean: 그 젖가슴을
  alternatives_korean:
  - 그 품을
  - 그 샘가슴을
  - 그 가슴을
  lexicon: μαζός
  rationale: 샘이 생명을 공급하는 이미지를 유지하려면 은유를 약화시키지 않는 것이 중요하므로, 직역에 가까운 ‘젖가슴’을 택해 원문의 생동감과 난해함을 함께 보존했습니다.
- source_word: τά τε ἐλάχιστα τῶν ζῴων
  english_pob_choice: the smallest of living creatures
  chosen_korean: 가장 작은 생물들도
  alternatives_korean:
  - 가장 작은 짐승들도
  - 가장 작은 피조물들도
  - 가장 작은 동물들도
  lexicon: ἐλάχιστα τῶν ζῴων
  rationale: ζῷον의 범위가 넓어 ‘동물’로 좁히기보다, 문맥상 피조물 일반을 포함할 수 있는 ‘생물’이 더 안전합니다.
- source_word: συνελεύσεις αὐτῶν
  english_pob_choice: their gatherings
  chosen_korean: 자기들의 모임을
  alternatives_korean:
  - 자기들의 집회를
  - 서로의 모임을
  - 무리를
  lexicon: συνέλευσις
  rationale: 정치적·종교적 고유 용례보다 일반적 결집을 가리키므로, 한국어에서는 중립적인 ‘모임’으로 옮겼습니다.
theological_decisions:
- issue: 자연 질서의 묘사를 신학적으로 어떻게 처리할지
  chosen_reading: 피조세계의 질서가 창조 목적에 따라 조화롭게 작동한다는 점을 직설적으로 드러냈습니다.
  alternative_readings:
  - 자연을 단순한 비유로 약화시키는 읽기
  - 도덕적 교훈만 남기고 창조 질서를 흐리는 읽기
  rationale: 본문은 바람, 샘, 작은 생물들의 질서정연한 작동을 통해 공동체의 화합을 권면하므로, 창조 세계의 실제 질서를 유지해 번역해야 합니다.
  doctrine_reference: 창조론 / 섭리
- issue: ‘젖가슴’ 은유의 수위와 직설성
  chosen_reading: 원문의 신체 은유를 완화하지 않고 보존하되, 한국어에서 읽을 수 있는 수준으로만 다듬었습니다.
  alternative_readings:
  - ‘샘’만 반복해 은유를 제거하는 읽기
  - ‘품’으로 바꿔 모성적 이미지만 남기는 읽기
  rationale: 샘의 생명 공급성을 강하게 드러내는 핵심 은유이므로, 교훈적 완곡어보다 원문 이미지의 힘을 우선했습니다.
  doctrine_reference: 문학적·수사적 정직성
