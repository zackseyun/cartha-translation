id: 1CLEM.20.5
reference: 1 Clement 20:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀβύσσων τε ἀνεξιχνίαστα καὶ νερτέρων ἀνεκδιήγητα κρίματα τὰς αὐτὰς συνέχεται προστάξεσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/005.yaml
  text: The unsearchable depths of the abysses and the indescribable regions below are held together by the same ordinances[a].
  footnotes:
  - marker: a
    text: Or 'are held together'.
    reason: previous_rendering
translation:
  language: ko
  text: 깊이를 알 수 없는 심연의 깊은 곳과 형언할 수 없는 아래쪽 지역들은 같은 명령들에 의해 붙들려 있습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀβύσσων
  english_pob_choice: the abysses / depths of the abysses
  chosen_korean: 심연의 깊은 곳
  alternatives_korean:
  - 심연들
  - 깊은 심연
  lexicon: ἀβύσσος
  rationale: 복수형의 ‘심연’을 단순히 한 번 더 반복하기보다, 영어 POB의 ‘depths of the abysses’가 강조하는 심도를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: ἀνεξιχνίαστα
  english_pob_choice: unsearchable
  chosen_korean: 알 수 없는
  alternatives_korean:
  - 헤아릴 수 없는
  - 찾아낼 수 없는
  lexicon: ἀνεξιχνίαστος
  rationale: ‘탐지할 수 없음’보다 의미가 더 직접적인 ‘알 수 없는’으로 옮겨, 심연의 깊이가 인간의 추적과 파악을 벗어난다는 점을 간명하게 드러냈습니다.
- source_word: νερτέρων ἀνεκδιήγητα
  english_pob_choice: the indescribable regions below
  chosen_korean: 형언할 수 없는 아래쪽 지역들
  alternatives_korean:
  - 아래의 말할 수 없는 영역들
  - 지하의 설명할 수 없는 지역들
  lexicon: νερτέρων, ἀνεκδιήγητος
  rationale: νερτέρων의 ‘아래/지하’ 느낌과 ἀνεκδιήγητος의 ‘말로 다할 수 없음’을 함께 살리기 위해, 직설적이면서도 지나치게 기술적이지 않은 표현을 택했습니다.
- source_word: συνέχεται προστάξεσιν
  english_pob_choice: are held together by the same ordinances
  chosen_korean: 같은 명령들에 의해 붙들려 있습니다
  alternatives_korean:
  - 같은 규정들에 의해 함께 유지됩니다
  - 같은 법령들로 제약받고 있습니다
  lexicon: συνέχεται, προστάξεις
  rationale: POB의 최신 판단처럼 συνέχεται는 단순한 ‘함께 유지됨’보다 ‘붙들림/억제됨’의 뉘앙스가 강하며, προστάξεσιν은 ‘명령들/규정들’로 옮기는 것이 원문과 문맥에 더 가깝습니다.
theological_decisions:
- issue: 우주적 질서가 하나님의 명령 아래 있다는 표현의 강도
  chosen_reading: 심연과 아래쪽 영역들도 자율적으로 존재하는 것이 아니라, 같은 명령들에 의해 붙들려 있는 것으로 표현했습니다.
  alternative_readings:
  - 단순한 자연 질서의 일치로 완화하여 표현
  - ‘법칙들’로 일반화하여 신적 권위를 약화
  rationale: 문맥은 피조 세계 전체가 경계와 질서에 복종한다는 점을 강조하므로, ‘명령들’과 ‘붙들려 있습니다’로 신적 통치 아래의 구속성을 분명하게 드러냈습니다.
  doctrine_reference: 섭리와 창조 질서
