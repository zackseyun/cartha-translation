id: 1CLEM.20.6
reference: 1 Clement 20:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ χύτος τῆς ἀπείρου θαλάσσης κατὰ τὴν δημιουργίαν αὐτοῦ συσταθὲν εἰς τὰς συναγωγὰς οὐ παρεκβαίνει τὰ περιτεθειμένα αὐτῇ χείλη, ἀλλὰ καθὼς διετάξεν αὐτῇ, οὕτως ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/006.yaml
  text: The mass of the boundless sea[a], gathered together according to his creation into its basins, does not pass beyond the bounds set around it, but as he commanded it, so it does.
  footnotes:
  - marker: a
    text: Or 'The basin'.
    reason: previous_rendering
translation:
  language: ko
  text: 한없는 바다의 물덩이는 그분의 창조에 따라 여러 모여 있는 곳들에 모여 있으며, 그 둘레에 정해진 경계를 넘지 않습니다. 그분께서 그것에게 명하신 그대로 행합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바다의 웅덩이.”
    reason: 영어 POB의 기존 대안 표기를 한국어로 옮긴 것입니다. 본문은 χύτος를 물의 덩어리로 번역합니다.
lexical_decisions:
- source_word: τὸ χύτος
  english_pob_choice: The mass
  chosen_korean: 물덩어리
  alternatives_korean:
  - 큰 물줄기
  - 물의 질량
  - 물덩이
  lexicon: χύτος
  rationale: χύτος는 용기 자체가 아니라 바다의 ‘덩어리/질량’에 해당하므로, 문맥상 바다의 물을 가리키는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: κατὰ τὴν δημιουργίαν αὐτοῦ
  english_pob_choice: according to his creation
  chosen_korean: 그 지으심에 따라
  alternatives_korean:
  - 그의 창조에 따라
  - 그의 창조 질서에 따라
  lexicon: δημιουργία
  rationale: δημιουργία를 단순한 ‘창조 행위’가 아니라 그분의 지으신 방식/작용으로 읽어, 과도한 해석 없이 한국어로 간결하게 옮겼습니다.
- source_word: εἰς τὰς συναγωγάς
  english_pob_choice: into its basins
  chosen_korean: 그 웅덩이들 안에
  alternatives_korean:
  - 그 저장소들 안에
  - 그 바닥진 곳들 안에
  lexicon: συναγωγαί
  rationale: συναγωγαί는 여기서 물이 모이는 ‘모임/집합처’이므로, 바다에 생긴 물의 집적 공간을 드러내는 ‘웅덩이들’로 옮겼습니다.
- source_word: τὰ περιτεθειμένα αὐτῇ χείλη
  english_pob_choice: the bounds set around it
  chosen_korean: 자기에게 둘러쳐진 경계
  alternatives_korean:
  - 자기 주위에 둘러진 가장자리
  - 자기에게 둘러 놓인 한계
  lexicon: χείλη
  rationale: χείλη는 문자적으로 ‘입술’이지만 물의 가장자리/테두리를 뜻하므로, 비유를 살리되 의미가 드러나는 ‘경계’로 처리했습니다.
theological_decisions:
- issue: 바다가 정해진 경계를 넘지 않는다는 묘사의 기능
  chosen_reading: 피조물이 창조주의 명령에 복종하는 질서를 보여 주는 자연 신학적 예로 읽었습니다.
  alternative_readings:
  - 단순한 자연 관찰로만 읽기
  - 시적 과장으로만 읽기
  rationale: 문장 전체가 ‘그분이 명령하신 대로’로 끝나므로, 창조주의 주권과 피조물의 순종을 드러내는 논지로 번역하는 것이 본문 기능에 맞습니다.
  doctrine_reference: 창조주 주권, 섭리
