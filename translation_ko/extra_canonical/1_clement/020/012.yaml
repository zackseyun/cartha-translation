  language: ko
  text: 그분께 영광과 위엄이 영원무궁토록 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ δόξα
  english_pob_choice: the glory
  chosen_korean: 영광
  alternatives_korean:
  - 찬양
  - 영예
  lexicon: δόξα
  rationale: 하나님께 돌려지는 영예와 찬미의 의미를 살려, POB의 ‘glory’에 해당하는 표준적인 ‘영광’을 택했습니다.
- source_word: ἡ μεγαλωσύνη
  english_pob_choice: the majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 존엄
  - 장엄함
  lexicon: μεγαλωσύνη
  rationale: 본문의 장엄하고 높으신 위신을 자연스럽게 드러내는 말로 ‘위엄’이 가장 간결하고 정확합니다.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁하도록
  alternatives_korean:
  - 영원히 또 영원히
  - 세세토록
  lexicon: εἰς + αἰών
  rationale: 직역형 반복보다 한국어로 자연스럽게 ‘끝없음’을 강조하는 표현으로, POB의 영속성 의미를 보존했습니다.
- source_word: ᾧ
  english_pob_choice: to whom
  chosen_korean: 그분께
  alternatives_korean:
  - 그에게
  - 그에게는
  lexicon: relative pronoun dative reference
  rationale: 앞선 문맥에서 하나님을 가리키는 여격 관계대명사를 한국어의 목적어/귀속 표현으로 자연스럽게 풀어, 찬양의 향방을 분명히 했습니다.
theological_decisions:
- issue: 찬양 공식에서의 여격 표현
  chosen_reading: ‘그분께 … 있기를 빕니다’로 마무리하여 하나님께 영광과 위엄이 돌려진다는 축도의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘그분에게 영광과 위엄이 있나이다’
  - ‘그분께 영광과 위엄이 있습니다’
  rationale: 그리스어 여격 ᾧ는 단순 서술보다 찬양/축도적 귀속을 드러내므로, 한국어에서도 청유형으로 마무리해 원문의 예전적 성격을 보존했습니다.
  doctrine_reference: doxology / benediction
