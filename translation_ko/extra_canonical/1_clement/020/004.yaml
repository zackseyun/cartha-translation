id: 1CLEM.20.4
reference: 1 Clement 20:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: γῆ κυοφοροῦσα κατὰ τὸ θέλημα αὐτοῦ τοῖς ἰδίοις καιροῖς τὴν πανπληθῆ ἀνθρώποις τε καὶ θηρίοις καὶ πᾶσι τοῖς οὖσιν ἐπ᾽ αὐτῆς ζῶσιν ἀνατέλλει τροφήν, μήτε διστατάσουσα μηδὲ ἀλλοιοῦσά τι τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020/004.yaml
  text: The earth, bearing according to his will at its proper seasons abundant food for men and beasts and all living things upon it, brings it forth, neither wavering nor altering anything of what has been decreed by him.
translation:
  language: ko
  text: 땅은 그의 뜻에 따라 제때에 사람들과 짐승들과 그 위에 있는 모든 살아 있는 것들을 위해 풍성한 양식을 내어, 그가 정해 두신 것을 조금도 흔들리거나 바꾸지 않고 내놓습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆ κυοφοροῦσα
  english_pob_choice: The earth, bearing ... abundant food
  chosen_korean: 땅은 ... 풍성한 양식을 내어
  alternatives_korean:
  - 땅은 ... 양식을 품어
  - 땅은 ... 열매를 맺어
  lexicon: γῆ / κυοφορέω
  rationale: κυοφοροῦσα는 단순히 ‘열매’를 낳는다는 뜻보다 ‘품고 지니며 내어놓는’ 지속적 산출을 가리키므로, 해석을 좁히지 않고 자연스러운 현대어로 옮겼습니다.
- source_word: τοῖς ἰδίοις καιροῖς
  english_pob_choice: at its proper seasons
  chosen_korean: 제때에
  alternatives_korean:
  - 자기 정해진 때에
  - 적절한 계절에
  lexicon: καιρός
  rationale: ἰδίοις가 ‘자기 고유한/알맞은’ 때를 강조하므로, 과도한 설명 없이도 시기성을 드러내는 ‘제때에’로 압축했습니다.
- source_word: ἀνατέλλει τροφήν
  english_pob_choice: brings it forth ... abundant food
  chosen_korean: 풍성한 양식을 내어
  alternatives_korean:
  - 양식을 솟아나게 하여
  - 먹을 것을 일으켜
  lexicon: ἀνατέλλω / τροφή
  rationale: ἀνατέλλει는 ‘솟아오르게 하다, 내다’의 뉘앙스가 있어, 대상인 τροφή를 드러내는 한국어 ‘내어’로 기능을 살렸습니다.
- source_word: τῶν δεδογματισμένων ὑπ᾽ αὐτοῦ
  english_pob_choice: what has been decreed by him
  chosen_korean: 그가 정해 두신 것
  alternatives_korean:
  - 그에 의해 법령으로 정해진 것
  - 그가 명령해 두신 것
  lexicon: δογματίζω
  rationale: 데δογματισμένων은 ‘결정되다/정해지다’의 뜻이므로, 교리적 뉘앙스를 피하고 본문이 말하는 창조 질서의 확정성을 살려 번역했습니다.
theological_decisions:
- issue: 자연의 풍성한 공급이 하나님의 뜻과 정하심 아래 있다는 표현
  chosen_reading: 땅의 생산은 우연한 자연현상이 아니라 하나님의 뜻에 따라 정해진 질서 안에서 이루어진다고 옮겼습니다.
  alternative_readings:
  - 땅은 자연 법칙에 따라 양식을 냅니다
  - 땅은 그분의 뜻을 따르되 자율적으로 양식을 냅니다
  rationale: 문맥은 창조 세계의 지속적 섭리를 강조하므로, ‘정해 두신 것’을 통해 하나님의 통치와 질서를 분명히 드러냈습니다.
  doctrine_reference: 섭리와 창조 질서
- issue: ‘흔들리거나 바꾸지 않고’의 이중 부정
  chosen_reading: 그가 정해 두신 것을 조금도 흔들리거나 바꾸지 않고로 옮겨, 본문의 충실성과 변개 불가성을 함께 보였습니다.
  alternative_readings:
  - 망설이지 않고 바꾸지 않고
  - 주저하지도 변형하지도 않고
  rationale: μήτε ... μηδὲ ... 구조는 단순한 반복이 아니라 두 방향의 부정을 겹쳐 강조하므로, 한국어에서도 중첩 부정을 유지했습니다.
  doctrine_reference: 창조 질서의 신실성
