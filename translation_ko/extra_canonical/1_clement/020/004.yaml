revisions:
- from: 땅은 그의 뜻에 따라 제때에 사람들과 짐승들과 그 위에 있는 모든 살아 있는 것들을 위해 풍성한 양식을 내어, 그가 정해 두신 것을 조금도 흔들리거나 바꾸지 않고 내놓습니다.[a][b]
  to: 땅은 그의 뜻에 따라 제때에 사람들과 짐승들과 그 위에서 사는 모든 존재를 위한 풍성한 양식을 품어 내놓으며, 주저하지도 그가 정하신 것 가운데 어느 것도 바꾸지도 않습니다.
  rationale: 'The revision retains the Greek''s sequence: the earth bears abundant sustenance and brings it forth at its proper times, then neither hesitates nor changes anything God has decreed. It removes an awkward verbal duplication, makes the final partitive expression explicit, and removes unsupported footnote anchors.'
