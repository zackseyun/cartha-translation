source:
  edition: Funk 1901 (normalized OCR)
  text: Στρατευώμεϑα οὖν, ἄνδρες ἀδελφοί, μετὰ πάσης ἐκτενείας ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ. 2. κατανοήσωμεν τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν, πῶς εὐτάκτως, πῶς εἰκτικῶς, πῶς ὑποτεταγμένως ἐπιτελοῦσιν τὰ διατασσόμενα. 3. οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ. . οἱ μεγάλοι δίχα τῶν μικρῶν οὐ δύνανται εἶναι οὔτε οἱ μικροὶ δὶχα τῶν μεγάλων· σύγκρασίς τις ἐστιν ἐν πᾶσιν, καὶ ἐν τούτοις χρῆσις. 5. λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
  pages:
  - 309
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037.yaml
  text: 'Therefore let us serve as soldiers[a], brothers, with all earnestness in his blameless commands. Let us consider those who serve as soldiers under our leaders: how orderly, how obediently, how submissively they carry out what is commanded. Not all are prefects, nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.


    The great cannot exist without the small, nor the small without the great. There is a certain blending in all things, and in these there is usefulness. Let us take our body: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[b][c][d][d][e], so that the whole body may be preserved.'
  footnotes:
  - marker: a
    text: The term rendered 'readily' may also be understood as 'obediently' or 'compliantly'; the sequence emphasizes disciplined responsiveness under authority.
    reason: lexical_alternative
    anchor_ref: '37:2'
  - marker: e
    text: '''There is a certain blending in all things'' expresses the interrelation of different parts rather than erasing their distinctions.'
    reason: lexical_alternative
    anchor_ref: '37:4'
  - marker: d
    text: Literally, 'all breathe together'; the image is of the body's parts acting in concert under one ordered submission.
    reason: lexical_alternative
    anchor_ref: '37:5'
  - marker: d
    text: Compare the body analogy in 1 Corinthians 12:12–27, where many members are necessary to one body.
    reason: cross_reference
    anchor_ref: '37:5'
  - marker: c
    text: Or 'nor so on'.
    reason: previous_rendering
  - marker: b
    text: Or 'in this there is usefulness'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 여러분 형제들아, 그의 흠 없는 명령 안에서 온갖 열심으로 군사처럼 싸우십시오. 우리 지도자들 아래에서 군사처럼 섬기는 사람들을 살펴보십시오. 그들이 얼마나 질서 있게, 얼마나 순종적으로, 얼마나 복종하며 명령된 것을 수행하는지 보십시오. 모든 이가 총독도 아니고, 군단장도 아니고, 백부장도 아니고, 오십부장도 아니고, 그 다음 순서의 직분도 아닙니다. 그러나 각 사람은 자기 고유한 대열 안에서 왕과 지도자들이 내리는 명령을 수행합니다.


    큰 것은 작은 것 없이는 존재할 수 없고, 작은 것도 큰 것 없이는 존재할 수 없습니다. 만물에는 어떤 섞임이 있으며, 이 일들에는 유익이 있습니다. 우리 몸을 보십시오. 머리는 발이 없으면 아무것도 아니고, 마찬가지로 발도 머리 없이는 아무것도 아닙니다. 우리 몸의 가장 작은 지체들조차도 온몸에 필요하고 유익합니다. 그러나 모든 지체는 함께 숨 쉬고 한 가지 복종을 사용하여, 온몸이 보존되게 합니다.[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στρατευώμεθα
  english_pob_choice: let us serve as soldiers
  chosen_korean: 군사처럼 싸우십시오
  alternatives_korean:
  - 군사로 섬기십시오
  - 군사로 복무합시다
  - 병사처럼 섬기십시오
  lexicon: LSJ
  rationale: 군사적 호소를 살리되, 현대 한국어에서 자연스러운 권고문으로 옮겼습니다. '싸우다'를 직접 쓰면 전투성이 강해지므로 '군사처럼'으로 비유를 유지했습니다.
- source_word: ἐκτενείας
  english_pob_choice: earnestness
  chosen_korean: 온갖 열심
  alternatives_korean:
  - 간절함
  - 열심
  - 전심전력
  lexicon: LSJ
  rationale: 단순한 정서가 아니라 지속적인 긴장과 힘씀을 가리켜서, 호소문체에 맞는 '온갖 열심'으로 옮겼습니다.
- source_word: ἀμώμοις προστάγμασιν
  english_pob_choice: blameless commands
  chosen_korean: 흠 없는 명령
  alternatives_korean:
  - 흠 없는 명령들
  - 흠 잡을 데 없는 명령
  - 티 없는 명령
  lexicon: LSJ
  rationale: 하나님의 명령의 도덕적 결함 없음이 핵심이므로 '흠 없는'을 택했습니다. '명령'은 προστάγματα의 지시적 성격을 살립니다.
- source_word: εὐτάκτως / εἰκτικῶς / ὑποτεταγμένως
  english_pob_choice: orderly / obediently / submissively
  chosen_korean: 질서 있게 / 순종적으로 / 복종하며
  alternatives_korean:
  - 정연하게 / 자발적으로 / 종속적으로
  - 질서정연하게 / 따르며 / 아래 놓여
  lexicon: LSJ
  rationale: 세 항목의 점층 구조를 살리기 위해 서로 겹치지 않도록 배열했습니다. 특히 ὑποτεταγμένως는 단순 순응이 아니라 아래에 놓이는 복종을 가리켜 '복종하며'로 옮겼습니다.
- source_word: σύγκρασίς
  english_pob_choice: blending
  chosen_korean: 섞임
  alternatives_korean:
  - 혼합
  - 배합
  - 어우러짐
  lexicon: LSJ
  rationale: 도서적이면서도 비유적 뉘앙스를 유지하는 말로, 구성 요소들의 구별을 지우지 않는 '섞임'을 택했습니다. 문맥상 '상호의존'으로 풀지 않고 혼합의 이미지를 보존했습니다.
- source_word: συνεπνεῖ
  english_pob_choice: breathe together
  chosen_korean: 함께 숨 쉬고
  alternatives_korean:
  - 함께 호흡하고
  - 같이 숨 쉬며
  - 호흡을 같이하고
  lexicon: LSJ
  rationale: 직역적 이미지를 살리기 위해 '숨 쉬다'를 유지했습니다. 다음 절의 '한 가지 복종'과 연결되어 전체 몸의 공동 작용을 드러냅니다.
- source_word: ὑποταγῇ μιᾷ
  english_pob_choice: one submission
  chosen_korean: 한 가지 복종
  alternatives_korean:
  - 하나의 복종
  - 한 가지 순종
  - 하나의 종속
  lexicon: LSJ
  rationale: 복종의 단일성을 직접 보여 주는 표현으로 옮겼습니다. 전통적 교회어보다 원문의 질서·종속 이미지를 우선했습니다.
theological_decisions:
- issue: ἄνδρες ἀδελφοί의 호칭
  chosen_reading: 형제들아
  alternative_readings:
  - 형제자매들아
  - 형제들이여
  - 형제 여러분
  rationale: 그리스어의 남성 호격과 친교적 호칭을 그대로 반영하면서, 본문 확장 없이 자연스러운 현대 한국어로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 군사 은유의 보존
  chosen_reading: 본문 전체에서 군사·지휘 은유를 유지
  alternative_readings:
  - 일반적인 봉사/질서 언어로 완화
  - 교회 질서만 강조하도록 비유를 약화
  rationale: 클레멘스의 권면은 계급, 명령, 복종의 군사적 구조를 통해 공동체 질서를 설득합니다. 이를 완화하면 원문의 수사적 힘이 약해집니다.
  doctrine_reference: 'PHILOSOPHY.md: preserve source texture and auditable reasoning'
