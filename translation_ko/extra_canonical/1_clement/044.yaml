  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044.yaml
  text: And our apostles knew through our Lord Jesus Messiah that there would be strife over the name of the overseer’s office[a]. Therefore, for this reason, since they had received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry. Therefore we consider it unjust that those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of Messiah blamelessly, with humility, quietly, and without arrogance, and who for a long time have been well attested by all—such men should be removed from the ministry. For it will be no small sin for us if we cast out from the overseer’s office those who have offered the gifts blamelessly and devoutly. Blessed are the elders who went on before, who had a timely and complete departure; for they do not fear lest someone remove them from the place
    appointed to them[f][e][d][c][b]. For we see that you have displaced some who were conducting themselves well from the ministry that had been blamelessly honored by them.
  footnotes:
  - marker: a
    text: Or 'over the office of oversight.' The Greek ἐπισκοπή can denote oversight or the office connected with it.
    reason: lexical_alternative
  - marker: b
    text: '''Fall asleep'' is a traditional Christian euphemism for death, retained here to preserve the text’s cadence and theological texture.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'offered its gifts' reflects sacrificial language in the Greek, presenting church office in liturgical-service terms rather than merely administrative ones.
    reason: cultural_note
  - marker: d
    text: '''Elders'' translates πρεσβύτεροι; some readers may prefer the transliteration ''presbyters.'''
    reason: lexical_alternative
  - marker: e
    text: Or 'from the ministry that had been honorably and blamelessly assigned to them.'.
    reason: previous_rendering
  - marker: f
    text: Or 'cast out from the overseer’s office those who have offered its gifts'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 사도들은 우리 주 예수 메시아를 통해서 감독 직분의 이름을 두고 분쟁이 일어날 것을 알았습니다. 그러므로 이런 이유로, 그들은 완전한 예지를 받았기에 앞서 언급한 사람들을 세우고, 나중에는 그들이 잠들게 되면 다른 검증된 사람들로 그들의 직무를 이어받게 하는 추가 규정을 두었습니다. 그러므로 우리는 그들에 의해 세워졌거나, 그 뒤에 다른 평판 있는 사람들에 의해 온 회중의 동의를 받아 세워졌으며, 메시아의 양 떼를 흠 없이, 겸손하게, 조용히, 그리고 교만함 없이 섬겼고, 오랫동안 모든 사람에게서 좋은 증언을 받아 온 이들을 그 직무에서 내쫓는 것은 옳지 않다고 생각합니다. 감독 직분의 선물을 흠 없이 그리고 경건하게 드려 온 이들을 우리가 내버린다면, 그것은 우리에게 결코 작은 죄가 아닐 것입니다. 앞서 지나간 장로들은 복되니, 그들은 때맞추어 온전한 떠남을 맞았기 때문입니다. 그들은 아무도 자신들에게 지정된 자리를 빼앗아 갈까 두려워하지 않습니다. 우리는 여러분이 훌륭하게 살아가던 몇 사람을 그들에게서 흠 없이 존중받던 직무에서 옮겨 버린 것을 보고 있습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ / τοῦ Χριστοῦ
  english_pob_choice: our Lord Jesus Messiah / flock of Messiah
  chosen_korean: 예수 메시아
  alternatives_korean:
  - 예수 그리스도
  - 예수 메시아
  lexicon: DOCTRINE.md project glossary
  rationale: POB 정책상 Χριστός는 제목적 용법에서 ‘메시아’로 옮기며, 여기서는 고정 인명형보다 주제적 칭호의 힘이 살아 있습니다.
- source_word: ἐπισκοπῆς
  english_pob_choice: overseer’s office
  chosen_korean: 감독 직분
  alternatives_korean:
  - 감독의 직분
  - 감독 직무
  - 감독직
  lexicon: BDAG
  rationale: ἐπισκοπή는 단순한 ‘감독’이 아니라 직분/직책의 성격을 가지므로, 한국어에서는 ‘직분’으로 기관적 의미를 분명히 했습니다.
- source_word: πρόγνωσιν εἰληφότες τελείαν
  english_pob_choice: having received complete foreknowledge
  chosen_korean: 완전한 예지를 받았기에
  alternatives_korean:
  - 완전한 미리 앎을 받았기에
  - 온전한 예지력을 받았기에
  lexicon: BDAG
  rationale: πρόγνωσις의 ‘미리 앎’을 살리되, λειτουργία 관련 문맥에서 사도들의 선행 인지를 강조하는 표현으로 자연스럽게 옮겼습니다.
- source_word: ἐπινομὴν
  english_pob_choice: a further provision
  chosen_korean: 추가 규정
  alternatives_korean:
  - 추가 마련
  - 후속 조치
  - 부가적 규정
  lexicon: LSJ
  rationale: 희귀어로서 후속적 제도를 뜻하므로, succession 규범을 드러내는 ‘규정’이 가장 안정적으로 문맥을 받쳐 줍니다.
- source_word: κοιμηθῶσιν
  english_pob_choice: fall asleep
  chosen_korean: 잠들게 되면
  alternatives_korean:
  - 죽게 되면
  - 잠드시면
  lexicon: BDAG
  rationale: 죽음을 완곡하게 표현하는 관용구를 보존해 사도적·초기교회적 어조를 유지했습니다.
- source_word: προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς
  english_pob_choice: have offered the gifts
  chosen_korean: 감독 직분의 선물을 … 드려 온
  alternatives_korean:
  - 감독 직분의 제물을 바쳐 온
  - 감독 직분에 속한 예물을 드려 온
  lexicon: BDAG
  rationale: τὰ δῶρα의 제의적 뉘앙스를 살리면서도 한국어에서는 ‘선물’보다 문맥상 ‘드리다’와 결합해 봉헌/섬김의 색채를 유지했습니다.
- source_word: ἀνάλυσιν
  english_pob_choice: departure
  chosen_korean: 떠남
  alternatives_korean:
  - 출발
  - 이별
  - 해산
  lexicon: BDAG
  rationale: 죽음을 우회하는 품위 있는 완곡어법을 그대로 살리되, 현대 한국어로도 이해되는 낱말을 택했습니다.
theological_decisions:
- issue: 교회 직분의 용어 선택(ἐπισκοπή, λειτουργία, πρεσβύτεροι)
  chosen_reading: 감독 직분 / 직무 / 장로
  alternative_readings:
  - 감독의 직분 / 사역 / 노회자
  - 감독직 / 봉사 / 장로들
  rationale: 본문은 제도적 승계와 섬김의 질서를 함께 말하므로, 직책성은 ‘직분’, 봉사성은 ‘직무’, πρεσβύτεροι는 전통적 오해를 줄이기 위해 ‘장로’로 두었습니다.
  doctrine_reference: 'DOCTRINE.md: consistency of key terms; preserve ecclesial texture without later denominational load'
- issue: ‘그리스도’ 대신 ‘메시아’ 사용
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - Christ
  rationale: 표제어 Χριστός는 여기서 이름이 아니라 칭호로 기능하므로, POB의 일관된 칼을 따라 ‘메시아’로 유지하는 것이 원문 의도를 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: translate titles; transliterate names'
