id: 1CLEM.63.2
reference: 1 Clement 63:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: χαρὰν γὰρ καὶ ἀγαλλίασιν ἡμῖν παρέξετε, ἐὰν ὑπήκοοι γενήμενοι τοῖς ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος ἐκκόψητε τὴν ἄθεμον τῆς ζήλους ὑμῶν ὀργὴν κατὰ τὴν ἔντευξιν, ἣν ἐποιησάμεθα περὶ εἰρήνης καὶ ὁμονοίας ἐν τῇδε τῇ ἐπιστολῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/002.yaml
  text: For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord.
translation:
  language: ko
  text: 여러분이 우리에게 기쁨과 큰 즐거움을 주실 것입니다. 만일 여러분이 성령을 통해 우리가 쓴 것들에 순종하여, 여러분의 질투에서 나온 무법한 분노를 끊어 버리면 말입니다. 이는 우리가 이 편지에서 평화와 화목을 위하여 드린 요청에 따른 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρὰν ... καὶ ἀγαλλίασιν
  english_pob_choice: joy and exultation
  chosen_korean: 기쁨과 큰 즐거움
  alternatives_korean:
  - 기쁨과 환희
  - 기쁨과 즐거움
  lexicon: χαρά / ἀγαλλίασις
  rationale: 두 명사 모두 강한 긍정 감정을 나타내므로, 단순 반복보다 강도를 살려 ‘기쁨과 큰 즐거움’으로 옮겼습니다.
- source_word: παρέξετε
  english_pob_choice: you will give us
  chosen_korean: 우리에게 ... 주실 것입니다
  alternatives_korean:
  - 우리에게 ... 주게 될 것입니다
  - 우리에게 ... 드리게 될 것입니다
  lexicon: παρέχω
  rationale: 직역적 의미인 ‘주다/제공하다’를 살려, 청중의 순종이 화자에게 기쁨을 ‘주게 된다’는 인과를 자연스럽게 표현했습니다.
- source_word: ὑφʼ ἡμῶν γεγραμμένοις διὰ τοῦ ἁγίου πνεύματος
  english_pob_choice: the things written by us through the Holy Spirit
  chosen_korean: 성령을 통해 우리가 쓴 것들
  alternatives_korean:
  - 성령으로 우리가 기록한 것들
  - 성령을 통하여 우리가 적은 것들
  lexicon: διὰ τοῦ ἁγίου πνεύματος / γεγραμμένοις
  rationale: ‘through the Holy Spirit’의 매개 의미를 분명히 하면서, 성령을 도구적 배경으로 둔 ‘성령을 통해’로 옮겼습니다.
- source_word: ἐκκόψητε τὴν ἄθεμον ... ὀργὴν
  english_pob_choice: you cut off the lawless anger of your jealousy
  chosen_korean: 여러분의 질투에서 나온 무법한 분노를 끊어 버리면
  alternatives_korean:
  - 여러분의 질투의 무법한 분노를 잘라 내면
  - 질투로 인한 불법한 분노를 제거하면
  lexicon: ἐκκόπτω / ἄθεμος / ζῆλος / ὀργή
  rationale: ‘끊어 버리다’는 강한 절단 이미지를 살리고, ζῆλος를 ‘질투’로, ἄθεμον을 ‘무법한’으로 유지해 법적/도덕적 일탈의 뉘앙스를 보존했습니다.
- source_word: εἰρήνης καὶ ὁμονοίας
  english_pob_choice: peace and concord
  chosen_korean: 평화와 화목
  alternatives_korean:
  - 평강과 일치
  - 평화와 일치
  lexicon: εἰρήνη / ὁμόνοια
  rationale: 공동체적 합의와 하나 됨을 드러내는 ὁμόνοια를 한국어에서 자연스럽게 전달하는 ‘화목’으로 옮겼습니다.
theological_decisions:
- issue: 성령을 통한 기록의 권위 표현
  chosen_reading: 본문의 ‘성령을 통해 우리가 쓴 것들’을 문자적으로 유지해, 사도의 편지가 성령의 매개 아래 놓인다는 주장을 약화하지 않았습니다.
  alternative_readings:
  - ‘성령으로 기록한 것들’처럼 더 매끄럽게 다듬기
  - ‘성령의 감동으로 쓴 것들’로 전통적 표현 사용
  rationale: 원문은 기록 행위의 매개로 성령을 제시하므로, 전통적 관용구로만 바꾸면 매개성과 문장 구조가 흐려질 수 있습니다.
  doctrine_reference: 성령의 영감/감동과 사도적 권위에 대한 신학적 표현
