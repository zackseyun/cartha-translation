reference: 1 Clement 63:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο δὲ ἐποιήσαμεν, ἵνα εἰδῆτε, ὅτι πᾶσα ἡμῶν φροντὶς καὶ γέγονεν καὶ ἔστιν εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/004.yaml
  text: And we have done this so that you may know that all our concern has been[a], and is, toward your being quickly at peace.
  footnotes:
  - marker: a
    text: Or 'be restored to peace'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리가 이것을 한 것은, 여러분이 속히 평화롭게 지내는 데 우리의 모든 관심이 이미 있었고 지금도 있다는 것을 여러분이 알도록 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 속히 평화를 이루도록 하는 데’.
    reason: εἰρηνεῦσαι는 능동태 부정사이며, 문맥상 ‘평화롭게 지내다’ 또는 ‘평화를 이루다’로 옮길 수 있습니다. 수동적인 ‘평화로 회복되다’는 피합니다.
lexical_decisions:
- source_word: ἐποιήσαμεν
  english_pob_choice: we have done this
  chosen_korean: 우리가 이것을 행한 것은
  alternatives_korean:
  - 우리가 이것을 했습니다
  - 우리가 이것을 행한 바는
  lexicon: ποιέω
  rationale: 완료의 결과를 살리되 한국어에서는 자연스러운 과거 서술인 ‘행한 것’으로 옮겨, 뒤따르는 목적절을 매끄럽게 받게 했습니다.
- source_word: φροντὶς
  english_pob_choice: concern
  chosen_korean: 관심
  alternatives_korean:
  - 걱정
  - 염려
  - 돌봄
  lexicon: φροντίς
  rationale: 문맥상 목회적 배려와 의도된 관심의 뜻이 강하므로, 영어 POB의 ‘concern’을 반영해 ‘관심’으로 옮겼습니다.
- source_word: εἰς τὸ ἐν τάχει ὑμᾶς εἰρηνεῦσαι
  english_pob_choice: toward your being quickly at peace
  chosen_korean: 여러분이 속히 평안하게 되도록 향해
  alternatives_korean:
  - 여러분이 속히 평안하게 되기 위해
  - 여러분이 빨리 평화를 누리도록
  lexicon: εἰρηνεύω
  rationale: 활동적인 부정사 εἰρηνεῦσαι를 수동적 ‘회복되다’로 돌리지 않고, ‘평안하게 되다’로 직접 반영했습니다.
theological_decisions:
- issue: εἰρηνεῦσαι의 행위성
  chosen_reading: ‘평안하게 되다’로 옮겨, 화해/회복을 암시하되 수동적 복원 표현은 피했습니다.
  alternative_readings:
  - ‘평화로 회복되다’
  - ‘평안을 되찾다’
  rationale: 그리스어는 ενεργητική(능동) 부정사이므로, 공동체가 실제로 평강의 상태에 들어가도록 지향한다는 의미를 유지해야 합니다.
  doctrine_reference: 문법적 상 - active infinitive εἰρηνεῦσαι
