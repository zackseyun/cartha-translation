revisions:
- from: 우리가 이것을 행한 것은 여러분이 알게 하려는 것입니다. 곧 우리의 모든 관심이 이미 그러했고, 지금도 여러분이 속히 평안하게 되도록 향해 있다는 것을 말입니다.[a]
  to: 우리가 이것을 한 것은, 여러분이 속히 평화롭게 지내는 데 우리의 모든 관심이 이미 있었고 지금도 있다는 것을 여러분이 알도록 하려는 것입니다.[a]
  rationale: 문장을 원문의 ἵνα εἰδῆτε, ὅτι 절에 맞추어 재구성하고, ‘이미 있었고 지금도 있다’로 γέγονεν καὶ ἔστιν의 시간적 대조를 보존했습니다. εἰρηνεῦσαι는 자연스러운 현대 한국어로 ‘평화롭게 지내다’라 하여, 영어 감사 기록의 ‘be at peace’ 및 그리스어의 능동 용법을 충실히 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:54Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 구조(‘우리가 이것을 한 것은 … 알게 하려는 것이다’)와 φροντίς의 지속성(‘이미 있었고 지금도 있다’)은 초안에 대체로 반영되어 있습니다. 그러나 εἰς τὸ … εἰρηνεῦσαι를 ‘평안하게 되도록 향해 있다’로 옮긴 부분은 한국어 문법과 결합이 부자연스럽고, ‘평안하게 되다’는 상태 변화 쪽으로 기울어 능동·자동사적 ‘평화롭게 지내다/평화를 이루다’의 뜻을 충분히 살리지 못합니다.
  naturalness: ‘…되도록 향해 있다는 것’은 현대 표준 한국어에서 자연스럽지 않습니다. 목적·지향을 ‘…하는 데 우리의 모든 관심이 있었다’로 표현하면 원문의 εἰς τὸ 구문과 지속 대조를 자연스럽고 명료하게 전달합니다.
  terminology: φροντίς는 이 문맥에서 ‘관심’으로 무난합니다. εἰρηνεύσαι는 수동적인 ‘평화로 회복되다’가 아니라 ‘평화롭게 지내다’로 옮겨 능동태이면서도 자동사적인 용법을 보존했습니다.
  issues:
  - severity: medium
    issue: ‘여러분이 속히 평안하게 되도록 향해 있다’는 표현
