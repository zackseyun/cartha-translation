  terminology: ‘신실한’은 πιστοί의 신뢰할 만하고 충실한 성품을, ‘신중한’은 σώφρονες의 절제되고 분별 있는 성품을 이 문맥에서 무리 없이 전달합니다. ‘증인’은 μάρτυρες의 공적 증언 기능을 과도하게 신학화하지 않고 유지합니다.
