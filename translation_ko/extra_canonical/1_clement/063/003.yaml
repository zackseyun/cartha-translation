id: 1CLEM.63.3
reference: 1 Clement 63:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπέμψαμεν δὲ ἄνδρας πιστοὺς καὶ σώφρονας ἀπὸ νεότητος ἀναστραφέντας ἕως γήρους ἀμέμπτως ἐν ἡμῖν, οἵτινες καὶ μάρτυρες ἔσονται μεταξὺ ὑμῶν καὶ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/003.yaml
  text: And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these will also be witnesses between you and us.
translation:
  language: ko
  text: 우리는 청년 시절부터 노년까지 우리 가운데서 흠 없이 살아온 신실하고 신중한 사람들을 보냈습니다. 그들은 또한 여러분과 우리 사이의 증인이 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστοὺς
  english_pob_choice: faithful
  chosen_korean: 신실한
  alternatives_korean:
  - 믿음직한
  - 충실한
  lexicon: πιστός
  rationale: 사람의 성품을 가리키는 문맥이므로 단순한 ‘믿는’보다 관계적·윤리적 충실성을 드러내는 ‘신실한’이 적절합니다.
- source_word: σώφρονας
  english_pob_choice: prudent
  chosen_korean: 신중한
  alternatives_korean:
  - 분별 있는
  - 절제하는
  lexicon: σώφρων
  rationale: POB의 prudent에 맞추되, 한국어에서 판단의 조심스러움과 절제를 함께 담는 자연스러운 표현으로 ‘신중한’을 택했습니다.
- source_word: ἀπὸ νεότητος ἀναστραφέντας ἕως γήρους
  english_pob_choice: from youth until old age have conducted themselves
  chosen_korean: 청년 시절부터 노년까지 ... 살아온
  alternatives_korean:
  - 젊은 시절부터 늙을 때까지 ... 지내온
  - 젊은 때부터 노년까지 ... 행한
  lexicon: ἀναστρέφω
  rationale: 행동 전반의 삶의 양식을 뜻하므로, 직역보다 한국어에서 자연스럽고 인격적 삶의 지속성을 보여 주는 ‘살아온’으로 옮겼습니다.
- source_word: ἀμέμπτως
  english_pob_choice: blamelessly
  chosen_korean: 흠 없이
  alternatives_korean:
  - 책망할 것 없이
  - 흠잡을 데 없이
  lexicon: ἀμέμπτως
  rationale: 도덕적 비난 가능성이 없다는 뜻을 간결하게 살리면서, 현대 한국어에서 덜 경직된 ‘흠 없이’를 선택했습니다.
- source_word: μάρτυρες
  english_pob_choice: witnesses
  chosen_korean: 증인
  alternatives_korean:
  - 증언자
  - 목격자
  lexicon: μάρτυς
  rationale: 법정적·공적 대조를 드러내는 기본 의미를 따라 ‘증인’으로 옮겼습니다.
theological_decisions:
- issue: ‘우리 가운데서’와 ‘여러분과 우리 사이’의 관계적 대비
  chosen_reading: 공동체 내부의 검증된 인물들을 외부 수신자에게 증언 가능한 인물로 제시하는 대조를 살렸습니다.
  alternative_readings:
  - 단순한 정보 전달로 약화시키는 번역
  - ‘서로’로 평준화하는 번역
  rationale: 원문은 신뢰성 있는 파견과 증언의 공적 기능을 강조하므로, 관계 항을 분명히 유지하는 것이 본문의 설득력을 보존합니다.
  doctrine_reference: 교회 권징·증언의 공적 성격
- issue: ‘증인’의 미래형 의미
  chosen_reading: ‘될 것입니다’로 옮겨 장차 증언 역할을 하게 될 것임을 분명히 했습니다.
  alternative_readings:
  - 현재형 ‘증인입니다’
  - 가능형 ‘증인이 될 수 있습니다’
  rationale: ἔσονται의 미래를 반영해, 단순한 상태 진술이 아니라 앞으로의 증언 기능을 나타내야 합니다.
  doctrine_reference: 문법적 미래 시제
