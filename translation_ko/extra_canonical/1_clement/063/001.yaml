- from: 그러므로 이처럼 많고 많은 본보기들에 가까이 나아온 우리로서는 목을 굽히고, 순종의 자리를 채우며, 잠잠해야 합니다. 그렇게 하여 헛된 분쟁을 그치고, 우리 앞에 놓인 진리 안의 목표에 흠 없이 이르러야 합니다.[a]
