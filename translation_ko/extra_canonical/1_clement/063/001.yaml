id: 1CLEM.63.1
reference: 1 Clement 63:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Θεμιτὸν οὖν ἐστὶν τοῖς τοιούτοις καὶ τοσούτοις ὑποδείγμασιν προσεληλυθότας ὑποθεῖναι τὸν τράχηλον καὶ τὸν τῆς ὑπακατὰ τὸν προκείμενον ἡμῖν ἐν ἀληθείᾳ σκοπὸν δίχα παντὸς μώμου καταντήσωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063/001.yaml
  text: Therefore it is fitting that, having come near to such and so many examples, we should bow the neck and, fulfilling the place of obedience, we should be quiet, so that having ceased from the vain sedition, we may reach the goal set before us in truth, without any blemish.
  footnotes:
  - marker: a
    text: Or 'taking our place under obedience, should reach the goal'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이처럼 많고 많은 본보기들에 가까이 나아온 우리로서는 목을 굽히고, 순종의 자리를 채우며, 잠잠해야 합니다. 그렇게 하여 헛된 분쟁을 그치고, 우리 앞에 놓인 진리 안의 목표에 흠 없이 이르러야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεμιτὸν οὖν ἐστὶν
  english_pob_choice: Therefore it is fitting
  chosen_korean: 그러므로 … 해야 합니다
  alternatives_korean:
  - 그러므로 … 마땅합니다
  - 그러므로 … 합당합니다
  lexicon: θεμιτός
  rationale: 형식상 판단 진술을 한국어의 자연스러운 권고/권면 문장으로 옮기되, 원문의 ‘마땅함’ 의미는 ‘해야 합니다’에 포함해 살렸습니다.
- source_word: ὑποθεῖναι τὸν τράχηλον
  english_pob_choice: bow the neck
  chosen_korean: 목을 굽히고
  alternatives_korean:
  - 목을 내리고
  - 목을 숙이고
  lexicon: τράχηλος
  rationale: 직역의 이미지가 분명하므로 ‘목을 굽히다’로 옮겨, 복종의 신체적 비유를 살렸습니다.
- source_word: ὑπακοῆς τόπον / ὑπακατὰ τὸν ... σκοπόν (source OCR-corrupt phrase)
  english_pob_choice: fulfilling the place of obedience
  chosen_korean: 순종의 자리를 채우며
  alternatives_korean:
  - 순종의 몫을 다하며
  - 순종의 위치를 차지하며
  lexicon: ὑπακοή
  rationale: 전승된 영어 번역과 OCR이 훼손된 그리스어를 함께 고려해, 문맥상 ‘obedience’의 요구를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: ἡσυχάσαι, ὅπως κοπάσαντες τῆς ματαίας στάσεως
  english_pob_choice: we should be quiet, so that having ceased from the vain sedition
  chosen_korean: 잠잠해야 합니다. 그렇게 하여 헛된 분쟁을 그치고
  alternatives_korean:
  - 고요해야 합니다. 그렇게 하여 헛된 소요를 그치고
  - 잠잠하여 헛된 반역을 멈추고
  lexicon: ἡσυχάζω / στάσις
  rationale: ἡσυχάζω는 단순 침묵보다 ‘잠잠함’이 더 자연스럽고, στάσις는 교회 문맥의 공개적 분열·소요를 반영해 ‘분쟁’으로 옮겼습니다.
- source_word: δίχα παντὸς μώμου
  english_pob_choice: without any blemish
  chosen_korean: 흠 없이
  alternatives_korean:
  - 어떤 흠도 없이
  - 티 없이
  lexicon: μῶμος
  rationale: 결함 없음의 의미를 간결하게 살리면서, 도덕적·공동체적 온전함을 드러내는 표현으로 다듬었습니다.
theological_decisions:
- issue: στάσις의 신학적/공동체적 뉘앙스
  chosen_reading: ‘헛된 분쟁’으로 옮겨, 단순한 내적 갈등이 아니라 공동체를 깨는 분열 행위를 가리키도록 했습니다.
  alternative_readings:
  - 헛된 소요
  - 헛된 반역
  rationale: 1 Clement 전체의 수신 상황이 교회 내 분열과 질서 회복에 관한 것이므로, 한국어 독자가 공동체적 파열을 즉시 인식하도록 했습니다.
  doctrine_reference: 교회론 / 공동체 질서
