  - 323
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/048.yaml
  text: 'Let us therefore put this away quickly[a], and let us fall down before the Master and weep, imploring him that, having become gracious, he may be reconciled to us and restore us to the pure conduct of the dignity of our brotherly love.


    For a gate of righteousness has been opened—this very gate into life—as it is written: “Open to me the gates of righteousness; entering through them, I will give thanks to the Lord.” “This is the gate of the Lord; the righteous will enter through it.”


    Therefore, though many gates stand open, this is the gate in righteousness—the one in Messiah. Blessed are all who entered through it and who direct their course in holiness and righteousness, carrying out all things without disturbance.


    Let a man be faithful; let him be able to expound knowledge; let him be wise in discerning words; let him be pure in works. For by so much the more he ought to be humble, by as much as he seems to be greater, and to seek what benefits all[b][c][d][e], and not what is his own.'
  footnotes:
  - marker: a
    text: The citation echoes Psalm 118:19–20 (LXX 117:19–20).
    reason: cross_reference
    anchor_ref: '48:2'
  - marker: e
    text: Greek 'in the Messiah'; many English readers will recognize the traditional rendering 'in Christ.'
    reason: lexical_alternative
    anchor_ref: '48:4'
  - marker: d
    text: The Greek uses a masculine singular form ('a man') in a representative paraenetic sense.
    reason: cultural_note
    anchor_ref: '48:5'
  - marker: c
    text: Or 'to the pure conduct befitting our solemn brotherly love.'.
    reason: previous_rendering
  - marker: b
    text: Or 'Yet by so much the more he ought to be humble'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 우리가 이것을 속히 버리고, 주인 앞에 엎드려 울며 그에게 간청하여 그가 은혜로우신 분이 되시고 우리와 화해하시며, 우리 형제 사랑의 존엄에 합당한 깨끗한 행실로 우리를 회복해 주시게 합시다.


    의의 문이 열렸습니다 — 바로 생명으로 들어가는 이 문입니다 — 기록된 바, “의의 문들아, 내게 열려라. 내가 그 문들로 들어가서 주님께 감사하리라.” 또 “이것은 주님의 문이니, 의인들이 그 문으로 들어가리라” 하였습니다.


    그러므로 많은 문들이 열려 있어도, 이 의 안에 있는 이 문, 곧 메시아 안에 있는 이 문이 있습니다. 그 문으로 들어간 모든 사람과 거룩함과 의로 자기 행로를 바르게 하며, 모든 일을 흔들림 없이 행하는 사람은 복됩니다.


    사람은 신실해야 합니다. 지식을 풀어 설명할 수 있어야 하며, 말을 분별할 줄 알아야 하고, 행실에서 깨끗해야 합니다. 그가 더 크게 여겨질수록 더욱 겸손해야 하며, 자기에게 속한 것보다 모든 사람에게 유익한 것을 구해야 합니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότῃ
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 주인님
  lexicon: LSJ
  rationale: δεσπότης는 κύριος보다 더 강한 주권·소유의 뉘앙스를 가지므로, 별도의 종교적 호칭인 ‘주님’보다 ‘주인’이 대비를 더 분명히 살립니다.
- source_word: ἵλεως γενόμενος
  english_pob_choice: having become gracious
  chosen_korean: 은혜로우신 분이 되시고
  alternatives_korean:
  - 긍휼을 베푸시고
  - 자비로우신 분이 되시고
  lexicon: BDAG
  rationale: 하나님께 유리한 태도를 구하는 표현으로서, ‘은혜로우신 분’이 원문의 호의·호감을 비교적 직접적으로 담습니다.
- source_word: ἐπικαταλλαγῇ
  english_pob_choice: be reconciled to us
  chosen_korean: 우리와 화해하시며
  alternatives_korean:
  - 우리와 화목하시며
  - 우리를 향해 화해되시며
  lexicon: LSJ
  rationale: 복합어가 관계 회복의 강한 의미를 가지므로, ‘화해하시다’가 수동적 기술보다 관계적 회복을 자연스럽게 드러냅니다.
- source_word: σεμνὴν τῆς φιλαδελφίας ἡμῶν ἁγνὴν ἀγωγὴν
  english_pob_choice: the pure conduct of the dignity of our brotherly love
  chosen_korean: 우리 형제 사랑의 존엄에 합당한 깨끗한 행실
  alternatives_korean:
  - 우리 형제 사랑의 엄숙한 깨끗한 행실
  - 우리 형제 사랑에 합당한 정결한 생활
  lexicon: LSJ
  rationale: 명사구의 관계를 살리기 위해 σεμνή와 ἁγνή를 각각 ‘존엄’과 ‘깨끗한’으로 분해하여, 단순히 도덕적 ‘행실’보다 ‘형제 사랑의 품위에 맞는 삶’이라는 구조를 보존했습니다.
- source_word: ἐν Χριστῷ
  english_pob_choice: in the Messiah
  chosen_korean: 메시아 안에 있는
  alternatives_korean:
  - 그리스도 안에 있는
  - 메시아 안에서의
  lexicon: project glossary
  rationale: 프로젝트 기본 용례에 따라 칭호 Χριστός는 ‘메시아’로 옮기며, 반복된 문장 안의 강조를 자연스럽게 살렸습니다.
- source_word: ἀταράχως
  english_pob_choice: without disturbance
  chosen_korean: 흔들림 없이
  alternatives_korean:
  - 방해 없이
  - 동요 없이
  lexicon: LSJ
  rationale: 공동체적 소란의 부재와 내적 안정의 뉘앙스를 함께 담기 위해, 보다 관용적인 ‘흔들림 없이’를 택했습니다.
- source_word: γνῶσιν ἐξεπεῖν
  english_pob_choice: expound knowledge
  chosen_korean: 지식을 풀어 설명할 수 있어야 하며
  alternatives_korean:
  - 지식을 말해 낼 수 있어야 하며
  - 지식을 충분히 말할 수 있어야 하며
  lexicon: LSJ
  rationale: 단순히 아는 것이 아니라 가르치듯 풀어 말하는 뜻이므로, ‘풀어 설명하다’가 가장 자연스럽고 정확합니다.
- source_word: τὸ κοινωφελές
  english_pob_choice: what benefits all
  chosen_korean: 모든 사람에게 유익한 것
  alternatives_korean:
  - 공동의 유익
  - 공익
  lexicon: LSJ
  rationale: 추상명사보다 목적어 형태를 유지해, 원문의 윤리적 권고인 ‘모두에게 이익이 되는 것’을 직접 드러냈습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: 이 단락의 Χριστός는 고유명보다 칭호로 기능하므로, 프로젝트 원칙에 따라 ‘메시아’로 옮겨 초기 기독교적 칭호성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 화해/진정의 뉘앙스
  chosen_reading: 우리와 화해하시며
  alternative_readings:
  - 우리를 달래시며
  - 우리와 화목하시며
  rationale: ἵλεως γενόμενος와 ἐπικαταλλαγῇ는 단순한 감정 진정이 아니라 관계 회복을 가리키므로, ‘화해’로 옮겨 신학적 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
- issue: 대표적 남성 단수의 일반성
  chosen_reading: 사람은 신실해야 합니다
  alternative_readings:
  - 한 남자는 신실해야 합니다
  - 누구든지 신실해야 합니다
  rationale: 원문 τις의 대표적 남성 단수 형식을 한국어에서 부자연스럽지 않게 일반화하여, 규범적 훈계의 보편성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Gender-accurate over gender-neutral.'
