base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/063.yaml
  text: 'Therefore it is fitting that[a], having come near to such and so many examples, we should submit ourselves and, laying aside the arrogance of disobedience, attain the goal set before us in truth, without any blemish. 2. For you will give us joy and exultation if, becoming obedient to the things written by us through the Holy Spirit, you cut off the lawless anger of your jealousy, in accordance with the appeal that we made in this letter concerning peace and concord. 3. And we have sent faithful and prudent men, who from youth until old age have conducted themselves blamelessly among us; these also will be witnesses between you and us. 4. And we have done this so that you may know that all our care has been, and is[b][c][a], for this: that you may quickly be restored to peace.'
  footnotes:
  - marker: a
    text: Or 'envy' for 'jealousy'; the Greek term can denote either, but here it is clearly negative in context.
    reason: lexical_alternative
    anchor_ref: '63:2'
  - marker: a
    text: '''Through the Holy Spirit'' expresses Clement''s strong claim that the letter''s admonition is Spirit-mediated, not merely personal advice.'
    reason: cultural_note
    anchor_ref: '63:2'
  - marker: c
    text: The final clause may also be rendered 'that you may quickly make peace' or 'that you may quickly be at peace.'
    reason: alternative_reading
    anchor_ref: '63:4'
  - marker: b
    text: Or 'taking our place under obedience, should reach the goal set before us in truth, without any blemish.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이처럼 많고도 그러한 예들을 접한 우리는 마땅히 자신을 낮추어 복종하며, 불순종의 오만을 버리고, 우리 앞에 놓인 목표에 진리 안에서 아무런 흠 없이 이르러야 합니다. 2. 또 우리가 성령을 통하여 기록한 것들에 여러분이 순종하게 되어, 여러분의 질투에서 나온 불법한 분노를 끊어 버린다면, 여러분은 우리에게 기쁨과 환희를 줄 것입니다. 이는 우리가 이 편지에서 평강과 화목을 위해 드린 호소에 따른 것입니다. 3. 우리는 신실하고 신중한 사람들을 보냈습니다. 그들은 젊은 시절부터 늙도록 우리 가운데서 흠 없이 살아온 사람들로서, 여러분과 우리 사이에서 증인이 될 것입니다. 4. 우리는 여러분이 알게 하려고 이렇게 했습니다. 곧 우리 모든 염려가 이제까지도 그러했고 지금도 그러하며, 이것이니 곧 여러분이 속히 평강으로 회복되는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θεμιτόν
  english_pob_choice: it is fitting
  chosen_korean: 마땅합니다
  alternatives_korean:
  - 옳습니다
  - 적절합니다
  - 합당합니다
  lexicon: LSJ
  rationale: 의무적·권고적 어조를 살리면서도 단순 법적 허용보다 도덕적 적합성을 드러냅니다.
- source_word: ὑποθεῖναι τὸν τράχηλον
  english_pob_choice: bow the neck / submit ourselves
  chosen_korean: 자신을 낮추어 복종하며
  alternatives_korean:
  - 목을 굽혀
  - 목을 내어 복종하며
  - 복종하고
  lexicon: LSJ
  rationale: 신체 은유를 너무 직역하면 한국어가 어색해지므로, 복종의 몸짓을 유지하면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: δίχα παντὸς μώμου
  english_pob_choice: without any blemish
  chosen_korean: 아무런 흠 없이
  alternatives_korean:
  - 아무런 허물 없이
  - 흠 없이
  - 책망할 것 없이
  lexicon: LSJ
  rationale: μώμος의 결함·흠의 뉘앙스를 살려, 도덕적 무흠함을 짧고 또렷하게 표현했습니다.
- source_word: διὰ τοῦ ἁγίου πνεύματος
  english_pob_choice: through the Holy Spirit
  chosen_korean: 성령을 통하여
  alternatives_korean:
  - 성령으로
  - 성령을 통해
  - 거룩한 영을 통하여
  lexicon: BDAG
  rationale: POB가 지적한 바와 같이 단순한 인간적 권면이 아니라 성령 매개성을 분명히 드러내기 위해 '성령을 통하여'로 옮겼습니다.
- source_word: ζήλους
  english_pob_choice: jealousy
  chosen_korean: 질투
  alternatives_korean:
  - 시기
  - 열심
  - 투기
  lexicon: BDAG
  rationale: 문맥상 분열을 낳는 부정적 감정이므로, POB의 판단을 따라 '질투'로 유지했습니다.
- source_word: εἰρηνεῦσαι
  english_pob_choice: be restored to peace
  chosen_korean: 평강으로 회복되는 것
  alternatives_korean:
  - 평강을 이루는 것
  - 평강에 이르는 것
  - 평강을 회복하는 것
  lexicon: LSJ
  rationale: 단순히 '평강이다/평강하다'로 줄이기보다, 이 편지의 화해 맥락에 맞는 회복의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 성령을 통하여 기록한 것들에 순종하라는 표현의 권위성
  chosen_reading: 편지의 권면을 성령 매개적 기록으로 직접 제시했습니다.
  alternative_readings:
  - 성령의 인도 아래 쓴 것들
  - 성령의 도움으로 기록한 것들
  rationale: 그리스어가 주장하는 강한 권위성을 약화시키지 않기 위해, 모호한 영감 표현으로 완화하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 성령 영감에 대한 본문의 자기증언 유지
- issue: εἰρηνεῦσαι의 결말
  chosen_reading: '''속히 평강으로 회복되는 것''으로 옮겼습니다.'
  alternative_readings:
  - 속히 평강하게 되는 것
  - 속히 평강에 이르는 것
  - 속히 화평을 이루는 것
  rationale: 이 문맥은 단순 상태 진술보다 화해와 복원의 종결을 가리키므로, 회복의 방향을 드러냈습니다.
  doctrine_reference: 본문의 화해 목적과 문맥적 종결성 보존
