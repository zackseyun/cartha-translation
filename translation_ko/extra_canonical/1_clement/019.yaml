source:
  edition: Funk 1901 (normalized OCR)
  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ. 2. πολλῶν οὖν καὶ μεγάλων καὶ ἐνδόξων μετασχόντες πράξεων ἐκτελέσωμεν ἐπὶ τὸν ἐξ ἀρχῆς παραδεδομένον ἡμῖν τῆς εἰρήνης σκοπόν, καὶ ἀτενίσωμεν εἰς τὸν πατέρα καὶ κτίστην τοῦ σύμπαντος κόσμου καὶ ταῖς μεγαλοπρεπέσι καὶ ὑπερβαλλούσαις αὐτοῦ δωρεαῖς τῆς εἰρήνης εὐεργεσίαις τε κολληθῶμεν. 3. ἴδωμεν αὐτὸν κατὰ διάνοῶν καὶ ἐμβλέψωμεν τοῖς ὄμμασιν τῆς ψυχῆς εἰς τὸ μακρόθυμον αὐτοῦ βούλημα· νοήσωμεν, πῶς ἀόργητος ὑπάρχει πρὸς πᾶσαν τὴν κτίσιν αὐτοῦ.
  language: Greek
  pages:
  - 287
  - 289
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019.yaml
  text: 'Therefore[a], the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us, those who received his oracles in holiness and truth.


    2. Therefore, since we have shared in many great and glorious deeds, let us press on toward the goal of peace that has been handed down to us from the beginning, and let us fix our gaze on the Father and Creator of the whole world[a], and let us cling to his magnificent and surpassing gifts of peace and acts of kindness.


    3. Let us behold him in our mind, and let us look with the eyes of the soul upon his patient purpose[b][b][c]. Let us understand how free from anger he is toward all his creation.'
  footnotes:
  - marker: a
    text: Or 'lowliness' for 'submissiveness'; the Greek term suggests a humble, yielding posture associated with obedience.
    reason: lexical_alternative
    anchor_ref: '19:1'
  - marker: a
    text: '''His oracles'' refers to divine utterances; ''his words'' is a possible simpler rendering.'
    reason: lexical_alternative
    anchor_ref: '19:1'
  - marker: c
    text: 'The phrase ''goal of peace'' uses an athletic or directional image: the aim or mark toward which believers are to move.'
    reason: cultural_note
    anchor_ref: '19:2'
  - marker: b
    text: Or 'with the soul's eyes.' The Greek preserves a vivid metaphor of inward spiritual perception.
    reason: lexical_alternative
    anchor_ref: '19:3'
  - marker: b
    text: '''Free from anger'' here highlights God''s patient restraint toward creation in context; compare the emphasis on his ''patient purpose.'''
    reason: cross_reference
    anchor_ref: '19:3'
translation:
  language: ko
  text: '그러므로, 그렇게 많은 그리고 그렇게 위대한 사람들의, 그처럼 잘 증언된, 겸손과 순종에 따른 낮아짐이 순종을 통해 우리만이 아니라 우리보다 앞선 세대들도 더 나은 자들이 되게 하였습니다. 곧 그분의 말씀들을 거룩함과 진리 안에서 받아들인 사람들입니다.


    2. 그러므로 우리가 많은 크고 영광스러운 일들에 참여하였으니, 처음부터 우리에게 전해진 평강의 목표를 향해 나아가고, 온 세계의 아버지이시며 창조주이신 분을 바라보며, 그분의 장엄하고 뛰어넘는 평강의 선물들과 선한 행위들에 매달립시다.


    3. 마음으로 그분을 보고, 영혼의 눈으로 그분의 오래 참으시는 뜻을 바라봅시다. 그분이 자신의 모든 창조물에 대해 얼마나 분노가 없으신지 이해합시다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινοφρόνων καὶ τὸ ὑποδεές
  english_pob_choice: humility and submissiveness
  chosen_korean: 겸손과 순종에 따른 낮아짐
  alternatives_korean:
  - 겸손과 순종성
  - 겸손과 복종
  lexicon: LSJ
  rationale: 두 표현이 함께 쌓여 인간의 태도와 낮아짐을 강조하므로, 격식 있는 합쇼체에서 의미의 중첩을 살리기 위해 ‘겸손과 순종에 따른 낮아짐’으로 옮겼습니다.
- source_word: ὑπακοῆς
  english_pob_choice: obedience
  chosen_korean: 순종
  alternatives_korean:
  - 복종
  - 순응
  lexicon: BDAG
  rationale: 단순한 행위가 아니라 말씀을 듣고 응답하는 윤리적 태도를 가리키므로, 교회 문맥에서도 자연스러운 ‘순종’을 선택했습니다.
- source_word: τὰ λόγια αὐτοῦ
  english_pob_choice: his oracles
  chosen_korean: 그분의 말씀들
  alternatives_korean:
  - 그분의 신탁들
  - 그분의 말씀의 계시
  lexicon: BDAG
  rationale: POB의 주석처럼 λόγια는 신적 발화를 뜻하지만, 한국어에서는 ‘오라클’보다 ‘말씀들’이 더 자연스러워 의미를 드러내되 과도한 고어화를 피했습니다.
- source_word: σκοπόν
  english_pob_choice: goal
  chosen_korean: 목표
  alternatives_korean:
  - 표적
  - 목적
  lexicon: BDAG
  rationale: 운동장면적 방향성을 가진 표현이므로, 현대 독자에게 분명한 ‘목표’로 번역하되 진행 방향의 뉘앙스를 유지했습니다.
- source_word: κολληθῶμεν
  english_pob_choice: cling
  chosen_korean: 매달립시다
  alternatives_korean:
  - 붙듭시다
  - 달라붙읍시다
  - 고착합시다
  lexicon: LSJ
  rationale: 강한 결속과 지속적 의존을 나타내므로, 관계적이고 생동감 있는 ‘매달립시다’를 택했습니다.
- source_word: μακρόθυμον ... βούλημα
  english_pob_choice: patient purpose
  chosen_korean: 오래 참으시는 뜻
  alternatives_korean:
  - 인내하시는 목적
  - 참으시는 계획
  lexicon: LSJ
  rationale: 하나님의 성품과 의도를 함께 드러내기 위해, 형용사와 명사를 자연스럽게 결합한 ‘오래 참으시는 뜻’으로 옮겼습니다.
- source_word: ἀόργητος
  english_pob_choice: free from anger
  chosen_korean: 분노가 없으신
  alternatives_korean:
  - 노하지 않으시는
  - 진노하지 않으시는
  lexicon: LSJ
  rationale: 문맥상 창조를 향한 하나님의 태도는 ‘분노 없음’으로 진술되므로, 신학적 긴장을 남기면서도 직설적인 표현을 택했습니다.
theological_decisions:
- issue: 문장 1의 수신자/주체가 ‘우리보다 앞선 세대들’인지 ‘그분의 말씀들을 받아들인 사람들’인지의 연결
  chosen_reading: ‘우리보다 앞선 세대들’은 뒤따르는 동격 설명으로 읽어, 말씀을 거룩함과 진리 안에서 받아들인 사람들을 가리키게 했습니다.
  alternative_readings:
  - 앞선 세대 전체를 별도 주어로 끊어 읽는 방식
  - 마지막 분사구를 독립적 설명으로 약화시키는 방식
  rationale: 그리스어 구조상 연쇄된 수식이 이어지므로, 의미를 분리하지 않고 동격으로 연결해야 논지가 보존됩니다.
  doctrine_reference: 원문 구조 보존과 문맥적 지시대상 유지
- issue: ἀόργητος의 신학적 함의
  chosen_reading: 하나님이 모든 창조를 향해 오래 참으시며 쉽게 분노하지 않으신다는 목회적 진술로 보되, 진노 가능성 자체를 철학적으로 부정하지는 않았습니다.
  alternative_readings:
  - 절대적 무진노성의 형이상학적 선언
  - 단순히 ‘느리게 노하심’으로 완화
  rationale: 바로 앞의 ‘오래 참으시는 뜻’과 연결되어 권면적 묵상 문맥을 이루므로, 하나님의 인내를 드러내되 후대 교리 논쟁으로 과잉정리하지 않는 것이 적절합니다.
  doctrine_reference: 신학적 긴장 보존
