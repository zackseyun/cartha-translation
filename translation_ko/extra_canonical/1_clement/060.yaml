source:
  edition: Funk 1901 (normalized OCR)
  text: Σὺ γὰρ τὴν ἀέναον τοῦ κόσμου σύστασιν διὰ τῶν ἐνεργουμένων ἐφανεροποίησας· σύ, κύριε, τὴν οἰκουμένην ἔκτισας, ὁ πιστὸς ἐν πάσαις ταῖς γενεαῖς, δίκαιος ἐν τοῖς κρίμασιν, θαυμαστὸς ἐν ἰσχύϊ καὶ μεγαλοπρεπείᾳ, ὁ σοφὸς ἐν τῷ κτίζειν καὶ συνετὸς ἐν τῷ τὰ γενόμενα ἑδράσαι, ὁ ἀγαθὸς ἐν τοῖς ὁρωμένοις καὶ πιστὸς ἐν τοῖς πεποιθόσιν ἐπὶ σέ, ἐλεῆμον καὶ οἰκτίρμον, ἄφες ἡμῖν τὰς ἀνομίας ἡμῶν καὶ τὰς ἀδικίας καὶ τὰ παραπτώματα καὶ πλημμελείας. 2. μὴ λογίσῃ πᾶσαν ἁμαρτίαν δούλων σου καὶ παιδισκῶν, ἀλλὰ καθάρισον ἡμᾶς τὸν καθαρισμὸν τῆς σῆς ἀληθείας, καὶ κατεύθυνον τὰ διαβήματα ἡμῶν ἐν ὁσιότητι καρδίας πορεύεσθαι καὶ ποιεῖν τὰ καλὰ καὶ εὐάρεστα ἐνώπιόν σου καὶ ἐνώπιον τῶν ἀρχόντων ἡμῶν. 3. ναί, δέσποτα, ἐπίφανον τὸ πρόσωπών σου ἐφ’ ἡμᾶς εἰς ἀγαθὰ ἐν εἰρήνῃ, εἰς τὸ σκεπασθῆναι ἡμᾶς τῇ χειρί σου τῇ κραταιᾷ καὶ ῥυσθῆναι ἀπὸ πάσης ἁμαρτίας τῷ βραχίονί σου τῷ ὑψηλῷ, καὶ ῥῦσαι ἡμᾶς ἀπὸ τῶν μισούντων ἡμᾶς ἀδίκως. 4. δὸς ὁμόνοιαν καὶ εἰρήνην ἡμῖν τε καὶ πᾶσιν τοῖς κατοικοῦσιν τὴν γῆν, καθὼς ἔδωκας τοῖς
    πατράσιν ἡμῶν, ἐπικαλουμένων σε αὐτῶν ὁσίως ἐν πίστει καὶ ἀληθείᾳ, ὑπηκόους γινομένους τῷ παντοκράτορι καὶ παναρέτῳ ὀνόματί σου, τοῖς τε ἄρχουσιν καὶ ἡγουμένοις ἡμῶν ἐπὶ τῆς γῆς.
  language: Greek
  pages:
  - 337
  - 339
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/060.yaml
  text: For you have made manifest the everlasting order of the world through your works[2]. You, Lord, created the inhabited world, faithful throughout all generations, righteous in your judgments, marvelous in might and majesty, wise in creating and understanding in establishing the things that have come to be, good in the things that are seen and faithful toward those who have put their trust in you, merciful and compassionate. Forgive us our lawless deeds and our unrighteous acts and our trespasses and failings. 2 Do not count every sin of your slaves and female slaves, but cleanse us with the cleansing of your truth, and direct our steps to walk in holiness of heart and to do the things that are good and pleasing before you and before our rulers. 3 Yes, Master, make your face shine upon us for good in peace, so that we may be sheltered by your mighty hand and delivered from every sin by your uplifted arm; and rescue us from those who hate us unjustly. 4 Give harmony and peace to us
    and to all who dwell on the earth, just as you gave them to our fathers when they called upon you in holiness, in faith and truth, becoming obedient to your almighty and all-virtuous name[a][4][3], and to our rulers and leaders upon the earth.
  footnotes:
  - marker: '2'
    text: The Greek literally says 'your male slaves and female slaves,' a gendered pair for God's dependent people.
    reason: lexical_alternative
  - marker: '3'
    text: '''Make your face shine upon us'' echoes biblical blessing language; compare Num 6:25; Ps 67:1(66:2 LXX).'
    reason: cross_reference
  - marker: '4'
    text: The phrase 'all-virtuous name' renders a rare Greek compound emphasizing the complete excellence of God's name.
    reason: lexical_alternative
  - marker: a
    text: Or 'Do not count every sin of your male slaves and female slaves against them,'.
    reason: previous_rendering
translation:
  language: ko
  text: '당신께서는 온 세상의 영원한 질서를 당신의 행하심으로 드러내셨습니다. 주님, 당신께서 사람이 사는 세상을 지으셨고, 모든 세대에 걸쳐 신실하시며, 당신의 심판에서는 의로우시고, 능력과 위엄에서 놀라우시며, 지으실 때에는 지혜로우시고, 생겨난 것들을 굳게 세우실 때에는 분별력이 있으시며, 보이는 것들 가운데서는 선하시고, 당신을 신뢰하는 이들에게는 신실하시며, 자비롭고 긍휼이 많으십니다. 우리의 불법과 우리의 불의와 우리의 잘못과 허물을 용서해 주십시오.

    2 당신의 남자 노예들과 여자 노예들의 모든 죄를 헤아리지 마시고, 당신의 진리의 씻음으로 우리를 깨끗하게 하시며, 우리의 발걸음을 바로잡아 마음의 거룩함 안에서 걷고, 당신 앞과 우리의 통치자들 앞에서 선하고 기뻐하실 일들을 하게 하십시오.

    3 그렇습니다, 주권자님, 우리 위에 당신의 얼굴을 비추셔서 평안 가운데 복을 내려 주시고, 우리가 당신의 강한 손에 의해 가려지고 당신의 높이 든 팔에 의해 모든 죄에서 건져지며, 우리를 부당하게 미워하는 자들로부터 구원받게 하십시오.

    4 우리와 땅에 사는 모든 이에게 조화와 평강을 주십시오. 이는 당신께서 우리 조상들에게, 그들이 거룩함 안에서 믿음과 진리로 당신을 부를 때 그들에게 주셨던 것과 같게 하시기 위함입니다. 그들은 당신의 전능하고 온갖 덕을 갖추신 이름에 순종하는 이들이 되었고, 또한 땅의 우리의 통치자들과 지도자들에게 순종하는 이들이 되었습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύστασιν
  english_pob_choice: order
  chosen_korean: 질서
  alternatives_korean:
  - 구성
  - 구조
  - 헌정
  lexicon: LSJ
  rationale: 우주에 대한 형용사적 진술이므로, 단순한 ‘구조’보다 유지·배열된 상태를 드러내는 ‘질서’가 문맥에 맞습니다.
- source_word: ἐνεργουμένων
  english_pob_choice: through your workings
  chosen_korean: 당신의 행하심으로
  alternatives_korean:
  - 당신의 역사로
  - 당신의 사역으로
  - 당신의 일하심으로
  lexicon: LSJ
  rationale: 하나님의 능동적 작용을 살리되, ‘works’보다 한국어에서 더 자연스럽고 신학적으로도 무리 없는 직접어로 옮겼습니다.
- source_word: οἰκουμένην
  english_pob_choice: the inhabited world
  chosen_korean: 사람이 사는 세상
  alternatives_korean:
  - 거주하는 세계
  - 거민이 있는 땅
  - 사람이 거주하는 세계
  lexicon: LSJ
  rationale: ‘사람이 사는’은 οἰκουμένη의 거주-지구적 뉘앙스를 살리면서도 한국어에서 고색창연하지 않게 전달합니다.
- source_word: δούλων σου καὶ παιδισκῶν
  english_pob_choice: your slaves and female slaves
  chosen_korean: 당신의 남자 노예들과 여자 노예들
  alternatives_korean:
  - 당신의 노예들과 여자 노예들
  - 당신의 종들과 여종들
  - 당신의 종들과 여자 종들
  lexicon: LSJ
  rationale: 영어 POB가 지적하듯 성별이 분명한 예속 신분을 가리키므로, 약화된 ‘종’보다 사회적 강도를 보존하는 ‘노예’를 택했습니다.
- source_word: ὁσιότητι καρδίας
  english_pob_choice: holiness of heart
  chosen_korean: 마음의 거룩함
  alternatives_korean:
  - 심령의 거룩함
  - 마음의 경건함
  - 마음의 정결함
  lexicon: LSJ
  rationale: ὁσιότης의 예배적·윤리적 성격을 살리면서, 한국어에서는 ‘거룩함’이 가장 직접적입니다.
- source_word: ἐπίφανον τὸ πρόσωπών σου
  english_pob_choice: make your face shine
  chosen_korean: 당신의 얼굴을 비추셔서
  alternatives_korean:
  - 당신의 얼굴 빛을 비추셔서
  - 당신의 얼굴이 비치게 하셔서
  - 당신의 얼굴을 밝히셔서
  lexicon: LSJ
  rationale: 성경적 축복 언어의 반향을 살리기 위해 ‘비추다’로 옮겼고, 자연스러운 한국어 어순에 맞춰 능동적 청원을 유지했습니다.
- source_word: ὁμόνοιαν
  english_pob_choice: harmony
  chosen_korean: 조화
  alternatives_korean:
  - 일치
  - 화목
  - 화합
  lexicon: LSJ
  rationale: 1 Clement의 공동체적 평정과 질서를 함께 드러내는 말로 ‘조화’가 가장 넓고 균형 잡힌 대응입니다.
- source_word: παναρέτῳ
  english_pob_choice: all-virtuous
  chosen_korean: 온갖 덕을 갖추신
  alternatives_korean:
  - 온전하게 덕스러운
  - 모든 선함이 충만하신
  - 전적으로 유덕하신
  lexicon: LSJ
  rationale: 희귀 합성어의 총체적 탁월성을 한국어의 수식어 연쇄로 풀어, 과도한 신조어를 피하면서도 뜻을 보존했습니다.
theological_decisions:
- issue: κύριε와 δέσποτα의 호칭 차이
  chosen_reading: 앞부분 κύριε는 ‘주님’, 뒤의 δέσποτα는 ‘주권자님’으로 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘주님’
  - 둘 다 ‘주’
  - δέσποτα를 ‘마스터’로 음역성 번역
  rationale: 원문은 동일 호칭을 반복하지 않고 위계와 뉘앙스를 달리하므로, 한국어도 그 수사적 구별을 유지하는 편이 좋습니다.
  doctrine_reference: Translate titles; preserve distinctions where context supports.
- issue: δώλων/παιδισκῶν의 사회적 강도
  chosen_reading: 예속 신분을 약화하지 않고 ‘남자 노예들 / 여자 노예들’로 옮겼습니다.
  alternative_readings:
  - 종 / 여종
  - 종들 / 여자 종들
  - 사역자들
  rationale: 공동체의 자기 이해가 소유·종속 관계를 은유적으로 드러내는 표현이므로, 완곡화보다 원문의 사회적 실재를 보존하는 것이 더 충실합니다.
  doctrine_reference: Original-language primacy; gender-accurate over gender-neutral.
