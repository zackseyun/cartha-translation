id: 1CLEM.18.17
reference: 1 Clement 18:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: θυσία τῷ θεῷ πνεῦμα συντετριμμένον· καρδίαν συντετριμμένην καὶ τεταπεινωμένην ὁ θεὸς οὐκ ἐξουδενώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/017.yaml
  text: 'A sacrifice to God is a broken spirit;

    a broken and humbled heart God will not despise.”'
translation:
  language: ko
  text: '하나님께 드리는 제사는 상한 영입니다.

    상하고 낮아진 마음을 하나님은 멸시하지 않으십니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσία τῷ θεῷ
  english_pob_choice: A sacrifice to God
  chosen_korean: 하나님께 드리는 제사
  alternatives_korean:
  - 하나님께 드리는 희생제물
  - 하나님께 바치는 제사
  lexicon: θυσία
  rationale: 여기서는 제사 행위 자체를 가리키므로, ‘제물’보다 행위 중심의 ‘제사’가 원문과 영어 POB의 의미를 더 직접적으로 살립니다.
- source_word: πνεῦμα συντετριμμένον
  english_pob_choice: a broken spirit
  chosen_korean: 상한 영
  alternatives_korean:
  - 부서진 영
  - 깨어진 영
  lexicon: πνεῦμα
  rationale: 영적 실체를 뜻하는 πνεῦμα를 ‘영’으로 두고, συντετριμμένον의 핵심인 ‘상함/깨어짐’을 한국어 관용과 일치하는 ‘상한’으로 옮겼습니다.
- source_word: καρδίαν συντετριμμένην καὶ τεταπεινωμένην
  english_pob_choice: a broken and humbled heart
  chosen_korean: 상하고 낮아진 마음
  alternatives_korean:
  - 상하고 겸손해진 마음
  - 부서지고 낮아진 마음
  lexicon: καρδίαν
  rationale: ‘마음’은 καρδία의 표준 대응이며, τεταπεινωμένην은 단순한 감정이 아니라 낮아진 상태를 가리키므로 ‘낮아진’으로 살렸습니다.
- source_word: οὐκ ἐξουδενώσει
  english_pob_choice: will not despise
  chosen_korean: 멸시하지 않으십니다
  alternatives_korean:
  - 가볍게 여기지 않으십니다
  - 업신여기지 않으십니다
  lexicon: ἐξουδενόω
  rationale: 하나님의 부정적 평가를 직접적으로 드러내는 동사이므로, POB의 ‘despise’를 가장 분명하게 전달하는 ‘멸시하다’를 택했습니다.
theological_decisions:
- issue: 하나님에 대한 경어 체계
  chosen_reading: 서술은 평서형이되, 하나님을 주어로 한 동사에는 ‘-십니다’ 존대형을 사용했습니다.
  alternative_readings:
  - 하나님은 ... 하지 않으십니다
  - 하나님은 ... 않으십니다
  rationale: 합쇼체 문체를 유지하면서도 하나님께 직접 연결되는 진술은 경어로 처리해 한국어 독자에게 자연스럽고 경건한 울림을 줍니다.
  doctrine_reference: 성경 한국어 번역의 경어 관행
