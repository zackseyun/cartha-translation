  to: '제가 법을 따르지 않는 자들에게 주님의 길을 가르치겠습니다.


    경건하지 않은 자들은 주님께로 돌아설 것입니다.'
  rationale: 누락된 각주 내용 없이 붙은 [a][b] 표지를 삭제했습니다. 또한 ‘돌아올’ 대신 ‘돌아설’을 사용하여 원문이 명시하지 않는 ‘되돌아옴’을 보태지 않고, 주님께 향하는 방향 전환을 나타냈습니다. 나머지 내용은 원문의 병렬 구조와 미래 시제를 유지했습니다.
  reviewer_model: gpt-5.6-terra
