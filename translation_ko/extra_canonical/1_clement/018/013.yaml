id: 1CLEM.18.13
reference: 1 Clement 18:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διδάξω ἀνόμους τὰς ὁδούς σου, καὶ ἀσεβεῖς ἐπιστρέψουσιν ἐπὶ σέ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/013.yaml
  text: 'I will teach the lawless your ways,

    and the ungodly will turn to you.'
translation:
  language: ko
  text: '제가 법을 따르지 않는 자들에게 주님의 길을 가르치겠습니다.


    경건하지 않은 자들은 주님께로 돌아설 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόμους
  english_pob_choice: the lawless
  chosen_korean: 법 없는 자들
  alternatives_korean:
  - 불법자들
  - 율법 없는 자들
  - 법을 따르지 않는 자들
  lexicon: ἀνόμος
  rationale: 문맥상 단순한 사회적 무법자보다 하나님의 법에 속하지 않은 부류를 가리키므로, 의미를 살리면서도 현대 한국어에서 자연스러운 ‘법 없는 자들’로 옮겼습니다.
- source_word: τὰς ὁδούς σου
  english_pob_choice: your ways
  chosen_korean: 주의 길
  alternatives_korean:
  - 주의 길들
  - 주의 방식들
  - 주님의 길
  lexicon: ὁδός
  rationale: 복수형이지만 한국어에서는 관용적으로 ‘길’로 자연화할 수 있으며, 하나님/주님께 속한 삶의 방식이라는 의미를 유지했습니다.
- source_word: ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
  - 불경한 자들
  - 하나님을 경외하지 않는 자들
  - 악한 자들
  lexicon: ἀσεβής
  rationale: 단순한 도덕 악보다 경건의 결핍을 가리키므로, 전통적 교회어를 과도하게 끌지 않으면서도 뜻을 분명히 하는 표현을 택했습니다.
- source_word: ἐπιστρέψουσιν ἐπὶ σέ
  english_pob_choice: will turn to you
  chosen_korean: 주님께로 돌아올 것입니다
  alternatives_korean:
  - 주님께로 향할 것입니다
  - 주님께로 돌아서겠습니다
  - 주님께로 돌아오겠습니다
  lexicon: ἐπιστρέφω
  rationale: ‘turn back’가 아니라 ‘turn to’라는 최신 영어 수정과 부합하게, 회개적 방향 전환을 드러내되 원문에 없는 ‘back’을 덧붙이지 않았습니다.
theological_decisions:
- issue: ‘돌아오다’의 회개적 함의
  chosen_reading: ‘주님께로 돌아올 것입니다’는 단순 이동이 아니라 하나님께로 향하는 회심의 방향 전환을 담습니다.
  alternative_readings:
  - 주님께로 향할 것입니다
  - 주님께 돌아설 것입니다
  rationale: ἐπιστρέφω는 종종 하나님께로의 회심을 나타내므로, 한국어에서도 회개적 뉘앙스를 살리되 원문의 범위를 넘지 않도록 했습니다.
  doctrine_reference: 회심/회개에 대한 신약의 일반적 용례(ἐπιστρέφω)
