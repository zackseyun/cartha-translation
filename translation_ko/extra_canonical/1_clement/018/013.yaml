  naturalness: ‘법 없는 자들’도 이해 가능하나 현대 표준어에서는 ‘법을 따르지 않는 자들’이 더 자연스럽고 뜻이 분명합니다. ‘주님께로 돌아설 것입니다’는 합쇼체 문체 안에서 자연스럽고, ἐπὶ σέ의 방향성을 보존합니다.
  terminology: ‘주님의 길’과 ‘경건하지 않은 자들’은 문맥과 현대 한국어에 적절합니다. 신적 호칭은 초안의 ‘주의/주님’ 혼용보다 ‘주님’으로 통일했습니다.
