id: 1CLEM.18.15
reference: 1 Clement 18:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγαλλιάσεται ἡ γλῶσσά μου τὴν δικαιοσύνην σου. κύριε, τὸ στόμα μου ἀνοίξεις, καὶ τὰ χείλη μου ἀναγγελεῖ τὴν αἴνεσίν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/015.yaml
  text: 'My tongue will rejoice in your righteousness.

    Lord, you will open my mouth,

    and my lips will declare your praise.'
translation:
  language: ko
  text: '제 혀가 주님의 의로 기뻐할 것입니다.

    주님, 주께서 제 입을 여실 것이며,

    제 입술이 주님의 찬양을 선포할 것입니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  english_pob_choice: will rejoice
  chosen_korean: 기뻐할 것입니다
  alternatives_korean:
  - 환호할 것입니다
  - 크게 기뻐할 것입니다
  lexicon: ἀγαλλιάομαι
  rationale: 영어 POB의 단순한 미래형 ‘will rejoice’를 따라, 과도하게 장식적이지 않으면서도 시편적 기쁨을 담는 표현으로 옮겼습니다.
- source_word: τὴν δικαιοσύνην σου
  english_pob_choice: your righteousness
  chosen_korean: 주님의 의
  alternatives_korean:
  - 주의 의
  - 주님의 공의
  lexicon: δικαιοσύνη
  rationale: δικαιοσύνη는 여기서 하나님의 의로움을 가리키므로, 프로젝트 기본어인 ‘의’를 유지하고 소유격을 자연스럽게 살렸습니다.
- source_word: τὸ στόμα μου ἀνοίξεις
  english_pob_choice: you will open my mouth
  chosen_korean: 주께서 제 입을 여실 것이며
  alternatives_korean:
  - 주님께서 제 입을 여실 것이며
  - 주님, 제 입을 여실 것이며
  lexicon: ἀνοίγω
  rationale: 직역을 유지하되 한국어 문맥에서 주어-목적어 관계가 분명하도록 ‘주께서 … 여실 것이며’로 자연화했습니다.
- source_word: τὰ χείλη μου ἀναγγελεῖ τὴν αἴνεσίν σου
  english_pob_choice: my lips will declare your praise
  chosen_korean: 제 입술이 주님의 찬양을 선포할 것입니다
  alternatives_korean:
  - 제 입술이 주님의 찬양을 알릴 것입니다
  - 제 입술이 주님의 찬송을 전할 것입니다
  lexicon: ἀναγγέλλω / αἴνεσις
  rationale: ἀναγγέλλω는 단순 ‘말하다’보다 공개적으로 알리는 뉘앙스가 있어 ‘선포하다’로, αἴνεσις는 예배적 의미를 살려 ‘찬양’으로 옮겼습니다.
theological_decisions:
- issue: κύριε의 호칭 처리
  chosen_reading: 직접 기도/인용의 호칭으로 ‘주님’으로 번역하되, 뒤의 인칭 대명사 관계는 한국어에서 자연스럽게 ‘주께서’로 이어지게 했습니다.
  alternative_readings:
  - 주여
  - 주님이여
  rationale: 시편 인용의 기도적 어조를 유지하면서도 현대 합쇼체 독자가 읽기 쉬운 호칭을 택했습니다.
  doctrine_reference: 예배적 호칭의 문체 보존
- issue: 시편적 인용의 문체
  chosen_reading: 직접 인용의 시적 병행을 유지하되, 현대 한국어의 자연스러운 운율을 위해 어순을 약간 정리했습니다.
  alternative_readings:
  - 더 직역적인 어순 유지
  - 더 시적 재구성
  rationale: 원문의 병행법과 의미 대응을 해치지 않는 범위에서 읽기성을 확보했습니다.
  doctrine_reference: 문학적 병행 구조 보존
