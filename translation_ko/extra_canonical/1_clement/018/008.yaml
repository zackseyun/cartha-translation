id: 1CLEM.18.8
reference: 1 Clement 18:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀκουτιεῖς με ἀγαλλίασιν καὶ εὐφροσύνην, ἀγαλλιάσονται ὀστᾶ τεταπεινωμένα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/008.yaml
  text: 'You will make me hear gladness and joy;

    the bones that have been humbled will rejoice.'
translation:
  language: ko
  text: '주께서는 제게 즐거움과 기쁨을 들려주실 것입니다.

    낮아진 뼈들이 기뻐할 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκουτιεῖς με
  english_pob_choice: You will make me hear
  chosen_korean: 저에게 …을 들려주실 것입니다
  alternatives_korean:
  - 저로 하여금 …을 듣게 하실 것입니다
  - 제가 …을 듣게 하실 것입니다
  lexicon: ἀκουτίζω
  rationale: 원문의 사역적 의미를 살리되, 한국어에서는 자연스러운 「들려주다」로 옮겨 '듣게 하다'의 효과를 전달했습니다.
- source_word: ἀγαλλίασιν
  english_pob_choice: gladness
  chosen_korean: 즐거움
  alternatives_korean:
  - 환희
  - 기쁨
  lexicon: ἀγαλλίασις
  rationale: εὐφροσύνην과 의미를 구별하기 위해 더 강한 정서인 '환희' 대신, 여기서는 비교적 넓고 자연스러운 '즐거움'을 택했습니다.
- source_word: εὐφροσύνην
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 희락
  - 즐거움
  lexicon: εὐφροσύνη
  rationale: POB의 'joy'를 반영하면서 ἀγαλλίασιν과 중복되지 않도록 '기쁨'으로 구분해 옮겼습니다.
- source_word: ὀστᾶ τεταπεινωμένα
  english_pob_choice: the bones that have been humbled
  chosen_korean: 낮아졌던 뼈들
  alternatives_korean:
  - 겸손해진 뼈들
  - 압제받던 뼈들
  lexicon: ταπεινόω
  rationale: 직역하면 '겸손해진'이지만, 시적 문맥상 '낮아지다'가 상태적 수동 의미를 더 자연스럽게 드러내며, POB의 'humbled'를 유지합니다.
theological_decisions:
- issue: 시편적 병행어에서 두 명사(ἀγαλλίασις, εὐφροσύνη)의 차이
  chosen_reading: 둘을 모두 기쁨 범주로 옮기되, '즐거움'과 '기쁨'으로 약간 구분했습니다.
  alternative_readings:
  - 둘 다 '기쁨'으로 통일
  - '''환희''와 ''기쁨''으로 격상'
  rationale: 원문은 의미가 겹치지만 완전히 동일하지 않으므로, 한국어에서도 중복을 피하면서 병행 구조를 보존하는 편이 더 충실합니다.
  doctrine_reference: 시편 51:8(히브리 시적 병행의 정서 대비)
