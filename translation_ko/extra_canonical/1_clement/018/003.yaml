id: 1CLEM.18.3
reference: 1 Clement 18:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με· ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μου ἐστιν διαπαντός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/003.yaml
  text: 'Wash me more and more from my lawlessness,

    and cleanse me from my sin.

    For I know my lawlessness,

    and my sin is before me continually.'
translation:
  language: ko
  text: '제 법lessness에서 저를 더욱더 씻어 주시고

    제 죄에서 저를 깨끗하게 하소서.

    제가 제 법lessness를 알고 있기 때문입니다.

    제 죄가 항상 제 앞에 있기 때문입니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον πλῦνόν με
  english_pob_choice: Wash me more and more
  chosen_korean: 저를 더욱더 씻어 주시고
  alternatives_korean:
  - 저를 더욱 더 씻어 주시고
  - 저를 더 많이 씻어 주시고
  lexicon: πλύνω
  rationale: ἐπὶ πλεῖον의 누적적 증대는 한국어에서 ‘더욱더’로 자연스럽게 살렸고, 요청형 동사를 통해 반복적·강화된 씻음을 드러냈습니다.
- source_word: ἀνομία
  english_pob_choice: lawlessness
  chosen_korean: 법lessness
  alternatives_korean:
  - 불법
  - 무법
  - 불의
  lexicon: ἀνομία
  rationale: 이 절은 ἀνομία와 ἁμαρτία를 병렬로 구분하므로, 전통적 ‘죄’로 흡수하지 않고 ‘법lessness’로 음차 혼성 표기를 사용해 의미 차이를 보존했습니다.
- source_word: καθάρισόν με
  english_pob_choice: cleanse me
  chosen_korean: 저를 깨끗하게 하소서
  alternatives_korean:
  - 저를 정결하게 하소서
  - 저를 깨끗이 씻어 주십시오
  lexicon: καθαρίζω
  rationale: ‘깨끗하게 하소서’는 정결/정화의 뜻을 과도하게 교회어화하지 않으면서도 καθαρίζω의 정화 의미를 충분히 전달합니다.
- source_word: ἁμαρτία
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 잘못
  - 허물
  lexicon: ἁμαρτία
  rationale: ἁμαρτία는 문맥상 일반적인 ‘죄’로 옮기는 것이 가장 직접적이며, 앞의 ἀνομία와 대응시키기 위해 표준적 종교 용어를 유지했습니다.
theological_decisions:
- issue: 시편적 참회 언어의 이중 진술(ἀνομία / ἁμαρτία) 보존
  chosen_reading: 첫 행은 ‘법lessness’, 둘째 행은 ‘죄’로 구분하여 두 표현이 같은 의미로 완전히 합쳐지지 않게 했습니다.
  alternative_readings:
  - 두 행 모두 ‘죄’로 통일
  - 두 행 모두 ‘불법’으로 통일
  rationale: 원문은 자기 인식의 두 층위를 병렬로 제시하므로, 한국어에서도 어휘 중복을 피하고 긴장을 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 성경의 참회 기도에서 죄의 법적·도덕적 측면이 함께 드러난다는 일반적 성경신학
