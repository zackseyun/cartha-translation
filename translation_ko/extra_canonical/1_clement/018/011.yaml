id: 1CLEM.18.11
reference: 1 Clement 18:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου, καὶ τὸ πνεῦμα τὸ ἅγιόν σου μὴ ἀντανέλῃς ἀπʼ ἐμοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/011.yaml
  text: 'Do not cast me away from your presence,

    and do not take your Holy Spirit from me.'
translation:
  language: ko
  text: 저를 주의 얼굴 앞에서 쫓아내지 마시고, 주님의 거룩한 영을 저에게서 거두어 가지 마십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀπορίψῃς με ἀπὸ τοῦ προσώπου σου
  english_pob_choice: Do not cast me away from your presence
  chosen_korean: 저를 주의 얼굴 앞에서 쫓아내지 마시고
  alternatives_korean:
  - 저를 주의 앞에서 버리지 마시고
  - 저를 주님의 임재에서 내치지 마시고
  lexicon: ἀπορίπτω; πρόσωπον
  rationale: ἀπορίψῃς는 단순한 ‘내버리다’보다 관계적 추방의 뉘앙스가 있어 ‘쫓아내다’로 옮기고, προσώπου는 ‘얼굴’의 직역을 살리되 관계적 임재를 자연스럽게 드러내기 위해 ‘주의 얼굴 앞에서’로 표현했습니다.
- source_word: τὸ πνεῦμα τὸ ἅγιόν σου
  english_pob_choice: your Holy Spirit
  chosen_korean: 주님의 거룩한 영
  alternatives_korean:
  - 주님의 성령
  - 주님의 거룩하신 영
  lexicon: πνεῦμα; ἅγιος
  rationale: 이 구절은 신적 영을 가리키지만, 형태상 ‘성령’이 아닌 ‘거룩한 영’이므로 원문의 형용사 구조를 보존해 ‘거룩한 영’으로 옮겼습니다.
- source_word: μὴ ἀντανέλῃς ἀπʼ ἐμοῦ
  english_pob_choice: do not take your Holy Spirit from me
  chosen_korean: 저에게서 거두어 가지 마십시오
  alternatives_korean:
  - 저에게서 빼앗지 마십시오
  - 저에게서 치우지 마십시오
  lexicon: ἀνταναιρέω
  rationale: ἀντανέλῃς는 ‘빼앗다’보다 ‘거두어 가다/제거하다’의 뜻이 더 직접적이어서, POB의 revised reading과도 맞물리도록 ‘거두어 가지 마십시오’로 번역했습니다.
theological_decisions:
- issue: 다윗 시편 인용구의 기도체 호소를 한국어에서 어떻게 유지할지
  chosen_reading: 명령형 청원으로 그대로 살려 ‘~마시고 / ~마십시오’의 기도문체로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘저를 버리지 않으시고…’
  - 간접청원으로 바꿔 ‘버리지 않기를 구합니다’
  rationale: 원문은 직접적 청원문이므로, 간구의 긴박함과 대상을 향한 직접성을 유지하는 편이 원문의 힘에 가깝습니다.
  doctrine_reference: 시편적 탄원 형식 보존
