review_pass:
  verdict: approve
  source_fidelity: 그리스어의 두 부정 청원(μὴ …, καὶ … μὴ …)과 ‘당신의 얼굴/임재에서’, ‘당신의 거룩한 영’, ‘내게서 거두어 가다’라는 핵심 의미가 충실히 보존되었습니다. ‘쫓아내지 마시고’는 ἀπορίψῃς의 배척·축출의 뉘앙스를 무리 없이 전달하며, ‘거두어 가지 마십시오’도 ἀντανέλῃς의 제거 의미를 정확히 옮깁니다.
  naturalness: 현대 표준 한국어의 합쇼체 기도·청원 문체로 자연스럽습니다. ‘주의 얼굴 앞에서’는 다소 직역적인 성서적 표현이지만, 원문의 προσώπου를 보존하면서도 문맥상 이해 가능하며 부자연스럽지 않습니다.
  terminology: ‘거룩한 영’은 τὸ πνεῦμα τὸ ἅγιόν σου의 형용사 구조를 보존하는 적절한 선택입니다. 이를 관습적 용어인 ‘성령’으로 바꿀 필요는 없습니다. ‘주의/주님의’의 호칭 변이는 문장 내에서 의미상 문제를 일으키지 않습니다.
