  - 내 어머니께서 나를 출산하셨습니다
  lexicon: κισσάω
  rationale: LXX 용례와 수정된 POB audit trail이 이 동사를 ‘conceive’가 아니라 출산 행위로 구분해야 함을 보여 주므로, 중복 번역을 피하면서도 자연스러운 ‘낳으셨습니다’로 옮겼습니다.
