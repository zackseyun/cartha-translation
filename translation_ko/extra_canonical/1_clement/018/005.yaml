id: 1CLEM.18.5
reference: 1 Clement 18:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/005.yaml
  text: 'For behold[a], in lawless deeds I was conceived,

    and in sins my mother bore me.'
  footnotes:
  - marker: a
    text: Or 'nursed me'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오. 나는 불법 속에서 잉태되었고, 죄 가운데서 내 어머니께서 나를 낳으셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: ἰδοὺ
  rationale: 독자의 주의를 끄는 감탄·호소 표현으로, 현대 합쇼체에서 직접적인 주의 환기인 ‘보십시오’가 가장 자연스럽습니다.
- source_word: ἐν ἀνομίαις
  english_pob_choice: in lawless deeds
  chosen_korean: 불법 속에서
  alternatives_korean:
  - 무법 가운데
  - 불의 가운데
  - 법 없는 죄 가운데
  lexicon: ἀνομία
  rationale: ἀνομίαις는 단순한 ‘행위’보다 상태·영역감을 주므로, 행위성을 과도하게 좁히지 않는 ‘불법 속에서’로 옮겼습니다.
- source_word: συνελήμφθην
  english_pob_choice: I was conceived
  chosen_korean: 잉태되었고
  alternatives_korean:
  - 수태되었고
  - 임신되었고
  lexicon: συλλαμβάνω
  rationale: 문맥상 출생 전 상태를 가리키므로, 생식·임신의 의미를 살리면서도 한국어 성경체에서 자연스러운 ‘잉태되었고’를 선택했습니다.
- source_word: ἐκίσσησέν με
  english_pob_choice: my mother bore me
  chosen_korean: 내 어머니께서 나를 낳으셨습니다
  alternatives_korean:
  - 내 어머니께서 나를 해산하셨습니다
  - 내 어머니께서 나를 출산하셨습니다
  lexicon: κισσάω
  rationale: LXX 용례와 수정된 POB audit trail이 이 동사를 ‘conceive’가 아니라 출산 행위로 구분해야 함을 보여 주므로, 중복 번역을 피하면서도 자연스러운 ‘낳으셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 시편 51:5 계열 인용의 죄/불법 표현을 어떻게 유지할 것인가
  chosen_reading: ‘불법 속에서 잉태되었고, 죄 가운데서 … 낳으셨습니다’로 유지해 원문이 드러내는 인간 존재의 죄성 진술을 약화하지 않았습니다.
  alternative_readings:
  - ‘죄악 중에 태어났고’처럼 완화하는 번역
  - ‘불의 중에 잉태되었고’처럼 도덕적 추상화
  rationale: 이 구절은 자기 존재의 근원에 대한 강한 회개적 진술이므로, 전통적 완화 표현보다 원문의 긴장과 무게를 보존해야 합니다.
  doctrine_reference: 인간의 보편적 죄성, 시편 51편의 회개의 문맥
