    issue: ἐκίσσησέν με를 ‘나를 낳으셨습니다’로 번역함
    rationale: 시편 51:5 LXX 인용에서 이 동사는 히브리어 원문의 ‘잉태하다’에 해당하며, 화자의 어머니가 화자를 잉태한 것을 말합니다. ‘낳다’는 의미를 출산으로 변경합니다.
  - severity: medium
    issue: 각주가 ‘낳으셨습니다’라는 본문 선택을 전제함
    rationale: 원문상 적절한 본문은 ‘잉태하셨습니다’이며, 해당 각주는 ‘젖먹이다’ 같은 대안이 이 문맥의 의미가 아님을 명확히 해야 합니다.
  revised_text: 보십시오. 나는 불법 가운데서 잉태되었고, 죄 가운데서 어머니가 나를 잉태하셨습니다.[a]
