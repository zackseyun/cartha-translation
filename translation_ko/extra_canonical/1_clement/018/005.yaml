  lexicon: ἰδοὺ
  rationale: 독자의 주의를 끄는 감탄·호소 표현으로, 현대 합쇼체에서 직접적인 주의 환기인 ‘보십시오’가 가장 자연스럽습니다.
- source_word: ἐν ἀνομίαις
