  source_fidelity: 수정이 필요합니다. ἐκίσσησέν με는 이 시편 51:5(70인역 50:7) 인용의 문맥에서 어머니가 화자를 ‘잉태했다’는 뜻입니다. 동사가 συνελήμφθην과 다르더라도, 여기서 ‘낳으셨습니다’로 구별하면 출산이라는 다른 사건으로 바꾸게 됩니다. κισσάω의 원래 어원 및 일부 파생적 이해가 이 문맥의 LXX 관용적 용례를 ‘출산하다’로 만들지는 않습니다.
  naturalness: ‘보십시오’와 합쇼체 문장은 자연스럽습니다. 다만 ‘불법 속에서’보다 ‘불법 가운데서’가 이 추상적·시적 진술에 조금 더 자연스럽고, ‘내 어머니께서’ 대신 ‘어머니가’는 원문에 없는 경어 관계를 덧붙이지 않으면서 현대 문장에도 매끄럽습니다.
  terminology: ἀνομίαις는 ‘불법’, ἁμαρτίαις는 ‘죄’로 구별해 유지할 수 있습니다. συνελήμφθην과 ἐκίσσησεν은 모두 이 문맥에서는 잉태를 가리키므로 한국어에서 반복되는 것은 원문의 의미를 정확히 보존하는 결과입니다. 영어 감사 이력의 ‘bore me’ 및 ‘Or nursed me’는 그리스어 원문 및 LXX 인용 문맥보다 우선할 수 없습니다.
  issues:
