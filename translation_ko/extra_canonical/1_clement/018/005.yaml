    reason: ἐκίσσησέν με의 문맥상 의미를 밝혀, ‘낳다’ 또는 ‘젖먹이다’로 오해하지 않도록 합니다.
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  english_pob_choice: For behold
  chosen_korean: 보십시오
