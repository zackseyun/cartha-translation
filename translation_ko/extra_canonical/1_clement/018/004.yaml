source:
  edition: Funk 1901 (normalized OCR)
  text: σοὶ μόνῳ ἥμαρτον καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/004.yaml
  text: 'Against you only I sinned,

    and I did what is evil before you,

    so that you may be justified in your words

    and prevail when you are judged[a].'
  footnotes:
  - marker: a
    text: Or 'and prevail when you are judged.'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께만 제가 죄를 지었고, 주님 앞에서 악한 일을 행하였습니다. 그리하여 주님의 말씀에서 주님께서 의롭다 하심을 받으시고, 주님께서 판단하실 때에 이기시게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께서 심판받으실 때에 이기시게.’ 그리스어 표현은 ‘판단하실 때’ 또는 ‘심판받으실 때’로 이해될 수 있습니다.
    reason: κρίνεσθαί σε의 중간태적·수동태적 해석 가능성을 보존합니다.
lexical_decisions:
- source_word: σοὶ μόνῳ
  english_pob_choice: Against you only
  chosen_korean: 주님께만
  alternatives_korean:
  - 오직 주님께만
  - 주님에게만
  lexicon: σύ / μόνος
  rationale: 배타성을 분명히 살리되 한국어 어순에서 자연스럽게 짧게 처리했습니다. 화자의 직접 고백이므로 2인칭을 ‘주님’으로 옮겼습니다.
- source_word: ἐνώπιόν σου
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 보시기에
  - 주님 앞에
  lexicon: ἐνώπιον
  rationale: ‘앞에서’는 행위가 하나님 면전에서 드러난다는 의미를 자연스럽게 전달하며, 단순 위치보다 윤리적/신학적 뉘앙스를 보존합니다.
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  english_pob_choice: you may be justified in your words
  chosen_korean: 주님의 말씀들이 의롭다 하심을 받으시고
  alternatives_korean:
  - 주님의 말씀에서 의로우심을 보이시고
  - 주님의 말씀이 옳음으로 인정되시고
  lexicon: δικαιόω / λόγοι
  rationale: 문맥상 ‘말씀들’은 하나님의 발언·판단을 가리키므로 복수형을 살렸고, ‘의롭다 하심을 받다’로 정당성의 선언을 표현했습니다.
- source_word: νικήσῃς ἐν τῷ κρίνεσθαί σε
  english_pob_choice: prevail when you are judged
  chosen_korean: 주님이 심판을 받으실 때에 이기시게
  alternatives_korean:
  - 주님이 심판받으실 때에 승리하시게
  - 주님이 판단받으실 때에 이기시게
  lexicon: κρίνεσθαι
  rationale: 이번 본문은 수동적으로 ‘심판을 받다’가 아니라 대결적·법정적 상황을 드러내므로, 전통적 신학 용어를 쓰되 ‘받으실 때에 이기시게’로 결과를 살렸습니다.
theological_decisions:
- issue: ‘judged’의 방향성
  chosen_reading: 하나님이 인간에게 심판받는다는 뜻이 아니라, 논쟁적/법정적 비유 속에서 하나님의 말씀이 옳음이 드러나고 주님이 우위에 서신다는 뜻으로 옮겼습니다.
  alternative_readings:
  - ‘주님이 심판하실 때’
  - ‘주님이 심판을 당하실 때’
  rationale: 수정 이력의 판단처럼 κρίνεσθαι의 중점을 수동 피동으로 오해하지 않도록, 문맥의 시편 인용 구조와 대조를 반영했습니다.
  doctrine_reference: 시편 51:4의 인용 / 법정적 수사
