  yaml_path: translation/extra_canonical/1_clement/018/014.yaml
  text: Deliver me from bloodguilt, O God, the God of my salvation.
translation:
  language: ko
  text: 하나님, 제 구원의 하나님이여, 저를 피 흘린 죄에서 건져 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαί
  english_pob_choice: Deliver me
  chosen_korean: 건져 주십시오
  alternatives_korean:
  - 구원해 주십시오
  - 구해 주십시오
  lexicon: ῥύομαι
  rationale: 긴급한 구출·해방의 뉘앙스를 살리기 위해 단순한 ‘구원하다’보다 ‘건져 주십시오’를 택했습니다.
- source_word: ἐξ αἱμάτων
  english_pob_choice: from bloodguilt
  chosen_korean: 피 흘린 죄에서
  alternatives_korean:
  - 피의 죄에서
  - 유혈의 죄에서
  - 피흘림에서
  lexicon: αἷμα
  rationale: 영어 POB의 해석을 따라 ‘혈액’이 아니라 ‘피 흘린 죄/유혈의 죄’라는 책임·유죄의 의미를 드러내는 표현으로 옮겼습니다.
- source_word: ὁ θεὸς τῆς σωτηρίας μου
  english_pob_choice: the God of my salvation
  chosen_korean: 제 구원의 하나님
  alternatives_korean:
  - 저의 구원의 하나님
  - 저를 구원하시는 하나님
  - 제 구원의 하나님이신 하나님
  lexicon: θεός / σωτηρία
  rationale: 소유격 관계를 자연스럽게 살리면서도 구원의 근원이 하나님이심을 분명히 하기 위해 ‘제 구원의 하나님’으로 옮겼습니다.
theological_decisions:
- issue: ‘bloodguilt’의 해석 범위
  chosen_reading: 개인적·공동체적 유혈 책임을 포괄하는 ‘피 흘린 죄’로 처리했습니다.
  alternative_readings:
  - 직역에 가까운 ‘피의 죄’
  - 법정적 책임을 강조하는 ‘유혈 책임’
  rationale: 시편적 탄원문맥에서 단순한 물리적 피가 아니라 죄책을 가리키므로, 한국어에서 의미가 분명한 표현을 택했습니다.
  doctrine_reference: 시편 51편의 탄원 전통
