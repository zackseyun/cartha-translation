base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/006.yaml
  text: 'For behold, you loved truth;

    the hidden and secret things of your wisdom you made known to me.'
translation:
  language: ko
  text: 보소서, 주님께서는 진리를 사랑하셨습니다. 주님의 지혜에 있는 드러나지 않은 것들과 감추어진 것들을 제게 알려 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: ἰδοὺ
  rationale: 감탄·주의 환기 표지로서 문맥상 독자에게 시선을 돌리게 하는 표현이므로, 현대 합쇼체에서 자연스러운 「보십시오」로 옮겼습니다.
- source_word: ἀλήθειαν ἠγάπησας
  english_pob_choice: you loved truth
  chosen_korean: 진리를 사랑하셨습니다
  alternatives_korean:
  - 진리를 사랑하셨습니다
  - 진실을 사랑하셨습니다
  lexicon: ἀλήθεια
  rationale: ἀλήθεια의 기본 의미를 ‘진리’로 유지해 원문의 추상적이고 신학적인 대상성을 살렸습니다.
- source_word: τὰ ἄδηλα καὶ τὰ κρύφια
  english_pob_choice: the hidden and secret things
  chosen_korean: 숨겨진 것들과 비밀스러운 것들
  alternatives_korean:
  - 숨은 것들과 은밀한 것들
  - 드러나지 않은 것들과 감추어진 것들
  lexicon: ἄδηλος / κρύφιος
  rationale: 두 형용사의 중첩을 한국어에서도 두 항목으로 살리되, 의미가 겹치므로 서로 다른 뉘앙스의 ‘숨겨진/비밀스러운’으로 구분했습니다.
- source_word: ἐδήλωσάς μοι
  english_pob_choice: you made known to me
  chosen_korean: 저에게 드러내 주셨습니다
  alternatives_korean:
  - 저에게 알려 주셨습니다
  - 저에게 밝혀 주셨습니다
  lexicon: δηλόω
  rationale: δηλόω는 단순 통지보다 ‘드러내어 분명하게 하다’의 뜻이 강하므로, 원문의 계시적 뉘앙스를 살려 ‘드러내 주셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 화자-청자 관계의 2인칭 존칭 처리
  chosen_reading: 하나님께 드리는 직접 호칭으로 이해하여 전체를 합쇼체로 번역했습니다.
  alternative_readings:
  - 중립적 서술체로 낮추는 번역
  - 기도체 어조를 더 강하게 드러내는 번역
  rationale: 본문은 시편적 기도/찬양 문맥의 직접 خطاب이므로, 현대 한국어에서는 공손한 직접 호칭이 가장 자연스럽고 경외의 뉘앙스를 보존합니다.
  doctrine_reference: 예배 언어와 직접 기도체의 한국어 문체
