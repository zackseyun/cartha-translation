  source_fidelity: 핵심 의미는 충실합니다. 다만 ἰδού는 하나님께 시선을 돌리게 하는 호소이므로, 직접 기도 문맥에서 한국어의 「보십시오」는 다소 어색하게 들릴 수 있습니다. 또한 τὰ ἄδηλα καὶ τὰ κρύφια의 두 명사화된 항목은 더 자연스럽게 구분해 옮길 수 있습니다.
  naturalness: 「당신」은 현대 한국어의 하나님께 드리는 공적 기도·성서 문체에서 대체로 부자연스럽거나 거리감 있게 들립니다. 「주님께서는」이 자연스러운 존칭 직접 호칭입니다. 「숨겨진 것들과 비밀스러운 것들」도 명사구가 다소 무겁습니다.
  terminology: 「진리」, 「지혜」, 「알려 주셨습니다」는 원문의 ἀλήθεια, σοφία, δηλόω에 적절합니다. 문맥상 하나님을 가리키는 「주님」은 한국어 직접 기도 문체를 위해 사용하되, 특정 교리적 해석을 더하지 않습니다.
