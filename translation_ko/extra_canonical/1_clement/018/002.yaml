id: 1CLEM.18.2
reference: 1 Clement 18:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀλλὰ καὶ αὐτὸς λέγει πρὸς τὸν θεόν· Ἐλέησόν με, ὁ θεός, κατὰ τὸ μέγα ἔλεός σου, καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/002.yaml
  text: 'But he himself also says to God:


    Have mercy on me[a], O God, according to your great mercy,

    and according to the abundance of your compassions blot out my lawlessness.'
  footnotes:
  - marker: a
    text: Or 'But he too says to God:\n\n“Have mercy'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러나 그도 하나님께 이렇게 말씀합니다.


    “저에게 은혜를 베풀어 주십시오, 하나님이시여. 주님의 큰 자비에 따라,

    그리고 주님의 풍성한 긍휼에 따라 제 불법을 지워 주십시오.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς
  english_pob_choice: But he himself also says
  chosen_korean: 그러나 그도 하나님께 이렇게 말씀합니다
  alternatives_korean:
  - 그러나 그도 말씀합니다
  - 그러나 그 자신도 하나님께 말씀합니다
  lexicon: καί, αὐτός
  rationale: αὐτός의 강조를 살리기 위해 단순한 ‘그도’보다 주어 강조를 유지했고, 1절의 하나님이 사람에게 말씀하시는 대구를 반영해 ‘하나님께’로 방향을 분명히 했습니다.
- source_word: Ἐλέησόν με
  english_pob_choice: Have mercy on me
  chosen_korean: 저에게 은혜를 베풀어 주십시오
  alternatives_korean:
  - 저에게 자비를 베풀어 주십시오
  - 저를 불쌍히 여기소서
  lexicon: ἐλεέω
  rationale: 경건한 청원문맥이지만, 현대 합쇼체에서 직접적이고 자연스러운 간청으로 옮기되 ‘은혜를 베풀다’로 POB의 ‘mercy’ 의미를 유지했습니다.
- source_word: τὸ ἀνόμημά μου
  english_pob_choice: my lawlessness
  chosen_korean: 제 불법
  alternatives_korean:
  - 제 법 없음
  - 제 무법함
  - 제 불의
  lexicon: ἀνόμημα
  rationale: POB가 단순한 ‘lawless deed’가 아니라 추상명사적 ‘lawlessness’를 택한 점을 따라, 행위 하나보다 상태/성격을 드러내는 ‘불법’으로 옮겼습니다.
- source_word: τὸ μέγα ἔλεός σου / τὸ πλῆθος τῶν οἰκτιρμῶν σου
  english_pob_choice: according to your great mercy / according to the abundance of your compassions
  chosen_korean: 주님의 큰 자비에 따라 / 주님의 풍성한 긍휼에 따라
  alternatives_korean:
  - 주님의 큰 자비를 따라 / 주님의 많은 긍휼을 따라
  - 주님의 크신 자비에 따라 / 주님의 많은 자비심에 따라
  lexicon: ἔλεος, οἰκτιρμοί
  rationale: 두 표현의 반복과 증폭을 살리기 위해 ‘큰 자비’와 ‘풍성한 긍휼’을 구분했습니다. ‘자비’와 ‘긍휼’의 병행은 히브리어식 풍부한 자비 개념을 한국어로 재현합니다.
theological_decisions:
- issue: 기도체의 높임말 처리
  chosen_reading: 하나님께 드리는 직접 청원은 합쇼체의 공손한 명령형으로 번역했습니다.
  alternative_readings:
  - 서술형으로만 옮김
  - 전통적 하옵나이다체 사용
  rationale: 원문은 시편적 탄원 기도이므로, 현대 표준어이면서도 하나님께 드리는 간청의 경외를 드러내는 형태가 적절합니다.
  doctrine_reference: 경건한 기도체의 문체 선택
- issue: ἀνόμημα의 성격
  chosen_reading: 행위 하나보다 ‘불법’이라는 상태/성격을 드러내는 번역을 택했습니다.
  alternative_readings:
  - 제 불법 행위
  - 제 범죄
  rationale: POB의 수정 이력도 abstract noun ‘lawlessness’를 지지하며, 문맥상 죄의 질적 성격을 강조합니다.
  doctrine_reference: 죄의 상태와 행위의 구분
