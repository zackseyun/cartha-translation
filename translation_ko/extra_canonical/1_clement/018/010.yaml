  terminology: ‘마음’, ‘영’, ‘바른’은 καρδία, πνεῦμα, εὐθύς에 대해 문맥상 적절하고 불필요하게 교리적으로 한정하지 않는 선택입니다. ‘창조하다’는 κτίζω의 강한 어휘를 보존합니다.
