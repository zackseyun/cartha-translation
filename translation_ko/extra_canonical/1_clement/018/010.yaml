  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καρδίαν καθαρὰν κτίσον ἐν ἐμοί, ὁ θεός, καὶ πνεῦμα εὐθὲς ἐγκαίνισον ἐν τοῖς ἐγκάτοις μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/010.yaml
  text: 'Create in me a clean heart, O God,

    and renew a right spirit within me.'
translation:
  language: ko
  text: '하나님, 제 안에 깨끗한 마음을 창조해 주십시오.

    그리고 제 속에 바른 영을 새롭게 하십시오.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίαν καθαρὰν κτίσον
  english_pob_choice: Create in me a clean heart
  chosen_korean: “제 안에 깨끗한 마음을 창조해 주십시오”
  alternatives_korean:
  - 제 안에 정결한 마음을 지어 주십시오
  - 제 안에 깨끗한 심장을 만드십시오
  lexicon: καρδίαν → 마음; καθαρὰν → 깨끗한; κτίσον → 창조해 주십시오
  rationale: κτίσον은 단순한 ‘수정’이 아니라 새롭게 ‘창조하다’는 동사이므로, 시적·간구적 문맥을 살려 ‘창조해 주십시오’로 옮겼습니다.
- source_word: πνεῦμα εὐθὲς
  english_pob_choice: a right spirit
  chosen_korean: “바른 영”
  alternatives_korean:
  - 곧은 영
  - 올바른 영
  - 정직한 영
  lexicon: πνεῦμα → 영; εὐθὲς → 바른, 곧은
  rationale: εὐθὲς는 도덕적·내적 정직함과 곧음을 나타내므로, 너무 추상적이거나 협소한 ‘올바른’보다 직접적인 ‘바른’이 자연스럽고 원문에 가깝습니다.
- source_word: ἐν τοῖς ἐγκάτοις μου
  english_pob_choice: within me
  chosen_korean: “제 속에”
  alternatives_korean:
  - 제 내장에
  - 제 깊은 곳에
  - 제 안쪽에
  lexicon: ἐγκάτοις → 속, 내면, 깊은 곳
  rationale: 영어 POB가 ‘within me’로 자연화한 흐름을 반영하되, 헬라어의 신체-내면 표현을 과도하게 문자화하지 않고 한국어의 관용적 내면 표현인 ‘제 속에’로 옮겼습니다.
theological_decisions:
- issue: 기도의 존칭 처리
  chosen_reading: 하나님께 드리는 간구이므로 명령형을 공손한 청유·간청형으로 옮겨 ‘창조해 주십시오 / 새롭게 하십시오’로 처리했습니다.
  alternative_readings:
  - 창조하십시오
  - 창조해 주옵소서
  rationale: 합쇼체 독자성을 유지하면서도, 하나님께 직접 드리는 기도의 공손함을 반영해야 하므로 현대 공적 문체와 경건한 호소를 함께 살렸습니다.
  doctrine_reference: 기도 문체와 경어의 한국어 번역 관행
