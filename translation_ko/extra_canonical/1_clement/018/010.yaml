  source_fidelity: 원문의 두 대격 목적어(‘깨끗한 마음’, ‘바른 영’)와 두 명령형 간구(κτίσον, ἐγκαίνισον), 그리고 내면을 가리키는 ἐν τοῖς ἐγκάτοις μου를 충실히 반영합니다. ‘제 속에’는 여기서 신체 기관을 문자적으로 뜻하기보다 내면을 가리키는 관용적 용법을 자연스럽게 옮깁니다.
