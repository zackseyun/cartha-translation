translation:
  language: ko
  text: 주께서 희생제사를 원하셨더라면 제가 드렸을 것입니다. 번제는 기뻐하지 않으십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυσίαν
  english_pob_choice: sacrifice
  chosen_korean: 희생제사
  alternatives_korean:
  - 제사
  - 희생
  - 희생제물
  lexicon: θύσια
  rationale: 일반적 ‘제사’보다 원문의 제의적 의미를 드러내면서도, ‘희생’을 덧붙여 POB의 sacrifice를 반영했습니다.
- source_word: ἔδωκα ἄν
  english_pob_choice: I would have given it
  chosen_korean: 제가 드렸을 것입니다
  alternatives_korean:
  - 제가 드렸을 텐데
  - 제가 드렸을 것입니다
  lexicon: δίδωμι + ἄν
  rationale: 가정법 과거의 반사실적 의미를 자연스러운 한국어로 옮기되, ‘주다’보다 제의 맥락에 맞는 ‘드리다’를 택했습니다.
- source_word: ὁλοκαυτώματα
  english_pob_choice: whole burnt offerings
  chosen_korean: 번제
  alternatives_korean:
  - 온전한 번제물
  - 전번제
  - 번제물
  lexicon: ὁλοκαύτωμα
  rationale: 원문의 제사 용어를 표준적인 성서 한국어 ‘번제’로 옮겨, ‘whole burnt offerings’의 완전 소진 제의 의미를 간결하게 살렸습니다.
- source_word: εὐδοκήσεις
  english_pob_choice: you will not delight
  chosen_korean: 기뻐하지 않으십니다
  alternatives_korean:
  - 기뻐하지 않으실 것입니다
  - 마음에 두지 않으십니다
  lexicon: εὐδοκέω
  rationale: 미래형이지만 시편 인용의 현재적 진술처럼 들리므로, 한국어에서는 하나님의 태도를 현재적 진술로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 시편 인용의 현재/미래 시제 처리
  chosen_reading: ‘기뻐하지 않으십니다’로 현재적 진술을 채택했습니다.
  alternative_readings:
  - ‘기뻐하지 않으실 것입니다’
  - ‘기뻐하지 않으시리니’
  rationale: 원문의 미래형 εὐδοκήσεις를 따라가되, 인용문의 예언·지혜시적 울림을 한국어에서 현재 진술로 옮기는 것이 더 자연스럽고 힘이 있습니다.
  doctrine_reference: 성경 인용의 현재화는 구약 시편 인용에서 흔한 번역상 관행입니다.
