  text: ῥαντιεῖς με ὑσσώπῳ, καὶ καθαρισθήσομαι· πλυνεῖς με, καὶ ὑπὲρ χιόνα λευκανθήσομαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/007.yaml
  text: 'You will sprinkle me with hyssop, and I will be cleansed;

    you will wash me, and I will be made whiter than snow.'
translation:
  language: ko
  text: 우슬초를 제게 뿌리시면 제가 깨끗해질 것입니다. 저를 씻으시면 제가 눈보다 더 희게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαντιεῖς με ὑσσώπῳ
  english_pob_choice: You will sprinkle me with hyssop
  chosen_korean: 우슬초로 저를 뿌리시면
  alternatives_korean:
  - 우슬초로 저에게 뿌리시면
  - 히솝으로 저를 뿌리시면
  lexicon: ῥαντίζω / ὕσσωπος
  rationale: 동사 ῥαντιεῖς는 단순한 ‘흩뿌리다’가 아니라 정결 예식의 뿌림을 가리키므로 ‘뿌리시다’로 옮기고, ὑσσώπῳ는 한국 교회 용례가 있지만 본문 감각을 살리기 위해 식물명 ‘우슬초’를 사용했습니다.
- source_word: καθαρισθήσομαι
  english_pob_choice: I will be cleansed
  chosen_korean: 제가 깨끗해질 것입니다
  alternatives_korean:
  - 제가 정결해질 것입니다
  - 제가 깨끗하게 될 것입니다
  lexicon: καθαρίζω
  rationale: 문맥상 의례적·도덕적 정결을 모두 포괄하므로, 너무 제의적이지도 너무 일상적이지도 않은 ‘깨끗해지다’로 자연스럽게 풀었습니다.
- source_word: πλυνεῖς με
  english_pob_choice: you will wash me
  chosen_korean: 저를 씻으시면
  alternatives_korean:
  - 저를 빨아 주시면
  - 저를 씻어 주시면
  lexicon: πλύνω
  rationale: πλύνω의 기본 뜻인 ‘씻다/빨다’ 가운데, 시적 병행을 살리면서도 인격적 주어를 유지하는 ‘씻으시면’을 택했습니다.
- source_word: ὑπὲρ χιόνα λευκανθήσομαι
  english_pob_choice: I will be made whiter than snow
  chosen_korean: 제가 눈보다 더 희게 될 것입니다
  alternatives_korean:
  - 제가 눈보다 더 희어질 것입니다
  - 눈보다 더 희게 될 것입니다
  lexicon: λευκαίνω
  rationale: 비교구문 ὑπὲρ χιόνα는 ‘눈보다’로 직역하고, λευκανθήσομαι는 결과 상태를 드러내는 ‘희게 될 것입니다’로 옮겨 시적 과장과 의미를 보존했습니다.
theological_decisions:
- issue: 정결과 죄 사함의 표현 방식
  chosen_reading: 의례적 뿌림과 씻음의 이미지를 그대로 살려 ‘깨끗해질 것입니다’로 번역했습니다.
  alternative_readings:
  - 정결해질 것입니다
  - 깨끗하게 될 것입니다
  rationale: 원문은 죄책 선언보다 정결 의식의 이미지가 중심이므로, 해석을 과도하게 신학화하지 않고 본문이 말하는 정결의 효과를 직접적으로 드러냈습니다.
  doctrine_reference: 정결/속죄 이미지의 시적 표현
