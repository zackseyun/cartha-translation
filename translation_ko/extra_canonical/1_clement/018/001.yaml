id: 1CLEM.18.1
reference: 1 Clement 18:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Τί δὲ εἴπωμεν ἐπὶ τῷ μεμαρτυρημένῳ Δαυίδ; πρὸς ὃν εἶπεν ὁ θεός· Εὗρον ἄνδρα κατὰ τὴν καρδίαν μου, Δαυὶδ τὸν τοῦ Ἰεσσαί, ἐν ἐλέει αἰωνίῳ ἔχρισα αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/001.yaml
  text: And what shall we say And what shall we say about David, who has received testimony? To him God said, “I found a man according to my heart, David the son of Jesse; with everlasting mercy I anointed him.”
  footnotes:
  - marker: a
    text: Or 'about David, who has been borne witness to?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 증언을 받은 다윗에 관하여 우리가 무엇이라고 말하겠습니까? 하나님께서 그에게 말씀하셨습니다. 「나는 내 마음에 맞는 사람, 이새의 아들 다윗을 찾았고, 영원한 자비로 그에게 기름을 부었습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “증언을 받은 다윗에 관하여.”
    reason: μεμαρτυρημένῳ는 ‘증언을 받은/입증된’이라는 뜻이며, 문맥상 다윗을 수식하는 표현으로도, ‘다윗에 관하여 증언된 것’을 가리키는 표현으로도 번역될 여지가 있습니다.
lexical_decisions:
- source_word: ἐπὶ τῷ μεμαρτυρημένῳ Δαυίδ
  english_pob_choice: about David, who has received testimony
  chosen_korean: 증언을 받은 다윗에 관하여
  alternatives_korean:
  - 다윗에 대해 증언된
  - 증언을 받아 온 다윗에 관하여
  lexicon: μαρτυρέω
  rationale: μεμαρτυρημένῳ는 단순히 ‘소문난’이 아니라 ‘증언/입증을 받은’ 상태를 가리키므로, 다윗을 본문이 증언하는 인물로 드러내는 표현을 택했습니다.
- source_word: Εὗρον ἄνδρα κατὰ τὴν καρδίαν μου
  english_pob_choice: I found a man according to my heart
  chosen_korean: 나는 내 마음에 맞는 사람을 찾았으며
  alternatives_korean:
  - 나는 내 마음을 따른 사람을 찾았으며
  - 나는 내 뜻에 맞는 사람을 찾았으며
  lexicon: καρδία
  rationale: 직역하면 ‘내 마음에 따라’이지만, 한국어에서는 하나님의 내적 기쁨과 선택을 자연스럽게 드러내는 ‘내 마음에 맞는’이 가장 직접적입니다.
- source_word: ἐν ἐλέει αἰωνίῳ
  english_pob_choice: with everlasting mercy
  chosen_korean: 영원한 긍휼로
  alternatives_korean:
  - 영원한 자비로
  - 영원한 인자하심으로
  lexicon: ἔλεος
  rationale: ἔλεος는 하나님의 언약적 자비를 가리키므로, 교회적 문맥에서 익숙하면서도 원뜻을 살리는 ‘긍휼’을 선택했습니다.
- source_word: ἔχρισα αὐτόν
  english_pob_choice: I anointed him
  chosen_korean: 그에게 기름부었습니다
  alternatives_korean:
  - 그에게 기름을 부었습니다
  - 그를 기름부었습니다
  lexicon: χρίω
  rationale: 동사적 의미를 살리되 한국어 성경 문체에 맞춰 ‘기름부었습니다’로 옮겨, 왕적 임명과 선택의 의미를 유지했습니다.
theological_decisions:
- issue: 다윗에 대한 서술을 ‘증언’으로 옮길지 여부
  chosen_reading: ‘증언을 받은 다윗에 관하여’로 옮겨, 다윗이 단지 칭찬받는 인물이 아니라 성경적 증언의 대상임을 드러냈습니다.
  alternative_readings:
  - ‘다윗에 대하여 말하자면’
  - ‘증언된 다윗에 관하여’
  rationale: μεμαρτυρημένος는 마태/사도적 열거식 칭찬보다 ‘입증된, 증언된’ 상태를 함축하므로, 본문의 공적·성경적 검증성을 유지하는 번역이 필요합니다.
  doctrine_reference: 성경적 증언, 구약 인용의 권위
- issue: 인용문에서 하나님의 선택과 기름부음의 관계
  chosen_reading: ‘영원한 긍휼로 그에게 기름부었습니다’로 직결해, 선택의 근거가 하나님의 긍휼임을 분명히 했습니다.
  alternative_readings:
  - ‘영원한 자비 안에서 그에게 기름부었습니다’
  - ‘영원한 은혜로 그를 기름부었습니다’
  rationale: 본문은 다윗의 자격보다 하나님의 긍휼을 앞세우므로, 원문의 인과·수단 감각을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 은혜에 의한 선택
