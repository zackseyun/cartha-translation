id: 1CLEM.18.12
reference: 1 Clement 18:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/012.yaml
  text: 'Restore to me the joy of your salvation[b][a],

    and uphold me with a willing spirit.'
  footnotes:
  - marker: a
    text: Or 'a ruling spirit'.
    reason: previous_rendering
  - marker: b
    text: Or 'the rejoicing'.
    reason: previous_rendering
translation:
  language: ko
  text: 주의 기쁨을 제게 회복시켜 주시고, 자원하는 영으로 저를 붙들어 주십시오.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἀγαλλίασιν
  english_pob_choice: the joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  - 큰 기쁨
  lexicon: ἀγαλλίασις
  rationale: 문맥상 회개의 시편 인용에서 회복되어야 할 내적 상태를 가리키므로, 한국어에서는 지나치게 장식적인 표현보다 자연스럽고 넓게 통하는 ‘기쁨’이 가장 적절합니다.
- source_word: τοῦ σωτηρίου σου
  english_pob_choice: of your salvation
  chosen_korean: 주의 구원
  alternatives_korean:
  - 주의 구원의
  - 주님의 구원
  - 주의 구원하심
  lexicon: σωτήριον
  rationale: 소유격 구조를 자연스럽게 살려 ‘주의 구원’으로 옮기되, 구원의 행위보다 결과/현실 자체를 가리키는 표현으로 유지했습니다.
- source_word: πνεύματι ἡγεμονικῷ
  english_pob_choice: with a willing spirit
  chosen_korean: 자원하는 영
  alternatives_korean:
  - 다스리는 영
  - 이끄는 영
  - 주도적인 영
  lexicon: πνεῦμα + ἡγεμονικός
  rationale: ἀγαθὸς/ἡγεμονικός의 어감은 단순한 ‘의지’보다 내적으로 올바르게 이끄는 성향을 포함하므로, POB의 수정 취지를 반영해 ‘자원하는’으로 번역해 강압이 아닌 내적 응답성을 드러냈습니다.
- source_word: στήριξόν με
  english_pob_choice: uphold me
  chosen_korean: 저를 붙들어 주십시오
  alternatives_korean:
  - 저를 견고하게 하십시오
  - 저를 지탱해 주십시오
  - 저를 굳게 세워 주십시오
  lexicon: στηρίζω
  rationale: 동사는 단순히 ‘강하게 하다’보다 넘어지지 않도록 붙들고 지탱하는 뜻이 강하므로, 기도문체에 맞는 자연스러운 한국어로 ‘붙들어 주십시오’를 선택했습니다.
theological_decisions:
- issue: 시편 51편 12절의 간청을 1클레멘트가 인용하는 방식
  chosen_reading: 본문은 회개의 회복을 구하는 간청으로 읽고, ‘기쁨’과 ‘자원하는 영’이 함께 하나님의 은혜 아래 회복되는 상태를 표현합니다.
  alternative_readings:
  - 윤리적 결단을 강조하는 권고문
  - 단순한 정서 회복 요청
  rationale: 원문은 명령형 청원 두 개로 이루어진 기도적 표현이므로, 도덕적 훈계보다 하나님께 드리는 회복 요청으로 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 시편 51편 / 회개의 기도 전통
