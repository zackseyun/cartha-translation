  naturalness: ‘주의 구원의 기쁨을 제게 회복시켜 주시고’와 ‘저를 붙들어 주십시오’는 현대 표준 한국어의 정중한 기도문체로 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 편이 명확합니다.
