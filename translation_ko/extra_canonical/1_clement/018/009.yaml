id: 1CLEM.18.9
reference: 1 Clement 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀπόστρεψον τὸ πρόσωπόν σου ἀπὸ τῶν ἁμαρτιῶν μου, καὶ πάσας τὰς ἀνομίας μου ἐξάλειψον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/018/009.yaml
  text: 'Turn your face away from my sins,

    and blot out all my lawless deeds.'
translation:
  language: ko
  text: 제 얼굴을 제 죄들에서 돌이키시고, 제 모든 불법을 지워 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστρεψον τὸ πρόσωπόν σου ἀπὸ
  english_pob_choice: Turn your face away from
  chosen_korean: 제 얼굴을 … 돌이키시고
  alternatives_korean:
  - 얼굴을 돌려 주십시오
  - 얼굴을 외면해 주십시오
  - 제 얼굴을 외면하지 마십시오
  lexicon: ἀποστρέφω / πρόσωπον
  rationale: 직역의 ‘얼굴을 돌리다’는 한국어에서 다소 부자연스러워, 관계적 의미를 살리면서도 본문 이미지가 유지되도록 ‘제 얼굴을 … 돌이키시고’로 옮겼습니다.
- source_word: τῶν ἁμαρτιῶν μου
  english_pob_choice: my sins
  chosen_korean: 제 죄들
  alternatives_korean:
  - 제 죄
  - 저의 죄악들
  - 제 허물들
  lexicon: ἁμαρτία
  rationale: 복수형을 살려 ‘죄들’로 옮겼고, 시편적 고백문맥에 맞는 소유격 ‘제’를 사용했습니다.
- source_word: πάσας τὰς ἀνομίας μου
  english_pob_choice: all my lawless deeds
  chosen_korean: 제 모든 불법
  alternatives_korean:
  - 제 모든 죄악
  - 제 모든 법 없는 행위
  - 제 모든 불의
  lexicon: ἀνομία
  rationale: 영어 POB의 ‘lawless deeds’를 따라 단순한 죄보다 율법을 어기는 성격이 드러나는 ‘불법’으로 옮겼습니다.
- source_word: ἐξάλειψον
  english_pob_choice: blot out
  chosen_korean: 지워 주십시오
  alternatives_korean:
  - 말끔히 지워 주십시오
  - 삭제해 주십시오
  - 말소해 주십시오
  lexicon: ἐξαλείφω
  rationale: 문서에서 지우는 비유를 현대 한국어로 자연스럽게 살리기 위해 ‘지워 주십시오’로 번역했습니다.
theological_decisions:
- issue: 시편적 회개 기도체의 화자-하나님 직접 호칭
  chosen_reading: 하나님께 드리는 간구체로 자연스럽게 표현하되, 직접 청원형 ‘-십시오’를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화
  - 더 전통적인 기도문체로 격상
  rationale: 원문은 명령형/간청형 어법으로 하나님께 요청하는 문장이므로, 현대 합쇼체의 간구형을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 성경의 회개 기도와 탄원문체
