  source_fidelity: 첫 구절의 τὸ πρόσωπόν σου는 ‘당신의/주님의 얼굴’인데, 초안의 ‘제 얼굴’은 소유자를 화자로 바꾸어 원문의 의미를 뒤집습니다. 또한 ἀπὸ τῶν ἁμαρτιῶν μου는 ‘제 죄들에서/제 죄를 보지 않으시도록’의 방향을 나타냅니다. 둘째 구절은 πάσας τὰς ἀνομίας μου와 ἐξάλειψον을 충실히 반영합니다.
  naturalness: ‘제 죄들’은 문법적으로 가능하지만 현대 한국어 기도문에서는 다소 어색할 수 있습니다. ‘제 죄들에서 얼굴을 돌이키시고’는 원문의 이미지를 유지하면서도 자연스럽고, 생략된 주체는 합쇼체 간구문에서 무리 없이 하나님을 가리킵니다.
  terminology: ‘불법’은 ἀνομία의 어근상 ‘법 없음/법을 어김’을 반영하는 적절한 신학·윤리 용어입니다. ‘지워 주십시오’는 ἐξαλείφω의 말소·삭제 비유를 자연스럽게 전달합니다.
  issues:
