base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046.yaml
  text: 'Therefore[a], brothers, we too must attach ourselves to such examples. For it is written, “Attach yourselves to the holy ones, because those who attach themselves to them will be made holy.” And again, in another place it says, “With an innocent man you will be innocent, and with the chosen one you will be chosen, and with the crooked you will become twisted.” Let us therefore attach ourselves to the innocent and righteous, and these are God’s chosen ones[b].


    Why are there quarrels and outbursts of anger and divisions and schisms and even war among you? Or do we not have one God and one Messiah and one Spirit of grace poured out upon us, and one calling in Messiah? Why do we tear apart and split up the members of Messiah, and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord. For he said, “Woe to that man: it would have been good for him if he had not been born, rather than that he should cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than that he should turn one of my chosen ones aside.” Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief[e][d][c]; and your factional strife is persistent.'
  footnotes:
  - marker: a
    text: The citation “Attach yourselves to the holy ones...” is not a verbatim match to a surviving Old Testament verse as we have it; Clement may be citing a textual form, a conflated scriptural tradition, or a traditional saying.
    reason: cross_reference
  - marker: b
    text: “With an innocent man you will be innocent...” echoes scriptural language found in the Greek Psalms tradition; the final clause intensifies the warning that moral company shapes moral character.
    reason: cross_reference
  - marker: c
    text: “One Spirit of grace poured out upon us” likely evokes biblical outpouring language for God’s Spirit and underscores the shared divine gift that makes schism especially grievous.
    reason: cross_reference
  - marker: d
    text: Clement’s saying of Jesus resembles Gospel warnings about causing “little ones” to stumble, but here reads “one of my chosen ones,” a form worth preserving rather than harmonizing.
    reason: alternative_reading
  - marker: e
    text: Or 'Do we not have'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 형제 여러분, 우리도 이런 본보기들에 붙어 있어야 합니다. 기록되기를, 「성도들에게 붙으십시오. 그들에게 붙는 이들은 거룩하게 될 것입니다」라고 하였고, 또 다른 곳에서 말하기를 「무죄한 사람과 함께하면 너도 무죄할 것이며, 택함받은 이와 함께하면 너도 택함받을 것이며, 비뚤어진 자와 함께하면 너도 비뚤어질 것이다」라고 합니다. 그러므로 우리도 무죄하고 의로운 이들에게 붙어 있으십시오. 이런 이들이 하나님의 택함받은 이들입니다.


    왜 여러분 가운데 다툼과 분노의 폭발과 분열들과 분파들, 심지어 전쟁까지 있습니까? 아니면 우리에게는 한 하나님과 한 메시아와 우리에게 부어 주신 은혜의 한 영과, 메시아 안에서 하나의 부르심이 있지 않습니까? 그런데 왜 우리는 메시아의 지체들을 찢어 놓고 갈라 놓으며, 우리 자신의 몸을 거슬러 반란을 일으키고, 서로가 서로의 지체라는 사실을 잊을 정도로 그렇게 큰 광기에 이릅니까?


    주 우리 예수님의 말씀을 기억하십시오. 그분은 말씀하셨습니다. 「그 사람에게 화가 있습니다. 그가 태어나지 않았더라면 더 좋았을 것입니다. 그것은 내 택함받은 이들 가운데 하나를 넘어지게 하는 것보다 낫습니다. 그가 맷돌을 목에 달고 바다에 빠져 죽는 편이, 내 택함받은 이들 가운데 하나를 그릇되게 하는 것보다 더 좋습니다」. 여러분의 분파는 많은 사람을 그릇되게 했고, 많은 사람을 낙담에 빠뜨렸으며, 많은 사람을 의심에 빠뜨렸고, 우리 모두를 슬픔에 빠뜨렸습니다. 그리고 여러분의 분파적 다툼은 여전히 계속되고 있습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῆναι / Κολλᾶσθε / κολληθῶμεν
  english_pob_choice: attach ourselves / attach yourselves
  chosen_korean: 붙어 있어야 합니다 / 붙으십시오 / 붙어 있으십시오
  alternatives_korean:
  - 달라붙어야 합니다
  - 연합해야 합니다
  - 밀착해야 합니다
  lexicon: LSJ
  rationale: 문맥상 단순 동의가 아니라 가까이 결합하여 매달리는 이미지를 살려야 하므로, 한국어에서는 자연스럽고 반복 가능한 ‘붙다’ 계열로 대응했습니다.
- source_word: τοῖς ἁγίοις
  english_pob_choice: the holy ones
  chosen_korean: 성도들
  alternatives_korean:
  - 거룩한 이들
  - 거룩한 사람들
  - 성인들
  lexicon: LSJ
  rationale: 문맥상 거룩한 사람들을 가리키는 공동체적 표현이므로 ‘성도들’이 가장 자연스럽고, 한국어 교회어에서의 친숙한 범주도 유지합니다.
- source_word: Χριστός
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 기름부음 받은 이
  lexicon: LSJ
  rationale: 본 프로젝트 기본어휘에 따라 титული적 Χριστός는 ‘메시아’로 옮겨, 인명화된 ‘그리스도’보다 칭호로서의 의미를 드러냈습니다.
- source_word: πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς
  english_pob_choice: Spirit of grace poured out upon us
  chosen_korean: 우리에게 부어 주신 은혜의 한 영
  alternatives_korean:
  - 우리에게 쏟아 부으신 은혜의 영
  - 우리 위에 부어 주신 은혜의 영
  lexicon: LSJ
  rationale: ‘부어 주다’의 성경적 이미지와 ‘은혜의 영’의 밀도를 살리되, ‘한 영’으로 하나됨의 강조를 드러냈습니다.
- source_word: σκανδαλίσαι
  english_pob_choice: cause ... to stumble
  chosen_korean: 넘어지게 하는
  alternatives_korean:
  - 실족하게 하는
  - 걸려 넘어지게 하는
  - 죄짓게 하는
  lexicon: LSJ
  rationale: 신약적 은유를 유지하면서도, 이 단락의 경고를 한국어로 가장 분명하게 전달하는 표현으로 보았습니다.
- source_word: διαστρέψαι
  english_pob_choice: turn ... aside
  chosen_korean: 그릇되게 하는
  alternatives_korean:
  - 옆길로 돌리는
  - 비틀어 놓는
  - 타락시키는
  lexicon: LSJ
  rationale: 후반부의 최종 경고는 단순한 방향 전환보다 사람을 잘못된 길로 왜곡시키는 뉘앙스를 가지므로 ‘그릇되게 하다’로 옮겼습니다.
- source_word: στάσις
  english_pob_choice: factional strife
  chosen_korean: 분파적 다툼
  alternatives_korean:
  - 분열
  - 반역
  - 내분
  lexicon: LSJ
  rationale: 시민적 반란 뉘앙스와 교회 내부 분열의 성격을 함께 드러내기 위해, ‘분파적 다툼’으로 비교적 직접적으로 옮겼습니다.
theological_decisions:
- issue: Χριστός의 번역어 선택
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 본문은 고백적 칭호를 반복하며 사용하므로, 단순 고유명사화보다 칭호성을 보존하는 ‘메시아’가 원문 의미를 더 분명히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: ἅγιοι / ἐκλεκτοί의 공동체 정체성
  chosen_reading: 성도들 / 택함받은 이들
  alternative_readings:
  - 성인들 / 선택된 자들
  rationale: 본문은 추상적 윤리 개념이 아니라 하나님의 백성 안의 실제 공동체를 가리키므로, 한국어 독자에게도 공동체적 정체성이 드러나도록 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve ecclesial and theological force without later technical narrowing.'
