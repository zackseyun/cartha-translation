base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/008.yaml
  text: 'The ministers of the grace of God spoke through the Holy Spirit concerning repentance, and the Master of all things himself also spoke concerning repentance with an oath: “For as I live,” says the Lord, “I do not desire the death of the sinner so much as his repentance,” adding also a good declaration: “Repent, O house of Israel, of your lawlessness. Say to the sons of my people, ‘Even if your sins should reach from the earth to heaven, and even if they are redder than scarlet and blacker than sackcloth, yet if you turn to me with your whole heart and say, “Father,” I will listen to you as to a holy people.’” And in another place he says thus: “Wash and become clean; remove your wicked deeds from your souls before my eyes, cease from your wickednesses, learn to do good, seek justice, rescue the one being wronged, judge for the orphan, and give justice to the widow. And come, and let us reason together,” says the Lord. “Even if your sins are like crimson, I will whiten them like
    snow; and if they are like scarlet, I will whiten them like wool. But if you are willing and listen to me, you shall eat the good things of the land; but if you are not willing and do not listen to me, a sword will devour you; for the mouth of the Lord has spoken these things.” Therefore, since he desires all his beloved ones to share in repentance, he established it by his all-sovereign purpose.'
  footnotes:
  - marker: a
    text: The wording echoes Ezekiel 33:11, but Clement's form includes an added benevolent clause not identical to standard Septuagint wording.
    reason: cross_reference
    anchor_ref: '8:2'
  - marker: g
    text: The citation is a composite paraenetic use of prophetic language rather than a verbatim quotation from a single extant Old Testament verse.
    reason: cross_reference
    anchor_ref: '8:3'
  - marker: f
    text: This section draws chiefly on Isaiah 1:16–20 in Septuagintal form.
    reason: cross_reference
    anchor_ref: '8:4'
  - marker: e
    text: Or 'he confirmed it by his almighty counsel.' The Greek can emphasize either God's sovereign purpose or the firmness with which he established this call to repentance.
    reason: lexical_alternative
    anchor_ref: '8:5'
  - marker: d
    text: Or 'the Master himself of all things'.
    reason: previous_rendering
  - marker: c
    text: Or 'a good intention'.
    reason: previous_rendering
  - marker: b
    text: Or 'remove your wicked deeds from before my eyes'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님의 은혜의 일꾼들은 성령을 통해 회개에 대해 말하였습니다. 또한 만물의 주권자께서도 맹세를 더하여 회개에 대해 친히 말씀하셨습니다. “내가 살아 있노라, 주께서 말씀하신다. 나는 죄인의 죽음을 원하지 않고 그의 회개를 원한다.” 그리고 좋은 선언도 덧붙이셨습니다. “회개하여라, 이스라엘 집아, 너희의 불법에서 돌이켜라. 내 백성의 자손들에게 말하여라. ‘너희의 죄가 땅에서 하늘에 이를지라도, 또 진홍보다 더 붉고 굵은 베보다 더 검을지라도, 온 마음으로 내게 돌아와 “아버지”라고 말하면, 내가 거룩한 백성에게 하듯 너희의 말을 들을 것이다.’” 그리고 다른 곳에서도 이렇게 말씀하십니다. “씻고 깨끗해져라. 내 눈앞에서 너희의 영혼에서 너희의 악한 행위들을 치워 버려라. 너희의 악함에서 그만두고, 선을 행하는 법을 배워라. 정의를 구하고, 억울한 사람을 구해 주고, 고아를 위해 판결하며, 과부에게 정의를 베풀어라. 그리고 와서, 서로 변론해 보자.” 주께서 말씀하신다. “너희의 죄가 주홍 같을지라도 내가 눈처럼 희게 할 것이며, 붉은 보랏빛 같을지라도 내가 양털처럼 희게 할 것이다. 그러나 너희가 원하고 내 말을 들으면, 너희는 땅의 좋은 것들을 먹을 것이지만, 너희가 원하지 않고 내 말을 듣지 않으면 칼이 너희를 삼킬 것이다. 이는 주의 입이 이 말을 하였기 때문이다.” 그러므로 그분은 사랑하는 모든 이가 회개에 참여하게 되기를 원하셨기에, 자기의 전능한 뜻으로 그것을 확립하셨습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λειτουργοὶ
  english_pob_choice: ministers
  chosen_korean: 일꾼들
  alternatives_korean:
  - 봉사자들
  - 사역자들
  lexicon: LSJ
  rationale: 공적이고 위임된 봉사의 뉘앙스를 살리면서도, 특정 교회 직분으로 과도하게 좁히지 않기 위해 선택했습니다.
- source_word: δεσπότης τῶν ἁπάντων
  english_pob_choice: Master of all things
  chosen_korean: 만물의 주권자
  alternatives_korean:
  - 만물의 주인
  - 만물의 주
  lexicon: LSJ
  rationale: δεσπότης의 강한 소유·통치성을 살리고, κύριος와의 구별을 유지하기 위해 ‘주권자’로 옮겼습니다.
- source_word: γνώμην ἀγαθήν
  english_pob_choice: a good intention
  chosen_korean: 좋은 선언
  alternatives_korean:
  - 선한 의도
  - 좋은 뜻
  - 선한 결의
  lexicon: LSJ
  rationale: 문맥상 맹세에 덧붙여지는 하나의 긍정적 선언이라는 점을 반영해, 단순한 내적 ‘의도’보다 공적 발화를 드러내는 표현을 택했습니다.
- source_word: παντοκρατορικῷ βουλήματι
  english_pob_choice: his all-sovereign purpose
  chosen_korean: 자기의 전능한 뜻
  alternatives_korean:
  - 그의 전능한 계획
  - 전능하신 뜻
  - 만능의 의지
  lexicon: LSJ
  rationale: βουλήμα의 ‘뜻/계획’과 παντοκρατορικός의 전능성을 함께 살리되, 한국어에서 자연스럽고 신학적으로도 무리 없는 표현으로 정리했습니다.
- source_word: ἀπό τῶν ψυχῶν ὑμῶν
  english_pob_choice: from your souls
  chosen_korean: 너희의 영혼에서
  alternatives_korean:
  - 너희 영혼으로부터
  - 너희의 속사람에서
  lexicon: LSJ
  rationale: 원문의 전치사구를 빠뜨리지 않기 위해 반영했으며, 외적 행위가 아니라 내적 존재에서 악을 제거하라는 강한 호소를 드러냅니다.
theological_decisions:
- issue: 회개가 명령이면서도 주어지는 참여의 영역으로 묘사됨
  chosen_reading: ‘회개에 참여하게 되기를 원하셨기에’
  alternative_readings:
  - ‘회개하도록 원하셨기에’
  - ‘회개할 기회를 주셨기에’
  rationale: μετασχεῖν의 참여적 의미를 살려, 회개를 단순한 의무 명령으로만 축소하지 않고 하나님이 사랑하는 이들을 그 안에 참여시키시는 뉘앙스를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
- issue: 예언 인용 안에서 직접 화자 전환과 ‘아버지’ 호칭의 친밀성
  chosen_reading: 인용문 안의 직접 화법은 유지하고, ‘아버지’는 그대로 음역하지 않고 한국어로 옮김
  alternative_readings:
  - ‘파테르’
  - ‘아버지여’
  rationale: 원문의 직접 인용 구조를 보존하면서도, 회개하는 백성의 친밀한 부름이라는 의미가 한국어에서 자연스럽게 들리도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve quotation structure and register.'
