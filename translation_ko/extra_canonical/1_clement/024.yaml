source:
  edition: Funk 1901 (normalized OCR)
  text: Κατανοήσωμεν, ἀγαπητοί, πῶς ὁ δεσπότης ἐπιδείκνυται διηνεκῶς ἡμῖν τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι, ἧς τὴν ἀπαρχὴν ἐποιήσατο τὸν κύριον Ἰησοῦν Χριστὸν ἐκ νεκρῶν ἀναστήσας. . ἴδωμεν, ἀγαπητοί, τὴν κατὰ καιρὸν γινομένην ἀνάστασιν. . ἡμέρα καὶ νὺξ ἀνάστασιν ἡμῖν δηλοῦσιν· κοιμᾶται ἡ νύξ, ἀνίσταται ἡ ἡμέρα· ἡ ἡμέρα ἄπεισιν, νὺξ ἐπέρχεται. 4. λάβωμεν τοὺς καρπούς· ὁ σπόρος πῶς καὶ τίνα τρόπον γίνεται; 5. ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
  pages:
  - 295
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024.yaml
  text: 'Let us consider[a], beloved, how the Master continually shows us that the coming resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead. Let us observe, beloved, the resurrection that takes place in its appointed season. Day and night show us a resurrection: the night falls asleep, and the day rises; the day departs, and night comes on. Let us take the fruits as an example: how and in what way does the seed come to be? The sower went out and cast each of the seeds into the ground, and when they fall into the ground, dry and bare, they decay; then from that decay the greatness of the Master''s providence raises them up[f][e][d][c][b], and from one he causes more to grow and produces fruit.'
  footnotes:
  - marker: a
    text: Or 'the coming resurrection.' The Greek expression is emphatic, stressing the certainty of the future resurrection.
    reason: lexical_alternative
  - marker: b
    text: '''Firstfruits'' echoes biblical sacrificial and harvest language and presents Jesus Messiah as the initial instance and guarantee of the resurrection to come.'
    reason: cross_reference
  - marker: c
    text: The image of night 'falling asleep' and day 'rising' is part of Clement's rhetorical analogy, not a literal cosmology.
    reason: cultural_note
  - marker: d
    text: Or 'that the resurrection that is going to happen will indeed be'.
    reason: previous_rendering
  - marker: e
    text: Or 'does the seed come to be'.
    reason: previous_rendering
  - marker: f
    text: Or 'he increases many and brings forth fruit'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 이들이여, 주인이 우리에게 장차 있을 부활이 반드시 일어날 것을 늘 보여 주신다는 사실을 우리가 살펴봅시다. 그분은 죽은 이들 가운데서 주 예수 메시아를 일으키심으로, 그 부활의 첫 열매로 삼으셨습니다. 사랑하는 이들이여, 제때에 일어나는 부활을 우리가 보십시오. 낮과 밤은 우리에게 부활을 보여 줍니다. 밤은 잠들고 낮은 일어납니다. 낮은 지나가고 밤이 다가옵니다. 열매들을 우리가 예로 들어 봅시다. 씨가 어떻게, 또 어떤 방식으로 생겨납니까? 씨 뿌리는 사람이 나가서 각 씨앗을 땅에 던졌습니다. 그것들이 마른 채 벌거벗은 모습으로 땅에 떨어지면 썩어 없어집니다. 그러면 그 썩어 없어짐으로부터 주인의 섭리의 위대하심이 그것들을 일으키시고, 하나로부터 더 많은 것이 자라나 열매를 맺게 하십니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 주재자
  lexicon: BDAG
  rationale: 같은 문맥의 κύριος와 구별되는 절대적 소유·권위의 뉘앙스를 살리기 위해 ‘주님’보다 더 직접적인 ‘주인’을 택했습니다.
- source_word: μέλλουσαν ἀνάστασιν ἔσεσθαι
  english_pob_choice: the resurrection that is going to happen will indeed be
  chosen_korean: 장차 있을 부활이 반드시 일어날 것
  alternatives_korean:
  - 오는 부활
  - 미래의 부활
  lexicon: BDAG
  rationale: 그리스어의 반복적·강조적 표현을 한국어에서도 ‘장차’와 ‘반드시’로 살려, 단순한 미래 시제가 아니라 확실성을 드러냈습니다.
- source_word: ἀπαρχὴν
  english_pob_choice: firstfruits
  chosen_korean: 첫 열매
  alternatives_korean:
  - 처음 열매
  - 첫 수확
  lexicon: BDAG
  rationale: 제물·추수의 성경적 울림을 유지하면서도 한국어에서 자연스러운 표현인 ‘첫 열매’를 사용했습니다.
- source_word: κοιμᾶται / ἀνίσταται
  english_pob_choice: falls asleep / rises
  chosen_korean: 잠들고 / 일어납니다
  alternatives_korean:
  - 잠들고 / 다시 섭니다
  - 자고 / 일어납니다
  lexicon: BDAG
  rationale: 낮과 밤의 비유 안에서 부활 어휘의 반복을 살리기 위해 ‘일어나다’를 택했고, ‘잠들다’로 수면 이미지를 유지했습니다.
- source_word: ξηρὰ καὶ γυμνά
  english_pob_choice: dry and bare
  chosen_korean: 마른 채 벌거벗은 모습으로
  alternatives_korean:
  - 마르고 벌거벗은
  - 마른 채 드러난
  lexicon: LSJ
  rationale: 씨앗의 무력하고 벗겨진 상태를 과도하게 완화하지 않으면서도, 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: ἀνίστησιν αὐτά
  english_pob_choice: raises them up
  chosen_korean: 그것들을 일으키시고
  alternatives_korean:
  - 그것들을 다시 세우시고
  - 그것들을 일으켜 세우시고
  lexicon: BDAG
  rationale: 부활 문맥의 동사력을 살리기 위해 단순한 ‘자라게 하다’보다 ‘일으키다’를 택했습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 프로젝트의 기본 방침에 따라 칭호로 기능하는 Χριστός는 음역보다 의미 번역인 ‘메시아’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 재현된 부활 언어를 자연 비유 안에서도 유지할지 여부
  chosen_reading: 밤은 잠들고 낮은 일어납니다; 그것들을 일으키시고
  alternative_readings:
  - 밤은 사라지고 낮이 옵니다; 그것들을 살리십니다
  rationale: 클레멘스의 논증은 자연의 순환을 육체적 부활의 확실성과 연결하므로, 비유 안에서도 부활 어휘를 최대한 유지했습니다.
  doctrine_reference: 문맥상 부활 논증의 수사적 연속성
