  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026.yaml
  text: Therefore[a], do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise? 2. For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.” 3[b]. And again, Job says, “And you will raise up this flesh of mine[d][c], which has endured all these things.”
  footnotes:
  - marker: a
    text: The 'bird' alludes to the phoenix example discussed in the surrounding context as an illustration of resurrection.
    reason: cultural_note
  - marker: b
    text: The citation formulas ('somewhere he says,' 'Iob says') introduce scriptural proof texts used to support the resurrection hope.
    reason: cross_reference
  - marker: c
    text: Or 'this body of mine' for 'this flesh of mine'; the Greek is more literally 'flesh.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And again, Iob says,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 만물의 창조주께서 경건하게 그분을 섬긴 이들을, 좋은 믿음의 확신 가운데, 부활하게 하시는 것을 우리가 크고도 놀라운 일로 여기지 않겠습니까? 심지어 한 새를 통해서도 그분의 약속의 위대함을 우리에게 보여 주시는데 말입니다. 2. 기록되기를, 「어디선가 그가 말씀하셨습니다. ‘그리고 주께서 저를 일으키실 것이며, 저는 주께 감사드리겠습니다.’ 또, ‘내가 누워 잠들었지만, 깨어났으니, 주께서 나와 함께 계시기 때문입니다.’」 3. 또 다시 욥이 말합니다. 「그리고 주께서는 이 내 육체를 다시 일으키실 것이니, 이 육체는 이 모든 일을 겪었습니다.」[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δημιουργός
  english_pob_choice: Maker
  chosen_korean: 창조주
  alternatives_korean:
  - 만드시는 분
  - 제작자
  lexicon: LSJ
  rationale: 만물의 기원을 이루시는 분이라는 높임과 창조적 주권을 살리기 위해 ‘창조주’로 옮겼습니다.
- source_word: ἀνάστασιν ποιήσεται
  english_pob_choice: will bring about the resurrection
  chosen_korean: 부활하게 하시는 것
  alternatives_korean:
  - 부활을 이루실 것
  - 부활을 일으키실 것
  lexicon: LSJ
  rationale: ποιέω의 능동적 사역성을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘부활하게 하다’로 옮겼습니다.
- source_word: ὁσίως
  english_pob_choice: in holiness
  chosen_korean: 경건하게
  alternatives_korean:
  - 거룩하게
  - 신실하게
  lexicon: LSJ
  rationale: 하나님께 바쳐진 경건한 삶의 태도를 드러내는 말로, 본문의 윤리·예배적 뉘앙스를 압축해 전달합니다.
- source_word: δουλευσάντων
  english_pob_choice: have served
  chosen_korean: 섬긴
  alternatives_korean:
  - 봉사한
  - 종노릇한
  lexicon: LSJ
  rationale: 여기서는 신분적 노예 상태보다 하나님께 대한 충성된 섬김이 강조되므로 ‘섬기다’가 가장 적절합니다.
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  english_pob_choice: in the confidence of good faith
  chosen_korean: 좋은 믿음의 확신 가운데
  alternatives_korean:
  - 선한 믿음의 확신 가운데
  - 좋은 믿음으로 확신한 가운데
  lexicon: LSJ
  rationale: πεποίθησις와 πίστις의 중첩을 한국어에서도 ‘확신’과 ‘믿음’으로 함께 살려, 단순한 한 단어로 평면화하지 않았습니다.
- source_word: δι᾿ ὀρνέου
  english_pob_choice: through a bird
  chosen_korean: 한 새를 통해서도
  alternatives_korean:
  - 새를 통해
  - 어떤 새를 통해서도
  lexicon: LSJ
  rationale: 원문이 특정 새를 명시하지 않으므로 일반적 표현을 유지하되, 문맥상 예시적 기능을 반영해 ‘심지어’의 뉘앙스를 살렸습니다.
- source_word: σάρκα
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 살
  - 몸
  lexicon: LSJ
  rationale: 주제가 육체적 부활이므로 본문 취지를 분명히 하되, 한국어에서 자연스럽고 오해가 적은 ‘육체’를 사용했습니다.
theological_decisions:
- issue: 직접 인용의 종결어미와 화자 재현
  chosen_reading: 직접 인용 안에서는 원문의 인용문 구조를 살리되, 성경 인용문은 한국어에서 자연스러운 평서형으로 처리했습니다.
  alternative_readings:
  - 인용문 전체를 문어체로 평준화
  - 더 강한 예전적 문체로 처리
  rationale: 이 장은 시편/욥기 인용을 논증 근거로 제시하므로, 한국어에서도 인용 경계를 분명히 하되 과도한 고어화는 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy 1, 4
