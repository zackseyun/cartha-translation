source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ; 2. λέγει γάρ που· Καὶ ἐξαναστήσεις με, καὶ ἐξομολογήσομαί σοι· καί· Ἐκοιμήθην καὶ ὕπνωσα, ἐξηγέρθην, ὅτι σὺ μετ᾿ ἐμοῦ εἶ. 3. καὶ πάλιν Ἰὼβ λέγει· Καὶ ἀναστήσεις τὴν σάρκα μου ταύτην τὴν ἀναντλήσασαν ταῦτα πάντα.
  language: Greek
  pages:
