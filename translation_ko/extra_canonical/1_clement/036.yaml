base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/036.yaml
  text: 'This is the way[a], beloved, in which we found our salvation: Jesus Messiah, the high priest of our offerings, the protector and helper of our weakness.


    Through him we fix our gaze on the heights of heaven; through him we behold as in a mirror his spotless and most exalted countenance; through him the eyes of our heart were opened; through him our foolish and darkened mind springs up into the light; through him the Master willed that we should taste of immortal knowledge—he who, being the radiance of his majesty, is by so much greater than the angels as he has inherited a more excellent name.


    For it is written thus:

    “He makes his angels winds,

    and his ministers a flame of fire.”


    But concerning his Son it says thus:

    “You are my Son;

    today I have begotten you.

    Ask of me, and I will give you the nations as your inheritance[b],

    and the ends of the earth as your possession.”


    And again he says to him:

    “Sit at my right hand[c],

    until I make your enemies a footstool for your feet.”


    Who then are the enemies? Those who are vile and oppose his will.'
  footnotes:
  - marker: a
    text: Or 'spirits' in the citation, since the Greek word can mean either 'winds' or 'spirits.'
    reason: lexical_alternative
  - marker: b
    text: The wording in this section echoes themes and phrases known from Hebrews 1:3–7 and Psalm citations used in early Christian christological argument.
    reason: cross_reference
  - marker: c
    text: Or 'The vile, and those who set themselves against'.
    reason: previous_rendering
translation:
  language: ko
  text: '이것이 사랑하는 이들아, 우리가 우리의 구원, 예수 메시아를 발견한 길입니다. 그는 우리의 예물들의 대제사장이시며, 우리의 연약함의 보호자요 돕는 이이십니다.


    그를 통하여 우리는 하늘의 높은 곳들을 바라봅니다. 그를 통하여 우리는 그의 흠 없고 가장 높으신 모습을 거울처럼 봅니다. 그를 통하여 우리 마음의 눈이 열렸습니다. 그를 통하여 우리의 어리석고 어두워진 생각이 빛으로 솟아오릅니다. 그를 통하여 주인께서는 우리가 죽지 않는 지식을 맛보게 하시기를 원하셨습니다. 그는 그분의 위엄의 광채이시며, 더 탁월한 이름을 물려받으셨으므로 천사들보다 그만큼 더 크십니다.


    기록되기를:


    “그는 그의 천사들을 바람으로,


    그의 일꾼들을 불꽃으로 만드십니다.”


    그러나 그의 아들에 관하여는 이렇게 말씀하십니다.


    “너는 내 아들이다.


    오늘 내가 너를 낳았다.


    내게 구하라. 그러면 내가 너에게 여러 민족들을 네 유산으로,


    땅의 끝들을 네 소유로 주겠다.”


    그리고 다시 그에게 말씀하십니다.


    “내 오른쪽에 앉아 있으라.


    내가 네 원수들을 네 발의 발판으로 만들 때까지.”


    그러면 그 원수들은 누구입니까? 악한 자들이며 그의 뜻에 맞서 스스로 대적하는 자들입니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν Χριστόν
  english_pob_choice: Jesus Messiah
  chosen_korean: 예수 메시아
  alternatives_korean:
  - 예수 그리스도
  lexicon: BDAG
  rationale: Χριστός가 여기서는 이름보다 칭호로 기능하므로, 프로젝트 기본 용례에 따라 ‘메시아’로 옮겨 원문의 호칭성을 살렸습니다.
- source_word: ἀρχιερέα
  english_pob_choice: high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 대사제
  lexicon: BDAG
  rationale: 성전-제의적 직함을 분명히 드러내는 표준어로, 히브리서적 그리스도론과의 연관도 보존합니다.
- source_word: προσφορῶν
  english_pob_choice: offerings
  chosen_korean: 예물들
  alternatives_korean:
  - 제물들
  - 제사들
  lexicon: BDAG
  rationale: 피흘림 제사만이 아니라 예배적 헌납 전반을 포괄하는 말로, 문맥의 제의적 넓이를 살렸습니다.
- source_word: προστάτην καὶ βοηθὸν τῆς ἀσθενείας ἡμῶν
  english_pob_choice: the protector and helper of our weakness
  chosen_korean: 우리의 연약함의 보호자요 돕는 이
  alternatives_korean:
  - 우리 연약함의 수호자요 도움
  - 우리의 약함을 지키는 이요 돕는 이
  lexicon: BDAG
  rationale: 두 명사를 병렬로 살리되, ‘연약함’을 덧붙여 인간의 취약성과 의존성을 자연스럽게 드러냈습니다.
- source_word: ἀναθάλλει εἰς τὸ φῶς
  english_pob_choice: springs up into the light
  chosen_korean: 빛으로 솟아오릅니다
  alternatives_korean:
  - 빛으로 피어납니다
  - 빛을 향해 다시 돋아납니다
  lexicon: LSJ
  rationale: 새싹이 돋는 동적 이미지를 유지하면서도, ‘빛으로’라는 방향성을 간결하게 살렸습니다.
- source_word: ὀφθαλμοὶ τῆς καρδίας
  english_pob_choice: the eyes of our heart
  chosen_korean: 마음의 눈
  alternatives_korean:
  - 우리 마음의 눈
  - 심장의 눈
  lexicon: BDAG
  rationale: 한국어 관용에서 자연스러운 표현을 택하되, 원문의 비유를 약화시키지 않도록 그대로 유지했습니다.
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주
  - 지배자
  lexicon: BDAG
  rationale: κύριος와 구별되는 강한 권위의 뉘앙스를 살리면서도, 현대 한국어에서 과도하게 낯설지 않게 옮겼습니다.
- source_word: πνεύματα
  english_pob_choice: winds
  chosen_korean: 바람
  alternatives_korean:
  - 영들
  lexicon: BDAG
  rationale: 시편 인용의 원시적 이미지인 자연 현상을 우선 살렸고, 대안 가능성은 주석으로 남겼습니다.
theological_decisions:
- issue: Χριστός의 번역을 이름이 아닌 칭호로 유지할지 여부
  chosen_reading: ‘예수 메시아’로 번역해 칭호성을 분명히 했습니다.
  alternative_readings:
  - ‘예수 그리스도’로 음역
  rationale: 문맥상 예수를 호칭하는 신앙고백적 칭호이므로, 의미를 드러내는 번역이 본문 이해에 더 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: πνεύματα의 의미를 ‘바람’으로 둘지 ‘영들’로 둘지
  chosen_reading: 시편 인용에서는 ‘바람’으로 옮겼습니다.
  alternative_readings:
  - 영들
  rationale: 인용문은 시편의 요소적 이미지와 잘 맞고, 원문은 문맥상 자연 현상으로도 읽힐 수 있어 그 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
