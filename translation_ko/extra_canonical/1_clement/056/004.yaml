id: 1CLEM.56.4
reference: 1 Clement 56:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὃν γὰρ ἀγαπᾷ κύριος, παιδεύει, μαστιγοῖ δὲ πάντα υἱόν, ὃν παραδέχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/004.yaml
  text: '“For the Lord disciplines the one whom he loves,

    and he scourges every son whom he receives.”'
translation:
  language: ko
  text: '“주께서 사랑하시는 이를 징계하십니다.

    또 받아들이시는 모든 아들을 채찍질하십니다.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾷ
  english_pob_choice: he loves
  chosen_korean: 사랑하시는
  alternatives_korean:
  - 사랑하는
  - 사랑하시는 분의
  lexicon: ἀγαπάω
  rationale: 하나님의 능동적 사랑을 자연스럽게 옮기기 위해 관형형 ‘사랑하시는’을 사용했습니다.
- source_word: παιδεύει
  english_pob_choice: disciplines
  chosen_korean: 징계하십니다
  alternatives_korean:
  - 훈육하십니다
  - 가르치십니다
  - 교육하십니다
  lexicon: παιδεύω
  rationale: 문맥상 단순 교육이 아니라 사랑 안에서의 징계·교정의 뜻이므로 ‘징계하십니다’가 가장 직접적입니다.
- source_word: μαστιγοῖ
  english_pob_choice: scourges
  chosen_korean: 채찍질하십니다
  alternatives_korean:
  - 매질하십니다
  - 채찍으로 치십니다
  lexicon: μαστιγόω
  rationale: 형벌적 이미지가 분명한 동사이므로 본래의 강도를 살려 ‘채찍질하십니다’로 옮겼습니다.
- source_word: υἱόν
  english_pob_choice: son
  chosen_korean: 아들
  alternatives_korean:
  - 자녀
  - 아들 된 자
  lexicon: υἱός
  rationale: 원문이 ‘아들’(singular)을 사용하므로 성별 표지를 지우지 않고 그대로 유지했습니다.
theological_decisions:
- issue: ‘사랑’과 ‘징계/채찍질’의 관계
  chosen_reading: 하나님의 사랑은 징계를 배제하지 않으며, 오히려 받아들임의 표지로서 교정과 단련을 포함합니다.
  alternative_readings:
  - 징계를 사랑의 결과가 아니라 단순한 처벌로 읽는 해석
  - 징계를 약화시켜 교육 정도로만 읽는 해석
  rationale: 히브리서 12:6을 반영한 인용으로, 문맥상 사랑과 징계의 긴장을 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 히 12:6; 잠 3:12
