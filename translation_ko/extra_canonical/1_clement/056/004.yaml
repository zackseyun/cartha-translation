  source_fidelity: 그리스어의 대조·연결(γὰρ ... δὲ), ‘사랑하다’(ἀγαπᾷ), ‘징계하다’(παιδεύει), ‘채찍질하다’(μαστιγοῖ), 그리고 ‘받아들이는 모든 아들’(πάντα υἱόν, ὃν παραδέχεται)을 충실히 반영합니다. ‘모든 아들을’은 원문의 단수형이 집합적 의미로 사용된 점을 한국어에서 자연스럽게 재현합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 인용문의 엄숙한 문체에도 적절합니다. 두 문장으로 나눈 처리와 ‘또’는 원문의 δέ가 이끄는 두 절의 연결을 무리 없이 전달합니다.
  terminology: ‘주’, ‘징계’, ‘채찍질’, ‘아들’, ‘받아들이시다’는 본문의 어휘 강도와 종교 문헌의 관습적 용례를 적절히 보존합니다. 특히 μαστιγοῖ의 가혹한 형상을 ‘채찍질하십니다’로 약화하지 않은 점이 적절합니다.
