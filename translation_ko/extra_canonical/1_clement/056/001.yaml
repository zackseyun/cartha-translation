id: 1CLEM.56.1
reference: 1 Clement 56:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ ἡμεῖς οὖν ἐντύχωμεν περὶ τῶν ἐν τινι παραπτώματι ὑπαρχόντων, ὅπως δοθῇ αὐτοῖς ἐπιείκεια καὶ ταπεινοφροσύνη εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ· οὕτως γὰρ ἔσται αὐτοῖς ἔγκαρπος καὶ τελεία ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/001.yaml
  text: Therefore let us also intercede concerning those who are in some transgression, so that gentleness and humility may be given to them, that they may yield not to us, but to the will of God. For in this way their compassionate remembrance before God and the saints will be fruitful and complete.
  footnotes:
  - marker: a
    text: Or 'caught in some transgression'.
    reason: previous_rendering
  - marker: b
    text: Or 'their remembrance before God and the saints will be fruitful and complete, with compassion'.
    reason: previous_rendering
  - marker: c
    text: Or 'for them to yield'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리도 어떤 죄과에 있는 이들을 위하여 간구합시다. 그들에게 온유함과 겸손함이 주어져서, 그들이 우리에게가 아니라 하나님의 뜻에 순종하게 하려는 것입니다. 그렇게 될 때 그들의 하나님과 성도들 앞에서의 자비로운 기억은 열매 맺고 온전할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντύχωμεν
  english_pob_choice: let us also intercede
  chosen_korean: 간구합시다
  alternatives_korean:
  - 중보합시다
  - 빌어봅시다
  lexicon: ἐντυγχάνω
  rationale: 공동체가 다른 이들을 위해 간청하는 의미를 살리되, 한국어에서 자연스럽고 공적 문맥에 어울리는 동사로 옮겼습니다.
- source_word: ἐν τινι παραπτώματι ὑπαρχόντων
  english_pob_choice: those who are in some transgression
  chosen_korean: 어떤 죄과에 있는 이들
  alternatives_korean:
  - 어떤 허물 가운데 있는 이들
  - 어떤 잘못에 빠진 이들
  lexicon: παράπτωμα / ὑπάρχω
  rationale: ὑπαρχόντων은 ‘붙잡힌’이 아니라 단순히 어떤 상태에 ‘있는’ 뜻이므로, 그 상태를 드러내는 표현으로 옮겼습니다.
- source_word: ἐπιείκεια καὶ ταπεινοφροσύνη
  english_pob_choice: gentleness and humility
  chosen_korean: 온유함과 겸손함
  alternatives_korean:
  - 관대함과 겸손함
  - 부드러움과 낮아짐
  lexicon: ἐπιείκεια / ταπεινοφροσύνη
  rationale: 두 덕목의 짝을 유지하면서도 한국어 교회어휘에 과도하게 기대지 않고, 문맥상 품성의 덕목으로 자연스럽게 표현했습니다.
- source_word: εἰς τὸ εἶξαι αὐτοὺς μὴ ἡμῖν, ἀλλὰ τῷ θελήματι τοῦ θεοῦ
  english_pob_choice: that they may yield not to us, but to the will of God
  chosen_korean: 그들이 우리에게가 아니라 하나님의 뜻에 순종하게 하려는 것입니다
  alternatives_korean:
  - 그들이 우리에게가 아니라 하나님의 뜻에 양보하게 하려는 것입니다
  - 그들이 우리 말이 아니라 하나님의 뜻을 따르게 하려는 것입니다
  lexicon: εἴκω / θέλημα
  rationale: εἶξαι는 단순한 ‘양보’보다 의지적 ‘순응/순종’을 포함하므로, 하나님의 뜻에 대한 종속을 분명히 드러냈습니다.
- source_word: ἡ πρὸς τὸν θεὸν καὶ τοὺς ἁγίους μετ’ οἰκτιρμῶν μνεία
  english_pob_choice: their compassionate remembrance before God and the saints
  chosen_korean: 그들의 하나님과 성도들 앞에서의 자비로운 기억
  alternatives_korean:
  - 그들의 하나님과 성도들 앞에서의 긍휼한 기억
  - 그들의 하나님과 성도들 앞에서의 자비가 깃든 회상
  lexicon: μνεία / μετ’ οἰκτιρμῶν
  rationale: μετ’ οἰκτιρμῶν은 기억 자체를 수식하므로 ‘자비로운 기억’으로 붙였고, πρὸς τὸν θεὸν καὶ τοὺς ἁγίους는 ‘앞에서’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ἅγιοι의 번역
  chosen_reading: 성도들
  alternative_readings:
  - 거룩한 이들
  - 성인들
  rationale: 문맥상 공동체 구성원을 가리키는 용법이므로, 한국어 교회용어에서 널리 쓰이는 ‘성도들’을 유지했습니다.
  doctrine_reference: ecclesial usage
- issue: 공동체적 권면의 등록
  chosen_reading: 우리도 … 간구합시다
  alternative_readings:
  - 우리도 … 위하여 기도합시다
  - 우리도 … 위해 중보합시다
  rationale: 본문의 권면적 공동체 호소를 살리기 위해 1인칭 복수 권유형으로 옮겼고, 다소 설교체보다 직접적 exhortation을 택했습니다.
  doctrine_reference: paraenesis
