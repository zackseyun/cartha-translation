  source_fidelity: 핵심 의미는 대체로 보존되어 있으나, εἰς τὸ εἶξαι의 목적 구문을 ‘…하게 하려는 것입니다’라고 독립 설명문으로 처리한 것은 원문의 권면 구조를 흐립니다. 또한 πρὸς를 ‘앞에서’로 옮긴 것은 ‘~을 향한/관한’이라는 관계를 충분히 반영하지 못합니다.
