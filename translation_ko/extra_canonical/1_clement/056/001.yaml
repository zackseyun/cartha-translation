  terminology: ‘간구합시다’, ‘온유함과 겸손함’, ‘성도들’은 문맥과 합쇼체에 적절합니다. παράπτωμα의 ‘죄과’도 가능하나 현대어에서는 ‘허물’이 더 자연스럽고 특정한 중죄의 뉘앙스를 피합니다.
  issues:
