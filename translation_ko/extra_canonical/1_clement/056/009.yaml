  source_fidelity: ‘쇠의 손에서’는 ἐκ χειρὸς σιδήρου의 어휘 순서를 기계적으로 따른 것이지만, 한국어에서는 의미를 전달하지 못합니다. 이 표현은 욥기 5:20을 반영하는 셈어식 관용구이며, σίδηρος(쇠/철)는 여기서 칼을 가리킵니다. ‘쇠칼의 위력에서’는 무력의 위협이라는 관용적 의미와 ‘손’의 권능·지배 영역의 뜻을 자연스럽게 전달합니다.
  naturalness: 초안의 ‘쇠의 손’은 현대 표준 한국어에서 부자연스럽고 혼합 비유처럼 들립니다. 또한 두 절을 ‘건지실 것이며/구해 내실 것입니다’로 병렬하면 합쇼체의 격식 있는 흐름이 자연스럽습니다.
