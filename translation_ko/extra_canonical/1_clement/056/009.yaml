id: 1CLEM.56.9
reference: 1 Clement 56:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν λιμῷ ῥύσεταί σε ἐκ θανάτου, ἐν πολέμῳ δὲ ἐκ χειρὸς σιδήρου λύσει σε·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/009.yaml
  text: 'In famine he will rescue you from death,

    and in war he will deliver you from the hand of the sword[a].'
  footnotes:
  - marker: a
    text: Or 'from the hand of the sword'.
    reason: previous_rendering
translation:
  language: ko
  text: 기근 때에는 그가 너를 죽음에서 구출하실 것이며, 전쟁 때에는 쇠의 손에서 너를 건져내실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λιμῷ
  english_pob_choice: In famine
  chosen_korean: 기근 때에는
  alternatives_korean:
  - 기근 속에서는
  - 굶주림 때에는
  lexicon: λιμός
  rationale: 기근은 단순한 배고픔보다 재난적 식량 부족을 나타내므로, 문맥에 맞게 ‘기근’으로 옮겼습니다.
- source_word: ῥύσεταί σε ἐκ θανάτου
  english_pob_choice: he will rescue you from death
  chosen_korean: 그가 너를 죽음에서 구출하실 것이며
  alternatives_korean:
  - 그가 너를 죽음에서 구해 주실 것이며
  - 그가 너를 죽음에서 건져내실 것이며
  lexicon: ῥύομαι
  rationale: ῥύομαι의 핵심은 위험에서 건져내는 구출이므로 ‘구출하다’로 살렸고, 합쇼체 문맥에 맞게 종결했습니다.
- source_word: ἐκ χειρὸς σιδήρου
  english_pob_choice: from the hand of the sword
  chosen_korean: 쇠의 손에서
  alternatives_korean:
  - 철의 손에서
  - 쇠칼의 손에서
  - 칼의 손에서
  lexicon: χείρ + σίδηρος
  rationale: 원문은 직역하면 ‘쇠의 손’이지만, 히브리어식 관용구로서 무기의 위협을 가리키므로 POB의 수정 흐름을 참고하되 원문의 어휘를 최대한 보존했습니다.
- source_word: λύσει σε
  english_pob_choice: he will deliver you
  chosen_korean: 너를 건져내실 것입니다
  alternatives_korean:
  - 너를 풀어 주실 것입니다
  - 너를 해방하실 것입니다
  lexicon: λύω
  rationale: λύω는 풀다/풀어놓다의 뜻이지만 여기서는 구출·해방의 맥락이므로 자연스럽고 의미를 분명히 하는 ‘건져내다’를 택했습니다.
theological_decisions:
- issue: 인칭 표지와 주어의 명시 여부
  chosen_reading: ‘그가’로 주어를 밝혀 신적 구원 행위를 분명히 했습니다.
  alternative_readings:
  - 주어를 생략해 ‘기근 때에는 너를 죽음에서 구출하실 것이며…’로 옮길 수 있습니다.
  rationale: 헬라어는 동사 형태만으로 주어가 드러나지만, 한국어는 주어를 밝혀 주는 편이 문장 흐름과 수사적 대조를 더 분명하게 전달합니다.
  doctrine_reference: 문맥상 인도하시는 주체를 분명히 하는 서술 방식
