lexical_decisions:
- source_word: ἀδίκων
  english_pob_choice: the unrighteous
  chosen_korean: 불의한 자들
  alternatives_korean:
  - 의롭지 않은 자들
  - 불의한 이들
  lexicon: ἀδίκων
  rationale: 의의 결핍과 도덕적 불의를 직접 드러내기 위해 ‘불의한 자들’로 옮겼습니다.
- source_word: ἀνόμων
  english_pob_choice: lawless
  chosen_korean: 법 없는 자들
  alternatives_korean:
  - 율법 없는 자들
  - 무법자들
  lexicon: ἀνόμων
  rationale: 단순한 사회적 무법이 아니라 규범/율례의 부재를 나타내므로 직역에 가까운 ‘법 없는 자들’을 택했습니다.
- source_word: καταγελάσῃ
  english_pob_choice: You will laugh at
  chosen_korean: 비웃으실 것이며
  alternatives_korean:
  - 웃으실 것이며
  - 조롱하실 것이며
  lexicon: καταγελάω
  rationale: 문맥상 단순한 웃음보다 경멸적·승리적 반응이 더 강해 ‘비웃다’가 원문의 힘을 더 잘 살립니다.
- source_word: θηρίων ἀγρίων
  english_pob_choice: wild beasts
  chosen_korean: 거친 짐승들
  alternatives_korean:
  - 야수들
  - 사나운 짐승들
  lexicon: θηρίον / ἄγριος
  rationale: ‘θηρία’의 짐승성은 유지하되 ‘ἀγρίων’의 거칠고 사나운 성격을 함께 살리기 위해 ‘거친 짐승들’로 옮겼습니다.
theological_decisions:
- issue: 두 번째 절반의 부정 강조
  chosen_reading: οὐ μὴ φοβηθῇς를 강한 확정적 부정으로 처리해 ‘두려워하지 않으실 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘결코 두려워하지 않을 것입니다’
  - ‘전혀 두려워하지 않으실 것입니다’
  rationale: οὐ μή는 단순 부정이 아니라 강한 배제와 확신을 주므로, 현대 한국어에서도 미래형 긍정적 확신을 유지하는 표현이 적절합니다.
  doctrine_reference: 헬라어 강조 부정(οὐ μή)
