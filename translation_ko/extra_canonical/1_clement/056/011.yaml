  terminology: ἀδίκων은 ‘불의한 자들’, ἀνόμων은 문맥상 특정 종교적 ‘율법’으로 한정하지 않은 ‘무법한 자들’로 옮겼습니다. θηρίων ἀγρίων은 ‘야생 짐승들’로 번역했습니다.
