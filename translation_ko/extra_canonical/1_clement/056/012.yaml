  rationale: θῆρες ἄγριοι는 단순한 ‘야생 동물’보다 공격성과 위험성이 살아 있는 표현이므로, POB의 ‘wild beasts’를 따라 ‘사나운 들짐승들’로 옮겨 긴장감을 살렸습니다.
- source_word: εἰρηνεύσουσίν
