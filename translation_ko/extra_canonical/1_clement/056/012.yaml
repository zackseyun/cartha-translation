  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θῆρες ἄγριοι
  english_pob_choice: wild beasts
  chosen_korean: 사나운 들짐승들
  alternatives_korean:
  - 야생 짐승들
  - 거친 짐승들
  lexicon: θῆρες / ἄγριοι
  rationale: θῆρες ἄγριοι는 단순한 ‘야생 동물’보다 공격성과 위험성이 살아 있는 표현이므로, POB의 ‘wild beasts’를 따라 ‘사나운 들짐승들’로 옮겨 긴장감을 살렸습니다.
- source_word: εἰρηνεύσουσίν
  english_pob_choice: will be at peace
  chosen_korean: 평화를 누릴 것입니다
  alternatives_korean:
  - 평화롭게 지낼 것입니다
  - 평화로울 것입니다
  lexicon: εἰρηνεύσουσιν
  rationale: 동사형 ‘εἰρηνεύω’는 단순 상태보다 ‘평화 관계 안에 있다’는 뉘앙스를 가지므로, 한국어에서는 자연스러운 미래 표현인 ‘평화를 누릴 것입니다’로 옮겼습니다.
- source_word: σοι
  english_pob_choice: with you
  chosen_korean: 당신과
  alternatives_korean:
  - 당신에게
  - 그대와
  lexicon: σοι
  rationale: 여기서는 평화의 대상/관계 상대를 나타내므로 ‘당신과’가 POB의 ‘with you’를 가장 직접적으로 반영합니다.
