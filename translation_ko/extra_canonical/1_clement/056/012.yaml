    rationale: εἰρηνεύω + σοι는 ‘당신과 평화롭게 지내다’라는 뜻입니다. ‘평화를 누리다’는 누가 누구와 평화하는지보다 평화라는 상태를 누리는 데 초점을 둡니다.
