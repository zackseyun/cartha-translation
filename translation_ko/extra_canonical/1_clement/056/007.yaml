  source_fidelity: 그리스어는 ‘그가 쳤고, 그의 손들이 치유했다’라는 두 절의 간결한 병렬이며, ἰάσαντο의 목적어는 명시하지 않습니다. 초안의 ‘그를’은 문맥상 추정한 목적어를 본문에 보충한 것이므로 삭제해야 합니다.
  naturalness: ‘그의 손이 그를 고치셨습니다’는 무생물 주어에 높임 종결을 사용하여 현대 표준 한국어에서 문법적·문체적으로 부자연스럽습니다. 또한 ‘손’은 한국어에서 단수로도 양손을 포괄할 수 있으나, 이 짧은 대구에서는 원문의 복수 주어를 ‘손들이’로 드러내는 편이 안전합니다.
  terminology: παίω는 ‘치다’, ἰάομαι는 ‘치유하다’로 옮겼습니다. ‘치유하다’는 원문의 치료·회복 의미를 자연스럽게 보존하며, 대상은 원문처럼 밝히지 않았습니다.
