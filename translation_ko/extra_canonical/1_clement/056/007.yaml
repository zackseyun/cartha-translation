  edition: Funk 1901 (normalized OCR)
  text: ἔπαισεν, καὶ αἱ χεῖρες αὐτοῦ ἰάσαντο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/007.yaml
  text: he struck[a], and his hands healed.
  footnotes:
  - marker: a
    text: Or 'he struck, and his hands healed.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 치니, 그의 손이 그를 고치셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν
  english_pob_choice: he struck
  chosen_korean: 그가 치니
  alternatives_korean:
  - 그가 때리니
  - 그가 치고
  - 그가 치셨습니다
  lexicon: παίω
  rationale: 동작의 선행성을 간결하게 살리되, 한국어에서 결과절과 자연스럽게 이어지도록 ‘치니’로 옮겼습니다.
- source_word: αἱ χεῖρες αὐτοῦ
  english_pob_choice: his hands
  chosen_korean: 그의 손이
  alternatives_korean:
  - 그의 손들은
  - 그 손이
  lexicon: χείρ
  rationale: 복수형을 직역해 ‘손들이’로도 옮길 수 있으나, 한국어에서는 양손을 가리킬 때 단수 ‘손’이 자연스러워 의미를 보존했습니다.
- source_word: ἰάσαντο
  english_pob_choice: healed
  chosen_korean: 그를 고치셨습니다
  alternatives_korean:
  - 치유하셨습니다
  - 낫게 하셨습니다
  lexicon: ἰάομαι
  rationale: 영어 본문의 최신 수정처럼 이 동사는 타동적 의미를 가지므로, 문맥상 대상인 사람을 보충해 ‘그를 고치셨습니다’로 풀어 의미상의 모호함을 해소했습니다.
theological_decisions:
- issue: 주어와 손의 인칭 일치가 문법적으로 생기는 긴장
  chosen_reading: ‘그의 손이 그를 고치셨습니다’처럼 의인법을 살려, 손을 통해 이루어지는 행위의 힘을 보존했습니다.
  alternative_readings:
  - ‘그의 손이 그를 고쳤습니다’
  - ‘그가 치니, 그의 손이 고치셨습니다’
  rationale: 그리스어는 손을 주어로 세워 치유의 도구성을 강조하므로, 한국어에서도 그 표현을 완전히 평준화하지 않고 문맥상 허용되는 의인법을 유지했습니다.
  doctrine_reference: 문맥상 수사적 의인법에 관한 번역 원칙
- issue: 본문의 시제/상 표현
  chosen_reading: 과거 서술형으로 두되, 행위와 결과를 한 호흡으로 연결했습니다.
  alternative_readings:
  - ‘그가 치고, 그의 손이 고칩니다’
  - ‘그가 치고, 그의 손이 그를 고칩니다’
  rationale: 헬라어의 간명한 서술 구조를 따라 사건성을 유지하되, 한국어 독자가 즉시 이해할 수 있도록 현재형의 일반진술로 바꾸지 않았습니다.
  doctrine_reference: 서술문 번역의 사건성 유지
