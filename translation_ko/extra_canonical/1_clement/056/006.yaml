id: 1CLEM.56.6
reference: 1 Clement 56:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Καὶ πάλιν λέγει· Μακάριος ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος· νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου· αὐτὸς γὰρ ἀλγεῖν ποιεῖ, καὶ πάλιν ἀποκαθίστησιν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/006.yaml
  text: 'And again it says:


    “Blessed is the man whom the Lord reproves;

    and do not reject the admonition of the Almighty.

    For he causes pain[a], and then restores;'
  footnotes:
  - marker: a
    text: Or 'whom the Lord has reproved'.
    reason: previous_rendering
translation:
  language: ko
  text: 다시 말합니다. 「주께서 책망하시는 사람은 복이 있습니다. 전능하신 분의 훈계를 거절하지 마십시오. 그는 고통을 주시지만, 다시 회복시키십니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριος
  english_pob_choice: Blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복됩니다
  - 복되다
  lexicon: μακάριος
  rationale: 헌금식 축복 선언의 형식을 살리되, 현대 한국어에서 자연스럽고 품위 있는 축복 진술로 옮겼습니다.
- source_word: ἤλεγξεν ὁ κύριος
  english_pob_choice: whom the Lord reproves
  chosen_korean: 주께서 책망하시는
  alternatives_korean:
  - 주께서 책망하신
  - 주께서 꾸짖으시는
  lexicon: ἐλέγχω
  rationale: aorist ἤλεγξεν을 문맥상 일반 진리의 진술로 보아 현재형 느낌으로 옮기고, 단순한 정죄보다 교정적 의미가 있는 ‘책망하다’를 택했습니다.
- source_word: νουθέτημα δὲ παντοκράτορος
  english_pob_choice: the admonition of the Almighty
  chosen_korean: 전능하신 분의 훈계
  alternatives_korean:
  - 전능자의 권면
  - 전능하신 분의 경고
  lexicon: νουθέτημα / παντοκράτωρ
  rationale: νουθέτημα는 단순 경고보다 교훈·훈육의 뉘앙스가 있어 ‘훈계’로 옮겼고, παντοκράτωρ는 본문에서 신학적 호칭이므로 ‘전능하신 분’으로 풀었습니다.
- source_word: ἀπαναίνου
  english_pob_choice: do not reject
  chosen_korean: 거절하지 마십시오
  alternatives_korean:
  - 물리치지 마십시오
  - 받아들이지 마십시오
  lexicon: ἀπαναίνομαι
  rationale: 훈계를 외면하거나 거부하는 의미를 직접 살려, 명령형의 강도를 유지하는 ‘거절하지 마십시오’를 택했습니다.
- source_word: ἀλγεῖν ποιεῖ ... ἀποκαθίστησιν
  english_pob_choice: he causes pain, and then restores
  chosen_korean: 고통을 주시지만, 다시 회복시키십니다
  alternatives_korean:
  - 아프게 하시지만, 다시 회복시키십니다
  - 상처를 내시지만, 다시 세우십니다
  lexicon: ἀλγεῖν / ἀποκαθίστημι
  rationale: 원문의 병행을 살려 ‘고통을 주다’와 ‘회복시키다’로 대응시켰고, 끝의 πάλιν은 중복을 피하면서도 ‘다시’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: ‘전능하신 분’의 호칭 처리
  chosen_reading: παντοκράτωρ를 ‘전능하신 분’으로 옮겨, 호칭성을 유지하되 한국어 문맥에서 자연스럽게 표현했습니다.
  alternative_readings:
  - 전능자
  - 만군의 주
  rationale: 이 구절은 욥 5:17의 인용으로, 호칭을 고유명처럼 고정하기보다 서술적 칭호로 풀어 옮기는 편이 본문의 음성에 가깝습니다.
  doctrine_reference: Job 5:17 quotation; divine epithet usage
