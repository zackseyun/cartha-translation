review_pass:
  verdict: revise
  source_fidelity: 첫 절은 εἶτα γνώσῃ와 ὁ οἶκος ... εἰρηνεύσει를 충실히 전달합니다. 그러나 ‘당신의 처소’는 τῆς σκηνῆς σου(‘당신의 장막’)를 생략하므로, 장막 이미지를 본문에 보존하는 편이 안전합니다. δεύτε 절의 ‘살펴보고 아무것도 빠뜨리지 않다’는 οὐ μὴ ἁμάρτῃ의 문맥상 ‘놓치지 않다’라는 뜻을 자연스럽게 반영합니다.
  naturalness: ‘그러면 당신의 집이 평안할 것을 알게 될 것이며, 당신의 장막을 살펴보아도 아무것도 빠뜨리지 않을 것입니다’는 현대 표준어 합쇼체에 자연스럽습니다. ‘평강’보다 ‘평안’이 이 문맥에서 일반적이며, 반복된 ‘당신은’을 줄여 문장이 매끄럽습니다.
  terminology: οἶκος는 ‘집’, σκηνή는 ‘장막’으로 구별해 공간적 평행과 원문의 장막 이미지를 보존했습니다. ἁμαρτάνω는 이 문맥에서 죄를 짓는다는 뜻보다 ‘빗나가다/놓치다’의 관용적 의미이므로 ‘아무것도 빠뜨리지 않다’가 적절합니다.
  issues:
  - severity: medium
    issue: τῆς σκηνῆς σου의 ‘장막’이 본문에서 탈락함
    rationale: ‘당신의 처소’는 δίαιτα의 거주지 의미는 일부 전달하지만, 속격으로 명시된 σκηνή(장막)를 보존하지 않습니다. 원문의 구체적 이미지와 οἶκος/σκηνή의 평행을 유지해야 합니다.
  revised_text: 그러면 당신의 집이 평안할 것을 알게 될 것이며, 당신의 장막을 살펴보아도 아무것도 빠뜨리지 않을 것입니다.[a]
