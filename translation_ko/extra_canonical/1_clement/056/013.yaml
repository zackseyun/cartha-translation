  text: εἶτα γνώσῃ, ὅτι εἰρηνεύσει σου ὁ οἶκος, ἡ δὲ δίαιτα τῆς σκηνῆς σου οὐ μὴ ἁμάρτῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/013.yaml
  text: 'Then you will know that your house will be at peace,

    and you will inspect your dwelling and not miss anything[a].'
  footnotes:
  - marker: a
    text: Or 'and the condition of your tent will certainly not go wrong.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 당신의 집이 평안할 것을 알게 될 것이며, 당신의 장막을 살펴보아도 아무것도 빠뜨리지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘당신의 장막의 거처는 결코 빗나가지 않을 것입니다.’
    reason: δίαιτα τῆς σκηνῆς σου의 문자적 ‘장막의 거처’ 표현과 οὐ μὴ ἁμάρτῃ의 강한 부정을 보존하면서, 본문의 자연스러운 관용적 번역(‘살펴보아도 아무것도 빠뜨리지 않다’)을 보완합니다.
lexical_decisions:
- source_word: εἶτα γνώσῃ
  english_pob_choice: Then you will know
  chosen_korean: 그러면 당신은 ... 알게 될 것입니다
  alternatives_korean:
  - 그때 당신은 ... 알게 됩니다
  - 그리하여 당신은 ... 알게 될 것입니다
  lexicon: γινώσκω
  rationale: εἶτα는 앞선 말에 이어지는 결과를 표시하므로 ‘그러면’으로 자연스럽게 살렸고, γνώσῃ는 단순 추측이 아니라 확실히 깨닫는 의미로 ‘알게 될 것입니다’로 옮겼습니다.
- source_word: ὁ οἶκος
  english_pob_choice: your house
  chosen_korean: 당신의 집
  alternatives_korean:
  - 당신의 가정
  - 당신의 집안
  lexicon: οἶκος
  rationale: οἶκος는 여기서 물리적 ‘집’과 가정 전체를 아우를 수 있지만, 앞뒤의 평행 구조상 가장 직접적인 공간적 의미인 ‘집’이 적절합니다.
- source_word: δίαιτα τῆς σκηνῆς σου
  english_pob_choice: your dwelling
  chosen_korean: 당신의 처소
  alternatives_korean:
  - 당신의 거처
  - 당신의 장막의 처소
  - 당신의 텐트의 거처
  lexicon: δίαιτα
  rationale: δίαιτα는 ‘조건’이 아니라 거주 공간을 뜻하므로, οἶκος와의 평행을 살려 ‘처소’로 옮겼습니다. σκηνή의 ‘장막/천막’ 이미지는 원문에 있으나 한국어에서는 중복을 피하고 의미 중심으로 간결하게 처리했습니다.
- source_word: οὐ μὴ ἁμάρτῃ
  english_pob_choice: and not miss anything
  chosen_korean: 아무것도 빠뜨리지 않을 것입니다
  alternatives_korean:
  - 결코 빗나가지 않을 것입니다
  - 틀림없이 실패하지 않을 것입니다
  - 하나도 놓치지 않을 것입니다
  lexicon: ἁμαρτάνω
  rationale: οὐ μὴ + 접속법은 강한 부정이므로 확정적 표현으로 옮겼고, 여기서는 ‘죄를 짓다’보다 ‘빠뜨리다/놓치다’가 문맥에 맞아 ‘아무것도 빠뜨리지 않을 것입니다’로 번역했습니다.
theological_decisions:
- issue: Job 5:24의 인용문에서 ‘집’과 ‘장막의 처소’의 평행
  chosen_reading: 문자적 공간 평행을 유지하여 집과 처소를 함께 제시했습니다.
  alternative_readings:
  - ‘가정’과 ‘삶의 형편’으로 의역하는 방식
  - ‘집’과 ‘장막의 상태’로 해석하는 방식
  rationale: 이 구절은 LXX 욥기 5:24의 인용으로 보이며, δίαιτα를 추상적 ‘조건’으로 만들기보다 공간적 평행을 살려야 원문 의도가 드러납니다.
  doctrine_reference: LXX quotation / intertextual fidelity
