revisions:
- from: 그러면 당신은 당신의 집에 평강이 있을 것을 알게 될 것이며, 당신은 당신의 처소를 살펴보고 아무것도 빠뜨리지 않을 것입니다.[a]
  to: 그러면 당신의 집이 평안할 것을 알게 될 것이며, 당신의 장막을 살펴보아도 아무것도 빠뜨리지 않을 것입니다.[a]
  rationale: 원문의 장막(σκηνή)을 본문에 회복하고, 자연스러운 한국어를 위해 둘째 절의 함축된 관용적 의미는 유지했습니다. 각주에는 δίαιτα와 ἁμαρτάνω의 보다 문자적인 표현을 제시하여 해석상의 긴장을 투명하게 드러냈습니다.
