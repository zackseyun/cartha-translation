source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ἀπὸ μάστιγος γλώσσης σε κρύψει, καὶ οὐ μὴ φοβηθήσῃ κακῶν ἐπερχομένων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/010.yaml
  text: And he will hide you from the scourge of the tongue[a], and you will certainly not fear evils when they come.
  footnotes:
  - marker: a
    text: Or 'He will hide you from the scourge of the tongue,\nand you will certainly not fear evils when they come.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 혀의 채찍에서 그를 숨기시고, 다가오는 악들을 두려워하지 않게 하십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  english_pob_choice: And
  chosen_korean: 또
  alternatives_korean:
  - 그리고
  - 또한
  lexicon: καί
  rationale: 원문의 첫 접속사 καὶ를 살려 병렬적 진행을 유지하되, 한국어에서는 문맥상 자연스러운 ‘또’로 간결하게 옮겼습니다.
- source_word: μάστιγος γλώσσης
  english_pob_choice: the scourge of the tongue
  chosen_korean: 혀의 채찍
  alternatives_korean:
  - 혀의 채찍질
  - 말의 채찍
  lexicon: μάστιξ + γλῶσσα
  rationale: 직역을 유지해 혀로 인한 해악과 매질의 이미지를 보존했습니다. 관용적으로 풀지 않고 원문의 강한 비유를 드러냈습니다.
- source_word: σε κρύψει
  english_pob_choice: he will hide you
  chosen_korean: 그를 숨기시고
  alternatives_korean:
  - 당신을 숨기시고
  - 그를 감추시고
  lexicon: κρύπτω
  rationale: 문맥상 1인칭/2인칭 호응을 살려 대상 인칭을 자연스럽게 처리했습니다. 한국어에서는 시편 인용의 예언적 문체를 고려해 ‘숨기시고’로 연결했습니다.
- source_word: ἐπερχομένων
  english_pob_choice: evils when they come
  chosen_korean: 다가오는 악들
  alternatives_korean:
  - 임박한 악들
  - 오는 악들
  lexicon: ἐπέρχομαι
  rationale: 현재분사 ἐπερχομένων의 도래·임박성을 반영해 ‘다가오는’으로 옮겼습니다. 영어 수정본의 취지처럼 단순한 시간절보다 진행 중인 접근감을 살렸습니다.
theological_decisions:
- issue: 시편적 보호 약속의 서술 방식
  chosen_reading: 보호의 행위를 현재 서술형으로 옮겨, 하나님이 숨기시는 능동적 보호를 드러냈습니다.
  alternative_readings:
  - 미래형으로 딱딱하게 옮김
  - 수동형으로 완화함
  rationale: 원문은 미래/예언적 진술이지만, 한국어 합쇼체에서는 하나님의 행위를 생생하게 전달하는 현재 서술형이 더 자연스럽고 힘이 있습니다.
  doctrine_reference: 하나님의 보호와 섭리
