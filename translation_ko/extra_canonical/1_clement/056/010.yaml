  to: 또 그분은 혀의 채찍으로부터 당신을 숨기실 것이며, 당신은 다가오는 재앙들을 결코 두려워하지 않을 것입니다.
  rationale: 인칭 오류와 미래 시제를 바로잡고, 원문의 접속 및 강한 부정을 보존했습니다. 초안의 각주 표지는 번역 내용에 실질적 정보를 더하지 않는 영어 이전 번역 관련 표지이므로 한국어 본문에서는 제거했습니다.
