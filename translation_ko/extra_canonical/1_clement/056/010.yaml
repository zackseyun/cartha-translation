review_pass:
  verdict: revise
  source_fidelity: 원문의 목적어 σε는 2인칭 단수 ‘당신을’인데, 초안의 ‘그를’은 인칭을 바꾸어 잘못 옮겼습니다. 또한 κρύψει와 φοβηθήσῃ는 미래형이므로 현재형 ‘숨기시고 … 하십니다’보다 미래의 약속으로 옮기는 것이 정확합니다. καὶ와 οὐ μή의 강한 부정은 각각 ‘또’와 ‘결코’로 보존했습니다.
  naturalness: ‘혀의 채찍’은 원문의 강한 비유를 자연스럽게 유지합니다. 다만 두 절의 주체가 각각 하나님(암시됨)과 수신자임을 한국어에서 분명히 하여, 하나님이 재앙을 두려워하지 않는다는 식의 오독을 피했습니다. ‘다가오는 재앙들’은 κακῶν ἐπερχομένων의 문맥상 자연스럽고 현재분사의 접근 의미를 살립니다.
  terminology: μάστιγος γλώσσης는 ‘혀의 채찍’으로 유지했습니다. κακά는 이 문맥에서 도덕적 ‘악’보다 닥쳐오는 해악·재난을 뜻하므로 ‘재앙들’로 옮겼습니다. 불필요한 교리적 해석은 추가하지 않았습니다.
  issues:
  - severity: high
    issue: σε를 ‘그를’로 번역함
    rationale: 그리스어 σε는 2인칭 목적격이므로 ‘당신을’이어야 합니다.
  - severity: medium
    issue: 미래형 동사를 현재형 및 사역 구문으로 변경함
    rationale: κρύψει와 φοβηθήσῃ는 미래의 진술입니다. ‘숨기실 것이며 … 두려워하지 않을 것입니다’가 시제와 구문을 더 직접적으로 반영합니다.
  - severity: low
    issue: ‘악들’의 어색한 한국어 결합
    rationale: 임박하여 닥치는 κακά에는 ‘재앙들’이 현대 한국어에서 더 자연스럽고 문맥에 맞습니다.
  revised_text: 또 그분은 혀의 채찍으로부터 당신을 숨기실 것이며, 당신은 다가오는 재앙들을 결코 두려워하지 않을 것입니다.
