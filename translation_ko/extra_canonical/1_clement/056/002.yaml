  to: 사랑하는 여러분, 징계를 받아들입시다. 아무도 그 때문에 분개해서는 안 됩니다. 우리가 서로에게 하는 권면은 좋고 매우 유익합니다. 그것이 우리를 하나님의 뜻에 붙게 하기 때문입니다.[a][b]
