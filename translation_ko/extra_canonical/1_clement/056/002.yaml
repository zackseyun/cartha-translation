  source_fidelity: 전체적으로 헬라어의 권고 구조와 의미를 잘 반영합니다. 다만 ἐφ’ ᾗ는 ‘징계를 두고/그 때문에’라는 뜻이므로 ‘그 징계에 대해’보다 ‘그 때문에’가 자연스럽고 정확합니다. 또한 κολλᾷ는 ‘묶어 주다’도 가능하나, 하나님의 뜻에 ‘붙게/밀착하게’ 한다는 동사를 더 직접적으로 살릴 수 있습니다.
  naturalness: 합쇼체는 대체로 적절합니다. 그러나 ‘아무도 분개해서는 안 됩니다, 사랑하는 여러분’은 호격의 위치가 다소 어색하며, ‘사랑하는 여러분, 아무도 그 때문에 분개해서는 안 됩니다’가 더 자연스럽습니다. ‘선하며’는 현대 문장에서는 ‘좋고’가 자연스럽습니다.
  terminology: παιδεία는 이 문맥에서 교정과 훈련을 포함하므로 ‘징계’는 가능하고 유지할 수 있습니다. νουθέτησις의 ‘권면’도 적절합니다. 다만 κολλάω의 결속 이미지는 ‘하나님의 뜻에 붙게 합니다’로 더 직접적으로 나타낼 수 있습니다.
