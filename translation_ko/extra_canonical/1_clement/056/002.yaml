  text: ἀναλάβωμεν παιδείαν, ἐφ’ ᾗ οὐδεὶς ὀφείλει ἀγανακτεῖν, ἀγαπητοί. ἡ νουθέτησις, ἣν ποιούμεθα εἰς ἀλλήλους, καλὴ ἐστιν καὶ ὑπεράγαν ὠφέλιμος· κολλᾷ γὰρ ἡμᾶς τῷ θελήματι τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/002.yaml
  text: Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God.
translation:
  language: ko
  text: 사랑하는 여러분, 징계를 받아들입시다. 아무도 그 때문에 분개해서는 안 됩니다. 우리가 서로에게 하는 권면은 좋고 매우 유익합니다. 그것이 우리를 하나님의 뜻에 붙게 하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘징계’(παιδεία)는 처벌만이 아니라 교정과 훈련을 포함할 수 있습니다.
    reason: 핵심 용어의 의미 범위를 밝혀 ‘징계’를 순수한 처벌로만 이해하지 않도록 돕습니다.
  - marker: b
    text: ‘하나님의 뜻에 붙게 하다’는 원문의 ‘붙이다, 밀착시키다’라는 표현을 따른 것입니다.
    reason: κολλάω의 비유적 결속 이미지를 설명합니다.
lexical_decisions:
- source_word: παιδείαν
  english_pob_choice: discipline
  chosen_korean: 징계
  alternatives_korean:
  - 훈련
  - 교육
  lexicon: paideia
  rationale: 여기서는 단순한 교육보다 교정과 단련을 포함하는 의미가 강하므로, POB의 'discipline'에 맞춰 '징계'로 옮겼습니다.
- source_word: ἀγανακτεῖν
  english_pob_choice: be resentful
  chosen_korean: 분개하다
  alternatives_korean:
  - 원망하다
  - 화를 내다
  lexicon: aganakteō
  rationale: 문맥상 징계에 대해 마음속으로 못마땅해하며 반발하는 태도를 가리키므로, 감정의 뉘앙스를 살려 '분개하다'로 옮겼습니다.
- source_word: νουθέτησις
  english_pob_choice: admonition
  chosen_korean: 권면
  alternatives_korean:
  - 훈계
  - 경고
  lexicon: nouthēsis
  rationale: 서로에게 주는 권고와 교정의 말을 가리키므로, 한국어 교회 문맥에서 비교적 직접적인 '권면'을 택했습니다.
- source_word: κολλᾷ ... τῷ θελήματι τοῦ θεοῦ
  english_pob_choice: it binds us to the will of God
  chosen_korean: 우리를 하나님의 뜻에 묶어 줍니다
  alternatives_korean:
  - 우리를 하나님의 뜻에 결속시킵니다
  - 우리를 하나님의 뜻에 붙들어 둡니다
  lexicon: kollaō + thelēma theou
  rationale: κολλάω의 '붙이다/달라붙게 하다'라는 이미지를 살려 '묶어 주다'로 옮겨, 단순한 연결이 아니라 결속의 힘을 드러냈습니다.
theological_decisions:
- issue: 권면과 징계의 공동체적 기능
  chosen_reading: 징계와 상호 권면은 공동체를 하나님의 뜻에 더 깊이 결속시키는 선한 수단으로 제시됩니다.
  alternative_readings:
  - 징계를 개인적 수양으로 좁게 읽는 해석
  - 권면을 단순한 도덕 훈계로 약화시키는 해석
  rationale: 본문은 개인 감정 조절이 아니라 공동체 안에서 받는 징계와 서로 주는 권면의 유익을 함께 말하며, 그 결과를 하나님의 뜻에 대한 결속으로 설명합니다.
  doctrine_reference: 교회론/성화
