  to: 여섯 번은 그분이 당신을 환난에서 건져 주시고, 일곱째에는 악이 당신에게 닿지 않을 것입니다.
  rationale: 미래 부정의 의미와 ‘닿다’라는 원문의 이미지를 더 직접적으로 살리도록 마지막 절만 안전하게 조정했습니다. 그 밖의 수량 표현, 환난의 복수적 의미, 공손한 문체는 유지했습니다.
