review_pass:
  verdict: revise
  source_fidelity: 원문의 수량 대조(‘여섯 번’/‘일곱째’)와 ‘환난들에서 건져 내다’는 잘 반영되었습니다. 다만 οὐχ ἅψεταί σου κακόν은 ‘악이 당신을 건드리지 못할 것입니다’보다 단순 미래 부정인 ‘악이 당신에게 닿지 않을 것입니다’가 ἅπτομαι의 접촉 이미지와 미래 진술을 더 정확히 보존합니다. ‘못하다’는 원문에 없는 능력·가능의 뉘앙스를 더할 수 있습니다.
  naturalness: ‘당신에게 닿지 않을 것입니다’는 현대 한국어에서 자연스럽고, 공적 성경 문체의 합쇼체에도 맞습니다. ‘그분이’ 및 ‘당신’은 원문의 암시된 주어와 명시된 2인칭을 드러내는 현 초안의 문체적 선택으로 유지할 수 있습니다.
  terminology: ‘환난’은 ἀνάγκαι의 곤경·압박이라는 뜻을 적절히 포괄하며, ‘악’은 κακόν의 폭넓은 의미를 유지합니다. ‘닿다’는 ἅπτομαι의 비유적 접촉 표현을 보존합니다.
  issues:
  - severity: low
    issue: ‘건드리지 못할 것입니다’의 양태
    rationale: οὐχ ἅψεταί는 ‘닿지 않을 것이다’라는 미래 부정이며, ‘못하다’는 능력 또는 저지의 의미를 보탤 수 있습니다.
  revised_text: 여섯 번은 그분이 당신을 환난에서 건져 주시고, 일곱째에는 악이 당신에게 닿지 않을 것입니다.
