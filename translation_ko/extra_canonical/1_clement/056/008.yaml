id: 1CLEM.56.8
reference: 1 Clement 56:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἑξάκις ἐξ ἀναγκῶν ἐξελεῖταί σε, ἐν δὲ τῷ ἑβδόμῳ οὐχ ἅψεταί σου κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/008.yaml
  text: 'Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.'
translation:
  language: ko
  text: 여섯 번은 그분이 당신을 환난에서 건져 주시고, 일곱째에는 악이 당신을 건드리지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑξάκις
  english_pob_choice: Six times
  chosen_korean: 여섯 번은
  alternatives_korean:
  - 여섯 차례는
  - 여섯 번이나
  lexicon: ἀριθμη 표현
  rationale: 횟수를 단순하고 직접적으로 살려 원문의 반복적 수량을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐξ ἀναγκῶν
  english_pob_choice: from distresses
  chosen_korean: 환난에서
  alternatives_korean:
  - 고통에서
  - 곤궁에서
  - 궁핍에서
  lexicon: ἀνάγκη
  rationale: ἀνάγκῶν은 압박·곤경·위기의 상태를 가리키므로, 너무 일상적이거나 경제적 뉘앙스가 강한 표현보다 포괄적인 ‘환난’이 원문과 가장 가깝습니다.
- source_word: ἐξελεῖταί σε
  english_pob_choice: he will deliver you
  chosen_korean: 그분이 당신을 건져 주시고
  alternatives_korean:
  - 그분이 당신을 구해 주시고
  - 그분이 당신을 구출해 주시고
  lexicon: ἐξαιρέω
  rationale: ἐξαιρέω는 단순한 도움보다 ‘위험한 상황에서 건져 내다/구출하다’의 뜻이 강하므로 ‘건져 주시고’로 옮겼습니다.
- source_word: οὐχ ἅψεταί σου κακόν
  english_pob_choice: no evil will touch you
  chosen_korean: 악이 당신을 건드리지 못할 것입니다
  alternatives_korean:
  - 악이 당신에게 닿지 못할 것입니다
  - 악이 당신을 해치지 못할 것입니다
  lexicon: ἅπτομαι + κακόν
  rationale: ἅπτομαι는 ‘닿다, 손대다, 접촉하다’의 물리적 이미지를 지니므로, 결과만 풀어쓴 ‘해치다’보다 ‘건드리다’가 원문 이미지를 더 잘 보존합니다.
theological_decisions:
- issue: 인칭 대명사와 직접 호칭이 없는 문장 구조
  chosen_reading: 원문에 명시된 2인칭 대상(σε, σου)을 살려 ‘당신’을 사용했습니다.
  alternative_readings:
  - 너를/네게
  rationale: 문맥은 권면적 인용이지만 현대 합쇼체 본문에서는 공손한 2인칭 ‘당신’이 가장 무난하게 원문 대상성을 보존합니다.
  doctrine_reference: 문체/화용
