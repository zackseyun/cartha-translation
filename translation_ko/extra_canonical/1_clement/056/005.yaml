id: 1CLEM.56.5
reference: 1 Clement 56:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Παιδεύσει με γάρ, φησίν, δίκαιος ἐν ἐλέει καὶ ἐλέγξει με, ἔλαιον δὲ ἁμαρτωλῶν μὴ λιπανάτω τὴν κεφαλήν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/005.yaml
  text: '“For,” it says[a], “a righteous person will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”'
  footnotes:
  - marker: a
    text: Or 'the righteous one'.
    reason: previous_rendering
translation:
  language: ko
  text: “이는,” 그가 말합니다, “의로운 사람은 나를 사랑으로 징계하고 나를 책망할 것이지만, 죄인들의 기름이 내 머리에 붓지 않게 하십시오.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  english_pob_choice: a righteous person
  chosen_korean: 의로운 사람
  alternatives_korean:
  - 의인
  - 그 의로운 이
  - 의로운 자
  lexicon: δίκαιος
  rationale: 관사 없는 δίκαιος를 특정 인물로 좁히지 않고 보통명사적으로 살려, 문맥상 일반적인 ‘의로운 사람’으로 옮겼습니다.
- source_word: Παιδεύσει
  english_pob_choice: will discipline
  chosen_korean: 징계하고
  alternatives_korean:
  - 훈계하고
  - 교정하고
  - 가르치고 바로잡고
  lexicon: παιδεύω
  rationale: 단순한 훈육보다 권면과 교정을 포함하는 의미를 살려 ‘징계하다’를 택했습니다.
- source_word: ἐν ἐλέει
  english_pob_choice: in mercy
  chosen_korean: 사랑으로
  alternatives_korean:
  - 긍휼로
  - 자비로
  - 은혜로
  lexicon: ἔλεος
  rationale: 문맥상 책망이 냉혹한 처벌이 아니라 자비로운 교정임을 드러내기 위해 ‘사랑으로’로 자연스럽게 풀었습니다.
- source_word: ἔλαιον δὲ ἁμαρτωλῶν μὴ λιπανάτω τὴν κεφαλήν μου
  english_pob_choice: let not the oil of sinners anoint my head
  chosen_korean: 죄인들의 기름이 내 머리에 붓지 않게 하십시오
  alternatives_korean:
  - 죄인들의 기름이 내 머리를 윤택하게 하지 않게 하십시오
  - 죄인들의 기름이 내 머리를 적시지 않게 하십시오
  lexicon: λιπανάω
  rationale: 기름을 머리에 ‘바르다/붓다’는 직접적 동작을 살리되, 시적 표현을 현대 한국어로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 지시 대상인 ‘의로운 사람’의 일반성
  chosen_reading: 시편 인용을 특정한 메시아적 인물로 한정하지 않고, 공동체 안에서 서로를 바로잡는 ‘의로운 사람’으로 읽었습니다.
  alternative_readings:
  - ‘그 의로운 이’처럼 특정 인물을 암시하는 읽기
  - 메시아적 예표로 보는 읽기
  rationale: 영어 POB 수정안과 문맥(서로 권면함)을 따라, 관사 없는 δίκαιος의 일반적 의미를 유지하는 편이 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 교회 징계와 형제적 권면
