    issue: ἐν ἐλέει를 ‘사랑으로’로 번역함
    rationale: ἔλεος의 기본 의미인 자비·긍휼을 ‘사랑’으로 바꾸면 원문의 어휘적 의미가 넓어집니다.
  - severity: low
    issue: 인용 도입부 ‘이는, 그가 말합니다’가 부자연스럽고 지시 대상을 특정함
    rationale: φησίν은 여기서 ‘말합니다’라는 인용 표지이며, ‘그가’는 원문에 없는 남성 지시 대상을 첨가합니다.
  - severity: medium
