revisions:
- from: “이는,” 그가 말합니다, “의로운 사람은 나를 사랑으로 징계하고 나를 책망할 것이지만, 죄인들의 기름이 내 머리에 붓지 않게 하십시오.”[a]
  to: “의로운 사람이 자비로 나를 징계하고 나를 책망할 것입니다. 그러나 죄인들의 기름이 내 머리에 발리지 않게 하소서.”라고 말합니다.[a]
  rationale: 원문의 어휘와 통사적 뉘앙스를 보존하면서 현대 한국어 합쇼체 인용 문장으로 다듬었습니다. 특히 ἔλεος를 ‘자비’로, 기름을 머리에 바르는 제3인칭 명령을 ‘발리지 않게 하소서’로 옮겼습니다. δίκαιος의 일반성은 본문과 각주 모두에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:52Z'
review_pass:
  verdict: revise
  source_fidelity: ‘사랑으로’는 ἐν ἐλέει(‘자비/긍휼로’)보다 해석적으로 넓으므로 ‘자비로’로 바로잡아야 합니다. λιπανάτω는 기름을 머리에 바르는 행위를 뜻하며, 제3인칭 명령의 기원/청원적 뉘앙스는 ‘…발리지 않게 하소서’로 자연스럽게 보존됩니다. 관사 없는 δίκαιος를 ‘의로운 사람’으로 옮긴 것은 적절합니다.
  naturalness: 초안의 ‘이는, 그가 말합니다’는 현대 한국어 인용 도입으로 다소 부자연스럽고, ‘그가’는 비인칭적인 φησίν을 불필요하게 남성 인물로 특정합니다. 인용문 뒤에 ‘라고 말합니다’를 두는 편이 자연스럽습니다.
  terminology: ‘의로운 사람’, ‘징계하다’, ‘책망하다’는 문맥과 용례에 적합합니다. ἔλεος는 여기서 ‘사랑’보다 ‘자비’가 정확합니다. 영어 감사 기록의 대안 독법을 반영하는 각주도 한국어로 제공해야 합니다.
  issues:
