base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/016.yaml
  text: See, beloved, how great a defense there is for those who are disciplined by the Master. For, being a good Father, he disciplines us so that we may receive mercy through his holy discipline.
translation:
  language: ko
  text: 사랑하는 이들이여, 주인께 징계를 받는 사람들에게 얼마나 큰 옹호가 있는지 보십시오. 그분은 선한 아버지이시므로, 우리가 그분의 거룩한 징계를 통하여 긍휼을 입도록 우리를 징계하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερασπισμός
  english_pob_choice: defense
  chosen_korean: 변호
  alternatives_korean:
  - 옹호
  - 방어
  - 보호
  lexicon: ὑπερασπισμός
  rationale: POB의 revised English가 defense로 확정했으므로, 단순한 보호보다 법정적·변론적 뉘앙스가 살아 있는 ‘변호’를 택했습니다.
- source_word: τοῖς παιδευομένοις ὑπὸ τοῦ δεσπότου
  english_pob_choice: those who are disciplined by the Master
  chosen_korean: 주인에게서 징계를 받는 이들
  alternatives_korean:
  - 주께 징계를 받는 이들
  - 주인에게 훈련을 받는 이들
  - 주님께 징계를 받는 이들
  lexicon: παιδεύω / δεσπότης
  rationale: δεσπότης는 여기서 ‘주인’이 가장 직접적이며, παιδεύομαι는 훈련보다 징계의 고통과 교육적 목적을 함께 담는 ‘징계를 받다’가 원문의 긴장을 잘 드러냅니다.
- source_word: ὁσία παιδείας
  english_pob_choice: his holy discipline
  chosen_korean: 거룩한 징계
  alternatives_korean:
  - 거룩한 훈련
  - 거룩한 교육
  - 거룩한 훈계
  lexicon: ὅσιος / παιδεία
  rationale: ὁσία는 단순한 도덕적 선함보다 하나님께 속한 거룩함의 성격을 가지므로 ‘거룩한’으로, παιδεία는 문맥상 훈련보다 징계가 더 적절합니다.
theological_decisions:
- issue: 하나님을 아버지이자 징계하시는 분으로 제시하는 표현
  chosen_reading: 선한 아버지이시기에 징계는 사랑의 행동으로 제시되며, 목표는 긍휼을 얻게 하는 데 있습니다.
  alternative_readings:
  - 징계 자체를 처벌로만 읽는 해석
  - 훈련만 강조해 징계의 엄중함을 약화하는 해석
  rationale: 본문은 아버지의 선하심과 징계의 목적을 함께 묶어, 고난을 통한 교육이 아니라 긍휼을 향한 징계를 말합니다.
  doctrine_reference: 히브리서 12장 징계의 신학; 1 Clement의 권면적 목회 문맥
