review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 πόσος ὑπερασπισμός ἐστιν은 의문문이라기보다 감탄을 동반한 권면(‘얼마나 큰 …이 있는지 보십시오’)이며, ‘주인에게서’는 행위자를 나타내는 표현으로 다소 부자연스럽습니다. ἐλεηθῆναι는 ‘긍휼을 받다’보다 문어적 성경 문맥에서 ‘긍휼을 입다’가 더 자연스럽고 정확합니다.
  naturalness: ‘얼마나 큰 변호가 있습니까’는 한국어에서 법률상의 변호인을 강하게 연상시키며, 문맥상 다소 어색한 직접 의문문입니다. ‘얼마나 큰 옹호가 있는지 보십시오’로 바꾸면 ὑπερασπισμός의 방어·옹호 의미를 보존하면서도 자연스럽습니다. ‘주인께 징계를 받는 사람들’도 현대 표준어 합쇼체 문맥에 더 매끄럽습니다.
  terminology: δεσπότης는 원문의 ‘주인’을 유지하되 높임 조사 ‘께’를 사용했습니다. παιδεύω/παιδεία는 반복되는 교육적 징계의 뜻을 살려 ‘징계하다/징계’로 일관되게 옮겼습니다. ὅσια는 ‘거룩한’, ἐλεηθῆναι는 ‘긍휼을 입도록’으로 번역했습니다. ὑπερασπισμός은 단순한 물리적 보호로 축소하지 않고 ‘옹호’로 옮겼습니다.
