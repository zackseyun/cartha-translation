source:
  edition: Funk 1901 (normalized OCR)
  text: γνώσῃ δέ, ὅτι πολὺ τὸ σπέρμα σου, τὰ δὲ τέκνα σου ὥσπερ τὸ παμβότανον τοῦ ἀγροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/014.yaml
  text: 'And you will know that your offspring will be many,

    and your children like the abundant grass of the field[a].'
  footnotes:
  - marker: a
    text: Or 'your seed will be many'.
    reason: previous_rendering
translation:
  language: ko
  text: 또한 당신은 당신의 후손[a]이 많고 당신의 자녀들이 들판의 무성한 풀과 같다는 것을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 씨가 매우 많을 것입니다.”
    reason: σπέρμα의 문자적 표현인 ‘씨’를 보존하는 대안 역문입니다. 본문은 한국어에서 더 명확한 문맥상 의미인 ‘후손’을 사용합니다.
lexical_decisions:
- source_word: γνώσῃ δέ
  english_pob_choice: And you will know that
  chosen_korean: 그러면 … 알게 될 것입니다
  alternatives_korean:
  - 그리고 … 알게 됩니다
  - 그러므로 … 알게 될 것입니다
  lexicon: γινώσκω
  rationale: 미래 인식의 결과를 자연스러운 한국어로 풀어, 단순한 접속보다 ‘그때 알게 됨’의 뉘앙스를 살렸습니다.
- source_word: πολὺ τὸ σπέρμα σου
  english_pob_choice: your offspring will be many
  chosen_korean: 당신의 씨가 매우 많고
  alternatives_korean:
  - 당신의 후손이 많고
  - 당신의 씨가 많을 것이고
  lexicon: σπέρμα
  rationale: POB의 개정된 ‘offspring’ 취지를 반영하되, 원문 이미지인 ‘씨’도 유지해 후손의 다산을 직접적으로 드러냈습니다.
- source_word: τὰ δὲ τέκνα σου
  english_pob_choice: and your children
  chosen_korean: 당신의 자녀들은
  alternatives_korean:
  - 당신의 아이들은
  - 당신의 자식들은
  lexicon: τέκνον
  rationale: 문맥상 직계 자녀를 가리키므로 가장 무난하고 현대적인 ‘자녀’로 옮겼습니다.
- source_word: ὥσπερ τὸ παμβότανον τοῦ ἀγροῦ
  english_pob_choice: like the abundant grass of the field
  chosen_korean: 들판의 무성한 풀같이
  alternatives_korean:
  - 들의 넉넉한 풀같이
  - 밭의 풍성한 풀처럼
  lexicon: παμβότανον
  rationale: 희귀한 형용적 표현을 과장 없이 자연스럽게 옮기되, ‘무성한’으로 풍부함과 번성을 살렸습니다.
theological_decisions:
- issue: σπέρμα를 ‘씨’로 유지할지 ‘후손/자손’으로 완화할지
  chosen_reading: ‘씨’와 ‘자녀들’을 함께 두어 원문이 가진 생물학적-상징적 중첩을 보존했습니다.
  alternative_readings:
  - ‘후손’으로만 통일
  - ‘자손’으로만 통일
  rationale: 원문은 σπέρμα와 τέκνα를 나란히 두어 같은 번성 약속을 다른 각도에서 반복하므로, 한국어에서도 이미지를 지우지 않는 방식이 더 충실합니다.
  doctrine_reference: 문맥상 번성 약속의 반복 표현
