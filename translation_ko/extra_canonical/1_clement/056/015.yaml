id: 1CLEM.56.15
reference: 1 Clement 56:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐλεύσῃ δὲ ἐν τάφῳ ὥσπερ σῖτος ὥριμος κατὰ καιρὸν θεριζόμενος, ἢ ὥσπερ θημωνιὰ ἅλωνος καθ’ ὥραν συγκομισθεῖσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/015.yaml
  text: 'And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time[a].'
  footnotes:
  - marker: a
    text: Or 'time.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런데 너는 제때에 거둬지는 익은 곡식처럼, 또는 제때에 타작마당에서 거둬들여진 타작마당의 더미처럼 무덤으로 오게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσῃ
  english_pob_choice: you will come
  chosen_korean: 오게 될 것입니다
  alternatives_korean:
  - 오십니다
  - 오실 것입니다
  - 다가오게 될 것입니다
  lexicon: ἔρχομαι
  rationale: 미래의 도착을 자연스럽게 옮기되, 원문의 단순한 ‘오다’ 의미를 유지했습니다.
- source_word: ἐν τάφῳ
  english_pob_choice: to the grave
  chosen_korean: 무덤으로
  alternatives_korean:
  - 무덤에
  - 무덤 속으로
  - 무덤 가운데
  lexicon: τάφος
  rationale: 전치사 ἐν이 장소적 귀착을 나타내는 문맥이므로 한국어에서는 도착 방향을 드러내는 조사로 자연스럽게 옮겼습니다.
- source_word: σῖτος ὥριμος κατὰ καιρὸν θεριζόμενος
  english_pob_choice: ripe grain harvested in its season
  chosen_korean: 제때에 거둬지는 익은 곡식
  alternatives_korean:
  - 철에 거둬지는 익은 곡식
  - 때가 되어 수확되는 익은 곡식
  lexicon: σῖτος / ὥριμος / θερίζω / καιρός
  rationale: σῖτος는 일반적인 ‘곡식’, ὥριμος는 ‘익은’, θεριζόμενος는 수확 행위를 살려 ‘거둬지는’으로 옮겼고, κατὰ καιρόν은 ‘제때에’로 압축했습니다.
- source_word: θημωνιὰ ἅλωνος καθ’ ὥραν συγκομισθεῖσα
  english_pob_choice: a heap from the threshing floor gathered in at the proper time
  chosen_korean: 제때에 타작마당에서 거둬들여진 타작마당의 더미
  alternatives_korean:
  - 알맞은 때에 타작마당에서 모아진 더미
  - 때맞춰 타작마당에서 거둬들여진 곡식 더미
  lexicon: θημωνιά / ἅλων / συγκομίζω / ὥρα
  rationale: θημωνιά는 ‘더미’, ἅλων은 ‘타작마당’으로 직역하고, συγκομισθεῖσα는 ‘거둬들여진’으로 수동성을 드러냈습니다.
theological_decisions:
- issue: 직유가 죽음을 곡식 수확의 자연스러운 완성으로 묘사함
  chosen_reading: 무덤으로 ‘오게 될 것입니다’라는 미래형을 유지해, 죽음이 단순한 종말이 아니라 정해진 때의 수확처럼 이해되도록 했습니다.
  alternative_readings:
  - 죽음의 이미지로 완화하여 번역
  - 현재형으로 일반화하여 번역
  rationale: 원문은 ‘때’(καιρός, ὥρα)를 반복해 종결의 질서와 적절성을 강조하므로, 이를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 신적 섭리 아래의 죽음과 때에 대한 성서적 비유
