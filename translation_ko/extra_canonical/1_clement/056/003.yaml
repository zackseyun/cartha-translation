  to: 왜냐하면 거룩한 말씀은 이렇게 말씀합니다. 「주께서 나를 엄하게 징계하셨고, 죽음에 넘기지 않으셨습니다.」[a]
  rationale: γάρ의 인과 관계와 καί의 단순 접속을 한국어에서 보존했습니다. ‘엄하게 징계하셨습니다’는 반복형의 강도 강조를 유지하며, 대안적 확실성 해석은 각주로 처리했습니다. 본문의 각주 표지에 대응하는 각주도 보완했습니다.
