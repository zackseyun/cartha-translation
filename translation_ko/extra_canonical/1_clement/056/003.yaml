id: 1CLEM.56.3
reference: 1 Clement 56:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως γάρ φησιν ὁ ἅγιος λόγος· Παιδεύων ἐπαίδευσέν με ὁ κύριος, καὶ τῷ θανάτῳ οὐ παρέδωκέν με·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056/003.yaml
  text: 'For thus says the holy word:


    “The Lord disciplined me severely,

    and he did not hand me over to death.”[a]'
  footnotes:
  - marker: a
    text: Or 'surely disciplined me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 거룩한 말씀은 이렇게 말씀하십니다. 「주께서 나를 엄하게 징계하셨으나, 죽음에 넘기지는 않으셨습니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἅγιος λόγος
  english_pob_choice: the holy word
  chosen_korean: 거룩한 말씀
  alternatives_korean:
  - 거룩한 말씀하심
  - 성스러운 말씀
  lexicon: λόγος
  rationale: 문맥상 성경 인용을 가리키므로 ‘말씀’이 자연스럽고, ἅγιος는 ‘거룩한’으로 सीधे 옮겨 원문의 성별된 권위를 살렸습니다.
- source_word: Παιδεύων ἐπαίδευσέν
  english_pob_choice: disciplined me severely
  chosen_korean: 엄하게 징계하셨으나
  alternatives_korean:
  - 심하게 징계하셨으나
  - 강하게 훈육하셨으나
  - 분명히 징계하셨으나
  lexicon: παιδεύω
  rationale: 이중형은 단순한 확신 표지가 아니라 강한 강조를 나타내므로, ‘엄하게’로 강도를 살리고 전치된 분사 구조는 한국어의 자연스러운 역접 흐름으로 풀었습니다.
- source_word: παρέδωκέν με
  english_pob_choice: did not hand me over to death
  chosen_korean: 죽음에 넘기지는 않으셨습니다
  alternatives_korean:
  - 죽음에 내주지는 않으셨습니다
  - 죽음에 넘겨주지는 않으셨습니다
  lexicon: παραδίδωμι
  rationale: ‘넘기다/내주다’가 παραδίδωμι의 기본 전달성을 살리며, 부정문으로 ‘죽음’에 대한 최종적 인도를 거절하신 뜻을 분명히 했습니다.
theological_decisions:
- issue: 인용문의 주체와 어조
  chosen_reading: “주께서”로 두어 주어를 직접 드러내고, 인용문 안은 성경 인용으로서 평서형을 유지했습니다.
  alternative_readings:
  - ‘주님’으로 경건한 어조를 더하는 방식
  - 인용 시작을 ‘주께서’ 없이 바로 번역하는 방식
  rationale: 그리스어 원문은 야훼/주인의 직접 인용을 가리키는 시편 인용이므로, 한국어에서도 주어를 명시해 인용 구조를 분명히 하는 것이 해석상 유리합니다.
  doctrine_reference: 시편 118:18의 인용 구조와 1클레멘스의 성경적 권위 인식
- issue: 강조 표현의 해석
  chosen_reading: ‘엄하게’는 확실성(surely)이 아니라 징계의 강도를 나타내는 강조로 이해했습니다.
  alternative_readings:
  - ‘분명히 징계하셨으나’처럼 확실성 중심으로 읽는 방식
  - ‘몹시 징계하셨으나’처럼 정서적 강도를 높이는 방식
  rationale: παιδεύων ἐπαίδευσέν은 히브리어식 강조 구문을 반영하므로, 핵심 의미는 ‘확실히’보다 ‘강하게/엄하게’에 있습니다.
  doctrine_reference: LXX의 강조 구문(히브리어 부정사 절대형 + 완료형)
