base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/020.yaml
  text: The heavens[a], moved by his governance, submit to him in peace. Day and night complete the course appointed by him, hindering one another in nothing. The sun and the moon and the choirs of stars, according to his ordinance, move in harmony, without any deviation, in the bounds assigned to them. The earth, bearing fruit according to his will, brings forth at the proper seasons abundant food for men and beasts and for all living things upon it[b], neither hesitating nor altering anything of what has been decreed by him. The unsearchable depths of the abysses and the indescribable realms of the underworld are constrained by the same ordinances. The mass of the boundless sea, gathered together by his workmanship into its basins, does not pass beyond the barriers set around it, but as he ordered it, so it does. For he said, “Up to this point you shall come, and your waves shall be broken within you.” The ocean, impassable to men, and the worlds beyond it are directed by the ordinances
    of the Master. The seasons of spring and summer and autumn and winter give way to one another in peace. The stations of the winds, each in its own season, fulfill their service without hindrance; and the ever-flowing springs, created for enjoyment and health, without fail supply their breasts to men for life. Even the smallest of living creatures hold their gatherings in harmony and peace. All these things the great Creator and Master of all has appointed to exist in peace and harmony, doing good to all things, but far beyond measure to us who have fled for refuge to his mercies through our Lord Jesus Messiah, to whom be the glory and the majesty forever and ever[g][f][e][d][c]. Amen.
  footnotes:
  - marker: a
    text: The quotation in verse 7 echoes Job 38:11.
    reason: cross_reference
  - marker: b
    text: “Worlds beyond it” reflects the plural κόσμoi and likely refers to realms or regions beyond the ocean in ancient cosmological language.
    reason: cultural_note
  - marker: c
    text: “Their breasts” preserves the Greek metaphor for springs nourishing human life.
    reason: lexical_alternative
  - marker: d
    text: Or “the indescribable judgments of the lower regions” for the difficult phrase in verse 5.
    reason: alternative_reading
  - marker: e
    text: Or 'The unsearchable depths of the abysses and the indescribable regions below'.
    reason: previous_rendering
  - marker: f
    text: Or 'The basin of the boundless sea'.
    reason: previous_rendering
  - marker: g
    text: Or 'neither wavering nor altering'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘들은 그분의 다스리심에 흔들리면서도 그분께 평강으로 복종합니다. 낮과 밤은 그분이 정하신 길을 서로 방해함이 없이 마칩니다. 해와 달과 별들의 무리는 그분의 명령에 따라, 어떤 어긋남도 없이, 자신들에게 정해진 경계 안에서 조화롭게 나아갑니다. 땅은 그분의 뜻에 따라 열매를 맺으며, 알맞은 때에 사람과 짐승과 그 위에 사는 모든 생물에게 풍성한 먹을거리를 내놓고, 그분이 정하신 것 가운데 아무것도 주저하거나 바꾸지 않습니다. 깊은 심연의 헤아릴 수 없는 것들과 아래 세계의 말로 다 할 수 없는 것들이 같은 명령에 붙들려 있습니다. 끝없는 바다의 덩어리는 그분의 창조하심에 따라 그 저장소들로 모아져도, 둘러 놓으신 경계를 넘어가지 않으며, 그분이 명하신 대로 그대로 합니다. 그분은 말씀하셨습니다. 「이곳까지 너는 이르러야 하고, 너의 물결은 네 안에서 부서질 것이다.」 사람들에게는 건널 수 없는 대양과 그 너머의 세계들도 주님의 명령들로 다스려집니다. 봄과 여름과 가을과 겨울의 계절은 평강 가운데 서로 자리를 내줍니다. 바람의 자리들은 각기 자기 때에 그들의 일을 방해받음 없이 수행하며, 쉼 없이 흘러나오는 샘들은 즐거움과 건강을 위해 지음 받았으므로, 생명을 위해 사람들에게 끊임없이 그 가슴을 내어줍니다. 가장 작은 생물들조차도 조화와 평강 가운데 그들의 모임을 이룹니다. 이 모든 것을 위대한 창조주이시며 만물의 주인이신 분은 평강과 조화 가운데 존재하도록 정하셨고, 만물을 선하게 하시되, 우리를 향해서는 우리 주 예수 메시아를 통해 그분의 자비로 피신해 온 우리에게 훨씬 더 넘치도록 하셨습니다. 그분께 영광과 위엄이 영원무궁토록 있습니다. 아멘.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διοίκησει
  english_pob_choice: governance
  chosen_korean: 다스리심
  alternatives_korean:
  - 통치
  - 행정
  - 섭리
  lexicon: LSJ
  rationale: 우주를 질서 있게 주관하시는 하나님의 능동적 통치를 자연스럽게 드러내면서도, 행정 같은 현대 제도 용어로 좁히지 않기 위해 ‘다스리심’을 택했습니다.
- source_word: σαλευόμενοι
  english_pob_choice: moved
  chosen_korean: 흔들리면서도
  alternatives_korean:
  - 움직이면서도
  - 흔들려도
  - 진동하면서도
  lexicon: LSJ
  rationale: 하늘이 하나님의 주권 아래 운동하면서도 복종하는 역설을 살리기 위해, 단순한 ‘움직이다’보다 물리적 긴장감을 주는 ‘흔들리면서도’를 사용했습니다.
- source_word: νερτέρων ἀνεκδιήγητα κρίματα
  english_pob_choice: the indescribable realms of the underworld
  chosen_korean: 아래 세계의 말로 다 할 수 없는 것들
  alternatives_korean:
  - 아래 세계의 헤아릴 수 없는 심판들
  - 저승의 말로 다 할 수 없는 영역들
  - 아래 세계의 헤아릴 수 없는 영역들
  lexicon: LSJ
  rationale: 문맥상 목록형 우주 질서의 항목으로 읽히므로, 지나치게 법정적 의미인 ‘심판’보다 모호성을 유지하는 표현을 택해 원문의 난점을 그대로 남겼습니다.
- source_word: χύτος ... εἰς τὰς συναγωγάς
  english_pob_choice: the mass ... gathered together ... into its basins
  chosen_korean: 끝없는 바다의 덩어리 ... 그 저장소들로 모아져도
  alternatives_korean:
  - 끝없는 바다의 흐름 ... 그 웅덩이들로 모아져도
  - 끝없는 바다의 질량 ... 그 분지들로 모아져도
  - 끝없는 바다의 물덩이 ... 그 집합소들로 모아져도
  lexicon: LSJ
  rationale: 바다를 하나의 집합된 물질로 묘사하는 이미지를 살리기 위해 ‘덩어리’를 사용했고, συναγωγάς는 ‘모이는 곳’의 뜻을 살려 ‘저장소들’로 옮겼습니다.
- source_word: μαζούς
  english_pob_choice: their breasts
  chosen_korean: 그 가슴을
  alternatives_korean:
  - 그 젖가슴을
  - 그 유방을
  - 그 가슴들
  lexicon: LSJ
  rationale: 샘의 물을 어머니의 젖가슴에 비유한 은유를 완화하지 않기 위해 직설적인 신체 이미지를 유지하되, 한국어 독서 가능성을 고려해 ‘가슴’을 택했습니다.
- source_word: κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  english_pob_choice: our Lord Jesus Messiah
  chosen_korean: 우리 주 예수 메시아
  alternatives_korean:
  - 우리 주 예수 그리스도
  - 우리 주 예수 그 메시아
  lexicon: project glossary
  rationale: Χριστός를 직함으로 보고 ‘메시아’로 옮겨, 고유명사화된 관습 번역보다 원래의 칭호 의미를 드러냈습니다.
theological_decisions:
- issue: δεσπότης와 κύριος의 구별
  chosen_reading: 10–11절의 δεσπότης는 ‘주인’/‘주인이신 분’으로, 11절 후반의 κύριος는 예수께 연결된 ‘주님’으로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘주’로 통일
  - 둘 다 ‘주님’으로 통일
  rationale: 본문은 창조주에 대한 절대적 주권과 예수에 대한 고백을 나누어 말하므로, 한국어에서도 두 권위를 완전히 평준화하지 않도록 구분을 남겼습니다.
  doctrine_reference: 'DOCTRINE.md: Keep lexical distinctions where source distinguishes them'
- issue: Χριστός의 번역
  chosen_reading: 예수 메시아
  alternative_readings:
  - 예수 그리스도
  - 예수 그 메시아
  rationale: 본서의 용례 정책에 따라 титular Χριστός를 ‘메시아’로 번역해, 칭호가 지닌 구속사적 의미를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names'
