base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/035.yaml
  text: 'How blessed and marvelous are the gifts of God[1], beloved: life in immortality, splendor in righteousness, truth in boldness, faith in confidence, self-control in holiness. And all these things fall within the grasp of our understanding. What then, indeed, are the things prepared for those who patiently endure? The Creator and Father of the ages, the all-holy one himself, knows their measure and their beauty. Therefore let us strive to be found in the number of those who patiently endure him, so that we may share in the gifts that have been promised. But how will this be, beloved? If our mind has been fixed faithfully on God, if we seek out the things pleasing and acceptable to him, if we accomplish the things that belong to his blameless purpose and follow the way of truth, casting away from ourselves all unrighteousness and wickedness, greed, strife, maliciousness and deceits, whisperings and slanders, hatred of God, pride and arrogance, empty glory and lack of hospitality. For
    those who practice these things are hateful to God; and not only those who practice them, but also those who approve of them. For the Scripture says, “But to the sinner God said, Why do you recount my righteous requirements, and take up my covenant upon your mouth? Yet you hated discipline, and cast my words behind you. If you saw a thief, you ran with him, and you placed your share with an adulterer. Your mouth overflowed with evil, and your tongue kept weaving deceit. Sitting down, you were slandering your brother, and against the son of your mother you were laying a stumbling block. These things you did, and I kept silent; you supposed, lawless one, that I would be like you. I will rebuke you and set you before your face[2]. Understand these things, then, you who forget God, lest he seize like a lion, and there be no one to rescue. A sacrifice of praise will glorify me[d][c][b][a][3], and there is the way by which I will show him the salvation of God.”'
  footnotes:
  - marker: '1'
    text: The closing citation echoes Psalm 50:16–23 LXX (Psalm 50 in Greek numbering; Psalm 51 in some English traditions differs because of numbering conventions). The wording here follows Clement's Greek citation rather than a standardized English Psalter form.
    reason: cross_reference
  - marker: '2'
    text: '''Father of the ages'' renders the plural αἰώνων more literally than ''Father of eternity.'''
    reason: lexical_alternative
  - marker: '3'
    text: The phrase rendered 'patiently endure him' is syntactically compressed in Greek and may also be understood along the lines of 'wait for him' or 'persevere in relation to him.'
    reason: alternative_reading
  - marker: a
    text: Or 'those who patiently endure him'.
    reason: previous_rendering
  - marker: b
    text: Or 'those who patiently endure for him?'.
    reason: previous_rendering
  - marker: c
    text: Or 'What then, therefore,'.
    reason: previous_rendering
  - marker: d
    text: Or 'with adulterers'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님의 선물들이 얼마나 복되고 놀라운지요, 사랑하는 이들이여. 곧 영생의 생명, 의 안의 찬란함, 담대함 안의 진리, 확신 안의 믿음, 거룩함 안의 절제입니다. 그리고 이 모든 것은 우리의 이해가 닿는 범위 안에 있습니다. 그러면, 참으로 기다리는 이들에게 예비된 것들이 무엇이겠습니까? 시대들의 아버지이시며 모든 것의 창조주이신 가장 거룩하신 그분께서 그들의 분량과 아름다움을 친히 아십니다. 그러므로 우리는 그분을 오래 참는 이들 가운데서 발견되도록 힘써, 약속된 선물들에 참여해야 합니다. 그런데, 사랑하는 이들이여, 이것이 어떻게 가능하겠습니까? 만일 우리의 마음이 하나님께 충실히 굳게 서 있고, 그분께서 기뻐하시고 받아들이실 것들을 우리가 찾으며, 그분의 흠 없는 뜻에 속한 것들을 우리가 이루고 진리의 길을 따르며, 모든 불의와 악함과 탐욕과 다툼과 악의와 속임수와 수군거림과 비방과 하나님을 미워함과 교만과 거만함과 헛된 영광과 손님 대접의 부족을 우리 자신에게서 내버린다면 말입니다. 이런 것들을 행하는 자들은 하나님께 가증한 자들이기 때문입니다. 그리고 그것들을 행하는 자들만이 아니라, 그것들에 동의하는 자들도 그러합니다. 왜냐하면 성경이 이렇게 말하기 때문입니다. 「그러나 죄인에게 하나님께서 말씀하셨습니다. ‘어찌하여 너는 내 의로운 요구들을 열거하며, 내 언약을 네 입에 올리느냐? 그러나 너는 징계를 미워하고 내 말들을 뒤로 던졌도다. 네가 도둑을 보았을 때 그와 함께 달렸고, 간음하는 자와 네 몫을 나누었도다. 네 입은 악으로 넘쳐흘렀고, 네 혀는 속임수를 엮어 왔도다. 네가 앉아서 네 형제를 비방하였고, 네 어머니의 아들에 대하여서는 걸림돌을 놓았도다. 네가 이런 일들을 행하였고, 나는 잠잠하였다. 너는, 불법한 자여, 내가 너와 같을 것이라고 생각하였다. 나는 너를 책망하고 네 얼굴 앞에 너를 세우리라. 그러니, 하나님을 잊어버리는 자들아, 이것들을 깨달으라. 그렇지 않으면 그가 사자처럼 붙잡을 것이니, 구해 줄 자가 없을 것이다.
    찬양의 제사는 나를 영화롭게 할 것이며, 거기에는 하나님의 구원을 내가 그에게 보이리라.’」[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δῶρα
  english_pob_choice: gifts
  chosen_korean: 선물들
  alternatives_korean:
  - 은사들
  - 선물
  lexicon: LSJ
  rationale: 하나님에게서 오는 복을 단순한 추상명사보다 ‘선물들’로 옮겨 원문의 구체성과 은혜성을 살렸습니다.
- source_word: μακάρια καὶ θαυμαστά
  english_pob_choice: blessed and marvelous
  chosen_korean: 복되고 놀라운
  alternatives_korean:
  - 복되며 놀라운
  - 복되고 경이로운
  lexicon: LSJ
  rationale: 축복의 상태와 경탄의 성격을 함께 살리되, 현대 한국어에서 자연스럽게 읽히는 조합을 택했습니다.
- source_word: παρρησία
  english_pob_choice: boldness
  chosen_korean: 담대함
  alternatives_korean:
  - 담대함
  - 공개적인 말함
  - 대담함
  lexicon: BDAG
  rationale: 이 목록에서는 단순한 ‘자신감’보다 두려움 없는 드러냄과 말함의 뉘앙스가 있어 ‘담대함’이 가장 알맞습니다.
- source_word: πεποίθησις
  english_pob_choice: confidence
  chosen_korean: 확신
  alternatives_korean:
  - 신뢰
  - 확신감
  lexicon: BDAG
  rationale: πίστις와 구별되는 내적 안정의 의미를 살리기 위해 ‘믿음’이 아니라 ‘확신’을 택했습니다.
- source_word: ἐγκράτεια
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 자기 통제
  lexicon: BDAG
  rationale: 한국어 교회 문맥에서도 통용되면서도 고전적 덕목 목록의 울림을 유지하는 표현입니다.
- source_word: ἀπορρίψαντες ἀφ’ ἑαυτῶν
  english_pob_choice: casting away from ourselves
  chosen_korean: 우리 자신에게서 내버린다면
  alternatives_korean:
  - 우리에게서 던져 버린다면
  - 우리 자신에게서 떨쳐 버린다면
  lexicon: LSJ
  rationale: 원문의 분리·제거 이미지를 자연스럽게 살리면서, 뒤따르는 악덕 목록과 연결되도록 했습니다.
- source_word: θεοστυγίαν
  english_pob_choice: hatred of God
  chosen_korean: 하나님을 미워함
  alternatives_korean:
  - 하나님에 대한 증오
  - 신에 대한 혐오
  lexicon: LSJ
  rationale: 희귀한 악덕어의 직설성을 유지하기 위해 완곡어법을 피했습니다.
- source_word: ἀφιλοξενίαν
  english_pob_choice: lack of hospitality
  chosen_korean: 손님 대접의 부족
  alternatives_korean:
  - 비호의
  - 환대 없음
  lexicon: LSJ
  rationale: 교회적 용어로 굳어지기 전의 사회윤리적 의미를 살리면서도 현대 독자가 바로 이해할 수 있게 했습니다.
theological_decisions:
- issue: τῶν ὑπομενόντων αὐτόν의 관계 표현
  chosen_reading: ‘그분을 오래 참는 이들’로 옮겨, endurance의 관계적 대상을 그대로 살렸습니다.
  alternative_readings:
  - 그분을 기다리는 이들
  - 그분 안에서 인내하는 이들
  rationale: 문맥상 장차 받을 선물과 연결되는 인내/기다림의 긴장을 풀어버리지 않고, 원문의 다소 압축된 관계구조를 드러내기 위해 ‘오래 참다’ 계열을 유지했습니다.
  doctrine_reference: 종말론적 인내와 하나님과의 관계적 기다림
- issue: 성경 인용문의 형태
  chosen_reading: 익숙한 시편 한국어 문구로 맞추지 않고 1 Clement가 인용한 그리스어 형태를 따라 옮겼습니다.
  alternative_readings:
  - 전통적 시편 번역과 조화
  - 개역계열의 익숙한 표현 사용
  rationale: 원전 우선 원칙에 따라, 클레멘트의 실제 인용 형태를 드러내는 것이 주해적으로 더 투명합니다.
  doctrine_reference: 원천 텍스트 우선과 인용 투명성
