revisions:
- from: 그러므로 메시아는 하나님에게서 나오고, 사도들은 메시아에게서 나왔습니다. 그러므로 둘 다 하나님의 뜻에 따라 질서 있게 생겨났습니다.[a]
  to: 그러므로 메시아는 하나님에게서 오셨고, 사도들은 메시아에게서 왔습니다. 따라서 이 두 일은 하나님의 뜻으로 질서 있게 이루어졌습니다.[a]
  rationale: The revision preserves the title ‘메시아,’ the parallel source relations, and the causal/source force of ἐκ θελήματος θεοῦ. It clarifies that ‘both’ denotes the two preceding arrangements rather than asserting the origination of the persons themselves, and it improves Korean formal-polite naturalness.
