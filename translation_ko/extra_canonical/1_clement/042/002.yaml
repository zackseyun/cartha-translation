  text: ὁ Χριστὸς οὖν ἀπὸ τοῦ θεοῦ καὶ οἱ ἀπόστολοι ἀπὸ τοῦ Χριστοῦ· ἐγένοντο οὖν ἀμφότερα εὐτάκτως ἐκ θελήματος θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/002.yaml
  text: So then Messiah is from God[a], and the apostles are from Messiah; therefore both came about in good order by the will of God.
  footnotes:
  - marker: a
    text: Or 'from the will of God'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 메시아는 하나님에게서 오셨고, 사도들은 메시아에게서 왔습니다. 따라서 이 두 일은 하나님의 뜻으로 질서 있게 이루어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “하나님의 뜻에서.”
    reason: ἐκ θελήματος θεοῦ의 출처·기원 뉘앙스를 보여 주며, 본문의 자연스러운 ‘하나님의 뜻으로’를 보완합니다.
lexical_decisions:
- source_word: ὁ Χριστὸς
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 기름부음 받은 이
  lexicon: Χριστός
  rationale: POB가 Χριστός를 титular하게 ‘Messiah’로 유지하므로, 한국어도 교회 전통어 ‘그리스도’보다 더 직접적인 ‘메시아’를 택했습니다.
- source_word: ἀπὸ τοῦ θεοῦ
  english_pob_choice: from God
  chosen_korean: 하나님에게서 나오고
  alternatives_korean:
  - 하나님에게서
  - 하나님으로부터
  lexicon: ἀπό + genitive
  rationale: 단순한 출처를 나타내는 ἀπό의 관계를 살리되, 한국어에서는 인적·관계적 기원을 자연스럽게 드러내는 ‘...에게서 나오다’로 옮겼습니다.
- source_word: ἐγένοντο οὖν ἀμφότερα εὐτάκτως
  english_pob_choice: both came about in good order
  chosen_korean: 둘 다 하나님의 뜻에 따라 질서 있게 생겨났습니다
  alternatives_korean:
  - 둘 다 질서 있게 이루어졌습니다
  - 둘 다 좋은 질서로 생겨났습니다
  lexicon: ἐγένοντο / εὐτάκτως
  rationale: ἐγένοντο의 발생·성립 뉘앙스와 εὐτάκτως의 ‘질서 있게’라는 의미를 함께 반영해, 단순한 결과 진술보다 ‘생겨났습니다’와 ‘질서 있게’를 결합했습니다.
- source_word: ἐκ θελήματος θεοῦ
  english_pob_choice: by the will of God
  chosen_korean: 하나님의 뜻에 따라
  alternatives_korean:
  - 하나님의 뜻으로
  - 하나님의 뜻에 의해
  lexicon: ἐκ θελήματος θεοῦ
  rationale: POB의 영어처럼 원인/기준을 나타내는 표현으로 읽되, 한국어에서는 ‘뜻에 따라’가 가장 자연스럽고 의미를 과도하게 좁히지 않습니다.
theological_decisions:
- issue: Χριστός의 번역어 유지
  chosen_reading: 메시아로 옮겨, 칭호성 및 유대적 배경을 드러냈습니다.
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: 이 문맥은 예수 이름의 헬라식 고유명보다 칭호적 의미가 핵심이므로, POB의 원칙대로 메시아를 유지하는 것이 독자에게 더 정확합니다.
  doctrine_reference: POB glossary on Χριστός (titular)
