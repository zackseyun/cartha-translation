  text: Οἱ ἀπόστολοι ἡμῖν εὐηγγελίσθησαν ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ, Ἰησοῦς ὁ Χριστὸς ἀπὸ τοῦ θεοῦ ἐξεπέμφθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/001.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah, and Jesus the Messiah was sent out from God.
translation:
  language: ko
  text: 사도들은 우리를 위하여 주 예수 메시아께로부터 복음을 받았고, 예수 메시아는 하나님께로부터 보내심을 받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐηγγελίσθησαν
  english_pob_choice: were given the good news
  chosen_korean: 복음을 전해 받았고
  alternatives_korean:
  - 복음을 전했고
  - 복음을 받았고
  lexicon: εὐαγγελίζω
  rationale: 수동형의 의미를 살리면서도 한국어에서 자연스러운 ‘복음을 전해 받다’로 옮겨, 사도들이 복음의 수납자이자 전승자라는 뉘앙스를 보존했습니다.
- source_word: ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ
  english_pob_choice: from the Lord Jesus Messiah
  chosen_korean: 주 예수 메시아에게서
  alternatives_korean:
  - 주 예수 그리스도에게서
  - 주 예수 메시아로부터
  lexicon: κύριος / Χριστός
  rationale: POB의 메시아 용례를 따르되, 출처를 나타내는 ἀπό의 의미를 한국어 조사 ‘-에게서’로 분명히 했습니다.
- source_word: Ἰησοῦς ὁ Χριστὸς
  english_pob_choice: Jesus the Messiah
  chosen_korean: 예수 메시아
  alternatives_korean:
  - 예수 그리스도
  - 예수님 메시아
  lexicon: Χριστός
  rationale: 정관사 포함 서술적 표현이므로 고유명사화보다 호칭적 의미를 살려 ‘메시아’로 유지했습니다.
- source_word: ἐξεπέμφθη
  english_pob_choice: was sent out
  chosen_korean: 보내심을 받았습니다
  alternatives_korean:
  - 보냄을 받았습니다
  - 파송되었습니다
  lexicon: ἐκπέμπω
  rationale: ‘보내다’의 파송 의미를 살리면서, 수동태의 수용성을 살린 공손하고 현대적인 표현으로 다듬었습니다.
theological_decisions:
- issue: Χριστός의 번역 일관성
  chosen_reading: 메시아로 번역했습니다.
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: 이 문맥에서 영어 POB가 ‘Messiah’를 택한 점을 반영하여, 제목적 의미를 드러내는 ‘메시아’를 유지했습니다.
  doctrine_reference: 그리스도론 / 메시아 칭호
- issue: 사도들의 복음 수납과 기원의 이중 진술
  chosen_reading: 사도들이 주 예수 메시아에게서 복음을 전해 받았고, 예수 메시아는 하나님에게서 보내심을 받았습니다.
  alternative_readings:
  - 사도들이 주 예수 메시아에게서 복음을 받았고, 예수 메시아는 하나님에게서 보내심을 받았습니다.
  rationale: 원문은 사도들의 복음 출처와 예수의 파송 출처를 평행하게 제시하므로, 두 절의 대칭을 살려 번역했습니다.
  doctrine_reference: 사도적 전승 / 성자의 파송
