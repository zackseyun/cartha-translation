    rationale: ‘사도들은 … 우리에게 복음을 전해 받았고’는 ‘우리에게서 받았다’ 또는 ‘우리에게 받을 복음’처럼 읽힐 여지가 있습니다. 문맥상 사도들이 우리를 위하여 복음을 주 예수 메시아에게서 받았다는 기원 진술을 분명히 해야 합니다.
