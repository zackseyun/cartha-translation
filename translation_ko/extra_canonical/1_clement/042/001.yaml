  verdict: revise
  source_fidelity: 원문의 ἡμῖν은 여기서 사도들이 복음을 받은 대상이라기보다 ‘우리를 위하여/우리에게 전해질’ 복음의 수혜자를 나타냅니다. 초안의 ‘우리에게 복음을 전해 받았고’는 사도들이 우리에게서 또는 우리에게 복음을 받았다는 듯하게 걸릴 수 있습니다. 또한 εὐηγγελίσθησαν의 수동형에 맞춰 ‘복음을 받았다’로 옮기는 것이 안전합니다. 두 번째 절의 수동적 파송은 잘 반영되어 있습니다.
  naturalness: ‘주 예수 메시아에게서’도 이해 가능하나, 문어적이고 현대 표준어에서 자연스러운 출처 표현인 ‘주 예수 메시아께로부터’를 쓰는 편이 낫습니다. ‘하나님께로부터’도 같은 방식으로 평행을 이룹니다.
  terminology: Χριστός를 ‘메시아’로 일관되게 옮긴 것은 영어 POB의 선택 및 원문의 칭호성을 잘 반영합니다. κύριος는 ‘주’, θεός는 ‘하나님’으로 유지할 수 있습니다. ‘보내심을 받았습니다’는 존대 어미와 수동 의미 모두 적절합니다.
  issues:
  - severity: medium
