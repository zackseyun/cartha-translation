revisions:
- from: 그러므로 각 지역과 도시에서 선포하면서, 그들은 성령으로 시험한 뒤, 장차 믿게 될 사람들을 위한 감독들과 집사들로 그들의 첫 열매를 세웠습니다.
  to: 그러므로 그들은 여러 지방과 도시에서 선포하면서, 그들을 성령으로 검증한 뒤, 그들의 첫 열매를 장차 믿게 될 사람들을 위한 감독들과 집사들로 세웠습니다.
  rationale: 원문의 비유적 표현인 ‘첫 열매’, 직분 명칭, 그리고 장래 신자들을 위한 목적 관계는 보존했습니다. 검증의 대상을 대명사로 명시하여 δοκιμάσαντες의 문법적·문맥적 관계를 한국어에서 분명히 했으며, ‘여러 지방과 도시’로 순회·분포의 뉘앙스를 자연스럽게 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 의미는 대체로 충실합니다. 다만 δοκιμάσαντες(시험하여/검증하여)의 대상은 문맥상 뒤의 ‘첫 열매’, 곧 세워지는 사람들입니다. 초안의 ‘성령으로 시험한 뒤’는 한국어에서 무엇을 시험했는지가 불분명합니다. ‘성령’은 영어 POB의 ‘the Spirit’ 및 초기 기독교 문맥에 부합하는 자연스러운 구체화입니다.
  naturalness: ‘각 지역과 도시’보다 κατὰ χώρας καὶ πόλεις의 분포적 의미를 ‘여러 지방과 도시’로 옮기는 편이 자연스럽습니다. 또한 ‘그들을 성령으로 검증한 뒤’로 목적어를 명시하면 수식 관계가 분명해집니다.
  terminology: ‘감독들과 집사들’은 ἐπίσκοποι와 διάκονοι에 대한 표준적이고 적절한 번역입니다. ‘첫 열매’는 ἀπαρχὰς의 비유를 보존하며, 이를 ‘첫 신자들’로 평문화하지 않는 것이 원문에 더 가깝습니다. ‘선포하면서’도 κηρύσσοντες에 적절합니다.
  issues:
  - severity: medium
    issue: δοκιμάσαντες의 목적어가 한국어 문장에서 불명확함
    rationale: 그리스어에서는 문맥상 τὰς ἀπαρχὰς αὐτῶν가 ‘검증한’ 대상이지만, 초안은 ‘성령으로 시험한 뒤’라고만 하여 무엇을 시험했는지 드러나지 않습니다. 목적어를 ‘그들을’로 보완하면 의미와 문장 구조가 명료해집니다.
  - severity: low
    issue: κατὰ χώρας의 분포적 뉘앙스
    rationale: ‘각 지역’도 가능하지만, 복수의 지방과 도시를 두루 다니며 선포한 뜻에는 ‘여러 지방과 도시에서’가 더 자연스럽습니다.
  revised_text: 그러므로 그들은 여러 지방과 도시에서 선포하면서, 그들을 성령으로 검증한 뒤, 그들의 첫 열매를 장차 믿게 될 사람들을 위한 감독들과 집사들로 세웠습니다.
  revised_footnotes: []
