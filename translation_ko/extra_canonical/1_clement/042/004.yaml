source:
  edition: Funk 1901 (normalized OCR)
  text: κατὰ χώρας οὖν καὶ πόλεις κηρύσσοντες καθίστανον τὰς ἀπαρχὰς αὐτῶν, δοκιμάσαντες τῷ πνεύματι, εἰς ἐπισκόπους καὶ διακόνους τῶν μελλόντων πιστεύειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/004.yaml
  text: So, preaching through regions and cities, they appointed their firstfruits, after testing them by the Spirit, to be overseers and deacons for those who were going to believe.
translation:
  language: ko
  text: 그러므로 그들은 여러 지방과 도시에서 선포하면서, 그들을 성령으로 검증한 뒤, 그들의 첫 열매를 장차 믿게 될 사람들을 위한 감독들과 집사들로 세웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσοντες
  english_pob_choice: preaching
  chosen_korean: 선포하면서
  alternatives_korean:
  - 전파하면서
  - 복음을 전하면서
  lexicon: κηρύσσω
  rationale: 단순한 정보 전달보다 공적 선포의 뉘앙스를 살리면서도, 문맥상 자연스러운 현대 한국어로 옮겼습니다.
- source_word: καθίστανον
  english_pob_choice: appointed
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 임명했습니다
  - 임명하여 세웠습니다
  lexicon: καθίστημι
  rationale: 직분 부여의 의미를 살리되, 초대교회 맥락에서 과도하게 제도화된 느낌이 덜한 동사를 택했습니다.
- source_word: τὰς ἀπαρχὰς αὐτῶν
  english_pob_choice: their firstfruits
  chosen_korean: 그들의 첫 열매
  alternatives_korean:
  - 그들의 첫 소출
  - 그들의 처음 된 사람들
  lexicon: ἀπαρχή
  rationale: 직역하면서도 비유적·헌상적 의미를 유지하기 위해 ‘첫 열매’를 사용했습니다.
- source_word: τῷ πνεύματι
  english_pob_choice: by the Spirit
  chosen_korean: 성령으로
  alternatives_korean:
  - 영으로
  - 성령 안에서
  lexicon: πνεῦμα
  rationale: 본문의 시험 주체가 하나님의 영으로 이해되는 문맥이므로, 독자 오해를 줄이기 위해 ‘성령’으로 구체화했습니다.
theological_decisions:
- issue: ‘firstfruits’를 교회 직분 선출의 대상에 비유하는 표현
  chosen_reading: 그들의 첫 열매를 감독들과 집사들로 세웠다고 옮겼습니다.
  alternative_readings:
  - 그들 가운데 첫 사람들을 세웠다고 옮길 수 있습니다.
  - 그들의 첫 결실을 직분자로 세웠다고 옮길 수 있습니다.
  rationale: 본문의 비유적 표현을 완화하지 않고, 헌상/처음 수확의 이미지를 살려 공동체의 가장 먼저 드려진 사람들임을 드러냈습니다.
  doctrine_reference: 초대교회 직분과 소명에 대한 본문의 서술적 표현
- issue: ‘those who were going to believe’의 미래 지향성
  chosen_reading: 장차 믿게 될 사람들을 위한 것으로 옮겼습니다.
  alternative_readings:
  - 믿게 될 사람들을 위해
  - 앞으로 믿을 사람들을 위해
  rationale: 현재 믿는 자가 아니라 장래의 신앙 공동체를 염두에 둔 목적/대상 관계를 보존했습니다.
  doctrine_reference: 교회의 선교적·제도적 준비를 드러내는 서술
