    reason: previous_rendering
translation:
  language: ko
  text: 이것은 새로운 일이 아니었습니다. 사실, 오래전부터 감독들과 집사들에 관하여 기록되어 있었습니다. 성경은 이렇게 어디선가 말합니다. 「내가 그들의 감독들을 의 안에서 세우고, 그들의 집사들을 믿음 안에서 세우리라」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성경은 어디선가 이렇게 말합니다.”
    reason: The Greek word order permits either placement of που(‘어디선가’); the alternative preserves the English audit-trail note without changing the meaning.
