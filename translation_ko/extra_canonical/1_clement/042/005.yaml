revisions:
- from: 이것은 새로운 것이 아니었습니다. 사실 오래전부터 감독들과 집사들에 관하여 기록되어 있었습니다. 왜냐하면 성경이 이렇게 어디선가 말하기 때문입니다. 「내가 그들의 감독들을 의 가운데에 세우고, 그들의 집사들을 믿음 안에 두겠습니다」.[a]
  to: 이것은 새로운 일이 아니었습니다. 사실, 오래전부터 감독들과 집사들에 관하여 기록되어 있었습니다. 성경은 이렇게 어디선가 말합니다. 「내가 그들의 감독들을 의 안에서 세우고, 그들의 집사들을 믿음 안에서 세우리라」[a]
  rationale: The revision corrects the unnatural rendering of ἐν δικαιοσύνῃ, gives the biblical citation its future form, and smooths the Korean citation formula. It retains the source’s deliberate indefiniteness in που (‘어디선가’) and its demonstrative οὕτως (‘이렇게’), as well as the established office terms ‘감독’ and ‘집사.’
  reviewer_model: gpt-5.6-terra
