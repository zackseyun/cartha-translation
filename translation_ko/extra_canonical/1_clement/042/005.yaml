  yaml_path: translation/extra_canonical/1_clement/042/005.yaml
  text: And this was not something new[a], for indeed it had been written about overseers and deacons from many ages ago. For thus the Scripture says somewhere, “I will appoint their overseers in righteousness, and their deacons in faith.”
  footnotes:
  - marker: a
    text: Or 'For somewhere the Scripture says,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 새로운 것이 아니었습니다. 사실 오래전부터 감독들과 집사들에 관하여 기록되어 있었습니다. 왜냐하면 성경이 이렇게 어디선가 말하기 때문입니다. 「내가 그들의 감독들을 의 가운데에 세우고, 그들의 집사들을 믿음 안에 두겠습니다」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ καινῶς
  english_pob_choice: was not something new
  chosen_korean: 새로운 것이 아니었습니다
  alternatives_korean:
  - 새것이 아니었습니다
  - 새로운 일이 아니었습니다
  lexicon: καινός
  rationale: 사건의 새로움을 부정하는 표현으로 자연스럽게 옮겼으며, 과도하게 해석하지 않았습니다.
- source_word: ἐπίσκοποι
  english_pob_choice: overseers
  chosen_korean: 감독들
  alternatives_korean:
  - 감찰자들
  - 감독자들
  lexicon: ἐπίσκοπος
  rationale: 프로젝트 기본 용례에 따라 ecclesial office를 '감독'으로 유지했습니다.
- source_word: διάκονοι
  english_pob_choice: deacons
  chosen_korean: 집사들
  alternatives_korean:
  - 봉사자들
  - 일꾼들
  lexicon: διάκονος
  rationale: 직분을 가리키는 경우로 보아 '집사'를 채택했습니다.
- source_word: ἐν δικαιοσύνῃ
  english_pob_choice: in righteousness
  chosen_korean: 의 가운데에
  alternatives_korean:
  - 의 안에
  - 의로
  lexicon: δικαιοσύνη
  rationale: 문맥상 임명의 기준/상태를 나타내므로 '의'를 유지하되, 한국어로는 위치어법을 써서 자연스럽게 표현했습니다.
- source_word: ἐν πίστει
  english_pob_choice: in faith
  chosen_korean: 믿음 안에
  alternatives_korean:
  - 믿음으로
  - 신실함 안에
  lexicon: πίστις
  rationale: 여기서는 신실함보다 믿음의 영역/기초를 가리키는 표현으로 읽는 것이 더 직접적이어서 '믿음 안에'로 옮겼습니다.
theological_decisions:
- issue: 성경 인용 도입구의 불확정성
  chosen_reading: 성경이 이렇게 어디선가 말하기 때문입니다
  alternative_readings:
  - 성경이 어디선가 이렇게 말하기 때문입니다
  - 성경이 말하듯이
  rationale: οὕτως γάρ που λέγει ἡ γραφή의 '오ὕτως'와 'που'를 둘 다 반영해 인용 공식의 불확정성과 '이렇게'를 함께 살렸습니다.
  doctrine_reference: 문헌 인용 방식의 보존
- issue: 직분 용어의 교회적/제도적 의미
  chosen_reading: 감독들, 집사들
  alternative_readings:
  - 감찰자들, 봉사자들
  rationale: 초기 교회 직분을 가리키는 전문 용어로 이해하여 한국 교회 용례에 맞되, 원문 직능을 흐리지 않는 표현을 유지했습니다.
  doctrine_reference: 교회 직분 용어
