id: 1CLEM.42.3
reference: 1 Clement 42:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042/003.yaml
  text: Therefore[a], after receiving instructions and being fully assured through the resurrection of our Lord Jesus Messiah, and being confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God was about to come.
  footnotes:
  - marker: a
    text: Or 'is about to come'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 그들은 지시를 받고, 우리 주 예수 메시아의 부활을 통하여 충분한 확신을 얻고, 하나님의 말씀 안에서 굳게 세워져, 성령으로 충만한 확신을 가지고 나아가 하나님의 나라가 곧 올 것이라고 복음을 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님의 나라가 곧 온다고.”
    reason: μέλλειν ἔρχεσθαι의 현재형 부정사는 과거의 선포 내용을 보고하는 간접화법 안에서도 현재적 표현으로 이해될 수 있습니다. 본문은 한국어 간접화법의 자연스러운 과거 서술에 따라 ‘곧 올 것이라고’로 옮기되, 영어 POB 감사 기록의 대안을 보존합니다.
lexical_decisions:
- source_word: παραγγελίας οὖν λαβόντες
  english_pob_choice: Therefore, after receiving instructions
  chosen_korean: 그러므로 그들은 명령을 받고
  alternatives_korean:
  - 그러므로 그들은 지시를 받고
  - 그러므로 그들은 교훈을 받고
  lexicon: παραγγελία
  rationale: παραγγελία는 단순한 조언보다 권위 있는 지시·명령의 뉘앙스를 가지므로, 문맥의 사도적 위임을 살려 ‘명령’으로 옮겼습니다.
- source_word: πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  english_pob_choice: being fully assured through the resurrection of our Lord Jesus Messiah
  chosen_korean: 우리 주 예수 메시아의 부활을 통해 충분히 확신을 얻었으며
  alternatives_korean:
  - 우리 주 예수 메시아의 부활로 완전히 확신하게 되었으며
  - 우리 주 예수 그리스도의 부활을 통해 충분히 확신을 얻었으며
  lexicon: πληροφορέω
  rationale: πληροφορηθέντες는 단순한 지식이 아니라 ‘충분히 확신하다’는 완료된 상태를 가리키므로, 한국어에서도 그 힘을 살려 표현했습니다.
- source_word: πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ
  english_pob_choice: being confirmed in the word of God
  chosen_korean: 하나님의 말씀 안에서 확증을 받은 뒤
  alternatives_korean:
  - 하나님의 말씀 안에서 확증되었으며
  - 하나님의 말씀으로 신뢰를 얻었으며
  lexicon: πιστόω
  rationale: πιστωθέντες는 ‘믿을 만하다고 인정받다/확증되다’의 뜻이어서, 수동성을 살린 ‘확증을 받은’이 가장 자연스럽고 본문에도 충실합니다.
- source_word: μετὰ πληροφορίας πνεύματος ἁγίου
  english_pob_choice: with the full assurance of the Holy Spirit
  chosen_korean: 성령의 충분한 확신 가운데
  alternatives_korean:
  - 성령의 온전한 확신 가운데
  - 성령께서 주시는 충분한 확신 가운데
  lexicon: πληροφορία
  rationale: πληροφορία는 ‘충만한 확신/확실함’이므로, ‘충분한 확신’으로 옮겨 사도적 담대함의 상태를 드러냈습니다.
- source_word: τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι
  english_pob_choice: that the kingdom of God was about to come
  chosen_korean: 하나님의 나라가 오고 있다고
  alternatives_korean:
  - 하나님의 나라가 곧 올 것이라고
  - 하나님의 나라가 오려 하고 있다고
  lexicon: μέλλειν ἔρχεσθαι
  rationale: 직접 미래를 단정하기보다 ‘곧/오고 있다’는 임박성을 살리는 것이 μέλλειν의 의미와 POB의 수정된 영어 뉘앙스에 가장 가깝습니다.
theological_decisions:
- issue: Χριστός의 한국어 처리
  chosen_reading: 예수 메시아
  alternative_readings:
  - 예수 그리스도
  - 예수 그리스도이신 분
  rationale: POB의 용례를 따라 Χριστός를 직함으로 읽어 ‘메시아’로 옮겨, 전통 교회어보다 원어의 유대-메시아적 의미를 보존했습니다.
  doctrine_reference: DOCTRINE.md messiah terminology policy
- issue: 성령의 확신 표현
  chosen_reading: 성령의 충분한 확신 가운데
  alternative_readings:
  - 성령의 충만함 가운데
  - 성령으로 인한 확신 가운데
  rationale: 본문은 단순한 감정이 아니라 성령이 매개하는 확실성/확신을 말하므로, ‘충분한 확신’으로 그 신학적 강도를 유지했습니다.
  doctrine_reference: pneumatology / assurance in apostolic proclamation
