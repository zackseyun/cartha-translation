review_pass:
  verdict: revise
  source_fidelity: 원문의 주동사 Προσέλθωμεν은 1인칭 복수 권면형이므로 ‘나아갑시다’로 명시하는 것이 적절합니다. αἴροντες와 ἀγαπῶντες는 이에 딸린 현재분사로, 손을 들고 아버지를 사랑하는 동반 태도를 나타냅니다. 초안의 ‘사랑해야 합니다’는 이를 독립적인 당위 진술로 바꾸므로 수정이 필요합니다. ἐκλογῆς μέρος는 ‘선택된/택하신 몫’으로 옮겨 선택의 의미와 μέρος의 ‘몫’ 비유를 유지했습니다.
  naturalness: ‘영혼의 거룩함 안에서’와 ‘자기 자신을 위한’은 한국어에서 다소 직역투입니다. ‘영혼의 거룩함으로’, ‘자신을 위한’으로 다듬고, 권면문의 병렬 구조를 ‘나아가며 … 사랑합시다’로 정리했습니다.
  terminology: ὁσιότης는 ‘거룩함’으로 유지했습니다. ἁγνός/ἀμίαντος의 두 표현은 ‘깨끗하고 더럽혀지지 않은’으로 구별했으며, ἐπιεικής/εὔσπλαγχνος는 존대 서술에 맞춰 ‘온유하시고 자비로우신’으로 옮겼습니다. ‘택하신 몫’은 특정 교리 체계의 용어를 강요하지 않으면서 ἐκλογῆς의 선택 의미를 반영합니다.
