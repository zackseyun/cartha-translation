revisions:
- from: 그러므로 우리는 영혼의 거룩함 안에서 그에게 나아가, 깨끗하고 더럽혀지지 않은 손을 들어 그에게 올리며, 온유하고 자비로운 우리의 아버지를 사랑해야 합니다. 그는 우리를 자기 자신을 위한 택함의 몫으로 만드셨습니다.[a]
  to: 그러므로 영혼의 거룩함으로 그에게 나아가며, 깨끗하고 더럽혀지지 않은 손을 그분께 들어 올리고, 온유하시고 자비로우신 우리의 아버지를 사랑합시다. 그분께서는 우리를 자신을 위한 택하신 몫으로 삼으셨습니다.
  rationale: 원문의 1인칭 복수 권면형과 두 현재분사의 통사적 연결을 한국어 공동 권면문으로 회복했습니다. 또한 직역투를 줄이되 ‘영혼의 거룩함’, 깨끗하고 더럽혀지지 않은 손, 온유와 자비, 선택된 몫이라는 핵심 어휘와 비유를 보존했습니다. 영어의 이전 표현에만 관련된 각주는 한국어 번역의 의미를 보충하지 않으며 앵커 위치도 맞지 않아 삭제했습니다.
