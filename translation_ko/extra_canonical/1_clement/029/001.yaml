id: 1CLEM.29.1
reference: 1 Clement 29:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Προσέλθωμεν οὖν αὐτῷ ἐν ὁσιότητι ψυχῆς, ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες πρὸς αὐτόν, ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν, ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/029/001.yaml
  text: Therefore let us come near to him in holiness of soul, lifting pure and undefiled hands to him, loving our gentle and compassionate Father, who has made us a chosen portion for himself.
  footnotes:
  - marker: a
    text: Or 'lifting up to him hands that are pure and undefiled'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 영혼의 거룩함으로 그에게 나아가며, 깨끗하고 더럽혀지지 않은 손을 그분께 들어 올리고, 온유하시고 자비로우신 우리의 아버지를 사랑합시다. 그분께서는 우리를 자신을 위한 택하신 몫으로 삼으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέλθωμεν οὖν αὐτῷ
  english_pob_choice: Therefore let us come near to him
  chosen_korean: 그러므로 우리는 그에게 나아가
  alternatives_korean:
  - 그러므로 우리는 그에게 가까이 나아가
  - 그러므로 우리는 그에게 나아갑시다
  lexicon: προσέρχομαι
  rationale: 공동 권면의 초청을 살리되, 문맥상 권면형을 한국어 서술형으로 자연스럽게 옮겼습니다.
- source_word: ἐν ὁσιότητι ψυχῆς
  english_pob_choice: in holiness of soul
  chosen_korean: 영혼의 거룩함 안에서
  alternatives_korean:
  - 혼의 거룩함 안에서
  - 영의 거룩함 안에서
  lexicon: ὁσιότης / ψυχή
  rationale: ψυχή를 여기서는 인간 내면 전체를 가리키는 말로 보고 ‘영혼’으로 옮겼으며, ‘거룩함 안에서’로 전치사구의 방식도 살렸습니다.
- source_word: ἁγνὰς καὶ ἀμιάντους χεῖρας αἴροντες
  english_pob_choice: lifting pure and undefiled hands
  chosen_korean: 깨끗하고 더럽혀지지 않은 손을 들어
  alternatives_korean:
  - 순결하고 더럽혀지지 않은 손을 들어
  - 깨끗하고 흠 없는 손을 들어
  lexicon: ἁγνός / ἀμίαντος / χείρ
  rationale: 두 형용사의 중첩을 한국어의 병렬로 반영하고, ‘손을 들어’로 동작을 자연스럽게 유지했습니다.
- source_word: ἀγαπῶντες τὸν ἐπιεικῆ καὶ εὔσπλαγχνον πατέρα ἡμῶν
  english_pob_choice: loving our gentle and compassionate Father
  chosen_korean: 온유하고 자비로운 우리의 아버지를 사랑하며
  alternatives_korean:
  - 관대한 우리의 아버지를 사랑하며
  - 유순하고 긍휼이 많은 우리의 아버지를 사랑하며
  lexicon: ἐπιεικής / εὔσπλαγχνος
  rationale: ἐπιεικής의 핵심을 ‘온유한’으로, εὔσπλαγχνος를 ‘자비로운’으로 옮겨 정서적·윤리적 뉘앙스를 함께 살렸습니다.
- source_word: ὃς ἐκλογῆς μέρος ἡμᾶς ἐποίησεν ἑαυτῷ
  english_pob_choice: who has made us a chosen portion for himself
  chosen_korean: 그는 우리를 자기 자신을 위한 택함의 몫으로 만드셨습니다
  alternatives_korean:
  - 그는 우리를 자신을 위한 선택된 몫으로 만드셨습니다
  - 그는 우리를 자기 것을 이루는 택한 몫으로 만드셨습니다
  lexicon: ἐκλογῆς μέρος
  rationale: μέρος를 단순히 ‘부분’보다 공동체적·분배적 의미가 드러나는 ‘몫’으로 옮기고, ἐκλογῆς는 선택의 결과로서 ‘택함’으로 반영했습니다.
theological_decisions:
- issue: 권면형 공동호칭의 한국어 문체
  chosen_reading: 본문 전체를 공동체를 향한 권면으로 보고, ‘나아갑시다’ 대신 현대 합쇼체 서술형 권면인 ‘나아가… 사랑해야 합니다’로 정리했습니다.
  alternative_readings:
  - '직설적 권유형: ‘나아갑시다’'
  - '명령형: ‘나아가십시오’'
  rationale: 원문의 1인칭 복수 접속법 권면을 한국어에서 과도하게 강요적이지 않으면서도 공동체적 결단으로 들리게 하기 위함입니다.
  doctrine_reference: 공동 권면 문체의 균형
