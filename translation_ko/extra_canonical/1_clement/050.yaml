base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/050.yaml
  text: See[a], beloved, how great and marvelous love is, and there is no explaining its perfection. Who is sufficient to be found in it[b], except those whom God may count worthy? Therefore let us beg and ask from his mercy that we may be found in love, without human partiality, blameless. All the generations from Adam until this day have passed away, but those who were perfected in love according to the grace of God have a place among the godly, and they will be revealed in the visitation of the kingdom of Messiah. For it is written, “Enter into your inner chambers for a very little while, until my wrath and anger pass by; and I will remember a good day, and I will raise you from your tombs.” Blessed are we, beloved, if we do the commandments of God in the harmony of love, so that through love our sins may be forgiven us. For it is written, “Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man whose sin the Lord will certainly not reckon, and
    in whose mouth there is no deceit.” This blessing, then, came upon those chosen by God through Jesus Messiah our Lord, to whom be the glory forever and ever[c][d][e][f]. Amen.
  footnotes:
  - marker: a
    text: The phrase 'visitation of the kingdom of the Messiah' may also be understood as the appearing or eschatological manifestation of the kingdom.
    reason: alternative_reading
    anchor_ref: '50:3'
  - marker: b
    text: The citation echoes Isa 26:20 and combines language resembling resurrection hope; the wording here follows Clement's form of the citation.
    reason: cross_reference
    anchor_ref: '50:4'
  - marker: f
    text: Or 'in unity of love' for 'in the harmony of love.'
    reason: lexical_alternative
    anchor_ref: '50:5'
  - marker: e
    text: Quoted from Ps 32:1–2(31:1–2 LXX), with the final clause reflecting the Greek scriptural form familiar in early Christian usage.
    reason: cross_reference
    anchor_ref: '50:6'
  - marker: d
    text: Or 'and of its perfection there is no explanation.'.
    reason: previous_rendering
  - marker: c
    text: Or 'whose lawless deeds were forgiven, and whose sins were covered'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 여러분, 사랑이 얼마나 크고 놀라운지 보십시오. 그 완전성에 대해서는 설명할 길이 없습니다. 하나님께서 합당하다고 여기시는 이들 외에, 누가 그 안에서 발견될 수 있겠습니까? 그러므로 우리는 그분의 긍휼에서 간구하고 청하여, 사람의 편파성 없이 사랑 안에서 흠 없이 발견되도록 합시다. 아담으로부터 오늘에 이르기까지 모든 세대는 지나갔지만, 하나님의 은혜를 따라 사랑 안에서 온전하게 된 이들은 경건한 이들 가운데 설 자리를 얻었고, 메시아의 나라의 임재 때에 나타날 것입니다[a]. 기록되기를, 「잠시 동안 내 골방으로 들어가라. 내 진노와 분노가 지나가기까지, 내가 선한 날을 기억하겠고, 너희를 너희 무덤에서 일으키겠다」 하였습니다[b]. 사랑하는 여러분, 우리가 사랑의 조화 속에서 하나님의 계명을 지키면 우리는 복됩니다. 그러면 사랑으로 말미암아 우리의 죄가 우리에게 용서될 것이기 때문입니다. 또 기록되기를, 「법 없는 행위가 사함을 받고, 죄가 가려진 이들은 복되다. 주께서 그 죄를 결코 헤아리지 않으실 사람은 복되며, 그의 입에는 속임이 없다」 하였습니다[c][d][e]. 그러므로 이 복은 예수 메시아 우리 주를 통하여 하나님께 선택받은 이들 위에 임하였으니, 영광이 영원무궁하도록 그분께 있습니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  english_pob_choice: love
  chosen_korean: 사랑
  alternatives_korean:
  - 자비
  - 애정
  lexicon: BDAG
  rationale: 본문 전체의 핵심어로 반복되므로, 프로젝트 기본어인 ‘사랑’을 유지해 수사적 응집을 살렸습니다.
- source_word: ἐξήγησις
  english_pob_choice: explanation
  chosen_korean: 설명할 길이 없습니다
  alternatives_korean:
  - 설명할 수 없습니다
  - 해석할 수 없습니다
  lexicon: LSJ
  rationale: ‘완전성에 대한 설명이 없다’는 뜻을 현대 한국어의 자연스러운 부정 표현으로 옮겼습니다.
- source_word: δίχα προσκλίσεως ἀνθρωπίνης
  english_pob_choice: without human partiality
  chosen_korean: 사람의 편파성 없이
  alternatives_korean:
  - 사람의 편애 없이
  - 사람의 편견 없이
  lexicon: LSJ
  rationale: 인간 쪽의 치우침을 뜻하므로, 교회적 관용어보다 본문의 윤리적 뉘앙스를 드러내는 표현을 택했습니다.
- source_word: ἐπισκοπῇ τῆς βασιλείας τοῦ Χριστοῦ
  english_pob_choice: visitation of the kingdom of Messiah
  chosen_korean: 메시아의 나라의 임재 때
  alternatives_korean:
  - 메시아의 나라의 방문 때
  - 메시아의 나라가 나타날 때
  lexicon: BDAG
  rationale: ἐπισκοπή의 종말론적 ‘방문/나타남’ 의미를 살리되, 한국어에서는 ‘임재’가 그 긴장을 가장 자연스럽게 전달합니다.
- source_word: Χριστοῦ
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: 프로젝트 기본어에 따라 τίτλος로 기능하는 Χριστός는 ‘메시아’로 옮겼습니다.
- source_word: ἀνομίαι
  english_pob_choice: lawless deeds
  chosen_korean: 법 없는 행위
  alternatives_korean:
  - 불법 행위
  - 무법의 행위
  lexicon: BDAG
  rationale: 시편 인용의 구체성을 살리기 위해 전통적 추상어보다 ‘법 없는 행위’로 직역에 가깝게 옮겼습니다.
- source_word: λογίσηται
  english_pob_choice: reckon
  chosen_korean: 헤아리지 않으실
  alternatives_korean:
  - 계산하지 않으실
  - 기록하지 않으실
  lexicon: BDAG
  rationale: 회계적·법정적 뉘앙스를 유지하면서 한국어 성경 문체로도 자연스럽게 표현했습니다.
theological_decisions:
- issue: Psalm 32 인용의 시제와 상태성
  chosen_reading: ‘사함을 받고… 가려진 이들은 복되다’로 현재적 복의 상태를 드러냈습니다.
  alternative_readings:
  - ‘사함을 받았다’로 단순 과거 처리
  - ‘사함을 받은 자들은 복되다’로 완전 과거화
  rationale: 그리스어 aorist는 여기서 사건 보고보다 복의 상태를 선언하는 성격이 강하므로, 한국어에서도 결과 상태를 드러내도록 했습니다.
  doctrine_reference: 시 32:1–2 인용의 문법-신학적 상태성 보존
- issue: Χριστός의 번역
  chosen_reading: 제목으로 기능하는 곳은 ‘메시아’로 옮겼습니다.
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: 본문의 종말론적·칭호적 용례를 살려 프로젝트 기본어를 따랐습니다. 다만 인명화된 고유명사적 사용이 아니라서 ‘메시아’가 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: titles are translated when context supports'
