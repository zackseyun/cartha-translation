base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/002.yaml
  text: Let him say[a], ‘If because of me there is faction and strife and divisions, I withdraw, I depart wherever you wish, and I will do what is commanded by the multitude. Only let the flock of Messiah live in peace with the appointed elders.’
  footnotes:
  - marker: a
    text: Or 'with the elders who have been appointed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 이렇게 말해야 합니다. ‘만일 나로 인해 분쟁과 다툼과 분열이 일어난다면, 나는 물러나고, 여러분이 원하는 어디로든 떠나며, 민중이 명하는 것을 행하겠습니다. 다만 그리스도의 양 떼는 임명된 장로들과 함께 평화 가운데 살아야 합니다.’[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπάτω
  english_pob_choice: Let him say
  chosen_korean: 그는 이렇게 말해야 합니다
  alternatives_korean:
  - 그는 말해야 합니다
  - 그가 말하게 하십시오
  lexicon: λέγω/εἶπον
  rationale: 명령형적 권고를 한국어에서 자연스럽게 옮기기 위해 ‘말해야 합니다’로 풀었고, 직접 명령보다 간접 지시의 뉘앙스를 살렸습니다.
- source_word: στάσις καὶ ἔρις καὶ σχίσματα
  english_pob_choice: faction and strife and divisions
  chosen_korean: 분쟁과 다툼과 분열
  alternatives_korean:
  - 당파와 다툼과 갈라짐
  - 분열과 논쟁과 파벌
  lexicon: στάσις / ἔρις / σχίσμα
  rationale: 세 명사의 병렬을 살리되 한국어에서 의미가 겹치지 않도록 ‘분쟁·다툼·분열’로 대응했습니다.
- source_word: ἐκχωρῶ, ἄπειμι
  english_pob_choice: I withdraw, I depart
  chosen_korean: 나는 물러나고, ... 떠나며
  alternatives_korean:
  - 나는 물러가고, ... 떠나며
  - 나는 철수하고, ... 가며
  lexicon: ἐκχωρέω / ἄπειμι
  rationale: 두 동사의 연속 동작을 중복 없이 자연스럽게 표현하되, 자진해서 자리를 비우는 의미를 유지했습니다.
- source_word: ὑπὸ τοῦ πλήθους
  english_pob_choice: by the multitude
  chosen_korean: 민중이 명하는 것
  alternatives_korean:
  - 무리가 명하는 것
  - 다수의 명령
  lexicon: πλῆθος
  rationale: 본문의 ‘많은 사람/다수’ 의미를 살리면서, 절의 요구 사항인 ‘명하는’과 연결해 지시 주체를 분명히 했습니다.
- source_word: τὸ ποίμνιον τοῦ Χριστοῦ
  english_pob_choice: the flock of Messiah
  chosen_korean: 그리스도의 양 떼
  alternatives_korean:
  - 메시아의 양 떼
  - 그리스도의 무리
  lexicon: ποιμνίον / Χριστός
  rationale: 그리스어 Χριστός는 전형적 호칭이 아닌 본문상의 고유 결합으로 보아 한국 교회 독자에게 익숙한 ‘그리스도’로 옮겼습니다.
- source_word: τῶν καθεσταμένων πρεσβυτέρων
  english_pob_choice: the appointed elders
  chosen_korean: 임명된 장로들과
  alternatives_korean:
  - 세워진 장로들과
  - 임명받은 장로들과
  lexicon: καθίστημι / πρεσβύτερος
  rationale: ‘appointed elders’의 수동 분사 의미를 그대로 살려 ‘임명된’으로 옮겼고, πρεσβύτεροι는 교회 직분 맥락에 맞는 ‘장로들’로 번역했습니다.
theological_decisions:
- issue: 그리스도 호칭의 처리
  chosen_reading: Χριστός를 본문에서는 ‘그리스도’로 유지했습니다.
  alternative_readings:
  - 메시아
  - 그리스도 예수
  rationale: 이 절의 Χριστός는 일반 호칭이라기보다 교회 전승 속 고정 결합에 가깝고, 한국어 독자에게 자연스러운 직접 대응은 ‘그리스도’입니다.
  doctrine_reference: 호칭의 문맥적 등가성과 1 Clement의 후기 교회 어휘 사용
