id: 1CLEM.54.3
reference: 1 Clement 54:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τοῦτο ὁ ποιήσας ἑαυτῷ μέγα κλέος ἐν Χριστῷ περιποιήσεται, καὶ πᾶς τόπος δέξεται αὐτόν. τοῦ γὰρ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/003.yaml
  text: The one who does this will obtain for himself great renown in Messiah[a], and every place will receive him. For the earth is the Lord’s, and its fullness.
  footnotes:
  - marker: a
    text: Or 'The man who has done this'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 일을 한 이는 메시아 안에서 큰 명성을 얻게 될 것이며, 어디에서나 그를 받아들일 것입니다. 참으로 땅은 주님의 것이며, 그 안에 있는 모든 것도 주님의 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ποιήσας τοῦτο
  english_pob_choice: The one who does this
  chosen_korean: 이것을 행하는 자
  alternatives_korean:
  - 이것을 하는 사람
  - 이 일을 하는 자
  lexicon: ποιέω
  rationale: 부정관사적 분사구문은 행위의 조건을 나타내므로, 현대 문체에서 자연스럽고 포괄적인 ‘행하는 자’로 옮겼습니다.
- source_word: μέγα κλέος
  english_pob_choice: great renown
  chosen_korean: 큰 명성
  alternatives_korean:
  - 큰 영광
  - 큰 명예
  lexicon: κλέος
  rationale: κλέος는 단순한 명예보다 널리 알려진 명성과 명성에 가깝기 때문에, 과장 없이도 공적 평판을 드러내는 ‘큰 명성’을 택했습니다.
- source_word: ἐν Χριστῷ
  english_pob_choice: in Messiah
  chosen_korean: 메시아 안에서
  alternatives_korean:
  - 그리스도 안에서
  - 메시아 안에
  lexicon: Χριστός
  rationale: POB의 표준 용례에 따라 Χριστός를 ‘메시아’로 옮기고, ἐν은 관계적 결합을 나타내므로 ‘안에서’로 번역했습니다.
- source_word: τὸ πλήρωμα αὐτῆς
  english_pob_choice: its fullness
  chosen_korean: 그 안에 가득한 모든 것
  alternatives_korean:
  - 그 충만
  - 그 풍성함
  lexicon: πλήρωμα
  rationale: 문맥상 땅의 ‘충만’은 추상어보다 그 안에 채워진 전부를 가리키므로, 한국어에서 의미가 분명한 표현으로 풀어 옮겼습니다.
theological_decisions:
- issue: “주”의 표기와 시편 인용의 소유 개념
  chosen_reading: ‘주님의 것’으로 옮겨, 본문의 소유 선언을 현대 한국어에서 분명하게 드러냈습니다.
  alternative_readings:
  - ‘주께 속한 것이다’
  - ‘야훼의 것이다’
  rationale: 여기서는 직접 인용된 성구의 선언문을 자연스럽게 전달하는 것이 우선이며, 본문 자체는 κύριος를 사용하므로 문맥상 ‘주님’으로 유지했습니다.
  doctrine_reference: Psalm 24:1 / 1 Corinthians 10:26
