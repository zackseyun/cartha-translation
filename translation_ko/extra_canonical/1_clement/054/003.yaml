revisions:
- from: 이것을 행하는 자는 메시아 안에서 큰 명성을 얻을 것이며, 모든 곳이 그를 받아들일 것입니다. 참으로 땅은 주님의 것이고, 그 안에 가득한 모든 것도 그렇습니다.[a]
  to: 이 일을 한 이는 메시아 안에서 큰 명성을 얻게 될 것이며, 어디에서나 그를 받아들일 것입니다. 참으로 땅은 주님의 것이며, 그 안에 있는 모든 것도 주님의 것입니다.
  rationale: 원문의 부정과거 분사가 가리키는 완료된 행위를 ‘이 일을 한 이’로 명확히 하고, 분배적 표현을 자연스러운 한국어로 다듬었습니다. 영어 표현에만 관련된 성별 대안 각주는 한국어 본문에 적용되지 않으므로 앵커와 함께 حذف했습니다. 나머지 핵심 용어와 소유 선언의 의미는 유지했습니다.
