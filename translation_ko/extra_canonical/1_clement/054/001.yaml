translation:
  language: ko
  text: 그렇다면 너희 가운데 누가 고결합니까? 누가 동정심이 많습니까? 누가 사랑으로 가득합니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναῖος
  english_pob_choice: noble
  chosen_korean: 고결한
  alternatives_korean:
  - 고상한
  - 품격 있는
  - 귀한
  lexicon: γενναῖος
  rationale: 인격의 고귀함과 품위를 가리키므로, 단순한 사회적 귀족 신분보다 도덕적·인격적 뉘앙스를 살려 '고결한'으로 옮겼습니다.
- source_word: εὔσπλαγχνος
  english_pob_choice: compassionate
  chosen_korean: 동정심이 많은
  alternatives_korean:
  - 측은한
  - 자비로운
  - 연민이 깊은
  lexicon: εὔσπλαγχνος
  rationale: 내장을 뜻하는 어근에서 나온 ‘깊은 연민’의 뜻을 한국어에서 자연스럽게 드러내기 위해 ‘동정심이 많은’으로 옮겼습니다.
- source_word: πεπληροφορημένος ἀγάπης
  english_pob_choice: filled with love
  chosen_korean: 사랑으로 가득한
  alternatives_korean:
  - 사랑으로 충만한
  - 사랑으로 완전히 채워진
  - 사랑에 확신이 있는
  lexicon: πληροφορέω + ἀγάπη
  rationale: 여기서는 ἀγάπης가 내용격 속격으로 작용하므로 ‘사랑 안에서 확신한’이 아니라 ‘사랑으로 가득한’이 원문과 영어 POB의 수정 반영에 맞습니다.
theological_decisions:
- issue: πληροφορέω의 의미 범위
  chosen_reading: ‘사랑으로 가득한’으로 번역해 인격의 내적 충만을 드러냈습니다.
  alternative_readings:
  - ‘사랑에 완전히 확신한’
  - ‘사랑으로 충분히 보증된’
  rationale: 이 구절의 구조는 ‘확신하다’보다 ‘가득 채워지다’의 의미가 더 적절하며, 문맥상 사랑의 충만한 성향을 묘사합니다.
  doctrine_reference: source-language syntax and BDAG sense cited in audit trail
