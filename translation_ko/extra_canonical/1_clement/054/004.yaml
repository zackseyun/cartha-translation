  lexicon: ἀμεταμέλητος + πολιτεία
  rationale: ἀμεταμέλητος는 '회개하지 않은'이 아니라 '후회할 필요가 없는/후회 없는'의 뜻이므로, πολιτεία를 '시민권'보다 '삶의 방식'으로 옮겨 문맥을 살렸습니다.
- source_word: τοῦ θεοῦ
