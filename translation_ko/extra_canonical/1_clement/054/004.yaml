language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οἱ πολιτευόμενοι τὴν ἀμεταμέλητον πολιτείαν τοῦ θεοῦ ἐποίησαν καὶ ποιήσουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/054/004.yaml
  text: These things those who live in God's unrepented way of life have done and will do[a].
  footnotes:
  - marker: a
    text: Or 'live out the unrepented citizenship'.
    reason: previous_rendering
translation:
  language: ko
  text: 이런 것들을 하나님의 후회 없는 삶의 방식을 따라 사는 이들이 행해 왔고 또 행할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: These things
  chosen_korean: 이런 것들
  alternatives_korean:
  - 이 일들
  - 이것들
  lexicon: ταῦτα
  rationale: 지시 대명사의 범위를 자연스럽게 받되, 문맥상 앞선 행위들을 가리키는 복수 표현으로 옮겼습니다.
- source_word: οἱ πολιτευόμενοι
  english_pob_choice: those who live in
  chosen_korean: '...따라 사는 이들'
  alternatives_korean:
  - '...가운데 사는 이들'
  - '...시민으로 살아가는 이들'
  lexicon: πολιτεύομαι
  rationale: 본문의 πολιτεία와 결합한 관용구로서 단순한 거주가 아니라 삶의 방식대로 행하는 뜻을 살렸습니다.
- source_word: τὴν ἀμεταμέλητον πολιτείαν
  english_pob_choice: God's unrepented way of life
  chosen_korean: 후회 없는 삶의 방식
  alternatives_korean:
  - 후회되지 않는 삶의 방식
  - 회개하지 않은 시민권
  lexicon: ἀμεταμέλητος + πολιτεία
  rationale: ἀμεταμέλητος는 '회개하지 않은'이 아니라 '후회할 필요가 없는/후회 없는'의 뜻이므로, πολιτεία를 '시민권'보다 '삶의 방식'으로 옮겨 문맥을 살렸습니다.
- source_word: τοῦ θεοῦ
  english_pob_choice: God's
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님의
  - 하나님에 속한
  lexicon: θεός
  rationale: 소유격을 자연스럽게 드러내며, POB 기본 용례에 따라 Θεός는 하나님으로 옮겼습니다.
theological_decisions:
- issue: ἀμεταμέλητον의 신학적 뉘앙스
  chosen_reading: 도덕적으로 후회할 필요가 없는, 하나님께 속한 올바른 삶의 방식
  alternative_readings:
  - 회개하지 않은 삶의 방식
  - 죄를 뉘우치지 않는 삶의 방식
  rationale: 문맥은 악의 지속이 아니라 의로운 삶의 확정성을 말하므로, '회개하지 않은'은 의미를 거꾸로 만들 수 있어 배제했습니다.
  doctrine_reference: 문맥 기반 의미 결정; ἀμεταμέλητος의 일반 사전 의미(후회 없는/철회할 필요 없는) 반영
