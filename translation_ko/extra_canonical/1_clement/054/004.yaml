  lexicon: πολιτεύομαι
  rationale: 본문의 πολιτεία와 결합한 관용구로서 단순한 거주가 아니라 삶의 방식대로 행하는 뜻을 살렸습니다.
- source_word: τὴν ἀμεταμέλητον πολιτείαν
  english_pob_choice: God's unrepented way of life
  chosen_korean: 후회 없는 삶의 방식
  alternatives_korean:
