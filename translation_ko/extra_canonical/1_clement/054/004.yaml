  rationale: 문맥은 악의 지속이 아니라 의로운 삶의 확정성을 말하므로, '회개하지 않은'은 의미를 거꾸로 만들 수 있어 배제했습니다.
  doctrine_reference: 문맥 기반 의미 결정; ἀμεταμέλητος의 일반 사전 의미(후회 없는/철회할 필요 없는) 반영
