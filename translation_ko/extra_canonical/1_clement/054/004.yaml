  - 하나님의
  - 하나님에 속한
  lexicon: θεός
  rationale: 소유격을 자연스럽게 드러내며, POB 기본 용례에 따라 Θεός는 하나님으로 옮겼습니다.
theological_decisions:
- issue: ἀμεταμέλητον의 신학적 뉘앙스
  chosen_reading: 도덕적으로 후회할 필요가 없는, 하나님께 속한 올바른 삶의 방식
  alternative_readings:
