translation:
  language: ko
  text: 이런 것들을 하나님께 속한, 후회할 것이 없는 삶의 방식을 살아가는 이들이 행했고 또 행할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “후회할 것이 없는 하나님의 시민권을 살아가는 이들.” 여기서 ‘시민권’은 정치적 지위 자체보다 삶의 방식이나 행실을 가리킵니다.
    reason: πολιτεύομαι와 πολιτεία의 시민적 어근을 반영하는 대안적 직역을 제시하되, 본문의 문맥상 의미가 삶의 방식임을 밝혔습니다.
