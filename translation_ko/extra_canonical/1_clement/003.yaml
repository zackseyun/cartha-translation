base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003.yaml
  text: 'All glory and abundance were given to you[a], and what is written was fulfilled: “He ate and drank, and became broad and fat, and the beloved one kicked.”


    2 From this came jealousy and envy, strife and sedition, persecution and disorder, war and captivity. 3 Thus the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders. 4 Because of this, righteousness and peace have departed far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Messiah, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[d][c][b], through which death also entered into the world.'
  footnotes:
  - marker: a
    text: The quotation echoes Deuteronomy 32:15, adapted in wording. The image is of prosperity leading to arrogant resistance.
    reason: cross_reference
  - marker: b
    text: Or “became short-sighted in his faithfulness to him.” The Greek πίστις can denote both faith and faithfulness.
    reason: lexical_alternative
  - marker: c
    text: “Messiah” translates Χριστός as a title here; traditional English often has “Christ.”
    reason: lexical_alternative
  - marker: d
    text: The line about death entering the world likely evokes biblical patterns linking envy and violence, especially Cain.
    reason: cross_reference
translation:
  language: ko
  text: '모든 영광과 풍성함이 여러분에게 주어졌고, 기록된 말씀이 이루어졌습니다. 「그는 먹고 마셨으며, 살이 찌고 비대해졌으며, 사랑받는 자가 발길질하였습니다.」


    2 이것으로 인해 질투와 시기, 다툼과 분열, 박해와 무질서, 전쟁과 포로됨이 생겨났습니다. 3 이처럼 불명예스러운 자들이 존귀한 자들을 대적하고, 영광 없는 자들이 영광스러운 자들을 대적하며, 어리석은 자들이 분별 있는 자들을 대적하고, 젊은이들이 장로들을 대적하였습니다. 4 그러므로 의와 평강은 멀리 떠났습니다. 각 사람이 하나님을 두려워하는 마음을 버리고 그에 대한 믿음에서 눈이 어두워졌으며, 그의 계명의 규례들 안에서 걷지도 않고, 메시아에게 합당한 방식으로도 행하지 않았습니다. 오히려 각 사람이 자기 악한 마음의 욕망을 따라가며, 불의하고 불경건한 질투를 받아들였고, 그로 말미암아 죽음도 세상에 들어왔습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλατυσμὸς
  english_pob_choice: abundance
  chosen_korean: 풍성함
  alternatives_korean:
  - 풍요
  - 번성
  - 넉넉함
  lexicon: LSJ
  rationale: δόξα와 나란히 놓인 표현이며 신명기 32:15의 번영 이미지를 반영하므로, 단순한 양적 ‘넉넉함’보다 번영의 충만함을 살리는 ‘풍성함’이 적절합니다.
- source_word: ἐπλατύνθη καὶ ἐπαχύνθη
  english_pob_choice: became broad and fat
  chosen_korean: 살이 찌고 비대해졌으며
  alternatives_korean:
  - 넓어지고 살이 쪘으며
  - 넓고 살찐 상태가 되었으며
  - 살이 불고 비대해졌으며
  lexicon: LSJ
  rationale: 히브리어 성경의 생생한 신체적 은유를 살리되, 현대 한국어에서 이해되는 자연스러운 표현으로 옮겼습니다.
- source_word: ἀπελάκτισεν
  english_pob_choice: kicked
  chosen_korean: 발길질하였습니다
  alternatives_korean:
  - 발로 차버렸습니다
  - 차고 버텼습니다
  - 반항하였습니다
  lexicon: LSJ
  rationale: 직접적인 동작 이미지를 유지해 ‘배반/반항’으로 추상화하지 않고, 본문의 거친 반응을 드러내는 표현을 택했습니다.
- source_word: πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ
  english_pob_choice: conducting himself in a manner fitting for Christ
  chosen_korean: 메시아에게 합당한 방식으로도 행하지 않았습니다
  alternatives_korean:
  - 그리스도께 합당하게도 행하지 않았습니다
  - 메시아에 걸맞게도 살지 않았습니다
  - 메시아답게도 살지 않았습니다
  lexicon: LSJ
  rationale: Χριστός의 호칭적 의미를 살려 ‘메시아’를 유지했고, πολιτεύεσθαι는 시민권보다 삶의 태도에 가까우므로 ‘행하다’로 풀었습니다.
- source_word: νόμoις τῶν προσταγμάτων αὐτοῦ
  english_pob_choice: the ordinances of his commandments
  chosen_korean: 그의 계명의 규례들
  alternatives_korean:
  - 그의 계명의 명령들
  - 그의 계명의 법도들
  - 그의 계명에 따른 규례들
  lexicon: LSJ
  rationale: 중첩 구조를 자연스럽게 한국어로 풀어, 보호적·규범적 의미가 살아 있는 ‘규례들’로 옮겼습니다.
- source_word: ἄδοξοι / ἐνδόξοι
  english_pob_choice: inglorious / glorious
  chosen_korean: 영광 없는 자들 / 영광스러운 자들
  alternatives_korean:
  - 불명예스러운 자들 / 영광스러운 자들
  - 천한 자들 / 영광스러운 자들
  - 영예 없는 자들 / 영광스러운 자들
  lexicon: LSJ
  rationale: δόξα 어근의 대조를 한국어에서도 드러내기 위해 ‘영광 없는’과 ‘영광스러운’을 대응시켰습니다.
- source_word: ἀμβλυωπῆσαι
  english_pob_choice: became dim-sighted
  chosen_korean: 눈이 어두워졌으며
  alternatives_korean:
  - 분별력이 흐려졌으며
  - 시력이 흐려졌으며
  - 희미하게 보게 되었으며
  lexicon: LSJ
  rationale: 단순한 신체적 실명보다 믿음의 분별 상실을 암시하는 은유를 살리기 위해 관용적인 ‘눈이 어두워지다’를 선택했습니다.
theological_decisions:
- issue: ἑκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι
  chosen_reading: 각 사람이 하나님을 두려워하는 마음을 버리고 그에 대한 믿음에서 눈이 어두워졌습니다
  alternative_readings:
  - 각 사람이 하나님의 두려움에서 멀어지고 그에 대한 신실함에서 둔해졌습니다
  - 각 사람이 하나님을 경외하는 마음과 믿음에서 흐려졌습니다
  rationale: πίστις는 믿음과 신실함의 긴장을 지니지만, 본문 문맥상 하나님을 향한 신앙의 쇠퇴를 가리키므로 기본어 ‘믿음’을 유지하되 각주로 여지를 남깁니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
- issue: κατὰ τὸ καλῆκον τῷ Χριστῷ
  chosen_reading: 메시아에게 합당한 방식
  alternative_readings:
  - 그리스도께 합당한 방식
  - 메시아답게
  rationale: 본문의 Χριστός는 직함으로 기능하므로, 프로젝트 기본 원칙에 따라 ‘메시아’로 번역해 호칭적 의미를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
