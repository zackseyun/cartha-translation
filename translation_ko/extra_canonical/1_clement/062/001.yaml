  to: 우리의 종교에 관련된 일들과, 경건하고 의롭게 삶을 이끌어 가고자 하는 사람들에게 덕 있는 삶을 위해 가장 유익한 일들에 관하여, 우리는 여러분에게 충분히 써 보냈습니다, 형제 여러분.
