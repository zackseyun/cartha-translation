id: 1CLEM.62.1
reference: 1 Clement 62:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Περὶ μὲν τῶν ἀνηκόντων τῇ θρησκείᾳ ἡμῶν καὶ τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν, ἱκανῶς ἐπεστείλαμεν ὑμῖν, ἄνδρες ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/001.yaml
  text: Now concerning the matters that pertain to our religion, and that are most beneficial for a virtuous life to those who desire to order their way in piety and righteousness, we have written to you sufficiently, brothers.
translation:
  language: ko
  text: 우리 종교에 속한 일들과, 경건과 의로 자기의 길을 바르게 가고자 하는 사람들에게 가장 유익한 일들에 관해서는, 형제 여러분께 충분히 써 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ θρησκείᾳ ἡμῶν
  english_pob_choice: our religion
  chosen_korean: 우리 종교
  alternatives_korean:
  - 우리 신앙
  - 우리 예배
  - 우리 경건
  lexicon: θρησκεία
  rationale: 여기서는 공동체의 종교적 실천과 소속을 가리키므로, POB의 영어 선택을 따라 ‘종교’로 옮기는 것이 가장 직접적입니다.
- source_word: τῶν ὠφελιμωτάτων εἰς ἐνάρετον βίον
  english_pob_choice: the matters ... most beneficial for a virtuous life
  chosen_korean: 가장 유익한 일들
  alternatives_korean:
  - 가장 유익한 것들
  - 덕 있는 삶에 가장 도움이 되는 것들
  - 유익이 가장 큰 사항들
  lexicon: ὠφελιμώτατος / εἰς ἐνάρετον βίον
  rationale: 원문의 최상급 유익함을 살리되 한국어에서는 자연스럽게 ‘가장 유익한 일들’로 압축해, 뒤의 설명구와 호응하도록 했습니다.
- source_word: τοῖς θέλουσιν εὐσεβῶς καὶ δικαίως διευθύνειν
  english_pob_choice: to those who desire to order their way in piety and righteousness
  chosen_korean: 경건과 의로 자기의 길을 바르게 가고자 하는 사람들에게
  alternatives_korean:
  - 경건과 의로 자기 삶을 바로잡고자 하는 사람들에게
  - 경건하게 और 의롭게 자기의 길을 인도하고자 하는 이들에게
  - 경건과 의로 살고자 하는 사람들에게
  lexicon: εὐσεβῶς / δικαίως / διευθύνειν
  rationale: 동사의 ‘이끌다/바르게 하다’ 의미를 살려 ‘자기의 길을 바르게 가고자 하는’으로 옮기고, 두 부사를 각각 ‘경건과 의로’ 대응시켰습니다.
- source_word: ἱκανῶς ἐπεστείλαμεν ὑμῖν
  english_pob_choice: we have written to you sufficiently
  chosen_korean: 충분히 써 보냈습니다
  alternatives_korean:
  - 충분히 써 드렸습니다
  - 이미 충분히 적어 보내었습니다
  - 충분히 편지했습니다
  lexicon: ἱκανῶς / ἐπιστέλλω
  rationale: ἐπιστέλλω는 단순한 ‘쓰다’보다 ‘편지를 보내다’의 뉘앙스가 있어, 서신 문맥을 드러내는 ‘써 보냈습니다’가 적절합니다.
theological_decisions:
- issue: θρησκεία의 의미 범위
  chosen_reading: ‘종교’로 번역해 공동체의 신앙 실천 전체를 가리키는 문맥을 유지했습니다.
  alternative_readings:
  - ‘예배’로 한정
  - ‘신앙’으로 완화
  rationale: 본문은 개인의 내면 신앙보다 공동체가 공유하는 종교적 삶 전체를 말하므로, 더 좁은 표현으로 축소하지 않았습니다.
  doctrine_reference: 문맥 우선의 어휘 선택
- issue: εὐσεβῶς καὶ δικαίως의 윤리적 균형
  chosen_reading: ‘경건과 의로’의 병렬을 유지했습니다.
  alternative_readings:
  - ‘경건하게 그리고 의롭게’
  - ‘경건함과 올바름으로’
  rationale: 두 부사의 병렬 구조를 보존해야 저자가 말하는 삶의 두 축—하나님께 대한 경건과 사람들 앞의 의—이 함께 드러납니다.
  doctrine_reference: 윤리적 병렬성 보존
