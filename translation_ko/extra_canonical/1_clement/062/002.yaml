id: 1CLEM.62.2
reference: 1 Clement 62:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: περὶ γὰρ πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς πάντα τόπον ἐψηλαφήσαμεν, ὑπομιμνήσκοντες δεῖν ὑμᾶς ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ τῷ παντοκράτορι θεῷ ὁσίως εὐαρεστεῖν, ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας, καθὼς καὶ οἱ προδεδηλωμένοι πατέρες ἡμῶν εὐηρέστησαν ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/002.yaml
  text: For concerning faith and repentance and genuine love and self-control and sound-mindedness and endurance[a], we have touched on every point, reminding you that you ought to please Almighty God devoutly in righteousness and truth and longsuffering, being of one mind, free from resentment, in love and peace with earnest gentleness, just as also our fathers, who were spoken of before, were well-pleasing to him, humbling themselves before the Father and God and Creator and all people.
  footnotes:
  - marker: a
    text: Or 'please the Almighty God in holiness, in righteousness and truth and longsuffering'.
    reason: previous_rendering
translation:
  language: ko
  text: 믿음과 회개와 참된 사랑과 절제와 분별과 인내에 관해서는, 우리는 모든 점을 살펴보았습니다. 이것은 여러분이 전능하신 하나님을 의롭게와 진실하게와 오래 참음으로, 경건하게 기쁘시게 해야 함을 상기시키기 위함입니다. 또 한마음이 되고, 원한을 품지 않으며, 사랑과 평강 안에서 진심 어린 온유함으로 있어야 합니다. 이는 앞서 언급된 우리 조상들도 아버지와 하나님과 창조주와 모든 사람 앞에서 자신을 낮추어 그분을 기쁘시게 하였기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστεως καὶ μετανοίας καὶ γνησίας ἀγάπης καὶ ἐγκρατείας καὶ σωφροσύνης καὶ ὑπομονῆς
  english_pob_choice: faith and repentance and genuine love and self-control and sound-mindedness and endurance
  chosen_korean: 믿음과 회개와 참된 사랑과 절제와 분별과 인내
  alternatives_korean:
  - 믿음과 회개와 진실한 사랑과 자제와 절도와 견딤
  lexicon: πίστις/μετάνοια/ἀγάπη/ἐγκράτεια/σωφροσύνη/ὑπομονή
  rationale: 영어 POB의 항목을 따르되, σωφροσύνη는 단순한 ‘절도’보다 분별과 절제를 함께 드러내는 ‘분별’로 옮겨 문맥상의 신중함을 살렸습니다.
- source_word: ἐν δικαιοσύνῃ καὶ ἀληθείᾳ καὶ μακροθυμίᾳ
  english_pob_choice: in righteousness and truth and longsuffering
  chosen_korean: 의롭게와 진실하게와 오래 참음으로
  alternatives_korean:
  - 의와 진리와 오래 참음으로
  - 의롭고 진실하며 오래 참음으로
  lexicon: δικαιοσύνη / ἀλήθεια / μακροθυμία
  rationale: 전치사 ἐν의 수단·태도적 의미를 살려 부사형으로 처리했고, μακροθυμία는 문맥상 ‘오래 참음’이 가장 자연스럽습니다.
- source_word: ὁσίως εὐαρεστεῖν
  english_pob_choice: to please Almighty God devoutly
  chosen_korean: 경건하게 기쁘시게 해야 함
  alternatives_korean:
  - 경건하게 하나님을 기쁘시게 해야 함
  - 거룩하게 하나님을 기쁘시게 해야 함
  lexicon: ὁσίως / εὐαρεστεῖν
  rationale: ὁσίως는 행위 방식의 부사로 보아 ‘경건하게’로 옮겼고, εὐαρεστεῖν은 대상이 분명하므로 ‘기쁘시게 해야 함’으로 자연스럽게 처리했습니다.
- source_word: τῷ παντοκράτορι θεῷ
  english_pob_choice: Almighty God
  chosen_korean: 전능하신 하나님
  alternatives_korean:
  - 만군의 하나님
  - 전능자 하나님
  lexicon: παντοκράτωρ / Θεός
  rationale: POB의 ‘Almighty God’를 표준적인 ‘전능하신 하나님’으로 옮겨 의미를 직접 드러냈습니다.
- source_word: ὁμονοοῦντας ἀμνησικάκως ἐν ἀγάπῃ καὶ εἰρήνῃ μετὰ ἐκτενοῦς ἐπιεικείας
  english_pob_choice: being of one mind, free from resentment, in love and peace with earnest gentleness
  chosen_korean: 한마음이 되고, 원한을 품지 않으며, 사랑과 평강 안에서 진심 어린 온유함으로
  alternatives_korean:
  - 뜻을 같이하며, 원한 없이, 사랑과 평강 가운데 간절한 온유함으로
  - 한뜻이 되어, 악을 기억하지 않으며, 사랑과 평강 안에서 간절한 너그러움으로
  lexicon: ὁμονοέω / ἀμνησικάκως / ἐπιείκεια
  rationale: ἀμνησικάκως는 ‘원한을 품지 않으며’로 풀어 관계적 적대의 부재를 분명히 했고, ἐπιεικείας는 ‘온유함’으로 옮겨 지나친 도덕적 추상화를 피했습니다.
- source_word: ταπεινοφρονοῦντες τὰ πρὸς τὸν πατέρα καὶ θεὸν καὶ κτίστην καὶ πάντας ἀνθρώπους
  english_pob_choice: humbling themselves before the Father and God and Creator and all people
  chosen_korean: 아버지와 하나님과 창조주와 모든 사람 앞에서 자신을 낮추어
  alternatives_korean:
  - 아버지와 하나님과 창조주와 모든 사람 앞에서 겸손하여
  - 아버지와 하나님과 창조주와 모든 사람을 향하여 자신을 낮추어
  lexicon: ταπεινοφρονέω / τὰ πρὸς
  rationale: POB의 최신 수정처럼 τὰ πρὸς는 ‘앞에서’로 이해하는 것이 자연스럽고, ταπεινοφρονοῦντες는 행위 중심으로 ‘자신을 낮추어’가 적절합니다.
theological_decisions:
- issue: τῷ παντοκράτορι θεῷ의 호칭 처리
  chosen_reading: ‘전능하신 하나님’으로 직역해 호칭의 장엄함을 살렸습니다.
  alternative_readings:
  - ‘만능의 하나님’
  - ‘전능자 하나님’
  rationale: 현대 한국어에서 가장 자연스럽고, 원문의 ‘all-ruling’ 뉘앙스를 손상시키지 않습니다.
  doctrine_reference: 하나님의 전능성
- issue: ‘아버지와 하나님과 창조주’의 병렬
  chosen_reading: 세 호칭을 분리해 그대로 유지했습니다.
  alternative_readings:
  - ‘아버지 되신 하나님과 창조주’
  - ‘하나님 아버지와 창조주’
  rationale: 원문은 호칭을 겹쳐 쌓아 올려 신학적 수사 효과를 내므로, 이를 묶어 평탄화하지 않는 편이 좋습니다.
  doctrine_reference: 하나님의 아버지 되심과 창조주 되심
