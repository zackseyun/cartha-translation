revisions:
- from: 그리고 우리는 여러분이 신실하고 매우 존귀한 사람들, 곧 하나님의 훈육의 말씀들에 깊이 익숙한 사람들에게 편지하고 있다는 것을 분명히 알았기에, 이 일들을 더욱더 그렇게 하였습니다.[a]
  to: 그리고 우리는 여러분이 신실하고 크게 존경받으며 하나님의 훈육의 말씀에 깊이 교육받은 이들에게 편지하고 있음을 분명히 알았기 때문에, 이러한 일들을 더욱더 힘써 권면하였습니다.[a]
  rationale: 핵심 동사를 의미 있는 한국어 서술어인 ‘힘써 권면하였습니다’로 복원하고, 수신자에 대한 세 수식을 병렬로 정리했습니다. ‘하나님의 훈육의 말씀’은 παιδεία의 형성·훈련 의미와 λόγια의 말씀 의미를 함께 보존합니다. 영어 감사 기록의 ‘reminded’ 제안은 제시된 그리스어 본문 ὑπενήγκαμεν과 일치하지 않으므로 본문 번역에 채택하지 않았습니다.
