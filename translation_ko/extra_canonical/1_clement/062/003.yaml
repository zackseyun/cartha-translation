id: 1CLEM.62.3
reference: 1 Clement 62:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ταῦτα τοσούτῳ μᾶλλον ὑπενήγκαμεν, ἐπειδὴ σαφῶς ᾔδειμεν γράφειν ὑμᾶς ἀνδράσιν πιστοῖς καὶ ἐλλογιμωτάτοις καὶ ἐγκεχυφόσιν εἰς τὰ λόγια τῆς παιδείας τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/062/003.yaml
  text: And we have urged these things all the more[a], since we clearly knew that we were writing to faithful and highly esteemed men who have been deeply instructed in the sayings of God's instruction.
  footnotes:
  - marker: a
    text: Or 'we have urged these things'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리는 여러분이 신실하고 크게 존경받으며 하나님의 훈육의 말씀에 깊이 교육받은 이들에게 편지하고 있음을 분명히 알았기 때문에, 이러한 일들을 더욱더 힘써 권면하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이러한 일들을 더욱더 제시하였습니다.’
    reason: ὑπενήγκαμεν은 문맥상 ‘권면하다’ 또는 ‘제시하다’로 이해될 수 있는 표현이므로, 본문의 자연스러운 번역을 유지하면서 가능한 의미 범위를 밝혔습니다.
lexical_decisions:
- source_word: ὑπενήγκαμεν
  english_pob_choice: we have urged these things
  chosen_korean: 이 일들을 더욱더 그렇게 하였습니다
  alternatives_korean:
  - 이 일들을 더욱더 권면하였습니다
  - 이 일들을 더욱더 일깨워 드렸습니다
  lexicon: ὑποφέρω / ὑπομιμνῄσκω 계열의 문맥상 반복적 상기·권면
  rationale: 본문은 바로 앞절의 ‘상기시키다’ 흐름을 이어가므로, 단순히 ‘권하다’보다 ‘이 일들을 더 강하게 이어서 말하다’는 뉘앙스를 살려 자연스럽게 옮겼습니다.
- source_word: ἐλλογιμωτάτοις
  english_pob_choice: highly esteemed
  chosen_korean: 매우 존귀한
  alternatives_korean:
  - 높이 평가받는
  - 매우 존경받는
  lexicon: ἐλλόγιμος, 최상급
  rationale: 사람의 사회적 가치·평판을 가리키는 말이므로, 단순한 감정적 존경보다 ‘존귀한’이 더 격식 있고 포괄적으로 대응합니다.
- source_word: ἐγκεχυφόσιν εἰς τὰ λόγια
  english_pob_choice: have been deeply instructed in the sayings
  chosen_korean: 말씀들에 깊이 익숙한
  alternatives_korean:
  - 말씀들로 깊이 교육받은
  - 말씀들에 깊이 스며든
  lexicon: ἐγχέω/ἐγχεύω 계열 + λόγια
  rationale: 직역하면 ‘안으로 부어져 들어간’ 상태를 묘사하므로, 교훈이 마음속에 깊이 배어 있는 상태를 한국어 관용으로 살려 ‘깊이 익숙한’으로 옮겼습니다.
- source_word: παιδείας τοῦ θεοῦ
  english_pob_choice: God's instruction
  chosen_korean: 하나님의 훈육
  alternatives_korean:
  - 하나님의 교육
  - 하나님의 가르침
  lexicon: παιδεία
  rationale: παιδεία는 단순 정보 전달이 아니라 훈련·훈육·형성의 의미를 함께 가지므로, ‘instruction’보다 더 입체적인 ‘훈육’을 기본값으로 잡았습니다.
theological_decisions:
- issue: 하나님의 παιδεία의 의미 범위
  chosen_reading: 말씀 자체를 통한 지식 전달과 삶을 빚는 훈육을 함께 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 하나님의 교육
  - 하나님의 가르침
  rationale: 이 문맥에서 παιδεία는 단순한 교리 교육이 아니라 공동체를 형성하는 하나님의 훈련을 가리키므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성화와 징계/훈련의 연속성
