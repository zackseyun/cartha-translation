source:
  edition: Funk 1901 (normalized OCR)
  text: Δίκαιον οὖν καὶ ὅσιον, ἄνδρες ἀδελφοί, ὑπηκόους ἡμᾶς μᾶλλον γενέσθαι τῷ θεῷ ἢ τοῖς ἐν ἀλαζονείᾳ καὶ ἀκαταστασίᾳ μυσεροῦ ζήλους ἀρχηγοῖς ἐξακολουθεῖν. 2. βλάβην γὰρ οὐ τὴν τυχοῦσαν, μᾶλλον δὲ κίνδυνον ὑποίσομεν μέγαν, ἐὰν ῥιψοκινδύνως ἐπιδῶμεν ἑαυτοὺς τοῖς θελήμασιν τῶν ἀνθρώπων, οἵτινες ἔχουσιν πίπτουσιν εἰς ἔριν καὶ στάσεις, εἰς τὸ ἀπαλλοτριῶσαι ἡμᾶς τοῦ καλοῦ ἔχοντος. 3. χρηστευσώμεθα ἑαυτοῖς κατὰ τὴν εὐσπλαγχνίαν καὶ γλυκύτητα τοῦ ποιήσαντος ἡμᾶς. 4. γέγραπται γάρ· Χρηστοὶ ἔσονται οἰκήτορες γῆς, ἄκακοι δὲ ὑπολειφθήσονται ἐπ’ αὐτῆς· οἱ δὲ παρανομοῦντες ἐξολεθρευθήσονται ἀπ᾽ αὐτῆς. 5. καὶ πάλιν λέγει· Εἶδον ἀσεβῆ ὑπερυψούμενον καὶ ἐπαιρόμενον ὡς τὰς κέδρους τοῦ Λιβάνου· καὶ παρῆλθον καὶ ἰδοὺ, οὐκ ἦν, καὶ ἐξεζήτησα τὸν τόπον αὐτοῦ, καὶ οὐχ εὗρον. φύλασσε ἀκακίαν καὶ ἴδε εὐθύτητα, ὅτι ἐστὶν ἐγκατάλειμμα ἀνθρώπῳ εἰρηνικῷ.
  language: Greek
  pages:
  - 279
  - 281
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/014.yaml
  text: 'It is right[a], then, and holy, brothers, for us to become obedient to God rather than to follow those who, in arrogance and disorder, are leaders of hateful jealousy. For we will incur no ordinary harm, but rather great danger, if we recklessly hand ourselves over to the purposes of men who fall into strife and factions, so as to estrange us from what is good. Let us be kind to ourselves according to the compassion and gentleness of the One who made us. For it is written: “The kind will inhabit the land[b], and the innocent will be left upon it; but those who transgress the law will be destroyed from it.” And again he says: “I saw the ungodly highly exalted and lifted up like the cedars of Lebanon; and I passed by, and behold, he was not there, and I sought his place, and I did not find it. Keep innocence and observe uprightness[f][e][d][c], because there is a remnant for a peaceable man.”'
  footnotes:
  - marker: a
    text: Greek 'brothers' translates a masculine fraternal address (ἄνδρες ἀδελφοί).
    reason: cultural_note
  - marker: b
    text: '''Hateful jealousy'' could also be rendered ''detestable zeal''; here ζῆλος is taken negatively from the context of arrogance, disorder, strife, and factions.'
    reason: lexical_alternative
  - marker: c
    text: The citations echo Ps 37:9, 35–37 (LXX numbering differs in some traditions).
    reason: cross_reference
  - marker: d
    text: '''There is a remnant for a peaceable man'' may also be understood as ''there is a future/posterity for a peaceable man.'''
    reason: alternative_reading
  - marker: e
    text: Or 'who are bent on plunging us into strife and factions'.
    reason: previous_rendering
  - marker: f
    text: Or 'Let us show kindness to ourselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 형제 여러분, 하나님께 순종하는 사람이 되기를, 교만과 무질서 안에서 미움받을 열심의 선동자들을 따르기보다 더 마땅하고 거룩합니다. 우리는 보통이 아닌 해가 아니라 큰 위험을 당할 것이니, 분쟁과 파벌로 떨어지는 사람들의 뜻에 무모하게 우리 자신을 내맡겨, 우리를 선한 것에서 멀어지게 해서는 안 됩니다. 우리를 지으신 분의 긍휼과 온유에 따라 서로에게 친절하게 합시다. 기록되기를, 「친절한 사람들은 땅을 차지할 것이며, 죄 없는 사람들은 그 위에 남아 있을 것입니다. 그러나 율법을 어기는 사람들은 거기서 멸망할 것입니다」라고 하였습니다. 또 다시 말합니다. 「나는 경건하지 않은 자가 레바논의 백향목들처럼 높이 들려 있는 것을 보았습니다. 그러나 내가 지나가 보니, 그는 거기에 없었습니다. 내가 그의 자리를 찾았으나 찾아내지 못했습니다. 죄 없음을 지키고 올바름을 살피십시오. 평화로운 사람에게는 남겨진 것이 있기 때문입니다」[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαιον ... καὶ ὅσιον
  english_pob_choice: right ... and holy
  chosen_korean: 마땅하고 거룩합니다
  alternatives_korean:
  - 옳고 거룩합니다
  - 의롭고 경건합니다
  lexicon: LSJ
  rationale: Δίκαιον과 ὅσιον의 짝을 한국어의 윤리적·종교적 병렬로 살리되, '마땅하다'는 권면문의 자연스러운 규범성을, '거룩하다'는 성스러운 결을 보존합니다.
- source_word: ὑπηκόους ... γενέσθαι
  english_pob_choice: to become obedient
  chosen_korean: 순종하는 사람이 되기를
  alternatives_korean:
  - 순종하게 되기를
  - 복종하는 사람이 되기를
  lexicon: BDAG
  rationale: 행위의 결과 상태를 나타내는 γενέσθαι를 한국어의 상태 진술로 옮기고, ὑπηκόους의 도덕적 순종성을 '순종하다'로 자연스럽게 표현했습니다.
- source_word: μυσεροῦ ζήλους ἀρχηγοῖς
  english_pob_choice: leaders of hateful jealousy
  chosen_korean: 미움받을 열심의 선동자들
  alternatives_korean:
  - 가증한 질투의 지도자들
  - 혐오스러운 열심의 우두머리들
  lexicon: LSJ
  rationale: ζῆλος을 이 문맥에서 단순한 '질투'보다 부정적 열심으로 보되, ἀρχηγοῖς를 중립적 '지도자'보다 분열을 부추기는 '선동자들'로 옮겨 문맥의 공격성을 드러냈습니다.
- source_word: θελήμασιν
  english_pob_choice: purposes
  chosen_korean: 뜻
  alternatives_korean:
  - 의지
  - 욕망
  lexicon: BDAG
  rationale: θελήματα는 단순 욕구보다 의도된 방향성을 가리킬 수 있어, 분쟁과 파벌을 일으키는 인간적 의도라는 점을 살리기 위해 '뜻'으로 번역했습니다.
- source_word: χρηστευσώμεθα ἑαυτοῖς
  english_pob_choice: Let us be kind to ourselves
  chosen_korean: 서로에게 친절하게 합시다
  alternatives_korean:
  - 서로 친절을 베풉시다
  - 우리 자신에게 친절합시다
  lexicon: BDAG
  rationale: 복수 재귀대명사 ἑαυτοῖς는 여기서 상호적 의미로 읽는 것이 자연스러우므로, 문맥상 교회 공동체의 화해를 드러내는 '서로에게'로 옮겼습니다.
- source_word: ἐγκατάλειμμα
  english_pob_choice: a remnant
  chosen_korean: 남겨진 것
  alternatives_korean:
  - 남은 자
  - 남는 후손
  lexicon: LSJ
  rationale: 문맥상 '평화로운 사람'에게 남는 지속성이나 몫을 가리킬 수 있으므로, 종말론적·족보적 해석을 미리 확정하지 않는 더 열린 표현으로 처리했습니다.
theological_decisions:
- issue: ἄνδρες ἀδελφοί의 남성 호격 주소
  chosen_reading: 본문은 '형제 여러분'으로 옮기고 여성 추가를 덧붙이지 않았습니다.
  alternative_readings:
  - 형제자매 여러분
  rationale: 그리스어는 남성형 형제 호칭을 사용하며, 본문의 직접 형식을 보존하는 것이 원문 기준에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: source-accurate gendered address'
- issue: ἑαυτοῖς의 상호성
  chosen_reading: 개인적 자기애가 아니라 공동체 상호 권면으로 이해해 '서로에게'로 옮겼습니다.
  alternative_readings:
  - 우리 자신에게
  - 서로 간에
  rationale: 이 권면은 분열 상황에서 공동체의 화평을 촉구하는 맥락이므로, 현대적 자기돌봄 개념으로 오해되지 않게 상호적 의미를 드러냈습니다.
  doctrine_reference: Koine reciprocal reflexive usage in plural exhortation
