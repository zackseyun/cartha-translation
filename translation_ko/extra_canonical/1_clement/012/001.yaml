  source_fidelity: 원문의 Διὰ πίστιν καὶ φιλοξενίαν(‘믿음과 환대로/환대 때문에’) 및 ἐσώθη(‘구원을 받았다’)의 핵심 의미는 대체로 충실히 반영되었습니다. 다만 φιλοξενία를 ‘나그네를 잘 대접함’으로 풀면 원문의 명사적 병렬성과 간결성이 다소 약해집니다.
  naturalness: ‘라합이라는 창녀’는 ‘라합’이 별칭인 듯하게 들릴 수 있어, 원문의 동격 표현을 자연스럽게 옮긴 ‘창녀 라합’이 더 적절합니다. ‘환대’는 현대 표준어에서 자연스럽고 본문의 간결한 문체에도 맞습니다.
  terminology: Ῥαὰβ는 ‘라합’, πόρνη는 완곡하지 않은 ‘창녀’, φιλοξενία는 ‘환대’, σῴζω는 영어 POB의 선택과 문맥을 따라 ‘구원을 받았습니다’로 옮기는 것이 적절합니다. 이 문장은 믿음과 환대를 문법적으로 병렬된 전치사구로 제시하며, 어느 한쪽의 관계를 교리적으로 재해석하지 않았습니다.
