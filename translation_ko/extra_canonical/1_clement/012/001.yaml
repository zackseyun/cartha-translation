source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ πίστιν καὶ φιλοξενίαν ἐσώθη Ῥαὰβ ἡ πόρνη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/001.yaml
  text: Because of faith and hospitality, Rahab the prostitute was saved.
translation:
  language: ko
  text: 창녀 라합은 믿음과 환대로 구원을 받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ πίστιν
  english_pob_choice: Because of faith
  chosen_korean: 믿음으로
  alternatives_korean:
  - 믿음 때문에
  - 믿음으로 말미암아
  lexicon: πίστις
  rationale: 원문의 διά + 대격은 원인/수단을 함께 담을 수 있어, 합쇼체에서 자연스럽고 신학적으로도 무리가 없는 ‘믿음으로’로 옮겼습니다.
- source_word: φιλοξενίαν
  english_pob_choice: hospitality
  chosen_korean: 나그네를 잘 대접함
  alternatives_korean:
  - 환대
  - 손님 접대
  lexicon: φιλοξενία
  rationale: ‘환대’도 가능하지만, 한국어에서 실제 행동의 의미가 분명한 ‘나그네를 잘 대접함’이 본문의 실천성을 더 직접적으로 드러냅니다.
- source_word: Ῥαὰβ ἡ πόρνη
  english_pob_choice: Rahab the prostitute
  chosen_korean: 라합이라는 창녀
  alternatives_korean:
  - 창녀 라합
  - 기생 라합
  lexicon: πόρνη
  rationale: 원문의 직설적 표지를 살려 사회적 낙인을 약화하지 않고, 전통적 완곡어인 ‘기생’보다 source-direct한 ‘창녀’를 택했습니다.
- source_word: ἐσώθη
  english_pob_choice: was saved
  chosen_korean: 구원을 받았습니다
  alternatives_korean:
  - 구원받았습니다
  - 살아났습니다
  lexicon: σῴζω
  rationale: 문맥상 단순 생존보다 구원/구출의 의미가 핵심이므로, POB의 ‘was saved’를 따라 ‘구원을 받았습니다’로 옮겼습니다.
theological_decisions:
- issue: faith and hospitality as saving grounds
  chosen_reading: 믿음과 나그네를 잘 대접함이 라합이 ‘구원을 받은’ 이유로 병렬 제시됩니다.
  alternative_readings:
  - 믿음이 주된 원인이고 환대는 부가적 표지이다
  - 문장 전체를 단순한 모범 서술로 약화한다
  rationale: 원문은 πίστις와 φιλοξενία를 함께 전치사구로 묶어 구원의 근거를 제시하므로, 둘을 함께 살려 번역했습니다.
  doctrine_reference: 야고보서 2장과의 상호본문성에서 믿음의 실재가 행동으로 드러난다는 고백과도 일치합니다.
