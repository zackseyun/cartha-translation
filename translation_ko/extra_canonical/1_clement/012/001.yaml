  - severity: low
    issue: φιλοξενία의 과도한 설명적 번역
    rationale: ‘나그네를 잘 대접함’은 가능한 해석이지만, 원문의 간결한 명사 φιλοξενία를 구체적 행위로 좁힙니다. ‘환대’가 의미 범위를 보존하면서도 현대 한국어에서 자연스럽습니다.
  revised_text: 창녀 라합은 믿음과 환대로 구원을 받았습니다.
