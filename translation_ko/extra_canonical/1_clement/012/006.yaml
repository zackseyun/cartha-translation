    rationale: Ἔσται οὕτως는 ‘그렇게 될 것이다’라는 미래 진술입니다. 한국어 ‘되겠습니다’는 말하는 이들이 그렇게 만들겠다는 약속으로 읽힐 수 있습니다.
  - severity: medium
    issue: ‘당신의 모든 사람’ 및 ‘그들은 보존될 것입니다’
    rationale: 전자는 소유 관계의 표현으로 부자연스럽고, 후자는 사람에게 쓰기에는 지나치게 사물적인 표현입니다. 원문의 포괄성과 구조를 유지하면서 자연스러운 한국어로 다듬어야 합니다.
