- from: 그리고 그들이 그녀에게 말했습니다. 「그렇게 되겠습니다. 당신이 우리에게 말한 대로입니다. 그러나 우리가 오는 것을 알게 되면, 당신의 모든 사람을 당신의 지붕 아래로 모으십시오. 그러면 그들은 보존될 것입니다. 왜냐하면 집 밖에서 발견되는 자는 누구든지 멸망할 것이기 때문입니다.」
  to: 그리고 그들이 그녀에게 말했습니다. “당신이 우리에게 말한 대로 그렇게 될 것입니다. 그러나 우리가 오고 있음을 알게 될 때에, 당신에게 속한 모든 사람을 당신의 지붕 아래로 모으십시오. 그러면 그들은 무사히 보전될 것입니다. 집 밖에서 발견되는 모든 사람은 멸망할 것이기 때문입니다.”
  rationale: 미래 진술의 주체를 불필요하게 화자들의 약속으로 바꾸지 않도록 ‘그렇게 될 것입니다’로 수정했습니다. πάντας τοὺς σοὺς는 관계를 한정하지 않고 ‘당신에게 속한 모든 사람’으로, διασωθήσονται는 보호받아 위험을 면한다는 뜻을 살려 ‘무사히 보전될 것입니다’로 옮겼습니다. 지붕 아래/집 밖의 공간적 대조와 멸망의 경고는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:51Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 미래 진술(Ἔσται), 도래의 인지(γνῷς ... παραγινομένους), 보호와 파멸의 조건적 대조를 전반적으로 담고 있습니다. 다만 ‘그렇게 되겠습니다’는 화자들의 행위 약속처럼 들릴 수 있어 비인칭적 미래 진술인 ‘그렇게 될 것입니다’가 더 정확합니다. 또한 διασωθήσονται는 이 문맥에서 위험에서 ‘무사히 보전되다/살아남다’라는 뜻이므로 기계적인 ‘보존될 것입니다’보다 자연스러운 표현이 필요합니다.
  naturalness: ‘당신의 모든 사람’과 ‘그들은 보존될 것입니다’는 현대 표준 한국어에서 부자연스럽거나 비인격적으로 들립니다. ‘당신에게 속한 모든 사람’ 및 ‘무사히 보전될 것입니다’로 고치면 문체와 의미가 모두 안정됩니다. ‘우리가 오는 것을 알게 되면’도 가능하나, 진행 중인 도래를 ‘우리가 오고 있음을 알게 될 때에’로 표현하면 더 매끄럽습니다.
  terminology: στέγος의 보호 공간 이미지는 ‘지붕 아래’로 유지했습니다. ἀπολοῦνται는 문맥상 실제적 파멸의 경고를 가리키며, 신학적으로 과도하게 특정하지 않는 ‘멸망할 것입니다’를 유지할 수 있습니다. ‘당신에게 속한 모든 사람’은 πάντας τοὺς σοὺς의 포괄성을 보존하며 관계를 불필요하게 ‘가족’으로 한정하지 않습니다.
  issues:
