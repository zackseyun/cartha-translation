id: 1CLEM.12.6
reference: 1 Clement 12:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπαν αὐτῇ· Ἔσται οὕτως, ὡς ἐλάλησας ἡμῖν. ὡς δʼ ἂν γνῷς παραγινομένους ἡμᾶς, συνάξεις πάντας τοὺς σοὺς ὑπὸ τὸ στέγος σου, καὶ διασωθήσονται· ὅσοι γὰρ ἐὰν εὑρεθῶσιν ἔξω τῆς οἰκίας, ἀπολοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/006.yaml
  text: And they said to her, “It shall be so, as you have spoken to us. But when you know that we are coming, you shall gather all your people under your roof, and they will be preserved; for as many as are found outside the house will perish.”
translation:
  language: ko
  text: 그리고 그들이 그녀에게 말했습니다. 「그렇게 되겠습니다. 당신이 우리에게 말한 대로입니다. 그러나 우리가 오는 것을 알게 되면, 당신의 모든 사람을 당신의 지붕 아래로 모으십시오. 그러면 그들은 보존될 것입니다. 왜냐하면 집 밖에서 발견되는 자는 누구든지 멸망할 것이기 때문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται οὕτως
  english_pob_choice: It shall be so
  chosen_korean: 그렇게 되겠습니다
  alternatives_korean:
  - 그렇게 될 것입니다
  - 그렇게 하겠습니다
  lexicon: εἰμί / 미래 서술
  rationale: 확정된 수락의 어조를 살리면서 한국어에서 자연스러운 미래·동의 표현으로 옮겼습니다.
- source_word: παραγινομένους
  english_pob_choice: we are coming
  chosen_korean: 우리가 오는 것을
  alternatives_korean:
  - 우리가 도착하는 것을
  - 우리가 도래하는 것을
  lexicon: παραγίνομαι
  rationale: 영어 POB의 수정 취지처럼 ‘arriving’보다 자연스러운 ‘오는’으로 옮기되, 접근의 진행성을 유지했습니다.
- source_word: ὑπὸ τὸ στέγος σου
  english_pob_choice: under your roof
  chosen_korean: 당신의 지붕 아래로
  alternatives_korean:
  - 당신의 집 안으로
  - 당신의 처마 아래로
  lexicon: στέγη
  rationale: 직역 성격을 유지해 보호 공간의 이미지를 살렸고, ‘지붕 아래’는 원문의 은유를 비교적 직접적으로 드러냅니다.
- source_word: διασωθήσονται
  english_pob_choice: they will be preserved
  chosen_korean: 그들은 보존될 것입니다
  alternatives_korean:
  - 그들은 구원받을 것입니다
  - 그들은 살아남을 것입니다
  lexicon: διασῴζω
  rationale: 단순한 생존보다 보호·보존의 뜻을 살려 POB의 ‘preserved’를 반영했습니다.
- source_word: ἀπολοῦνται
  english_pob_choice: will perish
  chosen_korean: 멸망할 것이기 때문입니다
  alternatives_korean:
  - 죽을 것이기 때문입니다
  - 망할 것이기 때문입니다
  lexicon: ἀπόλλυμι
  rationale: 결과의 강도를 살려 ‘멸망하다’로 옮겼고, 단순한 물리적 죽음보다 전멸·파멸의 뜻을 반영했습니다.
theological_decisions:
- issue: 보호와 멸망의 대비
  chosen_reading: 지붕 아래로 모인 자는 보존되고, 밖에 있는 자는 멸망한다는 대비를 그대로 드러냈습니다.
  alternative_readings:
  - ‘구원받다/살아남다’로 완화하는 번역
  - ‘죽다’로만 번역하는 축소
  rationale: 원문은 보호의 장소와 그 밖의 운명을 분명히 대조하므로, 그 긴장을 약화하지 않고 유지했습니다.
  doctrine_reference: 서사적 경고와 보호 표상의 대비
