    issue: ὁρᾶτε의 문법적 분위기가 평서문으로 바뀌었습니다.
    rationale: ὁρᾶτε는 복수 현재 능동 명령형입니다. ‘여러분은 아십니다’는 진술이므로 권고·주의 환기의 직접성을 잃습니다.
  - severity: low
    issue: 호칭어와 지시 대상의 문체를 다듬을 필요가 있습니다.
    rationale: ‘사랑하는 이들이여’는 유지할 수 있으나, ‘그 여자’는 현대 공적 성서 문체에서 ‘그 여인’보다 다소 거칠게 들릴 수 있습니다.
  - severity: low
    issue: 영어 원문의 어순 대안에 근거한 각주 표지가 한국어 본문에 불필요하게 남아 있습니다.
    rationale: 한국어 개정문에서는 해당 어순 차이가 별도의 번역상 의미 대안을 형성하지 않으므로 각주와 표지를 두지 않는 것이 명료합니다.
  revised_text: 보십시오, 사랑하는 이들이여. 그 여인 안에 믿음뿐 아니라 예언도 생겨났습니다.
