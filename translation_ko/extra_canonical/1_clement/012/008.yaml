id: 1CLEM.12.8
reference: 1 Clement 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρᾶτε, ἀγαπητοί, ὅτι οὐ μόνον πίστις, ἀλλὰ καὶ προφητεία ἐν τῇ γυναικὶ γέγονεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/008.yaml
  text: You see[a], beloved, that not only faith, but also prophecy came to be in the woman.
  footnotes:
  - marker: a
    text: Or 'in the woman there came to be not only faith, but also prophecy'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 이들이여, 여러분은 아십니다. 믿음뿐 아니라 예언도 그 여자에게 생겨났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁρᾶτε
  english_pob_choice: You see
  chosen_korean: 여러분은 아십니다
  alternatives_korean:
  - 보십시오
  - 여러분이 보십니다
  - 알고 있습니다
  lexicon: ὁράω
  rationale: 직접적인 시각 동사이지만, 문맥상 청중의 인지·동의 확인을 나타내므로 자연스러운 합쇼체 진술로 옮겼습니다.
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 이들이여
  alternatives_korean:
  - 사랑하는 자들아
  - 사랑하는 여러분
  - 친애하는 이들이여
  lexicon: ἀγαπητός
  rationale: 호칭의 친밀함을 살리되, 현대 한국어의 공적 문체에 맞게 과도하게 구어적이지 않도록 다듬었습니다.
- source_word: γέγονεν
  english_pob_choice: came to be
  chosen_korean: 생겨났습니다
  alternatives_korean:
  - 되어 있습니다
  - 있게 되었습니다
  - 생겼습니다
  lexicon: γίνομαι
  rationale: 완료형의 결과 상태를 반영하면서도, 영어의 'came to be'가 주는 생성·현현의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: ἐν τῇ γυναικί
  english_pob_choice: in the woman
  chosen_korean: 그 여자에게
  alternatives_korean:
  - 그 여자 안에
  - 그 여자에게서
  - 그 여자에게서 나타났습니다
  lexicon: ἐν + dative
  rationale: 여성 안에 ‘존재함’의 뜻이지만 한국어에서는 소유·귀속을 나타내는 조사 ‘에게’로 결과 상태를 가장 무리 없이 전달할 수 있습니다.
theological_decisions:
- issue: πίστις와 προφητεία의 병렬 관계
  chosen_reading: 믿음뿐 아니라 예언도 그 여자에게 생겨났습니다
  alternative_readings:
  - 믿음뿐 아니라 예언이 그 여자 안에 있었습니다
  - 믿음뿐 아니라 예언도 그 여자에게서 나타났습니다
  rationale: 본문은 두 은사를 동일하게 병렬로 제시하므로, 한쪽만 약화하지 않고 둘 다 결과적으로 ‘생겨난’ 것으로 동일하게 드러냈습니다.
  doctrine_reference: 은사/덕목의 병렬 강조
