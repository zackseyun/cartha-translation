  to: 보십시오, 사랑하는 이들이여. 그 여인 안에 믿음뿐 아니라 예언도 생겨났습니다.
  rationale: 명령형 ὁρᾶτε를 ‘보십시오’로 바로 반영하고, ἐν τῇ γυναικί의 내재적 표현은 ‘그 여인 안에’로 유지했습니다. γέγονεν의 발생·결과 의미는 ‘생겨났습니다’로 보존했습니다. 한국어에서 실질적 의미 차이를 만들지 않는 영어 어순 각주는 생략했습니다.
