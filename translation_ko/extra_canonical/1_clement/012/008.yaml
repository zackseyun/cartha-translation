review_pass:
  verdict: revise
  source_fidelity: ὁρᾶτε는 여기서 독자에게 მიმართ하는 현재 명령형이므로, 평서형 ‘여러분은 아십니다’보다 ‘보십시오’가 원문에 충실합니다. ἐν τῇ γυναικί는 ‘그 여인 안에’로 옮겨 전치사구의 위치·내재 의미를 보존했으며, γέγονεν은 ‘생겨났습니다’로 완료형이 가리키는 발생 및 그 결과를 무리 없이 반영합니다.
  naturalness: ‘보십시오, 사랑하는 이들이여’는 현대 공적 문체의 합쇼체 호칭으로 자연스럽습니다. ‘그 여인 안에’는 다소 직역적이지만, 믿음과 예언이 그 여인에게 내재한다는 본문의 표현을 보존하는 데 적절합니다.
  terminology: πίστις는 ‘믿음’, προφητεία는 ‘예언’으로 일관되게 옮겼습니다. ‘여자’보다 ‘여인’이 본문 속 특정 성인 여성을 가리키는 문맥에서 더 중립적이고 공적인 문체에 맞습니다.
  issues:
