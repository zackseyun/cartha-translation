id: 1CLEM.12.5
reference: 1 Clement 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ εἶπεν πρὸς τοὺς ἄνδρας· Γινώσκουσα γινώσκω ἐγώ, ὅτι κύριος ὁ θεὸς παραδίδωσιν ὑμῖν τὴν γῆν ταύτην· ὁ γὰρ φόβος καὶ ὁ τρόμος ὑμῶν ἐπέπεσεν τοῖς κατοικοῦσιν αὐτήν. ὡς ἐὰν οὖν γένηται λαβεῖν αὐτὴν ὑμᾶς, διασώσατέ με καὶ τὸν οἶκον τοῦ πατρός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/005.yaml
  text: And she said to the men, “I know for certain that the Lord God is giving this land to you, for the fear and dread of you has fallen upon those who dwell in it. Therefore, when it comes about that you take it, preserve me and my father’s house.”
translation:
  language: ko
  text: 그 여인은 남자들에게 말했습니다. 「야훼 하나님께서 이 땅을 여러분에게 넘겨주고 계신다는 것을 나는 분명히 압니다. 왜냐하면 여러분에 대한 두려움과 떨림이 그 땅에 사는 사람들에게 덮쳤기 때문입니다. 그러므로 여러분이 마침내 그것을 차지하게 되면, 나와 내 아버지의 집을 살려 주십시오」.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος ὁ θεός
  english_pob_choice: the Lord God
  chosen_korean: 야훼 하나님
  alternatives_korean:
  - 주 하나님
  - 여호와 하나님
  lexicon: YHWH/κύριος
  rationale: 본문이 하느님 이름을 가리키는 주어적 표현이므로 POB 기본값에 따라 야훼를 사용했고, κύριος와 θεός의 결합은 한국어에서 자연스럽게 하나님으로 풀었습니다.
- source_word: παραδίδωσιν
  english_pob_choice: is giving
  chosen_korean: 넘겨주고 계신다는
  alternatives_korean:
  - 주고 계신다는
  - 내주고 계신다는
  - 주시는
  lexicon: παραδίδωμι
  rationale: 단순한 소유 이전이 아니라 ‘넘겨주다/건네주다’의 뉘앙스가 분명하므로, 현재진행형으로 하나님의 행동이 이미 작동 중임을 살렸습니다.
- source_word: φόβος καὶ τρόμος
  english_pob_choice: fear and dread
  chosen_korean: 두려움과 떨림
  alternatives_korean:
  - 두려움과 공포
  - 경외와 떨림
  lexicon: φόβος, τρόμος
  rationale: 영어 POB의 대칭을 유지하되, 한국어에서도 실제 감정의 강도를 살리기 위해 통상적인 성경어인 ‘두려움과 떨림’을 택했습니다.
- source_word: διασώσατέ με
  english_pob_choice: preserve me
  chosen_korean: 살려 주십시오
  alternatives_korean:
  - 보호해 주십시오
  - 구해 주십시오
  - 지켜 주십시오
  lexicon: διασῴζω
  rationale: 이 동사는 단순 보호보다 생명 보전의 요청을 포함하므로, 본문 상황에 맞게 ‘살려 주십시오’로 옮겨 긴급성과 보존의 뜻을 함께 드러냈습니다.
theological_decisions:
- issue: 신적 이름의 처리
  chosen_reading: κύριος ὁ θεός를 야훼 하나님으로 옮겼습니다.
  alternative_readings:
  - 주 하나님
  - 여호와 하나님
  rationale: 이 절은 야훼의 언약적 행위와 직접 연결된 서술이므로, 프로젝트 기본 규범대로 신명기적 이름을 드러내는 번역을 선택했습니다.
  doctrine_reference: YHWH translation policy
- issue: 직접화법 안의 요청 어조
  chosen_reading: 여인이 남자들에게 하는 요청은 정중한 명령형 ‘살려 주십시오’로 유지했습니다.
  alternative_readings:
  - 살려 주세요
  - 지켜 주십시오
  rationale: 본문의 청유는 생존이 걸린 간청이므로, 현대 합쇼체 안에서 간절한 요청을 가장 직접적으로 나타내는 형태를 택했습니다.
  doctrine_reference: Korean register policy
