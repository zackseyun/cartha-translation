revisions:
- from: 그 여인은 남자들에게 말했습니다. 「야훼 하나님께서 이 땅을 여러분에게 넘겨주고 계신다는 것을 나는 분명히 압니다. 왜냐하면 여러분에 대한 두려움과 떨림이 그 땅에 사는 사람들에게 덮쳤기 때문입니다. 그러므로 여러분이 마침내 그것을 차지하게 되면, 나와 내 아버지의 집을 살려 주십시오」.[a][b]
  to: 그 여인은 남자들에게 말했습니다. “주 하나님께서 이 땅을 여러분에게 넘겨주고 계신다는 것을 나는 분명히 알고 있습니다. 여러분에 대한 두려움과 공포가 이 땅에 사는 사람들에게 닥쳤기 때문입니다. 그러므로 여러분이 그것을 차지하게 될 때, 나와 내 아버지의 집안을 살려 주십시오.”
