id: 1CLEM.12.7
reference: 1 Clement 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ προσέθεντο αὐτῇ δοῦναι σημεῖον, ὅπως ἐκκρεμάσῃ ἐκ τοῦ οἴκου αὐτῆς κόκκινον, πρόδηλον ποιοῦντες, ὅτι διὰ τοῦ αἵματος τοῦ κυρίου λύτρωσις ἔσται πᾶσι τοῖς πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/007.yaml
  text: And they gave her a sign[a], that she should hang scarlet from her house, making it clear that through the blood of the Lord there will be redemption for all who believe and hope in God.
  footnotes:
  - marker: a
    text: Or 'And they added that they would give her a sign'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 그녀에게 표징을 주었는데, 곧 자기 집에서 붉은 것을 매달게 하여, 주의 피를 통해 하나님을 믿고 바라는 모든 이에게 속량이 있을 것임을 분명히 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθεντο αὐτῇ δοῦναι σημεῖον
  english_pob_choice: they gave her a sign
  chosen_korean: 그들은 그녀에게 표징을 주었는데
  alternatives_korean:
  - 그들은 그녀에게 징표를 주었는데
  - 그들은 그녀에게 표를 주었는데
  lexicon: σημεῖον
  rationale: σημεῖον은 단순한 '표'보다 서술적·증거적 기능이 있어 문맥상 '표징'이 가장 적합합니다. προσέθεντο + aorist infinitive는 ‘덧붙여 하다/주다’의 셈어적 관용이므로, 자연스럽고 직접적인 과거 서술로 옮겼습니다.
- source_word: κόκκινον
  english_pob_choice: scarlet
  chosen_korean: 붉은 것
  alternatives_korean:
  - 붉은 천
  - 붉은 실
  - 주홍색
  lexicon: κόκκινον
  rationale: 그리스어 본문은 대상 물건을 명시하지 않고 색채 형용사적 명사만 제시하므로, 영어 POB의 보정인 'cord'를 따르지 않고 한국어에서도 불특정한 '붉은 것'으로 남겨 원문의 열림을 보존했습니다.
- source_word: διὰ τοῦ αἵματος τοῦ κυρίου
  english_pob_choice: through the blood of the Lord
  chosen_korean: 주의 피를 통해
  alternatives_korean:
  - 주님의 피를 통해
  - 주(主)의 피를 통해
  lexicon: αἷμα / κύριος
  rationale: 직역에 가까운 ‘주의 피’를 택해 원문의 구원 수단 표현을 살렸고, 1클레멘트 문맥의 ‘주’는 예수에 대한 호칭으로 이해했습니다.
- source_word: λύτρωσις
  english_pob_choice: redemption
  chosen_korean: 속량
  alternatives_korean:
  - 구속
  - 해방
  - 구원
  lexicon: λύτρωσις
  rationale: λύτρωσις는 대가를 치러 풀어주는 의미가 강하므로, 결과 중심의 ‘구원’보다 더 구체적인 ‘속량’이 원문의 경제적·구속적 뉘앙스를 잘 드러냅니다.
- source_word: τοῖς πιστεύουσιν καὶ ἐλπίζουσιν ἐπὶ τὸν θεόν
  english_pob_choice: all who believe and hope in God
  chosen_korean: 하나님을 믿고 바라는 모든 이에게
  alternatives_korean:
  - 하나님을 믿으며 그분께 소망을 두는 모든 이에게
  - 하나님께 믿고 바라는 모든 이에게
  lexicon: πιστεύω / ἐλπίζω
  rationale: 두 분사는 병렬로서 지속적 태도를 가리키므로, ‘믿고 바라는’으로 간결하게 살렸습니다. ἐπὶ τὸν θεόν은 한국어에서 자연스러운 ‘하나님을 … 바라는’으로 옮겨 의미를 보존했습니다.
theological_decisions:
- issue: 주의 피를 통한 속량의 진술
  chosen_reading: 구속적 효능을 가진 예수의 피를 통해 모든 믿는 이들에게 속량이 있다는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 상징적 의미로 약화해 읽는 것
  - 일반적인 종교적 희망 진술로 중화하는 것
  rationale: 본문은 표징의 의미를 주의 피와 연결하여 명시적으로 해석하므로, 상징만이 아니라 구속의 실제 효력을 드러내는 진술로 보존해야 합니다.
  doctrine_reference: 그리스도의 속량과 대속 사상
