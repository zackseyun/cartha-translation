revisions:
- from: 그리고 그들은 그녀에게 표징을 주었는데, 곧 자기 집에서 붉은 것을 매달게 하여, 주의 피를 통해 하나님을 믿고 바라는 모든 이에게 속량이 있을 것임을 분명히 하였습니다.
  to: 그리고 그들은 그녀에게 표징을 주었는데, 곧 그녀가 자기 집에서 붉은 것을 매달도록 한 것입니다. 이것으로 주의 피를 통하여 하나님을 믿고 하나님께 소망을 두는 모든 이에게 속량이 있을 것임을 분명히 하였습니다.
  rationale: 원문이 남겨 둔 κόκκινον의 물질적 대상의 불특정성은 ‘붉은 것’으로 유지했습니다. ὅπως절은 표징의 내용으로 자연스럽게 재구성했으며, ‘하나님을 바라는’이라는 한국어의 의미상 모호성을 피하여 ἐπὶ τὸν θεόν의 소망의 대상을 ‘하나님께 소망을 두는’으로 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:09Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 원문에 충실합니다. 다만 ὅπως절은 표징의 내용을 직접 제시하므로 ‘붉은 것을 매달게 하여’보다 ‘붉은 것을 매달도록’이 더 정확합니다. 또한 ἐλπίζουσιν ἐπὶ τὸν θεόν은 하나님을 바라는 것이 아니라 하나님께 소망을 두는 것입니다.
  naturalness: ‘그녀’, ‘붉은 것’, ‘속량’은 문어적이지만 현대의 격식 있는 성서 번역 문맥에서 자연스럽습니다. ‘하나님을 믿고 바라는’은 한국어에서 하나님 자체를 바라는 뜻으로도 읽혀 의미가 불명확하므로 수정이 필요합니다.
  terminology: ‘표징’, ‘주의 피’, ‘속량’은 원문의 의미 범위와 성서적 격식에 잘 맞습니다. κόκκινον의 대상이 명시되지 않은 점을 ‘붉은 것’으로 보존한 것도 적절합니다.
  issues:
  - severity: medium
    issue: ἐλπίζουσιν ἐπὶ τὸν θεόν의 번역
    rationale: ‘하나님을 … 바라는’은 목적어를 하나님으로 삼아 하나님을 갈망한다는 뜻이 될 수 있습니다. 전치사구 ἐπὶ τὸν θεόν은 소망의 근거·대상을 나타내므로 ‘하나님께 소망을 두는’으로 옮겨야 합니다.
  - severity: low
    issue: ὅπως절의 연결 방식
    rationale: ὅπως ἐκκρεμάσῃ는 ‘붉은 것을 매달도록/매달게’라는 표징의 내용을 나타냅니다. ‘매달게 하여’는 그들이 그녀에게 그렇게 하도록 강제하거나 조치했다는 뉘앙스를 더할 수 있습니다.
  revised_text: 그리고 그들은 그녀에게 표징을 주었는데, 곧 그녀가 자기 집에서 붉은 것을 매달도록 한 것입니다. 이것으로 주의 피를 통하여 하나님을 믿고 하나님께 소망을 두는 모든 이에게 속량이 있을 것임을 분명히 하였습니다.
