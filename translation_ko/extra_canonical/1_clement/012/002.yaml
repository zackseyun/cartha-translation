id: 1CLEM.12.2
reference: 1 Clement 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκπεμφθέντων γὰρ ὑπὸ Ἰησοῦ τοῦ τοῦ Ναυὴ κατασκόπων εἰς τὴν Ἰεριχώ, ἔγνω ὁ βασιλεὺς τῆς γῆς, ὅτι ἥκασιν κατασκοπεῦσαι τὴν χώραν αὐτῶν, καὶ ἐξέπεμψεν ἄνδρας τοὺς συλλημψομένους αὐτούς, ὅπως συλληφθέντες θανατωθῶσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/002.yaml
  text: For when spies had been sent out by Joshua son of Nun to Jericho, the king of the land learned that they had come to spy out their land, and he sent men to seize them, so that, once captured, they might be put to death.
translation:
  language: ko
  text: 여호수아, 곧 눈의 아들 여호수아에 의해 정탐꾼들이 여리고로 보내졌을 때, 그 땅의 왕은 그들이 자기들의 땅을 정탐하러 왔다는 것을 알고, 그들을 붙잡으려는 사람들을 보냈습니다. 그래서 그들이 붙잡히면 죽임을 당하게 하려 한 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ τοῦ τοῦ Ναυὴ
  english_pob_choice: Joshua son of Nun
  chosen_korean: 여호수아, 곧 눈의 아들 여호수아
  alternatives_korean:
  - 눈의 아들 여호수아
  - 여호수아
  lexicon: 고유명사/설명구
  rationale: 헬라어의 Ἰησοῦ(예수/여호수아)와 이어지는 ‘눈의 아들’ 설명을 살려, 독자가 대상 인물을 오인하지 않도록 이름을 풀어 옮겼습니다.
- source_word: ὁ βασιλεὺς τῆς γῆς
  english_pob_choice: the king of the land
  chosen_korean: 그 땅의 왕
  alternatives_korean:
  - 그 나라의 왕
  - 그 지방의 왕
  lexicon: βασιλεύς / γῆ
  rationale: POB의 ‘the land’와 직접 대응되도록 γῆ를 ‘땅’으로 옮겨, 같은 구절 안의 ‘자기들의 땅’과 어휘 대응을 유지했습니다.
- source_word: κατασκοπεῦσαι τὴν χώραν αὐτῶν
  english_pob_choice: to spy out their land
  chosen_korean: 자기들의 땅을 정탐하러
  alternatives_korean:
  - 자기들의 땅을 염탐하러
  - 자기들의 땅을 살피러
  lexicon: κατασκοπεύω / χώρα
  rationale: κατασκοπεῦσαι는 단순 관찰이 아니라 정탐의 목적 행위를 나타내므로 ‘정탐하다’로 유지했고, χώρα를 POB처럼 ‘land’에 맞춰 ‘땅’으로 옮겼습니다.
- source_word: συλληφθέντες θανατωθῶσιν
  english_pob_choice: once captured, they might be put to death
  chosen_korean: 붙잡히면 죽임을 당하게 하려 한 것입니다
  alternatives_korean:
  - 잡히면 죽게 하려 한 것입니다
  - 붙잡힌 뒤 죽게 하려 한 것입니다
  lexicon: συλλαμβάνω / θανατόω
  rationale: 수동 구조를 한국어의 자연스러운 인과문으로 풀되, ‘붙잡힘’과 ‘죽임’을 모두 살려 결과의 긴박함을 보존했습니다.
theological_decisions:
- issue: 여호수아의 이름 표기
  chosen_reading: 본문의 Ἰησοῦ를 한국어 독자에게 익숙한 ‘여호수아’로 옮기고, 이어서 ‘눈의 아들’ 설명을 붙였습니다.
  alternative_readings:
  - 예수
  - 예수(여호수아)
  rationale: 이 문맥은 구약 인물 여호수아를 가리키므로, 신약의 예수와 혼동을 피하면서도 원문 인명 형식을 설명적으로 보존하는 쪽이 가장 투명합니다.
  doctrine_reference: 인명 식별과 정경 맥락
- issue: ‘그 땅’과 ‘자기들의 땅’의 반복
  chosen_reading: 두 차례의 γῆ/χώρα 대응을 각각 ‘그 땅’과 ‘자기들의 땅’으로 구분해 옮겼습니다.
  alternative_readings:
  - 그 나라 / 자기 나라
  - 그 지역 / 자기 지역
  rationale: 원문은 지리적 소유권과 침범 의도를 강조하므로, 동일 어근을 과도하게 평준화하지 않고 반복을 유지하는 편이 서술 효과를 더 잘 드러냅니다.
  doctrine_reference: 서술 어휘의 반복 효과 보존
