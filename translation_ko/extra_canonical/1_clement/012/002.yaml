  to: 눈의 아들 여호수아가 정탐꾼들을 여리고로 보냈을 때, 그 땅의 왕은 그들이 그 땅을 정탐하러 왔다는 것을 알고, 그들을 붙잡을 사람들을 보냈습니다. 이는 그들이 붙잡혀 죽임을 당하게 하려는 것이었습니다.
