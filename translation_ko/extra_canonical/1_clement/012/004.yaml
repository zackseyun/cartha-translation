  to: 그러나 왕의 사람들이 곁에 서서 말하기를, “우리 땅의 정탐꾼들이 당신에게 들어왔습니다. 그들을 데리고 나오십시오. 왕이 그렇게 명령하십니다” 하자, 그녀가 대답했습니다. “당신들이 찾는 그 사람들은 분명 제게 들어왔지만, 곧바로 떠나 길을 가고 있습니다.” 그러면서 그녀는 그들에게 다른 방향을 가리켜 보였습니다.
