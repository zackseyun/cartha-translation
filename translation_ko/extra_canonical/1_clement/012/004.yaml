id: 1CLEM.12.4
reference: 1 Clement 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπισταθέντων δὲ τῶν περὶ τοῦ βασιλέως καὶ λεγόντων· Πρὸς σὲ εἰσῆλθον οἱ κατάσκοποι τῆς γῆς ἡμῶν· ἐξάγαγε αὐτούς, ὁ γὰρ βασιλεὺς οὕτως κελεύει, ἥδε ἀπεκρίθη· Εἰσῆλθον μέν οἱ ἄνδρες, οὓς ζητεῖτε, πρὸς με, ἀλλʼ εὐθέως ἀπῆλθον καὶ πορεύονται τῇ ὁδῷ ὑποδεικνύουσα αὐτοῖς ἐνλλάξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/004.yaml
  text: But when those from the king stood by and said, “The spies of our land came in to you; bring them out, for the king so orders,” she answered, “The men whom you seek did indeed come in to me, but they immediately departed and are going on the road,” while she pointed them in another direction.
translation:
  language: ko
  text: 그러나 왕에게 속한 자들이 곁에 서서 말하기를, “우리 땅의 정탐꾼들이 당신에게 들어왔습니다. 그들을 끌어내십시오. 왕이 그렇게 명합니다” 하자, 그녀가 대답했습니다. “당신들이 찾는 그 사람들은 분명 내게로 들어왔지만, 곧바로 떠나서 길을 가고 있습니다.” 그러면서 그녀는 그들을 다른 방향으로 가리켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισταθέντων δὲ τῶν περὶ τοῦ βασιλέως
  english_pob_choice: when those from the king stood by
  chosen_korean: 왕에게 속한 자들이 곁에 서서
  alternatives_korean:
  - 왕의 사람들과
  - 왕에게서 온 사람들이
  lexicon: ἐπισταθέντων
  rationale: ἐπισταθέντων은 단순히 ‘왔다’보다 ‘곁에 서다/대기하다’의 뉘앙스가 있어, POB 수정안의 감각을 살려 ‘곁에 서서’로 옮겼습니다.
- source_word: οἱ κατάσκοποι τῆς γῆς ἡμῶν
  english_pob_choice: the spies of our land
  chosen_korean: 우리 땅의 정탐꾼들
  alternatives_korean:
  - 우리 땅의 간첩들
  - 우리 땅을 염탐한 자들
  lexicon: κατάσκοποι
  rationale: κατάσκοποι는 문맥상 정탐꾼이 자연스럽고, ‘간첩’은 현대적 정치 뉘앙스가 너무 강해 피했습니다.
- source_word: ὑποδεικνύουσα αὐτοῖς ἐνλλάξις
  english_pob_choice: while she pointed them in another direction
  chosen_korean: 그러면서 그녀는 그들을 다른 방향으로 가리켰습니다
  alternatives_korean:
  - 그러면서 그녀는 그들에게 다른 길을 알려주었습니다
  - 그러면서 그녀는 그들을 반대쪽으로 보냈습니다
  lexicon: ὑποδεικνύουσα / ἐνλλάξις
  rationale: 마지막 분사는 ‘그들을 다른 방향으로 가리키다’라는 직접적 동작을 요구하므로, POB의 ‘pointed them in another direction’을 반영해 보존적으로 번역했습니다.
theological_decisions:
- issue: 인물의 거짓 진술을 서술적으로 어떻게 처리할지
  chosen_reading: 서술자와 인물의 발화를 구분해, 그녀의 말과 ‘다른 방향으로 가리켰습니다’라는 서술을 함께 유지했습니다.
  alternative_readings:
  - 거짓말을 완곡하게 처리하여 단순한 기만으로 약화시키는 번역
  - 설명적 주석을 본문에 끼워 넣는 번역
  rationale: 본문은 사건을 도덕적으로 해설하기보다, 그녀의 말과 행동을 있는 그대로 병치합니다. 따라서 긴장감을 지우지 않고 서술 구조를 보존하는 것이 source-grounded합니다.
  doctrine_reference: 서술 보존 원칙
- issue: ‘왕이 그렇게 명합니다’의 명령 어조
  chosen_reading: 직접화법의 권위적 명령을 그대로 유지했습니다.
  alternative_readings:
  - ‘왕이 그렇게 원하십니다’처럼 완화
  - ‘왕이 그렇게 말씀하십니다’처럼 우회
  rationale: 원문은 κελεύει로 명령의 강도를 분명히 하므로, 완곡화하지 않고 명령형을 살렸습니다.
  doctrine_reference: 화행 보존 원칙
