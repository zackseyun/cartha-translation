id: 1CLEM.12.3
reference: 1 Clement 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡ οὖν φιλόξενος Ῥαὰβ εἰσδεξαμένη αὐτοὺς ἔκρυψεν εἰς τὸ ὑπερῷον ὑπὸ τὴν λινοκαλάμην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/012/003.yaml
  text: So the hospitable Rahab welcomed them and hid them in the upper room under the stalks of flax[a].
  footnotes:
  - marker: a
    text: Or 'So Rahab, being hospitable,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 환대하는 라합은 그들을 맞아들여 다락방에, 아마 짚 아래에 숨겼습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ οὖν φιλόξενος Ῥαὰβ
  english_pob_choice: So the hospitable Rahab
  chosen_korean: 그러므로 환대하는 라합
  alternatives_korean:
  - 그러므로 손님을 잘 대접하는 라합
  - 그러므로 나그네를 잘 맞이한 라합
  lexicon: φιλόξενος
  rationale: ἐπίθετα형의 “the hospitable Rahab”를 한국어에서도 분사적 설명보다 인명 앞 수식어로 살려, 라합의 성격을 표지하는 별칭처럼 전달했습니다.
- source_word: εἰσδεξαμένη αὐτοὺς
  english_pob_choice: welcomed them
  chosen_korean: 그들을 맞아들여
  alternatives_korean:
  - 그들을 받아들여
  - 그들을 맞이하여
  lexicon: εἰσδέχομαι
  rationale: 단순한 인사보다 집 안으로 받아들여 보호하는 뉘앙스를 살려 “맞아들이다”를 택했습니다.
- source_word: ἔκρυψεν εἰς τὸ ὑπερῷον
  english_pob_choice: hid them in the upper room
  chosen_korean: 다락방에 숨겼습니다
  alternatives_korean:
  - 윗방에 숨겼습니다
  - 상층실에 숨겼습니다
  lexicon: ὑπερῷον
  rationale: ὑπερῷον은 주거 공간의 위층/다락을 가리키므로, 현대 독자가 이해하기 쉬운 “다락방”으로 옮겼습니다.
- source_word: ὑπὸ τὴν λινοκαλάμην
  english_pob_choice: under the stalks of flax
  chosen_korean: 아마 짚 아래에
  alternatives_korean:
  - 아마 줄기 아래에
  - 아마대 아래에
  lexicon: λινοκαλάμη
  rationale: λινοκαλάμη는 아마의 줄기/짚을 가리키므로, 한국어에서는 물질적 이미지를 유지하는 “아마 짚”으로 옮겼습니다.
theological_decisions:
- issue: 문두의 οὖν과 1절의 라합 대비가 만드는 수사적 효과
  chosen_reading: “그러므로”를 살려, 1절의 ‘라합’과 대비되는 ‘환대하는 라합’이라는 별칭이 서술의 연결고리로 보이게 했습니다.
  alternative_readings:
  - “그리하여”
  - 연결사를 생략
  rationale: 본문은 단순 사건 묘사보다 앞선 진술을 받아 라합의 성격을 강조하므로, 결론 표지인 οὖν을 반영하는 것이 문맥상 더 정확합니다.
  doctrine_reference: 수사적 연결 및 본문-문맥 일관성
