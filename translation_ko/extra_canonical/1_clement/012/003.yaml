    rationale: 그리스어는 ‘다락방으로/에’와 ‘아마 줄기 아래에’를 함께 묶어 은닉 장소를 설명합니다. 쉼표는 두 전치사구의 관계를 어색하게 끊고 한국어 문장도 부자연스럽게 만듭니다.
