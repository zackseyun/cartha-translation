  text: Ἕκαστος ἡμῶν, ἀδελφοί, ἐν τῷ ἰδίῳ τάγματι εὐαρεστείτω τῷ θεῷ ἐν ἀγαθῇ συνειδήσει ὑπάρχων, μὴ παρεκβαίνων τὸν ὡρισμένον τῆς λειτουργίας αὐτοῦ κανόνα, ἐν σεμνότητι. 2. οὐ πανταχοῦ, ἀδελφοί, προσφέρονται αἱ θυσίαι ἐνδελεχισμοῦ ἢ εὐχῶν ἢ περὶ ἁμαρτίας καὶ πλημμελείας, ἀλλʼ ἢ ἐν Ἱερουσαλὴμ μόνῃ· κἀκεῖ δὲ οὐκ ἐν παντὶ τόπῳ προσφέρεται, ἀλλʼ ἔμπροσθεν τοῦ ναοῦ πρὸς τὸ θυσιαστήριον, μυωροσκοπηθὲν τὸ προσφερόμενον ὑπὸ
