base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/041.yaml
  text: 'Let each of us[a], brothers, in his own appointed rank be pleasing to God, being in a good conscience, not overstepping the fixed rule of his own ministry, with dignity.


    2. The sacrifices of the continual offering, or of prayers, or for sin and transgression, are not offered everywhere, brothers, but only in Jerusalem; and even there they are not offered in every place, but before the temple, at the altar[e][d][c][b], after the offering has been inspected by the high priest and the ministers already mentioned.'
  footnotes:
  - marker: a
    text: Or 'order' or 'station' for 'appointed rank' (τάγματι), emphasizing an assigned place within an ordered community.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'after the offering has been inspected' renders a rare verb for examining a sacrifice for acceptability before offering.
    reason: cultural_note
  - marker: c
    text: Clement's argument echoes the ordered pattern of Israel's worship to support disciplined conduct within the church.
    reason: cross_reference
  - marker: d
    text: Or 'or of prayers'.
    reason: previous_rendering
  - marker: e
    text: Or 'inspected'.
    reason: previous_rendering
translation:
  language: ko
  text: '우리 각 사람은, 형제 여러분, 자기에게 정해진 차례 안에서 하나님을 기쁘시게 하되, 좋은 양심을 가지고 자기 직분의 정해진 규범을 벗어나지 않으며, 품위 있게 해야 합니다.


    2. 계속 드리는 제사나 기도에 관한 제사나 죄와 허물에 대한 제사들은 어디서나 드려지는 것이 아니라, 형제 여러분, 오직 예루살렘에서만 드려집니다. 그리고 거기서도 모든 곳에서 드려지는 것이 아니라, 성전 앞 제단에서만 드려지며, 그 제물은 대제사장과 앞서 말한 봉사자들이 살핀 뒤에 드려집니다.[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάγματι
  english_pob_choice: appointed rank
  chosen_korean: 정해진 차례
  alternatives_korean:
  - 정해진 질서
  - 정해진 자리
  - 배정된 지위
  lexicon: LSJ
  rationale: τάγματι는 정렬된 공동체 안의 배정된 위치를 가리킬 수 있어, ‘정해진 차례’로 옮기면 질서성과 개인에게 배정된 몫을 함께 살릴 수 있습니다.
- source_word: εὐαρεστείτω
  english_pob_choice: be pleasing
  chosen_korean: 하나님을 기쁘시게 하되
  alternatives_korean:
  - 하나님께 받아들여지되
  - 하나님께 기쁨이 되되
  lexicon: BDAG
  rationale: 동사의 핵심은 하나님께 합당하여 기쁘게 해 드린다는 뜻이므로, 직역보다 한국어 관용에 맞는 ‘기쁘시게 하다’를 택했습니다.
- source_word: κανόνα
  english_pob_choice: fixed rule
  chosen_korean: 정해진 규범
  alternatives_korean:
  - 정해진 기준
  - 고정된 법
  - 한정된 원칙
  lexicon: BDAG
  rationale: κανών은 정해진 표준이나 한계를 뜻하므로, ‘규범’이 문맥의 제약성과 규정성을 가장 자연스럽게 드러냅니다.
- source_word: μυωροσκοπηθέν
  english_pob_choice: inspected
  chosen_korean: 살핀 뒤에
  alternatives_korean:
  - 검사한 뒤에
  - 흠 없는지 확인한 뒤에
  - 점검한 뒤에
  lexicon: LSJ
  rationale: 이 희귀 동사는 제물의 적합성을 확인하는 정밀한 살핌을 가리키므로, 본문에는 간결하게 ‘살핀 뒤에’로 두고 의미는 주석 없이 과장하지 않았습니다.
theological_decisions:
- issue: 제의적 질서와 교회적 질서의 비유
  chosen_reading: 본문의 제사 규례를 단순한 도덕훈으로 평준화하지 않고, 각 사람에게 배정된 자리와 직분의 경계를 지키라는 논지로 살렸습니다.
  alternative_readings:
  - 그저 각자 자기 일이나 하라는 일반적 훈계로 완화함
  - 성전 제의를 교회 직분과의 대응 없이 단순 역사 설명으로 처리함
  rationale: 클레멘스는 예루살렘 제의의 정돈된 구조를 교회의 질서에 대한 근거로 사용하므로, ‘정해진 차례’와 ‘정해진 규범’을 함께 유지해야 논증의 힘이 살아납니다.
  doctrine_reference: 교회 질서와 직분의 경계에 대한 초대교회 권면
