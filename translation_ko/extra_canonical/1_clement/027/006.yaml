source:
  edition: Funk 1901 (normalized OCR)
  text: πάντα ἐνώπιον αὐτοῦ εἰσίν, καὶ οὐδὲν λέληθεν τὴν βουλὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/006.yaml
  text: All things are before him[a], and nothing has escaped his counsel.
  footnotes:
  - marker: a
    text: Or 'nothing has escaped his purpose'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 것이 그분 앞에 있으며, 아무것도 그분의 뜻에 숨겨져 있지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 계획에’.
    reason: βουλή는 ‘뜻, 의도, 계획, 숙의’의 의미 범위를 지니므로, 본문의 자연스러운 번역인 ‘뜻’과 함께 가능한 ‘계획’의 뉘앙스를 보존합니다.
lexical_decisions:
- source_word: πάντα
  english_pob_choice: All things
  chosen_korean: 모든 것이
  alternatives_korean:
  - 만물이
  - 모든 것들이
  lexicon: πᾶς
  rationale: 포괄성을 살리면서도 현대 한국어 문장으로 자연스럽게 들리도록 ‘모든 것이’로 옮겼습니다.
- source_word: ἐνώπιον αὐτοῦ εἰσίν
  english_pob_choice: are before him
  chosen_korean: 그분 앞에 있으며
  alternatives_korean:
  - 그분 앞에 있습니다
  - 그분 앞에 놓여 있으며
  lexicon: ἐνώπιον
  rationale: 직역의 공간적 이미지를 유지하되, 한국어에서는 ‘앞에 있으며’가 가장 간결하고 자연스럽습니다.
- source_word: οὐδὲν λέληθεν
  english_pob_choice: nothing has escaped
  chosen_korean: 아무것도 … 숨겨지지 않습니다
  alternatives_korean:
  - 아무것도 … 그의 주목을 벗어나지 않았습니다
  - 아무것도 … 그의 눈을 피하지 못합니다
  lexicon: λανθάνω
  rationale: λέληθεν의 핵심인 ‘숨겨지다/눈에 띄지 않다’를 살려, 단순한 ‘놓치다’보다 원문의 인지적 힘을 드러냈습니다.
- source_word: τὴν βουλὴν αὐτοῦ
  english_pob_choice: his counsel
  chosen_korean: 그분의 계획
  alternatives_korean:
  - 그분의 뜻
  - 그분의 counsel
  lexicon: βουλή
  rationale: βουλή는 지혜로운 의도와 결정이 포함된 말로, 한국어에서는 ‘계획’이 가장 전달력이 좋으면서도 과도한 신학적 해석을 덧붙이지 않습니다.
theological_decisions:
- issue: βουλή의 의미 범위
  chosen_reading: 그분의 계획
  alternative_readings:
  - 그분의 뜻
  - 그분의 의도
  - 그분의 counsel
  rationale: 본문은 하나님의 지혜로운 의사결정과 그 작정의 불가침성을 말하므로, ‘계획’은 공적으로 읽히면서도 원문의 결의(βουλή)를 보존합니다.
  doctrine_reference: 하나님의 주권과 섭리
