id: 1CLEM.27.7
reference: 1 Clement 27:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: εἰ οἱ οὐρανοὶ διηγοῦνται δόξαν θεοῦ, ποίησιν δὲ χειρῶν αὐτοῦ ἀναγγέλλει τὸ στερέωμα· ἡ ἡμέρα τῇ ἡμέρᾳ ἐρεύγεται ῥῆμα, καὶ νὺξ νυκτὶ ἀναγγέλλει γνῶσιν· καὶ οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί, ὧν οὐχὶ ἀκούονται αἱ φωναὶ αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/007.yaml
  text: The heavens declare the glory of God[a], and the firmament proclaims the work of his hands; day to day pours forth speech, and night to night announces knowledge. There are no words or utterances whose voices are not heard.
  footnotes:
  - marker: a
    text: Or 'Since the heavens declare the glory of God, and the firmament proclaims the work of his hands, day pours forth speech to day'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘이 하나님[a]의 영광을 선포하고, 궁창이 그 손으로 하신 일을 전합니다. 낮이 낮에게 말을 쏟아 내고, 밤이 밤에게 지식을 알립니다. 그 소리가 들리지 않는 말이나 발화는 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 OCR 전사본은 첫 단어를 εἰ(‘만일’ 또는 ‘…이므로’)로 읽습니다. 그러나 문맥과 시편 인용에 비추어 이는 Οἱ(‘그’)의 오독으로 보입니다.
    reason: 영어 감사 흔적의 각주 표지를 유지하되, 실제 본문 이문이 아니라 OCR 오독이라는 판단을 한국어로 정확히 밝혔습니다.
lexical_decisions:
- source_word: οἱ οὐρανοί / τὸ στερέωμα
  english_pob_choice: The heavens ... and the firmament ...
  chosen_korean: 하늘들 ... 궁창
  alternatives_korean:
  - 하늘 ... 창공
  - 하늘 ... 궁창
  lexicon: οὐρανός; στερέωμα
  rationale: 하늘들은 복수형을 살려 시편 인용의 병행구를 보존했고, στερέωμα은 전통적 교회어인 '창공'보다 원문 대응이 분명한 '궁창'을 택했습니다.
- source_word: διηγοῦνται / ἀναγγέλλει / ἀναγγέλλει
  english_pob_choice: declare / proclaims / announces
  chosen_korean: 선포하고 / 전합니다 / 알립니다
  alternatives_korean:
  - 말합니다
  - 드러냅니다
  - 선언합니다
  lexicon: διηγέομαι; ἀναγγέλλω
  rationale: 세 동사는 각각 설명적 진술보다 공개적 전달의 뉘앙스를 가지므로, 시적 평행을 유지하면서도 한국어에서 자연스러운 '선포하다/전하다/알리다'로 옮겼습니다.
- source_word: ἐρεύγεται ῥῆμα
  english_pob_choice: pours forth speech
  chosen_korean: 말을 쏟아 내고
  alternatives_korean:
  - 말을 내뿜고
  - 말을 발하며
  lexicon: ἐρεύγομαι; ῥῆμα
  rationale: ἐρεύγομαι는 '토해 내다/쏟아 내다'의 이미지가 강해, 시적 과장을 살리되 한국어에서 거칠지 않게 '쏟아 내다'로 렌더링했습니다.
- source_word: οὐκ εἰσὶν λόγοι οὐδὲ λαλιαί ... αἱ φωναὶ αὐτῶν
  english_pob_choice: There are no words or utterances whose voices are not heard.
  chosen_korean: 말이나 언어가 없는데도 그 소리는 들리지 않는 것이 없습니다.
  alternatives_korean:
  - 말도 언어도 없지만 그들의 소리는 들리지 않습니다.
  - 말이나 음성이 없어도 그 소리는 들리지 않는 것이 없습니다.
  lexicon: λόγοι; λαλιαί; φωναί
  rationale: 원문은 '말/언어'의 부재와 '소리'의 전달 가능성을 병치하므로, 부정문 구조를 살려 의미를 과장 없이 한국어로 자연화했습니다.
theological_decisions:
- issue: 시편 19편 인용에서 '하나님'과 그 영광의 보편적 증언
  chosen_reading: 하늘과 궁창의 증언을 창조주 하나님의 영광과 손의 하신 일에 대한 공개적 선포로 옮겼습니다.
  alternative_readings:
  - 단순한 자연 묘사로 완화
  - '''하늘''만 두고 ''궁창''의 상징성을 약화'
  rationale: 이 구절은 창조 세계가 하나님을 증언한다는 신학적 진술이므로, 자연 현상으로 축소하지 않고 원문의 선포성을 유지했습니다.
  doctrine_reference: 창조 계시, 시편 19:1-3의 인용
- issue: 문장 첫 머리의 εἰ 처리
  chosen_reading: 본문의 εἰ는 OCR 오탈자로 보고 번역에 반영하지 않았습니다.
  alternative_readings:
  - '''만약'' 또는 ''만일''로 조건문 처리'
  - '''Since''처럼 종속절로 처리'
  rationale: 주어진 영어 감사 흔적과 수정 내역이 이 자음을 오독으로 판정하므로, 한국어 본문에서도 조건문화를 피하고 직접 인용 형식을 따랐습니다.
  doctrine_reference: 본문 비평, OCR 정정
