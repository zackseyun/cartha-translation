  text: ἐν λόγῳ τῆς μεγαλωσύνης αὐτοῦ συνεστήσατο τὰ πάντα καὶ ἐν λόγῳ δύναται αὐτὰ καταστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/004.yaml
  text: By the word of his majesty he established all things, and by a word he is able to overthrow them.
translation:
  language: ko
  text: 그분께서는 그분의 위엄 있는 말씀으로 만물을 이루셨으며, 한 말씀으로 그것들을 무너뜨리실 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λόγῳ τῆς μεγαλωσύνης αὐτοῦ
  english_pob_choice: By the word of his majesty
  chosen_korean: 그의 위엄의 말씀으로
  alternatives_korean:
  - 그의 위엄의 말로
  - 그의 위엄의 말씀으로서
  lexicon: λόγος = 말씀/말, μεγαλωσύνη = 위엄
  rationale: ἐν λόγῳ는 도구/수단을 나타내므로 ‘~으로’로 옮기고, τῆς μεγαλωσύνης αὐτοῦ는 ‘그의 위엄’으로 직접 반영해 원문의 장엄한 어조를 살렸습니다.
- source_word: συνεστήσατο τὰ πάντα
  english_pob_choice: he established all things
  chosen_korean: 그는 만물을 세우셨고
  alternatives_korean:
  - 그는 모든 것을 세우셨고
  - 그는 만물을 확립하셨고
  lexicon: συνίστημι = 세우다/설립하다, τὰ πάντα = 만물/모든 것
  rationale: POB의 ‘established’에 맞춰 ‘세우다’를 택했고, τὰ πάντα는 우주적 총칭을 드러내기 위해 ‘만물’로 옮겼습니다.
- source_word: ἐν λόγῳ δύναται αὐτὰ καταστρέψαι
  english_pob_choice: by a word he is able to overthrow them
  chosen_korean: 또한 한 말씀으로 그것들을 무너뜨리실 수 있습니다
  alternatives_korean:
  - 또한 말씀으로 그것들을 무너뜨리실 수 있습니다
  - 또 한 말씀으로 그것들을 파괴하실 수 있습니다
  lexicon: λόγος = 말씀/말, καταστρέφω = 무너뜨리다/전복하다
  rationale: 두 번째 λόγος는 대비를 살리기 위해 ‘한 말씀’으로 옮겼고, καταστρέψαι는 POB의 ‘overthrow’에 맞춰 ‘무너뜨리다’로 번역해 파괴보다 더 넓은 전복·붕괴의 힘을 살렸습니다.
theological_decisions:
- issue: ‘word’의 반복과 하나님의 창조-파괴 권능의 대비
  chosen_reading: ‘말씀’과 ‘한 말씀’의 반복으로, 동일한 신적 발화가 창조와 붕괴 दोनों을 이루는 대비를 드러냈습니다.
  alternative_readings:
  - 두 곳 모두 ‘말’로 통일
  - 두 곳 모두 ‘말씀’으로 통일
  rationale: 원문은 λόγος를 반복하면서도 첫 항은 정관적, 둘째 항은 비정관적으로 배치해 대비 효과를 냅니다. 이를 한국어에서도 살리기 위해 두 번째를 ‘한 말씀’으로 처리했습니다.
  doctrine_reference: 창조와 심판을 동시에 수행하시는 하나님의 주권
