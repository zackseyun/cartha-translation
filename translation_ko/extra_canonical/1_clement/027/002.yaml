id: 1CLEM.27.2
reference: 1 Clement 27:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ παραγγείλας μὴ ψεύδεσθαι, πολλῷ μᾶλλον αὐτὸς οὐ ψεύσεται· οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ, εἰ μὴ τὸ ψεύσασθαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/002.yaml
  text: He who commanded not to lie will much more not lie himself; for nothing is impossible with God[a], except to lie.
  footnotes:
  - marker: a
    text: Or 'commanded us not to lie will much more not himself lie'.
    reason: previous_rendering
translation:
  language: ko
  text: 거짓말하지 말라고 명령하신 분께서는 더더욱 친히 거짓말하지 않으실 것입니다. 하나님께 불가능한 것은 아무것도 없습니다[a]—거짓말하는 일만은 예외입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “거짓말하지 말라고 명령하신 분은 더더욱 자신이 거짓말하지 않으실 것입니다.”
    reason: 그리스어 αὐτός의 강조를 문장 내에서 달리 배치할 수 있음을 반영합니다.
lexical_decisions:
- source_word: ὁ παραγγείλας μὴ ψεύδεσθαι
  english_pob_choice: He who commanded not to lie
  chosen_korean: 거짓말하지 말라고 명령하신 분
  alternatives_korean:
  - 거짓말하지 말라고 명하신 분
  - 거짓말하지 말라고 명령하신 이
  lexicon: παραγγέλλω
  rationale: 명령의 직접성을 살리되, 문장 첫머리의 분사구를 자연스러운 주어구로 옮겼습니다. 영어 POB가 암시하지 않는 '우리에게'는 넣지 않았습니다.
- source_word: αὐτὸς οὐ ψεύσεται
  english_pob_choice: will much more not lie himself
  chosen_korean: 훨씬 더 자신은 거짓말하지 않으십니다
  alternatives_korean:
  - 훨씬 더 거짓말하지 않으십니다
  - 더욱이 친히 거짓말하지 않으십니다
  lexicon: αὐτός
  rationale: αὐτός의 강조를 '자신은'으로 드러내어 ‘그분 자신이’라는 대비를 살렸습니다. 시제는 문맥상 미래적 확언으로 자연스럽게 풀었습니다.
- source_word: οὐδὲν γὰρ ἀδύνατον παρὰ τῷ θεῷ
  english_pob_choice: for nothing is impossible with God
  chosen_korean: 하나님께는 아무것도 불가능하지 않습니다
  alternatives_korean:
  - 하나님께 불가능한 것은 아무것도 없습니다
  - 하나님 곁에는 아무것도 불가능하지 않습니다
  lexicon: ἀδύνατον + παρὰ τῷ θεῷ
  rationale: παρά τῷ θεῷ를 한국어에서 가장 자연스럽게 '하나님께는'으로 옮겨, 능력의 범위를 나타냈습니다.
- source_word: εἰ μὴ τὸ ψεύσασθαι
  english_pob_choice: except to lie
  chosen_korean: 거짓말하는 일만 제외하면 말입니다
  alternatives_korean:
  - 거짓말하는 것만은 예외입니다
  - 거짓말하는 것 외에는 없습니다
  lexicon: εἰ μή + infinitive
  rationale: 문장 구조상 '불가능하지 않다'의 예외를 드러내는 표현으로 옮겼습니다. 원문의 역설적 제한을 약화시키지 않도록 직설적으로 처리했습니다.
theological_decisions:
- issue: 하나님의 불가능성의 예외 표현
  chosen_reading: 하나님께는 어떤 것도 불가능하지만, 거짓말은 그 예외로 제시됩니다.
  alternative_readings:
  - 거짓말조차도 하나님께는 가능하지 않다는 뜻으로 읽기
  - 예외절을 수사적 과장으로 약화시키기
  rationale: 문장은 하나님의 전능을 진술하면서도, 하나님의 성품 때문에 '거짓말'은 불가능하다는 윤리적·신학적 예외를 함께 말합니다. 둘을 모두 보존해야 본문 의도를 해치지 않습니다.
  doctrine_reference: 하나님의 신실하심과 진실성
- issue: 직접 지시 대상의 생략
  chosen_reading: '''거짓말하지 말라고 명령하신 분''으로 옮겨 대상(우리)을 보충하지 않았습니다.'
  alternative_readings:
  - '''우리를 거짓말하지 말라고 명령하신 분'''
  - '''너희에게 거짓말하지 말라고 명령하신 분'''
  rationale: 그리스어 분사구에는 목적어가 없으므로, 영어 POB의 정정 취지를 따라 대상 대명사를 임의로 삽입하지 않는 것이 더 엄밀합니다.
  doctrine_reference: 본문의 문법적 절제
