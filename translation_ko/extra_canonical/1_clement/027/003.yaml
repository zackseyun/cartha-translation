revisions:
- from: 그러므로 그에 대한 믿음이 우리 안에서 다시 불붙게 하십시오. 그리고 모든 것이 그에게 가깝다는 것을 우리가 깨닫게 하십시오.
  to: 그러므로 우리 안에서 그분을 향한 믿음이 다시 불붙도록 합시다. 그리고 모든 것이 그분께 가까이 있음을 깨달읍시다.
  rationale: 원문의 재점화 비유와 ‘모든 것이 그분께 가깝다’는 포괄적 상태 진술을 유지하면서, 두 동사의 권면적 인칭을 한국어 합쇼체 공동 권면 ‘합시다/깨달읍시다’로 회복했습니다. 논쟁 가능한 αὐτοῦ의 문법적 여지를 별도 해석으로 확대하지 않고, 영어 POB의 목적격 읽기를 따랐습니다.
