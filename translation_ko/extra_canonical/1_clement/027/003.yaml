  yaml_path: translation/extra_canonical/1_clement/027/003.yaml
  text: Therefore let faith in him be rekindled in us, and let us understand that all things are near to him.
translation:
  language: ko
  text: 그러므로 우리 안에서 그분을 향한 믿음이 다시 불붙도록 합시다. 그리고 모든 것이 그분께 가까이 있음을 깨달읍시다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναζωπυρησάτω
  english_pob_choice: let faith ... be rekindled
  chosen_korean: 다시 불붙게 하십시오
  alternatives_korean:
  - 다시 타오르게 하십시오
  - 재점화되게 하십시오
  lexicon: ἀναζωπυρέω
  rationale: ‘다시 불붙다’는 복합 동사에 담긴 재점화·재활성화의 이미지를 자연스럽게 살리면서, 합쇼체 명령형으로 옮겼습니다.
- source_word: ἡ πίστις αὐτοῦ
  english_pob_choice: faith in him
  chosen_korean: 그에 대한 믿음
  alternatives_korean:
  - 그를 향한 믿음
  - 그를 믿는 믿음
  lexicon: πίστις
  rationale: 전치사적 관계를 ‘~에 대한 믿음’으로 풀어, 대상 지시를 분명히 하면서도 본문이 요구하는 신뢰의 방향을 유지했습니다.
- source_word: ἐν ἡμῖν
  english_pob_choice: in us
  chosen_korean: 우리 안에서
  alternatives_korean:
  - 우리 가운데서
  - 우리 속에서
  lexicon: ἐν + dative
  rationale: 공동체 내부에서 일어나는 내적 재점화를 드러내기 위해 ‘우리 안에서’를 택했습니다.
- source_word: πάντα ἐγγὺς αὐτῷ ἐστιν
  english_pob_choice: all things are near to him
  chosen_korean: 모든 것이 그에게 가깝다는 것
  alternatives_korean:
  - 만물이 그에게 가깝다는 것
  - 모든 것이 그 가까이에 있다는 것
  lexicon: ἐγγύς
  rationale: 직역의 어순을 살리되 한국어 문장으로 자연스럽게 풀어, ‘가깝다’의 상태 진술을 명시적으로 표현했습니다.
theological_decisions:
- issue: ‘믿음’의 대상과 공동체적 적용
  chosen_reading: 본문의 ‘그에 대한 믿음’은 단순한 추상 신앙이 아니라, 앞서 언급된 인물에 대한 신뢰를 공동체 안에서 다시 활성화하라는 요청으로 이해했습니다.
  alternative_readings:
  - ‘그 안에서의 믿음’으로 볼 수 있음
  - ‘그를 향한 신실함’으로 완화할 수 있음
  rationale: 그리스어 목적어 구조와 영어 POB의 audit trail을 따라, 믿음의 방향성을 흐리지 않으면서도 본문이 요구하는 공동체적 촉구를 유지했습니다.
  doctrine_reference: πίστις / 공동체 권면
- issue: ‘모든 것이 그에게 가깝다’의 범위
  chosen_reading: ‘모든 것’을 그대로 유지해, 본문이 말하는 포괄성과 긴박성을 약화시키지 않았습니다.
  alternative_readings:
  - ‘만물’로 바꿀 수 있음
  - ‘모든 일이 그에게 임박했다’처럼 해석할 수 있음
  rationale: 그리스어 πάντα는 문맥상 포괄적 진술이므로, 시간적 임박성으로만 좁히지 않고 ‘가깝다’라는 상태 표현으로 보존했습니다.
  doctrine_reference: πάντα / ἐγγύς
