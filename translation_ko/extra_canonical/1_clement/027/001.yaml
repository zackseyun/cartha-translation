revisions:
- from: 그러므로 이 소망 안에서 우리 영혼들이 약속들에 신실하신 분과 판결들에 의로우신 분에게 매여 있게 하십시오.[a]
  to: 그러므로 이 소망 안에서 우리 영혼이 약속들에 신실하시며 판결들에 의로우신 분에게 매여 있도록 합시다.
  rationale: 'The revision preserves the Greek syntax: Ταύτῃ … τῇ ἐλπίδι is rendered as the setting (‘이 소망 안에서’), and τῷ πιστῷ … καὶ τῷ δικαίῳ as the single person to whom the souls are bound. It clarifies the shared referent, uses idiomatic 합쇼체 exhortation, and removes the non-source-based inherited footnote and its anchor.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes ‘in this hope’ as the setting/sphere and understands the dative descriptions as the one to whom the souls are bound. However, the Korean coordination ‘신실하신 분과 … 의로우신 분’ can imply two distinct persons, whereas the Greek uses two substantivized adjectives to describe one referent. The exhortative force of the third-person imperative is also more naturally conveyed by ‘… 매여 있도록 합시다.’
  naturalness: ‘우리 영혼들이’ and ‘매여 있게 하십시오’ are grammatical but stiff and somewhat unnatural in modern formal Korean. A collective singular ‘우리 영혼이’ and the inclusive exhortation ‘매여 있도록 합시다’ read naturally while retaining the binding image.
  terminology: ‘소망,’ ‘신실하신,’ and ‘의로우신’ are appropriate. ‘판결들’ is defensible for κρίματα; ‘약속들’ and ‘판결들’ preserve the Greek plurals. The prior-rendering footnote is not a source-based textual or interpretive note appropriate for the Korean published text, and its anchor should therefore be removed.
  issues:
  - severity: medium
    issue: The two occurrences of ‘분’ joined by ‘과’ may be read as two persons.
    rationale: τῷ πιστῷ … καὶ τῷ δικαίῳ consists of two coordinated descriptions of the same implied referent. Korean should make that unity clear.
  - severity: low
    issue: ‘매여 있게 하십시오’ is an awkward rendering of the third-person exhortative imperative.
    rationale: It can sound like a request to an unexpressed addressee. ‘매여 있도록 합시다’ is idiomatic modern formal-polite Korean and maintains the communal exhortation.
  - severity: low
    issue: The [a] anchor and inherited English audit-trail note should not appear in the Korean text.
    rationale: The note records a superseded English rendering rather than a viable source-based alternative for publication. Removing both avoids an unsupported anchor and misleading alternative.
  revised_text: 그러므로 이 소망 안에서 우리 영혼이 약속들에 신실하시며 판결들에 의로우신 분에게 매여 있도록 합시다.
  revised_footnotes: []
  revision_rationale: 'The revision preserves the Greek syntax: Ταύτῃ … τῇ ἐλπίδι is rendered as the setting (‘이 소망 안에서’), and τῷ πιστῷ … καὶ τῷ δικαίῳ as the single person to whom the souls are bound. It clarifies the shared referent, uses idiomatic 합쇼체 exhortation, and removes the non-source-based inherited footnote and its anchor.'
