  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταύτῃ οὖν τῇ ἐλπίδι προσδεδέσθωσαν αἱ ψυχαὶ ἡμῶν τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/001.yaml
  text: In this hope, then, let our souls be bound to the One who is faithful in his promises and righteous in his judgments.
  footnotes:
  - marker: a
    text: Or 'So then, let our souls be bound to this hope in the One who is faithful'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이 소망 안에서 우리 영혼들이 약속들에 신실하신 분과 판결들에 의로우신 분에게 매여 있게 하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταύτῃ οὖν τῇ ἐλπίδι
  english_pob_choice: In this hope, then
  chosen_korean: 그러므로 이 소망 안에서
  alternatives_korean:
  - 그러므로 이 희망 안에서
  - 그러므로 이 소망에
  lexicon: ἐλπίς
  rationale: ἐλπίς를 단순한 감정으로 약화하지 않고, 문맥상 지속적 지향을 살려 ‘소망’으로 옮겼으며, 여격은 ‘안에서’로 자연스럽게 풀어 문장 전체의 범위를 나타냈습니다.
- source_word: προσδεδέσθωσαν
  english_pob_choice: let our souls be bound
  chosen_korean: 우리 영혼들이 매여 있게 하십시오
  alternatives_korean:
  - 우리 영혼들이 묶이게 하십시오
  - 우리 영혼들이 붙들리게 하십시오
  lexicon: προσδέω
  rationale: 동사의 핵심인 ‘묶어 두다/매다’의 상태 지속을 살려 수동 명령형으로 옮겼고, ‘매여 있게 하십시오’가 원문의 결박 이미지를 가장 직접적으로 드러냅니다.
- source_word: τῷ πιστῷ ἐν ταῖς ἐπαγγελίαις καὶ τῷ δικαίῳ ἐν τοῖς κρίμασιν
  english_pob_choice: the One who is faithful in his promises and righteous in his judgments
  chosen_korean: 약속들에 신실하신 분과 판결들에 의로우신 분
  alternatives_korean:
  - 약속들에 신실하신 분과 심판들에 의로우신 분
  - 약속에 신실하시고 판결에 의로우신 분
  lexicon: πιστός / δίκαιος / ἐπαγγελία / κρίμα
  rationale: ‘신실하신’은 πιστός의 관계적 충실성을 살리고, κρίμα는 여기서 단순한 형벌보다 ‘판결/판정’에 가까워 ‘판결들’로 옮겼습니다. 복수형도 유지해 약속들과 판결들의 반복적·포괄적 의미를 보존했습니다.
theological_decisions:
- issue: 문장 구조상 ‘소망’과 ‘분’의 관계
  chosen_reading: ‘이 소망 안에서’가 결박의 영역이고, 결박의 대상은 ‘약속들에 신실하시고 판결들에 의로우신 분’입니다.
  alternative_readings:
  - ‘이 소망에’ 우리 영혼이 매여 있고 그 소망이 곧 신실하신 분 안에 있다
  - ‘이 소망’을 직접 결박의 대상으로 읽는 해석
  rationale: 그리스어 여격 구문과 POB의 수정된 audit trail을 따르면, 소망은 결박의 배경/범위이고 대상은 하나님께 대한 묘사로 읽는 것이 문법적으로 가장 정확합니다.
  doctrine_reference: 문법/주해
