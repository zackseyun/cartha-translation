id: 1CLEM.27.5
reference: 1 Clement 27:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Τίς ἐρεῖ αὐτῷ· Τί ἐποίησας; ἢ τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ; ὅτε θέλει καὶ ὡς θέλει, ποιήσει πάντα καὶ οὐδὲν μὴ παρελθῇ τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/027/005.yaml
  text: Who will say to him, “What have you done?” Or who will withstand the might of his strength? When he wills, and as he wills, he will do all things, and not one of the things decreed by him shall ever pass away.
translation:
  language: ko
  text: 누가 그분께 「무엇을 하셨습니까?」라고 말하겠습니까? 또는 누가 그분의 힘의 위력에 맞서겠습니까? 그분께서 원하실 때와 원하시는 대로 모든 것을 행하실 것이며, 그분께서 정하신 것들 가운데 어느 것도 결코 사라지지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἐρεῖ αὐτῷ
  english_pob_choice: Who will say to him
  chosen_korean: 누가 그에게 「당신이 무엇을 하셨습니까?」라고 말하겠습니까?
  alternatives_korean:
  - 누가 그에게 「무엇을 하셨습니까?」라고 말하겠습니까?
  - 누가 그에게 따져 묻겠습니까?
  lexicon: τίς / λέγω
  rationale: 수사적 질문 구조를 살리고, 직접 인용문을 한국어 문장으로 풀어 ‘말하다’의 의미를 분명히 했습니다. 하나님께 드리는 직접화법이므로 공손한 2인칭을 썼습니다.
- source_word: τί ἐποίησας
  english_pob_choice: What have you done?
  chosen_korean: 당신이 무엇을 하셨습니까?
  alternatives_korean:
  - 무슨 일을 하셨습니까?
  - 무엇을 행하셨습니까?
  lexicon: ποιέω
  rationale: 행위의 내용을 묻는 직접 발화를 자연스러운 현대 한국어로 옮겼습니다. ‘하셨습니까’는 신적 대상에 대한 존대 표현을 반영합니다.
- source_word: τίς ἀντιστήσεται τῷ κράτει τῆς ἰσχύος αὐτοῦ
  english_pob_choice: who will withstand the might of his strength
  chosen_korean: 누가 그의 힘의 권능을 대적하겠습니까?
  alternatives_korean:
  - 누가 그의 강력함을 견디겠습니까?
  - 누가 그의 힘의 세력을 막겠습니까?
  lexicon: ἀνθίστημι / κράτος / ἰσχύς
  rationale: ‘대적하다’는 능동적 대항의 의미를 살리고, κράτος τῆς ἰσχύος의 중첩적 힘을 ‘힘의 권능’으로 압축해 표현했습니다.
- source_word: ὅτε θέλει καὶ ὡς θέλει
  english_pob_choice: When he wills, and as he wills
  chosen_korean: 그가 원하실 때, 그리고 그가 원하시는 대로
  alternatives_korean:
  - 그가 뜻하실 때, 그리고 뜻하시는 방식대로
  - 그가 원하시는 때와 방식대로
  lexicon: θέλω
  rationale: 의지와 방식의 두 요소를 모두 드러내기 위해 시간과 양태를 나누어 옮겼습니다.
- source_word: τῶν δεδογματισμένων ὑπ᾿ αὐτοῦ
  english_pob_choice: the things decreed by him
  chosen_korean: 그가 정하신 것 가운데
  alternatives_korean:
  - 그가 칙정하신 것들 가운데
  - 그가 선포하신 것들 가운데
  lexicon: δογματίζω
  rationale: 공적·결정적 성격의 ‘정하다’라는 뜻을 살리되, 한국어에서 지나치게 제도적이거나 교리적인 뉘앙스는 피했습니다.
theological_decisions:
- issue: 신적 주권과 인간의 응답 가능성
  chosen_reading: 하나님의 절대적 의지와 결정은 누구도 논박하거나 저지할 수 없다는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 수사적 과장으로 약화하는 읽기
  - 운명론적 문장으로만 읽는 해석
  rationale: 전후 문맥의 찬양적 수사이지만, 원문은 하나님의 의지와 결정의 불가항성을 명시하므로 그 긴장을 약화하지 않았습니다.
  doctrine_reference: divine sovereignty
