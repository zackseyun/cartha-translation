- from: 누가 그에게 「당신이 무엇을 하셨습니까?」라고 말하겠습니까? 또는 누가 그의 힘의 권능을 대적하겠습니까? 그가 원하실 때, 그리고 그가 원하시는 대로, 모든 것을 행하실 것이며, 그가 정하신 것 가운데 아무것도 결코 지나가지 못할 것입니다.
  to: 누가 그분께 「무엇을 하셨습니까?」라고 말하겠습니까? 또는 누가 그분의 힘의 위력에 맞서겠습니까? 그분께서 원하실 때와 원하시는 대로 모든 것을 행하실 것이며, 그분께서 정하신 것들 가운데 어느 것도 결코 사라지지 않을 것입니다.
  rationale: The revision corrects the final clause’s modality, represents the plural decreed things, and improves Korean honorific style and collocation. It retains the two rhetorical questions, the temporal and modal distinction, the future action, and the emphatic assertion that no divine decree will pass away.
