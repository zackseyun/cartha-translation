base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043.yaml
  text: 'And what is remarkable if those entrusted with such a work by God in Messiah appointed the persons mentioned before? For even the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him; and the rest of the prophets followed him, bearing witness together to the ordinances laid down by him. For when jealousy arose concerning the priesthood and the tribes were in faction over which of them was adorned with the glorious name, he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God. And after shutting the tent, he sealed the keys just as he had the staffs, and said to them, “Men, brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”


    Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit. What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever[g][f][e][d][c][b]. Amen.'
  footnotes:
  - marker: a
    text: Or 'those who believed in Messiah through God.' The Greek passive πιστευθέντες can be understood differently, but the context of appointment favors 'entrusted.'
    reason: lexical_alternative
  - marker: b
    text: '''Tent of witness'' echoes the biblical designation for the tabernacle in the wilderness; traditional English often has ''tabernacle of testimony.'''
    reason: cross_reference
  - marker: c
    text: See Numbers 17 for the episode of Aaron's staff budding, to which Clement appeals as a precedent for divinely confirmed priestly order.
    reason: cross_reference
  - marker: d
    text: '''Men, brothers'' reflects the Greek Ἄνδρες ἀδελφοί, a direct and formal address; it is retained for source accuracy.'
    reason: cultural_note
  - marker: e
    text: Or 'those entrusted in Messiah by God appointed the persons mentioned before to such a work'.
    reason: previous_rendering
  - marker: f
    text: Or 'bearing witness together with the ordinances laid down by him'.
    reason: previous_rendering
  - marker: g
    text: Or 'he sealed the keys in the same way, and also the staffs'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 하나님께서 그러한 일에 맡기신 이들이 그전에 언급된 사람들을 메시아 안에서 세운 것이 왜 놀랍습니까? 복되며 신실한 종 모세도 자기 집안에서 자기에게 명령된 모든 것을 거룩한 책들에 기록했으며, 나머지 예언자들도 그를 따르며 그가 세운 규례들을 함께 증언했습니다. 제사장직을 두고 질투가 일어나고, 어느 지파가 영광스러운 이름으로 단장되었는지를 두고 지파들이 분열되었을 때, 그는 열두 지파의 지도자들에게 각 지파의 이름이 적힌 지팡이들을 가져오라고 명령했습니다. 그들을 받아 묶고, 지파 지도자들의 반지로 봉인한 뒤, 증언의 장막 안에 하나님 자리 위에 두었습니다. 그리고 장막을 닫은 뒤에는 지팡이들과 마찬가지로 열쇠도 봉인하고 그들에게 말했습니다. “형제들이여, 어느 지파의 지팡이가 싹을 틔우든지, 그 지파를 하나님께서 제사장으로 섬기게 하시고 그분을 위해 봉사하게 하셨습니다.”


    아침이 되자 그는 온 이스라엘, 곧 육십만 명을 소집하고, 지파 지도자들에게 봉인들을 보여 주었습니다. 그리고 증언의 장막을 열어 지팡이들을 꺼냈습니다. 그런데 아론의 지팡이는 싹이 텄을 뿐 아니라 열매까지 맺은 것이 드러났습니다. 사랑하는 이들이여, 어떻게 생각하십니까? 모세가 이것이 일어날 것을 미리 알지 못했겠습니까? 분명히 알았습니다. 그러나 이스라엘 가운데 무질서가 생기지 않게 하려고, 그는 이렇게 행하였으니, 참되시며 홀로 계신 하나님의 이름이 영광을 받게 하려는 것이었습니다. 그분께 영광이 영원무궁하도록 있기를 빕니다. 아멘.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Χριστῷ
  english_pob_choice: in Messiah
  chosen_korean: 메시아 안에서
  alternatives_korean:
  - 그리스도 안에서
  - 메시아 안에
  lexicon: SBLGNT / project glossary
  rationale: Χριστός의 직함적 힘을 살려 프로젝트 기본값인 ‘메시아’로 옮겼으며, 문맥상 ‘안에서’는 행위의 근거·영역을 자연스럽게 드러냅니다.
- source_word: θεράπων
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 섬기는 사람
  - 시종
  - 일꾼
  lexicon: LSJ
  rationale: θεράπων은 단순 고용인이 아니라 격식 있는 섬김의 뉘앙스를 가지므로, 모세의 공적 역할을 살리면서도 한국어에서 가장 무난한 ‘종’을 택했습니다.
- source_word: σκηνὴν τοῦ μαρτυρίου
  english_pob_choice: tent of witness
  chosen_korean: 증언의 장막
  alternatives_korean:
  - 증거의 장막
  - 증언의 천막
  - 증거의 천막
  lexicon: LSJ
  rationale: 전통적 ‘증거의 장막’보다 ‘증언의 장막’이 μαρτυρίου의 증언/증거 기능을 더 직접적으로 드러내며, 문맥의 상징적 용례를 유지합니다.
- source_word: ἀκαταστασία
  english_pob_choice: disorder
  chosen_korean: 무질서
  alternatives_korean:
  - 혼란
  - 동요
  - 소요
  lexicon: LSJ
  rationale: 공동체적 혼란을 뜻하는 1클레멘스의 문맥에서 ‘무질서’가 가장 간결하고, 질서 회복 논지를 잘 보존합니다.
theological_decisions:
- issue: καὶ τί θαυμαστόν의 수사적 기능
  chosen_reading: “그리고 … 왜 놀랍습니까?”로 반문을 살렸습니다.
  alternative_readings:
  - “그리고 … 무엇이 놀랍습니까?”
  - “그리고 … 놀랄 일이 무엇입니까?”
  rationale: 이 표현은 단순 정보 전달이 아니라 앞선 논증을 강화하는 반문이므로, 한국어에서도 수사적 질문으로 옮겨 긴장과 강조를 보존했습니다.
  doctrine_reference: Rhetorical structure in 1 Clement; source-driven discourse force
- issue: ἱερατεύειν / λειτουργεῖν의 구분
  chosen_reading: “제사장으로 섬기게 하시고 … 봉사하게 하셨습니다”로 구분을 살렸습니다.
  alternative_readings:
  - “제사장 직분을 수행하게 하시고 … 섬기게 하셨습니다”
  - “제사장이 되어 그분을 섬기게 하셨습니다”
  rationale: 본문은 제사장직(office)과 성소 봉사(service)를 병렬로 대비하므로, 둘을 뭉개지 않고 구별해 옮겨 제의적 논증을 유지했습니다.
  doctrine_reference: Priestly-order argument in 1 Clement 43; lexical distinction between ἱερατεύειν and λειτουργεῖν
