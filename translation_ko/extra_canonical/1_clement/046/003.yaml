translation:
  language: ko
  text: 또 다시 다른 곳에서는 이렇게 말씀하십니다. 「무죄한 사람과 함께하면 당신도 무죄할 것이며, 택한 사람과 함께하면 당신도 택함받을 것이며, 비뚤어진 사람과 함께하면 당신도 비뚤어질 것입니다」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν ἐν ἑτέρῳ τόπῳ λέγει
  english_pob_choice: And again, in another place it says
  chosen_korean: 또 다시 다른 곳에서는 이렇게 말씀하십니다
  alternatives_korean:
  - 그리고 다시 다른 곳에서 말씀합니다
  - 또 다른 곳에서 말씀하십니다
  lexicon: πάλιν / ἐν ἑτέρῳ τόπῳ / λέγει
  rationale: 본문의 인용 도입 공식을 자연스러운 문어체로 옮기되, 반복성과 출처의 불특정성을 살리기 위해 「또 다시 다른 곳에서는」으로 처리했습니다.
- source_word: ἀνδρὸς ἀθῴου
  english_pob_choice: with an innocent man
  chosen_korean: 무죄한 사람과 함께하면
  alternatives_korean:
  - 죄 없는 사람과 함께하면
  - 무죄한 사람과 더불어하면
  lexicon: ἀθῷος
  rationale: ἀθῷος는 도덕적으로 흠 없는/무죄한 상태를 가리키므로, 법정적 뉘앙스를 살린 「무죄한」을 택했습니다.
- source_word: ἐκλεκτοῦ
  english_pob_choice: with an elect one
  chosen_korean: 택한 사람과 함께하면
  alternatives_korean:
  - 선택된 사람과 함께하면
  - 택함받은 사람과 함께하면
  lexicon: ἐκλεκτός
  rationale: 영어 POB의 전개와 달리 한국어에서는 형용사 단독의 어색함을 피하면서도, 원문의 인칭화된 형용사 용법을 반영하기 위해 「택한 사람」으로 옮겼습니다.
- source_word: στρεβλοῦ διαστρέψεις
  english_pob_choice: with a crooked one you will become twisted
  chosen_korean: 비뚤어진 사람과 함께하면 당신도 비뚤어질 것입니다
  alternatives_korean:
  - 구부러진 사람과 함께하면 당신도 구부러질 것입니다
  - 뒤틀린 사람과 함께하면 당신도 뒤틀릴 것입니다
  lexicon: στρεβλός / διαστρέφω
  rationale: 두 동사의 어근 반복과 도덕적·행동적 왜곡의 대비를 살리기 위해 「비뚤어진/비뚤어질」을 사용했습니다.
theological_decisions:
- issue: 인용문 안의 2인칭 표현의 한국어 처리
  chosen_reading: 문장 전체를 일반 진술로 읽되, 인용문 안에서는 직접화법의 2인칭을 그대로 살려 「당신도」를 사용했습니다.
  alternative_readings:
  - 더 중립적인 「너도」
  - 간접화법으로 완화한 표현
  rationale: 그리스어의 직설적 평행 구조를 유지하는 쪽이 경구적 인용의 힘을 더 잘 드러내므로, 설교체로 약화시키지 않았습니다.
  doctrine_reference: source-rhetoric / direct-speech preservation
