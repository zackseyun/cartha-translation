- from: 또 다시 다른 곳에서는 이렇게 말씀하십니다. 「무죄한 사람과 함께하면 당신도 무죄할 것이며, 택한 사람과 함께하면 당신도 택함받을 것이며, 비뚤어진 사람과 함께하면 당신도 비뚤어질 것입니다」.[a]
