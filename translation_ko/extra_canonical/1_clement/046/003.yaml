  rationale: 원문의 καὶ πάλιν ἐν ἑτέρῳ τόπῳ λέγει를 중립적인 인용 도입으로 옮기고, 2인칭 단수의 경구적 호소는 ‘그대’로 유지했습니다. ἐκλεκτός의 수동적 의미와 ἐκλεκτοῦ/ἐκλεκτὸς의 반복, στρεβλοῦ/διαστρέψεις의 반복을 각각 ‘택함을 받은/택함을 받을’ 및 ‘비뚤어진/비뚤어지게 될’로 보존했습니다.
