  text: And again[a], in another place it says, “With an innocent man you will be innocent, and with an elect one you will be elect, and with a crooked one you will become twisted.”
  footnotes:
  - marker: a
    text: Or 'with the chosen one you will be chosen, and with the crooked'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다시[a] 다른 곳에서 이렇게 말합니다. 「죄 없는 사람과 함께하면 그대도 죄 없게 될 것이며, 택함을 받은 이와 함께하면 그대도 택함을 받을 것이며, 비뚤어진 이와 함께하면 그대도 비뚤어지게 될 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “택함을 받은 이와 함께하면 그대도 택함을 받을 것이며, 비뚤어진 이와 함께하면 그대도 비뚤어지게 될 것입니다.”
    reason: 영어 POB 감사 추적에 보존된 이전 번역 관련 각주를 한국어로 옮기고, 표지를 ‘다시’에 연결했습니다.
