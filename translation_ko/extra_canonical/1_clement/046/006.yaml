id: 1CLEM.46.6
reference: 1 Clement 46:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ οὐχὶ ἕνα θεὸν ἔχομεν καὶ ἕνα Χριστὸν καὶ ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς, καὶ μία κλῆσις ἐν Χριστῷ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/006.yaml
  text: Or do we not have one God and one Messiah and one Spirit of grace poured out upon us[b][a], and one calling in Messiah?
  footnotes:
  - marker: a
    text: Or 'Do we not have'.
    reason: previous_rendering
  - marker: b
    text: Or 'and one calling in Messiah?'.
    reason: previous_rendering
translation:
  language: ko
  text: 혹시 우리에게 한 하나님과 한 메시아와 우리 위에 부어지신 한 은혜의 영과, 메시아 안에서 하나의 부르심이 있지 않습니까?[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕνα θεὸν
  english_pob_choice: one God
  chosen_korean: 한 하나님
  alternatives_korean:
  - 한 신
  - 유일한 하나님
  lexicon: θεός
  rationale: 하나님을 기본어로 유지하고, ἕνα의 수적 강조를 간결하게 살려 ‘한 하나님’으로 옮겼습니다.
- source_word: ἕνα Χριστόν
  english_pob_choice: one Messiah
  chosen_korean: 한 메시아
  alternatives_korean:
  - 한 그리스도
  - 한 기름부음 받은 이
  lexicon: Χριστός
  rationale: 프로젝트 기본어에 따라 Χριστός는 ‘메시아’로 옮겨, 전통 교회어보다 원문 지칭성을 살렸습니다.
- source_word: ἓν πνεῦμα τῆς χάριτος τὸ ἐκχυθὲν ἐφ’ ἡμᾶς
  english_pob_choice: one Spirit of grace poured out upon us
  chosen_korean: 한 은혜의 영과, 우리 위에 부어지신
  alternatives_korean:
  - 한 은혜의 영과, 우리에게 쏟아지신
  - 한 은혜의 영이 우리 위에 부어진
  lexicon: πνεῦμα τῆς χάριτος / ἐκχυθέν
  rationale: πνεῦμα는 문맥상 하나님의 영을 가리키므로 ‘영’으로 두고, χάρις의 소유격은 ‘은혜의 영’으로 자연스럽게 반영했습니다. ‘부어지신’은 ἐκχυθέν의 수동 분사를 살려 수동·은사적 이미지를 유지합니다.
- source_word: μία κλῆσις ἐν Χριστῷ
  english_pob_choice: one calling in Messiah
  chosen_korean: 메시아 안에서 하나의 부르심
  alternatives_korean:
  - 메시아 안에서 한 부르심
  - 메시아 안의 하나의 부르심
  lexicon: κλῆσις
  rationale: 뒤의 명사구가 앞의 동격적 열거 안에서 이어지는 점을 살려 ‘하나의 부르심’으로 옮겼고, ἐν Χριστῷ는 ‘메시아 안에서’로 고정했습니다.
theological_decisions:
- issue: Χριστός의 한국어 표기
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 문맥은 직함적 Χριστός를 사용하므로, 본 프로젝트 기본어인 ‘메시아’를 유지해 유대적-성경적 의미를 직접 드러냈습니다.
  doctrine_reference: DOCTRINE.md proper-name/title policy for Χριστός
- issue: 문장 첫머리의 ἢ οὐχὶ
  chosen_reading: 혹시 우리에게 … 있지 않습니까?
  alternative_readings:
  - 우리가 … 있지 않습니까?
  - 우리에게 … 있지 않습니까?
  rationale: ἢ οὐχί는 수사적 질문을 강화하므로, 한국어에서는 공손한 반문형 ‘혹시 … 있지 않습니까?’로 옮겨 원문의 호소력을 살렸습니다.
  doctrine_reference: Greek rhetorical-question handling; formal-polite Korean style
