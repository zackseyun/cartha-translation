id: 1CLEM.46.7
reference: 1 Clement 46:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἱνατί διέλκωμεν καὶ διασπῶμεν τὰ μέλη τοῦ Χριστοῦ καὶ στασιάζομεν πρὸς τὸ σῶμα τὸ ἴδιον, καὶ εἰς τοσαύτην ἀπόνοιαν ἐρχόμεθα, ὥστε ἐπιλαθέσθαι ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων; μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/007.yaml
  text: 'Why do we pull apart and tear to pieces the members of Messiah[a], and rise in revolt against our own body, and come to such a pitch of madness that we forget that we are members of one another?


    Remember the words of Jesus our Lord.'
  footnotes:
  - marker: a
    text: Or 'tear apart and split up'.
    reason: previous_rendering
translation:
  language: ko
  text: '우리가 어찌하여 메시아의 지체들을 끌어당겨 찢어 놓고, 우리 자신의 몸을 거슬러 반란을 일으키며, 우리가 서로의 지체라는 사실을 잊을 정도로 그토록 큰 광기에 이릅니까?


    우리 주 예수님의 말씀을 기억하십시오.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέλκωμεν
  english_pob_choice: pull apart
  chosen_korean: 끌어당겨
  alternatives_korean:
  - 갈라놓고
  - 분리하고
  - 잡아당겨
  lexicon: διέλκω
  rationale: 단순한 분리보다 ‘당겨서 벌리다’의 역동을 살리기 위해 ‘끌어당겨’로 옮겼습니다.
- source_word: διασπῶμεν
  english_pob_choice: tear to pieces
  chosen_korean: 찢어 놓고
  alternatives_korean:
  - 산산이 찢고
  - 찢어 버리고
  - 갈기갈기 찢고
  lexicon: διασπάω
  rationale: 폭력적이고 파괴적인 뉘앙스를 살리되, 문어체 합쇼체에서 과도하게 비속해지지 않도록 ‘찢어 놓고’를 택했습니다.
- source_word: τὰ μέλη τοῦ Χριστοῦ
  english_pob_choice: the members of Messiah
  chosen_korean: 메시아의 지체들
  alternatives_korean:
  - 그리스도의 지체들
  - 메시아의 몸의 지체들
  lexicon: μέλος / Χριστός
  rationale: 본문의 Χριστός를 프로젝트 기본값인 ‘메시아’로 유지하고, σῶμα와의 병치를 해치지 않으면서도 ‘지체들’로 신체-공동체 이미지를 살렸습니다.
- source_word: πρὸς τὸ σῶμα τὸ ἴδιον
  english_pob_choice: against our own body
  chosen_korean: 우리 자신의 몸을 거슬러
  alternatives_korean:
  - 우리 자신의 몸에 맞서
  - 우리 몸에 대항하여
  lexicon: σῶμα / πρὸς
  rationale: πρός의 대립적 방향성을 ‘거슬러’로 자연스럽게 표현해, 본문이 말하는 자기 파괴적 대립을 드러냈습니다.
theological_decisions:
- issue: ἡμᾶς, ὅτι μέλη ἐσμὲν ἀλλήλων의 공동체적 자기인식
  chosen_reading: 우리가 서로의 지체라는 사실
  alternative_readings:
  - 우리가 서로의 지체임을
  - 우리가 서로에게 속한 지체라는 것
  rationale: 문법적으로는 ‘지체들이다’이지만, 한국어에서는 ‘사실’로 받으면 앞선 광기와 대조되는 기억의 내용이 더 분명해집니다.
  doctrine_reference: 교회의 연합과 상호의존성
- issue: μνήσθητε τῶν λόγων Ἰησοῦ τοῦ κυρίου ἡμῶν의 명령형 어조
  chosen_reading: 우리 주 예수님의 말씀을 기억하십시오
  alternative_readings:
  - 우리 주 예수님의 말씀을 기억하라
  - 우리 주 예수님의 말씀을 기억하십시오요
  rationale: 회중을 향한 권면이므로 합쇼체 명령으로 옮겼고, 예수님에 대한 직접 호칭은 존칭을 유지했습니다.
  doctrine_reference: 예수님의 주되심과 권위
