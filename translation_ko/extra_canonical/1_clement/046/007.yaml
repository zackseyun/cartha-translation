  source_fidelity: 수정이 필요합니다. διέλκωμεν은 단순히 한쪽으로 ‘끌어당기다’라기보다 잡아당겨 갈라놓는 행위를 뜻하므로, 기존 ‘끌어당겨’는 방향성과 분리의 뜻을 충분히 담지 못합니다. στασιάζομεν도 여기서는 정치적 ‘반란’보다는 자기 몸을 향한 대립과 분열을 가리키므로 ‘분쟁을 일으키다’가 문맥에 더 알맞습니다. 나머지 문장의 수사적 질문, 공동체의 상호 지체성, 그리고 ‘우리 주 예수님의 말씀’은 원문에 충실합니다.
  naturalness: 기존 번역은 전반적으로 합쇼체에 맞지만, ‘그토록 큰 광기에 이릅니까’는 다소 직역투입니다. ‘그토록 광기에 빠집니까’가 현대 표준어의 문어체에서 더 자연스럽습니다. ‘잡아당겨 갈라놓고 산산이 찢으며’는 두 그리스어 동사의 점층적이고 격렬한 이미지를 자연스럽게 살립니다.
  terminology: ‘메시아’, ‘지체’, ‘몸’, ‘우리 주 예수님’은 일관되고 적절합니다. 각주 표지는 현재 ‘예수님의 말씀’에 붙어 있으나, 각주 내용은 앞선 찢음/분열 동사 표현의 대안에 관한 것이므로 해당 동사구에 옮겨야 합니다.
