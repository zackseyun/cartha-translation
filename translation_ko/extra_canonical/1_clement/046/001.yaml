review_pass:
  verdict: revise
  source_fidelity: ὑποδείγμασιν은 여기서 따라야 할 ‘본보기/모범’을 가리키며, κολληθῆναι는 그것들에 ‘붙다, 굳게 결합하다’라는 비유를 보존하는 편이 좋습니다. ‘매이다’는 외부에 속박되는 뉘앙스가 강하여 원문의 자발적 결속과 다소 다릅니다.
  naturalness: ‘본들에 매여야 합니다’는 현대 한국어에서 다소 부자연스럽고, ‘본들’도 이 문맥에서는 ‘본보기들’보다 덜 분명합니다. ‘본보기에 굳게 붙어야 합니다’는 현대 합쇼체로 자연스럽고 원문의 결속 비유도 살립니다.
  terminology: ὑπόδειγμα은 ‘본보기’로, κολλάω는 ‘굳게 붙다’로 옮겼습니다. δεῖ의 당위는 ‘해야 합니다’로 유지했으며, ἀδελφοί는 ‘형제 여러분’으로 자연스럽게 호칭했습니다.
  issues:
  - severity: medium
    issue: ‘매여야 합니다’의 의미 및 어감
    rationale: κολληθῆναι는 ‘붙다/결합하다’이지 주로 속박을 뜻하는 ‘매이다’가 아닙니다. 현 번역은 자칫 본보기들에 구속된다는 의미로 읽힐 수 있습니다.
  - severity: low
    issue: ‘본들’의 현대적 명료성
    rationale: ‘본들’도 가능하지만, 복수의 규범적 사례를 뜻하는 ὑποδείγμασιν에는 ‘본보기들’이 더 명료하고 자연스럽습니다.
  revised_text: 그러므로 형제 여러분, 우리도 그러한 본보기들에 굳게 붙어야 합니다.
  revised_footnotes: []
