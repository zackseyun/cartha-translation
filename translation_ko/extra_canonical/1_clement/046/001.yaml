id: 1CLEM.46.1
reference: 1 Clement 46:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Τοιούτοις οὖν ὑποδείγμασιν κολληθῆναι καὶ ἡμᾶς δεῖ, ἀδελφοί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/001.yaml
  text: Therefore, brothers, we too must attach ourselves to such examples.
translation:
  language: ko
  text: 그러므로 형제 여러분, 우리도 그러한 본들에 매여야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοιούτοις ... ὑποδείγμασιν
  english_pob_choice: such examples
  chosen_korean: 그러한 본들
  alternatives_korean:
  - 그런 본보기들
  - 그러한 모범들
  - 이와 같은 본들
  lexicon: ὑπόδειγμα
  rationale: ὑπόδειγμα은 단순한 예시보다 따라야 할 본보기의 성격이 강하므로, POB의 ‘such examples’를 살리되 한국어에서는 ‘본들’로 압축해 행위 규범성을 드러냈습니다.
- source_word: κολληθῆναι
  english_pob_choice: attach ourselves
  chosen_korean: 매여야 합니다
  alternatives_korean:
  - 붙어야 합니다
  - 달라붙어야 합니다
  - 결합해야 합니다
  lexicon: κολλάω
  rationale: 동사의 수동 부정과 당위가 결합된 표현으로, 단순한 물리적 ‘붙다’보다 지속적 결속을 나타내는 ‘매이다’가 문맥상 더 적절합니다.
- source_word: ἡμᾶς δεῖ
  english_pob_choice: we too must
  chosen_korean: 우리도 ... 해야 합니다
  alternatives_korean:
  - 우리 역시 ... 해야 합니다
  - 우리도 ... 마땅합니다
  - 우리도 ... 해야만 합니다
  lexicon: δεῖ
  rationale: δεῖ는 도덕적·필연적 의무를 나타내므로 ‘해야 합니다’로 옮기고, καὶ ἡμᾶς를 반영해 ‘우리도’를 앞에 두었습니다.
theological_decisions:
- issue: 권면의 직접성
  chosen_reading: 사도적 훈계의 강도를 유지해, 단순한 권유가 아니라 공동체가 따라야 할 의무로 번역했습니다.
  alternative_readings:
  - 더 부드러운 권유형으로 옮길 수 있음
  - ‘붙어야 마땅합니다’처럼 강화할 수 있음
  rationale: δεῖ는 본문에서 공동체적 책임을 강조하므로, 한국어에서도 명령적 부담을 약화시키지 않는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 교회 권면과 성화의 실제적 의무성
