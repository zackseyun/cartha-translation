review_pass:
  verdict: revise
  source_fidelity: 그리스어 κολλᾶσθε/κολλώμενοι의 반복은 유지되어야 합니다. 초안의 ‘달라붙다’는 기본 의미를 전달하지만, 현대 표준 한국어에서 다소 구어적이며 집착하거나 성가시게 매달리는 뉘앙스를 낼 수 있습니다. ‘붙으십시오/붙는 이들’가 결속의 비유를 더 중립적이고 자연스럽게 보존합니다. ἁγιασθήσονται는 수동 미래이므로 ‘거룩하게 될 것입니다’가 적절합니다.
  naturalness: ‘기록되기를, …라고 했습니다’는 인용 도입으로 다소 겹칩니다. ‘기록되어 있기 때문입니다’라고 하면 γέγραπται γάρ를 자연스러운 현대 합쇼체로 옮길 수 있습니다. ‘거룩한 이들’은 문맥상 인격적 복수 지시를 명확히 하면서 뒤의 ‘거룩하게’와 어근 연관도 드러냅니다.
  terminology: ‘성도’도 가능한 번역이나, 본문의 ἅγιοι와 ἁγιασθήσονται의 명시적 어근 반복을 한국어에서 더 잘 보존하기 위해 ‘거룩한 이들/거룩하게’로 통일합니다. 이는 특정 교파의 성화 용어를 부과하지 않습니다.
  issues:
  - severity: medium
    issue: ‘달라붙으십시오’의 어감
    rationale: κολλάω의 결속 의미는 반영하지만, ‘달라붙다’는 현대 한국어에서 구어적이고 부정적·집착적 함의를 가질 수 있어 공적 권면 문체에 덜 적합합니다.
  - severity: low
    issue: 인용 도입의 중복
    rationale: ‘기록되기를 …라고 했습니다’보다 ‘기록되어 있기 때문입니다’가 γέγραπται γάρ의 현재적 인용 관습과 문장 흐름을 더 직접적으로 반영합니다.
  - severity: low
    issue: ἅγιος 어근 반복의 약화
    rationale: ‘성도들’과 ‘거룩하게’의 조합도 뜻은 전달하지만, ‘거룩한 이들/거룩하게’는 원문의 수사적 연결을 더 투명하게 보존합니다.
  revised_text: 기록되어 있기 때문입니다. 「거룩한 이들에게 붙으십시오. 그들에게 붙는 이들은 거룩하게 될 것입니다.」
