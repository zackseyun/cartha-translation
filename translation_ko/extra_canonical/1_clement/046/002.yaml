  text: γέγραπται γάρ· Κολλᾶσθε τοῖς ἁγίοις, ὅτι οἱ κολλώμενοι αὐτοῖς ἁγιασθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/002.yaml
  text: For it is written, “Cling to the holy ones, because those who cling to them will be made holy.”
translation:
  language: ko
  text: 기록되어 있기 때문입니다. 「거룩한 이들에게 붙으십시오. 그들에게 붙는 이들은 거룩하게 될 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολλᾶσθε
  english_pob_choice: Cling to
  chosen_korean: 달라붙으십시오
  alternatives_korean:
  - 붙으십시오
  - 매달리십시오
  - 밀착하십시오
  lexicon: κολλάω
  rationale: 반복적·밀착적 접속을 나타내는 동사를 자연스러운 현대 한국어로 옮기되, 단순한 접촉보다 강한 결속감을 살리기 위해 ‘달라붙다’를 선택했습니다.
- source_word: τοῖς ἁγίοις
  english_pob_choice: the holy ones
  chosen_korean: 성도들에게
  alternatives_korean:
  - 거룩한 이들에게
  - 거룩한 사람들에게
  lexicon: ἅγιοι
  rationale: 1세대 공동체 맥락에서 ‘성도’가 용례상 가장 직접적이며, 인격적 대상이 복수로 지시되는 점을 분명히 합니다.
- source_word: ἁγιασθήσονται
  english_pob_choice: will be made holy
  chosen_korean: 거룩하게 될 것입니다
  alternatives_korean:
  - 성화될 것입니다
  - 거룩해질 것입니다
  lexicon: ἁγιάζω
  rationale: 수동태의 결과를 한국어 미래 표현으로 옮겨, ‘거룩하게 됨’이라는 상태 변화를 드러내면서도 교회 용어에 과도하게 묶이지 않게 했습니다.
theological_decisions:
- issue: ‘holy ones’와 ‘made holy’의 반복되는 ἅγιος 어근 처리
  chosen_reading: 앞 절의 ‘성도들’과 뒤 절의 ‘거룩하게 될 것입니다’로 연결해, 본문의 반복과 윤리적 권면을 그대로 드러냈습니다.
  alternative_readings:
  - 두 곳 모두 ‘거룩한 이들/거룩하게 되다’로 더 평행하게 맞추는 방식
  - 두 곳 모두 ‘성도/성화되다’로 교회 용어화하는 방식
  rationale: 원문의 어근 반복이 주는 수사적 연결을 살리되, 한국어에서는 문맥상 자연스러운 구분을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 성도의 공동체성과 거룩의 전이/연결에 대한 초기 기독교 권면
