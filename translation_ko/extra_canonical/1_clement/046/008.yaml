revisions:
- from: 그가 말씀하셨습니다[a]. 「그 사람은 화가 있습니다. 그가 태어나지 않았더라면 그에게 더 좋았을 것입니다. 내 택한 자들 가운데 하나를 넘어뜨리는 것보다 말입니다. 그에게는 맷돌을 목에 걸고 바다에 빠지는 편이 더 나았을 것입니다. 내 택한 자들 가운데 하나를 잘못된 길로 이끄는 것보다 말입니다」.
  to: 그가 말했습니다. “그 사람에게 화가 있습니다. 그가 태어나지 않았더라면, 내가 택한 이들 가운데 한 사람을 실족하게 하는 것보다 그에게 더 좋았을 것입니다. 맷돌을 몸에 달고 바다에 가라앉는 편이, 내가 택한 이들 가운데 한 사람을 그릇된 길로 이끄는 것보다 그에게 더 나았을 것입니다.”
  rationale: 원문의 단순 발화 도입을 존칭 없이 보존하고, 두 비교문을 완결된 한국어 문장으로 재구성했습니다. ‘목에’를 제거하여 원문이 특정하지 않는 신체 부위를 덧붙이지 않았습니다. 영어 감사 추적의 대안 문구는 원문상의 이문이나 번역상 필수 주석이 아니므로 한국어 본문 표지와 함께 제거했습니다.
