id: 1CLEM.46.8
reference: 1 Clement 46:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: εἶπεν γάρ· Οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ· καλὸν ἦν αὐτῷ, εἰ οὐκ ἐγεννήθη, ἢ ἕνα τῶν ἐκλεκτῶν μου σκανδαλίσαι· κρεῖττον ἦν αὐτῷ περιτεθῆναι μύλον καὶ καταποντισθῆναι εἰς τὴν θάλασσαν, ἢ ἕνα τῶν ἐκλεκτῶν μου διαστρέψαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/008.yaml
  text: For he said[a], “Woe to that man. It would have been good for him if he had not been born, rather than to cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than to lead one of my chosen ones astray.”
  footnotes:
  - marker: a
    text: Or 'rather than that he should cause one of my chosen ones to stumble. It would have been better for him to have a millstone hung around him and to be sunk into the sea, than that he should turn one of my chosen ones aside.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. “그 사람에게 화가 있습니다. 그가 태어나지 않았더라면, 내가 택한 이들 가운데 한 사람을 실족하게 하는 것보다 그에게 더 좋았을 것입니다. 맷돌을 몸에 달고 바다에 가라앉는 편이, 내가 택한 이들 가운데 한 사람을 그릇된 길로 이끄는 것보다 그에게 더 나았을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν γάρ
  english_pob_choice: For he said
  chosen_korean: 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말했습니다
  - 말씀하셨습니다
  lexicon: λέγω / εἶπον
  rationale: 문맥상 앞선 성구를 인용하는 도입부이므로 평서적 ‘말했습니다’보다, 이어지는 인용문이 주님의 말씀임을 드러내는 ‘말씀하셨습니다’가 더 자연스럽고 공경스러운 한국어입니다.
- source_word: Οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  english_pob_choice: Woe to that man
  chosen_korean: 그 사람은 화가 있습니다
  alternatives_korean:
  - 그 사람에게 화가 있습니다
  - 그 사람에게 재앙이 있습니다
  lexicon: οὐαί
  rationale: οὐαί는 단순 감탄이 아니라 심판적 경고이므로 ‘화가 있습니다’로 옮겨 강한 경고의 뉘앙스를 살렸습니다.
- source_word: ἕνα τῶν ἐκλεκτῶν μου
  english_pob_choice: one of my chosen ones
  chosen_korean: 내 택한 자들 가운데 하나
  alternatives_korean:
  - 내가 택한 이들 가운데 하나
  - 내 선택한 자들 가운데 하나
  lexicon: ἐκλεκτός
  rationale: POB의 ‘chosen ones’를 따라 ‘택한 자들’로 옮기되, 집단 속 한 사람임을 분명히 하려고 ‘가운데 하나’를 덧붙였습니다.
- source_word: σκανδαλίσαι
  english_pob_choice: to cause ... to stumble
  chosen_korean: 넘어뜨리는 것
  alternatives_korean:
  - 실족하게 하는 것
  - 걸려 넘어지게 하는 것
  lexicon: σκανδαλίζω
  rationale: σκανδαλίζω의 기본적 의미는 ‘실족하게 하다’이지만, 여기서는 도덕적/영적 타격을 주는 결과를 간결하게 드러내는 ‘넘어뜨리다’를 택했습니다. 다만 각주로 다른 독해 가능성을 보완했습니다.
- source_word: διαστρέψαι
  english_pob_choice: to lead ... astray
  chosen_korean: 잘못된 길로 이끄는 것
  alternatives_korean:
  - 비뚤어지게 하는 것
  - 돌이키게 하는 것
  lexicon: διαστρέφω
  rationale: διαστρέφω는 ‘뒤틀다/곡해하다/잘못되게 하다’의 뜻을 가지므로, 결과를 드러내는 ‘잘못된 길로 이끄다’가 자연스럽고 오해가 적습니다.
theological_decisions:
- issue: 인용문의 화자와 존칭 수준
  chosen_reading: 본문의 도입부는 ‘그가 말씀하셨습니다’로, 인용된 심판 경고는 직접화법으로 유지했습니다.
  alternative_readings:
  - 그가 말했습니다
  - 주께서 말씀하셨습니다
  rationale: 원문은 단순히 ‘그가 말했다’이지만, 여기서는 인용되는 경고가 신적 권위를 띠므로 한국어에서는 ‘말씀하셨습니다’가 내용의 무게를 잘 보존합니다. 다만 본문 내 직접 인용은 원문의 긴박한 어조를 유지했습니다.
  doctrine_reference: 성경 인용의 권위와 직접화법 보존
- issue: ‘택한 자들’의 범주
  chosen_reading: ‘내 택한 자들’로 유지했습니다.
  alternative_readings:
  - 내 선택받은 이들
  - 내가 택한 사람들
  rationale: 본문은 공동체 안에서 선택된 이들을 가리키는 표현으로, 교회 전통 용어를 무리하게 바꾸지 않고 원문 의미를 직접적으로 드러내는 ‘택한 자들’이 적절합니다.
  doctrine_reference: 하나님의 선택과 공동체 내부 경고
