  source_fidelity: 원문의 두 비교 구문과 핵심 동사(σκανδαλίσαι, διαστρέψαι)는 대체로 반영되어 있습니다. 그러나 εἶπεν은 단순히 ‘말했습니다’인데 초안의 ‘말씀하셨습니다’는 원문에 없는 존칭 및 화자 식별을 부가합니다. 또한 περιτεθῆναι에는 ‘목에’가 명시되지 않았으며, 비교구문의 ‘것보다 말입니다’는 문법적으로 미완성입니다.
  naturalness: 초안은 ‘그 사람은 화가 있습니다’와 두 차례의 문장 파편 ‘…것보다 말입니다’가 현대 표준 한국어의 자연스러운 문장 흐름을 해칩니다. 비교 대상과 앞 절을 한 문장으로 연결하면 명료하고 격식 있는 합쇼체가 됩니다.
  terminology: ἐκλεκτῶν은 ‘내가 택한 이들’로 자연스럽고 중립적으로 옮겼습니다. σκανδαλίσαι는 이 문맥의 확립된 비유적 의미를 보존하는 ‘실족하게 하다’로, διαστρέψαι는 단순한 물리적 방향 전환보다 강한 왜곡·그릇된 인도의 의미를 반영하는 ‘그릇된 길로 이끌다’로 옮겼습니다.
