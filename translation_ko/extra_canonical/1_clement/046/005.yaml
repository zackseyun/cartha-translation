  text: Why are there quarrels and anger and divisions and schisms and even war among you?
translation:
  language: ko
  text: 너희 가운데에 왜 다툼과 분노와 분열과 분파와 심지어 전쟁까지 있습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρεις
  english_pob_choice: quarrels
  chosen_korean: 다툼
  alternatives_korean:
  - 논쟁
  - 불화
  lexicon: ἔρις
  rationale: 관계가 깨지는 분쟁을 가리키는 말로, 단순한 의견 차이보다 공동체 내 갈등을 드러내는 ‘다툼’이 문맥에 잘 맞습니다.
- source_word: θυμοὶ
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 화
  - 노여움
  lexicon: θυμός
  rationale: 개정 전 영어의 ‘outbursts of anger’보다 ‘anger’로 조정된 audit trail을 반영하여, 감정적 분노를 직접적으로 드러내는 ‘분노’로 옮겼습니다.
- source_word: διχοστασίαι
  english_pob_choice: divisions
  chosen_korean: 분열
  alternatives_korean:
  - 갈라짐
  - 분쟁
  lexicon: διχοστασία
  rationale: 공동체가 둘로 갈라지는 상태를 나타내므로, 결과 상태를 드러내는 ‘분열’이 적절합니다.
- source_word: σχίσματα
  english_pob_choice: schisms
  chosen_korean: 분파
  alternatives_korean:
  - 파벌
  - 갈라짐
  lexicon: σχίσμα
  rationale: 앞의 ‘분열’과 어휘를 구별해, 갈라져 생긴 파벌적 분리를 뜻하는 ‘분파’로 옮겨 반복을 살렸습니다.
theological_decisions:
- issue: 공동체 내부 갈등을 나열하는 수사 구조
  chosen_reading: 질문형 수사를 유지해, 단순 비난이 아니라 공동체의 실제 상태를 직면시키는 경고로 읽었습니다.
  alternative_readings:
  - 평서형으로 완화하여 ‘너희 가운데 다툼과…가 있습니다’라고 옮길 수 있음
  rationale: 원문 ἱνατί의 직접적인 질문성을 보존하는 것이 문장의 긴박성과 책망의 힘을 살립니다.
  doctrine_reference: 교회론/공동체 윤리
