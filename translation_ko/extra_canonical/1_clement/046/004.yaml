  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: κολληθῶμεν οὖν τοῖς ἀθῴοις καὶ δικαίοις· εἰσὶν δὲ οὗτοι ἐκλεκτοὶ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/004.yaml
  text: Let us therefore join ourselves to the innocent and righteous[a], for these are God’s chosen ones.
  footnotes:
  - marker: a
    text: Or ', and these are'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리도 무죄하고 의로운 이들과 함께하자. 이들은 하나님의 택하신 이들이기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  english_pob_choice: join ourselves to
  chosen_korean: 함께하자
  alternatives_korean:
  - 붙자
  - 연합하자
  - 결합하자
  lexicon: κολλάω
  rationale: 직역하면 ‘붙다/달라붙다’이지만, 문맥상 사람들과 편을 같이하고 자신을 그들과 결속시키라는 권면이므로 현대 한국어에서는 자연스럽게 ‘함께하자’로 옮겼습니다.
- source_word: τοῖς ἀθῴοις καὶ δικαίοις
  english_pob_choice: the innocent and righteous
  chosen_korean: 무죄하고 의로운 이들
  alternatives_korean:
  - 무흠하고 의로운 이들
  - 죄 없는 의인들
  - 무죄한 자들과 의인들
  lexicon: ἀθῷος, δίκαιος
  rationale: ἀθῴοις는 단순히 ‘착한’이 아니라 죄책이 없다는 뜻이므로 ‘무죄한/무죄하고’로, δικαίοις는 도덕적이거나 법정적인 ‘의로운’으로 유지했습니다.
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  english_pob_choice: God’s chosen ones
  chosen_korean: 하나님의 택하신 이들
  alternatives_korean:
  - 하나님께서 택하신 이들
  - 하나님의 선택받은 이들
  - 하나님의 택함을 입은 이들
  lexicon: ἐκλεκτός
  rationale: ἐκλεκτοί는 신분을 나타내는 표현이므로 ‘택하신 이들’로 간결하게 옮겨, 선택의 주체가 하나님이심을 분명히 했습니다.
theological_decisions:
- issue: ‘죄 없는’과 ‘의로운’의 병렬 표현을 어떻게 살릴지
  chosen_reading: 두 형용사를 모두 살려, 도덕적 흠결 없음과 올바름을 함께 지칭하는 표현으로 번역했습니다.
  alternative_readings:
  - ‘의인들’로 합쳐 번역
  - ‘무죄한 자들’만 강조
  rationale: 본문은 ἀθῴοις καὶ δικαίοις라는 두 항을 함께 제시하므로, 의미를 합쳐 약화시키기보다 병렬성을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 원문 병렬 구조 보존
- issue: ‘택하신 이들’의 신학적 함의
  chosen_reading: 하나님의 주권적 선택을 직접 드러내는 ‘하나님의 택하신 이들’로 옮겼습니다.
  alternative_readings:
  - ‘선택받은 자들’
  - ‘하나님의 선택된 이들’
  rationale: ἐκλεκτοί τοῦ θεοῦ는 단순한 명예 호칭이 아니라 하나님의 선택 행위를 전제하므로, 그 주체성을 분명히 하는 번역이 필요합니다.
  doctrine_reference: 선택 교리
