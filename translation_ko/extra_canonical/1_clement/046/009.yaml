  source_fidelity: 그리스어의 네 병렬 결과(많은 사람을 빗나가게 함, 낙심에 빠뜨림, 의심에 빠뜨림, 우리 모두를 슬픔에 빠뜨림)와 결론절을 충실히 반영합니다. τὸ σχίσμα와 στάσις를 각각 ‘분열’과 ‘파당 싸움’으로 달리 옮겨 원문의 어휘적 구별도 유지했습니다. ‘계속되고 있습니다’는 ἐπίμονος ... ἐστίν의 지속성을 자연스럽게 전달합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 병렬 구조와 문장 연결도 명료합니다. ‘빗나가게 했고’는 이 문맥에서 사람들을 바른 길에서 벗어나게 했다는 의미를 무리 없이 드러냅니다.
  terminology: ‘분열’, ‘낙심’, ‘의심’, ‘슬픔’, ‘파당 싸움’은 공동체 분쟁 문맥 및 각 그리스어 표현에 적절합니다. 특정 교파적 해석을 덧붙이지 않았습니다.
