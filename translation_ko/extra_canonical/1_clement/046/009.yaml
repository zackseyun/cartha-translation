id: 1CLEM.46.9
reference: 1 Clement 46:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ σχίσμα ὑμῶν πολλοὺς διέστρεψεν, πολλοὺς εἰς ἀθυμίαν ἔβαλεν, πολλοὺς εἰς δισταγμόν, τοὺς πάντας ἡμᾶς εἰς λύπην· καὶ ἐπίμονος ὑμῶν ἐστὶν ἡ στάσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/046/009.yaml
  text: Your schism has turned many aside, cast many into discouragement, many into doubt, and all of us into grief; and your factional strife persists.
translation:
  language: ko
  text: 여러분의 분열은 많은 사람을 빗나가게 했고, 많은 사람을 낙심에 빠뜨렸으며, 많은 사람을 의심에 빠뜨렸고, 우리 모두를 슬픔에 빠뜨렸습니다. 그리고 여러분의 파당 싸움은 계속되고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ σχίσμα
  english_pob_choice: your schism
  chosen_korean: 여러분의 분열
  alternatives_korean:
  - 여러분의 분파
  - 여러분의 갈라짐
  lexicon: schism → 분열
  rationale: 교회적 색채의 ‘분열’을 써서 σχίσμα의 공동체 파괴성을 살렸습니다. ‘분파’는 결과 집단을 너무 앞세우고, ‘갈라짐’은 추상적입니다.
- source_word: διέστρεψεν
  english_pob_choice: has turned aside
  chosen_korean: 빗나가게 했고
  alternatives_korean:
  - 돌이키게 했고
  - 탈선하게 했고
  lexicon: διαστρέφω → 빗나가게 하다
  rationale: 직역적이되 의미가 드러나도록 ‘빗나가게 했고’로 옮겨, 사람들을 곁길로 돌린 뉘앙스를 유지했습니다.
- source_word: ἀθυμίαν
  english_pob_choice: discouragement
  chosen_korean: 낙심
  alternatives_korean:
  - 의기소침
  - 낙담
  lexicon: ἀθυμία → 낙심
  rationale: 문맥상 내적 기력 상실을 가리키므로 표준적이면서도 강한 ‘낙심’을 택했습니다.
- source_word: δισταγμόν
  english_pob_choice: doubt
  chosen_korean: 의심
  alternatives_korean:
  - 머뭇거림
  - 주저함
  lexicon: δισταγμός → 의심/주저
  rationale: 여기서는 신앙적 확신의 흔들림을 가리키므로 ‘의심’이 가장 자연스럽습니다. ‘주저함’은 행동 지연 쪽으로 더 좁습니다.
- source_word: στάσις
  english_pob_choice: factional strife
  chosen_korean: 파당 싸움
  alternatives_korean:
  - 당파 싸움
  - 내분
  lexicon: στάσις → 파당 싸움
  rationale: στάσις의 정치·공동체적 분열과 소요를 드러내기 위해 ‘파당 싸움’으로 옮겼습니다. 단순한 ‘내분’보다 대립의 성격이 선명합니다.
theological_decisions:
- issue: 분열이 미치는 공동체적 범위
  chosen_reading: ‘우리 모두를 슬픔에 빠뜨렸습니다’로 번역해, 저자 자신을 포함한 공동체 전체의 상처를 드러냈습니다.
  alternative_readings:
  - ‘우리 모두를 근심에 빠뜨렸습니다’
  - ‘우리 모두를 비탄에 잠기게 했습니다’
  rationale: λύπη는 단순한 걱정보다 더 깊은 슬픔을 나타내므로, 문맥의 공동체적 탄식을 살리는 표현을 택했습니다.
  doctrine_reference: 공동체 일치와 형제애의 파괴라는 본문 주제
- issue: ἐπίμονος ... ἐστὶν ἡ στάσις의 지속성
  chosen_reading: ‘그리고 여러분의 파당 싸움은 계속되고 있습니다’
  alternative_readings:
  - ‘여러분의 파당 싸움은 끈질깁니다’
  - ‘여러분의 파당 싸움은 집요하게 남아 있습니다’
  rationale: POB의 ‘persists’를 반영하되, 한국어에서는 상태의 지속을 가장 자연스럽게 드러내는 현재 진행형 표현을 사용했습니다.
  doctrine_reference: 회중 내 지속되는 분열의 책망
