base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022.yaml
  text: 'And the faith that is in Messiah confirms all these things[a]. For he himself also, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord. Who is the man who desires life, loving to see good days? Keep your tongue from evil, and your lips from speaking deceit. Turn away from evil and do good. Seek peace and pursue it. The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth. The righteous cried out, and the Lord heard him and delivered him from all his afflictions. Many are the afflictions of the righteous, and from all of them the Lord will deliver him.” Then: “Many are the blows of the sinner[b][c][d][e][a], but mercy will surround those who hope in the Lord.”'
  footnotes:
  - marker: a
    text: The wording from this point is a citation of Psalm 34:11–17, with the final sentence echoing Psalm 32:10 in the Greek tradition.
    reason: cross_reference
    anchor_ref: '22:1'
  - marker: a
    text: Or possibly, 'faith in the Messiah confirms all these things.' The Greek phrase can be rendered more explicitly, but the main text keeps the source's compact form.
    reason: lexical_alternative
    anchor_ref: '22:1'
  - marker: e
    text: '''Man'' renders Greek ἄνθρωπος in a representative singular sense, not as excluding women.'
    reason: cultural_note
    anchor_ref: '22:2'
  - marker: d
    text: '''Blows'' could also be rendered ''scourges'' or ''lashes,'' but the Greek can denote severe strokes or punishments more generally.'
    reason: lexical_alternative
    anchor_ref: '22:9'
  - marker: c
    text: Or 'And the faith that is in the Messiah confirms'.
    reason: previous_rendering
  - marker: b
    text: Or 'Stop your tongue from evil'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 모든 것은 그리스도 안에 있는 믿음이 확증합니다. 또한 그는 성령을 통하여 이렇게 우리를 부르십니다. 「오너라, 자녀들아. 내 말을 들으라. 내가 너희에게 주를 두려워하는 것을 가르치겠다. 생명을 사모하고 좋은 날을 보기를 원하는 사람이 누구냐? 네 혀를 악에서 지키고, 네 입술이 속임수를 말하지 못하게 하라. 악에서 떠나 선을 행하고, 평화를 구하며 그것을 따르라. 주의 눈은 의인들을 향하고, 그의 귀는 그들의 간구를 향하며, 주의 얼굴은 악을 행하는 자들을 대적하여 땅에서 그들의 기억을 지워 버리려 하신다. 의인이 부르짖었고, 주께서 그를 들으시고 그의 모든 환난에서 건져 내셨다. 의인의 환난은 많지만, 그 모든 것에서 주께서 그를 건져 내실 것이다.」 그러고 나서 「죄인의 매는 많지만, 주를 바라는 이들을 긍휼이 두르리라」라고 합니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐν Χριστῷ πίστις
  english_pob_choice: the faith that is in Messiah / Christ
  chosen_korean: 그리스도 안에 있는 믿음
  alternatives_korean:
  - 메시아 안에 있는 믿음
  - 그리스도에 대한 믿음
  - 메시아를 믿는 믿음
  lexicon: BDAG / DOCTRINE.md
  rationale: ἐν Χριστῷ의 위치 표현을 살려 ‘안에 있는’으로 옮기고, πίστις는 ‘믿음’으로 유지해 문장의 압축성과 신학적 중량을 보존했습니다.
- source_word: προσκαλεῖται
  english_pob_choice: calls us
  chosen_korean: 우리를 부르십니다
  alternatives_korean:
  - 우리를 초대하십니다
  - 우리를 소환하십니다
  lexicon: LSJ
  rationale: 시편 인용을 도입하는 직접적 초청/호출의 뉘앙스를 살리되, 한국어에서 자연스러운 ‘부르십니다’로 옮겼습니다.
- source_word: φόβον κυρίου
  english_pob_choice: the fear of the Lord
  chosen_korean: 주를 두려워하는 것
  alternatives_korean:
  - 주의 두려움
  - 주님을 경외하는 것
  lexicon: BDAG
  rationale: 전통적 ‘경외’보다 본문의 직설적 어감을 살려 ‘두려워하는 것’으로 옮겼고, 합쇼체 교훈문맥에 맞게 자연화했습니다.
- source_word: ἄνθρωπος
  english_pob_choice: the man
  chosen_korean: 사람이 누구냐
  alternatives_korean:
  - 누구냐
  - 인간이 누구냐
  lexicon: BDAG
  rationale: 대표적 단수 질문으로서 한국어에서는 성별을 드러내지 않는 ‘사람’이 원문의 일반화된 물음을 더 잘 전달합니다.
- source_word: μάστιγες
  english_pob_choice: blows
  chosen_korean: 매
  alternatives_korean:
  - 몽둥이질
  - 채찍질
  - 타격
  lexicon: LSJ
  rationale: 시편 전승의 징계 이미지를 보존하면서도, 한국어 성경문체에서 이해되기 쉬운 짧은 대응어로 잡았습니다.
theological_decisions:
- issue: ψαλμ 전승 인용의 직설적 명령문 톤
  chosen_reading: 시편 인용의 명령형과 권면형을 그대로 살려, 반말형 명령(오너라/들으라/지키라/떠나라/행하라/구하라/따르라)으로 인용부를 옮겼습니다.
  alternative_readings:
  - 더 완곡한 권면형으로 바꾸기
  - 합쇼체 명령으로 평탄화하기
  rationale: 원문 인용은 아버지/교사적 직설 권면의 톤이 강하므로, 내부 인용에서는 문법적 격식보다 원문의 수사적 힘을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve rhetorical force and register shifts in quoted speech.'
- issue: κύριος의 반복과 시편 인용 맥락
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 야훼
  rationale: 인용 전체가 1 Clement의 그리스어 시편 인용으로 유지되며, 본문 내에서는 반복되는 κύριος를 한국어 성경의 일반적 인용 관례에 맞게 ‘주’로 통일했습니다.
  doctrine_reference: 'DOCTRINE.md: Use source-grounded divine name policy with context-sensitive quotation handling.'
