  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Οἱ ἀπόστολοι ἡμῖν εὐηγγελίσθησαν ἀπὸ τοῦ κυρίου Ἰησοῦ Χριστοῦ, Ἰησοῦς ὁ Χριστὸς ἀπὸ τοῦ θεοῦ ἐξεπέμφθη. ὁ Χριστὸς οὖν ἀπὸ τοῦ θεοῦ καὶ οἱ ἀπόστολοι ἀπὸ τοῦ Χριστοῦ· ἐγένοντο οὖν ἀμφότερα εὐτάκτως ἐκ θελήματος θεοῦ. παραγγελίας οὖν λαβόντες καὶ πληροφορηθέντες διὰ τῆς ἀναστάσεως τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ, μετὰ πληροφορίας πνεύματος ἁγίου ἐξῆλθον εὐαγγελιζόμενοι, τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι. κατὰ χώρας οὖν καὶ πόλεις κηρύσσοντες καθίστανον τὰς ἀπαρχὰς αὐτῶν, δοκιμάσαντες τῷ πνεύματι, εἰς ἐπισκόπους καὶ διακόνους τῶν μελλόντων πιστεύειν. καὶ τοῦτο οὐ καινῶς· ἐκ γὰρ δὴ πολλῶν χρόνων ἐγέγραπτο περὶ ἐπισκόπων καὶ διακόνων. οὕτως γάρ που λέγει ἡ γραφή· Καταστήσω τοὺς ἐπισκόπους αὐτῶν ἐν δικαιοσύνῃ καὶ τοὺς διακόνους αὐτῶν ἐν πίστει.
  language: Greek
  pages: []
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/042.yaml
  text: The apostles were given the good news for us from the Lord Jesus Messiah[a], and Jesus the Messiah was sent out from God. So then the Messiah is from God, and the apostles are from the Messiah; therefore both came about in good order from the will of God. Therefore, after receiving instructions, and having been fully assured through the resurrection of our Lord Jesus Messiah, and having been confirmed in the word of God, they went out with the full assurance of the Holy Spirit, proclaiming the good news that the kingdom of God is about to come. So, preaching through regions and cities, they would appoint their firstfruits, after testing them by the Spirit, as overseers and deacons for those who were going to believe. And this was not something new, for indeed it had been written about overseers and deacons from very ancient times. For somewhere the Scripture says, “I will appoint their overseers in righteousness[e][d][c][b], and their deacons in faith.”
  footnotes:
  - marker: a
    text: Or 'having been entrusted with the word of God' for πιστωθέντες ἐν τῷ λόγῳ τοῦ θεοῦ; the phrase may emphasize either confirmation in, or entrustment with, God's word.
    reason: lexical_alternative
  - marker: b
    text: '''Overseers'' translates ἐπίσκοποι and avoids importing later assumptions attached to the English word ''bishops.'''
    reason: lexical_alternative
  - marker: c
    text: The closing citation echoes Isaiah 60:17 in a form adapted in early Christian usage.
    reason: cross_reference
  - marker: d
    text: '''In faith'' may also be understood as ''in faithfulness.'''
    reason: lexical_alternative
  - marker: e
    text: Or 'they appointed'.
    reason: previous_rendering
translation:
  language: ko
  text: 사도들은 우리에게 주 예수 메시아로부터 복음을 전해 주었고, 예수 메시아는 하나님으로부터 보내심을 받으셨습니다. 그러므로 메시아는 하나님으로부터, 사도들은 메시아로부터 나온 것이니, 결국 둘 다 하나님의 뜻 안에서 질서 있게 이루어졌습니다. 그러므로 그들은 명령을 받고, 우리 주 예수 메시아의 부활을 통해 충분히 확신을 얻었으며, 하나님의 말씀 안에서 확증된 뒤, 성령의 충만한 확신을 가지고 나가서 하나님의 나라가 곧 오리라는 복음을 전하였습니다. 그리하여 지역과 도시마다 다니며 선포할 때, 장차 믿게 될 사람들의 첫 열매를 영으로 시험한 뒤, 감독들과 집사들로 세우곤 했습니다. 이것은 새로운 일이 아니었습니다. 실제로 감독들과 집사들에 관해서는 아주 오래전부터 기록되어 있었습니다. 성경은 어디선가 이렇게 말씀합니다. “내가 그들의 감독들을 의로 세우고, 그들의 집사들을 믿음 안에서 세울 것이다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐηγγελίσθησαν
  english_pob_choice: were given the good news for us
  chosen_korean: 우리에게 복음을 전해 주었고
  alternatives_korean:
  - 우리에게 복음이 전해졌고
  - 우리에게 복음을 주었고
  - 우리에게 복음을 선포하였고
  lexicon: BDAG
  rationale: 수동형의 수혜적 뉘앙스를 살리면서도 한국어에서는 자연스럽게 ‘전해 주다’로 옮겨, 사도들이 우리를 위한 복음의 전달자였다는 점을 드러냈습니다.
- source_word: Χριστός
  english_pob_choice: Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  lexicon: BDAG
  rationale: 이 문맥은 титуле(force)로 쓰인 Χριστός이므로, 프로젝트 기본 방침에 따라 ‘메시아’로 옮겨 명칭화된 ‘그리스도’의 교회적 관용어를 피했습니다.
- source_word: ἐξεπέμφθη
  english_pob_choice: was sent out
  chosen_korean: 보내심을 받으셨습니다
  alternatives_korean:
  - 보내심을 받았습니다
  - 보내졌습니다
  - 파송되셨습니다
  lexicon: BDAG
  rationale: 하나님으로부터의 파송이라는 선교적 연쇄를 살리되, 한국어에서는 ‘보내심을 받다’가 가장 자연스럽고 공손한 서술형입니다.
- source_word: ἐπίσκοποι
  english_pob_choice: overseers
  chosen_korean: 감독들
  alternatives_korean:
  - 주교들
  - 장로들
  - 감독자들
  lexicon: BDAG
  rationale: 후대의 제도적 함의를 가진 ‘주교’ 대신, 그리스어 직분어를 투명하게 반영하는 ‘감독’으로 옮겼습니다.
- source_word: διακόνους
  english_pob_choice: deacons
  chosen_korean: 집사들
  alternatives_korean:
  - 봉사자들
  - 일꾼들
  - 시종들
  lexicon: BDAG
  rationale: 여기서는 교회 직분으로 쓰이므로, 일반적 ‘봉사자’보다 직분어인 ‘집사’가 문맥에 더 정확합니다.
- source_word: ἐν δικαιοσύνῃ
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 의 가운데
  - 정의로
  lexicon: BDAG
  rationale: 인용문의 병행구조를 고려해 간결하게 ‘의로’로 옮겨, 하나님 앞의 올바름이라는 성경적 어감을 살렸습니다.
theological_decisions:
- issue: τὴν βασιλείαν τοῦ θεοῦ μέλλειν ἔρχεσθαι의 임박성
  chosen_reading: ‘하나님의 나라가 곧 오리라는’으로 옮겨 임박한 도래를 분명히 했습니다.
  alternative_readings:
  - 하나님의 나라가 오게 될 것이라고
  - 하나님의 나라가 장차 올 것이라고
  rationale: μέλλειν ἔρχεσθαι는 단순 미래보다 임박성과 긴박성을 띠므로, 이를 약화시키지 않도록 ‘곧’과 미래 시제를 함께 살렸습니다.
  doctrine_reference: 종말론적 선포의 긴급성 보존
- issue: πνεύματος ἁγίου의 번역
  chosen_reading: ‘성령의 충만한 확신’으로 옮겼습니다.
  alternative_readings:
  - 거룩한 영의 충만한 확신
  - 성령으로 가득한 확신
  rationale: πνεύματος ἁγίου는 이 문맥에서 명백히 하나님의 영을 가리키므로, 프로젝트 기본어인 ‘성령’을 사용했습니다. 동시에 πληροφορίας와의 결합을 살려 ‘충만한 확신’으로 다듬었습니다.
  doctrine_reference: 성령 관련 표준 용례
