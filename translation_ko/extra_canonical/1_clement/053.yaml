base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/053.yaml
  text: 'For you know the holy Scriptures—and know them well[a], beloved—and you have bent closely over the sayings of God. Therefore we write these things for your remembrance.


    2. For when Moses had gone up onto the mountain and had spent forty days and forty nights in fasting and humiliation, God said to him, “Moses, Moses, come down quickly from here, because your people, whom you brought out of the land of Egypt, have acted lawlessly. They have quickly turned aside from the way that I commanded them; they have made molten images for themselves.”


    3. And the Lord said to him, “I have spoken to you once and twice, saying, ‘I have seen this people, and behold, it is stiff-necked. Leave me alone to utterly destroy them, and I will blot out their name from under heaven; and I will make you into a nation great and marvelous and far greater than this one.’”


    4. And Moses said, “By no means, Lord. Forgive this people their sin—or else blot me out from the book of the living.”


    5. O great love! O unsurpassable perfection! A servant speaks boldly to his Lord, asks forgiveness for the multitude[b][c][d][e][f][g], or even pleads to be blotted out with them.'
  footnotes:
  - marker: a
    text: The verb rendered 'have bent closely over' pictures stooping or leaning over the divine words in careful attention.
    reason: lexical_alternative
    anchor_ref: '53:1'
  - marker: g
    text: Or 'the book of life'; the Greek more literally says 'the book of the living.'
    reason: lexical_alternative
    anchor_ref: '53:4'
  - marker: f
    text: '''Servant'' renders θεράπων, an honorable term for one in devoted attendance, not the more common δοῦλος.'
    reason: lexical_alternative
    anchor_ref: '53:5'
  - marker: e
    text: Clement is recalling the episode of Israel's sin with the calf and Moses' intercession; compare Exodus 32:7-32 and Deuteronomy 9:9-14.
    reason: cross_reference
    anchor_ref: 53:2-4
  - marker: d
    text: Or 'that I commanded them'.
    reason: previous_rendering
  - marker: c
    text: Or 'Leave me, that I may utterly destroy them'.
    reason: previous_rendering
  - marker: b
    text: Or 'humiliation'.
    reason: previous_rendering
translation:
  language: ko
  text: '여러분은 거룩한 성경을 알고, 사랑하는 이들아, 그것들을 잘 알고 있으며, 하나님의 말씀에 깊이 몸을 굽히고 있습니다. 그러므로 우리는 여러분의 기억을 위해 이 일들을 씁니다.


    2. 모세가 산으로 올라가 사십 일 사십 밤을 금식과 자기 낮춤 가운데 보냈을 때, 하나님이 그에게 말씀하셨습니다. “모세야, 모세야, 여기서 속히 내려가거라. 네가 이집트 땅에서 이끌어 낸 네 백성이 불법을 저질렀다. 그들은 내가 그들에게 명령한 길에서 속히 벗어나 자신들을 위해 주조한 것들을 만들었다.”


    3. 그리고 주께서 그에게 말씀하셨습니다. “내가 네게 한 번도 말했고 두 번도 말하면서 말하였다. ‘내가 이 백성을 보았는데, 보라, 그들은 목이 뻣뻣한 백성이다. 내가 그들을 완전히 멸하도록 내버려 두어라. 그러면 내가 그들의 이름을 하늘 아래에서 지워 버리겠다. 그리고 내가 너를 이 백성보다 훨씬 더 크고 놀라운 크나큰 민족으로 만들겠다.’”


    4. 모세가 말했습니다. “그럴 수 없습니다, 주님. 이 백성의 죄를 용서해 주십시오. 그렇지 않다면 저를 생명들의 책에서 지워 주십시오.”


    5. 오, 큰 사랑이여! 오, 능가할 수 없는 완전함이여! 한 종이 자기 주님 앞에서 담대히 말하며, 그 무리를 위해 용서를 구하고, 심지어 그들과 함께 지워지기를 청합니다.[a][b][c][d][e][f][g]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκεκύφατε
  english_pob_choice: you have bent closely over
  chosen_korean: 깊이 몸을 굽히고 있습니다
  alternatives_korean:
  - 깊이 들여다보고 있습니다
  - 몸을 숙여 주의 깊게 보고 있습니다
  lexicon: LSJ
  rationale: 원문의 몸을 굽혀 살피는 물리적 비유를 살리면서, 한국어에서는 자연스럽게 ‘깊이 몸을 굽히다’로 옮겨 주의 깊은 집중을 표현했습니다.
- source_word: λόγια τοῦ θεοῦ
  english_pob_choice: the sayings of God
  chosen_korean: 하나님의 말씀
  alternatives_korean:
  - 하나님의 말씀들
  - 하나님의 신탁
  lexicon: BDAG
  rationale: λόγια는 단순한 ‘말들’보다 신적 발화를 가리키므로, 한국어에서는 수용 가능한 경건한 표현인 ‘하나님의 말씀’으로 옮기되 복수감은 문맥으로 유지했습니다.
- source_word: πρὸς ἀνάμνησιν
  english_pob_choice: for your remembrance
  chosen_korean: 여러분의 기억을 위해
  alternatives_korean:
  - 기억나게 하려고
  - 회상을 위해
  lexicon: BDAG
  rationale: 명사구의 목적성을 살려, 단순 설명보다 권면적 성격이 드러나는 ‘기억을 위해’로 옮겼습니다.
- source_word: ταπεινώσει
  english_pob_choice: humiliation
  chosen_korean: 자기 낮춤
  alternatives_korean:
  - 겸비
  - 겸손
  lexicon: LSJ
  rationale: 금식과 병렬된 자기 절제의 뜻을 고려해, 현대 한국어에서 오해가 적고 자발적 낮아짐을 잘 드러내는 ‘자기 낮춤’을 선택했습니다.
- source_word: ἠνόμησεν
  english_pob_choice: have acted lawlessly
  chosen_korean: 불법을 저질렀다
  alternatives_korean:
  - 율법을 어겼다
  - 법 없이 행했다
  lexicon: BDAG
  rationale: 단순한 범죄가 아니라 하나님의 질서에 대한 불법적 일탈이라는 강도를 살리기 위해 ‘불법을 저질렀다’로 옮겼습니다.
- source_word: χωνευτά
  english_pob_choice: molten images
  chosen_korean: 주조한 것들
  alternatives_korean:
  - 부어 만든 것들
  - 녹여 부은 우상들
  lexicon: LSJ
  rationale: 원문은 ‘주조한 것들’에 가깝고, 여기서는 해석어 ‘우상’을 덧붙이지 않아도 문맥상 금송아지 사건을 떠올릴 수 있으므로 더 원문에 가깝게 처리했습니다.
- source_word: θεράπων
  english_pob_choice: servant
  chosen_korean: 한 종
  alternatives_korean:
  - 한 시종
  - 한 봉사자
  lexicon: BDAG
  rationale: θεράπων은 단순한 노예보다 명예로운 시종/수행자를 뜻하므로, 문맥상 ‘종’으로 하되 ‘한’으로 앞서 강조된 존칭적 대비를 살렸습니다.
theological_decisions:
- issue: βίβλου ζώντων의 처리
  chosen_reading: 생명들의 책
  alternative_readings:
  - 생명책
  - 살아 있는 이들의 책
  rationale: 본문은 문자적으로 ‘살아 있는 자들의 책’이므로, 익숙한 교회어인 ‘생명책’으로 완전히 흡수하지 않고 원문 이미지가 남도록 ‘생명들의 책’으로 유지했습니다.
  doctrine_reference: 원문 우선과 전통어 사이의 긴장을 보존
- issue: Moses의 간구 어조
  chosen_reading: 그럴 수 없습니다, 주님. … 저를 … 지워 주십시오
  alternative_readings:
  - 결단코 아닙니다, 주님
  - 용서해 주십시오
  rationale: 모세의 중보는 강한 거절과 자기희생적 요청을 함께 드러내므로, 한국어에서도 완곡하게 약화하지 않고 직접적인 간구로 살렸습니다.
  doctrine_reference: 중보의 긴박성과 자기희생을 보존
