  to: 그러므로 그처럼 많은 이들과 그처럼 훌륭한 이들이 보여 준, 잘 증언된 겸손과 순종으로 말미암은 낮아짐은 우리뿐 아니라, 그분의 말씀을 거룩함과 진리 안에서 받아들인 우리 이전의 세대들도 더 나은 이들이 되게 하였습니다.
