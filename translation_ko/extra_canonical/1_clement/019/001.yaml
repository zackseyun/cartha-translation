  source_fidelity: 초안은 핵심 비교급(‘더 나은’)과 ‘그분의 말씀’을 대체로 반영합니다. 그러나 μεμαρτυρημένων은 ‘입증된’이라는 속성만이 아니라 앞서 언급된 이들의 겸손과 낮아짐이 잘 증언되어 있음을 나타내며, ‘순종의 낮음’은 τὸ ὑποδεές와 διὰ τῆς ὑπακοῆς의 관계를 한국어에서 부자연스럽고 불명확하게 만듭니다. 마지막 분사는 앞선 ‘우리 앞의 세대들’을 설명하므로 이를 관계절로 연결하는 편이 충실합니다.
  naturalness: ‘그렇게 많은, 그렇게 위대한 사람들의 입증된 겸손과 순종의 낮음’은 수식 관계가 과도하게 압축되어 현대 한국어로 어색합니다. ‘그처럼 많은 이들과 그처럼 훌륭한 이들이 보여 준, 잘 증언된 겸손과 순종으로 말미암은 낮아짐’으로 풀면 원문의 병렬과 수식 관계를 더 자연스럽게 드러냅니다.
