id: 1CLEM.19.1
reference: 1 Clement 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Τὴν τοσούτων οὖν καὶ τοιούτων οὕτως μεμαρτυρημένων τε ταπεινοφρόνων καὶ τὸ ὑποδεὲς διὰ τῆς ὑπακοῆς οὐ μόνον ἡμᾶς, ἀλλὰ καὶ τὰς πρὸ ἡμῶν γενεὰς βελτίους ἐποίησεν, τούς τε καταδεξαμένους τὰ λόγια αὐτοῦ ἐν ὁσίῳ καὶ ἀληθείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/019/001.yaml
  text: Therefore, the humility and submissiveness of so many and such great people, so well attested, through obedience has made not only us better, but also the generations before us—those who received his oracles in holiness and truth.
translation:
  language: ko
  text: 그러므로 그렇게 많은, 그렇게 위대한 사람들의 입증된 겸손과 순종의 낮음은 우리뿐 아니라 우리 앞의 세대들도 더 나은 사람들로 만들었습니다. 그들은 그분의 말씀을 거룩함과 진리로 받아들였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοσούτων ... καὶ τοιούτων ... οὕτως μεμαρτυρημένων
  english_pob_choice: so many and such great people, so well attested
  chosen_korean: 그렇게 많은, 그렇게 위대한 사람들의 입증된
  alternatives_korean:
  - 그처럼 많은, 그처럼 큰 인물들의 증언된
  - 이렇게 많은, 이렇게 위대한 사람들의 확증된
  lexicon: μεμαρτυρημένων
  rationale: 메마르튀레메논은 단순한 ‘전해진’보다 증언·입증의 뉘앙스가 강하므로, POB의 ‘so well attested’를 살려 ‘입증된’으로 옮겼습니다.
- source_word: ταπεινοφρόνων καὶ τὸ ὑποδεὲς ... διὰ τῆς ὑπακοῆς
  english_pob_choice: humility and submissiveness ... through obedience
  chosen_korean: 겸손과 순종의 낮음
  alternatives_korean:
  - 겸손과 복종의 낮은 태도
  - 겸손과 순종의 비천함
  lexicon: ταπεινοφρόνων / τὸ ὑποδεές / ὑπακοή
  rationale: ταπεινοφρόνων과 ὑποδεές는 ‘겸손’과 더불어 ‘낮음/비천함’의 상태를 함께 지시하므로, 두 표현을 분리하지 않고 ‘순종의 낮음’으로 압축해 원문의 중첩을 드러냈습니다.
- source_word: βελτίους ἐποίησεν
  english_pob_choice: has made ... better
  chosen_korean: 더 나은 사람들로 만들었습니다
  alternatives_korean:
  - 더 좋게 만들었습니다
  - 더 훌륭하게 하셨습니다
  lexicon: βελτίους ἐποίησεν
  rationale: βέλτιους는 비교급으로 ‘더 나은’이 직역에 가깝고, 사람을 수식하는 문맥이므로 ‘사람들로’라고 풀어 자연스럽게 했습니다.
- source_word: λόγια αὐτοῦ
  english_pob_choice: his oracles
  chosen_korean: 그분의 말씀
  alternatives_korean:
  - 그분의 신탁
  - 그분의 말씀들
  lexicon: λόγια
  rationale: λόγια는 본문에서 하나님이 주신 신탁/말씀을 가리키지만, 한국어 독자에게는 ‘말씀’이 의미 범위를 가장 정확하고 자연스럽게 전달합니다.
theological_decisions:
- issue: ὁσίῳ καὶ ἀληθείᾳ의 수용 태도
  chosen_reading: 그분의 말씀을 거룩함과 진리로 받아들였습니다
  alternative_readings:
  - 거룩함과 진리 안에서
  - 거룩함과 진리로
  rationale: ὁσίῳ καὶ ἀληθείᾳ는 단순한 외적 수용 방식보다 말씀을 맞이하는 경건한 상태를 강조하므로, POB의 의미를 따라 수용의 질을 드러내는 표현으로 옮겼습니다.
  doctrine_reference: 성화와 참된 수용의 태도
