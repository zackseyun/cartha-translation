source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως. . σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν. 3. ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
  pages:
  - 339
  - 341
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061.yaml
  text: You[a], Master, gave them the authority of kingship through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you[b], we might submit to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without stumbling the rule you have given them. For you, Master, heavenly King of the ages, give glory and honor and authority over the things on earth to the sons of men. You, Lord, direct their counsel according to what is good and pleasing before you, so that, administering in peace and gentleness, in a godly way, the authority you have given them, they may obtain your favor. To you, who alone are able to do these things and greater good things for us, we give thanks through the high priest and protector of our souls, Jesus Messiah, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[g][f][e][d][c]. Amen.
  footnotes:
  - marker: a
    text: Or 'royal authority' for 'the authority of rule.'
    reason: lexical_alternative
  - marker: b
    text: '''Sons of men'' preserves the scriptural cadence of the Greek phrase and refers to human beings generally.'
    reason: cultural_note
  - marker: c
    text: Or 'they may obtain your mercy' at 'they may obtain your favor.'
    reason: alternative_reading
  - marker: d
    text: Compare 1 Pet 2:13–17 and 1 Tim 2:1–2 for early Christian prayer and submission in relation to rulers.
    reason: cross_reference
  - marker: e
    text: Or 'they may obtain your favor'.
    reason: previous_rendering
  - marker: f
    text: Or 'from generation to generation'.
    reason: previous_rendering
  - marker: g
    text: Or 'You alone are able to do these things and greater good things for us; to you we give thanks'.
    reason: previous_rendering
translation:
  language: ko
  text: 주권자님, 주님은 당신의 장엄하고 말로 다 헤아릴 수 없는 능력을 통하여 그들에게 왕권의 권위를 주셨습니다. 그들에게 당신이 주신 영광과 존귀를 알고서 우리가 그들에게 복종하며, 당신의 뜻을 거스르는 일이 하나도 없게 하소서. 그들에게 건강과 평강과 화합과 안정도 허락하셔서, 당신이 그들에게 주신 통치를 걸려 넘어짐 없이 다스리게 하소서. 주권자님, 당신은 하늘에 계신 영원한 왕이시며, 사람의 아들들에게 땅 위에 있는 것들의 영광과 존귀와 권위를 주십니다. 주님, 그들의 계획을 당신 앞에서 선하고 기쁜 일에 따라 인도하셔서, 평강과 온유 가운데 경건하게 당신이 그들에게 주신 권위를 다스리며 당신의 은총을 얻게 하소서. 오직 이 일과 우리에게 더 큰 선까지도 행하실 수 있는 분이신 당신께, 우리 영혼의 대제사장과 보호자이신 예수 메시아를 통하여 감사드립니다. 그를 통하여 영광과 위엄이 지금도, 대대로, 또 영원 무궁토록 당신께 있기를 빕니다. 아멘.[a][b][c][d][e][f][g]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주권자님
  alternatives_korean:
  - 주님
  - 주인님
  lexicon: BDAG
  rationale: δέσποτα는 κύριε와 구별되는 절대적 주권 호칭이므로, 단순한 '주님'보다 주권성을 드러내는 표현을 택했습니다.
- source_word: ἐξουσίαν τῆς βασιλείας
  english_pob_choice: the authority of kingship
  chosen_korean: 왕권의 권위
  alternatives_korean:
  - 통치 권위
  - 왕의 권세
  lexicon: LSJ
  rationale: 권위(ἐξουσία)와 왕권(βασιλεία)의 결합을 함께 살려, 단순한 능력보다 통치 자격과 왕적 권한을 드러내도록 옮겼습니다.
- source_word: ὑποτάσσεσθαι
  english_pob_choice: submit
  chosen_korean: 복종하며
  alternatives_korean:
  - 복종하게 하며
  - 그들에게 순복하며
  lexicon: BDAG
  rationale: 수동적 순응보다 자발적 복종의 뉘앙스를 살리되, 한국어 문맥에서는 자연스럽고 문어적인 동사형으로 정리했습니다.
- source_word: ἀπροσκόπως
  english_pob_choice: without stumbling
  chosen_korean: 걸려 넘어짐 없이
  alternatives_korean:
  - 거침없이
  - 장애 없이
  lexicon: BDAG
  rationale: 정치적 통치 맥락에서 직역에 가까운 '걸려 넘어짐'이 가장 잘 맞아, 단순한 매끄러움보다 행정의 무난함과 도덕적 함의를 함께 보존했습니다.
- source_word: εἰς τὸ διέπειν
  english_pob_choice: so that they may administer
  chosen_korean: 다스리게 하소서
  alternatives_korean:
  - 통치하게 하소서
  - 행정하게 하소서
  lexicon: BDAG
  rationale: διέπειν은 통치권의 실행을 뜻하므로, 회중 기도문에 어울리면서도 고전적 어감을 유지하는 '다스리다'를 택했습니다.
- source_word: προστάτου τῶν ψυχῶν ἡμῶν
  english_pob_choice: protector of our souls
  chosen_korean: 보호자이신
  alternatives_korean:
  - 수호자이신
  - 지키시는 이
  lexicon: LSJ
  rationale: προστάτης의 보호·보좌 기능을 한국어에서 가장 직접적으로 전달하는 말로 '보호자'를 사용했습니다.
- source_word: Ἰησοῦ Χριστοῦ
  english_pob_choice: Jesus Messiah
  chosen_korean: 예수 메시아
  alternatives_korean:
  - 예수 그리스도
  lexicon: DOCTRINE.md
  rationale: Χριστός를 이름이 아닌 칭호로 보고, 이 번역 본문 원칙에 따라 '메시아'로 옮겼습니다.
theological_decisions:
- issue: 호칭 δέσποτα와 κύριε의 구별
  chosen_reading: 주권자님 / 주님으로 구별
  alternative_readings:
  - 둘 다 주님
  - 둘 다 주권자님
  rationale: 본문은 같은 기도 안에서 두 호칭을 반복하지만 동일어로 평면화하지 않습니다. 첫 호칭은 절대 통치자 뉘앙스, 뒤의 호칭은 일반적 주호칭으로 구별해 원문의 수사적 대비를 살렸습니다.
  doctrine_reference: POB naming and title-distinction policy
- issue: Χριστός의 번역
  chosen_reading: 예수 메시아
  alternative_readings:
  - 예수 그리스도
  rationale: 이 단락의 Ἰησοῦ Χριστοῦ는 고정 이름보다 칭호적 고백으로 기능하므로, 번역에서 의미를 투명하게 드러내는 '메시아'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
