id: 1CLEM.57.4
reference: 1 Clement 57:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐπειδὴ ἐκάλουν καὶ οὐχ ὑπηκούσατε, καὶ ἐξέτεινον λόγους καὶ οὐ προσεἴχετε, ἀλλὰ ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς, τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε· τοιγαροῦν κἀγὼ τῇ ὑμετέρᾳ ἀπωλείᾳ ἐπιγελάσομαι, καταχαροῦμαι δέ, ἥνικα ἂν ἔρχηται ὑμῖν ὄλεθρος καὶ ὡς ἂν ἀφίκηται ὑμῖν ἄφνω θόρυβος, ἡ δὲ καταστροφή ὁμοία καταιγὶδι παρῇ, ἢ ὅταν ἔρχηται ὑμῖν θλῖψις καὶ πολιορκία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/004.yaml
  text: Because I called and you did not listen, and I stretched out words and you paid no attention, but made my counsels void, and disobeyed my reproofs, therefore I also will laugh at your ruin; I will rejoice when destruction comes upon you, and when sudden turmoil reaches you, and your overthrow comes like a storm, or when affliction and siege come upon you.
translation:
  language: ko
  text: 내가 불렀으나 너희는 듣지 않았고, 내가 말을 내놓았으나 너희는 주의를 기울이지 않았으며, 오히려 내 권고들을 헛되게 하고 내 책망을 따르지 않았습니다. 그러므로 나도 너희의 파멸을 보고 웃을 것이며, 너희에게 멸망이 닥칠 때, 갑작스러운 소란이 너희에게 이를 때, 너희의 파국이 폭풍처럼 닥칠 때, 또는 환난과 포위 공격이 너희에게 닥칠 때 기뻐할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλουν
  english_pob_choice: I called
  chosen_korean: 내가 불렀으나
  alternatives_korean:
  - 내가 부르니
  - 내가 부르고 있었으나
  lexicon: καλέω
  rationale: 호소하거나 부르는 행위를 자연스럽게 살리되, 앞의 불응과 대비되도록 과거 서술형으로 옮겼습니다.
- source_word: ἐξέτεινον λόγους
  english_pob_choice: I stretched out words
  chosen_korean: 내가 말을 길게 펴 보였으나
  alternatives_korean:
  - 내가 말을 펼쳤으나
  - 내가 말들을 내밀었으나
  lexicon: ἐκτείνω + λόγος
  rationale: 직역만 하면 부자연스러워서, 원문의 ‘펼쳐 내밀다’는 이미지와 호소의 장황함을 함께 드러내는 표현을 택했습니다.
- source_word: ἀκύρους ἐποιεῖτε τὰς ἐμὰς βουλάς
  english_pob_choice: made my counsels void
  chosen_korean: 내 계획들을 헛되게 만들고
  alternatives_korean:
  - 내 뜻을 무효로 만들고
  - 내 조언들을 무효로 만들고
  lexicon: βούλη
  rationale: βουλαί는 단순한 조언보다 의도·계획의 결정을 가리킬 수 있어, 문맥상 ‘내 계획들’을 택했습니다.
- source_word: τοῖς δὲ ἐμοῖς ἐλέγχοις ἠπειθήσατε
  english_pob_choice: disobeyed my reproofs
  chosen_korean: 내 책망들을 거역하였습니다
  alternatives_korean:
  - 내 책망에 복종하지 않았습니다
  - 내 질책을 따르지 않았습니다
  lexicon: ἐλέγχος
  rationale: ἐλέγχος의 책망·꾸짖음의 강한 뉘앙스를 살리면서, ἠπειθήσατε의 불순종을 ‘거역하다’로 분명히 드러냈습니다.
- source_word: ὑμῶν ἀπωλείᾳ / ὄλεθρος / θόρυβος / καταστροφή / θλῖψις / πολιορκία
  english_pob_choice: your ruin ... destruction ... sudden turmoil ... overthrow ... affliction and siege
  chosen_korean: 너희의 파멸 ... 멸망 ... 갑작스러운 소란 ... 전복 ... 환난과 포위
  alternatives_korean:
  - 너희의 멸망 ... 파괴 ... 갑작스러운 혼란 ... 붕괴 ... 고난과 포위
  lexicon: ἀπώλεια, ὄλεθρος, θόρυβος, καταστροφή, θλῖψις, πολιορκία
  rationale: 연속되는 재앙 어휘의 중복을 유지해 수사적 압박을 살렸고, πολιορκία는 전쟁/포위 상황을 분명히 하는 ‘포위’로 옮겼습니다.
theological_decisions:
- issue: 지혜문학적 경고에서 하나님의 직접 발화가 어떤 어조로 재현되는지
  chosen_reading: 심판 선언의 직설성과 반복적 대비를 유지하되, 현대 한국어에서 공적 경고처럼 읽히도록 합쇼체로 정리했습니다.
  alternative_readings:
  - 더 격한 분노의 어조로 과장할 수 있음
  - 더 완곡한 권면으로 낮출 수 있음
  rationale: 원문은 단순한 훈계가 아니라 응답하지 않는 자들에 대한 심판적 역설을 드러내므로, 경고의 날카로움을 보존해야 합니다.
  doctrine_reference: 지혜문학/예언적 심판 경고의 수사
