- from: 내가 불렀으나 너희는 듣지 않았고, 내가 말을 길게 펴 보였으나 너희는 주의를 기울이지 않았으며, 오히려 내 계획들을 헛되게 만들고 내 책망들을 거역하였습니다. 그러므로 나도 너희의 파멸을 보고 비웃을 것이며, 너희에게 멸망이 닥치고 갑작스러운 소란이 너희에게 이르며, 너희의 전복이 폭풍처럼 찾아오고, 환난과 포위가 너희에게 닥칠 때 기뻐할 것입니다.
