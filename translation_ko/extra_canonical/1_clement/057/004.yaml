review_pass:
  verdict: revise
  source_fidelity: 원문의 병렬 구조와 심판 경고의 수사, 그리고 재앙 어휘의 연쇄는 대체로 잘 반영되었습니다. 다만 βουλάς는 여기서 ‘계획’보다 상대가 받아들여야 할 ‘권고/권면’에 가깝고, πολιορκία는 일반적 ‘포위’가 아니라 ‘포위 공격, 공성’이라는 군사적 재난을 뜻합니다. ἐξέτεινον λόγους는 직역적이고 다소 특이한 표현이므로 한국어에서는 ‘말을 내놓다’로 자연스럽게 옮기되, 원문의 제시·호소의 동작성을 유지하는 편이 안전합니다.
  naturalness: 초안은 합쇼체와 문장 흐름이 전반적으로 적절합니다. 그러나 ‘말을 길게 펴 보였으나’는 현대 한국어에서 부자연스럽고, ‘전복’은 사람이나 정권의 전복을 더 쉽게 연상시켜 재난으로서의 καταστροφή에는 ‘파국’이 자연스럽습니다. 반복되는 시간절은 ‘…때’로 정돈하여 원문의 점층적 나열을 살렸습니다.
  terminology: ‘권고’, ‘책망’, ‘파멸’, ‘멸망’, ‘소란’, ‘파국’, ‘환난’, ‘포위 공격’은 각각 βουλάς, ἐλέγχοις, ἀπωλείᾳ, ὄλεθρος, θόρυβος, καταστροφή, θλῖψις, πολιορκία를 문맥상 구별해 반영합니다. ‘웃다’와 ‘기뻐하다’의 불편하고 강한 심판 수사는 완화하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘내 계획들을 헛되게 만들고’
    rationale: βουλάς는 이 문맥에서 화자가 제시한 권고·권면을 가리키며, 화자 자신의 실행 계획이 좌절된다는 뜻으로 읽히는 ‘계획’은 부정확할 수 있습니다.
  - severity: medium
    issue: ‘환난과 포위’
    rationale: πολιορκία는 단순한 공간적 포위가 아니라 성읍 등을 대상으로 하는 포위 공격/공성입니다.
  - severity: low
    issue: ‘내가 말을 길게 펴 보였으나’ 및 ‘전복’
    rationale: 전자 표현은 현대어로 어색하며 ‘길게’는 원문에 없는 장황함을 더합니다. 후자는 καταστροφή의 재난적 붕괴·파국보다 정치적 전복을 연상시키기 쉽습니다.
  revised_text: 내가 불렀으나 너희는 듣지 않았고, 내가 말을 내놓았으나 너희는 주의를 기울이지 않았으며, 오히려 내 권고들을 헛되게 하고 내 책망을 따르지 않았습니다. 그러므로 나도 너희의 파멸을 보고 웃을 것이며, 너희에게 멸망이 닥칠 때, 갑작스러운 소란이 너희에게 이를 때, 너희의 파국이 폭풍처럼 닥칠 때, 또는 환난과 포위 공격이 너희에게 닥칠 때 기뻐할 것입니다.
