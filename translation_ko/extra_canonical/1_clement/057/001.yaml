id: 1CLEM.57.1
reference: 1 Clement 57:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὑμεῖς οὖν οἱ τὴν καταβολὴν τῆς στάσεως ποιήσαντες ὑποτάγητε τοῖς πρεσβυτέροις καὶ παιδεύθητε εἰς μετάνοιαν, κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/001.yaml
  text: Therefore, you who laid the foundation of the rebellion, submit yourselves to the elders and be disciplined unto repentance, bending the knees of your heart.
  footnotes:
  - marker: a
    text: Or 'uprising'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 너희, 곧 이 분쟁의 기초를 놓은 자들은 장로들에게 복종하고, 회개에 이르도록 징계를 받으십시오. 그리고 마음의 무릎을 꺾으십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν καταβολὴν τῆς στάσεως
  english_pob_choice: laid the foundation of the rebellion
  chosen_korean: 이 분쟁의 기초를 놓은 자들
  alternatives_korean:
  - 이 반란의 기초를 놓은 자들
  - 이 소요의 기초를 놓은 자들
  - 반역의 원인을 만든 자들
  lexicon: καταβολή, στάσις
  rationale: καταβολὴν τῆς στάσεως는 단순한 ‘일어섬’이 아니라 질서를 무너뜨리는 분쟁/반란의 ‘기초를 놓음’을 가리키므로, 문맥의 부정성을 살려 ‘분쟁의 기초를 놓은 자들’로 옮겼습니다.
- source_word: ὑποτάγητε
  english_pob_choice: submit yourselves
  chosen_korean: 복종하고
  alternatives_korean:
  - 복종하십시오
  - 자신을 복종시키십시오
  - 복종하시오
  lexicon: ὑποτάσσω
  rationale: 공동체 내부의 권위 질서에 자신을 두라는 뜻을 살려, 합쇼체 명령으로 간결하게 ‘복종하고’로 옮겼습니다.
- source_word: τοῖς πρεσβυτέροις
  english_pob_choice: the elders
  chosen_korean: 장로들에게
  alternatives_korean:
  - 원로들에게
  - 노인들에게
  - 감독들에게
  lexicon: πρεσβύτερος
  rationale: 교회 직분으로서의 ‘elder’에 해당하므로, 과도한 전통어인 ‘원로’보다 기능이 분명한 ‘장로’가 적절합니다.
- source_word: παιδεύθητε εἰς μετάνοιαν
  english_pob_choice: be disciplined unto repentance
  chosen_korean: 회개에 이르도록 징계를 받으십시오
  alternatives_korean:
  - 회개에 이르도록 훈련을 받으십시오
  - 회개를 위해 교정받으십시오
  - 회개하도록 교육받으십시오
  lexicon: παιδεύω, μετάνοια
  rationale: παιδεύθητε는 단순 교육보다 교정·훈육의 뉘앙스가 강하므로 ‘징계’로 살리고, εἰς μετάνοιαν은 그 목적을 분명히 하여 ‘회개에 이르도록’으로 옮겼습니다.
- source_word: κάμψαντες τὰ γόνατα τῆς καρδίας ὑμῶν
  english_pob_choice: bending the knees of your heart
  chosen_korean: 마음의 무릎을 꺾으십시오
  alternatives_korean:
  - 마음의 무릎을 굽히십시오
  - 마음의 무릎을 꿇으십시오
  - 마음의 무릎을 낮추십시오
  lexicon: κάμπτω, γόνυ, καρδία
  rationale: 비유적 표현을 그대로 살리되 한국어에서 자연스러운 강한 종속·겸손의 이미지를 위해 ‘꺾다’를 택했습니다.
theological_decisions:
- issue: στάσις의 의미 범위
  chosen_reading: ‘분쟁’으로 옮기되, 문맥상 반란·항거의 함의를 유지했습니다.
  alternative_readings:
  - 반란
  - 소요
  - 분열
  rationale: 영어 POB가 최신 수정에서 rebellion으로 조정한 것은 στάσις의 부정적 정치·윤리적 힘을 살리기 위한 것이므로, 한국어에서도 중립적인 ‘소요’보다 질서 파괴의 성격이 드러나는 표현을 택했습니다.
  doctrine_reference: 공동체 질서와 교회 권위에 대한 1 Clement의 권면 문맥
- issue: ‘징계’의 수위
  chosen_reading: ‘징계’는 형벌보다 교정적 훈육의 의미로 사용했습니다.
  alternative_readings:
  - 벌을 받으십시오
  - 훈련을 받으십시오
  - 교정받으십시오
  rationale: παιδεύθητε는 회개로 이끄는 교정적 훈육을 뜻하므로, 한국어 ‘징계’가 문맥의 엄중함과 목적성을 함께 담아냅니다.
  doctrine_reference: 회개와 교회의 권면/훈육
