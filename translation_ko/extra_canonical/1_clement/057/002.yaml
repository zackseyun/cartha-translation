revisions:
- from: 순종하는 법을 배우십시오. 그리고 여러분의 혀의 오만하고 교만한 제멋대로를 버리십시오. 여러분에게 더 나은 것은, 그리스도의 양 떼 안에서 작고도 인정받는 사람들로 발견되는 것이지, 우쭐해 보이다가 그의 소망에서 내쫓기는 것이 아닙니다.[a][b]
  to: 복종하는 법을 배우십시오. 여러분의 혀에서 나오는 허세스럽고 교만한 고집을 버리십시오. 그리스도의 양 떼 안에서 작고 인정받는 이들로 여겨지는 것이, 남보다 뛰어난 듯이 보이다가 그분의 소망에서 쫓겨나는 것보다 여러분에게 더 낫습니다.
  rationale: The revision corrects the awkward expression for αὐθάδεια, more closely represents the comparative antithesis, and renders δοκοῦντας καθ' ὑπεροχὴν as apparent superiority. ‘작고 인정받는 이들’ preserves the compact, somewhat tension-filled pairing μικρούς καὶ ἐλλογίμους without deciding whether ἐλλογίμους emphasizes being accounted within the flock or being esteemed. Unsupported inherited anchors are omitted.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Greek, but ‘우쭐해 보이다가’ weakens καθ' ὑπεροχὴν δοκοῦντας (‘seeming superior/preeminent’), and the rendering of the tongue’s αὐθάδεια is not idiomatic Korean. ‘인정받는’ is a defensible deliberately broad rendering of ἐλλογίμους, which can denote being accounted/recognized and need not be narrowed to either social esteem or mere membership.
  naturalness: The sentence ‘여러분의 혀의 오만하고 교만한 제멋대로’ is grammatically and stylistically awkward. The revision uses natural formal-polite Korean while retaining the image of the tongue. The parallel contrast is also made clearer.
  terminology: ‘그리스도,’ ‘양 떼,’ and ‘소망’ are appropriate. ‘복종하는 법을 배우십시오’ more directly represents ὑποτάσσεσθαι than the somewhat softer ‘순종하는 법을 배우십시오,’ without importing a particular institutional interpretation.
  issues:
  - severity: medium
    issue: The phrase for the tongue’s self-will is unnatural Korean.
    rationale: ἀλαζόνα καὶ ὑπερήφανον ... αὐθάδειαν describes a boastful and proud self-willed/arrogant disposition associated with their tongue. ‘혀의 오만하고 교만한 제멋대로’ does not form a natural noun phrase.
  - severity: medium
    issue: ‘우쭐해 보이다가’ does not adequately render apparent superiority.
    rationale: καθ' ὑπεροχὴν δοκοῦντας refers to seeming to be in a superior or preeminent position, not merely looking self-satisfied or puffed up.
  - severity: low
    issue: The attached [a][b] anchors have no corresponding Korean footnotes and do not mark the relevant words.
    rationale: The supplied English audit footnotes are legacy rendering notes and do not establish a Korean textual note. Removing the unsupported anchors resolves the incomplete footnote presentation without altering meaning.
  revised_text: 복종하는 법을 배우십시오. 여러분의 혀에서 나오는 허세스럽고 교만한 고집을 버리십시오. 그리스도의 양 떼 안에서 작고 인정받는 이들로 여겨지는 것이, 남보다 뛰어난 듯이 보이다가 그분의 소망에서 쫓겨나는 것보다 여러분에게 더 낫습니다.
