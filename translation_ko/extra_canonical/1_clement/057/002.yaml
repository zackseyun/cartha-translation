  text: μάθετε ὑποτάσσεσθαι, ἀποθέμενοι τὴν ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν· ἄμεινον γάρ ἐστιν ὑμῖν, ἐν τῷ ποιμνίῳ τοῦ Χριστοῦ μικροὺς καὶ ἐλλογίμους εὑρεθῆναι, ἢ καθ' ὑπεροχὴν δοκοῦντας ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/002.yaml
  text: Learn to submit[a], putting away the arrogant and proud self-will of your tongue. For it is better for you to be found small and esteemed within the flock of Christ than, while seeming preeminent[b], to be cast out from his hope.
  footnotes:
  - marker: a
    text: Or 'esteemed'.
    reason: previous_rendering
  - marker: b
    text: Or 'the Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 복종하는 법을 배우십시오. 여러분의 혀에서 나오는 허세스럽고 교만한 고집을 버리십시오. 그리스도의 양 떼 안에서 작고 인정받는 이들로 여겨지는 것이, 남보다 뛰어난 듯이 보이다가 그분의 소망에서 쫓겨나는 것보다 여러분에게 더 낫습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάθετε ὑποτάσσεσθαι
  english_pob_choice: Learn to submit
  chosen_korean: 순종하는 법을 배우십시오
  alternatives_korean:
  - 복종하는 법을 배우십시오
  - 순종하십시오
  lexicon: ὑποτάσσομαι
  rationale: 단순 명령형보다 ‘배우다’를 살려 훈련·형성의 뉘앙스를 유지했고, 한국어에서는 관계적이고 자발적 태도를 살려 ‘순종’이 가장 자연스럽습니다.
- source_word: ἀλαζόνα καὶ ὑπερήφανον τῆς γλώσσης ὑμῶν αὐθάδειαν
  english_pob_choice: the arrogant and proud self-will of your tongue
  chosen_korean: 여러분의 혀의 오만하고 교만한 제멋대로
  alternatives_korean:
  - 혀의 오만하고 교만한 독선
  - 혀의 뽐냄과 교만한 고집
  lexicon: ἀλαζονεία / ὑπερήφανος / αὐθάδεια
  rationale: 직역하면 ‘혀의 제멋대로 함’에 가까운 표현으로, 말의 자의적·고집스런 태도를 드러내기 위해 ‘제멋대로’로 옮겼습니다.
- source_word: ἐλλογίμους
  english_pob_choice: esteemed / included
  chosen_korean: 인정받는
  alternatives_korean:
  - 계산된
  - 여겨진
  - 유명한
  lexicon: ἐλλόγιμος
  rationale: 이 단어는 ‘존중받다’보다 ‘안에 포함되어 하나로 간주되다’의 의미가 강하므로, 앞의 ‘작고’와 대비되는 공동체적 소속을 살려 ‘인정받는’으로 옮겼습니다.
- source_word: ἐκβληθῆναι ἐκ τῆς ἐλπίδος αὐτοῦ
  english_pob_choice: to be cast out from his hope
  chosen_korean: 그의 소망에서 내쫓기는 것
  alternatives_korean:
  - 그의 소망 밖으로 쫓겨나는 것
  - 그의 소망으로부터 버려지는 것
  lexicon: ἐκβάλλω / ἐλπίς
  rationale: ‘cast out’의 강한 배제 이미지를 살리되, ‘hope’의 주어가 그리스도/그의 소망인지 모호성을 그대로 유지했습니다.
- source_word: τοῦ Χριστοῦ
  english_pob_choice: Christ
  chosen_korean: 그리스도의
  alternatives_korean:
  - 메시아의
  lexicon: Χριστός
  rationale: 이 문맥에서는 고정된 기독교 호칭/이름으로 기능하므로, 후기 서간체에 맞게 ‘메시아’보다 ‘그리스도’가 적절합니다.
theological_decisions:
- issue: ‘순종’의 성격
  chosen_reading: 자발적이고 훈련된 교회적 순종으로 읽었습니다.
  alternative_readings:
  - 강제적 복종
  - 위계적 굴복
  rationale: 본문은 혀의 교만과 대비되는 공동체적 덕목을 권면하므로, 폭압적 복종이 아니라 배워야 하는 태도로 이해하는 것이 문맥에 맞습니다.
  doctrine_reference: 교회 권면과 성화의 훈련이라는 1 Clement의 목회적 수사
