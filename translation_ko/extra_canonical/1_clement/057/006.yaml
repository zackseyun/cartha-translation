  yaml_path: translation/extra_canonical/1_clement/057/006.yaml
  text: Therefore they will eat the fruits of their own way and be filled with their own ungodliness.
translation:
  language: ko
  text: 그러므로 그들은 자기 길의 열매를 먹게 되고, 자기 불경건함으로 가득 차게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοιγαροῦν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에 따라서
  - 그런즉
  lexicon: τοιγαροῦν
  rationale: 앞선 판단을 이어 결론을 내리는 접속부사로, 한국어에서는 간결한 결론 연결어인 ‘그러므로’가 가장 자연스럽습니다.
- source_word: ἔδονται τῆς ἑαυτῶν ὁδοῦ τοὺς καρποὺς
  english_pob_choice: they will eat the fruits of their own way
  chosen_korean: 자기 길의 열매를 먹게 되고
  alternatives_korean:
  - 자기 행로의 열매를 먹게 되고
  - 자기 길의 결실을 먹게 되고
  lexicon: ἔδονται / ὁδός / καρπός
  rationale: ‘길’은 삶의 행로와 방식 전체를 가리키므로 직역성을 유지했고, ‘열매를 먹다’는 원문의 비유를 살려 결과를 스스로 감당한다는 뜻을 드러냈습니다.
- source_word: τῆς ἑαυτῶν ἀσεβείας πλησθήσονται
  english_pob_choice: be filled with their own ungodliness
  chosen_korean: 자기 불경건함으로 가득 차게 될 것입니다
  alternatives_korean:
  - 자기 경건치 않음으로 가득 차게 될 것입니다
  - 자기 경외 없음으로 채워질 것입니다
  lexicon: ἀσέβεια
  rationale: ἀσέβεια는 단순한 도덕적 결함보다 하나님에 대한 경외와 경배의 결여를 가리키므로, 교회 전통어를 무리하게 완곡화하지 않고 ‘불경건함’으로 옮겼습니다.
