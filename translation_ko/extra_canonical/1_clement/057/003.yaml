  to: 그러므로 온갖 덕을 갖춘 지혜가 이렇게 말합니다. “보라[a], 내가 내 숨결에서 나온 말을 너희에게 쏟아 내고, 내 말을 너희에게 가르치겠습니다.”
  rationale: πανάρετος의 수식을 복원하고, ‘내 숨의 한 말씀’을 자연스러운 현대 한국어인 ‘내 숨결에서 나온 말’로 고쳤습니다. 이는 πνοή의 생기 있는 이미지와 ῥῆσις의 발화성을 보존하며, 뒤의 λόγος ‘내 말’과의 병렬도 유지합니다. 지혜를 의인화된 화자로 제시하는 원문의 표현과 합쇼체 문체를 그대로 따랐습니다.
