id: 1CLEM.57.3
reference: 1 Clement 57:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτω γὰρ λέγει ἡ πανάρετος σοφία· Ἰδοὺ, προΐομαι ὑμῖν ἐμῆς πνοῆς ῥῆσιν, διδάξω δὲ ὑμᾶς τὸν ἐμὸν λόγον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/003.yaml
  text: 'For thus says all-virtuous Wisdom: “Behold[a], I will pour out to you a saying from my breath, and I will teach you my word.”'
  footnotes:
  - marker: a
    text: Or 'a word from my breath, and I will teach you my message'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 온갖 덕을 갖춘 지혜가 이렇게 말합니다. “보라[a], 내가 내 숨결에서 나온 말을 너희에게 쏟아 내고, 내 말을 너희에게 가르치겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “내 숨의 발화를 너희에게 쏟아 내고, 내 말을 너희에게 가르치겠다”입니다.
    reason: 영어 POB의 기존 각주 표지를 보존하면서, ῥῆσις(발화, 말)와 λόγος(말)의 어휘적 병렬을 한국어 독자에게 명시합니다.
lexical_decisions:
- source_word: ὁ πανάρετος σοφία
  english_pob_choice: all-virtuous Wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 전덕한 지혜
  - 온갖 덕을 갖춘 지혜
  lexicon: σοφία
  rationale: 의인화된 지혜를 자연스럽게 살리기 위해 인명화된 호칭보다 단순한 ‘지혜’로 두었고, ‘pανάρετος’의 칭찬적 수식은 본문 흐름상 문장 전체의 품격으로 반영했습니다.
- source_word: προΐομαι
  english_pob_choice: I will pour out
  chosen_korean: 쏟아 내고
  alternatives_korean:
  - 내보내고
  - 쏟아 붓고
  lexicon: προΐημι/προΐομαι
  rationale: 흐름과 발화를 함께 살리는 동사로, 단순한 전달보다 풍성하게 흘러나오는 이미지를 유지하려고 ‘쏟아 내다’를 택했습니다.
- source_word: ῥῆσιν
  english_pob_choice: a saying
  chosen_korean: 한 말씀
  alternatives_korean:
  - 한 말
  - 한 말씀이신 말
  lexicon: ῥῆσις
  rationale: ῥῆσις의 ‘말해진 말/발화’ 성격을 살리되 한국어에서는 어색하지 않게 ‘한 말씀’으로 옮겼습니다.
- source_word: πνοῆς
  english_pob_choice: breath
  chosen_korean: 숨
  alternatives_korean:
  - 호흡
  - 숨결
  lexicon: πνοή
  rationale: 원문의 생기와 발화의 근원을 함께 드러내는 가장 직접적인 한국어로 ‘숨’을 택했습니다.
- source_word: λόγον
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 메시지
  lexicon: λόγος
  rationale: 지혜의 권면 맥락에서 λόγος는 단순 정보보다 권위 있는 발화를 뜻하므로, 지나치게 교회화된 ‘말씀’ 대신 원문 긴장을 덜 훼손하는 ‘말’을 기본으로 했습니다.
theological_decisions:
- issue: 지혜의 의인화된 화자 유지
  chosen_reading: 본문을 하나님의 직접 발화가 아니라 의인화된 지혜의 말로 옮겼습니다.
  alternative_readings:
  - 하나님의 지혜가 말합니다
  - 지혜가 선언합니다
  rationale: 원문은 ἡ πανάρετος σοφία가 화자로 등장하므로, 화자의 정체를 과도하게 신학화하지 않고 본문이 말하는 인격화된 지혜의 음성을 그대로 유지했습니다.
  doctrine_reference: 잠언 1:23의 지혜 전승, 1 Clement의 지혜 인용 구조
- issue: ‘내 숨’과 ‘내 말’의 병렬 보존
  chosen_reading: ‘내 숨의 한 말씀’과 ‘내 말’의 병렬을 유지했습니다.
  alternative_readings:
  - 내 호흡에서 나온 한 말
  - 내 영의 한 말
  rationale: πνοή와 λόγος의 병렬은 생명/발화의 근원을 함께 제시하므로, 이를 하나로 평준화하지 않고 서로 다른 이미지가 보이도록 번역했습니다.
  doctrine_reference: 잠언 1:23 인용의 시적 병렬성
