id: 1CLEM.57.7
reference: 1 Clement 57:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀνθ' ὧν γὰρ ἠδίκουν νηπίους φονευθήσονται, καὶ ἐξέτασμος ἀσεβεῖς ὀλεῖ· ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/007.yaml
  text: For because they were wronging the innocent[a], they will be slain, and inquiry will destroy the ungodly; but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil.
  footnotes:
  - marker: a
    text: Or 'the innocent'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 순진한 자들을 해쳤기 때문에 그들은 죽임을 당할 것이며, 불경한 자들은 심문으로 멸망할 것입니다. 그러나 나의 말을 듣는 사람은 소망에 의지하여 거할 것이며, 모든 악에서 두려움 없이 평안히 쉬게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηπίους
  english_pob_choice: the innocent
  chosen_korean: 순진한 자들
  alternatives_korean:
  - 어린아이들
  - 무죄한 자들
  - 순수한 자들
  lexicon: νηπίους
  rationale: 지혜문학 인용문에서 νηπίους는 도덕적 무결성보다 분별이 덜한 ‘순진한/미숙한 사람들’의 범주를 가리키므로, 문맥을 살려 ‘순진한 자들’로 옮겼습니다.
- source_word: ἠδίκουν
  english_pob_choice: they were wronging
  chosen_korean: 해쳤기 때문에
  alternatives_korean:
  - 불의하게 대했기 때문에
  - 잘못하고 있었기 때문에
  - 괴롭혔기 때문에
  lexicon: ἀδικέω
  rationale: 현재 진행의 악행을 한국어로 자연스럽게 드러내기 위해 ‘해쳤기 때문에’로 옮겼고, 단순한 법적 ‘불의’보다 피해를 주는 행위를 분명히 했습니다.
- source_word: ἐξέτασμος
  english_pob_choice: inquiry
  chosen_korean: 심문
  alternatives_korean:
  - 조사
  - 심사
  - 문책
  lexicon: ἐξέτασμος
  rationale: ‘inquiry’의 조사 행위를 살리되, 악인에게 임하는 엄정한 심판의 뉘앙스를 반영하여 ‘심문’으로 옮겼습니다.
- source_word: ὁ δὲ ἐμοῦ ἀκούων κατασκηνώσει ἐπ' ἐλπίδι πεποιθὼς καὶ ἡσυχάσει ἀφόβως ἀπὸ παντὸς κακοῦ
  english_pob_choice: but the one who hears me will dwell, trusting in hope, and will be at rest without fear from every evil
  chosen_korean: 그러나 나의 말을 듣는 사람은 소망에 의지하여 거할 것이며, 모든 악에서 두려움 없이 평안히 쉬게 될 것입니다.
  alternatives_korean:
  - 그러나 나를 듣는 자는 소망을 믿고 거주하며 두려움 없이 모든 악에서 평안할 것입니다.
  - 그러나 내 말을 듣는 사람은 소망을 신뢰하며 살 것이고, 어떤 악도 두려워하지 않을 것입니다.
  lexicon: ἀκούω / κατασκηνόω / πεποιθώς / ἡσυχάζω
  rationale: ‘듣다-거하다-의지하다-쉬다’의 연속을 유지하면서, 현대 한국어에서 가장 자연스럽고 예배문체에 치우치지 않는 표현으로 다듬었습니다.
theological_decisions:
- issue: 지혜문학 인용에서 νηπίους의 의미 범위
  chosen_reading: 도덕적으로 무죄한 사람보다 분별이 덜한 ‘순진한 자들’로 읽었습니다.
  alternative_readings:
  - 무죄한 자들
  - 어린아이들
  rationale: 인용의 배경상 핵심은 ‘죄 없는 상태’가 아니라 보호받아야 할 미숙함/순진함에 대한 폭력입니다. 그래서 본문 경고의 힘이 흐려지지 않도록 의미 범위를 보존했습니다.
  doctrine_reference: 지혜문학의 어휘와 수사, 그리고 본문-인용문 맥락
