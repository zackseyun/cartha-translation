revisions:
- from: 그러므로 너희가 나를 부를 때에는 내가 너희의 말을 듣지 않을 것이며, 악인들은 나를 찾겠지만 나를 찾지 못할 것입니다. 그들은 지혜를 미워하고 주에 대한 두려움을 택하지 않았으며, 내 권고를 들으려 하지 않았고, 내 책망을 비웃었습니다.[a]
  to: 이는 너희가 나를 부를 때에 내가 너희의 말을 듣지 않을 것이며, 악한 자들은 나를 찾아도 찾지 못할 것이기 때문입니다. 그들은 지혜를 미워하고 주를 두려워하기를 택하지 않았으며, 내 권고에 귀를 기울이려 하지 않고 내 책망을 비웃었습니다.
  rationale: γάρ의 근거 제시 기능을 ‘이는 … 때문입니다’로 바로잡았습니다. ‘주를 두려워하기’는 ‘주에 대한 두려움’의 뜻을 유지하면서 한국어에서 더 자연스럽게 표현합니다. προσέχειν의 주의·경청 의미를 ‘권고에 귀를 기울이다’로 반영했으며, 대응 각주가 없는 [a] 표지는 삭제했습니다.
