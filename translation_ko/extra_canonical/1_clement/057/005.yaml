id: 1CLEM.57.5
reference: 1 Clement 57:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἔσται γάρ, ὅταν ἐπικαλέσησθέ με, ἐγὼ δὲ οὐκ εἰσακούσομαι ὑμῶν· ζητήσουσί με κακοὶ καὶ οὐχ εὑρήσουσιν. ἐμίσησαν γὰρ σοφίαν, τὸν δὲ φόβον τοῦ κυρίου οὐ προείλαντο, οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς· ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/057/005.yaml
  text: For it shall be that when you call upon me, I will not listen to you; evil men will seek me and will not find me. For they hated wisdom, and did not choose the fear of the Lord, nor were they willing to attend to my counsels, but they mocked my reproofs.
translation:
  language: ko
  text: 그러므로 너희가 나를 부를 때에는 내가 너희의 말을 듣지 않을 것이며, 악인들은 나를 찾겠지만 나를 찾지 못할 것입니다. 그들은 지혜를 미워하고 주에 대한 두려움을 택하지 않았으며, 내 권고를 들으려 하지 않았고, 내 책망을 비웃었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσησθέ με
  english_pob_choice: when you call upon me
  chosen_korean: 나를 부를 때에는
  alternatives_korean:
  - 내게 부르짖을 때에는
  - 나를 호소할 때에는
  lexicon: ἐπικαλέομαι
  rationale: 단순한 ‘부르다’보다 예배적·간청적 호출의 뉘앙스를 살리되, 한국어에서는 자연스러운 합쇼체 문맥을 위해 ‘나를 부를 때’로 옮겼습니다.
- source_word: οὐκ εἰσακούσομαι ὑμῶν
  english_pob_choice: I will not listen to you
  chosen_korean: 내가 너희의 말을 듣지 않을 것이며
  alternatives_korean:
  - 너희의 요청을 듣지 않을 것이며
  - 너희를 들어주지 않을 것이며
  lexicon: εἰσακούω
  rationale: ‘듣다/들어주다’ 중에서, 심판 맥락에서의 거절을 드러내면서도 본문의 직설을 유지하기 위해 ‘너희의 말을 듣지 않을 것’으로 잡았습니다.
- source_word: σοφίαν
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 슬기
  - 지혜로움
  lexicon: σοφία
  rationale: 영어 POB와 원문 모두 일반적 덕목으로서의 ‘지혜’를 가리키므로, 표준적이고 직관적인 ‘지혜’를 유지했습니다.
- source_word: τὸν δὲ φόβον τοῦ κυρίου
  english_pob_choice: the fear of the Lord
  chosen_korean: 주에 대한 두려움
  alternatives_korean:
  - 주에 대한 경외
  - 주님을 두려워함
  lexicon: φόβος + κύριος
  rationale: 원문은 ‘주(κύριος)에 대한 두려움’의 직접 구문이며, 본문이 대조하는 것은 ‘지혜를 미움’과 ‘두려움을 택하지 않음’이므로, 지나치게 신앙화한 ‘경외’보다 긴장감을 남기는 ‘두려움’을 택했습니다.
- source_word: ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους
  english_pob_choice: but they mocked my reproofs
  chosen_korean: 내 책망을 비웃었습니다
  alternatives_korean:
  - 내 책망을 조롱했습니다
  - 내 책망을 업신여겼습니다
  lexicon: μυκτηρίζω / ἔλεγχος
  rationale: 동사 μυχτηρίζω는 노골적인 조롱·비웃음을 뜻하고, ἔλεγχος는 책망/책선을 가리키므로, POB의 ‘mocked my reproofs’를 간결하게 살려 ‘비웃었습니다’로 옮겼습니다.
theological_decisions:
- issue: 주(κύριος) 표현의 한국어 처리
  chosen_reading: 여기서는 ‘주’로 유지했습니다.
  alternative_readings:
  - 주님
  - 하나님
  rationale: 이 문맥의 κύριος는 인용문 속 일반 호칭으로 보이며, 본문이 강조하는 것은 ‘주에 대한 두려움’이라는 관계적 태도이므로, 지나친 해석을 덧붙이지 않는 ‘주’가 가장 직접적입니다.
  doctrine_reference: Lexical-theological restraint in source-directed translation
