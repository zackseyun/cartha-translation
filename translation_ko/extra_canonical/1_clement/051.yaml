source:
  edition: Funk 1901 (normalized OCR)
  text: Ὅσα οὖν παρεπέσαμεν καὶ ἐποιήσαμεν διά τινος τῶν τοῦ ἀντικειμένου, ἀξιώσωμεν ἀφεθῆναι ἡμῖν· καὶ ἐκεῖνοι δέ, οἵτινες ἀρχηγοὶ στάσεως καὶ διχοστασίας ἐγενήθησαν, ὀφείλουσιν τὸ κοινὸν ₂₀ τῆς ἐλπίδος σκοπεῖν. 2. οἱ γὰρ μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι ἑαυτοὺς θέλουσιν μᾶλλον αἰκίαις περιπίπτειν ἢ τοὺς πλησίον· μᾶλλον δὲ ἑαυτῶν κατάγνωσιν φέρουσιν ἢ τῆς παραδεδομένης ἡμῖν καλῶς καὶ δικαίως ὁμοφωνίας. 3. καλὸν γὰρ ἀνθρώπῳ ἐξομολογεῖσθαι περὶ τῶν παραπτωμάτων ἢ σκληρῦναι τὴν ₂₅ καρδίαν αὐτοῦ, καθὼς ἐσκληρύνθη ἡ καρδία τῶν στασιασάντων πρὸς τὸν θεράποντα τοῦ θεοῦ Μωϋσῆν, ὧν τὸ κρίμα πρόδηλον ἐγενήθη. 4. κατέβησαν γὰρ εἰς ᾅδου ζῶντες, καὶ θάνατος ποιμανεῖ αὐτούς. 5. Φαραὼ καὶ ἡ στρατιὰ αὐτοῦ καὶ πάντες οἱ ἡγούμενοι Αἰγύπτου, τά τε ἅρματα καὶ οἱ ἀναβάται αὐτῶν οὐ διʼ ἄλλην τινὰ αἰτίαν ἐβυθίσθησαν εἰς θάλασσαν ἐρυθρὰν καὶ ἀπώλοντο, ἀλλὰ διὰ τὸ σκληρυνθῆναι αὐτῶν τὰς ἀσυνέτους καρδίας μετὰ τὸ γενέσθαι τὰ σημεῖα καὶ τὰ τέρατα ἐν γῇ Αἰγύπτου διὰ τοῦ θεράποντος τοῦ θεοῦ Μωϋσέως.
  language: Greek
  pages:
  - 325
  - 327
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/051.yaml
  text: 'Therefore[v3], whatever things we have done wrong and committed through any schemes of the adversary, let us ask that they be forgiven us. And those who became leaders of revolt and division ought to consider the common good of our hope. For those who live as citizens with fear and love desire rather to fall into mistreatment themselves than upon their neighbors; indeed, they would rather bear condemnation themselves than that the harmony handed down to us rightly and justly should be condemned. For it is good for a person to confess his transgressions rather than to harden his heart, just as the heart of those who rebelled against Moses, the attendant of God, was hardened—those whose judgment became plain[v4]. For they went down alive into Hades, and death will shepherd them. Pharaoh and his army and all the rulers of Egypt, both their chariots and those who rode on them, were sunk into the Red Sea and perished for no other cause than this: their senseless hearts were hardened
    after the signs and wonders had taken place in the land of Egypt through Moses[b][a][v1], the servant of God.'
  footnotes:
  - marker: v3
    text: Or 'servant of God' for 'attendant of God'; the Greek uses θεράπων, a more distinctive term than the common word for servant/slave.
    reason: lexical_alternative
  - marker: v4
    text: '''Death will shepherd them'' echoes the wording of Psalm 49:14(15 LXX), preserving the scriptural cadence of the citation.'
    reason: cross_reference
  - marker: v1
    text: The phrase rendered 'schemes of the adversary' is somewhat elliptical in Greek and may also be understood more generally as influences or devices belonging to the opposing one.
    reason: alternative_reading
  - marker: a
    text: Or 'bear condemnation of themselves than of the harmony'.
    reason: previous_rendering
  - marker: b
    text: Or 'confess concerning his transgressions'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리가 잘못 행했고 대적자의 어떤 꾀를 통해 저지른 모든 일을, 우리에게서 용서해 주시기를 간구합시다. 그리고 분쟁과 분열의 우두머리가 된 사람들은 우리의 소망에 담긴 공동의 유익을 생각해야 합니다. 두려움과 사랑 가운데서 시민답게 살아가는 사람들은 이웃에게 그런 일을 당하게 하기보다 차라리 자기들이 학대에 빠지기를 더 바라며, 또한 우리에게 잘못하게 하느니 차라리 자신들이 정당한 비난을 받기를 더 원합니다. 참으로 사람에게는 자기의 잘못을 고백하는 것이, 마음을 완강하게 하는 것보다 낫습니다. 그것은 하나님의 종 모세를 거슬러 반역한 사람들의 마음이 완강해진 것과 같습니다. 그들의 판결은 분명하게 드러났습니다. 그들은 살아 있는 채로 하데스로 내려갔고, 죽음이 그들을 목자처럼 다스릴 것입니다. 바로와 그의 군대와 이집트의 모든 통치자들, 곧 그들의 전차와 그 위에 타고 있던 자들은, 이집트 땅에서 하나님의 종 모세를 통해 표징과 놀라운 일들이 일어난 뒤에도 그들의 분별없는 마음이 완강해졌기 때문에, 다른 어떤 이유로도 아니라 홍해 속으로 가라앉아 멸망했습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεπέσαμεν
  english_pob_choice: have done wrong
  chosen_korean: 잘못 행했고
  alternatives_korean:
  - 잘못을 저질렀고
  - 빗나갔고
  lexicon: BDAG
  rationale: 도덕적 과오와 일탈의 의미를 자연스러운 현대 한국어로 옮기면서도, 단순한 실수보다 강한 책임성을 유지합니다.
- source_word: τῶν τοῦ ἀντικειμένου
  english_pob_choice: schemes of the adversary
  chosen_korean: 대적자의 어떤 꾀
  alternatives_korean:
  - 대적자의 계략
  - 반대하는 이의 수단
  lexicon: LSJ
  rationale: 문구가 축약적으로 제시되어 있어, ‘대적자’의 적대적 주체성을 살리되 POB의 여지를 반영해 특정 존재로 과도하게 규정하지 않고 옮겼습니다.
- source_word: ἀρχηγοὶ στάσεως καὶ διχοστασίας
  english_pob_choice: leaders of revolt and division
  chosen_korean: 분쟁과 분열의 우두머리
  alternatives_korean:
  - 반란과 분열의 지도자들
  - 분쟁과 분열을 일으킨 이들
  lexicon: BDAG
  rationale: στάσις와 διχοστασία의 공동체 파괴성을 살리면서, ‘우두머리’로 주도성을 분명히 했습니다.
- source_word: μετὰ φόβου καὶ ἀγάπης πολιτευόμενοι
  english_pob_choice: live as citizens with fear and love
  chosen_korean: 두려움과 사랑 가운데서 시민답게 살아가는
  alternatives_korean:
  - 두려움과 사랑으로 살아가는
  - 두려움과 사랑으로 공동체를 이루는
  lexicon: BDAG
  rationale: πολιτεύομαι의 시민적·공적 삶의 뉘앙스를 살려, 단순한 ‘행동하다’보다 사회적 윤리를 드러내는 표현을 택했습니다.
- source_word: θεράποντα τοῦ θεοῦ
  english_pob_choice: the attendant of God
  chosen_korean: 하나님의 종
  alternatives_korean:
  - 하나님의 시종
  - 하나님의 섬기는 이
  lexicon: LSJ
  rationale: 한국어에서는 ‘종’이 θεράπων의 격조 높은 봉사자 의미를 비교적 자연스럽게 담아, 일반적인 δοῦλος와의 구별을 유지합니다.
- source_word: ᾅδου
  english_pob_choice: Hades
  chosen_korean: 하데스
  alternatives_korean:
  - 음부
  - 저승
  lexicon: BDAG
  rationale: 고유명사적 용법을 보존해, 해석어인 ‘음부’로 평면화하지 않았습니다.
- source_word: θάνατος ποιμανεῖ αὐτούς
  english_pob_choice: death will shepherd them
  chosen_korean: 죽음이 그들을 목자처럼 다스릴 것입니다
  alternatives_korean:
  - 죽음이 그들을 목양할 것입니다
  - 죽음이 그들을 shepherd할 것입니다
  lexicon: LSJ
  rationale: 시편 49:14(70인역)의 인용적 울림을 살리면서, 한국어에서 ‘목자처럼 다스리다’로 은유를 이해 가능하게 옮겼습니다.
- source_word: ἀσυνέτους καρδίας
  english_pob_choice: senseless hearts
  chosen_korean: 분별없는 마음
  alternatives_korean:
  - 어리석은 마음
  - 무지한 마음
  lexicon: BDAG
  rationale: σύνεσις의 결핍을 한국어의 인지·도덕적 무감각으로 자연스럽게 드러내는 표현입니다.
theological_decisions:
- issue: θεράπων의 구별된 호칭을 어떻게 옮길지
  chosen_reading: ‘하나님의 종’으로 번역하되, 모세에게 붙은 공경의 호칭이라는 점을 유지합니다.
  alternative_readings:
  - 하나님의 시종
  - 하나님의 섬기는 이
  rationale: 본문은 모세를 일반적 노예 용어가 아니라 존칭성 있는 봉사자로 부르므로, 교회적 관용어보다 원문의 격조를 유지하는 쪽이 적절합니다.
  doctrine_reference: 역할 호칭의 문맥적 구별 유지
- issue: τὸ κοινὸν τῆς ἐλπίδος의 공동체적 초점
  chosen_reading: ‘우리의 소망에 담긴 공동의 유익’으로, 소망이 낳는 공동선의 촉구로 읽습니다.
  alternative_readings:
  - 소망의 공동선
  - 소망의 공통된 유익
  rationale: 문맥상 분열을 치유하기 위한 권면이므로, 추상적 ‘공동선’보다 공동체가 함께 지켜야 할 유익을 드러내는 표현을 택했습니다.
  doctrine_reference: 공동체 윤리와 소망의 연계
