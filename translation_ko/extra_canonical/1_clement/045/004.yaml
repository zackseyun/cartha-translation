- from: 의인들은 박해를 받았습니다[a]. 그러나 그것은 불법한 자들에게서였습니다. 그들은 감옥에 갇혔으나, 그것은 불경한 자들에게서였습니다. 그들은 율법을 어기는 자들에게 돌로 맞았고, 더럽고 불의한 자들에게서 견딜 수 없는 질투로 죽임을 당했습니다.
  to: 의인들은 박해를 받았습니다[a]. 그러나 그 박해는 무법한 자들이 한 일이었습니다. 그들은 투옥되었으나, 그것은 불경한 자들이 한 일이었습니다. 그들은 범법자들에게 돌로 쳐졌고, 더럽고 불의한 자들의 견딜 수 없는 질투 때문에 죽임을 당했습니다.
