review_pass:
  verdict: revise
  source_fidelity: 그리스어의 반복된 ὑπό(행위자) 구문과 대조적 ἀλλά를 살려야 합니다. 초안은 행위자를 보존하려 했으나, 「그것은 …에게서였습니다」는 한국어에서 부자연스럽고 수동 행위의 가해자 표지로도 정확하지 않습니다. 마지막의 「…질투로」는 ζήλῳ의 원인·수단 관계를 자연스럽게 반영하도록 「…질투 때문에」로 다듬는 것이 좋습니다.
  naturalness: 「박해는 무법한 자들이 한 일이었습니다」처럼 명시하면 합쇼체의 현대 한국어로 자연스럽고, 원문의 가해자 강조도 유지됩니다. 「돌로 맞았습니다」는 자연스럽지만 행위자를 분명히 하여 「돌로 쳐졌습니다」로 옮겼습니다.
  terminology: δίκαιοι는 「의인들」, ἄνομοι는 「무법한 자들」, ἀνόσιοι는 「불경한 자들」, παράνομοι는 「범법자들」, μιαροί καὶ ἄδικοι는 「더럽고 불의한 자들」로 옮기는 것이 적절합니다. 기존 영어 감사 기록의 각주를 한국어에서도 보존하되, διώκω의 대안적 의미는 「쫓겨났습니다」로 제시합니다.
  issues:
  - severity: medium
    issue: 「그러나 그것은 불법한 자들에게서였습니다」 및 「그것은 불경한 자들에게서였습니다」
    rationale: 한국어의 「~에게서였습니다」는 이 문맥에서 가해자 표지로 부자연스럽고, 원문의 반복된 ὑπό 구문이 강조하는 책임 있는 행위자를 흐립니다.
  - severity: low
    issue: 「더럽고 불의한 자들에게서 견딜 수 없는 질투로」
    rationale: 행위자와 원인을 연속한 「~에게서 …로」로 연결하면 관계가 불명료합니다. 「그들의 견딜 수 없는 질투 때문에」로 원인 관계를 명확히 하는 편이 자연스럽습니다.
  - severity: medium
    issue: 본문의 [a]에 대응하는 한국어 각주 부재
    rationale: 본문 앵커가 있는 이상 대응 각주를 제공하여 구조적 완결성과 영어 POB 감사 기록을 유지해야 합니다.
