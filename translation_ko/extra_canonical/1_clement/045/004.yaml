id: 1CLEM.45.4
reference: 1 Clement 45:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐδιώχθησαν δίκαιοι, ἀλλ᾽ ὑπὸ ἀνόμων, ἐφυλακίσθησαν, ἀλλ᾽ ὑπὸ ἀνοσίων· ἐλιθοβόλησαν ὑπὸ παρανόμων· ἀπεκτείνθησαν ὑπὸ τῶν μιαρῶν καὶ ἀδίκων ζήλῳ ἀνεκτρίστῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/004.yaml
  text: The righteous were persecuted[a], but by the lawless; they were imprisoned, but by the unholy; they were stoned by transgressors; they were killed by the vile and unjust through unbearable jealousy.
  footnotes:
  - marker: a
    text: Or 'by the outlawed'.
    reason: previous_rendering
translation:
  language: ko
  text: 의인들은 박해를 받았습니다[a]. 그러나 그 박해는 무법한 자들이 한 일이었습니다. 그들은 투옥되었으나, 그것은 불경한 자들이 한 일이었습니다. 그들은 범법자들에게 돌로 쳐졌고, 더럽고 불의한 자들의 견딜 수 없는 질투 때문에 죽임을 당했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “쫓겨났습니다”.
    reason: 영어 POB의 기존 대안 번역 각주(“Or ‘by the outlawed’”)가 가리키는 διώκω의 대안적 의미 가능성을 한국어로 보존합니다. 본문은 문맥상 일반적인 「박해를 받았습니다」를 유지합니다.
lexical_decisions:
- source_word: δίκαιοι
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의롭던 이들
  lexicon: δίκαιοι
  rationale: 문맥상 하나님 앞에서 의로운 무리들을 가리키므로, 표준적이고 간결한 「의인들」이 가장 직접적입니다.
- source_word: ἀνόμων / παρανόμων
  english_pob_choice: the lawless / transgressors
  chosen_korean: 불법한 자들 / 율법을 어기는 자들
  alternatives_korean:
  - 무법한 자들 / 범법자들
  - 율법 없는 자들 / 불법자들
  lexicon: ἄνομος / παράνομος
  rationale: ἀνόμων은 법과 질서를 거스르는 자들을, παρανόμων은 명시적으로 율법을 어기는 자들을 가리키므로 두 표현을 구분해 옮겼습니다.
- source_word: ἀνοσίων
  english_pob_choice: the unholy
  chosen_korean: 불경한 자들
  alternatives_korean:
  - 경건치 않은 자들
  - 거룩하지 않은 자들
  lexicon: ἄνοσιος
  rationale: ἀνοσίων은 도덕적·종교적으로 거룩하지 않은 상태를 가리키므로, 자연스럽고 직설적인 「불경한 자들」로 옮겼습니다.
- source_word: μιαρῶν καὶ ἀδίκων
  english_pob_choice: the vile and unjust
  chosen_korean: 더럽고 불의한 자들
  alternatives_korean:
  - 추하고 불의한 자들
  - 부정하고 불의한 자들
  lexicon: μιαρός / ἄδικος
  rationale: μιαρῶν은 단순한 악함보다 더럽고 오염된 뉘앙스를 가지므로 「더럽고」로 살리고, ἀδίκων은 표준적으로 「불의한」으로 대응했습니다.
theological_decisions:
- issue: 수동태 연쇄와 행위자 표지(ὑπό)
  chosen_reading: 모든 박해·투옥·돌맞음·살해의 주체를 반복적으로 드러내어, 의인들이 우연히 아니라 특정한 악한 주체들에 의해 억압되었다는 점을 보존했습니다.
  alternative_readings:
  - 행위자를 간단히 묶어 매끄럽게 번역하는 방식
  - 수동 표현을 더 완화해 일반적 고난으로 읽히게 하는 방식
  rationale: 본문은 반복되는 ὑπό 구문으로 가해자를 강조하므로, 한국어에서도 그 구조를 유지하는 것이 수사적 힘과 책임 귀속을 살립니다.
  doctrine_reference: 수난 서술의 책임 귀속과 악행의 주체성
