  text: Φιλόνεικοί ἐστε, ἀδελφοί, καὶ ζηλωταὶ περὶ τῶν ἀνηκόντων εἰς σωτηρίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/001.yaml
  text: You are contentious, brothers, and zealous about the things that pertain to salvation.
translation:
  language: ko
  text: 형제 여러분, 여러분은 다투기를 좋아하고 구원에 속한 일들에 대하여 열심이 많습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φιλόνεικοί
  english_pob_choice: contentious
  chosen_korean: 다투기를 좋아하고
  alternatives_korean:
  - 분쟁을 일으키고
  - 논쟁적이고
  - 다투기 좋아하고
  lexicon: φιλονείκος
  rationale: 형용사적 성격을 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다. 단순히 ‘다투다’보다 반복적 성향을 드러내기 위해 ‘-기를 좋아하고’를 붙였습니다.
- source_word: ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제 여러분
  alternatives_korean:
  - 형제들
  - 형제자매 여러분
  - 형제들이여
  lexicon: ἀδελφοί
  rationale: 직역적 호칭이지만 한국어 합쇼체 문맥에서 공동체에 대한 직접 호소가 살아나도록 ‘여러분’을 덧붙였습니다.
- source_word: ζηλωταὶ
  english_pob_choice: zealous
  chosen_korean: 열심이 많습니다
  alternatives_korean:
  - 열심을 냅니다
  - 열성을 보입니다
  - 열정적입니다
  lexicon: ζηλωτής
  rationale: 명사형 뉘앙스의 ‘열성 있는 사람들’을 한국어 서술로 자연화하되, 단순 감정이 아니라 강한 헌신/열심을 드러내도록 했습니다.
- source_word: τῶν ἀνηκόντων εἰς σωτηρίαν
  english_pob_choice: the things that pertain to salvation
  chosen_korean: 구원에 속한 일들에 대하여
  alternatives_korean:
  - 구원에 이르는 일들에 대하여
  - 구원에 관련된 것들에 대하여
  - 구원에 필요한 것들에 대하여
  lexicon: ἀνήκω + σωτηρία
  rationale: 원문의 ‘속하다/관련되다’의 관계를 보존하면서도, 영어 POB의 ‘pertain to salvation’를 한국어로 투명하게 옮겼습니다.
theological_decisions:
- issue: 문장 전체의 평가적 뉘앙스
  chosen_reading: 이 구절은 칭찬이 아니라 책망에 가까운 진술로 읽고, ‘다투기를 좋아하고’와 ‘열심이 많습니다’를 병치해 공동체의 모순을 드러냈습니다.
  alternative_readings:
  - 중립적 성격 진술
  - 단순한 열정의 언급
  rationale: 문맥상 바울적/교훈적 경고의 어조를 따라, 형용적 특징을 완곡하게 미화하지 않고 그대로 살리는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: 수신 공동체의 도덕적 교정과 권면의 문맥
- issue: σωτηρία의 범위
  chosen_reading: σωτηρία를 여기서는 추상적 ‘구원’으로 유지했습니다.
  alternative_readings:
  - 구원받음
  - 구원에 이르는 상태
  rationale: 문맥이 특정 교리 용어의 재정의보다 공동체가 지향해야 할 구원의 영역을 가리키므로, 표준 신학어 ‘구원’을 유지하는 편이 소스 충실성이 높습니다.
  doctrine_reference: 구원론 일반
