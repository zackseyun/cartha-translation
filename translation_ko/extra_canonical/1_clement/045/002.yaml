translation:
  language: ko
  text: 여러분은 참되고 성령을 통하여 주어진 거룩한 성경을 자세히 살펴보셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεκύψατε
  english_pob_choice: You have looked closely into
  chosen_korean: 깊이 살펴보셨습니다
  alternatives_korean:
  - 자세히 살펴보셨습니다
  - 들여다보셨습니다
  lexicon: ἐγκύπτω
  rationale: 문서나 글을 대상으로 할 때의 비유적 의미인 '주의 깊게 조사하다/살펴보다'를 살려, 물리적 자세를 직접 묘사하는 번역은 피했습니다.
- source_word: τὰς ἱερὰς γραφάς
  english_pob_choice: the holy Scriptures
  chosen_korean: 거룩한 성경
  alternatives_korean:
  - 거룩한 성문서
  - 거룩한 성서
  lexicon: γραφή
  rationale: 문맥상 성경 본문을 가리키므로 자연스러운 현대 한국어로 옮기되, ἱεράς의 '거룩한'을 유지했습니다.
- source_word: τὰς ἀληθεῖς
  english_pob_choice: the true ones
  chosen_korean: 참된 것들
  alternatives_korean:
  - 참된 것
  - 진실한 것들
  lexicon: ἀληθής
  rationale: 영어 POB의 수정처럼 앞의 '성경'을 반복하지 않고, 그 성격을 받는 지시적 표현으로 처리해 그리스어의 간결함을 반영했습니다.
- source_word: διὰ τοῦ πνεύματος τοῦ ἁγίου
  english_pob_choice: through the Holy Spirit
  chosen_korean: 성령을 통해
  alternatives_korean:
  - 성령으로
  - 성령을 거쳐
  lexicon: πνεῦμα ἅγιον
  rationale: 여기서는 하나님의 영을 분명히 가리키므로 '성령'을 사용했고, διὰ + 속격의 매개 수단을 한국어 '을 통해'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘성경’과 ‘참된 것들’의 병치
  chosen_reading: 거룩한 성경, 곧 참된 것들
  alternative_readings:
  - 거룩한 성경, 참된 것들
  - 거룩한 성경, 그 참된 것들
  rationale: 그리스어의 분리된 수식 구조를 살리면서, 본문의 강조점이 '거룩함'과 '참됨' 모두에 있음을 드러내기 위해 설명적 동격으로 처리했습니다.
  doctrine_reference: 성경의 거룩성과 참됨에 대한 고백적 언어
