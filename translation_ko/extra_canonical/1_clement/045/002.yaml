revisions:
- from: 여러분은 거룩한 성경, 곧 참된 것들, 성령을 통해 주어진 것들 속으로 깊이 살펴보셨습니다.[a]
  to: 여러분은 참되고 성령을 통하여 주어진 거룩한 성경을 자세히 살펴보셨습니다.
  rationale: 그리스어의 세 병렬 수식 요소(‘거룩한’, ‘참된’, ‘성령을 통하여 주어진’)가 모두 ‘성경’을 수식함을 한국어에서 명시했습니다. ‘자세히 살펴보셨습니다’는 ἐνεκύψατε의 문헌을 주의 깊게 검토한다는 뜻을 자연스럽게 전달합니다. 영어 감사 기록의 문자적 ‘몸을 굽혀 들여다보다’ 대안은 한국어 본문에 별도 각주로 보존할 필요가 없으므로, 고아 표지와 함께 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:56Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ἐνεκύψατε를 ‘깊이 살펴보셨습니다’로 옮겨 문서를 주의 깊게 살피다는 비유적 용법을 잘 반영합니다. 그러나 ‘참된 것들’과 ‘성령을 통해 주어진 것들’은 그리스어에서 앞선 γραφάς를 받는 형용사적 동격이지만, 한국어에서는 지시 대상이 불분명하고 부자연스럽습니다. ‘참되고 성령을 통하여 주어진 성경’으로 명사를 보충해 의미 관계를 분명히 하는 것이 적절합니다.
  naturalness: ‘성경 ... 것들 ... 것들 속으로 깊이 살펴보셨습니다’는 현대 표준 한국어에서 호응과 수식 관계가 어색합니다. ‘참되고 성령을 통하여 주어진 거룩한 성경을 자세히 살펴보셨습니다’는 합쇼체를 유지하면서도 자연스럽습니다.
  terminology: ‘거룩한 성경’과 ‘성령’은 적절합니다. διὰ + 속격은 ‘성령을 통하여’로 옮겨 매개성을 유지했습니다. ‘참된’은 ἀληθεῖς의 의미를 보존하며, 복수 ‘것들’로 옮기지 않고 집합명사 ‘성경’을 다시 밝혀 한국어의 자연스러운 표현을 확보했습니다.
  issues:
  - severity: medium
    issue: ‘참된 것들, 성령을 통해 주어진 것들’이 한국어에서 성경을 가리키는지 불명확합니다.
    rationale: 그리스어의 여성 복수 형용사는 γραφάς를 받지만, 한국어의 독립된 ‘것들’은 무생물 일반을 가리키는 듯하여 동격 관계와 본문 의미를 흐립니다.
  - severity: medium
    issue: ‘성경 ... 속으로 깊이 살펴보셨습니다’의 결합이 부자연스럽습니다.
    rationale: ‘살펴보다’는 보통 목적어를 직접 취하며 ‘속으로’와 결합하지 않습니다. ἐγκύπτω의 관용적 ‘자세히 살피다’를 직접 목적어 구문으로 옮기는 편이 자연스럽습니다.
  - severity: low
    issue: 본문의 [a] 각주 표지가 한국어 번역에서 기능하지 않습니다.
    rationale: 영어의 이전 번역 관련 대안 표지는 한국어 본문에 그대로 유지할 필요가 없으며, 한국어 각주가 제공되지 않는다면 제거해야 합니다.
