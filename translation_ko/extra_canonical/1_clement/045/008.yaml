source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ δὲ ὑπομένοντες ἐν πεποιθήσει δόξαν καὶ τιμὴν ἐκληρονόμησαν, ἐπήρθησάν τε καὶ ἔγγραφοι ἐγένοντο ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/008.yaml
  text: But those who endured in confidence inherited glory and honor[a], and were exalted, and were enrolled by God in their memorial forever and ever[b]. Amen.
  footnotes:
  - marker: a
    text: Or 'those who endure'.
    reason: previous_rendering
  - marker: b
    text: Or 'became enrolled by God in their memorial'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 믿음 안에서 견딘 자들은 영광과 존귀를 상속받았고, 높여졌으며, 하나님께서 그들의 기념록에 영원무궁토록 기록하셨습니다. 아멘.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομένοντες ἐν πεποιθήσει
  english_pob_choice: those who endured in confidence
  chosen_korean: 믿음 안에서 견딘 자들
  alternatives_korean:
  - 확신 가운데 견딘 자들
  - 신뢰 가운데 인내한 자들
  lexicon: ὑπομένω / πεποίθησις
  rationale: 문맥상 단순한 내적 확신보다 끝까지 버티는 인내가 핵심이므로 ‘견디다’를 택했고, ἐν πεποιθήσει는 그 인내의 태도를 나타내는 말로서 ‘믿음 안에서’가 가장 자연스럽습니다.
- source_word: δόξαν καὶ τιμὴν ἐκληρονόμησαν
  english_pob_choice: inherited glory and honor
  chosen_korean: 영광과 존귀를 상속받았고
  alternatives_korean:
  - 영광과 명예를 물려받았고
  - 영광과 존귀를 유업으로 받았고
  lexicon: κληρονομέω / δόξα / τιμή
  rationale: ἐκληρονόμησαν은 상속/유업의 뉘앙스가 분명하므로 ‘상속받다’로 옮기고, τιμή는 단순한 명예보다 더 높은 가치와 인정의 뜻이 있어 ‘존귀’가 적절합니다.
- source_word: ἐπήρθησάν τε καὶ ἔγγραφοι ἐγένοντο ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν
  english_pob_choice: were exalted, and were enrolled by God in their memorial
  chosen_korean: 높여졌으며, 하나님께서 그들의 기념록에 영원무궁토록 기록하셨습니다
  alternatives_korean:
  - 들려 올려졌으며, 하나님께서 그들을 기억의 책에 기록하셨습니다
  - 높임을 받았으며, 하나님께서 그들의 기념 안에 기록하셨습니다
  lexicon: ἐπαίρω / ἔγγραφοι γίνομαι / μνημόσυνον
  rationale: ἐπήρθησαν은 ‘높여지다/들려 올려지다’의 뜻이므로 수동형을 살려 ‘높여졌으며’로 두었고, μνημόσυνον은 단순한 추상적 ‘기억’보다 기록된 기념/기념록의 이미지를 가지므로 ‘기념록’으로 옮겼습니다.
theological_decisions:
- issue: ἀπὸ τοῦ θεοῦ ἐν τῷ μνημοσύνῳ αὐτῶν의 관계
  chosen_reading: 하나님께서 그들의 기념록에 기록하셨다는, 하나님 주도의 기억-기록 행위로 이해했습니다.
  alternative_readings:
  - 그들의 기념 속에 기록되었다
  - 하나님의 기억 안에 등록되었다
  rationale: 문맥과 POB의 수정을 따라, 소유격을 ‘하나님의 기억’으로 풀기보다 하나님이 주체가 되어 그들을 기념록에 기록하시는 장면으로 읽는 것이 더 분명합니다.
  doctrine_reference: 하나님의 기억과 기록을 통한 언약적 보존
