review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 뜻은 대체로 충실합니다. 그러나 παρεπεποιημένον은 단순히 새로 ‘꾸며 낸’ 것보다 이미 있는 내용을 거짓되게 바꾸거나 변질한 것을 포함하므로 ‘변조된 것’이 원문과 영어 audit의 ‘falsified’에 더 가깝습니다. δεύτε 문장의 ἀπὸ ὁσίων ἀνδρῶν은 행위자를 나타내므로 ‘거룩한 이들에게’가 적절합니다.
  naturalness: ‘거룩한 사람들에게서 의로운 사람들이 버림받는 것’은 한국어에서 행위자 관계가 다소 어색합니다. ‘거룩한 이들에게 버림받은 의로운 이들’로 재구성하면 자연스럽고 수동·배제의 의미도 유지됩니다.
  terminology: δίκαιος와 ὅσιος는 각각 ‘의로운’과 ‘거룩한’으로 구별하는 것이 적절합니다. 불필요하게 남아 있는 [a] 표지는 대응 각주가 없으므로 삭제해야 합니다.
  issues:
  - severity: medium
    issue: παρεπεποιημένον을 ‘꾸며낸 것’으로 번역함
    rationale: ‘꾸며낸 것’은 무에서 만들어 낸 허구에 치우칠 수 있습니다. 여기서는 기록의 거짓된 변형·위조를 포함하는 ‘변조된 것’이 더 정확합니다.
  - severity: medium
    issue: ‘거룩한 사람들에게서’라는 행위자 표현
    rationale: 원문의 ἀπό는 여기서 의로운 이들을 버린 주체를 가리킵니다. 한국어에서는 ‘거룩한 이들에게 버림받은’이 명료하고 자연스럽습니다.
  - severity: low
    issue: '[a] 각주 표지에 대응하는 각주가 없음'
    rationale: 제공된 각주 세트에 [a]의 설명이 없으므로 표지를 제거하여 독자의 혼란과 구조 불일치를 피해야 합니다.
  revised_text: 여러분은 그 안에 불의한 것도 변조된 것도 전혀 기록되어 있지 않다는 것을 아십니다. 거룩한 이들에게 버림받은 의로운 이들은 찾아볼 수 없을 것입니다.
