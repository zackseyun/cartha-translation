  text: You know that nothing unjust or falsified has been written in them; you will not find righteous people cast off by holy men.
translation:
  language: ko
  text: 여러분은 그 안에 불의한 것도, 꾸며낸 것도 전혀 기록되어 있지 않다는 것을 압니다. 여러분은 거룩한 사람들에게서 의로운 사람들[a]이 버림받는 것을 보지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστασθε
  english_pob_choice: You know
  chosen_korean: 여러분은 … 것을 압니다
  alternatives_korean:
  - 여러분은 … 것을 알고 있습니다
  - 여러분은 아십니다
  lexicon: ἐπίστασθε
  rationale: 청중에게 이미 알려진 사실을 확인하는 서술로 처리해, 영어 POB의 직접 진술을 유지하면서도 한국어 문장 흐름에 맞게 다듬었습니다.
- source_word: οὐδὲν ἄδικον
  english_pob_choice: nothing unjust
  chosen_korean: 불의한 것도 전혀
  alternatives_korean:
  - 아무 불의한 것도
  - 부정한 것도 전혀
  lexicon: ἄδικος
  rationale: ἄδικον을 단순한 ‘잘못된 것’보다 도덕적·법적 불의를 가리키는 ‘불의한 것’으로 옮겼습니다.
- source_word: παρεπεποιημένον
  english_pob_choice: falsified
  chosen_korean: 꾸며낸 것
  alternatives_korean:
  - 조작된 것
  - 날조된 것
  lexicon: παρεποιέω 계열
  rationale: 문맥상 사실을 왜곡해 만들어 낸 것을 가리키므로, 한국어로는 ‘꾸며낸 것’이 가장 자연스럽고 원문의 허위를 잘 드러냅니다.
- source_word: δικαίους ἀποβεβλημένους ἀπὸ ὁσίων ἀνδρῶν
  english_pob_choice: righteous people cast off by holy men
  chosen_korean: 거룩한 사람들에게서 의로운 사람들[a]이 버림받는 것
  alternatives_korean:
  - 거룩한 사람들에게서 의인들이 쫓겨나는 것
  - 경건한 사람들에게서 의로운 이들이 버려지는 것
  lexicon: δίκαιος / ὅσιος / ἀποβάλλω
  rationale: δίκαιους는 ‘의로운 사람들’, ὁσίων ἀνδρῶν은 사전적 ‘거룩한 사람들’로 구분해, 두 형용사의 긴장을 살렸습니다. ἀποβεβλημένους는 ‘버림받는 것’으로 옮겨 배제·추방의 수동성을 드러냈습니다.
theological_decisions:
- issue: ‘거룩한 사람들’과 ‘의로운 사람들’의 구분
  chosen_reading: 본문의 두 윤리적 표지를 구분하여, 성결/경건을 뜻하는 ὅσιος와 의로움을 뜻하는 δίκαιος를 각각 살렸습니다.
  alternative_readings:
  - 두 표현을 모두 ‘의인’으로 통합
  - ‘경건한 사람들’과 ‘의로운 사람들’로 완화
  rationale: 원문의 대조를 흐리지 않기 위해 동일어로 평준화하지 않았습니다. 이 구분은 문장이 전제하는 성경 진술의 신뢰성을 강조합니다.
  doctrine_reference: lexical precision
- issue: ἀποβεβλημένους의 수동성
  chosen_reading: ‘버림받는 것’으로 번역해, 단순한 자발적 이탈이 아니라 외부로부터의 배제·추방을 표현했습니다.
  alternative_readings:
  - ‘떠나는 것’
  - ‘내쫓기는 것’
  rationale: 문맥상 무고한 이들이 공동체적 판단에 의해 배제되는 상황을 가리키므로, 수동적 피해성을 살리는 번역이 적절합니다.
  doctrine_reference: narrative force
