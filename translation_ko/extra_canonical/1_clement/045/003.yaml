revisions:
- from: 여러분은 그 안에 불의한 것도, 꾸며낸 것도 전혀 기록되어 있지 않다는 것을 압니다. 여러분은 거룩한 사람들에게서 의로운 사람들[a]이 버림받는 것을 보지 못할 것입니다.
  to: 여러분은 그 안에 불의한 것도 변조된 것도 전혀 기록되어 있지 않다는 것을 아십니다. 거룩한 이들에게 버림받은 의로운 이들은 찾아볼 수 없을 것입니다.
