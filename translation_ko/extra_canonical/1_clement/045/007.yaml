id: 1CLEM.45.7
reference: 1 Clement 45:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἢ Ἀνανίας καὶ Ἀζαρίας καὶ Μισαὴλ ὑπὸ τῶν θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν τοῦ ὑψίστου κατείρχθησαν εἰς κάμινον πυρός, μηδὲ ταῦτα τοῦτο γένοιτο. τίνες οὖν οἱ ταῦτα δράσαντες; οἱ στυγητοὶ καὶ πάσης κακίας πλήρεις εἰς τοσοῦτο ἐξήρισαν θυμοῦ, ὥστε τοὺς ἐν ὁσίᾳ καὶ ἀμώμῳ προθέσει δουλεύοντας τῷ θεῷ εἰς αἰκίαν περιβαλεῖν, μὴ εἰδότες, ὅτι ὁ ὕψιστος ὑπέρμαχος καὶ ὑπερασπιστής ἐστιν τῶν ἐν καθαρᾷ συνειδήσει λατρευόντων τῷ παναρέτῳ ὀνόματι αὐτοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/007.yaml
  text: Or were Hananiah and Azariah and Mishael cast down into a furnace of fire by those who practiced the magnificent and glorious religion of the Most High? May this never be! Who then were the ones who did these things? The hateful[a], and those full of every evil, were stirred up to such a pitch of wrath that they subjected to abuse those who served God in a holy and blameless purpose, not knowing that the Most High is the champion and defender of those who worship his all-virtuous name with a pure conscience—to whom be the glory forever and ever. Amen.
  footnotes:
  - marker: a
    text: Or 'brought down into a furnace of fire'.
    reason: previous_rendering
translation:
  language: ko
  text: 아니, 하난야와 아자리야와 미사엘이 가장 높으신 분의 장엄하고 영광스러운 종교를 따르는 자들에 의해 불의 용광로에 갇혔습니까? 그렇게 해서는 결코 안 됩니다. 그렇다면 이런 일을 저지른 자들은 누구였습니까? 미움받는 자들과 모든 악으로 가득 찬 자들은 그토록 분노에 사로잡혀, 거룩하고 흠 없는 뜻으로 하나님을 섬기던 이들에게 폭력을 가했습니다. 그들은 가장 높으신 분이 깨끗한 양심으로 그의 가장 덕스러운 이름을 예배하는 이들의 옹호자이시며 변호자이심을 알지 못했습니다. 그분께 영광이 영원무궁하도록 있습니다. 아멘.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατείρχθησαν εἰς κάμινον πυρός
  english_pob_choice: cast down into a furnace of fire
  chosen_korean: 불의 용광로에 갇혔습니까
  alternatives_korean:
  - 불의 용광로에 던져졌습니까
  - 불의 용광로에 처넣어졌습니까
  lexicon: κατείρχω
  rationale: 동사의 핵심은 ‘아래로 내려보내다’보다 ‘가둬 두다/억류하다’에 가깝고, 본문 맥락에서도 화덕에 억지로 가둔 상황이므로 ‘갇히다’로 옮겼습니다.
- source_word: θρησκευόντων τὴν μεγαλοπρεπῆ καὶ ἔνδοξον θρησκείαν
  english_pob_choice: those who practiced the magnificent and glorious religion
  chosen_korean: 가장 높으신 분의 장엄하고 영광스러운 종교를 따르는 자들
  alternatives_korean:
  - 가장 높으신 분의 장엄하고 영광스러운 종교를 실천하는 자들
  - 가장 높으신 분의 위엄 있고 영광스러운 예배를 드리는 자들
  lexicon: θρησκεία
  rationale: θρησκεία는 단순한 ‘종교 행위’만이 아니라 공적 경건/종교적 실천을 가리킬 수 있어, 문맥상 ‘따르는 자들’과 함께 자연스럽게 풀어 의미를 드러냈습니다.
- source_word: δουλεύοντας τῷ θεῷ
  english_pob_choice: those who served God
  chosen_korean: 하나님을 섬기던 이들
  alternatives_korean:
  - 하나님께 종노릇하던 이들
  - 하나님께 봉사하던 이들
  lexicon: δουλεύω
  rationale: δουλεύω의 종속적 뉘앙스는 살리되 한국어에서 지나치게 거칠지 않게 ‘섬기다’로 옮겼습니다.
- source_word: ὑπέρμαχος καὶ ὑπερασπιστής
  english_pob_choice: the champion and defender
  chosen_korean: 옹호자이시며 변호자이심
  alternatives_korean:
  - 보호자이시며 방패이심
  - 변호자이시며 수호자이심
  lexicon: ὑπέρμαχος / ὑπερασπιστής
  rationale: 두 명칭이 모두 ‘앞에서 싸우며 지키는 분’이라는 뜻을 가지므로 법정적·전투적 이미지를 함께 살려 ‘옹호자/변호자’로 구분해 옮겼습니다.
- source_word: παναρέτῳ ὀνόματι
  english_pob_choice: his all-virtuous name
  chosen_korean: 그의 가장 덕스러운 이름
  alternatives_korean:
  - 그의 모든 선함이 깃든 이름
  - 그의 지극히 덕스러운 이름
  lexicon: παναρέτος
  rationale: 형용사의 직결 의미를 살려 ‘덕스러운’으로 옮기고, παν-의 강조를 ‘가장’으로 처리해 과도한 의역을 피했습니다.
theological_decisions:
- issue: 본문의 하나님 명칭과 예배 언어
  chosen_reading: 가장 높으신 분, 하나님, 예배하다를 문맥에 따라 구분해 사용했습니다.
  alternative_readings:
  - 전부 하나님으로 평탄화
  - 전부 주님으로 통일
  rationale: 그리스어 본문은 ὕψιστος, θεός, λατρεύω, θρησκεία를 서로 다른 뉘앙스로 사용하므로, 한국어에서도 구분을 유지해 본문의 수사적 대비를 살렸습니다.
  doctrine_reference: 성경 본문 내 호칭과 숭배 표현의 구별을 존중하는 원칙
