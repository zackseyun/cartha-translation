review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. κατείρχθησαν은 문맥상 ‘화덕에 가두다/처넣다’로 옮길 수 있어 ‘갇혔습니까’는 가능하지만, 주어의 행위를 더 분명히 하도록 ‘가두었습니까’로 다듬었습니다. αἰκία는 일반적 ‘폭력’보다 ‘학대’가 가깝습니다. 또한 λατρεύοντες τῷ παναρέτῳ ὀνόματι αὐτοῦ의 ‘그분의 모든 덕을 지닌 이름을 섬기는’ 구조와 ὑπέρμαχος의 적극적 보호 이미지를 반영했습니다.
  naturalness: 현대 표준 한국어 합쇼체에 맞게 첫 수사 의문문을 ‘아니면’으로, μηδὲ ταῦτα τοῦτο γένοιτο를 ‘그런 일은 결코 있어서는 안 됩니다’로 정리했습니다. ‘그분께 영광이 영원무궁하도록 있습니다’는 비문에 가까우므로 자연스러운 송영 표현인 ‘그분께 영광이 영원무궁하도록 있기를 빕니다’로 고쳤습니다.
  terminology: 성서 한국어의 통용 인명인 ‘하나냐, 아사랴, 미사엘’을 사용했습니다. θρησκεία는 본문의 반복과 공적 경건의 폭을 보존하여 ‘종교적 경배’로, παναρέτῳ는 ‘모든 덕을 지닌’으로 옮겼습니다. ‘옹호자와 변호자’는 지나치게 법정적인 중복이므로 ‘앞장서 싸워 주시는 분이며 보호자’로 구분했습니다.
  issues:
  - severity: medium
    issue: 인명 표기가 한국어 성서 관용과 다릅니다.
    rationale: Ἀνανίας, Ἀζαρίας, Μισαήλ은 표준 성서 한국어에서 일반적으로 ‘하나냐, 아사랴, 미사엘’로 표기합니다.
  - severity: medium
    issue: ‘폭력을 가했습니다’는 αἰκία의 의미를 충분히 반영하지 못합니다.
    rationale: αἰκία는 학대, 가혹한 대우를 뜻하며, 물리적 폭력에 한정되지 않습니다.
  - severity: medium
    issue: ‘가장 덕스러운 이름을 예배하는’은 한국어 결합이 부자연스럽고 원문의 수식 범위를 흐립니다.
    rationale: παναρέτῳ는 ‘모든 덕을 지닌’이라는 뜻이며, λατρεύω의 목적어는 ‘이름’입니다. 이를 유지하면서 자연스럽게 ‘그분의 모든 덕을 지닌 이름을 섬기는’으로 옮길 수 있습니다.
  - severity: low
    issue: 송영 문장이 자연스럽지 않고, 영어 이력에서 온 각주 [a]는 한국어 본문에 근거가 없습니다.
    rationale: ‘영광이 … 있도록 있습니다’는 한국어 관용에 맞지 않습니다. 또한 [a]는 본문에 번역상 선택지를 설명하지 않으며, 현 번역에서는 삭제하는 것이 적절합니다.
