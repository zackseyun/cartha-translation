  text: τί γὰρ εἴπωμεν, ἀδελφοί; Δανιὴλ ὑπὸ τῶν φοβουμένων τὸν θεὸν ἐβλήθη εἰς λάκκον λεόντων;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/045/006.yaml
  text: For what shall we say, brothers? Was Daniel thrown into a den of lions by those who feared God?
translation:
  language: ko
  text: 우리가 무엇이라고 말하겠습니까, 형제 여러분? 하나님을 두려워하던 이들에 의해 다니엘이 사자 굴에 던져졌습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ εἴπωμεν, ἀδελφοί;
  english_pob_choice: For what shall we say, brothers?
  chosen_korean: 우리가 무엇이라고 말하겠습니까, 형제 여러분?
  alternatives_korean:
  - 그러므로 우리가 무엇이라고 말하겠습니까, 형제 여러분?
  - 무엇을 말하겠습니까, 형제 여러분?
  lexicon: τί εἴπωμεν → 무엇이라고 말하겠습니까; ἀδελφοί → 형제 여러분
  rationale: 수사적 질문의 흐름을 살리고, ἀδελφοί를 현대적이고 공손한 공동체 호칭인 ‘형제 여러분’으로 옮겼습니다. γάρ는 여기서 앞말에 대한 설명적 전개로, 한국어에서는 자연스럽게 드러나지 않아 생략했습니다.
- source_word: Δανιὴλ
  english_pob_choice: Daniel
  chosen_korean: 다니엘
  alternatives_korean:
  - 다니엘 선지자
  - 단엘
  lexicon: 고유명사
  rationale: 성경에서 널리 정착된 음역인 ‘다니엘’을 사용했습니다.
- source_word: ὑπὸ τῶν φοβουμένων τὸν θεὸν
  english_pob_choice: by those who feared God
  chosen_korean: 하나님을 두려워하던 이들에 의해
  alternatives_korean:
  - 하나님을 경외하던 이들에 의해
  - 하나님을 무서워하던 이들에 의해
  lexicon: φοβεῖσθαι τὸν θεόν → 하나님을 두려워하다/경외하다
  rationale: 직역하면 ‘하나님을 두려워하는 자들’이지만, 문맥상 신앙적 경외를 뜻하므로 ‘하나님을 두려워하던 이들’로 옮겼습니다. 영어 POB의 ‘those who feared God’도 이 경외의 의미를 반영합니다.
- source_word: ἐβλήθη εἰς λάκκον λεόντων
  english_pob_choice: Was ... thrown into a den of lions?
  chosen_korean: 사자 굴에 던져졌습니까?
  alternatives_korean:
  - 사자 굴 속으로 던져졌습니까?
  - 사자들의 굴에 던져졌습니까?
  lexicon: βληθῆναι εἰς + λάκκος λεόντων → 사자 굴에 던져지다
  rationale: 수동태를 자연스러운 한국어 피동문으로 옮기고, 고정된 성경적 표현인 ‘사자 굴’을 유지했습니다.
theological_decisions:
- issue: φοβουμένων τὸν θεόν의 의미
  chosen_reading: 단순한 공포가 아니라 하나님에 대한 경외와 신앙적 두려움을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 하나님을 무서워하던 사람들
  - 하나님을 경외하던 사람들
  rationale: 본문의 인물 묘사는 신앙적 태도를 드러내므로, 한국어에서도 ‘경외’의 뜻이 살아나도록 하되 너무 교회식으로 굳어지지 않게 ‘두려워하던’으로 표현했습니다.
  doctrine_reference: 경외/두려움의 이중 의미
