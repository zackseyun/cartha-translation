lexical_decisions:
- source_word: ταῦτα
  english_pob_choice: these things
  chosen_korean: 이런 고난
  alternatives_korean:
  - 이 일들
  - 이것들
  - 이런 일들
  lexicon: ταῦτα
  rationale: 문맥상 앞선 박해와 고난을 가리키므로, 한국어에서는 지시어만 살리기보다 의미를 분명히 드러내는 ‘이런 고난’으로 옮기는 것이 자연스럽습니다.
- source_word: πάσχοντες
  english_pob_choice: suffering
  chosen_korean: 고난을 당하면서도
  alternatives_korean:
  - 고통받으면서도
  - 당하면서도
  - 겪으면서도
  lexicon: πάσχω
  rationale: 단순한 ‘겪다’보다 수동적으로 당하는 고난의 뉘앙스를 살려 ‘고난을 당하다’로 옮겼습니다.
- source_word: εὐκλεῶς
  english_pob_choice: nobly
  chosen_korean: 품위 있게
  alternatives_korean:
  - 고결하게
  - 명예롭게
  - 아름답게
  lexicon: εὐκλεῶς
  rationale: 영어의 ‘nobly’는 명예·품위·고결함의 결을 갖지만, 현대 한국어에서는 ‘품위 있게’가 지나치게 도덕화하지 않으면서도 태도의 고상함을 잘 전달합니다.
- source_word: ἤνεγκαν
  english_pob_choice: they endured
  chosen_korean: 견뎠습니다
  alternatives_korean:
  - 참아냈습니다
  - 버텼습니다
  - 감내했습니다
  lexicon: φέρω
  rationale: 이 동사는 여기서 고난을 끝까지 감당해 냈다는 뜻이므로, ‘견뎠습니다’가 가장 간결하고 자연스럽습니다.
