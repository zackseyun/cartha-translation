revisions:
- from: 그러므로 이 일들이 우리에게 분명하므로, 그리고 우리가 하나님의 지식의 깊은 데를 들여다보았으므로, 우리는 때에 맞게 명하신 모든 것을 질서 있게 행해야 합니다.[a]
  to: 그러므로 이 일들이 우리에게 분명하고, 우리가 하나님의 지식의 깊은 곳을 들여다보았으므로, 우리는 주인께서 정해진 때에 행하도록 명하신 모든 일을 질서 있게 행해야 합니다.
  rationale: 원문의 두 인과적 분사구를 자연스러운 한국어 인과 연결로 유지하고, ‘주인’과 ‘정해진 때에 행하도록 명하신’이라는 구성을 보완하여 δεσπότης 및 ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους를 빠짐없이 반영했습니다. τάξει는 방식의 여격이므로 ‘질서 있게’로 유지했습니다.
