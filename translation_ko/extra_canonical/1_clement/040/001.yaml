id: 1CLEM.40.1
reference: 1 Clement 40:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Προδήλων οὖν ἡμῖν ὄντων τούτων, καὶ ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως, πάντα τάξει ποιεῖν ὀφείλομεν, ὅσα ὁ δεσπότης ἐπιτελεῖν ἐκέλευσεν κατὰ καιροὺς τεταγμένους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/001.yaml
  text: Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do Therefore, since these things are plain to us, and since we have peered into the depths of the divine knowledge, we ought to do in order everything that the Master commanded to be carried out at the appointed times. to be carried out at the appointed times.
  footnotes:
  - marker: a
    text: Or 'everything in order that the Master commanded'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이 일들이 우리에게 분명하고, 우리가 하나님의 지식의 깊은 곳을 들여다보았으므로, 우리는 주인께서 정해진 때에 행하도록 명하신 모든 일을 질서 있게 행해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προδήλων οὖν ἡμῖν ὄντων τούτων
  english_pob_choice: since these things are plain to us
  chosen_korean: 이 일들이 우리에게 분명하므로
  alternatives_korean:
  - 이 일들이 우리에게 자명하므로
  - 이것들이 우리에게 분명해졌으므로
  lexicon: πρόδηλος
  rationale: πρόδηλων은 ‘분명한, 뚜렷한’의 뜻이므로, 단순한 추론이 아니라 현재 독자에게 이미 분명한 사실임을 자연스럽게 옮겼습니다.
- source_word: ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως
  english_pob_choice: we have peered into the depths of the divine knowledge
  chosen_korean: 우리가 하나님의 지식의 깊은 데를 들여다보았으므로
  alternatives_korean:
  - 우리가 하나님의 지식의 깊은 곳을 살펴보았으므로
  - 우리가 신적 지식의 깊이에 몸을 굽혔으므로
  lexicon: ἐγκεκύφω; θεία γνώσις
  rationale: ‘몸을 굽혀 깊이 들여다보다’는 이미지를 살려 ‘들여다보았으므로’로 옮기고, θείας γνώσεως는 ‘하나님의 지식’으로 풀어 과도한 추상화를 피했습니다.
- source_word: τάξει ποιεῖν
  english_pob_choice: do in order
  chosen_korean: 질서 있게 행해야 합니다
  alternatives_korean:
  - 순서대로 행해야 합니다
  - 질서 안에서 행해야 합니다
  lexicon: τάξις
  rationale: τάξει는 목적절이 아니라 방식의 여격이므로 ‘질서 있게’가 가장 직접적이며, 한국어에서 어색한 ‘순서대로 모든 것’을 피하면서도 질서의 의미를 보존합니다.
- source_word: ὁ δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주인
  alternatives_korean:
  - 주인님
  - 주
  - 주재자
  lexicon: δεσπότης
  rationale: δεσπότης는 단순한 ‘주’보다 강한 권위와 소유권을 지닌 ‘주인’이 기본값이며, 여기서는 문맥상 명령권을 가진 분을 분명히 드러냅니다.
theological_decisions:
- issue: ἐγκεχυφότες εἰς τὰ βάθη τῆς θείας γνώσεως의 인식 표현
  chosen_reading: 단순 지식 습득이 아니라 ‘깊은 데를 들여다본’ 체험적·경건한 인식으로 번역했습니다.
  alternative_readings:
  - ‘하나님의 지식의 깊은 곳을 알게 되었으므로’
  - ‘신적 지식의 깊이에 들어갔으므로’
  rationale: 본문은 지식의 깊이에 대한 경외적 접근을 강조하므로, 추상적 ‘앎’보다 시각적·체험적 표현을 유지하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 경건한 인식과 순종의 연관성
- issue: κατὰ καιροὺς τεταγμένους의 시간 이해
  chosen_reading: ‘때에 맞게’로 번역해, 정해진 시기와 적절한 실행의 의미를 함께 살렸습니다.
  alternative_readings:
  - ‘정해진 때에’
  - ‘정해진 시기마다’
  rationale: καιροὺς τεταγμένους는 단순한 연대순이 아니라 ‘정해진 때, 적절한 때’를 가리키므로, 한국어에서도 시간의 지정성과 적합성을 동시에 드러내는 표현이 필요합니다.
  doctrine_reference: 하나님이 정하신 질서와 때
