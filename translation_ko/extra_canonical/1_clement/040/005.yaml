  source_fidelity: 원문의 네 병렬 구문과 직분·집단 구별은 대체로 충실하게 옮겼습니다. 그러나 반복된 ‘그에 맞는’은 ἴδιος(각 집단에 고유하게 배정된)의 뜻을 다소 해설적으로 확장합니다. 또한 마지막 동사 δέδεται는 현재 결과를 나타내므로 ‘매여 있습니다’가 더 직접적입니다.
  naturalness: ‘고유한’의 반복은 원문의 의도적인 병렬을 보존하면서도 자연스럽습니다. ‘평신도에 관한 규정에 매입니다’보다 ‘평신도 규정에 매여 있습니다’가 현대 한국어에서 더 매끄럽고 문장 종결도 일관됩니다.
  terminology: 대제사장, 제사장들, 레위인들, 평신도는 이 문맥에서 통용되는 적절한 용어입니다. λειτουργίαι와 διακονίαι의 구별도 각각 ‘직무들’과 ‘봉사들’로 유지했습니다. προστάγμασιν은 ‘규정’으로 옮기는 것이 적절합니다.
