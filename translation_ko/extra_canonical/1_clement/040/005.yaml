id: 1CLEM.40.5
reference: 1 Clement 40:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τῷ γὰρ ἀρχιερεῖ ἴδιαι λειτουργίαι δεδομέναι εἰσίν, καὶ τοῖς ἱερεῦσιν ἴδιος ὁ τόπος προστέτακται, καὶ λευΐταις ἴδιαι διακονίαι ἐπίκεινται· ὁ λαϊκὸς ἄνθρωπος τοῖς λαϊκοῖς προστάγμασιν δέδεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/005.yaml
  text: For to the high priest his own ministries have been given[a], and to the priests their own place has been assigned, and upon the Levites their own services are laid; the layman is bound by the lay ordinances.
  footnotes:
  - marker: a
    text: Or 'upon Levites'.
    reason: previous_rendering
translation:
  language: ko
  text: 대제사장에게는 고유한 직무들이 주어져 있고, 제사장들에게는 고유한 자리가 정해져 있으며, 레위인들에게는 고유한 봉사들이 맡겨져 있습니다. 평신도는 평신도 규정에 매여 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχιερεῖ / ἱερεῦσιν / λευΐταις
  english_pob_choice: the high priest / the priests / the Levites
  chosen_korean: 대제사장 / 제사장들 / 레위인들
  alternatives_korean:
  - 큰제사장 / 사제들 / 레위 사람들
  - 대사제 / 사제들 / 레위인들
  lexicon: 확립된 성서 인명·직분 용례
  rationale: 성서 한국어에서 널리 통용되는 직분명으로 옮기되, 계층적 병렬을 살리기 위해 각각 구분하여 번역했습니다.
- source_word: λειτουργίαι / διακονίαι
  english_pob_choice: ministries / services
  chosen_korean: 직무 / 봉사
  alternatives_korean:
  - 사역 / 섬김
  - 예전적 봉사 / 직분
  lexicon: λειτουργία, διακονία
  rationale: λειτουργίαι는 공적·제의적 직무의 뉘앙스가 있어 ‘직무’로, διακονίαι는 맡겨진 섬김의 성격을 살려 ‘봉사’로 옮겼습니다.
- source_word: ἴδιος
  english_pob_choice: his own / their own
  chosen_korean: 그에 맞는 고유한
  alternatives_korean:
  - 각자의
  - 자기만의
  lexicon: ἴδιος
  rationale: 단순 소유보다 ‘각 집단에 배당된 고유성’이 핵심이므로, 반복 구조를 살리면서도 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: ὁ λαϊκὸς ἄνθρωπος / λαϊκοῖς προστάγμασιν
  english_pob_choice: the layman / the lay ordinances
  chosen_korean: 평신도 / 평신도에 관한 규정
  alternatives_korean:
  - 평민 / 평신도 법규
  - 일반 신도 / 세속 규정
  lexicon: λαϊκός, προστάγματα
  rationale: POB의 ‘lay’는 성직자 대비 일반 신분을 가리키므로 ‘평신도’로 옮기되, ‘법규’보다 덜 교회 제도화된 ‘규정’으로 표현해 원문의 일반적 구분을 살렸습니다.
theological_decisions:
- issue: 성직/평신도 구분의 질서적 진술
  chosen_reading: 이 구절은 교회 내 직분 질서를 설명하는 비교 진술로, 각 집단에 ‘고유한’ 몫이 배당되었다는 점을 드러내는 방향으로 번역했습니다.
  alternative_readings:
  - 단순한 예시 목록으로 약화하는 번역
  - 현대 교회 조직 용어로 제도화하는 번역
  rationale: 원문은 제의적·사회적 질서의 병렬을 강조하므로, 현대적 평준화나 과도한 제도화보다 배당된 질서 자체를 분명히 해야 합니다.
  doctrine_reference: 교회 직분과 질서에 대한 초대교회 문맥
