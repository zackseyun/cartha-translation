language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τὰς τε προσφορὰς καὶ λειτουργίας ἐπιτελεῖσθαι, καὶ οὐκ εἰκῇ ἢ ἀτάκτως ἐκέλευσεν γίνεσθαι, ἀλλʼ ὡρισμένοις καιροῖς καὶ ὥραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/002.yaml
  text: He commanded that both the offerings and the services be performed[a], and not take place casually or disorderly, but at appointed times and hours.
  footnotes:
  - marker: a
    text: Or 'not happen casually or disorderly'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 제물과 직무가 행해지도록 명령하셨고, 그것들이 함부로 또는 무질서하게 일어나지 않게 하셨으며, 정해진 때와 시간에 이루어지게 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσφορὰς
  english_pob_choice: offerings
  chosen_korean: 제물
  alternatives_korean:
  - 헌물
  - 예물
  lexicon: προσφορά
  rationale: 제의적 헌신의 대상을 가리키므로, 형식적이면서도 자연스러운 ‘제물’이 적절합니다.
- source_word: λειτουργίας
  english_pob_choice: services
  chosen_korean: 직무
  alternatives_korean:
  - 봉사
  - 섬김
  - 예배 직무
  lexicon: λειτουργία
  rationale: 여기서는 일반적 ‘봉사’보다 공적 제의 수행의 직무성을 살리는 ‘직무’가 원문의 제의적 뉘앙스를 더 잘 드러냅니다.
- source_word: εἰκῇ ἢ ἀτάκτως
  english_pob_choice: casually or disorderly
  chosen_korean: 함부로 또는 무질서하게
  alternatives_korean:
  - 무심코 또는 어지럽게
  - 대충 또는 무질서하게
  lexicon: εἰκῇ / ἀτάκτως
  rationale: εἰκῇ의 ‘임의로, 아무렇게나’와 ἀτάκτως의 ‘질서 없이’라는 대비를 한국어에서 가장 직접적으로 살리기 위해 이 표현을 택했습니다.
- source_word: ὡρισμένοις καιροῖς καὶ ὥραις
  english_pob_choice: appointed times and hours
  chosen_korean: 정해진 때와 시간
  alternatives_korean:
  - 지정된 때와 시간
  - 정하여진 시기와 시간
  lexicon: ὡρισμένοις καιροῖς καὶ ὥραις
  rationale: 두 명사 모두 시간을 가리키지만, ‘때와 시간’이 자연스럽고 원문의 반복적 강조를 무리 없이 옮깁니다.
theological_decisions:
- issue: 제의 행위의 질서와 시기 지정
  chosen_reading: 하나님은 제물과 직무의 수행을 임의성과 혼란이 아니라 정해진 질서와 시기에 두셨습니다.
  alternative_readings:
  - 단순한 실무 지침으로만 읽는 해석
  - 형식적 규정으로만 축소하는 해석
  rationale: 문맥상 단순한 행정 지시를 넘어, 예배와 섬김이 질서 있게 그리고 정해진 때에 이루어져야 한다는 신학적 질서 인식을 반영해야 합니다.
  doctrine_reference: 예배 질서와 하나님의 주권적 섭리
