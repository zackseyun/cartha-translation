  source_fidelity: 수정이 필요합니다. 초안의 ‘제물과 직무가 행해지도록’은 προσφοραί와 λειτουργίαι를 함께 다루려는 의도는 보이나, ‘제물’ 자체가 ‘행해진다’는 결합은 다소 부자연스럽습니다. 또한 원문은 제물/직무의 수행이 ‘함부로 또는 무질서하게’ 이루어지는 것을 부정하고 정해진 때와 시간에 이루어지도록 명령하였다고 말합니다.
  naturalness: ‘제물 봉헌과 예배 직무가 … 이루어지도록’으로 옮기면 한국어의 자연스러운 결합을 유지하면서 제의적 문맥과 공적 λειτουργία의 뜻을 드러낼 수 있습니다. ‘아무렇게나’는 εἰκῇ의 임의성·무계획성을, ‘무질서하게’는 ἀτάκτως의 질서 결여를 자연스럽게 전달합니다.
  terminology: προσφοραί는 여기서 단순 물건인 ‘제물’보다 행위도 포함하는 ‘제물 봉헌’이 적절합니다. λειτουργίαι는 문맥상 일반 봉사보다 공적 제의 수행을 가리키므로 ‘예배 직무’로 번역합니다. ‘정해진 때와 시간’은 ὡρισμένοις καιροῖς καὶ ὥραις의 중첩된 시간 표현을 보존합니다.
