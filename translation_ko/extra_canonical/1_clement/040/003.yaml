    rationale: 원문은 εὐδοκία(기뻐하심/호의)와 θέλημα(뜻)를 구별하여 사용합니다. 번역에서도 이를 가능한 한 구별해야 합니다.
  - severity: low
    issue: ‘기꺼이 받아들여지게’는 εὐπρόσδεκτα에 자발적 의지를 암시할 수 있습니다.
