  rationale: ‘기뻐하심’과 ‘뜻’을 구별하고, ‘경건하게’ 및 ‘기쁘게 받아들여지도록’으로 원문의 부사적 수식과 수용 언어를 더 직접적으로 반영했습니다. ἐν εὐδοκήσει의 수식 범위는 확정하지 않고 각주로 대안을 제시했습니다.
