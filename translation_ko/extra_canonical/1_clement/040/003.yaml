id: 1CLEM.40.3
reference: 1 Clement 40:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ποῦ τε καὶ διὰ τίνων ἐπιτελεῖσθαι θέλει, αὐτὸς ὥρισεν τῇ ὑπερτάτῃ αὐτοῦ βουλήσει, ἵνʼ ὁσίως πάντα γινόμενα ἐν εὐδοκήσει εὐπρόσδεκτα εἴη τῷ θελήματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/003.yaml
  text: And where and through whom he wants them to be performed[a], he himself determined by his supreme will, so that all things, being done in holiness, might be acceptable to his will according to his good pleasure.
  footnotes:
  - marker: a
    text: Or 'so that, with all things being done in holiness, they might be acceptable with approval to his will.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 어디에서 누구를 통해 그것들이 행해지기를 원하시는지도 그분 자신이 자신의 지극히 높으신 뜻으로 정하셨습니다. 이는 모든 것이 거룩함 가운데 행해져, 그분의 선하신 뜻에 따라 기꺼이 받아들여지게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποῦ τε καὶ διὰ τίνων
  english_pob_choice: where and through whom
  chosen_korean: 어디에서 누구를 통해
  alternatives_korean:
  - 어디에 그리고 누구를 통해
  - 어느 곳에서 누구를 통하여
  lexicon: ποῦ; διά + gen.; τίς
  rationale: 장소와 매개자를 함께 묻는 구조를 자연스러운 한국어로 살려, 행위가 일어나는 ‘어디에서’와 ‘누구를 통해’의 병렬을 유지했습니다.
- source_word: ἐπιτελεῖσθαι θέλει
  english_pob_choice: he wants them to be performed
  chosen_korean: 그것들이 행해지기를 원하시는
  alternatives_korean:
  - 그것들이 수행되기를 원하시는
  - 그것들이 이루어지기를 원하시는
  lexicon: ἐπιτελέω; θέλω
  rationale: 의식적·공적 행위의 완수를 뜻하는 동사를 ‘행해지다’로 옮겨, 단순한 발생이 아니라 수행/집행의 뉘앙스를 살렸습니다.
- source_word: ὑπερτάτῃ ... βουλήσει
  english_pob_choice: his supreme will
  chosen_korean: 자신의 지극히 높으신 뜻
  alternatives_korean:
  - 그의 최고의 뜻
  - 그분의 가장 높은 뜻
  lexicon: ὑπερτάτος; βουλή
  rationale: βουλή를 ‘뜻’으로 옮기고, ὑπερτάτῃ는 단순한 서열이 아니라 최상위의 권위를 나타내므로 ‘지극히 높으신’으로 표현했습니다.
- source_word: ὁσίως ... ἐν εὐδοκήσει ... εὐπρόσδεκτα
  english_pob_choice: being done in holiness ... according to his good pleasure ... might be acceptable
  chosen_korean: 거룩함 가운데 행해져, 그분의 선하신 뜻에 따라 기꺼이 받아들여지게
  alternatives_korean:
  - 거룩하게 행해져, 그분의 선하신 기쁨에 따라 받아들여지게
  - 거룩함 안에서 행해져, 그분의 선하신 기호에 따라 받아들여지게
  lexicon: ὁσίως; εὐδοκία; εὐπρόσδεκτος
  rationale: ἐν εὐδοκήσει를 ‘행해짐’ 쪽으로 붙이기보다 ‘받아들여짐’의 기준으로 두어, 주어진 수정안의 취지에 따라 문장 흐름과 의미를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 하나님의 주권적 결정과 인간/직분의 매개성
  chosen_reading: 모든 행위의 장소와 매개자까지도 하나님이 자신의 뜻으로 정하셨다고 분명히 서술합니다.
  alternative_readings:
  - 단순히 질서 정연한 수행 방식만 말한다고 완화하는 읽기
  - 교회 직분 규정에만 한정하는 읽기
  rationale: 본문은 ‘어디에서’와 ‘누구를 통해’라는 구체 요소를 함께 묶어 하나님의 선제적 결정권을 강조하므로, 이를 약화시키지 않고 직설적으로 옮겼습니다.
  doctrine_reference: 하나님의 섭리와 질서에 대한 초기 기독교 이해
