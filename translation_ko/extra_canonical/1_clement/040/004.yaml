id: 1CLEM.40.4
reference: 1 Clement 40:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ οὖν τοῖς προστεταγμένοις καιροῖς ποιοῦντες τὰς προσφορὰς αὐτῶν εὐπρόσδεκτοί τε καὶ μακάριοί· τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες οὐ διαμαρτάνουσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/040/004.yaml
  text: Therefore those who make their offerings at the appointed times are both acceptable and blessed[a]; for by following the lawful ordinances of the Master they do not go astray.
  footnotes:
  - marker: a
    text: Or 'at the appointed times that have been prescribed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 정해진 때에 예물을 드리는 이들은 받아들여질 만하고 복된 이들입니다. 그들은 주인의 법규를 따르므로 빗나가지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προστεταγμένοις καιροῖς
  english_pob_choice: at the appointed times
  chosen_korean: 지정된 시기
  alternatives_korean:
  - 정해진 때
  - 임명된 때
  - 규정된 시기
  lexicon: καιρός / προστετάσσω
  rationale: προστεταγμένοις는 ‘미리 정해진/지정된’ 뜻을 살리고, καιροῖς는 단순한 시각보다 일정한 시기·때를 가리키므로 ‘지정된 시기’로 자연스럽게 옮겼습니다.
- source_word: προσφορὰς
  english_pob_choice: their offerings
  chosen_korean: 예물을 드리는
  alternatives_korean:
  - 헌물을 드리는
  - 드리는 제물
  - 바치는 예물
  lexicon: προσφορά
  rationale: 문맥상 제사적 ‘offering’의 의미가 분명하므로, 한국어에서는 동사를 포함한 ‘예물을 드리는’으로 풀어 자연스럽게 했습니다.
- source_word: εὐπρόσδεκτοί τε καὶ μακάριοί
  english_pob_choice: acceptable and blessed
  chosen_korean: 기쁘게 받아들여질 뿐 아니라 복된
  alternatives_korean:
  - 받아들여지고 복된
  - 기꺼이 받아들여지고 복된
  - 열납되고 복된
  lexicon: εὐπρόσδεκτος / μακάριος
  rationale: εὐπρόσδεκτος는 단순한 ‘수용됨’보다 ‘기쁘게 받아들여짐’이 더 직접적이어서 그렇게 옮겼고, μακάριος는 관용적으로 ‘복된’으로 유지했습니다.
- source_word: τοῖς γὰρ νομίμοις τοῦ δεσπότου ἀκολουθοῦντες
  english_pob_choice: by following the lawful ordinances of the Master
  chosen_korean: 주님의 합당한 규례를 따르므로
  alternatives_korean:
  - 주님의 합법적인 명령을 따르므로
  - 주인의 정당한 법도를 따르므로
  - 주님의 법적인 규정들을 따르므로
  lexicon: νόμιμος / δεσπότης
  rationale: νόμιμος는 단순한 ‘법적’보다 ‘합당한/정당한’ 뉘앙스가 있어 ‘합당한 규례’로 옮겼고, δεσπότης는 이 문맥의 권위자 호칭이므로 ‘주님’으로 처리했습니다.
- source_word: οὐ διαμαρτάνουσιν
  english_pob_choice: they do not go astray
  chosen_korean: 그들은 잘못되지 않습니다
  alternatives_korean:
  - 그들은 빗나가지 않습니다
  - 그들은 죄짓지 않습니다
  - 그들은 어긋나지 않습니다
  lexicon: διαμαρτάνω
  rationale: διαμαρτάνω는 여기서 단순한 ‘죄를 짓다’보다 ‘길을 벗어나다/잘못되다’의 의미가 자연스럽고, 영어 POB의 ‘go astray’도 이를 반영하므로 그렇게 옮겼습니다.
theological_decisions:
- issue: δεσπότης의 한국어 호칭
  chosen_reading: 이 구절에서는 δεσπότης를 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 주인
  - 주
  - 주권자
  rationale: 예배와 규례 문맥에서 권위 있는 주체를 가리키므로, 한국어 독자가 관계적·경배적 의미를 즉시 이해하도록 ‘주님’을 선택했습니다.
  doctrine_reference: 문맥적 호칭 선택(그리스도론/경배 ভাষা)
- issue: εὐπρόσδεκτοί τε καὶ μακάριοί의 결합
  chosen_reading: ‘기쁘게 받아들여질 뿐 아니라 복된 사람들’로 두 속성을 모두 살렸습니다.
  alternative_readings:
  - 받아들여지고 복된 사람들
  - 열납되고 복된 사람들
  rationale: 두 형용사를 병렬로 유지해, 단순 승인과 복의 상태가 함께 진술된다는 점을 보존했습니다.
  doctrine_reference: 문맥적 병렬 구조 보존
