base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/056.yaml
  text: 'Therefore let us also intercede concerning those who are in some transgression[a], so that gentleness and humility may be given to them, for them to yield not to us, but to the will of God. For in this way their remembrance before God and the saints will be fruitful and complete, with compassion.


    Let us accept discipline, at which no one ought to be resentful, beloved. The admonition that we give to one another is good and exceedingly beneficial, for it binds us to the will of God. For thus says the holy word:


    “The Lord surely disciplined me,

    and he did not hand me over to death.”


    “For the Lord disciplines the one whom he loves,

    and he scourges every son whom he receives.”


    “For,” it says, “the righteous one will discipline me in mercy and will reprove me,

    but let not the oil of sinners anoint my head.”


    And again it says:


    “Blessed is the man whom the Lord has reproved;

    and do not refuse the admonition of the Almighty.

    For he causes pain, and then restores again;

    he struck, and his hands healed.

    Six times he will deliver you from distresses,

    and in the seventh no evil will touch you.

    In famine he will rescue you from death,

    and in war he will free you from the hand of iron.

    He will hide you from the scourge of the tongue,

    and you will certainly not fear evils when they come.

    You will laugh at the unrighteous and lawless,

    and you will certainly not fear wild beasts,

    for wild beasts will be at peace with you.

    Then you will know that your house will be at peace,

    and the dwelling of your tent will certainly not go wrong.

    And you will know that your seed will be many,

    and your children like the abundant grass of the field.

    And you will come to the grave like ripe grain harvested in its season,

    or like a heap from the threshing floor gathered in at the proper time.”


    See, beloved, how great a protection there is for those who are disciplined by the Master. For, being a good Father[b][c][d][e][f][g], he disciplines us so that we may receive mercy through his holy discipline.'
  footnotes:
  - marker: a
    text: Or 'their mention before God and the saints will be fruitful and complete with compassion.' The Greek phrase is compact and may refer either to the community's remembering them or to their being remembered favorably.
    reason: lexical_alternative
    anchor_ref: '56:1'
  - marker: g
    text: The citation echoes Psalm 141:5(140:5 LXX). The contrast is between righteous correction and the flattering 'oil' of sinners.
    reason: cross_reference
    anchor_ref: '56:5'
  - marker: f
    text: This extended citation draws chiefly from Job 5:17-26 in Septuagintal form.
    reason: cross_reference
    anchor_ref: 56:6-15
  - marker: e
    text: '''Master'' renders Greek despotes, distinguished here from kyrios (''Lord'') in the preceding citations.'
    reason: lexical_alternative
    anchor_ref: '56:16'
  - marker: d
    text: Or 'those who are caught in some transgression'.
    reason: previous_rendering
  - marker: c
    text: Or 'the condition of your tent'.
    reason: previous_rendering
  - marker: b
    text: Or 'from the hand of the sword'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리도 어떤 잘못 안에 있는 이들에 관하여 간구하여, 그들에게 온유와 겸손이 주어져 우리에게가 아니라 하나님의 뜻에 양보하게 하십시오. 그러면 그들의 하나님 앞과 성도들 앞의 기억은 긍휼과 함께 열매 맺고 온전하게 될 것입니다.\n\n사랑하는 이들이여, 아무도 원망해서는 안 되는 그 훈육을 받아들이십시오. 우리가 서로에게 행하는 권면은 선하며 매우 유익합니다. 그것은 우리를 하나님의 뜻에 붙들어 맵니다.\n\n그리하여 거룩한 말씀은 이렇게 말합니다.\n\n「주께서 나를 징계하셨고,\n죽음에 넘기지 않으셨습니다.」\n\n「주께서 사랑하시는 자를 징계하시고,\n받아들이는 모든 아들을 채찍질하십니다.」\n\n「그는 의인이 나를 긍휼히 여기며 나를 책망할 것이라고 말합니다.\n그러나 죄인들의 기름이 내 머리를 적시지 못하게 하십시오.」\n\n그리고 또 말합니다.\n\n「주께서 책망하신 사람은 복이 있습니다.\n전능자의 훈계를 거부하지 마십시오.\n그분은 아프게 하시고도 다시 회복시키시며,\n치시고도 그 손으로 낫게 하십니다.\n여섯 번의 환난에서 그분이 당신을 건져내시고,\n일곱 번째에는 어떤 악도 당신을 건드리지 못할 것입니다.\n기근 때에는 당신을 죽음에서 구해 내시고,\n전쟁 때에는 쇠의 손에서 당신을 풀어 주실 것입니다.\n그분은 혀의 채찍에서 당신을 숨기실 것이며,\n다가오는 재앙들을 두려워하지 않을 것입니다.\n불의한 자들과 불법한 자들을 비웃을 것이며,\n거친 짐승들을 두려워하지 않을 것입니다.\n그 까닭은 거친 짐승들이 당신과 평화로울 것이기 때문입니다.\n그때 당신은 당신의 집이 평안함을 알게 되고,\n당신 장막의 거처가 결코 잘못되지 않음을 알게 될 것입니다.\n또 당신의 씨가 많고,\n당신의 자녀들은 들의 풍성한 풀과 같음을 알게 될 것입니다.\n그리고 당신은 제때에 거둬지는 익은 곡식처럼,\n또는 알맞은 때에 모아 들인 타작마당의 곡식단처럼 무덤에 이르게 될 것입니다.」\n\n보십시오, 사랑하는 이들이여, 주인께서 징계받는 이들에게
    얼마나 큰 보호를 베푸시는지. 선한 아버지이신 그분은 거룩한 훈육을 통하여 우리에게 긍휼을 받게 하시려고 우리를 징계하십니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντύχωμεν
  english_pob_choice: let us intercede
  chosen_korean: 간구하여
  alternatives_korean:
  - 중재하여
  - 기도하여
  lexicon: BDAG
  rationale: 문맥상 잘못 가운데 있는 이들을 위한 기도적 청원을 가리키므로, 한국어에서는 ‘간구하다’가 가장 자연스럽고 직접적입니다.
- source_word: παράπτωμα
  english_pob_choice: transgression
  chosen_korean: 잘못
  alternatives_korean:
  - 범과
  - 허물
  - 죄과
  lexicon: BDAG
  rationale: 여기서는 중대한 죄책을 지나치게 특정하기보다, 실제로 범한 도덕적 일탈을 넓게 가리켜야 하므로 ‘잘못’이 무난합니다.
- source_word: ἐπιείκεια καὶ ταπεινοφροσύνη
  english_pob_choice: gentleness and humility
  chosen_korean: 온유와 겸손
  alternatives_korean:
  - 관용과 겸손
  - 너그러움과 겸손
  lexicon: BDAG
  rationale: 두 덕목의 결합을 한국어 교회 문맥에서 가장 자연스럽게 살리면서도, source의 윤리적 긴장을 유지합니다.
- source_word: εἶξαι
  english_pob_choice: to yield
  chosen_korean: 양보하게
  alternatives_korean:
  - 굴복하게
  - 물러서게
  lexicon: LSJ
  rationale: ‘우리에게가 아니라 하나님의 뜻에’라는 대조를 살리기 위해, 강압적 복종보다 ‘양보하다/물러서다’의 의미가 적절합니다.
- source_word: μνεία
  english_pob_choice: remembrance
  chosen_korean: 기억
  alternatives_korean:
  - 추모
  - 언급
  lexicon: BDAG
  rationale: 하나님과 성도들 앞에서의 긍정적 회상을 가리키므로 ‘기억’이 가장 직접적입니다. 다만 ‘기억’만으로는 행위성을 약화시킬 수 있어 문맥으로 보완했습니다.
- source_word: ἐπιείκεια … μνεία
  english_pob_choice: their remembrance before God and the saints will be fruitful and complete, with compassion
  chosen_korean: 긍휼과 함께 열매 맺고 온전하게 될 것입니다
  alternatives_korean:
  - 긍휼과 함께 풍성하고 완전해질 것입니다
  - 긍휼로 말미암아 열매 맺고 완전할 것입니다
  lexicon: LSJ
  rationale: ‘ἔγκαρπος καὶ τελεία’의 두 형용사를 자연스러운 한국어 서술로 풀어, 기억 자체가 긍휼과 결합해 유익한 결과를 낳는다는 점을 드러냈습니다.
- source_word: ἀναλάβωμεν παιδείαν
  english_pob_choice: let us accept discipline
  chosen_korean: 훈육을 받아들이십시오
  alternatives_korean:
  - 징계를 받으십시오
  - 교훈을 받아들이십시오
  lexicon: BDAG
  rationale: λόγος와 인용문의 흐름상 단순 교육이 아니라 하나님이 베푸시는 교정과 훈련의 의미가 강하므로 ‘훈육’이 가장 균형 잡힌 선택입니다.
- source_word: νουθέτησις / νουθέτημα
  english_pob_choice: admonition
  chosen_korean: 권면 / 훈계
  alternatives_korean:
  - 권고
  - 경고
  lexicon: BDAG
  rationale: 형제 간의 교정적 말하기는 ‘권면’으로, 전능자의 말씀은 ‘훈계’로 번역해 동일 어근의 의미 범위를 한국어로 구분했습니다.
- source_word: κολλᾷ
  english_pob_choice: binds
  chosen_korean: 붙들어 맵니다
  alternatives_korean:
  - 묶습니다
  - 연결합니다
  lexicon: BDAG
  rationale: 관계를 강하게 결속시키는 동사를 살리되, 한국어에서는 ‘붙들어 매다’가 비유적 힘을 가장 잘 전달합니다.
- source_word: δεσπότου
  english_pob_choice: the Master
  chosen_korean: 주인께서
  alternatives_korean:
  - 주께서
  - 주인님께서
  lexicon: BDAG
  rationale: κύριος와 구별되는 δεσπότης의 강한 주권성을 유지하기 위해, 여기서는 일반적인 ‘주’보다 ‘주인’이 더 직접적입니다.
theological_decisions:
- issue: δεσπότης와 κύριος의 구별
  chosen_reading: 마지막 권면에서는 ‘주인’으로, 인용문들에서는 ‘주’로 구분했습니다.
  alternative_readings:
  - 모두 ‘주’로 통일
  - 모두 ‘주님’으로 통일
  rationale: 본문은 성경 인용의 κύριος와 결론부의 δεσπότης를 구별해 사용하므로, 한국어에서도 권위의 강도 차이를 드러내야 합니다.
  doctrine_reference: Consistency of key terms, or documented exception
- issue: μνεία와 ἔγκαρπος καὶ τελεία의 관계
  chosen_reading: ‘기억’이 하나님과 성도들 앞에서 ‘긍휼과 함께 열매 맺고 온전하게 될 것’으로 옮겼습니다.
  alternative_readings:
  - ‘언급’이 열매 맺고 온전해질 것
  - ‘추모’가 긍휼과 함께 완전해질 것
  rationale: 그리스어는 단순한 회상보다 공동체적·하나님 앞의 긍정적 기도를 포함하므로, 결과 중심의 한국어로 옮기되 원문의 긴장을 보존했습니다.
  doctrine_reference: Community remembrance and intercession
- issue: παιδεία/νουθεσία의 성격
  chosen_reading: 하나님이 주시는 교정적 훈련과 권면으로 읽었습니다.
  alternative_readings:
  - 단순한 교육
  - 법적 처벌
  rationale: 본문의 시편·욥 인용은 고난을 통한 아버지의 훈육을 강조하므로, 징벌이 아니라 거룩한 훈련이라는 점을 살려야 합니다.
  doctrine_reference: Divine fatherly discipline
