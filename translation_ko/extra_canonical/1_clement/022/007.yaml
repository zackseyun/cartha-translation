  text: ἐκέκραξεν ὁ δίκαιος, καὶ ὁ κύριος εἰσήκουσεν αὐτοῦ καὶ ἐκ πασῶν τῶν θλίψεων αὐτοῦ ἐῤῥύσατο αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/007.yaml
  text: The righteous man cried out, and the Lord heard him and delivered him from all his afflictions.
translation:
  language: ko
  text: 의인이 부르짖었고, 주께서 그의 말을 들으시고 그의 모든 환난에서 그를 건져 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δίκαιος
  english_pob_choice: The righteous man
  chosen_korean: 의인
  alternatives_korean:
  - 의로운 사람
  - 의롭다 함을 받은 사람
  lexicon: δίκαιος
  rationale: 영어 POB의 righteous man을 자연스러운 현대 한국어로 옮기되, 문맥상 특정 성별을 강조하지 않는 ‘의인’이 원문의 일반적 용법을 가장 간결하게 반영합니다.
- source_word: ἐκέκραξεν
  english_pob_choice: cried out
  chosen_korean: 부르짖으니
  alternatives_korean:
  - 외치니
  - 소리치니
  lexicon: κράζω
  rationale: 강한 호소와 절박함을 담은 동사로, 단순한 ‘외침’보다 간절한 부르짖음을 살리는 표현이 원문의 긴박함을 잘 드러냅니다.
- source_word: ὁ κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께
  lexicon: κύριος
  rationale: 여기서 κύριος는 하나님의 칭호이므로 ‘주님’도 가능하지만, 서술문에서 간결하고 고전적인 호격/주격 기능을 보존하는 ‘주’가 적절합니다.
- source_word: ἐκ πασῶν τῶν θλίψεων αὐτοῦ
  english_pob_choice: from all his afflictions
  chosen_korean: 그의 모든 환난에서
  alternatives_korean:
  - 그의 모든 고난에서
  - 그의 모든 고통에서
  lexicon: θλῖψις
  rationale: θλῖψις는 단순한 감정적 고통보다 외적 압박과 시련을 포함하므로, 성경적 어감이 살아 있는 ‘환난’이 가장 근접합니다.
theological_decisions:
- issue: ‘주’의 지시 대상
  chosen_reading: 본문의 ‘주’는 하나님을 가리키는 칭호로 옮겼습니다.
  alternative_readings:
  - 일반적 주인/주군
  - 메시아 칭호
  rationale: 시편 인용 전통을 반영한 문맥에서 κύριος는 하나님을 가리키는 것으로 이해하는 것이 가장 자연스럽고, 본문 전체의 구원 행위를 설명합니다.
  doctrine_reference: LXX/시편 인용 관행
