  yaml_path: translation/extra_canonical/1_clement/022/002.yaml
  text: Who is the man who desires life, who loves to see good days?
translation:
  language: ko
  text: 누가 생명을 원하며, 좋은 날들을 보기를 사랑하는 사람입니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς ἐστιν ἄνθρωπος
  english_pob_choice: Who is the man
  chosen_korean: 누가 생명을 원하며
  alternatives_korean:
  - 그 사람이 누구입니까
  - 어떤 사람이겠습니까
  lexicon: τίς / ἄνθρωπος
  rationale: 수사적 질문 구조를 살리면서도 한국어 문장 자연성을 위해 첫 절을 질문형으로 시작했습니다. ἄνθρωπος는 여기서 일반적인 ‘사람’이지만, 관용적 수사문을 고려해 ‘누가’로 압축해 옮겼습니다.
- source_word: ὁ θέλων ζωὴν
  english_pob_choice: who desires life
  chosen_korean: 생명을 원하며
  alternatives_korean:
  - 생명을 바라며
  - 생명을 갈망하는
  lexicon: θέλω / ζωή
  rationale: θέλων의 현재분사적 지속성을 반영해 ‘원하며’로 옮겼고, ζωή는 단순한 생물학적 삶보다 문맥상 ‘생명’이 더 직접적이어서 그렇게 번역했습니다.
- source_word: ἀγαπῶν ἡμέρας ἰδεῖν ἀγαθάς
  english_pob_choice: who loves to see good days
  chosen_korean: 좋은 날들을 보기를 사랑하는 사람입니까
  alternatives_korean:
  - 좋은 날들을 보기를 좋아하는 사람입니까
  - 복된 날들을 보기를 사랑하는 사람입니까
  lexicon: ἀγαπάω / ἡμέραι ἀγαθαί
  rationale: 영문 POB의 구조를 따라 ἀγαπῶν을 ‘사랑하는’으로 유지했고, ἡμέρας ἀγαθάς는 직역에 가까운 ‘좋은 날들’로 옮겨 원문의 표현성과 시편적 울림을 보존했습니다.
theological_decisions:
- issue: 시편 인용문의 수사적 형태 유지
  chosen_reading: 직설적 진술이 아니라 수사적 질문으로 유지했습니다.
  alternative_readings:
  - 평서문으로 풀어 ‘생명을 원하고 좋은 날들을 보기를 사랑하는 사람은 누구입니까’처럼 옮길 수 있습니다.
  rationale: 본문은 인간 일반에 대한 초청형 질문으로 기능하므로, 한국어에서도 질문의 긴장을 살려야 원문의 권면적 힘이 유지됩니다.
  doctrine_reference: 시 34:12-16 인용/반영의 수사적 기능
