lexical_decisions:
- source_word: παῦσον τὴν γλῶσσάν σου ἀπὸ κακοῦ
  english_pob_choice: Keep your tongue from evil
  chosen_korean: 악에서 네 혀를 지키고
  alternatives_korean:
  - 네 혀를 악에서 멈추십시오
  - 네 혀를 악에서 그치게 하십시오
  - 네 혀를 악에서 멈추어 두십시오
  lexicon: παύω / γλῶσσα / κακός
  rationale: παύω는 단순히 ‘중지하다’보다 ‘~에서 지키다/막다’로 자연스럽게 옮길 수 있고, γλῶσσα는 직역한 ‘혀’를 유지해 원문의 신체 은유를 살렸습니다.
- source_word: κακοῦ
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 나쁜 것
  - 해악
  - 악한 것
  lexicon: κακός
  rationale: 여기서 κακόν은 도덕적 악을 가리키므로, 한국어에서도 추상적·윤리적 뉘앙스를 지닌 ‘악’이 가장 सीधे합니다.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  english_pob_choice: speaking deceit
  chosen_korean: 속임수를 말하지 마십시오
  alternatives_korean:
  - 거짓을 말하지 마십시오
  - 기만을 말하지 마십시오
  - 속이는 말을 하지 마십시오
  lexicon: δόλος / λαλέω
  rationale: δόλος은 단순한 거짓말보다 ‘속임수/기만’의 의미가 강하므로, 동사구 전체를 한국어 자연문으로 옮기되 ‘속임수’를 유지했습니다.
