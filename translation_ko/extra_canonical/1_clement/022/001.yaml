id: 1CLEM.22.1
reference: 1 Clement 22:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ταῦτα δὲ πάντα βεβαιοῖ ἡ ἐν Χριστῷ πίστις· καὶ γὰρ αὐτὸς διὰ τοῦ πνεύματος τοῦ ἁγίου οὕτως προσκαλεῖται ἡμᾶς· Δεῦτε, τέκνα, ἀκούσατέ μου, φόβον κυρίου διδάξω ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/001.yaml
  text: 'And And faith in Christ confirms all these things. confirms all these things. For he himself, through the Holy Spirit, thus calls us: “Come, children, listen to me; I will teach you the fear of the Lord.'
  footnotes:
  - marker: a
    text: Or 'the faith that is in the Messiah'.
    reason: previous_rendering
  - marker: b
    text: Or 'For he himself also, through the Holy Spirit, thus calls to us'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 모든 것은 그리스도 안에 있는 믿음이 확증합니다. 참으로 그분 자신이 성령을 통해 이렇게 우리를 부르십니다. 「오너라, 자녀들아. 내 말을 들으라. 내가 너희에게 주를 경외하는 법을 가르치겠다」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐν Χριστῷ πίστις
  english_pob_choice: faith in Christ
  chosen_korean: 그리스도 안에 있는 믿음
  alternatives_korean:
  - 그리스도에 대한 믿음
  - 메시아 안에 있는 믿음
  lexicon: πίστις
  rationale: ἐν Χριστῷ는 단순히 ‘그리스도에 대한’보다 결속 관계를 드러내는 구문이므로, 한국어에서는 ‘~안에 있는 믿음’으로 자연스럽게 옮겼습니다. POB의 문맥상 Χριστός를 ‘메시아’로 돌릴 여지도 있으나, 여기서는 고유 표기 관행을 따라 ‘그리스도’를 썼습니다.
- source_word: διὰ τοῦ πνεύματος τοῦ ἁγίου
  english_pob_choice: through the Holy Spirit
  chosen_korean: 성령을 통해
  alternatives_korean:
  - 성령으로
  - 거룩한 영을 통해
  lexicon: πνεῦμα
  rationale: 여기서는 하나님의 영을 가리키는 명시적 표현이므로 ‘성령’이 적절합니다. 전치사 διὰ는 매개를 나타내어 한국어에서는 ‘통해’가 가장 무난합니다.
- source_word: προσκαλεῖται ἡμᾶς
  english_pob_choice: calls us
  chosen_korean: 우리를 부르십니다
  alternatives_korean:
  - 우리에게 부르십니다
  - 우리를 불러오십니다
  lexicon: προσκαλέω
  rationale: 중간태는 단순 통보보다 ‘불러 모으다/부르다’의 뉘앙스를 주므로, 한국어에서는 직접 대상화되는 ‘우리를 부르십니다’로 옮겼습니다. POB의 영어처럼 불필요한 ‘to us’를 넣지 않았습니다.
- source_word: φόβον κυρίου
  english_pob_choice: the fear of the Lord
  chosen_korean: 주를 경외하는 법
  alternatives_korean:
  - 주님을 두려워함
  - 주를 경외함
  lexicon: φόβος
  rationale: φόβος κυρίου는 단순 공포보다 경외와 순종의 태도를 포함하므로 ‘경외’로 옮겼습니다. 문맥상 가르칠 내용의 성격을 살려 ‘법’을 덧붙여 자연스러운 한국어로 정리했습니다.
theological_decisions:
- issue: Χριστός의 한국어 표기
  chosen_reading: 그리스도
  alternative_readings:
  - 메시아
  rationale: 본 절에서는 인물명/호칭으로 기능하며, 1 클레멘스의 한국어 가독성과 예전적 관행을 고려해 ‘그리스도’를 택했습니다. 다만 이것이 ‘메시아’의 의미를 부정하는 것은 아닙니다.
  doctrine_reference: 기독론 용어 일관성
- issue: 직접 인용문 안의 명령문 어조
  chosen_reading: 「오너라, 자녀들아. 내 말을 들으라.」
  alternative_readings:
  - 「오너라, 자녀들아. 내 말을 들으십시오.」
  rationale: 원문은 청중에게 직접 말하는 인용으로, 헬라어 명령형의 생동감을 살리기 위해 인용문 내부에서는 비교적 직접적인 어조를 유지했습니다. 다만 문체는 전체적으로 현대 합쇼체를 따릅니다.
  doctrine_reference: 성경/문헌 인용문 화법
- issue: ‘φόβον κυρίου’의 의미
  chosen_reading: 주를 경외하는 법
  alternative_readings:
  - 주의 두려움
  - 주를 경외함
  rationale: 본문의 초점은 공포 심리보다 하나님을 향한 경외와 그에 따른 교훈에 있으므로, 신학적으로 오해를 줄이는 방향으로 번역했습니다.
  doctrine_reference: 지혜문학의 경외 개념
