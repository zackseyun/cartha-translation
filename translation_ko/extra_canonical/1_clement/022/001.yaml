  naturalness: 본문 서술은 대체로 자연스럽지만, ‘그리스도 안에 있는 믿음’은 수식 범위가 다소 어색합니다. 또한 대상 본문이 현대 합쇼체이므로 인용문도 합쇼체로 통일하는 편이 등록에 맞습니다.
  terminology: ‘그리스도’, ‘성령’, ‘주님을 경외하다’는 이 문맥에서 적절하고 현대 한국어 기독교 문헌의 관용에도 부합합니다. ‘주를’보다 ‘주님을’이 현대 합쇼체 문맥에서 더 자연스럽습니다.
