  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πολλαὶ αἱ θλίψεις τοῦ δικαίου, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτὸν ὁ κύριος. 9. εἶτα· Πολλαὶ αἱ μάστιγες τοῦ ἁμαρτωλοῦ, τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον ἔλεος κυκλώσει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/008.yaml
  text: 'Many are the afflictions of the righteous[a], and from all of them the Lord will deliver him. Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”'
  footnotes:
  - marker: a
    text: 'Or ''Many are the afflictions of the righteous, and from all of them the Lord will deliver him.” Then: “Many are the blows of the sinner, but mercy will surround those who hope in the Lord.”''.'
    reason: previous_rendering
translation:
  language: ko
  text: '의로운 사람의 고난은 많지만, 그 모든 것에서 주님께서 그를 건지십니다. 그러고 나서: “죄인의 매질은 많지만, 주님께 소망을 두는 이들을 자비가 둘러쌀 것입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλαὶ αἱ θλίψεις
  english_pob_choice: Many are the afflictions
  chosen_korean: 고난은 많지만
  alternatives_korean:
  - 환난이 많지만
  - 괴로움이 많지만
  lexicon: θλῖψις
  rationale: θλῖψις는 단순한 어려움보다 압박과 고난의 의미가 강해, 한국어에서는 문맥상 자연스러운 ‘고난’으로 옮겼습니다.
- source_word: τοῦ δικαίου
  english_pob_choice: of the righteous
  chosen_korean: 의로운 사람의
  alternatives_korean:
  - 의인의
  - 의로운 이의
  lexicon: δίκαιος
  rationale: 직역형 ‘의인의’도 가능하지만, 문장 흐름을 살려 현대 한국어에서 덜 경직된 ‘의로운 사람의’로 옮겼습니다.
- source_word: ῥύσεται αὐτὸν ὁ κύριος
  english_pob_choice: the Lord will deliver him
  chosen_korean: 주님께서 그를 건지십니다
  alternatives_korean:
  - 주님께서 그를 구하십니다
  - 주님께서 그를 구원하십니다
  lexicon: ῥύομαι
  rationale: ῥύομαι는 단순 보존보다 ‘건져내다/구출하다’의 뉘앙스가 있어, 시편 문맥에 맞게 ‘건지십니다’를 택했습니다.
- source_word: τοὺς δὲ ἐλπίζοντας ἐπὶ κύριον
  english_pob_choice: those who hope in the Lord
  chosen_korean: 주님께 소망을 두는 이들
  alternatives_korean:
  - 주님을 바라는 이들
  - 주님께 기대는 이들
  lexicon: ἐλπίζω
  rationale: ἐλπίζω는 단순한 감정적 기대보다 신뢰의 방향성을 포함하므로, 시편적 표현인 ‘소망을 두는’으로 번역했습니다.
theological_decisions:
- issue: κύριος의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 주(主)
  - 주
  rationale: 이 본문은 시편 인용으로 야훼를 가리키지만, 1 Clement의 인용 문맥에서는 한국어 독자가 즉시 인식할 수 있는 ‘주님’을 본문에 두고, 야훼 표기는 별도 오타/인용 주석이 없으므로 여기서는 생략했습니다.
  doctrine_reference: 시편 인용의 주어 표기 관례
