lexical_decisions:
- source_word: ἔκκλινον
  english_pob_choice: Turn away
  chosen_korean: 돌아서고
  alternatives_korean:
  - 돌이키고
  - 멀어지고
  - 피하고
  lexicon: ἐκκλίνω
  rationale: 원문의 명령형은 단순 회피보다 방향을 바꾸어 악에서 벗어나는 동작을 나타내므로, 자연스러운 현대 한국어로 '돌아서고'를 택했습니다.
- source_word: ἀπὸ κακοῦ
  english_pob_choice: from evil
  chosen_korean: 악에서
  alternatives_korean:
  - 악으로부터
  - 악을 떠나
  - 악한 것에서
  lexicon: κακός
  rationale: 전치사 ἀπό의 분리 의미를 살려, '악에서'로 간결하게 원문의 분리·이탈을 드러냈습니다.
- source_word: ποίησον ἀγαθόν
  english_pob_choice: do good
  chosen_korean: 선을 행하십시오
  alternatives_korean:
  - 좋은 일을 하십시오
  - 선한 일을 하십시오
  - 선을 행하세요
  lexicon: ἀγαθός
  rationale: ἀγαθόν은 단순히 '좋은 것'이 아니라 윤리적 선을 가리키므로, 성경적 표현이면서도 현대어인 '선을 행하십시오'로 옮겼습니다.
theological_decisions:
- issue: 간결한 격언형 권면의 한국어 톤
  chosen_reading: 직설적 권면을 살리되, 문어체 공손 표현으로 마무리했습니다.
  alternative_readings:
  - '더 부드러운 권고체(예: ''돌아서고 선을 행하라'')'
  - '설명적 번역(예: ''악한 일을 버리고 선한 일을 하십시오'')'
  rationale: 본문은 짧은 윤리적 명령문이므로, 의미를 늘리지 않고도 현대 합쇼체로 권면의 힘을 유지하는 것이 적절합니다.
  doctrine_reference: 문맥상 일반 윤리 권면; 별도의 교리 쟁점 없음
