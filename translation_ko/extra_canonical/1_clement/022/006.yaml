- from: 주님의 눈은 의인들을 향하고, 그의 귀는 그들의 간구를 향합니다. 그러나 주님의 얼굴은 악을 행하는 자들을 향하여 있으며, 그들의 기억을 땅에서 없애 버리시려고 합니다.[a][b]
  to: 주님의 눈은 의인들을 향하고, 그분의 귀는 그들의 간구에 기울어져 있습니다. 그러나 주님의 얼굴은 악을 행하는 자들을 대적하며, 그들에 대한 기억을 땅에서 없애시려 합니다.
  rationale: 악행자들에 대한 주님의 얼굴이 단순히 그쪽을 향하는 것이 아니라 그들을 대적한다는 문맥상 의미를 명시했습니다. 간구와 기억의 한국어 표현도 원문의 의미 관계를 유지하면서 자연스럽고 명료하게 다듬었습니다. 원문에 본문 주석을 요구하는 이문이나 불확실성은 없으며, 초안의 [a][b]는 제공된 각주 내용이 없어 제거했습니다.
