id: 1CLEM.22.6
reference: 1 Clement 22:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους, καὶ ὦτα αὐτοῦ πρὸς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά, τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/022/006.yaml
  text: The eyes of the Lord are upon the righteous, and his ears are toward their petition; but the face of the Lord is against those who do evil, to wipe out their memory from the earth.
translation:
  language: ko
  text: 주님의 눈은 의인들을 향하고, 그분의 귀는 그들의 간구에 기울어져 있습니다. 그러나 주님의 얼굴은 악을 행하는 자들을 대적하며, 그들에 대한 기억을 땅에서 없애시려 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ δικαίους
  english_pob_choice: upon the righteous
  chosen_korean: 의인들을 향하고
  alternatives_korean:
  - 의인들 위에
  - 의인들에게
  - 의인들을 바라보고
  lexicon: δικαίος
  rationale: ἐπί + 대격의 방향성을 살려 단순한 위치보다 ‘향함’을 드러냈습니다. POB의 ‘upon’은 보호와 주목의 뉘앙스를 함께 가지므로 ‘향하고’가 자연스럽습니다.
- source_word: πρὸς δέησιν αὐτῶν
  english_pob_choice: toward their petition
  chosen_korean: 그들의 간구를 향합니다
  alternatives_korean:
  - 그들의 간구를 받으십니다
  - 그들의 기도 쪽으로 기울어 있습니다
  - 그들의 청원을 향합니다
  lexicon: δέησις
  rationale: δέησις는 단순한 요청보다 간절한 청원을 뜻하므로 ‘간구’를 택했습니다. πρὸς의 방향성은 ‘향합니다’로 옮겼습니다.
- source_word: πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά
  english_pob_choice: but the face of the Lord is against those who do evil
  chosen_korean: 그러나 주님의 얼굴은 악을 행하는 자들을 향하여 있으며
  alternatives_korean:
  - 그러나 주님의 얼굴은 악을 행하는 자들 위에 있습니다
  - 그러나 주님의 낯은 악을 행하는 자들을 대적하고 있으며
  - 그러나 주님의 얼굴은 악을 행하는 자들에게 있습니다
  lexicon: πρόσωπον
  rationale: πρόσωπον을 ‘얼굴’로 직역해 대조 구조를 유지했습니다. 앞절과 동일하게 ἐπί의 방향성을 ‘향하여 있으며’로 맞췄습니다.
- source_word: τοῦ ἐξολεθρεῦσαι ἐκ γῆς τὸ μνημόσυνον αὐτῶν
  english_pob_choice: to wipe out their memory from the earth
  chosen_korean: 그들의 기억을 땅에서 없애 버리시려고 합니다
  alternatives_korean:
  - 그들의 기억을 땅에서 지우시려고 합니다
  - 그들의 기념을 땅에서 멸하시려고 합니다
  - 그들의 명성을 땅에서 없애시려고 합니다
  lexicon: μνημόσυνον
  rationale: μνημόσυνον은 ‘기억/기념’의 폭이 있으나, 본문과 POB의 ‘memory’에 맞춰 ‘기억’으로 옮겼습니다. ἐξολεθρεύω는 완전한 제거를 가리켜 ‘없애 버리시다’로 강하게 반영했습니다.
theological_decisions:
- issue: ‘주님의 얼굴’의 인격적 심판 표상
  chosen_reading: 하나님께서 단지 멀리서 관찰하시는 것이 아니라, 얼굴을 ‘향하여’ 두시는 표현으로 의인과 악행자에 대한 상반된 관계를 분명히 살렸습니다.
  alternative_readings:
  - 주님의 낯은 ...
  - 주님의 시선은 ...
  rationale: 본문의 πρόσωπον과 ἐπί는 관계적·심판적 현존을 나타내므로, 심판의 강도를 약화시키지 않는 방식으로 유지했습니다.
  doctrine_reference: 시편적 심판 어법 / 하나님의 감찰과 공의
