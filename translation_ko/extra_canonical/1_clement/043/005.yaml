  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: πρωΐας δὲ γενομένης συνεκάλεσεν πάντα τὸν Ἰσραήλ, τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν, καὶ ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας, καὶ ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους· καὶ εὑρέθη ἡ ῥάβδος Ἀαρὼν οὐ μόνον βεβλαστηκυῖα, ἀλλὰ καὶ καρπὸν ἔχουσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/005.yaml
  text: Then when morning came, he called together all Israel, the six hundred thousand men, and showed the seals to the tribal leaders; and he opened the tent of witness and brought out the staffs. And the staff of Aaron was found not only to have sprouted, but even to be bearing fruit.
translation:
  language: ko
  text: 그런데 아침이 되자, 그는 온 이스라엘 곧 육십만 명의 남자들을 소집하고, 지파 지도자들에게 봉인들을 보여 주었으며, 증거의 장막을 열고 지팡이들을 꺼냈습니다. 그리고 아론의 지팡이는 싹이 텄을 뿐 아니라 열매까지 맺고 있는 것이 드러났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωΐας δὲ γενομένης
  english_pob_choice: Then when morning came
  chosen_korean: 그런데 아침이 되자
  alternatives_korean:
  - 아침이 되자
  - 이튿날 아침이 되어
  lexicon: πρωΐας / γίνομαι
  rationale: 서사 전환의 δέ를 살려 ‘그런데’로 자연스럽게 잇고, πρωΐας δὲ γενομένης는 시간 부사절로 풀어 ‘아침이 되자’라고 옮겼습니다.
- source_word: τὰς ἑξακοσίας χιλιάδας τῶν ἀνδρῶν
  english_pob_choice: the six hundred thousand men
  chosen_korean: 육십만 명의 남자들
  alternatives_korean:
  - 육십만 명의 남자들
  - 육백천 명의 남자들
  lexicon: ἑξακοσίας χιλιάδας / ἀνδρῶν
  rationale: 헬라어 수사구를 한국어 관용 수치로 옮겨 의미를 즉시 파악할 수 있게 했고, ἀνδρῶν은 문맥상 성인 남자를 가리켜 ‘남자들’로 반영했습니다.
- source_word: ἐπεδείξατο τοῖς φυλάρχοις τὰς σφραγῖδας
  english_pob_choice: showed the seals to the tribal leaders
  chosen_korean: 지파 지도자들에게 봉인들을 보여 주었으며
  alternatives_korean:
  - 지파 지도자들에게 봉인들을 보여 주었으며
  - 지파 지도자들에게 인장들을 보여 주었으며
  lexicon: σφραγίς / φυλάρχης
  rationale: σφραγῖδας는 문맥상 확인용 ‘봉인들’이 더 직접적이어서 이를 택했고, φυλάρχοις는 지파의 대표들을 뜻하므로 ‘지파 지도자들’로 옮겼습니다.
- source_word: ἤνοιξεν τὴν σκηνὴν τοῦ μαρτυρίου καὶ προεῖλεν τὰς ῥάβδους
  english_pob_choice: he opened the tent of witness and brought out the staffs
  chosen_korean: 증거의 장막을 열고 지팡이들을 꺼냈습니다
  alternatives_korean:
  - 증거의 장막을 열고 지팡이들을 꺼냈습니다
  - 증거의 장막을 열어 지팡이들을 가져냈습니다
  lexicon: σκηνὴ τοῦ μαρτυρίου / ῥάβδος
  rationale: τοῦ μαρτυρίου는 출애굽기적 표현을 따라 ‘증거의 장막’으로 유지했고, προεῖλεν은 단순히 꺼내는 동작이므로 ‘꺼냈습니다’로 자연스럽게 옮겼습니다.
- source_word: βεβλαστηκυῖα ... καρπὸν ἔχουσα
  english_pob_choice: not only to have sprouted, but even to be bearing fruit
  chosen_korean: 싹이 텄을 뿐 아니라 열매까지 맺고 있는
  alternatives_korean:
  - 싹이 텄을 뿐 아니라 열매까지 맺고 있는
  - 돋아났을 뿐 아니라 열매를 맺고 있는
  lexicon: βλαστάνω / καρπός
  rationale: 베풀어진 두 분사 표현의 누적을 살려 ‘싹이 텄을 뿐 아니라’와 ‘열매까지 맺고 있는’으로 단계적 기적을 드러냈습니다.
theological_decisions:
- issue: 아론의 지팡이의 기적 서술
  chosen_reading: 기적의 단계성을 그대로 살려, 싹이 틀 뿐 아니라 실제로 열매를 맺는 것으로 번역했습니다.
  alternative_readings:
  - 상징적으로만 이해되게 완화하는 번역
  - 단순히 ‘살아났다’ 수준으로 축소하는 번역
  rationale: 본문은 동사와 분사를 통해 생명의 징표가 점진적으로 드러남을 강조하므로, 이를 약화하지 않고 기적의 구체성을 보존했습니다.
  doctrine_reference: source_text_respect
- issue: ‘증거의 장막’ 표현 유지
  chosen_reading: 출애굽기 전승과 연결되는 ‘증거의 장막’을 그대로 사용했습니다.
  alternative_readings:
  - ‘성막’으로 일반화하는 번역
  - ‘증거 궤의 장막’ 등으로 확장하는 번역
  rationale: τοῦ μαρτυρίου는 이 전승의 고유한 명칭이므로, 일반화하기보다 원문이 지닌 성소-증언의 배경을 살렸습니다.
  doctrine_reference: intertextual_source_fidelity
