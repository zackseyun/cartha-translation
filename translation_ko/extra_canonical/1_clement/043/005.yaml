  terminology: ‘증거의 장막’, ‘지파 지도자들’, ‘아론’, ‘지팡이’는 적절합니다. σφραγῖδες에는 ‘봉인들’보다 물리적 표지 또는 도장을 가리킬 수 있는 ‘인장들’이 더 알맞습니다.
