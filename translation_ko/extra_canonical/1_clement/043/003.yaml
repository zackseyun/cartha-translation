- from: 그러나 그분은 제사장직을 둘러싸고 질투가 일어나고, 어느 지파가 그 영광스러운 이름으로 단장되었는지를 두고 지파들 사이에 분쟁이 벌어졌을 때, 열두 지파의 우두머리들에게 각 지파의 이름이 새겨진 지팡이를 그분께 가져오라고 명령하셨습니다. 그리고 그것들을 받아 묶고는 지파 우두머리들의 반지로 봉인한 뒤, 그것들을 증언의 장막 안에 있는 하나님의 식탁 위에 두었습니다.[a]
