id: 1CLEM.43.3
reference: 1 Clement 43:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐκεῖνος γάρ, ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης καὶ στασιαζουσῶν τῶν φυλῶν, ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη, ἐκέλευσεν τοὺς δώδεκα φυλάρχους προσενεγκεῖν αὐτῷ ῥάβδους ἐπιγεγραμμένας ἑκάστης φυλῆς κατ' ὄνομα· καὶ λαβὼν αὐτὰς ἔδησεν καὶ ἐσφράγισεν τοῖς δακτυλίοις τῶν φυλάρχων, καὶ ἀπέθετο αὐτὰς εἰς τὴν σκηνὴν τοῦ μαρτυρίου ἐπὶ τὴν τράπεζαν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/003.yaml
  text: For when jealousy arose concerning the priesthood and the tribes were engaged in factional strife over which of them was adorned with the glorious name[a], he ordered the twelve tribal leaders to bring him staffs, each inscribed according to the name of its tribe. And taking them, he bound them and sealed them with the rings of the tribal leaders, and placed them in the tent of witness upon the table of God.
  footnotes:
  - marker: a
    text: Or 'were in faction'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 제사장직을 두고 시기가 일어나고, 어느 지파가 영광스러운 이름으로 단장되었는지를 두고 지파들이 파당을 이루어 다투었을 때, 그가 열두 지파의 우두머리들에게 각 지파의 이름에 따라 새겨진 지팡이들을 자기에게 가져오라고 명령했기 때문입니다. 그리고 그것들을 받아 묶고 지파 우두머리들의 반지로 봉인한 뒤, 증언의 장막 안에 있는 하나님의 식탁 위에 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήλου ἐμπεσόντος περὶ τῆς ἱερωσύνης
  english_pob_choice: when jealousy arose concerning the priesthood
  chosen_korean: 제사장직을 둘러싸고 질투가 일어나고
  alternatives_korean:
  - 제사장직에 대해 질투가 일어나고
  - 제사장직을 두고 시기가 생기고
  lexicon: ζῆλος / ἱερωσύνη
  rationale: ζῆλος은 여기서 단순 감정보다 경쟁적 시기와 갈등을 가리키므로 ‘질투’로 옮기되, ἱερωσύνη는 직분 자체를 가리키는 ‘제사장직’으로 구체화했습니다.
- source_word: στασιαζουσῶν τῶν φυλῶν
  english_pob_choice: the tribes were engaged in factional strife
  chosen_korean: 지파들 사이에 분쟁이 벌어졌을 때
  alternatives_korean:
  - 지파들이 파당 싸움을 벌였을 때
  - 지파들이 분파를 이루어 다투었을 때
  lexicon: στασιάζω
  rationale: στασιάζω의 핵심은 단순한 의견 차이가 아니라 공적인 분쟁·소요이므로, POB의 수정된 영어처럼 ‘분쟁이 벌어지다’로 자연스럽게 살렸습니다.
- source_word: ὁποία αὐτῶν εἴη τῷ ἐνδόξῳ ὀνόματι κεκοσμημένη
  english_pob_choice: which of them was adorned with the glorious name
  chosen_korean: 어느 지파가 그 영광스러운 이름으로 단장되었는지를
  alternatives_korean:
  - 어느 지파가 그 영광스러운 이름을 지녔는지를
  - 어느 지파가 그 영광스러운 이름으로 장식되었는지를
  lexicon: κεκοσμημένη / ἐνδόξῳ ὀνόματι
  rationale: κεκοσμημένη는 ‘장식되다, 단장되다’의 수동 완료형이어서 ‘단장되다’로 옮겼고, ἐνδόξῳ는 이름의 명예성을 드러내는 ‘영광스러운’으로 유지했습니다.
- source_word: σκηνὴν τοῦ μαρτυρίου ... τράπεζαν τοῦ θεοῦ
  english_pob_choice: the tent of witness ... the table of God
  chosen_korean: 증언의 장막 안에 있는 하나님의 식탁 위에
  alternatives_korean:
  - 증언의 장막 안에 있는 하나님의 상 위에
  - 증거의 장막 안에 있는 하나님의 식탁 위에
  lexicon: σκηνὴ τοῦ μαρτυρίου / τράπεζα τοῦ θεοῦ
  rationale: POB의 ‘tent of witness’와 ‘table of God’를 직역하되, 한국어에서는 ‘장막 안에 있는 … 위에’로 장소 관계를 분명히 했습니다.
theological_decisions:
- issue: 역사적-제의적 서술에서의 인칭 지시
  chosen_reading: 본문의 ‘그분’은 앞선 문맥의 모세를 가리키는 것으로 이해되므로, 지나친 주석 없이 서술 흐름을 유지했습니다.
  alternative_readings:
  - 직접 이름을 반복해 ‘모세는’으로 옮김
  - 대명사를 유지해 ‘그는’으로 옮김
  rationale: 1클레멘트의 논증 흐름상 인물 지시가 명확하므로, 한국어에서도 문맥상 분명한 ‘그분’으로 처리해 연결성을 유지했습니다.
  doctrine_reference: 문맥적 지시 대명사 처리
- issue: ‘하나님의 식탁’ 표현 유지
  chosen_reading: 제의적 사물인 τράπεζα τοῦ θεοῦ를 전통적 제단 용어로 바꾸지 않고 ‘하나님의 식탁’으로 유지했습니다.
  alternative_readings:
  - ‘하나님의 상’으로 옮김
  - ‘하나님의 제단’으로 의역
  rationale: 영어 POB가 ‘table of God’를 유지한 이유를 반영하여, 본문의 구체적 사물상을 보존하고 해석을 과도하게 전치하지 않았습니다.
  doctrine_reference: 제의 용어의 서술적 보존
