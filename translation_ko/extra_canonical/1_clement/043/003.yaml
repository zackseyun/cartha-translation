  rationale: 문두를 ‘이는 … 때문입니다’로 고쳐 γάρ의 설명적 논리 관계를 복원했습니다. ‘지파들이 파당을 이루어 다투었을 때’로 στασιαζουσῶν의 능동성과 공적 파당 분쟁의 뉘앙스를 살렸습니다. 영어 감사 이력에만 필요한 [a] 표지는 제거했습니다. 그 밖에는 원문의 모호한 ‘영광스러운 이름’ 및 ‘하나님의 식탁’을 그대로 보존했습니다.
