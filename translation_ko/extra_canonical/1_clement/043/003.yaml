  source_fidelity: 수정이 필요합니다. 문두의 γάρ는 앞 진술의 근거나 설명을 잇는 접속사인데, 초안의 ‘그러나’는 역접으로 바꾸어 놓았습니다. 또한 στασιαζουσῶν의 능동적 파당적 다툼은 ‘지파들 사이에 분쟁이 벌어지다’보다 지파들이 실제로 다투었다고 표현하는 편이 가깝습니다. 나머지 제의 장소와 물건의 묘사는 원문에 충실합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 문어 서술로 자연스럽습니다. ‘이는 … 때문입니다’는 긴 원인절을 안정적으로 수용하며 γάρ의 논리적 기능도 드러냅니다.
  terminology: ‘제사장직’, ‘지파’, ‘지팡이’, ‘증언의 장막’, ‘하나님의 식탁’은 원문의 제의·부족 용어를 과도한 해석 없이 적절히 보존합니다. ‘인장 반지’처럼 원문에 없는 기능을 명시하지 않고 ‘반지’로 유지했습니다.
  issues:
