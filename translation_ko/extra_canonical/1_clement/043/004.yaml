id: 1CLEM.43.4
reference: 1 Clement 43:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ κλείσας τὴν σκηνὴν ἐσφράγισεν τὰς κλεῖδας ὡσαύτως καὶ τὰς ῥάβδους, καὶ εἶπεν αὐτοῖς· Ἄνδρες ἀδελφοί, ἧς ἂν φυλῆς ἡ ῥάβδος βλαστήσῃ, ταύτην ἐκλέλεκται ὁ θεὸς εἰς τὸ ἱερατεύειν καὶ λειτουργεῖν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/004.yaml
  text: And after shutting the tent[a], he sealed the staffs in the same way, and said to them, “Brothers, the tribe whose staff shall sprout—this one God has chosen to serve as priest and to minister to him.”
  footnotes:
  - marker: a
    text: Or 'Men, brothers'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 장막을 닫은 뒤, 그는 막대기들을 같은 방식으로 봉인하고 그들에게 말했습니다. “형제 여러분, 어느 지파의 막대기가 싹트든지, 그 지파를 하나님이 제사장 직분을 맡고 그분을 섬기도록 선택하신 것입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλείσας τὴν σκηνὴν
  english_pob_choice: after shutting the tent
  chosen_korean: 장막을 닫은 뒤
  alternatives_korean:
  - 장막을 닫고 나서
  - 장막을 닫은 후
  lexicon: σκηνή
  rationale: 문맥상 '장막'이 자연스럽고, 완료 분사 κλείσας는 앞선 동작을 나타내어 '닫은 뒤'로 간결하게 옮겼습니다.
- source_word: ἐσφράγισεν ... τὰς ῥάβδους
  english_pob_choice: he sealed the staffs
  chosen_korean: 막대기들을 같은 방식으로 봉인하고
  alternatives_korean:
  - 지팡이들을 같은 방식으로 봉인하고
  - 막대들을 같은 방식으로 봉인하고
  lexicon: ῥάβδος
  rationale: English POB의 최신 수정처럼 κλεῖδας를 ‘keys’로 따로 살리지 않고, 문맥상 봉인의 대상인 ῥάβδους를 중심으로 번역했습니다. ‘막대기’는 이 표지판적 지팡이/막대를 무난하게 살립니다.
- source_word: Ἄνδρες ἀδελφοί
  english_pob_choice: Brothers
  chosen_korean: 형제 여러분
  alternatives_korean:
  - 형제들이여
  - 남자 형제 여러분
  lexicon: ἄνδρες ἀδελφοί
  rationale: 직역하면 어색하므로, 친근하면서도 공적인 호칭인 ‘형제 여러분’으로 옮겨 원문의 존중 어린 부름을 살렸습니다.
- source_word: ἱερατεύειν καὶ λειτουργεῖν αὐτῷ
  english_pob_choice: to serve as priest and to minister to him
  chosen_korean: 제사장 직분을 맡고 그분을 섬기도록
  alternatives_korean:
  - 제사장으로 봉사하고 그분을 섬기도록
  - 제사장 직무를 수행하고 그분을 섬기도록
  lexicon: ἱερατεύω, λειτουργέω
  rationale: 두 동사는 단순 노동이 아니라 제의적 섬김을 가리키므로, ‘제사장 직분’과 ‘섬기다’로 구분해 기능을 드러냈습니다.
theological_decisions:
- issue: 선택의 표지와 하나님의 주권
  chosen_reading: 막대기의 싹틈을 하나님이 선택하심의 표지로 분명히 제시했습니다.
  alternative_readings:
  - 지팡이가 싹트는 자를 하나님이 택하셨다고 완화하여 표현
  rationale: 원문은 ‘어느 지파의 막대기가 싹트든지’가 곧 하나님의 선택의 결과라고 말하므로, 결과를 예언적 표지로 흐리지 않고 직접적으로 연결했습니다.
  doctrine_reference: 하나님의 주권적 선택
