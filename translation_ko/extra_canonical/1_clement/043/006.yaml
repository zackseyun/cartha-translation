  - severity: low
    issue: 호칭의 현대적 자연스러움
    rationale: ‘사랑하는 이들이여’도 이해 가능하지만, 수신자 전체를 부르는 현대 공적 문체에서는 ‘사랑하는 여러분’이 더 자연스럽습니다.
  - severity: low
