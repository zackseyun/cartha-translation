id: 1CLEM.43.6
reference: 1 Clement 43:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τί δοκεῖτε, ἀγαπητοί; οὐ προῄδει Μωϋσῆς τοῦτο μέλλειν ἔσεσθαι; μάλιστα ᾔδει· ἀλλ' ἵνα μὴ ἀκαταστασία γένηται ἐν τῷ Ἰσραήλ, οὕτως ἐποίησεν, εἰς τὸ δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/006.yaml
  text: What do you think, beloved? Did not Moses know beforehand that this was going to happen? Certainly he knew. But so that there might not be disorder in Israel, he acted in this way, so that the name of the true and only God might be glorified—to whom be the glory forever and ever. Amen.
translation:
  language: ko
  text: 사랑하는 여러분, 여러분은 어떻게 생각하십니까? 모세가 이것이 장차 일어날 것을 미리 알지 못했습니까? 물론 알고 있었습니다. 그러나 이스라엘에 무질서가 생기지 않도록, 그는 참되시고 유일하신 하나님의 이름이 영광을 받도록 그렇게 했습니다. 그분께 영광이 영원무궁토록 있습니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 이들이여
  alternatives_korean:
  - 사랑하는 여러분
  - 사랑하는 자들이여
  lexicon: ἀγαπητοί
  rationale: 청중을 직접 부르는 호칭으로서 문어체이면서도 현대 한국어에서 자연스러운 호칭을 택했습니다.
- source_word: προῄδει / ᾔδει
  english_pob_choice: know beforehand / Certainly he knew
  chosen_korean: 미리 알지 못했습니까? … 분명히 알고 있었습니다
  alternatives_korean:
  - 미리 알았던 것 아닙니까? … 확실히 알고 있었습니다
  - 예견하지 못했습니까? … 물론 알고 있었습니다
  lexicon: προοἶδα / οἶδα
  rationale: 두 동사의 대비를 살려 ‘미리 알다’와 ‘알고 있다’를 구분해, 단순 정보가 아니라 예지의 강조를 드러냈습니다.
- source_word: ἀκαταστασία
  english_pob_choice: disorder
  chosen_korean: 무질서
  alternatives_korean:
  - 혼란
  - 소란
  - 불안정
  lexicon: ἀκαταστασία
  rationale: 공동체 내부의 질서 붕괴를 가리키는 표현으로, 과도하게 감정적이거나 군사적인 뉘앙스보다 중립적인 ‘무질서’를 택했습니다.
- source_word: δοξασθῆναι τὸ ὄνομα τοῦ ἀληθινοῦ καὶ μόνου θεοῦ
  english_pob_choice: the name of the true and only God might be glorified
  chosen_korean: 참되고 유일하신 하나님의 이름이 영광을 받게 하려는 것이었습니다
  alternatives_korean:
  - 참되시며 홀로 유일하신 하나님의 이름이 영광을 받게 하려는 것이었습니다
  - 참되고 유일하신 하나님의 이름이 영화롭게 되게 하려는 것이었습니다
  lexicon: δοξάζω / ἀληθινός / μόνος θεός
  rationale: ‘이름’의 주어를 유지해 원문의 문법을 드러내고, ἀληθινός와 μόνος를 합쳐 ‘참되고 유일하신’으로 자연스럽게 옮겼습니다.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁하도록
  alternatives_korean:
  - 영원토록
  - 세세토록
  lexicon: αἰών
  rationale: 반복 구조를 한국어 관용으로 압축하되, 종결 문구의 지속성과 장엄함을 유지했습니다.
theological_decisions:
- issue: 모세의 행위 동기와 하나님의 이름 영광의 목적절 관계
  chosen_reading: 모세의 행위는 이스라엘의 무질서를 막기 위한 것이면서 동시에 참되고 유일하신 하나님의 이름이 영광을 받게 하려는 목적을 드러냅니다.
  alternative_readings:
  - 모세가 단지 정치적 질서를 위해 행했다는 읽기
  - 하나님의 이름 영화만을 단독 목적절로 읽는 방식
  rationale: ἵνα 절과 εἰς τὸ δοξασθῆναι 절을 함께 살려, 공동체 질서와 하나님의 영광이 분리되지 않은 본문의 논리를 반영했습니다.
  doctrine_reference: 섭리와 공동체 질서의 목적성
- issue: doxology의 종결 방식
  chosen_reading: ‘그분께 영광이 영원무궁하도록 있기를 빕니다’로 옮겨, 축복/송영의 직접성을 유지했습니다.
  alternative_readings:
  - ‘그분께 영광이 영원토록 있습니다’
  - ‘그분께 영광이 세세토록 있습니다’
  rationale: 원문의 ᾧ + ἡ δόξα는 선언적 송영으로 읽히며, 한국어에서는 바람/송영의 형식으로 자연스럽게 재현하는 것이 적절합니다.
  doctrine_reference: 송영(doxology)
