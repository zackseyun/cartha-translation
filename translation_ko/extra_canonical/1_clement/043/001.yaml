translation:
  language: ko
  text: 그리스도 안에서 하나님께로부터 그러한 일을 맡은 이들이 앞서 언급된 사람들을 세웠다면, 무엇이 놀랍겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί θαυμαστόν
  english_pob_choice: what is remarkable
  chosen_korean: 무엇이 놀랍겠습니까
  alternatives_korean:
  - 무엇이 놀랍습니까
  - 무엇이 이상하겠습니까
  lexicon: θαυμαστόν
  rationale: 수사적 반문으로서 ‘놀랍다’를 택해 감탄과 반문을 함께 살렸습니다.
- source_word: οἱ ἐν Χριστῷ πιστευθέντες
  english_pob_choice: those entrusted in Messiah
  chosen_korean: 하나님께서 메시아 안에서 그런 일에 맡기신 이들
  alternatives_korean:
  - 메시아 안에서 믿어진 이들
  - 메시아 안에서 신임받은 이들
  lexicon: πιστεύω (passive participle)
  rationale: 피동 분사 πιστευθέντες는 ‘믿다’보다 ‘맡기다/신임하다’의 수동 의미가 문맥에 더 맞아, POB의 audit trail에 따라 ‘맡기신 이들’로 옮겼습니다.
- source_word: ἔργον τοιοῦτο
  english_pob_choice: such a work
  chosen_korean: 그런 일
  alternatives_korean:
  - 그와 같은 일
  - 그런 사역
  lexicon: ἔργον
  rationale: 여기서는 특정 직무보다 문맥상 ‘일/과업’이 자연스러워, 과도한 교회적 용어인 ‘사역’을 피했습니다.
- source_word: τοὺς προειρημένους
  english_pob_choice: the aforementioned persons
  chosen_korean: 앞서 언급된 사람들
  alternatives_korean:
  - 앞서 말한 이들
  - 이미 언급된 이들
  lexicon: προείρω
  rationale: 전거 지시를 분명히 드러내는 중립적 표현으로 처리했습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 본 프로젝트 기본 용례에 따라 титular Χριστός는 ‘메시아’로 옮겨, 본문이 주는 직함적 의미를 유지했습니다.
  doctrine_reference: Project glossary default for Χριστός (titular)
