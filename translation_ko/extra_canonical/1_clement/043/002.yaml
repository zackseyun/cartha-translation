revisions:
- from: 그곳에서 또한 복되며 신실한 종 모세는 자기 집 전체에서 자기에게 명령된 모든 것을 거룩한 책들에 기록하였고, 그 뒤의 다른 예언자들도 그를 따르며 그를 통해 제정된 규례들을 증언하였습니다.[a]
  to: 거기에서도 복되고 신실한 종 모세는 온 집안에서 자기에게 명령된 모든 것을 거룩한 책들에 기록하였고, 나머지 예언자들도 그를 따라 그가 제정한 율례들을 증언하였습니다.
  rationale: 모세를 율례 제정의 직접 주체로 분명히 하고, οἶκος의 포괄적 의미를 ‘온 집안’으로 옮겼습니다. 원문에 근거가 불분명하고 대응 각주도 없는 [a] 표지는 삭제했습니다. συνεπιμαρτυροῦντες는 율례들을 증언한다는 관계를 유지하되, 논쟁적인 공동 증언의 뉘앙스를 덧붙이지 않았습니다.
