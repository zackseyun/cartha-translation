source:
  edition: Funk 1901 (normalized OCR)
  text: ὅπου καὶ ὁ μακάριος πιστὸς θεράπων ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς τὰ διατεταγμένα αὐτῷ πάντα ἐσημειώσατο ἐν ταῖς ἱεραῖς βίβλοις, ᾧ καὶ ἐπηκολούθησαν οἱ λοιποὶ προφῆται, συνεπιμαρτυροῦντες τοῖς ὑπ' αὐτοῦ νενομοθετημένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/043/002.yaml
  text: For there also the blessed and faithful servant Moses[a], in all his house, recorded in the sacred books all the things commanded to him, and the rest of the prophets also followed him, bearing witness together to the ordinances enacted by him.
  footnotes:
  - marker: a
    text: Or 'bearing witness together with the ordinances laid down by him'.
    reason: previous_rendering
translation:
  language: ko
  text: 거기에서도 복되고 신실한 종 모세는 온 집안에서 자기에게 명령된 모든 것을 거룩한 책들에 기록하였고, 나머지 예언자들도 그를 따라 그가 제정한 율례들을 증언하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεράπων
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 섬기는 이
  - 종사자
  - 시종
  lexicon: θεράπων
  rationale: 하나님 집 안에서 모세의 지위를 드러내는 표현으로, 공손하지만 신분성을 분명히 하는 ‘종’이 문맥에 가장 맞습니다.
- source_word: ἐν ὅλῳ τῷ οἴκῳ Μωϋσῆς
  english_pob_choice: in all his house
  chosen_korean: 자기 집 전체에서
  alternatives_korean:
  - 그의 온 집안에서
  - 그의 온 집에서
  - 모세의 집 전체에서
  lexicon: οἶκος
  rationale: 직역적이되 한국어로 자연스럽게, ‘집’이 단지 건물이 아니라 모세에게 속한 전체 영역을 가리킨다는 점을 살렸습니다.
- source_word: τὰ διατεταγμένα αὐτῷ πάντα
  english_pob_choice: all the things commanded to him
  chosen_korean: 자기에게 명령된 모든 것
  alternatives_korean:
  - 그에게 명령된 모든 것
  - 그에게 맡겨진 모든 것
  - 그에게 지시된 모든 것
  lexicon: διατάσσω
  rationale: 명령의 수동형을 그대로 살려, 모세가 받은 지시가 하나하나 기록되었음을 드러냈습니다.
- source_word: συνεπιμαρτυροῦντες τοῖς ὑπ' αὐτοῦ νενομοθετημένοις
  english_pob_choice: bearing witness to the ordinances enacted by him
  chosen_korean: 그를 통해 제정된 규례들을 증언하였습니다
  alternatives_korean:
  - 그가 제정한 규례들을 증언하였습니다
  - 그가 세운 규례들을 함께 증언하였습니다
  - 그가 제정한 율례들을 증언하였습니다
  lexicon: συνεπιμαρτυρέω / νομοθετέω
  rationale: 최근 수정처럼 ‘함께 증언’의 대상이 아니라 ‘규례들’에 대한 증언이므로, 동사의 방향을 살려 ‘증언하다’로 옮기고 제정 주체를 ‘그를 통해’로 표현했습니다.
theological_decisions:
- issue: 모세의 권위와 예언자들의 증언 관계
  chosen_reading: 예언자들은 모세와 함께 증언하는 것이 아니라, 모세를 통해 제정된 규례들을 증언하는 것으로 옮겼습니다.
  alternative_readings:
  - 예언자들이 모세와 함께 증언했다
  - 예언자들이 모세의 규례를 공동으로 증언했다
  rationale: 본문의 문법과 수정 이력에 따라, 예언자들의 증언 대상은 모세가 세운 규례들이며 공동 증언의 주체는 아닙니다.
  doctrine_reference: 성경 내부의 계시 연속성과 율례의 증언 관계
