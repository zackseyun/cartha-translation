  source_fidelity: ‘그를 통해 제정된’은 ὑπ᾽ αὐτοῦ(‘그에 의해’)의 행위 주체를 매개 표현으로 바꾸므로, 모세가 직접 제정한 것으로 고쳐야 합니다. 또한 본문의 οἶκος는 단순한 건물보다 공동체/집안을 뜻할 수 있으므로 ‘집 전체’보다 ‘온 집안’이 자연스럽습니다.
  naturalness: ‘그곳에서 또한’은 한국어에서 다소 어색하므로, 문맥 지시를 유지하면서 ‘거기에서도’로 옮겼습니다. ‘자기 집’은 지시 대상이 불필요하게 모호하므로 피했습니다.
  terminology: θεράπων은 문맥상 ‘종’으로 유지할 수 있습니다. νενομοθετημένοις는 ‘제정한 율례들’로 옮겨 νομοθετέω의 법 제정 의미와 모세의 주체성을 보존했습니다.
