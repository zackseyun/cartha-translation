  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/002.yaml
  text: And all of you were humble-minded[a], boasting in nothing, submitting rather than demanding submission, taking more pleasure in giving than in receiving; content with the provisions of Messiah, and paying close attention to his words, you had embraced them carefully in your inward parts, and his sufferings were before your eyes. Thus deep and rich peace was given to all, and an insatiable longing for doing good, and a full outpouring of the Holy Spirit came upon all. And being full of holy purpose, in good eagerness and with devout confidence you stretched out your hands to God the Almighty, begging him to become merciful, if in anything you had sinned unwillingly. Day and night your concern was for the whole brotherhood, so that the number of his chosen ones might be saved with mercy and conscience. You were sincere and guileless and free from resentment toward one another. Every sedition and every schism was detestable to you. You mourned over the trespasses of your neighbors;
    you judged their shortcomings to be your own. Doing good, ready for every good work, adorned with a venerable way of life, you carried everything through in his fear[d][c][b]; the commandments and the righteous requirements of the Lord had been written on the tablets of your hearts.
  footnotes:
  - marker: a
    text: Or 'had taken them to heart.' The Greek speaks more bodily and vividly of embracing the Lord's words in the inward parts.
    reason: lexical_alternative
  - marker: b
    text: '''Brotherhood'' renders a masculine collective term for the community of believers.'
    reason: lexical_alternative
  - marker: c
    text: '''Schism'' is an ecclesial term here, stronger than a mere disagreement or ordinary division.'
    reason: lexical_alternative
  - marker: d
    text: The phrase 'on the broad places of your hearts' is a vivid Greek expression, likely echoing scriptural language about God's commands being inscribed inwardly.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 여러분 모두는 겸손한 마음을 지니고, 아무것도 자랑하지 않으며, 요구하기보다 순종하고, 받기보다 주는 것을 더 기뻐하셨습니다. 메시아의 공급에 만족하며 그의 말씀에 주의를 기울여, 여러분은 그것을 속사람에 깊이 품었고 그의 고난이 여러분의 눈앞에 있었습니다. 그리하여 모든 사람에게 깊고 풍성한 평강이 주어졌고, 선을 행하려는 채워질 줄 모르는 갈망과 성령의 충만한 부어 주심이 모든 사람 위에 임했습니다. 또 거룩한 뜻으로 가득 차서, 경건한 확신과 선한 열심으로 여러분은 전능하신 하나님께 손을 펼쳐, 무의식중에라도 어떤 죄를 지었다면 그분이 자비로우시게 해 달라고 간구하셨습니다. 낮과 밤 여러분의 관심은 온 형제 공동체를 향해 있었으니, 그분의 택하신 자들의 수가 자비와 양심과 함께 구원을 받게 하려는 것이었습니다. 여러분은 서로에게 진실하고 흠잡을 데 없으며 원한을 품지 않았습니다. 모든 분열과 모든 분파는 여러분에게 혐오스러운 것이었습니다. 여러분은 이웃의 잘못들 때문에 슬퍼하고, 그들의 부족함을 자기 자신의 것으로 여기셨습니다. 선을 행하는 사람으로서, 모든 선한 일에 준비되어 있고, 존귀한 삶의 방식으로 단장한 채, 여러분은 그의 두려움 안에서 모든 일을 이루어 갔습니다. 주님의 명령과 의로운 요구는 여러분의 마음의 널찍한 판 위에 새겨져 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταπεινοφρονεῖτε
  english_pob_choice: were humble-minded
  chosen_korean: 겸손한 마음을 지니고
  alternatives_korean:
  - 겸손했습니다
  - 겸손한 생각을 하셨습니다
  lexicon: LSJ
  rationale: 지속적 성품을 나타내는 뉘앙스를 살리되, 한국어에서 자연스럽게 읽히도록 상태 표현으로 옮겼습니다.
- source_word: ἀλαζονευόμενοι
  english_pob_choice: boasting in nothing
  chosen_korean: 아무것도 자랑하지 않으며
  alternatives_korean:
  - 교만하지 않으며
  - 허세를 부리지 않으며
  lexicon: LSJ
  rationale: 자기 과시와 허세의 금지를 분명히 드러내기 위해 직접적으로 옮겼습니다.
- source_word: τοῦ Χριστοῦ
  english_pob_choice: of Messiah
  chosen_korean: 메시아의
  alternatives_korean:
  - 그리스도의
  lexicon: BDAG
  rationale: 프로젝트 기본 용례에 따라 титул로 기능하는 Χριστός는 메시아로 옮겼습니다.
- source_word: ἐνεστερνισμένοι ... τοῖς σπλάγχνοις
  english_pob_choice: had embraced them carefully in your inward parts
  chosen_korean: 속사람에 깊이 품었고
  alternatives_korean:
  - 마음에 새겼고
  - 심장 깊이 받아들였고
  lexicon: LSJ
  rationale: σπλάγχνα의 신체적·정서적 강도를 살리면서도 한국어에서 지나치게 해부학적으로 들리지 않게 조정했습니다.
- source_word: πλήρης πνεύματος ἁγίου ἐπέχυσις
  english_pob_choice: a full outpouring of the Holy Spirit
  chosen_korean: 성령의 충만한 부어 주심
  alternatives_korean:
  - 성령의 완전한 부으심
  - 성령의 풍성한 부어 주심
  lexicon: BDAG
  rationale: 명사구의 압축된 구조를 한국어로 풀어내면서도 ‘부어 주심’의 이미지와 ‘성령’의 명시성을 유지했습니다.
- source_word: ἀμνησίκακοι
  english_pob_choice: free from resentment
  chosen_korean: 원한을 품지 않았습니다
  alternatives_korean:
  - 앙심을 품지 않았습니다
  - 서운함을 오래 간직하지 않았습니다
  lexicon: LSJ
  rationale: 관계적 윤리의 핵심인 원한의 부재를 가장 분명하게 드러내는 표현을 택했습니다.
- source_word: στάσις ... σχίσμα
  english_pob_choice: sedition ... schism
  chosen_korean: 분열 ... 분파
  alternatives_korean:
  - 소요 ... 분열
  - 파당 ... 분열
  lexicon: BDAG
  rationale: 교회 공동체 내부의 파괴적 긴장을 나타내되, 한국어 독자에게도 이해되는 강한 표현으로 옮겼습니다.
- source_word: ἐπὶ τὰ πλάτη τῆς καρδίας
  english_pob_choice: the broad places of your hearts
  chosen_korean: 마음의 널찍한 판 위에
  alternatives_korean:
  - 마음의 넓은 곳에
  - 마음의 판 위에
  lexicon: LSJ
  rationale: 직역의 생경함을 조금 완화하면서도 ‘넓은 곳/판 위’라는 비유의 핵심을 보존했습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 본문은 직함으로 Χριστός를 사용하므로, 한국어에서도 호칭 의미를 살려 메시아로 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 성령의 표기
  chosen_reading: 성령
  alternative_readings:
  - 영
  rationale: πνεύματος ἁγίου는 명시적으로 성령을 가리키므로, 하나님의 영의 작용을 분명히 드러내기 위해 성령으로 옮겼습니다.
  doctrine_reference: 'Project glossary: πνεῦμα (divine) → 성령 when explicit'
