base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/065.yaml
  text: Now send back to us quickly[a], in peace and with joy, the men sent from us—Claudius Ephebus and Valerius Bito, together with Fortunatus—so that they may report to us all the sooner the peace and concord we have prayed for and desired[c][b], that we too may speedily rejoice in your good order.
  footnotes:
  - marker: a
    text: The Greek text provided for this chapter breaks off after 'and' (καὶ). The closing phrase in English is a conservative completion of the evident sense of the purpose clause.
    reason: textual_variant
  - marker: b
    text: '''Peace and concord'' reflects the reconciliation theme of the letter and likely stands behind the truncated ending here.'
    reason: alternative_reading
  - marker: c
    text: Or 'so that they may report to us all the sooner the peace and concord for which we have prayed earnestly.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리에게서 보낸 클라우디오스 에페부스와 발레리오스 비톤, 그리고 포르투나토스를 함께, 평안과 기쁨 가운데 속히 우리에게 돌려보내십시오. 그리하여 그들이 우리가 기도하며 바랐던 평화와 일치를 우리에게 더 빨리 전해 주어, 우리도 여러분의 좋은 질서를 보고 속히 기뻐할 수 있게 하십시오.[a][b]
  philosophy: optimal-equivalence
