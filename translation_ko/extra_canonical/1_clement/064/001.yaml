    rationale: εὐαρέστησιν τῷ ὀνόματι αὐτοῦ를 옮긴 표현이나, 한국어 문법상 ‘이름에 기쁘시게’는 성립하지 않습니다. 원문의 목적 관계를 살려 ‘그분의 이름을 기쁘시게 하도록’으로 고쳐야 합니다.
