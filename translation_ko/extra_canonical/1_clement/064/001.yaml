source:
  edition: Funk 1901 (normalized OCR)
  text: Λοιπὸν ὁ παντεπόπτης θεὸς καὶ δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός, ὁ ἐκλεξάμενος τὸν κύριον Ἰησοῦν Χριστὸν καὶ ἡμᾶς διʼ αὐτοῦ εἰς λαὸν περιούσιον, δῴη πάσῃ ψυχῇ ἐπικεκλημένῃ τὸ μεγαλοπρεπὲς καὶ ἅγιον ὄνομα αὐτοῦ πίστιν, φόβον, εἰρήνην, ὑπομονὴν καὶ μακροθυμίαν, ἐγκράτειαν, ἁγνείαν καὶ σωφροσύνην, εἰς εὐαρέστησιν τῷ ὀνόματι αὐτοῦ διὰ τοῦ ἀρχιερέως καὶ προστάτου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ αὐτῷ δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή, καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/064/001.yaml
  text: Finally, may the all-seeing God and Master of spirits and Lord of all flesh, who chose the Lord Jesus Messiah and us through him to be a people for his own possession, grant to every soul that has been called by his magnificent and holy name faith, fear, peace, endurance and longsuffering, self-control, purity, and sound judgment, so as to be pleasing to his name through our high priest and protector Jesus Messiah, through whom be glory and majesty to him, might and honor, both now and through all the ages of ages. Amen.
translation:
  language: ko
  text: 마침내, 모든 것을 살피시는 하나님과 영들의 주인, 온갖 육체의 주인이시며, 주 예수 메시아와 우리를 그를 통하여 자기의 소유된 백성이 되도록 택하신 분께서, 그의 위대하고 거룩한 이름으로 부름받은 모든 영혼에게 믿음과 두려움, 평강과 인내와 오래 참음, 절제와 순결과 건전한 분별을 주셔서, 우리 대제사장과 보호자이신 예수 메시아를 통하여 그의 이름에 기쁘시게 되게 하시기를 빕니다. 그를 통하여 하나님께 영광과 위엄과 권세와 존귀가 이제와 영원무궁한 세대들에까지 있기를 빕니다. 아멘.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντεπόπτης θεός
  english_pob_choice: the all-seeing God
  chosen_korean: 모든 것을 살피시는 하나님
  alternatives_korean:
  - 모든 것을 보는 하나님
  - 만물을 두루 살피시는 하나님
  lexicon: παντεπόπτης
  rationale: παντεπόπτης의 ‘전부를 살피는/감찰하는’ 뜻을 살려, 단순 시각보다 포괄적 감찰을 드러내는 표현으로 옮겼습니다.
- source_word: δεσπότης τῶν πνευμάτων καὶ κύριος πάσης σαρκός
  english_pob_choice: Master of spirits and Lord of all flesh
  chosen_korean: 영들의 주인, 온갖 육체의 주인
  alternatives_korean:
  - 영들의 주재자, 모든 육체의 주
  - 영들의 통치자, 모든 육신의 주인
  lexicon: δεσπότης / πνεύματα / σάρξ
  rationale: δεσπότης는 ‘주인/주재자’의 소유·통치 뉘앙스를 함께 가지므로, 이어지는 ‘모든 육체의 주인’과 평행을 이루는 ‘주인’으로 처리했습니다.
- source_word: λαὸν περιούσιον
  english_pob_choice: a people for his own possession
  chosen_korean: 자기의 소유된 백성이 되도록
  alternatives_korean:
  - 자기의 특별한 소유 백성이 되도록
  - 자기에게 속한 백성이 되도록
  lexicon: περιούσιος
  rationale: 출애굽기적 언어를 반영해 ‘소유된’으로 옮겨, 단순 소유권 이상으로 하나님께 속한 언약 백성의 의미를 살렸습니다.
- source_word: ἀρχιερέως καὶ προστάτου
  english_pob_choice: our high priest and protector
  chosen_korean: 우리 대제사장과 보호자
  alternatives_korean:
  - 우리 대제사장과 후원자
  - 우리 대제사장과 인도자
  lexicon: ἀρχιερεύς / προστάτης
  rationale: ἀρχιερεύς는 제의적 직함이므로 ‘대제사장’으로, προστάτης는 후원자보다 보호·변호의 기능이 더 직접적이어서 ‘보호자’로 옮겼습니다.
- source_word: δόξα καὶ μεγαλωσύνη, κράτος καὶ τιμή
  english_pob_choice: glory and majesty, might and honor
  chosen_korean: 영광과 위엄과 권세와 존귀
  alternatives_korean:
  - 영광과 위엄과 능력과 존귀
  - 영광과 존엄과 권세와 명예
  lexicon: δόξα / μεγαλωσύνη / κράτος / τιμή
  rationale: 네 명사의 병렬 구조를 유지하면서, κράτος를 단순 ‘능력’보다 통치적 힘을 드러내는 ‘권세’로, τιμή를 ‘존귀’로 옮겼습니다.
theological_decisions:
- issue: “주 예수 메시아”와 “우리 대제사장과 보호자”의 직함 유지
  chosen_reading: 예수의 메시아성, 중보적 대제사장 직분, 보호자 직함을 모두 살려 직함을 분리해 번역했습니다.
  alternative_readings:
  - 예수 그리스도
  - 우리의 큰 제사장과 대변자
  rationale: 본문은 예수의 칭호를 한 덩어리로 섞지 않고 각각 기능적으로 배치하므로, 메시아·대제사장·보호자의 구분을 보존하는 것이 원문 의미에 더 가깝습니다.
  doctrine_reference: 그리스도의 직분 이해(왕-제사장-중보)
