  source_fidelity: 핵심 권면의 병렬 구조와 의미는 대체로 충실합니다. 그러나 ἐπιχορηγείτω는 앞선 ἐπιμελείσθω와 달리 가난한 이의 필요를 ‘제공/공급하다’라는 뜻이므로 둘 다 ‘돌보다’로 옮기면 어휘적 대조가 약화됩니다. 또한 ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα는 가난한 이에게 주어진 ‘한 사람/이’를 통하여 그의 결핍이 채워진다는 관계를 더 분명히 표현할 필요가 있습니다. 마지막의 ἕτερος는 문맥상 하나님을 가리킬 가능성이 높지만 본문 자체는 ‘다른 이’라고만 하므로 그대로 유지했습니다.
  naturalness: 현대 표준어 합쇼체로 전반적으로 읽히지만, ‘자기의 부족함을 채워 줄 한 사람을 그에게’는 지시 관계가 다소 어색하며, ‘자기 절제를 공급하시는 분은 다른 이’는 존대 표현과 ‘다른 이’의 결합이 부자연스럽습니다. 이를 자연스러운 문장으로 다듬었습니다.
  terminology: ‘존중하십시오’, ‘선한 일’, ‘증언’, ‘자기 절제’는 적절합니다. ‘마음이 겸손한 이’는 ταπεινοφρονῶν의 뜻을 자연스럽게 반영합니다. ‘필요한 것을 제공하십시오’는 ἐπιχορηγείτω의 물질적·실질적 지원의 뉘앙스를 보존합니다.
