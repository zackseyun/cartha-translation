id: 1CLEM.38.2
reference: 1 Clement 38:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ ἰσχυρὸς ἐπιμελείσϑω τὸν ἀσϑενῆ, ὁ δὲ ἀσϑενὴς ἐντρεπέσϑω τὸν ἰσχυρόν· ὁ πλούσιος ἐπιχορηγείτω τῷ πτωχῷ, ὁ δὲ πτωχὸς εὐχαριστείτω τῷ ϑεῷ, ὅτι ἔδωκεν αὐτῷ, ᾧ οὐ ἀναπληρωθῇ αὐτοῦ τὸ ὑστέρημα· ὁ σοφὸς ἐνδεικνύσθω τὴν σοφίαν αὐτοῦ μὴ ἐν λόγοις, ἀλλʼ ἐν ἔργοις ἀγαθοῖς· ὁ ταπεινοφρονῶν μὴ ἑαυτῷ μαρτυρείτω, ἀλλʼ ἔατω ὑφʼ ἑτέρου ἑαυτὸν μαρτυρεῖσθαι· ὁ ἁγνὸς ἐν τῇ σαρκὶ μὴ ἀλαζονευέσθω, γινώσκων, ὅτι ἕτερός ἐστιν ὁ ἐπιχορηγῶν αὐτῷ τὴν ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/002.yaml
  text: Let the strong care for the weak[a], and let the weak respect the strong. Let the rich provide for the poor, and let the poor give thanks to God, because he has given him one through whom his need may be supplied. Let the wise show his wisdom not in words, but in good works. Let the humble-minded not testify concerning himself, but let him allow himself to be testified to by another. Let the one who is pure in the flesh not boast[b], knowing that it is another who supplies him with self-control.
  footnotes:
  - marker: a
    text: Or 'but let him allow himself to be borne witness to by another'.
    reason: previous_rendering
  - marker: b
    text: Or 'supplies him self-control'.
    reason: previous_rendering
translation:
  language: ko
  text: 강한 이는 약한 이를 돌보십시오[a]. 그리고 약한 이는 강한 이를 존중하십시오. 부자는 가난한 이를 돌보십시오. 그리고 가난한 이는 하나님께 감사하십시오. 하나님께서 자기의 부족함을 채워 줄 한 사람을 그에게 주셨기 때문입니다. 지혜로운 이는 말로가 아니라 선한 일로 자기의 지혜를 나타내십시오. 겸손한 마음을 지닌 이는 자기 자신에 대해 증언하지 말고, 다른 이가 그에 대해 증언하도록 하십시오. 육체적으로 순결한 이는 자랑하지 마십시오[b]. 자기 절제를 공급하시는 분은 다른 이라는 것을 알고 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμελείσϑω / ἐπιχορηγείτω
  english_pob_choice: care for / provide for
  chosen_korean: 돌보십시오
  alternatives_korean:
  - 살피십시오
  - 보살피십시오
  - 공급하십시오
  lexicon: ἐπιμελέομαι / ἐπιχορηγέω
  rationale: 두 동사는 모두 책임 있게 돌보고 필요한 것을 채워 주는 뉘앙스를 가지므로, 한국어에서는 자연스럽게 ‘돌보다’로 묶어 전달하되, 뒤의 ἐπιχορηγείτω는 ‘제공하다’보다 맥락상 ‘돌보다’로도 포괄될 수 있어 문맥을 유지했습니다.
- source_word: ἐντρεπέσϑω
  english_pob_choice: respect
  chosen_korean: 존중하십시오
  alternatives_korean:
  - 부끄러워하십시오
  - 경외하십시오
  - 예를 갖추십시오
  lexicon: ἐντρέπομαι
  rationale: 수동형이지만 여기서는 ‘부끄럽게 여기다’보다는 강한 이를 향한 적절한 존중의 태도를 요구하므로, 직역보다 의미상에 가까운 ‘존중하다’를 택했습니다.
- source_word: ὑστέρημα
  english_pob_choice: need may be supplied
  chosen_korean: 부족함
  alternatives_korean:
  - 결핍
  - 모자람
  - 부족한 것
  lexicon: ὑστέρημα
  rationale: 문맥상 가난한 이의 결핍을 가리키므로, 추상적이면서도 자연스러운 ‘부족함’으로 옮겨 그가 채움이 필요하다는 점을 드러냈습니다.
- source_word: μαρτυρείτω / μαρτυρεῖσθαι
  english_pob_choice: testify concerning himself / be testified to by another
  chosen_korean: 자기 자신에 대해 증언하지 말고, 다른 이가 그에 대해 증언하도록 하십시오
  alternatives_korean:
  - 자기 자신을 증언하지 말고, 다른 이가 증언하게 하십시오
  - 스스로를 드러내지 말고, 다른 이의 증언을 받으십시오
  lexicon: μαρτυρέω
  rationale: 같은 어근의 능동/수동 대비를 한국어에서도 유지해, 자기증언과 타인의 증언을 대조하는 원문의 수사적 구조를 살렸습니다.
- source_word: ἀλαζονευέσθω
  english_pob_choice: not boast
  chosen_korean: 자랑하지 마십시오
  alternatives_korean:
  - 허세 부리지 마십시오
  - 과장하지 마십시오
  - 뽐내지 마십시오
  lexicon: ἀλαζονεύομαι
  rationale: 문맥상 순결을 자랑의 근거로 삼지 말라는 뜻이므로, 현대 한국어에서 가장 직접적이고 널리 이해되는 ‘자랑하다’로 옮겼습니다.
- source_word: ἐγκράτειαν
  english_pob_choice: self-control
  chosen_korean: 자기 절제
  alternatives_korean:
  - 절제
  - 자제
  - 자기 통제
  lexicon: ἐγκράτεια
  rationale: 개인의 욕망과 행위를 다스리는 덕목을 나타내므로, ‘자기 절제’로 옮겨 도덕적·내적 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘자랑하지 마십시오’의 근거가 되는 주체성의 전환
  chosen_reading: 순결한 이는 자신의 순결을 자랑의 근거로 삼지 말아야 하며, 절제는 다른 이—곧 하나님—에게서 주어집니다.
  alternative_readings:
  - 단순히 인간 사회 안의 다른 사람에게서 절제를 받는다는 읽기
  - 문장 끝의 ἕτερός ἐστιν을 일반적인 ‘다른 사람’으로만 이해하는 읽기
  rationale: 문맥상 절제의 공급자는 궁극적으로 하나님으로 이해하는 것이 자연스럽지만, 그 문장은 직접적으로 하나님을 명시하지 않으므로 ‘다른 이’라는 원문 긴장을 살려 두었습니다.
  doctrine_reference: 은혜에 의한 덕의 공급, 겸손과 자기 자랑의 금지
