revisions:
- from: 그러므로 우리의 온몸이 메시아 예수 안에서 보존되도록 하며, 각 사람은 자기 이웃에게 복종하게 하십시오 — 자기에게 맡겨진 은사 안에서 정해진 바와 같이.[a][b]
  to: 그러므로 우리의 온몸이 메시아 예수 안에서 보존되게 하십시오.[a] 각 사람은 자기 은사 안에서 정해진 바에 따라 자기 이웃에게 복종하십시오.[b]
  rationale: ‘맡겨진’을 삭제하여 ἐτέθη의 ‘정해지다/배정되다’라는 수동 표현을 보존했고, 마지막 구절을 ‘은사 안에서 정해진 바에 따라’로 옮겨 그리스어의 관계를 명확히 했습니다. 또한 합쇼체 권면 문장으로 매끄럽게 다듬고, 기존 앵커에 대응하는 한국어 각주를 제공했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly follows the emended reading σωζέσθω, ‘be preserved/saved,’ rather than the normalized-OCR corruption. However, ‘자기에게 맡겨진’ adds the idea of entrustment, whereas ἐτέθη means ‘was placed/appointed,’ and the final clause should more directly qualify each person's submission in accordance with his or her placement in a gift.
  naturalness: The draft’s paired constructions ‘보존되도록 하며’ and ‘복종하게 하십시오’ are uneven. Direct formal-polite imperatives give a clearer and more natural rendering of the two third-person imperatives.
  terminology: ‘메시아 예수,’ ‘은사,’ and ‘복종하다’ are acceptable. ‘자기 은사 안에서 정해진 바에 따라’ preserves ἐν τῷ χαρίσματι αὐτοῦ and ἐτέθη without adding an ‘entrusted’ nuance.
  issues:
  - severity: medium
    issue: ‘자기에게 맡겨진 은사’ introduces an unsupported nuance.
    rationale: The Greek refers to a person’s gift and says that the person ‘was placed/appointed’ in it; it does not explicitly say that the gift was entrusted to the person.
  - severity: low
    issue: The Korean imperative syntax is stylistically uneven.
    rationale: Using ‘보존되게 하십시오’ alongside ‘복종하십시오’ more naturally represents the parallel imperatives.
  - severity: low
    issue: The supplied [a] and [b] anchors lack a Korean footnote set, and the English ‘own’ alternative should not be treated as the primary sense.
    rationale: Providing localized footnotes resolves the anchors while distinguishing the previous-rendering alternatives from the main translation.
  revised_text: 그러므로 우리의 온몸이 메시아 예수 안에서 보존되게 하십시오.[a] 각 사람은 자기 은사 안에서 정해진 바에 따라 자기 이웃에게 복종하십시오.[b]
