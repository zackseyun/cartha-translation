id: 1CLEM.38.1
reference: 1 Clement 38:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Συνξέσϑω οὖν ἡμῶν ὅλον τὸ σῶμα ἐν Χριστῷ Ἰησοῦ, καὶ ὑποτασσέσϑω ἕκαστος τῷ πλησίον αὐτοῦ, καϑὼς ἐτέϑη ἐν τῷ χαρίσματι αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/001.yaml
  text: Therefore let our whole body be preserved in Messiah Jesus, and let each one be subject to his neighbor, just as he was appointed in his gift.
  footnotes:
  - marker: a
    text: Or 'let our whole body be held together'.
    reason: previous_rendering
  - marker: b
    text: Or 'according as he was appointed in his own gift'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리의 온몸이 메시아 예수 안에서 보존되게 하십시오.[a] 각 사람은 자기 은사 안에서 정해진 바에 따라 자기 이웃에게 복종하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리의 온몸이 함께 붙들리게 하십시오.”
    reason: 이전 번역의 대안을 보존합니다. 그러나 여기서는 본문의 의도된 읽기인 σωζέσθω(‘보존되다/구원되다’)에 따라 본문을 번역했습니다.
  - marker: b
    text: 또는 “각 사람이 자기 자신의 은사 안에서 정해진 바에 따라.”
    reason: 영어 POB의 이전 번역에 있던 ‘his own gift’의 대안을 반영합니다. 그리스어 αὐτοῦ는 기본적으로 ‘그의/자기의’이며, ‘자기 자신의’이 본문의 필수 의미는 아닙니다.
lexical_decisions:
- source_word: Σωζέσθω / Συνξέσϑω (corrupted OCR; source intended σώζεσθω)
  english_pob_choice: let our whole body be preserved
  chosen_korean: 우리의 온몸이 보존되도록 하며
  alternatives_korean:
  - 우리의 온몸이 구원되도록 하며
  - 우리의 온몸이 함께 붙들리도록 하며
  lexicon: 보존되다
  rationale: 본문의 의도는 ‘붙들려 있다’가 아니라 ‘구원/보존되다’이므로, POB의 수정된 영어를 따라 보존되도록 옮기되 σώζεσθω의 구원·보전 뉘앙스를 살렸습니다.
- source_word: ἐν Χριστῷ Ἰησοῦ
  english_pob_choice: in Messiah Jesus
  chosen_korean: 메시아 예수 안에서
  alternatives_korean:
  - 그리스도 예수 안에서
  - 메시아이신 예수 안에서
  lexicon: 메시아
  rationale: POB의 일관된 титular choice를 따라 Χριστός를 메시아로 옮겼고, 예수와의 결합 표현은 한국어에서 자연스럽게 ‘안에서’로 처리했습니다.
- source_word: ὑποτασσέσθω ἕκαστος τῷ πλησίον αὐτοῦ
  english_pob_choice: let each one be subject to his neighbor
  chosen_korean: 각 사람은 자기 이웃에게 복종하게 하십시오
  alternatives_korean:
  - 각 사람은 자기 이웃에게 순종하게 하십시오
  - 각 사람은 자기 이웃 아래에 두어지게 하십시오
  lexicon: 복종하다
  rationale: ὑποτάσσω의 상호적 질서를 드러내기 위해 단순한 ‘순종’보다 관계적·위계적 뉘앙스가 분명한 ‘복종하다’를 택했습니다.
- source_word: ἐν τῷ χαρίσματι αὐτοῦ
  english_pob_choice: in his gift
  chosen_korean: 자기에게 맡겨진 은사 안에서
  alternatives_korean:
  - 그의 은사 안에서
  - 그에게 주어진 은사 안에서
  lexicon: 은사
  rationale: χαρίσμα은 단순한 재능보다 하나님이 주신 은혜의 선물이라는 점이 중요하므로 ‘은사’로 옮기고, ‘그에게 주어진’ 의미를 한국어 관용에 맞게 풀어 ‘맡겨진’으로 표현했습니다.
theological_decisions:
- issue: 본문 끝의 대구절이 개인의 은사를 근거로 공동체 질서를 설명하는 방식
  chosen_reading: 각 사람이 자기에게 맡겨진 은사 안에서 정해진 바를 따라 이웃에게 복종해야 한다는, 은사를 질서의 근거로 삼는 공동체 윤리를 드러냅니다.
  alternative_readings:
  - 단순히 상호 겸손을 권하는 일반적 권면
  - 개인의 역할 분담을 강조하는 조직적 질서
  rationale: χαρίσμα이 공동체 안의 역할을 규정하는 근거로 작동하므로, 윤리적 권면을 약화시키지 않으면서도 은사 기반 질서를 보존했습니다.
  doctrine_reference: 교회론 / 은사론
