id: 1CLEM.38.4
reference: 1 Clement 38:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ταῦτα οὖν πάντα ἐξ αὐτοῦ ἔχοντες, ὀφείλομεν κατὰ πάντα εὐχαριστεῖν αὐτῷ· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/004.yaml
  text: Therefore, having all these things from him, we ought in every way to give thanks to him, to whom be the glory forever and ever. Amen.
translation:
  language: ko
  text: 그러므로 우리가 이 모든 것을 그분에게서 받았으므로, 우리는 모든 일에 그분께 감사드려야 합니다. 그분께 영광이 영원무궁토록 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα οὖν πάντα
  english_pob_choice: Therefore, having all these things
  chosen_korean: 그러므로 우리가 이 모든 것을 받고 있으니
  alternatives_korean:
  - 그러므로, 이 모든 것을 우리가 소유하고 있으므로
  - 그러므로 이 모든 것을 우리가 가지고 있으니
  lexicon: οὖν / ταῦτα πάντα
  rationale: οὖν은 인과를 자연스럽게 잇는 ‘그러므로’로 옮기고, ταῦτα πάντα는 앞 문맥의 은혜들을 가리키는 총칭으로 ‘이 모든 것’이 가장 직접적입니다.
- source_word: ἐξ αὐτοῦ ἔχοντες
  english_pob_choice: having all these things from him
  chosen_korean: 그에게서 받고 있으니
  alternatives_korean:
  - 그에게서 가지고 있으니
  - 그에게서 얻고 있으니
  lexicon: ἐκ + ἔχω
  rationale: ἐξ αὐτοῦ ἔχοντες는 단순 소유보다 ‘그분으로부터 받은 것’이라는 출처를 강조하므로, 한국어도 수동적 수혜를 드러내는 ‘받고 있으니’가 더 분명합니다.
- source_word: εὐχαριστεῖν αὐτῷ
  english_pob_choice: to give thanks to him
  chosen_korean: 그에게 감사해야 합니다
  alternatives_korean:
  - 그에게 감사드려야 합니다
  - 그에게 감사를 드려야 합니다
  lexicon: εὐχαριστεῖν
  rationale: 동사의 기본 뜻을 살리되 문장 흐름에 맞게 의무 표현인 ‘-해야 합니다’로 옮겨, 공동체의 당위성을 드러냈습니다.
- source_word: ᾧ ἡ δόξα
  english_pob_choice: to whom be the glory
  chosen_korean: 영광이 ... 그에게 있습니다
  alternatives_korean:
  - 그에게 영광이 있습니다
  - 그에게 영광이 있어야 합니다
  lexicon: δόξα
  rationale: 여격 구조를 한국어에서는 ‘영광이 그에게 있습니다’로 자연스럽게 풀어, 송영적 선언의 형식을 유지했습니다.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 세세토록
  - 영원히 영원토록
  lexicon: αἰών
  rationale: 직역보다 한국어 예배 문맥에서 널리 이해되는 ‘영원무궁토록’이 중첩된 세대/시대 표현의 영속성을 잘 드러냅니다.
theological_decisions:
- issue: 송영의 주어와 방향
  chosen_reading: 영광은 인간 공동체가 돌려드리는 대상이 아니라, 모든 것을 주신 분께 돌려지는 영원한 선언으로 이해했습니다.
  alternative_readings:
  - 단순한 축도로만 읽기
  - 감사의 이유만 제시하는 종결문으로 읽기
  rationale: 원문의 ᾧ ἡ δόξα는 문장 자체가 하나님께 드리는 송영이므로, 한국어도 단순 정보 진술이 아니라 예배적 선언으로 보존했습니다.
  doctrine_reference: doxology
- issue: ‘그에게서’의 신학적 함의
  chosen_reading: 모든 은혜의 출처가 인간이 아니라 하나님께 있음을 분명히 드러내는 방향으로 번역했습니다.
  alternative_readings:
  - 중립적 소유 표현으로 완화하기
  - 문맥상 생략하기
  rationale: ἐξ αὐτοῦ는 단순 배경 정보가 아니라 공동체의 모든 선물이 하나님에게서 유래함을 강조하므로, 이를 약화하지 않도록 했습니다.
  doctrine_reference: divine providence
