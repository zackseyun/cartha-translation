review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force of οὖν, the divine source expressed by ἐξ αὐτοῦ, the obligation ὀφείλομεν, and the concluding doxology. However, ‘영광이 … 그에게 있습니다’ turns the Greek doxological formula ᾧ ἡ δόξα into a plain indicative statement; Korean should retain its benedictory/doxological force.
  naturalness: ‘그에게서 받고 있으니’ is understandable but somewhat less idiomatic in this context. ‘그분에게서 … 받았으므로’ is natural formal Korean and clearly expresses that these gifts derive from him. ‘모든 일에’ is a natural rendering of κατὰ πάντα here.
  terminology: ‘그분,’ ‘감사드리다,’ and ‘영광’ suit the formal register. ‘영원무궁토록’ is an established Korean doxological expression for εἰς τοὺς αἰῶνας τῶν αἰώνων.
  issues:
  - severity: medium
    issue: The final sentence renders the doxology as a simple assertion.
    rationale: ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων is an elliptical conventional doxology, conventionally expressed in Korean as ‘그분께 영광이 … 있기를 빕니다,’ rather than ‘영광이 … 있습니다.’
  revised_text: 그러므로 우리가 이 모든 것을 그분에게서 받았으므로, 우리는 모든 일에 그분께 감사드려야 합니다. 그분께 영광이 영원무궁토록 있기를 빕니다. 아멘.
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s causal participial construction and universal scope while using idiomatic modern formal Korean. It also restores the concluding clause’s doxological force without adding doctrinal content.
