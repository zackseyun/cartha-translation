id: 1CLEM.38.3
reference: 1 Clement 38:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀναλογισώμεθα οὖν, ἀδελφοί, ἐκ ποίας ὕλης ἐγενήθημεν, ποῖοι καὶ τίνες εἰσῆλθομεν εἰς τὸν κόσμον, ἐκ ποίου τάφου καὶ σκότους ὁ πλάσας ἡμᾶς καὶ δημιουργήσας εἰσήγαγεν εἰς τὸν κόσμον αὐτοῦ, προετοιμάσας τὰς εὐεργεσίας αὐτοῦ, πρὶν ἡμᾶς γεννηθῆναι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/038/003.yaml
  text: Let us therefore consider[a], brothers, from what material we came to be, what kind of people and what sort we were when we entered into the world, from what grave and darkness the one who formed us and created us brought us into his world[b], having prepared his benefits before we were born.
  footnotes:
  - marker: a
    text: Or 'good gifts'.
    reason: previous_rendering
  - marker: b
    text: Or 'what and who we were when we entered'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 형제들이여, 우리가 어떤 물질에서 생겨났는지, 우리가 세상에 들어왔을 때 어떤 부류의 사람들이었고 누구였는지[b], 우리를 빚으시고 지으신 분께서 어떤 무덤과 어둠으로부터 우리를 자신의 세상으로 들여오셨는지, 또 우리가 태어나기 전에 자신의 은혜로운 베푸심들을[a] 미리 마련하셨음을 생각해 봅시다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “좋은 선물들”.
    reason: εὐεργεσίαι의 기존 대안 번역을 보존합니다. 본문은 ‘베푸심들’로 옮겨 benefaction의 능동적 호의와 은혜의 의미를 드러냅니다.
  - marker: b
    text: 또는 “우리가 세상에 들어왔을 때 무엇이었고 누구였는지”.
    reason: 포이오이(ποῖοι)의 질적 물음과 티네스(τίνες)의 정체성 물음을 압축하여 옮길 수 있는 대안입니다.
lexical_decisions:
- source_word: ἀναλογισώμεθα
  english_pob_choice: consider
  chosen_korean: 생각해 봅시다
  alternatives_korean:
  - 고려해 봅시다
  - 숙고해 봅시다
  lexicon: ἀναλογίζομαι
  rationale: 권고적·성찰적 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 합쇼체에 맞는 표현으로 옮겼습니다.
- source_word: ἐκ ποίας ὕλης
  english_pob_choice: from what material
  chosen_korean: 어떤 질료에서
  alternatives_korean:
  - 어떤 재료에서
  - 무슨 물질에서
  lexicon: ὕλη
  rationale: ὕλη의 철학적·물질적 어감을 살려 단순한 ‘재료’보다 문어적인 ‘질료’를 택했습니다.
- source_word: ποῖοι καὶ τίνες
  english_pob_choice: what kind of people and what sort
  chosen_korean: 어떤 종류의 사람이며 어떠한 존재였는지
  alternatives_korean:
  - 어떤 사람들이며 누구였는지
  - 어떤 종류였고 누구였는지
  lexicon: ποῖος / τίς
  rationale: adjudicated distinction을 반영해 ποῖοι의 성격·종류와 τίνες의 정체성 질문을 구분해 살렸습니다.
- source_word: ἐκ ποίου τάφου καὶ σκότους
  english_pob_choice: from what grave and darkness
  chosen_korean: 어떤 무덤과 어둠에서
  alternatives_korean:
  - 어떤 무덤과 흑암에서
  - 어떤 무덤과 캄캄함에서
  lexicon: τάφος / σκότος
  rationale: τάφος는 단순한 ‘무덤’으로, σκότος는 문어적 ‘어둠’으로 옮겨 죽음과 무지의 이미지를 보존했습니다.
- source_word: εὐεργεσίας
  english_pob_choice: benefits
  chosen_korean: 은택들
  alternatives_korean:
  - 혜택들
  - 선행들
  - 은혜로운 베푸심들
  lexicon: εὐεργεσία
  rationale: 개정된 POB의 ‘benefits’와 그리스-로마 후원자적 어감을 반영하되, 한국어에서는 신앙적이면서도 공적 베풂의 뉘앙스를 지닌 ‘은택’으로 번역했습니다.
theological_decisions:
- issue: 하나님을 창조주이자 은택을 미리 마련하신 분으로 묘사하는 후원자적 언어
  chosen_reading: 하나님께서 우리를 지으시고 만드셨을 뿐 아니라, 태어나기 전에 이미 은택들을 준비하신 분으로 번역했습니다.
  alternative_readings:
  - 복을 미리 예비하셨다
  - 좋은 선물을 미리 마련하셨다
  rationale: εὐεργεσία를 단순한 ‘선물’로 완화하면 문맥의 patronage/benefaction 뉘앙스가 약해지므로, 창조와 은택 준비를 함께 드러내는 방향을 유지했습니다.
  doctrine_reference: 창조와 섭리
