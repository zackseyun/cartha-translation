  rationale: 원문의 반복적 성찰 구조와 두 의문사의 구별을 더 분명히 살리고, εἰσήγαγεν 및 εὐεργεσίαι를 현대 한국어에서 자연스럽게 다듬었습니다. ‘빚으시고 지으신’은 πλάσας와 δημιουργήσας의 두 창조 동사를 보존합니다. 각주는 실제 해당 어구에 배치했습니다.
