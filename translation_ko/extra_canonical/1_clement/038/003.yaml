    rationale: ποῖοι는 ‘어떤 부류/어떠한 상태인가’라는 질적 물음이고, τίνες는 ‘누구인가’라는 정체성의 물음입니다. ‘사람’과 ‘존재’의 대조는 원문의 질문 구조를 정확히 재현하지 못합니다.
