base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/028.yaml
  text: 'Therefore[a], since all things are seen and heard, let us fear him and leave behind the foul desires that belong to wicked deeds, so that by his mercy we may be sheltered from the judgments that are about to come.


    2 For where can any one of us flee from his mighty hand? And what world will receive one of those who desert from him? For the Scripture says somewhere,


    3 “Where shall I go, and where shall I hide from your face? If I go up into heaven, you are there; if I depart to the farthest parts of the earth, there is your right hand; if I make my bed in the depths[a], there is your Spirit.”


    4 Where, then, can anyone go away, or where can he flee[b][c][d], from the One who encompasses all things?'
  footnotes:
  - marker: a
    text: The phrase 'those who desert from him' renders a term used for defectors or deserters, giving the warning a sharper force than a simple 'those who depart.'
    reason: lexical_alternative
    anchor_ref: '28:2'
  - marker: a
    text: '''The Scripture says somewhere'' introduces a citation echoing Psalm 139:7–10 (LXX 138:7–10), though Clement''s wording is adapted rather than identical.'
    reason: cross_reference
    anchor_ref: '28:2'
  - marker: d
    text: '''From your face'' is a literal rendering of a biblical idiom often translated ''from your presence.'''
    reason: lexical_alternative
    anchor_ref: '28:3'
  - marker: c
    text: Or 'from the One who contains all things.' The Greek participle stresses God's all-encompassing presence.
    reason: lexical_alternative
    anchor_ref: '28:4'
  - marker: b
    text: Or 'go away, or where can he run off to, from'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 모든 것이 보고 들리는 만큼, 우리는 그를 두려워하고 악한 행위의 더러운 욕망을 버려, 다가올 심판들에서 그의 긍휼로 덮임을 받도록 합시다.


    2 그렇다면 우리 가운데 누가 그의 강한 손에서 도망칠 수 있겠습니까? 그리고 어떤 세상이 그에게서 도망치는 사람들 가운데 하나를 받아 주겠습니까? 기록은 어디엔가 이렇게 말합니다.


    3 “제가 어디로 가며, 어디에 당신의 얼굴에서 숨겠습니까? 내가 하늘로 올라가도 당신은 거기에 계시며, 내가 땅의 가장 먼 곳으로 가도 거기에는 당신의 오른손이 있습니다. 내가 깊은 곳에 내 자리를 펴도 거기에는 당신의 영이 있습니다.”


    4 그렇다면 누구든지 어디로 가겠으며, 어디로 도망치겠습니까 — 모든 것을 포괄하시는 분에게서?[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλεπομένων καὶ ἀκουομένων
  english_pob_choice: since all things are seen and heard
  chosen_korean: 모든 것이 보고 들리는 만큼
  alternatives_korean:
  - 모든 것이 보이고 들리는 만큼
  - 모든 것이 감찰되고 들리는 만큼
  lexicon: LSJ
  rationale: 수동형의 공개성·노출감을 살리면서도 한국어에서 자연스럽고 문어적인 인과 구문으로 옮겼습니다.
- source_word: φαύλων ἔργων μιαρὰς ἐπιθυμίας
  english_pob_choice: the foul desires that belong to wicked deeds
  chosen_korean: 악한 행위의 더러운 욕망
  alternatives_korean:
  - 사악한 행위에 속한 더러운 욕망
  - 악한 일의 불결한 욕망
  lexicon: LSJ
  rationale: ‘더러운 욕망’과 ‘악한 행위’의 두 요소를 함께 살려, 욕망을 단순 성적 욕망으로 좁히지 않도록 했습니다.
- source_word: σκεπασθῶμεν
  english_pob_choice: we may be sheltered
  chosen_korean: 덮임을 받도록 합시다
  alternatives_korean:
  - 보호를 받도록 합시다
  - 피난처를 얻도록 합시다
  lexicon: LSJ
  rationale: ‘덮다/덮임’의 은유를 한국어에서 너무 설명적으로 풀지 않고, 하나님의 긍휼이 보호막처럼 작용한다는 이미지를 유지했습니다.
- source_word: κραταιᾶς χειρός
  english_pob_choice: mighty hand
  chosen_korean: 강한 손
  alternatives_korean:
  - 능한 손
  - 강력한 손
  lexicon: LSJ
  rationale: 직역에 가까운 ‘손’을 유지하되, 문맥상 하나님의 위력을 가리키는 관용구로서 자연스럽게 읽히도록 했습니다.
- source_word: αὐτομολούντων
  english_pob_choice: those who desert from him
  chosen_korean: 그에게서 도망치는 사람들
  alternatives_korean:
  - 그에게서 탈주하는 사람들
  - 그에게서 이탈하는 사람들
  lexicon: LSJ
  rationale: 주석이 지적한 ‘deserter/defector’의 강한 뉘앙스를 한국어에서 가장 가까운 동사로 옮겼습니다.
- source_word: ἀφίξω
  english_pob_choice: Where shall I go
  chosen_korean: 제가 어디로 가며
  alternatives_korean:
  - 내가 어디에 이르며
  - 제가 어디로 도착하며
  lexicon: LSJ
  rationale: 전승된 시편 인용의 수사적 질문을 자연스러운 한국어로 옮기되, 과도하게 ‘도착’으로 굳히지 않았습니다.
- source_word: ἀπὸ τοῦ προσώπου σου
  english_pob_choice: from your face
  chosen_korean: 당신의 얼굴에서
  alternatives_korean:
  - 당신의 앞에서
  - 당신의 임재에서
  lexicon: BDAG
  rationale: ‘얼굴’의 문자성을 유지해 시편적 이미지와 본문의 직접성을 살렸습니다.
- source_word: τὰ ἔσχατα τῆς γῆς
  english_pob_choice: the farthest parts of the earth
  chosen_korean: 땅의 가장 먼 곳
  alternatives_korean:
  - 땅의 끝
  - 지구의 가장자리아
  lexicon: LSJ
  rationale: 최상급 거리감을 분명히 하면서도 한국어에서 과도하게 관용어화되지 않도록 했습니다.
- source_word: τὸ πνεῦμά σου
  english_pob_choice: your Spirit
  chosen_korean: 당신의 영
  alternatives_korean:
  - 당신의 성령
  - 당신의 호흡
  lexicon: BDAG
  rationale: 여기서는 직접적으로 신적 영을 가리키는 문맥이지만, 인용문 자체의 어휘를 따라 ‘영’으로 두었습니다.
- source_word: τὸ τὰ πάντα ἐμπεριέχοντος
  english_pob_choice: the One who encompasses all things
  chosen_korean: 모든 것을 포괄하시는 분
  alternatives_korean:
  - 만물을 둘러싸시는 분
  - 만물을 포함하시는 분
  lexicon: LSJ
  rationale: 하나님의 전면적 포괄성을 살리면서, 한국어에서 지나치게 철학적으로 들리지 않도록 했습니다.
theological_decisions:
- issue: 심판과 자비의 긴장 유지
  chosen_reading: 다가올 심판을 피하려는 경고와, 긍휼로 덮임을 받는 소망을 함께 살렸습니다.
  alternative_readings:
  - 심판 경고를 약화하고 위로 중심으로 읽기
  - 긍휼을 일반적 보호로만 약화하기
  rationale: 본문은 회개를 촉구하는 권면이므로, 하나님의 임재를 위안으로만 만들지 않고 경외와 심판의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
