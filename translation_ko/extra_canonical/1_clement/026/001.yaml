id: 1CLEM.26.1
reference: 1 Clement 26:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Μέγα καὶ θαυμαστὸν οὖν νομίζομεν εἶναι, εἰ ὁ δημιουργὸς τῶν ἁπάντων ἀνάστασιν ποιήσεται τῶν ὁσίως αὐτῷ δουλευσάντων ἐν πεποιθήσει πίστεως ἀγαθῆς, ὅπου καὶ δι᾿ ὀρνέου δείκνυσιν ἡμῖν τὸ μεγαλεῖον τῆς ἐπαγγελίας αὐτοῦ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/001.yaml
  text: Therefore, do we consider it a great and marvelous thing if the Maker of all things will bring about the resurrection of those who have served him in holiness, in the confidence of good faith, when even through a bird he shows us the greatness of his promise?
translation:
  language: ko
  text: 그러므로 만물을 지으신 분이 거룩하게 자신을 섬긴 이들을, 선한 믿음의 확신 가운데, 부활하게 하시는 것을 우리가 크고 놀라운 일로 여기는 것입니다. 심지어 새 한 마리를 통해서도 그분은 우리에게 자기 약속의 위대함을 보여 주십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δημιουργὸς τῶν ἁπάντων
  english_pob_choice: the Maker of all things
  chosen_korean: 만물을 지으신 분
  alternatives_korean:
  - 만물의 창조주
  - 모든 것의 조물주
  lexicon: δημιουργός
  rationale: ‘Maker’의 동작성을 살리면서도 현대 한국어에서 자연스럽고 신학적으로 과도한 추론이 없는 표현으로 옮겼습니다.
- source_word: ἀνάστασιν ποιήσεται
  english_pob_choice: will bring about the resurrection
  chosen_korean: 부활하게 하시는
  alternatives_korean:
  - 부활을 일으키시는
  - 부활을 이루시는
  lexicon: ἀνάστασις + ποιέω
  rationale: ‘resurrection’을 명사로만 두기보다 ‘부활하게 하다’로 풀어, 행위의 결과를 드러내면서도 문장을 매끄럽게 했습니다.
- source_word: ὁσίως αὐτῷ δουλευσάντων
  english_pob_choice: of those who have served him in holiness
  chosen_korean: 거룩하게 자신을 섬긴 이들
  alternatives_korean:
  - 경건하게 그분을 섬긴 이들
  - 거룩함으로 그분께 봉사한 이들
  lexicon: δουλεύω + ὁσίως
  rationale: δουλεύω의 ‘섬기다’와 ὁσίως의 ‘거룩하게/경건하게’를 함께 살려, 경건한 봉사의 의미가 드러나도록 했습니다.
- source_word: ἐν πεποιθήσει πίστεως ἀγαθῆς
  english_pob_choice: in the confidence of good faith
  chosen_korean: 선한 믿음의 확신 가운데
  alternatives_korean:
  - 좋은 믿음의 확신 안에서
  - 선한 신뢰의 확신 가운데
  lexicon: πεποίθησις + πίστις ἀγαθή
  rationale: πεποίθησις는 ‘확신’으로, πίστις ἀγαθή는 단순한 ‘믿음’보다 품질을 드러내는 ‘선한 믿음’으로 옮겼습니다.
theological_decisions:
- issue: 부활의 주체와 종말론적 능동성
  chosen_reading: 부활은 하나님이 만물의 창조주로서 주권적으로 ‘부활하게 하시는’ 행위로 표현했습니다.
  alternative_readings:
  - 부활을 일으키시는
  - 부활을 이루실 것
  rationale: 원문과 POB가 모두 ‘만물의 조성자/창조자’와 부활을 연결하므로, 능동적 주권을 흐리지 않도록 했습니다.
  doctrine_reference: 하나님의 전능과 부활 교리
- issue: ‘새 한 마리’를 통한 표적의 방식
  chosen_reading: ‘δι᾿ ὀρνέου’를 직역 취지대로 ‘새 한 마리’로 옮기고, 하나님의 약속을 보여 주는 표징으로 유지했습니다.
  alternative_readings:
  - 새를 통해
  - 한 마리 새로
  rationale: POB의 ‘through a bird’는 비유적 표지를 유지하므로, 한국어에서도 과도한 해석 없이 간명하게 살렸습니다.
  doctrine_reference: 계시의 표적성과 하나님의 약속
