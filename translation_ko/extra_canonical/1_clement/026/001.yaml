revisions:
- from: 그러므로 만물을 지으신 분이 거룩하게 자신을 섬긴 이들을, 선한 믿음의 확신 가운데, 부활하게 하시는 것을 우리가 크고 놀라운 일로 여기는 것입니다. 심지어 새 한 마리를 통해서도 그분은 우리에게 자기 약속의 위대함을 보여 주십니다.[a]
  to: 그러므로 만물을 지으신 분께서 선한 믿음에서 오는 확신을 가지고 그분을 경건하게 섬긴 이들을 부활시키실 것이라면, 우리가 그것을 크고 놀라운 일로 여기겠습니까? 그분께서는 새를 통해서도 우리에게 자신의 약속의 위대함을 보여 주십니다.
  rationale: 원문의 수사 의문문과 미래형을 복원하고, ὁσίως와 ἐν πεποιθήσει πίστεως ἀγαθῆς를 자연스러운 현대 한국어로 옮겼습니다. ‘새’의 정체는 본 절에서 명시되지 않으므로 해설을 덧붙이지 않았으며, 대응 각주가 없는 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
