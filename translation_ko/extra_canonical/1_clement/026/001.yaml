  - severity: medium
    issue: 미래형 ποιήσεται가 현재형 ‘부활하게 하시는’으로 옮겨졌습니다.
    rationale: 창조주가 장차 부활을 이루실 것을 말하므로 ‘부활시키실 것’처럼 미래성을 나타내야 합니다.
