base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/003.yaml
  text: And again[a], Job says, “And you will raise up this flesh of mine, which has borne all these things.”
  footnotes:
  - marker: a
    text: Or 'Iob'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 또 욥이 말합니다. 「이 모든 것을 겪어 낸 이 내 육체를 당신께서 일으키실 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰὼβ
  english_pob_choice: Job
  chosen_korean: 욥
  alternatives_korean:
  - 이옵
  - 이욥
  lexicon: 고유명사
  rationale: 그리스어 인명 Ἰὼβ는 한국어 성경에서 널리 알려진 표준형 ‘욥’으로 옮기는 것이 자연스럽고 식별성이 높습니다.
- source_word: ἀναστήσεις
  english_pob_choice: you will raise up
  chosen_korean: 다시 일으키실 것입니다
  alternatives_korean:
  - 일으키실 것입니다
  - 부활시키실 것입니다
  lexicon: ἀνίστημι
  rationale: 여기서는 단순히 세우는 것이 아니라 죽음 이후의 회복/부활을 가리키는 문맥이어서, ‘다시 일으키실 것입니다’가 가장 직접적이면서도 과도한 해석을 피합니다.
- source_word: σάρκα μου ταύτην
  english_pob_choice: this flesh of mine
  chosen_korean: 이 내 육체
  alternatives_korean:
  - 이 나의 육체
  - 내 이 육체
  lexicon: σάρξ
  rationale: σάρξ를 문자 그대로 ‘육체’로 살리고, 소유와 지시를 함께 드러내기 위해 ‘이 내 육체’로 옮겼습니다.
- source_word: ἀναντλήσασαν ταῦτα πάντα
  english_pob_choice: which has borne all these things
  chosen_korean: 이 모든 것을 겪어 낸
  alternatives_korean:
  - 이 모든 것을 견디어 낸
  - 이 모든 것을 감당한
  lexicon: ἀναντλέω
  rationale: 동사의 핵심은 무언가를 ‘지니고 견디다/겪다’는 뜻이므로, ‘겪어 낸’이 영어 POB의 ‘borne’를 가장 자연스럽게 반영합니다.
theological_decisions:
- issue: 육체의 회복을 부활 언어로 얼마나 분명히 드러낼지
  chosen_reading: 본문의 동사 ἀναστήσεις를 ‘다시 일으키실 것입니다’로 옮겨, 육체의 단순한 보존이 아니라 하나님이 행하시는 회복/일으킴을 분명히 했습니다.
  alternative_readings:
  - ‘회복하실 것입니다’
  - ‘살리실 것입니다’
  rationale: 문맥상 고난받는 몸이 다시 일으켜지는 종말론적 희망을 말하므로, 평이한 회복보다 ‘일으키다’가 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 부활과 종말론적 육체 회복
- issue: 직접 화자 인용의 공손성
  chosen_reading: 욥의 진술은 직접 인용부호 안에 넣되, 서술문은 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - 인용문 전체를 평서형으로 통일
  - 고어체로 번역
  rationale: 본문이 인용된 욥의 발화를 전달하는 구조이므로, 화자 인용은 자연스럽게 살리고 전체 서술은 POB의 현대 문체를 유지하는 것이 적절합니다.
  doctrine_reference: 문체/담화 등록
