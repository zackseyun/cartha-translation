  source_fidelity: ἀναστήσεις는 미래 2인칭 단수이므로 ‘당신께서 … 일으키실 것입니다’가 이를 적절히 반영합니다. 다만 ‘다시’는 그리스어 본문에 명시되지 않았으므로 빼는 편이 더 직접적입니다. ἀναντλήσασαν ταῦτα πάντα는 ‘이 모든 것을 겪어 낸’으로 자연스럽게 보존됩니다.
  naturalness: ‘이 내 육체’와 ‘당신께서’는 직접 인용문 안에서 문법적으로 자연스럽고, 전체 문장은 현대 표준어 합쇼체에 맞습니다. ‘다시’를 삭제해도 한국어 문장이 매끄럽습니다.
  terminology: Ἰὼβ는 통용 성경식 이름인 ‘욥’이 적절합니다. σάρξ의 ‘육체’와 ἀναστήσεις의 ‘일으키실 것입니다’도 원문의 신체성과 일으킴의 표현을 보존합니다. 영어판의 ‘Iob’ 이문 표기는 한국어의 ‘욥’ 표기와 관련이 없으므로 각주로 유지할 필요가 없습니다.
