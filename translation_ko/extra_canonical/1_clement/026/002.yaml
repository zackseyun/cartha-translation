base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/026/002.yaml
  text: For somewhere he says, “And you will raise me up, and I will give thanks to you”; and, “I lay down and slept; I awoke, because you are with me.”
translation:
  language: ko
  text: 그가 어디선가 이렇게 말하기 때문입니다. 「주께서 저를 일으키실 것이며, 저는 주께 감사드리겠습니다.」 또 「저는 잠들어 잠을 잤고, 깨어났습니다. 주께서 저와 함께 계시기 때문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ που
  english_pob_choice: For somewhere he says
  chosen_korean: 왜냐하면 그는 어딘가에서 이렇게 말씀하십니다
  alternatives_korean:
  - 어딘가에서 그가 말씀하십니다
  - 어느 곳인가에서 말합니다
  lexicon: λέγω
  rationale: πού(어딘가에서/어느 곳인가에서)의 불특정성을 살리면서, 인용 도입구로서 자연스러운 합쇼체를 유지했습니다.
- source_word: ἐξαναστήσεις με
  english_pob_choice: you will raise me up
  chosen_korean: 주께서 저를 일으키실 것이며
  alternatives_korean:
  - 주께서 저를 다시 일으키실 것이며
  - 주께서 저를 일으켜 세우실 것이며
  lexicon: ἐξανίστημι
  rationale: 죽음/침상에서의 ‘일으킴’이라는 시편적 이미지를 보존하되, 한국어에서는 간결한 ‘일으키시다’가 가장 직접적입니다.
- source_word: ἐξομολογήσομαί σοι
  english_pob_choice: I will give thanks to you
  chosen_korean: 나는 주께 감사드리겠습니다
  alternatives_korean:
  - 나는 주께 감사하겠습니다
  - 나는 주께 고백하겠습니다
  lexicon: ἐξομολογέομαι
  rationale: 이 동사는 ‘감사하다/찬양하며 고백하다’의 뜻을 함께 가질 수 있으나, 여기서는 영어 POB의 해석과 시편 인용 맥락에 따라 ‘감사드리다’로 옮겼습니다.
- source_word: μετ᾿ ἐμοῦ εἶ
  english_pob_choice: you are with me
  chosen_korean: 주께서 저와 함께 계시기 때문입니다
  alternatives_korean:
  - 주께서 나와 함께 계십니다
  - 주께서 제 곁에 계시기 때문입니다
  lexicon: εἰμί + μετά
  rationale: ‘함께 계시다’는 관계적 임재를 자연스럽게 드러내며, 시편의 위로를 한국어로 분명하게 전달합니다.
theological_decisions:
- issue: 인용 도입의 주어 및 인칭 처리
  chosen_reading: 본문의 ‘그’는 시편 인용을 이끄는 화자 지시로 유지하고, 직접 인용 안에서는 2인칭 하나님께 대한 호칭을 ‘주’로 통일했습니다.
  alternative_readings:
  - 직역하여 ‘어딘가에서 말합니다’로 비인칭화
  - 직접 인용 안에서 ‘하나님’으로 바꾸기
  rationale: 그리스어 본문의 인용 도입과 시편적 기도 어법을 함께 살리기 위해, 외부 화자는 서술적으로 두고 인용문은 경배·기도의 문맥에 맞게 ‘주’로 번역했습니다.
  doctrine_reference: 성경 인용의 화자 전환과 예배적 발화 유지
