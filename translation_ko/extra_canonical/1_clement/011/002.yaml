revisions:
- from: 그의 아내가 그와 함께 나갔으나, 생각이 달라 서로 합하지 않았기 때문에, 그녀는 이 일의 표징으로 세워졌습니다. 그래서 그녀는 오늘까지 소금 기둥이 되었습니다[c][b]. 이것은 모든 세대가, 하나님의 능력에 대해 두 마음을 품는 자들과 의심하는 자들이 심판이 되고 경고가 됨을 알게 하려는 것이었습니다.
  to: 그의 아내가 그와 함께 나갔는데, 다른 뜻을 품고 서로 일치하지 않았으므로, 이 때문에 그녀는 표징으로 세워졌습니다[a][b]. 그 결과 그녀는 오늘날까지 소금 기둥이 되었습니다. 이는 모든 사람이 두 마음을 품는 사람들과 하나님의 능력을 의심하는 사람들이 모든 세대에게 심판과 경고가 됨을 알게 하려는 것이었습니다[c].
  rationale: 원문의 상황절과 인과 관계를 자연스럽게 정리하고, ‘표징으로 세워짐’에서 ‘소금 기둥이 됨’으로 이어지는 결과를 명확히 했습니다. ὁμόνοια의 핵심 어휘적 뉘앙스는 ‘서로 일치하다’로, δίψυχοι의 비유적 표현은 ‘두 마음을 품다’로 보존했습니다. 각주 표지는 관련 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:17Z'
