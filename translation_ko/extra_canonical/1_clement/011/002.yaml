  terminology: ἑτερογνώμων은 ‘다른 뜻을 품고’로, ὁμόνοια는 ‘서로 일치하지 않고’로 옮기는 것이 적절합니다. δίψυχοι는 ‘두 마음을 품는 사람들’로 유지할 수 있습니다. κρίμα와 σημείωσις는 본문대로 ‘심판과 경고’로 병렬 처리해야 합니다.
