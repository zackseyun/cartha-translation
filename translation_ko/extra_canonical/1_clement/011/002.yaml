id: 1CLEM.11.2
reference: 1 Clement 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: συνεξελθούσης γὰρ αὐτῷ τῆς γυναικὸς ἑτερογνώμονος ὑπάρχουσης καὶ οὐκ ἐν ὁμονοίᾳ, εἰς τοῦτο σημεῖον ἐτέθη, ὥστε γενέσθαι αὐτὴν στήλην ἁλὸς ἕως τῆς ἡμέρας ταύτης, εἰς τὸ γνωστὸν εἶναι πᾶσιν, ὅτι οἱ δίψυχοι καὶ οἱ διστάζοντες περὶ τῆς τοῦ θεοῦ δυνάμεως εἰς κρίμα καὶ εἰς σημείωσιν πάσαις ταῖς γενεαῖς γίγονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/002.yaml
  text: For when his wife went out with him[a], being of a different mind and not in agreement, she was made a sign for this reason, so that she became a pillar of salt to this very day[c][b], in order that it might be known to all that the double-minded and those who doubt the power of God become a judgment and a warning to all generations.
  footnotes:
  - marker: a
    text: Or 'she was set forth as a sign'.
    reason: previous_rendering
  - marker: b
    text: Or 'harmony'.
    reason: previous_rendering
  - marker: c
    text: Or 'come to judgment and become a warning'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아내가 그와 함께 나갔는데, 다른 뜻을 품고 서로 일치하지 않았으므로, 이 때문에 그녀는 표징으로 세워졌습니다[a][b]. 그 결과 그녀는 오늘날까지 소금 기둥이 되었습니다. 이는 모든 사람이 두 마음을 품는 사람들과 하나님의 능력을 의심하는 사람들이 모든 세대에게 심판과 경고가 됨을 알게 하려는 것이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀는 표징으로 제시되었습니다.”
    reason: ἐτέθη(‘세워졌다/제시되었다’)의 가능한 수동 표현을 제시합니다.
  - marker: b
    text: 또는 “서로 화합하지 않았으므로.”
    reason: ὁμόνοια의 공동체적 화합·일치의 뉘앙스를 보충합니다.
  - marker: c
    text: 또는 “심판을 받고 경고의 본보기가 됩니다.”
    reason: εἰς κρίμα καὶ εἰς σημείωσιν의 해석 가능성을 제시하되, 본문의 병렬 구조는 본문 번역에서 보존합니다.
lexical_decisions:
- source_word: ἑτερογνώμονος
  english_pob_choice: being of a different mind
  chosen_korean: 생각이 달라
  alternatives_korean:
  - 다른 뜻을 품고
  - 뜻이 달라
  - 마음이 달라
  lexicon: ἑτερογνώμων
  rationale: 문맥상 단순한 감정 차이보다 판단과 뜻의 불일치를 가리키므로, 자연스러운 현대 한국어로 ‘생각이 달라’라고 옮겼습니다.
- source_word: οὐκ ἐν ὁμονοίᾳ
  english_pob_choice: not in agreement
  chosen_korean: 서로 합하지 않았기 때문에
  alternatives_korean:
  - 화합하지 않았기 때문에
  - 동의하지 않았기 때문에
  - 일치하지 않았기 때문에
  lexicon: ὁμόνοια
  rationale: 1 Clement에서 ὁμόνοια는 단순한 ‘조화’보다 공동체적 일치와 합의를 뜻하므로, 문맥을 살려 ‘서로 합하지 않았다’로 표현했습니다.
- source_word: σημεῖον
  english_pob_choice: made a sign
  chosen_korean: 표징으로 세워졌습니다
  alternatives_korean:
  - 표징이 되었습니다
  - 징표로 세워졌습니다
  - 표로 세워졌습니다
  lexicon: σημεῖον
  rationale: ‘sign’의 표지성뿐 아니라 본문이 말하는 목적적·경고적 기능을 살려 ‘표징’으로 옮겼고, 수동태는 ‘세워졌습니다’로 살렸습니다.
- source_word: εἰς κρίμα καὶ εἰς σημείωσιν
  english_pob_choice: become a judgment and a warning
  chosen_korean: 심판이 되고 경고가 됨
  alternatives_korean:
  - 심판과 경고가 됨
  - 정죄와 표지가 됨
  - 판결과 경고가 됨
  lexicon: κρίμα / σημείωσις
  rationale: 두 병렬 목적구를 살려 ‘심판’과 ‘경고’로 옮겼으며, 한국어에서도 병렬 구조가 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: 롯의 아내가 된 표징의 기능
  chosen_reading: 그녀는 단순한 결과물이 아니라, 불일치와 의심의 위험을 드러내는 경고의 표징으로 제시됩니다.
  alternative_readings:
  - 그녀는 단지 처벌 사례로 제시됩니다
  - 표징은 하나님의 강압적 조치만을 뜻합니다
  rationale: 본문의 목적절(‘모든 세대가 알게 하려는 것’)과 병렬 명사(심판/경고)를 따라, 표징의 기능을 교훈적·경고적으로 유지했습니다.
  doctrine_reference: 1 Clement의 권면 문맥 및 창 19:26 수용사
