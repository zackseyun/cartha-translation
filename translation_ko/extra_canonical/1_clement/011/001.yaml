review_pass:
  verdict: revise
  source_fidelity: 개정안은 Διὰ φιλοξενίαν καὶ εὐσέβειαν의 명사적 수단 표현을 ‘환대와 경건으로’로 보존하고, ἐκ Σοδόμων을 ‘소돔으로부터’로 명확히 했습니다. ἐλπίζοντας ἐπʼ αὐτόν은 단순한 기대보다 신뢰의 방향을 드러내는 ‘그분에게 소망을 두는’으로, τίθησιν εἰς는 ‘형벌과 고통에 처하신다’로 옮겼습니다.
  naturalness: 원문의 한 문장 논리를 유지하면서도 현대 한국어 합쇼체로 자연스럽게 다듬었습니다. 기존의 독립 문장 ‘때였습니다’는 앞 문장과의 문법적·논리적 결속이 약하므로 종속절로 통합했습니다.
  terminology: δεσπότης는 문맥상 하나님을 가리키는 호칭이므로 ‘주님’으로 유지했습니다. φιλοξενία는 불필요하게 강도를 더한 ‘후하게’ 대신 ‘환대’로, ἑτεροκλινεῖς는 특정 교리적 기준을 과도하게 명시하지 않는 ‘곁길로 벗어나는 이들’로 처리했습니다.
