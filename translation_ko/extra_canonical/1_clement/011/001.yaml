revisions:
- from: 나그네를 후하게 대접하고 경건했기 때문에 롯은 소돔에서 구원받았습니다. 그 주변 온 지역이 불과 유황으로 심판받았을 때였습니다. 이 일에서 주님께서는 그분을 바라는 사람들을 버리지 않으시고, 곁길로 벗어나는 사람들은 형벌과 고통에 넘기신다는 것을 분명히 보여 주셨습니다.[a][b]
  to: 환대와 경건으로 롯은 소돔으로부터 구원을 받았습니다. 그 주변의 온 지역이 불과 유황으로 심판을 받았을 때, 주님께서는 이를 통해 그분에게 소망을 두는 이들을 버리지 않으시고 곁길로 벗어나는 이들은 형벌과 고통에 처하신다는 것을 분명히 보여 주셨습니다.
  rationale: 원문의 수단, 소돔으로부터의 구출, 주변 지역의 심판, 소망을 두는 이들을 버리지 않으심, 이탈한 이들을 형벌과 고통에 처하심이라는 대조를 보존했습니다. 제공되지 않은 각주 내용에 대응하지 않는 앵커는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
