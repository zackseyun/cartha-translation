id: 1CLEM.11.1
reference: 1 Clement 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Διὰ φιλοξενίαν καὶ εὐσέβειαν Λὼτ ἐσώθη ἐκ Σοδόμων, τῆς περιχώρου πάσης κριθείσης διὰ πυρὸς καὶ θείου, πρόδηλον ποιήσας ὁ δεσπότης, ὅτι τοὺς ἐλπίζοντας ἐπʼ αὐτὸν οὐκ ἐγκαταλείπει, τοὺς δὲ ἑτεροκλινεῖς ὑπάρχοντας εἰς κόλασιν καὶ αἰκισμὸν τίθησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/011/001.yaml
  text: Because of hospitality and godliness, Lot was saved from Sodom, when the whole surrounding region was judged by fire and sulfur. In this the Master made it plain that he does not abandon those who hope in him, but appoints those who turn aside to punishment and torment.
translation:
  language: ko
  text: 환대와 경건으로 롯은 소돔으로부터 구원을 받았습니다. 그 주변의 온 지역이 불과 유황으로 심판을 받았을 때, 주님께서는 이를 통해 그분에게 소망을 두는 이들을 버리지 않으시고 곁길로 벗어나는 이들은 형벌과 고통에 처하신다는 것을 분명히 보여 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοξενίαν
  english_pob_choice: hospitality
  chosen_korean: 나그네를 후하게 대접하고
  alternatives_korean:
  - 환대하여
  - 나그네를 사랑하여
  - 친절로 손님을 맞아
  lexicon: φιλοξενία
  rationale: 단순한 ‘환대’보다 실제로 손님/나그네를 받아들이는 행위를 드러내기 위해, 문맥상 결과를 살린 동작형 표현을 택했습니다.
- source_word: εὐσέβειαν
  english_pob_choice: godliness
  chosen_korean: 경건했기 때문에
  alternatives_korean:
  - 하나님을 경외했기 때문에
  - 경건함 때문에
  - 신앙적 삶 때문에
  lexicon: εὐσέβεια
  rationale: εὐσέβεια의 핵심인 하나님을 향한 경외와 경건한 태도를 현대 한국어에서 자연스럽게 전달했습니다.
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주님
  alternatives_korean:
  - 주인
  - 주
  - 주권자
  lexicon: δεσπότης
  rationale: 본문의 화자가 하나님/주를 가리키는 권위적 호칭이므로, POB의 ‘Master’ 의미를 살리되 한국어에서는 신앙적 독법에 맞는 ‘주님’으로 옮겼습니다.
- source_word: ἑτεροκλινεῖς
  english_pob_choice: those who turn aside
  chosen_korean: 곁길로 벗어나는 사람들
  alternatives_korean:
  - 다른 길로 치우치는 사람들
  - 비뚤어진 사람들
  - 다른 쪽으로 기울어지는 사람들
  lexicon: ἑτεροκλινής
  rationale: 직역보다 ‘믿음/순종의 길에서 벗어남’이라는 도덕적·영적 이탈을 분명히 드러내기 위해 자연스러운 관용 표현을 사용했습니다.
- source_word: κόλασιν καὶ αἰκισμόν
  english_pob_choice: punishment and torment
  chosen_korean: 형벌과 고통
  alternatives_korean:
  - 벌과 고통
  - 징벌과 고문
  - 형벌과 괴로움
  lexicon: κόλασις / αἰκισμός
  rationale: αἰκισμός의 가혹한 고통/괴롭힘을 ‘고통’으로 옮겨 의미를 보존하되, 과도하게 해석적인 ‘고문’은 피했습니다.
theological_decisions:
- issue: δεσπότης 호칭의 한국어 처리
  chosen_reading: ‘주님’으로 옮겨, 권위적 주권과 신앙적 호칭을 함께 살렸습니다.
  alternative_readings:
  - 주인
  - 주
  - 주권자
  rationale: 여기서 δεσπότης는 단순한 소유주가 아니라 심판과 구원을 주관하시는 분을 가리키므로, 한국어 신앙 용례에 맞는 ‘주님’이 가장 균형적입니다.
  doctrine_reference: Divine sovereignty and judgment
- issue: ‘형벌과 고통’의 종말론적 경고
  chosen_reading: 곁길로 벗어나는 자에 대한 심판을 현실적 경고로 보존했습니다.
  alternative_readings:
  - 상징적 훈계
  - 비유적 경고
  rationale: 본문은 소돔 심판을 예로 들어 실제 심판의 엄중함을 말하므로, 경고를 약화시키지 않고 직설적으로 유지했습니다.
  doctrine_reference: Judgment and perseverance
