source:
  edition: Funk 1901 (normalized OCR)
  text: Ἵνα δὲ καὶ ὑποδείγματα ἐθνῶν ἐνέγκωμεν· πολλοὶ βασιλεῖς καὶ ἡγούμενοι, λοιμικοῦ τινος ἐνστάντος καιροῦ, χρησμοδοτηθέντες παρέδωκαν ἑαυτοὺς εἰς θάνατον, ἵνα ῥύσωνται διὰ τοῦ ἑαυτῶν αἵματος τοὺς πολίτας· πολλοὶ ἐξεχώρησαν ἰδίων πόλεων, ἵνα μὴ στασιάζωσιν ἐπὶ πλεῖον. 2. ἐπιστάμεθα πολλοὺς ἐν ἡμῖν παραδεδωκότας ἑαυτοὺς εἰς δεσμά, ὅπως ἑτέρους λυτρώσωνται· πολλοὶ ἑαυτοὺς παρέδωκαν εἰς δουλείαν, καὶ λαβόντες τὰς τιμὰς αὐτῶν ἑτέρους ἐψώμισαν. 3. πολλαὶ γυναῖκες ἐνδυναμωθεῖσαι διὰ τῆς χάριτος τοῦ θεοῦ ἐπετέλεσαν πολλὰ ἀνδρεῖα. 4. Ἰουδὶθ ἡ μακαρία, ἐν συγκλεισμῷ οὔσης τῆς πόλεως, ᾐτήσατο παρὰ τῶν πρεσβυτέρων ἐαθῆναι αὐτὴν ἐξελθεῖν εἰς τὴν παρεμβολὴν τῶν ἀλλοφύλων. 5. παραδοῦσα οὖν ἑαυτὴν τῷ κινδύνῳ ἐξῆλθεν δι’ ἀγάπην τῆς πατρίδος καὶ τοῦ λαοῦ τοῦ ὄντος ἐν συγκλεισμῷ, καὶ παρέδωκεν κύριος Ὀλοφέρνην ἐν χειρὶ θηλείας. 6. οὐχ ἧττον καὶ ἡ τελεία κατὰ πίστιν Ἐσθὴρ κινδύνῳ ἑαυτὴν παρέβαλεν, ἵνα τὸ δωδεκάφυλον τοῦ Ἰσραὴλ μέλλον ἀπολέσθαι ῥύσηται· διὰ γὰρ τῆς νηστείας καὶ τῆς ταπεινώσεως ἠξίωσεν τὸν
    παντεπόπτην δεσπότην, θεὸν τῶν αἰώνων· ὃς ἰδὼν τὸ ταπεινὸν τῆς ψυχῆς αὐτῆς ἐρύσατο τὸν λαόν, ὧν χάριν ἐκινδύνευσεν.
  language: Greek
  pages:
  - 329
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/055.yaml
  text: 'And so[a], to bring forward examples even from the nations: many kings and rulers, when some pestilential crisis had arisen, being instructed by oracles, handed themselves over to death so that through their own blood they might rescue their citizens. Many departed from their own cities so that they might no longer be torn by faction.


    We know of many among us who have handed themselves over to chains so that they might ransom others. Many handed themselves over into slavery[b], and after receiving the price paid for them, they fed others.


    Many women, strengthened through the grace of God, accomplished many manly deeds.


    The blessed Judith, when the city was under siege, asked of the elders that she be permitted to go out into the camp of the foreigners. So then, handing herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord handed Holofernes over into the hand of a woman.


    And no less did Esther also, perfect in faith, put herself in danger so that she might rescue the twelve-tribed people of Israel, which were about to perish. For through fasting and humiliation she entreated the all-seeing Master, God of the ages; and he, seeing the humility of her soul[g][f][e][d][c], rescued the people for whose sake she had faced danger.'
  footnotes:
  - marker: a
    text: Or 'a plague-stricken time.' The Greek describes a deadly public crisis, likely involving pestilence or calamity.
    reason: lexical_alternative
  - marker: b
    text: Literally 'manly deeds.' Clement uses gendered language to commend the courage of these women.
    reason: lexical_alternative
  - marker: c
    text: Ioudith refers to Judith of the deuterocanonical book of Judith.
    reason: cross_reference
  - marker: d
    text: Or 'perfect in faith' / 'complete in faith.' The Greek phrase is concise and somewhat idiomatic.
    reason: lexical_alternative
  - marker: e
    text: Esther alludes especially to the Greek Esther tradition, with its emphasis on fasting and humble petition.
    reason: cross_reference
  - marker: f
    text: Or 'giving herself over to danger, she went out because of love for her homeland and for the people who were under siege, and the Lord delivered Holofernes'.
    reason: previous_rendering
  - marker: g
    text: Or 'And no less also Esther, perfect according to faith, put herself in danger'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 이방인들 가운데서도 본보기들을 가져오겠습니다. 많은 왕들과 통치자들이, 어떤 죽음의 재앙 같은 때가 닥치자, 신탁의 지시를 받아 자기 자신을 죽음에 내어주어 자기들의 피로 시민들을 구했습니다. 또 많은 이들이 자기들의 도시를 떠나, 더 이상 분열에 휩싸이지 않게 하였습니다.


    우리 가운데도 많은 사람이 다른 이들을 속량하려고 자기 몸을 쇠사슬에 내어준 것을 우리는 알고 있습니다. 많은 이들이 스스로를 노예 상태에 내어주었고, 자기들의 대가를 받은 뒤에 다른 이들을 먹였습니다.


    많은 여자들이 하나님의 은혜로 힘을 얻어 많은 남자다운 일들을 행했습니다.


    복되신 유디트는 성이 포위된 가운데, 장로들에게 이방인들의 진영으로 나가도록 허락해 달라고 청했습니다. 그래서 위험에 자신을 내어준 채 나가서, 자기 조국과 포위된 백성을 사랑하는 마음으로 그렇게 했으며, 주님께서는 홀로페르네스를 여자의 손에 넘기셨습니다.


    믿음에 있어 온전한 에스더도 그와 조금도 다르지 않게 자신을 위험에 내어주어, 멸망 직전에 있던 이스라엘의 열두 지파를 구하려 했습니다. 금식과 겸손을 통해 그녀는 만물을 살피시는 주권자, 영원들의 하나님께 간구하였고, 그녀의 영혼의 겸손을 보신 그분께서는 그녀가 그토록 위험을 무릅쓴 백성을 구하셨습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδείγματα ἐθνῶν
  english_pob_choice: examples even from the nations
  chosen_korean: 이방인들 가운데서도 본보기들
  alternatives_korean:
  - 민족들 가운데서도 예들
  - 열국 가운데서도 본보기들
  lexicon: LSJ
  rationale: ὑποδείγματα는 단순한 예시가 아니라 본받거나 숙고할 만한 사례라는 뜻이 강하므로 ‘본보기들’이 적합하며, ἐθνῶν은 문맥상 ‘이방인들’로 옮겨 POB의 넓은 민족적 의미를 살렸습니다.
- source_word: λοιμικοῦ τινος ... καιροῦ
  english_pob_choice: some pestilential crisis
  chosen_korean: 어떤 죽음의 재앙 같은 때
  alternatives_korean:
  - 어떤 전염병 같은 때
  - 죽음에 이르는 재앙의 시기
  lexicon: LSJ
  rationale: 문구는 전염병만이 아니라 치명적 공적 재난을 가리키므로, 문자적이면서도 문맥을 반영하는 ‘죽음의 재앙 같은 때’로 옮겼습니다.
- source_word: παρέδωκαν ἑαυτοὺς εἰς δουλείαν
  english_pob_choice: handed themselves over into slavery
  chosen_korean: 스스로를 노예 상태에 내어주었고
  alternatives_korean:
  - 자기 자신을 종살이에 내어주었고
  - 노예로 내어주었고
  lexicon: BDAG
  rationale: δουλείαν은 단순한 봉사나 종속이 아니라 속박된 상태를 뜻하므로, 프로젝트 원칙에 따라 의미를 약화하지 않고 ‘노예 상태’로 드러냈습니다.
- source_word: ἀνδρεῖα
  english_pob_choice: manly deeds
  chosen_korean: 남자다운 일들
  alternatives_korean:
  - 용감한 일들
  - 담대한 일들
  lexicon: LSJ
  rationale: 그리스어가 성별 표지가 있는 용어를 의도적으로 사용하므로, 이를 중립화하지 않고 한국어에서도 성별이 드러나는 표현을 유지했습니다.
- source_word: ἐν συγκλεισμῷ οὔσης τῆς πόλεως
  english_pob_choice: when the city was under siege
  chosen_korean: 성이 포위된 가운데
  alternatives_korean:
  - 성이 포위되어 있을 때
  - 도시가 포위된 상태에서
  lexicon: LSJ
  rationale: 관용적으로 ‘포위되다’가 정확하며, 앞의 문맥과 자연스럽게 이어지도록 간결하게 처리했습니다.
- source_word: τὸ δωδεκάφυλον τοῦ Ἰσραήλ
  english_pob_choice: the twelve-tribed people of Israel
  chosen_korean: 이스라엘의 열두 지파
  alternatives_korean:
  - 열두 지파의 이스라엘 백성
  - 이스라엘의 열두 지파 백성
  lexicon: LSJ
  rationale: 복합적 집합명사이지만 한국어에서는 가장 자연스러운 공적 호칭인 ‘이스라엘의 열두 지파’로 옮겼습니다.
- source_word: παντεπόπτην δεσπότην
  english_pob_choice: the all-seeing Master
  chosen_korean: 만물을 살피시는 주권자
  alternatives_korean:
  - 모든 것을 보시는 주인
  - 전지하신 주
  lexicon: LSJ
  rationale: δεσπότης는 κύριος보다 더 강한 통치권의 뉘앙스를 가지므로, 예배적·권위적 감각을 살리되 한국어에서 부자연스럽지 않게 ‘주권자’로 옮겼습니다.
theological_decisions:
- issue: 여성의 공적 용기를 칭찬하는 ἀνδρεῖα의 처리
  chosen_reading: 남자다운 일들
  alternative_readings:
  - 용감한 일들
  - 담대한 일들
  rationale: 본문은 여성들에게 남성적 용어를 의도적으로 적용하여 탁월한 용기를 강조하므로, 중립화하지 않고 그 긴장을 그대로 드러냈습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: δεσπότης와 κύριος의 구분
  chosen_reading: 주권자
  alternative_readings:
  - 주님
  - 주인
  rationale: 본문은 앞서 κύριος를 쓰다가 여기서는 δεσπότης를 사용하므로, 동일한 한국어 ‘주님’으로 평준화하지 않고 권위의 강도를 반영했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
