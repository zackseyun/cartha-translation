  chosen_korean: 다툼이 일어날 것임을
  alternatives_korean:
  - 분쟁이 생길 것임을
  - 다툼이 있을 것임을
  lexicon: ἔρις
  rationale: ἔρις의 핵심은 단순한 갈등보다 공동체 내 분쟁·다툼이므로, 미래 서술을 살려 자연스럽게 표현했습니다.
- source_word: ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς
