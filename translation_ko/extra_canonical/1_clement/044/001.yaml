  rationale: 이 문장은 호칭적 용법이므로 POB의 기본 방침에 따라 메시아를 유지해, 원문이 지닌 유대적·칭호적 뉘앙스를 살렸습니다.
  doctrine_reference: Proper-noun / titular Χριστός policy
- issue: ἐπισκοπή의 교회직분 의미
  chosen_reading: 감독 직분
  alternative_readings:
  - 감독의 직책
