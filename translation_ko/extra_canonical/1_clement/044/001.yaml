translation:
  language: ko
  text: 우리의 사도들은 우리 주 예수 메시아를 통해, 감독 직분이라는 이름을 두고 다툼이 일어날 것임을 알았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἀπόστολοι ἡμῶν
  english_pob_choice: our apostles
  chosen_korean: 우리의 사도들
  alternatives_korean:
  - 우리 사도들
  - 우리의 사도들
  lexicon: ἀπόστολος
  rationale: 소유 관계를 분명히 하되, 문맥상 자연스러운 복수 명사로 옮겼습니다.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  english_pob_choice: through our Lord Jesus Messiah
  chosen_korean: 주 예수 메시아를 통해
  alternatives_korean:
  - 우리 주 예수 메시아를 통해
  - 주 예수 그리스도를 통해
  lexicon: κύριος / Χριστός
  rationale: χριστός는 이 문맥에서 칭호로 쓰였으므로 POB 기본값에 따라 메시아로 옮겼고, διὰ는 수단·매개를 나타내어 ‘-를 통해’로 처리했습니다.
- source_word: ἔρις ἔσται
  english_pob_choice: there would be strife
  chosen_korean: 다툼이 일어날 것임을
  alternatives_korean:
  - 분쟁이 생길 것임을
  - 다툼이 있을 것임을
  lexicon: ἔρις
  rationale: ἔρις의 핵심은 단순한 갈등보다 공동체 내 분쟁·다툼이므로, 미래 서술을 살려 자연스럽게 표현했습니다.
- source_word: ἐπὶ τοῦ ὀνόματος τῆς ἐπισκοπῆς
  english_pob_choice: over the name of the overseer’s office
  chosen_korean: 감독 직분의 이름을 두고
  alternatives_korean:
  - 감독 직분의 이름으로
  - 감독의 직분이라는 이름을 두고
  lexicon: ἐπίσκοπος / ἐπισκοπή
  rationale: ἐπισκοπή는 여기서 직무·직분을 가리키므로 ‘감독 직분’으로 옮겼고, ἐπί는 논쟁의 쟁점을 나타내어 ‘-을 두고’로 처리했습니다.
theological_decisions:
- issue: Χριστός의 번역형
  chosen_reading: 메시아
  alternative_readings:
