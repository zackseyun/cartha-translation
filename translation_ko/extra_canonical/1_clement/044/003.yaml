revisions:
- from: 그러므로 그들에 의해 임명된 사람들, 또는 그 뒤에 다른 유력한 사람들에 의해, 온 회중이 동의한 가운데 임명되어 그리스도의 양 떼를 겸손하게, 조용히, 그리고 무례함 없이 흠 없이 섬기고, 오랫동안 모든 사람에게 잘 증언되어 온 이들에 대해서는—우리는 이들을 섬김의 직분에서 부당하게 물러나게 하는 것이 옳지 않다고 생각합니다.[a]
  to: 그러므로 그들에 의해 임명된 사람들, 또는 그 뒤에 다른 훌륭한 사람들에 의해 온 회중의 동의를 받아 임명되어, 그리스도의 양 떼를 겸손하게, 조용히, 허세 없이 흠 없이 섬기고 오랫동안 모든 이에게 인정받아 온 이들을 섬김의 직분에서 부당하게 물러나게 하는 것은 옳지 않다고 우리는 생각합니다.[a]
  rationale: ‘허세 없이’로 ἀβαναύσως의 비과시적 뉘앙스를 회복하고, ‘모든 이에게 인정받아 온’으로 μεμαρτυρημένους의 지속적인 공적 평판을 자연스럽게 반영했습니다. 그 밖에는 임명, 회중의 동의, 흠 없는 섬김, 그리고 부당한 직무 배제에 대한 판단이라는 원문의 요소와 애매하지 않은 수사 구조를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:58Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 논증 구조는 대체로 충실합니다. 그러나 ἀβαναύσως를 ‘무례함 없이’로 옮긴 것은 문맥상 과시·허세·거만함이 없다는 뜻을 충분히 반영하지 못하며, μεμαρτυρημένους의 수동적 평판 의미도 ‘잘 증언되어’보다 ‘인정받아’가 적절합니다.
  naturalness: 긴 수식어 열거와 결론의 대조는 잘 보존되어 있으나, ‘모든 사람에게 잘 증언되어 온’은 현대 한국어에서 다소 직역투입니다. ‘오랫동안 모든 이에게 인정받아 온’이 자연스럽고 의미도 명확합니다.
  terminology: ‘임명된’, ‘그리스도의 양 떼’, ‘섬김의 직분’은 문맥에 맞습니다. 다만 ἀβαναύσως는 ‘무례함 없이’가 아니라 ‘허세 없이’로 수정하는 것이 영어 POB의 unpretentiously 및 원문의 문맥적 의미에 더 부합합니다.
