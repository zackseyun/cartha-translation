    rationale: 이 말은 여기서 타인에게 예의를 지키는 태도보다 허세·과시·거만함이 없는 태도를 가리킵니다. ‘무례함 없이’는 의미 영역을 다른 방향으로 옮깁니다.
  - severity: low
    issue: μεμαρτυρημένους를 ‘모든 사람에게 잘 증언되어 온’으로 번역함
