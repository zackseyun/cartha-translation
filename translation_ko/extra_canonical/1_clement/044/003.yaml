id: 1CLEM.44.3
reference: 1 Clement 44:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τοὺς οὖν κατασταθέντας ὑπ᾽ ἐκείνων ἢ μεταξὺ ὑφ᾽ ἑτέρων ἐλλογίμων ἀνδρῶν συνευδοκησάσης τῆς ἐκκλησίας πάσης, καὶ λειτουργήσαντας ἀμέμπτως τῷ ποιμνίῳ τοῦ Χριστοῦ μετὰ ταπεινοφροσύνης, ἡσύχως καὶ ἀβαναύσως, μεμαρτυρημένους τε πολλοῖς χρόνοις ὑπὸ πάντων, τούτους οὐ δικαίως νομίζομεν ἀποβάλλεσθαι τῆς λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/003.yaml
  text: Therefore[a], those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and unpretentiously, and who for a long time have been well attested by all—these we consider not to be justly removed from the ministry.
  footnotes:
  - marker: a
    text: Or 'Therefore we consider it unjust that those who were appointed by them, or afterward by other reputable men with the whole church consenting, and who have served the flock of the Messiah blamelessly, with humility, quietly, and without arrogance, and who for a long time have been well attested by all—such men should be removed from the ministry.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 그들에 의해 임명된 사람들, 또는 그 뒤에 다른 유력한 사람들에 의해, 온 회중이 동의한 가운데 임명되어 그리스도의 양 떼를 겸손하게, 조용히, 그리고 무례함 없이 흠 없이 섬기고, 오랫동안 모든 사람에게 잘 증언되어 온 이들에 대해서는—우리는 이들을 섬김의 직분에서 부당하게 물러나게 하는 것이 옳지 않다고 생각합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατασταθέντας
  english_pob_choice: were appointed
  chosen_korean: 임명된
  alternatives_korean:
  - 세워진
  - 지정된
  lexicon: καθίστημι
  rationale: 공적 직분 수여의 뉘앙스를 살리기 위해 ‘임명된’을 택했습니다. 문맥상 단순 지정보다 공식적 임직에 가깝습니다.
- source_word: ποιμνίῳ
  english_pob_choice: the flock
  chosen_korean: 양 떼
  alternatives_korean:
  - 무리
  - 회중
  lexicon: ποιμνίον
  rationale: 비유적 목자-양 이미지가 분명하므로, 관용적으로 ‘양 떼’로 옮겨 원문의 목양 이미지를 보존했습니다.
- source_word: ἀβαναύσως
  english_pob_choice: unpretentiously
  chosen_korean: 무례함 없이
  alternatives_korean:
  - 허세 없이
  - 거드름 피우지 않고
  - 잘난 체하지 않고
  lexicon: ἀβαναύσως
  rationale: 이 형용사는 오만함보다 과시·허세의 부재를 가리키지만, 한국어에서 자연스럽고 지나치게 해석적이지 않은 표현으로 ‘무례함 없이’를 택했습니다.
- source_word: λειτουργίας
  english_pob_choice: the ministry
  chosen_korean: 섬김의 직분
  alternatives_korean:
  - 사역
  - 봉사 직무
  - 직분
  lexicon: λειτουργία
  rationale: 공동체적 봉사의 공적 직분이라는 의미를 살리면서도, 후대 교회제도 용어로 과도하게 좁혀지지 않도록 ‘섬김의 직분’으로 옮겼습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 그리스도
  alternative_readings:
  - 메시아
  - 기름부음받은 이
  rationale: 이 문맥에서는 인칭 호칭보다 공동체가 이미 수용한 교회적 관용이 더 자연스러워, POB 기본값 메시아 대신 고유호칭 ‘그리스도’를 사용했습니다.
  doctrine_reference: 명칭/호칭의 문맥적 관용
- issue: ‘부당하게 물러나게 하는 것’의 판단문 구조
  chosen_reading: 우리는 이들을 섬김의 직분에서 부당하게 물러나게 하는 것이 옳지 않다고 생각합니다
  alternative_readings:
  - 우리는 이들이 직분에서 부당하게 제거되는 것을 옳지 않다고 생각합니다
  - 우리는 이들을 직분에서 내쫓는 것이 옳지 않다고 봅니다
  rationale: 그리스어의 부정적 판단 구조(οὐ δικαίως νομίζομεν ἀποβάλλεσθαι)를 한국어에서 자연스럽게 살리기 위해, ‘옳지 않다고 생각합니다’로 옮겨 판단 주체를 분명히 했습니다.
  doctrine_reference: 수사 구조 보존
