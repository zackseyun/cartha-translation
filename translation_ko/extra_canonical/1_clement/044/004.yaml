id: 1CLEM.44.4
reference: 1 Clement 44:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται, ἐὰν τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας τὰ δῶρα τῆς ἐπισκοπῆς ἀποβάλωμεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/004.yaml
  text: For it will be no small sin for us if we cast out those who have offered the gifts of oversight blamelessly and devoutly[a].
  footnotes:
  - marker: a
    text: Or 'cast out from the overseer’s office those who have offered its gifts'.
    reason: previous_rendering
translation:
  language: ko
  text: 왜냐하면 우리가 감독 직무의 예물을 흠 없이 경건하게 바친 이들을 내쫓는다면, 그것은 우리에게 작은 죄가 아닐 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “감독 직무에서, 예물을 흠 없이 경건하게 바친 이들을 내쫓는다면.” 원문의 ‘감독 직무의’가 ‘예물’과 연결되는지, ‘내쫓다’와 연결되는지는 해석상 논의됩니다.
    reason: τῆς ἐπισκοπῆς의 속격이 τὰ δῶρα를 수식하는 주된 독해와, ἀποβάλωμεν의 영역을 나타내는 대안적 독해 사이의 모호성을 보존합니다.
lexical_decisions:
- source_word: ἁμαρτία γὰρ οὐ μικρὰ ἡμῖν ἔσται
  english_pob_choice: For it will be no small sin for us
  chosen_korean: 그것은 ... 우리에게 작은 죄가 아닐 것입니다
  alternatives_korean:
  - 우리에게 적지 않은 죄가 될 것입니다
  - 우리에게 큰 죄가 될 것입니다
  lexicon: ἁμαρτία, οὐ μικρά
  rationale: 부정과 비교 표현을 그대로 살려 ‘작은 죄가 아닙니다’로 옮기고, 문맥상 경고의 미래형을 자연스럽게 반영했습니다.
- source_word: τοὺς ἀμέμπτως καὶ ὁσίως προσενέγκοντας
  english_pob_choice: those who have offered ... blamelessly and devoutly
  chosen_korean: 흠 없이, 경건하게 드린 사람들
  alternatives_korean:
  - 책망할 데 없이, 거룩하게 바친 사람들
  - 흠잡을 데 없이, 경건히 드린 이들
  lexicon: ἀμέμπτως, ὁσίως, προσενέγκοντας
  rationale: 두 부사와 분사의 결합을 한국어에서 가장 자연스럽게 살리기 위해 ‘흠 없이, 경건하게 드린’으로 압축했습니다.
- source_word: τὰ δῶρα τῆς ἐπισκοπῆς
  english_pob_choice: the gifts of oversight
  chosen_korean: 그 직분의 선물
  alternatives_korean:
  - 감독의 선물
  - 감독 직무의 선물
  - 감독의 직분에 속한 선물
  lexicon: δῶρα, ἐπισκοπή
  rationale: ἐπισκοπή를 단순히 ‘직무’로만 풀기보다, 문맥상 제의적·공적 봉사의 성격을 함께 담는 ‘직분’으로 옮겼고, τὰ δῶρα는 자연스럽게 ‘선물’로 처리했습니다.
- source_word: ἀποβάλωμεν
  english_pob_choice: if we cast out
  chosen_korean: 내쫓는다면
  alternatives_korean:
  - 내친다면
  - 제외한다면
  - 축출한다면
  lexicon: ἀποβάλλω
  rationale: 공동체적 배제의 강한 뉘앙스를 살리되 현대 한국어에서 과도하게 정치적이지 않은 ‘내쫓다’를 택했습니다.
theological_decisions:
- issue: ἐπισκοπή의 성격
  chosen_reading: 이 구절의 ἐπισκοπή는 단지 추상적 ‘감독’이 아니라 공동체 안에서 맡겨진 공적 직분/책무로 이해해 ‘직분’으로 옮겼습니다.
  alternative_readings:
  - 감독
  - 감독 직무
  - 감독 직분
  rationale: 문맥은 특정 개인 명칭보다 공적 봉사와 그에 따른 선물을 가리키므로, 한국어에서 오해를 줄이는 방향으로 처리했습니다.
  doctrine_reference: 교회 직분과 질서에 관한 본문 문맥
- issue: 내쫓다의 강도
  chosen_reading: ἀποβάλωμεν의 공동체적 배제 성격을 약화하지 않기 위해 부드러운 ‘제외’보다 ‘내쫓다’를 택했습니다.
  alternative_readings:
  - 제외하다
  - 배제하다
  - 몰아내다
  rationale: 본문은 단순 행정 조정이 아니라 중대한 죄의 가능성을 경고하므로, 강한 동사를 유지하는 것이 적절합니다.
  doctrine_reference: 공동체 징계와 직분 존중
