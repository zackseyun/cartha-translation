source:
  edition: Funk 1901 (normalized OCR)
  text: ὁρῶμεν γάρ, ὅτι ἐνίους ὑμεῖς μετηγάγετε καλῶς πολιτευομένους ἐκ τῆς ἀμέμπτως αὐτοῖς τετιμημένης λειτουργίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/006.yaml
  text: For we see that you have removed some who were conducting themselves well from the ministry that had been blamelessly honored by them[a].
  footnotes:
  - marker: a
    text: Or 'honorably and blamelessly assigned to them'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 여러분이 바르게 처신하던 몇 사람을, 그들이 흠 없이 존중해 온 그 직무에서 떼어 낸 것을 봅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들에게 영예롭게 그리고 흠 없이 맡겨진 직무에서.”
    reason: 영어 POB 감사 이력에 남아 있는 이전 번역 선택지를 투명하게 보존합니다. 다만 본문은 τετιμημένης를 ‘존중해 온’으로, 여격 αὐτοῖς를 행위자로 반영한 번역을 채택합니다.
lexical_decisions:
- source_word: ὁρῶμεν γάρ
  english_pob_choice: For we see
  chosen_korean: 우리는 … 봅니다
  alternatives_korean:
  - 우리가 … 봅니다
  - 우리는 … 알고 있습니다
  lexicon: ὁράω
  rationale: 현재형 인식 동사를 살려 공동체가 이미 알고 있는 사실을 진술하는 느낌을 유지했습니다.
- source_word: μετηγάγετε
  english_pob_choice: you have removed
  chosen_korean: 옮겨 놓은
  alternatives_korean:
  - 옮긴
  - 제거한
  - 이동시킨
  lexicon: μετάγω
  rationale: 사람을 한 위치나 직분에서 다른 데로 옮긴다는 기본 의미를 반영하되, 지나치게 행정적이거나 물리적인 표현은 피했습니다.
- source_word: καλῶς πολιτευομένους
  english_pob_choice: conducting themselves well
  chosen_korean: 잘 행하던
  alternatives_korean:
  - 바르게 살아가던
  - 선하게 처신하던
  - 훌륭히 행하던
  lexicon: πολιτεύομαι
  rationale: 공동체 안에서의 행실과 삶의 태도를 가리키는 표현으로, 도덕적·공적 행위를 무리 없이 드러내는 한국어를 택했습니다.
- source_word: λειτουργίας ... τετιμημένης αὐτοῖς
  english_pob_choice: the ministry that had been blamelessly honored by them
  chosen_korean: 그들에게 흠 없이 존중되던 그 직분
  alternatives_korean:
  - 그들이 흠 없이 존중하던 그 봉사
  - 그들에게 흠 없이 영예롭게 여겨지던 그 사역
  - 그들이 존중하여 맡아 행하던 그 직무
  lexicon: λειτουργία / τιμάω
  rationale: λειτουργία를 교회 제도에 고정된 용어로 과도하게 좁히지 않고, 문맥상 ‘직분’으로 옮겼으며, τετιμημένης는 ‘존중되다/존귀하게 여겨지다’의 수동 의미를 반영했습니다.
theological_decisions:
- issue: 직분을 떠나게 한 행위의 성격
  chosen_reading: 본문은 단순한 이동이 아니라, 잘 행하던 사람들을 그들이 존중해 오던 직분에서 물러나게 한 상황을 비판적으로 말합니다.
  alternative_readings:
  - 단순히 다른 자리로 배치한 것
  - 행정상 재배치
  rationale: μετηγάγετε와 τετιμημένης의 결합이 단순 재배치보다 더 강한 상실감을 주므로, 비판적 뉘앙스를 살렸습니다.
  doctrine_reference: 교회 질서와 직분의 존중
