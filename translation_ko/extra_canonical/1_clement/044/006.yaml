revisions:
- from: 우리는 여러분이 잘 행하던 몇 사람을, 그들에게 흠 없이 존중되던 그 직분에서 옮겨 놓은 것을 봅니다.[a]
  to: 우리는 여러분이 바르게 처신하던 몇 사람을, 그들이 흠 없이 존중해 온 그 직무에서 떼어 낸 것을 봅니다.[a]
  rationale: 원문의 완전수동분사 τετιμημένης와 여격 αὐτοῖς의 관계를 ‘그들이 … 존중해 온’으로 명시하여 행위자를 분명히 했습니다. ἀμέμπτως는 존중 행위의 방식으로 ‘흠 없이’로 유지했으며, 직분의 성격은 교파적으로 한정하지 않고 ‘직무’로 처리했습니다.
  reviewer_model: gpt-5.6-terra
