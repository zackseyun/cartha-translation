review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 맞지만, αὐτοῖς를 ‘그들에게’로 처리한 수동 표현은 한국어에서 행위자(‘그들이’)를 불분명하게 합니다. αὐτοῖς τετιμημένης는 그 몇 사람이 그 λειτουργία를 존중해 왔다는 뜻이므로 이를 직접 밝혀야 합니다. μετηγάγετε는 이 문맥에서 단순 이동보다 그 직무로부터 떼어 내거나 물러나게 한 행위를 가리킵니다.
  naturalness: ‘그들에게 흠 없이 존중되던 그 직분’은 어색하고 ‘그들에게’가 수혜자처럼 읽힐 수 있습니다. ‘그들이 흠 없이 존중해 온 직무’가 현대 표준어 합쇼체에서 더 명료하고 자연스럽습니다.
  terminology: λειτουργία는 여기서 특정 교파의 성직 개념을 강제하지 않는 ‘직무’로 옮겼습니다. πολιτευομένους는 공동체 안에서의 처신을 나타내도록 ‘바르게 처신하던’으로 번역했습니다.
  issues:
  - severity: medium
    issue: αὐτοῖς의 의미가 불명확함
    rationale: ‘그들에게 존중되던’은 문법상 가능해 보이지만, 원문의 여격 행위자, 곧 ‘그들이 존중한’을 한국어 독자가 분명히 파악하기 어렵습니다.
  - severity: low
    issue: ‘옮겨 놓은’과 ‘잘 행하던’의 문체 및 의미가 다소 약함
    rationale: 직무에서 부당하게 배제한 문맥에는 ‘그 직무에서 떼어 낸’이 더 자연스럽고, πολιτεύομαι에는 ‘바르게 처신하다’가 공동체적 행실을 더 잘 드러냅니다.
  revised_text: 우리는 여러분이 바르게 처신하던 몇 사람을, 그들이 흠 없이 존중해 온 그 직무에서 떼어 낸 것을 봅니다.[a]
