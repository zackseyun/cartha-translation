revisions:
- from: 복 있는 이들은 앞서 간 장로들이니, 그들은 때맞고도 온전한 떠남을 가졌습니다. 그들은 자신들에게 주어진 자리를 누군가가 빼앗을까 두려워하지 않습니다.[a]
  to: 복 있는 이들은 앞서 간 장로들입니다. 그들은 제때에 온전한 떠남을 맞이했습니다. 왜냐하면 누군가 그들을 자신들에게 주어진 자리에서 옮길까 두려워하지 않기 때문입니다.
  rationale: μεταστήσῃ를 ‘옮길까’로 바로 옮겨 원문의 의미 범위를 보존했습니다. ἀνάλυσις는 문맥상 삶의 마침을 가리키지만 직접적인 사망 용어가 아니므로 ‘떠남’을 유지했고, 어색한 직역 표현만 현대 한국어로 다듬었습니다. 근거 없는 본문 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:55Z'
review_pass:
  verdict: revise
  source_fidelity: ‘빼앗을까’는 μεταστήσῃ(옮기다, 자리에서 물러나게 하다)의 뜻보다 강하며, 소유를 탈취한다는 의미를 더합니다. ‘옮길까’로 고쳐 원문의 표현을 보존해야 합니다. δεδομένου는 ‘주어진’으로 옮긴 점이 적절합니다.
  naturalness: ‘때맞고도 온전한 떠남을 가졌습니다’는 현대 한국어에서 다소 직역투입니다. ‘제때에 온전한 떠남을 맞이했습니다’가 의미를 유지하면서 더 자연스럽습니다. 문장을 나누어 합쇼체 서술을 일관되게 했습니다.
  terminology: πρεσβύτεροι의 ‘장로들’, μακάριοι의 ‘복 있는’, ἀνάλυσις의 직접적인 죽음 표현을 피한 ‘떠남’, τόπος의 문맥적 ‘자리’는 적절합니다. 영어 감사 이력의 ‘appointed’ 대안은 δεδομένου의 어휘와 맞지 않으므로 한국어 각주로 유지하지 않습니다.
  issues:
  - severity: medium
    issue: ‘빼앗을까’가 μεταστήσῃ의 의미를 과도하게 특정합니다.
    rationale: μεθίστημι는 여기서 누군가를 주어진 자리에서 옮기거나 물러나게 하는 뜻이며, ‘빼앗다’는 탈취의 의미를 첨가합니다.
  - severity: low
    issue: 본문의 [a] 표지에 대응하는 한국어 각주가 없고, 영어 각주의 ‘appointed’ 대안은 현행 원문 판단과도 맞지 않습니다.
    rationale: 주어진 입력의 영어 각주는 이전 번역을 반영한 것이며, δεδομένου는 δίδωμι에서 온 ‘주어진’입니다. 본문 표지를 제거하고 각주를 두지 않는 것이 구조와 본문 의미 모두에 적절합니다.
  revised_text: 복 있는 이들은 앞서 간 장로들입니다. 그들은 제때에 온전한 떠남을 맞이했습니다. 왜냐하면 누군가 그들을 자신들에게 주어진 자리에서 옮길까 두려워하지 않기 때문입니다.
