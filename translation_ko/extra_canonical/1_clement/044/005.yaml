source:
  edition: Funk 1901 (normalized OCR)
  text: μακάριοι οἱ προοδοιπορήσαντες πρεσβύτεροι, οἵτινες ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν· οὐ γὰρ εὐλαβοῦνται, μή τις αὐτοὺς μεταστήσῃ ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/005.yaml
  text: Blessed are the elders who went on before[a], who had a timely and complete departure; for they do not fear lest someone remove them from the place given to them.
  footnotes:
  - marker: a
    text: Or 'appointed to them'.
    reason: previous_rendering
translation:
  language: ko
  text: 복 있는 이들은 앞서 간 장로들이니, 그들은 때맞고도 온전한 떠남을 가졌습니다. 그들은 자신들에게 주어진 자리를 누군가가 빼앗을까 두려워하지 않습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  english_pob_choice: Blessed
  chosen_korean: 복 있는
  alternatives_korean:
  - 복된
  - 복이 있는
  lexicon: μακάριος
  rationale: 축복 선언의 시작을 자연스러운 현대 한국어로 살리되, 전형적 교회체 표현을 과도하게 굳히지 않기 위해 ‘복 있는’을 택했습니다.
- source_word: οἱ προοδοιπορήσαντες πρεσβύτεροι
  english_pob_choice: the elders who went on before
  chosen_korean: 앞서 간 장로들
  alternatives_korean:
  - 먼저 지나간 장로들
  - 앞서서 걸어간 장로들
  lexicon: πρεσβύτεροι / προοδοιπορέω
  rationale: πρεσβύτεροι를 ‘장로들’로 두고, προοδοιπορήσαντες는 단순한 선행/선행 통과의 의미를 살려 ‘앞서 간’으로 옮겼습니다.
- source_word: ἔγκαιρον καὶ τελείαν ἔχον τὴν ἀνάλυσιν
  english_pob_choice: a timely and complete departure
  chosen_korean: 때맞고도 온전한 떠남
  alternatives_korean:
  - 적절하고 완전한 떠남
  - 때맞은 완전한 해체
  lexicon: ἀνάλυσις
  rationale: ἀνάλυσις의 문자적 ‘분해’보다 문맥상 죽음/이별의 완결된 떠남을 가리키므로, POB의 해석을 따라 ‘떠남’으로 옮기되 ‘때맞고도 온전한’으로 두 수식어를 살렸습니다.
- source_word: ἀπὸ τοῦ δεδομένου αὐτοῖς τόπου
  english_pob_choice: from the place given to them
  chosen_korean: 자신들에게 주어진 자리
  alternatives_korean:
  - 그들에게 주어진 장소
  - 그들에게 맡겨진 자리
  lexicon: δίδωμι / τόπος
  rationale: 개정된 영어 본문처럼 δεδομένου를 ‘appointed’가 아니라 ‘given’으로 보아 ‘주어진’으로 옮겼고, τόπος는 물리적 장소를 넘어 공동체 안의 배정된 위치라는 뉘앙스를 살려 ‘자리’로 했습니다.
theological_decisions:
- issue: ἀνάλυσις의 의미 범위
  chosen_reading: 죽음을 직접 언급하지 않고도, 삶의 마침과 이별을 포함하는 ‘떠남’으로 표현했습니다.
  alternative_readings:
  - 죽음
  - 해체
  - 출발
  rationale: 문맥은 장로들의 마지막을 가리키지만, 헬라어는 직접적 사망 용어가 아니라 ‘풀림/떠남’의 어휘를 쓰므로 그 긴장을 보존했습니다.
  doctrine_reference: source semantics / lexical tension
