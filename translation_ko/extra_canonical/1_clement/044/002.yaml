id: 1CLEM.44.2
reference: 1 Clement 44:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ ταύτην οὖν τὴν αἰτίαν πρόγνωσιν εἰληφότες τελείαν κατέστησαν τοὺς προειρημένους καὶ μεταξὺ ἐπινομὴν δεδώκασιν, ὅπως, ἐὰν κοιμηθῶσιν, διαδέξωνται ἕτεροι δεδοκιμασμένοι ἄνδρες τὴν λειτουργίαν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/044/002.yaml
  text: For this reason[a], then, having received complete foreknowledge, they appointed the men already mentioned, and afterward they gave a further provision, so that if they should fall asleep, other approved men might succeed to their ministry.
  footnotes:
  - marker: a
    text: Or 'Therefore, for this reason,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이러한 이유로[a], 그들은 온전한 예지를 받고 앞서 말한 사람들을 세웠으며, 그 후에 덧붙여 규정을 마련해 두었습니다. 이는 그들이 잠들면 검증된 다른 남성들이 그들의 직무를 이어받게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러므로 이러한 이유로.’
    reason: 원문의 후치 접속사 οὖν(‘그러므로/그러니’)을 본문에서 한국어의 부자연스러운 중복 없이 처리하되, 가능한 직역적 연결을 제시합니다.
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  english_pob_choice: For this reason, then,
  chosen_korean: 그러므로 이런 이유로
  alternatives_korean:
  - 이런 이유로, 그러므로
  - 그런 까닭에
  lexicon: διὰ + αἰτία
  rationale: 원문의 원인 표현과 연결어 οὖν을 함께 살려, 중복 없이 인과와 전개를 자연스럽게 한국어로 옮겼습니다.
- source_word: πρόγνωσιν εἰληφότες τελείαν
  english_pob_choice: having received complete foreknowledge
  chosen_korean: 완전한 미리 앎을 받은 뒤
  alternatives_korean:
  - 완전한 예지를 받은 뒤
  - 온전한 미리 앎을 받아
  lexicon: πρόγνωσις
  rationale: πρόγνωσις를 단순한 ‘예정’이 아니라 ‘미리 앎’의 의미를 보존해 옮겼고, τελείαν은 그 범위를 강화하는 형용사로 반영했습니다.
- source_word: ἐπινομὴν δεδώκασιν
  english_pob_choice: they gave a further provision
  chosen_korean: 추가로 마련해 두었습니다
  alternatives_korean:
  - 추가 규정을 두었습니다
  - 덧붙여 준비해 두었습니다
  lexicon: ἐπινομή
  rationale: ἐπινομή는 여기서 뒤를 이을 사람을 대비한 추가적 조치로 보이므로, 법률적 뉘앙스를 과도하게 살리기보다 문맥상 기능을 드러내는 표현을 택했습니다.
- source_word: δεδοκιμασμένοι ἄνδρες τὴν λειτουργίαν αὐτῶν
  english_pob_choice: other approved men might succeed to their ministry
  chosen_korean: 다른 검증된 사람들이 그들의 직분을 이어받도록
  alternatives_korean:
  - 다른 합격한 사람들이 그들의 봉사를 이어받도록
  - 다른 인정받은 남자들이 그들의 사역을 이어받도록
  lexicon: δοκιμάζω / λειτουργία
  rationale: δεδοκιμασμένοι는 ‘승인된’보다 시험을 통과한 ‘검증된’의 뜻이 더 분명하고, λειτουργία는 교회 제도용어로 고정하지 않고 원문의 공적 봉사성을 살려 ‘직분’으로 옮겼습니다.
theological_decisions:
- issue: 세움과 계승의 질서
  chosen_reading: 앞서 언급된 사람들을 세우고, 그 직분을 이어받을 다른 검증된 사람들을 미리 마련해 두었다고 읽었습니다.
  alternative_readings:
  - 단순한 인사 조치로 읽기
  - 공식 직분 계승 구조로 강하게 읽기
  rationale: 본문은 사도적/교회적 직무의 연속성과 대비를 분명히 말하므로, 지나치게 일반 행정 언어로 약화하지 않되 제도적 의미를 과장하지 않도록 균형 있게 옮겼습니다.
  doctrine_reference: 교회 질서와 직무 계승에 관한 문맥적 해석
