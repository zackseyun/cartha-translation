  terminology: πρόγνωσις는 여기서 ‘예지’로, δεδοκιμασμένοι ἄνδρες는 성별을 생략하지 않고 ‘검증된 다른 남성들’로 옮겼습니다. λειτουργία는 특정 교파적 직제 개념을 과도하게 부여하지 않는 ‘직무’로 번역했습니다.
