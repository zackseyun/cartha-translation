id: 1CLEM.37.2
reference: 1 Clement 37:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: κατανοήσωμεν τοὺς στρατευομένους τοῖς ἡγουμένοις ἡμῶν, πῶς εὐτάκτως, πῶς εἰκτικῶς, πῶς ὑποτεταγμένως ἐπιτελοῦσιν τὰ διατασσόμενα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/002.yaml
  text: 'Let us consider those who serve as soldiers under our commanders: how orderly[a], how obedient, how submissively they carry out what is commanded.'
  footnotes:
  - marker: a
    text: Or 'how orderly, how readily, how submissively'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 지휘관들 아래에서 복무하는 병사들을 생각해 보십시오. 얼마나 질서정연하게, 얼마나 순종적으로, 얼마나 복종하듯이 명령된 것을 수행하는지 말입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσωμεν
  english_pob_choice: Let us consider
  chosen_korean: 생각해 보십시오
  alternatives_korean:
  - 생각합시다
  - 유의해 보십시오
  - 살펴보십시오
  lexicon: κατανοέω
  rationale: 권면하는 청중 참여를 살리면서도, 단순한 지적 인지가 아니라 사례를 ‘생각해 보라’는 수사적 호소로 자연스럽게 옮겼습니다.
- source_word: τοὺς στρατευομένους
  english_pob_choice: those who serve as soldiers
  chosen_korean: 복무하는 병사들
  alternatives_korean:
  - 군인으로 복무하는 사람들
  - 군사로 섬기는 이들
  - 병사로 복무하는 이들
  lexicon: στρατεύομαι
  rationale: 단순히 ‘전쟁하다’가 아니라 군사 복무 상태를 가리키므로, 문맥에 맞게 ‘복무하는 병사들’로 옮겼습니다.
- source_word: τοῖς ἡγουμένοις ἡμῶν
  english_pob_choice: under our commanders
  chosen_korean: 우리의 지휘관들 아래에서
  alternatives_korean:
  - 우리의 지휘자들 아래에서
  - 우리의 통솔자들 아래에서
  - 우리의 인도자들 아래에서
  lexicon: ἡγούμενος
  rationale: 계층적 지휘 관계를 드러내기 위해 ‘지휘관들’로 옮겼고, 군사 비유에 맞게 ‘아래에서’를 유지했습니다.
- source_word: εὐτάκτως, πῶς εἰκτικῶς, πῶς ὑποτεταγμένως
  english_pob_choice: how orderly, how obedient, how submissively
  chosen_korean: 얼마나 질서정연하게, 얼마나 순종적으로, 얼마나 복종하듯이
  alternatives_korean:
  - 얼마나 질서 있게, 얼마나 잘 따르며, 얼마나 복종적으로
  - 얼마나 규율 있게, 얼마나 순종하며, 얼마나 복종하듯
  lexicon: εὐτάκτως / εἰκτικῶς / ὑποτεταγμένως
  rationale: 세 개의 부사적 병렬을 살려 각각 질서, 순종, 복종의 뉘앙스를 구분해 옮겼습니다. ‘복종하듯이’는 ὑποτεταγμένως의 강한 종속성을 완화하지 않으면서 한국어 문장에서도 자연스럽게 들리도록 한 선택입니다.
theological_decisions:
- issue: 군사적 복종 비유의 강도
  chosen_reading: 본문의 명령 수행은 단순한 예시가 아니라 질서와 복종을 통한 공동체 권면으로 읽었습니다.
  alternative_readings:
  - 단순한 비유적 관찰로만 읽기
  - 권위주의적 복종을 직접 명령하는 문장으로 읽기
  rationale: 문맥상 저자는 병사들의 태도를 들어 공동체가 배울 점을 제시하므로, 비유성을 유지하되 수사적 강도를 약화시키지 않았습니다.
  doctrine_reference: 교회 질서와 권위에 대한 서신 문맥
- issue: εἰκτικῶς의 의미 범위
  chosen_reading: ‘순종적으로’로 옮겨, 단순한 신속성보다 ‘기꺼이 따름’의 의미를 반영했습니다.
  alternative_readings:
  - ‘신속하게’
  - ‘기꺼이’
  - ‘잘 따르며’
  rationale: EN POB audit trail도 εἰκτικῶς를 promptness보다 compliance 쪽으로 이해하고 있으며, 문맥상 후속 부사들과 함께 복종의 태도를 형성합니다.
  doctrine_reference: 본문 문맥의 수사적 대구
