id: 1CLEM.37.5
reference: 1 Clement 37:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: λάβωμεν τὸ σῶμα ἡμῶν· ἡ κεφαλὴ δίχα τῶν ποδῶν οὐδέν ἐστιν, οὕτως οὐδὲ οἱ πόδες δίχα τῆς κεφαλῆς· τὰ δὲ ἐλάχιστα μέλη τοῦ σώματος ἡμῶν ἀναγκαῖα καὶ εὔχρηστά εἰσιν ὅλῳ τῷ σώματι· ἀλλὰ πάντα συνεπνεῖ καὶ ὑποταγῇ μιᾷ χρῆται εἰς τὸ σώζεσϑαι ὅλον τὸ σῶμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/005.yaml
  text: 'Let us take our body as an example: the head is nothing without the feet; likewise the feet are nothing without the head. Even the smallest members of our body are necessary and useful to the whole body. But all breathe together and make use of one submission[a], so that the whole body may be preserved.'
  footnotes:
  - marker: a
    text: Or 'make use of one submission'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 몸을 예로 들어 보십시오. 머리는 발이 없으면 아무것도 아니고, 마찬가지로 발도 머리 없이는 아무것도 아닙니다. 우리 몸의 가장 작은 지체들도 온몸에 꼭 필요하고 유익합니다. 그러나 모든 지체가 함께 숨 쉬며 하나의 순종을 행하니, 온몸이 보존되게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβωμεν τὸ σῶμα ἡμῶν
  english_pob_choice: Let us take our body as an example
  chosen_korean: 우리의 몸을 예로 들어 보십시오
  alternatives_korean:
  - 우리 몸을 받아 보겠습니다
  - 우리의 몸을 가져 보겠습니다
  lexicon: λάβωμεν / σῶμα
  rationale: λάβωμεν을 단순한 소유가 아니라 논증을 위한 예시 제시로 읽어, 한국어에서는 자연스럽게 ‘예로 들어 보십시오’로 풀었습니다.
- source_word: τὰ ἐλάχιστα μέλη
  english_pob_choice: the smallest members
  chosen_korean: 우리 몸의 가장 작은 지체들
  alternatives_korean:
  - 우리 몸의 가장 작은 부분들
  - 우리 몸의 가장 작은 기관들
  lexicon: ἐλάχιστος / μέλος
  rationale: μέλη는 단순한 ‘부분’보다 몸의 유기적 지체라는 비유를 살려 ‘지체들’로 옮겼고, ἐλάχιστα는 ‘가장 작은’으로 직역했습니다.
- source_word: συνεπνεῖ
  english_pob_choice: all breathe together
  chosen_korean: 모든 지체가 함께 숨 쉬며
  alternatives_korean:
  - 모든 지체가 한숨에 움직이며
  - 모든 지체가 한마음으로 호흡하며
  lexicon: συνεπνέω
  rationale: 영문의 갱신된 해석을 따라 ‘함께 숨 쉬며’로 옮겨, 공동체적 조화와 생명 연계를 간결하게 드러냈습니다.
- source_word: ὑποταγῇ μιᾷ χρῆται
  english_pob_choice: make use of one submission
  chosen_korean: 하나의 순종을 행하니
  alternatives_korean:
  - 한 순종을 실천하니
  - 한 복종을 사용하니
  lexicon: ὑποταγή / χράομαι
  rationale: ὑποταγή는 ‘복종’보다 관계적·덕목적 의미를 살려 ‘순종’으로 옮겼고, χράομαι는 추상명사와 결합한 관용을 따라 ‘행하다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 교회론적 비유에서 몸의 상호의존성을 어떻게 드러낼지
  chosen_reading: 각 지체가 독립적으로 존재하지 않고 온몸의 보존을 위해 함께 기능하는 유기적 공동체로 제시했습니다.
  alternative_readings:
  - 지체들 사이의 상호협력만 강조하는 완화된 표현
  - 조직적 질서만 부각하는 표현
  rationale: 본문은 단순한 협력보다 몸의 생명 유지라는 목적성을 강조하므로, ‘온몸이 보존되게 하려는 것입니다’로 종결해 논지의 종착점을 분명히 했습니다.
  doctrine_reference: 교회/공동체의 유기적 하나됨
- issue: ὑποταγῇ μιᾷ의 의미를 ‘순종’으로 번역할지 여부
  chosen_reading: ‘하나의 순종’으로 옮겨, 하나됨 속에서 드러나는 공동의 복종/순응의 성격을 살렸습니다.
  alternative_readings:
  - ‘한 복종’
  - ‘한 제출’
  rationale: 한국어 ‘복종’은 지나치게 강압적으로 들릴 수 있고, ‘제출’은 문맥상 부자연스럽습니다. ‘순종’은 덕목적·공동체적 뉘앙스를 유지하면서도 원문의 종속성을 반영합니다.
  doctrine_reference: 공동체 윤리와 질서
