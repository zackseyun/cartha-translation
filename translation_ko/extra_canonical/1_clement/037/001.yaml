id: 1CLEM.37.1
reference: 1 Clement 37:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Στρατευώμεϑα οὖν, ἄνδρες ἀδελφοί, μετὰ πάσης ἐκτενείας ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/001.yaml
  text: Therefore let us serve as soldiers, brothers, with all earnestness under his blameless commands.
translation:
  language: ko
  text: 그러므로 형제 여러분, 우리는 그의 흠 없는 명령들 아래에서 온 힘을 다해 싸워야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στρατευώμεϑα
  english_pob_choice: let us serve as soldiers
  chosen_korean: 싸워야 합니다
  alternatives_korean:
  - 군사처럼 섬겨야 합니다
  - 전사로 나서야 합니다
  - 군사로 복무해야 합니다
  lexicon: στρατεύομαι
  rationale: 이 동사는 문자적으로는 군복무/군사적 행동을 뜻하지만, 문맥상 공동체적 권면을 살려 ‘싸우다’로 옮기되, POB의 군사적 이미지도 유지했습니다.
- source_word: ἄνδρες ἀδελφοί
  english_pob_choice: brothers
  chosen_korean: 형제 여러분
  alternatives_korean:
  - 형제들이여
  - 형제자매 여러분
  - 형제 여러분
  lexicon: ἀδελφοί
  rationale: 호격적 공동체 호칭이므로 현대 합쇼체에 맞게 ‘형제 여러분’으로 자연스럽게 다듬었습니다.
- source_word: μετὰ πάσης ἐκτενείας
  english_pob_choice: with all earnestness
  chosen_korean: 온 힘을 다해
  alternatives_korean:
  - 온갖 간절함으로
  - 모든 열성으로
  - 온 힘과 간절함으로
  lexicon: ἐκτένεια
  rationale: 단순한 태도보다 강한 지속적 긴장과 전력을 가리키므로, 한국어에서는 결과적으로 드러나는 강한 헌신을 보여 주는 표현을 택했습니다.
- source_word: ἐν τοῖς ἀμώμοις προστάγμασιν αὐτοῦ
  english_pob_choice: under his blameless commands
  chosen_korean: 그의 흠 없는 명령들 아래에서
  alternatives_korean:
  - 그의 흠 없는 명령들 안에서
  - 그의 흠 없는 명령에 따라
  - 그의 흠 없는 계명들 아래에서
  lexicon: ἀμώμοις προστάγμασιν
  rationale: προστάγματα는 단순한 조언이 아니라 권위 있는 ‘명령들’이어서 그대로 살렸고, ἀμώμοις는 도덕적 결함이 없음을 나타내므로 ‘흠 없는’으로 옮겼습니다.
theological_decisions:
- issue: 군사 은유의 보존
  chosen_reading: 교회적 권면을 ‘싸워야 합니다’로 옮겨 영적 훈련과 전투성의 이미지를 드러냈습니다.
  alternative_readings:
  - ‘섬기듯 군사로 복무해야 합니다’처럼 완화하는 번역
  - 단순히 ‘열심히 살아야 합니다’로 일반화하는 번역
  rationale: 원문 στρατευώμεθα는 공동체를 향한 강한 군사적 자기헌신을 요구하므로, 그 긴장과 결의를 약화하지 않는 쪽을 택했습니다.
  doctrine_reference: 영적 전투/제자도 권면
