review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘싸워야 합니다’는 στρατευώμεθα의 군사적 은유를 일부 보존하지만, 이 동사는 여기서 직접적인 전투 행위보다 ‘군사로 복무하다/병역을 수행하다’를 뜻합니다. 또한 원문의 청유법은 ‘~합시다’로 옮기는 것이 적절합니다. ἐν은 이 문맥에서 명령의 권위 아래에 복무한다는 뜻으로 자연스럽게 처리할 수 있습니다.
  naturalness: ‘그의 흠 없는 명령들 아래에서’는 이해되지만 한국어로 다소 직역투입니다. ‘그분의 흠 없는 명령들을 따라’가 현대의 격식 있는 한국어에서 더 자연스럽고, 군사 은유와도 충돌하지 않습니다.
  terminology: ‘형제 여러분’은 ἄνδρες ἀδελφοί라는 남성 호격을 보존하는 자연스러운 공동체 호칭입니다. προστάγμασιν은 ‘명령들’로, ἀμώμοις는 ‘흠 없는’으로 옮길 수 있습니다. μετὰ πάσης ἐκτενείας는 단순한 능력의 총량인 ‘온 힘’보다 열의와 진지함을 드러내는 ‘온갖 열성을 다해’가 더 가깝습니다.
  issues:
  - severity: medium
    issue: Στρατευώμεθα를 ‘싸워야 합니다’로 번역함
    rationale: 원문은 군사로 복무하거나 군사적 임무를 수행한다는 뜻이며, 반드시 실제로 ‘싸우다’라는 직접 전투를 뜻하지 않습니다. 청유법도 ‘~합시다’로 보존해야 합니다.
  - severity: low
    issue: μετὰ πάσης ἐκτενείας를 ‘온 힘을 다해’로 번역함
    rationale: 의미상 가능하지만 ἐκτένεια의 열성·간절한 진지함이 약해질 수 있습니다.
  - severity: low
    issue: ‘명령들 아래에서’라는 직역적 표현
    rationale: 문법적으로 가능하나 현대 한국어에서는 ‘명령들을 따라’가 더 자연스럽게 원문의 복종·복무 관계를 전달합니다.
  revised_text: 그러므로 형제 여러분, 그분의 흠 없는 명령들을 따라 온갖 열성을 다해 군사로 복무합시다.
