id: 1CLEM.37.4
reference: 1 Clement 37:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οἱ μεγάλοι δίχα τῶν μικρῶν οὐ δύνανται εἶναι οὔτε οἱ μικροὶ δὶχα τῶν μεγάλων· σύγκρασίς τις ἐστιν ἐν πᾶσιν, καὶ ἐν τούτοις χρῆσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/004.yaml
  text: The great cannot exist without the small[a], nor the small without the great. There is a certain blending in all things, and in these there is usefulness.
  footnotes:
  - marker: a
    text: Or 'and in this there is usefulness.'.
    reason: previous_rendering
translation:
  language: ko
  text: 큰 이들은 작은 이들 없이 존재할 수 없고, 작은 이들도 큰 이들 없이 존재할 수 없습니다. 만물에는 어떤 섞임이 있으며, 이것들 안에는 유익이 있습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ μεγάλοι
  english_pob_choice: The great
  chosen_korean: 큰 이들
  alternatives_korean:
  - 큰 자들
  - 위대한 이들
  lexicon: μεγάλοι
  rationale: 문맥상 신분적·기능적 상대성을 드러내는 표현이므로, 과도하게 칭송하는 뉘앙스의 ‘위대한’보다 대칭적인 ‘큰 이들’이 자연스럽습니다.
- source_word: οἱ μικροί
  english_pob_choice: the small
  chosen_korean: 작은 이들
  alternatives_korean:
  - 작은 자들
  - 미천한 이들
  lexicon: μικροί
  rationale: 앞의 ‘큰 이들’과 대응되는 평행 구조를 살리기 위해 ‘작은 이들’로 옮겼고, 가치판단을 덧씌우는 표현은 피했습니다.
- source_word: σύγκρασίς τις
  english_pob_choice: a certain blending
  chosen_korean: 어떤 섞임
  alternatives_korean:
  - 어떤 혼합
  - 일정한 조화
  lexicon: σύγκρασις
  rationale: 그리스어의 추상명사와 불특정성(τις)을 반영해 ‘어떤 섞임’으로 옮겼으며, 해석을 ‘조화’로 좁혀 원문의 중립성을 약화시키지 않았습니다.
- source_word: χρῆσις
  english_pob_choice: usefulness
  chosen_korean: 유익
  alternatives_korean:
  - 쓸모
  - 사용됨
  - 유용성
  lexicon: χρῆσις
  rationale: 문맥상 기능적 가치와 실제적 유익을 가리키므로, 한국어에서 가장 간결하고 자연스러운 ‘유익’을 채택했습니다.
theological_decisions:
- issue: 상호의존성과 전체성의 강조
  chosen_reading: ‘큰 이들’과 ‘작은 이들’은 서로 없이 존재할 수 없으며, 모든 것 안에 섞임이 있고 그 안에 유익이 있다는 뜻으로 유지했습니다.
  alternative_readings:
  - 서열의 우열을 말하는 진술로 좁히는 해석
  - ‘유익’을 단지 개인적 편익으로 제한하는 해석
  rationale: 문장은 공동체 안의 상호의존과 질서 있는 결합을 강조하므로, 위계적 우열로 환원하지 않고 원문의 균형을 살렸습니다.
  doctrine_reference: 교회론/공동체 윤리
