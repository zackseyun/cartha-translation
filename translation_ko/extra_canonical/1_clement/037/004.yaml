  to: 큰 자들은 작은 자들 없이 존재할 수 없고, 작은 자들도 큰 자들 없이 존재할 수 없습니다. 모든 것에는 어떤 혼합이 있으며, 그 안에는 쓰임이 있습니다.
  rationale: 현대 한국어의 자연스러움을 위해 명사화된 대조 표현을 ‘큰 자들/작은 자들’로 다듬었습니다. ‘모든 것’과 ‘그 안’은 πᾶσιν 및 복수형 ἐν τούτοις를 각각 보존하며, ‘어떤 혼합’은 σύγκρασίς τις의 중립적이고 불특정적인 표현을 유지합니다. 근거 없이 남아 있는 각주 표지는 삭제했습니다.
