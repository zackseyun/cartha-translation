base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
  footnotes:
  - marker: a
    text: Or 'nor so on'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 사람이 총독이나 천부장이나 백부장이나 오십부장, 또는 그 밖에 차례대로 이어지는 직책을 맡는 것은 아닙니다. 그러나 각 사람은 자기 대열에서 왕과 지도자들이 내린 명령을 수행합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαρχοι
  english_pob_choice: prefects
  chosen_korean: 총독
