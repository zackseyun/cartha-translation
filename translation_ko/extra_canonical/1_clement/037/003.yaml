id: 1CLEM.37.3
reference: 1 Clement 37:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὐ πάντες εἰσὶν ἔπαρχοι οὐδὲ χιλίαρχοι οὐδὲ ἑκατόνταρχοι οὐδὲ πεντηκόνταρχοι οὐδὲ τὸ καϑεξῆς, ἀλλ’ ἕκαστος ἐν τῷ ἰδίῳ τάγματι τὰ ἐπιτασσόμενα ὑπὸ τοῦ βασιλέως καὶ τῶν ἡγουμένων ἐπιτελεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/037/003.yaml
  text: Not all are prefects[a], nor tribunes, nor centurions, nor commanders of fifty, nor so on in order; but each, in his own rank, carries out the orders given by the king and by the leaders.
  footnotes:
  - marker: a
    text: Or 'nor so on'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 사람이 총독도 아니고, 천부장도 아니고, 백부장도 아니고, 오십부장도 아니고, 그 밖의 순서대로 된 사람들도 아닙니다. 그러나 각 사람은 자기의 고유한 대열 안에서 왕과 지도자들에게서 받은 명령을 수행합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαρχοι
  english_pob_choice: prefects
  chosen_korean: 총독
  alternatives_korean:
  - 장관
  - 지사
  - 감독관
  lexicon: ἔπαρχος
  rationale: 로마 군사·행정 계층의 최상위 장으로서 한국어 성경식으로는 ‘총독’이 가장 자연스럽고 위계도 잘 드러냅니다.
- source_word: χιλίαρχοι / ἑκατόνταρχοι / πεντηκόνταρχοι
  english_pob_choice: tribunes / centurions / commanders of fifty
  chosen_korean: 천부장 / 백부장 / 오십부장
  alternatives_korean:
  - 군단장 / 중대장 / 오십 명의 지휘관
  lexicon: χιλίαρχος / ἑκατόνταρχος / πεντηκόνταρχος
  rationale: 원문의 숫자 접두사를 살린 직함이어서, 한국어에서도 대응되는 전통적 군직 명칭으로 계층 구조를 선명하게 보존했습니다.
- source_word: τὸ καθεξῆς
  english_pob_choice: nor so on in order
  chosen_korean: 그 밖의 순서대로 된 사람들
  alternatives_korean:
  - 그 밖의 차례대로 된 사람들
  - 그 나머지 순서의 사람들
  lexicon: τὸ καθεξῆς
  rationale: 단순한 ‘등등’이 아니라 ‘차례를 따라 이어지는 것’을 뜻하므로, 순차적 하위 계층을 가리키는 표현으로 풀어 옮겼습니다.
- source_word: ἡγουμένων
  english_pob_choice: leaders
  chosen_korean: 지도자들
  alternatives_korean:
  - 우두머리들
  - 지휘관들
  - 인도자들
  lexicon: ἡγούμενος
  rationale: 군사적 호칭으로 좁히지 않고, 원문의 더 넓은 의미인 ‘이끄는 사람들’을 살려 ‘지도자들’로 옮겼습니다.
theological_decisions:
- issue: 명령의 출처와 권위 구조
  chosen_reading: 왕과 지도자들에게서 받은 명령을 수행합니다
  alternative_readings:
  - 왕과 지도자들의 명령을 수행합니다
  - 왕과 지도자들이 명하는 것을 실행합니다
  rationale: 원문은 ‘명령된 것들’을 수행한다고 말하므로, 명령의 수동적 수여와 복종의 구조를 드러내기 위해 ‘받은 명령’으로 옮겼습니다.
  doctrine_reference: 질서와 복종에 대한 교회-공동체적 권위 이해
