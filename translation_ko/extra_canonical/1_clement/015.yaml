base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/015.yaml
  text: Therefore let us join ourselves to those who live in peace with godliness[a], and not to those who desire peace with hypocrisy. For somewhere it says, “This people honors me with their lips, but their heart is far from me.” And again, “With their mouth they were blessing, but with their heart they were cursing.” And again it says, “They loved him with their mouth, and with their tongue they lied to him; but their heart was not upright with him, nor were they faithful in his covenant.” Because of this, let the deceitful lips that speak lawlessness against the righteous become mute. And again, “May the Lord destroy all deceitful lips, the boastful tongue, those who say, ‘We will make our tongue great; our lips are our own; who is lord over us?’” “‘Because of the misery of the poor and because of the groaning of the needy, now I will arise,’ says the Lord. ‘I will set him in safety[b][c][d][e]; I will speak openly in him.’”
  footnotes:
  - marker: a
    text: Or 'let us cling to those who live at peace with godliness.'
    reason: lexical_alternative
    anchor_ref: '15:1'
  - marker: e
    text: '''Were found faithful'' may also be rendered ''were steadfast'' or ''proved trustworthy.'''
    reason: lexical_alternative
    anchor_ref: '15:4'
  - marker: d
    text: The wording echoes Psalmic imprecations against deceitful and arrogant speech.
    reason: cross_reference
    anchor_ref: '15:5'
  - marker: c
    text: The final clause is difficult. It may also be understood as 'I will act boldly in him' or, less likely, with a different nuance of the prepositional phrase.
    reason: alternative_reading
    anchor_ref: '15:7'
  - marker: b
    text: Or 'make peace with godliness, and not to those who want peace with hypocrisy'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리는 경건하게 평화 가운데 사는 이들과 붙어 지내고, 위선으로 평화를 바라보는 이들과는 그러지 말아야 합니다. 어딘가에서 이렇게 말씀합니다. 「이 백성은 입술로는 나를 공경하지만, 그들의 마음은 나에게서 멉니다.」 또 다시, 「그들의 입으로는 복을 빌었지만, 그들의 마음으로는 저주하였습니다.」 또 다시 말씀하십니다. 「그들은 입으로 그를 사랑하고, 혀로는 그에게 거짓말하였으나, 그들의 마음은 그와 바르지 않았고, 그의 언약 안에서 신실하지도 않았습니다.」 그러므로 속이는 입술들, 곧 의로운 이들에게 불법을 말하는 입술들은 잠잠해지게 하십시오. 또 다시, 「주께서 모든 속이는 입술과 거만한 혀를 멸하십니다. ‘우리는 우리의 혀를 크게 하며, 우리의 입술은 우리 편에 있으니, 누가 우리 위에 주인인가?’라고 말하는 자들을 멸하십니다. ‘가난한 이들의 비참함과 궁핍한 이들의 탄식 때문에, 이제 내가 일어나겠다’라고 주께서 말씀하십니다. ‘내가 그를 안전하게 두겠다[b][c][d][e]; 내가 그 안에서 담대히 말하겠다.’」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν
  english_pob_choice: let us join ourselves
  chosen_korean: 붙어 지내고
  alternatives_korean:
  - 달라붙읍시다
  - 결합합시다
  - 연합합시다
  lexicon: BDAG
  rationale: 권고의 힘과 의도적 결속을 살리면서도 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: μετ᾽ εὐσεβείας εἰρηνεύουσιν
  english_pob_choice: those who live in peace with godliness
  chosen_korean: 경건하게 평화 가운데 사는 이들
  alternatives_korean:
  - 경건과 함께 평화롭게 사는 이들
  - 경건 속에서 평화를 누리는 이들
  lexicon: BDAG
  rationale: εὐσέβεια의 종교적·윤리적 색채를 ‘경건하게’로, εἰρηνεύω의 ‘평화 가운데 살다’는 뜻을 ‘평화 가운데 사는’으로 살렸습니다.
- source_word: μεθ᾽ ὑποκρίσεως βουλομένοις εἰρήνην
  english_pob_choice: those who desire peace with hypocrisy
  chosen_korean: 위선으로 평화를 바라보는 이들
  alternatives_korean:
  - 위선으로 평화를 원하는 이들
  - 위선을 품고 평화를 추구하는 이들
  lexicon: BDAG
  rationale: ‘with hypocrisy’의 동반/방식 의미를 ‘위선으로’로 옮겨 대조를 선명하게 했습니다.
- source_word: ἐπιστώθησαν
  english_pob_choice: were found faithful
  chosen_korean: 신실하지도 않았습니다
  alternatives_korean:
  - 신실하다고 여겨지지 않았습니다
  - 신뢰할 만하지도 않았습니다
  lexicon: BDAG
  rationale: 언약 문맥에서 단순한 정보가 아니라 언약에 대한 신실함을 가리키므로 ‘신실하다’로 옮겼습니다.
- source_word: ἀνομίαν
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 악행
  - 무법
  lexicon: BDAG
  rationale: 성경적 어휘로서 하나님 질서에 어긋나는 상태를 ‘불법’으로 간명하게 전달합니다.
- source_word: παρρησιάσομαι ἐν αὐτῷ
  english_pob_choice: I will speak openly in him
  chosen_korean: 내가 그 안에서 담대히 말하겠다
  alternatives_korean:
  - 내가 그 안에서 공개적으로 말하겠다
  - 내가 그 안에서 자유롭게 말하겠다
  lexicon: BDAG
  rationale: παρρησιάζομαι의 핵심인 공개적·담대한 발화를 살리되, 한국어에서는 ‘담대히 말하겠다’가 가장 자연스럽습니다.
theological_decisions:
- issue: κύριος와 উদ্ধ직 উদ্ধ উদ্ধ引用 in the Psalm citations
  chosen_reading: 주로 일관되게 옮기되, 본문 전체의 시편 인용이라는 점을 유지했습니다.
  alternative_readings:
  - 주님
  - 주인
  rationale: 인용된 시편 전승의 권위를 살리면서도, 마지막 질문에서는 권위에 대한 반항적 뉘앙스를 드러내기 위해 ‘주인’보다 ‘주’가 기본이 되도록 했습니다.
  doctrine_reference: POB key-term consistency; preserve scriptural quotation texture
- issue: 마지막 절의 παρρησιάσομαι ἐν αὐτῷ
  chosen_reading: ‘그 안에서 담대히 말하겠다’로 두어, 발화의 공개성과 담대함을 함께 보존했습니다.
  alternative_readings:
  - 그 안에서 공개적으로 말하겠다
  - 그 안에서 크게 말하겠다
  rationale: 그리스어의 핵심은 단순한 행동이 아니라 공개적 발화이므로, 의미를 과도하게 특정하지 않고 담대함을 남겼습니다.
  doctrine_reference: preserve ambiguity rather than over-resolve
