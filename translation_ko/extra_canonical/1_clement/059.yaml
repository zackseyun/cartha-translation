  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/059.yaml
  text: 'But if some disobey the things spoken by him through us[a], let them know that they will entangle themselves in transgression and in no small danger. But we will be innocent of this sin, and we will ask, making earnest prayer and supplication, that the Creator of all may keep intact throughout the whole world the number of his elect that has been counted, through his beloved child Jesus the Messiah, through whom he called us from darkness into light, from ignorance into the full knowledge of the glory of his name,


    to hope in your name, the source from which all creation first came, having opened the eyes of our heart so that we might know you, the only Highest among the highest, holy, resting among the holy; the one who humbles the insolence of the proud, who breaks up the designs of the nations, who raises the lowly on high and humbles the lofty, who makes rich and makes poor, who kills and gives life and causes to live, the only benefactor of spirits and God of all flesh; who looks into the depths, the overseer of human deeds, the helper of those in danger, the savior of those without hope, the creator and overseer of every spirit; who multiplies nations upon the earth and from among them all chooses those who love you through Jesus the Messiah, your beloved child, through whom you trained us, sanctified us, and honored us.


    We ask you, Master, to be our helper and defender. Rescue those of us who are in affliction, have mercy on the lowly, raise up the fallen, show yourself to those in need, heal the weak, turn back those of your people who are wandering. Feed the hungry, ransom our prisoners, raise up the sick, encourage the fainthearted. Let all the nations know that you alone are God, and that Jesus the Messiah is your child[g][f][e][d][c][b], and that we are your people and the sheep of your pasture.'
  footnotes:
  - marker: a
    text: Or 'will bind themselves' or 'will involve themselves'; the Greek verb suggests bringing oneself into a state of liability.
    reason: lexical_alternative
  - marker: b
    text: '''Beloved child'' translates Greek παῖς, which can also mean ''servant'' or, in some contexts, ''son.'''
    reason: lexical_alternative
  - marker: c
    text: '''Jesus the Messiah'' could also be rendered ''Jesus Christ.'''
    reason: lexical_alternative
  - marker: d
    text: The phrase rendered 'the source from which all creation first came' is difficult and may also be understood as 'the origin of all creation.'
    reason: alternative_reading
  - marker: e
    text: Echoes biblical prayer language such as 'the sheep of your pasture' (cf. Ps 79:13; 95:7 LXX/MT numbering differs).
    reason: cross_reference
  - marker: f
    text: Or 'We ask you, Master, be our helper and defender.'.
    reason: previous_rendering
  - marker: g
    text: Or 'turn back the wandering of your people.'.
    reason: previous_rendering
translation:
  language: ko
  text: '만일 어떤 이들이 우리를 통해 그분이 하신 말씀에 불순종하면, 그들은 자신을 허물과 적지 않은 위험에 얽어매게 된다는 것을 알게 하십시오. 그러나 우리는 이 죄에 대하여 무죄일 것이며, 간절한 기도와 간구를 드리며, 만물의 창조주께서 그분의 사랑하시는 자녀 예수 메시아를 통해 온 세상에 걸쳐 이미 수를 헤아려 두신 그분의 택하신 이들의 수를 흠 없이 지켜 주시기를 구하겠습니다. 그분은 그분의 사랑하시는 자녀 예수 메시아를 통해 우리를 어둠에서 빛으로, 무지에서 그 이름의 영광에 대한 완전한 지식으로 부르신 분이십니다.


    그 이름은 모든 창조의 근원이시니, 우리 마음의 눈을 여셔서 우리가 지극히 높으신 이들 가운데서 홀로 지극히 높으신 분, 거룩한 이들 가운데서 쉬시는 거룩하신 분을 알게 하셨습니다. 그분은 교만한 자들의 오만을 낮추시고, 민족들의 계획을 무너뜨리시며, 낮은 이를 높이 올리시고 높은 이를 낮추시며, 부유하게도 하시고 가난하게도 하시며, 죽이기도 하시고 살리기도 하시며 생명을 주시기도 하시는, 영들의 유일한 은혜로운 분이며 모든 육체의 하나님이십니다. 그분은 깊은 곳을 살피시고, 사람의 행위를 감독하시며, 위험에 처한 이들의 도움자이시고, 소망이 없는 이들의 구원자이시며, 모든 영의 창조주이시고 감독자이십니다. 그분은 땅 위에 민족들을 많게 하시고, 그들 모두 가운데서 예수 메시아를 통해 주님을 사랑하는 이들을 택하셨습니다. 주님의 사랑하시는 자녀를 통해 우리를 훈련하시고, 거룩하게 하시고, 존귀하게 하셨습니다.


    우리는 주님께, 우리의 도우심과 방패가 되어 주시기를 구합니다. 환난 가운데 있는 우리를 건져 주시고, 낮은 자들을 긍휼히 여기시고, 넘어졌던 이들을 일으켜 세우시고, 필요한 이들에게 나타나시고, 약한 이들을 고쳐 주시고, 주님의 백성 가운데서 방황하는 이들을 돌이켜 주십시오. 주린 이들을 먹이시고, 우리의 포로들을 속량하시고, 병든 이들을 일으켜 세우시고, 낙심한 이들을 격려해 주십시오. 모든 민족이 주님만이 하나님이시며 예수 메시아가 주님의 자녀이시고, 우리가 주님의 백성이며 주님의 초원의 양들임을 알게 하십시오.[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσωσιν
  english_pob_choice: disobey
  chosen_korean: 불순종하면
  alternatives_korean:
  - 말을 듣지 않으면
  - 순종하지 않으면
  lexicon: BDAG
  rationale: 단순한 비동의보다 권위 있는 말씀에 대한 불순종을 나타내므로, 경고문맥에 맞게 ‘불순종’으로 옮겼습니다.
- source_word: ἐνδήσουσιν
  english_pob_choice: will entangle themselves
  chosen_korean: 자신을 … 얽어매게 된다
  alternatives_korean:
  - 자신을 … 속박하게 된다
  - 자신을 … 얽히게 된다
  lexicon: LSJ
  rationale: 중간태의 자기-연루 의미를 살리면서도 한국어에서 자연스럽고 책임의 자초를 드러내는 표현으로 옮겼습니다.
- source_word: παῖς / Ἰησοῦ Χριστοῦ
  english_pob_choice: his beloved child Jesus the Messiah
  chosen_korean: 그분의 사랑하시는 자녀 예수 메시아
  alternatives_korean:
  - 그분의 사랑하시는 종 예수 메시아
  - 그분의 사랑하시는 아들 예수 그리스도
  lexicon: BDAG
  rationale: παῖς의 의미 범위를 좁히지 않기 위해 ‘자녀’를 택했고, Χριστός는 직함으로서 ‘메시아’로 옮겼습니다.
- source_word: ἀρχέγονον πάσης κτίσεως
  english_pob_choice: the source from which all creation first came
  chosen_korean: 모든 창조의 근원
  alternatives_korean:
  - 모든 창조의 기원
  - 모든 피조물의 근원
  lexicon: LSJ
  rationale: 난해한 압축 표현이므로, 기도문의 형식을 해치지 않으면서 원초적 기원을 나타내는 ‘근원’으로 간결하게 살렸습니다.
- source_word: ὕψιστον ἐν ὑψίστοις
  english_pob_choice: the only Highest among the highest
  chosen_korean: 지극히 높으신 이들 가운데서 홀로 지극히 높으신 분
  alternatives_korean:
  - 가장 높은 이들 가운데 홀로 가장 높으신 분
  - 지극히 높은 이들 중 홀로 지극히 높으신 분
  lexicon: LSJ
  rationale: 중첩된 최상급과 찬송조의 반복을 유지하기 위해 직설적으로 옮겼습니다.
- source_word: ἐπιφάνηθι
  english_pob_choice: show yourself
  chosen_korean: 나타나시고
  alternatives_korean:
  - 보여 주시고
  - 드러나시고
  lexicon: BDAG
  rationale: 기도문에서 신적 개입을 구하는 직접성을 살리면서도 한국어 공손체에 맞게 ‘나타나시고’로 표현했습니다.
theological_decisions:
- issue: Χριστός의 번역
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 본문에서 직함으로 기능하므로, 프로젝트 원칙에 따라 관습적 음역보다 의미 번역을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Translate titles; transliterate names.'
- issue: 예수에 대한 παῖς의 처리
  chosen_reading: 자녀
  alternative_readings:
  - 종
  - 아들
  rationale: 본문은 친자 관계와 종속 가능성을 함께 열어 두므로, 어느 한쪽으로 신학적 긴장을 해소하지 않도록 ‘자녀’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
- issue: 공적 기도문의 호칭과 명령형
  chosen_reading: 주님께 … 주십시오
  alternative_readings:
  - 하나님께 … 하소서
  - 주여 …
  rationale: 한국어 합쇼체의 공적 기도문으로 자연스럽게 옮기되, 직접 청원하는 청유형을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Maintain register appropriate to direct address to God.'
