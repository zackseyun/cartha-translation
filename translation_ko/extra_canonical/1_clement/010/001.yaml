id: 1CLEM.10.1
reference: 1 Clement 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἀβραὰμ, ὁ φίλος προσαγορευθείς, πιστὸς εὑρέθη ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι τοῖς ῥήμασιν τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/001.yaml
  text: Abraham, who was called the friend, was found faithful by becoming obedient to the words of God.
  footnotes:
  - marker: a
    text: Or 'in that he became obedient'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함은 “친구”라고 불렸고, 하나님의 말씀들에 순종함으로써 충실한 사람으로 드러났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ φίλος προσαγορευθείς
  english_pob_choice: who was called the friend
  chosen_korean: “친구”라고 불렸고
  alternatives_korean:
  - 친구로 불렸고
  - 하나님의 친구라고 불렸고
  lexicon: φίλος
  rationale: 원문은 정관사와 수동 분사로 ‘그 친구라고 불린’이라는 호칭을 말하며, 한국어에서는 간결하게 “친구”라고 불렸고로 옮기면 호칭의 사실을 살리면서도 과도한 설명을 덧붙이지 않습니다.
- source_word: πιστὸς εὑρέθη
  english_pob_choice: was found faithful
  chosen_korean: 충실한 사람으로 드러났습니다
  alternatives_korean:
  - 믿음직한 사람으로 드러났습니다
  - 신실한 것으로 판명되었습니다
  lexicon: πιστός
  rationale: πιστός는 단순 감정적 ‘믿음’보다 대상에게 검증된 신실함/충실함을 가리키므로, 인물 평가 문맥에 맞게 ‘충실한 사람으로 드러났습니다’로 옮겼습니다.
- source_word: ἐν τῷ αὐτὸν ὑπήκοον γενέσθαι
  english_pob_choice: by becoming obedient
  chosen_korean: 순종함으로써
  alternatives_korean:
  - 그가 순종하게 됨으로써
  - 그가 순종한 가운데
  lexicon: ὑπήκοος
  rationale: 개정된 영어 해석처럼 ἐν + 부정사 구문은 수단/동반 상황을 나타내므로, 한국어에서는 자연스럽고 원문의 인과를 분명히 드러내는 ‘순종함으로써’를 택했습니다.
- source_word: τοῖς ῥήμασιν τοῦ θεοῦ
  english_pob_choice: the words of God
  chosen_korean: 하나님의 말씀들
  alternatives_korean:
  - 하나님의 말씀에
  - 하나님의 말씀들을
  lexicon: ῥῆμα
  rationale: ῥήματα는 복수형으로, 단수화하지 않고 ‘말씀들’로 살려 아브라함이 여러 말씀 전체에 응답한 뉘앙스를 보존했습니다.
theological_decisions:
- issue: faithfulness as evaluated outcome rather than innate trait
  chosen_reading: 아브라함의 πιστός는 선천적 성품 진술보다 하나님의 말씀에 대한 순종을 통해 입증된 충실함을 뜻합니다.
  alternative_readings:
  - 아브라함이 본래 신실한 사람이라는 진술
  - 아브라함의 믿음 자체를 강조하는 진술
  rationale: 문장은 ‘불려짐’과 ‘순종함으로써’라는 행위 근거를 연결해 믿음의 내적 상태보다 순종으로 검증된 충실성을 강조합니다.
  doctrine_reference: 창 15:6의 믿음-순종 연계와 1클레멘스의 도덕적 권면 문맥
