id: 1CLEM.10.6
reference: 1 Clement 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ πάλιν λέγει· Ἐξήγαγεν ὁ θεὸς τὸν Ἀβραὰμ καὶ εἶπεν αὐτῷ· Ἀνάβλεψον εἰς τὸν οὐρανὸν καὶ ἀρίθμησον τοὺς ἀστέρας, εἰ δυνήσῃ ἐξαριθμῆσαι αὐτούς· οὕτως ἔσται τὸ σπέρμα σου. ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/006.yaml
  text: And again he says[a], “God brought Abraham out and said to him, ‘Look up to heaven and count the stars, if you are able to count them; so will your offspring be.’ And Abraham believed God, and it was counted to him as righteousness.”
  footnotes:
  - marker: a
    text: Or 'so will your seed be.’” And Abraham believed God, and it was counted to him for righteousness.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 다시 말씀하십니다. 「하나님께서 아브라함을 이끌어 내시고 그에게 말씀하셨습니다. ‘하늘을 바라보고 별들을 세어 보아라. 네가 그것들을 셀 수 있다면 말이다. 네 후손이 이와 같을 것이다.’ 아브라함은 하나님을 믿었고, 그것이 그에게 의로 여겨졌습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘네 씨가 이와 같을 것이다.’
    reason: σπέρμα의 문자적 표현을 보존하면서, 본문에서는 집합적 의미를 자연스러운 한국어 ‘후손’으로 옮겼습니다.
lexical_decisions:
- source_word: τὸν Ἀβραὰμ / Ἀβραὰμ
  english_pob_choice: Abraham
  chosen_korean: 아브라함
  alternatives_korean:
  - 아브라함
  lexicon: 고유명사
  rationale: 한국어 성경에서 널리 쓰이는 표기를 따랐습니다.
- source_word: τὸ σπέρμα σου
  english_pob_choice: your offspring / your seed
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 후손
  - 네 자손
  - 네 씨앗
  lexicon: σπέρμα
  rationale: σπέρμα의 직역인 ‘씨’를 유지해 창세기 인용의 언어적 연결을 보존했습니다. POB의 ‘offspring’는 자연스러운 영어화이지만, 한국어에서는 문맥상 비유적 ‘씨’가 더 직접적입니다.
- source_word: ἐλογίσθη αὐτῷ εἰς δικαιοσύνην
  english_pob_choice: it was counted to him as righteousness
  chosen_korean: 그에게 의로 여겨졌습니다
  alternatives_korean:
  - 그에게 의로 간주되었습니다
  - 그에게 의로 계산되었습니다
  - 그에게 의로 인정되었습니다
  lexicon: λογίζομαι + εἰς δικαιοσύνην
  rationale: εἰς δικαιοσύνην의 평가적·법정적 의미를 살리되, 한국어에서는 ‘의로 여겨지다’가 가장 자연스럽고 공적 문맥에 맞습니다.
- source_word: ἐξήγαγεν ὁ θεὸς
  english_pob_choice: God brought ... out
  chosen_korean: 하나님이 ... 이끌어 내시고
  alternatives_korean:
  - 하나님이 ... 데리고 나오시고
  - 하나님이 ... 밖으로 이끄시고
  lexicon: ἐξάγω
  rationale: 단순한 이동보다 하나님의 주도적 인도를 드러내기 위해 ‘이끌어 내시고’로 옮겼습니다.
theological_decisions:
- issue: 창세기 15:5-6 인용의 연속성
  chosen_reading: ‘그리고 다시 이렇게 말씀하십니다’ 뒤의 인용을 한 번에 이어, 아브라함의 믿음과 의로 여겨짐까지 하나의 연속된 성구 인용으로 처리했습니다.
  alternative_readings:
  - 아브라함의 믿음 문장을 바깥 서술로 분리하는 번역
  - 인용부호를 중간에 닫아 본문과 성구 인용을 분리하는 번역
  rationale: 그리스어는 καὶ πάλιν λέγει로 시작하는 단일 인용 흐름이며, 구분을 잘못하면 아브라함의 믿음 문장이 저자 서술처럼 오해될 수 있습니다.
  doctrine_reference: 성경 인용 구조와 문맥 일관성
- issue: εἰς δικαιοσύνην의 의미
  chosen_reading: ‘의로 여겨졌습니다’로 번역해, 공로가 아니라 하나님의 평가/선언이라는 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘의로 계산되었습니다’
  - ‘의로 인정되었습니다’
  rationale: 본문은 아브라함의 믿음이 하나님 앞에서 의로 간주되었다는 진술이므로, 행위 공로적 표현으로 흐르지 않도록 했습니다.
  doctrine_reference: 칭의와 믿음의 관계
