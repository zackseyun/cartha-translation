- from: 그리고 다시 이렇게 말씀하십니다. 「하나님이 아브라함을 이끌어 내시고 그에게 말씀하셨습니다. ‘하늘을 우러러 별들을 세어 보아라. 네가 그것들을 셀 수 있다면 말이다. 네 씨가 이와 같을 것이다.’ 아브라함은 하나님을 믿었고, 그것이 그에게 의로 여겨졌습니다.”[a]
  to: 그리고 다시 말씀하십니다. 「하나님께서 아브라함을 이끌어 내시고 그에게 말씀하셨습니다. ‘하늘을 바라보고 별들을 세어 보아라. 네가 그것들을 셀 수 있다면 말이다. 네 후손이 이와 같을 것이다.’ 아브라함은 하나님을 믿었고, 그것이 그에게 의로 여겨졌습니다.」[a]
