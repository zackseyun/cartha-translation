id: 1CLEM.10.3
reference: 1 Clement 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἄπελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ ποιήσω σε εἰς ἔθνος μέγα καὶ εὐλογήσω σε καὶ μεγαλυνῶ τὸ ὄνομά σου, καὶ ἔσῃ εὐλογημένος· καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε καὶ καταράσομαι τοὺς καταρωμένους σε, καὶ εὐλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/003.yaml
  text: “Depart from your land and from your kindred and from your father’s house to the land that I will show you; and I will make you into a great nation[a], and I will bless you and magnify your name, and you will be blessed. And I will bless those who bless you, and I will curse those who curse you, and in you all the tribes of the earth will be blessed.”
  footnotes:
  - marker: a
    text: Or 'Go out'.
    reason: previous_rendering
translation:
  language: ko
  text: “네 땅과 네 친족과 네 아버지의 집을 떠나, 내가 네게 보여 줄 땅으로 가십시오. 내가 너를 큰 민족이 되게 하고, 네 이름을 크게 하며, 너는 복을 받을 것입니다. 또 내가 너를 축복하는 자들을 축복하고, 너를 저주하는 자들을 저주할 것이며, 땅의 모든 지파가 너로 말미암아 복을 받을 것입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄπελθε
  english_pob_choice: Depart
  chosen_korean: 떠나
  alternatives_korean:
  - 가십시오
  - 나가십시오
  lexicon: ἀπέρχομαι
  rationale: Clement의 동사는 LXX의 Ἔξελθε보다 Ἄπελθε이므로, 단순한 ‘나가라’보다 관계와 거처를 끊고 이동하라는 뉘앙스를 살린 ‘떠나’가 더 정확합니다.
- source_word: εἰς τὴν γῆν
  english_pob_choice: to the land
  chosen_korean: …땅으로 가십시오
  alternatives_korean:
  - …땅에
  - …땅으로 들어가십시오
  lexicon: γῆ
  rationale: εἰς는 이 문맥에서 도착 방향을 나타내므로, 한국어에서는 ‘~으로 가십시오’가 가장 자연스럽고 원문의 이동 방향을 잘 드러냅니다.
- source_word: καὶ μεγαλυνῶ τὸ ὄνομά σου
  english_pob_choice: and magnify your name
  chosen_korean: 네 이름을 크게 하며
  alternatives_korean:
  - 네 이름을 높이며
  - 네 이름을 영화롭게 하며
  lexicon: μεγαλύνω
  rationale: μεγαλύνω의 핵심인 ‘크게 하다/크게 되게 하다’를 직접 살려, 명성을 부여한다는 의미를 과장 없이 표현했습니다.
- source_word: ἔσῃ εὐλογημένος
  english_pob_choice: you will be blessed
  chosen_korean: 너는 복을 받을 것입니다
  alternatives_korean:
  - 네가 복되게 될 것입니다
  - 너는 복받은 자가 될 것입니다
  lexicon: εὐλογημένος
  rationale: 수동형 결과를 자연스러운 한국어로 옮기되, 축복의 선언이라는 점이 분명하도록 ‘복을 받을 것입니다’를 택했습니다.
theological_decisions:
- issue: “I will bless” / “I will curse” and covenantal blessing language
  chosen_reading: 하나님이 아브라함을 통해 복과 저주를 실제로 선언하시는 언약적 표현으로 그대로 유지했습니다.
  alternative_readings:
  - 도덕적 원칙으로 완화하는 번역
  - 완곡하게 ‘좋게 하다/해롭게 하다’로 바꾸는 번역
  rationale: 본문은 언약적 축복과 저주의 강한 선언을 담고 있으므로, 그 힘을 약화시키지 않고 직설적으로 옮기는 것이 원문의 목적을 더 잘 드러냅니다.
  doctrine_reference: 창 12:1-3 전승의 언약적 축복 구조
- issue: “in you all the tribes of the earth will be blessed”
  chosen_reading: ‘너로 말미암아’로 인과·매개 관계를 드러냈습니다.
  alternative_readings:
  - ‘네 안에서’
  - ‘네 안에’
  rationale: εὐλογηθήσονται ἐν σοὶ는 단순한 내재보다 매개/통로의 의미가 강하므로, 한국어는 ‘너로 말미암아’가 의미를 더 정확히 전달합니다.
  doctrine_reference: 아브라함을 통한 열방 축복의 약속
