  source_fidelity: 그리스어의 단수 명령 Ἄπελθε와 미래형 약속들의 구조는 대체로 충실히 반영되었습니다. 다만 ‘떠나’는 합쇼체 명령문 안에서 문체가 불일치하므로 ‘떠나십시오’로 고쳐야 합니다. 또한 ἐν σοὶ는 문맥상 매개 의미로 이해될 수 있으나, ‘너로 말미암아’는 원문의 ‘너 안에서’라는 표현보다 해석을 한 단계 명시합니다. 논쟁 가능한 전치사 표현의 폭을 보존하도록 직역적 표현을 채택하는 것이 안전합니다.
  naturalness: ‘네 땅과 네 친족과 네 아버지의 집을 떠나십시오. 내가 네게 보여 줄 땅으로 가십시오’는 현대 표준어 합쇼체로 자연스럽고, 원문의 명령과 목적지를 명료하게 전달합니다. 미래 약속의 병렬은 ‘할 것이며’로 맞추어 문장 연결을 자연스럽게 했습니다.
