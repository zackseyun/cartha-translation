  to: 또다시 그가 롯과 갈라선 뒤에 하나님께서 그에게 말씀하셨습니다. “눈을 들어, 지금 있는 곳에서 북쪽과 남쪽과 동쪽과 바다 쪽을 바라보십시오. 당신이 보는 모든 땅을 내가 당신과 당신의 자손에게 영원히 주겠습니다.”[a]
  rationale: 원문의 방위 열거에서 θάλασσαν을 ‘바다 쪽’으로 보존하여 ‘서쪽’이라는 해석적 구체화를 피했습니다. σπέρμα는 문맥상 ‘자손’으로 번역해 현대 한국어의 의미를 명확히 했습니다. διαχωρισθῆναι는 한국어의 자연스러운 상호 분리 표현인 ‘갈라선’으로 옮겼으며, 문장 전체를 합쇼체로 정리했습니다.
