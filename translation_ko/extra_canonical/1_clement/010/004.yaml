base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/004.yaml
  text: And again[a], when he was separated from Lot, God said to him, “Lift up your eyes and look from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see I will give to you and to your seed forever.”
  footnotes:
  - marker: a
    text: Or 'when he was separated from Lot, God said to him, “Lift up your eyes and see from the place where you now are, toward the north and the south and the east and the sea, because all the land that you see, I will give to you and to your seed forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또다시 그가 롯과 분리되었을 때, 하나님께서 그에게 말씀하셨습니다. “눈을 들어, 지금 네가 있는 그 자리에서 북쪽과 남쪽과 동쪽과 서쪽을 바라보아라. 네가 보는 그 온 땅을 내가 너와 네 씨에게 영원히 주겠다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ διαχωρισθῆναι αὐτὸν ἀπὸ Λὼτ
  english_pob_choice: when he was separated from Lot
  chosen_korean: 그가 롯과 분리되었을 때
  alternatives_korean:
  - 롯과 헤어졌을 때
  - 롯과 갈라섰을 때
  lexicon: διαχωρίζω
  rationale: 수동/비의도적 뉘앙스를 살리되, 한국어에서는 자연스럽고 사건의 결과를 정확히 드러내는 ‘분리되다’가 가장 가깝습니다.
- source_word: ἴδε
  english_pob_choice: look
  chosen_korean: 바라보아라
  alternatives_korean:
  - 보아라
  - 쳐다보아라
  lexicon: ὁράω
  rationale: 지시와 이동 방향이 이어지는 문맥에서는 단순한 ‘보다’보다 시선을 들어 멀리 각 방향을 향해 살피는 뜻이 살아 있는 ‘바라보다’가 적절합니다.
- source_word: πρὸς βορρᾶν καὶ λίβα καὶ ἀνατολὰς καὶ θάλασσαν
  english_pob_choice: toward the north and the south and the east and the sea
  chosen_korean: 북쪽과 남쪽과 동쪽과 서쪽
  alternatives_korean:
  - 북쪽과 남쪽과 동쪽과 바다쪽
  - 북과 남과 동과 서
  lexicon: 방위 표현
  rationale: λίβα는 남쪽/남서쪽 계열이지만 본문은 네 방향을 포괄하는 열거로 기능하므로 한국어에서는 의미상 대응되는 기본 방위어로 정리했습니다.
- source_word: σπέρματί σου
  english_pob_choice: your seed
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 자손
  - 네 후손
  lexicon: σπέρμα
  rationale: POB의 ‘seed’를 그대로 살려 약속-언약 용어의 성경적 이중 의미를 유지하되, 한국어에서는 ‘네 씨’가 가장 직접적입니다.
theological_decisions:
- issue: Ἀναβλέψας… ἴδε의 시선 명령
  chosen_reading: “눈을 들어… 바라보아라”로 옮겨, 단순 인지보다 하나님의 약속을 향해 시선을 돌리라는 요구를 드러냈습니다.
  alternative_readings:
  - “눈을 들어… 보아라”
  - “올려다보고 보아라”
  rationale: 히브리어-그리스어 성경 전통의 관용구로서 시선의 전환과 약속의 확인을 함께 요구하는 표현이므로, 한국어에서도 그 동작성을 유지하는 것이 좋습니다.
  doctrine_reference: 창 13:14-17의 약속 재진술
