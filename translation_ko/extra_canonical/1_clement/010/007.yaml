source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ πίστιν καὶ φιλοξενίαν ἐδόθη αὐτῷ υἱὸς ἐν γήρᾳ, καὶ διʼ ὑπακοῆς προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ πρὸς ἓν τῶν ὀρέων ὧν ἔδειξεν αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/007.yaml
  text: Because of faith and hospitality a son was given to him in old age[a], and through obedience he offered him as a sacrifice to God on one of the mountains that he had shown him.
  footnotes:
  - marker: a
    text: Or 'that he showed him'.
    reason: previous_rendering
translation:
  language: ko
  text: 믿음과 나그네를 후대함으로 말미암아 그에게는 노년에 아들이 주어졌고, 순종으로 그는 그에게 보여 주신 산들 가운데 하나에서 그 아들을 하나님께 제물로 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ πίστιν καὶ φιλοξενίαν
  english_pob_choice: Because of faith and hospitality
  chosen_korean: 믿음과 나그네를 후대하는 마음 때문에
  alternatives_korean:
  - 믿음과 환대 때문에
  - 믿음과 객을 잘 대접함 때문에
  lexicon: πίστις, φιλοξενία
  rationale: φιλοξενία는 단순한 일반적 친절보다 ‘나그네를 후대함/환대함’의 뜻이 분명하므로, 현대 한국어에서 의미가 살아나는 표현으로 옮겼습니다.
- source_word: ἐδόθη αὐτῷ υἱὸς ἐν γήρᾳ
  english_pob_choice: a son was given to him in old age
  chosen_korean: 그에게 나이 들어 아들이 주어졌고
  alternatives_korean:
  - 그가 늙었을 때 아들이 주어졌고
  - 그가 노년에 아들을 받았고
  lexicon: ἐδόθη, ἐν γήρᾳ
  rationale: 수동태 ‘주어졌고’로 선물성·신적 수여의 뉘앙스를 살리고, ἐν γήρᾳ는 ‘나이 들어’로 자연스럽게 처리했습니다.
- source_word: προσήνεγκεν αὐτὸν θυσίαν τῷ θεῷ
  english_pob_choice: he offered him as a sacrifice to God
  chosen_korean: 그는 하나님께 그를 제물로 드렸습니다
  alternatives_korean:
  - 그를 하나님께 번제로 바쳤습니다
  - 그를 하나님께 희생제물로 드렸습니다
  lexicon: προσφέρω, θυσία, τῷ θεῷ
  rationale: θυσία를 ‘제물’로 옮겨 제사의 의미를 유지하되, 본문이 강조하는 행위를 현대 문체로 간결하게 표현했습니다.
- source_word: τῶν ὀρέων ὧν ἔδειξεν αὐτῷ
  english_pob_choice: one of the mountains that he had shown him
  chosen_korean: 하나님께서 그에게 보여 주신 산들 가운데 하나에서였습니다
  alternatives_korean:
  - 그가 그에게 보여 준 산들 가운데 하나에서였습니다
  - 그에게 보이신 산들 중 하나에서였습니다
  lexicon: ἔδειξεν
  rationale: English audit trail의 플루퍼펙트 처리를 반영해, 관계절의 주어를 문맥상 하나님으로 분명히 드러내되 과도한 재구성은 피했습니다.
theological_decisions:
- issue: ἔδειξεν의 주어와 관계절 시간관계
  chosen_reading: 산은 하나님께서 전에 아브라함에게 보여 주신 것으로 이해해 번역했습니다.
  alternative_readings:
  - 그가 아브라함에게 보여 준 산
  - 아브라함에게 그가 보여 준 산
  rationale: 본문의 논리상 제물을 드린 행위보다 먼저 산을 보여 준 주체는 하나님으로 읽는 것이 자연스럽고, 영어 POB의 수정 취지도 이 점을 분명히 합니다.
  doctrine_reference: 서사 문맥 해석
