id: 1CLEM.10.5
reference: 1 Clement 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: καὶ ποιήσω τὸ σπέρμα σου ὡς τὴν ἄμμον τῆς γῆς· εἰ δύναταί τις ἐξαριθμῆσαι τὴν ἄμμον τῆς γῆς, καὶ τὸ σπέρμα σου ἐξαριθμηθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/005.yaml
  text: And I will make your seed like the sand of the earth; if anyone is able to count the sand of the earth, your seed also will be counted.”
translation:
  language: ko
  text: 그리고 내가 너의 씨를 땅의 모래처럼 만들겠습니다. 만일 누군가 땅의 모래를 헤아릴 수 있다면, 너의 씨도 헤아려질 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσω
  english_pob_choice: I will make
  chosen_korean: 만들겠다고 하겠습니다
  alternatives_korean:
  - 만들겠습니다
  - 만들어 주겠습니다
  lexicon: ποιέω
  rationale: 미래적 약속을 분명히 하면서, 원문의 선언적 톤을 자연스러운 합쇼체로 옮겼습니다.
- source_word: σπέρμα
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 후손
  lexicon: σπέρμα
  rationale: 영어 POB의 seed를 직접 반영하되, 문맥상 후손을 뜻하는 비유적 표현으로 한국어에서도 자연스럽게 읽히도록 했습니다.
- source_word: ὡς τὴν ἄμμον τῆς γῆς
  english_pob_choice: like the sand of the earth
  chosen_korean: 땅의 모래처럼
  alternatives_korean:
  - 땅의 모래 같게
  - 땅 위의 모래처럼
  lexicon: ἄμμος / γῆ
  rationale: 원문의 비교구문 ὡς를 한국어 부사형 '-처럼'으로 살려, 성경적 익숙함보다 원문 구조를 우선했습니다.
- source_word: ἐξαριθμῆσαι / ἐξαριθμηθήσεται
  english_pob_choice: count / will be counted
  chosen_korean: 셀 수 있다 / 셀 수 있을 것입니다
  alternatives_korean:
  - 헤아릴 수 있다 / 헤아려질 것입니다
  - 셀 수 있으면 / 셀 수 있게 될 것입니다
  lexicon: ἐξαριθμέω
  rationale: 반복되는 동사를 동일 어휘군으로 맞춰 원문의 대응성을 보존했고, 수동형은 한국어의 '셀 수 있을 것입니다'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 약속의 인용문 내 미래 서술의 처리
  chosen_reading: 하나님의 약속을 직접 인용하는 형식으로, 한국어에서도 미래 약속의 확정성을 유지했습니다.
  alternative_readings:
  - 현재형으로 풀어 '만들어 드리겠습니다'처럼 완화
  - 서술형으로 '만드신다'로 전환
  rationale: 원문은 인용 속에서 장래의 확정된 약속을 말하므로, 한국어도 예언적/약속적 미래를 보존하는 것이 적절합니다.
  doctrine_reference: 약속의 신실성과 언약적 언어의 직접성
