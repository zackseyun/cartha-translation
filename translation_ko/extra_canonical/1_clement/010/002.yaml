id: 1CLEM.10.2
reference: 1 Clement 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὗτος δὲ ὑπακοῇ ἐξῆλθεν ἐκ τῆς γῆς αὐτοῦ καὶ ἐκ τῆς συγγενείας αὐτοῦ καὶ ἐκ τοῦ οἴκου τοῦ πατρὸς αὐτοῦ, ὅπως γῆν ὀλίγην καὶ συγγένειαν ἀσθενῆ καὶ οἶκον μικρὸν καταλιπὼν κληρονομήσῃ τὰς ἐπαγγελίας τοῦ θεοῦ. λέγει γὰρ αὐτῷ·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/010/002.yaml
  text: And in obedience he went out from his land and from his kindred and from his father’s house, so that, leaving behind a little land and a weak kindred and a small house, he might inherit the promises of God. For he says to him,
translation:
  language: ko
  text: '그는 순종하여 자기 땅과 친족과 아버지의 집에서 나갔습니다. 이는 적은 땅과 미약한 친족과 작은 집을 뒤로 남겨 두고 하나님의 약속을 상속받기 위해서였습니다. 그에게 말씀하시기를:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακοῇ
  english_pob_choice: in obedience
  chosen_korean: 순종하여
  alternatives_korean:
  - 순종으로
  - 복종하여
  lexicon: ὑπακοή
  rationale: 행위의 방식과 자발적 응답을 자연스럽게 살려, 단순한 명사구보다 동사적 표현인 ‘순종하여’로 옮겼습니다.
- source_word: γῆν ὀλίγην
  english_pob_choice: a little land
  chosen_korean: 작은 땅
  alternatives_korean:
  - 조금의 땅
  - 적은 땅
  lexicon: γῆ
  rationale: English audit trail의 ‘little land’를 반영하되, 한국어에서는 대상의 규모를 자연스럽게 드러내는 ‘작은 땅’이 가장 직역에 가깝고 읽기 쉽습니다.
- source_word: συγγένειαν ἀσθενῆ
  english_pob_choice: a weak kindred
  chosen_korean: 약한 친족
  alternatives_korean:
  - 연약한 친족
  - 미약한 친족
  lexicon: συγγένεια
  rationale: 혈연 집단을 가리키는 συγγένεια를 ‘친족’으로 옮기고, ἀσθενῆ의 상태를 ‘약한’으로 직역해 관계의 취약성을 유지했습니다.
- source_word: κληρονομήσῃ τὰς ἐπαγγελίας τοῦ θεοῦ
  english_pob_choice: might inherit the promises of God
  chosen_korean: 하나님의 약속을 상속받기 위함이었습니다
  alternatives_korean:
  - 하나님의 약속들을 상속받기 위함이었습니다
  - 하나님의 약속을 유업으로 받기 위함이었습니다
  lexicon: κληρονομέω / ἐπαγγελία
  rationale: κληρονομέω의 상속/유업 이미지를 한국어에서 자연스럽게 살리기 위해 ‘상속받다’를 사용했고, ἐπαγγελίας는 문맥상 묶음된 약속들을 가리키지만 통상적 집합표현으로 단수형 ‘약속’을 택했습니다.
theological_decisions:
- issue: 주어가 아브라함인지 명시되지 않는 인용 직전 서술
  chosen_reading: 원문 흐름대로 인용 대상의 이름을 덧붙이지 않고 ‘그는’으로 유지했습니다.
  alternative_readings:
  - 아브라함은 순종하여 …
  - 그 사람은 순종하여 …
  rationale: 이 절 자체는 앞문맥을 전제로 한 서술이므로, 본절 번역에서 인물을 임의로 명시하지 않는 것이 원문 의존성을 더 잘 드러냅니다.
  doctrine_reference: 문맥 추적 원칙
- issue: λέγει γὰρ αὐτῷ의 시제/도입 처리
  chosen_reading: ‘그에게 말씀하시기를:’로 처리해 뒤따를 직접 인용을 예고했습니다.
  alternative_readings:
  - ‘그에게 이르시기를:’
  - ‘그에게 말씀하십니다:’
  rationale: 현재형 역사서술의 생동감을 살리되, 이어지는 인용문을 자연스럽게 열기 위해 한국어에서 가장 무난한 인용 도입형으로 옮겼습니다.
  doctrine_reference: 인용 도입 관례
