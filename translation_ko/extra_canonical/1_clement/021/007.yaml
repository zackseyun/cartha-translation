source:
  edition: Funk 1901 (normalized OCR)
  text: τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος ἐνδειξάσθωσαν, τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα ἀποδειξάτωσαν, τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν, τὴν ἀγάπην αὐτῶν μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν τοῖς φοβουμένοις τὸν θεὸν ὁσίως ἴσην παρεχέτωσαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/007.yaml
  text: Let them show the lovely character of purity; let them demonstrate the sincere disposition of their gentleness; let them make the moderation of their tongue evident through silence; let them extend their love not according to partiality, but equally to all who fear God in holiness.
translation:
  language: ko
  text: 그들은 순결에서 드러나는 사랑스러운 품성을 보이고, 그들의 온유함의 순전한 뜻을 나타내며, 침묵을 통해 그들의 말의 절제를 분명히 하고, 편파성에 따라 하지 말고 하나님을 경외하는 모든 이에게 거룩하게 똑같은 사랑을 베풀어야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩하게’(그리스어 ὁσίως)는 문장 위치상 ‘하나님을 경외하는’과 사랑을 베푸는 행위 중 어느 쪽에 연결되는지 다소 열려 있습니다.
    reason: ὁσίως의 수식 범위에 관한 원문의 통사적 여지를 보존합니다.
lexical_decisions:
- source_word: τὸ ἀξιαγάπητον τῆς ἁγνείας ἦθος
  english_pob_choice: the lovely character of purity
  chosen_korean: 순결의 사랑스러운 품성
  alternatives_korean:
  - 순결의 아름다운 성품
  - 정결의 사랑스러운 품성
  lexicon: ἀξιαγάπητον / ἁγνεία / ἦθος
  rationale: ἀξιαγάπητον의 ‘사랑스러운’ 뉘앙스와 ἦθος의 인격적·품성적 의미를 살려, 단순한 도덕성보다 드러나야 할 ‘품성’으로 옮겼습니다.
- source_word: τὸ ἀκέραιον τῆς πραΰτητος αὐτῶν βούλημα
  english_pob_choice: the sincere disposition of their gentleness
  chosen_korean: 그들의 온유한 태도의 진실한 성향
  alternatives_korean:
  - 그들의 온유의 순전한 뜻
  - 그들의 온유한 성품의 진실한 의지
  lexicon: ἀκέραιον / πραΰτης / βούλημα
  rationale: βούλημα를 POB의 ‘disposition’에 맞춰 ‘성향’으로 옮기되, ἀκέραιον의 ‘흠없음·순전함’은 ‘진실한’으로 자연스럽게 반영했습니다.
- source_word: τὸ ἐπιεικὲς τῆς γλώσσης αὐτῶν διὰ τῆς σιγῆς φανερὸν ποιησάτωσαν
  english_pob_choice: let them make the moderation of their tongue evident through silence
  chosen_korean: 침묵을 통해 그들의 말의 절제를 분명히 하고
  alternatives_korean:
  - 침묵으로 그들의 혀의 온유함을 드러내고
  - 침묵을 통해 그들의 혀의 관용을 나타내고
  lexicon: ἐπιεικής / γλῶσσα / σιγή
  rationale: γλῶσσα를 직역한 ‘혀’보다 한국어에서 더 자연스러운 ‘말’을 택했고, ἐπιεικές의 절제·온건함을 ‘절제’로 압축했습니다.
- source_word: μὴ κατὰ προσκλίσεις, ἀλλὰ πᾶσιν ... ἴσην παρεχέτωσαν
  english_pob_choice: not according to partiality, but equally
  chosen_korean: 편파성에 따라가 아니라 ... 똑같이 사랑을 베풀어야 합니다
  alternatives_korean:
  - 편애에 따라가 아니라 ... 동일하게
  - 치우침에 따라가 아니라 ... 고르게
  lexicon: προσκλίσεις / ἴσην
  rationale: προσκλίσεις는 사람을 가르는 편향을 뜻하므로 ‘편파성’으로 옮겼고, ἴσην은 사랑의 양태를 살려 ‘똑같이’로 처리했습니다.
theological_decisions:
- issue: ‘하나님을 경외하는 모든 사람’의 범위와 거룩함의 결합
  chosen_reading: 거룩함 가운데 하나님을 경외하는 모든 사람
  alternative_readings:
  - 거룩하게 하나님을 경외하는 모든 사람
  - 거룩함으로 하나님을 경외하는 모든 사람
  rationale: ὁσίως는 단순 부사 ‘경건하게’보다 ‘거룩함 가운데’라는 상태·방식을 함께 드러내며, 문장 끝의 수식으로 사랑의 보편성과 성결의 조건을 동시에 보존합니다.
  doctrine_reference: 경건/성결 어휘의 문맥적 번역
