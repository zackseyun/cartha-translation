    rationale: ‘순결의 사랑스러운 품성’은 직역적 소유격 연결로 다소 딱딱합니다. ‘순결에서 드러나는 사랑스러운 품성’이 ἁγνεία와 ἦθος의 관계를 자연스럽게 전달합니다.
