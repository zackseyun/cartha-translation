id: 1CLEM.21.3
reference: 1 Clement 21:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἴδωμεν, πῶς ἐγγύς ἐστιν, καὶ ὅτι οὐδὲν λέληθεν αὐτὸν τῶν ἐννοιῶν ἡμῶν οὐδὲ τῶν διαλογισμῶν ὧν ποιούμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/003.yaml
  text: Let us see how near he is[a], and that nothing of our thoughts nor of the reasonings we make has escaped his notice.
  footnotes:
  - marker: a
    text: Or 'the reasonings we carry on'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분이 얼마나 가까이 계신지, 또 우리의 생각 가운데서도, 우리가 만들어 내는 추론들 가운데서도 아무것도 그분의 눈을 피하지 못한다는 것을 보도록 합시다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  english_pob_choice: Let us see
  chosen_korean: 보도록 합시다
  alternatives_korean:
  - 봅시다
  - 살펴봅시다
  lexicon: ἴδωμεν
  rationale: 공동 권유의 뉘앙스를 살려 직설적인 명령보다 부드러운 합쇼체 권유로 옮겼습니다.
- source_word: πῶς ἐγγύς ἐστιν
  english_pob_choice: how near he is
  chosen_korean: 얼마나 가까이 계신지
  alternatives_korean:
  - 얼마나 가까우신지
  - 그분이 얼마나 가까이 계신지
  lexicon: ἐγγύς + ἐστιν
  rationale: 거리의 근접성을 자연스러운 한국어로 재현했고, 문맥상 하나님을 가리키는 인칭은 ‘그분’으로 분명히 했습니다.
- source_word: τῶν ἐννοιῶν ἡμῶν
  english_pob_choice: our thoughts
  chosen_korean: 우리의 생각 가운데서도
  alternatives_korean:
  - 우리 생각들 가운데서도
  - 우리의 마음속 생각 가운데서도
  lexicon: ἔννοια
  rationale: ἔννοια를 단순한 한 번의 생각보다 사고 내용 전반으로 보아 ‘생각’으로 옮기되, 뒤의 ‘추론들’과 구별되게 했습니다.
- source_word: τῶν διαλογισμῶν ὧν ποιούμεθα
  english_pob_choice: the reasonings we make
  chosen_korean: 우리가 만들어 내는 추론들 가운데서도
  alternatives_korean:
  - 우리가 하는 추론들 가운데서도
  - 우리가 세우는 논변들 가운데서도
  lexicon: διαλογισμός + ποιούμεθα
  rationale: διαλογισμούς를 단순한 ‘생각’보다 사유 과정의 산물로 보아 ‘추론들’로 옮겼고, ποιούμεθα의 산출 뉘앙스를 살려 ‘만들어 내는’으로 표현했습니다.
- source_word: λέληθεν αὐτόν
  english_pob_choice: has escaped his notice
  chosen_korean: 그분의 눈을 피하지 못한다
  alternatives_korean:
  - 그분의 주목을 벗어나지 못한다
  - 그분에게 숨겨지지 않는다
  lexicon: λανθάνω
  rationale: 직역의 ‘숨겨지지 않는다’보다 관용적으로 ‘눈을 피하지 못한다’가 감춰짐이 없다는 뜻을 선명하게 드러냅니다.
theological_decisions:
- issue: 하나님을 가리키는 3인칭 인칭지시의 표현
  chosen_reading: ‘그분’으로 번역해 하나님께 대한 직접 지시를 유지했습니다.
  alternative_readings:
  - 생략
  - 하나님께서
  rationale: 문맥의 주어는 신적 존재이므로 독자가 누구를 가리키는지 바로 알 수 있게 하되, 문장의 흐름을 과도하게 신학화하지 않았습니다.
  doctrine_reference: 하나님의 전지성과 가까이 계심에 대한 고백
- issue: ‘생각’과 ‘추론들’의 이중 표현
  chosen_reading: 두 어휘를 구분해 모두 살렸습니다.
  alternative_readings:
  - ‘우리의 생각과 추론’으로 단순화
  - ‘마음과 생각’으로 의역
  rationale: 원문은 ἐννοιῶν과 διαλογισμῶν을 나란히 두어 내면의 내용과 그 사유 과정을 함께 포괄하므로, 두 층위를 모두 드러내는 것이 좋습니다.
  doctrine_reference: 인간 내면 전체가 하나님 앞에 드러난다는 주제
