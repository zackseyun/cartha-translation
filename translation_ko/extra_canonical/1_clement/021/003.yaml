  to: 그분께서 얼마나 가까이 계신지, 또 우리의 생각이나 우리가 하는 추론 가운데 그분께 숨겨진 것이 하나도 없다는 것을 봅시다.[a]
  rationale: 원문의 두 내적 활동을 구별하면서도 οὐδὲν의 포괄적 부정을 자연스러운 한국어로 재구성했습니다. ‘숨겨진 것이 하나도 없다’는 λέληθεν αὐτόν의 완료형이 나타내는 ‘그분의 인식에서 벗어난 것이 없다’는 뜻을 정확하고 자연스럽게 전달합니다. 각주 표지는 유지하고, 영어 감사 기록의 대안적 이해를 한국어로 제공했습니다.
