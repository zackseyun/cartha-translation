revisions:
- from: 그러므로 우리는 하나님보다도 오히려 어리석고 무지하며, 말의 오만함 가운데서 부풀어 오르고 자랑하는 사람들을 걸려 넘어지게 해야 합니다.[a]
  to: 우리는 하나님을 거스르기보다, 자기 말의 오만함을 내세워 우쭐대고 자랑하는 어리석고 분별 없는 사람들의 마음을 상하게 합시다.
  rationale: 원문에 없는 ‘그러므로’를 삭제했습니다. 비교 구조를 ‘하나님을 거스르기보다’로 분명히 하고, προσκόπτω의 문맥상 ‘불쾌하게 하다’라는 뜻을 ‘마음을 상하게 하다’로 옮겨 타인을 물리적으로 또는 영적으로 실족시킨다는 오해를 피했습니다. 인물 묘사는 원문의 부정적 병렬과 ‘자기 말’에 대한 허세를 유지하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:59Z'
