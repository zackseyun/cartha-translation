  source_fidelity: 초안은 μᾶλλον … ἢ의 비교 구조와 대상의 전반적 묘사를 대체로 반영합니다. 그러나 προσκόψωμεν을 ‘걸려 넘어지게 해야 합니다’로 옮기면 사람들을 실제로 실족시키거나 넘어뜨린다는 뜻이 되어, 여기서 사람을 ‘불쾌하게 하다/거스르게 하다’라는 대조의 뜻을 충분히 전달하지 못합니다. 또한 ‘그러므로’는 이 문장의 접속 표현이 아닙니다.
  naturalness: ‘하나님보다도 오히려 … 사람들을’은 비교 대상과 동작의 관계가 다소 불분명하며, ‘말의 오만함 가운데서 부풀어 오르고’도 현대 한국어로는 부자연스럽습니다. 비교를 ‘하나님을 거스르기보다’로 명시하고, 사람 쪽은 ‘마음을 상하게 하다’로 옮기면 자연스럽습니다.
  terminology: θεός는 ‘하나님’으로 적절합니다. ἄφροσι καὶ ἀνοήτοις는 ‘어리석고 분별 없는’으로, ἐπαιρομένοις καὶ ἐγκαυχωμένοις은 ‘우쭐대고 자랑하는’으로 옮겨 중첩된 비판을 유지했습니다. λόγος는 이 문맥에서 ‘자기 말’로 번역했습니다.
