id: 1CLEM.21.5
reference: 1 Clement 21:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: μᾶλλον ἀνθρώποις ἄφροσι καὶ ἀνοήτοις καὶ ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν προσκόψωμεν ἢ τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/005.yaml
  text: Rather, let us offend foolish and senseless men, who are puffed up and boast in the arrogance of their speech, rather than God.
translation:
  language: ko
  text: 우리는 하나님을 거스르기보다, 자기 말의 오만함을 내세워 우쭐대고 자랑하는 어리석고 분별 없는 사람들의 마음을 상하게 합시다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μᾶλλον ... ἢ
  english_pob_choice: Rather ... rather than
  chosen_korean: 그러므로 ... 오히려 ... 보다도
  alternatives_korean:
  - 차라리 ... 보다
  - 오히려 ... 보다
  lexicon: μᾶλλον, ἤ
  rationale: 비교·선택 구조를 한국어에서 자연스럽게 살리기 위해 ‘오히려 ... 보다도’로 옮겼습니다.
- source_word: ἀνθρώποις ἄφροσι καὶ ἀνοήτοις
  english_pob_choice: foolish and senseless men
  chosen_korean: 어리석고 무지한 사람들
  alternatives_korean:
  - 어리석고 분별 없는 사람들
  - 어리석고 깨닫지 못하는 사람들
  lexicon: ἄφρων, ἀνόητος
  rationale: 두 형용사의 중첩된 부정적 평가를 한국어의 자연스러운 쌍어로 반영하되, 의미를 과도하게 약화하지 않도록 ‘무지한’과 결합했습니다.
- source_word: ἐπαιρομένοις καὶ ἐγκαυχωμένοις ἐν ἀλαζονείᾳ τοῦ λόγου αὐτῶν
  english_pob_choice: who are puffed up and boast in the arrogance of their speech
  chosen_korean: 말의 오만함 가운데서 부풀어 오르고 자랑하는
  alternatives_korean:
  - 말의 허세 속에서 우쭐해하며 자랑하는
  - 말의 거만함을 내세우며 자랑하는
  lexicon: ἐπαίρω, ἐγκαυχάομαι, ἀλαζονεία, λόγος
  rationale: ‘말’(λόγος)과 그것의 ‘오만함’(ἀλαζονεία)을 그대로 드러내어, 자랑의 근거가 수사적 허세에 있음을 보이도록 했습니다.
- source_word: προσκόψωμεν
  english_pob_choice: let us offend
  chosen_korean: 걸려 넘어지게 해야 합니다
  alternatives_korean:
  - 실족하게 해야 합니다
  - 걸림돌이 되어야 합니다
  lexicon: προσκόπτω
  rationale: 문맥상 단순한 ‘기분 상하게 하다’보다 ‘걸려 넘어지게 하다/실족하게 하다’가 동사의 충격을 더 정확히 반영합니다.
theological_decisions:
- issue: 최종 비교 대상인 τῷ θεῷ를 한국어에서 어떻게 처리할지
  chosen_reading: ‘하나님보다도’로 옮겨, 사람에게 실족을 주더라도 하나님께 불손을 범하는 것은 피해야 한다는 대조를 살렸습니다.
  alternative_readings:
  - ‘하나님께’
  - ‘하나님을’
  rationale: 본문은 사람과 하나님을 대비하는 비교문이므로, 한국어에서는 비교 대상임을 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 본문 대조 구조 보존
