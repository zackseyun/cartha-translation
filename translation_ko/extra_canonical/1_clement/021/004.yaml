  terminology: θέλημα는 문맥상 ‘그의 뜻’이 적절합니다. λειποτακτεῖν은 군사적 배경을 가진 말이지만, 여기서는 ‘이탈하다’가 원문의 방향성과 강한 불충성을 무리 없이 전달합니다.
