translation:
  language: ko
  text: 그러므로 우리는 그의 뜻에서 이탈해서는 안 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιον οὖν ἐστίν
  english_pob_choice: Therefore it is right
  chosen_korean: 그러므로 … 옳지 않습니다
  alternatives_korean:
  - 그러므로 … 옳습니다
  - 그러므로 … 마땅합니다
  lexicon: δίκαιος
  rationale: 문맥상 ‘옳다/마땅하다’의 판단 진술이므로, 단정적이고 현대적인 합쇼체로 옮겼습니다.
- source_word: μὴ λειποτακτεῖν ἡμᾶς ἀπὸ
  english_pob_choice: we should not desert
  chosen_korean: 그의 뜻을 저버리는 것
  alternatives_korean:
  - 그의 뜻에서 이탈하는 것
  - 그의 뜻을 버리는 것
  - 그의 뜻에서 탈주하는 것
  lexicon: λειποτακτέω
  rationale: λειποτακτέω의 ‘자리를 버리고 이탈하다/탈주하다’라는 군사적 뉘앙스를 살리되, 한국어에서 자연스럽고 출판 가능한 표현으로는 ‘저버리다’가 가장 가깝습니다. ‘탈주하다’는 지나치게 군사적이고 ‘이탈하다’는 약합니다.
- source_word: τοῦ θελήματος αὐτοῦ
  english_pob_choice: his will
  chosen_korean: 그의 뜻
  alternatives_korean:
  - 그의 의지
  - 그의 원함
  - 그의 뜻과 의도
  lexicon: θέλημα
  rationale: θέλημα는 여기서 하나님의 ‘뜻’을 가리키므로, 한국어 성서어법과 현대어 모두에 자연스러운 ‘뜻’을 선택했습니다.
theological_decisions:
- issue: λειποτακτεῖν의 군사적 비유 보존 여부
  chosen_reading: ‘저버리는 것’으로 옮겨 군사적 배경을 직접 풀어내지 않되, 단순한 ‘순종하지 않다’보다 강한 이탈·배신의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘탈주하는 것’처럼 군사적 비유를 드러내는 번역
  - ‘이탈하는 것’처럼 보다 중립적인 번역
  rationale: 문맥은 질서와 충성의 문제를 다루지만, 한국어 본문에서 너무 노골적인 전술 용어로 확장하면 원문의 간결함을 넘을 수 있습니다. ‘저버리다’는 비유성과 도덕적 무게를 함께 살립니다.
  doctrine_reference: Clementine exhortation to order and fidelity
