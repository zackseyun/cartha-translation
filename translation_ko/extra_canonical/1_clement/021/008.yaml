id: 1CLEM.21.8
reference: 1 Clement 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: τὰ τέκνα ἡμῶν τῆς ἐν Χριστῷ παιδείας μεταλαμβανέτωσαν· μαθέτωσαν, τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει, τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται, πῶς ὁ φόβος αὐτοῦ καλὸς καὶ μέγας καὶ σῴζων πάντας τοὺς ἐν αὐτῷ ὁσίως ἀναστρεφομένους ἐν καθαρᾷ διανοίᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/008.yaml
  text: Let our children partake of the discipline that is in Messiah. Let them learn what humility accomplishes before God[a], what pure love is able to do before God, how his fear is good and great and saves all who live in holiness in him, with a pure mind.
  footnotes:
  - marker: a
    text: Or 'what humility has strength before God'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리 자녀들이 메시아 안에 있는 훈육을 받게 하십시오. 그들이 겸손이 하나님 앞에서 무엇을 이룰 수 있는지, 순수한 사랑이 하나님 앞에서 무엇을 할 수 있는지, 또 그분에 대한 경외가 어떻게 선하고 크며 깨끗한 마음으로 그 경외 안에서 경건하게 살아가는 모든 사람을 구원한다는 것을 배우게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “겸손이 하나님 앞에서 어떤 힘이 있는지.”
    reason: τί … ἰσχύει는 ‘겸손이 무엇을 이루는지’로 자연스럽게 번역될 수 있으나, 문자적으로는 겸손의 힘 또는 효력을 묻는 표현이기도 합니다.
lexical_decisions:
- source_word: τὰ τέκνα ἡμῶν
  english_pob_choice: our children
  chosen_korean: 우리 자녀들
  alternatives_korean:
  - 우리 아이들
  - 우리 자녀
  lexicon: τέκνα
  rationale: 문맥상 단순한 미성년 자녀를 가리키며, 합쇼체 공적 문체에서는 ‘자녀들’이 가장 자연스럽고 포괄적입니다.
- source_word: τῆς ἐν Χριστῷ παιδείας
  english_pob_choice: the discipline that is in Messiah
  chosen_korean: 메시아 안에 있는 훈육
  alternatives_korean:
  - 그리스도 안에 있는 훈련
  - 메시아 안에 있는 징계
  lexicon: Χριστός / παιδεία
  rationale: Χριστός는 본문과 프로젝트 관례에 따라 ‘메시아’로 유지하고, παιδεία는 단순한 ‘훈련’보다 자녀를 바로잡고 길러내는 의미가 살아 있는 ‘훈육’이 더 가깝습니다.
- source_word: τί ταπεινοφροσύνη παρὰ θεῷ ἰσχύει
  english_pob_choice: what humility accomplishes before God
  chosen_korean: 하나님 앞에서 겸손이 무엇을 이룰 수 있는지
  alternatives_korean:
  - 하나님 앞에서 겸손이 어떤 힘이 있는지
  - 하나님 앞에서 겸손이 무엇을 강하게 하는지
  lexicon: ταπεινοφροσύνη / ἰσχύει
  rationale: 개정된 영어처럼 ἰσχύει를 ‘accomplishes’의 의미로 받아, ‘겸손이 무엇을 이룰 수 있는지’로 옮겨 동사 중심의 의미를 살렸습니다.
- source_word: τί ἀγάπη ἁγνὴ παρὰ θεῷ δύναται
  english_pob_choice: what pure love is able to do before God
  chosen_korean: 순수한 사랑이 하나님 앞에서 무엇을 할 수 있는지
  alternatives_korean:
  - 정결한 사랑이 하나님 앞에서 무엇을 할 수 있는지
  - 순결한 사랑이 하나님 앞에서 무엇을 이룰 수 있는지
  lexicon: ἀγάπη ἁγνή / δύναται
  rationale: ἁγνή는 도덕적·영적 순결을 가리키므로 ‘순수한’으로, δύναται는 능력 가능성을 나타내어 ‘할 수 있는지’로 자연스럽게 옮겼습니다.
- source_word: ὁ φόβος αὐτοῦ
  english_pob_choice: his fear
  chosen_korean: 그분을 경외하는 일
  alternatives_korean:
  - 그분의 두려움
  - 그분에 대한 경외
  lexicon: φόβος
  rationale: 문맥상 부정적 공포보다 하나님을 향한 경외를 뜻하므로, 한국어에서 의미가 분명한 ‘경외하는 일’로 풀어 썼습니다.
theological_decisions:
- issue: Χριστός의 번역 유지
  chosen_reading: 메시아 안에 있는 훈육
  alternative_readings:
  - 그리스도 안에 있는 훈육
  rationale: 프로젝트 기본값에 따라 Χριστός를 ‘메시아’로 유지하여 본문의 호칭적 의미를 살렸습니다.
  doctrine_reference: POB terminology policy for Χριστός
- issue: ὁ φόβος αὐτοῦ의 신학적 뉘앙스
  chosen_reading: 그분을 경외하는 일
  alternative_readings:
  - 그분의 두려움
  rationale: 본문의 θεολογία는 공포가 아니라 언약적 경외와 순종의 태도를 강조하므로, 독자에게 오해를 줄 수 있는 ‘두려움’ 대신 ‘경외’를 택했습니다.
  doctrine_reference: Biblical fear of God / reverence
