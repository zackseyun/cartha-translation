  to: 우리 자녀들이 메시아 안에 있는 훈육을 받게 하십시오. 그들이 겸손이 하나님 앞에서 무엇을 이룰 수 있는지, 순수한 사랑이 하나님 앞에서 무엇을 할 수 있는지, 또 그분에 대한 경외가 어떻게 선하고 크며 깨끗한 마음으로 그 경외 안에서 경건하게 살아가는 모든 사람을 구원한다는 것을 배우게 하십시오.[a]
  rationale: 원문의 문법적 수식 관계를 반영하여 ἐν αὐτῷ를 ‘그 경외 안에서’로 명시했습니다. 또한 한국어의 자연스러운 문장 흐름을 위해 ‘훈육에 참여하게’와 ‘경외하는 일’을 각각 ‘훈육을 받게’와 ‘그분에 대한 경외’로 다듬었습니다. 영어 감사본의 대안적 표현은 한국어 각주로 보존했습니다.
