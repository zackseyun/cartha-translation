id: 1CLEM.21.1
reference: 1 Clement 21:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ὁρᾶτε, ἀγαπητοί, μὴ αἱ εὐεργεσίαι αὐτοῦ αἱ πολλαὶ γένωνται εἰς κρίμα πᾶσιν ἡμῖν, ἐὰν μὴ ἀξίως αὐτοῦ πολιτευόμενοι τὰ καλὰ καὶ εὐάρεστα ἐνώπιον αὐτοῦ ποιῶμεν μεθ’ ὁμονοίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/001.yaml
  text: See to it, beloved, that his many benefits do not become a judgment against us all, if we do not conduct ourselves worthily of him and do what is good and pleasing before him in concord.
  footnotes:
  - marker: a
    text: Or 'good gifts do not become a judgment against us all, if we do not live in a manner worthy of him, and with one accord do what is good and pleasing before him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 여러분, 우리가 그분께 합당하게 처신하며 한마음으로 그분 앞에서 선하고 그분을 기쁘시게 하는 일을 하지 않는다면, 그분께서 베푸신 많은 은혜가 우리 모두에게 심판이 되지 않도록 주의하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그분의 좋은 선물들이 우리 모두에게 심판이 되지 않도록 주의하십시오. 우리가 그분께 합당하게 살지 않고, 한마음으로 그분 앞에서 선하고 그분을 기쁘시게 하는 일을 하지 않는다면 그러할 것입니다.”
    reason: 영어 POB 감사 기록의 이전 번역(good gifts; live in a manner worthy; with one accord)을 한국어로 제공하여 εὐεργεσίαι와 πολιτευόμενοι 및 μεθ’ ὁμονοίας에 대한 대안적 표현을 보존합니다.
lexical_decisions:
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 여러분
  alternatives_korean:
  - 사랑하는 자들아
  - 사랑하는 이들
  lexicon: ἀγαπητοί
  rationale: 독자 호칭으로서 현대 합쇼체에 자연스럽고, 공동체를 향한 친밀한 권면을 잘 드러냅니다.
- source_word: εὐεργεσίαι
  english_pob_choice: benefits
  chosen_korean: 은혜들
  alternatives_korean:
  - 혜택들
  - 선행들
  - 좋은 선물들
  lexicon: εὐεργεσίαι
  rationale: 원문은 후원자적 ‘혜택/호의’의 뉘앙스를 가지므로 ‘은혜들’이 수혜적 의미를 가장 무난하게 살립니다. 다만 교회어휘의 관습과 어긋날 수 있어 다의성을 의식한 번역입니다.
- source_word: πολιτευόμενοι
  english_pob_choice: conduct ourselves
  chosen_korean: 살아가며
  alternatives_korean:
  - 행실을 하며
  - 시민답게 행하며
  - 공동체 안에서 처신하며
  lexicon: πολιτεύομαι
  rationale: 직역하면 ‘시민으로서 처신하다’이지만, 한국어 본문에서는 문맥상 요구되는 삶의 태도를 자연스럽게 전달하는 ‘살아가며’로 옮겼습니다.
- source_word: ὁμονοίας
  english_pob_choice: concord
  chosen_korean: 화목
  alternatives_korean:
  - 일치
  - 조화
  - 한마음
  lexicon: ὁμονοία
  rationale: 이 서신의 핵심 주제인 공동체적 일치와 분열의 반대를 살리되, 한국어에서 가장 읽기 쉬운 ‘화목’을 택했습니다.
theological_decisions:
- issue: ἐὰν μὴ … ποιῶμεν의 조건절 처리
  chosen_reading: “만일 … 하지 않는다면 그러합니다”로 조건과 결과를 함께 살렸습니다.
  alternative_readings:
  - “우리가 … 하지 않으면”
  - “우리가 … 하지 않는 한”
  rationale: 원문은 조건절이 앞의 권면 전체를 위협하는 경고 구조이므로, 한국어에서도 심판 가능성을 분명히 드러내는 방식이 적절합니다.
  doctrine_reference: 공동체 윤리와 심판 경고의 수사
- issue: μεθ’ ὁμονοίας의 공동체적 의미
  chosen_reading: ‘화목 가운데’로 옮겨 분열의 반대 개념을 강조했습니다.
  alternative_readings:
  - ‘한마음으로’
  - ‘일치 가운데’
  rationale: 이 문맥에서 ὁμονοία는 단순 동의가 아니라 공동체적 화합을 뜻하므로, 서신 전체의 분열 반대 주제를 보존하는 번역이 필요합니다.
  doctrine_reference: 교회/회중의 일치와 평강
