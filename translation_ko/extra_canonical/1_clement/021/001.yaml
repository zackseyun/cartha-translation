  source_fidelity: εὐεργεσίαι는 여기서 하나님이 베푸신 ‘은혜/은덕, 혜택’이라는 수혜적 복수 표현이며, ‘은혜들’보다 한국어 집합 명사인 ‘많은 은혜’가 자연스럽습니다. 초안의 ‘기쁜 일’은 εὐάρεστα(그분을 기쁘시게 하는 것)를 ‘기쁜’이라는 일반 성질로 바꾸므로 수정이 필요합니다. μεθ’ ὁμονοίας는 행위 방식에 걸리므로 ‘한마음으로’로 명확히 옮겼습니다.
  naturalness: 초안의 ‘화목 가운데 하지 않는다면 그러합니다’는 현대 한국어 합쇼체로 다소 부자연스럽고, 무엇이 누구를 기쁘게 하는지 अस्पष्ट합니다. 조건절을 앞에 두고 결과를 뒤에 두면 경고의 논리가 자연스럽습니다.
