source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ που· Πνεῦμα κυρίου λύχνος ἐρευνῶν τὰ ταμιεῖα τῆς γαστρός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/002.yaml
  text: For somewhere it says[a], “The Spirit of the Lord is a lamp, searching the inner chambers of the belly.”
  footnotes:
  - marker: a
    text: Or 'storerooms'.
    reason: previous_rendering
translation:
  language: ko
  text: 어딘가에 이렇게 말씀합니다. 「주님의 영은 등불이 되어 배의 깊은 곳을 살피십니다」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  english_pob_choice: The Spirit of the Lord
  chosen_korean: 주님의 영
  alternatives_korean:
  - 주님의 성령
  - 주의 영
  lexicon: πνεῦμα
  rationale: 여기서는 신적 영을 가리키지만, 본문이 직접 인용하는 잠언적 표현의 문맥을 살려 ‘주님의 영’으로 간결하게 옮겼습니다. ‘성령’은 3인칭 성령 문맥이 더 분명할 때 쓰는 것이 이 번역의 기본 원칙에 더 가깝습니다.
- source_word: λύχνος
  english_pob_choice: a lamp
  chosen_korean: 등불
  alternatives_korean:
  - 램프
  - 등
  lexicon: λύχνος
  rationale: 고대 그리스어의 빛을 비추는 도구를 자연스러운 현대 한국어로 옮기되, 상징적 기능을 유지하기 위해 ‘등불’을 택했습니다.
- source_word: τὰ ταμιεῖα
  english_pob_choice: the inner chambers
  chosen_korean: 배의 깊은 곳
  alternatives_korean:
  - 마음의 깊은 방들
  - 은밀한 방들
  - 창고들
  lexicon: ταμιεῖον
  rationale: POB의 영어 수정처럼 이 표현은 단순한 ‘창고들’이 아니라 사람의 내면 깊숙한 비밀 장소를 뜻하므로, 한국어에서는 관용적이면서도 육체 내부를 가리키는 비유를 살려 ‘배의 깊은 곳’으로 옮겼습니다.
- source_word: τῆς γαστρός
  english_pob_choice: of the belly
  chosen_korean: 배의
  alternatives_korean:
  - 배속의
  - 내장의
  lexicon: γαστήρ
  rationale: 직역적 ‘배’가 한국어에서도 본문의 비유성을 가장 직접적으로 드러내며, 뒤의 ‘깊은 곳’과 결합해 내면의 은밀함을 전달합니다.
theological_decisions:
- issue: “주님의 영”과 지혜문학적 인용의 신학적 범위
  chosen_reading: 이 구절은 특정 교리 진술보다, 주님의 영이 인간 내면을 비추고 살피신다는 지혜문학적 선언으로 읽었습니다.
  alternative_readings:
  - 삼위일체적 성령론을 전면에 둔 해석
  - 단순한 하나님의 활동력으로 축소하는 해석
  rationale: 원문은 인용 도입과 비유적 진술에 초점이 있으며, 신학적으로는 ‘영’의 인격적 탐지와 조명 기능을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 잠언 20:27 인용 맥락, 성령의 통찰/감찰 기능
