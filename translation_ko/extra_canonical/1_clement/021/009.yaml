  terminology: ‘생각과 의도’, ‘살피시는 분’, ‘숨결’, ‘거두어 가실 것입니다’는 원문의 내면 탐지, 생명의 숨, 이를 거두어 감이라는 표현을 교리적으로 과도하게 해석하지 않고 전달합니다.
