source:
  edition: Funk 1901 (normalized OCR)
  text: ἐρευνητὴς γάρ ἐστιν ἐννοιῶν καὶ ἐνθυμήσεων· οὗ ἡ πνοὴ αὐτοῦ ἐν ἡμῖν ἐστίν, καὶ ὅταν θέλῃ, ἀνελεῖ αὐτήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/009.yaml
  text: For he is a searcher of thoughts and intentions; his breath is in us, and whenever he wills, he will take it away.
translation:
  language: ko
  text: 그분은 생각과 의도를 살피시는 분이십니다. 그분의 숨결이 우리 안에 있으며, 그분께서 원하실 때에는 그것을 거두어 가실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνητὴς
  english_pob_choice: a searcher
  chosen_korean: 살피시는 분
  alternatives_korean:
  - 탐구자
  - 찾아내시는 분
  - 감찰하시는 분
  lexicon: ἐρευνητής
  rationale: 단순한 지적 탐색이 아니라 내면을 면밀히 드러내어 아시는 뜻이므로, 한국어에서는 자연스럽고 위엄 있는 ‘살피시는 분’으로 옮겼습니다.
- source_word: ἐννοιῶν καὶ ἐνθυμήσεων
  english_pob_choice: thoughts and intentions
  chosen_korean: 생각과 의도
  alternatives_korean:
  - 생각과 의향
  - 생각과 마음속 계획
  - 생각과 의중
  lexicon: ἔννοια / ἐνθύμησις
  rationale: 두 명사가 가리키는 내적 사고와 마음의 의향을 함께 살리기 위해 ‘생각과 의도’로 간결하게 대응했습니다.
- source_word: πνοὴ
  english_pob_choice: breath
  chosen_korean: 숨
  alternatives_korean:
  - 호흡
  - 생기
  - 기운
  lexicon: πνοή
  rationale: 인간 안에 있는 생명 유지의 숨결을 직접적으로 드러내는 말로 ‘숨’이 가장 자연스럽고 원문 긴장을 잘 유지합니다.
- source_word: ἀνελεῖ αὐτήν
  english_pob_choice: he will take it away
  chosen_korean: 그것을 거두어 가십니다
  alternatives_korean:
  - 그것을 없애십니다
  - 그것을 빼앗아 가십니다
  - 그것을 가져가십니다
  lexicon: ἀναιρέω
  rationale: 생명을 주신 분이 필요에 따라 생명을 거두시는 뜻을 살리면서도 한국어로 지나치게 직설적이거나 폭력적으로 들리지 않게 했습니다.
theological_decisions:
- issue: 하나님의 주권과 생명 박탈 표현
  chosen_reading: ‘그가 원하실 때에는 그것을 거두어 가십니다’로, 생명이 하나님의 뜻 아래 있다는 주권적 진술을 그대로 드러냈습니다.
  alternative_readings:
  - 그가 원하실 때에는 그것을 없애십니다
  - 그가 원하실 때에는 그것을 가져가십니다
  rationale: 원문은 단순 소멸이 아니라 의지에 따른 생명의 회수를 말하므로, 주권성과 생명 의존성을 함께 보존하는 번역이 필요합니다.
  doctrine_reference: 창 2:7; 욥 12:10
