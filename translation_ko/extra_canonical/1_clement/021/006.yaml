source:
  edition: Funk 1901 (normalized OCR)
  text: τὸν κύριον Ἰησοῦν Χριστόν, οὗ τὸ αἷμα ὑπὲρ ἡμῶν ἐδόθη, ἐντραπῶμεν, τοὺς προηγουμένους ἡμῶν αἰδεσθῶμεν, τοὺς πρεσβυτέρους τιμήσωμεν, τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ, τὰς γυναῖκας ἡμῶν ἐπὶ τὸ ἀγαθὸν διορθωσώμεθα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/021/006.yaml
  text: Let us have reverence for the Lord Jesus Christ[a], whose blood was given for us; let us respect those who go before us; let us honor the elders; let us train the young in the discipline of the fear of God[c][b]; let us direct our wives toward what is good.
  footnotes:
  - marker: a
    text: Or 'the Lord Jesus the Messiah'.
    reason: previous_rendering
  - marker: b
    text: Or 'the younger in the discipline that comes from the fear of God'.
    reason: previous_rendering
  - marker: c
    text: Or 'our women'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리를 위하여 피를 내어 주신 주 예수 메시아[a]를 공경합시다. 우리보다 앞서 가는 이들을 존중합시다. 장로들을 존중합시다. 하나님 경외의 훈육으로 젊은이들을 훈련합시다[b]. 우리의 아내들을 선한 것을 향하도록 바로잡읍시다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주 예수 그리스도’.
    reason: Χριστός는 ‘메시아’ 또는 음역한 ‘그리스도’로 옮길 수 있습니다.
  - marker: b
    text: 또는 ‘하나님을 두려워하는 훈육으로’.
    reason: τοῦ φόβου τοῦ θεοῦ는 직역하면 ‘하나님에 대한 두려움의’이며, ‘경외’는 문맥에 맞는 자연스러운 번역입니다.
  - marker: c
    text: 또는 ‘우리의 여성들을’.
    reason: γυναῖκας는 ‘아내들’ 또는 ‘여성들’을 뜻할 수 있으나, 소유격 ἡμῶν과 문맥상 ‘아내들’이 가장 자연스럽습니다.
lexical_decisions:
- source_word: τὸν κύριον Ἰησοῦν Χριστόν
  english_pob_choice: the Lord Jesus Christ
  chosen_korean: 주 예수 메시아
  alternatives_korean:
  - 주 예수 그리스도
  - 주 예수님 메시아
  - 주 예수님 그리스도
  lexicon: κύριος / Ἰησοῦς / Χριστός
  rationale: Χριστός는 여기서 титular 용법이므로 프로젝트 기본값에 따라 메시아로 옮겼고, κύριος는 예수께 대한 칭호로 주를 유지했습니다.
- source_word: ἐντραπῶμεν
  english_pob_choice: Let us have reverence for
  chosen_korean: 우리가 그분을 경외합시다
  alternatives_korean:
  - 우리가 부끄러워합시다
  - 우리가 두려워합시다
  - 우리가 존중합시다
  lexicon: ἐντρέπω
  rationale: 문맥상 단순한 '부끄러워하다'보다 경외와 수치의 뉘앙스를 함께 담는 표현이 필요하여, 하나님/주께 대한 적절한 반응으로 경외합시다를 택했습니다.
- source_word: τοὺς προηγουμένους ἡμῶν
  english_pob_choice: those who go before us
  chosen_korean: 우리보다 앞서 가는 이들
  alternatives_korean:
  - 우리의 인도자들
  - 우리보다 앞서는 이들
  - 우리의 앞선 이들
  lexicon: προηγέομαι
  rationale: 권위 구조를 과잉 해석하지 않고, 앞서 가는/먼저 가는이라는 직접 의미를 살려 존중의 대상으로 제시했습니다.
- source_word: τοὺς νέους παιδεύσωμεν τὴν παιδείαν τοῦ φόβου τοῦ θεοῦ
  english_pob_choice: let us train the young in the discipline of the fear of God
  chosen_korean: 젊은이들을 하나님을 두려워하는 훈육으로 훈련합시다
  alternatives_korean:
  - 젊은이들을 하나님을 두려워하는 훈련으로 훈련합시다
  - 젊은이들을 하나님의 두려움의 훈육으로 훈련합시다
  - 젊은이들을 하나님 경외의 훈련으로 훈련합시다
  lexicon: νέοι / παιδεύω / παιδεία / φόβος τοῦ θεοῦ
  rationale: παιδεία를 훈육으로, φόβος τοῦ θεοῦ를 하나님을 두려워하는 것으로 옮겨 훈련의 내용이 단순 기술이 아니라 경외의 형성임을 드러냈습니다.
- source_word: τὰς γυναῖκας ἡμῶν
  english_pob_choice: our wives
  chosen_korean: 우리의 아내들
  alternatives_korean:
  - 우리 여자들
  - 우리 여성들
  - 우리의 아내들
  lexicon: γυνή
  rationale: 문맥상 공동체/가정 질서에 대한 권고이므로 γυναῖκας ἡμῶν은 일반적 '여성'이 아니라 '아내들'로 이해하는 것이 가장 자연스럽습니다.
theological_decisions:
- issue: Χριστός의 번역어 선택
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  rationale: 이 문서는 고유명사적 관용보다 칭호 의미를 살리는 편이 원문의 의미를 더 직접적으로 드러내므로, 프로젝트 기본값에 따라 메시아를 유지했습니다.
  doctrine_reference: 그리스도론 / 칭호 번역 원칙
- issue: ἐντραπῶμεν의 정서적 강도
  chosen_reading: 경외합시다
  alternative_readings:
  - 부끄러워합시다
  - 두려워합시다
  rationale: 주 예수의 피에 근거한 권면이므로, 단순 수치감보다 언약적·윤리적 경외를 담는 번역이 공동체적 권면의 힘을 더 잘 보존합니다.
  doctrine_reference: 주께 대한 경외와 예배의 응답
