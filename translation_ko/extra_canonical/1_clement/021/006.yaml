  to: 우리를 위하여 피를 내어 주신 주 예수 메시아[a]를 공경합시다. 우리보다 앞서 가는 이들을 존중합시다. 장로들을 존중합시다. 하나님 경외의 훈육으로 젊은이들을 훈련합시다[b]. 우리의 아내들을 선한 것을 향하도록 바로잡읍시다[c].
  rationale: 주 예수의 피가 ‘우리를 위하여 주어졌다’는 원문의 뜻을 ‘우리를 위하여 피를 내어 주신’으로 자연스럽게 옮겼습니다. ἐντραπῶμεν은 ‘공경합시다’로, φόβος τοῦ θεοῦ는 ‘하나님 경외’로 구별했습니다. 또한 마지막 권면의 방향성(ἐπὶ τὸ ἀγαθόν)을 ‘선한 것을 향하도록’으로 반영했습니다.
