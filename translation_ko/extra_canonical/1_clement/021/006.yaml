  source_fidelity: 개정이 필요합니다. ἐντραπῶμεν은 이 문맥에서 주 예수께 대한 존경·공경의 권면으로 옮기는 것이 적절하며, 뒤의 φόβος τοῦ θεοῦ(하나님 경외/두려움)와도 구별하는 편이 좋습니다. 또한 ἐπὶ τὸ ἀγαθόν은 ‘선한 일로’(수단)보다 ‘선한 것을 향하도록’(방향)이 원문에 더 가깝습니다.
  naturalness: 현행 ‘하나님을 두려워하는 훈육으로 훈련합시다’는 수식 관계가 다소 불분명하고 ‘훈육으로 훈련하다’가 중복되어 어색합니다. ‘하나님 경외의 훈육으로 젊은이들을 훈련합시다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘주 예수 메시아’는 Χριστός의 칭호성을 드러내는 일관된 선택으로 유지할 수 있습니다. ‘경외’는 본절 후반의 φόβος τοῦ θεοῦ에 사용하고, ἐντραπῶμεν에는 ‘공경하다’를 사용하여 서로 다른 그리스어 표현을 구별했습니다.
