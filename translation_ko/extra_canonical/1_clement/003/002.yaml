  source_fidelity: 수정안은 ζῆλος와 φθόνος를 서로 구별하여 ‘질투와 시기’로 옮기고, στάσις를 정치적 당파 자체가 아니라 ‘분열’로, αἰχμαλωσία를 ‘포로 됨’으로 반영했습니다. 3절의 반복 대조와 과거 사건을 보존했으며, 4절의 ‘그분에 대한 믿음에 눈이 어두워짐’, 계명의 규범을 따라 걷지 않음, 그리스도께 합당하게 삶, 악한 마음의 욕망을 따름이라는 논리를 충실히 반영했습니다.
  naturalness: 초안에는 ‘시기와 시기’라는 반복, 단수·복수의 불균형, 현대 표준어 합쇼체와 맞지 않는 ‘대적하느니라/아니하며/좇아’ 등의 문체 혼용이 있었습니다. 수정안은 현대적인 공식 문체로 통일했습니다.
  terminology: ‘의와 평화’, ‘하나님을 경외함’, ‘그리스도’, ‘사망’은 문맥상 적절합니다. πρεσβύτεροι는 여기서 교회 직분을 특정하지 않으므로 ‘연장자들’로 옮겼습니다.
