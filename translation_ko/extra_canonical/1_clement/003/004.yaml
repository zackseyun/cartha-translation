id: 1CLEM.3.4
reference: 1 Clement 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: διὰ τοῦτο πόρρω ἀπέστη ἡ δικαιοσύνη καὶ εἰρήνη, ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι, μηδὲ ἐν τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ πορεύεσθαι μηδὲ πολιτεύεσθαι κατὰ τὸ καλῆκον τῷ Χριστῷ, ἀλλὰ ἕκαστον βαδίζειν κατὰ τὰς ἐπιθυμίας τῆς καρδίας αὐτοῦ τῆς πονηρᾶς, ζῆλον ἄδικον καὶ ἀσεβῆ ἀνειληφότας, δι' οὗ καὶ θάνατος εἰσῆλθεν εἰς τὸν κόσμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/004.yaml
  text: Because of this[a], righteousness and peace have withdrawn far away, since each one abandoned the fear of God and became dim-sighted in faith in him, neither walking in the ordinances of his commandments nor conducting himself in a manner fitting for Christ, but each going according to the desires of his evil heart, having taken up unjust and ungodly jealousy[c][b], through which death also entered into the world.
  footnotes:
  - marker: a
    text: Or 'the lawful ways'.
    reason: previous_rendering
  - marker: b
    text: Or 'his faith in him'.
    reason: previous_rendering
  - marker: c
    text: Or 'the Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 의와 평강이 멀리 물러났습니다. 이는 각 사람이 하나님을 두려워하는 마음을 버리고 그를 믿는 믿음이 흐려졌으며, 그의 명령의 규례 안에서 행하지도 않고 그리스도에게 합당한 방식으로도 살지 않았기 때문입니다. 오히려 각 사람이 자기의 악한 마음의 욕망을 따라 걸으며, 불의하고 경건하지 않은 시기심을 품었습니다. 그 시기심으로 말미암아 죽음도 세상에 들어왔습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ δικαιοσύνη καὶ εἰρήνη
  english_pob_choice: righteousness and peace
  chosen_korean: 의와 평강
  alternatives_korean:
  - 의와 평화
  - 의와 화평
  lexicon: δικαιοσύνη, εἰρήνη
  rationale: δικαιοσύνη는 POB 기본어인 ‘의’로, εἰρήνη는 교회적 관용보다 원문의 공적·관계적 뉘앙스를 살려 ‘평강’으로 옮겼습니다.
- source_word: ἐν τῷ ἀπολιπεῖν ἕκαστον τὸν φόβον τοῦ θεοῦ καὶ ἐν τῇ πίστει αὐτοῦ ἀμβλυωπῆσαι
  english_pob_choice: since each one abandoned the fear of God and became dim-sighted in faith in him
  chosen_korean: 각 사람이 하나님을 두려워하는 마음을 버리고 그를 믿는 믿음이 흐려졌으며
  alternatives_korean:
  - 각 사람이 하나님의 두려움을 저버리고 그에 대한 믿음이 흐려졌으며
  - 각 사람이 하나님 경외를 버리고 믿음이 둔해졌으며
  lexicon: φόβος θεοῦ, πίστις
  rationale: φόβος τοῦ θεοῦ는 단순 공포가 아니라 하나님을 경외하는 자세이므로 ‘하나님을 두려워하는 마음’으로, ἀμβλυωπῆσαι는 ‘시력이 흐려지다’는 비유를 살려 ‘흐려졌으며’로 옮겼습니다.
- source_word: τοῖς νομίμοις τῶν προσταγμάτων αὐτοῦ
  english_pob_choice: the ordinances of his commandments
  chosen_korean: 그의 명령의 규례
  alternatives_korean:
  - 그의 명령의 법도
  - 그의 명령의 정해진 규례
  lexicon: νόμιμα, προσταγμάτων
  rationale: applied revision에 따라 τὰ/τοῖς νόμιμα는 ‘ordinances’의 의미가 분명하므로 ‘규례’로, προσταγμάτων은 ‘명령’으로 살려 복합 구조를 자연스럽게 반영했습니다.
- source_word: τὸ καλῆκον τῷ Χριστῷ
  english_pob_choice: a manner fitting for Christ
  chosen_korean: 그리스도에게 합당한 방식으로
  alternatives_korean:
  - 그리스도께 마땅한 태도로
  - 메시아에게 합당한 방식으로
  lexicon: καλῆκον, Χριστός
  rationale: καλῆκον은 ‘합당한/어울리는’의 의미이므로 ‘합당한 방식’으로, Χριστός는 1클레멘스의 서신 관용을 따라 이름형 ‘그리스도’로 옮겼습니다.
- source_word: ζῆλον ἄδικον καὶ ἀσεβῆ
  english_pob_choice: unjust and ungodly jealousy
  chosen_korean: 불의하고 경건하지 않은 시기심
  alternatives_korean:
  - 불의하고 불경건한 질투
  - 부당하고 경건하지 않은 질투
  lexicon: ζῆλος, ἄδικος, ἀσεβής
  rationale: ζῆλος은 맥락상 경쟁적 ‘질투’보다 공동체를 파괴하는 ‘시기심’이 적절하며, ἄδικος와 ἀσεβής의 이중 수식도 그대로 보존했습니다.
theological_decisions:
- issue: Χριστός의 번역값
  chosen_reading: 문맥상 설명적 ‘메시아’보다 서신에서 굳어진 호칭인 ‘그리스도’를 사용했습니다.
  alternative_readings:
  - 메시아
  - 기름부음받은 이
  rationale: 1클레멘스는 로마-고린도 사이의 기독교 서신체에서 Χριστός를 고유한 예수 호칭으로 사용하므로, 청중에게 즉시 통용되는 명칭을 유지하는 편이 원문의 수신자 효과를 더 잘 보존합니다.
  doctrine_reference: 초기 기독교 서신의 호칭 관용
