revisions:
- from: 그러므로 의와 평강이 멀리 물러났습니다. 이는 각 사람이 하나님을 두려워하는 마음을 버리고 그를 믿는 믿음이 흐려졌으며, 그의 명령의 규례 안에서 행하지도 않고 그리스도에게 합당한 방식으로도 살지 않았기 때문입니다. 오히려 각 사람이 자기의 악한 마음의 욕망을 따라 걸으며, 불의하고 경건하지 않은 시기심을 품었습니다. 그 시기심으로 말미암아 죽음도 세상에 들어왔습니다.[a][b][c]
  to: 그러므로 의와 평강이 멀리 떠나갔습니다. 이는 각 사람이 하나님을 경외함을 버리고 그분을 믿는 믿음에 눈이 어두워졌으며, 그분의 명령들의 규례 안에서 행하지도 않고 그리스도께 합당하게 처신하지도 않았기 때문입니다. 도리어 각 사람이 자기 악한 마음의 욕망을 따라 걸으며 불의하고 경건하지 않은 시기심을 품었습니다. 이 시기심을 통하여 죽음도 세상에 들어왔습니다.
  rationale: 원문의 인과 구조와 대조(μηδέ … ἀλλά)를 유지하면서, ἀμβλυωπῆσαι의 비유적 어법과 προσταγμάτων의 복수를 보다 분명히 반영했습니다. 의미상 근거 없는 교리적 해석은 추가하지 않았습니다. 대응 주석이 없는 앵커는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
