review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἀμβλυωπῆσαι의 시각 비유는 ‘믿음이 흐려졌다’보다 ‘믿음에 눈이 어두워졌다’로 옮기는 편이 더 직접적입니다. 또한 προσταγμάτων은 복수이므로 ‘그분의 명령들의 규례’로 반영했습니다.
  naturalness: 초안의 ‘그를 믿는 믿음이 흐려졌으며’는 의미는 전달되지만 반복적이고 비유성이 약합니다. ‘그분을 믿는 믿음에 눈이 어두워졌으며’는 현대 표준어 합쇼체에서 자연스럽고 원문의 표현도 보존합니다. 문단 끝의 [a][b][c]는 한국어 본문에 대응하는 주석이 없어 제거해야 합니다.
  terminology: δικαιοσύνη καὶ εἰρήνη는 ‘의와 평강’, φόβος τοῦ θεοῦ는 ‘하나님을 경외함’, Χριστός는 ‘그리스도’, ζῆλος는 문맥상 ‘시기심’으로 유지했습니다. ‘그리스도께 합당하게 처신하다’는 τὸ καλῆκον τῷ Χριστῷ를 자연스럽게 반영합니다.
  issues:
  - severity: medium
    issue: ἀμβλυωπῆσαι의 비유가 약화됨
    rationale: ‘믿음이 흐려졌다’도 가능하지만, ‘눈이 둔해지다/어두워지다’라는 원문의 시각 비유를 명시적으로 보존하는 편이 최적 등가에 더 맞습니다.
  - severity: low
    issue: 명령의 복수성과 주석 표지의 불일치
    rationale: προσταγμάτων은 복수이며, 본문 끝의 [a][b][c]에는 제공된 한국어 주석이 없습니다. 영어의 세 주석은 이미 폐기된 대안 번역에 관한 감사 이력 성격이므로 한국어 본문에 앵커로 남길 필요가 없습니다.
