id: 1CLEM.3.3
reference: 1 Clement 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: οὕτως ἐπηγέρθησαν οἱ ἄτιμοι ἐπὶ τοὺς ἐντίμους, οἱ ἄδοξοι ἐπὶ τοὺς ἐνδόξους, οἱ ἄφρονες ἐπὶ τοὺς φρονίμους, οἱ νέοι ἐπὶ τοὺς πρεσβυτέρους.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/003.yaml
  text: So the dishonored rose up against the honored, the inglorious against the glorious, the foolish against the prudent, the young against the elders.
translation:
  language: ko
  text: 이처럼 경멸받는 자들이 존귀한 자들을, 영광이 없는 자들이 영광스러운 자들을, 어리석은 자들이 지혜로운 자들을, 젊은 자들이 연장자들을 대적하여 일어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηγέρθησαν
  english_pob_choice: rose up against
  chosen_korean: 대적하여 일어났습니다
  alternatives_korean:
  - 일어났습니다
  - 반역했습니다
  - 들고일어났습니다
  lexicon: ἐπεγείρω
  rationale: 단순히 '일어나다'보다 상대를 향한 적대적 행동을 드러내기 위해 '대적하여 일어났습니다'로 옮겼습니다.
- source_word: ἄτιμοι / ἐντίμους
  english_pob_choice: the dishonored / the honored
  chosen_korean: 경멸받는 자들 / 존귀한 자들
  alternatives_korean:
  - 수치스러운 자들 / 존귀한 자들
  - 멸시받는 자들 / 존귀한 자들
  lexicon: ἄτιμος / ἔντιμος
  rationale: POB의 대조를 살리되, 'honored'의 사회적 명예 대비를 한국어의 '존귀' 계열로 전달했습니다.
- source_word: ἄδοξοι / ἐνδόξους
  english_pob_choice: the inglorious / the glorious
  chosen_korean: 영광이 없는 자들 / 영광스러운 자들
  alternatives_korean:
  - 무명한 자들 / 영광스러운 자들
  - 영예가 없는 자들 / 영광스러운 자들
  lexicon: ἄδοξος / ἔνδοξος
  rationale: 영광의 결핍과 충만이라는 원문 대비를 유지하기 위해 '영광이 없는'과 '영광스러운'을 대응시켰습니다.
- source_word: ἄφρονες / φρονίμους
  english_pob_choice: the foolish / the prudent
  chosen_korean: 어리석은 자들 / 지혜로운 자들
  alternatives_korean:
  - 미련한 자들 / 슬기로운 자들
  - 무지한 자들 / 분별 있는 자들
  lexicon: ἄφρων / φρόνιμος
  rationale: 문맥의 도덕적·지혜 전통을 고려해 '지혜로운'으로 옮겨, 단순한 계산 능력보다 분별과 지혜를 함께 드러냈습니다.
- source_word: πρεσβυτέρους
  english_pob_choice: elders
  chosen_korean: 연장자들
  alternatives_korean:
  - 장로들
  - 나이 많은 이들
  lexicon: πρεσβύτερος
  rationale: 교회 직분 '장로'가 아니라 연령 대비가 분명한 문맥이므로, POB의 의미를 살려 '연장자들'로 옮겼습니다.
theological_decisions:
- issue: 사회적 지위 대비의 윤리적 함의
  chosen_reading: 본문은 단순한 세대 갈등이 아니라, 명예와 지혜의 질서를 거슬러 아래가 위를 대적하는 뒤집힘을 묘사합니다.
  alternative_readings:
  - 단순한 폭동 서술
  - 세대 간 충돌 서술
  rationale: 원문의 연속된 대구가 명예/지혜/연령의 질서 전체를 묶어 반전시키므로, 한국어도 그 긴장을 유지해야 합니다.
  doctrine_reference: 사회적 역전과 교만의 심판이라는 성경적 주제
