review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the fourfold αντιθετικό parallelism and correctly understands πρεσβυτέρους here as older people rather than a church office. ''대적하여 일어났습니다'' appropriately renders ἐπηγέρθησαν ... ἐπί. Two lexical refinements improve precision: ἄδοξοι denotes those without renown or public distinction more directly than those merely ''without glory,'' and φρόνιμοι emphasizes prudence/discernment rather than wisdom in the broader sense.'
  naturalness: The compact Korean parallel construction is natural and effectively allows '대적하여 일어났습니다' to govern all four paired clauses. The formal-polite past ending is appropriate.
  terminology: Use '천대받는 자들' for the socially dishonored and '이름 없는 자들' for the unrenowned, preserving the distinction between ἄτιμοι/ἔντιμοι and ἄδοξοι/ἔνδοξοι. Render φρόνιμοι as '분별 있는 자들' to retain the prudent/discerning sense. '연장자들' is suitable and avoids prematurely reading πρεσβυτέρους as the ecclesial title '장로들.'
  issues:
  - severity: low
    issue: ἄδοξοι is rendered '영광이 없는 자들.'
    rationale: This is understandable, but '이름 없는 자들' more idiomatically conveys lack of renown/public standing and gives a clearer lexical contrast with the preceding honor-status pair.
  - severity: low
    issue: φρονίμους is rendered '지혜로운 자들.'
    rationale: '''지혜로운'' is not wrong, but φρόνιμος more specifically denotes being prudent or discerning; ''분별 있는'' reflects that nuance without introducing σοφός-like breadth.'
  revised_text: 이처럼 천대받는 자들이 존귀한 자들을, 이름 없는 자들이 영광스러운 자들을, 어리석은 자들이 분별 있는 자들을, 젊은 자들이 연장자들을 대적하여 일어났습니다.
