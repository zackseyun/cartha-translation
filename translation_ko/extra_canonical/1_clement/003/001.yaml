source:
  edition: Funk 1901 (normalized OCR)
  text: Πᾶσα δόξα καὶ πλατυσμὸς ἐδόθη ὑμῖν καὶ ἐτελέσθη τὸ γεγραμμένον· Ἔφαγεν καὶ ἔπιεν, καὶ ἐπλατύνθη καὶ ἐπαχύνθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/003/001.yaml
  text: 'All glory and abundance were given to you, and what is written was fulfilled: “He ate and drank, and grew broad and fat, and the beloved one kicked.”'
  footnotes:
  - marker: a
    text: Or 'kicked back'.
    reason: previous_rendering
  - marker: b
    text: Or 'became broad and fat'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 영광과 풍요가 여러분에게 주어졌고, 기록된 말씀이 이루어졌습니다. 「사랑받은 이는 먹고 마셨고, 몸집이 불고 살이 쪘으며[b], 발길질했습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “걷어찼습니다.”
    reason: ἀπελάκτισεν의 문자적 동물 은유를 유지하면서 가능한 한국어 표현을 제시합니다.
  - marker: b
    text: 또는 “몸집이 넓어지고 살이 쪘으며.”
    reason: ἐπλατύνθη καὶ ἐπαχύνθη의 보다 직역적인 표현을 제시하되, 본문의 자연스러운 번역을 우선합니다.
lexical_decisions:
- source_word: Πᾶσα δόξα καὶ πλατυσμός
  english_pob_choice: All glory and abundance
  chosen_korean: 모든 영광과 풍요
  alternatives_korean:
  - 모든 영광과 넉넉함
  - 온갖 영광과 풍성함
  lexicon: δόξα; πλατυσμός
  rationale: δόξα는 문맥상 단순한 명예보다 ‘영광’이 적절하고, πλατυσμός는 넓어짐/풍요로움을 뜻하므로 영어 POB의 abundance를 살려 ‘풍요’로 옮겼습니다.
- source_word: ἐτελέσθη τὸ γεγραμμένον
  english_pob_choice: what is written was fulfilled
  chosen_korean: 기록된 말씀이 이루어졌습니다
  alternatives_korean:
  - 기록된 것이 성취되었습니다
  - 기록된 바가 완성되었습니다
  lexicon: τελέω; γράφω
  rationale: 수동형 완료 의미를 살려 ‘이루어졌습니다’로 옮기되, 한국어에서 자연스러운 성서 문체로 ‘기록된 말씀’이라는 대상을 분명히 했습니다.
- source_word: ἀπελάκτισεν
  english_pob_choice: kicked
  chosen_korean: 발길질했습니다
  alternatives_korean:
  - 발로 찼습니다
  - 걷어찼습니다
  lexicon: ἀπολακτίζω
  rationale: 영어 POB가 바로잡은 핵심은 ‘kicked back’이 아니라 ‘kicked’이며, 원문의 반항적 은유를 살리기 위해 한국어에서도 완곡화하지 않고 ‘발길질했습니다’로 옮겼습니다.
- source_word: ὁ ἠγαπημένος
  english_pob_choice: the beloved one
  chosen_korean: 사랑받은 이
  alternatives_korean:
  - 사랑받는 이
  - 사랑하신 이
  lexicon: ἀγαπάω; ἠγαπημένος
  rationale: 수동 분사로서 ‘사랑받은’이 원문에 더 가깝고, 인칭화된 표현을 유지하기 위해 ‘이’로 마무리했습니다.
theological_decisions:
- issue: Deuteronomy 32:15 인용의 반항적 은유 보존
  chosen_reading: ‘발길질했습니다’로 번역해 과식한 짐승이 주인을 거스르는 이미지를 유지했습니다.
  alternative_readings:
  - ‘반항했습니다’로 의역
  - ‘걷어찼습니다’로 완화
  rationale: 본문은 단순한 움직임이 아니라 은혜를 받은 뒤의 완고한 배반을 비유하므로, 은유의 충격을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성경의 인용과 은유는 수신자가 원문이 의도한 도덕적 경고를 그대로 받도록 보존되어야 합니다.
