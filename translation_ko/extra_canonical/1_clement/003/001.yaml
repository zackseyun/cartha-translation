  - severity: low
    issue: 각주 표지가 모두 인용문 끝에 몰려 있습니다.
    rationale: a는 ‘발길질했습니다’, b는 ‘몸집이 불고 살이 쪘으며’에 각각 붙여 해당 대안을 명확히 가리켜야 합니다.
