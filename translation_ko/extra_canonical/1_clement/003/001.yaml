    rationale: 그리스어는 마지막에 명시된 ‘사랑받은 이’를 먹고 마시고 몸집이 불고 살찌는 일련의 동작의 주어로 제시합니다. 한국어도 이를 일관되게 밝혀야 합니다.
  - severity: medium
