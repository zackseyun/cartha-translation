id: 1CLEM.49.5
reference: 1 Clement 49:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἀγάπη κολλᾷ ἡμᾶς τῷ θεῷ, ἀγάπη καλύπτει πλῆθος ἁμαρτιῶν, ἀγάπη πάντα ἀνέχεται, πάντα μακροθυμεῖ· οὐδὲν βάναυσον ἐν ἀγάπῃ, οὐδὲν ὑπερήφανον· ἀγάπη σχίσμα οὐκ ἔχει, ἀγάπη οὐ στασιάζει, ἀγάπη πάντα ποιεῖ ἐν ὁμονοίᾳ· ἐν τῇ ἀγάπῃ ἐτελειώθησαν πάντες ἐκλεκτοὶ τοῦ θεοῦ, δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/005.yaml
  text: Love joins us to God; love covers a multitude of sins; love endures all things, is patient in all things. There is nothing coarse in love, nothing arrogant. Love has no schism; love does not stir up faction; love does all things in concord. In love all the elect of God were made complete; apart from love, nothing is pleasing to God.
translation:
  language: ko
  text: 사랑은 우리를 하나님께 붙여 줍니다. 사랑은 많은 죄를 덮어 줍니다. 사랑은 모든 것을 견디며, 모든 일에 오래 참습니다. 사랑 안에는 거친 것이 없고, 교만한 것도 없습니다. 사랑 안에는 분열이 없으며, 사랑은 파당을 일으키지 않습니다. 사랑은 모든 일을 화합 가운데 행합니다. 하나님께서 택하신 모든 이들은 사랑 안에서 온전하게 되었습니다. 사랑이 없으면 하나님께 기쁨이 되는 것은 아무것도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  english_pob_choice: Love
  chosen_korean: 사랑
  alternatives_korean:
  - 애정
  - 은사로서의 사랑
  lexicon: ἀγάπη
  rationale: POB의 핵심 용례에 따라 일관되게 ‘사랑’으로 옮기되, 추상적 덕목으로서의 힘을 살렸습니다.
- source_word: κολλᾷ ἡμᾶς τῷ θεῷ
  english_pob_choice: joins us to God
  chosen_korean: 우리를 하나님께 묶어 줍니다
  alternatives_korean:
  - 우리를 하나님과 연합시킵니다
  - 우리를 하나님께 가까이 붙입니다
  lexicon: κολλάω
  rationale: 단순한 친밀감보다 결속·결합의 동사를 살려, 사랑이 하나님께 우리를 붙들어 매는 의미를 드러냈습니다.
- source_word: πλῆθος ἁμαρτιῶν
  english_pob_choice: a multitude of sins
  chosen_korean: 죄의 무수함
  alternatives_korean:
  - 허다한 죄
  - 수많은 죄
  lexicon: πλῆθος
  rationale: 관용구의 중첩된 다수를 간결하게 살리면서, 죄가 매우 많다는 강조를 유지했습니다.
- source_word: σχίσμα / στασιάζει / ἐν ὁμονοίᾳ
  english_pob_choice: schism / stir up faction / in concord
  chosen_korean: 분열 / 파당 / 일치 속에서
  alternatives_korean:
  - 분쟁 / 당파심 / 화합 가운데
  - 갈라짐 / 반역 / 한마음으로
  lexicon: σχίσμα, στασιάζω, ὁμονοία
  rationale: 세 단어의 정치·공동체적 긴장을 살리기 위해 ‘분열, 파당, 일치’로 구분해 옮겼습니다.
theological_decisions:
- issue: οἱ ἐκλεκτοὶ τοῦ θεοῦ의 번역
  chosen_reading: 하나님의 모든 택하신 사람들
  alternative_readings:
  - 하나님의 모든 택하신 자들
  - 하나님의 모든 성도들
  rationale: ‘ἐκλεκτοί’의 선택받은 신분을 드러내되, 문맥상 공동체 구성원을 자연스럽게 읽히도록 ‘사람들’로 풀었습니다.
  doctrine_reference: 선택/택정 용어의 투명성 유지
- issue: δίχα ἀγάπης οὐδὲν εὐάρεστόν ἐστιν τῷ θεῷ
  chosen_reading: 사랑이 없으면 하나님께 기쁨이 되는 것은 아무것도 없습니다
  alternative_readings:
  - 사랑 없이는 하나님을 기쁘시게 하는 것은 아무것도 없습니다
  - 사랑이 없으면 하나님께 흡족한 것은 아무것도 없습니다
  rationale: ἔστιν τῷ θεῷ의 수동적/상태적 함의를 살려, 직접적 의인화보다 ‘기쁨이 되는’으로 다소 완화 없이 자연스럽게 표현했습니다.
  doctrine_reference: 하나님 기쁨/기쁘게 함의 수사적 표현
