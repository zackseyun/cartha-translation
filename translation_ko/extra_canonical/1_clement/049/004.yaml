  text: The height to which love leads is beyond telling.
translation:
  language: ko
  text: 사랑이 이끄는 높이는 말로 다할 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάγει
  english_pob_choice: leads
  chosen_korean: 이끕니다
  alternatives_korean:
  - 올립니다
  - 데려갑니다
  - 끌어올립니다
  lexicon: ἀνάγω
  rationale: 영어 POB가 ‘leads’로 수정한 흐름을 반영해, 사랑이 어떤 높이로 사람을 ‘이끈다’는 방향성을 살리되, 원문에 없는 목적어를 덧붙이지 않았습니다.
- source_word: τὸ ὕψος
  english_pob_choice: The height
  chosen_korean: 높이
  alternatives_korean:
  - 고도
  - 높음
  - 정상
  lexicon: ὕψος
  rationale: 추상명사 ὕψος를 자연스러운 현대 한국어로 옮기면서도, 사랑이 도달하게 하는 ‘높이/고도’라는 비유적 의미를 유지했습니다.
- source_word: ἀνεκδιήγητόν ἐστιν
  english_pob_choice: is beyond telling
  chosen_korean: 말로 다할 수 없습니다
  alternatives_korean:
  - 다 말할 수 없습니다
  - 측량할 수 없습니다
  - 헤아릴 수 없습니다
  lexicon: ἀνεκδιήγητος
  rationale: ‘말할 수 없음’이라는 핵심을 직역하되, 한국어 관용에 맞게 ‘말로 다할 수 없다’로 자연화했습니다.
- source_word: ἡ ἀγάπη
  english_pob_choice: love
  chosen_korean: 사랑
  alternatives_korean:
  - 사랑하심
  - 애정
  lexicon: ἀγάπη
  rationale: 프로젝트 기본어인 ‘사랑’을 유지해 ἀγάπη의 일반적이며 신학적인 폭을 보존했습니다.
theological_decisions:
- issue: 사랑의 주체와 대상의 명시 여부
  chosen_reading: 원문에 없는 ‘우리를’ 같은 목적어를 넣지 않고, 사랑 자체가 사람을 이끈다고 표현했습니다.
  alternative_readings:
  - 사랑이 우리를 이끄는 높이는 말로 다할 수 없습니다.
  - 사랑이 우리를 그 높이로 끌어올립니다.
  rationale: 영어 POB 수정이 이미 ‘us’를 제거했으므로, 원문이 말하는 보편적 진술의 성격을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: source-based restraint
