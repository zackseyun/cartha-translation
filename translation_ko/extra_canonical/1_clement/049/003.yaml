    reason: previous_rendering
translation:
  language: ko
  text: 누가 그 아름다움이 지닌 장엄함을 다 말할 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 아름다움의 위대함을 말하다.”
    reason: 영어 POB의 이전 번역 대안(“tell the greatness”)을 한국어 독자에게 대응시킵니다.
lexical_decisions:
- source_word: τὸ μεγαλεῖον
  english_pob_choice: the majesty
  chosen_korean: 장엄함
  alternatives_korean:
  - 위엄
  - 웅장함
  - 장대함
  lexicon: μεγαλεῖον
  rationale: μεγαλεῖον은 단순한 ‘크기’보다 위엄 있고 장엄한 탁월성을 가리키므로, 영어 POB의 ‘majesty’에 맞춰 ‘장엄함’으로 옮겼습니다.
- source_word: τῆς καλλονῆς αὐτοῦ
  english_pob_choice: of his beauty
  chosen_korean: 그의 아름다움의
  alternatives_korean:
  - 그의 미의
  - 그의 아름다운 것의
  lexicon: καλλονή
  rationale: καλλονή는 외형적 아름다움/아름다움을 뜻하므로 자연스러운 현대어로 ‘아름다움’이라 하되, 대명사 αὐτοῦ는 원문대로 ‘그의’로 반영했습니다.
- source_word: ἐξειπεῖν
  english_pob_choice: declare
  chosen_korean: 다 말할
  alternatives_korean:
  - 선포할
  - 표현할
  - 말해 낼
  lexicon: ἐξείπειν
  rationale: ἐξειπεῖν은 밖으로 완전히 말해 내다, 다 표현하다의 뜻이어서, 수사적 질문의 힘을 살리는 ‘다 말할’이 가장 자연스럽습니다.
theological_decisions:
- issue: 수사적 질문의 강도
  chosen_reading: 지혜나 능력이 아니라 ‘누가 감당할 수 있는가’라는 불가능성을 강조하는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 누가…선포할 수 있겠습니까?
  - 누가…말해 낼 수 있겠습니까?
  rationale: ἀρκετός는 ‘충분한/감당할 만한’의 뜻으로, 원문은 단순 정보가 아니라 그의 아름다움의 장엄함을 인간이 다 بیان할 수 없음을 강조합니다.
  doctrine_reference: 수사법 보존 원칙
