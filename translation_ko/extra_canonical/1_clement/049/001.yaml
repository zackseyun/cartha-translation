  text: 메시아 안에 사랑을 가진 사람은 메시아의 계명들을 행하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχων ἀγάπην
  english_pob_choice: has love
  chosen_korean: 사랑을 가진 사람은
  alternatives_korean:
  - 사랑이 있는 사람은
  - 사랑을 지닌 자는
  lexicon: ἀγάπη
  rationale: 단순한 감정 보유가 아니라 실제로 ‘사랑을 가진’ 상태를 자연스럽게 옮겼고, 합쇼체 문맥에 맞게 주어를 풀어 표현했습니다.
- source_word: ἐν Χριστῷ
  english_pob_choice: in the Messiah
  chosen_korean: 메시아 안에
  alternatives_korean:
  - 그리스도 안에
  - 메시아 안에서
  lexicon: Χριστός
  rationale: POB의 기본 용례를 따라 Χριστός를 ‘메시아’로 옮겼고, ‘안에’는 관계적 내적 연합을 가장 직접적으로 드러냅니다.
- source_word: ποιησάτω
  english_pob_choice: let him do
  chosen_korean: 행하십시오
  alternatives_korean:
  - 행하게 하십시오
  - 행하라
  lexicon: ποιέω
  rationale: 원문의 명령형을 현대 한국어의 공손한 명령/권고형으로 옮겨, ‘do’의 일반적 의미를 자연스럽게 전달했습니다.
- source_word: τὰ τοῦ Χριστοῦ παραγγέλματα
  english_pob_choice: the Messiah’s commandments
  chosen_korean: 메시아의 계명들을
  alternatives_korean:
  - 메시아의 명령들을
  - 그 메시아의 계명들을
  lexicon: παραγγέλματα
  rationale: παραγγέλματα는 단순한 조언이 아니라 권위를 가진 지시를 가리키므로 ‘계명들’이 적합하며, 복수형을 살렸습니다.
theological_decisions:
