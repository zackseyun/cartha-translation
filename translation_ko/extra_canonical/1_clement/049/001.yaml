  terminology: Χριστός를 ‘메시아’, ἀγάπη를 ‘사랑’, παραγγέλματα를 복수형 ‘계명들’로 옮긴 선택은 일관되고 적절합니다. ‘사랑을 가진’도 가능하나 ‘사랑을 지닌’이 이 문맥에서 조금 더 자연스럽습니다.
