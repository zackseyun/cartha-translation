  lexicon: Χριστός
  rationale: POB의 기본 용례를 따라 Χριστός를 ‘메시아’로 옮겼고, ‘안에’는 관계적 내적 연합을 가장 직접적으로 드러냅니다.
- source_word: ποιησάτω
