lexical_decisions:
- source_word: τὸν δεσμὸν
  english_pob_choice: the bond
  chosen_korean: 결속
  alternatives_korean:
  - 유대
  - 끈
  - 결박
  lexicon: δεσμός
  rationale: 문맥상 물리적 ‘결박’보다 사랑으로 맺는 관계의 강한 유대를 가리키므로, 한국어에서는 ‘결속’이 의미와 수사를 함께 살립니다.
- source_word: τῆς ἀγάπης
  english_pob_choice: of God's love
  chosen_korean: 하나님의 사랑의
  alternatives_korean:
  - 하나님 사랑의
  - 하나님께서 사랑하시는
  lexicon: ἀγάπη
  rationale: ἀγάπη를 기본값인 ‘사랑’으로 옮기고, 속격 관계를 자연스럽게 드러내기 위해 ‘하나님의 사랑의’로 구성했습니다.
- source_word: τοῦ θεοῦ
  english_pob_choice: God's
  chosen_korean: 하나님의
  alternatives_korean:
  - 하나님의
  - 주님의
  lexicon: θεός
  rationale: 프로테스탄트 표준 용례에 따라 Θεός는 ‘하나님’으로 옮겼습니다.
- source_word: ἐξηγήσασθαι
  english_pob_choice: describe
  chosen_korean: 설명할 수 있습니까
  alternatives_korean:
  - 묘사할 수 있습니까
  - 말해낼 수 있습니까
  - 풀어 설명할 수 있습니까
  lexicon: ἐξηγέομαι
  rationale: POB의 개정이 반영하듯 여기서는 단순한 ‘풀이’보다 수사적·장엄한 ‘서술/묘사’의 뜻이 두드러지지만, 한국어에서는 자연스럽고 포괄적인 ‘설명하다’가 그 뉘앙스를 무리 없이 담습니다.
theological_decisions:
- issue: 수사적 질문의 강도
  chosen_reading: 문장을 실제 정보 요청이 아니라, 하나님의 사랑의 결속이 인류 언어로는 다 설명될 수 없다는 찬탄의 질문으로 옮겼습니다.
  alternative_readings:
  - 직설적 진술로 바꾸기
  - 완곡한 감탄문으로 바꾸기
  rationale: 그리스어 수사 의문문의 기능을 유지해야 저자의 찬양적 어조와 과장법이 보존됩니다.
  doctrine_reference: 수사학/문맥
