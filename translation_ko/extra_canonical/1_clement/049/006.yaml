id: 1CLEM.49.6
reference: 1 Clement 49:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης· διὰ τὴν ἀγάπην, ἣν ἔσχεν πρὸς ἡμᾶς, τὸ αἷμα αὐτοῦ ἔδωκεν ὑπὲρ ἡμῶν Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν ἐν θελήματι θεοῦ, καὶ τὴν σάρκα ὑπὲρ τῆς σαρκὸς ἡμῶν καὶ τὴν ψυχὴν ὑπὲρ τῶν ψυχῶν ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/049/006.yaml
  text: In love the Master received us; because of the love that he had toward us[a], Jesus Messiah our Lord gave his blood for us by the will of God, and his flesh for our flesh and his life for our lives.
  footnotes:
  - marker: a
    text: Or 'his life for our lives'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑으로 주인이신 분께서 우리를 받아들이셨습니다. 우리를 향하신 사랑 때문에, 우리의 주 예수 메시아께서는 하나님의 뜻에 따라 우리를 위하여 자신의 피를 내어 주셨고, 우리의 육신을 위하여 자신의 육신을, 우리의 영혼들을 위하여 자신의 영혼을 내어 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 생명들을 위하여 자신의 생명을’. 그리스어 ψυχή는 문맥에 따라 ‘영혼’, ‘생명’, 또는 ‘목숨’을 뜻할 수 있습니다.
    reason: ψυχή의 의미 범위를 밝히면서 원문의 ‘육신/영혼’ 대구를 본문에서 보존하기 위해서입니다.
lexical_decisions:
- source_word: ἐν ἀγάπῃ προσελάβετο ἡμᾶς ὁ δεσπότης
  english_pob_choice: In love the Master received us
  chosen_korean: 사랑 안에서 주께서 우리를 받아 주셨습니다
  alternatives_korean:
  - 사랑 안에서 주님께서 우리를 영접하셨습니다
  - 사랑으로 주께서 우리를 받아들이셨습니다
  lexicon: δεσπότης → 주
  rationale: δεσπότης는 단순한 예의호칭이 아니라 절대적 주권을 지닌 ‘주인/주’의 뉘앙스가 있어, 본문 의미를 살리되 한국어에서는 과도하게 경직된 ‘주인’보다 문맥상 자연스러운 ‘주’로 옮겼습니다.
- source_word: Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν
  english_pob_choice: Jesus Messiah our Lord
  chosen_korean: 예수 메시아 우리 주
  alternatives_korean:
  - 예수 그리스도 우리 주
  - 예수 메시아이신 우리 주
  lexicon: Χριστός → 메시아
  rationale: 이 프로젝트 기본 용례에 따라 Χριστός는 ‘메시아’로 옮겨, 호칭의 의미를 드러내고 전통적 교회어인 ‘그리스도’로 자동 평준화하지 않았습니다.
- source_word: τὸ αἷμα αὐτοῦ ... καὶ τὴν σάρκα ... καὶ τὴν ψυχὴν
  english_pob_choice: his blood ... his flesh ... his life
  chosen_korean: 자신의 피를 내주셨고, 우리의 육신을 위하여 자신의 육신을, 우리의 영혼을 위하여 자신의 영혼을 내주셨습니다
  alternatives_korean:
  - 자신의 피를 내주셨고, 우리의 육신을 위하여 자신의 육신을, 우리의 생명을 위하여 자신의 생명을 내주셨습니다
  - 자신의 피를 내주셨고, 우리의 살을 위하여 자신의 살을, 우리의 목숨을 위하여 자신의 목숨을 내주셨습니다
  lexicon: ψυχή → 영혼
  rationale: 수사적으로 대칭되는 ‘육신/영혼’ 구조를 보존하려고 ψυχή를 ‘영혼’으로 옮겼습니다. 영어 POB의 ‘life’는 자연스러운 풀이이지만, 그리스어의 병렬성을 한국어에서도 더 직접적으로 드러내는 선택이 필요했습니다.
theological_decisions:
- issue: 그리스도 호칭의 번역
  chosen_reading: Χριστός를 ‘메시아’로 유지했습니다.
  alternative_readings:
  - ‘그리스도’로 음역/전통화
  - ‘기름부음 받은 이’로 설명화
  rationale: 본문이 예수의 호칭을 제목적 의미로 사용하므로, 기존 POB 기준에 맞춰 ‘메시아’를 유지하는 것이 원문 의미와 번역 정책을 가장 잘 반영합니다.
  doctrine_reference: 'POB glossary: Χριστός (titular) → 메시아'
- issue: ψυχή의 번역
  chosen_reading: ψυχή를 ‘영혼’으로 옮겨 ‘육신/영혼’의 병렬을 살렸습니다.
  alternative_readings:
  - ‘생명’
  - ‘목숨’
  rationale: 이 절은 혈육과 영적 차원을 나란히 놓는 대구를 이루므로, ‘영혼’이 본문의 구조와 강조를 가장 분명하게 보존합니다. 영어 POB의 ‘life’는 의미상 가능하지만, 한국어에서는 ‘영혼’이 더 정확한 대응입니다.
  doctrine_reference: source-level rhetorical symmetry in 1 Clement 49:6
