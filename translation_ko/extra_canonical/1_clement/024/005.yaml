revisions:
- from: 씨 뿌리는 사람은 나가서 각 씨앗을 땅에 던졌습니다. 그것들은 땅에 떨어져 마르고 알몸이 되어 썩습니다. 그러고 나서 그 썩음에서 주인의 섭리의 위대함이 그것들을 일으켜 세우고, 하나에서 많은 것이 자라서 열매를 맺습니다.[a]
  to: 씨 뿌리는 이는 나가서 씨앗 하나하나를 땅에 던졌습니다. 이것들은 땅에 떨어져, 마르고 벌거벗은 채로 썩어 흩어집니다. 그러고 나서 주인의 섭리의 위대함이 그 썩음에서 그것들을 일으켜 세우고, 하나로부터 많은 것을 자라게 하여 열매를 맺게 합니다[a].
  rationale: 마지막 절의 주된 번역을 단수 주어인 ‘주인의 섭리의 위대함’에 연결하여 원문의 통사와 영어 POB의 주된 독해를 반영했습니다. 다만 중성 복수 주어와 단수 동사의 가능한 독해는 각주로 보존했습니다. 또한 씨앗에 적용된 γυμνά와 διαλύεται를 현대 한국어에서 자연스럽게 다듬되, 노출됨과 부패·해체됨의 이미지는 유지했습니다.
