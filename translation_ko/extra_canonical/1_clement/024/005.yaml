  - severity: low
    issue: γυμνά의 한국어 표현이 부자연스러움
    rationale: ‘알몸이 되어’는 씨앗 문맥에서 어색합니다. ‘벌거벗은 채’는 원문의 노출·무방비 상태를 유지하면서도 현대 한국어 문장으로 더 자연스럽습니다.
