source:
  edition: Funk 1901 (normalized OCR)
  text: ἐξῆλθεν ὁ σπείρων καὶ ἔβαλεν εἰς τὴν γῆν ἕκαστον τῶν σπερμάτων, ἅτινα πεσόντα εἰς τὴν γῆν ξηρὰ καὶ γυμνὰ διαλύεται· εἶτʼ ἐκ τῆς διαλύσεως ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου ἀνίστησιν αὐτά, καὶ ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/005.yaml
  text: The sower went out and cast each of the seeds into the ground; these[a], when they fall into the ground, dry and bare, decay. Then from that decay the greatness of the Master's providence raises them up, and from one it increases many and brings forth fruit.
  footnotes:
  - marker: a
    text: Or 'from one he increases many and brings forth fruit'.
    reason: previous_rendering
translation:
  language: ko
  text: 씨 뿌리는 이는 나가서 씨앗 하나하나를 땅에 던졌습니다. 이것들은 땅에 떨어져, 마르고 벌거벗은 채로 썩어 흩어집니다. 그러고 나서 주인의 섭리의 위대함이 그 썩음에서 그것들을 일으켜 세우고, 하나로부터 많은 것을 자라게 하여 열매를 맺게 합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나로부터 많은 것이 자라서 열매를 맺습니다.”
    reason: ἐκ τοῦ ἑνὸς πλείονα αὔξει καὶ ἐκφέρει καρπόν은 선행 단수 주어가 ‘많은 것’을 자라게 하고 열매를 내게 한다는 독해가 주된 흐름에 맞지만, 중성 복수 πλείονα를 주어로 보아 단수 동사를 취하는 그리스어 용법에 따른 대안도 가능합니다.
lexical_decisions:
- source_word: ὁ σπείρων
  english_pob_choice: The sower
  chosen_korean: 씨 뿌리는 사람
  alternatives_korean:
  - 파종하는 이
  - 뿌리는 사람
  lexicon: σπείρων
  rationale: 행위자를 뜻하는 분사로서 직역보다 자연스러운 현대 한국어 표현을 택하되, ‘농부’처럼 의미를 좁히지 않고 씨를 뿌리는 행위를 살렸습니다.
- source_word: δεσπότου
  english_pob_choice: the Master's
  chosen_korean: 주인의
  alternatives_korean:
  - 주님의
  - 주인의 주권적
  lexicon: δεσπότης
  rationale: δεσπότης는 단순한 일반적 ‘주인’보다 권위와 소유를 강하게 나타내므로, 예배적 완곡어법보다 원문 의미를 직접 살린 ‘주인’을 택했습니다.
- source_word: διαλύσεως
  english_pob_choice: decay
  chosen_korean: 썩음
  alternatives_korean:
  - 분해
  - 해체
  - 소멸
  lexicon: διαλύσις
  rationale: 무엇이 땅에 떨어져 부패하고 흩어지는 상태를 가리키므로, 추상적인 ‘해체’보다 생물학적 소멸감을 주는 ‘썩음’이 문맥에 가깝습니다.
- source_word: ἐκφέρει καρπόν
  english_pob_choice: brings forth fruit
  chosen_korean: 열매를 맺습니다
  alternatives_korean:
  - 열매를 냅니다
  - 열매를 가져옵니다
  lexicon: καρπός
  rationale: 관용적으로 열매 생산을 나타내는 표현이므로, 현대 한국어에서도 자연스럽고 의미를 보존하는 ‘열매를 맺다’를 사용했습니다.
theological_decisions:
- issue: ἡ μεγαλειότης τῆς προνοίας τοῦ δεσπότου의 신학적 의미
  chosen_reading: ‘주인의 섭리의 위대함’으로 옮겨, 생명의 회복이 자연적 과정이 아니라 주권적 섭리에서 나온다는 점을 드러냈습니다.
  alternative_readings:
  - ‘주인의 돌보심의 عظ대함’
  - ‘주님의 섭리의 위대함’
  rationale: 본문은 씨의 부활적 회복을 섭리의 작용으로 돌리므로, ‘섭리’와 ‘위대함’을 유지해 원문의 신학적 강조를 보존했습니다.
  doctrine_reference: 하나님의 섭리와 창조적 회복에 대한 고대 기독교 수사
