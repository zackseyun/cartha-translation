base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/003.yaml
  text: 'Day and night show us a resurrection: the night falls asleep[a], the day rises; the day departs, night comes.'
  footnotes:
  - marker: a
    text: Or 'the night falls asleep, and the day rises; the day departs, and night comes on.'.
    reason: previous_rendering
translation:
  language: ko
  text: 낮과 밤은 우리에게 부활을 보여 줍니다. 밤은 잠들고, 낮은 일어납니다. 낮은 떠나가고, 밤이 옵니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάστασιν
  english_pob_choice: a resurrection
  chosen_korean: 부활
  alternatives_korean:
  - 일어남
  - 다시 일어남
  lexicon: ἀνάστασις
  rationale: 문맥상 자연계의 주기에서 죽음 이후의 부활을 비유적으로 가리키므로, 표준적인 신학 용어인 ‘부활’이 가장 직접적입니다.
- source_word: δηλοῦσιν
  english_pob_choice: show us
  chosen_korean: 우리에게 보여 줍니다
  alternatives_korean:
  - 우리에게 드러냅니다
  - 보여 줍니다
  lexicon: δηλόω
  rationale: ‘드러내다/보여 주다’ 가운데, 자연 현상이 교훈을 ‘보여 준다’는 비유를 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: κοιμᾶται ἡ νύξ
  english_pob_choice: the night falls asleep
  chosen_korean: 밤은 잠들고
  alternatives_korean:
  - 밤은 잠이 들고
  - 밤은 잠듭니다
  lexicon: κοιμάομαι
  rationale: 그리스어의 의인화를 살려 ‘잠들고’로 옮겼고, 병렬 구조를 유지하기 위해 간결하게 처리했습니다.
- source_word: ἄπεισιν / ἐπέρχεται
  english_pob_choice: departs / comes
  chosen_korean: 지나가고 / 옵니다
  alternatives_korean:
  - 떠나고 / 다가옵니다
  - 사라지고 / 찾아옵니다
  lexicon: ἄπειμι / ἐπέρχομαι
  rationale: 서로 대조되는 동작을 평이한 현재형으로 옮겨, 그리스어의 빠른 병렬 리듬과 자연스러운 종결감을 함께 살렸습니다.
theological_decisions:
- issue: 자연의 순환을 ‘부활’의 표지로 제시하는 비유
  chosen_reading: 본문의 ‘부활’은 자연 관찰을 통해 부활의 개념을 예시하는 비유적 진술로 유지했습니다.
  alternative_readings:
  - 단순한 ‘되살아남’의 일반 비유로 약화
  - 윤회사상처럼 오해될 수 있게 일반 순환으로만 번역
  rationale: 문맥은 죽음-생명의 반복이 아니라 기독교적 부활 개념을 자연에서 유추하는 논증이므로, 신학적 핵심어를 보존하는 것이 타당합니다.
  doctrine_reference: 기독교 부활 교리의 비유적 증언
- issue: 연결 접속사의 절제
  chosen_reading: 그리스어의 무접속 병렬을 따라 ‘밤은 잠들고, 낮은 일어나며; 낮은 지나가고, 밤이 옵니다’로 옮겨, 추가된 ‘그리고’를 넣지 않았습니다.
  alternative_readings:
  - 각 절 사이에 ‘그리고’를 넣어 부드럽게 연결
  - 문장을 더 설명적으로 재구성
  rationale: 원문의 속도감과 대조 효과를 보존하려면 접속사를 최소화하는 편이 적절합니다.
  doctrine_reference: 본문 수사 구조 보존
