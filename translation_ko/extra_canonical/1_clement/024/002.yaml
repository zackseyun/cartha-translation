  text: Let us observe, beloved, the resurrection that takes place in due season.
translation:
  language: ko
  text: 사랑하는 이들이여, 제때에 일어나는 부활을 살펴보십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδωμεν
  english_pob_choice: Let us observe
  chosen_korean: 살펴보십시오
  alternatives_korean:
  - 보아라
  - 우리가 보자
  - 관찰합시다
  lexicon: ἴδωμεν
  rationale: 권면의 뉘앙스를 살리면서 현대 한국어에서 자연스럽고 문어적인 표현으로 옮겼습니다. 단순 시각 행위보다 ‘주의 깊게 보라’는 의미를 담습니다.
- source_word: ἀγαπητοί
  english_pob_choice: beloved
  chosen_korean: 사랑하는 이들이여
  alternatives_korean:
  - 사랑하는 여러분
  - 사랑받는 이들이여
  - 사랑하는 자들아
  lexicon: ἀγαπητοί
  rationale: 호칭의 친밀함을 살리되, 현대 합쇼체 문맥에 맞게 공손하고 자연스럽게 다듬었습니다.
- source_word: τὴν κατὰ καιρὸν γινομένην ἀνάστασιν
  english_pob_choice: the resurrection that takes place in due season
  chosen_korean: 제때에 일어나는 부활
  alternatives_korean:
  - 알맞은 때에 일어나는 부활
  - 때를 따라 일어나는 부활
  - 정해진 때에 일어나는 부활
  lexicon: ἀνάστασις / κατὰ καιρόν / γινομένην
  rationale: κατὰ καιρόν을 POB의 ‘due season’에 맞춰 ‘제때에’로 옮겨, ‘정해진’이라는 추가 뉘앙스를 과도하게 넣지 않았습니다. ἀνάστασις는 본문의 기본 의미를 따라 ‘부활’로 렌더링했습니다.
theological_decisions:
- issue: 부활의 시기 표현인 κατὰ καιρόν의 해석
  chosen_reading: ‘제때에’라는 표현으로 시간의 적절성과 예정성을 모두 과도하지 않게 보존했습니다.
  alternative_readings:
  - ‘정해진 때에’로 더 강하게 예정성을 드러내는 해석
  - ‘알맞은 시기에’로 더 완곡하게 옮기는 해석
  rationale: 원문은 시기성은 분명하지만 소유격이나 추가된 결정론을 요구하지 않습니다. POB의 최신 수정도 ‘its appointed season’보다 ‘due season’을 택해 이를 반영했습니다.
  doctrine_reference: 부활론 / 종말론
