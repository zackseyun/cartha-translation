  source_fidelity: σπόρος는 ‘씨’도 될 수 있으나, 이 문맥에서는 ‘파종/씨 뿌림’(행위)을 뜻하는 용법이 더 적절합니다. 바로 이어지는 문맥에서 저자가 씨 자체를 별도로 가리키는 점도 이 구별을 뒷받침합니다. 따라서 γίνομαι는 ‘생겨나다’보다 사건으로서 ‘이루어지다/일어나다’로 옮기는 것이 원문에 더 충실합니다.
  naturalness: 초안의 ‘씨는 … 생겨납니까?’는 한국어 농경 비유의 흐름에서 다소 부자연스럽습니다. ‘파종은 … 이루어집니까?’는 현대 표준어 합쇼체로 자연스럽고 수사적 질문도 유지합니다.
  terminology: καρποί는 ‘열매’, σπόρος는 본문 문맥상 ‘파종’으로 번역합니다. 대안적인 ‘씨’ 해석은 각주에 보존하여 어휘적 모호성을 감추지 않습니다.
