  text: λάβωμεν τοὺς καρπούς· ὁ σπόρος πῶς καὶ τίνα τρόπον γίνεται;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/004.yaml
  text: 'Let us take the fruits as an example: how and in what way does the seed come to be?[a]'
  footnotes:
  - marker: a
    text: Or 'does the seed come to be?'.
    reason: previous_rendering
translation:
  language: ko
  text: 열매를 예로 들어 봅시다. 씨는 어떻게, 또 어떤 방식으로 생겨납니까?[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς καρπούς
  english_pob_choice: the fruits
  chosen_korean: 열매
  alternatives_korean:
  - 과실
  - 작물
  - 열매들
  lexicon: καρπός
  rationale: 문맥상 비유의 예시를 이끄는 일반적 ‘열매’가 가장 자연스럽고, 영어 POB의 ‘fruits’와도 대응됩니다. 복수형은 한국어에서 보통 포괄적 단수로도 충분히 드러낼 수 있습니다.
- source_word: λάβωμεν
  english_pob_choice: Let us take as an example
  chosen_korean: 예로 들어 봅시다
  alternatives_korean:
  - 예로 삼아 봅시다
  - 가져봅시다
  - 취합시다
  lexicon: λαμβάνω
  rationale: 직접적으로 ‘취하다’보다 문맥상 비유를 도입하는 기능이므로, 한국어에서 자연스러운 ‘예로 들어 봅시다’로 풀어 옮겼습니다.
- source_word: ὁ σπόρος
  english_pob_choice: the seed
  chosen_korean: 씨
  alternatives_korean:
  - 씨앗
  - 씨가
  - 파종
  lexicon: σπόρος
  rationale: 여기서는 단순한 농업적 씨를 가리키며, 한국어에서는 ‘씨’가 가장 간결하고 본문의 질문형 흐름에 잘 맞습니다.
- source_word: πῶς καὶ τίνα τρόπον γίνεται
  english_pob_choice: how and in what way does ... come to be
  chosen_korean: 어떻게, 또 어떤 방식으로 생겨납니까
  alternatives_korean:
  - 어떻게 일어납니까
  - 어떤 방식으로 이루어집니까
  - 어떻게 생겨납니까
  lexicon: γίνομαι
  rationale: 생성·발생의 의미를 살리되, 한국어에서 이중 질문의 강조를 자연스럽게 옮기기 위해 ‘어떻게, 또 어떤 방식으로’와 ‘생겨납니까’를 사용했습니다.
theological_decisions:
- issue: 수사적 질문의 전달
  chosen_reading: 본문의 질문은 설명을 요청하는 비유적 수사 질문으로 유지했습니다.
  alternative_readings:
  - 직설적으로 풀어 설명하는 번역
  - 단순한 정보 질문으로 약화시키는 번역
  rationale: 원문은 사물의 발생 방식을 예로 들어 논증을 시작하는 방식이므로, 한국어에서도 질문의 긴장과 논증적 기능을 그대로 살리는 것이 적절합니다.
  doctrine_reference: 본문 해석의 수사학적 기능
