revisions:
- from: 사랑하는 여러분, 주인이 우리에게 미래의 부활이 일어날 것을 계속 보여 주시는 방식을 생각해 보십시오. 그 부활의 첫 열매로 하나님께서는 주 예수 메시아를 죽은 자들 가운데서 살리셨습니다.[a]
  to: 사랑하는 여러분, 주인께서 장차 부활이 있을 것을 우리에게 끊임없이 어떻게 보여 주시는지 생각해 봅시다.[a] 그분은 주 예수 메시아를 죽은 자들 가운데서 살리심으로써 그 부활의 첫 열매로 삼으셨습니다.
  rationale: 원문의 호칭과 문장 구조를 보존하도록 ‘하나님’을 ‘그분’으로 바꾸고, 부활시키심이 예수를 첫 열매로 삼으신 수단임을 드러냈습니다. 또한 공동 청유와 미래성 표현을 현대 표준 한국어 합쇼체에 맞게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
