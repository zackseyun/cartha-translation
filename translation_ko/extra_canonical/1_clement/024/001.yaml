id: 1CLEM.24.1
reference: 1 Clement 24:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Κατανοήσωμεν, ἀγαπητοί, πῶς ὁ δεσπότης ἐπιδείκνυται διηνεκῶς ἡμῖν τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι, ἧς τὴν ἀπαρχὴν ἐποιήσατο τὸν κύριον Ἰησοῦν Χριστὸν ἐκ νεκρῶν ἀναστήσας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/024/001.yaml
  text: Let us consider, beloved, how the Master continually shows us that the future resurrection will take place, of which he made the Lord Jesus Messiah the firstfruits by raising him from the dead.
  footnotes:
  - marker: a
    text: Or 'that the resurrection that is going to happen will indeed be'.
    reason: previous_rendering
translation:
  language: ko
  text: 사랑하는 여러분, 주인께서 장차 부활이 있을 것을 우리에게 끊임없이 어떻게 보여 주시는지 생각해 봅시다.[a] 그분은 주 예수 메시아를 죽은 자들 가운데서 살리심으로써 그 부활의 첫 열매로 삼으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장차 일어날 부활이 있을 것을’.
    reason: μέλλουσαν ἀνάστασιν ἔσεσθαι의 미래성을 달리 풀어 쓸 수 있음을 보이며, 원문의 강조를 과도하게 확정하지 않습니다.
lexical_decisions:
- source_word: Κατανοήσωμεν, ἀγαπητοί
  english_pob_choice: Let us consider, beloved
  chosen_korean: 사랑하는 여러분, … 생각해 보십시오
  alternatives_korean:
  - 사랑하는 여러분, … 살펴봅시다
  - 사랑하는 여러분, … 생각합시다
  lexicon: κατανοέω
  rationale: 권고형 청유를 살리되, 합쇼체 문맥에 맞게 공동체를 향한 공손한 권면으로 옮겼습니다.
- source_word: ὁ δεσπότης
  english_pob_choice: the Master
  chosen_korean: 주인
  alternatives_korean:
  - 주인님
  - 주
  lexicon: δεσπότης
  rationale: δεσπότης의 지배적·권위적 뉘앙스를 살려 '주인'으로 옮겼고, 본문이 예수의 칭호가 아니라 하나님을 가리키는 일반 호칭이므로 '주님'으로 좁히지 않았습니다.
- source_word: ἐπιδείκνυται διηνεκῶς ἡμῖν
  english_pob_choice: continually shows us
  chosen_korean: 우리에게 … 계속 보여 주시는
  alternatives_korean:
  - 우리에게 … 늘 보여 주시는
  - 우리에게 … 계속 드러내시는
  lexicon: ἐπιδείκνυμαι + διηνεκῶς
  rationale: 지속성을 나타내는 부사 διηνεκῶς를 살려 '계속'을 넣고, '보여 주다'로 직역성보다 의미의 분명함을 우선했습니다.
- source_word: τὴν μέλλουσαν ἀνάστασιν ἔσεσθαι
  english_pob_choice: that the future resurrection will take place
  chosen_korean: 미래의 부활이 일어날 것을
  alternatives_korean:
  - 장차 올 부활이 있을 것을
  - 다가올 부활이 이루어질 것을
  lexicon: μέλλω + ἀνάστασις + ἔσεσθαι
  rationale: 영문 개정본이 정리한 것처럼 'future resurrection will take place'의 자연스러운 의미를 따르되, μέλλουσαν의 장차-성을 '미래의'로 간결하게 반영했습니다.
- source_word: τὴν ἀπαρχὴν ἐποιήσατο
  english_pob_choice: he made ... the firstfruits
  chosen_korean: 첫 열매로 … 삼으셨습니다
  alternatives_korean:
  - 첫 열매가 되게 하셨습니다
  - 첫 열매로 만드셨습니다
  lexicon: ἀπαρχή
  rationale: 유대적 제물/추수의 비유를 보존하기 위해 '첫 열매'를 유지했고, '삼으셨습니다'로 결과 상태를 자연스럽게 표현했습니다.
- source_word: τὸν κύριον Ἰησοῦν Χριστὸν
  english_pob_choice: the Lord Jesus Messiah
  chosen_korean: 주 예수 메시아
  alternatives_korean:
  - 주 예수 그리스도
  - 주 예수 메시아 되신 분
  lexicon: κύριος + Ἰησοῦς + Χριστός
  rationale: POB의 기본 용어 정책에 따라 titular Χριστός를 '메시아'로 유지해, 전통적 교회어 '그리스도'로의 자동 치환을 피했습니다.
theological_decisions:
- issue: 부활의 미래성 표현
  chosen_reading: '''미래의 부활이 일어날 것을''로 옮겨, 단순한 교리 진술이 아니라 아직 오지 않은 부활의 확실성을 보여 주는 진술로 읽었습니다.'
  alternative_readings:
  - '''장차 부활이 있을 것을'''
  - '''다가올 부활이 이루어질 것을'''
  rationale: μέλλουσαν과 ἔσεσθαι의 결합은 부활의 시간적 미래성과 실현성을 함께 강조하므로, 두 요소를 모두 드러내는 번역이 본문 의도를 잘 살립니다.
  doctrine_reference: 종말론적 부활과 그 보증으로서의 그리스도
