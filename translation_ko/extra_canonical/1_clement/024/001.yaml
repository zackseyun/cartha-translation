review_pass:
  verdict: revise
  source_fidelity: 초안은 미래의 부활과 예수의 죽은 자들 가운데서의 부활을 대체로 정확히 옮겼습니다. 그러나 헬라어의 주어인 ὁ δεσπότης를 둘째 문장에서 근거 없이 '하나님'으로 특정했고, ἐκ νεκρῶν ἀναστήσας가 '첫 열매로 삼으셨습니다'를 수식하는 수단 분사라는 연결을 더 분명히 할 필요가 있습니다.
  naturalness: ‘미래의 부활이 일어날 것’도 이해되지만, 현대 한국어에서는 ‘장차 부활이 있을 것’이 μέλλουσαν…ἔσεσθαι를 더 자연스럽고 간결하게 전달합니다. 청유형은 ‘생각해 봅시다’가 Κατανοήσωμεν의 공동 권면을 직접 반영합니다.
  terminology: δεσπότης는 본문의 일반적 신적 호칭을 보존하여 ‘주인’으로 유지하고, κύριος Ἰησοῦς Χριστός는 POB 방침에 따라 ‘주 예수 메시아’로 유지합니다. ἀπαρχή는 ‘첫 열매’로 보존합니다.
