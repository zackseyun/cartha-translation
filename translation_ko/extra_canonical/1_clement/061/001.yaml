revisions:
- from: 주님, 당신은 그들에게 당신의 장엄하고 헤아릴 수 없는 권능을 따라 나라의 권위를 주셔서, 우리가 당신께서 그들에게 주신 영광과 존귀를 알고 그들에게 복종하며 당신의 뜻을 거스르는 일이 없게 하셨습니다. 그들에게 건강과 평강과 한마음과 안정됨을 주십시오. 그래서 그들이 당신께서 그들에게 주신 지도권을 걸림 없이 다스리게 하십시오.[a][b]
  to: 주님, 당신은 당신의 장엄하고 말로 다 표현할 수 없는 권능을 통하여 그들에게 통치의 권한을 주셨습니다. 이는 우리가 당신께서 그들에게 주신 영광과 존귀를 알고 그들에게 복종하며, 아무 일에도 당신의 뜻을 거스르지 않게 하려는 것입니다. 주님, 그들에게 건강과 평강과 한마음과 안정을 주셔서, 당신께서 그들에게 주신 통치 권한을 막힘없이 수행하게 하십시오.
  rationale: 원문의 통치 권한 위임, 시민의 복종이라는 목적, 그리고 통치자들을 위한 기도의 청원을 보존했습니다. ‘말로 다 표현할 수 없는’은 ἀνεκδιηγήτου의 불가언적 성격을 자연스러운 현대 한국어로 드러내며, 별도의 해석적 각주는 필요하지 않습니다. 초안의 [a][b] 표지는 대응하는 각주가 없으므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:53Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. διὰ τοῦ ... κράτους σου는 하나님의 권능을 ‘따라’가 아니라 ‘통하여’라는 수단·근거의 관계로 나타내며, ἐξουσίαν τῆς βασιλείας는 ‘나라의 권위’보다 ‘통치의 권한’이 정확합니다. 또한 εἰς τὸ 이하의 목적을 ‘없게 하셨습니다’라는 단정적 결과보다 목적 표현으로 보존해야 합니다.
  naturalness: 전반적으로 기도문의 합쇼체는 자연스럽지만, ‘안정됨’은 다소 명사화가 어색하고, ‘지도권을 ... 다스리다’는 의미가 중복됩니다. ‘안정’ 및 ‘통치 권한을 막힘없이 수행하다’가 자연스럽습니다.
  terminology: δέσποτα를 ‘주님’으로 옮긴 것은 기도문 문맥에서 적절합니다. κράτος의 ‘권능’, ὑποτάσσεσθαι의 ‘복종하다’, ὁμόνοια의 ‘한마음’도 가능합니다. 다만 통치 관련 표현은 ‘통치의 권한’으로 바로잡아야 합니다.
  issues:
  - severity: medium
    issue: ‘당신의 ... 권능을 따라’
    rationale: διὰ는 여기서 ‘통하여/힘입어’를 뜻하며, ‘따라’는 기준·양식의 뉘앙스로 바뀝니다.
  - severity: high
    issue: ‘나라의 권위’
    rationale: ἐξουσίαν τῆς βασιλείας는 국가나 영토의 권위가 아니라 그들에게 주어진 통치의 권한을 가리킵니다.
  - severity: medium
    issue: ‘... 없게 하셨습니다’
    rationale: εἰς τὸ + 부정사는 권위 부여의 목적, 곧 우리가 알고 복종하도록 하려는 목적을 나타냅니다. 번역도 목적 관계를 드러내야 합니다.
  - severity: medium
    issue: ‘지도권을 걸림 없이 다스리게’
    rationale: ἡγεμονία는 통치권·통치의 직무이며, 이를 ‘다스리다’라고 하면 어휘가 중복됩니다. ἀπροσκόπως는 이 직무를 방해 없이 수행한다는 뜻으로 옮기는 것이 자연스럽습니다.
  revised_text: 주님, 당신은 당신의 장엄하고 말로 다 표현할 수 없는 권능을 통하여 그들에게 통치의 권한을 주셨습니다. 이는 우리가 당신께서 그들에게 주신 영광과 존귀를 알고 그들에게 복종하며, 아무 일에도 당신의 뜻을 거스르지 않게 하려는 것입니다. 주님, 그들에게 건강과 평강과 한마음과 안정을 주셔서, 당신께서 그들에게 주신 통치 권한을 막힘없이 수행하게 하십시오.
