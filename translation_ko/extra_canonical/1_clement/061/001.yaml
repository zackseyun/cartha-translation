id: 1CLEM.61.1
reference: 1 Clement 61:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Σύ, δέσποτα, ἔδωκας τὴν ἐξουσίαν τῆς βασιλείας αὐτοῖς διὰ τοῦ μεγαλοπρεποῦς καὶ ἀνεκδιηγήτου κράτους σου, εἰς τὸ γινώσκοντας ἡμᾶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην δόξαν καὶ τιμὴν ὑποτάσσεσθαι αὐτοῖς, μηδὲν ἐναντιουμένους τῷ θελήματί σου· οἷς δός, κύριε, ὑγίειαν, εἰρήνην, ὁμόνοιαν, εὐστάθειαν, εἰς τὸ διέπειν αὐτοὺς τὴν ὑπὸ σοῦ δεδομένην αὐτοῖς ἡγεμονίαν ἀπροσκόπως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/001.yaml
  text: You, Master, gave them the authority of rule through your magnificent and indescribable might, so that, knowing the glory and honor given to them by you, we might submit ourselves to them, opposing your will in nothing. Grant to them, Lord, health, peace, concord, and stability, so that they may administer without offense the leadership you have given them.
translation:
  language: ko
  text: 주님, 당신은 당신의 장엄하고 말로 다 표현할 수 없는 권능을 통하여 그들에게 통치의 권한을 주셨습니다. 이는 우리가 당신께서 그들에게 주신 영광과 존귀를 알고 그들에게 복종하며, 아무 일에도 당신의 뜻을 거스르지 않게 하려는 것입니다. 주님, 그들에게 건강과 평강과 한마음과 안정을 주셔서, 당신께서 그들에게 주신 통치 권한을 막힘없이 수행하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα
  english_pob_choice: Master
  chosen_korean: 주님
  alternatives_korean:
  - 주인님
  - 상전이시여
  - 주여
  lexicon: δέσποτα
  rationale: 호소하는 기도문 맥락에서 직접 호칭으로 자연스러운 ‘주님’을 택하되, 한국어의 경외 표현을 유지했습니다. ‘상전’은 위계감이 지나치고, ‘주인님’은 현대 예배 언어로 부자연스럽습니다.
- source_word: ἐξουσίαν τῆς βασιλείας
  english_pob_choice: the authority of rule
  chosen_korean: 나라의 권위
  alternatives_korean:
  - 통치의 권한
  - 왕권의 권위
  - 나라를 다스릴 권세
  lexicon: ἐξουσία / βασιλεία
  rationale: 복합 표현의 초점을 ‘통치 권한’이 아니라 통치 질서 자체의 위임으로 보아 ‘나라의 권위’로 간결하게 옮겼습니다. ‘왕국’보다 여기서는 통치 영역보다 권위 부여가 더 두드러집니다.
- source_word: κράτους
  english_pob_choice: might
  chosen_korean: 권능
  alternatives_korean:
  - 능력
  - 힘
  - 위력
  lexicon: κράτος
  rationale: 하나님의 압도적 힘을 가리키는 말이므로, 단순한 신체적 ‘힘’보다 격이 있는 ‘권능’이 적절합니다.
- source_word: ὑποτάσσεσθαι αὐτοῖς
  english_pob_choice: we might submit ourselves to them
  chosen_korean: 우리가 ... 그들에게 복종하며
  alternatives_korean:
  - 우리가 ... 그들에게 순종하며
  - 우리가 ... 그들에게 굴복하며
  - 우리가 ... 그들 아래에 놓이며
  lexicon: ὑποτάσσω
  rationale: 권위 아래 자발적으로 자신을 두는 의미를 살려 ‘복종하다’로 옮겼습니다. 본문은 단순한 내적 동의보다 실제적 종속을 말합니다.
- source_word: ὁμόνοιαν, εὐστάθειαν
  english_pob_choice: concord, and stability
  chosen_korean: 한마음과 안정됨
  alternatives_korean:
  - 일치와 견고함
  - 화합과 안정
  - 일치와 확고함
  lexicon: ὁμόνοια / εὐστάθεια
  rationale: ἁμόνοια는 관계적 일치를, εὐστάθεια는 흔들리지 않는 안정 상태를 가리키므로 각각 ‘한마음’과 ‘안정됨’으로 대응했습니다.
theological_decisions:
- issue: 통치권의 근원이 인간 지도자에게 있는지, 하나님께서 위임하신 것으로 이해하는지
  chosen_reading: 통치의 권위는 하나님께서 ‘그들에게 주신’ 것으로 번역해, 지도자 권위의 위임성을 분명히 했습니다.
  alternative_readings:
  - 왕권을 그들에게 부여하셨다
  - 그들에게 통치권을 세우셨다
  rationale: 본문의 διὰ τοῦ ... κράτους σου와 뒤이은 ὑπὸ σοῦ δεδομένην은 권위의 근원이 하나님의 능력과 부여에 있음을 강조합니다.
  doctrine_reference: 위임된 권위와 섭리 아래의 시민적 복종
