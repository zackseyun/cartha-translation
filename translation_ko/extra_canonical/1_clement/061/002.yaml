review_pass:
  verdict: revise
  source_fidelity: 현 초안은 διεύθυνον을 청원으로 처리한 점과 εὐσεβῶς를 ‘경건하게’로 옮긴 점은 적절합니다. 그러나 ‘영원들의 하늘의 왕’은 ἐπουράνιε βασιλεῦ τῶν αἰώνων의 수식 관계를 부자연스럽게 만들며, ‘땅 위에 있는 이들에게 대한’은 권세의 대상 표현으로 불명확합니다. 또한 ‘계획을 … 다스리시어’는 βουλή와 διευθύνω의 결합을 자연스럽게 전달하지 못합니다. 말미의 ‘주님의 호의’는 제공된 영어 POB의 ‘your favor’와 일치하지만, 제시된 정규화 OCR 본문에는 이에 대응할 명사가 보이지 않아 본문 전승/ OCR 확인이 필요합니다.
  naturalness: 합쇼체 기도문으로서 문장 흐름이 다소 어색합니다. 특히 ‘영원들의 하늘의 왕’, ‘좋고 기쁜 바’, ‘계획을 다스리시어’는 현대 표준어에서 자연스럽지 않습니다. ‘하늘에 계신 영원한 왕’, ‘선하고 주님께서 기뻐하시는 바’, ‘그들의 뜻을 바르게 이끌어 주셔서’가 자연스럽고 기도문의 높임말에도 맞습니다.
  terminology: δέσποτα는 기도문에서 ‘주재여’가 주권적 호칭을 더 잘 보존하며, κύριε는 ‘주님’으로 옮길 수 있습니다. αἰώνων은 한국어에서 문자적 복수 ‘영원들’보다 ‘영원한’이 자연스럽게 시대 전체의 의미를 전달합니다. βουλή는 통치자들의 ‘계획’보다 ‘뜻’ 또는 ‘의논’이 문맥상 더 포괄적입니다.
  issues:
  - severity: medium
    issue: ‘영원들의 하늘의 왕’은 원문의 수식 구조와 한국어 어법을 모두 흐립니다.
    rationale: ἐπουράνιε는 ‘왕’을 수식하고, τῶν αἰώνων은 ‘시대들의/영원의’ 왕이라는 뜻입니다. ‘하늘에 계신 영원한 왕’이 안전하고 자연스럽습니다.
  - severity: medium
    issue: ‘땅 위에 있는 이들에게 대한 영광과 존귀와 권세’는 권세가 누구/무엇 위에 행사되는지 불명확합니다.
    rationale: τῶν ἐπὶ τῆς γῆς ὑπαρχόντων은 ἐξουσία의 범위를 나타냅니다. ‘땅 위에 있는 자들을 다스릴’로 명시하는 편이 한국어 문장 구조상 분명합니다.
  - severity: medium
    issue: ‘그들의 계획을 … 다스리시어’는 διεύθυνον τὴν βουλὴν αὐτῶν의 의미를 부정확하고 어색하게 전달합니다.
    rationale: διεύθυνον은 ‘바르게 인도하다/바른 방향으로 이끌다’이고 βουλή는 계획·의논·뜻입니다. 하나님이 그들의 뜻을 바르게 이끄시기를 비는 청원으로 옮겨야 합니다.
  - severity: high
    issue: 말미의 ‘주님의 호의’에 대한 그리스어 근거가 제공된 OCR 본문에서 확인되지 않습니다.
    rationale: 제시된 본문은 ‘… δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν’으로 되어 있어 문법·의미상 손상된 것으로 보입니다. 영어 POB는 ‘your favor’를 채택하므로 번역문도 이를 따를 수 있으나, 비평 본문에서 통상 읽히는 ‘τῆς σῆς εὐμενείας’ 등 해당 어구를 대조 확인해야 합니다.
  revised_text: 주재여, 주께서는 하늘에 계신 영원한 왕이시며, 사람의 자녀들에게 땅 위에 있는 자들을 다스릴 영광과 존귀와 권세를 주십니다. 주님, 그들의 뜻을 주님 앞에서 선하고 주님께서 기뻐하시는 바에 따라 바르게 이끌어 주셔서, 그들이 평화와 온유함 가운데 경건하게 주께서 그들에게 주신 권세를 행사하며 주님의 호의를 얻게 하십시오.[a]
  revised_footnotes:
  - marker: a
    text: 제공된 그리스어 OCR 본문의 말미는 손상되었거나 탈락된 것으로 보입니다. 영어 POB의 ‘your favor’는 통상 전승되는 ‘당신의 호의’를 뜻하는 어구를 따른 것입니다.
    reason: 제공된 원문 표기와 영어 POB 감사 기록 사이의 불일치를 투명하게 밝히고, 본문 의미를 임의로 변경하지 않기 위함입니다.
  revision_rationale: 청원형 명령법을 유지하면서, 호칭·수식 관계·통치 권세의 범위·통치자들의 뜻을 인도한다는 의미를 현대 표준어 합쇼체로 명료하게 다듬었습니다. 제공된 영어 POB가 채택한 ‘주님의 호의’는 유지하되, 제공된 정규화 OCR과의 텍스트상 불일치는 각주로 표시했습니다.
