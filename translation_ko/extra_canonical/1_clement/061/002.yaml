id: 1CLEM.61.2
reference: 1 Clement 61:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: σὺ γάρ, δέσποτα, ἐπουράνιε βασιλεῦ τῶν αἰώνων, δίδως τοῖς υἱοῖς τῶν ἀνθρώπων δόξαν καὶ τιμὴν καὶ ἐξουσίαν τῶν ἐπὶ τῆς γῆς ὑπαρχόντων· σὺ, κύριε, διεύθυνον τὴν βουλὴν αὐτῶν κατὰ τὸ καλὸν καὶ εὐάρεστον ἐνώπιον σου, ὅπως διέποντες ἐν εἰρήνῃ καὶ πραΰτητι εὐσεβῶς τὴν ὑπὸ σοῦ αὐτοῖς δεδομένην ἐξουσίαν θεοῦ σου τυγχάνωσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/002.yaml
  text: For you[a], Master, heavenly King of the ages, give glory and honor and authority to the sons of men over those who are on the earth. You, Lord, direct their counsel according to what is good and pleasing before you, so that, governing in peace and gentleness, and with godliness, the authority you have given them, they may obtain your favor.
  footnotes:
  - marker: a
    text: Or 'You, Lord, direct their counsel'.
    reason: previous_rendering
translation:
  language: ko
  text: 주여, 주께서는 영원들의 하늘의 왕이시니 사람의 아들들에게 땅 위에 있는 이들에게 대한 영광과 존귀와 권세를 주십니다. 주님, 그들의 계획을 주님 앞에서 좋고 기쁜 바에 따라 다스리시어, 평화와 온유함 가운데 경건하게 주께서 그들에게 주신 권세를 행사하며 주님의 호의를 얻게 하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέσποτα / κύριε
  english_pob_choice: Master / Lord
  chosen_korean: 주여 / 주님
  alternatives_korean:
  - 주인님
  - 지배자
  - 주
  lexicon: δέσποτα, κύριε
  rationale: δέσποτα는 단순한 ‘주’보다 직접적이고 절대적인 주권을 드러내므로 기도문에서는 ‘주여’로 살렸고, 뒤의 κύριε는 같은 호칭 반복을 피하면서도 청중에게 익숙한 ‘주님’으로 옮겼습니다.
- source_word: ἐπουράνιε βασιλεῦ τῶν αἰώνων
  english_pob_choice: heavenly King of the ages
  chosen_korean: 영원들의 하늘의 왕
  alternatives_korean:
  - 영원한 하늘의 왕
  - 세대들의 하늘 왕
  - 영원의 왕
  lexicon: ἐπουράνιε βασιλεῦ τῶν αἰώνων
  rationale: αἰώνων을 단순한 ‘영원’ 하나로 평탄화하지 않고 ‘영원들’로 반영해, 시대와 세월 전체를 포괄하는 복수적 뉘앙스를 살렸습니다.
- source_word: δόξαν καὶ τιμὴν καὶ ἐξουσίαν
  english_pob_choice: glory and honor and authority
  chosen_korean: 영광과 존귀와 권세
  alternatives_korean:
  - 영광과 명예와 권세
  - 영광과 존경과 통치권
  lexicon: δόξα, τιμή, ἐξουσία
  rationale: 세 단어의 병렬을 그대로 유지하되, τιμή는 문맥상 ‘명예’보다 격이 있는 ‘존귀’가 더 자연스럽고, ἐξουσία는 단순 권력이 아니라 위임된 통치 권한으로서 ‘권세’가 적절합니다.
- source_word: διεύθυνον τὴν βουλὴν αὐτῶν
  english_pob_choice: direct their counsel
  chosen_korean: 그들의 계획을 … 다스리시어
  alternatives_korean:
  - 그들의 조언을 인도하시어
  - 그들의 생각을 바르게 하시어
  - 그들의 의논을 이끄시어
  lexicon: διευθύνω, βουλή
  rationale: βουλή는 단순한 ‘조언’보다 내적 결의와 계획을 가리킬 수 있어 ‘계획’으로 옮겼고, διεύθυνον의 통치적 방향 설정을 반영해 ‘다스리시어’로 처리했습니다.
- source_word: εὐσεβῶς
  english_pob_choice: with godliness
  chosen_korean: 경건하게
  alternatives_korean:
  - 경건히
  - 하나님을 경외하며
  - 신앙적으로
  lexicon: εὐσεβῶς
  rationale: 부사형 의미를 살려 한국어에서도 자연스러운 서술부사 ‘경건하게’로 옮겼으며, 단순한 도덕성보다 하나님께 향한 삶의 태도를 드러냅니다.
theological_decisions:
- issue: 청원문의 어조와 imperative force
  chosen_reading: 전체를 하나님께 드리는 기도적 청원으로 읽고, ‘주님, 그들의 계획을 … 다스리시어’ 및 뒤의 청원형을 사용했습니다.
  alternative_readings:
  - 서술형으로 ‘주님이 그들의 계획을 다스리십니다’로 읽는 방식
  - 명령형을 완화해 간접화하는 방식
  rationale: 그리스어 διεύθυνον은 2인칭 단수 부정과거 명령형이므로, 영어 수정안의 취지를 반영해 청원문으로 드러내는 것이 문법과 장르에 더 충실합니다.
  doctrine_reference: 기도문 어조와 직설법/명령법 구분
