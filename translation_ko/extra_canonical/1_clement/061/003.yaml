id: 1CLEM.61.3
reference: 1 Clement 61:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν, σοὶ ἐξομολογούμεθα διὰ τοῦ ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ σοι ἡ δόξα καὶ ἡ μεγαλωσύνη καὶ νῦν καὶ εἰς γενεὰν γενεῶν καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/061/003.yaml
  text: To you[a], who alone are able to do these and greater good things among us, we give thanks through the high priest and guardian of our souls, Jesus Christ, through whom be the glory and the majesty to you both now and from generation to generation and unto the ages of ages[b]. Amen.
  footnotes:
  - marker: a
    text: Or 'Jesus the Messiah'.
    reason: previous_rendering
  - marker: b
    text: Or 'You alone are able to do these things and greater good things for us; to you we give thanks'.
    reason: previous_rendering
translation:
  language: ko
  text: 이러한 일들과 그보다 더 많은 선한 일들을 우리 가운데서 행하실 수 있는 유일한 분이신 당신께, 우리 영혼의 대제사장과 보호자이신 예수 그리스도를 통하여 우리가 감사드립니다. 그분을 통하여 지금도, 세대에서 세대로, 그리고 세세토록 당신께 영광과 위엄이 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μόνος δυνάμενος ποιῆσαι ταῦτα καὶ περισσότερα ἀγαθὰ μεθ’ ἡμῶν
  english_pob_choice: who alone are able to do these and greater good things among us
  chosen_korean: 이 일들과 그보다 더 큰 선한 일들을 우리 가운데서만 하실 수 있는 분이신 당신께
  alternatives_korean:
  - 당신은 이 일들과 그보다 더 큰 선한 일들을 홀로 하실 수 있으며
  - 이 일들과 더 큰 선한 일들을 우리와 함께 하실 수 있는 유일하신 분께
  lexicon: δυνάμενος / ποιῆσαι / μεθ’ ἡμῶν
  rationale: 단일 도치 구조를 살려 '우리 가운데서만'으로 μεθ’ ἡμῶν의 공동체적 현존을 반영했고, '선한 일들'은 ἀγαθὰ를 명시적으로 옮겨 축복의 성격을 드러냈습니다.
- source_word: ἐξομολογούμεθα
  english_pob_choice: we give thanks
  chosen_korean: 우리가 감사드립니다
  alternatives_korean:
  - 우리가 찬양드립니다
  - 우리가 고백합니다
  lexicon: ἐξομολογέομαι
  rationale: 이 문맥에서는 하나님께 드리는 감사와 찬양의 예식적 응답을 가리키므로, 한국어 예배체에서 자연스러운 '감사드립니다'로 옮겼습니다.
- source_word: ἀρχιερέως καὶ προστάτου τῶν ψυχῶν ἡμῶν
  english_pob_choice: the high priest and guardian of our souls
  chosen_korean: 우리 영혼의 대제사장과 보호자
  alternatives_korean:
  - 우리 영혼의 큰제사장과 인도자
  - 우리 영혼의 대제사장과 지키는 이
  lexicon: ἀρχιερεύς / προστάτης / ψυχαί
  rationale: ἀρχιερεύς는 제사장 체계의 최고 직분을 나타내는 '대제사장'이 가장 직접적이며, προστάτης는 단순한 보호보다 돌보고 지키는 후원자적 의미를 포함해 '보호자'로 옮겼습니다.
- source_word: Ἰησοῦ Χριστοῦ
  english_pob_choice: Jesus Christ
  chosen_korean: 예수 그리스도
  alternatives_korean:
  - 예수 메시아
  - 예수 그리스도
  lexicon: Χριστός
  rationale: 이 절의 장중한 송영 문맥에서는 Χριστός가 기능상 고유명사화되어 있어 '그리스도'를 유지하는 것이 POB 개정 근거와 일치합니다.
- source_word: ἡ μεγαλωσύνη
  english_pob_choice: the majesty
  chosen_korean: 위엄
  alternatives_korean:
  - 장엄함
  - 권세
  lexicon: μεγαλωσύνη
  rationale: 왕적·송영적 의미를 살리면서도 한국어 예배 언어로 자연스럽고 과도하게 해석적이지 않은 표현은 '위엄'입니다.
theological_decisions:
- issue: 송영의 수신자와 중보 구조
  chosen_reading: 아버지께 드리는 감사와 영광이 '우리 영혼의 대제사장과 보호자이신 예수 그리스도'를 통하여 올라가는 삼중 구조로 읽었습니다.
  alternative_readings:
  - 예수 그리스도 자신에게 직접 드리는 송영으로 읽는 견해
  - 문장 전체를 단순한 축원문으로 보는 견해
  rationale: 그리스어의 σοὶ / διὰ τοῦ / δι’ οὗ 구조가 감사의 대상, 중보 수단, 종결 영광을 분명히 나누므로, 본문이 가진 예전적 질서를 한국어에서도 유지했습니다.
  doctrine_reference: 기독론적 중보 이해와 삼위적 송영 구조
