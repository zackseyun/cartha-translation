source:
  edition: Funk 1901 (normalized OCR)
  text: Κολληθῶμεν οὖν τῇ εὐλογίᾳ αὐτοῦ καὶ ἴδωμεν, τίνες αἱ ὁδοὶ τῆς εὐλογίας. ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα. . τίνος χάριν ηὐλογήθη ὁ πατὴρ ἡμῶν Ἀβραάμ, οὐχὶ δικαιοσύνην καὶ ἀλήθειαν διὰ πίστεως ποιήσας; 3. Ἰσαὰκ μετὰ πεποιθήσεως γινώσκων τὸ μέλλον ἡδέως προσήγετο θυσία. 4. Ἰακὼβ μετὰ ταπεινοφροσύνης ἐξεχώρησεν τῆς γῆς αὐτοῦ δι’ ἀδελφὸν καὶ ἐπορεύθη πρὸς Λαβὰν καὶ ἐδούλευσεν, καὶ ἐδόθη αὐτῷ τὸ δωδεκάσκηπτρον τοῦ Ἰσραήλ.
  language: Greek
  pages:
  - 301
  note: This chapter comes from the normalized Funk 1901 OCR layer.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/031.yaml
  text: Let us therefore cling to his blessing[a], and let us see what the ways of blessing are. Let us unfold the things that have happened from the beginning. For what reason was our father Abraham blessed? Was it not because he practiced righteousness and truth through faith? Isaac, knowing with confidence what was to come, gladly allowed himself to be led as a sacrifice. Jacob, with humility, departed from his land because of his brother and went to Laban and served[b][c][d], and to him was given the twelve-sceptered people of Israel.
  footnotes:
  - marker: a
    text: Or 'by faith.' The Greek phrase διὰ πίστεως can be rendered either way in English; the sense remains instrumental.
    reason: lexical_alternative
    anchor_ref: '31:2'
  - marker: d
    text: The wording highlights Isaac's willing submission in the binding narrative; compare Genesis 22.
    reason: cross_reference
    anchor_ref: '31:3'
  - marker: c
    text: Literally 'the twelve-sceptered [thing/people] of Israel,' an elevated expression referring to Israel as constituted in twelve tribal rulerships.
    reason: lexical_alternative
    anchor_ref: '31:4'
  - marker: b
    text: Or 'knowing what was to come with confidence'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리는 그의 복에 굳게 붙들리고, 복의 길들이 무엇인지 보아야 합니다. 처음부터 일어난 일들을 펼쳐 보아야 합니다. 우리 조상 아브라함이 어떤 이유로 복을 받았습니까? 그가 믿음을 통해 의와 진리를 행했기 때문이 아니겠습니까? 이삭은 앞으로 올 일을 확신하고서 즐거이 제물로 바쳐지기를 스스로 허락했습니다. 야곱은 겸손으로 자기 땅을 떠나 형 때문에 라반에게 가서 섬겼으며, 그에게 이스라엘의 열두 홀뿌리 백성이 주어졌습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κολληθῶμεν
  english_pob_choice: Let us therefore cling
  chosen_korean: 우리는 ... 굳게 붙들리고
  alternatives_korean:
  - 우리는 ... 매달리고
  - 우리는 ... 달라붙고
  lexicon: BDAG
  rationale: 호소적 권면의 뉘앙스를 살리면서, 한국어에서는 ‘굳게 붙들다’가 강한 결속과 의존을 가장 자연스럽게 드러냅니다.
- source_word: τῇ εὐλογίᾳ / ὁδοὶ τῆς εὐλογίας
  english_pob_choice: his blessing / the ways of blessing
  chosen_korean: 그의 복 / 복의 길들
  alternatives_korean:
  - 그의 축복 / 축복의 길들
  - 그의 복 / 복의 방식들
  lexicon: BDAG
  rationale: εὐλογία를 전통적 교회어 ‘축복’보다 ‘복’으로 옮겨, 하나님이 주시는 복과 그 복의 길이라는 문맥을 더 직접적으로 살렸습니다.
- source_word: ἀνατυλίξωμεν τὰ ἀπ’ ἀρχῆς γενόμενα
  english_pob_choice: Let us unfold the things that have happened from the beginning
  chosen_korean: 처음부터 일어난 일들을 펼쳐 보아야 합니다
  alternatives_korean:
  - 처음부터 일어난 일들을 풀어 보아야 합니다
  - 처음부터 생긴 일들을 펼쳐야 합니다
  lexicon: LSJ
  rationale: ‘펼치다’는 두루마리를 펴는 은유를 보존하면서도 현대 한국어에서 자연스럽게 읽히며, 서술의 회고적 성격도 살립니다.
- source_word: διὰ πίστεως ποιήσας
  english_pob_choice: he practiced righteousness and truth through faith
  chosen_korean: 믿음을 통해 의와 진리를 행했기
  alternatives_korean:
  - 믿음으로 의와 진리를 행했기
  - 믿음을 따라 의와 진리를 실천했기
  lexicon: BDAG
  rationale: διά + γεν.의 수단적 관계를 ‘통해’로 살렸고, ποιέω는 단순 ‘하다’보다 윤리적 실천을 드러내는 ‘행하다’가 적절합니다.
- source_word: προσήγετο θυσία
  english_pob_choice: gladly allowed himself to be led as a sacrifice
  chosen_korean: 즐거이 제물로 바쳐지기를 스스로 허락했습니다
  alternatives_korean:
  - 즐거이 희생 제물로 나아갔습니다
  - 즐거이 제물로 드려지도록 자신을 맡겼습니다
  lexicon: BDAG
  rationale: 이삭의 자발성과 희생 제의적 배경을 함께 드러내기 위해, 단순히 ‘제물로 되었다’보다 ‘스스로 허락했다’를 택했습니다.
- source_word: δωδεκάσκηπτρον τοῦ Ἰσραήλ
  english_pob_choice: the twelve-sceptered people of Israel
  chosen_korean: 이스라엘의 열두 홀뿌리 백성
  alternatives_korean:
  - 이스라엘의 열두 지파
  - 이스라엘의 열두 홀이 있는 백성
  lexicon: LSJ
  rationale: 원문의 과장되고 상징적인 합성어를 평면화하지 않기 위해 ‘열두 홀뿌리’로 직역성을 남기되, ‘백성’을 보충해 한국어 문장을 읽히게 했습니다.
theological_decisions:
- issue: 아브라함의 복이 믿음과 의·진리 실천의 관계로 제시됨
  chosen_reading: 후대의 바울식 대비를 끌어들이지 않고, 원문의 병렬 표현을 그대로 살려 아브라함의 복을 ‘믿음을 통한 의와 진리의 실천’으로 옮겼습니다.
  alternative_readings:
  - ‘믿음으로 의와 진리를 행했다’로 더 압축해 옮김
  - πίστις를 ‘신실함’으로 옮김
  rationale: 원문은 믿음과 윤리적 행위를 함께 제시하므로, 둘 사이의 긴장을 지우지 않되 문법적 연결을 분명히 하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension; πίστις default ''faith'' unless context demands otherwise.'
- issue: 이삭의 희생 참여 방식
  chosen_reading: ‘스스로 허락했습니다’로 옮겨, 희생 제물로 끌려가는 수동성과 자발적 순종을 함께 남겼습니다.
  alternative_readings:
  - ‘제물로 바쳐졌습니다’
  - ‘기꺼이 제물로 나아갔습니다’
  rationale: 본문과 POB 주석이 이삭의 자발적 참여를 강조하므로, ‘바쳐졌다’만으로는 사라질 수 있는 의지성을 보존해야 합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension; keep source-level ambiguity where the Greek permits it.'
