id: 1CLEM.30.8
reference: 1 Clement 30:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: θράσος καὶ αὐθάδεια καὶ τόλμα τοῖς κατηραμένοις ὑπὸ τοῦ θεοῦ· ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης παρὰ τοῖς ηὐλογημένοις ὑπὸ τοῦ θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/008.yaml
  text: Insolence and arrogance and recklessness belong to those cursed by God[a]; but gentleness and humility and meekness are found among those blessed by God.
  footnotes:
  - marker: a
    text: Or 'Boldness'.
    reason: previous_rendering
translation:
  language: ko
  text: 교만과 오만과 무모함은 하나님께 저주받은 자들에게 속한 것이며[a], 온유와 겸손과 온순함은 하나님께 복을 받은 자들 가운데 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θράσος
  english_pob_choice: Insolence
  chosen_korean: 교만
  alternatives_korean:
  - 무례
  - 건방짐
  - 무모함
  - 대담함
  lexicon: θράσος
  rationale: 이 문맥의 θράσος는 긍정적 ‘대담함’이 아니라 하나님 앞에서의 뻔뻔하고 거친 태도를 가리키므로, 한국어에서는 의미 중심으로 ‘교만’으로 옮겨 비난적 뉘앙스를 살렸습니다.
- source_word: αὐθάδεια
  english_pob_choice: arrogance
  chosen_korean: 오만
  alternatives_korean:
  - 독선
  - 거만
  - 자기중심성
  lexicon: αὐθάδεια
  rationale: αὐθάδεια는 자기 뜻을 고집하며 남을 고려하지 않는 태도를 뜻하므로, 한국어의 정착된 부정적 덕목 대응어인 ‘오만’이 가장 자연스럽습니다.
- source_word: τόλμα
  english_pob_choice: recklessness
  chosen_korean: 무모함
  alternatives_korean:
  - 무모한 대담함
  - 무분별함
  - 무절제한 용기
  lexicon: τόλμα
  rationale: τόλμα는 여기서 칭찬할 만한 용기가 아니라 분별 없는 돌진을 뜻하므로, ‘무모함’으로 옮겨 비난의 강도를 유지했습니다.
- source_word: ἐπιείκεια καὶ ταπεινοφροσύνη καὶ πραΰτης
  english_pob_choice: gentleness and humility and meekness
  chosen_korean: 온유와 겸손과 온순함
  alternatives_korean:
  - 관용과 겸손과 온유
  - 부드러움과 겸손과 온유함
  lexicon: ἐπιείκεια / ταπεινοφροσύνη / πραΰτης
  rationale: 세 덕목의 병렬을 살리되, ἐπιείκεια는 ‘관용’보다 문맥상 부드럽고 너그러운 태도를 뜻하는 ‘온유’로, ταπεινοφροσύνη는 ‘겸손’, πραΰτης는 순한 성품의 ‘온순함’으로 구분해 번역했습니다.
theological_decisions:
- issue: ‘복/저주’의 대조가 행위의 윤리적 귀결을 단정하는지 여부
  chosen_reading: 본문의 대조를 도덕적 성향의 소속과 결과를 함께 드러내는 진술로 유지했습니다.
  alternative_readings:
  - 단순한 성품 묘사로 약화
  - 명시적 심판 선언으로 강화
  rationale: 그리스어의 ὑπό/παρά 구문은 각각 ‘하나님께 저주받은 자들/복을 받은 자들 가운데’라는 소속·상태를 나타내므로, 한국어도 그 대조를 약화하거나 과도하게 확장하지 않고 그대로 살렸습니다.
  doctrine_reference: 성화와 윤리적 열매에 대한 일반적 신약적 증언
- issue: ‘ταπεινοφροσύνη’와 ‘πραΰτης’의 덕목 구분
  chosen_reading: 겸손과 온순함을 별개의 덕목으로 구분해 유지했습니다.
  alternative_readings:
  - 둘을 하나의 완만한 성품으로 합침
  - ‘온유’ 하나로 평탄화
  rationale: 본문은 세 덕목을 나란히 제시하므로, 한국어에서도 의미가 겹치더라도 각각의 윤리적 초점을 보존하는 것이 더 충실합니다.
  doctrine_reference: 덕목 목록의 병렬성과 수사 구조
