id: 1CLEM.30.1
reference: 1 Clement 30:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: Ἅγια οὖν μερὶς ὑπάρχοντες ποιήσωμεν τὰ τοῦ ἁγιασμοῦ πάντα, φεύγοντες καταλαλιάς, μιαράς τε καὶ ἀνάγνους συμπλοκὰς, μέθας τε καὶ νεωτεροποιΐας καὶ βδελυκτὰς ἐπιθυμίας, μυσερὰν μοιχείαν, βδελυκτὴν ὑπερηφανίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/001.yaml
  text: Therefore, since we are a holy portion, let us do all the things that belong to sanctification, fleeing slanders, foul and unclean entanglements, drunkenness and seditions, and detestable desires, loathsome adultery, detestable pride.
  footnotes:
  - marker: a
    text: Or 'fleeing slander, foul and unclean entanglements, drunkenness, seditions, and detestable desires, loathsome adultery, and hateful pride.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 우리는 거룩한 몫이니, 중상과 더럽고 부정한 얽힘과 술취함과 소요와 혐오스러운 욕망과 역겨운 간음과 혐오스러운 교만을 피하면서, 성화에 속한 모든 일을 행합시다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἅγια οὖν μερὶς ὑπάρχοντες
  english_pob_choice: since we are a holy portion
  chosen_korean: 우리는 거룩한 몫이니
  alternatives_korean:
  - 우리는 거룩한 부분이니
  - 우리는 거룩한 분깃이니
  lexicon: ἅγιος / μερίς
  rationale: μερὶς는 단순한 ‘부분’보다 ‘몫’ 또는 ‘분깃’이 더 분배받은 몫이라는 의미를 잘 살리므로, 문맥상 ‘거룩한 몫’으로 옮겼습니다.
- source_word: καταλαλιάς
  english_pob_choice: slanders
  chosen_korean: 중상
  alternatives_korean:
  - 비방
  - 헐뜯음
  lexicon: καταλαλιά
  rationale: 복수형이지만 한국어에서는 열거 목록에서 집합적 의미의 ‘중상’이 자연스럽고, 타인을 깎아내리는 말이라는 뜻을 직접 드러냅니다.
- source_word: μιαράς τε καὶ ἀνάγνους συμπλοκὰς
  english_pob_choice: foul and unclean entanglements
  chosen_korean: 더럽고 부정한 얽힘
  alternatives_korean:
  - 더럽고 부정한 교제
  - 추악하고 부정한 얽매임
  lexicon: μιαρός / ἀνάγνος / συμπλοκή
  rationale: συμπλοκαί는 단순한 ‘관계’보다 뒤엉켜 얽힌 접촉이나 결탁의 뉘앙스가 있어 ‘얽힘’이 source-direct합니다.
- source_word: μέθας τε καὶ νεωτεροποιΐας
  english_pob_choice: drunkenness and seditions
  chosen_korean: 술취함과 분열
  alternatives_korean:
  - 술취함과 소요
  - 주정과 선동
  lexicon: μέθη / νεωτεροποιΐα
  rationale: νεωτεροποιΐα는 정치적 혁명만이 아니라 공동체를 깨뜨리는 새 일으킴, 소요, 분열의 의미를 함께 가지므로 교회 문맥에서는 ‘분열’이 적절합니다.
- source_word: βδελυκτὰς ἐπιθυμίας ... βδελυκτὴν ὑπερηφανίαν
  english_pob_choice: detestable desires ... detestable pride
  chosen_korean: 혐오스러운 욕망과 ... 혐오스러운 교만
  alternatives_korean:
  - 가증한 욕망과 ... 가증한 교만
  - 역겨운 욕망과 ... 역겨운 교만
  lexicon: βδελυκτός / ἐπιθυμία / ὑπερηφανία
  rationale: 같은 형용사 βδελυκτός를 두 번 반복한 원문의 수사성을 살려 둘 다 동일하게 ‘혐오스러운’으로 옮겼습니다.
theological_decisions:
- issue: 거룩한 몫/정체성에서 윤리적 명령으로의 전환
  chosen_reading: ‘우리는 거룩한 몫이니, ... 피하면서, 성화에 속한 모든 일을 행합시다’로 옮겨 정체성 진술과 행위 촉구를 모두 보존했습니다.
  alternative_readings:
  - ‘우리가 거룩한 몫이므로’
  - ‘거룩한 몫으로서’
  rationale: οὖν과 ὑπάρχοντες가 근거 진술을 이루고 뒤의 ποιήσωμεν이 공동 권면을 이끄므로, 이유-명령 구조가 한국어에서도 드러나야 합니다.
  doctrine_reference: 성화는 신자의 신분에 근거한 실제적 순종으로 나타난다는 일반적 신약 윤리
