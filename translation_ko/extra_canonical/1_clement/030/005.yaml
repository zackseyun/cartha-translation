  source_fidelity: 초안의 첫 절은 ‘여자에게서 난 사람이니’가 원문에 없는 인과 관계를 덧붙이고, ‘짧은 생을 산 사람’과 결합하여 주어 구성이 부자연스럽습니다. γεννητὸς γυναικὸς와 ὀλιγόβιος는 동일한 이를 수식하므로 ‘여자에게서 나서 짧은 생을 사는 이’로 옮기는 것이 충실합니다. δεύτε 절의 ῥήμασιν은 일반적인 ‘말’이며, ‘말씀’은 한국어에서 경전·신적 말씀의 뉘앙스를 낼 수 있어 적절하지 않습니다.
  naturalness: ‘여자에게서 나서 짧은 생을 사는 이는 복된 사람입니다’는 현대 표준어 합쇼체로 자연스럽고, 짧은 격언의 선언적 어조를 유지합니다. ‘말이 많은 사람이 되지 마십시오’는 명령문의 자연스러운 한국어 표현입니다.
  terminology: εὐλογημένος은 여기서 ‘복된 사람입니다’로, γεννητὸς γυναικὸς는 ‘여자에게서 나서’로, ὀλιγόβιος는 ‘짧은 생을 사는’으로 옮겼습니다. ῥῆμα는 종교적 의미가 강한 ‘말씀’ 대신 ‘말’을 사용했습니다.
