translation:
  language: ko
  text: 여자에게서 난 사람이니 짧은 생을 산 사람은 복됩니다. 말씀을 많이 하는 사람이 되지 마십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένος
  english_pob_choice: Blessed
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복이 있습니다
  - 복된 사람입니다
  lexicon: μακάριος/εὐλογημένος
  rationale: 문장 전체가 축복 선언이므로 형용적 ‘복되다’보다 현대 합쇼체에서 자연스러운 선언문 ‘복됩니다’를 택했습니다.
- source_word: γεννητὸς γυναικὸς ὀλιγόβιος
  english_pob_choice: one born of woman, short-lived
  chosen_korean: 여자에게서 난 사람이니 짧은 생을 산 사람
  alternatives_korean:
  - 여자에게서 난 사람, 짧게 사는 사람
  - 여자에게서 난 짧은 생의 사람
  lexicon: γεννητὸς / γυναικός / ὀλιγόβιος
  rationale: ‘여자에게서 난’으로 출생 관계를 살리고, ‘짧은 생을 산 사람’으로 ὀλιγόβιος의 짧은 생애라는 뜻을 드러냈습니다.
- source_word: μὴ πολὺς ἐν ῥήμασιν γίνου
  english_pob_choice: Do not be one of many words
  chosen_korean: 말씀을 많이 하는 사람이 되지 마십시오
  alternatives_korean:
  - 말이 많은 사람이 되지 마십시오
  - 많은 말 속에 있지 마십시오
  lexicon: πολύς / ῥῆμα / γίνομαι
  rationale: 영어 POB의 문맥상 의미를 따라 ‘많은 말’을 품은 사람 됨을 자연스러운 한국어 관용으로 옮겼고, 합쇼체 명령으로 문체를 맞췄습니다.
theological_decisions:
- issue: 격언적 축복과 권면의 병치
  chosen_reading: 앞절의 복 선언과 뒤의 절제 권면을 분리해, 축복은 선언으로 권면은 명령형으로 살렸습니다.
  alternative_readings:
  - 둘을 한 문장으로 이어 유려하게 풀어쓰기
  - 권면을 단순한 조언으로 완화하기
  rationale: 그리스어는 두 독립절로 짧고 단호하게 병치하므로, 축복과 경계를 각각 선명하게 유지하는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 문학적-수사적 보존 원칙
