  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/005.yaml
  text: Blessed is one born of woman[a], short-lived. Do not be one of many words.
  footnotes:
  - marker: a
    text: Or '“Blessed is one born of woman, short-lived. Do not become excessive in words.”'.
