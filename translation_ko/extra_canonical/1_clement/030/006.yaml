    issue: 기원 표현의 자연스러움
    rationale: μὴ ἐξ αὐτῶν은 자신들에게서 유래하지 않는다는 뜻입니다. ‘우리 자신에게서 나와서는 안 됩니다’보다 ‘우리 자신에게서 비롯되어서는 안 됩니다’가 현대 한국어에서 더 자연스럽고 정확합니다.
  - severity: low
    issue: 접속 표현의 격식성
    rationale: 합쇼체의 문어적 번역에서는 ‘있어야지’보다 ‘있어야 하며’가 더 안정적입니다.
  revised_text: 우리의 찬양은 하나님 안에 있어야 하며, 우리 자신에게서 비롯되어서는 안 됩니다. 하나님께서는 스스로를 칭찬하는 자들을 미워하십니다.
