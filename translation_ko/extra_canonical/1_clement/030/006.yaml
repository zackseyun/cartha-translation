  text: ὁ ἔπαινος ἡμῶν ἔστω ἐν θεῷ καὶ μὴ ἐξ αὐτῶν· αὐτεπανέτους γὰρ μισεῖ ὁ θεός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/006.yaml
  text: Let our praise be in God and not from ourselves, for God hates those who praise themselves.
translation:
  language: ko
  text: 우리의 찬양은 하나님 안에 있어야 하며, 우리 자신에게서 비롯되어서는 안 됩니다. 하나님께서는 스스로를 칭찬하는 자들을 미워하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔπαινος ἡμῶν
  english_pob_choice: our praise
  chosen_korean: 우리의 찬양
  alternatives_korean:
  - 우리의 칭찬
  - 우리의 영광
  lexicon: ἔπαινος
  rationale: 공적·신앙적 맥락에서 ἔπαινος는 단순한 ‘칭찬’보다 ‘찬양’이 더 자연스럽고, 뒤의 하나님 중심 대비를 살리기에 적절합니다.
- source_word: ἔστω ἐν θεῷ
  english_pob_choice: Let ... be in God
  chosen_korean: 하나님 안에 있어야지
  alternatives_korean:
  - 하나님께 있어야 합니다
  - 하나님 안에서여야 합니다
  lexicon: ἐν + dative
  rationale: ἐν θεῷ는 출처보다 ‘영역/기반’을 강조하므로, ‘하나님 안에’로 옮겨 찬양의 근거와 소속을 드러냈습니다.
- source_word: μὴ ἐξ αὐτῶν
  english_pob_choice: not from ourselves
  chosen_korean: 우리 자신에게서 나와서는 안 됩니다
  alternatives_korean:
  - 우리에게서 비롯되어서는 안 됩니다
  - 우리 자신에게서 나오면 안 됩니다
  lexicon: ἐκ + genitive
  rationale: ἐξ αὐτῶν은 기원 부정을 뜻하므로, ‘~에서 나와서는 안 됩니다’로 출처를 분명히 했습니다.
- source_word: αὐτεπανέτους
  english_pob_choice: those who praise themselves
  chosen_korean: 스스로를 칭찬하는 자들
  alternatives_korean:
  - 자기 자랑하는 사람들
  - 자기 찬양하는 자들
  lexicon: αὐτεπαινέτος
  rationale: 희귀한 형용사를 기능적으로 풀어, 자기 자신을 칭찬하는 태도를 직접 드러내되 과도한 의역은 피했습니다.
theological_decisions:
- issue: 인간 자찬에 대한 하나님의 태도
  chosen_reading: 하나님께서는 스스로를 칭찬하는 자들을 미워하십니다.
  alternative_readings:
  - 하나님은 자기 찬양을 싫어하십니다
  - 하나님은 자기를 높이는 자들을 미워하십니다
  rationale: 본문의 μισεῖ는 강한 거부를 나타내므로 ‘미워하십니다’로 옮겨 경고의 강도를 유지했습니다.
  doctrine_reference: 겸손과 하나님 중심의 찬양
