id: 1CLEM.30.4
reference: 1 Clement 30:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: λέγει γάρ· Ὁ ἰὰ πολλὰ λέγων καὶ ἀντακουσεται· ἢ ὁ εὐλάλος οἴεται εἶναι δίκαιος;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/004.yaml
  text: For he says[a], “He who speaks many things will also hear in reply; or does the eloquent man think himself righteous?”
  footnotes:
  - marker: a
    text: Or '“He who says many things shall also hear in reply.” Or does the ready speaker think himself righteous?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말합니다[a]. 「많은 말을 하는 사람은 자기도 대답을 듣게 될 것이며, 말 잘하는 사람이 자신을 의롭다고 생각합니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει γάρ
  english_pob_choice: For he says
  chosen_korean: 그가 말합니다
  alternatives_korean:
  - 그가 말씀하십니다
  - 그가 말하였습니다
  lexicon: λέγω
  rationale: 인용을 도입하는 서술로서 현재형의 자연스러운 문어체를 택했고, 본문이 절대화된 어투가 아니므로 지나친 경어화는 피했습니다.
- source_word: Ὁ ἰὰ πολλὰ λέγων
  english_pob_choice: He who speaks many things
  chosen_korean: 많은 말을 하는 사람
  alternatives_korean:
  - 많은 것을 말하는 사람
  - 말이 많은 사람
  lexicon: λέγω
  rationale: 직역형을 유지하되 한국어에서 어색하지 않게 ‘많은 말을 하는 사람’으로 옮겨, 발화량이 많은 인물을 가리키는 뜻을 살렸습니다.
- source_word: εὐλάλος
  english_pob_choice: the eloquent man / the ready speaker
  chosen_korean: 말 잘하는 사람
  alternatives_korean:
  - 유창한 사람
  - 달변가
  lexicon: εὐλάλος
  rationale: εὐλάλος의 ‘말을 잘하는, 유창한’ 의미를 살리면서도 현대 한국어 독자에게 즉각 이해되는 표현으로 옮겼습니다.
- source_word: οἴεται εἶναι δίκαιος
  english_pob_choice: think himself righteous
  chosen_korean: 자신을 의롭다고 생각합니까
  alternatives_korean:
  - 자신이 의롭다고 여깁니까
  - 스스로 의롭다고 생각합니까
  lexicon: δίκαιος
  rationale: δίκαιος를 도덕적 칭찬이 아니라 ‘의롭다’는 법정·신학적 평가로 유지했고, 자기평가의 뉘앙스를 살리기 위해 재귀적 표현을 썼습니다.
theological_decisions:
- issue: 인용문 경계
  chosen_reading: 작은따옴표 없이 Job 인용 전체를 하나의 직접화법으로 이어서 처리했습니다.
  alternative_readings:
  - 첫 반절 뒤에 문장을 끊어 인용을 닫는 방식
  rationale: 그리스어는 λέγει γάρ 뒤에 이어지는 말을 하나의 연속 인용으로 제시하므로, 후반부를 화자의 별도 말로 오인하지 않게 해야 합니다.
  doctrine_reference: 본문·인용 구조
