revisions:
- from: 우리의 선한 행실에 대한 증언이 다른 이들에 의해 주어지게 하십시오[a]. 마치 그것이 우리의 의로운 조상들에게 주어졌던 것처럼 말입니다.
  to: 우리의 선한 행실에 대해서는 다른 이들이 증언하게 하십시오[a]. 우리의 의로운 조상들에게도 그렇게 증언이 주어졌습니다.
  rationale: 직역투 수동문을 자연스러운 한국어 권면문으로 고치되, 타인에게서 나오는 증언이라는 핵심 의미를 유지했습니다. 비교는 두 번째 문장의 ‘그렇게’로 연결했으며, πράξις의 의미 범위는 각주로 보존했습니다.
