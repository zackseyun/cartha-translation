review_pass:
  verdict: revise
  source_fidelity: 그리스어의 수동 명령형 διδόσθω 및 행위자는 ὑπ’ ἄλλων으로 잘 포착하려 했으나, ‘다른 이들에 의해 주어지게 하십시오’는 한국어에서 부자연스럽고 μαρτυρία가 무엇을 하는지 अस्पष्ट합니다. ‘다른 이들이 증언하게 하십시오’로 옮기면 수동문의 의미, 즉 자기증언이 아니라 타인의 증언이어야 한다는 점을 자연스럽게 보존합니다. 본문의 OCR상 ‘πράξεἡμῶν’은 문법상 τῆς ἀγαθῆς πράξεως ἡμῶν으로 읽히며, 단수 πράξεως는 여기서 일반적·포괄적인 선한 행실/행위를 가리킬 수 있습니다.
  naturalness: ‘마치 그것이 … 것처럼 말입니다’는 지시 대상이 모호하고, 합쇼체 권면문 안에서 ‘말입니다’가 불필요하게 구어적·해설적으로 들립니다. 두 문장으로 정리하고 ‘그렇게’로 비교를 잇는 편이 현대 표준 한국어 합쇼체에 자연스럽습니다.
  terminology: μαρτυρία는 ‘증언’, δίκαιοι는 ‘의로운 조상들’로 적절합니다. ἀγαθῆς πράξεως는 단일 행위와 일반적 행실 양쪽의 여지를 가지므로 본문에서는 ‘선한 행실’을 유지하고, 대안 번역을 각주로 제시합니다. 이는 영어 감사 기록의 ‘good deeds / good deed’ 변이도 무리 없이 반영합니다.
  issues:
  - severity: medium
    issue: 수동 명령문의 한국어 표현이 직역투입니다.
    rationale: ‘증언이 다른 이들에 의해 주어지게 하십시오’는 자연스러운 한국어 서술이 아니며, 누가 증언하는지가 흐려집니다. ‘다른 이들이 증언하게 하십시오’가 의미를 더 분명하고 자연스럽게 전달합니다.
  - severity: low
    issue: 비교절의 지시어와 종결 표현이 부자연스럽습니다.
    rationale: ‘그것이’는 증언인지 행실인지 즉시 분명하지 않고, ‘것처럼 말입니다’는 본문의 권면 어조에 맞지 않습니다.
  revised_text: 우리의 선한 행실에 대해서는 다른 이들이 증언하게 하십시오[a]. 우리의 의로운 조상들에게도 그렇게 증언이 주어졌습니다.
