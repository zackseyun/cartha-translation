id: 1CLEM.30.7
reference: 1 Clement 30:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: ἡ μαρτυρία τῆς ἀγαθῆς πράξεἡμῶν διδόσθω ὑπ’ ἄλλων, καθὼς ἐδόθη τοῖς πατράσιν ἡμῶν τοῖς δικαίοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/007.yaml
  text: Let the testimony of our good deeds be given by others[a], just as it was given to our righteous fathers.
  footnotes:
  - marker: a
    text: Or 'good deed'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 선한 행실에 대한 증언이 다른 이들에 의해 주어지게 하십시오[a]. 마치 그것이 우리의 의로운 조상들에게 주어졌던 것처럼 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μαρτυρία
  english_pob_choice: the testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 증언의 말
  - 평판
  lexicon: μαρτυρία
  rationale: 공적이고 외부에서 확인되는 말이라는 점을 살려 ‘증언’으로 옮겼습니다. 이 문맥에서는 단순한 정보 전달보다 삶에 대한 외부의 증언이 강조됩니다.
- source_word: τῆς ἀγαθῆς πράξεως
  english_pob_choice: our good deeds
  chosen_korean: 우리의 선한 행실
  alternatives_korean:
  - 우리의 좋은 행위
  - 우리의 선한 행동
  - 우리의 좋은 일
  lexicon: πρᾶξις
  rationale: πρᾶξις는 단발적 ‘행위’보다 지속적인 삶의 방식이나 행실을 가리킬 수 있으므로, 한국어에서는 문맥에 맞게 ‘행실’로 자연스럽게 풀었습니다.
- source_word: διδόσθω ὑπ’ ἄλλων
  english_pob_choice: be given by others
  chosen_korean: 다른 이들에 의해 주어지게 하십시오
  alternatives_korean:
  - 다른 이들이 주게 하십시오
  - 남들로부터 주어지게 하십시오
  - 다른 사람들에 의해 드러나게 하십시오
  lexicon: δίδωμι
  rationale: 수동 명령형의 뉘앙스를 살려, 주체가 자기 자신이 아니라 ‘다른 이들’임을 드러내는 표현으로 옮겼습니다.
- source_word: τοῖς δικαίοις
  english_pob_choice: our righteous fathers
  chosen_korean: 우리의 의로운 조상들에게
  alternatives_korean:
  - 우리의 의인들에게
  - 우리의 의로운 조상들에게도
  - 우리의 의인 조상들에게
  lexicon: δίκαιος
  rationale: δικαίοις는 ‘의로운/의인인’의 뜻이지만, 여기서는 조상들을 가리키므로 자연스럽게 ‘의로운 조상들’로 번역했습니다.
theological_decisions:
- issue: 행위의 공적 증언과 모범 전승
  chosen_reading: 공동체 밖의 사람들까지 인정할 수 있는 선한 삶의 증언이, 의로운 조상들에게서도 그랬듯이 성도들의 삶의 본이 되어야 한다는 권면으로 읽었습니다.
  alternative_readings:
  - 개별 선행 한두 가지에 대한 칭찬
  - 단순한 명성이나 평판에 대한 언급
  rationale: 본문은 단일한 ‘좋은 일’보다 삶 전체의 윤리적 모습에 대한 증언을 요청하는 문맥이어서, 공적 검증과 모범 계승의 뉘앙스를 살렸습니다.
  doctrine_reference: 윤리 권면 / 공동체적 본보기
