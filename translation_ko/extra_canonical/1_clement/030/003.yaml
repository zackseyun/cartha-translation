  - severity: low
    issue: ‘일치의 옷’
    rationale: 비유 자체는 보존하지만, τὴν ὁμόνοιαν은 이 문맥에서 ‘화합’으로 옮기는 것이 더 자연스럽고 의미 범위에 적절합니다.
