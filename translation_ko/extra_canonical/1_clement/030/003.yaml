id: 1CLEM.30.3
reference: 1 Clement 30:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: κολληθῶμεν οὖν ἐκείνοις, οἷς ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται· ἐνδυσώμεθα τὴν ὁμόνοιαν ταπεινοφρονοῦντες, ἐγκρατευόμενοι, ἀπὸ παντὸς ψιθυρισμοῦ καὶ καταλαλιᾶς πόρρω ἑαυτοὺς ποιοῦντες, ἔργοις δικαιούμενοι καὶ μὴ λόγοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/003.yaml
  text: Let us therefore cling to those to whom grace has been given from God. Let us clothe ourselves with concord, being humble-minded and self-controlled, keeping ourselves far from every whispering and slander, being justified by works and not by words.
translation:
  language: ko
  text: 그러므로 하나님의 은혜를 받은 이들에게 우리가 매여 가며, 겸손한 마음과 절제함으로 일치의 옷을 입고, 모든 속삭임과 중상에서 멀리 우리 자신을 지키며, 말이 아니라 행위로 의롭다 하심을 받읍시다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κολληθῶμεν οὖν ἐκείνοις
  english_pob_choice: Let us therefore cling to those
  chosen_korean: 그러므로 …에게 우리가 매여 가며
  alternatives_korean:
  - 붙들자
  - 달라붙읍시다
  - 연합합시다
  lexicon: κολλάω
  rationale: 단순한 친교보다 강한 결속을 나타내므로, ‘매여 가다’로 관계적 밀착과 지속성을 살렸습니다.
- source_word: ἡ χάρις ἀπὸ τοῦ θεοῦ δεδοται
  english_pob_choice: grace has been given from God
  chosen_korean: 하나님의 은혜를 받은
  alternatives_korean:
  - 하나님께서 주신 은혜를 받은
  - 하나님으로부터 은혜를 받은
  lexicon: χάρις
  rationale: 은혜의 수여를 자연스럽게 드러내면서도, 선물로 주어진 상태를 ‘받다’로 간결하게 반영했습니다.
- source_word: τὴν ὁμόνοιαν
  english_pob_choice: concord
  chosen_korean: 일치의 옷
  alternatives_korean:
  - 화합
  - 한마음
  - 조화
  lexicon: ὁμόνοια
  rationale: 원문은 ‘입다’ 동사와 결합해 공동체적 일치를 옷처럼 두르라는 비유이므로, ‘일치의 옷’으로 이미지 구조를 보존했습니다.
- source_word: ἔργοις δικαιούμενοι καὶ μὴ λόγοις
  english_pob_choice: being justified by works and not by words
  chosen_korean: 말이 아니라 행위로 의롭다 하심을 받읍시다
  alternatives_korean:
  - 행위로 의롭다 하심을 받되 말로는 아닙니다
  - 행위로 인정받고 말로는 아닙니다
  lexicon: δικαιόω
  rationale: 공동체 권면 맥락에서 선언형보다 권면형이 자연스러워, ‘의롭다 하심을 받다’로 수동 의미를 살리되 합쇼체 권면으로 옮겼습니다.
theological_decisions:
- issue: ἐγκρατευόμενοι와 ψιθυρισμός/καταλαλιά의 윤리적 뉘앙스
  chosen_reading: ‘절제함’과 ‘속삭임과 중상’으로 옮겨 공동체 분열을 낳는 은밀한 말과 절제 없는 태도를 함께 드러냈습니다.
  alternative_readings:
  - 자제함
  - 험담과 비방
  - 뒷말
  rationale: 원문은 단순한 개인 덕목이 아니라 공동체를 해치는 언어 윤리를 겨냥하므로, 은밀한 ‘속삭임’과 공개적 ‘중상’을 함께 유지했습니다.
  doctrine_reference: 공동체 윤리와 혀의 죄에 대한 신약의 일반적 권면(약 3장, 엡 4:29)
