revisions:
- from: 그러므로 하나님의 은혜를 받은 이들에게 우리가 매여 가며, 겸손한 마음과 절제함으로 일치의 옷을 입고, 모든 속삭임과 중상에서 멀리 우리 자신을 지키며, 말이 아니라 행위로 의롭다 하심을 받읍시다.[a][b]
  to: 그러므로 하나님에게서 은혜를 받은 이들에게 굳게 붙읍시다. 겸손한 마음을 품고 절제하며, 온갖 수군거림과 비방에서 우리 자신을 멀리하고, 말이 아니라 행위로 의롭다 하심을 받읍시다.
  rationale: ‘굳게 붙읍시다’로 κολληθῶμεν의 결속을 자연스러운 합쇼체 권면으로 옮겼습니다. ‘화합을 입다’로 ὁμόνοια와 ἐνδυσώμεθα의 비유를 보존하고, 분사들의 윤리적 병렬은 한국어의 연결 표현으로 유지했습니다. 원문에 없는 각주 내용이 제공되지 않았으므로 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:46Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 권면 구조와 핵심 어휘는 대체로 반영되었으나, ‘κολληθῶμεν’을 ‘매여 가며’로 옮긴 것은 자연스럽지 않고 ‘서로 붙다/굳게 붙들다’라는 능동적 권면의 뜻을 충분히 드러내지 못합니다. 또한 원문의 분사 연쇄는 겸손, 절제, 악한 말에서의 거리 두기, 행위에 의한 의롭다 하심을 하나의 권면으로 연결합니다.
  naturalness: ‘하나님의 은혜를 받은 이들에게 우리가 매여 가며’는 현대 표준어에서 어색하며, 주어와 연결 어미의 배열도 매끄럽지 않습니다. ‘모든 속삭임’은 직역으로는 가능하지만 이 문맥의 공동체적 은밀한 험담을 ‘온갖 수군거림’으로 하는 편이 자연스럽습니다.
  terminology: ὁμόνοια는 ‘일치’보다 공동체적 ‘화합’이 자연스럽고, ‘화합을 입다’는 원문의 의복 비유도 유지합니다. δικαιούμενοι는 신학 체계에 종속시키지 않고 원문의 수동 표현에 맞추어 ‘의롭다 하심을 받다’로 유지할 수 있습니다.
