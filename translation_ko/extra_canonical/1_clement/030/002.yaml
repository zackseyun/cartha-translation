id: 1CLEM.30.2
reference: 1 Clement 30:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Funk 1901 (normalized OCR)
  text: θεὸς γάρ, φησίν, ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_clement/030/002.yaml
  text: For it says[a], "God opposes the proud, but gives grace to the humble."
  footnotes:
  - marker: a
    text: Or 'For God, he says, opposes the proud, but gives grace to the humble.'.
    reason: previous_rendering
translation:
  language: ko
  text: “For it says[a], ‘하나님은 교만한 사람들을 대적하시지만, 겸손한 사람들에게는 은혜를 주십니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φησίν
  english_pob_choice: it says
  chosen_korean: “For it says”를 따라 “말합니다”가 아니라 인용 도입형 “말합니다” 대신 전체를 직접 인용으로 처리했습니다.
  alternatives_korean:
  - “말합니다”
  - “그분이 말씀하십니다”
  lexicon: φημί
  rationale: 그리스어 φησίν은 여기서 화자를 가리키는 인칭 동사라기보다 성경 인용을 여는 관용구로 기능하므로, 영어 POB의 수정처럼 인용문을 분명히 드러내는 방식이 가장 자연스럽습니다.
- source_word: ὑπερηφάνοις
  english_pob_choice: the proud
  chosen_korean: 교만한 사람들
  alternatives_korean:
  - 교만한 자들
  - 오만한 사람들
  lexicon: ὑπερήφανος
  rationale: 형용사를 사람 집단으로 풀어 한국어에서 의미가 분명하도록 했고, 문맥상 단순 성질이 아니라 교만한 부류를 가리킵니다.
- source_word: δίδωσιν χάριν
  english_pob_choice: gives grace
  chosen_korean: 은혜를 주십니다
  alternatives_korean:
  - 은혜를 베푸십니다
  - 은총을 주십니다
  lexicon: χάρις
  rationale: χάριν은 여기서 은혜/호의의 표준 의미이며, POB의 ‘grace’를 따라 ‘은혜’를 유지했습니다.
theological_decisions:
- issue: 잠언 3:34 인용의 화자와 인용 방식
  chosen_reading: 본문 전체를 성경 인용으로 보고 직접 따옴표로 묶어, ‘하나님’이 인용문의 주어임을 분명히 했습니다.
  alternative_readings:
  - ‘그분이 말씀하시기를, 하나님은…’처럼 φησίν을 서술문으로 풀기
  - 따옴표 없이 서문만 유지하기
  rationale: applied_revisions의 판단처럼 φησίν은 여기서 비인칭 인용 도입으로 쓰여, 인용문을 명시하는 것이 원문의 기능과 수사 효과를 가장 잘 보존합니다.
  doctrine_reference: 성경 인용 표지의 담화 기능
