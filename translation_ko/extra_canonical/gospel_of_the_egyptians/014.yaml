    you have [cleansed me inside him]

    with your life,

    [in accord with your] indestructible [name].

    [Therefore], with him [is incense of life]

    that has mingled with baptismal [water] of [every] archon,

    [so that I might] live together with you in the [well-being of the holy ones],

    O eternal one [who exists],

    TRUTH TRULY.


    [The great Seth] wrote [this book], and deposited it on [a] high [mountain] where [the sun rises] not, nor [. . .], and [since the days of the] prophets [and . . . and the] apostles, [. . .] come forth [. . . and their] ear [has not heard] it.


    The great Seth wrote [this] [] [book] with letters [. . .]. He deposited [it . . .].'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/014.yaml
  text: 'This is the book that the great Seth wrote and deposited high in the mountains, where the sun has not risen, nor is that (even) possible. Since the days of the prophets, apostles, and preachers, its name has not arisen in their hearts in the least, nor is that (even) possible, and their ear has not heard it.


    The great Seth wrote this book with letters in 130 years. He deposited it on the mountain called Charaxio, with the intention that, at the end of the times and eras, in agreement with the desire of the self-generated God and the complete Fullness, and by the gift of the inscrutable, ungraspable, fatherly will, it might come to light and appear for this sacred, indestructible generation of the great Savior and for those who dwell with them in love, and the great, unseen, eternal Spirit and his only-begotten Son, and eternal light, [] also its great, indestructible companion, and indestructible Sophia, and Barbelon, and the complete Fullness, in eternity. Amen.


    Also restore the omitted witness markers in their respective locations: “the mystery] of [mysteries]. [7] They [appeared . . . who oversees . . .] and the aeons, TRUTH TRULY [8] [. . .], and TRUTH TRULY, [eternal] aeons”; “[. . .] AIA[. . .]THAŌTHŌSTH[. . .], [9]”; and “[. . .] TRUTH, [16]”.'
translation:
  language: ko
  text: '이것은 위대한 셋이 기록하여 산속 높은 곳에 맡겨 둔 책입니다. 그곳에는 해가 떠오른 적이 없으며, 그렇게 되는 것조차 가능하지 않습니다. 예언자들과 사도들과 전도자들의 시대 이래로, 이 책의 이름은 그들의 마음에 조금도 떠오른 적이 없으며, 그렇게 되는 것조차 가능하지 않습니다. 그들의 귀도 이 책에 관해 들은 적이 없습니다.


    위대한 셋은 130년에 걸쳐 이 책을 글자로 기록했습니다.[a] 그는 이 책을 카락시오라 불리는 산에 맡겨 두었습니다. 이는 시대들과 세월들의 끝에, 스스로 생겨난 하느님과 온전한 충만함의 뜻에 따라, 헤아릴 수도 붙잡을 수도 없는 아버지의 뜻이 베푸는 선물로 말미암아, 이 책이 빛 가운데 드러나 위대한 구원자의 이 거룩하고 멸하지 않는 세대와 사랑 안에서 그들과 함께 사는 이들에게 나타나게 하려는 것이었습니다. 또한 위대하고 보이지 않으며 영원한 영과 그의 외아들과 영원한 빛과, [] 그 빛의 위대하고 멸하지 않는 짝과, 멸하지 않는 소피아와 바르벨론과, 온전한 충만함을 위하여 영원토록 나타나게 하려는 것이었습니다. 아멘.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘130년에 걸쳐’에 해당하는 증거문은 문자 그대로는 ‘130년 안에 글자들로’라는 다소 불분명한 표현입니다. 직접 콥트어 대조가 필요합니다.
    reason: 원문 검토가 아직 이루어지지 않은 상태에서 시간 표현과 ‘글자’의 관계가 불확실함을 알립니다.
lexical_decisions:
- source_word: Seth
  choice: 셋
  rationale: 성서 인명으로 널리 쓰이는 한국어 음역을 따랐습니다.
- source_word: self-generated God
  choice: 스스로 생겨난 하느님
  rationale: 후대 교리 용어로 동일시하지 않고, 문헌 특유의 자기 기원 개념을 평이하게 보존했습니다.
- source_word: Fullness
  choice: 충만함
  rationale: 플레로마 계열의 전문 개념을 음역하지 않고 의미가 드러나는 말로 옮기되, 고유한 우주론적 함의를 남겼습니다.
- source_word: Sophia
  choice: 소피아
  rationale: 일반 명사 ‘지혜’로 환원하면 문헌 속 위격적 이름이 흐려지므로 고유명사로 음역했습니다.
- source_word: Barbelon
  choice: 바르벨론
  rationale: 문헌의 고유한 신적 존재 이름이므로 음역했습니다.
- source_word: indestructible
  choice: 멸하지 않는
  rationale: ‘불멸’과 ‘파괴 불가능’ 사이의 범위를 지나치게 좁히지 않으면서 반복되는 원문의 수식 구조를 살렸습니다.
theological_decisions:
- issue: ‘그 빛의 위대하고 멸하지 않는 짝’의 지시 대상
  choice: 가장 가까운 선행사인 ‘영원한 빛’을 받는 표현으로 옮겼습니다.
  alternative: ‘영’ 또는 ‘외아들’의 짝으로 해석할 수 있습니다.
  rationale: 현존 문장의 통사 구조가 불안정하므로 본문에서 신학적으로 단정하지 않고, 가까운 선행사를 따른 잠정 번역을 채택했습니다.
- issue: 마지막 열거가 ‘나타남’의 수혜 대상인지 동반 주체인지
  choice: ‘…을 위하여 나타나다’라는 수혜 대상의 연속으로 옮겼습니다.
  alternative: 영, 외아들, 빛 이하를 나타나는 주체들의 목록으로 연결할 수 있습니다.
  rationale: 영어 증거문 자체가 문법적으로 모호하므로 매끄러운 교리 체계로 재구성하지 않고 어색함을 일부 보존했습니다.
- issue: ‘only-begotten Son’
  choice: 외아들
  alternative: 독생자
  rationale: 특정 정통 교리 문구를 자동으로 불러오는 번역을 피하면서도 ‘유일하게 난 아들’이라는 관계를 자연스러운 현대 한국어로 나타냈습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문헌의 장엄하고 비전적인 어조를 유지하되, 지나치게 난해한 한자어는 피했습니다. 대괄호와 빈 대괄호([])는 증거문의 본문 손상 또는 결락 표시로 그대로 보존했습니다. 이 초안은 제공된 공용 영어 증거문에 근거한 잠정 번역이며, 직접 콥트어 검토 뒤 교정이 필요합니다.
