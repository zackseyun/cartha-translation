translation:
  language: ko
  text: '세 능력이 그에게서 나왔습니다. 곧 아버지와 어머니와 아들입니다. 이들은 파괴될 수 없는 아버지에게서 나온 살아 있는 침묵에서 나왔습니다. 이들은 알려지지 않은 아버지의 침묵[에서] 나왔고, [그]곳에서 도메돈 독소메돈, 곧 [영겁들의] 영겁과 [그들] 각각의 능력의 [빛]이 [나]왔습니다. 이렇게 아들은 [네 번째로 나]왔고, 어머니는 [다섯 번째로, 아버지는] 여섯 번째로 나왔습니다.


    그는 [아무도 알아보지 못했으며], 아직 선포되지도 않았습니다. [그는 모든] 능력과 영광과 [파괴될 수 없는 존재들] 가운데서 어떤 표지로도 나타낼 수 없는 분입니다.


    그곳에서 세 능력, 곧 세 팔중체[a]가 [나]왔습니다. [아버지는] 침묵 가운데서 섭리와 함께 자신의 품으로부터 [이들을 낳으십니다.] 곧 아버지와 어머니와 아들입니다.


    삼중 남성 아이[b]가 나오게 된 까닭인 <첫째> 팔중체는 다음과 같습니다.


    생각,

    로고스[c],

    파괴될 수 없음,

    영원한 [생명],

    의지,

    정신,

    예지,

    남성과 여성을 함께 지닌 아버지.


    둘째 팔중체-능력은 다음과 같습니다.


    어머니,

    처녀 바르벨론,

    에피티티오크[… ]아이,

    하늘을 감독하는 메메네아이멘,

    카르브[…],

    해석을 넘어서는 능력,

    말로 표현할 수 없는 어머니.


    [그녀는] 스스로 [생겨난 … 존재입니다]. 그녀는 나왔습니다. [그녀는] 고요한 [침묵의] 아버지와 뜻을 같이했습니다.


    셋째 팔중체-[능력은 다음과 같습니다.]


    [고요한 침묵의] 아들,

    고요한 침묵의 면류관,

    [아버지]의 영광,

    그리고 […] [어머니]의 덕[d].


    [그는] 자신의 품으로부터 큰 빛의 일곱 능력, 곧 일곱 음성을 낳으십니다. 그 음성들이 완성되면 말이 됩니다.


    이들이 바로 세 [능력], 곧 아버지께서 자신의 섭리를 [통하여] 품으로부터 [낳으신] 세 팔중체입니다. 아버지께서는 그곳에서 이들을 낳으셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘팔중체’는 그리스어계 전문어 ‘오그도아드’에 해당하며, 여덟 요소로 이루어진 한 무리 또는 충만한 집합을 가리킵니다.
    reason: 낯선 고대 우주론 용어의 기본 의미를 설명하기 위해서입니다.
  - marker: b
    text: ‘삼중 남성 아이’는 원문 증언의 난해한 표현을 가깝게 옮긴 것입니다. 세 겹으로 남성인 존재인지, 세 남성적 측면을 지닌 아이인지 분명하지 않습니다.
    reason: 원문의 진정한 문법적·개념적 모호성을 보존하기 위해서입니다.
  - marker: c
    text: ‘로고스’는 말, 이성, 말씀 등의 뜻을 지닐 수 있습니다.
    reason: 하나의 신학적 의미로 성급히 한정하지 않기 위해서입니다.
  - marker: d
    text: 여기서 ‘덕’은 도덕적 덕목뿐 아니라 능력이나 탁월성을 뜻할 수도 있습니다.
    reason: 영어 증언의 virtue가 지닌 의미 범위를 알리기 위해서입니다.
lexical_decisions:
- source_word: Silence
  choice: 침묵
  rationale: 본문에서 의인화·실체화된 명칭으로 기능하므로 일관되게 ‘침묵’으로 옮기고, 수식어가 붙을 때도 그 긴장을 유지했습니다.
- source_word: Ogdoad
  choice: 팔중체
  rationale: 여덟 요소로 이루어진 신적 집합이라는 전문적 의미를 드러내면서도 한국어 독자가 구조를 알아볼 수 있게 했습니다.
- source_word: Logos
  choice: 로고스
  rationale: ‘말씀’, ‘이성’, ‘말’ 가운데 하나로 의미를 좁히지 않고 원문의 철학적·신학적 다의성을 보존했습니다.
- source_word: Providence
  choice: 섭리
  rationale: 인격적이거나 실체화된 존재일 가능성을 열어 두기 위해 전통적이고 폭넓은 대응어를 사용했습니다.
- source_word: aeon
  choice: 영겁
  rationale: 이 문맥에서는 시간적 영원성과 초월적 실재의 의미가 겹칠 수 있으므로 단순히 ‘시대’로 제한하지 않았습니다.
- source_word: virtue
  choice: 덕
  rationale: 도덕적 덕목과 능력·탁월성의 가능성이 함께 남도록 직역에 가까운 표현을 택했습니다.
theological_decisions:
- issue: Father, Mother, Son의 관계
  choice: ‘아버지와 어머니와 아들’을 병렬적으로 번역
  alternative: 기독교 삼위일체 용어로 해설하거나 정규화
  rationale: 본문 고유의 삼중 구조를 후대의 교리 체계에 맞추어 해소하지 않았습니다.
- issue: androgynous Father
  choice: ‘남성과 여성을 함께 지닌 아버지’
  alternative: ‘양성적 아버지’ 또는 ‘남녀추니 아버지’
  rationale: 현대 독자가 뜻을 이해할 수 있으면서도 신적 존재의 성별 긴장을 삭제하지 않는 서술형 표현을 택했습니다.
- issue: proceeded / produced
  choice: 문맥에 따라 ‘나오다’와 ‘낳다’를 구분
  alternative: 모두 ‘발출하다’ 또는 모두 ‘나오다’
  rationale: 존재의 출현과 아버지의 산출 행위를 구별하되, 특정 교파의 전문적 발출론 용어는 피했습니다.
- issue: their completion is speech
  choice: ‘그 음성들이 완성되면 말이 됩니다’
  alternative: ‘그것들의 완성은 말씀이다’
  rationale: speech와 앞선 Logos를 같은 신학적 개념으로 단정하지 않고 문장의 과정적 의미를 자연스럽게 살렸습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 공손한 합쇼체를 사용했습니다. 목록은 명사형으로 유지했고, 신적 명칭은 문맥상 고유 호칭처럼 처리했습니다. 대괄호와 말줄임표는 훼손되거나 편집자가 복원한 본문의 상태를 드러내도록 보존했습니다. 다만 이 초안은 제공된 공개 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 대조가 필요합니다.
