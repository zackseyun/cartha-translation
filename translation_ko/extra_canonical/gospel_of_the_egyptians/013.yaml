translation:
  language: ko
  text: 'IĒ IEUS ĒŌ OU ĒŌ ŌUA,


    알레토스, 알레토스,


    오 예세우스 마자레우스 예세데케우스여,


    오 살아 있는 물이여,


    오 아이의 아이여,


    오 영광스러운 이름이여,


    알레토스, 알레토스,


    영원한 존재여,


    I I I I


    ĒĒĒĒ


    EEEE


    OOOO


    UUUU


    ŌŌŌŌ


    AAAA{A},


    알레테스, 알레토스,


    ĒI AAAA ŌŌŌŌ,


    오 아이온들을 바라보는 존재여,


    알레테스, 알레토스,


    AEE


    ĒĒĒ


    I I I I


    UUUUUU


    ŌŌŌŌŌŌŌŌ,


    영원토록 영원한 이여,


    알레테스, 알레토스,


    마음 안에 계시는 IĒA AIŌ여,


    UAEI EISAEI EIOEI EIOSEI!


    당신의 이 위대한 이름이 제 안에 거합니다.


    오 스스로 생겨난 완전한 이여,


    제 밖에 계시지 않는 당신을


    제가 바라봅니다.


    오, 아무에게도 보이지 않는 이여,


    누가 다른 언어로 당신을 파악할 수 있겠습니까?


    〔본문 결락〕[a] 제가 당신을 알았으므로,


    이제 저는 변하지 않는 이와 하나가 되었습니다.[b]


    저는 빛의 갑옷으로 무장했습니다.


    저는 빛이 되었습니다.


    이는 은혜의 뛰어난 아름다움을 위하여


    어머니께서 그곳에 계셨기 때문입니다.


    그러므로 저는 접혀 있던 두 손을 펼쳤습니다.


    저는 제 품 안에서,


    빛의 풍요가 이루는 원 안에서 형상을 얻었습니다.


    그 품은 빛에서 태어난 많은 이들의 형상을 낳으며,


    그곳에는 어떠한 고발도 미치지 못합니다.


    알레토스,


    제가 당신의 영광을 선포하겠습니다.


    제가 당신을 파악했기 때문입니다.


    SOU IĒS IDE AEIŌ AEIE OIS,


    오 아이온이여, 아이온이여, 오 침묵의 하나님이여!


    제가 당신을 온전히 높입니다.


    오 아들이여, 당신은 제가 안식할 곳입니다.


    ĒS ĒS O E,


    형상 없는 이들 가운데 형상 없는 이여,


    당신은 그 사람을 일으키십니다.


    그 사람 안에서 당신은 저를 깨끗하게 하시어,


    당신의 썩지 않는 이름을 따라


    당신의 생명으로 들어가게 하실 것입니다.[c]


    그러므로 생명의 향이 제 안에 거합니다.


    저는 모든 아르콘의 틀을 따라 그것을 물과 섞었습니다.


    이는 제가 거룩한 이들의 복됨 가운데서


    당신과 함께 살기 위함입니다.


    영원히 존재하시는 이여, 〔본문 결락〕[a]


    알레토스, 알레토스.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승 본문에 결락 또는 판독 불능을 나타내는 빈 대괄호가 있습니다. 빠진 말은 보충하지 않았습니다.
    reason: 두 곳의 원문 공백 신호를 독자에게 명시하고 추정 복원을 피하기 위함입니다.
  - marker: b
    text: ‘하나가 되었습니다’로 옮긴 말은 ‘합쳐졌습니다’ 또는 ‘결합되었습니다’로도 이해할 수 있습니다.
    reason: 신비적 연합의 성격에 관한 원문의 신학적 긴장을 보존하기 위함입니다.
  - marker: c
    text: ‘그 사람을 일으키십니다’부터 이어지는 문장의 수식 관계는 불분명합니다. ‘그 사람 안에서’가 앞말 또는 뒤의 정결 행위에 연결될 수 있습니다.
    reason: 영어 증언 자체의 통사적 모호성을 한국어에서 임의로 해소하지 않았음을 알리기 위함입니다.
lexical_decisions:
- source_word: ALĒTHŌS / ALĒTHES
  choice: 알레토스 / 알레테스
  rationale: 각각 그리스어 부사형과 형용사형으로 보이나, 찬송의 신비적·음성적 기능과 서로 다른 철자를 보존하기 위해 의미 번역인 ‘참으로’로 통일하지 않고 음역했습니다.
- source_word: aeon(s)
  choice: 아이온(들)
  rationale: 문맥에 따라 영원한 시대 또는 초월적 존재를 가리킬 수 있는 전문어이므로 ‘영겁’이나 ‘영적 존재’로 단정하지 않고 음역했습니다.
- source_word: archons
  choice: 아르콘들
  rationale: ‘통치자들’이라는 일반 의미와 특정 우주론적 존재라는 의미가 겹치므로 전문어를 음역해 긴장을 보존했습니다.
- source_word: the Place
  choice: 그곳
  rationale: 영어 증언의 대문자 표기는 특수한 우주론적 장소를 시사하지만 콥트어 대조가 아직 이루어지지 않았으므로, 본문에서는 자연스러운 지시어로 옮기되 특정 교리적 체계를 덧붙이지 않았습니다.
- source_word: living water
  choice: 살아 있는 물
  rationale: 세례 찬송의 물 이미지와 ‘생명을 주는 물’이라는 가능성을 함께 열어 두기 위해 직역에 가까운 표현을 택했습니다.
- source_word: self-generated Perfect One
  choice: 스스로 생겨난 완전한 이
  rationale: 자생·자기발생을 뜻하는 표현을 창조 신학의 특정 용어로 치환하지 않고 형태적으로 충실하게 옮겼습니다.
- source_word: Man
  choice: 그 사람
  rationale: 대문자 표기는 원형적·천상적 인간을 암시할 수 있으나 직접 원문 검토 전에는 고유 칭호로 확정하기 어려워 중립적으로 옮겼습니다.
theological_decisions:
- issue: ‘merged with the unchangeable one’의 연합 정도
  choice: 변하지 않는 이와 하나가 되었습니다
  alternative: 변하지 않는 이와 합쳐졌습니다
  rationale: 신비적 연합을 나타내되 존재론적 융합을 과도하게 확정하지 않는 한국어 표현을 선택했습니다.
- issue: ‘God of Silence’의 신명 표현
  choice: 침묵의 하나님
  alternative: 침묵의 신
  rationale: 호격의 장엄한 문체를 살리면서도 해당 존재를 하위 신격이나 특정 체계의 존재로 미리 규정하지 않았습니다.
- issue: ‘Mother’와 ‘Son’의 호칭
  choice: 어머니 / 아들
  alternative: 모체 / 아드님
  rationale: 원문의 가족적·신적 호칭을 그대로 유지하고, 정통 삼위일체론이나 특정 영지주의 계보 중 어느 하나로 해설하지 않았습니다.
- issue: ‘incense of life’의 상징
  choice: 생명의 향
  alternative: 생명의 향료
  rationale: 제의적 향과 향기라는 양쪽 가능성을 열어 두고 자연스러운 시어를 사용했습니다.
- issue: ‘according to the mold of all the archons’의 관계
  choice: 모든 아르콘의 틀을 따라
  alternative: 모든 아르콘의 형상에 따라
  rationale: 세례·형성·우주론적 모형 중 어느 의미인지 확정하지 않고 ‘틀’로 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 세례 찬송의 반복과 호격을 살려 장중한 운율을 유지했습니다. 모음 연쇄와 신비명은 번역하지 않고 로마자로 보존했으며, ALĒTHES와 ALĒTHŌS의 차이는 한글 음역에서도 유지했습니다. 제공 자료가 공공 영역 영어 증언에 기초하고 콥트어 직접 검토가 보류된 상태이므로 이 번역은 잠정 출판 초안입니다. 영어 증언 중간의 필사본 쪽수 [15]는 본문 내용이 아니므로 제외했습니다.
