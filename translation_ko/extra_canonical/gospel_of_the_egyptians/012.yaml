  revised_text: '그때 큰 아이온들로부터 사백 명의 영적인 천사들이 나왔습니다. 그들 가운데에는 위대한 아에로시엘과 위대한 셀메켈이 있었습니다. 그들은 진리와 정의의 때와 순간부터 그 아이온과 그 아르콘들의 완성에 이르기까지, 위대하고 파괴될 수 없는 종족과 그 열매와 위대한 셋의 위대한 사람들을 지키도록 나왔습니다. 그 아르콘들에게는 위대한 재판관들이 사형을 선고하였습니다.


    그때 위대한 셋은 네 빛들에 의해 파견되었습니다. 이는 스스로 생겨난 이와 [a] 온 충만의 뜻에 따라, 위대하고 보이지 않는 영의 <선물>[b]과 기쁨, 다섯 인장, 그리고 온 충만을 통하여 이루어졌습니다.


    그는 내가 앞서 말한 세 차례의 현현[c], 곧 홍수와 불의 재앙과 아르콘들 및 세력들과 권세들에 대한 판결을 거쳐 갔습니다. 이는 길을 잃은 여자가 세상을 화해시키는 일과 로고스에게서 태어난 몸을 통한 세례로 구원받게 하려는 것이었습니다. 위대한 셋은 그 몸을 처녀를 통하여 자신을 위해 은밀히 마련하였습니다. 이는 거룩한 이들이 보이지 않는 비밀의 표징들을 통하여 거룩한 영에게서 태어나게 하려는 것이며, 세상과 세상의 화해를 통하여, 세상과 열세 아이온의 신을 버림을 통하여, 또 아버지의 품과 큰 빛 안에 있는 거룩하고 말로 표현할 수 없으며 파괴될 수 없는 이들의 좌정[d]을 통하여 그렇게 되게 하려는 것이었습니다. 그 큰 빛은 아버지의 섭리와 함께 미리 존재하였고, 그 섭리를 통하여 하늘보다 뛰어난 거룩한 세례를 세웠습니다. 이 일은 파괴될 수 없는 이, [e] 곧 로고스에게서 태어난 살아 있는 이 예수를 통하여 이루어졌습니다. 그는 바로 위대한 셋이 입은 이입니다. 셋은 그를 통하여 열세 아이온의 세력들을 못 박았고, 생겨났다가 옮겨지는 이들을 굳게 세웠습니다.


    그는 파괴될 수 없음의 꺾을 수 없는 능력 안에서 그들에게 이 진리에 대한 지식의 갑옷을 갖추어 주었습니다. 그들에게 다음 이들이 나타났습니다.


    위대한 시종이며 살아 있는 물인 예세우스 마자레우스 예세데케우스,


