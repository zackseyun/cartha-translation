translation:
  language: ko
  text: '그때 큰 아이온들로부터 사백 명의 영적인 천사들이 나왔습니다. 그들 가운데에는 위대한 아에로시엘과 위대한 셀메켈이 있었습니다. 그들은 진리와 정의의 때와 순간부터 그 아이온과 그 아르콘들이 종말을 맞을 때까지, 위대하고 파괴될 수 없는 종족과 그 열매와 위대한 셋의 위대한 사람들을 지키도록 나왔습니다. 그 아르콘들에게는 위대한 재판관들이 사형을 선고하였습니다.


    그때 위대한 셋은 네 빛들에 의해 파견되었습니다. 이는 스스로 생겨난 이의 뜻과 [a] 온 충만, 위대하고 보이지 않는 영의 <선물>[b]과 기쁨, 다섯 인장, 그리고 온 충만을 통하여 이루어졌습니다.


    그는 내가 앞서 말한 세 차례의 현현[c], 곧 홍수와 불의 재앙과 아르콘들 및 세력들과 권세들에 대한 판결을 거쳐 갔습니다. 이는 길을 잃은 여자가 세상의 화해와 로고스에게서 태어난 몸을 통한 세례로 구원받게 하려는 것이었습니다. 위대한 셋은 그 몸을 처녀를 통하여 자신을 위해 은밀히 마련하였습니다. 이는 거룩한 이들이 보이지 않는 비밀의 표징들을 통하여 거룩한 영에게서 태어나게 하려는 것이며, 세상과 세상의 화해를 통하여, 세상과 열세 아이온의 신을 버림을 통하여, 또 아버지의 품과 큰 빛 안에 있는 거룩하고 말로 표현할 수 없으며 파괴될 수 없는 이들의 좌정[d]을 통하여 그렇게 되게 하려는 것이었습니다. 그 큰 빛은 아버지의 섭리와 함께 미리 존재하였고, 그 섭리를 통하여 하늘보다 뛰어난 거룩한 세례를 세웠습니다. 이 일은 파괴될 수 없는 이, [e] 곧 로고스에게서 태어난 살아 있는 이 예수를 통하여 이루어졌습니다. 그는 바로 위대한 셋이 입은 이입니다. 셋은 그를 통하여 열세 아이온의 세력들을 못 박았고, 생겨났다가 옮겨지는 이들을 굳게 세웠습니다.


    그는 파괴될 수 없음의 꺾을 수 없는 능력 안에서 그들에게 이 진리를 아는 지식의 갑옷을 입혀 주었습니다. 그들에게 다음 이들이 나타났습니다.


    위대한 시종이며 살아 있는 물인 예세우스 마자레우스 예세데케우스,


    위대한 우두머리들, 곧 대 야곱과


    테오펨프토스와 이사벨,


    진리의 샘을 감독하는 미케우스와 미카르와 므네시누스,


    산 이들을 위한 세례를 감독하는 이,


    깨끗하게 하는 이들,


    세센겐파란게스,


    물로 들어가는 문들을 감독하는 미케우스와 미카르,


    높은 산을 감독하는 셀다오와 엘라이노스,


    큰 종족을 맞아들이는 이들,


    위대한 셋의 파괴될 수 없는 용사들,[f]


    네 빛들을 섬기는 이들, 곧 위대한 가말리엘과 위대한 가브리엘과 위대한 삼블로와 위대한 [g] 아브라삭스,


    해돋이를 감독하는 올세스와 휘프네우스와 헤우루마이오스,


    영원한 생명의 안식으로 들어가는 입구를 맡은 통치자 믹산테르와 미카노르,


    선택받은 영혼들을 지키는 아크라마스와 스트렘푸코스,


    위대한 능력인 헬리 헬리 마카르 마카르 셋,


    위대하고 보이지 않으며 이름 붙일 수도 말로 나타낼 수도 없는 처녀 영과 침묵,


    그리고 위대한 빛 하르모젤입니다.


    첫째는 살아 있으며 스스로 생겨난 이, 곧 진리의 하나님의 처소이고, 그와 함께하는 이[h]는 파괴될 수 없는 사람 아다마스입니다.


    둘째는 오로이아엘이며, 위대한 셋의 처소입니다. 또 생명을 지닌 예수가 있으니, 그는 와서 율법 안에 있는 것을 십자가에 못 박았습니다.


    셋째는 다위테이며, 위대한 셋의 아들들의 처소입니다.


    넷째는 엘렐레트이며, 안식하는 아들들의 영혼들이 있는 처소입니다.


    다섯째는 요엘이며, 그는 파괴될 수 없는 하늘보다 뛰어난 거룩한 세례를 베풀도록 임명될 이의 이름을 맡고 있습니다.


    그러나 이제부터는 [i] 파괴될 수 없는 사람 포이마엘을 통하여, 또 간구를 받기에 합당한 이들과 세례의 샘에서 행하는 다섯 인장의 포기 선언들을 통하여, 그들은 가르침을 받아 자신들을 맞아들일 이들을 알게 되고, 그들에게도 알려질 것입니다. 그들은 결코 죽음을 맛보지 않을 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이곳의 대괄호는 사본의 결락 또는 판독 불능 부분을 나타냅니다.
    reason: 제공된 증언의 빈 대괄호를 보존하고 의미를 추측하지 않기 위해서입니다.
  - marker: b
    text: ‘선물’은 번역자가 문맥에 따라 보충한 말입니다.
    reason: 원 증언의 꺾쇠괄호 복원 표시를 한국어 본문과 주석에 반영하기 위해서입니다.
  - marker: c
    text: ‘현현’에 해당하는 말은 ‘도래’ 또는 ‘나타남’으로도 옮길 수 있습니다.
    reason: parousia의 의미 범위를 단일한 종말론적 해석으로 제한하지 않기 위해서입니다.
  - marker: d
    text: ‘좌정’은 자리에 앉아 있음 또는 자리들을 뜻할 수 있으며, 이 문맥은 불확실합니다.
    reason: sessions의 의미와 통사 관계가 불명확함을 알리기 위해서입니다.
  - marker: e
    text: 이곳의 대괄호는 사본의 결락 또는 판독 불능 부분을 나타냅니다.
    reason: 제공된 증언의 결락을 임의로 복원하지 않기 위해서입니다.
  - marker: f
    text: ‘위대한 셋의’에서 ‘의’에 해당하는 말은 번역자가 보충한 것입니다.
    reason: 원 증언의 꺾쇠괄호 복원을 표시하기 위해서입니다.
  - marker: g
    text: 이곳의 대괄호는 사본의 결락 또는 판독 불능 부분을 나타냅니다.
    reason: 이름 앞의 손상된 부분을 추정하지 않기 위해서입니다.
  - marker: h
    text: ‘그와 함께하는 이’의 ‘이’는 번역자가 문장을 성립시키려고 보충한 것입니다.
    reason: 원 증언의 꺾쇠괄호 보충을 투명하게 드러내기 위해서입니다.
  - marker: i
    text: 이곳의 대괄호는 사본의 결락 또는 판독 불능 부분을 나타냅니다. 마지막 문단의 문장 구조도 원 증언에서 매우 불확실합니다.
    reason: 결락과 난해한 구문으로 인해 번역이 잠정적임을 알리기 위해서입니다.
lexical_decisions:
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌의 특수한 우주론적 실재와 시대라는 의미가 겹칠 수 있어 일반어 ‘세대’나 ‘영겁’으로 단정하지 않고 음역했습니다.
- source_word: archons
  choice: 아르콘들
  rationale: 단순한 인간 통치자와 구별되는 문헌 고유의 우주적 권세를 보존하려고 음역했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 플레로마 계열의 기술적 개념을 드러내면서도 한국어로 이해 가능한 전통적 대응어를 사용했습니다.
- source_word: Logos
  choice: 로고스
  rationale: ‘말씀’으로 번역할 때 특정 정경적 용례와 성급히 동일시될 수 있으므로 기술어를 음역했습니다.
- source_word: parousias
  choice: 현현
  rationale: 세 사건을 가리키는 복수형으로, 단순한 이동보다 나타남·도래의 의미를 살리되 특정 종말론적 ‘재림’으로 한정하지 않았습니다.
- source_word: renunciation(s)
  choice: 버림 / 포기 선언들
  rationale: 세계와 신을 거부하는 행위에는 ‘버림’을, 세례 의례의 복수 공식에는 ‘포기 선언들’을 사용해 문맥 차이를 반영했습니다.
- source_word: receivers
  choice: 맞아들이는 이들
  rationale: 입문자나 영혼을 받아들이는 존재라는 기능을 살리면서 정체를 과도하게 규정하지 않았습니다.
- source_word: indestructible
  choice: 파괴될 수 없는
