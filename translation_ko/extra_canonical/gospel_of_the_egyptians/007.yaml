translation:
  language: ko
  text: '그들의 동반자들이 스스로 생겨난 하나님의 팔중체를 완성하려고 나아왔습니다.


    첫째 빛 하르모젤에게 속한 은혜,

    둘째 빛 오로이아엘에게 속한 지각,

    셋째 빛 다비테에게 속한 이해,

    넷째 빛 엘렐레트에게 속한 분별입니다.


    이것이 스스로 생겨난 하나님의 첫째 팔중체이며, 아버지께서 고개를 끄덕여 승인하셨습니다. 빛들의 충만 전체가 기뻐하였습니다.


    봉사자들이 나아왔습니다.


    첫째 큰 빛 하르모젤에게 속한 첫째, 위대한 가말리엘,

    둘째 큰 빛 오로이아엘에게 속한 위대한 가브리엘,

    큰 빛 다비테에게 속한 위대한 삼로[a],

    큰 빛 엘렐레트에게 속한 위대한 아브라삭스입니다.[b]


    그리고 동반자들이 아버지의 기뻐하시는 뜻을 따라 나아왔습니다.


    첫째 위대한 이 가말리엘에게 속한 기억,

    둘째 위대한 이 가브리엘에게 속한 사랑,

    셋째 위대한 삼블로에게 속한 평화,

    넷째 위대한 이 아브라삭스에게 속한 영원한 생명입니다.


    이와 같이 다섯 팔중체가 완성되어 모두 마흔이 되었으니, 말로 다 설명할 수 없는 능력입니다.


    그때 위대한 스스로 생겨난 로고스와 네 빛의 충만의 말씀이 다음 이들에게 찬양을 드렸습니다.


    위대하고 보이지 않으며 이름 붙일 수 없는 처녀 영,

    곧 남성 처녀,

    위대한 독소메돈 아이온,

    그들 안에 있는 보좌들,

    그들을 둘러싼 능력들,

    영광들과 권세들과 능력들,

    <그리고> 삼중 남성 아이,

    남성 처녀 유엘,

    광채를 지키는 에세페크, [아이의] 아이,[c]

    [그] 영광의 면류관,

    충만 전체,

    그곳에 거하는 모든 영광,

    무한한 충만들,

    이름 붙일 수 없는 아이온들입니다.


    이는 그들이 멸할 수 없는 종족과 함께 넷째이신 아버지의 이름을 부르고, 아버지의 씨를 위대한 셋의 씨라고 부르게 하려는 것이었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 뒤에서는 같은 이름이 ‘삼블로’로 나타납니다. 전승 과정의 철자 차이일 수 있습니다.
    reason: 증거문 내부의 Samlo/Samblo 차이를 독자에게 알리되 본문에서 임의로 통일하지 않기 위해서입니다.
  - marker: b
    text: 이 대목의 사본에는 결락이 있으며, ‘큰 빛’은 복원된 말입니다.
    reason: 영어 증거문에 표시된 손상 및 복원 신호를 출판용 각주로 보존했습니다.
  - marker: c
    text: 에세페크 뒤에는 사본의 결락이 있으며, ‘아이의’ 가운데 앞의 ‘아이’는 복원된 말입니다.
    reason: 해당 구절의 손상과 복원 상태를 투명하게 밝혔습니다.
lexical_decisions:
- source_word: Ogdoad
  choice: 팔중체
  rationale: 여덟 존재로 이루어진 집합이라는 전문적 의미를 보존하면서도 한국어 독자가 구조를 파악할 수 있게 했습니다.
- source_word: self-generated God / self-generated Logos
  choice: 스스로 생겨난 하나님 / 스스로 생겨난 로고스
  rationale: 발생 방식에 관한 원문의 표현을 특정 교리 용어로 치환하지 않고 직역에 가깝게 보존했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 영지주의 문헌의 전문적·우주론적 함의를 유지하며, 문맥에 따라 전체성을 나타내는 말로 자연스럽게 사용했습니다.
- source_word: Speech
  choice: 말씀
  rationale: Logos와 구별되는 별도 명칭이지만 의인화된 신적 발화라는 문맥을 살리기 위해 '말씀'으로 옮겼습니다.
- source_word: aeon
  choice: 아이온
  rationale: 시대, 영원, 초월적 존재 또는 영역이라는 중층적 의미를 하나로 단정하지 않도록 음역했습니다.
- source_word: virginal Spirit / male virgin
  choice: 처녀 영 / 남성 처녀
  rationale: 성별 언어의 의도적인 긴장과 역설을 완화하지 않고 그대로 보존했습니다.
- source_word: seed
  choice: 씨
  rationale: 혈통·후손·영적 종족이라는 여러 가능성을 열어 두기 위해 구체적 해석어인 '후손'보다 원문 은유에 가까운 말을 택했습니다.
theological_decisions:
- issue: 넷째 아버지와 멸할 수 없는 종족의 관계
  choice: “멸할 수 없는 종족과 함께 넷째이신 아버지의 이름을 부르고”
  alternative: “멸할 수 없는 종족과 함께 아버지를 넷째로 지명하고”
  rationale: 영어 증거문의 통사적 모호성을 완전히 해소하지 않으면서도 한국어 문장으로 성립하게 했습니다.
- issue: 로고스와 말씀의 관계
  choice: 두 주체처럼 병렬하여 번역
  alternative: ‘로고스, 곧 말씀’으로 동일시
  rationale: 원문 증거문이 접속사로 병렬하므로 둘을 동일 존재라고 단정하지 않았습니다.
- issue: Fullness의 존재론적 의미
  choice: 전문어 ‘충만’을 유지
  alternative: ‘완전한 세계’ 또는 ‘신적 총체’
  rationale: 특정 영지주의 체계로 의미를 과도하게 규정하지 않고 원문의 전문적 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 찬가·목록의 장엄한 리듬을 살렸습니다. 고유명사는 공급된 영어 증거문을 기준으로 음역했습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로 문법적 관계가 불확실한 곳에서는 과도한 해석을 피했고, 사본 쪽수 표지 [11], [12]는 문장을 방해하므로 본문에서 제외했습니다.
