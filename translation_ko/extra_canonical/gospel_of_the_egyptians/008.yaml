translation:
  language: ko
  text: '그때 모든 것이 흔들렸고, 파동이 멸할 수 없는 이들을 사로잡았습니다. 그때 세 남성 자녀가 위로부터 내려와, 태어나지 않은 이들과 스스로 생겨난 이들에게, 그리고 생겨난 것 안에서 태어난 이들에게 이르렀습니다. 위대함, 곧 위대한 그리스도의 온전한 위대함이 나아왔습니다.


    그분은 그들을 둘러싼 네 아이온[a] 안에 영광스러운 보좌를 수없이 많이 세우셨고, 능력들과 영광들과 [원문 훼손][b] 멸할 수 없음도 수없이 많이 세우셨습니다. 그들은 이와 같이 나아갔습니다. 그리고 멸할 수 없는 영적 교회가 위대하고 살아 계시며 스스로 생겨나신 분, 곧 진리의 하나님의 네 빛 안에서 자라났습니다. 그 교회는 하나로 뜻을 모아 한목소리로, 그치지 않는 입으로 찬양하고 노래하며 높였습니다.


    아버지와,


    어머니와,


    아들과,


    내가 앞서 말한 그들의 온전한 충만함을.


    수없이 많은 무리를 지닌 다섯 인장과,


    아이온들을 다스리는 통치자들과,


    지도자들의 영광을 짊어진 이들은


    합당한 이들에게 자신을 나타내라는 명령을 받았습니다.


    아멘.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이온’은 이 문헌에서 우주론적 시대, 영역 또는 영적 실재를 가리키는 전문 용어입니다.
    reason: 일반 독자에게 낯선 음역어의 의미 범위를 설명합니다.
  - marker: b
    text: 이 지점의 사본에는 훼손되었거나 빠진 부분이 있습니다.
    reason: 제공된 증언의 대괄호가 표시하는 본문 결락을 독자에게 알립니다.
lexical_decisions:
- source_word: aeons
  choice: 아이온
  rationale: 이 문헌의 특수한 우주론적 실재나 영역을 가리키므로 일반적인 ‘시대’로 환원하지 않고 음역했습니다.
- source_word: the indestructible ones / indestructibilities
  choice: 멸할 수 없는 이들 / 멸할 수 없음
  rationale: 인격적 복수와 추상 복수의 차이를 살리면서 공통 어근의 반복도 보존했습니다.
- source_word: self-begotten / self-generated one
  choice: 스스로 생겨난 이들 / 스스로 생겨나신 분
  rationale: 서로 유사하지만 문맥상 구별되는 표현을 일관된 말로 옮기고, 후자의 존칭적 지위를 한국어에서 드러냈습니다.
- source_word: Greatness
  choice: 위대함
  rationale: 인격화된 명칭일 가능성을 보존하기 위해 설명적인 신명으로 풀지 않고 추상 명칭을 그대로 살렸습니다.
- source_word: Fullness
  choice: 온전한 충만함
  rationale: 전체성이라는 의미와 이 문헌의 전문적·우주론적 함의를 함께 전달하되 특정 교파적 해석을 덧붙이지 않았습니다.
- source_word: church
  choice: 교회
  rationale: 영적 공동체를 가리키는 전통적이고 널리 이해되는 대응어를 사용했습니다.
- source_word: archons
  choice: 통치자들
  rationale: 전문 용어를 무조건 음역하지 않고 원뜻을 전달했으며, 이들의 성격에 관한 교리적 판단은 덧붙이지 않았습니다.
- source_word: myriads
  choice: 수없이 많은 무리 / 수없이 많이
  rationale: 엄밀한 수치보다 셀 수 없이 많음을 나타내는 문맥적 용법을 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘태어나지 않은 이들’, ‘스스로 생겨난 이들’, ‘태어난 이들’의 관계
  choice: 세 부류를 구별한 채 직역에 가깝게 보존했습니다.
  alternative: 이들을 천상 존재나 신적 발출물로 해설하여 번역할 수 있습니다.
  rationale: 본문 자체의 우주론적 긴장과 모호성을 특정 신학 체계로 해소하지 않기 위해서입니다.
- issue: 찬양의 주체와 목적어
  choice: ‘영적 교회’를 찬양의 주체로 보고, 아버지·어머니·아들·충만함을 뒤따르는 목적어로 제시했습니다.
  alternative: 관계절을 ‘진리의 하나님’ 또는 ‘스스로 생겨나신 분’에 연결할 수도 있습니다.
  rationale: 영어 증언의 문법이 다소 불안정하지만, 문맥상 교회가 한목소리로 찬양한다는 독해가 가장 자연스럽습니다. 다만 문단과 행갈이로 원문의 장엄하고 열거적인 구조를 보존했습니다.
- issue: 아버지·어머니·아들의 삼중 호칭
  choice: 성별 호칭을 그대로 보존했습니다.
  alternative: 상징적 칭호로 의역하거나 전통적 삼위일체 용어로 재구성할 수 있습니다.
  rationale: 본문의 고유한 신학적 배열을 다른 교리 체계에 맞추지 않기 위해서입니다.
- issue: Greatness의 인격성
  choice: ‘위대함’이라는 명칭을 유지하고 뒤에서는 ‘그분’으로 받았습니다.
  alternative: ‘위대한 존재’ 또는 ‘위엄하신 분’으로 명시할 수 있습니다.
  rationale: 원문의 추상 명사와 인격적 행위 사이의 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 찬가와 목록은 행갈이를 살려 장엄함과 병렬 구조를 보존했습니다. 현 단계 원고는 제공된 공개 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 대조가 완료되면 어휘·통사 결정을 재검토해야 합니다.
