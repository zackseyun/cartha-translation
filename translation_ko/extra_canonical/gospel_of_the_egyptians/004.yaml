translation:
  language: ko
  text: '그들은 [한] 능력을 청했습니다. 살아 있는 침묵의 한 침묵이 나아왔습니다. 곧 영겁들 안에 있는 [영광들]과 불멸성들, [… 영겁들], […에] 더해진 무수한 것들, 세 남성, [세] 남성 후손이었습니다. [남성] 종족들은 [온 충만]의 말이 지닌 능력으로 위대한 독소메돈 [영겁을] 가득 채웠습니다.


    그때 [위대한] 그리스도의 삼중 남성 [아이], 곧 [위대한] 보이지 않는 영께서 기름 부으신 이이며 그 능력이 [아이논이라 불린] 이가, 위대한 보이지 않는 영과 [그의] 남성 처녀 요엘과 침묵하는 침묵의 침묵과 위대함 […]에 [찬양을] 드렸습니다.


    [코덱스 III의 45–48쪽은 소실되었으며, 이 부분은 코덱스 IV의 55–60쪽에 해당합니다.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 코덱스 III의 45–48쪽은 소실되었습니다. 이 대목은 코덱스 IV의 55–60쪽과 대응합니다.
    reason: 사본의 결락과 대응 증언을 독자에게 알리기 위한 본문비평적 주석입니다.
lexical_decisions:
- source_word: power
  choice: 능력
  rationale: 본문의 우주론적 실재 또는 역량을 가리킬 수 있는 일반성을 유지했습니다.
- source_word: Silence / silence
  choice: 침묵 / 한 침묵
  rationale: 고유한 위격처럼 쓰인 대문자 표현과 그로부터 나온 개별 실재 사이의 긴장을 문맥과 어순으로 드러냈습니다.
- source_word: aeons
  choice: 영겁들
  rationale: 그노시스 문헌의 우주론적 존재·영역이라는 전문적 함의를 보존하면서 복수형도 유지했습니다.
- source_word: indestructibilities
  choice: 불멸성들
  rationale: 추상명사의 이례적인 복수형을 평탄화하지 않고 복수 실재로 보존했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 플레로마의 전문적·우주론적 의미를 담되 음역보다 한국어 독자의 접근성을 우선했습니다.
- source_word: triple-male
  choice: 삼중 남성
  rationale: 낯선 복합 표현을 해석적으로 풀지 않고 형식과 모호성을 유지했습니다.
- source_word: male virgin
  choice: 남성 처녀
  rationale: 원문의 역설적 성별 표현을 완화하거나 교리적으로 설명하지 않고 그대로 보존했습니다.
- source_word: Doxomedon / Ainon / Yoel
  choice: 독소메돈 / 아이논 / 요엘
  rationale: 고유명사는 음역했으며, 확정적인 의미 번역을 피했습니다.
theological_decisions:
- issue: ‘living Silence’와 ‘silence’의 관계
  choice: ‘살아 있는 침묵의 한 침묵’으로 옮김
  alternative: ‘살아 있는 침묵에게서 침묵이’
  rationale: 속격이 기원·소유·성격 중 무엇인지 확정하지 않고 원문의 압축된 관계를 유지했습니다.
- issue: ‘speech of the entire Fullness’의 범위
  choice: ‘[온 충만]의 말이 지닌 능력’
  alternative: ‘[온 충만]이 말하는 능력’
  rationale: ‘말’과 ‘충만’의 속격 관계를 보존하고, 충만 자체가 발화 주체라고 단정하지 않았습니다.
- issue: 찬양의 수여 대상 범위
  choice: 보이지 않는 영, 요엘, 침묵, 위대함을 병렬 대상으로 제시
  alternative: 위대함을 찬양 내용이나 별도 절로 처리
  rationale: 파손된 문맥 때문에 통사 구조가 불확실하므로 현존 영어 증언의 병렬 구조를 유지했습니다.
- issue: 그리스도와 삼중 남성 아이의 관계
  choice: ‘[위대한] 그리스도의 삼중 남성 [아이]’
  alternative: ‘삼중 남성인 [위대한] 그리스도의 [아이]’
  rationale: 소유·동격 관계를 명확히 확정하지 않고 증언의 어순과 모호성을 최대한 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 사본 결락은 대괄호와 말줄임표로 보존했고, 보충된 낱말도 대괄호 안에 두었습니다. 고대 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역입니다.
