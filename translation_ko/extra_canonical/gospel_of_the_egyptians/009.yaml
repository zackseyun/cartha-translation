base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/009.yaml
  text: 'Then the great Seth, son of the indestructible Man, Adamas, offered praise to:


    the great unseen, unnamable, unutterable, virginal Spirit,

    even the <male virgin>,

    <and the triple-male child>,

    <and the male> virgin Youel,

    and Esephech, keeper of splendor,

    and the crown of his glory, the child of the child,

    [] and the great Doxomedon aeons,

    and the Fullness, as I mentioned previously,


    and he petitioned on behalf of his seed.


    Then the great power of great light, Plesithea, came forth from that place:


    the mother of the angels,

    the mother of lights,

    the glorious mother,

    the four-breasted virgin,

    bearing the fruit from Gomorrah as a spring, and from Sodom,

    being the fruit of the spring of Gomorrah dwelling inside her.


    She came forth through the great Seth.


    Then the great Seth rejoiced because of the gift bestowed on him by the indestructible child. He drew his seed from the four-breasted virgin and deposited it with him inside the fourth aeon, inside the third great light, Davithe.'
translation:
  language: ko
  text: '그때에 멸하지 않는 사람 아다마스의 아들, 위대한 셋은 다음 존재들에게 찬양을 드렸습니다.


    위대하고 보이지 않으며 이름 붙일 수도, 말로 나타낼 수도 없는 동정의 영,

    곧 〈남성 동정녀〉,

    〈그리고 세 겹으로 남성인 아이〉,

    〈그리고 남성인〉 동정녀 유엘[a],

    광휘를 지키는 에세페크,

    그의 영광의 관, 곧 아이의 아이,

    […] 그리고 위대한 독소메돈 아이온들[b],

    그리고 내가 앞서 말한 충만에게 드렸습니다.


    그리고 그는 자기 씨를 위하여 간청했습니다.[c]


    그러자 그곳에서 위대한 빛의 위대한 능력인 플레시테아가 나왔습니다.


    천사들의 어머니,

    빛들의 어머니,

    영광스러운 어머니,

    네 젖가슴을 지닌 동정녀,

    고모라에서 샘처럼, 또 소돔에서 열매를 맺으며,

    자기 안에 거하는 고모라 샘의 열매인 이였습니다.[d]


    그녀는 위대한 셋을 통하여 나왔습니다.


    그때에 위대한 셋은 멸하지 않는 아이가 자기에게 베푼 선물로 말미암아 기뻐했습니다. 그는 네 젖가슴을 지닌 동정녀에게서 자기 씨를 끌어내어, 그것을 자기와 함께 넷째 아이온 안, 곧 셋째 위대한 빛인 다비테 안에 두었습니다.[c][e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 꺾쇠 〈 〉 안의 말은 현존 본문의 손상 또는 공백을 번역자가 복원한 부분입니다. 직접 콥트어 대조는 아직 이루어지지 않았습니다.
    reason: 제공된 영어 증언의 편집 표지를 독자가 오해하지 않도록 밝힙니다.
  - marker: b
    text: 이 지점의 현존 본문에는 판독할 수 없는 공백이 있습니다. ‘아이온’은 이 문헌에서 영원한 존재, 시대 또는 초월적 영역을 가리킬 수 있는 전문 용어입니다.
    reason: 사본 결락과 핵심 우주론 용어의 의미 범위를 함께 알립니다.
  - marker: c
    text: ‘씨’는 생식적 씨앗과 셋에게 속한 후손 또는 영적 종족을 함께 가리킬 수 있습니다.
    reason: 번역에서 의도적으로 보존한 중의성을 설명합니다.
  - marker: d
    text: 고모라와 소돔 및 ‘샘의 열매’를 연결하는 구절은 제공된 영어 증언 자체가 난해합니다. 그 관계를 해설적으로 고치지 않고 그대로 두었습니다.
    reason: 불확실한 구문의 의미를 번역자가 임의로 확정하지 않았음을 밝힙니다.
  - marker: e
    text: ‘그것을 자기와 함께 … 안에 두었다’에서 ‘자기와 함께’가 누구와의 결합 또는 보관을 뜻하는지는 분명하지 않습니다.
    reason: 대명사와 관계 표현의 genuine ambiguity를 보존합니다.
lexical_decisions:
- source_word: seed
  choice: 씨
  rationale: 본문에서 후손·영적 집단과 생식적 씨앗을 함께 암시할 수 있으므로, 어느 한 뜻으로 한정하지 않고 한국어에서도 중의성을 보존했습니다.
- source_word: aeon(s)
  choice: 아이온(들)
  rationale: 이 문헌의 우주론적 전문 용어이자 존재·영역·시대를 아우를 수 있는 말이므로 ‘영겁’이나 ‘세계’로 단정하지 않고 음역했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 영지주의 문헌의 기술적 개념을 살리면서도 일반 독자가 이해할 수 있는 전통적이고 자연스러운 대응어를 사용했습니다.
- source_word: virginal Spirit / virgin
  choice: 동정의 영 / 동정녀
  rationale: 첫 표현은 형용사적 성격을, 뒤의 칭호들은 인격적 명칭을 드러내도록 구별했습니다.
- source_word: four-breasted virgin
  choice: 네 젖가슴을 지닌 동정녀
  rationale: 낯선 신화적 형상을 완화하거나 비유로 바꾸지 않고 구체적인 원문 표현을 보존했습니다.
- source_word: came/proceeded forth
  choice: 나왔습니다
  rationale: 유출이라는 교리적 해석을 본문에 미리 넣지 않으면서 반복되는 출현·발출의 움직임을 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 성별이 역설적으로 결합된 칭호들
  choice: 〈남성 동정녀〉, 〈세 겹으로 남성인 아이〉, 〈남성인〉 동정녀
  alternative: 남성적 처녀, 삼중 남성 아들 등으로 해설적으로 평준화
  rationale: 본문의 의도적인 성별 긴장과 서로 충돌해 보이는 칭호를 해소하지 않고 보존했습니다. 꺾쇠는 영어 증언에서 본문 복원을 나타냅니다.
- issue: ‘씨’의 정체
  choice: ‘씨’로 유지
  alternative: 후손, 백성, 영적 종족, 정액
  rationale: 집단적 후손과 생식적 심상이 겹칠 가능성이 있어 특정 신학적 해석으로 확정하지 않았습니다.
- issue: ‘아이의 아이’와 ‘멸하지 않는 아이’
  choice: 직역에 가까운 칭호 유지
  alternative: 아들, 신적 자손 등으로 해석
  rationale: 문헌 내부의 계보와 위격 관계를 번역자가 임의로 정리하지 않도록 원문의 반복적 칭호를 살렸습니다.
- issue: 플레시테아가 셋을 ‘통하여’ 나옴
  choice: ‘위대한 셋을 통하여 나왔습니다’
  alternative: 셋에게서 태어났습니다 / 셋에 의해 나타났습니다
  rationale: 매개, 기원, 통과 가운데 하나로 의미를 좁히지 않고 전치 관계의 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 찬양 대상의 연쇄는 행갈이와 동격 구조를 유지하여 전례적 리듬을 살렸고, 고유명사는 제공된 증언을 기준으로 음역했습니다. 이 초안은 공개 영역 영어 증언을 바탕으로 한 잠정 번역이며, 나그함마디 사본의 콥트어 직접 검토가 남아 있습니다.
