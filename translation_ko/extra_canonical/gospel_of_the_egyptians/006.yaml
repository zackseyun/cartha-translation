translation:
  language: ko
  text: '위대한 로고스와 스스로 생겨난 하나님과 멸할 수 없는 사람 아다마스가 찬양을 드렸습니다. 그들은 스스로 생겨난 이를 위하여 능력과 영원한 권능을, 곧 네 아이온의 완성을 간청했습니다. 이는 그들을 통하여 [] […] 세상, 곧 밤의 형상 속으로 들어갈 큰 빛의 거룩한 사람들의 보이지 않는 아버지의 영광과 능력이 나타나게 하려는 것이었습니다.[a]


    멸할 수 없는 사람 아다마스는 자기에게서 한 아들이 나오게 해 달라고 그들에게 간청했습니다. 이는 그 아들이 움직이지 않고 멸할 수 없는 종족의 아버지가 되고, 그 종족을 통하여 침묵과 음성이 나타나며, 그 종족을 통하여 죽은 아이온이 스스로 일어나 해체되게 하려는 것이었습니다. 그리하여 위로부터 큰 빛의 능력인 현현이 나왔습니다. 그 여자는 네 큰 빛을 낳았습니다.


    하르모젤,


    오로이아엘,


    다비테,


    엘렐레트,


    그리고 멸할 수 없는 사람 아다마스의 아들인, 위대하고 멸할 수 없는 셋입니다. 이렇게 감추어진 신비들 가운데 존재하는 완전한 헵도마드가 완성되었습니다.[b] [] 그 여자가 [영광을 얻으면], 열한 오그도아드가 되며, 아버지께서는 고개를 끄덕여 승인하셨습니다.[c] 빛들의 온 충만이 기뻐했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목에는 사본의 결락이 있습니다. []와 […]는 각각 손상되거나 빠진 본문을 나타냅니다. ‘세상, 곧 밤의 형상 속으로 들어갈’이 ‘거룩한 사람들’을 꾸미는지 다른 대상을 꾸미는지는 불확실합니다.
    reason: 사본 손상 신호와 통사적 모호성을 보존하기 위해서입니다.
  - marker: b
    text: ‘헵도마드’는 일곱으로 이루어진 집단이나 질서를 뜻하는 전문 용어입니다. 이 문맥에서 무엇을 어떻게 일곱으로 세는지는 명확하지 않습니다.
    reason: 낯선 전문어를 본문에서 유지하면서 최소한의 독자 도움을 제공하기 위해서입니다.
  - marker: c
    text: 이 문장 앞에도 결락이 있습니다. ‘[영광을 얻으면]’은 복원된 말이며, ‘열한 오그도아드’는 문자적으로 열한 개의 여덟 단위 또는 여덟 무리를 뜻하지만 정확한 우주론적 계산은 불확실합니다.
    reason: 복원 표시와 난해한 수리 표현의 불확실성을 명시하기 위해서입니다.
lexical_decisions:
- source_word: Logos
  choice: 로고스
  rationale: 이 문헌의 전문적 우주론 용어이자 인격적 명칭일 가능성을 보존하고, ‘말씀’으로 옮길 때 생길 수 있는 정경적·교파적 연상을 피했습니다.
- source_word: self-generated
  choice: 스스로 생겨난
  rationale: 존재의 기원에 관한 원문의 표현을 해석적으로 ‘자존하는’ 또는 ‘독생한’으로 바꾸지 않고 자연스러운 한국어로 옮겼습니다.
- source_word: aeon
  choice: 아이온
  rationale: 시간적 ‘세대’와 초월적 존재·영역이라는 의미가 함께 가능한 고대 영지주의 문헌의 전문어이므로 음역했습니다.
- source_word: Manifestation
  choice: 현현
  rationale: 여성 대명사로 지칭되는 인격적 존재의 명칭처럼 쓰이므로 ‘나타남’보다 명칭성이 드러나는 ‘현현’을 택했습니다.
- source_word: Hebdomad
  choice: 헵도마드
  rationale: ‘일곱의 집단/구조’라는 전문적 수리 우주론 용어를 해설적으로 확정하지 않고 음역했습니다.
- source_word: Ogdoads
  choice: 오그도아드
  rationale: ‘여덟의 집단/구조’를 가리키는 전문어이며 복수형의 의미는 앞의 수사 ‘열한’과 문맥으로 드러나므로 관용적 음역을 사용했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 전체성 및 플레로마적 함의를 열어 두는 전통적이고 이해 가능한 대응어를 선택했습니다.
- source_word: indestructible
  choice: 멸할 수 없는
  rationale: ‘불멸의’보다 파괴·해체될 수 없다는 원뜻을 직접 보존했습니다.
- source_word: Adamas / Harmozel / Oroiael / Davithe / Eleleth / Seth
  choice: 아다마스 / 하르모젤 / 오로이아엘 / 다비테 / 엘렐레트 / 셋
  rationale: 고유명사는 문헌의 낯선 명칭성을 유지하도록 한국어로 음역했으며, Seth는 통용 성서 표기 ‘셋’을 사용했습니다.
theological_decisions:
- issue: ‘the sacred men of the great Light’와 뒤따르는 관계절의 수식 관계
  choice: ‘세상 … 속으로 들어갈 큰 빛의 거룩한 사람들’로 연결
  alternative: ‘큰 빛이 세상으로 들어간다’로 연결
  rationale: 제공된 증거에서 관계대명사의 선행사는 ‘거룩한 사람들’이 가장 가깝지만, 손상된 문맥 때문에 통사적 불확실성이 남으므로 각주로 밝혔습니다.
- issue: ‘by means of it’의 선행사
  choice: ‘그 종족을 통하여’
  alternative: ‘그 아들을 통하여’ 또는 비인칭 ‘그것을 통하여’
  rationale: 직전의 ‘움직이지 않고 멸할 수 없는 종족’을 선행사로 읽되, 원문 검토 전에는 확정할 수 없어 각주에 대안을 보존했습니다.
- issue: ‘the dead aeon would lift itself … dissolve’
  choice: ‘죽은 아이온이 스스로 일어나 해체되다’
  alternative: ‘죽은 아이온이 일으켜져 소멸되다’
  rationale: 재귀적 행위와 역설적 표현을 그대로 유지하여 신학적으로 매끄럽게 해소하지 않았습니다.
- issue: 여성형 ‘Manifestation’의 인격성
  choice: ‘현현’이라는 명칭과 ‘그 여자’라는 대명사 사용
  alternative: 비인격적 ‘그 나타남’
  rationale: 영어 증거가 여성 대명사 She를 명시하므로 여성 인격적 존재로 제시되는 긴장을 보존했습니다.
- issue: ‘eleven Ogdoads’의 난해한 수리 표현
  choice: ‘열한 오그도아드’로 직역
  alternative: ‘열한 개의 여덟 무리’로 해설
  rationale: 본문 손상과 전문적 우주론 구조 때문에 뜻을 계산하거나 교정하지 않고 원 증거의 난해함을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 찬양과 우주론적 서술의 장중함은 유지하되 지나치게 고어적인 표현은 피했습니다. 제공 자료가 콥트어 직접 검토가 아닌 공공영역 영어 증거에 근거하므로, 대괄호·말줄임표·전문 용어와 문법적 모호성을 보수적으로 보존했습니다.
