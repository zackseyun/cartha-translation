  text: 'Five thousand years later, the great light Eleleth said, “Let there be a ruler over Chaos and Hades,” and a cloud appeared [] [named] the hylic Sophia [. . .].


    [She] looked out over the regions [of Chaos]. Her face resembled [. . .] in her form [. . .] blood, and [the great] angel Gamaliel said [to the great Gabriel], the minister of [the great light] Oroiael. He [said, “Let an] angel come forth [to] rule over Chaos [and Hades].”


    Then the cloud [complied and produced] two monads, each [possessing] light. [. . . the throne] she had established in the cloud [above].


    Then Sakla, the great [angel, saw] the great demon [who accompanied him, Nebr]uel, and [together] they became a procreating spirit of the earth. [They begot] ministering angels.


    Sakla [said] to the great [demon] Nebruel, “Let [the] twelve aeons come into being in [the . . .] aeon, worlds [. . .].”


    [. . .] the great angel [Sakla] said, by the will of the self-generated one, [] “There shall [be] the [. . .] numbering seven [. . .],” and he said to the [great angels], “Go, and [let each] of you rule over his (own) [world].”


    Each [of these] twelve [angels] came [forth]:


    [The first] angel is Ath[oth]. [He is the one] whom [the great] generations of humans call [. . .].

    [The] second is Harmas, [who] is [fire-eye].

    The third [is Galila].

    [The] fourth is Yobel.

    [The fifth is] Adonaios, who is [called] Sabaoth.


    The sixth [is Cain, whom] the [great generations of] humans call the sun.

    The [seventh is Abel].

    The eighth is Akiressina.

    The [ninth is Yubel].

    The tenth is Harm[oupiael].

    [The] eleventh is Arch[ir-Adonin].

    The twelfth [is Belias].


    [These are] the ones stationed over Hades [and Chaos], and after the foundation [of the world], Sakla said to his [angels], “I, even I, am a [jealous] God, and apart from me nothing has [come into being,” because he] [] relied on his (own) substance. [13]


    Then a voice came from on high, saying, “The Man exists, and the Son of the Man.”


    The first mold was formed because of the descent of the image above, which reflects its voice on high—the image that peered out through the peering out of the image above. Repentance came into being because of this.'
translation:
  language: ko
  text: '오천 년 뒤, 큰 빛 엘렐렛이 말했습니다. “카오스와 하데스를 다스릴 통치자가 생겨나라.” 그러자 구름 하나가 나타났는데, [] 그 이름은 [질료적] 소피아였습니다. […].[a]


    [그 여자는] [카오스의] 여러 영역을 내다보았습니다. 그 여자의 얼굴은 […]와 닮았고, 그 모습에는 […] 피가 […]. 그때 [큰] 천사 가말리엘이 [큰 빛] 오로이아엘을 섬기는 [큰 가브리엘에게] 말했습니다. 그는 [이렇게 말했습니다. “한] 천사가 나와 [카오스와 하데스를] 다스리게 하라.”


    그러자 그 구름은 [그 말에 따르며] 각각 빛을 [지닌] 두 모나드를 낳았습니다. […] 그 여자가 [위쪽] 구름 속에 세워 놓은 [보좌가 …].[b]


    그때 큰 [천사] 사클라는 자기와 [함께 있던] 큰 악령 [네브]루엘을 [보았습니다]. 그리고 [둘은 함께] 자식을 낳는 땅의 영이 되었습니다. [그들은] 시중드는 천사들을 [낳았습니다].


    사클라는 큰 [악령] 네브루엘에게 [말했습니다]. “[열두] 아이온이 [……] 아이온 안에 생겨나게 하라. 세계들이 […].”[c]


    […] 큰 천사 [사클라]가 스스로 생겨난 이의 뜻에 따라 [] 말했습니다. “[…] 일곱으로 헤아려지는 것들이 [있을 것이다 …].” 그리고 그는 [큰 천사들에게] 말했습니다. “가서, [너희가 저마다] 자기 [세계]를 다스려라.”


    [이] 열두 [천사]가 각각 [나왔습니다].


    [첫째] 천사는 아트[오트]입니다. [그는] 인류의 [큰] 세대들이 […]라고 부르는 자입니다.


    [둘째]는 하르마스이며, 그는 [불의 눈]입니다.


    셋째는 [갈릴라]입니다.


    [넷째]는 요벨입니다.


    [다섯째는] 아도나이오스이며, [사바오트]라고 불립니다.


    여섯째는 [카인이며], 인류의 [큰 세대들]이 태양이라고 부르는 자입니다.


    [일곱째는 아벨]입니다.


    여덟째는 아키레시나입니다.


    [아홉째는 유벨]입니다.


    열째는 하르[우피아엘]입니다.


    [열한째]는 아르크[이르아도닌]입니다.


    열두째는 [벨리아스]입니다.


    [이들이] 하데스와 [카오스] 위에 배치된 자들입니다. [세계의] 기초가 놓인 뒤, 사클라는 자기 [천사들에게] 말했습니다. “나, 바로 내가 [질투하는] 하나님이며, 나 밖에는 아무것도 [생겨나지 않았다.” 이는 그가] [] 자기 자신의 본질을 의지했기 때문입니다.[d]


    그때 높은 곳에서 음성이 들려왔습니다. “사람이 존재하며, 사람의 아들이 존재한다.”[e]


    위에 있는 형상이 내려왔기 때문에 첫 형체가 빚어졌습니다. 그 형상은 높은 곳에서 자기 음성을 반향하며, 위에 있는 형상이 내다본 일을 통하여 내다본 형상입니다. 이 때문에 회개가 생겨났습니다.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역에서 대괄호는 손상된 사본에서 복원된 말이나 불확실한 부분을, […]는 읽을 수 없거나 빠진 부분을 나타냅니다. 빈 대괄호 []도 전승된 판독 표시대로 남겼습니다.
    reason: 사본 손상과 편집적 복원의 범위를 독자가 식별하도록 하기 위함입니다.
  - marker: b
    text: ‘모나드’는 ‘하나인 것’ 또는 ‘단일한 실재’를 뜻할 수 있는 고대 철학·우주론 용어입니다. 여기서는 정확한 지위를 단정하지 않고 음역했습니다.
    reason: 전문 용어의 다의성과 문헌 특유의 우주론을 보존하기 위함입니다.
  - marker: c
    text: ‘아이온’은 문맥에 따라 영원한 존재, 시대, 또는 초월적 영역을 가리킬 수 있습니다. 본문이 심하게 손상되어 여기서는 어느 한 뜻으로 확정하기 어렵습니다.
    reason: 고대 용어의 진정한 의미적·신학적 모호성을 보존하기 위함입니다.
  - marker: d
    text: 이 선언은 사클라의 말로 제시됩니다. 문장의 일부가 손상되어 있으며, ‘자기 자신의 본질을 의지했다’는 뒤따르는 설명과의 정확한 관계도 완전히 분명하지 않습니다.
    reason: 인용자의 주장과 본문 화자의 평가를 혼동하거나 신학적 결론을 과도하게 확정하지 않기 위함입니다.
  - marker: e
    text: ‘사람’과 ‘사람의 아들’은 이 문헌에서 우주론적 칭호일 수 있습니다. 여기서는 정체를 특정 인물로 확정하지 않았습니다.
    reason: 가능한 칭호성과 정체의 모호성을 함께 보존하기 위함입니다.
  - marker: f
    text: 마지막 문단의 형상, 음성, ‘내다봄’ 사이의 관계는 원문 증거 자체가 난해합니다. 번역은 반복 구조를 보존했으며, ‘회개’가 인격화된 존재인지 행위인지도 확정하지 않았습니다.
    reason: 손상되고 난해한 구문을 해설로 대체하지 않고 독자에게 알리기 위함입니다.
lexical_decisions:
- source_word: hylic Sophia
  choice: '[질료적] 소피아'
  rationale: ‘hylic’의 물질·질료 관련 의미를 보존하되, 문헌 고유의 인물명 ‘소피아’는 음역했습니다. 보충된 말이라는 대괄호도 유지했습니다.
- source_word: Chaos / Hades
  choice: 카오스 / 하데스
  rationale: 이 문헌의 우주론적 고유 영역을 일반어 ‘혼돈’이나 후대의 특정한 ‘지옥’ 개념으로 단정하지 않도록 음역했습니다.
- source_word: monads
  choice: 모나드
  rationale: 문헌의 전문적 우주론 용어가 가리키는 바를 ‘단일체’ 등으로 해석해 확정하지 않고 음역했습니다.
- source_word: aeons
  choice: 아이온
  rationale: 존재자·시대·영역이라는 의미 가능성이 겹치는 전문 용어이므로 하나로 좁히지 않고 음역했습니다.
- source_word: self-generated one
  choice: 스스로 생겨난 이
  rationale: 원 증거에 나타난 칭호의 의미를 자연스러운 한국어로 옮기되 특정 교리 용어를 덧붙이지 않았습니다.
- source_word: substance
  choice: 본질
  rationale: 자기에게 속한 존재 기반을 뜻하는 추상어로 옮겼으며 ‘물질’로 좁히지 않았습니다.
- source_word: mold
  choice: 형체
  rationale: 사람을 빚기 위한 틀 또는 빚어진 형태라는 양쪽 가능성을 완전히 해소하지 않는 표현을 택했습니다.
- source_word: Repentance
  choice: 회개
  rationale: ‘돌이킴’의 인격화 또는 우주론적 실재일 가능성을 열어 두면서 전통적으로 인지 가능한 대응어를 사용했습니다.
theological_decisions:
- issue: 사클라의 자기 신격 선언
  choice: 인용문의 주장으로 그대로 제시하고 뒤의 서술과 구별했습니다.
  alternative: 사클라를 참 하나님 또는 거짓 신으로 본문 안에서 명시적으로 규정하기
  rationale: 본문 자체가 만드는 긴장과 화자의 평가 방식을 보존하고 해설적 교리 판단을 삽입하지 않았습니다.
- issue: ‘The Man’과 ‘the Son of the Man’의 정체
  choice: “사람”과 “사람의 아들”로 직역했습니다.
  alternative: “인자” 또는 특정한 구원자·원형 인간으로 명시하기
  rationale: 정관사가 암시하는 우주론적 칭호 가능성은 있으나, 공급된 증거만으로 특정 인물이나 기독론적 칭호로 확정하지 않았습니다.
- issue: ‘회개’의 존재론적 지위
  choice: “회개가 생겨났습니다”라고 인격화 가능성을 보존했습니다.
  alternative: 누군가가 회개했다고 사건으로 풀어 쓰기
  rationale: 원문의 생성 표현이 ‘회개’를 우주론적 실재처럼 제시할 수 있으므로 이를 평범한 심리 행위로 환원하지 않았습니다.
- issue: 손상된 창조 서술의 주체와 관계
  choice: 복원 대괄호와 생략 부호를 유지하며 문법상 가능한 범위에서만 주어를 밝혔습니다.
  alternative: 소피아, 구름, 천사들의 역할을 매끄러운 연속 서사로 재구성하기
  rationale: 사본 손상으로 생긴 실제 불확실성과 신학적 긴장을 번역자가 임의로 해소하지 않기 위해서입니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 고유명사와 전문 우주론 용어는 일관되게 음역했고, 지나치게 교회적인 어휘로 의미를 선취하지 않았습니다. 공급된 초안은 콥트어 직접 대조가 아직 이루어지지 않은 공개 영역 영어 증언에 기초하므로, 모든 대괄호·생략 부호를 엄격히 보존하고 매끄러움을 위해 결락을 보충하지 않았습니다. 사본 쪽수 표기 [13]은 본문 내용이 아니므로 제외했습니다.
