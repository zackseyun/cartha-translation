  source_fidelity: 영어 증언을 기준으로 볼 때, 초안은 전반적인 사건 순서와 고유명사·전문 용어를 대체로 보존합니다. 그러나 복원 대괄호의 범위가 여러 곳에서 바뀌었고, ‘named’, ‘producing’, ‘the great Gabriel, the minister’, ‘the twelve aeons’, 마지막의 난해한 형상·내다봄 구문 등에서 원 증언보다 해석을 더하거나 관계를 재구성한 부분이 있습니다. 특히 마지막 문단은 원문의 난해함을 유지하는 방향으로 고쳐야 합니다.
  naturalness: 합쇼체는 대체로 자연스럽습니다. 다만 손상된 구절을 매끄럽게 만들려다 ‘그 여자는’, ‘그 말에 따르며’, ‘자식을 낳는’처럼 원문에 없는 성별·인과·서사적 뉘앙스가 첨가되었습니다. 결락 구절에서는 다소 파편적인 한국어를 허용하는 편이 더 충실합니다.
  terminology: 카오스, 하데스, 소피아, 모나드, 아이온 등의 음역 선택은 적절합니다. ‘substance’는 ‘본질’보다 존재론적·철학적 의미를 덜 좁히는 ‘실체’가 낫습니다. 정관사가 있는 ‘The Man’과 ‘the Son of the Man’은 ‘그 사람’과 ‘그 사람의 아들’로 옮겨 칭호성을 보존했습니다.
  issues:
  - severity: medium
    issue: 사본 복원 표지의 범위와 위치가 여러 곳에서 변형되었습니다.
    rationale: 예를 들어 [named], [to the great Gabriel], [the], [the great] 등의 복원 범위가 한국어 문장 안에서 확대·축소되거나 이동했습니다. 이 본문에서는 대괄호 자체가 중요한 본문비평 정보이므로, 가능한 한 공급된 영어 증언의 표지를 따라야 합니다.
  - severity: medium
    issue: 몇몇 표현이 원 증언보다 해석적입니다.
    rationale: ‘그 여자는’은 [She]의 성별을 확정하고, ‘그 말에 따르며’는 compliant의 대상을 보충하며, ‘자식을 낳는’은 ‘who begets’의 표현을 특정한 서사로 강화합니다. 결락이 많은 본문이므로 이러한 보충은 피하는 것이 안전합니다.
  - severity: high
    issue: 마지막 ‘첫 mold/형상/음성/내다봄’ 문단의 관계가 재구성되었습니다.
    rationale: 초안은 원문의 반복되고 난해한 관계를 ‘위에 있는 형상이 … 내다본 일을 통하여 내다본 형상’으로 정리하면서 관계를 바꾸었습니다. 영어 증언의 구문 자체가 난해하므로, 문장을 나누되 형상·음성·내다봄의 반복과 불확실성을 보존해야 합니다.
  - severity: low
    issue: ‘The Man’과 ‘the Son of the Man’의 정관사 표지가 약화되었습니다.
    rationale: ‘사람’과 ‘사람의 아들’만으로는 두 표현의 칭호적·특정적 성격이 다소 약해집니다. 특정 인물로 동일시하지 않으면서 ‘그 사람’과 ‘그 사람의 아들’로 옮길 수 있습니다.
  revised_text: '오천 년 뒤, 큰 빛 엘렐렛이 말했습니다. “카오스와 하데스를 다스릴 통치자가 생겨나라.” 그러자 구름이 나타났습니다. [] [질료적 소피아라고 이름한] […].[a]



    [그녀는] [카오스의] 여러 부분을 내다보았습니다. 그녀의 얼굴은 […]와 닮았고, 그 형상에는 […] 피가 […]. 그리고 [큰] 천사 가말리엘이 [큰 빛] 오로이아엘의 시종인 [큰 가브리엘에게] 말했습니다. 그가 [말했습니다. “한] 천사가 나와 [카오스와 하데스를] 다스리게 하라.”



    그러자 그 구름은 [따라서 두 모나드를 만들어 냈고], 각각 [빛을 지녔습니다]. [… 보좌를] 그녀가 [위쪽] 구름 속에 세워 놓았습니다.[b]



    그때 큰 [천사] 사클라는 그와 함께 있는 큰 악령 [네브르]우엘을 [보았습니다]. 그리고 [함께] 그들은 낳는 땅의 영이 되었습니다. [그들은] 시종드는 천사들을 [낳았습니다].



    사클라는 큰 [악령] 네브루엘에게 [말했습니다]. “[그] 열두 아이온이 [그 …] 아이온, 세계들 […] 안에 생겨나게 하라.”[c]



    […] 큰 천사 [사클라]가 스스로 생겨난 이의 뜻에 따라 [] 말했습니다. “[있을] […] 일곱으로 헤아려지는 […].” 그리고 그는 [큰 천사들에게] 말했습니다. “가서, [각자가] 자기 [세계]를 다스리게 하라.”



    [이] 열두 [천사]가 각각 [나왔습니다].



    [첫째] 천사는 아트[오트]입니다. [그는] 사람들의 [큰] 세대들이 […]라고 부르는 자입니다.



    [둘째]는 하르마스이며, 그는 [불의 눈]입니다.



    셋째는 [갈릴라]입니다.



    [넷째]는 요벨입니다.



    [다섯째는] 아도나이오스이며, [사바오트]라고 불립니다.



    여섯째는 [카인이며], 사람들의 [큰 세대들]이 태양이라고 부르는 자입니다.



    [일곱째는 아벨]입니다.



    여덟째는 아키레시나입니다.



    [아홉째는 유벨]입니다.



    열째는 하르[우피아엘]입니다.



    [열한째]는 아르크[이르아도닌]입니다.



    열두째는 [벨리아스]입니다.



    [이들이] 하데스와 [카오스] 위에 배치된 자들입니다. [세계의] 기초가 놓인 뒤, 사클라는 자기 [천사들에게] 말했습니다. “나, 바로 내가 [질투하는] 하나님이며, 나 밖에는 아무것도 [생겨나지 않았다.” 이는 그가] [] 자기 자신의 실체를 의지했기 때문입니다.[d]



    그때 높은 곳에서 음성이 들려왔습니다. “그 사람이 존재하며, 그 사람의 아들이 존재한다.”[e]



    첫 틀은 위에 있는 형상이 내려옴으로 말미암아 형성되었습니다. 그 형상은 높은 곳에서 자기 음성을 반향합니다. 내다본 형상의 내려옴은 위에 있는 형상의 내다봄을 통하여 이루어졌습니다. 이 때문에 회개가 생겨났습니다.[f]'
  revised_footnotes:
  - marker: a
    text: 이 번역에서 대괄호는 손상된 사본에서 복원된 말이나 불확실한 부분을, […]는 읽을 수 없거나 빠진 부분을 나타냅니다. 빈 대괄호 []도 전승된 판독 표시대로 남겼습니다.
    reason: 사본 손상과 편집적 복원의 범위를 독자가 식별하도록 하기 위함입니다.
  - marker: b
    text: ‘모나드’는 ‘하나인 것’ 또는 ‘단일한 실재’를 뜻할 수 있는 고대 철학·우주론 용어입니다. 여기서는 정확한 지위를 단정하지 않고 음역했습니다.
    reason: 전문 용어의 다의성과 문헌 특유의 우주론을 보존하기 위함입니다.
  - marker: c
    text: ‘아이온’은 문맥에 따라 영원한 존재, 시대, 또는 초월적 영역을 가리킬 수 있습니다. 본문이 심하게 손상되어 여기서는 어느 한 뜻으로 확정하기 어렵습니다.
    reason: 고대 용어의 의미적·신학적 모호성을 보존하기 위함입니다.
  - marker: d
    text: 이 선언은 사클라의 말로 제시됩니다. 문장의 일부가 손상되어 있으며, ‘자기 자신의 실체를 의지했기 때문’이라는 뒤따르는 설명이 누구를 가리키는지와 앞선 인용문에 어떻게 연결되는지는 완전히 분명하지 않습니다.
    reason: 인용자의 주장과 본문 화자의 평가를 혼동하거나 손상된 문장의 관계를 과도하게 확정하지 않기 위함입니다.
  - marker: e
    text: ‘그 사람’과 ‘그 사람의 아들’은 이 문헌에서 우주론적 칭호일 수 있습니다. 여기서는 정체를 특정 인물로 확정하지 않았습니다.
    reason: 칭호성과 정체의 모호성을 함께 보존하기 위함입니다.
  - marker: f
    text: 마지막 문단의 형상, 음성, 내려옴, ‘내다봄’ 사이의 관계는 원문 증거 자체가 난해합니다. 번역은 영어 증언의 반복 구조를 가능한 한 보존했으며, ‘회개’가 인격화된 존재인지 행위인지도 확정하지 않았습니다.
    reason: 손상되고 난해한 구문을 해설로 대체하지 않고 독자에게 알리기 위함입니다.
  revision_rationale: 공급된 공개영역 영어 증언을 우선 기준으로 삼아, 결락·복원 표지를 가능한 한 원 위치와 범위에 맞추고, 본문에 없는 성별·인과·서사적 보충을 제거했습니다. 고유명사와 우주론 용어의 음역은 유지했습니다. 마지막 문단은 문법적으로 다듬기 위해 문장을 나누었지만, 형상·음성·내다봄의 난해한 반복 관계를 해설적으로 해소하지 않도록 고쳤습니다. 콥트어 직접 대조가 아직 보류된 상태이므로, 이 수정은 영어 증언에 대한 안전한 충실성 교정입니다.
