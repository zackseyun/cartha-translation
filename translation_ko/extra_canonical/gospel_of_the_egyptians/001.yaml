translation:
  language: ko
  text: '[] 이름을 말할 수 없는 아버지,

    [충만의] 높은 곳에서 [비롯하신],

    빛의 영겁들에서 나온 빛의 빛,

    섭리의 [침묵의] 빛이며

    침묵의 아버지,

    말씀과 진리의 [빛],

    [] [불멸하는 것들의] 빛,

    무한한 빛,

    드러낼 수 없고, 나타낼 표지도 없으며,

    늙지 않고, 말로 선포할 수 없는 아버지의

    빛의 영겁들에서 나온 광채,

    영겁들의 영겁,[a]

    스스로 생겨난 이, 스스로 생겨나게 하는 이, 스스로 산출하는 이,

    낯선 이,

    영겁,

    진리, 알레토스.[b]


    [. . .] 위대하고 보이지 않는 [영]의 [거룩한] 책.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영겁’은 원문의 ‘아이온(aeon)’을 옮긴 말로, 끝없는 시대를 뜻할 수도 있고 초월적 영역이나 실재를 가리킬 수도 있습니다.
    reason: 핵심 우주론 용어의 진정한 의미상 모호성을 알립니다.
  - marker: b
    text: ‘알레토스’는 전승된 형태를 음역한 것입니다. 앞의 ‘진리’와 어떤 관계인지는 확실하지 않습니다.
    reason: 음역어를 번역어와 섣불리 동일시하지 않고 본문의 불확실성을 보존합니다.
lexical_decisions:
- source_word: Fullness
  choice: 충만
  rationale: 영지주의 문헌의 전문적 우주론 용어일 가능성을 보존하면서도 현대 한국어 독자가 이해할 수 있는 직역을 택했습니다.
- source_word: aeon
  choice: 영겁
  rationale: 문맥상 단순한 ‘시대’보다 초월적 실재 또는 영원한 시대를 가리킬 수 있으므로, 의미의 다층성을 살리는 ‘영겁’을 사용했습니다.
- source_word: Speech
  choice: 말씀
  rationale: 신적 실재를 열거하는 장엄한 문맥을 반영하되, 특정 교리의 ‘로고스’로 단정하지 않도록 원문의 일반적 의미를 유지했습니다.
- source_word: indestructibilities
  choice: 불멸하는 것들
  rationale: 추상 복수형의 낯섦을 보존하면서 한국어로 이해 가능하게 옮겼습니다.
- source_word: the alien
  choice: 낯선 이
  rationale: ‘타자’, ‘이방인’ 등으로 교리적으로 좁히지 않고, 원문의 이질성과 모호성을 유지했습니다.
- source_word: ALĒTHŌS
  choice: 알레토스
  rationale: 대문자로 제시된 특수 명칭 또는 음역어의 성격을 살려 음역했습니다.
theological_decisions:
- issue: ‘aeon’이 시간적 영겁인지 인격적·초월적 실재인지
  choice: 영겁
  alternative: 아이온 / 시대
  rationale: 본문의 병렬 구조가 칭호와 우주론적 영역 양쪽을 허용하므로 한쪽으로 확정하지 않았습니다.
- issue: ‘self-generated, self-generating, self-producing’의 주체와 의미
  choice: 스스로 생겨난 이, 스스로 생겨나게 하는 이, 스스로 산출하는 이
  alternative: 자생자, 자생하게 하는 자, 자산자
  rationale: 세 표현의 구별과 신학적 긴장을 유지하고, 지나친 전문 용어화를 피했습니다.
- issue: ‘Truth, ALĒTHŌS’의 관계
  choice: 진리, 알레토스
  alternative: 참으로 진리
  rationale: 둘을 동의어 반복이나 하나의 문장으로 합치지 않고, 원문 증언에 나타난 병치를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 장중한 명사구·찬가체로 옮겼습니다. 합쇼체로 전환할 서술문이나 명령문이 없는 단편입니다. 대괄호와 생략점은 증언 본문의 훼손 및 복원 표지를 그대로 보존했습니다. 다만 제공 자료가 콥트어 원문 자체가 아니라 공개 영어 번역 증언이며 직접 원어 검토가 보류된 상태이므로, 이 초안도 잠정적입니다. 제목성 구절은 영어 증언의 첫머리에 있으나 문법적으로 이어지는 찬가적 동격 구조를 고려해 마지막에 배치하지 않고 원래 순서를 유지해야 한다는 가능성이 있습니다.
