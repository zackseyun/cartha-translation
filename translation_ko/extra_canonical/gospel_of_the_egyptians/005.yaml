translation:
  language: ko
  text: '[] [. . . 그]곳에서 큰 빛의 구름, 곧 살아 있는 능력이자 거룩하고 소멸하지 않는 이들의 어머니인 큰 능력 미로토에가 [나타났습니다]. 그리고 그녀는 내가 세 번 소리 내어 그 이름을 부르는 이를 낳았습니다.[a]


    IEN

    IEN

    EA

    EA

    EA


    이는 바로 사람, 곧 태초의 사람에게서 비롯된 찬란한 빛 아다마스입니다. 그를 통하여, 또 그를 위하여 모든 것이 생겨났으며, 그를 떠나서는 아무것도 생겨나지 않았습니다. 알 수 없고 붙잡을 수 없는 아버지께서 발현하시어 위로부터 내려오셨고, 결핍을 없애셨습니다.


    그때 위대한 로고스, 곧 스스로 생겨난 신과 소멸하지 않는 사람 아다마스가 서로 하나가 되었습니다. 사람의 로고스가 생겨났으나, 그 사람은 말하는 행위를 통해 생겨났습니다.[b] 그는 다음 이들에게 찬양을 드렸습니다.


    위대하고 보이지 않으며 붙잡을 수 없는 처녀 영,

    남성인 처녀,

    세 겹으로 남성인 아이,

    [] 그리고 남성인 [처녀] 유엘,

    광채를 지키는 에세페크,

    아이의 아이,

    그 영광의 면류관,

    위대한 독소메돈 아이온,

    그 안에 있는 보좌들,

    그를 둘러싼 능력들,

    영광들,

    소멸하지 않는 존재들,

    그리고 내가 앞서 말한 그들의 충만 전체,

    또 하나님을 받아들이는 공기의 땅,

    곧 큰 빛의 거룩한 사람들이 형상을 얻는 곳,

    살아 있는 고요한 침묵의 아버지께 속한 사람들,

    그 아버지와, 내가 앞서 말한 그들의 충만 전체에 찬양을 드렸습니다.[c]


    [a] 사본의 훼손과 복원 표시는 대괄호와 줄임표로 보존했습니다. ‘세 번’이라는 말 뒤에 이름 음절이 다섯 줄로 전승되는 난점도 그대로 두었습니다.

    [b] ‘사람의 로고스’와 ‘말하는 행위’는 같은 어근의 연관성을 드러내지만, 그 정확한 관계는 본문만으로 확정하기 어렵습니다.

    [c] 마지막 열거의 문법적 관계는 불분명합니다. 번역문은 이 모두를 찬양의 대상으로 읽되, 원문의 긴장과 반복을 보존했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사본의 훼손과 복원 표시는 대괄호와 줄임표로 보존했습니다. ‘세 번’이라는 말 뒤에 이름 음절이 다섯 줄로 전승되는 난점도 그대로 두었습니다.
    reason: 전승 상태와 수적 불일치를 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘사람의 로고스’와 ‘말하는 행위’는 같은 어근의 연관성을 드러내지만, 그 정확한 관계는 본문만으로 확정하기 어렵습니다.
    reason: Logos와 speech의 언어유희 및 구문적 모호성을 보존하기 위해서입니다.
  - marker: c
    text: 마지막 열거의 문법적 관계는 불분명합니다. 번역문은 이 모두를 찬양의 대상으로 읽되, 원문의 긴장과 반복을 보존했습니다.
    reason: 긴 열거의 통사 구조와 ‘아버지’의 위치가 불확실함을 밝히기 위해서입니다.
lexical_decisions:
- source_word: Logos
  choice: 로고스
  rationale: ‘말씀’, ‘이성’, ‘발화’ 가운데 하나로 좁히지 않고 고유한 우주론적 용어의 다의성을 보존했습니다. 이어지는 ‘말하는 행위’와의 어근상 연관은 각주로 밝혔습니다.
- source_word: Fullness
  choice: 충만 전체
  rationale: 영지주의적 전문어의 집합적·우주론적 함의를 살리면서도 현대 독자가 뜻을 짐작할 수 있도록 옮겼습니다.
- source_word: aeon
  choice: 아이온
  rationale: 단순히 ‘시대’나 ‘영원’으로 번역하면 인격적·영역적 존재를 가리킬 가능성이 사라지므로 음역했습니다.
- source_word: indestructible
  choice: 소멸하지 않는
  rationale: ‘불멸’보다 물리적·존재론적으로 파괴되지 않는다는 원문의 폭넓은 의미를 유지했습니다.
- source_word: deficiency
  choice: 결핍
  rationale: 도덕적 죄나 특정 교리로 해석하지 않고 우주론적 부족 상태라는 추상성을 보존했습니다.
- source_word: proceeded
  choice: 발현하시어
  rationale: 공간적 이동만이 아니라 근원에서 나옴을 나타내되, 특정 교파의 ‘발출’ 교리를 직접 불러오지 않도록 했습니다.
- source_word: Man / Primal Man
  choice: 사람 / 태초의 사람
  rationale: 신화적 원형 인간을 나타내는 대문자 표기는 한국어에서 드러나지 않으므로 ‘태초의’라는 수식으로 구별했습니다.
- source_word: virginal Spirit
  choice: 처녀 영
  rationale: 성별과 순결을 둘러싼 낯선 원문의 표현을 ‘순결한 영’으로 완화하지 않고 보존했습니다.
- source_word: earth of the air
  choice: 공기의 땅
  rationale: 역설적인 우주론적 표현을 ‘공중의 땅’ 등으로 해소하지 않고 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 아다마스와 창조의 관계
  choice: ‘그를 통하여, 또 그를 위하여’와 ‘그를 떠나서는’을 그대로 보존
  alternative: 기독교 정경의 유사 문구에 맞추어 ‘그로 말미암아’로 통일
  rationale: 본문 자체가 제시하는 아다마스의 매개적·목적적 역할을 다른 문헌의 신학으로 대체하지 않았습니다.
- issue: 로고스와 사람의 생성 관계
  choice: ‘사람의 로고스가 생겨났으나, 그 사람은 말하는 행위를 통해 생겨났다’
  alternative: 로고스가 사람을 창조했다고 명시
  rationale: 접속 관계와 행위 주체가 모호하므로 인과관계를 확정하지 않았습니다.
- issue: ‘male virgin’의 역설
  choice: ‘남성인 처녀’
  alternative: ‘남성적이며 순결한 존재’
  rationale: 원문의 성별 역설과 신학적 긴장을 완화하거나 조화시키지 않았습니다.
- issue: 침묵과 아버지의 관계
  choice: ‘살아 있는 고요한 침묵의 아버지’
  alternative: ‘말없이 살아 계신 아버지’
  rationale: ‘Silence’가 우주론적 존재나 속성일 가능성을 열어 두고, 단순한 침묵 상태로 환원하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 신화적·전례적 열거에는 장중한 리듬을 유지했습니다. 고유명사는 영어 증거 본문에 따라 음역했습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로 이 초안은 제공된 공개 영역 영어 증거 본문에 근거한 잠정 번역입니다. 사본 면수로 보이는 [10]은 본문 흐름을 방해하므로 넣지 않았고, 실제 훼손·복원 표시는 보존했습니다.
