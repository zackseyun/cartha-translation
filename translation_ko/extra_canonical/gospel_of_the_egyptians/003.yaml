translation:
  language: ko
  text: '도메돈 독소메돈이 행렬을 이루어 나왔습니다. 그는 아이온들의 아이온이며, 그의 안에는 보좌가 있고, 그를 [둘러싼] 권능들과 영광들과 [파괴될 수 없는 존재들이] 있습니다.[a] 침묵에서 [나오신] 위대한 빛의 아버지, 그는 [위대한] 독소메돈 아이온입니다. 그 안에는 [세 겹으로] 남성인 아이가 안식하고 있으며, 그 아이온 안에는 그의 [영광의] 보좌가 세워졌습니다. 그 보좌 위의 판에는 그의 드러낼 수 없는 이름이 [새겨져] 있습니다. […] 하나인 말씀, 곧 만유의 [빛의 아버지]이신 그는 침묵 안에서 안식하시면서 침묵에서 [나오셨고], 그의 […] 이름은 [보이지 않는] 표징 안에 있습니다.


    [한] 감추어진 [보이지 않는] 신비가 행렬을 이루어 나왔습니다.


    I I I I I I I I I I I I I I I I I I I [I I I]


    Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē Ē [Ē Ē]


    [O] O O O O O O O O O O O O O O O O O O O O O


    U U [U U U] U U U U U U U U U U U U U U U U U


    E E E E E E E E E E E E E E E E E E E E E E


    A A A A A A A [A A A A] A A A A A A A A A A A.


    Ō Ō Ō Ō Ō Ō Ō Ō [Ō Ō Ō] Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō Ō.[b]


    이와 같이 세 권능은 [위대하고], 보이지 않으며, 이름 붙일 수 없고, 처녀이며, 말로 표현할 수 없는 영과 [그의] 남성 처녀에게 찬양을 드렸습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 콥트어 원문 대조가 아직 이루어지지 않은 공개 영역 영어 증거문을 바탕으로 한 잠정 번역입니다. 본문 속 대괄호는 증거문에서 손상된 부분을 보충한 글자를, […]는 판독할 수 없거나 빠진 부분을 나타냅니다.
    reason: 번역의 자료적 한계와 본문 비평 기호의 뜻을 독자에게 알립니다.
  - marker: b
    text: 모음 글자의 반복과 장음 표시는 증거문에 나타난 신비적 발성 또는 이름의 형식을 그대로 보존한 것입니다. 대괄호 안 글자는 복원된 부분입니다.
    reason: 반복 문자열을 번역하거나 한국어로 음역하지 않은 이유를 설명합니다.
  - marker: c
    text: ‘남성 처녀’는 원문의 역설적인 성별 표현을 그대로 살린 것입니다. 이를 특정한 교리적 개념으로 풀어 쓰지 않았습니다.
    reason: 낯선 표현을 평준화하지 않고 원문의 신학적 긴장을 보존했음을 밝힙니다.
lexical_decisions:
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌에서 우주적 영역 또는 인격화된 존재를 가리킬 수 있는 전문 용어이므로, ‘영겁’처럼 시간 의미로 한정하지 않고 음역했습니다.
- source_word: came in procession
  choice: 행렬을 이루어 나왔습니다
  rationale: 단순한 ‘나타남’보다 의례적·장엄한 진행의 이미지를 보존했습니다.
- source_word: indestructibilities
  choice: 파괴될 수 없는 존재들
  rationale: 복수의 추상명사가 인격적·우주적 실재를 가리킬 가능성을 살리면서도 ‘불멸자들’로 의미를 과도하게 확정하지 않았습니다.
- source_word: Silence
  choice: 침묵
  rationale: 고유한 우주론적 실재일 가능성을 고려해 반복을 보존하고 문맥상 장엄한 명칭처럼 제시했습니다.
- source_word: triple-male child
  choice: '[세 겹으로] 남성인 아이'
  rationale: 난해한 복합 표현을 교리적으로 해석하지 않고, 복원 표시와 성별 표현을 가능한 한 그대로 보존했습니다.
- source_word: male virgin
  choice: 남성 처녀
  rationale: 원문의 의도적인 역설과 성별 긴장을 ‘동정남’ 등으로 평준화하지 않고 직역에 가깝게 보존했습니다.
- source_word: symbol
  choice: 표징
  rationale: 가시적 기호 이상의 신비적 함의를 허용하면서도 의미를 특정 교리로 제한하지 않는 표현을 택했습니다.
theological_decisions:
- issue: ‘위대한 빛의 아버지’와 ‘독소메돈 아이온’의 동일성
  choice: ‘그는 … 독소메돈 아이온입니다’로 동일시하는 문장 구조를 보존했습니다.
  alternative: 독소메돈을 아버지가 거하는 별개의 아이온으로 해석할 수 있습니다.
  rationale: 제공된 증거문은 ‘he is’를 사용하지만 뒤이어 아이온을 공간처럼 묘사하여 긴장이 있습니다. 번역에서 이 긴장을 해소하지 않았습니다.
- issue: 보좌가 누구의 안에 세워졌는지
  choice: 앞선 ‘독소메돈 아이온’을 받아 ‘그 아이온 안에는’이라고 옮겼습니다.
  alternative: ‘그의 안에는’으로 두어 지시 대상을 더 모호하게 유지할 수 있습니다.
  rationale: 한국어 문장 흐름을 확보하되, 보좌의 소유자는 복원된 ‘그의 [영광]’으로 남겨 두었습니다.
- issue: ‘말씀’과 ‘만유의 빛의 아버지’의 관계
  choice: 동격일 가능성을 살려 ‘하나인 말씀, 곧 … 아버지’로 제시했습니다.
  alternative: 문헌 손상 때문에 ‘말씀’과 ‘아버지’를 별개의 항목으로 읽을 수 있습니다.
  rationale: 증거문의 구문을 따르되, 앞부분의 결락을 표시하여 확정적 해석을 피했습니다.
- issue: 영과 남성 처녀의 관계
  choice: ‘영과 [그의] 남성 처녀’라는 병렬 대상을 그대로 보존했습니다.
  alternative: ‘남성 처녀’를 앞선 영에 대한 두 번째 서술로 읽을 가능성도 있습니다.
  rationale: 증거문에 접속사 ‘and’와 복원된 소유대명사가 있으므로 두 찬양 대상을 우선적으로 반영하되 복원 표지를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 찬가적·계시문학적 장엄함을 유지했습니다. 고대 영지주의 문헌의 전문 용어인 ‘아이온’은 음역했고, 인명 ‘Domedon Doxomedon’은 ‘도메돈 독소메돈’으로 옮겼습니다. 제공된 영어 증거문의 맨 쪽수 [5], [6]은 본문 내용이 아니므로 제외했습니다. 손상·복원 표시는 유지했으며, 원문 대조 전에는 구문과 복원어가 잠정적입니다.
