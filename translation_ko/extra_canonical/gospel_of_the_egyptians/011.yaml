  yaml_path: translation/extra_canonical/gospel_of_the_egyptians/011.yaml
  text: 'She received her completion and her power by the will and pleasure of the Father. Through this pleasure, he was pleased with the great, indestructible, unmoving race of the great and mighty men of the great Seth, so that he could sow it within the aeons that had been produced and, through her, fulfill the deficiency. For she descended from above into the world, being the image of the night. When she had come forth, she petitioned on behalf of the seed of the archon of this aeon and <the> authorities who originated from him—the polluted (seed) of the demon-begetting god who will be destroyed—and (she petitioned on behalf of) the seed [] of Adam and the great Seth, which resembles the sun.


    Then the great angel Hormos arrived to prepare the seed of the great Seth, by means of the virgins of the polluted sowing (with seed) of this aeon, within a sacred vessel begotten by the Logos through the holy Spirit.


    Then the great Seth arrived with his seed, and it was sown within the aeons that had been produced, their number agreeing with the numerical value of “Sodom.” Some say that Sodom is the place where the great Seth pastures, being Gomorrah. Others, however, say that the great Seth removed his planting from Gomorrah and transplanted it to a second place, which he named Sodom.


    This is the race that came forth through Edokla, because by speaking she gave birth to Truth and Justice, being the beginning of the seed of eternal life, which is for those who will persevere because of the knowledge of their emanation. This is the great, indestructible race that has come forth through three [] worlds into the world. The deluge occurred as a type of the consummation of the aeon, but it will be sent into the world because of this race.


    A conflagration will overtake the earth, and grace will be for those of the race (that came into being) through the prophets and the watchers who watch over the life of the race. Because of this race, famines and plagues will come, but these things will happen on account of the great, indestructible race. On account of this race, temptations will arrive, even a deceit of false prophets.


    Then the great Seth witnessed the work of the devil: his many disguises, his plots against the indestructible, unmoving race, the persecutions by his powers and his angels, and their error (by which) they acted against themselves.


    Then the great Seth offered praise to:


    the great, unnamable, virginal Spirit,

    and the male [] virgin Barbelon,

    and the triple-male child Telmael Telmael Heli Heli Machar Machar Seth,

    the living power, ALĒTHES ALĒTHŌS,

    and the male virgin Youel,

    and Esephech, keeper of splendor, the crown of his glory,

    and the great Doxomedon aeon,

    and the thrones within him,

    and the powers surrounding them,

    and the entire Fullness, as I mentioned previously,

    and he petitioned for watchers over his seed.'
translation:
  language: ko
  text: '그 여자는 아버지의 뜻과 그분의 기쁨으로 자신의 완성과 능력을 얻었습니다. 아버지께서는 그 기쁨을 통하여 위대한 셋의 위대하고 강한 이들로 이루어진, 소멸하지 않고 흔들리지 않는 위대한 종족을 기뻐하셨습니다. 이는 그분이 이미 생겨난 아이온들[a] 안에 그 종족을 씨 뿌리고, 그 여자를 통하여 결핍이 채워지게 하시려는 것이었습니다. 그 여자는 밤의 형상으로서 위로부터 세상으로 내려왔기 때문입니다. 그 여자가 나아왔을 때, 이 아이온의 아르콘[b]의 씨와 그에게서 비롯된 <그> 권세들, 곧 멸망할 마귀 낳는 신의 더럽혀진 (씨)를 위하여 간청하였고, 또한 아담과 위대한 셋의 씨 [] 곧 태양을 닮은 씨를 위하여 간청하였습니다.


    그때 위대한 천사 호르모스가 와서, 성령을 통하여 로고스[c]가 낳은 거룩한 그릇 안에서, 이 아이온의 더럽혀진 씨 뿌림의 처녀들을 매개로 위대한 셋의 씨를 준비하였습니다.


    그때 위대한 셋이 자기 씨와 함께 왔고, 그 씨는 이미 생겨난 아이온들 안에 뿌려졌습니다. 그 아이온들의 수는 “소돔”의 글자들이 나타내는 수와 일치하였습니다.[d] 어떤 이들은 소돔이 위대한 셋이 양 떼를 먹이는 곳, 곧 고모라라고 말합니다. 그러나 다른 이들은 위대한 셋이 고모라에서 자기 심은 것을 옮겨, 두 번째 장소에 다시 심고 그곳을 소돔이라 이름 붙였다고 말합니다.


    이 종족은 에도클라를 통하여 나왔습니다. 그 여자가 말함으로써 진리와 정의를 낳았기 때문입니다. 이것이 영원한 생명의 씨의 시작이며, 그 씨는 자신들이 발출되어 나온 근원을 아는 지식으로 말미암아 끝까지 견딜 이들을 위한 것입니다.[e] 이 종족이 세 [] 세계를 거쳐 이 세상으로 나온, 소멸하지 않는 위대한 종족입니다. 대홍수는 아이온의 완결을 보여 주는 모형으로 일어났으나, 그것은 이 종족 때문에 세상으로 보내질 것입니다.[f]


    큰불이 땅을 덮칠 것이며, 예언자들과 그 종족의 생명을 지키는 파수자들을 통하여 생겨난 그 종족의 사람들에게 은혜가 있을 것입니다. 이 종족 때문에 기근과 전염병이 닥칠 것입니다. 그러나 이런 일들은 소멸하지 않는 위대한 종족으로 말미암아 일어날 것입니다. 이 종족으로 말미암아 시험들이 닥칠 것이며, 거짓 예언자들의 속임까지 이를 것입니다.


    그때 위대한 셋은 마귀의 일을 보았습니다. 곧 그의 수많은 변장과, 소멸하지 않고 흔들리지 않는 종족을 해치려는 그의 계략과, 그의 권세들과 천사들이 일으킨 박해와, 그들이 자기 자신을 거슬러 행하게 한 그들의 미혹을 보았습니다.


    그때 위대한 셋은 다음 이들에게 찬양을 드렸습니다.


    위대하고 이름 붙일 수 없는 동정의 영,


    남성인 [] 동정녀 바르벨론,


    세 겹으로 남성인 아이 텔마엘 텔마엘 헬리 헬리 마카르 마카르 셋,


    살아 있는 능력, 알레테스 알레토스,


    남성인 동정녀 유엘,


    광휘를 지키는 이이며 그의 영광의 면류관인 에세페크,


    위대한 독소메돈 아이온,


    그 안에 있는 보좌들,


    그들을 둘러싼 권세들,


    그리고 내가 앞서 말한 온 충만[g]입니다.


    그리고 그는 자기 씨를 지킬 파수자들을 보내 달라고 간청하였습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이온’은 이 문헌에서 초월적 세계·영역을 가리키기도 하고, 문맥에 따라 한 시대를 가리키기도 합니다.
    reason: 전문 용어의 다의성과 본문의 우주론적 배경을 설명합니다.
  - marker: b
    text: ‘아르콘’은 문자적으로 통치자 또는 지배 권세를 뜻하며, 여기서는 이 아이온을 다스리는 우주적 권세를 가리킵니다.
    reason: 음역한 전문 용어의 기본 의미를 제공합니다.
  - marker: c
    text: ‘로고스’는 말, 이성, 말씀을 뜻할 수 있으나, 여기서는 인격적 명칭처럼 쓰이므로 음역했습니다.
    reason: 번역 선택과 가능한 의미 범위를 밝힙니다.
  - marker: d
    text: 고대에는 글자마다 수치를 부여하여 이름의 글자값을 계산하기도 했습니다. 본문은 ‘소돔’의 글자값과 아이온들의 수를 연결합니다.
    reason: ‘수치’에 관한 난해한 진술의 문화적 배경을 설명합니다.
  - marker: e
    text: ‘발출’은 존재들이 더 높은 신적 실재에서 흘러나오거나 비롯되었다는 이 문헌의 우주론적 관념을 나타냅니다.
    reason: 핵심 우주론 용어를 설명합니다.
  - marker: f
    text: 본문은 대홍수가 이미 일어났다고 말한 뒤 다시 미래에 ‘보내질 것’이라고 말합니다. 이 시제상의 긴장을 그대로 보존했습니다.
    reason: 원문 증언의 난점과 번역상의 비해결을 표시합니다.
  - marker: g
    text: ‘충만’은 신적 존재와 영역의 온전한 총체를 가리키는 전문 개념으로 쓰입니다.
    reason: 일상적 의미와 전문적 의미를 구분합니다.
lexical_decisions:
- source_word: aeon
  choice: 아이온
  rationale: 문맥에 따라 초월적 영역 또는 시대를 함께 가리킬 수 있는 전문 용어이므로 음역하여 의미의 중층성과 모호성을 보존했습니다.
- source_word: archon
  choice: 아르콘
  rationale: 일반적인 ‘통치자’보다 이 문헌의 우주론적 권세를 지칭하는 전문 용어의 성격이 강하므로 음역했습니다.
- source_word: Logos
  choice: 로고스
  rationale: 단순히 ‘말씀’으로 번역하면 후대의 특정 신학적 동일시를 강화할 수 있어, 인격적·우주론적 명칭의 성격을 살려 음역했습니다.
- source_word: race
  choice: 종족
  rationale: 반복되는 집단적·계보적 정체성을 나타내는 핵심어로서 ‘세대’나 ‘민족’보다 문맥에 적합합니다.
- source_word: seed
  choice: 씨
  rationale: 후손, 기원, 파종이라는 의미가 중첩되어 있으므로 일관되게 ‘씨’로 옮겨 비유적 긴장을 유지했습니다.
- source_word: emanation
  choice: 발출되어 나온 근원
  rationale: 난해한 우주론적 의미를 유지하면서도 일반 독자가 문장의 관계를 파악할 수 있도록 풀어 옮겼습니다.
- source_word: Fullness
  choice: 충만
  rationale: 우주론적 총체를 가리키는 전문 개념이지만 한국어로 자연스러운 대응어가 있어 ‘충만’으로 번역하고 각주로 설명했습니다.
theological_decisions:
- issue: ‘마귀 낳는 신’과 ‘멸망할’ 대상의 관계
  choice: 수식 관계를 원문 증언의 배열대로 유지하여 ‘멸망할 마귀 낳는 신’으로 번역
  alternative: ‘멸망할 더럽혀진 씨’로 해석
  rationale: 제공된 증언은 관계가 다소 난해하지만 ‘who will be destroyed’가 바로 앞의 god를 받는 형태이므로 이를 따르되 모호성을 해설로 제거하지 않았습니다.
- issue: 대홍수가 ‘보내질 것’이라는 시제와 지시 대상
  choice: ‘그것은 … 보내질 것입니다’로 보존
  alternative: 대홍수의 과거 사건과 미래 심판을 구분해 의역
  rationale: 앞에서는 대홍수가 일어났다고 하고 뒤에서는 보내질 것이라고 하는 시제상의 긴장을 원문 그대로 남겼습니다.
- issue: 남성인 동정녀 및 세 겹으로 남성인 아이
  choice: 역설적인 성별 표현을 문자적으로 보존
  alternative: 상징적 중성 표현으로 완화
  rationale: 본문의 신학적·상징적 긴장을 현대적 표현으로 평준화하지 않았습니다.
- issue: 재난이 종족 ‘때문에/말미암아’ 온다는 인과성
  choice: 인과 표현을 그대로 유지
  alternative: 종족을 박해하기 위해 재난이 온다고 목적 관계로 해석
  rationale: 원문 증언의 ‘because of/on account of’가 목적과 원인 중 어느 쪽인지 확정하지 않고 직접적인 인과 표현으로 남겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 반복되는 ‘씨’, ‘종족’, ‘아이온’은 문헌의 구조와 신학적 어휘망을 보존하기 위해 가능한 한 일관되게 유지했습니다. 인명과 독특한 신적 명칭은 한국어로 음역했습니다. 꺾쇠괄호, 소괄호, 대괄호는 증언 본문의 보충·설명·결락 표지를 보존합니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제공된 공개 영역 영어 증언에 근거한 잠정 번역입니다.
