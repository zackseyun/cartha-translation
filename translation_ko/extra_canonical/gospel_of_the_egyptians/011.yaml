  revised_text: '그녀는 아버지의 뜻과 그분의 기쁨으로 자신의 완성과 능력을 얻었습니다. 아버지께서는 그 기쁨을 통하여 위대한 셋의 위대하고 강한 이들로 이루어진, 소멸하지 않고 흔들리지 않는 위대한 종족을 기뻐하셨습니다. 이는 그분이 이미 생겨난 아이온들[a] 안에 그 종족을 심으시고, 그녀를 통하여 결핍이 채워지게 하시려는 것이었습니다. 그녀는 밤의 형상으로서 위로부터 세상으로 내려왔기 때문입니다. 그녀가 나아왔을 때, 이 아이온의 아르콘[b]의 씨와 그에게서 비롯된 <그> 권세들, 곧 멸망할 마귀 낳는 신의 더럽혀진 (씨)를 위하여 간청하였고, 또한 아담과 위대한 셋의 씨 [] 곧 태양을 닮은 씨를 위하여 간청하였습니다.



    그때 위대한 천사 호르모스가 와서, 성령을 통하여 로고스[c]가 낳은 거룩한 그릇 안에서, 이 아이온의 더럽혀진 (씨) 뿌림에 속한 처녀들을 통하여 위대한 셋의 씨를 준비하였습니다.



    그때 위대한 셋이 자기 씨와 함께 왔고, 그 씨는 이미 생겨난 아이온들 안에 뿌려졌습니다. 그 아이온들의 수는 “소돔”의 글자들이 나타내는 수와 일치하였습니다.[d] 어떤 이들은 소돔이 위대한 셋이 풀을 뜯는 곳, 곧 고모라라고 말합니다. 그러나 다른 이들은 위대한 셋이 고모라에서 자기 심은 것을 옮겨 두 번째 장소에 다시 심고, 그곳을 소돔이라 이름 붙였다고 말합니다.



    이 종족은 에도클라를 통하여 나왔습니다. 그녀가 말함으로써 진리와 정의를 낳았기 때문입니다. 이것이 영원한 생명의 씨의 시작이며, 그 씨는 자신들이 발출되어 나온 근원을 아는 지식으로 말미암아 끝까지 견딜 이들을 위한 것입니다.[e] 이 종족이 세 [] 세계를 통하여 세상으로 나온, 소멸하지 않는 위대한 종족입니다. 대홍수는 아이온의 완결을 보여 주는 모형으로 일어났으나, 그것은 이 종족 때문에 세상으로 보내질 것입니다.[f]



    큰불이 땅을 덮칠 것이며, 예언자들과 그 종족의 생명을 지키는 파수자들을 통하여 생겨난 그 종족의 사람들에게 은혜가 있을 것입니다. 이 종족 때문에 기근과 전염병이 닥칠 것입니다. 그러나 이런 일들은 소멸하지 않는 위대한 종족 때문에 일어날 것입니다. 이 종족 때문에 시험들이 닥칠 것이며, 거짓 예언자들의 속임까지 이를 것입니다.



    그때 위대한 셋은 마귀의 일을 보았습니다. 곧 그의 수많은 변장과, 소멸하지 않고 흔들리지 않는 종족을 해치려는 그의 계략과, 그의 권세들과 천사들에게서 비롯된 박해와, 그들이 자기 자신을 거슬러 행한 그들의 오류를 보았습니다.



