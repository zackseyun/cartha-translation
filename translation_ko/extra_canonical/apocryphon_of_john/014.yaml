  text: 'However, all the angels and demons labored until they had formed the psychic body. Their creation was entirely inert and without movement for a prolonged time.


    When, however, the mother wished to regain the power she had granted to the chief archon, she entreated the Most Merciful Mother-Father of the All.


    With the sacred decree, he dispatched the five lights down onto the place of the angels of the chief archon, and they counseled him that they should bring forth the power of the mother, and they said to Yaltabaoth, “Blow of your Spirit into his face, and his body will stand up.” And he blew into his face his Spirit, which is the power of his mother.


    He was unaware, because he exists in ignorance, and the power of the mother went forth from Yaltabaoth into the psychic body they had formed according to the image of he who is from the beginning.


    The body moved and attained strength, and it was radiant, and at that time the rest of «20» the powers grew envious, because he had come into existence through all of them, and they had bestowed their power on the man, and his intellect surpassed (that of) those who had made him, and the chief archon.


    When, however, they saw that he was radiant, and that he could reason better than they, and that he was unburdened by evil, they took him up and thrust him down into the nethermost region of all matter.


    However, the Blessed One, the Mother-Father, the beneficent and merciful one, showed mercy to the power of the mother which had been brought forth from the chief ruler, because they might acquire power over the psychic and sensory body, and through his beneficent Spirit and his great mercy he dispatched to Adam a helper, Radiant Reflection who emerges out of him, who is called “{Life:1}.”


    She, however, helps the entire creation by laboring together with him, and by restoring to him his perfection, and by instructing him concerning the descent of his seed, and by instructing him concerning the way of ascent, the way by which it descended.


    Further, Reflection of Light was concealed inside Adam, so that the archons would be unknowing, but that Reflection would be a rectification of the deficiency of the mother, and the man became visible on account of the light-shadow inside him, and his intellect surpassed (that of) all those who had made him.'
translation:
  language: ko
  text: '1. 그러나 모든 천사와 귀신은 혼적인 몸을 빚어 낼 때까지 수고했습니다. 그들이 만든 것은 오랫동안 완전히 무기력하여 움직이지 못했습니다.


    2. 그러나 어머니는 자신이 수석 아르콘에게 주었던 능력을 되찾고자 하여, 만유의 지극히 자비로운 어머니-아버지께 간청했습니다.


    3. 그분은 거룩한 명령에 따라 다섯 빛을 수석 아르콘의 천사들이 있는 곳으로 내려보내셨습니다. 다섯 빛은 어머니의 능력이 밖으로 나오게 하도록 그에게 꾀를 일러 주었습니다. 그들은 얄다바오트에게 말했습니다. “네 영을 그의 얼굴에 불어넣어라. 그러면 그의 몸이 일어설 것이다.” 그러자 그는 자신의 영을 그 얼굴에 불어넣었습니다. 그 영은 곧 그의 어머니의 능력이었습니다.


    4. 그는 무지 가운데 있었으므로 이를 알지 못했습니다. 그리하여 어머니의 능력은 얄다바오트에게서 나와, 그들이 태초부터 계신 분의 형상을 따라 빚은 혼적인 몸 안으로 들어갔습니다.


    5. 그 몸은 움직이고 힘을 얻었으며 빛났습니다. 그때 나머지 권세들은 시기했습니다. 그 사람이 그들 모두를 통하여 생겨났고, 그들이 자신들의 능력을 그에게 주었는데도, 그의 지각이 그를 만든 자들과 수석 아르콘의 지각을 뛰어넘었기 때문입니다.


    6. 그들은 그가 빛나며 자기들보다 더 뛰어나게 생각할 수 있고 악의 짐도 지지 않은 것을 보자, 그를 들어 올렸다가 모든 물질계의 가장 낮은 영역으로 내던졌습니다.


    7. 그러나 복되신 분, 곧 선하시고 자비로우신 어머니-아버지께서는 수석 통치자에게서 빠져나온 어머니의 능력을 불쌍히 여기셨습니다. 그것은 그들이 혼적이고 감각적인 몸을 지배할 수도 있었기 때문입니다.[a] 그분은 자신의 선한 영과 크신 자비를 통하여 아담에게 돕는 이를 보내셨습니다. 그 돕는 이는 그분에게서 나오는 빛나는 성찰이며, ‘생명’이라 불립니다.[b]


    8. 그녀는 아담과 함께 일하여 온 창조 세계를 돕고, 그를 완전한 상태로 회복시키며, 그의 씨가 내려온 일과 그 씨가 내려온 길, 곧 다시 올라가는 길을 그에게 가르칩니다.


    9. 또한 빛의 성찰은 아르콘들이 알아차리지 못하도록 아담 안에 숨겨졌습니다. 그러나 그 성찰은 어머니의 결핍을 바로잡는 것이 되었습니다. 그 사람은 자기 안에 있는 빛의 그림자 때문에 눈에 드러나게 되었고,[c] 그의 지각은 그를 만든 모든 자의 지각을 뛰어넘었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그들이 … 지배할 수도 있었기 때문입니다”가 앞선 자비의 이유인지, 뒤이어 돕는 이를 보내신 이유인지 문장 구조가 모호합니다.
    reason: 수식 및 인과 관계의 진정한 모호성을 독자에게 알리기 위함입니다.
  - marker: b
    text: 전승 자료에는 이 이름이 ‘{Life:1}’이라는 편집 표지와 함께 제시되어 있습니다. 여기서는 이름 자체를 ‘생명’으로 옮겼습니다.
    reason: 제공된 증거의 비본문적 표지를 본문에 그대로 노출하지 않으면서 원자료 상태를 기록하기 위함입니다.
  - marker: c
    text: “빛의 그림자”는 역설적인 원문 표현입니다. 그것이 정확히 무엇을 가리키는지는 분명하지 않습니다.
    reason: 난해한 상징을 해석으로 대체하지 않고 보존했음을 밝히기 위함입니다.
lexical_decisions:
- source_word: psychic body
  choice: 혼적인 몸
  rationale: ‘psychic’을 단순히 ‘정신적’ 또는 ‘영적’으로 풀어 신체와 영의 구별을 지워 버리지 않도록, 문헌의 전문적 층위를 보존하는 ‘혼적’이라는 표현을 사용했습니다.
- source_word: chief archon / chief ruler
  choice: 수석 아르콘 / 수석 통치자
  rationale: ‘아르콘’은 이 문헌의 우주론적 존재 명칭으로 음역하되, 원문 증거의 표현 변화가 드러나는 곳에서는 ‘통치자’를 사용했습니다.
- source_word: five lights
  choice: 다섯 빛
  rationale: 인격적 존재인지 발광체인지 단정하지 않고 원문의 표상을 보존했습니다.
- source_word: Radiant Reflection / Reflection of Light
  choice: 빛나는 성찰 / 빛의 성찰
  rationale: ‘reflection’이 반영·사유·성찰의 의미를 함께 지닐 수 있는 모호성을 어느 정도 보존하면서, 여성 대명사로 지칭되는 돕는 이의 명칭처럼 읽히게 했습니다.
- source_word: intellect
  choice: 지각
  rationale: 단순한 지능보다 인식 능력 전반을 가리키도록 ‘지각’을 택했으며, 비교 구문을 자연스럽게 명시했습니다.
- source_word: unburdened by evil
  choice: 악의 짐도 지지 않은
  rationale: 악이 없다는 교리적 단정으로 평면화하지 않고 ‘짐을 지지 않음’이라는 원문의 비유를 살렸습니다.
- source_word: light-shadow
  choice: 빛의 그림자
  rationale: 역설적인 합성 표현을 해소하지 않고 그대로 보존했습니다.
theological_decisions:
- issue: 어머니-아버지의 성별 및 신적 호칭
  choice: ‘어머니-아버지’를 복합 호칭으로 유지하고 존대 지시어를 사용함
  alternative: ‘부모’ 또는 ‘어버이’로 통합 번역
  rationale: 본문의 의도적인 양성적 신적 호칭과 긴장을 보존하기 위해 통합하지 않았습니다.
- issue: 영과 어머니의 능력의 동일성
  choice: ‘그 영은 곧 그의 어머니의 능력이었습니다’로 명시
  alternative: 영이 어머니에게서 받은 별도의 능력이라고 해석
  rationale: 제공된 증거가 영을 어머니의 능력과 동격으로 진술하므로 그 관계를 그대로 보존했습니다.
- issue: ‘생명’이라 불리는 여성적 돕는 이
  choice: 여성 대명사 ‘그녀’를 유지
  alternative: 문법적 성을 제거하여 ‘그 돕는 이’로만 지칭
  rationale: 증거 본문이 이 존재를 여성 대명사로 이어 가므로 이를 보존하되, 특정 교리적 인물과 동일시하지 않았습니다.
- issue: 씨의 하강과 상승
  choice: ‘그의 씨’가 내려온 길을 다시 올라가는 길과 연결
  alternative: 아담 개인의 영혼이 하강·상승한다고 해석
  rationale: 본문의 지시 대상인 ‘seed’를 임의로 영혼이나 후손 중 하나로 확정하지 않고 ‘씨’로 유지했습니다.
- issue: 어머니의 결핍의 교정
  choice: ‘바로잡는 것’으로 번역
  alternative: 구원, 속죄, 충만 등 교리적 용어 사용
  rationale: rectification의 기능을 나타내되 특정 구원론 체계로 과도하게 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증거에 근거한 잠정 번역입니다. 전문 용어 ‘아르콘’과 ‘혼적’을 유지하되 문맥으로 이해할 수 있도록 문장을 자연스럽게 다듬었고, 필사본 쪽수 표지 «20»은 본문에서 제외했습니다.
