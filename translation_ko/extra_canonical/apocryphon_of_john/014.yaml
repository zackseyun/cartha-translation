    4. 그는 무지 가운데 존재했으므로 알지 못했습니다. 어머니의 능력은 얄다바오트에게서 나와, 그들이 태초부터 있는 이의 형상을 따라 빚은 혼적인 몸 안으로 들어갔습니다.


    5. 그 몸은 움직이고 힘을 얻었으며 빛났습니다. 그때 나머지 권세들은 시기했습니다. 그 사람이 그들 모두를 통하여 생겨났고, 그들이 자신들의 능력을 그 사람에게 주었으며, 그의 지성이 그를 만든 자들과 수석 아르콘의 지성을 뛰어넘었기 때문입니다.


    6. 그러나 그들은 그가 빛나고, 그들보다 더 잘 추론할 수 있으며, 악의 짐을 지지 않은 것을 보자, 그를 들어 올렸다가 모든 물질의 가장 깊은 곳으로 내던졌습니다.


    7. 그러나 복되신 분, 곧 선하시고 자비로우신 어머니-아버지께서는 수석 통치자에게서 나왔던 어머니의 능력을 불쌍히 여기셨습니다. 그것은 그들이 혼적이고 감각적인 몸을 지배하게 될 수도 있었기 때문입니다.[a] 그분은 자신의 선한 영과 크신 자비로 아담에게 돕는 이를 보내셨습니다. 그 돕는 이는 그분에게서 나오는 빛나는 반영이며, ‘생명’이라 불립니다.[b]


