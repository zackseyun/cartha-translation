translation:
  language: ko
  text: '1. 그러므로 만유의 완전한 섭리인 나는 내 자신의 씨로 모습을 바꾸었습니다. 내가 가장 먼저 존재한 이였기 때문입니다. 나는 모든 길을 두루 다녔습니다. 내가 빛의 풍요이기 때문입니다.


    2. 나는 충만의 기억입니다. 그러나 나는 어둠의 영역으로 들어갔고, 감옥 한가운데에 이를 때까지 굳세게 나아갔습니다. 그러자 혼돈의 기초들이 떨었습니다. 나는 그들의 악 때문에 그들에게서 몸을 숨겼고, 그들은 나를 알아보지 못했습니다.


    3. 나는 두 번째로 다시 돌아와 두루 다녔습니다.


    4. 나는 빛에 속한 이들에게서 나왔습니다. 그 빛은 바로 나이며, 나는 섭리의 기억입니다.


    5. 나는 내 사명을 돌보고 있었으므로 어둠 한가운데와 하데스 깊숙한 곳으로 들어갔습니다.[a] 그러자 혼돈의 기초들이 떨며, 혼돈에 사는 이들 위로 무너져 그들을 멸하려 했습니다. 나는 그들이 때가 되기 전에 멸망하지 않도록 다시 서둘러 위로, 내 빛의 뿌리로 올라갔습니다.


    6. 나는 세 번째로도 나아갔습니다. 나는 빛 안에 있는 빛이며 섭리의 기억입니다. 나는 어둠 한가운데와 하데스 깊숙한 곳으로 들어가, 그들의 아이온이 완성될 때의 빛으로 내 얼굴을 가득 채웠습니다.[b] 그리고 그들의 감옥 한가운데, 곧 몸의 감옥으로 들어가 말했습니다. “듣는 이는 깊은 잠에서 일어나십시오.” 그러자 그가 울었고 눈물이 흘렀습니다.


    7. 그는 자기에게서 쓰라린 눈물을 닦아 내며 말했습니다. “누가 내 이름을 부릅니까? 내가 감옥의 사슬에 매여 있는데, 이 희망은 어디에서 내게 왔습니까?”


    8. 나도 말했습니다. “나는 순수한 빛의 섭리입니다.


    9. 나는 당신을 찬양받을 곳으로 들어 올리는 처녀 영의 생각입니다.


    10. 일어나십시오. 당신이 귀 기울인 사람임을 기억하고, 당신의 뿌리를 따르십시오. 그 뿌리는 바로 자비로운 이인 나입니다. 궁핍의 천사들과 혼돈의 악령들과 당신을 덫에 빠뜨리는 모든 자에게서 자신을 지키십시오. 깊은 잠과 하데스 깊숙한 곳의 갇힘을 조심하십시오.”


    11. 나는 또한 그를 일으켜 세우고 다섯 인장의 물의 빛으로 그에게 인장을 찍었습니다.[c] 그때부터 죽음이 그를 제압하지 못하게 하려는 것이었습니다. 보십시오, 이제 나는 완전한 아이온으로 올라갈 것입니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하데스’는 죽은 이들의 영역 또는 지하 세계를 가리키는 말입니다. 여기서는 후대의 ‘지옥’ 개념으로 한정하지 않았습니다.
    reason: 신학적으로 과도한 특정화를 피하면서 낯선 음역어를 설명합니다.
  - marker: b
    text: ‘아이온’은 문맥에 따라 시대, 영원한 영역, 또는 초월적 존재를 가리킬 수 있습니다. 이 구절의 정확한 뜻은 불확실합니다.
    reason: 원문의 전문 용어가 지닌 실제적 다의성을 보존합니다.
  - marker: c
    text: ‘다섯 인장의 물의 빛’은 원문의 결합 관계가 분명하지 않은 의례적 표현입니다. ‘다섯 인장이 있는 빛의 물’로 이해할 가능성도 있습니다.
    reason: 구문상의 모호성과 의례 해석의 불확실성을 알립니다.
  - marker: d
    text: ‘완전한 아이온’은 완전한 시대 또는 완전한 초월적 영역을 뜻할 수 있습니다.
    reason: 음역한 전문 용어의 가능한 의미 범위를 제시합니다.
lexical_decisions:
- source_word: Providence
  choice: 섭리
  rationale: 인격화된 구원 행위자이면서도 ‘돌봄·예비·계획’의 의미를 지닌 명칭이므로, 한국어 종교 문헌에서 널리 이해되는 ‘섭리’를 사용했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 그노시스 문헌의 전문 개념을 특정 교파의 해석으로 좁히지 않으면서 원문의 추상적·우주론적 성격을 보존합니다.
- source_word: Chaos
  choice: 혼돈
  rationale: 단순한 무질서이면서 동시에 영역을 가리키는 고유 개념의 가능성을 살리기 위해 문맥에 따라 ‘혼돈’으로 표기했습니다.
- source_word: Hades
  choice: 하데스
  rationale: ‘지옥’으로 번역하여 후대의 형벌 교리를 끌어들이지 않고, 원문의 지하·죽음 영역 개념을 음역했습니다.
- source_word: aeon
  choice: 아이온
  rationale: 시대·영원·초월적 영역 또는 존재를 함께 가리킬 수 있는 전문 용어의 다의성을 보존하기 위해 음역했습니다.
- source_word: root
  choice: 뿌리
  rationale: 기원과 본래 소속을 나타내는 원문의 은유를 해설적으로 풀지 않고 그대로 유지했습니다.
- source_word: five seals
  choice: 다섯 인장
  rationale: 의례적·상징적 표현을 특정한 세례 체계로 단정하지 않고 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: ‘섭리’의 자기 동일성과 인격성
  choice: ‘만유의 완전한 섭리인 나는’처럼 일인칭 인격 발화를 유지했습니다.
  alternative: 섭리를 비인격적인 신적 계획으로 풀어 번역할 수 있습니다.
  rationale: 본문은 섭리가 말하고 이동하며 구원하는 행위자로 나타나는 긴장을 명시적으로 유지합니다.
- issue: ‘몸의 감옥’ 표현
  choice: 원문의 부정적 신체 은유를 그대로 보존했습니다.
  alternative: ‘육체에 갇힌 상태’처럼 완화할 수 있습니다.
  rationale: 본문의 우주론적·인간론적 긴장을 현대적 신체관에 맞추어 약화하지 않았습니다.
- issue: 혼돈 거주자들의 멸망 주체
  choice: ‘혼돈의 기초들이 … 무너져 … 멸하려 했다’로 연결했습니다.
  alternative: 섭리 또는 별도의 주체가 그들을 멸하려 했다고 읽을 수 있습니다.
  rationale: 제공된 증거에서 가장 가까운 문법적 주체는 ‘기초들’이지만 문장 구조가 다소 불안정하므로 해석 가능성을 완전히 닫지 않았습니다.
- issue: ‘처녀 영’의 정체
  choice: ‘처녀 영’이라는 명칭을 유지했습니다.
  alternative: ‘동정녀의 영’ 또는 ‘순결한 영’으로 해석할 수 있습니다.
  rationale: 소유 관계나 윤리적 순결로 확정하지 않고 원문의 칭호적 모호성을 보존했습니다.
- issue: 다섯 인장의 물
  choice: ‘다섯 인장의 물의 빛’이라는 결합을 유지했습니다.
  alternative: ‘다섯 인장이 있는 빛의 물’ 또는 특정 세례 의식으로 풀 수 있습니다.
  rationale: 수식 관계와 의례의 정확한 성격이 불확실하므로 본문을 교리적으로 구체화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 계시자의 자기 선언은 장중하되 지나치게 고어적으로 만들지 않았고, 명령문도 합쇼체로 통일했습니다. 제공 자료가 콥트어 원문 대조 전의 영어 공공 영역 증언이므로, 문법적·어휘적 불확실성이 큰 대목은 각주와 번역 결정에 명시했습니다. 삽입된 사본 쪽수 «31»은 본문 흐름을 위해 제외했고, 영어 증언의 복원 표지 ‹of›에 해당하는 ‘몸의 감옥’은 자연스러운 본문으로 옮겼습니다.
