    6. 나는 세 번째로도 나아갔습니다. 나는 빛 안에 있는 빛이며 섭리의 기억입니다. 나는 어둠 한가운데와 하데스 깊숙한 곳으로 들어가, 그들의 아이온의 완성의 빛으로 내 얼굴을 가득 채웠습니다.[b] 그리고 그들의 감옥 한가운데, 곧 몸의 감옥으로 들어가 말했습니다. “듣는 이는 깊은 잠에서 일어나십시오.” 그러자 그가 울었고 눈물이 흘렀습니다.


