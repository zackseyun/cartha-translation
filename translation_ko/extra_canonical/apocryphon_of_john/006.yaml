    8. 정신은 또한 보이지 않는 영의 말씀을 통하여 무언가를 만들고자 했습니다. 그러자 아직 가능성으로 있던 그의 의지가 현실이 되어 나아왔고, 정신과 빛과 함께 그분을 찬양했습니다.[c]


