  text: 'He also peered into Barbelo with the pure light that surrounds the unseen Spirit, and his spark, and from him she conceived.


    He begot a light-spark by means of a light similar to blessedness, but (the latter) is not equal to his greatness.


    Such was an only-begotten one of the Mother-Father who had issued forth, he being his only offspring, the only-begotten one of the Father, the pure light.


    The unseen, virginal Spirit also rejoiced because of the light who had come into being, who had issued forth from the first power of his Providence—which is Barbelo—


    and he anointed him with his anointing until he became perfect, lacking nothing of the anointing because he had anointed him with the anointing of the unseen Spirit, and he attended him as he poured onto him, and as soon as he had received of the Spirit, he extolled the holy Spirit and the perfect Providence on whose account he had issued forth.


    He also entreated to give him a companion laborer, which is Mind, and he agreed gladly.


    And when the unseen Spirit had agreed, «7» Mind approached, and he attended Christ (the anointed), extolling him and Barbelo, and all of these came to dwell inside silence.


    Mind also willed to make something by means of the Logos of the unseen Spirit, and his (potential) will became actual, and approached with Mind and Light extolling him.


    And the Logos followed Will, because by means of the Logos, Christ, the self-generated God, created the All.'
translation:
  language: ko
  text: '**요한의 비밀서 — 기름부음받은 그리스도**


    1. 그분은 보이지 않는 영을 둘러싼 순수한 빛과 자신의 불꽃으로 바르벨로를 바라보셨고, 바르벨로는 그분에게서 잉태했습니다.


    2. 그분은 복됨과 같은 빛을 통하여 빛의 불꽃을 낳으셨습니다. 그러나 그 빛은 그분의 위대함과 동등하지 않습니다.[a]


    3. 이렇게 어머니-아버지에게서 나온 독생자가 있게 되었습니다. 그는 그분의 유일한 자손이며, 아버지의 독생자요 순수한 빛입니다.


    4. 보이지 않는 동정의 영도 생겨난 그 빛을 두고 기뻐하셨습니다. 그 빛은 그분의 섭리의 첫 능력, 곧 바르벨로에게서 나왔습니다.


    5. 보이지 않는 영은 자신의 기름부음으로 그에게 기름을 부어, 그가 완전해지게 하셨습니다. 그분이 보이지 않는 영의 기름부음으로 그에게 기름을 부으셨으므로, 그에게는 그 기름부음이 조금도 부족하지 않았습니다. 그분은 그에게 기름을 부으시면서 그와 함께하셨습니다. 그는 그 영을 받자마자 거룩한 영과 완전한 섭리를 찬양했습니다. 바로 그 섭리로 말미암아 그가 나왔기 때문입니다.[b]


    6. 그는 또 함께 일할 동료, 곧 정신을 자신에게 주시기를 간청했고, 그분은 기꺼이 동의하셨습니다.


    7. 보이지 않는 영이 동의하시자 정신이 나아와 그리스도, 곧 기름부음받은 이와 함께하며 그와 바르벨로를 찬양했습니다. 이들은 모두 침묵 안에 거하게 되었습니다.


    8. 정신은 또한 보이지 않는 영의 말씀을 통하여 무언가를 만들고자 했습니다. 그러자 아직 가능성으로 있던 그의 의지가 현실이 되어 나아왔고, 정신과 빛과 함께 그분을 찬양했습니다.[c]


    9. 말씀은 의지를 따랐습니다. 스스로 생겨난 하나님이신 그리스도께서 말씀을 통하여 만유를 창조하셨기 때문입니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 빛’이 ‘복됨과 같은 빛’을 가리키는지, ‘빛의 불꽃’을 가리키는지는 문장 구조상 분명하지 않습니다.
    reason: ‘the latter’의 지시 대상이 불확실하여 번역에서 단정하지 않았음을 알립니다.
  - marker: b
    text: 이 문단에는 보이지 않는 영과 기름부음받은 이 사이를 오가는 여러 대명사가 있어, 일부 행위의 주체와 대상이 모호합니다. 번역은 제공된 영어 증언에서 가장 자연스러운 흐름을 따랐습니다.
    reason: 원문 언어 직접 검토가 아직 이루어지지 않은 상태에서 대명사의 해석적 확정을 경계합니다.
  - marker: c
    text: ‘가능성으로 있던 그의 의지’는 아직 실현되지 않은 의지가 실제 존재로 나타났다는 뜻으로 읽은 것입니다. ‘그의’가 누구를 가리키는지는 분명하지 않습니다.
    reason: potential will 및 소유 대명사의 의미상 모호성을 보존합니다.
  - marker: d
    text: 여기서 ‘말씀’, ‘의지’, ‘정신’, ‘빛’은 단순한 성질만이 아니라 인격화된 우주론적 실재를 가리키는 것으로 보입니다.
    reason: 독자가 일반 명사와 고유한 발출 존재의 양면성을 인식하도록 돕습니다.
lexical_decisions:
- source_word: Barbelo
  choice: 바르벨로
  rationale: 고유한 신적 발출 존재의 이름이므로 음역하여 본문의 독특한 우주론적 용법을 보존했습니다.
- source_word: Mother-Father
  choice: 어머니-아버지
  rationale: 양성적·역설적 호칭을 한쪽 성별로 평준화하지 않고 원문의 긴장을 그대로 살렸습니다.
- source_word: Mind
  choice: 정신
  rationale: 인격화된 우주론적 실재를 가리키므로 일관되게 ‘정신’으로 옮겼습니다. 일반적인 사고 능력만을 뜻하는 것으로 축소하지 않도록 문맥에서 고유 호칭처럼 사용했습니다.
- source_word: Logos
  choice: 말씀
  rationale: 창조의 매개로 인격화된 로고스를 나타내며 한국어 종교 문헌에서 널리 이해되는 ‘말씀’을 선택했습니다.
- source_word: Providence
  choice: 섭리
  rationale: 바르벨로와 동일시되는 인격화된 선견·예지의 능력을 가리키는 전승적 용어로 ‘섭리’를 사용했습니다.
- source_word: anointed / anointing
  choice: 기름을 붓다 / 기름부음
  rationale: 그리스도라는 칭호와 직접 이어지는 반복 어휘를 보존했습니다.
- source_word: self-generated God
  choice: 스스로 생겨난 하나님
  rationale: 독립된 신학 체계의 익숙한 표현으로 바꾸지 않고, 해당 문헌의 자기발생적 존재 개념을 직역에 가깝게 드러냈습니다.
- source_word: the All
  choice: 만유
  rationale: 개별 사물만이 아니라 존재 전체를 가리키는 우주론적 총체성을 간결하게 나타냈습니다.
theological_decisions:
- issue: 보이지 않는 영, 바르벨로, 빛 사이의 대명사 지시 대상
  choice: 필요한 곳에서는 명칭을 밝혔지만, 확정할 수 없는 곳에서는 ‘그분/그/그 빛’을 유지했습니다.
  alternative: 모든 대명사를 특정 인물명으로 치환할 수 있습니다.
  rationale: 영어 증언 자체에 지시 대상의 모호함이 있으며 콥트어 직접 검토가 대기 중이므로, 해석으로 모호함을 제거하지 않았습니다.
- issue: ‘그리스도’와 ‘기름부음받은 이’의 관계
  choice: ‘그리스도, 곧 기름부음받은 이’로 병기했습니다.
  alternative: ‘그리스도’만 음역하거나 ‘기름부음받은 이’만 번역할 수 있습니다.
  rationale: 칭호의 의미와 본문의 기름부음 장면 사이의 어휘적 연결을 독자가 볼 수 있게 했습니다.
- issue: 그리스도를 ‘스스로 생겨난 하나님’이라고 부르는 문구
  choice: 수식 관계를 그대로 보존했습니다.
  alternative: ‘스스로 생겨난 신적 존재’처럼 완화할 수 있습니다.
  rationale: 본문의 높은 신적 호칭을 후대 교리 체계에 맞추어 강화하거나 약화하지 않았습니다.
- issue: 바르벨로와 ‘섭리’의 동일시
  choice: ‘그분의 섭리의 첫 능력, 곧 바르벨로’라는 동격 구조를 유지했습니다.
  alternative: 바르벨로를 섭리와 구별되는 존재로 풀어 쓸 수 있습니다.
  rationale: 제공된 증언이 제시하는 동격을 보존하되 그 관계를 더 체계화하지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되 고대 계시문헌에 맞는 절제되고 장중한 문체를 유지했습니다. 현재 초안은 제공된 공개 영역 영어 증언을 토대로 한 잠정 번역이며, 콥트어 사본에 대한 직접 대조가 필요합니다. 영어 증언에 끼어 있던 사본 쪽수 표지 ‘«7»’은 본문에서 제외했습니다.
