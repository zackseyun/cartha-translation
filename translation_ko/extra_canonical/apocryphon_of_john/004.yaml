  source_fidelity: 제공된 콥트어 직접 대조는 보류되어 있으므로 공개 영역 영어 증언을 기준으로 검토했습니다. 초안은 전반적인 내용과 인과 관계를 잘 보존하지만, 1절의 대괄호 복원 범위와 ‘그에게서 [나온] 이’의 표현을 더 충실히 드러낼 필요가 있습니다. 또한 영어 증언의 여성 대명사는 특정한 인간 여성이라는 뜻이 아니므로 ‘이 여자’보다 ‘그녀’가 안전합니다.
  naturalness: 합쇼체와 문체는 대체로 자연스럽습니다. 다만 ‘이 여자’는 고대의 인격화된 실재를 불필요하게 인간 여성으로 한정하며, 2절의 ‘뜻’은 desire의 의미를 다소 약화합니다. 이를 ‘바람’ 및 ‘그녀’로 조정해 자연성과 의미 폭을 함께 보존했습니다.
  terminology: ‘아이온’, ‘바르벨로’, ‘섭리’, ‘처녀 영’, ‘만물’은 이 잠정 영어 증언의 전문어 및 모호성을 대체로 적절히 보존합니다. ‘첫 능력’과 ‘첫 생각’도 유지했습니다. 사본 쪽수 «5»는 영어 POB 감사 기록에 따라 본문에서 제외하며, 이를 설명하는 비본문 각주는 필요하지 않습니다.
  issues:
  - severity: medium
    issue: 1절에서 영어 증언의 대괄호 복원 범위가 축소되어 있습니다.
    rationale: '[we do], [understand unspeakable things, and we], [from], [the] 등의 복원이 한국어 본문에서는 일부 합쳐지거나 빠졌습니다. 손상 및 편집 복원의 표지를 보존한다는 번역 원칙에 따라 가능한 범위에서 이를 되살겨야 합니다.'
  - severity: medium
    issue: 반복되는 she를 ‘이 여자’로 옮겼습니다.
