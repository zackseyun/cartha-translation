translation:
  language: ko
  text: '1. 이는 [우리가 말로 표현할 수 없는 것들을] 이해하지 [못하며], [헤아릴 수 없는 것]도 이해하지 못하기 때문입니다. 다만 그분에게서 나온 이, 곧 [그] 아버지만은 예외입니다. 그가 [홀로] 그것을 우리에게 [설명해] 주었기 때문입니다. 그는 자신을 둘러싼 빛, 곧 생명수의 샘 안에서 자기[자신]을 살펴보는 이이며, [모든 아이온]에게 공급하는 이입니다. 또한 그는 [영]의 샘을 응시하며 모든 방향에서 동시에 자기 형상을 [바라봅니다].


    2. 그는 자신을 둘러싼 [순수한 빛]-물의 샘에 [거하는] 자기 [물]-빛 안에 자신의 뜻을 두는 이입니다. 그러자 [그의 잠재된 생각이] 실제가 되었고, 그 여자가 가까이 나아왔습니다. [곧] 그의 빛의 [광채] 안에서 그 앞에 [나타났던] 여자입니다.


    3. 이 여자는 만물보다 먼저 [존재했고] 그의 마음에서 [나온] 첫 [능력]입니다.


    4. 이 여자는 [만물의 섭리]입니다. 그의 빛처럼 [빛나는] 빛을 지닌 [완전한] 능력이며, 완전하고 보이지 않는 처녀 영의 형상입니다.


    5. [첫 능력]은 바르벨로의 영광, 아이온들 안에 있는 완전한 영광, 곧 계시의 영광입니다.[a]


    6. 이 여자는 처녀 영을 높이고 그를 찬양했습니다. 그로 말미암아 자신이 나왔기 때문입니다.


    7. 이 여자가 첫 생각이며, 그의 형상입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 판본에 보이는 «5»는 본문의 말이 아니라 사본의 쪽수를 나타내는 표지로 보아 번역문에서 제외했습니다.
    reason: 문장 사이에 끼어든 사본 쪽수 표지가 본문 내용으로 오해되는 것을 막기 위함입니다.
lexical_decisions:
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌의 우주론적 존재 또는 영역을 가리키는 전문 용어의 폭을 보존하기 위해 음역했습니다. ‘영겁’이나 ‘시대’로 번역하면 이 문맥의 존재론적 의미를 지나치게 좁힐 수 있습니다.
- source_word: Providence
  choice: 섭리
  rationale: 인격화된 여성적 실재를 가리키는 문맥을 유지하면서도 한국어 종교 문헌에서 이해 가능한 용어를 선택했습니다.
- source_word: Barbelo
  choice: 바르벨로
  rationale: 고유명사이므로 통용 가능한 한국어 음역으로 옮겼습니다.
- source_word: virginal Spirit
  choice: 처녀 영
  rationale: 원문의 성별·순결 표상을 해석으로 약화하지 않고 직역에 가깝게 보존했습니다.
- source_word: thought
  choice: 생각
  rationale: ‘사유’나 특정 신학적 위격 명칭으로 고정하지 않고, 원문의 기본 의미와 문맥상 인격화의 긴장을 함께 남겼습니다.
- source_word: the All
  choice: 만물
  rationale: 우주 전체 또는 존재하는 모든 것을 가리키는 표현으로 자연스러운 한국어를 택했으나, 특정 체계의 전문어로 과도하게 규정하지 않았습니다.
theological_decisions:
- issue: 1절의 ‘그분에게서 나온 이’와 ‘아버지’의 동일성
  choice: ‘그분에게서 나온 이, 곧 [그] 아버지’로 병치했습니다.
  alternative: ‘그에게서 나온 자 외에는… 즉 아버지 외에는’처럼 별개의 예외 대상을 암시할 수 있습니다.
  rationale: 제공된 증거의 통사적 모호성을 가능한 한 보존하고, 관계를 별도로 교리화하지 않았습니다.
- issue: 바르벨로의 여성적 인격성
  choice: 반복되는 she를 ‘이 여자’로 명시했습니다.
  alternative: ‘그것’ 또는 주어 생략으로 비인격화할 수 있습니다.
  rationale: 영어 증언이 드러내는 여성 대명사와 인격적 행위를 한국어에서도 식별 가능하게 유지했습니다.
- issue: ‘그의 생각이 실제가 됨’의 존재론적 성격
  choice: ‘[그의 잠재된 생각이] 실제가 되었고’로 옮겼습니다.
  alternative: ‘생각이 실체가 되었다’ 또는 ‘현현했다’로 번역할 수 있습니다.
  rationale: ‘실체’나 ‘현현’은 특정 형이상학을 더 강하게 부과할 수 있으므로, 잠재성에서 현실성으로의 전환만 표현했습니다.
- issue: ‘on account of him’의 인과 의미
  choice: ‘그로 말미암아 자신이 나왔기 때문’으로 번역했습니다.
  alternative: ‘그를 위하여 나왔기 때문’으로 목적 의미를 취할 수 있습니다.
  rationale: 제공된 영어 증언의 원인·근거 의미를 우선하되, 발생 방식에 관한 추가 설명은 넣지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 사본 손상이나 편집자 복원을 나타내는 대괄호는 모두 유지했습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로, 제공된 공개 영역 영어 증언에 근거한 잠정 번역입니다. 긴 1절은 가독성을 위해 문장을 나누되 논리 관계는 보존했습니다.
