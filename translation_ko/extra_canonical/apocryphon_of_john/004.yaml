  revised_text: '1. 이는 [우리가] [말로 표현할 수 없는 것들을 이해하지 못하고, 우리가] [헤아릴 수 없는 것]을 이해하지 못하기 때문입니다. 그에게서 [나온] 이, 곧 [그] 아버지 외에는 그러하지 않습니다. 그분이 [홀로] 그것을 우리에게 [설명해] 주셨기 때문입니다. 그분은 자신을 둘러싼 자신의 빛, 곧 생명수[의] 샘 안에서 자기 자신을 살펴보시는 분이며, [모든 아이온]에게 공급하시는 분입니다. 또한 그분은 [영]의 샘을 응시하여 모든 방향에서 (동시에) 자신의 형상을 [바라보십니다].


