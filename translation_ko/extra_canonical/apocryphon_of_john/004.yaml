    3. 그녀는 만물보다 먼저 [존재했고] 그의 마음에서 [나온] 첫 [능력]입니다.


    4. 그녀는 [만물의 섭리]입니다. 그녀의 빛은 그의 빛처럼 [빛나며], 그녀는 완전하고 보이지 않는 처녀 영의 형상인 [완전한] 능력입니다.


    5. [첫 능력]은 바르벨로의 영광, 아이온들 안에 있는 완전한 영광, 곧 계시의 영광입니다.


