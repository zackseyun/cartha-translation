translation:
  language: ko
  text: '“나는 그대가 듣는 가운데 그대를 위하여 모든 것을 다 말했습니다. 내가 그대에게 이 모든 것을 말한 것은, 그대가 이것을 기록하여 그대와 함께하는 영들에게 은밀히 전하게 하려는 것입니다. 이것이 흔들리지 않는 종족의 신비이기 때문입니다.”[a]


    구원자께서는 또한 이 말씀들을 그에게 맡기시어 기록하고 깊이 간직하게 하셨습니다. 그리고 그에게 말씀하셨습니다. “음식이나 마실 것이나 옷이나 그 밖에 이와 비슷한 어떤 것을 대가로 받고 이 말씀들을 넘기는 사람은 누구든지 저주를 받을 것입니다.”[b]


    이 말씀들은 신비 가운데 그에게 맡겨졌습니다. 그러고 나서 구원자께서는 갑자기 그의 앞에서 사라지셨습니다. 그는 동료 제자들에게 가서 구원자께서 자기에게 하신 말씀을 알려 주었습니다.


    예수 그리스도. 아멘.


    요한에 따른 비밀의 기록'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘흔들리지 않는 종족’은 이 문헌에 나오는 특징적인 명칭입니다. ‘움직이지 않는 종족’ 또는 ‘확고한 종족’으로도 이해할 수 있습니다.
    reason: 기술적 표현의 직역 가능성과 의미 범위를 독자에게 알립니다.
  - marker: b
    text: 여기서 ‘대가’는 음식, 마실 것, 옷 등 말씀과 맞바꾸어 받는 물품을 가리킵니다.
    reason: ‘gift’가 단순한 호의의 선물이 아니라 거래의 보상이라는 문맥을 분명히 합니다.
lexical_decisions:
- source_word: companion spirits
  choice: 그대와 함께하는 영들
  rationale: ‘동료 영들’보다 자연스러우면서도, 이들이 사람인지 영적 존재인지에 관한 원문 증언의 낯선 표현과 모호성을 보존했습니다.
- source_word: unmoving race
  choice: 흔들리지 않는 종족
  rationale: ‘움직이지 않는’이라는 공간적 의미로만 좁히지 않고 확고함·불변성의 함의를 살리되, 문헌의 기술적 집단 명칭인 ‘종족’을 유지했습니다.
- source_word: keep them locked away
  choice: 깊이 간직하게
  rationale: 물리적으로 자물쇠를 채운다는 뜻과 비밀로 보존한다는 뜻을 함께 포괄하도록 자연스러운 한국어로 옮겼습니다.
- source_word: trade ... for a gift
  choice: 대가로 받고 … 넘기는
  rationale: ‘선물’이라는 말이 무상 증여로 오해될 수 있어, 음식·음료·의복 등을 보상으로 받아 말씀을 거래한다는 의미를 분명히 했습니다.
- source_word: in a mystery
  choice: 신비 가운데
  rationale: 비밀리에 전달되었다는 뜻과 신비적 방식으로 위탁되었다는 뜻 가운데 하나를 단정하지 않고 어구의 모호성을 유지했습니다.
- source_word: The Secret Writing According to John
  choice: 요한에 따른 비밀의 기록
  rationale: ‘Apocryphon’을 후대의 정경적 평가가 담길 수 있는 ‘외경’으로 옮기지 않고, 작품 표제가 나타내는 비밀 문서의 성격을 직접 표현했습니다.
theological_decisions:
- issue: ‘unmoving race’의 정체와 성격
  choice: 흔들리지 않는 종족
  alternative: 부동의 세대 / 확고한 족속
  rationale: 특정 교파적 해석이나 구원론적 정의를 덧붙이지 않고 이 문헌 특유의 집단 명칭과 신학적 긴장을 보존했습니다.
- issue: ‘companion spirits’가 가리키는 대상
  choice: 그대와 함께하는 영들
  alternative: 동료 영들 / 영적 동료들
  rationale: 제자들을 뜻하는지 영적 존재들을 뜻하는지 명시적으로 해소하지 않았습니다.
- issue: 말씀을 대가로 넘기는 자에 대한 선언
  choice: 저주를 받을 것입니다
  alternative: 저주받을지어다
  rationale: 원문의 저주 선언을 약화하지 않으면서도 현대 합쇼체 문장으로 제시했습니다.
translation_notes:
  register: 현대 표준어의 격식 있고 이해하기 쉬운 합쇼체를 사용했습니다. 구원자의 직접 발화와 서술을 구분했으며, 결구와 작품 표제는 원문의 간결한 형식을 유지했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언을 토대로 한 잠정 번역입니다.
