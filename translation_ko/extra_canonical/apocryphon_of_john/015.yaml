  revised_text: '1. 그들이 아래를 내려다보았을 때, 그의 지성이 자기들의 지성보다 뛰어나다는 것을 깨달았습니다. 그래서 그들은 통치자들의 무리와 모든 천사와 함께 모여 의논했습니다.


    2. 그들은 불과 흙과 물을 가져다가 불타는 네 바람과 함께 서로 섞었습니다. 그것들을 한데 치대며 큰 소란을 일으킨 뒤, 그를 죽음의 그늘 속으로 끌고 갔습니다. 이는 흙과 물과 불과 바람으로, 그 기원이 물질에 있는 이를 다시 빚으려는 것이었습니다. 물질이란 곧 어둠의 무지와 욕망과 그들의 거짓 영입니다.[a]


    3. 이것이 강도들이 그 사람에게 입힌 몸의 형상을 위한 무덤, 곧 망각의 사슬입니다. 그리하여 그는 죽을 수밖에 없는 사람이 되었습니다.


    4. 이 사람이 처음으로 내려온 자요 첫 번째 갈라짐입니다. 그러나 그의 안에 거하던 ‘빛의 사유’가 그의 지성을 일깨웠습니다.


    5. 그 뒤 통치자들은 그를 데려다가 낙원에 두고 그에게 “먹어라” 하고 말했습니다. 이는 “게으름 속에서”라는 뜻입니다. 그들의 즐거움은 참으로 쓰고, 그들의 아름다움은 타락했기 때문입니다. 그들의 즐거움은 속임수이고, 그들의 나무들은 불경함이며, 그 열매는 고칠 수 없는 독이고, 그들이 약속하는 것은 죽음입니다.


    6. 그러나 그들은 자기들의 생명나무를 낙원 한가운데에 두었습니다. 이제 내가 여러분 모두에게 그들의 생명의 신비를 가르쳐 주겠습니다. 그것은 그들이 함께 꾸민 음모이며, 그들 영의 형상입니다.


    7. 그 뿌리는 쓰고 그 가지들은 죽음이며, 그 그늘은 증오입니다. 그 잎들 안에는 속임수가 깃들어 있고, 그 꽃은 악한 기름부음이며, 그 열매는 죽음입니다. 욕망이 그 씨이고, 그것은 어둠 속에서 싹을 틔웁니다.


    8. 그것을 맛보는 자들의 거처는 하데스이며, 어둠이 그들의 안식처입니다.


    9. 그러나 그가 자기의 완전함을 향해 올려다보지도 못하고 자기 벌거벗음의 수치도 깨닫지 못하게 하려고, 그들은 이른바 ‘선과 악을 아는 나무’ 앞에 머물러 있었습니다. 그들은 곧 ‘빛의 사유’였습니다.[b] 그러나 그들로 하여금 먹게 한 이는 바로 나였습니다.”


    10. 나도 구원자께 여쭈었습니다. “주님, 아담에게 먹으라고 가르친 것은 뱀이 아니었습니까?”


    11. 구원자께서는 빙그레 웃으며 말씀하셨습니다. “뱀은 그를 이용하려고 그들에게 성적 욕망과 멸망의 악을 먹으라고 가르쳤습니다.


    12. 또 그[c]는, 그 안에 거하는 ‘빛의 사유’ 때문에 그가 자기에게 불순종한다는 것을 알고 있었습니다. 그 ‘빛의 사유’는 그의 지성을 우두머리 통치자의 지성보다 더 정확하게 만들었습니다. 그[c]는 자기가 그에게 주었던 능력을 도로 빼내고 싶어 그에게 ‘혼미한 상태’가 닥치게 했습니다.”


    13. 나는 다시 구원자께 여쭈었습니다. “그 ‘혼미한 상태’란 무엇입니까?”


    14. 그분이 말씀하셨습니다. “그것은 모세가 기록한 것도 아니고, 네가 들은 것도 아닙니다. 모세가 첫 번째 책에서 ‘그분이 그를 잠들게 하셨다’라고 말했지만, 실상은 그의 지각을 잠들게 했습니다. 참으로 그분은 예언자를 통하여 이렇게 말씀하셨습니다. ‘내가 그들의 마음을 둔하게 하여, 그들이 주의를 기울이지도 못하고 보지도 못하게 하겠다.’”


