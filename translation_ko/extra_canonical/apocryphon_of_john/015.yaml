    [b] 이 문장의 구문과 ‘그들’이 가리키는 대상은 전승된 문헌 증거에서 불분명합니다. ‘빛의 사유’를 나무와 동일시하지 않고, 원문의 난해한 동격 구문을 보존했습니다.


