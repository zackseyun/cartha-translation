translation:
  language: ko
  text: '1. 그들이 아래를 내려다보았을 때, 그의 지성이 자기들의 지성보다 뛰어나다는 것을 깨달았습니다. 그래서 그들은 통치자들의 무리와 모든 천사와 함께 모여 의논했습니다.


    2. 그들은 불과 흙과 물을 가져다가 불타는 네 바람과 함께 서로 섞었습니다. 그것들을 한데 치대며 큰 소란을 일으킨 뒤, 그를 죽음의 그늘 속으로 끌고 갔습니다. 이는 흙과 물과 불과 바람으로 그를 다시 빚으려는 것이었습니다. 그것의 기원은 물질에 있으니, 곧 어둠의 무지와 욕망과 그들의 거짓 영입니다.[a]


    3. 이것이 강도들이 그 사람에게 입힌 몸의 형상을 위한 무덤이며, 망각의 사슬입니다. 그리하여 그는 죽을 수밖에 없는 사람이 되었습니다.


    4. 이 사람이 처음으로 내려온 자요 첫 번째 갈라짐입니다. 그러나 그의 안에 거하던 ‘빛의 사유’가 그의 지성을 일깨웠습니다.


    5. 그 뒤 통치자들은 그를 데려다가 낙원에 두고 그에게 “먹어라” 하고 말했습니다. 이는 “게으름 속에서”라는 뜻입니다. 그들의 즐거움은 참으로 쓰고, 그들의 아름다움은 타락했기 때문입니다. 그들의 즐거움은 속임수이고, 그들의 나무들은 불경함이며, 그 열매는 고칠 수 없는 독이고, 그들이 약속하는 것은 죽음입니다.


    6. 그러나 그들은 자기들의 생명나무를 낙원 한가운데에 두었습니다. 이제 내가 여러분 모두에게 그들의 생명의 신비를 가르쳐 주겠습니다. 그것은 그들이 함께 꾸민 음모이며, 그들 영의 형상입니다.


    7. 그 뿌리는 쓰고 그 가지들은 죽음이며, 그 그늘은 증오입니다. 그 잎들 안에는 속임수가 깃들어 있고, 그 꽃은 악한 기름부음이며, 그 열매는 죽음입니다. 욕망이 그 씨이고, 그것은 어둠 속에서 싹을 틔웁니다.


    8. 그것을 맛보는 자들의 거처는 하데스이며, 어둠이 그들의 안식처입니다.


    9. 그러나 그가 자기의 완전함을 향해 올려다보지도 못하고 자기 벌거벗음의 수치도 깨닫지 못하게 하려고, 그들은 이른바 ‘선과 악을 아는 나무’ 앞에 머물렀는데, 그것이 곧 ‘빛의 사유’였습니다.[b] 그러나 그들로 하여금 먹게 한 이는 바로 나였습니다.”


    10. 나도 구원자께 여쭈었습니다. “주님, 아담에게 먹으라고 가르친 것은 뱀이 아니었습니까?”


    11. 구원자께서는 빙그레 웃으며 말씀하셨습니다. “뱀은 그를 이용하려고 그들에게 성적 욕망과 멸망의 악을 먹으라고 가르쳤습니다.


    12. 또 그[c]는, 아담 안에 거하는 ‘빛의 사유’ 때문에 그가 자기에게 불순종한다는 것을 알고 있었습니다. 그 ‘빛의 사유’는 아담의 지성을 우두머리 통치자의 지성보다 더 정확하게 만들었습니다. 그[c]는 자기가 아담에게 주었던 능력을 도로 빼내고 싶어 아담에게 ‘혼미한 상태’가 닥치게 했습니다.”


    13. 나는 다시 구원자께 여쭈었습니다. “그 ‘혼미한 상태’란 무엇입니까?”


    14. 그분이 말씀하셨습니다. “그것은 모세가 기록한 것과도 다르고, 네가 들은 것과도 다릅니다. 모세가 첫 번째 책에서 ‘그분이 그를 잠들게 하셨다’라고 말했지만, 실상은 그의 지각을 잠들게 했습니다. 참으로 그분은 예언자를 통하여 이렇게 말씀하셨습니다. ‘내가 그들의 마음을 둔하게 하여, 그들이 주의를 기울이지도 못하고 보지도 못하게 하겠다.’”


    [a] ‘그것’이 정확히 무엇을 가리키는지 불분명합니다. 물질로 빚은 형상 또는 바로 앞에 열거된 요소를 가리킬 수 있습니다.


    [b] 이 문장의 구문과 ‘그들’이 가리키는 대상은 전승된 문헌 증거에서 불분명합니다. 따라서 ‘빛의 사유’와 나무의 관계도 단정하지 않았습니다.


    [c] 이 절의 여러 남성 대명사가 가리키는 대상은 불분명합니다. 문맥상 우두머리 통치자를 가리킬 가능성이 있지만, 본문에서는 그 모호성을 유지했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것’이 정확히 무엇을 가리키는지 불분명합니다. 물질로 빚은 형상 또는 바로 앞에 열거된 요소를 가리킬 수 있습니다.
    reason: 2절 관계절의 선행사가 모호합니다.
  - marker: b
    text: 이 문장의 구문과 ‘그들’이 가리키는 대상은 전승된 문헌 증거에서 불분명합니다. 따라서 ‘빛의 사유’와 나무의 관계도 단정하지 않았습니다.
    reason: 9절의 비정상적인 구문과 인물 관계를 특정 해석으로 해소하지 않기 위해서입니다.
  - marker: c
    text: 이 절의 여러 남성 대명사가 가리키는 대상은 불분명합니다. 문맥상 우두머리 통치자를 가리킬 가능성이 있지만, 본문에서는 그 모호성을 유지했습니다.
    reason: 12절의 대명사 선행사가 확정되지 않습니다.
lexical_decisions:
- source_word: archons
  choice: 통치자들
  rationale: 고대 우주론적 지배자들을 가리키는 용어의 통치 의미를 살리면서도 현대 독자가 이해할 수 있게 옮겼습니다.
- source_word: Reflection of Light
  choice: 빛의 사유
  rationale: 인격화된 정신적 작용이라는 성격을 보존하면서 ‘reflection’을 단순한 빛의 반사로 오해하지 않도록 했습니다.
- source_word: intellect
  choice: 지성
  rationale: 인물 안의 인식 능력과 통찰을 일관되게 나타내며, 뒤의 ‘지각’과 구별했습니다.
- source_word: trance
  choice: 혼미한 상태
  rationale: 단순한 자연 수면이 아니라 지각이 무뎌진 상태라는 이어지는 설명을 반영하되, 특정 신비 체험으로 단정하지 않았습니다.
- source_word: Hades
  choice: 하데스
  rationale: 후대의 특정 지옥 개념으로 좁히지 않고 본문의 고대 사후 세계 명칭을 보존했습니다.
- source_word: evil anointing
  choice: 악한 기름부음
  rationale: 의례적·상징적 함의를 해석으로 풀어 없애지 않고 원문의 긴장을 유지했습니다.
theological_decisions:
- issue: ‘선과 악을 아는 나무’와 ‘빛의 사유’의 관계
  choice: 동일성을 시사하는 문장 형태를 유지하되 각주로 구문상의 불확실성을 밝혔습니다.
  alternative: 빛의 사유가 나무 앞에 있었다고 명시하는 번역
  rationale: 제공된 증거의 문장 구조가 불안정하므로 특정 우주론적 해석으로 확정하지 않았습니다.
- issue: 뱀의 역할과 화자의 역할
  choice: 뱀은 성적 욕망과 멸망을 가르치고, 화자는 ‘그들로 하여금 먹게 한’ 존재로 각각 진술했습니다.
  alternative: 둘의 역할을 조화시키거나 같은 사건으로 통합하는 번역
  rationale: 본문 자체가 제시하는 긴장과 서로 다른 목적을 그대로 보존했습니다.
- issue: 아담에게 혼미한 상태를 내린 주체
  choice: 대명사를 ‘그’로 유지하고 각주에서 우두머리 통치자일 가능성만 언급했습니다.
  alternative: ‘우두머리 통치자’로 명시
  rationale: 제공된 문헌 증거만으로는 대명사의 선행사를 확정하기 어렵습니다.
- issue: 모세의 기록에 대한 재해석
  choice: 몸 전체의 수면과 지각의 수면을 대조하는 본문의 주장을 직접 보존했습니다.
  alternative: ‘잠’이 비유적이었다고 평이하게 의역
  rationale: 본문이 정경 전승과 벌이는 해석적 논쟁을 약화하지 않기 위해서입니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 읽기 쉽게 다듬되, 원문의 반복과 낯선 우주론적 표현, 대명사와 구문의 실제 모호성은 보존했습니다. 현재 초안은 제공된 공개 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 직접 대조가 남아 있습니다.
