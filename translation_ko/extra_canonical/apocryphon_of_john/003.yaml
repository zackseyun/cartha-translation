translation:
  language: ko
  text: '1. [나도 그것을] 이해하려고 물었고, [그가] 나에게 말했습니다. “모나드[a]는 [그보다 높은 것이 아무것도 없는 하나]입니다.


    2. [이는 하나님으로, 또 만유의 아버지로 존재하는], [보이지 않는] 분입니다. 그는 [만유보다 높으며, 불멸성으로 존재하는] 분이고, 어떤 [눈도] 바라볼 수 없는 순수한 빛입니다.


    3. 그는 [보이지 않는 영]입니다. 그를 어떤 신이나 그와 비슷한 무엇으로 [생각하는 것]은 합당하지 않습니다. 그는 신보다 더 크기 때문입니다. 그보다 높은 것은 아무것도 없고, 아무도 그를 다스리지 않기 때문입니다.


    4. [이는 그가] 자신보다 낮은 어떤 것 안에 [존재하지 않기 때문입니다. 모든 것이] 그 안에 존재합니다. 그는 스스로 [서게 된] 분이기 때문입니다.


    5. [그는 영원합니다.] 그에게는 [아무것도] 필요하지 않습니다. [그는] 완전한 온전함이기 때문입니다.


    6. [그에게는 부족한 것이 없으므로], 그것으로 말미암아 온전해질 필요가 [없습니다].


    7. [오히려] 그는 [빛] 가운데서 영원히 완전히 온전합니다.


    8. 그는 [한이 없습니다.] 그보다 [앞서 존재하여] 그에게 한계를 정할 자가 아무도 없기 때문입니다.


    9. 그는 헤아릴 수 없습니다. 그보다 앞서 존재하여 그를 [헤아릴] 자가 [아무도] 없기 때문입니다.


    10. [그는] 측량을 초월합니다. 그보다 [앞서 존재하여 그를 측량할] 자가 아무도 없기 때문입니다.


    11. [그는 보이지 않습니다. 아무도] 그를 본 적이 [없기] 때문입니다.


    12. [그는 영원합니다.] 그가 영원히 [존재하기] 때문입니다.


    13. 그는 [말로 표현할 수 없습니다. 그를] 말로 나타내기 위해 그를 생각해 낼 수 있는 자가 아무도 존재하지 [않았기] 때문입니다.


    14. 그는 이름 붙일 수 없는 분입니다. [그보다 앞서 존재하여] 그에게 이름을 붙일 자가 아무도 없었기 때문입니다.


    15. 그는 [측량할 수 없는 빛]이며, 순수하고 거룩하고 [티가 없습니다].


    16. 그는 말로 표현할 수 없으며, [완전한] 불멸성 가운데 [존재합니다].


    17. (그는) [온전함 안에 (갇혀) 있지]도 않고, 복됨 안에도 신성 안에도 있지 않으며, (그 모든 것 위로) 지극히 높습니다.


    18. 그는 육체적인 분도 [아니고] 비육체적인 분도 아닙니다.


    19. 그는 크지도 [않고] 작지도 않습니다.


    20. 그에게 양이 있다거나 [질이 있다고] 말하는 것은 [불가능합니다.] 아무도 그를 [이해할] 수 없기 때문입니다.


    21. 그는 [존재하는 것들 가운데 하나가 아니라, 지극히 높은 분입니다.] [다른 것보다 더 높은 듯이] [높은 것이 아니라], (그 자신 안에서 높습니다).


    22. 그는 아이온들[a]에도 시간성에도 [참여하지] 않습니다. 이전에 세워진 [아이온]에 참여하는 자는 [...].


    23. 그에게 시간의 척도가 배정되지 [않지 않았습니다.][b] 그는 다른 이에게서 아무것도 얻지 않기 때문입니다. [그렇게 얻는다면] 빌려 받는 셈이기 때문입니다. 다른 이보다 먼저 존재하는 분은 [다른 이에게서] 무엇을 받을 [필요가 없습니다].


    24. 이는 그가 [자신의] 빛 안에서 기다리며 자신을 바라보는 분이기 때문입니다. [...]은 영광스럽습니다.


    25. 측량할 수 없는 순수함이 그에게 속합니다.


    26. 그는 아이온들을 베푸는 아이온입니다.


    27. 그는 생명을 베푸는 [생명]입니다.


    28. 그는 복됨을 베푸는 복된 분입니다.


    29. 그는 지식을 베푸는 지식입니다.


    30. [그는] 선함을 베푸는 선함입니다.


    31. [그는] 자비를 베푸는 자비와 구원입니다.


    32. 그는 은혜를 베푸는 은혜입니다.


    33. 그것이 그에게 속하기 [때문이 아니라], 그가 측량할 수도 이해할 수도 없는 [빛]을 베풀기 때문입니다.


    34. [내가 어떻게] 그분에 관해 당신에게 [말할 수 있겠습니까?] 그의 [아이온]은 멸망을 초월하고, 안식 가운데 있으며, [침묵 속에 머물러 쉬고] 있습니다. 그는 [만물보다 앞서] 존재합니다. [그가 모든] 아이온의 우두머리이며, 자신의 선함으로 그들에게 힘을 주는 분이기 때문입니다.”


    [a] ‘모나드’와 ‘아이온’은 이 문헌의 고유한 사상적 용어이므로 음역했습니다. ‘모나드’는 궁극적인 하나를, ‘아이온’은 영원한 영역·시대 또는 초월적 존재를 가리킬 수 있습니다.


    [b] 현존 본문의 이중 부정을 그대로 살렸습니다. 문맥상 “그에게 시간의 척도가 배정되지 않았습니다”라는 뜻일 가능성이 있으나, 본문 자체는 불확실합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모나드’와 ‘아이온’은 이 문헌의 고유한 사상적 용어이므로 음역했습니다. ‘모나드’는 궁극적인 하나를, ‘아이온’은 영원한 영역·시대 또는 초월적 존재를 가리킬 수 있습니다.
    reason: 다의적인 전문 용어를 특정 교리적 의미로 고정하지 않기 위해서입니다.
  - marker: b
    text: 현존 본문의 이중 부정을 그대로 살렸습니다. 문맥상 “그에게 시간의 척도가 배정되지 않았습니다”라는 뜻일 가능성이 있으나, 본문 자체는 불확실합니다.
    reason: 전승상의 난점과 의미의 불확실성을 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: monad
  choice: 모나드
  rationale: ‘단자’나 ‘유일자’로 번역하면 후대 철학 또는 특정 해석을 불필요하게 불러올 수 있어, 음역하고 문맥적 의미를 각주로 밝혔습니다.
- source_word: All
  choice: 만유
  rationale: 우주적 총체를 가리키는 명칭의 성격을 살리면서 현대 한국어 종교 문체에서 이해 가능한 표현을 택했습니다.
- source_word: aeon
  choice: 아이온
  rationale: 문맥에 따라 영원, 시대, 초월적 영역 또는 존재를 가리킬 수 있으므로 하나의 뜻으로 고정하지 않고 음역했습니다.
- source_word: indestructibility
  choice: 불멸
  rationale: 단순한 물리적 ‘파괴 불가능성’보다 본문의 초월적·영속적 상태를 자연스럽게 전달하되, 34절의 동사적 표현은 ‘멸망을 초월하다’로 구별했습니다.
- source_word: somatic / non-somatic
  choice: 육체적인 / 비육체적인
  rationale: 상반되는 두 범주를 모두 부정하는 역설적 진술을 대칭적으로 보존했습니다.
- source_word: repose
  choice: 안식
  rationale: 정지와 평온을 함께 함축하며 본문의 장엄한 종교적 문체에 맞는 표현입니다.
theological_decisions:
- issue: ‘신보다 더 크다’는 초월성 진술
  choice: ‘그는 신보다 더 큽니다’를 보존
  alternative: ‘그는 하나님 이상의 분입니다’
  rationale: 본문이 일반명사적 ‘a god’와 궁극자를 대조하는 긴장을 교리적으로 평준화하지 않았습니다.
- issue: 육체적이지도 비육체적이지도 않다는 부정신학
  choice: 두 부정을 그대로 유지
  alternative: ‘형체를 초월합니다’로 의역
  rationale: 원문의 역설과 범주 부정을 해소하지 않기 위해 명시적 대구를 보존했습니다.
- issue: 23절의 이중 부정
  choice: ‘배정되지 않지 않았습니다’로 보존하고 각주 처리
  alternative: 문맥에 따라 ‘배정되지 않았습니다’로 교정
  rationale: 전승 본문의 난점을 조용히 수정하지 않고 독자가 불확실성을 알 수 있게 했습니다.
- issue: 은혜와 빛이 ‘그에게 속하지 않기 때문에’ 베풀어진다는 33절
  choice: 문법적 긴장을 그대로 보존
  alternative: ‘그가 그것을 소유하기 때문만이 아니라’로 완화
  rationale: 신학적 난점을 해석으로 해결하지 않고 현존 증거의 표현을 유지했습니다.
