  text: '1. I asked, however, “Lord, where did the vile spirit come from?”


    2. He said to me, “The Mother-Father, who abounds in mercy, the holy Spirit in every form, the one who is merciful and «28» who shows compassion for all of you—that is, the Reflection of Radiant Providence—raised up the seed of the perfect race, its intellect, and the eternal light of the Man.


    3. When the chief archon realized that they were higher than he was in the height and surpassed him in intellect, he wanted to grasp their objective. He did not know that they surpassed him in intellect and that he would be unable to grasp them.


    4. He devised a plot with his authorities, who are his powers, and together they committed adultery with Sophia. Bitter Destiny was begotten by them, the final, unstable fetter. It is of a wavering kind, yet it is more durable and stronger than she with whom the gods joined in adultery, and the angels, and the demons, and all the generations down to the present day. For from that Destiny came all transgression, injustice, blasphemy, the fetter of oblivion and ignorance, every harsh command with grievous transgressions, and overwhelming fears.


    5. In this way all creation was also blinded so that they would not know the God who is over them all. Because of the fetter of oblivion, their sins were hidden, for they are bound by measurements, times, and moments, since it is the universal overlord.


    6. Then he regretted everything that had happened because of him.


    7. This time he conspired to bring a flood «29» upon the products of humanity, but the greatness of radiant Providence informed Noah. Noah preached to all the seed of the children of humanity, but those who were strangers to him did not listen to him.


    8. It was not as Moses said, ‘They hid themselves in an ark.’ Instead, they hid themselves in a place—not only Noah, but also many other people from the unmoving race.


    9. They entered a place and hid themselves within a radiant cloud. He was aware of his authority, and she who belongs to the light accompanied him.


    10. She had shone upon them because he had caused darkness to cover the whole earth, and he devised a plot together with his powers.


    11. He sent his angels to the daughters of men to take some for themselves and to raise up offspring for their pleasure, but at first they were unsuccessful.


    12. When they did not succeed, they gathered again and devised a plot together.


    13. They created a vile spirit resembling the Spirit who had descended, so that through it they might defile souls. The angels transformed their appearance into the appearance of their mates, making them full of the spirit of darkness, which they had mixed together with evil for them.


    14. They presented gold and silver, and gifts of copper and iron, and objects made from every kind of metal. By leading the people who followed them «30» astray with a multitude of tricks, they brought them into great troubles.


    15. They grew old without enjoying any pleasures.


    16. Without discovering the truth and without knowledge of the true God, they died. In this way all creation fell into age-long slavery, lasting from the foundation of the world until now.


    17. They also selected women and fathered children from the darkness according to the likeness of their own spirit. They closed up their hearts and hardened themselves by means of the hardness of the vile spirit, even until now.”'
translation:
  language: ko
  text: '1. 그러나 나는 여쭈었습니다. “주님, 그 사악한 영은 어디에서 생겨났습니까?”


    2. 그분이 내게 말씀하셨습니다. “자비가 풍성한 어머니-아버지, 모든 양태로 나타나는 거룩한 영, 너희 모두에게 자비와 연민을 베푸는 이, 곧 빛나는 섭리의 성찰이 완전한 종족의 씨와 그 지성, 그리고 사람의 영원한 빛을 일으켜 세웠습니다.[a]


    3. 우두머리 아르콘은 그들이 높은 곳에서 자기보다 더 높고 지성에서도 자기를 뛰어넘는다는 것을 깨닫자, 그들의 목적을 파악하려고 했습니다. 그러나 그들이 지성에서 자기를 뛰어넘는다는 것과 자기가 그들을 파악할 수 없다는 것을 알지 못했습니다.[b]


    4. 그는 자기 권세자들, 곧 자기 세력들과 함께 계략을 꾸몄고, 그들은 소피아와 함께 간음했습니다. 그들에게서 쓰라린 운명이 태어났으니, 이는 마지막 불안정한 속박입니다. 그것은 흔들리는 성질을 지녔으면서도, 신들과 천사들과 악령들과 오늘날까지 이어진 모든 세대가 간음으로 결합한 그 여자보다 더 오래가고 더 강합니다.[c] 그 운명에서 모든 범법과 불의와 신성 모독, 망각과 무지의 속박, 중대한 범법을 수반하는 온갖 가혹한 명령과 압도적인 두려움이 나왔기 때문입니다.


    5. 이와 같이 모든 피조물도 눈이 멀어, 그들 모두 위에 계시는 하나님을 알지 못하게 되었습니다. 망각의 속박 때문에 그들의 죄는 감추어졌습니다. 그들이 치수와 때와 순간에 묶여 있기 때문이며, 그 운명이 만물을 지배하는 주권자이기 때문입니다.[d]


    6. 그러자 그는 자기 때문에 일어난 모든 일을 후회했습니다.


    7. 이번에는 인류가 낳은 것들 위에 홍수를 일으키려고 음모를 꾸몄습니다. 그러나 빛나는 섭리의 위대함이 노아에게 알려 주었고, 노아는 인류의 자손인 모든 씨에게 선포했습니다. 하지만 그에게 낯선 이들은 그의 말을 귀담아듣지 않았습니다.


    8. 모세가 ‘그들은 방주 안에 숨었다’라고 말한 것과는 달랐습니다. 그들은 어떤 곳에 숨었습니다. 노아뿐 아니라 흔들리지 않는 종족에 속한 다른 많은 사람도 그러했습니다.[e]


    9. 그들은 어떤 곳으로 들어가 빛나는 구름 속에 몸을 숨겼습니다. 그는 자기 권세를 알고 있었고, 빛에 속한 여자가 그와 동행했습니다.[f]


    10. 그 여자는 그들 위에 빛을 비추었습니다. 그가 온 땅을 어둠으로 덮었기 때문입니다. 그리고 그는 자기 세력들과 함께 계략을 꾸몄습니다.


    11. 그는 자기 천사들을 사람의 딸들에게 보내어 그들 가운데 몇을 자기들의 아내로 삼고 자기들의 쾌락을 위한 씨를 일으키게 했습니다. 그러나 처음에는 성공하지 못했습니다.


    12. 그들은 뜻을 이루지 못하자 다시 모여 함께 계략을 꾸몄습니다.


    13. 그들은 내려온 영을 닮은 사악한 영을 만들어, 그것으로 영혼들을 더럽히려 했습니다. 천사들은 자기 모습을 그 여자들의 짝의 모습으로 바꾸고, 악과 뒤섞어 만든 어둠의 영으로 그 여자들을 가득 채웠습니다.[g]


    14. 그들은 금과 은을 내놓았고, 구리와 철도 선물로 주었으며, 온갖 금속으로 만든 물건들을 내놓았습니다. 그리고 수많은 술수로 자기들을 따르는 사람들을 미혹하여 큰 고난에 빠뜨렸습니다.


    15. 그 사람들은 아무런 즐거움도 누리지 못한 채 늙었습니다.


    16. 그들은 진리를 발견하지 못하고 참하나님을 알지도 못한 채 죽었습니다. 이렇게 모든 피조물은 세상이 세워진 때부터 지금까지 이어지는 오랜 세월의 종살이에 빠졌습니다.


    17. 그들은 또 여자들을 골라 자기 영의 모습을 따라 어둠에서 난 자녀들을 낳았습니다. 그들은 마음을 닫고 사악한 영의 완고함으로 자신을 완고하게 만들었으며, 지금까지도 그러합니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어머니-아버지’, ‘빛나는 섭리의 성찰’, ‘사람’은 이 문헌에서 특별한 신적 또는 천상적 존재를 가리키는 호칭일 수 있습니다. 여기서는 그 관계를 해설로 확정하지 않았습니다.
    reason: 고유한 신화적 명칭과 대명사 관계가 난해하며 고대어 직접 검토가 보류되어 있습니다.
  - marker: b
    text: ‘목적을 파악하다’는 표현은 ‘의도’, ‘목표’ 또는 ‘계획을 이해하다’라는 뜻일 수도 있습니다.
    reason: 영어 증거의 objective가 의미상 모호합니다.
  - marker: c
    text: 이 문장의 ‘그 여자’는 문맥상 소피아를 가리킬 가능성이 크지만, 문장 구조와 비교 대상이 불분명하여 지시 대상을 그대로 남겼습니다.
    reason: 지시 관계와 구문상의 진정한 모호성을 보존합니다.
  - marker: d
    text: ‘그 운명’이 만물을 지배한다는 해석은 바로 앞에서 의인화된 ‘운명’을 받는 것으로 보이지만, 대명사의 지시 대상은 확정적이지 않습니다.
    reason: 대명사 지시의 불확실성을 알립니다.
  - marker: e
    text: ‘흔들리지 않는 종족’은 이 문헌의 구원받는 집단을 나타내는 전문적 표현으로 보입니다.
    reason: 낯선 집단 명칭의 문헌적 기능을 최소한으로 설명합니다.
  - marker: f
    text: ‘그’가 노아를 가리키는지 다른 존재를 가리키는지, ‘자기 권세’가 정확히 무엇을 뜻하는지는 분명하지 않습니다.
    reason: 원 증거의 대명사와 의미가 불명확합니다.
  - marker: g
    text: ‘그 여자들의 짝’은 천사들이 접근한 여자들의 배우자나 동료를 뜻하는 것으로 보이지만, 고대어 확인이 필요합니다.
    reason: mates의 지시와 의미를 잠정적으로 처리했음을 밝힙니다.
lexical_decisions:
- source_word: vile spirit
  choice: 사악한 영
  rationale: 도덕적 타락과 해로운 성격을 함께 드러내면서도 현대 한국어에서 자연스럽고, ‘더러운 영’처럼 정경 성서의 특정 용어와 곧바로 동일시하지 않습니다.
- source_word: Mother-Father
  choice: 어머니-아버지
  rationale: 양성적·복합적 신적 호칭의 낯섦과 긴장을 해소하지 않고 형태를 보존합니다.
- source_word: Reflection of Radiant Providence
  choice: 빛나는 섭리의 성찰
  rationale: Reflection을 인격명처럼 취급될 수 있는 ‘성찰’로 옮기고, Providence는 이 문헌의 구원적 인격 개념을 고려하여 ‘섭리’로 유지했습니다.
- source_word: chief archon
  choice: 우두머리 아르콘
  rationale: 고대 영지주의 문헌의 전문 개념을 ‘통치자’만으로 평준화하지 않되, 일반 독자가 위계를 알 수 있도록 설명어를 붙였습니다.
- source_word: Destiny
  choice: 운명
  rationale: 본문에서 의인화된 우주적 세력이라는 점을 문맥과 지시어로 드러내고, 익숙한 한국어 명사를 사용했습니다.
- source_word: unmoving race
  choice: 흔들리지 않는 종족
  rationale: 원문 증거의 독특한 집단 명칭을 교리적으로 풀어 쓰지 않고 직역에 가깝게 보존했습니다.
- source_word: seed
  choice: 씨
  rationale: 혈통·후손·영적 본질이 겹치는 고대 문헌의 다의성을 가능한 한 유지했습니다.
- source_word: the Man
  choice: 사람
  rationale: 원문 증거가 가리키는 원형적·천상적 존재의 가능성을 존중하되 특정 신학적 동일시를 덧붙이지 않았습니다.
theological_decisions:
- issue: ‘Mother-Father’와 대명사의 성별 및 단복수
  choice: 복합 호칭은 그대로 두고, 이어지는 행위자는 ‘이’와 문맥상 주어로 처리했습니다.
  alternative: ‘어머니이자 아버지이신 분’으로 풀거나 일관되게 남성 대명사를 사용할 수 있습니다.
  rationale: 신적 존재의 성별을 단일하게 확정하지 않고 원문의 복합성과 대명사 긴장을 보존합니다.
- issue: 소피아와 ‘그 여자’의 관계
  choice: ‘그 여자’를 그대로 두어 소피아를 가리킬 가능성은 유지하되 명시적으로 동일시하지 않았습니다.
  alternative: ‘소피아보다’라고 직접 번역할 수 있습니다.
  rationale: 영어 증거 자체의 지시 관계가 어색하고 고대어 검토가 보류되어 있으므로 모호성을 해소하지 않았습니다.
- issue: 홍수 전승과 모세의 진술에 대한 반론
  choice: 본문의 직접적인 대조를 완화하지 않고 보존했습니다.
  alternative: 정경 창세기와 조화되도록 비유적 의미를 덧붙일 수 있습니다.
