status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 제공된 영어 증언의 우주론적 명칭, 인격화, 대명사상의 긴장을 충실히 따릅니다. 다만 Indestructibility를 ‘불멸성’으로 옮기면 별도 항목인 ‘영원한 생명’과 의미가 겹치며, 10절의 복원 대괄호 범위와 14절의 술어 관계도 더 충실히 보존할 필요가 있습니다. 직접 콥트어 대조 자료는 제공되지 않았으므로, 이 평가는 제시된 영어 증언을 기준으로 한 잠정 검토입니다.
  naturalness: 합쇼체는 일관되고, ‘만물의 모태’, ‘처녀인 영’, ‘불괴성’은 해당 문맥에서 더 자연스러우면서도 구별되는 전문 용어입니다. 인격화된 명칭의 대문자성은 한국어에서 문맥과 반복으로 충분히 드러납니다.
  terminology: ‘아이온’, ‘오중체’, ‘십중체’, ‘바르벨로’, ‘예지’, ‘섭리’, ‘사유’는 일관되게 유지했습니다. Indestructibility는 ‘불괴성’으로 수정하여 Eternal Life와 구별했습니다.
  issues:
  - severity: medium
    issue: 5·6·13절의 Indestructibility를 ‘불멸성’으로 번역함
    rationale: Indestructibility는 죽지 않음보다는 파괴·훼손되지 않음을 뜻합니다. 같은 단락에 Eternal Life가 별도 인격적 실재로 나오므로 ‘불멸성’은 두 명칭을 불필요하게 근접시킵니다.
  - severity: low
    issue: 10절의 두 번째 복원 대괄호가 축소됨
    rationale: 증언은 ‘[when he had] agreed’처럼 복원된 연결구를 표시합니다. 한국어에서도 복원 표지를 유지해 결손·복원 상태를 독자에게 드러내야 합니다.
  - severity: medium
    issue: 14절이 ‘아이온적 십중체’와 ‘아버지’의 원문상 동격 관계를 두 문장으로 분리함
    rationale: 증언은 양성의 아이온적 오중체가 ‘아버지인’ 아이온적 십중체라는 진술을 한 문장 안에서 연결합니다. 수정문은 이 관계를 보존하되 체계적 해설을 덧붙이지 않습니다.
  revised_text: '1. 그녀는 만물의 모태가 되었습니다. 그녀가 그들 모두보다 먼저 존재하는 분, 곧 어머니-아버지이며, 태초의 인간이며, 거룩한 영이며, 세 겹으로 남성인 분, 세 겹으로 강력한 분, 세 이름을 지닌 양성의 분이며, 보이지 않는 존재들 가운데 있는 영원한 아이온[a], 곧 맨 먼저 나온 분이기 때문입니다.


    2. ‹그녀는› 보이지 않는 처녀인 영, 곧 바르벨로에게 자신에게 예지를 허락해 달라고 간청했고, 그 영은 동의했습니다.


    3. 그가 [동의한 뒤], 예지가 다가와 섭리 곁에 자리했습니다. 섭리는 보이지 않는 처녀인 영의 사유에서 비롯된 존재입니다.


    4. 그녀는 그와 그의 완전한 능력인 바르벨로를 찬양했습니다. 그들이 그녀로 말미암아 생겨났기 때문입니다.[b]


    5. 그녀는 또다시 자신에게 [불괴성]을 허락해 달라고 간청했고, 그는 동의했습니다.


