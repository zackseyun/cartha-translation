base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/005.yaml
  text: '1. She became the universal womb because she is the one who exists before all of them: the Mother-Father, the Primal Human, the holy Spirit, the triple-male, the triple-powerful, the triple-named androgynous one, and the eternal aeon among the unseen ones, even the first one to come forth.


    2. ‹She› asked the unseen, virginal Spirit—that is, Barbelo—to grant her Precognition, and the Spirit agreed.


    3. When he had [agreed], Precognition approached and attended Providence, she who originates from the Idea of the unseen, virginal Spirit.


    4. She praised him [and] his perfect power, Barbelo, because they had come into being on account of her.


    5. She asked once more that he grant her [Indestructibility], and he agreed.


    6. When he had [agreed], Indestructibility [approached] and attended Idea and Precognition.


    7. She praised the unseen one and Barbelo, the one on whose account they had come into being.


    8. Barbelo also asked that he grant her eternal life, and the unseen Spirit agreed. When he had agreed, Eternal Life approached,


    9. and they [attended] and praised the unseen [Spirit] and Barbelo, on whose account they had come into being.


    10. She asked once more that he grant her truth. And [he agreed], and [when he had] agreed,


    11. Truth approached, and they attended and praised the unseen, admirable Spirit and his Barbelo, on whose account they had come into being.


    12. This is the aeonic pentad of the Father, which is the Primal Human, the image of the unseen Spirit.


    13. This is Providence—that is, Barbelo—and Idea, Precognition, Indestructibility, Eternal Life, and Truth.


    14. This is the androgynous aeonic pentad, being the aeonic decad, which is the Father.'
translation:
  language: ko
  text: '1. 그녀는 만물의 태가 되었습니다. 그녀가 그들 모두보다 먼저 존재하는 분, 곧 어머니-아버지이며, 태초의 인간이며, 거룩한 영이며, 세 겹으로 남성인 분, 세 겹으로 강력한 분, 세 이름을 지닌 양성의 분이며, 보이지 않는 존재들 가운데 있는 영원한 아이온[a], 곧 맨 먼저 나온 분이기 때문입니다.


    2. ‹그녀는› 보이지 않는 동정의 영, 곧 바르벨로에게 자신에게 예지를 허락해 달라고 간청했고, 그 영은 동의했습니다.


    3. 그가 [동의하자], 예지가 다가와 섭리 곁에 자리했습니다. 섭리는 보이지 않는 동정의 영의 사유에서 비롯된 존재입니다.


    4. 그녀는 그와 그의 완전한 능력인 바르벨로를 찬양했습니다. 그들이 그녀로 말미암아 생겨났기 때문입니다.[b]


    5. 그녀는 또다시 자신에게 [불멸성]을 허락해 달라고 간청했고, 그는 동의했습니다.


    6. 그가 [동의하자], 불멸성이 [다가와] 사유와 예지 곁에 자리했습니다.


    7. 그녀는 보이지 않는 분과 바르벨로를 찬양했습니다. 그들이 바르벨로로 말미암아 생겨났기 때문입니다.


    8. 바르벨로는 또한 자신에게 영원한 생명을 허락해 달라고 간청했고, 보이지 않는 영은 동의했습니다. 그가 동의하자 영원한 생명이 다가왔고,


    9. 그들은 [곁에 자리하여] 보이지 않는 [영]과 바르벨로를 찬양했습니다. 그들이 바르벨로로 말미암아 생겨났기 때문입니다.


    10. 그녀는 또다시 자신에게 진리를 허락해 달라고 간청했습니다. [그는 동의했고], [그가] 동의하자,


    11. 진리가 다가왔습니다. 그들은 곁에 자리하여 보이지 않는 경이로운 영과 그의 바르벨로를 찬양했습니다. 그들이 바르벨로로 말미암아 생겨났기 때문입니다.


    12. 이것이 아버지의 아이온적 오중체[c]입니다. 이 아버지는 태초의 인간이며, 보이지 않는 영의 형상입니다.


    13. 이것은 섭리, 곧 바르벨로와 사유와 예지와 불멸성과 영원한 생명과 진리입니다.[d]


    14. 이것은 양성의 아이온적 오중체이며, 아이온적 십중체를 이룹니다. 이것이 아버지입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이온’은 이 문맥에서 단순한 시대가 아니라 영원한 신적 실재 또는 영역을 가리키는 전문 용어입니다.
    reason: 낯선 전문 용어의 문맥상 의미를 안내하기 위해서입니다.
  - marker: b
    text: 이 문장의 대명사와 바르벨로의 문법적 관계는 제공된 영어 증언에서도 모호합니다. 번역은 이를 명확한 하나의 해석으로 고정하지 않았습니다.
    reason: 실제 본문에 남아 있는 지시 대상의 모호성을 독자에게 알리기 위해서입니다.
  - marker: c
    text: ‘오중체’는 다섯 요소로 이루어진 한 집합 또는 통일체를 뜻합니다.
    reason: 전문적 수 개념을 현대 독자가 이해하도록 돕기 위해서입니다.
  - marker: d
    text: 이 절의 표현은 겉으로 여섯 항목을 열거하는 듯하지만, 앞 절과 다음 절은 이를 ‘오중체’라고 부릅니다. 번역은 이 수적 긴장을 그대로 남겼습니다.
    reason: 본문의 수적 불일치를 임의로 조정하지 않았음을 밝히기 위해서입니다.
lexical_decisions:
- source_word: universal womb
  choice: 만물의 태
  rationale: 우주 전체의 모태라는 의미를 자연스럽고 장중하게 전달하면서 여성적·생성적 표상을 보존했습니다.
- source_word: Mother-Father
  choice: 어머니-아버지
  rationale: 양성적 결합과 원문의 긴장을 해소하지 않도록 두 호칭을 하이픈으로 병치했습니다.
- source_word: Primal Man / Primal Human
  choice: 태초의 인간
  rationale: 성별을 불필요하게 남성으로 한정하지 않으면서 원초적 인간 존재라는 뜻을 나타냅니다.
- source_word: aeon
  choice: 아이온
  rationale: 이 문맥에서는 단순한 ‘시대’가 아니라 영원한 신적 실재를 가리키는 전문 용어이므로 음역했습니다.
- source_word: Precognition
  choice: 예지
  rationale: 인격화된 ‘미리 앎’을 간결한 추상 명사로 표현했습니다.
- source_word: Providence
  choice: 섭리
  rationale: 영어 증언의 명칭을 따르되 인격화된 신적 실재로 읽히도록 일관되게 고유 명칭처럼 사용했습니다.
- source_word: Idea
  choice: 사유
  rationale: ‘관념’보다 살아 있는 신적 사고 작용과 그 인격화를 자연스럽게 나타냅니다.
- source_word: Indestructibility
  choice: 불멸성
  rationale: 파괴되거나 소멸하지 않는 성질을 인격화한 명칭으로 자연스러운 한국어를 택했습니다.
- source_word: pentad / decad
  choice: 오중체 / 십중체
  rationale: 단순 숫자 목록이 아니라 다섯 또는 열 요소로 이루어진 통일체라는 의미를 보존했습니다.
- source_word: attended
  choice: 곁에 자리했습니다
  rationale: ‘섬겼다’로 단정하지 않고, 다가와 함께 있게 되었다는 공간적·관계적 의미를 보존했습니다.
theological_decisions:
- issue: 바르벨로와 보이지 않는 영의 관계 및 성별 대명사
  choice: 증언 본문의 ‘그녀/그’ 전환과 ‘곧 바르벨로’라는 동격 표현을 그대로 보존했습니다.
  alternative: 바르벨로와 영을 명확히 분리하거나 모든 대명사를 중성적으로 처리할 수 있습니다.
  rationale: 본문 자체의 성별 긴장과 지시 대상의 모호성을 교리적으로 정리하지 않기 위해서입니다.
- issue: 오중체와 13절의 열거 항목 수 사이의 긴장
  choice: 오중체라는 명칭과 여섯 개로 보이는 열거를 모두 그대로 옮겼습니다.
  alternative: 사유와 섭리를 하나로 묶거나 특정 항목을 제외하여 다섯으로 맞출 수 있습니다.
  rationale: 제공된 증언의 수적 긴장을 번역자가 임의로 해소하지 않기 위해서입니다.
- issue: 오중체가 십중체를 이룬다는 진술
  choice: 14절의 진술을 설명 없이 보존했습니다.
  alternative: 각 요소가 남성·여성 한 쌍을 이룬다고 해설적으로 풀어 쓸 수 있습니다.
  rationale: 원문 증거에 명시되지 않은 체계적 설명을 본문에 덧붙이지 않기 위해서입니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되 우주론적 찬가의 장중함을 유지했습니다. 인격화된 추상 명사는 일관되게 명칭처럼 처리했습니다. 꺾쇠 ‹ ›와 대괄호 [ ]는 증언 본문의 복원·결손 표지를 보존합니다. 제공 자료가 콥트어 직접 대조 전의 공개 영어 증언에 기초하므로, 출판 전 콥트어 사본 대조가 필요합니다.
