translation:
  language: ko
  text: '1. 곧바로 [내가 이 일들을 곰곰이 생각하고 있을 때], 보십시오, [하늘들이 열리고] 하늘 아래의 [온] 피조물이 빛났으며, [세상이] 흔들렸습니다.


    2. [나는 두려워졌습니다. 그런데 보십시오, 나는] [빛 속에서 한 아이가] 내 곁에 [서 있는 것을] 보았습니다.


    3. 내가 [그를 바라보자, 그는] 노인과 같은 모습이 되었습니다. 그러더니 [자기] 모습을 [바꾸어] 아들[a]과 같은 모습이 되었습니다.


    4. 내 앞에 있는 것은 [서로 다른 존재들이] 아니었습니다. 오히려 [빛] 속에 여러 형상을 지닌 한 [모습]이 있었고, [그 형상들은] 서로를 통하여 차례로 나타났습니다. [그] [모습]에는 세 형상이 있었습니다.


    5. 그가 내게 물었습니다. “요한아, 요한아, 왜 놀라며, 왜 [두려워하느냐]?


    6. 이 모습이 너희 모두에게 낯서냐?


    7. 내 말은, [마음이] 약해지지 말라는 것이다.


    8. 나는 언제나 [너희 모두와] [함께 있는] 이다.


    9. 나는 [아버지이며], 나는 어머니이며, 나는 아들이다.


    10. 나는 더럽혀지지도 않고 오염되지도 않은 이다.


    11. [나는 이제 네게 알려 주려고 왔다.] 곧 지금 있는 것과 [전에 있었던 것]과 앞으로 [일어날 일]을 알려 주어, 네가 아직 나타나지 [않은 것들과 나타난 것들을 깨닫게 하고], [완전한 사람의] [흔들리지 않는 종족에 관하여 알려 주려는 것이다].


    12. [그러므로 네] 얼굴을 [들어라. 그러면] 너는 내가 오늘 [네게 말할] 것들을 [받아들이고], [완전한] 사람의 [흔들리지 않는] 종족에 속한 네 [동료] 영들에게 [그것들을 전할 수 있을 것이다].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 공급된 영어 증언은 여기의 말을 ‘아들’(son)로 옮기면서 별도 주석 표지를 달았습니다. 콥트어 원문에 대한 직접 검토가 아직 이루어지지 않았으므로, ‘아들’과 ‘젊은이’에 관련된 어휘적 가능성은 추후 확인이 필요합니다.
    reason: 증언 자체가 표시한 어휘상의 문제를 숨기지 않고, 직접 원어 검토 전에는 단정하지 않기 위해서입니다.
lexical_decisions:
- source_word: creation
  choice: 피조물
  rationale: 하늘 아래 존재하는 창조 세계를 집합적으로 가리키는 문맥을 자연스럽게 전달했습니다.
- source_word: diverse entity
  choice: 서로 다른 존재들
  rationale: 눈앞의 세 형상이 별개의 존재들이 아니라 하나의 모습 안에 나타난다는 대조를 살렸습니다.
- source_word: appearance
  choice: 모습
  rationale: 보이는 현현을 뜻하되 그것을 곧바로 별개의 실체로 규정하지 않도록 중립적인 말을 택했습니다.
- source_word: unmoving race
  choice: 흔들리지 않는 종족
  rationale: 문헌의 전문적·상징적 표현을 해석적으로 바꾸지 않고 직역에 가깝게 보존했습니다.
- source_word: Perfect Man
  choice: 완전한 사람
  rationale: 특정 교파적 인간론을 덧붙이지 않고 원문의 칭호적 성격을 보존했습니다.
- source_word: companion spirits
  choice: 동료 영들
  rationale: 요한과 같은 집단에 속한 영들이라는 관계를 간결하게 유지했습니다.
theological_decisions:
- issue: 아버지·어머니·아들이라는 자기 계시
  choice: 세 호칭을 병렬로 그대로 보존함
  alternative: 삼위일체나 특정 영지주의 체계의 용어로 해설하여 번역함
  rationale: 본문 자체의 긴장과 독특한 자기 진술을 특정 교리 체계로 미리 해소하지 않았습니다.
- issue: 한 모습과 세 형상의 관계
  choice: 별개의 존재들이 아니라 한 모습 안에 세 형상이 나타난다는 진술을 보존함
  alternative: 세 인격 또는 세 변신으로 명시함
  rationale: 원문 증거가 제공하는 현상적 묘사 이상으로 존재론을 확정하지 않았습니다.
- issue: unmoving race의 정체
  choice: 흔들리지 않는 종족으로 번역함
  alternative: 택함 받은 자들, 영적 인류 등으로 의역함
  rationale: 집단의 신학적 정체를 번역자가 규정하지 않고 낯선 전문 표현을 유지했습니다.
translation_notes:
  register: 서술부는 현대 표준어의 격식 있는 합쇼체로 옮겼습니다. 직접 발화는 계시자의 권위와 요한을 향한 단수 호칭을 자연스럽게 나타내기 위해 절제된 해라체를 사용했습니다. 대괄호는 공급된 증언에서 복원되거나 보충된 부분을 그대로 표시하며, 불필요하게 매끄럽게 합치지 않았습니다. 삽입된 필사본 쪽수 표시는 본문에서 제외했습니다.
