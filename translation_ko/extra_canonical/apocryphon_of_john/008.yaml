translation:
  language: ko
  text: '**요한의 비밀서 — 아다마스와 셋**


    1. 또 완전한 정신의 예지로부터, 보이지 않는 영의 뜻과 자생자의 뜻이 드러남으로써 완전한 사람, 곧 첫 계시이며 진리인 이가 나왔습니다.


    2. 그는 처녀 영이 피게라아다마스[a]라고 이름 붙인 이입니다. 처녀 영은 그를, 권능들의 호위를 받는 첫째 빛 아르모젤 곁에서, 강한 이 곧 자생자 그리스도와 함께 첫째 아이온[b]을 다스리도록 세웠습니다.


    3. 또 보이지 않는 분은 그에게 영적이며 상처 입지 않는 힘을 주셨습니다.


    4. 그러자 그는 말하며 보이지 않는 영을 높이고 찬양했습니다. “당신으로 말미암아 만유가 생겨났고, 만유가 당신께 돌아갈 것입니다.


    5. 나는 당신과 자생자를 찬양하고 높이겠습니다. 또한 세 아이온, 곧 아버지와 어머니와 아들, 완전한 권능을 찬양하고 높이겠습니다.”[c]


    6. 그는 아다마스의 아들 셋도 둘째 빛 오로이엘 앞에서 둘째 아이온을 다스리도록 세웠습니다. 셋의 씨는 셋째 아이온 안에서 셋째 빛 다베이타이 위에 세워졌고, 그 안에는 거룩한 이들의 영혼들이 놓였습니다.


    7. 또 넷째 아이온 안에는 충만[d]을 알지 못한 이들의 영혼들이 놓였습니다. 그들은 즉시 회개하지 않고 한동안 회개하지 않은 채 지내다가 나중에야 회개한 이들입니다.


    8. 이들은 넷째 빛 엘렐렛입니다.[e]


    9. 이들은 보이지 않는 영을 높이는 피조물들입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘피게라아다마스’는 사본 전승에 나타나는 기술적 이름입니다. ‘아다마스’와의 표기 관계는 콥트어 사본을 직접 대조한 뒤 재검토할 필요가 있습니다.
    reason: 이름의 형태와 괄호 표기가 영어 증언에서도 불확실하므로 독자에게 잠정성을 알립니다.
  - marker: b
    text: ‘아이온’은 여기서 단순한 시간적 ‘시대’라기보다 초월적 영역 또는 존재 질서를 가리키는 전문어입니다.
    reason: 음역한 핵심 우주론 용어의 의미를 설명합니다.
  - marker: c
    text: ‘완전한 권능’이 아버지·어머니·아들로 이루어진 세 아이온 전체를 가리키는지, 앞선 표현 가운데 하나를 가리키는지는 문장 구조상 분명하지 않습니다.
    reason: 원문의 신학적·문법적 모호성을 보존하고 설명합니다.
  - marker: d
    text: ‘충만’은 신적 실재의 충만한 총체를 가리키는 전문어로 이해될 수 있습니다.
    reason: 일상적 의미와 구별되는 기술어임을 알립니다.
  - marker: e
    text: ‘이들은 넷째 빛 엘렐렛입니다’라는 표현은 복수 대상을 단수의 빛과 연결하는 이례적인 문장입니다. 제공된 증언의 표현을 고쳐 조화시키지 않고 그대로 보존했습니다.
    reason: 문단 8의 본문상 난점을 투명하게 제시합니다.
lexical_decisions:
- source_word: Precognition of Perfect Mind
  choice: 완전한 정신의 예지
  rationale: 대문자로 제시된 우주론적 명칭의 성격을 살리면서도 현대 한국어로 이해할 수 있게 옮겼습니다.
- source_word: self-generated one
  choice: 자생자
  rationale: 스스로 생겨난 존재라는 기술적 의미를 간결한 명칭으로 보존했습니다.
- source_word: Perfect Man
  choice: 완전한 사람
  rationale: 후대의 교리적 호칭을 덧붙이지 않고 원문의 인물 명칭을 직접 옮겼습니다.
- source_word: aeon
  choice: 아이온
  rationale: 이 문맥에서는 단순한 ‘시대’보다 초월적 영역 또는 존재 질서를 가리키는 전문어이므로 음역했습니다.
- source_word: the All
  choice: 만유
  rationale: 우주적 총체를 가리키는 표현으로서 자연스럽고 장중한 한국어를 선택했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 영지주의 문헌의 기술어라는 성격을 유지하되 의미를 드러내는 번역어를 사용했습니다.
- source_word: seed of Seth
  choice: 셋의 씨
  rationale: 후손 또는 영적 계보로도 이해될 수 있는 원문의 비유적 표현을 해석해 확정하지 않았습니다.
- source_word: invulnerable strength
  choice: 상처 입지 않는 힘
  rationale: ‘불사’나 ‘무적’으로 의미를 확대하지 않고 물리적·영적 함의를 열어 두었습니다.
theological_decisions:
- issue: ‘세 아이온’과 ‘아버지, 어머니, 아들, 완전한 권능’의 관계
  choice: 문장 부호와 병렬 구조를 유지하여 ‘완전한 권능’이 삼위 전체를 설명하는지 특정 항목을 설명하는지 확정하지 않았습니다.
  alternative: ‘아버지와 어머니와 아들인 세 아이온, 곧 완전한 권능’처럼 명시적으로 동격 처리할 수 있습니다.
  rationale: 제공된 증거만으로 동격 범위를 확정하기 어려우므로 신학적 긴장을 보존했습니다.
- issue: 문단 8의 복수 주어와 단수 명칭의 관계
  choice: ‘이들은 넷째 빛 엘렐렛입니다’로 직역에 가깝게 보존했습니다.
  alternative: ‘이들은 넷째 빛 엘렐렛 안에 있습니다’ 또는 ‘넷째 빛은 엘렐렛입니다’로 고칠 수 있습니다.
  rationale: 제공된 영어 증언 자체가 이례적인 문장을 보존하고 있으며, 원문 대조 전에는 이를 조화시키지 않는 편이 안전합니다.
- issue: 셋의 씨와 거룩한 이들의 영혼
  choice: 둘을 동일한 집단이라고 단정하지 않고 별개의 절로 옮겼습니다.
  alternative: ‘셋의 씨, 곧 거룩한 이들의 영혼들’로 동일시할 수 있습니다.
  rationale: 본문의 구문은 연관성을 제시하지만 명시적 동일시는 하지 않습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 인물과 우주론적 존재의 이름은 음역하고, 반복되는 찬양 문구는 장중하되 쉬운 어휘로 옮겼습니다. 번역은 제공된 공공영역 영어 증언을 바탕으로 한 잠정본이며, 콥트어 원문 직접 검토가 남아 있습니다. 영어 증언에 끼어 있던 사본 면수 표지 ‘«9»’는 본문 의미의 일부가 아니므로 제외했습니다.
