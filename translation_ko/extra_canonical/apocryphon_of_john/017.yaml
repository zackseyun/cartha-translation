  source_fidelity: 전반적으로 영어 증언의 문장 순서, 인물 관계, 우주론 용어와 대명사상의 모호성을 충실히 보존했습니다. 다만 마지막 단락의 ‘the seed remained ... to help’를 ‘도움을 기다렸습니다’로 옮긴 것은 씨가 도움을 받기를 기다렸다는 뜻으로 전환하여, 도움을 주기 위한 존속이라는 원문의 목적 관계를 바꿉니다. 이를 바로잡아야 합니다. ‘어두운 암흑’은 dark gloom의 반복적 강조를 한국어에서 부자연스럽게 중복한 표현이므로 ‘짙은 어둠’으로 다듬었습니다.
  naturalness: 현대 표준 한국어 합쇼체가 일관되며, ‘반영’, ‘섭리’, ‘아르콘’, ‘에온’, ‘충만’ 등의 용어도 문헌의 특수성을 훼손하지 않고 자연스럽게 처리되었습니다. ‘남편을 맞을 준비’는 원문의 자기 단장·준비의 뜻을 충분히 드러내지만, ‘남편을 맞을 채비’를 사용하면 좀 더 자연스럽습니다.
  terminology: 고유명사 얄다바오트, 엘로임, 야베 및 전문 용어 아르콘, 에온, 충만의 음역·번역 방침은 적절합니다. ‘선지식’은 제공된 증언의 precognition/foreknowledge가 지닌 추상명사와 의인화 가능성의 긴장을 보존합니다. ‘더럽히고’는 원문의 강한 부정적 평가를 유지하면서도 제공 증언보다 행위를 과도하게 특정하지 않습니다.
  issues:
  - severity: medium
    issue: 마지막 단락에서 ‘the seed remained for a period of time to help’를 ‘그 씨는 얼마 동안 남아 도움을 기다렸습니다’로 번역함
    rationale: 원문은 씨가 ‘돕기 위해’ 한동안 남아 있었다는 목적을 말합니다. 현 번역은 씨가 도움을 기다렸다는 반대 방향의 관계를 만들어 의미가 달라집니다.
  - severity: low
    issue: ‘어두운 암흑으로 입혔습니다’의 중복적 표현
    rationale: dark gloom의 강조를 반영하려는 의도는 이해되나, ‘어두운 암흑’은 현대 한국어에서 의미 중복이 강합니다. ‘짙은 어둠을 입혔습니다’가 자연스럽습니다.
  revised_text: '나는 지식의 나무 위에 독수리의 모습으로 나타났습니다. 그 나무는 순수한 빛의 섭리의 반영입니다. 나는 그들을 가르치고 깊은 잠에서 깨우려고 나타났습니다. 두 사람 모두 타락한 상태에 있었고, 자기들이 벌거벗었음을 알고 있었기 때문입니다.


    반영은 빛의 모습으로 그들에게 나타나 그들의 생각을 일깨웠습니다. 그러나 얄다바오트[a]는 그들이 자기에게서 떠났다는 것을 깨닫고 자기 땅을 저주했습니다.


    그는 여자가 남편을 맞을 채비를 하고 있을 때 그 여자와 마주쳤습니다.


    그는 여자의 지배자였지만, 거룩한 명령을 통해 일어난 신비를 알지 못했습니다. 그들은 그를 고발하기를 두려워했습니다. 그는 자기 안의 무지를 천사들에게 드러냈고, 그들을 낙원에서 내쫓아 짙은 어둠을 입혔습니다.


    으뜸 아르콘[b]은 아담 곁에 서 있던 처녀도 보았고, 생명의 빛나는 반영이 그녀 안에 나타난 것도 보았습니다. 얄다바오트는 무지로 가득 찼습니다. 만유의 섭리가 이것을 보고 사자들을 보냈고, 그들은 곧바로 하와에게서 생명을 빼내었습니다.


    그 뒤 으뜸 아르콘은 그녀를 더럽히고, 그녀와의 사이에서 첫째와 둘째 두 아들, 곧 엘로임과 야베를 낳았습니다.


    엘로임은 곰의 얼굴을 가졌고, 야베는 고양이의 얼굴을 가졌습니다.


    야베는 의롭지만 엘로임은 불의합니다.


    야베는 불과 바람을 다스리도록 세워졌고, 엘로임은 물과 땅을 다스리도록 세워졌습니다. 그러나 그는 속이려는 뜻으로 이들에게 가인과 아벨이라는 이름을 붙였습니다.


    오늘날까지 성관계가 이어지는 것은 으뜸 아르콘 때문입니다. 아담에게 속한 여자 안에 성적 욕망을 심은 자가 바로 그였습니다. 그는 성관계를 통해 몸들의 복제물을 만들고, 자기의 거짓 영을 그들에게 불어넣었습니다.


    또 그는 그 두 아르콘을 여러 권세 위에 세워, 그들이 무덤을 다스리게 했습니다.


    그러나 아담은 자기 자신의 선지식[c]의 형상을 깨닫고, 사람의 아들의 형상을 낳아 그 이름을 셋이라 했습니다. 이는 에온들[d] 가운데 그 종족이 존재하는 방식과 일치했습니다.


    이와 마찬가지로 어머니도 자기 형상을 닮은 자신의 영과, 충만[e] 안에 거하는 이의 모상을 함께 내려보냈습니다. 내려올 에온들을 위해 거처를 마련하려는 것이었습니다.


    또 그는 그들이 자기들의 기원한 곳을 알지 못하도록, 으뜸 아르콘에게서 나온 망각의 물을 마시게 했습니다.


    이렇게 그 씨는 도움을 주기 위해 한동안 남아 있었습니다. 거룩한 에온들로부터 영이 나올 때, 영이 그를 일으켜 세우고 그의 결핍을 고쳐서, 온 충만이 거룩하고 흠 없게 되도록 하려는 것이었습니다.”'
  revised_footnotes:
  - marker: a
    text: 얄다바오트는 이 문헌에서 물질세계를 지배하는 으뜸 아르콘의 이름입니다. 사본 전승에 따라 철자 형태가 달라질 수 있습니다.
    reason: 낯선 고유명사와 본문 내 역할을 최소한으로 밝혀 독자의 이해를 돕기 위해서입니다.
  - marker: b
    text: ‘아르콘’은 그리스어에서 ‘통치자’를 뜻하며, 이 문헌에서는 우주적 권세자를 가리키는 전문 용어로 쓰입니다.
    reason: 음역어의 기본 뜻과 문헌상 용법을 설명하기 위해서입니다.
  - marker: c
    text: ‘선지식’은 미리 아는 앎 또는 그러한 신적 능력·양상을 가리킬 수 있습니다.
    reason: 추상적 능력과 의인화된 실재 사이의 원문상 모호성을 보존하기 위해서입니다.
  - marker: d
    text: ‘에온’은 문자적으로 긴 시대를 뜻할 수 있으나, 이 문헌에서는 초월적 영역이나 영적 존재를 가리키기도 합니다.
    reason: 문헌의 특수한 우주론 용어를 과도하게 단순화하지 않기 위해서입니다.
  - marker: e
    text: ‘충만’은 신적 실재가 온전히 갖추어진 초월적 영역을 가리키는 이 문헌의 전문 개념입니다.
    reason: 일상적 의미의 충만과 우주론적 전문 의미를 구별하도록 돕기 위해서입니다.
  revision_rationale: 마지막 문장의 목적 관계를 영어 증언에 맞게 회복했습니다. 그 밖에는 제공된 영어 증언에 대한 충실성과 원문의 불확실성을 보존하는 기존 방침을 유지하고, 두 곳만 현대 한국어 문체에 맞게 최소한으로 다듬었습니다.
