  yaml_path: translation/extra_canonical/apocryphon_of_john/017.yaml
  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: ko
  text: '나는 지식의 나무 위에 독수리의 모습으로 나타났습니다. 그 나무는 순수한 빛의 섭리의 반영입니다. 나는 그들을 가르치고 깊은 잠에서 깨우려고 나타났습니다. 두 사람 모두 타락한 상태에 있었고, 자기들이 벌거벗었음을 알고 있었기 때문입니다.


    반영은 빛의 모습으로 그들에게 나타나 그들의 생각을 일깨웠습니다. 그러나 얄다바오트[a]는 그들이 자기에게서 떠났다는 것을 깨닫고 자기 땅을 저주했습니다.


    그는 여자가 남편을 맞을 준비를 하고 있을 때 그 여자와 마주쳤습니다.


    그는 여자의 지배자였지만, 거룩한 명령을 통해 일어난 신비를 알지 못했습니다. 그들은 그를 고발하기를 두려워했습니다. 그는 자기 안의 무지를 천사들에게 드러냈고, 그들을 낙원에서 내쫓아 어두운 암흑으로 입혔습니다.


    으뜸 아르콘[b]은 아담 곁에 서 있던 처녀도 보았고, 생명의 빛나는 반영이 그녀 안에 나타난 것도 보았습니다. 얄다바오트는 무지로 가득 찼습니다. 만유의 섭리가 이것을 보고 사자들을 보냈고, 그들은 곧바로 하와에게서 생명을 빼내었습니다.


    그 뒤 으뜸 아르콘은 그녀를 더럽히고, 그녀와의 사이에서 첫째와 둘째 두 아들, 곧 엘로임과 야베를 낳았습니다.


    엘로임은 곰의 얼굴을 가졌고, 야베는 고양이의 얼굴을 가졌습니다.


    야베는 의롭지만 엘로임은 불의합니다.


    야베는 불과 바람을 다스리도록 세워졌고, 엘로임은 물과 땅을 다스리도록 세워졌습니다. 그러나 그는 속이려는 뜻으로 이들에게 가인과 아벨이라는 이름을 붙였습니다.


    오늘날까지 성관계가 이어지는 것은 으뜸 아르콘 때문입니다. 아담에게 속한 여자 안에 성적 욕망을 심은 자가 바로 그였습니다. 그는 성관계를 통해 몸들의 복제물을 만들고, 자기의 거짓 영을 그들에게 불어넣었습니다.


    또 그는 그 두 아르콘을 여러 권세 위에 세워, 그들이 무덤을 다스리게 했습니다.


    그러나 아담은 자기 자신의 선지식[c]의 형상을 깨닫고, 사람의 아들의 형상을 낳아 그 이름을 셋이라 했습니다. 이는 에온들[d] 가운데 그 종족이 존재하는 방식과 일치했습니다.


    이와 마찬가지로 어머니도 자기 형상을 닮은 자신의 영과, 충만[e] 안에 거하는 이의 모상을 함께 내려보냈습니다. 내려올 에온들을 위해 거처를 마련하려는 것이었습니다.


    또 그는 그들이 자기들의 기원한 곳을 알지 못하도록, 으뜸 아르콘에게서 나온 망각의 물을 마시게 했습니다.


    이렇게 그 씨는 얼마 동안 남아 도움을 기다렸습니다. 거룩한 에온들로부터 영이 나올 때, 영이 그를 일으켜 세우고 그의 결핍을 고쳐서, 온 충만이 거룩하고 흠 없게 되도록 하려는 것이었습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 얄다바오트는 이 문헌에서 물질세계를 지배하는 으뜸 아르콘의 이름입니다. 사본 전승에 따라 철자 형태가 달라질 수 있습니다.
    reason: 낯선 고유명사와 본문 내 역할을 최소한으로 밝혀 독자의 이해를 돕기 위해서입니다.
  - marker: b
    text: ‘아르콘’은 그리스어에서 ‘통치자’를 뜻하며, 이 문헌에서는 우주적 권세자를 가리키는 전문 용어로 쓰입니다.
    reason: 음역어의 기본 뜻과 문헌상 용법을 설명하기 위해서입니다.
  - marker: c
    text: ‘선지식’은 미리 아는 앎 또는 그러한 신적 능력·양상을 가리킬 수 있습니다.
    reason: 추상적 능력과 의인화된 실재 사이의 원문상 모호성을 보존하기 위해서입니다.
  - marker: d
    text: ‘에온’은 문자적으로 긴 시대를 뜻할 수 있으나, 이 문헌에서는 초월적 영역이나 영적 존재를 가리키기도 합니다.
    reason: 문헌의 특수한 우주론 용어를 과도하게 단순화하지 않기 위해서입니다.
  - marker: e
    text: ‘충만’은 신적 실재가 온전히 갖추어진 초월적 영역을 가리키는 이 문헌의 전문 개념입니다.
    reason: 일상적 의미의 충만과 우주론적 전문 의미를 구별하도록 돕기 위해서입니다.
lexical_decisions:
- source_word: Reflection
  choice: 반영
  rationale: 이 문헌의 의인화된 신적 양상을 나타내면서도 원문 증거가 가진 ‘반사·반영’의 의미를 보존했습니다. ‘사유’로 단정하면 별개의 개념과 혼동될 수 있습니다.
- source_word: Providence
  choice: 섭리
  rationale: 의인화된 신적 작용이라는 문맥을 살리며 한국어 종교 문헌에서 널리 이해되는 표현을 사용했습니다.
- source_word: archon
  choice: 아르콘
  rationale: 단순히 ‘통치자’로 옮길 경우 이 문헌의 특수한 우주론적 존재 계층이 흐려지므로 음역하고 각주로 설명했습니다.
- source_word: precognition / foreknowledge
  choice: 선지식
  rationale: 미리 아는 능력 또는 신적 양상을 가리킬 수 있는 모호성을 유지했습니다. ‘예지’보다 개념 명사로서의 성격이 선명합니다.
- source_word: aeons
  choice: 에온들
  rationale: 시간·시대뿐 아니라 초월적 존재 또는 영역을 가리키는 문헌 특유의 의미를 보존하려 음역했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 플레로마 계열의 우주론적 전문 개념을 한국어로 자연스럽게 전달하면서 보통명사와 고유 개념 사이의 긴장을 유지했습니다.
- source_word: polluted
  choice: 더럽히고
  rationale: 행위의 성격을 완곡하게 지우지 않으면서도, 현 단계 영어 증언이 강간을 명시하는지 확정할 수 없으므로 그보다 구체적인 표현은 피했습니다.
- source_word: false spirit
  choice: 거짓 영
  rationale: ‘위조된 영’ 또는 ‘기만하는 영’으로 해석을 좁히지 않고 표현 자체의 신학적 긴장을 보존했습니다.
- source_word: tomb
  choice: 무덤
  rationale: 육체나 물질세계를 비유한다고 해석해 풀어 쓰지 않고 증언의 구체적 은유를 그대로 보존했습니다.
theological_decisions:
- issue: 얄다바오트와 성서의 신명 표현 사이의 관계
  choice: 얄다바오트, 엘로임, 야베를 문헌에 나타난 이름대로 음역했습니다.
  alternative: 엘로힘과 야훼 등 정규 성서 표기로 동질화하기
  rationale: 본문은 이 이름들을 독특한 우주론적 인물들에게 적용하므로, 정경적 호칭과 자동으로 동일시하거나 교단적 판단을 덧붙이지 않았습니다.
- issue: 으뜸 아르콘이 하와를 ‘더럽힌’ 행위의 구체적 성격
  choice: ‘더럽히고’로 번역했습니다.
  alternative: ‘강간하고’ 또는 ‘성관계를 맺고’로 명시하기
  rationale: 문맥에는 성적 폭력의 강한 함의가 있지만, 제공된 영어 증언의 어휘보다 구체적으로 확정하지 않았습니다.
- issue: 생명과 반영과 섭리의 인격성
  choice: 문맥에 따라 여성 대명사의 의미가 드러나게 하되 명칭은 개념어로 유지했습니다.
  alternative: 모두 여신 또는 특정 신격으로 명시하기
  rationale: 본문의 의인화는 보존하되, 직접 콥트어 검토 전에는 존재론적 지위를 추가로 규정하지 않았습니다.
- issue: 마지막 문장의 대명사 지시 대상
  choice: 영이 ‘그’를 일으키고 고친다고 번역했습니다.
  alternative: ‘씨’를 집합적으로 풀어 ‘그들을’이라고 번역하기
  rationale: 영어 증언에서 단수 대명사가 나타나므로 그 불일치를 평탄화하지 않고 보존했습니다.
- issue: 성관계와 육체 생성에 대한 본문의 평가
  choice: 본문의 부정적 우주론을 그대로 전달했습니다.
  alternative: 성관계 일반에 관한 보편 교리로 해설하거나 완화하기
  rationale: 이 대목의 문헌 내부 주장만 번역하며 현대 교단의 성 윤리나 창조론을 끌어들이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 낭독 가능한 품위와 평이성을 함께 추구했습니다. 긴 영어 문장은 한국어 호흡에 맞게 나누되 논리 관계는 유지했습니다. 제공 자료가 공공 영역 영어 증언에 근거하고 직접 콥트어 검토가 보류된 상태이므로, 사본 쪽수 표지 «24»와 «25»는 본문 의미에 속하지 않아 제외했고, 불확실한 성적·우주론적 표현은 해석으로 확정하지 않았습니다.
