  revised_text: '**요한의 비밀서 — 어머니가 회개하다**


    1. 그러나 내가 말했습니다. “주님, ‘그 여자가 이리저리 움직였다’는 것은 무슨 뜻입니까?” 그분은 빙그레 웃으시며 말씀하셨습니다. “그것이 모세가 말한 ‘{물들:2} 위’와 일치한다고 생각하지 마십시오. 아닙니다!


    2. 도리어 그 여자는 일어난 악과 자기 아들이 저지른 도둑질을 보고 회개했습니다. 그는 무지의 어둠 속에서 망각에 휩싸였고 부끄러움을 느끼기 시작했습니다. [그리고 그녀는 감히] 돌아갈 엄두를 내지 못하고, [이리저리 움직이고] 있었습니다.[a]


    3. 그런데 이 움직임이 바로 ‘이리저리 오가는 것’입니다. 그 교만한 자는 자기 어머니에게서 능력을 얻었습니다. 그는 무지하여 자기 어머니 말고는 아무도 존재하지 않는다고 여겼기 때문입니다.


    4. 그러나 그는 자기가 창조한 천사들의 무리를 보자 자신을 그들 위로 높였습니다.


    5. 또한 어머니는 어둠의 옷에 결함이 있음을 깨닫자, 자기 짝이 자신과 뜻을 같이하지 않았음을 알았습니다.


    6. 그녀는 한없이 눈물을 흘리며 회개했고, 온 충만이 그녀의 회개의 기도에 귀를 기울였습니다. 그들은 그녀를 위하여 보이지 않는 처녀인 영을 찬양했습니다.


    7. 그리고 [그분은] 동의하셨습니다.[b] [보이지 않는 영께서] 동의하시자, 거룩한 영이 그들 온 충만으로부터 그 여자 위에 부어졌습니다. 그 여자의 짝이 홀로 그 여자에게 다가간 것이 아니라, 그의 결핍을 바로잡기 위해 충만을 통하여 다가간 것입니다. 그 여자는 들어 올려졌으나 자기 아이온으로 간 것은 아니고 자기 아들보다 높은 곳으로 갔습니다. 그녀가 자기 결핍을 바로잡을 때까지 아홉째에 머물게 하려는 것이었습니다.[c]


    8. 또 높은 하늘의 아이온에서 한 음성이 나왔습니다. “사람이 존재한다. 사람의 아들도 존재한다.” 수석 아르콘 얄다바오트는 그 음성을 엿듣고 그것이 자기 어머니에게서 나왔다고 여겼으나, 어디에서 나왔는지는 알지 못했습니다.


    9. 또한 그분은 그들에게, 곧 거룩하고 완전한 어머니-아버지, 완전한 섭리, 만물의 아버지이신 보이지 않는 분의 형상이며 그분을 통하여 모든 것이 생겨난 태초의 사람에 관하여 가르치셨습니다. 이는 그분이 남성의 형상으로 자신의 모습을 나타내셨기 때문입니다.[d]


    10. 또한 수석 아르콘의 아이온 전체가 흔들리고 심연의 기초들이 움직였습니다. 물질 위에 있는 물들의 밑바닥은 나타난 이 형상의 현현으로 밝아졌습니다. 모든 권세자와 수석 아르콘이 바라보니, 자기들 아래의 온 영역이 밝아진 것이 보였습니다.


    [a] 대괄호 안의 말은 손상되거나 빠진 본문을 복원한 것입니다.


    [b] 원문의 대명사가 누구를 가리키는지 불분명합니다.


    [c] ‘아이온’은 영적 세계나 영원한 영역을 가리키는 이 문헌의 전문 용어입니다. ‘아홉째’는 원문 표현을 문자적으로 옮긴 것이며, 그 정확한 지시 대상은 여기서 확정하지 않습니다.


    [d] 9절은 문장 구조와 각 칭호의 관계가 불분명하여, ‘그분’과 ‘그들’이 가리키는 대상에도 모호함이 남아 있습니다.'
