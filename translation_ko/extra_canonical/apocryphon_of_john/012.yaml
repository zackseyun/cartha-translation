base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/012.yaml
  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: ko
  text: '**요한의 비밀서 — 어머니가 회개하다**


    1. 그러나 내가 말했습니다. “주님, ‘그 여자가 이리저리 움직였다’는 것은 무슨 뜻입니까?” 그분은 빙그레 웃으시며 말씀하셨습니다. “그것이 모세가 말한 ‘{물들:2} 위’와 일치한다고 생각하지 마십시오. 아닙니다!


    2. 도리어 그 여자는 일어난 악과 자기 아들이 저지른 도둑질을 보고 회개했습니다. 그는 무지의 어둠 속에서 망각에 휩싸였고 부끄러움을 느끼기 시작했습니다. [그는 감히] 돌아가지 [못하고 이리저리 움직이고] 있었습니다.[a]


    3. 그런데 이 움직임이 바로 ‘이리저리 오가는 것’입니다. 그 교만한 자는 자기 어머니에게서 능력을 얻었습니다. 그는 무지하여 자기 어머니 말고는 아무도 존재하지 않는다고 여겼기 때문입니다.


    4. 그러나 그는 자기가 창조한 천사들의 무리를 보자 자신을 그들 위로 높였습니다.


    5. 또한 어머니는 어둠의 옷에 결함이 있음을 깨닫자, 자기 짝이 자신과 뜻을 같이하지 않았음을 알았습니다.


    6. 그는 한없이 눈물을 흘리며 회개했고, 충만 전체가 그의 회개의 기도에 귀를 기울였습니다. 그들은 그를 위하여 보이지 않는 동정의 영을 찬양했습니다.


    7. 그리고 [그분은] 동의하셨습니다.[b] [보이지 않는 영께서] 동의하시자, 거룩한 영이 그들 충만 전체로부터 그 여자 위에 부어졌습니다. 그 여자의 짝이 홀로 그에게 다가간 것이 아니라, 그의 결핍을 바로잡기 위해 충만을 통하여 다가간 것입니다. 그 여자는 들어 올려졌으나 자기 아이온으로 간 것은 아니고 자기 아들보다 높은 곳으로 갔습니다. 그곳 아홉째 영역에 머물면서 자기 결핍을 바로잡게 하려는 것이었습니다.[c]


    8. 또 높은 하늘의 아이온에서 한 음성이 나왔습니다. “사람이 존재한다. 사람의 아들도 존재한다.” 수석 아르콘 얄다바오트는 그 음성을 엿듣고 그것이 자기 어머니에게서 나왔다고 여겼으나, 어디에서 나왔는지는 알지 못했습니다.


    9. 또한 그분은 그들에게 거룩하고 완전한 어머니-아버지, 완전한 섭리, 곧 보이지 않는 분의 형상을 알려 주셨습니다. 이분은 만물의 아버지이시며, 그분을 통하여 모든 것이 생겨났습니다. 이분은 태초의 사람이십니다. 그분이 남자의 형상으로 자신의 모습을 나타내셨기 때문입니다.[d]


    10. 그러자 수석 아르콘의 아이온 전체가 흔들리고 심연의 기초들이 움직였습니다. 물질 위에 있는 물들의 밑바닥은 나타난 그 형상의 현현으로 밝아졌습니다. 모든 권세자와 수석 아르콘이 바라보니, 자기들 아래의 온 영역이 밝아진 것이 보였습니다.


    [a] 대괄호 안의 말은 손상되거나 빠진 본문을 복원한 것입니다.

    [b] 원문의 대명사가 누구를 가리키는지 불분명합니다.

    [c] ‘아이온’은 영적 세계나 영원한 영역을 가리키는 이 문헌의 전문 용어입니다. ‘아홉째 영역’은 문자적으로 ‘아홉째’입니다.

    [d] 9절은 문장 구조와 각 칭호의 관계가 불분명하여, ‘그분’이 가리키는 대상에도 모호함이 남아 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 손상되거나 빠진 본문을 복원한 것입니다.
    reason: 본문 비평상의 복원 표시를 독자에게 설명합니다.
  - marker: b
    text: 원문의 대명사가 누구를 가리키는지 불분명합니다.
    reason: 7절 첫 문장의 주어를 확정하지 않고 진정한 모호성을 보존합니다.
  - marker: c
    text: ‘아이온’은 영적 세계나 영원한 영역을 가리키는 이 문헌의 전문 용어입니다. ‘아홉째 영역’은 문자적으로 ‘아홉째’입니다.
    reason: 전문 용어와 공간적 위계 표현을 설명하되 특정 체계로 과도하게 해석하지 않습니다.
  - marker: d
    text: 9절은 문장 구조와 각 칭호의 관계가 불분명하여, ‘그분’이 가리키는 대상에도 모호함이 남아 있습니다.
    reason: 증거 본문의 난해한 통사와 신학적 지시 관계를 투명하게 알립니다.
lexical_decisions:
- source_word: Fullness
  choice: 충만
  rationale: 이 문헌의 우주론적 전문 개념을 보존하면서도 한국어로 이해할 수 있게 옮겼습니다.
- source_word: aeon
  choice: 아이온
  rationale: ‘시대’와 ‘영적 영역’의 의미가 겹치는 전문 용어이므로 한 의미로 축소하지 않고 음역했습니다.
- source_word: archon
  choice: 아르콘
  rationale: 단순한 세속 ‘통치자’와 구별되는 문헌 고유의 우주적 권세를 나타내기 위해 음역했습니다.
- source_word: Mother-Father
  choice: 어머니-아버지
  rationale: 양성적·역설적 호칭의 신학적 긴장을 해소하지 않고 그대로 보존했습니다.
- source_word: Primal Man
  choice: 태초의 사람
  rationale: 시간적 선재성과 원형적 인간이라는 의미를 자연스럽게 전달합니다.
- source_word: garment of darkness
  choice: 어둠의 옷
  rationale: 비유적 이미지를 해석하여 풀지 않고 직역에 가깝게 보존했습니다.
- source_word: deficiency
  choice: 결핍
  rationale: 이 문헌의 구원론적·우주론적 개념을 ‘잘못’이나 ‘죄’로 교리화하지 않았습니다.
- source_word: Providence
  choice: 섭리
  rationale: 인격적 존재 또는 신적 작용일 수 있는 원문의 긴장을 유지하는 전통적이고 이해 가능한 표현입니다.
theological_decisions:
- issue: 7절의 주어와 대명사 지시 대상
  choice: 대괄호와 ‘그분/그 여자’ 표현을 사용하고 모호성을 각주로 밝혔습니다.
  alternative: 모든 주어를 ‘보이지 않는 영’ 또는 ‘그 짝’으로 확정할 수 있습니다.
  rationale: 전승 본문 자체의 대명사 불확실성을 번역자가 임의로 해소하지 않기 위해서입니다.
- issue: 9절의 칭호들과 문장 구조
  choice: 어머니-아버지, 섭리, 보이지 않는 분의 형상, 만물의 아버지, 태초의 사람이라는 칭호의 연쇄를 유지했습니다.
  alternative: 모든 칭호를 하나의 동일한 존재로 명시하거나 일부를 별개 존재로 분리할 수 있습니다.
  rationale: 영어 증거 본문만으로 동격 관계와 지시 대상을 확정하기 어렵기 때문에 원문의 긴장을 보존했습니다.
- issue: ‘holy Spirit’와 ‘unseen, virginal Spirit’
  choice: 각각 ‘거룩한 영’과 ‘보이지 않는 동정의 영’으로 옮겼습니다.
  alternative: 모두 기독교 정경의 고유명사 ‘성령’으로 통일할 수 있습니다.
  rationale: 본문이 두 표현을 동일하게 사용하는지 확정하지 않고, 후대 교리적 동일시를 피했습니다.
- issue: ‘The Man’과 ‘Son of Man’
  choice: ‘사람’과 ‘사람의 아들’로 번역했습니다.
  alternative: ‘인자’를 사용할 수 있습니다.
  rationale: 정경 복음서의 특정 칭호로 선결하지 않고 이 문헌 안의 원형적 인간 언어를 드러냈습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 서술은 존엄하고 읽기 쉽게 다듬었습니다. ‘아이온’과 ‘아르콘’ 같은 문헌 고유의 전문어는 음역하고 문맥 또는 각주로 보완했습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증거 본문을 중심으로 작성한 잠정 초안입니다. 증거 본문의 {물들:2} 표지는 원자료의 비평 표식으로 보존했고, 단순한 쪽수 표지 «14»는 본문에서 제외했습니다.
