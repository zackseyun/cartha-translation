review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증거 본문을 기준으로 검토했습니다(직접 콥트어 대조는 보류 상태). 초안은 전반적 구조와 전문 용어를 잘 보존하지만, 2절과 6절에서 ‘그 여자’를 남성 대명사로 바꾼 오류, 7절에서 ‘그 여자’의 짝이 접근한 대상을 ‘그’로 바꾼 오류가 있어 지시 관계와 의미가 달라졌습니다. 또한 ‘virginal Spirit’을 ‘동정의 영’으로 옮긴 것은 ‘처녀인/동정녀의’라는 뜻을 ‘자비/연민’의 뜻으로 바꾼 오역입니다. 9절은 증거 본문 자체가 난해하므로, 제목들의 관계를 확정하지 않는 문장으로 조정했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지합니다. ‘온 충만’, ‘아홉째’, ‘물질 위에 있는 물들의 밑바닥’처럼 다소 낯선 표현은 문헌의 전문적·우주론적 언어와 증거 본문의 표현을 보존하기 위해 유지했습니다. ‘동정의 영’은 현대 한국어에서 연민을 뜻하므로 자연성과 정확성 모두를 위해 ‘처녀인 영’으로 바로잡았습니다.
  terminology: ‘충만’, ‘아이온’, ‘아르콘’, ‘어머니-아버지’, ‘섭리’, ‘태초의 사람’, ‘결핍’은 유지합니다. ‘holy Spirit’은 교리적 동일시를 피하여 ‘거룩한 영’, ‘unseen, virginal Spirit’은 구별하여 ‘보이지 않는 처녀인 영’으로 옮겼습니다. ‘The Man’과 ‘Son of Man’은 각각 ‘사람’과 ‘사람의 아들’로 유지했습니다.
  issues:
  - severity: high
    issue: 2절에서 여성 주어가 남성 대명사로 바뀌었습니다.
    rationale: 증거 본문은 회개하고 망각과 수치를 겪으며 돌아가지 못하고 움직이는 주체를 일관되게 ‘she’로 지시합니다. 초안의 ‘그는’, ‘그가’는 지시 대상을 바꾸는 명백한 오류입니다.
  - severity: high
