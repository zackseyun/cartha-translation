  text: '2. Further, they created by means of their individual powers, in accordance with their allotted attributes. Each authority provided an attribute by means of the shape of the image he had seen in its psychic (dimension).


    9. However, the host of angels attended him, and they obtained from the authorities the seven substances of the life-soul, so that they could create the sizes of the limbs and the sizes of the torso, and the proper functioning of all the parts with one another.


    10. … However, those especially at work in the limbs are these: the head, Diolimodraza; the neck, Yammeax; the right shoulder, Yakoubib; the left shoulder, Yerton; the right hand, Oudidi; the left (hand), Arbao; the right-hand fingers, Lampno; the left-hand fingers, Leekaphar; the right breast, Barbar; the left breast, Imae; the chest, Pisandraptes; the right shoulder joint, Koade; the left shoulder joint, Odeor; the right ribs, Asphixix; the left ribs, Synogchouta; the belly, Arouph; the womb, Sabalo; the right thigh, Charcharb; the left thigh, Chthaon; all the genitals, Bathinoth; the right leg, Choux; the left leg, Charcha; the right shinbone, Aroer; the left shinbone, Toechtha; the right knee, Aol; the left knee, Charaner; the right foot, Bastan; its toes, Archentechtha; the left foot, Marephnounth; its toes, Abrana.


    17. However, the mother of all of them (is) Esthensis-Ouch-Epi-Ptoe.


    23. However, insight into their reality (comes from) Anaro, the chief of the hylic soul, because it pertains to the seven senses, to Ouch-Epi-Ptoe.


    27. Although I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster.'
translation:
  language: ko
  text: '**요한의 비밀서 — 권세자들이 아담을 만들다**


    1. 또 그들은 빛을 통하여 물속에 있는 형상의 모습을 보았습니다. 그러자 그는 곁에서 시중드는 권세자들에게 말했습니다. “자, 하나님의 형상을 따라, 또 우리의 모습을 따라 사람을 만듭시다. 그러면 그의 형상이 우리에게 빛이 될 것입니다.”


    2. 또 그들은 각자에게 배정된 속성에 따라 저마다의 능력으로 사람을 만들었습니다. 각 권세자는 자신이 그 형상의 혼적 차원에서 본 모습을 따라 한 가지 속성을 부여했습니다.[a]


    3. 그는 완전한 태초 인간의 모습을 따라 하나의 존재를 만들었습니다. 그러자 그들이 말했습니다. “그를 아담이라고 부릅시다. 그러면 그의 이름이 우리에게 빛의 능력이 될 것입니다.” 그리하여 능력들이 일을 시작했습니다.


    4. 첫째인 선함은 살아 있는 뼈를 만들었고, 둘째인 섭리는 살아 있는 힘줄을 만들었습니다.


    5. 셋째인 신성은 살아 있는 살을 만들었고, 넷째인 주권은 살아 있는 골수를 만들었습니다.


    6. 다섯째인 왕권은 살아 있는 피를 만들었습니다.


    7. 여섯째인 질투는 살아 있는 피부를 만들었습니다.


    8. 일곱째인 이해는 살아 있는 털을 만들었습니다.


    9. 그러나 천사들의 무리가 그를 시중들었습니다. 그들은 권세자들에게서 생명 혼의 일곱 물질을 받아, 팔다리와 몸통의 크기를 정하고 모든 부분이 서로 올바르게 기능하게 만들 수 있었습니다.


    10. 첫째가 머리를 만드는 일을 시작했습니다. 에테라파오페-아브론은 그의 머리를 만들었고, 메니게스트로에트는 뇌를, 아스테레크멘은 오른쪽 눈을, 타스포모캄은 왼쪽 눈을, 예로누모스는 오른쪽 귀를, 비숨은 왼쪽 귀를, 아키오레임은 코를, 바넨-에프룸은 입술을, 아멘은 이를, 이비칸은 어금니를, 바실리아데메는 편도선을, 아크카는 목젖을, 아다반은 목을, 카아만은 척추뼈를, 데아르코는 목구멍을, 테바르는 오른쪽 어깨를, N[…는] 왼쪽 어깨를, 므니아르콘은 오른쪽 팔꿈치를, […에는] 왼쪽 팔꿈치를, 아빌리온은 오른쪽 겨드랑이를, 에반텐은 왼쪽 겨드랑이를, 크뤼스는 오른손을, 벨루아이는 왼손을, 트레네우는 오른손 손가락들을, 발벨은 왼손 손가락들을, 크리만은 손톱들을, 아스트롭스는 오른쪽 가슴을, 바로프는 왼쪽 가슴을, 바움은 오른쪽 어깨 관절을, 아라림은 왼쪽 어깨 관절을, 아레케는 배를, 프타베는 배꼽을, 세나핌은 복부를, 아라케토피는 오른쪽 갈비뼈들을, 자베도는 왼쪽 갈비뼈들을, 바리아스는 오른쪽 엉덩이를, 프누트는 왼쪽 엉덩이를 만들었습니다.


    아벤레나르케이는 골수를, 크누메니노린은 뼈들을, 게솔레는 위를, 아그로마우마는 심장을, 바노는 폐를, 소스트라팔은 간을, 아네시말라르는 지라를, 토피트로는 창자를, 비블로는 콩팥을, 로에로르는 힘줄을, 타프레오는 몸의 척추를, 이푸스포보바는 정맥을, 비네보린은 동맥을 만들었습니다. 아아토이멘프세페이에게는 모든 지체의 숨이 속하고, 엔톨레이아에게는 모든 살이 속합니다. 베두크는 오른쪽 {아랫부분}을, 아라베이는 왼쪽 음경을, 에일로는 쌍을, 소르마는 생식기를, 고르마-카이오클라바르는 오른쪽 넓적다리를, 네브리트는 왼쪽 넓적다리를, 프세렘은 오른쪽 다리의 콩팥들을, 아사클라스는 왼쪽 콩팥을, 오르마오트는 오른쪽 다리를, 에메눈은 왼쪽 다리를, 크뉙스는 오른쪽 정강이뼈를, 투펠론은 왼쪽 정강이뼈를, 아키엘은 오른쪽 무릎을, 프네메는 왼쪽 무릎을, 피우트롬은 오른발을, 보아벨은 그 발가락들을, 트라쿤은 왼발을, 피크나는 그 발가락들을, 미아마이는 발톱들을, 라베르니움은 […]을 만들었습니다.[b]


    그러나 이 모든 것 위에 세워진 자들은 일곱입니다. 아토트, 아르마스, 칼릴라, 야벨, 사바오트, 카인, 아벨입니다. 지체들에서 특별히 작용하는 자들은 이러합니다. 머리에는 디올리모드라자, 목에는 얌메악스, 오른쪽 어깨에는 야쿠비브, 왼쪽 어깨에는 예르톤, 오른손에는 우디디, 왼손에는 아르바오, 오른손 손가락들에는 람프노, 왼손 손가락들에는 레에카파르, 오른쪽 가슴에는 바르바르, 왼쪽 가슴에는 이마에, 흉부에는 피산드랍테스, 오른쪽 어깨 관절에는 코아데, 왼쪽 어깨 관절에는 오데오르, 오른쪽 갈비뼈들에는 아스픽식스, 왼쪽 갈비뼈들에는 쉬노그쿠타, 배에는 아루프, 자궁에는 사발로, 오른쪽 넓적다리에는 카르카르브, 왼쪽 넓적다리에는 크타온, 모든 생식기에는 바티노트, 오른쪽 다리에는 쿠스, 왼쪽 다리에는 카르카, 오른쪽 정강이뼈에는 아로에르, 왼쪽 정강이뼈에는 토에크타, 오른쪽 무릎에는 아올, 왼쪽 무릎에는 카라네르, 오른발에는 바스탄, 그 발가락들에는 아르켄테크타, 왼발에는 마레프눈트, 그 발가락들에는 아브라나가 작용합니다.


    11. 이 모든 것에 권력을 행사하는 자들은 일곱입니다. 미카엘, 우리엘, 아스메네다스, 사파사토엘, 아르무리암, 리크람, 아미오르프스입니다.


