translation:
  language: ko
  text: '외경 요한서 — 요한과 바리새인


    1. [그] 구원자의 가르침, 신비들의 [계시], [그리고] 침묵 속에 감추어진 말씀, 곧 그가 [자기] 제자 요한에게 가르친 [이 말씀들]입니다.[a]


    2. [그런데 어느 날] 세베대의 아들들인 야고보의 [형제] 요한이 성전으로 올라갔을 때, 아리마니오스라는 바리새인이 그에게 [다가와] 말했습니다. “네가 따르던 [선생은 어디] 있느냐?”


    3. 요한이 그에게 [대답했습니다]. “그분은 자신이 오신 [곳]으로 돌아가셨습니다.”


    4. 바리새인이 [그에게 말했습니다. “이 나사렛 사람이 속임수로] 너희 모두를 미혹했고, [너희 귀를 거짓말로 가득 채웠으며], [너희 마음을 닫아] 너희를 조상들의 전통에서 [돌아서게 했다].”


    5. [그때] 나, [요한은], 이 말을 듣고 [성전을 떠나] 산이 많은 광야로 향했습니다. 그리고 마음속으로 [몹시 탄식하며 물었습니다].


    6. “구원자는 어떻게 [세워지셨으며], 어째서 [그의 아버지께서 세상으로] 그를 보내셨는가? 그를 [보내신 그의] 아버지는 누구시며, [우리가 가게 될 곳은] 어떤 아이온인가?[b]


    7. 왜냐하면 그분이 우리에게 ‘[너희가 가게 될] 그 아이온은 [멸망하지 않는] 아이온이다’라고 말씀하신 것은 무슨 뜻인가?


    8. [그러나 그분은 그것이 어떤 것인지] 우리에게 알려 주지 않으셨다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 사본의 손상되거나 빠진 부분을 편집자가 복원한 것입니다. 이 번역은 나그함마디 문서 II,1·III,1·IV,1과 베를린 코덱스 8502,2에 근거한 공개 영역 영어 대조문을 토대로 한 잠정 번역이며, 콥트어 원문에 대한 직접 검토는 아직 이루어지지 않았습니다.
    reason: 본문의 불완전한 전승 상태와 현재 번역의 자료적 한계를 밝힙니다.
  - marker: b
    text: ‘아이온’은 문맥에 따라 ‘시대’, ‘영원’, 또는 초월적인 ‘세계·영역’을 뜻할 수 있습니다. 여기서는 어느 한 뜻으로 한정하지 않기 위해 음역했습니다.
    reason: 문헌의 핵심 우주론 용어가 지닌 의미 범위를 보존합니다.
lexical_decisions:
- source_word: savior
  choice: 구원자
  rationale: 기독교 문헌에서 익숙하면서도 원문의 칭호 성격을 자연스럽게 보존합니다.
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌에서 시간적 ‘시대’와 초월적 ‘영역/세계’의 뜻이 겹칠 수 있으므로 하나로 확정하지 않고 음역했습니다.
- source_word: appointed
  choice: 세워지셨으며
  rationale: 임명·설정·성립 가능성을 열어 두면서 한국어 문맥에서 자연스러운 표현을 택했습니다.
- source_word: dispatched
  choice: 보내셨는가
  rationale: 파송의 뜻을 살리되 특정 교리적 전문 용어를 덧씌우지 않았습니다.
- source_word: sealed off your hearts
  choice: 너희 마음을 닫아 버려
  rationale: 마음을 봉쇄하여 받아들이지 못하게 했다는 비유를 자연스러운 한국어로 전달합니다.
- source_word: traditions of your fathers
  choice: 조상들의 전통
  rationale: 혈연상의 아버지들보다 선대에게 물려받은 종교적 전승을 가리키는 문맥을 반영합니다.
theological_decisions:
- issue: ‘아이온’의 의미
  choice: 본문에서는 ‘아이온’으로 음역하고 각주에서 의미 범위를 설명했습니다.
  alternative: ‘시대’, ‘영원’, ‘세계’ 또는 ‘영역’으로 번역할 수 있습니다.
  rationale: 이 대목의 우주론적·시간적 중의성을 단일 한국어로 해소하지 않기 위해서입니다.
- issue: 구원자가 어떻게 ‘appointed’ 되었는지에 관한 질문
  choice: ‘어떻게 세워지셨으며’로 옮겼습니다.
  alternative: ‘어떻게 임명되셨으며’ 또는 ‘어떻게 정해지셨으며’로 옮길 수 있습니다.
  rationale: 구원자의 기원이나 지위를 특정 교리 체계에 따라 미리 규정하지 않고 원문의 질문과 긴장을 보존합니다.
- issue: 결락 복원문의 지위
  choice: 대괄호를 그대로 보존했습니다.
  alternative: 복원된 내용을 괄호 없이 매끄러운 본문으로 제시할 수 있습니다.
  rationale: 사본 손상으로 인해 편집적으로 보충된 부분과 직접 보존된 본문을 독자가 구별할 수 있게 합니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술과 대화는 일반 독자가 이해하기 쉽게 다듬되, 사본 복원 표시는 유지했습니다. 요한의 독백 마지막 문장은 인용된 내적 탄식의 흐름을 살려 ‘-는가/-않으셨다’ 문체로 처리했습니다. 신명과 인명은 국내 독자에게 익숙한 형태를 따랐고, ‘아이온’은 의도적으로 음역했습니다.
