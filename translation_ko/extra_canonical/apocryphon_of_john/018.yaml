  revised_text: '**요한의 비밀서 — 영혼들의 운명**


    1. 나는 또 구원자께 여쭈었습니다. “주님, 그렇다면 모든 영혼이 순수한 빛으로 안전하게 인도됩니까?”


    2. 그분이 내게 대답하셨습니다. “그대의 마음에 위대한 물음들이 떠올랐습니다. 움직이지 않는 족속에게 속한 이들을 제외하면, 다른 이들에게 이것들을 설명하기가 어렵기 때문입니다.


    3. 생명의 영이 내려앉아 능력을 주는 이들은 구원받아 온전해질 것입니다. 그들은 위대함에 합당하게 될 것이며, 그곳에서 모든 악과 악에 가담한 일에서 깨끗해질 것입니다.


    4. 그러므로 그들은 오직 썩지 않음에만 마음을 두고 이제부터 거기에 전념할 것입니다. 분노도 시기도 질투도 없고, 무엇을 향한 욕정이나 탐욕도 없을 것입니다. 그들을 괴롭히는 것은 육신으로 존재하는 처지뿐이며, 그들은 영접하는 자들이 자신들을 맞이할 때를 고대하며 그 처지를 견딜 것입니다.[a]


    5. 그러므로 이런 이들은 썩지 않는 영원한 생명과 선택받음에 합당합니다. 그들은 경주를 끝마치고 영원한 생명을 상속받기 위해 모든 것에 맞서고 모든 것을 견디기 때문입니다.”


    6. 나는 그분께 여쭈었습니다. “주님, 능력과 생명의 영이 내려왔지만 이런 일들을 행하지 않은 이들의 영혼은 [버림받습니까]?”[b]


    7. 그분이 내게 대답하셨습니다. “그들에게 영이 내려왔다면, 그럼에도 그들은 구원받고 바로잡힐 것입니다. 능력이 모든 사람에게 내려올 것이며, 그것 없이는 아무도 견딜 수 없기 때문입니다.


    8. 그러나 태어난 뒤 생명의 영이 자라고 능력이 와서 그 영혼을 강하게 하면, 아무도 악한 행위로 그 영혼을 미혹할 수 없을 것입니다.


    9. 그러나 거짓 영이 내려오는 이들은 그 영에게 끌려가 미혹됩니다.”


    10. 나는 여쭈었습니다. “주님, 그들의 영혼이 육신을 떠나면 어디로 갑니까?”


    11. 그분은 빙그레 웃으시며 내게 말씀하셨습니다. “능력이 사악한 영보다 더 강해진 영혼은—그 능력이 강하고 악에서 달아나므로—썩지 않는 이의 개입으로 구원받아 아이온들의 안식처로 올라갈 것입니다.”[c]


    12. 나는 여쭈었습니다. “주님, 자신이 누구에게 속했는지 알지 못했던 이들의 영혼은 어디에 머뭅니까?”


    13. 그분이 내게 말씀하셨습니다. “그들 안에서 사악한 영이 강해졌을 때, 그들은 미혹되었습니다. 그 영은 영혼을 짓눌러 악한 행위로 끌고 가며 망각 속으로 내던집니다. 영혼이 육신을 떠난 뒤에는 아르콘에게서 생겨난 권세들에게 넘겨집니다. 그들은 영혼을 사슬로 묶어 감옥에 던지고, 영혼이 망각에서 깨어나 지식을 얻을 때까지 데리고 다닙니다. 영혼이 이런 방식으로 온전해지면 구원받을 것입니다.”[d]


    14. 나는 여쭈었습니다. “주님, 영혼이 어떻게 작아져서 자기 어머니의 본래 상태나 사람 안으로 돌아갈 수 있습니까?”[e]


    15. 내가 이렇게 묻자 그분은 기뻐하시며 내게 말씀하셨습니다. “참으로 그대는 복됩니다. 그런 영혼이 생명의 영이 거하는 다른 이를 뒤잇게 된다는 것을 깨달았기 때문입니다.[f]


    16. 그 영혼은 그를 통하여 구원받을 것입니다.


    17. 다시 다른 육신 속으로 던져지지 않을 것입니다.”


    18. 나는 또 여쭈었습니다. “주님, 알기는 했으나 돌아선 이들의 영혼은 어디로 갑니까?”


    19. 그분이 내게 말씀하셨습니다. “그들은 궁핍의 천사들이 가는 곳, 회개가 없는 곳으로 끌려갈 것입니다. 그리고 영을 모독한 이들이 고통받을 날까지 갇혀 있다가, 한 시대 동안 형벌을 받을 것입니다.”[g]'
