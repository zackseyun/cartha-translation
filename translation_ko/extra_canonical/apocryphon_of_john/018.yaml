  - marker: a
    text: ‘영접하는 자들’은 영혼을 맞이하는 존재들을 가리키는 것으로 보이지만, 그 정확한 신분은 본문에서 밝히지 않습니다.
    reason: 전문적 우주론 용어의 불확실한 지시 대상을 설명하되, 본문에 없는 천상적 정체를 덧붙이지 않습니다.
  - marker: b
    text: ‘버림받습니까’는 손상되거나 불확실한 본문을 보충한 말입니다. 또한 ‘능력과 생명의 영’의 ‘과’도 편집자가 보충한 말입니다.
    reason: 원 증언의 복원 부호와 편집자 삽입 부호를 독자에게 알립니다.
  - marker: c
    text: ‘아이온’은 이 문헌에서 영원한 시대 또는 초월적 영역을 가리킬 수 있는 용어입니다. 여기서는 그 중의성을 보존하기 위해 음역했습니다.
    reason: 핵심 우주론 용어의 의미 범위를 보존합니다.
  - marker: d
    text: ‘아르콘’은 지배자 또는 통치자를 뜻하며, 여기서는 하위 세계의 지배적 존재를 가리키는 문헌의 전문 용어로 보존했습니다.
    reason: 일반 명사와 문헌 특유의 우주론적 용법을 구별합니다.
  - marker: e
    text: 이 질문의 문장은 전승된 형태로 뜻이 불분명합니다. ‘작아져서’, ‘어머니의 본래 상태’, ‘사람 안으로’가 정확히 무엇을 뜻하는지는 확정하기 어렵습니다.
