    reason: 원 증언의 복원 부호와 편집자 삽입 부호를 독자에게 알립니다.
  - marker: c
    text: ‘아이온’은 이 문헌에서 영원한 시대 또는 초월적 영역을 가리킬 수 있는 용어입니다. 여기서는 그 중의성을 보존하기 위해 음역했습니다.
    reason: 핵심 우주론 용어의 의미 범위를 보존합니다.
  - marker: d
    text: ‘아르콘’은 지배자 또는 통치자를 뜻하며, 여기서는 하위 세계의 지배적 존재를 가리키는 문헌의 전문 용어로 보존했습니다.
    reason: 일반 명사와 문헌 특유의 우주론적 용법을 구별합니다.
  - marker: e
    text: 이 질문의 문장은 전승된 형태로 뜻이 불분명합니다. ‘작아져서’, ‘어머니의 본래 상태’, ‘사람 안으로’가 정확히 무엇을 뜻하는지는 확정하기 어렵습니다.
    reason: 난해한 원문을 번역에서 임의로 해소하지 않았음을 밝힙니다.
  - marker: f
    text: ‘다른 이를 뒤잇게 된다’는 표현은 의미가 불분명하며, 다른 사람 안에서 이어지는 삶이나 다른 육신으로의 옮겨짐을 암시할 수 있습니다. 본문 자체가 이를 명확히 설명하지 않으므로 단정하지 않았습니다.
    reason: 재육화와 영적 계승 사이의 해석상 긴장을 보존합니다.
  - marker: g
    text: ‘한 시대 동안’은 끝없는 영원과 일정한 시대적 기간 가운데 어느 쪽을 뜻하는지 논쟁의 여지가 있는 표현을 그대로 살린 것입니다.
    reason: 형벌 기간에 관한 신학적 해석을 번역으로 확정하지 않습니다.
lexical_decisions:
- source_word: unmoving race
  choice: 움직이지 않는 족속
  rationale: 문헌의 집단 명칭이 지닌 낯섦과 문자적 이미지를 보존하면서 ‘인종’이 불러올 현대적 오해를 피했습니다.
- source_word: indestructibility
  choice: 썩지 않음
  rationale: 불멸성보다 원문의 파괴·소멸 불가능성에 가까운 성격을 드러내고 성서적 한국어 문체에도 자연스럽게 맞췄습니다.
- source_word: Greatness
  choice: 위대함
  rationale: 신적 실재나 영역일 가능성을 열어 두기 위해 추상 명사의 형태를 보존했습니다.
- source_word: receivers
  choice: 맞아들이는 자들
  rationale: 특정 천사 계급으로 단정하지 않고 기능적 의미만 전달했습니다.
- source_word: vile spirit
  choice: 사악한 영
  rationale: ‘비천한’보다 문맥상 도덕적 악성과 생명의 영과의 대조를 분명히 전달합니다.
- source_word: aeons
  choice: 아이온들
  rationale: 시대와 초월적 영역이라는 복합적 전문 의미를 하나로 축소하지 않기 위해 음역했습니다.
