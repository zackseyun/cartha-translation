translation:
  language: ko
  text: '1. 그는 붙잡아, 지금도 존재하는 빛나는 불꽃으로 자신을 위해 더 많은 아이온들을 창조했습니다. 그는 자기 안의 교만에 사로잡혀 경탄했고, 자신을 위해 권세들을 낳았습니다.


    4. 첫째의 이름은 아토트이며, 세대들은 그를 [수확하는 자]라고 부릅니다.[a]


    5. 둘째는 하르마스이며, [악한] [{눈:1}]입니다.[b]


    6. 셋째는 칼릴라-움브리입니다.


    7. 넷째는 야벨입니다.


    8. 다섯째는 아도나이우이며, 사바오트라고 불립니다.


    9. 여섯째는 카인이며, 인류의 세대들은 그를 태양이라고 부릅니다.


    10. 일곱째는 아벨입니다.


    11. 여덟째는 아브리세네입니다.


    12. 아홉째는 요벨입니다.


    13. 열째는 아르무피엘입니다.


    14. 열한째는 멜케이르-아도네인입니다.


    15. 열두째는 벨리아스이며, 하데스의 깊은 곳들을 다스립니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호는 전승 본문의 보충 또는 복원 표시를 그대로 옮긴 것입니다.
    reason: 제공된 증언의 편집 표지를 독자가 본문 자체로 오해하지 않도록 설명합니다.
  - marker: b
    text: ‘[{눈:1}]’은 제공된 영어 증언에 들어 있는 불확실한 복원·주석 표기를 그대로 보존한 것입니다. 콥트어 사본을 직접 대조하기 전에는 확정하기 어렵습니다.
    reason: 손상되거나 편집적으로 표시된 구절의 불확실성을 숨기지 않기 위해서입니다.
  - marker: c
    text: ‘다스립니다’로 옮긴 표현은 공간적으로 ‘하데스의 깊은 곳들 위에 있습니다’라는 뜻일 수도 있습니다.
    reason: 영어 증언 ‘is over’의 통치적·공간적 양의성을 보존합니다.
lexical_decisions:
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌의 고유한 우주론적 존재·영역을 가리키므로 일반어인 ‘시대들’로 환원하지 않고 음역했습니다.
- source_word: authorities
  choice: 권세들
  rationale: 인격적 우주 통치자들을 가리키는 문맥을 살리면서 원 증언의 복수형을 보존했습니다.
- source_word: the generations
  choice: 세대들
  rationale: 집단 또는 후대 사람들을 뜻할 수 있는 원 증언의 표현을 구체화하지 않고 그대로 유지했습니다.
- source_word: the deeps of Hades
  choice: 하데스의 깊은 곳들
  rationale: 고유한 저승 개념인 하데스를 음역하고 복수의 ‘깊은 곳들’을 보존했습니다.
- source_word: was astounded
  choice: 경탄했고
  rationale: 놀람과 자기 도취가 함께 암시되는 문맥에서, 부정적 의미를 본문에 과도하게 덧붙이지 않는 표현을 택했습니다.
theological_decisions:
- issue: 아이온의 존재론적 성격
  choice: ‘아이온들’로 음역
  alternative: ‘영겁들’, ‘세계들’, ‘신적 존재들’
  rationale: 원 증언만으로 존재, 시대, 영역 가운데 하나로 단정하지 않고 이 문헌의 전문 용어로 남겼습니다.
- issue: 권세들의 인격성
  choice: ‘권세들을 낳았습니다’
  alternative: ‘통치 영역들을 만들어 냈습니다’
  rationale: 이후 이름이 열거되는 인격적 존재라는 문맥과 ‘begot’의 출생 비유를 보존했습니다.
- issue: 벨리아스와 하데스의 관계
  choice: ‘하데스의 깊은 곳들을 다스립니다’
  alternative: ‘하데스의 깊은 곳들 위에 있습니다’
  rationale: ‘is over’의 통치 의미가 문맥상 자연스럽지만 공간적 의미도 가능하므로 각주로 여지를 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 고유명사는 제공된 영어 증언을 기준으로 한국어 음역했으며, 콥트어 원문 검토가 아직 이루어지지 않았으므로 잠정적입니다. 절 번호 2–3의 누락은 제공 자료의 번호 체계를 그대로 따른 것입니다. 요벨 뒤의 «11»은 영어 POB의 감사된 판단에 따라 사본 쪽수 표지로 보고 본문에서 제외했습니다.
