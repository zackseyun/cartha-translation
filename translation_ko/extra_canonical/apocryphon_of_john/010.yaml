    rationale: ‘over’는 통치적 의미뿐 아니라 위치·관할의 의미도 가질 수 있으므로, 본문은 ‘위에 있습니다’로 두어 양의성을 보존하는 편이 안전합니다.
  - severity: low
    issue: 1절의 ‘사로잡혀’와 ‘경탄했고’는 원문의 의미 관계를 다소 바꿉니다.
