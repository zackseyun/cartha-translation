review_pass:
  verdict: revise
  source_fidelity: 첫 문장에서 영어 증언의 ‘grasped’가 한국어 초안에서는 목적어·의미 관계가 불분명한 채 처리되어 있습니다. 또한 15절의 ‘is over’를 ‘다스립니다’로 단정하면 공간적 관계도 가능한 원문의 양의성이 본문에서 사라집니다. 이를 각각 ‘붙잡고/그것으로’ 및 ‘위에 있습니다’로 고쳐 증언의 표현 범위와 불확실성을 보존했습니다.
  naturalness: ‘자기 안의 교만에 사로잡혀 경탄했고’는 원문에 없는 ‘사로잡혀’를 더하고 교만이 경탄의 대상인 듯 들릴 수 있습니다. ‘자신 안에 있는 교만 때문에 놀랐습니다’로 현대 표준 합쇼체에서 자연스럽게 정리했습니다. ‘수확하는 자’는 호칭으로 다소 부자연스러워 ‘거두는 자’로 조정했습니다.
  terminology: 아이온, 권세들, 하데스는 이 문헌의 우주론 및 고유 개념을 보존하는 적절한 선택입니다. 고유명사 음역과 손상·복원 표기([ ], [{눈:1}])도 제공된 영어 증언에 맞춰 유지했습니다.
  issues:
