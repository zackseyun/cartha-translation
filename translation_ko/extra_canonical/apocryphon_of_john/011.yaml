  revised_text: '**요한의 비밀서 — 일곱 왕**


    1. 그는 또 일곱 왕을 세웠습니다. 각 왕은 일곱 하늘 위의 하늘 궁창들에 상응했습니다. 또 심연의 깊은 곳 위에는 다섯 왕을 세워 다스리게 했습니다.


    2. 그는 또 자기 불을 그들에게 나누어 주었지만, 어머니에게서 얻은 빛의 능력에서는 아무것도 내보내지 않았습니다. 그는 무지한 어둠이기 때문입니다. 빛이 어둠과 결합하자 어둠을 빛나게 했고, 어둠이 빛과 결합하자 빛을 어둡게 했습니다. 그리하여 그것은 빛도 어둠도 아닌 것이 되어 흐릿해졌습니다.


    3. 그 무력한 아르콘[a]에게는 세 이름이 있습니다. 첫째 이름은 얄다바오트이고, 둘째는 사클라스이며, 셋째는 사마엘입니다. 그는 자기 안에 있는 교만 때문에 악합니다. 그가 “나는 신이다. 나 말고 다른 신은 없다”라고 말했기 때문입니다. 그는 자기 능력과 자기가 생겨난 곳을 알지 못합니다.


    4. 아르콘들은 또 자신들을 위해 일곱 권능을 만들었고, 각 권능은 자신들을 위해 여섯 천사를 만들었습니다. 그리하여 그들의 수는 365 천사가 되었습니다. 그 이름들에 속한 몸은 다음과 같습니다.


    5. 첫째 ‹는› 아토트입니다. 그는 양의 얼굴을 지녔습니다. 둘째는 엘로아이우입니다. 그는 나귀의 얼굴을 지녔습니다. 셋째는 아스타파이오스입니다. 그는 [하이에나]의 얼굴을 지녔습니다. 넷째는 야오입니다. 그는 머리가 일곱인 [용]의 얼굴을 지녔습니다. 다섯째는 사바오트입니다. 그는 용의 얼굴을 지녔습니다. 여섯째는 아도닌입니다. 그는 원숭이의 얼굴을 지녔습니다. 일곱째는 사베데입니다. 그는 타오르는 불의 얼굴을 지녔습니다.


    6. 이들은 한 주의 일곱 겹 양상입니다.[b]


    7. 그러나 얄다바오트는 다른 모든 자보다 더 많은 얼굴을 지니고 있었습니다. 그래서 그는 세라핌 가운데 있을 때, 자기가 원하는 대로 그들 모두 앞에서 어떤 얼굴이든 취할 수 있었습니다.


    8. 그는 자기 불을 그들에게 나누어 주었기 때문에 그들의 지배자가 되었습니다.


    9. 그는 어머니의 빛으로 말미암아 지니게 된 영광스러운 능력 때문에 스스로를 신이라 불렀고, 자기가 생겨난 곳에 순종하지 않았습니다.


    10. 그는 또 자기 생각 안에서 일곱 권능을 자기와 함께 있던 권세들과 결합했습니다. 그가 말하자 그대로 이루어졌고, 그는 가장 높은 것부터 시작하여 각 권능에 이름을 붙였습니다.


    11. 첫째는 첫째 권세인 아토트와 함께하는 선함입니다. 둘째는 둘째 권세인 엘로아이오와 함께하는 섭리입니다. 셋째는 셋째 권세인 아스트라파이오와 함께하는 신성입니다. 넷째는 넷째 권세인 야오와 함께하는 주권입니다. 다섯째는 다섯째 권세인 사바오트와 함께하는 왕권입니다. 여섯째는 여섯째 권세인 아도네인과 함께하는 질투입니다. 일곱째는 일곱째 권세인 사바테온과 함께하는 소피아[c]입니다.


    12. 이들에게도 각각의 천상 에온[d]에 상응하는 궁창이 있습니다.


    13. 그들은 하늘 존재들의 영광에 상응하는 이름을 받았는데, 이는 권능들의 [소멸을 가져오도록] 하기 위한 것이었습니다. 그러나 그들의 창조자가 [그들에게] 준 이름들에는 능력이 깃들어 있었습니다. 반면 하늘 존재들의 영광에 따라 그들에게 주어진 이름들은 그들에게 소멸과 무력함을 뜻하게 될 것입니다.


    14. 이처럼 그들에게는 이름이 둘씩 있습니다.


    15. [또, 그가] [모든 것을 창조한 뒤 그것들을 배열하여], 먼저 생겨난 에온들의 모양에 따라 그것들을 파괴될 수 없는 존재들을 본떠 만들 수 있도록 했습니다.


    16. 그가 자기 안에서 세계의 형상을 생겨나게 한 것은 파괴될 수 없는 존재들을 보았기 때문이 아니라, 어머니에게서 얻은 자기 안의 능력 때문이었습니다. 그는 그에게서 나온 자기 주위의 창조물과 천사들의 무리를 보고 그들에게 이렇게 선언했습니다. “나는 질투하는 신이다. 나 말고 다른 신은 없다.”


    17. 그러나 그는 이렇게 선언함으로써 자기를 섬기는 천사들에게 다른 신이 있음을 내비쳤습니다. 다른 이가 없다면, 어떻게 다른 이를 질투할 수 있겠습니까?


    18. 그때 어머니는 자기 빛의 광채가 줄어드는 가운데 결핍을 깨닫고 “‘앞뒤로 {move:3}’ 움직이기” 시작했습니다.[e] 그녀는 자기 짝이 자기와 뜻을 같이하지 않았기 때문에 어두워졌습니다.'
