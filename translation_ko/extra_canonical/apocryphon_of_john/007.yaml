  text: '1. Eternal Life also, with his Will, and Mind with Precognition, attended and praised the unseen Spirit and Barbelo, given that they had come into being on her account.


    2. The holy Spirit also completed the self-generated God, his Son, together with Barbelo, so that he would attend the great and unseen, virginal Spirit of the self-generated God, the Christ, whom he had praised with a loud voice.


    3. He came forth by means of Providence, and the unseen, virginal Spirit appointed the truly self-generated God over the All.


    4. He also subjected every authority under him, as well as the truth to be inside him, so that he would know the All, he who had been named with a name exalted above every name, because that name will be spoken to those who deserve it,


    5. given that from Light, which is Christ, and Indestructibility, by means of the gift of the Spirit and the four [great] lights from the self-generated God [...]. He waited for them to attend «8» him,


    6. even the three: Will, Idea, and Life,


    7. even the four powers: Understanding, Grace, Perception, and Discretion.


    8. Further, Grace pertains to the light-aeon Armozel—who is the first angel—and there are three more aeons together with this aeon: Grace, Truth, and Form;


    9. also the second light, Oriael, who had been appointed over the second aeon.


    10. Further, there are three more aeons together with him: Reflection, Perception, and Memory.


    11. Further, the third light is Daveithai, who has been appointed over the third aeon, and there are three more aeons together with him: Understanding, Love, and Ideal Form.


    12. Further, the fourth aeon was appointed over the fourth light, Eleleth.


    13. Further, there are three more aeons together with him: Perfection, Peace, and Sophia.


    14. These are the four lights who attend the self-generated God.


    15. These are the twelve aeons who attend the Son of the Mighty One, the self-generated, Christ, by means of the will and the gift of the unseen Spirit, and the twelve aeons pertain to the self-generated Son.


    16. Further, everything was established by means of the will of the holy Spirit, by means of the self-generated one.'
translation:
  language: ko
  text: '1. 영원한 생명도 그의 뜻과 함께, 또 생각은 예지와 함께 보이지 않는 영과 바르벨로를 섬기며 찬양했습니다. 그들이 바르벨로로 말미암아 생겨났기 때문입니다.


    2. 거룩한 영도 바르벨로와 함께 스스로 생겨난 하나님, 곧 자기 아들을 완성하여, 그가 위대하고 보이지 않는 처녀 영을 섬기게 했습니다. 그는 스스로 생겨난 하나님 곧 그리스도이며, 그를 그 영이 큰 소리로 찬양했습니다.[a]


    3. 그는 섭리를 통하여 나왔고, 보이지 않는 처녀 영은 참으로 스스로 생겨난 하나님을 만물 위에 세웠습니다.


    4. 또한 모든 권세를 그의 아래에 복종시키고 진리가 그의 안에 있게 하여, 그가 만물을 알게 했습니다. 그는 모든 이름 위에 높여진 이름으로 불렸으니, 그 이름은 합당한 이들에게 알려질 것입니다.


    5. 빛, 곧 그리스도와 불멸성으로부터, 영의 선물과 스스로 생겨난 하나님에게서 나온 네 [위대한] 빛을 통하여 […] 그는 그들이 자기를 섬기기를 기다렸습니다.[b]


    6. 곧 세 가지는 뜻과 관념과 생명이며,


    7. 네 능력은 이해와 은혜와 지각과 분별입니다.


    8. 또 은혜는 빛의 아이온 아르모젤에게 속합니다. 그는 첫째 천사입니다. 이 아이온과 함께 세 아이온이 더 있으니, 은혜와 진리와 형상입니다.


    9. 또 둘째 빛은 오리엘이며, 그는 둘째 아이온 위에 세워졌습니다.


    10. 그와 함께 세 아이온이 더 있으니, 성찰과 지각과 기억입니다.


    11. 또 셋째 빛은 다베이타이이며, 그는 셋째 아이온 위에 세워졌습니다. 그와 함께 세 아이온이 더 있으니, 이해와 사랑과 원형입니다.


    12. 또 넷째 아이온은 넷째 빛 엘렐렛 위에 세워졌습니다.[c]


    13. 그와 함께 세 아이온이 더 있으니, 완전함과 평화와 소피아입니다.


    14. 이들이 스스로 생겨난 하나님을 섬기는 네 빛입니다.


    15. 이들이 보이지 않는 영의 뜻과 선물을 통하여 능하신 분의 아들, 곧 스스로 생겨난 이인 그리스도를 섬기는 열두 아이온입니다. 이 열두 아이온은 스스로 생겨난 아들에게 속합니다.


    16. 또 모든 것은 거룩한 영의 뜻을 통하여, 스스로 생겨난 이를 통하여 세워졌습니다.


    [a] 이 문장은 대명사의 지시 대상과 ‘스스로 생겨난 하나님’, ‘그리스도’, ‘처녀 영’ 사이의 문법적 관계가 불분명합니다. 번역은 원문의 긴장을 보존했습니다.

    [b] 이 대목은 사본이 훼손되어 문장이 완전하지 않습니다. 대괄호는 보충된 말이고, […]는 본문의 결락을 나타냅니다.

    [c] 앞 절들의 배열과 달리, 현존 본문은 ‘넷째 빛이 넷째 아이온 위에’가 아니라 ‘넷째 아이온이 넷째 빛 위에’ 세워졌다고 말합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 대명사의 지시 대상과 ‘스스로 생겨난 하나님’, ‘그리스도’, ‘처녀 영’ 사이의 문법적 관계가 불분명합니다. 번역은 원문의 긴장을 보존했습니다.
    reason: 복수의 가능한 통사 분석을 하나로 확정하지 않았음을 알립니다.
  - marker: b
    text: 이 대목은 사본이 훼손되어 문장이 완전하지 않습니다. 대괄호는 보충된 말이고, […]는 본문의 결락을 나타냅니다.
    reason: 5절의 단절된 구문과 편집 기호를 설명합니다.
  - marker: c
    text: 앞 절들의 배열과 달리, 현존 본문은 ‘넷째 빛이 넷째 아이온 위에’가 아니라 ‘넷째 아이온이 넷째 빛 위에’ 세워졌다고 말합니다.
    reason: 평행 구조와 어긋나는 본문을 임의로 교정하지 않았음을 밝힙니다.
lexical_decisions:
- source_word: self-generated (Coptic source review pending)
  choice: 스스로 생겨난
  rationale: 전문적인 음역어나 특정 교파의 술어를 피하면서 ‘자기 기원적 존재’라는 표현의 의미를 비교적 투명하게 전달합니다.
- source_word: aeon
  choice: 아이온
  rationale: 문맥에서 인격적 실재와 영역을 함께 가리킬 수 있으므로 ‘영겁’이나 ‘시대’로 단정하지 않고 음역하여 다의성을 보존했습니다.
- source_word: attend
  choice: 섬기다
  rationale: 단순히 곁에 있다는 뜻보다 수행·시종의 관계가 두드러지지만, 예배 행위로 과도하게 한정하지 않는 표현을 택했습니다.
- source_word: the All
  choice: 만물
  rationale: 우주적 총체를 가리키는 표현으로 자연스러운 한국어를 사용하되, 창조 세계라는 별도의 교리적 설명은 덧붙이지 않았습니다.
- source_word: Providence / Precognition
  choice: 섭리 / 예지
  rationale: 서로 구별되는 추상적·인격적 실재의 명칭으로 읽힐 수 있게 일관된 한자어 명사로 옮겼습니다.
- source_word: Ideal Form
  choice: 원형
  rationale: ‘이상적 형상’보다 실재의 모범적 형상이라는 의미를 간결하고 자연스럽게 나타냅니다.
- source_word: Sophia
  choice: 소피아
  rationale: 일반 명사 ‘지혜’이면서 고유한 아이온의 이름일 가능성을 보존하기 위해 음역했습니다.
theological_decisions:
- issue: ‘스스로 생겨난 하나님’, ‘아들’, ‘그리스도’의 관계
  choice: 본문의 병치와 동일시를 가능한 한 그대로 유지함
  alternative: 세 표현을 하나의 명칭으로 매끄럽게 통합함
  rationale: 본문 자체의 복잡한 신적 계보와 문법적 긴장을 특정 신학 체계에 맞추어 해소하지 않기 위해서입니다.
- issue: 아이온의 존재론적 성격
  choice: ‘아이온’으로 음역함
  alternative: ‘영겁’, ‘세계’, ‘영적 존재’로 번역함
  rationale: 이 문맥에서는 시간, 영역, 인격적 발출체 가운데 하나만을 확정하기 어렵습니다.
- issue: 4절의 이름이 ‘spoken’된다는 표현
  choice: ‘알려질 것입니다’
  alternative: ‘말해질 것입니다’
  rationale: 한국어에서 이름이 합당한 이들에게 전달·계시된다는 뜻을 자연스럽게 나타내되, 비밀 이름에 관한 별도 교리를 부과하지 않았습니다.
- issue: 12절의 역전된 위계 표현
  choice: 현존 문장의 방향을 그대로 보존함
  alternative: 앞 절들과 평행하게 ‘넷째 빛이 넷째 아이온 위에 세워졌다’로 수정함
  rationale: 사본 전승이나 번역 증거 없이 예상되는 평행 구조로 본문을 교정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 신적 존재와 추상적 실재의 명칭은 문맥상 고유 명칭처럼 기능하더라도 한국어에서 불필요한 표기 장치를 덧붙이지 않았습니다. 다만 ‘아이온’과 ‘소피아’는 의미를 하나로 제한하지 않도록 음역했습니다. 현재 초안은 제공된 공용 영어 증언을 토대로 하며, 콥트어 원문 대조가 남아 있는 잠정 번역입니다.
