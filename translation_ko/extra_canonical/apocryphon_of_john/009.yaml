    and he extricated himself from her, and moved away from the places where he had been born.'
translation:
  language: ko
  text: '또한 ‘성찰의 소피아’는 한 아이온으로서, 보이지 않는 영과 ‘예지’의 구상과 더불어 혼자서 어떤 생각을 품었습니다.


    그녀는 자신에게서 하나의 형상을 낳고자 했습니다. 그러나 그것은 받아들여지지 않은 채 영의 동의 없이, 자기 짝과 그의 숙고도 없이 이루어진 일이었으며, 그녀 안의 남성적 면도 이를 받아들이지 않았습니다.[a]


    또한 그녀는 자기 짝을 찾지 못했는데도, 영의 동의와 자기 짝의 앎 없이 홀로 숙고하여 낳았습니다. 그녀 안에는 손상될 수 없는 힘이 깃들어 있었으므로,


    그녀의 생각은 결실 없이 끝나지 않았습니다. 그녀는 자기에게서 불완전하고 자기 모습과 다른 어떤 존재를 낳았습니다. 자기 짝 없이 그를 만들어 냈기 때문입니다. 그는 어머니와 다른 형상을 지니고 있었으므로 어머니의 모습과 달랐습니다.


    또한 그녀가 자기 뜻의 결과를 보았을 때, 그는 사자의 얼굴을 한 용의 형상으로 변했습니다.[b]


    그의 눈은 번쩍이는 번갯불과 같았습니다.


    그녀는 불멸의 존재들 가운데 아무도 그를 보지 못하게 하려고 그를 자기에게서 밀어내어 그곳들 밖으로 내보냈습니다. 자신이 무지한 가운데 그를 만들어 냈기 때문입니다.


    그녀는 또한 빛나는 구름으로 그를 둘러싸고 구름 한가운데에 보좌를 세웠습니다. 그리하여 거룩한 영, 곧 이름이 ‘살아 있는 이들의 어머니’인 분 외에는 아무도 그를 볼 수 없게 했습니다. 그리고 그의 이름을 얄다바오트라 불렀습니다.[c]


    그가 바로 어머니에게서 강한 능력을 얻은 우두머리 아르콘입니다.[d]


    그는 어머니에게서 스스로 벗어나, 자신이 태어난 곳들에서 멀리 떠났습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그녀 안의 남성적 면”에 해당하는 증언은 문자적으로는 “그녀의 남성성의 얼굴”에 가깝지만 뜻이 불분명합니다. 그녀의 남성적 상대를 가리킬 가능성도 있습니다.
    reason: 난해한 표현의 실제 모호성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 현 단계의 번역 근거인 영어 증언은 “사자의 얼굴을 한 용의 형상”으로 전합니다. ‘용’에는 편집 표지가 붙어 있었으나 본문에는 그 단어만 반영했습니다.
    reason: 원자료의 편집 표지와 잠정적 본문 상태를 투명하게 밝히기 위해서입니다.
  - marker: c
    text: “거룩한 영”과 “살아 있는 이들의 어머니”의 관계는 이 문헌 자체의 표현을 따랐으며, 다른 문헌의 성령 개념과 곧바로 동일시하지 않았습니다.
    reason: 교리적 선결정을 피하고 본문의 고유한 명칭을 보존하기 위해서입니다.
  - marker: d
    text: “아르콘”은 ‘통치자’를 뜻하는 말이지만, 여기서는 이 문헌의 우주론적 존재를 가리키는 전문 명칭으로 음역했습니다.
    reason: 일반적인 정치 통치자와 문헌 고유의 초월적 존재를 구별하기 위해서입니다.
lexical_decisions:
- source_word: aeon
  choice: 아이온
  rationale: 이 문헌의 고유한 우주론적 실재를 가리키므로 일반어인 ‘시대’로 풀지 않고 음역하여 전문적 의미를 보존했습니다.
- source_word: Sophia of Reflection
  choice: ‘성찰의 소피아’
  rationale: Sophia는 인격화된 고유 존재의 이름으로 음역하고, 수식어 Reflection은 자연스러운 한국어 ‘성찰’로 옮겼습니다.
- source_word: Precognition
  choice: ‘예지’
  rationale: 대문자로 제시된 인격적·우주론적 명칭일 가능성을 살리기 위해 명칭임을 드러내는 따옴표를 사용했습니다.
- source_word: likeness
  choice: 형상
  rationale: 단순한 유사성뿐 아니라 산출된 존재의 모습이라는 문맥을 함께 전달합니다.
- source_word: companion
  choice: 짝
  rationale: 배우자라고 단정하지 않으면서 대응 관계의 동반자를 간결하게 나타냅니다.
- source_word: chief archon
  choice: 우두머리 아르콘
  rationale: archon의 이 문헌 특유의 우주론적 직위를 보존하기 위해 음역하되 chief는 쉬운 현대어로 옮겼습니다.
- source_word: Yaltabaoth
  choice: 얄다바오트
  rationale: 고유명사의 통상적인 한국어 음역을 사용했습니다.
theological_decisions:
- issue: 소피아의 단독 산출과 동의 부재
  choice: 영과 짝의 동의·숙고 없이 이루어진 일이라는 반복을 보존했습니다.
  alternative: 이를 단순히 ‘불순종하여 낳았다’고 요약할 수 있습니다.
  rationale: 원문 증거가 제시하는 복합적인 동의 부재를 특정한 도덕·교리 범주로 환원하지 않았습니다.
- issue: ‘the face of her maleness’의 의미
  choice: ‘그녀 안의 남성적 면’으로 옮겼습니다.
  alternative: ‘그녀의 남성성의 얼굴’ 또는 ‘그녀의 남성적 상대’로 직역할 수 있습니다.
  rationale: 영어 증언 자체가 난해하므로 과도하게 특정 존재로 확정하지 않으면서 문맥상 내재한 남성적 측면이라는 가능성을 나타냈습니다.
- issue: holy Spirit의 정체와 성별
  choice: ‘거룩한 영, 곧 이름이 살아 있는 이들의 어머니인 분’으로 옮겼습니다.
  alternative: 정통 기독교의 성령이라는 의미를 전제하여 ‘성령’으로 번역할 수 있습니다.
  rationale: 본문 고유의 신화적 명명과 긴장을 보존하고 후대 교리적 동일시를 피했습니다.
- issue: 얄다바오트의 성격
  choice: 불완전하며 어머니와 다른 형상을 지닌 존재로 서술된 그대로 두었습니다.
  alternative: ‘악한 존재’ 또는 ‘창조신’ 같은 해석적 명칭을 덧붙일 수 있습니다.
  rationale: 이 대목에서 직접 진술되지 않은 평가나 후속 역할을 선취하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문장은 장중하되 일반 독자가 따라갈 수 있도록 분절했으며, 반복은 원문의 논리와 강조를 보존하는 범위에서 유지했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 제공된 공공영역 영어 증언에 근거한 잠정 번역입니다. 증언에 끼어든 쪽수 표시는 본문에서 제외했습니다.
