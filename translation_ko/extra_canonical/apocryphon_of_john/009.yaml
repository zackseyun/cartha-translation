    그녀는 자신에게서 하나의 형상을 낳고자 했습니다. 그러나 영의 동의 없이, 이를 받아들이지 않은 영과는 따로, 자기 짝과도 따로, 그의 숙고와도 따로 그렇게 하려 했습니다. 또한 그녀의 남성성의 얼굴도 이를 받아들이지 않았습니다.[a]


    또한 그녀는 자기 짝을 찾지 못했는데도 낳았습니다. 영의 동의와 자기 짝의 앎 없이 홀로 숙고했지만, 그녀 안에 깃든 손상될 수 없는 힘 때문에,


    그녀의 생각은 결실 없이 남아 있지 않았습니다. 그녀는 자신에게서 불완전하고 자기 모습과 다른 어떤 존재를 낳았습니다. 그녀가 자기 짝과 따로 그를 만들어 냈기 때문입니다. 그는 다른 형상을 지니고 있었으므로 어머니의 모습과 달랐습니다.


    또한 그녀가 자기 뜻의 결과를 보았을 때, 그는 사자의 얼굴을 한 용의 형상으로 변했습니다.[b]


    그의 눈은 번쩍이는 번갯불과 같았습니다.


    그녀는 불멸의 존재들 가운데 아무도 그를 보지 못하게 하려고, 그를 자기에게서 밀어내어 그곳들 밖으로 내보냈습니다. 자신이 무지한 가운데 그를 만들어 냈기 때문입니다.


