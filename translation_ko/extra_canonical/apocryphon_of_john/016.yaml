base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: ko
  text: '그때 빛의 반영은 그의 안에 몸을 숨겼습니다. 우두머리 아르콘은 그의 갈빗대에서 그 여자를 끌어내려 했지만, 빛의 반영은 붙잡을 수 없는 존재입니다.


    어둠이 그 여자를 뒤쫓았지만 붙잡지 못했습니다. 우두머리 아르콘은 그 사람에게서 자기 능력의 일부를 끌어내어, 자기에게 나타났던 반영의 모습을 따라 여자의 형상을 한 또 하나의 틀을 만들었습니다. 그리고 그 사람의 능력에서 끌어낸 부분을 여자의 틀 안에 넣었습니다. 그것은 모세가 말한 것처럼 ‘그의 갈빗대’가 아니었습니다. 그러자 그는 자기 곁에 있는 여자를 바라보았습니다.


    바로 그때 빛나는 반영도 나타났습니다. 그 여자는 그의 정신을 덮고 있던 너울을 걷어 냈고, 그는 어둠에 취한 상태에서 깨어나 제정신을 되찾았습니다. 그는 자기 형상의 짝을 알아보고 말했습니다. “이는 참으로 내 뼈 중의 뼈요, 내 살 중의 살입니다.


    그러므로 남자는 아버지와 어머니를 떠나 자기 아내와 결합하고, 둘이 한 몸이 될 것입니다.” 이는 그의 짝이 그에게 보내질 것이기 때문입니다. 그는 자기 아버지와 어머니, 곧 우리의 자매 소피아까지도 떠날 것입니다. 소피아는 순진한 가운데 내려와 자기의 결핍을 바로잡으려 했으며, 그 결핍 때문에 ‘생명’, 곧 ‘어머니 또는 살아 있는 자’라고 불렸습니다.[a] 이 일은 하늘 주권의 섭리와 그에게 [나타난 반영]을 통하여 이루어졌습니다.[b] 그 여자를 통하여 그들은 완전한 지식을 맛보았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어머니 또는 살아 있는 자’에 해당하는 전승 문구는 불확실합니다. ‘살아 있는 자들의 어머니’로 이해할 가능성도 있습니다.
    reason: 공급된 영어 증거문의 ‘the mother or the living’이 문법적·본문비평적으로 불안정하여 대안 독법을 알립니다.
  - marker: b
    text: 이 문장의 문법적 연결은 불분명합니다. ‘하늘 주권의 섭리’와 ‘그에게 나타난 반영’이 앞 절 또는 뒤 절과 어떻게 이어지는지 여러 방식으로 이해할 수 있습니다. 대괄호는 증거문에서 복원된 말임을 나타냅니다.
    reason: 원 증거문의 통사적 모호성과 편집상 복원 표시를 보존하고 설명합니다.
lexical_decisions:
- source_word: Reflection of Light / Reflection
  choice: 빛의 반영 / 반영
  rationale: ‘reflection’의 거울상·현현이라는 의미를 보존하면서 별개의 인격적 존재를 가리키는 문맥을 살렸습니다. ‘사유’나 ‘통찰’로 단정하면 원문의 다의성을 좁힐 수 있습니다.
- source_word: chief archon
  choice: 우두머리 아르콘
  rationale: 고대 영지주의 문헌의 전문 칭호인 ‘아르콘’을 음역하고, chief의 위계 의미는 현대 독자가 이해하기 쉬운 ‘우두머리’로 나타냈습니다.
- source_word: mold
  choice: 틀
  rationale: 여성의 외형을 빚어 능력을 담는 형성 틀이라는 비유를 자연스럽게 전달하며, ‘육체’나 ‘몸’으로 과도하게 해석하지 않았습니다.
- source_word: counterpart of his own image
  choice: 자기 형상의 짝
  rationale: 닮은 형상이면서 대응하는 동반자라는 두 의미를 간결하게 보존했습니다.
- source_word: sobriety / inebriation of darkness
  choice: 제정신 / 어둠에 취한 상태
  rationale: 취함과 깨어남의 대조를 유지하되 한국어에서 자연스럽게 이해되도록 옮겼습니다.
- source_word: cleave
  choice: 결합하다
  rationale: 긴밀히 붙어 한 몸을 이루는 관계를 존엄하고 현대적인 표현으로 전달했습니다.
- source_word: Sophia
  choice: 소피아
  rationale: 본문 안에서 인격화된 고유 존재를 가리키므로 일반 명사 ‘지혜’로 번역해 정체를 미리 해석하지 않고 음역했습니다.
- source_word: perfect knowledge
  choice: 완전한 지식
  rationale: 문헌의 인식론적·구원론적 함의를 특정 교리 용어로 좁히지 않고 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: 창세기의 갈빗대 전승에 대한 본문의 반론
  choice: “그것은 모세가 말한 것처럼 ‘그의 갈빗대’가 아니었습니다”로 명시
  alternative: 창세기 표현과 조화시키거나 완곡하게 번역
  rationale: 이 문헌이 모세에게 돌리는 설명을 명시적으로 부정하는 논쟁적 긴장을 그대로 보존했습니다.
- issue: 빛의 반영의 인격성과 비물질성
  choice: 여성 대명사와 ‘붙잡을 수 없는 존재’를 사용
  alternative: 비인격적인 빛이나 생각으로 번역
  rationale: 서술 속 여성적 인격성을 드러내면서도 그 존재의 본질을 추가로 규정하지 않았습니다.
- issue: ‘Life’와 ‘the mother or the living’의 불확실한 관계
  choice: ‘생명’, 곧 ‘어머니 또는 살아 있는 자’
  alternative: ‘생명, 살아 있는 자들의 어머니’로 확정
  rationale: 영어 증거문 자체가 ‘mother or the living’이라는 불안정한 독법을 제시하므로 익숙한 창세기 문구로 교정하지 않고 양자택일의 모호성을 보존했습니다.
- issue: 마지막 문장의 행위 주체와 수단 관계
  choice: 하늘 주권의 섭리와 [나타난 반영]을 수단으로 연결
  alternative: 소피아의 호칭이나 떠남만을 수식하도록 연결
  rationale: 공급된 증거문의 통사 구조가 불명확하므로 문맥상 가능한 연결을 본문에 두되 각주로 불확실성을 밝혔습니다.
- issue: ‘they’의 지시 대상
  choice: ‘그들’로 유지
  alternative: 아담과 하와 또는 인류로 특정
  rationale: 선행 대상이 명확하지 않으므로 신학적으로 특정하지 않고 원문의 지시 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 존엄하고 읽기 쉽게 다듬되, 아르콘·소피아 같은 문헌 고유 용어는 음역했습니다. 성경 인용은 익숙한 운율을 어느 정도 살렸지만 특정 한국어 성경 번역을 그대로 따르지는 않았습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로 공급된 공공 영역 영어 증거문에 근거한 잠정 번역이며, 본문의 불확실한 통사와 복원 표시는 각주로 명시했습니다.
