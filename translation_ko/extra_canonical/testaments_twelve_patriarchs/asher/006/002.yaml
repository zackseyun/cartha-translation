  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 οἱ διπρόσωποι의 ‘두 얼굴’ 비유는 유지하는 편이 좋고, συνευδοκοῦσι는 행정적 뉘앙스의 ‘승인하다’보다 적극적 동조를 나타내는 표현이 더 적합합니다. κατὰ τῶν ἀνθρώπων은 사람들을 향한 대적의 방향을 분명히 해야 합니다.
  naturalness: ‘그것을 행하는 자들을 승인하며’와 ‘사람들을 거슬러 다투기’는 현대 한국어에서 다소 딱딱하거나 부자연스럽습니다. ‘악을 행하는 이들에게 동조하고’, ‘사람들을 대적하여 싸우기’가 자연스럽습니다.
  terminology: ‘미혹의 영들’은 πνεύματα τῆς πλάνης를 적절히 보존합니다. ‘두 얼굴을 가진 자들’은 원문의 도덕적 비유와 현대 한국어의 관용을 함께 살립니다.
