  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι οἱ διπρόσωποι δισσῶς †κολάζονται⁵, ⌜Ὅτι καὶ πράσσουσι τὸ κακόν, καὶ συνευδοκοῦσι τοῖς πράσσουσιν⁶, *μιμούμενοι τὰ πνεύματα τῆς πλάνης καὶ κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι⁷.⌝
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/002.yaml
  text: For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against men.
translation:
  language: ko
  text: 이중적인 사람들은 두 배로 벌을 받습니다. 그들은 악을 행할 뿐 아니라 그것을 행하는 자들을 승인하며, 미혹의 영들을 본받아 사람들을 거슬러 다투기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ διπρόσωποι
  english_pob_choice: the double-faced
  chosen_korean: 이중적인 사람들
  alternatives_korean:
  - 두 얼굴의 사람들
  - 이중적인 자들
  - 겉과 속이 다른 사람들
  lexicon: διπρόσωποι
  rationale: 직역적 이미지인 ‘두 얼굴의’도 가능하지만, 현대 한국어에서 자연스럽고 도덕적 비난의 힘을 유지하는 표현으로 ‘이중적인 사람들’을 택했습니다.
- source_word: δισσῶς
  english_pob_choice: doubly
  chosen_korean: 두 배로
  alternatives_korean:
  - 거듭
  - 배로
  - 이중으로
  lexicon: δισσῶς
  rationale: 보응의 정도를 그대로 살려 ‘두 배로’라고 옮겼습니다.
- source_word: συνευδοκοῦσι τοῖς πράσσουσιν
  english_pob_choice: approve those who do it
  chosen_korean: 그것을 행하는 자들을 승인하며
  alternatives_korean:
  - 그것을 행하는 자들을 기뻐하며
  - 그것을 행하는 자들과 동의하며
  - 그것을 행하는 자들을 좋게 여기며
  lexicon: συνευδοκέω
  rationale: 행위를 묵인하는 수준을 넘어 적극적으로 동조하는 의미를 살리기 위해 ‘승인하며’를 선택했습니다.
- source_word: τὰ πνεύματα τῆς πλάνης
  english_pob_choice: the spirits of deceit
  chosen_korean: 미혹의 영들
  alternatives_korean:
  - 속임수의 영들
  - 기만의 영들
  - 유혹의 영들
  lexicon: πνεύματα τῆς πλάνης
  rationale: πλάνη의 핵심을 ‘미혹’으로 잡아, 사악한 영적 영향력이라는 문맥을 간명하게 드러냈습니다.
- source_word: κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι
  english_pob_choice: contending against men
  chosen_korean: 사람들을 거슬러 다투기 때문입니다
  alternatives_korean:
  - 사람들과 맞서 싸우기 때문입니다
  - 사람들을 대적하며 다투기 때문입니다
  - 사람들을 상대로 싸우기 때문입니다
  lexicon: συναγωνίζομαι
  rationale: ‘contending against’의 대립·투쟁 의미를 살리되, 한국어 문장 흐름에 맞게 ‘거슬러 다투다’로 옮겼습니다.
theological_decisions:
- issue: ‘spirits of deceit’의 영적 실재성
  chosen_reading: 도덕적 은유로 약화하지 않고 실제적인 영적 영향력으로 읽어 ‘미혹의 영들’로 번역했습니다.
  alternative_readings:
  - 단순한 거짓된 태도
  - 속임수의 분위기
  rationale: 본문은 행위의 모방 대상로 영들을 제시하므로, 단지 심리적 성향으로 축소하지 않는 것이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: 영적 분별과 악한 영에 대한 신약·제2성전기 전통의 일반적 이해
