source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VI. Προσέχετε οὖν *καὶ ὑμεῖς, τέκνα μου¹, *τὰς ἐντολὰς² Κυρίου³ μονοπροσώπως *ἀκολουθοῦντες τῇ ἀληθείᾳ⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/001.yaml
  text: Therefore take heed, you also, my children, following the commandments of the Lord with singleness of purpose, in truth.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 너희도 한결같은 마음으로 진리를 따라 주님의 계명들을 지키도록 주의하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “한결같은 마음으로 진리를 따르며 주님의 계명들을 따르십시오.”
    reason: 그리스어의 분사구문(‘진리를 따르며’)과 προσέχετε의 권고적 명령을 한국어에서 어떻게 연결할지에 따른 표현상 차이를 밝혀, 수식 관계의 모호성을 줄입니다.
lexical_decisions:
- source_word: Προσέχετε οὖν
  english_pob_choice: Therefore take heed
  chosen_korean: 그러므로 … 조심하십시오
  alternatives_korean:
  - 그러므로 … 주의하십시오
  - 그러므로 … 살피십시오
  lexicon: προσέχω
  rationale: 경계하고 주의를 기울이라는 권고를 한국어 합쇼체 명령으로 자연스럽게 옮겼으며, 문맥상 단순 정보가 아니라 경계 촉구이므로 ‘조심하십시오’를 택했습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 자식들아
  - 내 아이들아
  lexicon: τέκνον
  rationale: 직접 호칭의 친밀함을 살리되 현대 한국어에서 자연스럽고 품위 있게 들리는 ‘자녀들아’를 선택했습니다.
- source_word: τὰς ἐντολὰς Κυρίου
  english_pob_choice: the commandments of the Lord
  chosen_korean: 주님의 계명
  alternatives_korean:
  - 주님의 명령
  - 주님의 계명들
  lexicon: ἐντολή
  rationale: 복수형이지만 한국어에서는 이 표현이 집합적으로 자연스러워 ‘계명’으로 옮겼고, Κυρίου는 한국어 기독교 용례에 맞춰 ‘주님’으로 번역했습니다.
- source_word: μονοπροσώπως ἀκολουθοῦντες τῇ ἀληθείᾳ
  english_pob_choice: with singleness of purpose, in truth
  chosen_korean: 한결같은 뜻으로 따르며 진리 안에서
  alternatives_korean:
  - 한마음으로 따르며 진리 안에서
  - 오직 한 뜻으로 따르며 진리 안에서
  lexicon: μονοπροσώπως; ἀκολουθέω; ἀλήθεια
  rationale: μονοπροσώπως의 ‘single-minded’ 뉘앙스를 ‘한결같은 뜻으로’로 풀어, 외적 행동보다 내적 집중을 드러냈고, τῇ ἀληθείᾳ는 동반어적 의미를 살려 ‘진리 안에서’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: Κυρίου의 호칭 처리
  chosen_reading: ‘주님’으로 번역해 수신자에게 권위를 지닌 주로 읽히게 했습니다.
  alternative_readings:
  - ‘주’
  - ‘주인’
  rationale: 이 문맥의 Κυρίου는 단순 소유자보다 신적 권위를 지닌 주를 가리키는 호칭으로 읽히므로, 한국어 교회어에서 이해 가능하면서도 직역성을 유지하는 ‘주님’이 적절합니다.
  doctrine_reference: Lordship language in Jewish/Christian exhortation
