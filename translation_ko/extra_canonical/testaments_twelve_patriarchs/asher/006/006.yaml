  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν δὲ *ἔστω ἥσυχος²⁸ *ἐν χαρᾷ²⁹ †γνωρίζει³⁰ τὸν ἄγγελον τῆς εἰρήνης, *καὶ εἰσφέρει αὐτὸν εἰς ζωὴν αἰώνιον³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/006.yaml
  text: But if it is at rest in joy, it recognizes the angel of peace, and he brings it into eternal life.
translation:
  language: ko
  text: 그러나 그것이 기쁨 속에서 고요하면, 평화의 천사를 알아보고 그 안으로 들어가게 되어 영원한 생명에 이릅니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστω ἥσυχος ἐν χαρᾷ
  english_pob_choice: it is at rest in joy / it is quiet in joy
  chosen_korean: 기쁨 속에서 고요하면
  alternatives_korean:
  - 기쁨 가운데 평온하면
  - 기쁨 속에서 잠잠하면
  lexicon: ἥσυχος
  rationale: ἥσυχος는 단순한 감정 상태보다 ‘고요함/잠잠함’의 정적 뉘앙스를 가지므로, 기쁨과 함께 있는 상태를 자연스럽게 살려 ‘기쁨 속에서 고요하면’으로 옮겼습니다.
- source_word: γνωρίζει τὸν ἄγγελον τῆς εἰρήνης
  english_pob_choice: it recognizes the angel of peace
  chosen_korean: 평화의 천사를 알아보고
  alternatives_korean:
  - 평화의 천사를 인정하고
  - 평화의 천사를 알아차리고
  lexicon: γνωρίζω
  rationale: γνωρίζει는 단순 지식보다 ‘알아봄/알아봄으로 식별함’의 뜻이 있어, 문맥에 맞게 ‘알아보고’로 옮겨 인식의 행위를 살렸습니다.
- source_word: τὸν ἄγγελον τῆς εἰρήνης
  english_pob_choice: the angel of peace
  chosen_korean: 평화의 천사
  alternatives_korean:
  - 평강의 천사
  - 화평의 천사
  lexicon: ἄγγελος / εἰρήνη
  rationale: ἄγγελος는 문자적으로 ‘천사’이며, εἰρήνη는 이 문맥에서 관계적 평안을 가리키므로 ‘평화’로 직역해 본문의 상징적 표현을 유지했습니다.
- source_word: εἰσφέρει αὐτὸν εἰς ζωὴν αἰώνιον
  english_pob_choice: he brings it into eternal life
  chosen_korean: 그 안으로 들어가게 되어 영원한 생명에 이릅니다
  alternatives_korean:
  - 그를 영원한 생명으로 이끕니다
  - 그것을 영원한 생명으로 데려갑니다
  lexicon: εἰσφέρει
  rationale: εἰσφέρει는 ‘들여보내다/들어가게 하다’의 방향성을 가지므로, 주체를 자연스럽게 처리하면서도 원문의 이동 이미지를 보존했습니다.
theological_decisions:
- issue: 주어와 대명사의 지시 대상(그것/그)을 어떻게 처리할지
  chosen_reading: 본문의 영혼/마음에 대한 중성적 지시를 반영해 주어를 ‘그것’으로 두고, 뒤의 동사구는 한국어 문맥에 맞게 자연스럽게 연결했습니다.
  alternative_readings:
  - ‘그를’로 인격화하여 번역
  - 문맥상 ‘영혼’을 보충해 명시
  rationale: 그리스어 중성 대명사와 전승 문맥의 영혼-상태 비유를 함께 고려하면, 과도한 인격화나 보충어 삽입 없이 중성 지시를 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 문헌적 비유와 대명사 지시 유지
