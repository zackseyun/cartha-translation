id: T12P.ASH.6.5
reference: Testament of Asher 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτε²² γὰρ †πονηρὰ²³ ἡ ψυχὴ ἀπέρχεται²⁴, βασανίζεται ὑπὸ τοῦ πονηροῦ πνεύματος, *ὃ καὶ²⁵ ἐδούλευεν²⁶ ἐν ἐπιθυμίαις²⁷ καὶ ἔργοις πονηροῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/005.yaml
  text: For when a wicked soul departs, it is tormented by the evil spirit, which also enslaved it in lusts and wicked deeds.
translation:
  language: ko
  text: 왜냐하면 악한 영혼이 떠날 때에는 악한 영에게 고통을 받는데, 그 영은 또한 정욕과 악한 행위들 가운데서 그 영혼을 종으로 부렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρὰ ἡ ψυχὴ
  english_pob_choice: a wicked soul
  chosen_korean: 악한 영혼
  alternatives_korean:
  - 악한 혼
  - 사악한 영혼
  lexicon: ψυχή
  rationale: ψυχή를 여기서는 생명체의 내면 전체를 가리키는 일반적 의미로 보아 ‘영혼’으로 옮기고, πονηρά는 도덕적 악을 분명히 하기 위해 ‘악한’으로 처리했습니다.
- source_word: βασανίζεται ὑπὸ τοῦ πονηροῦ πνεύματος
  english_pob_choice: it is tormented by the evil spirit
  chosen_korean: 악한 영에 의해 고통을 받는데
  alternatives_korean:
  - 악한 영에 의해 괴로움을 당하는데
  - 악한 영에 의해 고문을 받는데
  lexicon: βασανίζω / πνεῦμα
  rationale: βασανίζεται는 단순한 감정적 괴로움보다 가혹한 고통을 뜻하므로 ‘고통을 받다’로 옮기고, πνεῦμα는 문맥상 악한 영으로 구체화했습니다.
- source_word: ἐδούλευεν
  english_pob_choice: enslaved
  chosen_korean: 종노릇하게 했습니다
  alternatives_korean:
  - 노예로 삼았습니다
  - 종으로 삼았습니다
  lexicon: δουλεύω
  rationale: 영어 POB의 ‘enslaved’와 같이 종속·지배의 의미를 살리기 위해 단순한 ‘섬겼다’가 아니라 ‘종노릇하게 하다’로 옮겼습니다.
- source_word: ἐν ἐπιθυμίαις καὶ ἔργοις πονηροῖς
  english_pob_choice: in lusts and wicked deeds
  chosen_korean: 정욕과 악한 행위들 가운데서
  alternatives_korean:
  - 정욕과 악한 일들 안에서
  - 정욕과 악한 행동들 가운데
  lexicon: ἐπιθυμία / ἔργα πονηρά
  rationale: ἐπιθυμίαις는 단순한 욕망보다 육체적·도덕적 탐욕을 가리키는 경우가 많아 ‘정욕’으로, ἔργοις πονηροῖς는 ‘악한 행위들’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 악한 영이 영혼을 고통시키고 종속시키는 관계
  chosen_reading: 본문의 인과를 따라, 악한 영이 떠난 악한 영혼을 계속해서 고통과 지배 아래 둔다는 의미로 읽었습니다.
  alternative_readings:
  - 악한 영혼이 스스로 고통의 상태에 들어간다는 읽기
  - ‘영’의 인격성을 약화시켜 단순한 내적 성향으로 보는 읽기
  rationale: 문장의 ὑπὸ + 목적격과 ἐδούλευεν의 지배·종속 어휘가 외적 가해와 종속 관계를 분명히 하므로 이를 약화시키지 않았습니다.
  doctrine_reference: 영적 실재와 악의 지배에 대한 본문 서술
- issue: ψυχή의 번역 범위
  chosen_reading: 여기서는 인격 전체를 가리키는 ‘영혼’으로 번역하되, 헬라어의 폭넓은 의미를 전제했습니다.
  alternative_readings:
  - ‘생명’
  - ‘혼’
  rationale: 문맥상 사후적 상태와 영적 작용을 말하므로 ‘영혼’이 가장 직접적이며, 한국어 독자가 본문의 수용 범위를 이해하기 쉽습니다.
  doctrine_reference: 인간 구성에 대한 서술의 문맥적 번역
