id: T12P.ASH.6.4
reference: Testament of Asher 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι τὰ τέλη τῶν ἀνθρώπων δεικνύουσι¹⁷ τὴν δικαιοσύνην αὐτῶν¹⁸, *καὶ †γνωρίζονται¹⁹ *τοῖς ἀγγέλοις²⁰ Κυρίου, καὶ τοῦ Βελίαρ²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/004.yaml
  text: For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and to Beliar.
translation:
  language: ko
  text: 사람들의 결말은 그들의 의를 드러내고, 주님의 천사들과 벨리알의 천사들에게 알려집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ τέλη τῶν ἀνθρώπων
  english_pob_choice: the ends of men
  chosen_korean: 사람들의 끝
  alternatives_korean:
  - 사람들의 마지막
  - 사람들의 종말
  lexicon: τέλος
  rationale: 문맥상 인생의 결말·결론을 가리키는 표현이므로 직역하되, 현대 한국어에서 자연스럽고 의미가 덜 과장된 ‘끝’을 택했습니다.
- source_word: δεικνύουσι τὴν δικαιοσύνην αὐτῶν
  english_pob_choice: reveal their righteousness
  chosen_korean: 그들의 의를 드러내며
  alternatives_korean:
  - 그들의 의를 나타내며
  - 그들의 의를 보이며
  lexicon: δικαιοσύνη
  rationale: δικαιοσύνη를 ‘의’로 옮기고, 동사는 ‘드러내다’로 하여 내면의 실제가 겉으로 분명해진다는 뉘앙스를 살렸습니다.
- source_word: τοῖς ἀγγέλοις Κυρίου
  english_pob_choice: the angels of the Lord
  chosen_korean: 주님의 천사들
  alternatives_korean:
  - 주님의 사자들
  - 주께 속한 천사들
  lexicon: ἄγγελος
  rationale: 기능적으로 ‘천사’가 가장 직접적이며, Κυρίου는 문맥에 맞게 ‘주님’으로 옮겼습니다.
- source_word: τοῦ Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리알
  alternatives_korean:
  - 벨리아르
  - 벨리알에게
  lexicon: Βελίαρ
  rationale: 고유명사는 음역을 유지했고, 앞의 영어 번역처럼 병렬 대상임을 살리기 위해 여격 구조를 한국어에서 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘끝’이 인간의 최종 운명만이 아니라 삶의 마무리 전체를 가리키는지
  chosen_reading: 여기서는 삶의 마지막 결산을 드러내는 의미로 이해하여 ‘끝’으로 번역했습니다.
  alternative_readings:
  - 종말
  - 마지막 결과
  rationale: 그리스어 τέλος는 단순한 시간적 종료보다 도달한 결말·성과를 포함할 수 있어, 본문의 윤리적 판정을 드러내는 번역이 적절합니다.
  doctrine_reference: 종말론적/윤리적 결산 표현
- issue: ‘벨리알의 천사들’로 읽을지, 영어 수정안처럼 ‘주님의 천사들과 벨리알에게’의 평행을 살릴지
  chosen_reading: 그리스어의 여격 병렬을 반영하여 ‘주님의 천사들과 벨리알의 천사들에게’로 옮겼습니다.
  alternative_readings:
  - 주님의 천사들과 벨리알에게
  - 주님의 천사들과 벨리알의 천사들
  rationale: 본문은 알려짐의 대상이 두 집단의 천사들임을 보이므로, 영어 수정안의 의도를 따라 ‘~에게’ 구조를 한국어에 명시했습니다.
  doctrine_reference: 사본/구문 정합성
