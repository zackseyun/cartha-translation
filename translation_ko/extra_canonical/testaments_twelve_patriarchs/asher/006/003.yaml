id: T12P.ASH.6.3
reference: Testament of Asher 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Ὑμεῖς οὖν, τέκνα μου⁷ᵃ, τὸν νόμον Κυρίου⁹ φυλάξατε· καὶ¹⁰ μὴ προσέχετε *τῷ κακῷ ὡς καλῷ¹¹, ἀλλὰ κατὰ¹² τὸ ὄντως⁹ καλὸν¹³ ἀποβλέπετε, καὶ διατηρεῖτε αὐτὸ ἐν πάσαις ταῖς¹⁴ ἐντολαῖς Κυρίου, εἰς αὐτὸ¹⁵ ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/003.yaml
  text: You therefore, my children, keep the law of the Lord, and do not look upon evil as good; but look instead to what is truly good, and keep it in all the commandments of the Lord, turning toward it and resting in it.
translation:
  language: ko
  text: 그러므로 여러분, 내 자녀들아, 주님의 율법을 지키십시오. 그리고 악을 선으로 여기며 보지 마십시오. 오히려 참으로 선한 것을 바라보고, 주님의 모든 계명 안에서 그것을 지키며, 그것을 향하여 나아가며 그 안에서 쉬십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 규례
  lexicon: νόμος
  rationale: 율법이 이 문맥의 표준 대응이며, Κυρίου는 관계를 분명히 하기 위해 주님으로 옮겼습니다.
- source_word: προσέχετε τῷ κακῷ ὡς καλῷ
  english_pob_choice: do not look upon evil as good
  chosen_korean: 악을 선으로 여기며 보지 마십시오
  alternatives_korean:
  - 악을 선으로 여기지 마십시오
  - 악을 선으로 간주하지 마십시오
  lexicon: προσέχω
  rationale: προσέχετε의 ‘주의를 두다/눈여겨보다’ 뉘앙스를 살려, 단순한 판단 오류가 아니라 악을 선처럼 바라보는 태도를 부정적으로 표현했습니다.
- source_word: τὸ ὄντως καλόν
  english_pob_choice: what is truly good
  chosen_korean: 참으로 선한 것
  alternatives_korean:
  - 진정으로 좋은 것
  - 진짜 선한 것
  lexicon: καλός
  rationale: ὄντως는 ‘참으로/진실로’의 강조이므로, καλόν은 단순한 ‘좋은 것’보다 윤리적 선을 드러내는 ‘선한 것’으로 옮겼습니다.
- source_word: ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες
  english_pob_choice: turning toward it and resting in it
  chosen_korean: 그것을 향하여 나아가며 그 안에서 쉬십시오
  alternatives_korean:
  - 그것을 향해 살아가며 그 안에서 쉬십시오
  - 그것을 향하여 행하며 그 안에서 안식하십시오
  lexicon: ἀναστρέφομαι / καταπαύω
  rationale: ἀναστρεφόμενοι의 ‘행실’보다 방향성을 살려 ‘향하여 나아가며’로 풀고, καταπαύοντες는 ‘쉬다/안식하다’의 지속적 상태를 반영했습니다.
theological_decisions:
- issue: 주님의 율법과 계명에 대한 권면의 어조
  chosen_reading: 직설적 명령형으로 옮겨, 지혜훈계가 요구하는 실천적 복종을 분명히 했습니다.
  alternative_readings:
  - 완곡한 권면형으로 옮김
  - 조언체로 약화함
  rationale: 본문은 단순한 설명이 아니라 공동체 아들들에게 주는 강한 권면이므로, 한국어에서도 명령형의 긴장을 유지하는 것이 원문 효과에 부합합니다.
  doctrine_reference: 지혜문학/훈계 전통의 권면 어조 유지
