id: T12P.ASH.2.8
reference: Testament of Asher 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος⁴⁸ μοιχεύει *καὶ πορνεύει⁴⁹ καὶ ἀπέχεται ἐδεσμάτων⁵⁰. καὶ⁵¹ νηστεύων κακοποιεῖ, καὶ τῇ³⁵ δυναστείᾳ *τοῦ πλούτου⁵² πολλοὺς κατασύρει⁵³, καὶ ἐκ⁵⁴ τῆς ὑπερόγκου⁵⁵ κακίας ποιεῖ⁵⁶ ⌈τὰς⌉⁵⁷ ἐντολάς⁵⁸. τοῦτο διπρόσωπόν ἐστιν⁵⁹, *τὸ δὲ ὅλον⁶⁰ κακόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/008.yaml
  text: Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the power of wealth he drags many down, and out of excessive wickedness keeps the commandments. This is double-faced, but it is altogether evil.
translation:
  language: ko
  text: 다른 사람은 간음하고 성적 부도덕을 저지르며, 음식은 먹지 않습니다. 또 금식하면서도 악을 행하고, 재물의 힘으로 많은 사람을 끌어내리며, 지나친 악으로 계명들을 지킵니다. 이것은 겉과 속이 다르며, 그러나 전부 악합니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεύει καὶ πορνεύει
  english_pob_choice: commits adultery and practices sexual immorality
  chosen_korean: 간음하고 성적 부도덕을 저지르며
  alternatives_korean:
  - 간음하며 음행하며
  - 간음하고 음행을 행하며
  lexicon: μοιχεύω, πορνεύω
  rationale: 두 동사가 병렬로 나와 있어 둘 다 살리되, πορνεύει는 단순 ‘음행’보다 범주를 분명히 드러내는 ‘성적 부도덕’으로 옮겼습니다.
- source_word: ἀπέχεται ἐδεσμάτων
  english_pob_choice: abstains from foods
  chosen_korean: 음식은 먹지 않습니다
  alternatives_korean:
  - 음식을 삼가며
  - 음식에서 자제하며
  lexicon: ἀπέχομαι, ἐδέσματα
  rationale: 금식과 짝을 이루는 ‘음식 절제’의 표지를 자연스럽게 살리되, 문맥상 의도적 절식을 한국어로 평이하게 표현했습니다.
- source_word: τῇ δυναστείᾳ τοῦ πλούτου
  english_pob_choice: by the power of wealth
  chosen_korean: 재물의 힘으로
  alternatives_korean:
  - 부의 권세로
  - 재물의 권력으로
  lexicon: δυναστεία, πλοῦτος
  rationale: POB의 ‘power of wealth’를 따라 ‘재물의 힘’으로 옮겨, 부가 사람을 끌어내리는 지배력을 드러냈습니다.
- source_word: ποιεῖ τὰς ἐντολάς
  english_pob_choice: keeps the commandments
  chosen_korean: 계명들을 지킵니다
  alternatives_korean:
  - 계명들을 행합니다
  - 계명들을 수행합니다
  lexicon: ποιέω, ἐντολή
  rationale: 본문의 역설을 보존하기 위해 ‘행하다’보다 ‘지키다’를 택해, 겉으로는 순종하는 체하지만 실제로는 악한 이중성을 강조했습니다.
- source_word: διπρόσωπόν ἐστιν
  english_pob_choice: This is double-faced
  chosen_korean: 이것은 겉과 속이 다르며
  alternatives_korean:
  - 이것은 두 얼굴을 가졌으며
  - 이것은 이중적이며
  lexicon: διπρόσωπος
  rationale: 직역적인 ‘두 얼굴’도 가능하지만 한국어 관용과 문맥상 위선을 드러내는 ‘겉과 속이 다르다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 금식과 악행의 결합이 주는 윤리적 역설
  chosen_reading: 금식 자체가 의로운 행위로 보장되지 않으며, 악과 결합할 때 위선이 드러난다는 진술로 옮겼습니다.
  alternative_readings:
  - 금식하는 중에도 악을 행한다는 단순 병치
  - 금식을 악행의 은폐 수단으로 보는 해석
  rationale: 본문의 논지는 외적 경건 행위가 내적 악을 가릴 수 없다는 점이므로, 번역에서도 그 역설을 분명히 드러냈습니다.
  doctrine_reference: 경건의 외형보다 내면의 진실성을 강조하는 성경적 윤리
- issue: 계명들을 지킨다는 표현의 반어성
  chosen_reading: ‘계명들을 지킨다’는 말을 문자대로 선행으로 보지 않고, 앞뒤 문맥이 폭로하는 위선적 반어로 읽었습니다.
  alternative_readings:
  - 실제 순종을 가리킨다는 평면적 읽기
  - ‘지키다’를 ‘행하다’로 중성적으로 처리하는 읽기
  rationale: 바로 앞의 악행들과 마지막의 ‘전부 악합니다’가 결합되어 있으므로, 이 구절은 의도적 위선을 말하는 반어로 보아야 합니다.
  doctrine_reference: 위선에 대한 예언자적 비판
