- from: 어떤 사람은 자기 종들을 불쌍히 여기지 않습니다. 그리고 이것이 양면적이라 해도, 그 전체는 악합니다.
  to: 어떤 사람은 자기 종들을 불쌍히 여기지 않습니다. 이것이 두 얼굴을 한 것이라 해도, 그 모든 것은 악합니다.
  rationale: 핵심 수정은 διπρόσωπον을 ‘두 얼굴을 한 것’으로 바꾸어 원문의 도덕적 비유와 부정적 평가를 명확히 한 것입니다. 양보 관계와 행위 전체에 대한 악의 판단은 유지했습니다.
