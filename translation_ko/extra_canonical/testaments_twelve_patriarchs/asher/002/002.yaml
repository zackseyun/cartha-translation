id: T12P.ASH.2.2
reference: Testament of Asher 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν⁸ ἄνθρωπος ὃς⁹ οὐκ οἰκτείρει¹⁰ *λειτουργοὺς αὐτοῦ¹¹. καίγε τοῦτο διπρόσωπον¹², ἀλλὰ τὸ ὅλον πονηρόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/002.yaml
  text: There is a man who does not pity his servants; and though this is double-faced, the whole of it is evil.
translation:
  language: ko
  text: 어떤 사람은 자기 종들을 불쌍히 여기지 않습니다. 이것이 두 얼굴을 한 것이라 해도, 그 모든 것은 악합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτείρει
  english_pob_choice: does not pity
  chosen_korean: 불쌍히 여기지 않습니다
  alternatives_korean:
  - 가엾게 여기지 않습니다
  - 긍휼히 여기지 않습니다
  lexicon: οἰκτείρω
  rationale: 단순한 감정이입이 아니라 불쌍히 여겨 돌보지 않는 태도를 드러내도록, 현대적이면서도 원문의 자비 결핍을 살려 옮겼습니다.
- source_word: λειτουργοὺς
  english_pob_choice: servants
  chosen_korean: 종들
  alternatives_korean:
  - 시종들
  - 일꾼들
  lexicon: λειτουργός
  rationale: 문맥상 소속된 하인/종을 가리키므로, POB의 'servants'에 맞추되 한국어에서 가장 सीधे한 '종들'로 옮겼습니다.
- source_word: διπρόσωπον
  english_pob_choice: double-faced
  chosen_korean: 양면적
  alternatives_korean:
  - 두 얼굴의
  - 겉과 속이 다른
  lexicon: διπρόσωπος
  rationale: 직역적 이미지인 '두 얼굴의'도 가능하지만, 문맥의 도덕적 판단을 간결하게 드러내는 '양면적'을 택했습니다.
- source_word: τὸ ὅλον πονηρόν ἐστιν
  english_pob_choice: the whole of it is evil
  chosen_korean: 그 전체는 악합니다
  alternatives_korean:
  - 모두 악합니다
  - 온통 악합니다
  lexicon: ὅλος / πονηρός
  rationale: 부분적 위선에 그치지 않고 전면적 악함을 강조하는 구조를 살리기 위해 '그 전체는'으로 옮겼습니다.
theological_decisions:
- issue: 원문 판단문의 강도
  chosen_reading: 이 표현은 단순한 결함이 아니라 도덕적 악을 직접 판정하는 문장으로 유지했습니다.
  alternative_readings:
  - 단순히 '좋지 않습니다' 정도로 완화하는 읽기
  rationale: τὸ ὅλον πονηρόν ἐστιν은 전체를 악하다고 단정하므로, 한국어에서도 그 윤리적 강도를 약화하지 않았습니다.
  doctrine_reference: 성품과 행위에 대한 도덕적 평가
