id: T12P.ASH.2.7
reference: Testament of Asher 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Τὴν⁴³ ψυχὴν σπιλοῖ, καὶ⌉ τὸ σῶμα λαμπρύνει⁴⁴, πολλοὺς ἀναιρεῖ καὶ ὀλίγους ἐλεεῖ, καὶ τοῦτο⁴⁵ διπρόσωπόν⁴⁶ ἐστι, *τὸ δὲ ὅλον πονηρόν ἐστιν⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/007.yaml
  text: It stains the soul and makes the body bright; it kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.
translation:
  language: ko
  text: 그것은 영혼을 더럽히고 몸을 밝게 하며, 많은 사람을 죽이고 적은 사람에게는 자비를 베풉니다. 이것 역시 두 얼굴을 가졌지만, 전체는 악합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὴν ψυχὴν σπιλοῖ
  english_pob_choice: It stains the soul
  chosen_korean: 영혼을 더럽히고
  alternatives_korean:
  - 영혼에 얼룩을 남기고
  - 영혼을 오염시키고
  lexicon: σπιλόω
  rationale: σπιλοῖ는 ‘더럽히다/오염시키다’의 의미이므로, 도덕적·영적 오염을 자연스럽게 드러내는 ‘더럽히고’로 옮겼습니다.
- source_word: τὸ σῶμα λαμπρύνει
  english_pob_choice: makes the body bright
  chosen_korean: 몸을 밝게 하며
  alternatives_korean:
  - 몸을 빛나게 하며
  - 몸을 환히 하며
  lexicon: λαμπρύνω
  rationale: λαμπρύνει는 외적 화려함이나 밝아짐을 뜻하므로, 직역에 가까우면서도 한국어에서 자연한 ‘밝게 하며’를 택했습니다.
- source_word: πολλοὺς ἀναιρεῖ καὶ ὀλίγους ἐλεεῖ
  english_pob_choice: it kills many and shows mercy to a few
  chosen_korean: 많은 사람을 죽이고 적은 사람에게는 자비를 베풉니다
  alternatives_korean:
  - 많은 사람을 죽이고 적은 사람을 불쌍히 여깁니다
  - 많은 사람을 죽이고 소수에게는 긍휼을 보입니다
  lexicon: ἀναιρεῖ / ἐλεεῖ
  rationale: ἀναιρεῖ는 단순히 ‘제거하다’보다 강한 ‘죽이다’가 문맥에 맞고, ἐλεεῖ는 ‘자비를 베풀다’가 평행구조를 잘 살립니다.
- source_word: διπρόσωπόν
  english_pob_choice: double-faced
  chosen_korean: 두 얼굴을 가졌지만
  alternatives_korean:
  - 이중적이지만
  - 겉과 속이 다르지만
  lexicon: διπρόσωπος
  rationale: 직역적 이미지인 ‘두 얼굴’이 위선·이중성을 선명하게 전달하므로, POB의 ‘double-faced’에 맞춰 유지했습니다.
theological_decisions:
- issue: 마지막 평결의 도덕적 총평
  chosen_reading: ‘전체는 악합니다’로 옮겨, 부분적 선의 가능성을 인정하면서도 전체 성격을 단호하게 부정했습니다.
  alternative_readings:
  - ‘온전히 악합니다’
  - ‘전부 악합니다’
  rationale: τὸ δὲ ὅλον πονηρόν ἐστιν은 전체성에 대한 판단이므로, 절대적 성격을 살리되 한국어에서 자연스러운 문장으로 정리했습니다.
  doctrine_reference: 지혜/윤리 문맥의 총평 진술
- issue: 주어의 비인격성
  chosen_reading: 주어를 ‘그것’으로 유지했습니다.
  alternative_readings:
  - ‘그는’으로 의인화
  - 주어 생략
  rationale: 영문 POB의 수정이 지적하듯 그리스어 주어는 중성적 대상이므로, 인격화하지 않고 비인격적 지시어를 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 문법적 성/지시 대상 일치
