id: T12P.ASH.2.6
reference: Testament of Asher 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὁ πλεονεκτῶν³³ τὸν³⁴ πλησίον²⁸ πτωχούς, παροργίζει τὸν Θεόν, καὶ³⁵ τὸν ὕψιστον³⁶ ἐπιορκεῖ καὶ τὸν πτωχὸν³⁷ ἐλεεῖ³⁸. τὸν ἐντολέα³⁹ *τοῦ νόμου⁴⁰ Κύριον⁴¹ ἀθετεῖ⁴² καὶ παροξύνει, καὶ τὸν πένητα ἀναπαύει.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/006.yaml
  text: The one who defrauds his neighbor provokes God, swears falsely by the Most High, sets aside and provokes the Lord, the giver of the law, and gives rest to the poor.
translation:
  language: ko
  text: 이웃을 속여 빼앗는 자는 하나님을 격노하게 하고, 지극히 높으신 분을 두고 거짓 맹세를 하며, 율법을 주신 주님을 배척하고 격분하게 하며, 가난한 사람에게 안식을 줍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πλεονεκτῶν τὸν πλησίον
  english_pob_choice: The one who defrauds his neighbor
  chosen_korean: 남을 속여 빼앗는 자
  alternatives_korean:
  - 이웃을 속이는 자
  - 이웃을 착취하는 자
  - 이웃의 것을 탐하는 자
  lexicon: πλεονεκτέω
  rationale: 단순한 ‘속임’보다 착취·사취의 강한 의미가 있어, POB의 defrauds를 살리면서 한국어로는 ‘속여 빼앗다’로 소유 침해를 분명히 드러냈습니다.
- source_word: ἐπιορκεῖ
  english_pob_choice: swears falsely by the Most High
  chosen_korean: 지극히 높으신 분에게 거짓 맹세를 하며
  alternatives_korean:
  - 지극히 높으신 분을 두고 거짓 맹세를 하며
  - 지극히 높으신 분의 이름으로 거짓 맹세를 하며
  lexicon: ἐπιορκέω
  rationale: 문맥상 단순 거짓말이 아니라 ‘맹세의 위반/거짓 맹세’이므로, 대상인 ‘지극히 높으신 분’과 행위인 ‘거짓 맹세’를 함께 살렸습니다.
- source_word: τὸν ἐντολέα τοῦ νόμου Κύριον ἀθετεῖ καὶ παροξύνει
  english_pob_choice: sets aside and provokes the Lord, the giver of the law
  chosen_korean: 율법의 주님을 폐하고 격분하게 하며
  alternatives_korean:
  - 율법의 주님을 버리고 격노하게 하며
  - 율법을 주신 주님을 무시하고 격분하게 하며
  - 율법의 주님을 폐하고 자극하며
  lexicon: ἀθετέω / παροξύνω
  rationale: ἀθετεῖ는 POB의 revised audit에 맞춰 ‘무시하다’보다 강한 ‘폐하다’로 옮겼고, παροξύνει는 단순 자극보다 감정적 격발을 나타내는 ‘격분하게 하다’가 문맥에 적합합니다.
- source_word: τὸν πένητα ἀναπαύει
  english_pob_choice: gives rest to the poor
  chosen_korean: 가난한 사람에게는 안식을 줍니다
  alternatives_korean:
  - 가난한 사람을 쉬게 합니다
  - 가난한 사람에게 쉼을 줍니다
  - 가난한 사람을 안식하게 합니다
  lexicon: ἀναπαύω
  rationale: ‘rest’를 단순 휴식보다 넓은 안식의 결과로 이해해 한국어에서 자연스럽고도 의미를 유지하는 ‘안식을 줍니다’로 옮겼습니다.
theological_decisions:
- issue: Κύριος / The Lord의 번역
  chosen_reading: 율법의 주님
  alternative_readings:
  - 주님
  - 주
  - 야훼
  rationale: 본절의 Κύριος는 ‘율법의 주는 분’이라는 서술적 수식이 붙어 있으며, 기존 POB 영어도 ‘the Lord, the giver of the law’로 처리하므로 한국어에서는 기능을 드러내는 ‘율법의 주님’이 가장 명료합니다.
  doctrine_reference: 법을 주시는 하나님의 주권과 율법 수여 전통
- issue: 대상에게 주어지는 보상/행위의 대조
  chosen_reading: 악행의 연속과 마지막의 긍정적 행위를 그대로 병렬로 살렸습니다.
  alternative_readings:
  - ‘그러나’로 대조를 선명하게 만드는 읽기
  - 끝절을 완곡하게 처리하는 읽기
  rationale: 원문은 한 사람의 악행 목록 뒤에 ‘가난한 사람에게 안식을 줌’이 병렬되어 있어, 도덕적 역설을 약화하지 않도록 접속 구조를 유지했습니다.
  doctrine_reference: 의인/악인의 행위 대비라는 지혜문학적 윤리
