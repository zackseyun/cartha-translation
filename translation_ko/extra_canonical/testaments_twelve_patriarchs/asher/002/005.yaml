id: T12P.ASH.2.5
reference: Testament of Asher 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος²⁷ κλέπτει, ἀδικεῖ²⁸, ἁρπάζει, πλεονεκτεῖ²⁸, καὶ ἐλεεῖ²⁹ πτωχούς· διπρόσωπον μὲν ⌈καὶ⌉³⁰ τοῦτο, *τὸ δὲ ὅλον³¹ πονηρόν³² ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/005.yaml
  text: Another steals, acts unjustly, plunders, is greedy, and shows mercy to the poor. This too is double-faced, but the whole of it is evil.
translation:
  language: ko
  text: 다른 사람은 도둑질하고, 불의를 행하고, 약탈하고, 탐욕을 부리며, 가난한 이들에게 자비를 베풉니다. 이것 역시 겉과 속이 다른 것이지만, 전체로 보면 악합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλέπτει
  english_pob_choice: steals
  chosen_korean: 도둑질하고
  alternatives_korean:
  - 훔치고
  - 도둑질합니다
  lexicon: κλέπτω
  rationale: 일반적인 ‘훔치다’보다 행위 자체를 드러내는 ‘도둑질하다’가 병렬 동사열의 리듬과 죄의 성격을 더 분명히 살립니다.
- source_word: ἀδικεῖ
  english_pob_choice: acts unjustly
  chosen_korean: 불의를 행하고
  alternatives_korean:
  - 부정직하게 행동하고
  - 불공정을 저지르고
  lexicon: ἀδικέω
  rationale: 법정적·윤리적 불의의 폭이 있는 동사이므로, 단순한 예의 없음보다 ‘불의를 행하다’가 source-directed입니다.
- source_word: πλεονεκτεῖ
  english_pob_choice: is greedy
  chosen_korean: 탐욕을 부리며
  alternatives_korean:
  - 더 가지려 하며
  - 탐내며
  lexicon: πλεονεκτέω
  rationale: ‘탐욕을 부리다’가 타인 것을 더 취하려는 적극적 탐심을 한국어로 가장 자연스럽게 전달합니다.
- source_word: πτωχούς
  english_pob_choice: the poor
  chosen_korean: 가난한 이들
  alternatives_korean:
  - 가난한 사람들
  - 빈자들
  lexicon: πτωχός
  rationale: 문맥상 집단을 지칭하는 복수이므로 ‘가난한 이들’이 현대 한국어에서 가장 매끄럽고 비하 뉘앙스가 적습니다.
- source_word: διπρόσωπον
  english_pob_choice: double-faced
  chosen_korean: 겉과 속이 다른
  alternatives_korean:
  - 두 얼굴의
  - 이중적인
  lexicon: διπρόσωπος
  rationale: 직역형 ‘두 얼굴의’도 가능하지만, 성품의 위선을 드러내는 관용 표현 ‘겉과 속이 다른’이 의미를 덜 왜곡합니다.
theological_decisions:
- issue: ὅλον πονηρόν ἐστιν의 최종 평정
  chosen_reading: ‘그 전체는 악합니다’로 옮겨, 개별 행위의 혼합에도 불구하고 전체 판단이 부정적임을 유지했습니다.
  alternative_readings:
  - ‘전적으로 악합니다’
  - ‘온통 악합니다’
  rationale: 그리스어의 τὸ δὲ ὅλον은 ‘전체로 보아’라는 평가를 주므로, 한국어에서도 누적된 행위의 혼합을 넘어 전체 성격에 대한 판정을 살려야 합니다.
  doctrine_reference: 문맥상 도덕적 평가에 관한 진술로, 죄의 혼합이 선을 만들지 못한다는 윤리적 판단을 전달합니다.
