id: T12P.ASH.2.3
reference: Testament of Asher 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν ἄνθρωπος ἀγαπῶν πονηρευόμενον †ὃ ἐστι πονηρία†¹³, ὅτι καὶ ἀποθανεῖν αἱρεῖται ἐν κακῷ· καὶ περὶ τούτου φανερόν ἐστι †τὸ ὅλον†¹⁴ διπρόσωπόν ἐστι τὸ δὲ πᾶν κακὴ πρᾶξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/003.yaml
  text: And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man's account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.
translation:
  language: ko
  text: 그런 악을 행하는 사람을 사랑하는 자가 있습니다. 그는 그 사람을 위하여 자신도 악 안에서 죽기를 택합니다. 그리고 이것으로 분명합니다. 그는 두 얼굴을 지녔으며, 그 전체는 악한 행위입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπῶν
  english_pob_choice: loves
  chosen_korean: 사랑하는 자
  alternatives_korean:
  - 좋아하는 자
  - 애호하는 자
  lexicon: ἀγαπάω
  rationale: 행동의 지속성을 가진 ‘loves’를 자연스럽게 살리면서도, 단순한 호감보다 더 강한 의지를 드러내기 위해 ‘사랑하는 자’로 옮겼습니다.
- source_word: πονηρευόμενον / πονηρία / ἐν κακῷ
  english_pob_choice: acts wickedly / evil / in evil
  chosen_korean: 악을 행하는 / 악 / 악 안에서
  alternatives_korean:
  - 악하게 행하는 / 사악함 / 사악함 가운데
  - 악행하는 / 악한 것 / 악 가운데
  lexicon: πονηρεύομαι, πονηρία, κακός
  rationale: 본문이 동일한 악의 영역을 반복하므로, 동사의 ‘행하다’와 명사·전치사구의 ‘악’을 구분해 반복 구조를 보존했습니다.
- source_word: διπρόσωπόν
  english_pob_choice: double-faced
  chosen_korean: 두 얼굴을 지녔으며
  alternatives_korean:
  - 이중적인 얼굴을 지녔으며
  - 얼굴이 둘인 자이며
  lexicon: διπρόσωπος
  rationale: 직역의 이미지를 유지하되 한국어에서 자연스러운 관용인 ‘두 얼굴’로 옮겨, 위선적 이중성을 드러냈습니다.
- source_word: τὸ δὲ πᾶν κακὴ πρᾶξις
  english_pob_choice: the whole of it is an evil deed
  chosen_korean: 그 전체는 악한 행위입니다
  alternatives_korean:
  - 전체가 악한 행위입니다
  - 모든 것은 악한 행위입니다
  lexicon: πᾶς, πρᾶξις
  rationale: ‘전체’와 ‘행위’를 살려 본문의 평가적 결론을 유지했으며, 영어 POB의 ‘the whole of it’에 맞춰 대상의 총체성을 분명히 했습니다.
theological_decisions:
- issue: 악을 사랑하고 그에 동참하는 사람의 도덕적 평가
  chosen_reading: 본문의 인물은 단지 잘못된 선택을 한 정도가 아니라, 악과 자신을 결합시켜 ‘두 얼굴’을 가진 자로 규정됩니다.
  alternative_readings:
  - 단순한 위선 비판으로 완화
  - 관계적 충성의 과잉으로 중화
  rationale: 원문은 사랑·선택·죽음·악행을 연쇄적으로 묶어 강한 윤리적 판단을 내리므로, 그 긴장을 약화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 성화와 도덕적 책임에 대한 일반적 성경 윤리
