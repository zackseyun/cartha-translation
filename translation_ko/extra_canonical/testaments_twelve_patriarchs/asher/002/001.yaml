id: T12P.ASH.2.1
reference: Testament of Asher 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: II. *Ἔστιν οὖν¹ ἡ² ψυχὴ *ἐν λόγοις †ἀφιστῶσα³ τὸ καλὸν ὑπὲρ *τοῦ κακοῦ⁴, καὶ *τὸ τέλος⁵ *τοῦ πράγματος⁶ εἰς κακίαν †ἄγων⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/001.yaml
  text: There is, then, a soul that in words turns away from the good for the sake of evil, and leads the outcome of the matter into wickedness.
translation:
  language: ko
  text: 그러므로 말로 악을 위해 선을 떠나며, 그 일의 결말을 악으로 이끄는 영혼이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔστιν οὖν ἡ ψυχὴ
  english_pob_choice: There is, then, a soul
  chosen_korean: 그러므로 … 영혼이 있습니다
  alternatives_korean:
  - 그러므로 … 혼이 있습니다
  - 그러므로 … 사람이 있습니다
  lexicon: ψυχὴ
  rationale: ψυχὴ를 여기서는 인격 전체를 가리키는 ‘영혼’으로 옮겨, 존재 진술의 구조와 도덕적 주체성을 살렸습니다.
- source_word: ἐν λόγοις
  english_pob_choice: in words
  chosen_korean: 말을 통해
  alternatives_korean:
  - 말 가운데
  - 말로
  lexicon: λόγοις
  rationale: 직역인 ‘말들 안에서’보다 한국어에서 자연스러운 관계를 살리되, λόγοις의 언어적 수단성을 드러내기 위해 ‘말을 통해’로 옮겼습니다.
- source_word: ἀφιστῶσα τὸ καλὸν ὑπὲρ τοῦ κακοῦ
  english_pob_choice: turns away from the good for the sake of evil
  chosen_korean: 선을 악을 위해 돌이키는
  alternatives_korean:
  - 선에서 악을 위해 돌아서는
  - 선을 버리고 악을 택하는
  lexicon: ἀφιστῶσα / τὸ καλὸν / τοῦ κακοῦ
  rationale: ἀφιστῶσα의 이탈·전환 의미를 ‘돌이키는’으로 살렸고, ὑπὲρ τοῦ κακοῦ는 목적·대가의 뉘앙스를 담아 ‘악을 위해’로 옮겼습니다.
- source_word: τὸ τέλος τοῦ πράγματος εἰς κακίαν ἄγων
  english_pob_choice: leads the outcome of the matter into wickedness
  chosen_korean: 그 일의 결말을 악으로 이끄는
  alternatives_korean:
  - 그 일의 결과를 악으로 끌고 가는
  - 그 사건의 끝을 악에 이르게 하는
  lexicon: τὸ τέλος / τοῦ πράγματος / εἰς κακίαν ἄγων
  rationale: τέλος와 πράγματος를 묶어 사건의 종착점과 사안을 함께 반영하고, εἰς κακίαν ἄγων의 방향성을 ‘악으로 이끄는’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 도덕적 주체를 ‘영혼’으로 번역할지 여부
  chosen_reading: 이 구절은 내면의 인격적 주체가 말과 결말을 통해 악으로 기울어지는 모습을 말하므로 ‘영혼’으로 옮겼습니다.
  alternative_readings:
  - ‘사람’으로 완화하여 번역
  - ‘마음’으로 심리화하여 번역
  rationale: 본문의 ψυχὴ는 단순한 심리 상태보다 존재 전체의 방향성을 가리키므로, 도덕적 책임을 지는 인격적 주체로 드러내는 것이 적절합니다.
  doctrine_reference: 인간의 도덕적 책임과 내적 선택의 실제성
