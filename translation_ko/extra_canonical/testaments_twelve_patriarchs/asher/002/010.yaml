id: T12P.ASH.2.10
reference: Testament of Asher 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ γὰρ⁶⁴ ὁ Θεὸς ἐν ταῖς πλαξὶ⁶⁵ τῶν ἐντολῶν⁶⁶ οὕτως εἶπεν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/010.yaml
  text: For God also, in the tablets of the commandments, has declared it so.
translation:
  language: ko
  text: 하나님께서도 계명의 돌판들에서 이와 같이 말씀하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ ... οὕτως εἶπεν
  english_pob_choice: For ... has declared it so
  chosen_korean: …이와 같이 말씀하셨습니다
  alternatives_korean:
  - …그렇게 말씀하셨습니다
  - …이렇다고 선언하셨습니다
  lexicon: 말씀하다
  rationale: οὕτως εἶπεν은 단순 과거 진술이지만, 영어 POB의 has declared it so처럼 선언적 확정을 살려 합쇼체의 ‘말씀하셨습니다’로 옮겼습니다.
- source_word: ταῖς πλαξὶ τῶν ἐντολῶν
  english_pob_choice: the tablets of the commandments
  chosen_korean: 계명의 돌판들
  alternatives_korean:
  - 계명들의 판들
  - 명령의 돌판들
  lexicon: 돌판
  rationale: plax는 돌판, 판을 뜻하며 복수형을 반영해 ‘돌판들’로 옮기고, τῶν ἐντολῶν은 ‘계명’으로 직역해 문맥의 율법적 어감을 보존했습니다.
- source_word: ὁ Θεὸς
  english_pob_choice: God
  chosen_korean: 하나님께서도
  alternatives_korean:
  - 하나님도
  - 하나님께서
  lexicon: 하나님
  rationale: 주어를 문장 첫머리에 두고 주격 조사보다 주어 강조를 위해 ‘하나님께서도’로 옮겨, καὶ γὰρ의 덧붙임 강조를 자연스럽게 반영했습니다.
theological_decisions:
- issue: καὶ γὰρ의 강조를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘하나님께서도’로 옮겨 앞뒤 맥락에 이어지는 추가 강조를 살렸습니다.
  alternative_readings:
  - 단순히 ‘하나님이’로 중립 번역
  - ‘또 하나님께서’로 연결감 강조
  rationale: 이 접속사는 단순 정보 전달보다 앞선 진술에 대한 보강을 나타내므로, ‘도’와 어순으로 강조를 유지했습니다.
  doctrine_reference: 문맥 강조 보존
- issue: 돌판과 계명의 관계를 해석할지 여부
  chosen_reading: 해석을 덧붙이지 않고 원문의 표면적 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘율법판’처럼 기능을 해석한 번역
  - ‘십계명 돌판’으로 구체화
  rationale: 본문은 특정 역사적 돌판을 명시하지 않고 ‘계명의 돌판들’이라 하므로, 전통적 용어로 과도하게 구체화하지 않았습니다.
  doctrine_reference: source transparency
