  source_fidelity: 그리스어 Καὶ γὰρ의 보강적 연결을 ‘하나님께서도’로 반영했고, ὁ Θεός, ταῖς πλαξὶ τῶν ἐντολῶν, οὕτως εἶπεν의 핵심 의미와 복수형을 충실히 보존합니다. ‘돌판들에서’는 ἐν ταῖς πλαξὶ의 문자적 범위를 유지하며, 본문에 없는 특정 계명 수나 전승적 해석을 덧붙이지 않습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고 간결합니다. ‘계명의 돌판들’은 다소 문어적이지만 고대 경전 문맥에 적절하며 원문의 복수를 보존하는 선택입니다.
  terminology: ‘하나님’, ‘계명’, ‘돌판’은 일관되고 널리 이해되는 한국어 성서 용어입니다. ‘말씀하셨습니다’는 εἶπεν에 대해 존대 합쇼체를 자연스럽게 구현합니다.
