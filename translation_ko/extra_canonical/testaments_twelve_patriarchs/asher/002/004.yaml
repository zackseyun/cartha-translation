id: T12P.ASH.2.4
reference: Testament of Asher 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: †Καίγε ἀγάπη οὖσα, ἐν πονηρίᾳ ἐστὶν ὁ συγκρύπτων²⁰ τὸ κακὸν ὑπὲρ τὸ ὄνομα τὸ καλόν·† τὸ δὲ τέλος τῆς πράξεως ἔρχεται εἰς κακόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/004.yaml
  text: Even if they are in love, they are in wickedness, hiding evil under a good name; but the end of the deed comes to evil.
translation:
  language: ko
  text: 비록 그들이 사랑 안에 있을지라도, 악함 가운데 있는 것입니다. 그들은 선한 이름 아래에 악을 숨깁니다. 그러나 그 행위의 끝은 악에 이릅니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε ἀγάπη οὖσα
  english_pob_choice: Even if they are in love
  chosen_korean: 비록 그들이 사랑 안에 있을지라도
  alternatives_korean:
  - 비록 그들이 사랑 가운데 있을지라도
  - 설령 사랑하고 있다 하더라도
  lexicon: ἀγάπη
  rationale: 문맥상 단순한 감정적 사랑이라기보다 관계적·도덕적 상태를 나타내므로, 자연스러운 한국어로 ‘사랑 안에 있다’고 옮겼습니다.
- source_word: ἐν πονηρίᾳ ἐστὶν
  english_pob_choice: they are in wickedness
  chosen_korean: 악함 가운데 있는 것입니다
  alternatives_korean:
  - 악 가운데 있는 것입니다
  - 사악함 가운데 있는 것입니다
  lexicon: πονηρία
  rationale: 전치사 ἐν의 상태 표현을 살려 ‘~가운데 있다’로 옮기고, πονηρία는 도덕적 악을 드러내는 ‘악함’으로 번역했습니다.
- source_word: ὁ συγκρύπτων τὸ κακὸν ὑπὲρ τὸ ὄνομα τὸ καλόν
  english_pob_choice: hiding evil under a good name
  chosen_korean: 그들은 선한 이름 아래에 악을 숨깁니다
  alternatives_korean:
  - 좋은 이름 아래에 악을 감춥니다
  - 선한 이름을 빌려 악을 숨깁니다
  lexicon: συγκρύπτων / κακὸν / ὄνομα τὸ καλόν
  rationale: 분사구문을 한국어 현재 서술로 풀어 의미를 분명히 했고, κακόν과 καλόν의 대비를 ‘악’과 ‘선한 이름’으로 살렸습니다.
- source_word: τὸ δὲ τέλος τῆς πράξεως ἔρχεται εἰς κακόν
  english_pob_choice: but the end of the deed comes to evil
  chosen_korean: 그러나 그 행위의 끝은 악에 이릅니다
  alternatives_korean:
  - 그러나 그 일의 결말은 악으로 갑니다
  - 그러나 그 행위의 마지막은 악이 됩니다
  lexicon: τέλος / πράξις / εἰς κακόν
  rationale: τέλος는 종결점, πράξις는 실제 행위를 가리키므로 ‘행위의 끝’으로 직역성을 유지했고, εἰς κακόν은 결과 도달을 나타내는 ‘악에 이르다’로 옮겼습니다.
theological_decisions:
- issue: 선함의 외양 아래 숨긴 악의 도덕적 경고
  chosen_reading: ‘선한 이름 아래에 악을 숨긴다’는 표현을 그대로 살려, 외형상 선해 보여도 내면의 악이 드러난다는 경고로 읽었습니다.
  alternative_readings:
  - 단순히 체면을 지키는 위선으로 완화해서 읽을 수 있음
  - ‘좋은 평판’을 이용한다는 사회적 비판으로만 읽을 수 있음
  rationale: 본문은 외적 명칭과 내적 실재의 대비를 강조하므로, 위선을 넘어 도덕적 전도 자체를 드러내는 번역이 필요합니다.
  doctrine_reference: 도덕적 위선에 대한 성경적 경고
