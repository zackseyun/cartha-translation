  to: 비록 그들이 사랑하고 있다 해도, 선한 이름 아래 악을 숨기는 그들은 악함 가운데 있습니다. 그러나 그 행위의 끝은 악에 이릅니다.
  rationale: The revision joins the concealment clause to the assertion of wickedness, reflecting the Greek participial construction and the English audit trail. It also uses idiomatic modern formal-polite Korean and removes the unsupported footnote marker.
