  source_fidelity: 초안은 δασύποδες를 ‘토끼’로, 기본 대조를 대체로 전달합니다. 그러나 ‘겉으로는’과 ‘깨끗해 보이지만’은 그리스어에 없는 외관/인상이라는 해석을 더하며, καθαροί/ἀκάθαρτοι의 정결 범주를 각각 일상적 ‘깨끗하다/더럽다’로 약화합니다. 또한 δασύποδες는 여기서 ‘산토끼/들토끼’(hare)를 가리키는 것이 더 정확합니다.
