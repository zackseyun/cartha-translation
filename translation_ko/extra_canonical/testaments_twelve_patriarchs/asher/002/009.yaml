source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Οἱ τοιοῦτοί εἰσι⁶¹ δασύποδες, ὅτι⁶² ἐξ ἡμισείας εἰσὶ καθαροί, τὸ δ᾽ ἀληθὲς⁶³ ἀκάθαρτοί εἰσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/009.yaml
  text: Such people are like hares, because they are half clean, but in truth they are unclean.
translation:
  language: ko
  text: 이런 사람들은 산토끼와 같습니다. 그들은 반쯤은 정결하지만, 사실은 부정합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δασύποδες
  english_pob_choice: like hares
  chosen_korean: 토끼와 같습니다
  alternatives_korean:
  - 산토끼와 같습니다
  - 들토끼와 같습니다
  lexicon: δασύποδες
  rationale: 영어 POB가 ‘hares’로 풀어 준 동물을 한국어에서는 가장 자연스럽고 넓게 통하는 ‘토끼’로 옮겼습니다. 고어적·설명적 표현보다 비유의 효과를 살리는 쪽을 택했습니다.
- source_word: ἐξ ἡμισείας εἰσὶ καθαροί
  english_pob_choice: they are half clean
  chosen_korean: 겉으로는 절반쯤 깨끗해 보이지만
  alternatives_korean:
  - 절반은 깨끗하지만
  - 반쯤만 깨끗하지만
  lexicon: καθαροί
  rationale: 직역하면 ‘절반쯤 깨끗하다’이지만, 문맥상 외형상의 부분적 정결을 가리키는 대비가 핵심이어서 ‘겉으로는…깨끗해 보이지만’으로 자연스럽게 살렸습니다.
- source_word: ἀκάθαρτοί εἰσι
  english_pob_choice: they are unclean
  chosen_korean: 더럽습니다
  alternatives_korean:
  - 부정합니다
  - 깨끗하지 않습니다
  lexicon: ἀκάθαρτος
  rationale: 의례적·도덕적 불결을 함께 포함하는 말이지만, 이 문장에서는 앞의 ‘깨끗하다’와 직접 대조되는 표현으로서 ‘더럽다’가 가장 즉각적이고 힘 있게 대응됩니다.
theological_decisions:
- issue: ‘깨끗함/더러움’의 대조를 도덕적 위선의 비유로 전달할지 여부
  chosen_reading: 문자적 정결 표현을 유지하되, 한국어에서는 ‘겉으로는…깨끗해 보이지만’이라는 문장 구조로 비유성과 대조를 드러냈습니다.
  alternative_readings:
  - ‘절반은 깨끗하지만 사실은 깨끗하지 않습니다’
  - ‘반은 정결하지만 실제로는 부정합니다’
  rationale: 원문은 동물 비유를 통해 부분적 정결과 실제 부정함을 대조합니다. 한국어에서는 청자가 즉시 이해할 수 있도록 외형/실상 대비를 분명히 했습니다.
  doctrine_reference: 비유적 윤리 경고의 문맥 보존
