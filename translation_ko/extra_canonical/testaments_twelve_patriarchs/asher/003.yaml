  to: '그러나 나의 자녀들아, 너희는 그들처럼 선과 악을 함께 지닌 두 얼굴을 가진 사람들이 되지 마십시오. 오히려 선함에만 굳게 붙드십시오. 주 하나님께서 그 안에서 안식하시며, 사람들도 그것을 사모하기 때문입니다.


    그러나 악을 피하고, 너희의 선한 행위로 그 계책을 무너뜨리십시오. 두 얼굴을 가진 사람들은 하나님께 속한 사람들이 아니라, 자기들의 욕망을 섬기며 벨리알과 그와 같은 사람들을 기쁘게 하려고 하기 때문입니다.'
  rationale: 원문을 우선하여 ‘안식하다’, ‘욕망을 섬기다’, 그리고 벨리알뿐 아니라 ‘그와 같은 사람들’도 기쁘게 한다는 결말을 복원했습니다. ‘계책’은 διαβούλιον의 문맥상 의미를 보존하며, 명령문과 설명문을 모두 현대 합쇼체로 통일했습니다.
