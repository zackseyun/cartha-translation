  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008.yaml
  text: And after saying these things to them[a], he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep. And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
  footnotes:
  - marker: a
    text: The Greek literally says, 'he died, having fallen asleep in a good sleep,' combining a direct statement of death with traditional sleep imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 이 말들을 그들에게 한 뒤, 그들에게 명령하며 말하였습니다. 「나를 헤브론에 장사하십시오.」 그리고 그는 죽었는데, 좋은 잠을 자듯 잠들었습니다. 그의 아들들은 그가 그들에게 명령한 대로 하였고, 그를 헤브론으로 모셔 가서 그의 조상들과 함께 장사하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνετείλατο
  english_pob_choice: commanded
  chosen_korean: 명령하며
  alternatives_korean:
  - 지시하며
  - 유언하며
  lexicon: LSJ
  rationale: 유언장의 맥락이지만, 그리스어 동사는 실제로 권위를 띤 명령을 뜻하므로 한국어에서도 ‘명령하다’를 살리되, 앞뒤 서술과 자연스럽게 이어지도록 부사형으로 옮겼습니다.
- source_word: Θάψατέ
  english_pob_choice: Bury
  chosen_korean: 장사하십시오
  alternatives_korean:
  - 묻으십시오
  - 매장하십시오
  lexicon: LSJ
  rationale: 단순한 매장 행위이면서도 장례 맥락을 분명히 드러내기 위해 ‘장사하다’를 택했습니다. 현대 한국어에서 공손한 명령형으로도 자연스럽습니다.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  english_pob_choice: having fallen asleep in a good sleep
  chosen_korean: 좋은 잠을 자듯 잠들었습니다
  alternatives_korean:
  - 평안히 잠들었습니다
  - 좋은 잠 속에 잠들었습니다
  lexicon: LSJ
  rationale: 죽음을 잠의 이미지로 표현한 중첩을 유지하려고, 평면적인 ‘평안히’보다 ‘좋은 잠’과 ‘잠들었습니다’를 함께 살렸습니다.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들 곁에
  lexicon: BDAG
  rationale: 직역하면 ‘그의 아버지들과 함께’이지만, 한국어에서는 묘지·선조 묘역의 관용적 의미가 잘 드러나도록 ‘조상들’로 옮겼습니다. 다만 고대 장례 공식의 함의를 유지했습니다.
theological_decisions:
- issue: 죽음을 잠의 이미지와 함께 이중으로 진술하는 방식
  chosen_reading: ‘그는 죽었는데’와 ‘좋은 잠을 자듯 잠들었습니다’를 둘 다 살렸습니다.
  alternative_readings:
  - ‘그는 평안히 죽었습니다’로 통합
  - ‘그는 잠들었습니다’만 번역
  rationale: 원문은 단순한 죽음 서술과 은유적 수면 표현을 함께 사용합니다. 둘 중 하나로 합치면 문체와 의미의 층위가 줄어들므로, 긴장을 그대로 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
