id: T12P.ASH.3.1
reference: Testament of Asher 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: III. Ὑμεῖς¹ δὲ², *τέκνα μου³, μὴ γίνεσθε *κατ᾽ αὐτοὺς⁴ διπρόσωποι, ἀγαθότητος καὶ κακίας, ἀλλὰ τῇ ἀγαθότητι μόνῃ⁵ κολλήθητε, ὅτι ⌜Κύριος⌝⁶ ὁ Θεὸς *ἀναπαύεται ἐν⁷ αὐτῇ⁸, καὶ οἱ ἄνθρωποι *αὐτὴν ποθοῦσιν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/001.yaml
  text: But you, my children, do not become double-faced[a] like them, in goodness and wickedness, but cling to goodness alone, because the Lord God rests in it, and people long for it.
  footnotes:
  - marker: a
    text: Or 'two-faced.' The Greek term pictures a divided moral character, not merely social insincerity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는, 내 자녀들아, 그들처럼 선함과 악함에 관하여 두 얼굴을 가진 사람이 되지 마십시오.[a] 오직 선함에만 붙으십시오. 주 하나님께서 그 안에서 쉬시고, 사람들도 그것을 갈망하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두 마음을 품은’. 그리스어 표현은 단순히 사람을 대할 때의 불성실함만이 아니라, 선과 악 사이에서 나뉜 도덕적 성품을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς ... τέκνα μου
  english_pob_choice: But you, my children
  chosen_korean: 그러나 너희, 내 자녀들아
  alternatives_korean:
  - 그러나 너희는, 내 자녀들아
  - 그러나 내 자녀들인 너희여
  lexicon: 2인칭 복수 대명사 / 친족적 호칭
  rationale: 대조 접속사 δέ의 흐름을 살리면서, 직접 호칭인 '내 자녀들아'를 자연스러운 한국어 어순으로 배치했습니다.
- source_word: διπρόσωποι
  english_pob_choice: double-faced
  chosen_korean: 두 얼굴을 가진 자
  alternatives_korean:
  - 두 마음을 품은 자
  - 이중적인 자
  lexicon: 복합 형용사
  rationale: POB의 각주가 지적하듯 단순한 사회적 위선보다 분열된 도덕적 성격을 드러내기 위해, 직역에 가까운 '두 얼굴을 가진 자'를 택했습니다.
- source_word: τῇ ἀγαθότητι μόνῃ κολλήθητε
  english_pob_choice: cling to goodness alone
  chosen_korean: 오직 선함에만 매달리십시오
  alternatives_korean:
  - 오직 선함에만 붙으십시오
  - 선함에만 굳게 매달리십시오
  lexicon: κολλάω / 한정어 μόνῃ
  rationale: ‘매달리다’는 κολλάω의 밀착·부착 이미지를 살리고, μόνῃ의 배타성을 '오직 …에만'으로 분명히 했습니다.
- source_word: Κύριος ὁ Θεός
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 하나님
  - 야훼 하나님
  lexicon: κύριος + Θεός
  rationale: 본문은 하나님을 가리키는 호칭 결합이므로 한국어 성경에서 널리 쓰이는 '주 하나님'을 유지하되, 장르상 본문 인용의 자연스러움을 우선했습니다.
- source_word: ἀναπαύεται ἐν αὐτῇ
  english_pob_choice: rests in it
  chosen_korean: 그 안에 쉬시며
  alternatives_korean:
  - 그 안에 거하시며
  - 그 안에서 안식하시며
  lexicon: ἀναπαύομαι
  rationale: 하나님을 주어로 한 능동적 현재형을 살려 '쉬시며'로 옮기고, '안식하다'보다 덜 경직된 표현을 택했습니다.
theological_decisions:
- issue: ‘주 하나님’ 호칭과 야훼 표기 여부
  chosen_reading: 본문 번역에서는 '주 하나님'을 유지했습니다.
  alternative_readings:
  - 야훼 하나님
  - 주님 하나님
  rationale: 이 본문은 창세기적 지혜훈계 문맥의 인용으로, 현행 POB 기본값인 야훼 표기를 반드시 요구하는 직접 인용 맥락이 아니므로 전통적 호칭 결합을 유지했습니다.
  doctrine_reference: 호칭 번역 일관성 및 본문 장르 적합성
