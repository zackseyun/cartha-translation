revisions:
- from: 그러나 너희, 내 자녀들아, 그들과 같이 선함과 악함에서 두 얼굴을 가진 자가 되지 말고, 오직 선함에만 매달리십시오. 왜냐하면 주 하나님께서 그 안에 쉬시며, 사람들은 그것을 갈망하기 때문입니다.[a]
  to: 그러나 너희는, 내 자녀들아, 그들처럼 선함과 악함에 관하여 두 얼굴을 가진 사람이 되지 마십시오.[a] 오직 선함에만 붙으십시오. 주 하나님께서 그 안에서 쉬시고, 사람들도 그것을 갈망하기 때문입니다.
  rationale: ‘그들처럼’을 두 얼굴을 가진 사람이 되지 말라는 명령에 직접 연결하고, 선함과 악함의 관계를 ‘관하여’로 밝혔습니다. 각주는 해설 대상인 ‘두 얼굴을 가진’ 뒤로 옮겼으며, 나머지 문장은 원문의 인과관계와 선함을 가리키는 대명사 관계를 유지했습니다.
