id: T12P.ASH.3.2
reference: Testament of Asher 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Τὴν ⌜δὲ⌝ κακίαν ἀποδράσατε¹⁰, ἀναιροῦντες *τὸ διαβούλιον¹¹ ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι, ὅτι οἱ διπρόσωποι *οὐκ εἰσὶ τοῦ Θεοῦ¹², ἀλλὰ ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν, ἵνα τῷ Βελίαρ ἀρέσωσιν, καὶ τοῖς ὁμοίοις¹³ αὐτῶν ἀνθρώποις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/002.yaml
  text: But flee wickedness, destroying its plan by your good deeds; for the double-faced are not of God, but are enslaved to their own desires, so that they may please Beliar[b].
  footnotes:
  - marker: b
    text: Beliar is the Greek form of the name often rendered Belial.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 악을 피하고, 너희의 선한 행위로 그 계획을 무너뜨리십시오. 두 얼굴을 가진 자들은 하나님께 속한 자들이 아니며, 자기 욕망에 예속되어 벨리아르와 그들과 같은 사람들을 기쁘게 하려 하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 벨리아르는 흔히 벨리알로 옮기는 이름의 그리스어 형태입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὴν ... κακίαν ἀποδράσατε
  english_pob_choice: flee wickedness
  chosen_korean: 악을 피하고
  alternatives_korean:
  - 악에서 달아나고
  - 사악함을 피해
  lexicon: ἀποδράσατε
  rationale: Ἀποδράσατε는 단순 회피보다 강한 ‘도망하라/피하라’의 뉘앙스를 가지므로, 간결하게 ‘악을 피하고’로 옮겨 긴박한 권면을 살렸습니다.
- source_word: τὸ διαβούλιον ... ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι
  english_pob_choice: destroying its plan by your good deeds
  chosen_korean: 너희의 선한 행위로 그 계획을 무너뜨리십시오
  alternatives_korean:
  - 너희의 선한 행위로 그 꾀를 없애십시오
  - 너희의 선행으로 그 음모를 깨뜨리십시오
  lexicon: διαβούλιον / πράξεσι
  rationale: διαβούλιον은 ‘계획/꾀/의논’의 뜻이 있어 여기서는 악의 의도된 ‘계획’으로 옮겼고, ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι는 수단을 나타내므로 ‘너희의 선한 행위로’가 가장 자연스럽습니다.
- source_word: οἱ διπρόσωποι
  english_pob_choice: the double-faced
  chosen_korean: 두 얼굴을 가진 자들
  alternatives_korean:
  - 겉과 속이 다른 자들
  - 이중적인 자들
  lexicon: διπρόσωποι
  rationale: 직역형인 ‘두 얼굴을 가진 자들’이 원문의 비난적 은유를 가장 직접적으로 전달하며, 문맥상 위선과 이중성을 함께 드러냅니다.
- source_word: ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν
  english_pob_choice: are enslaved to their own desires
  chosen_korean: 자기 욕망의 노예가 되어
  alternatives_korean:
  - 자기 욕망에 종노릇하여
  - 자기 욕망에 사로잡혀
  lexicon: δουλεύουσιν
  rationale: POB가 이미 ‘enslaved’로 수정한 흐름을 따라, δουλεύουσιν의 종속 상태를 분명히 드러내기 위해 ‘노예가 되어’로 옮겼습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  - 벨리아르/벨리알
  lexicon: Βελίαρ
  rationale: 고유명사는 현대 음역을 따르되, 본문과 각주에서 같은 형태를 일관되게 유지하기 위해 ‘벨리아르’로 옮겼습니다.
theological_decisions:
- issue: δουλεύουσιν의 종속성 표현
  chosen_reading: ‘자기 욕망의 노예가 되어’로 번역해 단순한 선호나 습관이 아니라 지배받는 상태를 드러냈습니다.
  alternative_readings:
  - 자기 욕망을 따른다
  - 자기 욕망을 섬긴다
  rationale: 본문은 욕망이 행위를 지배하는 예속 상태를 말하므로, 이를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 인간의 죄에 대한 예속과 우상적 종속
