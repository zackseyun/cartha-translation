base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001.yaml
  text: '1[1]. The copy of the testament of Asher.


    2. In the one hundred and twenty-fifth year of his life, while still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything upright before God.


    3. God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two outcomes.


    4. Therefore all things are twofold[2], set one over against the other.


    5. For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.


    6. If, then, the soul desires to walk well, it does all its deeds in righteousness; and even if it sins, it immediately repents.


    7. For by thinking righteous thoughts and casting away wickedness, it at once overturns evil and uproots sin.


    8. But if its purpose inclines to evil, all its deeds are in wickedness, driving away the good and clinging to the evil, and it is ruled by Beliar; and even if it does something good, it turns it into evil.


    9. For whenever it begins to do good in an evil way, it drives the end of the action for him into evil, because the treasure of its purpose is filled with an evil spirit.


    10. My children, obey your father, and bury me near my fathers.”


    11. And after he had drawn up his feet, he fell asleep in peace.


    12. And after five years they carried him up to Hebron[3], and placed him with his fathers.'
  footnotes:
  - marker: '1'
    text: Verse 1 in the source begins with a superscription, 'The copy of the testament of Asher.'
    reason: textual_variant
  - marker: '2'
    text: The chapter order in the source places Asher's ethical discourse before the brief burial notice; the final burial commands and death report are translated here as part of the same chapter unit.
    reason: textual_variant
  - marker: '3'
    text: '''Breasts'' renders the concrete Greek term for the chest as the seat of inward deliberation; ''hearts'' would be a smoother but less literal alternative.'
    reason: lexical_alternative
translation:
  language: ko
  text: '1. 아셋의 증언의 사본입니다.


    2. 그의 생애 백이십오 년에, 아직 건강할 때에 그가 그들에게 말하였습니다. “아셋의 자녀들아, 너희 아버지의 말을 들으십시오. 그러면 내가 하나님 앞에서 옳은 모든 것을 너희에게 보여 주겠습니다.


    3. 하나님께서는 사람의 자손에게 두 길과 두 목적과 두 행위와 두 방식과 두 결과를 주셨습니다.


    4. 그러므로 모든 것은 두 가지이며 — 서로 마주 서 있습니다.


    5. 선과 악의 두 길이 있기 때문입니다. 그 안에는 우리의 가슴에 있는 두 목적이 있어 그것들을 구별합니다.


    6. 그러므로 영혼이 잘 걷고자 하면, 그 모든 행위를 의로 행합니다. 그리고 비록 죄를 짓더라도 곧바로 회개합니다.


    7. 의로운 생각을 하고 악을 내버림으로써, 그것은 곧바로 악을 뒤엎고 죄를 뿌리째 뽑습니다.


    8. 그러나 그 목적이 악으로 기울면, 그 모든 행위는 악함 안에 있으며, 선을 밀어내고 악에 달라붙으며, 벨리아르의 지배를 받습니다. 그리고 비록 좋은 일을 하더라도 그것을 악으로 바꿉니다.


    9. 그것이 악한 방식으로 선을 행하기 시작할 때마다, 그 행위의 끝을 그에게서 악으로 몰아가며, 그 목적의 보화가 악한 영으로 가득하기 때문입니다.


    10. 내 자녀들아, 너희 아버지의 말을 따르고, 나를 내 조상들 곁에 묻으십시오.”


    11. 그가 발을 거두어 올린 뒤, 평안히 잠들었습니다.


    12. 그리고 다섯 해 뒤에 그들은 그를 헤브론으로 올려 가져가, 그의 조상들과 함께 두었습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον διαθήκης
  english_pob_choice: The copy of the testament
  chosen_korean: 증언의 사본
  alternatives_korean:
  - 언약의 사본
  - 유언의 사본
  - 증서의 사본
  lexicon: LSJ
  rationale: διαθήκη는 문맥상 ‘유언/증언’의 성격을 띠지만, 이 문서는 편집된 고별 권면의 사본이므로 한국어에서는 형식과 장르를 살려 ‘사본’으로, 제목성 표현은 너무 교회적이지 않게 ‘증언’으로 옮겼습니다.
- source_word: ὑγιαίνων
  english_pob_choice: while still healthy
  chosen_korean: 아직 건강할 때에
  alternatives_korean:
  - 건강한 상태에서
  - 아직 평안할 때에
  lexicon: LSJ
  rationale: 말하기 직전의 육체적 상태를 나타내므로 ‘아직 건강할 때에’가 자연스럽고 원문의 상황성을 보존합니다.
- source_word: εὐθές
  english_pob_choice: upright
  chosen_korean: 옳은
  alternatives_korean:
  - 올바른
  - 바른
  - 정직한
  lexicon: LSJ
  rationale: 하나님 앞에서의 윤리적 적합성을 가리키므로 ‘옳은’이 가장 간결하게 도덕적 진실성을 나타냅니다.
- source_word: διαβούλια
  english_pob_choice: purposes
  chosen_korean: 목적
  alternatives_korean:
  - 의도
  - 계획
  - 생각
  lexicon: LSJ
  rationale: 내면의 의도와 지향을 가리키는 말로, 행동을 낳는 방향성을 살리기 위해 ‘목적’을 택했습니다.
- source_word: στέρνοις
  english_pob_choice: breasts
  chosen_korean: 가슴
  alternatives_korean:
  - 흉부
  - 가슴속
  - 마음
  lexicon: LSJ
  rationale: 신체적·비유적 의미를 함께 살리되 한국어에서 너무 노골적이지 않게 ‘가슴’으로 옮겼습니다.
- source_word: ἐν κατέναντι τοῦ ἑνός
  english_pob_choice: set one over against the other
  chosen_korean: 서로 마주 서 있습니다
  alternatives_korean:
  - 하나가 다른 하나를 마주합니다
  - 서로 반대편에 놓여 있습니다
  - 서로 대조됩니다
  lexicon: LSJ
  rationale: 원문의 대칭·대립 구조를 한국어로 자연스럽게 드러내기 위해 ‘마주 서 있습니다’로 처리했습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  - 베리아르
  lexicon: transliteration
  rationale: 그리스어 본문의 고유명사를 음역해 인격화된 악의 권세를 보존했습니다.
- source_word: ἐλαύνει
  english_pob_choice: it drives the end of the action for him into evil
  chosen_korean: 그 행위의 끝을 그에게서 악으로 몰아가며
  alternatives_korean:
  - 그 행위의 결과를 악으로 몰며
  - 그 행위의 끝을 악으로 밀어가며
  lexicon: LSJ
  rationale: ‘몰아가다’는 동사의 추진력과 방향성을 살리면서 결과의 왜곡을 한국어로 드러냅니다.
theological_decisions:
- issue: 두 길과 두 목적의 윤리적 대조
  chosen_reading: 이를 우주론적 이원론으로 확장하지 않고, 인간의 도덕적 선택과 내적 지향의 강한 대조로 옮겼습니다.
  alternative_readings:
  - 선악의 형이상학적 두 원리로 읽기
  - 단순한 심리적 충돌로 약화시키기
  rationale: 원문은 반복적으로 ‘두’의 대칭을 강조하지만, 본문 자체가 설명하는 초점은 인간 행위와 내면의 방향입니다. 번역은 그 긴장을 유지하되 과잉 해석은 피합니다.
  doctrine_reference: 본문의 윤리적 긴장 유지
- issue: Βελίαρ의 인격적 악의 권세
  chosen_reading: ‘벨리아르’를 고유명사로 유지하여, 단순한 추상적 악이 아니라 지배하는 악한 존재로 읽히게 했습니다.
  alternative_readings:
  - 벨리알로 표기
  - 무가치/사악함의 일반 명사로 처리
  rationale: 본문은 ‘지배를 받는다’는 서술과 결합해 인격화된 악의 권세를 전제하므로, 이름을 보존하는 것이 가장 직접적입니다.
  doctrine_reference: 악의 인격화에 대한 본문 차원의 존중
