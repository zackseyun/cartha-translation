source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Δίκαια *γὰρ λογιζομένη³¹ καὶ ἀπορρίπτουσα³² τὴν πονηρίαν ἀνατρέπει εὐθὺς τὸ κακόν³³, καὶ³⁴ ἐκριζοῖ³⁵ τὴν ἁμαρτίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/007.yaml
  text: For by considering what is righteous and casting away wickedness, it at once overturns evil and uproots sin.
translation:
  language: ko
  text: 이는 의로운 것을 생각하고 악을 버리며, 곧바로 악을 뒤엎고 죄를 뿌리째 뽑습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαια λογιζομένη
  english_pob_choice: considering what is righteous
  chosen_korean: 의로운 것을 생각하며
  alternatives_korean:
  - 옳은 것을 헤아리며
  - 의로운 것을 분별하며
  - 의로운 생각을 하며
  lexicon: λογίζομαι
  rationale: 영어 POB의 ‘considering what is righteous’를 따라, ‘의로운 것을’의 대상을 분명히 하고 ‘생각하며’로 사유·숙고의 동작을 자연스럽게 살렸습니다.
- source_word: ἀπορρίπτουσα τὴν πονηρίαν
  english_pob_choice: casting away wickedness
  chosen_korean: 악을 버리면
  alternatives_korean:
  - 악을 내던지면
  - 사악함을 내버리면
  - 악행을 버리면
  lexicon: ἀπορρίπτω, πονηρία
  rationale: ἀπορρίπτουσα의 ‘던져 버리다/내치다’는 뉘앙스를 한국어에서 가장 자연스럽게 풀어 ‘버리다’로 옮겼고, πονηρία는 문맥상 추상 명사 ‘악’으로 간명하게 렌더링했습니다.
- source_word: ἀνατρέπει εὐθὺς τὸ κακόν
  english_pob_choice: it at once overturns evil
  chosen_korean: 곧바로 악을 뒤엎고
  alternatives_korean:
  - 즉시 악을 무너뜨리고
  - 곧 악을 전복하고
  - 바로 악을 뒤집어엎고
  lexicon: ἀνατρέπω, εὐθύς, κακός
  rationale: εὐθὺς의 즉시성을 ‘곧바로’로, ἀνατρέπει의 강한 전복 이미지를 ‘뒤엎다’로 살려 원문의 힘을 유지했습니다.
- source_word: ἐκριζοῖ τὴν ἁμαρτίαν
  english_pob_choice: uproots sin
  chosen_korean: 죄를 뿌리째 뽑습니다
  alternatives_korean:
  - 죄를 뿌리째 뽑아냅니다
  - 죄를 뿌리째 없앱니다
  - 죄를 뿌리째 뽑습니다
  lexicon: ἐκριζόω, ἁμαρτία
  rationale: ἐκριζοῖ의 ‘뿌리 뽑다’라는 비유를 한국어 관용인 ‘뿌리째 뽑다’로 직관적으로 옮겨, ἁμαρτία를 ‘죄’로 표준화했습니다.
theological_decisions:
- issue: 지혜-윤리적 명령의 인과 구조
  chosen_reading: 의로운 것을 생각하고 악을 버리는 행위가 악과 죄를 즉각적으로 무너뜨리고 뿌리뽑는다는 인과를 문장 구조로 드러냈습니다.
  alternative_readings:
  - ‘그러므로’ 없이 단순 서술로 옮기는 방식
  - ‘의로운 것을 헤아리면’처럼 더 추상적인 방식
  rationale: 원문이 행위의 결과를 설명하는 진술이므로, ‘그러므로’와 동사 연쇄를 유지해 윤리적 인과를 분명히 했습니다.
  doctrine_reference: 윤리적 권면과 죄의 제거에 관한 일반적 지혜 전통
