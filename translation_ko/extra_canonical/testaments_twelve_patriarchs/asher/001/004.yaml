lexical_decisions:
- source_word: πάντα
  english_pob_choice: all things
  chosen_korean: 모든 것은
  alternatives_korean:
  - 모든 일은
  - 만물은
  lexicon: πᾶς/πάντα
  rationale: 포괄적 진술이므로 ‘모든 것’으로 옮겨 전체 대상을 넓게 포착했습니다.
- source_word: δύο εἰσίν
  english_pob_choice: are twofold
  chosen_korean: 둘로 되어 있으며
  alternatives_korean:
  - 둘입니다
  - 두 가지입니다
  - 둘로 나뉘어 있으며
  lexicon: δύο + εἰμί
  rationale: 단순 수적 진술을 넘어서 서로 대조되는 두 요소의 구조를 드러내기 위해 ‘둘로 되어 있다’로 자연스럽게 옮겼습니다.
- source_word: ἐν κατέναντι τοῦ ἑνός
  english_pob_choice: one over against the other
  chosen_korean: 하나는 다른 하나와 마주 서 있습니다
  alternatives_korean:
  - 하나는 다른 것과 맞서 있습니다
  - 하나는 다른 하나 앞에 있습니다
  lexicon: κατέναντι
  rationale: κατέναντι의 ‘마주하여/대조하여’라는 뜻을 살려 단순한 병렬이 아니라 서로 대면하는 관계를 표현했습니다.
theological_decisions:
- issue: 이 절의 형식적 대조를 어떻게 한국어로 드러낼지
  chosen_reading: 도덕적 교훈으로 풀기보다, 원문의 대조적 구조를 그대로 보이도록 옮겼습니다.
  alternative_readings:
  - ‘선과 악이 있다’처럼 의미를 풀어쓴 해석적 번역
  - ‘둘로 갈라져 있다’처럼 더 강한 분열 뉘앙스
  rationale: 원문은 일반적 원리의 대조를 말할 뿐 특정 도덕 범주를 명시하지 않으므로, 해석을 덧씌우지 않고 구조 자체를 보존했습니다.
