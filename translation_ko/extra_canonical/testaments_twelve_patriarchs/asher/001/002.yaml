  text: While still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything that is upright before God.”
translation:
  language: ko
  text: 그는 건강할 때에 그들에게 이렇게 말했습니다. “아셀의 자녀들아, 너희 아버지의 말을 들으십시오. 그리고 나는 하나님 앞에서 올바른 모든 것을 너희에게 보여 주겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  english_pob_choice: While still healthy
  chosen_korean: 아직 건강할 때
  alternatives_korean:
  - 건강한 상태에서
  - 몸이 성할 때
  lexicon: ὑγιαίνω
  rationale: 부사적 분사로서 상태를 나타내므로, 시간과 상태를 함께 살린 자연스러운 한국어로 옮겼습니다.
- source_word: τέκνα Ἀσήρ
  english_pob_choice: children of Asher
  chosen_korean: 아셀의 자녀들아
  alternatives_korean:
  - 아셀의 아이들아
  - 아셀의 자손들아
  lexicon: τέκνον
  rationale: 직접 부름이므로 호격을 살렸고, 족장 문맥에서 자연스러운 ‘자녀들/자손들’ 가운데 ‘자녀들’을 택했습니다.
- source_word: τὸ εὐθὲς
  english_pob_choice: everything that is upright
  chosen_korean: 올바른 모든 것
  alternatives_korean:
  - 바른 모든 것
  - 곧은 모든 것
  - 의로운 모든 것
  lexicon: εὐθύς
  rationale: 도덕적·인격적 올바름을 가리키는 표현으로 보아 ‘올바른’으로 옮기되, 대상 전부를 포괄하는 구조를 유지했습니다.
- source_word: ἐνώπιον τοῦ Θεοῦ
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 앞에
  - 하나님 보시기에
  lexicon: ἐνώπιον + Θεός
  rationale: 공적·관계적 기준을 나타내는 전치사구이므로 한국어 관용에 맞게 ‘앞에서’로 옮겼습니다.
theological_decisions:
- issue: 말하는 자의 자기소개와 권면의 직접성
  chosen_reading: ‘그는… 말했습니다’ 뒤에 직접화법을 유지해, 아버지가 자녀들에게 남기는 권면의 긴박함을 살렸습니다.
  alternative_readings:
  - 간접화법으로 완전히 평서화
  - 더 완곡한 서술로 바꿈
  rationale: 원문은 서술 뒤 직접 인용으로 이어지므로, 화자의 음성을 분명히 드러내는 편이 텍스트의 수사적 힘에 더 충실합니다.
  doctrine_reference: 서사적 직접화법 보존
