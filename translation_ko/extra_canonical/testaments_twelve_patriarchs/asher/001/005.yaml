  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὁδοὶ *⌜γὰρ⌝ εἰσὶ²⁰ δύο, καλοῦ καὶ κακοῦ· ἐν οἷς²¹ εἰσι τὰ δύο²² διαβούλια ἐν στέρνοις²³ ἡμῶν²⁴ *διακρίνοντα αὐτά²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/005.yaml
  text: For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.
translation:
  language: ko
  text: 사실 두 길이 있으니, 선한 길과 악한 길입니다. 그 안에는 우리 가슴속의 두 가지 뜻이 있어 그것들을 구별합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ ... δύο, καλοῦ καὶ κακοῦ
  english_pob_choice: two ways, of good and of evil
  chosen_korean: 두 길이 있으니, 선한 길과 악한 길입니다
  alternatives_korean:
  - 두 길이 있으니, 좋은 것과 나쁜 것의 길입니다
  - 두 길이 있으니, 선과 악의 길입니다
  lexicon: 길
  rationale: ὁδοί는 단순한 ‘방법’보다 삶의 방향을 가리키는 ‘길’이 자연스럽고, καλοῦ/κακοῦ의 대조는 형용사식 병렬을 살려 ‘선한 길과 악한 길’로 옮기는 것이 가장 직접적입니다.
- source_word: τὰ δύο διαβούλια
  english_pob_choice: the two purposes
  chosen_korean: 두 가지 뜻
  alternatives_korean:
  - 두 계획
  - 두 의도
  - 두 목적
  lexicon: 뜻
  rationale: διαβούλια는 내면의 의도·결의·궁리의 뉘앙스를 가지므로, 한국어에서는 문맥상 넓게 포괄하는 ‘뜻’이 가장 무리 없이 대응합니다.
- source_word: ἐν στέρνοις ἡμῶν
  english_pob_choice: in our breasts
  chosen_korean: 우리 가슴속
  alternatives_korean:
  - 우리 품속
  - 우리 심장 안
  - 우리 내면
  lexicon: 가슴
  rationale: στέρνοις는 문자적으로 ‘가슴/흉부’를 뜻하지만 한국어에서는 내면의 자리라는 의미를 살리면서도 자연스러운 표현인 ‘가슴속’을 택했습니다.
- source_word: διακρίνοντα αὐτά
  english_pob_choice: distinguishing them
  chosen_korean: 그것들을 구별합니다
  alternatives_korean:
  - 그것들을 분별합니다
  - 그것들을 가릅니다
  lexicon: 구별하다
  rationale: διακρίνω는 분별·구별·판단의 뜻을 가지며, 여기서는 두 내적 의도를 서로 가르는 기능을 말하므로 ‘구별합니다’가 가장 안정적입니다.
theological_decisions:
- issue: 내면의 두 길/두 의도의 구조
  chosen_reading: 사람 안에 선과 악의 두 길이 있고, 그 안에서 두 가지 의도가 서로를 구별하게 합니다.
  alternative_readings:
  - 사람 안에 선과 악의 두 길이 있고, 그 안에서 두 가지 목적이 서로를 가릅니다.
  - 사람 안에 선과 악의 두 길이 있고, 그 안에서 두 가지 계획이 서로를 구별합니다.
  rationale: 본문은 도덕적 이분법을 단순 설명하는 문장이므로, 이를 심리학적으로 약화시키지 않고 내적 선택의 실재를 드러내는 방향으로 옮겼습니다.
  doctrine_reference: 인간 내면의 도덕적 분기와 선택에 관한 교훈적 진술
