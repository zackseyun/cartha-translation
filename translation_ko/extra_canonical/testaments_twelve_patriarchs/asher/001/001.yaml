revisions:
- from: 아셀의 유언은 야곱과 실바의 열 번째 아들인 아셀에 관한 것입니다. 아셀의 유언 사본은 그가 자기 아들들에게 생애의 백이십오 년째에 말한 것입니다.
  to: '야곱과 실바의 열째 아들 아셀의 유언.


    아셀의 유언 사본, 곧 그가 자기 생애의 백스물다섯째 해에 자기 아들들에게 말한 것들입니다.'
  rationale: 표제의 소유·동격 구조를 회복하고, 서문의 ‘사본’ 및 관계절을 유지했습니다. 원문에 제공된 비평 장치 표시는 있으나 해당 주석 내용이 과제 자료에 제시되지 않았으므로 주석을 추정하여 만들지 않았습니다.
