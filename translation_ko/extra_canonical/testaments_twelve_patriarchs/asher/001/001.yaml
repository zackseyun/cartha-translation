id: T12P.ASH.1.1
reference: Testament of Asher 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Διαθήκη Ἀσὴρ τοῦ δεκάτου υἱοῦ Ἰακὼβ καὶ Ζέλφας¹. I. Ἀντίγραφον διαθήκης Ἀσήρ², ἃ³ ἐλάλησε τοῖς υἱοῖς αὐτοῦ *ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς⁴ *ζωῆς αὐτοῦ⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/001.yaml
  text: The testament of Asher, the tenth son of Jacob and Zilpah. The copy of the testament of Asher, which he spoke to his sons in the one hundred and twenty-fifth year of his life.
translation:
  language: ko
  text: 아셀의 유언은 야곱과 실바의 열 번째 아들인 아셀에 관한 것입니다. 아셀의 유언 사본은 그가 자기 아들들에게 생애의 백이십오 년째에 말한 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: The testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 증언
  - 유서
  lexicon: διαθήκη
  rationale: 여기서는 고유한 책 제목과 임종 시의 최종 진술을 가리키므로, POB의 ‘testament’를 살려 ‘유언’으로 옮겼습니다. ‘언약’은 신학적 계약 뉘앙스가 강해 제목의 성격을 흐릴 수 있습니다.
- source_word: τοῦ δεκάτου υἱοῦ
  english_pob_choice: the tenth son
  chosen_korean: 열 번째 아들
  alternatives_korean:
  - 열째 아들
  - 십 번째 아들
  lexicon: δεκάτος
  rationale: 서수 표현을 자연스러운 현대 한국어로 옮겼습니다. ‘열 번째’가 가장 평이하고 문맥상 명확합니다.
- source_word: Ζέλφας
  english_pob_choice: Zilpah
  chosen_korean: 실바
  alternatives_korean:
  - 질바
  - 젤바
  lexicon: proper noun
  rationale: 창세기 인물 이름은 한국어에서 통용되는 성경식 표기인 ‘실바’를 따랐습니다.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the one hundred and twenty-fifth year of his life
  chosen_korean: 생애의 백이십오 년째
  alternatives_korean:
  - 그의 생애의 백이십오 번째 해에
  - 그가 산 지 백이십오 년째에
  lexicon: ἔτος / ζωή
  rationale: 직역을 유지하되 한국어 문맥에 자연스럽게 ‘생애의 백이십오 년째’로 정리했습니다. 이는 단순 연령이 아니라 삶의 연차를 가리키는 표현입니다.
theological_decisions:
- issue: 문서 제목과 본문 진술의 구분
  chosen_reading: 첫 문장은 제목격 표제, 둘째 문장은 유언 사본의 서문으로 구분해 번역했습니다.
  alternative_readings:
  - 두 문장을 한 문단으로 합쳐 서술하기
  - ‘언약’으로 통일해 신학적 연속성을 강조하기
  rationale: 원문은 ‘Διαθήκη Ἀσὴρ…’와 ‘Ἀντίγραφον διαθήκης Ἀσήρ’로 표제와 서문을 나란히 제시하므로, 한국어에서도 그 구분을 보존하는 것이 사본적 구조를 더 잘 드러냅니다.
  doctrine_reference: 문헌 형식 보존 원칙
- issue: ‘유언’ 선택
  chosen_reading: Διαθήκη를 ‘유언’으로 옮겨 개인의 마지막 선언이라는 장르성을 살렸습니다.
  alternative_readings:
  - 언약
  - 증언
  rationale: 이 작품의 제목은 성경의 covenant 용례보다 patriarchal testament 장르에 가깝기 때문에, 독자가 본문의 문학적 성격을 오해하지 않도록 ‘유언’을 택했습니다.
  doctrine_reference: 장르-의미 보존 원칙
