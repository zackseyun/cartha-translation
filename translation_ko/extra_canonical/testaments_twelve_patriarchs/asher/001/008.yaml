id: T12P.ASH.1.8
reference: Testament of Asher 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν δὲ *ἐν †πονηρᾷ³⁶ κλίνῃ³⁷ †τὸ διαβούλιον†³⁸, *πᾶσα πρᾶξις αὐτῆς ἐστιν³⁹ ἐν πονηρίᾳ, καὶ⁴⁰ ἀπωθουμένη⁴¹ τὸ ἀγαθόν, *καὶ προσκολλώμενος⁴² τὸ κακόν, καὶ κυριευθεὶς⁴³ ὑπὸ⁴⁴ τοῦ Βελίαρ· κἂν⁴⁵ ἀγαθὸν⁴⁶ πράξει⁴⁷, Γἐν πονηρίᾳ⁴⁸ αὐτὸ⁴⁹ μεταστρέφει⁵⁰˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/008.yaml
  text: But if the intent inclines to evil, all its actions are in wickedness, driving away the good and clinging to the evil, and ruled by Beliar; and even if it does something good, it turns it into evil.
translation:
  language: ko
  text: 그러나 그 의도가 악으로 기울면, 그 의도가 하는 모든 일은 악 가운데 있으며, 그 의도는 선을 밀어내고 악에 매달리며 베리아르의 지배를 받습니다. 비록 선한 일을 하더라도, 그것마저 악으로 바꿉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '베리아르: 악한 영적 세력을 가리키는 이름입니다.'
    reason: 고유명의 지시 대상을 간단히 밝혀 현대 독자의 이해를 돕습니다.
lexical_decisions:
- source_word: ἐν πονηρᾷ ... κλίνῃ τὸ διαβούλιον
  english_pob_choice: the intent inclines to evil
  chosen_korean: 그 의도가 악으로 기울면
  alternatives_korean:
  - 그 의향이 악으로 기울면
  - 그 뜻이 악으로 기울면
  lexicon: διαβούλιον
  rationale: διαβούλιον은 단순한 목적보다 ‘의도/의향’에 가깝고, κλίνῃ는 방향 전환의 이미지를 살려 ‘기울다’로 옮겼습니다.
- source_word: πᾶσα πρᾶξις αὐτῆς ἐστιν ἐν πονηρίᾳ
  english_pob_choice: all its actions are in wickedness
  chosen_korean: 그 모든 행위는 악함에 있으며
  alternatives_korean:
  - 그 모든 행위는 악 가운데 있으며
  - 그 모든 행동은 악함 속에 있으며
  lexicon: πρᾶξις
  rationale: πρᾶξις는 일반적 ‘행동’보다 결과를 낳는 ‘행위’가 더 자연스럽고, ἐν πονηρίᾳ는 상태를 드러내기 위해 ‘악함에 있다’로 옮겼습니다.
- source_word: ἀπωθουμένη τὸ ἀγαθόν ... προσκολλώμενος τὸ κακόν
  english_pob_choice: driving away the good and clinging to the evil
  chosen_korean: 선을 밀어내고 악에 매달리며
  alternatives_korean:
  - 선을 물리치고 악에 붙으며
  - 선을 거절하고 악에 달라붙으며
  lexicon: ἀπωθέω / προσκολλάω
  rationale: 대조 구조를 살리기 위해 ἀπωθουμένη는 ‘밀어내다’, προσκολλώμενος는 접착적 결속을 드러내는 ‘매달리다’로 옮겼습니다.
- source_word: καὶ κυριευθεὶς ὑπὸ τοῦ Βελίαρ
  english_pob_choice: and ruled by Beliar
  chosen_korean: 그리고 베리아르에게 지배받습니다
  alternatives_korean:
  - 그리고 베리아르의 지배를 받습니다
  - 그리고 베리아르에게 다스려집니다
  lexicon: κυριεύω
  rationale: κυριευθείς는 ‘주권을 행사하다/지배하다’의 수동형이므로, 단순한 통치보다 강한 구속감을 드러내는 ‘지배받다’가 적절합니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 베리아르
  alternatives_korean:
  - 벨리알
  - 벨리아르
  lexicon: Βελίαρ
  rationale: 고유명사는 현대 음역으로 옮기되, 본문 맥락상 악한 영적 존재를 가리키는 전승을 유지하기 위해 음역을 보존했습니다.
theological_decisions:
- issue: 악의 내적 의도와 행위의 전면적 타락을 어떻게 표현할지
  chosen_reading: 의도가 악으로 기울면 그 영향이 모든 행위로 확장되어, 선조차 악으로 변질된다는 진술로 읽었습니다.
  alternative_readings:
  - 단순히 나쁜 행동이 많아진다는 도덕적 경향으로 완화
  - 선한 행위도 무가치해진다는 의미로 제한
  rationale: 본문은 의도-행위-귀결이 연쇄적으로 타락하는 구조이므로, ‘악함에 있으며… 악으로 바꿉니다’로 전면성을 유지했습니다.
  doctrine_reference: 인간의 내적 성향과 행위의 연쇄적 부패에 대한 본문 자체의 경고
