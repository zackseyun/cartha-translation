id: T12P.ASH.1.6
reference: Testament of Asher 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν οὖν²⁶ ἡ ψυχὴ θέλει²⁷ *†καλῶς πορευθῆναι†, πάσας τὰς πράξεις αὐτῆς ποιεῖ²⁸ ἐν δικαιοσύνῃ, *κἂν ἁμάρτῃ²⁹ εὐθὺς³⁰ μετανοεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
translation:
  language: ko
  text: 그러므로 영혼이 잘 걸어가고자 하면, 자기의 모든 행위를 의로 행합니다. 그리고 비록 죄를 지어도 곧바로 회개합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλει
  english_pob_choice: wants
  chosen_korean: 원합니다 / 하고자 합니다
  alternatives_korean:
  - 바랍니다
  - 갈망합니다
  - 원합니다
  lexicon: θέλω
  rationale: 의지와 지향을 직접 나타내는 동사이므로, POB의 'wants'에 맞춰 ‘하고자 하다’의 뜻으로 옮겼습니다. 여기서는 문맥상 자연스러운 합쇼체를 위해 ‘하고자 하면’으로 처리했습니다.
- source_word: καλῶς πορευθῆναι
  english_pob_choice: to walk well
  chosen_korean: 잘 걸어가다
  alternatives_korean:
  - 선하게 행하다
  - 올바르게 살아가다
  - 좋게 걸어가다
  lexicon: πορεύομαι + καλῶς
  rationale: 직역의 ‘걷다’ 이미지를 살리되, 한국어에서 자연스러운 도덕적 행실의 뜻이 드러나도록 ‘잘 걸어가다’로 옮겼습니다. 원문의 행위-여정 은유를 보존합니다.
- source_word: πράξεις
  english_pob_choice: actions
  chosen_korean: 행위
  alternatives_korean:
  - 일들
  - 행동들
  - 행실
  lexicon: πρᾶξις
  rationale: POB가 'actions'를 택한 것을 따라, 단순한 ‘행동’보다 포괄적인 ‘행위’로 옮겨 반복적 삶의 실천을 드러냈습니다.
- source_word: ἐν δικαιοσύνῃ
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 의 가운데서
  - 공의로
  lexicon: δικαιοσύνη
  rationale: 전치사구를 한국어 부사격으로 자연화하되, 윤리적·관계적 올바름인 ‘의’의 핵심 의미를 유지했습니다.
- source_word: μετανοεῖ
  english_pob_choice: repents
  chosen_korean: 회개합니다
  alternatives_korean:
  - 돌이킵니다
  - 마음을 돌이킵니다
  - 뉘우칩니다
  lexicon: μετανοέω
  rationale: 종교적·도덕적 방향 전환을 나타내는 표준적 대응어로 ‘회개하다’를 사용했습니다. POB의 ‘repents’와 직접 대응합니다.
theological_decisions:
- issue: 실수와 회개의 즉시성
  chosen_reading: ‘비록 죄를 지어도 곧바로 회개합니다’로, 죄 이후 지체 없는 회개의 요구를 분명히 드러냈습니다.
  alternative_readings:
  - ‘곧 회개합니다’
  - ‘즉시 뉘우칩니다’
  rationale: εὐθύς의 긴급성을 살리되, 단순 감정적 후회보다 방향 전환의 종교적 의미를 유지하기 위해 ‘곧바로 회개합니다’로 옮겼습니다.
  doctrine_reference: 회개론 / 윤리적 권면
