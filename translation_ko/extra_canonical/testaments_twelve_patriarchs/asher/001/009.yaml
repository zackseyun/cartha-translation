id: T12P.ASH.1.9
reference: Testament of Asher 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὅτε γὰρ⁵¹ ἄρξεται⁵² *τὸ ἀγαθὸν ποιεῖν⁵³, τὸ τέλος τῆς πράξεως *εἰς πονηρὸν αὐτῷ ἐλαύνει⁵⁴. ἐπειδὴ ὁ⁵⁵ θησαυρὸς⁵⁶ τοῦ διαβουλίου⁵⁷ πονηροῦ⁵⁸ πνεύματος πεπλήρωται⁵⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/009.yaml
  text: For whenever it begins to do good, the end of the action drives him into evil, because the treasure of its purpose is filled with an evil spirit.
translation:
  language: ko
  text: 그가 선한 일을 시작할 때마다, 그 행위의 끝은 그를 악으로 몰아갑니다. 이는 그의 악한 계획의 보물이 악한 영으로 가득 차 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρξεται τὸ ἀγαθὸν ποιεῖν
  english_pob_choice: whenever it begins to do good / when he begins to do evil
  chosen_korean: 그가 선한 일을 시작할 때마다
  alternatives_korean:
  - 그가 좋은 일을 하려고 시작할 때마다
  - 그가 선을 행하기 시작할 때마다
  lexicon: ἄρχομαι + τὸ ἀγαθὸν ποιεῖν
  rationale: 주어진 영어 POB의 최종 정정은 이 구절을 ‘선한 일을 시작할 때마다’로 이해하게 하므로, 흐름을 살리되 본문의 행위 시작점을 자연스럽게 옮겼습니다.
- source_word: τὸ τέλος τῆς πράξεως ... εἰς πονηρὸν αὐτῷ ἐλαύνει
  english_pob_choice: the end of the action drives him toward evil
  chosen_korean: 그 행위의 끝은 그를 악으로 몰아갑니다
  alternatives_korean:
  - 그 행동의 끝은 그를 악으로 이끕니다
  - 그 일의 결말은 그를 악으로 내모읍니다
  lexicon: τέλος / πράξις / ἐλαύνω
  rationale: τέλος와 πράξις를 각각 ‘끝’과 ‘행위’로 직역성 있게 유지했고, ἐλαύνει의 강한 추진감을 ‘몰아갑니다’로 살렸습니다.
- source_word: ὁ θησαυρὸς τοῦ διαβουλίου πονηροῦ πνεύματος πεπλήρωται
  english_pob_choice: the treasure of the evil plan is filled with an evil spirit
  chosen_korean: 그의 악한 계획의 보물이 악한 영으로 가득 차 있기 때문입니다
  alternatives_korean:
  - 그 악한 계획의 보물은 악한 영으로 가득 차 있기 때문입니다
  - 그의 악한 꾀의 보물은 악한 영으로 채워져 있기 때문입니다
  lexicon: θησαυρός / διαβούλιον / πονηρὸν πνεῦμα
  rationale: διαβούλιον을 단순한 ‘목적’보다 POB 정정에 맞춰 ‘계획’으로 옮기고, θησαυρός는 문맥상 내면의 축적을 드러내는 ‘보물’로 유지했습니다.
theological_decisions:
- issue: 마지막 절의 πονηρὸν πνεῦμα
  chosen_reading: ‘악한 영’으로 옮겨, 인격적 악의 작용을 직접 드러냈습니다.
  alternative_readings:
  - ‘악령’
  - ‘악한 정신’
  rationale: 문맥이 단순한 추상 악이 아니라 영적 주체의 충만을 말하므로, 본문 성격을 살리는 직접 표현을 택했습니다.
  doctrine_reference: 영적 존재/악령 이해
