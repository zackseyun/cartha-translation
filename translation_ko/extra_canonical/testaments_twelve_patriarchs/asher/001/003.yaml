  text: Δύο ὁδοὺς *ἔδωκεν ὁ Θεὸς τοῖς υἱοῖς τῶν ἀνθρώπων¹⁴, καὶ δύο διαβούλια, ⌜καὶ δύο πράξεις, *καὶ δύο τρόπους¹⁵⌝, *καὶ ⌜δύο⌝ τέλεα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/003.yaml
  text: God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two ends.
translation:
  language: ko
  text: 하나님께서는 사람들에게 두 길과 두 뜻과 두 행위와 두 방식과 두 결말을 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δύο ὁδοὺς
  english_pob_choice: two ways
  chosen_korean: 두 길
  alternatives_korean:
  - 두 방식
  - 두 도
  lexicon: ὁδός
  rationale: ὁδός는 문자적으로 ‘길’이 가장 직접적이며, 윤리적 삶의 갈림길이라는 의미를 자연스럽게 살릴 수 있습니다.
- source_word: διαβούλια
  english_pob_choice: purposes
  chosen_korean: 뜻
  alternatives_korean:
  - 목적
  - 의도
  - 계획
  lexicon: διαβούλιον
  rationale: 문맥상 내적 의도나 지향을 가리키므로, 과도하게 추상화된 ‘목적’보다 한국어 성경 문맥에서 넓게 통용되는 ‘뜻’이 적절합니다.
- source_word: πράξεις
  english_pob_choice: actions
  chosen_korean: 행위
  alternatives_korean:
  - 행동
  - 실행
  lexicon: πρᾶξις
  rationale: 행동의 실제적 결과를 드러내는 ‘행위’가 원문의 윤리적 대비를 잘 드러냅니다.
- source_word: τρόπους
  english_pob_choice: modes
  chosen_korean: 방식
  alternatives_korean:
  - 방법
  - 형태
  lexicon: τρόπος
  rationale: τρόπος의 ‘방식/태도/양식’ 중에서 여기서는 대비되는 삶의 양식을 뜻하는 ‘방식’이 가장 무난합니다.
- source_word: τέλεα
  english_pob_choice: ends
  chosen_korean: 끝
  alternatives_korean:
  - 결말
  - 목표
  lexicon: τέλος
  rationale: ‘끝’이 두 지향점의 종결/귀결이라는 대비를 간결하게 전달하며, 영어 POB의 ‘ends’와도 직접 대응됩니다.
theological_decisions:
- issue: 일반적 인간성 범주를 어떻게 옮길지
  chosen_reading: ‘사람의 아들들’로 직역했습니다.
  alternative_readings:
  - ‘사람들’
  - ‘인간에게’
  rationale: 원문의 τοῖς υἱοῖς τῶν ἀνθρώπων은 직역상 ‘사람의 아들들’이며, 문학적 대비를 유지하기 위해 축약하지 않았습니다.
  doctrine_reference: source transparency / literal lexical retention
