id: T12P.ASH.5.3
reference: Testament of Asher 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ οὐκ¹⁵ ἔστιν εἰπεῖν τὴν ἀλήθειαν ψεῦδος, οὐδὲ *τὸ δίκαιον ἄδικον¹⁶, ὅτι πᾶσα ἀλήθεια ὑπὸ *τοῦ φωτός¹⁷ ἐστιν, ⌜καθὼς τὰ πάντα¹⁸ ὑπὸ *τοῦ Θεοῦ¹⁹⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/003.yaml
  text: And one cannot call truth falsehood, nor what is righteous unrighteous, because all truth is under the light, just as all things are under God.
translation:
  language: ko
  text: 그리고 진리를 거짓이라 부를 수는 없고, 의로운 것을 불의하다고 할 수도 없습니다. 모든 진리는 빛 아래에 있기 때문이며, 모든 것이 하나님 아래에 있는 것과 같습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπεῖν τὴν ἀλήθειαν ψεῦδος
  english_pob_choice: call truth falsehood
  chosen_korean: 진리를 거짓이라 부를 수는 없고
  alternatives_korean:
  - 진리를 거짓이라고 말할 수는 없고
  - 진리를 거짓으로 부를 수는 없고
  lexicon: εἰπεῖν
  rationale: εἰπεῖν은 단순한 발화를 넘어 무엇을 ‘그렇게 부르다/말하다’는 직접적 표현이어서, POB의 ‘call truth falsehood’를 살려 ‘거짓이라 부르다’로 옮겼습니다.
- source_word: τὸ δίκαιον ἄδικον
  english_pob_choice: what is righteous unrighteous
  chosen_korean: 의로운 것을 불의하다고
  alternatives_korean:
  - 의로운 것을 불의하다 하고
  - 옳은 것을 그르다고
  lexicon: δίκαιον / ἄδικον
  rationale: 대립어를 형식적으로 보존하면서도, 한국어에서 자연스러운 명사구로 ‘의로운 것 / 불의한 것’의 대비를 드러냈습니다.
- source_word: ὑπὸ τοῦ φωτός
  english_pob_choice: under the light
  chosen_korean: 빛 아래에
  alternatives_korean:
  - 빛 아래
  - 빛 아래에 있습니다
  lexicon: ὑπό + 장소적 의미
  rationale: ὑπό가 여기서는 단순한 ‘아래’의 공간적 이미지와 권위/영역의 함의를 함께 가지므로, 직역에 가까운 ‘빛 아래에’로 유지했습니다.
- source_word: ὑπὸ τοῦ Θεοῦ
  english_pob_choice: under God
  chosen_korean: 하나님 아래에 있는 것과 같습니다
  alternatives_korean:
  - 하나님 아래에
  - 하나님 아래에 있습니다
  lexicon: Θεός
  rationale: 마지막 병렬구는 첫 절의 ‘under the light’와 대응하므로, ‘하나님 아래에 있는 것과 같습니다’로 관계를 분명히 하여 전체 비교구문을 살렸습니다.
theological_decisions:
- issue: ‘빛’과 ‘하나님 아래’의 병렬 비교
  chosen_reading: 진리는 빛의 영역에 속하며, 모든 것은 하나님의 통치/권위 아래에 있다는 평행구로 읽었습니다.
  alternative_readings:
  - 단순한 우주론적 위치 묘사
  - 도덕적 상징만을 말하는 표현
  rationale: 본문은 진리와 의의 불가분성을 논증하면서 두 개의 ‘under’ 구문을 병렬로 배치하므로, 공간적 표현을 유지하되 권위와 영역의 함의를 함께 드러내는 번역이 가장 충실합니다.
  doctrine_reference: 비교적 도식적인 지혜문/윤리 문맥의 평행법
- issue: ‘의로운 것’을 ‘옳은 것’으로 순화할지 여부
  chosen_reading: δικαιον의 윤리적·법정적 뉘앙스를 살려 ‘의로운 것’으로 번역했습니다.
  alternative_readings:
  - 옳은 것
  - 정의로운 것
  rationale: 본문의 대조는 진리/거짓과 의/불의의 도덕적 대비이므로, 한국어에서 신학적·윤리적 중립성을 유지하는 ‘의로운 것’이 가장 적절합니다.
  doctrine_reference: 의와 불의의 도덕적 대조
- issue: 이 문헌의 고유명사 ‘하나님’ 표기
  chosen_reading: Θεός를 표준 Protestant 용례대로 ‘하나님’으로 옮겼습니다.
  alternative_readings:
  - 신
  - 하느님
  rationale: 본 작업의 기본 용어표에 따라 Θεός는 ‘하나님’이 표준이며, 문헌의 인용 전통상 가장 안정적인 선택입니다.
  doctrine_reference: 프로젝트 용어표
