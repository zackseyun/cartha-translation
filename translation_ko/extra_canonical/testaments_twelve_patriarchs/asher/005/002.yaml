id: T12P.ASH.5.2
reference: Testament of Asher 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Τὴν⁷ ζωὴν ὁ θάνατος διαδέχεται, τὴν δόξαν ἡ ἀτιμία, τὴν ἡμέραν ἡ νύξ⁸, τὸ φῶς τὸ σκότος· τὰ δὲ πάντα⁹ ὑπὸ ἡμέραν εἰσίν¹⁰, ὑπὸ ζωὴν¹¹ τὰ δίκαια, ⌜ὑπὸ θανάτου τὰ ἄδικα⌝¹². διὸ καὶ¹³ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/002.yaml
  text: 'Death follows life, dishonor follows glory, night follows day, darkness follows light. But all things are under day: the righteous under life, and the unrighteous under death. Therefore eternal life also awaits death.'
translation:
  language: ko
  text: 죽음이 생명을 뒤따르고, 수치가 영광을 뒤따르며, 밤이 낮을 뒤따르고, 어둠이 빛을 뒤따릅니다. 그러나 모든 것은 낮 아래에 있습니다. 의로운 자들은 생명 아래에 있고, 불의한 자들은 죽음 아래에 있습니다. 그러므로 영원한 생명도 죽음을 기다립니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὴν ζωὴν ὁ θάνατος διαδέχεται
  english_pob_choice: Death follows life
  chosen_korean: 죽음이 생명을 뒤따릅니다
  alternatives_korean:
  - 죽음이 생명을 따릅니다
  - 죽음이 생명을 계승합니다
  lexicon: διαδέχομαι
  rationale: διαδέχεται는 단순한 시간적 연속보다 ‘뒤이어 오다/뒤따르다’의 의미가 분명하므로, 한국어에서도 관계를 분명히 드러내는 표현을 택했습니다.
- source_word: τὴν δόξαν ἡ ἀτιμία
  english_pob_choice: dishonor follows glory
  chosen_korean: 수치가 영광을 뒤따릅니다
  alternatives_korean:
  - 불명예가 영광을 뒤따릅니다
  - 치욕이 영광을 뒤따릅니다
  lexicon: ἀτιμία
  rationale: ἀτιμία는 ‘불명예’보다도 사회적·도덕적 ‘수치’의 대조를 강하게 드러내므로, 영광과의 대구를 살려 옮겼습니다.
- source_word: ὑπὸ ἡμέραν εἰσίν
  english_pob_choice: all things are under day
  chosen_korean: 모든 것은 낮 아래에 있습니다
  alternatives_korean:
  - 모든 것은 낮 아래 있습니다
  - 모든 것은 낮에 속해 있습니다
  lexicon: ὑπό + accusative
  rationale: ὑπό는 여기서 지배·범주 아래 있음을 나타내므로, ‘아래에 있다’로 직역적 구조를 유지했습니다.
- source_word: τὰ δίκαια / τὰ ἄδικα
  english_pob_choice: the righteous / the unrighteous
  chosen_korean: 의로운 자들 / 불의한 자들
  alternatives_korean:
  - 의인 / 악인
  - 의로운 이들 / 불의한 이들
  lexicon: substantival adjectives
  rationale: 형용사가 명사처럼 쓰였으므로 행위나 사물을 덧붙이지 않고 사람을 가리키는 복수 표현으로 자연스럽게 옮겼습니다.
- source_word: ἀναμένει
  english_pob_choice: awaits
  chosen_korean: 기다립니다
  alternatives_korean:
  - 기다리고 있습니다
  - 기다리게 됩니다
  lexicon: ἀναμένω
  rationale: ἀναμένει는 단순한 기대를 넘어 ‘기다리다/기다리고 있다’의 지속적 태도를 나타내므로, 주어를 분명하게 살려 옮겼습니다.
theological_decisions:
- issue: 마지막 문장의 역설적 진술
  chosen_reading: 영원한 생명도 죽음을 기다립니다
  alternative_readings:
  - 영원한 생명이 죽음을 기다립니다
  - 죽음조차 영원한 생명을 기다립니다
  rationale: 그리스어는 ‘영원한 생명’이 주어로 제시되면서도 ‘죽음’을 기다린다고 말하는 역설을 의도하므로, 이를 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: 지혜적·묵시적 역설 표현의 보존
- issue: ‘낮 아래/죽음 아래’의 위계적 구조
  chosen_reading: 낮 아래 / 생명 아래 / 죽음 아래
  alternative_readings:
  - 낮에 속해 있는 / 생명에 속해 있는 / 죽음에 속해 있는
  rationale: ὑπό의 공간적 이미지와 질서·통치의 뉘앙스를 함께 살리기 위해, 평이한 소속 표현보다 ‘아래’ 구조를 유지했습니다.
  doctrine_reference: 원문 수사와 위계적 대비의 보존
