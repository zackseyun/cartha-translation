  to: 그러므로 나는 내 삶에서 이 모든 것을 시험해 보았으며, 주님의 진리에서 벗어나지 않았고, 내 온 힘을 다해 살아가며 지극히 높으신 분의 계명들을 구하였습니다.
  rationale: 원문의 세 동사를 유지하고, 마지막 현재분사 πορευόμενος를 ‘살아가며’로 옮겨 단순한 보행보다 삶의 행로라는 비유적·지속적 측면을 자연스럽게 드러냈습니다. ‘내 온 힘을 다해’는 원문의 소유격 μου와 πᾶσαν ἰσχύν을 반영합니다. 원문에 없는 신학적 해석이나 인과관계는 추가하지 않았습니다.
