id: T12P.ASH.5.4
reference: Testament of Asher 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ταῦτα οὖν²⁰ πάντα ⌜ἐγὼ⌝²¹ ἐδοκίμασα ἐν τῇ ζωῇ μου, καὶ οὐκ ἐπλανήθην ἀπὸ τῆς ἀληθείας Κυρίου, καὶ²² τὰς ἐντολὰς τοῦ ὑψίστου²³ ἐξεζήτησα²⁴ κατὰ πᾶσαν ἰσχύν μου πορευόμενος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/004.yaml
  text: So then I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought the commandments of the Most High with all my strength as I walked.
translation:
  language: ko
  text: 그러므로 나는 내 삶에서 이 모든 것을 시험해 보았으며, 주님의 진리에서 벗어나지 않았고, 내 온 힘을 다해 살아가며 지극히 높으신 분의 계명들을 구하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοκίμασα
  english_pob_choice: I tested
  chosen_korean: 나는 … 시험하였고
  alternatives_korean:
  - 검토하였고
  - 살펴보았고
  lexicon: δοκιμάζω
  rationale: 단순히 ‘보다’보다 삶의 실제 가운데서 검증했다는 뜻을 살려 ‘시험하다’로 옮겼습니다.
- source_word: ἀπὸ τῆς ἀληθείας Κυρίου
  english_pob_choice: from the truth of the Lord
  chosen_korean: 주님의 진리에서
  alternatives_korean:
  - 주님의 진리로부터
  - 주님의 참된 말씀에서
  lexicon: ἀλήθεια + κύριος
  rationale: ἀλήθεια를 ‘진리’로 유지하고, ἀπό의 분리 의미를 자연스럽게 살려 ‘에서 벗어나지 않았다’로 연결했습니다.
- source_word: τὰς ἐντολὰς τοῦ ὑψίστου
  english_pob_choice: the commandments of the Most High
  chosen_korean: 가장 높으신 분의 명령들을
  alternatives_korean:
  - 지극히 높으신 분의 명령들을
  - 지극히 높으신 이의 계명들을
  lexicon: ἐντολή + ὕψιστος
  rationale: ἐντολή는 문맥상 ‘명령들’로 충분하며, ὕψιστος는 전통적 경어를 유지하되 직역성도 있는 ‘가장 높으신 분’으로 옮겼습니다.
- source_word: κατὰ πᾶσαν ἰσχύν μου πορευόμενος
  english_pob_choice: with all my strength as I walked
  chosen_korean: 온 힘을 다해 걸어가면서
  alternatives_korean:
  - 내 모든 힘을 다해 걸어가면서
  - 온 힘을 다해 다니면서
  lexicon: κατά + πᾶς + ἰσχύς + πορεύομαι
  rationale: ‘walked’의 단순 이동이 아니라 삶의 행로를 가리키므로 ‘걸어가면서’로 유지하고, δύναμις가 아닌 ἰσχύς의 ‘온 힘’을 살렸습니다.
theological_decisions:
- issue: 주님의 진리와 가장 높으신 분의 명령을 병렬로 진술하는 구조
  chosen_reading: ‘주님의 진리’와 ‘가장 높으신 분의 명령들’을 각각 별도 대상으로 유지했습니다.
  alternative_readings:
  - ‘주님의 진리’만 포괄적으로 풀어 하나의 신앙 원리로 흡수하는 해석
  - ‘명령들’을 ‘율례’나 ‘계명’으로 교회 용어화하는 해석
  rationale: 본문은 아버지/주님의 진리와 지극히 높으신 분의 명령을 함께 제시하므로, 두 표현을 분리해 윤리적·신앙적 이중 초점을 보존했습니다.
  doctrine_reference: 본문 주해 원리
