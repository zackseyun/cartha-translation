id: T12P.ASH.5.1
reference: Testament of Asher 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: V. Ὁρᾶτε¹, τέκνα², πῶς δύο³ εἰσὶν ⌜ἐν πᾶσιν⌝, ἓν⁴ κατέναντι τοῦ ἑνός, *καὶ ἓν ὑπὸ τοῦ ἑνὸς⁵ κέκρυπται· ⌜ἐν τῇ κτίσει ἡ πλεονεξία, ἐν τῇ εὐφροσύνῃ ἡ μέθη, ἐν τῷ γέλωτι τὸ πένθος, ἐν τῷ γάμῳ ἡ ἀσωτία⌝⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/001.yaml
  text: 'See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in creation, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery.'
translation:
  language: ko
  text: 보십시오, 자녀들아. 모든 것에는 둘이 있습니다. 하나는 다른 하나의 맞은편에 있고, 하나는 다른 하나 아래에 숨겨져 있습니다. 곧 창조에는 탐욕이 있고, 흥겨움에는 술취함이 있으며, 웃음에는 슬픔이 있고, 결혼에는 방탕이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 자녀들아
  lexicon: τέκνα
  rationale: 호칭으로 부르는 친밀한 권면이므로 ‘자녀들아’가 자연스럽고, 1인칭 소유를 살려 ‘내’로 옮겼습니다.
- source_word: ἐν πᾶσιν
  english_pob_choice: in all things
  chosen_korean: 만물에
  alternatives_korean:
  - 모든 것에
  - 모든 일에
  lexicon: πᾶσιν
  rationale: 문맥상 대조 구조가 우주적·포괄적 진술이므로 ‘만물에’가 간결하고 강하게 대응합니다.
- source_word: ἑνὸς ... ἓν ... ὑπὸ τοῦ ἑνός
  english_pob_choice: one opposite the other, and one is hidden under the other
  chosen_korean: 하나는 다른 하나와 마주하고 있으며, 하나는 다른 하나 아래에 숨겨져 있습니다
  alternatives_korean:
  - 하나는 다른 하나의 반대편에 있으며, 하나는 다른 하나 아래에 숨겨져 있습니다
  - 하나는 다른 것과 대조되고, 하나는 다른 것 밑에 숨겨져 있습니다
  lexicon: ἀντίθεσις / κέκρυπται
  rationale: 두 항목의 대칭적 대비와 은폐 관계를 그대로 드러내기 위해 ‘마주하고 있으며 / 아래에 숨겨져 있습니다’로 옮겼습니다.
- source_word: κτίσει, εὐφροσύνῃ, γέλωτι, γάμῳ
  english_pob_choice: creation, merriment, laughter, marriage
  chosen_korean: 창조에는, 흥겨움에는, 웃음에는, 결혼에는
  alternatives_korean:
  - 피조물에는, 즐거움에는, 웃음에는, 혼인에는
  - 창조 속에는, 흥겨움 속에는, 웃음 속에는, 결혼 속에는
  lexicon: κτίσις / εὐφροσύνη / γέλως / γάμος
  rationale: ἐν + 여격의 반복을 한국어로 평행하게 살리면서, κτίσις는 POB의 재검토에 따라 ‘창조’로 옮겼고 나머지도 대응되는 명사형으로 맞췄습니다.
- source_word: πλεονεξία, μέθη, πένθος, ἀσωτία
  english_pob_choice: greed, drunkenness, grief, debauchery
  chosen_korean: 탐욕, 술취함, 슬픔, 방탕
  alternatives_korean:
  - 탐심, 주정, 애통, 방탕
  - 더 탐하는 것, 취함, 슬픔, 방탕
  lexicon: πλεονεξία / μέθη / πένθος / ἀσωτία
  rationale: 도덕적 대조를 분명히 하되 과도한 해석을 피하기 위해, 관용적이면서도 직설적인 ‘탐욕, 술취함, 슬픔, 방탕’을 선택했습니다.
theological_decisions:
- issue: ‘creation’과 여타 대비 항목들의 윤리적 대조를 어떻게 드러낼 것인가
  chosen_reading: 우주적 질서 속의 상반된 양상을 나열하는 구문으로 읽고, 본문을 도덕적 대비 목록으로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 인간 삶의 여러 영역에 대한 일반 원리로 완화해 읽는 방식
  - ‘창조’를 ‘피조물’로 좁혀 윤리적 영역 하나로만 보는 방식
  rationale: 본문은 반복되는 ἐν + 여격 구조로 ‘각 영역 안에서의 반대쌍’을 제시하므로, 해석을 덧붙이기보다 본문의 대칭성과 열거성을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적 지혜/권면 본문
- issue: ‘방탕’의 등록과 강도
  chosen_reading: ἀσωτία를 일상적 ‘방탕’으로 옮겨 성적·물질적 과잉을 함께 함축하게 했습니다.
  alternative_readings:
  - ‘방종’으로 보다 넓게 처리하는 방식
  - ‘음란’으로 성적 의미를 전면화하는 방식
  rationale: 문맥의 마지막 대조쌍이 결혼이라는 제도 안의 일탈을 가리키므로, 의미 범위가 넓으면서도 과도하게 특정하지 않는 ‘방탕’이 가장 안전합니다.
  doctrine_reference: 윤리적 권면
