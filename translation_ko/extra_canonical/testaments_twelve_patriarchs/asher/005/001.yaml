    issue: τέκνα에 없는 소유격 ‘내’가 번역에 첨가됨
    rationale: 제시된 원문은 ‘자녀들아’라고만 하며, μου가 없습니다. 영어 감사 본문의 ‘my’보다 원문을 우선해야 하므로 삭제하는 것이 안전합니다.
  - severity: low
    issue: ἐν πᾶσιν을 ‘만물에’로 옮김
    rationale: ‘만물’은 흔히 피조 세계 또는 모든 피조물을 뜻할 수 있어, ‘all things’의 포괄적 표현보다 좁거나 신학적으로 색채가 강해질 수 있습니다. ‘모든 것에는’이 더 직접적입니다.
