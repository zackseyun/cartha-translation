  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἀλλ᾽ ἐπισυνάξει ὑμᾶς⁴⁵ ἐν πίστει διὰ τῆς⁴⁶ εὐσπλαγχνίας αὐτοῦ, καὶ⁴⁷ δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/007.yaml
  text: But the Lord will gather you in faith through his compassion, and through Abraham and Isaac and Jacob.
translation:
  language: ko
  text: 그러나 주님은 자신의 긍휼로, 또 아브라함과 이삭과 야곱을 통하여, 믿음 안에서 여러분을 모으실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισυνάξει
  english_pob_choice: will gather
  chosen_korean: 모으실 것입니다
  alternatives_korean:
  - 모아들이실 것입니다
  - جمع하실 것입니다
  lexicon: ἐπισυνάγω
  rationale: 미래 능동의 ‘모으다/모아들이다’ 중에서, 공동체를 한데 불러 모으는 의미를 자연스럽게 살려 ‘모으실 것입니다’로 옮겼습니다.
- source_word: ἐν πίστει
  english_pob_choice: in faith
  chosen_korean: 믿음 안에서
  alternatives_korean:
  - 믿음으로
  - 신실함 안에서
  lexicon: πίστις
  rationale: 전치사 ἐν의 구문을 한국어에서 가장 자연스럽게 살리면서도, 문맥상 요구되는 신앙적 태도를 분명히 하도록 ‘믿음 안에서’로 번역했습니다.
- source_word: διὰ τῆς εὐσπλαγχνίας αὐτοῦ
  english_pob_choice: through his compassion
  chosen_korean: 자신의 긍휼로
  alternatives_korean:
  - 그의 긍휼을 통하여
  - 그의 자비를 통해
  lexicon: εὐσπλαγχνία
  rationale: εὐσπλαγχνία는 단순한 친절보다 더 깊은 ‘긍휼/자비’의 정서를 가지므로, 한국어 성경어법에 맞는 ‘긍휼’로 옮기되 수단성은 조사 ‘-로’로 표현했습니다.
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  english_pob_choice: through Abraham and Isaac and Jacob
  chosen_korean: 아브라함과 이삭과 야곱을 통하여
  alternatives_korean:
  - 아브라함과 이삭과 야곱으로 말미암아
  - 아브라함과 이삭과 야곱을 통해
  lexicon: διά + 인명 배열
  rationale: 세 족장 이름 뒤의 διά를 인과/매개 의미로 살려, 전통적이고도 자연스러운 ‘을 통하여’로 옮겼습니다.
theological_decisions:
- issue: ‘주님’과 ‘하나님’의 호칭 선택
  chosen_reading: 본문의 ἐπισυνάξει는 주어가 생략되어 있으나, 영어 POB가 ‘the Lord’로 풀어 주는 점을 따라 ‘주님’으로 명시했습니다.
  alternative_readings:
  - ‘하나님은’
  - 주어를 생략한 번역
  rationale: 이 구절은 문맥상 구원 행위를 하시는 주체를 분명히 해야 하므로, 한국어 독자에게도 주체를 드러내는 방식이 가장 읽기 자연스럽습니다.
  doctrine_reference: 문맥상 주어 보충
