id: T12P.ASH.7.6
reference: Testament of Asher 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ διὰ τοῦτο³⁹ διασκορπισθήσεσθε⁴⁰ ὡς Γὰδ καὶ⁴¹ Δάν, οἱ ἀδελφοί μου⁴², *καὶ ἀγνοήσετε χώρας αὐτῶν⁴³ καὶ φυλὴν καὶ γλῶσσαν⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/006.yaml
  text: And because of this you will be scattered, like Gad and Dan, my brothers, and you will not know their land, tribe, and language.
translation:
  language: ko
  text: 그리고 이 때문에 너희는 갓과 단처럼 흩어질 것이며, 내 형제들아, 너희는 그들의 땅과 지파와 언어를 알지 못하게 될 것이다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασκορπισθήσεσθε
  english_pob_choice: you will be scattered
  chosen_korean: 흩어질 것이며
  alternatives_korean:
  - 분산될 것이며
  - 흩어지게 될 것이며
  lexicon: διασκορπίζω
  rationale: 수동 미래의 결과를 자연스럽게 살리면서, 공동체가 여기저기 갈라져 흩어지는 뜻을 직접적으로 전달합니다.
- source_word: ὡς Γὰδ καὶ Δάν
  english_pob_choice: like Gad and Dan
  chosen_korean: 갓과 단처럼
  alternatives_korean:
  - 갓과 단 같이
  - 갓과 단처럼
  lexicon: Γὰδ / Δάν
  rationale: 지파명은 통용되는 성경 인명 표기로 옮기고, 비교 표지는 한국어에서 가장 자연스러운 '-처럼'으로 처리했습니다.
- source_word: οἱ ἀδελφοί μου
  english_pob_choice: my brothers
  chosen_korean: 내 형제들아
  alternatives_korean:
  - 나의 형제들이여
  - 내 형제들이여
  lexicon: ἀδελφοί
  rationale: 호격의 직접 호소를 살리기 위해 '형제들아'로 옮겼고, 전반 문체에 맞게 다듬었습니다.
- source_word: χώρας αὐτῶν καὶ φυλὴν καὶ γλῶσσαν
  english_pob_choice: their land, tribe, and language
  chosen_korean: 그들의 땅과 지파와 언어
  alternatives_korean:
  - 그들의 땅과 부족과 언어
  - 그들의 영토와 지파와 말
  lexicon: χώρα / φυλή / γλῶσσα
  rationale: '''χώρα''는 단순한 땅/지역의 뜻이므로 ''땅''으로, ''φυλή''는 지파의 혈연·민족적 소속을 드러내는 ''지파''로, ''γλῶσσα''는 ''언어''로 옮겼습니다.'
theological_decisions:
- issue: 갓과 단을 예시로 든 흩어짐의 의미
  chosen_reading: 지파적 흩어짐과 정체성 상실을 함께 드러내는 예언으로 이해하고 옮겼습니다.
  alternative_readings:
  - 단순한 지리적 이주
  - 포로기적 산재만 강조
  rationale: 본문은 단지 이동이 아니라 '땅·지파·언어'를 알지 못하게 되는 상태를 말하므로, 공동체적 정체성의 붕괴까지 포함해 읽는 것이 원문에 더 가깝습니다.
  doctrine_reference: 서사적 예언 문맥, 민족/지파 정체성
