revisions:
- from: 그리고 이 때문에 너희는 갓과 단처럼 흩어질 것이며, 내 형제들아, 너희는 그들의 땅과 지파와 언어를 알지 못하게 될 것이다.
  to: 그러므로 너희는 나의 형제들인 갓과 단처럼 흩어지고, 그들의 땅과 지파와 언어를 알지 못하게 될 것입니다.
  rationale: 갓과 단에 대한 ‘나의 형제들’이라는 동격 관계를 보존하고, 결과를 나타내는 접속 표현과 합쇼체 종결을 현대 표준 한국어에 맞게 다듬었습니다. 원문의 다소 특이한 ‘그들의 땅과 지파와 언어’라는 표현은 해석적으로 평준화하지 않고 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:58Z'
