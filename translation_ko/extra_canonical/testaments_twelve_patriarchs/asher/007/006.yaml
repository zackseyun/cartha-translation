    rationale: οἱ ἀδελφοί μου는 ‘갓과 단’을 설명하는 동격(‘나의 형제들인’)이며, 청자 ‘너희’를 부르는 호격이 아닙니다. 현 번역은 원문의 수식 관계를 변경합니다.
  - severity: low
    issue: 합쇼체 종결이 일관되지 않음
    rationale: 지정된 현대 합쇼체에 맞추어 예언적 미래 진술을 ‘될 것입니다’로 종결하는 것이 적절합니다.
  revised_text: 그러므로 너희는 나의 형제들인 갓과 단처럼 흩어지고, 그들의 땅과 지파와 언어를 알지 못하게 될 것입니다.
