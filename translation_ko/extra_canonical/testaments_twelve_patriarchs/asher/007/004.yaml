  text: Εἴπατε οὖν, ⸀τέκνα μου καὶ ὑμεῖς⸀³⁰ ταῦτα τοῖς τέκνοις ὑμῶν³¹, μὴ ἀπειθήσωσιν³² αὐτῷ.
