  text: Therefore, my children, you also tell these things to your children, so that they may not disobey him.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 너희도 이 일들을 너희 자녀들에게 말하여, 그들이 그에게 불순종하지 않게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε οὖν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 따라서
  lexicon: Εἴπατε οὖν
  rationale: οὖν의 논리적 연결을 자연스럽게 살려 앞선 권면의 결론임을 드러내는 연결어로 옮겼습니다.
- source_word: τέκνα μου καὶ ὑμεῖς
  english_pob_choice: my children, you also
  chosen_korean: 내 자녀들아, 너희도
  alternatives_korean:
  - 내 자녀들아, 너희 역시
  - 내 자녀들, 너희도
  lexicon: τέκνα μου / ὑμεῖς
  rationale: τέκνα μου는 친밀한 호칭으로서 ‘내 자녀들아’가 적절하고, καὶ ὑμεῖς는 강조된 ‘너희도’로 살렸습니다.
- source_word: ταῦτα τοῖς τέκνοις ὑμῶν
  english_pob_choice: these things to your children
  chosen_korean: 이것들을 너희 자녀들에게
  alternatives_korean:
  - 이 일들을 너희 자녀들에게
  - 이것들을 너희 자녀들에게도
  lexicon: ταῦτα / τοῖς τέκνοις ὑμῶν
  rationale: 지시대명사 ταῦτα는 문맥상 앞선 교훈 전체를 가리키므로 ‘이것들’이 가장 직접적이며, τέκνοις는 자연스러운 ‘자녀들’로 옮겼습니다.
- source_word: μὴ ἀπειθήσωσιν αὐτῷ
  english_pob_choice: so that they may not disobey him
  chosen_korean: 그가 불순종하지 않게 하십시오
  alternatives_korean:
  - 그에게 불순종하지 않게 하십시오
  - 그를 거역하지 않게 하십시오
  lexicon: μὴ ἀπειθήσωσιν / αὐτῷ
  rationale: POB의 ‘him’을 따라 αὐτῷ를 그대로 반영하되, 한국어에서는 목적어가 생략되기 쉬워 문맥상 분명한 대상을 가리키는 비인칭식 표현으로 정리했습니다.
theological_decisions:
- issue: 문장 종결의 권고/의도 표현
  chosen_reading: ‘…하지 않게 하십시오’로 결과 목적을 드러내어 후대 교육의 목적이 불순종 방지임을 살렸습니다.
  alternative_readings:
  - ‘…하지 않도록 하십시오’
  - ‘…하지 말게 하십시오’
  rationale: μὴ ἀπειθήσωσιν의 목적/결과 뉘앙스를 한국어에서 가장 자연스럽게 나타내는 종결로, 강한 명령이 아니라 권면의 목적을 분명히 했습니다.
  doctrine_reference: 문맥상 도덕적 권면
- issue: 대상 대명사 αὐτῷ의 한국어 처리
  chosen_reading: 대상을 직접 명시하지 않고 ‘그가’로 옮겼습니다.
  alternative_readings:
  - ‘그에게’
  - ‘주님께’
  rationale: 본문 자체는 지시대상을 명명하지 않으므로, 원문이 가진 지시의 불확정성을 유지했습니다.
  doctrine_reference: 본문 충실성
