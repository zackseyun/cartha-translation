id: T12P.ASH.7.5
reference: Testament of Asher 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ ἔγνων³³ ὅτι ⸀ἀπειθοῦντες⸀³⁴ *ἀπειθήσετε, καὶ ἀσεβοῦντες ἀσεβήσετε³⁵, μὴ προσέχοντες³⁶ *τῷ νόμῳ³⁷ θεοῦ, ἀλλ᾽ ἐντολαῖς ἀνθρώπων *κακίᾳ διαφθειρόμενοι³⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/005.yaml
  text: For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men.
translation:
  language: ko
  text: 내가 알고 있기 때문입니다. 여러분은 불순종하면서 불순종하게 될 것이며, 불경건하게 행하면서 불경건하게 행하게 될 것이고, 하나님의 율법에 주의를 기울이지 않으며, 사람들의 계명을 통하여 악으로 부패하게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντες ... ἀπειθήσετε
  english_pob_choice: by disobeying, you will disobey
  chosen_korean: 불순종하여 결국 불순종하게 되고
  alternatives_korean:
  - 불복종하여 불복종하게 되고
  - 순종하지 않아서 순종하지 않게 되고
  lexicon: ἀπειθέω
  rationale: 반복 구조를 살려 현재의 불순종이 미래의 불순종으로 이어지는 점을 드러냈습니다. '불순종'은 교회적 관용과 현대어 이해를 함께 살릴 수 있습니다.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  english_pob_choice: by acting ungodly, you will act ungodly
  chosen_korean: 불경하게 행하여 결국 불경하게 행하며
  alternatives_korean:
  - 경건하지 않게 행하여 결국 경건하지 않게 행하며
  - 불경건하게 행하여 결국 불경건하게 행하며
  lexicon: ἀσεβέω
  rationale: 행위의 방향성을 살리기 위해 동사로 풀어 '행하다'를 붙였고, 반복을 통해 강한 강조를 유지했습니다.
- source_word: τῷ νόμῳ θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 규범
  lexicon: νόμος
  rationale: 여기서는 단순한 일반 '법'이 아니라 하나님의 계시적 요구를 가리키므로 POB 기본 용례에 따라 '율법'으로 옮겼습니다.
- source_word: ἐντολαῖς ἀνθρώπων
  english_pob_choice: the commandments of men
  chosen_korean: 사람들의 계명
  alternatives_korean:
  - 사람들의 명령
  - 인간의 계명
  lexicon: ἐντολή
  rationale: 문자적으로 '계명'이 가장 가깝고, '사람들의'를 유지해 하나님의 율법과 대조되는 출처를 분명히 했습니다.
- source_word: κακίᾳ διαφθειρόμενοι
  english_pob_choice: being corrupted by wickedness
  chosen_korean: 악으로 부패해 간다는 것입니다
  alternatives_korean:
  - 악으로 인해 타락해 간다는 것입니다
  - 악에 의해 썩어 간다는 것입니다
  lexicon: διαφθείρω
  rationale: 수동적 진행을 자연스럽게 살려 '부패해 간다'로 옮겼고, κακίᾳ는 수단/원인으로서 '악으로'를 택했습니다.
theological_decisions:
- issue: 반복 동사구의 강조를 어떻게 재현할지
  chosen_reading: '''불순종하여 결국 불순종하게 되고''와 ''불경하게 행하여 결국 불경하게 행하며''로 반복을 유지했습니다.'
  alternative_readings:
  - 의미만 풀어 한 번씩만 옮기기
  - 더 직설적인 중복 표현으로 옮기기
  rationale: 원문은 동일 어근의 반복을 통해 확실한 예언적 확증을 줍니다. 한국어에서도 중복을 보존해야 경고의 힘이 약해지지 않습니다.
  doctrine_reference: 수사적 반복의 보존 원칙
- issue: '''법''과 ''율법'' 중 어느 표현을 사용할지'
  chosen_reading: '''하나님의 율법''으로 옮겼습니다.'
  alternative_readings:
  - 하나님의 법
  - 하나님의 명령
  rationale: 본문의 νόμος는 하나님의 권위 있는 규범 전체를 가리키므로, 한국어 성경 전통과 현대 가독성을 함께 고려해 '율법'이 가장 적절합니다.
  doctrine_reference: 율법/계시적 권위 용례
