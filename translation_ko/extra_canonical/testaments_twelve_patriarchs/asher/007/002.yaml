review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 εἰς διασποράν은 단순히 ‘흩어진 자들’이라기보다 흩어져 사는 상태 또는 흩어진 백성이 되는 것을 뜻하므로 이를 더 직접적으로 드러내는 편이 좋습니다.
  naturalness: 초안은 이해하기 쉽지만, ‘나는 … 압니다’와 긴 병렬구조가 현대 합쇼체에서 다소 부자연스럽습니다. ‘알고 있습니다’와 일관된 미래 종결을 사용하면 더 자연스럽습니다.
  terminology: ‘원수들의 손에 넘겨지다’, ‘거룩한 것들’, ‘쓸모없는 물처럼 멸시받다’는 원문의 표현과 의미 범위를 적절히 보존합니다. ‘거룩한 것들’은 성물로 의미를 좁히지 않는 장점이 있습니다.
  issues:
  - severity: medium
    issue: ‘흩어진 자들이 될’은 εἰς διασποράν의 추상명사적 의미를 충분히 반영하지 못합니다.
    rationale: διασπορά는 흩어진 사람들만이 아니라 흩어짐/유배의 상태 및 흩어진 공동체를 가리킵니다. ‘흩어진 백성이 되어’는 이를 자연스럽게 보존합니다.
  - severity: low
    issue: 본문 끝의 [a][b] 표지에 대응하는 각주가 제공되지 않았습니다.
    rationale: 내용 없는 표지는 독자의 각주 참조를 막습니다. 제공된 원문과 감사 자료에는 이 표지에 연결할 번역 각주 내용이 없으므로 제거하는 것이 안전합니다.
  - severity: low
    issue: ‘나는 … 압니다’는 합쇼체 서술로 다소 어색합니다.
    rationale: 원문의 οἶδα는 확신하는 앎을 뜻하며, ‘나는 … 알고 있습니다’가 현대 표준 한국어의 공식적 문체에서 더 자연스럽습니다.
