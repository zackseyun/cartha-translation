id: T12P.ASH.7.2
reference: Testament of Asher 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ οἶδα⁵ ὅτι ἁμαρτήσετε⁶ καὶ παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν, ⌜καὶ¹⁸ ἡ γῆ ὑμῶν⁹ ἐρημωθήσεται¹⁰, καὶ τὰ ἅγια ὑμῶν καταφθαρήσονται¹¹, καὶ ὑμεῖς¹² διασκορπισθήσεσθε¹³ εἰς τὰς τέσσαρας¹⁴ γωνίας *τῆς γῆς¹⁵, καὶ ἔσεσθε *εἰς διασπορὰν¹⁶ ἐξουδενωμένοι ὡς¹⁷ ὕδωρ¹⁸ ἄχρηστον¹⁹.⌝'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/002.yaml
  text: For I know that you will sin and be handed over into the hands of your enemies, and your land will be made desolate, and your holy things destroyed, and you will be scattered to the four corners of the earth, and you will be in the dispersion, despised like useless water.
translation:
  language: ko
  text: 나는 너희가 죄를 짓고 너희 원수들의 손에 넘겨질 것이며, 너희 땅이 황폐해지고 너희의 거룩한 것들이 파괴될 것이며, 너희는 땅의 사방 모퉁이로 흩어지고, 쓸모없는 물처럼 멸시받는 흩어진 자들이 될 것을 압니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁμαρτήσετε
  english_pob_choice: you will sin
  chosen_korean: 죄를 짓고
  alternatives_korean:
  - 죄를 범하고
  - 범죄하고
  lexicon: ἁμαρτάνω
  rationale: 미래형 결과를 살리면서도 한국어에서 가장 자연스럽고 직접적인 죄 행위를 나타내기 위해 「죄를 짓고」로 옮겼습니다.
- source_word: παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν
  english_pob_choice: be handed over into the hands of your enemies
  chosen_korean: 너희 원수들의 손에 넘겨질 것이며
  alternatives_korean:
  - 너희 원수들의 손에 맡겨질 것이며
  - 너희 원수들의 손에 내어주어질 것이며
  lexicon: παραδίδωμι + εἰς χεῖρας
  rationale: 수동적 ‘넘겨지다’로 배반·포로화의 뉘앙스를 보존하고, ‘손에’는 지배와 처분권을 드러내는 성경적 관용을 살렸습니다.
- source_word: τὰ ἅγια ὑμῶν
  english_pob_choice: your holy things
  chosen_korean: 너희의 거룩한 것들
  alternatives_korean:
  - 너희의 성물들
  - 너희의 거룩한 물건들
  lexicon: ἅγια
  rationale: 문맥상 성전 기물에 국한되지 않고 ‘거룩한 것들’이라는 넓은 범위를 유지하는 것이 원문과 POB 영어를 더 잘 반영합니다.
- source_word: ἐξουδενωμένοι ὡς ὕδωρ ἄχρηστον
  english_pob_choice: despised like useless water
  chosen_korean: 쓸모없는 물처럼 멸시받는
  alternatives_korean:
  - 쓸데없는 물처럼
  - 무익한 물처럼 멸시받는
  lexicon: ἐξουθενέω + ἄχρηστος
  rationale: ‘멸시받는’은 ἐξουδενόω의 수치·경멸을 살리고, ‘쓸모없는 물’은 ἄχρηστον의 실용적 무가치를 직역성 있게 표현합니다.
theological_decisions:
- issue: 예언적 단정의 시제와 어조
  chosen_reading: 예언자가 확실히 아는 미래 경고로 처리하여 전부 미래형으로 번역했습니다.
  alternative_readings:
  - 직설적 현재형 경고
  - 완곡한 가능성 표현
  rationale: 원문과 POB 영어 모두 확정적 예언을 말하므로, 한국어에서도 단정적 미래형이 가장 충실합니다.
  doctrine_reference: 예언 문체의 확정성
- issue: ‘거룩한 것들’의 범위
  chosen_reading: 성전 예물이나 기구로 한정하지 않고 ‘거룩한 것들’로 넓게 유지했습니다.
  alternative_readings:
  - 성물
  - 성전의 거룩한 것들
  rationale: 원문 ἅγια는 문맥상 성전 관련일 수 있으나 범위를 좁히는 해석은 원문이 허용하는 것보다 나아가므로 피했습니다.
  doctrine_reference: 텍스트적 절제와 문맥 보존
