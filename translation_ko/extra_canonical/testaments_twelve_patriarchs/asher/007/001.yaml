id: T12P.ASH.7.1
reference: Testament of Asher 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VII. Μὴ γίνεσθε¹ ὡς Σόδομα², ἥτις ἠγνόησε³ *τοὺς ἀγγέλους⁴ Κυρίου, καὶ ἀπώλετο ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/001.yaml
  text: Do not be like Sodom, which did not recognize the angels of the Lord, and perished forever.
translation:
  language: ko
  text: 소돔처럼 되지 마십시오. 소돔은 주님의 천사들을 알아보지 못했고, 영원히 멸망했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνεσθε
  english_pob_choice: Do not be like
  chosen_korean: 되지 마십시오
  alternatives_korean:
  - 처럼 되지 마십시오
  - 되면 안 됩니다
  lexicon: γίνομαι
  rationale: 금지 명령을 현대 한국어의 공손한 직접 권고로 옮겼습니다. ‘되지 마십시오’가 본문의 금지성과 비유적 동일시를 자연스럽게 담습니다.
- source_word: ὡς Σόδομα
  english_pob_choice: like Sodom
  chosen_korean: 소돔처럼
  alternatives_korean:
  - 소돔과 같이
  - 소돔 같이
  lexicon: ὡς
  rationale: ὡς의 비교 용법을 직역에 가깝게 처리하되, 한국어에서 가장 자연스러운 비교 표현인 ‘처럼’을 사용했습니다.
- source_word: τοὺς ἀγγέλους Κυρίου
  english_pob_choice: the angels of the Lord
  chosen_korean: 주님의 천사들
  alternatives_korean:
  - 주님의 사자들
  - 야훼의 천사들
  lexicon: ἄγγελος / κύριος
  rationale: ἀγγέλους는 문맥상 천사로 옮기고, Κυρίου는 이 본문이 일반적 ‘주’보다 특정한 주권자를 가리키는 점을 살려 ‘주님’으로 옮겼습니다.
- source_word: ἀπώλετο ἕως αἰῶνος
  english_pob_choice: perished forever
  chosen_korean: 영원히 멸망했습니다
  alternatives_korean:
  - 영원히 망했습니다
  - 영원히 멸절했습니다
  lexicon: ἀπόλλυμι / εἰς αἰῶνα
  rationale: ἀπώλετο의 파멸·멸망 의미를 살리되, ‘perished forever’의 지속성을 한국어 부사 ‘영원히’로 분명히 했습니다.
theological_decisions:
- issue: 본문의 권면 형식과 공동체 경고의 어조
  chosen_reading: 명령형 금지문을 유지해 청중에게 직접적인 경고로 들리도록 했습니다.
  alternative_readings:
  - 서술형 권고로 완화
  - ‘하지 말라’로 더 직설화
  rationale: 이 문장은 단순한 설명이 아니라 소돔의 사례를 본받지 말라는 윤리적 경고이므로, 현대 공손체 안에서도 금지 명령의 긴장을 유지했습니다.
  doctrine_reference: 윤리적 권면의 직접성 보존
- issue: Κυρίου의 한국어 처리
  chosen_reading: ‘주님의’로 옮겨 주권적 관계를 드러냈습니다.
  alternative_readings:
  - ‘주’의
  - ‘야훼의’
  rationale: 이 구절은 LXX 인용처럼 야훼 명시를 요구하는 문맥이 아니므로, 과도한 고유명화보다 본문이 말하는 권위의 관계를 자연스럽게 살리는 번역을 택했습니다.
  doctrine_reference: 호칭어 번역의 문맥 민감성
