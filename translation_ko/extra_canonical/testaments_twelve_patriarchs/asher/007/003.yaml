id: T12P.ASH.7.3
reference: Testament of Asher 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἕως οὗ²⁰ ὁ ὕψιστος ἐπισκέψηται τὴν γῆν, καὶ αὐτὸς ἐλθὼν ⌜ὡς ἄνθρωπος²¹ μετὰ ἀνθρώπων *ἐσθίων καὶ πίνων²²⌝ καὶ²³ συντρίβων²⁴ τὴν κάραν²⁵ τοῦ δράκοντος *ἐπὶ τοῦ²⁶ ὕδατος, *οὗτος σώσει²⁷ τὸν Ἰσραὴλ καὶ πάντα τὰ ἔθνη [θεὸς²⁸ εἰς ἄνδρα ὑποκρινόμενος²⁹].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/003.yaml
  text: Until the Most High visits the earth, himself coming as a man, eating and drinking with men, and crushing the head of the dragon upon the water; this one will save Israel and all the nations [God appearing as a man].
translation:
  language: ko
  text: 지극히 높으신 분께서 땅을 찾아오실 때까지, 친히 한 사람으로 오셔서 사람들과 함께 먹고 마시며 물 위에서 용의 머리를 부수실 그분께서 이스라엘과 모든 민족을 구원하실 것입니다[하나님께서 사람으로 가장하심].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: ὕψιστος
  rationale: 지극한 높임의 칭호를 살리되 문맥상 인격적 주어를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ἐπισκέψηται τὴν γῆν
  english_pob_choice: visits the earth
  chosen_korean: 땅을 찾아오실 때까지
  alternatives_korean:
  - 땅을 방문하실 때까지
  - 땅을 돌보실 때까지
  lexicon: ἐπισκέπτομαι
  rationale: 단순 방문보다 구원적·심판적 '찾아오심'의 뉘앙스를 살리되, 한국어에서 과도하게 해석을 덧붙이지 않도록 했습니다.
- source_word: ὡς ἄνθρωπος μετὰ ἀνθρώπων ἐσθίων καὶ πίνων
  english_pob_choice: as a man, eating and drinking with men
  chosen_korean: 사람처럼 오셔서 사람들 가운데서 먹고 마시시며
  alternatives_korean:
  - 한 사람으로서 사람들과 함께 먹고 마시며
  - 사람의 모습으로 사람들과 먹고 마시며
  lexicon: ὡς ἄνθρωπος / μετὰ ἀνθρώπων / ἐσθίων καὶ πίνων
  rationale: 인간성의 실제성과 공동체적 동행을 함께 드러내기 위해 '사람처럼'과 '사람들 가운데서'를 병용했습니다.
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος ἐπὶ τοῦ ὕδατος
  english_pob_choice: crushing the head of the dragon over the water
  chosen_korean: 물 위에서 용의 머리를 부수실 것입니다
  alternatives_korean:
  - 물 위에 있는 용의 머리를 짓밟으실 것입니다
  - 물 위에서 용의 머리를 산산이 부수실 것입니다
  lexicon: συντρίβω / κάρα / δράκων / ἐπὶ τοῦ ὕδατος
  rationale: 동사의 폭력성과 이미지의 직설성을 유지하면서도 한국어에서 가장 자연스러운 성경 문체로 정리했습니다.
- source_word: θεὸς εἰς ἄνδρα ὑποκρινόμενος
  english_pob_choice: God disguised as a man
  chosen_korean: '[하나님이 사람으로 가장하심]'
  alternatives_korean:
  - '[하나님이 사람으로 가장하신 채]'
  - '[하나님이 사람인 듯 행하심]'
  lexicon: ὑποκρίνομαι
  rationale: 개정된 영어 POB의 'disguised as a man'을 반영하여, '가장하심'으로 외형적 위장/가면의 의미를 간결히 옮겼습니다.
theological_decisions:
- issue: 하나님의 방문과 성육신적 표현의 처리
  chosen_reading: 본문의 '가장 높으신 이'가 '사람처럼 오셔서'라는 진술을 유지하고, 각주에서 '하나님이 사람으로 가장하심'을 덧붙였습니다.
  alternative_readings:
  - '''성육신하신 하나님''으로 명시하기'
  - '''인자처럼 오심''으로 완화하기'
  rationale: 원문과 영어 POB가 모두 인간 형상으로의 임시적 위장을 강조하므로, 성육신 교리를 과잉 확정하지 않으면서도 문맥의 신학적 긴장을 보존했습니다.
  doctrine_reference: 그리스도론 / 묵시적 메시아 기대
