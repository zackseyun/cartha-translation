  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002.yaml
  text: '1 There is, then, a soul that in its words turns away the good for the sake of evil, and leads the outcome of the matter into wickedness.


    2 There is a man who does not pity his own servants; and though this is double-faced, the whole of it is evil.


    3 And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man''s account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.


    4 Even if they are in love, they are in wickedness when they hide evil under a good name; but the end of the deed comes to evil.


    5 Another steals, acts unjustly, plunders, is greedy, and yet shows mercy to the poor. This too is double-faced, but the whole of it is evil.


    6 The one who defrauds his neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, the giver of the law, yet gives rest to the poor.


    7 He stains the soul and makes the body bright; he kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.


    8 Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the force of his wealth he drags many down, and out of his excessive wickedness performs the commandments. This is double-faced, but the whole of it is evil.


    9 Such people are like hares, because they are half clean, but in truth they are unclean.


    10 For God also, in the tablets of the commandments, has declared it so.'
translation:
  language: ko
  text: '그러므로 말로는 선을 악으로 돌려세우고, 일의 결말을 악으로 이끄는 영혼이 있습니다.


    자기 종들을 불쌍히 여기지 않는 사람도 있습니다. 이것도 겉과 속이 다른 것이지만, 전체는 악합니다.


    악을 행하는 자를 사랑하는 사람도 있습니다. 그는 그 사람 때문에 자신도 악 속에서 죽기를 택하기 때문입니다. 이것이 겉과 속이 다름은 분명하지만, 전체는 악한 행위입니다.


    사랑하는 것 같아도, 선한 이름 아래 악을 숨길 때에는 악 가운데 있는 것입니다. 그러나 그 행위의 끝은 악에 이릅니다.


    또 어떤 사람은 훔치고, 부당하게 행하고, 약탈하고, 탐욕을 부리면서도 가난한 사람들에게는 자비를 베풉니다. 이것도 겉과 속이 다른 것이지만, 전체는 악합니다.


    이웃을 속이는 사람은 하나님을 격노하게 하고, 지극히 높으신 이로 가리켜 거짓 맹세를 하며, 율법의 주님을 외면하면서도 가난한 사람은 쉬게 합니다.


    그는 영혼은 더럽히고 몸은 밝게 꾸미며, 많은 사람을 죽이고 적은 사람에게는 자비를 베풉니다. 이것도 겉과 속이 다른 것이지만, 전체는 악합니다.


    또 어떤 사람은 간음하고 음행하며, 음식을 끊습니다. 그리고 금식하면서도 악을 행하고, 재물의 힘으로 많은 사람을 끌어내리며, 지나친 악함으로 계명들을 행합니다. 이것은 겉과 속이 다른 것이지만, 전체는 악합니다.


    그러한 사람들은 토끼와 같습니다. 반은 깨끗하지만, 실제로는 더럽기 때문입니다.


    하나님께서도 계명들의 돌판에서 이같이 말씀하셨기 때문입니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διπρόσωπον / διπρόσωπος
  english_pob_choice: double-faced
  chosen_korean: 겉과 속이 다른
  alternatives_korean:
  - 양면적인
  - 이중적인
  - 두 얼굴의
  lexicon: N/A
  rationale: POB의 도덕적 평가어인 double-faced를 직역적이면서도 한국어에서 자연스러운 관용으로 옮겼습니다. 단순한 심리 묘사보다 위선/불일치의 뜻을 살리기 위해 ‘겉과 속이 다른’을 택했습니다.
- source_word: λειτουργούς αὐτοῦ
  english_pob_choice: his own servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 그의 종들
  - 자기 하인들
  - 자기 일꾼들
  lexicon: N/A
  rationale: 원문은 주인의 소유 아래 있는 하인을 가리키므로 ‘종’이 가장 직접적입니다. POB의 servants를 너무 완곡하게 만들지 않기 위해 ‘자기 종들’로 옮겼습니다.
- source_word: ὁ πλεονεκτῶν τὸν πλησίον
  english_pob_choice: The one who defrauds his neighbor
  chosen_korean: 이웃을 속이는 사람
  alternatives_korean:
  - 이웃을 착취하는 사람
  - 이웃에게서 빼앗는 사람
  - 이웃을 속여 이익을 취하는 사람
  lexicon: N/A
  rationale: πλεονεκτεῖν은 단순한 ‘탐욕’보다 남을 이용해 이익을 취하는 뜻이 있어, POB의 defrauds를 따라 ‘속이는’으로 핵심을 드러냈습니다.
- source_word: τὸν ἐντολέα τοῦ νόμου Κύριον
  english_pob_choice: the Lord, the giver of the law
  chosen_korean: 율법의 주님
  alternatives_korean:
  - 율법을 주신 주님
  - 율법의 제정자이신 주님
  - 율법을 베푸신 주님
  lexicon: N/A
  rationale: 주어인 Κύριος를 ‘주님’으로 유지하되, τοῦ νόμου의 관계를 한국어에서 압축적으로 드러내기 위해 ‘율법의 주님’으로 옮겼습니다. POB의 ‘giver of the law’보다 더 직접적인 원문 관계를 반영합니다.
- source_word: πλαξὶ τῶν ἐντολῶν
  english_pob_choice: the tablets of the commandments
  chosen_korean: 계명들의 돌판
  alternatives_korean:
  - 계명들의 판
  - 계명판
  - 계명석판
  lexicon: N/A
  rationale: πλαξί는 문자적으로 ‘판/돌판’이고, 문맥상 십계명 전승의 돌판을 가리키므로 ‘돌판’으로 구체화했습니다. ‘계명들의’는 원문의 복수를 보존하기 위한 표현입니다.
theological_decisions:
- issue: 겉과 속이 다른 행위의 총평가를 어떻게 드러낼지
  chosen_reading: 각 항목의 부분적 선행을 인정하더라도, 결론부의 전체 평가는 일관되게 ‘악/악한 행위’로 옮겼습니다.
  alternative_readings:
  - ‘모순적이다’로 완화
  - ‘이중적이다’로 중립화
  rationale: 원문은 부분적 선행이 전체의 도덕적 악을 가리지 못한다는 점을 반복적으로 강조합니다. 그래서 서술적 중립보다 강한 평가어를 유지했습니다.
  doctrine_reference: 도덕 평가와 위선 비판의 문맥
