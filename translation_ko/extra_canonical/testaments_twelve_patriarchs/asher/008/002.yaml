  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ⁸ ἐποίησαν οἱ υἱοὶ αὐτοῦ ὅσα⁹ ἐνετείλατο αὐτοῖς, καὶ¹⁰ *ἀπήγαγον αὐτὸν ἐν Χεβρὼν καὶ ἔθαψαν αὐτὸν¹¹ μετὰ τῶν πατέρων αὐτοῦ¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/002.yaml
  text: And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: ko
  text: 그의 아들들은 그가 그들에게 명령한 대로 하였고, 그를 헤브론으로 옮겨 가서 그의 조상들과 함께 장사하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν ... ὅσα ἐνετείλατο αὐτοῖς
  english_pob_choice: did as he had commanded them
  chosen_korean: 그가 그들에게 명령한 대로 하였고
  alternatives_korean:
  - 그가 그들에게 지시한 대로 행하였고
  - 그가 그들에게 명한 바를 그대로 따랐고
  lexicon: ἐπιτελέω/ποιέω; ἐντέλλομαι
  rationale: 행동의 결과보다 순종의 기준이 되는 명령 내용을 살려, 자연스러운 합쇼체로 옮겼습니다.
- source_word: ἀπήγαγον αὐτὸν ἐν Χεβρὼν
  english_pob_choice: they carried him away to Hebron
  chosen_korean: 그를 헤브론으로 옮겨 가서
  alternatives_korean:
  - 그를 헤브론으로 데려가서
  - 그를 헤브론으로 운구하여
  lexicon: ἀπάγω
  rationale: 시신을 목적지로 이동시키는 뜻을 담되, 현대 한국어에서 자연스럽고 장례 맥락에 맞는 표현을 선택했습니다.
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: buried him with his fathers
  chosen_korean: 그의 조상들과 함께 장사하였습니다
  alternatives_korean:
  - 그의 조상들과 함께 묻었습니다
  - 그의 조상들 곁에 안장하였습니다
  lexicon: θάπτω; πατέρες
  rationale: 직역의 '묻다'보다 장례 맥락을 살린 '장사하다'가 본문의 공손하고 간결한 서술을 더 잘 전달합니다.
theological_decisions:
- issue: with his fathers의 친족/조상 표현
  chosen_reading: 그의 조상들과 함께
  alternative_readings:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  rationale: 그리스어 πατέρες는 여기서 단일한 생부들보다 조상 집단을 가리키는 관용적 표현으로 보이므로, 의미를 분명히 하는 '조상들'을 택했습니다.
  doctrine_reference: 가족-조상 장례 관용어
