id: T12P.ASH.8.1
reference: Testament of Asher 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VIII. Καὶ¹ εἰπὼν αὐτοῖς ταῦτα ἐνετείλατο λέγων²· Θάψατέ με ἐν³ Χεβρών⁴. Καὶ ἀπέθανεν⁵ †ὕπνῳ⁶ καλῷ κοιμηθείς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/001.yaml
  text: And after saying these things to them, he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep.
translation:
  language: ko
  text: 그가 그들에게 이 말을 한 뒤, 명령하여 말했습니다. “나를 헤브론에 장사하십시오.” 그리고 그는 좋은 잠에 든 채 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνετείλατο λέγων
  english_pob_choice: he commanded them, saying
  chosen_korean: 그들에게 명령하며 말하였는데
  alternatives_korean:
  - 그들에게 명령하여 말하였는데
  - 명하여 말하였는데
  lexicon: ἐντέλλομαι
  rationale: 명령의 행위와 그 뒤따르는 직접 발화를 자연스럽게 살리되, 한국어에서 중복이 어색하지 않도록 ‘명령하며 말하다’로 옮겼습니다.
- source_word: Θάψατέ με
  english_pob_choice: Bury me
  chosen_korean: 나를 … 장사하라
  alternatives_korean:
  - 나를 … 묻어라
  - 나를 … 매장하라
  lexicon: θάπτω
  rationale: 매장 행위의 직접성을 살리면서도 한국어 성서 문맥에서 자연스러운 ‘장사하다’를 택했습니다.
- source_word: ἐν Χεβρών
  english_pob_choice: in Hebron
  chosen_korean: 헤브론에
  alternatives_korean:
  - 헤브론에서
  - 헤브론 안에
  lexicon: Χεβρών
  rationale: 장지의 위치를 나타내는 전치사 표현으로 ‘-에’를 사용해 단순하고 정확하게 옮겼습니다.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  english_pob_choice: having fallen asleep in a good sleep
  chosen_korean: 선한 잠을 자듯이 잠든 채
  alternatives_korean:
  - 좋은 잠을 자고
  - 평안히 잠든 채
  lexicon: καλός + κοιμάω
  rationale: 직역된 ‘good sleep’의 이상한 직설을 완화하지 않으면서도, 죽음을 완곡하게 가리키는 ‘잠들다’의 의미를 살렸습니다.
theological_decisions:
- issue: 죽음을 ‘잠듦’으로 표현하는 완곡법
  chosen_reading: ‘잠든 채 죽었습니다’로 옮겨, 죽음을 단순한 소멸이 아니라 잠듦의 이미지로 표현했습니다.
  alternative_readings:
  - 그는 죽었습니다
  - 그는 편안히 죽었습니다
  rationale: 원문의 κοιμηθείς는 단순 사망 진술을 넘어 잠의 이미지를 분명히 지니므로, 이를 보존해 내러티브의 완곡성과 문학성을 살렸습니다.
  doctrine_reference: '성경의 죽음-잠듦 은유(예: 단 12:2; 요 11:11)'
