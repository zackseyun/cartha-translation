- from: 그리고 그가 이 말을 그들에게 한 뒤에 그들에게 명령하며 말하였는데, 「나를 헤브론에 장사하라」고 하였습니다. 그리고 그는 선한 잠을 자듯이 잠든 채 죽었습니다.
  to: 그가 그들에게 이 말을 한 뒤, 명령하여 말했습니다. “나를 헤브론에 장사하십시오.” 그리고 그는 좋은 잠에 든 채 죽었습니다.
