review_pass:
  verdict: revise
  source_fidelity: 제1절의 ἐν τῇ κτίσει는 제공된 그리스어 본문대로라면 ‘창조 안에/창조에는’으로 옮겨야 합니다. 초안의 ‘재물에는’은 영어 POB의 해석을 따르지만 현전 원문과 일치하지 않습니다. 또한 ἐδοκίμασα, ἐξεζήτησα, ὑπό의 반복 및 역설적인 ‘영원한 생명도 죽음을 기다립니다’는 대체로 잘 보존되었습니다.
  naturalness: 초안은 전반적으로 이해 가능하나, ‘내 모든 힘에 따라 걸었습니다’는 현대 한국어로 부자연스럽습니다. ‘내 온 힘을 다해 걸었습니다’가 합쇼체의 격식을 유지하면서도 자연스럽습니다. 제3절의 인과·비교 관계도 문장으로 더 분명히 연결했습니다.
  terminology: πλεονεξία는 ‘탐심’, ἀσωτία는 ‘방종’, τὰ δίκαια/τὰ ἄδικα는 ‘의로운 것들/불의한 것들’, ὕψιστος는 ‘지극히 높으신 분’으로 유지할 수 있습니다. θεός는 ‘하나님’으로 일관되게 옮겼습니다.
  issues:
  - severity: high
    issue: 제1절의 ‘재물에는 탐심이’
    rationale: 제공된 그리스어는 ἐν τῇ κτίσει(‘창조 안에/창조에는’)이며, ‘재물’에 해당하는 말이 아닙니다. 영어 감사본의 ‘wealth’를 원문보다 우선할 수 없으므로 본문을 ‘창조에는’으로 고쳐야 합니다.
  - severity: medium
    issue: 각주 표지가 모두 제4절 끝에 몰려 있음
    rationale: '[a]는 탐심(πλεονεξία), [b]는 ‘영원한 생명도 죽음을 기다립니다’라는 난해한 진술, [c]는 반복되는 ὑπό(‘아래’) 표현에 각각 붙어야 합니다. 현재 위치는 각주의 대상과 맞지 않습니다.'
  - severity: low
    issue: ‘내 모든 힘에 따라 걸었습니다’
    rationale: κατὰ πᾶσαν ἰσχύν μου를 지나치게 직역하여 한국어가 부자연스럽습니다. 의미를 보존하는 ‘내 온 힘을 다해 걸었습니다’가 적절합니다.
  revised_text: 1. 보십시오, 내 자녀들아. 모든 것에는 두 가지가 있으니, 하나는 다른 하나의 맞은편에 있고, 또 하나는 다른 하나 아래에 숨겨져 있습니다[c]. 곧 창조에는 탐심[a]이, 즐거움에는 술취함이, 웃음에는 슬픔이, 결혼에는 방종이 있습니다. 2. 생명 다음에는 죽음이, 영광 다음에는 수치가, 낮 다음에는 밤이, 빛 다음에는 어둠이 따릅니다. 그러나 모든 것은 낮 아래에 있습니다. 의로운 것들은 생명 아래에 있고, 불의한 것들은 죽음 아래에 있습니다. 그러므로 영원한 생명도 죽음을 기다립니다[b]. 3. 진리를 거짓이라고 말할 수 없고, 의로운 것을 불의하다고 말할 수도 없습니다. 모든 진리가 빛 아래에 있고, 모든 것이 하나님 아래에 있는 것과 같기 때문입니다. 4. 그러므로 나는 내 삶에서 이 모든 것을 시험해 보았고, 주님의 진리에서 벗어나지 않았으며, 지극히 높으신 분의 명령들을 찾아 나섰고, 내 온 힘을 다해 걸었습니다.
  revised_footnotes:
  - marker: a
    text: ‘탐심’(πλεονεξία)은 ‘탐욕’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영원한 생명도 죽음을 기다립니다’라는 구절은 본문상·개념상 난해합니다. 번역은 그리스어의 표현을 풀이하여 해소하지 않고 보존합니다.
    reason: textual_variant
  - marker: c
    text: 이 장에서 반복되는 ‘아래에’(ὑπό)라는 표현은 도덕적 또는 우주적 영역을 나타낼 수 있습니다. 번역은 그 관계를 단정하지 않고 원문의 반복을 유지합니다.
    reason: cultural_note
  revision_rationale: 원문 우선 원칙에 따라 κτίσει를 ‘창조’로 바로잡고, 난해한 ὑπό 표현과 영원한 생명·죽음의 역설은 해석적으로 완화하지 않았습니다. 각주 표지를 실제 설명 대상에 재배치했으며, 제4절의 직역투를 현대 표준 한국어 합쇼체로 다듬었습니다.
