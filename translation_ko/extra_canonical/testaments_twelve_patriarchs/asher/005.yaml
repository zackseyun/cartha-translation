base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005.yaml
  text: '1[a]. See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in wealth, greed; in merriment, drunkenness; in laughter, grief[b]; in marriage, debauchery. 2. Death follows life, dishonor glory, night day, darkness light; but all things are under the day: righteous things under life, and unrighteous things under death. Therefore eternal life also awaits death. 3. And one cannot say that truth is falsehood, nor that what is righteous is unrighteous, because all truth is under the light, just as all things are under God. 4. Therefore I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought out the commandments of the Most High[c], walking according to all my strength.'
  footnotes:
  - marker: a
    text: Or 'covetousness' for greed (πλεονεξία).
    reason: lexical_alternative
  - marker: b
    text: The line 'eternal life also awaits death' is textually and conceptually difficult; the translation preserves the Greek wording rather than paraphrasing the sense.
    reason: textual_variant
  - marker: c
    text: 'Repeated ''under'' language in this chapter likely marks moral or cosmic domain: ''under the day ... under life ... under death ... under the light ... under God.'''
    reason: cultural_note
translation:
  language: ko
  text: 1. 보십시오, 내 자녀들아, 모든 것에는 둘이 있어서 하나가 다른 하나를 맞서며, 하나는 다른 하나 아래에 숨겨져 있습니다. 곧 재물에는 탐심이, 즐거움에는 술취함이, 웃음에는 슬픔이, 결혼에는 방종이 있습니다. 2. 생명 다음에는 죽음이, 영광 다음에는 수치가, 낮 다음에는 밤이, 빛 다음에는 어둠이 따릅니다. 그러나 모든 것은 낮 아래에 있습니다. 곧 의로운 것들은 생명 아래에 있고, 불의한 것들은 죽음 아래에 있습니다. 그러므로 영원한 생명도 죽음을 기다립니다. 3. 진리를 거짓이라고 말할 수 없고, 의로운 것을 불의하다고 말할 수도 없습니다. 모든 진리는 빛 아래에 있기 때문이며, 모든 것이 하나님 아래에 있는 것과 같습니다. 4. 그러므로 나는 내 삶에서 이 모든 것을 시험해 보았고, 주님의 진리에서 벗어나지 않았으며, 지극히 높으신 분의 명령들을 찾아 나서면서 내 모든 힘에 따라 걸었습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 잘 보십시오
  - 주목하십시오
  lexicon: LSJ
  rationale: 직접 호소하는 권면형 명령을 현대 합쇼체로 자연스럽게 옮기되, 지나치게 구어적이거나 교회어적인 표현은 피했습니다.
- source_word: τέκνα
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 자녀들아
  - 내 아들들아
  lexicon: LSJ
  rationale: 아버지-자녀의 친밀한 훈계 어조를 살리면서, 남성 중심으로 좁아질 수 있는 '아들들'은 피했습니다.
- source_word: πλεονεξία
  english_pob_choice: greed
  chosen_korean: 탐심
  alternatives_korean:
  - 탐욕
  - 욕심
  - 인색함
  lexicon: BDAG
  rationale: 단순한 물질적 탐욕보다 더 넓은 도덕적 결핍을 가리키는 말로, 한국어 성경 어휘에서 가장 대응력이 높은 '탐심'을 택했습니다.
- source_word: ἀσωτία
  english_pob_choice: debauchery
  chosen_korean: 방종
  alternatives_korean:
  - 방탕
  - 문란
  - 탕락
  lexicon: BDAG
  rationale: 결혼과 연결된 문맥에서 성적 문란까지 포함하는 과도함을 나타내되, 지나치게 선정적이지 않게 '방종'으로 옮겼습니다.
- source_word: τὰ δίκαια / τὰ ἄδικα
  english_pob_choice: righteous things / unrighteous things
  chosen_korean: 의로운 것들 / 불의한 것들
  alternatives_korean:
  - 의로운 일들 / 불의한 일들
  - 의인들 / 불의한 자들
  lexicon: BDAG
  rationale: 중성 복수의 범주성을 살려 사람보다 행위·범주 전체를 가리키는 표현으로 유지했습니다.
- source_word: ἐδοκίμασα
  english_pob_choice: I tested
  chosen_korean: 시험해 보았고
  alternatives_korean:
  - 검토해 보았고
  - 살펴보았고
  - 입증해 보았고
  lexicon: BDAG
  rationale: 삶 속에서 직접 검증했다는 의미를 자연스럽게 드러내며, 이어지는 자기증언의 어조와도 잘 맞습니다.
- source_word: ἐξεζήτησα
  english_pob_choice: sought out
  chosen_korean: 찾아 나섰으며
  alternatives_korean:
  - 간절히 찾았으며
  - 부지런히 구했으며
  - 찾아 구했으며
  lexicon: LSJ
  rationale: 복합동사의 적극성과 반복적 추구의 뉘앙스를 살리되, 한국어 문장 흐름은 부드럽게 유지했습니다.
theological_decisions:
- issue: ἡ αἰώνιος ζωὴ ἀναμένει τὸν θάνατον의 역설적 진술
  chosen_reading: 영원한 생명도 죽음을 기다립니다.
  alternative_readings:
  - 죽음도 영원한 생명을 기다립니다.
  - 죽음 뒤에 영원한 생명이 있습니다.
  rationale: 그리스어의 역설을 해소하지 않고 그대로 유지해야 하므로, 문장 어순과 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: 반복되는 ὑπό 표현
  chosen_reading: 모든 것을 '아래에/아래에 있습니다'로 반복해 도식적 구조를 유지했습니다.
  alternative_readings:
  - '...에 속합니다'
  - '...의 영역에 있습니다'
  - '...에 속한 것입니다'
  rationale: 이 장의 수사적 핵심은 '아래에'라는 반복 구조이므로, 이를 풀어 쓰기보다 도식성을 드러내는 편이 원문에 더 충실합니다.
  doctrine_reference: DOCTRINE.md §Original-language primacy over translation tradition
