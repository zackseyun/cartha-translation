base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007.yaml
  text: '...crushing the head of the dragon upon the water[a]. He will save Israel and all the nations [God appearing as a man].


    4 Therefore, my children, you also tell these things to your children, so that they may not disobey him. 5 For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men. 6 And because of this you will be scattered, like Gad and Dan my brothers, and you will not know their land, tribe, and language. 7 But the Lord will gather you in faith through his compassion[c][b], and through Abraham and Isaac and Jacob.'
  footnotes:
  - marker: a
    text: The bracketed words 'God appearing as a man' likely reflect a textually uncertain or expanded reading in the Greek tradition; they are translated here because they appear in the witness provided.
    reason: textual_variant
  - marker: b
    text: '''In faith'' could also be understood as ''in faithfulness.'''
    reason: lexical_alternative
  - marker: c
    text: The scattering and later gathering echo covenant judgment-and-restoration themes found throughout Israel's Scriptures.
    reason: cross_reference
translation:
  language: ko
  text: '1 소돔처럼 되지 마십시오. 소돔은 주의 천사들을 알아보지 못하였고 영원히 멸망하였습니다.


    2 나는 여러분이 죄를 짓고 여러분의 원수들의 손에 넘겨질 것을 압니다. 여러분의 땅은 황폐해지고 여러분의 성소들은 파괴될 것이며, 여러분은 땅의 네 모퉁이로 흩어질 것입니다. 그리고 쓸모없는 물처럼 멸시받는 흩어진 이들이 될 것입니다.


    3 지극히 높으신 분께서 땅을 찾아오실 때까지 그러할 것입니다. 그분께서 친히 사람으로 오셔서 사람들과 함께 먹고 마시며, 물 위에 있는 용의 머리를 짓부수실 것입니다. 그분께서 이스라엘과 모든 민족을 구원하실 것입니다[하나님께서 사람의 역할을 하시며][a].


    4 그러므로 내 자녀들이여, 여러분도 이 일들을 여러분의 자녀들에게 말하여, 그들이 그분을 거역하지 않게 하십시오.


    5 나는 여러분이 거역하면서 거역하고, 불경하게 행하면서 불경하게 행할 것을 압니다. 여러분은 하나님의 율법에 주의를 기울이지 않고, 사람의 계명으로 말미암아 악에 물들어 타락할 것입니다.


    6 그러므로 여러분은 내 형제 갓과 단처럼 흩어질 것이며, 그들의 땅과 지파와 언어를 알지 못하게 될 것입니다.


    7 그러나 그분께서는 자신의 긍휼로 여러분을 믿음 가운데 모으실 것이며, 아브라함과 이삭과 야곱을 통하여 그렇게 하실 것입니다[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 ‘하나님께서 사람의 역할을 하시며’는 그리스어 전승에서 본문상 불확실하거나 확장된 읽기로 여겨질 수 있습니다. 여기서는 제시된 증인에 포함되어 있으므로 번역하되, ὑποκρινόμενος의 ‘역할을 하다/가장하다’라는 난해한 뉘앙스를 완화하거나 교리적으로 해소하지 않았습니다.
    reason: textual_variant
  - marker: b
    text: ‘믿음 가운데’(ἐν πίστει)는 ‘신실함 가운데’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 흩어짐과 그 후의 모음은 이스라엘 성경 전반에 나타나는 언약의 심판과 회복의 주제를 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  english_pob_choice: crushing the head of the dragon
  chosen_korean: 용의 머리를 짓부수실 것입니다
  alternatives_korean:
  - 용의 머리를 부수실 것입니다
  - 용의 머리를 산산이 부수실 것입니다
  lexicon: LSJ
  rationale: συντρίβων의 강한 파괴적 동작과 κάραν의 관용적 '머리' 이미지를 살려, 예언적·상징적 힘을 유지하는 동사로 옮겼습니다.
- source_word: ὑποκρινόμενος
  english_pob_choice: appearing as a man
  chosen_korean: '...모습으로 나타나실 것입니다'
  alternatives_korean:
  - 사람인 체하실 것입니다
  - 사람으로 가장하실 것입니다
  lexicon: LSJ
  rationale: 영어 POB가 드러낸 해석상의 긴장을 한국어도 그대로 보존해야 하므로, 의도적 해석을 덧씌우지 않는 중립적 표현을 택했습니다.
- source_word: ἀπειθήσωσιν / ἀπειθήσετε
  english_pob_choice: disobey
  chosen_korean: 거역하다
  alternatives_korean:
  - 불순종하다
  - 듣지 않다
  lexicon: BDAG
  rationale: 권위에 대한 직접적 거부의 뉘앙스를 살리면서 현대 한국어에서도 자연스럽고 문맥상 강한 표현을 택했습니다.
- source_word: ἐν πίστει
  english_pob_choice: in faith
  chosen_korean: 믿음 가운데
  alternatives_korean:
  - 믿음 안에서
  - 믿음으로
  lexicon: BDAG
  rationale: 문구의 모호성을 유지하면서도 한국어에서 가장 자연스럽게 공동체적·관계적 포섭을 드러내는 표현으로 옮겼습니다.
- source_word: εὐσπλαγχνίας
  english_pob_choice: compassion
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 불쌍히 여김
  lexicon: BDAG
  rationale: 구약적 언약 회복 문맥에서 하나님의 깊은 자비를 드러내는 전통적이면서도 원문에 충실한 단어를 사용했습니다.
theological_decisions:
- issue: Bracketed phrase θεὸς εἰς ἄνδρα ὑποκρινόμενος
  chosen_reading: 본문의 불확실성을 드러내기 위해 한국어 본문에서는 생략하고, 전후 흐름만 번역했습니다.
  alternative_readings:
  - '''하나님이 사람으로 나타나신다''로 반영'
  - '''하나님이 사람인 체하신다''로 직역'
  rationale: 영어 POB가 각주로 표시한 것처럼, 이 구절은 전승상 불확실하거나 확장된 읽기이므로 본문을 매끈하게 정리하지 않고 원문에 대한 신중함을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; avoid over-translating uncertain expansions.
- issue: ἐν πίστει의 의미
  chosen_reading: '''믿음 가운데''로 번역해 faith/faithfulness의 여지를 남겼습니다.'
  alternative_readings:
  - '''믿음으로'''
  - '''신실함 가운데'''
  rationale: 영어 주석이 밝힌 의미상의 개방성을 한국어에서도 유지하여, 문맥이 요구하는 더 좁은 교리적 결론을 미리 확정하지 않았습니다.
  doctrine_reference: Preserve ambiguity where the source remains open.
