revisions:
- from: 그런 사람들은 암사슴과 사슴과도 같습니다. 겉으로는 들짐승의 모습 때문에 부정한 것처럼 보이지만, 실제로는 온전히 깨끗합니다. 그들이 주님의 열심으로 걸으며, 하나님께서 계명들을 통해 또한 미워하시고 금하시는 것을 멀리하기 때문입니다. 그렇게 해서 그들은 악을 선에서 떼어 놓습니다.[a][b]
  to: 그런 사람들은 가젤과 사슴과 같습니다. 들짐승의 습성으로는 부정해 보이지만, 모든 면에서 깨끗합니다. 그들이 주님을 향한 열심 가운데 행하고, 하나님께서 계명들을 통하여 미워하시고 금하시는 것을 삼가며, 악이 선에 가까이하지 못하게 막기 때문입니다.
  rationale: 동물명과 양태 표현을 그리스어에 맞게 바로잡고, ‘모든 면에서’로 τὸ δὲ πᾶν의 범위를 보존했습니다. 마지막 분사 ἀπείργων은 앞선 행위들과 연결하여 악을 선으로부터 막는다는 뜻을 자연스러운 한국어로 번역했습니다. 대응 주석이 없는 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
