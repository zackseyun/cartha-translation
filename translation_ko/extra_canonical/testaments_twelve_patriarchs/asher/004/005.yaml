id: T12P.ASH.4.5
reference: Testament of Asher 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
translation:
  language: ko
  text: 그런 사람들은 가젤과 사슴과 같습니다. 들짐승의 습성으로는 부정해 보이지만, 모든 면에서 깨끗합니다. 그들이 주님을 향한 열심 가운데 행하고, 하나님께서 계명들을 통하여 미워하시고 금하시는 것을 삼가며, 악이 선에 가까이하지 못하게 막기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάσι καὶ ἐλάφοις
  english_pob_choice: gazelles and deer
  chosen_korean: 암사슴과 사슴
  alternatives_korean:
  - 가젤과 사슴
  - 영양과 사슴
  lexicon: 표준 동물명
  rationale: δορκάς는 보통 암사슴/가젤 계열로 옮길 수 있으나, 한국어에서 바로 인식되는 자연스러운 대응으로 '암사슴'을 택했고, ἐλάφος는 '사슴'으로 옮겼습니다.
- source_word: ἐν ἤθει ἀγρίων
  english_pob_choice: in the manner of wild animals
  chosen_korean: 들짐승의 모습 때문에
  alternatives_korean:
  - 들짐승의 방식으로
  - 야생 동물의 성품으로
  lexicon: ἦθος
  rationale: ἤθει는 단순 외양보다 ‘태도/양상/모습’의 범위를 가지므로, 영어 본문의 ‘manner’에 맞춰 겉으로 드러나는 모습이라는 뜻이 살아나도록 표현했습니다.
- source_word: καθαροί εἰσιν
  english_pob_choice: they are clean
  chosen_korean: 온전히 깨끗합니다
  alternatives_korean:
  - 깨끗합니다
  - 모두 깨끗합니다
  lexicon: καθαρός
  rationale: 문맥상 의례적/도덕적 정결을 함께 지시하므로, 단순한 청결보다 총체적 정결을 드러내기 위해 '온전히 깨끗합니다'로 옮겼습니다.
- source_word: ἐν ζήλῳ Κυρίου
  english_pob_choice: in zeal for the Lord
  chosen_korean: 주님의 열심으로
  alternatives_korean:
  - 주님을 향한 열심으로
  - 주님에 대한 열심으로
  lexicon: ζῆλος; κύριος
  rationale: ζήλῳ는 행위의 동력이 되는 열심/열정이며, Κυρίου는 주님에 대한 방향성을 나타내므로 한국어 자연성을 살려 간결하게 옮겼습니다.
- source_word: ἀπεχόμενοι ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει
  english_pob_choice: abstaining from what God also hates and forbids through the commandments
  chosen_korean: 하나님께서 계명들을 통해 또한 미워하시고 금하시는 것을 멀리하기 때문입니다
  alternatives_korean:
  - 하나님께서 계명들을 통해 또한 미워하시고 금하시는 것에서 절제하기 때문입니다
  - 하나님께서 계명들을 통해 또한 미워하시고 금하시는 것을 삼가기 때문입니다
  lexicon: ἀπέχομαι; ἀπαγορεύω
  rationale: ἀπέχομαι는 단순히 '피하다'보다 '멀리하다/삼가다/절제하다'의 의미가 있어, 영어 POB의 'abstaining from'을 반영하면서 계명에 따른 금지의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: '''주님의 열심''과 ''하나님께서 계명들을 통해...금하시는 것''의 관계'
  chosen_reading: 그들의 정결은 외형이 아니라, 주님을 향한 열심과 계명 순종에서 드러나는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 자기수양으로 읽기
  - 의례적 정결만을 강조하는 것으로 읽기
  rationale: 본문은 짐승의 외양과 실제 정결을 대비하면서, 주님의 열심 속에서 계명에 의해 금지된 것을 멀리하는 삶을 정결의 근거로 제시합니다.
  doctrine_reference: 정결/순종의 결합이라는 문맥적 신학
