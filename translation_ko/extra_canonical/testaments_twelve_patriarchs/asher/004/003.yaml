  source_fidelity: 개정이 필요합니다. ἐλεήμων은 ‘불쌍한 사람’(동정의 대상)이 아니라 ‘자비로운/긍휼을 베푸는 사람’입니다. 또한 τὸ πᾶν ἔργον은 문맥상 해당 인물의 행위 전체를 가리키는 것으로 자연스럽게 옮길 수 있습니다. 끝 구절의 다소 난해한 병치는 ‘선해 보이는 것’과 ‘참된 선’을 구별하고 그것들을 함께 기대하지 않는다는 원문의 표현을 보존했습니다.
  naturalness: 합쇼체 문장으로 자연스럽게 다듬었습니다. ‘이중적입니다’보다 διπρόσωπον의 비유를 보존하는 ‘두 얼굴을 가진 태도입니다’가 더 분명하며, ‘전체의 일’은 현대 한국어에서 어색하므로 ‘그의 모든 행위’로 바꾸었습니다.
