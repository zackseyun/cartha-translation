id: T12P.ASH.4.3
reference: Testament of Asher 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἔστι τις μισῶν¹³ τὸν ἐλεήμονα καὶ ἄδικον¹⁴, ⌜καὶ⌝¹⁵ τὸν μοιχὸν καὶ¹⁶ νηστεύοντα¹⁷, *καὶ αὐτό ἐστι διπρόσωπον¹⁸, ἀλλὰ ⌈τὸ πᾶν⌉ ἔργον ἀγαθόν¹⁹, ὅτι μιμεῖται²⁰ Κύριον, μὴ²¹ †προσδοκώμενος²² τὸ δοκοῦν καλὸν †μετὰ²³ *τοῦ ἀληθινοῦ²⁴ καλοῦ²⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/003.yaml
  text: There is one who hates the merciful and the unjust, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what seems good along with what is truly good.
translation:
  language: ko
  text: 자비로운 사람과 불의한 사람, 또 간음하는 사람과 금식하는 사람을 미워하는 이가 있습니다. 이것 역시 두 얼굴을 가진 태도입니다. 그러나 그의 모든 행위는 선합니다. 그가 주님을 본받으며, 선해 보이는 것을 참된 선과 함께 기대하지 않기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισῶν τὸν ἐλεήμονα καὶ ἄδικον
  english_pob_choice: hates the merciful and the unjust
  chosen_korean: 불쌍한 사람과 불의한 사람을 미워하는
  alternatives_korean:
  - 긍휼한 사람과 불의한 사람을 미워하는
  - 자비로운 사람과 불의한 사람을 미워하는
  lexicon: ἐλεήμων / ἄδικος
  rationale: ἐλεήμων은 단순히 감상적 ‘자비로운’보다 ‘불쌍한/긍휼히 여기는 사람’의 뜻이 살아 있어 한국어에서는 ‘불쌍한 사람’으로 옮겼고, ἄδικος는 관념적 ‘불의한’으로 대응했습니다.
- source_word: τὸν μοιχὸν καὶ νηστεύοντα
  english_pob_choice: the adulterer and the one who fasts
  chosen_korean: 간음하는 사람과 금식하는 사람
  alternatives_korean:
  - 간음하는 자와 금식하는 자
  - 간음한 사람과 금식하는 사람
  lexicon: μοιχός / νηστεύω
  rationale: 행위 대조를 살리기 위해 상태표현보다 행위형으로 옮겼고, ‘금식하는 사람’은 원문의 현재분사 뉘앙스를 유지했습니다.
- source_word: διπρόσωπον
  english_pob_choice: double-faced
  chosen_korean: 이중적
  alternatives_korean:
  - 두 얼굴의
  - 겉과 속이 다른
  lexicon: διπρόσωπος
  rationale: 직역적 ‘두 얼굴의’보다 본문의 윤리적 평가를 간결하게 드러내는 ‘이중적’이 한국어 독자에게 더 자연스럽고, 원문의 비난 강도도 보존합니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주님이신 분
  lexicon: κύριος
  rationale: 여기서는 예수나 야훼를 특정하지 않는 일반적 경칭이지만, 한국어 성경 문맥에서 자연스러운 호칭으로 ‘주님’을 택했습니다.
theological_decisions:
- issue: '''τὸ πᾶν ἔργον ἀγαθόν''의 범위'
  chosen_reading: ‘전체의 일은 선합니다’로 옮겨, 말하는 행위 하나가 아니라 그 사람의 전적인 삶/행동 양식을 가리키는 평가로 유지했습니다.
  alternative_readings:
  - ‘모든 일은 선합니다’
  - ‘온갖 선한 일입니다’
  rationale: 원문은 개별 행위의 나열보다 ‘전체’(τὸ πᾶν)를 강조하므로, 단수적 총체성을 살리는 번역이 더 충실합니다.
  doctrine_reference: 문맥상 윤리적 총평
- issue: '''μὴ προσδοκώμενος τὸ δοκοῦν καλὸν μετὰ τοῦ ἀληθινοῦ καλοῦ''의 의미'
  chosen_reading: ‘선해 보이는 것을 참된 선과 함께 기대하지 않기 때문입니다’로 옮겨, 겉보기 선과 참된 선을 구분하는 긴장을 드러냈습니다.
  alternative_readings:
  - ‘겉으로 좋게 보이는 것과 참된 선을 함께 기대하지 않기 때문입니다’
  - ‘좋아 보이는 것만을 참된 선으로 여기지 않기 때문입니다’
  rationale: 원문은 ‘보이는 선’과 ‘참된 선’을 병치하면서 함께 기대하지 않는 태도를 말하므로, 이를 섞어버리지 않고 분리해 표현했습니다.
  doctrine_reference: 윤리적 분별
