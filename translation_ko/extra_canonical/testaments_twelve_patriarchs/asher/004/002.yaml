  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Πολλοὶ ⌜δὲ⌝⁷ ἀναιροῦντες τοὺς⁸ πονηρούς, δύο⁹ ποιοῦσιν ἔργα *καλοῦ τε καὶ κακοῦ¹⁰, *τὸ δὲ ὅλον¹¹ καλόν, ὅτι τὸ¹² κακὸν ἐκριζώσας ἀπώλεσεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/002.yaml
  text: And many, in doing away with the wicked, do two things, good and evil; yet the whole is good, because he has uprooted and destroyed the evil.
translation:
  language: ko
  text: 많은 사람은 악한 자들을 없애면서 선한 일과 악한 일, 두 가지를 합니다. 그러나 전체로는 선합니다. 그가 악을 뿌리째 뽑아 없앴기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιροῦντες τοὺς πονηρούς
  english_pob_choice: in doing away with the wicked
  chosen_korean: 악한 자들을 없애면서
  alternatives_korean:
  - 악한 자들을 제거하면서
  - 악한 자들을 죽이면서
  lexicon: ἀναιρέω
  rationale: 문맥상 단순한 ‘제거’보다 ‘없애다’가 넓은 의미를 담고, 본문이 악한 자를 처리하는 행위를 일반적으로 말하므로 과도하게 살상 의미를 고정하지 않았습니다.
- source_word: δύο ποιοῦσιν ἔργα καλοῦ τε καὶ κακοῦ
  english_pob_choice: do two things, good and evil
  chosen_korean: 선한 일과 악한 일을 두 가지나 행합니다
  alternatives_korean:
  - 좋은 일과 나쁜 일을 두 가지나 합니다
  - 선과 악 두 가지 일을 합니다
  lexicon: ποιέω; ἔργον; καλός/κακός
  rationale: 그리스어의 대구를 따라 ‘두 가지’와 ‘선한/악한’의 대비를 살렸고, ‘일’은 ἔργα의 자연스러운 현대 한국어 대응으로 선택했습니다.
- source_word: τὸ δὲ ὅλον καλόν
  english_pob_choice: yet the whole is good
  chosen_korean: 그러나 전체로는 선합니다
  alternatives_korean:
  - 그러나 전부는 선합니다
  - 하지만 전체는 좋습니다
  lexicon: ὅλον; καλόν
  rationale: ὅλον은 ‘전체’로, καλόν은 단순한 ‘좋다’보다 도덕적 평가를 드러내는 ‘선하다’로 옮겨 본문의 평가를 분명히 했습니다.
- source_word: ἐκριζώσας ἀπώλεσεν
  english_pob_choice: he has uprooted and destroyed
  chosen_korean: 뿌리째 뽑아 없앴기 때문입니다
  alternatives_korean:
  - 뿌리째 뽑고 파멸시켰기 때문입니다
  - 뿌리째 뽑아 멸망시켰기 때문입니다
  lexicon: ἐκριζόω; ἀπόλλυμι
  rationale: ‘뿌리째 뽑다’는 ἐκριζόω의 강한 비유를 살리고, ἀπώλεσεν은 문맥상 ‘없앴다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 악한 자를 없애는 행위가 ‘선’과 ‘악’ 두 측면을 동시에 가진다는 진술
  chosen_reading: 본문의 역설을 그대로 유지해, 행위의 의도나 결과가 단순한 선악 이분법으로 환원되지 않음을 드러냈습니다.
  alternative_readings:
  - ‘선한 일과 악한 일을 한다’는 표현을 완화하여 단순한 혼합행위로 읽기
  - ‘전체는 선하다’를 도덕적 합법성으로 약화해 해석하기
  rationale: 그리스어는 ‘두 가지 일’과 ‘전체는 선하다’의 긴장을 함께 제시하므로, 이를 풀어버리지 않고 보존하는 것이 본문의 논지를 더 정확히 전달합니다.
  doctrine_reference: 본문 해석 원리 및 문학적 긴장 보존
