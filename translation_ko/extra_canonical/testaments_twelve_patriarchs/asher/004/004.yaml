  to: 또 다른 사람은 낭비하는 자들과 함께 좋은 날들을 보기를 원하지 않습니다. 이는 몸을 욕되게 하고 영혼을 더럽히지 않기 위해서입니다. 비록 이것이 두 얼굴을 지닌 것이지만, 전적으로 선합니다.
