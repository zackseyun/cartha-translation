id: T12P.ASH.4.4
reference: Testament of Asher 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος²⁶ οὐ θέλει *ἰδεῖν ⌈ἡμέρας⌉ ἀγαθὰς²⁷ μετὰ ἀσώτων, ἵνα μὴ αἰσχράνει²⁸ τὸ σῶμα²⁹ καὶ τὴν ψυχὴν μολυνεῖ³⁰. *καίγε τοῦτο διπρόσωπον³¹, ὅλον³² δὲ καλόν³³ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/004.yaml
  text: Another does not wish to see good days with the wasteful, lest he disgrace the body and defile the soul. Even though this is double-faced, yet it is wholly good.
translation:
  language: ko
  text: 또 다른 사람은 낭비하는 자들과 함께 좋은 날들을 보기를 원하지 않으니, 이는 그가 몸을 욕되게 하고 영혼을 더럽히지 않게 하려는 것입니다. 비록 이것이 겉과 속이 다른 듯하지만, 전체로는 선합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν ⌈ἡμέρας⌉ ἀγαθὰς
  english_pob_choice: see good days
  chosen_korean: 좋은 날들을 보기를 원하지 않으니
  alternatives_korean:
  - 좋은 날들을 보지 않으려 하니
  - 좋은 날들을 누리려 하지 않으니
  lexicon: ἰδεῖν / ἡμέρας ἀγαθὰς
  rationale: 직역적 ‘보다’의 의미를 살리되, 한국어에서는 ‘좋은 날들을 보기를 원하지 않다’가 삶의 형편을 가리키는 관용을 자연스럽게 드러냅니다.
- source_word: μετὰ ἀσώτων
  english_pob_choice: with the wasteful
  chosen_korean: 낭비하는 자들과 함께
  alternatives_korean:
  - 방탕한 자들과 함께
  - 허랑방탕한 자들과 함께
  lexicon: ἀσώτοι
  rationale: POB의 ‘wasteful’를 따라 도덕적 방종보다 ‘낭비/탕진’의 뉘앙스를 유지하면서, 복수 인물 표현을 위해 ‘자들’로 옮겼습니다.
- source_word: αἰσχράνει τὸ σῶμα
  english_pob_choice: he disgrace the body
  chosen_korean: 몸을 욕되게 하고
  alternatives_korean:
  - 몸에 수치를 끼치고
  - 몸을 부끄럽게 하고
  lexicon: αἰσχραίνω
  rationale: ἀσχρ- 계열의 수치/치욕 의미를 반영하여, 단순한 오염보다 ‘욕되게 하다’가 POB의 ‘disgrace’와 source의 어감을 더 잘 살립니다.
- source_word: μολυνεῖ τὴν ψυχήν
  english_pob_choice: defile the soul
  chosen_korean: 영혼을 더럽히지 않게 하려는 것입니다
  alternatives_korean:
  - 영혼을 더럽히지 않게 하려는 것입니다
  - 영혼을 오염시키지 않게 하려는 것입니다
  lexicon: μολύνω / ψυχή
  rationale: μολύνω의 물질적·도덕적 오염 이미지를 한국어 ‘더럽히다’로 담고, ψυχή는 문맥상 ‘영혼’이 가장 직접적입니다.
- source_word: διπρόσωπον
  english_pob_choice: double-faced
  chosen_korean: 겉과 속이 다른 듯하지만
  alternatives_korean:
  - 두 얼굴을 지닌 듯하지만
  - 겉과 속이 다른 이중적인 듯하지만
  lexicon: διπρόσωπος
  rationale: 직역형 ‘두 얼굴’은 한국어에서 지나치게 평가적이어서, 원문의 긴장과 POB의 신중함을 살린 완곡한 표현으로 옮겼습니다.
theological_decisions:
- issue: 마지막 평결의 의미(“wholly good”)
  chosen_reading: ‘전체로는 선합니다’로 옮겨, 겉보기의 이중성에도 불구하고 전인적/총체적 선함을 보존했습니다.
  alternative_readings:
  - 완전히 선합니다
  - 전적으로 선합니다
  rationale: ὅλον δὲ καλόν ἐστιν은 외형의 양가성보다 본질의 선함을 말하므로, 한국어에서도 총체성에 초점을 둔 표현이 가장 안전합니다.
  doctrine_reference: 인격/행위의 총체성에 대한 윤리적 평가
