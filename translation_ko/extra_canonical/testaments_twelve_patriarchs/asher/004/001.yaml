review_pass:
  verdict: revise
  source_fidelity: 'The draft wrongly makes μονοπρόσωποι causal (“because they have a single face”), whereas the Greek coordinates it with “good” as a further description. Its wording also unevenly renders the paired facial imagery: “단일한 얼굴” is unnatural, while “이중적인” abandons the corresponding image. The revision preserves the coordinate description and the single-/double-faced contrast.'
  naturalness: “한 얼굴만 지닌 사람들” and “두 얼굴을 가진 사람들” are understandable modern Korean and retain the ethical metaphor without the stilted expression “단일한 얼굴.” The formal declarative ending is maintained.
  terminology: “선한,” “죄를 짓는다고 여겨질지라도,” and “하나님 앞에서는 의롭습니다” accurately convey ἀγαθοί, ἁμαρτάνειν νομισθῶσι, and δίκαιοί εἰσι παρὰ τῷ Θεῷ. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: Causal relationship introduced for μονοπρόσωποι
    rationale: The draft’s “단일한 얼굴을 가졌기 때문에” adds a causal relation not expressed by καί, which coordinates “single-faced” with the description of the good people.
  - severity: medium
    issue: Paired metaphor is not consistently retained
    rationale: The source contrasts μονοπρόσωποι and διπρόσωποι. Rendering one as “단일한 얼굴” and the other as “이중적인” weakens the deliberate verbal/image contrast.
  - severity: low
    issue: Unresolved footnote marker
    rationale: The text contains [a], but no corresponding footnote content is supplied. Since no necessary explanatory note can be responsibly reconstructed from the provided source, the unsupported marker is removed.
  revised_text: 선하고 한 얼굴만 지닌 사람들은, 두 얼굴을 가진 사람들에게 죄를 짓는다고 여겨질지라도 하나님 앞에서는 의롭습니다.
