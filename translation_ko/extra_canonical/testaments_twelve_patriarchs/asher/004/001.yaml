  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: IV. Οἱ γὰρ ἀγαθοὶ ἄνθρωποι¹ *⌜καὶ⌝ μονοπρόσωποι κἂν² νομισθῶσι παρὰ τῶν³ διπροσώπων⁴ ἁμαρτάνειν⁵, δίκαιοί εἰσι παρὰ τῷ⁶ Θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/001.yaml
  text: For good men, being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God.
translation:
  language: ko
  text: 선하고 한 얼굴만 지닌 사람들은, 두 얼굴을 가진 사람들에게 죄를 짓는다고 여겨질지라도 하나님 앞에서는 의롭습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοὶ ἄνθρωποι
  english_pob_choice: good men
  chosen_korean: 선한 사람들
  alternatives_korean:
  - 좋은 사람들
  - 선한 사람들
  lexicon: ἀγαθός + ἄνθρωπος
  rationale: ἀγαθοί는 도덕적 선함을 가리키므로 자연스러운 한국어로 ‘선한 사람들’이 적절합니다.
- source_word: μονοπρόσωποι
  english_pob_choice: single-faced
  chosen_korean: 단일한 얼굴을 가진
  alternatives_korean:
  - 한 얼굴의
  - 단일한 얼굴을 가진
  - 겉과 속이 같은
  lexicon: μονοπρόσωπος
  rationale: 직역하면 ‘한 얼굴을 가진’이지만, 본문 대비 구조를 살리면서도 한국어에서 의미가 분명하도록 ‘단일한 얼굴을 가진’으로 옮겼습니다.
- source_word: διπροσώπων
  english_pob_choice: double-faced
  chosen_korean: 이중적인 사람들
  alternatives_korean:
  - 두 얼굴의 사람들
  - 이중적인 사람들
  - 겉과 속이 다른 사람들
  lexicon: διπρόσωπος
  rationale: 문맥상 도덕적 위선을 가리키므로 ‘이중적인 사람들’이 가장 자연스럽고, 원문의 ‘두 얼굴’ 이미지를 보존합니다.
- source_word: δίκαιοί εἰσι παρὰ τῷ Θεῷ
  english_pob_choice: are righteous before God
  chosen_korean: 하나님 앞에서 의롭습니다
  alternatives_korean:
  - 하나님 앞에서 의롭습니다
  - 하나님께 의롭다고 여겨집니다
  lexicon: δίκαιος + παρά
  rationale: παρὰ τῷ Θεῷ는 ‘하나님 앞에서’라는 관계적 판단을 뜻하므로, POB의 ‘before God’을 따라 ‘하나님 앞에서 의롭습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘single-faced’와 ‘double-faced’의 도덕적 대비를 한국어로 어떻게 유지할지
  chosen_reading: 외형적 얼굴 이미지와 도덕적 성실성의 대비를 함께 살려, ‘단일한 얼굴/이중적인 사람들’로 번역했습니다.
  alternative_readings:
  - ‘한 얼굴의 사람들/두 얼굴의 사람들’
  - ‘겉과 속이 같은 사람들/겉과 속이 다른 사람들’
  rationale: 본문은 외양이 아니라 성품의 일관성과 위선을 대조하므로, 이미지와 의미를 함께 유지하는 번역이 필요합니다.
  doctrine_reference: 윤리적 성실성과 위선에 대한 경구적 대비
