base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004.yaml
  text: '1 For good men[a], being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God. 2 And many, in doing away with the wicked, perform two works, one good and one evil; yet the whole is good, because he has uprooted and destroyed the evil. 3 There is one who hates the merciful man and the unjust man, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what only seems good together with what is truly good[b]. 4 Another does not wish to see good days with the wasteful, lest he defile his body and pollute his soul. Even though this is double-faced, yet it is wholly good. 5 For such men are like gazelles and deer: in the bearing of wild animals they seem to be unclean, but in every respect they are clean, because they walk in zeal for the Lord, keeping away from those things which God also hates and forbids through the commandments[d][c], thus holding back
    evil from good.'
  footnotes:
  - marker: a
    text: Or 'two-faced' for 'double-faced' throughout the chapter.
    reason: lexical_alternative
  - marker: b
    text: The Greek expression 'what seems good' contrasts apparent good with 'what is truly good.'
    reason: lexical_alternative
  - marker: c
    text: The animal comparison likely refers to creatures that may appear wild or suspect in outward manner, yet are in fact clean; the point is moral appearance versus true purity.
    reason: cultural_note
  - marker: d
    text: The final clause is compressed in Greek and may also be rendered 'keeping evil away from good.'
    reason: alternative_reading
translation:
  language: ko
  text: '1 선한 사람들은 한 얼굴을 가진 사람들이므로, 비록 두 얼굴을 가진 사람들에게 죄를 짓는다고 여겨질지라도 하나님 앞에서는 의롭습니다.[a]


    2 또 많은 사람은 악한 자들을 없애면서 선한 일과 악한 일, 두 일을 합니다. 그러나 그 일 전체는 선합니다. 그 사람이 악을 뿌리째 뽑아 없앴기 때문입니다.


    3 긍휼을 베풀면서도 불의한 사람과, 간음하면서도 금식하는 사람을 미워하는 이가 있습니다. 이것도 두 얼굴을 가진 것입니다. 그러나 그 일 전체는 선합니다. 겉으로 선해 보이는 것을 참된 선과 함께 바라지 않고 주님을 본받기 때문입니다.[b]


    4 또 다른 사람은 방탕한 자들과 함께 좋은 날들을 맞이하려 하지 않습니다. 자기 몸을 더럽히고 자기 영혼을 오염시키지 않으려는 것입니다. 이것도 두 얼굴을 가진 것이지만, 그 전체는 선합니다.


    5 이런 사람들은 가젤과 사슴과 같습니다. 사나운 짐승들과 같은 모습 때문에 부정한 것처럼 보이지만, 실상은 온전히 깨끗합니다.[c] 그들은 주님께 대한 열심으로 살아가며, 하나님께서도 계명들을 통하여 미워하시고 금하시는 것들을 멀리합니다. 하나님께서는 악을 선에서 막으십니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 얼굴을 가진’과 ‘두 얼굴을 가진’은 이 장 전체에서 반복되는 그리스어의 얼굴 은유를 옮긴 표현입니다. 각각 ‘한결같은’, ‘이중적인’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘겉으로 선해 보이는 것’과 ‘참된 선’을 대비합니다. 문장의 뜻과 연결 방식에는 다소 압축된 표현이 남아 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 동물 비유는 겉모습이나 태도 때문에 야성적이고 부정하게 보일 수 있으나, 실제로는 깨끗하다는 도덕적 외양과 참된 순수의 대비를 나타내는 듯합니다.
    reason: cultural_note
  - marker: d
    text: 마지막 표현은 압축되어 있으며 ‘악을 선에서 멀리 막으신다’ 또는 ‘악이 선에 붙지 못하게 하신다’로도 옮길 수 있습니다. 그리스어 단수 분사는 바로 앞의 ‘하나님’에 연결됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μονοπρόσωποι
  english_pob_choice: single-faced
  chosen_korean: 단일한 얼굴을 지녔으므로
  alternatives_korean:
  - 한 얼굴뿐인
  - 두 얼굴이 없는
  - 일관된
  lexicon: LSJ
  rationale: POB의 'single-faced'가 유지한 얼굴 은유를 한국어에서도 살리되, 현대 독자가 자연스럽게 읽도록 풀어 옮겼습니다.
- source_word: διπρόσωποι / διπρόσωπον
  english_pob_choice: double-faced
  chosen_korean: 이중적인
  alternatives_korean:
  - 두 얼굴의
  - 이중 얼굴의
  - 두 마음의
  lexicon: LSJ
  rationale: 본문 전체의 대조는 얼굴 은유이지만, 한국어에서는 '이중적인'이 그 도덕적 대립을 가장 분명하게 전달합니다.
- source_word: ἀναιροῦντες
  english_pob_choice: doing away with
  chosen_korean: 제거하면서
  alternatives_korean:
  - 죽이면서
  - 없애면서
  - 도태시키면서
  lexicon: BDAG
  rationale: 살해와 제거의 뉘앙스를 모두 열어 두면서, 본문의 윤리적 초점이 악한 것의 제거에 있음을 드러내기 위해 선택했습니다.
- source_word: τὸ δοκοῦν καλὸν ... τοῦ ἀληθινοῦ καλοῦ
  english_pob_choice: what only seems good ... what is truly good
  chosen_korean: 겉보기에 선한 것 ... 참된 선
  alternatives_korean:
  - 좋아 보이는 것 ... 참된 선
  - 선해 보이는 것 ... 진정한 선
  - 겉으로 선한 것 ... 실제로 선한 것
  lexicon: LSJ
  rationale: 겉으로만 좋아 보이는 것과 실제로 참된 선의 대비를 한국어에서도 분명히 유지했습니다.
- source_word: ἀσώτων
  english_pob_choice: the wasteful
  chosen_korean: 방탕한 자들
  alternatives_korean:
  - 낭비하는 자들
  - 방탕한 사람들
  - 방종한 자들
  lexicon: BDAG
  rationale: 단순한 재정적 낭비보다 도덕적 문란과 무절제를 포함하는 뜻이므로, 한국어 성서 문맥에서 익숙한 '방탕한 자들'로 옮겼습니다.
- source_word: δορκάσι καὶ ἐλάφοις
  english_pob_choice: gazelles and deer
  chosen_korean: 들사슴과 사슴
  alternatives_korean:
  - 가젤과 사슴
  - 영양과 사슴
  - 들영양과 사슴
  lexicon: LSJ
  rationale: 동물 이미지를 자연스럽게 살리되, 독자에게 낯선 'gazelle'을 '들사슴'으로 풀어 대응했습니다.
theological_decisions:
- issue: 두 얼굴/이중성에 대한 평가
  chosen_reading: 본문은 모든 이중성을 무조건 정죄하는 것이 아니라, 겉으로는 혼합되거나 कठ하게 보이는 행동도 전체 목적상 선할 수 있음을 말합니다.
  alternative_readings:
  - 모든 이중성을 예외 없이 정죄한다
  - 도덕적 모순을 전면적으로 허용한다
  rationale: 반복되는 '이중적이지만, 전체로는 선합니다'라는 구조를 따라, 외형적 혼합과 내적 위선을 구분해 번역했습니다.
  doctrine_reference: 본문의 수사적 긴장을 보존하고 조화시키지 않음
- issue: Κύριον의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주(主)
  - 야훼
  rationale: 이 문맥은 유대 문헌의 윤리적 진술이며, POB의 기존 판단에 따라 Κύριον은 '주님'으로 옮겨 인격적 호칭을 유지했습니다.
  doctrine_reference: κύριος → 주님
