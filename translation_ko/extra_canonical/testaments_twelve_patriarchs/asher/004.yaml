revisions:
- from: 1 선한 사람들은 단일한 얼굴을 지녔으므로, 비록 이중적인 사람들에게 죄를 짓는다고 여겨지더라도 하나님 앞에서는 의롭습니다. 2 또 많은 사람들은 악한 이들을 제거하면서 선한 일과 악한 일을 두 가지로 행하지만, 전체로는 선합니다. 그가 악을 뿌리째 뽑아 없앴기 때문입니다. 3 긍휼한 사람과 불의한 사람을, 간음하는 사람과 금식하는 사람을 미워하는 이도 있습니다. 이것 역시 이중적이지만, 전체 일은 선합니다. 참된 선과 함께 겉보기에 선한 것을 함께 기대하지 않고 주님을 본받기 때문입니다. 4 또 다른 사람은 방탕한 자들과 함께 좋은 날을 보려 하지 않으니, 자기 몸을 더럽히고 자기 영혼을 오염시키지 않기 위해서입니다. 이것 역시 이중적으로 보이지만, 전체로는 선합니다. 5 이런 사람들은 들사슴과 사슴과 같아서, 들짐승의 겉모습으로는 부정한 것처럼 보이지만, 모든 면에서는 깨끗합니다. 주님의 열심으로 걸으며, 하나님께서도 계명들을 통해 미워하시며 금하시는 것들에서 멀리 떠나기 때문입니다. 그렇게 해서 악을 선으로부터 막아 냅니다.[a][b][c][d]
