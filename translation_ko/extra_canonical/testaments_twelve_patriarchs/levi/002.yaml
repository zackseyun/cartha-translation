base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002.yaml
  text: 1[a]. I, Levi, was born in Haran, and I came with my father to Shechem. 2. And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor. 3[b]. And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers. 4. And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved. 5. Then sleep fell upon me, and I saw a high mountain, and I was on it. 6. And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi[c], enter.”
  footnotes:
  - marker: a
    text: The phrase 'corrupting their way' literally reflects people ruining or destroying their own way of life/conduct.
    reason: lexical_alternative
    anchor_ref: '2:3'
  - marker: b
    text: '''The race of the sons of men'' is a solemn Semitic-style expression for humankind.'
    reason: cultural_note
    anchor_ref: '2:4'
  - marker: c
    text: The opening of the heavens is standard apocalyptic vision language; compare other biblical and Jewish visionary scenes.
    reason: cross_reference
    anchor_ref: '2:6'
translation:
  language: ko
  text: 1. 나 레위는 하란에서 태어났고 아버지와 함께 세겜으로 왔습니다. 2. 나는 아직 젊었는데, 나이는 스무 살쯤이었습니다. 그때 나는 시므온과 함께 하몰에게 우리 누이 디나를 위하여 보복을 행했습니다. 3. 내가 아벨마울에서 양을 치고 있을 때, 주께로부터 분별의 영이 내게 임했습니다. 나는 모든 사람이 자기들의 길을 파괴하는 것을[a] 보았고, 죄가 성벽 위에 세워지고 불의가 망대 위에 앉아 있는 것을 보았습니다. 4. 나는 인류를[b] 두고 슬퍼하며, 주께서 저를 구원해 주시기를 기도했습니다. 5. 그때 잠이 나를 덮쳤고, 나는 높은 산을 보았습니다. 나는 그 산 위에 있었습니다. 6. 보십시오, 하늘이 열렸고[c] 주의 천사가 내게 말했습니다. “레위야, 레위야, 들어가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기들의 길을 파괴하는’입니다. 여기서 ‘길’은 삶의 방식이나 행실을 가리키는 도덕적 비유입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘인류’는 직역하면 ‘사람 자손의 족속’입니다. 이는 온 인류를 가리키는 엄숙한 셈어식 표현입니다.
    reason: cultural_note
  - marker: c
    text: ‘하늘이 열림’은 묵시적 환상에서 흔히 쓰이는 표현입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγὼ Λευὶ ... ἐγεννήθην ... ἦλθον ... εἰς Σίκημα
  english_pob_choice: I, Levi, was born in Haran, and I came with my father to Shechem
  chosen_korean: 나 레위는 하란에서 태어났고, 아버지와 함께 세겜으로 왔습니다
  alternatives_korean:
  - 저는 레위입니다. 하란에서 태어났으며 아버지와 함께 세겜에 왔습니다
  - 나 레위는 하란에서 태어났고 아버지와 함께 세겜에 이르렀습니다
  lexicon: LSJ
  rationale: 자전적 진술의 단문 구조를 살리면서, ἐγεννήθην의 수동형은 자연스럽게 '태어났습니다'로 옮겼습니다.
- source_word: ἐποίησα τὴν ἐκδίκησιν μετὰ Συμεών
  english_pob_choice: I carried out vengeance with Simeon
  chosen_korean: 시므온과 함께 ... 보복을 행했습니다
  alternatives_korean:
  - 시므온과 함께 ... 복수를 했습니다
  - 시므온과 함께 ... 원수를 갚았습니다
  lexicon: BDAG
  rationale: ἐκδίκησις의 강한 보복/징벌 뉘앙스를 살리면서도, 한국어에서 지나치게 감정적이거나 관용적인 표현보다 행위의 공적 성격이 드러나도록 했습니다.
- source_word: πνεῦμα συνέσεως Κυρίου
  english_pob_choice: a spirit of understanding from the Lord
  chosen_korean: 주께로부터 이해의 영
  alternatives_korean:
  - 주께로부터 깨달음의 영
  - 주님께로부터 분별의 영
  lexicon: LSJ
  rationale: 원문은 정관사가 없어 고유한 위격 명칭을 강요하지 않으므로, '이해의 영'으로 번역해 신적 기원은 살리되 과도한 특정화를 피했습니다.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  english_pob_choice: destroying their way
  chosen_korean: 자기들의 길을 파괴하는
  alternatives_korean:
  - 자기들의 길을 망가뜨리는
  - 자기들의 행실을 무너뜨리는
  lexicon: LSJ
  rationale: POB의 문맥상 도덕적 타락을 뜻하지만, 원문 동사의 파괴성을 반영해 '파괴하는'을 택했습니다.
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  english_pob_choice: the heavens were opened
  chosen_korean: 하늘들이 열렸고
  alternatives_korean:
  - 하늘이 열렸고
  - 하늘 문이 열렸고
  lexicon: LSJ
  rationale: 복수형 οἱ οὐρανοί를 그대로 살려 '하늘들이'로 옮겼고, 묵시적 환시의 표현을 보존했습니다.
theological_decisions:
- issue: πνεῦμα συνέσεως Κυρίου의 정체
  chosen_reading: 주께로부터 온 이해의 영으로 번역하되, 성령으로 단정하지 않습니다
  alternative_readings:
  - 성령으로 번역
  - 하나님의 영으로 번역
  rationale: 그리스어 본문만으로는 삼위일체적 명칭을 요구하지 않으므로, 신적 기원과 기능을 유지하면서도 텍스트가 말하는 범위를 넘지 않게 했습니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
- issue: σωθῶ의 의미
  chosen_reading: 구원받도록
  alternative_readings:
  - 구출되도록
  - 보존되도록
  rationale: 주변 문맥이 인간의 타락과 위협을 함께 담고 있어, 물리적 구출보다 넓은 구원의 의미를 열어 두는 표현이 적절합니다.
  doctrine_reference: DOCTRINE.md § Original-language primacy over translation tradition
