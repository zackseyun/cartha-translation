base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016.yaml
  text: 'And now I know that for seventy weeks you will go astray[a], and you will profane the priesthood and defile the altars. And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.


    And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his stature, taking innocent blood upon your heads in wickedness.


    But I tell you that because of him your holy places will be laid waste to the ground. And no clean place will remain for you, but you will be among the nations of the earth for a curse and for scattering[b][a][a], until he himself visits again and shows compassion and receives you.'
  footnotes:
  - marker: a
    text: The Greek text of this sentence is difficult and shows signs of textual disturbance. The translation follows the witness provided, but the wording may reflect expansion or later interpolation.
    reason: textual_variant
    anchor_ref: '16:3'
  - marker: a
    text: Or 'a man making the law new.' The phrase could be heard as hostile accusation against a reforming figure.
    reason: lexical_alternative
    anchor_ref: '16:3'
  - marker: a
    text: '''His stature'' is literal; the sense may be ''his true worth'' or ''his majesty.'''
    reason: lexical_alternative
    anchor_ref: '16:3'
  - marker: b
    text: The subject of 'he himself visits again' may be understood as God, or possibly as the previously mentioned figure; the Greek does not force a single interpretation.
    reason: alternative_reading
    anchor_ref: '16:5'
translation:
  language: ko
  text: '그리고 이제 나는 너희가 칠십 주 동안 길을 벗어나게 될 것임을 압니다[a]. 너희는 제사장직을 더럽히고 제단들을 더럽힐 것입니다. 또 율법을 버리고, 예언자들의 말을 악한 왜곡 속에서 업신여길 것입니다. 너희는 의로운 사람들을 박해하고 경건한 이들을 미워하며, 참된 이들의 말을 혐오할 것입니다.


    그리고 지극히 높으신 이의 권능 안에서 율법을 새롭게 하는 한 사람을 너희는 속이는 자라고 부를 것이며, 마침내는 그의 키를 알지 못한 채 그를 죽이려고 달려들고, 죄 없는 피를 악함 가운데 너희 머리 위에 떠맡게 될 것입니다.


    그러나 내가 너희에게 말합니다. 그 사람 때문에 너희의 거룩한 곳들은 땅에 이르기까지 황폐하게 될 것입니다. 그리고 너희에게 깨끗한 곳은 남지 않을 것이며, 너희는 땅의 여러 민족들 가운데서 저주와 흩어짐을 당하게 될 것입니다[b]. 그분 자신이 다시 찾아오셔서 불쌍히 여기시고 너희를 받아들이실 때까지입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδας
  english_pob_choice: seventy weeks
  chosen_korean: 칠십 주
  alternatives_korean:
  - 칠십 이레
  - 칠십 주간
  lexicon: LSJ
  rationale: 히브리/묵시 문맥에서 관용적으로 읽힐 수 있지만, 본문이 가진 시간표현의 직역성을 살리기 위해 ‘주’를 택했습니다.
- source_word: πλανηθήσεσθε
  english_pob_choice: you will go astray
  chosen_korean: 길을 벗어나게 될 것임을
  alternatives_korean:
  - 미혹되게 될 것임을
  - 방황하게 될 것임을
  lexicon: LSJ
  rationale: 도덕적 일탈과 방향 상실의 뉘앙스를 함께 담기 위해 ‘길을 벗어나다’로 옮겼습니다.
- source_word: ἱερωσύνην βεβηλώσετε
  english_pob_choice: you will profane the priesthood
  chosen_korean: 제사장직을 더럽히고
  alternatives_korean:
  - 제사장직을 속되게 하고
  - 제사장직을 모독하고
  lexicon: LSJ
  rationale: 성직 자체를 훼손한다는 의미를 자연스럽게 드러내기 위해 ‘더럽히다’를 사용했습니다.
- source_word: λόγους προφητῶν ἐξουδενώσετε
  english_pob_choice: treat the words of the prophets with contempt
  chosen_korean: 예언자들의 말을 업신여길 것입니다
  alternatives_korean:
  - 예언자들의 말을 멸시할 것입니다
  - 예언자들의 말을 경멸할 것입니다
  lexicon: LSJ
  rationale: ‘업신여기다’는 경멸과 무시의 태도를 함께 드러내어 원문의 모욕적 뉘앙스를 잘 살립니다.
- source_word: ἄνδρα καινοποιοῦντα νόμον
  english_pob_choice: a man who renews the law
  chosen_korean: 율법을 새롭게 하는 한 사람
  alternatives_korean:
  - 율법을 새로 만드는 한 사람
  - 율법을 갱신하는 한 사람
  lexicon: LSJ
  rationale: POB의 직역 취지를 따라 ‘새롭게 하다’를 유지하되, 한국어에서 가장 자연스러운 명사화로 정리했습니다.
- source_word: ἐν δυνάμει ὑψίστου
  english_pob_choice: in the power of the Most High
  chosen_korean: 지극히 높으신 이의 권능 안에서
  alternatives_korean:
  - 지극히 높으신 분의 권능으로
  - 가장 높으신 이의 능력 안에서
  lexicon: LSJ
  rationale: ‘Ὕψιστος’의 고유한 신칭을 살려 ‘지극히 높으신 이’로 옮겼습니다.
- source_word: ἀνάστημα
  english_pob_choice: stature
  chosen_korean: 키
  alternatives_korean:
  - 자태
  - 진정한 위상
  lexicon: LSJ
  rationale: 본문의 문자적 난점을 드러내기 위해 가장 직접적인 의미를 택했고, 해석 가능성은 주석에 남깁니다.
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  english_pob_choice: for a curse and for scattering
  chosen_korean: 저주와 흩어짐을 당하게 될 것입니다
  alternatives_korean:
  - 저주와 분산을 당하게 될 것입니다
  - 저주와 유랑이 될 것입니다
  lexicon: LSJ
  rationale: 명사구를 한국어 문장에서는 결과 진술로 풀어 주어, 예언적 선언의 힘을 살렸습니다.
- source_word: ἐπισκέψηται ... οἰκτειρήσῃ καὶ προσδέξηται
  english_pob_choice: visits again and shows compassion and receives you
  chosen_korean: 다시 찾아오셔서 불쌍히 여기시고 너희를 받아들이실
  alternatives_korean:
  - 다시 돌아오셔서 자비를 베푸시고 너희를 맞아들이실
  - 다시 임하셔서 긍휼히 여기시고 너희를 영접하실
  lexicon: LSJ
  rationale: ‘방문하다’의 성경적 방문 모티프를 ‘찾아오시다’로 자연화하고, 뒤따르는 동사의 구체적 의미를 분리해 살렸습니다.
theological_decisions:
- issue: 본문의 ‘그분 자신’(αὐτός)의 지시 대상이 하나님인지, 앞서 언급된 인물인지가 열려 있습니다.
  chosen_reading: 주본문에서는 지시 대상을 특정하지 않고 ‘그분 자신’으로 남겼습니다.
  alternative_readings:
  - 하나님 자신
  - 앞서 언급된 그 사람
  rationale: 원문이 강제로 하나로 좁히지 않으므로, 한국어 본문도 그 긴장을 보존했습니다.
  doctrine_reference: 텍스트의 모호성은 본문 안에서 유지하고, 주석이 아니라 정문에서 임의로 해소하지 않습니다.
- issue: 중간의 ‘율법을 새롭게 하는 한 사람’ 구절은 전승상 난점과 후대적 확장 가능성이 있습니다.
  chosen_reading: 본문에 포함하여 번역하고, 특별한 설명 없이 주석 표지만 달았습니다.
  alternative_readings:
  - 해당 부분을 삭제
  - 메시아적 의미를 더 분명히 해석
  rationale: 제공된 그리스어 증거를 우선하여, 있는 본문을 투명하게 옮기는 것이 바람직합니다.
  doctrine_reference: 전승이 불안정할 수 있는 곳은 삭제보다 주석적 표기를 통해 드러냅니다.
