  lexicon: LSJ
  rationale: 본문의 문자적 난점을 드러내기 위해 가장 직접적인 의미를 택했고, 해석 가능성은 주석에 남깁니다.
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  english_pob_choice: for a curse and for scattering
  chosen_korean: 저주와 흩어짐을 당하게 될 것입니다
  alternatives_korean:
  - 저주와 분산을 당하게 될 것입니다
  - 저주와 유랑이 될 것입니다
  lexicon: LSJ
  rationale: 명사구를 한국어 문장에서는 결과 진술로 풀어 주어, 예언적 선언의 힘을 살렸습니다.
- source_word: ἐπισκέψηται ... οἰκτειρήσῃ καὶ προσδέξηται
