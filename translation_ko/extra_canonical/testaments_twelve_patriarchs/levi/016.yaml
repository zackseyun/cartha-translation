revisions:
- from: '그리고 이제 나는 너희가 칠십 주 동안 길을 벗어나게 될 것임을 압니다[a]. 너희는 제사장직을 더럽히고 제단들을 더럽힐 것입니다. 또 율법을 버리고, 예언자들의 말을 악한 왜곡 속에서 업신여길 것입니다. 너희는 의로운 사람들을 박해하고 경건한 이들을 미워하며, 참된 이들의 말을 혐오할 것입니다.


    그리고 지극히 높으신 이의 권능 안에서 율법을 새롭게 하는 한 사람을 너희는 속이는 자라고 부를 것이며, 마침내는 그의 키를 알지 못한 채 그를 죽이려고 달려들고, 죄 없는 피를 악함 가운데 너희 머리 위에 떠맡게 될 것입니다.


    그러나 내가 너희에게 말합니다. 그 사람 때문에 너희의 거룩한 곳들은 땅에 이르기까지 황폐하게 될 것입니다. 그리고 너희에게 깨끗한 곳은 남지 않을 것이며, 너희는 땅의 여러 민족들 가운데서 저주와 흩어짐을 당하게 될 것입니다[b]. 그분 자신이 다시 찾아오셔서 불쌍히 여기시고 너희를 받아들이실 때까지입니다.'
  to: '그리고 이제 나는 너희가 칠십 주 동안 미혹을 당할 것임을 안다. 너희는 제사장직을 더럽히고 제단들을 더럽힐 것이다. 또 율법을 버리고 예언자들의 말을 악하게 왜곡하여 업신여길 것이다. 너희는 의로운 사람들을 박해하고 경건한 이들을 미워하며 진실한 이들의 말을 혐오할 것이다.


    너희는 지극히 높으신 이의 권능으로 율법을 새롭게 하는 한 사람을 속이는 자라고 부르고, 마침내 그의 위상을 알지 못한 채 그를 죽이려고 달려들며, 악함 가운데서 무죄한 피를 너희 머리 위에 떠맡을 것이다[a][b][c].


    그러나 내가 너희에게 말한다. 그 사람 때문에 너희의 성소들은 땅바닥까지 황폐해질 것이다. 너희에게 깨끗한 곳은 없을 것이며, 너희는 여러 민족 가운데서 저주와 흩어짐의 대상이 될 것이다. 그 자신이 다시 찾아와 너희를 불쌍히 여기고 받아들일 때까지이다[d].'
  rationale: 번역문을 현대 한국어의 자연스러운 문장으로 다듬되, 수동형의 뉘앙스, 16:3의 전승상 난점, ἀνάστημα의 어휘적 폭, 마지막 αὐτός의 모호성을 보존했습니다. 원문에 없는 ‘땅의’를 삭제했으며, 모든 주석 표지가 실제 주석과 대응하도록 정비했습니다.
