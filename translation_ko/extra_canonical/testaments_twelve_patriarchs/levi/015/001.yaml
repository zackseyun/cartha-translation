revisions:
- from: 그러므로 주님께서 택하실 성전은 너희의 부정함 가운데서 황폐하게 될 것이며, 너희는 모든 민족들로 사로잡혀 갈 것입니다.
  to: 그러므로 주님께서 택하실 성전은 너희의 부정함 가운데서 황폐하게 될 것이며, 너희는 모든 민족에게 포로로 끌려갈 것입니다.
  rationale: 마지막 절만 현대 한국어의 자연스러운 조사 및 포로 귀착 표현으로 바로잡았습니다. ‘부정함 가운데서’는 ἐν의 폭넓은 관계를 보존하여, 이를 단정적으로 인과(‘때문에’)로 좁히지 않았습니다.
  reviewer_model: gpt-5.6-terra
