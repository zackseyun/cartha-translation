review_pass:
  verdict: revise
  source_fidelity: 첫 절과 성전의 황폐 선언은 원문에 충실합니다. 그러나 εἰς πάντα τὰ ἔθνη(‘모든 민족에게/모든 민족들 가운데로’)에 대해 초안의 ‘모든 민족들로 사로잡혀’는 조사 선택상 자연스럽지 않고, 포로로 끌려가는 목적·귀착을 충분히 드러내지 못합니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽습니다. 다만 ‘민족들로 사로잡혀 가다’는 현대 한국어에서 행위 주체 또는 수단처럼 읽힐 수 있어 어색합니다.
  terminology: ναός는 ‘성전’, ἀκαθαρσία는 의례적·도덕적 함의를 보존하는 ‘부정함’, αἰχμάλωτοι는 ‘포로’로 옮기는 것이 적절합니다. κύριος의 ‘주님’도 본문 호칭으로 무난합니다.
  issues:
  - severity: medium
    issue: ‘너희는 모든 민족들로 사로잡혀 갈 것입니다’의 조사와 표현
    rationale: εἰς는 포로로 끌려가는 귀착을 나타냅니다. 한국어 ‘-로 사로잡혀’는 이 용법에 부자연스럽고 의미 관계가 불명확합니다. ‘모든 민족에게 포로로 끌려갈 것입니다’가 원문의 포로 상태와 방향성을 더 명료하게 보존합니다.
  revised_text: 그러므로 주님께서 택하실 성전은 너희의 부정함 가운데서 황폐하게 될 것이며, 너희는 모든 민족에게 포로로 끌려갈 것입니다.
