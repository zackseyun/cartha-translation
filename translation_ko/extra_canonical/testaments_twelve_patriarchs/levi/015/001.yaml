  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness, and you will be taken captive to all the nations.
translation:
  language: ko
  text: 그러므로 주님께서 택하실 성전은 너희의 부정함 가운데서 황폐하게 될 것이며, 너희는 모든 민족들로 사로잡혀 갈 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ναός
  english_pob_choice: the temple
  chosen_korean: 성전
  alternatives_korean:
  - 성막
  - 신전
  lexicon: ναός
  rationale: 예배의 중심 공간을 가리키므로 한국어 성서어법에 맞는 ‘성전’을 택했습니다.
- source_word: ἐκλέξεται κύριος
  english_pob_choice: the Lord will choose
  chosen_korean: 주님께서 택하실
  alternatives_korean:
  - 주님이 선택하실
  - 주님께서 고르실
  lexicon: ἐκλέγομαι
  rationale: 미래의 선택 행위를 자연스럽게 살리면서 ‘택하다’가 본문의 선별·지정 의미를 더 정확히 드러냅니다.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  english_pob_choice: in your uncleanness
  chosen_korean: 너희의 부정함 가운데서
  alternatives_korean:
  - 너희의 더러움 가운데서
  - 너희의 부정함 안에서
  lexicon: ἀκαθαρσία
  rationale: 의례적·도덕적 부정의 상태를 함께 품는 말이므로, 단순한 위생적 ‘더러움’보다 ‘부정함’이 더 적합합니다.
- source_word: αἰχμάλωτοι ἔσεσθε
  english_pob_choice: you will be taken captive
  chosen_korean: 사로잡혀 갈 것입니다
  alternatives_korean:
  - 포로가 될 것입니다
  - 붙잡혀 갈 것입니다
  lexicon: αἰχμάλωτος
  rationale: 행위의 결과인 포로 신세를 한국어에서 자연스럽게 표현하는 동태형으로 옮겼습니다.
theological_decisions:
- issue: 야훼/주님 표기 문제
  chosen_reading: 본문의 κύριος를 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 LXX 인용이 아니라 직접적인 그리스어 본문이므로, 본문 자체의 호칭을 따라 ‘주님’으로 유지했습니다.
  doctrine_reference: 호칭 번역 일관성
