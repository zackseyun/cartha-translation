  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ πάντες οἱ μισοῦντες¹⁴ ὑμᾶς *χαρήσονται ἐπὶ τῇ ἀπωλείᾳ¹⁵ ὑμῶν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/003.yaml
  text: And all who hate you will rejoice over your destruction.
translation:
  language: ko
  text: 그리고 너희를 미워하는 모든 사람은 너희의 멸망을 두고 기뻐할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισοῦντες
  english_pob_choice: who hate you
  chosen_korean: 너희를 미워하는
  alternatives_korean:
  - 너희를 증오하는
  - 너희를 싫어하는
  lexicon: μισέω
  rationale: 현재 분사형은 지속적 성격을 나타내므로, 관계절로 풀어 ‘미워하는’이라고 옮겨 원문의 반복적 적대감을 살렸습니다.
- source_word: χαρήσονται
  english_pob_choice: will rejoice
  chosen_korean: 기뻐할 것입니다
  alternatives_korean:
  - 즐거워할 것입니다
  - 환호할 것입니다
  lexicon: χαίρω
  rationale: 미래 중간태의 반응을 자연스러운 현대어 미래 표현으로 옮기되, 단순한 내적 기쁨을 넘어선 공개적 반응까지 과장하지 않도록 했습니다.
- source_word: ἐπὶ τῇ ἀπωλείᾳ ὑμῶν
  english_pob_choice: over your destruction
  chosen_korean: 너희의 멸망을 보고
  alternatives_korean:
  - 너희의 멸망 때문에
  - 너희의 파멸 위에서
  lexicon: ἀπώλεια
  rationale: ἐπί + 여격은 ‘~에 대하여/위에서’의 방향성을 가지지만, 한국어에서는 기쁨의 대상이 되는 사건을 자연스럽게 드러내는 ‘보고 기뻐하다’로 풀어 원문의 조롱성 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘destruction’의 한국어 강도
  chosen_reading: 멸망
  alternative_readings:
  - 파멸
  - 멸절
  rationale: ἀπώλεια의 결과적·종말론적 파괴성을 반영하기 위해, 완곡한 ‘손해/패배’가 아니라 강한 어휘인 ‘멸망’을 택했습니다.
  doctrine_reference: 종말론적 심판과 의인/악인의 대조를 드러내는 문맥 보존
