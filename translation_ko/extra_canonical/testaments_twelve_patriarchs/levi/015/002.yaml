id: T12P.LEV.15.2
reference: Testament of Levi 15:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *ἔσεσθε βδέλυγμα⁹ αὐτοῖς¹⁰, καὶ λήψεσθε¹¹ ὄνειδος¹² καὶ αἰσχύνην αἰώνιον παρὰ *τῆς δικαιοκρισίας¹³ τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/002.yaml
  text: And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God.
translation:
  language: ko
  text: 그러면 그들에게는 가증스러운 존재가 될 것이며, 여러분은 하나님의 의로운 심판으로부터 모욕과 영원한 수치를 받게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βδέλυγμα
  english_pob_choice: an abomination
  chosen_korean: 가증스러운 존재
  alternatives_korean:
  - 가증한 것
  - 혐오스러운 존재
  - 가증거리
  lexicon: βδέλυγμα
  rationale: 사람을 향한 규정이므로 사물처럼 들리는 ‘가증한 것’보다, 공동체가 혐오의 대상으로 보는 상태를 드러내는 ‘가증스러운 존재’가 문맥에 맞습니다.
- source_word: ὄνειδος
  english_pob_choice: reproach
  chosen_korean: 모욕
  alternatives_korean:
  - 치욕
  - 수치
  - 책망
  lexicon: ὄνειδος
  rationale: 단순한 내적 부끄러움보다 외부에서 가해지는 수치 부과를 강조하기 위해 ‘모욕’으로 옮겼습니다.
- source_word: αἰσχύνην αἰώνιον
  english_pob_choice: everlasting shame
  chosen_korean: 영원한 수치
  alternatives_korean:
  - 영원한 부끄러움
  - 영구한 치욕
  lexicon: αἰσχύνη
  rationale: 한국어에서 ‘수치’가 공적이고 지속적인 disgrace를 가장 직접적으로 전달하며, ‘영원한’이 지속성을 분명히 합니다.
- source_word: δικαιοκρισίας τοῦ Θεοῦ
  english_pob_choice: the righteous judgment of God
  chosen_korean: 하나님의 의로운 심판
  alternatives_korean:
  - 하나님의 공의로운 심판
  - 하나님의 의의 심판
  lexicon: δικαιοκρισία
  rationale: 합성어가 지닌 ‘의로우면서도 판단하는 행위’의 의미를 살려, 관용적인 ‘의로운 심판’으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 문장의 주어 지시를 한국어에서 어떻게 처리할지
  chosen_reading: 앞부분의 ‘여러분은’으로 2인칭 복수를 분명히 하고, 뒤 문장도 동일한 대상에게 이어지도록 유지했습니다.
  alternative_readings:
  - ‘너희는’
  - 주어를 생략한 서술형
  rationale: 본절은 공동체 전체를 향한 직접 경고이므로, 합쇼체 문맥에서 ‘여러분은’이 가장 자연스럽고 명료합니다.
  doctrine_reference: 수신자 직접 경고의 수사
