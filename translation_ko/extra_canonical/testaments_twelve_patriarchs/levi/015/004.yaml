review_pass:
  verdict: revise
  source_fidelity: διὰ + 인명은 여기서 ‘~을 통하여/때문에’라는 근거를 나타내며, 초안의 ‘~을 위하여서’는 목적·수혜의 뜻으로 기울어 원문의 관계를 정확히 반영하지 못합니다. 또한 σπέρμα는 집합적으로 ‘후손’을 뜻하므로 ‘씨에서 한 사람’보다 자연스러운 한국어 표현으로 옮길 수 있습니다. 강한 부정 οὐ μή와 미래 수동태의 뜻은 유지했습니다.
  naturalness: ‘아브라함과 이삭과 야곱, 곧 우리 조상들을 위하여서가 아니면’은 조사와 조건 표현이 부자연스럽습니다. ‘우리 조상인 아브라함과 이삭과 야곱 때문이 아니었다면’이 현대 표준어 합쇼체 문맥에서 명료하고 자연스럽습니다.
  terminology: ἔλεος는 ‘자비’로 적절합니다. ‘우리 조상’은 πατέρων ἡμῶν의 문맥상 자연스럽고, σπέρμα는 이 대목에서 ‘후손’으로 번역하는 것이 혈통 집단을 가리키는 뜻을 정확하고 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: δι᾽의 의미를 ‘위하여서’로 옮김
    rationale: διὰ + 대격은 이 문맥에서 족장들이 자비의 근거·매개임을 나타냅니다. ‘위하여서’는 ‘그들을 위해’라는 목적 또는 수혜 의미를 만들어 내므로 ‘때문에’로 고쳐야 합니다.
  - severity: low
    issue: ‘여러분의 씨에서 한 사람’이라는 표현
    rationale: 원문의 σπέρμα는 집합적 혈통·후손을 가리킵니다. ‘여러분의 후손 가운데 한 사람도’가 현대 한국어에서 더 자연스럽고 의미도 정확합니다.
  revised_text: 우리 조상인 아브라함과 이삭과 야곱 때문이 아니었다면, 여러분은 자비를 받지 못할 것이며, 여러분의 후손 가운데 한 사람도 땅 위에 남지 않을 것입니다.
