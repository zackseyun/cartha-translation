base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/004.yaml
  text: And if it were not for Abraham and Isaac and Jacob, our fathers, you would receive no mercy; not one of your seed would be left on the earth.
translation:
  language: ko
  text: 우리 조상인 아브라함과 이삭과 야곱 때문이 아니었다면, 여러분은 자비를 받지 못할 것이며, 여러분의 후손 가운데 한 사람도 땅 위에 남지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  english_pob_choice: for Abraham and Isaac and Jacob, our fathers
  chosen_korean: 아브라함과 이삭과 야곱, 곧 우리 조상들을 위하여서가 아니면
  alternatives_korean:
  - 아브라함과 이삭과 야곱, 우리 조상들을 위하여서가 아니면
  - 아브라함과 이삭과 야곱 때문에가 아니면
  lexicon: διά + 목적격
  rationale: διὰ + 인물을 원인/중개로 삼는 뜻을 살려 ‘위하여서가 아니면’으로 옮기고, ‘our fathers’를 동격 설명인 ‘곧 우리 조상들’로 풀어 원문의 호명 구조를 분명히 했습니다.
- source_word: ἔλεος λήψεσθε
  english_pob_choice: you would receive no mercy
  chosen_korean: 자비를 받지 못할 것이며
  alternatives_korean:
  - 긍휼을 받지 못할 것이며
  - 자비를 입지 못할 것이며
  lexicon: ἔλεος
  rationale: ἔλεος의 기본 의미를 ‘자비’로 두되, ‘받다’와 결합해 수동적 수혜를 자연스럽게 살렸습니다.
- source_word: εἷς ἐκ τοῦ σπέρματος ὑμῶν οὐ μὴ καταλειφθῇ ἐπὶ τῆς γῆς
  english_pob_choice: not one of your seed would be left on the earth
  chosen_korean: 여러분의 씨에서 한 사람도 땅 위에 남지 않을 것입니다
  alternatives_korean:
  - 여러분의 씨에서 하나도 땅 위에 남지 않을 것입니다
  - 여러분의 후손 가운데 한 사람도 땅 위에 남지 않을 것입니다
  lexicon: σπέρμα
  rationale: σπέρμα를 직역적으로 ‘씨’로 유지해 혈통/자손의 집합적 이미지를 보존했고, 부정어구 οὐ μὴ의 강한 부정을 ‘한 사람도 … 남지 않을 것입니다’로 분명히 했습니다.
theological_decisions:
- issue: 아브라함, 이삭, 야곱의 중보/언약 근거를 어떻게 드러낼 것인지
  chosen_reading: 세 족장을 자비를 받는 근거로 제시하는 문맥을 그대로 유지했습니다.
  alternative_readings:
  - 단순한 역사적 언급으로 완화하는 번역
  - ‘조상들 덕분에’처럼 인과를 약화하는 번역
  rationale: 본문은 자비가 족장들과의 관계에 근거함을 직접 말하므로, 이 신학적 긴장을 약화하지 않고 원문 인과를 드러냈습니다.
  doctrine_reference: 언약적 자비/족장 전승
