base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010.yaml
  text: 1[v2]. And now, children, keep what I command you, since I have declared to you all that I heard from my fathers. 2[v2]. And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils from the Lord against him. 3. And you will act lawlessly in Israel, so that Jerusalem will not be able to bear it because of your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame. 4. And you will be scattered as captives among the nations, and there you will be for reproach and for a curse. 5. For the house which the Lord will choose shall be called Jerusalem[v5][v3], as the book of Enoch the righteous contains.
  footnotes:
  - marker: v2
    text: The words 'against the Savior of the world, the Messiah' are present in the Greek witness used here but are often regarded by scholars as a later Christian expansion; they are therefore retained in brackets.
    reason: textual_variant
  - marker: v2
    text: The clause 'stirring up great evils from the Lord against him' is syntactically difficult. The pronoun may be understood differently by interpreters.
    reason: alternative_reading
  - marker: v3
    text: Or 'curtain' for 'veil.' The image is the inner temple hanging.
    reason: lexical_alternative
  - marker: v5
    text: Reference to Enoch reflects the broader Second Temple literary world in which authoritative ancestral books could be cited outside the later biblical canon.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이제, 자녀들아, 내가 너희에게 명하는 것을 지키십시오. 내가 내 조상들에게서 들은 모든 것을 너희에게 알려 주었기 때문입니다. 2. 보십시오, 나는 너희의 불경과 범죄에 대하여 무죄입니다. 너희가 시대의 끝에 저지를 그것들, 곧 [세상의 구원자, 메시아]에 대해 이스라엘을 그릇 인도하고 그에게 대하여 주님으로부터 큰 악들을 일으킬 그 일들에 대하여 그렇습니다. 3. 너희는 이스라엘 가운데서 불법을 행할 것이므로, 너희의 악함 때문에 예루살렘이 그것을 더는 감당하지 못할 것입니다. 그러나 성전 휘장은 찢어질 것이어서 너희의 수치를 더 이상 가리지 못할 것입니다. 4. 너희는 포로로서 나라들 가운데 흩어질 것이며, 그곳에서 수치와 저주가 될 것입니다. 5. 주님께서 택하실 집은 예루살렘이라 불릴 것이니, 의로운 에녹의 책에 기록된 것과 같습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  english_pob_choice: keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - keep
  - 간직하십시오
  - 보존하십시오
  lexicon: LSJ
  rationale: 명령형으로서 단순 보유가 아니라 순종적 준수를 나타내야 하므로 ‘지키다’가 가장 자연스럽고 문맥에 맞습니다.
- source_word: ἀθῷός εἰμι
  english_pob_choice: I am innocent
  chosen_korean: 무죄입니다
  alternatives_korean:
  - 죄가 없습니다
  - 결백합니다
  - 무고합니다
  lexicon: LSJ
  rationale: 예언적 변론 맥락에서 책임 부인을 분명히 하며, ‘무죄’가 도덕적·법적 책임 없음까지 가장 간결하게 드러냅니다.
- source_word: συντέλεια τῶν αἰώνων
  english_pob_choice: the consummation of the ages
  chosen_korean: 시대의 끝
  alternatives_korean:
  - 세대들의 종말
  - 세상의 끝
  - 시대들의 완성
  lexicon: LSJ
  rationale: 종말론적 어감을 살리되, 한국어에서 과도하게 해석을 좁히지 않는 표현으로 옮겼습니다.
- source_word: καταπέτασμα
  english_pob_choice: veil
  chosen_korean: 성전 휘장
  alternatives_korean:
  - 장막
  - 휘장
  - 커튼
  lexicon: LSJ
  rationale: 문맥이 성전 내부의 휘장을 가리키므로, 단순한 ‘휘장’보다 ‘성전 휘장’이 이미지와 대상을 더 분명히 합니다.
- source_word: διασπαρήσεσθε αἰχμάλωτοι
  english_pob_choice: you will be scattered as captives
  chosen_korean: 포로로서 흩어질
  alternatives_korean:
  - 포로가 되어 흩어질
  - 포로로 분산될
  - 포로로 흩어질
  lexicon: LSJ
  rationale: ‘흩어지다’와 ‘포로’의 이중 이미지를 함께 살려, 포로 상태의 추방과 분산을 모두 드러냅니다.
theological_decisions:
- issue: 브래킷된 ‘세상의 구원자, 메시아’ 구절 처리
  chosen_reading: 본문에는 유지하되 대괄호로 표기했습니다.
  alternative_readings:
  - 본문에서 삭제
  - 괄호 없이 완전한 본문으로 통합
  rationale: 그리스어 증거에 존재하는 표현이지만 후기 기독교적 확장으로 의심되므로, 본문성은 인정하되 확실성은 낮다는 점을 대괄호로 반영했습니다.
  doctrine_reference: 원문 증거 우선과 전승 비평의 투명성
- issue: ‘주님으로부터 큰 악들을 일으킬’의 난해한 대목
  chosen_reading: 원문의 난점을 평탄화하지 않고 그대로 반영했습니다.
  alternative_readings:
  - 너희에게 큰 재앙을 불러올
  - 그에게 큰 악을 일으킬
  - 너희를 향해 큰 악을 일으킬
  rationale: 대명사 지시와 인과 관계가 애매하므로, 해석을 과도하게 확정하지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 텍스트의 난해함을 번역에서 숨기지 않기
