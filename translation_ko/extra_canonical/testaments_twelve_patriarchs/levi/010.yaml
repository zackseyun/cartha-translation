    issue: 2절의 관계절과 분사구문이 비문에 가깝게 번역됨
    rationale: ‘너희가 시대의 끝에 저지를 그것들’ 및 ‘그 일들에 대하여 그렇습니다’는 ἣν ποιήσετε 이하가 수식하는 ‘불경과 범법’을 적절히 받지 못하며, 원문의 행위 연결도 흐립니다.
  - severity: medium
    issue: 2절 ‘그에게 대하여 주님으로부터 큰 악들을 일으킬’의 한국어 결속 불명확
    rationale: ἐπ’ αὐτόν의 대명사 지시를 확정해서는 안 되지만, 현 번역은 문법적 관계까지 불명확합니다. ‘그를 향해 주님에게서 큰 재앙들을 불러일으키며’로 직역적 긴장을 유지할 수 있습니다.
  - severity: medium
    issue: 5절 ‘의로운 에녹의 책에 기록된 것’은 περιέχει의 뜻을 축소함
    rationale: 주어는 ‘에녹의 책’이며 περιέχει는 ‘담고 있다/포함하고 있다’입니다.
