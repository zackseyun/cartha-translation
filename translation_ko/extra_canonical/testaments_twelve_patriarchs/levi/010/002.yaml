id: T12P.LEV.10.2
reference: Testament of Levi 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ΓΚαὶ ἰδοὺ⁴⁾ ἀθῷός εἰμι⁵ τῆς⁶ ἀσεβείας⁷ ὑμῶν⁸ *καὶ παραβάσεως⁹ ἣν ποιήσετε ἐπὶ *τῇ συντελείᾳ¹⁰ *τῶν αἰώνων¹¹ [εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν]¹² *πλανῶντες τὸν Ἰσραήλ¹³, καὶ ἐπεγείροντες¹⁴ *ἐπ᾿ αὐτὸν¹⁵ κακὰ μεγάλα¹⁶ *παρὰ Κυρίου¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/002.yaml
  text: And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils against him from the Lord.
translation:
  language: ko
  text: 보십시오, 나는 여러분의 불경함과, 세상 끝에 여러분이 저지를 그 범법에 대해 무죄입니다[주1] — [세상의] 구원자, 메시아를 두고 이스라엘을 미혹하며 그에게 큰 악을 일으키는 일입니다[주2].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이것을 보십시오
  lexicon: ἰδού
  rationale: 서술의 주의를 끄는 감탄사를 현대 합쇼체로 자연스럽게 옮기되, 고어적 울림은 피했습니다.
- source_word: ἀθῷός εἰμι τῆς ἀσεβείας ὑμῶν καὶ παραβάσεως
  english_pob_choice: I am innocent of your ungodliness and transgression
  chosen_korean: 나는 여러분의 불경함과 ... 범법에 대해 무죄입니다
  alternatives_korean:
  - 나는 여러분의 불경함과 ... 범법에서 결백합니다
  - 나는 여러분의 경건치 않음과 ... 허물에 대해 무죄입니다
  lexicon: ἀθῷος / ἀσέβεια / παράβασις
  rationale: ἀθῷός는 법정적 무죄 진술이므로 ‘무죄입니다’로, ἀσέβεια는 단순 ‘불경건’보다 하나님에 대한 불경을 드러내는 ‘불경함’으로, παράβασις는 율법/경계 위반의 ‘범법’으로 옮겼습니다.
- source_word: εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν
  english_pob_choice: '[against the Savior of the world, the Messiah]'
  chosen_korean: '[세상의] 구원자, 메시아를 두고'
  alternatives_korean:
  - '[세상의] 구원자, 메시아에 대하여'
  - '[세상의] 구원자, 그 메시아를 향하여'
  lexicon: σωτήρ / χριστός
  rationale: 구두점에 맞춰 삽입구를 괄호로 처리하고, χριστός는 이 문맥의 칭호로서 프로젝트 기본어인 ‘메시아’를 유지했습니다.
- source_word: πλανῶντες τὸν Ἰσραήλ
  english_pob_choice: misleading Israel
  chosen_korean: 이스라엘을 미혹하며
  alternatives_korean:
  - 이스라엘을 속이며
  - 이스라엘을 유혹하며
  lexicon: πλανάω
  rationale: πλανῶντες는 단순 속임보다 ‘길에서 벗어나게 하는’ 의미가 강해, 한국어 성서 어법에 맞는 ‘미혹하다’를 택했습니다.
- source_word: ἐπεγείροντες ἐπ᾿ αὐτὸν κακὰ μεγάλα παρὰ Κυρίου
  english_pob_choice: stirring up great evils against him from the Lord
  chosen_korean: 그에게 큰 악을 일으키는 일입니다
  alternatives_korean:
  - 주님께로부터 그에게 큰 재앙을 일으키는 일입니다
  - 주님에게서 나온 큰 악을 그에게 불러일으키는 일입니다
  lexicon: ἐπεγείρω / κακὰ μεγάλα / παρὰ Κυρίου
  rationale: 수정된 영어 audit trail처럼 ‘against him’은 ‘큰 악을 일으키는’에 붙여 자연스럽게 처리했고, παρὰ Κυρίου는 문맥상 악의 근원이 아니라 ‘주님으로부터/주님께서 허락하신’ 배경을 암시할 수 있어 본문만으로는 과잉해석하지 않고 간결하게 남겼습니다.
theological_decisions:
- issue: χριστός의 번역어 유지
  chosen_reading: 메시아
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: 이 문헌의 서술적·종말론적 칭호로 쓰인 χριστός는 프로젝트 기본어를 따라 ‘메시아’로 유지해 독자가 칭호성을 바로 인식하게 했습니다.
  doctrine_reference: terminology_policy
- issue: παρὰ Κυρίου의 신학적 방향성
  chosen_reading: 직역을 완화하여 본문에는 명시적 원인구를 덧붙이지 않음
  alternative_readings:
  - 주님으로부터
  - 주님께서 주신
  - 주님을 통하여
  rationale: 그리스어 전치사구는 악의 기원을 단정하기보다 배경/출처를 가리킬 수 있으므로, 한국어 본문에서는 의미를 과도하게 확정하지 않고 절제했습니다.
  doctrine_reference: source_humility
