source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ τανῦν¹ φυλάξατε² *ὅσα ἐγὼ ἐντέλλομαι ὑμῖν, τέκνα, ἐπειδὴ ὅσα ἐγὼ ἤκουσα παρὰ τῶν πατέρων μου Γἀνήγγειλα ὑμῖν³⁾.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/001.yaml
  text: And now, children, keep what I command you, since I have declared to you all that I heard from my fathers.
translation:
  language: ko
  text: 그리고 이제, 자녀들아, 내가 너희에게 명하는 것을 지키십시오. 이는 내가 내 조상들에게서 들은 모든 것을 너희에게 전했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τανῦν
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그리고 지금
  lexicon: και + temporal adverb
  rationale: 접속사와 시간 부사를 자연스럽게 살려 담화 전환을 표시하되, 본문의 직접 호소를 흐리지 않도록 간결하게 옮겼습니다.
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 아이들아
  - 자녀들이여
  lexicon: τέκνα
  rationale: 직접 호격으로 부르는 뉘앙스를 살리면서도, 문어체 합쇼체 문맥에서 가장 자연스러운 호칭으로 옮겼습니다.
- source_word: φυλάξατε
  english_pob_choice: keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 간직하십시오
  - 지켜 두십시오
  lexicon: φυλάσσω
  rationale: 단순 보관보다 ‘명령을 지켜 행하다’는 순종의 의미가 본문에 더 잘 맞아, 윤리적·언약적 뉘앙스를 살렸습니다.
- source_word: ὅσα ἐγὼ ἐντέλλομαι ὑμῖν
  english_pob_choice: what I command you
  chosen_korean: 내가 너희에게 명하는 것
  alternatives_korean:
  - 내가 너희에게 명령하는 것
  - 내가 너희에게 명하는 모든 것
  lexicon: ἐντέλλομαι
  rationale: 현재형 명령 행위를 드러내되, 한국어에서는 과도한 중복을 피하고 본문의 범위를 자연스럽게 표현했습니다.
- source_word: ὅσα ἐγὼ ἤκουσα παρὰ τῶν πατέρων μου
  english_pob_choice: all that I heard from my fathers
  chosen_korean: 내 아버지들에게서 들은 모든 것
  alternatives_korean:
  - 내 조상들에게서 들은 모든 것
  - 내 아버지들에게서 들은 것 모두
  lexicon: πατέρες
  rationale: πατέρες를 문맥에 따라 ‘아버지들’로 직역해, 전승의 계보를 분명히 드러냈습니다. 여기서는 단순한 ‘조상들’보다 원문 친화성이 높습니다.
theological_decisions:
- issue: 전승의 권위와 전달 구조
  chosen_reading: 화자는 자신이 들은 전승 전체를 자녀들에게 그대로 전하는 형태로 옮겼습니다.
  alternative_readings:
  - 내가 아버지들의 가르침을 전했다
  - 내가 전해 들은 것을 너희에게 말했다
  rationale: 본문은 개인적 견해가 아니라 수용한 전승의 전달을 강조하므로, ‘들은 모든 것’과 ‘전했습니다’를 함께 살려 계승 구조를 보존했습니다.
  doctrine_reference: 전승-권위 구조
