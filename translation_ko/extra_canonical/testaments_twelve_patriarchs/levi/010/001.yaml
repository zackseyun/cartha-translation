  source_fidelity: 초안은 명령(φυλάξατε), 전승의 내용 전체(ὅσα), 과거의 전달(ἀνήγγειλα)을 대체로 충실히 반영합니다. 다만 ἐπειδή의 인과 관계가 두 독립문으로 분리되어 사라졌으므로 명시해야 합니다. 또한 παρὰ τῶν πατέρων μου의 복수 표현은 여기서 전승의 선대 계보를 가리키므로 한국어에서는 ‘조상들’이 자연스럽고 의미상 정확합니다.
  naturalness: ‘내 아버지들에게서’는 표준 한국어에서 부자연스럽고, 복수의 생물학적 아버지라는 오해를 낳습니다. 인과절을 ‘이는 … 때문입니다’로 연결하면 현대 문어 합쇼체로도 자연스럽습니다.
  terminology: ‘자녀들아’, ‘명하는 것을 지키십시오’, ‘전했습니다’는 본문의 호격, 명령 준수, 전승 전달을 적절히 반영합니다. ‘조상들’은 이 문맥의 πατέρες(선대/조상)를 자연스럽게 옮긴 것입니다.
  issues:
