  - severity: medium
    issue: ‘내 아버지들에게서’가 부자연스럽고 문맥상 오해를 부를 수 있습니다.
    rationale: 복수 πατέρες는 이 전승 문맥에서 선대 조상들을 뜻합니다. ‘내 조상들에게서’가 현대 표준어에서 자연스럽고 전승 계보의 뜻을 보존합니다.
