revisions:
- from: 주님께서 선택하실 집은 예루살렘이라 불릴 것입니다. 의인의 에녹서에 기록된 바와 같습니다. 그리고 저주를 위한 것입니다.[a][b]
  to: 주님께서 택하실 집은 예루살렘이라 불릴 것입니다. 이는 의인 에녹의 책에 담겨 있는 바와 같습니다.
  rationale: 현행 그리스어 대조 본문에 충실하도록 원문에 없는 결말을 삭제하고, 그에 연동된 무근거 각주 표지도 제거했습니다. ‘의인 에녹의 책’과 ‘담겨 있는 바’는 ἡ βίβλος Ἐνὼχ τοῦ δικαίου 및 περιέχει의 의미와 문장 관계를 자연스러운 현대 한국어로 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:04Z'
review_pass:
  verdict: revise
  source_fidelity: 현 제시된 그리스어 본문은 Ὁ γὰρ οἶκος … Ἐνὼχ τοῦ δικαίου까지만이며, 초안의 “그리고 저주를 위한 것입니다”에 해당하는 καὶ εἰς κατάραν은 포함되어 있지 않습니다. 따라서 영어 감사 이력의 추가 문구를 따라 이를 번역문에 넣으면 이 과업에 제시된 원어 본문에 대한 첨가가 됩니다.
  naturalness: “의인의 에녹서에 기록된 바와 같습니다”도 이해되지만, βίβλος Ἐνὼχ τοῦ δικαίου의 소유·동격 관계는 “의인 에녹의 책”으로 밝히는 편이 자연스럽습니다. 또한 원문의 περιέχει(‘담고 있다’)는 ‘담겨 있는’으로 무리 없이 반영할 수 있습니다.
  terminology: Κύριος를 “주님”으로, Ἱερουσαλήμ을 “예루살렘”으로 옮긴 것은 적절합니다. οἶκος는 본문 자체가 건물·성전·가문 중 어느 뜻인지 더 특정하지 않으므로 “집”을 유지합니다. Ἐνὼχ τοῦ δικαίου는 통상적 명칭을 존중하여 “의인 에녹”으로 옮깁니다.
  issues:
  - severity: high
    issue: 원어 본문에 없는 ‘그리고 저주를 위한 것입니다’의 첨가
    rationale: 제시된 Greek source에는 καὶ εἰς κατάραν이 없습니다. 최신 영어 개정 이력은 상충하는 별도 전승 또는 이전 원문 상태를 반영한 것으로 보이나, 현 과업의 원어 대조본을 우선해야 합니다.
  - severity: medium
    issue: 근거 없는 각주 표지 [a][b]
    rationale: 번역문에 각주 표지만 있고 제공된 각주 내용이나 원어상의 대응 근거가 없습니다. 표지를 제거해야 구조적으로 완결됩니다.
  revised_text: 주님께서 택하실 집은 예루살렘이라 불릴 것입니다. 이는 의인 에녹의 책에 담겨 있는 바와 같습니다.
