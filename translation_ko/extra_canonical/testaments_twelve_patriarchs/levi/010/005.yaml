source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ γὰρ οἶκος, ὃν ἂν³⁴ ἐκλέξεται³⁵ Κύριος³⁶, *Ἱερουσαλὴμ κληθήσεται³⁷, καθὼς *περιέχει ἡ βίβλος³⁸ Ἐνὼχ τοῦ δικαίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/005.yaml
  text: For the house that the Lord will choose shall be called Jerusalem, as the book of Enoch the righteous contains.
translation:
  language: ko
  text: 주님께서 택하실 집은 예루살렘이라 불릴 것입니다. 이는 의인 에녹의 책에 담겨 있는 바와 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 주
  lexicon: κύριος
  rationale: 문맥상 여호와/주를 가리키는 호칭이므로 한국어 공경 표현인 ‘주님’으로 옮겨, 예언적 선언의 직접성을 살렸습니다.
- source_word: ἐκλέξεται
  english_pob_choice: will choose
  chosen_korean: 선택하실
  alternatives_korean:
  - 택하실
  - 고르실
  lexicon: ἐκλέγω
  rationale: 미래의 선택 행위를 자연스럽고 격식 있게 살리기 위해 ‘선택하실’로 옮겼습니다.
- source_word: Ἱερουσαλὴμ κληθήσεται
  english_pob_choice: shall be called Jerusalem
  chosen_korean: 예루살렘이라 불릴 것입니다
  alternatives_korean:
  - 예루살렘이라 일컬어질 것입니다
  - 예루살렘이라 칭해질 것입니다
  lexicon: καλέω
  rationale: 수동적 명명 표현을 한국어의 자연스러운 공적 문체로 재현했습니다.
- source_word: καθὼς περιέχει ἡ βίβλος Ἐνὼχ τοῦ δικαίου
  english_pob_choice: as the book of Enoch the righteous contains
  chosen_korean: 의인의 에녹서에 기록된 바와 같습니다
  alternatives_korean:
  - 의인 에녹의 책에 담긴 바와 같습니다
  - 의로운 에녹의 책에 기록된 대로입니다
  lexicon: περιέχω / ἡ βίβλος
  rationale: 직역하면 ‘담고 있다’이지만 한국어에서는 문헌 인용 관용구인 ‘기록된 바’가 가장 자연스럽고, ‘에녹서’로 책 제목을 분명히 했습니다.
- source_word: καὶ εἰς κατάραν
  english_pob_choice: and for a curse
  chosen_korean: 그리고 저주를 위한 것입니다
  alternatives_korean:
  - 그리고 저주가 될 것입니다
  - 저주에 이르게 할 것입니다
  lexicon: κατάρα
  rationale: 추가된 결말 구절을 누락하지 않되, 목적/귀결의 방향성을 살려 ‘~를 위한 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와 호칭을 한국어에서 어떻게 드러낼지
  chosen_reading: 본문의 Κύριος는 예루살렘 선택을 행하시는 주님으로 보아 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 직접적인 LXX 인용 표지가 없고, 문맥상 신적 호칭을 존중하면서도 합쇼체 본문에 자연스럽게 맞추기 위해 ‘주님’을 선택했습니다.
  doctrine_reference: 신명기적/예언적 주권 호칭
