id: T12P.LEV.10.3
reference: Testament of Levi 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνομήσετε¹⁸ *ἐν τῷ¹⁹ Ἰσραήλ²⁰, ὥστε μὴ βαστάζειν²¹ τὴν²² Ἱερουσαλήμ²³ ἀπὸ προσώπου τῆς²⁴ πονηρίας ὑμῶν, ἀλλὰ σχισθήσεται²⁵ τὸ καταπέτασμα²⁶ τοῦ ναοῦ, ὥστε μὴ καλύψαι²⁷ τὴν²⁸ ἀσχημοσύνην ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/003.yaml
  text: And you will act lawlessly in Israel, so that Jerusalem will not be able to bear your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame.
translation:
  language: ko
  text: 그리고 너희는 이스라엘에서 불법을 행하여, 너희의 악함 때문에 예루살렘이 너희를 감당하지 못하게 될 것이며, 그러나 성전의 휘장이 찢어져 더 이상 너희의 수치를 가리지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομήσετε
  english_pob_choice: you will act lawlessly
  chosen_korean: 불법을 행하다
  alternatives_korean:
  - 법 없이 행하다
  - 율법을 어기다
  - 악을 행하다
  lexicon: ἀνομέω
  rationale: 형태상 ‘법/율법을 벗어난 행위’라는 핵심을 살리되, 문맥상 도덕적 반역을 함께 드러내는 표준적인 ‘불법을 행하다’를 택했습니다.
- source_word: βαστάζειν τὴν Ἱερουσαλήμ ἀπὸ προσώπου τῆς πονηρίας ὑμῶν
  english_pob_choice: Jerusalem will not be able to bear your wickedness
  chosen_korean: 예루살렘이 너희를 감당하지 못하다
  alternatives_korean:
  - 예루살렘이 너희의 악함을 견디지 못하다
  - 예루살렘이 너희의 악함을 짊어지지 못하다
  - 예루살렘이 너희의 악함을 받아내지 못하다
  lexicon: βαστάζω
  rationale: POB의 개정 취지대로 ‘bear’의 감당/견딤 의미를 살려, ‘너희의 악함’이 예루살렘 앞에 놓인 부담이라는 점을 한국어 동사 ‘감당하다’로 자연스럽게 옮겼습니다.
- source_word: καταπέτασμα τοῦ ναοῦ
  english_pob_choice: the veil of the temple
  chosen_korean: 성전의 휘장
  alternatives_korean:
  - 성전의 장막
  - 성전 휘장
  - 성소의 휘장
  lexicon: καταπέτασμα
  rationale: 성전 내부의 분리막을 가리키는 표준적 한국어인 ‘휘장’을 사용해, 단순한 천막이 아니라 예배 공간의 경계라는 점을 분명히 했습니다.
- source_word: ἀσχημοσύνην ὑμῶν
  english_pob_choice: your shame
  chosen_korean: 너희의 수치
  alternatives_korean:
  - 너희의 부끄러움
  - 너희의 치욕
  - 너희의 수치스러움
  lexicon: ἀσχημοσύνη
  rationale: 직접적인 신체적/도덕적 ‘수치’의 의미를 유지하기 위해 ‘수치’를 택했고, 문맥상 휘장이 더 이상 그것을 가리지 못한다는 대비를 살렸습니다.
theological_decisions:
- issue: 예루살렘이 감당하지 못하는 대상의 표현
  chosen_reading: ‘너희의 악함 때문에’라는 원인절을 유지하되, ‘감당하지 못하다’로 도시가 윤리적 오염과 심판을 더 이상 떠안지 못한다는 긴장을 드러냈습니다.
  alternative_readings:
  - ‘너희의 악함을 견디지 못하다’
  - ‘너희의 악함 때문에 무너지다’
  rationale: 본문의 ἀπὸ προσώπου τῆς πονηρίας ὑμῶν는 단순한 정서적 ‘견딤’보다, 죄가 공동체와 성소 질서를 압박하는 심판적 상황을 암시하므로 이를 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: 성전 정결과 심판의 예언적 이미지
- issue: 성전 휘장이 찢어지는 의미
  chosen_reading: 휘장의 파열을 단순한 장식 훼손이 아니라, 더 이상 수치를 가려 주지 못하는 심판적 노출로 번역했습니다.
  alternative_readings:
  - ‘휘장이 찢어질 것이다’만을 강조
  - ‘성전이 열릴 것이다’로 완화
  rationale: 문맥은 공개적 노출과 수치의 드러남을 강조하므로, ‘가리지 못할 것입니다’까지 붙여 결과를 분명히 했습니다.
  doctrine_reference: 성소/성전 상징과 심판
