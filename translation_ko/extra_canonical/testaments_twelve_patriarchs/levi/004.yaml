base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004.yaml
  text: '1. Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are being split, and the sun is being extinguished, and waters are drying up, and fire is cowering, and all creation is being shaken, and the invisible spirits are melting away, and Hades is being plundered at the suffering of the Most High, men will persist in disobedience and remain in their injustices. Therefore they will be judged with a greater punishment.


    2. Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister of his presence.


    3. You shall shine forth the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.


    4. And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son forever.


    5. And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.


    6. For those who bless him will be blessed, and those who curse him will perish.'
translation:
  language: ko
  text: '1. 그러므로 이제 알아두십시오. 주께서 사람의 아들들에게 심판을 집행하실 것입니다. 바위들이 갈라지고, 해가 꺼지고, 물이 마르고, 불이 움츠러들고, 온 창조세계가 흔들리고, 보이지 않는 영들이 녹아내리고, 지극히 높으신 분의 고난으로 인해 음부가 약탈당할 때에도, 사람들은 불순종 가운데 계속 머물며 자신의 불의 안에 머물러 있을 것입니다. 그러므로 그들은 더 큰 형벌로 심판을 받을 것입니다.


    2. 그러므로 지극히 높으신 분께서 당신의 기도를 들으셨습니다. 곧 당신을 불의에서 갈라내시고, 당신이 그분에게 아들이며 종이며 그분의 임재의 일꾼이 되게 하시려는 것입니다.


    3. 당신은 야곱 안에서 지식의 빛을 비추실 것이며, 이스라엘의 모든 씨에게 해와 같이 되실 것입니다.


    4. 또한 당신과 당신의 모든 씨에게 복이 주어질 것이니, 주께서 영원히 그의 아들의 긍휼로 모든 민족을 돌보실 때까지입니다.


    5. 그러므로 이 때문에 당신에게는 지혜와 명철이 주어졌으니, 당신의 아들들에게 이 일에 대해 가르치게 하시려는 것입니다.


    6. 그를 축복하는 사람들은 복을 받을 것이고, 그를 저주하는 사람들은 멸망할 것입니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνωσκε / γνῶτε
  english_pob_choice: know
  chosen_korean: 알아두십시오
  alternatives_korean:
  - 아십시오
  - 알십시오
  lexicon: γινώσκω
  rationale: 명령형의 인지 촉구를 살리되, 문장 첫머리의 권고성을 드러내기 위해 현대 한국어에서 자연스러운 ‘알아두십시오’를 택했습니다.
- source_word: ποιήσει Κύριος κρίσιν
  english_pob_choice: the Lord will execute judgment
  chosen_korean: 주께서 … 심판을 집행하실 것입니다
  alternatives_korean:
  - 주께서 … 심판하실 것입니다
  - 주께서 … 판결을 내리실 것입니다
  lexicon: ποιέω / κρίσις
  rationale: κρίσις를 단순 판정보다 공적 집행의 뉘앙스를 살려 ‘심판을 집행하다’로 옮겼습니다.
- source_word: πνευμάτων … τηκομένων
  english_pob_choice: the invisible spirits are melting away
  chosen_korean: 보이지 않는 영들이 녹아내리고
  alternatives_korean:
  - 보이지 않는 영들이 무너지고
  - 보이지 않는 영들이 사라지고
  lexicon: πνεῦμα
  rationale: 영적 존재를 가리키는 표현을 ‘영’으로 유지하고, τηκόμενοι의 완화·소멸 이미지를 ‘녹아내리다’로 살렸습니다.
- source_word: ἐν τῷ Ἰακώβ / παντὶ σπέρματι Ἰσραήλ
  english_pob_choice: in Jacob / to all the seed of Israel
  chosen_korean: 야곱 안에서 / 이스라엘의 모든 씨에게
  alternatives_korean:
  - 야곱 가운데서 / 이스라엘의 모든 자손에게
  - 야곱 안에 / 이스라엘의 모든 후손에게
  lexicon: Ἰακώβ / σπέρμα
  rationale: ‘씨’는 POB의 직역적 종족 표지를 유지하며, 야곱/이스라엘의 병행을 보존했습니다.
- source_word: ἐν σπλάγχνοις [υἱοῦ] αὐτοῦ
  english_pob_choice: in the tender mercies of his son
  chosen_korean: 그의 아들의 긍휼로
  alternatives_korean:
  - 그의 아들의 자비로
  - 그의 아들의 다정한 긍휼로
  lexicon: σπλάγχνα
  rationale: σπλάγχνα의 정서적·자비적 의미를 한국어 성서어휘에 맞게 ‘긍휼’로 옮기되, 본문의 관계를 해치지 않게 간결하게 처리했습니다.
theological_decisions:
- issue: 주어의 신격 호칭을 야훼로 옮길지 여부
  chosen_reading: 본문의 Κύριος를 ‘주’로 두었습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 구절은 지혜문맥과 종말 심판 선언이지만, 주석상 YHWH 인용 표지가 분명하게 제시되지 않아 본문에서는 일반 호칭인 ‘주’로 유지했습니다.
  doctrine_reference: κύριος / YHWH alias policy
- issue: 2절의 θεράπων·λειτουργός 관계를 어떻게 구분할지
  chosen_reading: ‘아들이며 종이며 그분의 임재의 일꾼’으로 구분했습니다.
  alternative_readings:
  - 아들이며 종이며 섬기는 자
  - 아들이며 시종이며 봉사자
  rationale: θεράπων과 λειτουργός를 단순 반복하지 않고, 한쪽은 신분적 종속, 다른 한쪽은 예배/봉사의 기능을 드러내도록 구분했습니다.
  doctrine_reference: 서열·직분 구분의 어휘 보존
