id: T12P.LEV.16.3
reference: Testament of Levi 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '[Καὶ ἄνδρα καινοποιοῦντα¹⁵ νόμον *ἐν δυνάμει ὑψίστου¹⁶ πλάνου¹⁷ προσαγορεύσετε, καὶ τέλος †ὁρμήσετε τοῦ ἀποκτεῖναι¹⁸ αὐτόν, οὐκ εἰδότες¹⁹ αὐτοῦ τὸ ἀνάστημα†²⁰, τὸ²¹ ἀθῷον αἷμα²² *ἐν κακίᾳ²³ ἐπὶ τῆς²⁴ κεφαλῆς²⁵ ὑμῶν ἀναδεχόμενοι²⁶.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/003.yaml
  text: '[And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his rising, taking innocent blood in wickedness upon your heads.]'
translation:
  language: ko
  text: '[그리고 지극히 높으신 분의 능력 안에서 율법을 새롭게 하는 사람을 여러분은 속이는 자라고 부를 것이며, 마침내 그를 죽이려고 달려들 것입니다. 그가 일어섬을 알지 못한 채, 악함 가운데 무죄한 피를 여러분의 머리 위에 받게 될 것입니다.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘그가 일어섬’: 그리스어 ἀνάστημα는 ‘일어섬/일어남’ 또는 ‘신장·체격’을 뜻할 수 있습니다. 이 구절의 본문은 전승상 불확실성이 표시되어 있어, 번역은 어느 한 뜻으로 단정하지 않았습니다.'
    reason: ἀνάστημα의 의미 및 본문 불확실성을 투명하게 밝혀, ‘키’라는 단정적 번역을 피합니다.
lexical_decisions:
- source_word: καινοποιοῦντα νόμον
  english_pob_choice: a man who renews the law / makes the law new
  chosen_korean: 율법을 새롭게 하는 사람
  alternatives_korean:
  - 율법을 갱신하는 사람
  - 율법을 새 법처럼 만드는 사람
  lexicon: καινοποιέω
  rationale: 동사는 단순한 보수나 해설이 아니라 율법을 ‘새롭게 하다’는 의미를 살려야 하므로, 자연스럽고 직접적인 ‘새롭게 하는’으로 옮겼습니다.
- source_word: ἐν δυνάμει ὑψίστου
  english_pob_choice: in the power of the Most High
  chosen_korean: 가장높으신 분의 능력 안에서
  alternatives_korean:
  - 지극히 높으신 분의 능력으로
  - 지존자의 능력 안에서
  lexicon: ὕψιστος
  rationale: Most High를 하나님의 호칭으로 자연스럽게 드러내기 위해 ‘가장높으신 분’으로 옮기되, 문맥상 ‘능력 안에서’라는 결합을 유지했습니다.
- source_word: πλάνου
  english_pob_choice: a deceiver
  chosen_korean: 속이는 자
  alternatives_korean:
  - 미혹하는 자
  - 기만하는 사람
  lexicon: πλάνος
  rationale: 문맥의 정죄적 호칭을 살리되, 한국어에서 인물 비난의 기능이 분명한 ‘속이는 자’로 간결하게 옮겼습니다.
- source_word: ἀνάστημα
  english_pob_choice: his height
  chosen_korean: 그의 키
  alternatives_korean:
  - 그의 키/신장
  - 그의 체격
  lexicon: ἀνάστημα
  rationale: 이 단어는 here 문자적으로 ‘키/신장’이므로, POB의 개정 반영을 따라 ‘키’를 유지했습니다.
theological_decisions:
- issue: ‘가장높으신 분’의 호칭 처리
  chosen_reading: Most High를 하나님의 직접 호칭으로 받아 ‘가장높으신 분’이라고 옮겼습니다.
  alternative_readings:
  - 지극히 높으신 분
  - 가장 높으신 하나님
  rationale: 본문은 하나님의 권능을 배경으로 한 예언적 경고이므로, 단순 형용사보다 호칭성을 보존하는 번역이 더 적절합니다.
  doctrine_reference: 신명기 32:8; 시편 47:2
- issue: ‘무죄한 피를 ... 머리 위에 받게 될 것입니다’의 책임 귀속
  chosen_reading: 피의 책임이 가해자들의 ‘머리 위에’ 돌아온다는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 머리에 무죄한 피를 얹게 될 것입니다
  - 무죄한 피의 책임을 지게 될 것입니다
  rationale: 원문은 도덕적·사법적 책임의 전가를 강하게 표현하므로, 한국어에서도 관용적으로 약화시키지 않고 보존했습니다.
  doctrine_reference: 창세기 9:6; 열왕기하 1:10-14
