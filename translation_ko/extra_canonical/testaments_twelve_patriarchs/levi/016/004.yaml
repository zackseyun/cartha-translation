review_pass:
  verdict: revise
  source_fidelity: The causal phrase δι᾽ αὐτόν is conveyed accurately, but the honorific pronoun “그분” is not signaled by the Greek and is unnecessary. τὰ ἅγια is preserved as a plural collection of holy places. ἔρημα ἕως ἐδάφους expresses devastation down to the ground; the draft’s phrase “땅바닥에 이르기까지 황폐하게 될 것입니다” is grammatically possible but does not idiomatically express that extent of ruin.
  naturalness: The proposed revision uses natural modern Korean while retaining formal-polite 합쇼체. “땅바닥까지 폐허가 될 것입니다” is more idiomatic and forcefully conveys complete devastation.
  terminology: “거룩한 곳들” appropriately retains the broad, plural sense adopted in the English audit trail without prematurely narrowing τὰ ἅγια to a single temple or a particular denominational sense of “성소.”
  issues:
  - severity: low
    issue: Unwarranted honorific in “그분 때문에”
    rationale: The Greek pronoun αὐτόν marks neither honorific status nor reverence. “그 때문에” preserves the referent and causal force without adding a Korean social-register implication.
  - severity: medium
    issue: Awkward rendering of ἕως ἐδάφους
    rationale: “땅바닥에 이르기까지 황폐하게 될 것입니다” is not natural Korean for destruction reduced to ground level. “땅바닥까지 폐허가 될 것입니다” expresses the intended extent clearly.
  revised_text: 그러나 내가 여러분에게 말합니다. 그 때문에 여러분의 거룩한 곳들은 땅바닥까지 폐허가 될 것입니다.
