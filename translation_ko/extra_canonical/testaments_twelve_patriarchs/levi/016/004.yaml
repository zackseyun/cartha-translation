  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/004.yaml
  text: But I tell you that because of him, your holy places will be laid waste to the ground.
translation:
  language: ko
  text: 그러나 내가 여러분에게 말합니다. 그분 때문에 여러분의 거룩한 곳들이 땅바닥에 이르기까지 황폐하게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  english_pob_choice: But I tell you
  chosen_korean: 그러나 내가 여러분에게 말합니다
  alternatives_korean:
  - 하지만 내가 여러분에게 말합니다
  - 내가 여러분에게 말하노니
  lexicon: λέγω
  rationale: 직설적 선언을 살리되, 현대 합쇼체로 자연스럽게 옮겼습니다. 2인칭 복수는 ‘여러분’으로 분명하게 드러냈습니다.
- source_word: δι᾽ αὐτὸν
  english_pob_choice: because of him
  chosen_korean: 그분 때문에
  alternatives_korean:
  - 그를 인해
  - 그로 말미암아
  lexicon: διά + 대명사
  rationale: 원인의 의미를 자연스럽게 전달하면서도, 지시 대상의 인격적 성격을 살려 ‘그분’으로 옮겼습니다.
- source_word: τὰ ἅγια ὑμῶν
  english_pob_choice: your holy places
  chosen_korean: 여러분의 거룩한 곳들
  alternatives_korean:
  - 여러분의 성소들
  - 여러분의 성물들
  lexicon: ἅγια
  rationale: 복수형 ‘ἅγια’의 넓은 의미를 살려 ‘거룩한 곳들’로 옮겼습니다. 문맥상 특정 성전만이 아니라 거룩한 예배 공간들을 가리킬 수 있어, ‘성소’로 좁히지 않았습니다.
- source_word: ἔρημα ἕως ἐδάφους
  english_pob_choice: will be laid waste to the ground
  chosen_korean: 땅바닥에 이르기까지 황폐하게 될 것입니다
  alternatives_korean:
  - 완전히 황폐해질 것입니다
  - 땅에까지 황폐해질 것입니다
  lexicon: ἔρημος + ἕως ἐδάφους
  rationale: ‘ἔρημα’의 황폐함과 ‘ἕως ἐδάφους’의 강한 파괴 범위를 함께 반영해, 결과의 전면성을 살렸습니다.
theological_decisions:
- issue: ‘holy places’의 범위
  chosen_reading: 특정 한 건물로 한정하지 않고, 복수형을 살려 예배에 속한 거룩한 장소들로 번역했습니다.
  alternative_readings:
  - 성소들
  - 성전
  rationale: 그리스어 복수형 τὰ ἅγια는 문맥상 거룩한 공간들의 집합을 가리킬 수 있으므로, 한국어에서도 범위를 보존하는 것이 더 안전합니다.
  doctrine_reference: 문맥 보존 원칙
- issue: 파괴 진술의 강도
  chosen_reading: ‘황폐하게 될 것입니다’와 ‘땅바닥에 이르기까지’로 파괴의 전면성을 분명히 했습니다.
  alternative_readings:
  - 무너질 것입니다
  - 파괴될 것입니다
  rationale: ἕως ἐδάφους는 단순한 손상이 아니라 완전한 폐허화를 가리키므로, 약화시키지 않고 직역에 가까운 강한 표현을 유지했습니다.
  doctrine_reference: source-meaning fidelity
