id: T12P.LEV.16.2
reference: Testament of Levi 16:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ τὸν νόμον ἀθετήσετε⁷ καὶ λόγους προφητῶν ἐξουδενώσετε⁸ *ἐν διαστροφῇ κακῇ⁹. *διώξετε δὲ¹⁰ ἄνδρας¹¹ δικαίους, καὶ εὐσεβεῖς μισήσετε¹², ἀληθινῶν¹³ λόγους βδελύξεσθε¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/002.yaml
  text: And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.
translation:
  language: ko
  text: 너희는 율법을 버리고 예언자들의 말을 악한 왜곡 속에서 멸시할 것이며, 의로운 사람들을 박해하고 경건한 사람들을 미워하며, 진실한 이들의 말을 혐오할 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν νόμον ἀθετήσετε
  english_pob_choice: you will set aside the law
  chosen_korean: 율법을 버리고
  alternatives_korean:
  - 율법을 폐하고
  - 율법을 무효로 하고
  lexicon: νόμος → 율법
  rationale: τούς 기사 있는 νόμος를 단순한 규범이 아니라 하나님의 규범/토라로 보고, POB의 ‘set aside’에 맞게 ‘버리다’로 옮겼습니다.
- source_word: λόγους προφητῶν ἐξουδενώσετε
  english_pob_choice: treat the words of the prophets with contempt
  chosen_korean: 예언자들의 말을 멸시할 것이며
  alternatives_korean:
  - 예언자들의 말을 업신여길 것이며
  - 예언자들의 말을 하찮게 여길 것이며
  lexicon: λόγοι → 말 / προφῆται → 예언자
  rationale: ‘말씀’보다 원문의 일반명사 λόγους를 살려 ‘말’로 옮기고, προφητῶν은 구약적 ‘선지자’보다 현대 표준어에 맞는 ‘예언자들’로 렌더링했습니다.
- source_word: ἐν διαστροφῇ κακῇ
  english_pob_choice: in evil perversity
  chosen_korean: 악한 왜곡 속에서
  alternatives_korean:
  - 악한 비뚤어짐 속에서
  - 심한 사악함 속에서
  lexicon: διαστροφή → 왜곡 / κακή → 악한
  rationale: διαστροφῇ의 핵심을 도덕적 ‘비틀림’과 ‘왜곡’으로 보고, POB의 긴장감 있는 표현을 유지하기 위해 ‘악한 왜곡’으로 압축했습니다.
- source_word: ἀληθινῶν λόγους
  english_pob_choice: the words of the truthful
  chosen_korean: 진실한 이들의 말을
  alternatives_korean:
  - 진실한 자들의 말을
  - 참된 사람들의 말을
  lexicon: ἀληθινός → 진실한 / λόγοι → 말
  rationale: 여기서는 ‘truthful’이 형용사적으로 사람을 수식하므로 ‘진실한 이들’로 풀어, 단순히 ‘참된 말’로 오해되지 않게 했습니다.
theological_decisions:
- issue: 의로운 사람들과 경건한 사람들에 대한 묘사
  chosen_reading: ‘righteous men’과 ‘the godly’를 각각 ‘의로운 사람들’과 ‘경건한 사람들’로 구분해 병렬을 살렸습니다.
  alternative_readings:
  - 의인들 / 경건한 자들
  - 의로운 이들 / 하나님을 경외하는 이들
  rationale: 원문은 두 집단을 구분해 반복적으로 비난의 강도를 높이므로, 한국어에서도 별도 표지를 유지해 수사적 병렬을 보존했습니다.
  doctrine_reference: 수사적 병렬 보존
- issue: ‘말씀’ 대신 ‘말’을 사용한 번역
  chosen_reading: λόγους는 여기서 신적 ‘말씀’이 아니라 예언자들과 진실한 이들이 한 ‘말’로 번역했습니다.
  alternative_readings:
  - 말씀
  - 발언
  rationale: 문맥상 특정한 계시어가 아니라 복수의 발화 내용을 가리키므로, 과도한 신학적 격상을 피하고 원문의 범위를 유지했습니다.
  doctrine_reference: 어휘 범위 보존
