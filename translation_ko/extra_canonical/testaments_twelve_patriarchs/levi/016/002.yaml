  source_fidelity: 원문의 미래형 동사 열거와 병렬(율법을 저버림, 예언자들의 말을 멸시함, 의로운 이들을 박해함, 경건한 이들을 미워함, 진실한 이들의 말을 혐오함)은 대체로 충실합니다. 다만 ἐν διαστροφῇ κακῇ는 단순한 언어적 ‘왜곡’이라기보다 사악한 도덕적 그릇됨/비뚤어짐을 가리키므로 이를 더 정확히 조정했습니다.
  naturalness: ‘악한 왜곡 속에서’는 현대 한국어에서 다소 부자연스럽고, 무엇이 왜곡되는지 불분명하게 들립니다. ‘사악한 그릇됨으로’는 원문의 도덕적 성격과 수단·태도 뉘앙스를 유지하면서 문장 흐름을 자연스럽게 합니다.
