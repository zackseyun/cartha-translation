revisions:
- from: 그리고 이제 나는 너희가 칠십 이레 동안 길을 벗어날 것이라는 것을 압니다. 너희는 제사장 직분을 더럽히고 제단들을 더럽힐 것입니다.[a][b]
  to: 그리고 이제 나는 너희가 칠십 이레 동안 길을 벗어날 것임을 압니다. 너희는 제사장 직분을 모독하고 제단들을 더럽힐 것입니다.
