id: T12P.LEV.16.1
reference: Testament of Levi 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν *ἐγὼ ἔγνωκα¹ ὅτι ἑβδομήκοντα ἑβδομάδας² πλανηθήσεσθε³, καὶ τὴν ἱερωσύνην βεβηλώσετε⁴ καὶ *τὰ θυσιαστήρια⁵ μιανεῖτε⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/001.yaml
  text: And now I know that for seventy weeks you will go astray, and you will profane the priesthood and defile the altars.
translation:
  language: ko
  text: 그리고 이제 나는 너희가 칠십 이레 동안 길을 벗어날 것임을 압니다. 너희는 제사장 직분을 모독하고 제단들을 더럽힐 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ ἔγνωκα
  english_pob_choice: I know
  chosen_korean: 나는 ... 압니다
  alternatives_korean:
  - 나는 ... 압니다
  - 나는 ... 알았습니다
  lexicon: ἔγνωκα
  rationale: 완료형의 인식 상태를 현재적으로 살려, 단순 과거보다 ‘알고 있는 상태’인 현재 인식을 나타냈습니다.
- source_word: ἑβδομήκοντα ἑβδομάδας
  english_pob_choice: seventy weeks
  chosen_korean: 칠십 이레
  alternatives_korean:
  - 칠십 주간
  - 칠십 주
  lexicon: ἑβδομάς
  rationale: 시간 단위의 관용적 의미를 보존하되, 한국어 성경 문맥에서 이해 가능한 ‘이레’를 택했습니다.
- source_word: πλανηθήσεσθε
  english_pob_choice: you will go astray
  chosen_korean: 길을 벗어날 것이라는
  alternatives_korean:
  - 길을 잃을 것이라는
  - 그릇된 길로 갈 것이라는
  lexicon: πλανηθήσεσθε
  rationale: 단순한 방황보다 신앙적 이탈을 포함하는 ‘길을 벗어나다’가 원문의 표지를 더 직접적으로 드러냅니다.
- source_word: τὴν ἱερωσύνην
  english_pob_choice: the priesthood
  chosen_korean: 제사장 직분
  alternatives_korean:
  - 제사장직
  - 제사장 직무
  lexicon: ἱερωσύνη
  rationale: 제도적 직분과 거룩한 소명 모두를 아우르는 표현으로, 전통적 직책명인 ‘제사장 직분’을 사용했습니다.
- source_word: τὰ θυσιαστήρια
  english_pob_choice: the altars
  chosen_korean: 제단들을
  alternatives_korean:
  - 제단들을
  - 제단들
  lexicon: θυσιαστήριον
  rationale: 복수형을 그대로 살려 제단이 여러 개임을 반영했습니다.
theological_decisions:
- issue: 제사장 직분을 ‘더럽히다’와 제단을 ‘더럽히다’의 윤리적·제의적 강도
  chosen_reading: 두 동사 모두 의례적 오염과 신성모독의 강도를 유지하는 ‘더럽히다’로 통일했습니다.
  alternative_readings:
  - 부정하게 하다
  - 훼손하다
  rationale: 원문 βεβηλώσετε/μιανεῖτε는 단순 손상보다 성스러운 것을 침범하는 제의적 오염을 강하게 나타내므로, 한국어에서도 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 성전/제사장직의 거룩성과 제의적 오염 개념
