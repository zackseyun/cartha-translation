review_pass:
  verdict: revise
  source_fidelity: 원문의 완료형 인식(ἐγὼ ἔγνωκα)은 현재의 확신을 나타내는 ‘압니다’로 적절히 옮겼습니다. ‘칠십 이레’, 미래의 ‘길을 벗어남’, 제사장직의 모독(βεβηλώσετε), 제단들의 오염(μιανεῖτε)도 충실히 반영합니다.
  naturalness: ‘…것이라는 것을 압니다’는 문법상 가능하지만 다소 중첩됩니다. ‘…것임을 압니다’가 현대 한국어 합쇼체에서 더 간결하고 자연스럽습니다.
  terminology: ‘제사장 직분’은 ἱερωσύνη의 제도적·직무적 뜻을 적절히 전달합니다. βεβηλόω와 μιαίνω의 구별을 한국어에서 각각 ‘모독하다’와 ‘더럽히다’로 옮기면, 전자는 성스러운 것을 속되게 함, 후자는 오염시킴이라는 원문의 어휘 차이를 더 잘 보존합니다. 복수형 ‘제단들을’도 유지합니다.
  issues:
  - severity: medium
    issue: 본문에 [a][b] 각주 표지가 있으나 제공된 각주가 없습니다.
    rationale: 독자가 확인할 수 없는 각주 표지는 구조적으로 불완전하며, 이 절의 번역을 위해 필수적인 각주 내용도 제공되지 않았습니다. 표지를 삭제해야 합니다.
  - severity: low
    issue: ‘길을 벗어날 것이라는 것을’의 표현이 장황합니다.
    rationale: 의미는 맞지만 ‘길을 벗어날 것임을’이 더 자연스럽고 간결합니다.
  - severity: low
    issue: 두 제의 관련 동사가 모두 ‘더럽히다’로 번역되어 원문의 어휘적 대비가 약화됩니다.
    rationale: βεβηλώσετε는 특히 ‘모독하다/속되게 하다’의 뜻이고, μιανεῖτε는 ‘더럽히다/오염시키다’의 뜻입니다.
  revised_text: 그리고 이제 나는 너희가 칠십 이레 동안 길을 벗어날 것임을 압니다. 너희는 제사장 직분을 모독하고 제단들을 더럽힐 것입니다.
