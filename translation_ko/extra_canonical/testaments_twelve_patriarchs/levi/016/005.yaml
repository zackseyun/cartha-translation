revisions:
- from: 그리고 너희에게 깨끗한 곳은 없을 것입니다. 오히려 너희는 민족들 가운데서 저주와 흩어짐을 당하게 될 것이지만, 그가 다시 오셔서 긍휼을 베푸시고 너희를 받아들이실 때까지 그러할 것입니다.
  to: 그리고 너희에게는 정결한 곳이 없을 것입니다. 그러나 너희는 민족들 가운데서 저주를 받고 흩어지게 될 것입니다. 그분께서 친히 다시 찾아오셔서 너희를 불쌍히 여기시고 받아들이실 때까지는 그러할 것입니다.
  rationale: 대조 접속사와 시간절의 범위를 자연스럽고 명료하게 재구성하되, 민족들 가운데 있는 상태, 저주와 흩어짐, 친히 다시 찾아오심, 연민과 받아들임이라는 원문의 요소를 모두 유지했습니다. 원문이 특정 주체의 이름을 밝히지 않으므로 ‘그분’으로 지시성을 보존했습니다.
