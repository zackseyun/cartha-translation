base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/005.yaml
  text: And no clean place will be for you, but you will be among the nations of the earth for a curse and for scattering, until he himself visits again and shows compassion and receives you.
translation:
  language: ko
  text: 그리고 너희에게 깨끗한 곳은 없을 것입니다. 오히려 너희는 민족들 가운데서 저주와 흩어짐을 당하게 될 것이지만, 그가 다시 오셔서 긍휼을 베푸시고 너희를 받아들이실 때까지 그러할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπος ὑμῖν καθαρὸς οὐκ ἔσται
  english_pob_choice: no clean place will be for you
  chosen_korean: 너희에게 깨끗한 곳은 없을 것입니다
  alternatives_korean:
  - 너희를 위한 정결한 장소는 없을 것입니다
  - 너희에게 깨끗한 자리는 없을 것입니다
  lexicon: τόπος, καθαρός
  rationale: τοπος는 단순히 ‘장소’이지만, 문맥상 유랑과 추방의 대비를 살려 자연스러운 ‘곳’으로 옮겼고, καθαρός는 의례적·도덕적 ‘정결’보다 일반적 ‘깨끗함’이 직접적입니다.
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  english_pob_choice: for a curse and for scattering
  chosen_korean: 저주와 흩어짐을 당하게 될 것이지만
  alternatives_korean:
  - 저주와 흩어짐이 되게 될 것이지만
  - 저주와 분산을 위해 있게 될 것이지만
  lexicon: κατάρα, διασκορπισμός
  rationale: 두 전치사 εἰς를 목적/귀결로 풀어, 결과 상태를 나타내는 한국어로 자연스럽게 정리했습니다. διασκορπισμός는 ‘흩어짐’이 의미를 가장 직접적으로 드러냅니다.
- source_word: ἕως ... ἐπισκέψηται καὶ οἰκτειρήσῃ καὶ προσδέξηται
  english_pob_choice: until he himself visits again and shows compassion and receives you
  chosen_korean: 그가 다시 오셔서 긍휼을 베푸시고 너희를 받아들이실 때까지
  alternatives_korean:
  - 그가 다시 찾아오셔서 불쌍히 여기시고 너희를 받아들이실 때까지
  - 그가 다시 방문하셔서 자비를 보이시고 너희를 받아들이실 때까지
  lexicon: ἐπισκέπτομαι, οἰκτείρω, προσδέχομαι
  rationale: ἐπισκέπτομαι는 단순 방문보다 회복적 개입의 뉘앙스가 있어 ‘다시 오셔서’로 처리했고, οἰκτείρω는 전통적 ‘긍휼을 베푸시다’가 본문의 연민을 잘 드러냅니다. προσδέχομαι는 수용/영접의 의미로 ‘받아들이시다’가 무난합니다.
theological_decisions:
- issue: 재방문 주체의 존칭과 문장 내 종결
  chosen_reading: 그가 다시 오셔서 ... 베푸시고 ... 받아들이실 때까지
  alternative_readings:
  - 그가 다시 오셔서 ... 베푸실 때까지
  - 그가 다시 찾아오셔서 ...
  rationale: 지시된 인물은 신적 구원 행위를 하는 주체로 읽히므로 한국어에서 존칭 서술을 유지해 경외적 톤을 반영했습니다. 본문은 예언적 약속 구조이므로 종결도 미래 서술로 일관시켰습니다.
  doctrine_reference: 예언적 회복 약속과 신적 긍휼의 행위 묘사
