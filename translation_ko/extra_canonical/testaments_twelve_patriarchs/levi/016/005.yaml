  verdict: revise
  source_fidelity: 초안은 전체 문장 구조와 회복의 시간적 한계(ἕως)를 대체로 충실히 반영합니다. 그러나 ἀλλ᾽의 대조를 ‘것이지만’으로 앞 절에 종속시키면 문장 관계가 다소 흐려집니다. 또한 καθαρός는 이 문맥에서 ‘깨끗한’보다 ‘정결한’이 더 정확하며, 강조형 αὐτός는 ‘친히’로 드러내는 것이 좋습니다.
  naturalness: 합쇼체는 일관되지만, ‘저주와 흩어짐을 당하게 될 것이지만’은 한국어에서 다소 부자연스럽고 ‘하지만’ 뒤의 시간절 연결도 매끄럽지 않습니다. 대조와 지속 상태를 별도 문장으로 정리하면 자연스럽습니다.
  terminology: ‘정결한’은 καθαρός의 종교·의례적 어감을 보존합니다. οἰκτειρήσῃ는 ‘긍휼을 베푸시고’도 가능하나, 본문에는 ‘너희를’이 직접 목적어로 이어지므로 ‘너희를 불쌍히 여기시고’가 구조상 더 직접적입니다. προσδέξηται는 ‘받아들이시고’가 적절합니다.
