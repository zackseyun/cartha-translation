- from: 1. 내가 아내를 맞이했을 때 나는 스물여덟 살이었고, 그의 이름은 멜하였습니다. 2. 그리고 그녀가 잉태하여 아들을 낳았기에, 내가 그의 이름을 게르삼이라 불렀습니다. 우리가 나그네로 사는 땅에 있었기 때문입니다. 3. 그리고 나는 그에 대하여 보니, 그가 첫째 자리[a]에 있지 않았습니다. 4. 그리고 고핫은 내 생애 서른다섯째 해에 태어났으며, 나는 환상 가운데서, 해돋이를 향하여, 5. 그가 회중의 한가운데, 높은 곳에 서 있는 것을 보았습니다. 6. 그러므로 내가 그의 이름을 고핫이라 불렀으니, 이는 곧 위엄과 회중의 시작입니다. 7. 그리고 셋째 아들 므라리가 내 생애 마흔째 해에 내게 태어났는데, 그의 어머니가 그를 해산하기 어려워했기 때문에 내가 그를 므라리라 불렀습니다. 이는 곧 쓰라림입니다. 8. 그런데 요게벳은 내가 아흔네 살이 되던 해에 이집트에서 태어났습니다[b]. 그때 나는 형제들 가운데서 명망이 있었습니다.
