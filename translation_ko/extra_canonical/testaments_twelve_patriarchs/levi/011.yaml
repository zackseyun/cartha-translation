  rationale: 원문의 수치(64년)를 회복하고, 원문 어순에 따라 4절의 동쪽/해 뜨는 쪽 표현과 5절의 환상 진술을 분리했습니다. 지시 대상, 위계 표현, 문장 연결을 현대 표준 한국어 합쇼체에 맞게 다듬었으며, 각주 표지를 해당 본문 난점이 있는 절로 옮겼습니다. ‘해 뜨는 쪽에서’라는 다소 특이한 출생 수식은 원문의 결합을 보존하기 위해 유지했습니다.
