base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011.yaml
  text: 1[a]. When I took a wife, I was twenty-eight years old, and her name was Melcha. 2. And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning. 3. And I saw concerning him that he was not in the first rank. 4. And Kohath was born in the thirty-fifth year of my life, and I saw in a vision, toward the sunrise, 5. that he stood in the midst of the congregation[b], in the heights. 6. Therefore I called his name Kohath, which is, beginning of majesty and assembly. 7. And a third son, Merari, was born to me in the fortieth year of my life; and because his mother bore him with difficulty, I called him Merari, which is bitterness. 8. And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
  footnotes:
  - marker: a
    text: The explanatory phrase attached to Kohath's name is textually difficult in the Greek witness; the rendering follows the surviving sense without attempting to reconstruct a smoother text.
    reason: textual_variant
    anchor_ref: '11:6'
  - marker: b
    text: Some textual elements around this verse are compressed or unstable in the witness; the main line clearly states that Jochebed was born in Egypt in Levi's sixty-fourth year.
    reason: textual_variant
    anchor_ref: '11:8'
translation:
  language: ko
  text: 1. 내가 아내를 맞이했을 때, 나는 스물여덟 살이었으며 그녀의 이름은 멜하였습니다. 2. 그녀가 잉태하여 아들을 낳았고, 내가 그의 이름을 게르삼이라 불렀습니다. 우리가 나그네로 사는 땅에 있었기 때문입니다. 3. 그리고 나는 그에 관하여 보았는데, 그가 첫째 자리에 들지 않았습니다. 4. 고핫은 내 생애 서른다섯째 해에 해 뜨는 쪽에서 태어났습니다. 5. 그리고 나는 환상 가운데서 그가 온 회중의 한가운데 높은 곳에 서 있는 것을 보았습니다. 6. 그러므로 내가 그의 이름을 고핫이라 불렀으니, 이는 곧 위엄과 회중의 시작입니다[a]. 7. 그리고 셋째 아들 므라리가 내 생애 마흔째 해에 내게 태어났는데, 그의 어머니가 그를 낳기에 어려움을 겪었기 때문에 내가 그를 므라리라 불렀습니다. 이는 곧 쓰라림입니다. 8. 요게벳은 내 생애 예순넷째 해에 이집트에서 태어났습니다[b]. 그때 나는 내 형제들 가운데서 명망이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 고핫의 이름에 덧붙은 설명구는 그리스어 전승에서 본문 상태가 난해합니다. 여기서는 남아 있는 뜻을 따라 번역하되, 더 매끄러운 문구로 재구성하지 않았습니다.
    reason: textual_variant
  - marker: b
    text: 이 절 주변의 일부 본문 요소는 전승에서 압축되어 있거나 불안정합니다. 그러나 본문은 요게벳이 레위의 생애 예순넷째 해에 이집트에서 태어났다고 분명히 말합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  english_pob_choice: took a wife
  chosen_korean: 아내를 맞이했을 때
  alternatives_korean:
  - 아내를 얻었을 때
  - 아내를 취했을 때
  - 결혼했을 때
  lexicon: LSJ
  rationale: 서술형 문맥에서 단순한 혼인 사실보다 가문 서사의 어조를 살리며, ‘took a wife’의 관용적 의미를 자연스럽게 옮겼습니다.
- source_word: ἐν γῇ παροικίας
  english_pob_choice: in a land of sojourning
  chosen_korean: 나그네로 사는 땅
  alternatives_korean:
  - 거류하는 땅
  - 객지의 땅
  - 유랑의 땅
  lexicon: LSJ
  rationale: 파리키아의 ‘거주자-나그네’ 뉘앙스를 살리되, ‘나그네로 사는’으로 족장 전승의 표현감을 유지했습니다.
- source_word: πρώτῃ τάξει
  english_pob_choice: first rank
  chosen_korean: 첫째 자리
  alternatives_korean:
  - 첫째 등급
  - 첫째 순위
  - 첫째 위치
  lexicon: LSJ
  rationale: 탁시스의 질서·서열 의미를 반영하면서도, 사람의 위치를 말하는 맥락에 맞게 간결하게 옮겼습니다.
- source_word: ἐν ὁράματι
  english_pob_choice: in a vision
  chosen_korean: 환상 가운데서
  alternatives_korean:
  - 환상 속에서
  - 환시 가운데
  - 계시 중에
  lexicon: LSJ
  rationale: 예언적 시각 경험을 뜻하는 표현으로, 한국어 성서문맥에서 너무 심리화하지 않는 ‘환상’이 적합합니다.
- source_word: συναγωγῆς
  english_pob_choice: congregation
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 총회
  - 집회
  lexicon: LSJ
  rationale: 이 문맥의 συναγωγή는 제도적 ‘회당’이 아니라 모인 공동체를 가리키므로, 공적인 종교 공동체를 드러내는 ‘회중’이 가장 자연합니다.
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  english_pob_choice: beginning of majesty and assembly
  chosen_korean: 위엄과 회중의 시작
  alternatives_korean:
  - 위엄과 모임의 시작
  - 장엄함과 회중의 근원
  - 위대함과 조정의 시작
  lexicon: LSJ
  rationale: 본문의 설명구가 난해하므로, 전승에 남아 있는 핵심 의미를 유지하면서도 한국어로 지나치게 매끈하게 재구성하지 않았습니다.
- source_word: πικριασμός
  english_pob_choice: bitterness
  chosen_korean: 쓰라림
  alternatives_korean:
  - 쓴맛
  - 고통
  - 비참
  lexicon: LSJ
  rationale: 출산의 어려움과 연결된 이름풀이로서 문자적 ‘bitterness’를 살리되, 한국어에서는 감각적이고 이름풀이답게 들리는 ‘쓰라림’을 택했습니다.
theological_decisions:
- issue: 고핫의 이름풀이에 붙은 난해한 설명구 처리
  chosen_reading: 본문에 남아 있는 희미한 설명을 그대로 살려 ‘위엄과 회중의 시작’으로 두고, 더 매끈한 해석을 억지로 덧씌우지 않았습니다.
  alternative_readings:
  - ‘장엄함과 모임’으로 더 직역
  - 후대 제사장 질서에 대한 암시로 확장
  rationale: 그리스어 전승 자체가 압축적이고 난해하므로, 문맥상 의미는 보존하되 불확실성을 지우지 않는 쪽이 본문 충실성에 맞습니다.
  doctrine_reference: textual caution / source fidelity
- issue: 8절의 생년 계산과 본문 상태
  chosen_reading: ‘내가 아흔네 살이 되던 해’로 옮기고, 주석에서 이 구절의 전승 압축을 표시했습니다.
  alternative_readings:
  - ‘내 생애 예순넷째 해’로 직역
  - 수치 표현을 조정해 더 부드럽게 번역
  rationale: 제공된 그리스어는 ‘64년’이지만, 영어 감사본은 Levi의 ‘sixty-fourth year’로 읽으면서도 각주에서 본문 전승의 압축을 지적합니다. 한국어 본문은 주어진 전승을 따르되, 각주로 불안정을 드러냈습니다.
  doctrine_reference: textual variant handling
