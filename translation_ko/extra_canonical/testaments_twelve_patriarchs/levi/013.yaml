base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013.yaml
  text: '1[a]. And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity according to all his law. 2. And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing. 3. For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes. 4[b]. Indeed, he will gain many friends more than parents, and many among men will desire to serve him and to hear the law from his mouth. 5. Therefore do righteousness, my children, upon the earth, so that you may find it in the heavens. 6. And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction. 7. Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perishes, no one can take away the wise man''s wisdom, except
    the blindness of ungodliness and the hardening of sin. 8. For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend. 9. Everyone who teaches good things and does them will share the throne of kings[c], just as Joseph my brother also did.'
  footnotes:
  - marker: a
    text: The phrase 'many friends more than parents' is difficult. It likely means that the learned person gains many friends beyond the circle of family, or more than one ordinarily receives from parental standing alone.
    reason: lexical_alternative
    anchor_ref: '13:4'
  - marker: b
    text: Greek literally, 'do righteousness ... that you may find [it] in the heavens.' The object after 'find' is implicit.
    reason: alternative_reading
    anchor_ref: '13:5'
  - marker: c
    text: 'The Greek is highly compressed: wisdom becomes ''splendid among enemies,'' and a person finds ''homeland'' even in foreign territory.'
    reason: lexical_alternative
    anchor_ref: '13:8'
translation:
  language: ko
  text: 1. 이제, 내 자녀들아, 내가 너희에게 명합니다. 너희는 온 마음으로 너희의 하나님이신 주를 두려워하고, 그의 모든 율법에 따라 단순하게 행하십시오. 2. 너희도 너희 자녀들에게 글자를 가르치십시오. 그리하여 그들이 평생 동안 이해력을 가지며, 하나님의 율법을 끊임없이 읽게 하십시오. 3. 주의 율법을 알게 되는 사람은 모두 존중을 받으며, 어디로 가든지 낯선 사람이 되지 않을 것입니다. 4. 참으로 그는 부모보다 더 많은 친구를 얻게 되고, 사람들 가운데 많은 이들이 그를 섬기고 그의 입에서 나오는 율법을 듣고 싶어 할 것입니다. 5. 그러므로 내 자녀들아, 땅 위에서 의를 행하십시오. 그러면 너희가 하늘에서 그것을 찾게 될 것입니다. 6. 너희의 영혼에 좋은 것들을 심으십시오. 그러면 너희의 삶에서 그것들을 찾게 될 것입니다. 그러나 악한 것들을 심으면 너희는 모든 혼란과 고난을 거두게 될 것입니다. 7. 하나님의 두려움 안에서 지혜를 얻으십시오. 포로 됨이 오고 성읍들과 땅들이 멸망하며 금과 은과 모든 소유가 사라져도, 경건 없음의 눈멀음과 죄의 완악함 외에는 아무도 지혜로운 사람의 지혜를 빼앗아 갈 수 없습니다. 8. 누구든지 이런 악한 행위들에서 자신을 지키면, 지혜는 그에게 적들 가운데서도 빛나고, 이방 땅에서는 고향이 되며, 원수들 한가운데서도 친구로 인정받게 될 것입니다. 9. 선한 것들을 가르치고 그것들을 행하는 사람은 누구나 왕들과 함께 그 왕좌를 나누어 앉게 될 것입니다. 요셉 내 형제도 그와 같았습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότης
  english_pob_choice: simplicity
  chosen_korean: 단순하게
  alternatives_korean:
  - 순전하게
  - 성실하게
  - 한결같이
  lexicon: LSJ
  rationale: 문맥의 핵심은 분열되지 않고 곧게 행하는 윤리적 태도이므로, POB의 ‘simplicity’를 살리되 한국어에서는 부사의 형태로 자연스럽게 옮겼습니다.
- source_word: γράμματα
  english_pob_choice: letters
  chosen_korean: 글자들
  alternatives_korean:
  - 문자
  - 글
  - 기초 학문
  lexicon: LSJ
  rationale: 본문은 자녀 교육의 기초로서 실제 문자 학습을 가리키므로, 추상화하지 않고 구체적으로 ‘글자’를 택했습니다.
- source_word: νόμον αὐτοῦ / νόμον τοῦ Θεοῦ / νόμον Κυρίου
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  - 규례
  lexicon: standard biblical usage
  rationale: 이 문맥에서 νόμος는 하나님의 권위 있는 규범을 뜻하므로, 한국어 성서어법에 맞게 ‘율법’으로 일관되게 옮겼습니다.
- source_word: ξένος
  english_pob_choice: stranger
  chosen_korean: 낯선 사람
  alternatives_korean:
  - 나그네
  - 외국인
  - 이방인
  lexicon: LSJ
  rationale: 단순한 국적 표지보다 사회적 소외를 강조하므로, 어디서나 낯설지 않다는 뜻을 드러내는 ‘낯선 사람’으로 풀었습니다.
- source_word: σύνθρονος ἔσται βασιλέων
  english_pob_choice: will share the throne of kings
  chosen_korean: 그 왕좌를 나누어 앉게 될 것입니다
  alternatives_korean:
  - 왕들과 함께 왕좌에 앉게 될 것입니다
  - 왕들의 왕좌를 함께 누리게 될 것입니다
  lexicon: LSJ
  rationale: ‘함께 앉다/왕좌를 공유하다’의 압축된 뜻을 살리면서도 한국어에서 이해 가능한 왕권 참여의 이미지를 유지했습니다.
theological_decisions:
- issue: v.5의 '하늘에서 그것을 찾으라'는 표현
  chosen_reading: 땅에서의 의가 하늘에서 다시 발견되거나 하늘의 보응으로 연결된다는 열린 표현으로 유지했습니다.
  alternative_readings:
  - 하늘에서 상을 찾으라
  - 하늘에서 의를 찾으라
  - 하늘에서 그것을 받게 될 것이다
  rationale: 그리스어는 εὕρητε 뒤의 목적어가 생략되어 있으므로, 의미를 특정한 보상 개념으로 닫지 않고 본문의 상응 관계를 그대로 남겼습니다.
  doctrine_reference: 의의 보응을 특정 교리 공식으로 단정하지 않고 본문 긴장을 보존
