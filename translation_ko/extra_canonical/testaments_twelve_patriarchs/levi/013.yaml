  revised_text: 1. 이제, 내 자녀들아, 내가 너희에게 명합니다. 너희는 온 마음으로 너희의 하나님이신 주를 두려워하고, 그의 모든 율법에 따라 순전하게 행하십시오. 2. 너희도 너희 자녀들에게 글자를 가르치십시오. 그리하여 그들이 평생 하나님의 율법을 끊임없이 읽어 이해력을 갖게 하십시오. 3. 주의 율법을 알게 되는 사람은 모두 존중을 받을 것이며, 어디로 가든지 낯선 사람이 되지 않을 것입니다. 4. 참으로 그는 부모보다 더 많은 친구를 얻게 되고[a], 사람들 가운데 많은 이들이 그를 섬기며 그의 입에서 나오는 율법을 듣고 싶어 할 것입니다. 5. 그러므로 내 자녀들아, 땅 위에서 의를 행하십시오. 그리하여 너희가 하늘에서 그것을 찾게 하십시오[b]. 6. 너희의 영혼에 좋은 것들을 심으십시오. 그러면 너희의 삶에서 그것들을 찾게 될 것입니다. 그러나 악한 것들을 심으면, 너희는 온갖 혼란과 고난을 거두게 될 것입니다. 7. 하나님의 두려움 안에서 지혜를 얻으십시오. 포로로 끌려가고 성읍들과 땅들이 멸망하며 금과 은과 모든 소유가 사라져도, 불경건으로 인한 눈멂과 죄로 인한 완고해짐 외에는 아무도 지혜로운 사람의 지혜를 빼앗아 갈 수 없습니다. 8. 누구든지 이런 악한 행위들에서 자신을 지키면, 그에게 지혜가 생겨 적들 가운데서도 빛나고, 낯선 땅에서는 고향이 되며, 그는 원수들 한가운데서 친구로 여겨질 것입니다[c]. 9. 선한 것들을 가르치고 그것들을 행하는 사람은 누구나 왕들과 함께 왕좌에 앉게 될 것입니다. 요셉, 나의 형제도 그러하였습니다.
