revisions:
- from: 그러니 이제 너희는 주께서 사람의 아들들에게 심판을 행하실 것을 알라. 바위가 갈라지고 해가 꺼지며 물이 마르고 불이 움츠러들며 온 피조세계가 흔들리고, 보이지 않는 영들이 녹아 사라지며 지극히 높으신 분의 고난 때에 하데스가 약탈당할 때에도, 사람들은 불순종 가운데 머물며 자기의 불의에 계속 머물 것입니다. 그러므로 그들은 더 큰 형벌로 심판을 받게 될 것입니다.[a]
  to: 그러므로 이제 알아 두십시오. 주께서 사람들을 심판하실 것입니다. 바위들이 갈라지고, 해가 꺼지며, 물이 마르고, 불이 움츠러들며, 온 피조물이 흔들리고, 보이지 않는 영들이 녹아 사라지며, 지극히 높으신 분의 고난 때에 하데스가 약탈당할 때에도[a], 사람들은 불순종하면서 불의한 일을 계속할 것입니다. 그러므로 그들은 더 큰 형벌로 심판을 받을 것입니다.
  rationale: 단수 권면을 합쇼체로 자연스럽게 보존하고, ‘사람의 아들들’이라는 비관용적 직역을 문맥상 집합 명사인 ‘사람들’로 조정했습니다. 종말 표상의 병렬과 원문의 미래적 결론은 유지했으며, 불확실한 ‘지극히 높으신 분의 고난’ 구절 바로 뒤에 전승상 불확실성을 밝히는 각주를 추가했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:07Z'
review_pass:
  verdict: revise
  source_fidelity: 주요 종말 표상과 ‘지극히 높으신 분의 고난’이라는 불확실한 첨가 구절은 대체로 반영했습니다. 그러나 단수 명령형 γίνωσκε를 ‘너희는’으로 복수화했고, τοὺς υἱοὺς τῶν ἀνθρώπων은 이 문맥에서 자연스러운 집합적 의미로 옮기는 편이 적절합니다. 또한 ‘때에도’는 원문의 인과적 전개보다 양보를 다소 강하게 만듭니다.
  naturalness: ‘사람의 아들들’과 ‘자기의 불의에 계속 머물며’는 현대 표준 한국어에서 부자연스럽거나 불필요하게 중복됩니다. 합쇼체의 직접적인 권면으로 ‘알아 두십시오’를 사용하고, 병렬된 종말 묘사는 자연스러운 연결 어미로 정리하는 것이 좋습니다.
  terminology: Κύριος는 ‘주’, ᾅδης는 고유한 사후 세계 명칭인 ‘하데스’, κόλασις는 ‘형벌’로 유지할 수 있습니다. ‘온 피조세계’는 ‘온 창조세계’보다 통상적인 ‘온 피조물’이 κτίσις의 집합적 의미를 더 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: 단수 명령형이 복수 청자로 번역됨
    rationale: γίνωσκε는 단수 현재 명령형입니다. 한국어 합쇼체에서는 수를 명시하지 않는 ‘알아 두십시오’로 옮겨 원문의 단수를 불필요하게 변경하지 않는 것이 안전합니다.
  - severity: medium
    issue: ‘때에도’가 양보 의미를 과도하게 부가함
    rationale: Ὅτι 이하의 연속된 속격 절대구문은 이어지는 인간의 불순종과 심판을 뒷받침하는 종말적 상황입니다. ‘때에도’보다 ‘그때에도’ 또는 문맥상 ‘그러한 때에도’가 덜 부자연스럽고, 여기서는 ‘그때에도’로 최소한의 양보만 표현했습니다.
  - severity: low
    issue: ‘사람의 아들들’ 및 ‘자기의 불의에 계속 머물며’의 어색함
    rationale: 전자는 한국어 관용에 맞지 않으며, 후자는 ἐπιμένω + 여격의 ‘불의한 일들을 계속하다’라는 뜻을 중복적으로 표현합니다. ‘사람들’과 ‘불의한 일을 계속할’이 자연스럽습니다.
  - severity: medium
    issue: 본문의 텍스트상 불확실한 구절에 한국어 각주가 없음
    rationale: ‘ἐπὶ τῷ πάθει τοῦ ὑψίστου’는 대괄호 처리된 불확실한 구절이며, 영어 POB 감사 기록의 각주도 이를 명시합니다. 해당 표현 바로 뒤에 각주를 붙여야 합니다.
