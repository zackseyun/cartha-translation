- source_word: πετρῶν σχιζομένων / τοῦ ἡλίου σβεννυμένου / ὑδάτων ξηραινομένων / τοῦ πυρὸς καταπτήσσοντος / πάσης κτίσεως κλονουμένης / τῶν ἀοράτων πνευμάτων τηκομένων / τοῦ ᾅδου σκυλευομένου
  english_pob_choice: rocks are split / the sun is extinguished / waters dry up / fire cowers / all creation is shaken / the invisible spirits melt away / Hades is plundered
  chosen_korean: 바위가 갈라지고, 해가 꺼지며, 물이 마르고, 불이 움츠러들며, 온 피조세계가 흔들리고, 보이지 않는 영들이 녹아 사라지며, 하데스가 약탈당할 때
