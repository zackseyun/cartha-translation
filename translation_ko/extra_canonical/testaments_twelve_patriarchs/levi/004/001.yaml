  - 불이 떨며
  - 모든 창조물이 흔들리고
  - 보이지 않는 영들이 녹으며
  - 음부가 탈취당할 때
  lexicon: σχίζω / σβέννυμι / ξηραίνω / καταπτήσσω / κλονέω / τήκω / σκυλεύω
  rationale: 연속된 종말 묘사의 병렬성을 살리면서도 한국어로 자연스럽게 읽히도록 간결한 현재형 서술로 옮겼습니다.
- source_word: ἐν Γτῇ κολάσει
  english_pob_choice: with greater punishment
  chosen_korean: 더 큰 형벌로
