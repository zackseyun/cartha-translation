id: T12P.LEV.4.6
reference: Testament of Levi 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὅτι *οἱ εὐλογοῦντες⁴⁹ †αὐτὸν⁵⁰ εὐλογημένοι⁵¹ ἔσονται⁵² *καὶ οἱ⁵³ καταρώμενοι †αὐτὸν⁵⁰ ἀπολοῦνται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/006.yaml
  text: For those who bless him will be blessed, and those who curse him will perish.
translation:
  language: ko
  text: 그를 축복하는 이들은 복을 받고, 그를 저주하는 이들은 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εὐλογοῦντες / εὐλογημένοι ἔσονται
  english_pob_choice: those who bless him will be blessed
  chosen_korean: 그를 축복하는 이들은 복을 받고
  alternatives_korean:
  - 그를 축복하는 자들은 복을 받을 것이고
  - 그를 축복하는 이들은 복되게 될 것입니다
  lexicon: εὐλογέω
  rationale: 능동 분사와 수동 미래를 한국어에서 자연스럽게 대응시키되, 반복되는 축복-복됨의 대응을 살려 인과적 평행을 분명히 했습니다.
- source_word: καταρώμενοι
  english_pob_choice: curse
  chosen_korean: 저주하는
  alternatives_korean:
  - 저주하는
  - 저주를 퍼붓는
  lexicon: καταράομαι
  rationale: 문맥상 단순한 악담이 아니라 저주를 선포하는 행위를 가리키므로, ‘저주하는’이 가장 직접적입니다.
- source_word: ἀπολοῦνται
  english_pob_choice: will perish
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 멸망할 것입니다
  - 없어질 것입니다
  - 망할 것입니다
  lexicon: ἀπόλλυμι
  rationale: 단순한 죽음보다 최종적 파멸의 뉘앙스가 강해 ‘멸망하다’가 원문의 힘을 더 잘 살립니다.
theological_decisions:
- issue: 축복/저주의 보응 구조
  chosen_reading: 축복하는 자에게는 복이, 저주하는 자에게는 멸망이 따른다는 평행 구조를 그대로 살렸습니다.
  alternative_readings:
  - 도덕적 원리로 완화해 일반화하는 읽기
  - 예언적 선언을 약화시켜 권고문처럼 옮기는 읽기
  rationale: 헬라어 본문은 조건적 권고가 아니라 선언적 보응을 병렬로 제시하므로, 그 긴장과 확정성을 유지하는 것이 더 충실합니다.
  doctrine_reference: 보응과 심판에 관한 성경의 평행 구조
- issue: 대상 대명사 αὐτόν
  chosen_reading: ‘그’를 유지해 축복과 저주의 동일 대상을 드러냈습니다.
  alternative_readings:
  - 대상을 생략하는 읽기
  - ‘그 사람’을 덧붙여 풀어 쓰는 읽기
  rationale: 대명사는 본문에서 동일 인물을 가리키는 핵심 연결 장치이므로, 한국어에서도 반복해 지시를 보존했습니다.
  doctrine_reference: 문맥 내 대명사 지시 유지
