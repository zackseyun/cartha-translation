revisions:
- from: 그리고 복이 너와 네 모든 씨에게 주어질 것이며, 주께서 그의 아들의 친절한 긍휼 안에서 모든 민족을 찾아보실 때까지, 곧 영원히 그러할 것입니다.[a]
  to: 그리고 복이 너와 네 모든 후손에게 주어질 것이며, 주께서 그의 아들의 긍휼로 모든 민족을 찾아보실 때까지, 영원에 이르기까지 그러할 것입니다.[a]
  rationale: The revision replaces unnatural phrasing, uses standard Korean for collective descent, and avoids the unsupported explicative ‘곧.’ It keeps the source's difficult repeated temporal framing as closely as readable Korean permits, retains the uncertain ‘아들’ without doctrinal capitalization, and supplies a footnote covering the relevant textual uncertainty and longer variant.
