id: T12P.LEV.4.4
reference: Testament of Levi 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δοθήσεταί σοι εὐλογία *καὶ παντὶ τῷ σπέρματί σου³⁵ ἕως³⁶ ἐπισκέψεται³⁷ Κύριος πάντα τὰ ἔθνη³⁸ ἐν σπλάγχνοις [υἱοῦ]³⁹ αὐτοῦ *ἕως αἰῶνος⁴⁰. [Πλὴν⁴¹ οἱ υἱοί σου ἐπιβαλοῦσι χεῖρας *ἐπ᾿ αὐτὸν⁴² *τοῦ ἀνασκολοπίσαι⁴³ αὐτόν.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/004.yaml
  text: And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son[a] forever.
  footnotes:
  - marker: a
    text: Some witnesses expand this verse with an explicit statement that God will send 'his son' to save creation, and that Levi's sons will lay hands on him and impale him. The present translation follows the shorter wording of the supplied main text while retaining the bracketed 'son' in 'the tender mercies of his son' as textually uncertain.
    reason: textual_variant
    anchor_ref: '4:4'
translation:
  language: ko
  text: 그리고 복이 너와 네 모든 씨에게 주어질 것이며, 주께서 그의 아들의 친절한 긍휼 안에서 모든 민족을 찾아보실 때까지, 곧 영원히 그러할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοθήσεταί σοι εὐλογία
  english_pob_choice: And a blessing shall be given to you
  chosen_korean: 복이 너에게 주어질 것이며
  alternatives_korean:
  - 너에게 복이 주어질 것이며
  - 복이 네게 주어질 것입니다
  lexicon: δίδωμι + εὐλογία
  rationale: 수동형 미래를 살려 ‘주어질 것이며’로 옮기고, εὐλογία는 ‘복’으로 간단히 대응했습니다.
- source_word: σπέρματί σου
  english_pob_choice: to all your seed
  chosen_korean: 네 모든 씨에게
  alternatives_korean:
  - 네 모든 자손에게
  - 너의 후손에게
  lexicon: σπέρμα
  rationale: POB의 ‘seed’를 직역해 ‘씨’로 두어, 집단적 후손을 가리키는 상징성을 유지했습니다.
- source_word: ἐπισκέψεται Κύριος πάντα τὰ ἔθνη
  english_pob_choice: until the Lord visits all the nations
  chosen_korean: 주께서 ... 모든 민족을 찾아보실 때까지
  alternatives_korean:
  - 주께서 ... 모든 민족을 돌보실 때까지
  - 주께서 ... 모든 민족을 방문하실 때까지
  lexicon: ἐπισκέπτομαι
  rationale: ἐπισκέπτομαι의 돌보심/방문 뜻을 살리되, 심판적·구원적 개입 가능성을 열어 두기 위해 ‘찾아보시다’를 택했습니다.
- source_word: ἐν σπλάγχνοις [υἱοῦ] αὐτοῦ
  english_pob_choice: in the tender mercies of his son
  chosen_korean: 그의 아들의 친절한 긍휼 안에서
  alternatives_korean:
  - 그의 아들의 부드러운 긍휼 안에서
  - 그의 아들의 애끓는 긍휼 가운데
  lexicon: σπλάγχνα
  rationale: σπλάγχνα의 내장/자비 이미지를 ‘긍휼’로 옮기되, POB의 ‘tender mercies’를 반영해 ‘친절한’으로 보강했습니다.
theological_decisions:
- issue: '[υἱοῦ]의 텍스트 불확실성과 ‘Son’ 표기'
  chosen_reading: 본문에는 ‘그의 아들’로 옮기되, 괄호 처리 없이 본문 안에 자연스럽게 반영했습니다.
  alternative_readings:
  - ‘그의 아들’ 각주 처리
  - ‘그의 아들’ 삭제하여 ‘그의 긍휼’로 단순화
  rationale: 영어 POB가 bracketed ‘son’을 본문에 유지하는 편집 방침을 따르면서도, 한국어 본문은 문맥상 읽히도록 자연스럽게 구성했습니다.
  doctrine_reference: 텍스트 비평 / 본문 불확실성
- issue: 끝구의 ‘영원히’ 위치
  chosen_reading: ‘곧 영원히 그러할 것입니다’로 마무리해 ἕως αἰῶνος의 종결을 분명히 했습니다.
  alternative_readings:
  - 문장 끝에 ‘영원히’만 두기
  - ‘영원히’ 앞에 쉼표 처리
  rationale: 그리스어 종결구를 한국어 문장 말미에 자연스럽게 배치하여 시간 한계를 강조했습니다.
  doctrine_reference: 종말론적 시간 표현
