base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/003.yaml
  text: You shall shine the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.
translation:
  language: ko
  text: 당신은 야곱 가운데서 지식의 빛을 비추실 것이며, 이스라엘의 모든 자손에게 해와 같이 되실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φῶς γνώσεως
  english_pob_choice: the light of knowledge
  chosen_korean: 지식의 빛
  alternatives_korean:
  - 지식의 광명
  - 앎의 빛
  lexicon: φῶς / γνῶσις
  rationale: 소유격 구조를 자연스럽게 살리면서도 ‘빛’과 ‘지식’의 결합을 직접 드러내기 위해 ‘지식의 빛’으로 옮겼습니다.
- source_word: φωτιεῖς
  english_pob_choice: you shall shine the light
  chosen_korean: 비추며
  alternatives_korean:
  - 비추실 것입니다
  - 빛을 비출 것입니다
  lexicon: φωτίζω
  rationale: 동사의 의미를 ‘빛을 내다’보다 ‘비추다’로 옮겨, 앞의 ‘지식의 빛’과의 연결을 살렸습니다.
- source_word: ἐν τῷ Ἰακώβ
  english_pob_choice: in Jacob
  chosen_korean: 야곱 안에서
  alternatives_korean:
  - 야곱 가운데서
  - 야곱에서
  lexicon: Ἰακώβ
  rationale: 장소·범위의 전치사구로 읽히므로 ‘안에서’를 택해 의미를 분명히 했습니다.
- source_word: σπέρματι Ἰσραήλ
  english_pob_choice: all the seed of Israel
  chosen_korean: 이스라엘의 모든 씨
  alternatives_korean:
  - 이스라엘의 모든 자손
  - 이스라엘의 모든 후손
  lexicon: σπέρμα
  rationale: 영어 POB의 ‘seed’를 그대로 반영해 직역성을 유지했고, 혈통적/언약적 집단을 가리키는 표현으로 보존했습니다.
theological_decisions:
- issue: ‘seed of Israel’의 표현 유지 여부
  chosen_reading: ‘이스라엘의 모든 씨’로 유지했습니다.
  alternative_readings:
  - ‘이스라엘의 모든 자손’
  - ‘이스라엘의 모든 후손’
  rationale: 본문과 POB의 의도 모두 σπέρμα를 문자적으로 드러내는 데 있으므로, 전통적 의역보다 원문 표지를 보존하는 편이 더 적절합니다.
  doctrine_reference: 언약 공동체와 후손 표지에 대한 본문적 표현 보존
