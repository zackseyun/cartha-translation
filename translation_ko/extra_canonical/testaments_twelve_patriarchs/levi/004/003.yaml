  to: 당신은 야곱 가운데서 지식의 빛을 비추실 것이며, 이스라엘의 모든 자손에게 해와 같이 되실 것입니다.
  rationale: 원문의 미래 병렬 구조를 ‘비추실 것이며 … 되실 것입니다’로 보존했습니다. ‘지식의 빛’과 ‘해와 같이’는 직역적 이미지를 유지하되, σπέρματι Ἰσραήλ은 사람들을 뜻하는 문맥에 맞춰 자연스러운 현대 한국어인 ‘이스라엘의 모든 자손에게’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
