review_pass:
  verdict: revise
  source_fidelity: 원문의 두 미래 직설법(φωτιεῖς, ἔσῃ)을 한국어에서도 미래의 병렬 서술로 밝혀야 합니다. 또한 παντὶ σπέρματι Ἰσραήλ의 여격은 ‘이스라엘의 모든 자손에게’로 옮기는 것이 자연스럽고 문법적으로도 더 정확합니다.
  naturalness: 초안의 ‘비추며’는 미래 예언의 독립 절을 단순 연결절로 약화시키며, ‘이스라엘의 모든 씨’는 현대 표준 한국어에서 사람 집단을 가리키는 표현으로 부자연스럽습니다. ‘야곱 가운데서’와 ‘모든 자손에게’가 자연스럽습니다.
  terminology: ‘지식의 빛’은 Φῶς γνώσεως를 충실히 반영합니다. σπέρμα는 이 문맥에서 식물의 씨가 아니라 이스라엘의 후손·자손 집단이므로 ‘자손’이 적절합니다. ‘해와 같이’는 ὡς ἥλιος를 유지합니다.
  issues:
  - severity: medium
    issue: 첫 동사의 시제·절 관계
    rationale: φωτιεῖς는 미래 직설법인데 초안의 ‘비추며’는 연결 어미여서 뒤 절에 종속되고 미래성이 명시되지 않습니다.
  - severity: medium
    issue: σπέρματι의 번역과 여격 처리
    rationale: ‘이스라엘의 모든 씨’는 현대 한국어에서 부자연스럽고, 원문의 여격 ‘παντὶ σπέρματι’가 나타내는 대상 관계도 드러나지 않습니다. ‘이스라엘의 모든 자손에게’가 문맥과 문법을 함께 보존합니다.
  - severity: low
    issue: ἐν τῷ Ἰακώβ의 자연스러운 표현
    rationale: 공동체를 가리키는 ‘야곱’과 함께 쓰인 ἐν은 ‘야곱 가운데서’가 ‘야곱 안에서’보다 현대 한국어에서 자연스럽습니다.
  revised_text: 당신은 야곱 가운데서 지식의 빛을 비추실 것이며, 이스라엘의 모든 자손에게 해와 같이 되실 것입니다.
