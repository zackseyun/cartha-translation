- from: 그런 까닭에 너에게 지략과 분별력이 주어졌으니, 네 아들들에게 이것에 대해 가르치게 하려는 것입니다.
  to: 그러므로 네가 네 아들들에게 이 일에 관하여 가르치도록, 네게 조언과 이해력이 주어졌습니다.
