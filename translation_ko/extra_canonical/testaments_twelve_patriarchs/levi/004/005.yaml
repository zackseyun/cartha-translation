  text: And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.
translation:
  language: ko
  text: 그러므로 네가 네 아들들에게 이 일에 관하여 가르치도록, 네게 조언과 이해력이 주어졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  english_pob_choice: And for this reason
  chosen_korean: 그런 까닭에
  alternatives_korean:
  - 이 때문에
  - 그러므로
  lexicon: διά τοῦτο
  rationale: 원인-결과 관계를 자연스러운 현대 한국어로 간결하게 살리되, 문맥상의 논리 연결을 분명히 했습니다.
- source_word: βουλὴ
  english_pob_choice: counsel
  chosen_korean: 지략
  alternatives_korean:
  - 조언
  - 계책
  - 충언
  lexicon: βουλή
  rationale: 단순한 ‘조언’보다 더 능동적이고 통찰적인 판단 능력을 드러내는 말로, 여기서는 지혜로운 판단의 성격을 살렸습니다.
- source_word: σύνεσις
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해
  - 깨달음
  - 통찰
  lexicon: σύνεσις
  rationale: 문맥상 단순 지식이 아니라 사안을 구별하여 이해하는 능력을 가리키므로 ‘분별력’이 가장 적합합니다.
- source_word: τοῦ συνετίσαι
  english_pob_choice: so that you may instruct
  chosen_korean: 가르치게 하려는 것입니다
  alternatives_korean:
  - 깨닫게 하려는 것입니다
  - 이해시키려는 것입니다
  lexicon: συνιέναι
  rationale: 목적절의 기능을 살리면서, 아들들에게 내용을 전달하는 교육적 행위를 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지혜의 수여 목적
  chosen_reading: 지략과 분별력은 개인적 자랑이 아니라 자녀 교육을 위해 주어진 것으로 읽었습니다.
  alternative_readings:
  - 개인적 통치 역량을 위한 수여로만 읽는 것
  - 일반적 지혜의 축복으로만 읽는 것
  rationale: 문장 끝의 목적절이 수여의 용도를 분명히 밝히므로, 지혜의 선물이 다음 세대 전수라는 신학적 방향을 갖는다고 보았습니다.
  doctrine_reference: 지혜의 선물과 계승 교육
