id: T12P.LEV.4.2
reference: Testament of Levi 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Εἰσήκουσεν¹⁷ Γοὖν¹⁸ ὁ ὕψιστος τῆς προσευχῆς¹⁹ σου *τοῦ διελεῖν²⁰ σε ἀπὸ²¹ ἀδικίας²² καὶ γενέσθαι αὐτῷ²³ *υἱὸν καὶ θεράποντα²⁴ καὶ λειτουργὸν²⁵ τοῦ προσώπου αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/002.yaml
  text: Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister before him.
translation:
  language: ko
  text: 그러므로 지극히 높으신 분께서 당신을 불의에서 떼어 내시고 그분의 아들이 되며 종이 되고 그분 앞에서 섬기는 이가 되게 하시려고 당신의 기도를 들으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος / the Most High
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: ὕψιστος
  rationale: 하나님을 가리키는 존칭을 유지하면서도 현대 한국어에서 자연스럽고 격식을 갖춘 표현으로 옮겼습니다.
- source_word: ἀδικίας / unrighteousness
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불의함
  - 의로움 없음
  lexicon: ἀδικία
  rationale: 윤리적·신학적 대비를 살리는 핵심어이므로, 공인된 성경용어인 ‘불의’를 사용했습니다.
- source_word: θεράποντα / servant
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 종사자
  - 섬기는 자
  lexicon: θεράπων
  rationale: 이 본문은 단순한 봉사자가 아니라 주인에게 속한 종의 관계를 강조하므로, POB의 기본 용례에 맞춰 ‘종’으로 옮겼습니다.
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ / a minister before him
  english_pob_choice: a minister before him
  chosen_korean: 그분 앞의 일꾼
  alternatives_korean:
  - 그분 앞에서 섬기는 자
  - 그분의 면전에서의 사역자
  lexicon: λειτουργός
  rationale: ‘minister’의 제의적·공적 섬김 뉘앙스를 살리되, ‘toῦ προσώπου’의 직역인 ‘앞에/면전에서’를 반영해 과도한 교회직분 언어를 피했습니다.
theological_decisions:
- issue: 삼중 호칭(아들-종-일꾼)의 관계
  chosen_reading: 세 관계를 모두 병렬로 유지하여, 하나님과의 신분·봉사·직무가 함께 제시되도록 했습니다.
  alternative_readings:
  - ‘아들이며 종이며 사역자’로 순화
  - ‘아들로서 섬기는 자’로 통합
  rationale: 원문은 관계를 겹쳐서 서술하므로, 하나로 풀어버리기보다 병렬 구조를 보존하는 것이 의미를 가장 잘 드러냅니다.
  doctrine_reference: 본문의 소명과 헌신의 묘사
