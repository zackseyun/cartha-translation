  - 그의 아들들이 그에게 대답하여 이르렀습니다
  lexicon: ἀποκρίνομαι / λέγω
  rationale: 대답-말하다의 이중 동사를 유지해 응답 장면의 구어성을 살리되, 합쇼체 서술로 정리했습니다.
