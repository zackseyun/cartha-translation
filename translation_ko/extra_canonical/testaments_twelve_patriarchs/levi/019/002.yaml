lexical_decisions:
- source_word: Καὶ ἀπεκρίθησαν αὐτῷ οἱ υἱοὶ αὐτοῦ λέγοντες
  english_pob_choice: And his sons answered him, saying
  chosen_korean: 그리고 그의 아들들이 그에게 대답하여 말했습니다
