  lexicon: πορεύομαι
  rationale: 단순한 이동보다 삶의 행로와 행위를 포함하는 상징적 의미를 살려 ‘걷다’로 옮겼습니다.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  english_pob_choice: according to his law
  chosen_korean: 그분의 율법에 따라
  alternatives_korean:
