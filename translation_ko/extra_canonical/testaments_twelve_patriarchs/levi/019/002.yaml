  lexicon: ἐνώπιον + κύριος
  rationale: ἐνώπιον의 ‘~앞에서’라는 위치·관계 의미를 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: πορευσόμεθα
  english_pob_choice: we will walk
  chosen_korean: 우리는 … 걸을 것입니다
  alternatives_korean:
