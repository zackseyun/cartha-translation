id: T12P.LEV.19.1
reference: Testament of Levi 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν, τέκνα μου¹, πάντα ἠκούσατε². Ἐκλέξασθε³ ἑαυτοῖς *ἢ τὸ φῶς ἢ τὸ σκότος⁴, ἢ τὸν⁵ νόμον⁶ κυρίου, ἢ *τὰ ἔργα τοῦ Βελίαρ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/001.yaml
  text: And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar.
translation:
  language: ko
  text: 이제 내 자녀들아, 너희는 모든 것을 들었습니다. 너희 스스로 빛이나 어둠을, 주님의 율법이나 벨리아르의 행위들을 선택하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자녀들이여
  lexicon: τέκνα
  rationale: 직접 호칭의 친밀함과 권면성을 살리되, 현대 합쇼체 문맥에 맞게 자연스러운 부름말로 옮겼습니다.
- source_word: Ἐκλέξασθε ἑαυτοῖς
  english_pob_choice: Choose for yourselves
  chosen_korean: 스스로 선택하십시오
  alternatives_korean:
  - 너희를 위해 선택하십시오
  - 자기들을 위해 택하십시오
  lexicon: ἐκλέγομαι
  rationale: 명령형의 결단 요구를 분명히 드러내면서, 한국어에서 자연스러운 반사적 표현으로 처리했습니다.
- source_word: τὸ φῶς / τὸ σκότος
  english_pob_choice: the light / the darkness
  chosen_korean: 빛 / 어둠
  alternatives_korean:
  - 광명 / 흑암
  - 빛 / 흑암
  lexicon: φῶς / σκότος
  rationale: 대조 구조를 유지하면서, 빛-어둠의 상징 대립을 가장 직접적으로 전달하는 기본어를 택했습니다.
- source_word: τὸν νόμον κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 율례
  lexicon: νόμος
  rationale: νόμος의 기본 대응인 ‘율법’을 유지해 토라적·언약적 뉘앙스를 보존했습니다.
- source_word: τὰ ἔργα τοῦ Βελίαρ
  english_pob_choice: the works of Beliar
  chosen_korean: 벨리아르의 행위들
  alternatives_korean:
  - 벨리아르의 일들
  - 벨리아르의 소행들
  lexicon: ἔργα
  rationale: ἔργα를 단순한 ‘일’보다 도덕적 실천의 대비가 드러나는 ‘행위들’로 옮겨, 앞의 율법과의 대조를 살렸습니다.
theological_decisions:
- issue: 선택의 이중 대조(빛/어둠, 주님의 율법/벨리아르의 행위들)
  chosen_reading: 문장 구조를 그대로 따라 두 개의 대조 쌍을 병렬로 제시했습니다.
  alternative_readings:
  - ‘혹은’ 대신 ‘또는’으로 순화
  - 의미를 풀어 ‘하나님의 뜻과 악의 길’로 의역
  rationale: 원문과 POB가 요구하는 결단의 압박감을 약화하지 않기 위해, 반복되는 ἢ ... ἢ ... 구조를 직접적으로 보존했습니다.
  doctrine_reference: 지혜문학/훈계 전통의 양자택일 권면
- issue: Βελίαρ의 음역
  chosen_reading: 벨리아르
  alternative_readings:
  - 벨리알
  - 벨리아르
  rationale: 원문 고유명사를 직역하지 않고 음역해, 인격화된 악의 세력이라는 고대 유대 문헌적 배경을 유지했습니다.
  doctrine_reference: 제2성전기 유대교 악의 명명 관행
