base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/003.yaml
  text: And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him, “We are witnesses.”
translation:
  language: ko
  text: 그들의 아버지가 그들에게 말했습니다. “주님은 증인이십니다. 그분의 천사들도 증인입니다. 너희도 증인입니다. 나도 너희 입에서 나온 말에 관하여 증인입니다.” 그러자 그의 아들들이 그에게 말했습니다. “우리는 증인입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 여기서는 직접 인용문 안에서 신적 호칭으로 쓰였지만, 본문만으로는 구약 인용 표지가 분명하지 않으므로 POB의 기본값인 주님을 유지했습니다.
- source_word: μάρτυς / μάρτυρες
  english_pob_choice: witness / witnesses
  chosen_korean: 증인 / 증인입니다
  alternatives_korean:
  - 증거자
  - 증언자
  lexicon: μάρτυς
  rationale: 법정·증언 맥락의 반복어이므로 한국어에서도 일관되게 증인으로 옮겨, 진술의 공식성과 반복 효과를 살렸습니다.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  english_pob_choice: concerning the word of your mouth
  chosen_korean: 너희 입의 말에 대하여
  alternatives_korean:
  - 너희 입에서 나온 말에 대하여
  - 너희가 입으로 한 말에 대하여
  lexicon: λόγος / στόμα
  rationale: 직역된 구조를 과도하게 굳히지 않으면서도 ‘입의 말’이라는 원문의 결합을 유지해 발화 책임을 드러냈습니다.
theological_decisions:
- issue: 마지막 아들들의 응답
  chosen_reading: “우리는 증인입니다.”로 자연스러운 집단 응답을 살렸습니다.
  alternative_readings:
  - “증인들입니다.”
  - “증인.”
  rationale: 영어 POB의 수정 취지를 따라 헬라어 μάρτυρες의 응답을 한국어로도 완전한 자아진술로 만들어, 단순 명사 나열처럼 들리지 않게 했습니다.
  doctrine_reference: 서술·응답의 자연스러운 화법 처리
