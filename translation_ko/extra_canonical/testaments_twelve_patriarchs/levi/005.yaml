base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005.yaml
  text: 'And in this[a], the angel opened to me the gates of heaven, and I saw the holy Most High seated on a throne.


    2 And he said to me, “Levi, to you I have given the blessings of the priesthood until, having come, I dwell in the midst of Israel.”


    3 Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Carry out vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”


    4 And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers[b].


    5 And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in a day of affliction.”


    6 And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down utterly; for every evil spirit attacks it.”


    7 And after this, when I awoke, I blessed the Most High.'
  footnotes:
  - marker: a
    text: Greek literally, 'on the tablets of the fathers.' In this apocalyptic context this likely refers to heavenly tablets, though the adjective 'heavenly' is not explicit in the surviving text.
    reason: lexical_alternative
  - marker: b
    text: The Greek of verse 6 is textually difficult. Some witnesses expand the line to 'so that they may not be struck down utterly,' clarifying the angel's protective role.
    reason: textual_variant
translation:
  language: ko
  text: '그리고 이 일로 말미암아 천사가 내게 하늘의 문들을 열어 주었습니다. 나는 보좌에 앉아 계신 거룩하신 가장 높으신 분을 보았습니다.


    2 그리고 그분이 내게 말씀하셨습니다. “레위야, 내가 너에게 제사장직의 복들을 주었으니, 내가 와서 이스라엘 한가운데에 거할 때까지이다.”


    3 그때 천사가 나를 땅으로 내려오게 하고, 내게 무기와 칼을 주며 말했습니다. “세겜에서 네 누이 디나를 위해 원수를 갚아라. 그러면 내가 너와 함께하겠다. 주께서 나를 보내셨기 때문이다.”


    4 그리하여 나는 그때에 하몰의 아들들을 멸했습니다. 그것은 조상들의 판에 기록된 그대로입니다.


    5 나는 그에게 말했습니다. “주님, 간구하오니, 당신의 이름을 내게 가르쳐 주십시오. 그러면 내가 환난의 날에 당신을 부를 수 있습니다.”


    6 그가 말했습니다. “나는 이스라엘의 족속을 위해 중보하는 천사이다. 그들이 완전히 쓰러지지 않게 하려는 것이다. 이는 모든 악한 영이 그것을 공격하기 때문이다.”


    7 그리고 이 일 뒤에 내가 깨어났을 때, 나는 가장 높으신 분을 찬송했습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἅγιον ὕψιστον
  english_pob_choice: the holy Most High
  chosen_korean: 거룩하신 가장 높으신 분
  alternatives_korean:
  - 거룩한 가장 높으신 분
  - 가장 거룩하신 분
  lexicon: LSJ
  rationale: visionary title로서 두 형용사의 격조를 살리되, 한국어에서는 자연스럽게 인격적 호칭으로 옮겼습니다.
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  english_pob_choice: the blessings of the priesthood
  chosen_korean: 제사장직의 복들
  alternatives_korean:
  - 제사장직의 축복들
  - 제사장직에 속한 복들
  lexicon: LSJ
  rationale: 단순한 '축복 행위'가 아니라 제사장 직분에 속한 복수의 특권/복을 가리키므로 소유관계를 살렸습니다.
- source_word: ὅπλον καὶ ῥομφαίαν
  english_pob_choice: a weapon and a sword
  chosen_korean: 무기와 칼
  alternatives_korean:
  - 무장과 칼
  - 무기와 검
  lexicon: LSJ
  rationale: POB의 최종 선택을 따라 ὅπλον의 일반적 의미를 유지하고, ῥομφαία는 현대 한국어에서 이해되는 칼로 옮겼습니다.
- source_word: τοὺς υἱοὺς Ἐμμώρ
  english_pob_choice: the sons of Hamor
  chosen_korean: 하몰의 아들들
  alternatives_korean:
  - 함몰의 아들들
  - 하모르의 아들들
  lexicon: LSJ
  rationale: 고유명사는 통용되는 음역을 따르되, 본문 동사 συνετέλεσα의 종결적 폭력을 반영하여 '멸했습니다'로 옮겼습니다.
- source_word: ἐν πλαξὶ τῶν πατέρων
  english_pob_choice: on the tablets of the fathers
  chosen_korean: 조상들의 판
  alternatives_korean:
  - 조상들의 판에
  - 조상들의 돌판
  lexicon: LSJ
  rationale: '''heavenly''를 본문에 덧붙이지 않고, 그리스어가 말하는 대로 ''판''을 유지하여 계시적 기록의 이미지를 과장하지 않았습니다.'
- source_word: ὁ ἄγγελος ὁ παραιτούμενος τὸ γένος Ἰσραήλ
  english_pob_choice: the angel who intercedes for the race of Israel
  chosen_korean: 이스라엘의 족속을 위해 중보하는 천사
  alternatives_korean:
  - 이스라엘 족속을 위해 간구하는 천사
  - 이스라엘의 민족을 위해 변호하는 천사
  lexicon: LSJ
  rationale: 문맥상 보호적·매개적 역할을 나타내므로, POB의 해석을 따라 '중보하는'으로 옮겨 천사의 기능을 분명히 했습니다.
theological_decisions:
- issue: 2절의 1인칭 발화 주체
  chosen_reading: 보좌에 앉아 계신 가장 높으신 분의 직접 발화로 보존했습니다.
  alternative_readings:
  - 천사가 하나님의 뜻을 대변해 말하는 것으로 완화할 수 있습니다.
  - 발화 층위가 혼재한 전승적 흔적으로 볼 수 있습니다.
  rationale: 본문은 먼저 지극히 높으신 분의 보좌 장면을 제시한 뒤 직접 화법으로 이어지므로, 그 첫인칭 약속을 중화하지 않는 것이 본문 긴장을 가장 잘 보존합니다.
  doctrine_reference: 계시적 발화의 층위를 평준화하지 않고 문맥 긴장을 유지함
- issue: 6절의 천사 기능
  chosen_reading: 이스라엘을 위해 중보하며 파멸을 막는 보호자 역할로 옮겼습니다.
  alternative_readings:
  - 이스라엘을 거부하거나 물러서는 천사로 볼 수 있습니다.
  - 단순히 이스라엘 위에 세워진 통치적 천사로 볼 수 있습니다.
  rationale: 주어진 그리스어는 난해하지만, POB의 본문 전통과 이어지는 목적절('완전히 쓰러지지 않게')은 보호적 중보를 가장 잘 지지합니다.
  doctrine_reference: 천사론 일반보다 본문이 드러내는 보호적 중보 기능을 우선함
