  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/010.yaml
  text: Therefore take for yourself a wife while you are still young, one who has no blemish or defilement, and not from the stock of foreign nations.
translation:
  language: ko
  text: 그러므로 아직 젊을 때에, 흠이 없고 더럽혀지지 않았으며 이방 민족들의 혈통에서 난 아내가 아닌 아내를 스스로 맞이하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λαβὲ οὖν σεαυτῷ γυναῖκα
  english_pob_choice: take for yourself a wife
  chosen_korean: 너 자신을 위해 아내를 맞이하십시오
  alternatives_korean:
  - 아내를 취하십시오
  - 아내를 데려오십시오
  lexicon: λαμβάνω
  rationale: ‘take for yourself’의 자기 지향성을 살리되, 한국어에서는 혼인 맥락에서 자연스러운 ‘아내를 맞이하다’로 옮겼습니다.
- source_word: ἔτι νέος ὤν
  english_pob_choice: while you are still young
  chosen_korean: 아직 젊을 때
  alternatives_korean:
  - 아직 젊은 상태일 때
  - 여전히 젊은 동안
  lexicon: νέος
  rationale: 시간 부사절의 의미를 간결하게 살려, 혼인 권고의 시점성을 분명히 했습니다.
- source_word: μὴ ἔχουσαν μῶμον μήτε βεβηλωμένην
  english_pob_choice: one who has no blemish or defilement
  chosen_korean: 흠이나 더러움이 없고
  alternatives_korean:
  - 점도 더러움도 없고
  - 흠집이나 더러움이 없고
  lexicon: μῶμος / βεβηλόω
  rationale: POB가 구분한 두 표현을 한국어에서도 분리된 부정어로 반영해, 도덕적·의례적 부정성을 함께 드러냈습니다.
- source_word: ἀπὸ γένους ἀλλοφύλων ἐθνῶν
  english_pob_choice: not from the stock of foreign nations
  chosen_korean: 이방 민족의 혈통에서 나온 사람이 아닌
  alternatives_korean:
  - 외국 민족의 가문에서 나온 사람이 아닌
  - 타민족 출신이 아닌
  lexicon: γένος / ἀλλόφυλος / ἔθνος
  rationale: ‘stock’를 직역하기보다 혈통·출신을 나타내는 표현으로 옮겨, 혼인 상대의 민족적 출처 제한을 드러냈습니다.
theological_decisions:
- issue: 혼인 상대의 민족적 제한을 어떻게 드러낼지
  chosen_reading: ‘이방 민족의 혈통에서 나온 사람이 아닌’으로, 출신 제한이 단순한 사회적 편견이 아니라 본문이 말하는 정체성 경계임을 유지했습니다.
  alternative_readings:
  - ‘외국 민족 출신이 아닌’으로 완화
  - ‘다른 민족 가문이 아닌’으로 중립화
  rationale: 본문은 단순한 거주지나 문화 취향이 아니라 혈통/민족 범주를 사용하므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 본문 주석적 번역 원칙
