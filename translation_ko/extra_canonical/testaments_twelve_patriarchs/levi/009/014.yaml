id: T12P.LEV.9.14
reference: Testament of Levi 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *παντὸς πρωτογεννήματός σου⁶⁰ καὶ οἴνου⁶¹ πρόσφερε *ἀπαρχὰς εἰς θυσίαν Κυρίῳ⁶² Γτῷ θεῷ⁶³⁾. *Καὶ πᾶσαν θυσίαν ἅλατι ἁλιεῖς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/014.yaml
  text: And of all your first produce and of wine offer firstfruits as a sacrifice to the Lord God. And every sacrifice you shall salt with salt.
translation:
  language: ko
  text: 그리고 너의 모든 첫 소출과 포도주에서 첫열매를 주 하나님께 드리는 제물로 바치십시오. 그리고 모든 제물에는 소금을 치십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς πρωτογεννήματός σου καὶ οἴνου
  english_pob_choice: of all your first produce and of wine
  chosen_korean: 너의 모든 첫 소출과 포도주에서
  alternatives_korean:
  - 너의 모든 첫 열매와 포도주에서
  - 너의 모든 처음 난 소산과 포도주에서
  lexicon: πρωτογέννημα, οἶνος
  rationale: πρωτογεννήματός는 농산물의 ‘첫 소출’로 자연스럽고, οἴνου는 문자적으로 ‘포도주’이므로 두 대상을 함께 살려 번역했습니다.
- source_word: ἀπαρχὰς
  english_pob_choice: firstfruits
  chosen_korean: 첫열매
  alternatives_korean:
  - 첫 몫
  - 처음 수확물
  lexicon: ἀπαρχή
  rationale: 제의적 헌납어로서 ‘첫열매’가 가장 직접적이며, 뒤의 ‘제물로 바치십시오’와도 잘 맞습니다.
- source_word: εἰς θυσίαν
  english_pob_choice: as a sacrifice
  chosen_korean: 제물로 바치십시오
  alternatives_korean:
  - 희생 제물로 드리십시오
  - 희생으로 바치십시오
  lexicon: θυσία
  rationale: 여기서는 단순 명사가 아니라 제의 행위를 요구하므로, 한국어에서도 동작을 분명히 드러내는 표현을 택했습니다.
- source_word: Κυρίῳ Γτῷ θεῷ
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님께
  alternatives_korean:
  - 주 하나님에게
  - 주님 하나님께
  lexicon: κύριος, θεός
  rationale: 문맥상 예배 대상의 호칭이므로 ‘주 하나님께’로 간결하게 살렸고, 기사어 없이도 원문처럼 밀착된 호칭을 유지했습니다.
- source_word: ἅλατι ἁλιεῖς
  english_pob_choice: you shall salt with salt
  chosen_korean: 소금을 치십시오
  alternatives_korean:
  - 소금으로 간을 하십시오
  - 소금을 더하십시오
  lexicon: ἅλας
  rationale: 직역하면 반복이 생기므로, 한국어 관용에 맞게 제의적 ‘소금을 치다’로 옮기되 소금의 필수성을 보존했습니다.
theological_decisions:
- issue: 제의적 헌납과 음식 재료의 병렬 표현
  chosen_reading: ‘첫 소출과 포도주’ 및 ‘첫열매’를 함께 살려, 농산물과 포도주의 첫 몫을 하나님께 드리는 제의 규정을 그대로 드러냈습니다.
  alternative_readings:
  - ‘모든 첫 소출과 포도주에서 첫열매’의 중복을 줄여 단순화할 수 있음
  - ‘첫 수확물’로 일반화할 수 있음
  rationale: 본문은 두 항목을 병렬로 제시하므로 둘 다 유지해야 제의적 범위와 강조가 보존됩니다.
  doctrine_reference: 헌물/제사 규정의 문맥 보존
