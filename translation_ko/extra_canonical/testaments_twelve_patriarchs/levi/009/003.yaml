  text: And when we came to Bethel, my father Jacob saw a vision about me, that I would be a priest to them.
translation:
  language: ko
  text: 그리고 우리가 벧엘에 이르렀을 때, 내 아버지 야곱은 나에 관한 환상을 보았는데, 내가 그들에게 제사장이 될 것이라는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βεθήλ
  english_pob_choice: Bethel
  chosen_korean: 벧엘
  alternatives_korean:
  - 베델
  lexicon: 지명
  rationale: 성경에서 널리 통용되는 표기를 따랐습니다.
- source_word: ὅραμα
  english_pob_choice: vision
  chosen_korean: 환상
  alternatives_korean:
  - 이상
  - 계시
  lexicon: ὅραμα
  rationale: 시각적·계시적 체험을 함께 담는 표준적 번역으로, 문맥상 야곱이 본 신적 계시를 자연스럽게 드러냅니다.
- source_word: περὶ ἐμοῦ
  english_pob_choice: about me
  chosen_korean: 나에 관한
  alternatives_korean:
  - 내게 관한
  - 나에 대하여
  lexicon: περί + 속격
  rationale: 청자에게 부드럽고도 직접적인 대응을 위해 ‘나에 관한’으로 옮겼고, 영어 POB의 최신 조정(about me)과도 맞춥니다.
- source_word: εἰς ἱερέα
  english_pob_choice: to be a priest to them
  chosen_korean: 그들에게 제사장이 될 것
  alternatives_korean:
  - 그들을 위한 제사장이 될 것
  - 그들에게 제사장이 되리라는 것
  lexicon: εἰς + 목적격 / ἱερεύς
  rationale: εἰς αὐτοῖς의 방향성을 살려 ‘그들에게’로 옮기고, 직분은 성경적 용례에 따라 ‘제사장’으로 번역했습니다.
theological_decisions:
- issue: 야곱이 본 환상의 성격
  chosen_reading: 이 구절은 야곱의 일반적 꿈이 아니라, 아들을 향한 소명과 제사장직을 예고하는 계시적 환상으로 읽었습니다.
  alternative_readings:
  - 단순한 꿈으로 볼 수 있음
  - 가족적 예언의 상징적 장면으로만 볼 수 있음
  rationale: 본문의 초점이 ‘내가 그들에게 제사장이 될 것’이라는 भविष्य적 소명에 있으므로, 환상을 신적 계시의 성격으로 반영하는 것이 가장 충실합니다.
  doctrine_reference: 계시와 소명
