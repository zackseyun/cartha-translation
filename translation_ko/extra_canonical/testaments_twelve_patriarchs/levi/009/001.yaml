  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/001.yaml
  text: And after two days, I and Judah went up with our father Jacob to Isaac our grandfather.
translation:
  language: ko
  text: 이틀 후에 나와 유다는 우리 아버지 야곱과 함께 우리 할아버지 이삭에게 올라갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ μεθ’ ἡμέρας δύο
  english_pob_choice: And after two days
  chosen_korean: 이틀 후에
  alternatives_korean:
  - 이틀이 지난 뒤에
  - 이틀 뒤에
  lexicon: μετά + 시간표현
  rationale: 시간 경과를 간결하고 자연스럽게 살리되, 원문의 순서감(‘두 날 뒤’)을 한국어에서 가장 무리 없이 표현했습니다.
- source_word: ἀνέβην
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 올라갔습니다
  lexicon: ἀναβαίνω
  rationale: 지리적 이동이면서 예루살렘식 성소 상승이 아니라 단순 이동이므로, 원문의 ‘올라가다’라는 방향성을 유지했습니다.
- source_word: μετὰ τοῦ πατρὸς ἡμῶν Ἰακώβ
  english_pob_choice: with our father Jacob
  chosen_korean: 우리 아버지 야곱과 함께
  alternatives_korean:
  - 우리 아버지 야곱과
  - 우리의 아버지 야곱과 함께
  lexicon: μετά + γεν.
  rationale: 동행 관계를 분명히 드러내기 위해 ‘함께’를 보충했고, 소유격 뉘앙스는 자연스러운 한국어 어순으로 처리했습니다.
- source_word: πρὸς Ἰσαάκ
  english_pob_choice: to Isaac
  chosen_korean: 이삭에게
  alternatives_korean:
  - 이삭에게
  - 이삭을 만나러
  lexicon: πρός + 대격
  rationale: 도착·면회 방향을 가장 सीधे하게 나타내는 한국어 여격을 택했습니다.
- source_word: προπάτορα ἡμῶν
  english_pob_choice: our grandfather
  chosen_korean: 우리 조상
  alternatives_korean:
  - 우리 조상
  - 우리 증조상
  lexicon: προπάτωρ
  rationale: 영어 POB의 ‘grandfather’보다 원문의 친족 호칭은 더 넓은 선조 의미를 가질 수 있어, 한국어에서는 오해를 줄이도록 ‘조상’으로 옮겼습니다.
theological_decisions:
- issue: 이삭의 호칭 범위
  chosen_reading: ‘우리 조상 이삭’으로 옮겨 혈연적 조상 관계를 분명히 하되, 불필요하게 후손 세대 차이를 좁히지 않았습니다.
  alternative_readings:
  - 우리 할아버지 이삭
  - 우리 증조부 이삭
  rationale: προπάτωρ는 단순한 ‘할아버지’보다 더 넓은 조상 개념을 담을 수 있어, 한국어에서는 과도한 세대 특정 없이 원문의 존칭·계보 감각을 살렸습니다.
  doctrine_reference: 족보/계보 표현의 정확성
- issue: 상승 동사의 선택
  chosen_reading: ‘올라갔습니다’로 유지했습니다.
  alternative_readings:
  - 갔습니다
  rationale: ἀνέβην의 방향성은 단순 이동보다 ‘오르다’가 더 직접적으로 대응하므로, 지리적 상승 이미지를 보존했습니다.
  doctrine_reference: 원문 방향성 보존
