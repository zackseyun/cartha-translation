  terminology: 야곱과 이삭의 통용 성서 표기를 유지했습니다. προπάτωρ는 여기서 ‘조상’보다 구체적인 ‘할아버지’로 옮기는 것이 계보 관계와 영어 감사본 모두에 충실합니다.
