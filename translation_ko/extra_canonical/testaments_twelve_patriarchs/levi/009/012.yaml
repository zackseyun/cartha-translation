  text: From twelve trees having leaves, then offer to the Lord, as Abraham taught me.
translation:
  language: ko
  text: 그러므로 잎이 있는 열두 그루의 나무에서 주님께 드리십시오. 아브라함이 내게 가르쳐 준 대로 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δώδεκα οὖν δένδρων ἐχόντων φύλλα
  english_pob_choice: From twelve trees having leaves, then
  chosen_korean: 잎사귀가 달린 열두 그루의 나무로부터는
  alternatives_korean:
  - 잎사귀가 있는 열두 그루의 나무로부터는
  - 잎이 달린 열두 그루의 나무로부터는
  lexicon: δένδρον, φύλλα
  rationale: 원문의 분사구를 자연스럽게 풀어 ‘잎사귀가 달린’으로 옮겨, 단순한 수량 정보가 아니라 ‘잎이 있는 나무들’이라는 조건을 살렸습니다.
- source_word: ἀνάγαγε τῷ Κυρίῳ
  english_pob_choice: offer to the Lord
  chosen_korean: 주님께 드리십시오
  alternatives_korean:
  - 주님께 바치십시오
  - 주님께 올리십시오
  lexicon: ἀνάγω + dative
  rationale: ἀνά가γε는 제의적 제시/헌납의 뜻을 담으므로, 현대 한국어에서 가장 자연스럽고 예식적 뉘앙스를 유지하는 ‘드리십시오’를 선택했습니다.
- source_word: Κυρίῳ
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: κύριος
  rationale: 여기서는 지시 대상이 신적 호칭으로 쓰였으므로, POB 기본 대응인 ‘주님’을 사용해 직접성과 경건성을 유지했습니다.
- source_word: ὡς κἀμὲ Ἀβραὰμ ἐδίδαξε
  english_pob_choice: as Abraham taught me
  chosen_korean: 아브라함이 내게 가르쳐 준 것처럼 말입니다
  alternatives_korean:
  - 아브라함이 내게 가르친 것처럼 말입니다
  - 아브라함이 나를 가르쳤듯이 말입니다
  lexicon: ἐδίδαξε
  rationale: 완료된 교육 행위를 자연스러운 한국어로 풀어 ‘가르쳐 준 것처럼’으로 옮겨, 결과적으로 전승된 가르침의 성격을 드러냈습니다.
theological_decisions:
- issue: 제의적 명령문의 문체
  chosen_reading: 직접 명령형을 한국어 공손명령으로 옮겨, 원문의 권고/지시 성격을 보존했습니다.
  alternative_readings:
  - 서술형으로 완화하여 ‘...드린다고 합니다’로 번역
  - 간접화법으로 ‘...드리라고 하셨습니다’로 번역
  rationale: 이 구절은 아브라함에게서 전해진 실천 지침을 제시하므로, 명령성을 약화하지 않고도 현대 합쇼체로 충분히 공손하게 전달하는 것이 적절합니다.
  doctrine_reference: 텍스트-전승적 지침 표현 보존
