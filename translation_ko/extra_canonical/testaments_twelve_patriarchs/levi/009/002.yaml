source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εὐλόγησέν με *⁵ὁ πατὴρ τοῦ πατρός μου⁵ κατὰ⁶ *τῶν ὁραμάτων ὧν⁷ εἶδον· *καὶ οὐκ ἠθέλησε πορευθῆναι μεθ’ ἡμῶν εἰς Βεθήλ⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/002.yaml
  text: And my grandfather blessed me because of the visions that I had seen, and he was not willing to go with us to Bethel.
translation:
  language: ko
  text: 그리고 나의 할아버지가, 내가 본 환상들 때문에 나를 축복하셨습니다. 그리고 그는 우리와 함께 베델로 가기를 원하지 않으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πατὴρ τοῦ πατρός μου
  english_pob_choice: my grandfather
  chosen_korean: 나의 할아버지
  alternatives_korean:
  - 아버지의 아버지
  - 내 조부
  lexicon: 가족 관계 표현
  rationale: 그리스어의 직역인 ‘아버지의 아버지’는 한국어에서 자연스럽지 않으므로, POB의 영어 판단과 맞추어 의미상 분명한 친족어 ‘할아버지’로 옮겼습니다.
- source_word: κατὰ τῶν ὁραμάτων ὧν εἶδον
  english_pob_choice: because of the visions that I had seen
  chosen_korean: 내가 본 환상들 때문에
  alternatives_korean:
  - 내가 본 환상들에 따라
  - 내가 본 환상들로 말미암아
  lexicon: κατά + 이유/원인 구문
  rationale: 여기서 κατὰ는 기준보다 원인을 나타내므로, POB의 수정 취지를 따라 ‘때문에’로 옮겨 인과관계를 분명히 했습니다.
- source_word: πορευθῆναι μεθ’ ἡμῶν εἰς Βεθήλ
  english_pob_choice: to go with us to Bethel
  chosen_korean: 우리와 함께 베델로 가기를
  alternatives_korean:
  - 우리와 함께 베델에 가기를
  - 우리와 동행하여 베델로 가기를
  lexicon: 동사 πορεύομαι / 지명 Βεθήλ
  rationale: ‘가다’의 이동 의미를 살리고, 고유명사 Βεθήλ은 현대 외래어 표기 관례에 따라 ‘베델’로 적었습니다.
theological_decisions:
- issue: 축복 주체와 서술 방식
  chosen_reading: ‘축복하셨습니다’로 두어, 할아버지가 화자의 환상을 근거로 축복한 사건을 직접적이고 공손한 서술로 나타냈습니다.
  alternative_readings:
  - 축복하였습니다
  - 복을 빌어 주셨습니다
  rationale: 본문은 단순한 일반적 호의가 아니라 실제 축복 행위를 말하므로, 종교적 서술을 약화시키지 않으면서 현대 한국어 문체에 맞는 ‘축복하다’를 택했습니다.
  doctrine_reference: 서사문체의 직접적 행위 서술
