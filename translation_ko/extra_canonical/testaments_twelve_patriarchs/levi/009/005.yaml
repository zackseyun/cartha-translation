lexical_decisions:
- source_word: Καὶ Γοὕτως’ / And so
  english_pob_choice: And so
  chosen_korean: 그리하여
  alternatives_korean:
  - 그래서
  - 그리고 그렇게
  lexicon: connective
  rationale: 이 접속은 앞선 서술의 결과를 자연스럽게 잇는 연결어이므로, 문어체이면서도 직역 냄새가 덜한 ‘그리하여’를 택했습니다.
- source_word: ἤλθομεν / we came
  english_pob_choice: we came
  chosen_korean: 우리는 ... 이르렀습니다
  alternatives_korean:
  - 우리는 ... 왔습니다
  - 우리는 ... 도착했습니다
  lexicon: ἔρχομαι
  rationale: 단순 이동보다 목적지 도착을 드러내는 문맥이므로, 자연스러운 서술체로 ‘이르렀습니다’를 사용했습니다.
- source_word: τοῦ καταμεῖναι / to stay there
  english_pob_choice: to stay there
  chosen_korean: 거기서 머물기 위해
  alternatives_korean:
  - 거기서 머물려고
  - 거기에 머무르기 위해
  lexicon: μένω
  rationale: POB의 ‘stay’를 살리되, κατα-의 완결/정착 뉘앙스를 한국어에서 과장하지 않고 ‘머물기 위해’로 옮겼습니다.
- source_word: ἐκεῖ / there
  english_pob_choice: there
  chosen_korean: 거기서
  alternatives_korean:
  - 거기에
  - 그곳에
  lexicon: deictic adverb
  rationale: 동작의 장소를 자연스럽게 붙여 주는 구어적 부사를 선택해 문장 흐름을 살렸습니다.
