base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/009.yaml
  text: Take heed to yourself from the spirit of sexual immorality, for this is persistent and is about to defile the holy things through your offspring.
translation:
  language: ko
  text: 너는 음행의 영에서 스스로를 지키십시오. 이것은 계속 그러하며, 네 자손을 통해 거룩한 것들을 더럽힐 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρόσεχε σεαυτῷ
  english_pob_choice: Take heed to yourself
  chosen_korean: 스스로를 지키십시오
  alternatives_korean:
  - 자기를 주의하십시오
  - 스스로 조심하십시오
  lexicon: προσέχω
  rationale: 단순한 주의 환기보다 자기 자신을 경계하고 지키라는 촉구가 핵심이므로, 현대 한국어에서 자연스럽고 경고의 힘이 있는 표현으로 옮겼습니다.
- source_word: ἀπὸ τοῦ πνεύματος τῆς πορνείας
  english_pob_choice: from the spirit of sexual immorality
  chosen_korean: 음행의 영
  alternatives_korean:
  - 성적 부도덕의 영
  - 음란의 영
  lexicon: πνεῦμα / πορνεία
  rationale: source가 단순한 행위가 아니라 그 배후의 ‘영’을 말하므로 이를 살렸고, πορνεία는 문맥상 전통적 신학어보다 직접적인 ‘음행’이 더 가깝습니다.
- source_word: ἐνδελεχῆ ἐστιν
  english_pob_choice: this is persistent
  chosen_korean: 이것은 계속 그러하며
  alternatives_korean:
  - 이것은 끈질기며
  - 이것은 끊임없으며
  lexicon: ἐνδελεχής
  rationale: 영어 POB의 ‘persistent’를 따라, 상태의 지속성과 끈질김을 함께 드러내는 한국어로 옮겼습니다.
- source_word: διὰ τοῦ σπέρματός σου τὰ ἅγια
  english_pob_choice: through your offspring ... the holy things
  chosen_korean: 네 자손을 통해 거룩한 것들
  alternatives_korean:
  - 네 씨를 통해 성스러운 것들
  - 네 후손으로 말미암아 거룩한 것들
  lexicon: σπέρμα / τὰ ἅγια
  rationale: σπέρμα는 여기서 ‘후손/자손’의 집합적 의미가 자연스럽고, τὰ ἅγια는 성소 물건을 특정하기보다 넓게 ‘거룩한 것들’로 유지하는 편이 원문의 범위를 보존합니다.
theological_decisions:
- issue: 정체를 명시하지 않은 악한 영향의 근원인 ‘영’
  chosen_reading: 문맥이 행위보다 배후의 영적 원인을 지칭하므로, 도덕적 추상어로 약화하지 않고 ‘음행의 영’으로 유지했습니다.
  alternative_readings:
  - 성적 부도덕의 영향
  - 음란한 성향
  rationale: 본문은 단순한 윤리 규범보다 영적 오염의 근원을 경고하므로, source의 인격적·영적 뉘앙스를 보존하는 것이 더 적절합니다.
  doctrine_reference: 영적 실재/악의 세력에 대한 본문 내 경고
