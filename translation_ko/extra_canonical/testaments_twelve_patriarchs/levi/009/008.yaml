  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ἦν καθ᾽ ἑκάστην ἡμέραν συνετίζων με³¹, *καὶ ἀσχολούμενος εἰς ἐμὲ³² *ἔλεγέ μοι³³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/008.yaml
  text: 'And every day he was instructing me, and being occupied with me, he said to me:'
translation:
  language: ko
  text: 그리고 그는 날마다 나를 가르쳤고, 나에게 매여 있으면서 나에게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετίζων
  english_pob_choice: was instructing me
  chosen_korean: 나를 가르쳤고
  alternatives_korean:
  - 나를 교훈했고
  - 나를 깨우쳤고
  - 나를 지도했고
  lexicon: συνετίζω
  rationale: 지속적 행위를 나타내는 분사로서 ‘was instructing’에 맞추되, 한국어에서는 자연스러운 서술로 풀어 ‘가르치다’를 택했습니다.
- source_word: καθ᾽ ἑκάστην ἡμέραν
  english_pob_choice: every day
  chosen_korean: 날마다
  alternatives_korean:
  - 매일
  - 하루하루
  lexicon: καθ᾽ ἑκάστην ἡμέραν
  rationale: 반복성과 지속성을 간결하게 드러내는 관용적 표현으로 옮겼습니다.
- source_word: ἀσχολούμενος εἰς ἐμὲ
  english_pob_choice: being occupied with me
  chosen_korean: 나에게 매여 있으면서
  alternatives_korean:
  - 나에게 몰두하면서
  - 나에게 집중하면서
  - 나를 돌보면서
  lexicon: ἀσχολέω / ἀσχολούμενος εἰς ἐμέ
  rationale: 단순한 관심보다 ‘매여 있음’이 원문의 ‘occupied with me’가 주는 지속적 관여와 시간의 할애를 더 잘 살립니다.
- source_word: ἔλεγέ μοι
  english_pob_choice: he said to me
  chosen_korean: 나에게 말했습니다
  alternatives_korean:
  - 내게 말했습니다
  - 나에게 이르렀습니다
  lexicon: λέγω + μοι
  rationale: 직접 화행을 자연스럽게 옮기면서도, 본문이 대화의 도입부임을 분명히 했습니다.
theological_decisions:
- issue: ἀσχολούμενος εἰς ἐμὲ의 관계적 뉘앙스
  chosen_reading: 단순한 정보 전달보다, 스승이 제자에게 지속적으로 시간을 내어 붙들고 있었다는 관계적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘나를 가르치며’로만 처리하여 의미를 좁히는 읽기
  - ‘나를 돌보며’로 정서적으로 넓히는 읽기
  rationale: 문맥상 교육 행위와 개인적 전념이 함께 있으므로, 두 요소를 모두 드러내는 번역이 원문 효과에 가장 가깝습니다.
  doctrine_reference: 문맥상 인물 관계와 제자 양육의 묘사
