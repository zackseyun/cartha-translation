id: T12P.LEV.9.4
reference: Testament of Levi 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀναστὰς¹⁴ *τῷ πρωὶ¹⁵ *ἀπεδεκάτωσε πάντα¹⁶ δι’ ἐμοῦ ῾τῷ Κυρίῳ’¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/004.yaml
  text: And rising early in the morning, he tithed everything through me to the Lord.
translation:
  language: ko
  text: 그리고 그가 아침 일찍 일어나서 모든 것을 나를 통해 주님께 십일조로 바쳤습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς τῷ πρωὶ
  english_pob_choice: rising early in the morning
  chosen_korean: 아침 일찍 일어나서
  alternatives_korean:
  - 이른 아침에 일어나서
  - 아침에 일어나서
  lexicon: ἀνίστημι; πρωί
  rationale: 행위의 연속을 자연스럽게 살리되, ‘rising early in the morning’의 시간성과 동작성을 합쳐 표준적 한국어로 옮겼습니다.
- source_word: ἀπεδεκάτωσε πάντα
  english_pob_choice: he tithed everything
  chosen_korean: 모든 것을 … 십일조로 바쳤습니다
  alternatives_korean:
  - 모든 것에 십일조를 드렸습니다
  - 모든 것을 십일조하였습니다
  lexicon: ἀποδεκατόω
  rationale: 동사의 핵심 의미는 ‘십일조를 하다/바치다’이므로, POB의 직접성을 유지하면서 한국어로는 자연스럽게 ‘십일조로 바치다’로 옮겼습니다.
- source_word: δι’ ἐμοῦ
  english_pob_choice: through me
  chosen_korean: 나를 통해
  alternatives_korean:
  - 나를 통하여
  - 내 손을 통해
  lexicon: διά + genitive
  rationale: 매개 수단을 나타내는 표현이므로, 의미를 분명히 드러내는 ‘나를 통해’가 가장 무난합니다.
- source_word: τῷ Κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주께서
  lexicon: κύριος
  rationale: 문맥상 예배/헌정의 수신자이므로, 한국어 독자에게 자연스러운 경어형 ‘주님께’를 사용했습니다.
theological_decisions:
- issue: ‘주님’의 표기와 경어
  chosen_reading: 본문의 τῷ Κυρίῳ는 하나님/주님께 드리는 헌정으로 이해하여 ‘주님께’로 옮겼습니다.
  alternative_readings:
  - 주께
  - 주님에게
  rationale: 직접 헌납의 목적지를 드러내는 표현이므로, 합쇼체와 맞는 경어형을 유지하되 문장 흐름을 해치지 않도록 했습니다.
  doctrine_reference: 예배·헌정 언어의 존중 표현
- issue: ‘십일조로 바치다’의 동사 선택
  chosen_reading: ἀπεδεκάτωσε는 단순히 ‘열의 하나를 주었다’보다 ‘십일조했다’는 행위를 직접 나타낸다고 보았습니다.
  alternative_readings:
  - 열의 하나를 드렸습니다
  - 십일조를 드렸습니다
  rationale: POB의 수정 취지처럼 동사의 직접성을 살리면서, 한국어에서는 목적어를 ‘모든 것’으로 두고 부사어화해 원문의 강한 의미를 보존했습니다.
  doctrine_reference: 헌금/헌납의 언어
