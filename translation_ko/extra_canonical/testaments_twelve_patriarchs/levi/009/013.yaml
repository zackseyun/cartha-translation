  text: Καὶ ἐκ⁵⁶ παντὸς ζώου καθαροῦ⁵⁷ Γκαὶ πετεινοῦ⁵⁸⁾ πρόσφερε θυσίαν *τῷ Κυρίῳ⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/013.yaml
  text: And from every clean animal and bird offer a sacrifice to the Lord.
translation:
  language: ko
  text: 그리고 모든 정결한 짐승과 새 가운데서 주님께 희생 제물을 드리십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ παντὸς ζώου καθαροῦ
  english_pob_choice: from every clean animal
  chosen_korean: 모든 정결한 짐승 가운데서
  alternatives_korean:
  - 모든 깨끗한 동물 가운데서
  - 모든 정결한 동물 가운데서
  lexicon: ζῷον / καθαρός
  rationale: 포괄적 의미는 '동물'이지만, 제의 문맥에서 전통적으로 짐승이 자연스럽고, καθαρός는 의례적 정결을 가리켜 '정결한'으로 옮겼습니다.
- source_word: πετεινοῦ
  english_pob_choice: bird
  chosen_korean: 새
  alternatives_korean:
  - 조류
  - 날짐승
  lexicon: πετεινόν
  rationale: 일반 명칭인 '새'가 가장 직관적이며, 제의 목록의 병렬 구조를 잘 드러냅니다.
- source_word: πρόσφερε θυσίαν
  english_pob_choice: offer a sacrifice
  chosen_korean: 희생 제물을 드리십시오
  alternatives_korean:
  - 제사를 바치십시오
  - 희생 제사를 드리십시오
  lexicon: προσφέρω / θυσία
  rationale: προσφέρω의 '드리다'를 살리면서 θυσία를 제의적 '희생 제물'로 풀어, 행위와 대상 모두를 분명하게 했습니다.
- source_word: τῷ Κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주에게
  lexicon: κύριος
  rationale: 본문의 Κυρίῳ는 하나님을 가리키는 호칭으로, 한국어 성경 관용과 합쇼체에 맞게 '주님께'로 옮겼습니다.
theological_decisions:
- issue: 제의적 명령의 문체
  chosen_reading: 직접 명령을 현대 합쇼체로 옮겨, 규범적 권면의 힘을 유지했습니다.
  alternative_readings:
  - 평서형으로 완화된 번역
  - 더 고어적인 명령형
  rationale: 본문은 권고가 아니라 제의 실천을 명하는 형식이므로, 한국어에서도 명령성을 분명히 드러내는 것이 소스의 힘에 가깝습니다.
  doctrine_reference: Source-level register preservation
