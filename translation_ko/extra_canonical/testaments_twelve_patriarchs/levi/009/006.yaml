  to: 그리고 이삭은 천사가 내게 보여 준 대로 주님의 율법을 나에게 상기시켜 주려고 계속해서 나를 불렀습니다.
  rationale: 원문의 어순과 수식 범위를 한국어에 맞게 재구성하되, 이삭의 반복적 부름, 율법을 상기시키려는 목적, 천사가 보여 준 내용 또는 기준과의 일치를 모두 유지했습니다. 본문이 천사가 무엇을 보여 주었는지 명시하지 않으므로 이를 더 구체화하지 않았습니다.
