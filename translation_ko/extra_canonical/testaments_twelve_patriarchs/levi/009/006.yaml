id: T12P.LEV.9.6
reference: Testament of Levi 9:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ὁ²¹ Ἰσαὰκ ἐκάλει με συνεχῶς *τοῦ ὑπομνῆσαί²² *με νόμον²³ Κυρίου²⁴, καθὼς *ἔδειξέ μοι²⁵ ὁ ἄγγελος²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/006.yaml
  text: And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me.
translation:
  language: ko
  text: 그리고 이삭은 내가 주님의 율법을 기억하도록 계속해서 나를 불렀습니다. 마치 그 천사가 나에게 보여 주었듯이 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλει με συνεχῶς
  english_pob_choice: kept calling me continually
  chosen_korean: 계속해서 나를 불렀습니다
  alternatives_korean:
  - 끊임없이 나를 불렀습니다
  - 지속적으로 나를 불렀습니다
  lexicon: καλέω + συνεχῶς
  rationale: 반복성과 지속성을 자연스럽게 살리되, 한국어에서 과도하게 딱딱한 표현보다 ‘계속해서’가 서술 흐름에 잘 맞습니다.
- source_word: τοῦ ὑπομνῆσαί με
  english_pob_choice: to remind me
  chosen_korean: 내가 … 기억하도록
  alternatives_korean:
  - 나를 일깨우기 위해
  - 나에게 상기시키려고
  lexicon: ὑπομιμνῄσκω
  rationale: 직역적 ‘상기시키다’도 가능하지만, 여기서는 목적부정사 구문을 한국어로 자연스럽게 풀어 ‘기억하도록’으로 옮겼습니다.
- source_word: νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 계명
  lexicon: νόμος + κύριος
  rationale: 예언·율법 문맥이므로 ‘율법’을 유지했고, κύριος는 이 고대 유대적 맥락에서 ‘주님’으로 번역했습니다.
- source_word: καθὼς ἔδειξέ μοι ὁ ἄγγελος
  english_pob_choice: just as the angel had shown me
  chosen_korean: 마치 그 천사가 나에게 보여 주었듯이 말입니다
  alternatives_korean:
  - 그 천사가 내게 보여 준 대로입니다
  - 천사가 내게 보여 주었듯이
  lexicon: καθώς + δείκνυμι
  rationale: 비교·기준의 뉘앙스를 살려 ‘마치 … 보여 주었듯이’로 옮기고, 완료적 선행성을 한국어 과거 표현으로 반영했습니다.
theological_decisions:
- issue: ‘Lord’의 표기와 인물 발화의 중첩
  chosen_reading: κύριος를 ‘주님’으로 번역하여, 이삭이 기억시키는 내용이 하나님의 율법임을 분명히 했습니다.
  alternative_readings:
  - 야훼의 율법
  - 주(主)의 율법
  rationale: 본문은 신적 호칭을 일반적 경칭으로 전달하지만, 한국어 독자에게는 ‘주님’이 고대 경외 표현을 가장 자연스럽게 드러냅니다.
  doctrine_reference: 고대 유대 문헌 번역 관행과 κύριος의 경칭 사용
