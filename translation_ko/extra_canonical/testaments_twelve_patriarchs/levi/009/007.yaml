id: T12P.LEV.9.7
reference: Testament of Levi 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐδίδασκέ *με²⁷ νόμον ἱερωσύνης²⁸, *θυσιῶν, ὁλοκαυτωμάτων²⁹, *ἀπαρχῶν ἑκουσίου, σωτηρίου³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/007.yaml
  text: And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of freewill offerings, and of peace offerings.
translation:
  language: ko
  text: 그리고 그가 나에게 제사장직의 율법과 희생제사들, 번제물들, 자원제물들과 화목제물들의 법을 가르쳤습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμον ἱερωσύνης
  english_pob_choice: the law of the priesthood
  chosen_korean: 제사장직의 율법
  alternatives_korean:
  - 제사직의 율법
  - 제사장직에 관한 율법
  lexicon: νόμος, ἱερωσύνη
  rationale: νόμον은 여기서 일반적 법률이 아니라 제사장 직분에 관한 규범을 가리키므로, 자연스럽고도 소스-직결적인 표현으로 ‘제사장직의 율법’을 택했습니다.
- source_word: θυσιῶν
  english_pob_choice: sacrifices
  chosen_korean: 희생제사들
  alternatives_korean:
  - 제사들
  - 희생들
  lexicon: θυσία
  rationale: 단순한 ‘제사’보다 제의적 희생의 성격을 드러내기 위해 ‘희생제사들’로 옮겼습니다.
- source_word: ὁλοκαυτωμάτων
  english_pob_choice: whole burnt offerings
  chosen_korean: 번제물들
  alternatives_korean:
  - 온전한 번제물들
  - 전번제물들
  lexicon: ὁλοκαύτωμα
  rationale: 한국어 성경 전통에서 널리 이해되는 ‘번제’를 바탕으로, 복수형에 맞춰 ‘번제물들’로 처리했습니다.
- source_word: ἀπαρχῶν ἑκουσίου
  english_pob_choice: freewill offerings
  chosen_korean: 자원제물들
  alternatives_korean:
  - 자원으로 드리는 첫 열매들
  - 자원제사들
  lexicon: ἀπαρχή, ἑκούσιος
  rationale: 본문은 English POB가 정리했듯 ‘freewill offerings’로 읽는 것이 자연스럽고, 한국어에서는 자원성을 직접 드러내는 ‘자원제물들’이 가장 간결합니다.
- source_word: σωτηρίου
  english_pob_choice: peace offerings
  chosen_korean: 화목제물들
  alternatives_korean:
  - 평화제물들
  - 화평제물들
  lexicon: σωτήριος / σωτηρία
  rationale: 이 문맥에서는 ‘peace offerings’에 해당하는 제의 항목으로 이해하는 것이 타당하며, 한국어 성경어휘에서 가장 투명한 대응은 ‘화목제물들’입니다.
theological_decisions:
- issue: 목록 항목의 제의적 성격을 어떻게 드러낼지
  chosen_reading: 단순한 행위 목록이 아니라 제사장직에 속한 규범과 제의 종류를 나열하는 문장으로 이해해, 항목마다 복수형 명사를 유지했습니다.
  alternative_readings:
  - 단수 개념으로 일반화하여 자연스럽게 풀어쓰기
  - ‘희생’보다 완화된 일반 제사 용어로 조정
  rationale: 원문은 제사장 교육의 구체 항목들을 열거하므로, 목록의 제의적 촘촘함을 보존하는 편이 본문 의도에 더 충실합니다.
  doctrine_reference: 제의법/제사장직 관련 문맥 보존
- issue: ἑκουσίου의 의미 처리
  chosen_reading: ‘freewill’ 요소를 별도 주석 없이 ‘자원제물들’로 반영했습니다.
  alternative_readings:
  - ‘자원으로 드리는 제물들’
  - ‘자원의 제물들’
  rationale: 본문의 핵심은 자발성이지 ‘첫 열매’가 아니므로, 영어 POB의 수정본과 일치하게 unattested 요소를 배제했습니다.
  doctrine_reference: 본문 비증거 요소 배제 원칙
