  naturalness: ‘거룩한 것들 안으로’는 한국어에서 부자연스럽고 장소를 가리키는 제의 문맥에도 맞지 않습니다. 문장을 간결한 합쇼체 명령문으로 다듬었습니다.
  terminology: ‘성소’, ‘제사’, ‘몸을 씻으십시오’는 제의 문맥과 현대 표준 한국어에 적절합니다. νίπτω의 씻는 부위는 원문이 특정하지 않으므로 ‘손’을 보충하지 않았습니다.
  issues:
