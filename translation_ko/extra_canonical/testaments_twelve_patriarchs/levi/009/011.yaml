  - severity: low
    issue: λούου와 νίπτου의 어휘적 차이가 사라짐
    rationale: λούω는 일반적으로 몸을 씻는 행위를, νίπτω는 씻는 행위를 가리킵니다. 첫 명령에만 ‘몸을’을 밝혀 차이를 반영하되, 뒤의 씻는 부위는 원문처럼 특정하지 않았습니다.
  - severity: low
