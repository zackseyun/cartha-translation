id: T12P.LEV.9.11
reference: Testament of Levi 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ πρὸ⁴⁶ τοῦ εἰσελθεῖν σε⁴⁷ εἰς τὰ ἅγια, λούου· καὶ ἐν τῷ θύειν σε⁴⁸, νίπτου⁴⁹· καὶ ἀπαρτίζων πάλιν⁵⁰ τὴν θυσίαν, νίπτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/011.yaml
  text: And before you enter into the holy things, wash; and when you sacrifice, wash; and again, when you finish the sacrifice, wash.
translation:
  language: ko
  text: 그리고 성소에 들어가기 전에 몸을 씻으십시오. 제사를 드릴 때에는 씻으십시오. 또 제사를 마칠 때에는 씻으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ ἅγια
  english_pob_choice: into the holy things
  chosen_korean: 거룩한 것들 안으로
  alternatives_korean:
  - 거룩한 곳 안으로
  - 성소 안으로
  lexicon: ἅγια
  rationale: 문맥상 성소를 가리킬 수 있으나, 원문은 복수형 ‘거룩한 것들’로 되어 있어 이를 살리되 한국어에서는 자연스럽게 ‘거룩한 것들 안으로’로 옮겼습니다.
- source_word: λούου / νίπτου
  english_pob_choice: wash
  chosen_korean: 씻으십시오
  alternatives_korean:
  - 몸을 씻으십시오
  - 손을 씻으십시오
  lexicon: λούω / νίπτω
  rationale: 원문은 반복적으로 ‘씻다’를 명령하며, 마지막 구절만 손을 특정하지 않으므로 일반적인 ‘씻으십시오’로 통일했습니다.
- source_word: θύειν / θυσίαν
  english_pob_choice: sacrifice / the sacrifice
  chosen_korean: 제사를 드릴 때 / 제사를 마칠 때
  alternatives_korean:
  - 희생제물을 바칠 때 / 희생제물을 마칠 때
  - 제물을 바칠 때 / 제물을 마칠 때
  lexicon: θύω / θυσία
  rationale: 유대 제의 문맥이므로 ‘제사’가 의미를 가장 분명하게 전달하며, 앞뒤 반복 구조를 따라 동작과 완료를 구분했습니다.
theological_decisions:
- issue: 정결 예식의 반복 명령을 어떻게 드러낼 것인가
  chosen_reading: 씻으십시오를 세 번 반복해 예식적 정결의 긴박함과 규범성을 그대로 살렸습니다.
  alternative_readings:
  - 한 번만 일반화하여 ‘자주 씻으십시오’로 풀기
  - 마지막 두 절을 묶어 더 간단히 번역하기
  rationale: 본문은 행위마다 씻으라는 연속 명령으로 구성되어 있어, 반복 자체가 수사적·의례적 의미를 가지므로 이를 보존했습니다.
  doctrine_reference: 의례 정결과 제의 규범의 반복성
