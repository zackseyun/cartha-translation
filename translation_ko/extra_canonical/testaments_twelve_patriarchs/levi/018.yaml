base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018.yaml
  text: 1 And after their vengeance has come from the Lord[5], the priesthood will fail. 2 Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute a judgment of truth upon the earth for many days. 3 And his star will rise in heaven like a king, giving light with the light of knowledge like the sun by day, and he will be magnified in the inhabited world. 4 He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth. 5 The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; and the angels of the glory of the Lord's presence will be glad in him. 6 The heavens will be opened, and from the temple of glory sanctification will come upon him with a fatherly voice, as from Abraham to Isaac. 7 And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him. 8 For
    he will give the majesty of the Lord to his sons in truth forever, and there will be no successor to him for generation upon generation, forever. 9 And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. During his priesthood sin will fail, and the lawless will cease from evil. 10 And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam. 11 And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them. 12 And Beliar will be bound by him, and he will give authority to his children to trample on evil spirits. 13 And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever. 14 Then Abraham and Isaac and Jacob will exult, and I will be glad[10][9b][9a][7], and all the holy ones will put on righteousness.
  footnotes:
  - marker: '5'
    text: Some witnesses add, 'and the knowledge of the Lord will be poured out upon the earth like the water of the seas.'
    reason: textual_variant
  - marker: '7'
    text: Some witnesses add, 'in the water.'
    reason: textual_variant
  - marker: 9a
    text: Some witnesses add, 'but Israel will be diminished in ignorance and darkened in grief.'
    reason: textual_variant
  - marker: 9b
    text: Some witnesses add, 'but the righteous will rest in him.'
    reason: textual_variant
  - marker: '10'
    text: The threatening sword alludes to the sword set to guard the way to the tree of life after Adam's expulsion from Eden.
    reason: cross_reference
translation:
  language: ko
  text: 1 그들에 대한 보복이 주께로부터 이루어진 뒤에 제사직은 사라질 것입니다. 2 그때 주께서 새 제사장을 일으키실 것이며, 주의 모든 말씀이 그에게 계시될 것입니다. 그는 많은 날 동안 땅 위에서 진리의 심판을 행할 것입니다. 3 그의 별이 하늘에서 왕처럼 떠오르고, 낮의 해처럼 지식의 빛을 비출 것이며, 사람이 사는 온 세상에서 높임을 받을 것입니다. 4 그는 땅 위에서 해처럼 빛나고, 하늘 아래의 모든 어둠을 없앨 것이며, 온 땅에 평화가 있을 것입니다. 5 하늘은 그의 날들에 기뻐하고, 땅은 즐거워하며, 구름들도 기뻐할 것입니다.[a] 주의 임재의 영광에 속한 천사들도 그를 두고 기뻐할 것입니다. 6 하늘이 열리고, 영광의 성전으로부터 거룩함이 그에게 임할 것입니다. 아브라함이 이삭에게 하였듯이 아버지의 음성과 함께 임할 것입니다. 7 가장 높으신 분의 영광이 그 위에 선포될 것이며, 이해와 거룩하게 하심의 영이 그 위에 머물 것입니다.[b] 8 그는 진리 안에서 주의 위엄을 자기 아들들에게 영원히 줄 것이며, 세대에서 세대로, 영원히 그를 이을 자가 없을 것입니다. 9 그의 제사직 동안 민족들은 땅 위에서 지식 안에서 번성하고, 주의 은혜로 말미암아 빛을 받을 것입니다.[c] 그의 제사직 동안 죄는 사라질 것이며, 불법한 자들은 악을 행하기를 그칠 것입니다.[d] 10 참으로 그는 낙원의 문들을 열고, 아담을 위협하는 칼을 치울 것입니다.[e] 11 그는 거룩한 이들에게 생명나무의 열매를 먹게 할 것이며, 거룩함의 영이 그들 위에 있을 것입니다. 12 벨리알은 그에게 결박될 것이며, 그는 자기 자녀들에게 악한 영들을 밟을 권세를 줄 것입니다. 13 주께서는 그의 자녀들을 두고 기뻐하시고, 그의 사랑받는 이들을 두고 영원히 기뻐하실 것입니다. 14 그때 아브라함과 이삭과 야곱이 크게 기뻐할 것이며, 나도 기뻐할 것입니다. 모든 거룩한 이는 의를 입을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 “주의 지식이 바다의 물처럼 땅 위에 부어질 것이다”가 덧붙습니다.
    reason: textual_variant
  - marker: b
    text: 일부 사본에는 “물 안에서”가 덧붙습니다.
    reason: textual_variant
  - marker: c
    text: 일부 사본에는 “그러나 이스라엘은 무지 가운데 쇠약해지고 슬픔 가운데 어두워질 것이다”가 덧붙습니다.
    reason: textual_variant
  - marker: d
    text: 일부 사본에는 “그러나 의로운 이들은 그 안에서 쉴 것이다”가 덧붙습니다.
    reason: textual_variant
  - marker: e
    text: 이 칼은 아담이 에덴에서 쫓겨난 뒤 생명나무에 이르는 길을 지키도록 세워진 칼을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἱερωσύνη
  english_pob_choice: priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장직
  - 제사직분
  lexicon: BDAG
  rationale: 이 대목의 중심 대비는 제사 제도의 소멸과 갱신이므로, 직무·제도성을 드러내는 ‘제사직’이 가장 자연스럽습니다.
- source_word: ἱερέα καινόν
  english_pob_choice: a new priest
  chosen_korean: 새 제사장
  alternatives_korean:
  - 새로운 제사장
  - 새 사제
  lexicon: BDAG
  rationale: καινός의 새로움은 단순한 시간적 새것이 아니라 새 국면의 등장이라는 점을 살리되, 과도한 해석 없이 직설적으로 옮겼습니다.
- source_word: κρίσιν ἀληθείας
  english_pob_choice: a judgment of truth
  chosen_korean: 진리의 심판
  alternatives_korean:
  - 진실의 심판
  - 참된 심판
  lexicon: BDAG
  rationale: 소유격 관계를 한국어의 관형어로 자연스럽게 풀어, 심판의 성격이 ‘진리’에 속한다는 점을 보존했습니다.
- source_word: ἀναλάμψει
  english_pob_choice: will shine forth
  chosen_korean: 빛나고
  alternatives_korean:
  - 번쩍이며 빛나고
  - 환히 빛나고
  lexicon: BDAG
  rationale: 별과 해의 병렬 이미지 속에서 과장되지 않으면서도 발광의 힘을 유지하는 표현으로 처리했습니다.
- source_word: ὑπὸ οὐρανόν / ὑπ᾽ οὐρανόν
  english_pob_choice: under heaven
  chosen_korean: 하늘 아래
  alternatives_korean:
  - 하늘 아래의
  - 천하의
  lexicon: BDAG
  rationale: 우주적 공간표현을 한문투로 바꾸지 않고, 원문의 범위를 그대로 드러내는 일상적 표현을 택했습니다.
- source_word: ἁγίασμα
  english_pob_choice: sanctification
  chosen_korean: 거룩하게 됨
  alternatives_korean:
  - 성결
  - 성화
  - 거룩하게 하심
  lexicon: BDAG
  rationale: 여기서는 인격적 선물이라기보다 임하는 거룩함의 상태를 가리키므로, 추상명사보다 한국어 서술형 명사를 택했습니다.
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  english_pob_choice: a spirit of understanding and sanctification
  chosen_korean: 이해와 거룩하게 하심의 영
  alternatives_korean:
  - 명철과 성결의 영
  - 깨달음과 성화의 영
  lexicon: BDAG
  rationale: σύνεσις의 인지적 뜻을 ‘이해’로, ἁγιασμός 계열을 ‘거룩하게 하심’으로 옮겨, 후대 교리 용어로 굳히지 않았습니다.
theological_decisions:
- issue: v. 12의 Βελίαρ와 그 권세의 주체성
  chosen_reading: ‘벨리알은 그에 의해 결박될 것이며’로 옮겨, 종말론적 적대 세력의 패배를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘그는 벨리알을 묶을 것이다’
  - ‘벨리알은 그에게 매이게 될 것이다’
  rationale: 원문 수동·행위 주체 관계를 한국어에서 명확히 해야 하므로, 패배 서술의 방향을 살리면서도 문법적 흐름을 유지했습니다.
  doctrine_reference: 종말론적 악의 제압을 본문 범위 안에서 보존
- issue: v. 11의 πνεῦμα ἁγιωσύνης
  chosen_reading: ‘거룩함의 영’으로 옮겨, 성령으로 단정하지 않고 표현의 긴장을 유지했습니다.
  alternative_readings:
  - ‘성령’
  - ‘거룩한 영’
  rationale: 그리스어 표현 자체는 강한 신학적 울림이 있으나, 본문은 명시적으로 후대 삼위일체 용어를 요구하지 않으므로 원문 수준을 보존했습니다.
  doctrine_reference: 원문 우선, 교리적 조기 확정 회피
