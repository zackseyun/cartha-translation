revisions:
- from: 1 그들의 보복이 주께로부터 이루어진 뒤에는 제사직이 사라질 것입니다. 2 그때 주께서 새 제사장을 세우실 것이며, 주의 모든 말씀이 그에게 계시될 것이고, 그는 많은 날 동안 땅 위에 진리의 심판을 행할 것입니다. 3 그의 별이 하늘에서 왕처럼 떠오르며, 낮의 해처럼 지식의 빛을 비추고, 거주하는 온 세상에서 높임을 받을 것입니다. 4 그는 땅 위에서 해처럼 빛나고, 하늘 아래의 모든 어둠을 없앨 것이며, 온 땅에 평강이 있을 것입니다. 5 하늘들은 그의 날들에 기뻐하고, 땅은 즐거워하며, 구름들도 기뻐할 것입니다. 주의 임재의 영광의 천사들도 그 안에서 기뻐할 것입니다. 6 하늘들이 열리고, 영광의 성전으로부터 아브라함이 이삭에게 하듯 아버지의 음성과 함께 거룩하게 됨이 그에게 임할 것입니다. 7 가장 높으신 분의 영광이 그에게 선포될 것이며, 이해와 거룩하게 하심의 영이 그 위에 머물 것입니다. 8 그는 진리 안에서 주의 위엄을 그의 아들들에게 영원히 줄 것이며, 세대에서 세대로 이어질 그의 후계자는 없을 것입니다. 9 그의 제사직 동안에 민족들은 땅에서 지식 안에서 많아질 것이며, 주의 은혜로 말미암아 빛을 받을 것입니다. 그의 제사직 동안 죄는 사라질 것이며, 불법한 자들은 악에서 멈출 것입니다. 10 참으로 그는 낙원의 문들을 열고, 아담을 향해 위협하던 칼을 치울 것입니다. 11 그는 성도들에게 생명나무에서 먹게 할 것이며, 거룩함의 영이 그들 위에 있을 것입니다. 12 벨리알은 그에 의해 결박될 것이며, 그는 자기 자녀들에게 악한 영들을 밟을 권세를 주실 것입니다. 13 주께서는 그의 자녀들로 말미암아 기뻐하시고, 그의 사랑받는 이들로 말미암아 영원히 기뻐하실 것입니다. 14 그때 아브라함과 이삭과 야곱이 크게 기뻐할 것이며, 나도 기뻐할 것입니다. 모든 성도는 의를 입을 것입니다.[a][b][c][d][e]
