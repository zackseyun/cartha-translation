  text: '1 And there again I saw a vision like the former one, after we had remained there seventy days. 2 And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the oracle of understanding, and the full-length robe of truth, and the plate of faith, and the turban of the head, and the ephod of prophecy.” 3 And each one of them was carrying these things, and they put them on me and said to me, “From now on, become a priest—you and all your seed.”


    4 And the first anointed me with holy oil and gave me a priestly staff. 5 And the second washed me with pure water of the Lord, and fed me holy bread and wine, and put around me a holy and glorious robe. 6 And the third put on me a linen garment, like an ephod. 7 And the fourth wrapped around me a girdle, like purple. 8 And the fifth gave me a branch of rich olive. 9 And the sixth placed a crown on my head. 10 And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.


    11 And they say to me, “Levi, your seed will be divided into three offices, for a sign of the glory of the Lord who is coming. 12 And the first lot will be great; none will arise greater than it. 13 And the second will be in priesthood. 14 And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, after the pattern of the nations, for all the nations. 15 And his presence is beloved, like a prophet of the Most High, from the seed of Abraham our father. 16 Therefore every desirable thing in Israel will be for you and for your seed, and your seed will eat every beautiful thing, and will apportion the table of the Lord. 17 And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”


    18 So when I awoke, I understood that this was like the first vision.'
translation:
  language: ko
  text: '1 그리고 거기에서 나는 다시, 우리가 그곳에 칠십 일을 머문 뒤에, 이전 것과 같은 환상을 보았습니다. 2 또 나는 흰 옷을 입은 일곱 사람을 보았는데, 그들이 내게 말했습니다. “일어나 제사장의 옷과 의의 관과 이해의 신탁과 진리의 긴 옷과 믿음의 판과 머리의 관과 예언의 에봇을 입으십시오.” 3 그들 각 사람은 이 물건들을 들고 있었고, 그것들을 내게 입히며 내게 말했습니다. “이제부터 너와 너의 모든 씨가 제사장이 되십시오.”


    4 첫째는 거룩한 기름으로 나에게 기름을 바르고 제사장의 지팡이를 주었습니다. 5 둘째는 주님의 맑은 물로 나를 씻기고 거룩한 빵과 포도주를 먹였으며, 거룩하고 영광스러운 옷을 내게 둘러주었습니다. 6 셋째는 아마포 옷을 내게 입혔는데, 에봇과 같았습니다. 7 넷째는 보라색 같은 띠를 내게 둘렀습니다. 8 다섯째는 기름진 올리브 가지를 내게 주었습니다. 9 여섯째는 내 머리에 관을 씌웠습니다. 10 일곱째는 제사장의 왕관을 내게 씌우고 내 손들을 향으로 채웠으니, 내가 주 하나님 앞에서 제사장 직분을 행하게 하려는 것이었습니다.


    11 그리고 그들이 내게 말했습니다. “레위야, 너의 씨는 세 갈래로 나뉠 것이니, 오는 주님의 영광의 표징이 될 것이다. 12 첫째 몫은 클 것이며, 그보다 더 큰 것은 일어나지 않을 것이다. 13 둘째는 제사장직에 속할 것이다. 14 셋째는 새 이름으로 불릴 것인데, 유다에서 한 왕이 일어나 새 제사장직을 세울 것이기 때문이다. 그것은 민족들의 본을 따라, 모든 민족을 위한 것이다. 15 그의 임재는 사랑스러우니, 지극히 높으신 이의 예언자 같고, 우리 조상 아브라함의 씨에서 난 이와 같다. 16 그러므로 이스라엘의 모든 바라는 것은 너와 너의 씨에게 있을 것이며, 너의 씨는 보기에 아름다운 모든 것을 먹고 주님의 식탁을 나눌 것이다. 17 그들 가운데서 제사장들과 재판관들과 서기관들이 나올 것이며, 그들의 입을 통해 거룩한 것이 받아들여질 것이다. 18 그래서 내가 깨어났을 때, 이것이 첫 번째 환상과 같은 것임을 깨달았습니다.”'
  philosophy: formal
lexical_decisions:
- source_word: ὅραμα ὡς τὸ πρότερον
  english_pob_choice: a vision like the former one
  chosen_korean: 이전 것과 같은 환상
  alternatives_korean:
  - 첫 번째와 같은 환상
  - 이전의 것과 같은 환상
  lexicon: ὅραμα
  rationale: ὅραμα는 ‘환상’이 자연스럽고, τὸ πρότερον은 직역된 ‘이전 것’으로 두어 앞선 환상과의 대응을 분명히 했습니다.
- source_word: στολὴν τῆς ἱερατείας / τὸν στέφανον τῆς δικαιοσύνης / τὸ λόγιον τῆς συνέσεως / τὸ πέταλον τῆς πίστεως / τὴν μίτραν τῆς κεφαλῆς / τὸ ἐφοὺδ τῆς προφητείας
  english_pob_choice: robe of the priesthood / crown of righteousness / oracle of understanding / plate of faith / turban of the head / ephod of prophecy
  chosen_korean: 제사장의 옷 / 의의 관 / 이해의 신탁 / 믿음의 판 / 머리의 관 / 예언의 에봇
  alternatives_korean:
  - 제사직의 옷 / 의의 면류관 / 이해의 예언 / 믿음의 금판 / 머리의 터번 / 예언의 에봇
  lexicon: στολή, στέφανος, λόγιον, πέταλον, μίτρα, ἐφούδ
  rationale: POB의 항목별 상징성을 유지하되, ‘오라클’을 ‘신탁’으로, ‘plate’를 ‘판’으로, ‘turban’을 설명적으로 ‘머리의 관’으로 옮겨 원문의 제의적 이미지와 항목 구분을 살렸습니다.
- source_word: εἰς τρεῖς ἀρχὰς διαιρεθήσεται
  english_pob_choice: will be divided into three offices
  chosen_korean: 세 갈래로 나뉠 것이니
  alternatives_korean:
  - 세 직분으로 나뉠 것이니
  - 세 관직으로 분류될 것이니
  lexicon: ἀρχαί
  rationale: ἀρχαί는 여기서 행정적 ‘직분/관직’보다 넓게 세 구분을 가리키므로, 문맥을 과도하게 제도화하지 않도록 ‘세 갈래’로 처리했습니다.
- source_word: δείκνυσι / παρουσία αὐτοῦ ἀγαπητή ἐστιν
  english_pob_choice: his presence is beloved
  chosen_korean: 그의 임재는 사랑스러우니
  alternatives_korean:
  - 그의 현존은 사랑받으니
  - 그의 উপস্থিত/임재는 사랑스럽습니다
  lexicon: παρουσία
  rationale: παρουσία를 단순한 ‘도착’보다 현존의 의미가 살아 있는 ‘임재’로 옮겼고, ἀγαπητή는 관계적 가치를 드러내는 ‘사랑스러운’으로 반영했습니다.
theological_decisions:
- issue: ‘지극히 높으신 이의 예언자’와 메시아적 왕의 연결
  chosen_reading: 14–15절의 왕은 유다에서 일어나 새 제사장직을 세우며, 동시에 지극히 높으신 이의 예언자 같은 임재로 묘사됩니다.
  alternative_readings:
  - 15절을 단순히 미래의 예언자에 대한 비교로만 읽는 해석
  - 14절의 왕과 15절의 예언자를 분리하는 해석
  rationale: 그리스어는 14절의 왕과 15절의 ‘그의 임재’를 연속적으로 제시하여, 왕권·제사장직·예언자적 표상이 한 인물의 묘사 안에서 겹치도록 읽히게 합니다.
  doctrine_reference: 본문의 내적 상징 체계와 구약적 메시아-제사장-예언자 이미지
