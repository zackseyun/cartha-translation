  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἡ δὲ παρουσία⁷⁹ αὐτοῦ ἀγαπητή⁸⁰ ἐστιν⁸¹ ὡς προφήτης⁸² ὑψίστου⁸³ ἐκ σπέρματος Ἀβραὰμ τοῦ⁸⁴ πατρὸς ἡμῶν⁸⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/015.yaml
  text: And his appearance is beloved, like a prophet of the Most High, from the seed of Abraham our father.
translation:
  language: ko
  text: 그의 외모는 지극히 높으신 이의 예언자요, 우리 조상 아브라함의 씨에서 난 자답게 사랑스럽습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  english_pob_choice: appearance
  chosen_korean: 외모
  alternatives_korean:
  - 모습
  - 출현
  - 존재감
  lexicon: παρουσία
  rationale: POB가 revised rendering에서 presence가 아니라 appearance로 확정했으므로, 문맥상 눈에 보이는 ‘겉모습/외모’로 옮겨 자연스러운 한국어를 택했습니다.
- source_word: ἀγαπητή
  english_pob_choice: beloved
  chosen_korean: 사랑스럽습니다
  alternatives_korean:
  - 사랑받습니다
  - 사랑받는 바입니다
  - 사랑스럽도다
  lexicon: ἀγαπητός
  rationale: 평서형 서술로서 ‘사랑받는다’의 상태를 드러내되, 현대 한국어에서는 사람의 인상과 호감도를 함께 살리는 ‘사랑스럽습니다’가 가장 자연스럽습니다.
- source_word: ὡς προφήτης ὑψίστου
  english_pob_choice: like a prophet of the Most High
  chosen_korean: 지극히 높으신 이의 예언자요
  alternatives_korean:
  - 지극히 높으신 이의 선지자와 같이
  - 가장 높으신 분의 예언자처럼
  lexicon: προφήτης / ὕψιστος
  rationale: ‘예언자’는 본문의 직함을 सीधे 반영하고, ὑψίστου는 신적 칭호이므로 한국어 관용에 맞게 ‘지극히 높으신 이’로 옮겼습니다.
- source_word: ἐκ σπέρματος Ἀβραὰμ τοῦ πατρὸς ἡμῶν
  english_pob_choice: from the seed of Abraham our father
  chosen_korean: 우리 조상 아브라함의 씨에서 난 자
  alternatives_korean:
  - 우리 조상 아브라함의 후손
  - 우리 조상 아브라함의 자손
  lexicon: σπέρμα / πατὴρ ἡμῶν
  rationale: σπέρμα를 ‘씨’로 유지해 혈통적·언약적 계보 이미지를 살리고, ‘우리 조상 아브라함’으로 ἡμῶν의 공동체적 포함을 드러냈습니다.
theological_decisions:
- issue: ἐκ σπέρματος Ἀβραὰμ의 계보적 표현
  chosen_reading: 아브라함과의 혈통적·언약적 연속성을 강조하는 표현으로 보았습니다.
  alternative_readings:
  - 단순한 생물학적 후손 표시
  - 메시아적 계보 암시
  rationale: 문장 자체는 혈통 표현이지만, 고대 유대 문맥에서는 언약 백성의 계승까지 함께 함축할 수 있으므로 그 긴장을 지우지 않고 살렸습니다.
  doctrine_reference: 언약과 계보의 성경적 표상
