id: T12P.LEV.8.7
reference: Testament of Levi 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ δὲ⁴⁷ τέταρτος ζώνην *μοι περιέβαλεν⁴⁸, ὁμοίαν πορφύρας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/007.yaml
  text: And the fourth wrapped around me a belt, like purple.
translation:
  language: ko
  text: 그런데 네 번째 사람이 저에게 자주색 같은 띠를 둘러 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζώνην
  english_pob_choice: belt
  chosen_korean: 띠
  alternatives_korean:
  - 벨트
  - 허리띠
  - 끈
  lexicon: ζώνη
  rationale: 몸에 둘러 매는 물건이라는 점을 살리면서도, 현대 한국어에서 너무 일상적이거나 지나치게 구어적인 ‘벨트’보다 서술적 문맥에 더 자연스러운 ‘띠’를 택했습니다.
- source_word: περιέβαλεν μοι
  english_pob_choice: wrapped around me
  chosen_korean: 저에게 … 둘러 주었습니다
  alternatives_korean:
  - 저를 감쌌습니다
  - 저에게 둘러맸습니다
  - 저에게 감아 주었습니다
  lexicon: περιβάλλω
  rationale: 동작의 방향이 ‘나에게/나를 향해’임을 분명히 하면서, 몸에 걸쳐 두르는 행위를 한국어로 자연스럽게 옮기기 위해 ‘둘러 주었습니다’를 선택했습니다.
- source_word: ὁμοίαν πορφύρας
  english_pob_choice: like purple
  chosen_korean: 자주색 같은
  alternatives_korean:
  - 보라색 같은
  - 자주빛 같은
  - 자주색과 같은
  lexicon: πορφύρα
  rationale: 포르퓌라(자주색)는 왕권·고급 직물과 연관된 색채이므로, 표준 한국어에서 그 뉘앙스를 비교적 잘 살리는 ‘자주색’을 사용했습니다.
theological_decisions:
- issue: 서술의 환시적·상징적 표현 유지
  chosen_reading: 문장의 직설적 환시 표현을 그대로 살려, 상징적 소품인 띠와 색채를 과장 없이 제시했습니다.
  alternative_readings:
  - 의미를 풀어 ‘자주색 허리띠를 받았습니다’처럼 완화하는 방식
  - 상징성을 덧붙여 설명하는 방식
  rationale: 이 절은 해석보다 묘사가 중심이므로, 상징의 의미를 미리 풀지 않고 원문이 말하는 이미지를 그대로 제시하는 편이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 본문 해석 원칙 및 묵시/환시 서술의 표면 의미 존중
