id: T12P.LEV.8.14
reference: Testament of Levi 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ὁ δὲ⁷⁵ τρίτος *ἐπικληθήσεται αὐτῷ ὄνομα καινόν⁷⁶, ὅτι βασιλεὺς †ἐκ τοῦ†⁷⁷ Ἰούδα ἀναστήσεται καὶ ποιήσει *ἱερατείαν νέαν, κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη⁷⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/014.yaml
  text: And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, according to the pattern of the nations, for all the nations.
translation:
  language: ko
  text: 그리고 셋째는 새 이름으로 불릴 것이니, 이는 유다에게서 왕이 일어나 새로운 제사직을 세울 것이며, 민족들의 본을 따라 모든 민족을 위함입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικληθήσεται αὐτῷ ὄνομα καινόν
  english_pob_choice: will be called by a new name
  chosen_korean: 새 이름으로 불릴 것이니
  alternatives_korean:
  - 새 이름을 받게 될 것이니
  - 새로운 이름으로 불리게 될 것이니
  lexicon: ἐπικαλέω / ὄνομα καινός
  rationale: 수동형 ‘불릴 것이니’로 이름 부여의 결과를 살리고, ‘새 이름’으로 ὄνομα καινόν의 직접성을 유지했습니다.
- source_word: βασιλεὺς ... Ἰούδα ἀναστήσεται
  english_pob_choice: a king will arise from Judah
  chosen_korean: 유다에게서 왕이 일어나
  alternatives_korean:
  - 유다에게서 한 왕이 일어나
  - 유다로부터 왕이 일어나
  lexicon: βασιλεύς / ἀνίστημι
  rationale: ‘유다에게서’는 출처를 자연스럽게 드러내며, ‘일어나’로 왕의 등장·출현을 간결하게 옮겼습니다.
- source_word: ποιήσει ἱερατείαν νέαν
  english_pob_choice: will establish a new priesthood
  chosen_korean: 새로운 제사직을 세울 것이며
  alternatives_korean:
  - 새 제사직을 세울 것이며
  - 새로운 제사직을 마련할 것이며
  lexicon: ποιέω / ἱερατεία
  rationale: ἱερατεία는 제도적 직분을 가리키므로 ‘제사직’이 적절하며, ποιήσει는 ‘세우다’로 제도 창설의 뉘앙스를 살렸습니다.
- source_word: κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη
  english_pob_choice: according to the pattern of the nations, for all the nations
  chosen_korean: 민족들의 본을 따라 모든 민족을 위함입니다
  alternatives_korean:
  - 민족들의 본에 따라 모든 민족을 위함입니다
  - 민족들의 모형을 따라 모든 민족을 위함입니다
  lexicon: τύπος / ἔθνη
  rationale: τύπος는 단순한 외형이 아니라 ‘본/모형’의 의미이므로 ‘본’을 택했고, ἔθνη는 문맥상 이방 민족들을 가리키는 일반적 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: ‘민족들의 본’과 ‘모든 민족’의 반복이 주는 구속사적 대비
  chosen_reading: 새 제사직은 이스라엘 내부의 단절이 아니라 열방 전체를 향한 질서를 통해 드러난다는 점을 살렸습니다.
  alternative_readings:
  - 단순히 ‘민족들의 방식’으로 완화하여 읽는 방법
  - ‘이방인의 본’으로 특정 민족집단만 지시하는 방법
  rationale: 원문은 τύπος와 ἔθνη의 반복으로 보편적 확장을 강조하므로, 이를 약화하지 않고 유지하는 것이 적절합니다.
  doctrine_reference: 구속사적 확장과 열방 포용의 주제
