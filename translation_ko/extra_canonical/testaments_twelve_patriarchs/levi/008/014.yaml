  to: 그리고 셋째는 새 이름으로 불릴 것입니다. 이는 유다에게서 한 왕이 일어나, 민족들의 본을 따라 모든 민족을 위한 새로운 제사직을 세울 것이기 때문입니다.
  rationale: 문장을 두 문장으로 나누어 ὅτι의 인과관계를 한국어 합쇼체로 자연스럽게 완결했습니다. ‘민족들의 본을 따라’와 ‘모든 민족을 위한’의 순서 및 의미를 보존하되, 후자를 ‘새로운 제사직’에 직접 연결했습니다. 원문의 불특정 왕을 ‘한 왕’으로 옮겼고, 내용 없는 각주 앵커는 삭제했습니다.
