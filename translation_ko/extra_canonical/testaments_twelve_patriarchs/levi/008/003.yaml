  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/003.yaml
  text: And each one of them was carrying something, and they placed it on me and said to me, “From now on, become a priest—you and all your seed.”
translation:
  language: ko
  text: 그리고 그들 각 사람은 무엇인가를 들고 있었고, 그것을 내게 올려놓고는 내게 말했습니다. “이제부터 너와 네 모든 씨가 제사장이 되어라.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάζοντες ἦσαν
  english_pob_choice: was carrying something
  chosen_korean: 무엇인가를 들고 있었고
  alternatives_korean:
  - 무언가를 지고 있었고
  - 어떤 것을 들고 있었고
  lexicon: βαστάζω
  rationale: 원문은 각 사람이 들고 있던 대상의 구체적 내용이 제시되지 않으므로, 영어 POB의 ‘something’을 따라 불특정 대상을 자연스럽게 옮겼습니다.
- source_word: ἐπέθηκαν μοι
  english_pob_choice: they placed it on me
  chosen_korean: 그것을 내게 올려놓고는
  alternatives_korean:
  - 그것을 내게 얹고는
  - 그것을 내 위에 두고는
  lexicon: ἐπιτίθημι
  rationale: 동작의 의미를 살려 ‘올려놓다’로 옮기되, 문맥상 연속 동작을 나타내는 ‘-고는’으로 자연스럽게 연결했습니다.
- source_word: Ἀπὸ τοῦ νῦν γενοῦ εἰς ἱερέα
  english_pob_choice: From now on, become a priest
  chosen_korean: 이제부터 … 제사장이 되어라
  alternatives_korean:
  - 지금부터 … 제사장이 되어라
  - 이제부터 … 제사장이 되십시오
  lexicon: γίνομαι + εἰς ἱερέα
  rationale: 직접 명령형의 강한 촉구를 살리면서, 한국어 성경 문체에 맞게 ‘제사장이 되어라’로 옮겼습니다.
- source_word: σπέρμα
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 씨앗
  lexicon: σπέρμα
  rationale: 영어 POB가 유지한 ‘seed’의 형식적·족장적 어감을 살리되, 한국어에서는 성경적 의미를 전달할 수 있는 ‘씨’를 선택했습니다.
theological_decisions:
- issue: 『제사장이 되어라』의 직접 화법과 등록
  chosen_reading: 예언/축복적 직설 명령으로 처리해 문장 자체의 긴박함을 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘제사장이 되라’로 낮추는 번역
  - 예의체로 ‘제사장이 되십시오’로 바꾸는 번역
  rationale: 원문은 신탁처럼 선포되는 직접 명령이므로, 청자에게 주어지는 강한 소명을 약화하지 않도록 직설형을 유지했습니다.
  doctrine_reference: 예언적 발화의 수사적 직접성
- issue: ‘너와 네 모든 씨’의 집합적 표현
  chosen_reading: 개인과 후손 전체를 함께 지시하는 집합적 표현으로 유지했습니다.
  alternative_readings:
  - ‘너와 네 모든 자손’으로 풀어 쓰는 번역
  - ‘너와 네 모든 후손’으로 일반화하는 번역
  rationale: σπέρμα의 족장적·세대적 연속성을 보존하기 위해, 영어 POB의 ‘seed’를 반영한 직역적 표현을 유지했습니다.
  doctrine_reference: 족장 언어와 계보적 약속의 표현
