  text: So when I awoke, I understood that this was like the first vision.
translation:
  language: ko
  text: 그러므로 내가 깨어났을 때, 이것이 첫 번째 꿈과 같다는 것을 깨달았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξυπνισθεὶς οὖν
  english_pob_choice: So when I awoke
  chosen_korean: 그러고 나서 내가 깨어나서
  alternatives_korean:
  - 그리하여 내가 깨어났고
  - 그런 다음 내가 깨어나서
  lexicon: ἐξυπνίζω
  rationale: aorist participle를 사건 진행 순서에 맞게 자연스러운 서술로 풀되, 원문의 시간적 접속사 οὖν의 흐름을 살려 “그러고 나서”로 옮겼습니다.
- source_word: συνῆκα
  english_pob_choice: I understood
  chosen_korean: 이해하니
  alternatives_korean:
  - 깨달으니
  - 알아차리니
  lexicon: συνίημι
  rationale: 단순한 지적 인지가 아니라 꿈의 의미를 파악하는 이해를 가리키므로 “이해하니”가 가장 무난합니다.
- source_word: ὅτι τοῦτο ὅμοιόν ἐστι τοῦ πρώτου ὀνείρου
  english_pob_choice: this was like the first vision
  chosen_korean: 이것은 첫 번째 꿈과 같은 것이었습니다
  alternatives_korean:
  - 이것은 첫 꿈과 비슷한 것이었습니다
  - 이것은 첫 번째 환상과 같았습니다
  lexicon: ὅμοιος / ὄνειρον
  rationale: English POB의 “vision”보다 원문 ὀνείρου가 분명히 “꿈”이므로 꿈으로 반영하고, ὅμοιον ἐστι를 “~와 같은 것”으로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: ὀνειρον의 의미 범위
  chosen_reading: “꿈”으로 번역해 서술의 구체성을 살렸습니다.
  alternative_readings:
  - “환상”으로 일반화
  - “몽시”로 문어화
  rationale: 본문은 해석된 계시가 아니라 이전 ‘꿈’과의 유사성을 말하므로, 꿈이라는 장르 표지를 보존하는 편이 원문에 가깝습니다.
  doctrine_reference: 해석학적 장르 보존
