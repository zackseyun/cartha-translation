id: T12P.LEV.8.16
reference: Testament of Levi 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶν οὖν ἐπιθυμητὸν⁸⁶ ἐν Ἰσραὴλ⁸⁷ σοὶ⁸⁸ ἔσται καὶ τῷ σπέρματί σου⁸⁹, καὶ ἔδεσθε⁹⁰ πᾶν ὡραῖον ἐν⁹¹ ὁράσει, καὶ τὴν τράπεζαν Κυρίου διανεμεῖται⁹² τὸ σπέρμα σου⁹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/016.yaml
  text: Therefore every desirable thing in Israel will be for you and for your seed, and you will eat every beautiful thing for the eye, and your seed will apportion the table of the Lord.
translation:
  language: ko
  text: 그러므로 이스라엘의 모든 바람직한 것은 너와 네 씨에게 있을 것이며, 너희 씨는 눈에 아름다운 모든 것을 먹고, 너희 씨가 주님의 식탁을 나누어 차지할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶν οὖν ἐπιθυμητὸν ἐν Ἰσραὴλ
  english_pob_choice: every desirable thing in Israel
  chosen_korean: 이스라엘의 모든 바람직한 것은
  alternatives_korean:
  - 이스라엘의 모든 원하는 것은
  - 이스라엘의 모든 아름다운 것은
  lexicon: ἐπιθυμητός
  rationale: ἐπιθυμητόν은 단순한 ‘원하는’보다 가치 있고 바람직한 대상을 가리키므로, 문맥에 맞게 ‘바람직한 것’으로 옮겼습니다.
- source_word: τῷ σπέρματί σου / τὸ σπέρμα σου
  english_pob_choice: your seed
  chosen_korean: 네 씨 / 너희 씨
  alternatives_korean:
  - 네 자손
  - 네 후손
  lexicon: σπέρμα
  rationale: 본문의 반복되는 σπέρμα를 POB의 ‘seed’에 맞춰 ‘씨’로 유지해 혈통적·언약적 연속성을 드러냈습니다.
- source_word: ἔδεσθε πᾶν ὡραῖον ἐν ὁράσει
  english_pob_choice: you will eat every beautiful thing for the eye
  chosen_korean: 너희 씨는 눈에 아름다운 모든 것을 먹고
  alternatives_korean:
  - 너희 씨는 보기에 아름다운 모든 것을 먹고
  - 너희 씨는 눈앞에 아름다운 모든 것을 먹고
  lexicon: ὡραῖος / ὅρασις
  rationale: 직역하면 ‘보기에 아름다운’이지만, 영어 POB의 의미를 따라 시각적으로 매혹적인 대상을 가리키는 표현으로 정리했습니다.
- source_word: τὴν τράπεζαν Κυρίου διανεμεῖται
  english_pob_choice: your seed will apportion the table of the Lord
  chosen_korean: 너희 씨가 주님의 식탁을 나누어 차지할 것입니다
  alternatives_korean:
  - 너희 씨가 주님의 식탁을 분배할 것입니다
  - 너희 씨가 주님의 식탁을 배분할 것입니다
  lexicon: τράπεζα / διανέμω
  rationale: τράπεζα를 단순한 ‘탁자’가 아니라 식사와 제의를 함축하는 ‘식탁’으로 옮기고, διανεμεῖται는 공동 몫을 나누어 갖는 뜻을 살려 ‘나누어 차지하다’로 표현했습니다.
theological_decisions:
- issue: ‘주님의 식탁’의 제의적 함의
  chosen_reading: 문맥상 단순한 가구가 아니라 야훼께 속한 복된 몫과 제의적 식탁을 암시하는 표현으로 유지했습니다.
  alternative_readings:
  - 주님의 상
  - 주님의 제단 식탁
  rationale: 그리스어 τράπεζα Κυρίου는 문자적 식탁이면서도 성전적·제의적 배경을 띠므로, 과도하게 특정 제도어로 고정하지 않고 원의미를 보존했습니다.
  doctrine_reference: 성전/제의 이미지의 보존
- issue: ‘눈에 아름다운’의 감각적 표현
  chosen_reading: 시각적으로 매력적인 복을 가리키는 표현을 그대로 살려, 문장을 미화하지 않고 감각적 강도를 유지했습니다.
  alternative_readings:
  - 보기에 좋은
  - 보기 좋은
  rationale: 본문은 단순한 미적 평가를 넘어 소유와 향유의 복을 말하므로, 감각적 어감을 약화시키지 않는 방향이 적절합니다.
  doctrine_reference: 문학적-상징적 표현 유지
