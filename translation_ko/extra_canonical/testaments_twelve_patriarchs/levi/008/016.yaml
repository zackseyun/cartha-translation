  - severity: medium
    issue: διανεμεῖται를 ‘나누어 차지하다’로 번역함
    rationale: διανέμω는 분배·배분을 뜻하며, ‘차지하다’는 원문에 없는 취득의 의미를 보탭니다.
  - severity: low
