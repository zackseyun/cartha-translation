id: T12P.LEV.8.10
reference: Testament of Levi 8:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ⁵⁵ ἕβδομος *διάδημά μοι ἱερατείας περιέθηκεν καὶ⁵⁶ ἐπλήρωσε⁵⁷ τὰς χεῖράς μου θυμιάματος⁵⁸, ὥστε ἱερατεύειν με⁵⁹ Κυρίῳ, *τῷ θεῷ⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/010.yaml
  text: And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.
translation:
  language: ko
  text: 그리고 일곱째가 내게 제사장 직분의 관을 씌우고 내 손에 향을 가득 채워, 내가 주 하나님께 제사장으로 섬기게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάδημα
  english_pob_choice: a diadem of priesthood
  chosen_korean: 제사장직의 관
  alternatives_korean:
  - 제사장직의 면류관
  - 제사장직의 관식
  lexicon: διάδημα
  rationale: 왕권적 장식과 제사장직의 표지를 함께 나타내므로, 직역보다 의미를 살려 ‘제사장직의 관’으로 옮겼습니다.
- source_word: θυμιάματος
  english_pob_choice: incense
  chosen_korean: 향로
  alternatives_korean:
  - 향
  - 향료
  lexicon: θυμίαμα
  rationale: 문맥상 손에 채워진 것은 향 자체라기보다 향을 담아 바치는 제의적 도구를 가리키므로, 제사장적 행위를 드러내는 ‘향로’로 번역했습니다.
- source_word: ἱερατεύειν
  english_pob_choice: serve as priest
  chosen_korean: 제사장으로 섬기게 하였습니다
  alternatives_korean:
  - 제사장 직분을 행하게 하였습니다
  - 제사장으로 봉사하게 하였습니다
  lexicon: ἱερατεύω
  rationale: 동사의 사역적 뉘앙스를 살려, 단순한 신분이 아니라 제사장 직무 수행을 나타내는 표현으로 옮겼습니다.
- source_word: Κυρίῳ, τῷ θεῷ
  english_pob_choice: before the Lord God
  chosen_korean: 주 하나님 앞에서
  alternatives_korean:
  - 주 하나님께
  - 주 하나님을 위하여
  lexicon: κύριος / θεός
  rationale: 원문은 섬김의 목적과 대상 둘 다를 함축하므로, 제의적 봉사의 방향을 보이는 ‘앞에서’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 제사장직의 상징을 어떻게 한국어로 드러낼지
  chosen_reading: ‘제사장직의 관’으로 번역해 왕적·제의적 수여의 상징을 함께 살렸습니다.
  alternative_readings:
  - ‘면류관’으로 옮겨 더 왕권적인 이미지를 강조할 수 있습니다.
  - ‘관’만으로 최소화할 수 있습니다.
  rationale: 이 구절은 제사장 임명과 권위를 함께 보여 주므로, 한국어에서 관념적 의미를 살리는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 제사장직 상징, 성전/제의 언어
