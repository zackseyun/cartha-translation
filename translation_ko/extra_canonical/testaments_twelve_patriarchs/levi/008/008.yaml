- source_word: πιότητος
  english_pob_choice: rich
  chosen_korean: 풍성한
  alternatives_korean:
  - 기름진
  - 비옥한
  - 넉넉한
  lexicon: none
  rationale: 열매 맺음과 충만함을 드러내는 형용사로 이해하여, 한국어에서는 ‘풍성한’이 가장 무난하게 원문의 뉘앙스를 전달합니다.
theological_decisions:
- issue: 풍요를 나타내는 형용사의 의미 범위
  chosen_reading: ‘풍성한’으로 번역해 물질적 비옥함과 결실의 이미지를 함께 살렸습니다.
  alternative_readings:
  - 기름진 올리브나무
  - 비옥한 올리브나무
  rationale: πιότητος의 핵심은 단순한 외형 묘사보다 충만한 풍요의 이미지이므로, 과도한 축약이나 지나친 해석 없이 그 함의를 드러냈습니다.
  doctrine_reference: 상징적 꿈/환상 서술에서 이미지의 기능을 보존하는 원칙
