lexical_decisions:
- source_word: πέμπτος
  english_pob_choice: the fifth
  chosen_korean: 다섯째
  alternatives_korean:
  - 다섯 번째
  - 다섯째 사람
  lexicon: none
  rationale: 서술 맥락상 순서를 나타내므로 자연스러운 서술형 표현인 ‘다섯째’를 썼습니다.
- source_word: κλάδον
  english_pob_choice: a branch
