  alternatives_korean:
  - 한 가지
  - 가지
  lexicon: none
  rationale: 단수 목적격의 의미를 살리되 한국어에서는 ‘가지 하나’가 가장 자연스럽고 구체적입니다.
- source_word: ἐλαίας
  english_pob_choice: of a rich olive tree
  chosen_korean: 올리브나무의
  alternatives_korean:
  - 올리브의
