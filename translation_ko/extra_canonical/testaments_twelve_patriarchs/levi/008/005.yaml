  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/005.yaml
  text: And the second washed me with the Lord's pure water, and fed me holy bread and wine, and put around me a holy and glorious robe.
translation:
  language: ko
  text: 그리고 둘째는 나를 주님의 깨끗한 물로 씻어 주고, 거룩한 빵과 포도주를 먹여 주며, 거룩하고 영광스러운 옷을 내게 입혀 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδατι κυρίου καθαρῷ
  english_pob_choice: the Lord's pure water
  chosen_korean: 주님의 깨끗한 물
  alternatives_korean:
  - 주님의 순수한 물
  - 주님의 정결한 물
  lexicon: ὕδωρ, καθαρός, κύριος
  rationale: 속격 관계를 자연스러운 소유격으로 살려 ‘주님의’로 옮기고, καθαρός는 의례적·도덕적 맥락을 모두 포괄할 수 있게 ‘깨끗한’으로 번역했습니다.
- source_word: ἐψώμισέν με ἄρτον καὶ οἶνον ἅγιον
  english_pob_choice: fed me holy bread and wine
  chosen_korean: 거룩한 빵과 포도주를 먹이며
  alternatives_korean:
  - 거룩한 떡과 포도주를 먹이며
  - 거룩한 빵과 술을 먹이며
  lexicon: ἄρτος, οἶνος, ἅγιος
  rationale: ἄρτος는 여기서 성찬적·제의적 배경을 지니지만, 본문 자체의 어휘는 일반적 ‘빵’이므로 직역성을 살려 ‘빵’으로 두었습니다. οἶνος는 현대 한국어에서 오해가 적은 ‘포도주’가 적절합니다.
- source_word: περιέθηκε μοι στολὴν ἁγίαν καὶ ἔνδοξον
  english_pob_choice: put around me a holy and glorious robe
  chosen_korean: 거룩하고 영광스러운 옷을 내게 둘러 주었습니다
  alternatives_korean:
  - 거룩하고 영광스러운 겉옷을 입혀 주었습니다
  - 거룩하고 영화로운 의복을 내게 둘러 주었습니다
  lexicon: στολή, ἁγιος, ἔνδοξος
  rationale: περιτίθημι의 ‘둘러 입히다/감싸다’ 의미를 살려 동작을 드러내고, στολή는 예식적 옷을 뜻하므로 ‘옷’으로 넓게 옮겼습니다.
theological_decisions:
- issue: 정결 의례와 성찬적 이미지를 동시에 보존할지 여부
  chosen_reading: 본문의 물, 빵, 포도주, 옷을 모두 의례적 상징으로 보되, 한국어에서는 과도한 해석을 덧붙이지 않고 서술형으로 유지했습니다.
  alternative_readings:
  - 세례와 성찬을 명시적으로 암시하는 번역
  - 상징성을 약화시킨 평이한 일상 묘사
  rationale: 이 구절은 정결과 예식의 연속 동작을 통해 인물의 준비를 묘사하므로, 독자가 의례적 분위기를 읽을 수 있게 하되 교단적 해설어는 넣지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: 의례적 상징성과 본문 맥락 보존
