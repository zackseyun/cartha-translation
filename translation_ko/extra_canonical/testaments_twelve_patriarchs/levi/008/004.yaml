  source_fidelity: 그리스어는 ‘첫째가’ 화자에게 ‘거룩한 기름으로 기름을 바르고’ ‘지팡이’를 주었다고만 합니다. 초안의 ‘제사장 지팡이’는 원문 ῥάβδον에 없는 직분적 한정을 추가합니다. 또한 높임 선어말 ‘-시-’는 원문이 명시하지 않는 인물의 지위를 부가할 수 있습니다.
