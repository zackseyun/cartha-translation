    rationale: ὁ πρῶτος가 누구인지 이 절만으로 확정되지 않으므로, 존대의 ‘-시-’를 피하는 편이 불필요한 인물 규정을 피합니다.
  revised_text: 그리고 첫째가 거룩한 기름으로 제게 기름을 부어 주고, 지팡이를 주었습니다.
