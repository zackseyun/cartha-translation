    rationale: 그리스어 ῥάβδον은 단지 ‘지팡이/막대기’이며, ‘제사장의’ 또는 ‘제사장용’에 해당하는 수식어가 없습니다. 영어 감사 번역의 해석적 ‘priestly’를 따라가기보다 원문 우선 원칙에 따라 한정을 제거해야 합니다.
  - severity: low
