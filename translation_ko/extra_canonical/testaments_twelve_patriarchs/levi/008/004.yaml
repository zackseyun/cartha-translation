  text: And the first anointed me with holy oil and gave me a priestly staff.
translation:
  language: ko
  text: 그리고 첫째가 거룩한 기름으로 제게 기름을 부어 주고, 지팡이를 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλειψέ ... ἐλαίῳ ἁγίῳ
  english_pob_choice: anointed me with holy oil
  chosen_korean: 거룩한 기름으로 저를 기름부으시고
  alternatives_korean:
  - 거룩한 기름으로 저를 바르시고
  - 성스러운 기름으로 저를 기름부으시고
  lexicon: ἄλειφω / χρίω
  rationale: 동작은 기름을 바르는 행위이지만, 문맥상 성별·임직의 의미가 강하므로 POB의 ‘anointed’를 살려 ‘기름부으시고’로 옮겼습니다. ‘거룩한 기름’은 ἁγίῳ의 직접 대응입니다.
- source_word: ῥάβδον
  english_pob_choice: a priestly staff
  chosen_korean: 제사장 지팡이
  alternatives_korean:
  - 제사장의 지팡이
  - 사제의 지팡이
  lexicon: ῥάβδος
  rationale: 그리스어에는 ‘priestly’에 해당하는 형용사가 없지만, 영어 POB가 제사장 직분을 분명히 밝혔으므로 그 해석을 반영해 ‘제사장 지팡이’로 옮겼습니다.
- source_word: ὁ πρῶτος
  english_pob_choice: the first
  chosen_korean: 첫째
  alternatives_korean:
  - 첫 사람이
  - 첫 번째 사람
  lexicon: πρῶτος
  rationale: 의례적 순서를 가리키는 표현으로 읽히므로 자연스러운 한국어로 ‘첫째’라고 처리했습니다.
theological_decisions:
- issue: 기름부음의 의례적 의미
  chosen_reading: 단순한 도포가 아니라 제의적 임명/성별의 행위로 이해해 ‘기름부으시고’로 옮겼습니다.
  alternative_readings:
  - 그가 나에게 거룩한 기름을 바르셨습니다
  - 그가 나에게 기름을 부었습니다
  rationale: 본문의 뒤이어 나오는 ‘제사장 지팡이’와 함께 읽을 때, 이 행위는 제사장직 부여를 가리키는 의례적 장면으로 보는 것이 가장 자연스럽습니다.
  doctrine_reference: 성별과 직분 수여의 의례적 표지
