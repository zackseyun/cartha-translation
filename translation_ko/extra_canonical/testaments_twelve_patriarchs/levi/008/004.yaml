  terminology: ἐλαίῳ ἁγίῳ는 ‘거룩한 기름으로’, ἤλειψε는 의례 문맥을 해치지 않으면서 ‘기름을 부어 주고’로 옮겼습니다. ῥάβδος는 해석을 더하지 않고 ‘지팡이’로 번역했습니다.
