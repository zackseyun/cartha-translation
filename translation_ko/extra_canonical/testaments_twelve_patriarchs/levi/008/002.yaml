id: T12P.LEV.8.2
reference: Testament of Levi 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶδον⁵ ἑπτὰ ἄνδρας⁶ ἐν ἐσθῆτι⁷ λευκῇ⁸ *λέγοντάς μοι⁹· Ἀναστὰς ἔνδυσαι τὴν στολὴν τῆς ἱερατείας, καὶ¹⁰ τὸν στέφανον τῆς δικαιοσύνης¹¹, *καὶ τὸ λόγιον¹² τῆς συνέσεως καὶ τὸν ποδήρη¹³ τῆς ἀληθείας καὶ τὸ πέταλον¹⁴ τῆς πίστεως καὶ τὴν μίτραν¹⁵ †τῆς κεφαλῆς†¹⁶ καὶ τὸ ἐφοὺδ τῆς προφητείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/002.yaml
  text: And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the breastpiece of understanding, and the full-length robe of truth, and the plate of faith, and the turban for the head, and the ephod of prophecy.”
translation:
  language: ko
  text: 그리고 내가 흰옷을 입은 일곱 사람을 보았는데, 그들이 나에게 말하였습니다. 「일어나서 제사직의 옷과 의의 관과 이해의 판판형 흉패와 진리의 긴 옷과 믿음의 판과 머리에 쓰는 관과 예언의 에봇을 입으라」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτὰ ἄνδρας
  english_pob_choice: seven men
  chosen_korean: 일곱 사람
  alternatives_korean:
  - 일곱 남자들
  - 일곱 사람들
  lexicon: ἄνδρας
  rationale: 직역하면 남자들이지만, 한국어 성경 문맥에서는 인물 일반을 포괄하는 ‘사람’이 자연스럽고, 본문의 초점이 인원 수와 발화 내용에 있습니다.
- source_word: ἐν ἐσθῆτι λευκῇ
  english_pob_choice: in white clothing
  chosen_korean: 흰옷을 입은
  alternatives_korean:
  - 흰 의복을 입은
  - 희고 깨끗한 옷을 입은
  lexicon: ἐσθῆτι λευκῇ
  rationale: 영어 POB의 ‘white clothing’을 따라 색채와 의복을 단순하고 직접적으로 옮겼습니다.
- source_word: λόγιον
  english_pob_choice: breastpiece
  chosen_korean: 판판형 흉패
  alternatives_korean:
  - 흉패
  - 가슴판
  lexicon: λόγιον
  rationale: POB 개정이 이 단어를 ‘breastpiece’로 확정했으므로, 제사장 의복의 부속물임을 드러내기 위해 ‘흉패’로 옮기고, 이해를 돕는 설명적 요소를 붙였습니다.
- source_word: ποδήρη
  english_pob_choice: full-length robe
  chosen_korean: 긴 옷
  alternatives_korean:
  - 발목까지 내려오는 옷
  - 전신을 덮는 옷
  lexicon: ποδήρη
  rationale: 원문의 길이를 나타내는 형용사로, 과도하게 풀지 않고 옷의 길이를 나타내는 ‘긴 옷’으로 간결하게 처리했습니다.
- source_word: πέταλον
  english_pob_choice: plate
  chosen_korean: 판
  alternatives_korean:
  - 금판
  - 패
  lexicon: πέταλον
  rationale: 제사장 머리장식에 붙는 금속판을 가리키므로 ‘판’이 가장 중립적이며, 영어 POB의 ‘plate’와도 대응됩니다.
- source_word: ἐφοὺδ
  english_pob_choice: ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에봇복
  - 에포드
  lexicon: ἐφοὺδ
  rationale: 성경 전통에서 널리 알려진 제사장 의복 용어이므로 음역어 ‘에봇’을 사용했습니다.
theological_decisions:
- issue: 제사장 복식 명칭의 전달 방식
  chosen_reading: 제사장 제의적 상징을 유지하되, 한국어에서는 독자가 즉시 파악할 수 있도록 ‘흉패’, ‘판’, ‘에봇’처럼 제의적 용어를 직설적으로 사용했습니다.
  alternative_readings:
  - 의례적 상징을 풀어 설명하는 번역
  - 전통 교회어만으로 순화한 번역
  rationale: 이 구절은 상징적 복식 목록 자체가 의미를 이루므로, 설명으로 환원하기보다 원문의 물질성과 상징성을 함께 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 성전/제사장 상징의 수용
- issue: ‘의의 관’의 번역
  chosen_reading: στέφανον τῆς δικαιοσύνης를 ‘의의 관’으로 옮겨, 의로움이 승리의 화관처럼 수여되는 이미지를 살렸습니다.
  alternative_readings:
  - 의의 면류관
  - 정의의 관
  rationale: στέφανος는 통상적인 왕관보다 수여된 화관·관의 뉘앙스가 강하므로, 한국어에서도 ‘관’으로 간결하게 반영했습니다.
  doctrine_reference: 상징적 보상/의의 표상
