  lexicon: ordinal numeral + subject/topic marking
  rationale: 문맥상 앞선 존재들 가운데 ‘여섯째’라는 순서 표시를 자연스럽게 살리되, 한국어 서술 흐름에 맞게 주제를 드러냈습니다.
- source_word: στέφανόν
  english_pob_choice: a crown
  chosen_korean: 관을
  alternatives_korean:
  - 왕관을
  - 면류관을
  lexicon: στέφανος
  rationale: στέφανος는 일반적으로 ‘왕권의 왕관’보다 더 넓게 ‘관’을 뜻하므로, 과도한 해석을 피하면서도 현대 한국어에서 자연스럽게 옮겼습니다.
- source_word: περιέθηκεν
