  - 둘렀습니다
  - 놓았습니다
  lexicon: περιτίθημι
  rationale: 머리에 관을 두르는 동작을 한국어로 가장 직접적으로 드러내는 표현으로, 원문의 ‘둘러 주다/씌우다’ 의미를 살렸습니다.
