  alternative_readings:
  - ‘영광의 관’처럼 의미를 보강하는 번역
  - 상징성을 암시하는 의역
  rationale: 원문과 영어 POB가 모두 단순 서술이므로, 본문의 표면적 의미를 유지하는 것이 가장 충실합니다.
