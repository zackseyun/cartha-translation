  text: And the third put on me a linen garment, like an ephod.
translation:
  language: ko
  text: 그리고 셋째가 내게 에봇과 비슷한 아마포 옷을 입혀 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυσσίνην
  english_pob_choice: linen garment
  chosen_korean: 아마옷
  alternatives_korean:
  - 리넨 옷
  - 삼베옷
  - 아마 천의 옷
  lexicon: βύσσινος
  rationale: βυσσίνην은 아마/리넨 계열의 직물을 가리키므로, 직물 재질을 살리면서도 의복으로 자연스럽게 읽히는 ‘아마옷’으로 옮겼습니다.
- source_word: μοι περιέθηκεν
  english_pob_choice: put on me
  chosen_korean: 나에게 ... 입혔는데
  alternatives_korean:
  - 내게 ... 둘러주었는데
  - 내게 ... 입혀 주었는데
  - 나에게 ... 걸쳐 주었는데
  lexicon: περιτίθημι
  rationale: 동사 περιέθηκεν은 ‘둘러주다/입히다’의 뜻을 가지며, 문맥상 의복을 몸에 걸치게 하는 행위이므로 자연스럽게 ‘입혔는데’로 옮겼습니다.
- source_word: ἐφούδ
  english_pob_choice: ephod
  chosen_korean: 에봇
  alternatives_korean:
  - 에훗
  - 제사복
  - 에봇과 비슷한 제사장 옷
  lexicon: ἐφούδ
  rationale: ἐφούδ는 성경 용례에서 제사장 의복인 ‘에봇’을 가리키므로, 전통적이면서도 원어 대응이 분명한 음역 ‘에봇’을 유지했습니다.
