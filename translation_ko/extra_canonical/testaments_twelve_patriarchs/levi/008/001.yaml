  text: And there again I saw a vision like the former one, after we had spent seventy days there.
translation:
  language: ko
  text: 그리고 그곳에서 나는 다시, 전과 같은 환상을 보았습니다. 우리가 그곳에서 칠십 일을 보낸 뒤였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖ πάλιν εἶδον
  english_pob_choice: And there again I saw
  chosen_korean: 그리고 그곳에서 나는 다시 보았습니다
  alternatives_korean:
  - 그리고 거기서 다시 나는 보았습니다
  - 그리고 그곳에서 나는 또 보았습니다
  lexicon: Κἀκεῖ / πάλιν / εἶδον
  rationale: Κἀκεῖ를 자연스럽게 ‘그곳에서’로 옮기고, πάλιν은 ‘다시’로 살려 사건의 재발을 분명히 했습니다.
- source_word: ὅραμα ὡς τὸ πρότερον
  english_pob_choice: a vision like the former one
  chosen_korean: 전과 같은 환상
  alternatives_korean:
  - 이전과 같은 환상
  - 먼저 본 것과 같은 환상
  lexicon: ὅραμα / τὸ πρότερον
  rationale: ὅραμα는 문맥상 ‘환상’이 적절하며, τὸ πρότερον은 ‘전과 같은’으로 간결하게 반영했습니다.
- source_word: μετὰ τὸ ποιῆσαι ἡμᾶς ἐκεῖ ἡμέρας ἑβδομήκοντα
  english_pob_choice: after we had spent seventy days there
  chosen_korean: 우리가 그곳에서 칠십 일을 보낸 뒤였습니다
  alternatives_korean:
  - 우리가 그곳에 칠십 일을 머문 뒤였습니다
  - 그곳에서 우리가 칠십 일을 지낸 뒤였습니다
  lexicon: μετὰ τὸ + aorist infinitive / ἡμέρας ἑβδομήκοντα
  rationale: POB의 수정안처럼 ‘spent seventy days there’의 자연스러운 의미를 살리되, 한국어에서는 ‘칠십 일을 보낸 뒤’로 시간 경과를 매끄럽게 표현했습니다.
