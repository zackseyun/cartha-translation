id: T12P.LEV.8.11
reference: Testament of Levi 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ λέγουσι⁶¹ πρός με· Λευί⁶², εἰς τρεῖς ἀρχὰς διαιρεθήσεται⁶³ τὸ σπέρμα σου⁶⁴, εἰς⁶⁵ σημεῖον⁶⁶ *δόξης Κυρίου ἐπερχομένου⁶⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/011.yaml
  text: And they say to me, “Levi, your seed will be divided into three divisions, as a sign of the glory of the Lord who is coming.”
translation:
  language: ko
  text: 그리고 그들이 저에게 말합니다. “레위야, 네 자손은 다가오시는 주님의 영광을 나타내는 표징으로 세 부류로 나뉠 것이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λευί
  english_pob_choice: Levi
  chosen_korean: 레위
  alternatives_korean:
  - 리비
  lexicon: 고유명사
  rationale: 성서 인명으로 널리 정착된 표기인 ‘레위’를 사용했습니다.
- source_word: εἰς τρεῖς ἀρχὰς διαιρεθήσεται
  english_pob_choice: will be divided into three divisions
  chosen_korean: 세 갈래로 나뉠 것이니
  alternatives_korean:
  - 세 분부로 나뉠 것이니
  - 세 구분으로 나뉠 것이니
  lexicon: διαιρέω / ἀρχή
  rationale: διαιρεθήσεται의 ‘나뉘다’를 살리고, ἀρχάς는 POB의 revised English처럼 ‘offices’보다 ‘divisions’에 가깝게 이해해 ‘세 갈래’로 자연스럽게 옮겼습니다.
- source_word: εἰς σημεῖον
  english_pob_choice: as a sign
  chosen_korean: 표징이 될 것이다
  alternatives_korean:
  - 징표가 될 것이다
  - 표지가 될 것이다
  lexicon: σημεῖον
  rationale: 문맥상 ‘~으로서/되도록’의 목적·결과를 담아 ‘표징이 될 것이다’로 번역했습니다.
- source_word: δόξης Κυρίου ἐπερχομένου
  english_pob_choice: the glory of the Lord who is coming
  chosen_korean: 다가오시는 주님의 영광
  alternatives_korean:
  - 오시는 주님의 영광
  - 다가오시는 주의 영광
  lexicon: δόξα / κύριος / ἐπερχομένου
  rationale: ἐπερχομένου를 ‘다가오시는’으로 풀어 임박한 도래감을 살렸고, κύριος는 본문 문맥상 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: ‘주의 영광’과 ‘다가오시는 주님’의 결합
  chosen_reading: ‘다가오시는 주님의 영광’으로 옮겨, 영광이 단순한 속성이 아니라 도래하는 주님과 연결된 표징임을 드러냈습니다.
  alternative_readings:
  - ‘주님의 영광이 다가오는 분의 표징’
  - ‘다가오시는 주의 영광’
  rationale: 그리스어는 genitive와 현재분사 결합으로 도래의 주체를 강조하므로, 한국어에서도 그 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 묵시적 도래 표현의 문맥 보존
