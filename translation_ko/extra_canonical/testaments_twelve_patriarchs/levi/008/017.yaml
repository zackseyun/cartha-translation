id: T12P.LEV.8.17
reference: Testament of Levi 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐξ αὐτῶν⁹⁴ ἔσονται ἱερεῖς⁹⁵ καὶ⁹⁶ κριταὶ καὶ⁹⁶ γραμματεῖς· καὶ⁹⁷ ἐπὶ στόματος αὐτῶν †ληφθήσεται⁹⁸ τὸ ἅγιον⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/017.yaml
  text: And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”
translation:
  language: ko
  text: 그리고 그들 가운데서 제사장들과 재판관들과 서기관들이 나올 것이며, 그들의 입을 통해 그 거룩한 것이 받아들여질 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερεῖς
  english_pob_choice: priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 제관들
  lexicon: ἱερεύς
  rationale: 성전·제의 맥락에서 직분 명칭을 직접 살려 ‘제사장들’로 옮겼습니다.
- source_word: κριταὶ
  english_pob_choice: judges
  chosen_korean: 재판관들
  alternatives_korean:
  - 심판관들
  - 판관들
  lexicon: κριτής
  rationale: 법적 판단자를 가리키므로 현대 한국어에서 비교적 중립적인 ‘재판관들’을 택했습니다.
- source_word: γραμματεῖς
  english_pob_choice: scribes
  chosen_korean: 서기관들
  alternatives_korean:
  - 율법학자들
  - 필경사들
  lexicon: γραμματεύς
  rationale: 유대교 문맥의 문서·율법 해석 직분을 반영하는 표준 번역인 ‘서기관들’을 유지했습니다.
- source_word: τὸ ἅγιον
  english_pob_choice: the holy thing
  chosen_korean: 그 거룩한 것
  alternatives_korean:
  - 거룩한 것
  - 성물
  lexicon: ἅγιος
  rationale: 영어 POB의 ‘holy thing’에 맞춰 추상화하지 않고 대상성을 살린 ‘그 거룩한 것’으로 옮겼습니다.
theological_decisions:
- issue: ἐπὶ στόματος αὐτῶν의 의미
  chosen_reading: 그들의 입을 통해
  alternative_readings:
  - 그들의 입으로
  - 그들의 말에 의해
  rationale: 직역적이면서도 한국어에서 자연스러운 도구·매개 표현으로, 입이 매개가 되어 거룩한 것이 받아들여진다는 뜻을 살렸습니다.
  doctrine_reference: 말의 매개성과 예언적/제의적 중개 표현
- issue: τὸ ἅγιον의 구체성
  chosen_reading: 거룩한 것
  alternative_readings:
  - 거룩한 제물
  - 성물
  rationale: 원문과 영어 POB가 특정 제물로 한정하지 않으므로, 가능한 한 범위를 좁히지 않았습니다.
  doctrine_reference: 본문 범위 보존
