  text: For just as the sun is pure before the Lord upon the earth, so also you are, the lights of Israel, beyond all the nations.
translation:
  language: ko
  text: 태양이 땅 위에서 주님 앞에 깨끗한 것과 같이, 너희도 그러합니다. 너희는 이스라엘의 빛들이며, 모든 민족보다 뛰어납니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ †ἥλιος† ... καθαρὸς
  english_pob_choice: the sun is pure
  chosen_korean: 태양이 ... 깨끗한
  alternatives_korean:
  - 태양이 ... 순결한
  - 해가 ... 깨끗한
  lexicon: ἥλιος, καθαρός
  rationale: 비유의 핵심은 도덕적/의례적 ‘깨끗함’보다 눈에 보이는 ‘순수함·맑음’에 가까우므로, 자연스러운 현대어로 ‘깨끗한’을 택했습니다.
- source_word: ἐνώπιον κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님 앞에서
  - 주님 보시기에
  lexicon: ἐνώπιον + κύριος
  rationale: 전치사적 관계를 살리면서도 한국어에서 가장 직관적인 대응인 ‘앞에’를 사용했습니다.
- source_word: οἱ φωστῆρες τοῦ Ἰσραήλ
  english_pob_choice: the lights of Israel
  chosen_korean: 이스라엘의 빛들이며
  alternatives_korean:
  - 이스라엘의 광명들이며
  - 이스라엘의 등불들이며
  lexicon: φωστήρ
  rationale: φωστῆρες는 단순한 광원이 아니라 빛을 비추는 존재들이므로, 자연스럽고 성경적 울림이 있는 ‘빛들’로 옮겼습니다.
- source_word: παρὰ πάντα τὰ ἔθνη
  english_pob_choice: beyond all the nations
  chosen_korean: 모든 민족보다 뛰어납니다
  alternatives_korean:
  - 모든 민족을 넘어 있습니다
  - 모든 민족들 곁에 있습니다
  lexicon: παρά + accusative of comparison
  rationale: 비교의 의미가 분명하므로, 한국어에서 의미를 명료하게 드러내는 비교 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘주님’의 존칭과 독자 호칭의 합쇼체 유지
  chosen_reading: 서술문은 합쇼체로, 하나님 호칭은 ‘주님’으로 유지했습니다.
  alternative_readings:
  - 주를
  - 주께
  rationale: 원문이 지시하는 경외의 관계를 현대 한국어의 공손한 문체로 안정적으로 전달하기 위해서입니다.
