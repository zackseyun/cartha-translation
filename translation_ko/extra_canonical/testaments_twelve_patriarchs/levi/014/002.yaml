base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/002.yaml
  text: For our father Israel is pure from the ungodliness of the chief priests [who will lay their hands on the Savior of the world].
translation:
  language: ko
  text: 그리고 우리 조상 이스라엘은 대제사장들의 불경건함으로부터 깨끗합니다[그들은 세상의 구원자 위에 자기들의 손을 얹을 것입니다].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρός
  english_pob_choice: pure
  chosen_korean: 깨끗합니다
  alternatives_korean:
  - 순수합니다
  - 정결합니다
  lexicon: καθαρός
  rationale: 도덕적·종교적 상태를 나타내는 ‘pure’를 한국어 합쇼체로 자연스럽게 풀어 ‘깨끗합니다’로 옮겼습니다.
- source_word: ἀσεβείας
  english_pob_choice: ungodliness
  chosen_korean: 불경건함
  alternatives_korean:
  - 경건하지 않음
  - 불의함
  lexicon: ἀσέβεια
  rationale: 하나님을 향한 경외와 예배의 결핍이라는 뉘앙스를 살려 ‘불경건함’으로 옮겼습니다.
- source_word: σωτῆρα τοῦ κόσμου
  english_pob_choice: Savior of the world
  chosen_korean: 세상의 구원자
  alternatives_korean:
  - 세상의 구주
  - 세상의 구세주
  lexicon: σωτήρ
  rationale: POB의 ‘Savior’를 따라 직역성이 높은 ‘구원자’를 택했고, 인물 호칭을 격식 있게 유지했습니다.
- source_word: οἵτινες ἐπιβαλοῦσι τὰς χεῖρας αὐτῶν ἐπὶ
  english_pob_choice: who will lay their hands on
  chosen_korean: '[그들이 … 자기들의 손을 얹을 사람들입니다]'
  alternatives_korean:
  - '[그들이 … 손을 얹을 것입니다]'
  - '[그들이 … 손을 대할 것입니다]'
  lexicon: ἐπιβάλλω τὰς χεῖρας
  rationale: 미래 동사와 관계절 구조를 한국어에서 자연스럽게 풀어, 괄호 안의 예고된 행위를 드러내되 소스의 문법적 긴장을 보존했습니다.
theological_decisions:
- issue: ‘우리 조상 이스라엘’의 표지와 집단 정체성
  chosen_reading: 이스라엘을 개인 이름이 아니라 ‘우리 조상’으로 유지해, 문맥상 족장 야곱/이스라엘을 가리키는 혈통적·언약적 표현으로 읽히게 했습니다.
  alternative_readings:
  - 우리 아버지 이스라엘
  - 우리 조상 야곱
  rationale: 헬라어 ὁ πατὴρ ἡμῶν Ἰσραὴλ은 본문이 의도하는 족장 표지를 전달하므로, 한국어에서도 친족-언약 언어를 보존했습니다.
  doctrine_reference: Patriarchal identity in the Testaments of the Twelve Patriarchs
