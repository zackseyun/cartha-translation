  source_fidelity: 대괄호 안의 관계절은 헬라어의 본문상 대괄호 표시를 보존하지만, 초안의 ‘…손을 얹을 사람들입니다’는 οἵτινες ἐπιβαλοῦσι의 단순 미래 관계절을 부자연스럽고 부정확하게 확장합니다. 또한 ἐπὶ τὸν σωτῆρα는 ‘구원자에게’보다 ‘구원자 위에’가 원문의 공간적 표현을 더 직접적으로 반영합니다.
  naturalness: ‘대제사장들의 불경건함에서 깨끗합니다’는 가능하나 다소 어색합니다. ‘…불경건함으로부터 깨끗합니다’가 합쇼체 문장으로 더 자연스럽습니다. ‘우리 조상 이스라엘’은 족장 이스라엘을 가리키는 표현으로 자연스럽게 유지할 수 있습니다.
  terminology: ἀσέβεια의 ‘불경건함’과 σωτῆρ의 ‘구원자’는 원문의 의미와 영어 POB의 선택에 부합합니다. ‘정결합니다’는 καθαρός의 종교·도덕적 뉘앙스를 살리지만, 이 문맥에서는 ‘깨끗합니다’도 충분히 적절합니다.
