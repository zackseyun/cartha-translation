    reason: 원전 편집본이 표시한 이 구절의 본문상 불확실성을 보존합니다.
  revision_rationale: 문장을 현대 합쇼체에 맞게 다듬고, ἐπὶ Κυρίου를 ‘주를 거슬러’로 자연스럽게 옮겼습니다. ἐν κακίᾳ는 ‘악한 마음으로’로 옮겼으며, 대괄호 안의 ἐπ᾿ αὐτόν은 번역에 유지하되 각주로 그 불확실성을 표시했습니다.
