id: T12P.LEV.14.1
reference: Testament of Levi 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐγὼ¹ οὖν, τέκνα μου², ἔγνων³ ὅτι ἐπὶ τὰ τέλη τῶν αἰώνων ἀσεβήσετε⁴ *ἐπὶ Κυρίου, χεῖρας ἐπιβάλλοντες⁵ ἐν⁶ κακίᾳ [ἐπ᾿ αὐτὸν]⁷ καὶ ἐν⁸ πᾶσι τοῖς ἔθνεσιν γενήσεσθε⁹ χλευασμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/001.yaml
  text: Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands in wickedness [upon him], and among all the nations you will become a mockery.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 나는 시대들의 끝에 너희가 주를 거슬러 불경하게 행하고, 악한 마음으로 그분께[a] 손을 대며, 모든 민족 가운데서 조롱거리가 될 것을 알았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 ‘그분께’에 해당하는 표현(ἐπ᾿ αὐτόν)이 대괄호 안에 제시되어 있습니다.
    reason: 원전 편집본이 표시한 이 구절의 본문상 불확실성을 보존합니다.
lexical_decisions:
- source_word: ἔγνων
  english_pob_choice: have known
  chosen_korean: 내가 알았습니다
  alternatives_korean:
  - 내가 알게 되었습니다
  - 나는 알았습니다
  lexicon: ἔγνων
  rationale: 완료적 뉘앙스를 살려 단순 현재보다 과거 인식의 확정을 드러내되, 현대 한국어에서는 자연스럽게 ‘알았습니다’로 옮겼습니다.
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  english_pob_choice: you will act ungodly against the Lord
  chosen_korean: 주께 대해 불경건하게 행하고
  alternatives_korean:
  - 주님을 향해 경건하지 않게 행하고
  - 주님께 불경하게 행하고
  lexicon: ἀσεβέω
  rationale: ἀσεβέω의 핵심은 단순 무례가 아니라 ‘불경건함’이므로, 대상 표지 ἐπὶ Κυρίου를 ‘주께 대해’로 살려 관계성을 유지했습니다.
- source_word: ἐν κακίᾳ [ἐπ᾿ αὐτὸν]
  english_pob_choice: laying hands in wickedness [upon him]
  chosen_korean: 악함 가운데 그분께 손을 대며
  alternatives_korean:
  - 악한 마음으로 그분께 손을 대며
  - 악함으로 그분에게 손을 대며
  lexicon: κακία / χείρ
  rationale: 문맥상 손을 대는 행위와 악함이 결합되어 있어 ‘악함 가운데’로 원인·방식을 드러냈고, 대괄호 안의 ‘upon him’은 본문 전승의 보완 정보로 자연스럽게 반영했습니다.
- source_word: χλευασμός
  english_pob_choice: mockery
  chosen_korean: 조롱거리
  alternatives_korean:
  - 조롱
  - 웃음거리가
  - 멸시의 대상
  lexicon: χλευασμός
  rationale: 명사형 ‘조롱’보다 결과 상태를 드러내는 ‘조롱거리’가 영어 POB의 직설적 의미와 잘 맞고, 민족들 가운데서의 수치를 분명히 합니다.
theological_decisions:
- issue: '''the Lord'' in a non-canonical testamentarian context'
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 야훼
  rationale: 본문은 고대 유대 문헌의 서술로, 여기서 Κυρίου는 직접적인 출처 표지 없이 일반적 주권 호칭으로 읽는 것이 가장 안전해 ‘주’로 유지했습니다.
  doctrine_reference: source-critical caution
