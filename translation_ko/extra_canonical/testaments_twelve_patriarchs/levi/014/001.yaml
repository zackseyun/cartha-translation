revisions:
- from: 그러므로 나, 내 자녀들아, 내가 알았습니다. 세상 끝에 이르러 너희가 주께 대해 불경건하게 행하고, 악함 가운데 그분께 손을 대며, 모든 민족들 가운데서 조롱거리가 될 것을 말입니다.[a]
  to: 그러므로 내 자녀들아, 나는 시대들의 끝에 너희가 주를 거슬러 불경하게 행하고, 악한 마음으로 그분께[a] 손을 대며, 모든 민족 가운데서 조롱거리가 될 것을 알았습니다.
  rationale: 문장을 현대 합쇼체에 맞게 다듬고, ἐπὶ Κυρίου를 ‘주를 거슬러’로 자연스럽게 옮겼습니다. ἐν κακίᾳ는 ‘악한 마음으로’로 옮겼으며, 대괄호 안의 ἐπ᾿ αὐτόν은 번역에 유지하되 각주로 그 불확실성을 표시했습니다.
