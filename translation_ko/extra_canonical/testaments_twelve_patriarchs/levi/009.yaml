  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009.yaml
  text: 'And after two days[a], I and Judah went up with our father Jacob to Isaac our grandfather. And the father of my father blessed me according to the visions that I had seen, and he was not willing to go with us to Bethel.


    And when we came to Bethel, my father Jacob saw a vision concerning me, that I would be a priest for them. And rising early in the morning, he gave a tenth of everything through me to the Lord.


    And so we came to Hebron to remain there. And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me. And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of firstfruits, of freewill offerings, and of peace offerings. And every day he kept instructing me in freewill offerings, and giving his attention to me he said:


    “Take heed to yourself from the spirit of sexual immorality[b], for this persists and is about to defile the holy things through your offspring. Therefore take for yourself a wife while you are still young, one having no blemish and not defiled, and not from the stock of foreign nations.


    And before you enter into the holy things, wash; and when you sacrifice in the presence of the Lord, wash your hands. And when you complete the sacrifice again, wash.


    And from twelve trees having leaves offer to the Lord, as Abraham taught me. And from every clean animal and bird offer a sacrifice to the Lord. And from all your first produce and wine offer firstfruits as a sacrifice to the Lord God[c][d]. And season every sacrifice with salt.”'
  footnotes:
  - marker: a
    text: The Greek phrase rendered 'this persists' is textually difficult in the OCR layer; the sense appears to be that the spirit of sexual immorality is continual or persistent.
    reason: textual_variant
    anchor_ref: '9:9'
  - marker: b
    text: The repeated command 'wash' likely refers specifically to ritual hand-washing in the sacrificial setting.
    reason: cultural_note
    anchor_ref: '9:11'
  - marker: d
    text: The instruction about 'twelve trees having leaves' is obscure; the translation stays close to the Greek without attempting to reconstruct the ritual beyond the wording given.
    reason: lexical_alternative
    anchor_ref: '9:12'
  - marker: c
    text: '''Peace offerings'' could also be understood more broadly as offerings associated with well-being or deliverance.'
    reason: lexical_alternative
    anchor_ref: '9:14'
translation:
  language: ko
  text: '이틀 후에 나와 유다가 우리 아버지 야곱과 함께 우리 조상 이삭에게 올라갔습니다. 그리고 내 아버지의 아버지가 내가 본 환상에 따라 나를 축복했으며, 우리와 함께 벧엘로 가려 하지 않았습니다.


    우리가 벧엘에 이르자, 내 아버지 야곱이 나에 관한 환상을 보았는데, 내가 그들을 위한 제사장이 될 것이라는 내용이었습니다. 그는 아침 일찍 일어나, 내 일을 통해 모든 것의 십분의 일을 주님께 드렸습니다.


    그렇게 우리는 거기에 머물기 위해 헤브론으로 갔습니다. 이삭은 주님의 율법을 내게 계속 일러 주려고 끊임없이 나를 불렀습니다. 천사가 내게 보여 준 것과 같이, 그는 내게 제사장직의 율법, 제사들, 온전히 불태우는 제사들, 첫 열매들, 자원제물들, 그리고 화목제물들의 율법을 가르쳤습니다. 그리고 그는 매일 나를 자원제물들에 대해 가르치며, 나에게 주의를 기울인 채 이렇게 말했습니다.


    “음행의 영을 조심하여 네 자신을 지키십시오. 이것은 계속해서 존재하며, 네 자손을 통해 거룩한 것들을 더럽힐 것입니다. 그러므로 네가 아직 젊을 때, 흠이 없고 더럽혀지지 않은 아내를 네게로 맞이하고, 이방 민족의 혈통에서 나온 여자는 취하지 마십시오.


    그리고 네가 거룩한 것들 안으로 들어가기 전에 씻으십시오. 또 주님 앞에서 제사할 때는 손을 씻으십시오. 그리고 제사를 마친 뒤에는 다시 씻으십시오.


    그리고 잎이 달린 열두 나무로부터 주님께 드리십시오. 아브라함이 내게 가르친 것과 같습니다. 또 모든 깨끗한 짐승과 새로 주님께 제사를 드리십시오. 그리고 네 모든 첫 소산과 포도주로 첫 열매를 하나님 주님께 제물로 드리십시오. 그리고 모든 제사에 소금을 치십시오.”[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβην ... πρὸς Ἰσαὰκ
  english_pob_choice: went up ... to Isaac
  chosen_korean: “올라갔습니다”
  alternatives_korean:
  - 갔습니다
  - 올라갔습니다
  lexicon: LSJ
  rationale: 산지·성소 관련 문맥에서 ἀναβαίνω의 이동 방향성을 살리기 위해 단순한 ‘갔다’보다 ‘올라갔다’를 유지했습니다.
- source_word: ἀπεδεκάτωσε πάντα
  english_pob_choice: he gave a tenth of everything
  chosen_korean: “모든 것의 십분의 일을 주님께 드렸습니다”
  alternatives_korean:
  - 모든 것에 십일조를 했습니다
  - 모든 것을 십일조로 드렸습니다
  lexicon: LSJ
  rationale: 동사의 ‘십분의 일을 주다’라는 뜻을 살리되, 한국어에서는 ‘십일조를 하다’보다 제의적 행위를 분명히 보여 주는 표현으로 옮겼습니다.
- source_word: ὁλοκαυτωμάτων / ἀπαρχῶν / ἑκουσίου / σωτηρίου
  english_pob_choice: whole burnt offerings / firstfruits / freewill offerings / peace offerings
  chosen_korean: “온전히 불태우는 제사들 / 첫 열매들 / 자원제물들 / 화목제물들”
  alternatives_korean:
  - 번제들 / 첫 열매 제물들 / 자원제물들 / 평화제물들
  lexicon: LSJ
  rationale: 제사 항목들의 목록성을 살리면서, ὁλοκαύτωμα의 완전 소각 의미는 ‘온전히 불태우는’으로, σωτηρίου는 제의적 범주에 맞춰 ‘화목제물’로 옮겼습니다.
- source_word: πρόσεχε σεαυτῷ ἀπὸ τοῦ πνεύματος τῆς πορνείας
  english_pob_choice: Take heed to yourself from the spirit of sexual immorality
  chosen_korean: “음행의 영을 조심하여 네 자신을 지키십시오”
  alternatives_korean:
  - 음행의 영에서 스스로를 주의하십시오
  - 음행의 영을 경계하십시오
  lexicon: LSJ
  rationale: πνεῦμα τῆς πορνείας를 단순한 행위가 아니라 인격화된 영향력으로 이해하여 ‘영’으로 살렸고, 경고문체는 인용문 안에서 직접 명령형으로 처리했습니다.
- source_word: τὰ ἅγια
  english_pob_choice: the holy things
  chosen_korean: “거룩한 것들”
  alternatives_korean:
  - 거룩한 것
  - 성물
  lexicon: LSJ
  rationale: 복수형을 유지해 성소의 물품·행위 전반을 포괄하는 뜻을 살렸습니다.
- source_word: βέβηλωμένην / ἀλλοφύλων ἐθνῶν
  english_pob_choice: defiled / foreign nations
  chosen_korean: “더럽혀지지 않은 … 이방 민족의 혈통에서 나온”
  alternatives_korean:
  - 부정해지지 않은 ... 이방 민족의
  - 속되지 않은 ... 이방 민족의
  lexicon: LSJ
  rationale: βέβηλος의 제의적 오염을 ‘더럽혀지다’로, ἀλλοφύλων ἐθνῶν은 혼인 금지의 경계선을 드러내는 ‘이방 민족의 혈통’으로 옮겼습니다.
theological_decisions:
- issue: 거룩한 것들을 더럽히는 대상의 범위
  chosen_reading: 성적 부정이 후손을 통해 거룩한 것들을 더럽힌다는 직접적 경고를 유지했습니다.
  alternative_readings:
  - 일반적인 도덕 경고로 완화하는 읽기
  - 후손과 거룩한 것들 사이의 연결을 약화하는 읽기
  rationale: 본문은 ‘네 자손을 통해’와 ‘거룩한 것들’을 함께 묶어 제의적-가계적 경고를 형성하므로, 이를 일반 윤리로 평탄화하지 않았습니다.
  doctrine_reference: 제의적 정결과 언약 공동체의 거룩성
- issue: “주님 하나님”의 결합
  chosen_reading: ‘θεῷ Κυρίῳ’를 ‘하나님 주님’으로 직역하지 않고 의미상 자연스러운 ‘주님께’ / ‘하나님 주님께’로 분산 처리했습니다.
  alternative_readings:
  - 주 하나님께
  - 주님 하나님께
  rationale: 그리스어의 격구조상 두 호칭이 결합된 강조 표현이지만, 한국어에서는 중복이 부자연스러워 문맥에 따라 하나님의 칭호를 자연스럽게 분리해 옮겼습니다.
  doctrine_reference: 주권자 하나님과 언약의 주로서의 호칭
