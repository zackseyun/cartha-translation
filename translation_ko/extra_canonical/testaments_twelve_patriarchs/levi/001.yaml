review_pass:
  verdict: revise
  source_fidelity: 현 초안은 표제의 Διαθήκη와 본문의 Ἀντίγραφον λόγων을 혼동하여 ‘레위가 … 레위의 언약문’이라는 중복·비문을 만들었고, ‘그가 그들에게 말했습니다’ 뒤의 대괄호 숫자들은 원문이나 제공된 주석에 근거하지 않는 구조적 잔재입니다. 또한 ‘자신이 죽게 될 것이 드러났습니다’는 ἀπεκαλύφθη αὐτῷ의 수여 대상과 계시적 뉘앙스를 충분히 드러내지 못합니다. 개정문은 표제와 본문 표제를 분리하고, 미래에 그들에게 닥칠 일을 가리키는 συναντήσει αὐτοῖς를 유지합니다.
  naturalness: ‘유언서’는 이 유언·훈계 장르의 표제로 자연스럽고, 본문은 현대 표준어 합쇼체로 매끄럽게 다듬었습니다. ‘정해 준 말’은 διέθετο의 유언적·규정적 힘을 과도한 교리적 의미 없이 반영합니다.
  terminology: Διαθήκη는 여기서 계약적 ‘언약문’보다 유언 문헌의 표제에 맞는 ‘유언서’로 옮겼습니다. Ἀντίγραφον은 ‘사본’, λόγοι는 ‘말’로 유지했습니다. ἡμέρα κρίσεως는 ‘심판의 날’로 보존했으며, ἀπεκαλύφθη는 ‘계시를 받았습니다’로 옮겨 수동형의 계시성을 살렸습니다.
  issues:
  - severity: high
    issue: 표제의 중복 및 Διαθήκη의 부정확한 처리
    rationale: ‘레위가 야곱과 레아의 셋째 아들인 레위의 언약문’은 문법적으로 중복되고, 표제 Διαθήκη와 이어지는 Ἀντίγραφον을 한 문장에 혼합합니다. 이 문헌 장르에서는 ‘유언서’가 안전한 표제 번역입니다.
  - severity: medium
    issue: ἀπεκαλύφθη αὐτῷ의 번역
    rationale: ‘자신이 죽게 될 것이 드러났습니다’는 ‘그에게’ 드러났다는 여격과 계시의 성격을 흐립니다. ‘그가 죽게 될 것이라는 계시를 받았습니다’가 더 충실합니다.
  - severity: high
    issue: 근거 없는 문장 말미 대괄호 번호
    rationale: '[1][2][3][4][5][6]은 제공된 원문·영문 주석·번역 주석 어디에도 대응하지 않아 삭제해야 합니다.'
  revised_text: '야곱과 레아의 셋째 아들 레위의 유언서.


    I. 레위가 자기 아들들에게 정해 준 말의 사본입니다. 그 말은 그들이 하게 될 모든 일과 심판의 날까지 그들에게 닥칠 일에 관한 것입니다.


    그는 건강한 상태였을 때 그들을 자기 곁으로 불러 모았습니다. 그러나 자신이 죽게 될 것이라는 계시를 받았습니다. 그들이 모이자, 그가 그들에게 말했습니다:'
  revised_footnotes:
  - marker: a
    text: 또는 ‘그들에게 일어날 일’. 그리스어 표현은 장차 그들을 ‘만나게 될’ 일을 문자적으로 암시합니다.
    reason: lexical_alternative
  revision_rationale: 표제(Διαθήκη)와 본문 문서 표제(Ἀντίγραφον λόγων)를 분리하여 원문의 구조를 회복했습니다. διέθετο의 유언적 처분·규정의 뜻은 ‘정해 준’으로, συναντήσει αὐτοῖς의 미래적 사건성은 ‘닥칠 일’로 옮겼습니다. 건강 상태, 죽음의 임박함, 계시, 아들들의 집결이라는 서술 순서도 원문에 맞추었습니다. 근거 없는 숫자 표지는 제거하고, 제공된 영문 감사 추적의 유일한 어휘 대안만 한국어 주석으로 유지했습니다.
