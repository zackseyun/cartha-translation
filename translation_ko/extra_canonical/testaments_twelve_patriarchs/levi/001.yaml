id: T12P.LEV.01
reference: Testament of Levi 1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (page 92, Levi source-fix v2)
  text: Διαθήκη Λευὶ τοῦ τρίτου υἱοῦ Ἰακὼβ καὶ Λίας¹. I. ᾿Αντίγραφον λόγων² Λευί³, ὅσα διέθετο⁴ τοῖς υἱοῖς αὐτοῦ⁵ κατὰ πάντα ἃ⁶ ποιήσουσιν⁷, καὶ ὅσα συναντήσει αὐτοῖς *ἕως ἡμέρας κρίσεως⁸. 2. Ὑγιαίνων⁹ γὰρ¹⁰ ἦν ὅτε ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν· *ἀπεκαλύφθη δὲ¹¹ αὐτῷ ὅτι μέλλει ἀποθνήσκειν¹². *Καὶ ὅτε¹³ συνήχθησαν¹⁴, *εἶπεν πρὸς αὐτούς¹⁵.
  language: Greek
  source_pages:
  - 92
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001.yaml
  text: 'A copy of the words of Levi, which he ordained for his sons concerning all that they would do, and what would happen to them[a] until the day of judgment.


    For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
  footnotes:
  - marker: a
    text: Or 'would befall them.' The Greek idiom literally suggests what would 'meet' them in the future.
    reason: lexical_alternative
translation:
  language: ko
  text: '레위가 야곱과 레아의 셋째 아들인 레위의 언약문입니다¹. I. 레위가 자기 아들들에게 남긴 말의 사본²으로, 그들이 하게 될 모든 일과 그들에게 닥칠 일들³, 곧 심판의 날까지의 일들을 모두 정해 두었습니다⁴.


    그는 그들을 자기에게 불러 모았을 때 건강한 상태였으나⁵, 자신이 죽게 될 것이 드러났습니다⁶. 그리고 그들이 모였을 때 그가 그들에게 말했습니다.[1][2][3][4][5][6]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: A copy of the words
  chosen_korean: 언약문
  alternatives_korean:
  - 사본
  - 유언
  - 증언문
  lexicon: LSJ
  rationale: 본문 첫머리의 제목형 문맥에서 Διαθήκη는 단순한 ‘계약’보다 문서 자체를 가리키는 표제로 읽히므로, 장르감을 살리되 현대 한국어에서 낯설지 않은 ‘언약문’으로 옮겼습니다.
- source_word: Ἀντίγραφον λόγων
  english_pob_choice: A copy of the words
  chosen_korean: 말의 사본
  alternatives_korean:
  - 말의 기록
  - 말의 전사
  - 말씀의 사본
  lexicon: LSJ
  rationale: Ἀντίγραφον은 문서적 ‘사본’의 뜻을 살리고, λόγων은 설교적 ‘말씀’보다 넓은 ‘말’로 두어 원문의 문서 제목 성격을 유지했습니다.
- source_word: διέθετο
  english_pob_choice: ordained
  chosen_korean: 정해 두었습니다
  alternatives_korean:
  - 정해 놓았습니다
  - 명령했습니다
  - 배분했습니다
  lexicon: LSJ
  rationale: 유언·훈계 문맥의 διέθετο는 단순한 언급이 아니라 자녀들에게 남긴 규정적 처분을 뜻하므로, 위계적이면서도 과장되지 않은 ‘정해 두었습니다’로 옮겼습니다.
- source_word: συναντήσει αὐτοῖς
  english_pob_choice: would happen to them
  chosen_korean: 그들에게 닥칠 일들
  alternatives_korean:
  - 그들을 맞이할 일들
  - 그들에게 일어날 일들
  lexicon: LSJ
  rationale: 이 관용구는 미래에 ‘맞닥뜨릴’ 일을 뜻하므로, 예언적 뉘앙스를 살려 ‘닥칠 일들’로 번역했습니다.
- source_word: Ὑγιαίνων
  english_pob_choice: in sound health
  chosen_korean: 건강한 상태였으나
  alternatives_korean:
  - 온전한 건강 상태였으나
  - 아직 건강했으나
  - 멀쩡했으나
  lexicon: LSJ
  rationale: 그가 이미 죽음 직전이 아니었음을 강조하는 분사이므로, 현재적 상태를 자연스럽게 드러내는 ‘건강한 상태였으나’로 옮겼습니다.
theological_decisions:
- issue: Judgment-day eschatology in ἕως ἡμέρας κρίσεως
  chosen_reading: ‘심판의 날까지’로 직역하되, 종말론적 표현을 완화하지 않았습니다.
  alternative_readings:
  - ‘심판 날까지’
  - ‘최후의 날까지’
  rationale: 본문은 장차 닥칠 최종 심판의 시점을 분명히 말하므로, 관용적으로 순화하지 않고 직접적인 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md § Translation philosophy: preserve theological tension rather than resolve it'
