translation:
  language: ko
  text: 1. 그러므로 나, 내 자녀들아, 나는 시대들의 끝에 너희가 주님을 거슬러 불경하게 행동하고, 악한 마음으로 그분께 손을 대며, 모든 민족 가운데서 조롱거리가 될 것을 알았습니다. 2. 우리 조상 이스라엘은 대제사장들의 불경으로부터 깨끗합니다.[a] [그들은 세상의 구원자에게 손을 댈 자들입니다.] 3. 해가 땅 위에서 주님 앞에 깨끗하듯이, 이스라엘의 빛들인 너희도 모든 민족보다 그러합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들은 세상의 구원자에게 손을 댈 자들입니다’라는 절은 제시된 그리스어 본문에서 대괄호로 표시되어 있습니다. 이는 전승 과정의 후기 확장일 가능성이 있으나, 제공된 그리스어에 있으므로 번역문에도 포함했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  english_pob_choice: have known
  chosen_korean: 내가 알게 된 것은
  alternatives_korean:
  - 나는 압니다
  - 내가 알았습니다
  lexicon: LSJ / BDAG
  rationale: 완료형의 뉘앙스를 살려 단순 현재보다 경험적·회고적 인식을 드러내는 표현으로 옮겼습니다.
- source_word: ἀσεβήσετε / ἀσεβείας
  english_pob_choice: act ungodly / ungodliness
  chosen_korean: 불경하게 행동하며 / 불경
  alternatives_korean:
  - 경건하지 않게 행동하며 / 경건하지 않음
  - 불의하게 행동하며 / 불의
  lexicon: LSJ
  rationale: 같은 어근의 반복을 한국어에서도 일관되게 살리면서, 종교적·윤리적 불경의 강도를 유지했습니다.
- source_word: χεῖρας ἐπιβάλλοντες
  english_pob_choice: laying hands on him
  chosen_korean: 손을 대고
  alternatives_korean:
  - 손을 얹고
  - 붙잡고
  lexicon: BDAG
  rationale: 폭력적·적대적 행위를 가리키는 관용 표현으로서, 문맥의 공격성을 유지하되 과도하게 구체화하지 않았습니다.
- source_word: χλευασμός
  english_pob_choice: an object of mockery / a mockery
  chosen_korean: 조롱거리
  alternatives_korean:
  - 웃음거리가 될 것
  - 비웃음거리가 될 것
  lexicon: LSJ
  rationale: 민족들 가운데서 공적으로 조롱받는 상태를 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: σωτῆρα τοῦ κόσμου
  english_pob_choice: savior of the world
  chosen_korean: 세상의 구원자
  alternatives_korean:
  - 온 세상의 구원자
  - 세상의 구주
  lexicon: BDAG
  rationale: 직역에 가깝게 유지하되, 한국어 합쇼체 문맥에서 가장 직접적으로 의미가 드러나는 표현을 선택했습니다.
theological_decisions:
- issue: 2절의 대괄호 친 절(‘who will lay their hands on the savior of the world’)
  chosen_reading: 본문에 포함하되, 대괄호로 전승상 불확실성을 표시했습니다.
  alternative_readings:
  - 보조 본문으로만 처리해 본문에서 제외
  - 주석 없이 평문으로 통합
  rationale: 제시된 그리스어 증거에 존재하는 문장을 임의로 삭제하지 않되, 후기 확장 가능성은 형식으로 투명하게 드러내는 것이 이 번역의 원칙에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 전승 증거를 있는 그대로 옮기고, 불확실성은 주석/표기로 드러냄'
- issue: 1절의 ‘주님’과 이어지는 ‘그분께 손을 대고’의 지시 대상
  chosen_reading: 그리스어의 직접성을 살려, 반역적 행위의 대상이 되는 주님을 따로 해명하지 않았습니다.
  alternative_readings:
  - 권위에 대한 반역으로 완화하여 해석
  - 후반의 ‘세상의 구원자’와 동일시하여 명시
  rationale: 본문은 예언적 고발의 급작스러운 힘을 지니므로, 지시 대상을 과잉 설명하지 않고 그대로 유지하는 편이 소스 충실성에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: 텍스트가 말하는 긴장을 해소하지 말 것'
