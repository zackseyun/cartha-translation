base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017.yaml
  text: 'And since you have heard about the seventy weeks[1], hear also about the priesthood. For in each jubilee there will be a priesthood. In the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be complete with the Lord. [And in the days of his joy he will arise for the salvation of the world.]


    In the second jubilee, the one anointed will be conceived in the sorrow of a beloved one, and his priesthood will be honored, and he will be glorified by all.


    But the third priest will be taken in grief. And the fourth will be in pains, because unrighteousness will increase upon him in abundance, and all Israel will hate, each one, his neighbor. The fifth will be taken in darkness. Likewise also the sixth and the seventh.


    But in the seventh there will be a defilement which I cannot speak of before men, for those who do these things will know them. Therefore they will be in captivity and in plundering, and their land and their possessions will be destroyed.


    And in the fifth week they will return to the land of their desolation[4][3][2], and they will renew the house of the Lord.'
  footnotes:
  - marker: '1'
    text: The clause 'And in the days of his joy he will rise for the salvation of the world' is textually uncertain in the witness used here and may reflect a later expansion; it is therefore retained in brackets.
    reason: textual_variant
  - marker: '2'
    text: '''Seventy weeks'' echoes apocalyptic chronological language known from Daniel; the text assumes the audience has already heard that earlier explanation.'
    reason: cross_reference
  - marker: '3'
    text: '''Defilement'' can carry both cultic and moral force here, especially in a passage about the corruption of the priesthood.'
    reason: lexical_alternative
  - marker: '4'
    text: '''They will renew the house of the Lord'' may imply restoration or rebuilding of the temple after devastation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 'XVII. 여러분이 일흔 이레에 대해 들으셨으니, 이제 제사직에 대해서도 들으십시오. 각 희년마다 제사직이 있을 것입니다. 첫째 희년에는 제사직을 위해 가장 먼저 기름부음을 받은 이가 위대할 것이며, 하나님께 아버지에게 하듯 말할 것이고, 그의 제사직은 주님과 더불어 완전할 것입니다. [그리고 그의 기쁨의 날들에 그는 세상의 구원을 위해 일어날 것입니다.]


    둘째 희년에는 사랑하는 이의 슬픔 가운데 기름부음을 받은 이가 잉태될 것이며, 그의 제사직은 존귀하게 여김을 받고, 모든 사람에게서 영광을 받을 것입니다.


    셋째 제사는 슬픔 가운데서 붙들릴 것입니다. 넷째는 고통 가운데 있을 것입니다. 불의가 그에게 풍성하게 더해질 것이기 때문이며, 온 이스라엘이 각각 자기 이웃을 미워할 것입니다. 다섯째는 어둠 가운데서 붙들릴 것입니다. 여섯째와 일곱째도 마찬가지입니다.


    그런데 일곱째에는 내가 사람들 앞에서 말할 수 없는 더러움이 있을 것입니다. 그것을 행하는 자들이 그것들을 알 것이기 때문입니다. 그러므로 그들은 포로가 되고 약탈을 당할 것이며, 그들의 땅과 소유는 멸망할 것입니다.


    그리고 다섯째 주에는 그들이 자기 황폐의 땅으로 돌아와 주님의 집을 새롭게 할 것입니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  english_pob_choice: seventy weeks
  chosen_korean: 일흔 이레
  alternatives_korean:
  - 일흔 주
  lexicon: LSJ
  rationale: 다니엘적 종말론 연대 표현을 살리기 위해 ‘이레’를 택했고, 본문의 예언적 시간 구조를 유지했습니다.
- source_word: ἱερωσύνη
  english_pob_choice: priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장직
  - 제사장 제도
  lexicon: LSJ
  rationale: 본문은 직분과 기능을 아우르는 말이므로, 다소 제도적 뉘앙스가 있는 ‘제사직’이 가장 자연스럽습니다.
- source_word: ὁ χριόμενος πρῶτος εἰς ἱερωσύνην
  english_pob_choice: the one first anointed for the priesthood
  chosen_korean: 제사직을 위해 가장 먼저 기름부음을 받은 이
  alternatives_korean:
  - 제사직을 위해 처음 기름부음을 받은 이
  - 제사장직에 먼저 기름부음 받은 이
  lexicon: LSJ
  rationale: ‘πρῶτος’를 단순히 앞에 두지 않고 ‘가장 먼저’로 옮겨, 기름부음의 우선성을 분명히 했습니다.
- source_word: λαλήσει Θεῷ ὡς πατρί
  english_pob_choice: he will speak to God as to a father
  chosen_korean: 하나님께 아버지에게 하듯 말할 것이고
  alternatives_korean:
  - 하나님께 아버지와 같이 말할 것이고
  - 하나님께 아버지처럼 말할 것이고
  lexicon: LSJ
  rationale: 비교구문 ‘ὡς πατρί’를 살려, 하나님과의 친자 관계에 가까운 경외 섞인 화법을 드러냈습니다.
- source_word: πλήρης μετὰ κυρίου
  english_pob_choice: complete with the Lord
  chosen_korean: 주님과 더불어 완전할 것입니다
  alternatives_korean:
  - 주님과 함께 충만할 것입니다
  - 주님 안에서 완전할 것입니다
  lexicon: LSJ
  rationale: 압축된 표현을 한국어로 자연스럽게 풀되, ‘완전’과 ‘더불어’로 완성/동행의 뉘앙스를 함께 보존했습니다.
- source_word: ἱερεὺς
  english_pob_choice: priest
  chosen_korean: 제사
  alternatives_korean:
  - 제사장
  - 제사직을 맡은 자
  lexicon: LSJ
  rationale: 문맥상 다음 계승 항목들을 축약적으로 가리키는 용법이어서, 반복되는 제목을 짧게 ‘제사’로 옮겼습니다.
- source_word: ἡ ἀδικία
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불법
  - 악의
  lexicon: LSJ
  rationale: 윤리적·종교적 반대 개념을 고르게 담는 표준어로 ‘불의’가 가장 적절합니다.
- source_word: μιασμός
  english_pob_choice: defilement
  chosen_korean: 더러움
  alternatives_korean:
  - 오염
  - 부정
  lexicon: LSJ
  rationale: 제사장 문맥의 의례적·도덕적 오염을 함께 드러내기 위해, 노골적이지만 중립적인 ‘더러움’을 선택했습니다.
- source_word: ἀνακαινοποιήσουσιν οἶκον κυρίου
  english_pob_choice: they will renew the house of the Lord
  chosen_korean: 주님의 집을 새롭게 할 것입니다
  alternatives_korean:
  - 주님의 집을 새로 지을 것입니다
  - 주님의 집을 회복할 것입니다
  lexicon: LSJ
  rationale: ‘새롭게 하다’가 원형의 ‘다시 새로 만들다’라는 뜻을 가장 직접적으로 살리며, 재건과 갱신을 과도하게 특정하지 않습니다.
theological_decisions:
- issue: 브래킷으로 표시된 첫째 희년의 추가 문구 처리
  chosen_reading: 본문에 포함하되 대괄호를 유지해 본문 전승의 불확실성을 드러냈습니다.
  alternative_readings:
  - 생략한다
  - 대괄호 없이 정본문으로 평탄화한다
  rationale: 영어 POB가 본문 비평상 불확실성을 반영해 괄호 처리한 만큼, 한국어도 동일하게 가시화하여 전승 긴장을 지웠다고 보이지 않게 했습니다.
  doctrine_reference: 텍스트 비평적 투명성 유지
- issue: ‘하나님께 아버지에게 하듯 말할 것이고’의 관계성
  chosen_reading: 친밀성을 살리되, 예배적 경외를 잃지 않는 표현으로 옮겼습니다.
  alternative_readings:
  - 하나님과 아버지처럼 말할 것입니다
  - 하나님을 아버지라 부를 것입니다
  rationale: 본문은 아버지-자녀적 비유를 사용하지만, 직접 호칭으로 바꾸면 비교의 강도가 약해질 수 있어 그 구조를 유지했습니다.
  doctrine_reference: 비유적 친자 관계 표현 보존
