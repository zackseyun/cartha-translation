  text: XVII. *Καὶ ὅτι ἠκούσατε¹ περὶ τῶν ἑβδομήκοντα² ἑβδομάδων³, ἀκούσατε καὶ⁴ περὶ τῆς ἱερωσύνης⁵. 2. Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷. 3. Ἐν¹⁸ τῷ δευτέρῳ ἰωβηλαίῳ ὁ¹⁹ χριόμενος ἐν πένθει ἀγαπητοῦ²⁰ συλληφθήσεται²¹ *καὶ ἔσται²² ἡ ἱερωσύνη αὐτοῦ τιμία²³, καὶ παρὰ πάντων²⁴ δοξασθήσεται. 4. Ὁ δὲ τρίτος ἱερεὺς²⁵ λύπῃ παραληφθήσεται²⁶. 5. Καὶ²⁷ ὁ τέταρτος ἐν ὀδύναις²⁸ ἔσται· ὅτι²⁹ προσθήσει³⁰ *ἐπ’ αὐτῷ³¹ *ἡ ἀδικία³² *εἰς πλῆθος³³, καὶ πᾶς Ἰσραὴλ μισήσουσιν³⁴ ἕκαστος³⁵ τὸν³⁶ πλησίον αὐτοῦ. 6. Ὁ πέμπτος ἐν σκότει³⁷ παραληφθήσεται³⁸. 7. Ὡσαύτως³⁹ καὶ ὁ ἕκτος καὶ ὁ ἕβδομος⁴⁰. 8. *Ἐν δὲ τῷ ἑβδόμῳ²⁷ ἔσται μιασμός⁴¹, ὃν οὐ δύναμαι⁴² εἰπεῖν ἐνώπιον⁴³ ἀνθρώπων· ὅτι αὐτοὶ γνώσονται οἱ ποιοῦντες αὐτά. 9. Διὰ τοῦτο ἐν αἰχμαλωσίᾳ καὶ ἐν προνομῇ ἔσονται· καὶ ἡ γῆ αὐτῶν⁴⁴
    καὶ *ἡ ὕπαρξις⁴⁵ ἀφανισθήσεται⁴⁶. 10. *Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.
