- from: 'XVII. 여러분이 일흔 이레에 대해 들으셨으니, 이제 제사직에 대해서도 들으십시오. 각 희년마다 제사직이 있을 것입니다. 첫째 희년에는 제사직을 위해 가장 먼저 기름부음을 받은 이가 위대할 것이며, 하나님께 아버지에게 하듯 말할 것이고, 그의 제사직은 주님과 더불어 완전할 것입니다. [그리고 그의 기쁨의 날들에 그는 세상의 구원을 위해 일어날 것입니다.]


