  revised_text: 'XVII. 여러분이 일흔 이레에 대하여 들으셨으니,[a] 이제 제사직에 대해서도 들으십시오. 각 희년마다 제사직이 있게 될 것입니다. 첫째 희년에는 제사직을 위해 가장 먼저 기름부음을 받은 이가 위대할 것이며, 하나님께 아버지에게 하듯 말씀드릴 것이고, 그의 제사직은 주님과 더불어 온전할 것입니다. [그리고 그의 기쁨의 날들에 그는 세상의 구원을 위하여 일어날 것입니다.][b]


    둘째 희년에는 사랑하는 이의 슬픔 가운데 기름부음을 받은 이가 잉태될 것이며, 그의 제사직은 존귀하게 여김을 받고 모든 이에게 영광을 받을 것입니다.


    셋째 제사장은 슬픔 가운데 붙들릴 것입니다. 넷째 제사장은 고통 가운데 있을 것입니다. 불의가 그에게 풍성하게 더해질 것이기 때문이며, 온 이스라엘이 각자 자기 이웃을 미워할 것입니다. 다섯째 제사장은 어둠 가운데 붙들릴 것입니다. 여섯째와 일곱째도 마찬가지일 것입니다.


    그런데 일곱째에는 내가 사람들 앞에서 말할 수 없는 부정이 있을 것입니다.[c] 그러한 일들을 행하는 이들이 스스로 알 것이기 때문입니다. 그러므로 그들은 포로가 되고 약탈을 당할 것이며, 그들의 땅과 소유는 멸망할 것입니다.


