    셋째 제사는 슬픔 가운데서 붙들릴 것입니다. 넷째는 고통 가운데 있을 것입니다. 불의가 그에게 풍성하게 더해질 것이기 때문이며, 온 이스라엘이 각각 자기 이웃을 미워할 것입니다. 다섯째는 어둠 가운데서 붙들릴 것입니다. 여섯째와 일곱째도 마찬가지입니다.


