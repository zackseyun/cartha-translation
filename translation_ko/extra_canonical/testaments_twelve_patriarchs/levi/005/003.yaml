id: T12P.LEV.5.3
reference: Testament of Levi 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Τότε¹³ ὁ ἄγγελος¹⁴ κατήγαγέν¹⁵ με ἐπὶ τὴν γῆν, καὶ ἔδωκέ¹⁶ μοι *ὅπλον καὶ ῥομφαίαν¹⁷, καὶ εἰπέ μοι¹⁸· Ποίησον ἐκδίκησιν ἐν Συχὲμ¹⁹ ὑπὲρ Δείνας²⁰ *τῆς ἀδελφῆς σου²¹, κἀγὼ²² ἔσομαι μετά σου²³, ὅτι Κύριος *ἀπέστειλέν †με²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/003.yaml
  text: Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Execute vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”
translation:
  language: ko
  text: 그때 그 천사가 나를 땅으로 데리고 내려가 무기와 칼을 내게 주고, 내게 말했습니다. “세겜에서 네 누이 디나를 위해 복수하십시오. 그리고 내가 너와 함께 있겠습니다. 주님께서 나를 보내셨기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπλον
  english_pob_choice: weapon
  chosen_korean: 무기
  alternatives_korean:
  - 갑옷
  - 방패
  - 무장
  lexicon: ὅπλον
  rationale: 영어 POB의 최신 수정대로 ὅπλον은 ‘방패’가 아니라 더 넓은 뜻의 ‘무기’로 옮기는 것이 원문 의미에 맞습니다.
- source_word: ῥομφαίαν
  english_pob_choice: a sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 칼날
  lexicon: ῥομφαία
  rationale: ῥομφαία는 큰 칼/장검 계열의 무기를 가리키지만, 한국어에서는 서술의 자연성과 전달력을 위해 ‘칼’로 옮겼습니다.
- source_word: Ποίησον ἐκδίκησιν
  english_pob_choice: Execute vengeance
  chosen_korean: 복수하라
  alternatives_korean:
  - 원수를 갚으라
  - 보복하라
  - 복수를 실행하라
  lexicon: ἐκδίκησις
  rationale: 명령형의 직접성과 형식성을 살리되, 한국어에서 가장 자연스럽게 원문의 응징 행위를 드러내는 표현으로 ‘복수하라’를 택했습니다.
- source_word: Δείνας τῆς ἀδελφῆς σου
  english_pob_choice: for Dinah your sister
  chosen_korean: 네 누이 디나를 위해
  alternatives_korean:
  - 네 자매 디나를 위해
  - 네 누이인 디나를 위해
  lexicon: ἀδελφή
  rationale: ἀδελφή는 친족 관계를 분명히 하는 ‘누이’가 적절하며, 호칭 구조를 한국어 어순에 맞게 정리했습니다.
theological_decisions:
- issue: 주님의 사자로부터 받은 명령과 하나님의 파송 진술의 연결
  chosen_reading: ‘주님께서 나를 보내셨기 때문이다’로 직역해, 천사의 말이 주님의 파송 권위 아래 있음을 드러냈습니다.
  alternative_readings:
  - ‘주께서 나를 보내셨기 때문이다’
  - ‘주님이 나를 보내셨다’
  rationale: 원문의 Κύριος를 본문 관례에 따라 ‘주님’으로 옮기되, 천사가 자신의 권위를 말하는 것이 아니라 파송받은 존재임을 분명히 했습니다.
  doctrine_reference: 천사의 대리적 파송과 하나님의 주권
