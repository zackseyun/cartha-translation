  rationale: 원문 접속사 κἀγώ가 나타내는 단순 병렬을 ‘그리고’로 회복하여 조건적 뉘앙스를 제거했습니다. 또한 인용문을 현대 합쇼체로 통일했습니다. 그 밖의 어휘 선택과 고유명사는 유지했습니다.
