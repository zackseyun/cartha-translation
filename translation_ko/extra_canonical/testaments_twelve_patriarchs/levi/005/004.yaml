  text: And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.
translation:
  language: ko
  text: 그때에 나는 에므론의 아들들을 멸하였는데, 그것은 아버지들의 돌판들에 기록된 것과 같습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ συνετέλεσα τῷ καιρῷ ἐκείνῳ
  english_pob_choice: And in that time I destroyed
  chosen_korean: 그때에 나는 … 멸하였는데
  alternatives_korean:
  - 그때에 나는 … 끝내었는데
  - 그때에 나는 … 다 이루었는데
  lexicon: συντελέω
  rationale: 동사는 ‘끝마치다/완수하다’의 넓은 뜻이 있으나, 여기서는 목적어를 직접 취해 파괴·멸망의 결과를 드러내므로 문맥상 ‘멸하다’가 가장 자연스럽습니다.
- source_word: τοὺς υἱοὺς Ἐμμώρ
  english_pob_choice: the sons of Hamor
  chosen_korean: 에므론의 아들들
  alternatives_korean:
  - 하몰의 아들들
  - 에모르의 아들들
  lexicon: υἱοὺς + Ἐμμώρ
  rationale: 고유명사 Ἐμμώρ는 본문 음가를 반영해 ‘에므론’으로 옮겼고, υἱούς는 문자 그대로 ‘아들들’로 유지했습니다.
- source_word: ἐν πλαξὶ τῶν πατέρων
  english_pob_choice: on the tablets of the fathers
  chosen_korean: 아버지들의 돌판들에
  alternatives_korean:
  - 조상들의 돌판들에
  - 아버지들의 판들에
  lexicon: πλαξὶ τῶν πατέρων
  rationale: πλαξί는 단순한 ‘판’보다 돌판·돌판들로 이해되는 경우가 많아, 물질감을 살리되 영어의 ‘tablets’를 직접 반영해 ‘돌판들’로 옮겼습니다.
theological_decisions:
- issue: ‘heavenly’의 처리
  chosen_reading: 본문에 없는 ‘하늘의/천상의’는 넣지 않고, 단순히 ‘아버지들의 돌판들’로 옮겼습니다.
  alternative_readings:
  - 하늘의 아버지들의 돌판들
  - 천상의 돌판들
  rationale: 영어 POB 수정 이력에서도 ‘heavenly’가 그리스어에 없다고 확인되므로, 한국어에서도 이를 추가하지 않았습니다.
  doctrine_reference: source fidelity / textual control
