  text: Καὶ εἰπέ μοι⁵· Λευί, σοὶ⁶ ἔδωκα⁷ *τὰς εὐλογίας τῆς ἱερατείας⁸ ἕως⁹ ἐλθὼν¹⁰ κατοικήσω¹¹ *ἐν μέσῳ¹² τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/002.yaml
  text: And he said to me, “Levi, to you I have given the blessings of the priesthood until I come and dwell in the midst of Israel.”
translation:
  language: ko
  text: 그리고 그가 내게 말했습니다. “레위야, 내가 와서 이스라엘 가운데에 거할 때까지, 나는 너에게 제사장직의 복을 주었다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λευί
  english_pob_choice: Levi
  chosen_korean: 레위야
  alternatives_korean:
  - 레위
  lexicon: 고유명사
  rationale: 호칭형 직접 발화에서 원문 대명·호격 관계를 살리기 위해 ‘레위야’로 옮겼습니다. 본문 내부의 부름말임을 드러내되, 통상 인명 ‘레위’도 함께 고려할 수 있습니다.
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  english_pob_choice: the blessings of the priesthood
  chosen_korean: 제사장직의 복
  alternatives_korean:
  - 제사장직의 축복
  - 제사직의 복
  lexicon: εὐλογίαι / ἱερατεία
  rationale: 복수형 ‘εὐλογίας’는 한국어에서 집합적 단수로 자연스럽게 처리하되, ‘ἱερατεία’는 직분/신분의 의미를 살려 ‘제사장직’으로 옮겼습니다.
- source_word: ἕως ἐλθὼν κατοικήσω
  english_pob_choice: until I come and dwell
  chosen_korean: 내가 와서 … 거할 때까지이다
  alternatives_korean:
  - 내가 와서 … 살 때까지이다
  - 내가 오고 … 거주할 때까지이다
  lexicon: ἕως + aorist participle + future
  rationale: ‘ἕως’가 종결 시점을 표시하므로 ‘~할 때까지’로 옮기고, ‘κατοικήσω’는 성경적 상주/거처의 뉘앙스를 살려 ‘거하다’로 번역했습니다.
- source_word: ἐν μέσῳ τοῦ Ἰσραήλ
  english_pob_choice: in the midst of Israel
  chosen_korean: 이스라엘 한가운데에
  alternatives_korean:
  - 이스라엘 가운데에
  - 이스라엘의 한복판에
  lexicon: ἐν μέσῳ
  rationale: 공간적 중심성을 살리면서 현대 한국어에서 자연스러운 ‘한가운데’로 옮겼습니다.
theological_decisions:
- issue: 제사장직의 복과 임재의 종결 시점
  chosen_reading: 제사장직의 복은 ‘내가 와서 이스라엘 한가운데에 거할 때까지’라는 종결 조건 아래 주어집니다.
  alternative_readings:
  - 미래의 임재를 조건으로 한 약속
  - 단순한 시간 한계 진술
  rationale: 원문 구조가 ‘until’로 경계를 분명히 하므로, 축복이 미래의 임재와 연결된 조건부-종결적 진술임을 보존했습니다.
  doctrine_reference: 문맥상 축복-임재 연계
