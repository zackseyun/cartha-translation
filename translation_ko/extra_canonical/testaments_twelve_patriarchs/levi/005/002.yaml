revisions:
- from: 그리고 그가 나에게 말씀하셨습니다. “레위야, 내가 너에게 제사장직의 복을 주었으니, 내가 와서 이스라엘 한가운데에 거할 때까지이다.”[a]
  to: 그리고 그가 내게 말했습니다. “레위야, 내가 와서 이스라엘 가운데에 거할 때까지, 나는 너에게 제사장직의 복을 주었다.”
  rationale: 시간 한계를 나타내는 ἕως절을 수여 동사와 직접 연결하고, 원문에 없는 인과 관계 및 불필요한 높임 뉘앙스를 제거했습니다. ‘복’의 집합적 단수 처리와 ‘제사장직’은 유지했으며, 내용 없는 각주 표지도 삭제했습니다.
