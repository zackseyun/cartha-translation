review_pass:
  verdict: revise
  source_fidelity: 원문의 기본 구조(그가 말함, 레위에 대한 호칭, 제사장직의 복, 미래의 도래와 이스라엘 가운데 거함을 표시하는 ἕως절)는 충실히 반영되었습니다. 그러나 ἔδωκα를 ‘주었으니’로 옮기면 원문에 없는 인과 관계가 생기며, 뒤의 ‘때까지이다’와 결합하여 한국어 문장 구조도 부자연스럽습니다.
  naturalness: ‘내가 너에게 … 주었으니, … 때까지이다’는 현대 표준 한국어에서 어색하고 의미 연결이 불명확합니다. 시간절을 앞에 두어 ‘… 때까지 … 주었다’로 구성하면 원문의 시간적 한계를 자연스럽게 보존합니다. 원문은 단순히 ‘말했다’이므로, 화자의 신분을 본절만으로 확정하여 높임말 ‘말씀하셨습니다’를 쓰지 않는 편이 중립적입니다.
  terminology: ‘레위야’, ‘제사장직’, ‘복’, ‘이스라엘 가운데’는 적절합니다. εὐλογίας의 복수는 한국어 집합 명사 ‘복’으로 처리할 수 있습니다. 본문에 근거 없는 [a] 표지는 제거합니다.
  issues:
  - severity: medium
    issue: ‘주었으니’가 ἔδωκα에 인과적 뉘앙스를 추가합니다.
    rationale: -으니는 앞 절을 뒤 절의 이유·근거로 제시하지만, 그리스어는 ‘주었다’ 뒤에 ἕως 시간 한계만을 둡니다.
  - severity: medium
    issue: ‘… 거할 때까지이다’는 앞선 과거 동사와의 연결이 비문에 가깝고 시간 관계가 불명확합니다.
    rationale: ἕως ἐλθὼν κατοικήσω는 수여 진술의 시간적 한계를 이루므로, 한국어에서도 ‘… 때까지 … 주었다’로 연결해야 합니다.
  - severity: low
    issue: '[a] 각주 표지에 대응하는 각주가 없습니다.'
    rationale: 독자가 참조할 내용이 없는 표지는 삭제하는 것이 본문 구조상 적절합니다.
  - severity: low
    issue: ‘말씀하셨습니다’는 원문이 명시하지 않은 화자에 대한 높임을 암시할 수 있습니다.
    rationale: 그리스어 εἶπε는 중립적인 ‘말했다’이며, 본절만으로 높임의 근거를 추가하지 않는 편이 번역 중립성에 맞습니다.
  revised_text: 그리고 그가 내게 말했습니다. “레위야, 내가 와서 이스라엘 가운데에 거할 때까지, 나는 너에게 제사장직의 복을 주었다.”
