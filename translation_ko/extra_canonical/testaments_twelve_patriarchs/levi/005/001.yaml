source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ †ἐν τούτῳ¹ ἤνοιξέ μοι² *ὁ ἄγγελος³ τὰς πύλας τοῦ οὐρανοῦ· καὶ εἶδον τὸν *ἅγιον ὕψιστον ἐπὶ θρόνου καθήμενον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/001.yaml
  text: And in this, the angel opened to me the gates of heaven, and I saw the Holy Most High seated on a throne.
translation:
  language: ko
  text: 그리고 이 일로 말미암아 천사가 내게 하늘의 문들을 열어 주었고, 나는 거룩하신 지극히 높으신 분이 보좌에 앉아 계신 것을 보았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  english_pob_choice: And in this
  chosen_korean: 그리고 이 일로 말미암아
  alternatives_korean:
  - 이 일에서
  - 이 일 안에서
  - 이것으로 인해
  lexicon: ἐν + τούτῳ
  rationale: 문맥상 단순한 장소보다 ‘이 일로 말미암아/이 일로 인해’의 원인·계기 의미가 자연스럽고, 영어 POB의 연결어 ‘And in this’가 가리키는 사건적 연결을 살렸습니다.
- source_word: ἤνοιξέ μοι ὁ ἄγγελος τὰς πύλας τοῦ οὐρανοῦ
  english_pob_choice: the angel opened to me the gates of heaven
  chosen_korean: 천사가 내게 하늘의 문들을 열어 주었고
  alternatives_korean:
  - 천사가 내게 하늘의 문들을 열었고
  - 천사가 내게 하늘의 문들을 열어 보였고
  lexicon: ἀνοίγω / πύλας τοῦ οὐρανοῦ
  rationale: ‘열어 주었다’는 1인칭 수혜를 드러내며, 문이 복수형 ‘문들’인 점을 반영했습니다. ‘열어 보였다’는 시각적 뉘앙스를 더하지만 원문의 개방 행위를 약화시켜 제외했습니다.
- source_word: τὸν ἅγιον ὕψιστον
  english_pob_choice: the Holy Most High
  chosen_korean: 거룩하신 지극히 높으신 분
  alternatives_korean:
  - 거룩하신 가장 높으신 분
  - 거룩하신 지존자
  - 거룩하신 지극히 높으신 이
  lexicon: ἅγιος + ὕψιστος
  rationale: 두 형용사의 중첩을 살리되, 한국어에서 자연스러운 신격 호칭인 ‘분’을 써서 문체를 유지했습니다. ‘지존자’는 전통적이지만 현대 문장에서는 다소 경직되어 제외했습니다.
- source_word: ἐπὶ θρόνου καθήμενον
  english_pob_choice: seated on a throne
  chosen_korean: 보좌에 앉아 계신 것을
  alternatives_korean:
  - 보좌에 앉으신 것을
  - 보좌에 좌정하신 것을
  lexicon: κάθημαι
  rationale: 현재 진행적 상태를 반영해 ‘앉아 계신’으로 옮겼고, ‘좌정하신’은 위엄은 살지만 현대 합쇼체에서는 다소 고어적이어서 기본문에서 제외했습니다.
theological_decisions:
- issue: ‘ἅγιον ὕψιστον’의 신적 호칭 번역
  chosen_reading: ‘거룩하신 지극히 높으신 분’으로 직역하여, 고유명사화하지 않고 호칭의 중첩된 신적 위엄을 유지했습니다.
  alternative_readings:
  - ‘거룩하신 지극히 높으신 이’
  - ‘지극히 높으신 거룩한 분’
  rationale: 이 표현은 하나님을 가리키는 경배적 칭호로 읽히며, 한국어에서도 서술적 호칭을 유지하는 편이 원문의 숭엄함과 직접성을 잘 보존합니다.
  doctrine_reference: 서신/예언 문헌의 신적 호칭 번역 원칙
