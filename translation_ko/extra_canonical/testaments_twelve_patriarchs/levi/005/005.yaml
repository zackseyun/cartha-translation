  text: And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in the day of affliction.”
translation:
  language: ko
  text: 그리고 나는 그에게 말했습니다. “주님, 제가 환난의 날에 주님을 부를 수 있도록 주님의 이름을 제게 가르쳐 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: κύριος
  rationale: 직접 호칭이므로 한국어 기도체에 자연스러운 ‘주님’을 택해, 공손함과 친밀함을 함께 살렸습니다.
- source_word: δίδαξόν με τὸ ὄνομά σου
  english_pob_choice: teach me your name
  chosen_korean: 당신의 이름을 제게 가르쳐 주셔서
  alternatives_korean:
  - 당신의 이름을 제게 알려 주셔서
  - 당신의 이름을 제게 가르쳐 주십시오
  lexicon: διδάσκω / ὄνομα
  rationale: 단순 ‘알리다’보다 ‘가르치다’가 원문의 요청성을 더 직접적으로 반영하며, 뒤의 목적절과 자연스럽게 이어지도록 ‘-주셔서’로 연결했습니다.
- source_word: ἐπικαλέσομαί σε
  english_pob_choice: I may call on you
  chosen_korean: 제가 당신을 부를 수 있게 해 주십시오
  alternatives_korean:
  - 제가 당신을 부르게 해 주십시오
  - 제가 당신께 부르짖게 해 주십시오
  lexicon: ἐπικαλέομαι
  rationale: 문맥상 단순 호명이 아니라 도움을 구하는 간구이므로 ‘부르다/부르짖다’의 긴장을 살리되, 현대 한국어에서는 비교적 सीधे한 ‘부르다’를 기본으로 했습니다.
- source_word: ἐν ἡμέρᾳ θλίψεως
  english_pob_choice: in the day of affliction
  chosen_korean: 환난의 날에
  alternatives_korean:
  - 고난의 날에
  - 환난 날에
  lexicon: θλῖψις
  rationale: POB의 정관사 있는 표현을 반영해 특정한 상황을 가리키는 자연스러운 한국어 관용구 ‘환난의 날’로 옮겼습니다.
theological_decisions:
- issue: 화자가 ‘주님’께 자신의 이름을 묻는 맥락에서 호칭과 2인칭 대명사의 존중 수준
  chosen_reading: 기도문의 직접 호칭은 ‘주님’, 이어지는 청원은 ‘당신’으로 유지해 공손한 간구의 톤을 살렸습니다.
  alternative_readings:
  - 전체를 ‘주여’/‘주께서’식으로 더 전통적으로 처리
  - ‘그분’ 중심의 서술체로 완화
  rationale: 본문은 간구의 장면이므로 현대 합쇼체의 직접 청원 형식이 원문의 긴박한 호소를 가장 잘 드러냅니다.
  doctrine_reference: 경건한 청원체와 직접 호칭의 문체 유지
