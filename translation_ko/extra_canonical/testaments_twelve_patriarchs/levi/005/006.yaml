  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/006.yaml
  text: And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down.”
translation:
  language: ko
  text: 그리고 그가 말했습니다. “나는 이스라엘 족속을 위해 중재하는 천사입니다. 그래서 그들이 치명타를 당하지 않게 하려는 것입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: ἄγγελος
  rationale: 문맥상 인격적 존재를 가리키므로 일반적인 ‘천사’로 옮겼습니다.
- source_word: παραιτούμενος
  english_pob_choice: intercedes for
  chosen_korean: 중재하는
  alternatives_korean:
  - 간구하는
  - 중보하는
  - 변호하는
  lexicon: παραιτέομαι
  rationale: 직접적으로 ‘간구하다’보다, 대상의 운명을 막아 서는 의미를 살려 ‘중재하다’로 옮겼습니다.
- source_word: τὸ γένος Ἰσραήλ
  english_pob_choice: the race of Israel
  chosen_korean: 이스라엘 족속
  alternatives_korean:
  - 이스라엘 민족
  - 이스라엘의 نسل
  - 이스라엘 혈통
  lexicon: γένος
  rationale: γένος의 집단·혈연적 뉘앙스를 살리되, 현대 한국어에서 자연스러운 ‘족속’으로 표현했습니다.
- source_word: μὴ πατάξαι αὐτούς
  english_pob_choice: so that they may not be struck down
  chosen_korean: 그들이 치명타를 당하지 않게 하려는 것입니다
  alternatives_korean:
  - 그들이 맞아 쓰러지지 않게 하려는 것입니다
  - 그들이 멸망당하지 않게 하려는 것입니다
  lexicon: πατάσσω
  rationale: πατάσσω의 ‘치다/쳐서 쓰러뜨리다’ 의미를 반영하되, 문맥상 생명에 대한 치명적 타격을 드러내기 위해 ‘치명타를 당하다’로 풀었습니다.
theological_decisions:
- issue: 천사가 이스라엘을 위해 중재한다는 표현의 직역 여부
  chosen_reading: 문맥의 중보 기능을 보존해 ‘중재하다’로 옮겼습니다.
  alternative_readings:
  - ‘간구하다’로 완화
  - ‘대신 변호하다’로 구체화
  rationale: 본문은 단순 감정적 기원을 넘어서 심판을 막는 역할을 말하므로, 중보적·대리적 기능을 드러내는 번역이 적절합니다.
  doctrine_reference: 천사론 / 중보 개념
