  text: And after this, when I awoke, I blessed the Most High.
translation:
  language: ko
  text: 그리고 그 뒤에 내가 잠에서 깨어나자, 지극히 높으신 분을 찬송하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after this
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 이후에
  - 그 후에
  lexicon: μετά + ταῦτα
  rationale: 시간적 순서를 자연스러운 현대 한국어로 옮기되, 원문의 단순한 전후 관계를 유지했습니다.
- source_word: ἔξυπνος γενόμενος
  english_pob_choice: when I awoke
  chosen_korean: 내가 잠에서 깨어나자
  alternatives_korean:
  - 내가 깨어났을 때
  - 잠이 깬 뒤에
  lexicon: ἔξυπνος γίνομαι
  rationale: 단순히 '깨어나다'보다 수면에서 벗어나는 상태 변화를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: εὐλόγησα
  english_pob_choice: I blessed
  chosen_korean: 찬송하였습니다
  alternatives_korean:
  - 복을 빌었습니다
  - 축복하였습니다
  - 찬양하였습니다
  lexicon: εὐλογέω
  rationale: 대상인 하나님께 대한 발화이므로 한국어에서는 통상적 '축복하다'보다 예배적 의미를 분명히 하는 '찬송하다'를 택했습니다.
- source_word: τὸν ὕψιστον
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  - 지존자
  lexicon: ὁ ὕψιστος
  rationale: 고유명사화된 경칭을 살리면서도 한국어에서 자연스럽고 존칭적인 호칭으로 옮겼습니다.
theological_decisions:
- issue: εὐλόγησα의 대상이 하나님일 때 한국어 동사 선택
  chosen_reading: '''찬송하였습니다''로 옮겨, 화자가 하나님을 향해 드리는 경배적 반응임을 드러냈습니다.'
  alternative_readings:
  - 복을 빌었습니다
  - 축복하였습니다
  rationale: 문맥상 인간에게 하는 축복이 아니라 지극히 높으신 분에 대한 찬양/찬송 행위이므로, 예배적 의미가 분명한 표현을 선택했습니다.
  doctrine_reference: doxology and reverent divine address
