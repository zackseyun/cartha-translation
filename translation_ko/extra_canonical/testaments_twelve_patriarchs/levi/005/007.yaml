  source_fidelity: καὶ μετὰ ταῦτα의 순차 관계는 ‘그리고 그 뒤에’로, ἔξυπνος γενόμενος는 수면에서 깨어난 상황을 나타내는 ‘내가 잠에서 깨어나자’로 충실히 옮겼습니다. εὐλόγησα τὸν ὕψιστον도 ‘지극히 높으신 분을 찬송하였습니다’로 대상과 경배적 행위를 적절히 보존합니다.
