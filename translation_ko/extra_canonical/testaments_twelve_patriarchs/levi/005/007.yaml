  terminology: ‘지극히 높으신 분’은 ὁ ὕψιστος의 칭호성을 잘 살립니다. 하나님을 대상으로 한 εὐλογέω를 ‘찬송하였습니다’로 옮긴 것은 한국어 종교 문맥에서 자연스럽고 의미상 허용됩니다.
