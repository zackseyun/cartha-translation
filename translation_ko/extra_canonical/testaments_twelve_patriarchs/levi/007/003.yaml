  lexicon: μιαίνω
  rationale: μιαίνω의 오염·더러움 이미지를 직역에 가깝게 유지하되, 한국어에서 관계와 모욕을 함께 드러내는 ‘더럽힌’으로 옮겼습니다.
theological_decisions:
