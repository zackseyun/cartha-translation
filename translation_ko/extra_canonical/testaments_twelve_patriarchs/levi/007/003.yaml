  chosen_reading: ‘어리석은 짓을 저질렀습니다. 곧 … 더럽힌 것입니다’로 두 절차를 나누어, 첫 문장의 도덕적 평가와 뒤의 구체 행위를 구분했습니다.
  alternative_readings:
