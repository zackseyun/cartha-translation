id: T12P.LEV.7.2
reference: Testament of Levi 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἔσται γὰρ ἀπὸ τῆς⁹ σήμερον *ἡ Σύκημα¹⁰ λεγομένη πόλις ἀσυνέτων¹¹, ὅτι¹² ὡσεί¹³ τις *χλευάσει μωρὸν¹⁴ οὕτως ἐχλευάσαμεν αὐτούς¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/002.yaml
  text: For from this day the city called Sychem shall be a city of senseless people. For just as someone mocks a fool, so we mocked them,
translation:
  language: ko
  text: 이는 오늘부터 시켐이라 불리는 성읍이 분별 없는 사람들의 성읍이 될 것이기 때문입니다. 마치 누군가 어리석은 사람을 조롱하듯이, 우리가 그들을 조롱했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Σύκημα λεγομένη πόλις
  english_pob_choice: the city called Sychem
  chosen_korean: 시켐이라 불리는 성읍
  alternatives_korean:
  - 시켐이라 불리는 도시
  - 시켐이라는 성읍
  lexicon: 고유명사 transliteration
  rationale: 고유명사 Σύκημα를 표준적인 음역인 시켐으로 옮기고, λεγομένη를 ‘불리는’으로 처리해 원문의 명명 표현을 살렸습니다.
- source_word: ἀσυνέτων
  english_pob_choice: senseless people
  chosen_korean: 무감각한 사람들의
  alternatives_korean:
  - 어리석은 사람들의
  - 이해 없는 사람들의
  - 무분별한 사람들의
  lexicon: ἀσύνετος
  rationale: 영문 POB의 ‘senseless people’에 맞추되, ἀσυνέτων의 핵심인 분별·이해의 결핍을 드러내는 ‘무감각한’으로 옮겼습니다.
- source_word: ὡσεί τις χλευάσει μωρόν
  english_pob_choice: just as someone mocks a fool
  chosen_korean: 마치 누군가 어리석은 자를 조롱하듯이
  alternatives_korean:
  - 마치 어떤 이가 바보를 비웃듯이
  - 마치 누군가 어리석은 사람을 조롱하듯이
  lexicon: χλευάζω, μωρός
  rationale: χλευάζω는 단순한 웃음보다 조롱·희롱의 강도가 있어 ‘조롱하다’로, μωρός는 ‘어리석은 자’로 옮겼습니다.
- source_word: ἐχλευάσαμεν αὐτούς
  english_pob_choice: we mocked them
  chosen_korean: 우리도 그들을 조롱했습니다
  alternatives_korean:
  - 우리는 그들을 비웃었습니다
  - 우리도 그들을 희롱했습니다
  lexicon: χλευάζω
  rationale: 과거형과 1인칭 복수 주어를 그대로 반영해 ‘우리도’와 ‘조롱했습니다’를 사용했습니다.
theological_decisions:
- issue: 직설적 비난 표현의 강도
  chosen_reading: ‘무감각한 사람들의 성읍’과 ‘조롱했습니다’를 유지해 원문의 비난과 자기진술의 강도를 약화하지 않았습니다.
  alternative_readings:
  - ‘어리석은 사람들의 성읍’으로 완화
  - ‘비웃었습니다’로 완화
  rationale: 본문은 단순한 지식 부족이 아니라 분별 상실과 조롱의 행위를 함께 말하므로, 도덕적 날카로움을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적-도덕적 진술
- issue: 비교구문 ‘ὡσεί’
  chosen_reading: ‘마치 … 하듯이’ 구조를 사용해 비유적 비교를 분명히 했습니다.
  alternative_readings:
  - ‘…처럼’으로 단순화
  - 비교표지를 생략
  rationale: ὡσεί는 실제 동일성을 말하기보다 유사한 방식의 행위를 비교하므로, 한국어에서도 명시적 비교구조를 유지했습니다.
  doctrine_reference: 수사적 비교
