  terminology: Κύριος의 ‘주님’은 적절합니다. ‘가나안 사람들’과 ‘그들의 땅’도 원문을 잘 반영합니다. ‘후손’은 σπέρμα의 계보적·집합적 용례를 자연스럽게 전달하며 특정 교리적 해석을 덧붙이지 않습니다.
