id: T12P.LEV.7.1
reference: Testament of Levi 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπον¹ Γἐγὼ²⁾ τῷ πατρί μου³, Ἰακώβ⁴, ὅτι ἐν σοὶ ἐξουδενώσει⁵ Κύριος⁶ τοὺς Χαναναίους⁷ καὶ δώσει⁸ τὴν γῆν αὐτῶν σοι καὶ τῷ σπέρματί σου μετὰ σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/001.yaml
  text: And I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you.”
translation:
  language: ko
  text: 그리고 나는 아버지 야곱에게 말했습니다. “주님께서 당신을 통해 가나안 사람들을 무력하게 하시고, 그들의 땅을 당신과 당신 뒤를 이을 당신의 후손에게 주실 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 야훼
  lexicon: κύριος
  rationale: 본절은 직접적인 야훼 উদ্ধ 인용 표지가 없고, POB의 영어도 일반적 칭호인 “the Lord”를 사용하므로 한국어에서는 자연스러운 경칭인 “주님”으로 옮겼습니다.
- source_word: ἐξουδενώσει
  english_pob_choice: will bring ... to nothing
  chosen_korean: 무력하게 하시고
  alternatives_korean:
  - 없애실 것입니다
  - 하찮게 여기실 것입니다
  - 멸하실 것입니다
  lexicon: ἐξουδενόω
  rationale: 단순한 소멸보다 ‘가치와 힘을 꺾어 무력화하다’는 뜻이 더 잘 드러나도록, 문맥상 점령과 정복의 결과를 나타내는 표현으로 옮겼습니다.
- source_word: τὴν γῆν αὐτῶν
  english_pob_choice: their land
  chosen_korean: 그들의 땅
  alternatives_korean:
  - 그 땅
  - 그들의 영토
  - 그들의 나라
  lexicon: γῆ
  rationale: 여기서는 약속된 토지 전체를 가리키므로, 직역에 가까운 “그들의 땅”이 원문의 범위를 가장 무난하게 반영합니다.
- source_word: τῷ σπέρματί σου μετὰ σε
  english_pob_choice: to you and to your seed after you
  chosen_korean: 당신과 당신 뒤의 당신의 씨에게
  alternatives_korean:
  - 당신과 당신 다음의 당신의 후손에게
  - 당신과 뒤이어 올 당신의 씨에게
  - 당신과 당신 후손에게
  lexicon: σπέρμα
  rationale: σπέρμα를 전통적 ‘자손’으로 단순화하기보다, 본문이 가진 언약-씨의 표현을 살려 “씨”를 유지했습니다. ‘μετὰ σε’는 시간적·계보적 연속을 드러내도록 ‘당신 뒤의’로 보완했습니다.
theological_decisions:
- issue: ‘씨’(σπέρμα)의 언약적 표현 유지 여부
  chosen_reading: ‘당신의 씨’로 유지해 언약 계승의 표현을 보존했습니다.
  alternative_readings:
  - ‘당신의 자손’
  - ‘당신 후손’
  rationale: 이 문맥은 단순한 집단 후손보다 약속의 계승을 강조하므로, POB의 원문 지향성과 문맥적 뉘앙스를 살려 ‘씨’를 유지하는 편이 더 적합합니다.
  doctrine_reference: 언약 계승과 약속 성취에 대한 성경적 표현
