  to: 그리고 나는 아버지 야곱에게 말했습니다. “주님께서 당신을 통해 가나안 사람들을 무력하게 하시고, 그들의 땅을 당신과 당신 뒤를 이을 당신의 후손에게 주실 것입니다.”
