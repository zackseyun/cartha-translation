language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (page 92, Levi source-fix v2)
  text: ᾿Αντίγραφον λόγων² Λευί³, ὅσα διέθετο⁴ τοῖς υἱοῖς αὐτοῦ⁵ κατὰ πάντα ἃ⁶ ποιήσουσιν⁷, καὶ ὅσα συναντήσει αὐτοῖς *ἕως ἡμέρας κρίσεως⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/001.yaml
  text: A copy of the words of Levi, which he ordained for his sons about all that they would do, and all that would happen to them[a] until the day of judgment.
  footnotes:
  - marker: a
    text: Or 'would befall them.' The Greek idiom literally suggests what would 'meet' them in the future.
    reason: lexical_alternative
translation:
  language: ko
  text: 레위의 말들의 사본입니다. 그는 자기 아들들에게 그들이 행할 모든 것과 그들에게 닥칠 모든 일에 관하여, 그리고 심판의 날까지의 모든 일을 정해 두었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾿Αντίγραφον λόγων
  english_pob_choice: A copy of the words
  chosen_korean: 말들의 사본
  alternatives_korean:
  - 말씀의 사본
  - 말의 기록
  lexicon: αντίγραφον; λόγοι
  rationale: αντίγραφον은 ‘복사본/사본’의 뜻이 분명하므로 ‘사본’으로, λόγοι는 단순한 ‘말들’이 자연스럽고 원문에 가까워 ‘말들의 사본’으로 옮겼습니다.
- source_word: διέθετο τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: he ordained for his sons
  chosen_korean: 자기 아들들에게 … 정해 두었습니다
  alternatives_korean:
  - 자기 아들들을 위해 제정했습니다
  - 자기 아들들에게 명했습니다
  lexicon: διατίθημι
  rationale: διατίθημι는 유언적·규범적 ‘정해 두다/지정하다’의 뉘앙스가 있어, 법령처럼 굳은 ‘제정하다’보다 본문의 전달성을 살려 ‘정해 두었습니다’로 옮겼습니다.
- source_word: κατὰ πάντα ἃ ποιήσουσιν καὶ ὅσα συναντήσει αὐτοῖς
  english_pob_choice: about all that they would do, and all that would happen to them
  chosen_korean: 그들이 행할 모든 것과 그들에게 닥칠 모든 일에 관하여, 그리고 … 모든 일
  alternatives_korean:
  - 그들이 할 모든 것과 그들에게 일어날 모든 것
  - 그들이 행할 모든 일과 그들에게 마주칠 모든 일
  lexicon: κατὰ πάντα ἃ / συναντήσει
  rationale: κατὰ πάντα ἃ는 ‘~에 관하여/모든 것에 대해’의 범위 표지로, συναντήσει는 직역하면 ‘마주치다/닥치다’이므로 유의미하게 ‘닥칠’로 옮겨 미래의 사건성을 드러냈습니다.
- source_word: ἕως ἡμέρας κρίσεως
  english_pob_choice: until the day of judgment
  chosen_korean: 심판의 날까지
  alternatives_korean:
  - 판결의 날까지
  - 심판 날까지
  lexicon: ἡμέρα κρίσεως
  rationale: ἡμέρας κρίσεως는 종말론적 ‘심판의 날’이라는 익숙한 한국어 표현이 원문의 의미를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: λέγος/사본 형식이 지니는 권위와 전달 방식
  chosen_reading: 이 본문은 레위가 아들들에게 남긴 규범적 유언 내용을 ‘사본’ 형식으로 소개하므로, 서두를 설명적으로 풀기보다 문서 표제를 살리는 방식으로 번역했습니다.
  alternative_readings:
  - 레위의 말들을 기록한 글
  - 레위의 가르침의 복사본
  rationale: 원문이 단순한 이야기 문장보다 문서 소개문에 가깝기 때문에, 독자가 본문의 장르와 권위를 바로 이해하도록 ‘말들의 사본’이라는 표제적 표현을 유지했습니다.
  doctrine_reference: 문서 장르 및 전승 소개에 대한 번역 원칙
