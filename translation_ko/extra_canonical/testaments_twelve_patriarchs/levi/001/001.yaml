  naturalness: ‘말들의 사본’은 표제 문맥에서 가능하나, 원문의 관계절을 자연스럽게 반영하려면 ‘레위가 … 정해 둔 말들의 사본’으로 구성하는 편이 좋습니다. 수정문은 현대 표준어의 격식 있는 문체를 유지하면서 시간 수식어의 범위를 명료하게 합니다.
