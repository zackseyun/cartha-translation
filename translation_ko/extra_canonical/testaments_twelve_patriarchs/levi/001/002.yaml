source:
  edition: Charles 1908 Greek Versions (page 92, Levi source-fix v2)
  text: Ὑγιαίνων⁹ γὰρ¹⁰ ἦν ὅτε ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν· *ἀπεκαλύφθη δὲ¹¹ αὐτῷ ὅτι μέλλει ἀποθνήσκειν¹². *Καὶ ὅτε¹³ συνήχθησαν¹⁴, *εἶπεν πρὸς αὐτούς¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/002.yaml
  text: 'For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: ko
  text: '그가 그들을 자기 곁으로 불렀을 때 그는 건강했습니다. 그러나 자신이 곧 죽게 될 것이라는 사실이 그에게 드러났습니다. 그들이 함께 모였을 때, 그는 그들에게 말했습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  english_pob_choice: in sound health
  chosen_korean: 건강하였으나
  alternatives_korean:
  - 온전한 건강 상태였으나
  - 아무 이상 없이 건강하였으나
  lexicon: ὑγιαίνω
  rationale: 몸 상태가 좋았다는 뜻을 자연스럽게 살리되, 서술의 흐름을 위해 부사적 절로 처리했습니다.
- source_word: ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν
  english_pob_choice: he called them to himself
  chosen_korean: 그들을 자기에게 불렀을 때
  alternatives_korean:
  - 그들을 자기 앞으로 불렀을 때
  - 그들을 자기에게 소집했을 때
  lexicon: καλέω
  rationale: 직접적 소환/부름의 동작을 살리면서, 현대 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: μέλλει ἀποθνήσκειν
  english_pob_choice: was about to die
  chosen_korean: 곧 죽게 될 것이라는 사실
  alternatives_korean:
  - 죽을 참이라는 사실
  - 곧 죽을 운명이라는 사실
  lexicon: μέλλω + ἀποθνῄσκω
  rationale: 임박한 죽음을 예고하는 뉘앙스를 유지하되, 예언적 단정으로 과도하게 굳히지 않았습니다.
- source_word: συνήχθησαν / εἶπεν πρὸς αὐτούς
  english_pob_choice: when they had gathered together, he said to them
  chosen_korean: 그들이 모였을 때, 그는 그들에게 말했습니다
  alternatives_korean:
  - 그들이 함께 모였을 때, 그는 그들에게 말했습니다
  - 그들이 모이자 그는 그들에게 말했습니다
  lexicon: συνάγω / λέγω πρὸς
  rationale: 모임이 완료된 뒤의 발화를 순서대로 재현해, 서술의 진행을 분명하게 했습니다.
theological_decisions:
- issue: 죽음의 임박성 표현
  chosen_reading: 곧 죽게 될 것이라는 사실이 그에게 드러났습니다
  alternative_readings:
  - 그가 곧 죽게 될 것이 알려졌습니다
  - 그가 죽을 것이 계시되었습니다
  rationale: 원문의 ἀπεκαλύφθη를 단순 정보 전달이 아니라 ‘드러남/계시됨’으로 살리되, 문맥상 과장된 종교 용어로 고정하지 않았습니다.
  doctrine_reference: 계시·예고의 서술 기능
