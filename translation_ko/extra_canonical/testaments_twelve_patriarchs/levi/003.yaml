base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
  footnotes:
  - marker: a
    text: Or 'make atonement to the Lord.' The Greek verb can be rendered either way in cultic contexts.
    reason: lexical_alternative
  - marker: b
    text: '''Beliar'' reflects the Greek form of the name, often rendered ''Belial'' in other traditions.'
    reason: lexical_alternative
  - marker: c
    text: '''A reasonable and bloodless offering'' translates a phrase that may also be understood as ''a rational'' or, more interpretively, ''a spiritual and bloodless offering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 너에게 보인 하늘들에 관하여 들으십시오. 가장 낮은 곳은 이 때문으로 어둡습니다. 곧 사람들의 모든 불의한 행위를 보기 때문입니다. 또 그것에는 하나님의 심판의 날을 위하여, 사람들 위에 대한 의로운 심판으로, 불과 눈과 얼음이 준비되어 있습니다. 그 안에는 법을 어기는 자들에게 복수하기 위한 모든 벌의 영들이 있습니다. 그보다 위에는 거룩한 곳이 있으며, 그 안에는 심판의 날을 위하여 배정된 군대의 무리들이 있어, 속임의 영들과 Beliar에 대하여 복수를 실행합니다. 그리고 그 위에는 거룩한 이들이 있습니다. 모든 것 가운데 가장 높은 곳에는 모든 거룩함보다 높으신 큰 영광이 거하십니다. 그 다음 하늘에는 대천사들이 있는데, 그들은 섬기며 의인들이 알지 못하여 지은 모든 죄를 위하여 주님께 화목을 이루고[a], 주님께 향기로운 냄새와 합당한 제물과 피 없는 제물을 바칩니다[c]. 또 이 아래 하늘에는 주님의 앞에 있는 천사들에게 답을 가져가는 천사들이 있습니다. 그보다 다음 하늘에는 보좌들과 통치권들이 있는데, 그 안에서 하나님께 찬송이 끊임없이 드려집니다. 그러므로 주님께서 자신의 거룩함의 정도로 우리를 보실 때 하늘들이 흔들립니다. 땅도 그 기초에서 움직이며, 떨며, 그 깊은 곳까지 흔들립니다. 그러나 사람의 아들들은 이러한 것들을 깨닫지 못하여 길을 벗어나 그를 진노하게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνός
  english_pob_choice: dark
  chosen_korean: 어둡습니다
  alternatives_korean:
  - 우울합니다
  - 침울합니다
  - 음산합니다
  lexicon: LSJ
  rationale: 아래 하늘의 상태를 시각적·정서적으로 함께 드러내면서도, 원문의 심판적 분위기를 과장하지 않게 전달합니다.
- source_word: ἀδικίας
  english_pob_choice: unrighteous deeds
  chosen_korean: 불의한 행위
  alternatives_korean:
  - 불의
  - 부정한 일
  - 불법한 행위
  lexicon: BDAG
  rationale: 단순한 사회적 ‘부정’보다 도덕·신학적 불의를 드러내며, 구체적 행위라는 점도 살립니다.
- source_word: ἐκδίκησις / ἐκδικήσεως
  english_pob_choice: vengeance
  chosen_korean: 복수
  alternatives_korean:
  - 보복
  - 징벌
  - 응징
  lexicon: BDAG
  rationale: 이 장의 묵시적·재판적 문맥에서 강한 대응 의미를 살리되, 하나님의 공의와 연결되는 긴장을 유지합니다.
- source_word: ἅγιον
  english_pob_choice: holy place
  chosen_korean: 거룩한 곳
  alternatives_korean:
  - 성소
  - 거룩한 장소
  lexicon: LSJ
  rationale: 천상 구조를 설명하는 표현으로서 너무 제도화된 성소보다 직역적이고 투명한 표현을 택했습니다.
- source_word: Βελιάρ
  english_pob_choice: Beliar
  chosen_korean: Beliar
  alternatives_korean:
  - 벨리알
  - 벨리어
  lexicon: Proper name tradition
  rationale: 영어 POB의 소스 형태를 그대로 반영하여, 더 익숙한 ‘벨리알’로 평준화하지 않았습니다.
- source_word: ἐξιλάσκονται
  english_pob_choice: make propitiation
  chosen_korean: 화목을 이루고
  alternatives_korean:
  - 속죄하고
  - 화해시키고
  - 속죄를 행하고
  lexicon: BDAG
  rationale: 한국어에서 ‘propitiation’의 제의적·관계적 의미를 함께 살리기 위해, 단순한 감정 조절이 아니라 하나님과의 화목을 이루는 제사적 행위로 옮겼습니다.
- source_word: λογικὴν καὶ ἀναίμακτον θυσίαν
  english_pob_choice: a reasonable and bloodless offering
  chosen_korean: 합당한 제물과 피 없는 제물
  alternatives_korean:
  - 이성적인 제물과 피 없는 제물
  - 영적인 제물과 피 없는 제물
  lexicon: LSJ/BDAG
  rationale: λογική의 해석 여지를 열어 두면서도, 제물의 성격과 ‘피 없는’이라는 대조를 직접 드러내기 위해 보다 투명한 표현을 택했습니다.
- source_word: θρόνοι καὶ *ἐξουσίαι
  english_pob_choice: thrones and dominions
  chosen_korean: 보좌들과 통치권들
  alternatives_korean:
  - 보좌들과 권세들
  - 왕좌들과 지배권들
  lexicon: BDAG
  rationale: 천상 질서를 가리키는 열거 구조를 살리기 위해, 기능적 지배를 뜻하는 ‘통치권들’을 선택했습니다.
theological_decisions:
- issue: 천사들의 제사적 역할
  chosen_reading: 대천사들이 의인들의 무지한 죄를 위하여 주님께 화목을 이루고, 향기로운 냄새와 피 없는 제물을 바치는 것으로 옮겼습니다.
  alternative_readings:
  - 단순히 중보 기도로 풀기
  - ‘속죄하다’로만 단일화하기
  rationale: 원문은 분명한 제의적 어휘를 사용하므로, 이를 일반적 중보로 약화하지 않고 제사적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it'
- issue: Μεγάλη Δόξα의 번역
  chosen_reading: ‘큰 영광’으로 옮겨, 하나님을 지칭하는 경외적 우회칭호의 성격을 살렸습니다.
  alternative_readings:
  - 하나님
  - 위대한 영광
  rationale: 묵시문학적 호칭의 질감을 보존하면서도, 본문이 직접 ‘하나님’이라 말하지 않는 점을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it'
