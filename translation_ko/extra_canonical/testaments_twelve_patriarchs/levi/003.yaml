base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
  footnotes:
  - marker: a
    text: Or 'make atonement to the Lord.' The Greek verb can be rendered either way in cultic contexts.
    reason: lexical_alternative
  - marker: b
    text: '''Beliar'' reflects the Greek form of the name, often rendered ''Belial'' in other traditions.'
    reason: lexical_alternative
  - marker: c
    text: '''A reasonable and bloodless offering'' translates a phrase that may also be understood as ''a rational'' or, more interpretively, ''a spiritual and bloodless offering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: '그러므로 너에게 보여진 하늘들에 관하여 들으십시오. 가장 낮은 하늘은 이 때문에 어둡습니다. 그것이 사람들의 모든 불의를 보기 때문입니다.


    그곳에는 하나님의 의로운 심판 가운데 심판의 날을 위하여 불과 눈과 수정이 마련되어 있습니다. 그 안에는 사람들에게 보응을 내리도록 하는 모든 징벌의 영들이 있습니다.


    둘째 하늘에는 심판의 날을 위하여 정해져, 속임의 영들과 벨리아르[b]에게 보응을 행할 군대의 세력들이 있습니다. 그들 위에는 거룩한 이들이 있습니다.


    모든 것 가운데 가장 높은 거처에는 큰 영광이 모든 거룩함보다 높이 계십니다.


    그 곁의 하늘[d]에는 주님을 섬기며 의인들이 알지 못하여 저지른 모든 허물을 위하여 주님께 속죄를 행하는[a] 대천사들이 있습니다. 그들은 주님께 향기로운 향기와 이성적이며 피 없는 제사를 바칩니다[c].


    그 아래 하늘에는 주님의 현존의 천사들에게 응답을 가져가는 천사들이 있습니다.


    그 곁의 하늘[d]에는 보좌들과 권세들이 있으며, 그곳에서는 언제나 하나님께 찬송이 드려집니다.


    그러므로 주님께서 우리를 굽어보실 때, 우리 모두가 떨고 하늘과 땅과 심연도 그분의 위엄 앞에서 흔들립니다.


    그러나 사람의 아들들은 이러한 것들에 무감각한 채 죄를 짓고 지극히 높으신 분을 노하게 합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속죄를 행하다’는 제의 문맥의 그리스어 동사를 옮긴 것입니다. ‘주님께 속죄하다’ 또는 ‘주님께 화목의 제사를 드리다’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벨리아르’는 그리스어 형태 Βελιάρ를 따른 음역입니다. 다른 전승에서는 흔히 ‘벨리알’로 표기합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘이성적이며 피 없는 제사’는 하나의 제사를 가리킵니다. ‘이성적인’은 문맥에 따라 ‘합당한’ 또는 더 해석적으로 ‘영적인’으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 여기의 ‘그 곁의 하늘’에 해당하는 그리스어 표현은 비평 본문에서 손상되었거나 불확실한 것으로 표시됩니다. 정확한 천상 위치나 층서를 단정하지 않았습니다.
    reason: textual_uncertainty
