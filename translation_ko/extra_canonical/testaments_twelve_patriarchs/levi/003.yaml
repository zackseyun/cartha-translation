  rationale: 제시된 그리스어 본문을 우선하여 영어 POB에만 있는 해설적 확장을 제거하고, 원문에 있는 심연과 ‘지극히 높으신 분’을 복원했습니다. 제의 어휘와 묵시적 천상 질서를 보존하되, 손상 표지가 있는 위치 표현은 주석으로 불확실성을 남겼습니다. 전체 문체는 현대 표준어 합쇼체로 다듬었습니다.
