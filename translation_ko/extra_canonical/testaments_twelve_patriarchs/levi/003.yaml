- from: 그러므로 이제 너에게 보인 하늘들에 관하여 들으십시오. 가장 낮은 곳은 이 때문으로 어둡습니다. 곧 사람들의 모든 불의한 행위를 보기 때문입니다. 또 그것에는 하나님의 심판의 날을 위하여, 사람들 위에 대한 의로운 심판으로, 불과 눈과 얼음이 준비되어 있습니다. 그 안에는 법을 어기는 자들에게 복수하기 위한 모든 벌의 영들이 있습니다. 그보다 위에는 거룩한 곳이 있으며, 그 안에는 심판의 날을 위하여 배정된 군대의 무리들이 있어, 속임의 영들과 Beliar에 대하여 복수를 실행합니다. 그리고 그 위에는 거룩한 이들이 있습니다. 모든 것 가운데 가장 높은 곳에는 모든 거룩함보다 높으신 큰 영광이 거하십니다. 그 다음 하늘에는 대천사들이 있는데, 그들은 섬기며 의인들이 알지 못하여 지은 모든 죄를 위하여 주님께 화목을 이루고[a], 주님께 향기로운 냄새와 합당한 제물과 피 없는 제물을 바칩니다[c]. 또 이 아래 하늘에는 주님의 앞에 있는 천사들에게 답을 가져가는 천사들이 있습니다. 그보다 다음 하늘에는 보좌들과 통치권들이 있는데, 그 안에서 하나님께 찬송이 끊임없이 드려집니다. 그러므로 주님께서 자신의 거룩함의 정도로 우리를 보실 때 하늘들이 흔들립니다. 땅도 그 기초에서 움직이며, 떨며, 그 깊은 곳까지 흔들립니다. 그러나 사람의 아들들은 이러한 것들을 깨닫지 못하여 길을 벗어나 그를 진노하게 합니다.
