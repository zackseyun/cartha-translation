  lexicon: LSJ
  rationale: 천상 구조를 설명하는 표현으로서 너무 제도화된 성소보다 직역적이고 투명한 표현을 택했습니다.
- source_word: Βελιάρ
  english_pob_choice: Beliar
  chosen_korean: Beliar
  alternatives_korean:
  - 벨리알
  - 벨리어
  lexicon: Proper name tradition
  rationale: 영어 POB의 소스 형태를 그대로 반영하여, 더 익숙한 ‘벨리알’로 평준화하지 않았습니다.
- source_word: ἐξιλάσκονται
  english_pob_choice: make propitiation
  chosen_korean: 화목을 이루고
  alternatives_korean:
  - 속죄하고
  - 화해시키고
  - 속죄를 행하고
  lexicon: BDAG
  rationale: 한국어에서 ‘propitiation’의 제의적·관계적 의미를 함께 살리기 위해, 단순한 감정 조절이 아니라 하나님과의 화목을 이루는 제사적 행위로 옮겼습니다.
- source_word: λογικὴν καὶ ἀναίμακτον θυσίαν
  english_pob_choice: a reasonable and bloodless offering
  chosen_korean: 합당한 제물과 피 없는 제물
  alternatives_korean:
  - 이성적인 제물과 피 없는 제물
  - 영적인 제물과 피 없는 제물
  lexicon: LSJ/BDAG
  rationale: λογική의 해석 여지를 열어 두면서도, 제물의 성격과 ‘피 없는’이라는 대조를 직접 드러내기 위해 보다 투명한 표현을 택했습니다.
- source_word: θρόνοι καὶ *ἐξουσίαι
  english_pob_choice: thrones and dominions
  chosen_korean: 보좌들과 통치권들
  alternatives_korean:
  - 보좌들과 권세들
  - 왕좌들과 지배권들
  lexicon: BDAG
  rationale: 천상 질서를 가리키는 열거 구조를 살리기 위해, 기능적 지배를 뜻하는 ‘통치권들’을 선택했습니다.
theological_decisions:
