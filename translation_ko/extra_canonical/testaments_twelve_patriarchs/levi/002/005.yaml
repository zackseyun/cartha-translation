  source_fidelity: ὕπνος는 ‘졸음’보다 ‘잠’이 직접적입니다. 또한 ἐν αὐτῷ는 직역하면 ‘그 안에’이며, 영어 감사본의 ‘on it’은 공간 관계를 해석하여 좁힌 것입니다. 원문 우선 원칙상 이를 ‘산 위에’로 확정하지 않는 편이 안전합니다.
  naturalness: ‘잠이 나를 덮쳤고’는 ἐπέπεσεν의 갑작스러운 도래를 자연스러운 현대 한국어로 살립니다. ‘그 산 안에 있었습니다’는 산에 대해 다소 이례적인 표현이지만, 원문의 ἐν이 지닌 위치 관계를 보존합니다.
  terminology: 신학적 전문 용어와 고유명사는 없습니다. ‘높은 산’은 ὄρος ὑψηλόν에 충실합니다.
