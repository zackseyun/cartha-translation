  text: Then sleep fell upon me, and I saw a high mountain, and I was on it.
translation:
  language: ko
  text: 그때 잠이 나를 덮쳤고, 나는 높은 산을 보았으며, 나는 그 산 안에 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέπεσέ ... ὕπνος
  english_pob_choice: Then sleep fell upon me
  chosen_korean: 졸음이 내게 덮쳐 왔고
  alternatives_korean:
  - 잠이 내게 떨어졌고
  - 졸음이 내리덮쳤고
  lexicon: ἐπιπίπτω / ὕπνος
  rationale: 문장의 자연스러운 주체-대상 관계를 살리면서, ἐπέπεσεν의 돌발적·갑작스러운 동작감을 ‘덮쳐 왔고’로 옮겼습니다.
- source_word: ἐθεασάμην
  english_pob_choice: I saw
  chosen_korean: 나는 보았으며
  alternatives_korean:
  - 나는 바라보았으며
  - 내가 보았으며
  lexicon: θεάομαι
  rationale: 단순 시각 경험을 뜻하는 본동사로 보고, 과장 없이 표준적인 ‘보다’를 사용했습니다.
- source_word: ὄρος ὑψηλόν
  english_pob_choice: a high mountain
  chosen_korean: 높은 산
  alternatives_korean:
  - 높이 솟은 산
  - 큰 산
  lexicon: ὄρος / ὑψηλός
  rationale: 높이와 위엄을 모두 담되, 본문이 요구하는 최소한의 서술을 유지하기 위해 직관적인 ‘높은 산’을 택했습니다.
- source_word: ἤμην ἐν αὐτῷ
  english_pob_choice: I was on it
  chosen_korean: 나는 그 산 위에 있었습니다
  alternatives_korean:
  - 나는 그곳에 있었습니다
  - 나는 그 안에 있었습니다
  lexicon: ἐν + dative
  rationale: 영어 POB의 ‘on it’에 맞추어, 산의 표면 위에 위치했다는 공간 관계를 한국어로 명시했습니다.
theological_decisions:
- issue: 꿈/환시의 체험 묘사
  chosen_reading: 이 절은 계시적 환상보다 먼저 ‘졸음이 덮침-산을 봄-그 위에 있음’이라는 체험 순서를 담은 서술로 보아, 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 계시적 환상으로 명시
  - 상징적 산으로 확대 해석
  rationale: 원문 자체는 체험의 내용만 제시하므로, 후대적 의미를 앞세우지 않고 서술 수준을 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 해석 자제 원칙; 본문 서술 우선
