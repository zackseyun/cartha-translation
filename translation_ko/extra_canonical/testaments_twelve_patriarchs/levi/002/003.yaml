id: T12P.LEV.2.3
reference: Testament of Levi 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς δὲ ἐποίμαινον¹⁸ ἐν Ἀβελμαούλ¹⁹, πνεῦμα συνέσεως Κυρίου ἦλθεν ἐπʼ ἐμέ²⁰, καὶ *ἐθεώρουν πάντας ἀνθρώπους²¹ *ἀφανίσαντας τὴν ὁδὸν αὐτῶν²², καὶ *ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία καὶ ἐπὶ πύργους ἡ ἀδικία ἐκάθητο²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/003.yaml
  text: And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers.
translation:
  language: ko
  text: 내가 아벨마울에서 양을 치고 있을 때, 주님에게서 이해의 영이 내게 임했습니다. 나는 모든 사람이 자기 길을 파괴하는 것을 보았습니다. 죄는 성벽 위에 세워지고 있었고, 불의는 망대들 위에 앉아 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα συνέσεως Κυρίου
  english_pob_choice: a spirit of understanding from the Lord
  chosen_korean: 이해의 영이 주님으로부터
  alternatives_korean:
  - 지혜의 영이 주님으로부터
  - 깨달음의 영이 주님으로부터
  lexicon: πνεῦμα / συνέσεως / Κυρίου
  rationale: συνέσεως는 단순한 지식보다 ‘이해, 분별’의 뜻이 강해 ‘이해의 영’으로 옮겼고, Κυρίου는 본문상의 주어를 따라 ‘주님’으로 유지했습니다.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  english_pob_choice: destroying their way
  chosen_korean: 자기들의 길을 파괴하는 것을
  alternatives_korean:
  - 자기들의 길을 멸하는 것을
  - 자기들의 길을 망가뜨리는 것을
  lexicon: ἀφανίσαντας
  rationale: revision pass에서 확정된 ‘destroying’에 맞추어, ἀφανίσαντας의 ‘없애다/파괴하다/멸하다’ 계열 의미를 직접 반영했습니다.
- source_word: ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία
  english_pob_choice: sin was being built upon a wall
  chosen_korean: 죄는 성벽 위에 세워지고 있었고
  alternatives_korean:
  - 죄가 성벽 위에 건축되고 있었고
  - 죄가 담 위에 지어지고 있었고
  lexicon: οἰκοδομεῖτο / τείχος / ἁμαρτία
  rationale: οἰκοδομέω의 수동형을 살려 ‘세워지다’로 옮겼고, τείχος는 일반적인 ‘벽’보다 문맥상 도시의 방어 구조를 드러내는 ‘성벽’이 더 적절합니다.
- source_word: ἡ ἀδικία ἐκάθητο
  english_pob_choice: injustice sat upon towers
  chosen_korean: 불의는 망대들 위에 앉아 있었습니다
  alternatives_korean:
  - 불의는 탑들 위에 앉아 있었습니다
  - 불의가 망대들 위에 자리하고 있었습니다
  lexicon: ἀδικία / πύργους / ἐκάθητο
  rationale: ἐκάθητο의 ‘앉다’ 이미지를 유지해 의인화된 장면을 살렸고, πύργους는 군사적·감시적 뉘앙스를 살리는 ‘망대’로 옮겼습니다.
theological_decisions:
- issue: 본문의 환상적 의인화와 도덕적 파괴 묘사
  chosen_reading: 죄와 불의를 사람처럼 성벽과 망대 위에 자리한 것으로 묘사하는 원문 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 문학적 비유를 완화해 평이하게 옮기는 방법
  - ‘죄가 쌓였다’처럼 추상화하는 방법
  rationale: 이 구절은 윤리적 부패를 건축물 이미지로 강하게 형상화하므로, 비유를 약화하지 않고 그대로 보존해야 원문의 힘이 유지됩니다.
  doctrine_reference: source-literary fidelity
- issue: Κυρίου의 번역
  chosen_reading: 문맥상 출처를 나타내는 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 본문은 고대 유대 문헌의 그리스어 본문으로, 신약의 직접 인용 맥락이 아니므로 본문 내부의 존칭 표현을 ‘주님’으로 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: translation policy
