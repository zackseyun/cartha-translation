source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *ἤμην λυπούμενος²⁴ *ὑπὲρ γένους τῶν υἱῶν τῶν²⁵ ἀνθρώπων, καὶ²⁶ ηὐξάμην *τῷ Κυρίῳ²⁷ ὅπως σωθῶ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/004.yaml
  text: And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved.
translation:
  language: ko
  text: 그리고 저는 인간의 씨족을 두고 슬퍼하고 있었으며, 구원받기 위하여 주님께 기도드렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην λυπούμενος
  english_pob_choice: I was grieved
  chosen_korean: 슬퍼하고 있었습니다
  alternatives_korean:
  - 근심하고 있었습니다
  - 근심하며 있었습니다
  lexicon: λυπέω
  rationale: 과거 진행형의 상태를 살리면서, 내면의 고통을 자연스러운 현대 한국어로 옮기기 위해 ‘슬퍼하고 있었습니다’를 택했습니다.
- source_word: ὑπὲρ γένους τῶν υἱῶν τῶν ἀνθρώπων
  english_pob_choice: over the race of the sons of men
  chosen_korean: 인간의 씨족을 두고
  alternatives_korean:
  - 사람들의 족속을 두고
  - 인간의 نسل을 두고
  - 사람의 자손의 족속을 두고
  lexicon: γένος
  rationale: γένους는 단순한 ‘인류’보다 혈통·종족의 뉘앙스가 있어, 직역에 가까운 ‘씨족’으로 옮겨 원문의 집단적·계보적 감각을 살렸습니다.
- source_word: τῷ Κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주께서
  lexicon: κύριος
  rationale: 기도의 대상인 κύριος는 이 문맥에서 하나님을 가리키므로, 한국어 기도 문맥에 자연스러운 ‘주님께’를 사용했습니다.
- source_word: σωθῶ
  english_pob_choice: I might be saved
  chosen_korean: 구원받기 위하여
  alternatives_korean:
  - 구원되기 위하여
  - 구원을 받기 위하여
  - 구원받도록
  lexicon: σῴζω
  rationale: aorist subjunctive의 목적절 의미를 반영해 ‘~하기 위하여’로 풀었고, 수동적 구원 의미를 분명히 하기 위해 ‘구원받기’로 옮겼습니다.
theological_decisions:
- issue: γενους τῶν υἱῶν τῶν ἀνθρώπων의 계보적/인류적 뉘앙스
  chosen_reading: ‘인간의 씨족’으로 옮겨, 단순한 추상적 ‘인류’보다 혈통적·집단적 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘인류’
  - ‘사람의 자손들’
  rationale: 본문은 인간 일반을 말하면서도 γένος를 사용해 계보와 소속의 감각을 남기므로, 너무 평평한 번역은 원문의 색채를 약화시킵니다.
  doctrine_reference: source semantics
