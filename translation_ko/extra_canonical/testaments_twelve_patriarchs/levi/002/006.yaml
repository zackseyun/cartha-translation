  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/006.yaml
  text: And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi, enter.”
translation:
  language: ko
  text: 그런데 보십시오, 하늘들이 열렸고 주님의 천사가 저에게 말했습니다. "레위야, 레위야, 들어오너라."[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  english_pob_choice: the heavens were opened
  chosen_korean: 하늘들이 열렸고
  alternatives_korean:
  - 하늘이 열렸고
  - 하늘이 열렸습니다
  lexicon: οὐρανοί
  rationale: 원문은 복수형이므로 단수화하지 않고 ‘하늘들’로 살렸습니다. 한국어에서는 자연성을 위해 복수 표지를 그대로 드러내되, 문맥상 계시적 사건의 장엄함을 유지했습니다.
- source_word: ἄγγελος Κυρίου
  english_pob_choice: an angel of the Lord
  chosen_korean: 주님의 천사가
  alternatives_korean:
  - 주님의 사자가
  - 야훼의 천사가
  lexicon: ἄγγελος / κύριος
  rationale: 여기서는 천상 존재를 뜻하는 ἄγγελος를 ‘천사’로 옮기고, κύριος는 본문이 직접 인용하는 야훼 표지라기보다 일반적 서술용이므로 ‘주님’으로 처리했습니다.
- source_word: Λευί, Λευί
  english_pob_choice: Levi, Levi
  chosen_korean: 레위야, 레위야
  alternatives_korean:
  - 레위, 레위
  - 레위야, 레위
  lexicon: 고유명사
  rationale: 호명형을 한국어에서 자연스럽게 드러내기 위해 vocative 뉘앙스를 담아 ‘레위야’로 옮겼습니다. 반복 호소의 긴박함도 살립니다.
- source_word: εἴσελθε
  english_pob_choice: enter
  chosen_korean: 들어오너라
  alternatives_korean:
  - 들어가십시오
  - 들어오십시오
  lexicon: εἴσελθε
  rationale: 명령형이지만 환상 속 천사의 직접 발화이므로, 고전적 명령조보다 현대 한국어에서 자연스러운 초대·명령의 결을 살린 ‘들어오너라’를 택했습니다.
theological_decisions:
- issue: 천사 발화의 문체와 직설성
  chosen_reading: 천사의 직접 명령을 비교적 간결하고 즉각적인 반말형으로 유지했습니다.
  alternative_readings:
  - 들어오십시오처럼 격식체로 완화
  - 들어가십시오처럼 더 공손하게 조정
  rationale: 원문의 짧고 긴급한 음성은 환상 서사의 생동감을 만듭니다. 한국어에서는 천사의 호명과 명령이 인물에게 직접 닿는 느낌을 살리기 위해 문체를 낮췄습니다.
  doctrine_reference: 서사/담화 재현
- issue: ‘주님의 천사’의 신학적 지시성
  chosen_reading: κύριος는 본문 표면대로 ‘주님’으로 두어, 이 절 자체만으로 야훼 명시 인용을 주장하지 않았습니다.
  alternative_readings:
  - 야훼의 천사
  - 주님의 사자
  rationale: 이 절은 단순한 천상 사자의 등장 서술이므로, 별도 근거 없이 더 강한 구약적 신현 표현으로 확정하지 않았습니다.
  doctrine_reference: 본문 문맥 보존
