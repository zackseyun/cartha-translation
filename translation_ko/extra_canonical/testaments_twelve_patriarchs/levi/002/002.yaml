  text: And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor.
translation:
  language: ko
  text: 그런데 저는 아직 젊어서, 나이가 거의 스무 살쯤 되었고, 그때 시므온과 함께 우리 누이 디나를 위해 함몰에게 복수하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεώτερος
  english_pob_choice: still young
  chosen_korean: 아직 젊어서
  alternatives_korean:
  - 아직 어렸어서
  - 젊은 편이어서
  lexicon: νεώτερος
  rationale: 연령의 상대적 젊음을 자연스러운 한국어로 살리되, 단순한 소년기보다 ‘아직 젊다’는 뉘앙스를 유지했습니다.
- source_word: ὡς ἐτῶν εἴκοσι
  english_pob_choice: about twenty years old
  chosen_korean: 나이가 거의 스무 살쯤 되었고
  alternatives_korean:
  - 약 스무 살이었고
  - 대략 스무 살이었고
  lexicon: ὡς + ἐτῶν εἴκοσι
  rationale: ὡς가 주는 근사치를 반영하여 ‘거의…쯤’으로 완화된 추정을 담았습니다.
- source_word: ἐποίησα τὴν ἐκδίκησιν
  english_pob_choice: carried out vengeance
  chosen_korean: 복수하였습니다
  alternatives_korean:
  - 원수를 갚았습니다
  - 보복하였습니다
  lexicon: ἐκδίκησις / ἐκδικέω
  rationale: 행위 자체의 보복/복수 의미를 직역에 가깝게 유지하면서도 한국어에서 자연스러운 동사를 선택했습니다.
- source_word: ἀπὸ Ἐμμώρ
  english_pob_choice: against Hamor
  chosen_korean: 함몰에게
  alternatives_korean:
  - 함몰에 대하여
  - 함몰을 향하여
  lexicon: ἀπό + 인명
  rationale: 본문의 목적어적 대상을 한국어 서술에서 자연스럽게 ‘~에게’로 옮겼습니다. 고유명사는 원문 음역 관례에 따라 함몰로 처리했습니다.
theological_decisions:
- issue: 시므온과의 공동행위 표현
  chosen_reading: 시므온과 함께
  alternative_readings:
  - 시므온과 더불어
  - 시므온과
  rationale: 원문의 μετά Συμεών은 단순 동반/공동 참여를 나타내므로, 행위의 연대를 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 서사적 공동행동의 명시
