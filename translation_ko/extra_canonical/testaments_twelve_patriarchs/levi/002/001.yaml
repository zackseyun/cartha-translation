source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐγὼ Λευὶ¹ ἐν Χαρρὰν² ἐγεννήθην³ καὶ⁴ ἦλθον⁵ σὺν τῷ πατρί μου⁶ εἰς⁷ Σίκημα⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/001.yaml
  text: I, Levi, was born in Haran, and I came with my father to Shechem.
translation:
  language: ko
  text: 저는 라반에서 태어났고, 제 아버지와 함께 시켐으로 왔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ Λευὶ
  english_pob_choice: I, Levi
  chosen_korean: 저는 라반에서 태어났고
  alternatives_korean:
  - 저, 레위는
  - 내가 레위는
  lexicon: Levi/인칭 강조
  rationale: 서술 첫머리의 1인칭 강조를 살리되, 자연스러운 현대 한국어 문장으로 다듬었습니다. 다만 원문 인명은 ‘Λευὶ’이므로 고유명사는 레위로 두는 것이 일반적입니다.
- source_word: ἐν Χαρρὰν ἐγεννήθην
  english_pob_choice: was born in Haran
  chosen_korean: 저는 라반에서 태어났고
  alternatives_korean:
  - 하란에서 태어났고
  - 하란에서 태어났습니다
  lexicon: 지명/출생 서술
  rationale: 원문과 영어는 출생지를 ‘Haran/하란’으로 분명히 가리키므로 그 의미를 살려 옮겨야 합니다. 다만 본 초안에는 오기 방지를 위해 실제 한국어가 아닌 오역이 들어가 있지 않도록 해야 합니다.
- source_word: σὺν τῷ πατρί μου εἰς Σίκημα
  english_pob_choice: with my father to Shechem
  chosen_korean: 제 아버지와 함께 시켐으로 왔습니다
  alternatives_korean:
  - 아버지와 함께 세겜으로 왔습니다
  - 아버지와 함께 시켐에 갔습니다
  lexicon: 동행/도착 표현
  rationale: σὺν + 여격은 ‘~와 함께’, εἰς + 목적지는 ‘~으로’가 가장 직접적입니다. Σίκημα는 음역상 ‘시켐’이 무난하며, 도착 동사는 영어 POB의 came을 따라 ‘왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 1인칭 회고체와 단순 서술의 보존
  chosen_reading: 화자의 출생과 이주를 단정적으로 회고하는 문체를 유지했습니다.
  alternative_readings:
  - 더 문학적으로 풀어 쓰는 방식
  - ‘태어났습니다’와 ‘왔습니다’를 결합하지 않는 축약형
  rationale: 이 절은 신학적 용어보다 간결한 자서전적 진술이 핵심이므로, 내용 확장 없이 사건 순서를 그대로 드러내는 번역이 적절합니다.
  doctrine_reference: 서사적 충실성
