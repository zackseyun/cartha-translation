id: T12P.LEV.13.1
reference: Testament of Levi 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *νῦν, τέκνα μου¹, ἐντέλλομαι ὑμῖν, φοβεῖσθε² *Κύριον τὸν Θεὸν ὑμῶν³ Γἐξ ὅλης τῆς καρδίας ὑμῶν⁴⁾, καὶ πορεύεσθε ἐν ἁπλότητι⁵ *κατὰ πάντα τὸν νόμον αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/001.yaml
  text: 'And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity in accordance with all his law.'
translation:
  language: ko
  text: 이제, 내 자녀들아, 내가 너희에게 명합니다. 온 마음을 다해 주 너희 하나님을 두려워하고, 그분의 모든 율법에 따라 순전하게 살아가십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자녀들이여
  lexicon: τέκνα
  rationale: 직접 호칭으로서 친근하지만 권위 있는 부름을 살려 ‘자녀들아’로 옮겼고, 현대 문체에 맞게 ‘내’의 소유 관계를 분명히 했습니다.
- source_word: φοβεῖσθε Κύριον τὸν Θεὸν ὑμῶν
  english_pob_choice: fear the Lord your God
  chosen_korean: 너희의 하나님 주를 두려워하고
  alternatives_korean:
  - 주 너희 하나님을 경외하고
  - 너희 하나님 주님을 경외하고
  lexicon: φοβέομαι / Κύριος / Θεός
  rationale: 명령형의 강도를 살리되 단순한 감정 공포가 아니라 언약적 경외를 담는 표현으로 ‘두려워하다’를 유지했습니다. κύριος는 예수를 가리키는 문맥이 아니므로 ‘주’로, Θεός는 ‘하나님’으로 옮겼습니다.
- source_word: ἐν ἁπλότητι
  english_pob_choice: in simplicity
  chosen_korean: 단순함 가운데
  alternatives_korean:
  - 순전함 가운데
  - 진실함 가운데
  - 성실함 가운데
  lexicon: ἁπλότης
  rationale: ἁπλότης의 핵심인 분별 없는 단일성·소박함을 드러내기 위해 ‘단순함’으로 직역하고, 한국어 자연성을 위해 ‘가운데’를 보탰습니다.
- source_word: κατὰ πάντα τὸν νόμον αὐτοῦ
  english_pob_choice: in accordance with all his law
  chosen_korean: 그분의 모든 율법에 따라
  alternatives_korean:
  - 그분의 모든 법에 따라
  - 그분의 모든 율례에 따라
  lexicon: νόμος
  rationale: 문맥상 일반 법이 아니라 신적 규범 전체를 가리키므로 POB 기본값에 따라 ‘율법’을 유지했습니다. 전치사구는 원문의 의미에 맞게 ‘에 따라’로 자연화했습니다.
theological_decisions:
- issue: ‘fear the Lord’의 정서적 뉘앙스
  chosen_reading: 공포가 아니라 언약적 경외를 요구하는 명령으로 읽고, 한국어에서는 ‘두려워하고’로 직역하되 전체 문맥이 경외를 뜻함을 유지했습니다.
  alternative_readings:
  - ‘경외하고’로 완화 번역
  - ‘두려워하며’로 더 강하게 번역
  rationale: 원문 φοβεῖσθε는 실제로 두려움을 포함할 수 있으나, 성경적 용례에서 하나님에 대한 올바른 반응은 경외이므로 지나치게 심리화하지 않되 의미를 보존했습니다.
  doctrine_reference: 신 6:13; 잠 1:7
