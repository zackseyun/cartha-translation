  to: 이제, 내 자녀들아, 내가 너희에게 명합니다. 온 마음을 다해 주 너희 하나님을 두려워하고, 그분의 모든 율법에 따라 순전하게 살아가십시오.
  rationale: 호칭의 한국어 어순을 바로잡고, ἁπλότης 및 ‘walk’의 비유적 용법을 자연스러운 현대 한국어로 다듬었습니다. 하나님의 두려움, 율법, 포괄성(‘모든’) 등 원문의 의미 범위는 변경하지 않았습니다.
