  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διδάξατε δὲ καὶ ὑμεῖς⁷ τὰ τέκνα ὑμῶν γράμματα⁸ ἵνα ἔχωσι⁹ σύνεσιν ἐν *πάσῃ τῇ ζωῇ αὐτῶν¹⁰, ἀναγινώσκοντες¹¹ ἀδιαλείπτως¹² τὸν νόμον τοῦ Θεοῦ¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/002.yaml
  text: And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing.
translation:
  language: ko
  text: 그리고 너희도 자녀들에게 글을 가르치십시오. 그러면 그들이 평생 동안 분별력을 가지게 될 것이며, 하나님의 율법을 끊임없이 읽을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διδάξατε ... τὰ τέκνα ὑμῶν γράμματα
  english_pob_choice: teach your children letters
  chosen_korean: 자녀들에게 글을 가르치십시오
  alternatives_korean:
  - 자녀들에게 글자를 가르치십시오
  - 자녀들에게 문자를 가르치십시오
  lexicon: διδάσκω / γράμματα
  rationale: γράμματα는 단순한 ‘문자’보다 읽고 배우는 기초 학습, 곧 문자 교육을 가리키므로 한국어에서는 자연스럽게 ‘글을 가르치다’로 옮겼습니다.
- source_word: σύνεσιν
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해
  - 깨달음
  - 총명함
  lexicon: σύνεσις
  rationale: σύνεσις는 단순 지식보다 사태를 알아차리고 판단하는 능력을 뜻하므로, 문맥상 ‘분별력’이 가장 잘 맞습니다.
- source_word: ἀναγινώσκοντες ἀδιαλείπτως
  english_pob_choice: reading ... without ceasing
  chosen_korean: 끊임없이 읽을 것입니다
  alternatives_korean:
  - 쉬지 않고 읽을 것입니다
  - 계속 읽을 것입니다
  lexicon: ἀναγινώσκω / ἀδιαλείπτως
  rationale: 현재분사와 부사구가 습관적 지속을 나타내므로, 한국어에서는 자연스럽게 ‘끊임없이 읽을 것입니다’로 정리했습니다.
- source_word: τὸν νόμον τοῦ Θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 규범
  lexicon: νόμος / Θεός
  rationale: νόμος는 본문에서 토라적 의미의 ‘율법’이 가장 적절하며, Θεός는 통상적 POB 용례에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: 지속적 습득과 실천의 연결
  chosen_reading: 문자 교육과 평생의 분별력, 그리고 하나님의 율법을 끊임없이 읽는 행위가 한 흐름으로 연결되도록 옮겼습니다.
  alternative_readings:
  - ‘이해를 가지게 될 것이며’처럼 더 일반적인 지적 능력으로만 좁히는 번역
  - ‘끊임없이’ 대신 단순 반복으로 약화하는 번역
  rationale: 본문은 교육 목적을 ‘평생의 분별력’과 ‘율법의 지속적 독서’에 직접 연결하므로, 그 인과 구조를 보존하는 것이 중요합니다.
  doctrine_reference: 유대적 경건 교육과 율법 독서의 형성 기능
