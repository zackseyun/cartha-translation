  to: 너희도 자녀들에게 글을 가르쳐, 그들이 하나님의 율법을 끊임없이 읽으며 평생토록 이해력을 갖도록 하십시오.
  rationale: 명령문과 그 목적을 ‘가르쳐 … 갖도록 하십시오’로 보존하고, 현재분사 ‘읽으며’로 지속적인 율법 읽기가 이해력의 형성과 연결됨을 나타냈습니다. ‘평생토록’은 ἐν πάσῃ τῇ ζωῇ αὐτῶν을 자연스럽게 반영합니다.
