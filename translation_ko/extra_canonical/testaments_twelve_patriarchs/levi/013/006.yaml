  terminology: ‘영혼’, ‘좋은 것’, ‘악한 것’, ‘혼란과 고난’은 본문의 포괄성과 윤리적 농경 비유를 잘 유지합니다. 특정 교리적 의미를 덧붙이지 않습니다.
