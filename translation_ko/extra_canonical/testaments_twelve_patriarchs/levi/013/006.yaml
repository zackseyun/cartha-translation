id: T12P.LEV.13.6
reference: Testament of Levi 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ σπείρατε²⁷ ἐν *ταῖς ψυχαῖς²⁸ ὑμῶν²⁹ ἀγαθὰ *καὶ εὑρήσετε³⁰ αὐτὰ³¹ *ἐν τῇ ζωῇ ὑμῶν³². *Ἐὰν δὲ σπείρητε πονηρὰ³³ *πᾶσαν ταραχὴν καὶ θλίψιν θερίσετε³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/006.yaml
  text: And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction.
translation:
  language: ko
  text: 그리고 여러분의 영혼에 좋은 것을 뿌리십시오. 그러면 여러분의 삶에서 그것을 찾게 될 것입니다. 그러나 악한 것을 뿌리면, 온갖 혼란과 고난을 거두게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ψυχαῖς ὑμῶν
  english_pob_choice: in your souls
  chosen_korean: 여러분의 영혼에
  alternatives_korean:
  - 여러분의 혼에
  - 여러분의 삶의 깊은 곳에
  lexicon: ψυχή
  rationale: ψυχή는 여기서 인간의 내적 존재를 가리키므로, 직역에 가깝게 ‘영혼’으로 옮기되 자연스러운 조사로 연결했습니다.
- source_word: ἀγαθὰ
  english_pob_choice: good things
  chosen_korean: 좋은 것
  alternatives_korean:
  - 선한 것
  - 좋은 일
  lexicon: ἀγαθός
  rationale: 명사적으로 쓰인 ἀγαθά를 한국어에서도 포괄적으로 ‘좋은 것’으로 옮겨, 행위만이 아니라 내적 심성과 삶의 열매까지 담을 수 있게 했습니다.
- source_word: ἐν τῇ ζωῇ ὑμῶν
  english_pob_choice: in your life
  chosen_korean: 여러분의 삶에서
  alternatives_korean:
  - 여러분의 생애에서
  - 여러분의 삶 안에서
  lexicon: ζωή
  rationale: ζωή의 삶 전체라는 뉘앙스를 살려, 결과가 실제 삶의 영역에서 드러난다는 점을 자연스럽게 표현했습니다.
- source_word: ταραχὴν καὶ θλίψιν
  english_pob_choice: every turmoil and affliction
  chosen_korean: 온갖 혼란과 고난
  alternatives_korean:
  - 모든 소동과 환난
  - 온갖 동요와 고난
  lexicon: ταραχή, θλῖψις
  rationale: ταραχή는 내적·외적 ‘혼란’의 넓은 의미가 있고, θλῖψις는 압박과 고난의 결합된 의미이므로, POB의 포괄적 표현을 살리면서도 한국어로 자연스럽게 전달했습니다.
theological_decisions:
- issue: ‘좋은 것/악한 것’을 뿌리고 거두는 도덕적-농경적 비유
  chosen_reading: 도덕적 행위와 그 결과를 심는 농경 은유로 그대로 유지했습니다.
  alternative_readings:
  - 추상화하여 ‘선행/악행’으로 좁혀 옮기기
  - 교훈적으로 풀어 써서 의미를 설명하기
  rationale: 본문은 내적 상태(영혼)와 삶 전체의 결과를 연결하는 경고이므로, 비유를 해설로 바꾸지 않고 원문의 힘을 보존하는 것이 적절합니다.
  doctrine_reference: 윤리적 인과와 비유적 교훈을 직접 전달하는 지혜문학적 표현
