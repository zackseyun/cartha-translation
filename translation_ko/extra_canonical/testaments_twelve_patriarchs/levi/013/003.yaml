base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/003.yaml
  text: For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes.
translation:
  language: ko
  text: 왜냐하면 주님의 율법을 알게 되는 모든 사람은 존중받을 것이며, 그가 어디로 가든지 낯선 이가 되지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσεται νόμον Κυρίου
  english_pob_choice: comes to know the law of the Lord
  chosen_korean: 주님의 율법을 깨닫게 되는
  alternatives_korean:
  - 주님의 율법을 알게 되는
  - 주님의 율법을 배우게 되는
  lexicon: γινώσκω / νόμος / κύριος
  rationale: 단순한 지식 습득보다 관계적·실질적 인식을 드러내기 위해 ‘깨닫게 되는’을 택했고, νόμον Κυρίου는 POB 기본어휘에 맞춰 ‘주님의 율법’으로 옮겼습니다.
- source_word: τιμηθήσεται
  english_pob_choice: will be honored
  chosen_korean: 존귀하게 될 것이며
  alternatives_korean:
  - 존중받을 것이며
  - 영예를 얻게 될 것이며
  lexicon: τιμάω
  rationale: 수동태의 결과를 한국어에서 자연스럽게 살리면서도 단순한 사회적 예우보다 더 강한 ‘존귀’의 의미를 보존했습니다.
- source_word: ξένος
  english_pob_choice: a stranger
  chosen_korean: 낯선 사람이
  alternatives_korean:
  - 외국인이
  - 이방인이
  lexicon: ξένος
  rationale: 문맥상 ‘손님’이나 ‘나그네’보다 배척받는 타자성을 나타내는 ‘낯선 사람’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: ‘주님의 율법’의 신학적 뉘앙스
  chosen_reading: 토라/율법에 대한 단순 정보가 아니라, 주께 속한 삶의 질서를 아는 사람을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘주님의 법’으로 약화해 일반 규범처럼 읽는 것
  - ‘주의 율법’으로 더 전통적인 교회 용어를 쓰는 것
  rationale: 원문이 νόμον Κυρίου를 사용하므로, 전통적 관용구를 기계적으로 따르기보다 source-direct하게 ‘주님의 율법’을 유지하는 것이 문맥과 어휘 모두를 더 잘 보존합니다.
  doctrine_reference: 율법/토라 표지 유지
- issue: ‘그가 가는 곳마다 낯선 사람이 되지 않을 것입니다’의 공동체적 의미
  chosen_reading: 어디서든 배제되거나 소외되지 않는다는 약속으로 읽었습니다.
  alternative_readings:
  - 단순히 여행 중 신분상 외부인이 아니라는 의미로 축소하는 것
  - ‘타지에서 환대받는다’로 의미를 완화하는 것
  rationale: ξένος는 사회적·관계적 외부성을 포함하므로, ‘낯선 사람이 되지 않을 것입니다’로 배제 없음의 함의를 살렸습니다.
  doctrine_reference: 공동체 소속/환대
