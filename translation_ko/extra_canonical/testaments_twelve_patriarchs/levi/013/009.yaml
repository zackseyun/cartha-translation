id: T12P.LEV.13.9
reference: Testament of Levi 13:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶς ὃς ἂν διδάσκει καλὰ καὶ πράττει⁶⁰ σύνθρονος ἔσται⁶¹ βασιλέων⁶², ὥσπερ⁶³ καὶ Ἰωσὴφ ὁ ἀδελφός⁶⁴ μου⁶⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/009.yaml
  text: Everyone who teaches good things and does them will be enthroned with kings, just as Joseph my brother also was.
translation:
  language: ko
  text: 무릇 선한 것을 가르치고 그것을 행하는 사람은 왕들과 함께 높임을 받게 될 것이니, 요셉 내 형제도 그와 같았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὃς ἂν
  english_pob_choice: Everyone who
  chosen_korean: 무릇 … 사람은
  alternatives_korean:
  - 누구든지 … 하는 사람은
  - 모든 사람은
  lexicon: Πᾶς
  rationale: 보편성을 살리되, 한국어 문맥상 조건절을 자연스럽게 묶기 위해 ‘무릇 … 사람은’을 택했습니다.
- source_word: διδάσκει καλὰ καὶ πράττει
  english_pob_choice: teaches good things and does them
  chosen_korean: 선한 것을 가르치고 그것을 행하는
  alternatives_korean:
  - 좋은 것들을 가르치고 실천하는
  - 선한 일들을 가르치고 행하는
  lexicon: διδάσκει / καλὰ / πράττει
  rationale: καλά를 추상적 ‘선한 것’으로 옮겨 가르침과 행함의 짝을 그대로 드러냈습니다.
- source_word: σύνθρονος ἔσται βασιλέων
  english_pob_choice: will be enthroned with kings
  chosen_korean: 왕들과 함께 높임을 받게 될 것이니
  alternatives_korean:
  - 왕들과 함께 옥좌에 앉게 될 것이니
  - 왕들과 함께 보좌에 오르게 될 것이니
  lexicon: σύνθρονος
  rationale: POB의 수정 방향인 ‘enthroned with kings’를 살리면서, 한국어에서는 왕들과의 공동 존귀를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: Ἰωσὴφ ὁ ἀδελφός μου
  english_pob_choice: Joseph my brother
  chosen_korean: 요셉 내 형제
  alternatives_korean:
  - 내 형제 요셉
  - 내 동생 요셉
  lexicon: Ἰωσὴφ / ἀδελφός
  rationale: 원문의 호칭 구조를 유지해 요셉이 ‘내 형제’로 제시되는 점을 분명히 했습니다.
theological_decisions:
- issue: σύνθρονος의 왕들과의 관계를 어떻게 드러낼지
  chosen_reading: 개인적 성공담이 아니라 왕들과 함께 받는 공동의 존귀로 이해해 ‘왕들과 함께 높임을 받게 될 것이니’로 번역했습니다.
  alternative_readings:
  - 왕들과 함께 앉게 될 것이니
  - 왕들과 같은 자리에 놓이게 될 것이니
  rationale: 문맥상 단순한 좌석 묘사보다 공동 통치/존귀의 함의가 더 강하므로, 그 의미를 훼손하지 않는 범위에서 존중어로 표현했습니다.
  doctrine_reference: 지혜/의인 보상 모티프
- issue: 요셉 언급의 기능
  chosen_reading: 요셉은 예시 인물로 제시되어, 선을 가르치고 행하는 자의 상급을 보여 줍니다.
  alternative_readings:
  - 요셉은 단순한 비교 대상으로만 기능한다
  - 요셉은 메시아적 예표로 기능한다
  rationale: 본문이 직접 요구하는 수준을 넘지 않도록 예시 기능만 명시했습니다.
  doctrine_reference: 모범적 예시와 보상
