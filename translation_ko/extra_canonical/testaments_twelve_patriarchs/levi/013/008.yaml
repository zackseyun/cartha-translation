id: T12P.LEV.13.8
reference: Testament of Levi 13:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ⸀Ἐὰν γάρ τις φυλάξῃ αὐτὸν ἐκ τῶν πονηρῶν τούτων ἔργων⸀⁵¹ τότε⁵² γενήσεται⁵³ αὐτῷ σοφία⁵⁴ καὶ *παρὰ τοῖς πολεμίοις λαμπρὰ⁵⁵ καὶ ἐπὶ⁵⁶ γῆς ἀλλοτρίας⁵⁷ πατρίς, καὶ ἐν μέσῳ⁵⁸ ἐχθρῶν εὑρηθήσεται⁵⁹ φίλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/008.yaml
  text: For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend.
translation:
  language: ko
  text: 그러므로 누구든지 이런 악한 일들을 멀리 지키면, 지혜가 그에게 적들 가운데서도 빛나고, 낯선 땅에서는 고향이 되며, 원수들 한가운데에서는 친구로 드러날 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃ αὐτὸν ἐκ τῶν πονηρῶν τούτων ἔργων
  english_pob_choice: keeps himself from these evil works
  chosen_korean: 이런 악한 일들을 멀리 지키면
  alternatives_korean:
  - 이런 악한 일들로부터 자신을 지키면
  - 이런 악한 일들을 삼가면
  lexicon: φυλάσσω
  rationale: 동사의 핵심인 ‘지키다/보호하다’와 분리·회피의 방향을 함께 살리되, 문맥상 자기 몸가짐을 지킨다는 뜻이 드러나도록 옮겼습니다.
- source_word: γενήσεται αὐτῷ σοφία
  english_pob_choice: wisdom will become for him
  chosen_korean: 지혜가 그에게
  alternatives_korean:
  - 지혜가 그에게 있게 되고
  - 지혜가 그에게 생겨나고
  lexicon: γίνομαι + dative
  rationale: 직역의 어색함을 줄이면서도 ‘지혜가 그에게 주어지는/그의 몫이 되는’ 흐름을 자연스럽게 표현했습니다.
- source_word: παρὰ τοῖς πολεμίοις λαμπρὰ
  english_pob_choice: splendid even among enemies
  chosen_korean: 적들 가운데서도 빛나고
  alternatives_korean:
  - 적들 가운데서도 찬란하고
  - 원수들 사이에서도 빛나고
  lexicon: λαμπρός
  rationale: ‘splendid’의 밝고 돋보이는 이미지를 한국어에서 가장 직접적으로 전달하는 ‘빛나다’를 택했습니다.
- source_word: ἐπὶ γῆς ἀλλοτρίας πατρίς
  english_pob_choice: in a foreign land a homeland
  chosen_korean: 낯선 땅에서는 고향이 되며
  alternatives_korean:
  - 타국에서는 고향이 되며
  - 이방의 땅에서는 조국이 되며
  lexicon: πατρίς
  rationale: πατρίς의 핵심인 ‘고향/조국’ 중, 본문 대비 구조를 살려 ‘낯선 땅’과 대응되는 ‘고향’으로 옮겼습니다.
- source_word: ἐν μέσῳ ἐχθρῶν εὑρηθήσεται φίλος
  english_pob_choice: in the midst of foes he will be found a friend
  chosen_korean: 원수들 한가운데에서는 친구로 드러날 것입니다
  alternatives_korean:
  - 원수들 가운데서는 친구로 발견될 것입니다
  - 원수들 한가운데서 친구로 여겨질 것입니다
  lexicon: εὑρίσκω + φίλος
  rationale: ‘found’의 수동적 발견과 결과 상태를 모두 살리면서, 한국어에서 자연스러운 종결로 ‘드러나다’를 사용했습니다.
theological_decisions:
- issue: 지혜와 장소-관계적 역설의 표현
  chosen_reading: 지혜가 적들 가운데서도 빛나고, 낯선 땅에서는 고향이 되며, 원수들 한가운데에서는 친구로 드러납니다.
  alternative_readings:
  - 지혜가 적들 가운데서도 찬란하고...
  - 지혜가 그에게 현명함이 되고...
  rationale: 본문의 대구법은 단순한 정보 전달보다 신앙적 역설을 강조하므로, 한국어에서도 ‘빛남/고향/친구’의 이미지가 선명하게 보이도록 유지했습니다.
  doctrine_reference: 문학적-신학적 수사 보존
- issue: 문두 연결어 처리
  chosen_reading: 그러므로
  alternative_readings:
  - 만일
  - 만약
  rationale: 본문 첫머리의 조건절이 앞선 권면의 귀결을 받는 구조이므로, 한국어에서 자연스러운 추론 연결어로 맺었습니다.
  doctrine_reference: 담화 구조 보존
