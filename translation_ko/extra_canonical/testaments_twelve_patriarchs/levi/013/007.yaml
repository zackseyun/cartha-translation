revisions:
- from: 지혜를 하나님의 두려움 안에서 얻으십시오. 왜냐하면 포로 됨이 오고 도시들과 땅들이 파괴되며 금과 은과 모든 소유가 사라져도, 지혜로운 사람의 지혜는 아무도 빼앗을 수 없기 때문입니다. 다만 경건하지 않음의 눈먼 상태와 죄의 완고함은 예외입니다.[a][b]
  to: 하나님을 경외하는 가운데 지혜를 얻으십시오. 포로가 되는 일이 생기고 성읍들과 땅들이 멸망하며 금과 은과 모든 소유가 사라진다 해도, 불경건의 눈멂과 죄의 완고함 외에는 아무도 지혜로운 이의 지혜를 빼앗을 수 없기 때문입니다.
  rationale: 하나님께 대한 φόβος의 의미를 한국어에서 명확히 하고, εἰ μὴ 예외절을 본문의 부정문에 직접 연결했습니다. 조건절의 재난과 재산 상실의 열거, 그리고 지혜를 빼앗을 수 없다는 진술을 유지했습니다.
