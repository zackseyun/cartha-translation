id: T12P.LEV.13.7
reference: Testament of Levi 13:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Σοφίαν κτήσασθε³⁵ *ἐν φόβῳ³⁶ Θεοῦ³⁷, ὅτι³⁸ ἐὰν *γένηται αἰχμαλωσία, καὶ ὀλοθρευθῶσι πόλεις καὶ χῶραι³⁹ *καὶ χρυσὸς καὶ ἄργυρος καὶ πᾶσα⁴⁰ κτῆσις⁴¹ ἀπολεῖται⁴², *τοῦ σοφοῦ τὴν σοφίαν⁴³ †οὐδεὶς⁴⁴ δύναται⁴⁵ ἀφελέσθαι⁴⁶ εἰ μὴ τύφλωσις⁴⁷ ἀσεβείας⁴⁸ καὶ πώρωσις⁴⁹ ἁμαρτίας⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/007.yaml
  text: Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perish, no one can take away the wise man's wisdom, except the blindness of ungodliness and the hardening of sin.
translation:
  language: ko
  text: 하나님을 경외하는 가운데 지혜를 얻으십시오. 포로가 되는 일이 생기고 성읍들과 땅들이 멸망하며 금과 은과 모든 소유가 사라진다 해도, 불경건의 눈멂과 죄의 완고함 외에는 아무도 지혜로운 이의 지혜를 빼앗을 수 없기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοφίαν κτήσασθε
  english_pob_choice: Acquire wisdom
  chosen_korean: 지혜를 … 얻으십시오
  alternatives_korean:
  - 지혜를 획득하십시오
  - 지혜를 사십시오
  lexicon: κτάομαι
  rationale: κτήσασθε는 단순 소유가 아니라 ‘얻다/취득하다’의 뉘앙스를 가지므로, 현대 합쇼체에서 가장 자연스럽고 직접적인 ‘얻으십시오’를 택했습니다.
- source_word: ἐν φόβῳ Θεοῦ
  english_pob_choice: in the fear of God
  chosen_korean: 하나님의 두려움 안에서
  alternatives_korean:
  - 하나님을 두려워하는 가운데
  - 하나님을 경외하는 가운데
  lexicon: φόβος
  rationale: POB의 ‘fear of God’을 직결해 ‘하나님의 두려움’으로 옮기되, 문맥상 경외의 의미도 포함되므로 ‘안에서’로 관계를 살렸습니다.
- source_word: αἰχμαλωσία / ἀπολεῖται
  english_pob_choice: captivity ... perish
  chosen_korean: 포로 됨 ... 사라져도
  alternatives_korean:
  - 포로 생활 ... 없어져도
  - 포로가 됨 ... 멸망해도
  lexicon: αἰχμαλωσία / ἀπόλλυμι
  rationale: αἰχμαλωσία는 ‘포로 됨’으로 상태를 살리고, ἀπολεῖται는 재산이 소멸하는 뜻이므로 ‘사라져도’가 가장 과도하지 않게 대응합니다.
- source_word: τύφλωσις ἀσεβείας καὶ πώρωσις ἁμαρτίας
  english_pob_choice: the blindness of ungodliness and the hardening of sin
  chosen_korean: 경건하지 않음의 눈먼 상태와 죄의 완고함
  alternatives_korean:
  - 불경건의 눈멂과 죄의 완악함
  - 경건 없음의 소경 됨과 죄의 굳어짐
  lexicon: τύφλωσις / πώρωσις / ἀσέβεια / ἁμαρτία
  rationale: τύφλωσις는 물리적 시각 상실보다 비유적 ‘눈먼 상태’가 적절하고, πώρωσις는 심리적·도덕적 경직을 나타내므로 ‘완고함’으로 풀었습니다.
theological_decisions:
- issue: φόβος Θεοῦ의 신학적 뉘앙스
  chosen_reading: ‘하나님의 두려움’으로 직역하되 경외의 의미를 내포하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘하나님을 경외함’
  - ‘하나님에 대한 경외’
  rationale: 이 구절은 지혜의 출발점을 단순한 감정이 아니라 하나님 앞의 두려움으로 제시하므로, 전통적 완화 표현보다 원문의 긴장을 살리는 것이 더 적절합니다.
  doctrine_reference: 잠언적 지혜 전통의 경외(φόβος) 개념
- issue: ‘빼앗을 수 없다’의 예외 조항
  chosen_reading: 지혜는 어떤 외적 손실로도 제거되지 않지만, 도덕적·영적 상태인 눈먼 상태와 완고함은 지혜를 무너뜨릴 수 있는 예외로 보았습니다.
  alternative_readings:
  - 예외 절을 단순한 양보로 처리
  - ‘오직’ 이하를 지혜를 빼앗는 수단으로만 읽음
  rationale: ὅτι ... οὐδεὶς δύναται ἀφελέσθαι 구조 뒤의 εἰ μὴ 절은 예외를 분명히 표시하므로, 지혜의 불가탈취성과 죄의 파괴력을 함께 보존해야 합니다.
  doctrine_reference: 지혜와 죄의 대조, 도덕적 상실 가능성
