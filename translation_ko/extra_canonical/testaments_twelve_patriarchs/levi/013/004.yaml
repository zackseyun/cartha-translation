id: T12P.LEV.13.4
reference: Testament of Levi 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται¹⁹ καὶ ἐπιθυμήσουσι πολλοὶ τῶν ἀνθρώπων δουλεῦσαι αὐτῷ²⁰ καὶ ἀκοῦσαι νόμου²¹ ἐκ τοῦ²² στόματος αὐτοῦ²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/004.yaml
  text: Indeed, he will gain many friends beyond his parents, and many among men will desire to serve him and to hear the law from his mouth.
translation:
  language: ko
  text: 참으로 그는 부모 외에도 많은 친구를 얻을 것이며, 많은 사람이 그를 섬기고 그의 입에서 율법을 듣기를 원할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται
  english_pob_choice: he will gain many friends beyond his parents
  chosen_korean: 부모보다 더 많은 친구를 얻을 것이며
  alternatives_korean:
  - 부모보다 많은 친구들을 얻을 것이며
  - 부모를 넘어 많은 친구를 얻게 될 것이며
  lexicon: κτάομαι / φίλος / γονεῖς
  rationale: ὑπέρ + 대격은 비교의 범위를 넘는다는 뜻이므로, 단순한 수량 비교보다 ‘부모보다 더 많은’으로 옮겨 비교 관계를 분명히 했습니다.
- source_word: δουλεῦσαι αὐτῷ
  english_pob_choice: to serve him
  chosen_korean: 그에게 종이 되고 싶어 하며
  alternatives_korean:
  - 그를 섬기고 싶어 하며
  - 그에게 봉사하고 싶어 하며
  lexicon: δουλεύω
  rationale: 동사 δουλεύω는 단순한 봉사보다 종속적 섬김을 강하게 띠므로, 본문의 강도를 살려 ‘종이 되고 싶어 하며’로 옮겼습니다.
- source_word: νόμου
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: νόμος
  rationale: 문맥상 일반 법이 아니라 전승된 하나님의 규범을 가리키므로, 기본 용례에 따라 ‘율법’을 사용했습니다.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  english_pob_choice: from his mouth
  chosen_korean: 그의 입에서
  alternatives_korean:
  - 그 입에서
  - 그의 말로부터
  lexicon: στόμα
  rationale: 말씀의 직접 전달을 나타내는 관용구이므로, 자연스러운 한국어로 ‘그의 입에서’라고 유지했습니다.
theological_decisions:
- issue: δουλεῦσαι αὐτῷ의 종속성 강도
  chosen_reading: 단순한 ‘섬기다’보다 사회적·의지적 종속을 드러내는 ‘종이 되고 싶어 하다’로 옮겼습니다.
  alternative_readings:
  - 그를 섬기고 싶어 하다
  - 그에게 봉사하고 싶어 하다
  rationale: 본문은 많은 사람이 그에게 매료되어 자발적으로 복속하려는 뉘앙스를 가지므로, 완화하지 않고 종속의 강도를 보존했습니다.
  doctrine_reference: 본문 내 인간적 추종과 권위의 묘사
