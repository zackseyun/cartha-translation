  source_fidelity: Ποιήσατε and δικαιοσύνην are conveyed accurately by “의를 행하십시오.” The final εὕρητε is marked with a dagger in the cited Greek edition, signaling textual uncertainty. In keeping with the supplied English audit trail’s contextual passive reading (“may be found”), Korean should retain that reading without presenting it as an unqualified active ‘find.’
  naturalness: The draft’s “그러면 … 발견될 것입니다” is understandable, but it turns the ἵνα purpose clause into a simple future-result statement. “그리하여 … 발견되도록” more directly expresses the intended relation while retaining modern formal-polite register. The unattached [a] marker must be removed.
  terminology: “의” and “의를 행하십시오” are established, natural formal Korean renderings for δικαιοσύνην and Ποιήσατε. “하늘” is appropriate for τοῖς οὐρανοῖς in idiomatic Korean; a note records that the Greek literally has a plural form.
  issues:
  - severity: medium
    issue: The ἵνα clause is rendered as a simple future consequence.
    rationale: “그러면 … 발견될 것입니다” weakens the source’s purpose/contemplated-result construction. A purposive connective better reflects ἵνα.
  - severity: medium
    issue: The draft contains a dangling footnote anchor, [a].
    rationale: No corresponding footnote text is supplied. Removing the unsupported marker resolves the structural anchor problem without affecting meaning.
  - severity: low
