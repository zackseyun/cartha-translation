  text: Therefore do righteousness, my children, on the earth, so that you may be found in the heavens.
translation:
  language: ko
  text: 그러므로 나의 자녀들아, 땅에서 의를 행하십시오. 그리하여 여러분이 하늘에서 발견되도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기서 “발견되다”로 이해되는 표현을 사용하지만, 해당 낱말에는 본문상의 불확실성을 나타내는 표지가 있습니다. “하늘”은 그리스어로는 복수형입니다.
    reason: Daggered εὕρητε의 본문 불확실성과, 영어 POB 감사 이력에서 채택한 문맥적 수동 이해를 투명하게 밝히며, 하늘의 복수형을 과도하게 본문에 반영하지 않도록 합니다.
lexical_decisions:
- source_word: Ποιήσατε
  english_pob_choice: do
  chosen_korean: 행하십시오
  alternatives_korean:
  - 하십시오
  - 실천하십시오
  - 행하시오
  lexicon: ποιέω
  rationale: 명령의 직접성을 살리면서 한국어에서 자연스러운 윤리적 실천 표현으로 옮겼습니다.
- source_word: δικαιοσύνην
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 의로운 삶
  - 정의
  lexicon: δικαιοσύνη
  rationale: 이 문맥에서는 추상적 도덕 개념보다 하나님 앞의 바른 행실을 가리키므로 표준적인 ‘의’를 유지했습니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: on the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 이 땅에서
  - 지상에서
  - 세상에서
  lexicon: γῆ
  rationale: 영어 개정본의 ‘on the earth’에 맞추되, 한국어에서는 위치 의미를 자연스럽게 드러내는 ‘땅에서’가 가장 직접적입니다.
- source_word: εὕρητε ἐν τοῖς οὐρανοῖς
  english_pob_choice: you may be found in the heavens
  chosen_korean: 하늘에서 발견될 것입니다
  alternatives_korean:
  - 하늘에서 발견되실 것입니다
  - 하늘에서 발견될 수 있습니다
  - 하늘에서 찾게 될 것입니다
  lexicon: εὑρίσκω
  rationale: 개정된 영어가 제시한 수동적 이해를 따라, ‘찾다’가 아니라 ‘발견되다’로 옮겨 주어 주어가 하나님 앞에서 판명되는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 명령형 뒤의 목적절이 단순한 보상 교환처럼 들릴 수 있는지
  chosen_reading: 땅에서의 의로운 행실과 하늘에서의 인정/발견이 연결된 권면으로 읽었습니다.
  alternative_readings:
  - 행위 공로를 강조하는 조건문
  - 단순한 장소 대비 표현
  rationale: 본문과 영어 전승 모두 윤리적 권면과 종말론적 확인을 함께 말하므로, 공로주의로 과도하게 좁히지 않고 본문의 권면성을 유지했습니다.
  doctrine_reference: 행위와 최종적 판명에 대한 경고/권면의 문맥
