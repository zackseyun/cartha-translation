  text: '*Καὶ εἶδον ἐν ὁράματι· μέσος ἐν ὑψηλοῖς ἵστατο πάσης τῆς συναγωγῆς²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/005.yaml
  text: And I saw in the vision that he stood in the midst of the congregation, in the heights.
translation:
  language: ko
  text: 그리고 나는 환상 가운데서 그가 온 회중 한가운데 높은 곳에 서 있는 것을 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ εἶδον ἐν ὁράματι
  english_pob_choice: And I saw in the vision
  chosen_korean: 그리고 내가 환상 가운데 보니
  alternatives_korean:
  - 그리고 내가 환상 중에 보니
  - 그리고 내가 환상 속에서 보니
  lexicon: ὅραμα
  rationale: ἐν ὁράματι는 ‘환상 가운데/중에’로 자연스럽게 옮겨, 시적·계시적 장면성을 살렸습니다.
- source_word: πάσης τῆς συναγωγῆς
  english_pob_choice: the congregation
  chosen_korean: 무리
  alternatives_korean:
  - 회중
  - 모임
  lexicon: συναγωγή
  rationale: 여기서는 유대교 예배당보다 ‘모여 있는 사람들’의 뜻이 강하므로, 문맥상 자연스러운 ‘무리’를 택했습니다.
- source_word: μέσος ἐν ὑψηλοῖς ἵστατο
  english_pob_choice: he stood in the midst ... in the heights
  chosen_korean: 한가운데, 높은 곳에 서 있었습니다
  alternatives_korean:
  - 한복판, 높은 곳에 서 있었습니다
  - 가운데, 높은 곳에 서 있었습니다
  lexicon: μέσος / ὑψηλοῖς / ἵστατο
  rationale: μέσος는 ‘한가운데’, ἐν ὑψηλοῖς는 누락되지 않도록 ‘높은 곳에’로 옮겨, 영어 POB가 복원한 ‘in the heights’를 반영했습니다.
theological_decisions:
- issue: ‘하늘의 높은 곳’인지 ‘높은 지위/장소’인지
  chosen_reading: 장소적 의미를 살려 ‘높은 곳’으로 번역했습니다.
  alternative_readings:
  - 하늘 높은 곳
  - 높은 데
  rationale: ὑψηλοῖς는 이 구절에서 추상적 지위보다 공간적 높이를 직접적으로 가리키는 표현으로 읽는 것이 가장 무난합니다.
  doctrine_reference: 계시 문학의 공간 이미지
- issue: συναγωγή의 번역 범위
  chosen_reading: 제도명보다 집합체 의미를 우선해 ‘무리’로 옮겼습니다.
  alternative_readings:
  - 회중
  - 회당
  rationale: 이 본문은 특정 건물이나 제도보다 환상 속 집합된 공동체를 묘사하므로, 과도한 교회론적 용어를 피했습니다.
  doctrine_reference: 본문 문맥상 공동체 묘사
