  to: 그리고 나는 환상 가운데서 그가 온 회중 한가운데 높은 곳에 서 있는 것을 보았습니다.
  rationale: πάσης를 ‘온’으로 반영하고 συναγωγή를 집합체 의미의 ‘회중’으로 옮겼습니다. ἐν ὑψηλοῖς의 공간적 표현인 ‘높은 곳에’를 보존했으며, 원문에 없는 높임법과 미제공 각주 앵커는 제거했습니다.
