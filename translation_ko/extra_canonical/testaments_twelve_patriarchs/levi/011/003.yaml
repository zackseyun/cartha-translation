lexical_decisions:
- source_word: Καὶ εἶδον περὶ αὐτόν
  english_pob_choice: And I saw concerning him
  chosen_korean: 그리고 내가 보았는데, 그에 관하여
  alternatives_korean:
  - 그리고 나는 그에 관하여 보았습니다
  - 그리고 그에 대해 내가 보았는데
  lexicon: εἶδον
  rationale: 서술의 시점을 살리면서도, περὶ αὐτόν을 ‘그에 관하여’로 옮겨 관찰 대상이 ‘그’임을 분명히 했습니다.
- source_word: οὐκ ἔστιν
  english_pob_choice: he was not
  chosen_korean: …있지 않았습니다
  alternatives_korean:
  - …아니었습니다
  - …되지 않았습니다
  lexicon: εἰμί
  rationale: 과거 시제의 존재/상태 부정을 자연스럽게 옮겨, 단순한 신분 평가가 아니라 그 순간의 상태 진술로 읽히게 했습니다.
- source_word: ἐν τῇ πρώτῃ τάξει
  english_pob_choice: in the first rank
  chosen_korean: 첫째 자리
  alternatives_korean:
  - 첫째 순위
  - 첫 번째 반열
  - 첫째 등급
  lexicon: τάξις
  rationale: τάξις의 질서·배열 의미를 살리되, 영어 POB의 ‘rank’와 대응되는 한국어로 ‘자리’를 선택해 위계적 배치를 드러냈습니다.
theological_decisions:
- issue: ‘first rank’의 위계 표현 유지
  chosen_reading: ‘첫째 자리’로 옮겨 인물의 상대적 위치/지위를 낮춘 서술로 유지했습니다.
  alternative_readings:
  - ‘첫째 순위가 아니었습니다’처럼 더 현대적 경쟁 표현으로 바꾸는 해석
  - ‘가장 높은 반열이 아니었습니다’처럼 설명적으로 풀어 쓰는 해석
  rationale: 문맥은 단순한 순위표가 아니라 공동체 내 질서와 위치를 말하므로, 위계성을 약화하지 않는 표현이 필요합니다.
  doctrine_reference: source-context
