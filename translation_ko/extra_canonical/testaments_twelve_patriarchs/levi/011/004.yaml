translation:
  language: ko
  text: 그리고 고핫이 내 생애 서른다섯째 해에, 해가 뜨는 쪽을 향하여 태어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὁ Καὰθ ἐγεννήθη
  english_pob_choice: And Kohath was born
  chosen_korean: 그리고 고핫이 ... 태어났습니다
  alternatives_korean:
  - 그리고 고핫이 태어났습니다
  - 고핫이 태어났습니다
  lexicon: 고핫
  rationale: ἐγεννήθη의 수동형을 자연스러운 한국어 수동 표현인 ‘태어났습니다’로 옮기고, 고유명사 Καὰθ은 통용 표기인 ‘고핫’을 사용했습니다.
- source_word: ἐν τῷ τριακοστῷ πέμπτῳ ἔτει τῆς ζωῆς μου
  english_pob_choice: in the thirty-fifth year of my life
  chosen_korean: 내 생애 서른다섯째 해에
  alternatives_korean:
  - 내 삶의 서른다섯 번째 해에
  - 내 생애의 서른다섯째 해에
  lexicon: 서른다섯째 해
  rationale: τῆς ζωῆς μου는 단순한 연령이 아니라 ‘내 생애’라는 시간 단위를 가리키므로, 직역보다 자연스럽게 ‘내 생애 서른다섯째 해’로 옮겼습니다.
- source_word: πρὸς ἀνατολὰς ἡλίου
  english_pob_choice: toward the sunrise
  chosen_korean: 해가 뜨는 쪽을 향하여
  alternatives_korean:
  - 해돋이 쪽을 향하여
  - 동쪽을 향하여
  lexicon: 해가 뜨는 쪽
  rationale: πρὸς ἀνατολὰς ἡλίου는 지리적 ‘동쪽’보다 ‘해가 뜨는 쪽’이라는 방향성을 더 직접적으로 드러내므로 그 의미를 살렸습니다.
