  text: 그러므로 내가 아내를 맞이했을 때, 나는 스물여덟 살이었으며, 그녀의 이름은 멜하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  english_pob_choice: took a wife
  chosen_korean: 아내를 맞이할 때
  alternatives_korean:
  - 아내를 취했을 때
  - 아내를 얻었을 때
  - 결혼했을 때
  lexicon: λαμβάνω + γυνή
  rationale: 직역의 '취하다'는 한국어에서 다소 딱딱하거나 소유 뉘앙스가 강해, 결혼 행위를 자연스럽게 드러내는 '아내를 맞이하다'를 택했습니다.
- source_word: εἴκοσι καὶ ὀκτὼ ἐτῶν ὑπῆρχον
  english_pob_choice: I was twenty-eight years old
  chosen_korean: 나는 스물여덟 살이었고
  alternatives_korean:
  - 나는 스물여덟 살이었습니다
  - 내 나이는 스물여덟 살이었고
  - 스물여덟 살이었습니다
  lexicon: ὑπάρχω + ἐτῶν
  rationale: 연령 진술을 자연스러운 서술형으로 옮겨, 현재적 존재감을 살리는 '스물여덟 살이었고'를 사용했습니다.
- source_word: Μελχά
  english_pob_choice: Melcha
  chosen_korean: 멜하
  alternatives_korean:
  - 멜차
  - 멜카
  - 멜하
  lexicon: 고유명사 음역
  rationale: 헬라어 표기 Μελχά의 현대 한국어 음역으로 '멜하'를 택해, 철자 대응을 무리 없이 반영했습니다.
