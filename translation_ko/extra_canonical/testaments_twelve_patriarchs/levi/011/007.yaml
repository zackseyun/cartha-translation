  text: And a third son, Merari, was born to me in the fortieth year of my life; and because his mother had difficulty in childbirth, I called him Merari, which means bitterness.
translation:
  language: ko
  text: 그리고 셋째 아들 메라리가 내게 태어났는데, 내 생애의 마흔째 해였습니다. 그의 어머니가 해산에 어려움을 겪었으므로, 나는 그를 메라리라고 불렀습니다. 그 이름은 ‘쓴맛’이라는 뜻입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρίτον υἱόν / third son
  english_pob_choice: a third son
  chosen_korean: 셋째 아들
  alternatives_korean:
  - 세 번째 아들
  - 셋째 아들
  lexicon: source_greek
  rationale: 자연스러운 한국어 서술을 위해 순서 수사로 옮겼고, 문맥상 ‘아들’의 자녀 순서를 그대로 살렸습니다.
- source_word: ἐν τῷ τεσσαρακοστῷ ἔτει τῆς ζωῆς μου / in the fortieth year of my life
  english_pob_choice: in the fortieth year of my life
  chosen_korean: 내 생애의 마흔째 해
  alternatives_korean:
  - 내 삶의 마흔 해
  - 내 생애의 마흔째 해
  lexicon: source_greek
  rationale: 연대기적 표현을 유지하면서도 현대 한국어에서 자연스럽고 격식 있는 표현으로 옮겼습니다.
- source_word: ἐδυστόκησεν ἡ μήτηρ αὐτοῦ / his mother had difficulty in childbirth
  english_pob_choice: had difficulty in childbirth
  chosen_korean: 해산에 어려움을 겪었으므로
  alternatives_korean:
  - 진통이 심했으므로
  - 해산에 어려움을 겪었으므로
  lexicon: source_greek
  rationale: 출산의 고통을 완화하지 않고, POB의 의미를 따라 ‘difficulty in childbirth’를 직접적이면서도 문어적으로 표현했습니다.
- source_word: Μεραρεῖ ... ὅ ἐστι πικριασμός / Merari ... which means bitterness
  english_pob_choice: Merari, which means bitterness
  chosen_korean: 메라리라고 불렀습니다. 그 이름은 ‘쓴맛’이라는 뜻입니다.
  alternatives_korean:
  - 메라리라고 불렀습니다. 그것은 ‘쓴맛’이라는 뜻입니다.
  - 메라리라고 불렀습니다. 곧 ‘쓴맛’입니다.
  lexicon: source_greek
  rationale: ὅ ἐστι를 이름 풀이로 자연스럽게 풀어 ‘~이라는 뜻입니다’로 번역했고, πικριασμός의 어감을 ‘쓴맛’으로 반영했습니다.
