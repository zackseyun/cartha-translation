  source_fidelity: 원문의 시간·인과 구조와 1인칭 화자(‘내가’)는 대체로 충실합니다. 다만 ἐν γῇ παροικίας는 ‘나그네의 땅’보다 ‘나그네로 머물러 사는 땅/거류하는 땅’처럼 그 땅에서의 체류 상태를 나타내는 표현이 더 정확합니다.
  naturalness: ‘나그네의 땅’은 현대 한국어에서 다소 부자연스럽고 의미 관계도 불분명합니다. ‘나그네로 머물러 살던 땅’은 자연스럽게 προσωριν적·타지 거주라는 뜻을 전달합니다.
  terminology: Γηρσάμ은 영어 POB의 Gersam에 맞추어 ‘게르삼’으로 유지하는 것이 적절합니다. ‘임신하여’와 ‘이름을 …이라 불렀습니다’도 현대 합쇼체에서 무난합니다.
