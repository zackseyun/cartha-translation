  text: And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning.
translation:
  language: ko
  text: 그리고 그녀가 임신하여 아들을 낳았으며, 내가 그의 이름을 게르삼이라 불렀습니다. 이는 우리가 나그네의 땅에 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συλλαβοῦσα
  english_pob_choice: she conceived
  chosen_korean: 임신하여
  alternatives_korean:
  - 잉태하여
  - 아이를 배어
  lexicon: συλλαμβάνω
  rationale: 출생 서술에서 자연스럽고 현대적인 표현으로 ‘임신하여’가 원문의 임신 개시를 분명히 전달합니다.
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ Γηρσάμ
  english_pob_choice: I called his name Gersam
  chosen_korean: 내가 그의 이름을 게르삼이라 불렀습니다
  alternatives_korean:
  - 내가 그의 이름을 게르삼이라고 지었습니다
  - 내가 그의 이름을 게르삼이라 하였습니다
  lexicon: καλέω + ὄνομα
  rationale: ‘이름을 …이라 불렀습니다’는 명명 행위를 직역에 가깝게 살리면서 한국어 문장으로도 자연스럽습니다.
- source_word: ἐν γῇ παροικίας
  english_pob_choice: in a land of sojourning
  chosen_korean: 나그네의 땅
  alternatives_korean:
  - 거류의 땅
  - 체류의 땅
  - 나그네살이의 땅
  lexicon: παροικία
  rationale: 파ροικία의 핵심인 ‘낯선 땅에서의 거주/체류’ 의미를 ‘나그네의 땅’으로 간결하게 반영했습니다.
theological_decisions:
- issue: 서술 화자의 일인칭 명명 진술과 인과절의 연결
  chosen_reading: 직접 인용된 회상 서술로서 ‘내가…불렀습니다’와 ‘이는…때문입니다’의 인과를 그대로 살렸습니다.
  alternative_readings:
  - 서술을 더 풀어 ‘그래서’로 연결하는 방식
  - 명명 행위를 수동적으로 처리하는 방식
  rationale: 원문은 화자의 기억을 따라가는 직설적 서술이므로, 설명을 덧붙이지 않고 원인-결과 구조를 유지하는 것이 가장 충실합니다.
  doctrine_reference: source-faithfulness
