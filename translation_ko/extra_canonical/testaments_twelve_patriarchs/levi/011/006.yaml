source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διὰ τοῦτο ἐκάλεσα τὸ ὄνομα αὐτοῦ Καάθ²¹, [ὅ ἐστιν ἀρχὴ μεγαλείου καὶ συμβιβασμός]²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/006.yaml
  text: Therefore I called his name Kohath, [which is, the beginning of majesty and uniting].
translation:
  language: ko
  text: 그러므로 나는 그의 이름을 가아핫이라 불렀습니다. 그것은 곧 위엄의 시작과 모든 이의 연합입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 그런 까닭에
  lexicon: source connective
  rationale: 원문의 인과적 연결을 자연스러운 문어체 한국어로 옮겼습니다.
- source_word: ἐκάλεσα
  english_pob_choice: I called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 이름지었습니다
  - 불러 명하였습니다
  lexicon: source verb
  rationale: 이름을 붙였다는 행위를 직접적으로 드러내는 동사를 택했습니다.
- source_word: Καάθ
  english_pob_choice: Kohath
  chosen_korean: 가아핫
  alternatives_korean:
  - 고핫
  - 고아핫
  lexicon: proper noun
  rationale: 본문의 그리스어 표기 Καάθ를 우선 반영한 음역을 택했습니다. 기존 교회식 통용형보다 원형 대응을 우선했습니다.
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  english_pob_choice: the beginning of majesty and the union of all
  chosen_korean: 위엄의 시작과 모든 이의 연합
  alternatives_korean:
  - 위엄의 시작과 화해
  - 위엄의 시작과 조화
  lexicon: source phrase
  rationale: ἀρχὴ는 ‘시작’, μεγαλείου는 ‘위엄’, συμβιβασμός는 단순한 집합보다 ‘연합/화해’의 뜻이 강하므로, 개별 집합체보다 전체적 결합을 살려 옮겼습니다.
theological_decisions:
- issue: συμβιβασμός의 의미 범위
  chosen_reading: ‘모든 이의 연합’으로 옮겨, 단순한 ‘모임’이 아니라 전체의 결합/화해를 드러냈습니다.
  alternative_readings:
  - ‘모임’
  - ‘집합’
  rationale: 영문 POB의 최신 수정이 assembly를 ‘union of all’로 조정한 점을 반영하여, 그리스어가 암시하는 통합의 뉘앙스를 유지했습니다.
  doctrine_reference: 문맥상 어원 설명; 별도 교리 주장 없음
