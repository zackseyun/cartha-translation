  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/008.yaml
  text: And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: ko
  text: 그리고 요게벳은 내가 예순네 살이던 해에 이집트에서 태어났습니다. 그때 나는 형제들 가운데서 명예로웠기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωχαβέδ
  english_pob_choice: Jochebed
  chosen_korean: 요게벳
  alternatives_korean:
  - 요학벳
  - 요게배드
  lexicon: 고유명사 음역
  rationale: 히브리 성경의 통용형을 따르되, 한국어에서 비교적 자연스럽게 읽히는 ‘요게벳’을 채택했습니다.
- source_word: ἐγεννήθη
  english_pob_choice: was born
  chosen_korean: 태어났습니다
  alternatives_korean:
  - 출생했습니다
  - 낳아졌습니다
  lexicon: γένναω/γεννάω 계열
  rationale: 수동형 출생 의미를 자연스러운 현대 한국어로 옮겨, 사건 서술의 평이함을 살렸습니다.
- source_word: ἐν Αἰγύπτῳ
  english_pob_choice: in Egypt
  chosen_korean: 이집트에서
  alternatives_korean:
  - 애굽에서
  - 이집트 땅에서
  lexicon: Αἴγυπτος
  rationale: 지명은 현대 표준어 표기인 ‘이집트’를 사용해 가독성을 높였습니다.
- source_word: τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει
  english_pob_choice: in the sixty-fourth year of my life
  chosen_korean: 내가 예순네 살이던 해에
  alternatives_korean:
  - 내 인생의 예순네째 해에
  - 내가 64세 되던 해에
  lexicon: 연령 표현
  rationale: 직역의 ‘나의 예순네 번째 해’보다 한국어 서술에 자연스러운 연령 표현으로 옮겼습니다.
- source_word: ἔνδοξος
  english_pob_choice: illustrious
  chosen_korean: 명예로웠습니다
  alternatives_korean:
  - 영광스러웠습니다
  - 뛰어났습니다
  lexicon: ἔνδοξος
  rationale: 문맥상 형제들 가운데서 두드러진 위신과 명망을 가리키므로, 과도하게 종교화하지 않고 ‘명예로웠습니다’로 옮겼습니다.
theological_decisions:
- issue: 자전적 진술의 해석
  chosen_reading: ‘형제들 가운데서 명예로웠기 때문입니다’로 원인의 γάρ를 살려, 요게벳의 출생 연대 설명과 화자의 사회적 위상을 연결했습니다.
  alternative_readings:
  - 단순 설명적 접속사로 약화해 ‘그리고… 태어났습니다’로만 처리
  - ‘영광스러웠기 때문입니다’로 더 강하게 신학화
  rationale: 본문은 출생 정보에 이어 화자의 당대 위상을 이유절로 제시하므로, 인과를 분명히 드러내되 과장하지 않는 번역이 적절합니다.
  doctrine_reference: 내러티브 문맥과 원인절 처리
- issue: ἐνδόξος의 뉘앙스
  chosen_reading: ‘영광스러운’ 대신 ‘명예로운’ 계열을 사용해 사회적 평판을 강조했습니다.
  alternative_readings:
  - 영광스러운
  - 유명한
  rationale: 이 문맥의 초점은 신적 영광보다 형제들 사이에서의 두드러진 지위이므로, 한국어에서는 사회적 명망을 드러내는 표현이 더 정확합니다.
  doctrine_reference: 문맥적 의미론
