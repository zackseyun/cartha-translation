revisions:
- from: 그리고 요게벳은 내가 예순네 살이던 해에 이집트에서 태어났습니다. 그때 나는 형제들 가운데서 명예로웠기 때문입니다.
  to: 요게벳은 내 삶의 예순넷째 해에 이집트에서 태어났습니다. 이는 그때 내가 내 형제들 가운데서 명성이 높았기 때문입니다.
  rationale: 연령은 원문의 ‘예순넷째 해’라는 표현을 보존하여 한국어 나이 계산에서 생길 수 있는 오해를 피했습니다. ἔνδοξος는 종교적 ‘영광’이나 도덕적 ‘명예’보다 사회적 명망을 뜻하는 ‘명성이 높았습니다’로 옮겼습니다. γάρ의 설명적 인과도 유지했습니다. 제공되지 않은 원전 주석 35–37의 내용을 추정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
