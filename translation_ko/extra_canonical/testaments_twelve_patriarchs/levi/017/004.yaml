  text: But the third priest will be taken away with grief.
translation:
  language: ko
  text: 그러나 셋째 제사장은 슬픔 가운데서 끌려가게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  english_pob_choice: But the third
  chosen_korean: 그러나 셋째
  alternatives_korean:
  - 하지만 세 번째
  - 그런데 셋째
  lexicon: third / ordinal
  rationale: 문맥상 대조 접속사 δέ는 ‘그러나’로 자연스럽게 옮기고, τρίτος는 계수적 표현보다 서술적 ‘셋째’가 간결합니다.
- source_word: ἱερεὺς
  english_pob_choice: priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 제관
  lexicon: priest
  rationale: 그리스어 ἱερεύς는 제사장으로 옮기는 것이 가장 직접적이며, 한국어 성서어법에서도 가장 분명합니다.
- source_word: λύπῃ
  english_pob_choice: with grief
  chosen_korean: 슬픔 가운데서
  alternatives_korean:
  - 슬픔으로
  - 비탄 가운데서
  - 근심 중에
  lexicon: grief
  rationale: 여기서는 수단/상태를 나타내는 여격의 뉘앙스를 살려, 단순한 원인보다 상태를 드러내는 ‘슬픔 가운데서’로 옮겼습니다.
- source_word: παραληφθήσεται
  english_pob_choice: will be taken away
  chosen_korean: 끌려가게 될 것입니다
  alternatives_korean:
  - 데려가질 것입니다
  - 취해질 것입니다
  - 옮겨질 것입니다
  lexicon: be taken away
  rationale: 수동 미래의 ‘취해짐’보다 인물에게 닥치는 제거/이동의 강한 의미를 드러내기 위해 ‘끌려가게 되다’로 옮겼습니다.
theological_decisions:
- issue: 제사장 직분의 예언적 심판 묘사
  chosen_reading: 본문은 셋째 제사장이 슬픔 가운데서 제거되는 사건을 예언적으로 말합니다.
  alternative_readings:
  - 단순한 이동이나 인도
  - 완곡한 은퇴
  rationale: παραληφθήσεται는 중립적 ‘데려감’보다 맥락상 수동적으로 제거되는 뉘앙스가 강하므로, 예언적 경고의 성격을 흐리지 않도록 옮겼습니다.
  doctrine_reference: source-based prophetic register
