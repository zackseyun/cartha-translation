id: T12P.LEV.17.9
reference: Testament of Levi 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Διὰ τοῦτο ἐν αἰχμαλωσίᾳ καὶ ἐν προνομῇ ἔσονται· καὶ ἡ γῆ αὐτῶν⁴⁴ καὶ *ἡ ὕπαρξις⁴⁵ ἀφανισθήσεται⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/009.yaml
  text: Therefore they will be in captivity and in plunder, and their land and their possessions will be destroyed.
translation:
  language: ko
  text: 그러므로 그들은 포로가 되어 약탈을 당할 것이며, 그들의 땅과 재산은 파괴될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἰχμαλωσίᾳ
  english_pob_choice: in captivity
  chosen_korean: 포로 상태
  alternatives_korean:
  - 포로됨
  - 포로로 잡힘
  lexicon: αἰχμαλωσία
  rationale: 상태를 나타내는 여격적 표현이므로, 단순 동작보다 결과 상태를 드러내는 ‘포로 상태’로 옮겼습니다.
- source_word: ἐν προνομῇ
  english_pob_choice: in plunder
  chosen_korean: 약탈 속에
  alternatives_korean:
  - 약탈 가운데
  - 노략질 속에
  lexicon: προνομή
  rationale: POB의 ‘plunder’를 따라 약탈의 결과적 처지를 살리되, 한국어에서는 처지 표현인 ‘속에’로 자연스럽게 처리했습니다.
- source_word: ἡ γῆ αὐτῶν ... καὶ ἡ ὕπαρξις
  english_pob_choice: their land and their possessions
  chosen_korean: 그들의 땅과 소유
  alternatives_korean:
  - 그들의 땅과 재산
  - 그들의 땅과 재산들
  lexicon: ὕπαρξις
  rationale: ὕπαρξις를 단순한 ‘존재’보다 소유·생계의 실제를 가리키는 말로 보고, POB의 ‘possessions’에 맞춰 ‘소유’로 옮겼습니다.
- source_word: ἀφανισθήσεται
  english_pob_choice: will be destroyed
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 사라질 것입니다
  - 없어질 것입니다
  lexicon: ἀφανίζω
  rationale: 문맥상 파괴와 소멸을 함께 담는 강한 표현이므로, 단순 소실보다 ‘멸망하다’를 택했습니다.
theological_decisions:
- issue: 병렬 구조의 강도 유지
  chosen_reading: ‘포로 상태와 약탈 속에 있게 될 것’과 ‘땅과 소유는 멸망할 것’의 이중 병렬을 그대로 살렸습니다.
  alternative_readings:
  - 의역하여 하나의 문장으로 합치기
  - ‘포로가 되고 약탈을 당할 것’로 압축하기
  rationale: 원문의 두 병렬절이 심판의 총체성을 강조하므로, 한국어에서도 같은 중량을 유지하는 것이 적절합니다.
  doctrine_reference: 심판/징계의 총체성
- issue: ‘소유’의 포괄성
  chosen_reading: ὕπαρξις를 재산만이 아니라 생계 기반과 실제 소유를 포함하는 포괄적 표현으로 처리했습니다.
  alternative_readings:
  - 재산
  - 존재
  rationale: 본문은 토지와 함께 공동체의 물질적 기반이 파괴됨을 말하므로, ‘소유’가 가장 무난하게 그 범위를 반영합니다.
  doctrine_reference: 문맥적 의미 보존
