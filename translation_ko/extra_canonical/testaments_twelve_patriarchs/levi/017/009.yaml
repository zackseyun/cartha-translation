  terminology: αἰχμαλωσία는 ‘포로가 되다’, προνομή는 이 문맥에서 ‘약탈을 당하다’, ὕπαρξις는 물질적 소유를 뜻하는 ‘재산’, ἀφανίζω는 ‘파괴되다’로 처리했습니다. 신학적 해석을 추가하지 않았습니다.
