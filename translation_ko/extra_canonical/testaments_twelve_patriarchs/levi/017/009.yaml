  source_fidelity: ‘포로 상태와 약탈 속에 있게 될 것’은 원문의 두 ἐν 구문을 형식상 반영하지만, 한국어로는 ‘약탈 속에 있다’가 부자연스럽고 무엇을 뜻하는지 불분명합니다. 문맥상 그들이 포로가 되고 약탈을 당하는 처지가 된다는 뜻으로 명료하게 옮기는 것이 적절합니다. ἀφανισθήσεται에는 ‘파괴되다’가 ‘멸망하다’보다 땅과 재산 모두에 더 직접적이고 자연스럽습니다.
