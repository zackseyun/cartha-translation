  language: ko
  text: 그리고 네 번째는 고통 속에 있을 것입니다. 왜냐하면 불법이 그에게 넘쳐나게 더해질 것이며, 온 이스라엘이 각각 자기 이웃을 미워할 것이기 때문입니다.
