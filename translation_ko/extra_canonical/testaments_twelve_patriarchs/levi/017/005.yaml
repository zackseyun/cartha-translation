lexical_decisions:
- source_word: ὀδύναις
  english_pob_choice: will be in pains
  chosen_korean: 고통 속에 있을 것입니다
  alternatives_korean:
  - 산고 속에 있을 것입니다
  - 고뇌에 시달릴 것입니다
  lexicon: —
  rationale: ὀδύναις는 단순한 불편이 아니라 강한 고통을 가리키므로, 합쇼체에서 자연스럽고 직접적인 표현으로 옮겼습니다.
- source_word: ἀδικία
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 불의
  - 죄악
  lexicon: —
  rationale: 영문 POB의 lawlessness를 따라 ἀδικία를 도덕적 추상어보다 ‘율법/질서에 대한 위반’ 뉘앙스가 살아 있는 불법으로 옮겼습니다.
- source_word: εἰς πλῆθος
  english_pob_choice: to abundance
  chosen_korean: 넘쳐나게
  alternatives_korean:
