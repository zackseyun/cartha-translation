review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the singular referent of ‘the fourth,’ the affliction, the addition of ἀδικία ‘upon him,’ and the distributive force of ἕκαστος. However, ‘불법’ in current Korean normally denotes an unlawful/illegal act in a juridical sense and is narrower than ἀδικία, which here more broadly denotes injustice or wrongdoing. ‘불의’ is the safer source-led equivalent. ‘크게 더해지다’ renders προσθήσει … εἰς πλῆθος without adding an image not explicit in the Greek.
  naturalness: The draft’s ‘왜냐하면 … 것이며, … 것이기 때문입니다’ is grammatically possible but needlessly repetitive in formal Korean. ‘이는 … 때문입니다’ provides a natural, modern formal-polite causal construction. ‘저마다’ is a more idiomatic distributive rendering than ‘각각’ in this clause.
  terminology: Use ‘불의’ for ἀδικία. This avoids imposing the specifically legal-register implication of ‘불법’ while retaining the passage’s moral-social sense. No doctrinally loaded terminology is required.
  issues:
  - severity: medium
    issue: ‘불법’ is too narrowly juridical for ἀδικία.
    rationale: ἀδικία ordinarily denotes injustice, wrongdoing, or unrighteousness. In standard contemporary Korean, ‘불법’ most readily means an illegal act; ‘불의’ more directly preserves the Greek moral term and its ambiguity.
  - severity: low
    issue: The causal phrasing is repetitive in Korean.
    rationale: Replacing ‘왜냐하면 … 것이며, … 것이기 때문입니다’ with ‘이는 … 때문입니다’ improves modern formal-polite flow without altering the causal relationship.
  revised_text: 그리고 넷째는 고통 가운데 있을 것입니다. 이는 불의가 그에게 크게 더해질 것이며, 온 이스라엘이 저마다 자기 이웃을 미워할 것이기 때문입니다.
