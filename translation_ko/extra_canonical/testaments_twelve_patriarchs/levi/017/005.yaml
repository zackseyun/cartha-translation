translation:
  language: ko
  text: 그리고 넷째는 고통 가운데 있을 것입니다. 이는 불의가 그에게 크게 더해질 것이며, 온 이스라엘이 저마다 자기 이웃을 미워할 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδύναις
  english_pob_choice: will be in pains
  chosen_korean: 고통 속에 있을 것입니다
  alternatives_korean:
  - 산고 속에 있을 것입니다
  - 고뇌에 시달릴 것입니다
  lexicon: —
  rationale: ὀδύναις는 단순한 불편이 아니라 강한 고통을 가리키므로, 합쇼체에서 자연스럽고 직접적인 표현으로 옮겼습니다.
- source_word: ἀδικία
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 불의
  - 죄악
  lexicon: —
  rationale: 영문 POB의 lawlessness를 따라 ἀδικία를 도덕적 추상어보다 ‘율법/질서에 대한 위반’ 뉘앙스가 살아 있는 불법으로 옮겼습니다.
- source_word: εἰς πλῆθος
  english_pob_choice: to abundance
  chosen_korean: 넘쳐나게
  alternatives_korean:
  - 풍성하게
  - 가득하게
  lexicon: —
  rationale: ‘풍부함’의 정도를 나타내는 표현으로, 증가가 임계점을 넘어 넘실거리게 된다는 뉘앙스를 간결하게 살렸습니다.
- source_word: ἕκαστος τὸν πλησίον αὐτοῦ
  english_pob_choice: each one his neighbor
  chosen_korean: 각각 자기 이웃을
  alternatives_korean:
  - 각자 자기 이웃을
  - 사람마다 그의 이웃을
  lexicon: —
  rationale: 주어 분포를 유지해 ‘각 사람마다’의 개별적 증오를 드러내도록 했고, 한국어 어순상 자연스럽게 배열했습니다.
theological_decisions:
- issue: ἀδικία를 ‘불법’으로 옮길지 ‘불의’로 옮길지
  chosen_reading: 불법
  alternative_readings:
