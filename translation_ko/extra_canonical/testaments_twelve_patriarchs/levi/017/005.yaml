revisions:
- from: 그리고 네 번째는 고통 속에 있을 것입니다. 왜냐하면 불법이 그에게 넘쳐나게 더해질 것이며, 온 이스라엘이 각각 자기 이웃을 미워할 것이기 때문입니다.
  to: 그리고 넷째는 고통 가운데 있을 것입니다. 이는 불의가 그에게 크게 더해질 것이며, 온 이스라엘이 저마다 자기 이웃을 미워할 것이기 때문입니다.
  rationale: The revision follows the Greek lexical sense of ἀδικία more closely, preserves the ambiguous referent of ἐπ’ αὐτῷ as ‘그에게,’ retains the abundance/intensification indicated by εἰς πλῆθος, and smooths the Korean causal syntax in 합쇼체. No footnote is necessary because the translation does not resolve a textual or theological ambiguity beyond what the source states.
  reviewer_model: gpt-5.6-terra
