  terminology: ‘희년’, ‘기름부음 받은 이’, ‘제사직’은 원문의 표현과 종교사적 용례를 적절히 보존합니다. ‘메시아’나 ‘그리스도’로 해석을 확정하지 않은 점도 타당합니다.
