  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐν¹⁸ τῷ δευτέρῳ ἰωβηλαίῳ ὁ¹⁹ χριόμενος ἐν πένθει ἀγαπητοῦ²⁰ συλληφθήσεται²¹ *καὶ ἔσται²² ἡ ἱερωσύνη αὐτοῦ τιμία²³, καὶ παρὰ πάντων²⁴ δοξασθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/003.yaml
  text: In the second jubilee, the anointed one will be seized in mourning for a beloved one, and his priesthood will be honored, and he will be glorified by all.
translation:
  language: ko
  text: 둘째 희년에는 사랑하는 이를 위해 애도하는 가운데 기름부음 받은 이가 붙잡히게 되며, 그의 제사직은 존귀하게 여겨지고 모든 사람에게 영광을 받게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ δευτέρῳ ἰωβηλαίῳ
  english_pob_choice: In the second jubilee
  chosen_korean: 둘째 희년에는
  alternatives_korean:
  - 두 번째 희년에는
  - 둘째 희년에
  lexicon: ἰωβηλαῖον
  rationale: 희년은 단순한 ‘주기’가 아니라 성경적 해방 주기를 가리키므로, 이를 직역해 ‘희년’으로 두고 시간 부사격으로 자연스럽게 처리했습니다.
- source_word: ὁ χριόμενος
  english_pob_choice: the anointed one
  chosen_korean: 기름부음 받은 이
  alternatives_korean:
  - 메시아
  - 기름부음 받은 자
  - 기름부음 받은 분
  lexicon: χρίω
  rationale: 본문은 직함적 표현이지만, 이 구절의 용례상 특정 인물 명칭보다 ‘기름부음 받은 이’가 원문의 표현을 더 직접적으로 드러냅니다.
- source_word: συλληφθήσεται
  english_pob_choice: will be seized
  chosen_korean: 붙잡히게 되며
  alternatives_korean:
  - 붙잡히게 되리니
  - 사로잡히게 되며
  - 붙들리게 되며
  lexicon: συλλαμβάνω
  rationale: 수동 미래의 강한 피동성을 살리면서도, 한국어에서 자연스럽고 본문 맥락에 맞게 ‘붙잡히다’를 택했습니다.
- source_word: ἡ ἱερωσύνη αὐτοῦ τιμία
  english_pob_choice: his priesthood will be honored
  chosen_korean: 그의 제사직은 존귀하게 여겨지고
  alternatives_korean:
  - 그의 제사직은 존귀해지고
  - 그의 제사직은 존중받고
  - 그의 제사직은 귀히 여겨지고
  lexicon: ἱερωσύνη
  rationale: ἱερωσύνη는 직무로서의 제사직을 가리키므로 ‘제사직’으로 옮기고, τιμία의 가치 평가를 ‘존귀하게 여겨지다’로 표현했습니다.
- source_word: παρὰ πάντων δοξασθήσεται
  english_pob_choice: and he will be glorified by all
  chosen_korean: 모든 사람에게 영광을 받게 될 것입니다
  alternatives_korean:
  - 모든 사람에게 영광을 받게 되리라
  - 모든 이에게 영광스럽게 될 것입니다
  - 모든 사람에게 영화롭게 될 것입니다
  lexicon: δοξάζω
  rationale: 수동태의 의미를 살려 ‘영광을 받다’로 옮겼고, παρὰ πάντων은 ‘모든 사람에게’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 본문의 ‘기름부음 받은 이’ 표현을 메시아 칭호로 고정할지 여부
  chosen_reading: 본문의 표면 의미를 따라 ‘기름부음 받은 이’로 두고, 칭호 해석을 본문 안에 미리 확정하지 않았습니다.
  alternative_readings:
  - 메시아
  - 그리스도
  rationale: 이 구절은 예언적/묵시적 문맥에서 특정 인물을 가리키지만, 한국어 본문에서는 원문 직결성을 우선해 해석 여지를 남기는 편이 더 투명합니다.
  doctrine_reference: 해석학적 중립성 및 본문-독자 관계
