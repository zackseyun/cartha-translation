source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/010.yaml
  text: And in the fifth week they will return to the land of their desolation, and they will renew the house of the Lord.
translation:
  language: ko
  text: 그리고 다섯째 주간에 그들은 자기들의 황폐한 땅으로 돌아올 것이며, 주의 집을 새롭게 할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψουσιν
  english_pob_choice: they will return
  chosen_korean: 돌아올 것입니다
  alternatives_korean:
  - 되돌아갈 것입니다
  - 귀환할 것입니다
  lexicon: ἐπιστρέφω
  rationale: 단순한 회복 이동을 자연스러운 현대 한국어로 옮기되, 예언적 미래형을 유지했습니다.
- source_word: γῆν ἐρημώσεως αὐτῶν
  english_pob_choice: the land of their desolation
  chosen_korean: 자기들의 황폐한 땅
  alternatives_korean:
  - 그들의 황폐의 땅
  - 그들의 폐허가 된 땅
  lexicon: γῆ / ἐρήμωσις
  rationale: 소유격과 상태를 함께 살려 ‘황폐한 땅’으로 옮겼고, 영어 POB의 의미도 보존했습니다.
- source_word: ἀνακαινοποιήσουσιν
  english_pob_choice: they will renew
  chosen_korean: 새롭게 할 것입니다
  alternatives_korean:
  - 갱신할 것입니다
  - 새로이 할 것입니다
  lexicon: ἀνακαινοποιέω
  rationale: 성전/집을 ‘renew’하는 동작을 직설적으로 살리되, 한국어에서 가장 자연스러운 표현을 택했습니다.
- source_word: οἶκον κυρίου
  english_pob_choice: the house of the Lord
  chosen_korean: 주의 집
  alternatives_korean:
  - 주님의 집
  - 야훼의 집
  lexicon: οἶκος / κύριος
  rationale: 본문이 지시하는 성소적 표현을 간결하게 살렸고, 여기서 κύριος는 직전 영어 POB와의 연동을 따라 ‘주’로 두었습니다.
theological_decisions:
- issue: 예언적 미래 시제의 처리
  chosen_reading: 주어 ‘그들’과 함께 미래형 ‘-할 것입니다’를 일관되게 사용했습니다.
  alternative_readings:
  - 현재형으로 번역
  - 미래를 완곡하게 표현
  rationale: 본문의 예언 진술을 현대 한국어의 격식 있는 미래로 분명하게 전달하기 위해서입니다.
  doctrine_reference: 문학적/예언적 시제 전달
