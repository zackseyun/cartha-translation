source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἐν δὲ τῷ ἑβδόμῳ²⁷ ἔσται μιασμός⁴¹, ὃν οὐ δύναμαι⁴² εἰπεῖν ἐνώπιον⁴³ ἀνθρώπων· ὅτι αὐτοὶ γνώσονται οἱ ποιοῦντες αὐτά.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/008.yaml
  text: But in the seventh there will be defilement, which I cannot speak of before men, because those who do these things will know them.
translation:
  language: ko
  text: 그러나 일곱째에는 더러움이 있을 것입니다. 나는 그것을 사람들 앞에서 말할 수 없습니다. 왜냐하면 그것을 행하는 자들이 그것을 알게 될 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιασμός
  english_pob_choice: defilement
  chosen_korean: 더러움
  alternatives_korean:
  - 부정
  - 오염
  - 속됨
  lexicon: μιασμός
  rationale: 의례적·도덕적 오염을 포괄하는 말로 ‘더러움’이 가장 직접적으로 source의 금기적 뉘앙스를 살립니다.
- source_word: ἐν τῷ ἑβδόμῳ
  english_pob_choice: in the seventh
  chosen_korean: 일곱째에는
  alternatives_korean:
  - 일곱째에
  - 일곱째 때에는
  - 일곱째 기간에는
  lexicon: ἑβδόμῳ
  rationale: 원문이 막연한 시점/구획을 가리키므로, 한국어에서는 자연스럽고 간결한 ‘일곱째에는’으로 옮겼습니다.
- source_word: ἐνώπιον ἀνθρώπων
  english_pob_choice: before men
  chosen_korean: 사람들 앞에서
  alternatives_korean:
  - 사람들 앞에서
  - 사람들 앞에
  - 인간들 앞에서
  lexicon: ἐνώπιον
  rationale: 공적 발화의 위치를 드러내는 표현이므로, 자연스러운 한국어 관용구인 ‘사람들 앞에서’를 택했습니다.
- source_word: οἱ ποιοῦντες αὐτά
  english_pob_choice: those who do these things
  chosen_korean: 그것을 행하는 자들
  alternatives_korean:
  - 이것들을 행하는 사람들
  - 이런 것들을 하는 자들
  - 그 일을 하는 이들
  lexicon: ποιέω
  rationale: 동작의 지속성과 범주성을 살리기 위해 ‘행하는 자들’로 옮겨, 단순한 일회적 행동보다 반복적 실천을 드러냈습니다.
theological_decisions:
- issue: γνωσονται의 방향성
  chosen_reading: ‘그것을 행하는 자들이 그것을 알게 될 것’으로 옮겨, 행위와 인지의 연결을 그대로 유지했습니다.
  alternative_readings:
  - ‘그것을 행하는 자들이 그것을 깨닫게 될 것’
  - ‘그것을 행하는 자들이 알게 될 것이다’
  rationale: 원문은 행하는 자들이 그 사실을 ‘알게’ 되는 결과를 말하므로, 해석을 덧붙여 ‘깨닫다’로 강화하지 않고 직역에 가까운 형태를 유지했습니다.
  doctrine_reference: source fidelity; semantic restraint
