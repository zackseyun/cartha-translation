  terminology: μιασμός의 ‘더러움’은 의례적·도덕적 오염을 포괄할 수 있는 무난한 번역입니다. 원문이 구체적 내용을 의도적으로 밝히지 않으므로 이를 특정하지 않았습니다.
  issues:
