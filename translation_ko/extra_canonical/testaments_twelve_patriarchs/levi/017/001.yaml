  text: '*Καὶ ὅτι ἠκούσατε¹ περὶ τῶν ἑβδομήκοντα² ἑβδομάδων³, ἀκούσατε καὶ⁴ περὶ τῆς ἱερωσύνης⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/001.yaml
  text: And since you have heard about the seventy weeks, hear also about the priesthood.
translation:
  language: ko
  text: 여러분은 그 일흔 주간에 관하여 들었으니, 제사직에 관해서도 들으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκούσατε
  english_pob_choice: you have heard
  chosen_korean: 들었으므로
  alternatives_korean:
  - 들으셨으므로
  - 들었기에
  lexicon: ἀκούω
  rationale: 원문의 완료적 의미를 살리되, 앞 절과의 연결을 자연스럽게 하기 위해 원인·전제의 뉘앙스를 가진 ‘-으므로’를 사용했습니다.
- source_word: ἀκούσατε
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으세요
  - 들어 보십시오
  lexicon: ἀκούω
  rationale: 반복 명령을 현대 공문체에 맞게 공손한 명령형으로 옮겼습니다.
- source_word: ἱερωσύνης
  english_pob_choice: the priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장직
  - 사제직
  lexicon: ἱερωσύνη
  rationale: 문맥상 제사장 집무와 직분을 가리키므로, 교회 제도 용어보다 직접적인 ‘제사직’이 원문 의미를 가장 간결하게 드러냅니다.
theological_decisions:
- issue: ‘일흔 주간’과 ‘제사직’의 병렬적 권면 구조
  chosen_reading: 원문은 앞서 들은 종말론적 계시(일흔 주간)에 더하여 제사직에 관한 계시를 추가로 들으라는 병렬 권면입니다.
  alternative_readings:
  - 단순한 정보 전달로 약화된 번역
  - ‘이제’ 없이 직역한 건조한 명령문
  rationale: καί... καί... 구조를 따라 두 번째 명령의 추가성을 살리되, 한국어에서는 ‘이제’로 자연스러운 전환을 표시했습니다.
  doctrine_reference: 텍스트 내 구조 보존
