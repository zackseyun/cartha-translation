  to: 이는 각 희년마다 제사직이 있을 것이기 때문입니다. 또 첫 희년에는 제사직을 위해 먼저 기름부음을 받는 이가 위대할 것이며, 하나님께 아버지께 말씀드리듯 말씀드릴 것입니다. 그의 제사직은 주님과 더불어 충만할 것입니다. [또 그의 기쁨의 날들에 그는 세상의 구원을 위하여 일어날 것입니다.]
