id: T12P.LEV.17.2
reference: Testament of Levi 17:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/002.yaml
  text: For in each jubilee there will be a priesthood. And in the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be full with the Lord. [And in the days of his joy, he will arise for the salvation of the world.]
translation:
  language: ko
  text: 이는 각 희년마다 제사직이 있을 것이기 때문입니다. 또 첫 희년에는 제사직을 위해 먼저 기름부음을 받는 이가 위대할 것이며, 하나님께 아버지께 말씀드리듯 말씀드릴 것입니다. 그의 제사직은 주님과 더불어 충만할 것입니다. [또 그의 기쁨의 날들에 그는 세상의 구원을 위하여 일어날 것입니다.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰωβηλαῖον
  english_pob_choice: jubilee
  chosen_korean: 희년
  alternatives_korean:
  - 쥬빌리
  - 희년년
  lexicon: none
  rationale: 유대 전통의 기술용어로서 한국어 성경 문맥에서 가장 자연스럽고 의미가 분명한 대응은 ‘희년’입니다.
- source_word: ἱερωσύνη
  english_pob_choice: priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장직
  - 사제직
  lexicon: none
  rationale: 단순한 직분명보다 제의적 기능과 직무를 함께 드러내는 ‘제사직’이 본문 취지에 더 가깝습니다.
- source_word: ὁ χριόμενος πρῶτος εἰς ἱερωσύνην
  english_pob_choice: the one first anointed for the priesthood
  chosen_korean: 제사직을 위해 먼저 기름부음을 받은 이
  alternatives_korean:
  - 제사직을 위해 첫째로 기름부음을 받은 이
  - 제사장으로 먼저 기름부음을 받은 이
  lexicon: none
  rationale: χριόμενος의 기름부음과 πρῶτος의 순서를 함께 살리면서, 문맥상 ‘첫 번째로 선택된 자’라는 의미를 자연스럽게 옮겼습니다.
- source_word: πλήρης μετὰ κυρίου
  english_pob_choice: full with the Lord
  chosen_korean: 주님과 함께 충만할 것입니다
  alternatives_korean:
  - 주님으로 충만할 것입니다
  - 주님과 함께 가득할 것입니다
  lexicon: none
  rationale: POB의 ‘full with the Lord’는 단순 상태가 아니라 주님과의 동행/충만을 함께 암시하므로, 한국어에서는 ‘주님과 함께 충만하다’로 옮겼습니다.
theological_decisions:
- issue: Θεῷ ὡς πατρί의 호칭과 문체
  chosen_reading: 하나님께 아버지에게 말하듯 말할 것이고
  alternative_readings:
  - 하나님께 아버지처럼 말할 것이고
  - 하나님께 아버지께 말하듯 말할 것이고
  rationale: 직역의 어색함을 피하면서도, 하나님을 아버지로 대하는 친밀한 관계를 과장 없이 드러내기 위해 ‘아버지에게 말하듯’으로 옮겼습니다.
  doctrine_reference: 하나님 아버지에 대한 친밀한 접근
- issue: '[καὶ ἐν ἡμέραις χαρᾶς αὐτοῦ ...]의 대괄호 처리'
  chosen_reading: 대괄호로 보존하여 본문 핵심과 보조 전승을 구분했습니다.
  alternative_readings:
  - 본문에 포함해 번역
  - 주석으로만 처리
  rationale: 영어 POB가 이 절을 대괄호로 처리한 뒤를 따라, 전승상 불확실한 문장을 본문과 구분해 보존했습니다.
  doctrine_reference: 본문비평적 전승 구분
- issue: καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ κυρίου의 해석
  chosen_reading: ‘주님과 함께 충만할 것입니다’로 번역해 관계적 충만을 살렸습니다.
  alternative_readings:
  - ‘주님으로 충만할 것입니다’
  - ‘주님과 더불어 완전할 것입니다’
  rationale: πλήρης의 핵심은 ‘충만함’이므로 완전성보다 상태의 충만을 살리고, μετὰ κυρίου는 동반/함께의 의미를 보존했습니다.
  doctrine_reference: 문맥상 제사직의 충만과 동행
