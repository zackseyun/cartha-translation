  source_fidelity: 핵심 의미는 대체로 충실합니다. γάρ의 근거 제시, 각 희년의 제사직, 제사직을 위해 먼저 기름부음 받은 이, 하나님께 아버지에게 말하듯 말함, 그리고 대괄호 처리된 문장의 ἀναστήσεται(‘일어나다’)를 모두 보존합니다. 다만 ‘그러므로’는 γάρ의 일반적인 설명·근거의 뉘앙스를 다소 결과적으로 만들므로 ‘이는’이 더 적절합니다.
  naturalness: ‘하나님께 아버지에게 말하듯 말할 것이고’는 같은 동사의 반복과 조사 결합 때문에 다소 부자연스럽습니다. ‘하나님께 아버지께 말씀드리듯 말씀드릴 것입니다’로 하면 합쇼체에 맞고 비교 구문도 자연스럽습니다. ‘주님과 함께 충만할 것입니다’도 유지 가능하나, ‘더불어’가 이 문맥에서 더 자연스럽습니다.
  terminology: ‘희년’, ‘제사직’, ‘기름부음’, ‘하나님’, ‘주님’은 적절합니다. πλήρης를 ‘충만하다’로 옮겨 English POB의 full 및 그리스어의 충만함을 보존합니다. 대괄호는 전승상 불확실한 부분을 본문과 구분하는 데 적절합니다.
