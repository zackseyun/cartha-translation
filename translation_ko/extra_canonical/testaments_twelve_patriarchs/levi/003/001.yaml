id: T12P.LEV.3.1
reference: Testament of Levi 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 92-133, Levi pilot full)
  text: ῎Ακουσον οὖν¹ περὶ τῶν δει- χθέντων σοι οὐρα- νῶν· ὁ κατώτερος *διὰ τοῦτό σοί ἐστι στυγνός, ἐπειδὴ² ὁρᾷ πάσας³ τὰς ἀδικίας τῶν ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/001.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is gloomy for this reason: because it sees all the injustices of people.'
translation:
  language: ko
  text: 그러므로 너희가 본 하늘들에 관하여 들으십시오. 가장 낮은 하늘은 이 때문에 음울합니다. 곧 사람들의 모든 불의함을 보기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῎Ακουσον οὖν
  english_pob_choice: Listen, then
  chosen_korean: 그러므로 … 들으십시오
  alternatives_korean:
  - 들으십시오, 그러므로
  - 그러니 들어 보십시오
  lexicon: ἀκούω
  rationale: 부드러운 권면보다 직접적인 청유를 살리되, 합쇼체로 자연스럽게 옮기기 위해 ‘들으십시오’를 선택했습니다.
- source_word: τῶν δειχθέντων σοι οὐρανῶν
  english_pob_choice: the heavens that were shown to you
  chosen_korean: 너희가 본 하늘들
  alternatives_korean:
  - 네게 보여 준 하늘들
  - 보여진 하늘들
  lexicon: δείκνυμι
  rationale: ‘보이다’의 수동 뉘앙스를 살리면서도 한국어에서 더 자연스러운 관찰 결과를 표현하기 위해 ‘본 하늘들’로 옮겼습니다.
- source_word: στυγνός
  english_pob_choice: gloomy
  chosen_korean: 음울합니다
  alternatives_korean:
  - 우울합니다
  - 침침합니다
  - 어둡습니다
  lexicon: στυγνός
  rationale: English audit의 ‘gloomy’를 따라 단순한 물리적 어둠이 아니라 눅눅하고 무거운 분위기를 드러내는 ‘음울하다’를 택했습니다.
- source_word: ἀδικίας
  english_pob_choice: injustices
  chosen_korean: 불의함
  alternatives_korean:
  - 불의
  - 불의한 행위
  - 불공정
  lexicon: ἀδικία
  rationale: 복수형이지만 한국어에서는 총칭적 개념으로 자연스럽게 드러내기 위해 ‘불의함’으로 옮겼습니다.
- source_word: τῶν ἀνθρώπων
  english_pob_choice: people
  chosen_korean: 사람들의
  alternatives_korean:
  - 인간의
  - 인류의
  lexicon: ἄνθρωπος
  rationale: 성별 한정 없이 보편적 인간을 가리키는 표현이므로, 관습적 ‘사람들’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 도덕적 평가
  chosen_reading: ἀδικίας를 ‘불의함’으로 번역해 단순한 법적 위반보다 관계적·윤리적 왜곡을 드러냈습니다.
  alternative_readings:
  - 불법
  - 죄악
  - 불의한 행위
  rationale: 본문은 하늘이 인간의 ‘불의’를 본다고 말하므로, 영어 POB의 ‘injustices’에 맞추되 의미를 축소하지 않도록 했습니다.
  doctrine_reference: 일반 윤리적/종교적 용례
