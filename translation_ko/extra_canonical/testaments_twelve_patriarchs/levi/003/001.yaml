review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 헬라어 σοι는 단수 ‘네게/당신에게’인데 초안은 ‘너희가’로 복수화했으며, δειχθέντων은 ‘보여진/보여 주어진’이라는 수동 의미이지 단순히 ‘본’이라는 능동 경험을 뜻하지 않습니다. 나머지 문장은 최하층 하늘이 사람들의 모든 불의를 보므로 음울하다는 원문의 인과관계를 충실히 반영합니다.
  naturalness: ‘네게 보여진 하늘들’은 현대 표준어 합쇼체 안에서 자연스럽고, 직접적인 단수 청자를 유지합니다. ‘이는 … 때문입니다’는 원문의 ἐπειδή(왜냐하면/…이기 때문에)를 명료하게 드러냅니다.
  terminology: στυγνός는 ‘음울합니다’로 적절하며, ἀδικίας는 복수의 포괄성을 살린 ‘모든 불의’가 적합합니다. ἄνθρωποι는 성별을 한정하지 않는 ‘사람들’로 옮겼습니다.
  issues:
  - severity: high
    issue: 단수 청자가 복수 청자로 바뀜
    rationale: σοι와 Ἄκουσον은 모두 단수 청자를 전제합니다. ‘너희가’는 원문의 수를 변경합니다.
  - severity: medium
    issue: 수동 ‘보여진’이 능동 ‘본’으로 바뀜
    rationale: δειχθέντων은 ‘보여진/보여 주어진’ 하늘들을 뜻합니다. ‘본’은 의미상 가능한 결과를 암시할 수 있으나, 원문의 수동 표현을 보존하지 못합니다.
  revised_text: 그러므로 네게 보여진 하늘들에 관하여 들으십시오. 가장 낮은 하늘은 이 때문에 음울합니다. 이는 사람들의 모든 불의를 보기 때문입니다.
