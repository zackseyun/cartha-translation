source:
  edition: Charles 1908 Greek Versions (pages 92-133, Levi pilot full)
  text: Καὶ ἔχει πῦρ χιόνα καὶ⁴ κρύσταλλον ἡτοιμασμένον⁵ εἰς A ª
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/002.yaml
  text: And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are
    shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.
  footnotes:
  - marker: a
    text: Or 'make atonement to the Lord.' The Greek verb can be rendered either way in cultic contexts.
    reason: lexical_alternative
  - marker: b
    text: '''Beliar'' reflects the Greek form of the name, often rendered ''Belial'' in other traditions.'
    reason: lexical_alternative
  - marker: c
    text: '''A reasonable and bloodless offering'' translates a phrase that may also be understood as ''a rational'' or, more interpretively, ''a spiritual and bloodless offering.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그것은 하나님이 정하신 날을 위해 준비된 불과 눈과 얼음이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχει
  english_pob_choice: And it has
  chosen_korean: 그리고 그것은 … 있습니다
  alternatives_korean:
  - 그리고 거기에는 … 있습니다
  - 그리고 거기엔 … 있습니다
  lexicon: ἔχω
  rationale: 문맥상 ‘소유하다’보다 장소 안에 ‘존재하다/있다’의 의미가 자연스러워, 간결한 존재문으로 옮겼습니다.
- source_word: πῦρ χιόνα καὶ κρύσταλλον
  english_pob_choice: fire, snow, and ice
  chosen_korean: 불과 눈과 얼음
  alternatives_korean:
  - 불, 눈, 그리고 얼음
  - 불, 눈, 얼음
  lexicon: πῦρ / χιών / κρύσταλλος
  rationale: 원문의 병렬 명사를 그대로 살려 세 요소를 직역하되, 한국어에서는 조사와 접속을 자연스럽게 정리했습니다.
- source_word: ἡτοιμασμένον
  english_pob_choice: prepared
  chosen_korean: 준비된
  alternatives_korean:
  - 예비된
  - 마련된
  lexicon: ἑτοιμάζω
  rationale: 완료된 준비 상태를 나타내는 분사로 보고, 현대 한국어에서 가장 직관적인 ‘준비된’을 선택했습니다.
- source_word: εἰς
  english_pob_choice: for the day determined by God
  chosen_korean: …을 위해
  alternatives_korean:
  - …을 위하여
  - …에 대하여
  lexicon: εἰς
  rationale: 이 전치사는 목적/지향을 나타내므로, 뒤의 하나님의 정하심과 결합되는 미래 지향적 의미를 살려 ‘을 위해’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 정하신 날의 표현
  chosen_reading: ‘하나님이 정하신 날’로 옮겨, 날짜가 우연히 도래하는 것이 아니라 신적 작정 아래 있음을 드러냈습니다.
  alternative_readings:
  - ‘하나님께서 결정하신 날’
  - ‘하나님이 지정하신 날’
  rationale: 본문과 POB의 ‘day determined by God’는 종말론적 심판의 시점을 하나님의 주권적 결정으로 제시하므로, 그 뉘앙스를 분명히 했습니다.
  doctrine_reference: 신적 주권과 종말 심판
