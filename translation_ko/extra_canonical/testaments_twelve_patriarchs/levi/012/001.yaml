translation:
  language: ko
  text: 그리고 게르삼은 아내를 맞아들였고, 그 여자는 그에게서 로므네와 세메를 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκα
  english_pob_choice: a wife
  chosen_korean: 아내를 맞아들였고
  alternatives_korean:
  - 아내를 취했고
  - 아내를 얻었고
  - 아내를 데리고 왔고
  lexicon: γυνή
  rationale: 문맥상 단순히 ‘여자’가 아니라 결혼한 배우자를 가리키므로 ‘아내’로 옮기되, 고전적 ‘취하다’보다 현대 한국어에서 자연스러운 ‘맞아들이다’를 사용했습니다.
- source_word: ἔτεκεν
  english_pob_choice: she bore to him
  chosen_korean: 그 여자는 그에게서 ... 낳았습니다
  alternatives_korean:
  - 그 여자가 그에게 ...를 낳았습니다
  - 그 여자가 그에게서 ...를 출산했습니다
  - 그 여자는 그를 위해 ...를 낳았습니다
  lexicon: τίκτω
  rationale: 그리스어는 아내가 아이들을 낳는 행위를 말하므로 ‘낳았습니다’가 가장 직접적입니다. 전치사 ἐξ αὐτῆς는 ‘그에게서’로 자연스럽게 풀어 원인/출생 관계를 드러냈습니다.
- source_word: τὸν Λομνὴ καὶ Σεμεῆ
  english_pob_choice: Lomne and Semee
  chosen_korean: 로므네와 세메를
  alternatives_korean:
  - 로므네와 세메를
  - 로므네와 세메를 낳았습니다
  - 로므네와 세메를 출산했습니다
  lexicon: 고유명사 음역
  rationale: 이 두 이름은 통용되는 한국어 성경형이 뚜렷하지 않으므로, 원음에 가깝게 음역하되 문장 흐름에 맞게 목적격으로 처리했습니다.
theological_decisions:
- issue: 가계 서술의 신학적 강조
  chosen_reading: 이 절은 신학적 해설보다 족보적 사실 진술에 가깝게, 결혼과 출생의 순서를 그대로 따라 옮겼습니다.
  alternative_readings:
  - 가계를 간략히 요약해 의역하는 방식
  - 출생을 더 해설적으로 풀어 쓰는 방식
  rationale: 본문 자체가 간결한 서술이므로, 의미를 덧붙이기보다 사건의 순서를 보존하는 것이 원문 의도에 충실합니다.
  doctrine_reference: 본문 문맥상 족보/가계 서술
