  source_fidelity: 그리스어 본문에서 ἔτεκεν의 문법상 주어는 앞선 남성 단수 주어인 게르삼이며, ἐξ αὐτῆς는 ‘그 여자에게서/그 여자로 말미암아’입니다. 초안의 ‘그 여자는 그에게서’는 영어 감사본의 해석을 따르지만, 제시된 그리스어의 주어와 전치사구의 방향을 모두 바꿉니다.
  naturalness: ‘아내를 맞아들이다’와 ‘낳았습니다’ 자체는 현대 합쇼체에 자연스럽습니다. 다만 남성 주어가 출산하는 뜻으로 읽히지 않도록, 그리스어의 이례적·불명확한 계보 표현은 한국어에서 ‘그 사이에서 ... 태어났습니다’로 중립적으로 처리하는 편이 안전합니다.
  terminology: 게르삼, 로므네, 세메의 음역은 무난합니다. γυναῖκα는 이 문맥에서 ‘아내’가 적절합니다.
