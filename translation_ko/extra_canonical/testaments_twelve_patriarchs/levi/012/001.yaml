  - 출생을 더 해설적으로 풀어 쓰는 방식
  rationale: 본문 자체가 간결한 서술이므로, 의미를 덧붙이기보다 사건의 순서를 보존하는 것이 원문 의도에 충실합니다.
  doctrine_reference: 본문 문맥상 족보/가계 서술
