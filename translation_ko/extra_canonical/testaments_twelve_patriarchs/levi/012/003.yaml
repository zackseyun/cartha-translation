  rationale: 단순한 열거 연결은 ‘그리고’로 자연스럽게 옮기고, γενitive 관계는 한국어 소유 표현으로 처리했습니다.
- source_word: Μοολὶ
  english_pob_choice: Mooli
  chosen_korean: 무올리
