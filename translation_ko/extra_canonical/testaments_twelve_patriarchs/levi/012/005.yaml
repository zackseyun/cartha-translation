  text: I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt.
translation:
  language: ko
  text: 제가 여덟 살 때 가나안 땅에 들어갔고, 십팔 살 때 세겜을 죽였으며, 십구 살 때 제사장으로 섬겼고, 스물여덟 살 때 아내를 맞았으며, 마흔여덟 살 때 이집트에 들어갔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆν Χανάαν
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안 지역
  lexicon: 지명
  rationale: source의 관용적 표현을 자연스럽게 옮기되, 단순한 ‘가나안’보다 ‘땅’을 유지해 원문의 땅-정체성 강조를 살렸습니다.
- source_word: ἱεράτευσα
  english_pob_choice: I served as priest
  chosen_korean: 제사장으로 섬겼고
  alternatives_korean:
  - 제사장으로 봉사했고
  - 제사장 직분을 수행했고
  lexicon: 제의/직무
  rationale: 동사의 핵심은 제의적 직무 수행이므로 ‘섬기다’를 써서 직무성과 봉헌성을 함께 드러냈습니다.
- source_word: ἔλαβον γυναῖκα
  english_pob_choice: I took a wife
  chosen_korean: 아내를 맞았으며
  alternatives_korean:
  - 아내를 얻었으며
  - 아내를 취했으며
  lexicon: 혼인 표현
  rationale: 직역의 ‘취하다’는 한국어에서 다소 거칠 수 있어, 결혼 성립을 자연스럽게 나타내는 ‘맞다’를 선택했습니다.
- source_word: Αἴγυπτον
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 이집트 땅
  lexicon: 지명
  rationale: 현대 표준어 독자성을 위해 ‘이집트’를 사용했고, 본문 흐름상 별도 ‘땅’은 생략해도 의미가 보존됩니다.
theological_decisions:
- issue: 연대기적 자기소개를 한국어에서 어떤 시제로 옮길지
  chosen_reading: 과거 서술의 나열로 처리했습니다.
  alternative_readings:
  - 하였다체의 단일 과거형으로 통일
  - 현재형 회상으로 번역
  rationale: 원문은 과거 사건의 목록이므로 합쇼체 과거 시제를 유지해 회고적 진술의 리듬을 보존했습니다.
  doctrine_reference: 서사 텍스트의 시간 표지 보존
- issue: ‘ἱεράτευσα’의 제의적 의미를 약화시키지 않을지
  chosen_reading: ‘제사장으로 섬겼고’로 번역해 직무성과 제의성을 함께 살렸습니다.
  alternative_readings:
  - ‘제사장으로 일했고’
  - ‘제사장 직분을 맡았고’
  rationale: 이 구절은 단순 직업이 아니라 제의적 봉사를 말하므로, 교회적 관용보다 원문의 사역성을 드러내는 표현이 적절합니다.
  doctrine_reference: 제의 직무 표현
- issue: 이집트/애굽 용어 선택
  chosen_reading: ‘이집트’를 채택했습니다.
  alternative_readings:
  - ‘애굽’
  rationale: 이 본문은 지명 목록의 회고이므로 현대 독자에게 즉시 식별되는 표준 지명 ‘이집트’가 더 직접적입니다.
  doctrine_reference: 지명 표준화
