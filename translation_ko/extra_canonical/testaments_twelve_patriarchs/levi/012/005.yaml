  naturalness: 초안의 ‘제가’는 화자 자신을 낮추는 대명사여서 고대 인물의 자전적 회고에 불필요한 경어 뉘앙스를 더합니다. 독자에 대한 합쇼체는 유지하되 ‘나는’을 쓰는 편이 자연스럽습니다. 또한 ‘열여덟/열아홉’이 현대 표준어 산문에서 ‘십팔/십구’보다 자연스럽습니다.
