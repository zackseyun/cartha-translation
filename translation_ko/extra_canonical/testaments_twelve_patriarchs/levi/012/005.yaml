  text: Ὀκτὼ²⁸ ἐτῶν ἤμην ὅτε εἰσῆλθον²⁹ εἰς γῆν³⁰ Χανάαν³¹, καὶ *δέκα καὶ ὀκτὼ³² ἐτῶν³³ ὅτε³⁴ ἀπέκτεινα *τὸν Συχέμ³⁵, καὶ *δέκα καὶ ἐννέα³⁶ ἐτῶν³⁷ ἱεράτευσα³⁸, καὶ *εἴκοσι καὶ ὀκτὼ³⁹ ἐτῶν⁴⁰ ἔλαβον⁴¹ γυναῖκα· καὶ τεσσαράκοντα⁴² (καὶ ὀκτὼ)⁴³ ἐτῶν⁴⁴ εἰσῆλθον εἰς Αἴγυπτον.
