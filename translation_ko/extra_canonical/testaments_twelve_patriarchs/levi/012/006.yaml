  source_fidelity: 그리스어 Καὶ ἰδού ἐστε, τέκνα μου, τρίτη γενεά의 접속적 전환, 주의 환기, 호격 ‘내 자녀들아’, 그리고 ‘너희는 세 번째 세대’라는 단정적 서술을 충실히 반영합니다. 한국어에는 정관사가 없으므로 ‘세 번째 세대’는 원문의 관사 없는 표현 및 영어 감사본의 ‘the third generation’ 모두와 양립합니다.
  naturalness: ‘그리고 보십시오, 내 자녀들아, 너희는 세 번째 세대입니다.’는 현대 한국어에서 이해 가능하며, 합쇼체의 선언 종결과 호소적 ‘보십시오’가 자연스럽게 어울립니다.
  terminology: ‘자녀들’은 τέκνα의 친족·호칭 용법을 무리 없이 반영하고, ‘세대’는 γενεά의 기본 의미에 적합합니다. 본문에는 별도의 신학 용어 또는 고정된 고유명사 문제가 없습니다.
