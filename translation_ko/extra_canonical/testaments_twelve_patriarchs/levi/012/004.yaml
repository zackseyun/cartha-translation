  text: And in the ninety-fourth year of my life, Abraham took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day.
translation:
  language: ko
  text: 그리고 내 생애 아흔넷째 해에 아브라함이 내 딸 요게벳을 자기 아내로 맞이하였는데, 그와 내 딸이 같은 날에 태어났기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνενηκοστῷ τετάρτῳ μου ἔτει
  english_pob_choice: in the ninety-fourth year of my life
  chosen_korean: 내 생애 아흔넷째 해
  alternatives_korean:
  - 내 삶의 아흔넷 해
  - 내가 아흔넷 살이던 해
  lexicon: 연대 표현
  rationale: ἔτει는 단순한 나이보다 생애의 특정 연도를 가리키므로, 자연스럽고 서술적인 한국어인 ‘내 생애 아흔넷째 해’로 옮겼습니다.
- source_word: ἔλαβεν ... τὴν Ἰωχαβὲδ ... εἰς γυναῖκα
  english_pob_choice: Abraham took Jochebed my daughter as a wife for himself
  chosen_korean: 아브라함이 내 딸 요게벳을 자기 아내로 맞이하였는데
  alternatives_korean:
  - 아브라함이 내 딸 요게벳을 아내로 데려갔는데
  - 아브라함이 내 딸 요게벳을 자기에게 아내로 삼았는데
  lexicon: 혼인 동사/가족관계
  rationale: ἔλαβεν εἰς γυναῖκα는 혼인 결합을 뜻하므로, 한국어에서 혼인 의미를 분명히 드러내는 ‘아내로 맞이하다’를 택했습니다.
- source_word: ἐγεννήθησαν αὐτὸς καὶ ἡ θυγάτηρ μου
  english_pob_choice: because he and my daughter were born on one and the same day
  chosen_korean: 그와 내 딸이 같은 날에 태어났기 때문입니다
  alternatives_korean:
  - 그와 내 딸이 같은 날 태어났기 때문입니다
  - 그와 내 딸은 같은 날 태어났기 때문입니다
  lexicon: 수동/출생 표현
  rationale: 복수형 수동 표현의 핵심은 두 사람의 동시 출생이므로, 한국어에서는 평이한 서술로 옮겨 의미를 명확히 했습니다.
theological_decisions:
- issue: 족보적·서사적 진술을 해석하지 않고 전달할지 여부
  chosen_reading: 이 구절은 혼인과 동시 출생이라는 서사 정보를 그대로 진술하는 문장으로 처리했습니다.
  alternative_readings:
  - 상징적 의미를 덧붙여 해석하는 번역
  - 관습적 성경식 문체로 완화하는 번역
  rationale: 원문은 설명보다 사실 진술에 가까우므로, 의미를 확대하지 않고 독자가 바로 이해할 수 있도록 직접적으로 옮기는 것이 적절합니다.
  doctrine_reference: 본문-서사 존중 원칙
