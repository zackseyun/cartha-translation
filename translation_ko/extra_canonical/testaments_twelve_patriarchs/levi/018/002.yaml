id: T12P.LEV.18.2
reference: Testament of Levi 18:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ³ τότε ἐγερεῖ⁴ κύριος ἱερέα καινόν⁵, ᾧ⁶ πάντες οἱ λόγοι κυρίου⁷ ἀποκαλυφθήσονται⁸, καὶ αὐτὸς ποιήσει κρίσιν⁹ ἀληθείας¹⁰ ἐπὶ τῆς γῆς¹¹ *ἐν πλήθει¹² ἡμερῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/002.yaml
  text: Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute true judgment upon the earth for many days.
translation:
  language: ko
  text: 그때 주께서 한 새 제사장을 세우실 것입니다. 그에게 주의 모든 말씀이 계시될 것이며, 그는 많은 날 동안 땅 위에서 참된 심판을 행할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 하나님
  - 주님
  lexicon: κύριος
  rationale: 본문의 κύριος는 반복되어 나오며, 첫 절의 주체로서 하나님을 가리키는 일반적 표지이므로 간결하게 ‘주’로 옮겼습니다.
- source_word: ἱερέα καινόν
  english_pob_choice: a new priest
  chosen_korean: 새 제사장
  alternatives_korean:
  - 새로운 제사장
  - 새로운 사제
  lexicon: ἱερεύς / καινός
  rationale: καινός의 새로움과 제사장 직분을 자연스럽게 드러내기 위해 ‘새 제사장’으로 옮겼습니다.
- source_word: ἀποκαλυφθήσονται
  english_pob_choice: will be revealed
  chosen_korean: 계시될 것입니다
  alternatives_korean:
  - 드러날 것입니다
  - 나타날 것입니다
  lexicon: ἀποκαλύπτω
  rationale: ‘주의 모든 말씀’이 그에게 주어지는 수동적 계시를 살리기 위해 ‘계시될 것입니다’를 사용했습니다.
- source_word: κρίσιν ἀληθείας
  english_pob_choice: true judgment
  chosen_korean: 진리의 심판
  alternatives_korean:
  - 참된 심판
  - 진실한 판단
  lexicon: κρίσις + ἀλήθεια
  rationale: POB의 ‘true judgment’를 한국어로 옮기되, κρίσις의 공적·재판적 뉘앙스를 살려 ‘심판’으로 했습니다.
- source_word: ἐν πλήθει ἡμερῶν
  english_pob_choice: for many days
  chosen_korean: 많은 날 동안
  alternatives_korean:
  - 오랜 날 동안
  - 여러 날 동안
  lexicon: πλῆθος + ἡμέραι
  rationale: 직역적이면서도 자연스러운 시간 표현으로 ‘많은 날 동안’을 택했습니다.
theological_decisions:
- issue: 새 제사장과 계시의 관계
  chosen_reading: 새 제사장은 주의 말씀을 독자적으로 말하기보다, 먼저 ‘주의 모든 말씀이 그에게 계시되는’ 대상으로 제시됩니다.
  alternative_readings:
  - 주변의 예언적 권위가 강조된 표현
  - 단순히 교육받은 제사장
  rationale: 문장 구조상 계시의 수동태가 핵심이므로, 새 제사장의 권위는 자기 발화가 아니라 받은 계시에 근거함을 드러냈습니다.
  doctrine_reference: 계시론 / 제사장직
