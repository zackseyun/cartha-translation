id: T12P.LEV.18.14
reference: Testament of Levi 18:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Τοτὲ ἀγαλλιάσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ, κἀγὼ χαρήσομαι⁷⁴, καὶ πάντες οἱ ἅγιοι ἐνδύσονται⁷⁵ δικαιοσύνην⁷⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/014.yaml
  text: Then Abraham and Isaac and Jacob will exult, and I will rejoice, and all the holy ones will put on righteousness.
translation:
  language: ko
  text: 그때 아브라함과 이삭과 야곱이 크게 기뻐할 것이며, 나도 기뻐할 것이고, 모든 거룩한 이들은 의를 입을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  english_pob_choice: will exult
  chosen_korean: 크게 기뻐할 것입니다
  alternatives_korean:
  - 환호할 것입니다
  - 크게 즐거워할 것입니다
  lexicon: ἀγαλλιάω
  rationale: Ἀγαλλιάσεται는 단순한 기쁨보다 더 고양된 ‘환희/크게 기뻐함’의 뜻이므로, 현대 한국어에서 자연스럽고 격조를 유지하는 표현으로 옮겼습니다.
- source_word: χαρήσομαι
  english_pob_choice: will rejoice
  chosen_korean: 기뻐할 것입니다
  alternatives_korean:
  - 즐거워할 것입니다
  - 환희할 것입니다
  lexicon: χαίρω
  rationale: 영어 POB의 revised reading이 ‘rejoice’이므로, 같은 어근의 일반적 기쁨을 드러내는 ‘기뻐하다’를 택해 앞의 ‘크게 기뻐하다’와 구분했습니다.
- source_word: οἱ ἅγιοι
  english_pob_choice: the holy ones
  chosen_korean: 성도는
  alternatives_korean:
  - 거룩한 이들은
  - 거룩한 사람들은
  lexicon: ἅγιος
  rationale: 이 문맥의 ἅγιοι는 집합적 신앙 공동체를 가리키므로, 프로젝트 기본어인 ‘성도’가 가장 직접적으로 대응합니다.
- source_word: ἐνδύσονται δικαιοσύνην
  english_pob_choice: will put on righteousness
  chosen_korean: 의를 입을 것입니다
  alternatives_korean:
  - 의를 옷입을 것입니다
  - 의로 옷입을 것입니다
  lexicon: ἐνδύω + δικαιοσύνη
  rationale: ‘입다/옷입다’의 이미지를 한국어로 자연스럽게 살리면서, δικαιοσύνη를 프로젝트 기본어 ‘의’로 유지해 문맥의 윤리·구원적 상징을 보존했습니다.
theological_decisions:
- issue: 의를 ‘입는’ 이미지의 전달
  chosen_reading: 성도들이 마지막에 의를 외적으로 갖추는 종말론적 상징으로 읽히는 점을 그대로 살렸습니다.
  alternative_readings:
  - 성도들이 의롭게 된다
  - 성도들이 의의 옷을 입는다
  rationale: 원문은 ἐνδύσονται(입을 것이다)와 δικαιοσύνην(의)의 결합으로 ‘의로 옷 입음’의 이미지를 주므로, 이를 완화하지 않고 보존하는 편이 source-direct합니다.
  doctrine_reference: 종말론적 성화/의의 상징적 표상
