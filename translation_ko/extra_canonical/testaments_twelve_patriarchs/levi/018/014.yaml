  source_fidelity: ἀγαλλιάσεται와 χαρήσομαι의 강도 차이를 ‘크게 기뻐하다’와 ‘기뻐하다’로 살린 점, 그리고 ἐνδύσονται δικαιοσύνην을 ‘의를 입다’로 옮긴 점은 원문에 충실합니다. 다만 οἱ ἅγιοι는 본문 자체만으로 특정 교회 공동체인 ‘성도’로 한정되지 않으므로, 더 직접적이고 해석을 덜 덧붙이는 ‘거룩한 이들’이 적절합니다.
