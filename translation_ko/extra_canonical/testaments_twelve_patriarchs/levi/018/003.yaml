id: T12P.LEV.18.3
reference: Testament of Levi 18:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνατελεῖ¹³ ἄστρον αὐτοῦ¹⁴ ἐν οὐρανῷ ὡς βασιλέως¹⁵ φωτίζων¹⁶ φῶς γνώσεως †ἐν ἡλίῳ ἡμέρα†¹⁷, καὶ μεγαλυνθήσεται ἐν τῇ οἰκουμένῃ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/003.yaml
  text: And his star will rise in heaven like a king, giving the light of knowledge like the sun by day, and he will be magnified in the inhabited world.
translation:
  language: ko
  text: 그리고 그의 별이 하늘에서 왕처럼 떠올라 지식의 빛을 비추며, 낮의 해처럼,[a] 그는 사람이 사는 세상에서 크게 높임을 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 이 부분(직역하면 ‘해 안에서, 낮’)을 난해하거나 훼손된 어구로 표시합니다. 여기의 번역은 문맥과 영어 POB의 개연적 해석을 따라 ‘낮의 해처럼’으로 옮긴 것입니다.
    reason: 대시표(†)로 표시된 원문의 본문상 불확실성을 보존하면서, 본문에는 읽을 수 있는 개연적 번역을 제공합니다.
lexical_decisions:
- source_word: ἀνατελεῖ ἄστρον αὐτοῦ ἐν οὐρανῷ
  english_pob_choice: his star will rise in heaven
  chosen_korean: 그의 별이 하늘에 떠오르며
  alternatives_korean:
  - 그의 별이 하늘에서 솟아오르며
  - 그의 별이 하늘에 올라오며
  lexicon: ἀνατέλλω, ἄστρον, οὐρανός
  rationale: ἀνατελεῖ는 별이 ‘떠오르다/솟다’는 의미이므로 자연스러운 현대 한국어로 옮겼고, ἄστρον은 문자 그대로 ‘별’로 유지했습니다.
- source_word: ὡς βασιλέως
  english_pob_choice: like a king
  chosen_korean: 왕처럼
  alternatives_korean:
  - 왕과 같이
  - 왕같이
  lexicon: ὡς, βασιλεύς
  rationale: 비유 관계를 분명히 드러내기 위해 ‘처럼’을 택해, 별의 등장 방식이 왕의 위엄을 닮았다는 뜻을 살렸습니다.
- source_word: φωτίζων φῶς γνώσεως
  english_pob_choice: giving the light of knowledge
  chosen_korean: 지식의 빛을 비추고
  alternatives_korean:
  - 지식의 빛을 주고
  - 앎의 빛을 비추고
  lexicon: φωτίζω, φῶς, γνῶσις
  rationale: φωτίζων은 단순한 ‘빛을 주다’보다 ‘비추다’가 더 직접적이며, φῶς γνώσεως는 ‘지식의 빛’으로 소유격 구조를 보존했습니다.
- source_word: ἐν ἡλίῳ ἡμέρα
  english_pob_choice: like the sun by day
  chosen_korean: 낮의 해처럼
  alternatives_korean:
  - 낮에 비치는 해처럼
  - 낮의 태양처럼
  lexicon: ἥλιος, ἡμέρα
  rationale: 짧은 대구 구조를 살리기 위해 ‘낮의 해처럼’으로 압축했고, 해와 낮의 대비를 자연스럽게 드러냈습니다.
- source_word: μεγαλυνθήσεται ἐν τῇ οἰκουμένῃ
  english_pob_choice: he will be magnified in the inhabited world
  chosen_korean: 그는 사람이 사는 온 세상에서 크게 높임을 받게 될 것입니다
  alternatives_korean:
  - 그는 온 세상에서 크게 되실 것입니다
  - 그는 거주하는 세상에서 크게 여김을 받게 될 것입니다
  lexicon: μεγαλύνω, οἰκουμένη
  rationale: μεγαλυνθήσεται는 단순히 ‘커지다’보다 ‘크게 높임을 받다’가 수동 의미를 잘 드러내며, οἰκουμένη는 ‘사람이 사는 온 세상’으로 설명적으로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 왕적·메시아적 상징을 어떻게 처리할지
  chosen_reading: 직접적 메시아 호칭은 없으므로, 별과 왕의 비유를 유지하되 본문이 말하는 장차의 영광과 확산을 서술적으로 옮겼습니다.
  alternative_readings:
  - 메시아적 예언으로 더 강하게 풀어 쓰기
  - 상징성을 약화해 단순 천문 묘사처럼 옮기기
  rationale: 원문은 상징적 왕권과 지식의 확산을 말하지만, 여기서 호칭을 덧붙이지 않는 것이 본문의 수사와 범위를 가장 잘 보존합니다.
  doctrine_reference: 본문 내 메시아 상징 해석의 절제
- issue: ἐν ἡλίῳ ἡμέρα의 비교 구조 처리
  chosen_reading: ‘낮의 해처럼’으로 비교를 살려 별의 빛이 태양광과 유사함을 표현했습니다.
  alternative_readings:
  - ‘낮에 해처럼’
  - ‘해처럼 낮에’
  rationale: 그리스어의 비교적·시적 배열을 한국어에서도 비슷한 리듬으로 살리는 것이 가장 자연스럽습니다.
  doctrine_reference: 시적 비유의 보존
