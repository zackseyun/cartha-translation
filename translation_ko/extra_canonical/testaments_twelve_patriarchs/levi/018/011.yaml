source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δώσει τοῖς ἁγίοις φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, καὶ *πνεῦμα ἁγιωσύνης ἔσται⁶⁷ ἐπ᾿ αὐτοῖς⁶⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/011.yaml
  text: And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them.
translation:
  language: ko
  text: 그리고 그분은 거룩한 이들이 생명나무에서 먹게 하실 것이며, 거룩함의 영이 그들 위에 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἁγίοις
  english_pob_choice: the holy ones
  chosen_korean: 성도들에게
  alternatives_korean:
  - 거룩한 이들에게
  - 거룩한 사람들에게
  lexicon: ἅγιοι
  rationale: 공동체적·호칭적 뉘앙스를 살려, 단순 형용사보다 성경적 용례가 넓은 ‘성도’로 옮겼습니다.
- source_word: φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς
  english_pob_choice: to eat from the tree of life
  chosen_korean: 생명나무에서 먹을 것을
  alternatives_korean:
  - 생명나무의 열매를 먹을 것을
  - 생명나무에서 먹게 하실 것을
  lexicon: ξύλον τῆς ζωῆς
  rationale: 원문은 ‘생명나무로부터’ 먹는다는 구조이므로, POB 영어를 따르되 한국어에서는 자연스럽게 ‘먹을 것’으로 처리했습니다.
- source_word: πνεῦμα ἁγιωσύνης
  english_pob_choice: the spirit of holiness
  chosen_korean: 거룩함의 영
  alternatives_korean:
  - 거룩의 영
  - 성결의 영
  lexicon: πνεῦμα ἁγιωσύνης
  rationale: ‘ἁγιωσύνη’의 명사형을 직역해 ‘거룩함’으로 두어, 추상 개념과 영의 소속 관계를 함께 드러냈습니다.
- source_word: ἐπ᾿ αὐτοῖς
  english_pob_choice: will be upon them
  chosen_korean: 그들 위에 있을 것입니다
  alternatives_korean:
  - 그들 위에 임할 것입니다
  - 그들 위에 머물 것입니다
  lexicon: ἐπί
  rationale: 표현의 표면적 공간 비유를 살리면서도 한국어 문맥에서 자연스러운 지속 상태를 나타내도록 옮겼습니다.
theological_decisions:
- issue: ‘성도’와 ‘거룩함의 영’의 관계를 어떻게 보존할 것인가
  chosen_reading: 성도들이 생명나무의 공급을 받고, 그 위에 거룩함의 영이 임하는 종말론적 복됨으로 읽었습니다.
  alternative_readings:
  - 단순한 윤리적 성결의 표현으로 읽기
  - ‘성령’으로 명시적으로 바꾸기
  rationale: 원문에는 성령을 가리키는 명시 표지가 없으므로, 본문의 추상 명사와 종말론적 약속을 그대로 유지했습니다.
  doctrine_reference: 성령론/종말론
