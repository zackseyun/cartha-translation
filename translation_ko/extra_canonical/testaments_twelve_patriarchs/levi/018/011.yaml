review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하지만, τοῖς ἁγίοις는 특정 교회 집단을 연상시키는 ‘성도들’보다 ‘거룩한 이들’이 더 직접적이고 중립적입니다. 또한 δώσει ... φαγεῖν은 ‘먹을 것을 주다’라기보다 생명나무에서 먹도록 허락하거나 먹게 한다는 뜻입니다.
  naturalness: ‘생명나무에서 먹을 것을 주실’은 한국어에서 나무가 제공하는 먹을거리 자체를 준다는 뜻으로 들릴 수 있습니다. ‘생명나무에서 먹게 하실’이 원문의 구문과 자연스러운 한국어를 함께 살립니다.
  terminology: ἁγιωσύνη는 ‘거룩함’으로 유지하고, πνεῦμα를 별도의 교리 용어인 ‘성령’으로 바꾸지 않았습니다. ‘거룩한 이들’은 ἅγιοι의 호칭적 의미를 보존하면서도 후대 교회 용어를 불필요하게 부과하지 않습니다.
  issues:
  - severity: medium
    issue: ‘성도들에게’
    rationale: τοῖς ἁγίοις는 문자적으로 ‘거룩한 이들에게/거룩한 이들에게 속한 사람들에게’이며, ‘성도’는 한국어에서 기독교 교회 구성원을 강하게 함축합니다. 원문의 집단 지칭을 더 중립적으로 옮기는 것이 안전합니다.
  - severity: medium
    issue: ‘생명나무에서 먹을 것을 주실 것이며’
    rationale: δώσει + 여격 + 부정사 φαγεῖν은 그들이 먹도록 하신다는 의미입니다. 현 번역은 ‘먹을 것’을 주는 행위로 재구성하여 생명나무에서 먹는 행위를 약화합니다.
  - severity: low
    issue: 본문 끝의 [a] 표지
    rationale: 제공된 번역안에는 이에 대응하는 번역 주석이 없습니다. 원문 판본의 67·68 표시는 본문에 제시되지 않은 비평 장치로 보이며, 근거와 내용이 없는 새 주석 표지는 제거해야 합니다.
  revised_text: 그리고 그분은 거룩한 이들이 생명나무에서 먹게 하실 것이며, 거룩함의 영이 그들 위에 있을 것입니다.
