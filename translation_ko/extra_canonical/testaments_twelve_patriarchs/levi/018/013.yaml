  terminology: κύριος는 문맥과 영어 POB를 따라 ‘주’로 유지합니다. ἀγαπητοῖς는 ‘사랑하는 이들’보다 소유 관계를 명시한 ‘자신이 사랑하시는 이들’로 옮겨 ‘그의 사랑받는 이들’이라는 뜻을 분명히 합니다. εὐδοκέω는 여기서 ‘기뻐하다/기뻐 여기다’의 뜻이며, 별도의 교리적 함의를 부가하지 않습니다.
