  source_fidelity: 원문의 두 미래 동사(εὐφρανθήσεται, εὐδοκήσει)와 각각의 대상(그의 자녀들, 그가 사랑하는 이들), 그리고 지속 표현(ἕως αἰῶνος)을 반영해야 합니다. 초안의 ‘기뻐하시며 기뻐하실 것입니다’는 한 동사를 중복하여 문장 구조와 시제를 흐립니다.
