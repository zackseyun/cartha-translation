id: T12P.LEV.18.13
reference: Testament of Levi 18:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εὐφρανθήσεται κύριος ἐπὶ τοῖς τέκνοις αὐτοῦ⁷⁰, καὶ εὐδοκήσει⁷¹ ἐπὶ *τοῖς ἀγαπητοῖς⁷² αὐτοῦ *ἕως αἰῶνος⁷³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/013.yaml
  text: And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever.
translation:
  language: ko
  text: 주께서는 자신의 자녀들을 두고 기뻐하시고, 자신이 사랑하시는 이들을 영원토록 기뻐하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서는
  alternatives_korean:
  - 주님께서는
  - 하나님께서는
  lexicon: κύριος
  rationale: 문맥상 주어는 하나님을 가리키므로 POB의 ‘the Lord’를 한국어에서 경어 주어로 자연스럽게 옮겼습니다.
- source_word: εὐφρανθήσεται
  english_pob_choice: will rejoice
  chosen_korean: 기뻐하시고
  alternatives_korean:
  - 즐거워하시고
  - 환영하시고
  lexicon: εὐφραίνω
  rationale: 하나님이 자녀들로 인해 즐거워하신다는 능동적 기쁨을 간결하게 살렸습니다.
- source_word: ἐπὶ τοῖς τέκνοις αὐτοῦ
  english_pob_choice: over his children
  chosen_korean: 자기의 자녀들로 인해
  alternatives_korean:
  - 자기 자녀들 위에
  - 자기 자녀들 때문에
  lexicon: ἐπὶ + dative
  rationale: 여기서 ἐπὶ는 감정의 대상/원인을 나타내므로 ‘~로 인해’가 한국어에서 의미를 가장 분명하게 전달합니다.
- source_word: εὐδοκήσει ἐπὶ τοῖς ἀγαπητοῖς αὐτοῦ
  english_pob_choice: he will take pleasure in his beloved ones
  chosen_korean: 자기의 사랑하는 이들 위에 영원히 기뻐하시며 기뻐하실 것입니다
  alternatives_korean:
  - 자기의 사랑하는 이들을 기뻐하시고
  - 자기의 사랑하는 이들 안에서 만족하실 것입니다
  lexicon: εὐδοκέω
  rationale: εὐδοκέω의 ‘기뻐하다/만족하다’ 의미를 살리되, 앞의 εὐφρανθήσεται와 구분하기 위해 ‘기뻐하시며’로 다르게 옮겼습니다.
- source_word: ἕως αἰῶνος
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 끝없이
  lexicon: ἕως αἰῶνος
  rationale: 시간의 무한성을 직접적이고 표준적인 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 하나님을 가리키는 κύριος의 호칭 처리
  chosen_reading: 본문의 κύριος를 ‘주’로 번역하되, 한국어 경어 종결로 하나님의 주권적 인격성을 유지했습니다.
  alternative_readings:
  - ‘주님’으로 번역
  - ‘하나님’으로 풀어 번역
  rationale: 시적 본문에서 호칭과 동사를 분리해 자연스러운 문장 흐름을 살리면서도, 주어가 하나님임을 분명히 드러내기 위함입니다.
  doctrine_reference: 신적 호칭의 번역 일관성
- issue: 두 번째 동사 εὐδοκήσει의 반복 감정 표현
  chosen_reading: ‘기뻐하시며 기뻐하실 것입니다’로 반복을 일부 보존했습니다.
  alternative_readings:
  - 한 번만 ‘기뻐하실 것입니다’로 단순화
  - ‘만족하실 것입니다’로 의미를 재배치
  rationale: 원문은 기쁨/호의의 반복적 강조가 있으므로, 한국어에서도 중복을 완전히 제거하지 않고 시적 평행을 살렸습니다.
  doctrine_reference: 시적 평행법 보존
