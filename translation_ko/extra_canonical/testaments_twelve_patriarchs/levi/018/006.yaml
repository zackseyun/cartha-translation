  source_fidelity: Οἱ οὐρανοί의 복수는 ‘하늘들이’로 보존되었고, ἐκ τοῦ ναοῦ τῆς δόξης와 ἁγίασμα도 대체로 충실합니다. 그러나 πατρικῆς는 소유격 ‘아버지의’가 아니라 ‘아버지 같은/부성적인’이라는 성격을 뜻합니다. 또한 ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ의 생략된 동사는 앞선 ‘목소리’에 기대어 이해할 수 있으므로, 한국어에서도 그 비교가 목소리를 수식하게 처리하는 것이 적절합니다.
  naturalness: 현 문장의 ‘이는 아브라함이 이삭에게 말하듯이입니다’는 현대 한국어 문법과 문체에 맞지 않습니다. 비교구를 ‘아브라함이 이삭에게 말하듯이’로 두고 ‘아버지 같은 음성’을 수식하게 하면 자연스럽고 합쇼체에도 맞습니다.
