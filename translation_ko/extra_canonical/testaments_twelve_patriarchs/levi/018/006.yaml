  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οἱ οὐρανοὶ³⁵ ἀνοιγήσονται³⁶, καὶ³⁷ ἐκ τοῦ ναοῦ τῆς δόξης³⁸ ἥξει³⁹ ἐπ᾽⁴⁰ αὐτὸν ἁγίασμα μετὰ φωνῆς πατρικῆς ὡς ἀπὸ *Ἀβραὰμ πρὸς Ἰσαάκ⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/006.yaml
  text: The heavens will be opened, and from the temple of glory holiness will come upon him with a fatherly voice, as from Abraham to Isaac.
translation:
  language: ko
  text: 하늘들이 열릴 것이며, 아브라함이 이삭에게 말하듯이 아버지 같은 음성과 함께 영광의 성전에서 거룩함이 그에게 임할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοί
  english_pob_choice: The heavens will be opened
  chosen_korean: 하늘들이 열릴 것이며
  alternatives_korean:
  - 하늘이 열릴 것이며
  - 하늘들이 열리며
  lexicon: οὐρανός
  rationale: 복수형을 살려 ‘하늘들’로 옮기되, 한국어 문맥에서는 자연스럽게 미래 수동형으로 표현했습니다.
- source_word: ἐκ τοῦ ναοῦ τῆς δόξης
  english_pob_choice: from the temple of glory
  chosen_korean: 영광의 성전에서
  alternatives_korean:
  - 영광의 성전으로부터
  - 영광의 성전 안에서
  lexicon: ναός, δόξα
  rationale: ἔρχομαι의 출발점을 한국어 조사 ‘에서’로 자연스럽게 반영했고, ‘δόξα’는 문맥상 ‘영광’으로 유지했습니다.
- source_word: ἁγίασμα
  english_pob_choice: holiness
  chosen_korean: 거룩함
  alternatives_korean:
  - 성결
  - 거룩한 것
  lexicon: ἁγίασμα
  rationale: 영어 POB의 ‘holiness’에 맞추되, 한국어에서는 추상명사 ‘거룩함’이 가장 직접적이고 자연스럽습니다.
- source_word: μετὰ φωνῆς πατρικῆς
  english_pob_choice: with a fatherly voice
  chosen_korean: 아버지의 목소리와 함께
  alternatives_korean:
  - 아버지 같은 목소리로
  - 아버지의 음성으로
  lexicon: φωνή, πατρικός
  rationale: ‘fatherly’의 친자관계적 뉘앙스를 살리면서도, 한국어에서는 ‘아버지의 목소리’가 가장 무리 없는 표현입니다.
theological_decisions:
- issue: ἁγίασμα의 의미
  chosen_reading: 의례적/상징적 ‘성결의 상태’보다 출처가 말하는 강한 신적 거룩의 임재를 드러내는 ‘거룩함’으로 옮겼습니다.
  alternative_readings:
  - 성결
  - 성화
  rationale: POB 수정 이력이 ‘sanctification’에서 ‘holiness’로 바뀐 점을 반영해, 문맥이 요구하는 결과 상태보다 거룩 자체의 도래를 강조했습니다.
  doctrine_reference: 성결/거룩 개념의 문맥적 번역
- issue: ‘아브라함이 이삭에게’의 비교 구문
  chosen_reading: 직역에 가깝게 ‘이는 아브라함이 이삭에게 말하듯이입니다’로 처리했습니다.
  alternative_readings:
  - 아브라함이 이삭에게 하듯이
  - 아브라함이 이삭에게 말한 것처럼
  rationale: 원문의 ὡς ἀπὸ 구문이 비유적 비교를 나타내므로, 원문의 비교감을 유지하면서도 한국어 문장 흐름을 살렸습니다.
  doctrine_reference: 비유적 비교 구문
