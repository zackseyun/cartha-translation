revisions:
- from: 하늘들이 열릴 것이며, 영광의 성전에서 아버지의 목소리와 함께 거룩함이 그에게 임할 것입니다. 이는 아브라함이 이삭에게 말하듯이입니다.[a][b]
  to: 하늘들이 열릴 것이며, 아브라함이 이삭에게 말하듯이 아버지 같은 음성과 함께 영광의 성전에서 거룩함이 그에게 임할 것입니다.
  rationale: ‘아버지 같은 음성’은 πατρικῆς의 성격 형용사 의미를 보존합니다. ‘아브라함이 이삭에게 말하듯이’는 원문의 압축된 비교를 보충하되, 비교의 대상이 음성임을 한국어 어순으로 드러냅니다. 의미상 불필요하고 정의되지 않은 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:05Z'
