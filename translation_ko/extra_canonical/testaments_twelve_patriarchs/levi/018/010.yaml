  to: 그리고 그는 낙원의 문들을 열고 아담을 대적하는 위협하는 칼을 없앨 것입니다.
  rationale: 한국어 고유명사 표기와 높임법을 바로잡고, 현재분사와 κατά의 적대적 의미를 더 가깝게 반영했습니다. ‘그는’이라는 원문의 대명사적 모호성은 유지했으며, 해석적 메시아 호칭은 덧붙이지 않았습니다.
