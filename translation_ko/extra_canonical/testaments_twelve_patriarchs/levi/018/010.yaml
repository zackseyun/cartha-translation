id: T12P.LEV.18.10
reference: Testament of Levi 18:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε⁶¹ αὐτὸς⁶² ἀνοίξει τὰς θύρας⁶³ τοῦ παραδείσου, *καὶ ἀποστήσει⁶⁴ τὴν ἀπειλοῦσαν ῥομφαίαν⁶⁵ κατὰ τοῦ⁶⁶ Ἀδάμ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/010.yaml
  text: And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam.
translation:
  language: ko
  text: 그리고 그는 낙원의 문들을 열고 아담을 대적하는 위협하는 칼을 없앨 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξει τὰς θύρας τοῦ παραδείσου
  english_pob_choice: he will open the gates of paradise
  chosen_korean: 낙원의 문들을 열고
  alternatives_korean:
  - 낙원의 문을 여시고
  - 낙원의 문들을 여시고
  lexicon: θύραι / παράδεισος
  rationale: 복수형 ‘문들’을 살리고, παράδεισος는 본문의 종말론적 정원 이미지를 유지하기 위해 ‘낙원’으로 옮겼습니다.
- source_word: ἀποστήσει τὴν ἀπειλοῦσαν ῥομφαίαν
  english_pob_choice: he will remove the threatening sword
  chosen_korean: 위협하던 칼을 치워 버리실 것입니다
  alternatives_korean:
  - 위협하던 칼을 제거하실 것입니다
  - 협박하던 칼을 치워 버리실 것입니다
  lexicon: ἀποστήσει / ἀπειλοῦσαν ῥομφαίαν
  rationale: ἀποστήσει의 ‘치워 옮기다/제거하다’ 뉘앙스를 살리되, ῥομφαία는 문맥상 무기 일반을 가리키므로 자연스러운 ‘칼’로 옮겼습니다.
- source_word: κατὰ τοῦ Ἀδάμ
  english_pob_choice: against Adam
  chosen_korean: Adam을 향해
  alternatives_korean:
  - Adam에 대하여
  - Adam을 대항하여
  lexicon: κατά + genitive
  rationale: 직역적 ‘~에 대하여’보다, 위협하는 칼의 방향성을 드러내는 ‘향해’를 택했습니다.
theological_decisions:
- issue: 종말론적 구원 행위의 주체
  chosen_reading: ‘그가’는 문맥상 앞선 메시아적 인물을 가리키므로, 동작 주체를 명시하지 않고 그대로 두었습니다.
  alternative_readings:
  - 메시아께서
  - 주님께서
  rationale: 본절은 설명을 덧붙이기보다 원문의 지시 대상을 유지하는 것이 더 안전하며, 독자가 앞문맥의 인물을 따라가게 하는 편이 source-grounded입니다.
  doctrine_reference: 문맥적 대명사 해석
