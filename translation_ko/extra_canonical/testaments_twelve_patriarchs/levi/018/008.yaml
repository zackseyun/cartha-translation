  to: 그가 참으로 영원히 그의 아들들에게 주님의 위엄을 주실 것이며, 그의 계승은 세대와 세대를 거쳐 영원에 이르기까지 없을 것입니다.
  rationale: The revision renders ἐν ἀληθείᾳ as «참으로», retains both temporal formulations without conflating them, and translates διαδοχὴ αὐτοῦ as «그의 계승» without adding an interpretive image of following someone. Unsupported anchors and the non-source closing assertion have been removed.
  reviewer_model: gpt-5.6-terra
