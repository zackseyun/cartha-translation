id: T12P.LEV.18.8
reference: Testament of Levi 18:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Αὐτὸς γὰρ⁴⁵ δώσει τὴν μεγαλωσύνην⁴⁶ κυρίου⁴⁷ τοῖς υἱοῖς αὐτοῦ⁴⁸ ἐν ἀληθείᾳ εἰς τὸν αἰῶνα, καὶ οὐκ ἔσται διαδοχὴ⁴⁹ αὐτοῦ⁵⁰ εἰς γενεὰς *καὶ γενεὰς⁵¹ ἕως τοῦ αἰῶνος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/008.yaml
  text: For he will give the majesty of the Lord to his sons in truth forever, and there will be no succession to him for generations and generations, until eternity.
translation:
  language: ko
  text: 그가 참으로 영원히 그의 아들들에게 주님의 위엄을 주실 것이며, 그의 계승은 세대와 세대를 거쳐 영원에 이르기까지 없을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγαλωσύνην κυρίου
  english_pob_choice: the majesty of the Lord
  chosen_korean: 주님의 위엄
  alternatives_korean:
  - 주님의 위엄과 존귀
  - 주님의 عظ대함
  lexicon: μεγαλωσύνη
  rationale: 위엄은 높임과 장엄함을 간결하게 살리며, κυρίου는 POB의 주님/주 방식에 맞춰 주님의로 옮겼습니다.
- source_word: τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: to his sons
  chosen_korean: 자신의 아들들에게
  alternatives_korean:
  - 그의 아들들에게
  - 그 아들들에게
  lexicon: υἱός
  rationale: 문맥상 소유 대명사는 자연스럽게 ‘자신의’로 풀어 주어 한국어 흐름을 살렸습니다.
- source_word: διαδοχὴ αὐτοῦ
  english_pob_choice: there will be no succession to him
  chosen_korean: 그의 뒤를 잇는 계승도 없을 것이며
  alternatives_korean:
  - 그를 이을 후계도 없을 것이며
  - 그에게 이어질 계승도 없을 것이며
  lexicon: διαδοχή
  rationale: 영어 POB가 revision pass에서 successor를 succession으로 조정한 점을 반영해, 단순 인물 후계보다 ‘계승/승계의 지속’ 자체가 끊긴다는 뜻을 살렸습니다.
- source_word: εἰς τὸν αἰῶνα / ἕως τοῦ αἰῶνος
  english_pob_choice: forever / until eternity
  chosen_korean: 영원까지 / 영원에 이르기까지
  alternatives_korean:
  - 영원히 / 영원무궁하도록
  - 세세토록 / 영원에 이를 때까지
  lexicon: αἰών
  rationale: 두 종결 표현을 한국어에서 반복 직역하지 않고, 하나는 종결 시점(영원에 이르기까지), 하나는 지속 범위(영원까지)로 구분해 원문의 중첩을 드러냈습니다.
theological_decisions:
- issue: 주님의 위엄이 아들들에게 전달된다는 표현의 의미
  chosen_reading: 문맥상 제사장적/왕권적 권위의 승계를 암시하는 표현으로 읽되, 본문이 직접 해설하지 않는 범위에서는 ‘위엄’과 ‘계승’만 드러냈습니다.
  alternative_readings:
  - 영광의 전수로 이해
  - 권위의 법적 승계로 이해
  rationale: 본문은 ‘주님의 위엄’과 ‘계승 없음’을 병렬로 두어 전승의 지속과 단절을 말하므로, 해석을 과도하게 좁히지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: 본문 주석적 해석 범위
