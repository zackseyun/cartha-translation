source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οὗτος¹⁹ ἀναλάμψει²⁰ *ὡς ὁ²¹ ἥλιος ἐν τῇ γῇ²², καὶ ἐξαρεῖ πᾶν σκότος *ἐκ τῆς ὑπ᾽ οὐρανὸν²³ καὶ ἔσται εἰρήνη ἐν πάσῃ τῇ γῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/004.yaml
  text: He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth.
translation:
  language: ko
  text: 그는 땅 위에서 해처럼 빛날 것이며, 하늘 아래의 모든 어둠을 없앨 것이고, 온 땅에 평화가 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει ὡς ὁ ἥλιος
  english_pob_choice: will shine forth like the sun
  chosen_korean: 해처럼 땅 위에 빛나고
  alternatives_korean:
  - 해처럼 빛나고
  - 해가 빛을 발하고
  lexicon: ἀναλάμπω / ἥλιος
  rationale: ἀναλάμψει는 단순히 ‘빛나다’보다 ‘빛을 내며 드러나다, 빛나기 시작하다’의 뉘앙스가 있어, 문맥상 밝게 드러나는 이미지를 살려 ‘해처럼 땅 위에 빛나고’로 옮겼습니다.
- source_word: ἐξαρεῖ πᾶν σκότος
  english_pob_choice: will remove all darkness
  chosen_korean: 온 하늘 아래의 모든 어둠을 제거하며
  alternatives_korean:
  - 모든 어둠을 없애며
  - 모든 흑암을 제거하며
  lexicon: ἐξαίρω / σκότος
  rationale: ἐξαρεῖ는 ‘치워 버리다, 제거하다’의 의미를 직접 반영했고, σκότος는 시적·묵시적 문맥에서 ‘어둠’이 자연스러워 ‘흑암’보다 현대 독자가 이해하기 쉬운 표현을 택했습니다.
- source_word: ἐκ τῆς ὑπ᾽ οὐρανὸν
  english_pob_choice: from under heaven
  chosen_korean: 온 하늘 아래의
  alternatives_korean:
  - 하늘 아래의
  - 천하의
  lexicon: ὑπ᾽ οὐρανὸν
  rationale: ‘from under heaven’의 관용적 공간 범위를 살려 ‘온 하늘 아래의’로 옮겨, 단순한 위치 설명이 아니라 지상의 전 영역을 가리키는 표현임을 드러냈습니다.
- source_word: εἰρήνη ἐν πάσῃ τῇ γῇ
  english_pob_choice: peace in all the earth
  chosen_korean: 온 땅에 평강이 있을 것입니다
  alternatives_korean:
  - 온 땅에 평화가 있을 것입니다
  - 온 땅에 화평이 있을 것입니다
  lexicon: εἰρήνη
  rationale: εἰρήνη는 단순한 전쟁 부재보다 온전한 번영과 질서를 포함하므로, 본문과 프로젝트 용례에 맞춰 ‘평강’을 사용했습니다.
theological_decisions:
- issue: 우주적 회복의 범위
  chosen_reading: 빛과 평강이 ‘온 땅’과 ‘온 하늘 아래’에 미치는 전면적 회복으로 읽었습니다.
  alternative_readings:
  - 상징적 영적 평안만을 가리키는 것으로 축소하는 읽기
  - 특정 민족 내부의 회복으로 한정하는 읽기
  rationale: 본문은 반복적으로 ‘땅’과 ‘하늘 아래’를 사용해 범위를 넓히므로, 회복의 효과를 전체 세계적 차원으로 보존하는 번역이 원문의 힘을 가장 잘 드러냅니다.
  doctrine_reference: 종말론적 회복과 평강의 보편성
