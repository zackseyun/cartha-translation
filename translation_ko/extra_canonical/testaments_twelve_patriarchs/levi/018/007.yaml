  terminology: ‘지극히 높으신 분’ appropriately renders ὕψιστος without adding an explicit divine name. ‘성화’ is the established Korean equivalent for ἁγιασμός; ‘영’ retains the source’s ambiguity concerning capitalization/personhood.
