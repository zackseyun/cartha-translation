id: T12P.LEV.18.7
reference: Testament of Levi 18:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *δόξα ὑψίστου ἐπ’ αὐτὸν ῥηθήσεται⁴², καὶ πνεῦμα συνέσεως καὶ ἁγιασμοῦ⁴³ καταπαύσει *ἐπ’ αὐτόν⁴⁴ [ἐν τῷ ὕδατι].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/007.yaml
  text: And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him [in the water].
translation:
  language: ko
  text: 그리고 지극히 높으신 분의 영광이 그에게 선포될 것이며, 이해와 성화의 영이 그 위에 머무를 것입니다 [물속에서].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόξα ὑψίστου
  english_pob_choice: the glory of the Most High
  chosen_korean: 지극히 높으신 이의 영광
  alternatives_korean:
  - 가장 높으신 분의 영광
  - 지극히 높으신 하나님의 영광
  lexicon: δόξα; ὕψιστος
  rationale: 소유 관계를 자연스럽게 풀되, ὕψιστος는 하나님을 직접 설명하는 존칭으로 옮겨 ‘지극히 높으신 이’로 유지했습니다.
- source_word: ῥηθήσεται ἐπ’ αὐτὸν
  english_pob_choice: will be spoken over him
  chosen_korean: 그에게 선포될 것이며
  alternatives_korean:
  - 그 위에 말해질 것이며
  - 그에게 선언될 것이며
  lexicon: λέγω (passive); ἐπί
  rationale: 수동형의 ‘말해지다’보다 의례적·예언적 공기를 살리는 ‘선포되다’가 문맥에 더 적합하므로 채택했습니다.
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  english_pob_choice: a spirit of understanding and sanctification
  chosen_korean: 지혜와 거룩하게 하심의 영
  alternatives_korean:
  - 깨달음과 거룩하게 하심의 영
  - 이해와 성결의 영
  lexicon: πνεῦμα; σύνεσις; ἁγιασμός
  rationale: σύνεσις는 단순 지적 이해보다 분별을 동반한 지혜로 읽혀 ‘지혜’로 옮겼고, ἁγιασμός는 과정성보다 결과를 드러내는 ‘거룩하게 하심’으로 유지했습니다.
- source_word: καταπαύσει ἐπ’ αὐτόν
  english_pob_choice: will rest upon him
  chosen_korean: 그 위에 머무를 것입니다
  alternatives_korean:
  - 그 위에 쉴 것입니다
  - 그 위에 안식할 것입니다
  lexicon: καταπαύω; ἐπί
  rationale: 영이 임해 지속적으로 머무는 뜻을 한국어로 자연스럽게 살리기 위해 ‘머무르다’를 선택했습니다.
theological_decisions:
- issue: ὕδατι의 처리 여부
  chosen_reading: '[물속에서]를 본문에 각주형 대괄호로 유지했습니다.'
  alternative_readings:
  - 본문에서 생략
  - '[물에서]'
  - '[물 안에서]'
  rationale: 전승상 괄호 처리된 보충구이므로 본문 의미를 손상하지 않으면서도 보존 상태를 드러내기 위해 대괄호를 유지했습니다.
  doctrine_reference: textual criticism / manuscript tradition
