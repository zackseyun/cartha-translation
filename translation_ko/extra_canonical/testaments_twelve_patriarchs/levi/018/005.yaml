revisions:
- from: 하늘들은 그의 날들에 기뻐하고, 땅은 즐거워하며, 구름들은 기뻐할 것입니다. [그리고 주님의 지식이 바다의 물처럼 땅 위에 부어질 것이며] 주님의 영광의 얼굴의 천사들도 그 안에서 기뻐할 것입니다.[a][b]
  to: 하늘은 그의 시대에 기뻐하고, 땅은 즐거워하며, 구름은 기뻐할 것입니다. [또 주님에 대한 지식이 바다의 물처럼 땅 위에 부어질 것이며,] 주님의 임재의 영광에 속한 천사들도 그를 두고 기뻐할 것입니다.
  rationale: 그리스어의 예언적 미래형과 세 가지 우주적 병렬을 유지했습니다. 한국어에서 집합적으로 쓰이는 ‘하늘’과 ‘구름’은 불필요한 복수 표지 없이 자연스럽게 옮겼습니다. 대괄호는 원문 편집 상태를 보존하며, 마지막 αὐτῷ는 선행하는 남성 단수 지시 대상에 대한 ‘그를 두고’로 옮겨 원문의 관계를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:05Z'
review_pass:
  verdict: revise
  source_fidelity: 대괄호로 표시된 구절은 원문 편집상 대괄호 안에 있으므로 번역에서도 그대로 보존해야 합니다. γνῶσις κυρίου는 한국어 ‘주님의 지식’으로 쓰면 주님 자신이 지닌 지식으로 읽힐 수 있어, 원문의 ‘the knowledge of the Lord’에 맞게 ‘주님에 대한 지식’으로 명확히 했습니다. τοῦ προσώπου κυρίου는 관용적으로 ‘주님의 임재’로 옮겼으며, 그 영광에 속한 천사들이라는 중첩된 속격 관계를 유지했습니다.
  naturalness: ‘하늘들은’, ‘그의 날들에’, ‘그 안에서’는 각각 한국어 산문에서 다소 부자연스럽거나 지시 대상이 흐려질 수 있습니다. ‘하늘은’, ‘그의 시대에’, ‘그를 두고’로 다듬되, 예언적·시적 병렬과 미래 표현은 보존했습니다.
  terminology: κύριος는 일관되게 ‘주님’으로, πρόσωπον κυρίου는 문맥상 ‘주님의 임재’로 옮겼습니다. ‘영광의 천사들’은 원문의 ‘영광에 속한 천사들’이라는 관계를 살려 ‘주님의 임재의 영광에 속한 천사들’로 처리했습니다.
  issues:
