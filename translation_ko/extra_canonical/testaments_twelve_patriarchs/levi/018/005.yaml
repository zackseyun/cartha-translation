id: T12P.LEV.18.5
reference: Testament of Levi 18:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οἱ οὐρανοὶ ἀγαλλιάσονται²⁴ ἐν ταῖς ἡμέραις αὐτοῦ²⁵, καὶ ἡ γῆ χαρήσεται²⁶, καὶ αἱ²⁷ †νεφέλαι²⁸ εὐφρανθήσονται²⁹. [καὶ ἡ γνῶσις κυρίου³⁰ ἐκχυθήσεται³¹ ἐπὶ τῆς γῆς ὡς³² ὕδωρ θαλασσῶν³³] *καὶ οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου εὐφρανθήσονται ἐν αὐτῷ³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/005.yaml
  text: The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; [and the knowledge of the Lord will be poured out upon the earth like the water of the seas;] and the angels of the glory of the Lord's presence will be glad in him.
translation:
  language: ko
  text: 하늘들은 그의 날들에 기뻐하고, 땅은 즐거워하며, 구름들은 기뻐할 것입니다. [그리고 주님의 지식이 바다의 물처럼 땅 위에 부어질 것이며] 주님의 영광의 얼굴의 천사들도 그 안에서 기뻐할 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοί
  english_pob_choice: The heavens
  chosen_korean: 하늘들은
  alternatives_korean:
  - 하늘이
  - 하늘들
  lexicon: οὐρανός
  rationale: 복수형을 살려 하늘들의 집합적 반응을 드러내기 위해 ‘하늘들’로 옮겼습니다.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  english_pob_choice: in his days
  chosen_korean: 그의 날들에
  alternatives_korean:
  - 그의 시대에
  - 그가 다스리는 날에
  lexicon: ἡμέρα
  rationale: 직역에 가깝게 유지하되, 메시아적 통치 기간을 자연스럽게 드러내는 표현으로 처리했습니다.
- source_word: αἱ νεφέλαι εὐφρανθήσονται
  english_pob_choice: the clouds will rejoice
  chosen_korean: 구름들은 기뻐할 것입니다
  alternatives_korean:
  - 구름이 즐거워할 것입니다
  - 구름들이 기뻐할 것입니다
  lexicon: νεφέλη
  rationale: 앞선 복수 주어들과 대응되도록 복수형을 유지했고, εὐφρανθήσονται의 정서적 강도를 ‘기뻐하다’로 살렸습니다.
- source_word: ἡ γνῶσις κυρίου ἐκχυθήσεται
  english_pob_choice: the knowledge of the Lord will be poured out
  chosen_korean: 주님의 지식이 ... 부어질 것이며
  alternatives_korean:
  - 주님의 지식이 ... 퍼질 것이며
  - 주님을 아는 지식이 ... 부어질 것이며
  lexicon: γνῶσις / ἐκχέω
  rationale: 지식을 ‘부어지다’로 옮겨 원문 은유를 보존했고, ‘주님의 지식’은 소유격을 직접 반영했습니다.
theological_decisions:
- issue: 예언적 우주 반응과 지식의 유출 이미지
  chosen_reading: 하늘, 땅, 구름, 천사들이 메시아적 날들에 기뻐하고, 주님의 지식이 땅에 널리 확산되는 그림을 그대로 살렸습니다.
  alternative_readings:
  - 보다 평이하게 우주 만물의 기쁨으로 완화할 수 있음
  - ‘주님을 아는 지식’으로 해석을 풀어 쓸 수 있음
  rationale: 이 절은 단순한 시적 장식이 아니라 종말론적 기쁨과 계시의 확산을 함께 제시하므로, 은유와 병치를 약화하지 않았습니다.
  doctrine_reference: 종말론적 회복 / 계시의 확산
- issue: ‘주님의 영광의 얼굴의 천사들’
  chosen_reading: ‘주님의 영광의 얼굴의 천사들’을 직역해, 하나님의 임재를 둘러싼 천상 존재들의 표현을 유지했습니다.
  alternative_readings:
  - ‘주님의 임재의 영광을 지닌 천사들’처럼 의역할 수 있음
  - ‘얼굴’ 표현을 생략할 수 있음
  rationale: 원문은 성구적 표현을 겹쳐 쓰므로, ‘얼굴’을 지워버리면 하나님의 임재와 영광의 촉각적 이미지가 약해집니다.
  doctrine_reference: 하나님의 임재 / 천상 예전
