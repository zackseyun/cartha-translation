  - severity: medium
    issue: ‘주님의 영광의 얼굴의 천사들’의 비자연스러운 속격 중첩
    rationale: 원문의 복합 속격을 기계적으로 연결하면 뜻이 불명료합니다. ‘얼굴’은 여기서 임재를 뜻하는 관용적 용법이므로 이를 드러내야 합니다.
  - severity: low
    issue: 무근거의 [a][b] 표지
    rationale: 제시된 초안에는 이에 대응하는 각주가 없으며, 원문에서 보존해야 할 편집 표지는 대괄호 처리된 구절입니다. 표지를 제거해 구조적 혼선을 막습니다.
  revised_text: 하늘은 그의 시대에 기뻐하고, 땅은 즐거워하며, 구름은 기뻐할 것입니다. [또 주님에 대한 지식이 바다의 물처럼 땅 위에 부어질 것이며,] 주님의 임재의 영광에 속한 천사들도 그를 두고 기뻐할 것입니다.
