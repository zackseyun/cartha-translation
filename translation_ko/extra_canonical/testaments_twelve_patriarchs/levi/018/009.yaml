id: T12P.LEV.18.9
reference: Testament of Levi 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐπὶ *τῆς ἱερωσύνης⁵² αὐτοῦ⁵³ *τὰ ἔθνη⁵⁴ πληθυνθήσονται⁵⁵ ἐν γνώσει ἐπὶ τῆς γῆς, καὶ φωτισθήσονται διὰ χάριτος κυρίου. [ὁ δὲ Ἰσραὴλ ἐλαττωθήσεται ἐν ἀγνωσίᾳ καὶ σκοτισθήσεται ἐν πένθει]⁵⁶. ἐπὶ τῆς ἱερωσύνης αὐτοῦ ἐκλείψει⁵⁷ ἡ⁵⁸ ἁμαρτία καὶ οἱ ἄνομοι *καταπαύσουσιν εἰς κακά⁵⁹, [οἱ δὲ δίκαιοι καταπαύσουσιν ἐν αὐτῷ]⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/009.yaml
  text: And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. [But Israel will be diminished in ignorance and darkened in mourning.] During his priesthood sin will cease, and the lawless will cease from evil; [and the righteous will rest in him].
translation:
  language: ko
  text: 그리고 그의 제사직 동안에는 땅 위에서 민족들이 지식 안에서 크게 불어나고, 주의 은혜로 밝아질 것입니다. [그러나 이스라엘은 무지 가운데 줄어들고 애통 가운데 어두워질 것입니다.] 그의 제사직 동안에는 죄가 그치고, 불법한 자들은 악에서 그칠 것이며, [의로운 자들은 그 안에서 쉬게 될 것입니다].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερωσύνη
  english_pob_choice: priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장 직분
  - 사제직
  lexicon: ἱερωσύνη
  rationale: 문맥상 아론적/성직 제도보다 직무 자체를 가리키므로, POB의 'priesthood'를 자연스럽게 살리면서도 한국어에서 제의적 직분을 드러내는 '제사직'을 택했습니다.
- source_word: πληθυνθήσονται ἐν γνώσει
  english_pob_choice: will be multiplied in knowledge
  chosen_korean: 지식 안에서 크게 불어나고
  alternatives_korean:
  - 지식에서 많아지고
  - 지식으로 충만해지고
  lexicon: πληθυνθήσονται
  rationale: ‘많아지다’보다 ‘크게 불어나다’가 πληθυνθήσονται의 증대 뉘앙스를 더 자연스럽게 담으며, ἐν γνώσει는 결과/영역을 살려 '지식 안에서'로 옮겼습니다.
- source_word: διὰ χάριτος κυρίου
  english_pob_choice: by the grace of the Lord
  chosen_korean: 주의 은혜로
  alternatives_korean:
  - 주님의 은혜로
  - 주의 은혜를 통해
  lexicon: χάρις
  rationale: 매개 수단의 διά를 한국어의 부사격 '—로'로 간결하게 살렸고, κυρίου는 이 문맥에서 야훼의 직접 인용이 아니라 '주'로 두어 고유한 표지를 과도하게 부여하지 않았습니다.
- source_word: ἐκλείψει
  english_pob_choice: will cease
  chosen_korean: 그치고
  alternatives_korean:
  - 사라지고
  - 멈추고
  lexicon: ἐκλείπειν
  rationale: POB가 revision에서 'cease'로 정리한 의미를 따라, 죄가 더 이상 작동하지 않게 된다는 뜻을 한국어 동사 '그치다'로 간명하게 표현했습니다.
theological_decisions:
- issue: 후반부 괄호 구절의 보존
  chosen_reading: 본문의 두 괄호 구절을 그대로 유지했습니다.
  alternative_readings:
  - 괄호 구절을 본문에서 제거
  - 각주로만 처리
  rationale: 원문과 POB 모두에서 괄호는 전승상 보조/변이 전통을 표시하므로, 본문 의미를 훼손하지 않으면서도 문헌적 긴장을 드러내기 위해 보존했습니다.
  doctrine_reference: 문헌비평적 표지 보존 원칙
- issue: ‘불법한 자들’과 ‘악’의 관계
  chosen_reading: '''불법한 자들은 악에서 그칠 것이며''로 옮겨, ἄνομοι와 κακά의 대조를 살렸습니다.'
  alternative_readings:
  - '''불법한 자들은 악을 그만둘 것이며'''
  - '''율법 없는 자들은 악을 멈출 것이며'''
  rationale: ἄνομοι는 단순한 도덕적 무법자를 넘어 하나님의 질서에 반대하는 자들을 가리키므로 '불법한 자들'을 유지했고, εἰς κακά는 목적지/방향의 표현으로서 '악에서'를 택해 과도한 해석을 피했습니다.
  doctrine_reference: 율법/불법 표상과 종말론적 정화
