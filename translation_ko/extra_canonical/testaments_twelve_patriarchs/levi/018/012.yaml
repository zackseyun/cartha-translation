  to: 그리고 벨리알은 그에게 묶일 것이며, 그는 자기 자녀들에게 악한 영들을 밟을 권세를 줄 것입니다.
  rationale: 원문에 근거 없는 주체 높임을 제거하고, 미래 시제와 위임된 권세의 의미는 그대로 유지했습니다.
