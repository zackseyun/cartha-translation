id: T12P.LEV.18.12
reference: Testament of Levi 18:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ὁ Βελίαρ δεθήσεται ὑπ᾿ αὐτοῦ, καὶ δώσει ἐξουσίαν τοῖς τέκνοις αὐτοῦ⁶⁹ πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/012.yaml
  text: And Beliar will be bound by him, and he will give authority to his children to trample on the evil spirits.
translation:
  language: ko
  text: 그리고 벨리알은 그에게 묶일 것이며, 그는 자기 자녀들에게 악한 영들을 밟을 권세를 줄 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리알
  alternatives_korean:
  - 벨리아르
  - 벨리알(음역 유지)
  lexicon: 고유명사
  rationale: 원문 고유명사 Βελίαρ을 음역해 유지했습니다. 통상적 성경 인명과 다른 묵시문헌적 명칭이므로 의미화하지 않고 그대로 옮기는 것이 적절합니다.
- source_word: δεθήσεται ὑπ᾿ αὐτοῦ
  english_pob_choice: will be bound by him
  chosen_korean: 그에게 묶일 것이며
  alternatives_korean:
  - 그에게 결박될 것이며
  - 그에 의해 묶일 것이며
  lexicon: δέω
  rationale: 수동태의 구속/포박 이미지를 살리되, 한국어에서는 자연스럽게 ‘묶이다’로 옮겼습니다. ‘결박되다’도 가능하지만 문맥상 지나치게 강한 법적 뉘앙스를 줄 수 있습니다.
- source_word: ἐξουσίαν
  english_pob_choice: authority
  chosen_korean: 권세
  alternatives_korean:
  - 권위
  - 권한
  - 능력
  lexicon: ἐξουσία
  rationale: 원문의 ‘권한’보다 더 강한 위임된 통치력의 뉘앙스를 살려 ‘권세’를 택했습니다. 이는 자녀들이 악한 영들을 제압하는 맥락에도 잘 맞습니다.
- source_word: τὰ πονηρὰ πνεύματα
  english_pob_choice: the evil spirits
  chosen_korean: 악한 영들
  alternatives_korean:
  - 악한 영들을
  - 악령들을
  - 그 악한 영들
  lexicon: πνεῦμα
  rationale: πνεύματα를 문맥상 영적 존재로 보고 ‘영들’로 옮겼으며, πονηρά는 도덕적 악성을 드러내는 ‘악한’으로 처리했습니다. 영어 POB의 정관사 해석에 따라 집합적 의미를 유지했습니다.
theological_decisions:
- issue: Belial의 종말론적 패배와 권세 위임
  chosen_reading: 벨리알이 결박되고 그 자녀들이 악한 영들을 밟도록 권세를 받는다는 종말론적 승리 선언으로 읽었습니다.
  alternative_readings:
  - 도덕적 비유로 완화하는 읽기
  - 단순한 내적 승리의 상징으로 축소하는 읽기
  rationale: 원문은 구체적 영적 존재와 권세 위임을 말하므로 상징화로 약화하지 않고 그대로 반영했습니다.
  doctrine_reference: 묵시문헌의 영적 전쟁과 메시아적 승리
