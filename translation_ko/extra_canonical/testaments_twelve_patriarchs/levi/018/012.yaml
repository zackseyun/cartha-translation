review_pass:
  verdict: revise
  source_fidelity: 원문의 미래 시제와 수동 표현, 그리고 ‘벨리알—그—그의 자녀들’의 지시 관계는 대체로 충실히 반영되었습니다. 다만 δεύτε 절의 주어에 원문에는 없는 높임을 부여한 ‘주실 것입니다’는 그리스어의 단순 미래형 δώσει에 비해 해석적·문체적 추가입니다.
  naturalness: ‘그에게 묶일 것이며’와 ‘악한 영들을 밟을 권세’는 자연스럽습니다. 그러나 ‘그는 … 주실 것입니다’는 앞의 비존대 서술 ‘묶일 것이며’와 호응하지 않고, 원문이 높임 여부를 표시하지 않는 상황에서 불필요하게 높임을 확정합니다.
  terminology: ‘벨리알’은 Βελίαρ의 통용 음역으로 허용되며, ‘권세’는 ἐξουσίαν의 문맥상 적절합니다. ‘악한 영들’도 τὰ πονηρὰ πνεύματα를 충실하게 옮깁니다.
  issues:
  - severity: medium
    issue: ‘주실 것입니다’의 주체 높임
    rationale: 그리스어 δώσει는 단순 미래 직설법으로 높임을 나타내지 않습니다. 한국어 합쇼체의 문장 종결은 유지하되, 원문에 없는 주체 높임을 피하여 ‘줄 것입니다’로 고치는 것이 안전합니다.
  revised_text: 그리고 벨리알은 그에게 묶일 것이며, 그는 자기 자녀들에게 악한 영들을 밟을 권세를 줄 것입니다.
  revised_footnotes: []
