  source_fidelity: 그리스어 ἐκδίκησιν αὐτῶν παρὰ κυρίου는 주님에게서 오는 ‘그들의’ ἐκδίκησις가 발생한 뒤를 뜻합니다. 초안의 ‘보복’은 한국어에서 그들이 능동적으로 행하는 복수로도 쉽게 읽혀, 신적 출처 및 본문이 말하는 보응의 방향을 흐릴 수 있습니다. ‘보응이 ... 내린’은 원문의 출처와 사건성을 더 충실히 나타냅니다. ἐκλείψει는 제사장직의 소멸/종식을 가리키므로 ‘사라질 것입니다’는 적절합니다.
  naturalness: ‘그들의 보복이 주님에게서 이루어진’은 한국어에서 보복의 주체와 출처가 다소 어색하게 충돌합니다. ‘그들에게 주님에게서 보응이 내린’은 현대 표준어 합쇼체에서 자연스럽고 간결합니다.
  terminology: κύριος는 본문의 일반적 신적 칭호에 맞추어 ‘주님’으로 유지했습니다. ἱερωσύνη는 제사장 직분/제도 전체를 가리킬 수 있는 ‘제사장직’으로 유지했습니다. ‘보응’은 ἐκδίκησις의 응보적 의미를 보존하면서 한국어 ‘보복’의 능동적 복수 뉘앙스를 피합니다.
