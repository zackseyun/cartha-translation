  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹ μετὰ τὸ γενέσθαι τὴν ἐκδίκησιν αὐτῶν παρὰ κυρίου, *ἐκλείψει ἡ ἱερωσύνη².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/001.yaml
  text: And after their vengeance has come from the Lord, the priesthood will fail.
translation:
  language: ko
  text: 그리고 그들의 보복이 주님에게서 이루어진 뒤에는, 제사장직이 사라질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκδίκησιν
  english_pob_choice: vengeance
  chosen_korean: 보복
  alternatives_korean:
  - 복수
  - 응징
  lexicon: ἐκδίκησις
  rationale: 문맥상 단순 감정보다 실행된 보응의 의미가 강하므로, POB의 'vengeance'를 너무 문학적으로 완화하지 않고 ‘보복’으로 옮겼습니다.
- source_word: παρὰ κυρίου
  english_pob_choice: from the Lord
  chosen_korean: 주님에게서
  alternatives_korean:
  - 주님으로부터
  - 야훼에게서
  lexicon: παρά + genitive
  rationale: 전치사 παρά의 출처 의미를 살려 ‘-에게서’로 옮겼고, 본문이 신적 출처를 말하므로 ‘주님’으로 자연스럽게 처리했습니다.
- source_word: ἐκλείψει
  english_pob_choice: will fail
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 끝날 것입니다
  - 쇠할 것입니다
  - 무너질 것입니다
  lexicon: ἐκλείπω
  rationale: 제도적 소멸을 가리키므로 ‘사라질 것입니다’가 제사장직의 존속 상실을 가장 직접적으로 드러냅니다.
- source_word: ἱερωσύνη
  english_pob_choice: the priesthood
  chosen_korean: 제사장직
  alternatives_korean:
  - 제사장직분
  - 제사장 제도
  - 제사직
  lexicon: ἱερωσύνη
  rationale: 직분이 아니라 공동체적 직책/체계가 무너진다는 뜻이므로 ‘제사장직’이 간결하고도 의미를 보존합니다.
theological_decisions:
- issue: 주님 from source κύριος의 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 직접적인 יהוה 인용 표지가 없고, 서술문 안에서 일반적인 신적 칭호로 기능하므로 ‘주님’을 사용했습니다.
  doctrine_reference: Source-sensitive divine designation
- issue: 보복/응징의 신학적 톤
  chosen_reading: 보복
  alternative_readings:
  - 응징
  - 심판
  rationale: 본문은 죄에 대한 추상적 심판보다 실제로 내려진 되갚음의 사건을 말하므로, 도덕적 완화 없이 보복의 긴장을 유지했습니다.
  doctrine_reference: Retribution in apocalyptic-priestly judgment
