  rationale: 원문의 어휘와 통사에 맞추어 6:3의 권고 행위, 6:8의 재앙을 위한 신적 판결, 6:9의 아브라함 소유 양 떼, 6:10의 추방 행위를 바로잡았습니다. 6:7과 6:8의 난해함은 해석으로 해소하지 않고 각주로 보존했습니다. 각주 표지는 영어 POB 감사 추적에 지정된 절에 재배치했습니다.
