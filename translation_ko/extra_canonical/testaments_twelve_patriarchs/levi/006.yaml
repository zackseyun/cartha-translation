base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006.yaml
  text: 1 And as I was going to my father[a], I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, on the right of Abim. 2 And I kept these words in my heart. 3 After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous on account of the abomination which they had committed against my sister. 4 And I killed Shechem first, and Simeon killed Emmor. 5 And after this my brothers came and struck that city with the edge of the sword. 6 And my father heard these things, and being angry he was grieved because they had accepted circumcision and died, and in his blessings he passed over us. 7 For we sinned, because we had done this contrary to his judgment, though he became weak on that day. 8 But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them. 9 And
    they pursued Abraham our father when he was a stranger, and they oppressed his flocks when they were swollen with increase, and they cruelly mistreated Eblan his home-born servant. 10 And indeed in this way they used to act toward all strangers, seizing foreign women by force and driving them away[b][c][d][e]. 11 But the wrath of God came upon them completely.
  footnotes:
  - marker: a
    text: Or, 'he overlooked us in the blessings,' that is, Jacob did not favor Levi and Simeon when he pronounced blessings.
    reason: lexical_alternative
    anchor_ref: '6:6'
  - marker: e
    text: The Greek verb rendered 'became weak' is difficult and may suggest that Jacob was softened, weakened, or overcome on that day.
    reason: textual_variant
    anchor_ref: '6:7'
  - marker: d
    text: This verse is textually difficult. The Greek appears to say that the men of Shechem intended to treat Sarah and Rebekah as they had treated Dinah.
    reason: textual_variant
    anchor_ref: '6:8'
  - marker: c
    text: The name 'Eblan' is uncertain in transmission; the sense is that a household-born servant of Abraham was harshly abused.
    reason: textual_variant
    anchor_ref: '6:9'
  - marker: b
    text: Compare the idiom 'wrath ... to the end' for complete or final judgment.
    reason: cross_reference
    anchor_ref: '6:11'
translation:
  language: ko
  text: 1 내가 아버지에게 가고 있을 때 청동 방패 하나를 발견했습니다. 그래서 그 산의 이름은 아스피스인데, 게발 가까이, 아빔의 오른쪽에 있습니다. 2 나는 이 말들을 마음에 간직했습니다. 3 그 후 나는 아버지와 르우벤에게, 에므르의 아들들에게 할례를 받지 말라고 말하라고 권했습니다. 나는 그들이 내 누이에게 저지른 그 가증한 일 때문에 열심을 품었기 때문입니다. 4 내가 먼저 세겜을 죽였고, 시므온이 에므르를 죽였습니다. 5 그 후 내 형제들이 와서 칼날로 그 성읍을 쳤습니다. 6 내 아버지가 이 일들을 들으시고 화를 내시며 슬퍼하셨습니다. 그들이 할례를 받아 죽었기 때문입니다. 또 그분은 축복하실 때 우리를 지나쳐 버리셨습니다.[a] 7 우리가 그의 판단에 어긋나게 이 일을 했으므로 죄를 지었습니다. 비록 그가 그날 약해지셨지만 말입니다.[e] 8 그러나 나는 그것이 그들에게 재앙을 내리려는 하나님의 판결이라고 보았습니다. 그들이 우리 누이 디나에게 했던 것처럼 사라와 리브가에게도 그렇게 하려고 했기 때문입니다. 주님께서 그들을 막으셨습니다.[d] 9 그들은 나그네였던 우리 조상 아브라함을 추격했고, 그의 양 떼가 불어나 있을 때 그것들을 압박했으며, 그의 집에서 태어난 종 에블란을 매우 잔혹하게 학대했습니다.[c] 10 또한 그들은 모든 나그네에게도 이와 같이 행하면서, 외국 여자들을 힘으로 붙잡아 내쫓았습니다. 11 하나님의 진노가 그들에게 끝까지 미쳤습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분은 축복하실 때 우리를 간과하셨습니다.’ 곧 야곱이 축복을 선포할 때 레위와 시므온을 특별히 호의적으로 대하지 않았다는 뜻입니다.
    reason: lexical_alternative
  - marker: e
    text: ‘약해지셨다’로 옮긴 그리스어 동사는 난해합니다. 야곱이 그날 누그러졌거나, 쇠약해졌거나, 압도되었다는 뜻일 수 있습니다.
    reason: textual_variant
  - marker: d
    text: 이 절은 본문상 난해합니다. 그리스어는 세겜 사람들이 디나에게 한 것처럼 사라와 리브가에게도 하려고 했다고 말하는 것으로 보입니다.
    reason: textual_variant
  - marker: c
    text: ‘에블란’이라는 이름은 전승 과정에서 불확실합니다. 뜻은 아브라함의 집에서 태어난 종이 가혹한 학대를 받았다는 것입니다.
    reason: textual_variant
  - marker: b
    text: ‘진노가 … 끝까지 미쳤다’는 관용적 표현과 비교하십시오. 완전하거나 최종적인 심판을 뜻할 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  english_pob_choice: a bronze shield
  chosen_korean: 청동 방패
  alternatives_korean:
  - 놋 방패
  - 청동으로 만든 방패
  lexicon: LSJ
  rationale: ἀσπίς는 ‘방패’이고 χαλκῆν은 청동 재질을 가리키므로, etiological 연결을 살리면서 자연스러운 현대어로 옮겼습니다.
- source_word: συνετήρουν ... ἐν τῇ καρδίᾳ μου
  english_pob_choice: I kept ... in my heart
  chosen_korean: 마음에 간직했습니다
  alternatives_korean:
  - 마음속에 지켰습니다
  - 마음에 품었습니다
  lexicon: LSJ
  rationale: 내면에 보존한다는 관용 표현이므로, ‘간직했습니다’로 간결하게 살렸습니다.
- source_word: παρεῖδεν ἡμῖν
  english_pob_choice: he passed over us
  chosen_korean: 우리를 지나쳐 버리셨습니다
  alternatives_korean:
  - 우리를 간과하셨습니다
  - 우리를 돌아보지 않으셨습니다
  lexicon: LSJ
  rationale: 축복 맥락에서 단순 무시는 약하므로, 축복 중에서 우리를 비껴 지나갔다는 느낌을 살렸습니다.
- source_word: τὰς ξένας
  english_pob_choice: foreign women
  chosen_korean: 외국 여자들
  alternatives_korean:
  - 이방 여인들
  - 타국 여자들
  lexicon: LSJ
  rationale: ξένας는 ‘외국인/타자’의 여성형 복수로, 본문이 낯선 여인들의 강제 연행을 말하므로 ‘외국 여자들’로 직역했습니다.
theological_decisions:
- issue: 6–11절의 책임과 섭리의 긴장
  chosen_reading: 야곱의 판단에 어긋나게 행한 죄책을 인정하면서도, 그 사건을 그들에게 내리는 하나님의 판결로 함께 진술했습니다.
  alternative_readings:
  - 행위를 전적으로 정당화하는 해석
  - 오직 인간의 죄로만 보는 해석
  rationale: 본문은 ‘우리가 죄를 지었습니다’와 ‘하나님의 판결’ 두 진술을 함께 유지하므로, 어느 한쪽으로 정리하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 6:8의 사라와 리브가 언급
  chosen_reading: 본문의 그리스어가 사라와 리브가를 명시하므로, 난해하더라도 그 지시를 그대로 옮겼습니다.
  alternative_readings:
  - 본문을 생략하거나 완화하여 옮김
  - 일반적인 족장 여성들로만 처리
  rationale: 전승상 난해하지만, 감추기보다 증거를 드러내는 것이 POB의 투명성 원칙에 맞습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
