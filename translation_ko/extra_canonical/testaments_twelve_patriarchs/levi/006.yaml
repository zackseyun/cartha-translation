  revised_text: 1 내가 아버지에게 가고 있을 때 청동 방패 하나를 발견했습니다. 그래서 그 산의 이름은 아스피스인데, 게발 가까이, 아빔의 오른쪽에 있습니다. 2 나는 이 말들을 마음에 간직했습니다. 3 그 후 나는 아버지와 르우벤에게, 에므르의 아들들에게 할례를 받지 말라고 말하라고 권했습니다. 나는 그들이 내 누이에게 저지른 그 가증한 일 때문에 열심을 품었기 때문입니다. 4 내가 먼저 세겜을 죽였고, 시므온이 에므르를 죽였습니다. 5 그 후 내 형제들이 와서 칼날로 그 성읍을 쳤습니다. 6 내 아버지가 이 일들을 들으시고 화를 내시며 슬퍼하셨습니다. 그들이 할례를 받아 죽었기 때문입니다. 또 그분은 축복하실 때 우리를 지나쳐 버리셨습니다.[a] 7 우리가 그의 판단에 어긋나게 이 일을 했으므로 죄를 지었습니다. 비록 그가 그날 약해지셨지만 말입니다.[e] 8 그러나 나는 그것이 그들에게 재앙을 내리려는 하나님의 판결이라고 보았습니다. 그들이 우리 누이 디나에게 했던 것처럼 사라와 리브가에게도 그렇게 하려고 했기 때문입니다. 주님께서 그들을 막으셨습니다.[d] 9 그들은 나그네였던 우리 조상 아브라함을 추격했고, 그의 양 떼가 불어나 있을 때 그것들을 압박했으며, 그의 집에서 태어난 종 에블란을 매우 잔혹하게 학대했습니다.[c] 10 또한 그들은 모든 나그네에게도 이와 같이 행하면서, 외국 여자들을 힘으로 붙잡아 내쫓았습니다. 11 하나님의 진노가 그들에게 끝까지 미쳤습니다.[b]
