  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διότι ἡμάρτομεν ἐπειδὴ³⁵ παρὰ γνώμην αὐτοῦ τοῦτο πεποιήκαμεν³⁶, καίγε ἐμαλακίσθη³⁷ ἐν τῇ ἡμέρᾳ ἐκείνῃ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/007.yaml
  text: For we sinned, because we had done this contrary to his will, although he became weak on that day.
translation:
  language: ko
  text: 우리가 죄를 지은 것은 그의 뜻에 어긋나게 이 일을 했기 때문입니다. 그러나 그날 그는 약해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ γνώμην αὐτοῦ
  english_pob_choice: contrary to his will
  chosen_korean: 그의 뜻에 어긋나게
  alternatives_korean:
  - 그의 의도에 반하여
  - 그의 판단에 반하여
  - 그의 뜻을 거슬러
  lexicon: παρά + γνώμη
  rationale: 영어 POB의 will을 따라, γνώμη를 단순한 ‘판단’보다 인격적 의지·뜻으로 풀어 원문의 행위가 그에게 반대되는 것이었음을 드러냈습니다.
- source_word: ἐπειδὴ
  english_pob_choice: because
  chosen_korean: ~때문입니다
  alternatives_korean:
  - ~하였으므로
  - ~이기에
  - ~때문에
  lexicon: ἐπειδή
  rationale: 원인절을 한국어 자연문으로 평이하게 연결해, 죄의 이유를 분명히 전달했습니다.
- source_word: ἐμαλακίσθη
  english_pob_choice: he became weak
  chosen_korean: 약해졌습니다
  alternatives_korean:
  - 연약해졌습니다
  - 기력이 쇠했습니다
  - 몸이 약해졌습니다
  lexicon: μαλακίζω
  rationale: 동사의 직접적 의미를 따라 신체적/상태적 약화를 간결하게 옮겼습니다.
theological_decisions:
- issue: 죄의 원인 진술과 약화 진술의 병치
  chosen_reading: 죄는 그분의 뜻에 어긋난 행위에서 비롯되었고, 이어지는 약화는 같은 날의 사건으로 별도 진술됩니다.
  alternative_readings:
  - 약화가 죄의 직접 원인이라는 해석
  - ‘그러나’에 더 강한 인과를 부여하는 해석
  rationale: 본문은 ἐπειδὴ로 죄의 원인을 밝히고, καίγε로 양보/대조를 더한 뒤 별개의 상태 변화(약해짐)를 덧붙이므로 두 진술을 섞지 않았습니다.
  doctrine_reference: 문맥상 사건 서술; 교리적 확정이 아니라 원문 구조 보존
