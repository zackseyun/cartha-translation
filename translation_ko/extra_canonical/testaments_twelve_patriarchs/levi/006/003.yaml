  - severity: medium
    issue: ἐζήλωσα를 ‘분노하였다’로 단정
    rationale: 문맥상 격분의 함의는 가능하지만, ζηλόω의 핵심 범위는 열심·열정 및 질투를 포함합니다. 본문은 중립적으로 ‘열심을 내었다’로 두고 각주에서 범위를 밝혀야 합니다.
  - severity: low
    issue: 목적절의 한국어 표현
    rationale: ‘말하게 하였습니다’보다 ‘말하도록 … 의논하였습니다’가 ἵνα εἴπῃ의 목적 관계를 더 자연스럽고 명료하게 나타냅니다.
