id: T12P.LEV.6.3
reference: Testament of Levi 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Μετὰ δὲ τοῦτο συνεβούλευσα⁵ *τῷ πατρί μου καὶ⁶ τῷ⁷ Ῥουβὴμ⁸ ἵνα εἴπῃ⁹ *τοῖς υἱοῖς¹⁰ Ἐμμώρ¹¹ τοῦ¹² μὴ¹³ *περιτμηθῆναι αὐτούς¹⁴, ὅτι¹⁵ ἐζήλωσα *διὰ τὸ βδέλυγμα¹⁶, *ὃ ἐποίησαν¹⁷ *ἐπὶ τῇ ἀδελφῇ μου¹⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/003.yaml
  text: After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous because of the abomination which they had committed against my sister.
translation:
  language: ko
  text: 그 후 나는 아버지와 르우벤과 함께 의논하여, 그가 에모르의 아들들에게 그들 자신에게 할례를 행하지 말라고 말하게 하였습니다. 이는 내가 내 누이에게 그들이 저지른 가증한 일 때문에 분노하였기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβούλευσα τῷ πατρί μου καὶ τῷ Ῥουβὴμ
  english_pob_choice: I took counsel with my father and with Reuben
  chosen_korean: 아버지와 르우벤과 함께 의논하여
  alternatives_korean:
  - 아버지와 르우벤과 상의하여
  - 아버지와 르우벤과 더불어 협의하여
  lexicon: συμβουλεύω
  rationale: 공동 의논의 뉘앙스를 살리되, 한국어에서 자연스러운 ‘의논하다’로 옮겼습니다.
- source_word: ἵνα εἴπῃ τοῖς υἱοῖς Ἐμμώρ
  english_pob_choice: that he should tell the sons of Emmor
  chosen_korean: 그가 에모르의 아들들에게 … 말하게 하였습니다
  alternatives_korean:
  - 그가 에모르의 아들들에게 … 말하도록 하였습니다
  - 에모르의 아들들에게 … 이르도록 하였습니다
  lexicon: ἵνα + subjunctive
  rationale: 목적/지시의 구조를 살려 ‘말하게 하였습니다’로 옮겼습니다.
- source_word: μὴ περιτμηθῆναι αὐτούς
  english_pob_choice: not to circumcise themselves
  chosen_korean: 그들 자신에게 할례를 행하지 말라고
  alternatives_korean:
  - 자신들에게 할례하지 말라고
  - 스스로 할례를 받지 말라고
  lexicon: περιτέμνω
  rationale: 중간태적 표현을 한국어로 자연스럽게 풀되, 할례 행위가 자기들에게 적용됨을 분명히 했습니다.
- source_word: ἐζήλωσα διὰ τὸ βδέλυγμα
  english_pob_choice: I was zealous because of the abomination
  chosen_korean: 내가 … 가증한 일 때문에 분노하였기 때문입니다
  alternatives_korean:
  - 내가 … 가증한 일 때문에 열심을 냈기 때문입니다
  - 내가 … 가증한 일로 인해 질투하였기 때문입니다
  lexicon: ζηλόω / βδέλυγμα
  rationale: ἐζήλωσα의 정서적 강도를 살리면서도, 여기서는 비난·격분의 문맥에 맞는 ‘분노하다’가 가장 자연스럽다고 보았습니다.
- source_word: ἐπὶ τῇ ἀδελφῇ μου
  english_pob_choice: against my sister
  chosen_korean: 내 누이에게
  alternatives_korean:
  - 내 누이에게 대하여
  - 내 누이를 향하여
  lexicon: ἐπί + dative
  rationale: 한국어에서는 행위 대상과 피해자를 ‘-에게’로 표현하는 것이 가장 직접적입니다.
theological_decisions:
- issue: ζηλόω의 정서 범위
  chosen_reading: 여기서는 ‘열심/질투’의 직역보다, 성폭력에 대한 격한 도덕적 분노를 드러내는 표현으로 이해했습니다.
  alternative_readings:
  - ‘열심을 냈다’
  - ‘질투하였다’
  rationale: 문맥상 ‘가증한 일’과 ‘내 누이에게’가 연결되어 있어, 단순한 종교적 열심보다 분노·격앙의 의미가 한국어에서 더 정확히 전달됩니다.
  doctrine_reference: 문맥적 어휘 판단
- issue: 할례 금지의 간접화법
  chosen_reading: 직접 명령형이 아니라 ‘말하게 하였습니다’로 간접화하여, 원문의 ἵνα + 접속법 구조를 보존했습니다.
  alternative_readings:
  - ‘말하라고 하였습니다’
  - ‘말하게 했습니다’
  rationale: 원문은 명령 자체보다 목적/지시 관계를 보여 주므로, 문장 구조를 유지하는 번역이 더 소스-정합적입니다.
  doctrine_reference: 문법 구조 보존
