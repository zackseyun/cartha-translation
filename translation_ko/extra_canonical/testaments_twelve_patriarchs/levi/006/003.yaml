- from: 그 후 나는 아버지와 르우벤과 함께 의논하여, 그가 에모르의 아들들에게 그들 자신에게 할례를 행하지 말라고 말하게 하였습니다. 이는 내가 내 누이에게 그들이 저지른 가증한 일 때문에 분노하였기 때문입니다.[a]
  to: 그 후 나는 아버지와 르우벤과 의논하여, 그가 에모르의 아들들에게 할례를 받지 말라고 말하도록 하였습니다. 이는 그들이 내 누이에게 저지른 가증한 일 때문에 내가 열심을 내었기 때문입니다.[a]
