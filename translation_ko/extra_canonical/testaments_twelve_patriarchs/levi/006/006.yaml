reference: Testament of Levi 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἤκουσεν²⁶ ὁ πατήρ *μου ⌈ταῦτα⌉²⁷ *καὶ ὀργισθεὶς²⁸ ἐλυπήθη²⁹ ὅτι κατεδέξαντο³⁰ τὴν περιτομὴν καὶ³¹ ἀπέθανον³², *καὶ ἐν ταῖς εὐλογίαις³³ †παρεῖδεν ἡμῖν³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/006.yaml
  text: And my father heard these things, and being angry, he was grieved because they had accepted circumcision and died, and in his blessings he passed over us.
translation:
  language: ko
  text: 그리고 내 아버지는 이것들을 들으시고, 분노하셔서 그들이 할례를 받아들이고 죽었기 때문에 슬퍼하셨으며, 그의 축복들에서 우리를 지나치셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργισθεὶς
  english_pob_choice: being angry
  chosen_korean: 분노하셔서
  alternatives_korean:
  - 화나셔서
  - 노하셔서
  lexicon: ὀργίζομαι
  rationale: 분노의 상태를 분명히 드러내되, 서술 흐름을 살려 ‘-하셔서’로 연결했습니다.
- source_word: ἐλυπήθη
  english_pob_choice: he was grieved
  chosen_korean: 슬퍼하셨으며
  alternatives_korean:
  - 근심하셨으며
  - 마음 아파하셨으며
  lexicon: λυπέω
  rationale: 단순한 감정 동요보다 비탄에 가까운 의미를 살려 ‘슬퍼하다’로 옮겼습니다.
- source_word: κατεδέξαντο τὴν περιτομὴν
  english_pob_choice: they had accepted circumcision
  chosen_korean: 그들이 할례를 받아들이고
  alternatives_korean:
  - 그들이 할례를 قبول하고
  - 그들이 할례를 수용하고
  lexicon: περιτομή
  rationale: 할례를 행위 자체로만 두지 않고 ‘받아들이다’로 옮겨, 본문이 강조하는 수용/동의를 반영했습니다.
- source_word: παρεῖδεν ἡμῖν
  english_pob_choice: he passed over us
  chosen_korean: 우리를 지나치셨습니다
  alternatives_korean:
  - 우리를 그냥 두셨습니다
  - 우리를 간과하셨습니다
  lexicon: παροράω / παρεῖδεν
  rationale: 여기서는 축복 가운데 ‘우리에게는 돌아오지 않았다’는 소외감을 살려, 직역적이되 자연스러운 ‘지나치다’로 처리했습니다.
theological_decisions:
- issue: 번역의 감정 서술에서 ‘분노’와 ‘슬픔’의 병치
  chosen_reading: 아버지가 분노하셨으나 동시에 슬퍼하셨다고 분명히 병치했습니다.
  alternative_readings:
  - 분노하여 슬퍼하셨다
  - 화가 나서 근심하셨다
  rationale: 원문은 두 정서를 모두 직접 말하므로, 하나를 다른 하나에 흡수하지 않고 둘 다 유지해야 본문의 긴장이 보존됩니다.
  doctrine_reference: 문학적/서사적 충실성 원칙
