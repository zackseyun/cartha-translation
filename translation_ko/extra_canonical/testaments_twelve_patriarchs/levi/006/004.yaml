  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/004.yaml
  text: And I killed Shechem first, and Simeon killed Emmor.
translation:
  language: ko
  text: 그리고 나는 먼저 세겜을 죽였습니다. 그리고 시므온이 엠모르를 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλον τὸν Συχὲμ ἐν πρώτοις
  english_pob_choice: I killed Shechem first
  chosen_korean: 나는 먼저 세겜을 죽였습니다
  alternatives_korean:
  - 나는 세겜을 먼저 죽였습니다
  - 나는 먼저 시켐을 죽였습니다
  lexicon: ἀνεῖλον
  rationale: Ἀνεῖλον은 단순한 ‘죽이다’보다 서술적 살해를 가리키므로 직역적이되 자연스러운 ‘죽였습니다’를 택했고, ἐν πρώτοις는 ‘먼저’로 옮겨 행위의 우선성을 드러냈습니다.
- source_word: Συχὲμ
  english_pob_choice: Shechem
  chosen_korean: 세겜
  alternatives_korean:
  - 시켐
  - 세켐
  lexicon: 고유명사
  rationale: 성경에서 널리 쓰이는 한국어 음역인 ‘세겜’을 사용하여 독자 인지성과 본문 가독성을 살렸습니다.
- source_word: Συμεὼν ... τὸν Ἐμμώρ
  english_pob_choice: Simeon killed Emmor
  chosen_korean: 시므온이 엠모르를 죽였습니다
  alternatives_korean:
  - 시므온이 에모르를 죽였습니다
  - 시몬이 엠모르를 죽였습니다
  lexicon: 고유명사
  rationale: Συμεών은 성경의 통용형 ‘시므온’을, Ἐμμώρ는 그리스어 음가를 반영한 ‘엠모르’를 사용해 영어 POB의 표기를 유지했습니다.
theological_decisions:
- issue: 서술의 책임 주체를 두 번 분리해 반복하는 방식
  chosen_reading: 첫 절은 화자 자신, 둘째 절은 시므온의 행위를 별도로 진술했습니다.
  alternative_readings:
  - 두 행위를 한 주체가 모두 화자라고 합쳐 읽는 방식
  - ‘그리고 시므온도 엠모르를 죽였습니다’처럼 부사적으로 완화하는 방식
  rationale: 그리스어의 καὶ Συμεὼν 구조는 주어를 새로 도입하여 행위 주체를 분리하므로, 한국어에서도 주어를 명시해 본문의 대조와 병렬을 보존했습니다.
  doctrine_reference: 본문 구조 관찰
