  revised_text: 그러나 저는 그것이 그들에게 재앙을 내리시려는 하나님의 결정임을 보았습니다. 이는 그들이 우리 누이 디나에게 한 것처럼 사라와 리브가에게도 하려고 했기 때문입니다. 그러나 주님께서 그들을 막으셨습니다.
