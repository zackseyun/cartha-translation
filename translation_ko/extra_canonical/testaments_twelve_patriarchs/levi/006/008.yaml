id: T12P.LEV.6.8
reference: Testament of Levi 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἀλλ᾿ ἐγὼ εἶδον ὅτι ἀπόφασις θεοῦ ἦν εἰς κακὰ³⁸ διότι ἤθελον ἐποίησεν *καὶ τὴν Σαρρὰ³⁹ ⌈καὶ τὴν Ῥεβέκκα⌉⁴⁰ ποιῆσαι ⌈ὃν τρόπον ἐποίησαν *τὴν Δείναν⁴¹ *τὴν ἀδελφὴν ἡμῶν⁴²⌉, καὶ ὁ⁴³ Κύριος ἐκώλυσεν αὐτούς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/008.yaml
  text: But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them.
translation:
  language: ko
  text: 그러나 저는 그것이 그들에게 재앙을 내리시려는 하나님의 결정임을 보았습니다. 이는 그들이 우리 누이 디나에게 한 것처럼 사라와 리브가에게도 하려고 했기 때문입니다. 그러나 주님께서 그들을 막으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόφασις θεοῦ
  english_pob_choice: a decree of God
  chosen_korean: 하나님께서 내리신 결정
  alternatives_korean:
  - 하나님의 명령
  - 하나님의 판결
  - 하나님의 결정
  lexicon: ἀπόφασις
  rationale: ἀπόφασις는 단순한 ‘뜻’보다 공식적인 판정을 가리킬 수 있어, POB의 ‘decree’를 살려 ‘내리신 결정’으로 옮겼습니다.
- source_word: εἰς κακὰ
  english_pob_choice: for evil
  chosen_korean: 악에 대한
  alternatives_korean:
  - 악을 위한
  - 재앙을 위한
  - 해를 끼치기 위한
  lexicon: εἰς + κακά
  rationale: 문맥상 목적이라기보다 그들에게 닥칠 해로운 결과를 가리키므로, ‘악에 대한’으로 결과·방향성을 살렸습니다.
- source_word: τὴν Σαρρὰ ... καὶ τὴν Ῥεβέκκα
  english_pob_choice: Sarah and Rebekah
  chosen_korean: 사라와 레베카
  alternatives_korean:
  - 사라와 리브가
  - 사라와 라헬
  lexicon: 고유명사
  rationale: 성경 인명은 관용형을 따르되, Ῥεβέκκα는 본문 전승을 따라 ‘레베카’로 옮겼습니다.
- source_word: τὴν Δείναν τὴν ἀδελφὴν ἡμῶν
  english_pob_choice: Dinah our sister
  chosen_korean: 우리 자매 디나
  alternatives_korean:
  - 우리 누이 디나
  - 우리 자매 다이나
  lexicon: ἀδελφή + ἡμῶν
  rationale: ἡμῶν을 반영해 공동체적 소속을 드러내는 ‘우리 자매’로 옮겼습니다.
- source_word: ἐκώλυσεν
  english_pob_choice: restrained
  chosen_korean: 막으셨습니다
  alternatives_korean:
  - 저지하셨습니다
  - 멈추게 하셨습니다
  - 제지하셨습니다
  lexicon: κωλύω
  rationale: κωλύω는 단순한 방해보다 실행을 실제로 막는 뜻이 강해, 자연스러운 현대 한국어로 ‘막으셨습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 하나님의 ‘decree’의 성격
  chosen_reading: 본문의 κρίσις/결정 뉘앙스를 살리되, 신정론적 설명을 덧붙이지 않고 사건에 대한 하나님의 주권적 판정을 그대로 표현했습니다.
  alternative_readings:
  - 하나님의 뜻
  - 하나님의 심판
  rationale: 주어진 영어 POB와 그리스어 ἀπόφασις는 행위에 대한 공식적 결정의 뉘앙스를 가지므로, 과도한 해설 없이 주권성을 보존하는 번역이 적절합니다.
  doctrine_reference: 하나님의 주권과 섭리
