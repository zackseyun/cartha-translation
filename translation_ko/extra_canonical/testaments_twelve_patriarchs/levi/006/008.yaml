revisions:
- from: 그러나 저는 그것이 하나님께서 그들에게 내리신 악에 대한 결정임을 보았습니다. 이는 그들이 사라와 레베카에게 그들이 우리 자매 디나에게 한 것과 같이 하려고 했기 때문입니다. 그리고 주님께서 그들을 막으셨습니다.
  to: 그러나 저는 그것이 그들에게 재앙을 내리시려는 하나님의 결정임을 보았습니다. 이는 그들이 우리 누이 디나에게 한 것처럼 사라와 리브가에게도 하려고 했기 때문입니다. 그러나 주님께서 그들을 막으셨습니다.
  rationale: 문장의 논리와 어순을 한국어답게 다듬고, 하나님의 결정이 그들에게 재앙으로 향한다는 εἰς κακά의 의미를 명료하게 했습니다. '그러나'는 원문의 ἀλλά와 마지막 절의 대조적 결과를 반영하여 유지했습니다. 본문에 제시된 대괄호는 전승·편집상의 표시이지만 영어 POB 본문이 해당 어구를 본문으로 채택하고 별도 각주를 제공하지 않으므로, 새 각주를 임의로 추가하지 않았습니다.
