  text: 그 후에 내 형제들이 와서 그 성읍을 칼날로 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after this
  chosen_korean: 이 일 뒤에
  alternatives_korean:
  - 그 후에
  - 이후에
  lexicon: μετά + ταῦτα
  rationale: 시간적 순서를 자연스러운 현대 한국어로 옮기되, 사건의 연속성을 유지하기 위해 직역보다 덜 경직된 표현을 택했습니다.
- source_word: οἱ ἀδελφοί μου
  english_pob_choice: my brothers
  chosen_korean: 내 형제들이
  alternatives_korean:
  - 내 형들이
  - 내 형제들이
  lexicon: ἀδελφοί
  rationale: 문맥상 혈연적 형제들을 가리키므로 ‘형제들’이 가장 직접적이며, 1인칭 소유를 그대로 반영했습니다.
- source_word: ἐπάταξαν
  english_pob_choice: struck
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 내리쳤습니다
  - 공격했습니다
  - 무찔렀습니다
  lexicon: πατάσσω
  rationale: 전투적 맥락의 ‘치다’ 의미를 살리면서도 한국어 서술로는 가장 간결하고 과장되지 않은 동사를 택했습니다.
- source_word: ἐν στόματι μαχαίρας
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 검의 날로
  - 칼의 날로
  - 칼끝으로
  lexicon: στόμα + μάχαιρα
  rationale: 직역하면 ‘칼의 입’이 되므로 관용적 의미인 ‘날’로 옮겨 ‘검의 날’이라는 전투 표현을 자연스럽게 재현했습니다.
theological_decisions:
- issue: 폭력 묘사의 표현 강도
  chosen_reading: 군사적 살해 행위를 완곡하게 돌리지 않고 ‘쳤습니다’와 ‘칼날로’로 비교적 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘공격했습니다’처럼 일반화함
  - ‘학살했습니다’처럼 강도를 높임
  rationale: 원문은 전투 행위를 서술할 뿐이므로, 의미를 약화시키거나 과도하게 해석하지 않고 서술 사실을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 서사 본문의 평서적 묘사 원칙
- issue: 인칭 소유 표현의 보존
  chosen_reading: ‘내 형제들’로 화자의 소유 관계를 분명히 했습니다.
  alternative_readings:
  - ‘형제들’로 소유를 생략함
  rationale: 원문의 μου를 유지해야 화자의 관점과 서술 위치가 보존됩니다.
  doctrine_reference: 문맥 충실성
