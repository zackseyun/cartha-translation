id: T12P.LEV.6.10
reference: Testament of Levi 6:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καίγε οὕτως⁵⁵ ἐποίουν *πᾶσι τοῖς ξένοις⁵⁶, *ἐν δυναστείᾳ ἁρπάζοντες⁵⁷ *τὰς ξένας⁵⁸ καὶ †ἐξενηλάτουν⁵⁹ αὐτάς⁶⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/010.yaml
  text: And indeed in this way they used to act toward all strangers, seizing the foreign women by force and driving them away.
translation:
  language: ko
  text: 그리고 실제로 그들은 모든 외국인들에게 이렇게 행했습니다. 곧 그 외국 여자들을 힘으로 붙잡고 그들을 내쫓았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶσι τοῖς ξένοις
  english_pob_choice: all strangers
  chosen_korean: 모든 외국인들에게
  alternatives_korean:
  - 모든 나그네들에게
  - 모든 이방인들에게
  lexicon: ξένος
  rationale: 이 문맥의 ξένος는 단순한 '낯선 사람'보다 외부 집단인 '외국인'의 뜻이 분명하므로, POB의 'strangers'를 한국어로 자연스럽게 옮겼습니다.
- source_word: τὰς ξένας
  english_pob_choice: the foreign women
  chosen_korean: 그 외국 여자들을
  alternatives_korean:
  - 그 이방 여자들을
  - 외국 여성들을
  lexicon: ξένος
  rationale: 수정된 POB가 'their women'이 아니라 'the foreign women'로 바로잡은 점을 반영하여, 소유를 넣지 않고 '외국 여자들'로 옮겼습니다.
- source_word: ἐν δυναστείᾳ ἁρπάζοντες
  english_pob_choice: seizing ... by force
  chosen_korean: 힘으로 붙잡고
  alternatives_korean:
  - 억지로 낚아채고
  - 폭력으로 빼앗아
  lexicon: ἁρπάζω
  rationale: ἁρπάζω의 강제적·폭력적 뉘앙스를 살리되, 한국어에서 문맥상 가장 직설적이고 읽히는 표현으로 '힘으로 붙잡고'를 택했습니다.
- source_word: ἐξενηλάτουν
  english_pob_choice: driving them away
  chosen_korean: 그들을 내쫓았습니다
  alternatives_korean:
  - 그들을 쫓아냈습니다
  - 그들을 몰아냈습니다
  lexicon: ἐξενηλατέω
  rationale: 동사의 방향성은 단순한 이동이 아니라 강제로 밖으로 내모는 행위이므로, '내쫓다'가 POB의 의미를 가장 간명하게 반영합니다.
theological_decisions:
- issue: 폭력적 약탈 행위의 서술을 완화하지 않을지
  chosen_reading: 원문의 폭력성과 강제성을 그대로 드러내도록 '힘으로 붙잡고'와 '내쫓았습니다'를 유지했습니다.
  alternative_readings:
  - 부드럽게 '데려가고'로 완화
  - '''강제로 취하고''처럼 추상화'
  rationale: 이 절은 도덕적 비판을 암시하는 서술로서, 폭력의 성격을 희석하면 본문의 증언이 약화됩니다.
  doctrine_reference: 성경 본문의 윤리적 증언과 역사적 서술의 직설성
