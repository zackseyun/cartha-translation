  text: But the wrath of God came upon them fully.
translation:
  language: ko
  text: 그러나 하나님의 진노가 마침내 그들에게 미쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔφθασε
  english_pob_choice: came upon
  chosen_korean: 미쳤습니다
  alternatives_korean:
  - 닥쳤습니다
  - 임했습니다
  - 다가왔습니다
  lexicon: φθάνω
  rationale: 과거 완료적 도달을 나타내어 진노가 그들에게 실제로 이르렀음을 자연스럽게 살리기 위해 ‘미쳤습니다’를 택했습니다.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  english_pob_choice: the wrath of God
  chosen_korean: 하나님의 진노
  alternatives_korean:
  - 하나님의 분노
  - 하나님의 노여움
  lexicon: ὀργή
  rationale: 문맥상 신적 심판의 정서를 드러내는 정형 표현이므로, 본문 의미를 직접 전달하는 ‘하나님의 진노’로 옮겼습니다.
- source_word: εἰς τέλος
  english_pob_choice: fully
  chosen_korean: 마침내
  alternatives_korean:
  - 끝까지
  - 완전히
  - 온전히
  lexicon: εἰς τέλος
  rationale: 결과의 완결과 도달을 강조하는 말이므로, ‘fully’의 해석을 반영해 사건의 종결점에 이르렀음을 나타내는 ‘마침내’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 진노의 인격적·심판적 의미
  chosen_reading: ‘진노’는 단순한 감정 폭발이 아니라 죄에 대한 하나님의 실제 심판 행위로 이해해 번역했습니다.
  alternative_readings:
  - ‘분노’로 약화해서 감정 중심으로 옮기는 방식
  - ‘노여움’처럼 정서적 뉘앙스를 앞세우는 방식
  rationale: 본문은 하나님의 거룩한 심판이 대상에게 실제로 미쳤다는 점을 말하므로, 정서적 완화 없이 ‘진노’로 유지하는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: 신적 심판에 대한 성경적 표상
