id: T12P.LEV.6.1
reference: Testament of Levi 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹ ὡς ἠρχόμην πρὸς τὸν πατέρα μου εὗρον ἀσπίδα χαλκῆν *διὸ καὶ τὸ ὄνομα τοῦ ὄρους Ἄσπις² *ὅ ἐστιν³ ἐγγὺς Γεβάλ, ἐκ δεξιῶν Ἀβιμά⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/001.yaml
  text: And as I was going to my father, I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, to the right of Abim.
translation:
  language: ko
  text: 그리고 내가 아버지에게 가는 길에 놋방패를 하나 발견했습니다. 그러므로 그 산의 이름은 아스피스인데, 그것은 게발 가까이에 있으며 아비므의 오른쪽에 있습니다.[a][b][c]
  philosophy: formal
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  english_pob_choice: a bronze shield
  chosen_korean: 놋방패
  alternatives_korean:
  - 청동 방패
  - 놋으로 된 방패
  lexicon: ἀσπίς / χαλκός
  rationale: 방패의 재질을 드러내기 위해 ‘놋’과 ‘방패’를 결합해 간결하게 옮겼습니다. ‘놋’은 청동 계열의 금속을 자연스럽게 가리키면서도 본문의 고대적 색채를 유지합니다.
- source_word: Ἄσπις
  english_pob_choice: Aspis
  chosen_korean: 아스피스
  alternatives_korean:
  - 아스피스 산
  - 아스피스
  lexicon: 고유명사
  rationale: 본문이 산의 이름을 제시하므로 음역만 사용해 고유명사를 보존했습니다.
- source_word: ἐκ δεξιῶν Ἀβιμά
  english_pob_choice: to the right of Abim
  chosen_korean: 아비므의 오른쪽에
  alternatives_korean:
  - 아비므의 오른편에
  - 아비므의 우편에
  lexicon: ἐκ δεξιῶν
  rationale: 관용적으로 ‘오른쪽에’로 옮겨 공간 관계를 분명히 했습니다. 영어 POB의 수정 취지도 반영하되, 한국어에서는 ‘to the right of’에 해당하는 자연스러운 표지를 선택했습니다.
theological_decisions:
- issue: 이 본문은 지리·서사적 진술이며 특별한 신학적 용어를 포함하지 않습니다.
  chosen_reading: 의미를 과장하지 않고 여정 중 발견한 물건과 지명 유래를 사실적으로 옮겼습니다.
  alternative_readings:
  - 상징적 의미를 덧붙이는 번역
  - 지명 설명을 풀어쓴 번역
  rationale: 원문은 지명 설명을 포함한 서술문이므로, 해석을 덧붙이지 않고 서사의 직접성을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 장르 및 서사 충실성
