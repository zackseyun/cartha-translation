base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/009.yaml
  text: And they pursued Abraham our father while he was a stranger, and they oppressed his flocks while they were increasing, and they cruelly mistreated Eblan, his home-born servant.
translation:
  language: ko
  text: 그들은 우리의 조상 아브라함이 나그네로 있을 때 그를 쫓아다녔고, 그의 양 떼가 불어나는 동안 그것을 압박했으며, 그의 집에서 난 종 에블란을 몹시 학대했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωξαν
  english_pob_choice: pursued
  chosen_korean: 쫓아다녔고
  alternatives_korean:
  - 추격했고
  - 박해했고
  lexicon: διώκω
  rationale: 여기서는 단순한 추격보다 계속 뒤쫓아 괴롭히는 뉘앙스가 있어, 본문 흐름에 맞게 자연스럽게 ‘쫓아다녔고’로 옮겼습니다.
- source_word: ξένον ὄντα
  english_pob_choice: while he was a stranger
  chosen_korean: 나그네로 있을 때
  alternatives_korean:
  - 낯선 이로 있을 때
  - 외국인으로 있을 때
  lexicon: ξένος
  rationale: 아브라함이 땅에서 보호받지 못하는 이방 나그네였다는 의미를 살리기 위해 ‘나그네’로 옮겼습니다.
- source_word: κατεπόνησαν τὰ ποίμνια ὀγκούμενα ὄντα
  english_pob_choice: oppressed his flocks while they were increasing
  chosen_korean: 그의 양 떼가 불어나는 동안 그것을 압박했으며
  alternatives_korean:
  - 그의 양 떼가 늘어나는 동안 그것을 학대했으며
  - 그의 양 떼가 번성할 때 그것을 억눌렀으며
  lexicon: καταπονέω / ποίμνιον / ὀγκούμενα
  rationale: ‘압박하다’는 단순한 소유물 훼손이 아니라 번성하는 가축 떼를 억누르는 행위를 드러내며, ὀγκούμενα의 증가·팽창 이미지는 ‘불어나는 동안’으로 자연스럽게 반영했습니다.
- source_word: οἰκογενῆ
  english_pob_choice: home-born servant
  chosen_korean: 집에서 난 종
  alternatives_korean:
  - 집안에서 태어난 종
  - 집안 출신 종
  lexicon: οἰκογενής
  rationale: 노예/종의 출생 신분을 드러내는 말로, ‘집에서 난 종’이 가장 직접적으로 원문의 ‘가정 출생’ 의미를 반영합니다.
- source_word: σφόδρα ἠκίσαντο
  english_pob_choice: cruelly mistreated
  chosen_korean: 몹시 학대했습니다
  alternatives_korean:
  - 지독하게 괴롭혔습니다
  - 극심하게 잔혹하게 대했습니다
  lexicon: σφόδρα + ἀκίζομαι
  rationale: 강한 정도 부사 σφόδρα와 잔혹한 대우를 뜻하는 동사를 함께 살리기 위해, 간결하면서도 강도를 드러내는 ‘몹시 학대했습니다’로 옮겼습니다.
theological_decisions:
- issue: 아브라함의 신분을 나타내는 ξένος의 번역
  chosen_reading: ‘나그네’로 번역해 아브라함이 본토에서 보호받지 못한 이방 체류자였다는 점을 살렸습니다.
  alternative_readings:
  - ‘낯선 이’
  - ‘외국인’
  rationale: 이 문맥은 단순한 감정적 ‘낯섦’보다 사회적·법적 약자성을 강조하므로, 성경적 한국어에서 익숙한 ‘나그네’가 본문 의도를 가장 잘 전달합니다.
  doctrine_reference: 창 23장, 히 11:9의 나그네 신학
