revisions:
- from: 그들은 우리의 조상 아브라함이 나그네로 있을 때 그를 쫓아다녔고, 그의 양 떼가 불어나는 동안 그것을 압박했으며, 그의 집에서 난 종 에블란을 몹시 학대했습니다.[a]
  to: 그들은 나그네로 있던 우리의 조상 아브라함을 추격했고, 불어나고 있던 그의 양 떼를 억눌렀으며, 그의 집안에서 태어난 종 에블란을 몹시 학대했습니다.
  rationale: ἐδίωξαν은 의미를 과도하게 반복화하지 않고 ‘추격했고’로 옮겼습니다. 양 떼를 직접 반복하여 문법적·의미적 모호성을 없앴고, οἰκογενῆ는 ‘집안에서 태어난 종’으로 명료하게 번역했습니다. 대응 각주가 없는 [a] 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:05Z'
