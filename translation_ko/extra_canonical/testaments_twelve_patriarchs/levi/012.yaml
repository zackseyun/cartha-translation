theological_decisions:
- issue: 요게벳을 '내 딸'로 부르는 족보적 긴장
  chosen_reading: 그리스어 본문이 말하는 대로 ‘내 딸 요게벳’으로 직역했습니다.
  alternative_readings:
  - 족보적 난점을 피하도록 조정
  - ‘딸’을 ‘후손’으로 완화
  rationale: 본문의 긴장을 지우지 않고 그대로 드러내는 것이 원문 우선 원칙에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: 원문이 말하는 것을 번역하고 긴장은 주석으로 노출'
