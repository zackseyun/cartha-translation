  text: 1. And Gersam took a wife, and by her he fathered Lomne and Semee. 2. And the sons of Kaath were Ambram, Isachar, Chebron, and Ozeel. 3. And the sons of Merari were Mooli and Mouses. 4. And in the sixty-fourth year of my life, Ambram took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt. 6. And behold, my children, you are the third generation. 7. Joseph died in the one hundred eighteenth year of my life.
  footnotes:
  - marker: a
    text: The Greek witness gives the names in forms that differ from more familiar biblical spellings; the translation preserves the Greek forms rather than harmonizing them.
    reason: textual_variant
    anchor_ref: '12:2'
  - marker: b
    text: The names here likely correspond to the Merarite line known from biblical genealogies, but the Greek forms are translated as transmitted.
    reason: textual_variant
    anchor_ref: '12:3'
  - marker: d
    text: The statement 'Jochebed my daughter' creates a genealogical tension with more familiar biblical lineage traditions. The translation follows the Greek text as it stands.
    reason: alternative_reading
    anchor_ref: '12:4'
  - marker: c
    text: '''Served as priest'' renders the Greek verb for performing priestly service.'
    reason: lexical_alternative
    anchor_ref: '12:5'
translation:
  language: ko
  text: 1. 게르삼이 아내를 맞이하고, 그 아내에게서 롬네와 세메를 얻었습니다. 2. 카앗의 아들들은 아브라암, 이사카르, 헤브론, 오제엘이었습니다.[a] 3. 메라레의 아들들은 모올리와 모세스였습니다.[b] 4. 내가 아흔넷 되던 해에 아브라암이 내 딸 요카벳을 자기 아내로 맞이했습니다. 그와 내 딸이 같은 날에 태어났기 때문입니다.[d] 5. 나는 카나안 땅에 들어갔을 때 여덟 살이었고, 쉬켐을 죽였을 때 열여덟 살이었으며, 제사장으로 섬겼을 때 열아홉 살이었습니다. 나는 스물여덟 살에 아내를 맞이했고, 마흔여덟 살에 이집트에 들어갔습니다.[c] 6. 보십시오, 나의 자녀 여러분, 여러분은 셋째 세대입니다. 7. 요셉은 내가 백열여덟 살 되던 해에 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 인명들은 더 익숙한 성서의 표기와 다른 그리스어 전승 형태를 따릅니다. 번역은 이를 익숙한 성서식 이름으로 조화하지 않았습니다.
    reason: textual_variant
  - marker: b
    text: 이 이름들은 더 익숙한 성서 족보의 메라리 계열과 대응할 가능성이 있으나, 번역은 전승된 그리스어 형태를 따릅니다.
    reason: textual_variant
  - marker: d
    text: ‘내 딸 요카벳’이라는 진술은 더 익숙한 성서 계보 전승과 긴장을 이룹니다. 번역은 그리스어 본문을 그대로 따릅니다.
    reason: alternative_reading
  - marker: c
    text: ‘제사장으로 섬겼습니다’는 제사장 직무를 수행한다는 뜻의 그리스어 동사를 옮긴 것입니다.
    reason: lexical_alternative
