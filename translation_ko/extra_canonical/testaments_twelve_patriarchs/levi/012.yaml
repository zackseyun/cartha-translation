translation:
  language: ko
  text: 1. 그리고 게르삼이 아내를 맞이하여, 그에게서 롬네와 세메를 낳았습니다. 2. 그리고 가핫의 아들들은 암브람, 이사카르, 헤브론, 그리고 오제엘이었습니다. 3. 그리고 메라리의 아들들은 무올리와 무세스였습니다. 4. 그리고 내 삶의 예순넷째 해에 암브람이 내 딸 요게벳을 자기 아내로 맞이했는데, 그와 내 딸이 같은 날에 태어났기 때문입니다. 5. 나는 가나안 땅에 들어갔을 때 여덟 살이었고, 스켐을 죽였을 때 열여덟 살이었으며, 제사장으로 섬겼을 때 열아홉 살이었고, 아내를 맞이했을 때 스물여덟 살이었으며, 이집트에 들어갔을 때 마흔여덟 살이었습니다. 6. 보십시오, 내 자녀들아, 너희는 삼대입니다. 7. 요셉은 내 삶의 백열여덟째 해에 죽었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
