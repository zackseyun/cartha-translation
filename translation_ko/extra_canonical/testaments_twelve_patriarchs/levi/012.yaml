review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 12:4의 그리스어 ἐνενηκοστῷ τετάρτῳ는 ‘아흔넷째(94번째)’인데, 초안은 ‘예순넷째’로 옮겨 본문 및 영어 감사 기록의 수치 오류를 반복했습니다. 또한 12:1의 ἔτεκεν ... ἐξ αὐτῆς는 게르삼이 아내에게서 자녀를 얻었다는 부계 족보 진술이므로, ‘그에게서 … 낳았습니다’는 한국어 문장상 남성이 출산한 것처럼 읽힙니다. 그리스어 표기와 달리 익숙한 성서식 이름으로 조화한 곳도 원문 우선 원칙에 맞게 바로잡았습니다.
  naturalness: 합쇼체의 문장 종결은 대체로 적절하나, ‘내 삶의 예순넷째 해’, ‘내 자녀들아, 너희는 삼대입니다’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘내가 아흔넷 되던 해’, ‘나의 자녀 여러분, 여러분은 셋째 세대입니다’로 다듬었습니다.
  terminology: ἱεράτευσα는 ‘제사장으로 섬겼습니다’로 유지할 수 있습니다. 인명은 제공된 그리스어 본문을 따라 게르삼, 카앗, 아브라암, 메라레, 모올리, 모세스, 요카벳, 쉬켐으로 음역했습니다. 익숙한 성서 표기로 무단 조화하지 않았습니다.
  issues:
  - severity: high
    issue: 12:4의 연령 수치가 ‘예순넷째’로 번역됨
    rationale: 원문은 ἐνενηκοστῷ τετάρτῳ, 곧 ‘아흔넷째/94번째 해’입니다. 영어 POB의 ‘sixty-fourth’도 원문과 일치하지 않으므로 따를 수 없습니다.
  - severity: medium
    issue: 12:1의 ‘그에게서 롬네와 세메를 낳았습니다’는 주어와 출산 행위의 관계가 부자연스러움
    rationale: 문장의 주어는 게르삼으로 유지되므로 한국어에서는 그가 출산한 듯 읽힙니다. ‘그 아내에게서 … 얻었습니다’가 부계 족보의 의미를 자연스럽고 충실하게 전달합니다.
  - severity: medium
    issue: 여러 인명이 그리스어 전승 대신 익숙한 성서식 형태로 조화됨
    rationale: Καὰθ, Ἀβραάμ, Μεραρεῖ, Μοολί, Μωυσής, Ἰωχαβέδ, Συχέμ의 전승 형태를 보존해야 합니다. 특히 ‘가핫’, ‘암브람’, ‘메라리’, ‘무올리’, ‘무세스’, ‘요게벳’, ‘스켐’은 제공된 그리스어 형태를 그대로 반영하지 않습니다.
  - severity: low
    issue: 각주 표지가 모두 12:7에 몰려 있음
    rationale: 각주는 해당 본문 위치에 붙어야 독자가 이름 전승, 족보 긴장, 어휘 설명을 올바르게 확인할 수 있습니다.
