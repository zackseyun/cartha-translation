revisions:
- from: 1. 그리고 게르삼이 아내를 맞이하여, 그에게서 롬네와 세메를 낳았습니다. 2. 그리고 가핫의 아들들은 암브람, 이사카르, 헤브론, 그리고 오제엘이었습니다. 3. 그리고 메라리의 아들들은 무올리와 무세스였습니다. 4. 그리고 내 삶의 예순넷째 해에 암브람이 내 딸 요게벳을 자기 아내로 맞이했는데, 그와 내 딸이 같은 날에 태어났기 때문입니다. 5. 나는 가나안 땅에 들어갔을 때 여덟 살이었고, 스켐을 죽였을 때 열여덟 살이었으며, 제사장으로 섬겼을 때 열아홉 살이었고, 아내를 맞이했을 때 스물여덟 살이었으며, 이집트에 들어갔을 때 마흔여덟 살이었습니다. 6. 보십시오, 내 자녀들아, 너희는 삼대입니다. 7. 요셉은 내 삶의 백열여덟째 해에 죽었습니다.[a][b][c][d]
  to: 1. 게르삼이 아내를 맞이하고, 그 아내에게서 롬네와 세메를 얻었습니다. 2. 카앗의 아들들은 아브라암, 이사카르, 헤브론, 오제엘이었습니다.[a] 3. 메라레의 아들들은 모올리와 모세스였습니다.[b] 4. 내가 아흔넷 되던 해에 아브라암이 내 딸 요카벳을 자기 아내로 맞이했습니다. 그와 내 딸이 같은 날에 태어났기 때문입니다.[d] 5. 나는 카나안 땅에 들어갔을 때 여덟 살이었고, 쉬켐을 죽였을 때 열여덟 살이었으며, 제사장으로 섬겼을 때 열아홉 살이었습니다. 나는 스물여덟 살에 아내를 맞이했고, 마흔여덟 살에 이집트에 들어갔습니다.[c] 6. 보십시오, 나의 자녀 여러분, 여러분은 셋째 세대입니다. 7. 요셉은 내가 백열여덟 살 되던 해에 죽었습니다.
  rationale: 원문 수치(94세)를 회복하고, 12:1의 부계 족보 표현을 자연스럽게 고쳤습니다. 또한 인명을 제공된 그리스어 전승에 맞추어 음역하고, 각주를 관련 절에 각각 배치했습니다. 12:4의 계보상 긴장은 해소하거나 교리적으로 해석하지 않고 본문 및 각주에 보존했습니다.
