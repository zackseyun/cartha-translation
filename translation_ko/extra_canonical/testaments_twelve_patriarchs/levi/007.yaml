base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007.yaml
  text: And I said to my father Jacob[a], “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you. For from this day the city called Sychem shall be a city of fools. For just as one mocks a fool, so we mocked them, because they indeed committed folly in Israel by defiling my sister. Then, after taking her up[b], we came to Bethel.”
  footnotes:
  - marker: a
    text: Sychem is the Greek form of the place more commonly known in English as Shechem.
    reason: lexical_alternative
  - marker: b
    text: Or 'after taking her away'; the participle likely refers to removing Dinah before going on to Bethel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 아버지 야곱에게 말했습니다. "당신 안에서 주께서 가나안 사람들을 무력하게 하시고, 그들의 땅을 당신과 당신 뒤의 당신의 씨에게 주실 것입니다. 오늘부터는 스켐이라 불리는 그 성읍이 어리석은 자들의 성읍이 될 것입니다. 어리석은 자를 조롱하듯 그들도 우리가 조롱했기 때문입니다. 그들이 이스라엘 가운데에서 내 누이를 더럽혀 참으로 어리석은 일을 저질렀기 때문입니다. 그런 다음 그녀를 데리고 올라와 베델에 이르렀습니다."[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουδενώσει
  english_pob_choice: will bring ... to nothing
  chosen_korean: 무력하게 하시고
  alternatives_korean:
  - 없게 하시고
  - 아무것도 아니게 하시고
  - 멸시하시고
  lexicon: LSJ
  rationale: 이 동사는 단순한 멸시보다 대상을 무너뜨려 힘을 잃게 하는 뜻이 강하므로, 문맥의 정복·굴복 뉘앙스를 살려 ‘무력하게 하시고’로 옮겼습니다.
- source_word: σπέρματί
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 후손
  lexicon: LSJ
  rationale: 족장 약속의 언어를 유지하기 위해 ‘씨’를 택했습니다. 한국어로도 언약적 표현으로 읽힐 수 있어 원문의 신학적 결을 보존합니다.
- source_word: ἀσυνέτων
  english_pob_choice: of fools
  chosen_korean: 어리석은 자들의
  alternatives_korean:
  - 무지한 자들의
  - 분별 없는 자들의
  - 우매한 자들의
  lexicon: LSJ
  rationale: 뒤의 ‘어리석은 자를 조롱하듯’과 어울리게, 도덕적 평가가 드러나는 ‘어리석은 자들’로 옮겨 같은 어휘망을 유지했습니다.
- source_word: μιάναντες
  english_pob_choice: defiling
  chosen_korean: 더럽혀
  alternatives_korean:
  - 오염시켜
  - 부정하게 하여
  - 훼손하여
  lexicon: LSJ
  rationale: 이 분사는 단순한 폭력보다 종교적·도덕적 오염을 가리키므로, 한국어에서도 그 결을 살린 ‘더럽혀’가 가장 직접적입니다.
theological_decisions:
- issue: 이스라엘의 조상 언어에서 ‘씨’와 땅 약속을 어떻게 보존할 것인가
  chosen_reading: ‘당신과 당신 뒤의 당신의 씨에게’로 옮겨 언약적 약속 구조를 그대로 드러냈습니다.
  alternative_readings:
  - ‘당신과 당신의 후손에게’로 일반화
  - 약속 표현을 완화해 단순한 미래 예고로 처리
  rationale: 본문은 족장 전통의 언약 언어를 사용하므로, 익숙함을 위해 완화하기보다 원문의 약속·계승 구조를 보존하는 것이 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy and covenantal diction'
- issue: ‘더럽히다’와 ‘어리석은 일’의 도덕·종교적 규정
  chosen_reading: ‘내 누이를 더럽혀 참으로 어리석은 일을 저질렀기 때문입니다’로 도덕적 비난을 분명히 했습니다.
  alternative_readings:
  - ‘내 누이에게 해를 끼쳤기 때문입니다’처럼 사회적 피해 중심으로 완화
  - 더 노골적인 성적 표현을 추가
  rationale: 그리스어는 사건을 이스라엘 안에서의 도덕적·종교적 오염으로 규정합니다. 따라서 의미를 약화하지도, 원문에 없는 상세 묘사를 덧붙이지도 않는 균형이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension'
