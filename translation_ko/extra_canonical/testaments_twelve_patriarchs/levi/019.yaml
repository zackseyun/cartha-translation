    3. 그들의 아버지가 그들에게 말했습니다. “주님은 증인이시며, 그분의 천사들도 증인들이며, 너희도 증인들이고, 나도 너희가 입으로 한 말에 관하여 증인입니다.” 그러자 그의 아들들이 그에게 말했습니다. “저희도 증인입니다.”'
  revised_footnotes:
