base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019.yaml
  text: '1[a]. And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar[b].

    2. And his sons answered him, saying, “Before the Lord we will walk, and according to his law.”

    3. And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him[c], “Witnesses.”'
  footnotes:
  - marker: a
    text: Or, 'the deeds of Beliar.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'walk before the Lord' is a biblical idiom for living one's life in accountable obedience before God.
    reason: cultural_note
  - marker: c
    text: The Greek names 'Beliar,' a form also known elsewhere as 'Belial.'
    reason: alternative_reading
translation:
  language: ko
  text: '1. 이제, 내 자녀들아, 너희는 모든 것을 들었습니다. 너희 스스로 빛이냐 어둠이냐, 주님의 율법이냐 베리아르의 행위들이냐를 택하십시오[a].


    2. 그의 아들들이 그에게 대답하여 말했습니다. “주님 앞에서 행하며[b] 그분의 율법을 따르겠습니다.”


    3. 그들의 아버지가 그들에게 말했습니다. “주님은 증인이시며, 그분의 천사들도 증인들이며, 너희도 증인들이고, 나도 너희가 입으로 한 말에 관하여 증인입니다.” 그러자 그의 아들들이 그에게 말했습니다. “저희도 증인입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 “베리아르”는 다른 전승에서는 “벨리알”로도 알려진 이름입니다.
    reason: alternative_reading
  - marker: b
    text: “주님 앞에서 행하다”는 하나님 앞에서 책임 있게 순종하며 살아가는 것을 뜻하는 성경적 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐκλέξασθε ἑαυτοῖς
  english_pob_choice: Choose for yourselves
  chosen_korean: 너희 자신을 위해 … 택하십시오
  alternatives_korean:
  - 택하십시오
  - 스스로 선택하십시오
  lexicon: BDAG
  rationale: 중간태 명령의 자기지향적 뉘앙스를 살리되, 한국어에서는 ‘너희 자신을 위해’로 자연스럽게 풀어 책임 있는 선택의 성격을 드러냈습니다.
- source_word: φῶς / σκότος
  english_pob_choice: light / darkness
  chosen_korean: 빛 / 어둠
  alternatives_korean:
  - 빛 / 흑암
  - 광명 / 어둠
  lexicon: BDAG
  rationale: 도덕적 상징 대조를 직역에 가깝게 유지하여, 본문의 강한 이분법을 약화하지 않았습니다.
- source_word: νόμον κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 율례
  lexicon: BDAG
  rationale: κύριος를 ‘주님’으로 옮기고, νόμος는 본문 전통에 맞게 ‘율법’으로 유지해 언약적·규범적 의미를 보존했습니다.
- source_word: ἔργα τοῦ Βελίαρ
  english_pob_choice: the works of Beliar
  chosen_korean: 베리알의 일들
  alternatives_korean:
  - 베리알의 행위들
  - 베리알의 작품들
  lexicon: BDAG
  rationale: ἔργα를 여기서는 도덕적 실천을 가리키는 ‘일들’로 옮겨, 영어 POB가 ‘works’로 유지한 행위 범주를 한국어에서도 드러냈습니다.
- source_word: Μάρτυς ἐστι κύριος ... καὶ μάρτυς ἐγὼ
  english_pob_choice: The Lord is witness ... and I am a witness
  chosen_korean: 주님은 증인이시며 ... 나도 ... 증인입니다
  alternatives_korean:
  - 주님은 증인이며 ... 나도 증인입니다
  - 주님이 증인이시며 ... 나 또한 증인입니다
  lexicon: BDAG
  rationale: 법정적·언약적 선언의 형식을 살리기 위해 ‘증인’ 반복을 유지했고, 한국어 서술은 합쇼체로 정리했습니다.
theological_decisions:
- issue: ‘주 앞에서 걷다’는 관용구의 처리
  chosen_reading: '"주 앞에서 우리는 걷고"로 직역에 가깝게 유지했습니다.'
  alternative_readings:
  - 주님 앞에서 살아가겠습니다
  - 주님의 면전에서 행하겠습니다
  rationale: 영어 POB가 이 표현을 성경적 관용구로 보존하듯, 한국어에서도 삶 전체를 뜻하는 관용을 지나치게 설명적으로 풀지 않고 책임 있는 순종의 이미지로 남겼습니다.
  doctrine_reference: 'PHILOSOPHY.md: preserve the source text''s plain sense and rhetorical texture'
- issue: Βελίαρ의 음역
  chosen_reading: 베리알
  alternative_readings:
  - 벨리알
  - 베리아르
  rationale: 그리스어 증거형 Βελίαρ를 기준으로 하되, 한국어 음역은 현대 표기 감각에 맞춰 ‘베리알’로 옮겼습니다. 본문에서 인물/세력명으로서의 고유성을 유지합니다.
  doctrine_reference: 'DOCTRINE.md: translate titles; transliterate names'
