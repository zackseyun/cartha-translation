base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
  footnotes:
  - marker: a
    text: Or 'sanctuary'; the Greek ναός specifically denotes the holy temple.
    reason: lexical_alternative
    anchor_ref: '15:1'
  - marker: c
    text: '''Righteous judgment'' could also be rendered ''just judgment.'''
    reason: lexical_alternative
    anchor_ref: '15:2'
  - marker: b
    text: The Greek uses 'seed,' a covenantal lineage term; 'offspring' or 'descendants' would be smoother English.
    reason: lexical_alternative
    anchor_ref: '15:4'
translation:
  language: ko
  text: 그러므로 주께서 선택하실 성전은 너희의 부정함 속에서 황폐해질 것이며, 너희는 모든 민족 가운데서 포로가 될 것입니다. 너희는 그들에게 가증한 존재가 되고, 하나님의 의로운 심판으로 말미암아 꾸지람과 영원한 수치를 받게 될 것입니다. 너희를 미워하는 모든 자가 너희의 멸망을 보고 기뻐할 것입니다. 또 우리 조상 아브라함과 이삭과 야곱이 아니었다면, 너희는 자비를 받지 못했을 것이며, 너희의 씨 가운데 땅 위에 남아 있을 자는 하나도 없었을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  english_pob_choice: temple
  chosen_korean: 성전
  alternatives_korean:
  - 성소
  - 신전
  lexicon: LSJ
  rationale: 유대적 문맥에서 하나님이 택하실 거룩한 예배 처소를 가리키므로, 한국어 성경 전통과도 맞는 ‘성전’이 가장 자연스럽습니다.
- source_word: ἐκλέξεται
  english_pob_choice: will choose
  chosen_korean: 선택하실
  alternatives_korean:
  - 택하실
  - 고르실
  lexicon: LSJ
  rationale: 주께서 예배 처소를 주권적으로 택하신다는 뜻을 살리기 위해 ‘선택하실’로 옮겼습니다.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  english_pob_choice: in your uncleanness
  chosen_korean: 너희의 부정함 속에서
  alternatives_korean:
  - 너희의 더러움 가운데서
  - 너희의 부정함 안에서
  lexicon: LSJ
  rationale: 전치사 ἐν의 국면적 의미를 살려 ‘~속에서’로 옮기되, cultic impurity의 강한 의미를 ‘부정함’으로 유지했습니다.
- source_word: δικαιοκρισίας
  english_pob_choice: righteous judgment
  chosen_korean: 의로운 심판
  alternatives_korean:
  - 의로운 판결
  - 공의로운 심판
  lexicon: LSJ
  rationale: 복합어가 지닌 ‘의에 따른 판단/심판’의 뜻을 한국어에서 가장 간결하게 드러내는 표현으로 ‘의로운 심판’을 택했습니다.
- source_word: σπέρματος
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 후손
  lexicon: LSJ
  rationale: 언약적 계보를 가리키는 표현으로서, 본문의 직설성을 보존하기 위해 ‘씨’를 유지했습니다.
theological_decisions:
- issue: 노출된 심판과 회복 불가의 경고를 완화하지 않음
  chosen_reading: 성전 황폐, 포로됨, 가증함, 영원한 수치, 그리고 남은 씨의 부재라는 경고를 그대로 드러냈습니다.
  alternative_readings:
  - 역사적 추방 정도로 약화하는 읽기
  - 상징적 경고로 완화하는 읽기
  rationale: 원문은 언약적 저주와 심판의 강도를 분명히 말하므로, 이를 부드럽게 만들지 않고 그대로 옮기는 것이 원문의 의도에 가깝습니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
- issue: 아브라함·이삭·야곱을 근거로 한 자비의 논리 보존
  chosen_reading: 자비가 조상들의 공로/언약적 역할 때문에 주어진다는 논리를 그대로 유지했습니다.
  alternative_readings:
  - 조상들을 단순한 믿음의 예로 바꾸는 읽기
  - 중보적·언약적 기능을 희석하는 읽기
  rationale: 본문은 자비의 근거를 명시적으로 족장들에게 두므로, 그 긴장을 제거하지 않고 번역해야 합니다.
  doctrine_reference: DOCTRINE.md § Original-language primacy over translation tradition
