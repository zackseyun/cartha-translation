  lexicon: LSJ
  rationale: 전치사 ἐν의 국면적 의미를 살려 ‘~속에서’로 옮기되, cultic impurity의 강한 의미를 ‘부정함’으로 유지했습니다.
- source_word: δικαιοκρισίας
  english_pob_choice: righteous judgment
  chosen_korean: 의로운 심판
  alternatives_korean:
