base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
  footnotes:
  - marker: a
    text: Or 'sanctuary'; the Greek ναός specifically denotes the holy temple.
    reason: lexical_alternative
    anchor_ref: '15:1'
  - marker: c
    text: '''Righteous judgment'' could also be rendered ''just judgment.'''
    reason: lexical_alternative
    anchor_ref: '15:2'
  - marker: b
    text: The Greek uses 'seed,' a covenantal lineage term; 'offspring' or 'descendants' would be smoother English.
    reason: lexical_alternative
    anchor_ref: '15:4'
translation:
  language: ko
  text: 그러므로 주께서 택하실 성전[a]은 너희의 부정 가운데서 황폐해질 것이며, 너희는 모든 민족에게 포로로 끌려갈 것입니다. 너희는 그들에게 가증한 것이 되고, 하나님의 의로운 심판[c]으로 말미암아 수모와 영원한 수치를 받게 될 것입니다. 너희를 미워하는 모든 자가 너희의 멸망을 보고 기뻐할 것입니다. 또 우리 조상 아브라함과 이삭과 야곱이 아니었다면, 너희는 자비를 받지 못했을 것이며, 너희의 씨[b] 가운데 땅 위에 남겨질 자는 하나도 없었을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성소’. 그리스어 ναός는 특히 거룩한 성전, 곧 성소를 가리킵니다.
    reason: lexical_alternative; 15:1의 ναός에 직접 연결합니다.
  - marker: c
    text: ‘의로운 심판’은 ‘공의로운 심판’으로도 옮길 수 있습니다.
    reason: lexical_alternative; 15:2의 δικαιοκρισίας에 직접 연결합니다.
  - marker: b
    text: 그리스어는 ‘씨’를 사용합니다. 이는 언약적 계보를 가리키는 표현이며, ‘자손’ 또는 ‘후손’으로도 옮길 수 있습니다.
    reason: lexical_alternative; 15:4의 σπέρματος에 직접 연결합니다.
