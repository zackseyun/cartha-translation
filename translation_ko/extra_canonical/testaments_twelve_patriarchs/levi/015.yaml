  source_fidelity: 전반적으로 원문의 심판 경고와 조건문의 반사실적 의미를 충실히 보존합니다. 다만 ὄνειδος는 ‘꾸지람’(질책, 야단)보다 대외적으로 받는 ‘수모/치욕/비난’에 가깝습니다. 또한 σπέρματος에 해당하는 ‘씨’와 ναός 및 δικαιοκρισίας의 주석 표지는 해당 어구에 직접 붙이는 편이 명확합니다.
  naturalness: 합쇼체는 일관되며 문장도 자연스럽습니다. ‘너희의 부정함 속에서’도 원문의 ἐν을 반영할 수 있으나, 제의적·도덕적 오염을 가리키는 문맥에서는 ‘너희의 부정 가운데서’가 더 간결하고 자연스럽습니다. ‘꾸지람’은 이 문맥의 공적 수치와 어조가 맞지 않습니다.
  terminology: ‘성전’, ‘부정’, ‘의로운 심판’, ‘씨’는 원문 및 한국어 성서 문체에 적절합니다. ναός의 대안으로 ‘성소’를, δικαιοκρισίας의 대안으로 ‘공의로운 심판’을 주석에서 제시할 수 있으나 본문 선택은 유지할 수 있습니다.
