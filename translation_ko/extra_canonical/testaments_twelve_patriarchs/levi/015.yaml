revisions:
- from: 그러므로 주께서 선택하실 성전은 너희의 부정함 속에서 황폐해질 것이며, 너희는 모든 민족 가운데서 포로가 될 것입니다. 너희는 그들에게 가증한 존재가 되고, 하나님의 의로운 심판으로 말미암아 꾸지람과 영원한 수치를 받게 될 것입니다. 너희를 미워하는 모든 자가 너희의 멸망을 보고 기뻐할 것입니다. 또 우리 조상 아브라함과 이삭과 야곱이 아니었다면, 너희는 자비를 받지 못했을 것이며, 너희의 씨 가운데 땅 위에 남아 있을 자는 하나도 없었을 것입니다.[a][b][c]
