revisions:
- from: 그리고 너는 그들 가운데서 바다와 같을 것입니다. 이는 바다 속에서는 의인과 악인이 함께 있어, 어떤 이들은 포로로 사로잡히고 어떤 이들은 부유해지듯이, 너 안에서도 모든 민족 가운데서 어떤 이들은 사로잡혀 위태롭게 되고, 어떤 이들은 남의 것을 빼앗아 부유해질 것이기 때문입니다.
  to: 그리고 너는 그들 가운데서 바다와 같을 것입니다. 바다 안에는 의인과 악인이 있어서, 어떤 이들은 포로로 사로잡히고 어떤 이들은 부유해집니다. 이와 같이 너 안에도 온갖 부류의 사람이 있어서, 어떤 이들은 포로로 사로잡힌 채 위태로워지고, 어떤 이들은 남의 것을 빼앗아 부유해질 것입니다.
  rationale: 원문의 비유 구조(바다 안의 사람들/너 안의 사람들)를 보존하고, πᾶν γένος ἀνθρώπων을 민족 명칭으로 한정하지 않았습니다. 난해한 κωδυνεύσουσιν은 본문 및 영어 감사본의 불확정성을 과도하게 해소하지 않고 ‘위태로워지다’로 옮겼습니다. 영어 감사본의 ‘storm-tossed’는 제시된 그리스어 본문에 대응하는 어휘가 없으므로 채택하지 않았습니다.
  reviewer_model: gpt-5.6-terra
