  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσῃ³⁶ ἐν αὐτοῖς³⁷ ὡς³⁸ ἡ³⁹ θάλασσα. Καθάπερ⁴⁰ γὰρ⁴¹ ἐν αὐτῇ δίκαιοι καὶ ἄδικοι, οἱ μὲν αἰχμαλωτίζονται οἱ δὲ πλουτοῦσιν⁴⁴, οὕτως καὶ ἐν σοὶ πᾶν γένος ἀνθρώπων· οἱ μὲν †κωδυνεύσουσιν αἰχμαλωτιζόμενοι, οἱ δὲ πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/006.yaml
  text: 'And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.'
translation:
  language: ko
  text: 그리고 너는 그들 가운데서 바다와 같을 것입니다. 이는 바다 속에서는 의인과 악인이 함께 있어, 어떤 이들은 포로로 사로잡히고 어떤 이들은 부유해지듯이, 너 안에서도 모든 민족 가운데서 어떤 이들은 사로잡혀 위태롭게 되고, 어떤 이들은 남의 것을 빼앗아 부유해질 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα
  english_pob_choice: And you shall be among them like the sea.
  chosen_korean: 그들 가운데서 바다와 같을 것입니다
  alternatives_korean:
  - 그들 가운데 바다처럼 될 것입니다
  - 그들 가운데서 바다와 같이 있을 것입니다
  lexicon: ἐν + dative; ὡς; θάλασσα
  rationale: 직역보다 관계적 위치(그들 가운데서)와 비유(바다와 같음)를 자연스럽게 살렸습니다. 미래형은 원문의 ἔσῃ를 반영합니다.
- source_word: δίκαιοι καὶ ἄδικοι
  english_pob_choice: the righteous
  chosen_korean: 의인과 악인
  alternatives_korean:
  - 의로운 사람들과 불의한 사람들
  - 의인들과 불의한 자들
  lexicon: δίκαιος; ἄδικος
  rationale: 대조 구조를 분명히 드러내기 위해 관용적으로 통용되는 대립쌍을 사용했습니다. 문맥상 도덕적·신학적 대비가 핵심입니다.
- source_word: αἰχμαλωτίζονται ... πλουτοῦσιν ... ἁρπάζοντες τὰ ἀλλότρια
  english_pob_choice: some being taken captive ... others growing rich by seizing what belongs to others
  chosen_korean: 어떤 이들은 포로로 사로잡히고 어떤 이들은 남의 것을 빼앗아 부유해질 것이기 때문입니다
  alternatives_korean:
  - 어떤 이들은 포로가 되고 어떤 이들은 남의 것을 빼앗아 부자가 될 것이기 때문입니다
  - 어떤 이들은 붙잡혀 가고 어떤 이들은 남의 것을 취해 부유해질 것이기 때문입니다
  lexicon: αἰχμαλωτίζω; πλουτέω; ἁρπάζω; τὰ ἀλλότρια
  rationale: αἰχμαλωτίζονται의 수동적 구속 상태를 ‘포로로 사로잡히고’로, ἁρπάζοντες τὰ ἀλλότρια를 ‘남의 것을 빼앗아’로 옮겨 약탈의 의미를 분명히 했습니다.
theological_decisions:
- issue: 바다 비유와 이어지는 사회적 역설의 표현
  chosen_reading: 바다 자체의 혼합성과 불안정성을 들어, 의인과 악인의 공존 및 그 결과를 그대로 드러냈습니다.
  alternative_readings:
  - ‘바다처럼 혼란스러울 것입니다’처럼 심리적 혼란 중심으로 옮기는 방식
  - ‘바다와 같이 많은 사람들 가운데 있을 것입니다’로 단순 군중 비유로 축소하는 방식
  rationale: 원문은 단순한 혼란감이 아니라, 바다 속에서 의인과 악인이 함께 겪는 상반된 운명을 통해 너의 가운데서도 벌어질 분열적 현실을 말합니다.
  doctrine_reference: 문학적-예언적 비유의 보존
