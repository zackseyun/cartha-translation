  text: For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood.
translation:
  language: ko
  text: 왜냐하면 하나님께서는 내게는 왕권을, 그에게는 제사직을 주셨으며, 왕권을 제사직에 복종시키셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλείαν
  english_pob_choice: the kingship
  chosen_korean: 왕권
  alternatives_korean:
  - 왕국
  - 나라
  - 통치권
  lexicon: βασιλεία
  rationale: 여기서는 지배 영역보다 왕으로서의 권위와 직분을 가리키므로, ‘왕권’이 영어 POB의 kingship을 가장 직접적으로 반영합니다.
- source_word: ἱερατείαν / ἱερωσύνῃ
  english_pob_choice: the priesthood / to the priesthood
  chosen_korean: 제사직 / 제사직에
  alternatives_korean:
  - 제사장직
  - 제사권
  - 사제직
  lexicon: ἱερατεία, ἱερωσύνη
  rationale: 두 표현이 서로 다른 형태로 반복되지만 의미상 제사장적 직분을 가리키므로, 한국어에서는 ‘제사직’으로 통일해 대응했습니다.
- source_word: ὑπέταξε
  english_pob_choice: he subjected
  chosen_korean: 복종시키셨습니다
  alternatives_korean:
  - 복속시키셨습니다
  - 아래 두셨습니다
  - 종속시키셨습니다
  lexicon: ὑποτάσσω
  rationale: 주어가 하나님이므로 단순한 배열보다 위계적 질서를 세우는 의미가 살아야 하며, ‘복종시키셨습니다’가 문맥의 강도를 가장 잘 드러냅니다.
- source_word: ὁ Θεός
  english_pob_choice: God
  chosen_korean: 하나님께서는
  alternatives_korean:
  - 하나님이
  - 주께서는
  lexicon: Θεός
  rationale: POB 기본 용례에 따라 Θεός는 ‘하나님’으로 옮기고, 서술의 주체를 자연스럽게 살리기 위해 주격 조사 대신 주제 표지를 썼습니다.
theological_decisions:
- issue: 왕권과 제사직의 위계 설정
  chosen_reading: 하나님이 두 직분을 각각 주시고, 왕권을 제사직에 복종시키신다는 문장을 그대로 살려, 본문이 의도하는 질서의 우선성을 보존했습니다.
  alternative_readings:
  - 왕권과 제사직을 단순히 병렬로 제시하는 읽기
  - 왕권을 제사직보다 낮춘다는 의미를 약화하는 읽기
  rationale: 이 절은 정치적 권위보다 제사적 권위를 우위에 두는 진술이므로, ‘복종시키셨습니다’의 강한 관계를 완화하지 않는 것이 중요합니다.
  doctrine_reference: textual-theological observation
- issue: ‘나’와 ‘그에게’의 지시
  chosen_reading: 문맥상 ‘나’는 유다, ‘그’는 레위/제사직 계열을 가리키는 대비를 한국어에서도 유지했습니다.
  alternative_readings:
  - 대상을 일반화해 ‘나’/‘그’를 약화하는 읽기
  rationale: 대명사 대비는 본문의 족장 축복 전승을 이루는 핵심 장치이므로, 지시 관계를 흐리지 않았습니다.
  doctrine_reference: narrative coherence
