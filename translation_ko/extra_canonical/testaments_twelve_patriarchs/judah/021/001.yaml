base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/001.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves against him, lest you be utterly destroyed.'
translation:
  language: ko
  text: '이제, 내 자녀들아, 내가 너희에게 명합니다: 레위를 사랑하십시오. 그러면 너희가 남아 있을 것이며, 그를 대적하여 스스로 높이지 마십시오. 그렇지 않으면 너희가 완전히 멸망할 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 아들들아
  lexicon: τέκνα
  rationale: 직접 호소형으로 자연스럽게 옮기되, 포괄적 호칭을 살려 ‘자녀들’로 번역했습니다.
- source_word: παραγγέλλω ὑμῖν
  english_pob_choice: I command you
  chosen_korean: 내가 너희에게 명합니다
  alternatives_korean:
  - 내가 너희에게 명령합니다
  - 내가 너희에게 명합니다
  lexicon: παραγγέλλω
  rationale: 권위 있는 명령을 나타내므로 ‘명합니다’로 직역에 가깝게 유지했습니다.
- source_word: ἐπ᾽ αὐτόν
  english_pob_choice: against him
  chosen_korean: 그를 대적하여
  alternatives_korean:
  - 그를 향하여
  - 그에게 맞서
  lexicon: ἐπί + accusative
  rationale: 단순한 ‘위에/향하여’가 아니라 적대적 대상을 분명히 하므로 ‘대적하여’로 옮겼습니다.
- source_word: ἐξολοθρευθῆτε
  english_pob_choice: you be utterly destroyed
  chosen_korean: 완전히 멸망할 것입니다
  alternatives_korean:
  - 철저히 멸망할 것입니다
  - 완전히 멸절될 것입니다
  lexicon: ἐξολοθρεύω
  rationale: ‘완전히/철저히’의 강도를 살리되, 한국어에서 자연스러운 결과형으로 옮겼습니다.
theological_decisions:
- issue: 레위를 사랑하라는 명령의 의미를 어떻게 드러낼지
  chosen_reading: 레위를 향한 사랑은 단순한 호감이 아니라 공동체 보존과 연결된 순종의 표지로 표현했습니다.
  alternative_readings:
  - 레위를 좋아하십시오
  - 레위를 존중하십시오
  rationale: 본문이 ‘사랑’과 ‘남아 있음’을 연결하므로, 관계적 선호보다 언약적 순종의 뉘앙스를 유지했습니다.
  doctrine_reference: 본문 내 권면과 경고의 연계
- issue: ‘그를 대적하여 스스로 높이지 마십시오’의 경고 강도
  chosen_reading: 자기 고양과 적대 행위를 함께 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 그 위에 우쭐대지 마십시오
  - 그를 업신여기지 마십시오
  rationale: ἐπ᾽ αὐτόν의 적대성을 약화시키지 않기 위해, 단순한 교만보다 ‘대적’의 의미를 분명히 했습니다.
  doctrine_reference: 경고 문맥의 수사적 평행
