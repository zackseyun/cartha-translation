- from: 그러므로 왕들은 바다 괴물처럼 되어 사람들을 물고기처럼 삼킬 것이며, 자유인의 아들들과 딸들을 노예로 삼고, 집들과 밭들과 양 떼들과 재물들을 빼앗을 것입니다.
  to: 왜냐하면 왕들은 바다 괴물처럼 되어 사람들을 물고기처럼 삼킬 것이며, 자유로운 아들들과 딸들을 노예로 삼고, 집과 밭과 양 떼와 재물을 빼앗을 것입니다.
  rationale: 원문 우선 원칙에 따라 ἐλευθέρους의 문법적 수식 관계를 바로잡고 ὅτι의 인과 기능을 반영했습니다. 그 밖의 포식·노예화·강탈 이미지는 초안의 직설성을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:07Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ἐλευθέρους는 대격 남성 복수로 υἱοὺς καὶ θυγατέρας를 수식하며, ‘자유인의 아들들과 딸들’보다는 ‘자유로운 아들들과 딸들’이라는 뜻입니다. 영어 POB의 “sons and daughters of free people”은 이 그리스어 형태를 충분히 반영하지 못합니다. 또한 ὅτι는 ‘그러므로’(결과)가 아니라 이유를 나타내는 ‘왜냐하면/이는’로 옮기는 것이 적절합니다.
  naturalness: ‘왜냐하면’으로 문두 접속 관계를 자연스럽게 드러내고, 소유·재산 목록은 한국어 관용에 따라 불필요한 복수 표지 없이 병렬로 제시했습니다. 합쇼체 미래 종결도 유지했습니다.
  terminology: κήτη의 위협적 비유는 ‘바다 괴물’, καταπίνω는 ‘삼키다’, καταδουλόω는 ‘노예로 삼다’, ἁρπάζω는 강탈의 뉘앙스를 보존하는 ‘빼앗다’로 유지했습니다. ‘자유로운’은 본문에서 노예화될 이들의 현재 자유 신분을 가리킵니다.
  issues:
  - severity: high
    issue: ‘자유인의 아들들과 딸들’
    rationale: 그리스어 ἐλευθέρους는 ‘아들들과 딸들’의 성질, 곧 그들이 자유인임을 나타냅니다. ‘자유인의 자녀’는 소유격 관계를 덧붙이며 원문 및 영어 감사 이력의 해석을 따르는 번역입니다.
  - severity: medium
    issue: ‘그러므로’
    rationale: ὅτι는 여기서 이유를 도입하는 접속사이며, 결과를 나타내는 ‘그러므로’는 논리 관계를 바꿉니다.
  revised_text: 왜냐하면 왕들은 바다 괴물처럼 되어 사람들을 물고기처럼 삼킬 것이며, 자유로운 아들들과 딸들을 노예로 삼고, 집과 밭과 양 떼와 재물을 빼앗을 것입니다.
