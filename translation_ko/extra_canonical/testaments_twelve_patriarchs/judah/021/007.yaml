id: T12P.JUD.21.7
reference: Testament of Judah 21:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ὅτι οἱ βασιλεύσουσιν⁵⁰ ὡς κήτη ἔσονται, *καταπίνοντες ἀνθρώπους⁵¹ ὡς ἰχθύας· υἱοὺς καὶ θυγατέρας ἐλευθέρους⁵² καταδουλώσουσιν⁵³, *οἴκους, ἀγρούς⁵⁴, ποίμνια, χρήματα ἁρπάσουσιν⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/007.yaml
  text: For the kings will be like sea monsters, swallowing people like fish; they will make sons and daughters of free people slaves, and they will seize houses, fields, flocks, and wealth.
translation:
  language: ko
  text: 왜냐하면 왕들은 바다 괴물처럼 되어 사람들을 물고기처럼 삼킬 것이며, 자유로운 아들들과 딸들을 노예로 삼고, 집과 밭과 양 떼와 재물을 빼앗을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ βασιλεύσουσιν
  english_pob_choice: the kings will be
  chosen_korean: 왕들은
  alternatives_korean:
  - 그 왕들은
  - 통치자들은
  lexicon: βασιλεύω
  rationale: 미래 동사형의 집합적 주어를 한국어에서는 자연스럽게 명사구로 옮기되, 문맥상 특정 군주들을 가리키므로 ‘왕들’이 가장 직접적입니다.
- source_word: ὡς κήτη
  english_pob_choice: like sea monsters
  chosen_korean: 바다 괴물처럼
  alternatives_korean:
  - 바다짐승처럼
  - 해괴물처럼
  lexicon: κήτος
  rationale: κήτη는 단순한 물고기나 파충류가 아니라 거대한 바다 괴물 이미지를 주므로, 한국어에서도 서늘한 비유 효과를 살려 ‘바다 괴물’로 옮겼습니다.
- source_word: καταπίνοντες ἀνθρώπους ὡς ἰχθύας
  english_pob_choice: swallowing people like fish
  chosen_korean: 사람들을 물고기처럼 삼킬 것이며
  alternatives_korean:
  - 사람들을 물고기처럼 집어삼킬 것이며
  - 사람들을 물고기처럼 먹어 삼킬 것이며
  lexicon: καταπίνω
  rationale: ἀνθρώπους를 반영해 ‘사람들’로 번역하고, καταπίνοντες의 생생한 포식 이미지는 ‘삼키다’로 충분히 전달됩니다.
- source_word: υἱοὺς καὶ θυγατέρας ἐλευθέρους καταδουλώσουσιν
  english_pob_choice: they will make sons and daughters of free people slaves
  chosen_korean: 자유인의 아들들과 딸들을 노예로 삼고
  alternatives_korean:
  - 자유인의 아들들과 딸들을 종으로 삼고
  - 자유인의 아들들과 딸들을 종살이하게 하고
  lexicon: καταδουλόω
  rationale: 영어 POB가 ‘make ... slaves’로 명시적 종속 상태를 드러내므로, 프로젝트 기본값 중 더 강한 ‘노예’가 원문의 폭력성을 가장 직접적으로 반영합니다.
- source_word: οἴκους, ἀγρούς, ποίμνια, χρήματα ἁρπάσουσιν
  english_pob_choice: they will seize houses, fields, flocks, and wealth
  chosen_korean: 집들과 밭들과 양 떼들과 재물들을 빼앗을 것입니다
  alternatives_korean:
  - 집들과 밭들과 양 떼들과 재산을 탈취할 것입니다
  - 집들과 들판들과 떼와 재물들을 약탈할 것입니다
  lexicon: ἁρπάζω
  rationale: ἁρπάζω는 강탈·약탈의 의미를 가지지만, 목록의 병렬성과 한국어 자연성을 고려해 ‘빼앗다’로 옮겼습니다.
theological_decisions:
- issue: 폭력적 왕권 비유의 직설성 유지
  chosen_reading: 해석을 완화하지 않고 ‘바다 괴물’, ‘삼킬’, ‘노예로 삼다’의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘잔혹한 왕들’처럼 의미를 순화하는 번역
  - ‘먹어 치우다’처럼 구어적으로 약화된 번역
  rationale: 본문은 왕들의 포식성과 억압을 생생한 비유로 묘사하므로, 독자가 사회적 폭력의 강도를 그대로 인지하도록 직역적 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 예언/지혜 문학의 상징적 폭력 묘사
