- from: 이렇게 해서 하나님의 제사직은 세상의 나라보다 더 뛰어납니다. 다만 죄로 말미암아 주님에게서 떨어져 나가고 세상의 나라에 지배당하지 않는 한 그렇습니다.[a]
  to: 이와 같이 하나님의 제사직은, 죄들로 말미암아 주님에게서 떨어져 나가 세상의 나라에 지배당하는 경우가 아니라면, 세상의 나라보다 뛰어납니다.
  rationale: ἐὰν μὴ 아래의 두 동사(‘주님에게서 떨어져 나가다’와 ‘세상의 나라에 지배당하다’)를 함께 예외 조건으로 옮겼습니다. 이를 ‘…하는 경우가 아니라면’으로 표현하여 원문의 조건 범위와 논리를 보존했으며, 내용이 없는 각주 표지는 제거했습니다.
