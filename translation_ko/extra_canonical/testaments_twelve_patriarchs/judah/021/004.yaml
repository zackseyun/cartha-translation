base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/004.yaml
  text: For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.
translation:
  language: ko
  text: 이렇게 해서 하나님의 제사직은 세상의 나라보다 더 뛰어납니다. 다만 죄로 말미암아 주님에게서 떨어져 나가고 세상의 나라에 지배당하지 않는 한 그렇습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱερατεία
  english_pob_choice: the priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장 직분
  - 제사장직
  - 성직
  lexicon: ἱερατεία
  rationale: 단순한 개인 직위가 아니라 제사장 집단의 직무·지위를 가리키므로, 현대 한국어에서 비교적 직접적이고 제도적 뉘앙스를 살리는 ‘제사직’이 적절합니다.
- source_word: βασιλεία τῆς ἐπιγείου
  english_pob_choice: the earthly kingdom
  chosen_korean: 세상의 나라
  alternatives_korean:
  - 지상의 나라
  - 땅의 나라
  - 세속의 나라
  lexicon: βασιλεία
  rationale: 문맥상 하늘/하나님의 나라와 대조되는 ‘earthly kingdom’이므로 ‘세상의 나라’로 옮겨, 문자적 ‘지상의’보다 의미 대비를 분명히 했습니다.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  english_pob_choice: falls away from the Lord
  chosen_korean: 주님에게서 떨어져 나가고
  alternatives_korean:
  - 주님에게서 멀어지고
  - 주님을 떠나고
  - 주님으로부터 이탈하고
  lexicon: ἐκπίπτω
  rationale: ἐκπίπτω는 단순 거리감보다 ‘떨어져 나가다, 이탈하다’의 강한 이탈을 담으므로, 관계적 분리를 드러내는 표현을 선택했습니다.
- source_word: κυριευθῇ
  english_pob_choice: is ruled
  chosen_korean: 지배당하지 않는 한
  alternatives_korean:
  - 다스려지지 않는 한
  - 통치받지 않는 한
  - 장악당하지 않는 한
  lexicon: κυριεύω
  rationale: 수동태의 강한 지배·장악 의미를 살려, 중립적인 ‘다스려지다’보다 종속성을 드러내는 ‘지배당하다’를 택했습니다.
theological_decisions:
- issue: 하나님의 제사직과 세상의 나라의 대조
  chosen_reading: 하나님의 제사직이 세상의 나라보다 뛰어나다는 우위 비교를 분명히 유지했습니다.
  alternative_readings:
  - 하나님의 제사장직이 세속 권력보다 낫다는 일반화
  - 제사직이 정치적 왕권보다 우월하다는 축소
  rationale: 본문은 제사직과 나라를 직접 대조하며 우월성을 말하므로, 이를 도덕적 비유로 약화하지 않고 원문의 위계를 유지했습니다.
  doctrine_reference: 문맥상 제의적 거룩함과 세속 통치의 대비
