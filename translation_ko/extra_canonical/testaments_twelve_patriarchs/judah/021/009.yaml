translation:
  language: ko
  text: 그리고 거짓 예언자들은 폭풍과 같을 것이며, 모든 의인을 박해할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψευδοπροφῆται
  english_pob_choice: false prophets
  chosen_korean: 거짓 예언자들
  alternatives_korean:
  - 거짓 선지자들
  - 가짜 예언자들
  lexicon: ψευδοπροφήτης
  rationale: 예언자라는 직역을 기본으로 하되, 한국어 성경 전통의 선지자보다 원문 직역성이 높아 이 본문에서는 거짓 예언자들로 옮겼습니다.
- source_word: ὡς καταιγίδες
  english_pob_choice: like storms
  chosen_korean: 폭풍과 같을 것이며
  alternatives_korean:
  - 폭풍처럼
  - 소나기와 같을 것이며
  - 광풍과 같을 것이며
  lexicon: καταιγίς
  rationale: καταιγίδες의 강한 난폭함을 살려 폭풍으로 옮기고, ὡς의 비유를 한국어 자연문으로 풀어 적었습니다.
- source_word: διώξουσιν
  english_pob_choice: will persecute/chase
  chosen_korean: 박해할 것입니다
  alternatives_korean:
  - 쫓을 것입니다
  - 핍박할 것입니다
  lexicon: διώκω
  rationale: 대상인 ‘의인들’에 대한 적대적 추격의 의미를 살려 종교적·윤리적 맥락에서 박해할 것입니다를 택했습니다.
theological_decisions:
- issue: 본문이 현존 헬라어 사본에서 문장이 중간에 끊기는 점
  chosen_reading: 현존하는 증언이 ‘거짓 예언자들은 폭풍과 같을 것이며…’에서 끝나므로, 남아 있는 부분만 번역했습니다.
  alternative_readings:
  - 문장을 추정적으로 보충해 완결된 한국어 문장으로 옮김
  - 영문 POB처럼 끊긴 지점만 표시하고 뒤를 생략함
  rationale: 영문 POB의 주석이 지적하듯 이 장의 현전 본문은 그 지점에서 끊기므로, 추정 보충 없이 증언된 범위만 번역하는 것이 원문 충실합니다.
  doctrine_reference: 본문 비평 및 번역 윤리
- issue: δικαίους의 공적·윤리적 성격
  chosen_reading: 모든 의인들
  alternative_readings:
  - 모든 의로운 사람들
  - 모든 옳은 사람들
  rationale: δικαίους의 기본적인 ‘의로운 사람들’ 의미를 따라, 한국어 성경 문맥에서 가장 직접적인 의인들을 선택했습니다.
  doctrine_reference: 의(δικαιοσύνη) 어휘의 기본 의미
