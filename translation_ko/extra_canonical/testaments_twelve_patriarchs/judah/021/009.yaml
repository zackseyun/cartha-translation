  source_fidelity: 그리스어 본문은 ‘거짓 예언자들이 폭풍들처럼 있을 것이며 모든 의인들을 박해할 것이다’라는 완결된 두 절을 보존합니다. 초안의 본문 번역은 대체로 이를 충실히 반영하지만, 부착된 각주는 현전 증언이 첫 절에서 끊긴다고 하여 제시된 원문 및 번역문과 정면으로 불일치합니다.
  naturalness: ‘폭풍과 같을 것이며’와 ‘박해할 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘모든 의인’을 단수 총칭으로 처리하면 πάντας τοὺς δικαίους의 포괄적 의미를 더 자연스럽게 드러낼 수 있습니다.
