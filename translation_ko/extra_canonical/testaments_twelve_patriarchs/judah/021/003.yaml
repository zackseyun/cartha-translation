    issue: 원문의 위치 표현이 ‘땅의 것들’과 ‘하늘의 것들’로 다소 소유·영역 관계화되었습니다.
    rationale: τὰ ἐπὶ γῆς와 τὰ ἐν οὐρανοῖς는 각각 ‘땅에/하늘에 있는 것들’이라는 위치 표현입니다.
  - severity: low
    issue: ‘주셨습니다’에 원문에 없는 주체 높임이 들어가 있습니다.
