  text: To me he gave the things on earth; to him, the things in heaven.
translation:
  language: ko
  text: 그는 내게 땅의 것들을 주셨고, 그에게는 하늘의 것들을 주셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ ἔδωκε
  english_pob_choice: To me he gave
  chosen_korean: 그는 내게 주셨습니다
  alternatives_korean:
  - 그가 내게 주었습니다
  - 내게 주셨습니다
  lexicon: δίδωμι
  rationale: 주체와 수혜자를 분명히 드러내는 가장 자연스러운 합쇼체로 옮겼습니다. 본문은 대칭 구조이므로 동사를 두 번 반복해 대응성을 살렸습니다.
- source_word: τὰ ἐπὶ γῆς
  english_pob_choice: the things on earth
  chosen_korean: 땅의 것들
  alternatives_korean:
  - 지상의 것들
  - 땅 위의 것들
  lexicon: ἐπί + γῆ
  rationale: 직역보다 자연스러운 한국어로 옮기되, 지상에 속한 사물/몫이라는 의미를 유지했습니다.
- source_word: τὰ ἐν οὐρανοῖς
  english_pob_choice: the things in heaven
  chosen_korean: 하늘의 것들
  alternatives_korean:
  - 하늘에 있는 것들
  - 하늘 나라의 것들
  lexicon: ἐν + οὐρανός
  rationale: 영어 POB의 단수화된 ‘heaven’에 맞추어 한국어도 단수적 총칭으로 자연스럽게 처리했습니다. 복수형의 낯섦보다 의미 전달을 우선했습니다.
theological_decisions:
- issue: 땅과 하늘의 몫을 병렬로 대조하는 구문
  chosen_reading: ‘땅의 것들’과 ‘하늘의 것들’을 대칭적으로 병렬해, 단순 소유가 아니라 영역의 대비를 드러냈습니다.
  alternative_readings:
  - ‘땅에 있는 것들’과 ‘하늘에 있는 것들’로 단순 위치 표현만 살리는 읽기
  rationale: 원문은 두 영역을 분리하여 대조하므로, 한국어도 대칭성을 유지하는 것이 의미를 가장 잘 보존합니다.
  doctrine_reference: 본문 의미의 대칭 구조 보존
