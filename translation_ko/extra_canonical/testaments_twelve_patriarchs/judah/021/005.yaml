  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ὁ γὰρ⁵ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ²⁸, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν³¹ ἐντρυφημάτων³² υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/005.yaml
  text: For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer the firstfruits of the delights of the sons of Israel[c] to him. But you shall be king of Jacob.
  footnotes:
  - marker: c
    text: '''The firstfruits of the delights of the sons of Israel'' likely refers to choice produce or rich first offerings brought from Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 주님의 천사가 내게 말했습니다. “주님께서 그를 너보다 더 높이 택하셔서, 그에게 가까이 나아가게 하시고, 그의 상에서 먹게 하시며, 이스라엘 자손의 좋은 것들의 첫 소산을 그에게 바치게 하셨습니다. 그러나 너는 야곱의 왕이 될 것이다.”[c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος / Lord
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 이 문맥의 말하는 주체가 직접 신적 권위를 가진 ‘주’이므로, 한국어 본문에서는 자연스럽고 존칭적인 ‘주님’으로 옮겼습니다. 본문이 구약의 야훼 인용 표지를 분명히 요구하는 문맥은 아니므로 여기서는 ‘야훼’로 고정하지 않았습니다.
- source_word: ἐξελέξατο
  english_pob_choice: chose
  chosen_korean: 택하셔서
  alternatives_korean:
  - 선택하셔서
  - 고르셔서
  lexicon: ἐκλέγομαι
  rationale: 하나님/주님의 주권적 선택을 드러내기 위해 ‘택하다’를 사용했고, 연결을 자연스럽게 하기 위해 서술형으로 풀었습니다.
- source_word: προσεγγίζειν αὐτῷ
  english_pob_choice: to draw near to him
  chosen_korean: 그에게 가까이 나아가게 하시고
  alternatives_korean:
  - 그에게 다가가게 하시고
  - 그와 가까이하게 하시고
  lexicon: προσεγγίζω
  rationale: 성소적·의례적 접근의 뉘앙스를 살리기 위해 단순한 공간 이동보다 ‘가까이 나아가다’를 택했습니다.
- source_word: τὴν τράπεζαν αὐτοῦ
  english_pob_choice: at his table
  chosen_korean: 그의 상에서 먹게 하시며
  alternatives_korean:
  - 그의 식탁에서 먹게 하시며
  - 그의 상에서 식사하게 하시며
  lexicon: τράπεζα
  rationale: ‘상’은 단순 식탁보다 왕적/예전적 식사의 분위기를 더 잘 살리며, 문맥의 높임과도 맞습니다.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων υἱῶν Ἰσραήλ
  english_pob_choice: the firstfruits of the delights of the sons of Israel
  chosen_korean: 이스라엘 자손의 좋은 것들의 첫 소산
  alternatives_korean:
  - 이스라엘 자손의 즐거운 것들의 첫 열매
  - 이스라엘 자손의 좋은 산물의 첫 열매
  lexicon: ἀπαρχή; ἐντρυφήματα
  rationale: ‘ἐντρυφήματα’의 ‘기쁨/호사/귀한 것’ 의미를 너무 약화하지 않으면서, 한국어에서는 자연스럽게 ‘좋은 것들’로 옮겼습니다. ‘첫 소산’은 ἀπαρχάς의 제의적 첫 열매 뉘앙스를 반영합니다.
- source_word: ἔσῃ βασιλεὺς Ἰακώβ
  english_pob_choice: you shall be king of Jacob
  chosen_korean: 너는 야곱의 왕이 될 것이다
  alternatives_korean:
  - 너는 야곱의 왕이 되리라
  - 너는 야곱을 다스리는 왕이 될 것이다
  lexicon: βασιλεύς
  rationale: 직설적 예언 형식을 살려 미래형으로 옮겼고, ‘야곱의 왕’이라는 원문 구조를 그대로 유지했습니다.
theological_decisions:
- issue: ‘주님’과 ‘천사’의 관계 표현
  chosen_reading: “주님의 천사”와 “주님”을 분리해 번역했습니다.
  alternative_readings:
  - ‘야훼의 천사’로 통일
  - ‘주님의 천사’ 대신 ‘주님의 사자’
  rationale: 원문은 Ὁ γὰρ ἄγγελος Κυρίου로 천사를 지칭하면서도, 발화 내용은 주님 자신을 말하므로 한국어에서도 두 주체를 구분해 충실하게 살렸습니다.
  doctrine_reference: 신적 대리 발화의 구별
