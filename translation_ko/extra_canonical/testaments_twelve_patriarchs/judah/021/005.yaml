revisions:
- from: 주님의 천사가 내게 말했습니다. “주님께서 그를 너보다 더 높이 택하셔서, 그에게 가까이 나아가게 하시고, 그의 상에서 먹게 하시며, 이스라엘 자손의 좋은 것들의 첫 소산을 그에게 바치게 하셨습니다. 그러나 너는 야곱의 왕이 될 것이다.”[c]
  to: 주님의 천사가 내게 말했습니다. “주님께서는 너보다 그를 택하셔서, 그가 주님께 가까이 나아가고 주님의 상에서 먹으며 이스라엘 자손의 풍성한 산물의 첫 소산을 주님께 바치도록 하셨습니다[c]. 그러나 너는 야곱의 왕이 될 것입니다.”
  rationale: 비교 선택(‘너보다 그를’)을 바로잡고, 선택의 목적을 나타내는 세 부정사를 ‘그가 … 하도록’으로 연결했습니다. ἐντρυφήματα는 ‘풍성한 산물’로 절제하여 옮기고, 해석상 불확실성은 해당 구에 붙인 각주에서 보존했습니다. 직접 인용문의 종결을 합쇼체로 정리했습니다.
