    rationale: ‘그를 너보다 더 높이 택하셨다’는 서열을 높였다는 뜻으로 읽힐 수 있습니다. ‘너보다 그를 택하셨다’가 ‘chose him above you’ 및 그리스어의 대조를 직접 반영합니다.
  - severity: medium
    issue: 목적 부정사들의 수식 관계
    rationale: προσεγγίζειν, ἐσθίειν, προσφέρειν은 선택된 이가 하도록 맡겨진 행위를 열거합니다. ‘그가 … 하도록 택하셨습니다’로 옮기면 선택과 직무의 관계가 명확해집니다.
  - severity: low
    issue: 각주 표지 위치
    rationale: 각주는 ‘이스라엘 자손의 풍성한 산물의 첫 소산’이라는 난해한 구에 붙어야 하며, 문장 끝에 붙이면 야곱의 왕권에도 걸릴 수 있습니다.
