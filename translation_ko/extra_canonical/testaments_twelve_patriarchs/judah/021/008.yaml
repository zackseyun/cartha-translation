review_pass:
  verdict: revise
  source_fidelity: 현 초안은 제시된 그리스어 본문에 없는 ‘따오기’를 삽입하고 영어 POB의 각주 [b]를 그대로 달았습니다. 제시된 α-본문에는 κόρακας(까마귀)만 있으므로, 이 구절의 한국어 본문과 각주에서는 따오기를 제거해야 합니다. 또한 ἐπὶ κακῷ와 τῇ πλεονεξίᾳ ὑψούμενοι의 관계를 ‘악한 목적으로’와 ‘탐욕으로 우쭐해져’로 드러내는 편이 더 충실합니다.
  naturalness: ‘악에서 앞으로 나아가고’는 현대 한국어에서 다소 부자연스럽고, ‘탐욕으로 들려’도 뜻이 불분명합니다. ‘악과 그러한 교만 속에서 더욱 나아가’ 및 ‘탐욕으로 우쭐해져’는 합쇼체 문체를 유지하면서 의미를 명료하게 합니다.
  terminology: σάρκες는 이 문맥에서 ‘살’로 옮길 수 있으나, 피살자의 신체를 가리키는 섬뜩한 이미지에는 ‘시신의 살’이 더 명확합니다. κόρακας는 ‘까마귀’로 유지했습니다. ὑπερηφανία는 ‘교만’, ὑψόω의 반복은 ‘우쭐해져/높아질’로 살렸습니다. 최종 ‘높아질’이 누구에 의해 높아지는지를 본문이 명시하지 않으므로 해석적으로 ‘높임을 받을’로 확정하지 않았습니다.
  issues:
  - severity: high
    issue: 제시된 그리스어 본문에 없는 ‘따오기’와 그에 대한 [b] 각주가 포함되어 있습니다.
    rationale: 원문에는 κόρακας(까마귀)만 있으며, 이 검토의 우선 기준인 원어 본문은 따오기 또는 이비스를 지지하지 않습니다. 영어 감사 이력의 각주는 원어 본문과 충돌하므로 한국어 번역에 계승할 수 없습니다.
  - severity: medium
    issue: ἐπὶ κακῷ의 ‘악한 목적’을 번역문이 반영하지 않습니다.
    rationale: 이 표현은 부당하게 시신의 살을 까마귀에게 내주는 행위의 악한 성격/목적을 보강합니다. ‘악한 목적으로’를 넣어 보존하는 것이 안전합니다.
  - severity: medium
    issue: ‘탐욕으로 들려’는 ὑψούμενοι를 자연스럽게 전달하지 못합니다.
    rationale: 한국어 ‘들리다’는 이 문맥에서 물리적으로 들어 올려진다는 뜻으로 읽히기 쉽습니다. ‘탐욕으로 우쭐해져’는 자기고양과 교만의 연결을 더 자연스럽게 나타냅니다.
  revised_text: 그들은 탐욕으로 우쭐해져, 많은 이들의 시신의 살을 악한 목적으로 부당하게 까마귀에게 내주고, 악과 그러한 교만 속에서 더욱 나아가 마침내 높아질 것입니다.
