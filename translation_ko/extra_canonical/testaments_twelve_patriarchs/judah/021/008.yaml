reference: Testament of Judah 21:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ πολλῶν σάρκας ἀδίκως⁵⁵ κόρακας⁵⁵ ἐπὶ κακῷ⁶⁰ τῇ πλεονεξίᾳ ὑψούμενοι· καὶ προκόψουσιν ἐπὶ κακὰ καὶ ὑπερηφανίᾳ τοιούτου ἕως ὑψοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/008.yaml
  text: And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed.
  footnotes:
  - marker: b
    text: '''Ibises'' follows the Greek directly. The image is of carrion birds feeding on the slain; some readers may expect a more general term such as ''birds,'' but the Greek is more specific.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 사람의 살을 부당하게 까마귀와 따오기들에게 내주며, 탐욕으로 들려 악에서 앞으로 나아가고, 그런 자들은 높임을 받기까지 더욱 교만해질 것입니다.[b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σάρκας ἀδίκως
  english_pob_choice: unjustly ... with the flesh of many
  chosen_korean: “부당하게 … 많은 사람의 살을”
  alternatives_korean:
  - “불의하게 … 많은 이들의 살을”
  - “억울하게 … 많은 사람의 살을”
  lexicon: σάρξ; ἀδίκως
  rationale: σάρκας는 단순히 ‘고기’가 아니라 사람의 ‘살’을 뜻하므로, 피살된 이들의 육체를 가리키는 표현을 살렸습니다. ἀδίκως는 도덕적/법적 부당성을 드러내어 ‘부당하게’로 옮겼습니다.
- source_word: κόρακας ... τῇ πλεονεξίᾳ
  english_pob_choice: ravens and ibises
  chosen_korean: “까마귀와 따오기들에게”
  alternatives_korean:
  - “까마귀와 이비스들에게”
  - “썩은 고기를 먹는 새들과 따오기들에게”
  lexicon: κόραξ; πλεονεξία
  rationale: POB의 영어처럼 구체적 조류 이미지를 유지하되, 한국어에서는 이비스보다 더 자연스러운 ‘따오기’를 택해 직역성을 유지했습니다. τῇ πλεονεξίᾳ는 수단/방식의 뜻을 살려 ‘탐욕으로’로 옮겼습니다.
- source_word: ὑψούμενοι ... ὑψοῦνται
  english_pob_choice: being lifted up ... they will be lifted up
  chosen_korean: “들려 … 높임을 받기까지”
  alternatives_korean:
  - “스스로 높아져 … 높아질 때까지”
  - “교만하여 … 들릴 때까지”
  lexicon: ὑψόω
  rationale: 동사가 반복되어 상향/고양의 이미지를 의도하므로, 능동적 오만과 수동적 ‘높임’의 긴장을 살려 ‘들리다/높임을 받다’로 표현했습니다.
- source_word: προκόψουσιν ἐπὶ κακὰ καὶ ὑπερηφανίᾳ
  english_pob_choice: they will advance in evil
  chosen_korean: “악에서 앞으로 나아가고 … 더욱 교만해질 것입니다”
  alternatives_korean:
  - “악으로 나아가고 … 오만해질 것입니다”
  - “악 가운데 전진하고 … 거만해질 것입니다”
  lexicon: προκόπτω; κακά; ὑπερηφανία
  rationale: προκόψουσιν은 단순 진보가 아니라 악 속으로 더 깊이 들어가는 진행을 뜻하므로 ‘앞으로 나아가다’로, ὑπερηφανία는 ‘교만’보다 강한 ‘오만/거만’의 뉘앙스를 고려하되 문맥상 ‘교만’으로 정리했습니다.
theological_decisions:
- issue: 탐욕과 높임의 관계
  chosen_reading: 탐욕이 그들을 ‘들어 올리는’ 힘으로 묘사되며, 그 결과 악과 교만이 계속 진행됩니다.
  alternative_readings:
  - 단순히 외적 번영의 묘사로 읽는 방식
  - ‘높임’이 하나님의 승인처럼 오해되는 방식
  rationale: 본문의 ὑψούμενοι와 ὑψοῦνται 반복은 자기고양/허영의 패턴을 강조하므로, 하나님의 승인으로 완화하지 않고 탐욕이 만들어 내는 왜곡된 상승으로 읽었습니다.
  doctrine_reference: 윤리적 타락과 교만에 대한 경고
