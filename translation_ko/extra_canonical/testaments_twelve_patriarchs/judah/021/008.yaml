revisions:
- from: 그리고 많은 사람의 살을 부당하게 까마귀와 따오기들에게 내주며, 탐욕으로 들려 악에서 앞으로 나아가고, 그런 자들은 높임을 받기까지 더욱 교만해질 것입니다.[b]
  to: 그들은 탐욕으로 우쭐해져, 많은 이들의 시신의 살을 악한 목적으로 부당하게 까마귀에게 내주고, 악과 그러한 교만 속에서 더욱 나아가 마침내 높아질 것입니다.
  rationale: 원어 본문에 실제로 있는 까마귀만 유지하고, 원문에 없는 따오기 및 그 각주를 삭제했습니다. 어순은 한국어에 맞게 조정하되, ‘탐욕으로 우쭐해짐’, ‘악한 목적으로 부당하게 까마귀에게 내줌’, ‘악과 교만에서의 진전’, ‘마침내 높아짐’이라는 본문의 요소와 마지막 수동형의 행위자 미지정을 보존했습니다.
  reviewer_model: gpt-5.6-terra
