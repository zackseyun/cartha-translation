revisions:
- from: '유다의 유언[a], 곧 야곱과 레아의 넷째 아들의 유언입니다.


    유다의 말의 기록입니다. 그는 죽기 전에 자기 아들들에게 이 말을 했습니다.


    2 그러자 그들이 모여 그에게 왔고, 그가 그들에게 말했습니다. 3 “내 자녀들아, 너희 아버지 유다의 말을 들으십시오. 나는 내 아버지 야곱에게서 넷째 아들로 태어났고, 내 어머니 레아가 나를 유다라 이름 지으면서 말했습니다. ‘내가 주님께 찬양을 드립니다. 그분이 나에게도 넷째 아들을 주셨기 때문입니다.’ 4 나는 젊은 시절에 날카로웠고, 내 아버지의 모든 말에 순종했습니다. 5 나는 내 어머니와 내 어머니의 자매를 공경했습니다. 6 그리고 내가 자라자 내 아버지가 나를 축복하며 말했습니다. ‘너는 왕이 될 것이며, 모든 일에서 형통할 것이다.’”'
  to: '유다의 유언, 야곱과 레아의 넷째 아들입니다.


    유다가 죽기 전에 자기 아들들에게 한 말이 기록된 사본입니다.


    2 그들이 모여 유다에게 왔고, 유다가 그들에게 말했습니다. 3 “내 자녀들아, 너희 아버지 유다의 말을 들으십시오. 나는 내 아버지 야곱의 넷째 아들로 태어났고, 내 어머니 레아가 나를 유다라고 이름 지으며 말했습니다. ‘내가 주님께 찬양을 드립니다. 그분께서 나에게도 넷째 아들을 주셨기 때문입니다.’ 4 나는 젊은 시절에 기민했고, 아버지의 모든 지시에 순종했습니다. 5 나는 내 어머니와 내 어머니의 자매[a]를 공경했습니다. 6 내가 자란 뒤에 내 아버지는 나를 위하여 기도하면서 말씀하셨습니다. ‘너는 왕이 되고, 모든 일에서 형통할 것입니다.’”'
  rationale: 원문 우선 원칙에 따라 표제의 중복과 각주 위치를 바로잡고, Ἀντίγραφον의 문서적 틀을 자연스러운 한국어로 재구성했습니다. 특히 ηὔξατό μοι의 ‘기도하다’ 의미를 회복했으며, 친족 관계와 왕권·형통의 진술은 해석적으로 확장하지 않았습니다.
