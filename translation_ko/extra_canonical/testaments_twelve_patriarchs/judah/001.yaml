base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001.yaml
  text: 'The Testament of Judah[a], the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.


    2 So they gathered and came to him, and he said to them:


    3 “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’ 4 I was keen in my youth, and I obeyed my father in every matter. 5 And I honored my mother and my mother''s sister. 6 And when I had grown up, my father blessed me, saying, ‘You shall be a king[b], prospering in all things.’”'
  footnotes:
  - marker: a
    text: The Greek says 'my mother's sister,' preserving the explicit kinship relation rather than using the simpler English 'my aunt.'
    reason: lexical_alternative
    anchor_ref: '1:5'
  - marker: b
    text: The participle translated 'prospering' can also suggest being guided successfully or having one's way made prosperous.
    reason: lexical_alternative
    anchor_ref: '1:6'
translation:
  language: ko
  text: '유다의 유언[a], 곧 야곱과 레아의 넷째 아들의 유언입니다.


    유다의 말의 기록입니다. 그는 죽기 전에 자기 아들들에게 이 말을 했습니다.


    2 그러자 그들이 모여 그에게 왔고, 그가 그들에게 말했습니다. 3 “내 자녀들아, 너희 아버지 유다의 말을 들으십시오. 나는 내 아버지 야곱에게서 넷째 아들로 태어났고, 내 어머니 레아가 나를 유다라 이름 지으면서 말했습니다. ‘내가 주님께 찬양을 드립니다. 그분이 나에게도 넷째 아들을 주셨기 때문입니다.’ 4 나는 젊은 시절에 날카로웠고, 내 아버지의 모든 말에 순종했습니다. 5 나는 내 어머니와 내 어머니의 자매를 공경했습니다. 6 그리고 내가 자라자 내 아버지가 나를 축복하며 말했습니다. ‘너는 왕이 될 것이며, 모든 일에서 형통할 것이다.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: Testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 테스타먼트
  lexicon: LSJ
  rationale: 이 작품의 제목어는 언약 신학의 '언약'이 아니라 족장 최후 담화의 문학적 표제이므로, 한국어에서는 기능을 살려 '유언'으로 옮겼습니다.
- source_word: Ἀντίγραφον λόγων
  english_pob_choice: A copy of the words
  chosen_korean: 말의 기록
  alternatives_korean:
  - 말의 사본
  - 말의 복사본
  - 기록
  lexicon: LSJ
  rationale: 문서 서두의 기록체를 자연스럽게 드러내되, 단순히 '사본'만 두기보다 '기록'을 덧붙여 문헌적 표지를 살렸습니다.
- source_word: τέταρτος υἱός / ἐγενόμην
  english_pob_choice: I became the fourth son
  chosen_korean: 넷째 아들로 태어났고
  alternatives_korean:
  - 넷째 아들이 되었고
  - 넷째 아들로 되었습니다
  - 넷째 아들이었습니다
  lexicon: LSJ
  rationale: 출생 순서를 나타내는 관용을 한국어로 자연스럽게 풀어, '넷째 아들로 태어났다'로 출생-지위의 성격을 함께 보존했습니다.
- source_word: τῷ Κυρίῳ
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주께
  - 주께서
  - 주
  lexicon: LSJ
  rationale: 레아의 찬양 발화에서 하나님을 가리키는 κύριος이므로, 프로젝트 기본어인 '주님'을 사용했습니다.
- source_word: Ἀνθομολογοῦμαι
  english_pob_choice: I give praise
  chosen_korean: 찬양을 드립니다
  alternatives_korean:
  - 감사합니다
  - 찬양합니다
  - 고백합니다
  lexicon: LSJ
  rationale: 이 동사는 하나님께 대한 감사의 찬양을 뜻하므로, 예배적 뉘앙스를 살려 '찬양을 드립니다'로 옮겼습니다.
- source_word: ὀξὺς
  english_pob_choice: keen
  chosen_korean: 날카로웠고
  alternatives_korean:
  - 예리했고
  - 민첩했고
  - 열심이었고
  lexicon: LSJ
  rationale: 청년기의 성정이나 기질을 폭넓게 가리키는 말이라, 한쪽 의미로 좁히지 않도록 '날카로웠고'를 택했습니다.
- source_word: κατὰ πάντα λόγον
  english_pob_choice: in every word
  chosen_korean: 모든 말에
  alternatives_korean:
  - 모든 일에
  - 모든 말씀에
  - 아무 말에나
  lexicon: LSJ
  rationale: λόγον을 더 직접적으로 반영하여 '말'로 옮겼고, 순종의 범위를 전면적으로 나타내기 위해 '모든'을 붙였습니다.
- source_word: ἐτίμων
  english_pob_choice: I honored
  chosen_korean: 공경했습니다
  alternatives_korean:
  - 존중했습니다
  - 경외했습니다
  - 존경했습니다
  lexicon: LSJ
  rationale: 가족 관계에서의 윤리적 존중을 나타내는 말이므로, 한국어 성경에서 자연스러운 '공경하다'를 선택했습니다.
theological_decisions:
- issue: 주님(κύριος)과 찬양 공식의 처리
  chosen_reading: 레아의 이름 짓는 말에서 κύριος를 '주님'으로 옮겨, 이 표현이 이스라엘의 하나님께 드리는 찬양임을 분명히 했습니다.
  alternative_readings:
  - 주
  - 주께서
  rationale: 본문은 단순 호칭이 아니라 하나님에 대한 감사 고백이므로, 한국어 독자가 경배 발화를 즉시 인지하도록 '주님'을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος — divine title rendered as 주님'
- issue: 유다의 자기 묘사 ὀξὺς의 범위
  chosen_reading: '''날카로웠고''로 유지하여 청년기의 기질을 단정적으로 심리화하지 않았습니다.'
  alternative_readings:
  - 예리했고
  - 민첩했고
  - 열심이었고
  rationale: 원문은 지적 능력, 기민함, 기질적 날카로움 가운데 하나로만 좁히지 않으므로, 의미의 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Preserve lexical/theological tension rather than flattening'
