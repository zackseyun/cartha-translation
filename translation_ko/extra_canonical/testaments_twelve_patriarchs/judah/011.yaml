base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011.yaml
  text: 1 And I knew that the race of the Canaanites was evil[a], but the impulse of youth blinded my understanding. 2 And when I saw her pouring wine, I was deceived, and I took her, though my father had not given counsel. 3 But while I was away, she went and took for Shelah a wife from Canaan. 4 And when I learned what she had done, I cursed her in the anguish of my soul. 5 And indeed she died in her wickedness[c][b], with her children.
  footnotes:
  - marker: a
    text: Or 'the stock of the Canaanites was wicked.' The Greek γένος refers to lineage or people-group.
    reason: lexical_alternative
  - marker: b
    text: '''I took her'' likely carries the sense ''I took her as wife,'' but the Greek wording is more abrupt.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'my father had not taken counsel about it' may also be understood as acting without Jacob's advice or approval.
    reason: alternative_reading
translation:
  language: ko
  text: 1 나는 가나안 사람들의 족속이 악하다는 것을 알았으나[a], 젊음의 충동이 내 분별력을 눈멀게 했습니다. 2 내가 그녀가 포도주를 따르는 것을 보고 속았으며, 아버지께서 이를 의논하지 않으셨는데도[c] 그녀를 데려왔습니다[b]. 3 그러나 내가 없는 동안, 그녀는 셀라를 위해 가나안 출신 아내를 얻었습니다. 4 내가 그녀가 한 일을 알게 되자, 내 마음이 몹시 괴로워 그녀를 저주했습니다. 5 참으로 그녀는 자기의 사악함 속에서 자기 자녀들과 함께 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가나안 사람들의 계통이 사악했다.’ 그리스어 γένος는 혈통이나 계보, 또는 사람들의 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀를 데려왔다’는 말은 아내로 맞아들였다는 뜻을 포함할 가능성이 크지만, 그리스어 표현은 더 짧고 직설적입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘아버지께서 이를 의논하지 않으셨는데도’는 야곱의 조언이나 승인 없이 행동했다는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πονηρὸν γένος
  english_pob_choice: the race ... was evil
  chosen_korean: 가나안 사람들의 족속이 악하다는 것
  alternatives_korean:
  - 가나안 사람들의 혈통이 악하다는 것
  - 가나안 사람들의 집단이 악하다는 것
  lexicon: LSJ
  rationale: γένος는 혈통·족속·민족 집단을 가리킬 수 있으므로 족속으로 옮겨 집단적/계보적 의미를 살렸고, πονηρός의 도덕적 강함은 악하다로 유지했습니다.
- source_word: διαβούλιον τῆς νεότητος
  english_pob_choice: the impulse of youth
  chosen_korean: 젊음의 충동
  alternatives_korean:
  - 젊음의 계획
  - 젊은 시절의 충고
  - 청춘의 충동
  lexicon: LSJ
  rationale: 문맥상 숙고된 조언보다 성급한 내적 충동을 고백하는 표현이므로, 청춘의 힘에 눌린 의미를 간결하게 드러내는 젊음의 충동을 택했습니다.
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  english_pob_choice: blinded my understanding
  chosen_korean: 내 이해를 눈멀게 했습니다
  alternatives_korean:
  - 내 마음을 눈멀게 했습니다
  - 내 분별을 눈멀게 했습니다
  lexicon: BDAG
  rationale: διάνοια의 인지적 의미를 이해로 자연스럽게 옮기되, 눈멀게 했습니다로 비유적·도덕적 무감각의 이미지를 보존했습니다.
- source_word: ἔλαβον αὐτὴν
  english_pob_choice: I took her
  chosen_korean: 그녀를 데려갔습니다
  alternatives_korean:
  - 그녀를 취했습니다
  - 그녀를 아내로 맞았습니다
  lexicon: LSJ
  rationale: Greek의 간결하고 단정적인 동작을 살리면서도 한국어에서 성급하고 폭력적인 뉘앙스가 덜 과도하게 들리도록 데려갔습니다를 선택했습니다.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  english_pob_choice: though my father had not taken counsel about it
  chosen_korean: 내 아버지가 그것에 대해 조언하지 않았는데도
  alternatives_korean:
  - 내 아버지가 그것을 의논하지 않았는데도
  - 아버지의 허락 없이
  lexicon: LSJ
  rationale: 분사구는 단순한 법적 허락보다 아버지의 숙고·조언이 결여된 상태를 가리키므로, 조언하지 않았는데도로 관계적·상담적 뉘앙스를 살렸습니다.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  english_pob_choice: in the anguish of my soul
  chosen_korean: 영혼의 고통 속에서
  alternatives_korean:
  - 혼의 고통 속에서
  - 내 영혼의 고통 가운데
  lexicon: LSJ
  rationale: ὀδύνη와 ψυχή의 결합은 단순한 감정 이상을 나타내므로, 현대 한국어에서 자연스럽고 무게감 있는 영혼의 고통으로 옮겼습니다.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  english_pob_choice: in her wickedness
  chosen_korean: 자기의 악함 가운데서
  alternatives_korean:
  - 자기의 악 가운데서
  - 자기의 사악함 가운데서
  lexicon: BDAG
  rationale: πονηρία의 도덕적 상태를 유지하되, 본문이 죽음의 상태를 묘사하는 흐름을 따라 가운데서로 현장감을 살렸습니다.
theological_decisions:
- issue: 가나안 사람들에 대한 집단적 도덕 판단
  chosen_reading: 족속이 악하다는 직설을 약화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 가나안 사람들의 집단은 타락했다
  - 가나안 계통이 사악했다
  rationale: 본문은 개인 비난이 아니라 집단/계보에 대한 강한 평가를 제시하므로, 현대적 완곡어법으로 희석하지 않고 원문의 충격을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
- issue: ἔλαβον αὐτὴν의 혼인 함의
  chosen_reading: 데려갔습니다를 본문에 두고, 혼인 의미는 문맥이 드러내게 했습니다.
  alternative_readings:
  - 아내로 맞았습니다
  - 그녀를 아내로 삼았습니다
  rationale: 그리스어는 매우 간결하고 abrupt하므로, 한국어에서도 설명을 덧붙여 정리하기보다 서술의 날것을 유지하는 것이 더 투명합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 4
