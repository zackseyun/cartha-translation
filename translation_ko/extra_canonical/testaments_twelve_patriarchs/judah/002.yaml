revisions:
- from: 그리고 주님께서는 나의 모든 일에서 나에게 호의를 주셨습니다[a]. 들에서도, 집에서도 그리하셨습니다. 나는 암사슴과 함께 달려 그것을 잡았고, 그것을 아버지를 위한 음식으로 만들어 그가 먹게 했습니다. 나는 그 달리는 중에 노루를 붙들었고, 들에 있는 것은 무엇이든 앞질렀습니다. 나는 사자를 죽이고 그 입에서 새끼 염소를 낚아챘습니다. 나는 곰의 발을 붙잡아 그를 절벽 아래로 던졌고, 그는 부서졌습니다. 나는 들돼지를 추격했고, 달리면서 그를 앞질러 그를 갈기갈기 찢었습니다. 나는 야생 암말을 붙잡아, 그것을 제압했습니다. 헤브론에 있던 표범이 개에게 달려들었으나, 나는 그것의 꼬리를 붙잡아 바위에 내던졌고, 그것은 둘로 찢어졌습니다. 나는 그 땅에서 풀을 뜯고 있는 들소를 발견했고, 그 뿔을 붙잡아[c][b] 그것을 이리저리 세차게 흔들어 눈멀게 했습니다.
