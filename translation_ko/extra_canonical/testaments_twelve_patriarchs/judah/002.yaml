  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002.yaml
  text: And the Lord gave me favor in all my works[a], in the field and in the house. I know that I ran with a hind and caught it, and I made it food for my father, and he ate. And I would seize the gazelle in its course, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and cast it down the cliff, and it was crushed. I ran down the wild boar, and I overtook it as I ran and tore it apart. I caught a wild mare and, after seizing it, subdued it. A leopard in Hebron sprang upon the dog, and I caught it by the tail and flung it against the rock, and it was split in two. I found a wild ox grazing in the land, and taking hold of its horns[c][b], I shook it round and round and struck it blind.
  footnotes:
  - marker: a
    text: The Greek text of this chapter is textually rough in places, especially in the sequence of hunting exploits. The translation follows the sense of the extant Greek witness without smoothing away its abrupt style.
    reason: textual_variant
  - marker: b
    text: Or 'grace' for 'favor' in the opening line; the context here favors success granted by divine goodwill in Judah's deeds.
    reason: lexical_alternative
  - marker: c
    text: Some readers may prefer 'wild bull' instead of 'wild ox.' The Greek can support either, and the image is of a powerful untamed bovine.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 주님께서는 나의 모든 일에서 나에게 호의를 주셨습니다[a]. 들에서도, 집에서도 그리하셨습니다. 나는 암사슴과 함께 달려 그것을 잡았고, 그것을 아버지를 위한 음식으로 만들어 그가 먹게 했습니다. 나는 그 달리는 중에 노루를 붙들었고, 들에 있는 것은 무엇이든 앞질렀습니다. 나는 사자를 죽이고 그 입에서 새끼 염소를 낚아챘습니다. 나는 곰의 발을 붙잡아 그를 절벽 아래로 던졌고, 그는 부서졌습니다. 나는 들돼지를 추격했고, 달리면서 그를 앞질러 그를 갈기갈기 찢었습니다. 나는 야생 암말을 붙잡아, 그것을 제압했습니다. 헤브론에 있던 표범이 개에게 달려들었으나, 나는 그것의 꼬리를 붙잡아 바위에 내던졌고, 그것은 둘로 찢어졌습니다. 나는 그 땅에서 풀을 뜯고 있는 들소를 발견했고, 그 뿔을 붙잡아[c][b] 그것을 이리저리 세차게 흔들어 눈멀게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν
  english_pob_choice: favor
  chosen_korean: 호의
  alternatives_korean:
  - 은혜
  - 총애
  lexicon: LSJ
  rationale: 이 대목은 전투적·사냥적 성공을 설명하는 서술이므로, 신학적으로 무거운 ‘은혜’보다 ‘호의’가 더 자연스럽게 하나님의 유익한 도움을 드러냅니다.
- source_word: Κύριος
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주인
  lexicon: LSJ
  rationale: 하나님을 가리키는 κύριος의 기본 대응을 따르되, 현대 한국어 합쇼체 서술에서 ‘주님’이 가장 자연스럽고 경건한 호칭입니다.
- source_word: ἔλαφος / ἐλάφῳ
  english_pob_choice: hind
  chosen_korean: 암사슴
  alternatives_korean:
  - 사슴
  - 암사슴
  lexicon: LSJ
  rationale: 여성형 맥락을 살리기 위해 일반적인 ‘사슴’보다 성별이 드러나는 ‘암사슴’을 택했습니다.
- source_word: βρῶμα
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 먹을 것
  - 고기
  lexicon: LSJ
  rationale: βρῶμα는 단순히 ‘먹는 것/음식’을 뜻하므로, 특정 부위의 고기로 좁히지 않고 ‘음식’으로 옮겼습니다.
- source_word: βοῦν ἄγριον
  english_pob_choice: wild ox
  chosen_korean: 들소
  alternatives_korean:
  - 들소
  - 야생 황소
  - 야생 소
  lexicon: LSJ
  rationale: 영어 POB의 ‘wild ox’에 맞추되, 한국어에서 들판의 거친 소형 야생 짐승을 자연스럽게 떠올리게 하는 ‘들소’를 선택했습니다.
theological_decisions:
- issue: opening attribution of success to the Lord's favor
  chosen_reading: 주님께서 주신 호의가 유다의 모든 일의 성공 원천이라는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 축복 인사말로 약하게 읽을 수 있습니다.
  - ‘은혜’로 옮겨 더 신학적으로 읽을 수도 있습니다.
  rationale: 본문은 유다의 사냥·행동의 성과를 주님의 직접적 호의에 귀속하므로, 그 인과를 약화하지 않으면서도 서술체에 맞게 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; κύριος → 주님'
