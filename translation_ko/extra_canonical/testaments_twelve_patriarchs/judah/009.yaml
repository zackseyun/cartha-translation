  text: 'For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.


    2 And when the eighteen years were fulfilled, Esau, my father''s brother, came against us with a heavy and powerful people.


    3 And Jacob struck Esau with a bow, and he fell, slain by Jacob''s bow, dead on Mount Seir.


    4 And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting down around it, we besieged it.


    5 And because they did not open to us after twenty days, while they were watching, I brought up a ladder; and placing my shield over my head, and receiving the stones, I went up and killed four of their mighty men.


    6 And Reuben and Gad killed another six. Then they entered in succession.


    7 Then they asked from us terms of peace, and after counsel had been taken with our father, we accepted them.


    8 And they were giving us five hundred cors of wheat, and five hundred measures of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.'
translation:
  language: ko
  text: '십팔 년 동안 우리 아버지는 그의 형 에서와 평화를 이루었고, 우리가 메소포타미아에서 라반에게서 돌아온 뒤에는 그의 아들들이 우리와 함께 있었습니다.


    2 그리고 그 십팔 년이 차자, 우리 아버지의 형 에서가 무거우면서도 강한 백성을 이끌고 우리에게로 왔습니다.


    3 야곱이 활로 에서를 쳤고, 그는 넘어져 야곱의 활에 맞아 죽은 채 세일 산 위에 누워 있었습니다.


    4 우리는 에서의 아들들을 추격했습니다. 그들에게도 요새화된 성이 있었으나, 우리는 그 안으로 들어갈 수 없었습니다. 그러나 그 성 주위를 둘러앉아 포위했습니다.


    5 그들이 이십 일 동안 우리에게 문을 열지 않았고 그들이 지키고 있을 때, 내가 사다리를 가져왔습니다. 그리고 내 방패를 머리 위에 두고 돌들을 받아내며 올라가, 그들의 용사 넷을 죽였습니다.


    6 르우벤과 갓도 다른 여섯을 죽였습니다. 그러자 그들은 차례로 성 안으로 들어갔습니다.


    7 그때 그들은 우리에게 평화 조건을 요청했고, 우리 아버지와 의논한 뒤에 우리는 그들을 받아들였습니다.


    8 그리고 그들은 우리가 기근이 닥칠 때까지, 곡식 오백 코르와 기름 오백 측량과 포도주 오백 측량을 우리에게 주었습니다. 그때 우리는 이집트로 내려갔습니다.[a]'
  philosophy: formal
lexical_decisions:
- source_word: Δέκα καὶ ὀκτὼ ἔτη / τῶν δεκαοκτὼ ἐτῶν
  english_pob_choice: eighteen years
  chosen_korean: 십팔 년 / 그 십팔 년
  alternatives_korean:
  - 열여덟 해
  - 18년
  lexicon: 수사 표현
  rationale: 본문의 연속된 시간 표지를 살려 고전적 수사인 ‘십팔 년’을 쓰되, 2절에서는 같은 기간을 지시하는 재지시로 ‘그 십팔 년’이라 하여 연결을 분명히 했습니다.
- source_word: λαῷ βαρεῖ καὶ ἰσχυρῷ
  english_pob_choice: a heavy and powerful people
  chosen_korean: 무거우면서도 강한 백성
  alternatives_korean:
  - 큰데다 강한 백성
  - 막강한 백성
  lexicon: 형용사 결합
  rationale: POB의 ‘heavy and powerful’를 직역에 가깝게 유지하되, ‘무거운’의 물리적/군사적 압박감을 살리기 위해 ‘무거우면서도 강한 백성’으로 옮겼습니다.
- source_word: ἐν τόξῳ Ἰακὼβ τὸν Ἡσαῦ
  english_pob_choice: Jacob struck Esau with a bow
  chosen_korean: 야곱이 활로 에서를 쳤고
  alternatives_korean:
  - 야곱이 활로 에서를 쏘았고
  - 야곱이 활로 에서를 맞혔고
  lexicon: 동사/도구격
  rationale: 문맥상 ‘활’이 무기로서 원인을 표시하므로 ‘활로’로 처리했고, ἔπαισεν의 폭력적 타격을 살리기 위해 ‘쳤고’를 선택했습니다.
- source_word: πόλις ὀχυρά
  english_pob_choice: a fortified city
  chosen_korean: 요새화된 성
  alternatives_korean:
  - 튼튼한 성
  - 견고한 성
  lexicon: 성곽 어휘
  rationale: 단순한 ‘견고함’보다 방어시설을 갖춘 도시/성채라는 점을 드러내기 위해 ‘요새화된 성’으로 옮겼습니다.
theological_decisions:
- issue: 평화 요청과 수용의 표현
  chosen_reading: ‘τὰ πρὸς εἰρήνην’을 ‘평화 조건’으로 옮겨 단순한 감정적 화해가 아니라 협상된 평화 조건을 뜻하게 했습니다.
  alternative_readings:
  - 평화를 위한 말
  - 평화에 관한 것
  rationale: 본문과 POB의 뜻은 전투 종결을 위한 조건 협상에 가깝기 때문에, 관계적 화해보다 외교적 합의의 뉘앙스를 살렸습니다.
  doctrine_reference: 본문 해석/담화 맥락
- issue: ‘세일 산 위에 누워 있었습니다’의 서술
  chosen_reading: 죽음의 결과를 직접적으로 ‘누워 있었습니다’로 남겨, 전사 서사의 생생함을 보존했습니다.
  alternative_readings:
  - 죽어 있었습니다
  - 시체가 있었습니다
  rationale: 그리스어 ἤρθη ὁ νεκρός의 다소 생생한 서술을 완화하지 않고, POB의 직설성을 따랐습니다.
  doctrine_reference: 서사 문체 보존
