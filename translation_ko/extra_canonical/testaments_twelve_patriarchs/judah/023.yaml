  revised_text: '내 자녀들아, 너희가 왕국에서 행할 음란한 행위들과 주술 때문에 내게는 큰 슬픔이 있습니다. 너희는 배로 말하는 자들[a]과 점조와 미혹의 악령들을 따를 것입니다. 너희는 너희 딸들을 음악가들과 매춘부들[b]로 만들고, 민족들의 가증한 일들에 섞일 것입니다.


