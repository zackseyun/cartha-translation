review_pass:
  verdict: revise
  source_fidelity: 현 초안은 23장 1–3절 일부만 반영하고, 원문에 없는 앞 단락의 ‘내가 떠난 뒤’ 및 ‘내 왕국은 끝에 이르게 될 것’이라는 내용을 삽입했습니다. 특히 3절의 재앙 목록 대부분과 4–5절 전체가 누락되어 있어 본문 충실성이 크게 훼손되었습니다. 또한 원문의 ‘적들의 모욕’은 ‘적들과 친구들의 모욕’으로 확대되어서는 안 됩니다.
  naturalness: ‘음악하는 여자들’, ‘배속에서 말하는 자들’, ‘복수의 칼’은 뜻은 전달하지만 현대 표준 한국어 합쇼체 본문으로는 다소 부자연스럽습니다. ‘음악가들’, ‘배로 말하는 자들(영매들)’, ‘보복하는 칼’로 다듬을 수 있습니다. 재앙 목록은 병렬 구조를 유지하여 읽기 쉽게 정리했습니다.
  terminology: ἀσελγείας는 ‘음란한 행위들’, γοητείας는 ‘주술’, ἐγγαστριμύθους는 문자적 표현을 유지하되 각주에서 영매적 용례를 밝혔습니다. δημοσίας는 문맥상 ‘매춘부들’로 옮겼으며, ἐκδικοῦσαν은 칼을 수식하므로 ‘보복하는 칼’로 번역했습니다. ‘하나님의 성전’, ‘포로 생활’, ‘회개’ 등은 현대 성서 문맥에서 자연스럽고 의미를 보존합니다.
  issues:
  - severity: high
    issue: 원문에 없는 내용의 삽입
    rationale: 초안의 첫 문장 ‘내가 떠난 뒤’와 마지막 문장 ‘이방인들로 말미암아 내 왕국은 끝에 이르게 될 것입니다’는 제시된 그리스어 23장 본문에 없습니다. 이는 영어 감사 기록에 섞여 있는 인접 단락의 내용으로 보이며 삭제해야 합니다.
  - severity: high
    issue: 3절 재앙 목록의 대폭 누락 및 변개
    rationale: 원문에는 포위, 찢어 먹는 개들, 적들로 말미암는 멸망, 눈의 괴저, 아이들의 살해, 재산 약탈, 하나님의 성전 방화, 땅의 황폐, 민족들 가운데서의 노예 생활이 포함됩니다. 초안은 이를 누락했고, ‘적들과 친구들의 모욕’이라고 원문에 없는 ‘친구들’을 추가했습니다.
  - severity: high
    issue: 4–5절 전체 누락
    rationale: 아들들을 거세하여 여자들을 위한 내시로 삼는다는 경고와, 온전한 마음의 회개·계명 준수·포로 생활에서의 회복에 관한 결말이 전부 빠졌습니다.
  - severity: medium
    issue: 각주 표지의 위치와 내용 불일치
    rationale: 현 [a]–[d]는 문단 끝에 한꺼번에 붙어 있고, 영어의 앞 단락 및 본문과 맞지 않는 각주 체계를 반영합니다. 한국어 본문에서 해당 어휘 바로 뒤에 새 각주 표지를 두고, 실제 번역 선택을 설명해야 합니다.
  - severity: low
