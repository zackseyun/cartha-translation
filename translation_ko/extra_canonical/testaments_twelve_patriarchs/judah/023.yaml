revisions:
- from: 내가 떠난 뒤 너희의 행실 때문에 나의 마음에 큰 슬픔이 있을 것입니다, 내 자녀들아. 곧 너희가 왕국 안에서 음행과 주술을 행하고, 배속에서 말하는 자들과 점복과 속임의 악령을 따르게 될 것이기 때문입니다. 너희는 딸들을 음악하는 여자들과 창녀들로 만들 것이며, 여러 민족의 가증한 일들과 섞이게 될 것입니다. 이 일들 때문에 주님께서 너희에게 기근과 전염병과 죽음과 복수의 칼과 포위와 적들과 친구들의 모욕을 내리실 것입니다. 이방인들로 말미암아 내 왕국은 끝에 이르게 될 것입니다.[a][b][c][d]
  to: '내 자녀들아, 너희가 왕국에서 행할 음란한 행위들과 주술 때문에 내게는 큰 슬픔이 있습니다. 너희는 배로 말하는 자들[a]과 점조와 미혹의 악령들을 따를 것입니다. 너희는 너희 딸들을 음악가들과 매춘부들[b]로 만들고, 민족들의 가증한 일들에 섞일 것입니다.


    그러므로 주님께서 너희에게 기근과 전염병과 죽음과 보복하는 칼과 포위 공격과, 찢어 먹는 개들과, 적들의 모욕과, 적들로 말미암는 멸망과, 눈의 괴저와, 아이들의 살해와, 재산의 약탈과, 하나님의 성전의 방화와, 땅의 황폐와, 너희 자신이 민족들 가운데서 겪을 노예 생활을 내리실 것입니다.[c]


    그들은 너희 아들들을 거세하여 자기 여자들을 위한 내시로 삼을 것입니다.[d]


    주님께서 너희를 찾아오실 때까지, 온전한 마음으로 회개하고 그분의 모든 계명에 따라 걸으십시오. 그러면 그분께서 너희를 민족들 가운데서의 포로 생활에서 이끌어 올리실 것입니다.'
  rationale: 제시된 그리스어 본문 23장 1–5절을 기준으로 전체를 새로 번역했습니다. 인접 단락에서 유입된 문장을 제거하고, 누락된 심판 목록·강제 거세·회개와 회복의 결말을 모두 복원했습니다. 원문의 압축적이거나 다소 불명확한 관계 표현(특히 ‘적들로 말미암는 멸망’)은 해석을 확정하지 않고 보존했습니다. 각주는 실제 본문 표지에 연결되도록 재구성했습니다.
  reviewer_model: gpt-5.6-terra
