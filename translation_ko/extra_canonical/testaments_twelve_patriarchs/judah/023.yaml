base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023.yaml
  text: 'Until the coming of the God of righteousness[a], to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me with an oath not to blot out the kingdom.


    Great indeed is my grief, my children, because of the acts of sexual immorality and sorceries that you will practice in the kingdom, following ventriloquists and omens and demons of deception. You will make your daughters musicians and prostitutes, and you will mingle in the abominations of the nations. Because of these things the Lord will bring upon you famine and pestilence, death and a sword of vengeance, siege, and the insults of enemies and friends[d][c][b]. By foreigners my kingdom will be brought to its end.'
  footnotes:
  - marker: a
    text: Or 'presence' instead of 'coming' for παρουσία; the context, however, favors an awaited advent.
    reason: lexical_alternative
  - marker: b
    text: '''Ventriloquists'' translates the literal Greek term for ''belly-speakers,'' used for spirit-mediums or necromantic practitioners.'
    reason: cultural_note
  - marker: c
    text: The Greek phrase 'musicians and public women' likely refers to daughters made into entertainers and prostitutes.
    reason: lexical_alternative
  - marker: d
    text: Several judgment details in this verse are textually uncertain or expanded in some witnesses, including phrases about an avenging sword and siege.
    reason: textual_variant
translation:
  language: ko
  text: '내 자녀들아, 너희가 왕국에서 행할 음란한 행위들과 주술 때문에 내게는 큰 슬픔이 있습니다. 너희는 배로 말하는 자들[a]과 점조와 미혹의 악령들을 따를 것입니다. 너희는 너희 딸들을 음악가들과 매춘부들[b]로 만들고, 민족들의 가증한 일들에 섞일 것입니다.


    그러므로 주님께서 너희에게 기근과 전염병과 죽음과 보복하는 칼과 포위 공격과, 찢어 먹는 개들과, 적들의 모욕과, 적들로 말미암는 멸망과, 눈의 괴저와, 아이들의 살해와, 재산의 약탈과, 하나님의 성전의 방화와, 땅의 황폐와, 너희 자신이 민족들 가운데서 겪을 노예 생활을 내리실 것입니다.[c]


    그들은 너희 아들들을 거세하여 자기 여자들을 위한 내시로 삼을 것입니다.[d]


    주님께서 너희를 찾아오실 때까지, 온전한 마음으로 회개하고 그분의 모든 계명에 따라 걸으십시오. 그러면 그분께서 너희를 민족들 가운데서의 포로 생활에서 이끌어 올리실 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘배로 말하는 자들’은 그리스어의 문자적 표현입니다. 고대의 종교적 용례에서는 영매 또는 강령술 행위자들을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: ‘음악가들과 매춘부들’은 문자적으로는 ‘음악에 관련된 여자들과 공적인 여자들’입니다. 후자는 문맥상 성적으로 공공에게 제공되는 여성들, 곧 매춘부들을 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: ‘눈의 괴저’는 원문의 강한 의학적 재앙 표현을 직역에 가깝게 옮긴 것입니다. ‘적들로 말미암는 멸망’은 그리스어 어구가 압축되어 있어 행위자의 관계를 과도하게 특정하지 않았습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘거세하여 … 내시로 삼다’는 원문의 신체 훼손과 강제 봉사를 직접적으로 반영합니다. ‘자기 여자들을 위한’이라는 표현은 포로가 된 아들들이 정복자들의 여성들을 섬기는 내시가 되는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσελγείας
  english_pob_choice: acts of sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 방종한 행실
  lexicon: BDAG
  rationale: 문맥상 성적 방탕을 가리키므로, 한국어 성서어법에서 직관적인 ‘음행’을 사용하되 의미를 약화하지 않았습니다.
- source_word: γοητείας / ἐγγαστρομύθους / κληδόσι / δαίμοσιν πλάνης
  english_pob_choice: sorceries / ventriloquists / omens / demons of deception
  chosen_korean: 주술 / 배속에서 말하는 자들 / 점복 / 속임의 악령
  alternatives_korean:
  - 마술 / 무당 / 조짐 / 미혹의 영들
  - 요술 / 영매 / 길흉의 징조 / 속이는 영들
  lexicon: LSJ; BDAG
  rationale: 그리스어의 구체적이고 금기적인 점술·강령·속임의 어휘를 각각 살려서, 단순한 ‘미신’으로 완화하지 않았습니다.
- source_word: μουσικὰς καὶ δημοσίας
  english_pob_choice: musicians and prostitutes
  chosen_korean: 음악하는 여자들과 창녀들
  alternatives_korean:
  - 여흥을 하는 여자들과 공창들
  - 공연하는 여자들과 공공여성들
  lexicon: LSJ
  rationale: EN POB의 ‘prostitutes’에 맞추어 δημοσίας의 공개적 성적 착취 뉘앙스를 드러냈고, μουσικάς는 단순 직업명보다 ‘음악하는 여자들’로 풀어 자연스럽게 옮겼습니다.
- source_word: ῥομφαίαν
  english_pob_choice: a sword of vengeance
  chosen_korean: 복수의 칼
  alternatives_korean:
  - 보복의 칼
  - 원수 갚는 칼
  lexicon: LSJ
  rationale: 문맥의 심판적 성격을 살리되, 한국어에서 힘 있는 소유격 구조로 ‘복수의 칼’을 택했습니다.
- source_word: ὀνειδισμούς
  english_pob_choice: the insults
  chosen_korean: 모욕
  alternatives_korean:
  - 비난
  - 치욕의 말
  lexicon: BDAG
  rationale: 공적 수치와 언어적 모멸을 함께 포괄하는 말로 ‘모욕’이 가장 간결하고 자연스럽습니다.
- source_word: ἀλλοφύλοις / ἐν ἔθνεσι
  english_pob_choice: By foreigners / among the nations
  chosen_korean: 이방인들 / 여러 민족
  alternatives_korean:
  - 외국인들 / 민족들 가운데
  - 낯선 민족들
  lexicon: LSJ
  rationale: 결말의 타자성을 분명히 하기 위해 ‘이방인들’과 ‘여러 민족’을 구분해 옮겼습니다.
theological_decisions:
- issue: 주님의 심판 동사군의 강도
  chosen_reading: 기근, 전염병, 죽음, 복수의 칼, 포위, 모욕을 실제 역사적 심판으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 상징적 재앙으로 완화
  - 징계와 어려움으로 일반화
  rationale: 본문은 언약적 경고이자 저주의 목록이므로, 구체적 재난 어휘를 유지해야 경고의 무게가 살아납니다.
  doctrine_reference: 신명기적 저주-심판 어휘의 직접성 유지
- issue: ‘배속에서 말하는 자들’의 직역성
  chosen_reading: ἐγγαστριμύθους를 직역에 가까운 표현으로 살려, 점술·강령 행위의 음산함을 보존했습니다.
  alternative_readings:
  - 영매
  - 무당
  rationale: 해당 어휘는 문자적으로 ‘배로 말하는 자들’이므로, 전통적 종교 용어로 흡수하기보다 원형 이미지를 남겼습니다.
  doctrine_reference: 원문 이미지 보존 우선
