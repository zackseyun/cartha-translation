  - 그들과 관계하였고
  - 그들과 동침하였고
  lexicon: BDAG
  rationale: 본문의 회개적·도덕적 자백을 살리기 위해 노골적 묘사보다 죄책의 초점을 두었습니다.
- source_word: εἰς ὄνομα τῆς θυγατρὸς αὐτοῦ
  english_pob_choice: in the name of his daughter
  chosen_korean: 그의 딸의 이름으로
  alternatives_korean:
