  - 그의 딸을 내세워
  - 그의 딸과 관련하여
  lexicon: LSJ
  rationale: 난해한 그리스어 구문을 가능한 한 직역적으로 반영하되, 한국어로 읽힐 수 있게 정리했습니다.
theological_decisions:
- issue: 죄와 유혹의 인격화
  chosen_reading: 질투와 성적 부정의 영이 나를 대적하였고로 옮겨, 내면 심리만이 아니라 외적·인격적 적대의 뉘앙스를 유지했습니다.
  alternative_readings:
  - 질투와 음욕이 나를 덮쳤고
  - 질투와 음행의 충동이 나를 사로잡았고
  rationale: 『Testaments』 특유의 도덕-영적 전투 언어를 평탄화하지 않고, 본문의 수사와 신학적 긴장을 보존하기 위해서입니다.
  doctrine_reference: 'PHILOSOPHY.md: source texture preservation'
- issue: συνετέλεσα의 도덕적 함의
  chosen_reading: '''죄를 범할 때까지''로 풀어, 서술을 중립적 성행위 묘사로 누그러뜨리지 않았습니다.'
  alternative_readings:
  - 관계를 맺을 때까지
  - 동침할 때까지
  - 관계를 완성할 때까지
  rationale: 문맥이 고백적·회개적이므로, 본문의 도덕 판단을 한국어에도 분명히 드러내는 것이 더 정확합니다.
  doctrine_reference: 'DOCTRINE.md: preserve moral force'
