    내가 장인에게 말하기를, “내 아버지와 상의한 뒤에 당신의 딸을 아내로 맞겠습니다” 하였습니다. 그러나 그는 원하지 않았습니다. 오히려 그는 딸을 내줄 일과 관련하여[b] 헤아릴 수 없이 많은 금을 내게 보여 주었습니다. 그는 왕이었습니다.


    그는 그 딸을 금과 진주로 꾸미고, 잔치에서 우리에게 포도주를 따르게 했습니다. 포도주가 내 눈을 흐리게 했고, 쾌락이 내 마음을 어둡게 했습니다. 나는 그 여인을 사랑하게 되어 그와 동침했고, 주님의 계명과 내 아버지의 명령을 어겨 그를 아내로 맞았습니다. 주님께서는 내 마음의 계획대로 내게 갚으셨습니다. 이는 내가 그의 자녀들로 인해 기뻐하지 않았기 때문입니다.'
  rationale: 원문 13:1–8을 모두 반영하여 누락된 13:2 및 13:6–8을 복원했습니다. 제공된 그리스어 본문을 우선하여 ‘가나안 여인’을 유지하고, 영어 감사 기록에만 나타나는 ‘아난’은 채택하지 않았습니다. 성적 행위에 관한 고백은 원문의 윤리적 평가를 보존하되 불필요하게 상세화하지 않았습니다. 난해한 두 구문에는 최소한의 설명 각주를 배치했습니다.
