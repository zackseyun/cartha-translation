  - 간직하여
  - 준수하여
  lexicon: BDAG
  rationale: 말씀을 단순 보관이 아니라 실제로 준수한다는 뜻을 자연스럽게 살렸습니다.
- source_word: δικαιώματα Κυρίου
  english_pob_choice: the righteous requirements of the Lord
  chosen_korean: 주의 모든 의로운 요구
  alternatives_korean:
  - 주의 의로운 규례들
  - 주님의 의로운 법도들
  - 주의 의로운 규정들
  lexicon: BDAG
  rationale: δικαιώματα의 구체적 규범성과 요구성을 함께 살리되, 한국어에서 지나치게 교회식인 '규례'보다 본문 의미가 드러나도록 옮겼습니다.
- source_word: ἐντολαῖς Θεοῦ
  english_pob_choice: the commands of God
  chosen_korean: 하나님의 명령
  alternatives_korean:
  - 하나님의 계명
  - 하나님의 명령들
  - 하나님의 지시
  lexicon: BDAG
  rationale: ἔντολή의 권위 있는 명령 성격을 유지했고, 한국어에서 복수는 문맥상 집합적으로 자연스럽게 처리했습니다.
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  english_pob_choice: the spirit of jealousy and of sexual immorality
  chosen_korean: 질투와 성적 부정의 영
  alternatives_korean:
  - 질투와 음행의 영
  - 시기와 음행의 영
  - 질투와 음란의 영
  lexicon: BDAG
  rationale: 본문의 인격화된 악의 작용을 '영'으로 살리면서, 문맥상 포괄적이고 현대적인 '성적 부정'으로 옮겼습니다.
- source_word: παρετάξατο
  english_pob_choice: arrayed themselves against me
  chosen_korean: 나를 대적하였고
  alternatives_korean:
  - 나를 향해 진을 쳤고
  - 나를 맞서 진을 쳤고
  - 나를 향해 전열을 갖추었고
  lexicon: LSJ
  rationale: 전투적 은유를 과도하게 설명하지 않으면서 한국어에서 자연스럽게 적대의 뉘앙스를 전달했습니다.
- source_word: συνετέλεσα
