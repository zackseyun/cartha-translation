    내가 장인에게 말하기를, “내 아버지와 상의한 뒤에 당신의 딸을 아내로 맞겠습니다” 하였습니다. 그러나 그는 원하지 않았습니다. 오히려 그는 딸을 내줄 일과 관련하여[b] 헤아릴 수 없이 많은 금을 내게 보여 주었습니다. 그는 왕이었습니다.


