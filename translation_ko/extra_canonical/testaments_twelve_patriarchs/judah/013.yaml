  revised_text: '이제 내가 너희에게 명령합니다, 내 자녀들아. 너희 아버지인 유다의 말을 들으십시오[a]. 내 말을 지키며, 주님의 모든 의로운 규례를 행하고 하나님의 계명에 순종하십시오.


