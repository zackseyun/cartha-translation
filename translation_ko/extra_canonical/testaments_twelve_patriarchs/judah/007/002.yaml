  text: Ἐγὼ δὲ καὶ ὁ Δὰν⁴ πορευθέντες πρὸς Ἀμορραίους καὶ προσποιησάμενοι αὐτοῖς συμμάχους⁵ εἰσήλθομεν εἰς τὴν πόλιν αὐτῶν⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/002.yaml
  text: So Dan and I, pretending to be allies to the Amorites, entered their city.
translation:
  language: ko
  text: 그런데 나와 단은 아모리 사람들에게 가서, 그들에게 동맹인 척하고 그들의 성읍에 들어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ καὶ ὁ Δὰν
  english_pob_choice: So Dan and I
  chosen_korean: 나와 단은
  alternatives_korean:
  - 단과 나는
  - 내가 단과 함께
  lexicon: 인명 표기
  rationale: 그리스어의 주어 순서를 자연스러운 한국어 어순으로 옮기되, 화자와 단을 함께 제시하는 공동 주어 관계를 분명히 했습니다.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  english_pob_choice: pretending to be allies to the Amorites
  chosen_korean: 아모리 사람들에게 동맹인 척하며
  alternatives_korean:
  - 아모리 사람들과 동맹인 체하며
  - 아모리 사람들의 동맹인 양 하며
  lexicon: προσποιέομαι / σύμμαχος
  rationale: 동맹 관계를 가장하는 뜻을 살려 ‘동맹인 척하다’로 옮겼고, ‘아모리 사람들에게’는 대상을 분명히 하면서도 영어 POB의 수정된 해석을 반영했습니다.
- source_word: εἰσήλθομεν εἰς τὴν πόλιν αὐτῶν
  english_pob_choice: entered their city
  chosen_korean: 그들의 성읍으로 들어갔습니다
  alternatives_korean:
  - 그들의 도시로 들어갔습니다
  - 그들의 성읍 안으로 들어갔습니다
  lexicon: πόλις
  rationale: πόλις를 문맥상 ‘성읍’으로 옮겨 고대 서사 분위기를 유지하되, 현대 독자에게도 자연스럽게 읽히도록 했습니다.
