    rationale: 원문의 전쟁·대결 문맥 및 영어 POB의 ‘coming against us’에 맞추어 ‘우리에게 맞서 오고 있다’로 옮기는 것이 의미를 보존합니다.
  revised_text: 그리고 다음 날, 가아스 성읍의 왕이 큰 무리를 이끌고 우리에게 맞서 오고 있다는 보고가 우리에게 전해졌습니다.
