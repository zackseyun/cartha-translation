  text: And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.
translation:
  language: ko
  text: 그리고 다음 날, 가아스 성읍의 왕이 큰 무리를 거느리고 우리에게로 오고 있다는 보고가 우리에게 전해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη πρὸς ἡμᾶς
  english_pob_choice: it was reported to us
  chosen_korean: 보고가 우리에게 전해졌습니다
  alternatives_korean:
  - 우리에게 말해졌습니다
  - 우리에게 알려졌습니다
  lexicon: λέγω / ῥέω 계열 수동 표현
  rationale: 수동형의 ‘전해지다/보고되다’ 의미를 살리고, 자연스러운 현대 한국어로 정보 전달 사실을 표현했습니다.
- source_word: Γαὰς πόλεως
  english_pob_choice: the city of Gaas
  chosen_korean: 가아스 성읍
  alternatives_korean:
  - 가아스 도시
  - 가아스의 도시
  lexicon: 고유명사 + πόλις
  rationale: πόλις를 ‘성읍’으로 옮겨 도시 국가적·고대적 뉘앙스를 보존하고, 고유명사는 음역했습니다.
- source_word: βασιλεὺς
  english_pob_choice: king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군주
  lexicon: βασιλεύς
  rationale: 고대 통치자를 가리키는 일반적 의미를 가장 직접적으로 드러내는 ‘왕’을 선택했습니다.
- source_word: ἐν λαῷ πολλῷ
  english_pob_choice: with a great multitude
  chosen_korean: 큰 무리를 거느리고
  alternatives_korean:
  - 큰 무리와 함께
  - 많은 백성을 거느리고
  lexicon: ἐν + dative of attendant circumstance
  rationale: 동반 상황을 한국어의 자연스러운 서술로 풀어, 단순한 동행보다 ‘거느리고’가 더 적절히 대군의 동반성을 나타냅니다.
