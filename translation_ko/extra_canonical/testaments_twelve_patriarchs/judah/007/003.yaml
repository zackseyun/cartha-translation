source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Νυκτὸς δὲ βαθείας⁷ ἤλθον⁸ πρὸς ἡμᾶς οἱ ἀδελφοί μου, καὶ ἀνοίξαντες τὰς πύλας αὐτοῖς, πάντας αὐτοὺς ἐξωλοθρεύσαμεν⁹ καὶ ἐπρονομεύσαμεν¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/003.yaml
  text: And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering all that was theirs, we tore down their three walls.
translation:
  language: ko
  text: 그리고 깊은 밤에 내 형제들이 우리에게 왔습니다. 우리는 그들에게 성문들을 열어 주었고, 그들을 모두 진멸하고 약탈했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νυκτὸς δὲ βαθείας
  english_pob_choice: in the deep night
  chosen_korean: 깊은 밤에
  alternatives_korean:
  - 한밤중에
  - 짙은 밤에
  lexicon: Νύξ / βαθύς
  rationale: 시간 표현을 직역하되 한국어에서 자연스럽고 압축적으로 들리는 ‘깊은 밤에’로 옮겼습니다.
- source_word: οἱ ἀδελφοί μου
  english_pob_choice: our brothers
  chosen_korean: 우리 형제들이
  alternatives_korean:
  - 우리 형제들
  - 우리 형제들 가운데
  lexicon: ἀδελφοί
  rationale: 영어 POB의 ‘our brothers’를 따라 관계성을 유지하되, 문맥상 화자의 공동체 내부를 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: ἀνοίξαντες τὰς πύλας αὐτοῖς
  english_pob_choice: we opened the gates to them
  chosen_korean: 우리는 그들에게 성문을 열어 주었고
  alternatives_korean:
  - 우리는 그들에게 문들을 열어 주었고
  - 우리는 그들에게 성문을 열어 주었습니다
  lexicon: πύλαι
  rationale: πύλας는 단순한 문보다 도시의 ‘성문’이 더 직접적이므로 그렇게 옮겼고, 동작의 방향성도 ‘열어 주었다’로 살렸습니다.
- source_word: ἐξωλοθρεύσαμεν καὶ ἐπρονομεύσαμεν
  english_pob_choice: we destroyed all of them and all that was theirs; ... after plundering all that was theirs
  chosen_korean: 그들 모두를 멸망시켰으며 그들에게 속한 모든 것을 약탈한 뒤
  alternatives_korean:
  - 그들 모두와 그들에게 속한 모든 것을 멸절시켰으며 약탈한 뒤
  - 그들 모두를 진멸하고 그들의 모든 것을 노략한 뒤
  lexicon: ἐξολοθρεύω / προνομεύω
  rationale: 첫 동사는 전면적 파괴를 뜻하는 강한 동사라 ‘멸망시키다’로, 둘째 동사는 전리품을 취하는 ‘약탈하다’로 옮겨 두 행위를 구분했습니다.
- source_word: τὰς τρεῖς αὐτῶν πύλας
  english_pob_choice: their three walls
  chosen_korean: 그들의 세 성벽
  alternatives_korean:
  - 그들의 세 성문
  - 그들의 세 문
  lexicon: πύλαι
  rationale: 영어 POB의 ‘walls’는 본문 그리스어와 일치하지 않아, 원문에 따라 ‘성벽’으로 바로잡아 번역했습니다.
theological_decisions:
- issue: 서사적 폭력의 직접성
  chosen_reading: 행동의 연속성과 파괴성을 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘해쳤다/무너뜨렸다’로 약화
  - 도덕적 설명을 덧붙여 서술 완화
  rationale: 본문은 전투 행위와 약탈, 파괴를 적나라하게 나열하므로, 서사적 긴장을 보존하는 것이 원문과 POB의 취지에 더 부합합니다.
  doctrine_reference: source fidelity in historical narration
