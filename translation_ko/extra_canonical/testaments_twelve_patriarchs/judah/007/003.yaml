revisions:
- from: 그리고 깊은 밤에 우리 형제들이 우리에게 왔습니다. 우리는 그들에게 성문을 열어 주었고, 그들 모두를 멸망시켰으며 그들에게 속한 모든 것을 약탈한 뒤, 그들의 세 성벽을 허물었습니다.[a][b]
  to: 그리고 깊은 밤에 내 형제들이 우리에게 왔습니다. 우리는 그들에게 성문들을 열어 주었고, 그들을 모두 진멸하고 약탈했습니다.
  rationale: 원문에 없는 성벽 파괴 및 약탈 대상의 확장을 삭제하고, μου의 단수 소유격을 ‘내’로 바로잡았습니다. 본문에 제시되지 않은 각주 내용도 없으므로 무근거 표지를 제거했습니다.
