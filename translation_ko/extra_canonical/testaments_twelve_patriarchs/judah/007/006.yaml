lexical_decisions:
- source_word: Καὶ εἰ μὴ
  english_pob_choice: And if ... had not ...
  chosen_korean: 그리고 만일 ... 않았다면
  alternatives_korean:
  - 그리고 만약 ... 아니었다면
  - 만일 ... 하지 않았다면
  lexicon: καί / εἰ μή
  rationale: 조건절의 연속성과 부정 조건을 자연스러운 현대 한국어로 살리기 위해 「그리고 만일」과 「-지 않았다면」을 사용했습니다.
- source_word: Δὰν ὁ ἀδελφός μου
  english_pob_choice: Dan my brother
  chosen_korean: 내 형제 단
  alternatives_korean:
  - 단 내 형제
  - 나의 형제 단
  lexicon: Δάν / ἀδελφός μου
  rationale: 인명 단을 앞세운 영어 순서를 유지하되, 「내 형제」로 소유 관계를 분명히 하여 원문의 친족 호칭을 드러냈습니다.
- source_word: συνεμάχησεν
  english_pob_choice: had ... fought alongside me
  chosen_korean: 나와 함께 싸우지 않았다면
  alternatives_korean:
  - 내 편에서 싸우지 않았다면
  - 나를 도와 함께 싸우지 않았다면
  lexicon: συμμαχέω
  rationale: 동사의 핵심 의미인 ‘함께 싸우다/협력하여 싸우다’를 직접 반영해, 단순한 도움보다 전투적 연대를 분명히 했습니다.
