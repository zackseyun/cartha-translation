review_pass:
  verdict: revise
  source_fidelity: 개역안은 τότε οὖν의 시간적 전환을 ‘그때’로 옮기고, ἐπ᾽ αὐτοὺς ἐπὶ τὴν κορυφήν의 공격 방향과 꼭대기를 향한 이동을 보존합니다. 마지막 절은 미완료 시제 ἐσφενδόνιζον의 반복·지속성과 화살을 쏘는 행위가 화자에게 향함을 더 분명히 반영합니다.
  naturalness: ‘그러므로’는 여기서 시간적 서사 전환인 τότε οὖν보다 인과를 과도하게 드러냅니다. 또한 ‘돌을 던지며 나를 공격하고 활을 쏘았습니다’는 병렬 관계와 화살의 목표가 다소 불분명합니다. 수정안은 현대 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘모욕을 당하다’, ‘분노하다’, ‘돌진하다’는 적절합니다. κορυφή는 문맥상 산을 명시하지 않고 ‘꼭대기’로 옮겨 원문의 범위를 유지했습니다. σφενδονίζω는 ‘돌을 계속 퍼붓다’로, τοξεύω는 ‘화살을 쏘아 대다’로 옮겼습니다.
