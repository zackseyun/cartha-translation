- from: 그러므로 그들에게 모욕을 당하자 나는 분노하였고, 그들을 향해 산꼭대기까지 돌진하였습니다. 그러자 그들은 돌을 던지며 나를 공격하고 활을 쏘았습니다.[a][b]
  to: 그때 나는 그들에게 모욕을 당하여 분노하였고, 그들을 향해 꼭대기까지 돌진하였습니다. 그러자 그들은 돌을 계속 내게 퍼붓고 화살을 내게 쏘아 댔습니다.
  rationale: 시간적 전환을 바로잡고, 꼭대기라는 원문의 지형 표현을 불필요하게 ‘산’으로 특정하지 않았습니다. 이어지는 공격은 돌과 화살이 모두 화자에게 향하며 계속되었음을 자연스럽게 드러내도록 수정했습니다. 제공되지 않은 주석에 연결된 표지는 삭제했습니다.
