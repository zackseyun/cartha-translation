base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/005.yaml
  text: Then, being insulted by them, I became angry, and I rushed against them up to the summit. And they kept pelting me with stones and shooting arrows at me.
translation:
  language: ko
  text: 그때 나는 그들에게 모욕을 당하여 분노하였고, 그들을 향해 꼭대기까지 돌진하였습니다. 그러자 그들은 돌을 계속 내게 퍼붓고 화살을 내게 쏘아 댔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβριζόμενος παρ᾽ αὐτῶν
  english_pob_choice: being insulted by them
  chosen_korean: 그들에게 모욕을 당하자
  alternatives_korean:
  - 그들에게 욕을 먹자
  - 그들에게 모욕을 받자
  lexicon: ὑβρίζω
  rationale: 단순한 감정 상해보다 능동적 모욕·수치 주기를 드러내기 위해 ‘모욕을 당하다’를 택했습니다.
- source_word: ὠργίσθην
  english_pob_choice: I became angry
  chosen_korean: 나는 분노하였고
  alternatives_korean:
  - 나는 화가 났고
  - 나는 진노하였고
  lexicon: ὀργίζομαι
  rationale: 본문의 강한 반응을 살리되, 한국어에서 자연스러운 서술형으로 ‘분노하다’를 사용했습니다.
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς ἐπὶ τὴν κορυφήν
  english_pob_choice: I rushed against them up to the summit
  chosen_korean: 그들을 향해 산꼭대기까지 돌진하였습니다
  alternatives_korean:
  - 그들을 향해 꼭대기까지 달려갔습니다
  - 그들에게 달려들어 정상까지 올라갔습니다
  lexicon: ὁρμάω + ἐπί + κορυφή
  rationale: ‘rushed against’의 공격적 방향성과 κορυφή의 지형적 의미를 함께 살리기 위해 ‘돌진하다’와 ‘산꼭대기’로 옮겼습니다.
- source_word: ἐσφενδόνιζον με ἐν λίθοις καὶ τοξεύοντες
  english_pob_choice: they kept pelting me with stones and shooting arrows at me
  chosen_korean: 돌을 던지며 나를 공격하고 활을 쏘았습니다
  alternatives_korean:
  - 돌을 퍼부으며 화살을 쏘았습니다
  - 돌을 던지며 나를 향해 화살을 쏘았습니다
  lexicon: σφενδονίζω / τοξεύω
  rationale: ἐν λίθοις의 반복적 투석과 활쏘기를 한국어의 자연스러운 병렬로 표현하되, ‘나를 공격하고’로 목적어를 보완해 공격 대상이 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: 이 구절은 서사적 폭력 묘사이며 신학적 용어가 직접 나오지 않습니다.
  chosen_reading: 직설적 서술을 유지해 사건의 긴박감과 피난처 없는 공격성을 그대로 드러냈습니다.
  alternative_readings:
  - 보다 완곡하게 ‘공격을 받았습니다’로 약화
  rationale: 원문은 공격의 연속성과 거칠음을 강조하므로, 도덕화하거나 완화하지 않는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 서사 본문 번역 원칙
