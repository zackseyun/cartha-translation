  - severity: medium
    issue: 마지막 절에서 지속적 투석과 두 공격 행위의 대상이 충분히 드러나지 않습니다.
    rationale: ἐσφενδόνιζον은 반복·지속의 미완료 시제이며, ‘돌을 던지며 나를 공격하고 활을 쏘았습니다’는 화살을 누구에게 쏘았는지 अस्पष्ट하고 원문의 병렬을 약화합니다.
