  text: '*Καὶ ἐπροσεγγίσαμεν τῇ Θάμνῃ¹¹, *ἐν ᾗ¹² ἦν πᾶσα ἡ ἀποσκευὴ²² τῶν πολεμίων βασιλέων²³.'
