  text: And we drew near to Thamna, where all their baggage was.
translation:
  language: ko
  text: 그리고 우리는 탐나에 가까이 갔습니다. 거기에는 그들의 모든 짐이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐπροσεγγίσαμεν
  english_pob_choice: And we drew near
  chosen_korean: 그리고 우리는 …에 가까이 갔습니다
  alternatives_korean:
  - 그리고 우리는 …에 다가갔습니다
  - 그리고 우리는 …에 근접했습니다
  lexicon: προσεγγίζω
  rationale: 단순한 도착이 아니라 ‘가까이 감/다가감’의 접근 동작을 살려, 영어 POB의 drew near와 원문의 이동 뉘앙스를 함께 반영했습니다.
- source_word: τῇ Θάμνῃ
  english_pob_choice: to Thamna
  chosen_korean: 탐나에
  alternatives_korean:
  - 다므나에
  - 탐나
  lexicon: 지명 Θάμνῃ
  rationale: 고유명사는 현대 한국어 음역으로 처리했고, 전치사 목적격 흐름을 자연스럽게 한국어 조사로 옮겼습니다.
- source_word: πᾶσα ἡ ἀποσκευὴ
  english_pob_choice: all their baggage
  chosen_korean: 그들의 모든 짐
  alternatives_korean:
  - 그들의 모든 행장
  - 그들의 모든 장비
  lexicon: ἀποσκευή
  rationale: ἀποσκευή는 여행 짐, 휴대 물품을 가리키므로, 문맥에 맞게 ‘짐’으로 옮겨 평이하면서도 구체성을 유지했습니다.
- source_word: τῶν πολεμίων βασιλέων
  english_pob_choice: their baggage
  chosen_korean: 그들의
  alternatives_korean:
  - 원수들의
  - 적대하는 왕들의
  lexicon: πολέμιοι βασιλεῖς
  rationale: 이 구절은 소유를 가리키는 관계구로 기능하므로 본문에는 ‘그들의’만 드러내고, ‘원수/적대하는 왕들’은 굳이 반복하지 않아 한국어 문장을 간결하게 했습니다.
theological_decisions:
- issue: 서술 시점과 포함 대명사
  chosen_reading: ‘우리는’으로 1인칭 복수 서술을 그대로 유지했습니다.
  alternative_readings:
  - 주어를 생략한 비인칭 서술
  - ‘그들은’으로 외적 관찰자 시점 처리
  rationale: 원문의 ἐπροσεγγίσαμεν은 1인칭 복수 과거형이므로, 화자 집단의 동행 경험을 보존하는 것이 source-faithful합니다.
  doctrine_reference: 서사적 1인칭 복수 보존
