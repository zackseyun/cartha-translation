  source_fidelity: 원문의 1인칭 복수 과거 동작(ἐπροσεγγίσαμεν), 지명 Θάμνῃ, 그리고 그곳에 짐이 있었다는 서술은 대체로 반영되었습니다. 그러나 τῶν πολεμίων βασιλέων은 단순한 대명사 ‘그들의’가 아니라 ‘적대하는/원수인 왕들’을 명시하므로, 해당 주체가 본문에서 빠져서는 안 됩니다.
  naturalness: ‘탐나에 가까이 갔습니다’와 ‘거기에는’은 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 소유자를 명시한 ‘그 적대하는 왕들의 모든 짐’도 문맥상 무리 없이 읽힙니다.
  terminology: ἀποσκευή는 여기서 군대 또는 왕들이 지닌 휴대 물품·행장을 가리키며, 지나치게 군사적으로 한정하지 않은 ‘짐’이 적절합니다. πολεμίων βασιλέων은 ‘적대하는 왕들’로 옮겨 원문의 수식 관계와 의미를 보존했습니다. ‘탐나’ 음역은 현 초안의 지명 표기를 유지했습니다.
  issues:
