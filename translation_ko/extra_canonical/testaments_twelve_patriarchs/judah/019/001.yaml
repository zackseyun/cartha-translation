  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/019/001.yaml
  text: My children, the love of money leads to idolatry.
translation:
  language: ko
  text: 내 자녀들아, 돈을 사랑하는 것은 우상숭배로 이끕니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  english_pob_choice: My children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호칭을 살리되, 현대 한국어에서 자연스럽고 권위 있는 부름으로 옮겼습니다.
- source_word: φιλαργυρία
  english_pob_choice: the love of money
  chosen_korean: 돈을 사랑하는 것
  alternatives_korean:
  - 돈 사랑
  - 탐심
  - 재물을 사랑하는 것
  lexicon: φιλαργυρία
  rationale: 원어의 '은(사랑) + 돈(은전/재물)' 결합을 따라, 단순히 '탐심'으로 도덕화하지 않고 금전 애착의 의미를 드러냈습니다.
- source_word: εἰδωλολατρίαν
  english_pob_choice: idolatry
  chosen_korean: 우상숭배
  alternatives_korean:
  - 우상에게 절함
  - 우상 섬김
  lexicon: εἰδωλολατρία
  rationale: 한국어 성경에서 통용되는 표준 용어를 유지하되, 앞의 '돈 사랑'이 실제로 우상숭배로 귀결된다는 인과를 살렸습니다.
- source_word: ὁδηγεῖ
  english_pob_choice: leads to
  chosen_korean: 이끕니다
  alternatives_korean:
  - 인도합니다
  - 가게 합니다
  lexicon: ὁδηγέω
  rationale: 행위의 결과를 자연스럽게 나타내는 동사로 옮겼고, 문장의 도덕적 경고성을 유지했습니다.
theological_decisions:
- issue: 돈 사랑과 우상숭배의 관계
  chosen_reading: '''돈을 사랑하는 것''이 단순한 욕망이 아니라 우상숭배로 이어지는 영적 위험으로 진술합니다.'
  alternative_readings:
  - '''탐심''으로 일반화하여 번역'
  - '''재물에 대한 욕심''으로 완화'
  rationale: 원문은 금전에 대한 애착을 우상숭배와 직접 연결하므로, 경고의 강도를 약화하지 않도록 직선적으로 옮겼습니다.
  doctrine_reference: 우상숭배 경계, 탐심에 대한 성경적 경고
