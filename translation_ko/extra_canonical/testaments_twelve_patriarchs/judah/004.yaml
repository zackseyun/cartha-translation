  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004.yaml
  text: '1. And after this there came to us a greater war toward the south than the one at Shechem; and when I had drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.

    2. And I went up upon the wall and killed their king.

    3. And so we set Hebron free and took all the captives.

    4. But the rest fled.

    5. Then my father Jacob killed Belisath, king of all the kings, a man giant in strength, twelve cubits high.

    6. And terror fell upon them, and they stopped making war against us.

    7. Therefore my father was without anxiety in the wars while I was with my brothers.

    8. For he saw in a vision concerning me that an angel of power went along with me in all things, so that no one might touch me.'
translation:
  language: ko
  text: 그리고 그 뒤에 우리에게는 세겜 때보다 더 큰 남쪽 전쟁이 일어났습니다. 내가 형제들과 함께 전열을 갖추고 싸웠을 때, 우리는 천 명을 추격하여 그들 가운데 이백 명과 네 왕을 죽였습니다. 내가 성벽 위로 올라가 그들의 왕을 죽였고, 우리는 모든 포로를 사로잡았습니다. 남은 자들은 달아났습니다. 그 뒤에 내 아버지 야곱이 모든 왕의 왕 벨리사스를 죽였는데, 그는 힘이 뛰어난 거인으로 열두 규빗이나 되었습니다. 그들에게 두려움이 임하자 그들은 우리를 상대로 전쟁을 그만두었습니다. 그러므로 내 아버지는 내가 형제들과 함께 있는 동안 전쟁 중에 근심이 없었습니다. 그는 나에 관하여 환상 가운데, 권능의 천사가 모든 일에서 나와 함께 가서 아무도 나를 건드리지 못하게 하시는 것을 보았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλεμος ... κατὰ νότον
  english_pob_choice: a greater war toward the south
  chosen_korean: 남쪽 전쟁이 일어났습니다
  alternatives_korean:
  - 남쪽으로 향한 더 큰 전쟁이 있었습니다
  - 남쪽을 향한 더 큰 전쟁이 있었습니다
  lexicon: πόλεμος
  rationale: 전쟁의 방향성을 자연스럽게 살리되, 본문이 강조하는 것은 지리적 ‘남쪽’ 전선이므로 과도한 의역 없이 표현했습니다.
- source_word: παραταξάμενοι σὺν τοῖς ἀδελφοῖς μου
  english_pob_choice: when I had drawn up in battle with my brothers
  chosen_korean: 형제들과 함께 전열을 갖추고 싸웠을 때
  alternatives_korean:
  - 형제들과 함께 전투 대형을 갖추었을 때
  - 형제들과 함께 진을 치고 싸웠을 때
  lexicon: παρατάσσω
  rationale: 군사적 대형 편성을 드러내기 위해 ‘전열을 갖추다’를 택했고, ‘with my brothers’는 공동 전투를 자연스럽게 풀어 옮겼습니다.
- source_word: ἀπεκτείναμεν ... χιλίους ... διακοσίους ... τέσσαρας βασιλεῖς
  english_pob_choice: we pursued a thousand men and killed two hundred of them, and four kings
  chosen_korean: 천 명을 추격하여 그들 가운데 이백 명과 네 왕을 죽였습니다
  alternatives_korean:
  - 천 명을 뒤쫓아 그들 중 이백 명과 네 왕을 죽였습니다
  - 천 명을 추격했고 그들 가운데 이백 명과 네 왕을 죽였습니다
  lexicon: ἀπεκτείνω
  rationale: 수량 구조를 그대로 보존해 승리의 과장을 약화시키지 않으면서, ‘그들 가운데’로 사망 대상의 범위를 분명히 했습니다.
- source_word: ἀνεῖλον τὸν βασιλέα αὐτῶν / πᾶσαν τὴν αἰχμαλωσίαν
  english_pob_choice: I killed their king ... and took all the captives
  chosen_korean: 그들의 왕을 죽였고, 우리는 모든 포로를 사로잡았습니다
  alternatives_korean:
  - 그들의 왕을 죽였고, 우리는 모든 포로를 데려갔습니다
  - 그들의 왕을 죽였고, 우리는 모든 포로를 취했습니다
  lexicon: βασιλεύς / αἰχμαλωσία
  rationale: αἰχμαλωσία는 ‘포로 집단’과 ‘포로 상태’의 뜻이 있어, 전리품처럼 단순화하지 않고 포로를 직접 잡아온 행위를 살렸습니다.
- source_word: ἀπὸ ἀνατολῶν ... ἀπὸ δυσμῶν
  english_pob_choice: from the east ... from the west
  chosen_korean: 동쪽 ... 서쪽
  alternatives_korean:
  - 동편 ... 서편
  - 해 뜨는 쪽 ... 해 지는 쪽
  lexicon: ἀνατολή / δύσις
  rationale: 방향 표현은 표준어의 간명한 지시어가 가장 직접적이므로 ‘동쪽/서쪽’으로 옮겼습니다.
- source_word: ἄγγελος δυνάμεως
  english_pob_choice: an angel of power
  chosen_korean: 권능의 천사
  alternatives_korean:
  - 힘의 천사
  - 능력의 천사
  lexicon: ἄγγελος / δύναμις
  rationale: ‘δυνάμεως’는 단순한 물리적 힘보다 하늘의 권세를 가리키므로, 한국어에서는 ‘권능’이 더 정확합니다.
theological_decisions:
- issue: 본문의 군사적 폭력 서술을 한국어로 과도하게 완화할지 여부
  chosen_reading: 원문과 POB의 전투·살해 서술을 그대로 유지했습니다.
  alternative_readings:
  - ‘죽였다’를 ‘물리쳤다’로 완화
  - ‘포로를 사로잡았다’를 ‘사로잡았다/데려갔다’로 완화
  rationale: 이 단락은 족장 유언적 자기증언의 전투 보고이므로, 서술의 강도를 낮추면 본문의 역사·서사적 의도가 약해집니다.
  doctrine_reference: source fidelity; narrative plain sense
- issue: ‘권능의 천사’의 번역어 선택
  chosen_reading: ‘권능의 천사’로 번역했습니다.
  alternative_readings:
  - ‘힘의 천사’
  - ‘능력의 천사’
  rationale: 문맥상 보호와 동행을 담당하는 천상 존재의 권세를 가리키므로, 한국어에서 신학적·문학적 뉘앙스를 가장 잘 살리는 표현입니다.
  doctrine_reference: angelology; divine protection
