review_pass:
  verdict: revise
  source_fidelity: 현 초안은 제공된 그리스어 본문(3절)보다 영어 POB의 서로 다른 확장 전승(8절)을 따라 번역되어, 3절 이후의 내용과 ‘헤브론’, ‘벨리사스’, 야곱의 전투, 환상 등의 진술이 원문에 없습니다. 또한 원문 3절은 아레타로 진군하여 포로들을 해방한 일이나, 초안은 이를 ‘모든 포로를 사로잡았다’로 바꾸었습니다. 원문의 남쪽/세겜 구문은 통사적으로 다소 압축되어 있으므로, 지리적 관계를 단정하지 않는 표현으로 유지했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하며, 전투 서술은 불필요하게 완화하지 않았습니다. ‘포로들을 해방했습니다’는 αἰχμαλωσία가 가리키는 포로 집단을 문맥에 맞게 자연스럽게 옮긴 것입니다.
  terminology: βασιλεύς는 ‘왕’, τεῖχος는 ‘성벽’, αἰχμαλωσία는 문맥에 따라 ‘포로들’, ἄρετα(Ἀρετάν)는 음역하여 ‘아레타’로 처리했습니다. 영어 POB의 ‘권능의 천사’는 제공된 그리스어 본문에 없으므로 유지하지 않았습니다.
  issues:
  - severity: high
    issue: 초안이 제공된 그리스어 본문에 없는 4–8절의 확장 내용을 포함합니다.
    rationale: 원문은 1–3절에서 끝나며, 헤브론, 벨리사스, 야곱의 살해, 공포, 환상과 천사에 관한 문장은 제공된 α-본문에 없습니다.
  - severity: high
    issue: 초안의 사건 전개가 원문 3절과 반대됩니다.
    rationale: 원문은 다음 날 아레타를 공격하여 ‘포로들/포로 상태’를 해방했다고 말합니다(ἠλευθερώσαμεν τὴν αἰχμαλωσίαν). 초안은 앞선 절에서 포로들을 사로잡았다고 하고 이후 아레타 사건을 누락합니다.
  - severity: medium
    issue: ‘세겜 때보다 더 큰’은 제공된 그리스어에 근거가 없습니다.
    rationale: κατὰ νότον과 τοῦ ἐν Σικίμοις에는 ‘더 큰’에 해당하는 비교급이 없습니다. 두 지리·사건 표지의 정확한 관계가 압축되어 있으므로 번역에서 비교 표현을 도입하지 않아야 합니다.
  - severity: medium
    issue: 원문 2절의 ‘성벽 위로 올라가’가 초안에서는 후속 확장본에 묻혀 구조적으로 분리되지 않았습니다.
    rationale: 그리스어는 유다 자신이 성벽에 올라 적의 왕을 죽이고 모든 포로를 취한 사건을 독립적으로 서술합니다.
  revised_text: '1. 그리고 그 뒤에 세겜에서의 전쟁과 관련하여, 남쪽에서 우리에게 전쟁이 일어났습니다. 나는 내 형제들과 함께 전열을 갖추고 천 명을 추격했으며, 그들 가운데 이백 명과 네 왕을 죽였습니다.


    2. 나는 성벽 위로 올라가 그들의 왕을 죽였고, 우리는 모든 포로를 취했습니다.


    3. 이튿날 우리는 죽음으로 우리를 위협하던 강한 성읍 아레타로 갔습니다. 나와 갓은 성읍 동쪽에서 공격하고, 르우벤과 레위는 서쪽에서 공격했습니다. 이렇게 해서 우리는 포로들을 해방했습니다.'
  revised_footnotes: []
  revision_rationale: 제공된 그리스어 α-본문만을 기준으로 전체를 1–3절로 재번역했습니다. 영어 POB 감사 기록은 이 원문과 범위와 내용이 현저히 달라 참고하되 채택하지 않았습니다. κατὰ νότον과 τοῦ ἐν Σικίμοις의 압축된 관계는 ‘세겜에서의 전쟁과 관련하여, 남쪽에서’로 보수적으로 처리했으며, 비교급이나 특정 지리적 관계를 보충하지 않았습니다. 2절의 포로 취득과 3절의 포로 해방은 원문이 각각 다르게 서술하므로 그대로 보존했습니다.
