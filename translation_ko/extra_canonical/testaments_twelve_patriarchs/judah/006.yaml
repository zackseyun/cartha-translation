revisions:
- from: 1. 내가 코제바의 물가에 있을 때, 욥엘 쪽 사람들이 우리에게 전쟁하러 왔습니다. 2. 우리가 맞붙어 싸우자 그들을 패주시켰고, 실롬 쪽 사람들과 그들의 동맹자들을 죽였으며, 그들에게는 우리에게 들어올 탈출구를 주지 않았습니다. 3. 그런데 마힐 쪽 사람들이 다섯째 날에 다시 우리를 공격했습니다. 우리는 강한 칼로 그들을 압도하며 그들이 오르막을 오르기 전에 그들을 죽였습니다. 4. 우리가 그 성에 다가가자, 그 성이 서 있는 산꼭대기에서 그들의 여자들이 우리 위로 돌들을 굴려 떨어뜨렸습니다. 5. 그래서 우리는 시므온과 다른 이들을 뒤에 숨긴 뒤 높은 곳을 장악했고, 그 성도 완전히 멸했습니다.[a][b][c]
  to: 1. 내가 코제바의 물가에 있을 때,[a] 욥엘 쪽 사람들이 우리에게 싸우러 왔습니다. 2. 우리가 맞붙어 싸워 그들을 패주시켰고, 그들의 동맹자인 실롬 쪽 사람들을 죽였으며, 그들이 우리에게 이르도록 들어올 길을 주지 않았습니다. 3. 그러나 마길 쪽 사람들이 다섯째 날에 다시 우리를 공격했습니다. 우리는 강력한 칼로 그들에게 돌진하여[b] 그들을 이기고, 그들이 오르막길을 오르기 전에 죽였습니다. 4. 우리가 그 성에 이르자, 그 성이 서 있는 산꼭대기에서 그들의 여자들이 우리를 향해 돌들을 굴려 내렸습니다.[c] 5. 시므온과 정체를 알 수 없는 이들을 뒤에 숨겨 두고, 우리는 높은 곳을 장악하여 이 성도 완전히 멸했습니다.[d]
  rationale: 원문 우선 원칙에 따라 2절의 수식 관계와 ‘우리에게 들어올 길’이라는 방향성을 회복했습니다. 3절은 손상 가능성이 있는 동사의 전술적 문맥을 번역하되 주석으로 불규칙성을 공개했습니다. 5절은 불확정 인물을 ‘다른 이들’로 단정하지 않고 손상 상태를 보존하는 표현과 주석으로 조정했습니다. 각주 표지도 해당 구절에 배치하고 완전한 각주 세트를 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:11Z'
review_pass:
  verdict: revise
  source_fidelity: 2절의 ‘실롬 쪽 사람들과 그들의 동맹자들’은 그리스어가 실롬 쪽 사람들을 ‘그들의 동맹자들’로 수식하는 구조를 둘로 나누어, 죽인 대상을 늘립니다. 또한 διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς는 문맥상 ‘우리에게 이르기 위해 들어올 길’을 주지 않았다는 뜻이지 ‘탈출구’를 주지 않았다는 뜻이 아닙니다. 3절의 비정상적인 현재형 προσδίδωσι는 본문 비평 주석으로 밝혀야 하며, 번역은 문맥상 전투 행위를 제한적으로 반영할 수 있습니다. 5절은 그리스어 자체가 손상되어 영어 감사본의 ‘Simeon and the others’라는 해석을 확정적으로 제시하지 않는 편이 안전합니다.
  naturalness: 합쇼체의 서사 문체는 대체로 자연스럽습니다. 다만 ‘우리에게 들어올 탈출구’는 한국어로도 의미 관계가 충돌하므로 ‘우리에게 이르도록 들어올 길’로 바로잡아야 합니다. ‘강한 칼’보다 ‘강력한 칼’이 현대 한국어에서 더 자연스럽습니다.
  terminology: 지명은 불확실한 그리스어 형태를 음역한 코제바·욥엘·실롬을 유지합니다. Μαχίρ는 통용 성서 음역에 맞추어 ‘마길’로 옮깁니다. ‘성’과 ‘높은 곳’은 πόλις와 ὑψηλόν의 군사적·지형적 의미를 무리 없이 보존합니다.
  issues:
  - severity: high
    issue: 2절이 실롬 사람들과 그들의 동맹자들을 별개의 두 집단으로 번역합니다.
    rationale: τοὺς ἀπὸ Σιλὼμ συμμάχους αὐτῶν은 ‘그들의 동맹자인 실롬 쪽 사람들’로 읽히며, 원문은 추가 집단을 말하지 않습니다.
  - severity: high
    issue: 2절의 ‘우리에게 들어올 탈출구’가 διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς를 잘못 해석합니다.
    rationale: 부정사 τοῦ εἰσελθεῖν은 ‘우리에게 들어오다/이르다’를 한정합니다. 탈출의 의미를 넣으면 원문의 진행 방향과 충돌합니다.
  - severity: medium
    issue: 각주 표지가 5절 끝에 일괄 배치되어 있고 각주 본문이 없습니다.
    rationale: a·b·c는 각각 관련 지명, 3절의 문법 이상, 4절의 중복 관사에 직접 붙고, 각주 내용도 제공되어야 독자가 근거를 확인할 수 있습니다.
  - severity: medium
    issue: 5절의 손상된 그리스어를 근거 없이 ‘시므온과 다른 이들’로 확정합니다.
    rationale: ὑποκρύψας τὸν τε καὶ Συμεών은 문법·전승상 손상된 구절입니다. 시므온만은 표면상 남아 있으나, 함께 숨긴 이들의 신원은 확정할 수 없음을 주석으로 밝혀야 합니다.
