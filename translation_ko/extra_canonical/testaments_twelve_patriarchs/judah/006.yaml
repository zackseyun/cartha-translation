language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: VI. Καὶ ὡς ἤμην ἐν τοῖς ὕδασι Χωζηβά¹, οἱ ἀπὸ †Ἰωβὴλ² ἦλθον ἐφ᾽³ ἡμᾶς εἰς πόλεμον. 2. Καὶ *συνάψαντες ἐτρέψαμεν⁴ αὐτοὺς⁵ καὶ τοὺς ἀπὸ Σιλὼμ⁶ συμμάχους αὐτῶν⁷ ἀπεκτείναμεν⁸ καὶ οὐκ ἐδώκαμεν αὐτοῖς⁹ διέξοδον¹⁰ τοῦ εἰσελθεῖν πρὸς ἡμᾶς. 3. *Οἱ δὲ πάλιν¹¹ ἀπὸ¹² Μαχίρ¹³ ἐπῆλθον¹⁴ ἡμῶν τῇ πέμπτῃ ἡμέρᾳ, καὶ¹⁵ προσδίδωσι πρὸς αὐτοὺς¹⁶ *ἐν κραταιᾷ μαχαίρᾳ¹⁷ περιγινόμεθα αὐτῶν¹⁸ καὶ ἀπεκτείναμεν¹⁹ *πρὸ τοῦ ἀναβῆναι τὴν ἀνάβασιν²⁰. 4. *Ὡς δὲ ἤκομεν²¹ τῇ²² τῇ πόλει²³, αἱ γυναῖκες αὐτῶν ἐκύλιον *λίθους ἐφ᾽ ἡμᾶς²⁴ ἀπὸ τῆς κορυφῆς τοῦ ὄρους ἐν ᾧ²⁵ *ἦν ἡ πόλις²⁶. 5. Καὶ ὑποκρύψας²⁷ τὸν τε καὶ Συμεὼν²⁸ ἐξωπίσθεν²⁹ ἐπελαβόμεθα³⁰ τοῦ ὑψηλοῦ, καὶ *ἐξωλοθρεύσαμεν καὶ ταύτην τὴν πόλιν³⁰.
  language: Greek
  source_pages:
  - 144
  - 145
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006.yaml
  text: 1. And when I was at the waters of Chozeba[a], those from Jobel came against us for battle. 2. And joining battle, we put them to flight; and we killed those from Shilom, their allies, and gave them no way of escape. 3. But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[b], we prevailed over them and killed them before they could scale the ascent. 4. And as we came to the city, their women were rolling stones down on us from the summit of the mountain on which the city stood[c]. 5. And having hidden Simeon and the others behind them, we seized the height, and utterly destroyed this city also.
  footnotes:
  - marker: a
    text: The place names 'Chozeba,' 'Jobel,' and 'Shilom' are transliterations of the Greek forms in this witness; their identification is uncertain.
    reason: cultural_note
  - marker: b
    text: The verb προσδίδωσι (v.3, 3rd sg. present) is syntactically anomalous in a first-person plural aorist narrative and may be a scribal compression. The translation renders the apparent tactical sense of the action without emending the text.
    reason: textual_variant
  - marker: c
    text: The source has τῇ τῇ πόλει in v.4 — a dittography of the dative article, clearly a scribal slip; the translation reads a single τῇ πόλει.
    reason: textual_variant
translation:
  language: ko
  text: 1. 내가 코제바의 물가에 있을 때,[a] 욥엘 쪽 사람들이 우리에게 싸우러 왔습니다. 2. 우리가 맞붙어 싸워 그들을 패주시켰고, 그들의 동맹자인 실롬 쪽 사람들을 죽였으며, 그들이 우리에게 이르도록 들어올 길을 주지 않았습니다. 3. 그러나 마길 쪽 사람들이 다섯째 날에 다시 우리를 공격했습니다. 우리는 강력한 칼로 그들에게 돌진하여[b] 그들을 이기고, 그들이 오르막길을 오르기 전에 죽였습니다. 4. 우리가 그 성에 이르자, 그 성이 서 있는 산꼭대기에서 그들의 여자들이 우리를 향해 돌들을 굴려 내렸습니다.[c] 5. 시므온과 정체를 알 수 없는 이들을 뒤에 숨겨 두고, 우리는 높은 곳을 장악하여 이 성도 완전히 멸했습니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 코제바, 욥엘, 실롬은 이 그리스어 전승에 나타나는 음역 지명입니다. 이 지명들의 정확한 위치와 동일시는 확실하지 않습니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 본문은 여기서 3인칭 단수 현재형 προσδίδωσι를 사용하여, 1인칭 복수 과거 서사와 문법적으로 맞지 않습니다. 번역은 본문을 임의로 고치지 않고 문맥상 보이는 전투 행위, 곧 적에게 돌진하는 뜻을 반영합니다.
    reason: textual_variant
  - marker: c
    text: 그리스어에는 τῇ τῇ πόλει(‘그 그 성에’)처럼 여격 관사가 중복되어 있습니다. 명백한 필사 중복으로 보아 한 관사만 읽었습니다.
    reason: textual_variant
  - marker: d
    text: 그리스어의 ‘숨겨 두고’ 구절(ὑποκρύψας τὸν τε καὶ Συμεών)은 문법적으로 손상되어 있습니다. 시므온 외에 누구를 숨겼는지는 확정할 수 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Χωζηβά
  english_pob_choice: Chozeba
  chosen_korean: 코제바
  alternatives_korean:
  - 초제바
  - 호제바
  lexicon: 고유명사 음역
  rationale: 그리스어 표기를 따라 음역하되, 한국어 외래어 표기에서 가능한 자연스러운 형태로 옮겼습니다. 식별이 불확실한 지명이라는 주석도 유지합니다.
- source_word: ἐφ᾽ ἡμᾶς εἰς πόλεμον
  english_pob_choice: came against us for battle
  chosen_korean: 우리에게 전쟁하러 왔습니다
  alternatives_korean:
  - 우리에게 싸우러 왔습니다
  - 우리에게 전투하러 왔습니다
  lexicon: LSJ
  rationale: 적대적 접근과 전쟁 목적을 함께 살리기 위해 ‘전쟁하러’로 옮겼습니다. ‘전투’보다 본문이 가진 공개적 적대의 뉘앙스가 더 직접적입니다.
- source_word: συνάψαντες
  english_pob_choice: joining battle
  chosen_korean: 맞붙어 싸우자
  alternatives_korean:
  - 전투를 벌이자
  - 전투에 들어서자
  lexicon: LSJ
  rationale: 군사적 접전의 동작을 자연스러운 현대 한국어로 압축해 나타냈습니다. 서술 흐름상 ‘맞붙어’가 접전을 잘 드러냅니다.
- source_word: διέξοδον
  english_pob_choice: way of escape
  chosen_korean: 탈출구
  alternatives_korean:
  - 빠져나갈 길
  - 도피로
  lexicon: LSJ
  rationale: 출구/탈출 가능성을 가리키는 구체성을 살리면서, 전투 문맥에 맞는 현대적 표현을 택했습니다.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  english_pob_choice: with a mighty sword
  chosen_korean: 강한 칼로
  alternatives_korean:
  - 막강한 칼로
  - 힘센 칼로
  lexicon: LSJ
  rationale: μαχαίρᾳ를 ‘칼’로 옮겨 무기 이미지를 직관적으로 전달하고, κραταιᾷ는 힘의 성격을 ‘강한’으로 살렸습니다.
theological_decisions:
- issue: 무명의 지명·집단명들을 본문 표면대로 유지할지 여부
  chosen_reading: 코제바, 욥엘, 실롬, 마힐을 모두 음역으로 유지했습니다.
  alternative_readings:
  - 지명 뜻을 추정해 번역하기
  - 익숙한 성서 지명으로 동화하기
  rationale: 본문은 해당 명칭들의 식별을 확정하지 않으며, 영어 POB도 불확실성을 주석으로 남깁니다. 그러므로 의미 추정보다 원문 표면을 보존하는 것이 더 투명합니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy and auditable transparency'
- issue: 3절의 προσδίδωσι처럼 문법적으로 비정상적인 형태를 어떻게 처리할지
  chosen_reading: 본문의 전술적 의미를 살려 ‘우리는 강한 칼로 그들을 압도하며’로 옮기고, 문법적 이상은 본문 비평 주석에 맡겼습니다.
  alternative_readings:
  - 비정상 동사를 직역해 어색함을 노출하기
  - 다른 본문으로 임의 교정하기
  rationale: 영어 POB가 지적하듯 이 형태는 서사 흐름 속에서 압축 또는 탈락 가능성이 있으므로, 한국어 본문은 문맥상 명백한 전투 동작을 읽어 주되 임의의 교정은 피했습니다.
  doctrine_reference: 'PHILOSOPHY.md: source-attested reading over conjectural emendation'
