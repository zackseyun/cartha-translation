source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐπιγνοὺς δὲ ἐγὼ¹⁸ ὃ ἐποίησε κατηρασάμην αὐτὴν¹⁹ ἐν ὀδύνῃ ψυχῆς μου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/004.yaml
  text: And when I learned what she had done, I cursed her in the anguish of my soul.
translation:
  language: ko
  text: 내가 그가 한 일을 알게 되었을 때, 영혼의 고통 속에서 그녀를 저주하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιγνοὺς
  english_pob_choice: when I learned
  chosen_korean: 내가 ... 알게 되었을 때
  alternatives_korean:
  - 내가 ... 깨달았을 때
  - 내가 ... 알았을 때
  lexicon: ἐπιγινώσκω
  rationale: 단순한 인지가 아니라 사실을 알아차리는 흐름이므로 ‘알게 되었을 때’가 자연스럽고 원문 의미를 잘 살립니다.
- source_word: ὃ ἐποίησε
  english_pob_choice: what she had done
  chosen_korean: 그가 한 일
  alternatives_korean:
  - 그녀가 한 일
  - 그가 저지른 일
  lexicon: ποιέω
  rationale: 영문 POB의 성별 표기는 본문 문맥과 대조되지만, 원문은 중성 관계대명사로 행위 자체를 가리키므로 ‘한 일’로 옮겼습니다.
- source_word: κατηρασάμην αὐτὴν
  english_pob_choice: I cursed her
  chosen_korean: 그녀를 저주하였습니다
  alternatives_korean:
  - 그녀에게 저주를 퍼부었습니다
  - 그녀를 저주했습니다
  lexicon: καταράομαι
  rationale: 원문의 강한 저주 행위를 직접적으로 반영해 ‘저주하다’를 사용했습니다.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  english_pob_choice: in the anguish of my soul
  chosen_korean: 영혼의 고통 속에서
  alternatives_korean:
  - 혼의 고통 속에서
  - 내 영혼의 고통 가운데
  lexicon: ὀδύνη / ψυχή
  rationale: ‘ψυχή’를 문맥상 내면 전체를 가리키는 ‘영혼’으로, ‘ὀδύνη’를 ‘고통’으로 옮겨 감정의 강도를 살렸습니다.
theological_decisions:
- issue: 저주의 표현을 완화할지 여부
  chosen_reading: 원문의 자기 진술을 그대로 살려 ‘저주하였습니다’로 번역했습니다.
  alternative_readings:
  - ‘심한 책망을 하였습니다’처럼 완화하는 번역
  - ‘저주를 내렸습니다’로 더 설명적인 번역
  rationale: 이 구절은 화자의 격한 정서를 직접 드러내므로, 의미를 순화하지 않고 서술적 강도를 보존하는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 서사적 직접 진술의 보존 원칙
