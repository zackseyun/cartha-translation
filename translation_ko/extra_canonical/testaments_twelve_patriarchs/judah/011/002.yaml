id: T12P.JUD.11.2
reference: Testament of Judah 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἰδὼν⁸ αὐτὴν οἰνοχοοῦσαν⁹ ἠπατήθην, καὶ *†ἔλαβον αὐτὴν μὴ βουλευσαμένου τοῦ πατρός μου¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/002.yaml
  text: And when I saw her pouring wine, I was deceived, and I took her, my father not having taken counsel.
translation:
  language: ko
  text: 그리고 내가 그녀가 포도주를 따르는 것을 보고 속아서, 아버지가 의논하지 않은 채 그녀를 취했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰνοχοοῦσαν
  english_pob_choice: pouring wine
  chosen_korean: 포도주를 따르는 것을
  alternatives_korean:
  - 술을 따르는 것을
  - 포도주를 붓는 것을
  lexicon: οἰνοχοέω
  rationale: 그릇에 따르는 동작을 자연스럽게 살리면서, 성서 문맥에 맞는 ‘포도주’를 유지했습니다.
- source_word: ἠπατήθην
  english_pob_choice: I was deceived
  chosen_korean: 속았고
  alternatives_korean:
  - 기만당했고
  - 속임을 당했고
  lexicon: ἀπατάω
  rationale: 수동의 의미를 분명히 하되, 현대 한국어에서 가장 자연스럽고 직설적인 표현으로 옮겼습니다.
- source_word: ἔλαβον αὐτὴν
  english_pob_choice: I took her
  chosen_korean: 그녀를 맞아들였습니다
  alternatives_korean:
  - 그녀를 데려왔습니다
  - 그녀를 취했습니다
  lexicon: λαμβάνω
  rationale: 문맥상 단순한 ‘취하다’보다 혼인/동거의 결과를 드러내는 표현이 더 적절하여, 직역의 의미를 살린 채 한국어에서 이해되기 쉬운 표현을 택했습니다.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  english_pob_choice: my father not having taken counsel
  chosen_korean: 아버지가 의논하지 않은 채
  alternatives_korean:
  - 아버지가 상의하지 않은 채
  - 아버지가 결의하지 않은 채
  lexicon: βουλεύομαι
  rationale: 부정 분사 구조를 한국어의 ‘-지 않은 채’로 옮겨, 선행 조건이 없었다는 점을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 서사적 자책과 책임의 진술 방식
  chosen_reading: 이 절은 도덕적 해석을 덧붙이지 않고, 화자의 자기진술을 그대로 살려 ‘속았고’와 ‘아버지가 의논하지 않은 채’의 병렬 구조를 유지했습니다.
  alternative_readings:
  - ‘유혹을 받아’처럼 원인 해석을 강화하는 읽기
  - ‘내가 취했다’보다 완곡한 혼인 표현으로만 처리하는 읽기
  rationale: 원문은 사건의 순서를 간명하게 진술할 뿐이므로, 해석을 과도하게 덧씌우지 않는 것이 source-grounded 방식에 더 부합합니다.
  doctrine_reference: 텍스트 비평/번역 원칙
