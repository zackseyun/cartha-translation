  source_fidelity: Καίγε의 강조가 초안 본문에서 빠졌고, πονηρία는 ‘악행’보다 인물의 악한 상태·사악함을 나타내는 말입니다. 또한 υἱῶν은 문법적으로 ‘아들들’이므로, 문맥 근거 없이 ‘자녀들’로 넓히지 않는 것이 원문에 충실합니다.
  naturalness: ‘참으로 그녀는 자기의 사악함 가운데서 자기 아들들과 함께 죽었습니다’는 현대 표준 한국어의 격식 있는 서사체로 자연스럽습니다. ‘자기의’ 반복은 원문의 두 소유 대명사를 보존하기 위해 유지했습니다.
  terminology: πονγρία는 ‘사악함’으로, υἱοί는 ‘아들들’로 옮겼습니다. 이는 영어 POB의 children보다 그리스어 원문을 우선한 선택입니다.
