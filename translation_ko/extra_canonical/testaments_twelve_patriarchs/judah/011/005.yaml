source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καίγε ἀπέθανεν ἐν τῇ²¹ πονηρίᾳ ²¹αὐτῆς ²μετὰ τῶν υἱῶν αὐτῆς²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/005.yaml
  text: And indeed she died in her wickedness, with her children.
translation:
  language: ko
  text: 참으로 그녀는 자기의 사악함 가운데서 자기 아들들과 함께 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  english_pob_choice: And indeed
  chosen_korean: 그리고 참으로
  alternatives_korean:
  - 또한
  - 실로
  lexicon: καίγε
  rationale: 강조를 더하는 접속·부사구로 보고, 단순한 ‘그리고’보다 강조가 살아 있는 ‘참으로’를 택했습니다.
- source_word: ἀπέθανεν
  english_pob_choice: she died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨졌습니다
  - 사망했습니다
  lexicon: ἀποθνῄσκω
  rationale: 서술의 직설성을 유지하면서 현대 한국어의 자연스러운 서사체로 옮겼습니다.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  english_pob_choice: in her wickedness
  chosen_korean: 자기의 악행 가운데서
  alternatives_korean:
  - 자기의 악 가운데서
  - 자기의 사악함 가운데서
  lexicon: πονηρία
  rationale: πονηρία를 단순 추상명사인 ‘악’보다 구체적인 행위 성격이 드러나는 ‘악행’으로 옮겨, 문맥상 도덕적 상태와 행위의 결합을 살렸습니다.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  english_pob_choice: with her children
  chosen_korean: 자기 자녀들과 함께
  alternatives_korean:
  - 그녀의 아들들과 함께
  - 자기 아들들과 함께
  lexicon: υἱοί
  rationale: 직역하면 ‘아들들’이지만, 여기서는 POB 영어처럼 후손/자녀 전체를 가리킬 수 있는 문맥으로 보고 ‘자녀들’로 자연화했습니다.
theological_decisions:
- issue: ‘악행 가운데서’의 도덕적 상태 표현
  chosen_reading: 죽음이 단순한 사실 보고가 아니라, 그 인물의 악한 삶의 상태와 함께 제시된 것으로 읽었습니다.
  alternative_readings:
  - 그저 장소나 상황을 나타내는 중립적 표현으로 읽는 방법
  rationale: ἐν τῇ πονηρίᾳ는 단순 배경보다 도덕적 상태를 드러내는 표현으로 이해하는 것이 본문과 영어 POB의 의미를 더 정확히 반영합니다.
  doctrine_reference: 본문 문맥 주해
- issue: υἱοί를 ‘자녀들’로 번역
  chosen_reading: 문맥상 혈연 후손 전체를 가리킬 수 있어 성중립적 상위어를 사용했습니다.
  alternative_readings:
  - ‘아들들’로 직역하는 방법
  rationale: 영어 POB의 ‘children’과 평행을 이루면서, 한국어에서 불필요하게 성별을 좁히지 않도록 했습니다.
  doctrine_reference: 본문 문맥 주해
