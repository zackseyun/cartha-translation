  text: But while I was away, she went and took for Shelah a wife from Canaan.
translation:
  language: ko
  text: 그런데 내가 없을 때에 그녀는 가서 가나안 출신의 여자를 셀라의 아내로 데려왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόντος ἐμοῦ
  english_pob_choice: while I was away
  chosen_korean: 내가 없을 때에
  alternatives_korean:
  - 내가 자리를 비운 동안
  - 내가 부재한 사이에
  lexicon: ἀπών
  rationale: 부재를 나타내는 분사구를 자연스럽게 풀어, 사건의 시간적 배경을 간결하게 드러냈습니다.
- source_word: ἐπορεύθη
  english_pob_choice: she went
  chosen_korean: 그녀는 가서
  alternatives_korean:
  - 그녀는 갔습니다
  - 그녀는 나가서
  lexicon: πορεύομαι
  rationale: 이동 자체보다 이어지는 행위(‘데려왔다’)와의 연속성을 살려 ‘가서’로 옮겼습니다.
- source_word: ἔλαβε ... γυναῖκα
  english_pob_choice: took ... a wife
  chosen_korean: 아내를 데려왔습니다
  alternatives_korean:
  - 아내를 맞이했습니다
  - 아내를 취했습니다
  lexicon: λαμβάνω
  rationale: 한국어에서 ‘아내를 취하다’는 지나치게 직역적이어서, 결혼을 위한 실제 조치임을 드러내는 ‘데려오다’로 자연화했습니다.
- source_word: ἐκ τῆς Χαναάν
  english_pob_choice: from Canaan
  chosen_korean: 가나안에서
  alternatives_korean:
  - 가나안 땅에서
  - 가나안 출신으로
  lexicon: ἐκ + τόπος
  rationale: 출처를 나타내는 전치사구를 지리적 기원으로 직접 옮겨, 본문의 출신지 정보를 유지했습니다.
theological_decisions:
- issue: 혼인 서술의 서술적 톤
  chosen_reading: 윤리적 평가는 보태지 않고, 단순한 사건 서술로 처리했습니다.
  alternative_readings:
  - 가나안 여인을 취했다는 함의를 강조하는 해석
  - 비판적 뉘앙스를 덧붙이는 번역
  rationale: 원문과 영어 POB 모두 사실 진술에 머무르므로, 본문이 명시하지 않은 평가를 덧씌우지 않았습니다.
