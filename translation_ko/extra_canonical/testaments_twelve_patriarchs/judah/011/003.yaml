  to: 그런데 내가 없을 때에 그녀는 가서 가나안 출신의 여자를 셀라의 아내로 데려왔습니다.
  rationale: 원문의 시간적 배경과 ‘가서 … 취했다’의 사건 순서를 유지하면서, 가나안이 여자의 출신·기원임을 드러내고 셀라를 위한 혼인이라는 관계를 명확히 했습니다. 원문에 없는 윤리적·교리적 평가나 추가 설명은 넣지 않았습니다.
