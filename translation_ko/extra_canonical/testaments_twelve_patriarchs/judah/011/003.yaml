review_pass:
  verdict: revise
  source_fidelity: 그리스어는 유다가 없는 동안 ‘그녀’가 가서 셀라를 위하여 가나안에서 한 여자를 아내로 취한 일을 서술합니다. 초안의 큰 뜻은 맞지만, ‘가나안에서 아내를 데려왔다’는 장소에서 데려왔다는 뜻으로도 읽히며, ἐκ의 출신·기원 표지가 약해집니다.
  naturalness: ‘그녀는 가서’와 ‘데려왔습니다’의 연결은 자연스럽습니다. 다만 ‘셀라를 위해 아내를 데려왔다’보다 ‘셀라의 아내로’라고 하면 대상과 혼인 목적의 관계가 현대 한국어에서 더 분명합니다.
  terminology: Σηλώμ은 영어 POB의 Shelah에 맞추어 ‘셀라’로 표기할 수 있습니다. γυναῖκα는 여기서 일반 여성이 아니라 혼인 관계의 여성을 가리키므로 ‘여자’를 쓰되 ‘아내로’를 붙여 의미를 분명히 했습니다. 본문에는 평가적 혼인 용어를 덧붙이지 않았습니다.
  issues:
  - severity: low
    issue: ἐκ τῆς Χαναάν의 기원 의미가 약함
    rationale: ‘가나안에서’는 단순한 행위 장소로도 해석될 수 있습니다. ‘가나안 출신의 여자’는 원문의 출처·기원 정보를 자연스럽게 보존합니다.
  - severity: low
    issue: 셀라와 아내의 관계가 다소 우회적으로 표현됨
    rationale: ‘셀라를 위해 아내를’보다 ‘셀라의 아내로’가 τῷ Σηλώμ γυναῖκα의 혼인 목적을 더 명료하고 자연스럽게 나타냅니다.
  revised_text: 그런데 내가 없을 때에 그녀는 가서 가나안 출신의 여자를 셀라의 아내로 데려왔습니다.
