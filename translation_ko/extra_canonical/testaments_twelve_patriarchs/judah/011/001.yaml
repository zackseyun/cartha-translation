id: T12P.JUD.11.1
reference: Testament of Judah 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἀγὼ ᾔδειν ὅτι πονηρὸν² γένος ἦν³ τῶν Χαναναίων⁴, ἀλλὰ τὸ διαβούλιον⁵ τῆς νεότητος ἐτύφλωσε τὴν διάνοιάν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/001.yaml
  text: And I knew that the race of the Canaanites was evil, but the impulse of youth blinded my understanding.
translation:
  language: ko
  text: 나는 가나안 사람들의 종족이 악하다는 것을 알고 있었습니다. 그러나 젊음의 충동이 내 분별력을 눈멀게 했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένος τῶν Χαναναίων
  english_pob_choice: the race of the Canaanites
  chosen_korean: 가나안 사람들의 종족
  alternatives_korean:
  - 가나안 족속
  - 가나안인의 혈통
  - 가나안 사람들의 족속
  lexicon: γένος
  rationale: English POB의 race를 그대로 세습적 집단을 가리키는 한국어로 옮기되, 현대 한국어에서 자연스러운 ‘종족’으로 처리했습니다.
- source_word: πονηρὸν
  english_pob_choice: evil
  chosen_korean: 악하다는
  alternatives_korean:
  - 사악하다는
  - 나쁘다는
  - 악한
  lexicon: πονηρός
  rationale: 도덕적 평가를 분명히 드러내면서도 과도하게 해석적이지 않게 ‘악하다’를 택했습니다.
- source_word: τὸ διαβούλιον τῆς νεότητος
  english_pob_choice: the impulse of youth
  chosen_korean: 젊음의 충동
  alternatives_korean:
  - 젊은 시절의 충동
  - 청춘의 충동
  - 젊은 날의 계획
  lexicon: διαβούλιον / νεότης
  rationale: διαβούλιον을 단순한 ‘생각’보다 내적 충동·심사숙고 없는 움직임에 가깝게 보아, POB의 impulse를 반영해 ‘충동’으로 옮겼습니다.
- source_word: διάνοιαν
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해력
  - 마음
  - 생각
  lexicon: διάνοια
  rationale: διάνοια의 인지·판단 기능을 한국어에서 가장 자연스럽게 드러내는 ‘분별력’을 사용했습니다.
theological_decisions:
- issue: 청자의 도덕 판단과 자기고백의 톤
  chosen_reading: 화자는 가나안 사람들에 대한 도덕적 인식을 인정하면서도, 자신의 젊은 충동이 판단 능력을 흐렸다고 자백합니다.
  alternative_readings:
  - 단순한 정보 진술로 읽는 것
  - 가나안 사람들을 본질적으로 악마화하는 독해
  rationale: 문장 구조상 대조는 외부 집단의 평가와 화자 자신의 책임 있는 회고를 함께 담고 있으므로, 자기비판적 회고로 살렸습니다.
  doctrine_reference: 서술 맥락 및 회개의 자기성찰
