  source_fidelity: 초안은 πονηρόν, γένος, διάνοια의 기본 뜻과 대조 구문을 대체로 충실히 반영합니다. 다만 Κἀγώ의 첨가적 의미(‘나도’)가 빠졌고, διαβούλιον은 ‘충동’보다는 숙고·의도·계획을 가리키므로 이를 본문과 주석에서 더 직접적으로 반영하는 편이 안전합니다.
