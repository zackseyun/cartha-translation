source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Εἰ δὲ θέλετε σωφρόνως ζῆσαι, μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε¹⁵, ἵνα μὴ ἁμαρτήσητε¹⁶ ἐν λόγοις ὕβρεως¹⁷ καὶ μάχαις²⁰ καὶ συκοφαντίαις²¹ καὶ παραβάσεσι²² ἐντολῶν²³ Θεοῦ²⁴, καὶ ἀπολεῖσθε²⁵ οὐκ²⁶ ἐν καιρῷ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/003.yaml
  text: But if you want to live with self-control, do not touch wine at all, lest you drink and sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.
translation:
  language: ko
  text: 만일 여러분이 절제하며 살기를 원하신다면, 포도주를 전혀 가까이하지 마십시오. 그러면 여러분이 마시고, 오만한 말과 싸움과 중상과 하나님의 계명에 대한 범죄로 죄를 짓지 않게 되며, 제때가 아니라 너무 이르기 전에 죽게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφρόνως ζῆσαι
  english_pob_choice: live with self-control
  chosen_korean: 절제하며 살다
  alternatives_korean:
  - 신중하게 살다
  - 건전하게 살다
  lexicon: σωφρόνως
  rationale: 도덕적·행동적 절제를 직접 드러내는 표현으로 옮겨, 단순한 ‘신중함’보다 본문의 윤리적 뉘앙스를 살렸습니다.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπθεσθε
  english_pob_choice: do not touch wine at all
  chosen_korean: 포도주를 전혀 가까이하지 마십시오
  alternatives_korean:
  - 포도주를 아예 입에 대지 마십시오
  - 포도주를 전혀 마시지 마십시오
  lexicon: οἶνος / ἐφάπτομαι
  rationale: 직역적 금지보다 ‘가까이하지 마십시오’가 접촉 자체의 금지와 음주 행위를 함께 포괄해, 본문의 강한 경고를 자연스럽게 전달합니다.
- source_word: λόγοις ὕβρεως καὶ μάχαις καὶ συκοφαντίαις
  english_pob_choice: words of insolence and in fights and in slanders
  chosen_korean: 오만한 말과 싸움과 중상
  alternatives_korean:
  - 무례한 말과 다툼과 험담
  - 교만한 말과 분쟁과 비방
  lexicon: ὕβρις / μάχη / συκοφαντία
  rationale: ὕβρις는 단순한 무례보다 ‘오만함’이 강하므로 오만한 말로, συκοφαντία는 근거 없는 악소문·고발의 뉘앙스를 살려 중상으로 옮겼습니다.
- source_word: παραβάσεσι ἐντολῶν Θεοῦ
  english_pob_choice: transgressions of the commandments of God
  chosen_korean: 하나님의 계명에 대한 범죄
  alternatives_korean:
  - 하나님의 계명을 어김
  - 하나님의 계명에 대한 위반
  lexicon: παράβασις / ἐντολή / Θεός
  rationale: παράβασις의 ‘경계선 침범’ 성격을 고려해 단순한 ‘어김’보다 범죄로 옮기되, 대상이 ‘하나님의 계명’임을 분명히 했습니다.
theological_decisions:
- issue: 결과절의 종말 경고 표현
  chosen_reading: 제때가 아니라 너무 이르기 전에 죽게 될 것입니다
  alternative_readings:
  - 여러분의 때가 이르기 전에 죽게 될 것입니다
  - 여러분의 때가 아니게 죽게 될 것입니다
  rationale: οὐκ ἐν καιρῷ ὑμῶν은 단순한 ‘조기 사망’보다 ‘여러분의 때 이전’이라는 종말론적 경고를 담으므로, 한국어에서는 시간의 어긋남을 드러내는 방식으로 옮겼습니다.
  doctrine_reference: 인간 수명과 하나님의 정하신 때에 대한 경고 표현
