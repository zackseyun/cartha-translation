revisions:
- from: 만일 여러분이 절제하며 살기를 원하신다면, 포도주를 전혀 가까이하지 마십시오. 그러면 여러분이 마시고, 오만한 말과 싸움과 중상과 하나님의 계명에 대한 범죄로 죄를 짓지 않게 되며, 제때가 아니라 너무 이르기 전에 죽게 될 것입니다.[a][b][c]
  to: 만일 여러분이 절제하며 살기를 원하신다면, 포도주에는 전혀 손대지 마십시오. 그리하지 않으면 오만한 말과 싸움과 중상과 하나님의 계명을 어기는 일로 죄를 짓고, 여러분의 때가 되기 전에 멸망할 것입니다.
  rationale: 원전 그리스어를 기준으로 원전에 없는 '마시고'를 삭제하고, 금지와 그 위반에 따르는 결과라는 문장 논리를 회복했습니다. 계명 위반 표현의 한국어 중복을 해소했으며, 마지막 경고는 특정 교리적 해석을 덧붙이지 않고 시간상 이른 멸망이라는 원문의 의미를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:06Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문에는 '마시고'에 해당하는 동사(πίνητε)가 없으므로 이를 번역문에 넣을 수 없습니다. 제공된 영어 감사 이력의 πίνητε 언급은 현 원전 텍스트와 일치하지 않습니다. 또한 ἵνα μὴ ... καὶ ἀπολεῖσθε는 금지의 목적/경고를 나타내며, 초안의 '그러면 ... 죄를 짓지 않게 되며'는 조건 관계를 반대로 만듭니다. 마지막 οὐκ ἐν καιρῷ ὑμῶν은 '여러분의 때가 되기 전에'로 자연스럽고 충실하게 옮길 수 있습니다.
  naturalness: 초안의 '하나님의 계명에 대한 범죄로 죄를 짓다'는 동어 반복에 가깝고 한국어로 부자연스럽습니다. '하나님의 계명을 어기는 일로 죄를 짓다'로 고치면 의미와 문체가 모두 자연스럽습니다. '포도주에는 전혀 손대지 마십시오'는 ἐφάπτεσθε의 접촉 금지와 강한 강조를 잘 반영합니다.
  terminology: σωφρόνως는 '절제하며', ὕβρις는 '오만한 말', μάχαι는 '싸움', συκοφαντίαι는 '중상'으로 유지할 수 있습니다. παράβασις ἐντολῶν Θεοῦ는 '하나님의 계명을 어기는 일'로 옮겨 계명 위반이라는 뜻을 명료하게 살립니다. ἀπολεῖσθε는 원문의 넓은 의미를 보존하여 '멸망할 것입니다'로 번역합니다.
  issues:
  - severity: high
    issue: 원전에 없는 '마시고'가 첨가되었습니다.
    rationale: 제시된 그리스어는 ἵνα μὴ ἁμαρτήσητε('죄를 짓지 않도록/않으면')이며 πίνητε를 포함하지 않습니다. 영어 감사 이력보다 원전이 우선합니다.
  - severity: high
    issue: 경고 절의 논리적 방향이 반대로 번역되었습니다.
    rationale: '''그러면 ... 죄를 짓지 않게 되며''는 금주가 자동으로 무죄를 보장하는 서술처럼 들립니다. 원문은 ''그리하지 않으면 ... 죄를 짓고 멸망할 것''이라는 금지의 경고입니다.'
  - severity: medium
    issue: '''하나님의 계명에 대한 범죄로 죄를 짓다''가 부자연스럽고 중복적입니다.'
    rationale: παραβάσεις ἐντολῶν Θεοῦ의 의미는 하나님의 계명을 범함이므로, 이를 별도의 '죄를 짓다'와 연결할 때는 '계명을 어기는 일로'가 자연스럽습니다.
  revised_text: 만일 여러분이 절제하며 살기를 원하신다면, 포도주에는 전혀 손대지 마십시오. 그리하지 않으면 오만한 말과 싸움과 중상과 하나님의 계명을 어기는 일로 죄를 짓고, 여러분의 때가 되기 전에 멸망할 것입니다.
  revised_footnotes: []
