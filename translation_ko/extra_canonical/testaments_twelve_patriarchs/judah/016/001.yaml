- from: '그러므로, 내 자녀들아, 포도주의 한계에서 너희 자신을 지키십시오. 그 안에는 네 가지 악한 영이 있기 때문입니다: 욕망, 타오르는 열정, 방탕, 그리고 부끄러운 이득입니다.[a]'
  to: 그러므로 내 자녀들아, 포도주의 경계를 조심하십시오. 그 안에는 욕망, 불타는 정욕, 방탕, 수치스러운 이득이라는 네 가지 악한 영들이 있기 때문입니다.[a]
  rationale: 문법적으로 어색한 ‘한계에서 … 지키십시오’를 자연스러운 경계·주의 명령으로 고쳤습니다. 또한 원문의 복수 ‘악한 영들’과 네 항목의 동격 관계를 명시했습니다. ‘포도주의 경계’의 정확한 함의는 본문에서 해석적으로 확정하지 않고 각주로만 설명했습니다.
