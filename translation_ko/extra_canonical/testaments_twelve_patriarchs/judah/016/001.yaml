id: T12P.JUD.16.1
reference: Testament of Judah 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε² οὖν, τέκνα μου, *τὸν ὅρον τοῦ οἴνου³, *ἔστι γὰρ ἐν αὐτῷ τέσσαρα⁵ πνεύματα πονηρά⁷, ἐπιθυμίας, πυρώσεως, ἀσωτίας, αἰσχροκερδίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/001.yaml
  text: 'Guard yourselves, therefore, my children, from the boundary of wine; for in it there are four evil spirits: desire, burning passion, debauchery, and shameful gain.'
translation:
  language: ko
  text: '그러므로, 내 자녀들아, 포도주의 한계에서 너희 자신을 지키십시오. 그 안에는 네 가지 악한 영이 있기 때문입니다: 욕망, 타오르는 열정, 방탕, 그리고 부끄러운 이득입니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  english_pob_choice: Guard yourselves
  chosen_korean: 너희 자신을 지키십시오
  alternatives_korean:
  - 너희를 지키십시오
  - 조심하십시오
  - 스스로를 지키십시오
  lexicon: φυλάσσω
  rationale: 명령형의 자기보호 뉘앙스를 살리되, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: τὸν ὅρον τοῦ οἴνου
  english_pob_choice: the boundary of wine
  chosen_korean: 포도주의 한계
  alternatives_korean:
  - 포도주의 경계
  - 술의 경계
  - 포도주의 경계선
  lexicon: ὅρος
  rationale: POB의 ‘boundary’ 판단을 반영하면서, 문맥상 ‘포도주에 대한 경계/한계’를 뜻하는 경계적 표현으로 옮겼습니다.
- source_word: πνεύματα πονηρά
  english_pob_choice: evil spirits
  chosen_korean: 악한 영
  alternatives_korean:
  - 악령
  - 사악한 영들
  - 나쁜 영
  lexicon: πνεῦμα + πονηρός
  rationale: 복수의 영적 실체를 가리키므로 ‘악한 영들’도 가능하지만, 한국어에서는 열거문의 자연성을 위해 집합적 표현인 ‘악한 영’으로 옮겼습니다.
- source_word: αἰσχροκερδίας
  english_pob_choice: shameful gain
  chosen_korean: 부끄러운 이득
  alternatives_korean:
  - 수치스러운 이익
  - 더러운 이득
  - 부끄러운 이익
  lexicon: αἰσχροκέρδεια
  rationale: αἰσχρο-의 수치/부끄러움과 κέρδος의 이득을 함께 살려, POB의 ‘gain’을 따라 ‘이득’으로 번역했습니다.
theological_decisions:
- issue: 사본/문헌 전통이 아니라 도덕적 경고 목록으로서의 ‘네 가지 악한 영’
  chosen_reading: 본절은 포도주 자체를 악으로 동일시하기보다, 포도주가 사람 안에서 촉발할 수 있는 네 가지 악한 영의 작용을 경고하는 문장으로 읽었습니다.
  alternative_readings:
  - 포도주 자체의 경계선을 넘지 말라는 금주적 권고로 읽기
  - ‘악한 영’을 비유적 정념 목록으로 완화해 읽기
  rationale: 원문과 POB 둘 다 포도주 안에 ‘네 가지 악한 영’이 있다고 직설적으로 말하므로, 이를 비유로 약화하지 않고 그대로 유지했습니다.
  doctrine_reference: 문헌 내 윤리 권면과 영적 실재에 대한 직설적 진술
- issue: ‘부끄러운 이득’의 윤리적 강조
  chosen_reading: 마지막 항목은 단순한 탐욕보다 부끄러운 방식의 이득 추구를 가리키는 것으로 보아, 도덕적 수치성을 드러내는 표현을 선택했습니다.
  alternative_readings:
  - 부끄러운 탐욕
  - 수치스러운 탐색득
  rationale: αἰσχροκέρδεια는 이익 그 자체보다 수치스러운 획득 행위를 가리키므로, 한국어에서도 행위의 비윤리성을 드러내는 표현이 적절합니다.
  doctrine_reference: 탐욕과 부정한 이득에 대한 윤리적 경고
