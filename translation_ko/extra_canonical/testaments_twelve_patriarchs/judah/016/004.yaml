id: T12P.JUD.16.4
reference: Testament of Judah 16:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε²⁷ μυστήρια Θεοῦ καὶ ἀνθρώπων²⁸ ἀποκαλύπτει³¹ ὁ οἶνος, ὡς³⁰ κἀγὼ τὰς ἐντολὰς τοῦ Θεοῦ καὶ μυστήρια Ἰακὼβ τοῦ πατρὸς ἀπεκάλυψα τῇ Χαναναίτιδι³³, ἃ³⁴ μοι εἶπεν ὁ Θεὸς³⁵ μὴ ἀποκαλῦψαι³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/004.yaml
  text: Wine also reveals the mysteries of God and of men, just as I too revealed to the Canaanite woman the commandments of God and the mysteries of Jacob my father—things that God told me not to reveal.
translation:
  language: ko
  text: 포도주도 하나님과 사람들의 비밀들을 드러냅니다. 이와 같이 저도 가나안 여인에게 하나님의 계명들과 내 아버지 야곱의 비밀들을 드러냈습니다. 이것들은 하나님께서 제게 드러내지 말라고 하신 것들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήρια Θεοῦ καὶ ἀνθρώπων
  english_pob_choice: the mysteries of God and of men
  chosen_korean: 하나님과 사람의 비밀들
  alternatives_korean:
  - 하나님의 비밀들과 사람들의 비밀들
  - 하나님과 인간의 비밀들
  lexicon: μυστήριον → 비밀
  rationale: POB의 ‘mysteries’에 맞춰 ‘비밀들’로 옮기되, 속격 관계를 자연스럽게 살려 ‘하나님과 사람의 비밀들’로 표현했습니다.
- source_word: ἀποκαλύπτει / ἀπεκάλυψα
  english_pob_choice: reveals / revealed
  chosen_korean: 드러냅니다 / 드러냈습니다
  alternatives_korean:
  - 계시합니다 / 계시했습니다
  - 밝힙니다 / 밝혔습니다
  lexicon: ἀποκαλύπτω → 드러내다
  rationale: 본문의 동사 반복을 살리면서, ‘reveals’의 공개·노출 의미를 현대 한국어에서 직접적으로 전달하는 ‘드러내다’를 택했습니다.
- source_word: τῇ Χαναναίτιδι
  english_pob_choice: to the Canaanite woman
  chosen_korean: 가나안 여자에게
  alternatives_korean:
  - 가나안 여인에게
  - 가나안 여자에게
  lexicon: Χαναναῖτις → 가나안 여자/여인
  rationale: 영어 POB가 ‘Canaanite woman’으로 유지한 직역성을 따라, 고유 종족 표지를 살린 ‘가나안 여자’로 옮겼습니다.
- source_word: μὴ ἀποκαλῦψαι
  english_pob_choice: not to reveal
  chosen_korean: 드러내지 말라고
  alternatives_korean:
  - 계시하지 말라고
  - 밝히지 말라고
  lexicon: ἀποκαλύπτω + μή + 부정사 → 드러내지 말다
  rationale: 하나님이 금하신 내용을 분명히 전달하기 위해, 한국어의 자연스러운 간접명령인 ‘드러내지 말라고’로 처리했습니다.
theological_decisions:
- issue: 하나님이 숨기라고 하신 내용의 표현
  chosen_reading: ‘하나님께서 제게 드러내지 말라고 하신 것들입니다’로 옮겨, 금지의 뉘앙스를 약화하지 않았습니다.
  alternative_readings:
  - ‘드러내지 않으라고 하신 것들입니다’
  - ‘계시하지 말라고 하신 것들입니다’
  rationale: 본문은 단순한 미공개가 아니라 신적 금지를 말하므로, 간접명령형으로 그 긴장을 분명히 드러냈습니다.
  doctrine_reference: 계시/비밀의 비대칭성과 신적 주권
- issue: ‘야곱 내 아버지’의 보존
  chosen_reading: ‘야곱 곧 내 아버지’로 옮겨 친족 관계를 설명적으로 유지했습니다.
  alternative_readings:
  - ‘내 아버지 야곱’
  - ‘야곱, 나의 아버지’
  rationale: 그리스어의 동격 구조를 한국어에서 자연스럽게 풀어, 야곱이 자기 아버지라는 점을 명시적으로 보존했습니다.
  doctrine_reference: 서사적 동격 보존
