lexical_decisions:
- source_word: ὁ οἶνος
  english_pob_choice: wine
  chosen_korean: 술
  alternatives_korean:
  - 포도주
  - 와인
  lexicon: οἶνος
  rationale: English POB의 'wine'을 한국어에서 널리 이해되는 일반어로 옮기되, 문맥상 음주가 낳는 해악을 자연스럽게 드러내기 위해 '술'을 택했습니다.
- source_word: αἴτιος γίνεται
  english_pob_choice: becomes the cause
  chosen_korean: 원인이 됩니다
  alternatives_korean:
  - 원인이 됩니다
  - 원인이 되어집니다
  - 원인이 됩니다
  lexicon: αἴτιος γίνομαι
  rationale: 직역보다 한국어에서 자연스러운 원인-결과 관계를 살려 '원인이 됩니다'로 옮겼습니다.
- source_word: πολέμου καὶ ταραχῆς
  english_pob_choice: war and turmoil
  chosen_korean: 전쟁과 소란
  alternatives_korean:
  - 전쟁과 소란
  - 전쟁과 혼란
  - 전쟁과 분쟁
  lexicon: πόλεμος / ταραχή
  rationale: πολέμος는 '전쟁', ταραχή는 단순한 혼란보다 사회적 소동의 뉘앙스가 있어 '소란'이 무난합니다.
theological_decisions:
- issue: 술의 도덕적 결과를 어떤 강도로 표현할지
  chosen_reading: 술은 전쟁과 소란을 낳는 원인으로 제시됩니다.
  alternative_readings:
  - 술은 전쟁과 혼란의 원인이 됩니다.
  - 포도주는 전쟁과 소란의 원인이 됩니다.
  rationale: 본문은 술 자체를 악으로 단정하기보다 그 결과를 경고하는 진술이므로, 인과 관계를 평이하게 유지했습니다.
