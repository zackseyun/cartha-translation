  - severity: low
    issue: ταραχή를 ‘소란’으로 번역함
    rationale: ‘소란’도 가능한 번역이나, ταραχή는 단순한 시끄러움보다 사회적·정신적 동요와 혼란을 뜻할 수 있습니다. 여기서는 ‘혼란’이 더 넓고 자연스럽게 대응합니다.
  revised_text: 그리고 포도주는 전쟁과 혼란의 원인이 됩니다.
