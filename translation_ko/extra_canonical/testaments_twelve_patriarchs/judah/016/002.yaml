  to: 만일 여러분이 기쁨 가운데 포도주를 마신다면, 하나님을 경외하는 마음으로 부끄러움을 아는 태도를 지니십시오.
  rationale: The revision replaces the interpretive ‘절제하십시오’ with wording that reflects αἰδούμενος as modesty and a sense of propriety. It also revises the φόβος Θεοῦ phrase into natural standard Korean. No footnote text has been supplied for the source’s superscript anchors 10 and 11, so no footnotes are invented.
  reviewer_model: gpt-5.6-terra
