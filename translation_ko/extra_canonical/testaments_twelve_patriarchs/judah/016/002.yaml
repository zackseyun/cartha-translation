base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/002.yaml
  text: If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness slips in.
translation:
  language: ko
  text: 만일 여러분이 기쁨 가운데 포도주를 마신다면, 하나님을 경외하는 마음으로 부끄러움을 아는 태도를 지니십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν πίνητε οἶνον
  english_pob_choice: If you drink wine
  chosen_korean: 포도주를 마신다면
  alternatives_korean:
  - 술을 마신다면
  - 포도주를 마시면
  lexicon: οἶνον → 포도주
  rationale: οἶνος는 일반적인 ‘포도주’가 가장 직접적인 대응이며, 문맥상 금지보다 절제 권면이므로 ‘마신다면’으로 조건문을 살렸습니다.
- source_word: ἐν εὐφροσύνῃ
  english_pob_choice: in gladness
  chosen_korean: 기쁨 속에서
  alternatives_korean:
  - 즐거움 가운데
  - 환희 가운데
  lexicon: εὐφροσύνη
  rationale: εὐφροσύνη는 단순 감정보다 ‘기쁨/즐거움의 상태’를 가리키므로, 문장 흐름에 맞는 ‘기쁨 속에서’로 옮겼습니다.
- source_word: αἰδούμενος
  english_pob_choice: be modest
  chosen_korean: 절제하십시오
  alternatives_korean:
  - 수줍어하십시오
  - 예의 바르게 하십시오
  - 겸손하십시오
  lexicon: αἰδέομαι
  rationale: 여기서는 ‘부끄러움을 아는 태도’가 술자리에서의 품위와 절제를 가리키므로, 한국어로는 행위 규범이 드러나는 ‘절제하십시오’가 가장 자연스럽고 경고의 힘도 유지합니다.
- source_word: μετὰ φόβου Θεοῦ
  english_pob_choice: with the fear of God
  chosen_korean: 하나님의 두려움 가운데서
  alternatives_korean:
  - 하나님을 두려워하는 마음으로
  - 하나님 경외함으로
  lexicon: φόβος + Θεός
  rationale: ‘하나님을 경외함’이 뜻은 가장 가깝지만, 본문이 요구하는 긴장감과 현존감을 살리기 위해 ‘하나님의 두려움’이라는 보다 직역적인 표현을 택했습니다.
theological_decisions:
- issue: φόβος Θεοῦ의 신학적 뉘앙스
  chosen_reading: 하나님을 단지 존중하는 수준이 아니라, 말과 행동을 절제하게 하는 경외와 두려움으로 읽었습니다.
  alternative_readings:
  - 하나님 경외
  - 하나님을 두려워함
  rationale: 문맥이 포도주를 마시는 상황에서 윤리적 자제력을 권면하므로, 경외가 실제 절제로 나타나는 의미를 드러내는 것이 적절합니다.
  doctrine_reference: 지혜문학과 경건 권면에서의 하나님 경외
