base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024.yaml
  text: '1. He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.

    2. And you will be for him sons in truth, and you will walk in his commands, first and last.

    3. [This is the shoot of the Most High God, a spring for the life of all flesh.]

    4. Then the scepter of my kingdom will shine forth, and from your root a stem will arise.

    5. And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.'
translation:
  language: ko
  text: '1. 그 후에 너희에게 별이 야곱에게서 평강 가운데 떠오를 것이며, 내 후손에게서 한 사람이 일어날 것입니다. 그는 의의 해와 같이 사람들과 온유와 의 가운데 함께 다니며, 그 안에서는 아무 죄도 발견되지 않을 것입니다.


    2. 하늘들이 그 위에 열려 거룩하신 아버지의 축복의 영을 부을 것이며, 그 자신도 너희에게 은혜의 영을 부을 것입니다.


    3. 너희는 진리 안에서 그에게 아들들이 될 것이며, 그의 처음 명령들과 마지막 명령들을 따라 살아갈 것입니다.


    4. [이분은 지극히 높으신 하나님의 싹이며, 모든 이에게 생명을 주는 샘입니다.]


    5. 그때 내 왕국의 왕홀이 빛날 것이며, 너희의 뿌리에서 한 줄기가 생겨날 것입니다.


    6. 그리고 거기에서 열방을 위한 의의 막대기가 돋아나, 주를 부르는 모든 이를 심판하고 구원할 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνατελεῖ ὑμῖν ἄστρον ... ἐν εἰρήνῃ
  english_pob_choice: He will pour out ... [text continues]
  chosen_korean: “별이 떠오를 것입니다 … 평강 가운데”
  alternatives_korean:
  - “별이 나타날 것입니다 … 평화 가운데”
  - “별이 솟아오를 것입니다 … 평안 가운데”
  lexicon: ἀνατέλλω; εἰρήνη
  rationale: ἀνατελεῖ는 단순한 ‘출현’보다 하늘의 별이 ‘떠오르다’가 자연스럽고, εἰρήνη는 본문의 도덕적·메시아적 평화 뉘앙스를 살려 평강으로 옮겼습니다.
- source_word: ἥλιος δικαιοσύνης
  english_pob_choice: sun of righteousness
  chosen_korean: “의의 해”
  alternatives_korean:
  - “공의의 태양”
  - “의로우신 해”
  lexicon: ἥλιος; δικαιοσύνη
  rationale: 직역에 가깝게 유지하되, δικαιοσύνη의 표준 대응을 의로 보존해 문맥상의 메시아적 칭호를 드러냈습니다.
- source_word: πνεῦμα εὐλογίαν πατρὸς ἁγίου / πνεῦμα χάριτος
  english_pob_choice: the spirit of the holy Father’s blessing / a spirit of grace
  chosen_korean: “복된 아버지의 거룩한 영 / 은혜의 영”
  alternatives_korean:
  - “거룩한 아버지의 복의 영 / 은혜의 영”
  - “성스러운 아버지의 축복의 영 / 은혜의 영”
  lexicon: πνεῦμα; εὐλογία; πατήρ; ἅγιος; χάρις
  rationale: εὐλογία를 ‘복’의 의미로 간결하게 살리고, α문맥의 ‘holy Father’는 하나님의 성품을 설명하는 구조로 이해해 ‘거룩한 아버지’로 옮겼습니다.
- source_word: προστάγμασιν
  english_pob_choice: commands
  chosen_korean: “명령”
  alternatives_korean:
  - “계명”
  - “규례”
  lexicon: πρόσταγμα
  rationale: 영어 POB의 ‘commands’를 따라, 율법적 어휘보다 직접적인 ‘명령’이 본문의 순종 요구를 더 분명히 전달합니다.
- source_word: σκῆπτρον βασιλείας μου / ῥάβδος δικαιοσύνης
  english_pob_choice: the scepter of my kingdom / a rod of righteousness
  chosen_korean: “내 나라의 왕홀 / 의의 막대기”
  alternatives_korean:
  - “내 왕국의 홀 / 의의 지팡이”
  - “내 왕권의 홀 / 정의의 막대기”
  lexicon: σκῆπτρον; ῥάβδος; βασιλεία; δικαιοσύνη
  rationale: σκῆπτρον은 왕권 표지인 ‘왕홀’이 가장 자연스럽고, ῥάβδος는 본문이 상징하는 통치의 도구성을 유지하면서도 직역 가능한 ‘막대기’로 옮겼습니다.
theological_decisions:
- issue: 본문의 메시아적 동일시와 왕권 이미지
  chosen_reading: 별, 의의 해, 지극히 높으신 하나님이 내신 싹, 의의 막대기를 모두 하나의 장차 오실 메시아 왕에 대한 연속된 예언으로 읽었습니다.
  alternative_readings:
  - 각 이미지를 분리된 상징들의 집합으로 읽는 해석
  - 후대 기독론적 독해를 약화시키는 일반적 왕 찬가로 읽는 해석
  rationale: 그리스어 문장이 동일 주어 흐름으로 별→인자→영의 부음→싹→왕홀→의의 막대기를 연결하므로, 예언적 통일성을 보존하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 메시아 예언과 왕권의 연속성
- issue: ‘명령’과 ‘처음과 마지막’ 표현
  chosen_reading: ‘처음부터 마지막까지 그의 명령대로 걸을 것입니다’로 옮겨, 순종의 전면성을 드러냈습니다.
  alternative_readings:
  - ‘처음과 마지막’만 두어 문법적 압축을 따르는 읽기
  - ‘계명들’로 일반화하는 읽기
  rationale: πρώτοις καὶ ἐσχάτοις는 순종 범위의 총체성을 가리키므로, 한국어에서는 자연스러운 관용을 위해 ‘처음부터 마지막까지’로 풀어 주는 것이 의미를 분명히 합니다.
  doctrine_reference: 전적 순종과 언약적 충성
