  to: '1. 그 후에 너희에게 별이 야곱에게서 평강 가운데 떠오를 것이며, 내 후손에게서 한 사람이 일어날 것입니다. 그는 의의 해와 같이 사람들과 온유와 의 가운데 함께 다니며, 그 안에서는 아무 죄도 발견되지 않을 것입니다.


