  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/002.yaml
  text: I know that I ran with a hind and caught it, and I made it food for my father, and he ate.
translation:
  language: ko
  text: 나는 내가 한 암사슴과 함께 달려가 그것을 붙잡아 아버지께 음식으로 만들어 드렸고, 아버지께서 드셨다는 것을 알고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάφῳ
  english_pob_choice: a hind
  chosen_korean: 암사슴
  alternatives_korean:
  - 암노루
  - 사슴
  lexicon: ἐλάφος
  rationale: 영어 POB의 hind는 암컷 사슴을 가리키므로, 성별이 드러나는 표준어 ‘암사슴’으로 옮겼습니다.
- source_word: συνέδραμον
  english_pob_choice: I ran with
  chosen_korean: 함께 달려가
  alternatives_korean:
  - 달려가
  - 달렸습니다
  lexicon: συντρέχω
  rationale: 동반/동시의 뉘앙스를 살려 ‘함께’와 ‘달려가’를 결합해, 단순한 이동보다 ‘함께 달려 감’을 드러냈습니다.
- source_word: ἐποίησα αὐτὴν βρῶμα τῷ πατρί μου
  english_pob_choice: I made it food for my father
  chosen_korean: 그것을 내 아버지의 음식으로 만들어 드렸으며
  alternatives_korean:
  - 그것을 내 아버지의 음식이 되게 하였으며
  - 내 아버지를 위한 음식으로 만들었으며
  lexicon: ποιέω + βρῶμα
  rationale: βρῶμα를 단순히 ‘음식’으로 살리고, 동사구는 ‘~으로 만들어 드리다’로 옮겨 결과와 수여 관계를 자연스럽게 표현했습니다.
- source_word: ἔφαγεν
  english_pob_choice: he ate
  chosen_korean: 아버지께서 드셨습니다
  alternatives_korean:
  - 그가 먹었습니다
  - 아버지께서 잡수셨습니다
  lexicon: ἐσθίω
  rationale: 앞의 ‘내 아버지’가 바로 주어임을 분명히 하되, 한국어에서의 존대 관용을 반영해 ‘드셨습니다’를 택했습니다.
theological_decisions:
- issue: 이 구절의 직접 화자 진술이 현재 시점의 기억/증언 형식으로 제시됩니다.
  chosen_reading: 서술적 1인칭 확언으로 유지하고, 과장하거나 상징화하지 않았습니다.
  alternative_readings:
  - 비유적 진술로 완화하는 번역
  - 과거 회상 문체를 더 강하게 드러내는 번역
  rationale: 원문은 사실 진술의 연쇄로 이루어져 있으므로, 의미를 넓히거나 상징으로 재해석하지 않고 평이하게 옮기는 것이 가장 충실합니다.
  doctrine_reference: source-plain-sense
