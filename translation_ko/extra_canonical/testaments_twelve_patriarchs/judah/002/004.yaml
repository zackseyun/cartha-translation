  source_fidelity: 첫 문장은 Τὸν λέοντα ... ἀπέκτεινα와 ἔριφον ἐκ τοῦ στόματος αὐτοῦ를 정확히 반영합니다. 둘째 문장의 ἀπὸ τοῦ ποδὸς는 곰을 발로 붙잡은 것을, κρημνόν 및 συνετρίβη는 절벽 아래로 내던져 산산이 부서진 결과를 가리킵니다. 따라서 한국어에서 동작의 대상과 방향을 명시하는 편이 안전합니다. 영어 POB 감사 문구의 ‘wild mare’는 현 그리스어 본문과 일치하지 않으며 따를 수 없습니다.
  naturalness: 초안은 대체로 자연스럽지만, “암곰의 발을 붙잡아 그 곰을 절벽에서 떨어뜨렸고”는 ‘절벽에서’가 출발점처럼 들리고 ‘그 곰’의 반복이 다소 무겁습니다. “절벽 아래로 내던졌더니”가 한국어 관용과 사건의 인과를 더 자연스럽게 드러냅니다.
  terminology: ‘사자’, ‘새끼 염소’, ‘암곰’, ‘절벽’, ‘산산이 부서졌습니다’는 적절합니다. ἄρκον의 여성형을 ‘암곰’으로 살리는 것은 가능한 선택이며, 교리적 해석을 더하지 않습니다.
  issues:
