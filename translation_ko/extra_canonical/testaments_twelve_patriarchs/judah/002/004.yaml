  language: ko
  text: 나는 사자를 죽이고 그 입에서 새끼 염소를 빼앗았습니다. 나는 암곰의 발을 붙잡아 그 곰을 절벽에서 떨어뜨렸고, 그 곰은 산산이 부서졌습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν λέοντα ... ἀπέκτεινα ... ἀφειλόμην ἔριφον ἐκ τοῦ στόματος αὐτοῦ
  english_pob_choice: I caught a wild mare and, after seizing it, I subdued it.
  chosen_korean: 나는 사자를 죽이고 그 입에서 새끼 염소를 빼앗았습니다.
  alternatives_korean:
  - 나는 들암말을 잡고, 붙들어 굴복시켰습니다.
  - 나는 사자를 잡아 그 입에서 새끼 염소를 빼냈습니다.
  lexicon: lexical_note
  rationale: 그리스어 원문은 '사자'와 '새끼 염소'를 말하며, POB 영어역의 'wild mare'는 이 대목과 맞지 않아 원문 기준으로 바로잡았습니다.
- source_word: Τὴν ἄρκον
  english_pob_choice: I caught a wild mare
  chosen_korean: 암곰
  alternatives_korean:
  - 들암말
  - 암곰
  lexicon: lexical_note
  rationale: 두 번째 행은 원문에서 '암곰'을 가리키므로, 첫 행과 분리해 동물 표지를 그대로 살렸습니다.
- source_word: ἀπὸ τοῦ ποδὸς ἀπέλυσα τὸν κρημνόν, καὶ συνετρίβη
  english_pob_choice: and, after seizing it, I subdued it
  chosen_korean: 그 곰을 절벽에서 떨어뜨렸고, 그 곰은 산산이 부서졌습니다.
  alternatives_korean:
  - 그 곰의 발을 붙잡아 절벽에서 끌어내렸고, 산산이 부서졌습니다.
  - 그 곰의 발을 붙잡아 절벽에서 떨어뜨렸고, 그 곰은 부서졌습니다.
  lexicon: lexical_note
  rationale: ἀπέλυσα와 κρημνός, συνετρίβη의 연쇄는 '절벽에서 떨어뜨리다/무너지다'의 의미가 자연스럽고 원문에 충실합니다.
