lexical_decisions:
- source_word: Τὸν λέοντα ... ἀπέκτεινα ... ἀφειλόμην ἔριφον ἐκ τοῦ στόματος αὐτοῦ
  english_pob_choice: I caught a wild mare and, after seizing it, I subdued it.
  chosen_korean: 나는 사자를 죽이고 그 입에서 새끼 염소를 빼앗았습니다.
  alternatives_korean:
  - 나는 들암말을 잡고, 붙들어 굴복시켰습니다.
  - 나는 사자를 잡아 그 입에서 새끼 염소를 빼냈습니다.
