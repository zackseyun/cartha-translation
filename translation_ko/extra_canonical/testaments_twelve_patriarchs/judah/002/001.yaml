  - severity: low
    issue: ἀγρῷ를 ‘들’로 번역
    rationale: ‘들’도 가능한 번역이나, 농경 활동의 장소와 οἴκος의 대비를 나타내는 문맥에서는 ‘밭’이 더 구체적이고 자연스럽습니다.
