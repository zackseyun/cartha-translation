  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔδωκέ μοι Κύριος¹ χάριν *ἐν πᾶσι τοῖς ἔργοις μου, ἐν τε² ἀγρῷ καὶ ἐν τῷ οἴκῳ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/001.yaml
  text: And the Lord gave me favor in all my works, in the field and in the house.
translation:
  language: ko
  text: 그리고 주님께서는 제 모든 일에서, 밭에서나 집에서나 제게 호의를 베푸셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: κύριος
  rationale: 본문의 주어는 하나님의 주권적 행위를 가리키므로, POB의 영어 ‘the Lord’를 따라 한국어에서는 예수 호칭과도 겹칠 수 있는 ‘주님’으로 자연스럽게 옮겼습니다.
- source_word: χάριν
  english_pob_choice: favor
  chosen_korean: 호의
  alternatives_korean:
  - 은혜
  - 총애
  - 호감
  lexicon: χάρις
  rationale: 여기서는 구원론적 ‘은혜’보다 사람에게 주어지는 호의·호감을 뜻하는 일반적 용법이므로, 문맥에 맞게 ‘호의’로 번역했습니다.
- source_word: ἐν πᾶσι τοῖς ἔργοις μου
  english_pob_choice: in all my works
  chosen_korean: 제 모든 일에서
  alternatives_korean:
  - 제 모든 행위에서
  - 제가 하는 모든 일에서
  lexicon: ἔργον
  rationale: ‘works’는 업적의 총칭이라기보다 삶의 활동 전반을 가리키므로, 한국어에서는 자연스럽고 범위가 드러나는 ‘제 모든 일’로 옮겼습니다.
- source_word: ἐν τε ἀγρῷ καὶ ἐν τῷ οἴκῳ
  english_pob_choice: in the field and in the house
  chosen_korean: 들에서도 집에서도
  alternatives_korean:
  - 밭에서도 집에서도
  - 들판에서도 집 안에서도
  lexicon: ἀγρός, οἶκος
  rationale: ‘ἀγρός’와 ‘οἶκος’는 야외 노동과 가정 영역을 병렬로 대비하므로, 한국어에서도 대비가 살아나도록 ‘들’과 ‘집’을 병렬로 살렸습니다.
theological_decisions:
- issue: 신적 행위의 주체를 어떻게 드러낼지
  chosen_reading: ‘주님께서… 주셨습니다’로 옮겨, 은혜/호의가 궁극적으로 주님의 선물임을 분명히 했습니다.
  alternative_readings:
  - ‘주께서… 주셨습니다’
  - ‘하나님께서… 주셨습니다’
  rationale: 본문은 단순한 인간 호의가 아니라 주님의 부여하심을 말하므로, 동사의 주체를 분명히 드러내는 번역이 문맥에 가장 충실합니다.
  doctrine_reference: 섭리와 은혜의 일반적 성경적 표현
