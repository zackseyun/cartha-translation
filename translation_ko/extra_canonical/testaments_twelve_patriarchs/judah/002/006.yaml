    issue: ‘그것의 꼬리’의 선행사가 모호합니다.
    rationale: 원문에서 αὐτήν 및 그에 딸린 ‘꼬리’는 표범을 가리키지만, 한국어 초안에서는 ‘개’가 가장 가까운 명사이므로 꼬리의 소유자가 개로 읽힐 수 있습니다. 표범을 명시해야 원문의 지시 관계가 보존됩니다.
  revised_text: 헤브론에서 한 표범이 개에게 덤볐습니다. 나는 그 표범의 꼬리를 잡아 바위에 내던졌고, 그 표범은 둘로 갈라졌습니다.
