  text: A leopard in Hebron sprang upon the dog, and I caught it by the tail and hurled it against the rock, and it was split in two.
translation:
  language: ko
  text: 헤브론에서 한 표범이 개에게 덤볐습니다. 나는 그 표범의 꼬리를 잡아 바위에 내던졌고, 그 표범은 둘로 갈라졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάρδαλις
  english_pob_choice: A leopard
  chosen_korean: 표범
  alternatives_korean:
  - 범
  - 표호랑이
  lexicon: παρδαλίς
  rationale: 그리스어 παρδαλίς는 표범을 가리키므로, 자연스럽고 정확한 현대어인 ‘표범’으로 옮겼습니다.
- source_word: προσεπήδησεν ἐπὶ
  english_pob_choice: sprang upon
  chosen_korean: 덤볐습니다
  alternatives_korean:
  - 달려들었습니다
  - 뛰어올랐습니다
  lexicon: προσπηδάω
  rationale: 공격적으로 뛰어드는 동작을 간결하게 살리기 위해 ‘덤볐습니다’를 선택했습니다.
- source_word: ἀπηκόντισα
  english_pob_choice: hurled
  chosen_korean: 내던졌고
  alternatives_korean:
  - 내동댔고
  - 던졌고
  lexicon: ἀποκοντίζω
  rationale: ‘내던지다’는 몸에서 멀리 힘껏 던지는 동작을 잘 드러내며, POB의 ‘hurled’와도 잘 대응합니다.
- source_word: ἐρράγη εἰς δύο
  english_pob_choice: it was split in two
  chosen_korean: 둘로 갈라졌습니다
  alternatives_korean:
  - 둘로 쪼개졌습니다
  - 두 조각이 되었습니다
  lexicon: ῥήγνυμι
  rationale: 수동적 파열을 자연스럽게 전달하면서도 ‘둘로’라는 결과를 분명히 드러냈습니다.
