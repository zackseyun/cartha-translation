  text: I found a wild ox grazing in the land, and, taking hold of its horns, I shook it all around and blinded it.
translation:
  language: ko
  text: 나는 그 땅에서 풀을 뜯고 있는 야생 황소 한 마리를 발견하였습니다. 그 뿔을 붙잡고 빙빙 흔들어 눈멀게 한 뒤, 내던져 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βοῦν ἄγριον
  english_pob_choice: a wild ox
  chosen_korean: 거친 황소 한 마리
  alternatives_korean:
  - 들소 한 마리
  - 야생 소 한 마리
  lexicon: βοῦς
  rationale: 영어 POB의 'wild ox'를 따르되, 한국어에서는 자연스러운 동물명으로 '황소'를 택하고 ἄγριον의 거친/야생성을 '거친'으로 살렸습니다.
- source_word: τὴν χώραν νεμόμενον
  english_pob_choice: grazing in the land
  chosen_korean: 들판에서
  alternatives_korean:
  - 그 땅에서
  - 그 땅을 풀 뜯으며
  lexicon: χώρα
  rationale: νεμόμενον의 '풀을 뜯다/풀을 먹다'는 의미는 이미 앞의 서술과 결합되어 있으므로, 장소 중심으로 간결하게 '들판에서'로 옮겨 흐름을 살렸습니다.
- source_word: σκοτίσας
  english_pob_choice: blinded it
  chosen_korean: 그것의 눈을 멀게 하였습니다
  alternatives_korean:
  - 그것을 눈멀게 하였습니다
  - 그것을 눈이 멀게 하였습니다
  lexicon: σκοτίζω
  rationale: POB의 최신 수정이 'blinded it'이므로, 원문의 결과 상태를 직접 드러내는 '눈을 멀게 하였습니다'로 옮겼습니다.
theological_decisions:
- issue: 폭력적 행위의 서술 방식
  chosen_reading: 행위 자체를 완화하지 않고, 원문이 말하는 제압과 실명 조치를 그대로 서술했습니다.
  alternative_readings:
  - 부드럽게 제압하였습니다
  - 굴복시켰습니다
  rationale: 이 구절은 비유적/서사적 강도를 지니므로, 도덕적 완화를 가하지 않고 원문 표현을 최대한 유지하는 편이 본문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 본문 충실성 우선 원칙
