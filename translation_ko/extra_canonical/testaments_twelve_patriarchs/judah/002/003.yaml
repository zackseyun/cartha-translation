id: T12P.JUD.2.3
reference: Testament of Judah 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Τὴν δὲ δορκάδα⁷ *διὰ τοῦ δρόμου⁸ ἐκράτουν, καὶ πᾶν ὃ ἦν ἐν τοῖς πεδίοις⁹ κατελάμβανον.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/003.yaml
  text: And I would seize the gazelle along the road, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and threw it down the cliff, and it was crushed.
translation:
  language: ko
  text: 그리고 저는 길가에서 산양을 붙잡았고, 들판에 있는 것은 무엇이든 따라잡았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὴν δὲ δορκάδα
  english_pob_choice: the gazelle
  chosen_korean: 산양
  alternatives_korean:
  - 사슴
  - 가젤
  - 영양
  lexicon: δορκάς
  rationale: δορκάδα는 산양/가젤 계열의 들짐승을 가리키며, 한국어에서는 뜻을 드러내는 자연스러운 일반어 ‘산양’이 가장 읽기 쉽습니다.
- source_word: διὰ τοῦ δρόμου
  english_pob_choice: along the road
  chosen_korean: 길가에서
  alternatives_korean:
  - 길을 따라
  - 도로에서
  - 길 위로
  lexicon: δρόμος
  rationale: ‘along the road’의 공간적 흐름을 살리되, 현대 한국어에서 가장 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: ἐκράτουν
  english_pob_choice: I would seize
  chosen_korean: 붙잡았고
  alternatives_korean:
  - 붙들었습니다
  - 잡았습니다
  - 붙들어 있었습니다
  lexicon: κρατέω
  rationale: 문맥상 지속적·습관적 힘의 행사이지만, 한국어에서는 반복적 과거를 매끄럽게 드러내는 서술형으로 옮겼습니다.
- source_word: κατελάμβανον
  english_pob_choice: I overtook
  chosen_korean: 따라잡았습니다
  alternatives_korean:
  - 붙잡았습니다
  - 앞질렀습니다
  - 차지했습니다
  lexicon: καταλαμβάνω
  rationale: ‘overtook’의 추격·포착 의미를 반영해, 단순한 점유보다 ‘따라잡다’가 더 정확합니다.
theological_decisions:
- issue: 전쟁적 과장 표현의 직역 여부
  chosen_reading: 이 절은 영웅적 사냥/전투 과장을 있는 그대로 유지해 옮겼습니다.
  alternative_readings:
  - 비유적으로 완화해 번역
  - 윤리적 폭력을 약화한 의역
  rationale: 원문과 POB 영어는 행위의 강도를 낮추지 않으므로, 독자가 저자의 과장된 자기 묘사를 그대로 인지하도록 직역에 가깝게 처리했습니다.
  doctrine_reference: 본문 수사와 서사적 과장에 대한 번역 원칙
- issue: ‘들판에 있는 것은 무엇이든’의 범위
  chosen_reading: 공간 범위를 ‘들판에 있는 것은 무엇이든’으로 유지했습니다.
  alternative_readings:
  - 평야의 모든 것
  - 들판의 모든 짐승
  rationale: πᾶν ὃ ἦν ἐν τοῖς πεδίοις는 범주를 넓게 잡는 표현이므로, 특정 동물로 한정하지 않고 원문의 포괄성을 살렸습니다.
  doctrine_reference: 어휘 범위 보존 원칙
