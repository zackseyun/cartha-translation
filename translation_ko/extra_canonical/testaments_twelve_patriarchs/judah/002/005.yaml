  text: '*Τῷ ἀγρίῳ χοίρῳ²⁰ κατέδραμον, *καὶ προέλαβον²¹ ἐν τῷ τρέχειν με²² καὶ²³ κατεσπάραξα αὐτόν¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/005.yaml
  text: I ran down the wild boar, and I overtook it while I was running and tore it apart.
translation:
  language: ko
  text: 나는 들판의 멧돼지를 쫓아가 그것을 앞질렀고, 달리는 동안 그것을 덮쳐 산산이 찢었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ ἀγρίῳ χοίρῳ
  english_pob_choice: the wild boar
  chosen_korean: 들판의 멧돼지
  alternatives_korean:
  - 야생 멧돼지
  - 들멧돼지
  lexicon: ἀγριος / χοῖρος
  rationale: χοῖρος는 ‘돼지’이지만, 문맥상 사냥 대상의 거친 야생성을 살려 ‘멧돼지’로 옮겼고, ἀγρίῳ는 단순 중복이 아니라 야성·사나움을 강조하는 수식으로 이해해 ‘들판의’로 처리했습니다.
- source_word: κατέδραμον
  english_pob_choice: I ran down
  chosen_korean: 쫓아가
  alternatives_korean:
  - 달려가
  - 뒤쫓아가
  lexicon: κατατρέχω
  rationale: 사냥 장면에서 단순히 달린 것이 아니라 대상을 향해 내달려 접근하는 동작이므로, 한국어에서 자연스러운 사냥 동사인 ‘쫓아가’로 풀어 주었습니다.
- source_word: προέλαβον ἐν τῷ τρέχειν με
  english_pob_choice: I overtook it while I was running
  chosen_korean: 달리는 동안 그것을 앞질렀고
  alternatives_korean:
  - 내가 달리는 사이 그것을 따라잡았고
  - 달리면서 그것을 앞질렀고
  lexicon: προλαμβάνω + ἐν τῷ + infinitive
  rationale: 시간 부사구 ἐν τῷ τρέχειν με를 POB의 audit trail에 맞게 ‘while I was running’의 의미로 살리되, 한국어에서는 ‘달리는 동안’이 가장 자연스럽고 문장 흐름도 명료합니다.
- source_word: κατεσπάραξα αὐτόν
  english_pob_choice: tore it apart
  chosen_korean: 산산이 찢었습니다
  alternatives_korean:
  - 갈기갈기 찢었습니다
  - 찢어발겼습니다
  lexicon: κατασπαράσσω
  rationale: 동사의 폭력성과 완결성을 드러내기 위해 ‘산산이 찢다’를 채택했으며, 지나치게 구어적이거나 과도한 표현은 피했습니다.
theological_decisions:
- issue: 사냥/폭력 서사의 직설성 유지
  chosen_reading: 도덕화하거나 완곡하게 바꾸지 않고, 원문의 사냥-제압-분해 장면을 그대로 드러냈습니다.
  alternative_readings:
  - 상징적으로 완화해 옮기기
  - 비유적 의미를 덧씌워 순화하기
  rationale: 이 구절은 인물의 무용담적 자기서술로서 행위의 강도를 유지하는 것이 원문의 의도와 일치하므로, 폭력성을 약화시키지 않았습니다.
  doctrine_reference: source-meaning fidelity / narrative force
