  - severity: medium
    issue: πάντων을 ‘모든 것을’로 특정함
    rationale: 속격 복수 πάντων은 여기서 사람과 사물을 문법적으로 구별하지 않습니다. ‘모두를’이 원문의 포괄성과 모호성을 더 잘 보존합니다.
  - severity: low
    issue: 본문의 [a] 표지에 대응하는 각주가 제시되지 않음
    rationale: 표지와 각주를 일치시키기 위해, 불의 비유와 ‘자기 마음에서’의 의미를 설명하는 각주를 제공합니다.
  revised_text: 그리고 진리의 영은 모두를 고발하고, 죄인은 자기 마음에서 불타오르며, 재판관을 향해 얼굴을 들 수 없습니다.[a]
