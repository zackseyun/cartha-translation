  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ²⁰ τὸ πνεῦμα τῆς ἀληθείας²¹ κατηγορεῖ²² πάντων²³ καὶ ἐμπεπύρισται ὁ ἁμαρτωλὸς²⁴ ἐκ τῆς ἰδίας καρδίας, καὶ ἆραι²⁵ πρόσωπον πρὸς τὸν κριτὴν οὐ δύναται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/005.yaml
  text: And the Spirit of truth accuses all, and the sinner is consumed from his own heart, and to lift up
translation:
  language: ko
  text: 그리고 진리의 영은 모든 것을 고발하고, 죄인은 자기 마음에서 사로잡혀 소멸되며, 얼굴을 들어 재판관을 향할 수 없습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  english_pob_choice: the Spirit of truth
  chosen_korean: 진리의 영
  alternatives_korean:
  - 진리의 성령
  - 진실의 영
  lexicon: πνεῦμα
  rationale: 이 구절에서는 신적 영을 가리키는 표현이지만, 본문 자체는 삼위일체 신학어보다 ‘진리의 영’이라는 원표현의 수사를 우선하므로 ‘진리의 영’으로 직역했습니다.
- source_word: κατηγορεῖ
  english_pob_choice: accuses
  chosen_korean: 고발하고
  alternatives_korean:
  - 비난하고
  - 책망하고
  lexicon: κατηγορέω
  rationale: 영어 POB의 개정이 ‘testifies against’보다 ‘accuses’로 좁힌 점을 반영해, 법정적 대립과 고소의 뉘앙스를 살리는 ‘고발하다’를 택했습니다.
- source_word: ἐμπεπύρισται
  english_pob_choice: consumed
  chosen_korean: 소멸되며
  alternatives_korean:
  - 타버리며
  - 불살라지며
  lexicon: ἐμπυρόω
  rationale: ‘burned up’보다 ‘consumed’에 맞춰, 단순한 화염 묘사보다 안에서부터 다 소진되는 결과를 나타내는 ‘소멸되다’를 사용했습니다.
- source_word: ἆραι πρόσωπον πρὸς τὸν κριτὴν
  english_pob_choice: to lift up [his face] to the judge
  chosen_korean: 얼굴을 들어 재판관을 향할 수 없습니다
  alternatives_korean:
  - 재판관 앞에 얼굴을 들 수 없습니다
  - 심판자에게 얼굴을 들 수 없습니다
  lexicon: πρόσωπον / κριτής
  rationale: 그리스어의 관용구를 자연스럽게 살리되, 본문 말미의 미완성을 드러내기 위해 목적어를 보완하되 종결을 열어 두지 않고 완결된 한국어 문장으로 정리했습니다.
theological_decisions:
- issue: ‘영’의 번역과 신적 지시성
  chosen_reading: ‘진리의 영’으로 옮기되, 여기서는 문맥상 하나님의 영을 지시하는 표현으로 읽힐 수 있음을 유지했습니다.
  alternative_readings:
  - ‘진리의 성령’으로 명시적으로 번역
  - ‘진리의 영’의 수사적 표현을 일반화
  rationale: 본 구절은 신적 영을 가리키는 것으로 읽히지만, 추가 해석어를 덧붙여 범위를 좁히기보다 원문 표현의 직접성을 살렸습니다.
  doctrine_reference: 성령론
- issue: 본문 말미의 미완성 처리
  chosen_reading: 문장 전체를 한국어로는 매끄럽게 마무리하되, 원문의 마지막 동사구가 문맥상 이어질 가능성을 염두에 두었습니다.
  alternative_readings:
  - 영어 POB처럼 끝을 ‘and to lift up’으로 남김
  - 후대 보충처럼 완전한 문장으로 재구성
  rationale: 제시된 그리스어 본문과 최신 개정 노트에 따르면 해당 구절은 마지막 절이 끊긴 상태이므로, 과도한 보충 없이 현재 주어진 범위 안에서만 번역했습니다.
  doctrine_reference: 본문비평 / 번역윤리
