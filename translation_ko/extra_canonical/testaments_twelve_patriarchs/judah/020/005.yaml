revisions:
- from: 그리고 진리의 영은 모든 것을 고발하고, 죄인은 자기 마음에서 사로잡혀 소멸되며, 얼굴을 들어 재판관을 향할 수 없습니다.[a]
  to: 그리고 진리의 영은 모두를 고발하고, 죄인은 자기 마음에서 불타오르며, 재판관을 향해 얼굴을 들 수 없습니다.[a]
  rationale: 제시된 그리스어 본문을 기준으로 불의 비유를 회복하고, πάντων의 지시 대상을 불필요하게 ‘사물’로 한정하지 않았습니다. 영어 감사 이력의 마지막 절 생략 언급은 실제로 제공된 그리스어 본문에 κριτὴν과 οὐ δύναται가 있는 점과 일치하지 않으므로 따르지 않았습니다. 마지막 절은 원문대로 완결하여 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:07Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 마지막 절을 완결해 옮긴 점은 제시된 그리스어(καὶ ἆραι πρόσωπον πρὸς τὸν κριτὴν οὐ δύναται)에 충실합니다. 그러나 ἐμπεπύρισται를 ‘사로잡혀 소멸되며’로 옮긴 것은 불/타오름의 어휘를 잃고 ‘사로잡히다’라는 근거 없는 의미를 더합니다. 또한 πάντων은 문법상 성별이 특정되지 않으므로 ‘모든 것을’보다 ‘모두를’이 원문의 범위를 더 보존합니다.
  naturalness: ‘자기 마음에서 불타오르며’는 ἐκ τῆς ἰδίας καρδίας의 출처·내적 원인을 유지하면서 한국어로도 자연스럽습니다. ‘재판관을 향해 얼굴을 들 수 없습니다’는 원문의 관용적 표현과 방향 표현을 함께 살립니다.
  terminology: ‘진리의 영’은 원문의 표현을 보존하며, 본문만으로 ‘성령’이라고 교리적으로 한정하지 않는 적절한 선택입니다. κατηγορεῖ에는 ‘고발합니다’를 유지할 수 있습니다. κριτής는 법정적 문맥에 맞게 ‘재판관’으로 옮깁니다.
  issues:
  - severity: high
    issue: ἐμπεπύρισται의 의미가 ‘사로잡혀 소멸되며’로 번역됨
