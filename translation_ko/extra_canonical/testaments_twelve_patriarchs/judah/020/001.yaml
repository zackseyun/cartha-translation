id: T12P.JUD.20.1
reference: Testament of Judah 20:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὁδηγεῖ³, ὅτι⁴ ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς⁵ ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα⁷ αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/001.yaml
  text: For it leads astray, because in the delusion of silver they call those who are not gods gods, and it causes the one who has it to fall into ecstasy.
translation:
  language: ko
  text: 그것은 곁길로 이끕니다. 은(銀)의 미혹 속에서 하나님이 아닌 것들을 신이라고 부르게 하고, 그것을 가진 사람을 황홀경에 빠지게 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγεῖ
  english_pob_choice: it leads astray
  chosen_korean: 곁길로 이끕니다
  alternatives_korean:
  - 미혹합니다
  - 길을 벗어나게 합니다
  lexicon: ὁδηγέω
  rationale: 단순한 ‘인도하다’가 아니라 문맥상 사람을 바른 길에서 벗어나게 하는 뜻이므로, 한국어에서도 결과를 분명히 드러내는 표현을 택했습니다.
- source_word: ἐν πλάνῃ ἀργυρίου
  english_pob_choice: in the delusion of silver
  chosen_korean: 은(銀)의 미혹 속에서
  alternatives_korean:
  - 은의 망상 속에서
  - 돈의 미혹 속에서
  lexicon: πλάνη
  rationale: πλάνη는 ‘미혹/오도’의 의미가 강하고, ἀργυρίου는 문자적으로 ‘은’이지만 우상 제작·재물의 매혹을 함께 떠올리게 하므로 직역성을 살려 ‘은(銀)’으로 옮겼습니다.
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  english_pob_choice: they call those who are not gods gods
  chosen_korean: 하나님이 아닌 것들을 신이라고 부르게 하고
  alternatives_korean:
  - 신이 아닌 것들을 신이라 부르게 하고
  - 신이 아닌 자들을 신이라 부르게 하고
  lexicon: θεός
  rationale: 문법상 ‘그들이 …라고 부른다’의 구조를 자연스럽게 풀어, 실재상 신이 아닌 대상을 신으로 호칭하는 우상숭배의 역설을 분명히 했습니다.
- source_word: εἰς ἔκστασιν
  english_pob_choice: to fall into ecstasy
  chosen_korean: 황홀경에 빠지게 합니다
  alternatives_korean:
  - 황홀 상태에 빠지게 합니다
  - 넋을 잃게 합니다
  lexicon: ἔκστασις
  rationale: POB가 ‘ecstasy’를 채택한 점을 따라, 한국어에서도 종교적/심리적 극치 상태를 가리키는 ‘황홀경’을 사용했습니다.
theological_decisions:
- issue: ἔκστασις의 번역이 단순한 감정 고양인지, 종교적 황홀/이탈 상태인지
  chosen_reading: ‘황홀경’으로 번역해 비이성적·종교적 탈중심 상태를 드러냈습니다.
  alternative_readings:
  - ‘흥분’
  - ‘황홀’
  rationale: 문맥은 우상의 미혹이 사람을 사로잡아 비정상적 황홀 상태로 몰아가는 것을 말하므로, 완곡한 감정보다 강한 어휘가 원문의 힘을 더 잘 반영합니다.
  doctrine_reference: 우상숭배와 미혹에 대한 경고
- issue: μὴ ὄντας θεοὺς의 처리
  chosen_reading: ‘하나님이 아닌 것들’로 옮겨, 존재론적 참신성이 없는 우상의 무가치를 드러냈습니다.
  alternative_readings:
  - ‘신이 아닌 것들’
  - ‘신이 아닌 자들’
  rationale: 원문은 실재하는 참신과 대비되는 거짓 신들을 지칭하므로, 한국어에서 ‘하나님’이 아닌 대상임을 분명히 하되 우상에 대한 실재성을 부정하는 뉘앙스를 살렸습니다.
  doctrine_reference: 유일신 신앙과 우상 비판
