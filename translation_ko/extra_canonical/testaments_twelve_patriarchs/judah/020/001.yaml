    rationale: 원문은 ‘사람들이 ... 신들이라고 부른다’와 ‘그것이 가진 사람을 황홀경에 빠지게 한다’를 구별합니다. 현행 ‘부르게 하고’는 첫 절의 문법적 주체를 바꾸어 놓습니다.
  - severity: medium
    issue: ‘하나님이 아닌 것들을 신이라고’가 θεούς의 일반적·복수적 대조를 좁히고 약화합니다.
    rationale: θεούς는 여기서 ‘하나님’이라는 고유한 단수 명칭이 아니라 ‘신들’입니다. ‘신이 아닌 것들을 신들이라고’가 원문의 표현을 보존합니다.
  revised_text: 그것은 곁길로 이끕니다. 사람들이 은의 미혹에 빠져 신이 아닌 것들을 신들이라고 부르고, 그것이 그것을 가진 사람을 황홀경에 빠지게 하기 때문입니다.[a]
