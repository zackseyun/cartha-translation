base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/004.yaml
  text: 'For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast.'
translation:
  language: ko
  text: 그런데 속임수의 통치자가 저를 눈멀게 하였고, 저는 사람으로서 알지 못했으며, 죄들 가운데 썩어 가는 육체로서 제 자신의 연약함을 깨달았습니다. 저는 스스로를 무적이라고 생각하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρχων τῆς πλάνης
  english_pob_choice: the ruler of deceit
  chosen_korean: 속임수의 통치자
  alternatives_korean:
  - 거짓의 통치자
  - 기만의 지배자
  - 속임수의 지배자
  lexicon: ἄρχων / πλάνη
  rationale: POB의 'ruler of deceit'를 따라 ἄρχων의 지배적 권위를 '통치자'로, πλάνη의 의미를 '속임수'로 옮겨 인격화된 악의 주체성을 살렸습니다.
- source_word: ἠγνόησα ὡς ἄνθρωπος
  english_pob_choice: I was ignorant as a man
  chosen_korean: 저는 사람으로서 알지 못했으며
  alternatives_korean:
  - 사람답게 알지 못했으며
  - 인간으로서 무지했으며
  - 인간처럼 알지 못했으며
  lexicon: ἀγνοέω / ἄνθρωπος
  rationale: 단순한 지적 결핍보다 '사람으로서'라는 존재론적 한계를 드러내는 문맥이므로, POB의 표현을 유지해 자연스러운 합쇼체로 다듬었습니다.
- source_word: ὡς σὰρξ ἐν ἁμαρτίαις φθαρείς
  english_pob_choice: as flesh corrupted in sins
  chosen_korean: 죄들 가운데 썩어 가는 육체로서
  alternatives_korean:
  - 죄들로 부패한 육체로서
  - 죄 가운데 타락한 육신으로서
  - 죄들 안에서 썩은 육체로서
  lexicon: σάρξ / φθείρω / ἁμαρτίαις
  rationale: σάρξ를 '육체'로, φθαρείς를 '썩어 가는'으로 옮겨 부패 상태를 살렸고, ἁμαρτίαις는 복수형을 살려 '죄들'로 두었습니다.
- source_word: ἀκαταμάχητος εἶναι
  english_pob_choice: thinking myself invincible
  chosen_korean: 스스로를 무적이라고 생각하였습니다
  alternatives_korean:
  - 스스로를 맞설 수 없다고 생각하였습니다
  - 스스로 무적이라 여겼습니다
  - 아무도 이길 수 없다고 생각하였습니다
  lexicon: ἀκαταμάχητος
  rationale: 형용사의 핵심인 '대적할 수 없음'을 한국어의 관용적 강세인 '무적'으로 압축해 자의적 과장을 드러냈습니다.
theological_decisions:
- issue: 죄와 육체의 관계를 어떻게 드러낼지
  chosen_reading: '''죄들 가운데 썩어 가는 육체''로 옮겨, 죄가 단지 외적 행위가 아니라 육체의 부패 상태와 결부된다는 점을 살렸습니다.'
  alternative_readings:
  - '''죄들로 부패한 육체'''
  - '''죄 가운데 타락한 육신'''
  rationale: 문맥상 자기 인식의 전환점이므로, 도덕적 실패를 넘어 존재의 부패를 강조하는 표현이 필요합니다.
  doctrine_reference: 인간의 타락과 죄의 부패성
