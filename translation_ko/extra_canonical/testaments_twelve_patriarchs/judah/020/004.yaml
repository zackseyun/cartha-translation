  to: 기만의 통치자가 저를 눈멀게 하였으므로, 저는 한 인간으로서 알지 못했고, 죄들 가운데 부패한 육체로서, 스스로를 무적이라고 여기면서 제 자신의 연약함을 깨달았습니다.
