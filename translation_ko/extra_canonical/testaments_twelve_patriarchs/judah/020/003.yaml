  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἀλλ᾽ ὁ Θεὸς τῶν πατέρων μου²⁰ ἐλέησε με, ὅτι ἐν ἀγνωσίᾳ²¹ τοῦτο²² ἐποίησα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/003.yaml
  text: But the God of my fathers had mercy on me, because I did this in ignorance.
translation:
  language: ko
  text: 그러나 내 조상들의 하나님께서 내게 자비를 베푸셨습니다. 내가 이것을 무지 가운데서 행했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλ᾽
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: 접속사
  rationale: 앞선 진술과의 대조를 자연스럽게 살리되, 문어체 합쇼체에 맞는 간결한 전환으로 옮겼습니다.
- source_word: ὁ Θεὸς τῶν πατέρων μου
  english_pob_choice: the God of my fathers
  chosen_korean: 내 조상들의 하나님
  alternatives_korean:
  - 내 아버지들의 하나님
  - 우리 조상들의 하나님
  lexicon: Θεός
  rationale: 직역하면 ‘아버지들’이지만 한국어에서는 혈통적 조상들을 가리키는 표현이 더 자연스럽고, 원문의 소유 관계도 유지합니다.
- source_word: ἐλέησε
  english_pob_choice: had mercy on me
  chosen_korean: 내게 자비를 베푸셨습니다
  alternatives_korean:
  - 나를 불쌍히 여기셨습니다
  - 나에게 긍휼을 베푸셨습니다
  lexicon: ἐλεέω
  rationale: 행위의 주체적 은혜를 드러내는 ‘자비를 베푸다’가 원문의 동사성을 잘 살리며, 합쇼체 서술에도 잘 맞습니다.
- source_word: ἐν ἀγνωσίᾳ
  english_pob_choice: in ignorance
  chosen_korean: 무지 가운데서
  alternatives_korean:
  - 무지로
  - 알지 못한 채
  lexicon: ἀγνωσία
  rationale: 단순 정보 부족보다 책임 감경의 배경 상태를 드러내는 표현으로, 원문의 관용적 의미를 비교적 직접적으로 옮겼습니다.
theological_decisions:
- issue: 죄책의 완전한 면책이 아니라 행위의 인지 결핍을 이유로 한 자비의 강조
  chosen_reading: ‘무지 가운데서’는 행위가 잘못이 아니었다는 뜻이 아니라, 하나님께서 그 무지에도 불구하고 자비를 베푸셨다는 진술로 읽었습니다.
  alternative_readings:
  - ‘무지로’ 읽어 단순한 원인 설명으로만 이해함
  - ‘알지 못한 채’로 번역해 행위자의 인식 부족을 강조함
  rationale: 원문은 잘못의 성격을 부정하기보다 자비의 근거를 제시하므로, 구원적 관용의 뉘앙스를 유지하는 것이 더 적절합니다.
  doctrine_reference: 자비/회개/무지에 대한 성서적 진술의 긴장
