id: T12P.JUD.20.2
reference: Testament of Judah 20:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Διὰ τὸ ἀργύριον ἐγὼ¹⁰ τέκνα μου ἀπώλεσα τὰ τέκνα μου¹², καὶ εἰ μὴ ἡ¹³ μετάνοιά μου¹⁵ καὶ¹⁶ ἡ ταπείνωσίς μου¹⁷ καὶ¹⁷ ηὐχαι¹⁸ τοῦ πατρός μου συνεδράμον¹⁹, ἄτεκνος εἶχον ἀποθανεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/002.yaml
  text: Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
translation:
  language: ko
  text: 은 때문에 저는 제 자녀들을 잃었습니다. 그러나 저의 회개와 낮아짐과 아버지의 기도가 저를 도와주지 않았더라면, 저는 자식 없이 죽었을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τὸ ἀργύριον
  english_pob_choice: Because of silver
  chosen_korean: 은전 때문에
  alternatives_korean:
  - 은 때문에
  - 돈 때문에
  - 은화 때문에
  lexicon: ἀργύριον
  rationale: 문맥상 일반적 ‘돈’보다 구체적 금속 재물을 드러내기 위해 ‘은전’으로 옮겼습니다. 영어 POB의 silver를 직접 반영하되, 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: ἐγὼ τέκνα μου ἀπώλεσα τὰ τέκνα μου
  english_pob_choice: I lost my children
  chosen_korean: 제가 제 자녀들을 잃었습니다
  alternatives_korean:
  - 제가 제 아이들을 잃었습니다
  - 내가 내 자녀들을 잃었습니다
  lexicon: ἀπώλεσα / τέκνα
  rationale: 동사의 상실 의미를 직접 살리고, τέκνα는 문맥상 ‘자녀들’이 가장 무난하여 선택했습니다. 1인칭 진술의 생동감을 살리기 위해 ‘제가’로 정리했습니다.
- source_word: μετάνοιά μου καὶ ἡ ταπείνωσίς μου
  english_pob_choice: my repentance and my humiliation
  chosen_korean: 저의 회개와 저의 낮아짐
  alternatives_korean:
  - 저의 회개와 저의 겸손
  - 저의 회개와 저의 비천함
  lexicon: μετάνοια / ταπείνωσις
  rationale: μετάνοια는 ‘회개’가 직접적이고, ταπείνωσις는 단순한 내적 겸손보다 굴욕적 낮아짐을 포함하므로 ‘낮아짐’으로 옮겨 원문의 수치와 비하 뉘앙스를 보존했습니다.
- source_word: ηὐχαι τοῦ πατρός μου συνεδράμον
  english_pob_choice: the prayers of my father, had not come to my aid
  chosen_korean: 저의 아버지의 기도들이 제게 달려오지 않았더라면
  alternatives_korean:
  - 저의 아버지의 기도들이 제게 도움을 주지 않았더라면
  - 저의 아버지의 기도가 제 편이 되어주지 않았더라면
  lexicon: ηὐχαί / συνεδράμον
  rationale: 복수형 ‘기도들’을 살리고, συνεδράμον의 ‘함께 달려오다/달려와 돕다’ 이미지를 보존하기 위해 ‘제게 달려오지 않았다’로 직역 성분을 유지했습니다. 영어 POB의 ‘come to my aid’를 참고하되 원문 동적 이미지를 놓치지 않게 했습니다.
theological_decisions:
- issue: ‘회개와 낮아짐, 아버지의 기도’가 인과적으로 구원을 돕는 표현
  chosen_reading: 화자는 자신의 생존을 자신의 회개와 낮아짐, 그리고 아버지의 기도가 결합하여 보존해 준 것으로 증언합니다.
  alternative_readings:
  - 단순한 수사적 과장으로 읽기
  - 기도의 효력을 덜 강하게 완화해 읽기
  rationale: 원문은 실제 구원 서술이 아니라 회고적 증언이며, 세 요소의 결합이 자신을 죽음에서 건졌다는 진술을 분명히 합니다. 한국어에서도 이 인과성을 흐리지 않도록 유지했습니다.
  doctrine_reference: 서사적 증언의 의미 보존
