revisions:
- from: '1. 그러므로, 내 자녀들아, 포도주의 한계를 조심하십시오. 그 안에는 네 가지 악한 영이 있기 때문이니, 곧 욕망, 뜨거운 정욕, 방탕, 수치스러운 이익입니다.


    2. 여러분이 기쁨 가운데 포도주를 마신다면, 하나님을 두려워하는 마음으로 절제해야 합니다. 기쁨 가운데서 하나님을 두려워하는 마음이 떠나면, 곧 술취함이 뒤따르고 수치 없음이 들어옵니다.


    3. 그러나 절제하며 살고 싶다면, 포도주를 아예 건드리지도 마십시오. 그러면 여러분이 교만한 말과 싸움과 비방과 하나님의 계명을 어기는 일로 죄를 짓고, 제때에 죽지 않게 될 것입니다.


    4. 포도주는 하나님과 사람의 비밀도 드러냅니다. 나도 마찬가지로 내 아버지 야곱의 하나님의 계명과 비밀들을 가나안 여자에게 드러냈습니다—하나님께서 내게 드러내지 말라고 하신 것들입니다.[a][b][c]'
