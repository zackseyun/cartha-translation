base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016.yaml
  text: '1[a]. Guard yourselves, therefore, my children, against the limit of wine; for in it there are four evil spirits: desire, heated passion, dissipation, and shameful gain[b].


    2. If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness enters.


    3. But if you want to live with self-control, do not touch wine at all, lest you sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.


    4. Wine also reveals the mysteries of God and of men, just as I too revealed the commandments of God and the mysteries of Jacob my father to the Canaanite woman—things that God told me not to reveal.


    5[c]. And wine becomes the cause of war and turmoil.'
  footnotes:
  - marker: a
    text: Or 'the measure of wine' or 'the boundary of wine'—the phrase likely warns against crossing wine's proper limit.
    reason: lexical_alternative
  - marker: b
    text: '''Evil spirits'' may function as personified vices or as more-than-metaphorical spiritual forces; the Greek leaves the texture intact.'
    reason: lexical_alternative
  - marker: c
    text: The confession recalls Judah's disclosure to the Canaanite woman of matters he says God had forbidden him to reveal.
    reason: cross_reference
translation:
  language: ko
  text: '1. 그러므로 내 자녀들아, 포도주의 한도를 지키십시오.[a] 그 안에는 네 가지 악한 영들이 있기 때문입니다.[b] 곧 욕망, 불타는 격정, 방탕, 부끄러운 이득입니다.


    2. 여러분이 기쁨 가운데 포도주를 마신다면, 하나님을 두려워하는 마음으로 삼가십시오.


    3. 그러나 절제하며 살고 싶다면, 포도주를 아예 건드리지도 마십시오. 그러지 않으면 오만한 말과 싸움과 비방과 하나님의 계명을 범하는 일들로 죄를 짓고, 여러분의 때가 되기 전에 멸망할 것입니다.


    4. 포도주는 하나님과 사람들의 비밀들도 드러냅니다. 나도 이와 같이 하나님의 계명들과 내 아버지 야곱의 비밀들을 가나안 여인에게 드러냈습니다. 그것들은 하나님께서 내게 드러내지 말라고 하신 것들입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘포도주의 한계(또는 경계)’입니다. 문맥상 포도주와 관련하여 지켜야 할 한도, 곧 넘어서는 안 될 경계를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악한 영들’은 문자적으로 영들을 뜻합니다. 뒤따르는 목록은 그 영들의 도덕적 작용을 묘사하지만, 그리스어의 영적 언어 자체를 심리적 충동으로 한정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ὅρον τοῦ οἴνου
  english_pob_choice: the limit of wine
  chosen_korean: 포도주의 한계
  alternatives_korean:
  - 포도주의 경계
  - 포도주의 분량
  - 포도주의 절도
  lexicon: LSJ
  rationale: ὅρος는 문맥상 포도주에 대해 넘어서는 안 되는 경계선을 가리키므로, ‘한계’가 영어 POB의 ‘limit’과 같은 직접성과 경고의 힘을 살립니다.
- source_word: πνεύματα πονηρά
  english_pob_choice: evil spirits
  chosen_korean: 악한 영
  alternatives_korean:
  - 악한 영들
  - 악한 충동
  - 악한 성향
  lexicon: LSJ
  rationale: 본문은 악행을 심리화하지 않고 ‘영’ 언어를 유지하므로, ‘악한 영’으로 번역해 비인격적 비유로 약화시키지 않았습니다.
- source_word: πύρωσεως
  english_pob_choice: heated passion
  chosen_korean: 뜨거운 정욕
  alternatives_korean:
  - 달아오른 열정
  - 불타는 정욕
  - 격정
  lexicon: LSJ
  rationale: 불붙듯 달아오르는 욕정을 가리키는 표현으로 보아, 한국어에서는 ‘뜨거운 정욕’이 비유와 윤리적 뉘앙스를 함께 전달합니다.
- source_word: ἀσωτίας
  english_pob_choice: dissipation
  chosen_korean: 방탕
  alternatives_korean:
  - 탕진
  - 낭비
  - 음란한 방탕
  lexicon: LSJ
  rationale: 문맥의 악덕 목록에서 ἀσωτία는 절제 없는 방종을 뜻하므로, 간결하고 널리 이해되는 ‘방탕’이 적절합니다.
- source_word: σωφρόνως
  english_pob_choice: with self-control
  chosen_korean: 절제하며
  alternatives_korean:
  - 신중하게
  - 온건하게
  - 자제하며
  lexicon: LSJ
  rationale: 부사의 핵심은 절제된 삶의 태도이므로, 동사구로 자연화한 ‘절제하며’가 합쇼체 문장에 가장 읽기 좋습니다.
- source_word: ἐφάπτεσθε
  english_pob_choice: touch
  chosen_korean: 건드리지도 마십시오
  alternatives_korean:
  - 만지지도 마십시오
  - 가까이하지 마십시오
  - 손대지 마십시오
  lexicon: LSJ
  rationale: 금지의 강도를 살리기 위해 단순 접촉 이상을 암시하는 ‘건드리지도 마십시오’를 택했습니다.
- source_word: μυστήρια
  english_pob_choice: mysteries
  chosen_korean: 비밀
  alternatives_korean:
  - 비의
  - 신비
  - 감추어진 일
  lexicon: LSJ
  rationale: 이 본문에서는 신비주의적 용어보다 ‘숨겨진 내용’의 뜻이 강하므로, 한국어에서는 문맥에 맞는 ‘비밀’이 자연스럽습니다.
theological_decisions:
- issue: 포도주 경고의 강도
  chosen_reading: 3절의 μηδ᾽ ὅλως ... ἐφάπτεσθε를 포도주를 ‘아예 건드리지도 마십시오’로 옮겨 총체적 금지의 수사적 강도를 살렸습니다.
  alternative_readings:
  - 포도주를 절제해서 마십시오
  - 포도주를 과음하지 마십시오
  rationale: 그리스어는 단순 과음 자제가 아니라 더 강한 금지를 말하므로, 문맥의 훈계적 급박함을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
- issue: 말하는 화자의 호칭과 종결
  chosen_reading: 본문의 직접 설교체는 합쇼체로 유지하고, 1절의 ‘내 자녀들아’는 원문의 친자식적 호칭을 살려 친근한 훈계로 옮겼습니다.
  alternative_readings:
  - 내 아들들아
  - 자녀들아
  rationale: 청중을 훈계하는 고대 유언문 형식의 직접성을 유지하면서도 한국어 출판문체에 맞추기 위함입니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
