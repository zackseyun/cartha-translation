review_pass:
  verdict: revise
  source_fidelity: 현 번역은 영어 POB의 일부 확장·조화 요소를 따르면서 제시된 그리스어 본문에서 벗어났습니다. 특히 v.1의 ‘여관’, v.2의 ‘음행’ 및 ‘공개적으로’와 7일의 누락, v.4의 ‘반지’와 ‘내 왕권의’, v.8의 ‘가증한 일’ 이유절은 그리스어 α 본문에 없습니다. v.7 후반의 ‘처음 말들’을 누락하였고, v.11의 πρὸς Ἰωσήφ은 ‘요셉에게/요셉 쪽으로’이지 목적을 나타내는 ‘요셉에게 가려고’로 좁힐 필요가 없습니다.
  naturalness: 합쇼체의 전반적 문장은 자연스럽지만, ‘결혼식 장식’은 νυμφικός의 신부·혼례 차림보다 다소 협소하며, v.9의 이중 부정 구조는 원문의 불명확성을 지나치게 단정합니다. 수정문은 현대 표준어 합쇼체를 유지하면서 성적 완곡어법도 문헌의 서술 수준에 맞게 보존합니다.
  terminology: 다말, 에나임, 아모리 사람들, 주님, 이집트, 요셉은 적절합니다. κοσμηθεῖσα κόσμῳ νυμφικῷ는 ‘신부의 차림으로 몸을 꾸미고’가 자연스럽습니다. διάδημα는 ‘관’보다 ‘디아뎀’이 원문의 왕실 장식을 더 정확히 보존합니다. ἀρραβών은 ‘담보물’로 일관되게 옮겼습니다.
  issues:
  - severity: high
    issue: v.1에 ‘여관’이 추가되었습니다.
    rationale: 제시된 그리스어는 ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην(에나임 성읍의 성문 쪽)을 읽으며 πανδοχεῖον(여관)을 포함하지 않습니다.
  - severity: high
    issue: v.2의 성행위 해석이 과도하고 ‘7일’이 빠졌습니다.
    rationale: 그리스어는 과부가 성문 곁에 ‘7일 동안 앉아 있는’ 아모리인의 법을 말할 뿐, 이 α 본문에는 πορνεία(매춘/음행)가 없습니다. ‘공개적으로’도 별도의 어휘로 명시되지 않습니다.
  - severity: high
    issue: v.4의 담보물 목록이 확장되었습니다.
    rationale: 그리스어는 ῥάβδος와 διάδημα만 말합니다. ‘반지’와 ‘내 왕권의’는 제시된 본문에 없으므로 삭제해야 합니다.
  - severity: medium
    issue: v.7 후반이 누락되었습니다.
    rationale: καὶ τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ, 곧 ‘처음 말들을 내게 사용했다’는 문구를 번역에 남겨야 합니다. 그 지시 대상은 불분명하므로 해설로 결정하지 않습니다.
  - severity: high
    issue: v.8에 없는 이유절이 추가되었습니다.
    rationale: 제시된 그리스어 v.8은 평생 다시 가까이하지 않았다는 진술로 끝납니다. ‘온 이스라엘 가운데서 이 가증한 일을 행했기 때문’은 이 본문에 없습니다.
  - severity: medium
    issue: v.9의 난해한 표현을 ‘창녀가 있었다’는 단정적 진술로 처리했습니다.
    rationale: τελεσικόμενον은 본문상 난해하며, 성문에서 어떤 일이 ‘이루어지고 있었다’는 뜻으로 넓게 보존하는 편이 안전합니다. 주석으로 불확실성을 밝혀야 합니다.
  - severity: medium
    issue: 각주 표지가 그리스어 본문과 맞지 않는 영어 POB의 문제를 계승했습니다.
    rationale: v.6의 ‘은밀한 말’ 및 ‘주님에게서 온 일’에 각각 표지를 두고, v.1과 v.4의 주석은 실제 그리스어 읽기에 맞추어 갱신해야 합니다.
