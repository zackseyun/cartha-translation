base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012.yaml
  text: 1[a]. After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal adornment and sat in Enaim, at the city gate of the inn. 2. For it was a law of the Amorites that a widow should sit there openly for prostitution. 3. So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment. 4[b]. And turning aside to her I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived. 5. But I, not knowing what I had done, wanted to kill her. Yet she sent the pledges secretly and put me to shame. 6. And when I called her, I heard also the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord. 7. For I said, “Perhaps she did this deceitfully,
    having received the pledge from another.” 8. But I did not approach her again for the rest of my life, because I had done this abomination in all Israel. 9. Yet those in the city said that there had been no harlot sitting at the gate, because she had come from another place and sat for a short time at the gate. 10. And I supposed that no one knew that I had gone in to her. 11. And after this we came into Egypt to Joseph because of the famine. 12. Now I was forty-six years old[d][c], and I spent seventy-three years in Egypt.
  footnotes:
  - marker: a
    text: The Greek reads 'the inn' (πανδοχεῖον), an unusual detail compared with the Genesis narrative; the translation preserves the witness rather than harmonizing it away.
    reason: textual_variant
  - marker: b
    text: Some textual features in this chapter differ from the Genesis account, especially the items given as pledge. The Greek here reads 'my staff and my ring and the diadem of my kingdom.'
    reason: textual_variant
  - marker: c
    text: Or 'the words spoken privately.' The Greek wording is textually awkward but points to words Judah uttered in secret while drunk.
    reason: lexical_alternative
  - marker: d
    text: '''Because it was from the Lord'' may express Judah''s sense of divine providence overruling the event, not necessarily approval of the act.'
    reason: alternative_reading
translation:
  language: ko
  text: 1[a]. 그 뒤로, 다말이 두 해 동안 과부로 지낸 뒤 내가 양털을 깎으러 올라간다는 말을 듣고는, 결혼식 장식으로 몸을 꾸미고 에나임의 성문 곁에 앉아 있었습니다. 2. 아모리 사람들의 법은 과부가 거기에서 공개적으로 음행을 하며 앉아 있는 것이었습니다. 3. 그래서 내가 포도주에 취해 있을 때 그녀를 알아보지 못했고, 그녀는 자기의 아름다움과 장식의 모습으로 나를 속였습니다. 4[b]. 내가 그 여자에게로 몸을 돌려 말했습니다. 「내가 당신에게 들어가겠습니다.」 그러자 그녀가 말했습니다. 「무엇을 주시겠습니까?」 그래서 나는 내 지팡이와 내 반지와 내 왕권의 관을 담보로 그녀에게 주었습니다. 그리고 내가 그녀에게 들어갔을 때, 그녀는 임신하였습니다. 5. 그러나 내가 내가 한 일을 알지 못한 채 그녀를 죽이고 싶어 했습니다. 하지만 그녀는 그 담보물을 몰래 보내어 나를 수치스럽게 만들었습니다. 6. 내가 그녀를 불렀을 때, 나는 또한 내가 술에 취해 그녀와 함께 누워 있을 때 내가 말했던 비밀스러운 말들도 들었습니다. 그리고 그것이 주님에게서 온 일이었기 때문에 나는 그녀를 죽일 수 없었습니다. 7. 내가 생각하기를, 「아마도 그녀가 다른 이에게서 담보를 받은 뒤 속임수로 이 일을 했을 것이다.」 하였습니다. 8. 그러나 나는 내 평생 동안 다시는 그녀에게 가까이 가지 않았습니다. 이는 내가 온 이스라엘 가운데서 이 가증한 일을 행했기 때문입니다. 9. 그런데 그 성읍의 사람들은 성문에 앉아 있는 창녀가 있었다고는 말하지 않았습니다. 그녀가 다른 곳에서 와서 성문에 잠시 앉아 있었기 때문입니다. 10. 나는 아무도 내가 그녀에게 들어갔다는 것을 알지 못한다고 생각했습니다. 11. 그 뒤에 우리는 기근 때문에 요셉에게 가려고 이집트로 갔습니다. 12. 그때 나는 마흔여섯 살이었고, 이집트에서 칠십삼 년을 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης / χηρεύουσαν
  english_pob_choice: had been a widow / a widow
  chosen_korean: 과부로 지낸 / 과부
  alternatives_korean:
  - 과부가 된
  - 홀로 된
  lexicon: LSJ
  rationale: 다말의 사회적 상태를 자연스럽게 드러내면서도, 문맥상 핵심인 ‘과부’ 신분을 분명히 살렸습니다.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  english_pob_choice: adorned herself with bridal adornment
  chosen_korean: 결혼식 장식으로 몸을 꾸미고
  alternatives_korean:
  - 신부 장식으로 몸을 꾸미고
  - 혼례용 장식으로 몸을 꾸미고
  lexicon: LSJ
  rationale: 겹말 구조가 의도적으로 꾸민 행위를 강조하므로, ‘결혼식 장식’으로 그 장식성·예식성을 살렸습니다.
- source_word: προκαθεσθαι ἐπὶ ... παρὰ τὴν πύλην
  english_pob_choice: sit there openly for prostitution
  chosen_korean: 공개적으로 음행을 하며 앉아 있는
  alternatives_korean:
  - 거기에서 공개적으로 창녀처럼 앉아 있는
  - 거기에서 음행을 위해 앉아 있는
  lexicon: LSJ
  rationale: πόρνεία 계열의 의미를 직접 드러내되, POB가 살린 공공성(성문 곁에 공개적으로 앉음)을 한국어로 표현했습니다.
- source_word: ἐν δολιότητι / κατῄσχυνέ με
  english_pob_choice: deceitfully / put me to shame
  chosen_korean: 속였습니다 / 나를 수치스럽게 만들었습니다
  alternatives_korean:
  - 간계로 속였습니다
  - 나를 부끄럽게 했습니다
  lexicon: LSJ
  rationale: 첫 표현은 기만의 성격을, 둘째는 공적 수치의 결과를 보존하는 방향으로 옮겼습니다.
- source_word: παρὰ Κυρίου ἦν
  english_pob_choice: because it was from the Lord
  chosen_korean: 주님에게서 온 일이었기 때문에
  alternatives_korean:
  - 주님에게서 비롯된 일이었기 때문에
  - 주님의 뜻이었기 때문에
  lexicon: LSJ
  rationale: 사건에 대한 신적 섭리 귀속은 유지하되, 승인 여부는 단정하지 않도록 여지를 남겼습니다.
theological_decisions:
- issue: v. 6의 παρὰ Κυρίου ἦν 해석
  chosen_reading: 주님에게서 온 일이었기 때문에
  alternative_readings:
  - 주님의 뜻이었기 때문에
  - 주님의 손에서 비롯된 일이었기 때문에
  rationale: 본문은 사건의 결과를 주님께 돌리지만, 그 의미가 곧바로 윤리적 승인인지 섭리적 허용인지는 분명히 말하지 않습니다. 번역도 그 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: v. 9의 person-term과 practice-term 구분
  chosen_reading: 창녀 / 음행
  alternative_readings:
  - prostitute / prostitution를 모두 ‘창녀’로 처리
  - 음녀 / 음행
  rationale: 그리스어 본문은 사람을 가리키는 표현과 행위를 가리키는 표현을 구별합니다. 한국어도 그 구별을 살려 문맥의 논지를 보존했습니다.
  doctrine_reference: PHILOSOPHY.md §Maintain source distinctions when meaningful
