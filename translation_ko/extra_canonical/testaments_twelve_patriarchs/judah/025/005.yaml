revisions:
- from: 그리고 요셉의 사슴들은 기쁨으로 달릴 것이며, 이스라엘의 독수리들은 즐거움 가운데 날아오를 것입니다. 그리고 모든 민족은 주님을 영원히 찬양할 것입니다.[a]
  to: 야곱의 사슴들은 환희 속에서 달릴 것이며, 이스라엘의 독수리들은 기뻐하며 날 것입니다.[a] 모든 민족은 영원토록 주님께 영광을 돌릴 것입니다.
  rationale: 원어 α-본문의 Ἰακώβ를 따라 ‘요셉’을 ‘야곱’으로 수정했습니다. 또한 누락된 각주를 실제 본문비평 각주로 보완하여 대괄호 처리된 유동 절을 독자에게 알렸습니다. 나머지 비유적 표현과 미래 시제, ‘모든 민족’의 범위는 유지하되, δοξάζω는 ‘주님께 영광을 돌리다’로 더 가깝게 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:08Z'
