  verdict: revise
  source_fidelity: 그리스어 α-본문은 ‘야곱의 사슴들’(ἔλαφοι Ἰακώβ)이라고 읽는데, 초안은 영어 POB 감사 이력의 ‘Joseph’를 따라 ‘요셉’으로 옮겼습니다. 원어 우선 원칙상 ‘야곱’으로 바로잡아야 합니다. 대괄호로 제시된 ‘경건하지 않은 자들…죄인들…’ 절은 제공된 확정 영어 본문에서 제외되어 있고 본문비평적으로 유동적인 구절로 표시되어 있으므로, 주본문에는 넣지 않고 각주로 처리하는 것이 안전합니다.
  naturalness: ‘즐거움 가운데 날아오를 것입니다’도 이해되지만, ‘기뻐하며 날 것입니다’가 현대 표준 한국어에서 더 자연스럽고 χαρᾷ의 부사적 용법을 잘 살립니다. ἀγαλλιάσει는 ‘환희 속에서’로 옮겨 χαρά와의 어감을 어느 정도 구별했습니다.
  terminology: δοξάσουσι Κύριον은 단순히 ‘찬양하다’보다 ‘주님께 영광을 돌리다’가 δοξάζω의 핵심 의미를 더 직접적으로 반영합니다. λαοί는 ‘모든 민족’으로 유지할 수 있습니다.
