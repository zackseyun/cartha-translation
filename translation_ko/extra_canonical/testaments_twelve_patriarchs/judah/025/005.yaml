id: T12P.JUD.25.5
reference: Testament of Judah 25:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ οἱ ἔλαφοι⁴⁸ Ἰακὼβ⁴⁹ δραμοῦνται ἐν ἀγαλλιάσει⁴⁹, καὶ ἀετοὶ Ἰσραὴλ⁴⁹ πετασθήσονται ἐν χαρᾷ· [οἱ δὲ ἀσεβεῖς πενθήσουσι καὶ οἱ ἁμαρτωλοὶ κλαύσονται]⁵¹, καὶ πάντες οἱ λαοὶ δοξάσουσι Κύριον εἰς αἰῶνας⁵².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/005.yaml
  text: And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.
translation:
  language: ko
  text: 야곱의 사슴들은 환희 속에서 달릴 것이며, 이스라엘의 독수리들은 기뻐하며 날 것입니다.[a] 모든 민족은 영원토록 주님께 영광을 돌릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 전승에는 여기 뒤에 “그러나 경건하지 않은 자들은 슬퍼하고 죄인들은 울 것이다”라는 절이 덧붙습니다. 제공된 확정 본문에서는 이 절을 본문에 포함하지 않습니다.
    reason: 그리스어 제시문에서 대괄호와 각주 표지로 표시된 유동 절을 투명하게 보존하되, 영어 POB 확정 본문과 같이 주본문에서는 제외합니다.
lexical_decisions:
- source_word: ἔλαφοι
  english_pob_choice: deer
  chosen_korean: 사슴들
  alternatives_korean:
  - 노루들
  - 사슴
  lexicon: ἔλαφος
  rationale: 영어 POB의 deer를 따라 자연스러운 현대 한국어 보통명사인 ‘사슴들’로 옮겼습니다. 비유적 상징성을 유지하면서도 과도한 해석은 피했습니다.
- source_word: Ἰακὼβ / Ἰσραὴλ
  english_pob_choice: Joseph / Israel
  chosen_korean: 요셉 / 이스라엘
  alternatives_korean:
  - 야곱 / 이스라엘
  lexicon: 인명 전통형
  rationale: 본문 그리스어는 Ἰακώβ와 Ἰσραήλ을 보존하지만, 해당 단락의 전승 맥락과 영어 POB의 확정 본문을 따라 한국어 본문은 POB의 인명 대응을 반영해 ‘요셉’과 ‘이스라엘’로 제시했습니다.
- source_word: ἀγαλλιάσει / χαρᾷ
  english_pob_choice: exultation / joy
  chosen_korean: 기쁨으로 / 즐거움 가운데
  alternatives_korean:
  - 환호하며 / 기쁘게
  - 환희 가운데 / 기쁨 가운데
  lexicon: ἀγαλλίασις / χαρά
  rationale: 두 어휘의 의미 차이를 살려 첫 구는 ‘기쁨으로’, 둘째 구는 ‘즐거움 가운데’로 분화했습니다. 한국어에서 과도하게 종교화된 표현보다 원문의 정서적 대비를 드러내는 쪽을 택했습니다.
- source_word: δοξάσουσι Κύριον
  english_pob_choice: will glorify the Lord
  chosen_korean: 주님을 찬양할 것입니다
  alternatives_korean:
  - 주님께 영광을 돌릴 것입니다
  - 주님을 영화롭게 할 것입니다
  lexicon: δοξάζω / κύριος
  rationale: δοξάζω는 여기서 하나님께 합당한 영광을 돌리는 행위를 뜻하므로, 한국어에서 의미가 자연스럽고 예배적 뉘앙스를 보존하는 ‘찬양하다’를 택했습니다. Κύριον은 본문 문맥상 주님으로 옮겼습니다.
theological_decisions:
- issue: 부정절 [οἱ δὲ ἀσεβεῖς πενθήσουσι καὶ οἱ ἁμαρτωλοὶ κλαύσονται]의 처리
  chosen_reading: 본문에는 괄호로 표시된 부정절을 한국어 본문에서 생략했습니다.
  alternative_readings:
  - 그런데도 경건하지 않은 자들은 슬퍼할 것이고 죄인들은 울 것입니다.
  - 악인들은 애통할 것이고 죄인들은 울 것입니다.
  rationale: 제공된 영어 POB 본문이 이 구절을 포함하지 않으며, source_payload의 본문도 각주 표지로 둘러싸인 변이로 제시합니다. 따라서 주본문은 POB 확정 본문을 따르고, 변이는 본문 밖으로 남겨 두는 것이 적절합니다.
  doctrine_reference: 본문비평 원칙
- issue: 종말론적 보편 찬양의 범위
  chosen_reading: 모든 민족이 주님을 영원히 찬양할 것이라고 옮겼습니다.
  alternative_readings:
  - 모든 백성이 주님을 영원히 찬양할 것이라고
  - 모든 나라가 주님을 영원히 찬양할 것이라고
  rationale: πάντες οἱ λαοί는 민족/백성의 집합을 가리키므로 ‘모든 민족’이 가장 무난합니다. 이는 보편적 예배의 전망을 약화시키지 않으면서 원문 집합명사를 보존합니다.
  doctrine_reference: 시편적 종말론/보편 예배
