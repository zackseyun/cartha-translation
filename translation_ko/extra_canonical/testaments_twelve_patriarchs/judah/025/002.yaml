base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/002.yaml
  text: And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.
translation:
  language: ko
  text: 그리고 주님께서 레위를 축복하셨습니다. 하지만 얼굴의 천사는 저를 축복했습니다. 영광의 능력들은 시므온을, 하늘은 르우벤을, 땅은 잇사갈을, 바다는 스불론을, 산들은 요셉을, 장막은 베냐민을, 빛들은 단을, 기쁨은 납달리를, 해는 갓을, 달은 아셀을 축복했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  lexicon: κύριος
  rationale: 문맥상 야훼를 가리키는 주어로 보이지만, 본문이 직접적인 구약 인용 형식은 아니므로 여기서는 POB의 일반 용례에 따라 ‘주님’으로 자연스럽게 살렸습니다.
- source_word: ὁ ἄγγελος τοῦ προσώπου
  english_pob_choice: the angel of the presence
  chosen_korean: 얼굴의 천사
  alternatives_korean:
  - 임재의 천사
  - 면전의 천사
  lexicon: ἄγγελος / πρόσωπον
  rationale: 직역에 가깝게 ‘얼굴의 천사’로 옮겨, 신비적 명칭의 낯섦과 원문의 표현력을 유지했습니다.
- source_word: αἱ δυνάμεις τῆς δόξης
  english_pob_choice: the powers of glory
  chosen_korean: 영광의 능력들
  alternatives_korean:
  - 영광의 권능들
  - 영광의 군세
  lexicon: δύναμις / δόξα
  rationale: 복수형 δυναμεις를 살려 ‘능력들’로 했고, δόξα는 문맥상 ‘영광’이 가장 직접적이어서 결합형으로 번역했습니다.
- source_word: τὰ ὄρη / ἡ τρυφή / αἱ φωστῆρες
  english_pob_choice: the mountains / delight / the lights
  chosen_korean: 산들은 / 기쁨은 / 빛들은
  alternatives_korean:
  - 산들
  - 즐거움은
  - 광명들은
  lexicon: ὄρος / τρυφή / φωστήρ
  rationale: POB의 나열 구조를 따라 각 자연물·추상명사의 대응을 유지했습니다. τρυφή는 ‘기쁨’보다 ‘향락’도 가능하지만, 여기서는 문맥상 축복의 대상 이름들을 배열하는 시적 장치이므로 덜 부정적인 ‘기쁨’으로 번역했습니다.
- source_word: ἡ σελήνη
  english_pob_choice: the moon
  chosen_korean: 달은
  alternatives_korean:
  - 월은
  - 달
  lexicon: σελήνη
  rationale: 현대 한국어에서 가장 자연스러운 표준 표현인 ‘달’을 택했습니다.
theological_decisions:
- issue: 축복의 주체를 둘러싼 병렬 구조
  chosen_reading: 첫 절반은 주님과 ‘얼굴의 천사’가 레위를 축복하는 구조로, 뒤의 열거는 각 피조물/천체가 다른 족장들을 축복하는 시적 병렬로 유지했습니다.
  alternative_readings:
  - 모든 주어를 단순한 은유적 호칭으로 평탄화하는 읽기
  rationale: 원문은 축복하는 주체를 항목별로 분리하여 나열하므로, 이를 평면화하지 않고 병렬 구조를 그대로 드러내는 것이 본문의 사유 흐름을 가장 잘 보존합니다.
  doctrine_reference: 시적-묵시적 축복 열거 구조
