  revision_rationale: 제공된 그리스어 α-열 본문을 우선하여 영어 POB에만 있는 수혜자 및 축복 주체들을 삭제했습니다. 명시된 병렬 구조와 생략된 ‘축복하다’를 한국어 문장에 최소한으로 보충하되, ‘땅’ 및 ‘바다-요셉’ 구문의 불완전성은 본문 대시와 주석으로 보존했습니다.
