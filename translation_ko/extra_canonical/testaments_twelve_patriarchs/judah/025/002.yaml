  text: '*Καὶ¹² Κύριος εὐλόγησε¹⁴ τὸν Λευί¹⁵, *ὁ ἄγγελος τοῦ προσώπου ἐμέ¹⁶, *αἱ δυνάμεις¹⁷ τῆς δόξης τὸν Συμεών¹⁹, ὁ οὐρανὸς²⁰ τὸν Ῥουβίμ²¹, ἡ γῆ²², τὴν θάλασσαν²⁴ τὸν Ἰωσήφ, αἱ φωστῆρες²⁵ τὸν Δάν²⁶, ἡ τρυφὴ²⁷ τὸν Νεφθαλείμ²⁸, ὁ ἥλιος²⁹ τὸν Γάδ³⁰, ἡ σελήνη³⁰ τὸν Ἀσήρ.'
