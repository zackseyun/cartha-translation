review_pass:
  verdict: revise
  source_fidelity: 원문은 ‘슬픔 속에 죽은 이들이 일어날 것이다’(ἐν λύπῃ τελευτήσαντες ἀναστήσονται)라고 할 뿐, 그들이 ‘기쁨 속에’ 일어날 것이라는 표현은 포함하지 않습니다. 이는 영어 POB 문안에 있으나, 제시된 그리스어 본문으로는 뒷받침되지 않습니다. 나머지 병렬 구조와 διὰ Κύριον의 반복은 대체로 충실하게 반영되었습니다.
  naturalness: 수정 후 문장은 현대 표준 한국어 합쇼체로 자연스럽고, 세 병렬 절의 운율도 유지합니다. ‘생명으로 깨어날 것입니다’는 εἰς ζωήν의 방향·결과를 간결히 살린 표현입니다.
  terminology: ‘주’는 Κύριον에 적절하며, ‘일어나다’와 ‘깨어나다’는 각각 ἀναστήσονται와 ἐξυπνισθήσονται의 서로 다른 이미지를 보존합니다. ‘부하게 되다’는 πλουτισθήσονται의 수동적 의미를 무리 없이 전달합니다.
  issues:
  - severity: high
    issue: ‘기쁨 속에’가 원문에 없는 내용을 첨가합니다.
    rationale: 그리스어에는 ἐν λύπῃ(‘슬픔 속에’)만 있으며, ‘기쁨’ 또는 그에 상응하는 어휘가 없습니다. 영어 POB의 ‘in joy’도 제공된 원문과 일치하지 않으므로 한국어 번역에 유지할 수 없습니다.
  revised_text: 슬픔 속에 죽은 이들은 일어날 것이며, 주 때문에 가난한 이들은 부하게 될 것이며, 주 때문에 죽어 가는 이들은 생명으로 깨어날 것입니다.
