id: T12P.JUD.25.4
reference: Testament of Judah 25:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ³⁹ ἐν λύπῃ τελευτήσαντες ἀναστήσονται ⁴⁰καὶ οἱ πτωχοὶ⁴¹ διὰ Κύριον⁴³ πλουτισθήσονται⁴⁴ καὶ⁴⁴ οἱ ἀποθνήσκοντες διὰ Κύριον⁴⁵ ἐξυπνισθήσονται⁴⁶ εἰς ζωήν⁴⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/004.yaml
  text: And those who died in sorrow will rise in joy, and the poor because of the Lord will be made rich, and those dying because of the Lord will awake to life.
translation:
  language: ko
  text: 슬픔 속에 죽은 이들은 일어날 것이며, 주 때문에 가난한 이들은 부하게 될 것이며, 주 때문에 죽어 가는 이들은 생명으로 깨어날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λύπῃ τελευτήσαντες
  english_pob_choice: those who died in sorrow
  chosen_korean: 슬픔 속에 죽은 이들
  alternatives_korean:
  - 슬픔 가운데 죽은 이들
  - 슬퍼하며 죽은 이들
  lexicon: λύπη
  rationale: ἐν λύπῃ를 상태를 나타내는 표현으로 읽어, ‘슬픔 속에’로 자연스럽게 옮겼습니다. τελευτήσαντες는 단순한 ‘죽은’으로 처리해 과도한 해석을 피했습니다.
- source_word: ἀναστήσονται
  english_pob_choice: will rise
  chosen_korean: 일어날 것입니다
  alternatives_korean:
  - 다시 살아날 것입니다
  - 부활할 것입니다
  lexicon: ἀνίστημι
  rationale: 문맥상 부활을 가리키지만, 동사 자체의 핵심 이미지를 살려 ‘일어날 것입니다’로 옮겼습니다.
- source_word: διὰ Κύριον
  english_pob_choice: because of the Lord
  chosen_korean: 주 때문에
  alternatives_korean:
  - 주로 인해
  - 주를 위해
  lexicon: διά + accusative
  rationale: English POB의 ‘because of the Lord’를 반영하면서도, 원문의 인과·근거 의미를 한국어에서 가장 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: πλουτισθήσονται
  english_pob_choice: will be made rich
  chosen_korean: 부하게 될 것입니다
  alternatives_korean:
  - 부유하게 될 것입니다
  - 풍족해질 것입니다
  lexicon: πλουτίζω
  rationale: 물질적 축복에만 제한하지 않도록 ‘부하게 될 것입니다’로 넓게 옮겼습니다.
- source_word: ἐξυπνισθήσονται εἰς ζωήν
  english_pob_choice: will awake to life
  chosen_korean: 생명으로 깨어날 것입니다
  alternatives_korean:
  - 생명에 깨어날 것입니다
  - 생명 가운데 깨어날 것입니다
  lexicon: ἐξυπνίζω
  rationale: ‘깨다’의 동사 이미지를 유지하면서, εἰς ζωήν의 도착점을 ‘생명으로’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 두 번 반복되는 διὰ Κύριον의 의미
  chosen_reading: ‘주 때문에’로 동일하게 유지하여, 주와의 관련성/원인을 반복적으로 강조하는 구조를 드러냈습니다.
  alternative_readings:
  - 주를 위하여
  - 주를 위해
  rationale: English POB가 두 절 모두 ‘because of the Lord’로 정리한 해석을 따르되, 한국어에서는 ‘때문에’가 인과 관계를 가장 सीधे하게 드러냅니다.
  doctrine_reference: 순교/고난 보상 모티프
- issue: ἀναστήσονται와 ἐξυπνισθήσονται의 종말론적 이미지
  chosen_reading: 두 동사를 모두 직접적인 부활·각성의 이미지로 살리되, 문장 전체는 과도하게 교리화하지 않았습니다.
  alternative_readings:
  - 부활할 것입니다
  - 다시 깨어날 것입니다
  rationale: 원문은 부활과 생명 회복의 병렬을 제시하므로, 해설적 확장을 피하고 동사 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 부활과 생명 회복
