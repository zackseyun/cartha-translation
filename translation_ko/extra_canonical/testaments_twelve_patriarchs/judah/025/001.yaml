id: T12P.JUD.25.1
reference: Testament of Judah 25:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXV. Καὶ¹ μετὰ ταῦτα *ἀναστήσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ εἰς ζωήν², *καὶ ἐγὼ καὶ οἱ ἀδελφοί μου ἔξαρχοι³ *ἐν Ἰσραὴλ ἐσόμεθα⁵, πρῶτος Λευί⁶, δεύτερος ἐγώ⁷, τρίτος Ἰωσήφ⁸, τέταρτος Βενιαμίν⁹, *πέμπτος Συμεών, ἕκτος Ἰσαχάρ¹⁰, καὶ¹² *πάντες καθεξῆς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/001.yaml
  text: 'And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be rulers of scepters in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and thus all the rest in order.'
translation:
  language: ko
  text: 그리고 이 일들 뒤에 아브라함과 이삭과 야곱이 생명으로 일어날 것입니다. 그리고 나와 내 형제들은 이스라엘에서 홀을 다스리는 통치자들이 될 것입니다. 레위가 첫째, 나는 둘째, 요셉이 셋째, 베냐민이 넷째, 시므온이 다섯째, 이사갈이 여섯째, 그리고 그 뒤의 모든 이들도 차례대로 그러할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after these things
  chosen_korean: 이 일들 뒤에
  alternatives_korean:
  - 그 후에
  - 이후에
  lexicon: μετά + ταῦτα
  rationale: 사건의 순서를 자연스럽게 드러내면서도 원문의 지시적 뉘앙스를 유지하기 위해 ‘이 일들 뒤에’로 옮겼습니다.
- source_word: ἀναστήσεται ... εἰς ζωήν
  english_pob_choice: will rise to life
  chosen_korean: 생명으로 일어날 것입니다
  alternatives_korean:
  - 다시 살아날 것입니다
  - 생명에 들어올 것입니다
  lexicon: ἀνίστημι + εἰς ζωήν
  rationale: 단순한 ‘부활’이라는 교회적 요약어보다, 원문의 ‘일어남’과 ‘생명으로’의 방향성을 함께 살렸습니다.
- source_word: ἔξαρχοι σκήπτρων
  english_pob_choice: rulers of scepters
  chosen_korean: 홀을 다스리는 통치자들
  alternatives_korean:
  - 홀이 있는 통치자들
  - 왕홀의 우두머리들
  - 홀의 통치자들
  lexicon: ἔξαρχος + σκήπτρον
  rationale: POB가 덧붙이지 않은 ‘tribes’는 넣지 않고, ‘scepters’의 표상을 한국어로 자연스럽게 드러내기 위해 ‘홀을 다스리는 통치자들’로 옮겼습니다.
- source_word: πάντες καθεξῆς
  english_pob_choice: all the rest in order
  chosen_korean: 그 뒤의 모든 이들도 차례대로
  alternatives_korean:
  - 모두 순서대로
  - 나머지 모두도 차례로
  lexicon: πάντες καθεξῆς
  rationale: 열거를 마무리하는 순서감을 유지하되, 한국어에서 더 자연스러운 종결 표현으로 다듬었습니다.
theological_decisions:
- issue: 아브라함·이삭·야곱의 종말론적 생명 회복
  chosen_reading: 미래 시제의 부활/생명 회복 선언으로 옮겼습니다.
  alternative_readings:
  - 상징적 회복 진술로 완화
  - 단순한 내세적 존속으로 축소
  rationale: 본문은 세 족장의 실제적 ‘일어남’과 ‘생명’을 말하므로, 그 강도를 약화하지 않고 보존했습니다.
  doctrine_reference: 종말론/부활 표현
