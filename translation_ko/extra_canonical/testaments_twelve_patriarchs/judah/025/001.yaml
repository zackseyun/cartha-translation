review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 제시된 그리스어 본문은 ἔξαρχοι ἐν Ἰσραήλ(‘이스라엘에서 지도자들’)이라고 읽으며, ‘홀/왕홀’(σκήπτρων)은 포함하지 않습니다. 따라서 영어 POB의 ‘rulers of scepters’도 제공된 원문과 일치하지 않고, 초안의 ‘홀을 다스리는 통치자들’ 역시 근거 없이 홀의 개념을 추가합니다. ἀναστήσεται … εἰς ζωήν은 생명에 이르는 일어남/살아남을 가리키므로 이를 보존했습니다.
  naturalness: ‘생명으로 일어날 것입니다’는 한국어에서 다소 직역투이므로 ‘생명에 이르도록 일어날 것입니다’로 다듬었습니다. 열거의 마지막도 ‘그 밖의 모든 이도 차례대로 그러할 것입니다’로 하여, 앞의 서열 진술이 나머지에게도 이어짐을 자연스럽게 나타냈습니다.
  terminology: 고유명사는 아브라함, 이삭, 야곱, 레위, 요셉, 베냐민, 시므온, 이사갈로 통일했습니다. ἔξαρχοι는 특정한 부족·왕홀·직분을 보충하지 않고 ‘지도자들’로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘홀을 다스리는 통치자들’
    rationale: 제시된 그리스어에는 σκήπτρων(홀들)이 없고 ἔξαρχοι ἐν Ἰσραήλ만 있습니다. ‘홀’ 및 ‘다스리는’이라는 내용을 첨가하므로 삭제해야 합니다.
  - severity: medium
    issue: ‘생명으로 일어날 것입니다’
    rationale: εἰς ζωήν의 의미 범위는 보존하지만 한국어 결합이 부자연스럽습니다. ‘생명에 이르도록 일어날 것입니다’가 원문의 방향성과 현대 한국어 문체를 함께 살립니다.
  revised_text: 그리고 이 일들 뒤에 아브라함과 이삭과 야곱이 생명에 이르도록 일어날 것입니다. 나와 내 형제들은 이스라엘에서 지도자들이 될 것입니다. 레위가 첫째, 내가 둘째, 요셉이 셋째, 베냐민이 넷째, 시므온이 다섯째, 이사갈이 여섯째이며, 그 밖의 모든 이도 차례대로 그러할 것입니다.
  revised_footnotes: []
  revision_rationale: 제시된 원문을 우선하여, 영어 감사 기록 및 초안에 나타난 ‘홀’의 표현을 제거했습니다. 이는 번역 철학의 차이가 아니라 제공된 그리스어 본문에 없는 어휘·개념을 덧붙인 구조적 의미 오류의 수정입니다. 그 밖에는 미래적 생명 회복과 서열 열거를 그대로 보존했습니다.
