  text: And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.
translation:
  language: ko
  text: 그러면 여러분은 주님의 백성이 되고, 언어는 하나가 될 것입니다. 그곳에는 더 이상 베리알의 속임수의 영이 없을 것이니, 그것이 영원히 불에 던져질 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸν Κυρίου
  english_pob_choice: the Lord’s people
  chosen_korean: 주님의 백성
  alternatives_korean:
  - 주님의 ժողովուրդ
  - 주님의 사람들
  - 주님의 민족
  lexicon: λαός; κύριος
  rationale: λαός는 단순한 ‘사람들’보다 언약적 소속을 드러내므로 ‘백성’이 가장 자연스럽습니다. κύριος는 본문 맥락상 주님으로 옮겼습니다.
- source_word: γλῶσσα μία
  english_pob_choice: with one language
  chosen_korean: 언어는 하나
  alternatives_korean:
  - 한 언어로
  - 하나의 말이
  - 말이 하나가 되어
  lexicon: γλῶσσα
  rationale: 직역형 ‘한 언어’도 가능하지만, 문맥상 공동체의 일치를 더 분명히 드러내는 간결한 한국어로 옮겼습니다.
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  english_pob_choice: a spirit of Belial’s deceit
  chosen_korean: 베리알의 속임수의 영
  alternatives_korean:
  - 베리알의 거짓의 영
  - 베리알의 미혹의 영
  - 베리알에게 속한 속임수의 영
  lexicon: πνεῦμα; πλάνη; Βελιάρ
  rationale: πνεῦμα는 문자적으로 ‘영’으로 두고, πλάνη는 본문이 말하는 지속적 유혹/기만을 살려 ‘속임수’로 옮겼습니다. Βελιάρ는 문맥상 고유명사로 처리했습니다.
- source_word: ἐμβληθήσεται εἰς τὸν αἰῶνα
  english_pob_choice: it will be thrown into the fire forever
  chosen_korean: 영원히 불에 던져질 것이기 때문입니다
  alternatives_korean:
  - 영원히 던져질 것이기 때문입니다
  - 영원히 불속에 던져질 것이기 때문입니다
  - 영원토록 불에 던져질 것이기 때문입니다
  lexicon: ἐμβληθήσεται; εἰς τὸν αἰῶνα
  rationale: 영어 POB의 ‘into the fire’는 원문에 직접 없는 해석이지만, 본문 맥락에서 ἀναγνωσ된 종말적 심판 이미지를 반영합니다. 한국어도 이 해석을 따라 ‘불에 던져질’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘주님의 백성’과 공동체적 일치의 종말론적 약속
  chosen_reading: 이 구절은 단순한 민족 통합이 아니라 야훼/주님께 속한 언약 공동체의 회복을 말하는 것으로 읽었습니다.
  alternative_readings:
  - 정치적 통일의 예언
  - 일반적 도덕 개혁의 선언
  rationale: λαὸς Κυρίου와 ‘언어는 하나’의 결합은 소속과 일치를 함께 강조하므로, 종말론적 언약 공동체의 의미를 살리는 번역이 필요합니다.
  doctrine_reference: 언약 공동체 / 종말론적 심판
- issue: ‘베리알의 속임수의 영’의 실재적 악의 인격화
  chosen_reading: πνεῦμα πλάνης τοῦ Βελιάρ는 추상적 ‘거짓’이 아니라 베리알에게 속한 미혹의 영으로 이해했습니다.
  alternative_readings:
  - 단순한 거짓말의 경향
  - 비유적 표현으로서의 악습
  rationale: 원문은 ‘영’을 분명히 말하므로, 이를 비유로 약화시키지 않고 악의 인격적/영적 실재를 드러내도록 옮겼습니다.
  doctrine_reference: 영적 전쟁 / 악의 영
