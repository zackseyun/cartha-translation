translation:
  language: ko
  text: 주께서 그들 사이에 서로 대립하는 분열을 일으키실 것이며, 이스라엘에는 끊임없는 전쟁이 있을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: The Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 하나님
  lexicon: κύριος
  rationale: 주어가 야훼를 가리키는 호칭이지만, 여기서는 직접적인 인용 표지가 없고 서술문 흐름이므로 간결한 ‘주’로 옮겨 문맥의 엄숙함을 유지했습니다.
- source_word: διαιρέσεις
  english_pob_choice: divisions
  chosen_korean: 분열
  alternatives_korean:
  - 갈라짐
  - 분쟁
  - 분리
  lexicon: διαιρέσεις
  rationale: 단순한 분리보다 관계적·공동체적 균열을 더 분명히 드러내는 ‘분열’이 문맥에 가장 가깝습니다.
- source_word: κατ᾽ ἀλλήλων
  english_pob_choice: among them against one another
  chosen_korean: 서로 대립하는
  alternatives_korean:
  - 서로에게서
  - 서로를 향한
  - 서로 맞서는
  lexicon: κατ᾽ ἀλλήλων
  rationale: 전치사의 상호적 대립성을 살려 ‘서로 대립하는’으로 처리해, 단순 병렬이 아니라 상호 충돌의 뉘앙스를 반영했습니다.
- source_word: συνεχεῖς
  english_pob_choice: continual
  chosen_korean: 끊임없는
  alternatives_korean:
  - 계속되는
  - 지속적인
  - 연속적인
  lexicon: συνεχεῖς
  rationale: 전쟁의 지속성과 반복성을 자연스럽게 드러내는 현대 한국어로 ‘끊임없는’을 택했습니다.
theological_decisions:
- issue: 이스라엘 내부의 분열과 전쟁에 대한 예언적 진술
  chosen_reading: 주께서 그들 사이에 분열을 일으키시고, 그 결과 이스라엘 안에 전쟁이 계속된다는 예언으로 옮겼습니다.
  alternative_readings:
  - 이스라엘 바깥의 외적 침공으로 읽는 번역
  - 단순한 미래 서술로 약화하는 번역
  rationale: 원문은 원인(주께서 일으키심)과 결과(이스라엘의 지속적 전쟁)를 분명히 연결하므로, 이를 인과적으로 드러내는 번역이 가장 충실합니다.
  doctrine_reference: source-level causality in apocalyptic/para-biblical prophecy
