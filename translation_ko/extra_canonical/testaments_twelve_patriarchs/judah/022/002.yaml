  terminology: ‘이방인들’은 ἀλλόφυλοι의 민족적·언약적 타자라는 문맥적 뉘앙스를 보존하는 무난한 선택입니다. ‘나라’는 βασιλεία의 영역적 의미를 반영하며, ‘이스라엘의 구원’은 τὸ σωτήριον τοῦ Ἰσραήλ에 충실합니다.
  issues:
