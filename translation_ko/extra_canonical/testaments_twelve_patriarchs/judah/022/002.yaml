id: T12P.JUD.22.2
reference: Testament of Judah 22:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἐν ἀλλοφύλοις⁵ συντελεσθήσεται ἡ βασιλεία μου⁶, ἕως⁷ τοῦ ἐλθεῖν⁸ τὸ⁹ σωτήριον τοῦ¹⁰ Ἰσραήλ¹⁰,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/002.yaml
  text: And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes,
translation:
  language: ko
  text: 그리고 내 나라가 이방인들 가운데서 끝나게 될 것이나, 이스라엘의 구원이 올 때까지는 그러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀλλοφύλοις
  english_pob_choice: among foreigners
  chosen_korean: 이방인들 가운데서
  alternatives_korean:
  - 외국인들 가운데서
  - 타민족들 가운데서
  lexicon: ἀλλόφυλοι
  rationale: 민족적·언약적 ‘타자’를 가리키는 표현으로, 문맥상 단순한 국적보다 ‘이방인들’이 원문의 대조를 가장 직접적으로 드러냅니다.
- source_word: συντελεσθήσεται
  english_pob_choice: will be brought to an end
  chosen_korean: 끝나게 될 것이나
  alternatives_korean:
  - 종결될 것이나
  - 마감될 것이나
  lexicon: συντελέω
  rationale: 상태나 기간의 종결을 말하는 수동 미래로 읽어, 왕국이 완전히 끝나는 의미를 자연스럽게 살렸습니다.
- source_word: ἡ βασιλεία μου
  english_pob_choice: my kingdom
  chosen_korean: 내 나라
  alternatives_korean:
  - 내 왕국
  - 내 통치
  lexicon: βασιλεία
  rationale: 예언적 문맥에서 지배권보다 ‘나라’가 한국어 독자에게 더 सीधे하게 전달되며, 왕권의 영역적 의미도 함께 담습니다.
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  english_pob_choice: the salvation of Israel
  chosen_korean: 이스라엘의 구원
  alternatives_korean:
  - 이스라엘의 구출
  - 이스라엘의 구제
  lexicon: σωτήριον
  rationale: σωτήριον은 ‘구원/구출’ 계열이 가능하지만, English POB의 ‘salvation’을 따라 종말론적 구원의 성격을 보존했습니다.
theological_decisions:
- issue: ‘나라’의 종결과 ‘이스라엘의 구원’의 도래 사이의 시간표
  chosen_reading: 왕국의 종결은 이방인들 가운데서 일어나지만, 그 종결은 이스라엘의 구원이 올 때까지 유보된다는 의미로 옮겼습니다.
  alternative_readings:
  - ‘…끝나게 되며, 이스라엘의 구원이 올 때까지’로 더 단정하게 옮길 수 있음
  - ‘…마침내 끝날 것이며’처럼 문장을 더 서술적으로 만들 수 있음
  rationale: 원문은 두 사건을 대비하며 종결의 시점이 구원의 도래와 연결됨을 말하므로, 종속절의 긴장감을 유지했습니다.
  doctrine_reference: 종말론적 예언의 시간표를 단정적으로 확정하지 않고 원문의 조건부/대기 구조를 보존
