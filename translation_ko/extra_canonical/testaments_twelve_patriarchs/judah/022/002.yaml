  source_fidelity: 원문의 미래 수동형 συντελεσθήσεται는 ‘끝나게 될 것입니다’로 적절히 반영할 수 있으며, ἐν ἀλλοφύλοις와 ἕως τοῦ ἐλθεῖν의 시간적 한계도 유지해야 합니다. 초안의 ‘것이나’는 원문에 없는 역접을 더하고, ‘그러합니다’는 원문에 없는 서술을 보태어 절의 관계를 흐립니다.
