  text: 1[a]. And on the next day we went to Areta, a city still mighty and strong, threatening us with death. 2. But I and Gad attacked from the east of the city, and Reuben and Levi from the west. 3. And those on the wall, thinking that we were alone[b], were drawn out toward us. 4. So my brothers secretly, from both sides of the wall, climbed it with stakes and entered the city without their knowing it. 5. And we took it by the edge of the sword, and those who had fled for refuge in the towers we burned with fire; and so we captured them all. 6. And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue. 7. And we killed them also, and burned the city[c], and everything in it.
  footnotes:
  - marker: a
    text: Verse 4 has textual variation. Some witnesses give a shorter form, simply saying that Judah's brothers entered the city from both sides of the wall; others more explicitly mention stakes or pegs used to scale it.
    reason: textual_variant
  - marker: b
    text: Verse 5 varies between 'those in the tower' and 'those who fled to the wall/towers.' The main text follows the sense that the defenders took refuge in fortified positions before being burned out.
    reason: textual_variant
  - marker: c
    text: Verse 6 reads Thapphoue in the main line here, but another witness gives Bathoue as the place-name.
    reason: textual_variant
translation:
  language: ko
  text: 1. 이튿날 우리는 아직도 강하고 견고하여 우리에게 죽음을 위협하는 아레타로 갔습니다. 2. 나는 갓과 함께 성의 동쪽에서 공격했고, 르우벤과 레위는 서쪽에서 공격했습니다. 3. 성벽 위에 있던 자들은 우리가 혼자라고 생각하고 우리 쪽으로 끌려 나왔습니다. 4. 그래서 내 형제들은 성벽의 양쪽에서 몰래, 말뚝을 이용해 그 성벽을 올라갔고 그들이 알지 못하는 사이에 성 안으로 들어갔습니다. 5. 우리는 칼날로 그것을 점령했고, 탑으로 피신한 자들은 불로 태웠으며, 그렇게 해서 그들 모두와 그들의 모든 것을 사로잡았습니다. 6. 그런데 우리가 떠날 때 타푸에 사람들은 우리 포로들을 덮쳤고, 우리는 그들을 우리 아들들에게 넘겨준 뒤 타푸에까지 그들과 전투를 벌였습니다. 7. 우리는 그들도 죽이고 그 성과 그 안에 있는 모든 것을 불살랐습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κραταιάν / ἰσχυράν
  english_pob_choice: mighty and strong
  chosen_korean: 강하고 견고하여
  alternatives_korean:
  - 크고 강한
  - 막강한
  lexicon: LSJ
  rationale: 성의 위협적인 성격을 두 겹의 형용사로 살리되, 한국어에서는 의미가 자연스럽게 겹치도록 ‘강하고 견고하여’로 옮겼습니다.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  english_pob_choice: threatening us with death
  chosen_korean: 우리에게 죽음을 위협하는
  alternatives_korean:
  - 우리에게 죽음을 내세우는
  - 우리 목숨을 위협하는
  lexicon: LSJ
  rationale: 적대적 현재분사의 동작을 유지하면서, 죽음이라는 직접 목적어를 앞세워 원문의 긴박함을 살렸습니다.
- source_word: προσέφθημεν
  english_pob_choice: attacked
  chosen_korean: 공격했고
  alternatives_korean:
  - 쳐들어갔고
  - 진격했고
  lexicon: LSJ
  rationale: 군사적 맥락에서 단순한 접근이 아니라 실제 공격을 뜻하므로, 가장 직접적인 동사로 옮겼습니다.
- source_word: ἐν στόματι μαχαίρας
  english_pob_choice: by the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼끝으로
  lexicon: LSJ
  rationale: 관용구의 전투적 의미를 살리면서 한국어에서 자연스럽게 읽히는 표현으로 정리했습니다.
- source_word: αἰχμαλωσία
  english_pob_choice: captives
  chosen_korean: 포로들
  alternatives_korean:
  - 사로잡힌 자들
  - 전쟁 포로들
  lexicon: LSJ
  rationale: 여기서는 추상명사 ‘포로 상태’가 아니라 전쟁 중 붙잡힌 사람들을 가리키므로 ‘포로들’이 적절합니다.
theological_decisions:
- issue: 4절의 성벽 돌파 방식과 본문 변이
  chosen_reading: 본문의 더 긴 독법을 따라, 형제들이 말뚝을 이용해 성벽을 올라가 몰래 들어간 것으로 옮겼습니다.
  alternative_readings:
  - 단순히 성벽 양쪽에서 들어갔다는 짧은 독법
  - 말뚝의 구체적 사용을 덜 분명하게 보는 독법
  rationale: 본문 전승이 세부에서 갈리지만, 모두 은밀한 성벽 침입이라는 큰 뜻은 같으므로 더 풍부한 전승을 본문에 반영했습니다.
  doctrine_reference: 본문 변이를 조화시키지 않고, 가능한 한 원전의 구체성을 보존합니다.
- issue: 6절의 지명 전승
  chosen_reading: 주본문의 타푸에를 따라 옮기고, 다른 전승의 지명은 본문 밖에서 처리합니다.
  alternative_readings:
  - 바투에라는 다른 지명 전승
  - 지명 불확실성을 본문에 더 직접적으로 드러내는 독법
  rationale: 주본문이 제시하는 지명을 유지하되, 변이 가능성은 주석으로 투명하게 남기는 편이 원전 우선 원칙에 맞습니다.
  doctrine_reference: 원문 우선과 전승 투명성
