  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἀνθ᾽ ὧν ἐπάξει²⁵ Κύριος ἐφ᾽ ὑμᾶς²⁶ λιμὸν καὶ λοιμόν¹⁹, θάνατον καὶ ῥομφαίαν, ἐκδικοῦσαν²⁰, πολιορκίαν, καὶ κύνας εἰς διασπασμόν²⁰, καὶ ἐχθρῶν ὀνειδισμοὺς²², καὶ ἀπώλειαν²² ἐχθρῶν, καὶ²⁴ σφακελισμὸν *ὀφθαλμῶν²⁴, καὶ νηπίων ἀναιρέσεις²⁵, *ὑπαρχόντων ἁρπαγὴν²⁶, ναῶν θεοῦ ἐμπρησμόν²⁹, γῆς ἐρήμωσιν²⁹, ὑμῶν δὲ αὐτῶν³⁰ δουλείαν ἐν ἔθνεσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/003.yaml
  text: Because of these things the Lord will bring upon you famine and pestilence, death and the avenging sword, siege, and the reproaches of enemies and friends. By foreigners my kingdom will be brought to an end.
translation:
  language: ko
  text: 이러한 일들 때문에 주께서 여러분에게 기근과 전염병, 죽음과 보복의 칼, 포위와 적들의 조롱과 친구들의 조롱을 가져오실 것입니다. 이방인들에 의해 내 왕국은 끝장날 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 하나님
  lexicon: κύριος
  rationale: 문맥상 심판을 내리시는 주체를 가리키므로 신적 호칭인 주를 사용했습니다. 대화체가 아닌 예언적 선언이어서 주님보다 간결한 주가 적절합니다.
- source_word: λιμὸν καὶ λοιμόν
  english_pob_choice: famine and pestilence
  chosen_korean: 기근과 전염병
  alternatives_korean:
  - 기근과 역병
  - 기근과 재앙
  lexicon: λιμός / λοιμός
  rationale: λιμός는 기근, λοιμός는 전염병·역병이 기본 뜻이므로 POB의 의미를 따라 직역했습니다.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  english_pob_choice: the avenging sword
  chosen_korean: 보복의 칼
  alternatives_korean:
  - 응징하는 칼
  - 원수 갚는 칼
  lexicon: ῥομφαία / ἐκδικέω
  rationale: 칼 자체보다 ‘보복/응징하는’ 성격이 핵심이므로, 형용적 의미를 살려 보복의 칼로 옮겼습니다.
- source_word: ὑμῶν δὲ αὐτῶν δουλείαν ἐν ἔθνεσι
  english_pob_choice: By foreigners my kingdom will be brought to an end
  chosen_korean: 이방인들에 의해 내 왕국은 끝장날 것입니다
  alternatives_korean:
  - 여러분 자신이 이방 민족들 가운데 종살이하게 될 것입니다
  - 여러분은 민족들 가운데 노예가 될 것입니다
  lexicon: δουλεία / ἐν ἔθνεσι
  rationale: 원문은 ‘너희 자신이 여러 민족들 가운데 종살이/노예 상태에 놓임’이라는 내용이지만, 인용된 영어 POB가 왕국의 종말로 풀어 읽었으므로 그 audit trail을 반영해 자연스럽게 옮기되, 원문의 강한 포로·종속 뉘앙스는 완전히 지우지 않도록 이방인들에 의해 끝장난다고 표현했습니다.
theological_decisions:
- issue: 심판 주체의 호칭과 예언적 선언 톤
  chosen_reading: 주께서 여러분에게 … 가져오실 것입니다
  alternative_readings:
  - 하나님께서 … 가져오실 것입니다
  - 주님께서 … 가져오실 것입니다
  rationale: 원문이 직접적인 심판 선언이므로 격식을 유지한 합쇼체로 번역하고, 주체는 κύριος의 신적 권위를 드러내는 주로 처리했습니다.
  doctrine_reference: 예언적 경고문의 직접 화법과 신적 주권 표현
- issue: δουλεία ἐν ἔθνεσι의 처리
  chosen_reading: 이방인들에 의해 내 왕국은 끝장날 것입니다
  alternative_readings:
  - 여러 민족들 가운데서 종살이하게 될 것입니다
  - 이방 민족들 가운데서 노예가 될 것입니다
  rationale: 본문 자체는 포로/종속 상태를 가리키지만, 제공된 영어 POB는 이를 왕국의 종말로 요약하므로 번역은 그 읽기를 우선 반영했습니다. 다만 한국어에서는 멸망의 결과를 드러내는 표현으로 원문의 역사적 굴욕감을 보존했습니다.
  doctrine_reference: 텍스트 전승의 요약 번역과 본문 의미의 긴장
