id: T12P.JUD.23.1
reference: Testament of Judah 23:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*ἕως τῆς¹¹ παρουσίας Θεοῦ¹² τῆς δικαιοσύνης¹³, *τοῦ ἡσυχάσαι τὸν¹⁴ Ἰακὼβ¹⁵ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη¹⁴. 3. Καὶ αὐτὸς φυλάξει κράτος¹⁵ τῆς βασιλείας μου¹⁶ ἕως¹⁷ αἰῶνος¹⁸· ὅρκῳ γὰρ ὤμοσέ¹⁹ μοι Κύριος μὴ ἐξαλείψειν²⁰ τὸ βασίλειον ἐκ τοῦ σπέρματός μου ἕως αἰῶνος²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/001.yaml
  text: Until the coming of the God of righteousness, to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me by an oath not to blot out the kingdom. Much grief is mine, my children, because of the sexual immoralities and sorceries that you will do in the kingdom, following ventriloquists, omens, and deceiving demons.
translation:
  language: ko
  text: 의의 하나님께서 오셔서 야곱과 모든 민족이 평안 가운데 안식하게 하실 때까지입니다. 그분은 내 나라의 권세를 영원히 지키실 것입니다. 주님께서 맹세로 내게 맹세하시어, 내 후손에게서 나라를 영원히 없애 버리지 않겠다고 하셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσίας Θεοῦ τῆς δικαιοσύνης
  english_pob_choice: the coming of the God of righteousness
  chosen_korean: 하나님의 의의 오심
  alternatives_korean:
  - 의의 하나님이 오심
  - 의로우신 하나님의 오심
  lexicon: παρουσία; Θεός; δικαιοσύνη
  rationale: παρουσία는 ‘오심’으로 자연스럽게 옮기고, τῆς δικαιοσύνης는 수식 관계를 살려 ‘하나님의 의’로 읽히는 구조를 반영했습니다.
- source_word: ἡσυχάσαι τὸν Ἰακὼβ ἐν εἰρήνῃ
  english_pob_choice: to give Jacob rest in peace
  chosen_korean: 야곱에게 평안히 쉬게 하시고
  alternatives_korean:
  - 야곱이 평안 가운데 쉬게 하시고
  - 야곱을 평화 속에 쉬게 하시고
  lexicon: ἡσυχάζω; εἰρήνη
  rationale: ἡσυχάσαι의 ‘쉬게 하다/잠잠하게 하다’의 동작성을 살리면서, εἰρήνῃ는 전통적 ‘평강’보다 문맥상 자연스러운 ‘평안’으로 옮겼습니다.
- source_word: πάντα τὰ ἔθνη
  english_pob_choice: all the nations
  chosen_korean: 모든 민족도 그러하게
  alternatives_korean:
  - 모든 민족을
  - 모든 민족들
  lexicon: ἔθνη
  rationale: 앞 절의 목적을 이어 받아, 단순 나열보다 ‘그러하게’로 같은 평안의 상태가 민족들에게도 미친다는 점을 드러냈습니다.
- source_word: κράτος τῆς βασιλείας μου
  english_pob_choice: the might of my kingdom
  chosen_korean: 내 나라의 권세
  alternatives_korean:
  - 내 나라의 힘
  - 내 왕국의 권세
  lexicon: κράτος; βασιλεία
  rationale: κράτος는 단순한 힘보다 ‘권세/강건함’의 의미가 더 가깝고, βασιλεία는 여기서 통치 영역으로서 ‘나라’가 적절합니다.
- source_word: ὅρκῳ γὰρ ὤμοσέ μοι Κύριος
  english_pob_choice: for the Lord swore to me by an oath
  chosen_korean: 이는 주님께서 맹세로 내게 맹세하시어
  alternatives_korean:
  - 이는 주님께서 내게 맹세로 맹세하시어
  - 주님께서 내게 맹세하셨기 때문입니다
  lexicon: Κύριος; ὄρκος; ὀμνύω
  rationale: ὅρκῳ와 ὤμοσεν의 중복을 살려 ‘맹세로 … 맹세하시어’로 옮겨, 단순한 원인절보다 서약의 강한 문체를 반영했습니다.
- source_word: τὸ βασίλειον ἐκ τοῦ σπέρματός μου
  english_pob_choice: the kingdom ... from my seed
  chosen_korean: 나라를 내 씨에서
  alternatives_korean:
  - 왕권을 내 자손에게서
  - 왕국을 내 후손에게서
  lexicon: βασίλειον; σπέρμα
  rationale: σπέρμα는 본문 전통의 혈통/후손 표현을 살려 ‘씨’로 두었고, βασίλειον은 문맥상 ‘나라’가 가장 직접적입니다.
theological_decisions:
- issue: 하나님의 의의 오심이라는 종말론적 표현
  chosen_reading: ‘하나님의 의의 오심’으로 직역에 가깝게 두어, 하나님의 도래가 의와 결부된 소망의 종말론적 선언으로 읽히게 했습니다.
  alternative_readings:
  - ‘의의 하나님이 오심’
  - ‘의로우신 하나님의 오심’
  rationale: 본문의 핵심은 단순한 신적 호칭보다 ‘의’와 ‘오심’의 결합이며, 이를 약화하지 않는 쪽이 원문의 긴장을 더 잘 보존합니다.
  doctrine_reference: 종말론 / 하나님의 임재
- issue: ‘모든 민족도 그러하게’의 보충
  chosen_reading: 야곱의 평안이 모든 민족에게도 확장된다는 의미를 살리기 위해 보충적 연결어를 사용했습니다.
  alternative_readings:
  - 모든 민족도 평안히 쉬게 하시려는 때까지
  - 야곱과 모든 민족이 평안할 때까지
  rationale: 그리스어 병렬 구조를 한국어로 옮길 때 목적절의 흐름을 분명히 해야 하므로, 과도한 해석 없이 연결을 보완했습니다.
  doctrine_reference: 이스라엘과 열방
