    issue: ‘공공의 여자들’은 δημοσίας의 관용적·성적 사회 지시를 현대 한국어에서 전달하지 못합니다.
    rationale: ‘public women’은 영어의 전통적 완곡어법이며, 그리스어 문맥상 공적으로 이용 가능한 여성이라는 뜻을 지녀 매춘을 가리킵니다. ‘매춘부들’이 현대어에서 의미를 명확히 전달합니다.
  - severity: medium
    issue: ‘가증한 일들 가운데 섞이게 될 것입니다’는 ἐπιμιγήσεσθε ἐν βδελύγμασι의 관계를 부정확하게 처리합니다.
    rationale: 동사는 ‘…와 어울리다/결합하다’의 뜻이며, 여격은 결합의 상대를 나타냅니다. βδελύγματα도 ‘일들’로 한정되지 않습니다.
