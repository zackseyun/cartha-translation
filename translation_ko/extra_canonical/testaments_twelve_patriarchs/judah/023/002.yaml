  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/002.yaml
  text: You will make your daughters musicians and public women, and you will mingle with the abominations of the nations.
translation:
  language: ko
  text: 너희는 너희 딸들을 음악하는 여자들과 공공의 여자들로 만들 것이며, 이방 민족들의 가증한 일들 가운데 섞이게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μουσικὰς
  english_pob_choice: musicians
  chosen_korean: 음악하는 여자들
  alternatives_korean:
  - 음악가들
  - 악사들
  - 음악인들
  lexicon: music-related adjective in accusative feminine plural modifying daughters
  rationale: 여성형 목적어를 살려 직역적으로 옮기되, 현대 한국어에서 자연스럽고 성별 정보도 유지되는 표현으로 했습니다.
- source_word: δημοσίας
  english_pob_choice: public women
  chosen_korean: 공공의 여자들
  alternatives_korean:
  - 공적인 여자들
  - 공창
  - 매춘하는 여자들
  lexicon: δημόσιος
  rationale: 본문의 직설적·도덕적 뉘앙스를 완화하지 않으면서도, 현대어에서 통하는 공공성 표현으로 옮겼습니다.
- source_word: ἐπιμιγήσεσθε
  english_pob_choice: mingle with
  chosen_korean: 섞이게 될 것입니다
  alternatives_korean:
  - 어울리게 될 것입니다
  - 뒤섞이게 될 것입니다
  - 관계를 맺게 될 것입니다
  lexicon: ἐπιμίγνυμι
  rationale: 혼합·결합의 의미를 살리되, 문맥상 이방 민족의 가증한 일들과의 부정적 결합을 드러내기 위해 ‘섞이다’를 선택했습니다.
- source_word: βδελύγμασι ἐθνῶν
  english_pob_choice: abominations of the nations
  chosen_korean: 이방 민족들의 가증한 일들
  alternatives_korean:
  - 열방의 가증한 것들
  - 민족들의 혐오스러운 것들
  - 이방 민족들의 증오스러운 일들
  lexicon: βδέλυγμα / ἔθνη
  rationale: βδέλυγμα의 강한 종교적 혐오·가증함을 ‘가증한 일들’로 옮겨, 단순한 문화 차이가 아니라 언약적 금기를 강조했습니다.
theological_decisions:
- issue: doctrinally loaded sexual-social corruption language
  chosen_reading: ‘공공의 여자들’과 ‘가증한 일들’로 직접성을 유지해, 타락과 우상적 혼합의 경고를 약화하지 않았습니다.
  alternative_readings:
  - 완곡하게 ‘공적인 여자들’로 순화
  - 도덕적 판단을 줄인 표현으로 일반화
  rationale: 본문은 가족·공동체의 타락과 이방 관습과의 혼합을 경고하는 예언적 저주문맥이므로, 현대어로 옮기되 강도를 보존하는 것이 중요합니다.
  doctrine_reference: 언약적 순결과 우상숭배 경고
