id: T12P.JUD.6.2
reference: Testament of Judah 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ *συνάψαντες ἐτρέψαμεν⁴ αὐτοὺς⁵ καὶ τοὺς ἀπὸ Σιλὼμ⁶ συμμάχους αὐτῶν⁷ ἀπεκτείναμεν⁸ καὶ οὐκ ἐδώκαμεν αὐτοῖς⁹ διέξοδον¹⁰ τοῦ εἰσελθεῖν πρὸς ἡμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/002.yaml
  text: And when we joined battle, we routed them; and we killed those from Shiloh, their allies, and gave them no way of escape.
translation:
  language: ko
  text: 우리가 전투를 벌였을 때 그들을 무찔렀고, 실로에서 온 그들과 그들의 동맹자들을 죽였으며, 그들이 우리에게 들어올 길을 주지 않았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάψαντες
  english_pob_choice: when we joined battle
  chosen_korean: 우리가 전투를 벌였을 때
  alternatives_korean:
  - 우리가 싸움을 합쳤을 때
  - 전투에 합류했을 때
  lexicon: συνάπτω
  rationale: 분사형을 단순한 동시행동으로 살려 ‘전투를 벌였을 때’로 옮기면 전투 개시의 상황을 자연스럽게 드러낼 수 있습니다.
- source_word: ἐτρέψαμεν
  english_pob_choice: we routed them
  chosen_korean: 그들을 무찔렀고
  alternatives_korean:
  - 그들을 도망치게 했고
  - 그들을 패주시키고
  lexicon: τρέπω
  rationale: 영어 POB의 ‘routed’에 맞춰 전투에서 패퇴시키는 결과를 분명히 나타내기 위해 ‘무찔렀고’로 옮겼습니다.
- source_word: τοὺς ἀπὸ Σιλὼμ
  english_pob_choice: those from Shiloh
  chosen_korean: 실로에서 온 그들
  alternatives_korean:
  - 실로 출신인 그들
  - 실로 사람들
  lexicon: Σιλώμ
  rationale: 고유명사는 표준적인 성경 지명 ‘실로’로 옮기되, 출신을 나타내는 전치사구를 살려 ‘실로에서 온’으로 처리했습니다.
- source_word: συμμάχους
  english_pob_choice: their allies
  chosen_korean: 그들의 동맹자들을
  alternatives_korean:
  - 그들의 동맹들을
  - 그들과 동맹한 자들을
  lexicon: σύμμαχος
  rationale: 군사적 동맹 관계를 직접 드러내는 ‘동맹자들’이 본문의 의미를 가장 분명하게 전달합니다.
- source_word: διέξοδον τοῦ εἰσελθεῖν
  english_pob_choice: no way of escape
  chosen_korean: 들어올 길을
  alternatives_korean:
  - 탈출할 길을
  - 들어오는 통로를
  lexicon: διέξοδος
  rationale: 직역하면 ‘탈출구’이지만, 본문은 상대가 우리에게 접근하지 못하도록 막았다는 뜻이므로 ‘들어올 길’을 택해 방향성을 유지했습니다.
theological_decisions:
- issue: 전투 서술의 폭력성 표현
  chosen_reading: 살상과 패주를 직접적으로 드러내는 역사 서술로 처리했습니다.
  alternative_readings:
  - 완곡하게 ‘이기고 물리쳤다’로 순화
  - 전투를 추상화해 ‘승리했다’로 요약
  rationale: 원문은 군사적 살해와 봉쇄를 명시하므로, 이를 완화하지 않고 서술의 강도를 그대로 반영하는 것이 source-direct합니다.
  doctrine_reference: 서사시/유언 문헌의 문맥 보존 원칙
- issue: ‘실로’ 지명의 처리
  chosen_reading: Σιλώμ을 성경 지명 ‘실로’로 옮겼습니다.
  alternative_readings:
  - 시롬
  - 실롬
  rationale: 영어 POB 수정본이 ‘Shiloh’로 정정했으며, 한국어 성경 전통에서도 ‘실로’가 가장 안정적인 지명 대응입니다.
  doctrine_reference: 고유명사 음역 일관성
