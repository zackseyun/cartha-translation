revisions:
- from: 우리가 전투를 벌였을 때 그들을 무찔렀고, 실로에서 온 그들과 그들의 동맹자들을 죽였으며, 그들이 우리에게 들어올 길을 주지 않았습니다.[a][b]
  to: 우리가 전투를 벌였을 때, 그들을 패주시켰고, 그들의 동맹자들 가운데 실로에서 온 자들을 죽였으며, 그들이 우리에게 들어올 길을 내주지 않았습니다.
  rationale: 실로 출신이라는 수식어가 ‘동맹자들’을 한정하도록 문장 구조를 바로잡고, 마지막 절의 통로 차단의 주체와 방향을 명확히 했습니다. 살해와 패주의 군사적 서술은 완화하지 않았습니다.
