  source_fidelity: ‘막히르 사람들’은 ἀπὸ Μαχίρ를 다소 느슨하게 처리하며, 고유명사의 통상 한국어 성경 표기도 ‘마길’입니다. 또한 προσδίδωσι의 문법적 이상은 번역문에서 자연스럽게 처리할 수 있으나, 해당 행동 구절에 본문비평 주석을 붙여야 합니다.
  naturalness: ‘그 오름을 오르기’는 뜻은 통하지만 현대 한국어로 다소 부자연스럽습니다. ‘그 오르막을 오르기’는 원문의 동족목적어 효과와 지형적 의미를 더 자연스럽게 보존합니다.
  terminology: Μαχίρ는 표준 한국어 성경식으로 ‘마길’로 표기하는 것이 적절합니다. μάχαιρα는 ‘칼’, περιγινόμεθα는 ‘이기다’로 옮긴 것이 문맥에 맞습니다.
