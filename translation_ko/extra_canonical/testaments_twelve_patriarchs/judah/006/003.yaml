revisions:
- from: 그러나 막히르 사람들은 다섯째 날에 다시 우리에게 달려왔습니다. 그리고 강한 칼을 들고 그들을 향해 맞서서, 우리는 그들을 이겼고 그들이 그 오름을 오르기 전에 그들을 죽였습니다.[a][b]
  to: 그러나 마길에서 온 자들이 다섯째 날에 다시 우리를 공격해 왔습니다. 그리고 우리는 강한 칼로 그들에게 맞서[a] 그들을 이기고, 그들이 그 오르막을 오르기 전에[b] 그들을 죽였습니다.
  rationale: 마길의 표준 표기와 ἀπό의 출처 의미를 반영하고, 지형을 가리키는 동족어 반복을 자연스러운 한국어로 보존했습니다. 또한 문법적으로 난해한 προσδίδωσι를 임의로 본문 수정하지 않고, 문맥적 번역과 각주를 통해 그 불확실성을 드러냈습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:35Z'
