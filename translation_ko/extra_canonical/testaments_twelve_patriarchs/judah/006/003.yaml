source:
  edition: Charles 1908 Greek Versions (pages 144-145, Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Οἱ δὲ πάλιν¹¹ ἀπὸ¹² Μαχίρ¹³ ἐπἦλθον¹⁴ ἡμῶν τῇ πέμπτῃ ἡμέρᾳ, καὶ¹⁵ προσδίδωσι πρὸς αὐτοὺς¹⁶ *ἐν κραταιᾷ μαχαίρᾳ¹⁷ περιγινόμεθα αὐτῶν¹⁸ καὶ ἀπεκτείναμεν¹⁹ *πρὸ τοῦ ἀναβἆναι τὴν ἀνάβασιν²⁰.'
  language: Greek
  source_pages:
  - 144
  - 145
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/003.yaml
  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
  footnotes:
  - marker: a
    text: The verb προσδίδωσι (3rd sg. present) is syntactically anomalous in context — a sudden shift to singular present in a first-person plural aorist narrative. It may be a scribal compression or corruption for a participial phrase meaning 'committing [himself] against them.' The translation renders the apparent sense of the action (an aggressive engagement against the enemy) without emending the text.
    reason: textual_variant
  - marker: b
    text: τὴν ἀνάβασιν is a cognate accusative with ἀναβἆναι — literally 'before ascending the ascent.' The phrase denotes a slope, pass, or fortified approach the enemy was trying to reach or climb. 'Scale the ascent' preserves the directional and tactical sense.
    reason: lexical_note
translation:
  language: ko
  text: 그러나 마길에서 온 자들이 다섯째 날에 다시 우리를 공격해 왔습니다. 그리고 우리는 강한 칼로 그들에게 맞서[a] 그들을 이기고, 그들이 그 오르막을 오르기 전에[b] 그들을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 προσδίδωσι는 문맥상 이례적인 3인칭 단수 현재형으로, 1인칭 복수 과거형 서술 가운데 갑자기 나타납니다. 필사 과정에서 생긴 축약이나 훼손일 수 있으나, 본문을 고치지 않고 문맥상 적군을 향해 공격적으로 맞서는 행동을 가리키는 것으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 직역하면 ‘그 오르막을 오르기 전에’입니다. ἀναβῆναι(오르다)와 ἀνάβασιν(오르막·오르는 길)은 같은 어근을 반복하며, 적군이 오르려던 비탈, 길목 또는 요새화된 접근로를 가리킬 수 있습니다.
    reason: lexical_note
lexical_decisions:
- source_word: ἐπἦλθον ἡμῶν / πάλιν
  english_pob_choice: attacked us again
  chosen_korean: 다시 우리에게 달려왔습니다
  alternatives_korean:
  - 다시 우리를 공격했습니다
  - 다시 우리에게 들이닥쳤습니다
  lexicon: LSJ
  rationale: ἐπέρχομαι는 사람에게 적대적으로 ‘닥쳐오다/달려들다’의 힘이 있어, 단순한 접근보다 공격적 돌진을 드러내는 표현을 택했습니다. πάλιν의 ‘again’도 자연스럽게 살렸습니다.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  english_pob_choice: with a mighty sword
  chosen_korean: 강한 칼을 들고
  alternatives_korean:
  - 힘센 칼로
  - 강력한 칼을 가지고
  lexicon: LSJ
  rationale: μαχαίρα를 한국어 성경 문맥에서 자연스럽게 ‘칼’로 옮기되, κραταιᾷ의 힘·강함을 ‘강한’으로 살렸습니다. 전투 장면의 한국어 자연성을 위해 ‘들고’를 보조적으로 넣었습니다.
- source_word: περιγινόμεθα αὐτῶν
  english_pob_choice: we prevailed over them
  chosen_korean: 우리는 그들을 이겼고
  alternatives_korean:
  - 우리는 그들보다 우세했고
  - 우리는 그들을 압도했고
  lexicon: LSJ
  rationale: περιγίγνομαι의 ‘우세를 점하다/이기다’의 의미를 간명하게 풀어, 군사 서술의 결과를 분명히 드러냈습니다.
- source_word: πρὸ τοῦ ἀναβἆναι τὴν ἀνάβασιν
  english_pob_choice: before they could scale the ascent
  chosen_korean: 그들이 그 오름을 오르기 전에
  alternatives_korean:
  - 그들이 그 비탈을 오르기 전에
  - 그들이 그 올라감의 길을 오르기 전에
  lexicon: LSJ
  rationale: ἀνάβασις/ἀναβαίνειν의 중복은 ‘오름’으로 간결하게 반영했습니다. 영어 주석이 가리키는 지형적·전술적 뉘앙스를 살리되, 한국어에서는 반복을 과도하게 직역하지 않았습니다.
theological_decisions:
- issue: 본절의 전투 서술에서 동사의 급격한 인칭·시제 흔들림을 어떻게 반영할지
  chosen_reading: 본문의 서술 흐름을 따라 자연스러운 복수 서술로 옮기되, 원문의 난삽함을 과도하게 매끈하게 만들지는 않았습니다.
  alternative_readings:
  - 문법적 불안정을 더 드러내는 직역형
  - 추정 보정에 가까운 매끈한 재구성
  rationale: 영어 POB가 지적하듯 προσδίδωσι는 문맥상 이례적이지만, 한국어 본문에서는 의미상 공격 행위를 분명히 하면서도 본문 비문 가능성을 숨기지 않는 균형이 필요했습니다.
  doctrine_reference: 텍스트비평/번역원칙
