translation:
  language: ko
  text: 그리고 우리가 그 도시에 이르렀을 때,[a] 그 도시의 여자들은 그 도시가 자리 잡고 있던 산의 정상에서 우리에게 돌들을 굴려 내리고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '원문에는 τῇ τῇ πόλει(직역: ‘그 그 도시에’)라고 되어 있습니다. 이는 여격 정관사 τῇ가 중복된 필사상의 오류로 보이며, 번역에서는 한 번의 τῇ πόλει, 곧 ‘그 도시에’로 읽었습니다.'
    reason: textual_variant
lexical_decisions:
- source_word: Ὡς δὲ ἤκομεν ... τῇ πόλει
  english_pob_choice: And as we came to the city
  chosen_korean: 그리고 우리가 그 도시로 갈 때
  alternatives_korean:
  - 그리고 우리가 그 도시에 이르자
  - 우리가 그 도시로 오고 있을 때
  lexicon: source Greek
  rationale: 부사절의 진행 상황을 살리되, 목적지 방향을 자연스러운 한국어로 옮겼습니다. 본문은 도시 ‘도착’보다 접근 중인 상황을 말합니다.
- source_word: αἱ γυναῖκες αὐτῶν
  english_pob_choice: their women
  chosen_korean: 그들의 여자들은
  alternatives_korean:
  - 그들의 아내들은
  - 그 여자들은
  lexicon: source Greek
  rationale: ἀνήρ의 아내로 한정되지 않은 γυναῖκες를 그대로 살려 ‘아내들’로 좁히지 않았습니다. 관계를 명시하지 않는 직접 번역을 택했습니다.
- source_word: ἐκύλιον λίθους ἐφ᾽ ἡμᾶς
  english_pob_choice: were rolling stones down on us
  chosen_korean: 우리가 있는 쪽으로 ... 돌들을 굴리고 있었습니다
  alternatives_korean:
  - 우리 위로 돌들을 굴리고 있었습니다
  - 우리에게 돌들을 굴리고 있었습니다
  lexicon: source Greek
  rationale: 미완료 과거의 지속적 행위를 한국어 진행형으로 반영했고, ἐφ᾽ ἡμᾶς의 적대적 방향성은 ‘우리가 있는 쪽으로’로 살렸습니다.
- source_word: ἀπὸ τῆς κορυφῆς τοῦ ὄρους
  english_pob_choice: from the summit of the mountain
  chosen_korean: 산꼭대기에서
  alternatives_korean:
  - 산의 정상에서
  - 산의 꼭대기에서
  lexicon: source Greek
  rationale: 코어 의미는 ‘산의 가장 높은 곳’이므로 간결하고 자연스러운 ‘산꼭대기’로 옮겼습니다. 전투적 높이감은 유지됩니다.
- source_word: ἐν ᾗ ἦν ἡ πόλις
  english_pob_choice: on which the city stood
  chosen_korean: 그곳에 그 도시가 있었습니다
  alternatives_korean:
  - 그 위에 그 도시가 있었습니다
  - 그 도시에 그 도시가 있었습니다
  lexicon: source Greek
  rationale: 관계절은 도시가 산 위에 자리 잡았음을 설명합니다. 다만 한국어 본문에서는 문장 흐름을 위해 ‘그곳에 그 도시가 있었습니다’로 자연화했고, 높은 지형 위의 위치를 유지했습니다.
theological_decisions:
- issue: 본문의 폭력적 장면을 한국어에서 어떻게 표현할지
  chosen_reading: 직접적이고 생생한 표현을 유지하되, 과장하거나 완화하지 않고 사건의 적대성을 드러냈습니다.
  alternative_readings:
  - 완곡하게 순화하여 표현
  - 서술을 중립적으로 약화
  rationale: 본문은 접근하는 이들에게 돌을 굴려 저지하는 장면을 묘사하므로, 공격성을 분명히 드러내는 번역이 원문 의도에 충실합니다.
  doctrine_reference: 서사 본문의 사실적 묘사 보존 원칙
