- from: 그리고 우리가 그 도시로 갈 때, 그들의 여자들은 우리가 있는 쪽으로 산꼭대기에서 돌들을 굴리고 있었습니다.[a]
  to: 그리고 우리가 그 도시에 이르렀을 때,[a] 그 도시의 여자들은 그 도시가 자리 잡고 있던 산의 정상에서 우리에게 돌들을 굴려 내리고 있었습니다.
  rationale: 도시가 산 위에 있었다는 관계절을 ‘그 도시가 자리 잡고 있던 산’으로 복원했습니다. 접근의 완료된 시점은 ‘이르렀을 때’로, 돌을 반복적으로 굴린 미완료 과거는 ‘굴려 내리고 있었습니다’로 옮겼습니다. 또한 자연스러운 소유·관계 표현을 위해 ‘그 도시의 여자들’을 사용했고, 영어 감사 기록의 본문비평 각주를 한국어로 대응시켰습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:03Z'
review_pass:
  verdict: revise
  source_fidelity: 원문은 도시가 자리한 산의 정상에서 여자들이 접근해 오는 화자 일행을 향해 돌을 계속 굴린 장면입니다. 초안은 미완료 과거의 진행성은 잘 반영했으나, 본문에 산 위에 도시가 있었다는 관계절이 빠져 있어 원문의 지리적 정보를 보존하지 못합니다.
  naturalness: ‘그들의 여자들은’은 현대 한국어에서 지시 관계가 불분명하고 다소 부자연스럽습니다. 또한 ‘우리가 있는 쪽으로’는 원문의 직접적인 적대 방향을 다소 완화합니다. ‘그 도시의 여자들은 … 우리에게 돌들을 굴려 내리고 있었습니다’가 자연스럽고 정확합니다.
  terminology: ‘산의 정상’은 κορυφή τοῦ ὄρους를 자연스럽고 정확하게 옮깁니다. ‘굴려 내리고 있었습니다’는 높은 곳에서 아래의 상대를 향한 지속적 행위를 드러냅니다.
  issues:
  - severity: high
    issue: 산 위에 도시가 있었다는 관계절(ἐν ᾗ ἦν ἡ πόλις)이 번역 본문에서 누락되었습니다.
    rationale: 초안의 실제 번역문은 ‘산꼭대기에서’까지만 말하며, 산이 도시가 자리한 산이라는 원문의 수식 정보를 전달하지 않습니다.
  - severity: medium
    issue: ‘그들의 여자들은’이라는 표현이 한국어에서 자연스럽지 않고 선행 대상이 불명확합니다.
    rationale: αὐτῶν은 문맥상 그 도시 측 사람들을 가리키며, ‘그 도시의 여자들’이 관계를 명료하고 자연스럽게 나타냅니다.
  - severity: low
