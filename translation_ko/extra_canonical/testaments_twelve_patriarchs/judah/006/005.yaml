  source_fidelity: 핵심 동작 순서와 군사적 어휘는 대체로 잘 반영되어 있습니다. 다만 ἐξωπίσθεν의 ‘그들의 뒤에/후방에’라는 관계가 현 번역의 ‘뒤에 숨긴 뒤’에서는 누구의 뒤인지 분명하지 않습니다. 이를 본문과 주석에서 보완하는 것이 원문의 전술적 의미를 더 충실히 드러냅니다.
  naturalness: ‘그밖의’는 ‘그 밖의’로 띄어 쓰는 것이 표준적이며, ‘높은 곳을 차지하다’보다 군사 문맥의 ‘고지를 차지하다’가 자연스럽고 간결합니다. ‘도시를 멸망시키다’도 가능하나, ἐξωλοθρεύσαμεν의 직접적 파괴 행위에는 ‘완전히 파괴했습니다’가 더 자연스럽습니다.
  terminology: 시므온, 고지, 완전히 파괴했습니다는 현대 표준어 합쇼체에 적합합니다. τὸν τε καὶ Συμεών의 불명확한 결합은 영어 POB의 해석을 따라 ‘시므온과 그 밖의 이들’로 유지하되, 주석에서 명시되지 않은 동반자/집단이라는 점을 밝혀야 합니다.
