base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/005.yaml
  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
  footnotes:
  - marker: a
    text: τὸν τε καὶ Συμεὼν — literally 'Simeon and also [the others]' or 'the one together with Simeon.' The τε ... καί correlative pairs Simeon with another person or group not explicitly named. The translation renders this as 'Simeon and the others' to convey that Judah concealed a flanking force rather than only one individual.
    reason: lexical_note
  - marker: b
    text: 'ἐξωπίσθεν — a rare adverb meaning ''from the rear'' or ''from behind.'' It indicates a classic flanking maneuver: Simeon and the concealed force attacked from the back while the defenders'' attention was on the stone-rolling front.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 시므온과 그밖의 이들을[a] 뒤에 숨긴 뒤[b], 우리는 높은 곳을 차지하였고, 이 도시도 완전히 멸망시켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκρύψας
  english_pob_choice: having hidden
  chosen_korean: 숨긴 뒤
  alternatives_korean:
  - 감춘 뒤
  - 은닉한 뒤
  - 숨겨 둔 뒤
  lexicon: LSJ
  rationale: 전술적 은폐를 자연스럽게 드러내면서도, 원문의 ‘~한 뒤’ 구조로 앞선 동작의 선행성을 살렸습니다.
- source_word: τὸν τε καὶ Συμεὼν
  english_pob_choice: Simeon and the others
  chosen_korean: 시므온과 그밖의 이들
  alternatives_korean:
  - 시므온과 다른 이들
  - 시므온과 함께한 자들
  - 시므온과 나머지 무리
  lexicon: LSJ
  rationale: τε ... καί의 결합이 시므온 외에 명시되지 않은 동반 집단을 가리키므로, 한국어에서는 ‘그밖의 이들’로 그 암시를 살렸습니다.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  english_pob_choice: we seized the height
  chosen_korean: 높은 곳을 차지하였고
  alternatives_korean:
  - 고지를 점령하였고
  - 높은 지대를 빼앗았고
  - 산등성이를 장악하였고
  lexicon: LSJ
  rationale: ὑψηλοῦ를 군사적 고지로 이해해 ‘높은 곳’을 택했고, ἐπιλαμβάνομαι의 ‘붙잡아 차지하다’는 뜻을 한국어 동사 ‘차지하다’로 옮겼습니다.
- source_word: ἐξωλοθρεύσαμεν
  english_pob_choice: utterly destroyed
  chosen_korean: 완전히 멸망시켰습니다
  alternatives_korean:
  - 철저히 멸절시켰습니다
  - 완전히 없애버렸습니다
  - 철저히 진멸시켰습니다
  lexicon: LSJ
  rationale: 강조 접두가 있는 파괴 동사를 과도하게 완화하지 않기 위해 ‘완전히 멸망시켰습니다’로 옮겨 파괴의 전면성을 살렸습니다.
