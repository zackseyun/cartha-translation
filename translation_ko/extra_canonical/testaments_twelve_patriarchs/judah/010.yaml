revisions:
- from: 이 일들이 있은 뒤에, 내 아들 에르가 다말을 메소포타미아 출신 아람의 딸로서 자기 아내로 맞이하였습니다. 그러나 에르는 악하였고, 야훼의 천사가 그를 죽였습니다. 나는 그녀를 내 둘째 아들 오난에게 주었고, 보십시오, 주께서도 그를 쓰러뜨리셨습니다. 그가 어머니의 계략 때문에 그녀를 알지 않았기 때문입니다. 그는 그녀를 통해 자식을 두고 싶어 하지 않았습니다. 혼인방의 날들에 나는 오난을 그녀에게 레위라트 결혼으로 주었습니다. 그러나 그도 악함 가운데 그녀를 알지 않았고, 비록 그녀와 일 년을 함께 지냈습니다. 내가 그를 위협하자 그는 그녀에게 들어갔지만, 어머니의 명령대로 씨를 땅에 버렸습니다. 그래서 그도 악함 가운데 죽었습니다. 나는 셀롬도 그녀에게 주고자 하였으나, 그의 어머니가 허락하지 않았습니다. 다말이 자기와 같이 가나안 사람들의 딸들 가운데서 나온 것이 아니었기 때문입니다. 그 여인도 그러하였습니다.[a][b][c][d]
  to: 이 일들이 있은 뒤에, 내 아들 에르가 메소포타미아의 아람의 딸 다말을 자기 아내로 맞이하였습니다. 그러나 에르는 악하였고, 주님의 천사가 그를 죽였습니다. 그는 자기 어머니의 계략 때문에 그녀를 알지 않았습니다.[a] 이는 그가 그녀에게서 자녀를 얻고 싶어 하지 않았기 때문입니다. 신방을 차린 기간에 나는 오난을 그녀에게 형사취수 혼인으로 주었습니다.[b] 그러나 그도 악한 가운데 그녀를 알지 않았고, 그녀와 한 해를 함께 지냈습니다. 내가 그를 위협하자, 그는 그녀에게 들어갔지만 자기 어머니의 명령대로 씨를 땅에 버렸습니다. 그래서 그도 악한 가운데 죽었습니다. 나는 셀롬도 그녀에게 주고자 하였으나, 그의 어머니가 허락하지 않았습니다. 다말이 그의 어머니 자신처럼 가나안 사람들의 딸들 가운데서 나온 사람이 아니었기 때문에, 그의 어머니가 악한 일을 하였던 것입니다.
  rationale: 그리스어 본문을 우선하여 영어 감사 흔적에 들어 있는 비원문적 보충을 제거했습니다. 특히 3절의 대명사와 서술 순서가 지닌 난점을 보존하고, 4–6절의 형사취수 및 반복되는 ‘악함’의 어휘를 충실히 반영했습니다. 주석은 실제로 해당 표현에 붙여, 원문상 필요한 완곡어법 및 문화 배경만 설명하도록 정리했습니다.
