base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010.yaml
  text: After these things[a], Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram. But Er was wicked, and an angel of the Lord killed him. And I gave her to Onan, my second son, and behold, the Lord struck him down also. For he did not know her, through the scheming of his mother, because he did not want to have children by her. During the days of the bridal chamber I gave Onan to her in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year. And when I threatened him, he went in to her[b], but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because Tamar was not from the daughters of Canaan[d][c], as she herself was.
  footnotes:
  - marker: a
    text: Some Greek witnesses vary in small details of sequence and timing, including whether Er died on the second day or the third night, and whether Onan was joined to Tamar immediately or during the wedding period.
    reason: textual_variant
  - marker: b
    text: '"Know her" is a biblical euphemism for sexual relations.'
    reason: lexical_alternative
  - marker: c
    text: '"Gave Onan to her in levirate marriage" refers to the duty of a deceased man''s brother to raise offspring for him through the widow; compare Genesis 38.'
    reason: cultural_note
  - marker: d
    text: The chapter's repeated language of "wickedness" ties the deaths of Er and Onan and the mother's obstruction into one moral pattern.
    reason: cross_reference
translation:
  language: ko
  text: 이 일들이 있은 뒤에, 내 아들 에르가 메소포타미아의 아람의 딸 다말을 자기 아내로 맞이하였습니다. 그러나 에르는 악하였고, 주님의 천사가 그를 죽였습니다. 그는 자기 어머니의 계략 때문에 그녀를 알지 않았습니다.[a] 이는 그가 그녀에게서 자녀를 얻고 싶어 하지 않았기 때문입니다. 신방을 차린 기간에 나는 오난을 그녀에게 형사취수 혼인으로 주었습니다.[b] 그러나 그도 악한 가운데 그녀를 알지 않았고, 그녀와 한 해를 함께 지냈습니다. 내가 그를 위협하자, 그는 그녀에게 들어갔지만 자기 어머니의 명령대로 씨를 땅에 버렸습니다. 그래서 그도 악한 가운데 죽었습니다. 나는 셀롬도 그녀에게 주고자 하였으나, 그의 어머니가 허락하지 않았습니다. 다말이 그의 어머니 자신처럼 가나안 사람들의 딸들 가운데서 나온 사람이 아니었기 때문에, 그의 어머니가 악한 일을 하였던 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그녀를 알지 않았다’는 성관계를 가리키는 성경적 완곡어법입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘형사취수 혼인’은 죽은 남자의 형제가 그 과부와 결합하여 죽은 형제를 위한 후손을 잇는 관습을 가리킵니다. 창세기 38장을 비교하십시오.
    reason: cultural_note
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  english_pob_choice: an angel of the Lord
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 주님의 천사
  - 주의 천사
  lexicon: BDAG
  rationale: 본문의 Κυρίου는 이 장의 신적 행위 맥락에서 야훼를 가리키는 것으로 보아, 한국어 본문에서도 고유명칭을 드러내는 쪽이 원문의 긴장을 더 투명하게 보존합니다.
- source_word: πονηρός / ἐν πονηρίᾳ
  english_pob_choice: wicked / in wickedness
  chosen_korean: 악함 / 악하였고
  alternatives_korean:
  - 악
  - 사악함
  lexicon: BDAG
  rationale: 장 전체에 반복되는 도덕적 규탄을 살리기 위해, 단순한 성격 묘사보다 행위의 악함을 드러내는 표현으로 옮겼습니다.
- source_word: οὐκ ἔγνω αὐτήν
  english_pob_choice: did not know her
  chosen_korean: 그녀를 알지 않았습니다
  alternatives_korean:
  - 그녀와 관계하지 않았습니다
  - 그녀와 동침하지 않았습니다
  lexicon: BDAG
  rationale: 성경적 완곡어법을 유지하여, 노골화하지 않으면서도 문맥상 성적 관계의 의미를 독자가 알아차리게 했습니다.
- source_word: ἐπεγυμβρευσα αὐτῇ / εἰς γυναῖκα
  english_pob_choice: gave ... in levirate marriage / as a wife
  chosen_korean: 레위라트 결혼으로 주었습니다 / 자기 아내로 맞이하였습니다
  alternatives_korean:
  - 형사취수로 주었습니다
  - 아내로 삼았습니다
  lexicon: LSJ
  rationale: δώ로 표현된 단순 혼인이 아니라, 다말 이야기의 핵심인 형사취수 의무를 드러내기 위해 문화적 제도를 명시했습니다.
- source_word: διέφθειρε τὸ σπέρμα ἐπὶ τὴν γῆν
  english_pob_choice: wasted the seed on the ground
  chosen_korean: 씨를 땅에 버렸습니다
  alternatives_korean:
  - 씨를 땅에 흘렸습니다
  - 정액을 땅에 버렸습니다
  lexicon: BDAG
  rationale: 원문 이미지와 창세기 전승의 연결을 살리되, 한국어에서 과도하게 생물학적이거나 노골적으로 들리지 않도록 절제했습니다.
theological_decisions:
- issue: 에르와 오난의 죽음에 대한 신적 대리 행위
  chosen_reading: 에르는 '야훼의 천사'가 죽였다고, 오난은 '주께서' 쓰러뜨리셨다고 구분하여 그대로 옮겼습니다.
  alternative_readings:
  - 둘 다 주께서 직접 죽이신 것으로 통일
  - 둘 다 천사 행위로 통일
  rationale: 본문이 보존한 행위 주체의 차이를 평탄화하지 않고 유지하는 것이 원문-기반 번역의 책임에 맞습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 레위라트 결혼의 명시성
  chosen_reading: 다말과의 결합을 '레위라트 결혼'으로 분명히 밝혔습니다.
  alternative_readings:
  - 일반적인 결혼으로만 번역
  - 주석에서만 설명
  rationale: 본문의 사회적·법적 배경이 서사의 핵심이므로, 번역 본문 안에서 드러내는 편이 원문의 의미를 더 정확히 전달합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 5
