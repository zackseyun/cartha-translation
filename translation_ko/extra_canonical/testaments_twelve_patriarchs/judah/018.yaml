  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018.yaml
  text: '1. The Lord gave me favor because I obeyed my father. 2. Therefore I never grieved Jacob my father, for I did everything he told me. 3. And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me in the same way. 4. And I know what evils you will do in the last days.


    5. Guard yourselves, therefore, my children, from sexual immorality and from the love of money, and listen to Judah your father. 6. For these turn one away from the law of God, and blind the purpose of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor. 7. They deprive his soul of every goodness, and hold him fast in pains and labors; they drive sleep away from him, and consume his flesh. 8. They hinder the sacrifices of God, and he does not remember the blessing of God. He does not listen when a prophet speaks, and he resents words of godliness. 9. For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.'
translation:
  language: ko
  text: '4. 나는 마지막 날들에 너희가 어떤 악을 행할지 알고 있습니다.


    5. 그러므로 내 자녀들아, 음행과 돈을 사랑하는 것에서 스스로를 지키고, 너희의 아버지 유다의 말을 들으십시오.

    6. 이것들은 하나님의 율법에서 사람을 떠나게 하고, 영혼의 의도를 눈멀게 하며, 교만을 가르치고, 사람이 자기 이웃에게 자비를 베풀지 못하게 하기 때문입니다.

    7. 그것들은 그의 영혼을 온갖 선함에서 빼앗고, 그를 고통과 수고에 붙들어 두며, 잠을 그에게서 몰아내고, 그의 살을 소모합니다.

    8. 그것들은 하나님의 제사를 막고, 그는 하나님의 복을 기억하지 않습니다. 그는 예언자가 말할 때 듣지 않으며, 경건의 말을 싫어합니다.

    9. 그는 서로 հակ하는 두 정욕의 노예이므로 하나님께 순종할 수 없습니다. 그것들이 그의 영혼을 눈멀게 했기 때문입니다.[a][b][c]'
  philosophy: formal
lexical_decisions:
- source_word: ἐν [ταῖς ἐσχάταις ἡμέραις] / the last days
  english_pob_choice: the last days
  chosen_korean: 마지막 날들
  alternatives_korean:
  - 말세
  - 끝날들
  lexicon: ἐσχάται ἡμέραι
  rationale: 묵시적 종말 표현을 유지하되, 현대 한국어에서 자연스럽고 직설적인 ‘마지막 날들’로 옮겼습니다.
- source_word: πορνεία / sexual immorality
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 성적 음란
  lexicon: πορνεία
  rationale: 원문의 성윤리적 금지를 지나치게 완화하지 않으면서도, 한국어 성경 전통과 소스 의미를 함께 살릴 수 있는 기본 대응어로 선택했습니다.
- source_word: φιλαργυρία / love of money
  english_pob_choice: love of money
  chosen_korean: 돈을 사랑하는 것
  alternatives_korean:
  - 탐욕
  - 재물을 사랑하는 것
  lexicon: φιλαργυρία
  rationale: 원문의 ‘money’(돈)를 드러내어, 단순한 추상적 탐욕보다 물질 집착의 대상을 분명히 했습니다.
- source_word: ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ
  english_pob_choice: do not allow a man to show mercy to his neighbor
  chosen_korean: 사람이 자기 이웃에게 자비를 베풀지 못하게
  alternatives_korean:
  - 사람이 이웃을 긍휼히 여기지 못하게
  - 사람이 이웃에게 불쌍히 여기지 못하게
  lexicon: ἐλεέω / πλησίον
  rationale: ‘자비를 베풀다’로 동사를 살리고, πλησίον은 관계를 분명히 하는 ‘자기 이웃’으로 옮겼습니다.
- source_word: δουλεύει
  english_pob_choice: he is enslaved
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 사로잡혀
  - 예속되어
  lexicon: δουλεύω
  rationale: 여기서는 두 상반된 정욕에 대한 강한 종속성을 드러내기 위해, POB의 취지에 따라 ‘노예’ 이미지를 반영했습니다.
theological_decisions:
- issue: ‘the law of God’와 순종 불능의 원인 진술
  chosen_reading: 하나님의 율법에서 사람을 떠나게 하며, 하나님께 순종할 수 없게 되는 상태를 도덕적·영적 타락의 결과로 보존했습니다.
  alternative_readings:
  - 하나님의 법으로부터 멀어지게 한다
  - 하나님께 복종할 수 없게 한다
  rationale: 원문은 정욕이 율법 이탈과 순종 불능을 낳는 인과관계를 분명히 말하므로, 이를 약화하지 않고 그대로 유지했습니다.
  doctrine_reference: 윤리적 타락과 인간 의지의 속박에 대한 본문 자체의 경고
