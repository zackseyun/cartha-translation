revisions:
- from: 그러나 제 모든 형제는 성벽의 양쪽에서 말뚝을 박고, 그들이 알아차리지 못하는 사이에 그 성읍으로 들어갔습니다.[a]
  to: 그리고 그는 성벽을 뛰어넘었습니다. 그렇게 하여 내 형제들은 성벽 양쪽으로부터 몰래 그 성읍으로 들어갔습니다.
  rationale: 제시된 그리스어를 우선하여, 원문에 없는 말뚝·전원성·상대방의 무인지 진술을 제거하고, 성벽을 뛰어넘음과 은밀한 진입을 복원했습니다. ἀνεπήδησεν의 생략된 단수 주어는 문맥상 선행 인물을 가리키므로 한국어에서는 ‘그는’으로 최소한으로 보충했습니다.
  reviewer_model: gpt-5.6-terra
