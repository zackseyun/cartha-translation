source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἀνεπήδησεν τὸ τεῖχος¹⁶. 4. *Καὶ οὕτως λάθρα οἱ ἀδελφοί μου ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους εἰσῆλθον εἰς τὴν πόλιν¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/004.yaml
  text: But all my brothers, having driven stakes into the wall from both sides, entered the city while they were unaware.
translation:
  language: ko
  text: 그리고 그는 성벽을 뛰어넘었습니다. 그렇게 하여 내 형제들은 성벽 양쪽으로부터 몰래 그 성읍으로 들어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλά
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: 접속사
  rationale: 앞선 서술과 대비되는 전개를 살리기 위해 ἀλλά를 역접 접속사 ‘그러나’로 옮겼습니다.
- source_word: ἐμπήξαντες / ἀνεπήδησεν τὸ τεῖχος
  english_pob_choice: having driven stakes into the wall
  chosen_korean: 성벽의 양쪽에서 말뚝을 박고
  alternatives_korean:
  - 성벽에 말뚝을 박고
  - 양쪽에서 말뚝을 꽂아 넣고
  lexicon: 동사구
  rationale: 영어 POB의 수정본처럼 ‘뛰어오르다/올라타다’가 아니라 말뚝을 벽에 박는 행위를 직접적으로 드러내는 표현을 택했습니다.
- source_word: ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους
  english_pob_choice: from both sides of the wall
  chosen_korean: 성벽의 양쪽에서
  alternatives_korean:
  - 벽의 양편에서
  - 성벽 양편으로부터
  lexicon: 전치사구
  rationale: ἑκατέρων τῶν μερῶν의 양측성을 자연스럽게 드러내기 위해 ‘양쪽에서’로 옮겼습니다.
- source_word: ἀγνοούντων αὐτῶν
  english_pob_choice: while they were unaware
  chosen_korean: 그들이 알아차리지 못하는 사이에
  alternatives_korean:
  - 그들이 모르는 사이에
  - 그들이 눈치채지 못하는 동안
  lexicon: 분사구
  rationale: 단순한 비밀 행위보다 ‘인지하지 못함’의 상태를 반영해, 주체가 상황을 알아차리지 못한 채 진행된 뜻을 살렸습니다.
theological_decisions:
- issue: '서술의 강조점: 은밀함의 정도'
  chosen_reading: 본문이 말하는 것은 ‘비밀스럽게’라는 부사보다, 성벽 작업과 진입이 상대방의 무인지 상태에서 이루어졌다는 점입니다.
  alternative_readings:
  - ‘몰래’
  - ‘은밀히’
  rationale: 영어 POB 수정안이 ‘secretly’를 제거한 점을 따라, 원문에 명시되지 않은 방식어를 덧붙이지 않고 사건의 객관적 진행을 유지했습니다.
  doctrine_reference: source fidelity
