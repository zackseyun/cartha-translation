  - 르우벤과 레위 지파
  - 루우벤과 레위
  lexicon: 고유명사
  rationale: 성서 인명은 현대 외래어 표기 관행에 맞추되, 기존 통용형을 크게 벗어나지 않도록 ‘르우벤’과 ‘레위’를 채택했습니다.
