  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/002.yaml
  text: But I and Gad attacked from the east of the city, and Reuben and Levi from the west.
translation:
  language: ko
  text: 그러나 나와 갓은 도시의 동쪽에서 공격하였고, 르우벤과 레위는 서쪽에서 공격하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέφθημεν
  english_pob_choice: attacked
  chosen_korean: 공격하였습니다
  alternatives_korean:
  - 습격하였습니다
  - 쳐들어갔습니다
  - 공격했습니다
  lexicon: προσφθάνω/προσπίπτω 계열
  rationale: 문맥상 도시를 향한 군사적 돌입을 가리키므로, POB의 attacked를 따라 평이하게 ‘공격하다’로 옮겼습니다.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  english_pob_choice: from the east of the city
  chosen_korean: 도시의 동쪽에서
  alternatives_korean:
  - 성읍의 동쪽에서
  - 도성의 동쪽에서
  - 도시 동쪽 편에서
  lexicon: ἀνατολή / πόλις
  rationale: 방향과 위치를 직접적으로 전달하기 위해 ‘도시의 동쪽에서’로 자연스럽게 옮겼습니다.
- source_word: Ῥουβὴμ ... καὶ Λευὶ
  english_pob_choice: Reuben and Levi
  chosen_korean: 르우벤과 레위
  alternatives_korean:
  - 르우벤과 레위 사람들
  - 르우벤과 레위 지파
  - 루우벤과 레위
  lexicon: 고유명사
  rationale: 성서 인명은 현대 외래어 표기 관행에 맞추되, 기존 통용형을 크게 벗어나지 않도록 ‘르우벤’과 ‘레위’를 채택했습니다.
theological_decisions:
- issue: 행동 동사의 반복을 어떻게 처리할지
  chosen_reading: 앞 절반과 뒤 절반 모두에 같은 군사 동사 ‘공격하였습니다’를 반복했습니다.
  alternative_readings:
  - 뒤 절반은 ‘서쪽에서 [공격하였습니다]’처럼 생략 처리
  - ‘진격하였습니다’로 변주
  rationale: 원문은 두 집단의 동시적·대칭적 행동을 병렬로 제시하므로, 한국어에서도 반복을 살려 구조를 보존했습니다.
  doctrine_reference: 서사 평행구조 보존
