lexical_decisions:
- source_word: προσέφθημεν
  english_pob_choice: attacked
  chosen_korean: 공격하였습니다
  alternatives_korean:
  - 습격하였습니다
  - 쳐들어갔습니다
  - 공격했습니다
  lexicon: προσφθάνω/προσπίπτω 계열
  rationale: 문맥상 도시를 향한 군사적 돌입을 가리키므로, POB의 attacked를 따라 평이하게 ‘공격하다’로 옮겼습니다.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  english_pob_choice: from the east of the city
  chosen_korean: 도시의 동쪽에서
  alternatives_korean:
  - 성읍의 동쪽에서
  - 도성의 동쪽에서
  - 도시 동쪽 편에서
  lexicon: ἀνατολή / πόλις
  rationale: 방향과 위치를 직접적으로 전달하기 위해 ‘도시의 동쪽에서’로 자연스럽게 옮겼습니다.
- source_word: Ῥουβὴμ ... καὶ Λευὶ
  english_pob_choice: Reuben and Levi
  chosen_korean: 르우벤과 레위
  alternatives_korean:
