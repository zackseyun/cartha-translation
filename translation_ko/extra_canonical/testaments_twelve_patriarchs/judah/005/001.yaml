  text: And on the next day we went to Areta, a city still mighty and strong, threatening us with death.
translation:
  language: ko
  text: 그리고 다음 날 우리는 아레타로 갔습니다. 그곳은 우리에게 죽음을 위협하고 있는 강력한 도시였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  english_pob_choice: on the next day
  chosen_korean: 다음 날
  alternatives_korean:
  - 그 이튿날
  - 이튿날
  lexicon: ἑξῆς
  rationale: 시간의 흐름을 자연스럽게 풀어 현대 한국어 서술에서 가장 직접적인 대응인 ‘다음 날’을 택했습니다.
- source_word: ἀπήλθομεν εἰς Ἀρετάν
  english_pob_choice: we went to Areta
  chosen_korean: 우리는 아레타로 갔습니다
  alternatives_korean:
  - 우리는 아레타에 갔습니다
  - 우리는 아레타로 떠났습니다
  lexicon: ἀπέρχομαι
  rationale: 동사 ἀπήλθομεν의 단순한 이동 의미를 살려 ‘갔습니다’로 옮겼고, 전치사 εἰς의 방향성을 반영해 ‘-로’를 썼습니다.
- source_word: πόλιν κραταιάν
  english_pob_choice: a city still mighty and strong
  chosen_korean: 여전히 강하고 견고한 도시였으며
  alternatives_korean:
  - 여전히 강하고 힘센 도시였으며
  - 여전히 강대한 도시였으며
  lexicon: πόλις, κραταιός
  rationale: κραταιάν의 물리적·군사적 강함을 한국어의 ‘강하고 견고한’으로 풀어, 도시의 성격을 과장 없이 보존했습니다.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  english_pob_choice: threatening us with death
  chosen_korean: 우리를 죽음으로 위협하고 있었습니다
  alternatives_korean:
  - 우리에게 죽음을 위협하고 있었습니다
  - 죽이겠다고 우리를 위협하고 있었습니다
  lexicon: ἀπειλέω, θάνατος
  rationale: 직역적 구조를 유지하되 한국어에서 자연스러운 ‘죽음으로 위협하다’로 옮겨 위협의 내용을 분명하게 했습니다.
