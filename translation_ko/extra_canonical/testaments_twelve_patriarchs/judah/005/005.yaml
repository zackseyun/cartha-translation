  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ κατελάβομεν αὐτὴν¹⁸ ἐν στόματι μαχαίρας¹⁹, καὶ τοὺς ἐν τῷ πύργῳ²⁰ καταφυγόντας ἐν πυρὶ ἐνεπρήσαμεν, καὶ οὕτως πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/005.yaml
  text: And we took it by the edge of the sword, and those who had fled for refuge in the tower we burned with fire; and so we captured them all.
translation:
  language: ko
  text: 그리고 우리는 그것을 칼날로 점령하고, 탑으로 피신한 이들을 불태웠습니다. 그렇게 우리는 그들을 모두 사로잡고 그들의 모든 것을 빼앗았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάβομεν αὐτὴν ἐν στόματι μαχαίρας
  english_pob_choice: we took it by the edge of the sword
  chosen_korean: “칼날로 점령하였고”
  alternatives_korean:
  - 칼끝으로 빼앗았고
  - 칼날에 의지하여 차지하였고
  lexicon: καταλαμβάνω; στόμα μαχαίρας
  rationale: στόμα μαχαίρας는 문자적으로 ‘칼의 입’이지만 관용적으로 전투적 제압을 뜻하므로, ‘칼날로’로 옮겨 소스의 표현력을 살리면서도 한국어로 자연스럽게 했습니다.
- source_word: τῷ πύργῳ
  english_pob_choice: the tower
  chosen_korean: 성
  alternatives_korean:
  - 탑
  - 요새
  lexicon: πύργος
  rationale: 전후 문맥에서 피난처 기능이 강조되므로 단순한 건축물보다 방어 거점의 의미를 살려 ‘성’으로 옮겼습니다.
- source_word: καταφυγόντας ... ἐν πυρὶ ἐνεπρήσαμεν
  english_pob_choice: those who had fled for refuge ... we burned with fire
  chosen_korean: “성으로 피신한 자들은 불로 태워 버렸습니다”
  alternatives_korean:
  - 성에 피난한 자들을 불로 살라 버렸습니다
  - 성에 도망한 자들을 불로 불살랐습니다
  lexicon: καταφεύγω; ἐμπρήθω
  rationale: ‘피신하다’는 피난·도피의 의미를 살리고, ‘태워 버리다’는 ἐνεπρήσαμεν의 가혹한 전투 서술을 직접적으로 반영합니다.
- source_word: πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν
  english_pob_choice: we captured them all
  chosen_korean: “그들 모두를 사로잡았고, 그들의 모든 것도 차지하였습니다”
  alternatives_korean:
  - 그들 모두를 붙잡았고, 그들의 모든 재산도 빼앗았습니다
  - 그들을 모두 사로잡았고, 그들의 소유를 모두 취하였습니다
  lexicon: λαμβάνω; πάντα τὰ αὐτῶν
  rationale: 마지막 절의 ‘그들의 모든 것’은 사람뿐 아니라 소유물까지 포함하는 포괄 표현이므로, 단순히 ‘그들 모두’를 넘어서 ‘그들의 모든 것’도 반영했습니다.
theological_decisions:
- issue: 폭력적 정복 서술의 직역 정도
  chosen_reading: 전투·학살·약탈의 연쇄를 완화하지 않고 직접적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘제압하였다’로 낮추기
  - 서술의 잔혹성을 줄여 순화하기
  rationale: 원문은 승전 서사의 폭력성을 드러내므로, 이를 순화하면 저자의 의도와 독자의 인식을 왜곡할 수 있습니다.
  doctrine_reference: source-faithfulness principle
