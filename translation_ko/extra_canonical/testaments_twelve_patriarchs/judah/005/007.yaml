  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/007.yaml
  text: And we killed them also, and burned the city, and everything in it.
translation:
  language: ko
  text: 우리는 모든 사람을 죽였고, 다시 우리의 포로 상태를 되찾았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκτείναμεν πάντας
  english_pob_choice: And we killed them also
  chosen_korean: 우리는 모든 사람을 죽였고
  alternatives_korean:
  - 그리고 우리는 그들을 모두 죽였습니다
  - 우리는 그들 모두를 죽였고
  lexicon: ἀποκτείνω
  rationale: 동사의 완료적 과거를 한국어 서술 과거로 옮기고, πάντας는 ‘모든 사람’을 택해 대상의 전면성을 드러냈습니다.
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  english_pob_choice: and everything in it
  chosen_korean: 우리의 포로 상태를 되찾았습니다
  alternatives_korean:
  - 우리의 포로 됨을 다시 얻었습니다
  - 우리의 포로 생활을 다시 받았습니다
  lexicon: αἰχμαλωσία
  rationale: 본문의 그리스어는 ‘포로 됨/포로 상태’를 뜻하므로, 영어 POB의 ‘everything in it’보다 원문 의미를 우선해 한국어에서는 포로 상태 회복으로 옮겼습니다.
theological_decisions:
- issue: 영문 POB가 본문과 달리 ‘도시와 그 안의 모든 것’을 제시하는데, 그리스어 본문은 ‘우리의 포로 상태’라고 읽힙니다.
  chosen_reading: 원문 그리스어를 따라 ‘우리의 포로 상태를 되찾았습니다’로 번역했습니다.
  alternative_readings:
  - 영어 POB를 따라 ‘도시와 그 안의 모든 것을 불태웠습니다’로 옮길 수 있음
  rationale: 이 절은 영어 POB와 현존 그리스어 사이에 내용 차이가 커서, 출발 텍스트인 그리스어를 우선해 번역하는 것이 소스-정합적입니다.
  doctrine_reference: source-priority / textual alignment
