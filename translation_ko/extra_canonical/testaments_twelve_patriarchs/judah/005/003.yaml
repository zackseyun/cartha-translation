  text: And those on the wall, thinking that we were alone, were drawn toward us.
translation:
  language: ko
  text: 그리고 성벽 위에 있던 사람들은 우리가 홀로 있다고 생각하여 우리 쪽으로 끌려왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐπὶ τοῦ τείχους
  english_pob_choice: those on the wall
  chosen_korean: 성벽 위에 있던 사람들
  alternatives_korean:
  - 성벽 위의 사람들
  - 벽 위에 있던 자들
  lexicon: τεῖχος
  rationale: ἐπὶ τοῦ τείχους는 단순한 위치 표현이므로 ‘성벽 위에 있던 사람들’로 자연스럽게 옮겨, 원문의 장면성을 살렸습니다.
- source_word: ὅτι ἡμεῖς μόνοι ἐσμὲν
  english_pob_choice: thinking that we were alone
  chosen_korean: 우리가 홀로 있다고 생각하고
  alternatives_korean:
  - 우리가 혼자라고 생각하여
  - 우리가 오직 우리뿐이라고 여겨
  lexicon: μόνοι
  rationale: ὅτι 절은 이유/판단 내용을 설명하므로 ‘~다고 생각하고’로 처리했고, μόνοι는 인원적 고립을 드러내는 ‘홀로’로 옮겼습니다.
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  english_pob_choice: were drawn toward us
  chosen_korean: 우리 쪽으로 끌려왔습니다
  alternatives_korean:
  - 우리에게로 끌려왔습니다
  - 우리 쪽으로 이끌렸습니다
  lexicon: ἐφελκύω
  rationale: 수동형 ἐφειλκύσθησαν의 ‘끌리다/이끌리다’ 의미를 살려 수동을 유지했고, πρὸς ἡμᾶς는 최신 POB 판단대로 ‘toward us’에 맞춰 ‘우리 쪽으로’로 번역했습니다.
