  text: And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue.
translation:
  language: ko
  text: 그러나 우리가 떠나갈 때에 바부에 사람들[ᵃ]이 우리의 포로들을 덮쳤고, 우리가 그것을 본 뒤에 그들과 함께 바부에까지 전쟁을 벌였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ ἀπιέναι ἡμᾶς
  english_pob_choice: And as we were departing
  chosen_korean: 그러나 우리가 떠나갈 때에
  alternatives_korean:
  - 우리가 떠나는 동안에
  - 우리가 떠나가고 있을 때에
  lexicon: ἀπέρχομαι
  rationale: 행동의 진행 중을 자연스럽게 살리되, 앞절과의 연결을 보여 주는 δὲ는 문맥상 ‘그러나’로 옮겼습니다.
- source_word: ἄνδρες †Βαβουὲ
  english_pob_choice: men of Thapphoue
  chosen_korean: 바부에 사람들
  alternatives_korean:
  - 바부에의 남자들
  - 바부에 출신의 사람들
  lexicon: ἄνδρες + 고유명사
  rationale: ἄνδρες는 단순히 ‘남자들’보다 집단 구성원 표시로 기능하므로 한국어에서는 자연스럽게 ‘사람들’로 옮겼습니다.
- source_word: ἐπελάβοντο τὴν αἰχμαλωσίαν ἡμῶν
  english_pob_choice: fell upon our captives
  chosen_korean: 우리의 포로들을 덮쳤고
  alternatives_korean:
  - 우리의 포로들을 습격했고
  - 우리의 포로들을 붙잡았고
  lexicon: ἐπιλαμβάνομαι + αἰχμαλωσία
  rationale: POB의 ‘fell upon’는 공격적 돌입을 뜻하므로 ‘덮쳤다’로, αἰχμαλωσία는 여기서 ‘포로들’로 옮겨 문맥의 대상이 사람임을 드러냈습니다.
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  english_pob_choice: we joined battle with them
  chosen_korean: 우리가 그들과 함께 전쟁을 벌였습니다
  alternatives_korean:
  - 우리가 그들과 전투를 벌였습니다
  - 우리가 그들과 싸웠습니다
  lexicon: συνάπτω πόλεμον
  rationale: ‘전쟁을 벌이다’는 συνάπτω πόλεμον의 집단적 교전 의미를 살리면서도 현대 한국어에서 자연스럽습니다.
