  to: 이제 내가 너희에게 명령합니다, 내 자녀들아. 은을 사랑하지 말고, 여자들의 아름다움에 눈길을 두지 마십시오. 이는 나 또한 금과 아름다움 때문에 가나안 여인 베수에에게 미혹되었기 때문입니다.
  rationale: 원문의 명령과 금지의 병렬, 그리고 화자 자신의 경험을 근거로 드는 인과 구조를 보존했습니다. 고유명사를 ‘베수에’로 한국어 음역했으며, ‘가나안 여인 베수에’는 그리스어의 동격적 표현을 자연스럽게 반영합니다. ‘미혹되었기’는 ἐπλανήθην(‘길을 잃다/그릇되게 이끌리다’)의 도덕적 문맥을 무리 없이 전달합니다.
