  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
