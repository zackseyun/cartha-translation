  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/001.yaml
  text: 'And now I command you, my children: do not love silver, nor set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.'
translation:
  language: ko
  text: 이제 내가 너희에게 명령합니다, 내 자녀들아. 은을 사랑하지 말고, 여자들의 아름다움에 눈길을 두지 마십시오. 이는 나 또한 금과 아름다움 때문에 가나안 여인 베수에에게 미혹되었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  english_pob_choice: I command
  chosen_korean: 명령합니다
  alternatives_korean:
  - 당부합니다
  - 명령드립니다
  lexicon: ἐντέλλομαι
  rationale: 직접적 권위를 가진 명령 동사를 유지해 원문의 어조를 살렸습니다.
- source_word: ἀργύριον
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은전
  - 은화
  - 돈
  lexicon: ἀργύριον
  rationale: 문맥상 귀금속 ‘은’ 자체를 가리키는 표현이 더 직접적이며, 영어 POB의 silver도 이를 반영합니다.
- source_word: ἐπιβλέπει εἰς κάλλος γυναικῶν
  english_pob_choice: set your gaze on the beauty of women
  chosen_korean: 여자들의 아름다움에 눈을 두지 마십시오
  alternatives_korean:
  - 여자들의 아름다움을 바라보지 마십시오
  - 여자들의 아름다움에 시선을 두지 마십시오
  lexicon: ἐπιβλέπω + κάλλος
  rationale: ‘눈을 두다’는 관찰을 넘어 탐하는 시선을 피하라는 금지를 잘 드러내며, κάλλος의 미적 매력을 직접 살렸습니다.
- source_word: Βησουὲ τὴν Χαναναίαν
  english_pob_choice: Besue the Canaanite woman
  chosen_korean: Besue 가나안 여인
  alternatives_korean:
  - 베수에 가나안 여인
  - 베수에라는 가나안 여인
  lexicon: Βησουέ
  rationale: 고유명사는 원문 전승 형태를 보존해 음역했고, τίτλος τὴν Χαναναίαν은 ‘가나안 여인’으로 직역했습니다.
theological_decisions:
- issue: 윤리적 경고의 수위
  chosen_reading: ‘은’과 ‘여자들의 아름다움’에 대한 경계를 그대로 살려, 탐욕과 성적 유혹을 함께 경계하는 본문의 도덕적 긴장을 유지했습니다.
  alternative_readings:
  - 재물을 사랑하지 말라
  - 여색을 탐하지 말라
  rationale: 원문은 금전과 외적 아름다움 모두를 직접 연결해 경고하므로, 이를 완화하지 않고 병렬 구조로 보존하는 것이 적절합니다.
  doctrine_reference: Wisdom/paraenetic warning in the Testaments tradition
