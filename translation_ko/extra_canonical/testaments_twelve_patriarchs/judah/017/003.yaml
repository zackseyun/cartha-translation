id: T12P.JUD.17.3
reference: Testament of Judah 17:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὅτι καὶ¹⁶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν¹⁷ Ἰούδα σμικρυνθῆναι ποιήσουσιν¹⁸, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/003.yaml
  text: For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which he gave me because of my obedience to my father Jacob.
translation:
  language: ko
  text: 그들은 내 아들들 가운데 있는 지혜로운 사람들까지도 타락시킬 것이며, 유다의 왕국을 약해지게 만들 것입니다. 그 왕국은 내 아버지 야곱에게 순종했기 때문에 그분이 내게 주신 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφοὺς ἄνδρας
  english_pob_choice: wise men
  chosen_korean: 지혜로운 사람들
  alternatives_korean:
  - 지혜로운 남자들
  - 현명한 사람들
  lexicon: σοφός
  rationale: 성별을 불필요하게 좁히지 않으면서도, 아들들 가운데 있는 지도층/현자들을 자연스럽게 드러내기 위해 ‘지혜로운 사람들’로 옮겼습니다.
- source_word: ἀλλοιώσουσι
  english_pob_choice: corrupt
  chosen_korean: 타락시킬 것이며
  alternatives_korean:
  - 변질시킬 것이며
  - 어지럽힐 것이며
  - 변하게 할 것이며
  lexicon: ἀλλοιόω
  rationale: 도덕적·영적 훼손의 뜻이 분명하므로, 단순한 변화보다 강한 ‘타락시키다’가 문맥의 부정적 힘을 잘 살립니다.
- source_word: βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν
  english_pob_choice: cause the kingdom of Judah to be diminished
  chosen_korean: 유다의 왕국을 약해지게 만들 것입니다
  alternatives_korean:
  - 유다의 왕국을 축소되게 할 것입니다
  - 유다 왕국을 작아지게 할 것입니다
  lexicon: σμικρύνω
  rationale: 직역의 ‘축소’보다, 왕권과 국력이 쇠하는 뉘앙스를 담는 ‘약해지게 하다’가 한국어에서 더 자연스럽고 의미를 충분히 전달합니다.
- source_word: ἐν ὑπακοῇ πατρός μου
  english_pob_choice: because of my obedience to my father Jacob
  chosen_korean: 내가 내 아버지 야곱에게 순종했기 때문에
  alternatives_korean:
  - 내 아버지 야곱에게 순종한 것 때문에
  - 내 아버지 야곱께 순종함으로
  lexicon: ὑπακοή
  rationale: ἐν ὑπακοῇ는 원인/근거를 나타내므로 ‘때문에’로 옮겼고, 인물 관계를 분명히 하기 위해 ‘내 아버지 야곱에게’로 자연화했습니다.
theological_decisions:
- issue: 주어가 생략된 마지막 절의 '그분'과 신적 수여의 표지
  chosen_reading: 마지막 절의 주어는 직전 문맥의 ‘주’로 이해되지만, 그리스어 본문은 ‘ἔδωκέ μοι Κύριος’에 해당하는 명시적 신칭이 없으므로 한국어 본문은 ‘그분’으로 두어 과잉 명시를 피했습니다.
  alternative_readings:
  - 주님이 내게 주신 것입니다
  - 야훼께서 내게 주신 것입니다
  rationale: POB의 최신 수정이 지적하듯 여기에는 ‘the Lord’가 추가되어 있지 않으므로, 본문이 말하는 범위를 넘지 않기 위해 비명시적 대명사를 유지합니다.
  doctrine_reference: 본문비평/원문충실성
- issue: ‘유다의 왕국’의 정치·언약적 의미
  chosen_reading: ‘왕국’을 유지해 통치권과 나라의 실체를 함께 드러냈습니다.
  alternative_readings:
  - 나라
  - 왕권
  rationale: 문맥은 단순한 영토가 아니라 지파 유다에 속한 통치 질서를 가리키므로, ‘왕국’이 가장 균형 잡힌 대응입니다.
  doctrine_reference: 언약사적 표현
