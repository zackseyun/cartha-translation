  text: And I know that because of these two things my offspring will be for destruction because of sexual immorality.
translation:
  language: ko
  text: 그리고 나는 이 두 가지 때문에 내 자손이 음행으로 말미암아 멸망에 이를 것을 압니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ οἶδα
  english_pob_choice: And I know
  chosen_korean: 그리고 나는 ... 압니다
  alternatives_korean:
  - 그리고 나는 ... 압니다
  - 그리고 나는 ... 알아요
  lexicon: οἶδα
  rationale: 현재형의 확신을 살려 ‘압니다’로 옮기고, 서술의 연결을 자연스럽게 하기 위해 앞에 ‘그리고’를 두었습니다.
- source_word: διὰ τὰ δύο ταῦτα
  english_pob_choice: because of these two things
  chosen_korean: 이 두 가지 때문에
  alternatives_korean:
  - 이 두 가지로 인해
  - 이 둘 때문에
  lexicon: διά + αιτιατική
  rationale: 원인의 의미를 분명히 드러내되 한국어로는 간결하게 ‘때문에’로 자연스럽게 표현했습니다.
- source_word: τὸ γένος μου
  english_pob_choice: my offspring
  chosen_korean: 내 자손
  alternatives_korean:
  - 내 후손
  - 내 نسل
  lexicon: γένος
  rationale: 가문/혈통의 연속을 가리키는 표현이므로 문맥상 ‘자손’이 가장 자연스럽습니다.
- source_word: εἰς ἀπώλειαν πορνείας
  english_pob_choice: for destruction because of sexual immorality
  chosen_korean: 음행으로 말미암아 멸망에 이를
  alternatives_korean:
  - 음행 때문에 멸망할
  - 음행으로 인해 파멸에 이를
  lexicon: εἰς ἀπώλειαν + πορνεία
  rationale: εἰς ἀπώλειαν의 방향성을 ‘멸망에 이를’로 살리고, πορνείας는 문맥상 ‘음행’으로 옮겨 도덕적/성적 타락의 의미를 유지했습니다.
theological_decisions:
- issue: πορνείας의 범위
  chosen_reading: 성적 불순행위를 포괄하는 ‘음행’으로 번역했습니다.
  alternative_readings:
  - 간음
  - 성적 부도덕
  - 성적 불륜
  rationale: 원어 πορνεία는 단일 행위보다 더 넓은 성적 타락을 가리키므로, 특정 행위로 좁히지 않고 포괄적 표현을 택했습니다.
  doctrine_reference: 성윤리 관련 어휘의 의미 범위 보존
