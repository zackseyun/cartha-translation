id: T12P.JUD.14.6
reference: Testament of Judah 14:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πολλὴ⁴⁰ γὰρ⁴¹ τῷ πίνοντι οἶνον⁴², τέκνα μου⁴³, καὶ αὕτη ἐστὶν ἡ σύνεσις⁴⁴ τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ⁴⁵, πίνει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/006.yaml
  text: 'For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink.'
translation:
  language: ko
  text: 술을 마시는 사람은, 내 자녀들아, 많은 분별이 필요합니다. 이것이 술을 마시는 데 대한 분별입니다. 곧 아직 부끄러움을 아는 동안에는 마시십시오.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὴ ... σύνεσις
  english_pob_choice: has need of much understanding
  chosen_korean: 많은 분별이 필요합니다
  alternatives_korean:
  - 많은 이해가 필요합니다
  - 큰 깨달음이 필요합니다
  lexicon: σύνεσις
  rationale: English POB의 understanding은 단순 지식보다 상황을 가려 판단하는 뜻이 강하므로, 현대 한국어에서는 ‘분별’이 가장 자연스럽고 원문 뉘앙스를 살립니다.
- source_word: τῷ πίνοντι οἶνον
  english_pob_choice: the one who drinks wine
  chosen_korean: 술을 마시는 사람은
  alternatives_korean:
  - 포도주를 마시는 이는
  - 포도주를 마시는 사람은
  lexicon: πίνω / οἶνος
  rationale: οἶνον은 문자적으로 포도주이지만, 고대 문맥의 음료 일반을 고려해 의미를 과장하지 않는 ‘술’로 옮기되, 문장 흐름상 자연스럽게 처리했습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 자녀들이여
  - 내 아이들아
  lexicon: τέκνα
  rationale: 호격의 친밀한 권면을 살리면서도 합쇼체 흐름과 맞게 ‘자녀들아’로 옮겼습니다.
- source_word: ἕως ὅτε ἔχει αἰδῶ
  english_pob_choice: as long as he still has shame
  chosen_korean: 아직 부끄러움을 아는 동안에는
  alternatives_korean:
  - 아직 수치를 아는 동안에는
  - 아직 절도를 지키는 동안에는
  lexicon: αἰδώς
  rationale: αἰδώς는 단순한 ‘수치’보다 도덕적 자제와 절도를 포함하므로, 한국어에서는 ‘부끄러움을 아는’이 그 긴장을 가장 잘 보존합니다.
theological_decisions:
- issue: 술 섭취에 대한 권면의 성격
  chosen_reading: 이 문장은 금주 명령이 아니라, 부끄러움을 잃기 전까지 절제하며 마시라는 제한적 권면으로 읽었습니다.
  alternative_readings:
  - 술을 전반적으로 경계하는 경구로 읽는 해석
  - 술을 마시는 행위 자체를 허용하는 중립적 묘사로만 읽는 해석
  rationale: 원문은 ‘술을 마시는 자’에게 필요한 분별을 말한 뒤 ‘아직 부끄러움을 가질 동안’이라는 조건을 붙여, 행위 자체보다 절제의 한계를 강조합니다.
  doctrine_reference: 절제/절주에 관한 지혜문학적 권면
