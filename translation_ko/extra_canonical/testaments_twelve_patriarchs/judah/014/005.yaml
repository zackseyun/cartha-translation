  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/005.yaml
  text: After drinking the wine, I was not ashamed of the command of God, and I took a Canaanite woman.
translation:
  language: ko
  text: 포도주를 마신 뒤, 나는 하나님의 명령을 부끄러워하지 않았고, 가나안 여인을 맞아들였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  english_pob_choice: After drinking the wine
  chosen_korean: 포도주를 마신 뒤에도
  alternatives_korean:
  - 포도주를 마신 후
  - 그 포도주를 마신 뒤
  lexicon: οἶνος
  rationale: 관사와 완료적 상황을 반영해 ‘그 포도주’를 살릴 수 있지만, 한국어에서는 자연스러운 서술을 위해 ‘포도주를 마신 뒤에도’로 옮겼습니다. '에도'는 뒤따르는 부정과의 대비를 분명히 합니다.
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  english_pob_choice: I was not ashamed of the command of God
  chosen_korean: 나는 하나님의 명령을 부끄러워하지 않았고
  alternatives_korean:
  - 나는 하나님의 명령을 부끄러워하지 않았습니다
  - 나는 하나님의 계명을 부끄러워하지 않았고
  lexicon: ἐντολή
  rationale: POB의 ‘command’를 따라 ‘명령’으로 옮겼습니다. ‘계명’은 율법적·성경본문의 익숙한 어감이 강해, 여기서는 원문의 일반적 ‘명령’ 감각을 유지했습니다.
- source_word: γυναῖκα Χαναναίαν
  english_pob_choice: a Canaanite woman
  chosen_korean: 가나안 여인을 맞아들였습니다
  alternatives_korean:
  - 가나안 여자를 맞이했습니다
  - 가나안 여인을 취했습니다
  lexicon: γυνή
  rationale: 직역의 ‘취했습니다’는 한국어에서 결혼/관계의 의미가 과도하게 노출될 수 있어, 본문 맥락에 맞게 혼인 수용을 드러내는 ‘맞아들였습니다’로 옮겼습니다. ‘여인’은 인칭과 서술의 격을 유지합니다.
theological_decisions:
- issue: 행동 서술의 직접성 유지
  chosen_reading: ‘가나안 여인을 맞아들였습니다’로 혼인 행위를 직설적으로 유지했습니다.
  alternative_readings:
  - ‘가나안 여자를 취했습니다’
  - ‘가나안 여인을 아내로 삼았습니다’
  rationale: 원문은 단순한 만남이 아니라 결혼을 가리키는 서술로 읽히므로, 이를 완곡하게 흐리지 않되 한국어에서 이해 가능한 표현으로 유지했습니다.
  doctrine_reference: 서사 본문의 문자적 사건 진술 원칙
