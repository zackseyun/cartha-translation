  alternative_readings:
  - ‘마음’으로 넓게 옮김
  - ‘심리’로 해석
  rationale: 이 절은 도덕적 감정 상태보다 인간의 판단과 숙고가 흔들리는 효과를 말하므로, 인지적 의미를 드러내는 번역이 원문에 더 가깝습니다.
