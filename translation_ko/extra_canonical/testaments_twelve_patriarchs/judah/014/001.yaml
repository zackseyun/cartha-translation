  lexicon: τὰ δύο ταῦτα
  rationale: 지시대명사와 수사를 자연스럽게 살려, 앞선 문맥에서 가리키는 두 항목이 분명하게 드러나도록 옮겼습니다.
- source_word: ἀφιστῶσι
  english_pob_choice: turn ... away
  chosen_korean: 돌려놓습니다
  alternatives_korean:
  - 멀어지게 합니다
  - 떠나게 합니다
  lexicon: ἀφίστημι
  rationale: 원문의 ‘떼어 놓다/떼다’는 의미를 살리되, 한국어에서 자연스럽게 ‘생각을 다른 데로 돌리다’는 뉘앙스를 전달하도록 했습니다.
