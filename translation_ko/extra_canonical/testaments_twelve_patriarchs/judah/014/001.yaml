  - 인간의 마음
  lexicon: διάνοια
  rationale: διάνοια는 단순한 ‘마음’보다 사고·생각의 작용을 가리키므로, 문맥에 맞게 ‘생각’으로 옮겨 의미를 분명히 했습니다.
theological_decisions:
