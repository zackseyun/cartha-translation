lexical_decisions:
- source_word: τὰ δύο ταῦτα
  english_pob_choice: These two things
  chosen_korean: 이 두 가지
  alternatives_korean:
  - 이 두 것
  - 이 둘
  lexicon: τὰ δύο ταῦτα
  rationale: 지시대명사와 수사를 자연스럽게 살려, 앞선 문맥에서 가리키는 두 항목이 분명하게 드러나도록 옮겼습니다.
- source_word: ἀφιστῶσι
  english_pob_choice: turn ... away
  chosen_korean: 돌려놓습니다
  alternatives_korean:
  - 멀어지게 합니다
  - 떠나게 합니다
  lexicon: ἀφίστημι
  rationale: 원문의 ‘떼어 놓다/떼다’는 의미를 살리되, 한국어에서 자연스럽게 ‘생각을 다른 데로 돌리다’는 뉘앙스를 전달하도록 했습니다.
- source_word: τὴν διάνοιαν τοῦ ἀνθρώπου
  english_pob_choice: a man's mind
  chosen_korean: 사람의 생각
  alternatives_korean:
  - 사람의 마음
  - 인간의 마음
  lexicon: διάνοια
  rationale: διάνοια는 단순한 ‘마음’보다 사고·생각의 작용을 가리키므로, 문맥에 맞게 ‘생각’으로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 인지 기능 표현의 범위
  chosen_reading: διάνοια를 ‘생각’으로 번역해, 정서보다 인지적 방향 전환을 강조했습니다.
  alternative_readings:
  - ‘마음’으로 넓게 옮김
  - ‘심리’로 해석
  rationale: 이 절은 도덕적 감정 상태보다 인간의 판단과 숙고가 흔들리는 효과를 말하므로, 인지적 의미를 드러내는 번역이 원문에 더 가깝습니다.
  doctrine_reference: 인간 이해/의지에 대한 일반적 인간론
