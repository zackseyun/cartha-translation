base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/002.yaml
  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: ko
  text: 만일 누가 포도주를 마셔 취하면, 더러운 생각들로 당신의 마음을 어지럽히고, 성적 부정행위를 향한 쾌락으로 몸을 달아오르게 하며, 죄를 짓고도 부끄러워하지 않습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον ... εἰς μέθην
  english_pob_choice: drink wine to drunkenness
  chosen_korean: 포도주를 마셔 취하면
  alternatives_korean:
  - 포도주를 마셔 술에 취하면
  - 포도주를 마셔 만취하면
  lexicon: οἶνος; μέθη
  rationale: 포도주와 취함의 인과를 자연스럽게 살리되, 과도하게 문어적인 ‘만취’보다 본문 경고의 흐름을 드러내는 표현을 택했습니다.
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου
  english_pob_choice: it throws your mind into turmoil with filthy thoughts
  chosen_korean: 더러운 생각들로 당신의 마음을 어지럽히고
  alternatives_korean:
  - 더러운 생각들로 당신의 이성을 뒤흔들고
  - 더러운 생각들로 당신의 정신을 혼란에 빠뜨리고
  lexicon: διαλογισμοί; ῥυπαρός; συνταράσσω; νοῦς
  rationale: ‘mind’를 단순히 지성보다 인격 전체의 내적 중심으로 보고 ‘마음’으로 옮겼으며, ‘throw into turmoil’의 동사를 한국어 동사구로 압축했습니다.
- source_word: εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  english_pob_choice: heats your body toward pleasure for sexual immorality
  chosen_korean: 성적 부정행위를 향한 쾌락으로 몸을 달아오르게 하며
  alternatives_korean:
  - 음행을 향한 쾌락으로 몸을 달구며
  - 성적 부도덕의 쾌락을 향해 몸을 뜨겁게 하며
  lexicon: πορνεία; ἐκθερμαίνω; ἡδονή
  rationale: πορνεία를 관용적 교회어보다 직설적인 ‘성적 부정행위’로 풀어 본문의 경고성을 유지했고, ἐκθερμαίνει는 ‘달아오르게 하다’로 자연스럽게 옮겼습니다.
- source_word: πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται
  english_pob_choice: it commits sin and is not ashamed
  chosen_korean: 죄를 짓고도 부끄러워하지 않습니다
  alternatives_korean:
  - 죄를 행하고도 부끄러워하지 않습니다
  - 죄를 저지르고도 부끄러워하지 않습니다
  lexicon: πράσσω; ἁμαρτία; αἰσχύνομαι
  rationale: 행위의 지속성을 드러내는 πράσσει를 ‘죄를 짓고도’로 풀었고, 결과적 수치의 부재를 간명하게 전달했습니다.
theological_decisions:
- issue: πορνεία의 번역 범위
  chosen_reading: 성적 부정행위
  alternative_readings:
  - 음행
  - 간음
  rationale: 이 구절은 특정 혼인 간음보다 성욕의 왜곡 전반을 경고하므로, 보다 넓은 범주의 표현이 원문의 경계를 잘 반영합니다.
  doctrine_reference: Lexical scope in moral exhortation passages
- issue: ‘마음’과 ‘몸’의 대응
  chosen_reading: 내적 사고를 ‘마음’, 육체적 반응을 ‘몸’으로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘정신/육체’로 통일
  - 둘 다 ‘마음/몸’보다 직역에 가깝게 처리
  rationale: 본문이 생각의 혼란과 몸의 달아오름을 대조하므로, 한국어에서도 심리적·육체적 층위를 분명히 드러내는 것이 효과적입니다.
  doctrine_reference: Anthropological parallelism in moral exhortation
