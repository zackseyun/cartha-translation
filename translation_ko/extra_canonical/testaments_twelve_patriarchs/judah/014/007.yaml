id: T12P.JUD.14.7
reference: Testament of Judah 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ⁴⁶ τὸν ὅρον, ἐμβάλλει⁴⁸ εἰς⁴⁹ τὸν νοῦν αὐτοῦ⁵⁰ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν⁵¹ καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι⁵³ τῇ ἀτιμίᾳ⁵⁴ καὶ νομίζειν εἶναι καλόν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/007.yaml
  text: But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and not feel shame, but rather boast in his dishonor and think it good.
translation:
  language: ko
  text: 그런데 그가 그 한계를 넘어서게 되면, 미혹의 영이 그의 마음에 들어와 술 취한 사람으로 하여금 수치스러운 말을 하게 하고 법 없이 행하게 하며 부끄러워하지 않게 할 뿐 아니라, 오히려 그의 치욕을 자랑하며 그것이 좋다고 여기게 합니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ὅρον
  english_pob_choice: the limit
  chosen_korean: 그 한계를
  alternatives_korean:
  - 그 경계를
  - 그 한도을
  lexicon: ὅρος
  rationale: 문맥상 음주의 분량이나 절제를 넘는 ‘한계’를 가리키므로, 자연스러운 현대어로 옮겼습니다.
- source_word: τὸ πνεῦμα τῆς πλάνης
  english_pob_choice: a spirit of deception
  chosen_korean: 미혹의 영
  alternatives_korean:
  - 기만의 영
  - 속임의 영
  lexicon: πνεῦμα
  rationale: πλάνη의 핵심 의미는 단순한 deception보다 사람을 그릇된 길로 이끄는 ‘미혹’이어서, 본문의 영적 작용을 더 직접적으로 드러내는 표현을 택했습니다.
- source_word: αἰσχρορρημονεῖν καὶ παρανομεῖν
  english_pob_choice: speak shamefully and act lawlessly
  chosen_korean: 수치스러운 말을 하게 하고 법 없이 행하게 하며
  alternatives_korean:
  - 추한 말을 하게 하고 불법을 행하게 하며
  - 부끄러운 말을 하게 하고 율법을 어기게 하며
  lexicon: αἰσχρορρημονεῖν / παρανομεῖν
  rationale: 첫 동사는 말을, 둘째 동사는 행위를 가리키므로 한국어에서도 병렬 구조를 살려 각각 ‘수치스러운 말’과 ‘법 없이 행하다’로 구분했습니다.
- source_word: μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ
  english_pob_choice: not feel shame, but rather boast in his dishonor
  chosen_korean: 부끄러워하지 않게 할 뿐 아니라, 오히려 그의 치욕을 자랑하며
  alternatives_korean:
  - 부끄러워하지 않게 할 뿐 아니라, 오히려 그의 수치를 자랑하며
  - 수치심을 느끼지 않게 하고 오히려 그의 욕됨을 자랑하며
  lexicon: αἰσχύνεσθαι / καυχᾶσθαι / ἀτιμία
  rationale: αἰσχύνεσθαι는 감정적 ‘부끄러워하다’로, ἀτιμία는 단순한 shame보다 공개적 ‘치욕/욕됨’의 뉘앙스가 있어 이를 살렸습니다.
theological_decisions:
- issue: ‘미혹의 영’의 성격
  chosen_reading: 문맥상 이 영은 단순한 심리 상태가 아니라 사람을 죄와 수치로 끌고 가는 실제적 영적 작용으로 제시됩니다.
  alternative_readings:
  - 비유적 표현으로만 이해하는 읽기
  - 도덕적 타락의 은유로만 보는 읽기
  rationale: 본문이 ‘마음에 들어와’ 술 취한 사람을 특정 행위들로 이끈다고 서술하므로, 존재론적 실재성을 약화하지 않고 번역했습니다.
  doctrine_reference: 영적 존재와 유혹에 대한 본문 서술의 직접성
- issue: ‘법 없이 행하다’의 윤리적 강도
  chosen_reading: παρανομεῖν은 단순한 규범 위반보다 질서와 법을 벗어난 행위를 뜻하므로, 지나치게 완화하지 않고 ‘법 없이 행하다’로 옮겼습니다.
  alternative_readings:
  - ‘율법을 어기다’로 종교법 중심 해석
  - ‘무례하게 행동하다’로 완화하는 해석
  rationale: 이 문맥에서는 행위의 도덕적·법적 무질서를 강조하므로, 본문의 강도를 유지하는 번역이 적절합니다.
  doctrine_reference: 도덕적 타락과 무질서에 대한 본문적 묘사
