revisions:
- from: 그런데 그가 그 한계를 넘어서게 되면, 미혹의 영이 그의 마음에 들어와 술 취한 사람으로 하여금 수치스러운 말을 하게 하고 법 없이 행하게 하며 부끄러워하지 않게 할 뿐 아니라, 오히려 그의 치욕을 자랑하며 그것이 좋다고 여기게 합니다.[a][b]
  to: 그러나 그가 그 한계를 넘으면, 미혹의 영이 그의 마음에 들어와 술 취한 사람이 추잡한 말을 하고 불법을 행하며 부끄러워하지 않을 뿐 아니라, 도리어 자신의 치욕을 자랑하고 그것을 좋은 것으로 여기게 합니다.
  rationale: 문장의 의미와 인과 구조를 유지하면서, 불자연스러운 ‘법 없이 행하다’를 ‘불법을 행하다’로 바로잡았습니다. 또한 원문의 연속된 부정·대조 구조(부끄러워하지 않고, 도리어 치욕을 자랑하며 그것을 좋게 여김)를 한국어에서 명료하게 재구성했고, 근거 없는 각주 표지를 삭제했습니다.
