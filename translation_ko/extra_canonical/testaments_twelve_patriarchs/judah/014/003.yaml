    rationale: Τοιοῦτός는 앞 문맥을 받는 지시어이며, ὁ πάροινος가 그와 같다는 진술입니다. ‘이와 같은 것이 … 술꾼입니다’는 이를 반대로 구성하여 의미 전달을 흐립니다.
