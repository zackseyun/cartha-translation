id: T12P.JUD.14.3
reference: Testament of Judah 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός²³ ἐστιν ὁ πάροινος²⁴, τέκνα μου, ὅτι ὁ μεθύων²⁵ οὐκ αἰδεῖται οὐδένα²⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/003.yaml
  text: Such is the wine-drinker, my children, because the drunkard respects no one.
translation:
  language: ko
  text: 이와 같은 것이, 내 자녀들아, 술꾼입니다. 왜냐하면 술 취한 자는 아무도 존중하지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοιοῦτός ἐστιν ὁ πάροινος
  english_pob_choice: Such is the wine-drinker
  chosen_korean: 이와 같은 것이, … 술꾼입니다
  alternatives_korean:
  - 이와 같은 사람은 술을 마시는 사람입니다
  - 이런 자가 바로 술꾼입니다
  lexicon: πάροινος
  rationale: πάροινος는 단순한 음주자가 아니라 술에 빠진 사람을 가리키므로, 영어 POB의 wine-drinker를 한국어로는 도덕적 뉘앙스가 드러나는 술꾼으로 옮겼습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 나의 자녀들아
  lexicon: τέκνα
  rationale: 직접 호소하는 부름말이므로 한국어 자연성을 살려 ‘내 자녀들아’로 옮기고, 복수 호격의 친근한 어조를 유지했습니다.
- source_word: ὁ μεθύων
  english_pob_choice: the drunkard
  chosen_korean: 술 취한 자
  alternatives_korean:
  - 술꾼
  - 취한 사람
  lexicon: μεθύων
  rationale: 현재분사형을 상태·성향을 나타내는 명사화로 처리해, 반복적 술 취함을 뜻하는 표현이 되도록 했습니다.
- source_word: οὐκ αἰδεῖται οὐδένα
  english_pob_choice: respects no one
  chosen_korean: 아무도 존중하지 않기 때문입니다
  alternatives_korean:
  - 아무도 부끄러워하지 않기 때문입니다
  - 아무도 예의하지 않기 때문입니다
  lexicon: αἰδέομαι
  rationale: αἰδέομαι는 단순한 ‘존중’보다 수치·경외·배려의 결여를 포함하지만, 문맥상 사람을 가리지 않는 무례함을 간결하게 드러내는 ‘존중하지 않다’가 가장 직접적입니다.
theological_decisions:
- issue: 술 취함의 도덕적 평가를 어떤 어조로 전달할지
  chosen_reading: ‘술꾼’과 ‘아무도 존중하지 않기 때문입니다’로, 경고문답체의 단호한 비난을 유지했습니다.
  alternative_readings:
  - 좀 더 중립적으로 ‘술을 마시는 사람’으로 완화
  - ‘부끄러워하지 않는다’로 심리적 뉘앙스를 전면화
  rationale: 이 절은 단순 묘사가 아니라 아버지의 교훈적 경고이므로, 원문의 윤리적 평가를 약화시키지 않는 방향이 필요합니다.
  doctrine_reference: 지혜문학적 경고와 덕목/악덕 대비
