  source_fidelity: 첫 문장의 Τοιοῦτός ἐστιν ὁ πάροινος는 앞선 내용을 가리켜 ‘술꾼도 이와 같습니다’라고 옮기는 것이 자연스럽습니다. 초안의 ‘이와 같은 것이 … 술꾼입니다’는 한국어 문장 구조상 술꾼을 ‘것’과 동일시하여 원문의 지시 관계를 불명확하게 만듭니다. δεύτε 문장은 ‘아무도 존중하지 않는다’로 αἰδεῖται οὐδένα를 적절히 전달합니다.
  naturalness: ‘내 자녀들아’라는 호격은 교훈적 문맥에 어울립니다. 다만 ‘이와 같은 것이, … 술꾼입니다’는 비문에 가까우므로, 자연스러운 주제 표지와 지시 표현으로 고쳐야 합니다.
  terminology: πάροινος는 ‘술꾼’, ὁ μεθύων은 ‘술에 취한 사람’으로 구별하여 옮겼습니다. αἰδέομαι의 존경·거리낌의 의미는 ‘존중하다’로 무리 없이 보존됩니다.
