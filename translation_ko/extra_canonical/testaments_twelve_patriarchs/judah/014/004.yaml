id: T12P.JUD.14.4
reference: Testament of Judah 14:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν²⁹ μὴ αἰσχυνθῆναι τὸ πλῆθος³⁰ πόλεως⁴⁹ ὅτι ἐν⁵¹ ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν³² μεγάλην³³, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/004.yaml
  text: For behold, it also led me astray, so that I was not ashamed before the multitude of the city. For in the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.
translation:
  language: ko
  text: 보십시오, 그것이 저마저 잘못된 길로 이끌어 성읍의 많은 사람들 앞에서 부끄러움을 느끼지 않게 했습니다. 모든 사람의 눈앞에서 제가 다말에게로 빗나갔고, 큰 죄를 지었으며, 제 아들들의 부정함을 가리는 덮개를 벗겨 드러냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ γάρ / For behold
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보라
  lexicon: source-note
  rationale: 감탄·주의 환기를 나타내는 도입부를 한국어 합쇼체로 자연스럽게 살리되, 원문의 강조를 흐리지 않도록 간결하게 옮겼습니다.
- source_word: ἐπλάνησεν
  english_pob_choice: led me astray
  chosen_korean: 저를 잘못 인도하여
  alternatives_korean:
  - 저를 속여
  - 저를 길을 잃게 하여
  lexicon: source-note
  rationale: 단순한 심리적 혼란보다 ‘잘못된 길로 이끎’의 의미가 분명하므로, 도덕적·행위적 오차를 드러내는 표현을 택했습니다.
- source_word: τὸ πλῆθος πόλεως
  english_pob_choice: the multitude of the city
  chosen_korean: 성읍의 무리
  alternatives_korean:
  - 도시의 무리
  - 성읍의 사람들
  lexicon: source-note
  rationale: πλῆθος의 ‘무리’와 πόλις/πόλεως의 도시-공동체 배경을 함께 살리기 위해 ‘성읍’으로 옮겼습니다.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  english_pob_choice: I uncovered the covering of uncleanness of my sons
  chosen_korean: 제 아들들의 부정함의 덮개를 벗겨 드러냈습니다
  alternatives_korean:
  - 제 아들들의 더러움의 가리개를 벗겼습니다
  - 제 아들들의 부정의 덮개를 열었습니다
  lexicon: source-note
  rationale: 직역을 유지하되, κάλυμμα와 ἀκαθαρσία의 물질적·도덕적 이중성을 살려 ‘덮개’와 ‘부정함’을 함께 반영했습니다.
theological_decisions:
- issue: 죄 고백의 누적 구조
  chosen_reading: ‘큰 죄를 지었으며’로 ἁμαρτίαν μεγάλην을 그대로 드러내어, 단순한 실수보다 중대한 범죄 고백으로 유지했습니다.
  alternative_readings:
  - 큰 잘못을 저질렀으며
  - 큰 죄를 범했으며
  rationale: 원문과 영어 본문 모두 죄의 중대성을 강조하므로, 고백적 톤을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 죄와 회개의 진술
