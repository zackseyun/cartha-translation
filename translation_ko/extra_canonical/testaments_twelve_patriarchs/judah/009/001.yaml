  text: IX. *Δέκα καὶ ὀκτὼ¹ ἔτη ἐποίησεν δὲ² εἰρήνην³ ὁ⁴ πατὴρ μου⁵ μετὰ τοῦ ἀδελφοῦ αὐτοῦ Ἡσαῦ⁶ καὶ οἱ⁷ υἱοὶ αὐτοῦ μεθ᾽ ἡμῶν μετὰ⁸ τὸ ἐλθεῖν ἡμᾶς ἀπὸ⁹ Μεσοποταμίας ἀπὸ Λαβάν¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/001.yaml
  text: For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.
translation:
  language: ko
  text: 열여덟 해 동안 제 아버지는 자기 형 에서와 평화를 이루었고, 우리가 메소포타미아에서, 라반에게서 온 뒤에는 그의 아들들도 우리와 함께 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέκα καὶ ὀκτὼ ἔτη
  english_pob_choice: eighteen years
  chosen_korean: 열여덟 해 동안
  alternatives_korean:
  - 열여덟 년 동안
  - 18년 동안
  lexicon: 수사/시간 표현
  rationale: 문맥상 기간을 자연스럽게 나타내기 위해 ‘~해 동안’을 썼고, 고유한 서술 리듬을 유지했습니다.
- source_word: ἐποίησεν δὲ εἰρήνην
  english_pob_choice: made peace
  chosen_korean: 평화를 이루었고
  alternatives_korean:
  - 평화를 만들었고
  - 화해하였고
  lexicon: εἰρήνη
  rationale: 직역보다 한국어에서 자연스럽고, ‘평화’를 단순 상태가 아니라 관계 회복의 결과로 드러내기 위해 ‘이루다’를 택했습니다.
- source_word: μετὰ τοῦ ἀδελφοῦ αὐτοῦ Ἡσαῦ
  english_pob_choice: with his brother Esau
  chosen_korean: 자기 형 에서와
  alternatives_korean:
  - 그의 형 에서와
  - 형 에서와
  lexicon: 관계/호칭
  rationale: ‘ἀδελφός’의 관계를 분명히 하되, 소유대명사를 살려 서술의 초점을 아버지에게 유지했습니다.
- source_word: ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν
  english_pob_choice: from Mesopotamia, from Laban
  chosen_korean: 메소포타미아에서, 라반에게서
  alternatives_korean:
  - 메소포타미아로부터, 라반으로부터
  - 메소포타미아에서, 라반으로부터
  lexicon: 전치사 ἀπό
  rationale: 같은 전치사가 지명과 인물에 각각 붙어 있음을 반영해 출발점과 출처를 모두 살리되, 한국어에서는 ‘에서/에게서’로 구분했습니다.
theological_decisions:
- issue: ‘평화’의 관계적 의미
  chosen_reading: 단순 정전 상태보다 가족 간의 화해와 관계 회복을 포함하는 표현으로 옮겼습니다.
  alternative_readings:
  - 정치적 평화로만 이해
  - 내적 평안으로 축소
  rationale: 본문의 문맥은 에서와의 관계를 가리키므로, 한국어에서도 관계적 화해의 뉘앙스를 유지하는 것이 적절합니다.
  doctrine_reference: 서사 문맥상 화해/평강의 관계적 사용
