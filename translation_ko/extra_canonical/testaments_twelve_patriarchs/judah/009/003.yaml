review_pass:
  verdict: revise
  source_fidelity: 그리스어 원문은 δεύτε 절에서 ἤρθη ὁ νεκρός, 곧 ‘죽은 이가 들어 올려졌다/옮겨졌다’를 말합니다. 초안의 ‘그가 … 죽었습니다’는 ‘들려 올려졌다’라는 수동 동작을 ‘죽었다’라는 결과로 바꾸므로 원문에 충실하지 않습니다. 영어 POB의 ‘he fell … dead’도 현 제공된 그리스어 본문과 일치하지 않지만, 원문 우선 원칙에 따라 이를 따르지 않았습니다.
  naturalness: ‘활로 에서를 쳤고’와 ‘세일 산에서 들어 올려졌습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘죽은 에서’는 원문의 정관사구가 앞선 에서를 가리키는 문맥을 한국어에서 명료하게 나타냅니다.
  terminology: 야곱, 에서, 세일 산은 통용되는 성경식 고유명사 표기를 유지했습니다. ἤρθη의 의미 범위(들어 올리다/옮기다)를 본문에서는 가장 직접적인 ‘들어 올려지다’로 옮기고, 각주에서 대안을 밝혔습니다.
  issues:
  - severity: high
    issue: ἤρθη ὁ νεκρός의 동작 의미가 ‘죽었습니다’로 대체됨
    rationale: ἤρθη는 ἐγείρω의 부정과거 수동태로, 죽은 이가 ‘들려 올려졌다’ 또는 문맥상 ‘옮겨졌다’는 동작을 뜻합니다. 단순한 사망 진술은 원문에 없는 의미 변화입니다.
  - severity: medium
    issue: 영어 POB 감사 문구의 ‘fell ... dead’가 제공된 그리스어 본문과 불일치함
    rationale: 영어 문구는 ‘쓰러졌다’는 동작을 제시하지만, 제공된 원문은 ἤρθη(들려 올려졌다)를 사용합니다. 한국어는 원문을 우선해 번역해야 합니다.
  revised_text: 그리고 야곱이 활로 에서를 쳤고, 죽은 에서는 세일 산에서 들어 올려졌습니다.[a]
  revised_footnotes:
  - marker: a
    text: ‘들어 올려졌습니다’(그리스어 ἤρθη)는 문맥에 따라 ‘옮겨졌습니다’로도 옮길 수 있습니다. 제공된 그리스어 본문은 그가 쓰러졌다고 말하지 않습니다.
    reason: ἤρθη의 수동 동작과 가능한 의미 범위를 밝혀, 영어 감사 문구와의 차이를 숨기지 않고 원문의 모호성을 보존합니다.
  revision_rationale: 둘째 절을 제공된 그리스어 본문에 맞추어 수동 동작으로 바로잡았습니다. 앞 절의 ‘야곱이 활로 에서를 쳤고’는 ἔπαισεν ἐν τόξῳ를 과도하게 구체화하지 않고 자연스럽게 보존합니다. ‘죽은 에서’는 ὁ νεκρός가 직전의 에서를 지시하는 문맥을 반영하며, 사망 원인이나 방식은 덧붙이지 않습니다.
