source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ ἔπαισεν¹⁸ ἐν τόξῳ Ἰακὼβ τὸν Ἡσαῦ, καὶ¹⁹ ἤρθη ὁ νεκρὸς²⁰ ἐν ὄρει Σεείρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/003.yaml
  text: And Jacob struck Esau with a bow, and he fell by Jacob's bow, dead on Mount Seir.
translation:
  language: ko
  text: 그리고 야곱이 활로 에서를 쳤고, 그가 야곱의 활에 맞아 세일 산에서 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπαισεν ἐν τόξῳ
  english_pob_choice: struck ... with a bow
  chosen_korean: 활로 쳤고
  alternatives_korean:
  - 활로 맞혔고
  - 활로 쏘았고
  lexicon: ἔπαισεν
  rationale: ἔπαισεν은 단순히 '쳤다/타격했다'는 뜻이므로, 활을 수단으로 한 공격을 간결하게 드러내되 활의 사용을 과장하지 않도록 '활로 쳤고'로 옮겼습니다.
- source_word: ἤρθη ὁ νεκρός
  english_pob_choice: he fell ... dead
  chosen_korean: 그가 ... 죽었습니다
  alternatives_korean:
  - 그가 ... 쓰러져 죽었습니다
  - 그는 ... 죽은 채로 있었습니다
  lexicon: ἤρθη ὁ νεκρός
  rationale: 원문은 '죽은 자가 일어났다/들려졌다'는 수동 표현을 통해 결과를 말하므로, 영어 POB의 'dead'를 따라 결과 상태를 분명히 하되 불필요한 해석을 덧붙이지 않았습니다.
- source_word: ἐν ὄρει Σεείρ
  english_pob_choice: on Mount Seir
  chosen_korean: 세일 산에서
  alternatives_korean:
  - 세일 산 위에서
  - 세일 산에서
  lexicon: ὄρει Σεείρ
  rationale: 지명과 장소 전치사는 자연스러운 한국어 관용에 맞춰 '세일 산에서'로 옮겼습니다.
- source_word: Ἰακὼβ / Ἡσαῦ
  english_pob_choice: Jacob / Esau
  chosen_korean: 야곱 / 에서
  alternatives_korean:
  - 야곱 / 에사오
  lexicon: 고유명사
  rationale: 성경에서 널리 정착된 한국어 음역을 사용해 독자가 즉시 인지할 수 있게 했습니다.
theological_decisions:
- issue: 반복된 '야곱의 활' 표현의 처리
  chosen_reading: 첫 절반은 '야곱이 활로 에서를 쳤고', 뒤에는 '그가 야곱의 활에 맞아'로 반복을 살려 원문의 중복 강조를 유지했습니다.
  alternative_readings:
  - '''야곱이 에서를 활로 쳐서 죽였고''처럼 한 번에 정리하는 번역'
  rationale: 원문과 영어 POB 모두 활의 소유격 반복을 유지해 사건의 직접성과 서술의 리듬을 드러내므로, 이를 삭제하지 않고 살렸습니다.
  doctrine_reference: 서사적 반복과 강조의 보존
