source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ⁴⁰ Ῥουβὶμ καὶ⁴¹ ὁ Γὰδ ἀνεῖλον ἑτέρους ἕξ⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/006.yaml
  text: And Reuben and Gad killed another six. Then they entered in succession.
translation:
  language: ko
  text: 르우벤과 갓이 다른 여섯 명도 죽였습니다. 그리고 그들은 차례로 들어갔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ Ῥουβὶμ καὶ ὁ Γὰδ
  english_pob_choice: And Reuben and Gad
  chosen_korean: 르우벤과 갓
  alternatives_korean:
  - 루벤과 갓
  - 르우벤과 길르앗
  lexicon: 고유명사
  rationale: 히브리 성경 인명 관용을 따라 르우벤과 갓으로 옮겼으며, 접속 구조는 단순 병렬로 유지했습니다.
- source_word: ἀνεῖλον
  english_pob_choice: killed
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽였습니다
  - 죽였고
  lexicon: ἀναιρέω
  rationale: 폭력적 결과를 분명히 드러내되, 과도하게 해석하지 않고 평서형으로 옮겼습니다.
- source_word: ἑτέρους ἕξ
  english_pob_choice: another six
  chosen_korean: 다른 여섯 명도
  alternatives_korean:
  - 또 여섯 명을
  - 추가로 여섯 명을
  lexicon: ἕτερος + ἕξ
  rationale: ἕτερος의 ‘다른/추가의’ 의미를 살려 앞선 수량에 더해진 여섯 명임을 드러냈습니다.
- source_word: Then they entered in succession.
  english_pob_choice: Then they entered in succession.
  chosen_korean: 그리고 그들은 차례로 들어갔습니다
  alternatives_korean:
  - 그 뒤 그들은 차례로 들어갔습니다
  - 그리고 이어서 순서대로 들어갔습니다
  lexicon: 연속 동작 서술
  rationale: 영문 POB가 보존한 후속 동작을 한국어에서도 순차적 연결로 반영했습니다.
theological_decisions:
- issue: 폭력 서술의 직역 정도
  chosen_reading: 본문의 직접적 행위 서술을 완화하지 않고 ‘죽였습니다’로 유지했습니다.
  alternative_readings:
  - ‘없앴습니다’처럼 완곡하게 처리
  - 의미를 넓혀 ‘처치했습니다’로 번역
  rationale: 원문은 전투/살해 행위를 직접적으로 진술하므로, 독자가 텍스트의 강도를 그대로 인식하도록 했습니다.
  doctrine_reference: 서사 본문의 사실 진술 보존
- issue: 문장 분할과 후속 행위 연결
  chosen_reading: 살해 진술과 진입 진술을 분리하되 ‘그리고’로 이어 연속성을 보존했습니다.
  alternative_readings:
  - 한 문장으로 과도하게 압축
  - 후속 절을 생략
  rationale: 영문 POB의 두 동작 구조를 따라 서술의 진행감을 유지했습니다.
  doctrine_reference: 서사 흐름 보존
