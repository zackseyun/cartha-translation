  text: Then they asked us for terms of peace, and after counsel had been taken with our father, we accepted them.
translation:
  language: ko
  text: 그때 그들은 우리에게 평화를 위한 조건을 요구했습니다. 그리고 우리 아버지와 의논한 뒤, 우리는 그들을 조공을 바치는 자들로 받아들였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조공을 바치는 자들’은 그리스어 ὑποφόρους를 옮긴 것으로, 조공이나 공물을 바쳐야 하는 종속적 지위를 가리킵니다.
    reason: 원문의 ὑποφόρους가 나타내는 정치적·경제적 종속 관계를 보존하고 설명합니다.
lexical_decisions:
- source_word: αἰτοῦσιν αὐτὸ ἡμᾶς τὰ πρὸς εἰρήνην
  english_pob_choice: they asked us for terms of peace
  chosen_korean: 우리에게 평화의 조건을 요구했습니다
  alternatives_korean:
  - 우리에게 평화를 위한 조건을 물었습니다
  - 우리에게 평화와 관련된 것을 요청했습니다
  lexicon: αἰτέω / τὰ πρὸς εἰρήνην
  rationale: αἰτεῖν은 단순한 문의보다 요청·요구의 뉘앙스가 강하고, τὰ πρὸς εἰρήνην은 협정의 실질적 조건을 가리키므로 자연스러운 한국어로 ‘평화의 조건’을 택했습니다.
- source_word: γενομένης βουλῆς μετὰ τοῦ πατρὸς ἡμῶν
  english_pob_choice: after counsel had been taken with our father
  chosen_korean: 우리 아버지와 함께 의논이 이루어진 뒤
  alternatives_korean:
  - 우리 아버지와 상의한 뒤
  - 우리 아버지와 함께 회의가 열린 뒤
  lexicon: βουλή / γίνομαι + μετά
  rationale: βουλή는 단순한 감정이 아니라 숙의·의논을 뜻하므로, 수동적 절차를 살린 ‘의논이 이루어진 뒤’로 옮겼습니다.
- source_word: ὑποδεξάμενοι αὐτοὺς ὑποφόρους
  english_pob_choice: we accepted them
  chosen_korean: 우리는 그들을 받아들였습니다
  alternatives_korean:
  - 우리는 그들을 맞아들였습니다
  - 우리는 그들을 받아들여 종속시켰습니다
  lexicon: ὑποδέχομαι / ὑποφόρους
  rationale: 본문 전승은 간단히 ‘받아들이다’로 읽히지만, 뒤의 ὑποφόρους가 함의하는 종속성은 본문이 과장하지 않도록 본문 번역에는 드러내지 않고 주석적 부담으로 남겼습니다.
theological_decisions:
- issue: 평화 협상과 수용의 서술을 어떻게 직접적으로 옮길지
  chosen_reading: 전승 문맥의 정치적·가족적 협상 장면으로 읽고, 종교적 완곡화 없이 ‘평화의 조건’과 ‘의논’을 직접적으로 표현했습니다.
  alternative_readings:
  - ‘평화를 청하는 말’을 더 완곡하게 표현하는 방식
  - ‘조약 조건’처럼 현대 외교 용어로 치환하는 방식
  rationale: 이 절은 신학적 교리보다 서사적 사실 진술이 중심이므로, 원문이 가진 협상성과 가족 회의의 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 서사 문맥 보존; 번역의 직역-의미 균형
