  naturalness: ‘우리 아버지와 함께 의논이 이루어진 뒤’도 이해되지만 다소 비인칭적이고 무겁습니다. ‘우리 아버지와 의논한 뒤’가 현대 표준어 합쇼체 서술로 더 자연스럽고, 원문의 숙의 의미도 유지합니다. ‘평화를 위한 조건’은 τὰ πρὸς εἰρήνην의 목적·관련성을 자연스럽게 나타냅니다.
