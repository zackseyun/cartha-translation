  text: And when the eighteen years were fulfilled, Esau, my father's brother, returned to us with a large and strong people.
translation:
  language: ko
  text: 그리고 열여덟 해가 차자, 내 아버지의 형제인 에서는 큰고 강한 백성과 함께 우리에게로 돌아왔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπανῆλθεν
  english_pob_choice: returned to us
  chosen_korean: 우리에게로 돌아왔습니다
  alternatives_korean:
  - 우리에게 왔습니다
  - 우리에게 돌아왔습니다
  lexicon: ἐπανέρχομαι
  rationale: 재귀적·반복적 뉘앙스를 살려 ‘돌아왔습니다’로 옮기되, 목적어 방향을 분명히 하려고 ‘우리에게로’를 붙였습니다.
- source_word: Ἡσαῦ ὁ ἀδελφὸς τοῦ πατρός μου
  english_pob_choice: Esau, my father's brother
  chosen_korean: 내 아버지의 형제인 에서는
  alternatives_korean:
  - 에서는 내 아버지의 형제입니다
  - 내 아버지의 형제 에서는
  lexicon: Ἡσαῦ / ἀδελφός
  rationale: 서술 흐름에 맞게 동격 구조를 자연스럽게 풀어, 인물 식별 정보를 앞뒤로 어색하지 않게 배치했습니다.
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  english_pob_choice: with a large and strong people
  chosen_korean: 큰고 강한 백성과 함께
  alternatives_korean:
  - 크고 강한 백성과 함께
  - 무거운고 강한 백성과 함께
  lexicon: λαός / βαρύς / ἰσχυρός
  rationale: λαός는 ‘백성’으로 두고, βαρεῖ는 여기서 물리적 ‘무거움’보다 규모와 압박감을 포함하는 집단적 중량감을 나타내므로 ‘큰’으로 옮겼습니다.
