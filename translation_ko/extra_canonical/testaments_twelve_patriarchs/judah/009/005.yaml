id: T12P.JUD.9.5
reference: Testament of Judah 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ ὡς οὐκ ἠνοίγον ἡμέρας εἴκοσι, δρώντων αὐτῶν²⁹ προσάγω³⁰ κλίμακα³¹ καὶ παραβησθεὶς³² *τὴν ἀσπίδα ἐπὶ τῆς κεφαλῆς μου³³ καὶ³⁴ ἀνῆλθον³⁵, *ἀποδεχόμενος ἀπὸ τοίχου λίθους³⁶ καὶ³⁷ ἀνεῖλον³⁸ τέσσαρας πόλει αὐτῶν δυνάστας³⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/005.yaml
  text: And because they did not open to us after twenty days, while they were watching, I brought a ladder; and placing my shield over my head and receiving the stones, I went up and killed four of their mighty men.
translation:
  language: ko
  text: 그들이 이십 일이 지나도록 우리에게 문을 열어 주지 않자, 그들이 지켜보는 동안 나는 사다리를 가져왔습니다. 그리고 방패를 머리 위에 얹고 성벽에서 오는 돌들을 받아 내면서 올라가, 그들의 성읍에서 그들의 용사 네 명을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσάγω κλίμακα
  english_pob_choice: I brought a ladder
  chosen_korean: 사다리를 가져왔습니다
  alternatives_korean:
  - 사다리를 끌고 왔습니다
  - 사다리를 들고 왔습니다
  - 사다리를 가져다 놓았습니다
  lexicon: προσάγω + κλίμακα
  rationale: 여기서 προσάγω는 ‘가져오다/가져다 놓다’의 의미가 자연스럽고, 영어 POB의 수정본도 ‘brought a ladder’로 정리되어 있어 그 흐름을 반영했습니다.
- source_word: παραβησθεὶς τὴν ἀσπίδα ἐπὶ τῆς κεφαλῆς μου
  english_pob_choice: placing my shield over my head
  chosen_korean: 방패를 머리 위에 얹고
  alternatives_korean:
  - 방패를 머리 위로 비껴 쓰고
  - 방패를 머리 위에 두르고
  - 방패를 머리 위에 올리고
  lexicon: παραβησθεὶς + ἀσπίδα
  rationale: 방패를 머리 위에 두어 돌을 막는 동작을 간결하게 살리기 위해 ‘얹고’로 옮겼습니다. 기술적 묘사이므로 과도한 해석은 피했습니다.
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  english_pob_choice: receiving the stones
  chosen_korean: 돌들을 맞아 가며
  alternatives_korean:
  - 돌들을 받아 가며
  - 벽에서 날아오는 돌들을 받으며
  - 돌을 맞으면서
  lexicon: ἀποδέχομαι
  rationale: 문맥상 단순히 ‘받다’보다, 성벽 위에서 날아오는 돌을 맞으며 올라가는 상황을 드러내는 표현이 필요해 ‘맞아 가며’로 자연스럽게 옮겼습니다.
- source_word: δυνάστας
  english_pob_choice: mighty men
  chosen_korean: 용사
  alternatives_korean:
  - 권세자들
  - 강한 자들
  - 유력자들
  lexicon: δυνάστης
  rationale: 군사적 문맥에서 δυνάστας는 ‘용사들’이 가장 직접적이고 읽기 쉬우며, 영어 POB의 ‘mighty men’에도 부합합니다.
theological_decisions:
- issue: 이 본문은 서사적 전투 묘사로, 별도의 교리적 용어를 표준화할 필요가 있는지 여부
  chosen_reading: 서사 동작을 그대로 살려 군사적 긴장감을 유지했습니다.
  alternative_readings:
  - 상징적으로 완화해 번역하기
  - 도덕적 평가를 덧붙이기
  rationale: 원문은 사건 전개를 묘사하는 서술이므로, 의미를 덧붙이거나 완화하지 않고 직접적으로 전달하는 것이 가장 충실합니다.
  doctrine_reference: 서사 본문 일반 원칙
- issue: ‘그들이 우리에게 문을 열어 주지 않았다’의 인칭 범위
  chosen_reading: ‘우리에게’로 번역해 집단적 대립 구도를 유지했습니다.
  alternative_readings:
  - ‘나에게’로 축소하기
  - 주어를 생략하기
  rationale: 영어 POB와 그리스어 복수 구조가 공동체/동료를 포함한 상황을 암시하므로, 인칭 범위를 보존했습니다.
  doctrine_reference: 문맥 기반 서술 보존
