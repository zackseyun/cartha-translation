base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/004.yaml
  text: And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting around it, we besieged it.
translation:
  language: ko
  text: 그리고 우리는 에서의 아들들을 추격하였습니다. 그들에게도 견고한 성읍이 있었고, 우리는 그 안으로 들어갈 수 없었습니다. 그러나 그 성읍 주위에 자리 잡고 포위하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδιώξαμεν τοὺς υἱοὺς Ἡσαῦ
  english_pob_choice: we pursued the sons of Esau
  chosen_korean: 우리는 에서의 아들들을 추격하였습니다
  alternatives_korean:
  - 우리는 에서의 아들들을 뒤쫓았습니다
  - 우리는 에서의 자손들을 추격하였습니다
  lexicon: κατεδιώξαμεν / υἱοὺς Ἡσαῦ
  rationale: 동사의 강한 추적·추격 뉘앙스를 살려 ‘추격하다’를 택했고, υἱοὺς Ἡσαῦ는 직역하여 ‘에서의 아들들’로 두었습니다.
- source_word: πόλις ὀχυρά
  english_pob_choice: fortified city
  chosen_korean: 견고한 성읍
  alternatives_korean:
  - 요새화된 성읍
  - 튼튼한 성읍
  lexicon: πόλις ὀχυρά
  rationale: ὀχυρά는 방어가 강화된 도시를 가리키므로, 의미를 살리면서도 문어적으로 자연한 ‘견고한 성읍’으로 옮겼습니다.
- source_word: περικαθίσαντες ... ἐπολιορκοῦμεν αὐτῇ
  english_pob_choice: sitting around it, we besieged it
  chosen_korean: 그 성읍을 둘러싸고 앉아 포위하였습니다
  alternatives_korean:
  - 그 성읍을 에워싸고 포위하였습니다
  - 그 성읍 주위에 둘러앉아 포위하였습니다
  lexicon: περικαθίσαντες / ἐπολιορκοῦμεν
  rationale: περικαθίσαντες는 ‘둘러앉다’의 동작상 참여분사로 보존했고, ἐπολιορκοῦμεν은 반복·지속적 포위의 뉘앙스를 살려 ‘포위하였습니다’로 옮겼습니다.
theological_decisions:
- issue: 전투 서술의 직설성 유지
  chosen_reading: 본문의 군사적 서술을 완화하지 않고 ‘추격하였습니다’, ‘포위하였습니다’로 직접 옮겼습니다.
  alternative_readings:
  - ‘쫓아갔습니다’로 완화
  - ‘공격하였습니다’로 일반화
  rationale: 이 절은 도덕화된 요약보다 사건의 군사적 진행을 보여 주는 서술이므로, स्रोत의 직접성을 유지하는 편이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
