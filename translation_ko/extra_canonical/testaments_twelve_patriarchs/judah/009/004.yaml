source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἡμεῖς κατεδιώξαμεν²² τοὺς υἱοὺς Ἡσαῦ²³, ἦν δὲ²⁴ καὶ τούτοις πόλις ὀχυρά²⁵, καὶ οὐκ ἠδυνήθημεν εἰσελθεῖν ἐν αὐτῇ²⁶, *περικαθίσαντες δὲ²⁷ ἐπολιορκοῦμεν αὐτῇ²⁸.
