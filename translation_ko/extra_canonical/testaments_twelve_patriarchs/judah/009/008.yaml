  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἦσαν διδόντες⁴⁷ ἡμῖν πυροῦ⁴⁸ κόρους⁴⁹ πεντακοσίους⁵⁰, καὶ ἐλαίου †ὕφης⁵² πεντακοσίους⁵³, καὶ⁵⁴ οἴνου *μέτρα πεντακόσια ἕως τοῦ λιμοῦ⁵⁴ ὅτε⁵⁵ κατήλθομεν⁵⁶ εἰς Αἴγυπτον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/008.yaml
  text: And they were giving us five hundred cors of wheat, and five hundred baths of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.
translation:
  language: ko
  text: 그리고 그들은 우리가 이집트로 내려갔을 때까지 우리에게 밀 오백 코르와 기름 오백 바트와 포도주 오백 측량단위를 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυροῦ κόρους πεντακοσίους
  english_pob_choice: five hundred cors of wheat
  chosen_korean: 밀 오백 코르
  alternatives_korean:
  - 밀 오백 고르
  - 밀 오백 곡식단위
  lexicon: κόρος
  rationale: κόρους는 곡물의 대용량 단위이므로, 영어 POB의 'cors'를 따라 음역형인 코르로 옮겼습니다.
- source_word: ἐλαίου ὕφης πεντακοσίους
  english_pob_choice: five hundred baths of oil
  chosen_korean: 기름 오백 바트
  alternatives_korean:
  - 기름 오백 욕조
  - 기름 오백 측량단위
  lexicon: βάτος
  rationale: 기름에 대한 단위는 POB가 수정한 대로 ‘baths’를 반영해야 하므로, 표준 음역인 바트로 옮겼습니다.
- source_word: οἴνου μέτρα πεντακόσια
  english_pob_choice: five hundred measures of wine
  chosen_korean: 포도주 오백 측량단위
  alternatives_korean:
  - 포도주 오백 메트라
  - 포도주 오백 잰 수
  lexicon: μέτρον
  rationale: 본문의 포도주 단위는 본문과 전승상 정확한 동정이 덜 확실하므로, 영어 POB의 보수적 처리에 맞춰 기능적으로 ‘측량단위’로 옮겼습니다.
- source_word: ἕως τοῦ λιμοῦ ὅτε κατήλθομεν εἰς Αἴγυπτον
  english_pob_choice: until the famine, when we went down into Egypt
  chosen_korean: 우리가 이집트로 내려갔을 때까지
  alternatives_korean:
  - 기근이 들 때까지, 우리가 이집트로 내려갔을 때
  - 기근 때까지, 우리가 이집트로 내려갔을 때
  lexicon: κατήλθομεν εἰς Αἴγυπτον
  rationale: 문맥상 기근과 이집트 하향 이동이 연결되지만, 종결점은 ‘이집트로 내려갔을 때까지’로 간결하게 재현했습니다.
theological_decisions:
- issue: 기근과 이집트 이동의 시간절 관계
  chosen_reading: ‘우리가 이집트로 내려갔을 때까지’로 끝을 잡아, 영어 POB가 유지한 서술 흐름을 따랐습니다.
  alternative_readings:
  - ‘기근이 들 때까지, 우리가 이집트로 내려갔을 때’
  - ‘기근이 닥칠 때까지’
  rationale: 본문은 물품 지급의 지속 기간을 말하며, 기근과 이집트 하강이 역사적 전환점으로 병치됩니다. 이를 과도하게 해설하지 않고 순서대로 옮겼습니다.
  doctrine_reference: 서술 문맥 보존
