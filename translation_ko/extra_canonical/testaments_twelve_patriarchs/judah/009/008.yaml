  source_fidelity: 초안은 세 물량과 단위(밀 코르, 기름 바트, 포도주 측량 단위)를 대체로 충실히 옮겼습니다. 그러나 ἕως τοῦ λιμοῦ(‘기근 때까지’)가 번역문에서 빠지고 ‘이집트로 내려갔을 때까지’만 남아 시간 표지가 축소되었습니다. 또한 ἦσαν διδόντες의 지속성을 ‘주고 있었습니다’로 드러내는 편이 적절합니다.
  naturalness: ‘포도주 오백 측량단위’는 의미가 통하지만 ‘측량 단위’로 띄어 쓰는 것이 현대 한국어 표기에 더 자연스럽습니다. ‘우리가 이집트로 내려갔던 기근 때까지’는 기근과 이집트 하강을 연결하는 원문의 시간 관계를 자연스럽게 재현합니다.
  terminology: ‘코르’와 ‘바트’는 각각 곡물과 액체의 고대 용량 단위로 적절한 음역입니다. 포도주의 μέτρα는 특정 단위로 단정하지 않고 ‘측량 단위’로 처리하여 본문의 불확실성을 보존합니다.
