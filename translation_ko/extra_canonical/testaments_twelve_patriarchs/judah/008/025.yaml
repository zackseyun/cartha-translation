id: T12P.JUD.8.25
reference: Testament of Judah 8:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: ko
  text: 그리고 나는 이 일들에 대해 회개했습니다. 그래서 포도주와 고기를 먹지 않았고, 늙을 때까지 그렇게 지냈으며, 어떤 즐거움도 보지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσας
  english_pob_choice: I repented of these things
  chosen_korean: 이 일들에 대해 회개했습니다
  alternatives_korean:
  - 이 일들을 뉘우쳤습니다
  - 이런 일들에 대해 마음을 돌렸습니다
  lexicon: μετανοέω
  rationale: 과거 완료적 회개의 행위를 자연스러운 합쇼체로 옮기되, 목적어를 살려 ‘이 일들에 대해’로 원인·대상 관계를 드러냈습니다.
- source_word: οἶνον καὶ κρέα
  english_pob_choice: wine and meat
  chosen_korean: 포도주와 고기
  alternatives_korean:
  - 술과 고기
  - 포도주와 육류
  lexicon: οἶνος / κρέας
  rationale: 포도주는 직역이 가장 분명하고, κρέα는 일반적인 식용 고기를 뜻하므로 ‘고기’가 가장 무난합니다.
- source_word: ἕως γήρους μου
  english_pob_choice: until old age
  chosen_korean: 늙을 때까지
  alternatives_korean:
  - 노년까지
  - 제가 늙을 때까지
  lexicon: γῆρας
  rationale: 시간의 종결점을 자연스럽게 표현하면서도 의미를 유지하는 한국어 관용 표현을 택했습니다.
- source_word: πᾶσαν εὐφροσύνην
  english_pob_choice: no joy
  chosen_korean: 어떤 즐거움도
  alternatives_korean:
  - 어떤 기쁨도
  - 모든 즐거움도
  lexicon: εὐφροσύνη
  rationale: εὐφροσύνη는 단순한 감정적 기쁨보다 폭넓은 즐거움·환희를 가리킬 수 있어, 여기서는 부정문 속에서 포괄적 의미를 살린 ‘어떤 즐거움도’가 적절합니다.
theological_decisions:
- issue: 회개 이후의 금욕 서술을 어떻게 전달할지
  chosen_reading: 회개 후 포도주와 고기를 끊고 노년까지 절제했다는 자기증언으로 옮겼습니다.
  alternative_readings:
  - 단순한 금주·금육 규정으로 읽는 번역
  - 도덕적 자책을 약화시키는 완곡 번역
  rationale: 본문은 회개와 그에 따른 지속적 절제를 함께 진술하므로, 결과를 약화하지 않고 서술 그대로 전달하는 것이 적절합니다.
  doctrine_reference: 윤리적 자기증언의 직설적 서술
- issue: καίγε의 강조를 어떻게 반영할지
  chosen_reading: 첫머리의 ‘그리고’를 살려 서술을 연결하면서 ‘indeed’에 해당하는 강조를 과도하게 부풀리지 않았습니다.
  alternative_readings:
  - ‘참으로’로 강하게 보강
  - 강조를 생략
  rationale: 원문의 강조는 분명하지만, 한국어에서는 문맥상 ‘그리고’와 문장 전체의 흐름으로 충분히 전달됩니다.
  doctrine_reference: 수사적 강조의 절제
