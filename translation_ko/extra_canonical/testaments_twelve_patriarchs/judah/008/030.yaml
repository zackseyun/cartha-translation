review_pass:
  verdict: revise
  source_fidelity: 첫 절의 그리스어 동사 ἐμποδίζει는 능동형이므로, ‘그는 … 막히고’라는 수동 표현은 원문과 맞지 않습니다. 또한 Προφήτου λαλοῦντος οὐκ ἀκούει는 예언자가 말할 때 그가 ‘듣지 않는다’는 뜻이며, ‘들으면’이라고 하면 실제로 듣는다는 조건이 추가됩니다. 마지막 절은 단일 동사 προσοχθίζει로, 경건의 말에 강한 반감·혐오를 보인다는 뜻입니다.
  naturalness: 수정문은 원문의 네 병렬 진술을 유지하면서 현대 표준 한국어 합쇼체로 자연스럽게 연결합니다. ‘경건의 말을 몹시 싫어합니다’는 부자연스러운 명사적 표현을 피하면서도 προσοχθίζω의 강도를 반영합니다.
  terminology: ‘하나님께 드리는 제사’는 Θυσίας Θεοῦ의 예배 문맥상 자연스러운 번역입니다. εὐλογίαν Θεοῦ는 영어 POB의 ‘blessing God’ 해석을 따라 ‘하나님을 찬송하는 일’로 옮겼습니다. ‘예언자’와 ‘경건’은 일관되고 현대적인 용어입니다.
  issues:
  - severity: high
    issue: 첫 절이 수동으로 번역됨
    rationale: Θυσίας Θεοῦ ἐμποδίζει의 ἐμποδίζει는 능동형입니다. 원문의 주어는 제사를 방해하므로 ‘제사를 드리지 못하게 막히고’가 아니라 ‘제사를 방해하고’로 고쳐야 합니다.
  - severity: medium
    issue: 예언자의 발화를 듣는다는 조건이 추가됨
    rationale: οὐκ ἀκούει는 부정문입니다. ‘예언자가 말하는 것을 들으면’은 듣는 행위를 전제하므로, ‘예언자가 말할 때에는 듣지 않고’로 옮기는 것이 정확합니다.
  - severity: medium
    issue: 마지막 절에 원문에 없는 두 반응이 병렬로 추가됨
    rationale: προσοχθίζει는 단일 술어이며 불쾌함·강한 반감을 뜻합니다. ‘불쾌히 여기고 분노합니다’는 ‘분노하다’를 별도로 첨가하므로, 한 술어로 번역하는 편이 충실합니다.
  - severity: low
    issue: 근거 없는 각주 표지 [a][b][c]
    rationale: 제공된 draft에는 이 표지에 대응하는 각주 본문이 없습니다. 독자가 검증할 수 없는 표지는 삭제해야 합니다.
  revised_text: 그는 하나님께 드리는 제사를 방해하고, 하나님을 찬송하는 일을 기억하지 않으며, 예언자가 말할 때에는 듣지 않고, 경건의 말을 몹시 싫어합니다.
