id: T12P.JUD.8.30
reference: Testament of Judah 8:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Θυσίας Θεοῦ ἐμποδίζει, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει. *Προφήτου λαλοῦντος οὐκ ἀκούει, καὶ λόγους εὐσεβείας προσοχθίζει.'
  language: Greek
  note: Greek from Charles XVIII.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: ko
  text: 그는 하나님께 드리는 제사를 방해하고, 하나님을 찬송하는 일을 기억하지 않으며, 예언자가 말할 때에는 듣지 않고, 경건의 말을 몹시 싫어합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ ἐμποδίζει
  english_pob_choice: he is hindered from offering sacrifices to God
  chosen_korean: 하나님께 제사를 드리지 못하게 막히고
  alternatives_korean:
  - 하나님께 희생제를 바치지 못하게 되고
  - 하나님께 제사를 드리는 데 방해를 받고
  lexicon: Θυσίας = 제사/희생제; ἐμποδίζει = 막다, 방해하다
  rationale: 문장의 수동적 결과를 살려 ‘막히고’로 옮기되, 제사의 목적지를 ‘하나님께’로 분명히 밝혔습니다.
- source_word: εὐλογίαν Θεοῦ οὐ μνημονεύει
  english_pob_choice: he does not remember blessing God
  chosen_korean: 하나님을 찬송하는 일을 기억하지 않으며
  alternatives_korean:
  - 하나님을 축복하는 일을 기억하지 않으며
  - 하나님께 복을 빌어 드리는 일을 기억하지 않으며
  lexicon: εὐλογίαν = 축복/찬송/복을 빎; μνημονεύει = 기억하다, 상기하다
  rationale: 문맥상 인간이 하나님께 ‘복을 빌어 드리는’ 행위라기보다 하나님을 향한 경외의 언어로 이해되어, 예배적 의미가 드러나도록 ‘찬송’으로 옮겼습니다.
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  english_pob_choice: when he hears a prophet speaking
  chosen_korean: 예언자가 말하는 것을 들으면
  alternatives_korean:
  - 예언자가 말할 때 듣지 않으며
  - 예언자의 말을 들을 때 귀를 기울이지 않으며
  lexicon: Προφήτου = 예언자; ἀκούει = 듣다
  rationale: 헬라어의 분사 구조를 자연스러운 조건절로 옮겨, 듣는 행위 자체를 받아들이는 장면을 살렸습니다.
- source_word: λόγους εὐσεβείας προσοχθίζει
  english_pob_choice: he is offended and angered
  chosen_korean: 불쾌히 여기고 분노합니다
  alternatives_korean:
  - 경건의 말을 혐오합니다
  - 경건한 말을 싫어하고 분개합니다
  lexicon: προσοχθίζει = 싫어하다, 혐오하다, 역겨워하다; λόγους εὐσεβείας = 경건의 말
  rationale: 직설적 혐오의 강도를 유지하면서도 한국어 문장으로는 과도하게 경직되지 않도록 ‘불쾌히 여기고’와 ‘분노합니다’를 병렬로 제시했습니다.
theological_decisions:
- issue: εὐλογίαν Θεοῦ의 의미 범위
  chosen_reading: ‘하나님을 찬송하는 일’로 이해해 예배적, 경건적 행위를 가리키도록 옮겼습니다.
  alternative_readings:
  - ‘하나님을 축복하는 일’
  - ‘하나님께 복을 비는 일’
  rationale: 문맥상 ‘제사’와 ‘예언자의 말’과 나란히 놓인 경건 행위이므로, 단순한 말의 축복보다 하나님을 향한 찬양/경배의 행위로 읽는 것이 자연스럽습니다.
  doctrine_reference: source-context reading
- issue: 말씀을 듣고 보이는 반응의 강도
  chosen_reading: ‘불쾌히 여기고 분노합니다’로 번역해, 단순한 무관심이 아니라 예언적 경고에 대한 적극적 거부를 드러냈습니다.
  alternative_readings:
  - ‘불쾌히 여기고 화를 냅니다’
  - ‘혐오하고 노합니다’
  rationale: 원문 προσοχθίζει는 강한 혐오·반감을 담아, 예언자의 말을 싫어하는 수준을 넘어 격한 반응을 보인다는 점을 살려야 합니다.
  doctrine_reference: source-context reading
