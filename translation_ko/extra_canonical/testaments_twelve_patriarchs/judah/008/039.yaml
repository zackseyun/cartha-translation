  to: 주님의 천사가 제게 말했습니다. 「주님께서 그를 너보다 앞서 택하셔서, 그가 주님께 가까이 나아가고 주님의 상에서 먹으며 이스라엘 자손의 진미 가운데 첫 열매를 주님께 바치게 하셨다. 그러나 너는 야곱의 왕이 될 것이다.」
