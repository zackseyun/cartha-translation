id: T12P.JUD.8.39
reference: Testament of Judah 8:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: ko
  text: 주님의 천사가 제게 말했습니다. 「주님께서 그를 당신보다 먼저 택하셔서, 그분께 가까이 나아가게 하고, 그분의 상에서 먹게 하며, 이스라엘의 좋은 것들의 첫 열매를 그분께 바치게 하셨습니다.」 「그런데 너는 야곱의 왕이 될 것이다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ γὰρ ἄγγελος Κυρίου
  english_pob_choice: For the angel of the Lord
  chosen_korean: 주님의 천사
  alternatives_korean:
  - 주 하나님의 천사
  - 야훼의 천사
  lexicon: ἄγγελος / κύριος
  rationale: 여기서 κύριος는 천사 표현에 결합된 소유격이므로 자연스러운 경구체로 ‘주님의 천사’가 가장 직접적이며, 본문은 인물의 발화를 소개하므로 간결하게 옮겼습니다.
- source_word: προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ
  english_pob_choice: to be near him, and ... to eat of his table
  chosen_korean: 그분께 가까이 나아가게 하고, 그분의 상에서 먹게 하며
  alternatives_korean:
  - 그분에게 다가가게 하고, 그분의 식탁에서 먹게 하며
  - 그분 곁에 있게 하고, 그분의 상에서 먹게 하며
  lexicon: προσεγγίζειν / τράπεζα
  rationale: 동사들의 병렬 구조를 살려 ‘가까이 나아가게 하고… 먹게 하며’로 대응했고, τράπεζα는 ‘상’이 문맥상 더 고전적이면서도 한국어에서 위계적 친밀성을 잘 드러냅니다.
- source_word: ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ
  english_pob_choice: and for you to be king with him, as a lion
  chosen_korean: 이스라엘의 좋은 것들의 첫 열매를 그분께 바치게 하셨습니다
  alternatives_korean:
  - 이스라엘 자손의 진미의 첫 열매를 그분께 드리게 하셨습니다
  - 이스라엘의 귀한 산물의 첫 몫을 그분께 바치게 하셨습니다
  lexicon: ἀπαρχή / ἐντρυφήματα
  rationale: α 본문은 ‘사자처럼’이 아니라 ‘이스라엘의 진미/좋은 것들의 첫 열매’라는 제의적 표현이므로, POB의 추가 이미지 대신 원문에 있는 봉헌 의미를 살렸습니다.
- source_word: '*Σὺ δὲ ἔσῃ βασιλεὺς Ἰακώβ'
  english_pob_choice: and for you to be king with him, as a lion
  chosen_korean: 그런데 너는 야곱의 왕이 될 것이다
  alternatives_korean:
  - 그러나 너는 야곱의 왕이 될 것이다
  - 너는 야곱의 왕이 될 것이다
  lexicon: βασιλεύς
  rationale: 본문 말미의 별표 구절은 α 사본의 종결로서 ‘야곱의 왕’이 핵심이므로, 예언적 직설을 살려 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 영어 POB의 ‘as a lion’이 그리스어 α 본문에는 없음
  chosen_reading: 사자 이미지를 본문에 넣지 않고, α 본문의 ‘야곱의 왕’으로 끝맺었습니다.
  alternative_readings:
  - 사자처럼
  - 사자와 같이 왕이 될 것이다
  rationale: 제공된 원문 노트가 POB 영어의 종결 비유가 α에는 없다고 명시하므로, 확증되지 않은 이미지를 본문에 복원하지 않았습니다.
  doctrine_reference: 본문비평 원칙 / source primacy
- issue: ἄγγελος Κυρίου의 κύριος를 어떻게 표기할지
  chosen_reading: ‘주님의 천사’로 두고, 야훼로 치환하지 않았습니다.
  alternative_readings:
  - 야훼의 천사
  - 주 하나님의 천사
  rationale: 이 구절은 직접 인용된 야훼 호칭이 아니라 천사 칭호의 관용적 결합이므로, 원문의 신학적 긴장을 보존하면서도 한국어에서 가장 자연스러운 표현을 택했습니다.
  doctrine_reference: 명칭 관용구 / 본문 맥락
