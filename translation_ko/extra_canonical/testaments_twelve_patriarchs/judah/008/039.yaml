  source_fidelity: 개정이 필요합니다. 초안은 영어 POB에만 있는 ‘사자처럼’을 배제하고, 레위가 주님께 가까이 나아가고 주님의 상에서 먹으며 첫 열매를 바치는 내용을 복원한 점은 그리스어 α 본문에 충실합니다. 다만 ὑπὲρ σέ는 여기서 ‘당신보다 먼저’보다 직접화법에 맞는 ‘너보다 앞서’가 자연스럽고, ἐντρυφημάτων υἱῶν Ἰσραήλ의 ‘이스라엘 자손의 진미’라는 소유·수식 관계를 더 분명히 해야 합니다.
  naturalness: 서술부의 합쇼체와 인용문 안의 ‘당신/너’가 섞여 있어 화자 관계가 다소 불안정합니다. 천사가 유다에게 하는 직접 발화이므로 인용문에서는 ‘너’를 일관되게 쓰고, 하나의 연속된 인용문으로 처리하는 것이 현대 한국어 문장부호와 흐름에 맞습니다.
  terminology: ‘주님의 천사’, ‘주님의 상’, ‘첫 열매’, ‘야곱의 왕’은 적절합니다. 다만 본문 안에서 주님을 가리키는 대명사는 ‘주님’으로 명시하여 레위와의 지시 대상 혼동을 줄였습니다.
