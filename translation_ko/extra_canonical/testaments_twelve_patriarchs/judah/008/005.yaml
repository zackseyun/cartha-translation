revisions:
- from: 그 여인은 내가 올라가고 있다는 것을 알고, 신부 예복을 입고 도시 에나임의 성문 곁에 앉았습니다. 아모리 사람들에게는 혼인할 여자가 성문 곁에 칠 일 동안 앉아 있으면서 음행하는 것이 법이었습니다.
  to: 그 여자는 신부 차림으로 꾸미고 에나임 성읍에서 성문 곁에 앉았습니다. 아모리 사람들에게는 과부인 여자가 성문 곁에 이레 동안 앉아 있는 것이 법이었습니다.
  rationale: 제시된 그리스어 본문에 충실하도록 영어 POB에 있으나 원문에는 없는 ‘알고’와 ‘음행’의 내용을 삭제했습니다. 논쟁 또는 문맥상 조화될 수 있는 해석을 본문에 도입하지 않고 χηρεύουσαν의 기본 의미를 ‘과부인 여자’로 보존했습니다. ‘신부 차림’과 ‘성문’은 원문의 혼례 장식 및 공적 출입구의 의미를 자연스럽게 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:04Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 그리스어 본문에는 ‘내가 올라가고 있다는 것을 알고’에 해당하는 표현이 없으며, 성문 곁에서 ‘음행하였다’는 내용도 없습니다. 또한 τὴν χηρεύουσαν은 문맥적 추정보다 우선하여 ‘과부인 여자’로 옮겨야 합니다.
  naturalness: ‘에나임 성읍에서 성문 곁에’, ‘이레 동안 앉아 있는’은 현대 표준 한국어의 격식 있는 서술체로 자연스럽습니다.
  terminology: κόσμῳ νυμφικῷ는 ‘신부 차림으로 꾸미고’로, πύλη는 ‘성문’으로 옮겼습니다. χηρεύουσαν은 영어 감사 기록의 해석적 ‘혼인할 여자’가 아니라 원문의 문자적 의미인 ‘과부인 여자’로 유지합니다.
  issues:
