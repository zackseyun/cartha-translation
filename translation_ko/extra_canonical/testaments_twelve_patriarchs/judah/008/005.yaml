id: T12P.JUD.8.5
reference: Testament of Judah 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*κοσμηθεῖσα κόσμῳ νυμφικῷ ἐκάθισεν *ἐν Ἐνὰν *τῇ πόλει *πρὸς τὴν πύλην. 2. Νόμος γὰρ ἦν τῶν Ἀμορραίων τὴν *χηρεύουσαν προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην.'
  language: Greek
  note: Greek from Charles XII.1b-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/005.yaml
  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: ko
  text: 그 여자는 신부 차림으로 꾸미고 에나임 성읍에서 성문 곁에 앉았습니다. 아모리 사람들에게는 과부인 여자가 성문 곁에 이레 동안 앉아 있는 것이 법이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  english_pob_choice: adorned herself in bridal array
  chosen_korean: 신부 예복을 입고
  alternatives_korean:
  - 혼례 장식으로 꾸미고
  - 신부 차림으로
  lexicon: κοσμέω; κόσμος; νυμφικός
  rationale: ‘아름답게 꾸미다’보다 혼례용 복식이라는 점이 드러나도록 ‘신부 예복’으로 옮겨, 영어 POB의 bridal array를 source에 맞게 구체화했습니다.
- source_word: ἐκάθισεν ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  english_pob_choice: sat in the city Enaim by the gate
  chosen_korean: 도시 에나임의 성문 곁에 앉았습니다
  alternatives_korean:
  - 에나임 성읍의 문 곁에 앉았습니다
  - 에나임 도성의 문가에 앉았습니다
  lexicon: ἐκάθισεν; Ἐνάν; πύλη
  rationale: ἐν Ἐνὰν을 지명으로 살리고, πύλη는 단순 ‘문’보다 성읍의 출입과 공적 공간을 드러내는 ‘성문’이 더 적절해 ‘곁에’로 자연스럽게 처리했습니다.
- source_word: Νόμος γὰρ ἦν τῶν Ἀμορραίων
  english_pob_choice: For it was a law of the Amorites
  chosen_korean: 아모리 사람들에게는 … 법이었습니다
  alternatives_korean:
  - 아모리 사람들의 관습으로는 …였습니다
  - 아모리인의 율법에는 …였습니다
  lexicon: νόμος; Ἀμορραῖοι
  rationale: 여기서는 토라의 ‘율법’이 아니라 특정 민족의 관행을 가리키므로, 영어 POB의 law를 반영해 ‘법’으로 두어 문화적 관습성을 살렸습니다.
- source_word: τὴν χηρεύουσαν προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην
  english_pob_choice: she who was about to marry should sit for seven days by the gate in fornication
  chosen_korean: 혼인할 여자가 성문 곁에 칠 일 동안 앉아 있으면서 음행하는 것
  alternatives_korean:
  - 미망인이 성문 곁에 칠 일 동안 앉아 있어야 하는 것
  - 혼인할 여자가 성문 곁에 칠 일 동안 앉아 있어야 하는 것
  lexicon: τὴν χηρεύουσαν; προκαθεσθαι; ἐπὶ ἑπτὰ ἡμέρας; παρὰ τὴν πύλην
  rationale: 원문은 문자적으로는 ‘과부/미망인 상태의 여자’(τὴν χηρεύουσαν)를 시사하지만, 영어 POB는 문맥상 혼인 직전의 여자로 풀어 설명하므로 그 해석을 반영하되, 성문 곁에서의 일주일 체류와 성적 방종을 명시해 서술의 긴장을 유지했습니다.
theological_decisions:
- issue: τὴν χηρεύουσαν의 직역 가능성과 문맥 해석
  chosen_reading: 문자적 형식은 살리되, 본문 전체의 서술 문맥에 따라 ‘혼인할 여자’로 이해했습니다.
  alternative_readings:
  - ‘과부인 여자’로 직역
  - ‘미망인인 여자’로 직역
  rationale: 그리스어 형태는 과부 상태를 가리킬 수 있지만, 바로 앞뒤 문맥과 영어 POB audit trail은 혼인 예식 관습을 설명하는 방향이어서, 한국어 본문은 문맥 우선으로 읽히게 하되 주석이 필요하지 않은 수준에서 긴장을 보존했습니다.
  doctrine_reference: 문헌학적 해석 문제로, 교리 판단 사안은 아닙니다.
