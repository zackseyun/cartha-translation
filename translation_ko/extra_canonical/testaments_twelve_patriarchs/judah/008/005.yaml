  - severity: high
    issue: 원문에 없는 ‘음행하는 것’이 첨가되었습니다.
    rationale: 제시된 그리스어 문장은 과부인 여자가 성문 곁에 이레 동안 앉아 있는 관습만 언급합니다. 영어 POB의 ‘in fornication’은 이 그리스어 본문의 표현으로 뒷받침되지 않습니다.
  - severity: high
    issue: τὴν χηρεύουσαν을 ‘혼인할 여자’로 해석하여 번역했습니다.
    rationale: 이 단어는 문자적으로 과부인/과부가 된 여자를 가리킵니다. 문맥 조화나 영어 감사 기록을 위해 그 의미를 대체하지 않고 본문에서 보존해야 합니다.
  revised_text: 그 여자는 신부 차림으로 꾸미고 에나임 성읍에서 성문 곁에 앉았습니다. 아모리 사람들에게는 과부인 여자가 성문 곁에 이레 동안 앉아 있는 것이 법이었습니다.
