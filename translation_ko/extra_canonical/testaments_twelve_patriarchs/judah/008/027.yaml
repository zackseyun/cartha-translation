  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: ko
  text: 그러므로, 내 자녀들아, 음행과 돈을 사랑함에서 자신을 지키고, 너희 아버지 유다의 말을 들으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  english_pob_choice: keep yourselves
  chosen_korean: 자신을 지키고
  alternatives_korean:
  - 스스로를 지키고
  - 지켜 자신을 보전하고
  lexicon: φυλάσσω
  rationale: 단순히 외적 금지만이 아니라 자기 자신을 보존하라는 뉘앙스를 살리기 위해 반사적 표현을 사용했습니다.
- source_word: πορνείας
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 성적 음행
  lexicon: πορνεία
  rationale: 성경 한국어에서 널리 통용되면서도 원문의 도덕적·성적 범주를 직접 드러내는 표준어입니다.
- source_word: φιλαργυρίας
  english_pob_choice: the love of money
  chosen_korean: 돈을 사랑함
  alternatives_korean:
  - 탐심
  - 돈에 대한 사랑
  lexicon: φιλαργυρία
  rationale: 명사형 사랑을 유지해 원문의 구조를 살리고, 단순한 탐욕 일반보다 재물에 대한 집착을 분명히 했습니다.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  english_pob_choice: Judah your father
  chosen_korean: 너희 아버지 유다
  alternatives_korean:
  - 너희의 아버지 유다
  - 아버지인 유다
  lexicon: Ἰούδας
  rationale: 호소문 구조를 자연스러운 한국어 어순으로 옮기되, 혈연적 권위와 직접 호칭을 분명히 했습니다.
theological_decisions:
- issue: 권면형 명령의 한국어 높임말 처리
  chosen_reading: 화자가 자녀들에게 직접 권면하는 문맥을 따라 평서형 명령과 청유를 섞지 않고, 공적 권면체인 합쇼체로 통일했습니다.
  alternative_readings:
  - 자녀들에게 낮춤말로 직접 훈계하는 방식
  - 더 교회적·설교체 표현
  rationale: 유언적 권면의 긴박함은 유지하되 현대 한국어 독자에게 과도하게 낯설거나 설교적으로 들리지 않게 하기 위함입니다.
  doctrine_reference: 문체/화행 적합성
