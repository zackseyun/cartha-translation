  to: 그러므로 나는 포도주에 취해 그녀를 알아보지 못하였고, 그녀의 아름다움은 그녀가 치장한 모습을 통하여 나를 속였습니다.
  rationale: 원문의 수동 분사구와 두 개의 과거 진술을 유지하되, ‘미혹시키다/내 마음’이라는 해석적 보충을 ‘나를 속였습니다’로 바로잡았습니다. 또한 ‘장식의 모양’은 현대 한국어에서 자연스러운 ‘치장한 모습’으로 다듬었고, 대응 각주가 없는 표지는 삭제했습니다.
