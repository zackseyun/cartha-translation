  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Μεθυσθεὶς οὖν οἴνῳ οὐκ ἐπέγνων αὐτὴν, καὶ ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως.
  language: Greek
  note: Greek from Charles XII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: ko
  text: 그러므로 나는 포도주에 취해 그녀를 알아보지 못하였고, 그녀의 아름다움은 그녀가 치장한 모습을 통하여 나를 속였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς οὖν οἴνῳ
  english_pob_choice: Therefore, being drunk with wine
  chosen_korean: “포도주에 취하여”
  alternatives_korean:
  - 술에 취하여
  - 포도주에 취한 까닭에
  lexicon: μεθύω / οἶνος
  rationale: 원문의 상태표현을 자연스럽게 살리되, 포도주라는 구체적 어휘를 유지해 술의 일반화보다 원문성을 보존했습니다.
- source_word: οὐκ ἐπέγνων αὐτὴν
  english_pob_choice: I did not recognize her
  chosen_korean: “그녀를 알아보지 못하였고”
  alternatives_korean:
  - 그녀를 알아보지 못했고
  - 그녀를 알아차리지 못하였고
  lexicon: ἐπιγινώσκω
  rationale: ‘recognize’의 의미를 직접 반영하여 인지 실패를 분명히 했습니다.
- source_word: ἠπάτησέ με τὸ κάλλος αὐτῆς
  english_pob_choice: her beauty led my mind astray
  chosen_korean: “그녀의 아름다움이 … 내 마음을 미혹시켰습니다”
  alternatives_korean:
  - 그녀의 아름다움이 … 나를 속였습니다
  - 그녀의 아름다움이 … 내 생각을 빗나가게 했습니다
  lexicon: ἀπατάω / κάλλος
  rationale: 영문 POB의 ‘led my mind astray’를 따라 단순 사기보다 인식의 오도와 유혹을 함께 살리는 ‘미혹시키다’로 옮겼습니다.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  english_pob_choice: through the fashion of her adornment
  chosen_korean: “그 장식의 모양으로 말미암아”
  alternatives_korean:
  - 그 치장의 형식으로 말미암아
  - 그 꾸밈의 양식으로 말미암아
  lexicon: σχῆμα / κόσμησις
  rationale: σχῆμα과 κόσμησις의 외형적·장식적 요소를 함께 살려, 미적 외관이 유혹의 매개가 되었음을 드러냈습니다.
theological_decisions:
- issue: 정서적·윤리적 진술의 톤
  chosen_reading: 직설적 고백문으로 처리하여, 회개 서사에서 자기기만과 미혹의 책임을 분명히 보이게 했습니다.
  alternative_readings:
  - 완곡하게 서술하여 도덕적 책임을 약화시키는 번역
  - 더 해설적으로 풀어쓴 번역
  rationale: 이 문장은 신학적 교리문이 아니라 자기고백적 회상문이므로, 원문이 가진 도덕적 긴장과 수치를 보존하는 것이 중요합니다.
  doctrine_reference: 서사적 자기고백과 인간의 유혹/오도에 대한 일반적 성경 신학
