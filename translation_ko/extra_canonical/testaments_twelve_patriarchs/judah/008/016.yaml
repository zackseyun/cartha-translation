  to: 내 자녀들아, 이제 내가 너희에게 말합니다. 포도주에 취하지 마십시오. 포도주는 마음을 진리에서 벗어나게 하고, 욕망의 격분을 불러일으키며, 눈을 미혹에 빠지게 합니다.
