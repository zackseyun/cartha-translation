id: T12P.JUD.8.16
reference: Testament of Judah 8:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: ko
  text: 내 자녀들아, 이제 내가 너희에게 말합니다. 포도주에 취하지 마십시오. 포도주는 마음을 진리에서 벗어나게 하고, 욕망의 격분을 불러일으키며, 눈을 미혹에 빠지게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ μεθύσκεσθε οἴνῳ
  english_pob_choice: do not be drunk with wine
  chosen_korean: 포도주에 취하지 마십시오
  alternatives_korean:
  - 포도주에 술 취하지 마십시오
  - 포도주로 취하지 마십시오
  - 술에 취하지 마십시오
  lexicon: μεθύσκω / οἶνος
  rationale: 금지 표현을 자연스러운 합쇼체로 옮기되, οἶνος를 문맥상 포도주로 구체화하여 번역 전통과 원문 대상을 분명히 했습니다.
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  english_pob_choice: turns the mind away from the truth
  chosen_korean: 마음을 진리에서 벗어나게 하고
  alternatives_korean:
  - 이성을 진리에서 비틀어 놓고
  - 생각을 진리에서 돌아서게 하고
  - 마음을 진리에서 왜곡하고
  lexicon: νοῦς / ἀλήθεια
  rationale: νοῦς를 여기서는 인지와 판단의 중심인 ‘마음’으로 옮기고, ἀπό를 ‘에서 벗어나게’로 처리해 방향 이탈의 의미를 살렸습니다.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  english_pob_choice: inspires the passion of desire
  chosen_korean: 욕망의 격정을 일으키며
  alternatives_korean:
  - 정욕의 분노를 불러일으키며
  - 욕망의 분노를 넣으며
  - 욕정의 분노를 자아내며
  lexicon: ὀργή / ἐπιθυμία
  rationale: 직역하면 어색한 결합이지만, 원문의 ‘격정/분노’와 ‘욕망’을 모두 유지해야 하므로 욕망이 폭주하는 내적 동요를 드러내는 표현으로 옮겼습니다.
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  english_pob_choice: it leads the eyes into error
  chosen_korean: 눈을 그릇됨으로 이끕니다
  alternatives_korean:
  - 눈을 미혹으로 이끕니다
  - 눈을 오류로 이끕니다
  - 눈을 잘못된 길로 이끕니다
  lexicon: πλάνη / ὀφθαλμοί
  rationale: πλάνη를 단순한 ‘오류’보다 더 넓은 ‘그릇됨’으로 옮겨 도덕적·인식적 오류를 함께 담았고, 눈은 그대로 유지했습니다.
theological_decisions:
- issue: 포도주의 윤리적 경고를 어떻게 전달할지
  chosen_reading: 본문은 포도주 자체를 절제 없이 마시는 행위를 경계하는 것으로 읽고, 도덕적 효력을 약화시키지 않기 위해 직접적인 금지형으로 번역했습니다.
  alternative_readings:
  - 술에 대한 일반적 절제 권고
  - 과음만을 겨냥한 경고
  - 상징적 경고로 완화된 표현
  rationale: 원문은 취함이 진리 인식과 욕망 통제에 미치는 해악을 분명히 진술하므로, 경고의 강도를 줄이지 않는 것이 source-direct합니다.
  doctrine_reference: 지혜문학적 경고의 수사 유지
