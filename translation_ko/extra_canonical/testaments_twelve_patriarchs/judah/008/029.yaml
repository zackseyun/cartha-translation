id: T12P.JUD.8.29
reference: Testament of Judah 8:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: ko
  text: 그의 영혼에서 모든 선함을 빼앗고, 고통과 수고로 그를 억누르며, 그에게서 잠을 쫓아내고, 그의 살을 갉아먹습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος
  english_pob_choice: deprive his soul of every goodness
  chosen_korean: 그의 영혼을 모든 선함에서 빼앗고
  alternatives_korean:
  - 그의 영혼을 모든 선한 것에서 박탈하고
  - 그의 혼을 온갖 선함에서 빼앗고
  lexicon: στερίζω; ψυχή; ἀγαθότης
  rationale: στερίσκει는 단순한 ‘빼앗다/박탈하다’의 뜻을 살리고, ἀγαθότης는 추상명사로서 ‘선함’이 가장 자연스럽습니다.
- source_word: συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις
  english_pob_choice: oppress him with toils and troubles
  chosen_korean: 수고와 고통으로 그를 압박하며
  alternatives_korean:
  - 수고와 노고로 그를 괴롭게 하며
  - 수고와 수고로 그를 억누르며
  lexicon: συνέχω; πόνος; μόχθος
  rationale: συνέχει는 ‘압박하다/억누르다’의 지속적 구속감을 드러내고, πόνοις καὶ μόχθοις는 ‘수고와 고통’으로 병렬을 유지했습니다.
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  english_pob_choice: drive sleep away from him
  chosen_korean: 잠을 그에게서 쫓아내고
  alternatives_korean:
  - 잠을 그에게서 몰아내고
  - 그에게서 잠을 빼앗고
  lexicon: ὕπνος; ἐκδιδάσκω
  rationale: ἐκδιδάσκει는 여기서 ‘밖으로 몰아내다/쫓아내다’는 의미가 자연스럽고, 잠의 상실을 생생하게 전달합니다.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  english_pob_choice: devour his flesh
  chosen_korean: 그의 살을 갉아먹습니다
  alternatives_korean:
  - 그의 살을 삼켜 버립니다
  - 그의 육신을 집어삼킵니다
  lexicon: καταδαπανάω; σάρξ
  rationale: καταδαπανᾷ는 ‘철저히 소비하다/먹어치우다’의 뜻이므로, 직접적이면서도 파괴성을 살린 ‘갉아먹다’로 옮겼습니다.
theological_decisions:
- issue: 고통의 주체를 분명히 하는 표현
  chosen_reading: 주어를 ‘그들’로 두어 악한 세력들이 사람을 전인적으로 해치는 그림을 그대로 살렸습니다.
  alternative_readings:
  - ‘그가’로 옮겨 일반적 교훈문처럼 처리
  - 주어를 생략해 수동적으로 처리
  rationale: 원문과 영어 POB가 모두 행위 주체를 분명히 하므로, 서술의 가해성 및 지속성을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 본문 문맥 보존
- issue: ψυχή와 σάρξ의 대비
  chosen_reading: ‘영혼’과 ‘살’을 각각 구별해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘몸/마음’으로 통합
  - ψυχή를 ‘혼’으로 축소
  rationale: 원문의 전인적 훼손 묘사를 살리기 위해 내면(ψυχή)과 육체(σάρξ)의 두 층위를 구분해야 합니다.
  doctrine_reference: 인간 이해의 문맥적 구분
