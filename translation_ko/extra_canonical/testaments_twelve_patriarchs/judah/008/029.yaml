  source_fidelity: 그리스어의 동사는 모두 단수형(στερίσκει, συνέχει, ἐκδιδάσκει, καταδαπανᾷ)이며, 본문 발췌에는 주어가 명시되지 않습니다. 따라서 복수 주어인 ‘그들은’은 원문과 맞지 않습니다. 또한 στερίσκει의 목적어 관계는 ‘영혼을 선함에서 빼앗다’라기보다 ‘영혼에게서 모든 선함을 빼앗다’입니다. 나머지 연쇄 동작과 육체를 소진시키는 강한 표현은 잘 반영되어 있습니다.
  naturalness: ‘그의 영혼을 모든 선함에서 빼앗고’는 한국어에서 영혼 자체를 선함으로부터 떼어 내는 듯한 의미가 될 수 있습니다. ‘그의 영혼에서 모든 선함을 빼앗고’가 박탈의 의미를 자연스럽게 드러냅니다. 주어를 생략하면 원문의 무표지 주어를 보존하면서도 한국어 문장으로 자연스럽습니다.
  terminology: ψυχή는 ‘영혼’, σάρξ는 ‘살’로 구별한 것은 적절합니다. ἀγαθότης의 추상성을 살려 ‘모든 선함’을 유지합니다. πόνοις καὶ μόχθοις의 순서에 맞추어 ‘고통과 수고’로 조정합니다. καταδαπανᾷ는 철저히 소모·잠식한다는 뜻이며, 문맥상 ‘갉아먹습니다’는 허용되는 생생한 번역입니다.
