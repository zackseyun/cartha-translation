  to: 그러나 그가 그 한계를 넘어가면, 미혹의 영이 그의 마음에 들어가 술 취한 자로 하여금 추잡한 말을 하고 법을 어기며 부끄러워하지 않을 뿐 아니라, 오히려 자기 수치를 자랑하고 그것을 좋은 것으로 여기게 합니다.
  rationale: καλόν의 기본 의미인 ‘좋은 것’을 보존하고, αἰσχρορρημονεῖν의 의미 범위를 불필요하게 성적인 말로 제한하지 않았습니다. 내용이 없는 [a] 표지도 제거했습니다. ‘미혹의 영이 그의 마음에 들어가’는 원문의 영적 행위자 표현을 유지하되, 그 존재론적 성격을 본문 이상으로 규정하지 않습니다.
