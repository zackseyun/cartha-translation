id: T12P.JUD.8.22
reference: Testament of Judah 8:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: ko
  text: 그러나 그가 그 한계를 넘어가면, 미혹의 영이 그의 마음에 들어가 술 취한 자로 하여금 추잡한 말을 하고 법을 어기며 부끄러워하지 않을 뿐 아니라, 오히려 자기 수치를 자랑하고 그것을 좋은 것으로 여기게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  english_pob_choice: goes beyond the limit
  chosen_korean: 그 한계를 넘어가면
  alternatives_korean:
  - 그 경계를 넘으면
  - 정해진 한도를 넘어서면
  lexicon: παρέρχομαι + ὅρος
  rationale: ὅρος는 단순한 '끝'이 아니라 정해진 경계·한도를 가리키므로, 자연스러운 한국어로 '한계를 넘어가면'을 택해 위반의 뉘앙스를 살렸습니다.
- source_word: τὸ πνεῦμα τῆς πλάνης
  english_pob_choice: the spirit of deceit
  chosen_korean: 미혹의 영
  alternatives_korean:
  - 속임수의 영
  - 기만의 영
  lexicon: πνεῦμα τῆς πλάνης
  rationale: πλάνη는 단순한 거짓말보다 사람을 빗나가게 하는 '미혹/유혹'의 의미가 강해, 본문 흐름에 맞게 '미혹의 영'으로 옮겼습니다.
- source_word: αἰσχρορρημονεῖν καὶ παρανομεῖν
  english_pob_choice: speak obscenities and transgress
  chosen_korean: 음란한 말을 하게 하고, 법을 어기게 하며
  alternatives_korean:
  - 수치스러운 말을 하게 하고, 율법을 범하게 하며
  - 더러운 말을 하게 하고, 법을 어기게 하며
  lexicon: αἰσχρορρημονέω / παρανομέω
  rationale: αἰσχρορρημονέω는 외설·추잡한 언사를 뜻하므로 '음란한 말'로, παρανομέω는 질서 위반을 넘어 법/규범 위반을 뜻해 '법을 어기다'로 옮겼습니다.
- source_word: ἀτιμία
  english_pob_choice: disgrace
  chosen_korean: 자기 수치
  alternatives_korean:
  - 불명예
  - 치욕
  lexicon: ἀτιμία
  rationale: ἀτιμία는 명예 상실과 수치를 함께 내포하므로, 뒤의 '자랑하다'와 연결되는 자기모순을 드러내기 위해 '자기 수치'를 택했습니다.
theological_decisions:
- issue: What kind of agency does 'the spirit of deceit' have in the verse?
  chosen_reading: 악한 영적 세력이 사람의 마음에 침투하여 행동과 판단을 왜곡하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 비유적 표현으로서의 '속임의 경향'
  - 도덕적 습관을 의인화한 표현
  rationale: 본문은 '마음에 들어가다'와 구체적 행위 결과를 연결해, 단순 심리 상태보다 인격적/영적 작용을 더 강하게 시사합니다.
  doctrine_reference: 영적 유혹과 타락의 인격적 작용에 대한 본문 수준의 관찰
