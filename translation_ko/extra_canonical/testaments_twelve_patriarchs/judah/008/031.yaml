id: T12P.JUD.8.31
reference: Testament of Judah 8:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: ko
  text: 그는 두 가지 서로 հակ대되는 정념에 종노릇하기 때문에 하나님께 순종할 수 없습니다. 왜냐하면 그것들이 그의 영혼을 눈멀게 하였고, 그는 낮에도 밤처럼 걷기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δουλεύει
  english_pob_choice: is enslaved
  chosen_korean: 종노릇하기 때문에
  alternatives_korean:
  - 노예가 되어 있기 때문에
  - 사로잡혀 있기 때문에
  lexicon: δουλεύω
  rationale: 영어 POB의 “is enslaved”를 반영하되, 한국어에서는 동사적 표현인 ‘종노릇하다’가 예속 상태를 자연스럽고 강하게 드러냅니다.
- source_word: πάθεσιν ἐναντίοις
  english_pob_choice: two contrary passions
  chosen_korean: 두 가지 서로 반대되는 정념
  alternatives_korean:
  - 두 가지 서로 대립하는 열정
  - 두 가지 상반된 욕정
  lexicon: πάθος / ἐναντίος
  rationale: πάθη는 단순한 감정보다 내적 정념·욕구의 힘을 가리키므로 ‘정념’으로 옮기고, ἐναντίοις는 ‘서로 반대되는’으로 직접 드러냈습니다.
- source_word: ὑπακοῦσαι οὐ δύναται
  english_pob_choice: cannot obey
  chosen_korean: 순종할 수 없습니다
  alternatives_korean:
  - 복종할 수 없습니다
  - 말을 들을 수 없습니다
  lexicon: ὑπακούω
  rationale: 하나님께 대한 반응이므로 ‘순종하다’가 가장 정확하며, 문맥상 능력 부정을 살려 ‘할 수 없습니다’로 옮겼습니다.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  english_pob_choice: they have blinded his soul
  chosen_korean: 그의 영혼을 눈멀게 하였고
  alternatives_korean:
  - 그의 영혼을 소경 되게 하였고
  - 그의 혼을 어둡게 하였고
  lexicon: τυφλόω / ψυχή
  rationale: τυφλόω의 직접적 의미를 살려 ‘눈멀게 하다’로 옮기고, ψυχή는 본문이 말하는 내적 중심을 ‘영혼’으로 유지했습니다.
theological_decisions:
- issue: 예속의 대상이 단순한 습관이 아니라 서로 대립하는 내적 힘으로 제시됨
  chosen_reading: ‘두 가지 서로 반대되는 정념’과 ‘종노릇하기 때문에’로 내적 분열과 지배를 함께 드러냈습니다.
  alternative_readings:
  - ‘두 가지 상반된 욕정’
  - ‘사로잡혀 있기 때문에’
  rationale: 본문은 행위의 결과보다 내면의 지배 구조를 강조하므로, 예속과 내적 충돌을 둘 다 보존하는 번역이 필요합니다.
  doctrine_reference: 인간의 내적 분열과 죄의 지배에 대한 본문 관찰
- issue: 하나님께 대한 응답 불능이 단순 무지보다 도덕적·영적 장애로 제시됨
  chosen_reading: ‘하나님께 순종할 수 없습니다’로 능력 상실을 분명히 했습니다.
  alternative_readings:
  - ‘하나님께 복종할 수 없습니다’
  - ‘하나님께 따를 수 없습니다’
  rationale: 문맥상 지적 결함이 아니라 눈멂으로 인한 영적 무능을 말하므로, 순종 불능을 직접적으로 표현했습니다.
  doctrine_reference: 죄로 인한 영적 무능에 대한 본문 관찰
