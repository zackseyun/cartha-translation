  source_fidelity: 그리스어의 핵심 의미(두 상반된 정념에 예속됨, 하나님께 순종하지 못함, 그 정념들이 영혼을 눈멀게 함, 낮에 밤처럼 걸음)는 대체로 반영했습니다. 다만 본문의 '두 정념'과 '서로 반대되는'의 결합을 자연스럽게 바로잡고, 오탈자를 수정할 필요가 있습니다.
