  terminology: '''정념'', ''종노릇하다'', ''순종하다'', ''영혼을 눈멀게 하다''는 본문의 어휘와 격식 있는 합쇼체에 적절합니다. 다만 초안의 ''հակ대되는''은 명백한 문자 혼입 오탈자입니다.'
  issues:
