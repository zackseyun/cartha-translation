revisions:
- from: 그리고 이것이 포도주를 마실 때의 분별입니다. 곧 부끄러움을 지키는 한 마시고, 수치스러움으로 빠지지 않으면, 포도주를 마셔도 됩니다.[a]
  to: 그리고 이것이 포도주를 마실 때의 분별입니다. 부끄러움을 잃지 않는 동안에는 마십니다.
  rationale: 원문에 없는 ‘수치스러움으로 빠지지 않으면’이라는 조건을 삭제하고, πίνει의 현재 직설법을 일반적 서술로 옮겼습니다. 또한 내용 없는 각주 표지를 제거했습니다.
  reviewer_model: gpt-5.6-terra
