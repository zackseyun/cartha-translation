source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ αὕτη ἐστὶν ἡ σύνεσις τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ, πίνει.
  language: Greek
  note: Greek from Charles XIV.7b (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: ko
  text: 그리고 이것이 포도주를 마실 때의 분별입니다. 부끄러움을 잃지 않는 동안에는 마십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνεσις
  english_pob_choice: discretion
  chosen_korean: 분별
  alternatives_korean:
  - 신중함
  - 지각
  lexicon: σύνεσις
  rationale: 행동의 판단력과 절제를 함께 가리키는 말이므로, 문맥상 가장 자연스럽고 넓은 대응어인 ‘분별’을 택했습니다.
- source_word: οἰνοποσίας
  english_pob_choice: drinking wine
  chosen_korean: 포도주를 마실 때
  alternatives_korean:
  - 포도주를 마시는 일
  - 술 마심
  lexicon: οἰνοποσία
  rationale: 일반적인 ‘마심’보다 구체적으로 포도주 섭취를 드러내기 위해 ‘포도주를 마실 때’로 옮겼습니다.
- source_word: αἰδῶ
  english_pob_choice: modesty
  chosen_korean: 부끄러움을 지키는
  alternatives_korean:
  - 수치를 삼가는
  - 절제를 지키는
  lexicon: αἰδώς
  rationale: 단순한 예의보다 내적 수치심과 자제의 뉘앙스가 있어, ‘부끄러움을 지키는’으로 옮겨 원어의 도덕적 긴장을 살렸습니다.
- source_word: πίνει
  english_pob_choice: he may drink wine
  chosen_korean: 포도주를 마셔도 됩니다
  alternatives_korean:
  - 마실 수 있습니다
  - 마십니다
  lexicon: πίνω
  rationale: 조건을 충족할 때 허용되는 결론을 분명히 하기 위해 공손한 허용 표현을 사용했습니다.
theological_decisions:
- issue: 절제와 허용의 관계
  chosen_reading: 본문은 포도주 자체를 절대 금지하지 않고, 부끄러움을 잃지 않는 절제 안에서의 섭취를 허용합니다.
  alternative_readings:
  - 포도주를 강하게 경계하는 금주 권면
  - 단순한 음주 예절 안내
  rationale: 영어 POB의 audit trail이 ‘modesty’와 ‘does not go astray into shamelessness’를 함께 보존하므로, 본문은 조건부 허용으로 읽는 것이 가장 충실합니다.
  doctrine_reference: 윤리적 절제와 자유의 긴장
