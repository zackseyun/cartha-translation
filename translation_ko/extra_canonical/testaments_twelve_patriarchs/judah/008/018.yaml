revisions:
- from: 사람이 포도주를 취하도록 마시면, 더러운 생각들로 당신의 마음을 뒤흔들고 육체를 성적 결합을 향해 달아오르게 하며, 욕망의 기회가 있으면 그가 죄를 짓고 부끄러워하지 않습니다.[a]
  to: 사람이 포도주를 술에 취할 때까지 마시면, 더러운 생각으로 마음을 혼란스럽게 하고, 쾌락을 좇아 몸을 음행에 이르도록 달아오르게 하며, 죄를 짓고도 부끄러워하지 않습니다.
  rationale: 원문에 없는 ‘욕망의 기회’ 조건을 삭제하고, πορνεία와 ἡδονή의 의미 구별을 보존했습니다. 그리스어의 일반화된 경고 형식은 한국어에서도 ‘사람이 … 마시면’으로 유지했습니다. 원문의 δεύτε인칭 소유대명사 σου는 선행하는 τις 및 뒤의 단수 동사와 긴장 관계가 있으므로, 한국어에서는 인칭을 특정하지 않는 ‘마음’과 ‘몸’으로 처리하여 불필요한 본문 수정이나 해석적 조화를 피했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:06Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초고는 원문에 없는 조건절(‘욕망의 기회가 있으면’)을 영어 POB의 해석적 확장에 따라 삽입했습니다. 그리스어 본문은 포도주를 취하도록 마시는 일의 결과로 더러운 생각, 음행을 향한 육체의 격정, 죄의 실행과 무수치를 연속하여 진술합니다. 또한 ἡδονή는 여기서 우선 ‘쾌락’이며, 이를 ‘성적 결합’으로 확정하면 πορνεία와 구별되어 있는 원문의 표현을 불필요하게 좁힙니다.
  naturalness: ‘포도주를 취하도록 마시면’은 현대 한국어에서 어색합니다. ‘포도주를 술에 취할 때까지 마시면’이 자연스럽고 원문의 결과 표현을 보존합니다. ‘몸을 음행에 이르도록 달아오르게 하다’는 다소 직역적이지만, 고전적 도덕 권면의 격정적 표현을 현대 합쇼체로 무리 없이 전달합니다.
  terminology: οἶνος는 ‘포도주’, μέθη는 ‘술에 취함’, ῥυπαροί는 ‘더러운’, πορνεία는 성적 부도덕 행위를 가리키는 ‘음행’, ἡδονή는 ‘쾌락’으로 옮겼습니다. ‘성적 결합’은 ἡδονή의 의미를 과도하게 특정하므로 피했습니다. ἁμαρτία는 ‘죄’, αἰσχύνεται는 ‘부끄러워하지 않습니다’가 적절합니다.
  issues:
  - severity: high
    issue: 원문에 없는 ‘욕망의 기회가 있으면’ 조건절이 삽입되었습니다.
    rationale: 제시된 그리스어에는 이에 해당하는 절이 없습니다. 영어 POB 문구가 제공되었더라도 원어 원문 우선 원칙에 따라 삭제해야 합니다.
  - severity: medium
    issue: ἡδονή를 ‘성적 결합’으로 번역했습니다.
    rationale: 원문은 ‘쾌락’을 뜻하는 ἡδονή와 ‘음행’을 뜻하는 πορνεία를 함께 사용합니다. ‘성적 결합’은 의미를 좁히고 두 표현의 구별을 흐립니다.
  - severity: low
    issue: ‘포도주를 취하도록 마시면’의 표현이 부자연스럽습니다.
    rationale: ‘포도주를 술에 취할 때까지 마시면’이 εἰς μέθην을 더 자연스럽고 정확하게 전달합니다.
  revised_text: 사람이 포도주를 술에 취할 때까지 마시면, 더러운 생각으로 마음을 혼란스럽게 하고, 쾌락을 좇아 몸을 음행에 이르도록 달아오르게 하며, 죄를 짓고도 부끄러워하지 않습니다.
  revised_footnotes: []
