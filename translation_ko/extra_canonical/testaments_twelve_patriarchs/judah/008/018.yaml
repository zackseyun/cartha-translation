id: T12P.JUD.8.18
reference: Testament of Judah 8:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: ko
  text: 사람이 포도주를 취하도록 마시면, 더러운 생각들로 당신의 마음을 뒤흔들고 육체를 성적 결합을 향해 달아오르게 하며, 욕망의 기회가 있으면 그가 죄를 짓고 부끄러워하지 않습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶνον ... εἰς μέθην
  english_pob_choice: wine to drunkenness
  chosen_korean: 포도주를 취하도록 마시면
  alternatives_korean:
  - 포도주를 술취함에 이르도록 마시면
  - 포도주를 과음하여 취하게 되면
  lexicon: οἶνος, μέθη
  rationale: 원문의 ‘포도주를 … 취하도록’이라는 목적/결과 구조를 살려, 단순히 ‘술’이 아니라 포도주를 과음해 취하는 행위를 드러냈습니다.
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  english_pob_choice: with filthy thoughts
  chosen_korean: 더러운 생각들로
  alternatives_korean:
  - 더러운 생각들 속에서
  - 추한 생각들로
  lexicon: διαλογισμός, ῥυπαρός
  rationale: ‘διαλογισμοῖς’의 수단/영역감을 살려 ‘생각들로’라고 했고, ῥυπαροῖς는 도덕적 오염의 뉘앙스를 담아 ‘더러운’으로 옮겼습니다.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  english_pob_choice: leads the body on to sexual union
  chosen_korean: 육체를 성적 결합을 향해 달아오르게 하며
  alternatives_korean:
  - 몸을 쾌락을 향해 달아오르게 하며
  - 몸을 정욕으로 뜨겁게 하며
  lexicon: ἐκθερμαίνω, σῶμα, ἡδονή
  rationale: 영어 본문의 해석을 따르되, ἡδονή의 직접적 의미인 ‘쾌락’보다 문맥상 성적 유혹을 분명히 하기 위해 ‘성적 결합’을 선택했습니다.
- source_word: πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται
  english_pob_choice: he commits the sin and is not ashamed
  chosen_korean: 그가 죄를 짓고 부끄러워하지 않습니다
  alternatives_korean:
  - 그는 죄를 행하고 부끄러워하지 않습니다
  - 그가 그 죄를 저지르고도 수치스러워하지 않습니다
  lexicon: πράσσω, ἁμαρτία, αἰσχύνομαι
  rationale: ‘πράσσει’를 관용적으로 ‘죄를 짓다’로 옮겨 한국어 가독성을 확보했고, ‘부끄러워하지 않습니다’는 수치감의 결여를 직접적으로 전달합니다.
theological_decisions:
- issue: 포도주 취함이 일으키는 도덕적 연쇄의 표현
  chosen_reading: 원문의 인과 흐름을 따라 취함 → 더러운 생각 → 육체의 달아오름 → 죄 → 부끄러움 없음의 순서를 유지했습니다.
  alternative_readings:
  - 설교적 요약으로 압축하는 방식
  - 성적 결합 부분을 완화해 일반적 쾌락으로 돌리는 방식
  rationale: 이 구절은 금주 경고와 정욕 경고를 한 줄로 연결하므로, 중간 단계를 약화하면 저자의 도덕적 논증이 흐려집니다.
  doctrine_reference: 문맥 보존 원칙
- issue: ‘성적 결합’ 표현의 직접성
  chosen_reading: ἡδονή를 단순한 일반 쾌락보다 성적 유혹의 방향으로 이해해 더 직접적인 표현을 사용했습니다.
  alternative_readings:
  - ‘쾌락’으로 완화하는 번역
  - ‘정욕’으로 추상화하는 번역
  rationale: 앞뒤 문맥이 πορνεία와 ἁμαρτία를 잇고 있어, 여기서의 ἡδονή는 단순한 즐거움보다 성적 방종을 가리키는 것으로 읽는 편이 source-grounded합니다.
  doctrine_reference: 문맥 기반 의미 결정
