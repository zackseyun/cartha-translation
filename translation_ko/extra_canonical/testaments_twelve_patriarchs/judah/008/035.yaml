id: T12P.JUD.8.35
reference: Testament of Judah 8:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: ko
  text: 이제, 나의 자녀들아, 내가 너희에게 명합니다. 레위를 사랑하십시오. 그리하면 너희가 살아남을 것입니다. 그리고 그에게 맞서 자신을 높이지 마십시오. 그렇지 않으면 너희가 완전히 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω ὑμῖν
  english_pob_choice: I command you
  chosen_korean: 내가 너희에게 명하노니
  alternatives_korean:
  - 내가 너희에게 명합니다
  - 내가 너희에게 명령합니다
  lexicon: παραγγέλλω
  rationale: 강한 권고가 아니라 권위 있는 명령이라는 힘을 살리되, 한국어에서는 예언적/유언적 어조에 맞게 「명하노니」로 자연스럽게 옮겼습니다.
- source_word: ἀγαπᾶτε τὸν Λευὶ
  english_pob_choice: love Levi
  chosen_korean: 레위를 사랑하십시오
  alternatives_korean:
  - 레위를 사랑하시오
  - 레위를 사랑하세요
  lexicon: ἀγαπάω
  rationale: ἀγαπᾶτε의 명령형을 공적인 합쇼체로 옮기면서, 대상인 레위 이름은 기존 인명 표기 관습에 맞춰 유지했습니다.
- source_word: ἵνα διαμείνητε
  english_pob_choice: that you may live
  chosen_korean: 그리하면 너희가 살아남을 것입니다
  alternatives_korean:
  - 그리하면 너희가 머무를 것입니다
  - 그리하면 너희가 지속될 것입니다
  lexicon: διαμένω
  rationale: 문맥상 단순 존속보다 생존의 결과가 강조되어, POB의 영어와 어긋나지 않게 「살아남다」로 풀었습니다.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν
  english_pob_choice: do not exalt yourselves against him
  chosen_korean: 그를 대적하여 스스로 높아지지 마십시오
  alternatives_korean:
  - 그에게 맞서 스스로 높이지 마십시오
  - 그에게 우쭐대지 마십시오
  lexicon: ἐπαίρω
  rationale: ἐπ᾽ αὐτόν의 반대 대상성을 드러내기 위해 「대적하여」를 넣어, 단순한 교만보다 ‘그를 향해 자신을 높이는 태도’를 분명히 했습니다.
- source_word: ἐξολοθρευθῆτε
  english_pob_choice: be utterly destroyed
  chosen_korean: 완전히 멸망할 것입니다
  alternatives_korean:
  - 완전히 멸절될 것입니다
  - 철저히 멸망할 것입니다
  lexicon: ἐξολοθρεύω
  rationale: 완전한 파멸의 강도를 살리되, 현대 한국어에서 자연스럽고 직접적인 「완전히 멸망하다」를 선택했습니다.
theological_decisions:
- issue: 레위에 대한 명령의 공동체적·서열적 의미
  chosen_reading: 레위를 사랑하라는 명령은 단순한 개인 호감이 아니라, 공동체가 레위를 인정하고 그에게 반역하거나 교만하게 맞서지 말라는 언약적 권면으로 읽었습니다.
  alternative_readings:
  - 레위 개인에 대한 정서적 애정의 요청
  - 정치적 충성 요구
  rationale: 뒤따르는 경고(그를 대적하여 스스로 높아지지 말라, 그렇지 않으면 멸망한다)가 감정 표현보다 공동체적 순종을 가리키므로 그 의미를 반영했습니다.
  doctrine_reference: 본문 맥락
- issue: 문장 첫 부분의 담화 톤
  chosen_reading: 유언적 권면의 톤을 살리기 위해 첫 문장을 ‘이제, 내 자녀들아’로 시작했습니다.
  alternative_readings:
  - 자녀들아, 이제
  - 그리고 이제, 내 자녀들아
  rationale: 원문의 Καὶ νῦν과 τέκνα μου를 직역하면 다소 경직될 수 있어, 한국어에서 자연스럽고도 엄중한 권면 분위기를 유지했습니다.
  doctrine_reference: 담화/화행
