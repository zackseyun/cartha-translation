id: T12P.JUD.8.17
reference: Testament of Judah 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὸ γὰρ πνεῦμα τῆς πορνείας τὸν οἶνον ὡς διάκονον ἔχει πρὸς τὴν ἡδονὴν τοῦ νοός. ὅτι καίγε τὰ δύο ταῦτα ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου.
  language: Greek
  note: Greek from Charles XIV.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: ko
  text: 음행의 영은 술을 자기의 집사로 삼아, 마음에 쾌락을 주게 합니다. 왜냐하면 이 두 가지가 사람의 분별력도 빼앗기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τῆς πορνείας
  english_pob_choice: the spirit of sexual immorality
  chosen_korean: 음행의 영
  alternatives_korean:
  - 성적 부도덕의 영
  - 음란의 영
  lexicon: πνεῦμα, πορνεία
  rationale: 포르네이아는 단순한 성행위가 아니라 언약 밖의 성적 타락을 가리키므로, 직역에 가깝되 한국어 성경에서 통용되는 ‘음행’을 택했습니다.
- source_word: διάκονον
  english_pob_choice: a servant
  chosen_korean: 집사로
  alternatives_korean:
  - 종으로
  - 일꾼으로
  lexicon: διάκονος
  rationale: 문맥상 기능적 하인을 뜻하므로 ‘집사’의 교회 직분 의미보다 넓은 일반적 ‘섬기는 자’의 감각을 살리기 위해, 다소 비유적으로 ‘집사로 삼아’라고 옮겼습니다.
- source_word: ἡδονήν τοῦ νοός
  english_pob_choice: pleasure to the mind
  chosen_korean: 마음에 쾌락을 주게
  alternatives_korean:
  - 생각에 즐거움을 주게
  - 지성에 쾌락을 주게
  lexicon: ἡδονή, νοῦς
  rationale: νοῦς는 단순한 감정보다 사고·판단의 중심을 가리키므로 ‘마음’으로 풀되, ἡδονή의 강한 쾌락성을 살려 완화하지 않았습니다.
- source_word: τὴν διάνοιαν τοῦ ἀνθρώπου
  english_pob_choice: a person's understanding
  chosen_korean: 사람의 분별력
  alternatives_korean:
  - 사람의 이해력
  - 사람의 생각
  lexicon: διάνοια
  rationale: διάνοια는 이해력과 판단 기능을 포함하므로, 문맥상 ‘빼앗다’와 자연스럽게 맞는 ‘분별력’을 선택했습니다.
theological_decisions:
- issue: ‘spirit of sexual immorality’의 인격화와 도구적 관계
  chosen_reading: 음행의 영이 술을 도구처럼 사용하여 사람의 판단을 무너뜨린다는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 비유적 표현으로만 읽는 해석
  - 술 자체를 악으로 보는 해석
  rationale: 본문은 음행의 영을 주어로, 술을 ‘집사/도구’로 두어 쾌락과 분별 상실을 연결하므로, 인격화된 악의 작동을 그대로 보존해야 합니다.
  doctrine_reference: 악의 영적 유혹에 대한 묘사
