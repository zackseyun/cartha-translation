base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/002.yaml
  text: She bore me Er and Onan and Shelah. And the Lord killed the first two, for Er was wicked; and Onan, when he had married Tamar, spilled the seed upon the ground, according to the commandment of his mother, and he also died through wickedness.
translation:
  language: ko
  text: 그 여자가 내게 에르와 오난과 셀라를 낳았습니다. 그리고 주님께서 그 둘을 죽이셨습니다. 에르는 악했기 때문입니다. 오난은 다말과 결혼한 뒤 씨를 땅에 흘렸고, 어머니의 명령을 따랐으며, 그도 악함으로 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὕτη ἔτεκέν μοι
  english_pob_choice: She bore me
  chosen_korean: 그 여자가 내게 낳았습니다
  alternatives_korean:
  - 그가 내게 낳았습니다
  - 그 여자가 나에게 낳아 주었습니다
  lexicon: τίκτω
  rationale: 주어 Αὕτη를 살려 ‘그 여자’로 번역하고, 1인칭 여격 μοι는 ‘내게’로 옮겨 출산 행위를 분명히 나타냈습니다.
- source_word: Ἦρ / Αὐνὰν / Σηλώμ
  english_pob_choice: Er / Onan / Shelah
  chosen_korean: 에르 / 오난 / 셀라
  alternatives_korean:
  - 에르 / 오난 / 스엘라
  - 에르 / 오난 / 셀롬
  lexicon: 고유명사
  rationale: 본문의 인명은 현대 외래어 표기와 기존 성경 관용을 함께 고려해 에르, 오난, 셀라로 음역했습니다.
- source_word: ἀνεῖλεν Κύριος
  english_pob_choice: the Lord killed
  chosen_korean: 주님께서 죽이셨습니다
  alternatives_korean:
  - 주님께서 치셨습니다
  - 주님께서 제거하셨습니다
  lexicon: ἀναιρέω
  rationale: ἀνεῖλεν은 단순한 ‘치다’보다 생명을 거두어 죽게 하다는 뜻이 분명하므로, 직접적인 ‘죽이셨습니다’로 옮겼습니다.
- source_word: ἔζησεν
  english_pob_choice: he died through wickedness / he lived
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 살았습니다
  - 살아 있었습니다
  lexicon: ζάω
  rationale: 현재 주어진 그리스어 본문은 ‘셋이 살았다’로 읽히지만, 영어 POB는 오난까지 설명하는 확장 전통을 반영합니다. 본문 핵심 절만 따르면 셀라에 대해 ‘죽었습니다’는 부적절하므로 ‘그도 악함으로 죽었습니다’는 영어 주석 전통을 반영한 보충 설명임을 전제로 처리했습니다.
theological_decisions:
- issue: 본문의 그리스어 짧은 판독과 영어 POB의 확장 판독 차이
  chosen_reading: 한국어 본문은 핵심 그리스어 문장에 맞추되, 영어 POB가 전하는 오난의 악행 설명을 함께 반영했습니다.
  alternative_readings:
  - 그 둘을 주님께서 죽이셨습니다. 셀라가 살았습니다.
  - 그 둘을 주님께서 죽이셨습니다. 그러므로 셀라는 살았습니다.
  rationale: 제공된 그리스어는 두 아들의 죽음과 셀라의 생존만 말하지만, 영어 POB는 오난의 죄와 죽음 이유를 풀어 적습니다. 본문과 전승 설명을 함께 보이게 하되, 셀라의 운명은 그리스어 본문 그대로 ‘살았습니다’로 처리했습니다.
  doctrine_reference: source criticism / expanded translation tradition
