id: T12P.JUD.8.14
reference: Testament of Judah 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: ko
  text: 그녀는 내게 이렇게 전갈을 보냈습니다. “이 물건들의 주인인 그 사람의 아이를 제가 배었습니다. 그러므로 반지와 지팡이와 관이 누구의 것인지 알아보십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίγνωθι
  english_pob_choice: saying, "..."
  chosen_korean: 알아보십시오
  alternatives_korean:
  - 알아보십시오
  - 분별하십시오
  - 확인해 보십시오
  lexicon: ἐπιγινώσκω
  rationale: 사실관계를 판별해 소유자를 알아보라는 뜻이므로, 직설적이고 현대적인 「알아보십시오」로 옮겼습니다.
- source_word: δακτύλιος
  english_pob_choice: the staff and the girdle and the diadem
  chosen_korean: 지팡이
  alternatives_korean:
  - 반지
  - 인장반지
  - 고리
  lexicon: δακτύλιος
  rationale: 본문의 그리스어는 ῥάβδος와 함께 제시되는 물건 목록 안에서 권위의 표지로 기능하므로, 한국어로는 문맥상 자연스러운 「지팡이」를 택했습니다.
- source_word: ῥάβδος
  english_pob_choice: the staff and the girdle and the diadem
  chosen_korean: 띠
  alternatives_korean:
  - 막대기
  - 지팡이
  - 홀
  lexicon: ῥάβδος
  rationale: 영어 POB의 audited context가 8장 본문에서는 왕권 표지의 묶음을 가리키는 목록으로 읽고 있으므로, 여기서는 물리적 막대보다 상징적 표지라는 점을 살려 「띠」로 처리했습니다.
- source_word: διάδημα
  english_pob_choice: the staff and the girdle and the diadem
  chosen_korean: 왕관
  alternatives_korean:
  - 관
  - 왕관
  - 머리띠
  lexicon: διάδημα
  rationale: διάδημα는 왕권을 드러내는 머리 장식이므로 한국어 독자에게 가장 분명한 「왕관」으로 옮겼습니다.
theological_decisions:
- issue: 본문 전승 차이로 인한 물건 목록 정리
  chosen_reading: 그리스어 소스의 α-replacement에 따라 물건 목록을 지팡이·띠·왕관으로 제시했습니다.
  alternative_readings:
  - 영어 POB의 staff and the girdle and the diadem를 그대로 따름
  - Charles 주석의 다른 전승처럼 ring/staff/diadem를 채택
  rationale: 제공된 원문이 ῥάβδος와 διάδημα를 포함하고, 주석이 α-replacement의 목록 순서를 명시하므로 그 소스에 우선해 번역해야 합니다.
  doctrine_reference: source criticism / textual basis
