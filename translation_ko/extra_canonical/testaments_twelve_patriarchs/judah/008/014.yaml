revisions:
- from: 그녀는 몰래 내게 사람의 것이 아닌가 하는 이 물건들, 곧 지팡이와 띠와 왕관을 보내며 말했습니다. 「이것들이 속한 그 사람으로 말하면, 제가 임신했습니다. 그러니 지팡이와 띠와 왕관이 누구의 것인지 알아보십시오」.[a]
  to: 그녀는 내게 이렇게 전갈을 보냈습니다. “이 물건들의 주인인 그 사람의 아이를 제가 배었습니다. 그러므로 반지와 지팡이와 관이 누구의 것인지 알아보십시오.”
  rationale: 제공된 그리스어 α-대체 본문을 우선하여 물건들을 ‘반지·지팡이·관’의 순서로 바로잡았습니다. 원문에 없는 비밀스러운 전달의 뉘앙스와 미제공 각주 표지를 제거했으며, 임신 및 소유자 확인의 요청은 현대 공식 한국어로 자연스럽게 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:06Z'
