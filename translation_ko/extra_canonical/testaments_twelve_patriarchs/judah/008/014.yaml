  source_fidelity: 그리스어 α-대체 본문은 여자가 유다에게 전갈을 보내며 물건의 주인을 알아보라고 하는 내용입니다. 물건 목록은 δακτύλιος(반지), ῥάβδος(지팡이), διάδημα(디아뎀/관)이며, 초안의 지팡이·띠·왕관은 원문 및 제공된 본문비평 주석과 맞지 않습니다. 또한 원문에는 ‘몰래’나 ‘끌려 나갈 때’라는 정보가 없습니다.
