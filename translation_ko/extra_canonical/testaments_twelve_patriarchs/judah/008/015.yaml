  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐπιγνοὺς δὲ ἐγὼ εἶπον· Δεδικαίωται Θαμὰρ ἢ ἐγώ. Καὶ οὐ προσεθέμην ἔτι τοῦ γνῶναι αὐτήν.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: ko
  text: 그런데 내가 그것을 알아보고 부끄러워하며 말했습니다. 「다말이 나보다 더 의롭습니다. 이는 내가 그녀를 내 아들 셀라에게 주지 않았기 때문입니다.」 그리고 나는 다시는 그녀를 알지 않았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιγνοὺς
  english_pob_choice: And I recognized them
  chosen_korean: 그것을 알아보고
  alternatives_korean:
  - 그들을 알아보고
  - 알아차리고
  lexicon: ἐπιγιγνώσκω
  rationale: 완료적 ‘알아봄’의 뉘앙스를 살리되, 문맥상 뒤따르는 부끄러움과 진술에 자연스럽게 이어지도록 간결하게 옮겼습니다.
- source_word: Δεδικαίωται Θαμὰρ ἢ ἐγώ
  english_pob_choice: Tamar is more righteous than I
  chosen_korean: 다말이 나보다 더 의롭습니다
  alternatives_korean:
  - 다말이 나보다 더 의로우십니다
  - 다말이 나보다 옳습니다
  lexicon: δικαιόω / δίκαιος
  rationale: 법정적·도덕적 비교를 드러내는 ‘더 의롭다’를 택했고, 현대 서술체에 맞게 직설적으로 표현했습니다.
- source_word: τοῦ γνῶναι αὐτήν
  english_pob_choice: I did not give her to Shelah my son / I did not know her again
  chosen_korean: 그녀를 다시는 알지 않았습니다
  alternatives_korean:
  - 그녀를 다시는 관계하지 않았습니다
  - 그녀를 다시 가까이하지 않았습니다
  lexicon: γινώσκω
  rationale: 앞 문맥의 성적·혼인 맥락을 반영해 ‘알다’의 완곡한 용례를 유지했고, 부정과 재접촉의 종결을 ‘다시는’으로 분명히 했습니다.
- source_word: Σελήμ
  english_pob_choice: Shelah my son
  chosen_korean: 내 아들 셀라
  alternatives_korean:
  - 내 아들 세라
  - 내 아들 스엘라
  lexicon: 고유명사 음역
  rationale: 성서 인명으로 널리 통용되는 형태를 따르되, 본문 맥락상 ‘내 아들’ 관계를 명시해 영어 POB의 설명을 반영했습니다.
theological_decisions:
- issue: 다말의 의로움에 대한 비교 진술
  chosen_reading: 다말이 나보다 더 의롭습니다
  alternative_readings:
  - 다말이 나보다 더 옳습니다
  - 다말이 나보다 더 정당합니다
  rationale: 본문의 δικαιόω는 단순한 판단이 아니라 잘못된 행위에 대한 도덕·법정적 판정을 포함하므로 ‘의롭다’가 원문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: 의/칭의 어휘의 기본 용례
- issue: 성적 관계를 완곡하게 표현하는 γινώσκω
  chosen_reading: 그녀를 다시는 알지 않았습니다
  alternative_readings:
  - 그녀를 다시는 가까이하지 않았습니다
  - 그녀와 다시 관계하지 않았습니다
  rationale: 원문이 직접적인 성적 행위를 기술하지 않고 ‘알다’의 관용을 쓰므로, 한국어에서도 과도한 노골화 대신 문맥이 드러내는 완곡성을 유지했습니다.
  doctrine_reference: 성서 관용어법
