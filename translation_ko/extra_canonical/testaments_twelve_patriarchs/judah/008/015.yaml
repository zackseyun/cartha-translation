revisions:
- from: 그런데 내가 그것을 알아보고 부끄러워하며 말했습니다. 「다말이 나보다 더 의롭습니다. 이는 내가 그녀를 내 아들 셀라에게 주지 않았기 때문입니다.」 그리고 나는 다시는 그녀를 알지 않았습니다.[a][b]
  to: 내가 깨닫고 말했습니다. “다말이 나보다 더 의롭습니다.” 그리고 나는 다시는 그녀를 알지 않았습니다.[a]
  rationale: 제시된 그리스어 본문만을 기준으로, 영어 POB에 있으나 그리스어에 없는 수치심과 셀라 관련 인과 설명을 삭제했습니다. 목적어가 명시되지 않은 Ἐπιγνοὺς는 ‘깨닫고’로 옮겼고, 다말에 대한 비교 판정과 재차 관계하지 않았다는 완곡한 진술은 유지했습니다. 누락된 각주 표지도 단일 설명 각주로 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:03Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문에는 ‘부끄러워했다’와 ‘내 아들 셀라에게 주지 않았기 때문에’라는 내용이 없습니다. 또한 Ἐπιγνοὺς는 목적어를 명시하지 않으므로 ‘그것을 알아보고’보다 목적어를 보충하지 않는 번역이 안전합니다. Δεδικαίωται는 다말이 화자보다 더 정당/의롭다는 비교 판정이며, τοῦ γνῶναι αὐτήν은 문맥상 성관계를 가리키는 완곡 표현입니다.
  naturalness: ‘내가 깨닫고 말했습니다’와 ‘다시는 그녀를 알지 않았습니다’는 현대 표준어 합쇼체 서사에 자연스럽습니다. 인용문 안의 ‘의롭습니다’도 일관된 합쇼체입니다.
  terminology: ‘다말’은 통용 성서 인명 표기입니다. δικαιόω 계열의 판정적 의미는 ‘더 의롭습니다’로 보존했습니다. γινώσκω의 완곡법은 본문에서 ‘알다’로 유지하고 각주에서만 문맥상 의미를 밝혔습니다.
  issues:
