  source_fidelity: 그리스어는 한 번의 동사 ἔδωκε(‘주었다’) 아래에 두 여격 수혜자와 두 대격 목적어를 병렬로 둡니다. 초안의 의미는 대체로 정확하나, 원문에 없는 높임의 지시어 ‘그분’은 선행 문맥이 제시되지 않은 상태에서 인물의 위상을 높여 표시합니다. 또한 동사를 반복하지 않아도 한국어에서 원문의 압축된 병렬 구조를 자연스럽게 보존할 수 있습니다.
  naturalness: ‘내게는 … 그에게는 …’의 대조는 자연스럽고 적절합니다. 한 문장 끝에 ‘주었습니다’를 두어도 현대 한국어 합쇼체로 매끄럽고, 두 병렬 목적어의 대비가 선명합니다.
  terminology: ‘땅에 있는 것들’과 ‘하늘에 있는 것들’은 각각 τὰ ἐπὶ γῆς와 τὰ ἐν οὐρανοῖς를 중립적으로 잘 반영합니다. ‘그분’ 대신 ‘그’/‘그는’을 사용하여 원문이 명시하지 않는 존칭 또는 신학적 함의를 부가하지 않습니다.
  issues:
