  text: To me he gave the things on earth; to him the things in heaven.
translation:
  language: ko
  text: 그는 내게는 땅에 있는 것들을, 그에게는 하늘에 있는 것들을 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ ἔδωκε
  english_pob_choice: To me he gave
  chosen_korean: “내게는 … 주셨습니다”
  alternatives_korean:
  - “내게 주셨습니다”
  - “나에게는 … 주셨습니다”
  lexicon: δίνω / 주다
  rationale: 여격 대조를 살리기 위해 ‘내게는’으로 초점을 두었고, 본문이 과거 서술이므로 합쇼체 과거형으로 옮겼습니다.
- source_word: τὰ ἐπὶ γῆς
  english_pob_choice: the things on earth
  chosen_korean: “땅에 있는 것들을”
  alternatives_korean:
  - “지상에 있는 것들을”
  - “땅의 것들을”
  lexicon: γῆ / 땅
  rationale: ἐπὶ + 여격/표현이 가리키는 위치 관계를 자연스럽게 드러내면서도, ‘things’의 중립성을 유지하기 위해 ‘땅에 있는 것들’로 번역했습니다.
- source_word: τὰ ἐν οὐρανοῖς
  english_pob_choice: the things in heaven
  chosen_korean: “하늘에 있는 것들을”
  alternatives_korean:
  - “하늘의 것들을”
  - “천상에 있는 것들을”
  lexicon: οὐρανός / 하늘
  rationale: 지상과의 병렬을 유지하기 위해 ‘하늘에 있는 것들’을 택했으며, 종교적 해석을 과도하게 덧씌우지 않도록 ‘천상’보다 직접적 표현을 사용했습니다.
theological_decisions:
- issue: 지상과 하늘의 분배 대조
  chosen_reading: 본문의 대조를 단순한 소유 분배가 아니라 ‘땅’과 ‘하늘’의 두 영역에 대한 대비로 유지했습니다.
  alternative_readings:
  - ‘세상의 것들’과 ‘천국의 것들’로 상징화
  - ‘땅의 것’과 ‘하늘의 것’으로 더 축약
  rationale: 그리스어 원문은 두 개의 정관사구를 병렬로 놓아 영역 대비를 강조하므로, 의미를 평탄화하지 않고 그대로 살렸습니다.
  doctrine_reference: 문맥적 대조 표현
