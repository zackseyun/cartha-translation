id: T12P.JUD.8.12
reference: Testament of Judah 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: ko
  text: 그리고 성 안에 있던 사람들이 「여기에는 창녀도 없고, 문간에 앉아 있는 낯선 사람도 없습니다」라고 말하였습니다. 나는 내가 죄를 지었다는 것을 깨달았지만, 부끄러워서 그 일을 공개적으로 알리지 않았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ πόλει / ἐν τῇ πύλῃ
  english_pob_choice: here / by the gate
  chosen_korean: 성 안 / 문간
  alternatives_korean:
  - 도시 안 / 성문 옆
  - 성내 / 성문 곁
  lexicon: πόλις, πύλη
  rationale: ἐν τῇ πόλει는 ‘성 안’으로, ἐν τῇ πύλῃ는 단순한 ‘gate’보다 한국어로 자연스러운 ‘문간’으로 옮겨 공간 대비를 살렸습니다.
- source_word: τελεσικόμενον
  english_pob_choice: prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 음녀
  lexicon: lexical context from Greek witness
  rationale: 문맥상 성적 부도덕을 가리키는 대상어로서 직접적이고 표준적인 ‘창녀’를 사용했습니다.
- source_word: ἐξ ἄλλου χωρίου
  english_pob_choice: stranger
  chosen_korean: 낯선 사람
  alternatives_korean:
  - 외지인
  - 다른 곳에서 온 사람
  lexicon: χωρίον
  rationale: ‘다른 마을/지역에서 온 사람’이라는 뜻을 한국어에서 과도하게 특정하지 않도록 ‘낯선 사람’으로 중립적으로 처리했습니다.
- source_word: ἐνόμιζον ... οὐδεὶς ἔγνω
  english_pob_choice: I understood ... I did not make the matter known publicly
  chosen_korean: 나는 ... 깨달았지만 ... 공개적으로 알리지 않았습니다
  alternatives_korean:
  - 나는 ... 알았습니다 ... 드러내지 않았습니다
  - 나는 ... 알아차렸지만 ... 공표하지 않았습니다
  lexicon: νομίζω, γινώσκω
  rationale: νομίζω의 인지적 깨달음과, οὐδεὶς ἔγνω의 ‘아무도 알지 못했다’는 뉘앙스를 이어서 ‘깨달았다’와 ‘알리지 않았다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 화자의 죄 인식과 수치의 표현
  chosen_reading: ‘내가 죄를 지었다는 것을 깨달았지만, 부끄러워서 그 일을 공개적으로 알리지 않았습니다’로 죄책과 수치를 모두 드러냈습니다.
  alternative_readings:
  - ‘내가 죄를 지은 것을 알고도 널리 알리지 않았습니다’
  - ‘내가 잘못했음을 깨닫고도 숨겼습니다’
  rationale: 본문과 POB가 함께 보여 주는 핵심은 단순한 사실 통보가 아니라 죄 인식과 수치로 인한 비공개 처리이므로, 두 요소를 모두 보존했습니다.
  doctrine_reference: 서사적 회개/수치 인식
