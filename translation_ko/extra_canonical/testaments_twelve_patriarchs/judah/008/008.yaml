  text: 그리고 나는 “염소 새끼 한 마리를 당신에게 보내겠습니다”라고 말했습니다. 그러자 그녀는 “당신이 그것을 보낼 때까지 내게 담보를 주시겠습니까?”라고 말했습니다.
