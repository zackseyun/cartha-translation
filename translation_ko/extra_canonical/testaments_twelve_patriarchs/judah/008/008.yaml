- from: 그리고 나는 "양떼 중에서 새끼 한 마리를 당신에게 보내겠습니다"라고 말했습니다. 그리고 그녀는 "당신이 그것을 보낼 때까지 나에게 담보를 주시겠습니까?"라고 말했습니다.
  to: 그리고 나는 “염소 새끼 한 마리를 당신에게 보내겠습니다”라고 말했습니다. 그러자 그녀는 “당신이 그것을 보낼 때까지 내게 담보를 주시겠습니까?”라고 말했습니다.
  rationale: 직접 그리스어 증인이 없는 구절이라는 자료의 한계를 보존하면서, 영어 POB의 배경이 되는 창세기 전승에 따라 ‘kid’를 ‘염소 새끼’로 명확히 했습니다. 그 밖의 문장 구조와 담보 교환의 의미는 유지했습니다.
