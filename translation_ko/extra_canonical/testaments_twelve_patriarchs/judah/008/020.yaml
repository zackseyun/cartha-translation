  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: ko
  text: 포도주를 마신 뒤에도 나는 하나님의 명령을 부끄러워하지 않았고, 가나안 여자를 아내로 맞았습니다. 포도주를 마시는 사람은 분별이 많이 필요합니다, 내 자녀들아.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  english_pob_choice: I did not respect the commandment of God
  chosen_korean: 나는 하나님의 명령을 부끄러워하지 않았고
  alternatives_korean:
  - 나는 하나님의 명령을 존중하지 않았고
  - 나는 하나님의 명령을 부끄러워하지 않았습니다
  lexicon: ἐντολή; αἰσχύνομαι
  rationale: ἐντολή는 단순한 조언이 아니라 ‘명령’이며, αἰσχύνομαι는 여기서 공개적으로 무시하거나 수치를 당기게 하지 않는 뜻이므로 ‘부끄러워하지 않았다’가 문맥의 도덕적 긴장을 가장 직접적으로 살립니다.
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  english_pob_choice: and I took a woman of Canaan as wife
  chosen_korean: 가나안 여자를 아내로 맞았습니다
  alternatives_korean:
  - 가나안 여인을 아내로 취했습니다
  - 가나안 여자를 아내로 맞이했습니다
  lexicon: λαμβάνω; Χαναναία
  rationale: λαμβάνω는 혼인 맥락에서 ‘아내로 맞다/취하다’가 자연스럽고, Χαναναία는 지리·민족 표지이므로 ‘가나안 여자’로 옮겼습니다.
- source_word: πολλὴ γὰρ τῷ πίνοντι οἶνον ... τέκνα μου
  english_pob_choice: For much discretion is needed by the man who drinks wine, my children
  chosen_korean: 포도주를 마시는 사람은 분별이 많이 필요합니다, 내 자녀들아
  alternatives_korean:
  - 포도주를 마시는 사람에게는 많은 분별이 필요합니다, 내 자녀들아
  - 포도주를 마시는 자는 크게 삼가야 합니다, 내 자녀들아
  lexicon: πολλὴ ... τῷ πίνοντι οἶνον; τέκνα μου
  rationale: 직역의 ‘많은 분별’이 본문의 일반적 교훈을 유지하며, τέκνα μου는 설교적 호칭이므로 ‘내 자녀들아’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: ‘부끄러워하지 않았다’의 도덕적/관계적 뉘앙스
  chosen_reading: 하나님의 명령을 공개적으로 존중하지 못했다는 정도가 아니라, 그 명령에 부끄러움을 느끼지 않고 어겼다는 자기고백으로 옮겼습니다.
  alternative_readings:
  - 하나님의 명령을 존중하지 않았습니다
  - 하나님의 명령을 무시했습니다
  rationale: 원문 동사는 단순 불복종보다 수치와 관련된 내적 태도를 포함하므로, 한국어에서도 그 긴장을 보존해야 합니다.
  doctrine_reference: 성결과 순종의 윤리
