id: T12P.JUD.8.32
reference: Testament of Judah 8:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: ko
  text: 내 자녀들아, 돈에 대한 탐욕은 우상숭배로 이끕니다. 그것은 없는 신들을 돈의 미혹으로 부르게 하고, 그것을 가진 사람을 황홀경에 빠지게 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  english_pob_choice: My children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호칭의 친밀함을 살리되, 현대 합쇼체 본문에서 자연스러운 권면형으로 옮겼습니다.
- source_word: ἡ φιλαργυρία
  english_pob_choice: the love of money
  chosen_korean: 돈에 대한 탐욕
  alternatives_korean:
  - 돈을 사랑함
  - 재물에 대한 사랑
  lexicon: φιλαργυρία
  rationale: 단순한 애호가 아니라 부정적 뉘앙스가 강한 ‘탐욕’이 원문의 도덕적 경계를 더 분명히 드러냅니다.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  english_pob_choice: leads to idolatry
  chosen_korean: 우상숭배로 이끕니다
  alternatives_korean:
  - 우상숭배로 안내합니다
  - 우상숭배에 이르게 합니다
  lexicon: ὁδηγεῖ / εἰδωλολατρία
  rationale: ‘이끌다’는 인과를 자연스럽게 살리며, εἰδωλολατρία를 표준적인 신학 용어인 ‘우상숭배’로 옮겼습니다.
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  english_pob_choice: these things turn the mind away from the law of God
  chosen_korean: 없는 신들을 돈의 미혹으로 부르게 하고
  alternatives_korean:
  - 존재하지 않는 신들을 부르게 하고
  - 신이 아닌 것들을 신이라 부르게 하고
  lexicon: μὴ ὄντας θεοὺς / ὀνομάζουσι
  rationale: 원문은 ‘존재하지 않는 신들’을 이름 붙이는 거짓 호칭을 말하므로, 그 부정성을 유지해 직역에 가깝게 처리했습니다.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  english_pob_choice: turn the mind away
  chosen_korean: 황홀경에 빠지게 합니다
  alternatives_korean:
  - 정신을 잃게 합니다
  - 넋을 잃게 합니다
  lexicon: ἔκστασις / ἐμπεσεῖν
  rationale: ἔκστασις의 강한 ‘자기 상실/몰입’ 효과를 살리되, 문맥상 유혹에 사로잡히는 상태로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 원문과 영어 POB 간의 주제 범위 차이
  chosen_reading: 본문에는 ‘술→성적 부도덕’ 부분이 아니라 ‘돈에 대한 탐욕→우상숭배’ 부분만 반영했습니다.
  alternative_readings:
  - 영어 POB의 종합 문장 전체를 그대로 따라 넓게 번역
  - 원문을 따라 주제만 더 압축해 번역
  rationale: 제공된 그리스어 본문이 φιλαργυρία와 εἰδωλολατρία를 직접 말하므로, 영어 POB의 기독교적 종합 문장은 참고하되 본문 증거를 우선했습니다.
  doctrine_reference: source-priority and audit-trail consistency
