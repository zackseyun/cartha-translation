  source_fidelity: 그리스어 본문은 돈을 사랑함이 우상숭배로 이끈다고 하고, 돈의 미혹 가운데 사람들이 존재하지 않는 것들을 신들이라 부르며, 그 탐욕을 지닌 사람을 ἔκστασις에 빠지게 한다고 말합니다. 초안은 이 큰 흐름을 따르지만, ‘돈의 미혹으로 부르게 하고’는 행위 주체와 인과관계가 다소 불분명하며, ‘그것을 가진 사람’의 선행사도 돈으로 읽힐 수 있습니다.
  naturalness: ‘내 자녀들아’와 ‘우상숭배로 이끕니다’는 현대 한국어의 권면 문맥에서 자연스럽고 합쇼체에도 맞습니다. 다만 ‘없는 신들’보다는 ‘존재하지 않는 것들’을 ‘신들이라 부르다’로 옮기는 편이 원문의 호칭 행위를 더 또렷하게 드러냅니다.
  terminology: φιλαργυρία는 ‘돈에 대한 탐욕’, εἰδωλολατρία는 ‘우상숭배’가 적절합니다. ἔκστασις는 이 문맥에서 긍정적으로 들릴 수 있는 ‘황홀경’보다 ‘정신 착란’으로 옮기는 편이 자기 상실과 비정상적 상태라는 부정적 효과를 정확히 전달합니다.
