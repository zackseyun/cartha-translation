revisions:
- from: 그런데 이 일들 뒤에, 다말이 과부로 지내던 중이었고 두 해가 지난 뒤에, 내가 들으니 그녀가 팀나에서 양털을 깎으러 올라가고 있었습니다. 나도 내 양털을 깎으러 올라갔습니다.[a]
  to: 그 뒤 다말이 과부로 지낸 지 두 해가 되었을 때, 내가 양을 깎으러 올라간다는 말을 다말이 들었습니다.
  rationale: 그리스어의 여성 단수 분사와 1인칭 동사 형태를 따라 사건의 주체를 바로잡았습니다. 제공된 원문에 없는 지명과 추가 문장을 삭제하고, 과부 상태와 두 해의 경과라는 시간 배경을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:03Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 핵심 문법 관계를 뒤바꾸었습니다. 여성 단수 분사 ἀκούσασα는 다말을 수식하므로, 다말이 들은 주체입니다. ὅτι 이하의 ἀνέρχομαι는 1인칭 단수로서 유다가 양을 깎으러 올라간다는 내용입니다. 또한 제시된 그리스어에는 팀나나 화자가 뒤이어 올라갔다는 별도 문장이 없습니다.
  naturalness: ‘다말이 과부로 지낸 지 두 해가 되었을 때’는 χηρευούσης 및 μετὰ ἔτη δύο의 시간적 배경을 자연스러운 현대 한국어로 보존합니다. ‘…다는 말을 다말이 들었습니다’는 ἀκούσασα ὅτι의 내용을 분명하게 전달합니다.
  terminology: Θαμάρ는 통상 표기인 ‘다말’로 유지했습니다. πρόβατα는 ‘양’이며, κείρω는 여기서 ‘양을 깎다’로 옮기는 것이 적절합니다. 본문에 없는 지명 ‘팀나’와 ‘양털’이라는 확장은 제거했습니다.
  issues:
  - severity: high
    issue: 청취 주체와 이동 주체가 뒤바뀜
    rationale: ἀκούσασα는 여성 단수로 다말을 가리키고, ἀνέρχομαι는 1인칭 단수로 화자 유다를 가리킵니다. 따라서 ‘내가 들으니 그녀가 … 올라갔다’는 원문과 반대입니다.
  - severity: high
    issue: 제시된 그리스어에 없는 내용 추가
    rationale: ‘팀나에서’ 및 ‘나도 내 양털을 깎으러 올라갔습니다’는 제공된 원문에 없습니다. 특히 후자는 영어 감사 기록에는 있으나 현 원어 본문 범위를 넘어섭니다.
  - severity: medium
    issue: ‘양털을 깎다’로의 대상 변경
    rationale: κείρω τὰ πρόβατα의 직접 목적어는 ‘양’입니다. 한국어에서 ‘양의 털을 깎다’도 가능하지만, 여기서는 원문의 대상을 보존하여 ‘양을 깎다’로 옮깁니다.
  revised_text: 그 뒤 다말이 과부로 지낸 지 두 해가 되었을 때, 내가 양을 깎으러 올라간다는 말을 다말이 들었습니다.
  revised_footnotes: []
