id: T12P.JUD.8.4
reference: Testament of Judah 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Μετὰ δὲ ταῦτα *χηρευούσης τῆς Θαμὰρ *μετὰ ἔτη δύο ἀκούσασα ὅτι ἀνέρχομαι τοῦ κεῖραι τὰ πρόβατα,'
  language: Greek
  note: 'Greek from Charles XII.1a (α): the Tamar narrative resumes. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/004.yaml
  text: And after these things, while Tamar was a widow, and after two years had passed, there was reported to me that she was going up to shear sheep at Timnah. And I also went to shear my sheep.
translation:
  language: ko
  text: 그 뒤 다말이 과부로 지낸 지 두 해가 되었을 때, 내가 양을 깎으러 올라간다는 말을 다말이 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  english_pob_choice: And after these things
  chosen_korean: 그런데 이 일들 뒤에
  alternatives_korean:
  - 그리고 이 일들 뒤에
  - 그 후에
  lexicon: μετά + accusative
  rationale: 시간 경과를 살리면서도 앞선 서술과의 연결을 자연스럽게 드러내기 위해 ‘그런데’와 ‘이 일들 뒤에’를 함께 썼습니다.
- source_word: χηρευούσης τῆς Θαμὰρ
  english_pob_choice: while Tamar was a widow
  chosen_korean: 다말이 과부로 지내던 중이었고
  alternatives_korean:
  - 다말이 과부였고
  - 다말이 과부로 있는 동안
  lexicon: χηρεύω
  rationale: 분사형이 상태를 배경으로 깔고 있어 단순 서술보다 지속적 상태를 나타내는 표현으로 옮겼습니다.
- source_word: ἀκούσασα ὅτι
  english_pob_choice: there was reported to me that
  chosen_korean: 내가 들으니
  alternatives_korean:
  - 내게 알려지니
  - 내가 듣게 되니
  lexicon: ἀκούω
  rationale: 원문은 ‘듣다’ 동사로 이어지는 청취·보고의 뉘앙스를 갖고 있으므로, 과도한 해석 없이 수동적 전달 상황을 살렸습니다.
- source_word: ἀνέρχομαι τοῦ κεῖραι τὰ πρόβατα
  english_pob_choice: she was going up to shear sheep
  chosen_korean: 그녀가 팀나에서 양털을 깎으러 올라가고 있었습니다
  alternatives_korean:
  - 그녀가 팀나로 양털을 깎으러 올라가고 있었습니다
  - 그녀가 양을 깎으러 올라가고 있었습니다
  lexicon: ἀναβαίνω + κείρω + πρόβατα
  rationale: ‘올라가다’와 ‘양털을 깎다’를 직역하되, 한국어에서 자연스럽게 ‘양털을 깎다’로 표현했습니다.
theological_decisions:
- issue: 서사 인물의 직접 화법 보존
  chosen_reading: 화자 1인칭을 유지해 ‘내가 들으니’와 ‘나도 … 올라갔습니다’로 옮겼습니다.
  alternative_readings:
  - 서술문으로 평탄화하여 ‘…라고 전해졌고 … 올라갔습니다’로 처리
  rationale: 본문은 화자의 개인적 회고를 통해 사건의 연속성을 드러내므로, 1인칭 시점을 보존하는 것이 의미상 중요합니다.
  doctrine_reference: 서사-화자 관점 보존
