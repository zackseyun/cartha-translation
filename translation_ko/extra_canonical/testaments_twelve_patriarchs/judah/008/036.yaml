base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: ko
  text: 왜냐하면 하나님께서는 나에게 왕권을 주시고 그에게 제사장직을 주셨으며, 왕권을 제사장직 아래에 두셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν βασιλείαν
  english_pob_choice: the kingship / the kingdom
  chosen_korean: 왕권
  alternatives_korean:
  - 왕국
  - 나라
  - 통치권
  lexicon: βασιλεία
  rationale: 문맥상 공간적 ‘나라’보다 통치 권한을 가리키는 왕권이 더 정확하고, 영어 POB의 kingship과도 잘 맞습니다.
- source_word: τὴν ἱερατείαν
  english_pob_choice: the priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장직
  - 제사직분
  lexicon: ἱερατεία
  rationale: 사람의 직분을 말하므로 ‘제사직’이 간결하고, 이어지는 ἱερωσύνη와의 구별도 비교적 잘 드러냅니다.
- source_word: τῇ ἱερωσύνῃ
  english_pob_choice: the priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장직
  - 제사직분
  lexicon: ἱερωσύνη
  rationale: 같은 직능 영역을 가리키지만, 본문은 왕권을 그 아래에 두는 대비를 만들므로 한국어에서도 동일한 기본어를 유지하되 문장 구조로 차이를 살렸습니다.
theological_decisions:
- issue: 왕권이 제사직 아래에 놓인다는 위계 표현
  chosen_reading: ‘왕권을 제사직 아래 두셨습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘왕권을 제사직에 복속시키셨습니다’
  - ‘왕권을 제사직보다 낮게 두셨습니다’
  rationale: 본문의 신학적 강조는 두 직분의 서열화에 있으므로 이를 완화하지 않고 드러내는 표현을 택했습니다.
  doctrine_reference: 성경적 직분 질서와 제의적/왕권적 권위의 구분
