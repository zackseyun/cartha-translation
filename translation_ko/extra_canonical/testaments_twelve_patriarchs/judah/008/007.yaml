  source_fidelity: 그리스어 δεύτε 문장 Τί μοι δώσεις;는 직역하면 “나에게 무엇을 주겠습니까?”이며, ‘내게 들어오려면’이라는 조건절은 원문에 없습니다. 영어 POB의 확장도 그리스어 본문 자체보다 넓지만, 한국어는 원문을 우선하여 조건절을 제거하는 것이 적절합니다. 첫 문장의 ἐκκλίνας πρὸς αὐτήν은 ‘그녀에게로 비켜서며’보다 ‘그 여자에게로 돌아서서’가 방향 전환과 접근의 뜻을 더 자연스럽게 전달합니다.
  naturalness: ‘그녀에게로 비켜서며’는 현대 한국어에서 어색하고, ‘내게 들어오려면’은 원문에 없는 조건을 보태면서 문장도 다소 설명적입니다. ‘그 여자에게로 돌아서서’와 ‘저에게 무엇을 주시겠습니까?’가 현대적 합쇼체 문체에 자연스럽습니다.
  terminology: εἰσέρχομαι πρὸς σε의 의도적인 성적 암시는 ‘당신에게 들어가겠습니다’로 보존할 수 있습니다. 이를 해설적인 표현으로 바꾸지 않았습니다. 서술 속 여성은 고유명으로 주어지지 않았으므로 ‘그 여자’로만 지칭했습니다.
