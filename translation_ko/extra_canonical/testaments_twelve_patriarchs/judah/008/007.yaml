  text: '*Καὶ ἐκκλίνας πρὸς αὐτὴν εἶπον· *Εἰσέρχομαι πρὸς σε. *Καὶ εἶπεν· Τί μοι δώσεις;'
  language: Greek
  note: Greek from Charles XII.4a (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/007.yaml
  text: And I turned aside to her and said, "Let me go in to you." And she said, "What will you give me, that you may come in to me?"
translation:
  language: ko
  text: 그리고 내가 그 여자에게로 돌아서서 말했습니다. “당신에게 들어가겠습니다.” 그러자 그 여자가 말했습니다. “저에게 무엇을 주시겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  english_pob_choice: And I turned aside to her
  chosen_korean: 내가 그녀에게로 비켜서며
  alternatives_korean:
  - 그녀에게로 돌아서며
  - 그녀 쪽으로 가며
  lexicon: ἐκκλίνω
  rationale: 방향을 ‘비켜서다/돌아서다’로 살리되, 이어지는 접근 동작과 자연스럽게 이어지도록 ‘-며’로 처리했습니다.
- source_word: εἰσέρχομαι πρὸς σε
  english_pob_choice: Let me go in to you.
  chosen_korean: 당신에게로 들어가겠습니다.
  alternatives_korean:
  - 당신에게로 들어가게 해 주십시오.
  - 당신에게로 들어가고 싶습니다.
  lexicon: εἰσέρχομαι + πρὸς
  rationale: 직접적 성관계 암시를 완곡하게 희석하지 않고, 원문의 진입 표현을 한국어로 직역에 가깝게 옮겼습니다.
- source_word: Τί μοι δώσεις;
  english_pob_choice: What will you give me, that you may come in to me?
  chosen_korean: 내게 들어오려면, 무엇을 주시겠습니까?
  alternatives_korean:
  - 무엇을 내게 주시겠습니까?
  - 무엇을 주겠습니까?
  lexicon: τί μοι δώσεις
  rationale: 원문의 교환 요구를 살리면서도 한국어에서는 이유절 구조로 자연스럽게 재구성했습니다.
theological_decisions:
- issue: 성적 접근을 시사하는 직설 표현의 보존
  chosen_reading: 원문의 ‘들어가다/들어오다’ 표현을 그대로 살려, 장면의 의도와 긴장을 완화하지 않았습니다.
  alternative_readings:
  - ‘함께하다’처럼 더 완곡하게 옮김
  - ‘관계를 맺다’로 해설적으로 옮김
  rationale: 본문은 의도적으로 노골적인 접근·거래의 뉘앙스를 가지므로, 해설적 순화보다 원문 장면의 힘을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적/서사적 정직성 원칙
- issue: 대화 상대 지칭의 인칭 대명사
  chosen_reading: 그녀/당신을 사용해 대화 상대를 분명히 했습니다.
  alternative_readings:
  - 그를/너를
  - 그 여자/네게
  rationale: 본문의 서술은 여성을 가리키는 맥락이 분명하므로, 현대 한국어에서 독자가 장면을 명확히 이해하도록 했습니다.
  doctrine_reference: 서사 문맥 명료화
