revisions:
- from: 그러나 나는 슬롬도 그에게 주고자 했지만, 그의 어머니가 허락하지 않았습니다. 그는 또한 자기 형제들처럼 죽을까 두려워했기 때문입니다. 나는 내가 팀나에서 내 아버지 야곱과 요셉에게 했던 일들 때문에 주님께서 나를 심판하고 계신 줄 알지 못했습니다.[a][b]
  to: 나는 또한 셀라를 그 여자에게 주려고 했지만, 그의 어머니가 허락하지 않았습니다. 그 어머니는 악하게 행동했습니다. 그 여자가 가나안의 딸들 가운데서 난 사람이 아니었으며, 그 어머니 또한 그러했기 때문입니다.[a]
  rationale: 그리스어 원문을 우선하여 본문에 없는 영어 감사 경로의 확장 내용을 제거했습니다. 결혼 맥락의 ‘주다’는 유지하되 αὐτῇ의 여성 대상을 반영했고, 악행의 주체를 직전의 어머니로 복원했습니다. 원문의 지시 관계가 불명확한 부분은 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
