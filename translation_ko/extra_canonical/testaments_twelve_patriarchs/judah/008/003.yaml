id: T12P.JUD.8.3
reference: Testament of Judah 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ οὐκ ἀφῆκεν. Ἐπονηρεύσατο γὰρ, ὅτι οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή.
  language: Greek
  note: 'Greek from Charles X.6 (α): Judah refuses to give Tamar to Shelah. Project ch.8 is a thematic consolidation; this verse re-flows narrative content from Charles ch.X.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: ko
  text: 그러나 나는 슬롬도 그에게 주고자 했지만, 그의 어머니가 허락하지 않았습니다. 그는 또한 자기 형제들처럼 죽을까 두려워했기 때문입니다. 나는 내가 팀나에서 내 아버지 야곱과 요셉에게 했던 일들 때문에 주님께서 나를 심판하고 계신 줄 알지 못했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σηλὼμ
  english_pob_choice: Shelah
  chosen_korean: 슬롬
  alternatives_korean:
  - 세라
  - 셀라
  - 실롬
  lexicon: 고유명사 음역
  rationale: 본문의 그리스어 형태 Σηλὼμ을 우선 반영해 한국어 음역을 잡되, 히브리어계 익숙한 교회 표기와 섞이지 않도록 했습니다.
- source_word: δοῦναι αὐτῇ
  english_pob_choice: I did not give Tamar to him as wife
  chosen_korean: 그에게 주고자 했지만
  alternatives_korean:
  - 그에게 아내로 주지 않았습니다
  - 그에게 주지 않았습니다
  lexicon: 주다
  rationale: 그리스어 원문은 ‘그녀에게/그에게 주다’의 단순 동사구이므로, 결혼 대상 제공이라는 의미를 과도하게 보강하지 않고 문맥상 자연스럽게 옮겼습니다.
- source_word: μήτηρ
  english_pob_choice: mother
  chosen_korean: 어머니
  alternatives_korean:
  - 모친
  - 그의 어머니
  lexicon: 친족어
  rationale: 직접적인 친족 관계를 평이하고 현대적인 표준어로 살렸습니다.
- source_word: οὐκ ἀφῆκεν
  english_pob_choice: did not let/allow
  chosen_korean: 허락하지 않았습니다
  alternatives_korean:
  - 내버려 두지 않았습니다
  - 허용하지 않았습니다
  lexicon: 허락하다
  rationale: 금지·저지를 뜻하는 부정 동사를 한국어에서 가장 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: Ἐπονηρεύσατο
  english_pob_choice: was acting wickedly / sinned
  chosen_korean: 심판하고 계신 줄
  alternatives_korean:
  - 악을 행하고 있는 줄
  - 벌하고 계신 줄
  lexicon: 심판하다
  rationale: 영문 POB의 ‘the Lord was judging me’와 대응시키되, 원문의 도덕적/사법적 판단 뉘앙스를 ‘심판하다’로 살렸습니다.
theological_decisions:
- issue: 원문의 1인칭 회고와 영어 POB의 보강된 설명 사이의 긴장
  chosen_reading: 한국어 본문은 그리스어 원문의 핵심 서술을 따라가되, 영어 POB가 제공한 이유 설명(주님의 심판, 팀나에서의 행위, 야곱과 요셉)을 문맥상 필요한 범위에서 반영했습니다.
  alternative_readings:
  - 원문처럼 단순히 ‘그가 악을 행했다’로만 옮김
  - 영어 POB를 따라 완전한 회고문으로 재구성함
  rationale: 이 절은 그리스어 본문이 간략하고 영어 POB는 그 의미를 풀어 설명하므로, 두 층위를 모두 해치지 않도록 서술을 간결하게 유지했습니다.
  doctrine_reference: 본문비평/번역 신중성
- issue: 주님의 판단을 나타내는 표현
  chosen_reading: ‘주님께서 나를 심판하고 계신 줄’로 현재 진행형 인식을 살렸습니다.
  alternative_readings:
  - ‘주님께서 나를 벌하고 계신 줄’
  - ‘주님께서 나를 책망하고 계신 줄’
  rationale: judging은 단순 감정이 아니라 신적 판결의 진행을 가리키므로, 도덕적 비난보다 사법적 의미가 드러나는 표현을 택했습니다.
  doctrine_reference: 신적 심판
