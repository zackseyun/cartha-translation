  text: And while I was there, Barshaba, the king of Adullam, entertained us and made a drinking feast for us; and when he urged me, he gave me his daughter, whose name was Shua, as a wife.
translation:
  language: ko
  text: 내가 거기 있을 때에 바르사바, 곧 아둘람의 왕이 우리를 대접하고 우리를 위하여 잔치를 베풀었습니다. 그리고 그가 나를 권하자, 자기 딸 곧 사밧라 이름의 그 딸을 아내로 내주었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸς ὃν ἐλθὼν ἤμην
  english_pob_choice: And while I was there
  chosen_korean: 내가 거기 있을 때에
  alternatives_korean:
  - 내가 그곳에 갔을 때
  - 내가 그에게 갔을 때
  lexicon: source syntax
  rationale: ἤμην은 지속 상태를 나타내므로 단순한 도착보다 ‘거기 있을 때에’로 옮겨 문맥의 체류감을 살렸습니다.
- source_word: Βαρσαβὰ τὸν βασιλεὺς Ὀδολλὰμ
  english_pob_choice: Barshaba, the king of Adullam
  chosen_korean: 바르사바, 곧 아둘람의 왕
  alternatives_korean:
  - 아둘람의 왕 바르사바
  - 바르사바 아둘람 왕
  lexicon: proper noun / apposition
  rationale: 그리스어의 동격 구조를 반영해 이름과 칭호를 분리했고, βασιλεὺς는 문맥상 ‘왕’으로 직역했습니다.
- source_word: ἐποίησεν ἡμῖν πότον
  english_pob_choice: made a drinking feast for us
  chosen_korean: 우리를 위하여 잔치를 베풀었습니다
  alternatives_korean:
  - 우리에게 술잔치를 베풀었습니다
  - 우리에게 마시는 잔치를 마련했습니다
  lexicon: πότος
  rationale: πότον은 단순한 ‘마심’이 아니라 음주를 수반한 연회를 가리키므로, 의미를 살려 ‘잔치’를 택하되 음주 뉘앙스는 앞문맥과 번역 전통을 통해 유지했습니다.
- source_word: παρακαλέσας δέδωκέ μοι τὴν θυγατέρα αὐτοῦ ... εἰς γυναῖκα
  english_pob_choice: when he urged me, he gave me his daughter ... as a wife
  chosen_korean: 그가 나를 권하자, 자기 딸 ...를 아내로 내주었습니다
  alternatives_korean:
  - 그가 나를 청하자, 자기 딸 ...를 주었습니다
  - 그가 나를 간청하자, 자기 딸 ...를 아내로 주었습니다
  lexicon: παρακαλέω / δέδωκεν εἰς γυναῖκα
  rationale: παρακαλέσας는 강하게 요청하거나 권유하는 뜻이므로 ‘권하자’로 옮겼고, εἰς γυναῖκα는 관용적으로 ‘아내로’라 하되 ‘내주었습니다’로 서술해 선행 요구와 결혼 제공의 관계를 드러냈습니다.
theological_decisions:
- issue: 서술체의 혼인 제공 표현
  chosen_reading: ‘자기 딸을 아내로 내주었습니다’는 고대 서사의 가족·혼인 관습을 그대로 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘결혼시켜 주었습니다’
  - ‘아내로 삼게 했습니다’
  rationale: 원문은 결혼 주선이나 혼인 증여를 직접적으로 말하므로, 현대적으로 완곡화하기보다 행위의 직접성을 보존하는 편이 स्रोत-충실합니다.
  doctrine_reference: Source narrative transparency
