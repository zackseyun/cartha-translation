  source_fidelity: 그리스어 καὶ δέδωκα αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου εἰς ἀρραβῶνα를 충실히 반영합니다. ῥάβδος와 διάδημα의 두 물건, 수여 대상(그 여인), 그리고 εἰς ἀρραβῶνα의 담보/질적 기능이 모두 보존되었습니다. 영어 감사본의 대화·허리띠 언급은 제시된 이 그리스어 α절에는 없으므로, 원문 우선 원칙상 한국어 본문에 보충하지 않는 것이 타당합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘담보로 주었습니다’는 문맥상 보증물로 맡긴 행위를 명료하게 전달하며, ‘관’은 διάδημα에 대응하는 간결하고 격조 있는 표현입니다.
  terminology: ‘지팡이’는 ῥάβδος에, ‘관’은 διάδημα에, ‘담보’는 ἀρραβών의 거래적 보증물 의미에 적절히 대응합니다. 특정 교리적 해석을 더하지 않습니다.
