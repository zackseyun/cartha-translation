  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ δέδωκα αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου *εἰς ἀρραβῶνα.
  language: Greek
  note: 'Greek from Charles XII.4b (α): the pledge handover. Project''s English distributes this single α-clause across project vv 9-10. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: ko
  text: 그리고 나는 내 지팡이와 내 관을 그 여인에게 담보로 주었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκα αὐτῇ ... εἰς ἀρραβῶνα
  english_pob_choice: What pledge shall I give you? ... as a pledge
  chosen_korean: 담보로 주었습니다
  alternatives_korean:
  - 보증으로 주었습니다
  - 약정금으로 주었습니다
  - 전당으로 주었습니다
  lexicon: ἀρραβών
  rationale: 본문의 ἀρραβών은 단순한 일반 ‘선물’이 아니라 반환을 담보하는 ‘질/보증’의 의미이므로, 현대 한국어에서 그 기능을 가장 분명하게 드러내는 ‘담보’로 옮겼습니다.
- source_word: ῥάβδος
  english_pob_choice: staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 몽둥이
  lexicon: ῥάβδος
  rationale: 이 문맥에서 ῥάβδος는 권위의 표지로서의 막대이므로, 자연스럽고 널리 이해되는 ‘지팡이’가 적절합니다.
- source_word: διάδημα
  english_pob_choice: diadem of your kingdom
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 머리띠
  - 왕관 장식
  lexicon: διάδημα
  rationale: διάδημα는 왕권을 나타내는 머리 장식이지만, 한국어에서는 본문이 요구하는 상징성을 유지하면서도 간결한 ‘관’이 가장 적절합니다.
theological_decisions:
- issue: The verse presents the objects as a pledge rather than a completed transfer.
  chosen_reading: ‘담보로 주었습니다’로 옮겨, 대상 물건이 약속의 보증물임을 분명히 했습니다.
  alternative_readings:
  - ‘질로 주었습니다’
  - ‘보증으로 주었습니다’
  rationale: Greek εἰς ἀρραβῶνα는 거래적·서약적 담보의 뉘앙스를 가지므로, 단순한 소유 이전처럼 읽히지 않도록 했습니다.
  doctrine_reference: 서약/담보의 언약적 용법
