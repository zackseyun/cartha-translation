id: T12P.JUD.8.24
reference: Testament of Judah 8:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα γὰρ τὴν ῥάβδον μου, τουτέστι τὸ στήριγμα τῆς ἐμῆς φυλῆς, καὶ τὴν ζώνην μου, τουτέστιν τὴν δύναμιν, καὶ τὸ διάδημα, τουτέστιν τὴν δόξαν τῆς βασιλείας μου.
  language: Greek
  note: Greek from Charles XV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: ko
  text: 내가 내 지팡이 곧 내 지파의 버팀목과, 내 띠 곧 내 힘과, 내 관 diadem 곧 내 왕국의 영광을 주었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  english_pob_choice: staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 막대
  - 지팡이
  lexicon: ῥάβδος
  rationale: 군주적 상징물로서의 물건을 자연스럽게 옮기되, 뒤의 설명절과 함께 ‘지파의 버팀목’이라는 기능을 살리기 위해 ‘지팡이’를 택했습니다.
- source_word: στήριγμα
  english_pob_choice: the stay
  chosen_korean: 버팀목
  alternatives_korean:
  - 지주
  - 지탱하는 것
  - 받침
  lexicon: στήριγμα
  rationale: 직역보다 의미를 살려, 지팡이가 지파를 떠받치는 상징이라는 설명을 한국어에서 바로 이해되게 했습니다.
- source_word: ζώνην
  english_pob_choice: girdle
  chosen_korean: 띠
  alternatives_korean:
  - 허리띠
  - 띠
  lexicon: ζώνη
  rationale: 권위와 힘을 상징하는 허리띠의 의미를 간결하게 살려 표준적인 ‘띠’로 옮겼습니다.
- source_word: διάδημα
  english_pob_choice: diadem
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - diadem
  - 면류관
  lexicon: διάδημα
  rationale: 헬라어가 가리키는 왕권의 표지로서 문맥상 ‘관’이 가장 무난하나, 용어의 특수성을 보이기 위해 원어 음차를 병기했습니다.
theological_decisions:
- issue: 권력과 영광의 상징물 나열을 어떻게 드러낼지
  chosen_reading: 지팡이·띠·관을 모두 상징적 소유물로 유지해, 지파의 버팀목·힘·왕국의 영광이라는 해설절의 구조를 그대로 보이게 했습니다.
  alternative_readings:
  - 상징을 풀어 ‘지파를 떠받치는 힘’처럼 통합하기
  - 왕권 이미지를 완화해 단순 소유물처럼 번역하기
  rationale: 본문은 세 물건을 각각 그 의미와 함께 병기하므로, 상징성과 설명을 모두 보존해야 저자의 자기 진술이 선명해집니다.
  doctrine_reference: 상징적 왕권/지파 지도력의 자기진술
