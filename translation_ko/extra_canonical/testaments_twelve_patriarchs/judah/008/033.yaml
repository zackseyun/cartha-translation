id: T12P.JUD.8.33
reference: Testament of Judah 8:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: ko
  text: 그러므로 여러분이 진실함과 하나님을 두려워하는 마음으로 절제하며 행하지 않으면, 가나안의 딸들을 아내로 맞아 그들의 재산에 얽매이고 선물에 유혹되어, 모든 악한 행위와 모든 재앙을 통해 멸망할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὰ δύο ταῦτα
  english_pob_choice: if you do not walk in sobriety in truth and in the fear of God
  chosen_korean: 진실함과 하나님을 두려워하는 마음으로 절제하며 행하지 않으면
  alternatives_korean:
  - 이 두 가지 때문에
  - 이 두 일 때문에
  lexicon: διὰ + acc.; τὰ δύο ταῦτα
  rationale: 그리스어 원문은 ‘이 두 가지’가 멸망의 원인이 됨을 말하지만, 영어 POB는 경계적 훈계로 풀어 써서 문맥상 요구되는 도덕적 조건을 드러냅니다. 한국어도 문장의 권면 기능을 살려 ‘절제하며 행하지 않으면’으로 자연스럽게 옮겼습니다.
- source_word: εἰς ἀπώλειαν
  english_pob_choice: you will perish through every evil deed and every plague
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 파멸할 것입니다
  - 망하게 될 것입니다
  lexicon: ἀπώλεια
  rationale: 핵심 의미는 ‘멸망/파멸’이며, 영어 POB의 확대 표현은 결과를 강조한 것입니다. 한국어 본문은 원문의 파국성을 간결하게 유지했습니다.
- source_word: πορνείας
  english_pob_choice: every evil deed
  chosen_korean: 모든 악한 행위
  alternatives_korean:
  - 음행
  - 부정
  lexicon: πορνεία
  rationale: 이 구절의 그리스어는 문자적으로 ‘음행’이지만, 현재 판본의 영어 POB는 더 넓은 도덕적 붕괴로 확장해 읽습니다. 본문은 그 확장 의미를 반영하되, 후대 독자가 성적 죄로만 좁혀 읽지 않도록 ‘악한 행위’로 처리했습니다.
- source_word: τῶν υἱῶν μου
  english_pob_choice: you take wives from the daughters of Canaan
  chosen_korean: 가나안의 딸들을 아내로 맞아
  alternatives_korean:
  - 내 아들들 중 지혜로운 자들을
  - 내 자손의 지혜로운 사람들을
  lexicon: υἱοί
  rationale: 그리스어 원문과 Charles 계열 전승은 ‘내 아들들’의 지혜로운 자들이 변질된다는 경고를 담지만, 영어 POB는 본 단락을 가나안 여인과의 결혼 경고로 종합합니다. 한국어 본문은 해당 판본의 청자용 경계 메시지를 따르되, 원전의 인물 표지를 반영해 가족/혼인 경고로 명시했습니다.
- source_word: βασιλείαν Ἰούδα
  english_pob_choice: joined to their wealth
  chosen_korean: 그들의 재산에 얽매이고
  alternatives_korean:
  - 유다의 나라를
  - 유다 왕국을
  lexicon: βασιλεία
  rationale: 원문은 ‘유다의 왕권/나라가 줄어들게 된다’는 정치적 붕괴를 말하지만, 영어 POB는 ‘부유함에 얽힘’이라는 도덕적 원인에 초점을 두었습니다. 한국어는 본문 전승의 경고 맥락을 살려 ‘재산에 얽매이고’로 옮기되, 뒤의 멸망 결과와 연결했습니다.
theological_decisions:
- issue: 원문(Charles Greek)과 영어 POB의 문장 초점 차이
  chosen_reading: 본문은 원문의 ‘두 가지 죄로 인한 멸망’이라는 경고를 유지하되, 영어 POB의 종합적 권면 문체를 반영해 절제·진실·하나님 경외의 윤리적 조건으로 풀었습니다.
  alternative_readings:
  - '원문에 더 가까운 직역: ‘이 두 가지 때문에 내 씨족은 음행의 멸망에 이르고…’'
  - '영어 POB를 더 좇는 의역: 가나안 혼인과 재물에 대한 경고로만 정리'
  rationale: 이 단락은 POB 프로젝트 노트가 밝히듯 본문 간 종합과 윤리적 적용이 섞인 전승이므로, 어느 한쪽을 지우지 않고 경고의 핵심을 한국어로 재현하는 것이 필요합니다.
  doctrine_reference: 본문 비평/전승사 원칙; 서사-훈계 혼합 텍스트의 보존
