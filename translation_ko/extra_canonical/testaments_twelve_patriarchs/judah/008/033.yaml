  source_fidelity: 현 초안은 영어 POB의 주제적 의역을 따라가지만, 제시된 그리스어 본문에는 없는 ‘진실함’, ‘하나님을 두려워하는 마음’, ‘절제’, ‘가나안의 딸들’, ‘재산’, ‘선물’, ‘모든 재앙’을 삽입하고, 본문의 핵심인 ‘이 두 가지’, 후손/아들들 가운데 지혜로운 이들의 변질, 유다의 왕권 축소를 누락합니다. 원문 우선 원칙상 본문을 그리스어의 경고 진술로 복원해야 합니다.
  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 원문의 미래 예언적 진술을 ‘알고 있습니다/될 것이며/하게 될 것입니다’로 보존합니다. 원문의 행위 주체가 명시되지 않은 부분은 수동 표현으로 처리하여 불필요하게 확정하지 않았습니다.
  terminology: γένος는 ‘후손’, πορνεία는 이 문맥에서 ‘음행’, βασιλεία Ἰούδα는 정치적 의미를 유지하여 ‘유다의 왕권’으로 옮겼습니다. ‘주’는 원문의 Κύριος를 따르며, ‘내 아버지께 순종함으로’는 ἐν ὑπακοῇ πατρός μου를 자연스럽게 반영합니다.
  issues:
  - severity: high
    issue: 원문에 없는 가나안 혼인·재산·선물·절제의 권면이 본문에 들어가 있음
    rationale: 영어 POB 감사본은 여러 장의 경고를 종합한 의역이라고 출처 주석도 밝히지만, 해당 그리스어 절의 번역으로는 원문에 없는 내용을 대폭 추가합니다.
  - severity: high
    issue: 원문의 주요 진술이 누락됨
    rationale: ‘이 두 가지 때문에’, ‘내 아들들 가운데 지혜로운 사람들’, ‘유다의 왕권’, 그리고 그것들이 타락·축소될 것이라는 예언이 현 초안에 반영되지 않았습니다.
  - severity: medium
    issue: 연결되지 않은 각주 표지 [a]
    rationale: 제공된 각주 세트에 [a] 항목이 없으므로 표지를 삭제해야 합니다.
  revised_text: 나는 이 두 가지 때문에 내 후손이 음행으로 말미암아 멸망에 이르게 되고, 내 아들들 가운데 지혜로운 사람들마저 타락하게 되며, 주께서 내가 내 아버지께 순종함으로 내게 주신 유다의 왕권을 줄어들게 하게 될 것을 알고 있습니다.
  revised_footnotes: []
  revision_rationale: 그리스어 본문을 우선하여 두 악의 결과로 예고되는 후손의 멸망, 지혜로운 아들들의 변질, 유다 왕권의 축소를 모두 보존했습니다. πορνείας의 결합 관계는 다소 압축적이므로 ‘음행으로 말미암아 멸망에 이르게 되고’로 자연스럽게 옮겼습니다. ἀλλοιώσουσι와 ποιήσουσι의 명시되지 않은 행위자는 수동·사역적 표현으로 남겨 원문의 모호성을 보존했습니다. 영어 POB의 주제적 확장은 원전 절의 한국어 본문에 도입하지 않았습니다.
