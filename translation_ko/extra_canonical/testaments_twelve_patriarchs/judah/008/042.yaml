id: T12P.JUD.8.42
reference: Testament of Judah 8:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: ko
  text: 그리고 나는 [너희가] 마지막 날들에 행할 모든 악을 이미 알고 있습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνωκα
  english_pob_choice: I have read / I have come to know
  chosen_korean: 이미 알고 있습니다
  alternatives_korean:
  - 알고 있습니다
  - 알게 되었습니다
  lexicon: γνωρίζω/οἶδα
  rationale: 완료 시상으로 말하는 ‘이미 알고 있음’을 살리되, 한국어에서는 자연스러운 현재완료적 표현으로 풀어 주었습니다.
- source_word: ὅσα κακὰ
  english_pob_choice: every wickedness / every evil
  chosen_korean: 모든 악
  alternatives_korean:
  - 온갖 악
  - 각종 악행
  lexicon: κακός
  rationale: 단순한 도덕적 ‘악’의 총체를 가리키므로, 행위 중심의 ‘악행’보다 원문 범위를 넓게 유지한 ‘모든 악’이 적절합니다.
- source_word: ποιήσετε
  english_pob_choice: will commit
  chosen_korean: 행할
  alternatives_korean:
  - 저지를
  - 하실
  lexicon: ποιέω
  rationale: 미래형 동사를 한국어에서 자연스럽게 관계절로 옮겨, 장차 벌어질 행동의 범주를 드러냈습니다.
- source_word: '[ταῖς ἐσχάταις ἡμέραις]'
  english_pob_choice: the last days
  chosen_korean: 마지막 날들
  alternatives_korean:
  - 말세에
  - 종말의 날들에
  lexicon: ἔσχατος
  rationale: 괄호로 표시된 보간을 보존하면서도, 문맥상 종말론적 시간표현을 직역에 가깝게 반영했습니다.
theological_decisions:
- issue: 본문의 α-text는 단순히 ‘알고 있다’고 말하고, 영어 POB는 β-recension의 에녹서 언급을 따릅니다.
  chosen_reading: α-text의 현재 구문을 본문으로 두고, 에녹서 언급은 본문에 끼워 넣지 않았습니다.
  alternative_readings:
  - 에녹서의 책들에서 읽었다는 문구를 본문에 반영
  - 두 전승을 합쳐 서술
  rationale: 주어진 소스 본문이 α-text이며, 편집자 주석은 β독법을 별도로 설명하므로, 본문에는 α의 간결한 진술만 두는 것이 소스-기반입니다.
  doctrine_reference: 텍스트 비평/전승 구분
- issue: 이 절의 경고는 ‘마지막 날들’의 악행을 예고하는 예언적 진술입니다.
  chosen_reading: 예언적 경고의 어조를 유지해 직설적인 미래 진술로 옮겼습니다.
  alternative_readings:
  - 완곡하게 미래 가능성으로 처리
  - 도덕적 권면으로 약화
  rationale: 원문 미래형 ποιήσετε와 문맥의 경고성을 살려, 설교적 완화 없이 그대로 전달했습니다.
  doctrine_reference: 예언/경고의 직설성
