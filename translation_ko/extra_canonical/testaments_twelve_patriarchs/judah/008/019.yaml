id: T12P.JUD.8.19
reference: Testament of Judah 8:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: ko
  text: 이와 같은 사람이 술에 취한 자입니다, 내 자녀들. 술 취한 사람은 누구에게도 경외심을 보이지 않기 때문입니다. 보십시오, 그것이 나까지도 하나님의 계명을 어기게 하였고, 내가 다말에게 들어갔으며, 성 안의 많은 사람 앞에서 부끄러워하지 않았고, 모든 사람의 눈앞에서 내 아들들의 수치를 드러냈습니다. 이는 내가 다말에게 들어갔기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πάροινος / ὁ μεθύων
  english_pob_choice: the drunkard / the one who is drunk
  chosen_korean: 술 취한 자 / 술 취한 사람
  alternatives_korean:
  - 주정뱅이
  - 술주정꾼
  - 술에 취한 자
  lexicon: πάροινος; μεθύω
  rationale: POB의 ‘drunkard’와 ‘the one who is drunk’의 대조를 살려, 단순 상태와 인물 유형을 함께 드러내는 표현으로 옮겼습니다.
- source_word: αἰδεῖται
  english_pob_choice: reverence
  chosen_korean: 경외심을 보이지 않기
  alternatives_korean:
  - 존경하지 않기
  - 부끄러워하지 않기
  - 예를 갖추지 않기
  lexicon: αἰδέομαι
  rationale: 문맥상 단순한 예절보다 사람 앞에서 두려움·존중을 잃는 태도를 가리키므로, ‘경외심’을 유지하되 행위로 풀어 자연스럽게 표현했습니다.
- source_word: τὸ πλῆθος πόλεως
  english_pob_choice: the multitude in the city
  chosen_korean: 성 안의 많은 사람
  alternatives_korean:
  - 도성의 무리
  - 도시의 군중
  - 성읍의 무리
  lexicon: πλῆθος; πόλις
  rationale: 그리스어의 ‘도시 안의 많은 무리’를 한국어로 과도하게 문어화하지 않고, 본문이 말하는 공개성에 초점을 맞춰 옮겼습니다.
- source_word: τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  english_pob_choice: the shame of my sons
  chosen_korean: 내 아들들의 수치
  alternatives_korean:
  - 내 아들들의 부정함의 덮개
  - 내 아들들의 부끄러움
  - 내 아들들의 부정의 가리개
  lexicon: κάλυμμα; ἀκαθαρσία; υἱοί
  rationale: 직역하면 ‘불결함의 덮개’가 되지만, POB의 해석처럼 결과적 수치/치욕의 노출을 한국어로 직접 드러내는 것이 문맥에 더 충실합니다.
theological_decisions:
- issue: “하나님의 계명”의 해석
  chosen_reading: 원문의 ‘하나님의 계명’을 그대로 살려, 유다가 다말 사건을 신적 명령 위반으로 인식하는 윤리적 진술로 옮겼습니다.
  alternative_readings:
  - 율법
  - 명령
  rationale: 영어 POB가 이미 God’s commandment로 확정하고 있으므로, 한국어에서도 하나님의 직접적 권위를 유지하는 것이 본문 의도에 맞습니다.
  doctrine_reference: 서사 윤리와 죄책 고백
