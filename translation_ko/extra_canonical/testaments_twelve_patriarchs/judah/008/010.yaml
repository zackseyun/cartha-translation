  source_fidelity: 핵심 동사 συνήλθον αὐτῇ는 문맥상 성적 결합을 뜻하므로 ‘그와 함께하자’는 성별 지시가 어긋나며 의미도 지나치게 흐립니다. συνελήφθη는 임신/잉태를 가리키며, 영어 감사본의 ‘by me’를 반영해 부친 관계를 명시하는 것이 적절합니다. 뒤 절들은 제공된 영어 POB 감사본의 범위 안에서 충실히 반영할 수 있습니다.
  naturalness: ‘그와 함께하자’는 여성 선행사와 맞지 않는 데다 자연스럽지 않습니다. ‘그녀와 동침하였고’는 현대 한국어에서 간결하면서도 문맥의 사실을 정확히 전달합니다. 나머지 문장은 합쇼체 서술 문체에 맞습니다.
  terminology: ‘동침하다’는 성적 결합을 과장하거나 해설하지 않고 나타내며, ‘잉태하다’는 서사·종교 문헌의 문체에 잘 맞습니다. ‘알아보지 못하다’는 ἀναγνωρίζω의 식별 의미에 적절합니다.
