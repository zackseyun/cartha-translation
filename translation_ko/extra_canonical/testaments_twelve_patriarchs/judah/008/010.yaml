  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/010.yaml
  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: ko
  text: 그리고 나는 그녀와 동침하였고, 그녀는 나의 아이를 잉태하였습니다. 그러나 포도주 때문에 나는 내가 한 일을 알지 못하였으며, 떠날 때에도 그녀를 알아보지 못하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  english_pob_choice: went in to her
  chosen_korean: 그와 함께하자
  alternatives_korean:
  - 그녀에게 들어가자
  - 그녀와 동침하자
  lexicon: συνέρχομαι
  rationale: 직접적인 성적 결합을 가리키는 문맥이지만, 원문이 비교적 간결하므로 과도한 해설 없이 관계의 결합을 드러내는 표현을 택했습니다.
- source_word: συνελήφθη
  english_pob_choice: she conceived by me
  chosen_korean: 그녀가 임신하였습니다
  alternatives_korean:
  - 그녀가 내게서 잉태하였습니다
  - 그녀가 내 아이를 잉태하였습니다
  lexicon: συλλαμβάνω
  rationale: 문맥상 ‘임신하다/잉태하다’의 결과를 말하므로, 한국어에서는 가장 자연스럽고 직접적인 ‘임신하였습니다’로 옮겼습니다.
- source_word: Ἀγνοῶν δὲ ἐγὼ ὃ ἐποίησα
  english_pob_choice: because of the wine I did not perceive what I had done
  chosen_korean: 포도주 때문에 나는 내가 한 일을 깨닫지 못하였고
  alternatives_korean:
  - 술 때문에 내가 한 일을 알지 못하였고
  - 포도주로 인해 내가 무엇을 했는지 몰랐고
  lexicon: ἀγνοέω
  rationale: 원문은 ‘알지 못하다/깨닫지 못하다’의 인지 부재를 말하므로, 행위에 대한 자각 상실을 살리는 ‘깨닫지 못하였습니다’를 택했습니다.
- source_word: ἐποίησα / ἀνεγνώρισα
  english_pob_choice: neither did I recognize her when I went away
  chosen_korean: 떠날 때에도 그녀를 알아보지 못하였습니다
  alternatives_korean:
  - 떠날 때에도 그녀를 분간하지 못하였습니다
  - 떠난 뒤에도 그녀를 알아채지 못하였습니다
  lexicon: ἀναγνωρίζω
  rationale: 두 번째 절은 상대를 식별하지 못했다는 뜻이므로, 한국어의 일반적 인지 동사인 ‘알아보지 못하다’로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 원문이 서술하는 성적 결합과 임신 결과를 한국어로 얼마나 직접적으로 드러낼지
  chosen_reading: 원문의 사실 진술을 완화하지 않고, 결합과 임신을 모두 분명히 제시했습니다.
  alternative_readings:
  - 완곡하게만 표현하여 성적 의미를 흐리게 함
  - 임신 언급을 생략함
  rationale: 이 구절은 서사의 핵심 사실을 기록하므로, 도덕적 평가를 덧붙이지 않으면서도 의미를 숨기지 않는 번역이 필요합니다.
  doctrine_reference: 서사 본문의 사실성 보존
