revisions:
- from: 그리고 하나님의 천사가 나에게 보여 주었습니다. 여자들이 왕과 거지 위에 군림하며, 왕에게서는 그의 영광을, 강한 남자에게서는 그의 힘을 빼앗고, 거지에게서는 그의 가난의 가장 작은 버팀목마저도 빼앗는다는 것을 말입니다.
  to: 그리고 하나님의 천사가 나에게, 여자들이 왕과 가난한 사람을 지배하고 왕에게서는 그의 영광을, 남자에게서는 그의 힘을, 가난한 사람에게서는 그의 가난을 지탱하는 가장 작은 버팀목마저 빼앗는다고 보여 주셨습니다.
  rationale: 원문의 불편하고 일반화된 경고적 진술은 완화하지 않았습니다. 다만 그리스어에 없는 ‘강한’을 제거하고, 왕·남자·가난한 사람에 관한 세 병렬 목적어를 드러냈습니다. 마지막 구절은 문법적으로 다소 거친 전승의 표현이지만, ‘가난을 지탱하는 가장 작은 버팀목’으로 최소한의 생계 기반이라는 뜻을 보존했습니다.
