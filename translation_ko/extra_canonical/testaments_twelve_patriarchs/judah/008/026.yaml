id: T12P.JUD.8.26
reference: Testament of Judah 8:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: ko
  text: 그리고 하나님의 천사가 나에게 보여 주었습니다. 여자들이 왕과 거지 위에 군림하며, 왕에게서는 그의 영광을, 강한 남자에게서는 그의 힘을 빼앗고, 거지에게서는 그의 가난의 가장 작은 버팀목마저도 빼앗는다는 것을 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριεύουσιν
  english_pob_choice: rule forever over
  chosen_korean: 군림하며
  alternatives_korean:
  - 다스리며
  - 지배하며
  - 주권을 행사하며
  lexicon: κατακυριεύω
  rationale: 단순한 ‘다스리다’보다 위에서 누르는 통치·지배의 뉘앙스가 있어, 영어 POB의 ‘rule over’보다 한층 강한 표현인 ‘군림하다’가 문맥을 잘 드러냅니다.
- source_word: τὴν δόξαν
  english_pob_choice: his glory
  chosen_korean: 그의 영광을
  alternatives_korean:
  - 그의 명예를
  - 그의 존귀를
  lexicon: δόξα
  rationale: 왕에게서 빼앗기는 것이 외적 체면이 아니라 ‘영광’이라는 명예·위엄의 영역이므로, 직설적인 ‘영광’을 유지했습니다.
- source_word: τὴν δύναμιν
  english_pob_choice: his strength
  chosen_korean: 그의 힘을
  alternatives_korean:
  - 그의 능력을
  - 그의 역량을
  lexicon: δύναμις
  rationale: 문맥상 육체적·사회적 힘을 함께 가리키므로, 자연스럽고 넓은 의미의 ‘힘’이 가장 직접적입니다.
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  english_pob_choice: the little support of his poverty
  chosen_korean: 그의 가난의 가장 작은 버팀목마저도
  alternatives_korean:
  - 그 가난을 지탱하는 작은 버팀목마저도
  - 가난 속의 아주 작은 의지처마저도
  lexicon: στήριγμα
  rationale: ‘στήριγμα’는 지지대·버팀목을 뜻하므로, 가난한 사람에게 남아 있는 최소한의 생계 기반이라는 뜻을 살려 ‘버팀목’으로 옮겼습니다.
theological_decisions:
- issue: 여성의 지배를 묘사하는 직설성
  chosen_reading: 본문의 비유적·경고적 진술을 완화하지 않고 ‘여자들이 … 군림하며’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 여자들이 … 영향력을 행사하며
  - 여자들이 … 주도하며
  rationale: 이 구절은 여성 일반에 대한 교훈적 평가를 넘어서, 본문이 의도한 과장된 경고를 그대로 전달하는 것이 중요합니다.
  doctrine_reference: source-faithfulness
