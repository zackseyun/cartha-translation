  to: 내가 담보물들을 받으려고 사람을 보냈으나, 그 여자를 찾지 못하였습니다.
  rationale: 직접 그리스어 본문을 우선하여 ἀρραβῶνας의 복수 ‘담보물들’과 ἔπεμψα τοῦ λαβεῖν의 목적 관계를 회복했습니다. 영어 POB에 있는 염소 새끼 및 지역 사람들에게 묻는 장면은 제시된 α-대체 그리스어 절에 없으므로 본문에 보충하지 않았습니다.
