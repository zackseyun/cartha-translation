  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: ko
  text: 내가 그 염소 새끼를 가져오게 하였습니다. 그러나 그녀를 찾지 못하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας
  english_pob_choice: And after this I sent the kid
  chosen_korean: 내가 그 염소 새끼를 가져오게 하였습니다
  alternatives_korean:
  - 내가 그 염소 새끼를 보냈습니다
  - 내가 그 염소 새끼를 보냈고 받게 하였습니다
  lexicon: ἔπεμψα / λαβεῖν / ἀρραβῶνας
  rationale: 원문의 핵심은 ‘보내다’와 ‘받다/가져오다’의 결합인데, 한국어에서는 직역보다 ‘가져오게 하다’가 문맥상 의도한 전달 행위를 가장 자연스럽게 드러냅니다.
- source_word: ἀρραβῶνας
  english_pob_choice: the kid
  chosen_korean: 그 염소 새끼
  alternatives_korean:
  - 보증물
  - 담보물
  - 인질
  lexicon: ἀρραβών
  rationale: 현재 그리스어 본문은 일반적으로 ‘보증금’ 계열 의미의 ἀρραβών이 아니라 제네시스 전승의 ‘염소 새끼’ 문맥을 반영하므로, 영어 POB와 본문 전승을 따라 염소 새끼로 옮겼습니다.
- source_word: οὐχ εὗρον αὐτήν
  english_pob_choice: I did not find her
  chosen_korean: 그러나 그녀를 찾지 못하였습니다
  alternatives_korean:
  - 그러나 내가 그녀를 보지 못하였습니다
  - 그러나 그녀를 만나지 못하였습니다
  lexicon: εὗρον / αὐτήν
  rationale: 동사 εὑρίσκω는 여기서 단순한 ‘발견하다’보다 ‘찾아내다’의 뜻이 자연스러워, 대상 인칭대명사 αὐτήν을 그대로 여성대명사 ‘그녀’로 반영했습니다.
theological_decisions:
- issue: 본문의 인칭 지시와 서술 시점
  chosen_reading: 서술자의 회상체로 평서문을 유지했습니다.
  alternative_readings:
  - 현재형에 가깝게 풀어 쓰는 방식
  - 문학적으로 감정이 실린 재서술
  rationale: 이 절은 교훈적 재해석보다 사건 회고의 간결한 진술이 본문 의미를 더 정확히 보존하므로, 불필요한 문체적 확장을 피했습니다.
  doctrine_reference: source transparency / historical narration
