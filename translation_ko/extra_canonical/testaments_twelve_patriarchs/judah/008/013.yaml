revisions:
- from: 며칠 후에, “다말 네 며느리가 창녀가 되었고 보십시오, 임신했습니다”라는 말이 전해졌습니다. 그런데 나는 분별하지 못한 채 분노의 교만 속에서 말하기를, “그 여자를 끌어내고 불태우십시오”라고 했습니다.[a]
  to: 며칠 뒤 다말이 매춘을 하여 아이를 배었다는 소식이 들렸습니다. 이 말을 듣고 저는 말했습니다. “그 여자를 끌어내어 불에 태우게 하십시오.”
  rationale: 그리스어 본문에 명시된 시간 표현과 보고 내용을 따라 번역하고, 영어 POB의 해석적 확장 및 창세기 전승에서 온 세부 사항은 본문에서 제외했습니다. 처형 명령의 가혹함은 완화하지 않되 수동 명령의 의미를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:04Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문은 ‘며칠/얼마간의 날들 뒤’(μεθ’ ἡμέρας τινάς), 다말이 매춘/음행을 했다는 보고, 임신, 그리고 화자가 그 말을 듣고 내린 명령만을 담고 있습니다. 초안의 ‘네 며느리’, ‘보십시오’, ‘분별하지 못한 채’, ‘분노의 교만 속에서’는 이 본문에 없으며 영어 POB의 해석적·전승적 보강을 따른 것이므로 삭제해야 합니다. 특히 ‘세 달’은 주어진 그리스어 본문이 아니라 창세기 전승에 속합니다.
  naturalness: ‘며칠 뒤’와 ‘아이를 배었다’는 현대 표준 한국어의 자연스러운 문어 표현입니다. 직접 명령은 합쇼체로 유지하되, καυθήτω의 수동적 ‘그녀가 불태워지게 하라’의 뜻을 ‘불에 태우게 하십시오’로 드러냈습니다.
  terminology: ἐκπεπόρνευκε는 비난성 보고의 성매매/매춘 의미를 보존하여 ‘매춘을 하여’로 옮겼습니다. 이는 인물에 대한 현대적 낙인을 불필요하게 강화하는 ‘창녀가 되었다’보다 원문의 행위 진술에 가깝습니다. ἐν γαστρὶ ἔχει는 ‘아이를 배었다’로 번역했습니다.
  issues:
  - severity: high
    issue: 영어 POB 및 창세기 전승의 보강이 본문에 들어감
    rationale: ‘네 며느리’, ‘보십시오’, 분노와 교만 및 무분별에 관한 진술은 제시된 그리스어에 없습니다. 원문 우선 원칙상 제거해야 합니다.
  - severity: medium
    issue: ἐκπεπόρνευκε의 번역
    rationale: ‘창녀가 되었고’는 지속적 신분 변화로 읽히며, 원문이 말하는 행위에 대한 보고보다 강합니다. ‘매춘을 하여’가 더 정확합니다.
  - severity: low
    issue: καυθήτω의 수동성 미반영
    rationale: ‘불태우십시오’도 문맥상 가능하지만, ‘불에 태우게 하십시오’가 ‘그녀가 태워지게 하라’라는 수동 명령의 의미를 더 잘 보존합니다.
  revised_text: 며칠 뒤 다말이 매춘을 하여 아이를 배었다는 소식이 들렸습니다. 이 말을 듣고 저는 말했습니다. “그 여자를 끌어내어 불에 태우게 하십시오.”
