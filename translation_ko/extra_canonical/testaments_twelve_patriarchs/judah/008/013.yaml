id: T12P.JUD.8.13
reference: Testament of Judah 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: ko
  text: 며칠 뒤 다말이 매춘을 하여 아이를 배었다는 소식이 들렸습니다. 이 말을 듣고 저는 말했습니다. “그 여자를 끌어내어 불에 태우게 하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινὰς
  english_pob_choice: after three months
  chosen_korean: 며칠 후에
  alternatives_korean:
  - 사흘 후에
  - 몇 달 후에
  - 세 달 후에
  lexicon: —
  rationale: 원문 그리스어는 ἡμέρας τινὰς(‘몇 날’)로 되어 있어 ‘며칠 후에’가 직접적입니다. 영어 POB의 ‘three months’는 창세기 전승을 반영한 해석적 보강이므로, 여기서는 본문 그리스어를 우선했습니다.
- source_word: ἐκπεπόρνευκε
  english_pob_choice: has played the prostitute
  chosen_korean: 창녀가 되었고
  alternatives_korean:
  - 몸을 팔았고
  - 음행했습니다
  - 창녀짓을 했고
  lexicon: —
  rationale: 이 동사는 단순한 ‘음행’보다 공개적 성매매/매춘의 뉘앙스가 강해, 한국어에서는 소스의 강도를 살리면서도 문어체에 맞는 표현으로 옮겼습니다.
- source_word: ἐν γαστρὶ ἔχει
  english_pob_choice: is with child
  chosen_korean: 임신했습니다
  alternatives_korean:
  - 아이를 배었습니다
  - 아이를 가졌습니다
  lexicon: —
  rationale: 직역적 관용구를 한국어 자연문으로 풀되, 의미는 분명히 임신 상태를 가리키도록 했습니다.
- source_word: ἐξαγάγετε αὐτὴν καὶ καυθήτω
  english_pob_choice: Bring her out, and let her be burned
  chosen_korean: 그 여자를 끌어내고 불태우십시오
  alternatives_korean:
  - 그 여자를 끌어내어 불사르십시오
  - 그 여자를 끌어내고 태우십시오
  lexicon: —
  rationale: 명령형의 긴박함과 수동형의 처형 의도를 살려 현대 한국어의 직접 명령으로 옮겼습니다. '불태우다'는 원문의 가혹한 처벌을 약화하지 않습니다.
theological_decisions:
- issue: 서술자의 자기평가(ἀκούσας δὲ ἐγὼ εἶπον)와 영어 POB의 해석적 첨가
  chosen_reading: 나는 분별하지 못한 채 분노의 교만 속에서 말하기를
  alternative_readings:
  - 내가 듣고 말하기를
  - 나는 화가 난 나머지 말하기를
  rationale: 영어 POB가 이미 ‘without understanding in the arrogance of my anger’로 해석한 바를 반영하되, 한국어에서도 원문의 감정적·윤리적 자기비판이 드러나도록 했습니다.
  doctrine_reference: 서술자의 회개적 자기진술을 보존하는 번역 원칙
