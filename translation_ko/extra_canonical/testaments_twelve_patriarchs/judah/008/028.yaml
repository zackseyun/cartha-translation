id: T12P.JUD.8.28
reference: Testament of Judah 8:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: ko
  text: 이러한 것들은 사람을 하나님의 율법에서 떠나게 하고, 영혼의 판단을 눈멀게 하며, 교만을 가르치고, 사람이 자기 이웃을 불쌍히 여기지 못하게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ νόμου τοῦ θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님께서 주신 율법
  lexicon: νόμος
  rationale: 문맥상 토라/율법을 가리키므로 표준적인 ‘율법’을 유지하고, 소유격은 ‘하나님의’로 자연스럽게 옮겼습니다.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  english_pob_choice: the inclination of the soul
  chosen_korean: 영혼의 의도
  alternatives_korean:
  - 영혼의 뜻
  - 영혼의 계획
  - 영혼의 의향
  lexicon: διαβούλιον
  rationale: 내적 판단·의도라는 의미를 살리되, ‘inclination’의 흐름을 따라 너무 기술적이거나 장황하지 않게 정리했습니다.
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  english_pob_choice: teach arrogance
  chosen_korean: 교만을 가르치고
  alternatives_korean:
  - 교만을 가르치며
  - 오만을 가르치고
  - 교만을 익히게 하고
  lexicon: ὑπερηφανία
  rationale: 동사 ἐκδιδάσκει는 ‘가르치다/익히게 하다’의 뜻이므로, 영어 POB의 선택을 따라 ‘교만을 가르치고’로 직역에 가깝게 옮겼습니다.
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  english_pob_choice: have compassion on his neighbor
  chosen_korean: 자기 이웃에게 자비를 베풀지 못하게 합니다
  alternatives_korean:
  - 자기 이웃을 불쌍히 여기지 못하게 합니다
  - 자기 이웃에게 긍휼을 베풀지 못하게 합니다
  lexicon: ἐλεέω
  rationale: 동사는 단순한 감정이 아니라 실제적인 긍휼/자비의 행위를 포함하므로, 문장 흐름상 ‘자비를 베풀다’로 옮겼습니다.
theological_decisions:
- issue: ‘영혼의 의도’의 의미 범위
  chosen_reading: 내면의 지향과 판단이 어둡게 되어 올바른 분별이 흐려지는 상태로 읽었습니다.
  alternative_readings:
  - ‘영혼의 소의도/숙고’로 보다 기술적으로 옮김
  - ‘영혼의 계획’으로 의지적 측면을 강조
  rationale: 본문은 단순 감정보다 내적 판단의 방향성을 말하므로, 한국어로도 도덕적·영적 분별의 흐름이 드러나게 했습니다.
  doctrine_reference: 인간의 내적 분별과 도덕적 타락에 대한 지혜문학적·교훈적 표현
