id: T12P.JUD.8.38
reference: Testament of Judah 8:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: ko
  text: 하나님의 제사장직은 지상의 나라보다 더 뛰어납니다. 다만 그것이 죄로 말미암아 주님에게서 떨어져 나가 지상의 나라의 지배를 받게 되면 그렇지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  english_pob_choice: the priesthood of God
  chosen_korean: 하나님의 제사장직
  alternatives_korean:
  - 하나님의 제사장
  - 하나님께 속한 제사 직분
  lexicon: ἱερατεία
  rationale: 직분·제도성을 함께 살리기 위해 ‘제사장직’을 택했습니다. 단순히 ‘제사장’으로 하면 추상적 제도 의미가 약해집니다.
- source_word: τῆς ἐπιγείου βασιλείας
  english_pob_choice: the earthly kingdom
  chosen_korean: 지상의 나라
  alternatives_korean:
  - 땅의 나라
  - 세상 나라
  lexicon: βασιλεία
  rationale: βασιλεία를 기본적으로 ‘나라’로 옮기되, ἐπιγείου의 대비를 살려 ‘지상의’로 표현했습니다.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  english_pob_choice: it falls away through sin from the Lord
  chosen_korean: 죄 때문에 주님에게서 떨어져 나가고
  alternatives_korean:
  - 죄로 인해 주님에게서 벗어나고
  - 죄 때문에 주님을 떠나고
  lexicon: ἐκπίπτω
  rationale: ἐκπέσῃ의 ‘떨어져 나가다/탈락하다’ 의미를 살려 관계의 이탈과 타락을 함께 드러냈습니다.
- source_word: κυριευθῇ
  english_pob_choice: is dominated by
  chosen_korean: 지상의 나라에 의해 지배되지 않는 한은
  alternatives_korean:
  - 지상의 나라에 의해 제압되지 않는 한은
  - 지상의 나라가 주도권을 잡지 않는 한은
  lexicon: κυριεύω
  rationale: 수동태의 강한 지배·장악 의미를 보존하기 위해 ‘지배되다’로 옮겼습니다.
theological_decisions:
- issue: ‘천상/지상’ 비교를 한국어에서 어떻게 문장 구조로 살릴지
  chosen_reading: ‘하늘이 땅보다 높은 것처럼’으로 도입하여 비유 구조를 분명히 했습니다.
  alternative_readings:
  - ‘하늘이 땅보다 높으니’
  - ‘하늘이 땅 위에 있는 것처럼’
  rationale: 영문 POB의 대조 구조와 그리스어의 우위 비교를 자연스럽게 전달하면서도, 뒤 문장의 ‘제사장직’ 우위를 강조하기 위해 평이한 비유문으로 정리했습니다.
  doctrine_reference: 비유적 우위 비교
- issue: ‘Κυρίου’를 고유명사로 번역할지 여부
  chosen_reading: 문맥상 주님으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 히브리어 야훼 직접 인용 표지가 아니라 그리스어 본문 내 일반적 주어로 기능하므로, 한국어 독자에게 자연스러운 ‘주님’을 사용했습니다.
  doctrine_reference: 호칭 번역 원칙
