revisions:
- from: 그러므로 하늘이 땅보다 높은 것처럼, 하나님의 제사장직도 지상의 나라보다 더 높습니다 — 다만 그것이 죄 때문에 주님에게서 떨어져 나가고 지상의 나라에 의해 지배되지 않는 한은 그렇습니다.[a]
  to: 하나님의 제사장직은 지상의 나라보다 더 뛰어납니다. 다만 그것이 죄로 말미암아 주님에게서 떨어져 나가 지상의 나라의 지배를 받게 되면 그렇지 않습니다.
  rationale: 그리스어의 우위 진술(ὑπερέχει)과 예외 조건(ἐὰν μὴ)을 보존하되, 제시된 원문에 없는 하늘·땅 비유는 삭제했습니다. 두 동사 ‘떨어져 나가다’와 ‘지배를 받다’는 접속되어 예외 조건을 이룹니다. 무근거 각주 표지도 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:05Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 그리스어 본문에 없는 ‘하늘이 땅보다 높은 것처럼’이라는 비교를 영어 감사 문구에서 따라 추가했습니다. 제시된 그리스어는 하나님의 제사장직과 지상의 나라의 우위만을 말합니다. 또한 조건절은 제사장직이 죄로 주님에게서 떨어져 나가고 지상의 나라의 지배를 받는 경우를 예외로 삼는데, 초안의 ‘지배되지 않는 한’은 δεύτε 조건의 극성을 뒤집습니다.
  naturalness: ‘하나님의 제사장직’과 ‘지상의 나라’는 자연스럽고 현대 표준어에 맞습니다. 예외 조건은 ‘그렇지 않습니다’로 명료하게 처리하는 편이 합쇼체 문장으로도 자연스럽습니다.
  terminology: ἱερατεία는 제도적·직분적 의미를 지닌 ‘제사장직’으로 유지합니다. βασιλεία는 영어 POB의 ‘kingdom’ 및 원문의 정치적 통치 영역에 맞춰 ‘나라’로 유지합니다. κυριευθῇ의 수동 의미는 ‘지배를 받다’로 보존했습니다.
