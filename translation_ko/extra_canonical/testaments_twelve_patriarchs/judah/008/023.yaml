  source_fidelity: 첫 절의 γυμνούμενος는 ‘손해를 입다’보다 ‘벗겨지다/발가벗겨지다’라는 박탈·노출의 표현을 보존하는 편이 원문에 가깝습니다. ἀδοξῶν도 단순히 ‘욕을 당하다’보다는 명예·평판의 상실을 나타내므로 ‘명예를 잃어도’로 옮겼습니다. 둘째 절의 왕권 박탈과 음행에 대한 종속은 원문의 의미를 잘 반영하되, 인과 관계를 자연스럽게 다듬었습니다.
  naturalness: ‘발가벗겨지고도 깨닫지 못하며’는 원문의 강한 비유를 유지하면서 현대 한국어에서도 이해 가능합니다. ‘음행에 종노릇하여’는 ‘음행의 종이 됨으로써’보다 문장 안에서 더 자연스럽고, 합쇼체 문체와도 조화를 이룹니다.
  terminology: ‘음행’은 πορνεία 계열의 넓은 범주를 전통적이면서도 비교적 포괄적으로 나타내므로 유지합니다. ‘왕권’은 βασιλεία의 문맥상 왕으로서의 지위·통치권 박탈을 적절히 전달합니다.
