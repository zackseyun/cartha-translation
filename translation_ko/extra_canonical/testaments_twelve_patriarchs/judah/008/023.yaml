id: T12P.JUD.8.23
reference: Testament of Judah 8:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a slave to sexual immorality, as I myself also suffered.
translation:
  language: ko
  text: 음행하는 사람은 발가벗겨지고도 깨닫지 못하며, 명예를 잃어도 부끄러워하지 않습니다. 어떤 사람이 왕이라 해도 음행하면, 음행에 종노릇하여 왕권을 빼앗기게 됩니다. 나 자신도 그렇게 겪었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύσας / πορνείᾳ
  english_pob_choice: commits sexual immorality / sexual immorality
  chosen_korean: 음행하다 / 음행
  alternatives_korean:
  - 성적 부도덕을 저지르다 / 성적 부도덕
  - 간음을 저지르다 / 간음
  lexicon: πορνεία
  rationale: English POB가 보다 넓은 성적 타락 범주를 택했으므로, 한국어도 교회 전통의 좁은 ‘간음’보다 원문의 범위를 살리는 ‘음행’으로 옮겼습니다.
- source_word: γυμνούμενος / γυμνοῦται τῆς βασιλείας
  english_pob_choice: suffers loss / is stripped of his kingship
  chosen_korean: 손해를 입다 / 왕권을 빼앗기다
  alternatives_korean:
  - 벌거벗겨지다 / 왕국에서 벗겨지다
  - 수치를 당하다 / 왕위에서 벗겨지다
  lexicon: γυμνόω
  rationale: 직역적 ‘벗기다/벌거벗기다’의 이미지는 유지하되, 문맥상 결과가 재산 손실이 아니라 지위 상실이므로 첫 절은 ‘손해를 입다’, 둘째 절은 ‘왕권을 빼앗기다’로 구체화했습니다.
- source_word: ἀδοξῶν / οὐκ αἰσχύνεται
  english_pob_choice: dishonored / ashamed
  chosen_korean: 욕을 당하다 / 부끄러워하다
  alternatives_korean:
  - 수치를 당하다 / 수치스러워하다
  - 명예를 잃다 / 부끄러워하지 않다
  lexicon: ἀδοξέω, αἰσχύνομαι
  rationale: ‘명예 없음’과 ‘수치 없음’의 병렬을 살리면서도 한국어에서 자연스러운 대응으로 ‘욕을 당하다 / 부끄러워하지 않다’를 택했습니다.
- source_word: δουλεύσας
  english_pob_choice: becoming a slave to sexual immorality
  chosen_korean: 음행의 종이 됨으로써
  alternatives_korean:
  - 음행에 종노릇함으로써
  - 음행의 노예가 됨으로써
  lexicon: δουλεύω
  rationale: 종속 상태를 드러내는 동사이므로 단순한 ‘빠지다’보다 종속성을 분명히 하는 ‘종이 됨’으로 옮겼습니다.
theological_decisions:
- issue: 왕권 상실의 비유
  chosen_reading: 음행은 왕의 지위조차 무력화하는 예속으로 묘사됩니다.
  alternative_readings:
  - 단순한 도덕적 실패의 경고로만 읽기
  - 사회적 수치에 대한 일반론으로 완화하기
  rationale: 원문은 왕이라는 최고 지위도 예외로 두지 않고, 음행을 통한 예속과 박탈을 강조합니다. 이를 약화하지 않도록 ‘왕권을 빼앗기다’로 보존했습니다.
  doctrine_reference: 성윤리와 죄의 예속성
