  text: 그러므로, 내 자녀들아, 주님의 모든 율법을 지키십시오. 그것은 모든 사람에게 소망이 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'πᾶς / ὅλος (in English audit: “all”)

    '
  english_pob_choice: keep all the law of the Lord / hope for all who are...
  chosen_korean: 모든 율법
  alternatives_korean:
  - 전부의 율법
  - 주님의 모든 계명
  lexicon: 율법
  rationale: 영문 개정안이 law를 commandments가 아니라 law로 바로잡았으므로, स्रोत의 νόμος 계열 의미를 살려 ‘율법’으로 옮겼습니다.
- source_word: νόμος τοῦ κυρίου
  english_pob_choice: law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 계명
  lexicon: 율법
  rationale: 지시 대상이 단순한 규범이 아니라 하나님의 권위 아래 있는 율법이므로, 프로젝트 기본어인 ‘율법’을 유지했습니다.
- source_word: ἐλπίς
  english_pob_choice: hope
  chosen_korean: 소망
  alternatives_korean:
  - 희망
  - 기대
  lexicon: 소망
  rationale: 한국어 성경 문맥에서 ἐλπίς는 종말론적·신앙적 뉘앙스를 포함해 ‘소망’이 가장 안정적으로 대응합니다.
theological_decisions:
- issue: 문장 후반의 미완성 표현 처리
  chosen_reading: 제공된 그리스어 단편은 ἀποθνῄσκω σήμερον(“오늘 죽습니다”)까지만 분명하므로, 본문은 앞의 권면문과 단편에서 확인되는 죽음의 고지를 분리해 번역하지 않고 현재 주어진 절 범위에 맞춰 절단했습니다.
  alternative_readings:
  - English audit trail의 ‘hope for all who are…’를 이어 문장을 보충하는 방식
  - 후대 문맥을 추정해 완결형 문장으로 재구성하는 방식
  rationale: 본 절의 핵심은 유언적 권면이며, 단편에 없는 후속 내용을 보충하면 사료비평적 투명성이 손상됩니다.
  doctrine_reference: source-grounded translation principle
