translation:
  language: ko
  text: 아무도 나를 값비싼 옷을 입혀 장사하지 마시고, 나를 헤브론으로 데려가십시오. 그곳에 내 조상들도 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδείς… με ἐνταφιάσει
  english_pob_choice: And bury me near my fathers.
  chosen_korean: 아무도 나를 장사하지 말고
  alternatives_korean:
  - 나를 묻지 말고
  - 아무도 나를 매장하지 말고
  lexicon: ἐνταφιάζω
  rationale: 무덤에 넣는 행위를 뜻하므로 ‘장사하다’가 비교적 직접적이며, 문맥상 금지형으로 자연스럽게 옮겼습니다.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  english_pob_choice: in costly clothing
  chosen_korean: 값비싼 옷으로
  alternatives_korean:
  - 사치스러운 옷으로
  - 호화로운 옷으로
  lexicon: πολυτελής, ἐσθῆς
  rationale: 매장 방식의 화려함을 가리키므로 ‘값비싼 옷’이 원문의 물질적·장례적 뉘앙스를 가장 직접적으로 살립니다.
- source_word: ἀναγάγετε με ἐν Χεβρὼν
  english_pob_choice: bring me up to Hebron
  chosen_korean: 나를 헤브론으로 데려가십시오
  alternatives_korean:
  - 나를 헤브론으로 올려주십시오
  - 나를 헤브론으로 옮겨 주십시오
  lexicon: ἀναγάγω, Χεβρών
  rationale: 상황상 유해를 운구하는 뜻이므로 ‘데려가십시오’가 가장 자연스럽고, 지명은 통용 표기인 ‘헤브론’을 따랐습니다.
- source_word: ἔνθα καὶ οἱ πατέρες μου
  english_pob_choice: near my fathers
  chosen_korean: 거기에 내 조상들도 있습니다
  alternatives_korean:
  - 거기에 내 아버지들도 있습니다
  - 거기에 내 선조들도 있습니다
  lexicon: πατέρες
  rationale: 복수 ‘아버지들’은 문맥상 조상/선조를 가리키므로, 독자가 의미를 바로 이해하도록 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: 본문이 장례와 매장 위치를 직접 요청하는 표현인지 여부
  chosen_reading: 화자가 자기 장례를 값비싼 옷이 아닌 헤브론의 조상들 곁으로 옮겨 달라고 분명히 요청하는 장면으로 번역했습니다.
  alternative_readings:
  - 영적 비유나 단순한 유언적 표현으로 완화하는 번역
  - ‘묻다’ 대신 추상적으로 ‘보내다’로 흐리는 번역
  rationale: 그리스어의 명령형과 장소 표현이 매우 구체적이므로, 장례 지시의 직접성을 유지해야 합니다.
  doctrine_reference: 본문의 역사·서사적 직접성 보존
