    rationale: 제시된 그리스어는 ‘그를 조상들과 함께 헤브론에 장사하였다’고만 하며 운구나 상행을 뜻하는 동사를 포함하지 않습니다. 영어 POB의 확장 표현보다 원문을 우선해야 합니다.
