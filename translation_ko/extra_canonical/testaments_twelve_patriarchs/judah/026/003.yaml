  source_fidelity: 그리스어 본문은 유다가 ‘좋은 노년에’ 죽었다거나 아들들이 그를 헤브론으로 ‘올라가 모셨다’고 말하지 않습니다. 초안은 전자는 포함하지 않았지만, 후자의 운구 동작을 영어 POB를 따라 추가했습니다. 원문 우선 원칙에 따라 이를 제거해야 합니다. 또한 ἐκοιμήθη의 죽음 완곡 표현, 명령 전부를 행함, 헤브론에서 조상들과 함께 매장함은 유지됩니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽고, 장례 문맥에서 ‘장사하였습니다’도 적절합니다. ‘이 말을 하고’는 간결하면서도 καὶ ταῦτα εἰπών을 충실히 반영합니다.
  terminology: ‘잠들었습니다’는 ἐκοιμήθη의 완곡 표현을 보존합니다. ‘조상들과 함께’는 이 문맥의 πατέρων αὐτοῦ에 자연스럽고 적절합니다. ‘헤브론’ 표기도 적절합니다.
