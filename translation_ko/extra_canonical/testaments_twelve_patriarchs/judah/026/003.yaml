  text: '*Καὶ ταῦτα εἰπών⁰ ἐκοιμήθη²¹ καὶ ἐποίησαν οἱ υἱοὶ αὐτοῦ κατὰ πάντα ὅσα²² ἐνετείλατο αὐτοῖς, καὶ ἔθαψαν²³ αὐτὸν²⁴ μετὰ τῶν πατέρων αὐτοῦ²⁵ ἐν Χεβρὼν²⁶.'
