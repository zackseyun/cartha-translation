base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/003.yaml
  text: And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.
translation:
  language: ko
  text: 이 말을 하고 그는 잠들었습니다. 그의 아들들은 그가 그들에게 명령한 모든 것을 다 행하고, 그를 그의 조상들과 함께 헤브론에 장사하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  english_pob_choice: he fell asleep
  chosen_korean: 잠들었습니다
  alternatives_korean:
  - 죽었습니다
  - 눈을 감았습니다
  lexicon: κοιμάομαι
  rationale: 문맥상 죽음을 완곡하게 표현하는 표준적 용법이므로, 영어 POB의 ‘fell asleep’에 맞춰 자연스러운 한국어 ‘잠들었습니다’로 옮겼습니다.
- source_word: κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς
  english_pob_choice: did as he had commanded them
  chosen_korean: 그가 그들에게 명령한 모든 것을 그대로 행했고
  alternatives_korean:
  - 그가 그들에게 명령한 대로 다 하였고
  - 그가 명한 모든 것을 지켰고
  lexicon: ἐντέλλομαι
  rationale: ‘명령하다/명하다’의 직접성을 살리되, ‘모든 것을 그대로 행했다’로 순종의 완결성을 분명하게 나타냈습니다.
- source_word: ἔθαψαν αὐτὸν ... ἐν Χεβρών
  english_pob_choice: they carried him up to Hebron and buried him there with his fathers
  chosen_korean: 그를 헤브론으로 모시고 올라가 그곳에 그의 조상들과 함께 장사하였습니다
  alternatives_korean:
  - 그를 헤브론으로 데려가 그곳에 그의 조상들과 함께 묻었습니다
  - 그를 헤브론으로 옮겨 그곳에 그의 조상들과 함께 장사했습니다
  lexicon: θάπτω
  rationale: 그리스어는 ‘묻다/장사하다’를 직접 말하며, POB의 ‘carried him up to Hebron’은 시신을 운구하는 의미를 반영합니다. ‘모시고 올라가’로 운구의 존중과 ‘장사하다’의 장례 용어를 함께 살렸습니다.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들 곁에
  lexicon: πατέρες
  rationale: 여기서 πατέρες는 단순한 ‘아버지들’이라기보다 족장적 선조들을 가리키므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: 죽음의 완곡한 표현
  chosen_reading: ‘잠들었습니다’로 죽음을 완곡하게 표현했습니다.
  alternative_readings:
  - ‘죽었습니다’로 직설적으로 옮길 수 있음
  - ‘세상을 떠났습니다’로 현대식 완곡어법을 쓸 수 있음
  rationale: 본문의 κοιμάομαι가 가진 완곡한 죽음 표현을 유지해, 본문의 어조와 POB의 영어 선택을 반영했습니다.
  doctrine_reference: 성경적 죽음 완곡어법(‘잠들다’)
