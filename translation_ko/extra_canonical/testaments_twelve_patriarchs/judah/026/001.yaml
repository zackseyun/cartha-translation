source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξατε² οὖν τέκνα μου *πάντα τὸν νόμον³ Κυρίου, ὅτι⁴ ἐστὶν ἐλπὶς⁵ τοῖς κατευθύνουσι⁶ *τὰς ὁδοὺς αὐτοῦ⁷.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/001.yaml
  text: Therefore keep, my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 주의 온 율법을 지키십시오. 그것은 자기의 길들을 의로 인도하는 모든 이에게 소망이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  english_pob_choice: keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 간수하십시오
  - 보존하십시오
  lexicon: φυλάσσω
  rationale: 단순한 보관이 아니라 계명을 충실히 준수하라는 명령이므로, 현대 한국어에서 자연스러운 ‘지키다’를 택했습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아들들아
  - 내 자식들아
  lexicon: τέκνον
  rationale: 직접 호칭을 살리되 성중립적으로 ‘자녀들’로 옮겨, 본문의 권면 어조를 유지했습니다.
- source_word: πάντα τὸν νόμον Κυρίου
  english_pob_choice: the whole law of the Lord
  chosen_korean: 주의 온 율법
  alternatives_korean:
  - 주님의 모든 율법
  - 주님의 전체 율법
  lexicon: νόμος
  rationale: νόμος는 여기서 토라/계명 전반을 가리키므로 ‘율법’으로 두고, πάντας의 포괄성을 ‘온’으로 간결하게 살렸습니다.
- source_word: κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  english_pob_choice: keep his ways in righteousness
  chosen_korean: 자기의 길들을 의로 인도하는
  alternatives_korean:
  - 그의 길들을 의로 행하는
  - 그의 길들을 곧게 따르는
  lexicon: κατευθύνω
  rationale: 영문 POB의 ‘keep his ways in righteousness’를 그대로 답습하기보다, 그리스어의 ‘길들을 바르게 인도하다/곧게 하다’라는 동작성을 드러냈습니다.
theological_decisions:
- issue: ἐλπὶς의 기능을 ‘is hope’로 직역할지, 문맥상 ‘소망이기 때문’으로 풀지
  chosen_reading: 그 명령 순종이 가져오는 근거를 ‘소망’ 자체로 제시하는 문장으로 읽어, ‘그것은 … 소망이기 때문입니다’로 옮겼습니다.
  alternative_readings:
  - 그것은 …에게 소망입니다
  - 그것은 …의 소망입니다
  rationale: 본문은 율법 준수의 동기를 단순한 의무가 아니라 장래의 소망으로 제시하므로, 한국어에서도 명사구의 논리를 분명히 했습니다.
  doctrine_reference: 권면과 소망의 동기 부여
