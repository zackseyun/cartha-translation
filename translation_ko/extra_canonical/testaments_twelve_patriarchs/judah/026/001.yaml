source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξατε² οὖν τέκνα μου *πάντα τὸν νόμον³ Κυρίου, ὅτι⁴ ἐστὶν ἐλπὶς⁵ τοῖς κατευθύνουσι⁶ *τὰς ὁδοὺς αὐτοῦ⁷.
  language: Greek
