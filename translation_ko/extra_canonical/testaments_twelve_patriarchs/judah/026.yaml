base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026.yaml
  text: 'Therefore keep[a], my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness. And bury me near my fathers.


    And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.


    And if you walk in holiness according to all the commandments of the Lord, you will again dwell securely with me[b], and all Israel will be gathered to the Lord forever.'
  footnotes:
  - marker: a
    text: '''Fell asleep'' is a conventional ancient euphemism for death, preserved here to retain the testamentary register.'
    reason: lexical_alternative
  - marker: b
    text: 'The closing line has an eschatological tone: obedience to the Lord''s commandments is linked with secure dwelling and Israel''s final gathering to the Lord.'
    reason: cross_reference
translation:
  language: ko
  text: '그러므로 내 자녀들아, 주님의 모든 율법을 지키십시오. 그것은 그의 길을 의로움 가운데 곧게 가는 모든 이에게 희망이 됩니다. 그리고 나를 내 조상들 가까이에 묻으십시오.


    그는 좋은 노년에 잠들었습니다. 그의 아들들은 그가 그들에게 명한 대로 모두 행하여 그를 헤브론으로 모셔 가서 거기에서 그의 조상들과 함께 묻었습니다.


    그리고 여러분이 주님의 모든 계명에 따라 거룩함 가운데 행하면, 여러분은 다시 나와 함께 안전하게 거하실 것이며, 온 이스라엘은 영원히 주님께 모일 것입니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  english_pob_choice: keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 보호하십시오
  - 간직하십시오
  lexicon: LSJ
  rationale: 명령형으로서 율법에 대한 지속적 준수를 요구하므로, 한국어에서는 관용적이며 규범적 뉘앙스를 살리는 ‘지키다’가 가장 자연스럽습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들
  alternatives_korean:
  - 내 아들들
  - 내 자식들
  lexicon: LSJ
  rationale: 직접 호칭의 친족적, 포괄적 성격을 살리기 위해 ‘자녀들’을 택했습니다. ‘아들들’은 남성 한정으로 좁아질 수 있습니다.
- source_word: πάντα τὸν νόμον Κυρίου
  english_pob_choice: the whole law of the Lord
  chosen_korean: 주님의 모든 율법
  alternatives_korean:
  - 주님의 전체 율법
  - 주님의 온 율법
  lexicon: LSJ
  rationale: ‘πάντα’의 총체성을 ‘모든’으로, ‘νόμος’는 POB 기본어휘에 따라 ‘율법’으로 옮겨 언약적 순종의 성격을 유지했습니다.
- source_word: ἐλπίς
  english_pob_choice: hope
  chosen_korean: 희망
  alternatives_korean:
  - 소망
  - 기대
  lexicon: LSJ
  rationale: POB의 ‘hope’에 대응해 현대 한국어에서 즉각 이해되면서도 문맥상 권면적 힘을 지닌 ‘희망’을 사용했습니다.
- source_word: ἐκοιμήθη
  english_pob_choice: fell asleep
  chosen_korean: 잠들었습니다
  alternatives_korean:
  - 죽었습니다
  - 세상을 떠났습니다
  lexicon: LSJ
  rationale: 죽음의 완곡어법을 그대로 드러내기 위해 ‘잠들다’를 사용해 테스트멘트 문체와 유대교적/초기문헌적 표현을 보존했습니다.
theological_decisions:
- issue: ‘주님의 율법’과 ‘계명’의 구분
  chosen_reading: 앞부분은 ‘율법’, 후반의 순종 규범은 ‘계명’으로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 ‘법’으로 평준화
  - 둘 다 ‘명령’으로 평준화
  rationale: 원문은 νόμος와 ἐντολαί를 구분하므로, 한국어에서도 같은 어휘로 뭉개지지 않도록 구별을 유지했습니다.
  doctrine_reference: Translation philosophy 1, 4
- issue: 죽음의 완곡어법 유지
  chosen_reading: ‘잠들었습니다’로 옮겨 patriarchal/testamentary register를 살렸습니다.
  alternative_readings:
  - 죽었습니다
  - 영면했습니다
  rationale: 본문의 문학적·신학적 완곡성을 드러내려면 단순 사실 진술보다 ‘잠들다’가 원문에 더 가깝습니다.
  doctrine_reference: PHILOSOPHY.md transparency and source-anchoring principles
