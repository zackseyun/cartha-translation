  text: XXVI. Φυλάξατε² οὖν τέκνα μου *πάντα τὸν νόμον³ Κυρίου, ὅτι⁴ ἐστὶν ἐλπὶς⁵ τοῖς κατευθύνουσι⁶ *τὰς ὁδοὺς αὐτοῦ⁷. 2. Καὶ εἶπεν αὐτοῖς ὅτι Ἰδοὺ ἐγώ⁸ ἑκατὸν *δέκα καὶ ὀκτὼ ἐτῶν⁹ ἀποθνῄσκω σήμερον¹⁰. 3. Μηδείς¹¹ με ἐνταφιάσει¹² ἐν πολυτελεῖ ἐσθῆτι, ἀλλὰ ἀναγάγετε¹³ με ἐν Χεβρὼν, ἔνθα καὶ οἱ πατέρες μου. 4. *Καὶ ταῦτα εἰπών⁰ ἐκοιμήθη²¹ καὶ ἐποίησαν οἱ υἱοὶ αὐτοῦ κατὰ πάντα ὅσα²² ἐνετείλατο αὐτοῖς, καὶ ἔθαψαν²³ αὐτὸν²⁴ μετὰ τῶν πατέρων αὐτοῦ²⁵ ἐν Χεβρὼν²⁶.
