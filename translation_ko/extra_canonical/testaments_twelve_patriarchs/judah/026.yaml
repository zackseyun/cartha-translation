revisions:
- from: '그러므로 내 자녀들아, 주님의 모든 율법을 지키십시오. 그것은 그의 길을 의로움 가운데 곧게 가는 모든 이에게 희망이 됩니다. 그리고 나를 내 조상들 가까이에 묻으십시오.


    그는 좋은 노년에 잠들었습니다. 그의 아들들은 그가 그들에게 명한 대로 모두 행하여 그를 헤브론으로 모셔 가서 거기에서 그의 조상들과 함께 묻었습니다.


    그리고 여러분이 주님의 모든 계명에 따라 거룩함 가운데 행하면, 여러분은 다시 나와 함께 안전하게 거하실 것이며, 온 이스라엘은 영원히 주님께 모일 것입니다.[a][b]'
  to: '그러므로 내 자녀들아, 주님의 온 율법을 지키십시오. 그것은 그분의 길들을 바르게 하는 이들에게 희망이 됩니다.


    그가 그들에게 말하였습니다. “보십시오, 나는 오늘 백십팔 세에 죽습니다. 아무도 나를 값비싼 옷을 입힌 채 장사하지 말고, 나를 헤브론으로 데려가십시오. 그곳에는 내 조상들도 있습니다.”


    이 말을 하고 그는 잠들었습니다. 그의 아들들은 그가 그들에게 명령한 모든 것을 그대로 행하여, 그를 그의 조상들과 함께 헤브론에 장사했습니다.'
  rationale: 제시된 α열 그리스어 본문 26:1–4만을 번역했습니다. 영어 POB 감사본에 보이는 추가 종결 권면과 ‘좋은 노년’ 공식은 이 원문에 근거하지 않으므로 삭제했습니다. ‘그분의 길들을 바르게 하는’은 다소 낯설지만 κατευθύνουσι τὰς ὁδοὺς αὐτοῦ의 문법적 표현을 과도하게 해석하지 않고 보존한 번역입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:10Z'
review_pass:
  verdict: revise
  source_fidelity: 대폭 수정이 필요합니다. 그리스어 본문은 26:1–4만 포함하며, 초안은 원문에 없는 ‘조상들 가까이에 묻으십시오’, ‘좋은 노년에’, 마지막의 거룩함·안전한 거주·이스라엘의 영원한 모임을 삽입했습니다. 반대로 유다의 118세 및 장례 옷차림에 관한 명령을 누락했습니다. 또한 원문의 ‘그의 길들을 바르게 하는 이들’이라는 다소 어려운 표현을 ‘의로움 가운데 곧게 가는’으로 해석적으로 바꾸었습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하면서 유언·권면 문맥에 맞게 자연스럽게 구성했습니다. ‘잠들었다’는 죽음의 완곡 표현을 보존했습니다.
  terminology: νόμος는 ‘율법’, ἐλπίς는 ‘희망’, ἐκοιμήθη는 ‘잠들었다’로 옮겼습니다. πολυτελεῖ ἐσθῆτι는 장례 시 입히는 옷의 문맥을 드러내어 ‘값비싼 옷을 입힌 채’로 번역했습니다. 원문에 없는 ‘계명’, ‘거룩함’, 종말론적 집결 표현은 삭제했습니다.
  issues:
  - severity: high
    issue: 원문에 없는 종결 권면 및 각주 [b] 삽입
    rationale: 제시된 그리스어 26:1–4에는 거룩함 가운데 행함, 유다와 함께 안전히 거함, 이스라엘의 영원한 집결이 없습니다. 영어 감사본의 확장 내용을 한국어 본문에 반영할 수 없습니다.
  - severity: high
    issue: 원문의 장례 명령과 118세 언급 누락
    rationale: 26:2–3은 유다가 오늘 118세로 죽는다고 말하고, 값비싼 옷을 입힌 채 장사하지 말며 헤브론으로 데려가라고 명합니다. 초안은 이를 누락하거나 다른 내용으로 대체했습니다.
  - severity: high
    issue: ‘좋은 노년에’ 및 ‘조상들 가까이에 묻으십시오’ 추가
    rationale: γήρᾳ καλῇ 및 ‘내 조상들 가까이에 묻으라’는 현재 제시된 그리스어 본문에 없습니다. 26:3은 헤브론, 곧 조상들이 있는 곳으로 데려가라는 명령입니다.
  - severity: medium
    issue: ‘그의 길을 의로움 가운데 곧게 가는’으로의 해석적 변경
    rationale: κατευθύνουσι τὰς ὁδοὺς αὐτοῦ는 문자상 ‘그의 길들을 바르게 하는 이들’이며, ‘의로움 가운데’는 원문에 없습니다. 난해함을 보존하는 편이 안전합니다.
  - severity: medium
    issue: 각주 [a]의 앵커 불일치
    rationale: 초안의 [a]는 마지막 문장에 붙어 있으나 제공된 영어 각주 a는 ‘fell asleep’에 관한 것입니다. 수정문에서는 해당 영어 감사 각주 자체가 현 원문과 맞지 않아 각주를 두지 않았습니다.
