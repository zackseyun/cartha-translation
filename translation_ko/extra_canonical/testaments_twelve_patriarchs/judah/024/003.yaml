id: T12P.JUD.24.3
reference: Testament of Judah 24:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '[Οὗτος ὁ βλαστὸς²⁰ Θεοῦ ὑψίστου *καὶ αὕτη ἡ πηγὴ *πᾶσι παρέχουσα²² ζωήν¹⁰].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/003.yaml
  text: '[This is the shoot of the Most High God, a spring providing life to all flesh.]'
translation:
  language: ko
  text: '[이것은 지극히 높으신 하나님의 새순이며, 모든 육체에 생명을 주는 샘입니다.][a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὗτος ὁ βλαστὸς
  english_pob_choice: This is the shoot
  chosen_korean: 이것은 … 새순입니다
  alternatives_korean:
  - 싹
  - 가지
  - 순
  lexicon: βλαστός
  rationale: βλαστός는 식물의 새로 돋는 순을 가리키므로, 문맥상 ‘새순’이 가장 자연스럽고 이미지도 잘 보존합니다.
- source_word: Θεοῦ ὑψίστου
  english_pob_choice: of the Most High God
  chosen_korean: 지극히 높으신 하나님의
  alternatives_korean:
  - 가장 높으신 하나님의
  - 지극히 높으신 신의
  lexicon: θεός + ὕψιστος
  rationale: ὕψιστος를 ‘지극히 높으신’으로 옮겨 하나님의 지극하신 높음을 분명히 했고, θεός는 프로젝트 기본어인 ‘하나님’을 따랐습니다.
- source_word: ἡ πηγὴ ... παρέχουσα ζωήν
  english_pob_choice: a spring providing life
  chosen_korean: 생명을 주는 샘
  alternatives_korean:
  - 생명을 공급하는 샘
  - 생명을 제공하는 샘
  lexicon: πηγή + παρέχω + ζωή
  rationale: πηγή는 ‘샘’, παρέχουσα는 진행·수식 관계를 살려 ‘주는/내는’이 자연스럽고, ζωήν은 단순 생존이 아니라 ‘생명’으로 옮기는 것이 적절합니다.
- source_word: πᾶσι
  english_pob_choice: to all flesh
  chosen_korean: 모든 육체에
  alternatives_korean:
  - 모든 사람에게
  - 모든 육신에게
  lexicon: πᾶς
  rationale: 본문의 πᾶσι를 POB의 ‘all flesh’에 맞춰 ‘모든 육체에’로 옮겨, 생명 공급의 보편성을 직접적으로 드러냈습니다.
theological_decisions:
- issue: ‘지극히 높으신 하나님’의 호칭 보존
  chosen_reading: 메시아적/예언적 이미지 안에서 하나님을 ‘지극히 높으신 하나님’으로 직접 표기했습니다.
  alternative_readings:
  - ‘가장 높으신 하나님’으로 완화
  - ‘높으신 하나님’으로 단순화
  rationale: 원문의 ὕψιστος가 지닌 초월성과 찬양성을 약화하지 않기 위해 강한 표현을 유지했습니다.
  doctrine_reference: 하나님의 지극한 초월성과 칭호의 직접성
- issue: ‘육체’의 보편성 유지
  chosen_reading: ‘모든 육체’로 직역하여 생명의 보편적 수여를 살렸습니다.
  alternative_readings:
  - ‘모든 사람’으로 의역
  - ‘모든 인간’으로 현대화
  rationale: πᾶσι와 ζωήν의 결합은 인류 전체를 향한 생명 공급을 강조하므로, 관용적인 ‘사람’보다 원문 이미지를 보존하는 편이 좋습니다.
  doctrine_reference: 구원/생명의 보편적 확장성
