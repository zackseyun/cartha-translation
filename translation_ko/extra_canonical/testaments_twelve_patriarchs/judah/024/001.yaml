    rationale: Καὶ ἀνοιγήσονται ἐπ᾽ αὐτῷ οἱ οὐρανοὶ는 독립된 핵심 절입니다. 영어 POB 감사 문구에도 누락되어 있으나, 원어 본문 우선 원칙상 한국어 번역에서는 복원해야 합니다.
  - severity: medium
    issue: 첫 번째 ‘부음’의 문법적 연결이 두 번째 절의 ‘그 자신’과 혼동될 수 있습니다.
    rationale: 원문은 하늘이 열리는 절 뒤에 ἐκχέαι가 이어지고, 이어서 αὐτὸς가 명시된 새 절이 나옵니다. 한국어에서도 첫 부음은 열린 하늘에 연결하고, 둘째 부음만 ‘그 자신도’로 표지하는 편이 원문의 대조와 통사적 불확실성을 더 잘 보존합니다.
