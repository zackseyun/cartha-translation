revisions:
- from: 그는 거룩하신 아버지의 복의 영을 그 위에 쏟아부으실 것이며, 그 자신도 여러분 위에 은혜의 영을 쏟아부으실 것입니다.
  to: 하늘이 그 위에 열려 거룩하신 아버지의 축복의 영을 부을 것이며, 그 자신도 여러분 위에 은혜의 영을 부으실 것입니다.
  rationale: 누락된 ‘하늘이 그 위에 열림’을 복원했습니다. 첫 절의 부음은 원문의 다소 압축되고 통사적으로 어려운 연결을 해석적으로 과도하게 보충하지 않고 ‘열려 … 부을 것이며’로 유지했습니다. δεύτε 번째 절의 αὐτὸς는 ‘그 자신도’로 보존하여 두 부음의 병렬과 강조를 드러냈습니다. 원문에 제공된 위첨자 표지(10, 14–16)에 대응하는 주석 내용은 자료에 없으므로 임의의 주석을 만들지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:07Z'
review_pass:
  verdict: revise
  source_fidelity: 원문 첫 구절인 «Καὶ ἀνοιγήσονται ἐπ᾽ αὐτῷ οἱ οὐρανοὶ»(하늘이 그 위에/그를 위하여 열릴 것이다)가 초안과 영어 POB 문장 모두에서 빠져 있습니다. 또한 첫 번째 부음은 원문의 통사상 열리는 하늘과 연결되어 있으므로, 두 번째 절의 강조된 «그 자신도»와 구별되게 옮기는 것이 안전합니다.
  naturalness: ‘복의 영’은 가능하나 현대 한국어에서는 ‘축복의 영’이 더 자연스럽습니다. 다만 원문의 소유격 연쇄와 병렬을 보존하기 위해 간결한 표현을 유지했습니다. ‘여러분 위에’는 ἐφ᾽ ὑμᾶς의 방향성을 잘 살립니다.
  terminology: πνεῦμα는 두 경우 모두 ‘영’으로, χάρις는 ‘은혜’로 유지했습니다. ‘거룩하신 아버지’는 원문의 πατρὸς ἁγίου를 과도하게 교리화하지 않는 적절한 번역입니다.
  issues:
  - severity: high
