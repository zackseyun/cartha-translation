id: T12P.JUD.24.1
reference: Testament of Judah 24:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἀνοιγήσονται ἐπ᾽ αὐτῷ¹⁰ οἱ οὐρανοὶ ἐκχέαι¹⁴ πνεῦμα¹⁵ εὐλογίαν πατρὸς ἁγίου¹⁶, καὶ αὐτὸς ἐκχέει ἐφ᾽ ὑμᾶς πνεῦμα χάριτος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/001.yaml
  text: He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.
translation:
  language: ko
  text: 그는 거룩하신 아버지의 복의 영을 그 위에 쏟아부으실 것이며, 그 자신도 여러분 위에 은혜의 영을 쏟아부으실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκχέαι / ἐκχέει
  english_pob_choice: pour out
  chosen_korean: 쏟아부으실
  alternatives_korean:
  - 부으실
  - 흘려보내실
  lexicon: ἐκχέω
  rationale: 두 번 반복되는 동사를 한국어에서도 ‘쏟아부으실’로 살려, 단순한 전달이 아니라 풍성하게 부어지는 이미지를 보존했습니다.
- source_word: πνεῦμα εὐλογίαν πατρὸς ἁγίου
  english_pob_choice: the spirit of the holy Father’s blessing
  chosen_korean: 거룩하신 아버지의 복의 영
  alternatives_korean:
  - 거룩하신 아버지의 축복의 영
  - 거룩하신 아버지의 복을 가져오는 영
  lexicon: πνεῦμα / εὐλογία / πατρός ἁγίου
  rationale: 영을 먼저 두고 뒤에 ‘복’을 연결해, 원문의 소유격 관계와 POB의 ‘blessing’을 함께 살렸습니다.
- source_word: ἐφ᾽ ὑμᾶς
  english_pob_choice: upon you
  chosen_korean: 여러분 위에
  alternatives_korean:
  - 너희에게
  - 너희 위에
  lexicon: ἐπί + accusative
  rationale: 대상 독자를 현대 한국어에서 자연스럽게 드러내면서도, 위에 부어지는 방향성을 유지했습니다.
- source_word: πνεῦμα χάριτος
  english_pob_choice: a spirit of grace
  chosen_korean: 은혜의 영
  alternatives_korean:
  - 은혜의 영
  - 은총의 영
  lexicon: πνεῦμα / χάρις
  rationale: χάρις를 POB 기본어인 ‘은혜’로 옮겨, 익숙한 교회 용어보다 원문의 직접성을 우선했습니다.
theological_decisions:
- issue: 첫 절반과 둘째 절반의 ‘영’ 표현이 같은 실체를 가리키는지 여부
  chosen_reading: 둘 다 ‘영’으로 유지하되, 앞은 ‘복의 영’, 뒤는 ‘은혜의 영’으로 구분했습니다.
  alternative_readings:
  - 앞은 ‘축복’, 뒤는 ‘성령’로 풀이
  - 두 표현을 하나의 설명문으로 합침
  rationale: 원문은 두 번의 πνεῦμα를 반복하면서 서로 다른 수식어를 붙여 구별하므로, 이를 평준화하지 않고 병렬 구조를 유지했습니다.
  doctrine_reference: 본문의 수사 구조와 성령론적 함의 보존
