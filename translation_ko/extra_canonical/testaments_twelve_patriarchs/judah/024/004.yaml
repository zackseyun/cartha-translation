    rationale: πυθμήν은 나무의 밑동·줄기·원줄기를 가리키는 용례가 기본이며, 이 구절에서는 ‘뿌리에서 생겨나는 한 줄기’라는 비유가 더 직접적입니다. ‘새싹’은 영어 audit trail의 shoot에는 맞지만 그리스어의 어휘 범위를 불필요하게 좁힙니다.
