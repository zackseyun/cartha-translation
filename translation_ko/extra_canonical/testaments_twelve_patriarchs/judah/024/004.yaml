  rationale: 원문 우선 원칙에 따라 πυθμήν의 식물 비유를 ‘한 줄기’로 조정하고, σκῆπτρον의 왕권적 의미를 ‘왕홀’로 명시했습니다. 미래 시제와 복수 2인칭 소유격은 유지했으며, 제공되지 않은 판본 주석의 내용을 추정하여 주석을 추가하지 않았습니다.
