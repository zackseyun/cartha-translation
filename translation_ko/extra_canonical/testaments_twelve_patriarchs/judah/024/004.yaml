  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/004.yaml
  text: Then the scepter of my kingdom will shine forth, and from your root a shoot will arise.
translation:
  language: ko
  text: 그때 내 왕국의 왕홀이 빛날 것이며, 너희의 뿌리에서 한 줄기가 생겨날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκῆπτρον βασιλείας μου
  english_pob_choice: the scepter of my kingdom
  chosen_korean: 내 왕국의 홀
  alternatives_korean:
  - 내 나라의 홀
  - 내 왕권의 지팡이
  - 내 왕국의 왕홀
  lexicon: σκῆπτρον
  rationale: σκῆπτρον은 통치 권위를 상징하는 ‘홀’이 자연스럽고, βασιλείας μου는 소유격을 살려 ‘내 왕국의’로 옮기는 것이 문맥에 맞습니다.
- source_word: ἀναλάμψει
  english_pob_choice: will shine forth
  chosen_korean: 빛나고
  alternatives_korean:
  - 환히 비치고
  - 빛을 발하고
  - 드러나고
  lexicon: ἀναλάμπω
  rationale: 미래적 개시와 चम김의 이미지를 함께 살리되, 한국어에서는 ‘빛나다’가 가장 직접적이고 자연스럽습니다.
- source_word: πυθμήν
  english_pob_choice: a shoot
  chosen_korean: 새싹
  alternatives_korean:
  - 움트는 순
  - 새순
  - 싹
  lexicon: πυθμήν
  rationale: 본문의 ‘뿌리에서’라는 배경과 결합될 때, POB의 revision처럼 ‘shoot’의 생장 이미지를 드러내는 ‘새싹’이 가장 적절합니다.
- source_word: ἀπὸ τῆς ῥίζης ὑμῶν
  english_pob_choice: from your root
  chosen_korean: 너희의 뿌리에서
  alternatives_korean:
  - 너희 뿌리로부터
  - 너희의 뿌리에서부터
  - 여러분의 뿌리에서
  lexicon: ῥίζα
  rationale: 출발점·근원을 나타내는 전치사구이므로 ‘-에서’가 자연스럽고, 복수 인칭을 살려 ‘너희의’로 옮겼습니다.
theological_decisions:
- issue: 왕권 상징의 보존
  chosen_reading: ‘홀’과 ‘왕국’의 이미지를 그대로 살려 통치의 상징성과 메시아적 예고를 약화시키지 않았습니다.
  alternative_readings:
  - ‘지팡이’로 완화하는 번역
  - ‘나라’로 일반화하는 번역
  rationale: 본절은 권력의 표지와 왕권의 출현을 시각적으로 드러내므로, 상징어를 평이한 일반어로 풀어버리면 원문의 힘이 약해집니다.
  doctrine_reference: 메시아적 왕권 표상
- issue: 생장 이미지의 구체화
  chosen_reading: πυθμήν을 ‘새싹’으로 옮겨 뿌리에서 솟는 새 생명의 이미지를 분명히 했습니다.
  alternative_readings:
  - ‘줄기’로 옮기는 번역
  - ‘줄기 같은 것’으로 중립화하는 번역
  rationale: English audit trail에서도 ‘stem’에서 ‘shoot’로 수정된 만큼, 본문이 의도하는 생장·발흥의 이미지를 한국어에서도 분명히 드러내는 것이 적합합니다.
  doctrine_reference: 예언적 재건 이미지
