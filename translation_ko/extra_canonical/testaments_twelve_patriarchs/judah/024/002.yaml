id: T12P.JUD.24.2
reference: Testament of Judah 24:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔσεσθε αὐτῷ εἰς υἱοὺς¹⁷ ἐν ἀληθείᾳ¹⁸, *καὶ πορεύεσθε¹⁸ ἐν προστάγμασιν¹⁹ αὐτοῦ πρώτοις καὶ ἐσχάτοις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/002.yaml
  text: And you will be to him sons in truth, and you will walk in his commandments, the first and the last.
translation:
  language: ko
  text: 그리고 여러분은 진실로 그에게 아들들이 될 것이며, 그의 처음 계명들과 마지막 계명들을 따라 살아갈 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς υἱοὺς ... ἐν ἀληθείᾳ
  english_pob_choice: sons in truth
  chosen_korean: 진실한 아들들
  alternatives_korean:
  - 참된 아들들
  - 진리 안에서의 아들들
  lexicon: υἱοὺς / ἀληθείᾳ
  rationale: εἰς는 여기서 목적·귀속의 방향을 나타내므로 단순히 ‘...에게’가 아니라 신분 변화의 결과를 살려 ‘진실한 아들들’로 옮겼습니다.
- source_word: προστάγμασιν
  english_pob_choice: commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 법도들
  lexicon: πρόσταγμα
  rationale: 영어 POB의 ‘commandments’를 따라, 도덕적·권위적 뉘앙스를 보존하면서도 현대 한국어에서 자연스러운 ‘명령들’을 사용했습니다.
- source_word: πρώτοις καὶ ἐσχάτοις
  english_pob_choice: the first and the last
  chosen_korean: 첫째 것과 마지막 것까지
  alternatives_korean:
  - 처음과 마지막
  - 첫 것과 끝 것
  lexicon: πρώτοις / ἐσχάτοις
  rationale: 그리스어의 관용적 대조를 살리되, 문맥상 ‘그 명령들의 전 범위’를 드러내기 위해 ‘까지’를 보완해 과도한 문자주의를 피했습니다.
theological_decisions:
- issue: ‘아들들’의 포괄적 호칭과 윤리적 순종의 관계
  chosen_reading: 여기서는 문자적 남성 복수 ‘아들들’을 유지해 문맥의 상속·언약적 언어를 보존했습니다.
  alternative_readings:
  - 자녀들
  - 아들 같은 사람들
  rationale: 원문 υἱοὺς를 성중립적으로 확장하면 상속/언약의 호칭성이 약화될 수 있어, 원문의 표현력을 우선했습니다.
  doctrine_reference: 언약 공동체의 표상 언어
- issue: ‘첫째 것과 마지막 것’의 범위 해석
  chosen_reading: 명령들의 전 범위를 가리키는 표현으로 읽어 한국어에서는 ‘까지’를 덧붙여 의미를 분명히 했습니다.
  alternative_readings:
  - 처음부터 끝까지
  - 처음과 마지막의 명령들
  rationale: 문자적 대응만으로는 한국어 독자가 ‘무엇의 첫째/마지막인지’ 불명확할 수 있어, 원문의 의미 범위를 보강했습니다.
  doctrine_reference: 문맥상 전면적 순종의 요청
