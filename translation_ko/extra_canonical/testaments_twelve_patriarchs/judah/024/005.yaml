  to: 그리고 그것으로부터 민족들을 위한 의의 지팡이가 돋아날 것이며, 주를 부르는 모든 사람을 심판하고 구원할 것입니다.
  rationale: The revision corrects the pronoun’s gender/referential force, renders the infinitival judge-and-save sequence without adding an intention nuance, and removes the unsupported footnote anchor. “돋아나다” retains βλαστήσει’s growth imagery, and the source’s ambiguity concerning the antecedent of αὐτῆς is not resolved beyond the English audit trail’s non-personal “it.”
  reviewer_model: gpt-5.6-terra
