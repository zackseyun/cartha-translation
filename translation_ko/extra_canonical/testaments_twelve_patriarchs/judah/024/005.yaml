id: T12P.JUD.24.5
reference: Testament of Judah 24:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἐξ αὐτῆς βλαστήσει²⁴ ῥάβδος δικαιοσύνης²⁵ τοῖς ἔθνεσι, *κρῖναι καὶ σῶσαι²⁶ πάντας τοὺς²⁷ ἐπικαλουμένους τὸν²⁸ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/005.yaml
  text: And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.
translation:
  language: ko
  text: 그리고 그것으로부터 민족들을 위한 의의 지팡이가 돋아날 것이며, 주를 부르는 모든 사람을 심판하고 구원할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστήσει ῥάβδος δικαιοσύνης
  english_pob_choice: will spring up a rod of righteousness
  chosen_korean: 의의 지팡이가 솟아날 것이니
  alternatives_korean:
  - 의의 막대가 자라날 것이니
  - 의로운 지팡이가 돋아날 것이니
  lexicon: βλαστήσει, ῥάβδος, δικαιοσύνη
  rationale: βλαστήσει는 단순 출현보다 ‘솟아나다/돋아나다’의 생장 이미지를 살리고, ῥάβδος는 왕권·통치의 상징성을 보존하면서도 한국어에서는 ‘지팡이’가 가장 자연스럽습니다. δικαιοσύνη는 프로젝트 기본어휘에 따라 ‘의’로 옮겼습니다.
- source_word: τοῖς ἔθνεσι
  english_pob_choice: for the nations
  chosen_korean: 민족들을 위한
  alternatives_korean:
  - 열방을 위한
  - 나라들을 위한
  lexicon: ἔθνη
  rationale: ἔθνη는 이 문맥에서 이방 민족들을 가리키므로, 문맥상 넓고 자연스러운 ‘민족들’이 적절합니다. ‘열방’은 가능하지만 현대 한국어에서는 다소 교회적입니다.
- source_word: κρῖναι καὶ σῶσαι
  english_pob_choice: to judge and to save
  chosen_korean: 심판하고 구원하려는 것입니다
  alternatives_korean:
  - 심판하며 구원하려는 것입니다
  - 판단하고 구원하려는 것입니다
  lexicon: κρίνω, σῴζω
  rationale: κρῖναι는 단순 판단이 아니라 종말론적/왕적 심판의 의미가 강하므로 ‘심판하다’가 적절하고, σῶσαι는 프로젝트 기본어휘에 따라 ‘구원하다’로 옮겼습니다.
- source_word: ἐπικαλουμένους τὸν Κύριον
  english_pob_choice: all who call upon the Lord
  chosen_korean: 주를 부르는 모든 사람
  alternatives_korean:
  - 주님을 부르는 모든 사람
  - 주의 이름을 부르는 모든 사람
  lexicon: ἐπικαλέομαι, κύριος
  rationale: ἐπικαλουμένους는 도움을 청하며 부르는 행위를 뜻하므로 ‘부르는’이 직역에 가깝고, κύριος는 본문상의 호칭으로 ‘주’를 유지했습니다. 한국어에서는 대상이 분명하므로 ‘사람’의 첨가가 자연스럽습니다.
theological_decisions:
- issue: 왕권적 상징인 ῥάβδος를 어떻게 살릴 것인가
  chosen_reading: ‘의의 지팡이’로 옮겨 통치와 권위의 이미지를 유지했습니다.
  alternative_readings:
  - ‘의의 막대’
  - ‘의의 홀’
  rationale: 이 구절은 메시아적 통치를 암시하므로, 단순한 도구보다 권위의 상징이 드러나도록 ‘지팡이’를 택했습니다. ‘홀’은 왕권 색채가 강하지만 원어의 일반적 ῥάβδος보다 해석이 앞섭니다.
  doctrine_reference: 메시아적 심판과 구원
- issue: κρῖναι καὶ σῶσαι의 결합을 어떻게 처리할 것인가
  chosen_reading: 심판과 구원을 함께 보존해, 메시아의 이중 사역을 드러냈습니다.
  alternative_readings:
  - 심판하고 구원하다를 약화해 ‘다스리다’로 통합
  - ‘판단하고 구원하다’로 중립화
  rationale: 원문은 동일한 대상에게 심판과 구원을 함께 귀속시키므로 둘 중 하나를 완화하면 의미가 손상됩니다. 따라서 두 동사를 모두 유지했습니다.
  doctrine_reference: 종말론적 심판과 구원
