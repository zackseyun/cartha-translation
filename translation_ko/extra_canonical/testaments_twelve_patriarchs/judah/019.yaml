  lexicon: LSJ
  rationale: 족장적 훈계의 직접 호칭을 살리면서도 현대 한국어에서 자연스럽고 품위 있게 들리는 호칭으로 옮겼습니다.
- source_word: φιλαργυρία
  english_pob_choice: the love of money
  chosen_korean: 돈을 사랑하는 것
  alternatives_korean:
  - 돈 사랑
  - 돈에 대한 탐욕
  - 탐욕
  lexicon: BDAG
  rationale: ‘은’/‘재물’보다 본문의 돈 사랑이라는 직역적 의미를 분명히 드러내고, 문장 안에서 행위 성격을 유지하기 위해 명사구로 처리했습니다.
- source_word: πρὸς
  english_pob_choice: leads to
  chosen_korean: …로 이끕니다
  alternatives_korean:
  - …을 향합니다
  - …로 향합니다
  - …에 이릅니다
  lexicon: LSJ
  rationale: 원문이 생략된 서술을 가진 방향성 표현이므로, 도덕적 귀결을 한국어에서 자연스럽게 보충하되 ‘toward’의 방향 감각을 유지했습니다.
- source_word: εἰδωλολατρίαν
  english_pob_choice: idolatry
  chosen_korean: 우상숭배
  alternatives_korean:
  - 우상 섬김
  - 우상에게 절함
  lexicon: BDAG
  rationale: 한국어 성경에서 널리 통용되는 용어를 쓰되, 본문이 지적하는 종교적·윤리적 죄성을 분명히 살렸습니다.
theological_decisions:
- issue: φιλαργυρία와 εἰδωλολατρίαν의 관계를 어떻게 표현할지
  chosen_reading: ‘돈을 사랑하는 것은 우상숭배로 이끕니다’라고 옮겨, 사랑이 우상숭배로 나아가는 도덕적 방향성을 드러냈습니다.
  alternative_readings:
  - ‘돈 사랑은 우상숭배입니다’
  - ‘돈 사랑은 우상숭배를 향합니다’
  rationale: 주어진 그리스어는 축약적이라 단정적 등치보다 방향성을 지닌 진술이 더 안전합니다. 본문이 경고하는 윤리적 긴장을 유지하기 위해 ‘이끕니다’를 택했습니다.
  doctrine_reference: 원문의 축약된 경구형을 그대로 드러내며, 해석을 과도하게 평탄화하지 않습니다.
