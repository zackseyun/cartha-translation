translation:
  language: ko
  text: '나의 자녀들아, 돈을 사랑하는 것은 우상숭배로 이끕니다.[a][b]


    2 돈 때문에 나는, 나의 자녀들아, 내 자녀들을 잃었습니다. 나의 회개와 겸손과 내 아버지의 기도들이 함께하지 않았더라면, 나는 자녀 없이 죽었을 것입니다.


    3 그러나 내 조상들의 하나님께서 나를 불쌍히 여기셨습니다. 이는 내가 이것을 알지 못하고 행하였기 때문입니다.


    4 미혹의 통치자가 나를 눈멀게 하였기 때문입니다. 나는 인간으로서, 또 죄들 가운데 타락한 육신으로서 알지 못했습니다. 내가 무적이라고 생각하였으나, 마침내 내 자신의 약함을 깨달았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 구절은 생략적입니다. 직역하면 ‘나의 자녀들아, 돈을 사랑하는 것은 우상숭배를 향하여’입니다. 번역은 암시된 도덕적 관계를 ‘우상숭배로 이끕니다’로 보충합니다.
    reason: textual_variant
  - marker: b
    text: 달리, ‘돈을 사랑하는 것은 우상숭배를 향하는 경향이 있습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
