  - 책망하며
  - 대적하며
  lexicon: BDAG
  rationale: 여기서는 단순한 비난보다 법정적 증언의 뉘앙스가 살아 있어야 하므로, 앞뒤의 심판 문맥과 함께 읽히도록 했습니다.
theological_decisions:
- issue: ‘두 영’의 성격
  chosen_reading: 진리와 미혹을 각각 실재적으로 작용하는 두 영으로 유지했습니다.
  alternative_readings:
  - 단순한 심리적 성향
  - 후대 체계신학적 의미의 천사/악마 존재
  rationale: 본문의 πνεύματα를 심리학적으로만 축소하지도, 특정 교리체계로 과도하게 규정하지도 않도록 했습니다.
  doctrine_reference: 본문의 도덕-영적 긴장을 그대로 보존
- issue: ‘얼굴을 들 수 없다’는 결말
  chosen_reading: 심판자 앞에 얼굴을 들 수 없습니다로 옮겼습니다.
  alternative_readings:
  - 심판자에게 나아갈 수 없습니다
  - 부끄러워할 수밖에 없습니다
  rationale: 영문 POB가 보존한 법정적·수치적 이미지를 유지하여, 내면의 불타는 정죄가 종결되는 장면을 분명히 했습니다.
  doctrine_reference: 양심의 증언과 심판의 형상 유지
