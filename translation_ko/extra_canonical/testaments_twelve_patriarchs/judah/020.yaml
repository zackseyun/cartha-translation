review_pass:
  verdict: revise
  source_fidelity: 현 초안은 두 영, 양심, 가슴에 기록됨, 심판자 앞에서 얼굴을 들지 못함이라는 큰 흐름은 보존합니다. 그러나 α-그리스어 본문 3절의 '각각의 영 안에서/각 영에 관하여 ... 사람들의 행위에 따라 알려진다'를 '진리와 미혹의 일들이 기록되어 있다'로 바꾸었고, 5절의 πάντων(모든 이들을) 및 ἐκ τῆς ἰδίας καρδίας(자기 자신의 마음으로 말미암아)를 충분히 반영하지 못했습니다. 4절은 전승 자체가 난해하므로, 영어 감사본의 매끄러운 재구성에 의존하지 않고 본문의 불확정성을 주석으로 밝혔습니다.
  naturalness: 합쇼체의 권면 문체로 자연스럽게 다듬었습니다. 특히 '원하는 쪽으로 기울어집니다'의 불분명한 주어를 '양심은 자기가 원하는 쪽으로 기울 수 있습니다'로 명시하고, 비문에 가까운 '자기 마음에 타 버리고'를 '자기 자신의 마음으로 말미암아 불타서'로 고쳤습니다.
  terminology: πνεύματα는 '두 영', πλάνη는 '미혹', συνείδησις는 '양심', στῆθος는 신체적 비유를 유지하여 '가슴', κατηγορεῖ는 법정 문맥에 맞추어 '고발합니다'로 옮겼습니다. '주님'은 κύριος의 호칭을 유지합니다.
  issues:
  - severity: high
    issue: 3절이 그리스어 α 본문의 진술을 영어 감사본의 확장된 형태로 대체합니다.
    rationale: α 본문은 사람들의 행위에 따라 '각각의 영 안에서/각 영에 관하여' 알려진다고 하고, 이어 그들의 뼈의 가슴에 주님에게서 기록되었다고 합니다. 초안의 '진리의 일들과 미혹의 일들' 및 '주님께서는 그 각각을 아십니다'는 이 본문에 직접적으로 없습니다.
  - severity: high
    issue: 5절의 '자기 마음에 타 버리고'는 격과 의미를 잘못 처리합니다.
    rationale: ἐκ τῆς ἰδίας καρδίας는 '자기 자신의 마음으로 말미암아'라는 원인·기원의 표현이며, ἐμπεπύρισται는 죄인이 불타는 상태에 놓였음을 뜻합니다.
  - severity: medium
    issue: 5절의 πάντων을 '모든 것에 대하여'로 옮겼습니다.
    rationale: 남성 복수 속격 πάντων은 문맥상 '모든 이들/모든 사람'을 가리키는 것이 자연스럽습니다.
  - severity: medium
    issue: 4절의 난해한 전승을 확정적인 '주님의 눈을 피할 수 없다'로 평탄화했습니다.
    rationale: 제시된 α 본문은 '사람들의 행위들이 사람을 붙잡을 수 있는 때'라는 어색한 문구를 보존합니다. 의미를 임의로 보정하지 않고, 번역은 가능한 한 보수적으로 두며 주석에서 난점을 밝혀야 합니다.
  revised_text: 1. 그러므로 내 자녀들아, 사람에게는 두 영이 함께하니, 곧 진리의 영과 미혹의 영이 있음을 알라. 2. 그 둘 사이에는 양심이 있으며, 양심은 자기가 원하는 쪽으로 기울 수 있습니다.[a] 3. 사람들의 행위에 따라 그 두 영 각각에서 그것이 드러나니, 주님에게서 그들의 뼈의 가슴에 기록되어 있기 때문입니다.[b] 4. 사람들의 행위들이 사람을 붙잡을 수 있는 때는 없으니, 그것들이 주님에게서 그들의 뼈의 가슴에 기록되어 있기 때문입니다.[c] 5. 진리의 영은 모든 이를 고발하며, 죄인은 자기 자신의 마음으로 말미암아 불타서 심판자 앞에 얼굴을 들 수 없습니다.
  revised_footnotes:
  - marker: a
    text: 그리스어는 직역하면 '그것이 원한다면 기울 수 있는 양심의 중간이 있다'입니다. 양심과 그 기울어짐의 관계를 표현하는 문장이 다소 압축되어 있습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어는 '그들 뼈의 가슴에'라고 하여 매우 이례적인 신체 비유를 사용합니다. 또한 '그 두 영 각각에서'라는 표현의 정확한 연결은 다소 불분명합니다.
    reason: textual_variant
  - marker: c
    text: 이 절의 그리스어는 '사람들의 행위들이 사람을 붙잡을 수 있는 때'라는 난해한 표현을 보존합니다. 일부 전승 및 영어 감사본은 이를 행위가 주님의 눈을 피할 수 없다는 뜻으로 더 매끄럽게 이해하지만, 여기서는 제시된 α 본문의 모호성을 유지했습니다.
    reason: alternative_reading
  revision_rationale: 원어 α 본문을 우선하여 3절의 확장된 영어식 표현을 제거하고, 4절의 난해한 문구를 교리적·해석적으로 보정하지 않았습니다. 5절에서는 '모든 이를 고발함'과 죄인이 자신의 마음으로 말미암아 불타는 인과 관계를 복원했습니다. 각주 표지는 해당 난점이 있는 절에 직접 붙였습니다.
