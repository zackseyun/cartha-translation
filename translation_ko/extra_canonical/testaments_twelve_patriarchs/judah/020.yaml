  - 사람을 따르며
  - 사람에게서 일하며
  lexicon: LSJ
  rationale: 직역하면 어색한 동사이므로, 두 영이 사람에게 수반되어 작용한다는 뜻을 자연스럽게 드러냈습니다.
- source_word: συνείδησις
