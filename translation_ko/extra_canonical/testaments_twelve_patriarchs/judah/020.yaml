  lexicon: LSJ
  rationale: 기록된 위치의 신체적 이미지를 살리되, 현대 한국어에서 가장 자연스러운 대응어를 택했습니다.
- source_word: κατηγορεῖ
  english_pob_choice: testifies against
  chosen_korean: 증언하며
  alternatives_korean:
