  - 두 기운
  - 두 성향
  lexicon: LSJ
  rationale: 본문이 단순한 심리 상태가 아니라 실제적인 도덕·영적 실재를 말하므로, ‘영’을 유지했습니다.
- source_word: σχολάζουσι τῷ ἀνθρώπῳ
