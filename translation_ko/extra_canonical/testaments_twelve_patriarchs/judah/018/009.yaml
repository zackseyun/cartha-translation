id: T12P.JUD.18.9
reference: Testament of Judah 18:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει³⁵, *καὶ Θεῷ ὑπακοῦσαι³⁶ οὐ δύναται³⁷, ὅτι ἐτύφλωσε³⁸ τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/009.yaml
  text: For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.
translation:
  language: ko
  text: 그는 서로 반대되는 두 가지 정욕에 종노릇을 하므로 하나님께 순종할 수 없습니다. 그 때문에 그의 영혼이 눈멀었고, 그는 낮에도 밤처럼 다닙니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δουλεύει
  english_pob_choice: is enslaved
  chosen_korean: 종되어 있습니다
  alternatives_korean:
  - 노예가 되어 있습니다
  - 사로잡혀 있습니다
  - 예속되어 있습니다
  lexicon: δουλεύω
  rationale: 영문 POB의 ‘enslaved’를 따라 단순한 내부 갈등이 아니라 지배와 예속의 상태를 드러내되, 본문이 비유적으로 말하는 점을 살려 ‘종되어 있습니다’로 옮겼습니다.
- source_word: πάθεσιν ἐναντίοις
  english_pob_choice: two contrary passions
  chosen_korean: 서로 հակ대되는 두 가지 정욕
  alternatives_korean:
  - 서로 상반되는 두 가지 정욕
  - 두 가지 서로 맞서는 욕망
  - 서로 반대되는 두 가지 감정
  lexicon: πάθος / ἐναντίος
  rationale: πάθη는 단순한 감정보다 욕정·정욕의 방향성이 강하므로 ‘정욕’으로, ἐναντίοις는 단순 차이가 아니라 서로 맞서는 성격을 살려 ‘서로 հակ대되는’으로 옮겼습니다.
- source_word: θεῷ ὑπακοῦσαι
  english_pob_choice: to obey God
  chosen_korean: 하나님께 순종할 수 없습니다
  alternatives_korean:
  - 하나님께 복종할 수 없습니다
  - 하나님께 순종하기를 할 수 없습니다
  - 하나님의 말씀에 순종할 수 없습니다
  lexicon: ὑπακούω
  rationale: 직접 목적어가 하나님이므로, 관계적·언약적 응답을 살려 ‘순종하다’를 택했습니다.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  english_pob_choice: they have blinded his soul
  chosen_korean: 그들이 그의 영혼을 눈멀게 했기 때문입니다
  alternatives_korean:
  - 그들이 그의 혼을 눈멀게 했기 때문입니다
  - 그들이 그의 영혼을 맹하게 했기 때문입니다
  - 그들이 그의 마음을 어둡게 했기 때문입니다
  lexicon: τυφλόω / ψυχή
  rationale: 원문의 ‘눈멀게 했다’는 이미지를 보존하고, ψυχή는 이 문맥에서 인격의 중심을 가리키므로 ‘영혼’으로 옮겼습니다.
theological_decisions:
- issue: 지배 상태를 나타내는 δουλεύω의 뉘앙스
  chosen_reading: 도덕적 약함이 아니라 두 정욕의 예속 상태로 읽고, ‘종되어 있습니다’로 표현했습니다.
  alternative_readings:
  - 단순히 ‘끌려 다닙니다’로 완화
  - ‘노예가 되어 있습니다’로 더 강하게 표현
  rationale: 문맥상 내적 분열을 넘어 타협 불가능한 지배를 말하므로, 예속의 강도를 유지하되 한국어에서 지나치게 현대적·사회적 함의를 덜어낸 표현을 택했습니다.
  doctrine_reference: anthropology
- issue: ‘그들이’의 복수 주어 처리
  chosen_reading: 눈멀게 한 주체를 복수로 유지했습니다.
  alternative_readings:
  - ‘그것이’로 중립화
  - ‘이 정욕들이’로 명시
  rationale: 그리스어 동사 ἐτύφλωσε와 영문 POB의 ‘they’가 복수적 원인을 전제하므로, 원문의 책임 소재를 흐리지 않도록 복수를 유지했습니다.
  doctrine_reference: source syntax
