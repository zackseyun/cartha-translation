  to: 그는 서로 반대되는 두 가지 정욕에 종노릇을 하므로 하나님께 순종할 수 없습니다. 그 때문에 그의 영혼이 눈멀었고, 그는 낮에도 밤처럼 다닙니다.
  rationale: 누락된 원문 절을 복원하고, 단수이면서 무주어인 ἐτύφλωσε에 복수 행위자를 부여하지 않도록 ‘그 때문에’라는 인과 표현으로 조정했습니다. 이는 정욕들과 눈멂의 연관을 유지하면서도 원문이 남긴 주어의 모호성을 보존합니다. 표기 오류를 바로잡고, 예속의 의미와 합쇼체 문체를 유지했습니다.
