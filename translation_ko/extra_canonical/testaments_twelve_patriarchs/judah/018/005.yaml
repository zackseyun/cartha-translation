id: T12P.JUD.18.5
reference: Testament of Judah 18:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε⁵ οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας⁷, καὶ ἀκούσατε⁸ Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/005.yaml
  text: Guard yourselves, therefore, my children, from sexual immorality and the love of money, and listen to Judah your father.
translation:
  language: ko
  text: 5. 그러므로 내 자녀들아, 음행과 돈을 사랑하는 일에서 너희 자신을 지키고, 너희 아버지 유다의 말을 들으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε οὖν
  english_pob_choice: Guard yourselves, therefore
  chosen_korean: 그러므로 … 너희 자신을 지키고
  alternatives_korean:
  - 그러므로 … 스스로를 지키고
  - 그러므로 … 몸을 지키고
  lexicon: φυλάσσω
  rationale: 원문의 중간태 명령형은 단순한 외적 감시보다 자기 보호의 뉘앙스가 있어, 합쇼체에서 자연스러운 반사적 표현으로 옮겼습니다.
- source_word: ἀπὸ τῆς πορνείας
  english_pob_choice: from sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 성적인 부정
  lexicon: πορνεία
  rationale: πορνεία의 넓은 도덕적·성적 타락 범위를 고려해, 한국어 성경 전통과도 호응하는 직접어 ‘음행’을 택했습니다.
- source_word: τῆς φιλαργυρίας
  english_pob_choice: the love of money
  chosen_korean: 돈을 사랑하는 일
  alternatives_korean:
  - 탐욕
  - 물욕
  lexicon: φιλαργυρία
  rationale: 직역형인 ‘돈 사랑’보다 한국어로 행위성을 드러내는 ‘돈을 사랑하는 일’이 원문의 품사를 더 자연스럽게 살립니다.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  english_pob_choice: Judah your father
  chosen_korean: 너희 아버지 유다
  alternatives_korean:
  - 유다 너희의 아버지
  - 아버지 유다
  lexicon: Ἰούδας
  rationale: 호격/서술의 관계를 한국어 어순에 맞춰 ‘너희 아버지 유다’로 옮겨, 친밀한 권고의 호칭을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 도덕 경고의 범위
  chosen_reading: ‘음행과 돈을 사랑하는 일’로 두 개의 구체적 위험을 병렬로 제시해, 성적 타락과 재물 집착을 함께 경계하는 본문 구조를 그대로 반영했습니다.
  alternative_readings:
  - ‘성적 부도덕과 탐욕’으로 일반화
  - ‘음행과 탐심’으로 축약
  rationale: 본문은 두 명사구를 병렬로 놓아 공동체 윤리의 두 축을 동시에 경고하므로, 한쪽을 추상화하지 않고 각각의 경고를 유지하는 편이 원문의 힘을 보존합니다.
  doctrine_reference: 지혜/권면 문헌의 도덕 훈계 구조
- issue: 명령형의 공손도
  chosen_reading: 직접 권고는 합쇼체를 유지하되, ‘너희 자신을 지키고’로 강한 경고의 긴박함을 살렸습니다.
  alternative_readings:
  - ‘지키십시오’의 단일 공손 명령
  - ‘조심하십시오’로 완화
  rationale: 원문은 아버지가 자녀들에게 주는 긴박한 훈계이므로, 공손한 현대 한국어이되 경고의 직접성을 희석하지 않는 형태가 적절합니다.
  doctrine_reference: 문체/화행 일치 원칙
