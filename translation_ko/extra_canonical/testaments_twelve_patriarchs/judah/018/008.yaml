  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/008.yaml
  text: They hinder the sacrifices of God, and do not remember the blessing of God. They do not listen when a prophet speaks, and resent words of godliness.
translation:
  language: ko
  text: 그는 하나님의 제사들을 방해하고, 하나님의 복을 기억하지 않습니다. 예언자가 말하는 것을 듣지 않고, 경건의 말을 못마땅해합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ
  english_pob_choice: the sacrifices of God
  chosen_korean: 하나님의 제사
  alternatives_korean:
  - 하나님께 드리는 제사
  - 하나님의 희생제사
  lexicon: Θυσία
  rationale: 제사의 대상 관계를 자연스럽게 드러내되, 본문이 말하는 예배 행위를 유지하기 위해 ‘제사’를 기본으로 옮겼습니다.
- source_word: ἐμποδίζει
  english_pob_choice: hinder
  chosen_korean: 방해하고
  alternatives_korean:
  - 막고
  - 저지하고
  lexicon: ἐμποδίζω
  rationale: 행동의 적극적 저지를 간결하게 살리기 위해 ‘방해하다’를 택했습니다.
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  english_pob_choice: They do not listen when a prophet speaks
  chosen_korean: 예언자가 말할 때 귀를 기울이지 않으며
  alternatives_korean:
  - 예언자가 말해도 듣지 않으며
  - 예언자의 말을 듣지 않으며
  lexicon: ἀκούω
  rationale: 단순 청각이 아니라 응답적 경청의 거부를 드러내기 위해 ‘귀를 기울이다’로 옮겼습니다.
- source_word: λόγους εὐσεβείας
  english_pob_choice: words of godliness
  chosen_korean: 경건의 말
  alternatives_korean:
  - 경건한 말
  - 경건의 말씀
  lexicon: εὐσέβεια
  rationale: εὐσέβεια의 추상명사 구조를 보존하면서도 한국어로는 자연스럽게 읽히도록 ‘경건의 말’로 옮겼습니다.
theological_decisions:
- issue: θεοῦ(하나님) 반복과 예언자 발화에 대한 태도
  chosen_reading: ‘하나님의 제사’, ‘하나님의 복’, ‘예언자가 말할 때’로 직역에 가깝게 유지해, 경건을 싫어하는 태도가 단순한 예절 문제가 아니라 하나님과 예언자에 대한 거부임을 분명히 했습니다.
  alternative_readings:
  - 예배
  - 축복
  - 예언자가 말할 때 말하지 않으며
  rationale: 본문의 도덕적·예언자적 긴장을 약화시키지 않기 위해 전통적 완곡어보다 원문이 지시하는 관계를 선명하게 드러냈습니다.
  doctrine_reference: 예언자적 권위와 하나님께 대한 순종
