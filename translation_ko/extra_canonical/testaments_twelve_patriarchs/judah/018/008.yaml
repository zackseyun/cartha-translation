  source_fidelity: 그리스어 본문에서 네 서술동사(ἐμποδίζει, μνημονεύει, ἀκούει, προσοχθίζει)는 모두 단수입니다. 따라서 복수 주어인 ‘그들은’은 원문 및 영어 POB의 복수화와 다르며, 한국어 번역에서는 단수로 바로잡는 것이 안전합니다. Θυσίας는 복수이므로 ‘제사들’을 반영해 ‘제사들을’로 옮겼습니다.
  naturalness: ‘예언자가 말할 때 귀를 기울이지 않으며’도 자연스럽지만, 분사구문 Προφήτου λαλοῦντος를 ‘예언자가 말하는 것을 듣지 않고’로 옮기면 원문의 결속을 더 직접적으로 반영합니다. προσοχθίζει는 단순한 기호상의 ‘싫어하다’보다 불쾌하게 여기거나 못마땅해하는 반응을 나타내므로 ‘못마땅해합니다’가 적절합니다.
  terminology: ‘하나님의 제사들’, ‘하나님의 복’, ‘예언자’, ‘경건의 말’은 원문의 어휘 관계를 보존합니다. εὐλογία는 여기서 ‘복/축복’ 모두 가능하나, 초안의 ‘복’을 유지했습니다. λόγους εὐσεβείας의 속격 관계를 보존하여 ‘경건의 말’을 사용했습니다.
  issues:
  - severity: high
    issue: 주어를 복수로 옮김
    rationale: 제시된 그리스어의 동사들이 일관되게 3인칭 단수인데 초안은 ‘그들은’ 및 복수 동사로 번역했습니다. 영어 POB의 최신 복수화와 달리, 원문 우선 원칙에 따라 단수로 번역해야 합니다.
  - severity: low
