    rationale: ‘하나님의 제사’도 집합명사로 가능하지만, 원문의 명시적 복수를 반영하는 ‘하나님의 제사들을’이 더 충실합니다.
  - severity: low
    issue: προσοχθίζει의 정서적 반감이 다소 약화됨
    rationale: ‘싫어합니다’는 가능하지만, 이 동사는 성가시게 여기고 불쾌해하는 뉘앙스를 지닙니다. ‘못마땅해합니다’가 문맥상 더 가깝습니다.
