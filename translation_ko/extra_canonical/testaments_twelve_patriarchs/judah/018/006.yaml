source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι¹⁰ ταῦτα¹¹ ἀφιστᾷ¹² τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ¹⁴ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν¹⁵ ἐκδιδάσκει, καὶ οὐκ ἀφίει¹⁶ ἄνδρα ἐλεῆσαι¹⁷ τὸν¹⁸ πλησίον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/006.yaml
  text: For these turn one away from the law of God, and blind the judgment of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor.
translation:
  language: ko
  text: 이것들은 사람을 하나님의 율법에서 멀어지게 하고, 영혼의 판단력을 눈멀게 하며, 교만을 가르치고, 사람이 자기 이웃에게 자비를 베풀지 못하게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ
  english_pob_choice: turn one away from the law of God
  chosen_korean: “하나님의 율법에서 멀어지게 하다”
  alternatives_korean:
  - “하나님의 법에서 떠나게 하다”
  - “하나님의 율법으로부터 돌아서게 하다”
  lexicon: νόμος
  rationale: 여기서는 토라/율법을 가리키므로 표준적으로 “율법”을 유지하고, ἀφιστᾷ는 단순 이동보다 관계적 이탈을 나타내어 “멀어지게 하다”로 옮겼습니다.
- source_word: τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς
  english_pob_choice: blind the judgment of the soul
  chosen_korean: “영혼의 판단을 눈멀게 하다”
  alternatives_korean:
  - “영혼의 분별을 흐리게 하다”
  - “영혼의 판단력을 어둡게 하다”
  lexicon: τυφλόω / διαβούλιον
  rationale: 개정된 POB의 ‘judgment’를 반영해 διαβούλιον을 목적이나 계획보다 판단/숙의로 이해했고, ‘눈멀게 하다’로 원문의 강한 은유를 살렸습니다.
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  english_pob_choice: teach arrogance
  chosen_korean: “교만을 가르치고”
  alternatives_korean:
  - “오만을 가르치고”
  - “거만함을 가르치고”
  lexicon: ὑπερηφανία
  rationale: ὑπερηφανία는 도덕적 태도인 교만/오만을 뜻하므로, 문맥상 가장 직설적인 “교만”을 택했습니다.
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  english_pob_choice: show mercy to his neighbor
  chosen_korean: “자기 이웃에게 자비를 베풀다”
  alternatives_korean:
  - “자기 이웃을 불쌍히 여기다”
  - “자기 이웃에게 긍휼을 보이다”
  lexicon: ἐλεέω / πλησίον
  rationale: ἐλεῆσαι는 단순 감정이 아니라 실제적 자비의 행위를 뜻하므로 “자비를 베풀다”로 옮겼고, πλησίον은 일반적 ‘이웃’으로 유지했습니다.
theological_decisions:
- issue: ‘하나님의 율법’의 범주
  chosen_reading: 이 구절의 νόμος는 추상적 ‘법’이 아니라 하나님께 속한 규범으로서의 율법으로 읽었습니다.
  alternative_readings:
  - “하나님의 법”
  - “하나님의 원리”
  rationale: 문맥이 도덕적 타락을 경고하는 유대적 윤리 진술이므로, 독자가 토라적 배경을 놓치지 않도록 ‘율법’을 유지하는 것이 가장 분명합니다.
  doctrine_reference: Torah / biblical ethics
