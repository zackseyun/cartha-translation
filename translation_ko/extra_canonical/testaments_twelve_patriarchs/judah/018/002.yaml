  text: Therefore I never grieved Jacob my father, for I did everything he told me.
translation:
  language: ko
  text: 나는 내 아버지 야곱의 마음을 결코 아프게 하지 않았습니다. 그가 내게 말한 모든 것을 행했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρελάλησα
  english_pob_choice: grieved
  chosen_korean: 불평하지 않았습니다
  alternatives_korean:
  - 근심하게 하지 않았습니다
  - 마음 아프게 하지 않았습니다
  - 괴롭히지 않았습니다
  lexicon: παραλαλέω
  rationale: 문맥상 단순한 ‘말하다’보다 아버지를 거슬러 속상하게 하거나 불만을 표하지 않았다는 의미가 강하므로, 한국어로는 관계적 갈등을 드러내는 ‘불평하다’를 택했습니다.
- source_word: Ἰακὼβ τὸν πατέρα μου
  english_pob_choice: Jacob my father
  chosen_korean: 야곱, 곧 내 아버지
  alternatives_korean:
  - 내 아버지 야곱
  - 야곱 내 아버지
  lexicon: Ἰακώβ + apposition
  rationale: ‘야곱’과 ‘내 아버지’가 같은 대상을 가리키는 동격이므로, 쉼표와 ‘곧’을 넣어 한국어에서 자연스럽게 동격 관계를 드러냈습니다.
- source_word: πάντα ὅσα μοι ἔλεγεν ἐποίουν
  english_pob_choice: I did everything he told me
  chosen_korean: 그의 모든 말을 내가 다 행했습니다
  alternatives_korean:
  - 그가 내게 말한 것은 모두 내가 행했습니다
  - 그가 내게 이르는 모든 것을 내가 다 했습니다
  lexicon: ποιοῦν / λέγειν
  rationale: 원문은 ‘그가 내게 말한 모든 것’을 ‘행했다’는 뜻이므로, 명령을 실행하는 뉘앙스를 살려 ‘말을 행하다’보다 자연스러운 ‘말을 다 행하다’로 옮겼습니다.
theological_decisions:
- issue: 원문의 ὅτι 절이 이유를 나타내는지 설명을 붙이는지
  chosen_reading: ‘기 때문입니다’로 인과를 살려, 앞절의 부정 진술이 왜 가능한지를 분명히 했습니다.
  alternative_readings:
  - ‘…했습니다. 그는 내게 말한 모든 것을 내가 다 했습니다.’처럼 단순 병렬
  - ‘…했습니다. 왜냐하면…’ 식의 설명적 연결
  rationale: English POB의 ‘for’와 원문의 ὅτι는 이유 제시로 읽히므로, 한국어에서도 원인-결과 관계를 분명히 해야 문장의 힘이 살아납니다.
  doctrine_reference: 문맥 인과 접속
