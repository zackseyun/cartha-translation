  text: Ἐγὼ⁴ *οὐδέποτε²⁰ *παρελάλησα Ἰακὼβ τὸν πατέρα μου²¹, ὅτι²² πάντα *ὅσα μοι ἔλεγεν²³ ἐποίουν²⁴.
