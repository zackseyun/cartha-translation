  source_fidelity: παρελάλησα를 ‘불평하지 않았다’로 옮기면 화자의 불평 행위에 초점이 놓이고, 목적어인 ‘야곱, 내 아버지’를 직접적으로 괴롭게 하거나 마음 아프게 하지 않았다는 문맥 및 영어 감사본의 ‘grieved’를 충분히 반영하지 못합니다. 또한 원문에는 ‘그러므로’에 해당하는 접속사가 없습니다.
  naturalness: ‘그의 모든 말을 내가 다 행했습니다’도 이해되지만, ‘그가 내게 말한 모든 것을 행했습니다’가 수식 관계가 더 분명하고 현대 한국어에서 자연스럽습니다. ‘내 아버지 야곱’은 자연스러운 동격 표현입니다.
  terminology: 인명 ‘야곱’은 적절합니다. 관계 동사는 ‘마음을 아프게 하다’로 조정하여 원문의 관계적 의미와 영어 POB 감사본의 의미를 보존합니다.
