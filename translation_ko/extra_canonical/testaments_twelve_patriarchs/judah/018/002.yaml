    rationale: 이 문장은 야곱을 결코 ‘grieve’하지 않았다는 진술이며, 뒤의 전면적 순종이 그 근거로 제시됩니다. ‘마음을 아프게 하지 않았다’가 이 관계적 의미를 더 잘 전달합니다.
