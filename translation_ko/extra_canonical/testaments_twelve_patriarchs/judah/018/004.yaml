  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/004.yaml
  text: And I know what evils you will do in the last days.
translation:
  language: ko
  text: 그리고 나는 너희가 마지막 날들에 어떤 악들을 행할지 알고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνωκα
  english_pob_choice: I know
  chosen_korean: 알고 있습니다
  alternatives_korean:
  - 압니다
  - 알고 있었습니다
  lexicon: γινώσκω
  rationale: 완료형 동사이지만 현재의 확정된 인식을 나타내므로, 합쇼체의 자연스러운 현재형 ‘알고 있습니다’로 옮겼습니다.
- source_word: ὅσα κακὰ
  english_pob_choice: what evils
  chosen_korean: 어떤 악들을
  alternatives_korean:
  - 무슨 악들을
  - 얼마나 많은 악들을
  lexicon: ὅσος / κακός
  rationale: ὅσα는 ‘무엇이든/어떤 것들을’의 범주를 가리키므로, 단순히 ‘악’이 아니라 행위들로 드러나는 복수성을 살려 ‘어떤 악들을’로 번역했습니다.
- source_word: ποιήσετε
  english_pob_choice: you will do
  chosen_korean: 행할지
  alternatives_korean:
  - 하실지
  - 저지를지
  lexicon: ποιέω
  rationale: 도덕적 악행의 결과를 강조하므로 중립적 ‘하다’보다 ‘행하다’를 택했습니다.
- source_word: ἐν [ταῖς ἐσχάταις ἡμέραις]
  english_pob_choice: in the last days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 끝날들에
  - 말세에
  lexicon: ἐσχάται ἡμέραι
  rationale: 본문의 시간표현을 직역하면서도 한국어에서 자연스러운 복수형 ‘날들’을 유지해 원문의 강조를 반영했습니다.
theological_decisions:
- issue: 미래의 악행을 아는 화자의 확언
  chosen_reading: 화자는 장차 일어날 악행을 이미 알고 있다고 확정적으로 말합니다.
  alternative_readings:
  - 예언적 통찰의 일반적 표현으로 완화해서 읽을 수 있음
  - 단순한 예견이 아니라 심판적 지식으로 볼 수 있음
  rationale: 영어 POB의 ‘I know’와 그리스어 완료형 ἔγνωκα는 단순 추측보다 확정된 인식을 드러내므로, 이를 약화하지 않고 직설적으로 살렸습니다.
  doctrine_reference: 예언/지식의 확정성
