id: T12P.JUD.18.7
reference: Testament of Judah 18:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει¹⁹ τὴν ψυχὴν αὐτοῦ²⁰ ἀπὸ πάσης ἀγαθότητος²¹, καὶ συνέχει αὐτὸν²² ἐν²³ πόνοις καὶ μόχθοις²⁴, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ²⁵, καὶ καταδαπανᾷ²⁷ τὰς σάρκας αὐτοῦ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/007.yaml
  text: It deprives his soul of every goodness, and holds him fast in pains and labors; it drives sleep away from him, and consumes his flesh.
translation:
  language: ko
  text: 그것은 그의 영혼에서 모든 선함을 빼앗고, 그를 고통과 수고에 붙들어 두며, 그에게서 잠을 쫓아내고, 그의 살을 소모합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος
  english_pob_choice: It deprives his soul of every goodness
  chosen_korean: 그의 혼을 온갖 선함에서 빼앗고
  alternatives_korean:
  - 그의 영혼을 모든 선함에서 빼앗고
  - 그의 생명을 온갖 선함에서 박탈하고
  lexicon: ψυχή → 혼; ἀγαθότης → 선함
  rationale: ψυχή는 여기서 단순한 ‘생명’보다 인격의 내적 실체를 가리키는 말로 보이므로, 교회적 고정어인 ‘영혼’보다 원문 감각을 살려 ‘혼’을 택했습니다. ἀγαθότης는 추상적 ‘선함’으로 옮기는 것이 자연합니다.
- source_word: συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις
  english_pob_choice: holds him fast in pains and labors
  chosen_korean: 고통과 수고 가운데 그를 붙들며
  alternatives_korean:
  - 고통과 수고 속에 그를 억누르며
  - 고통과 수고에 그를 매어 두며
  lexicon: συνέχει → 붙들다; πόνοις καὶ μόχθοις → 고통과 수고
  rationale: συνέχει는 단순히 ‘가두다’보다 계속적으로 붙들어 매는 힘을 나타내므로 ‘붙들다’로 옮겼습니다. πόνοις와 μόχθοις는 의미가 겹치지만 둘 다 보존하기 위해 ‘고통과 수고’로 병렬했습니다.
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  english_pob_choice: it drives sleep away from him
  chosen_korean: 그에게서 잠을 쫓아내고
  alternatives_korean:
  - 그에게서 잠을 몰아내고
  - 잠이 그에게서 떠나게 하고
  lexicon: ὕπνος → 잠; ἐκδιδάσκω → 쫓아내다
  rationale: 문맥상 ‘가르치다’의 직역이 아니라 ‘밖으로 몰아내다’는 뜻이므로, 한국어에서는 자연스럽고 강한 동작성을 살려 ‘쫓아내다’로 옮겼습니다.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  english_pob_choice: consumes his flesh
  chosen_korean: 그의 살을 소모합니다
  alternatives_korean:
  - 그의 살을 먹어 없앱니다
  - 그의 육체를 소진합니다
  lexicon: σάρξ → 살; καταδαπανάω → 소모하다
  rationale: σάρξ를 여기서는 신학적 ‘육신’보다 문자적인 ‘살’로 보존하는 편이 원문 충격을 더 직접적으로 전달합니다. καταδαπανάω는 ‘완전히 소모하다’의 뜻이므로 ‘소모하다’가 가장 근접합니다.
theological_decisions:
- issue: ψυχή의 번역어 선택
  chosen_reading: ‘혼’으로 옮겨 내적 존재의 소모를 드러냈습니다.
  alternative_readings:
  - ‘영혼’
  - ‘생명’
  rationale: 이 구절은 육체적 쇠약과 병행하여 인간 내면 전체의 황폐화를 말하므로, 한국어 교회어 ‘영혼’보다 원문에 더 가까운 중립적 표현인 ‘혼’을 사용했습니다.
  doctrine_reference: 인간론/심리적-영적 내면성
- issue: σάρξ의 직역성 유지
  chosen_reading: ‘살’로 옮겨 신체적 소진의 이미지를 보존했습니다.
  alternative_readings:
  - ‘육체’
  - ‘몸’
  rationale: 문맥상 신학적 대조보다 신체의 실제적 마모를 강조하므로, 전통적 신학어 ‘육체’보다 원문 감각이 강한 ‘살’이 적절합니다.
  doctrine_reference: 인간의 신체성과 고난의 묘사
