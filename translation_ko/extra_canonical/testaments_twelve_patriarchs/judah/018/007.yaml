    rationale: 원문은 ‘그의 영혼을 모든 선함으로부터 박탈한다’는 구조입니다. 초안의 ‘혼을 선함에서 빼앗다’는 영혼 자체를 선함으로부터 떼어 낸다는 뜻으로도 읽힙니다. ‘영혼에서 모든 선함을 빼앗다’로 고치면 박탈되는 것이 선함임을 분명히 합니다.
  - severity: low
    issue: ‘혼’은 현대 표준 성서 문체에서 덜 자연스럽습니다.
    rationale: 교리적 의미를 과도하게 부여하지 않으면서 ψυχή의 인격적 내면성을 전달하는 일반적 표현은 ‘영혼’입니다.
