  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ Ἀβραὰμ²⁵ ὁ πρόπατός μου²⁶ εὐλόγησέ²⁷ με βασιλεύειν ἐν Ἰσραήλ²⁸, *καὶ Ἰακὼβ εὐλόγησέ με οὕτως³⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/003.yaml
  text: And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me likewise.
translation:
  language: ko
  text: 그리고 내 조상 아브라함은 나에게 이스라엘에서 다스리게 하도록 복을 주었고, 야곱도 나에게 그렇게 복을 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρόπατός μου
  english_pob_choice: my forefather
  chosen_korean: 내 조상
  alternatives_korean:
  - 내 선조
  - 내 전조
  lexicon: 족보/친족 표현
  rationale: 직역하면 ‘나의 이전 조상’에 가깝지만, 한국어에서는 혈통상 선조를 뜻하는 ‘조상’이 자연스럽고, 문맥상 아브라함과 야곱을 가리키므로 관계를 분명히 했습니다.
- source_word: εὐλόγησέ με
  english_pob_choice: blessed me
  chosen_korean: 나에게 복을 주었습니다
  alternatives_korean:
  - 나를 축복하였습니다
  - 나에게 축복하였습니다
  lexicon: 동사-축복
  rationale: 본문의 동작은 단순한 덕담이 아니라 실제로 복을 선포하는 의미이므로, 한국어 성경체에서 자연스러운 ‘복을 주다’로 옮겼습니다.
- source_word: βασιλεύειν ἐν Ἰσραήλ
  english_pob_choice: to reign in Israel
  chosen_korean: 이스라엘에서 다스리게 하도록
  alternatives_korean:
  - 이스라엘에서 통치하게 하도록
  - 이스라엘 위에 왕노릇하게 하도록
  lexicon: 동사-통치
  rationale: βασιλεύειν은 ‘왕으로 다스리다/통치하다’의 의미이므로, 과도하게 현대화하지 않으면서도 왕권의 함의를 살려 ‘다스리게 하다’로 표현했습니다.
- source_word: οὕτως
  english_pob_choice: likewise
  chosen_korean: 그렇게
  alternatives_korean:
  - 그와 같이
  - 마찬가지로
  lexicon: 부사-비교
  rationale: 영문 POB의 ‘likewise’를 따라 앞절과 같은 방식의 복을 가리키는 말로 처리했고, 한국어에서는 반복을 줄이기 위해 ‘그렇게’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 복의 내용이 단순한 개인적 호의인지, 왕권 부여인지
  chosen_reading: 아브라함과 야곱의 복은 나를 이스라엘에서 다스리게 하는 왕권적 복으로 제시됩니다.
  alternative_readings:
  - 단순히 성공이나 번영을 빌어 주는 말로 볼 수 있습니다.
  rationale: 본문은 εὐλόγησέ με 뒤에 βασιλεύειν ἐν Ἰσραήλ를 직접 붙여 복의 구체적 내용을 왕권으로 규정하므로, 그 연결을 한국어에서도 분명히 드러냈습니다.
  doctrine_reference: 본문 내부 의미 연결
