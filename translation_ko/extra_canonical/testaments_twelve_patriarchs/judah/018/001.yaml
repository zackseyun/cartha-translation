  chosen_korean: 호의
  alternatives_korean:
  - 은혜
  - 은총
  - 은혜로움
  lexicon: ἣν (antecedent in context)
  rationale: 문맥상 어떤 ‘주신 것’을 가리키는 대명사 뒤에 오는 실질 내용으로 ‘호의’가 가장 직접적이며, 본문이 특정 신학 용어로 고정되지 않도록 했습니다.
