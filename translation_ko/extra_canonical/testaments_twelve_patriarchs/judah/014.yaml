- from: '이 두 가지는 사람의 마음을 돌이키게 합니다[a]. 포도주를 취하도록 마시면, 그것이 여러분의 마음을 혼란하게 하여 더러운 생각을 일으키고, 몸을 쾌락을 향해 달아오르게 하여 성적 부도덕으로 이끌며, 죄를 짓고도 부끄러워하지 않게 합니다.


    포도주를 마시는 자는 이와 같으니, 내 자녀들아, 술에 취한 사람은 아무에게도 마음을 두지 않기 때문입니다. 보십시오, 그것은 나도 길을 벗어나게 하여, 내가 도시의 많은 사람들 앞에서 부끄러워하지 않게 만들었습니다. 모든 사람의 눈앞에서 내가 다말에게로 돌이켜, 큰 죄를 지었고, 내 아들들의 부정의 덮개를 벗겨 놓았습니다.


    포도주를 마신 뒤에는 내가 하나님의 명령을 부끄러워하지 않았고, 가나안 여자를 아내로 맞이했습니다. 포도주를 마시는 자는 내 자녀들아, 많은 분별이 필요합니다. 이것이 포도주를 마시는 지혜입니다. 아직 부끄러움을 지니고 있는 동안에는 마셔야 합니다. 그러나 그 한도를 넘기면, 미혹의 영이 그의 마음에 들어와 술 취한 사람으로 하여금 부끄럽게 말하게 하고, 법을 어기게 하고, 부끄러움을 느끼지 않게 할 뿐 아니라, 자기의 수치를 자랑하며 그것을 좋다고 여기게 합니다.[b][c]'
