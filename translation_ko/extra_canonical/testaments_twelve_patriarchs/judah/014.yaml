  naturalness: ‘아무에게도 마음을 두지 않는다’와 ‘하나님의 명령을 부끄러워하지 않았다’는 현대 한국어에서 각각 의미와 결합이 부자연스럽습니다. 이를 ‘아무도 아랑곳하지 않는다’와 ‘하나님의 계명을 어긴 일을 부끄러워하지 않았다’로 문맥상 명료하게 조정했습니다. 호칭과 서술은 현대 표준어 합쇼체로 통일했습니다.
