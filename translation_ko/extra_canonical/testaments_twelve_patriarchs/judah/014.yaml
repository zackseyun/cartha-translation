base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014.yaml
  text: 'These two things turn away a man''s mind[a]. For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.


    Such is the wine-drinker, my children, because the one who gets drunk has regard for no one. For see, it also led me astray, so that I was not ashamed before the multitude of the city. In the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.


    After drinking wine, I was not ashamed of the commandment of God, and I took a Canaanite woman. For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink. But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and feel no shame[c][b], but even boast in his dishonor and think it good.'
  footnotes:
  - marker: a
    text: Or 'I exposed the shameful covering of my sons.' The Greek phrase is difficult and may refer to bringing family uncleanness into the open through Judah's sin with Tamar.
    reason: lexical_alternative
  - marker: b
    text: The wording 'as long as he still has shame, let him drink' presents moderation in terms of retained self-restraint; the point is that once shame is lost, drunkenness has overtaken him.
    reason: cultural_note
  - marker: c
    text: Or 'a spirit of error enters his mind.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이제 내 자녀들아, 내가 너희에게 말합니다. 포도주에 취하지 마십시오. 포도주는 마음을 진리에서 빗나가게 하고, 욕망의 격분을 일으키며, 눈을 미혹으로 이끕니다.


    음행의 영은 마음의 쾌락을 위하여 포도주를 종처럼 사용합니다. 참으로 이 두 가지가 사람의 분별력을 빼앗습니다. 누가 포도주를 취하도록 마시면, 포도주가 더러운 생각으로 그의 마음을 어지럽히고, 그의 몸을 쾌락을 향해 달아오르게 하여 음행에 이르게 합니다. 그러면 그는 죄를 짓고도 부끄러워하지 않습니다.


    포도주에 빠진 사람은 이와 같으니, 내 자녀들아, 술에 취한 사람은 아무도 아랑곳하지 않기 때문입니다. 보십시오, 포도주가 나도 미혹하여, 내가 도시의 군중 앞에서 부끄러워하지 않았습니다. 모든 사람의 눈앞에서 내가 다말에게로 돌아섰고, 큰 죄를 지었으며, 내 아들들의 부정의 덮개를 드러냈습니다[a].


    포도주를 마시고 나는 하나님의 계명을 어긴 일을 부끄러워하지 않았으며, 가나안 여자를 아내로 맞이했습니다. 내 자녀들아, 포도주를 마시는 사람에게는 많은 분별이 필요합니다. 이것이 포도주를 마시는 데 필요한 분별입니다. 그가 아직 부끄러움을 지니고 있는 동안에는 마십니다[b]. 그러나 그 한계를 넘어서면, 미혹의 영이 그의 마음에 들어와 술에 취한 사람이 수치스러운 말을 하고, 율법을 어기며, 부끄러워하지 않을 뿐 아니라, 자기의 수치를 자랑하고 그것을 좋다고 여기게 합니다[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아들들의 수치스러운 덮개를 드러냈습니다.’ 그리스어 표현은 난해합니다. 유다의 다말과의 죄로 말미암아 가족의 부정이 드러난 일을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어는 ‘그가 아직 부끄러움을 지니고 있는 동안에는 마신다’라고 직설법으로 되어 있습니다. 부끄러움과 자제력을 잃기 전까지만 마신다는 절제의 격언으로 이해될 수 있습니다.
    reason: grammatical_note
  - marker: c
    text: 또는 ‘오류의 영’.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάνοια
  english_pob_choice: understanding
  chosen_korean: 분별
  alternatives_korean:
  - 이해
  - 마음
  - 생각
  lexicon: LSJ
  rationale: 이 문맥에서 διάνοια는 단순한 인지보다 절제와 판단 능력을 가리키므로, 앞뒤의 음주 경계에 맞는 ‘분별’로 옮겼습니다.
- source_word: οὐκ αἰδεῖται οὐδένα
  english_pob_choice: has regard for no one
  chosen_korean: 아무에게도 마음을 두지 않기
  alternatives_korean:
  - 아무도 존중하지 않기
  - 아무에게도 부끄러워하지 않기
  lexicon: LSJ
  rationale: 이 표현은 단지 예의 문제가 아니라 타인에 대한 배려와 사회적 제약의 상실을 뜻하므로, 의미를 넓게 살린 표현을 택했습니다.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  english_pob_choice: throws your mind into turmoil with filthy thoughts
  chosen_korean: 마음을 혼란하게 하여 더러운 생각을 일으키고
  alternatives_korean:
  - 마음을 소란하게 하여 음란한 욕망을 불러일으키고
  - 마음을 뒤흔들어 추한 생각을 넣고
  lexicon: LSJ
  rationale: ‘더러운 생각’은 영어 POB의 도덕적 뉘앙스를 유지하면서도, 뒤따르는 성적 부도덕과 자연스럽게 연결되도록 했습니다.
- source_word: πνεῦμα τῆς πλάνης
  english_pob_choice: a spirit of deception
  chosen_korean: 미혹의 영
  alternatives_korean:
  - 속임의 영
  - 오류의 영
  lexicon: BDAG
  rationale: 영의 인격화는 유지하되, 한국어에서 더 자연스럽고 문맥의 도덕적 미혹을 잘 드러내는 표현으로 옮겼습니다.
- source_word: αἰσχρορημονεῖν
  english_pob_choice: speak shamefully
  chosen_korean: 부끄럽게 말하게
  alternatives_korean:
  - 추잡하게 말하게
  - 음란한 말을 하게
  lexicon: LSJ
  rationale: 희귀 동사의 핵심은 수치스러운 언사이므로, 본장의 ‘부끄러움’ 어휘를 살려 번역했습니다.
theological_decisions:
- issue: 저자의 자기고백 속 난해한 구절 ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  chosen_reading: ‘내 아들들의 부정의 덮개를 벗겨 놓았습니다’로 비교적 직역하여 이미지의 난해함을 유지했습니다.
  alternative_readings:
  - ‘내 아들들의 수치스러운 덮개를 드러냈습니다’
  - ‘내 아들들의 부정을 세상에 드러냈습니다’
  rationale: 원문은 비유적으로 모호하므로, 의미를 지나치게 풀어 쓰기보다 독자가 본문 자체의 긴장을 보도록 두는 것이 더 투명합니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: 음주의 경계선에 대한 훈계와 ‘부끄러움’의 역할
  chosen_reading: ‘아직 부끄러움을 지니고 있는 동안에는 마셔야 합니다’로 번역하여 절제의 기준을 부끄러움으로 제시했습니다.
  alternative_readings:
  - ‘절도를 지키는 동안에는 마셔도 됩니다’
  - ‘스스로를 제어할 수 있을 때만 마셔야 합니다’
  rationale: 문맥은 단순한 허용이 아니라, 부끄러움이 사라질 때 이미 절제가 무너진 상태임을 가르치므로 이 긴장을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
