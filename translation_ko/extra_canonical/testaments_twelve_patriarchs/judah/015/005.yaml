revisions:
- from: 그리고 하나님의 천사가 내게 보여 주었는데, 여자들이 왕과 가난한 자를 막론하고 다스리며, 여자는 왕의 영광과 강한 남자의 힘, 그리고 가난한 자의 가장 작은 버팀목을 빼앗아 갑니다.[a]
  to: 그리고 하나님의 천사가 내게 보여 주었습니다. 여자들은 왕에게 권세를 행사하고 가난한 자를 지배합니다. 그들은 왕에게서 영광을, 남자에게서 힘을, 가난한 처지에서 의지하는 가장 작은 버팀목을 빼앗습니다.
  rationale: 원문의 두 지배 동사와 세 병렬 목적어를 보존했습니다. 영어 POB의 'forever'는 그리스어 제시 본문에 상응하는 표현이 없으므로 넣지 않았습니다. 마지막 구문은 전승된 그리스어의 문법이 다소 거칠지만, 본문 의미를 과도하게 확정하지 않으면서 πτωχείας와 ἐλάχιστον을 모두 반영하도록 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:08Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 '강한 남자'라고 하여 τοῦ ἀνδρός(남자의)를 '강한 남자'로 한정하고, κρατοῦσι와 κατακυριεύουσι의 두 지배 동사를 하나로 평준화합니다. 또한 πτωχείας가 가리키는 가난의 상황을 충분히 드러내지 못합니다.
  naturalness: 합쇼체는 대체로 자연스럽지만, '여자들이 ... 다스리며, 여자는'은 주어와 시제가 혼재합니다. 절을 나누고 대명사로 이어 주면 더 자연스럽고 분명합니다.
  terminology: ἄγγελος τοῦ Θεοῦ는 '하나님의 천사', δόξα는 '영광', δύναμις는 문맥상 '힘', στήριγμα는 '버팀목'으로 옮기는 것이 적절합니다. 여성 일반을 가리키는 αἱ γυναῖκες는 '여자들'로 유지합니다.
  issues:
  - severity: medium
    issue: '''강한 남자'''
    rationale: 그리스어는 τοῦ ἀνδρὸς τὴν δύναμιν, 곧 '남자의 힘'이라고 하며, ἀνήρ 자체에 '강한'이라는 수식은 없습니다.
  - severity: medium
    issue: 두 지배 동사의 평준화
    rationale: κρατοῦσι(왕에게 권세를 행사하다)와 κατακυριεύουσιν(가난한 자를 지배하다)이 각각 쓰였으므로, 한국어에서도 최소한 별개의 동사로 반영하는 편이 원문에 가깝습니다.
  - severity: low
    issue: 주어·종결 혼재
    rationale: '''여자들이 ... 다스리며, 여자는 ... 빼앗아 갑니다''는 복수/단수 주어가 섞이고 연결형과 종결형이 혼재합니다.'
  - severity: low
    issue: πτωχείας의 의미 약화
    rationale: 문법적으로 다소 거친 전승 형태이지만 πτωχείας는 가난의 처지와 관련된 버팀목을 나타냅니다. '가난한 자의 가장 작은 버팀목'보다 '가난한 처지에서 의지하는 가장 작은 버팀목'이 이를 더 분명히 합니다.
  revised_text: 그리고 하나님의 천사가 내게 보여 주었습니다. 여자들은 왕에게 권세를 행사하고 가난한 자를 지배합니다. 그들은 왕에게서 영광을, 남자에게서 힘을, 가난한 처지에서 의지하는 가장 작은 버팀목을 빼앗습니다.
