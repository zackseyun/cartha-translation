base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/005.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's support.
translation:
  language: ko
  text: 그리고 하나님의 천사가 내게 보여 주었는데, 여자들이 왕과 가난한 자를 막론하고 다스리며, 여자는 왕의 영광과 강한 남자의 힘, 그리고 가난한 자의 가장 작은 버팀목을 빼앗아 갑니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ
  english_pob_choice: And the angel of God showed me
  chosen_korean: 그리고 하나님의 천사가 내게 보여 주었는데
  alternatives_korean:
  - 그리고 하나님의 천사가 내게 보여 주었습니다
  - 그리고 하나님의 천사가 내게 보여 주어
  lexicon: ἄγγελος; ὁ Θεός
  rationale: ‘보여 주었다’는 계시 전달 동사를 자연스럽게 살렸고, 서술 연결을 위해 ‘-는데’를 써서 다음 진술과 이어지게 했습니다.
- source_word: αἱ γυναῖκες κρατοῦσι ... κατακυριεύουσιν
  english_pob_choice: women rule forever over ... alike
  chosen_korean: 여자들이 ... 다스리며
  alternatives_korean:
  - 여인들이 ... 지배하며
  - 여자들은 ... 군림하며
  lexicon: κρατέω; κατακυριεύω
  rationale: 본문의 핵심은 여성의 지배/통치라는 진술이므로 ‘다스리다’로 옮겼고, 영어 POB의 ‘forever’는 그리스어 본문에 직접 대응하지 않아 본문 우선으로 반영하지 않았습니다.
- source_word: τοῦ βασιλέως αἴρουσιν τὴν δόξαν ... τὴν δύναμιν
  english_pob_choice: they take away a king's glory and a strong man's might
  chosen_korean: 왕의 영광과 강한 남자의 힘을 빼앗아 갑니다
  alternatives_korean:
  - 왕의 영광과 강한 남자의 능력을 빼앗습니다
  - 왕의 영광과 장사의 힘을 없앱니다
  lexicon: αἴρω; δόξα; δύναμις
  rationale: ‘ἀίρουσιν’의 제거/탈취를 ‘빼앗아 가다’로 살렸고, ‘δόξα’는 단순한 명예보다 가시적 위신을 포함해 ‘영광’이 적절합니다.
- source_word: τοῦ δὲ πτωχοῦ τὴν πτωχείας ἐλάχιστον στήριγμα
  english_pob_choice: and the poor man's support
  chosen_korean: 그리고 가난한 자의 가장 작은 버팀목을
  alternatives_korean:
  - 그리고 가난한 자의 지원을
  - 그리고 가난한 자의 미약한 버팀목을
  lexicon: στήριγμα; πτωχεία
  rationale: 문맥상 ‘στήριγμα’는 의지처/버팀목이 자연스럽고, ‘ἐλάχιστον’은 누락되지 않도록 ‘가장 작은’으로 반영했습니다.
theological_decisions:
- issue: English POB의 ‘forever’가 그리스어 본문에 직접 보이지 않음
  chosen_reading: 한국어 본문은 ‘forever’를 넣지 않고, 본문이 실제로 말하는 여성의 지배를 그대로 반영했습니다.
  alternative_readings:
  - 여자들이 영원히 왕과 가난한 자를 다스리며
  rationale: 원문에 없는 시간 부사를 보강하면 해석이 과도하게 확장되므로, 본문 증거에 맞춰 절제했습니다.
  doctrine_reference: source-criticism / translation fidelity
