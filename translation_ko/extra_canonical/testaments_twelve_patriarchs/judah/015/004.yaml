id: T12P.JUD.15.4
reference: Testament of Judah 15:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις¹⁴, οἶνον καὶ κρέα¹⁶ οὐκ¹⁷ ἔφαγον ἕως γήρους¹⁹ μου²⁰, καὶ *πᾶσαν εὐφροσύνην²¹ οὐκ εἶδον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
translation:
  language: ko
  text: 그리고 이런 일들에 대하여 회개한 뒤, 나는 늙을 때까지 포도주도 고기도 먹지 않았고, 어떤 기쁨도 보지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσας ἐπὶ τούτοις
  english_pob_choice: having repented concerning these things
  chosen_korean: 이런 일들에 대하여 회개한 뒤
  alternatives_korean:
  - 이 일들에 대해 마음을 돌린 뒤
  - 이런 일들에 관해 뉘우친 뒤
  lexicon: μετανοέω
  rationale: English POB의 revised reading이 'repented'이므로 단순한 생각 변경이 아니라 회개로 옮겼고, ἐπὶ τούτοις는 '이런 일들에 대하여'로 자연스럽게 반영했습니다.
- source_word: οἶνον καὶ κρέα
  english_pob_choice: wine nor meat
  chosen_korean: 포도주도 고기도
  alternatives_korean:
  - 술도 고기도
  - 포도주도 육류도
  lexicon: οἶνος / κρέας
  rationale: οἶνον은 관용적으로 포도주로, κρέα는 문자적으로 고기로 옮겨 금식·절제의 구체성을 살렸습니다.
- source_word: ἕως γήρους μου
  english_pob_choice: until my old age
  chosen_korean: 늙을 때까지
  alternatives_korean:
  - 내 노년까지
  - 내가 늙을 때까지
  lexicon: γῆρας
  rationale: 직역보다 한국어에서 더 자연스러운 시간 종결 표현으로 옮기되, 노년이라는 의미는 유지했습니다.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  english_pob_choice: I saw no joy at all
  chosen_korean: 어떤 기쁨도 보지 못했습니다
  alternatives_korean:
  - 아무 기쁨도 보지 못했습니다
  - 전혀 즐거움을 보지 못했습니다
  lexicon: εὐφροσύνη
  rationale: εὐφροσύνη의 기본 의미를 '기쁨'으로 살리면서, οὐκ ... πᾶσαν의 총체 부정을 한국어의 '어떤 ...도'로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 회개(μετανοήσας)의 뉘앙스
  chosen_reading: 단순한 후회나 입장 변경이 아니라 회개로 번역했습니다.
  alternative_readings:
  - 마음을 돌이킴
  - 뉘우침
  rationale: English POB의 수정이 이미 'repented'를 지지하고 있으며, 본문 문맥상 윤리적·영적 전환을 가리키는 표현으로 이해하는 것이 가장 충실합니다.
  doctrine_reference: 회개와 절제의 결심을 서술하는 자서전적 고백
- issue: '''어떤 기쁨도 보지 못했습니다''의 절대성'
  chosen_reading: 총체 부정으로 읽어 '어떤 기쁨도'로 옮겼습니다.
  alternative_readings:
  - 전혀 기쁨을 보지 못했습니다
  - 한 가지 기쁨도 보지 못했습니다
  rationale: πᾶσαν과 οὐκ의 결합은 단순한 일부가 아니라 전면적 결핍을 강조하므로, 한국어에서도 그 절대성을 유지했습니다.
  doctrine_reference: 수도적/금욕적 절제의 극단적 서술
