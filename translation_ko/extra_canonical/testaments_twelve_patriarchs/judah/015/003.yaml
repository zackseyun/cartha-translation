base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/003.yaml
  text: I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom.
translation:
  language: ko
  text: 내가 내 지팡이—곧 내 지파의 버팀목—와 내 띠—곧 내 힘—와 내 왕관—곧 내 왕국의 영광—을 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  english_pob_choice: staff
  chosen_korean: 지팡이
  alternatives_korean:
  - 막대기
  - 몽둥이
  lexicon: ῥάβδος
  rationale: 본문의 상징적 소지품을 자연스럽게 옮기되, POB의 staff에 해당하는 가장 무난한 현대어로 ‘지팡이’를 택했습니다.
- source_word: στήριγμα
  english_pob_choice: support
  chosen_korean: 버팀목
  alternatives_korean:
  - 지지
  - 받침
  lexicon: στήριγμα
  rationale: ‘지파의 support’라는 비유적 뜻을 살려, 물리적·상징적 지탱을 함께 전달하는 ‘버팀목’으로 옮겼습니다.
- source_word: ζώνην
  english_pob_choice: belt
  chosen_korean: 띠
  alternatives_korean:
  - 허리띠
  - 허리끈
  lexicon: ζώνη
  rationale: 고전적 소지품 표현으로서 ‘띠’가 간결하고 문맥상 자연스럽습니다.
- source_word: διάδημα
  english_pob_choice: diadem
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 왕의 관
  lexicon: διάδημα
  rationale: 그리스어 διάδημα의 왕권 표지를 드러내면서도, 고전적 ‘diadem’의 의미를 현대 한국어로 간결하게 살리기 위해 ‘관’을 사용했습니다.
- source_word: δόξαν τῆς βασιλείας μου
  english_pob_choice: the glory of my kingdom
  chosen_korean: 내 왕국의 영광
  alternatives_korean:
  - 내 나라의 영광
  - 내 왕권의 영광
  lexicon: δόξα
  rationale: 영광의 주체가 ‘왕국’임을 그대로 살려 POB의 kingdom을 반영하되, 한국어에서는 소유 구조를 자연스럽게 정리했습니다.
theological_decisions:
- issue: 상징적 열거 구조의 보존
  chosen_reading: 지팡이, 띠, 관을 각각 ‘곧’으로 풀어 설명하는 원문의 동격 해설 구조를 유지했습니다.
  alternative_readings:
  - 의역하여 하나의 설명문으로 합치기
  - 해설구를 생략하기
  rationale: 본문은 단순 나열이 아니라 각 물건의 상징적 의미를 즉시 해설하므로, 그 긴장을 보존하는 것이 의미 전달에 중요합니다.
  doctrine_reference: 문학적-상징적 평행 구조 보존
- issue: בַּזְ / βασιλεία의 왕권 뉘앙스
  chosen_reading: kingdom을 ‘왕국’으로 두어 영역·통치의 의미를 함께 드러냈습니다.
  alternative_readings:
  - 나라
  - 왕권
  rationale: 문맥상 실제 영역과 통치의 영광이 모두 암시되므로, 한국어에서는 ‘왕국’이 가장 균형 있게 대응합니다.
  doctrine_reference: 왕국/통치 개념의 이중 의미
