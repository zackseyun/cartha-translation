id: T12P.JUD.15.2
reference: Testament of Judah 15:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/002.yaml
  text: For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered.
translation:
  language: ko
  text: 그러나 어떤 사람이 왕일지라도 음행을 저지르면, 자기 왕권을 빼앗기고 음행의 종이 되니, 나도 그렇게 고통을 겪었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεὺς
  english_pob_choice: a man is a king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군왕
  lexicon: βασιλεύς
  rationale: 지위 자체를 가리키는 일반적 의미이므로 현대 한국어의 가장 직접적인 대응인 ‘왕’을 택했습니다.
- source_word: γυμνοῦται τῆς βασιλείας
  english_pob_choice: he is stripped of his kingship
  chosen_korean: 자기 왕권을 빼앗기고
  alternatives_korean:
  - 왕위를 빼앗기고
  - 왕권에서 벗겨지고
  lexicon: γυμνόω + βασιλεία
  rationale: ‘벗겨지다’의 감각을 살리되 한국어에서는 관용적으로 ‘빼앗기다’가 더 자연스러워, 왕권 상실을 명확히 드러냈습니다.
- source_word: δουλεύσας τῇ πορνείᾳ
  english_pob_choice: having been enslaved to sexual immorality
  chosen_korean: 음행의 종이 되니
  alternatives_korean:
  - 음행에 사로잡혔으므로
  - 성적 부도덕에 종속되었으므로
  lexicon: δουλεύω + πορνεία
  rationale: P.O.B.가 ‘enslaved’를 살린 만큼, 단순한 ‘빠지다’보다 종속 상태를 드러내는 ‘종이 되다’로 옮겼습니다.
- source_word: πορνεύῃ / πορνεία
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 간음
  lexicon: πορνεία
  rationale: 문맥상 광의의 성적 부정을 가리키므로, 전통적이면서도 본문의 윤리적 무게를 유지하는 ‘음행’을 사용했습니다.
theological_decisions:
- issue: 왕권 상실과 도덕적 종속의 관계
  chosen_reading: 성적 타락은 지위의 외형과 무관하게 실제 통치 권한을 박탈하고, 사람을 그 죄의 종으로 만든다는 경고로 읽었습니다.
  alternative_readings:
  - 단순한 비유적 경고로 완화하여 읽을 수 있음
  - 왕권 상실을 문자적 정치 해임보다 도덕적 수치로만 볼 수 있음
  rationale: 헬라어의 ‘벗겨지다/종이 되다’와 영어 POB의 ‘stripped/enslaved’가 함께 강한 상실과 예속을 말하므로, 윤리적 경고의 강도를 유지했습니다.
  doctrine_reference: 성경적 윤리와 죄의 예속성
