revisions:
- from: 그러나 어떤 사람이 왕일지라도 음행을 저지르면, 자기 왕권을 빼앗기고 음행의 종이 되니, 나도 그렇게 고통을 겪었습니다.[a]
  to: 참으로 어떤 사람이 왕이라 할지라도 음행을 저지르면, 음행에 종노릇하여 왕권을 빼앗깁니다. 나도 그렇게 고난을 겪었습니다.
  rationale: 접속사와 양보 표현을 원문에 맞게 고치고, 음행에 대한 예속과 왕권 상실의 관계를 분사 구조에 가깝게 다듬었습니다. 정의되지 않은 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:08Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 γάρ와 κἄν은 각각 설명적 접속과 양보를 나타냅니다. 초안의 ‘그러나’는 γάρ와 맞지 않으며, ‘어떤 사람이 왕이라 할지라도’가 더 충실합니다. 또한 δουλεύσας는 음행에 예속되어 종노릇한 상태를 나타내므로 이를 분명히 반영하는 편이 좋습니다.
  naturalness: ‘음행’과 ‘왕권을 빼앗기다’는 현대의 격식 있는 한국어 문맥에서 자연스럽습니다. 문장을 둘로 나누고 ‘참으로’를 사용하면 원문의 연결과 합쇼체 문체를 무리 없이 살릴 수 있습니다.
  terminology: βασιλεία는 여기서 통치 지위·권한을 가리키므로 ‘왕권’이 적절합니다. πορνεία는 이 문맥에서 특정 행위로 한정하지 않는 ‘음행’으로 유지합니다. δουλεύω의 예속 이미지는 ‘음행에 종노릇하여’로 반영합니다.
  issues:
  - severity: medium
    issue: ‘그러나’가 γάρ의 설명적 기능을 반대로 옮깁니다.
    rationale: γάρ는 ‘그러나’가 아니라 ‘참으로/왜냐하면/실로’ 등의 설명 또는 근거 제시 기능을 가집니다.
  - severity: low
    issue: 본문의 [a] 표지에 대응하는 각주가 제공되지 않았습니다.
    rationale: 근거 없는 각주 표지는 제거해야 구조적으로 완결된 본문이 됩니다.
  - severity: low
    issue: ‘음행의 종이 되니’는 원문의 과거분사 δουλεύσας가 나타내는 선행된 예속 상태를 다소 약화합니다.
    rationale: ‘음행에 종노릇하여’는 예속의 은유와 분사의 관계를 더 직접적으로 드러냅니다.
  revised_text: 참으로 어떤 사람이 왕이라 할지라도 음행을 저지르면, 음행에 종노릇하여 왕권을 빼앗깁니다. 나도 그렇게 고난을 겪었습니다.
