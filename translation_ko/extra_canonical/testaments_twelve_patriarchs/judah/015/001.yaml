id: T12P.JUD.15.1
reference: Testament of Judah 15:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας¹ γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/001.yaml
  text: The one who commits sexual immorality, while being ruined, does not perceive it; and while being dishonored, he is not ashamed.
translation:
  language: ko
  text: 음행을 저지르는 사람은 멸망당하면서도 그것을 깨닫지 못하고, 수치를 당하면서도 부끄러워하지 않습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας
  english_pob_choice: The one who commits sexual immorality
  chosen_korean: 음행을 저지르는 사람
  alternatives_korean:
  - 성적 부도덕을 저지르는 사람
  - 간음을 범하는 사람
  lexicon: πορνεύω
  rationale: 영문 POB의 ‘the one who’에 맞춰 중립적인 ‘사람’으로 옮기고, πορνεύω는 전형적인 ‘간음’보다 범위가 넓은 ‘음행’으로 옮겼습니다.
- source_word: γυμνούμενος
  english_pob_choice: while being ruined
  chosen_korean: 멸망당하면서도
  alternatives_korean:
  - 벌거벗겨지면서도
  - 망하면서도
  lexicon: γυμνόω
  rationale: 직역하면 ‘벗겨지다/벌거벗겨지다’이지만, 문맥상 도덕적·존재적 파멸을 가리키는 비유적 표현으로 이해하여 POB의 ‘being ruined’를 반영했습니다.
- source_word: οὐκ αἰσθάνεται
  english_pob_choice: does not perceive it
  chosen_korean: 그것을 깨닫지 못하고
  alternatives_korean:
  - 알아차리지 못하고
  - 느끼지 못하고
  lexicon: αἰσθάνομαι
  rationale: 단순한 감각보다 상황 인식의 결여를 뜻하므로 ‘깨닫다’로 옮겨 문맥의 의미를 살렸습니다.
- source_word: ἀδοξῶν
  english_pob_choice: while being dishonored
  chosen_korean: 수치를 당하면서도
  alternatives_korean:
  - 욕을 당하면서도
  - 불명예를 당하면서도
  lexicon: ἀδοξέω
  rationale: ‘영광이 없음’이라는 어감을 한국어에서 자연스럽게 드러내기 위해 ‘수치를 당하다’로 옮겼고, POB의 ‘dishonored’와도 부합합니다.
- source_word: οὐκ αἰσχύνεται
  english_pob_choice: he is not ashamed
  chosen_korean: 부끄러워하지 않습니다
  alternatives_korean:
  - 수치스러워하지 않습니다
  - 부끄럼을 느끼지 않습니다
  lexicon: αἰσχύνομαι
  rationale: 한국어의 기본적 수치 반응을 나타내는 ‘부끄러워하다’를 사용해 원문의 부끄러움의 결여를 सीधे 반영했습니다.
theological_decisions:
- issue: γυμνούμενος의 비유적 의미
  chosen_reading: 문자적 ‘벌거벗겨짐’보다 도덕적·존재적 파멸을 가리키는 표현으로 읽어 ‘멸망당하면서도’로 옮겼습니다.
  alternative_readings:
  - ‘벌거벗겨지면서도’처럼 문자적으로 옮김
  - ‘망가지면서도’처럼 완화하여 옮김
  rationale: 앞뒤 문맥이 수치와 깨달음의 결여를 병치하므로, 단순한 신체적 노출보다 죄의 결과로서의 파멸을 가리키는 비유로 보는 것이 더 자연스럽습니다.
  doctrine_reference: 죄의 자기기만과 수치의 둔감화
