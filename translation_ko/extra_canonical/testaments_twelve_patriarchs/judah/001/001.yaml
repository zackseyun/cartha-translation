  text: Διαθήκη Ἰούδα τοῦ τετάρτου υἱοῦ Ἰακὼβ καὶ Λείας¹. I. Ἀντίγραφον² λόγων³ Ἰούδα, ἃ⁴ ἐλάλησε τοῖς υἱοῖς αὐτοῦ πρὸ τοῦ ἀποθανεῖν αὐτόν.
