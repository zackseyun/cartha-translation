base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/001.yaml
  text: 'The Testament of Judah, the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.'
translation:
  language: ko
  text: '유다의 유언 — 야곱과 레아의 넷째 아들 유다


    I. 유다가 죽기 전에 자기 아들들에게 한 말의 사본입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: The Testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 유산 증언
  - 유다의 유언
  lexicon: διαθήκη
  rationale: 여기서는 책 제목으로 기능하며, 영어 POB의 'Testament'에 맞춰 한국어에서 가장 자연스럽고 문맥에 맞는 '유언'을 택했습니다. 이 단락의 본문도 뒤이어 유다가 죽기 전에 남긴 말의 사본임을 설명하므로 제목과 잘 맞습니다.
- source_word: Ἰούδα τοῦ τετάρτου υἱοῦ Ἰακὼβ καὶ Λείας
  english_pob_choice: of Judah, the fourth son of Jacob and Leah
  chosen_korean: 야곱과 레아의 넷째 아들 유다
  alternatives_korean:
  - 야곱과 레아의 네 번째 아들 유다
  - 야곱과 레아 사이에서 난 넷째 아들 유다
  lexicon: Ἰούδας / τετάρτου υἱοῦ
  rationale: 계보 정보를 간결하게 살리면서도 현대 한국어에서 자연스러운 '넷째 아들'로 옮겼습니다. '네 번째'보다 구어적이지만, 인물 계보 문맥에서는 의미가 분명합니다.
- source_word: Ἀντίγραφον λόγων
  english_pob_choice: A copy of the words
  chosen_korean: 말의 사본
  alternatives_korean:
  - 기록된 말
  - 말씀의 사본
  - 말들의 사본
  lexicon: ἀντίγραφον / λόγοι
  rationale: ἀντίγραφον의 핵심은 '사본'이며, λόγων은 단순히 '말씀'보다 일반적인 '말'이 원문에 더 가깝습니다. 본문 성격이 문서 전승임을 드러내기 위해 '말의 사본'으로 직역성을 유지했습니다.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  english_pob_choice: before he died
  chosen_korean: 죽기 전에
  alternatives_korean:
  - 그가 죽기 전에
  - 그가 죽음을 맞기 전에
  lexicon: πρὸ τοῦ ἀποθανεῖν
  rationale: 시간 관계를 자연스럽게 살리되, 원문의 단순한 서술을 과장하지 않도록 간명하게 옮겼습니다.
theological_decisions:
- issue: '책 제목의 성격: ''유언'' vs ''언약'''
  chosen_reading: 여기서는 성경 정경의 '언약'이 아니라 문헌 장르를 나타내는 제목으로 이해하여 '유언'으로 번역했습니다.
  alternative_readings:
  - 언약
  - 유다의 유언록
  rationale: 영어 POB도 'Testament'을 제목으로 두고 있으며, 이어지는 문장이 '죽기 전에 한 말의 사본'이라고 설명하므로 장르적 의미가 분명합니다. 신학적으로는 정경의 '언약' 용례와 혼동되지 않도록 했습니다.
  doctrine_reference: 문헌 장르 구분
