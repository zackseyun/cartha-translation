revisions:
- from: 내 자녀들아, 너희의 아버지 유다의 말을 들으십시오. 나는 내 아버지 야곱에게서 넷째 아들이 되었고, 나의 어머니 레아는 내 이름을 유다라고 지으면서 말했습니다. “내가 주님께 찬양을 올려드립니다. 주님께서 나에게 넷째 아들까지도 주셨기 때문입니다.”[a]
  to: 내 자녀들아, 너희의 아버지 유다의 말을 들으십시오. 나는 내 아버지 야곱의 넷째 아들로 태어났고, 내 어머니 레아가 내 이름을 유다라고 지으면서 말했습니다. “내가 주님께 찬양을 드립니다. 주님께서 나에게 또 넷째 아들을 주셨기 때문입니다.”
  rationale: 문장의 말하는 이는 유다이므로 첫 호칭에서 그 관계를 밝혔습니다. 출생 표현은 한국어 관용에 맞게 다듬되 ‘내 아버지 야곱’과 ‘넷째 아들’이라는 원문의 정보를 유지했습니다. 레아가 이름을 지었다는 서술과 찬양의 직접화법을 보존했으며, καὶ의 첨가 의미는 ‘또’로 옮겨 과도한 범위 의미를 피했습니다. 대응 각주가 없는 [a]는 제거했습니다.
  reviewer_model: gpt-5.6-terra
