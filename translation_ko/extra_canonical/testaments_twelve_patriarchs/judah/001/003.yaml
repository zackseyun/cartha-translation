  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: ⌜Ἀκούσατε⁸, τέκνα μου, Ἰούδα τοῦ πατρὸς ὑμῶν· ἐγὼ τέταρτος υἱὸς ἐγενόμην⁹ τῷ πατρί μου Ἰακώβ¹⁰, καὶ Λεία¹¹ *ἡ μήτηρ μου¹² ἤμην, καὶ ἐπωνόμασέν¹³ με¹⁴ Ἰούδαν¹⁵, λέγουσα· Ἀνθομολογοῦμαι¹⁶ τῷ¹⁷ Κυρίῳ, ὅτι ἔδωκέν¹⁸ μοι¹⁹ καὶ²⁰ τέταρτον υἱόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/003.yaml
  text: “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’
translation:
  language: ko
  text: 내 자녀들아, 너희의 아버지 유다의 말을 들으십시오. 나는 내 아버지 야곱의 넷째 아들로 태어났고, 내 어머니 레아가 내 이름을 유다라고 지으면서 말했습니다. “내가 주님께 찬양을 드립니다. 주님께서 나에게 또 넷째 아들을 주셨기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε, τέκνα μου
  english_pob_choice: Hear, my children
  chosen_korean: 내 자녀들아, 너희의 아버지 유다의 말을 들으십시오
  alternatives_korean:
  - 들으십시오, 내 자녀들아
  - 내 자녀들아, 들으십시오
  lexicon: ἀκούω
  rationale: 직접 청자를 부르는 호격과 명령을 자연스러운 합쇼체로 옮기되, 본문이 유다가 자녀들에게 말하는 구도이므로 ‘너희의 아버지 유다’로 관계를 분명히 했습니다.
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην τῷ πατρί μου Ἰακώβ
  english_pob_choice: I was born the fourth son to my father Jacob
  chosen_korean: 나는 내 아버지 야곱에게서 넷째 아들이 되었고
  alternatives_korean:
  - 나는 내 아버지 야곱의 넷째 아들이 되었고
  - 나는 내 아버지 야곱에게 넷째 아들로 태어났고
  lexicon: γίνομαι + ordinal son language
  rationale: ‘되었다’는 탄생 사실을 자연스럽게 반영하며, 원문의 ‘넷째 아들’ 순서를 보존했습니다.
- source_word: Λεία ἡ μήτηρ μου ἤμην
  english_pob_choice: Leah my mother
  chosen_korean: 나의 어머니 레아는
  alternatives_korean:
  - 레아인 내 어머니는
  - 레아 내 어머니는
  lexicon: μήτηρ
  rationale: 원문은 레아를 ‘내 어머니’로 밝히므로, 한국어에서도 소유 관계를 유지해 서술했습니다.
- source_word: ἐπωνόμασέν με Ἰούδαν
  english_pob_choice: named me Judah
  chosen_korean: 내 이름을 유다라고 지으면서
  alternatives_korean:
  - 나를 유다라고 불렀고
  - 내게 유다라는 이름을 주었고
  lexicon: ἐπονομάζω
  rationale: 이름 붙임의 행위를 분명히 드러내면서도 한국어에서 가장 자연스러운 ‘이름을 지었다’ 계열 표현을 택했습니다.
- source_word: Ἀνθομολογοῦμαι τῷ Κυρίῳ
  english_pob_choice: I give praise to the Lord
  chosen_korean: “내가 주님께 찬양을 올려드립니다
  alternatives_korean:
  - “제가 주님께 감사와 찬양을 드립니다
  - “주님께 찬양을 드리겠습니다
  lexicon: ἀνθομολογέομαι + κύριος
  rationale: 원문의 감탄·찬양의 뜻을 살려 ‘찬양을 올려드립니다’로 옮겼고, κύριος는 본문상 하나님을 가리키는 호칭으로 ‘주님’으로 처리했습니다.
- source_word: ἔδωκέν μοι ... τέταρτον υἱόν
  english_pob_choice: he has given me also a fourth son
  chosen_korean: 주님께서 나에게 넷째 아들까지도 주셨기 때문입니다
  alternatives_korean:
  - 주님께서 나에게 넷째 아들도 주셨기 때문입니다
  - 주님께서 나에게도 넷째 아들을 주셨기 때문입니다
  lexicon: δίδωμι + ordinal son language
  rationale: ‘καὶ’의 누적 의미를 살려 ‘까지도’로 반영하여, 이미 주어진 자녀에 더해 추가로 받은 은혜의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: Κύριος의 한국어 처리
  chosen_reading: 본문의 찬양 대상인 Κύριος는 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 인용된 찬양 문맥에서 직접적인 신명 대체까지는 본문만으로 확정하기보다, 한국어 독자가 자연스럽게 하나님을 가리키는 호칭으로 이해하도록 ‘주님’을 택했습니다.
  doctrine_reference: 호칭 번역의 본문 맥락 우선 원칙
- issue: 직접화법 안의 문체
  chosen_reading: 레아의 직접 인용은 현대적 예배체 감각의 ‘주님께 찬양을 올려드립니다’로 옮겼습니다.
  alternative_readings:
  - 주님께 감사드립니다
  - 주님을 찬양합니다
  rationale: ‘Ἀνθομολογοῦμαι’는 단순 정보 전달보다 공개적 찬양·고백의 성격이 있어, 한국어에서도 경배의 뉘앙스가 드러나는 문체가 적절합니다.
  doctrine_reference: 시적/찬양문 어조 보존
