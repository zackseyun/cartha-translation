lexical_decisions:
- source_word: ὀξὺς
  english_pob_choice: keen
  chosen_korean: 날카로웠고
  alternatives_korean:
  - 예리했고
  - 민첩했고
  - 열성적이었고
  lexicon: ὀξύς
  rationale: 여기서는 지적 능력보다는 성격과 태도의 날카로움·예리함을 나타내므로, 영어 POB의 keen을 살려 한국어 ‘날카롭다’로 옮겼습니다.
- source_word: ἐν νεότητί μου
  english_pob_choice: in my youth
  chosen_korean: 젊은 시절에
  alternatives_korean:
  - 청년 시절에
  - 내 젊은 때에
  - 젊을 때에
  lexicon: νεότης
  rationale: 시적 자전 진술로서 자연스러운 현대 한국어 표현인 ‘젊은 시절에’가 원문의 시간 범위를 무리 없이 전달합니다.
- source_word: ὑπήκουον
  english_pob_choice: I obeyed
  chosen_korean: 순종했습니다
  alternatives_korean:
  - 복종했습니다
  - 들었습니다
  - 따랐습니다
  lexicon: ὑπακούω
  rationale: 아버지의 말에 귀를 기울여 따르는 의미를 분명하게 드러내기 위해 ‘순종하다’를 택했습니다.
- source_word: κατὰ πάντα λόγον
  english_pob_choice: in every matter
  chosen_korean: 모든 말에서
  alternatives_korean:
  - 모든 일에서
  - 모든 말에
  - 말마다
  lexicon: κατὰ + πᾶς + λόγος
  rationale: 직역하면 ‘모든 말/명령에 따라’의 뜻이므로, 아버지의 발화 단위를 살려 ‘모든 말에서’로 옮겼습니다.
