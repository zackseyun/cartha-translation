  source_fidelity: 그리스어의 시간절(ὡς ἡδρύνθην), 아버지가 화자를 위하여 기도한 행위(ὁ πατήρ μου ηὔξατό μοι), 미래 선언(Βασιλεὺς ἔσῃ), 그리고 ‘모든 일에서’의 범위를 충실히 반영합니다. 다만 원문의 ηὔξατό μοι λέγων은 기도의 내용으로 이어지는 발화를 나타내므로, 이를 한국어에서 더 분명히 연결하는 편이 좋습니다.
  naturalness: ‘나를 위해 기도하시며 이렇게 말씀하셨습니다’는 현대 표준어 합쇼체 서술로 자연스럽고, 기도와 뒤따르는 인용문의 관계도 명료합니다. 인용문 속 아버지의 직접 호칭 ‘너는’은 가족 내 직접 발화로 자연스럽습니다.
  terminology: ‘왕’, ‘기도하다’, ‘형통하다’는 각각 βασιλεύς, εὔχομαι, κατευοδόω의 문맥상 의미를 적절히 보존합니다. ‘형통하다’는 다소 성서적인 문체이지만 현대 한국어에서도 이해 가능하며 원문의 번영·순조로움의 뉘앙스에 맞습니다.
