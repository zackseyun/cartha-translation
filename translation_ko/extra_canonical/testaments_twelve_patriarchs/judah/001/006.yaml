  text: And when I had grown up, my father prayed for me, saying, ‘You shall be a king, prospering in all things.’
translation:
  language: ko
  text: 그리고 내가 자라나자, 내 아버지가 나를 위해 기도하며 말씀하셨습니다. ‘너는 왕이 될 것이며, 모든 일에서 형통할 것이다.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς ἡδρύνθην
  english_pob_choice: And when I had grown up
  chosen_korean: “그리고 내가 자라나자”
  alternatives_korean:
  - 내가 성장하자
  - 내가 어른이 되자
  lexicon: ἡδρύνθην
  rationale: 성장·성숙의 완료를 자연스러운 서술로 옮기되, 원문의 사건 전환(그리고 ~하자)을 살렸습니다.
- source_word: ηὔξατό μοι
  english_pob_choice: my father prayed for me
  chosen_korean: “내 아버지가 나를 위해 기도하며”
  alternatives_korean:
  - 내 아버지가 나를 축복하며
  - 내 아버지가 나를 위하여 기원하며
  lexicon: ηὔξατο
  rationale: 본문 동사는 ‘축복하다’보다 ‘기도하다/간구하다’에 가깝고, 최신 영어 POB 수정도 이를 반영하므로 그 의미를 직접 살렸습니다.
- source_word: Βασιλεὺς ἔσῃ
  english_pob_choice: You shall be a king
  chosen_korean: “너는 왕이 될 것이며”
  alternatives_korean:
  - 너는 왕이 되리라
  - 너는 왕이 되겠고
  lexicon: Βασιλεύς
  rationale: 직역하되 예언/선언의 미래 뉘앙스를 현대 한국어 문장으로 자연스럽게 옮겼습니다.
- source_word: κατευοδούμενος ἐν πᾶσιν
  english_pob_choice: prospering in all things
  chosen_korean: “모든 일에서 형통할 것이다”
  alternatives_korean:
  - 모든 일에서 잘될 것이다
  - 만사에 성공할 것이다
  lexicon: κατευοδόω
  rationale: 행운보다 ‘형통’이 원문의 길을 열어 주고 번성하게 하는 의미를 더 잘 보존합니다.
theological_decisions:
- issue: ο  πατήρ μου ηὔξατό μοι의 의미
  chosen_reading: 아버지가 아들을 ‘축복’한 것이 아니라 ‘그를 위해 기도한’ 것으로 번역했습니다.
  alternative_readings:
  - 아버지가 나를 축복하셨습니다
  - 아버지가 나를 위해 복을 빌었습니다
  rationale: POB의 수정 이력과 동사 형태가 가리키는 의미를 따라, 본문이 말하는 행위는 일반적 축복 선언보다 간구/기도에 가깝다고 보았습니다.
  doctrine_reference: 본문어휘 해석
- issue: 왕 예언의 표현
  chosen_reading: ‘너는 왕이 될 것이다’로 예언적 선언을 유지했습니다.
  alternative_readings:
  - 너는 왕이다
  - 왕이 되도록 되어 있다
  rationale: 미래 직설의 예언 형식을 보존해, 아버지의 기도와 뒤이은 선언의 구조를 분명히 했습니다.
  doctrine_reference: 예언적 선언
