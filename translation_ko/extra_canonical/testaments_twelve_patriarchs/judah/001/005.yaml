  source_fidelity: 그리스어의 ἐτίμων, τὴν μητέρα μου, τὴν ἀδελφὴν τῆς μητρός μου를 각각 ‘공경하였습니다’, ‘어머니’, ‘어머니의 누이’로 충실히 옮겼습니다. ‘어머니의 누이’는 단수 친족 관계를 보존하며, 영어 감사본과도 일치합니다.
  naturalness: ‘그리고 나는 어머니와 어머니의 누이를 공경하였습니다.’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽습니다. 소유 표현은 한국어 문맥에서 자연스럽게 생략되었습니다.
  terminology: τιμάω에 ‘공경하다’를 사용한 것은 가족 구성원에게 보이는 존중과 예우를 적절히 나타냅니다. ‘어머니의 누이’는 ‘이모’처럼 문화적으로 더 구체적인 호칭을 강제하지 않아 원문의 범위를 잘 보존합니다.
