  text: 그리고 나는 어머니와 어머니의 누이를 공경하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτίμων
  english_pob_choice: honored
  chosen_korean: 공경하였습니다
  alternatives_korean:
  - 존중하였습니다
  - 존경하였습니다
  - 공경했습니다
  lexicon: τιμάω
  rationale: 가족을 향한 지속적 존중의 행위를 나타내므로, 단순한 감정보다 예우와 존중을 함께 드러내는 ‘공경하다’가 가장 자연스럽습니다.
- source_word: τὴν μητέρα μου
  english_pob_choice: my mother
  chosen_korean: 어머니
  alternatives_korean:
  - 내 어머니
  - 나의 어머니
  lexicon: μήτηρ
  rationale: 문맥상 소유 대명사 ‘μου’는 한국어에서 자연스럽게 생략할 수 있어, 간결하게 ‘어머니’로 옮겼습니다.
- source_word: τὴν ἀδελφὴν τῆς μητρός μου
  english_pob_choice: my mother’s sister
  chosen_korean: 어머니의 누이
  alternatives_korean:
  - 외숙모
  - 이모
  - 어머니의 자매
  lexicon: ἀδελφή
  rationale: 친족 관계를 직역해 원문의 범위를 보존했습니다. ‘이모’는 한국어 친족 체계에서 보통 외가 쪽으로 좁아질 수 있어 피했습니다.
theological_decisions:
- issue: 친족 호칭의 문화적 구체화 여부
  chosen_reading: 원문 친족 관계를 그대로 살려 ‘어머니의 누이’로 유지했습니다.
  alternative_readings:
  - 관용적으로 ‘이모’로 풀어씀
  - ‘외숙모’로 문화 대응
  rationale: 원문은 혈연 관계의 일반적 표현이므로, 한국어 친족 체계로 과도하게 특정하면 의미 범위가 좁아질 수 있습니다.
  doctrine_reference: '번역 원칙: 원문 의미 범위 보존'
