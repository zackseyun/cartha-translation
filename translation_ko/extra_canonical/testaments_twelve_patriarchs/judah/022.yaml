review_pass:
  verdict: revise
  source_fidelity: 초안은 22장 1절과 2절의 앞부분만 옮기고, 원문에 있는 ‘의의 하나님이 나타나심’, 야곱과 모든 민족의 평화, 그리고 왕권의 보존 및 맹세에 관한 2절 후반과 3절 전체를 누락했습니다. 또한 ‘그러할 것입니다’는 원문의 반복·지속 의미를 부자연스럽게 보충합니다. συντελεσθήσεται의 종료 의미와 τὸ σωτήριον의 비인격적 ‘구원’은 적절히 유지할 수 있습니다.
  naturalness: ‘그들 가운데 서로 대립하는 분열’은 뜻은 전달하지만 다소 중복적입니다. ‘그들 사이에 서로 맞서는 분열’이 현대 표준 한국어에서 더 자연스럽습니다. 원문의 긴 예언문은 문장을 나누어 합쇼체의 격식을 유지했습니다.
  terminology: Κύριος는 ‘주님’, βασιλεία는 문맥상 ‘나라’, σωτήριον은 해석을 좁히지 않는 ‘구원’으로 옮겼습니다. ἀλλόφυλοι는 특정 블레셋 사람들로 한정하지 않고 ‘이방 민족들’로 옮겼습니다. Θεοῦ τῆς δικαιοσύνης는 ‘의의 하나님’으로 직역에 가깝게 유지했습니다. αὐτός의 선행사는 문맥상 의의 하나님으로 읽히지만, 본문상 논쟁 가능성을 고려해 과도한 해석을 덧붙이지 않았습니다.
  issues:
  - severity: high
    issue: 원문 22장 2절 후반과 3절이 번역문에서 누락되었습니다.
    rationale: 제시된 그리스어에는 σωτήριον 이후 ‘의의 하나님이 나타나심’, 야곱과 모든 민족의 평화, 왕국의 권세 보존, 그리고 씨에서 왕권을 없애지 않겠다는 맹세가 계속됩니다. 완전한 본문으로 보완해야 합니다.
  - severity: medium
    issue: ‘이스라엘의 구원이 올 때까지 그러할 것입니다’가 원문에 없는 보충 표현을 포함합니다.
    rationale: ἕως는 시간적 한계를 나타내지만 ‘그러할 것입니다’라는 별도 술어를 요구하지 않습니다. 앞 문장의 ‘끝날 것입니다’에 직접 연결하는 편이 충실합니다.
  - severity: low
    issue: ‘그들 가운데 서로 대립하는 분열’은 표현상 중복됩니다.
    rationale: κατ᾽ ἀλλήλων의 상호 적대성을 ‘그들 사이에 서로 맞서는’으로 자연스럽게 드러낼 수 있습니다.
  revised_text: 주님께서 그들 사이에 서로 맞서는 분열을 일으키실 것이며, 이스라엘에는 끊임없는 전쟁이 있을 것입니다.[a] 내 나라는 이방 민족들 가운데서 끝날 것이며,[b] 이스라엘의 구원이 올 때까지 그러할 것입니다.[c] 곧 의의 하나님이 나타나셔서 야곱과 모든 민족을 평화 가운데 쉬게 하실 때까지입니다. 그분께서는 내 나라의 권세를 영원히 지키실 것입니다. 주님께서 맹세로 내게, 내 씨에게서 왕권을 영원히 없애지 않으시겠다고 맹세하셨기 때문입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘끊이지 않는 전쟁’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 나라는 이방 민족들 가운데서 완성될 것이다’. 그리스어 동사는 ‘끝나다’뿐 아니라 ‘완성되다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이스라엘의 구출’. 이 표현은 인물을 명시하지 않지만 메시아적 함의를 지닐 수도 있습니다.
    reason: alternative_reading
  revision_rationale: 원문에 충실하도록 누락된 2절 후반과 3절을 모두 번역했습니다. συντελεσθήσεται는 앞선 분열과 전쟁의 문맥에 따라 ‘끝나다’로 유지하되 대안 의미를 각주에 남겼고, τὸ σωτήριον은 ‘구원’으로 유지하여 인격적 구원자라는 해석을 본문에 강제하지 않았습니다. ‘의의 하나님이 나타나심’ 및 그 뒤의 부정사구는 한국어에서 자연스러운 시간절로 옮겼습니다.
