source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXII. *Ἐπάξει¹ δὲ αὐτοῖς Κύριος διαιρέσεις *κατ᾽ ἀλλήλων¹³, καὶ ἔσονται *συνεχεῖς ἔσονται³ ἐν Ἰσραήλ⁴. 2. Καὶ ἐν ἀλλοφύλοις⁵ συντελεσθήσεται ἡ βασιλεία μου⁶, ἕως⁷ τοῦ ἐλθεῖν⁸ τὸ⁹ σωτήριον τοῦ¹⁰ Ἰσραήλ¹⁰, *ἕως τῆς¹¹ παρουσίας Θεοῦ¹² τῆς δικαιοσύνης¹³, *τοῦ ἡσυχάσαι τὸν¹⁴ Ἰακὼβ¹⁵ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη¹⁴. 3. Καὶ αὐτὸς φυλάξει κράτος¹⁵ τῆς βασιλείας μου¹⁶ ἕως¹⁷ αἰῶνος¹⁸· ὅρκῳ γὰρ ὤμοσέ¹⁹ μοι Κύριος μὴ ἐξαλείψειν²⁰ τὸ βασίλειον ἐκ τοῦ σπέρματός μου ἕως αἰῶνος²¹.
  language: Greek
  source_pages:
  - 168
  - 169
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022.yaml
  text: The Lord will bring divisions among them against one another[a], and there will be continual wars in Israel. And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes[c][b],
  footnotes:
  - marker: a
    text: Or 'constant wars.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my kingdom will be completed among foreigners'; the Greek verb can denote completion as well as coming to an end.
    reason: lexical_alternative
  - marker: c
    text: Or 'the deliverance of Israel.' The phrase may also carry messianic resonance without explicitly naming a person.
    reason: alternative_reading
translation:
  language: ko
  text: 주님께서 그들 가운데 서로 대립하는 분열을 일으키실 것이며, 이스라엘에는 끊임없는 전쟁이 있을 것입니다. 그리고 내 나라는 외국인들 가운데서 끝날 것이며, 이스라엘의 구원이 올 때까지 그러할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπάξει δὲ αὐτοῖς Κύριος διαιρέσεις κατ᾽ ἀλλήλων
  english_pob_choice: will bring divisions against one another
  chosen_korean: 그들 가운데 서로 대립하는 분열을 일으키실 것이며
  alternatives_korean:
  - 그들 위에 분열을 가져오실 것이며
  - 그들 사이에 분열을 일으키실 것이며
  lexicon: LSJ
  rationale: Ἐπάγω의 미래형은 여기서 하나님이 분열을 ‘가져오다/일으키다’는 뜻이므로 주어적 능동성을 살렸고, κατ᾽ ἀλλήλων은 단순한 내부 분산보다 상호 적대성을 띠므로 ‘서로 대립하는’으로 풀었습니다.
- source_word: συνεχεῖς ἔσονται ἐν Ἰσραήλ
  english_pob_choice: there will be continual wars in Israel
  chosen_korean: 이스라엘에는 끊임없는 전쟁이 있을 것입니다
  alternatives_korean:
  - 이스라엘에는 계속되는 전쟁이 있을 것입니다
  - 이스라엘에는 끊이지 않는 전쟁이 있을 것입니다
  lexicon: LSJ
  rationale: συνεχεῖς는 지속성과 반복성을 강조하므로 ‘끊임없는’이 문맥의 예언적 엄중함을 가장 자연스럽게 옮깁니다.
- source_word: συντελεσθήσεται ἡ βασιλεία μου ἐν ἀλλοφύλοις
  english_pob_choice: my kingdom will be brought to an end among foreigners
  chosen_korean: 내 나라는 외국인들 가운데서 끝날 것이며
  alternatives_korean:
  - 내 나라는 외국인들 가운데서 완성될 것이며
  - 내 왕국은 외국인들 가운데서 종결될 것이며
  lexicon: LSJ
  rationale: συντελέω는 ‘완성하다’와 ‘끝내다’ 모두 가능하지만, 앞뒤가 분열과 전쟁의 심판 문맥이므로 종료 의미를 우선 살렸습니다.
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  english_pob_choice: the salvation of Israel
  chosen_korean: 이스라엘의 구원이
  alternatives_korean:
  - 이스라엘의 구출이
  - 이스라엘을 위한 구원이
  lexicon: LSJ
  rationale: σωτήριον은 여기서 인격적 구원자보다 ‘구원/구출’이라는 사건적 의미가 더 직접적이므로, 의미를 열어 두는 ‘이스라엘의 구원’으로 옮겼습니다.
theological_decisions:
- issue: τὸ σωτήριον τοῦ Ἰσραήλ의 종말론적·메시아적 함의
  chosen_reading: ‘이스라엘의 구원’으로 유지하여 사건적 의미를 우선하되, 메시아적 인물 해석은 본문에서 단정하지 않습니다.
  alternative_readings:
  - ‘이스라엘의 구출’
  - ‘이스라엘의 구원자’
  rationale: 그리스어 형태는 추상명사에 가깝고, 전승 문맥상 메시아적 울림은 가능하지만 확정되지 않으므로 한국어 본문도 그 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
- issue: συντελεσθήσεται ἡ βασιλεία μου의 방향성
  chosen_reading: ‘내 나라는 … 끝날 것입니다’로 심판적 종료를 반영합니다.
  alternative_readings:
  - ‘내 나라는 … 완성될 것입니다’
  - ‘내 통치는 … 성취될 것입니다’
  rationale: 문맥의 분열과 전쟁이 긍정적 성취보다 부정적 종결을 지지하므로, 가능한 의미 중 종료를 택하되 동사의 다의성은 설명에서 남겨 둡니다.
  doctrine_reference: DOCTRINE.md § Original-language primacy over translation tradition
