    rationale: ἐὰν μὴ ... ἐκπέσῃ ... καὶ ... κυριευθῇ는 '죄로 말미암아 ... 지배를 받게 되지 않는 한'이라는 예외 조건입니다. 초안의 '지배를 받지 않는 한'은 부정을 잘못 배치하여, 지배를 받는 경우에도 제사직의 우월성이 유지되는 뜻이 됩니다.
