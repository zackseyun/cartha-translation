base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves over him, lest you be utterly destroyed. For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood. To me he gave the things on earth; to him, the things in the heavens. For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.


    For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer him the firstfruits of the delights of the sons of Israel[c]. But you shall be king of Jacob. And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.


    For the kings will be like sea-monsters, swallowing men like fish; they will enslave sons and daughters of free people, and they will seize houses, fields, flocks, and wealth. And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed. And there will be false prophets like storms[a],'
  footnotes:
  - marker: a
    text: The Greek text of this chapter, as provided here, breaks off after 'And there will be false prophets like storms,' so the present draft translates the extant witness only.
    reason: textual_variant
  - marker: b
    text: '''Ibises'' follows the Greek directly. The image is of carrion birds feeding on the slain; some readers may expect a more general term such as ''birds,'' but the Greek is more specific.'
    reason: lexical_alternative
  - marker: c
    text: '''The firstfruits of the delights of the sons of Israel'' likely refers to choice produce or rich first offerings brought from Israel.'
    reason: cultural_note
translation:
  language: ko
  text: '그리고 이제, 내 자녀들아, 내가 너희에게 명합니다. 레위를 사랑하십시오. 그리하여 너희가 존속하게 하십시오. 그에게 맞서 스스로를 높이지 마십시오. 그렇게 하면 너희가 완전히 멸망할 것입니다.


    하나님께서는 내게 왕권을, 그에게 제사직을 주셨고, 왕권을 제사직에 복종시키셨습니다. 내게는 땅에 있는 것들을 주셨고, 그에게는 하늘에 있는 것들을 주셨습니다. 그러므로 하나님의 제사직은 땅의 왕권보다 더 뛰어납니다. 다만 죄로 말미암아 그것이 주님에게서 떨어져 나가 땅의 왕권의 지배를 받게 되지 않는 한 그렇습니다.


    주님의 천사가 내게 말하였습니다. ‘주님께서 그를 너보다 앞세워 택하셔서, 그분께 가까이 나아가고 그분의 상에서 먹으며 이스라엘 자손의 좋은 것들의 첫열매를 그분께 드리게 하셨다.[c] 그러나 너는 야곱의 왕이 될 것이다. 너는 그들 가운데 바다와 같을 것이다. 바다 안에 의인과 악인이 있어, 어떤 이들은 사로잡히고 다른 이들은 부유해지는 것처럼, 네 안에서도 온갖 부류의 사람들이 그러할 것이다. 어떤 이들은 사로잡혀 위험에 처하고, 다른 이들은 남의 것을 빼앗아 부유해질 것이다.’


    왕들은 바다 괴물들처럼 되어 사람들을 물고기처럼 삼킬 것입니다. 그들은 자유민의 아들과 딸들을 노예로 삼고, 집들과 밭들과 양 떼들과 재물을 빼앗을 것입니다. 그들은 많은 이들의 살을 까마귀들에게 부당하게 먹이고, 탐욕으로 교만해져 악과 교만 가운데 더욱 나아갈 것입니다. 그리고 거짓 예언자들은 폭풍들처럼 되어 모든 의인을 박해할 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ‘이스라엘 자손의 좋은 것들의 첫열매’는 이스라엘이 바치는 좋은 산물, 곧 풍성하고 값진 첫 예물을 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγέλλω
  english_pob_choice: I command
  chosen_korean: 내가 ... 명합니다
  alternatives_korean:
  - 명령합니다
  - 지시합니다
  lexicon: LSJ
  rationale: 유언적이고 권위 있는 최종 권고의 힘을 살리면서도 현대 한국어에서 자연스러운 공식체로 옮겼습니다.
- source_word: ἐπαίρεσθε ἐπ᾿ αὐτόν
  english_pob_choice: exalt yourselves over him
  chosen_korean: 그를 높여 너희 자신을 그 위에 두지 마십시오
  alternatives_korean:
  - 그를 업신여기지 마십시오
  - 그에게 거만하게 굴지 마십시오
  lexicon: LSJ
  rationale: 직역보다 ‘위에 두다’의 위계 이미지를 살려, 레위에 대한 자기고양의 의미를 드러냈습니다.
- source_word: βασιλείαν / ἱερατείαν
  english_pob_choice: kingship / priesthood
  chosen_korean: 왕권 / 제사직
  alternatives_korean:
  - 왕국 / 제사직
  - 왕의 직분 / 제사장직
  lexicon: LSJ
  rationale: 여기서는 영토보다 직분과 권세의 부여가 핵심이므로, 왕권과 제사직으로 구분해 표현했습니다.
- source_word: ἐντρυφημάτων
  english_pob_choice: the delights
  chosen_korean: 기쁨의 첫열매
  alternatives_korean:
  - 즐거움의 첫열매
  - 진미의 첫열매
  lexicon: LSJ
  rationale: 문맥상 이스라엘의 좋은 산물/풍성한 예물을 가리키므로, 한국어에서 제의적 의미가 드러나는 첫열매로 살렸습니다.
- source_word: κήτη
  english_pob_choice: sea-monsters
  chosen_korean: 바다 괴물
  alternatives_korean:
  - 큰 바다생물
  - 고래들
  lexicon: LSJ
  rationale: 포식성과 위협성을 가장 분명하게 전달하는 일반적 표현을 택했습니다.
- source_word: καταδουλώσουσιν
  english_pob_choice: they will enslave
  chosen_korean: 노예로 삼고
  alternatives_korean:
  - 종으로 삼고
  - 종살이하게 하고
  lexicon: LSJ
  rationale: 영어 POB가 slavery의 강도를 드러내므로, 강제 예속을 분명히 하는 ‘노예로 삼다’를 사용했습니다.
- source_word: ἴβεις
  english_pob_choice: ibises
  chosen_korean: 이비스들
  alternatives_korean:
  - 따오기들
  - 물새들
  lexicon: LSJ
  rationale: 본문의 특수한 조류 이미지를 흐리지 않기 위해 일반화하지 않고 음역을 유지했습니다.
theological_decisions:
- issue: Judah와 Levi의 관계
  chosen_reading: 하나님께서 왕권은 유다에게, 제사직은 레위에게 주셨고, 왕권을 제사직에 복종시키셨습니다.
  alternative_readings:
  - 두 직분을 단순 병렬로 보는 완화된 읽기
  - 왕권과 제사직의 서열을 अस्प명확하게 만드는 읽기
  rationale: 그리스어의 ἔδωκεν과 ὑπέταξε가 실제 위계를 말하므로, 그 긴장을 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3, 4
- issue: 주님의 천사가 전하는 레위의 소명
  chosen_reading: 레위가 주님께 가까이 나아가고, 그 상에서 먹고, 첫열매를 드리는 제의적 특권을 받았다고 옮겼습니다.
  alternative_readings:
  - 단순한 친교 이미지로만 보는 읽기
  - 상징적 봉사로 약화하는 읽기
  rationale: 문맥이 분명히 제의적이므로, 성전·제사적 뉘앙스를 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
