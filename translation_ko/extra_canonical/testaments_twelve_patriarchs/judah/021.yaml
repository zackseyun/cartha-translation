  - severity: high
    issue: 21:9의 마지막 절이 누락됨
    rationale: 원문은 'καὶ πάντας τοὺς δικαίους διώξουσιν'으로 끝나며, 거짓 예언자들이 모든 의인을 박해한다는 진술을 포함합니다.
  - severity: medium
