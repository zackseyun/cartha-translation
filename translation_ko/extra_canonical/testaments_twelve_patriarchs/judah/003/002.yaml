- from: 그리고 다른 왕 타푸아를, 그가 말을 타고 앉아 있을 때, 내가 죽였으며, 그렇게 해서 그의 모든 백성을 흩어 놓았습니다.
  to: 그리고 다른 왕 타푸아가 말 위에 앉아 있을 때, 내가 그를 죽였고, 그렇게 해서 그의 모든 백성을 흩어 놓았습니다.
  rationale: The revision resolves the Korean syntactic disruption, explicitly preserves Taphou as the person seated on the horse and killed, and replaces the redundant riding-and-sitting expression with a direct rendering of the Greek location phrase. It preserves the article’s non-possessive sense by using ‘말 위에,’ not ‘자기 말 위에.’
