lexical_decisions:
- source_word: Τὸν δὲ ἕτερον βασιλέα
  english_pob_choice: And the other king
  chosen_korean: 그리고 다른 왕
  alternatives_korean:
  - 그런데 다른 왕
  - 또 한 왕
  lexicon: βασιλεύς
  rationale: δὲ의 연결을 자연스럽게 살리되, 대조되는 ‘다른 왕’이라는 핵심 관계를 간결하게 옮겼습니다.
- source_word: τὸν Ταφούα
  english_pob_choice: Taphou
  chosen_korean: 타푸아
  alternatives_korean:
  - 타포우
  - 타푸오
  lexicon: 고유명사
  rationale: 그리스어 표기를 현대 외래어 표기법에 가깝게 옮겨 음가를 보존했습니다.
- source_word: καθήμενον ἐπὶ τοῦ ἵππου
  english_pob_choice: while he was sitting on the horse
  chosen_korean: 그가 말을 타고 앉아 있을 때
  alternatives_korean:
  - 그가 그 말 위에 앉아 있을 때
  - 말 위에 앉아 있는 동안
  lexicon: ἵππος
  rationale: 영문 POB의 수정처럼 소유격을 덧붙이지 않고, 단순한 위치 관계를 자연스러운 한국어로 재현했습니다.
- source_word: ἀνεῖλον
  english_pob_choice: I killed
  chosen_korean: 내가 죽였으며
  alternatives_korean:
  - 내가 죽였고
  - 내가 죽였습니다
  lexicon: ἀναιρέω
  rationale: 서술의 연속성을 살리기 위해 ‘-으며’ 연결을 택했고, 본문의 강한 살해 의미를 약화하지 않았습니다.
- source_word: διεσκόρπισα
  english_pob_choice: I scattered
  chosen_korean: 흩어 놓았습니다
  alternatives_korean:
  - 흩었습니다
  - 뿔뿔이 흩어 놓았습니다
  lexicon: διασκορπίζω
  rationale: 무리를 흩뜨리는 동작을 한국어로 자연스럽게 표현하되, 단순 분산보다 의도적 해체의 뉘앙스를 유지했습니다.
