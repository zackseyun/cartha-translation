revisions:
- from: 그리고 가나안 사람들의 두 왕이 무장한 채 우리 양 떼를 향해 오고, 그들과 함께 많은 사람들이 있었을 때, 나만 홀로 그 왕들 가운데 하나를 향해 달려가 그의 정강이를 쳐서 그를 쓰러뜨리고 그렇게 죽였습니다.[a]
  to: 그리고 가나안 사람들의 두 왕이 갑옷을 입고 우리 양 떼를 치러 왔으며 큰 무리가 그들과 함께 있었을 때, 나 홀로 그 왕들 가운데 하나에게 달려들어 그의 뼈들을 산산이 부수었습니다.
  rationale: 영어 POB 감사 이력에 나타난 ‘정강이를 쳐서 그를 쓰러뜨리고 죽였다’는 표현 대신, 제공된 그리스어 본문 자체의 동작과 대상을 번역했습니다. 원문이 결과적 사망을 명시하지 않으므로 이를 덧붙이지 않았습니다. 불필요한 각주 표지도 삭제했습니다.
  reviewer_model: gpt-5.6-terra
