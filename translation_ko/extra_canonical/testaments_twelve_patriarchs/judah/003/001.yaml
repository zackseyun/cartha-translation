  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ὅτε δὲ¹ *ἦλθον² οἱ δύο βασιλεῖς τῶν Χαναναίων τεθωρακισμένοι³ ἐπὶ τὰ *ποίμνια ἡμῶν⁴ καὶ λαὸς πολὺς⁵ *μετ᾽ αὐτῶν⁶, *κἀγὼ μόνος⁷ δραμὼν ἐπὶ τὸν βασιλέα⁸ †τὸν ἕνα⁹ καὶ κατεσπάραξα τὰ ὀστᾶ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/001.yaml
  text: And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I brought him down and so killed him.
translation:
  language: ko
  text: 그리고 가나안 사람들의 두 왕이 갑옷을 입고 우리 양 떼를 치러 왔으며 큰 무리가 그들과 함께 있었을 때, 나 홀로 그 왕들 가운데 하나에게 달려들어 그의 뼈들을 산산이 부수었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεθωρακισμένοι
  english_pob_choice: in armor
  chosen_korean: 무장한 채
  alternatives_korean:
  - 갑옷을 입은 채
  - 갑옷으로 무장한 채
  lexicon: τεθωρακισμένοι
  rationale: 전투 태세를 드러내는 표현으로, 한국어에서는 ‘무장한 채’가 가장 자연스럽고 본문의 상황을 충분히 반영합니다.
- source_word: ἐπὶ τὰ ποίμνια ἡμῶν
  english_pob_choice: against our flocks
  chosen_korean: 우리 양 떼를 향해
  alternatives_korean:
  - 우리 양 떼를 대적하여
  - 우리 양 떼에 맞서
  lexicon: ποίμνια
  rationale: ‘ἐπὶ’의 공격적 방향성을 살리되, 양 떼를 향한 침략 장면이 자연스럽게 들리도록 옮겼습니다.
- source_word: δραμὼν ἐπὶ τὸν βασιλέα τὸν ἕνα
  english_pob_choice: I alone ran at one of the kings
  chosen_korean: 나만 홀로 그 왕들 가운데 하나를 향해 달려가
  alternatives_korean:
  - 나 홀로 그 왕 하나에게 달려가
  - 혼자 그 왕 하나에게 달려가
  lexicon: βασιλεύς
  rationale: ‘μόνος’와 ‘τὸν ἕνα’의 대비를 살려, 홀로 한 왕을 공격한 점을 분명하게 드러냈습니다.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  english_pob_choice: striking him on the shins, I brought him down and so killed him
  chosen_korean: 그의 정강이를 쳐서 그를 쓰러뜨리고 그렇게 죽였습니다
  alternatives_korean:
  - 그의 정강이를 쳐서 그를 넘어뜨리고 그렇게 죽였습니다
  - 그의 정강이를 쳐서 그를 무너뜨리고 그렇게 죽였습니다
  lexicon: κατεσπάραξα
  rationale: English POB의 ‘brought him down’에 맞추되, 동사 뒤의 ‘τὰ ὀστᾶ’는 문맥상 다리를 무너뜨리는 치명타로 이해하여 한국어에서는 ‘정강이를 쳐서 … 쓰러뜨리고’로 자연화했습니다.
theological_decisions:
- issue: 전승 본문에서 과장된 영웅 서술을 현대 한국어로 어떻게 전달할지
  chosen_reading: 사실 서술의 힘을 유지하면서도, 본문이 의도한 전투적 과장을 그대로 살려 번역했습니다.
  alternative_readings:
  - 더 완곡하게 ‘상처를 입혀’로 순화
  - 더 직역하여 ‘뼈들을 찢어’로 표현
  rationale: 이 절은 윤리적 교훈보다 전투 영웅담의 서술에 가깝기 때문에, 본문의 강한 행동 묘사를 약화하지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 서사 본문의 수사와 문맥 우선 원칙
