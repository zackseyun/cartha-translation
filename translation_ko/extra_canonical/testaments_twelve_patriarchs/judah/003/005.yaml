  text: And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.
translation:
  language: ko
  text: 내가 그의 흉갑을 벗기고 있을 때, 보십시오, 그의 동료들인 여덟 사람이 나와 싸우기 시작했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκδύειν ... τὸν θώρακα
  english_pob_choice: was stripping off his breastplate
  chosen_korean: 그의 흉갑을 벗기고 있을 때
  alternatives_korean:
  - 그의 갑옷을 벗기는 동안
  - 그의 흉갑을 벗겨내는 중에
  lexicon: θώραξ
  rationale: θώρακας는 몸을 보호하는 갑옷의 흉부 장비를 가리키므로, 현대 한국어에서는 ‘흉갑’이 원의에 가장 가깝고 간결합니다.
- source_word: ἰδού
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: ἰδού
  rationale: 서술 흐름을 살리되, 현대 한국어 합쇼체 문체에 맞게 놀람·전환을 나타내는 감탄을 ‘보십시오’로 옮겼습니다.
- source_word: ἑταῖροι
  english_pob_choice: companions
  chosen_korean: 동료들
  alternatives_korean:
  - 동무들
  - 동반자들
  lexicon: ἑταῖρος
  rationale: ἑταῖροι는 단순한 친구보다 함께 행동하는 동행자·동조자를 뜻하므로, 문맥상 중립적이고 자연스러운 ‘동료들’을 선택했습니다.
- source_word: ἤρξαντο πολεμεῖν με
  english_pob_choice: began to fight me
  chosen_korean: 나와 싸우기 시작했습니다
  alternatives_korean:
  - 나를 대적하기 시작했습니다
  - 나에게 싸움을 걸기 시작했습니다
  lexicon: πολεμέω
  rationale: πολεμεῖν με는 능동적으로 전투를 벌인다는 뜻이므로, 직역보다도 문맥에 맞는 자연스러운 ‘싸우기 시작했습니다’가 적절합니다.
theological_decisions:
- issue: 서사적 감탄사 ἰδού의 문체 처리
  chosen_reading: ‘보십시오’로 옮겨 독자에게 장면 전환과 돌발성을 직접 전달했습니다.
  alternative_readings:
  - 보라
  - 자
  rationale: 이 구절은 교훈보다 사건의 급박함을 강조하므로, 합쇼체 안에서 독자 주의를 환기하는 표현이 가장 자연스럽습니다.
  doctrine_reference: 서사 전달의 수사적 기능
