source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐνελύθην³⁶ δὲ ἐγὼ³⁷ τὴν στολήν μου *ἐπὶ τὴν χεῖρά μου³⁸ καὶ³⁹ σφενδονήσας αὐτοὺς λίθοις⁴⁰ τέσσαρας ἐξ αὐτῶν *ἀνεῖλον⁴¹, *οἱ δὲ λοιποὶ⁴² ἔφυγον.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/006.yaml
  text: But I wrapped my garment around my arm and slung four stones at them; from behind and in front around the waist of one seated on a horse, I picked up a stone of sixty litras and hurled it, struck the horse, and killed it. And I fought King Nahor for about two hours, and after smashing the shield into pieces, I cut off his feet, and so I killed him.
translation:
  language: ko
  text: 그러나 나는 내 겉옷을 팔에 감아 네 개의 돌을 그들에게 던졌습니다. 그리고 나는 말탄 사람의 허리 둘레를 뒤와 앞에서 보며, 육십 리트라나 되는 돌 하나를 집어 던져 그 말을 맞혀 죽였습니다. 또 나는 나호르 왕과 약 두 시간 동안 싸웠고, 방패를 산산조각 내고 그의 발을 잘라 버린 뒤 그를 죽였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐνελύθην … τὴν στολήν μου ἐπὶ τὴν χεῖρά μου
  english_pob_choice: I wrapped my garment around my arm
  chosen_korean: 내 겉옷을 팔에 감아
  alternatives_korean:
  - 내 옷을 팔에 둘러
  - 내 의복을 팔 위에 감아
  lexicon: στολή, χεῖρ
  rationale: στολήν은 여기서 몸에 걸친 겉옷/의복으로 이해하는 것이 자연스럽고, χεῖρά μου는 직역해 팔에 감았다는 동작을 살리는 것이 원문에 가깝습니다.
- source_word: σφενδονήσας αὐτοὺς λίθοις τέσσαρας
  english_pob_choice: slung four stones at them
  chosen_korean: 네 개의 돌을 그들에게 던졌습니다
  alternatives_korean:
  - 네 돌을 그들에게 날렸습니다
  - 네 개의 돌을 그들에게 슬링으로 던졌습니다
  lexicon: σφενδονάω, λίθος, τέσσαρες
  rationale: σφενδονήσας는 투석기의 동작을 포함하지만 한국어에서는 과도한 설명 없이 ‘던졌습니다’로 옮기되, τέσσαρας를 분명히 살려 네 개의 돌이라는 수량을 유지했습니다.
- source_word: ἀνεῖλον
  english_pob_choice: I killed
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽였습니다
  - 죽여 버렸습니다
  lexicon: ἀναιρέω
  rationale: ἀνεῖλον은 단순한 ‘쳐 죽이다/죽이다’의 의미로, 서술의 폭력을 불필요하게 강화하지 않는 ‘죽였습니다’가 가장 직접적입니다.
- source_word: οἱ δὲ λοιποὶ ἔφυγον
  english_pob_choice: the others fled
  chosen_korean: 나머지는 달아났습니다
  alternatives_korean:
  - 다른 이들은 도망갔습니다
  - 나머지는 도주했습니다
  lexicon: λοιποί, φεύγω
  rationale: λοιποί와 ἔφυγον의 대조를 한국어로 자연스럽게 살리기 위해 ‘나머지’와 ‘달아났습니다’를 사용했습니다.
theological_decisions:
- issue: 본문이 전투 서술을 매우 구체적으로 나열하는 방식
  chosen_reading: 전승의 영웅담적 폭력을 완곡화하지 않고, 원문의 행위 순서를 그대로 드러냈습니다.
  alternative_readings:
  - 전투를 요약해 더 부드럽게 옮기는 방식
  - 죽임의 표현을 약화하는 방식
  rationale: 이 구절은 도덕적 해설보다 사건의 연속성과 전투의 격렬함을 증언하므로, 구체성을 유지하는 것이 원문의 의도에 더 충실합니다.
  doctrine_reference: source fidelity / narrative transparency
