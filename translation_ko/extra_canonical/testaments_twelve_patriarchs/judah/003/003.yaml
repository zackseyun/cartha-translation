  terminology: Ἀχὼρ는 ‘아코르’로 음역하고, βασιλεύς는 ‘왕’, γίγας는 ‘거인’으로 옮겼습니다. λίτρα는 고대 무게 단위이므로 ‘리트라’를 유지했습니다.
