  source_fidelity: 수정이 필요합니다. 초안은 βασιλέα(‘왕’)를 누락했고, ἐφ᾽ ἵππου를 ‘기병 위에 타고’로 옮겨 뜻과 한국어 표현 모두 부정확합니다. 또한 δέδωκα τῷ ἵππῳ는 돌을 말에게/말을 향해 던진 행동으로 문맥상 옮길 수 있으며, αὐτόν의 지시 대상은 문법·문맥상 논의될 수 있으므로 한국어에서 불필요하게 확정하지 않는 편이 안전합니다.
