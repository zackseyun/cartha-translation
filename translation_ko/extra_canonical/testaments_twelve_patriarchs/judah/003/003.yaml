  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ¹⁵ τὸν †Ἀχὼρ βασιλέα¹⁶ γίγαντα εὗρον¹⁷ βάλλοντα τόξα ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου, καὶ ἀνελάμενος¹⁸ λίθον¹⁹ ἑξήκοντα λιτρῶν²⁰ καὶ *δέδωκα²¹ τῷ ἵππῳ καὶ ἀπέκτεινα αὐτόν²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/003.yaml
  text: And I found Achor, a giant man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.
translation:
  language: ko
  text: 그리고 나는 말을 타고 앞뒤로 활을 쏘고 있는 거인 아코르 왕을 발견했습니다. 나는 뛰어올라 육십 리트라나 되는 돌을 집어 말에게 던져 맞히고, 그를 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀχὼρ βασιλέα γίγαντα
  english_pob_choice: Achor, a giant man
  chosen_korean: 아홉르, 거인 같은 사람
  alternatives_korean:
  - 아호르, 거인인 사람
  - 아코르, 거인 같은 사람
  lexicon: 고유명사 음역 / γίγας
  rationale: Ἀχὼρ는 본문 음가에 따라 음역하고, γίγαντα는 과장된 외형을 살린 ‘거인 같은 사람’으로 옮겨 영어 POB의 ‘giant man’과 같은 의미 강도를 유지했습니다.
- source_word: βάλλοντα τόξα ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  english_pob_choice: shooting arrows ... on horseback
  chosen_korean: 기병 위에 타고 앞뒤로 화살을 쏘는
  alternatives_korean:
  - 말 위에서 앞뒤로 화살을 쏘는
  - 말을 타고 앞뒤로 화살을 쏘는
  lexicon: βάλλω / ἵππος
  rationale: 활을 ‘쏘다’로 자연스럽게 풀고, ἔμπροσθεν καὶ ὄπισθεν은 ‘앞뒤로’로 보존하여 양방향 사격의 이미지를 살렸습니다.
- source_word: ἀνελάμενος λίθον ἑξήκοντα λιτρῶν
  english_pob_choice: Leaping up, I took a stone of sixty litras
  chosen_korean: 내가 뛰어올라 육십 리트라나 되는 돌을 집어 던졌더니
  alternatives_korean:
  - 뛰어올라 육십 리트라짜리 돌을 들고
  - 뛰어올라 육십 리트라의 돌을 집어
  lexicon: ἀναλαμβάνω / λίθος / λίτρα
  rationale: ἀνελάμενος의 순간적 동작을 ‘뛰어올라’로, λίθον ἑξήκοντα λιτρῶν은 무게를 드러내는 ‘육십 리트라나 되는 돌’로 옮겨 원문의 과장된 장면을 유지했습니다.
- source_word: καὶ ἀπέκτεινα αὐτόν
  english_pob_choice: and killed him
  chosen_korean: 말에 맞혔고 그를 죽였습니다
  alternatives_korean:
  - 그를 죽였습니다
  - 말을 맞혀 죽였습니다
  lexicon: ἀποκτείνω / αὐτόν
  rationale: 앞선 문맥의 ‘말’이 직접적으로 맞은 대상이므로, 한국어에서는 ‘말에 맞혔고’로 사건 순서를 분명히 하되, 최종 살해 대상을 ‘그’로 받아 원문의 대명사 지시를 살렸습니다.
theological_decisions:
- issue: 폭력적 서사와 영웅적 과장 표현의 처리
  chosen_reading: 본문의 전투적 과장과 물리적 승리를 도덕적으로 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 상징적으로 재해석하여 부드럽게 옮김
  - 과장을 줄여 평이하게 요약함
  rationale: 이 구절은 전승 본문의 무용담적 묘사를 전달하는 것이 핵심이므로, 독자가 인물의 힘과 사건의 급박함을 인지할 수 있도록 직역에 가까운 구성을 유지했습니다.
  doctrine_reference: 본문 성격상 서사 전달 원칙
