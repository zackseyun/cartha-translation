  text: Καὶ πολεμήσας τὸν †Ἀχὼρ²³ ἐπὶ ὥρας δύο²⁴ ἀπέκτεινα αὐτόν²⁵, καὶ εἰς²⁶ δύο μέρη²⁷ ποιήσας τὴν ἀσπίδα αὐτοῦ συνέκοψα τοὺς πόδας αὐτοῦ.
  language: Greek
base_translation:
