  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/004.yaml
  text: And after fighting with Achor for two hours, I killed him; and splitting his shield into two pieces, I chopped off his feet.
translation:
  language: ko
  text: 그리고 내가 아홉ὸ르와 두 시간 동안 싸워서 그를 죽였습니다. 그리고 그의 방패를 두 부분으로 나누어 그의 발을 잘라 버렸습니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: Καὶ πολεμήσας τὸν †Ἀχὼρ²³ ἐπὶ ὥρας δύο²⁴
  english_pob_choice: And after fighting with Achor for two hours
  chosen_korean: 아홉ὸ르와 두 시간 동안 싸워서
  alternatives_korean:
  - 아호르와 두 시간 동안 싸워서
  - 아코르와 두 시간 동안 싸워서
  lexicon: 고유명사 음역
  rationale: 본문의 인명 Ἀχὼρ는 전통적으로 정착된 한국어 성경 인명이 없으므로, 원음에 가깝게 음역하되 현대 표기 일관성을 고려해 처리했습니다.
- source_word: ἀπέκτεινα αὐτόν
  english_pob_choice: I killed him
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
  - 그를 죽였습니다
  - 그를 죽여 버렸습니다
  lexicon: 동사 구문
  rationale: 직역에 충실하게 단순 과거로 옮겨 서술의 사실성을 유지했습니다.
- source_word: εἰς δύο μέρη ποιήσας τὴν ἀσπίδα αὐτοῦ
  english_pob_choice: splitting his shield into two pieces
  chosen_korean: 그의 방패를 두 부분으로 나누어
  alternatives_korean:
  - 그의 방패를 둘로 쪼개어
  - 그의 방패를 두 조각으로 만들어
  lexicon: τεμνω/분할 표현
  rationale: εἰς δύο μέρη와 ποιήσας의 결합을 ‘두 부분으로 나누다’로 자연스럽게 살려 과도한 의역을 피했습니다.
- source_word: συνέκοψα τοὺς πόδας αὐτοῦ
  english_pob_choice: I chopped off his feet
  chosen_korean: 그의 발을 잘라 버렸습니다
  alternatives_korean:
  - 그의 발을 잘라냈습니다
  - 그의 발을 절단했습니다
  lexicon: 강한 파괴 동사
  rationale: συνέκοψα의 거친 폭력성을 반영해 ‘잘라 버리다’로 옮겼고, 문학적 충격을 약화하지 않았습니다.
theological_decisions:
- issue: 폭력적 서술의 직설성
  chosen_reading: 서술의 잔혹함을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘무찔렀습니다’로 조정
  - 상징적으로 완화하여 옮김
  rationale: 본문은 전투 승리의 극단적 신체 훼손을 직접 진술하므로, 독자에게 주는 원문 효과를 보존하는 것이 타당합니다.
  doctrine_reference: 서사 본문 해석의 문맥 보존 원칙
