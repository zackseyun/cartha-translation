id: T12P.JUD.13.3
reference: Testament of Judah 13:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ ὠνείδιζον²³ Ῥουβὶμ τὸν ἀδελφόν μου²⁴ περὶ Βάλλας γυναικὸς τοῦ πατρός μου²⁵, καὶ τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας²⁶ παρετάξατο²⁷ ἐπ᾽ ἐμέ²⁸, ἕως οὗ συνετέλεσα εἰς †τὴν Χανανανίτην³² καὶ εἰς Θαμὰρ ³³τὴν νύμφην³⁴ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/003.yaml
  text: and I reproached Reuben my brother concerning Bilhah, my father’s wife, and the spirit of jealousy and sexual immorality arrayed themselves against me, until I completed it with Anan the Canaanite woman and with Tamar my daughter-in-law.
translation:
  language: ko
  text: 그리고 나는 내 아버지의 아내인 빌하에 관하여 내 형 루우벤을 책망했습니다. 그러나 질투와 음행의 영이 나를 대적하였고, 내가 가나안 여자 아난과 내 며느리 다말에게서 그것을 마칠 때까지 그러했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠνείδιζον
  english_pob_choice: I reproached
  chosen_korean: 책망했습니다
  alternatives_korean:
  - 꾸짖었습니다
  - 비난했습니다
  lexicon: ὠνειδίζω
  rationale: 단순한 감정 표출보다 잘못을 지적하는 공개적 책망의 뉘앙스를 살려, 합쇼체에서 자연스러운 ‘책망했습니다’를 택했습니다.
- source_word: τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  english_pob_choice: the spirit of jealousy and sexual immorality
  chosen_korean: 질투와 음행의 영
  alternatives_korean:
  - 시기와 성적 부정의 영
  - 질투와 성적 음란의 영
  lexicon: πνεῦμα / ζῆλος / πορνεία
  rationale: 영을 주어로 살리고, πορνεία는 문맥상 ‘음행’이 가장 직접적이며 교회적 완곡어보다 원문 긴장을 더 잘 보존합니다.
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  english_pob_choice: arrayed themselves against me
  chosen_korean: 나를 대적하였고
  alternatives_korean:
  - 나를 향해 전열을 갖추었고
  - 내게 맞서 나섰고
  lexicon: παρατάσσω
  rationale: 군사적 이미지를 한국어에서 과장 없이 전달하는 표현으로 ‘대적하다’를 사용했습니다.
- source_word: συνετέλεσα εἰς
  english_pob_choice: I completed it with
  chosen_korean: 그것을 마칠 때까지
  alternatives_korean:
  - 그 일을 완수할 때까지
  - 그 일을 끝낼 때까지
  lexicon: συντελέω
  rationale: 영어 POB의 수정이 반영하듯, 여기서는 ‘죄를 범했다’보다 원문이 허용하는 범위인 ‘마치다’의 의미를 살려 과도한 해석을 피했습니다.
theological_decisions:
- issue: 주체가 되는 ‘영’의 번역
  chosen_reading: ‘질투와 음행의 영’으로 번역해, 내면의 충동이 아니라 인격적·영적 대적의 작용이라는 원문의 긴장을 살렸습니다.
  alternative_readings:
  - ‘질투와 음행한 성향’으로 완화
  - ‘질투와 음행의 충동’으로 비인격화
  rationale: 원문은 영을 단순 심리 상태로 낮추지 않으므로, 인격적 대립을 드러내는 번역이 더 적절합니다.
  doctrine_reference: 악한 영의 მოქმედ/영적 संघर्ष 표현
- issue: συνετέλεσα의 도덕적 강도
  chosen_reading: ‘마칠 때까지’로 옮겨, 원문이 직접 말하지 않는 ‘내가 죄를 지었다’는 추가 해석을 피했습니다.
  alternative_readings:
  - ‘죄를 범할 때까지’
  - ‘완수할 때까지’
  rationale: 영어 POB 수정 취지를 반영해, 본문이 암시하는 행위 완료와 도덕 평가를 구분했습니다.
  doctrine_reference: 본문 충실성 및 과잉해석 방지
