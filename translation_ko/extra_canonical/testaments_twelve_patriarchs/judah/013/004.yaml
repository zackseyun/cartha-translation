id: T12P.JUD.13.4
reference: Testament of Judah 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἔλεγον γὰρ τῷ πενθερῷ μου ὅτι συμβουλεύσομαι τῷ πατρί μου καὶ οὕτως λήψομαι³⁴ τὴν θυγατέρα σου⁵· ὁ δὲ οὐκ ἠθέλησεν, ἀλλ᾽ ἔδειξέ³⁵ μοι *εἰς δόσιν αὐτῆς³⁶ χρυσίου πλῆθος³⁷ ἄπειρον³⁸. *Βασιλεὺς γὰρ ἦν³⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/004.yaml
  text: For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, he showed me an immense amount of gold in the name of his daughter, for he was a king.
translation:
  language: ko
  text: 나는 장인에게 말했습니다. “제 아버지께 상의한 뒤에 당신의 딸을 데려오겠습니다.” 그러나 그는 그것을 원하지 않았고, 그 대신 딸의 이름으로 엄청난 양의 금을 내게 보여 주었습니다. 그는 왕이었기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πενθερῷ μου
  english_pob_choice: my father-in-law
  chosen_korean: 장인에게
  alternatives_korean:
  - 시아버지에게
  - 장인어른에게
  lexicon: πενθερὸς
  rationale: 출발어의 친족 관계를 그대로 살리되, 현대 한국어에서 가장 자연스러운 호칭인 ‘장인’을 택했습니다. 문체상 호격적 뉘앙스는 강하지 않으므로 ‘장인어른’보다 간결하게 처리했습니다.
- source_word: συμβουλεύσομαι τῷ πατρί μου
  english_pob_choice: I will consult my father
  chosen_korean: 제 아버지께 상의한 뒤에
  alternatives_korean:
  - 아버지께 물어본 뒤에
  - 아버지와 상의한 뒤에
  lexicon: συμβουλεύομαι
  rationale: συμβουλεύσομαι는 단순한 ‘묻다’보다 ‘상의하다/조언을 구하다’가 더 가깝기 때문에 ‘상의하다’를 사용했습니다. 미래 시상은 한국어 자연성을 위해 ‘한 뒤에’로 풀었습니다.
- source_word: λήψομαι ... τὴν θυγατέρα σου
  english_pob_choice: I will take your daughter
  chosen_korean: 당신의 딸을 데려오겠습니다
  alternatives_korean:
  - 당신의 딸을 취하겠습니다
  - 당신의 딸을 데려가겠습니다
  lexicon: λαμβάνω
  rationale: 문맥상 혼인 맥락에서의 ‘take’이므로 직역형 ‘취하다’보다 한국어에서 의미가 분명한 ‘데려오다/데려가다’ 계열로 옮겼습니다. 약속의 뉘앙스를 살려 종결은 ‘-겠습니다’로 했습니다.
- source_word: εἰς δόσιν αὐτῆς χρυσίου πλῆθος ἄπειρον
  english_pob_choice: an immense amount of gold in the name of his daughter
  chosen_korean: 딸의 이름으로 엄청난 양의 금을
  alternatives_korean:
  - 딸의 명목으로 엄청난 양의 금을
  - 딸을 빙자해 엄청난 양의 금을
  lexicon: εἰς δόσιν + χρυσίου πλῆθος ἄπειρον
  rationale: 직접적으로는 ‘그녀의 증여/지참금으로’라는 식의 문맥이지만, POB가 보존한 ‘in the name of his daughter’의 구조를 살려 ‘딸의 이름으로’로 번역했습니다. ‘엄청난 양의 금’은 πλῆθος ἄπειρον의 과장된 풍부함을 전달합니다.
theological_decisions:
- issue: 왕이기 때문에 막대한 금을 제시했다는 설명의 인과 구조
  chosen_reading: ‘그는 왕이었기 때문입니다’로 왕권을 부와 연결하는 단순한 서술로 옮겼습니다.
  alternative_readings:
  - ‘왕이었으므로’
  - ‘왕답게’
  rationale: 원문은 설명적 이유절(γὰρ)로, 그가 왕이어서 그런 막대한 금을 보여 줄 수 있었음을 덧붙입니다. 과도한 신학화 없이 서술의 인과를 그대로 유지했습니다.
  doctrine_reference: 서사 문맥의 인과 설명
