translation:
  language: ko
  text: 내가 전쟁 가운데서도 아름다운 여인의 얼굴에 속지 않았다고 자랑했기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκαυχησάμενος
  english_pob_choice: I boasted
  chosen_korean: 자랑했기 때문입니다
  alternatives_korean:
  - 자만했기 때문입니다
  - 뽐냈기 때문입니다
  lexicon: ἐγκαυχάομαι
  rationale: 문맥상 자신의 공을 내세운 태도를 가리키므로, 과도한 신학적 해석 없이 자연스러운 ‘자랑하다’로 옮겼습니다.
- source_word: ἐν πολέμοις
  english_pob_choice: in wars
  chosen_korean: 전쟁 가운데서도
  alternatives_korean:
  - 전쟁들에서
  - 전쟁 중에
  lexicon: πόλεμος
  rationale: 복수형의 전쟁 상황을 한국어에서 유려하게 살리기 위해 ‘전쟁 가운데서도’로 처리했습니다.
- source_word: ἠπάτησέ με πρόσωπον γυναικὸς εὐμόρφου
  english_pob_choice: the face of a beautiful woman had not deceived me
  chosen_korean: 아름다운 여인의 얼굴에 속지 않았다고
  alternatives_korean:
  - 아름다운 여인의 얼굴이 나를 속이지 않았다고
  - 아름다운 여인의 얼굴에 미혹되지 않았다고
  lexicon: ἀπατάω / πρόσωπον / εὐμόρφος
  rationale: 직역하면 ‘얼굴이 나를 속이다’이지만 한국어에서는 수동적 결과를 자연스럽게 보이도록 ‘속지 않았다’로 옮기되, ‘얼굴’과 ‘아름다운 여인’을 모두 살렸습니다.
