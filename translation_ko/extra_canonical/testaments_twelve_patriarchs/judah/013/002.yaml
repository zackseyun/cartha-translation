review_pass:
  verdict: revise
  source_fidelity: 그리스어 전승문은 † 표지와 함께 ἠπάτησέ με(‘나를 속였다’)라고 읽으며, 제시된 영어 POB의 ‘had not deceived me’ 및 한국어 초안의 ‘속지 않았다고’에 있는 부정은 현전 그리스어 본문에 없습니다. 난문 표지는 본문이 손상되었거나 문제가 있음을 알리므로, 부정을 본문에 확정적으로 넣기보다 전승문을 번역하고 각주에서 문제를 밝혀야 합니다.
  naturalness: 수정문은 원문의 다소 역설적인 진술을 그대로 유지하므로 문맥상 매끄럽지는 않지만, 현대 한국어 합쇼체로는 자연스럽습니다. ‘전쟁들 가운데서’는 복수형을 무리 없이 드러냅니다.
  terminology: ἐγκαυχησάμενος는 ‘자랑했기’로, πρόσωπον γυναικὸς εὐμόρφου는 ‘아름다운 여인의 얼굴’로 적절히 옮겼습니다. ‘속였다’는 ἠπάτησέ με의 능동 구문을 보존합니다.
  issues:
  - severity: high
    issue: 부정 ‘않았다’의 첨가
    rationale: 그리스어 제시 본문에는 부정사 οὐ/μή가 없고, 오히려 ‘나를 속였다’라는 동사가 있습니다. 영어 POB는 난문에 대한 정정적 이해를 채택한 것으로 보이나, 본문 자체와 구별되어야 합니다.
  - severity: medium
    issue: 난문(†)의 미표시
    rationale: 원문 편집자가 ἠπάτησέ με에 †를 붙였으므로, 번역은 전승문이 문맥상 문제를 지님을 각주로 알려 독자가 영어 감사 기록의 부정적 이해를 확정 본문으로 오인하지 않게 해야 합니다.
  revised_text: 내가 전쟁들 가운데서 아름다운 여인의 얼굴이 나를 속였다고 자랑했기 때문입니다.[a]
  revised_footnotes:
  - marker: a
    text: 그리스어 전승문은 ‘아름다운 여인의 얼굴이 나를 속였다’라고 읽지만, 이 구절은 원전에서 난문으로 표시되어 있습니다(†). 따라서 문맥상 예상될 수 있는 ‘나를 속이지 못했다’라는 이해는 본문에 명시되어 있지 않습니다.
    reason: †로 표시된 전승상의 문제와, 영어 POB가 반영한 부정적 이해가 현전 그리스어의 명시적 독법이 아님을 밝혀 본문 비평상의 불확실성을 보존합니다.
  revision_rationale: 원문 우선 원칙에 따라 현전 그리스어의 긍정 동사를 번역하고, 본문 비평상 난문임을 각주로 표시했습니다. 이는 영어 POB의 매끄러운 복원적 번역을 본문에 무비판적으로 반영하지 않으면서도, 해당 차이를 투명하게 드러냅니다.
