  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/005.yaml
  text: And he adorned her with gold and pearls, and made her pour wine for us at the banquet.
translation:
  language: ko
  text: 그리고 그는 그녀를 금과 진주로 장식하고, 잔치에서 우리에게 포도주를 따르게 했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκόσμησεν αὐτὴν ἐν χρυσίῳ καὶ μαργαρίταις
  english_pob_choice: he adorned her with gold and pearls
  chosen_korean: 그는 그녀를 금과 진주로 장식하고
  alternatives_korean:
  - 그는 그녀를 금과 진주로 꾸미고
  - 그는 그녀를 금과 진주로 단장하고
  lexicon: κοσμέω
  rationale: κοσμέω의 기본적 ‘장식하다/꾸미다’ 의미를 살려, 외형을 화려하게 꾸민 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: ἐποίησεν αὐτὴν οἰνοχοεῖν ἡμῖν
  english_pob_choice: made her pour wine for us
  chosen_korean: 우리에게 포도주를 따르게 했습니다
  alternatives_korean:
  - 우리에게 포도주를 붓게 했습니다
  - 우리에게 술을 따르게 했습니다
  lexicon: οἰνοχοέω
  rationale: οἰνοχοέω는 잔치 자리에서 포도주를 따르는 행위를 가리키므로, ‘포도주를 따르게 하다’로 직역성과 문맥성을 함께 살렸습니다.
- source_word: ἐν τῷ δείπνῳ
  english_pob_choice: at the banquet
  chosen_korean: 잔치에서
  alternatives_korean:
  - 연회에서
  - 저녁 식사 자리에서
  lexicon: δεῖπνον
  rationale: δεῖπνον은 단순한 저녁 식사보다 공식적인 연회/잔치를 가리키는 문맥이므로 ‘잔치’가 가장 무난합니다.
- source_word: ἐν κάλλει γυναικῶν
  english_pob_choice: at the banquet
  chosen_korean: ''
  alternatives_korean: []
  lexicon: κάλλος
  rationale: 이 구절은 문맥상 ‘여인들의 아름다움 가운데서/여인들의 아름다움에 맞게’라는 수식으로 이해될 수 있으나, 전승별·구문상 해석 차가 있어 본문에는 과도한 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: 본문의 여성 대상과 역할 표현
  chosen_reading: 그녀가 잔치에서 포도주를 따르도록 만들었다는 서술로, 성적 대상화의 분위기를 암시하되 이를 도덕적으로 해설하지 않고 서술 자체를 유지했습니다.
  alternative_readings:
  - 중립적으로 ‘시중을 들게 했다’로 완화
  - 더 직접적으로 ‘술 시중을 들게 했다’로 강화
  rationale: 본문의 사회적·서술적 뉘앙스를 보존하는 것이 우선이므로, 원문이 암시하는 권력관계와 대상화의 긴장을 희석하지 않았습니다.
  doctrine_reference: source-sense preservation
