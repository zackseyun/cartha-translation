id: T12P.JUD.13.1
reference: Testament of Judah 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, ἀκούσατε *Ἰούδα¹ τοῦ πατρὸς ὑμῶν⁷² καὶ φυλάξασθε⁹ τοὺς λόγους μου¹⁰ τοῦ ποιεῖν⁷ πάντα¹¹ τὰ δικαιώματα Κυρίου¹³ καὶ ὑπακούειν¹⁴ ἐντολαῖς⁵ Θεοῦ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/001.yaml
  text: 'And now I command you, my children: listen to Judah, your father, and keep my words in your hearts, to do all the righteous commands of the Lord and to obey the commands of God.'
translation:
  language: ko
  text: '그리고 이제 내가 너희에게 명합니다, 내 자녀들아: 너희 아버지 유다의 말을 들으십시오. 또 내 말을 마음에 간직하여 주님의 모든 의로운 명령을 행하고 하나님의 명령에 순종하십시오.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  english_pob_choice: I command you
  chosen_korean: 내가 너희에게 명합니다
  alternatives_korean:
  - 내가 너희에게 명령합니다
  - 내가 너희를 명합니다
  lexicon: ἐντέλλομαι
  rationale: 단순한 요청이 아니라 권위를 가진 명령이라는 점을 살려 ‘명합니다’로 옮겼습니다.
- source_word: ἀκούσατε
  english_pob_choice: listen to
  chosen_korean: 말을 들으십시오
  alternatives_korean:
  - 들으십시오
  - 귀를 기울이십시오
  lexicon: ἀκούω
  rationale: 청종의 뜻을 분명히 하되, 한국어로는 자연스러운 직접 명령형 ‘들으십시오’를 사용했습니다.
- source_word: φυλάξασθε τοὺς λόγους μου
  english_pob_choice: keep my words in your hearts
  chosen_korean: 내 말을 마음에 간직하여
  alternatives_korean:
  - 내 말을 지켜
  - 내 말을 간직하고
  lexicon: φυλάσσω + λόγοι
  rationale: 본문의 ‘지키다/보존하다’ 뉘앙스를 살리면서, 영어 POB의 audit trail에 있는 ‘in your hearts’를 한국어 관용으로 자연스럽게 반영했습니다.
- source_word: τὰ δικαιώματα Κυρίου
  english_pob_choice: the righteous commands of the Lord
  chosen_korean: 주님의 모든 의로운 명령
  alternatives_korean:
  - 주님의 의로운 규례들
  - 주님의 모든 의로운 규정
  lexicon: δικαίωμα
  rationale: 여기서는 단순 규칙보다 ‘의로운 명령/규례’의 성격이 강하므로 ‘의로운 명령’으로 옮겼고, ‘모든’으로 συνολική 범위를 살렸습니다.
theological_decisions:
- issue: Κυρίου / Θεοῦ의 존칭 처리
  chosen_reading: κυρίου는 ‘주님’, θεοῦ는 ‘하나님’으로 구분하여 번역했습니다.
  alternative_readings:
  - 둘 다 ‘주님’으로 통일
  - 둘 다 ‘하나님’으로 통일
  rationale: 본문이 같은 절 안에서 두 호칭을 병렬로 사용하므로, 한국어에서도 구분을 유지해 원문 대비를 드러냈습니다.
  doctrine_reference: 본문의 병렬 호칭 구분
- issue: 직접 خطاب의 문체
  chosen_reading: ‘내 자녀들아’와 명령형 ‘들으십시오/간직하여/행하고/순종하십시오’로 권면의 어조를 유지했습니다.
  alternative_readings:
  - 더 완곡한 권고체
  - 평서형으로 완화
  rationale: 원문은 유언적 권면이 아니라 명시적 명령이므로, 합쇼체 안에서도 명령성과 긴급성을 유지했습니다.
  doctrine_reference: 권위 있는 훈계/권면의 수사
