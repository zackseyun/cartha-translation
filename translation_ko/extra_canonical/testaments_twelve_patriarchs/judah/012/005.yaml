base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/005.yaml
  text: But I, not knowing what I had done, wanted to kill her. But she sent the pledges secretly and put me to shame.
translation:
  language: ko
  text: 하지만 저는 제가 무엇을 했는지 알지 못한 채 그녀를 죽이려 했습니다. 그러나 그녀가 그 보증물들을 몰래 보내어 저를 수치스럽게 했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγνοῶν δὲ ἐγώ
  english_pob_choice: But I, not knowing what I had done
  chosen_korean: 하지만 저는 제가 무엇을 했는지 알지 못한 채
  alternatives_korean:
  - 그런데 저는 제가 무엇을 했는지 모르고
  - 하지만 저는 제 행동을 알지 못한 채
  lexicon: Ἀγνοῶν / ἀγνοέω
  rationale: ἀγνοῶν은 단순한 무지보다 ‘무엇을 했는지 알지 못함’이라는 행위-인식의 결핍을 드러내므로, 문맥을 살려 ‘제가 무엇을 했는지 알지 못한 채’로 옮겼습니다.
- source_word: ἤθελον αὐτὴν ἀνελεῖν
  english_pob_choice: wanted to kill her
  chosen_korean: 그녀를 죽이려 했습니다
  alternatives_korean:
  - 그녀를 죽이고자 했습니다
  - 그녀를 죽일 생각이었습니다
  lexicon: ἀνελεῖν / ἀναιρέω
  rationale: ἀνελεῖν은 ‘죽이다, 제거하다’의 직접적 의미를 가지므로 완곡화하지 않고 ‘죽이려 했습니다’로 직역에 가깝게 옮겼습니다.
- source_word: τοὺς ἀρραβῶνας
  english_pob_choice: the pledges
  chosen_korean: 그 보증물들을
  alternatives_korean:
  - 그 약혼물들을
  - 그 담보물들을
  lexicon: ἀρραβών
  rationale: ἀρραβών은 약혼의 ‘보증물/계약금’에 해당하는 표지이므로, 본문상 물건으로서의 성격을 살려 ‘보증물들’로 옮겼습니다.
- source_word: κατῄσχυνέ με
  english_pob_choice: put me to shame
  chosen_korean: 저를 수치스럽게 했습니다
  alternatives_korean:
  - 저를 부끄럽게 했습니다
  - 저에게 수치를 안겼습니다
  lexicon: καταισχύνω
  rationale: καταισχύνω는 단순한 감정적 ‘부끄러움’보다 공개적 수치와 망신을 포함하므로, 그 강도를 살려 ‘수치스럽게 했습니다’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 행위 묘사와 정서 강도
  chosen_reading: 원문이 드러내는 살해 의도와 공개적 수치를 완화하지 않고 그대로 반영했습니다.
  alternative_readings:
  - ‘해치려 했습니다’처럼 완화하는 번역
  - ‘망신을 주었습니다’처럼 사회적 수치로만 좁히는 번역
  rationale: 서사적 회고에서 인물의 죄책감과 수치가 핵심이므로, 독자가 본문이 지닌 도덕적 긴장을 즉시 파악하도록 직접적으로 옮겼습니다.
  doctrine_reference: 서사 본문의 도덕적 책임과 수치/명예 어휘의 보존
