translation:
  language: ko
  text: 그때 나는 마흔여섯 살이었고, 이집트에서 일흔세 해를 지냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤμην δὲ ἐγὼ ἐτῶν τεσσαράκοντα καὶ ἓξ
  english_pob_choice: Now I was forty-six years old
  chosen_korean: 그때 나는 마흔여섯 살이었고
  alternatives_korean:
  - 나는 이제 마흔여섯 살이었고
  - 나는 마흔여섯 살이었습니다
  lexicon: ἤμην ... ἐτῶν
  rationale: 직역하면 ‘나는 … 세였다’이지만, 한국어에서는 나이를 자연스럽게 ‘마흔여섯 살’로 풀어 당시 시점을 나타내는 ‘그때’와 함께 옮기는 것이 가장 자연스럽습니다.
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  english_pob_choice: I spent seventy-three years in Egypt
  chosen_korean: 이집트에서 일흔세 해를 지냈습니다
  alternatives_korean:
  - 이집트에서 일흔세 해를 보냈습니다
  - 이집트에서 일흔세 해를 살았습니다
  lexicon: ἐποίησα ... εἰς Αἴγυπτον
  rationale: ἐποίησα는 단순한 ‘살다’보다 ‘보내다/지내다’의 지속 경과를 더 잘 드러내므로, 거주 기간을 세는 문맥에 맞게 ‘지냈습니다’로 옮겼습니다.
- source_word: Αἴγυπτον
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  - 이집트 땅
  lexicon: Αἴγυπτος
  rationale: 본문이 지칭하는 지명은 현대 표준 표기인 ‘이집트’가 가장 직접적이며, 특별한 성서 전통어 ‘애굽’을 고집할 문맥상 이유가 없습니다.
