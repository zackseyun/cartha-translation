  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καλέσας δὲ αὐτὴν⁴⁵, ἤκουσα καὶ τοὺς ἐν μυστηρίῳ λόγους⁴⁶, *οὓς καθεύδων σὺν αὐτῇ ἐν τῇ μέθῃ μου⁴⁷ ἐλάλησα. *Καὶ οὐκ ἠδυνήθην ἀνελεῖν αὐτήν, ὅτι παρὰ Κυρίου ἦν⁴⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/006.yaml
  text: And when I called her, I also heard the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord.
translation:
  language: ko
  text: 그녀를 불렀을 때, 저는 또한 비밀의 말들을 들었습니다. 곧 잠들어 술에 취한 상태에서 그녀와 함께 있을 때 제가 말했던 것들입니다. 저는 그녀를 죽일 수 없었습니다. 그것이 주님께로부터 온 일이었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καλέσας δὲ αὐτήν
  english_pob_choice: And when I called her
  chosen_korean: 그녀를 불렀을 때
  alternatives_korean:
  - 그녀를 불렀는데
  - 그녀를 부르자
  lexicon: καλέω
  rationale: 분사구문을 한국어 시간 부사절로 자연스럽게 옮겨, 사건의 선후를 분명히 하면서도 원문의 전개를 유지했습니다.
- source_word: τοὺς ἐν μυστηρίῳ λόγους
  english_pob_choice: the secret words
  chosen_korean: 비밀의 말들
  alternatives_korean:
  - 비밀한 말들
  - 비밀스러운 말들
  lexicon: λόγος
  rationale: μυστήριον의 은밀함을 살리되, 한국어에서 과도하게 종교화하지 않고 원문의 ‘비밀한 발화’ 의미를 반영했습니다.
- source_word: ἐν τῇ μέθῃ μου
  english_pob_choice: in my drunkenness
  chosen_korean: 술에 취한 상태에서
  alternatives_korean:
  - 내가 술에 취해 있을 때
  - 내 취중에
  lexicon: μέθη
  rationale: 행위의 상태를 분명히 하면서도 문어적으로 읽히는 표현을 택해, 원문이 말하는 취중 발화를 직접적으로 드러냈습니다.
- source_word: οὐκ ἠδυνήθην ἀνελεῖν αὐτήν
  english_pob_choice: I was not able to kill her
  chosen_korean: 저는 그녀를 죽일 수 없었습니다
  alternatives_korean:
  - 저는 그녀를 죽이지 못했습니다
  - 그녀를 죽일 수 없었습니다
  lexicon: ἀναιρέω
  rationale: ἀναιρέω의 직접적 의미를 따라 ‘죽이다’로 옮겼고, 능력 부정은 ‘-할 수 없었습니다’로 자연스럽게 표현했습니다.
- source_word: παρὰ Κυρίου ἦν
  english_pob_choice: it was from the Lord
  chosen_korean: 그것이 주님께로부터 온 일이었기 때문입니다
  alternatives_korean:
  - 그것이 주님에게서 온 것이었기 때문입니다
  - 그것은 주님께로부터였습니다
  lexicon: παρά + genitive / κύριος
  rationale: παρά + 속격의 출처 의미를 살려 ‘주님께로부터 온 일’로 풀었고, 문맥상 사태의 원인을 설명하는 종속절로 자연화했습니다.
theological_decisions:
- issue: 원문이 ‘주님’으로 말하는 신적 출처 진술의 보존
  chosen_reading: 사건이 단순한 우연이 아니라 ‘주님께로부터 온 일’로 제시되도록 옮겼습니다.
  alternative_readings:
  - ‘하나님께로부터 온 일이었습니다’
  - ‘주께로부터였습니다’
  rationale: 본문은 Κυρίου를 직접 언급하며, 내러티브는 그 일이 야훼/주님의 허용 아래 있었음을 강조합니다. 한국어에서는 문맥상 일반 독자에게 자연스러운 ‘주님’을 유지하되, 출처성과 원인성을 분명히 했습니다.
  doctrine_reference: 섭리와 허용의 진술
- issue: 성적·도덕적 타락의 서술을 완곡하게 약화하지 않음
  chosen_reading: ‘술에 취한 상태에서 그녀와 함께 있을 때’와 ‘죽일 수 없었습니다’를 그대로 유지해 원문의 충격과 자기고발성을 살렸습니다.
  alternative_readings:
  - 더 완곡한 표현으로 순화
  - 사건의 폭력성을 약화하는 표현
  rationale: 원문은 취중의 부정행위와 살해 시도 불능을 직접적으로 말하므로, 한국어에서도 도덕적 긴장을 희석하지 않는 것이 स्रोत에 충실합니다.
  doctrine_reference: 서사 윤리의 직접성
