id: T12P.JUD.12.7
reference: Testament of Judah 12:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Ἔλεγον γάρ· Μήποτε ἐν δολιότητι ἐποίησε παρὰ ἑτέρας λαβοῦσα τοὺς ἀρραβῶνας⁴⁹, *καὶ τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/007.yaml
  text: For I said, “Perhaps she acted deceitfully, having received the pledge from another.”
translation:
  language: ko
  text: 나는 말했습니다. “아마도 그는 다른 사람에게서 그 보증물을 받은 뒤, 속임수로 행동했을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον γάρ
  english_pob_choice: For I said
  chosen_korean: 나는 말했습니다
  alternatives_korean:
  - 내가 말했습니다
  - 나는 생각했습니다
  lexicon: λέγω
  rationale: 1인칭 단수 과거의 발화를 자연스러운 합쇼체로 옮기되, 단순 내적 추정이 아니라 실제 발화임을 드러내기 위해 ‘말했습니다’를 택했습니다.
- source_word: ἐν δολιότητι ἐποίησε
  english_pob_choice: acted deceitfully
  chosen_korean: 속임수로 행동했을 것입니다
  alternatives_korean:
  - 간사하게 행했을 것입니다
  - 속임수 가운데 행했을 것입니다
  lexicon: δόλος
  rationale: POB의 ‘acted deceitfully’를 따라 행위의 방식이 ‘속임수’였음을 분명히 했고, 한국어에서 자연스러운 부사어 구조로 처리했습니다.
- source_word: τοὺς ἀρραβῶνας
  english_pob_choice: the pledge
  chosen_korean: 그 보증물
  alternatives_korean:
  - 그 담보
  - 그 계약금
  lexicon: ἀρραβών
  rationale: ἀρραβών은 단순한 금전이 아니라 약속의 담보·증표이므로, 전통적 교회 용어보다 의미를 드러내는 ‘보증물’을 선택했습니다.
- source_word: παρὰ ἑτέρας
  english_pob_choice: from another
  chosen_korean: 다른 사람에게서
  alternatives_korean:
  - 다른 이에게서
  - 다른 여자에게서
  lexicon: ἕτερος
  rationale: POB가 ‘another’로만 제한한 점을 따라, 원문이 명시하지 않는 ‘여자’를 덧붙이지 않고 성별을 특정하지 않는 표현으로 옮겼습니다.
theological_decisions:
- issue: 화자의 추정 표현을 어떻게 옮길지
  chosen_reading: μήποτε를 반영해 ‘아마도’로 옮겨, 확정이 아닌 추정을 유지했습니다.
  alternative_readings:
  - 아마
  - 혹시
  rationale: 원문은 사실 진술이 아니라 추측이므로, 한국어에서도 판단의 유보를 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 해석적 보수성 / 서사 내 화자 신뢰도 보존
