  text: Μεθυσθεὶς οὖν²⁰ οἴνῳ²¹ οὐκ ἐπέγνων²² αὐτὴν²³, καὶ ἠπάτησέ²⁴ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος²⁵ τῆς κοσμήσεως.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/003.yaml
  text: So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment.
translation:
  language: ko
  text: 그러므로 내가 포도주에 취하여 그 여인을 알아보지 못하였고, 그녀의 아름다움이 그 장식의 외양을 통하여 나를 속였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς ... οἴνῳ
  english_pob_choice: when I was drunk with wine
  chosen_korean: 포도주에 취해
  alternatives_korean:
  - 술에 취해
  - 포도주로 취해
  lexicon: μεθύω / οἶνος
  rationale: ‘포도주에 취해’는 원문의 수단·상태를 자연스럽게 살리면서도, POB 영어의 ‘drunk with wine’과 직접 대응합니다.
- source_word: οὐκ ἐπέγνων αὐτὴν
  english_pob_choice: I did not recognize her
  chosen_korean: 그 여인을 알아보지 못하였고
  alternatives_korean:
  - 그녀를 알아보지 못하였고
  - 그 여인을 알아보지 못했고
  lexicon: ἐπιγινώσκω
  rationale: 문맥상 단순 인식 실패를 넘어 ‘알아보지 못하다’가 가장 자연스럽고, 대상이 여성임을 드러내기 위해 ‘그 여인’을 택했습니다.
- source_word: ἠπάτησέ με
  english_pob_choice: she deceived me
  chosen_korean: 나를 속였습니다
  alternatives_korean:
  - 나를 기만했습니다
  - 나를 속였고
  lexicon: ἀπατάω
  rationale: 원문의 직접적 동사 의미를 따라 ‘속였습니다’로 옮겨, 자기기만이 아닌 외적 기만을 분명히 했습니다.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  english_pob_choice: by her beauty through the appearance of her adornment
  chosen_korean: 자기의 아름다움으로, 곧 그 장식의 모습을 통해
  alternatives_korean:
  - 그 장식의 겉모습을 통해 아름다움으로
  - 장식의 외형을 통해
  lexicon: σχῆμα / κόσμησις
  rationale: 영어 POB의 ‘by her beauty through the appearance of her adornment’를 반영해, 아름다움이 기만의 수단이고 ‘장식의 모습’이 그 외적 형식을 설명하도록 유지했습니다.
theological_decisions:
- issue: 미적 매혹과 도덕적 타락의 관계
  chosen_reading: 아름다움 자체를 선악으로 규정하지 않고, 그 아름다움이 사람을 속이는 매개가 되었음을 그대로 드러냈습니다.
  alternative_readings:
  - 아름다움이 나를 미혹하였다
  - 그녀의 장식이 나를 속였다
  rationale: 원문은 아름다움의 본질적 악이 아니라, 취한 상태에서 그것이 기만의 통로가 되었음을 말하므로 그 긴장을 보존했습니다.
  doctrine_reference: 인간의 인식 왜곡과 유혹에 대한 성서적 경고
