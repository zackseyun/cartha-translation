    rationale: 그리스어는 ‘그녀의 아름다움’(τὸ κάλλος αὐτῆς)을 ἠπάτησέ의 주어로 두며, 여인 자신이 아름다움을 수단으로 속였다고 직접 말하지 않습니다. 원문의 책임 귀속과 표현상의 미묘함을 보존해야 합니다.
  revised_text: 그러므로 내가 포도주에 취하여 그 여인을 알아보지 못하였고, 그녀의 아름다움이 그 장식의 외양을 통하여 나를 속였습니다.
