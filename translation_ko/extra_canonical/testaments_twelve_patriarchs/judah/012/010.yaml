  text: And I supposed that no one knew that I had gone in to her.
translation:
  language: ko
  text: 그리고 나는 내가 그녀에게 들어간 것을 아무도 알지 못한다고 생각했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐνόμιζον
  english_pob_choice: And I supposed
  chosen_korean: 그리고 나는 … 생각했습니다
  alternatives_korean:
  - 그리고 나는 … 여겼습니다
  - 그리고 나는 … 짐작했습니다
  lexicon: ἐνομίζον
  rationale: 과거의 내적 판단을 자연스럽게 드러내기 위해 ‘생각했습니다’를 택했으며, 문두의 Καὶ는 서술 흐름을 이어 주는 ‘그리고’로 옮겼습니다.
- source_word: οὐδεὶς ἔγνω
  english_pob_choice: no one knew
  chosen_korean: 아무도 … 알아차리지 못했다고
  alternatives_korean:
  - 아무도 … 알지 못했다고
  - 누구도 … 모르고 있었다고
  lexicon: οὐδείς + γινώσκω
  rationale: 단순한 지식 부재보다 ‘알아차리다’가 문맥상 은밀한 प्रवेश/침입의 뉘앙스를 더 잘 살려 주므로, ‘아무도 알아차리지 못했다’로 옮겼습니다.
- source_word: ὅτι εἰσῆλθον πρὸς αὐτήν
  english_pob_choice: that I had gone in to her
  chosen_korean: 내가 그녀에게 들어갔다는 것을
  alternatives_korean:
  - 내가 그녀와 동침했다는 것을
  - 내가 그녀에게 들어갔다는 사실을
  lexicon: εἰσέρχομαι + πρὸς αὐτήν
  rationale: 원문은 직접적으로 ‘들어가다’라는 표현을 쓰므로 이를 유지했으며, 한국어에서 통상적으로 성적 행위를 암시할 수 있는 관용은 문맥을 넘어서므로 본문에는 넣지 않았습니다.
theological_decisions:
- issue: 성적 암시를 직접화할지 여부
  chosen_reading: 본문은 원문의 직접 표현을 따라 ‘그녀에게 들어갔다’로 유지했습니다.
  alternative_readings:
  - ‘그녀와 동침했다’로 의미를 명시
  - ‘그녀와 관계했다’로 완곡화
  rationale: 히브리/헬라 서술에서 ‘들어가다’는 성적 관계를 암시할 수 있지만, 여기서는 서술자의 은폐 의식이 핵심이므로 해석을 과도하게 앞당기지 않고 원문 표현을 보존했습니다.
  doctrine_reference: source fidelity
