id: T12P.JUD.12.4
reference: Testament of Judah 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ ἐκκλίνας²⁶ πρὸς αὐτὴν εἶπον²⁶· *Εἰσέρχομαι²⁷ πρὸς σε. *Καὶ²⁸ εἶπεν¹³¹· Τί μοι δώσεις³²; καὶ δέδωκα³³ αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου³⁷ *εἰς ἀρραβῶνα³⁸. *Καὶ ὡς συνήλθον³⁹ αὐτῇ συνελήφθη⁴⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/004.yaml
  text: And turning aside to her, I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived.
translation:
  language: ko
  text: 그녀에게 몸을 돌려 나는 말했습니다. “내가 당신에게 들어가겠습니다.” 그러자 그녀가 말했습니다. “무엇을 주시겠습니까?” 나는 그녀에게 내 지팡이와 내 반지와 내 왕국의 관을 보증물로 주었습니다. 그리고 내가 그녀에게 들어갔을 때, 그녀는 잉태했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  english_pob_choice: turning aside to her
  chosen_korean: 그녀에게 몸을 돌려
  alternatives_korean:
  - 그녀 쪽으로 비켜서
  - 그녀에게로 방향을 틀어
  lexicon: ἐκκλίνω
  rationale: 물리적으로 방향을 바꾸는 동작을 자연스럽게 살리되, 과도한 해설 없이 서술 흐름을 유지했습니다.
- source_word: Εἰσέρχομαι πρὸς σε
  english_pob_choice: I will come in to you
  chosen_korean: 내가 당신에게 들어가겠습니다
  alternatives_korean:
  - 내가 당신에게 들어오겠습니다
  - 내가 당신에게 가겠습니다
  lexicon: εἰσέρχομαι
  rationale: 성적 접촉을 우회하지 않는 직설적 표현으로 옮기되, 원문의 미래형·직접 발화를 반영했습니다.
- source_word: τὴν ῥάβδον μου καὶ τὸ διάδημά μου
  english_pob_choice: my staff and my ring and the diadem of my kingdom
  chosen_korean: 내 지팡이와 내 반지와 내 왕국의 관
  alternatives_korean:
  - 내 지팡이와 내 인장반지와 내 왕국의 관
  - 내 막대기와 내 반지와 내 왕국의 관
  lexicon: ῥάβδος / διάδημα
  rationale: ῥάβδος는 일반적으로 ‘지팡이’, διάδημα는 왕권 표지로서 ‘관’이 가장 자연스럽고, English POB의 ‘diadem of my kingdom’ 의미도 보존했습니다.
- source_word: εἰς ἀρραβῶνα
  english_pob_choice: as a pledge
  chosen_korean: 보증물로
  alternatives_korean:
  - 담보로
  - 약속의 증표로
  lexicon: ἀρραβών
  rationale: 단순한 ‘약속’보다 실제로 건네는 담보/보증의 성격을 드러내기 위해 ‘보증물’로 옮겼습니다.
- source_word: συνελήφθη
  english_pob_choice: she conceived
  chosen_korean: 그녀는 잉태했습니다
  alternatives_korean:
  - 그녀는 임신했습니다
  - 그녀는 수태했습니다
  lexicon: συλλαμβάνω
  rationale: 생물학적 결과를 직접 진술하는 간결한 번역으로, 서사 맥락에 맞는 전통적·현대적 균형을 취했습니다.
theological_decisions:
- issue: 간음/유혹 장면의 직설성
  chosen_reading: 원문과 POB의 의미를 따라 관계의 성적 행위를 완곡하게 약화하지 않고 직접적으로 표현했습니다.
  alternative_readings:
  - ‘들어가다’를 단순 방문처럼 완화하는 번역
  - ‘보증물’을 추상적 약속으로 바꾸는 번역
  rationale: 이 대목은 서사적 충격과 도덕적 긴장을 의도적으로 드러내므로, 현대 한국어에서도 그 긴장을 보존하는 쪽이 원문 충실도에 맞습니다.
  doctrine_reference: 서사 본문의 사실성·도덕적 경고 보존
- issue: ‘왕국의 관’ 표현
  chosen_reading: ‘관’으로 옮겨 왕권의 표지를 드러냈습니다.
  alternative_readings:
  - ‘면류관’
  - ‘왕관’
  rationale: ἰδιάδημα는 통치권의 표지로서 왕권을 가리키므로, 통치 상징을 분명히 하되 특정 교회 전통 용어로 굳히지 않았습니다.
  doctrine_reference: 왕권 표지의 상징성
