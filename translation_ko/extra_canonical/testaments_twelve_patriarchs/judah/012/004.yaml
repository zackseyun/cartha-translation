revisions:
- from: 그녀에게 몸을 돌려 나는 말했습니다. “내가 당신에게 들어가겠습니다.” 그러자 그녀가 말했습니다. “무엇을 주시겠습니까?” 나는 그녀에게 내 지팡이와 내 반지와 내 왕국의 관을 보증물로 주었습니다. 그리고 내가 그녀에게 들어갔을 때, 그녀는 잉태했습니다.[a]
  to: 그녀 쪽으로 몸을 돌려 나는 말했습니다. “내가 당신에게 들어가겠습니다.” 그러자 그녀가 말했습니다. “무엇을 주시겠습니까?” 나는 그녀에게 내 지팡이와 내 관을 보증물로 주었습니다. 그리고 내가 그녀에게 들어갔을 때, 그녀는 잉태했습니다.
  rationale: 그리스어 원문을 우선하여, 영어 감사 이력에 있으나 원문에는 없는 ‘반지’와 ‘왕국의’를 삭제했습니다. 성적 관계를 가리키는 원문의 완곡한 동사 표현은 한국어에서도 ‘들어가다’로 유지했으며, 문맥상 의미를 약화하지 않았습니다. 대응 각주가 없는 표지도 제거했습니다.
