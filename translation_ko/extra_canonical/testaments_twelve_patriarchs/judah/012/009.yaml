  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/009.yaml
  text: Yet those in the city said that there had been no prostitute at the gate, because she had come from another place and sat at the gate for a short time.
translation:
  language: ko
  text: 그러나 성 안에 있던 사람들은, 그 문 앞에 창녀가 없었다고 말했습니다. 왜냐하면 그녀는 다른 곳에서 와서 잠시 동안 그 문 앞에 앉아 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  english_pob_choice: those in the city
  chosen_korean: 성 안에 있던 사람들
  alternatives_korean:
  - 도성에 있던 사람들
  - 도시 안에 있던 사람들
  lexicon: ἐν + πόλις
  rationale: 공간적 위치를 자연스러운 한국어로 살리되, 서술의 주체가 된 ‘사람들’임을 분명히 했습니다.
- source_word: τελεσικόμενον
  english_pob_choice: a prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 음녀
  lexicon: τελεσικόμενον
  rationale: 문맥상 성매매 여성에 대한 직접적 지칭이므로, 우회적이거나 전통 교회어에 치우친 표현보다 원뜻을 곧바로 드러내는 말을 택했습니다.
- source_word: ἐν τῇ πύλῃ
  english_pob_choice: at the gate
  chosen_korean: 그 문 앞에
  alternatives_korean:
  - 문에서
  - 성문에서
  lexicon: πύλη
  rationale: πύλη는 단순한 문보다 성문/문어귀의 맥락이 강하므로, 여기서는 반복되는 위치 감각을 살려 ‘문 앞에’로 옮겼습니다.
- source_word: πρὸς βραχὺ ἐκαθέσθη
  english_pob_choice: sat at the gate for a short time
  chosen_korean: 잠시 동안 ... 앉아 있었기 때문입니다
  alternatives_korean:
  - 짧은 시간만 ... 앉아 있었기 때문입니다
  - 얼마 되지 않아 ... 앉아 있었기 때문입니다
  lexicon: πρὸς βραχὺ + καθίζω
  rationale: 짧은 지속 시간을 자연스러운 현대 한국어로 풀어, 원문의 ‘잠깐’이라는 시간상 대비를 분명히 했습니다.
theological_decisions:
- issue: 이 구절의 성격
  chosen_reading: 설화적 진술로 처리하고, 도덕적 평가어를 추가하지 않았습니다.
  alternative_readings:
  - 교훈적 경구처럼 윤색함
  - ‘창녀’ 대신 완곡어를 써서 비판성을 낮춤
  rationale: 본문은 인물의 발화 내용을 기록하는 서술이므로, 원문이 드러내는 사회적 낙인을 약화시키지 않되 불필요한 확대 해석도 하지 않았습니다.
  doctrine_reference: source-text fidelity
