  text: And after this we came into Egypt to Joseph because of the famine.
translation:
  language: ko
  text: 그리고 그 뒤에 우리는 기근 때문에 요셉에게로 이집트에 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after this
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 이 일 뒤에
  - 그 후에
  lexicon: μετά + ταῦτα
  rationale: 시간적 순서를 자연스럽게 살리면서도 문어체로 간결하게 옮겼습니다.
- source_word: ἤλθομεν
  english_pob_choice: we came
  chosen_korean: 우리는 갔습니다
  alternatives_korean:
  - 우리는 왔습니다
  - 우리가 왔습니다
  lexicon: ἔρχομαι
  rationale: 이동의 결과를 한국어 서술로 자연스럽게 표현하되, 화자 포함 1인칭 복수를 유지했습니다.
- source_word: εἰς Αἴγυπτον
  english_pob_choice: into Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 애굽으로
  - 이집트 안으로
  lexicon: Αἴγυπτος
  rationale: 현대 표준어 독자성을 위해 지명은 ‘이집트’로 옮기되, 전치사 εἰς의 방향성을 ‘-로’로 반영했습니다.
- source_word: πρὸς Ἰωσήφ
  english_pob_choice: to Joseph
  chosen_korean: 요셉에게
  alternatives_korean:
  - 요셉에게로
  - 요셉 앞에
  lexicon: πρός + 인명
  rationale: 대상/향함의 관계를 한국어 여격으로 자연스럽게 나타냈습니다.
- source_word: διὰ τὸν λιμόν
  english_pob_choice: because of the famine
  chosen_korean: 기근 때문에
  alternatives_korean:
  - 기근으로 인해
  - 기근 때문에의
  lexicon: διά + 대격
  rationale: 원인 관계를 직설적으로 옮겼으며, 명사 ‘기근’은 성경 문맥에서 가장 직접적인 표현입니다.
theological_decisions:
- issue: 이집트/애굽 표기
  chosen_reading: 본문에는 현대 지명인 ‘이집트’를 사용했습니다.
  alternative_readings:
  - 애굽으로
  - 이집트(애굽)로
  rationale: 이 구절은 고유한 구속사 용어보다 지리적 이동을 말하므로, 현대 독자에게 즉시 이해되는 표기를 택했습니다.
  doctrine_reference: source clarity / readability
