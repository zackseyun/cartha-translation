    rationale: ‘이집트로 요셉에게 갔습니다’는 한국어에서 부사어의 결합이 매끄럽지 않고, 원문 ἤλθομεν(우리는 왔다)의 서술 관점을 ‘갔다’로 바꿉니다. ‘요셉에게로 이집트에 왔습니다’는 목적지와 대상을 자연스럽게 연결하고 ‘왔다’를 보존합니다.
  revised_text: 그리고 그 뒤에 우리는 기근 때문에 요셉에게로 이집트에 왔습니다.
