  source_fidelity: 원문의 시간 순서, 1인칭 복수 주어, 기근이라는 원인, 이집트와 요셉을 향한 이동은 모두 반영되어 있습니다. 다만 ‘이집트로 요셉에게 갔습니다’는 두 방향/대상 부사가 연속되어 한국어 문장 구조상 부자연스럽고, ἤλθομεν의 ‘왔습니다’보다 ‘갔습니다’를 택한 것은 원문의 서술 관점을 약화합니다.
  naturalness: ‘요셉에게로 이집트에 왔습니다’로 어순을 정리하면, 이집트에 와서 요셉을 찾아온 의미를 자연스럽게 전달하면서 원문의 단일 이동 서술을 유지합니다.
  terminology: ‘이집트’, ‘요셉’, ‘기근’은 현대 표준어 성경 문맥에 적절하며, 합쇼체 서술 종결도 일관됩니다.
