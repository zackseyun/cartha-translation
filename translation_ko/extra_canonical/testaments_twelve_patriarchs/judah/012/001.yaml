id: T12P.JUD.12.1
reference: Testament of Judah 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XII. *Μετὰ δὲ ταῦτα¹ *χηρευούσης τῆς Θαμὰρ² *μετὰ ἔτη δύο³ ἀκούσασα ὅτι ἀνέρχομαι⁵ τοῦ κεῖραι⁶ τὰ πρόβατα⁷, *κοσμηθεῖσα κόσμῳ νυμφικῷ ἐκάθισεν⁸ *ἐν Ἐνὰν¹⁰ *τῇ πόλει¹¹ *πρὸς τὴν πύλην¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/001.yaml
  text: After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal attire and sat in Enaim, at the city gate of the inn.
translation:
  language: ko
  text: 그 후, 다말은 과부가 된 지 두 해가 지났을 때 내가 양의 털을 깎으러 올라간다는 말을 듣고, 신부 차림으로 단장하여 에나임 성읍의 성문 곁에 앉았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμὰρ ... μετὰ ἔτη δύο
  english_pob_choice: when Tamar had been a widow for two years
  chosen_korean: 다말이 두 해 동안 과부로 지내다가
  alternatives_korean:
  - 다말이 두 해 동안 과부였을 때
  - 다말이 두 해 동안 홀로 지내다가
  lexicon: χηρεύω
  rationale: 과부 상태의 지속을 자연스럽게 드러내되, 단순 상태 설명보다 경과를 나타내는 표현으로 원문의 시간 흐름을 살렸습니다.
- source_word: ἀκούσασα ὅτι ἀνέρχομαι τοῦ κεῖραι τὰ πρόβατα
  english_pob_choice: heard that I was going up to shear the sheep
  chosen_korean: 내가 양털을 깎으러 올라간다는 것을 듣고
  alternatives_korean:
  - 내가 양을 깎으러 올라간다는 것을 듣고
  - 내가 양털을 깎으러 올라간다는 소식을 듣고
  lexicon: ἀνέρχομαι / κεῖραι τὰ πρόβατα
  rationale: ‘올라간다’와 ‘양털을 깎다’를 함께 살려 이동과 목축 행위를 모두 드러냈고, 한국어에서 자연스러운 구문으로 정리했습니다.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  english_pob_choice: she adorned herself with bridal attire
  chosen_korean: 신부의 치장으로 몸을 꾸민 뒤
  alternatives_korean:
  - 결혼식 차림으로 몸을 꾸민 뒤
  - 신부의 옷차림으로 단장한 뒤
  lexicon: κοσμέω / κόσμος νυμφικός
  rationale: κόσμῳ νυμφικῷ를 단순한 장식품이 아니라 ‘신부의 차림새/치장’으로 이해해, POB의 ‘bridal attire’와 맞는 자연스러운 표현으로 옮겼습니다.
- source_word: ἐν Ἐνὰν ... πρὸς τὴν πύλην
  english_pob_choice: sat in Enaim, at the city gate of the inn
  chosen_korean: 에나임에서 성읍 성문 곁에 앉았습니다
  alternatives_korean:
  - 에나임에서 여관의 성문 곁에 앉았습니다
  - 에나임, 곧 성읍 문가에 앉았습니다
  lexicon: Ἐνὰν / πύλη
  rationale: 본문의 지리·장소 표지를 살리되, 영어 POB의 ‘inn’은 원문에 직접 없는 해석 요소이므로 본문에는 넣지 않고 ‘성읍 성문 곁’으로 보수적으로 옮겼습니다.
theological_decisions:
- issue: 장소 표지 πρὸς τὴν πύλην의 해석 범위
  chosen_reading: 본문에는 ‘성읍 성문 곁’만 두고, 여관이라는 구체화는 본문 밖으로 미뤘습니다.
  alternative_readings:
  - ‘여관의 성문 곁’으로 번역해 POB의 해석을 따름
  - ‘문간에’처럼 더 일반화함
  rationale: 원문 자체는 ‘문’만 말하므로, 영어 POB의 ‘inn’은 전승/문맥 해석으로 이해해 본문 번역에서 과잉 확정을 피했습니다.
  doctrine_reference: source-criticism and translation transparency
