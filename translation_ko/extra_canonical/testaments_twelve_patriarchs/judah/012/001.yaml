  source_fidelity: 그리스어는 다말이 과부로 지낸 기간, 유다가 양을 깎으러 올라간다는 소식, 신부 차림, 그리고 에나임 성읍의 문 곁이라는 장소를 차례로 말합니다. 현 번역은 대체로 충실하지만, ‘성읍 성문’은 같은 의미를 중복하여 장소 관계를 다소 어색하게 만듭니다. 영어 POB의 ‘inn’은 이 그리스어 본문에 근거가 없으므로 반영하지 않은 점은 적절합니다.
  naturalness: ‘성읍 성문 곁’은 현대 한국어에서 중복적입니다. ‘에나임 성읍의 성문 곁’이 자연스럽고, ‘신부 차림으로 단장하여’는 원문의 단장 행위와 혼인 차림을 간결하게 전달합니다.
