review_pass:
  verdict: revise
  source_fidelity: 현 초안은 그리스어 본문에 없는 ‘공개적으로’, ‘음행 가운데’를 삽입하고, ‘일곱 날 동안’ 및 ‘성문 곁에’라는 명시적 정보를 누락합니다. α-본문은 과부가 성문 곁에 일곱 날 동안 앉아 있어야 한다는 아모리인의 법을 말합니다.
  naturalness: ‘과부는 성문 곁에 일곱 날 동안 앉아 있어야 했습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 요구·규정의 과거 서술을 정확히 나타냅니다.
  terminology: ‘아모리 사람들’, ‘법’, ‘과부’, ‘성문’은 문맥과 고대 지명·민족명 및 제도적 표현에 적절합니다. ‘음행’ 또는 ‘매춘’은 이 제공된 그리스어 본문에 근거하지 않으므로 사용하지 않아야 합니다.
  issues:
  - severity: high
    issue: 성적 행위의 무근거 삽입
    rationale: 제공된 그리스어에는 πορνεία 또는 이에 해당하는 표현이 없습니다. προκαθεσθαι는 앉아 있다/자리 잡고 앉다이며, 뒤따르는 ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην은 기간과 장소를 규정합니다. 영어 감사 문구의 ‘in prostitution’은 이 원문과 일치하지 않습니다.
  - severity: high
    issue: 명시된 기간과 장소의 누락
    rationale: ἐπὶ ἑπτὰ ἡμέρας는 ‘일곱 날 동안’, παρὰ τὴν πύλην은 ‘성문 곁에’를 뜻하며, 둘 다 번역에 보존되어야 합니다.
  - severity: medium
    issue: 영어 POB 감사 경로와 원문 간 불일치
    rationale: 영어문은 기간·장소를 누락한 채 성매춘을 말하지만, 이 검토의 우선 기준인 제시된 α-그리스어 본문은 그러한 내용을 뒷받침하지 않습니다. 원문에 따라 수정하되, 본문 자체의 의미를 넘어 역사적 관행을 단정하지 않습니다.
  revised_text: 이는 아모리 사람들의 법이어서, 과부는 성문 곁에 일곱 날 동안 앉아 있어야 했습니다.
  revised_footnotes: []
  revision_rationale: 그리스어 원문을 우선하여 νόμος를 ‘법’, τὴν χηρεύουσαν을 ‘과부’, προκαθεσθαι를 ‘앉아 있어야 했습니다’, ἐπὶ ἑπτὰ ἡμέρας를 ‘일곱 날 동안’, παρὰ τὴν πύλην을 ‘성문 곁에’로 옮겼습니다. 원문에 없는 성적 의미와 ‘공개적으로’라는 부가 의미는 제거했습니다.
