  text: Νόμος γὰρ ἦν τῶν¹⁴ Ἀμορραίων¹⁵ τὴν *χηρεύουσαν¹⁶ προκαθεσθαι¹⁷ ἐπὶ²⁰ ἑπτὰ ἡμέρας παρὰ τὴν πύλην.
