  text: For it was a law of the Amorites that a widow should sit openly in prostitution.
translation:
  language: ko
  text: 이는 아모리 사람들의 법이어서, 과부가 공개적으로 음행 가운데 앉아 있어야 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νόμος
  english_pob_choice: it was a law
  chosen_korean: 법이어서
  alternatives_korean:
  - 율법이어서
  - 관례이어서
  lexicon: νόμος
  rationale: 여기서는 모세 율법이 아니라 특정 민족의 관습적 규범을 가리키므로, 문맥에 맞게 ‘법’으로 옮겼습니다.
- source_word: τῶν Ἀμορραίων
  english_pob_choice: of the Amorites
  chosen_korean: 아모리 사람들의
  alternatives_korean:
  - 아모리족의
  - 아모리인의
  lexicon: Ἀμορραῖοι
  rationale: 민족 명칭으로 이해해 자연스러운 현대 한국어인 ‘아모리 사람들’로 옮겼습니다.
- source_word: τὴν χηρεύουσαν
  english_pob_choice: a widow
  chosen_korean: 과부가
  alternatives_korean:
  - 과부 여인이
  - 과부가 된 여인이
  lexicon: χηρεύουσα
  rationale: 분사형을 명사적으로 처리해 문장의 주어 역할을 자연스럽게 드러냈습니다.
- source_word: προκαθεσθαι ἐπὶ ... παρὰ τὴν πύλην
  english_pob_choice: should sit openly in prostitution
  chosen_korean: 공개적으로 음행 가운데 앉아 있어야 했습니다
  alternatives_korean:
  - 공개적으로 창녀처럼 앉아 있어야 했습니다
  - 문 앞에 공개적으로 앉아 있어야 했습니다
  lexicon: προκαθέζεσθαι / πορνεία / πύλη
  rationale: 영문 POB의 ‘sit openly in prostitution’을 따라 성적 타락을 분명히 드러내되, 본문이 지시하는 장소를 과하게 덧붙이지 않도록 ‘공개적으로’와 ‘음행 가운데’로 옮겼습니다.
theological_decisions:
- issue: 노골적인 성적 행위 표현의 직역 수준
  chosen_reading: ‘음행 가운데 앉아 있어야 했습니다’로, 본문의 도덕적 충격을 완화하지 않고 전달했습니다.
  alternative_readings:
  - ‘음란한 행위를 해야 했습니다’
  - ‘매춘해야 했습니다’
  rationale: 헬라어와 영문 POB가 암시하는 공개적 성적 타락을 보존하면서도, 과도하게 현대적 직업명으로 축소하지 않았습니다.
  doctrine_reference: 성적 부도덕에 대한 성경의 직접적 경고 표현
