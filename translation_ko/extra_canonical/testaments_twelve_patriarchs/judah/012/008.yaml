base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/008.yaml
  text: But I did not approach her again for the rest of my life, because I had done this abomination in all Israel.
translation:
  language: ko
  text: 그러나 나는 다시는 그녀에게 가까이 가지 않았습니다. 평생 그렇게 했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισα αὐτῇ
  english_pob_choice: I did not approach her again
  chosen_korean: 다시는 그녀에게 가까이 가지 않았습니다
  alternatives_korean:
  - 다시는 그녀에게 다가가지 않았습니다
  - 다시는 그녀와 가까워지지 않았습니다
  lexicon: ἤγγισα
  rationale: 동사는 단순한 물리적 접근을 넘어 성적 접근의 의미를 띨 수 있으므로, 문맥을 과도하게 풀지 않으면서도 한국어로 자연스럽게 ‘가까이 가지 않았다’고 옮겼습니다.
- source_word: ἔτι ἕως τῆς ζωῆς μου
  english_pob_choice: for the rest of my life
  chosen_korean: 평생
  alternatives_korean:
  - 내 생애의 나머지 동안
  - 내 삶이 끝날 때까지
  lexicon: ἔτι / ἕως + genitive
  rationale: 직역하면 ‘내 삶의 끝까지/남은 기간 동안’의 뜻이므로, 한국어에서는 간결하고 의미를 보존하는 ‘평생’으로 옮겼습니다.
- source_word: Ἀλλ᾽
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: ἀλλά
  rationale: 앞선 행위와의 대조를 분명히 하는 접속으로, 문어체 합쇼체에 맞는 ‘그러나’를 선택했습니다.
theological_decisions:
- issue: 본문의 범위가 영어 POB보다 짧고, 원문에는 ‘because I had done this abomination in all Israel’가 없음
  chosen_reading: 그리스어 본문에 있는 내용만 반영해 번역하고, 영어 POB의 확장된 이유절은 본문에 포함하지 않았습니다.
  alternative_readings:
  - 영어 POB를 따라 ‘왜냐하면 내가 온 이스라엘 가운데 이 가증한 일을 행하였기 때문입니다’를 덧붙이는 읽기
  rationale: 제시된 source text는 ‘그러나 나는 다시는 그녀에게 가까이 가지 않았습니다. 평생 그렇게 했습니다.’까지만 담고 있으므로, 영어 본문의 더 긴 진술을 본문으로 끌어오지 않고 원천언어 범위에 맞춰 제한했습니다.
  doctrine_reference: source-bound translation principle
