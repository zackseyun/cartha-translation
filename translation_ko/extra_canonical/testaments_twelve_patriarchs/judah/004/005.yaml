  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ὁ πατήρ μου *Ἰακὼβ⁴³ ἀνεῖλε τὸν †Βελισάθ⁴⁴, βασιλέα⁴⁵ *πάντων τῶν⁴⁶ βασιλέων, ἄνδρα γίγαντα τῇ ἰσχύι πηχῶν δώδεκα⁴⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/005.yaml
  text: Then my father Jacob killed Belisath, king of all, father of kings, a giant man in strength, twelve cubits tall.
translation:
  language: ko
  text: 그때 내 아버지 야곱이 벨리삿을 죽였는데, 그는 모든 왕들의 왕, 곧 힘이 큰 거인 같은 사람이었으며 키가 열두 규빗이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλε
  english_pob_choice: killed
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 죽였다
  - 쳐죽였습니다
  lexicon: ἀναιρέω
  rationale: 서술형 과거로 자연스럽게 옮기되, 단순한 ‘제거하다’보다 POB의 ‘killed’에 맞게 생명을 끊는 의미를 분명히 했습니다.
- source_word: βασιλέα πάντων τῶν βασιλέων
  english_pob_choice: king of all, father of kings
  chosen_korean: 모든 왕들의 왕, 곧 ...
  alternatives_korean:
  - 모든 왕의 왕
  - 모든 왕들 중의 왕
  lexicon: βασιλεύς
  rationale: 영어 개정본의 ‘king of all’과 뒤따르는 ‘father of kings’의 이중 표현을 반영하여, 지배적 왕권과 혈통/기원적 뉘앙스를 함께 살리도록 했습니다.
- source_word: ἄνδρα γίγαντα τῇ ἰσχύι
  english_pob_choice: a giant man in strength
  chosen_korean: 힘이 큰 거인 같은 사람
  alternatives_korean:
  - 힘센 거인
  - 힘에 있어서 거인인 사람
  lexicon: γίγας
  rationale: ‘거인’의 문자적 요소를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘거인 같은 사람’으로 풀어, 크기와 힘의 과장을 함께 전달했습니다.
- source_word: πηχῶν δώδεκα
  english_pob_choice: twelve cubits tall
  chosen_korean: 키가 열두 규빗이었습니다
  alternatives_korean:
  - 열두 규빗이나 되었습니다
  - 열두 규빗 키였습니다
  lexicon: πηχῆς
  rationale: 측정 단위를 유지해 원문의 구체성을 보존했고, ‘tall’의 의미는 ‘키가 ...’로 자연스럽게 보완했습니다.
theological_decisions:
- issue: ‘father of kings’의 왕권 표현을 어떻게 살릴 것인가
  chosen_reading: 모든 왕들의 왕, 곧 ...
  alternative_readings:
  - 모든 왕의 아버지
  - 왕들의 아버지
  rationale: 본문의 두 제목이 단순 반복이 아니라 왕권의 절대성과 출생/기원 이미지를 함께 드러내므로, 직역적이면서도 한국어에서 이해 가능한 방식으로 병치했습니다.
  doctrine_reference: 문학적 칭호의 병렬 표현 보존
