  terminology: ἀμέριμνος는 여기서 ‘염려가 없으셨습니다’로 옮겨 ‘free from anxiety’의 의미를 자연스럽고 격식 있게 보존합니다. πόλεμος의 복수는 한국어 관용상 ‘전쟁 중에’로 포괄하여 처리할 수 있습니다.
