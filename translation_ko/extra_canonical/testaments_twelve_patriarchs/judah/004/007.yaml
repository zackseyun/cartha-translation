source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Διὰ τοῦτο ὁ πατήρ μου ἀμέριμνος⁵² ἦν ἐν τοῖς πολέμοις⁵³, ὅτε⁵⁴ ἐγὼ σὺν τοῖς ἀδελφοῖς μου ἤμην⁵⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/007.yaml
  text: Therefore my father was free from चिंता in the wars while I was with my brothers.
translation:
  language: ko
  text: 그러므로 내 아버지는 전쟁 중에도 근심이 없으셨고, 나는 내 형제들과 함께 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμέριμνος
  english_pob_choice: free from anxiety
  chosen_korean: 근심이 없으셨고
  alternatives_korean:
  - 걱정이 없으셨고
  - 염려가 없으셨고
  lexicon: ἀμέριμνος
  rationale: POB가 ‘free from anxiety’로 의미를 풀었으므로, 전쟁 상황 속에서도 마음의 근심이 없다는 뜻을 자연스럽고 격식 있게 ‘근심이 없으셨고’로 옮겼습니다.
- source_word: ἐν τοῖς πολέμοις
  english_pob_choice: in the wars
  chosen_korean: 전쟁 중에도
  alternatives_korean:
  - 전쟁들 가운데
  - 전쟁 속에서
  lexicon: πόλεμος
  rationale: 복수형 ‘전쟁들’의 형식을 그대로 드러내기보다, 문맥상 여러 전쟁의 상황을 포괄하는 표현으로 ‘전쟁 중에도’가 가장 자연스럽습니다.
- source_word: σὺν τοῖς ἀδελφοῖς μου
  english_pob_choice: with my brothers
  chosen_korean: 내 형제들과 함께
  alternatives_korean:
  - 내 형제들과
  - 형제들과 더불어
  lexicon: σύν
  rationale: 동반 관계를 분명히 하기 위해 ‘함께’를 살렸고, 현대 한국어에서 가장 무리 없는 형태로 정리했습니다.
theological_decisions:
- issue: 서술의 초점이 아버지의 상태와 화자의 동행 관계를 어떻게 배치할지
  chosen_reading: 전쟁 중에도 아버지는 근심이 없었고, 화자는 형제들과 함께 있었다는 인과적 진술로 읽었습니다.
  alternative_readings:
  - 아버지가 근심이 없었던 이유를 ‘내가 형제들과 함께 있었기 때문’으로 더 강하게 연결하는 읽기
  - 단순 병렬 서술로 처리하는 읽기
  rationale: 원문의 Διὰ τοῦτο가 앞선 맥락을 가리키는 인과 표지이므로 ‘그러므로’로 시작하되, 본 절 자체는 아버지의 평안과 화자의 동행을 함께 제시하는 형태로 유지했습니다.
  doctrine_reference: 서사 문맥의 인과 표지 보존 원칙
