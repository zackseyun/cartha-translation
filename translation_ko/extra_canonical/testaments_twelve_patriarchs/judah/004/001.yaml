source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ μετὰ τοῦτο γέγονεν ἡμῖν κατὰ νότον¹ πόλεμος² *τοῦ ἐν Σικίμοις³· καὶ παραταξάμενοι *σὺν τοῖς ἀδελφοῖς⁴ μου ἐδιώξαμεν⁵ χιλίους⁶ καὶ ἀπεκτείναμεν⁷ ἐξ αὐτῶν διακοσίους⁸ *καὶ τέσσαρας βασιλεῖς⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/001.yaml
  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: ko
  text: 그 후에 우리에게 남쪽으로 향한 전쟁이 닥쳤는데, 세겜에서의 전쟁보다 더 컸습니다. 나는 내 형제들과 함께 전투 대형을 갖추었고, 우리는 천 명을 추격하여 그들 가운데 이백 명과 왕 네 명을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ νότον
  english_pob_choice: toward the south
  chosen_korean: 남쪽으로
  alternatives_korean:
  - 남쪽을 향해
  - 남방으로
  lexicon: κατά + accusative
  rationale: 방향을 나타내는 κατά + 대격을 자연스러운 한국어 방향 부사구로 옮겨, 전쟁의 진행 방향이 드러나게 했습니다.
- source_word: πόλεμος
  english_pob_choice: war
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  - 전쟁 소식
  lexicon: πόλεμος
  rationale: 단일 전투가 아니라 실제 충돌 상황을 가리키므로 기본값인 ‘전쟁’을 유지했습니다.
- source_word: παραταξάμενοι
  english_pob_choice: having drawn up in battle
  chosen_korean: 전열을 갖추고 나아가
  alternatives_korean:
  - 전투 대형을 갖추고
  - 진형을 갖추고 나아가
  lexicon: παρατάσσω
  rationale: 군사적 진형 정렬을 반영하되, 한국어 문맥에서는 ‘전열을 갖추다’가 가장 자연스럽고 의미를 보존합니다.
- source_word: ἐδιώξαμεν
  english_pob_choice: we pursued
  chosen_korean: 추격하여
  alternatives_korean:
  - 뒤쫓아
  - 추격했습니다
  lexicon: διώκω
  rationale: 공격적 추격의 결과를 살리되, 앞의 ‘전열을 갖추고 나아가’와 이어지는 서술 흐름에 맞춰 동작 연결형으로 처리했습니다.
theological_decisions:
- issue: 집단 화자의 전쟁 서술을 현대 한국어에서 과도하게 미화하지 않는 표현
  chosen_reading: 직설적인 전쟁·추격·살상 서술을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘싸움’이나 ‘승리’로 순화
  - 살상 수치를 덜 직접적으로 표현
  rationale: 원문은 전쟁의 규모와 결과를 사실적으로 나열하므로, 서술의 충격과 역사적 성격을 줄이지 않는 편이 소스 충실도에 맞습니다.
  doctrine_reference: source fidelity / historical narration
- issue: ‘네 왕’의 수를 보존하는 문제
  chosen_reading: ‘네 왕’을 그대로 옮겼습니다.
  alternative_readings:
  - ‘사방의 왕들’로 해석
  - 왕 네 명으로 풀어쓰기
  rationale: 그리스어 καὶ τέσσαρας βασιλεῖς는 수량을 직접 제시하므로, 추상화하지 않고 그대로 보존해야 합니다.
  doctrine_reference: numerical precision in source translation
