id: T12P.JUD.4.8
reference: Testament of Judah 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Εἶδε⁵⁶ γὰρ⁵⁷ *ἐν ὁράματι⁵⁸ †περὶ ἐμοῦ⁵⁹ ὅτι ἄγγελος δυνάμεως⁶⁰ συνέπεταί μοι⁶¹ ἐν πᾶσι, τοῦ μὴ⁶² ἡττᾶσθαί⁶³ μοι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/008.yaml
  text: For he saw in a vision concerning me that an angel of power accompanied me in all things, so that I might not be touched.
translation:
  language: ko
  text: 그는 내게 관해 환상 속에서 보았는데, 능력의 천사가 모든 일에서 나와 함께하여 내가 해를 입지 않게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁράματι
  english_pob_choice: in a vision
  chosen_korean: 환상 속에서
  alternatives_korean:
  - 환상 가운데
  - 계시 가운데
  lexicon: ὁράμα
  rationale: 시각적 계시의 상황을 자연스러운 현대 한국어로 옮기되, 단순한 꿈보다 더 넓은 ‘환상’의 의미를 유지했습니다.
- source_word: ἄγγελος δυνάμεως
  english_pob_choice: an angel of power
  chosen_korean: 능력의 천사
  alternatives_korean:
  - 권능의 천사
  - 힘의 천사
  lexicon: ἄγγελος; δύναμις
  rationale: δύναμις를 하나님의 능력/권능으로 볼 여지가 있으므로, 직역에 가까운 ‘능력의 천사’를 택해 소속이나 기능의 수식을 남겼습니다.
- source_word: συνέπεταί μοι ἐν πᾶσι
  english_pob_choice: accompanied me in all things
  chosen_korean: 모든 일에서 나와 함께하여
  alternatives_korean:
  - 모든 일에 나와 동행하여
  - 모든 일 가운데 나를 따르며
  lexicon: συνεπέταί; ἐν πᾶσι
  rationale: ‘동행하다’보다 더 직접적으로 ‘함께하여’로 옮겨 동반의 지속성을 살렸고, ἐν πᾶσι는 범위를 나타내는 말로 처리했습니다.
- source_word: τοῦ μὴ ἡττᾶσθαί μοι
  english_pob_choice: so that I might not be touched
  chosen_korean: 내가 해를 입지 않게 하려는 것이었습니다
  alternatives_korean:
  - 내가 패배하지 않게 하려는 것이었습니다
  - 내게 손대지 못하게 하려는 것이었습니다
  lexicon: ἡττᾶσθαι
  rationale: 본문의 동사는 문자적으로는 ‘져서 굴복하다’이지만, POB의 수정안이 암시하는 보호 의미를 한국어로 자연스럽게 풀어 ‘해를 입지 않게’로 옮겼습니다.
theological_decisions:
- issue: τοῦ μὴ ἡττᾶσθαί μοι의 의미 범위
  chosen_reading: ‘해를 입지 않게’로 옮겨 보호와 무해의 뜻을 살렸습니다.
  alternative_readings:
  - ‘패배하지 않게’
  - ‘손대지 못하게’
  rationale: 영어 POB 최종본이 ‘be touched’로 정리했지만, 그리스어 자체는 ‘굴복/패함’의 뉘앙스를 갖고 있어, 단순한 접촉 금지보다 보호의 결과를 드러내는 표현이 더 안전합니다.
  doctrine_reference: 서사적 보호 표현의 의미 범위
- issue: ἀνήρ/천사 전승이 아닌 ἄγγελος δυνάμεως의 해석
  chosen_reading: 정체를 더 특정하지 않고 ‘능력의 천사’로 남겼습니다.
  alternative_readings:
  - ‘권능의 천사’
  - ‘강한 천사’
  rationale: 원문은 천사의 출처를 설명할 뿐이며, 본문이 말하는 보호적 동반을 넘어 추가적인 신학적 동일시를 부여하지 않도록 했습니다.
  doctrine_reference: 본문 충실성
