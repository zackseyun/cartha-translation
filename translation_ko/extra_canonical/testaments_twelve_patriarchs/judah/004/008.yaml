  source_fidelity: 그리스어 ἡττᾶσθαι는 ‘만져지다’나 일반적인 ‘해를 입다’보다 ‘패배하다, 제압당하다, 굴복하다’의 뜻에 가깝습니다. 따라서 해당 목적절은 패배하지 않도록 하는 보호를 말합니다. συνέπεταί는 현재형으로 천사가 지속적으로 함께함을 나타냅니다.
  naturalness: 초안의 ‘보았는데, … 하려는 것이었습니다’는 문장 연결이 다소 부자연스럽고, 원문의 내용절을 분명히 드러내지 못합니다. ‘…것을 보았습니다’ 구조가 현대 한국어의 격식 있는 서술에 자연스럽습니다.
  terminology: ‘환상 가운데서’는 ἐν ὁράματι를 적절히 옮기며, ‘능력의 천사’는 ἄγγελος δυνάμεως의 소유격 관계를 과도하게 해석하지 않고 보존합니다. ‘패배하지 않게’는 ἡττᾶσθαι의 핵심 의미를 충실히 반영합니다.
  issues:
