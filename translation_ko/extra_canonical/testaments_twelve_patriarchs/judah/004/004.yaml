  lexicon: λοιποί
  rationale: λοιποί는 앞선 집단에서 제외된 ‘나머지’를 뜻하므로, 자연스러운 한국어로 ‘나머지 사람들’로 옮겼습니다. 접속사 δὲ는 문맥 전환의 약한 대조를 나타내어 ‘그런데’로 처리했습니다.
- source_word: ἔφυγον
  english_pob_choice: fled
  chosen_korean: 도망갔습니다
  alternatives_korean:
  - 달아났습니다
  - 도망쳤습니다
  lexicon: φεύγω
  rationale: φεύγω의 핵심 의미는 급히 도망치다/달아나다이므로, 서술의 긴박함을 살리면서도 현대 한국어에서 자연스러운 ‘도망갔습니다’를 선택했습니다.
