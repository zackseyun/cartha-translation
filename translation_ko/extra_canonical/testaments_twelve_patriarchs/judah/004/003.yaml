  text: '*Καὶ τῇ ἑξῆς ἀπήλθομεν¹⁵ εἰς Ἀρετὰν¹⁶, πόλιν κραταιάν¹⁷, *ἀπειλοῦσαν ἡμῖν θάνατον¹⁸· *Ἐγὼ δὲ καὶ ὁ Γὰδ¹⁹ προσέφθημεν *ἀπὸ ἀνατολῶν τῆς πόλεως²⁰· *Ῥουβὴμ δὲ²¹ καὶ²² Λευὶ²³ ἀπὸ δυσμῶν²⁴, καὶ οὕτως ἠλευθερώσαμεν²⁵ τὴν αἰχμαλωσίαν²⁶.'
