lexical_decisions:
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  english_pob_choice: set ... free and took all the captives
  chosen_korean: 해방하고 모든 포로를 데려갔습니다
  alternatives_korean:
  - 자유롭게 하고 모든 포로를 취했습니다
  - 사로잡힌 자들을 풀어주고 모두 데려갔습니다
  lexicon: ἀπαλλάσσω / ἐλευθερόω, αἰχμαλωσία
  rationale: 영문 POB가 ‘set ... free’와 ‘took all the captives’를 함께 살린 점을 따라, ‘해방하다’로 도시/사람들의 구출 성격을 드러내고 ‘포로’로 αιχμαλωσία의 사로잡힌 상태를 옮겼습니다.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως / ἀπὸ δυσμῶν
  english_pob_choice: —
  chosen_korean: 동쪽에서 / 서쪽에서
  alternatives_korean:
  - 도시의 동편에서 / 서편에서
  - 동쪽으로부터 / 서쪽으로부터
  lexicon: ἀνατολή / δύσις
  rationale: 전투 배치의 방향성을 간명하게 드러내기 위해 ‘~에서’로 옮겼습니다.
- source_word: πόλις κραταιάν
  english_pob_choice: Hebron
  chosen_korean: 헤브론
  alternatives_korean:
  - 강한 성읍
  - 견고한 도시
  lexicon: πόλις
  rationale: 영문 POB가 지명을 뜻풀이하지 않고 고유명으로 처리하므로, 본문은 ‘헤브론’으로 두고 의미 정보는 문맥에 맡겼습니다.
theological_decisions:
- issue: 전승 본문이 지명과 서술을 압축하는 방식
