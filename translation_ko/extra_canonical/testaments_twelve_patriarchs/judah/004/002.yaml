source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἀνῆλθον ἐγὼ¹⁰ ἐπὶ *τοῦ τείχους¹¹, καὶ¹² *ἀνεῖλον †τὸν βασιλέα αὐτῶν¹³, καὶ ἐλάβομεν *πᾶσαν τὴν αἰχμαλωσίαν¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/002.yaml
  text: And I went up upon the double wall and killed their king.
translation:
  language: ko
  text: 그리고 나는 성벽 위로 올라가 그들의 왕을 죽였고, 포로들을 모두 사로잡았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τοῦ τείχους / the double wall
  english_pob_choice: upon the double wall
  chosen_korean: 성벽 위로
  alternatives_korean:
  - 쌍벽 위로
  - 이중 성벽 위로
  - 성벽 위에
  lexicon: τείχος
  rationale: 원문은 성벽/벽 구조 위로 올라간 동작을 말하며, 영어 POB의 'double wall'을 과도하게 도식화하지 않으면서 한국어로 자연스럽게 옮기기 위해 '성벽 위로'로 처리했습니다.
- source_word: ἀνεῖλον / killed
  english_pob_choice: killed
  chosen_korean: 죽였고
  alternatives_korean:
  - 죽였습니다
  - 살해하였고
  - 처치하였고
  lexicon: ἀναιρέω
  rationale: 전승 본문의 군사적 서술을 직설적으로 살려 '죽였고'로 옮겼습니다. 한국어에서 가장 직접적이고 원문의 행위를 분명히 드러냅니다.
- source_word: τὸν βασιλέα αὐτῶν / their king
  english_pob_choice: their king
  chosen_korean: 그들의 왕
  alternatives_korean:
  - 그들의 임금
  - 그들의 통치자
  - 그들의 군주
  lexicon: βασιλεύς
  rationale: βασιλεύς의 기본 의미를 따라 '왕'으로 번역했습니다. 문맥상 고대 전쟁 서술이므로 '임금'보다 서술적이고 중립적인 표현이 적합합니다.
- source_word: πᾶσαν τὴν αἰχμαλωσίαν / all the captivity
  english_pob_choice: —
  chosen_korean: 포로들을 모두 사로잡았습니다
  alternatives_korean:
  - 모든 포로를 잡았습니다
  - 모든 포로를 사로잡았습니다
  - 전리품을 모두 차지했습니다
  lexicon: αἰχμαλωσία
  rationale: 여기서는 단순한 '포로 상태'가 아니라 포획된 사람들을 가리키는 군사적 용법으로 보아, 전투의 결과를 자연스럽게 드러내는 '포로들을 모두 사로잡았습니다'로 풀었습니다.
theological_decisions:
- issue: 군사적 폭력 서술의 직역 정도
  chosen_reading: 본문의 전투·살해 진술을 완화하지 않고 그대로 서술했습니다.
  alternative_readings:
  - '''물리쳤습니다''로 완곡화'
  - '''제압했습니다''로 일반화'
  rationale: 이 절은 전쟁 행위를 직접 진술하므로, 독자의 불편을 이유로 의미를 약화하지 않고 원문의 거친 역사 서술을 보존하는 것이 적절합니다.
  doctrine_reference: source-grounded transparency principle
