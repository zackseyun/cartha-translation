source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἐπέπεσεν⁴⁸ ἐπ᾽ αὐτοὺς τρόμος⁴⁹, καὶ ἐπαύσαντο πολεμοῦντες⁵⁰ ἡμᾶς⁵¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/006.yaml
  text: And terror fell upon them, and they stopped making war against us.
translation:
  language: ko
  text: 그리고 그들에게 공포가 덮쳤고, 그들은 우리와 전쟁하는 것을 그만두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐπέπεσεν ἐπ᾽ αὐτοὺς τρόμος
  english_pob_choice: And terror fell upon them
  chosen_korean: 그리고 그들 위에 두려움이 덮쳤으며
  alternatives_korean:
  - 그리고 그들 위에 공포가 떨어졌으며
  - 그러자 그들 위에 두려움이 임했으며
  lexicon: tρόμος
  rationale: tρόμος의 강한 공포 반응을 살리되, 한국어에서 자연스럽고 구체적인 표현인 ‘두려움이 덮쳤다’를 택해 ‘fell upon them’의 수동적 급습감을 반영했습니다.
- source_word: ἐπαύσαντο
  english_pob_choice: they stopped
  chosen_korean: 그들은 … 그쳤습니다
  alternatives_korean:
  - 그들은 멈추었습니다
  - 그들은 중단했습니다
  lexicon: παύω
  rationale: 전쟁 행위를 중지했다는 의미를 간결하게 드러내기 위해 ‘그치다’를 사용했습니다.
- source_word: πολεμοῦντες ἡμᾶς
  english_pob_choice: making war against us
  chosen_korean: 우리를 상대로 전쟁하기를
  alternatives_korean:
  - 우리와 전쟁하는 것을
  - 우리에게 전쟁을 일으키는 것을
  lexicon: πολεμέω
  rationale: 전쟁의 적대 행위를 드러내면서도 한국어 문장 흐름상 ‘~하기를 그치다’ 구조가 가장 자연스럽습니다.
theological_decisions:
- issue: ‘terror’와 ‘stopped making war’의 관계를 어떻게 드러낼지
  chosen_reading: 두려움이 원인이 되어 그들이 전쟁 행위를 중단했다는 인과를 암시하는 직렬 서술로 옮겼습니다.
  alternative_readings:
  - 그냥 사건을 병렬로 옮겨 인과를 약화하는 방식
  - ‘두려워서 전쟁을 멈추었다’처럼 명시적으로 인과를 보강하는 방식
  rationale: 원문은 인과 접속사를 쓰지 않지만 사건 순서가 강하게 연결되어 있으므로, 과도한 해설 없이도 독자가 자연스럽게 인과를 느끼도록 했습니다.
  doctrine_reference: 서사적 인과 표현의 보존
