  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/002.yaml
  text: But Er was wicked, and an angel of the Lord killed him.
translation:
  language: ko
  text: 그러나 에르는 악했고, 주의 천사가 그를 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δὲ ὁ Ἦρ πονηρός
  english_pob_choice: But Er was wicked
  chosen_korean: 그러나 에르는 악했고
  alternatives_korean:
  - 그런데 에르는 악했습니다
  - 에르는 악한 사람이었습니다
  lexicon: πονηρός
  rationale: πονηρός는 단순한 도덕적 결함보다 악함을 직접 진술하므로, 문맥을 약화시키지 않도록 ‘악했고’로 간결하게 옮겼습니다.
- source_word: ἄγγελος Κυρίου
  english_pob_choice: an angel of the Lord
  chosen_korean: 주의 천사
  alternatives_korean:
  - 주님의 천사
  - 야훼의 천사
  lexicon: ἄγγελος / κύριος
  rationale: 본문은 독립된 정관사 표현보다 소속 관계를 드러내므로 ‘주의 천사’로 자연스럽게 옮겼습니다. 이 구절은 인용된 야훼-구절이 아니므로 ‘야훼’로 확장하지 않았습니다.
- source_word: ἐθανάτωσεν αὐτὸν
  english_pob_choice: killed him
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
  - 그의 생명을 거두었습니다
  - 그를 죽이셨습니다
  lexicon: θανάτωσεν
  rationale: 동사는 직접적인 죽임을 뜻하므로 완곡하게 바꾸지 않고 평서적으로 번역했습니다.
theological_decisions:
- issue: ‘주의 천사’의 주체성과 하나님의 심판 행위
  chosen_reading: 본문 그대로 ‘주의 천사’가 그를 죽였다고 옮겼습니다.
  alternative_readings:
  - 하나님이 그를 죽이셨다
  - 주님의 사자가 그를 처형했다
  rationale: 헬라어는 행위 주체를 천사로 제시하므로, 신학적 해석으로 주어를 바꾸지 않았습니다. 동시에 본문의 심판 행위라는 긴장도 유지했습니다.
  doctrine_reference: 천사 매개 심판
