source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ¹⁴ αὐτὸς οὐκ ἔγνω αὐτὴν¹⁵ κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ¹⁵, οὐ γὰρ ἤθελεν ἔχειν τέκνα ἐξ¹⁷ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/003.yaml
  text: And he did not know her, by the scheming of his mother, for he did not want to have children by her.
translation:
  language: ko
  text: 그는 어머니의 간계로 그녀를 알지 않았습니다. 그는 그녀에게서 자녀를 두고 싶어 하지 않았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνω αὐτὴν
  english_pob_choice: he did not know her
  chosen_korean: 그녀를 알지 않았습니다
  alternatives_korean:
  - 그녀와 관계하지 않았습니다
  - 그녀와 동침하지 않았습니다
  lexicon: γινώσκω
  rationale: 헬라어의 직역적 관용구를 살리되, 문맥상 성적 관계의 부정을 암시하므로 지나치게 설명적인 표현은 피하고 한국어에서도 가능한 한 직접적으로 옮겼습니다.
- source_word: κατὰ πανουργίαν
  english_pob_choice: by the scheming
  chosen_korean: 어머니의 간계로
  alternatives_korean:
  - 어머니의 꾀로
  - 어머니의 술수로
  lexicon: πανουργία
  rationale: πανουργία는 단순한 지혜가 아니라 교활한 속임수의 뉘앙스가 있어, 문맥에 맞게 ‘간계’로 옮겼습니다.
- source_word: τῆς μητρὸς αὐτοῦ
  english_pob_choice: his mother
  chosen_korean: 어머니의
  alternatives_korean:
  - 그의 어머니의
  - 그의 모친의
  lexicon: μήτηρ
  rationale: 소유 관계를 한국어 자연문으로 압축하되, 행위의 주체가 그의 어머니임을 분명히 했습니다.
- source_word: ἐξ αὐτῆς
  english_pob_choice: by her
  chosen_korean: 그녀에게서 자녀를 두고
  alternatives_korean:
  - 그녀에게서 아이를 두고
  - 그녀로부터 자녀를 얻고
  lexicon: ἐκ
  rationale: ἐκ + 인칭대명사의 출생/생식 관계를 한국어에서 자연스럽게 풀어, 출산 의도의 부정을 분명히 드러냈습니다.
