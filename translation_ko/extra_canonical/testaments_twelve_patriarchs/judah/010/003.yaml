  rationale: 성관계를 뜻하는 원문의 관용구를 현대 한국어에서 오해 없이 전달하도록 최소한으로 명료화했습니다. 원문의 인과 관계, 어머니의 간계, 그리고 그녀에게서 자녀를 원하지 않았다는 내용을 모두 보존했습니다.
