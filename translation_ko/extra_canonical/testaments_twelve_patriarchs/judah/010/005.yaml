source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ὅτε³³ ἠπείλησα αὐτῷ³⁴, συνῆλθε μὲν³⁵ αὐτῇ, *διέφθειρε δὲ τὸ σπέρμα³⁶ ἐπὶ³⁷ τῆν γῆν³⁸, κατὰ τὴν ἐντολὴν τῆς μητρὸς αὐτοῦ³⁹. καίγε οὗτος⁴⁰ ἀπέθανεν⁴¹ ἐν πονηρίᾳ⁴². 6. Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ⁴³, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ⁴⁴ οὐκ ἀφῆκεν⁴⁵. Ἐπονηρεύσατο γὰρ⁴⁶, ὅτι⁴⁷ οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή⁵⁰.
