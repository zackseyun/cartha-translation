id: T12P.JUD.10.5
reference: Testament of Judah 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ὅτε³³ ἠπείλησα αὐτῷ³⁴, συνῆλθε μὲν³⁵ αὐτῇ, *διέφθειρε δὲ τὸ σπέρμα³⁶ ἐπὶ³⁷ τῆν γῆν³⁸, κατὰ τὴν ἐντολὴν τῆς μητρὸς αὐτοῦ³⁹. καίγε οὗτος⁴⁰ ἀπέθανεν⁴¹ ἐν πονηρίᾳ⁴². 6. Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ⁴³, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ⁴⁴ οὐκ ἀφῆκεν⁴⁵. Ἐπονηρεύσατο γὰρ⁴⁶, ὅτι⁴⁷ οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/005.yaml
  text: And when I threatened him, he went in to her, but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because she was not from the daughters of Canaan, as she herself was.
translation:
  language: ko
  text: 내가 그를 위협하였을 때, 그는 그녀에게 들어갔으나 어머니의 명령에 따라 그 씨를 땅에 버렸습니다. 그러므로 그도 악 가운데서 죽었습니다. 내가 또한 셀롬을 그녀에게 주고자 하였으나, 그의 어머니가 허락하지 않았습니다. 그의 어머니가 악하게 행하였기 때문입니다. 그 여자가 그의 어머니 자신처럼 가나안의 딸들 가운데서 나온 사람이 아니었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠπείλησα
  english_pob_choice: I threatened him
  chosen_korean: 내가 그를 위협하였을 때
  alternatives_korean:
  - 내가 그를 협박하였을 때
  - 내가 그를 위협했습니다
  lexicon: πειλέω
  rationale: 상황적 압박을 분명히 드러내기 위해 ‘위협하다’를 택하되, 서술 흐름에 맞게 종속절로 자연스럽게 옮겼습니다.
- source_word: διέφθειρε δὲ τὸ σπέρμα ἐπὶ τὴν γῆν
  english_pob_choice: he wasted the seed on the ground
  chosen_korean: 그 씨를 땅에 버렸습니다
  alternatives_korean:
  - 그 씨를 땅에 쏟았습니다
  - 그 정액을 땅에 버렸습니다
  lexicon: σπέρμα
  rationale: σπέρμα를 직역하여 ‘씨’로 유지해 문맥의 생식적 의미를 드러냈고, 영어 POB의 완곡하지만 직접적인 표현을 따라 ‘버리다’로 옮겼습니다.
- source_word: ἐν πονηρίᾳ
  english_pob_choice: in wickedness
  chosen_korean: 악함 가운데서
  alternatives_korean:
  - 악하게
  - 사악함 가운데서
  lexicon: πονηρία
  rationale: 행위의 상태를 나타내는 전치사구로 보고, 단순 부사화보다 ‘~가운데서’가 원문의 상태성을 더 잘 보존합니다.
- source_word: μήτηρ αὐτοῦ ... οὐκ ἀφῆκεν
  english_pob_choice: his mother did not allow it
  chosen_korean: 그의 어머니가 허락하지 않았습니다
  alternatives_korean:
  - 그의 어머니가 허락하지 않았습니다
  - 그 어머니가 허용하지 않았습니다
  lexicon: ἀφίημι
  rationale: 허가 거절의 의미를 가장 직접적으로 전하는 일반 한국어 동사 ‘허락하다’를 택했습니다.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  english_pob_choice: the daughters of Canaan
  chosen_korean: 가나안의 딸들 가운데서
  alternatives_korean:
  - 가나안 사람의 딸들 가운데서
  - 가나안의 여자들 가운데서
  lexicon: θυγατέρες / Χαναναῖοι
  rationale: 원문의 혈통·출신 표시를 살리기 위해 ‘딸들’과 출신을 나타내는 ‘가운데서’를 결합했습니다.
theological_decisions:
- issue: 성적 행위와 정액 묘사의 직설성
  chosen_reading: 원문의 불편한 신체·윤리적 진술을 완화하지 않고 ‘씨를 땅에 버렸다’로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘정액을 땅에 흘렸다’로 처리
  - 도덕적 의미만 남겨 ‘음행을 저질렀다’로 일반화
  rationale: 이 절은 생식적 파괴와 악함을 연결하므로, 본문의 충격과 윤리적 평가를 함께 보존해야 합니다.
  doctrine_reference: source fidelity / bodily language
