  source_fidelity: 마지막 인과절에서 원문은 ‘그의 어머니’가 악하게 행한 이유를 제시하며, 가나안 출신인 것은 어머니이고 가나안 출신이 아닌 이는 앞서 언급된 여성입니다. 초안은 이를 두 문장으로 나누면서 ‘그는’으로 잘못 받아 주어와 논리 관계가 흐려졌습니다. 나머지 내용은 원문의 순서와 의미를 대체로 충실히 따릅니다.
  naturalness: 합쇼체는 일관되지만, ‘악함 가운데서’는 다소 직역투입니다. ‘악 가운데서’가 더 자연스럽고 원문의 상태 표현도 유지합니다. 마지막 문장은 대명사 지시가 복잡하므로 관계를 분명히 해야 합니다.
  terminology: ‘씨를 땅에 버렸습니다’는 σπέρμα의 생식 문맥을 완곡하지만 충분히 보존합니다. ‘셀롬’은 제시된 그리스어 Σηλώμ을 따른 음역으로 유지합니다. ‘가나안의 딸들’도 원문 표현을 보존합니다.
  issues:
