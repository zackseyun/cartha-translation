  text: '*Ἐν ταῖς ἡμέραις τοῦ θαλάμου¹⁸ *ἐπεγυμβρευσα αὐτῇ¹⁹ τὸν²⁰ Αὐνάν²⁰. Καίγε οὗτος²¹ ἐν πονηρίᾳ²² οὐκ ἔγνω αὐτήν²³, ποιήσας σὺν αὐτῇ ἐνιαυτόν²².'
