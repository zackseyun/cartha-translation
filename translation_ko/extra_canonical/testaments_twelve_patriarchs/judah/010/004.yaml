base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/004.yaml
  text: During the days of the bridal chamber I gave her to Onan in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year.
translation:
  language: ko
  text: 혼인 동거 기간 동안 나는 그녀를 오난에게 레위라트 혼인으로 주었습니다. 그러나 그도 악함 가운데서 그녀를 알지 않았고, 비록 그녀와 한 해 동안 함께 있었지만 그러했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  english_pob_choice: During the days of the bridal chamber
  chosen_korean: 혼인 동거 기간 동안
  alternatives_korean:
  - 신방의 날들에
  - 혼인방의 기간 동안
  lexicon: θαλάμος
  rationale: 직역적인 ‘신방’도 가능하지만, 문맥상 결혼의 실제 동거 기간을 가리키므로 현대 한국어에서 자연스럽고 의미가 드러나는 표현으로 옮겼습니다.
- source_word: ἐπεγυμβρευσα αὐτῇ τὸν Αὐνάν
  english_pob_choice: I gave her to Onan in levirate marriage
  chosen_korean: 나는 그녀를 오난에게 레위라트 혼인으로 주었습니다
  alternatives_korean:
  - 나는 오난을 그녀에게 레위라트 혼인으로 주었습니다
  - 나는 그녀를 오난과 수혼하게 했습니다
  lexicon: ἐπεγυμβρεύω
  rationale: 동사와 목적어 배열을 원문과 POB 수정본에 맞추어 ‘그녀를 오난에게’로 처리했고, 친족계승혼을 가리키는 전문어는 ‘레위라트 혼인’으로 유지했습니다.
- source_word: ἐν πονηρίᾳ οὐκ ἔγνω αὐτήν
  english_pob_choice: yet he too, in wickedness, did not know her
  chosen_korean: 그러나 그도 악함 가운데서 그녀를 알지 않았고
  alternatives_korean:
  - 그러나 그도 악하게 그녀를 알지 않았고
  - 그러나 그도 악의 가운데서 그녀를 알지 않았고
  lexicon: πονηρία / γινώσκω
  rationale: ‘알다’를 성적 결합을 암시하는 완곡어법으로 살리되, ‘악함 가운데서’로 부사의 성격을 드러내어 행위의 도덕적 평가를 보존했습니다.
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  english_pob_choice: though he was with her for a year
  chosen_korean: 비록 그녀와 한 해 동안 함께 있었지만 그러했습니다
  alternatives_korean:
  - 그녀와 함께 한 해를 지냈지만
  - 그녀와 한 해 동안 동거했지만
  lexicon: ποιέω + σὺν + ἐνιαυτός
  rationale: 원문의 ‘함께 있었다/지냈다’는 관계적 동거를 살리되, 한국어 어순상 절을 뒤로 빼어 앞의 부정 진술과 자연스럽게 연결했습니다.
theological_decisions:
- issue: 레위라트 혼인 용어의 유지 여부
  chosen_reading: 전문어를 ‘레위라트 혼인’으로 유지했습니다.
  alternative_readings:
  - 수혼
  - 형사취혼
  rationale: 원문과 POB가 가리키는 친족계승혼 관행을 더 정확히 드러내는 학술적 용어이므로, 교회 전통어보다 원문 의미를 우선했습니다.
  doctrine_reference: 신명기 25:5-10 관련 혼인 관습
- issue: ‘알지 않았다’의 완곡어법 처리
  chosen_reading: 성적 결합을 암시하는 완곡어법으로 읽고 그대로 반영했습니다.
  alternative_readings:
  - 관계를 맺지 않았다
  - 동침하지 않았다
  rationale: 원문의 γινώσκω는 여기서 단순 인지가 아니라 성관계의 부재를 뜻하므로, 문맥의 직설성과 완곡성을 함께 보존해야 합니다.
  doctrine_reference: 성서 히브리어/헬라어의 관용적 용법
