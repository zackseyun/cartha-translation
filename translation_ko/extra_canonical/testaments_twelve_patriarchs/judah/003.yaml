  - 물매질하였으며
  lexicon: LSJ
  rationale: 물매를 뜻하는 동사의 행동감을 살리되, 한국어에서 도구를 생략한 간결한 전투 표현으로 처리했습니다.
theological_decisions:
- issue: 본문의 고유명사 변이와 전투 서술의 정리 여부
  chosen_reading: 제공된 그리스어 본문 흐름을 따라 타푸아와 아코르를 본문에 두고, 별도의 평탄화 없이 전투 서술을 그대로 옮겼습니다.
  alternative_readings:
  - '일부 전승의 다른 이름 형태(예: Chora/Nachor)를 채택하는 읽기'
  - 말-돌-전투 대목을 재배열하는 읽기
  rationale: 이 본문은 교리 진술이 아니라 영웅 서사이므로, 텍스트의 불안정성을 숨기기보다 주어진 본문의 형태를 존중하는 것이 더 투명합니다.
