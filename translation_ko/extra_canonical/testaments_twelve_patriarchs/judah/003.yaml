    issue: 원문 7–10절 전체 누락
    rationale: 제공된 그리스어 본문은 10절까지이며, 누락은 본문의 의미와 구조를 중대하게 훼손합니다.
  - severity: high
    issue: 1절의 ‘그의 뼈를 찢어 부수었다’는 표현 누락
    rationale: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ는 단순히 죽였다는 말보다 구체적인 폭력 묘사입니다. 불편한 역사적 서술도 원문 충실성을 위해 보존해야 합니다.
