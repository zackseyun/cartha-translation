base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003.yaml
  text: '1[a]. And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I dragged him down and so killed him.


    2. And the other king, Taphou, while he was sitting on his horse, I killed; and so I scattered all his people[b].


    3. And I found Achor, a giant of a man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.


    4. And after fighting with Achor for two hours, I killed him; and when I had cut his shield into two pieces, I hacked through his feet.


    5. And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.


    6. But I wrapped my garment around my arm and slung stones at them; four of them I killed[c], and the others fled.'
  footnotes:
  - marker: a
    text: The Greek tradition in this chapter is textually tangled. Some witnesses vary in the names of the opponents, including forms such as Chora or Nachor, and some duplicate or rearrange parts of the combat narrative.
    reason: textual_variant
  - marker: b
    text: A litra was an ancient unit of weight. The text emphasizes the extraordinary size of the stone rather than giving a modern measurement.
    reason: cultural_note
  - marker: c
    text: 'Some manuscripts preserve a fuller ending to this verse: Judah kills four of the attackers, and the rest flee.'
    reason: textual_variant
translation:
  language: ko
  text: '1. 그런데 가나안 사람들의 두 왕이 우리 떼를 향해 갑옷을 입고, 많은 백성을 거느리고 왔을 때, 나 혼자 그 왕들 중 하나에게 달려가 그의 정강이를 치고 그를 끌어내려 죽였습니다.


    2. 그리고 다른 왕 타푸아는 말에 앉아 있을 때 내가 죽였고, 그리하여 그의 모든 백성을 흩어 버렸습니다.


    3. 또 나는 활을 쏘는 거인 아코르를 발견했습니다. 내가 뛰어올라 육십 리트라짜리 돌을 집어 던져 말에 맞혔고, 그를 죽였습니다.


    4. 그리고 아코르와 두 시간 동안 싸운 뒤 그를 죽였고, 그의 방패를 두 조각으로 쪼갠 다음 그의 발들을 베어 버렸습니다.


    5. 그런데 내가 그의 흉갑을 벗기고 있을 때, 보십시오, 그의 동료인 여덟 사람이 나와 싸우기 시작했습니다.


    6. 그러나 나는 내 옷을 내 팔에 감고 그들에게 돌을 돌렸으며, 그들 가운데 넷을 죽였고, 나머지는 달아났습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
