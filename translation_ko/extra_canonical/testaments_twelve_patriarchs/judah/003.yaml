    4. 그리고 아코르와 두 시간 동안 싸운 뒤 그를 죽였습니다. 나는 그의 방패를 두 조각으로 쪼개고 그의 발을 베어 버렸습니다.


    5. 그런데 내가 그의 흉갑을 벗기고 있을 때, 보십시오, 그의 동료 여덟 사람이 나와 싸우기 시작했습니다.


