  lexicon: LSJ
  rationale: 초인적인 체구를 강조하는 어휘이므로, 서사적 뉘앙스를 살려 ‘거인’으로 옮겼습니다.
- source_word: λίθον ἑξήκοντα λιτρῶν
  english_pob_choice: a stone of sixty litras
  chosen_korean: 육십 리트라짜리 돌
