lexical_decisions:
- source_word: Πεντεφρής / Πεντεφρίς
  english_pob_choice: Pentephris
  chosen_korean: 파엔페리스
  alternatives_korean:
  - 펜테프리스
  - 파엔페리스
  lexicon: 고유명사 음역
  rationale: 원문 고유명사 표기를 현대 음역으로 옮기되, 본문과 주해 전반에서 일관되게 읽히도록 한국어 음운에 맞춘 음역을 택했습니다.
- source_word: μετάβολος
  english_pob_choice: broker
  chosen_korean: 중개인
  alternatives_korean:
  - 매매상
  - 거래인
  - 중개상
  lexicon: 기능 명사
  rationale: 이 인물은 노예 매매를 중간에서 연결하는 역할이므로, 직능을 드러내는 ‘중개인’이 가장 직접적입니다.
- source_word: ψυχὰς ... καὶ εἰς παῖδας μεταπωλεῖς
  english_pob_choice: you steal souls ... and sell them again as slaves
  chosen_korean: 사람들의 영혼을 훔쳐 다시 노예로 판다는 것
  alternatives_korean:
  - 영혼들을 훔쳐 다시 종으로 판다는 것
  - 생명들을 훔쳐 다시 노예로 판다는 것
  lexicon: 의미역 / 어휘 유지
  rationale: ψυχή를 단순히 ‘사람’으로만 약화시키지 않고, POB의 ‘souls’와 원문의 강한 표현을 살리되, 뒤의 μεταπωλεῖς는 명시적으로 ‘노예로’ 처리해 bonded status를 드러냈습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종 / 노예
  alternatives_korean:
  - 종
  - 노예
  - 하인
  lexicon: POB 용어 규칙
  rationale: 문맥상 1절과 6절은 법적·신분적 예속을 분명히 하는 대목이므로 POB의 선택을 따라 ‘노예’를 사용했고, 3절과 6절의 일반 진술은 ‘종’으로 처리해 과도한 반복을 피했습니다.
theological_decisions:
- issue: ‘영혼’과 ‘노예’의 병치가 드러내는 인간 매매의 도덕적 강도
  chosen_reading: ‘사람들의 영혼을 훔쳐 다시 노예로 판다’로 옮겨, 단순한 인신매매가 아니라 사람의 생명과 존재를 탈취하는 죄책을 드러냈습니다.
  alternative_readings:
  - ‘사람들을 훔쳐 다시 노예로 판다’
  - ‘생명들을 훔쳐 다시 노예로 판다’
  rationale: 원문 ψυχάς는 단순한 수량적 ‘사람’보다 존재 전체를 가리키는 강한 표현이므로, 이를 완화하지 않고 살리는 것이 본문 의도를 더 잘 보존합니다.
  doctrine_reference: 인간 존엄성과 인간 소유화의 죄성
- issue: 직접화법의 공손 표현
  chosen_reading: 주인 앞의 간청과 질문은 한국어에서 자연스러운 합쇼체로 유지하고, 명령형은 원문의 위계와 긴장을 살려 공손 명령형으로 옮겼습니다.
  alternative_readings:
  - 더 평평한 서술체
  - 더 전통적인 성경체
  rationale: 본문은 법정/심문 장면의 긴장을 가지므로, 현대 한국어의 격식과 위계 표지를 유지하는 것이 원문 기능을 잘 반영합니다.
  doctrine_reference: 서사체의 장면 긴장과 화행 보존
