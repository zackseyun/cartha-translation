revisions:
- from: '그들의 우두머리가 저에게 말했습니다. 「당신은 종이 아닙니다. 당신의 모습도 그것을 분명히 보여 줍니다.」 그러나 저는 그들에게 분명히 말했습니다. 제가 그들의 종이라고 말입니다. 우리가 이집트에 이르렀을 때, 그들은 저를 두고 서로 다투며 누가 상인을 속여 저를 돈으로 바꿀지를 의논했습니다. 그래서 그들 모두는 제가 무역상의 상인과 함께 이집트에 남아 있다가, 그들이 돌아와 물품을 가져올 때까지 있게 하는 것이 좋다고 여겼습니다. 주님께서는 상인의 눈에 저에게 은혜를 베푸셨고, 그가 자신의 집을 저에게 맡겼습니다. 하나님께서는 제 손을 통해 그에게 복을 주셨고, 금과 은과 일에도 그를 크게 번성하게 하셨습니다. 저는 그와 함께 석 달 동안 있었습니다.


    그 무렵, 페텐프리의 아내가 많은 호화로운 행차를 하고 멤피스로 내려왔습니다. 그녀는 자기 내시들에게서 저에 대한 소식을 들었기 때문입니다. 그리고 그녀는 남편에게 말했습니다. 「어떤 젊은 히브리 사람의 손을 통해 상인이 부유해졌습니다. 또 그가 가나안 땅에서 도둑질로 빼앗겼다고들 말합니다. 그러니 이제 그 일에 대해 그를 재판하시고, 그 젊은이를 우리 집에 데려오십시오. 그러면 히브리 사람들의 하나님께서 당신을 복 주실 것입니다. 하늘에서 오는 은혜가 그와 함께 있기 때문입니다.」[a][b][c]'
  to: '3. 그들의 우두머리가 저에게 말했습니다. “당신은 종이 아닙니다. 당신의 모습도 그것을 분명히 보여 줍니다.” 그러나 저는 그들에게 제가 그들의 종이라고 말했습니다.


    4. 우리가 이집트에 이르렀을 때, 그들은 저를 두고 서로 다투었습니다. 누가 상인을 속여 저를 대가로 금을 받을지를 두고서였습니다.[a]


    5. 그래서 그들 모두는 제가 그들의 거래를 맡은 상인과 함께 이집트에 있다가, 그들이 상품을 가지고 돌아올 때까지 있게 하는 것이 좋다고 여겼습니다.


    6. 그러나 주님께서는 상인의 눈에 제가 은총을 입게 하셨고, 그 상인은 자기 집을 저에게 맡겼습니다.


    7. 하나님께서는 제 손을 통하여 그에게 복을 주셨고, 금과 은과 일에서도 그를 번성하게 하셨습니다.[b]


    8. 저는 그와 함께 석 달 동안 있었습니다.



    12:1. 그 무렵 펜테프리[c]의 아내가 큰 화려함을 드러내며 멤피스로 내려왔습니다. 그녀가 자기 내시들에게서 저에 관한 말을 들었기 때문입니다.


    2. 그녀가 남편에게 말했습니다. “상인이 한 젊은 히브리 사람의 손을 통하여 부유해졌습니다. 또 사람들이 그를 가나안 땅에서 도둑질하여 훔쳐 갔다고 합니다.


    3. 그러니 이제 그에 관하여 재판을 하시고, 그 젊은이를 우리 집으로 데려오십시오. 하늘에서 오는 은혜가 그와 함께 있으니, 히브리 사람들의 하나님께서 당신에게 복을 주실 것입니다.”'
