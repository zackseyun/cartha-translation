base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012.yaml
  text: '3[a]. And the chief of them said to me, “You are not a slave, for your appearance also makes it plain.” But I told them plainly that I was their slave. 4. And when we had come into Egypt, they disputed concerning me, as to who would deceive the merchant and receive money for me. 5. So it seemed good to all of them to leave me in Egypt with the merchant of their trade until they should return bringing merchandise[b]. 6. But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me. 7. And God blessed him in my hands, and increased him on my account in gold and silver and work. 8. And I was with him three months.


    1. Now at that time the wife of Pentephri came down to Memphis with great display, because she had heard about me from her eunuchs. 2. And she said to her husband, “The merchant has grown rich by the hands of a certain young Hebrew; and they say that he was stolen away by theft from the land of Canaan. 3. Now therefore execute judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you[c], because grace from heaven is upon him.”'
  footnotes:
  - marker: a
    text: The Greek text is textually rough in this section; 'they disputed concerning me, as to who would deceive the merchant and receive money for me' may reflect a corrupt or compressed account of the brothers' sale of Joseph.
    reason: textual_variant
  - marker: b
    text: Or 'and increased him on my account in gold and silver and produce/business.' The final term is difficult in the witness used here.
    reason: lexical_alternative
  - marker: c
    text: Pentephri is the Greek form of the Egyptian name often associated with Potiphar/Potiphar's household in Genesis traditions.
    reason: cross_reference
translation:
  language: ko
  text: '3. 그들의 우두머리가 저에게 말했습니다. “당신은 종이 아닙니다. 당신의 모습도 그것을 분명히 보여 줍니다.” 그러나 저는 그들에게 제가 그들의 종이라고 말했습니다.


    4. 우리가 이집트에 이르렀을 때, 그들은 저를 두고 서로 다투었습니다. 누가 상인을 속여 저를 대가로 금을 받을지를 두고서였습니다.[a]


    5. 그래서 그들 모두는 제가 그들의 거래를 맡은 상인과 함께 이집트에 있다가, 그들이 상품을 가지고 돌아올 때까지 있게 하는 것이 좋다고 여겼습니다.


    6. 그러나 주님께서는 상인의 눈에 제가 은총을 입게 하셨고, 그 상인은 자기 집을 저에게 맡겼습니다.


    7. 하나님께서는 제 손을 통하여 그에게 복을 주셨고, 금과 은과 일에서도 그를 번성하게 하셨습니다.[b]


    8. 저는 그와 함께 석 달 동안 있었습니다.



    12:1. 그 무렵 펜테프리[c]의 아내가 큰 화려함을 드러내며 멤피스로 내려왔습니다. 그녀가 자기 내시들에게서 저에 관한 말을 들었기 때문입니다.


    2. 그녀가 남편에게 말했습니다. “상인이 한 젊은 히브리 사람의 손을 통하여 부유해졌습니다. 또 사람들이 그를 가나안 땅에서 도둑질하여 훔쳐 갔다고 합니다.


    3. 그러니 이제 그에 관하여 재판을 하시고, 그 젊은이를 우리 집으로 데려오십시오. 하늘에서 오는 은혜가 그와 함께 있으니, 히브리 사람들의 하나님께서 당신에게 복을 주실 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 부분의 그리스어 본문은 문법과 서술이 거칠습니다. ‘누가 상인을 속여 저를 대가로 금을 받을지’라는 말은 요셉을 팔아넘긴 사건을 압축하거나 손상된 형태로 전하는 것일 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘금과 은과 생산 활동/사업에서도’. 이 전승에서 마지막 낱말(ἔργῳ)의 정확한 범위는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 펜테프리는 창세기 전승에서 보디발 또는 보디발의 집안과 연관되어 언급되는 이집트 이름의 그리스어 형태입니다.
    reason: cross_reference
lexical_decisions:
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종살이하는 사람
  lexicon: LSJ
  rationale: 이 대목은 요셉의 매매와 소유 관계를 말하므로, 본문의 사회적 억압성을 드러내는 동시에 한국어 성경 독자가 과도하게 낯설어하지 않는 '종'을 기본으로 택했습니다.
- source_word: ἡ ὄψις σου δηλοῖ
  english_pob_choice: your appearance also makes it plain
  chosen_korean: 당신의 모습도 그것을 분명히 보여 줍니다
  alternatives_korean:
  - 당신의 얼굴이 그것을 드러냅니다
  - 당신의 겉모습도 그것을 밝힙니다
  lexicon: LSJ
  rationale: ὄψις는 단순한 '얼굴'보다 외형 전체를 가리킬 수 있어 '모습'으로 옮겼고, δηλοῖ의 '분명히 알게 하다'를 살려 추론의 근거를 드러냈습니다.
- source_word: μετάβολος
  english_pob_choice: merchant
  chosen_korean: 상인
  alternatives_korean:
  - 무역상
  - 장사꾼
  lexicon: LSJ
  rationale: 문맥상 사람과 물품을 거래하는 상업적 인물을 가리키므로, 자연스럽고 격식 있는 '상인'을 택했습니다.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  english_pob_choice: he entrusted his house to me
  chosen_korean: 자신의 집을 저에게 맡겼습니다
  alternatives_korean:
  - 자기 집안을 제게 맡겼습니다
  - 자기 집을 제게 신뢰해 맡겼습니다
  lexicon: LSJ
  rationale: ἔν신탁의 의미를 살리면서도 한국어로는 '맡겼습니다'가 가장 직접적으로 감독권 위임을 나타냅니다.
- source_word: ἐν χρυσίῳ καὶ ἀργυρίῳ καὶ ἔργῳ
  english_pob_choice: in gold and silver and work
  chosen_korean: 금과 은과 일에도
  alternatives_korean:
  - 금과 은과 일에서
  - 금과 은과 생산물과 일
  lexicon: LSJ
  rationale: 마지막 ἔργῳ는 본문이 어려운 지점으로, 과도한 확정을 피하면서도 '일'로 남겨 폭넓은 사업/노동의 의미를 보존했습니다.
- source_word: μετὰ δόξης πολλῆς
  english_pob_choice: with great display
  chosen_korean: 많은 호화로운 행차를 하고
  alternatives_korean:
  - 큰 위세를 드러내며
  - 큰 호화로움으로
  lexicon: LSJ
  rationale: δόξα는 여기서 추상적 '영광'보다 외적 화려함과 위세를 뜻하므로, 귀족적 행렬의 장면에 맞게 '호화로운 행차'로 풀었습니다.
- source_word: εὐνοῦχοι
  english_pob_choice: eunuchs
  chosen_korean: 내시들
  alternatives_korean:
  - 환관들
  - 궁정 관리들
  lexicon: LSJ
  rationale: 궁정 맥락에서 한국어 성경 관용에 맞는 '내시들'을 선택해, 원문의 육체적·제도적 함의를 흐리지 않도록 했습니다.
- source_word: κρίσιν
  english_pob_choice: execute judgment
  chosen_korean: 재판하시고
  alternatives_korean:
  - 판결하시고
  - 심판하시고
  lexicon: LSJ
  rationale: 여기서는 종교적 '심판'보다 법적 판단을 요청하는 말이므로, 한국어의 자연스러운 법정 표현인 '재판'을 썼습니다.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  english_pob_choice: grace from heaven is upon him
  chosen_korean: 하늘에서 오는 은혜가 그와 함께 있기 때문입니다
  alternatives_korean:
  - 하늘로부터 온 은혜가 그 위에 있기 때문입니다
  - 그에게 하늘의 은혜가 임해 있기 때문입니다
  lexicon: LSJ
  rationale: πρὸς αὐτόν의 방향성을 한국어로 직역하면 부자연스러워서, 보호·동반의 뉘앙스를 살린 '함께 있다'로 옮겼습니다.
theological_decisions:
- issue: κύριος와 Θεός의 구분 유지
  chosen_reading: 6절은 '주님', 7절과 3절은 '하나님'으로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 '하나님'으로 통일
  - 둘 다 '주님'으로 통일
  rationale: 그리스어 본문은 인접 절에서 호칭을 구분하므로, 한국어에서도 그 차이를 지워 버리지 않고 유지하는 것이 원문 투명성에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: source distinctions should be preserved where possible.'
- issue: 본문의 텍스트적으로 거친 대목 처리
  chosen_reading: 4절의 '누가 상인을 속여 저를 돈으로 바꿀지를'는 현존 그리스어의 압축·비정상 표현을 그대로 반영했습니다.
  alternative_readings:
  - 의미를 매끈하게 재구성
  - Genesis 37의 이야기로 조화
  rationale: 문헌 전승이 거친 지점을 매끈하게 고치면 원문상의 난점을 가리게 되므로, 해석의 여지를 남긴 채 투명하게 번역했습니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy and transparency rather than silent harmonization.'
