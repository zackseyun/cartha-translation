  source_fidelity: 개정안은 δοῦλος의 소유·매매 맥락을 유지하고, κύριος/θεός의 호칭 구분, Πεντεφρί의 음역, κλοπῇ ἔκλεψαν의 강조 표현을 반영합니다. 12장 4절의 문법적으로 거친 전승은 매끈하게 조화시키지 않고, 본문상 불확실성을 각주로 밝혔습니다.
  naturalness: 합쇼체의 현대 표준어로 다듬었습니다. 특히 ‘무역상의 상인’, ‘돈으로 바꾸다’, ‘그 일에 대해 그를 재판하다’처럼 어색하거나 의미 관계가 불명확한 표현을 자연스러운 한국어로 고쳤습니다.
  terminology: ‘종’, ‘상인’, ‘내시’, ‘주님’, ‘하나님’은 문맥 및 원어 용례에 맞게 유지했습니다. Πεντεφρί는 원어에 맞추어 ‘펜테프리’로 고쳤으며, ‘일’(ἔργῳ)의 불확정적 의미는 해당 어휘 바로 뒤의 각주에 연결했습니다.
  issues:
  - severity: medium
    issue: 인명 ‘페텐프리’는 그리스어 Πεντεφρί의 음역과 맞지 않습니다.
    rationale: 원어 및 영어 POB의 Pentephri에 맞추어 ‘펜테프리’로 옮겨야 합니다.
  - severity: medium
    issue: 각주 표지가 모두 본문 마지막에 몰려 있어 각주의 대상 구절·어휘를 식별할 수 없습니다.
    rationale: a는 4절의 난해한 매매 문장, b는 7절의 ἔργῳ, c는 ‘펜테프리’에 각각 직접 연결해야 합니다.
  - severity: medium
    issue: ‘무역상의 상인’과 ‘그 일에 대해 그를 재판하시고’는 각각 중복적이고 부자연스러우며, 후자는 κρίσιν의 대상 관계를 흐립니다.
    rationale: ‘그들의 거래를 맡은 상인’, ‘그에 관하여 재판을 하시고’가 원문의 관계와 현대 한국어 모두에 더 맞습니다.
  - severity: low
    issue: 4절의 ‘저를 돈으로 바꿀지’는 χρυσίον λάβῃ의 ‘금을 받다’와 매매의 대가 관계를 충분히 드러내지 못합니다.
    rationale: 전승의 난해함을 보존하면서 ‘저를 대가로 금을 받을지’로 옮기고 설명 각주를 둡니다.
  revised_text: '3. 그들의 우두머리가 저에게 말했습니다. “당신은 종이 아닙니다. 당신의 모습도 그것을 분명히 보여 줍니다.” 그러나 저는 그들에게 제가 그들의 종이라고 말했습니다.


    4. 우리가 이집트에 이르렀을 때, 그들은 저를 두고 서로 다투었습니다. 누가 상인을 속여 저를 대가로 금을 받을지를 두고서였습니다.[a]


    5. 그래서 그들 모두는 제가 그들의 거래를 맡은 상인과 함께 이집트에 있다가, 그들이 상품을 가지고 돌아올 때까지 있게 하는 것이 좋다고 여겼습니다.


    6. 그러나 주님께서는 상인의 눈에 제가 은총을 입게 하셨고, 그 상인은 자기 집을 저에게 맡겼습니다.


    7. 하나님께서는 제 손을 통하여 그에게 복을 주셨고, 금과 은과 일에서도 그를 번성하게 하셨습니다.[b]


    8. 저는 그와 함께 석 달 동안 있었습니다.



    12:1. 그 무렵 펜테프리[c]의 아내가 큰 화려함을 드러내며 멤피스로 내려왔습니다. 그녀가 자기 내시들에게서 저에 관한 말을 들었기 때문입니다.


    2. 그녀가 남편에게 말했습니다. “상인이 한 젊은 히브리 사람의 손을 통하여 부유해졌습니다. 또 사람들이 그를 가나안 땅에서 도둑질하여 훔쳐 갔다고 합니다.


    3. 그러니 이제 그에 관하여 재판을 하시고, 그 젊은이를 우리 집으로 데려오십시오. 하늘에서 오는 은혜가 그와 함께 있으니, 히브리 사람들의 하나님께서 당신에게 복을 주실 것입니다.”'
  revised_footnotes:
  - marker: a
    text: 이 부분의 그리스어 본문은 문법과 서술이 거칠습니다. ‘누가 상인을 속여 저를 대가로 금을 받을지’라는 말은 요셉을 팔아넘긴 사건을 압축하거나 손상된 형태로 전하는 것일 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘금과 은과 생산 활동/사업에서도’. 이 전승에서 마지막 낱말(ἔργῳ)의 정확한 범위는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 펜테프리는 창세기 전승에서 보디발 또는 보디발의 집안과 연관되어 언급되는 이집트 이름의 그리스어 형태입니다.
    reason: cross_reference
  revision_rationale: 원어 본문을 우선하여 인명 음역과 핵심 어휘를 바로잡고, 4절의 전승상 난해함을 해석으로 해소하지 않았습니다. 또한 모든 각주를 실제로 설명하는 해당 본문 위치에 배치해 앵커 오류를 해결했습니다.
