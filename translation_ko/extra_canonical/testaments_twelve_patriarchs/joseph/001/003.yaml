id: T12P.JOS.1.3
reference: Testament of Joseph 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐγὼ εἶδον ἐν τῇ ζωῇ μου τὸν φθόνον καὶ τὸν θάνατον Καὶ¹⁰ οὐκ ἐπλανήθην ⸀ἀλλʼ ἔμενα¹¹ ἐν τῇ ἀληθείᾳ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/003.yaml
  text: In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.
translation:
  language: ko
  text: 저는 제 생애에 시기와 죽음을 보았으나, 그릇되게 이끌리지 않았고, 주님의 진리 안에 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ζωῇ μου
  english_pob_choice: In my life
  chosen_korean: 제 생애에
  alternatives_korean:
  - 내 삶에서
  - 내 생애 동안
  lexicon: ἐν + ζωή
  rationale: 시간·경험의 범위를 자연스럽게 드러내면서도, 단순한 장소 표현처럼 들리지 않도록 ‘생애에’로 옮겼습니다.
- source_word: τὸν φθόνον καὶ τὸν θάνατον
  english_pob_choice: envy and death
  chosen_korean: 시기와 죽음
  alternatives_korean:
  - 질투와 죽음
  - 시샘과 죽음
  lexicon: φθόνος, θάνατος
  rationale: φθόνος의 표준적 의미를 ‘시기’로 두어 도덕적·정서적 뉘앙스를 유지했고, θάνατος는 직역적으로 ‘죽음’으로 옮겼습니다.
- source_word: οὐκ ἐπλανήθην
  english_pob_choice: I was not led astray
  chosen_korean: 그릇되게 이끌리지 않았고
  alternatives_korean:
  - 미혹되지 않았고
  - 길을 잃지 않았고
  lexicon: πλανάω
  rationale: 수동태의 ‘이끌려 벗어남’이라는 감각을 살리되, 한국어에서 더 자연스러운 결과 상태 표현으로 정리했습니다.
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  english_pob_choice: in the truth of the Lord
  chosen_korean: 주님의 진리 안에
  alternatives_korean:
  - 주님의 진실 안에
  - 주님께 속한 진리 안에
  lexicon: ἀλήθεια, κύριος
  rationale: ‘진리’는 문맥상 단순 사실성보다 신실한 계시적 진실을 가리키므로 그대로 살렸고, κύριος는 본문 흐름에 맞게 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: ‘Lord’에 대한 호칭 수준
  chosen_reading: 본문 서술체에서는 ‘주님’으로 두고, 관계를 드러내는 소유격은 ‘주님의 진리’로 표현했습니다.
  alternative_readings:
  - 야훼의 진리
  - 주(主)의 진리
  rationale: 이 작품은 구약적 경건 문맥의 κύριος이지만, 인용 표지나 야훼 대체 전통을 확정할 충분한 내부 단서가 없으므로 본문 의미를 과장하지 않는 범위에서 ‘주님’으로 유지했습니다.
  doctrine_reference: κύριος의 지시 대상은 문맥 판단을 따르며, 본문 자체는 일반적 신앙 고백으로 읽힙니다.
