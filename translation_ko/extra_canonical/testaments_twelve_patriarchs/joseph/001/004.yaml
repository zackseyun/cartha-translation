  to: 제 형제들은 저를 미워했습니다. 그러나 주께서는 저를 사랑하셨습니다. 그들은 저를 죽이려 했습니다. 그러나 제 조상들의 하나님께서는 저를 보존하셨습니다. 그들은 저를 구덩이에 내려보냈으나, 지극히 높으신 분께서 저를 끌어올리셨습니다.
