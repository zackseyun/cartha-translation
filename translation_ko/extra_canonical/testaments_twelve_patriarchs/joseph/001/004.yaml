source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οἱ¹² ἀδελφοί μου οὗτος ἐμίσησάν με, *Ὁ δὲ Κύριος¹³ ἠγάπησέ με· Αὐτοὶ¹⁴ ἠθελόν με¹⁵ ἀνελεῖν, *Ὁ δὲ Θεὸς¹⁶ τῶν πατέρων μου¹⁷ ἐφύλαξέν με· Εἰς λάκκον με¹⁸ ἐχάλασάν, Καὶ ὁ ὕψιστος ἀνήγαγέν με¹⁸·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/004.yaml
  text: My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers preserved me. They lowered me into a pit, and the Most High brought me up.
translation:
  language: ko
  text: 내 형제들은 저를 미워했습니다. 그러나 주께서는 저를 사랑하셨습니다. 그들은 저를 죽이려 했습니다. 그러나 제 조상들의 하나님께서는 저를 보존하셨습니다. 그들은 저를 구덩이에 던졌으나, 지극히 높으신 분께서 저를 끌어올리셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서는
  alternatives_korean:
  - 주님께서는
  - 야훼께서는
  lexicon: κύριος
  rationale: 이 문맥에서는 서술 속 주어로 쓰인 'the Lord'를 자연스럽게 옮기되, 본문이 직접적으로 야훼를 지시한다고 단정할 근거가 없으므로 기본 표지인 ‘주’를 유지했습니다.
- source_word: ἐφύλαξέν με
  english_pob_choice: preserved me
  chosen_korean: 저를 보존하셨습니다
  alternatives_korean:
  - 저를 지키셨습니다
  - 저를 안전하게 하셨습니다
  lexicon: φυλάσσω
  rationale: EN POB의 ‘preserved’에 맞추어 ἐφύλαξεν의 보호·보존 의미를 살렸고, ‘지키다’보다 결과적 보존을 더 분명하게 드러냈습니다.
- source_word: λάκκον
  english_pob_choice: a pit
  chosen_korean: 구덩이에
  alternatives_korean:
  - 웅덩이에
  - 구덩이로
  lexicon: λάκκος
  rationale: 직역에 가까운 ‘구덩이’가 문맥상 가장 자연스럽고, 시각적으로도 본문의 투하 이미지를 잘 보존합니다.
- source_word: ὕψιστος
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분께서
  alternatives_korean:
  - 지극히 높으신 하나님께서
  - 가장 높으신 분께서
  lexicon: ὕψιστος
  rationale: 절대적 칭호를 한국어 경어체로 풀어, 신적 호칭의 위엄을 유지하면서도 현대 합쇼체 문장 안에서 자연스럽게 들리게 했습니다.
theological_decisions:
- issue: ‘주’와 ‘지극히 높으신 분’의 신적 호칭 표현
  chosen_reading: 본문의 신적 호칭을 각각 ‘주’와 ‘지극히 높으신 분’으로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘하나님’으로 통일
  - 둘 다 고유명사식으로 ‘야훼’로 표기
  rationale: 이 본문은 서로 다른 호칭을 병렬로 사용하므로, 용례 차이를 살려 독자의 신학적 인식을 평평하게 만들지 않도록 했습니다.
  doctrine_reference: 신적 호칭 구별 보존
