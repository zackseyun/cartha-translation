    rationale: ‘제가 약할 때에는’, ‘제가 감옥에 있을 때에는’은 Ἐν ἀσθενείᾳ ἤμην 및 Ἐν φυλακῇ ἤμην의 단순 상태 고백을 시간적 조건으로 바꿉니다. 병렬을 따라 ‘저는 약했습니다/감옥에 있었습니다’로 옮기는 편이 충실합니다.
