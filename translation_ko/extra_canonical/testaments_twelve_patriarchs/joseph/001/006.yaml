id: T12P.JOS.1.6
reference: Testament of Joseph 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Μόνος ἤμην²³, καὶ ὁ Θεὸς²⁴ παρεκάλεσέ με· Ἐν ἀσθενείᾳ ἤμην, καὶ ὁ Κύριος²⁵ ἐπεσκέψατό με²⁶· Ἐν φυλακῇ ἤμην, καὶ ὁ †σωτὴρ²⁷ ἐχαρίτωσέ με²⁸· [Ἐν δεσμοῖς καὶ ἔλυσέ με.]²⁹
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/006.yaml
  text: I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]
translation:
  language: ko
  text: 저는 홀로 있었습니다. 하나님께서 저를 위로하셨습니다. 저는 약했습니다. 주님께서 저를 돌보셨습니다. 저는 감옥에 있었습니다. 구원자께서 제게 은혜를 베푸셨습니다. [저는 결박되어 있었습니다. 그분께서 저를 풀어 주셨습니다.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μόνος ἤμην
  english_pob_choice: I was alone
  chosen_korean: 홀로 있었습니다
  alternatives_korean:
  - 혼자 있었습니다
  - 외롭게 있었습니다
  lexicon: μόνος
  rationale: 상태 진술로서의 ‘alone’를 자연스럽게 살리되, ‘외롭게’처럼 정서 해석을 덧붙이지 않기 위해 ‘홀로’로 옮겼습니다.
- source_word: παρεκάλεσέ με
  english_pob_choice: comforted me
  chosen_korean: 저를 위로하셨습니다
  alternatives_korean:
  - 저를 격려하셨습니다
  - 저를 위로해 주셨습니다
  lexicon: παρακαλέω
  rationale: 본문의 동사는 단순한 정보 전달보다 돌보아 주는 위로의 뜻을 담으므로, POB의 ‘comforted’에 맞춰 ‘위로하셨습니다’로 옮겼습니다.
- source_word: ἐπεσκέψατό με
  english_pob_choice: visited me
  chosen_korean: 저를 찾아오셨습니다
  alternatives_korean:
  - 저를 방문하셨습니다
  - 저를 돌보러 오셨습니다
  lexicon: ἐπισκέπτομαι
  rationale: 문맥상 단순 방문보다 주의 깊게 돌보는 개입이 핵심이므로, 한국어에서는 관계적·구원사적 뉘앙스가 드러나는 ‘찾아오셨습니다’를 택했습니다.
- source_word: ὁ †σωτήρ ἐχαρίτωσέ με
  english_pob_choice: the Savior showed me favor
  chosen_korean: 구원자께서 저에게 은총을 베푸셨습니다
  alternatives_korean:
  - 구원자께서 저를 은혜롭게 여기셨습니다
  - 구원자께서 저에게 호의를 베푸셨습니다
  lexicon: σωτήρ / χαριτόω
  rationale: σωτήρ는 직역해 ‘구원자’로 두고, ἐχαρίτωσεν은 ‘은총을 베푸시다’로 옮겨 POB의 ‘showed me favor’와 은혜의 의미를 함께 살렸습니다.
- source_word: '[Ἐν δεσμοῖς καὶ ἔλυσέ με.]'
  english_pob_choice: '[I was in chains, and he loosed me.]'
  chosen_korean: '[제가 쇠사슬에 묶여 있을 때에는 그분이 저를 풀어 주셨습니다.]'
  alternatives_korean:
  - '[제가 사슬에 있었을 때에는 그분이 저를 풀어 주셨습니다]'
  - '[제가 결박되어 있을 때에는 그분이 저를 풀어 주셨습니다.]'
  lexicon: δεσμοί / λύω
  rationale: 괄호 친 전승은 POB처럼 별도 덧문으로 보존하고, ‘loosed me’를 한국어에서 자연스러운 해방 표현인 ‘풀어 주셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님/주님/구원자라는 세 칭호의 병렬
  chosen_reading: 각 행의 주어를 그대로 살려 하나님, 주님, 구원자께서 각각 저를 돌보신다는 고백으로 읽었습니다.
  alternative_readings:
  - 모두 동일 인물을 가리키는 반복적 호칭으로 단순화
  - ‘구원자’를 메시아로 특정
  rationale: 본문은 병렬 구조로 서로 다른 호칭을 보존하며, 현재 절만으로는 인물 동일성이나 기독론적 특정화를 과도하게 좁힐 근거가 없으므로 원문의 층위를 유지했습니다.
  doctrine_reference: 문맥 우선 원칙, 호칭 보존
- issue: “찾아오셨습니다”의 신학적 함의
  chosen_reading: ἐπεσκέψατό με를 단순한 방문이 아니라 돌보는 구원적 개입으로 번역했습니다.
  alternative_readings:
  - 중립적 방문 의미만 반영
  - 심판적 ‘살펴보셨습니다’로 번역
  rationale: 성서 그리스어에서 ἐπισκέπτομαι는 종종 돌보심과 개입을 내포하므로, POB의 audit trail에 맞추어 구원적 돌봄의 의미를 드러냈습니다.
  doctrine_reference: 성경 그리스어 어휘 의미역
