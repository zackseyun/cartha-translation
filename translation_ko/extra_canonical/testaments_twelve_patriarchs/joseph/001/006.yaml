revisions:
- from: 홀로 있었습니다. 그런데 하나님께서 저를 위로하셨습니다. 제가 약할 때에는 주님께서 저를 찾아오셨습니다. 제가 감옥에 있을 때에는 구원자께서 저에게 은총을 베푸셨습니다. [제가 쇠사슬에 묶여 있을 때에는 그분이 저를 풀어 주셨습니다.][a]
  to: 저는 홀로 있었습니다. 하나님께서 저를 위로하셨습니다. 저는 약했습니다. 주님께서 저를 돌보셨습니다. 저는 감옥에 있었습니다. 구원자께서 제게 은혜를 베푸셨습니다. [저는 결박되어 있었습니다. 그분께서 저를 풀어 주셨습니다.]
  rationale: 원문의 반복적 ‘나는 … 있었고, [호칭]께서 나를 …하셨다’ 구조를 보존했습니다. ἐπεσκέψατο는 단순 방문과 돌봄의 의미 범위를 고려하여, 이 문맥에서 자연스러운 ‘돌보셨습니다’로 옮겼습니다. 괄호 친 마지막 문장은 전승상 불확실하거나 부가된 문구임을 표시하는 원문·영어 POB의 대괄호를 유지했습니다. 제공되지 않은 [a] 각주 앵커는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
