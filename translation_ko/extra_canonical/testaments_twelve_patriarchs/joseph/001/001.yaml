id: T12P.JOS.1.1
reference: Testament of Joseph 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Διαθήκη Ἰωσὴφ τοῦ ἑνδεκάτου υἱοῦ Ἰακὼβ καὶ Ῥαχήλ¹. Ἀντίγραφον διαθήκης Ἰωσήφ². Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν³, καλέσας⁴ τοὺς υἱοὺς αὐτοῦ καὶ τοὺς ἀδελφοὺς αὐτοῦ⁷ εἶπεν αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/001.yaml
  text: 'The testament of Joseph, the eleventh son of Jacob and Rachel. A copy of the testament of Joseph. When he was about to die, he called his sons and his brothers and said to them:'
translation:
  language: ko
  text: 이것은 요셉의 유언—야곱과 라헬의 열한째 아들—입니다. 요셉의 유언의 사본입니다. 그가 죽을 때가 가까워지자, 자기 아들들과 자기 형제들을 불러 그들에게 말했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: The testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 유서
  lexicon: διαθήκη
  rationale: 이 문맥에서는 문서 표제를 가리키는 개시문이므로 ‘유언’이 가장 자연스럽고, ‘언약’은 신학적 용례를 과도하게 불러일으킵니다.
- source_word: τοῦ ἑνδεκάτου υἱοῦ Ἰακὼβ καὶ Ῥαχήλ
  english_pob_choice: the eleventh son of Jacob and Rachel
  chosen_korean: 야곱과 라헬의 열한째 아들
  alternatives_korean:
  - 야곱과 라헬의 열한 번째 아들
  - 야곱과 라헬의 열한째 아들
  lexicon: ἑνδέκατος
  rationale: 수관형사는 현대 한국어에서 순번을 간결하게 드러내는 ‘열한째’가 적절하며, 인명 연결도 원문 순서대로 유지했습니다.
- source_word: ἀποθνήσκειν
  english_pob_choice: to die
  chosen_korean: 죽을 때가 가까워지자
  alternatives_korean:
  - 죽으려 하자
  - 죽게 되었을 때
  lexicon: ἀποθνῄσκω
  rationale: Ἐν τῷ μέλλειν과 결합한 시간적 상황을 살려 단순 서술 ‘죽었습니다’보다 ‘죽을 때가 가까워지자’로 옮겼습니다.
- source_word: καλέσας ... εἶπεν αὐτοῖς
  english_pob_choice: he called ... and said to them
  chosen_korean: 불러 그들에게 말했습니다
  alternatives_korean:
  - 불러 그들에게 이르렀습니다
  - 불러 그들에게 말하였습니다
  lexicon: καλέω / λέγω
  rationale: 호명과 발화를 한국어에서 하나의 유기적 서술로 자연스럽게 연결하되, 원문의 연속 동작을 보존했습니다.
theological_decisions:
- issue: 표제문의 성격
  chosen_reading: 본문 첫 문장을 역사적 서사 본문처럼 번역하되, 책머리 표제라는 성격을 ‘이것은 …입니다’로 드러냈습니다.
  alternative_readings:
  - 직역형 표제문 ‘요셉의 유언’
  - 보다 서술적인 ‘요셉이 남긴 유언입니다’
  rationale: Greek superscription의 기능은 서사 도입이면서 표제이므로, 현대 독자에게도 문서 제목임을 즉시 알리되 원문의 정보를 덧붙이는 방식이 가장 적절합니다.
  doctrine_reference: 문서 표제/서문 처리 원칙
- issue: 족보적 소개의 보존
  chosen_reading: ‘야곱과 라헬의 열한째 아들’이라는 출신 표지를 그대로 보존했습니다.
  alternative_readings:
  - 가문의 설명을 생략
  - ‘열한째 아들’만 번역
  rationale: 원문은 요셉의 정체를 족보적으로 규정하므로, 후대 독자가 문맥을 오해하지 않도록 인물 식별 정보를 유지해야 합니다.
  doctrine_reference: 본문 역사성 및 인물 식별
