revisions:
- from: 이것은 요셉의 유언—야곱과 라헬의 열한째 아들—입니다. 요셉의 유언의 사본입니다. 그가 죽을 때가 가까워지자, 자기 아들들과 자기 형제들을 불러 그들에게 말했습니다.[a]
  to: '요셉, 곧 야곱과 라헬의 열한째 아들의 유언입니다. 요셉의 유언의 사본입니다. 그가 죽으려 할 때, 자기 아들들과 자기 형제들을 불러 그들에게 말했습니다:'
  rationale: The revision makes the Greek genitival identification explicit in idiomatic Korean while preserving the title-like force of the superscription. It retains the repeated ‘유언’ and the sequence of calling his sons and brothers before speaking. The unsupported footnote marker is removed; no editorial footnote content has been supplied that could be translated faithfully.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the full Greek content: the double superscription, Joseph''s identification as Jacob and Rachel''s eleventh son, and the introductory narrative. However, the first superscription is rendered as a full copular sentence with punctuation that makes the apposition awkward, and the supplied footnote anchor has no corresponding note or identifiable source-note content.'
  naturalness: '‘이것은 요셉의 유언—야곱과 라헬의 열한째 아들—입니다’ is not idiomatic Korean: the dash-enclosed phrase lacks a clear appositional relationship and the predicate appears to identify the testament with ‘the eleventh son.’ A title-style rendering with ‘곧’ is clear and natural. ‘죽으려 할 때’ directly and smoothly represents μέλλειν ἀποθνήσκειν.'
  terminology: ‘유언’ is an appropriate rendering of Διαθήκη in this testamentary-document title and avoids importing the covenant sense of ‘언약.’ The names 야곱, 라헬, and 요셉 are standard. ‘열한째 아들’ appropriately reflects ἑνδεκάτου υἱοῦ.
  issues:
  - severity: medium
    issue: The opening title is syntactically and typographically awkward.
    rationale: The em-dash construction ‘요셉의 유언—야곱과 라헬의 열한째 아들—입니다’ leaves the appositive grammatically unintegrated and can imply that the testament itself is the son. The Greek identifies Joseph as the eleventh son.
  - severity: medium
    issue: Footnote anchor [a] is unsupported.
    rationale: No footnote text is supplied for [a], and the edition’s superscript reference numbers do not provide their note contents here. Retaining an orphan marker is structurally defective; it should be removed rather than inventing a note.
