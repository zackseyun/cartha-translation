  text: Amid slanders he also spoke in my defense. By the bitter words of dreams he rescued me. A slave, he exalted me.
translation:
  language: ko
  text: 비방 가운데서도 그는 제 편에서 변호해 주었습니다. 쓴 꿈의 말들로 저를 구해 주셨습니다. 종이었으나 저를 높이셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν διαβολαῖς καὶ συνηγόρησέ μοι
  english_pob_choice: Amid slanders he also spoke in my defense.
  chosen_korean: 비방 가운데서도 그는 제 편에서 변호해 주었습니다.
  alternatives_korean:
  - 비방 가운데서도 그는 저를 두둔해 주었습니다.
  - 비방 가운데서도 그는 저를 변호해 주었습니다.
  lexicon: διαβολαῖς → 비방; συνηγόρησέ μοι → 제 편에서 변호해 주었습니다
  rationale: διαβολαῖς는 단순한 말다툼보다 ‘비방’이 더 직접적이며, συνηγορέω는 법정적/대변적 의미가 있어 ‘제 편에서 변호해 주었습니다’로 옮겼습니다.
- source_word: Ἐν λόγοις ἐνυπνίων πικροῖς
  english_pob_choice: By the bitter words of dreams
  chosen_korean: 쓴 꿈의 말들로
  alternatives_korean:
  - 쓴 꿈의 말씀으로
  - 꿈의 쓰디쓴 말들로
  lexicon: λόγοις ἐνυπνίων πικροῖς → 쓴 꿈의 말들로
  rationale: λόγοις는 ‘말들’로, πικροῖς는 직설적으로 ‘쓴’으로 살려 꿈과 관련된 말의 강도를 유지했습니다.
- source_word: Δοῦλος καὶ ὕψωσέ με
  english_pob_choice: A slave, he exalted me.
  chosen_korean: 종이었으나 저를 높이셨습니다.
  alternatives_korean:
  - 노예였으나 저를 높이셨습니다.
  - 종이었는데 그가 저를 높이셨습니다.
  lexicon: δοῦλος → 종; ὕψωσέ με → 저를 높이셨습니다
  rationale: δοῦλος는 여기서 신분적 종속을 드러내는 말로 ‘종’이 기본값이지만, 문맥상 종살이의 강도를 더 노출하려면 ‘노예’도 가능하나 본문은 간결한 대조를 살려 ‘종’으로 두었습니다.
theological_decisions:
- issue: 비방과 꿈의 말들 속에서의 구원과 높이심의 주체 표기
  chosen_reading: 삼인칭 주어를 유지해, 하나님을 명시적으로 덧붙이지 않고 ‘그가 … 주었습니다 / 높이셨습니다’로 처리했습니다.
  alternative_readings:
  - 하나님이 비방 가운데서도 제 편에서 변호해 주셨습니다.
  - 주께서 쓴 꿈의 말들로 저를 구해 주셨습니다.
  rationale: 원문은 주어를 생략한 서술로 기능하므로, 해석을 앞서서 신학적 주어를 삽입하기보다 문맥이 드러내는 행위만 보존하는 편이 더 स्रोत-충실합니다.
  doctrine_reference: source transparency / minimal-explicitness
