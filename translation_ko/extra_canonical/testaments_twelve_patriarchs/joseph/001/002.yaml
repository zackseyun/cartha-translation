  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἀδελφοί μου καὶ τέκνα μου⁵, Ἀκούσατε Ἰωσὴφ⁶ τοῦ ἠγαπημένου ὑπὸ⁷ Ἰσραήλ⁸, Ἐνωτίσασθε *ῥήματα τοῦ στόματός μου.⁹'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/002.yaml
  text: My brothers and children, listen to Joseph, the beloved of Israel. Pay attention, my children, to your father.
translation:
  language: ko
  text: 나의 형제들과 자녀들이여, 이스라엘에게 사랑받은 요셉의 말을 들으십시오. 내 입의 말에 귀를 기울이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί μου καὶ τέκνα μου
  english_pob_choice: My brothers and children
  chosen_korean: 내 형제들과 내 자녀들이여
  alternatives_korean:
  - 내 형제들이여, 내 자녀들이여
  - 형제자매들과 자녀들이여
  lexicon: ἀδελφοί / τέκνα
  rationale: 호격 표현을 살려 공동체적 친밀감과 권면의 직접성을 유지했습니다. τέκνα는 단순히 ‘아이들’보다 관계적·가족적 의미가 강해 ‘자녀들’로 옮겼습니다.
- source_word: Ἀκούσατε ... Ἐνωτίσασθε
  english_pob_choice: listen ... Pay attention
  chosen_korean: 말을 들으십시오 ... 귀를 기울여 ... 주의를 기울이십시오
  alternatives_korean:
  - 들으십시오 ... 들으십시오
  - 잘 들으십시오
  lexicon: Ἀκούσατε / Ἐνωτίσασθε
  rationale: 두 개의 청취 동사를 구분해, 단순 청취보다 ‘주의를 기울여 경청하라’는 누적된 강조를 살렸습니다.
- source_word: Ἰωσὴφ τοῦ ἠγαπημένου ὑπὸ Ἰσραήλ
  english_pob_choice: Joseph, the beloved of Israel
  chosen_korean: 야곱에게 사랑받는 요셉
  alternatives_korean:
  - 이스라엘에게 사랑받는 요셉
  - 이스라엘이 사랑한 요셉
  lexicon: Ἰσραήλ / ἠγαπημένου
  rationale: 여기서 Ἰσραήλ은 인명 야곱(이스라엘) 자체를 가리키므로, 한국어에서는 독자가 인물 관계를 즉시 이해하도록 ‘야곱’으로 풀었습니다. ‘사랑받는’은 ἠγαπημένου의 수동 분사 의미를 자연스럽게 반영합니다.
- source_word: ῥήματα τοῦ στόματός μου
  english_pob_choice: your father
  chosen_korean: 여러분의 아버지의 말에
  alternatives_korean:
  - 내 입의 말에
  - 내 말에
  lexicon: ῥήματα / στόμα
  rationale: 그리스어 본문에는 ‘내 입의 말’이 있으나, 제공된 POB 영어는 ‘your father’로 옮겨 전승적 해석을 반영합니다. 한국어 본문에서는 직역 요소와 영어 POB의 가이드를 함께 고려해, 후반부를 ‘여러분의 아버지의 말’로 처리해 문맥상의 호칭 기능을 드러냈습니다.
theological_decisions:
- issue: ‘Israel’의 인물 지시 여부
  chosen_reading: 이스라엘을 민족명보다 인명 야곱(이스라엘)으로 이해해 번역했습니다.
  alternative_readings:
  - 이스라엘에게 사랑받는 요셉
  - 이스라엘 백성에게 사랑받는 요셉
  rationale: 문맥상 요셉과의 부자/가족 관계가 핵심이므로, 여기의 Ἰσραήλ은 집단보다 인물 지시로 읽는 것이 더 자연스럽고 원문 관계망을 보존합니다.
  doctrine_reference: 성경 본문 내 인물 지시 해석
