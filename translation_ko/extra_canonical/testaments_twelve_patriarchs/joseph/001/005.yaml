id: T12P.JOS.1.5
reference: Testament of Joseph 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐπράθην *εἰς δουλείαν¹⁹, *Καὶ ὁ πάντων δεσπότης²⁰ ἠλευθέρωσέν με· Εἰς αἰχμαλωσίαν ἐλήφθην²¹, Καὶ ἡ κραταιὰ αὐτοῦ χεὶρ ἐβοήθησέ μοι· Ἐν λιμῷ συνεσχέθην, Καὶ αὐτὸς ὁ Κύριος διέθρεψέ με²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/005.yaml
  text: I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was confined by famine, and the Lord himself nourished me.
translation:
  language: ko
  text: 나는 종으로 팔렸으나, 만물의 주인이 나를 자유롭게 하셨습니다. 나는 포로로 잡혔으나, 그분의 강한 손이 나를 도우셨습니다. 나는 기근에 억눌렸으나, 주님 자신이 나를 먹여 살리셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς δουλείαν / I was sold into slavery
  english_pob_choice: I was sold into slavery
  chosen_korean: 나는 종으로 팔렸으나
  alternatives_korean:
  - 나는 노예로 팔렸으나
  - 나는 종살이로 팔렸으나
  lexicon: δοῦλεία → 종됨/노예됨
  rationale: 본문의 δουλεία는 단순한 ‘섬김’이 아니라 강제적 종속 상태를 가리키므로, POB의 ‘slavery’를 살리되 한국어에서는 자연스럽고 본문 긴장을 드러내는 ‘종으로 팔렸으나’로 옮겼습니다.
- source_word: ὁ πάντων δεσπότης / the Master of all
  english_pob_choice: the Master of all
  chosen_korean: 만물의 주인이
  alternatives_korean:
  - 모든 것의 주인이
  - 만물의 주재가
  lexicon: δεσπότης → 주인/주재자
  rationale: δεσπότης는 단순한 예의 호칭보다 절대적 소유권과 통치권을 드러내므로, 관용적이면서도 의미를 보존하는 ‘만물의 주인’으로 옮겼습니다.
- source_word: εἰς αἰχμαλωσίαν / into captivity
  english_pob_choice: I was taken into captivity
  chosen_korean: 나는 포로로 잡혔으나
  alternatives_korean:
  - 나는 사로잡혔으나
  - 나는 포로가 되었으나
  lexicon: αἰχμαλωσία → 포로 됨/사로잡힘
  rationale: αἰχμαλωσία의 결과 상태를 한국어에서 가장 분명하게 드러내는 표현은 ‘포로로 잡히다’이므로, 능동적 사건과 상태를 함께 보이도록 선택했습니다.
- source_word: Ἐν λιμῷ συνεσχέθην / I was confined by famine
  english_pob_choice: I was confined by famine
  chosen_korean: 나는 기근에 억눌렸으나
  alternatives_korean:
  - 나는 기근에 갇혔으나
  - 나는 기근에 사로잡혔으나
  lexicon: συνέχω → 붙들다, 압박하다, 억누르다
  rationale: συνεσχέθην은 단순히 ‘배고픔을 느꼈다’가 아니라 기근이 나를 옥죄고 묶어 둔 상태를 말하므로, 자연스럽고 압박감을 살리는 ‘기근에 억눌렸으나’를 택했습니다.
- source_word: αὐτὸς ὁ Κύριος / the Lord himself
  english_pob_choice: the Lord himself
  chosen_korean: 주님 자신이
  alternatives_korean:
  - 주님이 친히
  - 주께서 친히
  lexicon: κύριος → 주님
  rationale: 마지막 절은 구원의 주체가 직접 하나님이심을 강조하므로, 대명사적 강조를 살려 ‘주님 자신이’로 옮겼습니다.
theological_decisions:
- issue: ‘Master of all’과 ‘Lord himself’의 중첩된 주어 표현
  chosen_reading: 두 표현 모두 하나님을 가리키며, 앞에서는 절대적 주권자, 뒤에서는 직접 돌보시는 주님으로 병치했습니다.
  alternative_readings:
  - 둘을 모두 단순히 ‘주님’으로 평준화하는 번역
  - 앞의 δεσπότης를 약화해 일반적 ‘주인’만으로 처리하는 번역
  rationale: 본문은 동일한 하나님을 서로 다른 호칭으로 반복해 요셉의 해방과 양육이 모두 하나님의 직접 행위임을 강조합니다. 한국어에서도 이 반복을 유지해야 신학적 병치가 보존됩니다.
  doctrine_reference: 하나님의 주권과 섭리
