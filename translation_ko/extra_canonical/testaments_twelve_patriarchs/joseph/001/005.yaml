  terminology: “만물의 주인”은 ὁ πάντων δεσπότης의 포괄적 주권을, “주님 자신이”는 αὐτὸς ὁ Κύριος의 강조를 적절히 드러냅니다. “종으로 팔렸다”도 본문의 노예적 종속 상태를 충분히 전달합니다.
