base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014.yaml
  text: 1[a]. And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust[b], because you punish as a wrongdoer a free man who has been kidnapped.” 2. But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come. 3. And the woman kept saying to her husband[c],
  footnotes:
  - marker: a
    text: Or 'through the lattices'; the Greek can refer to window-openings rather than glazed windows in the modern sense.
    reason: cultural_note
  - marker: b
    text: Literally, 'a free man who has been stolen'—that is, a person unlawfully seized and treated as though he were a slave or criminal.
    reason: lexical_alternative
  - marker: c
    text: The sentence breaks off here in the supplied Greek witness and continues in the next chapter.
    reason: textual_variant
translation:
  language: ko
  text: 1. 메므피스는 내가 창문들 너머로 맞는 것을 보았습니다. — 그녀의 집이 가까이 있었기 때문입니다. — 그래서 사람을 보내어 그에게 이렇게 말했습니다. "당신의 판결은 불의합니다. 왜냐하면 당신은 납치된 자유인에게 죄인에게 하듯 벌을 가하기 때문입니다." 2. 그러나 나는 맞는 동안에도 내 말을 바꾸지 않았으므로, 그는 그 소년의 주인들이 올 때까지 내가 감시 아래 있게 하라고 명령했습니다. 3. 그 여인은 남편에게 계속 말했습니다,[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφίς
  english_pob_choice: Memphis
  chosen_korean: 메므피스
  alternatives_korean:
  - 멤피스
  lexicon: 고유명사 표기
  rationale: 고유명사이므로 음역하되, 전통적 성경 인명 표기보다 본문 고유형을 살려 현대식 표기를 택했습니다.
- source_word: θυρίδων
  english_pob_choice: windows
  chosen_korean: 창문들 너머로
  alternatives_korean:
  - 창문들로
  - 창살 너머로
  - 창호 너머로
  lexicon: LSJ
  rationale: θυρίδων은 현대적 유리창이 아니라 개구부를 가리킬 수 있으므로, 본문 흐름을 살려 ‘창문들 너머로’로 옮기고 주석 없이 자연스럽게 읽히게 했습니다.
- source_word: κλαπέντα ἐλεύθερον
  english_pob_choice: a free man who has been kidnapped
  chosen_korean: 납치된 자유인
  alternatives_korean:
  - 도둑맞은 자유인
  - 훔쳐간 자유인
  - 납치된 자유인
  lexicon: LSJ
  rationale: κλαπέντα의 직역상 ‘훔쳐진/납치된’의 긴장이 있으나, 문맥상 사람을 불법으로 데려간 의미가 분명하여 ‘납치된’으로 옮겼습니다. ἐλεύθερον은 신분 대비를 살리기 위해 ‘자유인’으로 렌더링했습니다.
- source_word: τιμωρεῖς
  english_pob_choice: you punish
  chosen_korean: 벌을 가하기
  alternatives_korean:
  - 처벌하기
  - 응징하기
  - 벌하다
  lexicon: LSJ
  rationale: 법정 항변의 어조를 살리기 위해 ‘처벌’보다 더 직접적인 ‘벌을 가하다’를 택했습니다.
- source_word: φυλαχθῆναί με
  english_pob_choice: that I be kept under guard
  chosen_korean: 내가 감시 아래 있게 하라고
  alternatives_korean:
  - 내가 감옥에 있게 하라고
  - 내가 구금되게 하라고
  - 내가 감시 아래 있게 하라고
  lexicon: LSJ
  rationale: φυλαχθῆναί는 구체적으로 감옥을 지정하지 않고 보호·감시 상태로 붙잡아 두는 뜻이어서, ‘감시 아래 있게 하다’로 옮겨 과도한 구체화를 피했습니다.
- source_word: οἱ κύριοι τοῦ παιδός
  english_pob_choice: the masters of the boy
  chosen_korean: 그 소년의 주인들
  alternatives_korean:
  - 그 아이의 주인들
  - 그 노예소년의 주인들
  - 그 소년의 주인들
  lexicon: LSJ
  rationale: κύριοι는 소유·지배 관계를 드러내므로 ‘주인들’이 적절합니다. παῖς는 문자적으로 ‘소년’이지만, 본문이 지시하는 종속적 신분을 완전히 지우지 않도록 해석을 과잉하지 않는 선에서 유지했습니다.
theological_decisions:
- issue: 불의한 판결과 신분 언어의 보존
  chosen_reading: Ἄδικος ἡ κρίσις σου는 ‘당신의 판결은 불의합니다’로, ἐλεύθερον과 κύριοι는 각각 ‘자유인’과 ‘주인들’로 유지했습니다.
  alternative_readings:
  - ‘당신의 결정은 부당합니다’
  - ‘자유한 사람’
  - ‘소유자들’
  rationale: 본문의 윤리적 충돌은 단순한 감정 표현이 아니라 법적·사회적 신분의 오해와 억압을 드러내므로, 그 긴장을 희석하지 않는 용어를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; bonded-status language should remain socially legible'
- issue: 행위의 지속성 표지
  chosen_reading: ἔλεγε와 ἤλλαξα의 대비를 살려 ‘계속 말했습니다’와 ‘내 말을 바꾸지 않았습니다’로 옮겼습니다.
  alternative_readings:
  - ‘말했습니다’
  - ‘바꾸지 않았습니다’
  rationale: 과거 미완료의 반복·지속 감각이 장면의 압박을 형성하므로, 서술의 힘을 유지하는 방향으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: tense/aspect should be represented when rhetorically significant'
