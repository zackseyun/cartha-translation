  rationale: 제공된 그리스어 본문을 우선하여 1–6절을 완역했습니다. 3절의 수사 의문과 4절의 다소 불분명한 표현(‘죄의 욕망 가운데 있는 나’)은 과도한 해석 없이 보존했습니다. 5절의 부정 표현은 법적 관습을 가리키는 말로 자연스럽게 옮겼고, 6절의 μεταβόλον은 불확실성을 각주로 밝혔습니다. 영어 감사 기록의 절단 관련 각주는 제공 원문과 모순되므로 제거·대체했습니다.
