  verdict: revise
  source_fidelity: 대체로 충실합니다. 그러나 παρέχετε는 요구하는 이들에게 돈을 ‘주라’는 뜻이라기보다 요구된 금액을 ‘내어 주라/지불하라’는 지시입니다. 초안의 “그들에게 주십시오”는 수령인을 불필요하게 명시하여, 그들이 매도인인지 또는 다른 관계자인지 확정하는 효과가 있습니다.
  naturalness: 합쇼체는 일관되고 자연스럽습니다. “두 므나를 내주십시오”는 화폐 금액을 지불하라는 뜻을 자연스럽게 전달하며, 원문의 명령조도 보존합니다.
  terminology: εὐνοῦχος는 ‘내시’, μνᾶ는 음역한 ‘므나’, παῖς는 이 문맥에서 ‘소년’으로 옮긴 것이 적절합니다. ‘금’을 아끼지 말라는 표현도 자연스럽습니다.
  issues:
  - severity: medium
    issue: “그들에게 주십시오”가 παρέχετε의 대상을 ‘그들’로 확정합니다.
    rationale: 원문은 복수 명령형 παρέχετε로 수신자들에게 요구된 두 므나를 제공하거나 지불하라고 합니다. 여격의 수령인이 명시되지 않았으므로, ‘그들에게’는 본문에 없는 관계를 덧붙입니다. 금액을 목적어로 하여 ‘두 므나를 내주십시오’로 옮기면 지불의 뜻과 원문의 비특정성을 함께 유지합니다.
  revised_text: 그러자 그녀는 다른 내시를 보내며 말했습니다. “그들이 두 므나를 요구하더라도, 두 므나를 내주십시오. 금을 아끼지 마십시오. 다만 그 소년을 사서 내게 데려오십시오.”
