  text: Then she sent another eunuch, saying, “Even if they ask two minas, pay them. Do not spare the gold. Only buy the boy and bring him to me.”
translation:
  language: ko
  text: 그러자 그녀는 다른 내시를 보내며 말했습니다. “만일 그들이 두 므나를 요구하더라도, 그들에게 주십시오. 금을 아끼지 마십시오. 다만 그 소년을 사서 내게 데려오십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ δὲ ἀπέστειλεν ... εὐνοῦχον ἕτερον
  english_pob_choice: Then she sent another eunuch
  chosen_korean: 그녀는 다른 내시를 보내며
  alternatives_korean:
  - 또 다른 내시를 보냈습니다
  - 한 내시를 더 보냈습니다
  lexicon: εὐνοῦχος → 내시
  rationale: εὐνοῦχος는 성적/궁정적 거세 관직자를 가리키므로, 본문 의미를 직접 드러내는 ‘내시’가 적절합니다.
- source_word: Ἐὰν καὶ δύο μνᾶς ζητοῦσι
  english_pob_choice: Even if they ask two minas
  chosen_korean: 만일 그들이 두 므나를 요구하더라도
  alternatives_korean:
  - 비록 두 므나를 청하더라도
  - 그들이 두 므나를 달라고 하더라도
  lexicon: μνᾶς → 므나
  rationale: 화폐 단위 μνᾶς는 음역해 ‘므나’로 옮기고, ζητοῦσι는 단순한 요청보다 분명한 요구의 뉘앙스가 있어 ‘요구하다’로 풀었습니다.
- source_word: μὴ φείσασθε χρυσίου
  english_pob_choice: Do not spare the gold
  chosen_korean: 금을 아끼지 마십시오
  alternatives_korean:
  - 금을 아끼지 말십시오
  - 금을 아끼지 마세요
  lexicon: χρυσίου → 금
  rationale: χρυσίου는 일반 명사 ‘금’으로 옮기되, 부정 명령 φείσασθε의 의미를 자연스럽게 살려 ‘아끼지 마십시오’로 번역했습니다.
- source_word: πριασάμενος τὸν παῖδα ἄγαγε πρός με
  english_pob_choice: Only buy the boy and bring him to me
  chosen_korean: 다만 그 소년을 사서 내게 데려오십시오
  alternatives_korean:
  - 오직 그 소년을 사서 내게 데려오십시오
  - 그 소년만 사서 내게 데려오십시오
  lexicon: παῖς → 소년
  rationale: παῖς는 문맥상 아동/소년을 가리키므로, POB의 ‘boy’를 따라 ‘소년’으로 옮겼습니다.
theological_decisions:
- issue: 직접 명령문 내부의 화법
  chosen_reading: 인용문 안에서는 상관에게 내리는 지시체를 살려 “주십시오/데려오십시오”로 번역했습니다.
  alternative_readings:
  - 평서형으로 완화하여 ‘주어야 합니다/데려와야 합니다’로 처리
  rationale: 본문은 단순 진술이 아니라 즉각적인 실행을 요구하는 명령이므로, 명령형의 긴박함을 보존하는 것이 원문 효과에 부합합니다.
  doctrine_reference: 문체·화법 보존 원칙
