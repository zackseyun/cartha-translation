  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐγὼ δὲ²⁸ εἰδὼς²⁹ ἐσιώπησα³⁰ ἵνα μὴ αἰσχυνθῇ³¹ *ὁ εὐνοῦχος³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/006.yaml
  text: But I, knowing this, kept silent, so that the eunuch might not be put to shame.
translation:
  language: ko
  text: 그런데 저는 이 사실을 알고 있었으므로, 그 내시가 수치를 당하지 않도록 침묵했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ εἰδὼς
  english_pob_choice: But I, knowing this
  chosen_korean: 그런데 저는 이 사실을 알고 있었으므로
  alternatives_korean:
  - 그러나 저는 알고 있었으므로
  - 그런데 나는 알고 있었기에
  lexicon: ἐγώ / εἰδώς
  rationale: 대조 접속사 δέ는 문맥상 ‘그런데’로 자연스럽게 살리고, 분사 εἰδώς는 원인·배경을 드러내는 ‘알고 있었으므로’로 옮겨서 서술의 이유를 분명히 했습니다.
- source_word: ἐσιώπησα
  english_pob_choice: kept silent
  chosen_korean: 침묵했습니다
  alternatives_korean:
  - 가만히 있었습니다
  - 입을 다물었습니다
  lexicon: σιωπάω
  rationale: 단순한 ‘말하지 않음’보다 의도적이고 지속적인 침묵을 드러내는 한국어로 ‘침묵했습니다’를 선택했습니다.
- source_word: αἰσχυνθῇ
  english_pob_choice: be put to shame
  chosen_korean: 수치를 당하지 않도록
  alternatives_korean:
  - 부끄러움을 당하지 않도록
  - 창피를 당하지 않도록
  lexicon: αἰσχύνω
  rationale: 수동 접속법의 수치·망신 의미를 가장 직접적으로 살리기 위해 ‘수치를 당하다’로 옮겼습니다.
- source_word: ὁ εὐνοῦχος
  english_pob_choice: the eunuch
  chosen_korean: 그 내시
  alternatives_korean:
  - 그 환관
  - 그 내시관
  lexicon: εὐνοῦχος
  rationale: 공적·궁정적 직함을 지닌 인물을 가리키는 본문 맥락에서 한국어 성경 독자에게 즉시 이해되는 ‘내시’를 기본으로 하되, 원어의 사회적 함의를 유지했습니다.
theological_decisions:
- issue: 수치 회피의 목적절
  chosen_reading: 침묵은 그 내시가 공개적 수치를 당하지 않게 하려는 배려로 제시됩니다.
  alternative_readings:
  - 단순히 말하지 않음
  - 자기보호를 위한 침묵
  rationale: ἵνα μὴ + 접속법은 목적을 분명히 하므로, 이 침묵이 자기방어가 아니라 타인의 수치를 막기 위한 행위라는 점을 유지했습니다.
  doctrine_reference: 서사적 윤리—타인의 명예와 수치를 배려하는 행위
- issue: register
  chosen_reading: 서술문은 합쇼체로 유지하고, 직접 화자는 없으므로 등록 전환은 없습니다.
  alternative_readings:
  - 더 구어적인 평서체
  - 성경적 고어체
  rationale: 본문이 서술문이므로 현대 표준어의 공적 문체를 유지하는 것이 원문 효과와 가장 잘 맞습니다.
  doctrine_reference: 번역 문체 원칙
