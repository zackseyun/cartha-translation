  source_fidelity: 원문의 대조적 주어 강조(Ἐγὼ δέ), 분사 εἰδώς의 배경·이유, 완료된 침묵 행위(ἐσιώπησα), 그리고 ἵνα μὴ + 접속법이 나타내는 목적을 충실히 반영했습니다. αἰσχυνθῇ의 수동적 ‘수치를 당하다’와 정관사가 붙은 ὁ εὐνοῦχος도 ‘그 내시’로 적절히 옮겼습니다.
  naturalness: ‘그런데 저는 이 사실을 알고 있었으므로, 그 내시가 수치를 당하지 않도록 침묵했습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 서술의 인과관계와 목적을 명료하게 전달합니다.
  terminology: ‘내시’는 εὐνοῦχος의 통상적이고 이해하기 쉬운 번역이며, 이 짧은 구절의 문맥에서 불필요하게 성적·신체적 의미를 확대하지 않습니다. ‘수치를 당하다’도 αἰσχυνθῇ의 의미에 적합합니다.
