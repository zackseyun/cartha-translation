id: T12P.JOS.16.3
reference: Testament of Joseph 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὁ δὲ εὐνοῦχος *μὴ θελήσας ἀγοράσαι με⁴ ἀνεχώρησεν πειράσας αὐτούς, καὶ δηλοῖ τῇ δεσποίνῃ αὐτοῦ, ὅτι πολλὴν τιμὴν αἰτοῦσιν τοῦ παιδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/003.yaml
  text: But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.
translation:
  language: ko
  text: 그런데 그 내시는 나를 사려 하지 않고, 그들을 시험해 본 뒤 물러나 자기 여주인에게 그들이 그 소년의 값을 매우 높게 부른다고 알렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  english_pob_choice: the eunuch
  chosen_korean: 내시
  alternatives_korean:
  - 환관
  - 궁정 내시
  lexicon: 표준어 일반어휘
  rationale: 문맥상 궁정 관리이자 남성 환관을 가리키므로, 한국어에서 가장 자연스럽고 직역에 가까운 ‘내시’를 택했습니다.
- source_word: ἀγοράσαι
  english_pob_choice: to buy me
  chosen_korean: 나를 사려고
  alternatives_korean:
  - 나를 구매하려고
  - 나를 사려 하고
  lexicon: 표준어 일반어휘
  rationale: 매매 행위를 직접 드러내는 동사 ‘사다’가 원문의 거래 의미를 가장 분명하게 옮깁니다.
- source_word: πειράσας
  english_pob_choice: after testing them
  chosen_korean: 그들을 시험해 본 뒤
  alternatives_korean:
  - 그들을 시험한 뒤
  - 그들을 떠보아
  lexicon: 표준어 일반어휘
  rationale: 접근한 뒤 상황을 떠보는 의미를 살려 ‘시험해 보다’로 옮겼습니다.
- source_word: τιμὴν αἰτοῦσιν
  english_pob_choice: they were asking a high price
  chosen_korean: 그 소년 값이 매우 비싸다고
  alternatives_korean:
  - 그 소년 값을 높게 부른다고
  - 그 소년 값이 큰 값을 요구한다고
  lexicon: 표준어 일반어휘
  rationale: 직역하면 ‘값을 요구하다’이지만 한국어에서는 자연스럽게 ‘값이 비싸다’로 풀어 원문의 가격 요구 의미를 유지했습니다.
theological_decisions:
- issue: δεσποίνῃ αὐτοῦ의 관계 호칭
  chosen_reading: 주인에게
  alternative_readings:
  - 여주인에게
  - 주모에게
  rationale: 원문은 여성 소유주를 가리키지만, 현대 한국어에서는 관계와 소속을 우선해 ‘주인’으로 간결하게 옮기되, 성별 정보는 문맥상 유지됩니다.
  doctrine_reference: 본문 서술의 사회적 관계를 보존하는 번역 원칙
- issue: ‘boy’의 인격·연령 뉘앙스
  chosen_reading: 소년
  alternative_readings:
  - 아이
  - 소년아이
  rationale: pob의 ‘boy’를 따라 미성년 남성의 뉘앙스를 살리면서도 한국어에서 과도하게 유아화되지 않도록 ‘소년’을 사용했습니다.
  doctrine_reference: 서사적 인물 지칭의 연령감 보존
