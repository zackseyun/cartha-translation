    issue: ‘그 소년 값이 매우 비싸다’
    rationale: τιμὴν αἰτοῦσιν은 단순한 가격 상태가 아니라 ‘그들이 높은 값을 요구한다/높게 부른다’는 행위를 뜻합니다.
  - severity: medium
    issue: ‘주인에게’
    rationale: δεσποίνῃ는 여성 소유주·여주인을 뜻하는 여성형 명사이므로, 원문의 성별 정보를 중립화하지 않는 것이 좋습니다.
  revised_text: 그런데 그 내시는 나를 사려 하지 않고, 그들을 시험해 본 뒤 물러나 자기 여주인에게 그들이 그 소년의 값을 매우 높게 부른다고 알렸습니다.
