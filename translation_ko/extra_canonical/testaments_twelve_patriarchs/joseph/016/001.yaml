id: T12P.JOS.16.1
reference: Testament of Joseph 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἡ δὲ Μεμφὶς εἶπε τῷ ἀνδρὶ αὐτῆς¹· *Ἀγόρασον τὸν νεανίαν², ἀκούω γάρ, φησίν³, ὅτι πωλοῦσιν αὐτόν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/001.yaml
  text: But Memphis said to her husband, “Buy the young man, for I hear,” she says, “that they are selling him.”
translation:
  language: ko
  text: 그러자 멤피스가 남편에게 말했습니다. “그 젊은이를 사십시오. ‘제가 듣기로는,’라고 그녀가 말했습니다, ‘그들이 그를 팔고 있습니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ δὲ Μεμφὶς
  english_pob_choice: But Memphis
  chosen_korean: 그러자 멤피스가
  alternatives_korean:
  - 그런데 멤피스가
  - 멤피스는
  lexicon: 고유명사
  rationale: 문맥상 이어지는 대화의 전환을 자연스럽게 살리면서, 고유명사 Μεμφὶς는 음역형 멤피스를 유지했습니다.
- source_word: τῷ ἀνδρὶ αὐτῆς
  english_pob_choice: to her husband
  chosen_korean: 자기 남편에게
  alternatives_korean:
  - 그의 남편에게
  - 남편에게
  lexicon: ἀνήρ
  rationale: αὐτῆς가 가리키는 소유 관계를 한국어에서 자연스럽게 풀어 ‘자기 남편’으로 옮겼습니다.
- source_word: Ἀγόρασον τὸν νεανίαν
  english_pob_choice: Buy the young man
  chosen_korean: 그 젊은이를 사십시오
  alternatives_korean:
  - 그 청년을 사십시오
  - 그 젊은 사람을 사십시오
  lexicon: ἀγοράζω / νεανίας
  rationale: 명령형 Ἀγόρασον은 정중한 명령으로, τὸν νεανίαν은 연령과 신분의 뉘앙스를 살려 ‘젊은이’로 옮겼습니다.
- source_word: φησίν
  english_pob_choice: she says
  chosen_korean: —그녀가 말하기를—
  alternatives_korean:
  - —그녀가 말합니다—
  - —말하길—
  lexicon: φημί
  rationale: 본문의 삽입 발화 표지를 반영해, 중간 삽입구로 처리하여 말하는 행위의 출처를 드러냈습니다.
- source_word: ὅτι πωλοῦσιν αὐτόν
  english_pob_choice: that they are selling him
  chosen_korean: 그들이 그를 팔고 있다고 합니다
  alternatives_korean:
  - 그들이 그를 팔고 있다고 합니다
  - 그들이 그를 팔고 있습니다
  lexicon: πωλέω
  rationale: 현재진행적 상황을 ‘팔고 있다고’로 자연스럽게 옮기고, αὐτόν은 앞선 ‘젊은이’를 반복하지 않고 ‘그를’로 받아 주어 POB 수정 취지를 반영했습니다.
theological_decisions:
- issue: 직접화법 안의 삽입 표지 φησίν 처리
  chosen_reading: “내가 들었습니다—그녀가 말하기를—”처럼 삽입구를 본문 안에 표시해, 누가 무엇을 말하는지 구분되도록 했습니다.
  alternative_readings:
  - “내가 들었습니다, 그녀가 말합니다, 그들이 그를 팔고 있다고.”
  - 삽입구 없이 한 문장으로 매끈하게 처리
  rationale: 이 구절의 핵심은 사실 보고보다 발화 층위의 구분에 있으므로, φησίν의 화자 표지를 가시화해야 원문 구조가 보존됩니다.
  doctrine_reference: 서사 구조 보존 및 발화 주체 식별
- issue: νεανίαν의 사회적 뉘앙스
  chosen_reading: ‘젊은이’로 번역해 연령 중심의 중립적 호칭을 유지했습니다.
  alternative_readings:
  - 청년
  - 소년
  rationale: 본문은 특정한 교회적 용어나 도덕적 평가보다 인물의 연령과 처지를 가리키므로, 과도한 해석이 덜한 ‘젊은이’가 가장 무난합니다.
  doctrine_reference: 어휘의 최소 해석 원칙
