  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/002.yaml
  text: So she immediately sent a eunuch among the Ishmaelites, asking for me to be sold.
translation:
  language: ko
  text: 그러자 곧바로 이스마엘 사람들 가운데로 환관을 보내어, 저를 팔아 달라고 청하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐθέως
  english_pob_choice: immediately
  chosen_korean: 곧바로
  alternatives_korean:
  - 즉시
  - 바로
  lexicon: εὐθέως
  rationale: 행동의 신속성을 자연스럽게 살리되, 현대 한국어에서 서술 흐름에 잘 맞는 부사로 옮겼습니다.
- source_word: ἐν τοῖς Ἰσμαϊλίταις
  english_pob_choice: among the Ishmaelites
  chosen_korean: 이스마엘 사람들 가운데 있는
  alternatives_korean:
  - 이스마엘 사람들 가운데
  - 이스마엘 사람들 중에 있는
  lexicon: Ἰσμαϊλίταις
  rationale: ἐν + 여격의 포함적 위치감을 반영하여 단순한 ‘~에게/로’보다 ‘~가운데 있는’으로 옮겼습니다.
- source_word: εὐνοῦχον
  english_pob_choice: a eunuch
  chosen_korean: 환관
  alternatives_korean:
  - 내시
  lexicon: εὐνοῦχος
  rationale: 고대 궁정·가신 맥락에서 통용되는 표준어를 사용해 인물의 신분을 직접 드러냈습니다.
- source_word: αἰτοῦσά με εἰς διάπρασιν
  english_pob_choice: asking for me to be sold
  chosen_korean: 저를 팔아 달라고 부탁하였습니다
  alternatives_korean:
  - 저를 팔아 달라고 요청하였습니다
  - 저를 매각해 달라고 청하였습니다
  lexicon: διάπρασις
  rationale: 단순히 ‘팔리게 해 달라’보다 행위의 목적을 분명히 드러내는 한국어로 옮기되, 영어 수정안처럼 ‘to her’를 임의로 보태지 않았습니다.
theological_decisions:
- issue: 노예/매매 표현의 강도
  chosen_reading: ‘팔아 달라’로 직역하여 인신 매매의 폭력성을 완화하지 않았습니다.
  alternative_readings:
  - ‘넘겨 달라’
  - ‘처분해 달라’
  rationale: 원문 διάπρασις는 실제 매매를 가리키므로, 서술을 순화하지 않고 본래의 불편한 의미를 유지하는 것이 본문 의도를 더 정확히 드러냅니다.
  doctrine_reference: 본문의 역사서술/증언 성격 유지
