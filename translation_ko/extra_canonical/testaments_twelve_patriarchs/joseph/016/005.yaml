base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/005.yaml
  text: So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”
translation:
  language: ko
  text: 그러자 그 내시가 와서 그들에게 금화 여든 닢을 주고 저를 데려갔습니다. 그러나 그 이집트 여자에게는 “제가 백 닢을 주었습니다”라고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  english_pob_choice: the eunuch
  chosen_korean: 그 내시
  alternatives_korean:
  - 그 환관
  - 그 시종
  lexicon: εὐνοῦχος → 내시
  rationale: POB의 영어가 성적·궁정적 지위를 지닌 인물로서 ‘eunuch’을 유지하므로, 표준적이면서도 자연스러운 한국어 ‘내시’를 택했습니다.
- source_word: ὀγδοήκοντα χρυσοῦς
  english_pob_choice: eighty pieces of gold
  chosen_korean: 금 여든 개
  alternatives_korean:
  - 황금 여든 개
  - 금화 여든 개
  lexicon: χρυσοῦς → 금
  rationale: 원문은 단순히 ‘금’(gold)으로 표기하며 단위를 세어 제시하므로, 내용 과장이 없도록 ‘금 여든 개’로 옮겼습니다.
- source_word: ἀνελάβετό με
  english_pob_choice: and took me
  chosen_korean: 저를 데려갔습니다
  alternatives_korean:
  - 저를 데려갔습니다
  - 저를 데리고 갔습니다
  lexicon: ἀναλαμβάνω → 데려가다
  rationale: 문맥상 단순한 ‘취하다’보다 사람을 이동시키는 의미가 분명하므로, 한국어로는 자연스럽게 ‘데려갔습니다’가 가장 직접적입니다.
- source_word: δέδωκα ἑκατόν
  english_pob_choice: I have given a hundred
  chosen_korean: 제가 백 개를 주었습니다
  alternatives_korean:
  - 제가 백을 주었습니다
  - 제가 백 개를 주었습니다
  lexicon: δίδωμι + ἑκατόν → 주다 + 백
  rationale: 그리스어는 ‘백’을 목적어처럼 두며, POB도 금액·수량의 차이를 대비시키므로 한국어에서 수량성을 살려 ‘백 개를 주었습니다’로 옮겼습니다.
theological_decisions:
- issue: 금액을 둘러싼 속임수의 대비를 어떻게 드러낼지
  chosen_reading: 내시는 그들에게는 여든 개를 주었지만, 이집트 여자에게는 백 개를 주었다고 말하며 수량을 다르게 보고합니다.
  alternative_readings:
  - 그는 단지 다른 수를 잘못 말한 것일 수 있습니다
  - 금액 차이는 단순한 서술상의 변형일 수 있습니다
  rationale: 원문과 영어 POB 모두 숫자의 불일치가 서사의 핵심 대비이므로, 이를 완화하지 않고 그대로 드러내는 쪽이 본문 의미에 충실합니다.
  doctrine_reference: 서사적 긴장 보존
