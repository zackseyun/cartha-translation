  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016.yaml
  text: 'But Memphis said to her husband[a], “I hear that they are selling the young man.”


    2 So she immediately sent a eunuch to the Ishmaelites, asking that I be sold to her.

    3 But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.

    4 Then she sent another eunuch, saying, “Even if they ask two minas, pay it. Do not spare the gold. Only buy the boy and bring him to me.”

    5 So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”

    6 But I, knowing it, kept silent[b][c], so that'
  footnotes:
  - marker: a
    text: A mina was an ancient unit of weight and money; the Greek keeps the specific term rather than converting it to a modern amount.
    reason: cultural_note
    anchor_ref: '16:4'
  - marker: c
    text: The Greek says 'eighty golds' and then 'a hundred'; the exact coinage is not specified in the normalized witness, so the translation keeps the wording general.
    reason: lexical_alternative
    anchor_ref: '16:5'
  - marker: b
    text: The sentence continues beyond the extant portion of the chapter text supplied here; the translation therefore ends where the Greek excerpt ends.
    reason: textual_variant
    anchor_ref: '16:6'
translation:
  language: ko
  text: '그런데 멤피스는 남편에게 말했습니다[a] “내가 듣기로는 사람들이 그 청년을 팔고 있습니다.


    2 그래서 그녀는 곧바로 내게 자신에게 팔리도록 해 달라고 요청하며 내시를 이스마엘 사람들에게 보냈습니다.


    3 그러나 그 내시는 나를 사려고 하지 않고, 그들을 시험해 본 뒤 물러가서 자기 주인에게 그들이 그 소년의 값을 아주 높게 요구한다고 알렸습니다.


    4 그러자 그녀는 다른 내시를 보내며 말했습니다. “그들이 설령 두 므나를 요구하더라도, 치르십시오. 금을 아끼지 마십시오. 오직 그 소년을 사서 나에게 데려오십시오.”


    5 그래서 그 내시가 와서 그들에게 금 여든 개를 주고 나를 데려갔습니다. 그러나 이집트 여인에게는 ‘내가 백 개를 주었습니다’라고 말했습니다.


    6 그러나 나는 그것을 알고도 침묵했습니다[b][c], 그 내시가 부끄러움을 당하지 않게 하려는 것이었습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  english_pob_choice: Memphis
  chosen_korean: 멤피스
  alternatives_korean:
  - 메므피스
  - 멤피스 사람
  lexicon: LSJ
  rationale: 그리스어 본문이 여인의 고유명으로 제시하므로 음역해 살렸고, 도시명으로 오해되지 않도록 문맥상 인물명으로 처리했습니다.
- source_word: νεανίας
  english_pob_choice: young man
  chosen_korean: 청년
  alternatives_korean:
  - 젊은이
  - 소년
  lexicon: LSJ
  rationale: 나이 어린 인물임을 보이면서도 한국어에서 너무 비격식적으로 들리지 않도록 ‘청년’으로 옮겼습니다.
- source_word: εὐνοῦχος
  english_pob_choice: eunuch
  chosen_korean: 내시
  alternatives_korean:
  - 환관
  - 궁정 관리
  lexicon: LSJ
  rationale: 한국어 성경 전통에서 널리 통용되지만, 본문이 실제 거세 여부보다 신분 호칭을 사용하므로 ‘궁정 관리’로 완화하지 않고 ‘내시’를 유지했습니다.
- source_word: μνᾶς
  english_pob_choice: minas
  chosen_korean: 므나
  alternatives_korean:
  - 미나
  - 은화
  lexicon: LSJ
  rationale: 고대 화폐 단위를 음역해 그대로 보존했으며, 현대적 액수로 환산하지 않아 본문의 투명성을 유지했습니다.
- source_word: χρυσοῦς
  english_pob_choice: pieces of gold
  chosen_korean: 금 여든 개 / 금 백 개
  alternatives_korean:
  - 황금 조각
  - 금화
  lexicon: LSJ
  rationale: 정규화된 본문이 정확한 주화를 특정하지 않으므로, 영어 POB처럼 일반적인 ‘pieces of gold’의 의미를 살려 ‘금 … 개’로 옮겼습니다.
theological_decisions:
- issue: 노예/매매 언어를 약화하지 않음
  chosen_reading: 매매, 값, 사기, 데려감의 상업적·소유 관계를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘거두어 감’이나 ‘데려오다’로 순화
  - 가정 내 종살이 어휘로 완화
  rationale: 그리스어 본문은 구매·판매·가격·소유의 언어를 분명히 사용하므로, 이를 희석하지 않고 독자가 본문의 억압적 현실을 그대로 보게 했습니다.
  doctrine_reference: '번역 원리: 원문 우선, 전통적 완화보다 사료적 투명성 우선'
- issue: 말하는 인물의 직접화법
  chosen_reading: 직접 인용을 따옴표로 살리고, 내시에게 한 명령형은 한국어에서 자연스러운 합쇼체로 유지했습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 평서문화
  rationale: 본문의 긴박한 지시와 거래 협상을 드러내기 위해 직접화법 구조를 보존했습니다.
  doctrine_reference: 문학적-담화적 형식 보존
