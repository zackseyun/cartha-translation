revisions:
- from: '그런데 멤피스는 남편에게 말했습니다[a] “내가 듣기로는 사람들이 그 청년을 팔고 있습니다.


    2 그래서 그녀는 곧바로 내게 자신에게 팔리도록 해 달라고 요청하며 내시를 이스마엘 사람들에게 보냈습니다.


    3 그러나 그 내시는 나를 사려고 하지 않고, 그들을 시험해 본 뒤 물러가서 자기 주인에게 그들이 그 소년의 값을 아주 높게 요구한다고 알렸습니다.


    4 그러자 그녀는 다른 내시를 보내며 말했습니다. “그들이 설령 두 므나를 요구하더라도, 치르십시오. 금을 아끼지 마십시오. 오직 그 소년을 사서 나에게 데려오십시오.”


    5 그래서 그 내시가 와서 그들에게 금 여든 개를 주고 나를 데려갔습니다. 그러나 이집트 여인에게는 ‘내가 백 개를 주었습니다’라고 말했습니다.


    6 그러나 나는 그것을 알고도 침묵했습니다[b][c], 그 내시가 부끄러움을 당하지 않게 하려는 것이었습니다.'
  to: '그런데 멤피스가 남편에게 말했습니다. “그 청년을 사십시오. 사람들이 그를 팔고 있다고 들었습니다.”


    2 그래서 그녀는 곧바로 내시를 이스마엘 사람들에게 보내어, 나를 사려고 요청했습니다.


    3 그러나 그 내시는 나를 사려 하지 않고 그들을 떠보아 본 뒤 물러가서, 자기 여주인에게 그들이 그 소년에게 매우 높은 값을 요구한다고 알렸습니다.


    4 그러자 그녀는 다른 내시를 보내며 말했습니다. “그들이 두 므나[a]를 요구하더라도 지불하십시오. 금을 아끼지 마십시오. 그저 그 소년을 사서 나에게 데려오십시오.”


    5 그래서 그 내시가 와서 그들에게 금 여든 개[b]를 주고 나를 데려갔습니다. 그러나 이집트 여인에게는 백 개를 주었다고 말했습니다.


    6 그러나 나는 그것을 알고도, 그 내시가 부끄러움을 당하지 않게 하려고 침묵했습니다.'
  rationale: 원문을 우선하여 16:1의 구매 명령을 복원하고, 16:2의 구매 요청을 자연스럽고 정확하게 고쳤습니다. 16:6은 제공된 그리스어 본문이 완결되어 있으므로 절단을 주장하는 각주와 표지를 제거하고 목적절 전체를 번역했습니다. 또한 각주 표지를 실제 해당 어휘가 있는 절로 옮기고, 16:5의 금액 보고가 실제 지급액과 다름을 명료하게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:12Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 16:1의 핵심 명령인 “그 청년을 사십시오”가 초안에서 누락되었고, 16:6의 목적절도 원문에 완결되어 있는데 영어 감사 기록의 절단을 따라 부적절하게 처리되었습니다. 16:5의 Αἰγυπτίᾳ는 ‘이집트 여인’으로 유지하되, 내시가 실제 지급액보다 많은 액수를 말했다는 뜻을 분명히 해야 합니다.
  naturalness: 초안에는 16:1 인용문의 문장부호 및 문장 종결이 불완전하고, ‘나에게 자신에게 팔리도록’은 지시 대상이 중복되어 부자연스럽습니다. 수정문은 현대 표준 한국어 합쇼체로 직접화법과 서술을 자연스럽게 정리했습니다.
  terminology: Μεμφὶς는 인명 ‘멤피스’, εὐνοῦχος는 ‘내시’, μνᾶ는 ‘므나’로 유지했습니다. χρυσοῦς는 특정 주화 단위를 단정하지 않고 ‘금 여든 개’로 옮겼습니다. 매매와 소유 이전의 표현도 완화하지 않았습니다.
  issues:
  - severity: high
    issue: 16:1에서 ‘그 청년을 사십시오’라는 명령이 누락됨
    rationale: 원문은 Ἀγόρασον τὸν νεανίαν(‘그 청년을 사십시오’)으로 시작합니다. 단순히 그가 팔리고 있다는 보고만 남기면 멤피스의 요청 내용이 크게 축소됩니다.
  - severity: high
    issue: 16:6이 원문상 완결된 목적절인데, 절단된 영어 감사 기록을 따라 불완전하게 처리됨
    rationale: 제시된 그리스어는 ἵνα μὴ αἰσχυνθῇ ὁ εὐνοῦχος(‘그 내시가 부끄러움을 당하지 않게 하려고’)까지 완결되어 있습니다. 따라서 ‘이후 본문이 없다’는 취지의 각주는 적용할 수 없습니다.
  - severity: medium
    issue: 각주 표지와 앵커가 내용과 맞지 않음
    rationale: 초안의 [a]는 16:1에 있으나 므나 설명은 16:4에, 금액·주화 설명은 16:5에 있어야 합니다. 16:6의 [b][c]도 삭제해야 합니다.
  - severity: medium
    issue: 16:2의 ‘내게 자신에게 팔리도록’이 부자연스럽고 원문의 구매 요청을 흐림
    rationale: αἰτοῦσά με εἰς διάπρασιν은 요셉을 구매하려고 요청한 행위입니다. ‘나를 사려고 요청하며’가 한국어 문법과 거래 문맥을 더 정확히 반영합니다.
  - severity: low
    issue: 16:5에서 내시의 허위 보고가 덜 명확함
    rationale: δέδωκα ἑκατόν은 그가 백 개를 지급했다고 말한 것입니다. ‘백 개를 주었다고 말했습니다’로 처리하면 실제 여든 개와의 대비가 분명해집니다.
  revised_text: '그런데 멤피스가 남편에게 말했습니다. “그 청년을 사십시오. 사람들이 그를 팔고 있다고 들었습니다.”


