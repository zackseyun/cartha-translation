  text: And she went away, enticing me with gifts and every kind of pleasure.
translation:
  language: ko
  text: 그녀는 선물과 온갖 즐거움으로 나를 유혹하며 떠나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθάλπουσά
  english_pob_choice: enticing me
  chosen_korean: 유혹한 뒤
  alternatives_korean:
  - 꼬드긴 뒤
  - 마음을 빼앗으려 하며
  - 유혹하며
  lexicon: ἐπιθάλπω
  rationale: 영어 POB의 ‘enticing’에 맞추되, 단순한 ‘떠나갔다’가 아니라 앞선 행위의 방식과 결과를 드러내도록 ‘유혹한 뒤’로 옮겼습니다.
- source_word: δώροις
  english_pob_choice: with gifts
  chosen_korean: 선물과
  alternatives_korean:
  - 선물로
  - 증정품으로
  - 사례로
  lexicon: δῶρον
  rationale: 문맥상 호의와 유인 수단을 가리키므로 일반적인 ‘선물’이 가장 자연스럽고 직접적입니다.
- source_word: ἀπολαύσεσις πάσαις
  english_pob_choice: every kind of pleasure
  chosen_korean: 온갖 즐거움으로
  alternatives_korean:
  - 온갖 쾌락으로
  - 모든 즐거움으로
  - 다양한 쾌락으로
  lexicon: ἀπόλαυσις
  rationale: 여기서는 단순한 즐거움 이상으로 감각적 유혹의 뉘앙스가 있어 ‘즐거움’으로 옮기되, ‘πάσαις’는 ‘온갖’으로 포괄성을 살렸습니다.
theological_decisions:
- issue: 유혹의 성격을 드러내는 동사 선택
  chosen_reading: ‘유혹한 뒤’로 옮겨 행위의 의도성과 도덕적 긴장을 분명히 했습니다.
  alternative_readings:
  - ‘끌어들이며’
  - ‘마음을 사로잡으며’
  rationale: 이 절은 단순한 동행이나 환대가 아니라 유혹의 서사를 전개하므로, 본문이 가진 윤리적 압력을 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 성화/유혹에 대한 본문 서술의 직접성
