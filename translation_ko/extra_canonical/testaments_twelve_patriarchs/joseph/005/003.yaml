lexical_decisions:
- source_word: Φοβηθεῖσα
  english_pob_choice: being afraid
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 겁이 나서
  lexicon: φοβέομαι
  rationale: 분사로서 원인·상황을 나타내므로 자연스러운 서술 연결인 ‘두려워하여’로 옮겼습니다.
- source_word: ἠξίου με ἵνα μὴ ἐξαγγελῶ
  english_pob_choice: begged me not to report
  chosen_korean: 내가 이 계략을 알리지 말아 달라고 나에게 간청했습니다
  alternatives_korean:
  - 내게 이 계획을 말하지 말라고 부탁했습니다
  - 내가 이 계책을 드러내지 말아 달라고 간청했습니다
  lexicon: ἀξιόω / ἐξαγγέλλω
  rationale: ἠξίου는 단순 요청보다 강한 ‘간청하다’가 적절하고, ἐξαγγέλλω는 ‘보고하다’보다 상황상 비밀을 ‘알리다/드러내다’의 뜻이 더 자연스러워 ‘알리지 말다’로 옮겼습니다.
- source_word: τὴν ἐπίνοιαν ταύτην
  english_pob_choice: this scheme
  chosen_korean: 이 계략
  alternatives_korean:
  - 이 계획
  - 이 생각
  - 이 음모
  lexicon: ἐπίνοια
  rationale: 문맥상 단순한 생각보다 은밀한 의도를 가리키는 표현이어서, 영어 POB의 ‘scheme’에 맞춰 ‘계략’으로 번역했습니다.
