id: T12P.JOS.5.2
reference: Testament of Joseph 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐγὼ οὖν, ὡς ἤκουσα τοῦτο, διέρρηξα *τὰ ἱμάτιά⁷ μου, καὶ εἶπον ⌜αὐτῇ⌝⁸· Γύναι, αἰδέσθητι τὸν Θεόν⁹, καὶ¹⁰ μὴ ποιήσῃς τὴν *πρᾶξιν ταύτην τὴν πονηράν¹¹, ἵνα μὴ¹² ἐξολοθρευθῇς· *ἐπεὶ καίγε γίνωσκε ὅτι ἐγὼ¹³ ἐξαγγελῶ¹⁴ *πᾶσιν τὴν ἐπίνοιάν σου ταύτην¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/002.yaml
  text: 'So when I heard this, I tore my garments and said to her, “Woman, have reverence for God, and do not do this evil deed, lest you be destroyed. For know this also: I will tell everyone of this scheme of yours.”'
translation:
  language: ko
  text: 그래서 내가 이것을 듣자 내 옷을 찢고 그녀에게 말했습니다. 「여인이여, 하나님을 경외하십시오. 그리고 이 악한 행위를 하지 마십시오. 그렇지 않으면 멸망할 것입니다. 또한 이것도 알아 두십시오. 나는 당신의 이 계략을 모든 사람에게 알리겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξα τὰ ἱμάτιά μου
  english_pob_choice: I tore my garments
  chosen_korean: 내 옷을 찢고
  alternatives_korean:
  - 내 옷자락을 찢고
  - 내 의복을 찢고
  lexicon: ἱμάτια
  rationale: 장례·애도·격분의 관용적 동작을 한국어로 자연스럽게 옮기면서도, 단순히 ‘옷자락’으로 좁히지 않고 원문의 복수 ‘옷들/의복’을 살렸습니다.
- source_word: αἰδέσθητι τὸν Θεόν
  english_pob_choice: have reverence for God
  chosen_korean: 하나님을 두려워하십시오
  alternatives_korean:
  - 하나님을 경외하십시오
  - 하나님 앞에 부끄러워하십시오
  lexicon: αἰδέομαι
  rationale: 영문 POB의 최신 수정처럼 ‘부끄러움’보다 ‘두려움/경외’의 뉘앙스가 원문의 핵심이므로, 예언자적 경고로서 직접적이고 자연한 한국어를 택했습니다.
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  english_pob_choice: this evil deed
  chosen_korean: 이 악한 행위
  alternatives_korean:
  - 이 사악한 일
  - 이 불의한 행위
  lexicon: πρᾶξις
  rationale: πρᾶξις의 중립적 ‘행위’에 πονηράν의 도덕적 악함을 겹쳐, 과도한 신학화 없이 본문이 말하는 비도덕적 행동을 분명히 했습니다.
- source_word: ἐξολοθρευθῇς
  english_pob_choice: you be destroyed
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 완전히 멸망할 것입니다
  - 파멸할 것입니다
  lexicon: ἐξολοθρεύω
  rationale: 완전한 소멸/파멸의 강도를 살리되, 한국어에서 경고문으로 가장 직관적인 ‘멸망하다’를 사용했습니다.
- source_word: ἐπίνοιάν σου ταύτην
  english_pob_choice: this scheme of yours
  chosen_korean: 당신의 이 계략
  alternatives_korean:
  - 당신의 이 음모
  - 당신의 이 생각
  lexicon: ἐπίνοια
  rationale: 영문 수정본이 ‘scheme’과 ‘this’를 분명히 했으므로, 의도적 계획·계략의 뉘앙스를 살려 ‘이 계략’으로 옮겼습니다.
theological_decisions:
- issue: αἰδέσθητι τὸν Θεόν의 정서적 범위
  chosen_reading: ‘하나님을 두려워하십시오’로 옮겨, 수치심보다 하나님 앞의 경외와 경고의 무게를 드러냈습니다.
  alternative_readings:
  - 하나님을 부끄러워하십시오
  - 하나님 앞에서 부끄러움을 느끼십시오
  - 하나님을 경외하십시오
  rationale: 개정된 영문 POB가 이미 ‘fear God’를 확정하고 있어, 본문의 도덕적 경고를 가장 직접적으로 전달하는 표현을 택했습니다.
  doctrine_reference: 지혜문학·예언적 훈계에서의 하나님 경외 모티프
