  text: And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as a husband.”
translation:
  language: ko
  text: 또 다른 때에 그녀가 나에게 말했습니다. 「당신이 간음하기를 원하지 않으신다면, 나는 내 남편을 독으로 죽이고 당신을 남편으로 맞이하겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  english_pob_choice: commit adultery
  chosen_korean: 간음하기
  alternatives_korean:
  - 외도하기
  - 간음하다
  lexicon: NA
  rationale: 윤리적·법적 불법 성관계를 가리키는 동사를 직접적으로 살려, 본문의 죄목을 약화시키지 않도록 했습니다.
- source_word: ἀνελῶ
  english_pob_choice: I will kill
  chosen_korean: 죽이고
  alternatives_korean:
  - 없애고
  - 해치고
  - 죽여
  lexicon: NA
  rationale: 의도적인 살해 행위를 분명히 나타내는 가장 직접적인 표현으로 옮겼습니다.
- source_word: φαρμάκῳ
  english_pob_choice: with poison
  chosen_korean: 독으로
  alternatives_korean:
  - 약으로
  - 독약으로
  lexicon: NA
  rationale: φαρμάκῳ의 문맥상 의미를 독으로 이해하는 것이 자연스럽고, 살해 수단을 명확히 드러냅니다.
- source_word: λήψομαί σε εἰς ἄνδρα
  english_pob_choice: take you as a husband
  chosen_korean: 너를 내 남편으로 삼겠습니다
  alternatives_korean:
  - 너를 남편으로 맞이하겠습니다
  - 너를 남편으로 취하겠습니다
  lexicon: NA
  rationale: ‘남편으로 취하다’는 결혼 관계의 의도적 전환을 나타내므로, 한국어에서는 자연스럽게 ‘내 남편으로 삼다’로 풀었습니다.
