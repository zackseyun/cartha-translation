base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011.yaml
  text: 'And so[a], my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.


    And when I was coming with the Ishmaelites, they kept asking me, saying[b], “Are you a slave?” And I said that I was a household slave, so that I might not put my brothers to shame.'
  footnotes:
  - marker: a
    text: Or, 'they asked me repeatedly.' The imperfect verb suggests continued questioning.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'household slave' reflects Greek ἐξ οἴκου, possibly indicating a domestic or homeborn slave rather than merely 'from a house.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 너희도, 내 자녀들아, 너희의 모든 행위에서 하나님의 두려움을 너희 눈앞에 두고, 너희 형제들을 존중하십시오. 누구든지 주님의 율법을 행하는 사람은 그에게 사랑을 받을 것입니다.


    내가 이스마엘 사람들과 함께 오고 있을 때, 그들이 나에게 계속 물으며 말했습니다. “당신은 노예입니까?” 나는 내가 집안 노예라고 말했습니다. 형제들을 부끄럽게 하지 않으려는 것이었습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 나의 자녀들아
  lexicon: BDAG
  rationale: 호칭의 친밀함과 권면성을 살리면서도 문어체 합쇼체에 맞게 옮겼습니다.
- source_word: φόβον τοῦ θεοῦ
  english_pob_choice: fear of God
  chosen_korean: 하나님의 두려움
  alternatives_korean:
  - 하나님을 두려워함
  - 하나님 경외
  lexicon: BDAG
  rationale: '''fear of God''를 직접 반영해 윤리적·언약적 긴장을 유지했습니다. ''경외''는 다소 완화될 수 있어 피했습니다.'
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  english_pob_choice: before your eyes
  chosen_korean: 너희 눈앞에
  alternatives_korean:
  - 너희 눈앞에 두고
  - 너희 시야에
  lexicon: LSJ
  rationale: 구체적 시각 이미지를 살려, 마음속이 아니라 실제로 앞에 두라는 권면의 힘을 유지했습니다.
- source_word: τιμᾶτε τοὺς ἀδελφοὺς ὑμῶν
  english_pob_choice: honor your brothers
  chosen_korean: 너희 형제들을 존중하십시오
  alternatives_korean:
  - 너희 형제들을 존귀하게 여기십시오
  - 너희 형제들을 공경하십시오
  lexicon: BDAG
  rationale: '''honor''의 사회적 존중과 가족적 관계를 함께 살리기 위해 ''존중하십시오''를 택했습니다. ''공경''은 한국 교회어로는 익숙하지만 다소 경직될 수 있습니다.'
- source_word: ποιῶν νόμον Κυρίου
  english_pob_choice: does the law of the Lord
  chosen_korean: 주님의 율법을 행하는 사람
  alternatives_korean:
  - 주님의 율법을 지키는 사람
  - 주님의 율법대로 사는 사람
  lexicon: BDAG
  rationale: 그리스어의 '행하다'를 살려 율법을 실천하는 윤리적 뉘앙스를 유지했습니다. POB의 'does'를 따라 '행하는'을 택했습니다.
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  english_pob_choice: will be loved by him
  chosen_korean: 그에게 사랑을 받을 것입니다
  alternatives_korean:
  - 그에게 사랑받을 것입니다
  - 그에게 사랑을 입을 것입니다
  lexicon: BDAG
  rationale: 수동태의 직접성을 유지하면서도 현대 한국어에서 자연스럽게 읽히도록 표현했습니다.
- source_word: δοῦλος / δοῦλος εἶ; / δοῦλός εἰμι
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  lexicon: BDAG
  rationale: 이 대목은 신분과 소유 관계가 분명하므로 프로젝트 기본어인 '노예'를 사용했습니다. '종'은 이 문맥의 강한 종속성을 약화시킬 수 있습니다.
- source_word: ἐξ οἴκου
  english_pob_choice: household slave
  chosen_korean: 집안 노예
  alternatives_korean:
  - 가정 노예
  - 집에서 난 노예
  lexicon: LSJ
  rationale: POB의 'household slave'를 한국어로 자연스럽게 풀어, 단순한 출신이 아니라 가내 소속 신분을 드러냈습니다.
- source_word: ὅτι δοῦλός εἰμι ἐξ οἴκου
  english_pob_choice: that I was a household slave
  chosen_korean: 내가 집안 노예라고
  alternatives_korean:
  - 내가 집안의 노예라고
  - 내가 가정 노예라고
  lexicon: LSJ
  rationale: 간접화법을 매끄럽게 처리하면서도 신분 표지를 유지했습니다.
theological_decisions:
- issue: Joseph의 자기 호칭을 '노예'로 번역하는 문제
  chosen_reading: '''노예''로 번역해 매매·소유의 현실을 드러냅니다.'
  alternative_readings:
  - '''종''으로 번역해 전통적 경건어를 따름'
  - '''하인''으로 완화해 번역'
  rationale: 본문은 이스마엘 사람들의 질문과 Joseph의 대답이 모두 매매 가능한 종속 신분을 전제하므로, 완화하지 않는 것이 소스 충실도에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: δοῦλος default rendering'
- issue: '''형제들을 부끄럽게 하지 않으려는 것''의 의미'
  chosen_reading: Joseph이 자기의 높아진 신분이나 가족 관계를 드러내지 않아 형제들의 수치를 피하려 했다는 뜻으로 읽었습니다.
  alternative_readings:
  - 자기 개인적 수치를 피하려 했다는 뜻
  - 아버지의 집 전체를 부끄럽게 하지 않으려 했다는 뜻
  rationale: 직접 목적어가 '형제들'이므로, 형제들을 향한 배려와 수치 회피를 드러내는 해석이 가장 자연스럽습니다.
  doctrine_reference: POB narrative ethics / honor-shame context
