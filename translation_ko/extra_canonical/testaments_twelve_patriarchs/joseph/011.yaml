  rationale: 원문 전체(1–8절)를 보완하고, 한국어의 자연스러움과 지시 대상의 명료성을 높였습니다. ‘노예’라는 신분 용어와 형제들을 수치스럽게 하지 않으려는 이유는 유지했습니다. 판본이 불확실하게 제시하는 두 표현은 교리적으로 해소하거나 단정하지 않고 각주로 표시했습니다.
