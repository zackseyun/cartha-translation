review_pass:
  verdict: revise
  source_fidelity: 현 초안은 11장 1–2절의 핵심 뜻을 대체로 잘 옮겼지만, 제시된 그리스어 본문이 1–8절인데 번역은 1–2절에서 끝나므로 상당한 본문 누락이 있습니다. 또한 φόβον τοῦ θεοῦ는 한국어에서 ‘하나님의 두려움’보다 ‘하나님을 두려워하는 마음’이 자연스럽고 의미도 분명합니다. ἐξ οἴκου는 ‘집안 노예’로 유지하되, 가내 소속 또는 집에서 난 노예를 가리킬 수 있는 표현임을 주석으로 밝혔습니다.
  naturalness: 합쇼체 서술을 유지하되 직접 인용은 상황에 맞는 자연스러운 구어형으로 처리했습니다. ‘그에게 사랑을 받을 것입니다’는 지시 대상이 불분명하고 어색하므로 ‘그분에게 사랑받을 것입니다’로 고쳤습니다. ‘계속 물으며 말했습니다’는 ‘계속 이렇게 물었습니다’로 다듬었습니다.
  terminology: δοῦλος는 매매와 소유 신분이 전면에 있는 문맥이므로 ‘노예’로 유지했습니다. νόμος Κυρίου는 ‘주님의 율법’, τιμᾶτε는 ‘존중하십시오’로 옮겼습니다. 본문 비평상 꺾쇠괄호로 제시된 3절의 αὐτῶν 및 7절의 καὶ ἔργῳ는 번역에 반영하되 주석으로 불확실성을 표시했습니다.
  issues:
  - severity: high
    issue: 제시된 원문 11장 3–8절이 번역문에서 누락되었습니다.
    rationale: 검토 대상의 원문은 1–8절을 포함합니다. 영어 감사 추적은 1–2절까지만 제공하지만, 원문 대조를 우선할 때 한국어 본문은 제공된 원문 전체를 번역해야 합니다.
  - severity: medium
    issue: ‘하나님의 두려움’은 한국어에서 부자연스럽고 의미 관계가 모호합니다.
    rationale: τοῦ θεοῦ는 하나님을 향한 두려움이라는 목적격적 의미입니다. ‘하나님을 두려워하는 마음’이 φόβος의 윤리적 긴장을 유지하면서 현대 한국어로 자연스럽습니다.
  - severity: low
