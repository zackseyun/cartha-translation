id: T12P.JOS.9.3
reference: Testament of Joseph 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Εἰ δὲ¹⁷ ἐν σωφροσύνῃ διάγων *θέλει καὶ¹⁸ δόξαν, καὶ¹⁹ οἶδεν ὁ ὕψιστος ὅτι συμφέρει, παρέχει²⁰ καὶ αὐτῷ καὶ ταῦτα²¹ ὡς κἀμοί.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/003.yaml
  text: But if one lives in self-control and also desires glory, and the Most High knows that it is beneficial, he grants these things also to him, as also to me.
translation:
  language: ko
  text: 그러나 사람이 절제 가운데 살면서 또한 영광을 바란다면, 지극히 높으신 분께서 그것이 유익하다는 것을 아시면, 그분은 그것들도 그에게, 또 나에게 하셨던 것처럼 그에게도 주십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δὲ
  english_pob_choice: But if
  chosen_korean: 그러나 …라면
  alternatives_korean:
  - 그리고 …라면
  - 그런데 …라면
  lexicon: δέ
  rationale: δέ의 대비를 살려 문두를 ‘그러나’로 옮기되, 한국어 문장 흐름은 조건절 형태로 자연스럽게 처리했습니다.
- source_word: ἐν σωφροσύνῃ διάγων
  english_pob_choice: lives in self-control
  chosen_korean: 절제 가운데 살면서
  alternatives_korean:
  - 절제로 살면서
  - 자제하며 살아가면서
  lexicon: σωφροσύνη
  rationale: σωφροσύνη를 단순한 행위가 아니라 삶의 방식으로 나타내기 위해 ‘~가운데 살다’로 풀었습니다.
- source_word: θέλει καὶ δόξαν
  english_pob_choice: also desires glory
  chosen_korean: 또한 영광을 바란다면
  alternatives_korean:
  - 또한 영광을 원한다면
  - 영광을 또한 추구한다면
  lexicon: δόξα
  rationale: δόξα를 문맥상 명예/영예의 의미로 보아 ‘영광’으로 옮겼고, θέλει는 강한 의도보다는 바람을 나타내어 ‘바란다’로 처리했습니다.
- source_word: παρέχει καὶ αὐτῷ καὶ ταῦτα
  english_pob_choice: he grants these things also to him
  chosen_korean: 그분은 그것들도 그에게
  alternatives_korean:
  - 그분은 이 일들도 그에게
  - 그분은 이 모든 것도 그에게
  lexicon: παρέχει, ταῦτα
  rationale: ταῦτα의 복수성에 맞춰 ‘그것들’로 옮겼고, παρέχει는 ‘주다/허락하다’의 수여 의미를 살려 ‘주십니다’로 번역했습니다.
theological_decisions:
- issue: ὁ ὕψιστος의 신칭 처리
  chosen_reading: 지극히 높으신 분
  alternative_readings:
  - 지존자
  - 가장 높으신 하나님
  rationale: 본문은 신적 칭호를 쓰지만, 한국어에서 자연스럽고 직설적인 호칭을 위해 ‘지극히 높으신 분’으로 풀어 썼습니다.
  doctrine_reference: 신칭 번역 일관성; ὕψιστος의 서술적 칭호 보존
- issue: ‘나에게도’의 비교 구문
  chosen_reading: 또 나에게 하셨던 것처럼
  alternative_readings:
  - 나에게도 그러하듯
  - 나에게도 주셨듯이
  rationale: κἀμοί의 비교·병렬을 한국어에서 매끄럽게 드러내기 위해 ‘나에게 하셨던 것처럼’을 사용했습니다.
  doctrine_reference: 병렬 구조 보존
