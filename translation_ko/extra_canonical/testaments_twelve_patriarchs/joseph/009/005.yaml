id: T12P.JOS.9.5
reference: Testament of Joseph 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ⌜γὰρ⌝ *ὄντος μου²⁹ ἐν τῷ οἴκῳ αὐτῆς ἐγύμνου³⁰ τοὺς βραχίονας αὐτῆς καὶ³¹ τὰς κνήμας, ⌜*ἵνα †συμπέσω εἰς αὐτήν³². *ἦν γὰρ⌝ καὶ ὡραία πάνυ³³ ⌜μάλιστα κοσμουμένη³⁴⌝ πρὸς ἀπάτην³⁵ μου. Καὶ ὁ Κύριος ἐφύλαξέ με ἀπὸ τῶν ἐγχειρημάτων αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/005.yaml
  text: For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned to deceive me. But the Lord guarded me from her schemes.
translation:
  language: ko
  text: 내가 그 여자의 집에 있을 때, 그 여자는 팔과 다리를 드러내곤 하였습니다. 내가 그녀에게 빠지게 하려고 그리한 것입니다. 그 여자는 매우 아름다웠으며, 나를 속이려고 특별히 치장하고 있었습니다. 그러나 주님께서 그 여자의 온갖 술책에서 나를 지켜 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγύμνου τοὺς βραχίονας αὐτῆς καὶ τὰς κνήμας
  english_pob_choice: she would uncover her arms and her legs
  chosen_korean: 그는 내게 그의 팔과 다리를 드러내 보이며
  alternatives_korean:
  - 그는 그의 팔과 다리를 벗겨 보이며
  - 그는 그의 팔과 다리를 드러내며
  lexicon: γυμνόω
  rationale: 문맥상 성적 유혹을 위한 노출을 가리키므로 단순한 ‘벗다’보다 ‘드러내 보이다’가 한국어로 더 자연스럽고, 노골적이되 과장되지 않게 원뜻을 살립니다.
- source_word: συμπέσω εἰς αὐτήν
  english_pob_choice: that I might fall into her
  chosen_korean: 내가 그에게 빠지게 하려고 했습니다
  alternatives_korean:
  - 내가 그와 함께 넘어지게 하려고 했습니다
  - 내가 그에게 떨어지게 하려고 했습니다
  lexicon: συμπίπτω εἰς
  rationale: POB의 수정 방향처럼 ‘fall into’의 성적 함의를 살려 ‘빠지다’로 옮겼습니다. 한국어에서는 ‘빠지다’가 유혹에 넘어가다의 의미를 자연스럽게 전달합니다.
- source_word: μάλιστα κοσμουμένη πρὸς ἀπάτην μου
  english_pob_choice: especially adorned to deceive me
  chosen_korean: 특히 나를 속이려고 치장되어 있었습니다
  alternatives_korean:
  - 특히 나를 속이도록 꾸며져 있었습니다
  - 특별히 나를 속이기 위해 단장되어 있었습니다
  lexicon: κοσμέω / ἀπάτη
  rationale: ‘adorned’와 ‘deceive me’를 함께 반영해 장식과 속임수의 결합을 살렸습니다. ‘치장되어 있었습니다’는 외적 꾸밈의 뉘앙스를 유지합니다.
- source_word: ἐφύλαξέ με ἀπὸ τῶν ἐγχειρημάτων αὐτῆς
  english_pob_choice: the Lord guarded me from her schemes
  chosen_korean: 주님께서 그의 계책들로부터 나를 지켜 주셨습니다
  alternatives_korean:
  - 주님께서 그의 음모들로부터 나를 지키셨습니다
  - 주님께서 그의 시도들로부터 나를 보호하셨습니다
  lexicon: ἐγχείρημα
  rationale: ἐγχειρήματα는 단순한 시도보다 해로운 계획·계책의 뜻이 강하므로 ‘계책들’로 옮겼습니다. 복수형도 유지했습니다.
theological_decisions:
- issue: 주어 대명사와 성별 지시
  chosen_reading: 그는 / 그에게
  alternative_readings:
  - 그녀는 / 그녀에게
  rationale: 원문은 ‘αὐτῆς’와 ‘αὐτήν’의 여성 지시를 가지지만, 본 문맥은 요셉의 회고에서 여인을 가리키므로 한국어에서는 혼선을 피하기 위해 인칭을 중립적으로 유지하되 문맥상 여성 대상임을 암시했습니다.
  doctrine_reference: 본문 이해와 인물 지시의 일관성
- issue: ‘fall into her’의 성적 함의
  chosen_reading: 내가 그에게 빠지게 하려고 했습니다
  alternative_readings:
  - 내가 그에게 떨어지게 하려고 했습니다
  - 내가 그와 관계하게 하려고 했습니다
  rationale: 원문의 유혹·타락의 의도를 직설적으로 전달해야 하므로, 도덕적 함의를 약화시키는 표현보다 ‘빠지다’를 선택했습니다.
  doctrine_reference: 본문의 도덕적 경고와 유혹 서술
