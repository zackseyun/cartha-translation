id: T12P.JOS.9.4
reference: Testament of Joseph 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ποσάκις²² καίπερ ἀσθενοῦσα κατῄει ⌜πρός με⌝ ἐν ἀωρίᾳ²³, καὶ ἤκουσε²⁴ τῆς φωνῆς μου προσευχομένου²⁵, *καὶ ἐγὼ συνίων²⁶ *τοὺς στεναγμούς²⁷ ἐσιώπων²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/004.yaml
  text: How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.
translation:
  language: ko
  text: 그녀는 아팠는데도, 때 아닌 시간에 몇 번이나 제게 내려와 제가 기도하는 소리를 들었습니다. 저는 그녀의 신음을 알아차리고 침묵했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενοῦσα
  english_pob_choice: she was sick
  chosen_korean: 아팠음에도 불구하고
  alternatives_korean:
  - 병이 들었음에도
  - 몸이 약했음에도
  lexicon: ἀσθενέω
  rationale: 단순 상태 설명을 넘어서 앞뒤 대조(그녀가 아팠는데도 내려옴)를 살리기 위해 자연스러운 문장 안에서 표현했습니다.
- source_word: κατῄει πρός με
  english_pob_choice: she came down to me
  chosen_korean: 내게 내려와
  alternatives_korean:
  - 내게 왔습니다
  - 내게로 내려왔습니다
  lexicon: κατέρχομαι
  rationale: ‘내려오다’의 방향성을 유지해 원문의 동작 이미지를 보존했습니다.
- source_word: ἐν ἀωρίᾳ
  english_pob_choice: at an untimely hour
  chosen_korean: 때가 맞지 않는 시간에
  alternatives_korean:
  - 한밤중에
  - 이르지 않은 때에
  lexicon: ἀώριος
  rationale: 구체적 시각을 임의로 정하지 않고, ‘적절하지 않은 때’라는 시간적 부조화를 드러냈습니다.
- source_word: στεναγμούς
  english_pob_choice: groanings
  chosen_korean: 신음 소리
  alternatives_korean:
  - 탄식
  - 신음
  lexicon: στεναγμός
  rationale: 청각적으로 들리는 울림을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: “그녀”의 기도와 “그녀의 신음” 사이의 관계
  chosen_reading: 여성이 병중에도 찾아와 화자에게서 기도의 소리를 들었고, 화자는 그녀의 탄식을 이해한 뒤 침묵했습니다.
  alternative_readings:
  - 그녀가 화자의 기도를 들었다는 단순 사실 진술
  - 화자가 그녀의 신음만 듣고 침묵했다는 분리된 장면
  rationale: 원문의 병렬 구조(기도하는 나의 소리 / 그녀의 신음)를 그대로 살려 서로의 내적 상태를 아는 상호 인지 장면으로 읽었습니다.
  doctrine_reference: 서사 문맥 보존
