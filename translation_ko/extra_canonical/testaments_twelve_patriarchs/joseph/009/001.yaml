id: T12P.JOS.9.1
reference: Testament of Joseph 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/001.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: ko
  text: 그리고 내가 사슬에 매여 있는 동안, 그 이집트 여인은 슬픔에 짓눌려 있었습니다. 그녀가 찾아올 때마다, 내가 어둠의 집에서 주님께 감사드리고 찬송을 부르며, 밝은 목소리로 기뻐하면서 내 하나님께 영광을 돌리는 것을 귀 기울여 들었습니다. 내가 한 구실로 이집트 여인에게서 벗어났기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  english_pob_choice: in chains
  chosen_korean: 사슬에 매여 있는 동안
  alternatives_korean:
  - 사슬 속에 있을 때
  - 감옥의 결박 속에 있을 때
  lexicon: δεσμοί
  rationale: 단순한 공간표현보다 구속 상태를 드러내는 말이어서, 형벌·감금의 상태를 자연스럽게 살렸습니다.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  english_pob_choice: was held together by grief
  chosen_korean: 슬픔에 붙들려 있었습니다
  alternatives_korean:
  - 슬픔에 사로잡혀 있었습니다
  - 슬픔으로 괴로워하고 있었습니다
  lexicon: συνέχω
  rationale: ‘붙들리다’는 수동적 압박과 내적 억눌림을 함께 드러내어, 본문의 긴장감을 보존합니다.
- source_word: ἐπηκροᾶτό μου
  english_pob_choice: would listen to me
  chosen_korean: 나를 들을 때면
  alternatives_korean:
  - 내 말을 귀 기울여 들었습니다
  - 나를 엿들었습니다
  lexicon: ἐπακροάομαι
  rationale: POB 수정안의 ‘listen to me’를 따르되, 한국어에서는 반복적 습관을 나타내는 ‘-을 때면’으로 자연스럽게 옮겼습니다.
- source_word: ἐν οἴκῳ τοῦ σκότους
  english_pob_choice: in the house of darkness
  chosen_korean: 어둠의 집에서
  alternatives_korean:
  - 어둠의 집 안에서
  - 흑암의 집에서
  lexicon: οἶκος / σκότος
  rationale: 직역 구조를 유지하면서도 ‘어둠의 집’으로 하여 상징적·시적 이미지를 살렸습니다.
- source_word: δοξάζων τὸν Θεόν μου
  english_pob_choice: glorifying my God
  chosen_korean: 내 하나님을 찬양하는 것을 들었습니다
  alternatives_korean:
  - 내 하나님께 영광 돌리는 것을 들었습니다
  - 내 하나님을 영화롭게 하는 것을 들었습니다
  lexicon: δοξάζω
  rationale: 문맥상 ‘들었다’의 목적절을 한국어로 자연화하기 위해 동명사적 표현으로 풀었고, δοξάζω의 핵심 의미는 ‘찬양/영화롭게 함’으로 보존했습니다.
- source_word: διὰ προφάσεως ἀπηλλάγην
  english_pob_choice: by a pretext I had been delivered
  chosen_korean: 속임수로 ... 풀려났기 때문에
  alternatives_korean:
  - 구실로 ... 벗어났기 때문에
  - 명분을 내세워 ... 해방되었기 때문에
  lexicon: πρόφασις / ἀπαλλάσσω
  rationale: πρόφασις의 기만적 뉘앙스를 살리기 위해 ‘속임수’로 옮겼고, ἀπηλλάγην은 ‘풀려나다’로 자연스럽게 대응했습니다.
theological_decisions:
- issue: 주님/하나님 호칭의 구분
  chosen_reading: ἡυχαρίστουν τῷ Κυρίῳ는 ‘주님께 감사하고’로, τὸν Θεόν μου는 ‘내 하나님’으로 구분해 옮겼습니다.
  alternative_readings:
  - 모두 ‘하나님’으로 통일
  - 모두 ‘주님’으로 통일
  rationale: 본문이 κύριος와 Θεός를 나란히 구별하므로, 한국어에서도 두 호칭을 구별해 원문의 대조를 보존했습니다.
  doctrine_reference: 원문 호칭 구별 보존
- issue: τίμησις of affliction vs. deliverance
  chosen_reading: ‘어둠의 집’과 ‘사슬’ 및 ‘풀려났다’의 이미지를 그대로 유지해 고난과 해방의 대조를 드러냈습니다.
  alternative_readings:
  - 상징을 약화해 단순 서술로 정리
  - 고난 이미지를 더 설명적으로 확장
  rationale: 이 문장은 요셉의 인내와 하나님의 섭리를 대조적으로 증언하므로, 상징적 어휘를 보존하는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 섭리와 인내의 증언
