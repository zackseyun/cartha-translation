  - severity: medium
    issue: ‘사람을 보내며’가 원문에 없는 전달자를 추가합니다.
    rationale: ἔπεμψε πρός με λέγουσα는 ‘내게 여러 번 보내어 말하였다’라는 뜻이며, 사람을 보냈다고 특정하지 않습니다. ‘전갈을 보내어’는 한국어의 자연스러움을 확보하면서 불필요한 인물 추가를 피합니다.
