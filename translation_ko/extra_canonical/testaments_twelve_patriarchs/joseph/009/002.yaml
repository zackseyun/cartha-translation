id: T12P.JOS.9.2
reference: Testament of Joseph 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις δὲ¹ ἔπεμψε πρός με λέγουσα². Εὐδόκησον³ ⸀πληρῶσαι τὴν ἐπιθυμίαν⸀ μου, καὶ λύω⁴ σε ἐκ⁵ τῶν δεσμῶν, ⸀καὶ ἀπαλλάξω σε ἐκ⁶ τοῦ σκότους⸀. *Ἐγὼ δὲ οὐδὲ⁷ ἕως⁸ ἐννοίας⁹ ἐξέκλινα¹⁰ πρὸς αὐτήν· *ὁ γὰρ θεὸς ἀγαπᾷ¹¹ μᾶλλον τὸν¹² ἐν¹³ λάκκῳ σκότους †πιστὸν¹⁴ ἐν σωφροσύνῃ¹⁵, ἢ τὸν ἐν ταμείοις †βασιλέα¹⁶ τρυφῶντα μετ’ ἀκολασίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/002.yaml
  text: Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.” But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.
translation:
  language: ko
  text: 그녀는 여러 번 내게 전갈을 보내어 말했습니다. “내 욕망을 채워 주기로 동의하십시오. 그러면 내가 당신을 사슬에서 풀어 주고, 어둠에서 풀어 주겠습니다.” 그러나 나는 생각으로조차 그녀 쪽으로 돌아서지 않았습니다. 하나님께서는 어둠의 구덩이에서 절제 가운데 신실한 사람을, 창고들에서 왕으로서 방탕하게 사치하는 사람보다 더 사랑하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘절제 가운데 신실한 사람’: 그리스어 πιστὸν ἐν σωφροσύνῃ는 절제 또는 자제 안에서 충실한 사람을 가리킵니다.'
    reason: πιστός와 σωφροσύνη의 결합을 분명히 하여 핵심 윤리적 대조를 보존합니다.
  - marker: b
    text: '‘창고들’: 그리스어 ταμεῖα는 저장실, 내실, خز고 등을 뜻할 수 있습니다. 여기서는 문맥과 영어 POB 감사 번역에 따라 ‘창고들’로 옮겼습니다.'
    reason: ταμεῖα의 어휘 범위와 번역상 불확실성을 투명하게 제시합니다.
lexical_decisions:
- source_word: Εὐδόκησον / πληρῶσαι τὴν ἐπιθυμίαν μου
  english_pob_choice: Consent to fulfill my desire
  chosen_korean: '"내 욕망을 채워 주기로 동의하십시오"'
  alternatives_korean:
  - '"내 소원을 이루어 주기로 동의하십시오"'
  - '"내 바람을 채워 주십시오"'
  lexicon: εὐδοκέω, ἐπιθυμία
  rationale: εὐδόκησον은 단순한 동의가 아니라 요청을 받아들이라는 뜻이므로 "동의하십시오"로 살리고, ἐπιθυμία는 문맥상 성적 욕망을 가리키므로 완곡한 "소원"보다 "욕망"이 원문 긴장을 더 잘 드러냅니다.
- source_word: λύω ... ἀπαλλάξω ... ἐκ τῶν δεσμῶν / ἐκ τοῦ σκότους
  english_pob_choice: I will release you from your chains ... I will free you from the darkness
  chosen_korean: '"당신을 당신의 사슬에서 풀어 주고, 어둠에서 건져 드리겠습니다"'
  alternatives_korean:
  - '"당신을 사슬에서 해방하고, 어둠에서 풀어 주겠습니다"'
  - '"당신을 결박에서 놓아 주고, 어둠에서 해방하겠습니다"'
  lexicon: δεσμοί, σκότος
  rationale: δεσμοί는 물리적 구속을 분명히 보여 주는 "사슬"로, σκότος는 상태를 살린 "어둠"으로 옮겼습니다. ἀπαλλάξω는 단순 해방보다 탈출·구출의 뉘앙스가 있어 "건져 드리겠습니다"가 적합합니다.
- source_word: ἐννοίας / οὐδὲ ... ἐξέκλινα πρὸς αὐτήν
  english_pob_choice: I did not turn even in thought toward her
  chosen_korean: '"생각으로도 그녀에게 조금도 기울이지 않았습니다"'
  alternatives_korean:
  - '"생각으로도 그녀 쪽으로 빗나가지 않았습니다"'
  - '"마음으로조차 그녀에게 눈을 돌리지 않았습니다"'
  lexicon: ἐννοία, ἐκκλίνω
  rationale: ἐννοίας를 단순한 ‘마음’보다 인지 작용인 "생각"으로 잡고, ἐκκλίνω의 방향 전환 이미지를 "기울이지 않았다"로 살려 내적 유혹의 거부를 드러냈습니다.
- source_word: πιστὸν ἐν σωφροσύνῃ / μετ’ ἀκολασίας
  english_pob_choice: one who is faithful in self-control ... lives in luxury with lawlessness
  chosen_korean: '"믿음 있는 사람" / "방탕함과 함께 ... 사치하는"'
  alternatives_korean:
  - '"신실한 사람" / "절제 가운데 있는"'
  - '"성실한 사람" / "무법과 함께 사치하는"'
  lexicon: πιστός, σωφροσύνη, ἀκολασία
  rationale: πιστός는 여기서 언약적/도덕적 충실함을 포괄하므로 문맥상 자연스러운 "믿음 있는"을 택했고, σωφροσύνη는 절제·자제의 덕을 가리켜 "자제"보다 조금 더 넓은 "믿음 있는 사람"과 결합된 "방탕함" 대비로 처리했습니다. ἀκολασία는 단순 쾌락이 아니라 절제 없음과 방종이므로 "방탕함"이 적절합니다.
theological_decisions:
- issue: 하나님의 평가 기준이 처소의 고귀함이 아니라 도덕적 충실성에 있음을 어떻게 드러낼지
  chosen_reading: 하나님은 어둠의 구덩이에 있는 믿음 있는 사람을 ... 왕보다 더 사랑하십니다
  alternative_readings:
  - 하나님은 ... 신실한 사람을 더 사랑하십니다
  - 하나님은 ... 충성스러운 사람을 더 사랑하십니다
  rationale: πιστός는 이 문맥에서 외적 지위보다 내적 충실성을 평가하는 말이므로, 하나님이 높이 보시는 기준이 ‘신분’이 아니라 ‘믿음/충실’임을 분명히 했습니다.
  doctrine_reference: 성화와 절제에 대한 성경의 도덕적 우선성
