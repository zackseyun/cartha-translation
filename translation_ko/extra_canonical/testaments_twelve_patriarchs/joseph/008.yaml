base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008.yaml
  text: '6[a]. And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.” 7. But she did not know that I spoke thus because of my Lord, and not because of her. 8. For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he interprets it in terms of that passion, toward his evil desire[b].


    1. So I say, my children, that it was about the sixth hour when she left me. And bending my knee to the Lord all that day and all that night, toward dawn I rose, weeping and asking for deliverance from her. 2. At last, with evil intent, she seized my garments by force, dragging me violently toward intercourse. 3. Therefore, when I saw that in her frenzy she had hold of my tunic, I left it behind and fled naked. 4. But she, taking hold of it, slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me, he sent me into Pharaoh’s dungeon. 5. And while I was in chains[c], the Egyptian woman was constrained by grief.'
  footnotes:
  - marker: a
    text: 'The Greek text in this verse is textually tangled in the witness represented by the OCR layer. The sense is clear overall: she kept Joseph''s garment, falsely accused him, and he was imprisoned and later sent to Pharaoh''s prison.'
    reason: textual_variant
    anchor_ref: '8:4'
  - marker: b
    text: Or 'into sexual union.' The Greek συνουσία is an explicit term for sexual relations.
    reason: lexical_alternative
    anchor_ref: '8:2'
  - marker: c
    text: This scene echoes Gen 39:12, where Joseph leaves his garment and flees from Potiphar's wife.
    reason: cross_reference
    anchor_ref: '8:3'
translation:
  language: ko
  text: '6. 그녀가 저에게 말했습니다. “보십시오, 당신은 저를 사랑하는군요. 이것이면 저에게 충분합니다. 다만 제 목숨과 제 자녀들을 돌보아 주십시오. 그러면 저도 제 욕망을 이루리라는 희망이 있습니다.” 7. 그러나 그녀는 제가 이렇게 말한 것이 그녀 때문이 아니라 제 주님 때문이라는 것을 알지 못했습니다. 8. 누구든지 욕망의 격정에 빠져 그것에 종노릇하게 되면, 그녀도 그러했듯이, 좋은 말을 듣더라도 그것을 그 격정의 관점에서 해석하여 자기의 악한 욕망에 맞게 받아들입니다.


    1. 그러므로 나는 내 자녀들에게 말합니다. 그녀가 나를 떠난 때는 여섯째 시쯤이었습니다. 나는 온종일과 온 밤 동안 주님께 무릎을 꿇고, 새벽에 일어나 울며 그녀에게서 건져 주시기를 구했습니다. 2. 마침내 그녀는 억지로 제 옷을 붙잡고, 동침하려고 저를 강제로 끌었습니다.[b] 3. 그러므로 그녀가 제정신이 아닌 채 제 속옷을 붙들고 있는 것을 보고, 나는 그것을 남겨 둔 채 벌거벗고 달아났습니다.[c] 4. 그러나 그녀는 그것을 붙잡아 저를 거짓으로 고발했습니다.[a] 그녀의 남편이 와서 나를 자기 집의 감옥에 가두었고, 다음 날 나를 채찍질한 뒤 파라오의 감옥으로 보냈습니다. 5. 내가 사슬에 매여 있는 동안, 그 이집트 여인은 슬픔에 짓눌려 있었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 그리스어 본문은 전승과 OCR 자료에서 일부 얽혀 있습니다. 그러나 전체 뜻은 분명합니다. 여인이 요셉의 옷을 붙들고 그를 거짓으로 고발했으며, 요셉은 갇혔다가 뒤에 파라오의 감옥으로 보내졌습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘성적 결합으로.’ 그리스어 συνουσία는 여기서 성관계를 명시적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 이 장면은 요셉이 옷을 남겨 두고 달아나는 창세기 39:12를 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου
  english_pob_choice: take thought for my life
  chosen_korean: 제 생명을 돌보아 주십시오
  alternatives_korean:
  - 제 생명을 생각해 주십시오
  - 제 삶을 맡아 주십시오
  lexicon: LSJ
  rationale: 이 관용구는 생명을 염려하여 맡아 주는 뜻이므로, 한국어로는 ‘돌보다’가 가장 자연스럽고 원문의 요청성도 살립니다.
- source_word: προσδοκίαν ἀπολαῦσαι τῆς ἐπιθυμίας μου
  english_pob_choice: I have hope that I shall also obtain my desire
  chosen_korean: 제 욕망을 얻게 되리라는 희망이 있습니다
  alternatives_korean:
  - 제가 바라는 것을 얻으리라는 희망이 있습니다
  - 제 소원을 누리게 되리라는 기대가 있습니다
  lexicon: LSJ
  rationale: ἀπολαύω의 ‘얻다/누리다’와 ἐπιθυμία의 욕망성을 함께 드러내기 위해, 중립적으로 ‘얻게 되다’와 ‘욕망’을 유지했습니다.
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας / δουλωθῇ αὐτῷ
  english_pob_choice: falls under the passion of desire / is enslaved to it
  chosen_korean: 욕망의 정욕 아래로 떨어져 그것의 종이 된 사람
  alternatives_korean:
  - 욕망의 열정에 사로잡혀 그것에 예속된 사람
  - 욕정의 충동에 굴복해 그것의 노예가 된 사람
  lexicon: LSJ
  rationale: πάθος와 δουλόω의 결합은 단순한 감정이 아니라 지배와 예속을 뜻하므로, ‘정욕 아래로 떨어지다’와 ‘종이 되다’로 강한 속박을 보존했습니다.
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  english_pob_choice: he interprets it in terms of that passion, toward his evil desire
  chosen_korean: 그것을 그 정욕과 관련하여, 자기의 악한 욕망 쪽으로 받아들입니다
  alternatives_korean:
  - 그것을 그 정욕의 관점에서 해석합니다
  - 그것을 자기의 악한 욕망에 맞게 이해합니다
  lexicon: LSJ
  rationale: 이 동사는 단순 수용보다 ‘해석/받아들임’의 인지적 왜곡을 함의하므로, POB의 주석적 취지를 살려 ‘관련하여…받아들이다’로 옮겼습니다.
- source_word: κλίνας γόνυ
  english_pob_choice: bending my knee
  chosen_korean: 무릎을 꿇고 있다가
  alternatives_korean:
  - 무릎을 굽히고 있다가
  - 무릎을 꺾어
  lexicon: LSJ
  rationale: 기도 장면의 상투적 표현을 현대 합쇼체로 자연스럽게 살리기 위해 ‘무릎을 꿇다’를 선택했습니다.
- source_word: συνουσίαν
  english_pob_choice: intercourse
  chosen_korean: 동침
  alternatives_korean:
  - 성관계
  - 성적 결합
  lexicon: LSJ
  rationale: 원문은 성관계를 노골적으로 가리키므로 의미를 흐리지 않되, 과도한 현대 의학어보다 서술 문맥에 맞는 ‘동침’을 택했습니다.
- source_word: ἐσυκοφάντησέ με
  english_pob_choice: slandered me
  chosen_korean: 저를 무고하였고
  alternatives_korean:
  - 저를 험담하였고
  - 저를 거짓으로 고발하였고
  lexicon: LSJ
  rationale: 문맥상 단순 비방보다 허위 고발의 뉘앙스가 강하므로, 법적·서사적 뉘앙스를 함께 지닌 ‘무고하다’로 옮겼습니다.
- source_word: εἰρκτήν
  english_pob_choice: dungeon
  chosen_korean: 감옥
  alternatives_korean:
  - 지하 감옥
  - 옥중
  lexicon: LSJ
  rationale: 앞에서는 집의 감옥, 뒤에서는 파라오의 감옥을 대비해야 하므로, 첫 번째는 일반적으로 ‘감옥’으로 풀고 두 번째는 고유한 ‘감옥’을 유지했습니다.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  english_pob_choice: was constrained by grief
  chosen_korean: 슬픔 때문에 눌려 있었습니다
  alternatives_korean:
  - 슬픔에 사로잡혀 있었습니다
  - 슬픔으로 괴로워하고 있었습니다
  lexicon: LSJ
  rationale: συνέχω의 ‘압박받다’ 이미지를 살리기 위해 ‘눌려 있다’로 옮겨, 슬픔의 신체적 압박감을 보존했습니다.
theological_decisions:
- issue: ‘제 주님’의 지시 대상
  chosen_reading: 여기서 주님은 하나님을 가리키며, 요셉이 유혹을 거절한 동기를 하나님 앞의 경외로 설명하는 대목입니다.
  alternative_readings:
  - 주인의 권위를 가리킨다고 볼 수도 있습니다
  - 의도적으로 모호하게 둘 수도 있습니다
  rationale: 문맥 전체가 요셉의 도덕적 절제와 기도 장면으로 이어지므로, ‘주님’을 하나님으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: κύριος의 문맥적 판별; POB 보편 원칙에 따라 하나님께 적용될 때 ‘주님’으로 번역
