  source_fidelity: 수정이 필요합니다. 특히 8:1의 ἕκτη는 현대 시각으로 ‘여섯 시’가 아니라 통상 ‘여섯째 시’(대략 정오)를 뜻합니다. 8:2의 현존 그리스어에는 ‘악한 뜻으로’에 해당하는 말이 없으며, βίᾳ는 강제로라는 뜻입니다. 8:3의 χιτών을 ‘치마’로 옮긴 것은 부정확합니다. 7:8의 πάθει ἐπιθυμίας는 ‘욕망의 정욕’보다 ‘욕망의 격정’이 자연스럽고, ἐκλαμβάνει의 해석적 의미도 더 분명히 드러낼 필요가 있습니다.
  naturalness: 초안은 전반적으로 합쇼체를 유지하지만, ‘욕망의 정욕 아래로 떨어져’, ‘악한 욕망 쪽으로 받아들입니다’, ‘무릎을 꿇고 있다가’는 부자연스럽거나 문맥 관계가 불명확합니다. 인용문의 ‘사랑하시는군요’도 상대 높임이 불필요하게 강하므로 일반적 서술형으로 다듬었습니다.
  terminology: κύριος는 문맥상 판단을 강요하지 않도록 ‘제 주님’으로 유지했습니다. συνουσία는 ‘동침’으로, χιτών은 현대어에서 오해를 줄이면서도 의복을 가리키는 ‘속옷’으로 옮겼습니다. ἐσυκοφάντησεν은 서사 문맥의 허위 고발을 명시하는 ‘거짓으로 고발했습니다’로 번역했습니다.
  issues:
  - severity: high
    issue: 8:1의 ‘거의 여섯 시쯤’
    rationale: ἕκτη ὥρα는 고대의 시간 구분인 ‘여섯째 시’를 가리키며, 이를 현대 시각 여섯 시로 옮기면 의미가 달라집니다.
  - severity: medium
    issue: 8:2의 ‘악한 뜻으로’ 첨가
    rationale: 제시된 그리스어는 τέλος βίᾳ로, 마침내/결국 그리고 강제로라는 의미입니다. 악한 의도를 명시하는 어휘는 없습니다.
  - severity: high
    issue: 8:3의 χιτών을 ‘치마’로 번역
    rationale: χιτών은 튜닉, 즉 몸에 가까이 입는 옷이며 치마를 뜻하지 않습니다.
  - severity: medium
    issue: 7:8의 욕망 표현 및 해석 동사
    rationale: ‘욕망의 정욕’은 중복적이고, ‘관련하여 … 쪽으로 받아들입니다’는 ἐκλαμβάνει의 왜곡된 해석/이해의 의미를 충분히 전달하지 못합니다.
  - severity: medium
    issue: 각주 표지와 내용의 앵커 불일치
    rationale: 초안은 [a][b][c]를 8:5 끝에 한꺼번에 두었으나, 본문상 각주는 각각 8:4의 본문 문제, 8:2의 συνουσία, 8:3의 창세기 병행에 붙어야 합니다. 영어 감사 기록의 a·b 내용도 표지 위치가 뒤바뀌어 있으므로, 내용에 맞게 배치·표지를 정정했습니다.
  revised_text: '6. 그녀가 저에게 말했습니다. “보십시오, 당신은 저를 사랑하는군요. 이것이면 저에게 충분합니다. 다만 제 목숨과 제 자녀들을 돌보아 주십시오. 그러면 저도 제 욕망을 이루리라는 희망이 있습니다.” 7. 그러나 그녀는 제가 이렇게 말한 것이 그녀 때문이 아니라 제 주님 때문이라는 것을 알지 못했습니다. 8. 누구든지 욕망의 격정에 빠져 그것에 종노릇하게 되면, 그녀도 그러했듯이, 좋은 말을 듣더라도 그것을 그 격정의 관점에서 해석하여 자기의 악한 욕망에 맞게 받아들입니다.


    1. 그러므로 나는 내 자녀들에게 말합니다. 그녀가 나를 떠난 때는 여섯째 시쯤이었습니다. 나는 온종일과 온 밤 동안 주님께 무릎을 꿇고, 새벽에 일어나 울며 그녀에게서 건져 주시기를 구했습니다. 2. 마침내 그녀는 억지로 제 옷을 붙잡고, 동침하려고 저를 강제로 끌었습니다.[b] 3. 그러므로 그녀가 제정신이 아닌 채 제 속옷을 붙들고 있는 것을 보고, 나는 그것을 남겨 둔 채 벌거벗고 달아났습니다.[c] 4. 그러나 그녀는 그것을 붙잡아 저를 거짓으로 고발했습니다.[a] 그녀의 남편이 와서 나를 자기 집의 감옥에 가두었고, 다음 날 나를 채찍질한 뒤 파라오의 감옥으로 보냈습니다. 5. 내가 사슬에 매여 있는 동안, 그 이집트 여인은 슬픔에 짓눌려 있었습니다.'
  revised_footnotes:
  - marker: a
    text: 이 절의 그리스어 본문은 전승과 OCR 자료에서 일부 얽혀 있습니다. 그러나 전체 뜻은 분명합니다. 여인이 요셉의 옷을 붙들고 그를 거짓으로 고발했으며, 요셉은 갇혔다가 뒤에 파라오의 감옥으로 보내졌습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘성적 결합으로.’ 그리스어 συνουσία는 여기서 성관계를 명시적으로 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 이 장면은 요셉이 옷을 남겨 두고 달아나는 창세기 39:12를 떠올리게 합니다.
    reason: cross_reference
  revision_rationale: 원문에 없는 의도 표현을 삭제하고, 고대 시간 표현·의복 명칭·강제성과 성적 의미를 바로잡았습니다. 또한 주님이라는 호칭의 지시 대상을 번역문에서 해설적으로 확정하지 않았으며, 본문 비평 각주와 어휘·상호참조 각주를 해당 절에 정확히 배치했습니다.
