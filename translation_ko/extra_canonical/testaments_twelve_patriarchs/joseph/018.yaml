review_pass:
  verdict: revise
  source_fidelity: 3절의 주어 연결이 한국어 문법상 어색하고, 2절의 ὑπό Κυρίου는 ‘주님으로부터’보다 주님의 행위로 옮기는 편이 정확합니다. 또한 3절의 ‘그들’은 그리스어 본문에서 선행사가 명시되지 않으므로 특정 집단으로 해석하지 않고 유지해야 합니다.
  naturalness: 합쇼체는 대체로 적절하지만, ‘여러분은 … 저는 … 알고 있습니다’는 비문에 가깝습니다. 조건문과 인과 관계를 자연스러운 현대 한국어 문장으로 다듬었습니다.
  terminology: ἐντολαῖς는 ‘계명’, ἀγαθοεργείᾳ는 ‘선을 행함으로’, ταπείνωσις와 μακροθυμία는 ‘겸손과 오래 참음’으로 유지했습니다. 3절의 Κύριός μου는 원문의 호칭을 따라 ‘나의 주님’으로 옮기며, 그 지시 대상을 본문 밖에서 확정하지 않았습니다.
  issues:
  - severity: high
    issue: 3절의 ‘여러분은 … 저는 … 알고 있습니다’라는 주어 연결
    rationale: ὁρᾶτε γὰρ는 ‘보십시오/여러분도 아는 바와 같이’라는 권면이며, 뒤의 1인칭 서술과 결합되어야 합니다. 현 번역은 발화 주체가 혼동되어 문법과 의미가 모두 흐려집니다.
  - severity: medium
    issue: 2절의 ‘주님으로부터 모든 악에서 건짐을 받게 될 것입니다’
    rationale: ὑπὸ Κυρίου는 수동문의 행위자 표현입니다. ‘주님께서 … 건져 주실 것입니다’가 원문의 행위 주체를 분명히 드러냅니다.
  - severity: medium
    issue: 3절 ‘나의 주님’의 지시 대상을 주인으로 한정한 해설
    rationale: 본문 자체는 Κύριός μου라고만 하며, 해당 호칭의 지시 대상을 인간 주인으로 확정할 근거가 제시되지 않습니다. 번역에서는 호칭을 보존하고 해석적 한정은 피해야 합니다.
  - severity: low
    issue: 4절의 ‘아름다운 사람들보다’
    rationale: ὑπὲρ ὡραίους Ἰσραήλ은 이스라엘 안의 아름다운 이들보다 더 아름답다는 비교입니다. ‘이스라엘의 누구보다도 아름답게’가 현대 한국어로 더 자연스럽습니다.
  revised_text: '1. 그러므로 여러분도 주님의 계명 안에서 걸으십시오. 그러면 하나님께서 여러분을 좋은 것들 가운데서 영원히 높이실 것입니다.


    2. 누군가 여러분에게 악을 행하려 하더라도, 여러분은 선을 행함으로 그를 위하여 기도하십시오. 그러면 주님께서 여러분을 모든 악에서 건져 주실 것입니다.


    3. 보십시오. 여러분도 아는 바와 같이, 나의 겸손과 오래 참음으로 말미암아 나는 헬리오폴리스 제사장의 딸을 아내로 맞이하였고, 그녀와 함께 금 백 달란트를 받았습니다. 나의 주님께서는 그들을 내게 복종시키셨습니다.


    4. 더욱이 그분께서는 나를 이스라엘의 누구보다도 아름답게 하셨고, 노년에 이를 때까지 힘과 아름다움 가운데서 나를 지키셨습니다. 사실 나는 모든 면에서 야곱과 같았습니다.'
  revised_footnotes:
  - marker: a
    text: 3절의 ‘그들’은 그리스어 본문에 선행사가 명시되어 있지 않습니다.
    reason: αὐτούς의 지시 대상을 특정 집단이나 사물로 해석하여 본문에 없는 내용을 보태지 않도록 합니다.
  revision_rationale: 3절의 비문을 바로잡고, 2절의 수동문 행위자를 명료하게 옮겼습니다. 3절의 불명확한 대명사와 ‘나의 주님’이라는 호칭은 원문이 허용하는 범위에서 보존했으며, 4절의 비교 표현을 자연스러운 현대 표준 한국어로 다듬었습니다.
