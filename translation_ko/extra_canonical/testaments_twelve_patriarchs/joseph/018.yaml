base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018.yaml
  text: '1. If, then, you also walk in the commandments of the Lord, God will exalt you in good things forever.

    2. And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.

    3. For see, you yourselves know that through my humility and my long-suffering I took as my wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.

    4. Even so'
translation:
  language: ko
  text: '1. 그러므로 여러분도 주님의 계명을 따라 걸으십시오. 그러면 하나님께서 여러분을 영원히 좋은 것들 가운데서 높이실 것입니다.

    2. 또 누군가 여러분에게 악을 행하려 할지라도, 여러분은 선행으로 그를 위해 기도하십시오. 그러면 여러분은 주님으로부터 모든 악에서 건짐을 받게 될 것입니다.

    3. 보십시오. 여러분은 저의 겸손과 오래 참음으로 인해 저는 헬리오폴리스 제사장의 딸을 아내로 맞이했으며, 그녀와 함께 금 백 달란트도 제게 주어졌고, 나의 주님께서 그것들을 제게 복종하게 하셨다는 것을 알고 있습니다.

    4. 또한 아름다움도 제게 주셔서 이스라엘의 아름다운 사람들보다 뛰어나게 하셨고, 노년이 될 때까지 힘과 아름다움 가운데서 저를 지키셨습니다. 사실 저는 모든 면에서 야곱과 같았습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολαῖς Κυρίου
  english_pob_choice: commandments of the Lord
  chosen_korean: 주님의 계명
  alternatives_korean:
  - 주님의 명령
  - 주님의 계명들
  lexicon: ἐντολή
  rationale: ἐντολαῖς는 단순한 규정이 아니라 신적 권위 아래의 삶의 지침을 뜻하므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘계명’으로 옮겼습니다.
- source_word: ἐν ἀγαθοῖς
  english_pob_choice: in good things
  chosen_korean: 좋은 것들 가운데서
  alternatives_korean:
  - 좋은 일들 가운데서
  - 선한 것들 가운데서
  - 좋은 것 안에서
  lexicon: ἀγαθός
  rationale: POB의 ‘in good things’는 단순히 ‘잘되다’가 아니라 선한 복의 영역을 가리키므로, ‘좋은 것들 가운데서’로 공간적·상태적 함의를 살렸습니다.
- source_word: ἀγαθοεργείᾳ
  english_pob_choice: by doing good
  chosen_korean: 선행으로
  alternatives_korean:
  - 선을 행함으로
  - 좋은 일을 함으로
  lexicon: ἀγαθοεργία
  rationale: 행위의 방식이 강조되므로 ‘선행으로’가 간결하면서도 동사적 의미를 보존합니다.
- source_word: κατεδούλωσεν
  english_pob_choice: made them subject to me
  chosen_korean: 복종하게 하셨습니다
  alternatives_korean:
  - 내게 굴복하게 하셨습니다
  - 내 아래에 두셨습니다
  - 종으로 삼으셨습니다
  lexicon: καταδουλόω
  rationale: 지배 아래 두는 뜻을 드러내되, 본문 맥락상 인격적·정치적 종속을 직접적으로 환기하는 ‘복종하게 하셨습니다’로 옮겼습니다.
- source_word: ταπείνωσιν καὶ τὴν μακροθυμίαν
  english_pob_choice: my humility and my long-suffering
  chosen_korean: 저의 겸손과 오래 참음
  alternatives_korean:
  - 저의 낮아짐과 인내
  - 저의 겸비와 오래 참음
  lexicon: ταπείνωσις, μακροθυμία
  rationale: 두 덕목의 결합을 한국어 윤리어휘로 자연스럽게 살리되, ‘오래 참음’으로 μακροθυμία의 지속적 인내를 표현했습니다.
theological_decisions:
- issue: 하나님과 주님의 구별
  chosen_reading: 3절의 "나의 주님"은 주인이자 보호자 역할을 하는 인물의 표현으로 유지하고, 1·2절의 "주님"은 주님의 계명과 구원 행위의 주체로 유지했습니다.
  alternative_readings:
  - 모두 같은 인물 호칭처럼 통일하기
  - 3절의 주님을 하나님으로 풀이하기
  rationale: 본문은 같은 호칭 형태를 사용하지만 문맥상 3절의 'my Lord'는 요셉의 주인/주재자적 언급으로 읽히므로, 한국어에서도 문맥적 차이를 지키는 것이 해석상 더 안전합니다.
  doctrine_reference: 문맥 기반 인칭 구분
