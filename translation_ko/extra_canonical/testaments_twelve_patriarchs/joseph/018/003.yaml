id: T12P.JOS.18.3
reference: Testament of Joseph 18:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδοὺ¹⁰ ⌜γὰρ⌉¹¹ ὁρᾶτε ὅτι ⌜διὰ τὴν *ταπείνωσιν καὶ τὴν μακροθυμίαν μου¹²⌉ θυγατέρα *ἱερέως ἡλιουπόλεως¹³ ἔλαβον ἐμαυτῷ¹⁴ εἰς γυναῖκα¹⁵, καὶ ἑκατὸν τάλαντα *χρυσίου δέδονταί μοι¹⁶ *σὺν αὐτῇ¹⁷, *καὶ ὁ¹⁸ Κύριός μου¹⁹ αὐτοὺς²⁰ κατεδούλωσεν²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/003.yaml
  text: For see, you know that through my humility and my long-suffering I took for myself as wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.
translation:
  language: ko
  text: 보십시오. 여러분도 아시다시피, 나는 내 겸손과 오래 참음으로 헬리오폴리스 제사장의 딸을 내 아내로 맞아들였고, 금 백 달란트가 그녀와 함께 내게 주어졌으며, 내 주님께서 그들을 내게 복종시키셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ ... ὁρᾶτε
  english_pob_choice: For see, you know
  chosen_korean: 보십시오, ... 알고 계십니다
  alternatives_korean:
  - 보라, ... 너희가 알다시피
  - 이제 보십시오, ... 여러분도 아십니다
  lexicon: source text
  rationale: Ἰδοὺ는 주의를 환기하는 감탄사로 옮기고, ὁρᾶτε는 단순 명령이라기보다 청자들이 이미 알고 있음을 상기하는 표현으로 살렸습니다.
- source_word: διὰ τὴν ταπείνωσιν καὶ τὴν μακροθυμίαν μου
  english_pob_choice: through my humility and my long-suffering
  chosen_korean: 내 겸손과 오래 참음으로
  alternatives_korean:
  - 내 낮아짐과 오래 참음으로
  - 내 겸손함과 인내로
  lexicon: ταπείνωσις / μακροθυμία
  rationale: ταπείνωσις는 여기서 ‘겸손’이 자연스럽고, μακροθυμία는 지속적 인내를 가리켜 ‘오래 참음’이 소스를 가장 직접적으로 반영합니다.
- source_word: θυγατέρα ... ἔλαβον ἐμαυτῷ εἰς γυναῖκα
  english_pob_choice: I took for myself as wife the daughter ...
  chosen_korean: 나는 ... 딸을 아내로 나 자신에게 맞이하였고
  alternatives_korean:
  - 나는 ... 딸을 아내로 삼았고
  - 나는 ... 딸을 아내로 데려왔고
  lexicon: ἐμαυτῷ / εἰς γυναῖκα
  rationale: ἐμαυτῷ의 ‘for myself’는 단순히 결혼했다보다 자기에게 들였다는 방향성을 가지므로 ‘나 자신에게’로 살렸습니다.
- source_word: κατεδούλωσεν
  english_pob_choice: made them subject to me
  chosen_korean: 그들을 내게 복종시키셨습니다
  alternatives_korean:
  - 그들을 내게 종속시키셨습니다
  - 그들을 내 아래에 두셨습니다
  lexicon: καταδουλόω
  rationale: 이 동사는 강한 지배/종속의 의미를 지니므로, POB의 ‘made them subject to me’를 따라 ‘복종시키셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 주어 호칭 Κύριός μου의 한국어 처리
  chosen_reading: 내 주님
  alternative_readings:
  - 내 주
  - 나의 주님
  rationale: 소유격 대명사 μου가 붙은 관계를 살리면서도, 본문 내 화자의 하나님/주권자를 자연스럽게 드러내기 위해 ‘내 주님’으로 옮겼습니다.
  doctrine_reference: source-level reverence and referent clarity
