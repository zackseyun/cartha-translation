review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the marriage, the hundred talents of gold given with the woman, and the Lord's subjugation of unspecified persons. However, it omits the indicative/addressee sense of ὁρᾶτε (“you know/see”), and “나 자신에게 맞이하였고” is not idiomatic Korean for ἔλαβον ἐμαυτῷ εἰς γυναῖκα.
  naturalness: Modern formal-polite register is generally maintained, but “아내로 나 자신에게 맞이하였고” is unnatural. “내 아내로 맞아들였고” is idiomatic and retains the reflexive-benefactive force in natural Korean.
  terminology: “겸손,” “오래 참음,” “헬리오폴리스,” “달란트,” and “내 주님” are suitable. “내게 복종시키셨습니다” adequately represents κατεδούλωσεν without adding an interpretive antecedent for αὐτούς.
  issues:
  - severity: medium
    issue: ὁρᾶτε의 청자 인식 표현이 번역문에 반영되지 않았습니다.
    rationale: Ἰδοὺ γὰρ ὁρᾶτε ὅτι는 단순한 “보십시오”만이 아니라 청자들이 알고 있음을 환기합니다. “여러분도 아시다시피”로 반영하는 것이 적절합니다.
  - severity: medium
    issue: “아내로 나 자신에게 맞이하였고”가 비문에 가깝고 현대 표준 한국어로 부자연스럽습니다.
    rationale: ἐμαυτῷ εἰς γυναῖκα는 ‘자기 아내로 삼다/맞아들이다’라는 결혼 관용구로 자연스럽게 옮겨야 합니다. “내 아내로 맞아들였고”가 의미와 문체를 모두 보존합니다.
  revised_text: 보십시오. 여러분도 아시다시피, 나는 내 겸손과 오래 참음으로 헬리오폴리스 제사장의 딸을 내 아내로 맞아들였고, 금 백 달란트가 그녀와 함께 내게 주어졌으며, 내 주님께서 그들을 내게 복종시키셨습니다.
  revised_footnotes: []
  revision_rationale: ὁρᾶτε의 복수 청자 및 ‘알고 있음’의 뉘앙스를 보충하고, ἐμαυτῷ εἰς γυναῖκα를 현대 한국어의 자연스러운 결혼 표현으로 수정했습니다. αὐτούς의 선행사는 본문에서 특정되지 않으므로 “그들”로 그대로 두었습니다.
