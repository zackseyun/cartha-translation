  to: 보십시오. 여러분도 아시다시피, 나는 내 겸손과 오래 참음으로 헬리오폴리스 제사장의 딸을 내 아내로 맞아들였고, 금 백 달란트가 그녀와 함께 내게 주어졌으며, 내 주님께서 그들을 내게 복종시키셨습니다.
