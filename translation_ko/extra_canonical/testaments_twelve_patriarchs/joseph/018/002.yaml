id: T12P.JOS.18.2
reference: Testament of Joseph 18:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ *ἐάν τις θέλει⁷ κακοποιῆσαι ὑμᾶς, ὑμεῖς τῇ ἀγαθοεργείᾳ⁸ εὔχεσθε ὑπὲρ αὐτοῦ, καὶ ἀπὸ παντὸς κακοῦ λυτρωθήσεσθε ὑπὸ⁹ Κυρίου¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/002.yaml
  text: And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.
translation:
  language: ko
  text: 그리고 만일 누가 여러분에게 해를 끼치려고 하면, 여러분은 선을 행함으로써 그를 위해 기도하십시오. 그러면 주님께서 여러분을 모든 악에서 건져 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοποιῆσαι
  english_pob_choice: to do evil
  chosen_korean: 해를 끼치려고 하다
  alternatives_korean:
  - 악을 행하려 하다
  - 해를 입히려고 하다
  lexicon: κακοποιέω
  rationale: 문맥상 단순한 추상적 ‘악행’보다 대상에게 실제 해를 가하려는 뜻이 분명하므로, 현대 한국어에서 자연스럽고 힘이 살아 있는 표현으로 옮겼습니다.
- source_word: τῇ ἀγαθοεργείᾳ
  english_pob_choice: by doing good
  chosen_korean: 선을 행하며
  alternatives_korean:
  - 선행으로
  - 선한 행실로
  lexicon: ἀγαθοεργία
  rationale: 행위의 수단을 나타내므로 ‘선을 행하며’로 풀어, 단순 명사화보다 본문의 행위성을 살렸습니다.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  english_pob_choice: pray for him
  chosen_korean: 그를 위하여 기도하십시오
  alternatives_korean:
  - 그를 위해 기도하십시오
  - 그를 위하여 빌십시오
  lexicon: εὔχομαι
  rationale: εὔχομαι는 일반적인 ‘기도하다’보다 ‘간청하다/기도하다’의 폭이 있지만, 여기서는 한국어 성경 문체에서 가장 직접적인 ‘기도하십시오’가 적절합니다.
- source_word: λυτρωθήσεσθε
  english_pob_choice: you will be delivered
  chosen_korean: 건져 주실 것입니다
  alternatives_korean:
  - 구해 주실 것입니다
  - 속량해 주실 것입니다
  lexicon: λυτρόω
  rationale: 구원의 결과를 능동적으로 체험하는 뜻을 살리되, 한국어에서 자연스럽게 들리는 ‘건져 주다’로 옮겼습니다.
- source_word: ὑπὸ Κυρίου
  english_pob_choice: by the Lord
  chosen_korean: 주님께서
  alternatives_korean:
  - 주님에 의해
  - 주님으로부터
  lexicon: κύριος
  rationale: 수동태의 행위 주체를 한국어에서 자연스럽게 주어화하여, 문장의 흐름을 살리면서도 ‘주님’이라는 공경어를 유지했습니다.
theological_decisions:
- issue: 악을 당했을 때의 응답 방식
  chosen_reading: 해를 끼치려는 자에게도 선을 행하며 그를 위해 기도하라는 윤리로 번역했습니다.
  alternative_readings:
  - 그를 저주하다
  - 그에게 맞서다
  rationale: 본문은 보복이 아니라 선행과 중보기도를 요구하므로, 윤리적 대조를 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 원수 사랑과 보복 거절의 성서적 윤리(마 5:44, 롬 12:21)
