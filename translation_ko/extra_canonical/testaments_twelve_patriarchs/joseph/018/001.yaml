  rationale: 조건·결론 구조와 원문의 핵심 어휘를 보존하면서, 한국어에서 부자연스러운 ‘계명들 안에서 걸어가다’를 자연스러운 윤리적 표현으로 바로잡고, 대응 주석이 없는 표지를 제거했습니다.
