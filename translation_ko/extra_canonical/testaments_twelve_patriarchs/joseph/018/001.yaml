  naturalness: ‘주님의 계명들을 따라 살아가면’은 윤리적 삶을 뜻하는 πορεύομαι의 비유적 용법을 현대 표준 한국어로 자연스럽게 옮깁니다. ‘좋은 것들로 여러분을 영원히 높이실 것입니다’는 약간 직역적인 긴장을 남기지만 원문의 표현 범위와 영어 POB의 ‘with good things’를 보존합니다.
  terminology: Κύριος는 ‘주님’, θεός는 ‘하나님’, ἐντολαί는 ‘계명들’로 일관되게 옮겼습니다. 특정 교파적 해석을 덧붙이지 않았습니다.
