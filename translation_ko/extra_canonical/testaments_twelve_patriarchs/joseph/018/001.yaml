base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/001.yaml
  text: If, then, you also walk in the commandments of the Lord, God will exalt you with good things forever.
translation:
  language: ko
  text: 그러므로 여러분도 주님의 계명들을 따라 살아가면, 하나님께서 좋은 것들로 여러분을 영원히 높이실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν οὖν καὶ ὑμεῖς
  english_pob_choice: If, then, you also
  chosen_korean: 그러므로 여러분도
  alternatives_korean:
  - 그러니 여러분도
  - 그런즉 여러분도
  lexicon: conditional/logical transition
  rationale: ἐὰν οὖν의 조건-추론 흐름을 한국어의 자연스러운 결론 연결로 옮기되, ὑμεῖς의 강조를 ‘여러분도’로 살렸습니다.
- source_word: πορευθῆτε
  english_pob_choice: walk
  chosen_korean: 걸어가면
  alternatives_korean:
  - 행하면
  - 걷게 되면
  lexicon: πορεύομαι
  rationale: 단순한 이동이 아니라 삶의 방식으로서의 ‘walk’이므로, 계명 안에서의 지속적 행위를 드러내는 ‘걸어가다’를 택했습니다.
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  english_pob_choice: in the commandments of the Lord
  chosen_korean: 주님의 계명들 안에서
  alternatives_korean:
  - 주님의 계명들을 지키면
  - 주님의 계명들 가운데
  lexicon: ἐν + ἐντολή + κύριος
  rationale: ἐν을 관계적/삶의 영역 표시로 받아 ‘안에서’로 옮기고, Κυρίου는 본문 문맥에 맞춰 ‘주님’으로 번역했습니다.
- source_word: ἐν ἀγαθοῖς
  english_pob_choice: with good things
  chosen_korean: 좋은 것들로
  alternatives_korean:
  - 좋은 일들로
  - 선한 것들로
  lexicon: ἀγαθός
  rationale: 영어 POB의 최신 수정인 ‘with good things’를 반영하여, 수단·동반의 뉘앙스를 살리는 ‘-로’ 구문을 선택했습니다.
theological_decisions:
- issue: Κυρίου의 한국어 표기
  chosen_reading: 주님의 계명들
  alternative_readings:
  - 야훼의 계명들
  - 주(主)의 계명들
  rationale: 여기서 Κυρίου는 일반적인 서신체 호칭이라기보다 순종의 대상인 주권적 주를 가리키므로, 한국어 독자에게 자연스럽고 문맥상 직관적인 ‘주님’을 사용했습니다.
  doctrine_reference: 주권적 순종의 언어, 문맥상 호칭
- issue: 하나님께서 높이시는 방식과 ἐν ἀγαθοῖς
  chosen_reading: 좋은 것들로 영원히 높이실 것입니다
  alternative_readings:
  - 좋은 것들 가운데 영원히 높이실 것입니다
  - 좋은 일들로 영원히 높이실 것입니다
  rationale: 문법상 ἐν ἀγαθοῖς는 ‘좋은 것들/좋은 것들로’의 동반·수단적 의미를 띨 수 있어, English POB의 수정 방향에 맞춰 ‘좋은 것들로’로 처리했습니다.
  doctrine_reference: 보상/축복의 약속 표현
