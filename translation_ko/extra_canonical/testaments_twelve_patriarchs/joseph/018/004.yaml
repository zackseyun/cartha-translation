source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καίγε καὶ²² ὡραιότητα ἔδωκέ²³ μοι ὑπὲρ ὡραίους Ἰσραήλ, ⌜καὶ⌉ ἐφύλαξέ²⁴ με ⌜ἕως γήρους²⁵ ἐν δυνάμει καὶ⌉ ἐν κάλλει· *Καὶ γὰρ ὅμοιος ἤμην²⁶ ἐν πᾶσι τῷ²⁷ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/004.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things.
translation:
  language: ko
  text: 참으로 그는 이스라엘의 잘생긴 사람들보다 더한 아름다움을 저에게 주시고, 힘과 아름다움 가운데 늙은 나이까지 저를 지켜 주셨습니다. 이는 제가 모든 면에서 야곱과 같았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα
  english_pob_choice: beauty
  chosen_korean: 아름다움
  alternatives_korean:
  - 아리땜
  - 아름다운 용모
  lexicon: ὡραιότης
  rationale: 외모의 아름다움과 인상적 품위를 함께 담기 위해 기본 의미인 ‘아름다움’을 택했습니다.
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  english_pob_choice: beyond the handsome men of Israel
  chosen_korean: 이스라엘의 잘생긴 사람들보다 더한
  alternatives_korean:
  - 이스라엘의 아름다운 이들보다 더한
  - 이스라엘의 수려한 사람들보다 더한
  lexicon: ὡραῖος
  rationale: ὡραῖος를 사람의 외모를 가리키는 말로 보고, 비교 표현 ὑπὲρ를 살려 ‘~보다 더한’으로 옮겼습니다.
- source_word: ἐφύλαξέ με
  english_pob_choice: preserved me
  chosen_korean: 저를 지켜 주셨습니다
  alternatives_korean:
  - 저를 보존하셨습니다
  - 저를 지켜 보존하셨습니다
  lexicon: φυλάσσω
  rationale: 단순 생존 유지보다 보호와 보살핌의 뉘앙스를 살려 자연스럽게 옮겼습니다.
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  english_pob_choice: in strength and in beauty
  chosen_korean: 힘과 아름다움 가운데
  alternatives_korean:
  - 힘과 아름다움 속에서
  - 힘과 아름다움 안에서
  lexicon: δύναμις, κάλλος
  rationale: 전치사 반복을 한국어에서는 자연스럽게 하나의 상태 표현으로 묶되, 두 명사 모두 유지했습니다.
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  english_pob_choice: I was like Jacob in all things
  chosen_korean: 제가 모든 면에서 야곱과 같았기 때문입니다
  alternatives_korean:
  - 제가 모든 일에서 야곱과 같았기 때문입니다
  - 제가 전반적으로 야곱과 같았기 때문입니다
  lexicon: ὅμοιος, ἐν πᾶσι
  rationale: ‘ἐν πᾶσι’를 관용적으로 ‘모든 면에서’로 옮겨 비교의 범위를 분명히 했습니다.
theological_decisions:
- issue: 문장 첫머리의 καίγε 강조
  chosen_reading: 참으로
  alternative_readings:
  - 심지어
  - 그리고도
  rationale: καίγε의 강조 기능을 살려 서술 전체를 강화하면서도 한국어 문맥에 어색하지 않게 처리했습니다.
  doctrine_reference: 수사적 강조
- issue: 야곱과의 유사성 표현
  chosen_reading: 제가 모든 면에서 야곱과 같았기 때문입니다
  alternative_readings:
  - 제가 모든 일에서 야곱과 비슷했기 때문입니다
  - 제가 야곱처럼 모든 것을 닮았기 때문입니다
  rationale: 본문의 자기 진술과 비교를 유지하되, 과장 없이 ‘같았다’로 직역 성향을 살렸습니다.
  doctrine_reference: 서사적 자기증언
