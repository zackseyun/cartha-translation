- from: 그러나 여러분은 내 뼈를 여러분과 함께 가지고 올라가야 합니다. 내 뼈가 그곳에서 올라가게 될 때, 주님은 빛 가운데 여러분과 함께 계실 것이며, 벨리아르는 이집트인들과 함께 어둠 가운데 있을 것입니다.[a]
  to: 그러나 여러분은 내 뼈를 가지고 함께 올라갈 것입니다. 내 뼈가 그곳에서 옮겨 올라갈 때, 주님은 빛 가운데 여러분과 함께 계실 것이며, 벨리아르는 어둠 가운데 이집트인들과 함께 있을 것입니다.
  rationale: 원문의 예언적 미래형은 한국어 미래 서술형으로 옮기고, 뼈들이 ‘올려지는’ 수동적 의미는 ‘옮겨 올라갈 때’로 보완했습니다. 빛과 어둠, 주님과 벨리아르, 여러분과 이집트인들의 대조는 그대로 유지했습니다. 내용 없는 각주 표지는 제거했습니다.
