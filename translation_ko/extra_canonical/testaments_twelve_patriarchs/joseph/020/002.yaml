id: T12P.JOS.20.2
reference: Testament of Joseph 20:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὑμεῖς δὲ¹⁰ συνανοίσετε¹¹ τὰ ὀστᾶ μου¹² μεθ᾽ ὑμῶν¹³, ⌜ὅτι, ἀναγομένων¹⁴ τῶν ὀστέων ἐκεῖ¹⁵, Κύριος ἐν φωτὶ ἔσται μεθ᾽ ὑμῶν¹⁶, καὶ ὁ¹⁷ Βελίαρ *ἐν σκότει ἔσται¹⁸ μετὰ τῶν Αἰγυπτίων⌉.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/002.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: ko
  text: 그러나 여러분은 내 뼈를 가지고 함께 올라갈 것입니다. 내 뼈가 그곳에서 옮겨 올라갈 때, 주님은 빛 가운데 여러분과 함께 계실 것이며, 벨리아르는 어둠 가운데 이집트인들과 함께 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε τὰ ὀστᾶ μου μεθ᾽ ὑμῶν
  english_pob_choice: you shall carry up my bones with you
  chosen_korean: 내 뼈를 여러분과 함께 가지고 올라가야 합니다
  alternatives_korean:
  - 내 뼈를 여러분과 함께 올라가야 합니다
  - 내 뼈를 여러분과 함께 데리고 올라가야 합니다
  lexicon: συναναφέρω / ὀστέα
  rationale: 동사 συνανοίσετε는 단순한 ‘데려가다’보다 ‘가지고 올라가다’의 방향성과 동반성을 함께 담고 있어, 뼈를 ‘가지고 올라가야 합니다’로 옮겨 원문 감각을 살렸습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: κύριος
  rationale: 문맥상 하나님을 가리키는 κύριος이므로, 한국어에서는 자연스럽고 존칭이 유지되는 ‘주님’으로 옮겼습니다.
- source_word: ἐν φωτὶ ἔσται / ἐν σκότει ἔσται
  english_pob_choice: will be with you in light / will be with the Egyptians in darkness
  chosen_korean: 빛 가운데 여러분과 함께 계실 것이며 … 어둠 가운데 있을 것입니다
  alternatives_korean:
  - 빛 속에서 … 어둠 속에서
  - 빛 가운데 … 어둠 가운데
  lexicon: φῶς / σκότος
  rationale: 전치사 ἐν을 단순한 상태표현으로 처리해 ‘빛 가운데’, ‘어둠 가운데’로 번역하여 대비 구조를 보존했습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  - 벨리아르
  lexicon: Βελίαρ
  rationale: 고유명사 Βελίαρ은 한국어 외래어 표기 관행을 따라 ‘벨리아르’로 음역했습니다.
theological_decisions:
- issue: 주님의 임재와 벨리아르의 대조
  chosen_reading: 주님은 빛 가운데 이스라엘 편에 함께 계시고, 벨리아르는 어둠 가운데 이집트인들과 함께 있게 된다는 대조를 살렸습니다.
  alternative_readings:
  - 주님과 벨리아르의 상징적 대비를 완화해 일반적 선악 대조로 옮기는 방식
  - ‘있을 것입니다’ 대신 ‘계실 것입니다’와 같이 양쪽 모두를 동일하게 평준화하는 방식
  rationale: 원문은 출애굽/장차의 공동체 운명을 빛과 어둠의 대립으로 제시하므로, 이를 약화하지 않고 장소표현을 그대로 살리는 것이 문맥에 부합합니다.
  doctrine_reference: 문맥상 종말론적·대조적 서술 보존
- issue: 직접 지시형 표현의 한국어화
  chosen_reading: ‘여러분은 … 가지고 올라가야 합니다’로 미래적 의무를 나타냈습니다.
  alternative_readings:
  - 직설적으로 ‘여러분은 … 가져올 것입니다’
  - 명령형 ‘가져가십시오’
  rationale: 헬라어 미래형이 약속과 의무를 함께 띠는 문맥이므로, 한국어에서는 다소 강한 필연성을 가진 서술형으로 옮겨 원문의 예언적 어조를 유지했습니다.
  doctrine_reference: 서사적 예언-명령 혼합 어조
