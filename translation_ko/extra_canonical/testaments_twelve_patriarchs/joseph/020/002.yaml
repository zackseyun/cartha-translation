  source_fidelity: 핵심 대조와 인명 표기는 원문에 충실합니다. 다만 ἀναγομένων τῶν ὀστέων의 수동적 의미, 곧 뼈들이 ‘옮겨 올려질’ 때라는 뜻을 초안의 ‘내 뼈가 ... 올라가게 될 때’보다 분명히 드러낼 필요가 있습니다. 또한 미래 직설법 συνανοίσετε는 여기서 예언적 미래로 자연스럽게 옮길 수 있으므로 ‘올라갈 것입니다’가 ‘올라가야 합니다’보다 직접적입니다.
  naturalness: ‘여러분은 내 뼈를 가지고 함께 올라갈 것입니다’는 원문의 동반 및 상향 이동을 자연스러운 현대 한국어로 표현합니다. ‘빛 가운데/어둠 가운데’의 병행은 격식 있는 문체에서 자연스럽고 대조를 보존합니다.
  terminology: Κύριος는 ‘주님’, Βελίαρ는 그리스어 본문에 맞춘 ‘벨리아르’로 유지할 수 있습니다. 벨리아르에게는 존칭을 사용하지 않고 ‘있을 것입니다’로 처리한 것은 적절합니다.
  issues:
  - severity: medium
    issue: 수동적 ‘뼈들이 옮겨 올려짐’의 의미가 약함
    rationale: ἀναγομένων τῶν ὀστέων은 뼈들이 누군가에 의해 올려지는 상황을 가리킵니다. ‘올라가게 될 때’는 행위 주체와 운반의 뉘앙스를 충분히 나타내지 못할 수 있습니다.
  - severity: low
