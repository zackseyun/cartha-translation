review_pass:
  verdict: revise
  source_fidelity: 첫 접속사 δέ는 여기서 강한 역접을 요구하지 않는데, 초안의 ‘그러나’는 원문에 없는 대조를 더합니다. 또한 ἀναγομένων τῶν ὀστέων ἐκεῖ는 ‘내 뼈가 거기서 올라가게 될 때’보다 ‘내 뼈를 그곳에서 옮겨 올릴 때’가 수동적·상황적 표현을 더 자연스럽고 정확하게 반영합니다.
  naturalness: ‘내 뼈를 여러분과 함께 가지고 올라가야 합니다’는 ‘여러분’의 반복 때문에 다소 부자연스럽습니다. ‘내 뼈를 가지고 함께 올라가야 합니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘뼈’, ‘주님’, ‘벨리알’, ‘이집트 사람들’, 그리고 ‘빛 가운데/어둠 가운데’의 대조는 원문 의미와 격식 있는 문체에 적절합니다. 다만 본문에 [a] 표지가 있으나 이에 대응하는 각주가 제공되지 않았으므로 제거해야 합니다.
  issues:
  - severity: medium
    issue: ‘그러나’는 δέ의 의미를 과도하게 역접으로 한정합니다.
    rationale: 이 문맥의 δέ는 흔히 단순 연결 또는 화제 전환이며, 선행 대조가 제시되지 않은 상태에서 ‘그러나’를 사용하면 원문에 없는 대립을 만듭니다.
  - severity: low
    issue: ‘거기서 올라가게 될 때’가 ἀναγομένων의 표현을 어색하게 처리합니다.
    rationale: 뼈가 스스로 ‘올라가게’ 되는 듯한 표현보다, 뼈가 옮겨 올려지는 상황을 나타내는 ‘내 뼈를 그곳에서 옮겨 올릴 때’가 자연스럽고 원문의 수동적 상황 표현에 가깝습니다.
  - severity: medium
    issue: '[a] 각주 표지에 대응하는 각주가 없습니다.'
    rationale: 독자가 확인할 수 없는 표지는 구조적으로 불완전하므로 삭제해야 합니다.
  revised_text: 여러분은 내 뼈를 가지고 함께 올라가야 합니다. 내 뼈를 그곳에서 옮겨 올릴 때, 주님은 빛 가운데 여러분과 함께 계실 것이고, 벨리알은 어둠 가운데 이집트 사람들과 함께 있을 것입니다.
