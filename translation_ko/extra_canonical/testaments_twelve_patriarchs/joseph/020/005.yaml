- from: 그러나 여러분은 내 뼈를 여러분과 함께 가지고 올라가야 합니다. 내 뼈가 거기서 올라가게 될 때, 주님은 빛 가운데 여러분과 함께 계실 것이고, 벨리알은 어둠 가운데 이집트 사람들과 함께 있을 것입니다.[a]
  to: 여러분은 내 뼈를 가지고 함께 올라가야 합니다. 내 뼈를 그곳에서 옮겨 올릴 때, 주님은 빛 가운데 여러분과 함께 계실 것이고, 벨리알은 어둠 가운데 이집트 사람들과 함께 있을 것입니다.
