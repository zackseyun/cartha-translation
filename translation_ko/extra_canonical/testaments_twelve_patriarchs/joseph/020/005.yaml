base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/005.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: ko
  text: 그러나 여러분은 내 뼈를 여러분과 함께 가지고 올라가야 합니다. 내 뼈가 거기서 올라가게 될 때, 주님은 빛 가운데 여러분과 함께 계실 것이고, 벨리알은 어둠 가운데 이집트 사람들과 함께 있을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε τὰ ὀστᾶ μου μεθ᾽ ὑμῶν
  english_pob_choice: you shall carry up my bones with you
  chosen_korean: 내 뼈를 여러분과 함께 가지고 올라가야 합니다
  alternatives_korean:
  - 내 뼈를 여러분과 함께 올려야 합니다
  - 내 뼈를 여러분과 함께 운반해야 합니다
  lexicon: συναναφέρω/συνανοίγω 계열의 ‘함께 위로 가져가다, 가지고 올라가다’
  rationale: 단순한 ‘묻다’가 아니라 뼈를 약속의 땅으로 함께 옮겨 가는 행위를 직접 드러내기 위해 ‘가지고 올라가다’를 택했습니다.
- source_word: ὀστᾶ
  english_pob_choice: bones
  chosen_korean: 뼈
  alternatives_korean:
  - 유골
  - 뼛가루
  lexicon: ὀστέον
  rationale: 원문은 ‘뼈’ 자체를 말하므로, 장례적 뉘앙스를 과잉으로 덧붙이는 ‘유골’보다 직역에 가까운 ‘뼈’가 적절합니다.
- source_word: Κύριος ἐν φωτὶ ἔσται μεθ᾽ ὑμῶν
  english_pob_choice: the Lord will be with you in light
  chosen_korean: 주님은 빛 가운데 여러분과 함께 계실 것이고
  alternatives_korean:
  - 주님은 빛 안에서 여러분과 함께 계실 것이고
  - 주님은 빛 가운데 여러분과 함께 계시며
  lexicon: κύριος / ἐν φωτὶ / μεθ᾽ ὑμῶν
  rationale: κύριος는 여기서 야훼를 가리키는 신적 칭호이지만, 문맥상 직접 발화의 리듬을 살려 본문에는 ‘주님’으로 두고, ‘빛 가운데’는 보호와 인도적 임재를 자연스럽게 살렸습니다.
- source_word: Βελίαρ ἐν σκότει ἔσται μετὰ τῶν Αἰγυπτίων
  english_pob_choice: Beliar will be with the Egyptians in darkness
  chosen_korean: 벨리알은 어둠 가운데 이집트 사람들과 함께 있을 것입니다
  alternatives_korean:
  - 벨리알은 어둠 가운데 이집트인들과 함께 있을 것입니다
  - 벨리알은 어둠 속에서 이집트 사람들과 함께 있을 것입니다
  lexicon: Βελίαρ / ἐν σκότει / Αἰγύπτιοι
  rationale: 고유명사 ‘벨리알’을 음역하고, ‘이집트 사람들’로 풀어 원문의 민족 집단을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 빛/어둠의 대조와 주님-벨리알의 병치
  chosen_reading: 주님은 빛 가운데, 벨리알은 어둠 가운데 있다고 대조적으로 옮겼습니다.
  alternative_readings:
  - 주님이 빛이 되어 여러분과 함께 계신다
  - 벨리알이 어둠을 주관한다
  rationale: 원문은 존재 상태와 동반 관계를 병치하여 대비시키므로, 인과나 지배 개념을 덧붙이지 않고 대조 구조를 보존했습니다.
  doctrine_reference: 종말론적 이원 대조를 드러내는 본문 구조
- issue: κύριος의 처리
  chosen_reading: 본문에서는 ‘주님’으로 옮기되, 이는 하나님의 임재를 가리키는 칭호로 이해했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 텍스트는 정경 본문이 아니라 외경/유언 문헌이므로, POB의 YHWH 표기 원칙을 기계적으로 적용하지 않고 문맥상 자연스러운 ‘주님’을 택했습니다.
  doctrine_reference: 외경/비정경 문헌의 번역 관행
