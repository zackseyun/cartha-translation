id: T12P.JOS.20.1
reference: Testament of Joseph 20:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/001.yaml
  text: For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.
translation:
  language: ko
  text: 내가 알기로는 내가 죽은 뒤에 이집트 사람들이 너희를 괴롭힐 것입니다. 그러나 하나님께서 너희의 원수를 갚으시고, 너희를 너희 조상들의 약속들 안으로 이끌어 들이실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τὴν τελευτήν μου
  english_pob_choice: after my death
  chosen_korean: 내가 죽은 뒤에
  alternatives_korean:
  - 내 죽음 이후에
  - 내가 세상을 떠난 뒤에
  lexicon: μετά + accusative; τελευτή
  rationale: 시간 순서를 자연스럽게 옮기되, 원문의 단순한 ‘죽음 이후’ 의미를 유지했습니다.
- source_word: θλίψουσιν ὑμᾶς
  english_pob_choice: will oppress you
  chosen_korean: 너희를 괴롭힐 것입니다
  alternatives_korean:
  - 너희를 압제할 것입니다
  - 너희를 억압할 것입니다
  lexicon: θλίβω
  rationale: θλίβω의 박해·압박 의미를 살리면서, 한국어로는 지속적 고통을 주는 행위를 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  english_pob_choice: will execute your vengeance
  chosen_korean: 너희의 원수를 갚으시고
  alternatives_korean:
  - 너희를 위한 보복을 행하시고
  - 너희의 복수를 이루시고
  lexicon: ἐκδίκησις
  rationale: 영어 POB의 ‘execute your vengeance’를 따라 법적·공적 집행의 뉘앙스를 살리되, 한국어에서는 문맥상 ‘원수를 갚다’가 가장 자연스럽고 의미를 보존합니다.
- source_word: ἐπάξει ὑμᾶς εἰς τὰς ἐπαγγελίας τῶν πατέρων ὑμῶν
  english_pob_choice: bring you into the promises of your fathers
  chosen_korean: 너희를 너희 조상들의 약속들 안으로 이끌어 들이실 것입니다
  alternatives_korean:
  - 너희를 너희 조상들의 약속 속으로 데려가실 것입니다
  - 너희를 너희 조상들에게 주신 약속들 안으로 인도하실 것입니다
  lexicon: ἐπάγω; ἐπαγγελία
  rationale: ἐπάγω의 ‘이끌다/데려가다’ 의미와 ἐπαγγελίας의 복수형을 보존하기 위해 ‘약속들’로 옮겼으며, 원문에 없는 ‘돌아가다’는 넣지 않았습니다.
theological_decisions:
- issue: 하나님의 보복 주체 표현
  chosen_reading: 하나님께서 너희의 원수를 갚으시고
  alternative_readings:
  - 하나님께서 너희의 복수를 집행하시고
  - 하나님께서 너희의 보응을 이루시고
  rationale: 원문은 하나님이 억압에 대한 정의로운 응답을 실행하신다는 점을 말하므로, 보복의 주체를 하나님으로 분명히 드러내되 과도한 설명은 피했습니다.
  doctrine_reference: 신적 공의와 언약적 구원 행위
- issue: 복수형 ‘약속들’의 보존
  chosen_reading: 너희 조상들의 약속들
  alternative_readings:
  - 너희 조상들에게 주신 약속
  - 너희 조상의 약속
  rationale: 원문 ἐπαγγελίας의 복수형은 단일한 총칭보다 복수의 약속들을 가리키므로, 그 문법적 특징을 한국어에서도 가능한 한 반영했습니다.
  doctrine_reference: 언약 약속의 누적성과 복수성
