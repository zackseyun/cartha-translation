review_pass:
  verdict: revise
  source_fidelity: 첫 구절의 γὰρ는 이유를 잇는 ‘왜냐하면/이는’인데, 초안의 ‘내가 알기로는’은 ‘내가 아는 범위에서는’이라는 인식의 제한을 더하여 원문과 다릅니다. ‘나는 알고 있습니다’로 옮겨야 합니다. 나머지는 θλίβω의 미래, 하나님의 ἐκδίκησις 실행, 그리고 ἐπάγειν εἰς와 ἐπαγγελίαι의 복수 표현을 대체로 충실히 반영합니다.
  naturalness: ‘내가 알기로는’은 이 문맥에서 부자연스러울 뿐 아니라 의미도 약화합니다. ‘약속들 안으로 이끌어 들이실 것입니다’는 다소 직역적이지만, 원문의 ‘약속들 안으로 데려가다’라는 비유적 구문과 복수형을 보존하는 안전한 표현입니다.
  terminology: ‘압제할 것입니다’는 이집트가 이스라엘을 가하는 지속적 억압이라는 θλίβω의 역사적·사회적 뉘앙스를 ‘괴롭힐 것입니다’보다 더 정확히 드러냅니다. ‘너희의 원수를 갚으시고’는 문맥상 하나님이 그들을 위하여 보응하신다는 ἐκδίκησιν ὑμῶν을 자연스럽게 전달합니다. ‘조상들의 약속들’은 원문의 소유격이 지닌 약속과 조상들의 관계를 불필요하게 해석하지 않고 보존합니다.
  issues:
  - severity: medium
    issue: ‘내가 알기로는’이 γὰρ와 οἶδα의 의미를 잘못 옮깁니다.
    rationale: γὰρ는 앞 발언의 근거를 제시하는 접속사이고 οἶδα는 단정적 ‘나는 안다’입니다. ‘내가 알기로는’은 화자의 지식에 유보를 붙이며 접속 의미를 탈락시킵니다.
  - severity: low
    issue: ‘괴롭힐 것입니다’는 θλίβω의 억압·압제의 강도를 다소 약화합니다.
    rationale: 이집트인들이 공동체에 가할 박해성 압박을 가리키므로 ‘압제할 것입니다’가 더 적절합니다.
  revised_text: 이는 내가 알고 있기 때문입니다. 내가 죽은 뒤에 이집트 사람들이 너희를 압제할 것입니다. 그러나 하나님께서 너희의 원수를 갚으시고 너희를 너희 조상들의 약속들 안으로 이끌어 들이실 것입니다.
