revisions:
- from: 내가 알기로는 내가 죽은 뒤에 이집트 사람들이 너희를 괴롭힐 것입니다. 그러나 하나님께서 너희의 원수를 갚으시고, 너희를 너희 조상들의 약속들 안으로 이끌어 들이실 것입니다.
  to: 이는 내가 알고 있기 때문입니다. 내가 죽은 뒤에 이집트 사람들이 너희를 압제할 것입니다. 그러나 하나님께서 너희의 원수를 갚으시고 너희를 너희 조상들의 약속들 안으로 이끌어 들이실 것입니다.
  rationale: γὰρ의 근거 제시와 οἶδα의 단정성을 ‘이는 내가 알고 있기 때문입니다’로 회복했습니다. θλίβω는 역사적 억압의 뜻이 더 분명한 ‘압제하다’로 조정했습니다. 하나님의 보응과 조상들의 약속들 안으로 인도하심이라는 원문의 표현 및 복수형은 유지했습니다.
