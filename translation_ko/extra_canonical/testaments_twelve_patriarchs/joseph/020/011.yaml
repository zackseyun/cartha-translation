id: T12P.JOS.20.11
reference: Testament of Joseph 20:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/011.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman’s hut in an orchard, which vanishes after the summer.
translation:
  language: ko
  text: 그의 나라는 영원한 나라가 될 것이며, 결코 지나가지 않을 것입니다. 그러나 내 나라는 여러분 가운데서 완성되어 가고 있습니다. 그것은 여름이 지나면 사라지는 과수원의 파수꾼 오두막과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 ‘파수꾼 오두막’ 뒤의 관계절에 난해하거나 손상된 것으로 보이는 독법이 표시되어 있습니다. 여기서는 문맥과 영어 감사본을 따라 그 오두막이 여름 뒤에 사라진다는 뜻으로 옮겼습니다.
    reason: 원문 대괄호 표기와 이에 대응하는 본문 각주 표지를 반영하고, 불확실한 독법을 숨기지 않기 위함입니다.
lexical_decisions:
- source_word: βασιλεία
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 통치
  lexicon: βασιλεία
  rationale: 문맥상 ‘kingdom’의 표준 대응인 ‘나라’를 택하되, 통치 행위보다 왕권의 영역/현실을 드러내어 자연스럽게 옮겼습니다.
- source_word: αἰώνιος
  english_pob_choice: everlasting
  chosen_korean: 영원한
  alternatives_korean:
  - 영속적인
  - 끝없는
  lexicon: αἰώνιος
  rationale: 지속 기간의 무한성을 직접 나타내는 ‘영원한’이 POB의 ‘everlasting’에 가장 가깝습니다.
- source_word: ἐπιτελεῖται
  english_pob_choice: will be brought to completion
  chosen_korean: 완성되어 가고 있습니다
  alternatives_korean:
  - 이루어지고 있습니다
  - 완성될 것입니다
  lexicon: ἐπιτελέω
  rationale: 현재 수동/중간적 뉘앙스를 살려, 이미 진행 중인 완성 과정을 드러내는 표현으로 옮겼습니다.
- source_word: ὀπωροφυλάκιον
  english_pob_choice: watchman’s hut
  chosen_korean: 망대
  alternatives_korean:
  - 초막
  - 지키는 오두막
  lexicon: ὀπωροφυλάκιον
  rationale: 과수원에서 지키는 임시 감시 시설이라는 기능을 살려, 한국어에서 가장 간결하게 그 이미지를 전달하는 ‘망대’를 택했습니다.
- source_word: μετὰ τὸ θέρος
  english_pob_choice: after the summer
  chosen_korean: 여름이 지나면
  alternatives_korean:
  - 여름 뒤에
  - 여름 후에
  lexicon: θέρος
  rationale: 문맥상 단순한 계절 정보보다 ‘여름이 끝난 뒤’라는 소멸의 시점을 강조하는 표현이 적절합니다.
theological_decisions:
- issue: ‘내 나라는 여러분 가운데서 완성됩니다’의 종말론적 현재성
  chosen_reading: 예수의 나라는 아직 최종 도래를 기다리지만, 공동체 한가운데에서 بالفعل/이미 진행 중인 완성으로 제시했습니다.
  alternative_readings:
  - ‘내 나라는 여러분 안에서 완성됩니다’
  - ‘내 나라는 여러분 가운데서 이루어질 것입니다’
  rationale: ἐν ὑμῖν은 관계적·공동체적 ‘가운데’로 충분히 읽을 수 있으며, 본문의 현재시제 ἐπιτελεῖται가 이미 시작된 완성을 강조하므로 이를 반영했습니다.
  doctrine_reference: already/not yet eschatology
