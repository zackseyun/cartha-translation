  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/004.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good sleep.
translation:
  language: ko
  text: 그리고 이 말을 하고 나서, 그는 발을 뻗고 좋은 잠에 들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  english_pob_choice: after saying these things
  chosen_korean: 이 말을 하고 나서
  alternatives_korean:
  - 이런 것들을 말하고 나서
  - 이것들을 말한 뒤
  lexicon: ταῦτα
  rationale: 지시대명사 ταῦτα는 직전의 말을 가리키므로 자연스럽게 ‘이 말’로 옮기되, 의미를 풀어 ‘말하고 나서’로 연결했습니다.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  english_pob_choice: he stretched out his feet
  chosen_korean: 발을 뻗고
  alternatives_korean:
  - 그의 발을 펴고
  - 다리를 뻗고
  lexicon: ἐκτείνω
  rationale: 직역상 ‘발’을 살리되, 한국어에서는 “발을 뻗다”가 몸을 편히 눕히는 동작을 가장 자연스럽게 드러냅니다.
- source_word: ἐκοιμήθη
  english_pob_choice: fell asleep
  chosen_korean: 잠에 들었습니다
  alternatives_korean:
  - 잠들었습니다
  - 잠이 들었습니다
  lexicon: κοιμάω
  rationale: 본문의 완곡한 ‘잠들다’ 의미를 살려 죽음으로 직접 바꾸지 않고, POB 영어도 ‘fell asleep’로 유지한 점에 맞췄습니다.
- source_word: ὕπνῳ καλῷ
  english_pob_choice: in a good sleep
  chosen_korean: 좋은 잠
  alternatives_korean:
  - 편안한 잠
  - 좋은 잠에
  lexicon: ὕπνος, καλός
  rationale: 영어 POB의 ‘good sleep’을 그대로 반영하되, 한국어에서 어색하지 않도록 ‘좋은 잠’으로 옮겼습니다. 이는 죽음에 대한 우회적 표현을 보존합니다.
theological_decisions:
- issue: ἐκοιμήθη의 의미를 죽음으로 직접 풀지 여부
  chosen_reading: 직접적인 ‘죽다’ 대신 ‘잠들다/잠에 들다’라는 완곡어법을 유지했습니다.
  alternative_readings:
  - 그는 죽었습니다
  - 그는 편안히 세상을 떠났습니다
  rationale: 헬라어 κοιμάω 계열은 고대 문헌에서 죽음을 비유적으로 가리킬 수 있지만, 본절의 문장 자체는 ‘잠들었다’라는 표현을 사용하므로 그 문면의 완곡성을 보존하는 것이 더 충실합니다.
  doctrine_reference: 문맥상 죽음의 완곡어법(수면 은유)
