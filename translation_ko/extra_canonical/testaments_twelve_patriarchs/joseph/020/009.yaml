  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/009.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: ko
  text: 그리고 이런 말들을 한 뒤, 그는 발을 뻗고 아름다운 잠에 들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ταῦτα εἰπών
  english_pob_choice: And after saying these things
  chosen_korean: 그리고 이런 말들을 한 뒤
  alternatives_korean:
  - 그리고 이것들을 말한 뒤
  - 그리고 이런 것들을 말하고
  lexicon: ταῦτα
  rationale: 지시대명사 ταῦτα는 앞서 한 말을 가리키므로, 한국어에서는 자연스럽게 ‘이런 말들’로 옮겨 문맥 연결을 살렸습니다.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  english_pob_choice: he stretched out his feet
  chosen_korean: 그는 발을 뻗고
  alternatives_korean:
  - 그는 자기 발을 뻗고
  - 그는 발들을 뻗고
  lexicon: ἐκτείνω
  rationale: 직역의 ‘발들을’은 한국어에서 다소 부자연스럽기 때문에, 복수 의미를 해치지 않는 범위에서 자연스러운 단수 표현으로 옮겼습니다.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  english_pob_choice: fell asleep in a beautiful sleep
  chosen_korean: 아름다운 잠에 들었습니다
  alternatives_korean:
  - 좋은 잠에 들었습니다
  - 아름다운 잠을 잤습니다
  lexicon: κοιμάομαι / καλός
  rationale: ὕπνῳ καλῷ는 문자적으로는 ‘좋은/아름다운 잠’이므로, POB의 직역적 뉘앙스를 살리되 한국어에서는 자연스러운 관용으로 다듬었습니다.
theological_decisions:
- issue: ὕπνῳ καλῷ의 의미 범위
  chosen_reading: 여기서는 단순한 수면을 뜻하는 표현으로 보고, 종말론적 함의나 완곡한 죽음 표현을 과도하게 부각하지 않았습니다.
  alternative_readings:
  - ‘평안한 잠’처럼 정서적으로 풀어 읽기
  - 죽음을 은유하는 표현으로 적극 해석하기
  rationale: 문맥상 인물이 말한 뒤 누워 잠드는 장면이므로, 본문의 직접 의미를 우선했습니다.
  doctrine_reference: 본문-우선 원칙
