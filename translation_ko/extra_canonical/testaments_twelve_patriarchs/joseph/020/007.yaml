lexical_decisions:
- source_word: πᾶς Ἰσραὴλ
  english_pob_choice: all Israel
  chosen_korean: 온 이스라엘
  alternatives_korean:
  - 모든 이스라엘
  - 이스라엘 온 백성
  lexicon: πᾶς
  rationale: 공동체 전체를 가리키는 표현으로, ‘온’이 본문의 총체성을 간결하게 살리면서 현대 한국어 문맥에 자연스럽습니다.
- source_word: πᾶσα Αἴγυπτος
  english_pob_choice: all Egypt
  chosen_korean: 온 이집트
  alternatives_korean:
  - 모든 이집트
  - 이집트 온 땅
  lexicon: πᾶς
  rationale: 국가/민족 전체를 뜻하는 병렬 구조를 앞부분과 맞추어 ‘온’으로 일관되게 옮겼습니다.
- source_word: ἐπένθησεν … πένθος μέγα
  english_pob_choice: mourned ... with great mourning
  chosen_korean: 큰 슬픔으로 … 애도하였습니다
  alternatives_korean:
  - 큰 애도로 … 슬퍼하였습니다
  - 크게 곡하며 … 애도하였습니다
  lexicon: πενθέω / πένθος
  rationale: 동사와 명사를 중복해 강조하는 그리스어를 한국어에서는 ‘애도하다’와 ‘큰 슬픔’으로 자연스럽게 풀어, 애도의 강도를 살렸습니다.
