  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/006.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: ko
  text: 그리고 이 말들을 하고, 그는 발을 뻗고 좋은 잠에 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ταῦτα εἰπών
  english_pob_choice: And after saying these things
  chosen_korean: 그리고 이 말들을 하고서
  alternatives_korean:
  - 그리고 이런 말을 한 뒤
  - 그리고 그 말을 하고서
  lexicon: καί, ταῦτα, εἰπών
  rationale: tauta를 단순히 ‘이것들’로 직역하기보다 앞선 발화를 가리키는 자연스러운 표현인 ‘이 말들’로 옮겨, 서술 연결을 매끄럽게 했습니다.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  english_pob_choice: he stretched out his feet
  chosen_korean: 그는 발을 뻗은 뒤
  alternatives_korean:
  - 그는 그의 발을 펴고
  - 발을 뻗고서
  lexicon: ἐκτείνω, πούς
  rationale: 그의 몸짓을 한국어로 자연스럽게 옮기되, 단순한 자세 묘사 이상의 ‘펴다/뻗다’의 동작성을 살렸습니다.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  english_pob_choice: fell asleep in a beautiful sleep
  chosen_korean: 아름다운 잠에 들었습니다
  alternatives_korean:
  - 좋은 잠에 들었습니다
  - 평안한 잠에 들었습니다
  lexicon: κοιμάω, ὕπνος καλός
  rationale: ὕπνῳ καλῷ의 직역을 유지하되, 한국어에서 어색한 ‘좋은 잠’보다 원문의 긍정적·평안한 뉘앙스를 담는 ‘아름다운 잠’으로 옮겼습니다.
theological_decisions:
- issue: ὕπνῳ καλῷ의 의미
  chosen_reading: 단순한 수면 묘사로 읽되, 평안하고 복된 죽음/휴식의 암시를 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 죽음을 완곡하게 가리키는 표현으로 볼 수 있음
  - 단순히 편안하게 잠들었다는 뜻으로 볼 수 있음
  rationale: 본문은 잠듦을 서정적으로 표현하지만, 여기서는 해석을 넓혀 죽음으로 단정하지 않고 원문의 표현력을 보존했습니다.
  doctrine_reference: 본문 의미의 절제와 서사적 표현 보존
