  text: And in the exodus of the sons of Israel from Egypt they gathered up the bones of Joseph, and buried him in Hebron with his fathers; and the years of his life were one hundred and ten years.
translation:
  language: ko
  text: 그리고 이스라엘 자손이 이집트에서 나올 때 요셉의 뼈를 거두어다가 헤브론에 있는 그의 조상들과 함께 장사했으며, 그의 생애는 백십 년이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἐξόδῳ
  english_pob_choice: in the exodus
  chosen_korean: 이집트에서 나올 때
  alternatives_korean:
  - 출애굽할 때
  - 출애굽 시에
  lexicon: source phrase
  rationale: 출애굽이라는 신학적 용어를 이해시키되, 본문이 사건의 시간표현으로 쓰인 점을 살려 자연스러운 서술형으로 옮겼습니다.
- source_word: συνήγαγον τὰ ὀστᾶ Ἰωσήφ
  english_pob_choice: they gathered up the bones of Joseph
  chosen_korean: 요셉의 뼈를 거두어다가
  alternatives_korean:
  - 요셉의 뼈를 모아다가
  - 요셉의 뼈를 수습하여
  lexicon: source phrase
  rationale: συνάγω의 ‘모으다/거두다’ 의미를 살리면서, 장례 맥락에 맞는 한국어로 자연스럽게 표현했습니다.
- source_word: ἔθαψαν αὐτὸν
  english_pob_choice: buried him
  chosen_korean: 장사했으며
  alternatives_korean:
  - 묻었으며
  - 매장했으며
  lexicon: source phrase
  rationale: 장례 행위의 공적·문어적 표현으로서 ‘장사하다’를 택해, 문맥의 서술성을 유지했습니다.
- source_word: ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ ἔτη ἑκατὸν δέκα
  english_pob_choice: and the years of his life were one hundred and ten years
  chosen_korean: 그의 생애는 백십 년이었습니다
  alternatives_korean:
  - 그가 산 햇수는 백십 년이었습니다
  - 그의 삶의 햇수는 백십 년이었습니다
  lexicon: source phrase
  rationale: 직역투를 피하면서도 ‘생애/햇수’의 총량을 정확히 반영했습니다.
theological_decisions:
- issue: 헤브론과 조상들과 함께라는 장례·조상 연속성 표현
  chosen_reading: 요셉의 매장이 족장들의 계보적 연속성 속에서 이루어진 것으로 읽었습니다.
  alternative_readings:
  - 단순한 지리 정보로만 읽는 방법
  rationale: ‘그의 조상들과 함께’는 단순한 묘지 위치를 넘어서 조상들과의 연속된 안식이라는 의미를 담으므로 이를 살렸습니다.
  doctrine_reference: patriarchal burial motif
