  source_fidelity: 그리스어 원문은 이스라엘 자손의 이집트 탈출 때 요셉의 뼈를 거두고, 그를 헤브론에서 그의 조상들과 함께 장사한 일 및 그의 향년 110세를 서술합니다. 초안은 각 요소와 접속 관계를 충실히 반영합니다. ‘이집트에서 나올 때’는 ἐν τῇ ἐξόδῳ의 시간적 용법을 자연스럽게 옮기며, ‘요셉의 뼈를 거두어다가’와 ‘장사했으며’도 각각 συνήγαγον과 ἔθαψαν에 적절합니다.
  naturalness: 현대 표준 한국어의 정중한 문어체로 자연스럽습니다. ‘그의 생애는 백십 년이었습니다’는 원문의 다소 반복적인 ‘그의 생애의 햇수는 110년이었다’를 한국어답게 처리하면서 의미를 보존합니다.
  terminology: ‘이스라엘 자손’, ‘요셉’, ‘헤브론’, ‘조상들’, ‘장사하다’는 성서·고대 문헌 문맥에서 통용되는 정확하고 적절한 용어입니다. 원문에 없는 교리적 해석을 본문에 덧붙이지 않았습니다.
