  text: And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.
translation:
  language: ko
  text: 아세낫을, 곧 여러분의 어머니를 [히포드롬 옆으로] 데려오고, 그녀를 내 어머니 라헬 곁에 장사하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾿Ασυνὲθ
  english_pob_choice: Aseneth
  chosen_korean: 아세낫
  alternatives_korean:
  - 아센에스
  - 아세네스
  lexicon: 고유명사
  rationale: 헬라어 고유명사 ᾿Ασυνὲθ를 한국어 성경에서 자연스럽고 식별 가능하게 옮기기 위해 아세낫을 택했습니다.
- source_word: ἀγάγετε
  english_pob_choice: bring
  chosen_korean: 데려오고
  alternatives_korean:
  - 가져오고
  - 이끌어 오고
  lexicon: 동사
  rationale: 사람을 동반하여 오게 하는 의미를 살려, 단순 이동보다 인격적·서술적 뉘앙스가 있는 데려오고로 옮겼습니다.
- source_word: παρὰ τὸν Ἱππόδρομον
  english_pob_choice: '[to the Hippodrome]'
  chosen_korean: '[히포드롬 옆으로]'
  alternatives_korean:
  - '[히포드롬에]'
  - '[경기장 옆으로]'
  lexicon: 지명/설명구
  rationale: 괄호 안 보충구는 본문에 포함된 주석적 지시로 보고 그대로 살리되, παρά의 근접 의미를 반영해 옆으로로 옮겼습니다.
- source_word: θάψατε
  english_pob_choice: bury
  chosen_korean: 장사하십시오
  alternatives_korean:
  - 묻으십시오
  - 매장하십시오
  lexicon: 동사
  rationale: 장례 행위의 공손하고 문어적인 표현으로 장사하십시오를 선택해 서술의 엄숙함을 유지했습니다.
theological_decisions:
- issue: 친족 호칭과 관계 표현
  chosen_reading: 여러분의 어머니 / 내 어머니
  alternative_readings:
  - 너희 어머니 / 나의 어머니
  - 당신들의 어머니 / 제 어머니
  rationale: 직접화법의 관계성을 분명히 하면서도 현대 한국어 합쇼체에 맞게 2인칭 복수의 호칭을 정리했습니다.
  doctrine_reference: 서사적 직접화법의 존중과 현대 한국어 경어 체계
- issue: 괄호로 표시된 장소 보충
  chosen_reading: '[히포드롬 옆으로]'
  alternative_readings:
  - '[히포드롬에]'
  - 보충구 생략
  rationale: 원문과 영어 POB 모두 괄호로 해당 구절의 보충성을 표시하므로, 본문 안에서 별도 주석 없이 유지해 가독성과 대조 가능성을 보존했습니다.
  doctrine_reference: 텍스트 비평적 보조 표지의 보존
