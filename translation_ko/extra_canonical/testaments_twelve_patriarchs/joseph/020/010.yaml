  text: And all Israel and all Egypt mourned him with great mourning.
translation:
  language: ko
  text: 그리고 온 이스라엘과 온 이집트가 큰 슬픔으로 그를 애도하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐπένθησεν αὐτόν
  english_pob_choice: mourned him
  chosen_korean: 그를 애도하였습니다
  alternatives_korean:
  - 그를 슬퍼하였습니다
  - 그를 곡하였습니다
  - 그를 애통해하였습니다
  lexicon: πενθέω
  rationale: 단순한 감정의 슬픔보다 장례적·공적 애도를 드러내는 동사로 옮겨, 행위의 성격을 분명히 했습니다.
- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  english_pob_choice: all Israel and all Egypt
  chosen_korean: 온 이스라엘과 온 이집트
  alternatives_korean:
  - 모든 이스라엘과 모든 이집트
  - 이스라엘 전부와 이집트 전부
  lexicon: πᾶς + proper noun
  rationale: 집합 전체를 가리키는 표현이므로 ‘온’으로 간결하게 살려, 공동체 전체의 참여를 자연스럽게 드러냈습니다.
- source_word: πένθος μέγα
  english_pob_choice: with great mourning
  chosen_korean: 큰 슬픔으로
  alternatives_korean:
  - 큰 애도로
  - 깊은 슬픔으로
  - 대단한 슬픔으로
  lexicon: πένθος
  rationale: 명사구를 한국어 부사구로 자연스럽게 풀되, ‘μέγα’의 강도를 ‘큰’으로 유지했습니다.
theological_decisions:
- issue: 공적 애도와 범위의 강조
  chosen_reading: 이스라엘과 이집트 전체가 한 사람을 위해 함께 애도한 것으로 읽습니다.
  alternative_readings:
  - 단순히 여러 사람이 슬퍼했다는 일반적 표현으로 완화하는 읽기
  - ‘모든’의 과장을 관용적으로만 처리하는 읽기
  rationale: 원문은 두 민족 집단 전체를 병렬로 제시하고 ‘큰 슬픔’을 덧붙여, 사건의 공적·집단적 무게를 강조합니다.
  doctrine_reference: 본문 서술의 수사적 강도와 공동체적 애도
