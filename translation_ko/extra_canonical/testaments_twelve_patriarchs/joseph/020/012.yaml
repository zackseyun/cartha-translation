id: T12P.JOS.20.12
reference: Testament of Joseph 20:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/012.yaml
  text: For his kingdom will be an everlasting kingdom that will not pass away. But my kingdom among you is brought to completion, like a watchman’s hut in an orchard, which disappears after the summer.”
translation:
  language: ko
  text: 그의 나라는 영원한 나라가 되어서 사라지지 않을 것입니다. 그러나 내 나라는 여러분 가운데서 완성되어 가고 있습니다. 마치 여름이 지나면 사라지는 과수원의 망대 같은 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γὰρ βασιλεία αὐτοῦ
  english_pob_choice: For his kingdom
  chosen_korean: 그의 나라는
  alternatives_korean:
  - 그의 통치는
  - 그의 왕권은
  lexicon: βασιλεία
  rationale: 여기서는 통치 행위보다 ‘나라’라는 결과적·공동체적 실체를 가리키므로 기본적으로 ‘나라’로 옮겼습니다.
- source_word: βασιλεία ἔσται αἰώνιος
  english_pob_choice: will be an everlasting kingdom
  chosen_korean: 영원한 나라가 되어서
  alternatives_korean:
  - 영원한 나라가 될 것이어서
  - 영원한 나라로 있을 것이어서
  lexicon: βασιλεία, αἰώνιος
  rationale: αἰώνιος의 지속성을 ‘영원한’으로 직역하되, 문맥상 미래 서술을 자연스럽게 살려 ‘되어서’로 연결했습니다.
- source_word: ἐν ὑμῖν ἐπιτελεῖται
  english_pob_choice: is brought to completion among you
  chosen_korean: 여러분 가운데서 완성되어 가고 있습니다
  alternatives_korean:
  - 여러분 가운데서 이루어지고 있습니다
  - 여러분 안에서 완성되고 있습니다
  lexicon: ἐν ὑμῖν, ἐπιτελέω
  rationale: ἐπιτελεῖται는 단순 ‘존재’보다 ‘완성에 이르다’의 뉘앙스가 강해 ‘완성되어 가고 있습니다’로 번역했습니다.
- source_word: ὡς ὀπωροφυλάκιον ... μετὰ τὸ θέρος ἐξαφανίζεται
  english_pob_choice: like a watchman’s hut in an orchard, which disappears after the summer
  chosen_korean: 마치 여름이 지나면 사라지는 과수원의 망대 같은 것입니다
  alternatives_korean:
  - 마치 여름 뒤에 사라지는 과수원의 감시초막 같은 것입니다
  - 마치 여름이 지나고 나면 없어지는 과수원의 파수초막 같은 것입니다
  lexicon: ὀπωροφυλάκιον, ἐξαφανίζεται
  rationale: 이미지의 핵심은 과수원에 세운 임시 파수 시설이 계절이 지나면 사라진다는 점이므로, 현대 독자가 이해할 수 있도록 ‘망대’로 풀되 임시성과 소멸을 유지했습니다.
theological_decisions:
- issue: '두 왕국의 대비: 그의 나라는 영원하고, 내 나라는 현재적으로 완성되어 감'
  chosen_reading: ‘그의 나라는’과 ‘내 나라는’의 대비를 유지하고, 후자는 현재진행형으로 번역해 종말론적 성격을 드러냈습니다.
  alternative_readings:
  - ‘그의 통치’와 ‘내 통치’로 평행을 맞추는 읽기
  - 둘 다 단순 미래형으로 평평하게 만드는 읽기
  rationale: 본문은 상대방의 나라의 영속성과 화자의 나라의 현재적 진행을 대조하므로, 동일한 ‘나라’ 표기를 유지해 대비를 선명하게 했습니다.
  doctrine_reference: 종말론적 왕국 이해
- issue: 여러분 가운데서(ἐν ὑμῖν)의 처리
  chosen_reading: 공간적·공동체적 의미를 살려 ‘여러분 가운데서’로 옮겼습니다.
  alternative_readings:
  - ‘여러분 안에서’로 내적/영적 의미를 강조하는 읽기
  - ‘여러분 사이에서’로 완전한 관계적 의미만 강조하는 읽기
  rationale: 문맥은 군중/공동체 가운데서 진행되는 왕국의 현재성을 말하므로, 내면화로만 좁히지 않고 공동체적 범위를 보존했습니다.
  doctrine_reference: 하나님의 나라의 현존성과 공동체성
