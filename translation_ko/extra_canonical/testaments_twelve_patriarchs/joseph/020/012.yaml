revisions:
- from: 그의 나라는 영원한 나라가 되어서 사라지지 않을 것입니다. 그러나 내 나라는 여러분 가운데서 완성되어 가고 있습니다. 마치 여름이 지나면 사라지는 과수원의 망대 같은 것입니다.[a]
  to: 그의 나라는 사라지지 않을 영원한 나라가 될 것입니다. 그러나 내 나라는 여러분 가운데서, 여름이 지난 뒤 사라지는 과수원의 파수꾼 초막처럼, 완성됩니다.[a]
  rationale: 원문의 미래형과 현재 수동형의 대비를 보존하고, ὀπωροφυλάκιον의 구체적 의미를 ‘망대’가 아닌 계절성 있는 파수 초막으로 수정했습니다. ‘여러분 가운데서’는 ἐν ὑμῖν의 공동체적 공간성을 유지하며, 특정 교리적 해석을 덧붙이지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:36Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 미래형 ἔσται와 관계절의 ‘사라지지 않을 것’을 충실히 반영하나, ‘되어서’는 인과적 연결처럼 들릴 수 있습니다. δεύτε 절의 ἐπιτελεῖται는 현재 수동형으로 ‘완성됩니다/이루어집니다’가 적절하며, ‘완성되어 가고 있습니다’는 원문에 없는 진행·미완료의 뉘앙스를 더합니다. ὀπωροφυλάκιον은 망대보다는 과수원을 지키기 위해 세운 초막/움막을 가리키므로 ‘망대’는 수정이 필요합니다.
  naturalness: ‘영원한 나라가 되어서’는 현대 한국어에서 다소 부자연스럽고, ‘과수원의 망대’는 원문의 임시 초막 이미지를 약화합니다. ‘사라지지 않을 영원한 나라가 될 것입니다’ 및 ‘과수원의 파수꾼 초막’은 자연스럽고 원문의 비유를 보존합니다.
  terminology: βασιλεία를 양쪽 모두 ‘나라’로 옮긴 것은 대조를 보존하여 적절합니다. ἐν ὑμῖν은 교리적으로 좁히지 않고 ‘여러분 가운데서’로 유지했습니다. ὀπωροφυλάκιον은 ‘파수꾼 초막’으로 바로잡았습니다.
  issues:
