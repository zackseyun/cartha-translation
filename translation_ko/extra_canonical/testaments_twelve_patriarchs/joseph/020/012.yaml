  - severity: medium
    issue: ὀπωροφυλάκιον을 ‘망대’로 번역함
    rationale: 이 말은 과수원을 지키기 위한 초막 또는 임시 오두막을 가리킵니다. ‘망대’는 구조와 계절적 임시성의 이미지를 바꿉니다.
  - severity: low
    issue: ‘영원한 나라가 되어서’의 연결
    rationale: 원문은 인과가 아니라 미래의 서술과 관계절을 연결합니다. 한국어에서는 ‘사라지지 않을 영원한 나라가 될 것입니다’가 더 정확하고 자연스럽습니다.
