revisions:
- from: 그런데 그녀의 남편이 그녀를 보고 그에게 말했습니다. "당신의 얼굴에 무슨 일이 일어났습니까?" 그녀가 그에게 말했습니다. "저는 마음의 고통으로 아픕니다. 그리고 제 영의 신음이 저를 붙들고 있습니다." 그러자 그는 말로 그녀를 고쳤습니다.
  to: 그런데 그녀의 남편이 그녀를 보고 그녀에게 말했습니다. “당신의 얼굴에 무슨 일이 일어났습니까?” 그녀가 그에게 말했습니다. “저는 마음의 고통을 겪고 있습니다. 그리고 제 영의 신음이 저를 붙들고 있습니다.” 그러자 그는 말로 그녀를 고쳐 주었습니다.
  rationale: 아내를 가리키는 여격 대명사를 ‘그녀에게’로 바로잡아 원문의 발화 관계를 정확히 했습니다. 또한 한국어 표현을 자연스럽게 다듬되, 마음의 고통, 내적 영의 신음, 말에 의한 치유라는 원문의 의미와 완료된 치유의 서술을 유지했습니다.
