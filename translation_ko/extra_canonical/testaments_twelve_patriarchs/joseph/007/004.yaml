id: T12P.JOS.7.4
reference: Testament of Joseph 7:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδὼν δὲ αὐτὴν ὁ *ἀνὴρ αὐτῆς⁴ λέγει⁶ πρὸς αὐτήν⁷· Τί συνέπεσε τὸ πρόσωπόν σου; ⌜πρὸς αὐτὸν⌝⁷ εἶπεν, ⌜ὅτι⌝⁷ *πόνον καρδίας ἐγὼ ἀλγῶ, καὶ οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με⁸. *Ὁ δὲ⁹ ἐθεράπευσεν¹⁰ αὐτὴν *ἐν λόγοις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/004.yaml
  text: And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he healed her with words.
translation:
  language: ko
  text: 그런데 그녀의 남편이 그녀를 보고 그녀에게 말했습니다. “당신의 얼굴에 무슨 일이 일어났습니까?” 그녀가 그에게 말했습니다. “저는 마음의 고통을 겪고 있습니다. 그리고 제 영의 신음이 저를 붙들고 있습니다.” 그러자 그는 말로 그녀를 고쳐 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνήρ αὐτῆς
  english_pob_choice: her husband
  chosen_korean: 그녀의 남편
  alternatives_korean:
  - 그의 남편
  - 그 여자의 남편
  lexicon: ἀνήρ
  rationale: 문맥상 결혼한 남편을 가리키므로 한국어에서는 자연스럽게 ‘남편’으로 옮기되, 소유 관계를 분명히 했습니다.
- source_word: Τί συνέπεσε τὸ πρόσωπόν σου;
  english_pob_choice: What has happened to your face?
  chosen_korean: 당신의 얼굴에 무슨 일이 일어났습니까?
  alternatives_korean:
  - 당신 얼굴에 무슨 일이 생겼습니까?
  - 얼굴이 왜 그렇게 되었습니까?
  lexicon: συμβαίνω / πρόσωπον
  rationale: 직역의 질문 구조를 유지하되, 한국어에서 자연스러운 ‘얼굴에 무슨 일이 일어났습니까?’로 옮겨 외양의 변화를 드러냈습니다.
- source_word: πόνον καρδίας ἐγὼ ἀλγῶ
  english_pob_choice: I am in pain with anguish of heart
  chosen_korean: 저는 마음의 고통으로 아픕니다
  alternatives_korean:
  - 저는 마음의 고통 속에 있습니다
  - 마음의 괴로움으로 몹시 아픕니다
  lexicon: πόνος καρδίας / ἀλγέω
  rationale: ‘마음의 고통’과 ‘아픕니다’를 함께 써서 감정적·신체적 고통의 결합을 살렸습니다.
- source_word: οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με
  english_pob_choice: the groanings of my spirit hold me fast
  chosen_korean: 제 영의 신음이 저를 붙들고 있습니다
  alternatives_korean:
  - 제 영의 탄식이 저를 사로잡고 있습니다
  - 제 영의 신음소리가 저를 억누르고 있습니다
  lexicon: πνεῦμα / στεναγμός / συνέχω
  rationale: πνεῦμα를 문맥상 인간의 내적 ‘영’으로 보고, στεναγμοί는 ‘신음’으로, συνέχουσί με는 지속적 압박을 드러내는 ‘붙들고 있습니다’로 옮겼습니다.
- source_word: ἐθεράπευσεν αὐτὴν ἐν λόγοις
  english_pob_choice: he healed her with words
  chosen_korean: 말로 그녀를 고쳤습니다
  alternatives_korean:
  - 말로 그녀를 치료했습니다
  - 말로 그녀를 낫게 했습니다
  lexicon: θεραπεύω + ἐν λόγοις
  rationale: 이 절의 결말은 실제 약물이나 행위가 아니라 언어적 위로/치유를 강조하므로, 한국어에서 구어적이면서도 원뜻을 살리는 ‘말로 고쳤습니다’로 옮겼습니다.
theological_decisions:
- issue: πνεύμα의 의미
  chosen_reading: 여기서 πνεύμα는 성령이 아니라 화자의 내적 영을 가리키는 것으로 보고 ‘영’으로 번역했습니다.
  alternative_readings:
  - 성령
  - 마음
  rationale: ‘영의 신음’이라는 소유격 구조와 고통의 내면 묘사가 인간 내부를 가리키므로, 신학적 확장을 피하고 본문 범위에 맞췄습니다.
  doctrine_reference: 인간의 내적 영과 성령은 구별되어 사용될 수 있음
