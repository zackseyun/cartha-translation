id: T12P.JOS.7.3
reference: Testament of Joseph 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*ἡ δὲ⁶⁴ συνεθέτό μου⁶⁵ τοῦ⁶⁶ *μηκέτι ποιῆσαι⁶⁷ τὴν ἀσέβειαν ταύτην⁶⁸. **Ἔτι δὲ¹ ἡ καρδία αὐτῆς *ἔκειτο εἰς τὸ κακὸν καὶ περιεβλέπετο ποίῳ τρόπῳ με παγιδεύσῃ· στενάζουσα δὲ †συντόμως συνεπίπτε μὴ ἀσθενοῦσα².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/003.yaml
  text: And she agreed with me no longer to commit this impiety. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would suddenly collapse, though she was not actually sick.
translation:
  language: ko
  text: 그녀는 저와 더 이상 이 불경한 일을 하지 않기로 합의했습니다. 그러나 그녀의 마음은 여전히 악에 쏠려 있었고, 저를 덫에 빠뜨릴 방법을 찾고 있었습니다. 그리고 신음하면서 갑자기 쓰러지곤 했지만, 쇠약한 것은 아니었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεθέτό μου τοῦ μηκέτι ποιῆσαι τὴν ἀσέβειαν ταύτην
  english_pob_choice: agreed with me no longer to commit this impiety
  chosen_korean: 더 이상 이 불경한 일을 하지 않겠다고 제게 동의했습니다
  alternatives_korean:
  - 이 불경을 더 이상 행하지 않기로 제게 동의했습니다
  - 이 경건하지 못한 일을 더는 하지 않겠다고 제게 뜻을 같이했습니다
  lexicon: συνετίθημι / ἀσέβεια
  rationale: συνεθέτό는 단순한 감정이 아니라 '동의하다'의 의미이므로 이를 살리고, ἀσέβεια는 종교적 불경을 가리켜 ‘불경한 일’로 옮겼습니다.
- source_word: ἡ καρδία αὐτῆς ἔκειτο εἰς τὸ κακὸν
  english_pob_choice: her heart was still set on evil
  chosen_korean: 그녀의 마음은 여전히 악에 머물러 있었고
  alternatives_korean:
  - 그녀의 마음은 여전히 악을 향해 있었고
  - 그녀의 마음은 여전히 악에 놓여 있었고
  lexicon: κείμενον εἰς + κακόν
  rationale: ‘마음이 ...에 놓여 있다’는 상태 표현을 자연스럽게 살리되, 지속적 성향을 분명히 하기 위해 ‘머물러 있었다’로 옮겼습니다.
- source_word: περιεβλέπετο ποίῳ τρόπῳ με παγιδεύσῃ
  english_pob_choice: she kept looking around for a way to ensnare me
  chosen_korean: 어떻게 저를 덫에 걸리게 할지 두리번거렸습니다
  alternatives_korean:
  - 어떤 방법으로 저를 함정에 빠뜨릴지 둘러보았습니다
  - 저를 올가미에 걸 수 있는 방법을 찾으려 둘러보았습니다
  lexicon: περιβλέπομαι / παγιδεύω
  rationale: 주위를 살피며 방법을 찾는 동작을 ‘두리번거렸다’로 살리고, παγιδεύσῃ는 ‘덫에 걸리게 하다’로 직역성을 유지했습니다.
- source_word: μὴ ἀσθενοῦσα
  english_pob_choice: though she was not weak
  chosen_korean: 약한 것이 아니었는데도
  alternatives_korean:
  - 쇠약한 것이 아니었는데도
  - 정말 아픈 것이 아니었는데도
  lexicon: ἀσθενέω
  rationale: 영문 POB의 수정안에 맞춰 ἀσθενοῦσα를 ‘아프다’보다 넓은 ‘약하다/쇠약하다’로 반영했습니다.
theological_decisions:
- issue: ἡ δὲ ... συνεθέτό μου τοῦ μηκέτι ποιῆσαι τὴν ἀσέβειαν ταύτην의 도덕·종교적 강도
  chosen_reading: ‘불경한 일’로 옮겨 단순한 예의 실수가 아니라 신앙적 불경을 드러내도록 했습니다.
  alternative_readings:
  - ‘죄’를 사용해 일반적 도덕 위반으로 완화
  - ‘불경건’으로 추상화
  rationale: ἀσέβεια는 하나님 앞에서의 불경을 포함하는 강한 표현이므로, 한국어에서도 그 종교적 무게를 유지해야 합니다.
  doctrine_reference: 성경의 경건/불경 개념
- issue: ἔκειτο εἰς τὸ κακὸν의 지속적 내적 상태
  chosen_reading: ‘마음은 여전히 악에 머물러 있었다’로 내적 성향의 지속성을 분명히 했습니다.
  alternative_readings:
  - ‘악을 생각하고 있었다’
  - ‘악한 마음을 품고 있었다’
  rationale: 본문은 단순한 생각보다 지속적 지향을 말하므로, 상태성과 방향성을 함께 드러내는 번역이 적절합니다.
  doctrine_reference: 인간 내면의 지속적 의향에 대한 서술
