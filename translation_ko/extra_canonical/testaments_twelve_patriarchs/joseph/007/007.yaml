id: T12P.JOS.7.7
reference: Testament of Joseph 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἵνα τί, ⌜ἄθλια⌉²², τάρασσον²³ καὶ θορυβῇ²⁴ ἐν ἁμαρτίαις τυφλώττουσα²⁵; μνήσθητι²⁶ ὅτι ἐὰν ἀνέλῃς σεαυτήν²⁷, *ἡ Ἀστηθώ²⁸, ἡ παλλακὴ²⁹ τοῦ ἀνδρός σου, ἡ³⁰ ἀντίζηλός³¹ σου³² κονδυλίσει³³ *τὰ τέκνα σου³⁴, καὶ³⁵ ἀπολέσεις³⁶ τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/007.yaml
  text: “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband’s concubine, your rival, will beat your children and wipe out your memory from the earth.”
translation:
  language: ko
  text: “어찌하여, 불쌍한 여인이여, 죄 가운데서 눈멀어 가며 동요하고 소란을 피우십니까? 기억하십시오. 스스로 목숨을 끊으시면, 당신의 남편의 첩이며 당신의 경쟁자인 아스티도는 당신의 자녀들을 때리고, 당신의 기억을 땅에서 지워 버릴 것입니다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄθλια
  english_pob_choice: miserable woman
  chosen_korean: 불쌍한 여인이여
  alternatives_korean:
  - 비참한 여인이여
  - 가련한 여인이여
  lexicon: ἄθλιος
  rationale: 직접적 감정 평가를 살리면서도 한국어에서 문맥상 호소형으로 자연스럽게 들리도록 ‘여인이여’를 붙였습니다.
- source_word: τάρασσον καὶ θορυβῇ
  english_pob_choice: are you disturbed and thrown into turmoil
  chosen_korean: 동요하고 소란을 피우십니까
  alternatives_korean:
  - 뒤흔들리고 혼란에 빠집니까
  - 괴로워하며 어지러워하십니까
  lexicon: ταράσσω / θορυβέω
  rationale: 두 동사의 중첩된 강도를 한국어의 ‘동요’와 ‘소란’으로 나누어, 내적 동요와 외적 격동을 함께 드러냈습니다.
- source_word: ἐν ἁμαρτίαις τυφλώττουσα
  english_pob_choice: blinding yourself in sins
  chosen_korean: 죄 가운데서 눈멀어 가며
  alternatives_korean:
  - 죄들 속에서 스스로 눈멀게 하며
  - 죄들 가운데 눈이 멀어 가며
  lexicon: ἁμαρτία / τυφλόω
  rationale: 원문의 현재 분사와 인과적 뉘앙스를 살려, 죄가 시야를 흐리게 하는 상태를 ‘눈멀어 가며’로 옮겼습니다.
- source_word: παλλακή / ἀντίζηλος
  english_pob_choice: your husband’s concubine, your rival
  chosen_korean: 당신의 남편의 첩이며 당신의 경쟁자인
  alternatives_korean:
  - 남편의 첩이자 당신의 맞수인
  - 남편의 후궁이며 당신의 라이벌인
  lexicon: παλλακή / ἀντίζηλος
  rationale: παλλακή는 문맥상 ‘첩’이 가장 직접적이고, ἀντίζηλος는 단순한 경쟁 상대보다 혼인 관계의 적대성을 드러내므로 ‘경쟁자’로 옮겼습니다.
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  english_pob_choice: wipe out your memory from the earth
  chosen_korean: 당신의 기억을 땅에서 지워 버릴 것입니다
  alternatives_korean:
  - 당신의 이름을 땅에서 없앨 것입니다
  - 당신의 기념을 땅에서 없앨 것입니다
  lexicon: μνημόσυνον
  rationale: 문자적으로는 ‘기념/기억’ 범위가 있으나, POB의 ‘memory’를 따라 인격적 흔적의 소멸을 한국어로 직접 표현했습니다.
theological_decisions:
- issue: 죽음에 대한 직접 권고와 그 결과의 경고
  chosen_reading: 본문은 자살 행위를 금지하는 교리 진술이라기보다, 그 행위가 불러올 가족과 명예의 파괴를 경고하는 수사로 읽었습니다.
  alternative_readings:
  - 도덕적 금지를 직접 설교하는 경고
  - 단순한 극적 협박
  rationale: 명령형이 아니라 기억하라는 경고 구조가 중심이므로, 윤리 명제를 과잉 부여하지 않고 원문의 경고 효과를 보존했습니다.
  doctrine_reference: 본문의 수사적 경고와 서사적 맥락
- issue: ἀντίζηλος의 관계적 강도
  chosen_reading: ‘경쟁자’로 번역하되, 혼인 질서 안의 적대적 경쟁이라는 함의를 유지했습니다.
  alternative_readings:
  - 질투하는 자
  - 맞수
  rationale: 일상적 경쟁보다 더 날카로운 대립이지만, 한국어에서 지나치게 현대적이거나 약화된 표현은 피했습니다.
  doctrine_reference: 가정 질서와 서사적 갈등
