  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/006.yaml
  text: But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,
translation:
  language: ko
  text: 그러나 저는 벨리알의 영이 그녀를 괴롭히고 있음을 알고, 주님께 기도한 뒤 그녀에게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  english_pob_choice: the spirit of Beliar
  chosen_korean: 벨리알의 영
  alternatives_korean:
  - 벨리아르의 영
  - 악한 영
  lexicon: πνεῦμα; Βελίαρ
  rationale: 원문의 소유격 관계를 그대로 살려 특정 존재에 속한 영이라는 점을 드러냈고, 인명은 음역보다 널리 통용되는 학술형에 가깝게 벨리알로 옮겼습니다.
- source_word: ἐνοχλεῖ
  english_pob_choice: was troubling
  chosen_korean: 괴롭히는
  alternatives_korean:
  - 괴롭히고 있는
  - 성가시게 하는
  - 고통을 주는
  lexicon: ἐνοχλέω
  rationale: 지속적으로 그녀를 괴롭히는 상태를 자연스러운 현대 한국어 현재분사로 반영했습니다.
- source_word: τῷ Κυρίῳ
  english_pob_choice: the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주에게
  lexicon: κύριος
  rationale: 문맥상 기도 대상인 주를 가리키므로, 한국어 경어법에 맞는 ‘주님께’로 옮겼습니다.
- source_word: πρὸς αὐτήν
  english_pob_choice: said to her
  chosen_korean: 그녀에게 말했습니다
  alternatives_korean:
  - 그 여자에게 말했습니다
  - 그에게 말했습니다
  lexicon: πρός + dative
  rationale: 방향·대상 관계를 자연스럽게 살려 ‘~에게 말했습니다’로 처리했습니다.
theological_decisions:
- issue: 악령/영의 인칭성과 진술 방식
  chosen_reading: ‘벨리알의 영’이 그녀를 괴롭힌다는 인식을 바탕으로, 화자가 주님께 기도한 뒤 그 여자에게 직접 말하는 장면으로 옮겼습니다.
  alternative_readings:
  - ‘악한 영’으로 일반화하여 번역
  - ‘성령’과 대비되는 영적 영향력으로 완화
  rationale: 원문은 특정한 ‘벨리알의 영’을 말하므로 일반화하지 않고, 내러티브의 원인 설명과 행동 순서를 유지했습니다.
  doctrine_reference: 영적 존재에 대한 본문 내 서술은 해석보다 서술을 우선합니다.
