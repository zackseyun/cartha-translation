  to: 그러자 그녀는 기회를 틈타, 남편이 아직 밖에 있는 동안 내게 뛰어들어와 말했습니다. “나는 숨이 막힙니다. 당신이 나와 동침하지 않으면, 나는 스스로 절벽 아래로 몸을 던지겠습니다.”
  rationale: Ἄγχομαι를 현대 한국어에서 자연스러우면서도 원문의 의미 범위를 과도하게 좁히지 않는 ‘숨이 막힙니다’로 고쳤습니다. 대화체의 호칭을 합쇼체에 맞추었고, 대응 각주가 없는 표지를 제거했습니다. 그 밖의 성적 요구와 절벽에서 몸을 던지겠다는 위협은 원문과 영어 감사 이력의 직접성을 유지했습니다.
