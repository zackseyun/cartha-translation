source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Τότε οὖν εὐκαιρίαν λαβοῦσα¹² εἰσεπήδησε πρός με, *ἔτι ἔξω ὄντος¹³ τοῦ ἀνδρὸς αὐτῆς, καὶ λέγει¹⁴ μοι· *Ἄγχομαι, ἢ εἰς κρημνὸν ῥίπτω ἐμαυτήν¹⁵, ἐὰν μὴ *συγγενῇ μετ᾿ ἐμοῦ¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/005.yaml
  text: Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking, or I will throw myself down a cliff, if you do not lie with me.”
translation:
  language: ko
  text: 그러자 그녀는 기회를 틈타, 남편이 아직 밖에 있는 동안 내게 뛰어들어와 말했습니다. “나는 숨이 막힙니다. 당신이 나와 동침하지 않으면, 나는 스스로 절벽 아래로 몸을 던지겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκαιρίαν λαβοῦσα
  english_pob_choice: when she found an opportunity
  chosen_korean: 기회를 틈타
  alternatives_korean:
  - 때를 얻어
  - 기회를 얻어
  - 틈을 보아
  lexicon: εὐκαιρία
  rationale: ‘기회를 틈타’는 우연한 기회 포착과 그 기회를 악용하는 뉘앙스를 함께 담아, 서술의 긴박함을 자연스럽게 살립니다.
- source_word: εἰσεπήδησε πρός με
  english_pob_choice: she rushed in to me
  chosen_korean: 나에게 뛰어들어와
  alternatives_korean:
  - 나에게 달려들어
  - 내게 들이닥쳐
  - 나에게 뛰어와
  lexicon: εἰσπηδάω
  rationale: 동사의 급격한 침입성을 살리기 위해 ‘뛰어들어와’로 옮겼습니다.
- source_word: Ἄγχομαι
  english_pob_choice: I am choking
  chosen_korean: 나는 목이 졸립니다
  alternatives_korean:
  - 숨이 막힙니다
  - 목이 메입니다
  - 질식하겠습니다
  lexicon: ἄγχομαι
  rationale: 문자적 이미지인 ‘목이 졸리다’를 살리되, 한국어에서 병적인 호소처럼 들리지 않도록 현재형으로 자연화했습니다.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  english_pob_choice: if you do not lie with me
  chosen_korean: 네가 나와 동침하지 않으면
  alternatives_korean:
  - 네가 나와 잠자리를 함께하지 않으면
  - 네가 나와 관계하지 않으면
  - 네가 나와 함께 눕지 않으면
  lexicon: συγγίνομαι
  rationale: 영어 POB의 수정본처럼 완곡화하지 않고, 본문이 요구하는 성적 결합의 직접적 의미를 한국어에서 가장 분명한 표현으로 옮겼습니다.
- source_word: εἰς κρημνὸν ῥίπτω ἐμαυτήν
  english_pob_choice: I will throw myself down a cliff
  chosen_korean: 내가 스스로 절벽 아래로 몸을 던지겠습니다
  alternatives_korean:
  - 내가 절벽으로 몸을 던지겠습니다
  - 내가 낭떠러지 아래로 뛰어내리겠습니다
  - 내가 스스로 벼랑 아래로 떨어지겠습니다
  lexicon: κρημνός, ῥίπτω
  rationale: ‘절벽 아래로 몸을 던지다’는 자살적 위협의 강도를 보존하면서도 현대 한국어에서 이해하기 쉽습니다.
