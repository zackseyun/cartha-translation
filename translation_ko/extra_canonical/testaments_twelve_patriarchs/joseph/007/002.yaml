base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/002.yaml
  text: But when she saw this, she fell on her face at my feet, weeping; and I raised her up and admonished her.
translation:
  language: ko
  text: 그런데 그녀는 이것을 보고 내 발 앞에 얼굴을 대고 엎드려 울었습니다. 나는 그녀를 일으켜 세우고 훈계하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ δὲ ⌈Ἰδοῦσα τοῦτο⌉
  english_pob_choice: But when she saw this
  chosen_korean: 그런데 그녀가 이것을 보고는
  alternatives_korean:
  - 그런데 그녀가 이것을 보더니
  - 그런데 이것을 본 그녀가
  lexicon: ἰδοῦσα (aorist participle of ὁράω)
  rationale: 이 분사구를 원인·상황을 여는 종속절로 자연스럽게 풀어, POB의 시간 전개와 원문의 사건 선후를 그대로 살렸습니다.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτῆς εἰς τοὺς πόδας μου
  english_pob_choice: she fell on her face at my feet
  chosen_korean: 내 발 앞에 얼굴을 대고 엎드려
  alternatives_korean:
  - 내 발 앞에 얼굴을 숙이고
  - 내 발 앞에 엎드려
  lexicon: πρόσωπον / πόδες
  rationale: ‘얼굴을 대고 엎드리다’로 πρόσωπον과 πόδας의 중첩된 신체 이미지를 둘 다 살려, 단순한 ‘엎드리다’보다 원문의 강도를 보존했습니다.
- source_word: κλαίουσα
  english_pob_choice: weeping
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 울며 있었습니다
  lexicon: κλαίω
  rationale: 현재분사의 지속적 상태를 한국어 서술문으로 자연스럽게 처리하되, 과장된 정서어는 피했습니다.
- source_word: ἀναστήσας αὐτὴν ἐνουθέτησα
  english_pob_choice: I raised her up and admonished her
  chosen_korean: 나는 그녀를 일으켜 세우고 훈계하였습니다
  alternatives_korean:
  - 나는 그녀를 일으켜 세우고 권고하였습니다
  - 나는 그녀를 일으켜 세워 타일렀습니다
  lexicon: ἀναστήσας / νουθετέω
  rationale: ἀναστήσας는 물리적으로 ‘일으켜 세우다’로, ἐνουθέτησα는 단순 경고보다 더 직접적인 ‘훈계하다’로 옮겨 원문의 도덕적 권면을 드러냈습니다.
theological_decisions:
- issue: 서술어의 어조와 관계 설정
  chosen_reading: 화자와 상대 여성의 관계를 드러내는 서사적 장면으로 처리하고, 직접적 종교 용어를 덧붙이지 않았습니다.
  alternative_readings:
  - 정서적으로 완화한 표현
  - 더 경건한 어조의 번역
  rationale: 본문은 회개의 장면이 아니라 구체적 행동 묘사이므로, 과도한 경건화보다 사건 자체의 힘을 보존하는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 서사적 충실성
