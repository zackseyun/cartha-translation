id: T12P.JOS.7.1
reference: Testament of Joseph 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἵνα δὲ⁴⁵ μάθῃς⁴⁶, ὅτι⁴⁷ τῶν⁴⁸ ἐν σωφροσύνῃ θεοσεβούντων⁴⁹ οὐ κατισχύσει⁵⁰ κακία⁵¹ *τῶν ἀσεβούντων⁵². ⌈Ἰδοὺ⌉⁵³ λαβὼν⁵⁴ *ἐξ αὐτοῦ ἐνώπιόν σου ἐσθίων. Καὶ τοῦτο εἰπὼν εἶπον οὕτως⁵⁵. Ὁ Θεὸς τῶν πατέρων μου καὶ ὁ ἄγγελος Ἀβραὰμ⁵⁶ *ἔσται μετ᾽ ἐμοῦ⁵⁷. ⌈Ἔφαγον⌉⁵⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/001.yaml
  text: 'So that you may learn that the wickedness of the ungodly will not prevail over those who fear God with self-control, look: taking some of it in your presence, I will eat. And after saying this, I said thus, “The God of my fathers and the angel of Abraham will be with me.” And I ate.'
translation:
  language: ko
  text: 당신이 절제 가운데 하나님을 경외하는 이들은 경건하지 않은 자들의 악에 굴복하지 않는다는 것을 알게 하려고 말씀드립니다. 보십시오[a]. 내가 그것에서 얼마를 집어 당신 앞에서 먹겠습니다. 이 말을 한 뒤, 나는 이렇게 말했습니다. “내 조상들의 하나님과 아브라함의 천사가 나와 함께할 것입니다.” 그리고 나는 먹었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’에 해당하는 그리스어 낱말은 이 편집본에서 대괄호로 제시되어 있어, 본문 포함 여부가 불확실합니다.
    reason: 원문 편집본의 ⌈Ἰδοὺ⌉라는 대괄호 표기를 반영합니다.
  - marker: b
    text: ‘먹었습니다’에 해당하는 그리스어 낱말은 이 편집본에서 대괄호로 제시되어 있어, 본문 포함 여부가 불확실합니다.
    reason: 원문 편집본의 ⌈Ἔφαγον⌉라는 대괄호 표기를 반영합니다.
lexical_decisions:
- source_word: θεοσεβούντων
  english_pob_choice: those who fear God with self-control
  chosen_korean: 절제하며 하나님을 경외하는 이들
  alternatives_korean:
  - 하나님을 경외하는 자들
  - 경건하고 절제하는 이들
  lexicon: θεοσεβής / σωφροσύνη
  rationale: English POB의 결합 의미를 따라 단순한 경건이 아니라 절제와 하나님 경외를 함께 살렸습니다.
- source_word: κακία τῶν ἀσεβούντων
  english_pob_choice: the wickedness of the ungodly
  chosen_korean: 불경한 자들의 악
  alternatives_korean:
  - 악한 자들의 악행
  - 경건하지 않은 자들의 악
  lexicon: κακία / ἀσεβής
  rationale: κακία를 추상적인 ‘악’으로, ἀσεβούντων을 ‘불경한 자들’로 옮겨 도덕적 성격을 드러냈습니다.
- source_word: ἐνώπιόν σου
  english_pob_choice: in your presence
  chosen_korean: 당신 앞에서
  alternatives_korean:
  - 당신의 면전에서
  - 당신의 존재 앞에서
  lexicon: ἐνώπιον
  rationale: 직접 대면의 공간적 이미지를 자연스러운 한국어로 유지했습니다.
- source_word: ἔσται μετ᾽ ἐμοῦ
  english_pob_choice: will be with me
  chosen_korean: 나와 함께하실 것입니다
  alternatives_korean:
  - 나와 함께 있을 것입니다
  - 내 곁에 계실 것입니다
  lexicon: μετά + εἰμί
  rationale: 보호와 동행의 약속을 살리되, 하나님에 대한 경어를 적용했습니다.
theological_decisions:
- issue: “the angel of Abraham”의 번역
  chosen_reading: “아브라함의 천사”로 직역했습니다.
  alternative_readings:
  - 아브라함을 돌보는 천사
  - 아브라함의 사자
  rationale: 본문의 표면적 호칭을 보존해 독자가 본문의 천사 표상을 직접 보게 했습니다. 해석을 덧씌우지 않았습니다.
  doctrine_reference: 본서의 직역 우선 원칙과 예수/천사 동일시를 선험적으로 결론내리지 않는 번역 원칙
