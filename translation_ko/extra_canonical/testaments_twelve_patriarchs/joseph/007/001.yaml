revisions:
- from: 그래서 당신이 배울 수 있도록, 절제하며 하나님을 경외하는 이들에게는 불경한 자들의 악이 이기지 못한다는 것을 보십시오. 보십시오, 나는 당신 앞에서 그것의 일부를 가져다 먹고 있었습니다. 그리고 이렇게 말한 뒤 나는 이렇게 말했습니다. “내 조상의 하나님과 아브라함의 천사가 나와 함께하실 것입니다.” 그리고 나는 먹었습니다.[a][b]
  to: 당신이 절제 가운데 하나님을 경외하는 이들은 경건하지 않은 자들의 악에 굴복하지 않는다는 것을 알게 하려고 말씀드립니다. 보십시오[a]. 내가 그것에서 얼마를 집어 당신 앞에서 먹겠습니다. 이 말을 한 뒤, 나는 이렇게 말했습니다. “내 조상들의 하나님과 아브라함의 천사가 나와 함께할 것입니다.” 그리고 나는 먹었습니다[b].
  rationale: 과거 진행형을 제거하고, 제시된 영어 POB의 미래적 행동 제시 및 그리스어의 분사 연쇄에 맞추어 ‘먹겠습니다’로 옮겼습니다. 이어지는 발화와 최종 섭취 서술의 순서를 보존했습니다. 편집본이 유보한 두 낱말은 번역 본문에서 임의로 삭제하지 않고 각주로 표시했으며, 신학적 해석을 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
