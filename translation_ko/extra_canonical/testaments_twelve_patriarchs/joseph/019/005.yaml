  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ¹⁸ μετὰ ταῦτα ἑώρων *καὶ ἰδοὺ¹⁵ δώδεκα βόες θηλάζοντες¹⁹ μίαν δάμαλιν, ἢ ἐκ²⁰ . . . γάλακτος θάλασσαν ἐποίει καὶ ἔπινον ἐξ αὐτοῦ²¹ αἱ δώδεκα ποίμναι καὶ ἀνηρίθμητα ποίμνια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/005.yaml
  text: And after these things I saw, and behold, twelve bulls suckling one heifer, and it made a sea of milk, and the twelve flocks and innumerable flocks drank from it.
translation:
  language: ko
  text: 그리고 이 일들 뒤에 내가 보았습니다. 보십시오, 열두 마리 수소가 한 마리 암송아지를 젖먹이고 있었고, 그것은 젖의 바다를 이루었으며, 열두 떼와 셀 수 없이 많은 떼가 그 젖에서 마셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  english_pob_choice: after these things
  chosen_korean: 이 일들 뒤에
  alternatives_korean:
  - 그 일들 후에
  - 이후에
  lexicon: source phrase
  rationale: 문맥의 연속성을 살리면서도 직역투를 피하기 위해, 사건의 순서를 나타내는 간결한 표준어로 옮겼습니다.
- source_word: ἑώρων
  english_pob_choice: I saw
  chosen_korean: 내가 보았습니다
  alternatives_korean:
  - 내가 보았고
  - 보았습니다
  lexicon: source phrase
  rationale: 환시 서술의 1인칭 완료적 회상을 자연스럽게 드러내기 위해 합쇼체로 옮겼습니다.
- source_word: βόες θηλάζοντες
  english_pob_choice: twelve bulls suckling
  chosen_korean: 열두 마리 수소가 … 젖먹이고 있었고
  alternatives_korean:
  - 열두 마리 황소가 … 젖을 먹이고 있었고
  - 열두 마리 소가 … 젖먹이고 있었고
  lexicon: source phrase
  rationale: βόες의 기본 의미를 살리되, 한국어에서 더 자연스럽고 성별이 드러나는 ‘수소’로 옮겼습니다. θηλάζοντες는 단순히 ‘먹다’가 아니라 젖을 먹이는 동작이므로 ‘젖먹이다’로 처리했습니다.
- source_word: θάλασσαν ἐποίει
  english_pob_choice: it made a sea of milk
  chosen_korean: 젖의 바다를 이루었으며
  alternatives_korean:
  - 젖의 바다를 만들었으며
  - 젖의 바다가 되게 하였으며
  lexicon: source phrase
  rationale: POB의 최신 수정처럼 인과적·비인칭적 뉘앙스를 반영하되, 한국어에서 가장 자연스러운 결과 상태 표현인 ‘이루다’를 사용했습니다.
theological_decisions:
- issue: ‘sea of milk’의 비인칭/사역적 표현
  chosen_reading: 그것은 젖의 바다를 이루었습니다.
  alternative_readings:
  - 그것이 젖의 바다를 만들었습니다.
  - 그것으로부터 젖의 바다가 나왔습니다.
  rationale: 개정된 영어 POB가 ‘from her there came’보다 사역적·비인칭적 ‘it made’를 택한 점을 따라, 한국어에서도 행위 주체를 과도하게 구체화하지 않았습니다.
  doctrine_reference: 원문 서술의 환시적 상징성을 보존하는 번역 원칙
- issue: 여러 떼가 젖을 마시는 환시 이미지
  chosen_reading: 열두 떼와 셀 수 없이 많은 떼가 그 젖에서 마셨습니다.
  alternative_readings:
  - 열두 무리와 셀 수 없이 많은 무리가 그 젖을 마셨습니다.
  - 열두 떼와 무수한 떼가 그 젖을 마셨습니다.
  rationale: ἔπινον의 반복적 동작과 ἀνηρίθμητα ποίμνια의 과장적 규모를 살리기 위해 복수적 떼 표현을 유지했습니다.
  doctrine_reference: 상징적 환시 묘사의 문학적 보존
