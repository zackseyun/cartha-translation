revisions:
- from: 그리고 이 일들 뒤에 내가 보았습니다. 보십시오, 열두 마리 수소가 한 마리 암송아지를 젖먹이고 있었고, 그것은 젖의 바다를 이루었으며, 열두 떼와 셀 수 없이 많은 떼가 그 젖에서 마셨습니다.[a]
  to: 그 뒤에 나는 보았습니다. 보십시오, 열두 마리 수소가 한 마리 암송아지의 젖을 빨고 있었고, 그것이 젖의 바다를 이루었으며, 열두 양 떼와 셀 수 없이 많은 양 떼가 그곳에서 마셨습니다.[a]
  rationale: 수소들이 암송아지에게 젖을 먹인다는 역전된 의미를 바로잡아 ‘암송아지의 젖을 빨고 있었다’로 수정했습니다. ‘젖의 바다’ 절은 영어 POB의 비특정적 ‘it made’를 따라 ‘그것이’로 유지하되, 그리스어 결손으로 인한 불확실성은 주석으로 표시했습니다. 마지막의 ποίμναι와 ποίμνια는 모두 양 떼를 가리키는 표현으로 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:40:09Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 θηλάζοντες를 ‘젖먹이고 있었다’로 옮겨 수소들이 암송아지에게 젖을 먹이는 의미가 되었습니다. 이 분사는 여기서 암송아지의 젖을 빠는 행위를 뜻하므로 수정이 필요합니다. 또한 ποίμναι/ποίμνια는 문맥상 ‘양 떼’로 구체화하는 편이 적절합니다. θάλασσαν ἐποίει 앞 구절에는 판본상 결손이 있어, 그 행위의 정확한 주체·경로를 과도하게 확정하지 않아야 합니다.
  naturalness: ‘그리고 이 일들 뒤에’보다 ‘그 뒤에’가 현대 한국어 환시 서술에서 자연스럽습니다. ‘젖의 바다를 이루었다’는 시적 이미지를 유지하면서도, 결손된 연결부의 불확실성을 드러낼 수 있습니다.
  terminology: βόες는 영어 POB의 ‘bulls’에 맞추어 ‘수소’로 유지했습니다. δάμαλις는 ‘암송아지’, ποίμναι/ποίμνια는 ‘양 떼’로 옮겼습니다. 환시의 상징을 특정 교리적으로 해석하지 않았습니다.
  issues:
