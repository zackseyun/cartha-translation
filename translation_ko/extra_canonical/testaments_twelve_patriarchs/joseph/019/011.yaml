id: T12P.JOS.19.11
reference: Testament of Joseph 19:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὑμεῖς οὖν, τέκνα μου, φυλάξατε τὰς ἐντολὰς Κυρίου, καὶ τιμᾶτε³⁸ τὸν *Λευὶ καὶ τὸν Ἰούδαν³⁹. ὅτι *ἐκ τοῦ σπέρματος⁴⁰ αὐτῶν ἀνατελεῖ ὑμῖν⁴¹ [ὁ ἀμνὸς τοῦ Θεοῦ, ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου]⁴², σώζων [πάντα τὰ ἔθνη καὶ]⁴⁸ τὸν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/011.yaml
  text: Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you [the lamb of God, who takes away the sin of the world,] saving [all the nations and] Israel.
translation:
  language: ko
  text: 그러므로 너희, 내 자녀들아, 주님의 명령을 지키고 레위와 유다를 존중하십시오. 왜냐하면 그들의 씨에서 너희에게 [하나님의 어린양, 곧 세상의 죄를 제거하시는 이가] 나타나실 것이기 때문입니다. 그는 [모든 민족들과] 이스라엘을 구원하실 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε τὰς ἐντολὰς Κυρίου
  english_pob_choice: keep the commandments of the Lord
  chosen_korean: 주님의 명령을 지키고
  alternatives_korean:
  - 주님의 계명들을 지키고
  - 주님의 계명을 지키십시오
  lexicon: ἐντολή
  rationale: ἐντολάς는 단일한 ‘명령’보다 복수의 규범을 가리키므로 자연스러운 복수 의미를 살리되, 한국어에서는 간결하게 ‘명령을 지키고’로 옮겼습니다.
- source_word: τιμᾶτε τὸν Λευὶ καὶ τὸν Ἰούδαν
  english_pob_choice: honor Levi and Judah
  chosen_korean: 레위와 유다를 존중하십시오
  alternatives_korean:
  - 레위와 유다를 공경하십시오
  - 레위와 유다를 존귀하게 여기십시오
  lexicon: τιμάω
  rationale: 가문/지파를 향한 존중의 뜻을 살리되, 인격적 경배 뉘앙스가 강한 ‘공경’보다 덜 종교화된 ‘존중’이 문맥에 더 잘 맞습니다.
- source_word: ἀνατελεῖ ὑμῖν
  english_pob_choice: there will arise for you
  chosen_korean: 너희에게 ... 나타나실 것이기 때문입니다
  alternatives_korean:
  - 너희에게 ... 일어날 것이기 때문입니다
  - 너희에게 ... 솟아오를 것이기 때문입니다
  lexicon: ἀνατέλλω
  rationale: 출현/등장을 가리키는 비유적 표현을 한국어에서 자연스럽게 풀어, 인물의 도래를 드러내는 ‘나타나실 것’으로 옮겼습니다.
- source_word: ὁ ἀμνὸς τοῦ Θεοῦ, ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου
  english_pob_choice: the lamb of God, who takes away the sin of the world
  chosen_korean: 하나님의 어린양, 곧 세상의 죄를 제거하시는 이
  alternatives_korean:
  - 하나님의 어린양, 곧 세상의 죄를 없애시는 이
  - 하나님의 어린양, 곧 세상의 죄를 없애시는 분
  lexicon: ἀμνός / αἴρω
  rationale: 본문의 표지를 살려 ‘어린양’으로 직역하고, αἴρων은 단순한 용서가 아니라 죄를 ‘제거/들어올려 옮김’의 동작을 담아 ‘제거하시는’으로 번역했습니다.
- source_word: σώζων ... τὸν Ἰσραήλ
  english_pob_choice: saving ... Israel
  chosen_korean: 그는 ... 이스라엘을 구원하실 것입니다
  alternatives_korean:
  - 이스라엘을 구원하시며
  - 이스라엘을 구원하시는 분입니다
  lexicon: σῴζω
  rationale: 현재분사 σώζων의 지속적/설명적 기능을 한국어 미래-서술형으로 자연스럽게 풀어, 메시아의 구원 행위를 분명히 했습니다.
theological_decisions:
- issue: 삽입구의 정경적/주석적 지위
  chosen_reading: '[하나님의 어린양, 곧 세상의 죄를 제거하시는 이]와 [모든 민족들과]를 대괄호로 유지했습니다.'
  alternative_readings:
  - 괄호 없이 본문에 통합
  - 각주로만 처리
  rationale: 제공된 그리스어 본문과 EN POB가 모두 삽입/가변 전승을 보이므로, 본문 안에서는 가독성을 해치지 않는 범위에서 대괄호로 보존하는 것이 가장 투명합니다.
  doctrine_reference: textual transmission transparency
