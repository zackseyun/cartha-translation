  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/007.yaml
  text: And I saw a calf that encircled them twelve times, and it became wholly a help to the bulls.
translation:
  language: ko
  text: 그리고 저는 한 송아지가 그들을 열두 번 두르고 있는 것을 보았습니다. 그것은 황소들에게 온전히 도움이 되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόσχον
  english_pob_choice: a calf
  chosen_korean: 한 송아지
  alternatives_korean:
  - 송아지
  - 송아기
  lexicon: μόσχος
  rationale: 작은 소를 가리키는 기본 의미를 살려 ‘송아지’로 옮기고, 문맥상 특정 한 마리를 가리키므로 ‘한’을 보탰습니다.
- source_word: δωδεκάκις περιέβαλλε αὐτούς
  english_pob_choice: encircled them twelve times
  chosen_korean: 그들을 열두 번 두르고 있는
  alternatives_korean:
  - 그들을 열두 번 에워싸고 있는
  - 그들을 열두 차례 감싸고 있는
  lexicon: περιβάλλω
  rationale: 주위를 빙 둘러 감싸는 동작을 자연스러운 한국어 동사 ‘두르다’로 살렸고, ‘열두 번’은 반복 횟수를 직접 반영했습니다.
- source_word: ὁλοκλήρως (?) εἰς βοήθειαν
  english_pob_choice: wholly a help to the bulls
  chosen_korean: 온전히 도움이 되었습니다
  alternatives_korean:
  - 완전히 황소들의 도움이 되었습니다
  - 전적으로 황소들에게 도움이 되었습니다
  lexicon: ὁλοκλήρως / βοήθεια
  rationale: 불확실한 ὁλοκλήρως(?)를 과도하게 해석하지 않고 ‘온전히’로 보수적으로 옮겼으며, εἰς βοήθειαν의 기능적 의미를 ‘도움이 되다’로 자연화했습니다.
- source_word: τοῖς βουσὶ
  english_pob_choice: the bulls
  chosen_korean: 황소들에게
  alternatives_korean:
  - 소들에게
  - 수소들에게
  lexicon: βοῦς
  rationale: 복수 여격의 대상을 분명히 드러내기 위해 ‘황소들’로 옮겼고, 본문의 동물 상징성을 유지하기 위해 일반 ‘소들’보다 구체적으로 처리했습니다.
theological_decisions:
- issue: The verse contains symbolic animal imagery without explicit doctrinal terms.
  chosen_reading: 상징적 이미지 자체를 유지하고, 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 해석적 주석을 추가해 상징 의미를 설명하는 방식
  rationale: 본문은 ‘송아지’, ‘황소들’, ‘도움’의 관계를 서술할 뿐이므로, 독자에게 열려 있는 상징을 번역에서 좁히지 않는 것이 원문 충실도에 더 적합합니다.
  doctrine_reference: source-meaning fidelity / restraint in implied interpretation
