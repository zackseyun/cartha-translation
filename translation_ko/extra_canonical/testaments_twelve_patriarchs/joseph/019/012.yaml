id: T12P.JOS.19.12
reference: Testament of Joseph 19:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/012.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman's hut after the summer, vanishing away.
translation:
  language: ko
  text: 그의 나라는 영원한 나라가 될 것이며, 사라지지 않을 것입니다. 그러나 너희 가운데 있는 내 나라는 여름이 지나고 사라지는 파수꾼의 오두막처럼 완성되어 갑니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία αὐτοῦ ... αἰώνιος ... οὐ παρελεύσεται
  english_pob_choice: his kingdom will be an everlasting kingdom, which will not pass away
  chosen_korean: 그의 나라는 영원한 나라가 될 것이며, 사라지지 않을 것입니다
  alternatives_korean:
  - 그의 나라는 영원한 나라로 있을 것이며, 없어지지 않을 것입니다
  - 그의 왕국은 영원한 왕국이 되어, 지나가지 않을 것입니다
  lexicon: βασιλεία → 나라
  rationale: βασιλεία를 통상적인 ‘나라’로 옮겨 문맥상 지배 영역과 통치 현실을 자연스럽게 살렸고, αἰώνιος와 οὐ παρελεύσεται는 각각 ‘영원한’과 ‘사라지지 않을’로 대응해 지속성과 소멸 부정을 분명히 했습니다.
- source_word: ἡ δὲ ἐμὴ βασιλεία ἐν ὑμῖν
  english_pob_choice: But my kingdom among you
  chosen_korean: 그러나 너희 가운데 있는 내 나라
  alternatives_korean:
  - 그러나 내 나라는 너희 안에서
  - 그런데 내 나라는 너희 가운데에서
  lexicon: ἐν ὑμῖν → 너희 가운데 있는
  rationale: ἐν ὑμῖν을 개인 내면보다 공동체적·현존적 범위인 ‘너희 가운데’로 옮겨, 대조되는 두 나라의 공간적/관계적 대비를 유지했습니다.
- source_word: ἐπιτελεῖται
  english_pob_choice: will be brought to completion
  chosen_korean: 완성되어 갑니다
  alternatives_korean:
  - 완성됩니다
  - 이루어져 갑니다
  lexicon: ἐπιτελέω → 완성되다
  rationale: 최종 번역은 ‘종결’보다 ‘성취/완성’의 뉘앙스를 살리는 방향이므로, 단순히 끝나는 것이 아니라 목적을 향해 완성되는 진행성을 드러내기 위해 ‘완성되어 갑니다’로 옮겼습니다.
- source_word: ὡς ὀπωροφυλάκιον ... μετὰ τὸ θέρος ἐξαφανίζεται
  english_pob_choice: like a watchman's hut after the summer, vanishing away
  chosen_korean: 여름이 지나고 사라지는 파수꾼의 오두막처럼
  alternatives_korean:
  - 여름 뒤에 사라지는 파수꾼의 오두막처럼
  - 여름이 지난 뒤 흔적 없이 사라지는 파수꾼의 오두막처럼
  lexicon: ὀπωροφυλάκιον → 파수꾼의 오두막
  rationale: 이미지의 핵심인 임시 막사/초막의 비유를 살려 ‘파수꾼의 오두막’으로 옮겼고, ἐξαφανίζεται는 단순 소멸을 나타내는 ‘사라지는’으로 처리해 비유의 덧없음을 유지했습니다.
theological_decisions:
- issue: 두 나라의 대비와 종말론적 시간성
  chosen_reading: 아버지의 나라/그의 나라는 영원하지만, 요셉이 말하는 자신의 나라는 청중 가운데서 완성되어 가는 것으로 구분했습니다.
  alternative_readings:
  - 둘 다 단순히 미래에 끝나는지 여부로만 읽는 해석
  - ‘내 나라’가 단지 쇠퇴한다는 의미로 평면화하는 해석
  rationale: 본문은 βασιλεία의 두 용례를 대조해, 하나는 영원성과 불변성을, 다른 하나는 청중 가운데서 진행 중인 성격을 보여 줍니다. 따라서 ‘완성’ 언어를 유지해 차이를 약화시키지 않았습니다.
  doctrine_reference: 종말론 / 왕권 대비
- issue: 직설적 소유격과 공동체적 현존
  chosen_reading: ἐν ὑμῖν은 ‘너희 가운데’로 옮겨 개인 내면화보다 공동체적 현존을 드러냈습니다.
  alternative_readings:
  - 너희 안에
  - 너희 속에서
  rationale: 이 구절은 내적 영성보다 청중 사이에 임한 왕권의 상태를 강조하므로, 한국어에서 더 오해가 적은 ‘너희 가운데’가 본문 긴장을 보존합니다.
  doctrine_reference: 성육신적 현존 / 공동체적 통치
