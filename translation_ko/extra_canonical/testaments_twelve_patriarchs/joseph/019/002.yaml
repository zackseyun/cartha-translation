lexical_decisions:
- source_word: ἔλαφοι
  english_pob_choice: deer
  chosen_korean: 사슴
  alternatives_korean:
  - 노루
  - 산양
  lexicon: ἔλαφος
  rationale: 영문 POB의 deer를 그대로 반영해 일반 명사 사슴으로 옮겼습니다.
- source_word: ἐνέμοντο ἐν τόπῳ
  english_pob_choice: were feeding in one place
  chosen_korean: 한 곳에서 먹이를 먹고 있었고
  alternatives_korean:
  - 한 곳에서 풀을 뜯고 있었고
  - 한 곳에서 먹고 있었고
  lexicon: νέμω
  rationale: 동물의 초식 행위를 자연스럽게 살리기 위해 ‘먹이를 먹다’로 옮겼고, 장소성은 ‘한 곳에서’로 처리했습니다.
- source_word: διεσπάρησαν εἰς πᾶσαν τὴν γῆν
  english_pob_choice: were scattered over all the earth
  chosen_korean: 온 땅에 흩어졌습니다
  alternatives_korean:
  - 온 땅에 흩어져 있었습니다
  - 온 땅으로 흩어졌습니다
  lexicon: διασπείρω
  rationale: 분산·흩어짐의 동사를 직접 살리고, εἰς πᾶσαν τὴν γῆν의 범위를 ‘온 땅’으로 간결하게 옮겼습니다.
