  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/010.yaml
  text: But these things will happen in their time, in the last days.
translation:
  language: ko
  text: 그런데 이 일들은 자기들의 때에, 마지막 날들에 일어날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  english_pob_choice: these things
  chosen_korean: 이 일들
  alternatives_korean:
  - 이것들
  - 이러한 일들
  lexicon: source_note
  rationale: 지시대명사 Ταῦτα를 사건 지시로 자연스럽게 받아 ‘이 일들’로 옮겨, 문맥상 예언된 사건들을 가리키게 했습니다.
- source_word: δὲ
  english_pob_choice: But
  chosen_korean: 그런데
  alternatives_korean:
  - 그러나
  - 그리고
  lexicon: source_note
  rationale: 연결접속사 δὲ는 앞말과의 대비·전개를 약하게 띠므로, 한국어에서는 ‘그런데’가 가장 무리 없이 흐름을 살립니다.
- source_word: ἐν καιρῷ αὐτῶν
  english_pob_choice: in their time
  chosen_korean: 자기들의 때에
  alternatives_korean:
  - 그들의 때에
  - 정해진 때에
  lexicon: source_note
  rationale: καιρός는 단순한 시각보다 ‘때/정해진 시기’의 뉘앙스를 가지므로, 소유 대명사를 살린 ‘자기들의 때에’로 옮겼습니다.
- source_word: ἐν ἐσχάταις ἡμέραις
  english_pob_choice: in the last days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 말세에
  - 마지막 시대에
  lexicon: source_note
  rationale: ἡμέραις를 직역해 복수성을 살리되, 종말론적 표현은 과도하게 교회적 관용구로 굳히지 않고 원문에 충실한 ‘마지막 날들’로 렌더링했습니다.
theological_decisions:
- issue: 종말 표현의 전달 방식
  chosen_reading: ‘마지막 날들’로 옮겨, 예언적 종결 감각은 살리되 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - ‘말세에’로 전통적 종말 용어를 사용하는 방식
  - ‘마지막 시대에’로 풀어 해석하는 방식
  rationale: 원문은 단순한 시간표현과 종말지시를 병기하므로, 한국어도 해석을 확정하지 않고 예언적 긴장만 유지하는 것이 적절합니다.
  doctrine_reference: 종말론적 시간표현의 최소 개입 원칙
