    issue: ‘자기들의 때’ gives αὐτῶν an inappropriate reflexive nuance.
    rationale: Korean ‘자기’ normally refers back reflexively to a clause participant. The Greek αὐτῶν simply means ‘their,’ and its referent should remain no more specific than the source.
