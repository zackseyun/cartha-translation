  source_fidelity: The draft accurately renders Ταῦτα, the future γενήσεται, ἐν καιρῷ αὐτῶν, and ἐν ἐσχάταις ἡμέραις. However, ‘자기들의’ normally has a reflexive force in Korean and lacks a suitable antecedent here; αὐτῶν is non-reflexive (‘their’).
  naturalness: The sentence is otherwise natural in modern formal-polite Korean. Retaining the two temporal phrases with a comma preserves the source’s compact juxtaposition without adding an interpretive relation between them.
  terminology: ‘마지막 날들’ is an appropriately literal and theologically neutral rendering of ἐσχάταις ἡμέραις. ‘그들의 때’ retains the source pronoun without specifying its antecedent.
  issues:
