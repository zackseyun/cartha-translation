source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ταῦτα δὲ³⁶ γενήσεται ἐν καιρῷ αὐτῶν³⁷ ἐν ἐσχάταις ἡμέραις.
