id: T12P.JOS.19.8
reference: Testament of Joseph 19:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ εἶδον²⁶ *ὅτι [ἐκ τοῦ Ἰούδα ἐγεννήθη] †παρθένος, [ἔχουσα στολὴν βυσσίνην, καὶ ἐξ αὐτῆς] ἐγεννήθη ἀμνὸς [ἄμωμος]²⁷ *καὶ ἦν²⁸ ἐξ ἀριστερῶν αὐτοῦ ὡς λέων· καὶ πάντα τὰ θηρία ὥρμων³⁰ *κατ᾽ αὐτοῦ³¹ καὶ ἐνίκησεν αὐτὰ ὁ ἀμνός, καὶ ἀπώλεσεν *αὐτὰ εἰς καταπάτημα³².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/008.yaml
  text: And I saw that [from Judah was born] a virgin, [wearing a robe of fine linen, and from her] a [blameless] lamb was born; and on his left there was, as it were, a lion; and all the beasts were rushing against him, and the lamb overcame them and destroyed them for trampling.
translation:
  language: ko
  text: 그리고 내가 보니, [유다에게서 태어난] 처녀가 [고운 아마포 옷을 입고 있었고, 그녀에게서] 흠 없는 어린양이 태어났습니다. 그리고 그의 왼쪽에는 사자와 같은 이가 있었습니다. 모든 들짐승이 그를 향해 달려들었으나, 어린양이 그들을 이기고 그들을 짓밟게 내버려 두었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρθένος
  english_pob_choice: a virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 젊은 여자
  lexicon: παρθένος
  rationale: 영어 POB의 virgin을 그대로 반영하되, 본문이 가진 상징적·예언적 울림을 살려 일반적이고도 직역적인 ‘처녀’를 택했습니다.
- source_word: στολὴν βυσσίνην
  english_pob_choice: wearing a robe of fine linen
  chosen_korean: 고운 아마포 옷을 입고 있었고
  alternatives_korean:
  - 세마포 옷을 입고 있었고
  - 고운 베옷을 입고 있었고
  lexicon: στολή, βύσσινος
  rationale: βύσσινος를 ‘고운 아마포’로 옮겨 고급 직물의 뉘앙스를 살렸고, 착용 상태를 자연스러운 한국어로 풀어냈습니다.
- source_word: ἄμωμος
  english_pob_choice: blameless
  chosen_korean: 흠 없는
  alternatives_korean:
  - 책망할 데 없는
  - 티 없는
  lexicon: ἄμωμος
  rationale: 도덕적 결함이 없다는 뜻을 간결하게 드러내는 ‘흠 없는’이 가장 직접적입니다.
- source_word: εἰς καταπάτημα
  english_pob_choice: for trampling
  chosen_korean: 짓밟게 내버려 두었습니다
  alternatives_korean:
  - 짓밟도록 하였습니다
  - 밟아 버리게 하였습니다
  lexicon: καταπάτημα
  rationale: 결말의 목적/결과를 살려, 단순히 ‘짓밟았다’보다 ‘짓밟게 되도록 하다’의 뉘앙스를 반영했습니다.
theological_decisions:
- issue: 유다에게서 난 처녀와 어린양-사자 상징의 보존
  chosen_reading: 구약적·묵시적 상징을 완화하지 않고, 괄호 속 보충과 함께 전승된 이미지를 그대로 드러냈습니다.
  alternative_readings:
  - 상징을 해설적으로 풀어 쓰는 번역
  - 이미지를 단순화하는 번역
  rationale: 본문은 해석보다 환시의 이미지를 제시하므로, 독자가 상징의 긴장을 직접 읽도록 유지하는 것이 원문에 충실합니다.
  doctrine_reference: 묵시적 상징 서술 보존
- issue: ‘사자와 같은 이’의 비교 표현
  chosen_reading: ἐξ ἀριστερῶν αὐτοῦ ὡς λέων의 비교를 ‘사자와 같은 이’로 옮겨, 동일시가 아닌 유사성을 유지했습니다.
  alternative_readings:
  - 그의 왼쪽에 사자가 있었습니다
  - 사자처럼 보였습니다
  rationale: 원문은 사자의 실재 여부를 단정하기보다 비유적 유사성을 말하므로, 비교 표지를 살려 번역했습니다.
  doctrine_reference: 비유적 표현의 보존
