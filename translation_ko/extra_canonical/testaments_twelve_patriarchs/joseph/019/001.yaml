id: T12P.JOS.19.1
reference: Testament of Joseph 19:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καίγε καὶ²² ὡραιότητα ἔδωκέ²³ μοι ὑπὲρ ὡραίους Ἰσραήλ, ⌜καὶ⌉ ἐφύλαξέ²⁴ με ⌜ἕως γήρους²⁵ ἐν δυνάμει καὶ⌉ ἐν κάλλει· *Καὶ γὰρ ὅμοιος ἤμην²⁶ ἐν πᾶσι τῷ²⁷ Ἰακώβ. Ἀκούσατε δέ¹, τέκνα μου, καὶ *περὶ ὧν †οἶδα ἐνυπνίων².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/001.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things. Now listen, my children, also concerning the dreams that I know about.
translation:
  language: ko
  text: 실로 그분께서는 이스라엘의 잘생긴 사람들보다도 더 아름다운 용모를 내게 주셨고, 노년에 이르기까지 힘과 아름다움을 지닌 채 나를 지켜 주셨습니다. 나는 모든 면에서 야곱과 같았습니다. 이제 내 자녀들아, 내가 아는 꿈들에 관해서도 들으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα / ὡραίους
  english_pob_choice: beauty beyond the handsome men of Israel
  chosen_korean: “잘생긴 사람들보다도 더 큰 아름다움”
  alternatives_korean:
  - “아름다움”
  - “아름다운 용모”
  lexicon: ὡραιότης
  rationale: 영어 POB가 ‘handsome men’을 유지하듯, 여기서는 외모의 아름다움과 매력을 드러내는 표현으로 풀어 ‘잘생긴 사람들’로 옮기되, 비교 구문인 ‘더 큰 아름다움’을 살렸습니다.
- source_word: ἐφύλαξέ με ἕως γήρους ἐν δυνάμει καὶ ἐν κάλλει
  english_pob_choice: preserved me until old age in strength and in beauty
  chosen_korean: “내게 늙은 나이까지 힘과 아름다움 가운데서 나를 지켜 주셨습니다”
  alternatives_korean:
  - “늙을 때까지 힘과 아름다움으로 보존하셨습니다”
  - “노년이 되기까지 힘과 아름다움으로 보존하셨습니다”
  lexicon: φυλάσσω, γῆρας, δύναμις, κάλλος
  rationale: ἐφύλαξέ의 보호·보존 의미를 살려 ‘지켜 주셨습니다’로 옮겼고, ἕως γήρους는 자연스러운 현대어로 ‘늙은 나이까지’로 표현했습니다.
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  english_pob_choice: I was like Jacob in all things
  chosen_korean: “나는 모든 면에서 야곱과 같았습니다”
  alternatives_korean:
  - “나는 모든 일에 야곱과 같았습니다”
  - “나는 모든 점에서 야곱과 비슷했습니다”
  lexicon: ὅμοιος, ἐν πᾶσι
  rationale: 직접적인 비교 진술이므로 ‘같았습니다’로 강하게 살렸고, ἐν πᾶσι는 문맥상 ‘모든 면에서’가 가장 자연스럽습니다.
- source_word: περὶ ὧν οἶδα ἐνυπνίων
  english_pob_choice: concerning the dreams that I know about
  chosen_korean: “내가 아는 꿈들에 관해서도”
  alternatives_korean:
  - “내가 아는 꿈들에 대하여도”
  - “내가 알고 있는 꿈들에 관해서도”
  lexicon: ἐνύπνιον
  rationale: 수정된 영어 POB처럼 복수형 ‘꿈들’을 반영하고, ὧν οἶδα의 ‘내가 아는’이라는 범위를 과장 없이 살렸습니다.
theological_decisions:
- issue: 자전적 찬양과 보존의 서술을 어떻게 톤으로 옮길지
  chosen_reading: 하나님의 은혜로운 보존을 서술하는 자기 증언으로, 과장된 경건어보다 분명한 서술형으로 옮겼습니다.
  alternative_readings:
  - 더 경건한 어조의 번역
  - 전통적 성서문체로의 격상
  rationale: 본문은 야곱과의 유사성과 노년까지의 보존을 회고하는 자전적 진술이므로, 의미를 흐리지 않는 현대 서술체가 가장 충실합니다.
  doctrine_reference: 문학 장르와 수사 기능에 대한 일반 원칙
