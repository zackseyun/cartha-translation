  terminology: ὡραιότης/ὡραῖος의 외적 아름다움 비교는 ‘이스라엘의 잘생긴 사람들보다도 더 아름다운 용모’로 유지했습니다. ἐνύπνια의 복수는 ‘꿈들’로, 논쟁적·불완전할 수 있는 περὶ ὧν οἶδα의 범위는 영어 감사 기록을 따라 ‘내가 아는’으로 보존했습니다.
