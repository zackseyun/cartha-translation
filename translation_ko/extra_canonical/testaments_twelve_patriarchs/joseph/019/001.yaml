  to: 실로 그분께서는 이스라엘의 잘생긴 사람들보다도 더 아름다운 용모를 내게 주셨고, 노년에 이르기까지 힘과 아름다움을 지닌 채 나를 지켜 주셨습니다. 나는 모든 면에서 야곱과 같았습니다. 이제 내 자녀들아, 내가 아는 꿈들에 관해서도 들으십시오.
  rationale: 중복 목적어를 바로잡고, 노년까지 힘과 아름다움을 유지한 상태로 보존되었다는 그리스어의 ἐν δυνάμει καὶ ἐν κάλλει를 자연스러운 한국어로 옮겼습니다. 복수 ‘꿈들’과 ‘내가 아는’의 제한은 유지했으며, 대응 주석이 없는 각주 표지는 삭제했습니다.
