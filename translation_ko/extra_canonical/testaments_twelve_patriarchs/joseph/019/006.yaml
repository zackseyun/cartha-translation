  to: 그리고 네 번째 수소의 뿔들이 하늘까지 솟아올라 양 떼의 성벽처럼 되었고, 그 두 뿔 한가운데서 또 다른 뿔이 돋아났습니다.
  rationale: 수소와 뿔의 소유 관계를 정확히 하고 ‘한가운데’라는 공간 표현을 원문에 맞게 조정했습니다. 상징의 해석을 덧붙이지 않았으며, 원문의 비유적·식물성 이미지를 유지했습니다.
