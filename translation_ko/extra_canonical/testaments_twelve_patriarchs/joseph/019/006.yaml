  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ τοῦ τετάρτου βοὸς ἀνέβησαν τὰ κέρατα μέχρι τοῦ οὐρανοῦ καὶ ἐγένοντο ὡς τεῖχος τῶν ποιμνῶν, καὶ ἐν μέσῳ τῶν δύο²² κεράτων ἐξεβλάστησε²³ ἄλλο κέρας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/006.yaml
  text: And from the fourth bull its horns went up as far as heaven and became like a wall of the flocks, and in the midst of the two horns another horn sprouted.
translation:
  language: ko
  text: 그리고 네 번째 수소에게서 그 뿔들이 하늘에까지 솟아올라 양 떼의 성벽처럼 되었고, 그 두 뿔 사이에서 또 다른 뿔이 돋아났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ τετάρτου βοὸς
  english_pob_choice: the fourth bull
  chosen_korean: 네 번째 수소
  alternatives_korean:
  - 네 번째 황소
  - 네 번째 소
  lexicon: 보ῦς
  rationale: 보ῦς는 성별 중립의 '소'보다 구체적이고, 이 문맥의 상징 동물로서 현대 한국어에서는 '수소'가 가장 자연스럽고 정확합니다.
- source_word: ἀνέβησαν τὰ κέρατα μέχρι τοῦ οὐρανοῦ
  english_pob_choice: its horns went up as far as heaven
  chosen_korean: 그 뿔들이 하늘에까지 솟아올라
  alternatives_korean:
  - 그 뿔들이 하늘까지 올라가
  - 그 뿔들이 하늘에 이르기까지 올라
  lexicon: ἀναβαίνω / κέρας / οὐρανός
  rationale: '''went up''의 상승 동작을 ''솟아오르다''로 살려 시각적 힘을 유지했고, μέχρι τοῦ οὐρανοῦ를 ''하늘에까지''로 옮겨 범위를 분명히 했습니다.'
- source_word: ὡς τεῖχος τῶν ποιμνῶν
  english_pob_choice: like a wall of the flocks
  chosen_korean: 양 떼의 성벽처럼
  alternatives_korean:
  - 양 떼를 위한 성벽처럼
  - 양 떼를 둘러싼 성벽처럼
  lexicon: τεῖχος / ποίμνιον
  rationale: τεῖχος는 단순한 '벽'보다 방어적이고 압도적인 '성벽'이 더 가깝고, τῶν ποιμνῶν은 관계를 살려 '양 떼의'로 옮겼습니다.
- source_word: ἐξεβλάστησε ἄλλο κέρας
  english_pob_choice: another horn sprouted
  chosen_korean: 또 다른 뿔이 돋아났습니다
  alternatives_korean:
  - 또 다른 뿔이 솟아났습니다
  - 또 다른 뿔이 자라났습니다
  lexicon: ἐκβλαστάνω
  rationale: ‘sprouted’의 식물성 이미지를 살리기 위해 '돋아나다'를 택해, 단순한 출현보다 유기적 발생을 드러냈습니다.
theological_decisions:
- issue: 상징적 환상 어휘의 직역성
  chosen_reading: 동물과 뿔의 이미지, 그리고 '성벽'을 그대로 유지해 상징의 힘을 약화하지 않았습니다.
  alternative_readings:
  - 의미를 풀어 '보호막' 또는 '방벽'으로 완화하는 번역
  rationale: 이 구절은 예언적 상징이 중심이므로, 독자가 원문이 제시하는 시각적 긴장을 직접 보도록 하는 것이 중요합니다.
  doctrine_reference: 상징서사 보존 원칙
