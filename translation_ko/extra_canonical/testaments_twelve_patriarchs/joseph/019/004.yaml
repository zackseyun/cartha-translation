id: T12P.JOS.19.4
reference: Testament of Joseph 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐκεῖ ἐβόησαν πρὸς Κύριον μέχρι οὐ συνήχθησαν *πρὸς αὐτοὺς¹⁷ οἱ ἐννέα ἔλαφοι καὶ ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα, καὶ μετ’ ὀλίγον χρόνον ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/004.yaml
  text: And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks.
translation:
  language: ko
  text: 그리고 거기서 그들은 주님께 부르짖었습니다. 그러자 아홉 마리의 사슴이 그들에게 모여들었고, 그들은 열두 마리의 양처럼 되었습니다. 그리고 얼마 지나지 않아 그들은 늘어나 많은 떼가 되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησαν πρὸς Κύριον
  english_pob_choice: they cried out to the Lord
  chosen_korean: 주님께 부르짖었습니다
  alternatives_korean:
  - 주님께 외쳤습니다
  - 주님께 소리 높여 부르짖었습니다
  lexicon: βοάω; κύριος
  rationale: ἐβόησαν은 단순히 말한 것이 아니라 절박하게 부르짖는 행위를 가리키므로 ‘부르짖었습니다’가 가장 직접적입니다. κύριον은 문맥상 하나님을 가리키므로 ‘주님’으로 옮겼습니다.
- source_word: πρὸς αὐτοὺς ... οἱ ἐννέα ἔλαφοι
  english_pob_choice: the nine deer were gathered to them
  chosen_korean: 아홉 마리의 사슴이 그들에게 모여들었고
  alternatives_korean:
  - 아홉 마리의 사슴이 그들에게 모였고
  - 아홉 사슴이 그들 곁에 모여들었고
  lexicon: ἔλαφος; συνάγω
  rationale: ἔλαφος는 ‘사슴’이며, 수량 표현은 한국어 자연성을 위해 ‘마리’를 붙였습니다. συνήχθησαν의 수동적 뉘앙스를 살려 ‘모여들었고’로 옮겼습니다.
- source_word: ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα
  english_pob_choice: they themselves became like twelve sheep
  chosen_korean: 그들은 열두 마리의 양처럼 되었습니다
  alternatives_korean:
  - 그들 자신이 열두 마리의 양같이 되었습니다
  - 그들 자신이 마치 열두 마리의 양이 된 듯했습니다
  lexicon: γίνομαι; πρόβατον
  rationale: 직역의 ‘그들 자신이’보다 한국어에서는 주어 ‘그들’만으로도 강조가 전달되므로, 의미를 과도하게 늘리지 않고 자연스럽게 옮겼습니다. πρόβατα는 문자 그대로 ‘양들’입니다.
- source_word: ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά
  english_pob_choice: they increased and became many flocks
  chosen_korean: 그들은 늘어나 많은 떼가 되었습니다
  alternatives_korean:
  - 그들은 번성하여 많은 떼가 되었습니다
  - 그들은 증가하여 많은 무리가 되었습니다
  lexicon: αὐξάνω; ποίμνιον
  rationale: ηὐξάνοντο는 수적 증가를 뜻하므로 ‘늘어나’로, ποίμνια는 가축 떼/양 떼의 집합을 가리켜 ‘떼’로 옮겼습니다. ‘무리’보다 목축적 이미지를 더 잘 살립니다.
theological_decisions:
- issue: Kύριος의 대상 식별
  chosen_reading: 문맥상 하나님을 가리키는 호칭으로 ‘주님’이라 옮겼습니다.
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 본문은 기도 행위를 묘사하며, 인명이나 일반 주인을 뜻하는 것이 아니므로 한국어 독자에게 즉시 인지되는 경어적 호칭 ‘주님’이 가장 적절합니다. 본문이 예수나 구약의 야훼 직접 인용을 전제하지 않으므로 ‘야훼’ 표기는 채택하지 않았습니다.
  doctrine_reference: 문맥적 신적 호칭 번역
