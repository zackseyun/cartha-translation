  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἑώρων ὅτι τρεῖς¹⁴ ἔλαφοι τρεῖς ἀμνοὶ ἐγίνοντο καὶ ἐβόησαν πρὸς Κύριον καὶ ἐξήγαγε αὐτοὺς Κύριος¹⁵ εἰς τόπον εὐθαλῆ καὶ ἔνυδρον, καὶ ἤγαγε¹⁶ αὐτοὺς ἐκ σκότους εἰς φῶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/003.yaml
  text: And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord brought them out to a flourishing and well-watered place, and brought them from darkness into light.
translation:
  language: ko
  text: 그리고 내가 보니 세 마리의 사슴이 세 마리의 어린 양이 되었고, 그들이 주께 부르짖었더니 주께서 그들을 번성하고 물이 넉넉한 곳으로 이끌어 내셨으며, 어둠에서 빛으로 데리고 나오셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρεῖς ἔλαφοι ... τρεῖς ἀμνοὶ ἐγίνοντο
  english_pob_choice: the three deer became three lambs
  chosen_korean: 세 마리의 사슴이 세 마리의 어린 양이 되었고
  alternatives_korean:
  - 세 사슴이 세 어린 양이 되었고
  - 세 마리 사슴이 세 마리 어린 양이 되었고
  lexicon: ἔλαφος / ἀμνός
  rationale: 영문 POB의 동물 대비를 따라가되, 한국어에서는 수량을 자연스럽게 풀어 ‘세 마리의’로 옮겨 독자가 변화를 바로 이해하게 했습니다.
- source_word: πρὸς Κύριον
  english_pob_choice: to the Lord
  chosen_korean: 주께
  alternatives_korean:
  - 주님께
  - 주께서
  lexicon: κύριος
  rationale: 직접 호소의 방향을 보존하기 위해 ‘주께’로 옮겼고, 여기서는 기도·부르짖음의 대상이라는 점이 핵심이므로 주체 표지보다 목적격 뉘앙스를 살렸습니다.
- source_word: ἐξήγαγε αὐτοὺς Κύριος
  english_pob_choice: the Lord brought them out
  chosen_korean: 주께서 그들을 번성하고 물이 넉넉한 곳으로 이끌어 내셨으며
  alternatives_korean:
  - 주께서 그들을 번성하고 물이 넉넉한 곳으로 데리고 나오셨으며
  - 주께서 그들을 번성하고 물이 넉넉한 곳으로 인도하여 내셨으며
  lexicon: ἐξάγω
  rationale: ἐξήγαγε는 단순 ‘인도하다’보다 ‘밖으로 이끌어 내다/데리고 나오다’의 이동성을 강하게 가지므로, 영어 POB의 ‘brought them out’를 따라 ‘이끌어 내셨으며’로 옮겼습니다.
- source_word: εἰς τόπον εὐθαλῆ καὶ ἔνυδρον
  english_pob_choice: into a flourishing and well-watered place
  chosen_korean: 번성하고 물이 넉넉한 곳으로
  alternatives_korean:
  - 무성하고 물이 풍부한 곳으로
  - 번성하며 물이 많은 곳으로
  lexicon: εὐθαλής / ἔνυδρος
  rationale: 두 형용사의 묘사성을 살리되 한국어 문장 흐름에 맞게 ‘번성하고 물이 넉넉한’으로 옮겨, 장소의 풍요와 생명성을 함께 드러냈습니다.
theological_decisions:
- issue: ‘어둠에서 빛으로’의 구원-해방 이미지 유지
  chosen_reading: 어둠에서 빛으로 데리고 나오셨습니다
  alternative_readings:
  - 어둠에서 빛으로 이끌어 내셨습니다
  - 어둠에서 빛으로 옮기셨습니다
  rationale: 본문의 마지막 대구는 단순한 지리 이동이 아니라 구원적 전이를 강조하므로, 한국어에서도 상징적 대비를 그대로 살렸습니다.
  doctrine_reference: 해방/구원 상징의 보존
