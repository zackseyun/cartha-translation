revisions:
- from: 그리고 내가 보니 세 마리의 사슴이 세 마리의 어린 양이 되었고, 그들이 주께 부르짖었더니 주께서 그들을 번성하고 물이 넉넉한 곳으로 이끌어 내셨으며, 어둠에서 빛으로 데리고 나오셨습니다.[a][b]
  to: 그리고 내가 보니 세 마리의 사슴이 세 마리의 어린 양이 되었고, 그들이 주께 부르짖었으며, 주께서 그들을 무성하고 물이 풍부한 곳으로 이끌어 내셨고, 어둠에서 빛으로 데리고 가셨습니다.
