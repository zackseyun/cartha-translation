id: T12P.JOS.8.7
reference: Testament of Joseph 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὐκ ἔγνω δὲ αὐτὴ⁴⁵ ὅτι διὰ τὸν⁴⁶ Κύριόν⁴⁷ μου εἶπον οὕτως ἐγώ⁴⁸, καὶ οὐχὶ⁴⁹ δι᾽ αὐτήν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/007.yaml
  text: But she did not know that I spoke thus because of my Lord, and not because of her.
translation:
  language: ko
  text: 그러나 그 여자는 내가 이렇게 말한 것이 내 주님 때문이지, 그녀 때문이 아니라는 것을 알지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριόν μου
  english_pob_choice: my Lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 나의 주님
  - 주님
  lexicon: κύριος
  rationale: 소유격 μου를 반영해 ‘내 주님’으로 옮기되, 예수에 대한 지칭으로 자연스러운 현대 한국어 경어를 유지했습니다.
- source_word: εἶπον οὕτως ἐγώ
  english_pob_choice: I spoke thus
  chosen_korean: 내가 이렇게 말한 것이
  alternatives_korean:
  - 내가 이렇게 말했다는 것
  - 내가 그처럼 말한 것
  lexicon: λέγω
  rationale: 행위 자체보다 발화의 방식과 이유를 드러내는 문맥이므로 ‘이렇게 말한 것’으로 간결하게 처리했습니다.
- source_word: δι᾽ αὐτήν
  english_pob_choice: because of her
  chosen_korean: 그녀 때문이 아니라
  alternatives_korean:
  - 그녀를 위해서가 아니라
  - 그녀 때문에가 아니라
  lexicon: διά
  rationale: 원문의 대조를 살려 ‘~때문이 아니라’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 주님 지칭의 존칭 처리
  chosen_reading: 내 주님
  alternative_readings:
  - 주님
  - 나의 주님
  rationale: 본문의 κύριός μου는 인물의 신적/권위적 주인을 가리키므로, 1인칭 소유를 반영하면서도 예수/주에 대한 경외를 흐리지 않는 표현을 택했습니다.
  doctrine_reference: 그리스도 호칭의 경어 및 인물 내러티브에서의 주님 지칭
- issue: 부정의 대조 구조
  chosen_reading: 내 주님 때문이지, 그녀 때문이 아니라는
  alternative_readings:
  - 내 주님 때문이고 그녀 때문이 아니라는
  - 주님을 위해서지 그녀를 위해서가 아니라는
  rationale: 원문의 διὰ ... καὶ οὐχὶ δι᾽ αὐτήν은 이유의 대비이므로, ‘~때문이지, ~때문이 아니라’로 대조를 분명히 했습니다.
  doctrine_reference: 서술 대조와 동기 진술의 보존
