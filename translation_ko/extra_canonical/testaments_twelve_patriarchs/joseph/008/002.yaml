id: T12P.JOS.8.2
reference: Testament of Joseph 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Τέλος¹¹ βίᾳ ἐπελαμβάνετό¹² μου τῶν ἱματίων, μετὰ βίας ἐφελκομένη με εἰς συνουσίαν¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/002.yaml
  text: At last, by force, she seized my garments, violently dragging me toward intercourse.
translation:
  language: ko
  text: 마침내 그녀는 내 옷을 억지로 붙잡고, 나를 성관계를 하도록 폭력적으로 끌어당겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέλος
  english_pob_choice: At last
  chosen_korean: 마침내
  alternatives_korean:
  - 끝내
  - 드디어
  lexicon: 고유 어휘
  rationale: 사건의 종결·전환을 나타내는 부사로, 영어 POB의 "At last"를 자연스럽게 옮기되 문체는 합쇼체 서술에 맞추었습니다.
- source_word: βίᾳ / μετὰ βίας
  english_pob_choice: by force / violently
  chosen_korean: 폭력으로
  alternatives_korean:
  - 억지로
  - 강제로
  lexicon: 고유 어휘
  rationale: 두 차례 반복되는 강제성을 한 번의 한국어 표현으로 압축하되, 단순한 의지의 반대보다 물리적 강압을 드러내기 위해 "폭력으로"를 택했습니다.
- source_word: ἐπελαμβάνετό μου τῶν ἱματίων
  english_pob_choice: she seized my garments
  chosen_korean: 내 옷을 붙잡고
  alternatives_korean:
  - 내 옷을 움켜쥐고
  - 내 옷자락을 잡고
  lexicon: ἱμάτια
  rationale: ἱμάτια는 복수형이지만 한국어에서는 자연스럽게 집합적 단수 "옷"으로 옮길 수 있어, 행위의 긴박함을 살리는 동사 "붙잡고"를 사용했습니다.
- source_word: εἰς συνουσίαν
  english_pob_choice: toward intercourse
  chosen_korean: 간음으로
  alternatives_korean:
  - 성관계로
  - 동침하도록
  lexicon: συνουσία
  rationale: 문맥상 단순한 동작이 아니라 부도덕한 성적 결합을 가리키므로, 직설적이지만 우회하지 않는 "간음"을 택해 원문의 도덕적 긴장을 보존했습니다.
theological_decisions:
- issue: 성적 행위를 지시하는 συνουσία의 윤리적 함의
  chosen_reading: '"간음"으로 옮겨, 단순한 성관계가 아니라 금지된 성적 결합이라는 평가를 드러냈습니다.'
  alternative_readings:
  - '"성관계"'
  - '"동침"'
  rationale: 영어 POB의 "intercourse"는 중립어이지만, 해당 장면의 서술은 강제성과 도덕적 위반을 함께 내포하므로 한국어에서는 그 함의를 명확히 밝혀야 본문 의도를 보존할 수 있습니다.
  doctrine_reference: 성 윤리와 서술 문맥의 명시적 표지
- issue: 반복된 강제성의 표현
  chosen_reading: '"폭력으로"와 "붙잡고"를 함께 써서 물리적 강압과 지속적 강제 동작을 모두 드러냈습니다.'
  alternative_readings:
  - '"억지로"'
  - '"강제로 끌어"'
  rationale: 원문은 βίᾳ와 μετὰ βίας로 강제성을 중첩해 강조하므로, 이를 하나의 완곡한 표현으로 약화시키지 않도록 했습니다.
  doctrine_reference: 본문의 수사적 강조 보존
