id: T12P.JOS.8.8
reference: Testament of Joseph 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν γάρ τις *ὑποπέσῃ πάθει⁵⁰ ἐπιθυμίας⁵¹ καὶ *δουλωθῇ αὐτῷ⁵² ὡς κἀκείνη, κἂν ἀγαθόν⁵³ τι ἀκούσῃ⁵⁴ εἰς *ἐκεῖνο τὸ⁵⁵ πάθος⁵⁶ *ἐκλαμβάνει αὐτὸ⁵⁷ πρὸς *τὴν πονηρὰν ἐπιθυμίαν⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/008.yaml
  text: For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he takes it in relation to that passion, toward his evil desire.
translation:
  language: ko
  text: 누구든지 욕망의 정념에 빠져 그것에 예속되면, 그 여자도 그러했듯이, 좋은 것을 듣더라도 그것을 그 정념과 관련지어 자기의 악한 욕망에 맞추어 해석합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθει ἐπιθυμίας
  english_pob_choice: passion of desire
  chosen_korean: 욕정의 정념
  alternatives_korean:
  - 욕망의 정념
  - 욕정의 열정
  - 욕심의 정념
  lexicon: πάθος / ἐπιθυμία
  rationale: 두 명사가 결합한 중첩 표현을 살려 단순히 ‘욕망’으로 평평하게 만들지 않고, 정념과 욕정의 긴장을 함께 드러냈습니다.
- source_word: δουλωθῇ αὐτῷ
  english_pob_choice: is enslaved to it
  chosen_korean: 그에게 사로잡히면
  alternatives_korean:
  - 그것에 종노릇하면
  - 그것에게 예속되면
  - 그것의 종이 되면
  lexicon: δουλόω
  rationale: 수동태의 강한 예속성을 드러내되, 현대 한국어에서 자연스럽게 읽히는 ‘사로잡히다’로 옮겨 영어 POB의 억압적 의미를 보존했습니다.
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  english_pob_choice: he takes it in relation to that passion, toward his evil desire
  chosen_korean: 그 사람은 그것을 그 정념에 비추어, 자기의 악한 욕정 쪽으로 받아들입니다
  alternatives_korean:
  - 그것을 그 정념으로 해석하여 악한 욕망으로 받아들입니다
  - 그것을 그 정념과 관련하여 악한 욕심으로 받아들입니다
  lexicon: ἐκλαμβάνω / πρὸς
  rationale: ἐκλαμβάνει의 ‘받아들이다/해석하다’와 πρὸς의 방향성을 함께 살려, 인식이 이미 왜곡된 정념 쪽으로 기운다는 뜻을 유지했습니다.
- source_word: κἀκείνη
  english_pob_choice: as she also was
  chosen_korean: 그녀도 그러했듯이
  alternatives_korean:
  - 그녀도 그러했듯
  - 그 여자도 그랬듯이
  lexicon: καὶ ἐκείνη
  rationale: 비교 대상인 여성 인물을 자연스럽게 지시하면서도, 본문의 비교 구조를 분명히 드러냈습니다.
theological_decisions:
- issue: 정념과 욕정의 반복적 연결
  chosen_reading: 본문의 도덕 심리학을 따라, 단순한 ‘욕망’이 아니라 ‘정념’과 ‘악한 욕정’의 반복을 유지했습니다.
  alternative_readings:
  - ‘욕망’ 하나로 통합해 간단히 번역
  - ‘정욕’으로 교회적 용어를 사용
  rationale: 이 문장은 감정-욕망-판단의 왜곡 과정을 강조하므로, 같은 어휘를 너무 일찍 평준화하면 저자의 경고 강도가 약해집니다.
  doctrine_reference: 성화와 내적 분별에 대한 경계
- issue: δουλόω의 예속성 표현
  chosen_reading: ‘사로잡히다’로 번역해 외적 강압보다 내적 지배의 상태를 드러냈습니다.
  alternative_readings:
  - ‘종이 되다’
  - ‘노예가 되다’
  rationale: 문맥은 신분 제도보다 정념의 지배력에 초점이 있으므로, 한국어에서 자연스럽게 예속 상태를 나타내는 표현을 선택했습니다.
  doctrine_reference: 죄와 욕정의 지배성
