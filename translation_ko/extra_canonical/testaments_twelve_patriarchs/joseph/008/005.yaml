id: T12P.JOS.8.5
reference: Testament of Joseph 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/005.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: ko
  text: 내가 쇠사슬에 매여 있는 동안, 그 이집트 여인은 슬픔에 붙들려 있었습니다. 그녀는 와서, 내가 어둠의 집에서 주님께 감사하고 찬송하며, 즐거운 목소리로 내 하나님을 찬양하고, 어떤 구실로 그 이집트 여인에게서 벗어나게 되었기 때문에 기뻐하는 것을 듣곤 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  english_pob_choice: in chains
  chosen_korean: 쇠사슬에 매여 있는 동안
  alternatives_korean:
  - 감옥에 있을 때
  - 결박 속에 있을 때
  lexicon: δεσμοί
  rationale: δεσμοί는 단순한 처소보다 구속 상태를 강조하므로, POB의 "in chains"를 따라 구속의 이미지를 드러냈습니다.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  english_pob_choice: was held together by grief
  chosen_korean: 슬픔에 붙들려 있었습니다
  alternatives_korean:
  - 슬픔에 사로잡혀 있었습니다
  - 슬픔으로 압박을 받고 있었습니다
  lexicon: συνέχω
  rationale: POB가 수정한 "held together by grief"를 반영해, 단순한 감정 상태보다 슬픔이 그녀를 붙들고 억누르는 뉘앙스를 살렸습니다.
- source_word: ἐπηκροᾶτό μου
  english_pob_choice: would listen in on me
  chosen_korean: 들었습니다
  alternatives_korean:
  - 엿들었습니다
  - 가만히 귀를 기울였습니다
  lexicon: ἐπακροάομαι
  rationale: 문맥상 몰래 듣는 동작이므로 한국어에서는 자연스럽게 "들었습니다"로 옮기되, 주석 없이도 엿듣는 행위를 충분히 암시합니다.
- source_word: ἐν οἴκῳ τοῦ σκότους
  english_pob_choice: in the house of darkness
  chosen_korean: 어두운 집에서
  alternatives_korean:
  - 어둠의 집에서
  - 흑암의 집에서
  lexicon: οἶκος / σκότος
  rationale: 직역성은 유지하되 한국어에서 가장 자연스러운 합성으로 풀어, 장소 표현이 주는 상징성을 과도하게 해석하지 않도록 했습니다.
- source_word: διὰ προφάσεως ἀπηλλάγην τῆς Αἰγυπτίας
  english_pob_choice: by a pretext I had been delivered from the Egyptian woman
  chosen_korean: 나는 어떤 구실로 그 이집트 여인에게서 풀려났기 때문입니다
  alternatives_korean:
  - 나는 핑계로 그 이집트 여인에게서 벗어났기 때문입니다
  - 나는 구실을 내세워 그 이집트 여인에게서 해방되었기 때문입니다
  lexicon: πρόφασις / ἀπαλλάσσω
  rationale: πρόφασις는 "pretext"의 위장된 구실을 뜻하므로 "어떤 구실"로, ἀπηλλάγην은 관계에서의 이탈을 살려 "풀려났다"로 옮겼습니다.
theological_decisions:
- issue: 주님/하나님 호칭의 배열
  chosen_reading: ἐν οἴκῳ τοῦ σκότους와 대조되도록, 감사와 찬송의 대상인 Κυρίῳ는 "주님"으로, δοξάζων τὸν Θεόν μου는 "내 하나님"으로 각각 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 "주님"으로 통일
  - 둘 다 "하나님"으로 완화
  rationale: 원문이 주님과 내 하나님을 서로 다른 호칭으로 병치하므로, 한국어에서도 그 구분을 유지하는 편이 의미 구조를 더 정확히 드러냅니다.
  doctrine_reference: 호칭 구분 보존
