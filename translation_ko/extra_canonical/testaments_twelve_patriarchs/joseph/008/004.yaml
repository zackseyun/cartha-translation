revisions:
- from: 그러나 그 여자는 내가 벌거벗은 틈을 타서 그것을 붙잡고 나를 중상하였고, 그녀의 남편이 와서는 나를 자기 집 감옥에 가두었으며, 다음 날에는 나를 채찍질한 뒤 파라오의 지하 감옥으로 보냈습니다.[a][b]
  to: 그러나 그 여자는 그것을 붙잡고 나를 중상하였으며, 그 여자의 남편이 와서 나를 그의 집 안에 있는 감옥에 가두었습니다. 그리고 다음 날, 그는 나를 채찍질한 뒤 파라오의 감옥으로 보냈습니다.
  rationale: 원문에 없는 벌거벗음과 지하라는 구체화를 제거했습니다. τοῦτον의 선행사는 이 절만으로 확정하지 않고 ‘그것’으로 보존했으며, 행위 주체와 시간 순서는 원문대로 유지했습니다. 내용 없는 각주 표지도 삭제했습니다.
