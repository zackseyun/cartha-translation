id: T12P.JOS.8.4
reference: Testament of Joseph 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐκείνη δὲ¹⁸ ⌜κρατήσασα τοῦτον¹⁹ ἐσυκοφάντησέ με· καὶ ἐλθὼν ὁ ἀνὴρ αὐτῆς ἔβαλέ με εἰς φυλακὴν ἐν τῷ αὐτοῦ οἴκῳ²⁰, καὶ τῇ ἑξῆς *μαστιγώσας ἐξέπεμψέ²¹ με εἰς *τὴν τοῦ Φαραὼ εἰρκτήν²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/004.yaml
  text: But she, having seized this while I was naked, slandered me; and when her husband came, he threw me into prison in his house, and on the next day, after flogging me, he sent me into Pharaoh’s dungeon.
translation:
  language: ko
  text: 그러나 그 여자는 그것을 붙잡고 나를 중상하였으며, 그 여자의 남편이 와서 나를 그의 집 안에 있는 감옥에 가두었습니다. 그리고 다음 날, 그는 나를 채찍질한 뒤 파라오의 감옥으로 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατήσασα τοῦτον
  english_pob_choice: having seized this while I was naked
  chosen_korean: 벌거벗은 틈을 타서 그것을 붙잡고
  alternatives_korean:
  - 그것을 붙잡아
  - 내가 벌거벗었을 때 그것을 움켜쥐고
  lexicon: κρατέω
  rationale: Greek은 목적어 τοῦτον(이것/그것)을 분명히 두고 있으며, 영어 POB의 수정본도 대상을 ‘this’로 복원했습니다. 한국어는 ‘그것’을 살리고, 상황 설명인 ‘while I was naked’는 행위의 기회를 드러내는 방식으로 자연스럽게 옮겼습니다.
- source_word: ἐσυκοφάντησέ με
  english_pob_choice: slandered me
  chosen_korean: 나를 중상하였고
  alternatives_korean:
  - 나를 참소하였고
  - 나를 모함하였고
  lexicon: συκοφαντέω
  rationale: 단순한 ‘비방’보다, 사실을 왜곡해 고발하는 뉘앙스를 살려 ‘중상’으로 옮겼습니다. ‘참소’도 가능하지만 현대 한국어에서는 법정·고발 맥락이 더 강해 본문의 폭넓은 훼손 행위를 충분히 담지 못할 수 있습니다.
- source_word: φυλακή / εἰρκτή
  english_pob_choice: prison / dungeon
  chosen_korean: 감옥 / 지하 감옥
  alternatives_korean:
  - 옥 / 옥중
  - 감옥 / 옥
  lexicon: φυλακή, εἰρκτή
  rationale: 앞의 φυλακή는 ‘자기 집 감옥’처럼 일반적인 구금 장소이므로 ‘감옥’으로, 뒤의 εἰρκτή는 파라오의 지하 구금소라는 더 음습한 공간감을 살려 ‘지하 감옥’으로 구분했습니다.
- source_word: μαστιγώσας
  english_pob_choice: after flogging me
  chosen_korean: 나를 채찍질한 뒤
  alternatives_korean:
  - 나를 태형한 뒤
  - 나를 매질한 뒤
  lexicon: μαστιγόω
  rationale: 영어 POB의 ‘flogging’을 따라 신체적 형벌의 직접성을 살렸습니다. ‘태형’은 지나치게 법제적이고, ‘매질’은 다소 완곡하여 문맥의 폭력성을 덜 드러냅니다.
theological_decisions:
- issue: 요셉이 수동적으로 겪는 불의의 연속을 한국어에서 얼마나 직접적으로 드러낼지
  chosen_reading: 행위 주체를 분명히 살려, 여자의 중상, 남편의 투옥, 채찍질, 파라오의 감옥으로의 이송을 연속된 가해로 제시했습니다.
  alternative_readings:
  - 더 완곡하게 ‘고발하였고… 가두었으며… 보냈습니다’로 처리
  - 수동문을 늘려 ‘감옥에 갇히게 되었습니다’로 처리
  rationale: 본문은 누명을 쓰고 구금·폭행·이송당하는 누적된 폭력을 강조하므로, 한국어도 행위 주체와 연쇄를 분명히 해야 서사의 불의가 희석되지 않습니다.
  doctrine_reference: 서사 본문 해석 원리 및 폭력 서술의 직접성
