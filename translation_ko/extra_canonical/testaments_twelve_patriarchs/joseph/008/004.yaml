  terminology: συκοφαντέω의 ‘중상하다’, μαστιγόω의 ‘채찍질하다’, φυλακή/εἰρκτή의 ‘감옥’은 적절합니다. 두 감옥 명사를 서로 다른 시설 유형으로 단정할 근거는 부족하므로 ‘지하 감옥’은 제거합니다.
