id: T12P.JOS.8.1
reference: Testament of Joseph 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Λέγω οὖν¹, τέκνα μου², ὅτι ὥρα *ἦν ὡσεὶ³ ἕκτη ὅτε³ ἐξῆλθεν ἀπ᾽ ἐμοῦ⁴. *Καὶ κλίνας γόνυ⁵ πρὸς Κύριον ὅλην τὴν ἡμέραν καὶ ὅλην τὴν νύκτα⁶, πρὸς⁷ ὄρθρον ἀνέστην, δακρύων⁸ καὶ αἰτῶν⁹ λύτρωσιν *ἐξ αὐτῆς¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/001.yaml
  text: So I say to you, my children, that it was about the sixth hour when she left me. And after bending my knee to the Lord all day and all night, toward dawn I rose, weeping and asking for deliverance from her.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 내가 너희에게 말합니다. 그녀가 내게서 떠났을 때는 대략 여섯째 시쯤이었습니다. 나는 주님께 무릎을 꿇고 온종일과 밤새도록 지낸 뒤, 새벽 무렵에 일어나 눈물을 흘리며 그녀에게서 건져 달라고 간구했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들
  alternatives_korean:
  - 내 아이들
  - 내 자녀 여러분
  lexicon: τέκνα
  rationale: 직접 호칭의 친밀함을 살리면서도 문어체 합쇼체에 맞게 ‘자녀들’로 옮겼습니다. ‘아이들’은 지나치게 구어적이고, ‘여러분’은 원문에 없는 공적 뉘앙스를 더합니다.
- source_word: ὡσεὶ ἕκτη
  english_pob_choice: about the sixth hour
  chosen_korean: 거의 여섯 시
  alternatives_korean:
  - 대략 여섯 시쯤
  - 여섯 시쯤
  lexicon: ὥρα / ἕκτη
  rationale: 원문의 시간 표현을 현대 독자가 이해할 수 있게 ‘여섯 시’로 자연화하되, ὡσεὶ의 ‘대략’ 뉘앙스는 ‘거의’로 유지했습니다.
- source_word: κλίνας γόνυ πρὸς Κύριον
  english_pob_choice: after bending my knee to the Lord
  chosen_korean: 주님께 무릎을 굽힌 채
  alternatives_korean:
  - 주님께 무릎을 꿇고
  - 주님께 무릎을 굽힌 뒤
  lexicon: κλίνω γόνυ
  rationale: 무릎을 굽히는 행위를 그대로 살리되, 한국어에서 자연스러운 관용을 고려해 ‘무릎을 꿇다’ 대신 직역적 표현을 유지했습니다. ‘채’는 지속된 기도의 태도를 보존합니다.
- source_word: λύτρωσιν ἐξ αὐτῆς
  english_pob_choice: deliverance from her
  chosen_korean: 그녀에게서 구출해 달라고
  alternatives_korean:
  - 그녀에게서 벗어나게 해 달라고
  - 그녀로부터 구원해 달라고
  lexicon: λύτρωσις
  rationale: λύτρωσις의 해방·구출 의미를 따라 ‘구출’로 옮겼습니다. 여기서는 죄책이나 종말론적 ‘구원’보다 구체적 탈출/해방의 요청이 앞서므로 ‘구원’보다 직접적입니다.
theological_decisions:
- issue: Κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 문맥의 Κύριος는 기도 대상의 호칭으로 기능하므로 한국어 예배 언어에서 자연스러운 ‘주님’을 택했습니다. 본문이 명시적으로 YHWH 인용을 표지하지 않으므로 ‘야훼’로 치환하지 않았습니다.
  doctrine_reference: 호칭 사용과 기도 문맥의 담화 기능
