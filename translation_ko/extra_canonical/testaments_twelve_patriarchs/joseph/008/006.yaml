  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ λέγει³⁷ πρὸς με· *Ἰδοὺ οὖν³⁸ ἀγαπᾷς με· *τοῦτό μοι ἀρκεῖτω· μόνον ἀντιποιῆσαι³⁹ *τῆς ζωῆς μου⁴⁰ ⌜καὶ *τῶν τέκνων⁴¹ μου, *καὶ ἔχω⁴² προσδοκίαν ἀπολαῦσαι⁴³ ⌜καὶ⁴⁴ τῆς ἐπιθυμίας μου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/006.yaml
  text: 'And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.”'
translation:
  language: ko
  text: 그리고 그가 내게 말했습니다. “보라, 이제 네가 나를 사랑하는구나. 이것이면 나에게 충분합니다. 다만 내 생명과 내 자녀들을 돌보아 주십시오. 그러면 나도 내 소망을 얻을 희망이 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ λέγει πρὸς με
  english_pob_choice: And she said to me
  chosen_korean: 그리고 그가 내게 말했습니다
  alternatives_korean:
  - 그리고 그녀가 내게 말했습니다
  - 그리고 그가 나에게 말하였습니다
  lexicon: λέγω
  rationale: 그리스어 원문과 최신 영어 수정본을 따라 화자를 남성으로 바로잡고, 서술 동사를 자연스러운 현대 서사체로 옮겼습니다.
- source_word: Ἰδοὺ οὖν
  english_pob_choice: See then
  chosen_korean: 보라, 이제
  alternatives_korean:
  - 그러니 보라
  - 이제 보십시오
  lexicon: ἰδού
  rationale: 호소적 감탄을 한국어의 ‘보라’로 옮기되, οὖν의 연결성을 살려 ‘이제’를 덧붙였습니다.
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  english_pob_choice: only take thought for my life and for my children
  chosen_korean: 내 생명과 내 자녀들을 돌보아 주십시오
  alternatives_korean:
  - 내 생명과 내 자녀들을 생각해 주십시오
  - 내 생명과 내 자녀들을 책임져 주십시오
  lexicon: ἀντιποιέομαι
  rationale: 단순한 ‘생각하다’보다 보호와 배려의 요구가 더 분명하여, 문맥에 맞게 ‘돌보다’로 옮겼습니다.
- source_word: προσδοκίαν ἀπολαῦσαι … τῆς ἐπιθυμίας μου
  english_pob_choice: I have hope that I shall also obtain my desire
  chosen_korean: 나도 내 소망을 얻을 희망이 있습니다
  alternatives_korean:
  - 나도 내 바람을 누릴 희망이 있습니다
  - 나도 내가 원하는 것을 얻을 기대가 있습니다
  lexicon: προσδοκία / ἐπιθυμία
  rationale: ‘hope’와 ‘desire’의 이중 구조를 유지하되, 한국어에서는 지나치게 직역된 어색함을 피하면서도 ‘소망’과 ‘희망’의 구분을 살렸습니다.
theological_decisions:
- issue: 화자의 성별과 발화 재현
  chosen_reading: 원문과 개정본을 따라 화자를 남성으로 두고 직접화법을 그대로 살렸습니다.
  alternative_readings:
  - 전통 번역처럼 여성 화자로 두는 읽기
  - 간접화법으로 완화하는 번역
  rationale: 그리스어 동사와 대명사 관계가 남성 화자를 가리키므로, 이를 반영하지 않으면 본문의 서사 관계가 왜곡됩니다.
  doctrine_reference: 본문 비평 및 문법적 일치성
