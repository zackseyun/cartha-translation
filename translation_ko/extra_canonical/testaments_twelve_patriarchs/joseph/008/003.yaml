  text: Ὡς ⌜οὖν⌉¹⁴ εἶδον¹⁵ ὅτι μαινομένη¹⁶ κρατεῖ μου τὸν χιτῶνα, καταλείψας αὐτὸν [καὶ ἐκτιναξάμενος] ἔφυγον γυμνός¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/003.yaml
  text: Therefore, when I saw that she, in her frenzy, was seizing my tunic, leaving it [and shaking it off], I fled naked.
translation:
  language: ko
  text: 그러므로 내가 그녀가 광분한 채 내 옷을 붙들고 있는 것을 보았을 때, 나는 그것을 남겨 두고 [그것을 떨쳐 내고] 벌거벗은 채 달아났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς ⌜οὖν⌉ / Therefore
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 그러니
  lexicon: logical connector
  rationale: 앞 문맥의 결과를 이끄는 접속을 한국어의 자연스러운 결론 표지인 ‘그러므로’로 옮겨, 원문의 논리 흐름을 분명히 했습니다.
- source_word: μαινομένη
  english_pob_choice: in her frenzy
  chosen_korean: 광분하여
  alternatives_korean:
  - 미쳐서
  - 격분하여
  lexicon: μαινομαι
  rationale: 단순 감정 격앙보다 통제되지 않은 정신적 격동을 나타내므로, 원문의 강도를 살린 ‘광분하여’를 택했습니다.
- source_word: κρατεῖ μου τὸν χιτῶνα
  english_pob_choice: was seizing my tunic
  chosen_korean: 내 속옷을 붙들고 있는
  alternatives_korean:
  - 내 속옷을 잡고 있는
  - 내 튜닉을 움켜쥐고 있는
  lexicon: χιτών
  rationale: χιτών은 고대 의복이지만 한국어 독자에게 의미가 곧바로 전달되도록 ‘속옷’으로 풀어, 문맥상 붙들린 옷의 성격을 드러냈습니다.
- source_word: γυμνός
  english_pob_choice: naked
  chosen_korean: 나체로
  alternatives_korean:
  - 벌거벗은 채로
  - 알몸으로
  lexicon: γυμνός
  rationale: 서술적 종결을 자연스럽게 유지하면서, 노출 상태를 직접적으로 전달하는 표준어 표현으로 ‘나체로’를 사용했습니다.
theological_decisions:
- issue: 서사적 노출 표현의 강도
  chosen_reading: 원문의 수치스러운 탈출 장면을 완화하지 않고 그대로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - ‘벌거벗은 채 달아났습니다’처럼 완곡하게 처리
  - 의미를 약화시켜 단순히 ‘옷을 잃고 달아났습니다’로 처리
  rationale: 이 구절은 인물의 도덕적 시험과 수치의 극대화를 보여 주므로, 독자가 장면의 충격을 인지할 수 있도록 노골성을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 서사 본문의 정직한 재현 원칙
