  source_fidelity: 초안은 문장의 기본 의미를 충실히 옮겼으나, 그리스어 본문에서 대괄호로 제시된 καὶ ἐκτιναξάμενος(‘[떨쳐 내고]’)를 누락했습니다. 또한 χιτών을 ‘속옷’으로 특정하면 고대 의복 명칭의 범위를 지나치게 좁힐 수 있으므로 중립적인 ‘옷’이 안전합니다.
  naturalness: ‘광분한 채’, ‘붙들고 있는 것을 보았을 때’, ‘벌거벗은 채 달아났습니다’는 현대 표준 한국어의 격식 있는 서사체로 자연스럽습니다. 대괄호 안의 보충 구절은 원문의 본문 비평적 표기를 보존합니다.
  terminology: χιτών은 여기서 특정 현대 의복인 ‘속옷’보다 ‘옷’으로 옮기는 편이 적절합니다. γυμνός는 장면의 노출을 약화하지 않는 ‘벌거벗은 채’로 번역했습니다.
