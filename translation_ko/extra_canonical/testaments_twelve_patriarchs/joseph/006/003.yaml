  to: 그리고 그가 나간 뒤, 나는 그 음식도 그녀의 다른 어떤 음식도 맛보지 않은 채 울고 있었습니다.
  rationale: 원문에 없는 ‘먹지 않았다’를 삭제하고, μὴ γευσάμενος의 의미를 ‘맛보지 않은 채’로 한정했습니다. μήτε … μήτε의 부정 병렬과 ἔκλαιον의 미완료적 뉘앙스를 보존했습니다.
