source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ⸀ἐξελθόντος αὐτοῦ¹²⸀ *ἔκλαιον¹³, *μὴ γευσάμενος μήτε ἐκείνου μήτε ἄλλου τῶν ἐδεσμάτων αὐτῆς¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/003.yaml
  text: And after he had gone out, I ate neither that food nor any of her other foods, but wept, not having tasted them.
translation:
  language: ko
  text: 그리고 그가 나간 뒤, 나는 그 음식도 그녀의 다른 어떤 음식도 맛보지 않은 채 울고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리하여
  lexicon: καί
  rationale: 문두 연결사 Καὶ를 자연스러운 접속사 ‘그리고’로 옮겨 서술의 흐름을 그대로 살렸습니다.
- source_word: ἐξελθόντος αὐτοῦ
  english_pob_choice: after he had gone out
  chosen_korean: 그가 나간 뒤에
  alternatives_korean:
  - 그가 나가고 나서
  - 그가 나간 후에
  lexicon: ἐξέρχομαι
  rationale: 분사구를 시간 선행 관계로 풀어, 원문의 사건 순서를 분명하게 한국어로 표현했습니다.
- source_word: μὴ γευσάμενος
  english_pob_choice: not having tasted
  chosen_korean: 맛보지도 않은 채
  alternatives_korean:
  - 맛보지 않은 채
  - 한 번도 맛보지 않고
  lexicon: γεύομαι
  rationale: 부정 분사 μὴ γευσάμενος의 상태적 의미를 한국어 관용구 ‘-지도 않은 채’로 자연스럽게 옮겼습니다.
- source_word: μήτε ἐκείνου μήτε ἄλλου τῶν ἐδεσμάτων αὐτῆς
  english_pob_choice: neither that food nor any of her other foods
  chosen_korean: 그 음식도 그녀의 다른 어떤 음식도
  alternatives_korean:
  - 그 음식도 다른 어떤 음식도
  - 그것도 그녀의 다른 음식도
  lexicon: ἐκεῖνος / ἄλλος / ἐδέσματα
  rationale: ἐκείνου의 지시적 대비를 ‘그 음식’으로, ἄλλου τῶν ἐδεσμάτων αὐτῆς의 확장된 범위를 ‘그녀의 다른 어떤 음식’으로 살려 영어 POB의 구분을 반영했습니다.
theological_decisions:
- issue: 감정·행동의 병렬 표현
  chosen_reading: ‘먹지 않았고, 맛보지도 않은 채 울었습니다’로 두 행동을 병렬로 살렸습니다.
  alternative_readings:
  - ‘먹지 않고 울었습니다’
  - ‘먹지 않았고 울었습니다’
  rationale: 원문은 음식 섭취의 거절과 울음이 함께 제시되므로, ‘울었습니다’ 앞에 분사구를 둬서 금식/절제의 상태를 분명히 드러냈습니다.
  doctrine_reference: 서사적 진술의 문법적 병렬 유지
