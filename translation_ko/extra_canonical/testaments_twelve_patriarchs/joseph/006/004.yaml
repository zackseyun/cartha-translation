  text: Then after one day she came to me, and when she noticed the food, she said to me, “Why is it that you did not eat the food?”
translation:
  language: ko
  text: 그런데 하루가 지난 뒤에 그 여인이 내게 와서, 먹을 것을 보고는 내게 말하였습니다. “어찌하여 그 음식을 먹지 않았습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ μίαν ἡμέραν
  english_pob_choice: Then after one day
  chosen_korean: 그런데 하루가 지난 뒤에
  alternatives_korean:
  - 그리고 하루 뒤에
  - 하루 후에
  lexicon: μετά + 시간표현
  rationale: 시간 경과를 자연스러운 현대 한국어로 옮기되, 이야기 전개를 이어 주는 μετα δὲ의 전환감을 ‘그런데’로 살렸습니다.
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  english_pob_choice: when she noticed the food
  chosen_korean: 먹을 것을 보고는
  alternatives_korean:
  - 그 음식을 알아보고는
  - 그 음식을 알아차리고는
  lexicon: ἐπιγινώσκω
  rationale: POB의 ‘noticed’에 맞춰 시각적 인지의 뉘앙스를 살리되, 이 문맥에서는 ‘보고는’이 가장 자연스럽고 간결합니다.
- source_word: Τί τοῦτο ὅτι οὐκ ἔφαγες τοῦ βρώματος;
  english_pob_choice: Why is it that you did not eat the food?
  chosen_korean: 어찌하여 그 음식을 먹지 않았습니까?
  alternatives_korean:
  - 왜 음식을 먹지 않았습니까?
  - 어찌하여 음식을 먹지 않았습니까?
  lexicon: τί τοῦτο ὅτι + 부정 과거
  rationale: 그리스어의 질문 전체를 한국어의 직접 질문으로 옮기되, 반복된 βρῶμα는 앞서 나온 ‘먹을 것’을 ‘그 음식’으로 받아 자연스럽게 연결했습니다.
