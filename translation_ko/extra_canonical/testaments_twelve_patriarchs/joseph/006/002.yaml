language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὡς δὲ⁴ ἦλθεν ὁ⁵ εὐνοῦχος ὁ κομίζων αὐτό⁶, *ἀνέβλεψα καὶ⁷ εἶδον *φοβερὸν ἄνδρα⁸ ἐπιδιδόντα μοι *μετὰ τοῦ τρυβλίου⁹ μάχαιραν· καὶ συνῆκα ὅτι¹⁰ *περιέργεια ἐστὶν εἰς ἀποπλάνησίν μου¹¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/002.yaml
  text: But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me a sword with the dish; and I understood that it was a scheme to lead me astray.
translation:
  language: ko
  text: 그러나 내시가 그것을 가져오는 가운데 오자 내가 고개를 들어 보니, 무서운 한 사람이 칼을 접시와 함께 내게 건네고 있었습니다. 나는 그것이 나를 미혹하려는 술책임을 알았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  english_pob_choice: the eunuch
  chosen_korean: 내시
  alternatives_korean:
  - 환관
  lexicon: εὐνοῦχος
  rationale: 한국어에서 역사적 관직·궁정 인물을 가리킬 때 ‘내시’가 가장 자연스럽고, 본문도 단순한 생물학적 표현보다 궁정 신분을 가리킵니다.
- source_word: ἀνέβλεψα
  english_pob_choice: I looked up
  chosen_korean: 고개를 들어 보니
  alternatives_korean:
  - 올려다보니
  - 쳐다보니
  lexicon: ἀναβλέπω
  rationale: ‘고개를 들어 보니’는 시각 동작과 장면 전환을 자연스럽게 살리면서도 원문의 순간적 관찰을 잘 드러냅니다.
- source_word: φοβερὸν ἄνδρα
  english_pob_choice: a terrifying man
  chosen_korean: 무서운 한 사람
  alternatives_korean:
  - 두려운 사람
  - 무시무시한 사람
  lexicon: φοβερός / ἀνήρ
  rationale: 형용사의 강한 공포감을 살리되 과도하게 장식하지 않기 위해 ‘무서운’으로 옮겼고, ἀνήρ는 여기서 특정 남자를 뜻하는 ‘한 사람’으로 처리했습니다.
- source_word: μετὰ τοῦ τρυβλίου μάχαιραν
  english_pob_choice: a sword with the dish
  chosen_korean: 칼을 접시와 함께
  alternatives_korean:
  - 접시와 함께 칼을
  - 접시 곁에 칼을
  lexicon: μετά + genitive / τρυβλίον / μάχαιρα
  rationale: 영어 audit trail이 보존한 어순처럼, ‘접시와 함께’라는 결합 관계를 유지해 칼이 접시와 같이 제시되었다는 점을 드러냈습니다.
- source_word: περιέργεια
  english_pob_choice: a scheme
  chosen_korean: 술책
  alternatives_korean:
  - 계략
  - 음모
  - 수작
  lexicon: περιέργεια
  rationale: 문맥상 단순한 ‘호기심’이 아니라 기만적 의도를 띤 꾸밈새를 뜻하므로, 의미를 살려 ‘술책’으로 옮겼습니다.
theological_decisions:
- issue: ἀποπλάνησίν μου의 의미
  chosen_reading: ‘나를 미혹하려는’으로, 단순한 길 잃음이 아니라 의도적인 유혹·오도 의미를 살렸습니다.
  alternative_readings:
  - 나를 잘못된 길로 이끌려는
  - 나를 속여 넘어뜨리려는
  rationale: 헬라어 ἀποπλάνησις는 오도와 유혹을 포함하는 표현이므로, 본문이 제시하는 도덕적·영적 함의를 유지해야 합니다.
  doctrine_reference: Source semantics / moral deception
