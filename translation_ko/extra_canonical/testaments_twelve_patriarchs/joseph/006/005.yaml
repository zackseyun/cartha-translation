    issue: The direct quotation combines the informal pronoun ‘너는’ with the formal-polite verb ending ‘-습니다.’
    rationale: This is an unstable speech-level combination in modern standard Korean. Replacing it with ‘당신은’ gives a consistent 합쇼체 rendering without changing the interpersonal force substantially.
