review_pass:
  verdict: revise
  source_fidelity: 'The translation accurately represents the main Greek clauses: Joseph speaks to the woman, accuses her of filling an unspecified object with ‘sorcery of death,’ and challenges her stated avoidance of idols and approach to the Lord alone. ‘그것을’ properly retains the source’s unspecified αὐτό. The rhetorical force of πῶς εἶπας is well conveyed by ‘어떻게 … 말할 수 있습니까?’'
  naturalness: The draft is generally natural, but the direct address ‘너는’ followed by the deferential ending ‘채웠습니다’ mixes speech levels awkwardly. ‘당신은 … 채웠습니다’ maintains a consistent modern formal-polite register in this accusatory direct speech.
  terminology: ‘죽음의 주술’ is a suitably literal rendering of γοητείας θανάτου and preserves the source’s somewhat stark, potentially ambiguous genitival expression. ‘우상들’ and ‘주님’ are natural and appropriate for εἰδώλοις and Κυρίῳ. ‘가까이 가다’ adequately reflects προσεγγίζω without interpretively expanding it to worship or service.
  issues:
