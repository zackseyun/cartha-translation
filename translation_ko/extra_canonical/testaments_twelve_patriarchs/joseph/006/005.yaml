base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/005.yaml
  text: And I said to her, “You have filled it with the sorcery of death. And how could you say, ‘I do not draw near to idols, but to the Lord alone’?”
translation:
  language: ko
  text: 그리고 나는 그녀에게 말했습니다. “당신은 그것을 죽음의 주술로 가득 채웠습니다. 그런데 어떻게 ‘나는 우상들에게는 가까이 가지 않고 오직 주님께만 가까이 간다’고 말할 수 있습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπλήρωσας αὐτὸ ⸀γοητείας⸀ θανάτου
  english_pob_choice: You have filled it with the sorcery of death
  chosen_korean: “너는 그것을 죽음의 주술로 가득 채웠습니다”
  alternatives_korean:
  - “너는 그것을 죽음의 마법으로 가득 채웠습니다”
  - “너는 그것을 죽음에 이르는 주술로 가득 채웠습니다”
  lexicon: γοητεία
  rationale: γοητεία는 단순한 '마법'보다 속임수와 주술성을 띠는 표현이어서, POB의 'sorcery'에 맞춰 '주술'로 옮겼고, θανάτου는 수식적 결합을 살려 '죽음의'로 처리했습니다.
- source_word: πῶς εἶπας
  english_pob_choice: how could you say
  chosen_korean: “어떻게 … 말할 수 있습니까?”
  alternatives_korean:
  - “어떻게 … 말했습니까?”
  - “어찌 … 말할 수 있습니까?”
  lexicon: πῶς + εἶπας
  rationale: 직역의 과거형보다 문맥상 질책과 놀람이 드러나는 '어떻게 … 말할 수 있습니까'가 POB의 'how could you say'를 자연스럽게 반영합니다.
- source_word: τοῖς εἰδώλοις ... τῷ Κυρίῳ μόνῳ
  english_pob_choice: to idols, but to the Lord alone
  chosen_korean: “우상들에게는 가까이 가지 않고 오직 주님께만 가까이 간다”
  alternatives_korean:
  - “우상들에게는 다가가지 않고 오직 주님께만 다가간다”
  - “우상들에게는 가까이하지 않고 오직 주님만 섬긴다”
  lexicon: προσεγγίζω + εἴδωλον + Κύριος
  rationale: προσεγγίζω는 단순한 접촉보다 '가까이 가다/다가가다'의 의미가 핵심이라 그대로 살렸고, εἴδωλα는 '우상들'로, Κύριος는 관용적으로 '주님'으로 옮겼습니다.
theological_decisions:
- issue: Κύριος의 번역
  chosen_reading: 이 구절의 κύριος는 본문 내부의 경건 고백 대상이므로 '주님'으로 번역했습니다.
  alternative_readings:
  - '''주'''
  - '''주(主)'''
  rationale: 서술 문맥에서 인물의 신앙 고백을 자연스럽게 드러내는 한국어 관용을 따르되, 본문이 가리키는 존칭성을 유지하기 위해 '주님'을 선택했습니다.
  doctrine_reference: 신앙 고백의 호칭 번역 관례
