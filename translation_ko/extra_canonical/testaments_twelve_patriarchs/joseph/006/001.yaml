  text: 그 후에 그녀는 나에게 주술이 섞인 음식을 보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 보냅니다
  - 보내었습니다
  lexicon: ἀποστέλλω
  rationale: 서술형 과거로 자연스럽게 옮기되, 원문의 단순 서술을 유지했습니다.
- source_word: βρῶμα
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 먹을 것
  - 양식
  lexicon: βρῶμα
  rationale: 일반적인 ‘음식’이 가장 직접적으로 원문을 반영합니다.
- source_word: ἐν γοητείᾳ
  english_pob_choice: mixed with sorcery
  chosen_korean: 마술이 섞인
  alternatives_korean:
  - 주술이 섞인
  - 마법이 섞인
  lexicon: γοητεία
  rationale: POB의 ‘sorcery’를 한국어에서 비교적 सीधे하게 전달하기 위해 ‘마술’을 택했습니다. 이 용어는 문맥상 부정적·주술적 의미를 띱니다.
- source_word: πεφυρμένον
  english_pob_choice: mixed
  chosen_korean: 섞인
  alternatives_korean:
  - 뒤섞인
  - 혼합된
  lexicon: πεφυραμένος
  rationale: 분사형의 상태를 간결하게 살려, 음식이 어떤 성질로 조합되었는지를 드러냈습니다.
theological_decisions:
- issue: γοητείᾳ의 한국어 종교적 뉘앙스
  chosen_reading: ‘마술’로 옮겨 본문의 해로운 주술성은 유지하되, 현대 한국어에서 이해 가능한 표현으로 처리했습니다.
  alternative_readings:
  - ‘주술’로 옮겨 더 학술적으로 표현하는 방법
  rationale: 이 구절은 윤리적/서사적 맥락상 음식을 통한 마술적 조작을 말하므로, 독자가 즉시 그 위험성을 파악하도록 했습니다.
  doctrine_reference: 주술·마술 행위에 대한 성서적 경계 표현
