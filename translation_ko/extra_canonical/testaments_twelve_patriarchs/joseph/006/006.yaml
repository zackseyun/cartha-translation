    text: 그리스어의 ‘그것’은 중성 대명사이며, 이 구절만으로는 그 선행사를 확정하기 어렵습니다. 따라서 번역에서도 특정 대상을 보충하지 않았습니다.
    reason: αὐτό의 선행사가 제공된 발췌문에서 명확하지 않으므로, 본문은 모호성을 보존하고 각주로 이를 설명합니다.
  revision_rationale: The revision improves modern Korean syntax, distinguishes the two Greek pronominal expressions, and renders ἔλεγχος without over-legalizing it. It retains the source’s uncertain referent rather than adopting the English audit trail’s unsupported masculine “him” or supplying a specific object.
