  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Νῦν οὖν γνῶθι³⁴, ὅτι ὁ³⁵ Θεὸς *τοῦ πατρός³⁶ μου *δι’ ἀγγέλου αὐτοῦ³⁷ ἀπεκάλυψέ³⁸ μοι τὴν κακίαν σου³⁹, καὶ *ἐν τούτῳ ἐφύλαξα⁴⁰ αὐτὸ⁴¹ εἰς ἔλεγχόν σου, *εἴπως ἄρα⁴² ἰδοῦσα⁴³ μετανοήσεις⁴⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/006.yaml
  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
translation:
  language: ko
  text: 지금 그러므로 알게 되십시오. 내 아버지의 하나님께서 그의 천사를 통해 당신의 악행을 내게 드러내셨습니다. 나는 이것으로 당신의 유죄를 입증하기 위해 그것을 보존해 두었으니, 아마도 당신이 그것을 보고 회개할까 함입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τοῦ πατρός μου
  english_pob_choice: the God of my father
  chosen_korean: 내 아버지의 하나님
  alternatives_korean:
  - 우리 아버지의 하나님
  - 아버지의 하나님
  lexicon: Θεός
  rationale: 족장적 소유 표현을 살리면서도 한국어에서 자연스러운 신앙 표제로 옮겼습니다. '우리 아버지'는 공동체적 뉘앙스를 더하고, 단순히 '아버지의 하나님'은 다소 압축적입니다.
- source_word: δι’ ἀγγέλου αὐτοῦ
  english_pob_choice: through his angel
  chosen_korean: 그의 천사를 통해
  alternatives_korean:
  - 그 천사를 통해
  - 천사를 통하여
  lexicon: ἄγγελος
  rationale: 매개 수단을 드러내는 δι’의 의미를 살려 '통해'로 옮겼고, 소유 대명사는 원문의 관계를 분명히 하기 위해 살렸습니다.
- source_word: ἀπεκάλυψέ μοι τὴν κακίαν σου
  english_pob_choice: revealed your wickedness to me
  chosen_korean: 당신의 악행을 내게 드러내셨습니다
  alternatives_korean:
  - 당신의 악을 내게 나타내셨습니다
  - 당신의 악함을 내게 밝혀주셨습니다
  lexicon: κακία
  rationale: κακία는 단순한 성향보다 실제 악행/악한 행위를 가리키는 문맥이므로, 도덕적 추상어보다 구체적 행위성을 살린 '악행'이 적절합니다.
- source_word: ἐφύλαξα αὐτὸ εἰς ἔλεγχόν σου
  english_pob_choice: I preserved it for your conviction
  chosen_korean: 당신의 유죄를 입증하기 위해 그것을 보존해 두었으니
  alternatives_korean:
  - 당신을 책망하기 위해 그것을 간직해 두었으니
  - 당신의 책망거리가 되게 하려고 그것을 지켜 두었으니
  lexicon: ἐφύλαξα / ἔλεγχος
  rationale: POB의 수정판이 반영한 대로 ἔλεγχος를 '책망'보다 법적·논쟁적 의미가 분명한 '입증/유죄' 계열로 옮겼습니다. '보존해 두었습니다'는 ἐφύλαξα의 보관·유지 의미를 살립니다.
- source_word: ἰδοῦσα μετανοήσεις
  english_pob_choice: seeing it, you might repent
  chosen_korean: 당신이 그것을 보고 회개할까 함입니다
  alternatives_korean:
  - 보면 회개할지도 모른다고 생각했습니다
  - 그것을 보시고 돌이키실까 하였습니다
  lexicon: μετανοέω
  rationale: 직접적인 결과 가능성을 드러내는 조건적 표현을 살려, 한국어에서 자연스러운 목적/희망 표현으로 옮겼습니다. '회개'는 도덕적 전환의 종교적 의미를 보존합니다.
theological_decisions:
- issue: 하나님의 계시가 인간 중재자(천사)를 통해 전달되는 구조
  chosen_reading: 하나님께서 천사를 통한 간접 계시로 죄를 드러내시는 것으로 번역했습니다.
  alternative_readings:
  - 천사가 직접 드러낸 것으로 번역
  - 하나님이 직접 드러내셨다고 완화
  rationale: 원문은 δι’ ἀγγέλου αὐτοῦ를 분명히 갖고 있어 계시의 매개성을 지워서는 안 됩니다. 동시에 계시의 주체는 하나님이므로 주어를 보존했습니다.
  doctrine_reference: 계시론
