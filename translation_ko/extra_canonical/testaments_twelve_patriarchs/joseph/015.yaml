  text: '4. For she wanted to see me in the desire of sin, but I was ignorant in all these things.


    5. And I said to her, “This is not the custom among the Egyptians, to take what belongs to another before proof is given.”


    6. So I said this concerning the exchange. But the boy ought to be kept shut up.


    1. And after twenty-four days the Ishmaelites came, for they had heard that Jacob my father was mourning greatly for me. And when they came they said to me,


    2. “Why did you say that you were a slave? For look, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”


    3. When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a slave.”


    4. Then they took counsel to sell me, so that I might not be found in their hands.


    5. For they feared my father, lest he come against them and execute dangerous vengeance on them; for they had heard that he was great before God and men.


    6. Then the trader said to them, “Release me from the judgment of Potiphar.”


    7. So they came near and asked me, saying, “Say that you were bought by us for silver, and he will release us.”'
translation:
  language: ko
  text: '4. 그는 죄의 욕망 가운데서 나를 보고 싶어 했지만, 나는 이 모든 일에 대해 알지 못했습니다.


    5. 나는 그녀에게 말했습니다. “증거가 제시되기 전에 남의 것을 빼앗는 일은 이집트 사람들 사이의 관습이 아닙니다.”


    6. 그래서 나는 이 말을 교환에 관해 한 것입니다. 그러나 소년은 갇혀 있어야 합니다.


    1. 그리고 스물네 날이 지나 이스마엘 사람들이 왔습니다. 그들은 야곱 내 아버지가 나 때문에 크게 슬퍼하고 있다는 소식을 들었기 때문입니다. 그들이 와서 내게 말했습니다.


    2. “왜 스스로 노예라고 말했습니까? 보십시오, 우리는 당신이 가나안 땅의 큰 사람의 아들이며, 당신의 아버지가 아직도 베옷과 재 가운데서 당신을 위해 슬퍼하고 있다는 것을 알게 되었습니다.”


    3. 내가 이 말을 듣자 내 속이 찢어지고 내 마음이 녹아내렸으며, 나는 몹시 울고 싶었습니다. 그러나 나는 형제들에게 수치를 안기지 않으려고 스스로를 억눌렀습니다. 그리고 그들에게 말했습니다. “나는 알지 못합니다. 나는 종입니다.”


    4. 그러자 그들은 나를 팔기로 상의하여, 내가 그들의 손에 붙잡히지 않게 하였습니다.


    5. 그들은 내 아버지를 두려워했기 때문입니다. 그가 그들에게 와서 위험한 보복을 행하지 못하게 하려는 것이었습니다. 그들은 그가 하나님과 사람 앞에서 큰 사람이라는 말을 들었기 때문입니다.


    6. 그때 그 상인이 그들에게 말했습니다. “나를 보디발의 판결에서 풀어 주십시오.”


    7. 그래서 그들이 가까이 와서 나에게 청하며 말했습니다. “우리가 당신을 은으로 샀다고 말하십시오. 그러면 그가 우리를 풀어 줄 것입니다.”[a][b]'
  philosophy: formal
lexical_decisions:
- source_word: ἐν πόθῳ ⌈ἁμαρτίας⌉
  english_pob_choice: in the desire of sin
  chosen_korean: 죄의 욕망 가운데서
  alternatives_korean:
  - 죄의 바람 속에서
  - 죄를 향한 갈망 가운데서
  lexicon: πόθος, ἁμαρτία
  rationale: POB의 ‘desire of sin’을 따라 ‘죄의 욕망’으로 직역하되, 한국어에서 자연스러운 관계부사구로 풀어 문장 흐름을 살렸습니다.
- source_word: ἀφαιρεῖσθαι τὰ ἀλλότρια
  english_pob_choice: to take what belongs to another
  chosen_korean: 남의 것을 빼앗는 일
  alternatives_korean:
  - 남의 것을 취하는 일
  - 타인의 것을 가져가는 일
  lexicon: ἀφαιρέω, ἀλλότριος
  rationale: 단순한 ‘가져가다’보다 부당한 탈취성을 드러내는 ‘빼앗다’가 문맥에 더 가깝습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 종살이하는 자
  lexicon: δοῦλος
  rationale: 영문 POB가 ‘slave’로 택해 신분적 예속을 강하게 표시하므로, 여기서는 그 긴장을 살리는 ‘노예’를 사용했습니다.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  english_pob_choice: in sackcloth and ashes
  chosen_korean: 베옷과 재 가운데서
  alternatives_korean:
  - 굵은 베옷과 재 가운데서
  - 베옷을 입고 재를 뒤집어쓴 채
  lexicon: σάκκος, σποδός
  rationale: 애곡의 관용구를 한국어로 옮기되, ‘가운데서’로 상태를 유지해 상투적 종교문구로 굳어지지 않게 했습니다.
- source_word: περὶ τοῦ μεταβόλου / ὁ μετάβολος
  english_pob_choice: exchange / the trader
  chosen_korean: 교환 / 그 상인
  alternatives_korean:
  - 거래 / 그 장사꾼
  - 매매 / 그 중개자
  lexicon: μετάβολος
  rationale: 본문의 같은 어근을 6절에서는 ‘교환’, 7절에서는 행위 주체를 드러내는 ‘상인’으로 살려, 말장난과 서술 기능을 함께 반영했습니다.
theological_decisions:
- issue: 요셉의 자기 진술 ‘δοῦλός εἰμι’의 신분 표현
  chosen_reading: “나는 종입니다”와 “스스로 노예라고 말했습니다”를 함께 사용해, 서술과 직접화법 사이의 신분 긴장을 구분했습니다.
  alternative_readings:
  - 둘 다 ‘종’으로 완화
  - 둘 다 ‘노예’로 통일
  rationale: 직접 대답은 자신의 사회적 굴욕을 더 강하게 드러내므로 ‘노예’를 유지했고, 서술은 한국어 예배문체의 과도한 경직을 피하려 ‘종’으로 완화했습니다.
  doctrine_reference: 사회적 예속/신분표현의 문맥 보존
