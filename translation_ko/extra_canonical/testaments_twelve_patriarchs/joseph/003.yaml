  revised_text: '1. 잠시 뒤에 그녀는 물러나 내 영혼의 뜻을 시험하곤 했습니다. 열 가지 시험에서 그녀는 나를 검증된 사람으로 드러냈고, 나는 그 모든 일 가운데서 인내했습니다. 인내는 큰 치료약이기 때문입니다.


    2. 그 애굽 여인이 내게 몇 번이나 죽음으로 위협했습니까! 몇 번이나 나를 형벌에 넘긴 뒤 다시 불러들였으며[a], 내가 그녀와 동침하기를 원하지 않을 때에는 내게 이렇게 말했습니다. “네가 나에게 자신을 내주면, 너는 나와 내 집에 있는 모든 사람 위에 권세를 가지게 될 것이며, 우리의 주인처럼 될 것이다.”


    3. 그러나 나는 아버지의 말씀을 기억했고, 울면서 내 방으로 들어가 주님께 기도했습니다.


    4. 나는 그 일곱 해 동안 금식했고, 그 애굽 사람에게는 마치 사치롭게 지내는 사람처럼 보였습니다[b]. 하나님을 위하여 금식하는 사람들은 얼굴의 아름다움을 받기 때문입니다.


    5. 내 주인이 자리를 비우면 나는 포도주를 마시지 않았고, 사흘마다 내 음식을 먹어 그것을 가난한 사람들과 병든 사람들에게 주었습니다[c].


    6. 나는 이른 아침 주님께 나아가 멤피스라는 그 애굽 여인 때문에 울었습니다[d]. 그 여인이 쉬지 않고 나를 몹시 괴롭혔기 때문입니다. 밤에도 그 여인은 방문한다는 구실로 내게 들어오곤 했습니다.


    7. 또 그녀에게 남자아이가 없었으므로, 그녀는 가장했습니다.'
