base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003.yaml
  text: '1[a]. In a short time she would withdraw, to test the purpose of my soul. In ten temptations she proved me approved, and in them all I was patient; for patience is a great remedy.


    2. How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments[b], she called me back, and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”


    3. But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.


    4. And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; for those who fast for God''s sake receive grace of face.


    5. And if my master was away, I drank no wine; and every third day I would take my food, and I would give it to the poor and the sick.


    6. And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.


    7. And because she had no male child[d][c], she pretended'
  footnotes:
  - marker: a
    text: 'Some witnesses include an additional repetition of the threat: ''and threatened me.'''
    reason: textual_variant
  - marker: b
    text: '''To the Egyptian'' may refer specifically to Joseph''s Egyptian master, though the Greek leaves the expression terse.'
    reason: alternative_reading
  - marker: c
    text: The phrase 'for three days I would take my food' may also be understood as eating every third day or after a three-day interval.
    reason: lexical_alternative
  - marker: d
    text: Memphis is the name given here for the Egyptian woman in this Greek witness.
    reason: cultural_note
translation:
  language: ko
  text: '1. 잠시 뒤에 그녀는 물러나 내 영혼의 뜻을 시험하곤 했습니다. 열 가지 시험에서 그녀는 나를 검증된 사람으로 드러냈고, 나는 그 모든 일 가운데서 인내했습니다. 인내는 큰 치료약이기 때문입니다.


    2. 그 애굽 여인이 내게 몇 번이나 죽음으로 위협했습니까! 몇 번이나 나를 형벌에 넘긴 뒤 다시 불러들였으며[a], 내가 그녀와 동침하기를 원하지 않을 때에는 내게 이렇게 말했습니다. “네가 나에게 자신을 내주면, 너는 나와 내 집에 있는 모든 사람 위에 권세를 가지게 될 것이며, 우리의 주인처럼 될 것이다.”


    3. 그러나 나는 아버지의 말씀을 기억했고, 울면서 내 방으로 들어가 주님께 기도했습니다.


    4. 나는 그 일곱 해 동안 금식했고, 그 애굽 사람에게는 마치 사치롭게 지내는 사람처럼 보였습니다[b]. 하나님을 위하여 금식하는 사람들은 얼굴의 아름다움을 받기 때문입니다.


    5. 내 주인이 자리를 비우면 나는 포도주를 마시지 않았고, 사흘마다 내 음식을 먹어 그것을 가난한 사람들과 병든 사람들에게 주었습니다[c].


    6. 나는 이른 아침 주님께 나아가 멤피스라는 그 애굽 여인 때문에 울었습니다[d]. 그 여인이 쉬지 않고 나를 몹시 괴롭혔기 때문입니다. 밤에도 그 여인은 방문한다는 구실로 내게 들어오곤 했습니다.


    7. 또 그녀에게 남자아이가 없었으므로, 그녀는 가장했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본에는 여기서 위협이 한 번 더 반복되어 ‘그리고 내게 위협했다’라는 말이 들어 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘그 애굽 사람’은 특히 요셉의 애굽인 주인을 가리킬 수 있으나, 그리스어 표현은 간결하여 지시 대상이 확정되지 않습니다.
    reason: alternative_reading
  - marker: c
    text: ‘사흘마다 내 음식을 먹었다’는 말은 매 삼 일째 먹었다거나 삼 일의 간격 뒤에 먹었다는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 이 그리스어 사본에서는 애굽 여인의 이름을 멤피스라고 합니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δέκα πειρασμοῖς / δόκιμον ἀπέδειξέ με
  english_pob_choice: In ten temptations she proved me approved
  chosen_korean: 열 가지 시험에서 그는 나를 입증했고
  alternatives_korean:
  - 열 가지 유혹에서
  - 열 가지 시련에서
  lexicon: LSJ / BDAG
  rationale: πειρασμοί의 시험·유혹 중첩을 살리되, POB의 'approved'에 대응하는 δόκιμον은 '입증하다'로 옮겨 시험을 통과해 검증되었다는 뜻을 유지했습니다.
- source_word: ἡ μακροθυμία / ἐμακροθύμησα
  english_pob_choice: patience / I was patient
  chosen_korean: 참았습니다 / 인내는
  alternatives_korean:
  - 오래 참음
  - 오래 참았습니다
  lexicon: BDAG
  rationale: 특별한 교회 용어보다 현대 한국어의 '인내'와 '참다'가 본문의 덕목과 지속적 견딤을 자연스럽게 드러냅니다.
- source_word: φάρμακον
  english_pob_choice: remedy
  chosen_korean: 치료약
  alternatives_korean:
  - 약
  - 처방
  lexicon: LSJ
  rationale: 비유적으로 쓰인 φάρμακον의 치료·회복 이미지를 살리면서도, 단순한 '약'보다 속담처럼 단정적인 효과를 더 분명히 드러냅니다.
- source_word: ταμεῖον
  english_pob_choice: chamber
  chosen_korean: 침실
  alternatives_korean:
  - 골방
  - 내실
  lexicon: LSJ
  rationale: 기도를 위해 홀로 물러난 사적인 방이라는 점을 살리되, 한국어에서 가장 자연스러운 사적 공간 표현으로 옮겼습니다.
- source_word: τὴν χάριν
  english_pob_choice: grace of face
  chosen_korean: 얼굴의 은혜
  alternatives_korean:
  - 얼굴의 호의
  - 용모의 은총
  lexicon: LSJ
  rationale: 직역에 가까운 표현을 유지해, 금식이 외적 용모에 미치는 초월적·호의적 효과라는 원문의 이미지를 보존했습니다.
- source_word: τριημερίζων
  english_pob_choice: every third day I would take my food
  chosen_korean: 사흘마다 내 음식을 먹었으며
  alternatives_korean:
  - 삼 일마다
  - 사흘 간격으로
  lexicon: LSJ
  rationale: POB가 채택한 'every third day'의 반복적 금식 리듬을 한국어 관용구로 자연스럽게 옮겼습니다.
- source_word: προσεποιεῖτο
  english_pob_choice: pretended
  chosen_korean: 가장했습니다
  alternatives_korean:
  - 꾸몄습니다
  - 흉내 냈습니다
  lexicon: LSJ
  rationale: 의도적 위장과 속임의 뉘앙스를 분명히 하면서도, 문어체에서 매끄러운 동사를 선택했습니다.
theological_decisions:
- issue: κύριος in Joseph's prayer
  chosen_reading: 주님
  alternative_readings:
  - 주인
  rationale: 기도의 대상은 하나님이므로, 본문 내 다른 '주인'과 구별해 경배적 호칭인 '주님'을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: κύριος in prayer contexts → 주님'
- issue: 금식과 '얼굴의 은혜'의 인과 주장
  chosen_reading: 하나님을 위해 금식하는 사람들은 얼굴의 은혜를 받습니다
  alternative_readings:
  - 얼굴의 호의를 얻습니다
  - 용모의 은총을 받습니다
  rationale: 본문은 금식이 단지 금욕이 아니라 하나님 앞의 행위로서 외적 인상에까지 영향을 준다고 말하므로, 그 신학적 긴장을 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
