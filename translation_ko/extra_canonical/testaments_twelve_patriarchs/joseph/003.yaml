- from: '1[a]. 잠시 후에 그는 물러나 내 영혼의 뜻을 시험했습니다. 열 가지 시험에서 그는 나를 입증했고, 나는 그 모든 것 가운데서 참았습니다. 인내는 큰 치료약이기 때문입니다.


    2. 그 애굽 여인이 내게 몇 번이나 죽음을 위협했습니까! 몇 번이나 나를 형벌에 넘긴 뒤에 다시 불러들였으며, 내가 그녀와 함께 들어가기를 원하지 않을 때에는 내게 말했습니다. “네가 나에게 자신을 내주면 너는 나와 내 집에 있는 모든 사람 위에 권세를 가지게 되고, 우리 주인과 같게 될 것이다.”


