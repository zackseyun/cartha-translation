  text: But she kept contending, wanting to fulfill her desire.
translation:
  language: ko
  text: 그 여자는 자신의 욕망을 이루려고 계속 다투었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντεφιλονείκει
  english_pob_choice: kept contending
  chosen_korean: 계속 맞섰습니다
  alternatives_korean:
  - 계속 다투었습니다
  - 끊임없이 맞받아쳤습니다
  - 끝까지 논쟁을 이어 갔습니다
  lexicon: ἀντεφιλονέω
  rationale: 반복적·대항적 행동을 드러내는 동사로, 단순한 내적 욕구보다 상대에 맞서 계속 버티는 뉘앙스를 살려 ‘계속 맞섰습니다’로 옮겼습니다.
- source_word: πληρῶσαι
  english_pob_choice: to fulfill
  chosen_korean: 채우려
  alternatives_korean:
  - 이루려
  - 성취하려
  - 실현하려
  lexicon: πληρόω
  rationale: 뒤따르는 목적어 ‘자기 욕망’을 자연스럽게 받으면서도, ‘채우다’가 욕망을 가득 채우려는 의미를 가장 직접적으로 드러냅니다.
- source_word: τὴν ἐπιθυμίαν αὐτῆς
  english_pob_choice: her desire
  chosen_korean: 자기 욕망
  alternatives_korean:
  - 그녀의 욕망
  - 그녀의 소원
  - 그녀의 정욕
  lexicon: ἐπιθυμία
  rationale: 문맥상 중립적 ‘소원’보다 강한 욕망을 가리키며, 본문이 도덕적 긴장을 담고 있으므로 ‘욕망’이 적합합니다.
theological_decisions:
- issue: 문장 첫머리의 접속사 καὶ/κἀκείνη의 처리
  chosen_reading: ‘그러나 그녀는’으로 옮겨 앞뒤 행동의 대조를 살렸습니다.
  alternative_readings:
  - 그리고 그녀는
  - 그녀도
  rationale: 앞절의 흐름과 대립적 전개를 고려하면 단순 병렬보다 ‘그러나’가 본문의 긴장을 더 잘 드러냅니다.
  doctrine_reference: 서술 흐름과 인물 간 대조
