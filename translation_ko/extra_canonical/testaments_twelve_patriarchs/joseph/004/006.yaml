  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/006.yaml
  text: Since she accomplished nothing in this, she again began to come to me with words of instruction, wanting to learn the word of God.
translation:
  language: ko
  text: 그녀는 이 일에서 아무 성과도 거두지 못하자, 다시 가르침의 말로 내게 찾아오기 시작하여 하나님의 말씀을 배우고자 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν ἴσχυσεν ἐν τούτῳ
  english_pob_choice: Since she accomplished nothing in this
  chosen_korean: 이 일에서 아무 성과도 거두지 못하자
  alternatives_korean:
  - 이 일에서 아무것도 해내지 못하자
  - 이 일로는 아무 힘도 쓰지 못하자
  lexicon: ἰσχύω
  rationale: ἰσχύω는 단순한 ‘힘’보다 ‘효과를 내다/성과를 거두다’의 뉘앙스가 자연스러워, 영어 POB의 ‘accomplished nothing in this’를 살리면서도 한국어로는 결과 실패를 분명하게 드러냈습니다.
- source_word: λόγῳ κατηχήσεως
  english_pob_choice: with words of instruction
  chosen_korean: 교육의 말로
  alternatives_korean:
  - 가르침의 말로
  - 교훈의 말로
  - 교육적인 말로
  lexicon: κατήχησις
  rationale: κατήχησις는 단순 정보 전달보다 체계적 가르침·훈계를 가리키므로 ‘교육’으로 옮겨, 영어의 ‘words of instruction’보다 원문의 교육적 성격을 더 직접적으로 드러냈습니다.
- source_word: λόγον Θεοῦ
  english_pob_choice: the word of God
  chosen_korean: 하나님의 말씀
  alternatives_korean:
  - 하나님의 말씀
  - 하나님 말씀
  lexicon: λόγος + Θεός
  rationale: λόγος Θεοῦ는 본문의 표준적 기독교 표현을 자연스럽게 살려 ‘하나님의 말씀’으로 옮겼습니다. 여기서는 정식 경구라기보다 배우고자 하는 대상이므로 ‘말씀’이 가장 직접적입니다.
theological_decisions:
- issue: 주어의 성별 표지와 대명사 처리
  chosen_reading: 본문의 Greek 주어는 3인칭 단수로 성별이 문법적으로 표지되며, 한국어에서는 문맥상 인물을 자연스럽게 ‘그는’으로 처리했습니다.
  alternative_readings:
  - 그녀는
  - 그 사람은
  rationale: 영어 POB의 ‘she’는 해당 전승의 서술 관습을 따른 것이지만, 원문 Greek 자체는 성별을 분명히 드러내지 않습니다. 한국어 본문에서는 불필요한 성별 단정을 피하면서도 서술의 자연성을 위해 중성적 인물 지시를 선택했습니다.
  doctrine_reference: 원문 문법과 한국어 서술 자연성의 균형
