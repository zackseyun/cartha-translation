id: T12P.JOS.4.3
reference: Testament of Joseph 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις οὖν¹ *ὡς ἁγίῳ ἀνδρὶ ἐν λόγοις² ἐκολάκευέ³ με⁴ καὶ⁵ μετὰ δόλου διὰ⁶ ῥημάτων ἐπαίνει⁷ *τὴν σωφροσύνην⁸ μου ἐνώπιον τοῦ ἀνδρὸς αὐτῆς⁹, βουλομένη *κατὰ μόνας¹⁰ ὑποσκελίσαι με.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/003.yaml
  text: So then, many times, as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.
translation:
  language: ko
  text: 그러므로 그녀는 여러 번 나를 거룩한 사람인 양 말로 아첨하여 추켜세웠고, 속임수를 써서 남편 앞에서 내 절제를 칭찬했으며, 단둘이 있을 때 나를 넘어뜨리려 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἁγίῳ ἀνδρὶ
  english_pob_choice: as to a holy man
  chosen_korean: 거룩한 사람처럼
  alternatives_korean:
  - 성인처럼
  - 경건한 사람처럼
  lexicon: ἅγιος, ἀνήρ
  rationale: 직역의 ‘거룩한 사람’이 원문의 수식 관계를 가장 직접적으로 드러내며, ‘성인’은 현대 한국어에서 다른 종교적 연상을 낳을 수 있어 피했습니다.
- source_word: ἐκολάκευέ με
  english_pob_choice: she flattered me
  chosen_korean: 나를 … 아첨했고
  alternatives_korean:
  - 나를 … 추켜세웠고
  - 나에게 … 아부했고
  lexicon: κολακεύω
  rationale: 상대의 호감을 얻기 위한 아첨이라는 부정적 뉘앙스를 살리기 위해 ‘아첨하다’를 택했습니다.
- source_word: τὴν σωφροσύνην μου
  english_pob_choice: my self-control
  chosen_korean: 내 절제함
  alternatives_korean:
  - 내 신중함
  - 내 절제
  lexicon: σωφροσύνη
  rationale: 문맥상 성적 유혹 앞에서의 자기 절제와 절도가 핵심이므로 ‘절제함’이 가장 정확합니다.
- source_word: κατὰ μόνας ὑποσκελίσαι με
  english_pob_choice: to trip me up when we were alone
  chosen_korean: 우리만 있을 때 나를 넘어뜨리려 했습니다
  alternatives_korean:
  - 우리끼리 있을 때 나를 걸려 넘어지게 하려 했습니다
  - 단둘이 있을 때 나를 함정에 빠뜨리려 했습니다
  lexicon: ὑποσκελίζω, κατὰ μόνας
  rationale: ὑποσκελίζω의 비유적 의미를 한국어 관용 표현 ‘넘어뜨리다’로 살렸고, κατὰ μόνας는 ‘우리만 있을 때’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 문장의 행위 주체와 누적 동작의 전달
  chosen_reading: ‘아첨했고… 칭찬했으며… 넘어뜨리려 했습니다’로 연결해 반복성과 의도를 드러냈습니다.
  alternative_readings:
  - 동사를 더 평평하게 나열하는 방식
  - ‘유혹하려 했습니다’로 의도를 한 단어로 압축하는 방식
  rationale: 원문은 반복적 행위와 최종 목적(단둘이 있을 때 넘어뜨리려 함)을 함께 제시하므로, 한국어에서도 연쇄 구조를 유지해 서술의 긴장감을 보존했습니다.
  doctrine_reference: 문학적-서사적 충실성
- issue: σωφροσύνη의 윤리적 무게
  chosen_reading: ‘절제함’으로 옮겨 성적 유혹 속 자기 통제를 분명히 했습니다.
  alternative_readings:
  - 신중함
  - 분별
  rationale: 이 문맥에서 σωφροσύνη는 단순한 조심성보다 몸과 욕망을 다스리는 덕목을 가리키므로, 윤리적 의미가 가장 분명한 번역을 택했습니다.
  doctrine_reference: 성윤리/절제의 덕
