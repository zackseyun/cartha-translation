source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*᾿Εν τούτοις πᾶσιν¹⁸ ἐγὼ¹⁹ *χαμοκοιτῶν ἐδεόμην τοῦ Θεοῦ²⁰ ὅπως *ῥύσεταί με²¹ ἐκ *τῆς δολιότητος αὐτῆς²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/005.yaml
  text: In all these things I, lying on the ground, kept begging God that he would rescue me from her deceit.
translation:
  language: ko
  text: 이 모든 일 가운데서도 나는 땅에 엎드린 채 하나님께 그 여자의 속임수에서 저를 건져 주시기를 계속 간청했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαμοκοιτῶν
  english_pob_choice: lying on the ground
  chosen_korean: 땅에 엎드린 채
  alternatives_korean:
  - 땅에 누운 채
  - 엎드려
  lexicon: χαμοκοιτέω
  rationale: 영어 POB의 ‘lying on the ground’를 반영하되, 한국어에서는 ‘땅에 엎드린 채’가 자세와 간구의 절박함을 자연스럽게 드러냅니다.
- source_word: ἐδεόμην
  english_pob_choice: kept begging
  chosen_korean: 계속 간청했습니다
  alternatives_korean:
  - 간구했습니다
  - 계속 빌었습니다
  lexicon: δέομαι
  rationale: 반복적이고 절박한 구함을 살리기 위해 단회적 ‘간구했습니다’보다 진행성 있는 표현을 택했습니다.
- source_word: τοῦ Θεοῦ
  english_pob_choice: God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님에게
  - 하나님께서
  lexicon: Θεός
  rationale: 청원 대상이 되는 하나님은 한국어 성서체 관용에 따라 ‘하나님께’로 옮기는 것이 가장 자연스럽습니다.
- source_word: τῆς δολιότητος αὐτῆς
  english_pob_choice: her deceit
  chosen_korean: 그 여자의 속임수
  alternatives_korean:
  - 그 여자의 간계
  - 그 여자의 거짓
  lexicon: δολιότης
  rationale: δολιότης의 기만적 속성을 유지하면서도 한국어에서 이해하기 쉬운 ‘속임수’로 옮겼습니다.
theological_decisions:
- issue: 간청의 대상과 문맥 속 인칭 처리
  chosen_reading: ‘저를 건져 주시기를’로 옮겨, 화자가 자신을 하나님께서 구해 주시길 구하는 문맥을 분명히 했습니다.
  alternative_readings:
  - ‘나를 건져 주시기를’
  - ‘저를 구원해 주시기를’
  rationale: 본문은 화자의 자기 간청과 제3자의 여성 지시 대상을 함께 담고 있으므로, 한국어에서는 주어 대비를 분명히 하되 과도한 해석을 더하지 않았습니다.
  doctrine_reference: 내러티브/간구 표현의 인칭 구분
- issue: ῥύσεταί με의 구출 의미
  chosen_reading: ‘건져 주시기를’
  alternative_readings:
  - ‘구해 주시기를’
  - ‘구원해 주시기를’
  rationale: ῥύομαι는 위기에서의 구출 뉘앙스가 강하므로, 영적 구원으로 좁히기보다 상황적 ‘건져 주다’가 더 정확합니다.
  doctrine_reference: 구출 동사의 상황적 의미
