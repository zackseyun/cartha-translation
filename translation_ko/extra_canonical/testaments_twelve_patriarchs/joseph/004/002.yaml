  - severity: medium
    issue: ‘그분’ 사용
    rationale: αὐτή는 여성 단수 대명사이며, 문맥상 여성 인물을 가리킵니다. ‘그분’은 성별을 흐리고 불필요한 존칭을 더합니다.
  - severity: medium
    issue: 미완료 ἔλεγον의 반복·지속성이 반영되지 않음
    rationale: ‘전하였으니’는 완료된 단발 행동처럼 들립니다. ‘전하고 있었습니다’가 미완료의 서술적 성격을 더 잘 반영합니다.
  - severity: low
