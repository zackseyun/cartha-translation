id: T12P.JOS.4.2
reference: Testament of Joseph 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἔλεγον *πρὸς αὐτὴν⁶¹ ῥήματα ὑψίστου, εἰ ἄρα ἐπιστρέψει⁶² ἀπὸ τῆς ἐπιθυμίας⁶³ τῆς πονηρᾶς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/002.yaml
  text: And I would speak to her words of the Most High, whether perhaps she might turn back from the evil desire.
translation:
  language: ko
  text: 그리고 그들은 그녀에게 지극히 높으신 이의 말씀을 전하고 있었습니다. 그녀가 혹시 악한 욕망에서 돌이킬까 하여 그리하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς αὐτὴν
  english_pob_choice: to her
  chosen_korean: 그분에게
  alternatives_korean:
  - 그녀에게
  - 그에게
  lexicon: αὐτή
  rationale: 문맥상 대상이 여성으로 보이므로 ‘그녀에게’가 직역에 가깝지만, 한국어 문장에서는 인칭 성별을 드러내지 않는 ‘그분에게’로 자연스럽게 옮겼습니다.
- source_word: ῥήματα ὑψίστου
  english_pob_choice: words of the Most High
  chosen_korean: 지극히 높으신 이의 말씀
  alternatives_korean:
  - 지극히 높으신 분의 말씀
  - 가장 높으신 분의 말씀
  lexicon: ῥήματα / ὕψιστος
  rationale: ‘ῥήματα’는 단순한 말보다 권위 있는 ‘말씀’이 자연스럽고, ‘ὑψίστου’는 하나님을 가리키는 경외적 표현이므로 ‘지극히 높으신 이’로 옮겼습니다.
- source_word: εἰ ἄρα ἐπιστρέψει
  english_pob_choice: whether perhaps she might turn back
  chosen_korean: 그분이 혹시 … 돌아설까 하였습니다
  alternatives_korean:
  - 그분이 혹시 … 돌아오실까 하였습니다
  - 그분이 … 돌이키실지 보려 하였습니다
  lexicon: ἐπιστρέφω
  rationale: 동사 ἐπιστρέφω의 핵심인 ‘돌아서다/돌이키다’를 살리되, 가능성을 나타내는 εἰ ἄρα를 ‘혹시’로 반영했습니다.
- source_word: τῆς ἐπιθυμίας τῆς πονηρᾶς
  english_pob_choice: the evil desire
  chosen_korean: 악한 욕망
  alternatives_korean:
  - 악한 정욕
  - 악한 욕심
  lexicon: ἐπιθυμία / πονηρός
  rationale: ἐπιθυμία는 단순한 욕구보다 윤리적으로 왜곡된 욕망을 가리키므로, 문맥에 맞게 ‘악한 욕망’으로 옮겼습니다.
theological_decisions:
- issue: 지극히 높으신 이 표현의 신학적 지시 대상
  chosen_reading: 직접 신명(神名)을 쓰지 않고, 원문의 경외적 칭호를 한국어에서도 유지했습니다.
  alternative_readings:
  - 하나님
  - 야훼
  rationale: 이 본문은 구약 정경 인용이 아니라 외경/유언문학의 표현이므로, 본문이 실제로 사용하는 경칭을 보존하는 것이 더 स्रोत-가깝습니다.
  doctrine_reference: 경칭 보존 원칙
