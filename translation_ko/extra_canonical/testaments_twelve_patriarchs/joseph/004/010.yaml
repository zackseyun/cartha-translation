id: T12P.JOS.4.10
reference: Testament of Joseph 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ⁴⁵ προσετιθέμην *νηστείαν καὶ⁴⁶ προσευχήν, ὅπως ῥύσεταί⁴⁷ με ὁ⁴⁸ Κύριος ἀπ᾽ αὐτῆς⁴⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/010.yaml
  text: And I added fasting and prayer, so that the Lord might rescue me from her.
translation:
  language: ko
  text: 나는 금식과 기도를 더하여, 주님께서 나를 그녀에게서 구해 주시기를 바랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσετιθέμην
  english_pob_choice: I added
  chosen_korean: 더하여
  alternatives_korean:
  - 추가했습니다
  - 보탰습니다
  lexicon: προστίθημι
  rationale: 단순히 항목을 덧붙이는 뜻을 살리되, 금식과 기도를 이미 행하던 것에 ‘더하다’는 누적 뉘앙스를 간결하게 반영했습니다.
- source_word: νηστείαν καὶ προσευχήν
  english_pob_choice: fasting and prayer
  chosen_korean: 금식과 기도
  alternatives_korean:
  - 단식과 기도
  - 금식과 간구
  lexicon: νηστεία / προσευχή
  rationale: 직역에 가깝게 유지하되, 한국어에서 가장 자연스럽고 교회적 의미도 과도하게 바꾸지 않는 조합으로 옮겼습니다.
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: κύριος
  rationale: 여기서는 하나님의 호칭이므로 POB 기본값에 따라 ‘주님’을 사용해 존칭성과 인격성을 함께 살렸습니다.
- source_word: ῥύσεταί με ... ἀπ᾽ αὐτῆς
  english_pob_choice: might rescue me from her
  chosen_korean: 나를 그녀에게서 구해 주시기를 바랐습니다
  alternatives_korean:
  - 나를 그녀에게서 건져 주시기를 바랐습니다
  - 나를 그녀로부터 구원하시기를 바랐습니다
  lexicon: ῥύομαι + ἀπό
  rationale: 동사의 구출·구원 의미를 살리되, 관계절 전체를 한국어 자연문으로 풀어 ‘~하시기를 바랐다’의 목적/기대 뉘앙스를 표현했습니다.
theological_decisions:
- issue: 주어의 구원 행위와 인간의 금식·기도 사이의 관계
  chosen_reading: 금식과 기도는 주님의 구출을 얻기 위한 수단이 아니라, 그분의 구원에 의지하는 태도로 표현했습니다.
  alternative_readings:
  - 금식과 기도를 더하여 주님께서 반드시 나를 그녀에게서 구해 주실 것이라 믿었습니다
  - 금식과 기도를 더하여 주님께서 나를 그녀에게서 구해 내시도록 했습니다
  rationale: 본문은 목적절(ὅπως)로 결과의 기대를 말하므로, 한국어에서도 행위-결과를 단정적으로 만들지 않고 간구의 성격을 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: 본문 맥락상 금식·기도와 하나님의 구원 사이의 종속 관계
