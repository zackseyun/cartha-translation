  source_fidelity: 초안은 핵심 어휘를 대체로 충실히 옮겼습니다. 그러나 ὅπως ῥύσεταί με의 목적절을 ‘구해 주시기를 바랐습니다’로 번역하여, 금식과 기도를 더한 행위의 목적을 화자의 바람으로 다소 바꾸었습니다. 원문은 ‘주님께서 나를 그녀에게서 구해 주시도록’이라는 목적 관계를 나타냅니다.
  naturalness: ‘금식과 기도를 더했습니다’와 ‘주님께서 … 구해 주시도록’은 현대 표준 한국어 합쇼체 문장으로 자연스럽습니다. ‘그녀’는 선행 맥락의 여성을 가리키는 문어적 대명사로 이 짧은 절에서는 허용됩니다.
  terminology: ‘금식’, ‘기도’, ‘주님’, ‘구해 주시다’는 각각 νηστεία, προσευχή, ὁ Κύριος, ῥύομαι에 적절합니다. ‘주님’은 원문의 정관사 호칭을 무리 없이 반영하며, 교파적 해석을 덧붙이지 않습니다.
  issues:
