source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*᾿Εδόξαζε ⌜γάρ⌝¹¹ με ὡς σώφρονα *φανερῶς, καὶ ἐν κρυφῇ¹² ἔλεγέ μοι· Μὴ φοβηθῇς τὸν ἄνδρα μου· καὶ γὰρ πέπεισται¹⁴ περὶ τῆς σωφροσύνης σου¹⁵· ὅτι κἂν *τις αὐτῷ εἴπῃ¹⁶ περὶ ἡμῶν, *οὐ πιστεύσει¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/004.yaml
  text: For she openly extolled me as self-controlled, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded about your purity, and even if someone should tell him about us, he will not believe it.”
translation:
  language: ko
  text: 그녀는 나를 공공연히 절제된 사람으로 칭찬했지만, 은밀히 나에게 말했습니다. “제 남편을 두려워하지 마십시오. 그는 이미 당신의 절제에 대해 확신하고 있습니다. 설령 누가 우리 일에 대해 그에게 말하더라도, 그는 믿지 않을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξαζε ... με ὡς σώφρονα φανερῶς
  english_pob_choice: openly extolled me as self-controlled
  chosen_korean: 겉으로는 절제된 사람으로 칭찬했습니다
  alternatives_korean:
  - 겉으로는 신중한 사람으로 높였습니다
  - 드러내 놓고 절제 있는 사람이라고 칭찬했습니다
  lexicon: σώφρων
  rationale: σώφρων은 단순한 예의가 아니라 자기 절제와 품행의 절제를 가리키므로, 전통적 도덕어보다 ‘절제된 사람’이 소스의 의미를 더 직접적으로 드러냅니다.
- source_word: ἐν κρυφῇ
  english_pob_choice: in secret
  chosen_korean: 몰래
  alternatives_korean:
  - 은밀히
  - 비밀리에
  lexicon: ἐν κρυφῇ
  rationale: 말의 전달 방식이 은밀했음을 간결하게 살리기 위해 ‘몰래’를 택했습니다.
- source_word: τῆς σωφροσύνης σου
  english_pob_choice: your purity
  chosen_korean: 당신의 절제
  alternatives_korean:
  - 당신의 순결
  - 당신의 정결
  lexicon: σωφροσύνη
  rationale: 본문의 σωφροσύνη는 성적 순결보다 더 넓은 ‘절제/자제’의 뜻을 가지므로, POB의 ‘purity’보다 소스어 의미에 가까운 ‘절제’로 옮겼습니다.
- source_word: πέπεισται περὶ ...
  english_pob_choice: he is persuaded about your purity
  chosen_korean: 이미 확신하고 있습니다
  alternatives_korean:
  - 당신의 절제에 대해 확신하고 있습니다
  - 당신의 절제에 설득되어 있습니다
  lexicon: πείθω
  rationale: πέπεισται는 현재 완료로 확고한 확신 상태를 나타내므로, 한국어에서는 자연스럽게 ‘이미 확신하고 있습니다’로 풀었습니다.
theological_decisions:
- issue: 직접 화법의 호칭과 공손도
  chosen_reading: “두려워하지 마십시오, 제 남편을.”
  alternative_readings:
  - “두려워하지 말아요, 제 남편을.”
  - “제 남편을 두려워하지 마십시오.”
  rationale: 인물 간 대화이지만 문어체 합쇼체를 유지해야 하므로, 명령문은 공손한 금지형으로 옮기되 한국어 어순은 자연스럽게 조정했습니다.
  doctrine_reference: register_and_style
- issue: περὶ ἡμῶν의 공동체적/부정적 암시
  chosen_reading: 우리에 대해
  alternative_readings:
  - 우리 둘에 대해
  - 우리 사이에 대해
  rationale: ἡμῶν는 1인칭 복수로, 당사자 둘을 포함하는 관계적 뉘앙스를 살려 ‘우리에 대해’로 옮겼습니다.
  doctrine_reference: pronoun_reference
