revisions:
- from: 그녀는 나를 겉으로는 절제된 사람으로 칭찬했지만, 몰래는 저에게 말했습니다. “두려워하지 마십시오, 제 남편을. 그는 당신의 절제에 대해 이미 확신하고 있습니다. 설령 누가 우리에 대해 그에게 말하더라도, 그는 믿지 않을 것입니다.”
  to: 그녀는 나를 공공연히 절제된 사람으로 칭찬했지만, 은밀히 나에게 말했습니다. “제 남편을 두려워하지 마십시오. 그는 이미 당신의 절제에 대해 확신하고 있습니다. 설령 누가 우리 일에 대해 그에게 말하더라도, 그는 믿지 않을 것입니다.”
  rationale: The revision improves formal-modern Korean idiom and pronoun consistency while preserving the Greek’s public/private contrast, the moral-self-control terminology, the husband’s established conviction, and the intentionally unspecified ‘about us.’
  reviewer_model: gpt-5.6-terra
