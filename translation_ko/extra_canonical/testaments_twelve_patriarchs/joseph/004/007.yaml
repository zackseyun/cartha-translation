- from: 그리고 그 여자가 내게 말합니다. “당신이 제가 우상들을 떠나게 하기를 원하신다면, 내 친족이여, 제가 남편을 설득하여 우상들에서 물러나게 하겠습니다. 그러면 우리는 당신의 주님 앞에서 걸어가겠습니다.”
  to: 그리고 그녀가 내게 말합니다. “당신이 제가 우상들을 버리기를 원하신다면, 내 친족이여, 제가 남편을 설득하여 우상들에게서 떠나게 하겠습니다. 그러면 우리는 당신의 주님 앞에서 걸어가겠습니다.”
  rationale: A safe revision is needed to correct the Korean expression of the first ἵνα-clause and to improve the idiomatic rendering of separation from idols. The wording retains the source’s present-tense narration, address, future commitments, repeated plural “idols,” and the metaphor of walking before the hearer’s Lord. No footnotes are required by the supplied text, and no apparatus markers are represented in the draft as reader-facing anchors.
