  text: And she says to me, “If you want me to leave the idols, my kinsman, I will persuade my husband to withdraw from the idols, and we will walk before your Lord.”
translation:
  language: ko
  text: 그리고 그 여자가 내게 말합니다. “당신이 제가 우상들을 떠나게 하기를 원하신다면, 내 친족이여, 제가 남편을 설득하여 우상들에서 물러나게 하겠습니다. 그러면 우리는 당신의 주님 앞에서 걸어가겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ λέγει μοι
  english_pob_choice: And she says to me
  chosen_korean: 그리고 그 여자가 내게 말합니다
  alternatives_korean:
  - 그리고 그가 내게 말합니다
  - 그리고 말합니다
  lexicon: λέγω
  rationale: 현재형 서술을 살려 “말합니다”로 옮기고, 대화 상대가 여성임을 본문 문맥에 맞게 드러냈습니다.
- source_word: τὰ εἴδωλα
  english_pob_choice: the idols
  chosen_korean: 우상들
  alternatives_korean:
  - 우상
  - 신상들
  lexicon: εἴδωλον
  rationale: 영문 POB의 복수형을 따라 복수 표지 ‘-들’을 유지해 반복된 대상을 분명히 했습니다.
- source_word: συγγενοῦς μου
  english_pob_choice: my kinsman
  chosen_korean: 내 친족이여
  alternatives_korean:
  - 내 친족
  - 내 혈족이여
  lexicon: συγγενής
  rationale: 호격적 뉘앙스를 살려 문맥상 부르는 말로 처리했고, ‘친족’은 혈연 관계의 가까움을 무리 없이 반영합니다.
- source_word: ἀποστῆναι ἀπὸ τῶν εἰδώλων
  english_pob_choice: to withdraw from the idols
  chosen_korean: 우상들에서 물러나게 하겠습니다
  alternatives_korean:
  - 우상들로부터 떠나게 하겠습니다
  - 우상들을 버리게 하겠습니다
  lexicon: ἀφίστημι + ἀπό
  rationale: ‘withdraw from’의 이탈/철수 의미를 보존하되, 한국어에서는 ‘물러나게 하다’가 대상에서 멀어짐을 자연스럽게 드러냅니다.
- source_word: ἐνώπιον Κυρίου σου
  english_pob_choice: before your Lord
  chosen_korean: 당신의 주님 앞에서
  alternatives_korean:
  - 당신의 주님 앞에
  - 당신의 주 앞에서
  lexicon: ἐνώπιον + κύριος
  rationale: 전치사구의 직접적 공간적 은유를 살려 ‘앞에서’로 옮겼고, κύριος는 문맥상 예의를 반영해 ‘주님’으로 처리했습니다.
theological_decisions:
- issue: ‘your Lord’의 존칭 처리
  chosen_reading: 직접 화자가 상대를 높이는 문맥으로 보고 ‘당신의 주님’이라 옮겼습니다.
  alternative_readings:
  - ‘너의 주님’
  - ‘네 주님’
  rationale: 대화체이지만 한국어 출판 문체에서는 상대를 정중히 지칭하는 것이 문맥상 자연스럽고, 원문의 2인칭 소유를 유지합니다.
  doctrine_reference: 문체/화행의 등가성
