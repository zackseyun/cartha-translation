id: T12P.JOS.4.1
reference: Testament of Joseph 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ νοήσας ἐγὼ⁵⁵ ἐλυπήθην ἕως θανάτου⁵⁶· *ἐξελθούσης δὲ⁵⁷ αὐτῆς ἦλθον εἰς ἐμαυτόν, καὶ ἐπένθησα⁵⁸ περὶ αὐτῆς⁵⁹ ἡμέρας πολλάς, *ὅτι ἔγνων τὸν δόλον αὐτῆς καὶ τὴν πλάνην⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/001.yaml
  text: And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I knew her deceit and her delusion.
translation:
  language: ko
  text: 내가 깨닫고 나서, 나는 죽을 만큼 슬퍼하였습니다. 그러나 그녀가 나간 뒤에 나는 제정신으로 돌아와 여러 날 동안 그녀를 두고 애통해하였습니다. 내가 그녀의 속임수와 그릇됨을 알았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  english_pob_choice: I was grieved unto death
  chosen_korean: 죽도록 근심하였습니다
  alternatives_korean:
  - 죽도록 슬퍼하였습니다
  - 죽음에 이를 만큼 괴로워하였습니다
  lexicon: λυπέω
  rationale: ἕως θανάτου의 강도를 살리되, 현대 한국어에서 자연스럽고 문맥상 내면의 고통을 드러내는 ‘근심하였습니다’를 택했습니다.
- source_word: ἦλθον εἰς ἐμαυτόν
  english_pob_choice: I came to myself
  chosen_korean: 내가 제정신으로 돌아와
  alternatives_korean:
  - 내가 나 자신에게 돌아와
  - 정신을 차리고
  lexicon: ἐμαυτόν / ἔρχομαι εἰς ἐμαυτόν
  rationale: 직역의 어색함을 피하면서도 ‘정신을 되찾다’는 관용적 뜻을 자연스럽게 옮겼습니다.
- source_word: ἐπένθησα περὶ αὐτῆς ἡμέρας πολλάς
  english_pob_choice: mourned over her for many days
  chosen_korean: 여러 날 동안 그녀를 두고 애통하였습니다
  alternatives_korean:
  - 그녀를 위하여 여러 날 슬퍼하였습니다
  - 여러 날 동안 그녀 때문에 통곡하였습니다
  lexicon: πενθέω
  rationale: πενθέω의 장기적 애도 의미를 살려 ‘애통하였습니다’로 옮기고, 기간 표현은 원문대로 유지했습니다.
- source_word: τὸν δόλον αὐτῆς καὶ τὴν πλάνην
  english_pob_choice: her deceit and her delusion
  chosen_korean: 그녀의 속임수와 미혹
  alternatives_korean:
  - 그녀의 속임수와 그릇된 길
  - 그녀의 기만과 착각
  lexicon: δόλος / πλάνη
  rationale: δόλος는 의도적 속임수, πλάνη는 단순 착오보다 ‘미혹/길을 잃음’의 적극적 오류를 드러내므로 두 단어를 구별해 살렸습니다.
theological_decisions:
- issue: πλάνη의 의미 범위
  chosen_reading: ‘미혹’으로 번역해, 단순한 인지적 실수보다 사람을 잘못된 길로 이끄는 영적·도덕적 오류의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘착오’로 중화
  - ‘오류’로 일반화
  rationale: 본문은 그녀의 행위에 대한 도덕적 판단을 포함하므로, 완곡하게 중화하기보다 원문의 강한 평가를 보존하는 편이 적절합니다.
  doctrine_reference: 윤리적 분별과 기만에 대한 성서적 경고
- issue: ‘I came to myself’의 자기인식
  chosen_reading: ‘내가 제정신으로 돌아와’로 옮겨, 회복된 판단과 반성의 전환을 나타냈습니다.
  alternative_readings:
  - ‘정신을 차리고’
  - ‘내게 돌아와’
  rationale: 원문은 단순 이동이 아니라 내면의 각성을 뜻하므로, 한국어에서도 그 전환을 분명히 해야 합니다.
  doctrine_reference: 회개와 분별의 언어
