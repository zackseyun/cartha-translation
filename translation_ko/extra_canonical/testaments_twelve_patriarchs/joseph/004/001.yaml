revisions:
- from: 내가 그것을 깨달았을 때 나는 죽도록 근심하였습니다. 그러나 그녀가 나간 뒤에는 내가 제정신으로 돌아와 여러 날 동안 그녀를 두고 애통하였습니다. 그것은 내가 그녀의 속임수와 미혹을 알았기 때문입니다.[a]
  to: 내가 깨닫고 나서, 나는 죽을 만큼 슬퍼하였습니다. 그러나 그녀가 나간 뒤에 나는 제정신으로 돌아와 여러 날 동안 그녀를 두고 애통해하였습니다. 내가 그녀의 속임수와 그릇됨을 알았기 때문입니다.
  rationale: 목적어가 없는 νοήσας의 여지를 보존하고, λυπέω의 비탄을 ‘슬퍼하였습니다’로 정확히 옮겼습니다. πλάνη는 특정한 신학적 의미나 타인을 미혹하는 행위로 한정하지 않고 ‘그릇됨’으로 번역했습니다. 대응 각주가 없는 [a] 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
