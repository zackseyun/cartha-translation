id: T12P.JOS.4.8
reference: Testament of Joseph 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ πρὸς αὐτὴν ἔλεγον³⁸ *ὅτι οὐχ³⁹ ἐν ἀκαθαρσίᾳ θέλει⁴⁰ Κύριος τοὺς σεβομένους αὐτόν, οὔτε⁴¹ *τοῖς μοιχεύουσιν εὐδοκεῖ⁴², ⌈ἀλλὰ τοῖς ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις αὐτῷ προσερχομένοις⁴³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/008.yaml
  text: But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”
translation:
  language: ko
  text: 나는 그 여자에게 말했습니다. “주님은 자기를 경외하는 이들이 부정함 가운데 있기를 원하지 않으시며, 간음하는 자들을 기뻐하지도 않으십니다. 오직 깨끗한 마음과 더럽혀지지 않은 입술로 그분께 나아오는 이들을 기뻐하십니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 이 구절의 직접 화자는 인용문 안에서 일반적으로 ‘주님’이라고 부를 수 있는 신적 주체를 지칭하므로, 본문 흐름에 맞는 존칭형을 택했습니다.
- source_word: τοὺς σεβομένους αὐτόν
  english_pob_choice: those who revere him
  chosen_korean: 자기를 경외하는 이들
  alternatives_korean:
  - 그를 경외하는 자들
  - 그를 공경하는 이들
  lexicon: σέβομαι
  rationale: σέβομαι는 단순 감정보다 경외·숭배의 뉘앙스가 강하므로 ‘경외하다’로 옮기되, 자연스러운 한국어 표현을 위해 명사구로 처리했습니다.
- source_word: ἐν ἀκαθαρσίᾳ
  english_pob_choice: in uncleanness
  chosen_korean: 부정함 가운데
  alternatives_korean:
  - 더러움 가운데
  - 불결함 가운데
  lexicon: ἀκαθαρσία
  rationale: 도덕적·종교적 부정 상태를 가리키므로, 물리적 오염보다 넓은 의미를 살린 ‘부정함’을 선택했습니다.
- source_word: τοῖς μοιχεύουσιν
  english_pob_choice: adulterers
  chosen_korean: 간음하는 자들
  alternatives_korean:
  - 간음하는 사람들
  - 간음자들
  lexicon: μοιχεύω
  rationale: 동사형 분사를 살려 행위 중심으로 표현해, 단순한 명사화보다 원문의 현재적 성격을 드러냈습니다.
- source_word: ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις
  english_pob_choice: with a pure heart and undefiled lips
  chosen_korean: 깨끗한 마음과 더럽혀지지 않은 입술로
  alternatives_korean:
  - 정결한 마음과 더럽혀지지 않은 입술로
  - 깨끗한 마음과 흠 없는 입술로
  lexicon: καθαρός / ἀμίαντος
  rationale: ‘καθαρᾷ’는 도덕적 정결을, ‘ἀμίαντοις’는 오염되지 않음을 가리키므로 각각 ‘깨끗한’과 ‘더럽혀지지 않은’으로 구분해 대응했습니다.
theological_decisions:
- issue: 인용문 안의 주어 ‘Κύριος’ 처리
  chosen_reading: 본문의 문맥상 ‘주님’으로 옮겨, 경외·순종의 대상인 신적 권위를 자연스럽게 드러냈습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 직접적인 야훼 인용 표지나 구약 인용 공식이 아니라 도덕적 교훈 인용에 가깝기 때문에, 본문 읽기에서는 예배적 직함인 ‘주님’이 가장 균형적입니다.
  doctrine_reference: 신적 호칭 번역의 문맥적 구분
