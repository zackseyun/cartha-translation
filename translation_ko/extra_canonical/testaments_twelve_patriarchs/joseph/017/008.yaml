  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ οὐχ ὕψωσα ἐμαυτὸν³⁹ ἐν αὐτοῖς ⌜ἐν ἀλαζονείᾳ⌉, διὰ τὴν ⌜κοσμικήν⌉ μου δόξαν⁴⁰, ⌜ἀλλ᾿⁴¹ ἤμην ἐν αὐτοῖς ὡς εἷς τῶν ἐλαχίστων⁴².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/008.yaml
  text: And I did not exalt myself among them in arrogance because of my worldly glory, but I was among them as one of the least.
translation:
  language: ko
  text: 그리고 나는 내 세속적인 영광 때문에 그들 가운데서 교만하게 나 자신을 높이지 않았습니다. 오히려 나는 그들 가운데서 가장 작은 이들 중 하나처럼 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ὕψωσα ἐμαυτὸν
  english_pob_choice: I did not exalt myself
  chosen_korean: 나는 ... 나 자신을 높이지 않았습니다
  alternatives_korean:
  - 나는 스스로를 높이지 않았습니다
  - 나는 나를 높이지 않았습니다
  lexicon: ὑψόω
  rationale: 자기 고양의 의미를 직접 살리되, 합쇼체에서 자연스러운 자기지시 표현으로 옮겼습니다.
- source_word: ἐν αὐτοῖς ἐν ἀλαζονείᾳ
  english_pob_choice: among them in arrogance
  chosen_korean: 그들 가운데서 교만하게
  alternatives_korean:
  - 그들 가운데서 자만하여
  - 그들 사이에서 허세를 부리며
  lexicon: ἀλαζονεία
  rationale: ἀλαζονεία의 핵심인 교만/허세를 유지하되, 문장 흐름상 부사적으로 처리했습니다.
- source_word: κοσμικήν μου δόξαν
  english_pob_choice: my worldly glory
  chosen_korean: 내 세속적인 영광
  alternatives_korean:
  - 내 세상의 영광
  - 내 현세적인 영광
  lexicon: κοσμικός / δόξα
  rationale: κοσμικήν은 단순히 ‘이 세상에 속한’이라는 뜻이므로 세속적인으로 옮기고, δόξα는 여기서 외적 명예/영광을 가리키는 표현으로 보존했습니다.
- source_word: ὡς εἷς τῶν ἐλαχίστων
  english_pob_choice: as one of the least
  chosen_korean: 가장 작은 자들 중 하나처럼
  alternatives_korean:
  - 가장 작은 자들 가운데 하나처럼
  - 가장 보잘것없는 이들 중 한 사람처럼
  lexicon: ἐλάχιστος
  rationale: 비교급적 최소성의 의미를 살려 ‘가장 작은 자들’로 옮기고, ‘처럼’을 통해 비유적 동일시를 보존했습니다.
theological_decisions:
- issue: 권위와 자랑의 대비
  chosen_reading: 화자는 자신의 영광을 이유로 공동체 위에 군림하지 않고, 오히려 가장 낮은 자의 위치를 취했다고 표현했습니다.
  alternative_readings:
  - 단순한 겸손의 자기소개
  - 사회적 신분 격하의 서술
  rationale: 본문의 초점은 덕목 일반보다 자기 고양을 거부한 태도와 공동체 내부의 위계 전도에 있습니다.
  doctrine_reference: 겸손과 섬김의 윤리
