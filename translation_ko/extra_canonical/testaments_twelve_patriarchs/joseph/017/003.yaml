  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Τέρπεται γὰρ⁸ ὁ θεὸς⁷ ⌜ἐπὶ⌉ *ὁμονοίᾳ ἀδελφῶν⁸ καὶ⁷ ἐπὶ προαιρέσει καρδίας⁹ ⌜ἀγαθῆς⌉¹⁰ †εὐδοκοῦσιν¹¹ εἰς ἀγαθόν¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/003.yaml
  text: For God delights in the harmony of brothers and in the good intention of the heart; these are well-pleasing for good.
translation:
  language: ko
  text: 이는 형제들의 화합과 마음의 선한 뜻을 하나님께서 기뻐하십니다. 그러한 것들은 선에 합당하여 기쁘게 여겨집니다.[a][b]
  philosophy: formal
lexical_decisions:
- source_word: ὁ θεὸς ἐπὶ ὁμονοίᾳ ἀδελφῶν
  english_pob_choice: God delights in the harmony of brothers
  chosen_korean: 형제들의 화합
  alternatives_korean:
  - 형제들의 일치
  - 형제들의 화평
  - 형제들 사이의 화합
  lexicon: ὁμονοία
  rationale: ὁμονοία는 단순한 외적 평온보다 ‘한마음으로 어울림’의 뜻이 강하므로, 문맥에 맞게 ‘화합’으로 옮겼습니다.
- source_word: προαιρέσει καρδίας ἀγαθῆς
  english_pob_choice: the good intention of the heart
  chosen_korean: 마음의 선한 뜻
  alternatives_korean:
  - 선한 마음의 의도
  - 선한 마음의 선택
  - 마음의 좋은 의도
  lexicon: προαίρεσις
  rationale: προαίρεσις는 ‘의도/뜻/선택’의 결단적 뉘앙스를 가지므로, ‘뜻’으로 살리되 καρδίας ἀγαθῆς를 자연스럽게 반영해 ‘마음의 선한 뜻’으로 정리했습니다.
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  english_pob_choice: these are well-pleasing for good
  chosen_korean: 선에 합당하여 기쁘게 여겨집니다
  alternatives_korean:
  - 선으로 기쁘게 여겨집니다
  - 선한 것으로 기뻐하십니다
  - 좋은 것으로 기뻐하십니다
  lexicon: εὐδοκέω / εἰς ἀγαθόν
  rationale: 문구가 수동적으로 ‘기쁘게 여겨짐’을 뜻하는 만큼, 단순 직역보다 한국어에서 의미가 분명한 ‘선에 합당하여 기쁘게 여겨집니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 기쁨의 대상과 마지막 절의 성격
  chosen_reading: 첫 절은 하나님이 기뻐하시는 대상을 말하고, 마지막 절은 그 두 항목이 ‘선에 합당하여 기쁘게 여겨지는’ 성격을 덧붙이는 것으로 보았습니다.
  alternative_readings:
  - 두 항목 전체를 하나님이 ‘선으로’ 기뻐하신다고 볼 수 있음
  - εὐδοκοῦσιν εἰς ἀγαθόν을 독립적인 축복 진술로 볼 수 있음
  rationale: 그리스어 구문과 영어 POB의 보정 흔적을 함께 고려할 때, 마지막 절은 새로운 주제보다 앞선 두 항목의 가치 평가를 확장하는 말로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 문맥 해석
