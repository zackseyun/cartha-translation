id: T12P.JOS.17.4
reference: Testament of Joseph 17:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅτε ⌜δὲ⌉¹³ ἦλθον οἱ ἀδελφοί μου εἰς Αἴγυπτον, αὐτοὶ¹⁴ γινώσκουσιν¹⁵ ὅτι *ἀπέστρεψα τὸ ἀργύριον αὐτοῖς¹⁶, καὶ οὐκ ὠνείδισα *αὐτούς, καὶ¹⁷ παρεκάλεσα¹⁸ ⌜αὐτούς⌉¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/004.yaml
  text: And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them.
translation:
  language: ko
  text: 그런데 내 형제들이 이집트에 왔을 때, 그들 자신이 내가 그들의 돈을 그들에게 돌려주었고, 그들을 꾸짖지 않았으며, 오히려 그들을 격려했다는 것을 알고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψα τὸ ἀργύριον αὐτοῖς
  english_pob_choice: I returned their money to them
  chosen_korean: 그들의 돈을 그들에게 돌려주었고
  alternatives_korean:
  - 그들의 은전을 그들에게 되돌려주었고
  - 그 돈을 그들에게 다시 주었고
  lexicon: ἀργύριον
  rationale: ἀργύριον은 여기서 ‘돈/은전’의 일반적 의미로 쓰였으므로, 문맥에 맞게 자연스럽고 직역에 치우치지 않게 ‘돈’으로 옮겼습니다.
- source_word: οὐκ ὠνείδισα αὐτούς
  english_pob_choice: did not reproach them
  chosen_korean: 그들을 꾸짖지 않았으며
  alternatives_korean:
  - 그들을 비난하지 않았으며
  - 그들을 책망하지 않았으며
  lexicon: ὀνειδίζω
  rationale: ὀνειδίζω는 수치 주기·비난하기의 뜻을 가지며, 한국어로는 관계적 뉘앙스를 살린 ‘꾸짖다’가 본문 흐름에 가장 자연스럽습니다.
- source_word: παρεκάλεσα αὐτούς
  english_pob_choice: encouraged them
  chosen_korean: 오히려 그들을 격려했다
  alternatives_korean:
  - 오히려 그들을 위로했다
  - 오히려 그들을 권면했다
  lexicon: παρακαλέω
  rationale: παρακαλέω는 격려, 위로, 권면을 모두 포함할 수 있으므로, 앞의 ‘꾸짖지 않았습니다’와 대조되는 긍정적 반응을 살려 ‘격려했다’로 옮겼습니다.
- source_word: αὐτοὶ γινώσκουσιν
  english_pob_choice: they themselves know
  chosen_korean: 그들 자신이 … 알고 있습니다
  alternatives_korean:
  - 그들 스스로 … 알고 있습니다
  - 바로 그들이 … 알고 있습니다
  lexicon: γινώσκω
  rationale: αὐτοὶ를 강조적으로 반영해 주어를 ‘그들 자신이’로 처리하여, 화자가 자신의 행위를 그들 스스로가 잘 안다고 강조하는 구조를 살렸습니다.
theological_decisions:
- issue: 직접 화자의 회상문을 현대 한국어로 어떻게 유지할지
  chosen_reading: 서술형으로 평이하게 옮기되, 원문의 대조 구조(돈을 돌려줌 / 꾸짖지 않음 / 격려함)를 보존했습니다.
  alternative_readings:
  - 더 문학적인 회상체로 다듬는 방법
  - 세 동작을 한 문장으로 압축하는 방법
  rationale: 본문은 단순한 회상 진술이므로 과도한 해설이나 미화 없이 행위의 순서를 드러내는 것이 원문의 힘을 유지합니다.
  doctrine_reference: source transparency
