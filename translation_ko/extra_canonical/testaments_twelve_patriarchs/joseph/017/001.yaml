source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὁρᾶτε οὖν¹, τέκνα μου², πόσα ὑπέμεινα ἵνα μὴ αἰσχύνω³ τοὺς ἀδελφούς μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/001.yaml
  text: See then, my children, how much I endured so that I might not put my brothers to shame.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 내가 내 형제들을 부끄럽게 하지 않으려고 얼마나 많은 일을 견뎠는지 보십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε οὖν
  english_pob_choice: See then
  chosen_korean: 그러니 … 보십시오
  alternatives_korean:
  - 그러니 … 보아라
  - 그러므로 … 보십시오
  lexicon: ὁράω
  rationale: 호소의 뉘앙스를 살리기 위해 명령형을 유지하되, 합쇼체로 공손하게 옮겼습니다. οὖν은 앞말을 잇는 ‘그러니’로 처리했습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 아들들아
  lexicon: τέκνον
  rationale: 직역에 가깝게 ‘자녀들’로 옮겨 친근한 호칭을 살렸습니다. 한국어 호소문맥에서 자연스러운 직접 호칭을 위해 ‘-아’를 붙였습니다.
- source_word: πόσα ὑπέμεινα
  english_pob_choice: how much I endured
  chosen_korean: 내가 얼마나 많은 일을 견뎠는지
  alternatives_korean:
  - 내가 얼마나 참았는지
  - 내가 얼마나 많은 것을 견뎠는지
  lexicon: ὑπομένω
  rationale: ποσά의 양감과 ὑπέμεινα의 인내·감내를 함께 드러내기 위해 ‘얼마나 많은 일’을 넣었습니다. 단순히 ‘참았다’보다 견딤의 강도를 살렸습니다.
- source_word: αἰσχύνω
  english_pob_choice: put ... to shame
  chosen_korean: 부끄럽게 하지 않으려는 것이었습니다
  alternatives_korean:
  - 수치를 당하게 하지 않으려는 것이었습니다
  - 창피를 주지 않으려는 것이었습니다
  lexicon: αἰσχύνω
  rationale: 상대에게 수치를 돌리는 동사를 한국어의 ‘부끄럽게 하다’로 자연스럽게 옮겼습니다. 문맥상 목적절이므로 ‘하지 않으려는 것’으로 처리했습니다.
theological_decisions:
- issue: 형제들을 해치거나 버리는 것이 아니라 ‘부끄럽게 하지 않음’이 인내의 목적이라는 점
  chosen_reading: 본문의 핵심을 도덕적 체면이 아니라 형제들에 대한 해를 피하려는 자기 절제로 읽었습니다.
  alternative_readings:
  - 단순한 예의나 체면을 지키려는 말
  - 감정적 갈등을 숨기려는 말
  rationale: αἰσχύνω는 여기서 공개적 수치 부과를 뜻하므로, 번역도 공동체적 관계를 해치지 않으려는 의도를 선명하게 살려야 합니다.
  doctrine_reference: 윤리적 자기절제와 형제 사랑
