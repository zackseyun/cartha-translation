  text: And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure.
translation:
  language: ko
  text: 야곱 내 아버지가 죽은 뒤에, 나는 그들을 더욱 사랑했습니다. 그리고 그들이 무엇을 원하든지 나는 그것을 한없이 해 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ θάνατον Ἰακώβ, τοῦ πατρός μου
  english_pob_choice: after the death of Jacob my father
  chosen_korean: 야곱 내 아버지가 죽은 뒤에
  alternatives_korean:
  - 야곱, 내 아버지가 죽은 뒤에
  - 내 아버지 야곱이 죽은 뒤에
  lexicon: μετά + accusative; θάνατος; πατήρ
  rationale: 시간적 선행을 자연스러운 현대 한국어로 옮기되, ‘내 아버지’가 야곱을 수식한다는 점을 분명히 했습니다.
- source_word: περισσοτέρως
  english_pob_choice: even more
  chosen_korean: 더욱
  alternatives_korean:
  - 더
  - 훨씬 더
  - 더 많이
  lexicon: περισσότερον
  rationale: 비교의 강화를 간결하게 살리되, 다음 절의 과장 표현과 중복되지 않도록 자연스럽게 처리했습니다.
- source_word: ὑπερεκπερισσοῦ
  english_pob_choice: beyond measure
  chosen_korean: 한없이
  alternatives_korean:
  - 말할 수 없을 만큼
  - 헤아릴 수 없을 만큼
  - 지나치게
  lexicon: ὑπερεκπερισσοῦ
  rationale: 원문의 강한 과장 표현을 보존하되, 한국어에서 긍정적 관대함을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 형제들에 대한 사랑과 호의의 강도
  chosen_reading: ‘더욱 사랑했습니다’와 ‘한없이 해 주었습니다’로 강한 애정과 호의를 함께 드러냈습니다.
  alternative_readings:
  - ‘매우 사랑했습니다’
  - ‘그들이 원하는 것을 모두 해 주었습니다’
  rationale: 원문은 사랑의 증대(περισσοτέρως)와 행위의 과잉(ὑπερεκπερισσοῦ)을 병렬로 강조하므로, 둘을 모두 약화하지 않도록 유지했습니다.
  doctrine_reference: 서사 문맥의 수사적 강조
