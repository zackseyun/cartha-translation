id: T12P.JOS.17.7
reference: Testament of Joseph 17:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ⌉³⁰ οἱ υἱοὶ *αὐτῶν υἱοί μου³¹, *καὶ οἱ υἱοί μου ὡς δοῦλοι αὐτῶν³², καὶ³³ ἡ ψυχὴ *αὐτῶν ψυχή μου³⁴, καὶ πᾶν ἄλγημα³⁵ αὐτῶν ἄλγημά μου³⁶, ⌜καὶ πᾶσα μαλακία αὐτῶν *ἀσθένειά μου, καὶ³⁷ ἡ βουλὴ³⁷⌉ αὐτῶν βουλή μου³⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/007.yaml
  text: And their sons were my sons, and my sons were as slaves to them, and their souls were my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose.
translation:
  language: ko
  text: 그리고 그들의 아들들은 내 아들들이었고, 내 아들들은 그들의 종과 같았으며, 그들의 영혼은 내 영혼이었고, 그들의 모든 고통은 내 고통이었으며, 그들의 모든 연약함은 내 연약함이었고, 그들의 뜻은 내 뜻이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ υἱοὶ αὐτῶν / υἱοί μου
  english_pob_choice: their sons were my sons
  chosen_korean: 그들의 아들들은 내 아들들이었고
  alternatives_korean:
  - 그들의 아들들은 내 아들이었고
  - 그들의 아들들은 내 자식들이었고
  lexicon: υἱός → 아들
  rationale: 직역적으로 ‘아들들’의 상응성을 살리되, 문맥의 평행 구조를 따라 자연스러운 서술형으로 옮겼습니다.
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 그들의 종과 같았으며
  alternatives_korean:
  - 그들의 노예였으며
  - 그들의 종이었으며
  lexicon: δοῦλος → 종 / 노예
  rationale: 영어 POB가 ‘slaves’로 번역해 종속성과 소유 관계를 강하게 드러내므로, 한국어에서는 독자가 바로 이해할 수 있도록 ‘종과 같았으며’로 처리하되 직설적 동일시를 피하지 않도록 했습니다.
- source_word: ψυχή
  english_pob_choice: souls
  chosen_korean: 영혼은
  alternatives_korean:
  - 생명은
  - 목숨은
  lexicon: ψυχή → 영혼
  rationale: 본문의 평행적 동일시 구조를 따라 ‘영혼’으로 옮기되, 한국어 어감상 단수보다 복수 주어와 맞는 일반적 개념어로 유지했습니다.
- source_word: ἄλγημα / μαλακία
  english_pob_choice: pain / weakness
  chosen_korean: 고통 / 연약함
  alternatives_korean:
  - 아픔 / 약함
  - 고통 / 병약함
  lexicon: ἄλγημα → 고통; μαλακία → 연약함
  rationale: ἄλγημα의 고통성과 μαλακία의 허약·연약함을 구별해 살리면서도, 현대 한국어에서 과도하게 의학적으로 들리지 않도록 ‘연약함’을 선택했습니다.
- source_word: βουλή
  english_pob_choice: purpose
  chosen_korean: 뜻
  alternatives_korean:
  - 계획
  - 의도
  lexicon: βουλή → 뜻
  rationale: βουλή의 의도·계획·결의의 폭을 고려하되, 문장 말미의 평행성과 문학적 압축을 살리는 한국어로 ‘뜻’을 택했습니다.
theological_decisions:
- issue: ‘their sons were my sons’와 ‘my sons were as slaves to them’의 강한 소유·지배 관계 표현
  chosen_reading: 가족/혈연 동일시와 종속 관계를 함께 보존했습니다.
  alternative_readings:
  - 관계를 완화해 ‘그들의 아들들은 내 자식들이었고, 내 아들들은 그들의 종이었습니다’로 순화
  - 사회적 충격을 줄이기 위해 ‘종과 같았으며’를 더 부드럽게 해석
  rationale: 본문은 상호 동일시만이 아니라 불균형한 지배 상태까지 병치하므로, 이를 완화하지 않고 그대로 드러내야 문장의 수사적 긴장이 보존됩니다.
  doctrine_reference: 본문 해설 수준의 수사적-윤리적 읽기
