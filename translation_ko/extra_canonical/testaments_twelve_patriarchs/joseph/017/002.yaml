source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ὑμεῖς ⌜οὖν⌉ ἀγαπᾶτε ἀλλήλους, ⌜καὶ ἐν μακροθυμίᾳ⁴ *συγκρύπτετε ἀλλήλων⁵ τὰ ἐλαττώματα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/002.yaml
  text: You also, therefore, love one another, and with patience conceal one another’s shortcomings.
translation:
  language: ko
  text: 그러므로 여러분도 서로 사랑하십시오. 그리고 오래 참음으로 서로의 부족한 점을 덮으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶτε ἀλλήλους
  english_pob_choice: love one another
  chosen_korean: 서로 사랑하십시오
  alternatives_korean:
  - 서로를 사랑하십시오
  - 서로 사랑하시오
  lexicon: ἀγαπάω
  rationale: 서로에 대한 상호적 사랑 명령을 자연스러운 합쇼체로 옮겼습니다. 목적어 표지는 한국어에서 중복감이 있어 생략해도 의미가 유지됩니다.
- source_word: ἐν μακροθυμίᾳ
  english_pob_choice: with patience
  chosen_korean: 오래 참음으로
  alternatives_korean:
  - 인내로
  - 오래 참아
  lexicon: μακροθυμία
  rationale: 단순한 성질로서의 ‘인내’보다, 다른 사람의 약함을 견디는 뉘앙스를 살리기 위해 ‘오래 참음’으로 옮겼습니다.
- source_word: συγκρύπτετε
  english_pob_choice: conceal
  chosen_korean: 덮으십시오
  alternatives_korean:
  - 숨기십시오
  - 감추십시오
  lexicon: συγκρύπτω
  rationale: 문맥상 죄를 은폐한다기보다 공동체 안에서 서로의 결함을 너그럽게 덮어 주는 뜻이므로, 직역적 ‘숨기다’보다 관계적 함의를 드러내는 ‘덮다’를 선택했습니다.
- source_word: τὰ ἐλαττώματα
  english_pob_choice: shortcomings
  chosen_korean: 부족한 점
  alternatives_korean:
  - 결점
  - 허물
  - 단점
  lexicon: ἐλάττωμα
  rationale: 도덕적 정죄를 강하게 띠는 단어보다, 사람의 미흡함을 폭넓게 가리키는 ‘부족한 점’이 원문의 완곡한 표현에 가깝습니다.
theological_decisions:
- issue: 공동체 윤리의 수위
  chosen_reading: 상호 사랑과 인내로 서로의 부족함을 덮는 공동체적 권면으로 읽었습니다.
  alternative_readings:
  - 개인의 결함을 단순히 무시하라는 뜻
  - 죄를 묵인하라는 뜻
  rationale: 본문은 은폐 자체를 미화하기보다 사랑과 오래 참음이라는 덕목 아래 공동체 관계를 보존하라는 권면입니다.
  doctrine_reference: 공동체 윤리/화평
