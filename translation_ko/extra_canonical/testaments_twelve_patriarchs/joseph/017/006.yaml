  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ οὐκ ἀφῆκα²⁵ αὐτοὺς²⁶ θλιβῆναι *ἕως μικροῦ πράγματος²⁷. καίγε πᾶν ὃ ἦν ἐν τῇ²⁸ χειρί μου αὐτοῖς δέδωκα²⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/006.yaml
  text: And I did not allow them to be distressed even in the smallest matter; indeed, everything that was in my hand I gave to them.
translation:
  language: ko
  text: 그리고 나는 그들을 조금도 괴로워하지 않게 하였고, 심지어 가장 작은 일에 있어서도 그러하였습니다. 더구나 내 손에 있던 것은 무엇이든 그들에게 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκα αὐτοὺς θλιβῆναι
  english_pob_choice: I did not allow them to be distressed
  chosen_korean: “그들을 조금도 괴로워하지 않게 하였고”
  alternatives_korean:
  - 그들이 고통받지 않게 하였고
  - 그들이 괴로움을 겪지 않게 하였고
  lexicon: ἀφίημι + θλίβω
  rationale: 허용하지 않음을 드러내는 동사구로 이해하여, 단순한 감정 상태보다 ‘괴로워하게 두지 않다’는 의미를 살렸습니다.
- source_word: ἕως μικροῦ πράγματος
  english_pob_choice: even in the smallest matter
  chosen_korean: “심지어 가장 작은 일에 있어서도”
  alternatives_korean:
  - 심지어 아주 작은 일에서도
  - 아주 사소한 일에서도
  lexicon: ἕως + μικρός + πρᾶγμα
  rationale: ‘smallest matter’의 범위를 자연스러운 한국어로 옮기되, 과장 없이 최소 단위를 강조하는 표현으로 처리했습니다.
- source_word: καίγε
  english_pob_choice: indeed
  chosen_korean: “더구나”
  alternatives_korean:
  - 참으로
  - 실로
  - 심지어
  lexicon: καίγε
  rationale: 개정된 영어 POB의 ‘indeed’에 맞추어, 단순 대비가 아니라 덧붙이는 강조를 나타내는 표현으로 옮겼습니다.
- source_word: ἐν τῇ χειρί μου
  english_pob_choice: what was in my hand
  chosen_korean: “내 손에 있던 것은 무엇이든”
  alternatives_korean:
  - 내 손에 있던 모든 것
  - 내가 가진 것은 무엇이든
  lexicon: χείρ
  rationale: 직역적 이미지인 ‘손에 있다’를 유지하면서, 소유·처분 가능한 범위를 드러내도록 자연스럽게 다듬었습니다.
theological_decisions:
- issue: καίγε의 기능
  chosen_reading: 연결된 두 절 사이에서 대조가 아니라 강화·첨가의 뉘앙스로 읽었습니다.
  alternative_readings:
  - ‘그러나’ 같은 역접으로 읽는 해석
  - 단순 접속으로 평이하게 처리하는 해석
  rationale: 영어 POB의 수정 근거와 맞추어, 문맥상 전환보다는 앞 절을 더 강하게 보태는 용법으로 반영했습니다.
  doctrine_reference: 문법·담화 기능에 관한 결정이며 교리적 쟁점은 아닙니다.
