base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006.yaml
  text: 1 And after this she sent me food mixed with sorcery[a]. 2 But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me, together with the dish, a sword; and I understood that it was a scheme to lead me astray. 3 So after he had gone out, I ate neither that food nor any of her other foods, but wept without tasting them. 4 Then after one day she came to me, and when she recognized the food, she said to me, “Why is it that you did not eat the food?” 5 And I said to her, “Because you filled it with deadly sorcery. And how did you say, ‘I do not draw near to idols, but to the Lord alone’? 6 Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and for this reason I kept it as evidence against you, to expose you, in hope that perhaps, when you saw it[b][a], you might repent.”
  footnotes:
  - marker: a
    text: The 'terrifying man' is not identified in the Greek text; the figure may be visionary, symbolic, or connected with the attempted sorcery.
    reason: alternative_reading
    anchor_ref: '6:2'
  - marker: a
    text: Or 'a trick' / 'a magical contrivance' for leading me astray' for the phrase rendered 'a scheme to lead me astray.'
    reason: lexical_alternative
    anchor_ref: '6:2'
  - marker: b
    text: Or 'for your reproof' / 'for your conviction' for 'as evidence against you, to expose you.'
    reason: lexical_alternative
    anchor_ref: '6:6'
translation:
  language: ko
  text: 1 그리고 그 뒤에 그녀가 내게 마법이 섞인 음식[a]을 보냈습니다. 2 그런데 그것을 가져오는 내시가 왔을 때, 나는 고개를 들어 보니 무서운 한 사람이 접시와 함께 칼을 내게 건네고 있었습니다. 그래서 그것이 나를 잘못된 길로 이끄는 계략임을 알게 되었습니다. 3 그가 나간 뒤 나는 그 음식도, 그녀의 다른 음식도 맛보지 않고 먹지 않았으며, 눈물만 흘렸습니다. 4 그런데 하루 뒤에 그녀가 내게 와서 그 음식을 알아보고는 내게 말했습니다. “어찌하여 그 음식을 먹지 않았느냐?” 5 나는 그녀에게 말했습니다. “당신이 그것을 죽음의 마법으로 채웠기 때문입니다. 그리고 어떻게 ‘나는 우상들에게는 가까이 가지 않고 주님께만 나아간다’고 말할 수 있었습니까? 6 이제 알라, 내 아버지의 하나님께서 그의 천사를 통해 당신의 악함을 내게 드러내셨으며, 나는 당신을 드러내는 증거로 그것을 보관해 두었습니다[b]. 아마도 당신이 그것을 보게 되면 회개할지도 모르기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  english_pob_choice: food
  chosen_korean: 음식
  alternatives_korean:
  - 먹을 것
  - 식사
  - 음식물
  lexicon: LSJ
  rationale: βρῶμα는 특정 요리보다 일반적인 먹을거리를 가리키므로, 한국어에서도 가장 자연스러운 일반어인 ‘음식’으로 옮겼습니다.
- source_word: γοητείᾳ πεφυρμένον / γοητείας
  english_pob_choice: mixed with sorcery / deadly sorcery
  chosen_korean: 마법이 섞인 / 죽음의 마법
  alternatives_korean:
  - 주술이 섞인 / 죽음을 부르는 주술
  - 요술이 섞인 / 치명적인 마법
  lexicon: LSJ
  rationale: γοητεία는 단순한 속임수보다 주술·마법의 의미가 강하므로, 본문의 위협성과 POB의 독법을 살려 ‘마법’으로 옮겼습니다.
- source_word: φοβερὸν ἄνδρα
  english_pob_choice: a terrifying man
  chosen_korean: 무서운 한 사람
  alternatives_korean:
  - 두려운 한 사람
  - 섬뜩한 사람
  - 소름 끼치는 사람
  lexicon: LSJ
  rationale: 장면의 불길함과 위협을 살리되 과도한 해석을 피하기 위해, 인물의 정체를 규정하지 않는 ‘무서운 한 사람’으로 옮겼습니다.
- source_word: περιέργεια ἐστὶν εἰς ἀποπλάνησίν μου
  english_pob_choice: it was a scheme to lead me astray
  chosen_korean: 나를 잘못된 길로 이끄는 계략
  alternatives_korean:
  - 나를 속이려는 술책
  - 나를 미혹하려는 책략
  - 나를 유혹해 빗나가게 하려는 계책
  lexicon: LSJ
  rationale: περιέργεια는 단순한 ‘호기심’이 아니라 간섭적이고 교묘한 술책을 뜻하므로, 결과 절인 ἀποπλάνησις와 함께 ‘계략’으로 묶어 자연스럽게 표현했습니다.
- source_word: εἰδώλοις ... Κυρίῳ μόνῳ
  english_pob_choice: idols ... the Lord alone
  chosen_korean: 우상들에게는 가까이 가지 않고 주님께만 나아간다
  alternatives_korean:
  - 우상들에게는 다가가지 않고 주님께만 나아간다
  - 우상들에게는 가까이하지 않고 오직 주님께만 간다
  lexicon: LSJ
  rationale: προσεγγίζω의 ‘가까이 가다/접근하다’를 살려 우상숭배와의 거리두기를 드러냈고, Κυρίῳ μόνῳ는 ‘주님께만’으로 독점성을 유지했습니다.
- source_word: δι’ ἀγγέλου αὐτοῦ
  english_pob_choice: through his angel
  chosen_korean: 그의 천사를 통해
  alternatives_korean:
  - 천사를 통하여
  - 그의 사자를 통해
  lexicon: LSJ
  rationale: 계시의 매개를 드러내는 직설적 표현이므로, ‘천사’를 유지해 원문의 계시성에 맞췄습니다.
- source_word: εἰς ἔλεγχόν σου
  english_pob_choice: as evidence against you, to expose you
  chosen_korean: 당신을 드러내는 증거로
  alternatives_korean:
  - 당신을 책망하는 증거로
  - 당신을 꾸짖기 위한 증거로
  - 당신을 입증해 보이는 자료로
  lexicon: LSJ
  rationale: ἔλεγχος는 증거, 책망, 드러냄의 범위를 가지므로, 본문의 고발·폭로 기능을 살려 ‘증거로’와 ‘드러내는’의 의미를 함께 반영했습니다.
theological_decisions:
- issue: 무서운 한 사람과 칼의 정체
  chosen_reading: 인물의 정체를 확정하지 않고, 환시적·상징적이거나 그 유혹 사건과 연결된 위협적 장면으로 남겨 둡니다.
  alternative_readings:
  - 악한 영의 현현으로 본다
  - 천사의 경고로 본다
  - 상징적 환상으로 본다
  rationale: 그리스어 본문은 그 인물을 설명하지 않으므로, 번역도 그 모호성을 보존하여 독자가 원문의 긴장을 그대로 느끼게 해야 합니다.
  doctrine_reference: 원문 불확정성 보존
- issue: μετανοήσεις의 처리
  chosen_reading: 회개할지도 모르기
  alternative_readings:
  - 생각을 바꿀지도 모르기
  - 돌이킬지도 모르기
  rationale: 구체적 죄를 지적하며 돌이킴을 촉구하는 문맥이므로, 한국어 성경 관용에 맞는 ‘회개’가 가장 직접적입니다.
  doctrine_reference: specific-sin contexts → repent
