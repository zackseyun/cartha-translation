  terminology: γοητεία는 ‘주술’로 옮겨 초자연적·주술적 의미를 보존했고, ἀποπλάνησις는 문맥상 ‘미혹하려는’으로 옮겼습니다. ‘주님’, ‘하나님’, ‘우상’, ‘회개’는 표준 한국어 성경 문체와 원문의 종교적 어휘에 부합합니다. 7절의 ‘아브라함의 천사’는 그리스어의 비정상적·압축적인 표현을 교리적으로 해석하지 않고 직역에 가깝게 보존했으며, 본문 괄호 표시도 주석으로 밝혔습니다.
