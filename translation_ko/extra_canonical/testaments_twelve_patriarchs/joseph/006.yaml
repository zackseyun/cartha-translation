  revised_text: 1 그 뒤에 그녀가 제게 주술이 섞인 음식을 보냈습니다. 2 그런데 그것을 가져온 내시가 왔을 때, 저는 눈을 들어 보았더니 무서운 사람이 접시와 함께 칼을 제게 건네고 있었습니다[a]. 그래서 저는 그것이 저를 미혹하려는 술책임을 깨달았습니다[b]. 3 그가 나간 뒤, 저는 그 음식도 그녀의 다른 어떤 음식도 먹지 않고 맛보지 않은 채 울었습니다. 4 하루 뒤에 그녀가 제게 와서 그 음식을 보고 제게 말했습니다. “어찌하여 그 음식을 먹지 않았느냐?” 5 저는 그녀에게 말했습니다. “당신이 그것을 죽음에 이르는 주술로 채웠기 때문입니다. 그런데 어떻게 ‘나는 우상들에게 가까이 가지 않고 주님께만 나아간다’고 말할 수 있었습니까? 6 그러므로 이제 아십시오. 내 아버지의 하나님께서 그의 천사를 통하여 당신의 악함을 제게 드러내셨습니다. 저는 당신을 책망할 증거로 그것을 보관해 두었습니다. 혹시 당신이 그것을 보고 회개할지도 모르기 때문입니다.” 7 또 경건하고 절제하는 사람들은 악한 자들의 악에 굴복하지 않는다는 것을 당신이 알게 하려고, 보십시오, 제가 그것을 당신 앞에서 먹겠습니다. 이렇게 말하고 저는 다음과 같이 말했습니다. “내 조상들의 하나님과 아브라함의 천사가 나와 함께하실 것입니다.” 그리고 저는 먹었습니다[c]. 8 그녀는 이것을 보고 얼굴을 땅에 대고 제 발 앞에 엎드려 울었습니다. 저는 그녀를 일으켜 세우고 타일렀습니다. 9 그녀는 다시는 이 불경한 일을 하지 않겠다고 제게 약속했습니다.
