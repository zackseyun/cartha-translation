id: T12P.JOS.12.11
reference: Testament of Joseph 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Νῦν οὖν ποίησον μετ᾿ αὐτοῦ¹⁷ κρίσιν, καὶ ἀφελοῦ¹⁸ τὸν νεανίαν¹⁹ εἰς *τὸν οἶκον ἡμῶν²⁰, καὶ *εὐλογῆσαί σε ἔχει²¹ *ὁ Θεὸς τῶν Ἑβραίων²², ὅτι χάρις *ἐκ τοῦ²³ οὐρανοῦ ἐστι *πρὸς αὐτόν²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/011.yaml
  text: Now therefore render judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you, because grace from heaven is upon him.
translation:
  language: ko
  text: 그러므로 이제 그와 관련하여 판결을 내리시고, 그 젊은이를 우리 집으로 데려가십시오. 그러면 히브리 사람들의 하나님께서 당신에게 복을 주실 것입니다. 이는 하늘로부터 오는 은혜가 그에게 있기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποίησον ... κρίσιν μετ᾿ αὐτοῦ
  english_pob_choice: render judgment concerning him
  chosen_korean: 그와 관련하여 판결을 내리시고
  alternatives_korean:
  - 그에 대하여 판단하시고
  - 그를 심판하시고
  lexicon: κρίσις
  rationale: POB의 영어가 ‘render judgment concerning him’으로 수정된 점을 따라, 행위의 대상이 ‘그와 관련된 판결’임을 드러내는 표현을 택했습니다. ‘심판’은 종교적·최종심판 뉘앙스가 강해 여기서는 덜 적절합니다.
- source_word: τὸν νεανίαν
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 청년
  - 그 소년
  lexicon: νεανίας
  rationale: 네아니아스는 일반적으로 성인에 가까운 ‘젊은 남자’를 가리키므로, 너무 어린 ‘소년’보다 중립적인 ‘젊은이’가 더 가깝습니다.
- source_word: ὁ Θεὸς τῶν Ἑβραίων
  english_pob_choice: the God of the Hebrews
  chosen_korean: 히브리 사람들의 하나님
  alternatives_korean:
  - 히브리인의 하나님
  - 히브리인들의 하나님
  lexicon: ὁ Θεὸς τῶν Ἑβραίων
  rationale: 소유격 관계를 자연스럽게 살리면서도, 한국어에서 민족 집단을 지칭하는 유연한 표현으로 옮겼습니다. ‘히브리인’보다 ‘히브리 사람들’이 문맥상 더 구어적이면서도 오해가 적습니다.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ... πρὸς αὐτόν
  english_pob_choice: grace from heaven is upon him
  chosen_korean: 하늘로부터 오는 은혜가 그에게 있기 때문입니다
  alternatives_korean:
  - 하늘로부터 오는 은혜가 그 위에 있기 때문입니다
  - 하늘에서 온 은혜가 그에게 있기 때문입니다
  lexicon: χάρις
  rationale: ‘upon him’의 상태성을 한국어에서 가장 자연스럽게 풀어 ‘그에게 있다’로 옮기되, 출처가 ‘하늘로부터’임을 유지했습니다. ‘위에’는 직역성이 강하고 한국어 흐름이 다소 부자연스럽습니다.
theological_decisions:
- issue: 하늘로부터 오는 은혜와 축복의 인과 관계
  chosen_reading: 하늘로부터 오는 은혜가 그에게 있으므로, 하나님이 당신에게 복을 주실 것이라는 논리 구조를 그대로 유지했습니다.
  alternative_readings:
  - 문장 전체를 단순한 두 개의 독립 진술로 나누는 읽기
  - ‘은혜’ 대신 일반적인 ‘호의’로 완화하는 읽기
  rationale: 본문은 ‘은혜’와 ‘복 주심’을 연결해 인물의 특별한 상태를 근거로 축복을 말합니다. 이를 약화하지 않고, 원문의 설득 논리를 보존했습니다.
  doctrine_reference: 성경의 은혜-축복 연계 일반
- issue: ‘판결’의 법정적 뉘앙스
  chosen_reading: 중립적인 법정/판결 표현으로 유지해, 문맥의 요구를 살렸습니다.
  alternative_readings:
  - ‘심판’으로 강하게 번역하는 읽기
  - ‘판단’으로 더 약하게 번역하는 읽기
  rationale: 이 구절은 도덕적 비난보다 실제 결단과 판결을 요청하는 맥락입니다. 따라서 법정적이되 과도하게 종말론적이지 않은 표현이 적합합니다.
  doctrine_reference: 문맥 우선 번역 원칙
