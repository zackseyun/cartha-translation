  to: 그러므로 이제 그에 대하여 판결을 내리시고, 그 젊은이를 우리 집으로 데려가십시오. 그러면 히브리 사람들의 하나님께서 당신에게 복을 주실 것입니다. 이는 하늘에서 온 은혜가 그에게 임해 있기 때문입니다.
