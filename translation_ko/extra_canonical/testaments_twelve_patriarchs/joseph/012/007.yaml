  naturalness: ‘그가 내 손에 있을 때’와 ‘그의 금과 은과 재산을 늘려 주셨습니다’는 현대 표준 한국어의 자연스러운 합쇼체이며, 원문의 관계와 물질적 번영의 내용을 분명히 합니다.
  terminology: ‘하나님’, ‘복을 주시고’, ‘금과 은’, ‘재산’은 무난합니다. ‘재산’은 이 문맥에서 ἔργῳ를 물질적 소유/재화로 이해한 영어 POB의 ‘goods’를 자연스럽게 반영합니다.
