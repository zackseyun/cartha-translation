  text: And God blessed him in my hand, and increased him on my account in gold and silver and goods.
translation:
  language: ko
  text: 그리고 하나님께서는 그가 내 손에 있을 때 그에게 복을 주시고, 그의 금과 은과 재산을 늘려 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χειρί μου
  english_pob_choice: in my hand
  chosen_korean: 내 손으로
  alternatives_korean:
  - 내 손에
  - 내 손안에서
  lexicon: χειρ
  rationale: 단수형 ‘χειρί’에 맞추어 ‘내 손으로’라고 옮겨, 행위의 매개와 수단을 드러내면서도 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: ἐπλήθυνεν
  english_pob_choice: increased
  chosen_korean: 번성하게 하셨습니다
  alternatives_korean:
  - 증가시키셨습니다
  - 늘리셨습니다
  lexicon: πληθύνω
  rationale: 단순한 수량 증가보다 축복으로 인한 번영의 확장을 나타내므로, 문맥상 더 온전한 ‘번성하게 하셨습니다’를 택했습니다.
- source_word: ἔργῳ
  english_pob_choice: goods
  chosen_korean: 재산
  alternatives_korean:
  - 물건
  - 소유물
  - 재물
  lexicon: ἔργον
  rationale: 이 문맥에서는 ‘일/작업’보다 물질적 소유를 가리키는 뜻으로 이해되어, POB의 ‘goods’를 한국어로 자연스럽게 풀어 ‘재산’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 축복과 번성의 직접 행위자로 제시되는 표현
  chosen_reading: ‘하나님께서… 복 주셨고… 번성하게 하셨습니다’로 직접적 주어-동사 구조를 유지했습니다.
  alternative_readings:
  - 수동적으로 ‘그가 복을 받았습니다’
  - 완곡하게 ‘형통하게 되었습니다’
  rationale: 원문은 하나님을 명시적 행위자로 전면에 두므로, 그 주도성을 약화하지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 섭리와 축복의 주권적 행위
