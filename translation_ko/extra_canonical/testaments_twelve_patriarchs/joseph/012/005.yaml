  text: Διὰ πᾶσιν ἔδοξεν *τοῦ εἶναι²⁴ με εἰς Αἴγυπτον πρὸς *τὸν μετάβολον τῆς ἐμπορίας²⁵ αὐτῶν, ἕως ὅτου²⁶ ἐπιστρέψουσιν²⁷ φέροντες²⁸ ἐμπορίαν²⁹.
