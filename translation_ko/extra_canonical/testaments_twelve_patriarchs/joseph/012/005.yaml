  text: So it seemed good to all of them for me to remain in Egypt with the merchant of their trade until they should return bringing merchandise.
translation:
  language: ko
  text: 그러므로 그들 모두에게는 내가 이집트에 머물며 그들의 무역의 상인과 함께 있게 하는 것이 좋게 여겨졌습니다. 그들이 무역품을 가지고 돌아올 때까지 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ πᾶσιν ἔδοξεν
  english_pob_choice: So it seemed good to all of them
  chosen_korean: 그들 모두에게는 ... 것이 좋게 여겨졌습니다
  alternatives_korean:
  - 그들 모두가 좋게 여겼습니다
  - 모두에게 옳게 보였습니다
  lexicon: ἔδοξεν
  rationale: 완료된 판단의 수동적 결과를 자연스럽게 살리면서, ‘좋게 여겨지다’로 공적 결정의 뉘앙스를 유지했습니다.
- source_word: τοῦ εἶναι με εἰς Αἴγυπτον
  english_pob_choice: for me to remain in Egypt
  chosen_korean: 내가 이집트에 머물며
  alternatives_korean:
  - 내가 이집트에 있게 하며
  - 내가 이집트에 남아 있게 하며
  lexicon: εἶναι
  rationale: 부정사 구문을 ‘머물며’로 옮겨, POB의 수정 취지대로 ‘남겨 두다’보다 상태 지속을 더 직접적으로 반영했습니다.
- source_word: τὸν μετάβολον τῆς ἐμπορίας αὐτῶν
  english_pob_choice: the merchant of their trade
  chosen_korean: 그들의 무역의 상인
  alternatives_korean:
  - 그들의 무역상
  - 그들의 거래의 상인
  lexicon: μετάβολος / ἐμπορία
  rationale: 원문의 어색한 소유격 결합을 그대로 평탄화하지 않고, ‘무역의 상인’으로 연결해 출처의 표현을 최대한 보존했습니다.
- source_word: ἐμπορίαν
  english_pob_choice: merchandise
  chosen_korean: 무역품
  alternatives_korean:
  - 상품
  - 장사 물건
  lexicon: ἐμπορία
  rationale: 반복되는 ἐμπορία 계열 어휘를 ‘무역품’으로 옮겨, 앞의 ‘무역’과 어근 연결을 드러냈습니다.
