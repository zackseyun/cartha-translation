id: T12P.JOS.12.1
reference: Testament of Joseph 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐρχόμενος δὲ¹⁰ *μετὰ τῶν Ἰσμαϊλιτῶν¹¹ *ἐπηρώτων με λέγοντες· Δοῦλος εἶ; Κἀγὼ εἶπον¹² ὅτι δοῦλός¹³ εἰμι¹⁴ ἐξ οἴκου¹⁵, ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/001.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a slave?” And I said that I was a household slave, so that I might not put my brothers to shame.
translation:
  language: ko
  text: 그리고 내가 이스마엘 사람들과 함께 오고 있을 때, 그들이 계속 나에게 “네가 종이냐?” 하고 물었습니다. 나는 “나는 집안의 종입니다”라고 대답했습니다. 그것은 내가 형제들을 부끄럽게 하지 않기 위해서였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος / δοῦλός εἰμι
  english_pob_choice: slave / a household slave
  chosen_korean: 종 / 집안의 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: δοῦλος
  rationale: English POB가 'slave'를 유지해 속박된 신분을 드러내므로, 한국어도 완곡한 '하인'보다 신분성을 보존하는 '종'을 기본으로 두고, 'ἐξ οἴκου'는 '집안의 종'으로 구체화했습니다.
- source_word: ἐξ οἴκου
  english_pob_choice: household
  chosen_korean: 집안의
  alternatives_korean:
  - 가문의
  - 집의
  lexicon: οἶκος
  rationale: οἶκος는 단순한 건물이 아니라 가정/가구를 가리키므로, 신분 표현인 '집안의 종'으로 자연스럽게 옮겼습니다.
- source_word: αἰσχύνω
  english_pob_choice: put ... to shame / disgrace
  chosen_korean: 부끄럽게 하지
  alternatives_korean:
  - 수치를 주지
  - 망신시키지
  lexicon: αἰσχύνω
  rationale: 문맥상 형제들에게 shame를 주지 않으려는 목적이므로, 직접적인 '수치'보다 한국어에서 자연스럽고 문맥에 맞는 '부끄럽게 하지'를 택했습니다.
- source_word: μετὰ τῶν Ἰσμαϊλιτῶν
  english_pob_choice: with the Ishmaelites
  chosen_korean: 이스마엘 사람들과 함께
  alternatives_korean:
  - 이스마엘인들과
  - 이스마엘 족속과
  lexicon: Ἰσμαηλῖται
  rationale: 고유 집단명은 현대 표기 원칙에 맞춰 '이스마엘 사람들'로 옮겨 독자가 집단을 바로 이해하도록 했습니다.
theological_decisions:
- issue: 의도적으로 신분을 낮게 밝히는 화자의 목적
  chosen_reading: ‘나는 집안의 종입니다’는 실제 자기 인식이라기보다, 형제들을 부끄럽게 하지 않으려는 목적 아래 자신을 낮춰 답한 표현으로 읽었습니다.
  alternative_readings:
  - 단순 사실 진술로 읽기
  - 사회적 위장으로만 읽기
  rationale: 원문과 영어 모두 목적절(ἵνα μὴ / so that I might not)으로 화자의 발화 목적을 분명히 하므로, 신분 진술과 목적을 함께 살려야 합니다.
  doctrine_reference: 서사 맥락과 수치/명예의 고대 근동적 표현 관습
- issue: 직접화법의 존대 수준
  chosen_reading: 직접 질문과 대답은 서술체 안에서 자연스러운 현대 한국어 대화로 처리하되, 본문 전체는 합쇼체를 유지했습니다.
  alternative_readings:
  - 직접화법도 문어체로 평탄화
  - 더 격식적인 고어체 사용
  rationale: 번역문 전체의 공적 낭독 가능성을 유지하면서도, 인물 간 대화의 생동감을 해치지 않도록 했습니다.
  doctrine_reference: 표준어 현대 성경 문체 원칙
