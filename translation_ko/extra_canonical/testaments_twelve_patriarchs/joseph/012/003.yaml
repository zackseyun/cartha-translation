id: T12P.JOS.12.3
reference: Testament of Joseph 12:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Λέγει δέ μοι ὁ μείζων αὐτῶν¹⁶· *Οὐκ εἶ δοῦλος¹⁷, ὅτι καὶ¹⁸ ἡ ὄψις σου δηλοῖ¹⁹. Ἐγὼ δὲ *λέγω αὐτοῖς²⁰ ὅτι¹⁸ δοῦλος ⌜αὐτῶν⌝ ὑπάρχω²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/003.yaml
  text: And the chief of them said to me, “You are not a slave, for your appearance also makes it plain.” But I told them plainly that I was their slave.
translation:
  language: ko
  text: 그들 가운데 가장 높은 이가 내게 말했습니다. “당신은 종이 아닙니다. 당신의 모습만 보아도 분명합니다.” 그러나 나는 그들에게 내가 그들의 종이라고 분명히 말했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  english_pob_choice: the chief of them
  chosen_korean: 그들 가운데 가장 높은 이
  alternatives_korean:
  - 그들 가운데 으뜸인 이
  - 그들 중 가장 중요한 이
  - 그들 가운데 우두머리
  lexicon: μείζων
  rationale: 지위의 우위는 살리되, 본문이 특정 직함을 주지 않으므로 자연스럽게 ‘가장 높은 이’로 옮겼습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: δοῦλος
  rationale: 이 단락에서는 신분 종속을 드러내지만, POB 한국어 기본어인 ‘종’이 원문의 관계성을 가장 직접적으로 유지합니다.
- source_word: ἡ ὄψις σου δηλοῖ
  english_pob_choice: your appearance also makes it plain
  chosen_korean: 당신의 모습만 보아도 분명합니다
  alternatives_korean:
  - 당신의 용모도 그것을 분명히 드러냅니다
  - 당신의 외모가 그것을 분명히 말합니다
  lexicon: ὄψις, δηλόω
  rationale: δηλοῖ의 ‘드러내다/분명히 하다’는 의미를 살리면서, 한국어에서 자연스러운 문장으로 재구성했습니다.
- source_word: λέγω αὐτοῖς ὅτι δοῦλος αὐτῶν ὑπάρχω
  english_pob_choice: I told them plainly that I was their slave
  chosen_korean: 내가 그들의 종이라고 분명히 말했습니다
  alternatives_korean:
  - 내가 그들의 종임을 분명히 말했습니다
  - 내가 그들에게 나는 그들의 종이라고 말했습니다
  lexicon: λέγω, ὑπάρχω
  rationale: 동사의 현재성/존재성을 과장하지 않고, 말한 내용의 직접성을 유지하도록 ‘…이라고 분명히 말했습니다’로 옮겼습니다.
theological_decisions:
- issue: 자기 신분을 ‘종’으로 고백하는 진술의 강도
  chosen_reading: 서술적 자기고백으로 유지하여, 도덕적·영적 비유로 약화하지 않았습니다.
  alternative_readings:
  - 비유적으로 완화하여 ‘섬기는 사람’으로 옮기기
  - 사회적 신분을 약화시켜 ‘종’ 대신 일반적 복종 표현 사용
  rationale: 본문은 실제 신분 인식을 말하는 흐름이므로, POB의 source-direct 원칙에 따라 신분성의 무게를 보존했습니다.
  doctrine_reference: 사회적 신분/예표적 자기인식에 대한 본문 충실성
- issue: ‘당신은 종이 아닙니다’와 ‘나는 그들의 종입니다’의 대조
  chosen_reading: 두 발화를 그대로 대조시키되, 화자의 반박을 명시적으로 살렸습니다.
  alternative_readings:
  - 앞뒤를 합쳐 한 문장으로 평탄화하기
  - 직접화법을 간접화법으로 바꾸기
  rationale: 원문의 대립 구조가 인물의 인식 차이를 드러내므로, 대조를 흐리지 않도록 했습니다.
  doctrine_reference: 서사적 대비와 인물 발화의 보존
