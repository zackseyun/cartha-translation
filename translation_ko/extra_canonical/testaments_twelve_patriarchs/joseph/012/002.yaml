  to: 그들 가운데 우두머리가 제게 말했습니다. “너는 노예가 아니다. 네 모습도 그것을 분명히 드러낸다.” 그러나 저는 그들에게 제가 그들의 노예라고 말했습니다.
  rationale: 원문의 직접 발화와 진술 내용을 유지하면서, 원문에 없는 ‘분명히’라는 방식 부사를 제거했습니다. δηλοῖ의 의미를 ‘그것을 분명히 드러낸다’로 명시하고, 마지막 문장을 현대 표준어 합쇼체의 완결된 문장으로 다듬었습니다. 대괄호로 표시된 αὐτῶν은 본문 채택을 전제로 번역에 반영하되, 별도 이문 주석 자료가 제공되지 않았으므로 주석을 새로 추가하지 않았습니다.
