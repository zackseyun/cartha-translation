  text: And the chief of them said to me, “You are not a slave, for your appearance also makes it plain.” But I told them plainly that I was their slave.
translation:
  language: ko
  text: 그들 중 우두머리가 제게 말했습니다. 「너는 노예가 아니다. 네 모습만 보아도 분명하다」. 그러나 저는 그들에게 분명히 말했습니다. 제가 그들의 노예라는 것을요.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  lexicon: δοῦλος
  rationale: English POB가 'slave'로 분명히 표시한 신분적 종속을 따라, 완화된 '종'보다 '노예'를 택해 본문의 긴장을 보존했습니다.
- source_word: ὁ μείζων αὐτῶν
  english_pob_choice: the chief of them
  chosen_korean: 그들 중 우두머리
  alternatives_korean:
  - 그들 중 가장 큰 자
  - 그들 가운데 수장
  lexicon: μείζων
  rationale: 직역적 '가장 큰 자'보다 문맥상 집단의 대표자/우두머리를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: δηλοῖ
  english_pob_choice: makes it plain
  chosen_korean: 분명하다
  alternatives_korean:
  - 분명히 보여 줍니다
  - 드러냅니다
  lexicon: δηλόω
  rationale: 상태를 서술하는 한국어 표현으로 압축해, 외모가 신분을 '분명하게 한다'는 의미를 자연스럽게 전달했습니다.
- source_word: ὑπάρχω
  english_pob_choice: I was
  chosen_korean: 제가 ...라는 것을요
  alternatives_korean:
  - 제가 ...로 존재합니다
  - 제가 ...입니다
  lexicon: ὑπάρχω
  rationale: 현재/실재를 나타내는 동사지만, 영어 POB의 서술에 맞추어 자기를 규정하는 진술로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 노예 신분의 직접 표기
  chosen_reading: 아우는 번역어를 완화하지 않고 '노예'로 유지했습니다.
  alternative_readings:
  - 종
  - 하인
  rationale: 이 문맥은 단순한 종속 관계가 아니라 소유/신분의 인식을 드러내므로, 독자가 본문의 사회적 실재를 즉시 인지하도록 했습니다.
  doctrine_reference: 사회사적 본문 읽기
