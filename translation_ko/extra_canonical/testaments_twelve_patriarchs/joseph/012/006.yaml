source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὁ δὲ Κύριος ἔδωκέ μοι³⁰ χάριν ἐν ὀφθαλμοῖς τοῦ μεταβόλου καὶ ἐπίστευσέ³¹ μοι τὸν οἶκον αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/006.yaml
  text: But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me.
translation:
  language: ko
  text: 그런데 주님께서는 상인의 눈에 제가 호의를 얻도록 해 주셨고, 그가 자기 집을 저에게 맡겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκέ μοι χάριν
  english_pob_choice: gave me favor
  chosen_korean: 제가 호의를 얻도록 해 주셨고
  alternatives_korean:
  - 저에게 은혜를 주셨고
  - 저에게 호의를 베푸셨고
  lexicon: χάριν
  rationale: 문맥상 하나님의 ‘은혜’ 일반보다 특정 인물의 호감·호의를 얻는 결과를 가리키므로, 영어 POB의 ‘favor’를 따라 ‘호의를 얻다’로 옮겼습니다.
- source_word: ἐν ὀφθαλμοῖς τοῦ μεταβόλου
  english_pob_choice: in the eyes of the merchant
  chosen_korean: 상인의 눈에
  alternatives_korean:
  - 장사의 눈에
  - 거래상의 눈에
  lexicon: ὀφθαλμοῖς / μεταβόλου
  rationale: 직역을 유지하되 한국어에서 자연스러운 관용인 ‘~의 눈에’로 처리했고, μεταβόλου는 장사꾼을 뜻하는 문맥에 맞게 ‘상인’으로 옮겼습니다.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  english_pob_choice: he entrusted his house to me
  chosen_korean: 그가 자기 집을 저에게 맡겼습니다
  alternatives_korean:
  - 그가 자기 집을 저에게 신뢰하여 맡겼습니다
  - 그가 자기 집을 저에게 위임했습니다
  lexicon: πιστεύω / οἶκος
  rationale: ἐπίστευσεν은 여기서 ‘믿다’의 인지적 의미보다 ‘신뢰하여 맡기다’의 관계적 결과를 나타내므로, 영어 POB의 ‘entrusted’에 맞춰 자연스럽게 풀었습니다.
theological_decisions:
- issue: 주님께서 인간 관계 안에서 호의를 주시고 신뢰를 일으키시는 주체로 묘사됨
  chosen_reading: 본문은 주님이 요셉에게 사람의 호의를 주시고, 그 결과 집안의 관리까지 맡기게 하시는 섭리를 말합니다.
  alternative_readings:
  - 단순히 인간의 능력으로 신임을 얻었다는 읽기
  - ‘은혜’라는 추상적 종교어로만 읽는 해석
  rationale: 문맥은 신앙적 일반론보다 구체적 사건의 섭리적 결과를 강조하므로, ‘호의’와 ‘맡기다’를 함께 살려 원문의 서술력을 보존했습니다.
  doctrine_reference: 섭리와 신적 호의
