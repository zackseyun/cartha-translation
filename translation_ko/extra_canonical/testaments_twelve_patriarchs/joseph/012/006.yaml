  to: 그러나 주님께서는 그 상인의 눈에 제게 호의를 베푸시어, 그가 자기 집을 제게 맡겼습니다.
  rationale: Revised the first clause for idiomatic modern formal Korean while retaining the source’s agency (the Lord gave favor), recipient (Joseph), relational setting (in the merchant’s eyes), and the merchant’s subsequent entrusting of his house.
  reviewer_model: gpt-5.6-terra
