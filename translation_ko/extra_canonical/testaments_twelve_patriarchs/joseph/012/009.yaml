revisions:
- from: 그때에 페넨페르의 아내가 큰 화려함을 갖추고 멤피스로 내려왔습니다. 그녀는 자기의 내시들에게서 내 이야기를 들었기 때문입니다.
  to: 그때에 펜테프리의 아내가 큰 화려함을 갖추고 가마를 타고 멤피스로 내려왔습니다. 이는 그녀가 자기 내시들에게서 나에 관하여 들었기 때문입니다.
  rationale: 가마를 탄 이동이라는 ἐν λαμπήνῃ의 내용을 복원하고, ‘큰 화려함’을 별도로 유지하여 μετὰ δόξης πολλῆς와 구별했습니다. 고유명사를 그리스어 본문에 맞게 ‘펜테프리’로 바로잡았으며, 원문의 인과 관계와 정중한 현대 한국어 문체를 보존했습니다.
