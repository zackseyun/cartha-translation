id: T12P.JOS.12.9
reference: Testament of Joseph 12:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Κατ᾽ ἐκεῖνον δὲ¹ τὸν καιρὸν κατῆει² Μεμφίς³ †ἐν λαμπήνῃ†⁴ *ἡ γυνὴ⁵ τοῦ Πεντεφρὶ⁶ ⌜μετὰ δόξης πολλῆς, ὅτι ἤκουσε περὶ ἐμοῦ παρὰ τῶν εὐνούχων αὐτῆς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/009.yaml
  text: Now at that time the wife of Pentephri came down to Memphis in a litter, with great splendor, because she had heard about me from her eunuchs.
translation:
  language: ko
  text: 그때에 페넨페르의 아내가 큰 화려함을 갖추고 멤피스로 내려왔습니다. 그녀는 자기의 내시들에게서 내 이야기를 들었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατ᾽ ἐκεῖνον δὲ τὸν καιρὸν
  english_pob_choice: Now at that time
  chosen_korean: 그때에
  alternatives_korean:
  - 바로 그때에
  - 그 무렵에
  lexicon: source_note
  rationale: 시간적 배경을 간결하게 살리되, 한국어 서술 흐름에 맞게 과도한 중복 없이 옮겼습니다.
- source_word: κατῆει Μεμφίς
  english_pob_choice: came down to Memphis
  chosen_korean: 멤피스로 내려왔습니다
  alternatives_korean:
  - 멤피스로 갔습니다
  - 멤피스로 내려갔습니다
  lexicon: source_note
  rationale: κατέρχομαι의 ‘내려오다/내려가다’ 방향성을 살렸고, Memphis는 고유명사 표기를 따랐습니다.
- source_word: ἐν λαμπήνῃ
  english_pob_choice: in a litter
  chosen_korean: 큰 화려함을 갖추고
  alternatives_korean:
  - 가마에 타고
  - 들것에 실려
  - 화려한 가마에 타고
  lexicon: source_note
  rationale: 본문의 λαμπήνη는 운반용 가마/팔랑킨을 가리키지만, 한국어에서 직역형이 낯설 수 있어 의미 기능을 살린 표현으로 옮겼습니다. 다만 본문의 이동 수단 표지인 ‘~에 타고/실려’보다 형식성이 우선되는 이 본문에서는 행렬의 위엄을 드러내는 쪽을 택했습니다.
- source_word: μετὰ δόξης πολλῆς
  english_pob_choice: with great splendor
  chosen_korean: 큰 화려함을 갖추고
  alternatives_korean:
  - 큰 영광 가운데
  - 큰 위엄을 갖추고
  - 대단한 화려함으로
  lexicon: source_note
  rationale: δόξα를 이 본문에서는 ‘영광’보다 외적 장엄성·위세의 의미로 읽는 것이 자연스러워, ‘화려함’으로 구체화했습니다.
- source_word: παρὰ τῶν εὐνούχων αὐτῆς
  english_pob_choice: from her eunuchs
  chosen_korean: 자기의 내시들에게서
  alternatives_korean:
  - 자기 환관들에게서
  - 자기 내관들에게서
  lexicon: source_note
  rationale: εὐνοῦχος의 궁정 직책적 의미를 살리기 위해 ‘내시’를 택했고, 소유 대명사는 문맥상 자연스럽게 ‘자기의’로 처리했습니다.
