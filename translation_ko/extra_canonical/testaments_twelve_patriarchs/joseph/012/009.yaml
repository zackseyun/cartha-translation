  naturalness: ‘가마를 타고 … 내려왔습니다’는 현대 표준 한국어의 격식 있는 서술에 자연스럽고, 원문의 운반 수단과 장엄한 행차를 모두 명료하게 전달합니다. 인과절은 한 문장으로 연결하는 편이 원문의 구조를 더 잘 반영합니다.
