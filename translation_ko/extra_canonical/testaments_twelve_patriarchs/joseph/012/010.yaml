base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/010.yaml
  text: And she said to her husband, “The merchant has grown rich through the hands of a certain young Hebrew; and they say that he also was stolen by theft from the land of Canaan.”
translation:
  language: ko
  text: 그녀는 남편에게 말했습니다. “그 상인이 어떤 젊은 히브리인의 손을 통해 부자가 되었고, 또 그가 가나안 땅에서 도둑질로 도둑맞았다고도 합니다.”[a]
  philosophy: formal
lexical_decisions:
- source_word: ὁ μετάβολος
  english_pob_choice: the merchant
  chosen_korean: 그 상인
  alternatives_korean:
  - 그 장사꾼
  - 그 무역상
  lexicon: μετάβολος
  rationale: 영어 POB의 ‘merchant’를 따라 상업 활동을 하는 인물을 가리키는 말로 옮겼습니다. “상인”이 문맥상 가장 자연스럽고 중립적입니다.
- source_word: ἐν χερσίν τινος νέου Ἑβραίου
  english_pob_choice: through the hands of a certain young Hebrew
  chosen_korean: 어떤 젊은 히브리인의 손을 통해
  alternatives_korean:
  - 어떤 젊은 히브리인의 손으로
  - 어떤 젊은 히브리인을 통해
  lexicon: ἐν χερσί / νέος / Ἑβραῖος
  rationale: ‘손을 통해’로 원문의 도구적·매개적 표현을 살렸고, ‘어떤 젊은 히브리인’으로 인물의 나이와 민족 표지를 모두 보존했습니다.
- source_word: κλοπῇ ἔκλεψαν αὐτόν
  english_pob_choice: stolen by theft
  chosen_korean: 도둑질로 도둑맞았다고도 합니다
  alternatives_korean:
  - 도둑질로 훔쳐졌다고도 합니다
  - 도둑질로 빼앗겼다고도 합니다
  lexicon: κλοπή / κλέπτω
  rationale: 원문의 중첩된 어근과 영어 POB의 형식적 중복을 반영해, ‘도둑질로 도둑맞았다’는 식으로 어색하지만 의미를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: Final clause preserves the emphatic theft wording rather than smoothing it out
  chosen_reading: ‘도둑질로 도둑맞았다’는 직역에 가까운 표현을 유지했습니다.
  alternative_readings:
  - ‘몰래 끌려갔다’
  - ‘도난당했다’
  rationale: 본문은 단순한 유괴보다 ‘도둑질’과 ‘훔침’의 중첩을 강조하므로, 의미를 완화하지 않고 그 긴장을 드러내는 편이 원문에 더 충실합니다.
  doctrine_reference: source-faithfulness / rhetorical emphasis
