revisions:
- from: 그리고 우리가 이집트에 이르렀을 때, 그들은 나를 두고, 배신한 뒤에 누가 금을 받을 것인가를 놓고 서로 다투었습니다.
  to: 우리가 이집트에 이르렀을 때, 그들은 누가 나를 배신한 뒤 금을 받을 것인지를 두고 서로 다투었습니다.
  rationale: με를 ‘나를 배신한’에 직접 연결하여 원문의 행위 대상과 선행 관계를 명확히 했습니다. 나머지 표현은 원문의 의미와 현대 한국어 문체에 맞게 유지했습니다.
