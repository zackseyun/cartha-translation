id: T12P.JOS.12.4
reference: Testament of Joseph 12:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς δὲ *εἰς Αἴγυπτον ἐφθάσαμεν ἐμάχοντο περὶ ἐμοῦ τὸ²² *τίς προδοὺς χρυσίον λάβῃ με²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/004.yaml
  text: And when we had come into Egypt, they disputed concerning me, as to who, after betraying me, would receive the gold.
translation:
  language: ko
  text: 우리가 이집트에 이르렀을 때, 그들은 누가 나를 배신한 뒤 금을 받을 것인지를 두고 서로 다투었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς Αἴγυπτον ἐφθάσαμεν
  english_pob_choice: had come into Egypt
  chosen_korean: 이집트에 이르렀을 때
  alternatives_korean:
  - 이집트에 도착했을 때
  - 이집트로 들어갔을 때
  lexicon: Αἴγυπτος
  rationale: 도착의 완료를 자연스럽게 살리되, 서술 흐름을 해치지 않는 합쇼체 과거로 옮겼습니다.
- source_word: ἐμάχοντο περὶ ἐμοῦ
  english_pob_choice: they disputed concerning me
  chosen_korean: 나를 두고 서로 다투었습니다
  alternatives_korean:
  - 나에 대해 논쟁했습니다
  - 나를 두고 논의했습니다
  lexicon: μάχομαι
  rationale: ἐμάχοντο의 대립적 뉘앙스를 반영해 단순한 논의보다 ‘다투었습니다’가 더 가깝습니다.
- source_word: τίς προδοὺς
  english_pob_choice: who, after betraying
  chosen_korean: 배신한 뒤에 누가
  alternatives_korean:
  - 배신하고 누가
  - 배신한 사람이 누가
  lexicon: προδίδωμι
  rationale: προδοὺς를 ‘배신한 뒤에’로 풀어, 행위의 선행성을 분명히 했습니다.
- source_word: χρυσίον λάβῃ
  english_pob_choice: would receive the gold
  chosen_korean: 금을 받을 것인가
  alternatives_korean:
  - 금을 차지할 것인가
  - 황금을 받을 것인가
  lexicon: χρυσίον
  rationale: χρυσίον은 보편적으로 ‘금’으로 옮길 수 있으며, 문맥상 보상의 대상이 되는 귀금속을 간명하게 살렸습니다.
theological_decisions:
- issue: 본문의 초점이 배신과 금전적 보상에 있는지 여부
  chosen_reading: 문장은 요셉의 매각 과정에서 누가 그를 배신하고 보상을 받을지를 둘러싼 다툼을 말합니다.
  alternative_readings:
  - 누가 상인을 속이고 돈을 받을지
  - 누가 나를 팔아 이익을 얻을지
  rationale: 개정된 영어 POB와 그리스어가 모두 ‘배신’(προδοὺς)과 ‘금’(χρυσίον)을 지시하므로, 행위와 보상의 긴장을 그대로 드러냈습니다.
  doctrine_reference: source-accuracy
