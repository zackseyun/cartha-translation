  source_fidelity: 수정이 필요합니다. 특히 13절의 τοῦ Θεοῦ는 제시된 그리스어 본문에 ‘우리 조상들의 하나님’이라는 말을 뒷받침하지 않으므로 ‘하나님’으로 옮겨야 합니다. 15절의 제시된 그리스어는 ‘당신의 주님 앞에 나아갈 것입니다’에서 끝나며, ‘당신의 주님의 율법 안에서 걸을 것입니다’는 본문에 없는 확장입니다. 14절의 ‘다시는’은 πάλιν ἔτι(다시)를 반대로 옮긴 오류입니다. 18절의 목적절도 화자의 희망이 아니라 주님께서 건져 주시도록 한 행위의 목적입니다.
  naturalness: 전반적으로 합쇼체는 안정적이나, ‘침상에 관하여 정결하다’는 현대 한국어에서 부자연스럽고, 이 대목의 제시된 그리스어에는 ‘침상’이 없습니다. ‘정절 있는 사람’이 자연스럽고 충실합니다. 11절의 ‘마치 거룩한 사람에게 하듯이’는 ‘나를 거룩한 사람인 양’으로 하면 수식 관계가 분명해집니다.
  terminology: σωφροσύνη는 11절에서 ‘절제’로 유지할 수 있고, 12절의 σώφρονα는 문맥상 ‘정절 있는 사람’으로 달리 옮기는 것이 적절합니다. δόλος/πλάνη는 ‘속임수와 미혹’으로 구별하되 소유 관계를 분명히 하였습니다. Κυρίου σου의 2인칭 소유격은 ‘당신의 주님’으로 보존했습니다.
  issues:
  - severity: high
    issue: 13절에 ‘우리 조상들의’가 첨가되었습니다.
    rationale: 제시된 그리스어는 τοῦ Θεοῦ(하나님)라고 읽습니다. 영어 감사 기록의 추정적 복원은 원문 우선 원칙상 본문에 반영할 수 없습니다.
  - severity: high
    issue: 15절에 ‘당신의 주님의 율법 안에서 걸을 것입니다’가 첨가되었습니다.
    rationale: 제시된 그리스어 본문은 καὶ πορευσόμεθα ἐνώπιον Κυρίου σου에서 끝납니다. 영어 POB의 더 긴 문장은 이 증거에 의해 지지되지 않습니다.
  - severity: high
    issue: 14절의 ‘다시는’이 πάλιν ἔτι를 반대로 번역합니다.
    rationale: πάλιν ἔτι는 ‘다시, 또’라는 반복의 뜻입니다.
  - severity: medium
    issue: 12절의 ‘침상에 관하여 정결하다’는 제시된 본문의 범위를 넘고 한국어도 어색합니다.
    rationale: 이 절의 제시된 그리스어는 ὡς σώφρονα(절제력/정절이 있는 사람으로)이며, 침상 관련 표현은 없습니다.
  - severity: medium
    issue: 18절이 목적절을 화자의 소망으로 바꾸었습니다.
    rationale: ὅπως ῥύσηται ... ὁ Κύριος은 ‘주님께서 건져 주시도록’이라는 금식과 기도의 목적을 나타냅니다.
  - severity: low
    issue: 모든 각주 표지가 18절에만 붙어 있으나 실제 각주 내용이 제공되지 않았습니다.
    rationale: 근거 없는 표지와 비어 있는 각주 연결은 제거해야 합니다.
  revised_text: '9. 내가 그것을 깨달았을 때, 나는 죽을 만큼 괴로웠습니다. 그러나 그녀가 나간 뒤에 나는 제정신을 차리고 여러 날 동안 그녀를 두고 슬퍼하였습니다. 내가 그녀의 속임수와 미혹을 알았기 때문입니다.


    10. 나는 혹시라도 그녀가 그 악한 욕망에서 돌이킬까 하여, 그녀에게 지극히 높으신 분의 말씀을 말해 주었습니다.


    11. 그러므로 그녀는 여러 번 나를 거룩한 사람인 양 말로 아첨하였고, 속임수를 쓰며 남편 앞에서 나의 절제를 칭찬하였습니다. 우리가 둘만 있을 때 나를 넘어뜨리려는 것이었습니다.


    12. 그녀는 공개적으로는 나를 정절 있는 사람이라고 칭찬하였지만, 은밀히는 내게 말하였습니다. “내 남편을 두려워하지 마십시오. 그는 당신의 정절을 확신하고 있습니다. 누가 우리에 관하여 그에게 말한다 해도, 그는 믿지 않을 것입니다.”


    13. 이 모든 일 가운데 나는 땅에 낮게 엎드려 하나님께, 나를 그녀의 속임수에서 건져 주시기를 간청하였습니다.


    14. 그러나 그녀가 이 일로 아무것도 이루지 못하자, 다시 하나님의 말씀을 배우려고 가르침의 말로 내게 다가오기 시작하였습니다.


    15. 그녀가 내게 말하였습니다. “당신이 내가 우상들을 버리기를 원한다면, 나도 내 남편을 설득하여 우상들에게서 떠나게 하겠습니다. 그러면 우리는 당신의 주님 앞에 나아갈 것입니다.”


    16. 그러나 나는 그녀에게 말하였습니다. “주님은 자신을 경외하는 이들이 부정함 가운데 있기를 바라지 않으시며, 간음하는 자들을 기뻐하지 않으십니다. 오히려 깨끗한 마음과 더럽혀지지 않은 입술로 그분께 나아오는 이들을 기뻐하십니다.”


    17. 그러나 그녀는 자기 욕망을 이루려 하여 계속 반박하였습니다.


    18. 나는 주님께서 나를 그녀에게서 건져 주시도록 금식과 기도를 더하였습니다.'
  revised_footnotes: []
  revision_rationale: 제시된 그리스어 본문을 우선하여 영어 감사 기록에 포함된 추정적 복원과 전승상의 확장을 본문에서 제거했습니다. 반복 부사, 목적절, 수식 관계를 바로잡고, 성적 순결의 문맥은 유지하되 제시된 본문에 없는 ‘침상’ 표현은 넣지 않았습니다. 근거와 내용이 제공되지 않은 각주 표지도 제거했습니다.
