base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004.yaml
  text: '9[a]. And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I recognized her deceit and her delusion.

    10. And I spoke to her words of the Most High, to see whether perhaps she might turn back from her evil desire.

    11. So then, many times[b], as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.

    12. For she openly extolled me as chaste with respect to the bed, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded concerning your purity, and even if someone should tell him about us, he will not believe it.”

    13. In all these things I, lying low on the ground, kept begging the God of my fathers that he would rescue me from her deceit.

    14. Since she accomplished nothing in this way, again she began to come to me with words of instruction, wanting to learn the word of God.

    15. And she says to me, “If you want me to leave behind the idols, I will persuade my husband to withdraw from them, and we will go before your Lord, walking in the law of your Lord.”

    16. But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”

    17. But she kept contending, wanting to fulfill her desire.

    18. And I added fasting and prayer[d][c], so that the Lord might rescue me from her.'
  footnotes:
  - marker: a
    text: The Greek at v. 13 is textually difficult in this OCR-normalized witness; 'the God of my fathers' reflects the likely patriarchal sense, though a shorter reading 'God' is possible.
    reason: textual_variant
  - marker: b
    text: Or 'came to my senses.'
    reason: lexical_alternative
  - marker: c
    text: '''Chaste with respect to the bed'' renders a phrase explicitly referring to sexual purity.'
    reason: lexical_alternative
  - marker: d
    text: The line 'walking in the law of your Lord' may reflect a fuller expansion in the Greek tradition; it is translated as transmitted here.
    reason: textual_variant
translation:
  language: ko
  text: '9. 내가 그것을 깨달았을 때 나는 죽을 만큼 괴로웠습니다. 그러나 그녀가 밖으로 나간 뒤에는 내가 제정신을 차리고 그녀를 두고 여러 날 슬퍼하였습니다. 이는 내가 그녀의 속임수와 그 미혹을 알았기 때문입니다.


    10. 나는 그녀에게 지극히 높으신 분의 말씀을 전하여, 혹시라도 그녀가 그 악한 욕망에서 돌이킬 수 있을지 보려 하였습니다.


    11. 그러므로 여러 번, 마치 거룩한 사람에게 하듯이 그녀는 말로 나를 아첨하였고, 속임수로 남편 앞에서 내 절제함을 칭찬하면서, 우리가 둘만 있을 때 나를 넘어뜨리려 하였습니다.


    12. 그녀는 공개적으로는 내가 침상에 관하여 정결하다고 높이 칭찬하였지만, 몰래는 내게 말하였습니다. “내 남편을 두려워하지 마십시오. 그는 당신의 순결에 대해 확신하고 있습니다. 누가 우리에 대해 그에게 말하더라도 그는 믿지 않을 것입니다.”


    13. 이 모든 일 가운데 나는 엎드린 채로, 우리 조상들의 하나님께 간청하며 그녀의 속임수에서 나를 건져 주시기를 빌었습니다.


    14. 그녀가 이 일로 아무것도 이루지 못하자, 다시는 가르침의 말로 내게 다가와 하나님의 말씀을 배우고자 하였습니다.


    15. 그리고 그녀는 내게 말하였습니다. “당신이 내가 우상을 버리기를 원하신다면, 나도 내 남편을 설득하여 그것들에서 물러서게 하고, 우리는 당신의 주님 앞에 나아가 당신의 주님의 율법 안에서 걸을 것입니다.”


    16. 그러나 나는 그녀에게 말하였습니다. “주님은 자신을 경외하는 이들이 부정함 가운데 있기를 바라지 않으시며, 간음하는 자들을 기뻐하지도 않으시고, 오직 깨끗한 마음과 더럽혀지지 않은 입술로 그분께 나아오는 이들을 기뻐하십니다.”


    17. 그러나 그녀는 자신의 욕망을 채우려 하며 계속 맞섰습니다.


    18. 나는 금식과 기도를 더하였습니다. 그래서 주님께서 나를 그녀에게서 건져 주시기를 바랐습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  english_pob_choice: I was grieved unto death
  chosen_korean: 죽을 만큼 괴로웠습니다
  alternatives_korean:
  - 죽도록 슬펐습니다
  - 죽음에 이를 만큼 비통했습니다
  lexicon: BDAG
  rationale: 과장된 고통의 강도를 살리되, 한국어에서 자연스러운 합쇼체 표현으로 옮겼습니다.
- source_word: ἦλθον εἰς ἐμαυτόν
  english_pob_choice: I came to myself
  chosen_korean: 제정신을 차리고
  alternatives_korean:
  - 정신을 차리고
  - 자기 자신에게 돌아와
  lexicon: BDAG
  rationale: 문자적 직역보다 한국어 관용을 택하되, 깨달음의 복귀 의미는 유지했습니다.
- source_word: δόλος / πλάνη
  english_pob_choice: deceit / delusion
  chosen_korean: 속임수와 그 미혹
  alternatives_korean:
  - 간계와 미혹
  - 속임과 잘못된 길
  lexicon: BDAG
  rationale: 두 단어의 구별을 살려, δόλος의 교활함과 πλάνη의 미혹성을 분리해 표현했습니다.
- source_word: κοίτων σώφρονα
  english_pob_choice: chaste with respect to the bed
  chosen_korean: 침상에 관하여 정결하다
  alternatives_korean:
  - 침실에서 정결하다
  - 부부 잠자리에 대해 정결하다
  lexicon: LSJ
  rationale: 영어 POB의 뜻을 따라 성적 순결을 분명히 하면서도, 원문이 드러내는 ‘침상’ 이미지를 유지했습니다.
- source_word: χαμοκοιτῶν
  english_pob_choice: lying low on the ground
  chosen_korean: 엎드린 채로
  alternatives_korean:
  - 땅에 엎드려
  - 땅바닥에 낮게 엎드려
  lexicon: LSJ
  rationale: 희귀한 자세 표현을 과도하게 구체화하지 않고, 겸손한 기도 자세로 자연스럽게 옮겼습니다.
- source_word: προσετιθέμην νηστείαν καὶ προσευχήν
  english_pob_choice: I added fasting and prayer
  chosen_korean: 금식과 기도를 더하였습니다
  alternatives_korean:
  - 금식에 기도를 보탰습니다
  - 금식과 기도를 덧붙였습니다
  lexicon: BDAG
  rationale: προσετιθέμην의 추가·보태는 뉘앙스를 살려, 두 경건 행위를 함께 더했다는 의미를 간결하게 전달했습니다.
theological_decisions:
- issue: v. 15의 ἐνώπιον Κυρίου σου와 τὸν νόμον τοῦ Κυρίου σου의 2인칭 소유격
  chosen_reading: “당신의 주님 앞에 … 당신의 주님의 율법”
  alternative_readings:
  - “주님 앞에 … 주님의 율법”
  - “당신의 하나님 앞에 … 당신의 하나님의 율법”
  rationale: 원문의 2인칭 소유격을 유지해, 문장을 익숙한 성경식 정형으로 평준화하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 전승된 표현을 숨기지 않기
