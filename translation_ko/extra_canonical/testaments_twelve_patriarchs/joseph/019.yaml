base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019.yaml
  text: 'And he gave me beauty beyond the handsome men of Israel[a], and preserved me until old age in strength and in beauty; for I was like Jacob in all things.


    Now listen, my children, also concerning the dream that I saw.


    2. Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also. So hear the dream that I saw. 3. And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord led them out into a flourishing and well-watered place, and brought them from darkness into light. 4. And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks. 5. And after these things I saw, and behold, twelve bulls suckling one heifer, and from her there came a sea of milk, and the twelve flocks and innumerable flocks drank from it. 6. And from the fourth bull the horns went up as far as heaven and became like a wall for the flocks, and between the two horns another horn sprang up. 7. And I saw a calf that encircled them twelve times, and it became for the bulls wholly a help.


    8. And I saw that a virgin was born, and from her was born a lamb, and on his left there rushed forth something like a lion; and all the beasts rushed against him, but the lamb overcame them and destroyed them and trampled them down. 9. And the angels and men and all the earth rejoiced over him. 10. And these things will happen in their season in the last days.


    11. Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you the salvation of Israel. 12. For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will come to an end, like a watchman''s hut after the summer[d][c][b], vanishing away.'
  footnotes:
  - marker: a
    text: Some Greek witnesses read more explicitly, 'from Judah was born a virgin,' while another form reads, 'I saw among the horns a certain virgin.'
    reason: textual_variant
  - marker: b
    text: Some witnesses expand the lamb as 'spotless,' and one later-sounding reading adds language resembling 'the lamb of God, who takes away the sin of the world.'
    reason: textual_variant
  - marker: c
    text: The phrase 'on his left there rushed forth something like a lion' is textually difficult; another witness phrases the scene differently but still depicts hostile beastly assault on the lamb.
    reason: alternative_reading
  - marker: d
    text: The image of the 'watchman's hut after the summer' refers to a temporary field shelter left desolate once harvest is over.
    reason: cultural_note
translation:
  language: ko
  text: '그리고 그분께서 내게 이스라엘의 어느 미남보다도 더한 아름다움을 주셨고, 힘과 아름다움을 지닌 채 늙을 때까지 나를 지켜 주셨습니다. 내가 모든 면에서 야곱을 닮았기 때문입니다.


    이제 내 자녀들아, 내가 본 꿈에 관해서도 들으십시오.


    2. 열두 마리 사슴이 한곳에서 풀을 뜯고 있었는데, 그중 아홉 마리가 온 땅에 흩어졌고, 나머지 세 마리도 마찬가지였습니다. 3. 내가 보니 세 마리 사슴이 세 마리 어린양이 되었고, 그들이 주께 부르짖었습니다. 주께서 그들을 무성하고 물이 넉넉한 곳으로 이끌어 내시고, 어둠에서 빛으로 데려가셨습니다. 4. 거기서 그들은 아홉 마리 사슴이 자기들에게 모일 때까지 주께 부르짖었고, 그들은 열두 마리 양처럼 되었으며, 얼마 지나지 않아 늘어나 많은 양 떼가 되었습니다. 5. 그 뒤에 내가 보니, 열두 마리 수소가 한 마리 암송아지에게 젖을 빨고 있었고, 그 암송아지에게서 젖의 바다가 생겨났습니다. 열두 양 떼와 셀 수 없이 많은 양 떼가 그 젖을 마셨습니다. 6. 넷째 수소에게서 뿔들이 하늘에 닿을 때까지 솟아올라 양 떼를 위한 담이 되었고, 그 두 뿔 사이에서 또 다른 뿔이 돋아났습니다. 7. 또 내가 보니, 한 송아지가 그들을 열두 번 둘러쌌는데, 그것이 수소들에게 전적으로 도움이 되었습니다.


    8. 또 내가 보니, 한 처녀가 태어나고[a], 그에게서 한 어린양이 태어났습니다[b]. 그의 왼쪽에서는 사자 같은 것이 달려 나왔고[c], 모든 짐승이 그를 향해 달려들었습니다. 그러나 어린양이 그들을 이기고 멸하여 짓밟아 버렸습니다. 9. 천사들과 사람들과 온 땅이 그를 두고 기뻐했습니다. 10. 이 일들은 그 정해진 때, 곧 마지막 날들에 일어날 것입니다.


    11. 그러므로 내 자녀들아, 주의 명령들을 지키고 레위와 유다를 공경하십시오. 그들의 씨에서 너희를 위하여 이스라엘의 구원이 나타날 것이기 때문입니다. 12. 그의 나라는 영원한 나라가 되어 결코 지나가지 않을 것입니다. 그러나 너희 가운데 있는 내 나라는 여름이 지난 뒤의 파수꾼의 오두막처럼 사라질 것입니다[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 그리스어 전승은 더 명시적으로 ‘유다에게서 한 처녀가 태어났다’고 읽으며, 다른 형태는 ‘뿔들 사이에서 어떤 처녀’를 보았다고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 일부 전승은 어린양을 ‘흠 없는’ 어린양으로 확장하며, 한 후대적 읽기는 ‘세상의 죄를 지고 가는 하나님의 어린양’과 유사한 표현을 덧붙입니다.
    reason: textual_variant
  - marker: c
    text: ‘그의 왼쪽에서는 사자 같은 것이 달려 나왔다’는 구절은 본문상 난해합니다. 다른 전승은 장면을 다르게 표현하지만, 여전히 어린양을 향한 적대적인 짐승 같은 공격을 묘사합니다.
    reason: alternative_reading
  - marker: d
    text: ‘파수꾼의 오두막’은 수확철 밭에 임시로 세웠다가 수확이 끝난 뒤 버려지는 초막을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραιότητα
  english_pob_choice: beauty
  chosen_korean: 아름다움
  alternatives_korean:
  - 미모
  - 아름다운 모습
  lexicon: LSJ
  rationale: 외모의 아름다움이라는 기본 뜻을 살리되, 한국어에서 자연스럽고 과장되지 않은 표준어로 옮겼습니다.
- source_word: ἐφύλαξέ
  english_pob_choice: preserved
  chosen_korean: 지켜 주셨습니다
  alternatives_korean:
  - 보존하셨습니다
  - 보호하셨습니다
  lexicon: BDAG
  rationale: 하나님이 생애 동안 계속 보전하셨다는 뜻을 살리면서, 한국어에서 관계적 보호의 뉘앙스를 자연스럽게 전달합니다.
- source_word: ἔλαφοι / ἀμνοί / βόες / θηρία
  english_pob_choice: deer / lambs / bulls / beasts
  chosen_korean: 사슴 / 어린양 / 수소 / 짐승들
  alternatives_korean:
  - 들사슴 / 어린양들 / 황소 / 들짐승들
  lexicon: LSJ/BDAG
  rationale: 꿈 환상에 나오는 동물 상징을 가능한 한 직역하여, 상징적 전개를 흐리지 않도록 했습니다.
- source_word: ὀπωροφυλάκιον
  english_pob_choice: watchman's hut
  chosen_korean: 감시꾼 오두막
  alternatives_korean:
  - 파수꾼 초막
  - 감시초소
  lexicon: LSJ
  rationale: 수확철 임시 거처라는 문화적 이미지를 반영하되, 본문 비교의 핵심인 ‘덧없음’을 전달하도록 했습니다.
theological_decisions:
- issue: 8절의 처녀-어린양-사자 이미지
  chosen_reading: 본문에 있는 상징적 이미지를 그대로 두고, 본문이 허용하는 범위 안에서만 번역했습니다.
  alternative_readings:
  - 후대에 더 분명한 그리스도론적 문구로 정리하는 읽기
  - 상징을 완전히 일반적 환상으로 완화하는 읽기
  rationale: 그리스어 전승에는 후대 확장 가능성이 보이지만, 번역은 현존 본문이 실제로 말하는 상징성과 긴장을 보존해야 합니다.
  doctrine_reference: 본문 비평과 예언 상징의 긴장 보존
- issue: 11-12절의 ‘그의 나라’와 ‘내 나라’ 대비
  chosen_reading: 장차 올 영원한 통치와 현재의 임시적 통치를 대조하는 문장 구조를 그대로 살렸습니다.
  alternative_readings:
  - 메시아 왕국으로 단정하는 읽기
  - 조셉의 지상 왕권으로 축소하는 읽기
  rationale: 본문은 후대의 해석 가능성을 열어 두면서도, 두 나라의 성격 차이를 분명히 말합니다.
  doctrine_reference: 종말론적 왕국과 예언적 유보
