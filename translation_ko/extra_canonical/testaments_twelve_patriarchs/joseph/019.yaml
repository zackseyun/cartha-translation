    이제, 내 자녀들아, 내가 본 꿈에 관해서도 들으십시오.


    2. 열두 마리의 사슴이 한곳에서 풀을 뜯고 있었는데, 아홉 마리는 온 땅에 흩어졌고, 나머지 셋도 그와 같았습니다. 그러니 내가 본 꿈을 들으십시오. 3. 그런데 내가 보니 그 셋의 사슴이 셋의 어린양이 되었고, 그들이 주께 부르짖자 주께서 그들을 기름지고 물이 많은 곳으로 이끌어 내시고, 어둠에서 빛으로 데려가셨습니다. 4. 거기서 그들은 아홉 마리의 사슴이 자기들에게 모일 때까지 주께 부르짖었고, 그들은 열두 마리의 양과 같이 되었으며, 얼마 지나지 않아 많아져 무리들이 되었습니다. 5. 그 후 나는 보니, 열두 마리의 수소가 한 마리의 암송아지에게 젖을 빨고 있었고, 그 암송아지에게서 젖의 바다가 생겨났으며, 열두 무리의 양과 셀 수 없이 많은 무리들이 그 젖을 마셨습니다. 6. 네 번째 수소에게서 뿔들이 하늘에 닿을 때까지 솟아올라 무리들을 위한 담이 되었고, 그 두 뿔 사이에서 또 다른 뿔이 돋아났습니다. 7. 또 나는 그들을 열두 번 둘러싸는 한 송아지를 보았는데, 그것이 수소들에게 온전히 도움이 되었습니다.


    8. 그리고 나는 유다에게서 한 처녀가 태어나고, 그녀에게서 한 어린양이 태어났으며, 그의 왼쪽에서는 사자 같은 것이 달려 나오는 것을 보았습니다. 그리고 모든 짐승들이 그를 향해 달려들었으나, 어린양이 그들을 이기고 멸하여 짓밟아 버렸습니다[b][c]. 9. 천사들과 사람들과 온 땅이 그를 두고 기뻐했습니다. 10. 이 일들은 마지막 날들의 그때에 그들의 때가 이르면 일어날 것입니다.


    11. 그러므로 내 자녀들아, 주의 명령들을 지키고, 레위와 유다를 존중하십시오. 그들의 씨에서 너희에게 이스라엘의 구원이 일어날 것이기 때문입니다. 12. 그의 나라는 영원한 나라가 될 것이며, 결코 지나가지 않을 것입니다. 그러나 너희 가운데 있는 내 나라는 여름이 지나간 뒤의 감시꾼 오두막처럼 사라질 것입니다[d].'
  to: '그리고 그분께서 내게 이스라엘의 어느 미남보다도 더한 아름다움을 주셨고, 힘과 아름다움을 지닌 채 늙을 때까지 나를 지켜 주셨습니다. 내가 모든 면에서 야곱을 닮았기 때문입니다.


    이제 내 자녀들아, 내가 본 꿈에 관해서도 들으십시오.


    2. 열두 마리 사슴이 한곳에서 풀을 뜯고 있었는데, 그중 아홉 마리가 온 땅에 흩어졌고, 나머지 세 마리도 마찬가지였습니다. 3. 내가 보니 세 마리 사슴이 세 마리 어린양이 되었고, 그들이 주께 부르짖었습니다. 주께서 그들을 무성하고 물이 넉넉한 곳으로 이끌어 내시고, 어둠에서 빛으로 데려가셨습니다. 4. 거기서 그들은 아홉 마리 사슴이 자기들에게 모일 때까지 주께 부르짖었고, 그들은 열두 마리 양처럼 되었으며, 얼마 지나지 않아 늘어나 많은 양 떼가 되었습니다. 5. 그 뒤에 내가 보니, 열두 마리 수소가 한 마리 암송아지에게 젖을 빨고 있었고, 그 암송아지에게서 젖의 바다가 생겨났습니다. 열두 양 떼와 셀 수 없이 많은 양 떼가 그 젖을 마셨습니다. 6. 넷째 수소에게서 뿔들이 하늘에 닿을 때까지 솟아올라 양 떼를 위한 담이 되었고, 그 두 뿔 사이에서 또 다른 뿔이 돋아났습니다. 7. 또 내가 보니, 한 송아지가 그들을 열두 번 둘러쌌는데, 그것이 수소들에게 전적으로 도움이 되었습니다.


    8. 또 내가 보니, 한 처녀가 태어나고[a], 그에게서 한 어린양이 태어났습니다[b]. 그의 왼쪽에서는 사자 같은 것이 달려 나왔고[c], 모든 짐승이 그를 향해 달려들었습니다. 그러나 어린양이 그들을 이기고 멸하여 짓밟아 버렸습니다. 9. 천사들과 사람들과 온 땅이 그를 두고 기뻐했습니다. 10. 이 일들은 그 정해진 때, 곧 마지막 날들에 일어날 것입니다.


    11. 그러므로 내 자녀들아, 주의 명령들을 지키고 레위와 유다를 공경하십시오. 그들의 씨에서 너희를 위하여 이스라엘의 구원이 나타날 것이기 때문입니다. 12. 그의 나라는 영원한 나라가 되어 결코 지나가지 않을 것입니다. 그러나 너희 가운데 있는 내 나라는 여름이 지난 뒤의 파수꾼의 오두막처럼 사라질 것입니다[d].'
  rationale: 원어 본문과 영어 POB의 짧은 본문 선택을 우선하여, 8절의 ‘유다에게서’ 및 더 명시적인 그리스도론적 확장은 본문에서 제거하고 이문 각주로 보냈습니다. 난해한 사자 이미지와 미래의 구원·통치에 관한 표현은 특정 교리적 동일시를 덧붙이지 않고 유지했습니다. 동시에 한국어의 수량 표현, 문장 연결, 농경 이미지를 현대 표준어 합쇼체에 맞게 다듬었습니다.
