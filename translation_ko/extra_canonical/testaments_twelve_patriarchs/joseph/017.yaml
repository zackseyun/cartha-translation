  text: XVII. Ὁρᾶτε οὖν¹, τέκνα μου², πόσα ὑπέμεινα ἵνα μὴ αἰσχύνω³ τοὺς ἀδελφούς μου. 2. Καὶ ὑμεῖς ⌜οὖν⌉ ἀγαπᾶτε ἀλλήλους, ⌜καὶ ἐν μακροθυμίᾳ⁴ *συγκρύπτετε ἀλλήλων⁵ τὰ ἐλαττώματα⁷. 3. Τέρπεται γὰρ⁸ ὁ θεὸς⁷ ⌜ἐπὶ⌉ *ὁμονοίᾳ ἀδελφῶν⁸ καὶ⁷ ἐπὶ προαιρέσει καρδίας⁹ ⌜ἀγαθῆς⌉¹⁰ †εὐδοκοῦσιν¹¹ εἰς ἀγαθόν¹². 4. *Ὅτε ⌜δὲ⌉¹³ ἦλθον οἱ ἀδελφοί μου εἰς Αἴγυπτον, αὐτοὶ¹⁴ γινώσκουσιν¹⁵ ὅτι *ἀπέστρεψα τὸ ἀργύριον αὐτοῖς¹⁶, καὶ οὐκ ὠνείδισα *αὐτούς, καὶ¹⁷ παρεκάλεσα¹⁸ ⌜αὐτούς⌉¹⁹. 5. Καὶ²⁰ μετὰ θάνατον *Ἰακώβ, τοῦ πατρός μου²¹, ⌜περισσοτέρως⌉ ἠγάπησα αὐτούς, καὶ πάντα ὅσα ἤθελον²² ⌜ὑπερεκπερισσοῦ⌉²³ *ἐποίουν αὐτοῖς²⁴. 6. *Καὶ οὐκ ἀφῆκα²⁵ αὐτοὺς²⁶ θλιβῆναι *ἕως μικροῦ πράγματος²⁷. καίγε πᾶν ὃ ἦν ἐν τῇ²⁸ χειρί μου αὐτοῖς δέδωκα²⁹. 7. ⌜Καὶ⌉³⁰ οἱ υἱοὶ *αὐτῶν υἱοί μου³¹, *καὶ οἱ υἱοί μου ὡς δοῦλοι αὐτῶν³², καὶ³³ ἡ ψυχὴ *αὐτῶν ψυχή μου³⁴, καὶ πᾶν ἄλγημα³⁵ αὐτῶν ἄλγημά μου³⁶, ⌜καὶ πᾶσα μαλακία αὐτῶν *ἀσθένειά μου, καὶ³⁷ ἡ βουλὴ³⁷⌉ αὐτῶν βουλή μου³⁸. 8. Καὶ οὐχ ὕψωσα ἐμαυτὸν³⁹ ἐν αὐτοῖς ⌜ἐν ἀλαζονείᾳ⌉, διὰ τὴν ⌜κοσμικήν⌉
    μου δόξαν⁴⁰, ⌜ἀλλ᾿⁴¹ ἤμην ἐν αὐτοῖς ὡς εἷς τῶν ἐλαχίστων⁴².
