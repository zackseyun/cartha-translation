base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017.yaml
  text: 1[a]. See then, my children, how much I endured so that I might not put my brothers to shame. 2. You also, therefore, love one another, and with patience conceal one another’s shortcomings. 3. For God delights in the harmony of brothers and in the purpose of a good heart that intends what is good. 4[b]. And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them. 5. And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure. 6. And I did not allow them to be distressed even in the smallest matter; rather, everything that was in my hand I gave to them. 7. And their sons were my sons, and my sons were as slaves to them, and their soul was my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose. 8. And I did not exalt myself among them in arrogance because of my worldly glory[c],
    but I was among them as one of the least.
  footnotes:
  - marker: a
    text: Or 'cover one another’s failings.' The Greek verb suggests not exposing a brother’s faults harshly.
    reason: lexical_alternative
  - marker: b
    text: The clause about the 'purpose of a good heart' is textually difficult in the Greek witness; the translation follows the apparent ethical sense of a heart disposed toward the good.
    reason: textual_variant
  - marker: c
    text: '''Slaves'' translates Greek douloi. The wording is intentionally strong, expressing Joseph’s humility and the subordination of his own household to his brothers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 1. 그러므로 내 자녀들아, 내가 얼마나 많은 것을 견뎠는지 보십시오. 이는 내가 내 형제들에게 수치를 당하게 하지 않으려는 것이었습니다. 2. 그러므로 너희도 서로 사랑하고, 오래 참음으로 서로의 허물[a]을 덮으십시오. 3. 이는 하나님께서 형제들의 화목과, 선을 뜻하는 좋은 마음의 뜻[b]을 기뻐하십니다. 4. 내 형제들이 이집트에 왔을 때, 그들 자신이 내가 그들의 돈을 돌려주었고 그들을 책망하지 않았으며 오히려 격려했다는 것을 알고 있습니다. 5. 그리고 내 아버지 야곱이 죽은 뒤에는 그들을 더욱 사랑했고, 그들이 원하는 것은 무엇이든지 넘치도록 해 주었습니다. 6. 나는 그들이 아주 작은 일 때문에도 괴로워하도록 내버려 두지 않았습니다. 오히려 내 손에 있는 것은 무엇이든 그들에게 주었습니다. 7. 그리고 그들의 아들들은 내 아들들이었고, 내 아들들은 그들의 종들이었으며, 그들의 영혼은 내 영혼이었고, 그들의 모든 고통은 내 고통이었고, 그들의 모든 연약함은 내 병이었으며, 그들의 뜻은 내 뜻이었습니다[c]. 8. 나는 내 세속적 영광 때문에 교만 가운데서 그들 사이에서 스스로를 높이지 않았고, 오히려 그들 가운데서 가장 작은 자들 중 하나와 같았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχύνω
  english_pob_choice: put ... to shame
  chosen_korean: 수치를 당하게 하다
  alternatives_korean:
  - 부끄럽게 하다
  - 망신시키다
  lexicon: BDAG
  rationale: 형제들에게 수치를 안기지 않으려는 뜻을 한국어에서도 관계적·공적 수치의 뉘앙스로 살렸습니다.
- source_word: μακροθυμία
  english_pob_choice: patience
  chosen_korean: 오래 참음
  alternatives_korean:
  - 인내
  - 참음
  lexicon: BDAG
  rationale: 권면 문맥에서 상대를 향한 지속적 참고 견딤을 가장 자연스럽게 드러냅니다.
- source_word: συγκρύπτετε
  english_pob_choice: conceal
  chosen_korean: 덮으십시오
  alternatives_korean:
  - 감추십시오
  - 숨기십시오
  lexicon: LSJ
  rationale: 형제의 허물을 폭로하지 않고 덮어 주는 뜻을 살리되, 부자연스러운 직역보다 윤리적 함의를 드러냈습니다.
- source_word: ἐλαττώματα
  english_pob_choice: shortcomings
  chosen_korean: 허물
  alternatives_korean:
  - 잘못
  - 결점
  lexicon: LSJ
  rationale: 도덕적 권면에서 비교적 넓게 쓰이며, 과도하게 법정적이거나 심리적인 색채를 피합니다.
- source_word: ὁμονοία
  english_pob_choice: harmony
  chosen_korean: 화목
  alternatives_korean:
  - 일치
  - 조화
  lexicon: BDAG
  rationale: 형제들 사이의 한마음됨을 한국어 성서어휘에서 이해하기 쉬운 말로 옮겼습니다.
- source_word: προαίρεσις καρδίας / εὐδοκοῦσιν εἰς ἀγαθόν
  english_pob_choice: purpose of a good heart that intends what is good
  chosen_korean: 선을 뜻하는 좋은 마음의 뜻
  alternatives_korean:
  - 선을 향한 좋은 마음의 의도
  - 좋은 마음의 선한 목적
  lexicon: BDAG, LSJ
  rationale: 본문 전승이 다소 난해하므로, 하나님이 기뻐하시는 내적 의향이라는 윤리적 의미를 유지하면서 한국어로 무리 없이 읽히게 했습니다.
- source_word: παρεκάλεσα
  english_pob_choice: encouraged
  chosen_korean: 격려했다
  alternatives_korean:
  - 위로했다
  - 권면했다
  lexicon: BDAG
  rationale: 요셉이 형제들을 책망하지 않고 안심시키며 힘을 북돋운 뉘앙스에 가장 잘 맞습니다.
- source_word: ὑπερεκπερισσοῦ
  english_pob_choice: beyond measure
  chosen_korean: 넘치도록
  alternatives_korean:
  - 한없이
  - 측량할 수 없이
  lexicon: BDAG
  rationale: 과도한 풍성함과 분량의 초과를 간결하게 전달합니다.
- source_word: δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 종들
  alternatives_korean:
  - 노예들
  - 시종들
  lexicon: BDAG
  rationale: 본 절에서는 아들들의 종속성을 강하게 드러내지만, 한국어 문맥상 지나치게 현대적 법제 용어인 '노예'보다 완화된 '종'이 더 자연스럽습니다.
- source_word: ἀλαζονεία
  english_pob_choice: arrogance
  chosen_korean: 교만 가운데서
  alternatives_korean:
  - 거만함으로
  - 자만하여
  lexicon: BDAG
  rationale: 자기 과시적 태도를 나타내는 표현으로, 한국어에서는 '교만'이 가장 직접적으로 대응합니다.
- source_word: κοσμική δόξα
  english_pob_choice: worldly glory
  chosen_korean: 세속적 영광
  alternatives_korean:
  - 세상의 영광
  - 현세의 영광
  lexicon: LSJ
  rationale: 이집트에서의 요셉의 높은 지위를 가리키는 점을 살리되, 그 영광이 '세상적인' 것임을 분명히 했습니다.
- source_word: ἐλαχίστων
  english_pob_choice: the least
  chosen_korean: 가장 작은 자들 중 하나
  alternatives_korean:
  - 가장 낮은 자들 중 하나
  - 최소한의 자들 중 하나
  lexicon: BDAG
  rationale: 요셉의 겸손을 드러내는 비교 표현으로, 공동체 안에서의 낮은 위치를 자연스럽게 전달합니다.
theological_decisions:
- issue: 형제의 허물을 '덮는다'는 권면의 의미
  chosen_reading: '''허물''을 ''덮으십시오''로 옮겨, 죄를 부정하는 것이 아니라 형제의 잘못을 함부로 드러내지 않는 윤리적 권면으로 이해했습니다.'
  alternative_readings:
  - 허물을 감추십시오
  - 잘못을 가리십시오
  rationale: 본문은 죄의 실재를 부정하지 않고, 형제 사랑 안에서 노출과 수치를 피하라는 도덕적 권면을 줍니다.
  doctrine_reference: '번역 원칙: source-direct, 의미 보존'
- issue: 7절의 δοῦλοι 표현
  chosen_reading: 여기서는 관계의 실제 종속성을 드러내면서도 한국어 가독성을 위해 '종들'로 옮겼습니다.
  alternative_readings:
  - 노예들
  - 종노릇하는 자들
  rationale: 본문의 겸손과 역전 구조를 살리되, 고대 가정/종속 관계를 한국어로 너무 현대 법률어처럼 굳히지 않도록 했습니다.
  doctrine_reference: '용어 일관성: δοῦλος 기본값과 문맥 적합성'
