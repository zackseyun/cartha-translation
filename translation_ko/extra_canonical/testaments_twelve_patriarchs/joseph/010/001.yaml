base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/001.yaml
  text: See, then, my children, how much endurance and prayer with fasting accomplish.
translation:
  language: ko
  text: 그러니 내 자녀들아, 인내와 금식과 함께하는 기도가 얼마나 많은 일을 이루는지 보십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε οὖν
  english_pob_choice: See, then
  chosen_korean: 그러니 … 보십시오
  alternatives_korean:
  - 그러니 … 보라
  - 그러니 … 보세요
  lexicon: ὁράω
  rationale: 권면의 호격 문맥을 살리면서 현대 합쇼체로 자연스럽게 옮기기 위해 ‘보십시오’를 사용했습니다. ‘그러니’는 οὖν의 논리적 연결을 반영합니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 나의 자녀들아
  lexicon: τέκνον
  rationale: 직접 호칭의 친밀함을 살리되, 문어체에서 자연스럽고 과도하게 유아화되지 않는 ‘자녀들아’를 택했습니다.
- source_word: πόσα
  english_pob_choice: how much
  chosen_korean: 얼마나 많은 일을
  alternatives_korean:
  - 얼마나
  - 얼마나 큰 일을
  lexicon: πόσος
  rationale: 단순한 정도 감탄이 아니라 ‘이루는/성취하는 결과’를 드러내기 위해 결과적 의미를 보완해 자연스럽게 옮겼습니다.
- source_word: κατεργάζεται
  english_pob_choice: accomplish
  chosen_korean: 이루는지
  alternatives_korean:
  - 성취하는지
  - 일해 내는지
  lexicon: κατεργάζομαι
  rationale: 완료적 결과를 강조하는 동사로 이해하여 ‘이루다’로 옮겼습니다. 영어 POB의 ‘accomplish’와도 맞닿습니다.
theological_decisions:
- issue: 인내와 기도의 공동 주어 관계
  chosen_reading: 인내와 금식하는 기도가 함께 많은 일을 이룹니다.
  alternative_readings:
  - 인내가 많은 일을 이루고, 금식하는 기도가 그에 더해진다
  - 인내가, 그리고 금식과 함께하는 기도가 많은 일을 이룬다
  rationale: 그리스어 본문은 인내와 ‘금식과 함께하는 기도’를 함께 묶어 동사의 주어로 제시하므로, 둘 모두의 효력을 균형 있게 드러냈습니다.
  doctrine_reference: 문맥상 덕목의 효력과 실천의 결합을 강조하는 지혜/권면 문장
