id: T12P.JOS.10.2
reference: Testament of Joseph 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὕτως καὶ ὑμεῖς⁴, ⌜ἐὰν τὴν σωφροσύνην καὶ τὴν ἁγνείαν μεταδιώκητε⁵ ἐν ὑπομονῇ καὶ *προσευχῇ μετὰ νηστείας ἐν ταπεινώσει⁶ καρδίας, ὁ⁷ Κύριος κατοικήσει⁸ ἐν ὑμῖν, ὅτι ἀγαπᾷ⁹ τὴν σωφροσύνην.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/002.yaml
  text: So you also, if you pursue self-control and purity with endurance and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.
translation:
  language: ko
  text: 이와 같이 여러분도, 절제와 순결을 인내와 기도와 금식으로, 마음의 겸손함으로 추구하면, 주께서 여러분 안에 거하실 것입니다. 왜냐하면 그분은 절제를 사랑하십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 근신
  - 절제심
  lexicon: σωφροσύνη
  rationale: POB의 self-control을 한국어에서 가장 직접적으로 옮길 수 있는 표준어로 절제를 채택했습니다. 신체적·도덕적 자기통제의 넓은 뜻을 유지합니다.
- source_word: ἁγνείαν
  english_pob_choice: purity
  chosen_korean: 순결
  alternatives_korean:
  - 정결
  - 청결
  - 순수함
  lexicon: ἁγνεία
  rationale: 도덕적·성적 순수성을 가리키는 문맥이므로, POB의 purity를 한국어 교회 문맥에서 널리 이해되는 순결로 옮겼습니다.
- source_word: ἐν ὑπομονῇ καὶ προσευχῇ μετὰ νηστείας
  english_pob_choice: with endurance and prayer with fasting
  chosen_korean: 인내와 기도와 금식으로
  alternatives_korean:
  - 인내와 금식과 기도로
  - 인내 가운데 기도와 금식을 하며
  lexicon: ὑπομονή / προσευχή / νηστεία
  rationale: 세 개의 수단을 한 덩어리로 자연스럽게 풀어, 기도와 금식이 인내와 함께 절제·순결 추구를 뒷받침하는 의미를 살렸습니다.
- source_word: ἐν ὑμῖν
  english_pob_choice: in you
  chosen_korean: 여러분 안에
  alternatives_korean:
  - 여러분 가운데
  - 여러분 속에
  lexicon: ἐν + pronoun
  rationale: 최신 영어 POB 개정이 'in you'로 확정한 점을 따라, 공동체적 의미를 잃지 않으면서도 내적 거주를 분명히 하는 표현을 택했습니다.
theological_decisions:
- issue: 주께서 '여러분 안에 거하실 것입니다'의 내적 거주 표현
  chosen_reading: 주께서 공동체/개인 안에 실제로 거하시는 내주를 그대로 번역했습니다.
  alternative_readings:
  - 주께서 여러분 가운데 거하실 것입니다
  - 주께서 여러분과 함께 거하실 것입니다
  rationale: 원문 ἐν ὑμῖν과 영어 POB의 최신 판독이 모두 내적 거주를 가리키므로, 완화된 '가운데/함께'보다 직접적인 '안에'를 유지했습니다.
  doctrine_reference: 성령 내주/하나님의 임재
- issue: 합쇼체 서술 속 인용된 준-교훈적 문장의 어조
  chosen_reading: 본문 전체를 현대 표준어 합쇼체로 유지하되, 권면의 조건문 구조를 그대로 살렸습니다.
  alternative_readings:
  - 더 설교체적인 표현
  - 보다 직역적인 어순
  rationale: 이 전승문은 서간체와 유사한 교훈성을 가지므로, 읽기 쉬운 합쇼체를 유지하면서도 원문의 조건-결과 구조를 보존했습니다.
  doctrine_reference: 문체/등록 일관성
