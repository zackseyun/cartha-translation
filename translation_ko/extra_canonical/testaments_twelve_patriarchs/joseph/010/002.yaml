revisions:
- from: 이와 같이 여러분도, 절제와 순결을 인내와 기도와 금식으로, 마음의 겸손함으로 추구하면, 주께서 여러분 안에 거하실 것입니다. 왜냐하면 그분은 절제를 사랑하십니다.[a]
  to: 이와 같이 여러분도 마음의 겸손 가운데 인내하며 금식과 함께 기도하면서 절제와 순결을 추구한다면, 주께서 여러분 안에 거하실 것입니다. 그분은 절제를 사랑하시기 때문입니다.
  rationale: 원문의 수단·태도 표현을 자연스러운 한국어 어순으로 재구성하되, 절제와 순결을 추구한다는 조건과 주께서 여러분 안에 거하신다는 결과를 그대로 유지했습니다. 금식이 기도와 결합되어 있음을 분명히 했고, 근거 접속사는 합쇼체 문맥에 맞게 ‘때문입니다’로 옮겼습니다. 제공되지 않은 주석에 대한 앵커는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:34Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 조건-결과 구조와 핵심 어휘는 대체로 충실합니다. 다만 ‘기도와 금식’은 기도와 금식이 단순 병렬인 것보다 ‘금식을 동반한 기도’(προσευχῇ μετὰ νηστείας)라는 관계가 드러나는 편이 더 정확합니다. ἐν ταπεινώσει καρδίας도 ‘마음의 겸손함으로’보다 ‘마음의 겸손 가운데’가 원문의 상태·태도 표현을 더 자연스럽게 보존합니다.
  naturalness: 초안의 ‘인내와 기도와 금식으로, 마음의 겸손함으로’는 조사 반복과 쉼표 때문에 수식 관계가 불분명하고 다소 부자연스럽습니다. 문장 성분을 재배치하면 현대 표준어 합쇼체의 권면 문장으로 자연스럽게 읽힙니다.
  terminology: ‘절제’(σωφροσύνη), ‘순결’(ἁγνεία), ‘주’, ‘거하실 것입니다’는 문맥과 등록에 적절합니다. ἐν ὑμῖν은 영어 감사 이력과 그리스어에 맞추어 ‘여러분 안에’를 유지합니다.
  issues:
  - severity: medium
    issue: ‘기도와 금식’의 관계가 단순 병렬로 보임
    rationale: 그리스어 προσευχῇ μετὰ νηστείας는 ‘금식과 함께하는 기도’라는 결합을 나타냅니다. ‘금식과 함께 기도하면서’로 옮기면 관계를 명료하게 보존합니다.
  - severity: low
    issue: ‘마음의 겸손함으로’의 문체와 수식 범위가 다소 어색함
    rationale: ἐν ταπεινώσει καρδίας는 추구 행위를 규정하는 태도입니다. ‘마음의 겸손 가운데’가 더 자연스럽고 원문의 전치사구 기능을 살립니다.
  - severity: low
    issue: 본문 끝의 [a]에 대응하는 주석이 제공되지 않음
    rationale: 제공된 자료에 [a]의 주석 내용이나 근거가 없으므로, 고아 앵커를 제거하는 것이 완결된 본문 형식에 적절합니다.
  revised_text: 이와 같이 여러분도 마음의 겸손 가운데 인내하며 금식과 함께 기도하면서 절제와 순결을 추구한다면, 주께서 여러분 안에 거하실 것입니다. 그분은 절제를 사랑하시기 때문입니다.
