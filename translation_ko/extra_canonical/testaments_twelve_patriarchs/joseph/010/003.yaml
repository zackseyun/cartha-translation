revisions:
- from: 그러나 지극히 높으신 분이 거하시는 곳에는, 누군가에게 시기나 노예 상태나 중상모략이 닥치더라도, 그와 함께 거하시는 주께서 그의 절제 때문에 그를 악에서만 건지실 뿐 아니라, 그를 높이시고 영화롭게 하시니, 나에게 하신 것과 같습니다.[a]
  to: 그러나 지극히 높으신 분이 거하시는 곳에서는, 누군가에게 시기나 노예 상태나 중상모략이 닥치더라도, 그의 절제 때문에 그에게 임하여 계시는 주께서 그를 악에서 건지실 뿐만 아니라 높이시고 영화롭게 하십니다. 나에게 하신 것과 같습니다.
  rationale: 원문의 ‘not only … but also’ 대조를 정확히 복원하고, ἐπ᾽ αὐτόν 및 διὰ τὴν σωφροσύνην의 연결을 반영했습니다. 제공되지 않은 주석을 가리키는 [a]는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
