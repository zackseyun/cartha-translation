id: T12P.JOS.10.3
reference: Testament of Joseph 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅπου δὲ κατοικεῖ ὁ ὕψιστος¹⁰, κἂν *φθόνος τις περιπέσῃ, κἂν δουλία, κἂν συκοφαντία¹¹, *ὁ Κύριος κατοικῶν ἐπ᾽ αὐτὸν¹² διὰ τὴν σωφροσύνην οὐ μόνον⁷ ἐκ τῶν κακῶν ῥύεται¹³ αὐτόν¹⁴, ⸀ἀλλὰ καὶ ὑψοῖ¹⁵ καὶ δοξάζει αὐτὸν ὡς κἀμέ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/003.yaml
  text: But where the Most High dwells, even if envy should fall upon someone, or slavery, or slander, the Lord who dwells with him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.
translation:
  language: ko
  text: 그러나 지극히 높으신 분이 거하시는 곳에는, 누군가에게 시기나 노예 상태나 중상모략이 닥치더라도, 그와 함께 거하시는 주께서 그의 절제 때문에 그를 악에서만 건지실 뿐 아니라, 그를 높이시고 영화롭게 하시니, 나에게 하신 것과 같습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος / ὁ Κύριος
  english_pob_choice: the Most High / the Lord
  chosen_korean: 지극히 높으신 분 / 주
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 하나님
  - 주님
  lexicon: ὕψιστος, κύριος
  rationale: ὕψιστος는 하나님의 칭호로 ‘지극히 높으신 분’이 자연스럽고, 뒤의 κύριος는 관계절에서 반복을 살려 ‘주’로 옮겼습니다.
- source_word: δουλία
  english_pob_choice: slavery
  chosen_korean: 노예 상태
  alternatives_korean:
  - 노예됨
  - 종살이
  - 종속
  lexicon: δουλία
  rationale: POB가 slavery로 구체화한 bonded 상태를 살리기 위해, 추상적인 ‘종속’보다 사회적 구속을 드러내는 ‘노예 상태’를 택했습니다.
- source_word: συκοφαντία
  english_pob_choice: slander
  chosen_korean: 중상모략
  alternatives_korean:
  - 비방
  - 모함
  - 참소
  lexicon: συκοφαντία
  rationale: 단순한 험담보다 누명을 씌우는 악의를 포함하는 어감이 있어, 문맥에 맞는 ‘중상모략’을 사용했습니다.
- source_word: ῥύεται ἐκ τῶν κακῶν
  english_pob_choice: rescues him from evils
  chosen_korean: 악에서만 건지실 뿐 아니라
  alternatives_korean:
  - 악들에서 건지실 뿐 아니라
  - 재난에서 건지실 뿐 아니라
  - 악에서 구해 주실 뿐 아니라
  lexicon: ῥύομαι, κακά
  rationale: 복수형 κακά를 그대로 ‘악들’로 옮기기보다, 일반화된 악의 영역으로 자연스럽게 드러내는 ‘악’이 한국어 문맥에 더 적합합니다.
- source_word: σωφροσύνην
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 근신
  - 건전한 마음가짐
  lexicon: σωφροσύνη
  rationale: 윤리적 미덕으로서의 σωφροσύνη는 한국어 성경에서 통용되는 ‘절제’가 가장 직접적이며, 문맥상 행실의 통제를 잘 반영합니다.
theological_decisions:
- issue: ‘지극히 높으신 분’과 ‘주’의 이중 호칭
  chosen_reading: 첫 절은 하나님의 절대 주권을 가리키는 칭호로, 뒤의 주는 그와 함께 거하시는 분으로 읽어 구분했습니다.
  alternative_readings:
  - 둘을 모두 ‘주님’으로 통일
  - ‘지극히 높으신 하나님’으로만 표현
  rationale: 원문은 ὁ ὕψιστος와 ὁ Κύριος를 구별해 사용하므로, 한국어에서도 호칭의 차이를 살려 신학적 긴장을 유지했습니다.
  doctrine_reference: 하나님의 초월성과 임재
