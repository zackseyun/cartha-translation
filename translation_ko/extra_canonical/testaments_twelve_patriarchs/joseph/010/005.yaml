id: T12P.JOS.10.5
reference: Testament of Joseph 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Γινώσκουσιν¹⁹ οἱ ἀδελφοί μου²⁰ πῶς ἠγάπησέ με ὁ πατήρ μου²¹, καὶ οὐχὶ²² ὑψούμην²³ ⸀ἐν τῇ διανοίᾳ²⁴ μου⸃, καίπερ νήπιος ὑπάρχων²⁵, ⸀εἶχον τὸν *φόβον τοῦ θεοῦ²⁶ ἐν τῇ καρδίᾳ²⁷ μου⸃· ᾔδειν²⁸ γὰρ ὅτι πάντα²⁹ παρελεύσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/005.yaml
  text: My brothers knew how my father loved me, yet I was not exalted in my mind; though I was a child, I had the fear of God in my heart, for I knew that surely all things will pass away.
translation:
  language: ko
  text: 내 형제들은 내 아버지께서 나를 얼마나 사랑하셨는지 알고 있습니다. 그러나 나는 마음속으로 교만해지지 않았습니다. 비록 어린아이였지만, 나는 하나님을 두려워하는 마음을 품고 있었습니다. 이는 모든 것이 지나갈 것을 알고 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπησέ με ὁ πατήρ μου
  english_pob_choice: my father loved me
  chosen_korean: 내 아버지께서 나를 얼마나 사랑하셨는지
  alternatives_korean:
  - 내 아버지께서 나를 사랑하셨는지
  - 아버지께서 나를 사랑하셨음을
  lexicon: ἀγαπάω
  rationale: 사랑의 사실을 단순한 정보로만 옮기지 않고, 문맥상 강조되는 ‘얼마나’의 뉘앙스를 살려 아버지의 애정을 드러냈습니다.
- source_word: ὑψούμην ἐν τῇ διανοίᾳ μου
  english_pob_choice: I was not exalted in my mind
  chosen_korean: 나는 마음속에서 높아지지 않았습니다
  alternatives_korean:
  - 나는 생각에서 높아지지 않았습니다
  - 나는 마음이 교만해지지 않았습니다
  lexicon: ὑψόω / διάνοια
  rationale: ‘마음’은 διάνοια의 인지·내적 자리 전체를 자연스럽게 담고, ‘높아지다’는 수동형의 상태 변화를 살려 자만의 시작을 직역에 가깝게 옮겼습니다.
- source_word: τὸν φόβον τοῦ θεοῦ
  english_pob_choice: the fear of God
  chosen_korean: 하나님의 두려움
  alternatives_korean:
  - 하나님에 대한 두려움
  - 하나님을 경외함
  lexicon: φόβος τοῦ θεοῦ
  rationale: 본문은 경외와 두려움의 긴장을 함께 지니므로, 교리적으로 평탄화된 ‘경외함’보다 원문의 강도를 보존하는 표현을 택했습니다.
- source_word: πάντα παρελεύσεται
  english_pob_choice: all things will pass away
  chosen_korean: 모든 것이 반드시 지나가리라는
  alternatives_korean:
  - 모든 것이 지나가리라는
  - 모든 것이 반드시 사라지리라는
  lexicon: παρέρχομαι
  rationale: ἔνταση가 있는 미래 진술로서 ‘반드시’를 넣어 영어 POB의 의미를 반영하되, 한국어 어순에 맞게 ‘모든 것이’ 앞에 두었습니다.
theological_decisions:
- issue: φόβος τοῦ θεοῦ의 신학적 뉘앙스
  chosen_reading: ‘하나님의 두려움’으로 유지해 경외와 두려움의 긴장을 함께 드러냅니다.
  alternative_readings:
  - ‘하나님에 대한 경외함’
  - ‘하나님을 경외하는 마음’
  rationale: 이 문맥은 단순한 경건 태도보다 하나님 앞에서의 실제적 두려움과 경외를 함께 말하므로, 의미를 완화하지 않는 번역이 더 적절합니다.
  doctrine_reference: 지혜문학과 신앙 고백 전반의 ‘여호와(야훼)를 경외함’ 전통
