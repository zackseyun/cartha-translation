review_pass:
  verdict: revise
  source_fidelity: 핵심 구문은 대체로 충실합니다. διὰ τὸν φόβον αὐτῶν은 형제들에 대한 두려움으로, πιπρασκόμενος는 팔리고 있는 상황으로, δικαίου는 야곱을 수식하는 ‘의로운’으로 적절히 반영되었습니다. 다만 ‘악에 들떠’는 ἐν κακῷ와 ἐπήρθην이 결합한 의미를 현대 한국어에서 다소 부자연스럽게 전달합니다.
  naturalness: 합쇼체와 문장 흐름은 전반적으로 적절하지만, ‘악에 들떠 있지 않았습니다’와 ‘팔려 가는 동안’은 각각 어색하거나 다소 다른 장면(이동)을 연상시킬 수 있습니다. ‘악한 일로 우쭐해지지 않았습니다’ 및 ‘팔리고 있을 때’가 더 자연스럽고 정확합니다.
  terminology: ‘형제들’, ‘존중했습니다’, ‘이스마엘 사람들’, ‘위대하고 의로운 사람’은 현대 표준어 및 본문 문맥에 적합합니다. 야곱을 수식하는 두 형용사의 관계는 ‘위대하고 의로운 사람인 야곱’으로 명료하게 나타낼 수 있습니다.
  issues:
