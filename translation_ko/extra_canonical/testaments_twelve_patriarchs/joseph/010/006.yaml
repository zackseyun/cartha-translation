  - severity: low
    issue: ‘팔려 가는 동안’의 사건 의미
    rationale: πιπρασκόμενος는 ‘팔리고 있을 때/팔리는 중에’라는 수동 판매 행위를 가리킵니다. ‘팔려 가다’는 판매 뒤의 이동을 더 강하게 암시할 수 있습니다.
  revised_text: 그리고 저는 악한 일로 우쭐해지지 않았습니다. 오히려 저는 제 형제들을 존중했습니다. 또 그들이 두려웠기 때문에, 팔리고 있을 때 이스마엘 사람들에게 제가 위대하고 의로운 사람인 야곱의 아들이라고 말하지 않고 침묵했습니다.
