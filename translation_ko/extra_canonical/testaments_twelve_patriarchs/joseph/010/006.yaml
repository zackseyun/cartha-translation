id: T12P.JOS.10.6
reference: Testament of Joseph 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ *†οὐκ ἐπήρθην ἐν κακῷ† ἀλλ᾽³⁰ ἐτίμουν *τοὺς ἀδελφούς μου³¹, καὶ διὰ τὸν φόβον αὐτῶν³² *καὶ ἐσιώπουν πιπρασκόμενος ἐσιώπουν³³ εἰπεῖν³⁴ *τοῖς Ἰσμαϊλίταις³⁵ ὅτι³⁶ υἱός εἰμι Ἰακὼβ³⁷ ἀνδρὸς μεγάλου³⁸ *καὶ δικαίου³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/006.yaml
  text: And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent when I was being sold, not telling the Ishmaelites that I was a son of Jacob, a great and righteous man.
translation:
  language: ko
  text: 그리고 저는 악한 일로 우쭐해지지 않았습니다. 오히려 저는 제 형제들을 존중했습니다. 또 그들이 두려웠기 때문에, 팔리고 있을 때 이스마엘 사람들에게 제가 위대하고 의로운 사람인 야곱의 아들이라고 말하지 않고 침묵했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐπήρθην ἐν κακῷ
  english_pob_choice: I was not puffed up in evil
  chosen_korean: 악에 들떠 있지 않았습니다
  alternatives_korean:
  - 악 속에서 교만해지지 않았습니다
  - 악으로 인해 마음이 높아지지 않았습니다
  lexicon: ἐπαίρω
  rationale: ἐπήρθην은 ‘들뜨다/높아지다’의 수동형 뉘앙스를 가지므로, 단순한 ‘교만하다’보다 상태 변화를 살린 표현을 택했습니다.
- source_word: ἐτίμουν τοὺς ἀδελφούς μου
  english_pob_choice: I honored my brothers
  chosen_korean: 형제들을 존중했습니다
  alternatives_korean:
  - 형제들을 공경했습니다
  - 형제들을 귀하게 여겼습니다
  lexicon: τιμάω
  rationale: τιμάω는 존중·공경·가치 부여를 포함하므로, 현대 한국어에서 자연스럽고 넓은 의미를 살리는 ‘존중했습니다’를 택했습니다.
- source_word: διὰ τὸν φόβον αὐτῶν
  english_pob_choice: because of fear of them
  chosen_korean: 그들을 두려워했기 때문에
  alternatives_korean:
  - 그들에 대한 두려움 때문에
  - 그들에 대한 경외 때문에
  lexicon: φόβος
  rationale: 문맥상 감정적 두려움을 가리키므로 ‘두려워했습니다’로 풀어, 원문의 원인 관계를 자연스럽게 드러냈습니다.
- source_word: πιπρασκόμενος
  english_pob_choice: when I was being sold
  chosen_korean: 팔려 가는 동안
  alternatives_korean:
  - 팔리는 중에
  - 팔리고 있을 때
  lexicon: πιπράσκω
  rationale: 분사형의 진행 상황을 살리되 한국어 문장 흐름에 맞게 ‘팔려 가는 동안’으로 옮겼습니다.
- source_word: υἱός εἰμι Ἰακὼβ ἀνδρὸς μεγάλου καὶ δικαίου
  english_pob_choice: I was a son of Jacob, a great and righteous man
  chosen_korean: 제가 야곱의 아들, 곧 위대하고 의로운 사람의 아들이라고
  alternatives_korean:
  - 제가 야곱의 아들, 곧 크고 의로운 사람의 아들이라고
  - 제가 야곱의 아들, 곧 위대하고 의로운 분의 아들이라고
  lexicon: δίκαιος
  rationale: δικαίου는 윤리적·종교적 의미의 ‘의로운’이 핵심이므로, 영어 POB의 수정 반영을 따라 ‘의로운’으로 번역했습니다.
theological_decisions:
- issue: 자기 정체성 숨김의 서술 톤
  chosen_reading: ‘말하지 않은 채 침묵했습니다’로 옮겨, 단순 무응답이 아니라 의도적 자기 보존과 침묵의 긴장을 드러냈습니다.
  alternative_readings:
  - ‘말하지 않았습니다’
  - ‘침묵했습니다’
  rationale: 그리스어의 반복된 ἐσιώπουν과 부정적 부정사 εἰπεῖν을 함께 반영해, 말하지 않음의 지속성과 의도를 모두 살렸습니다.
  doctrine_reference: 서사적 정체성 보존/지혜로운 침묵
- issue: ‘위대하고 의로운 사람’의 수식 관계
  chosen_reading: ‘야곱의 아들, 곧 위대하고 의로운 사람의 아들’로 처리해, 야곱의 인물 평가가 아들의 자기 인식 근거가 되도록 했습니다.
  alternative_readings:
  - ‘야곱의 아들인 위대하고 의로운 사람’
  - ‘위대하고 의로운 야곱의 아들’
  rationale: 그리스어는 야곱을 ‘큰/위대한 사람’과 ‘의로운 사람’으로 설명하는 구조이므로, 한국어에서도 연결어 ‘곧’으로 설명적 관계를 보존했습니다.
  doctrine_reference: 본문 구조 보존
