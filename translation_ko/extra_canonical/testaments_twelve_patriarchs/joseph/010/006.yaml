revisions:
- from: 그리고 저는 악에 들떠 있지 않았습니다. 오히려 저는 형제들을 존중했습니다. 또 그들을 두려워했기 때문에, 팔려 가는 동안 이스마엘 사람들에게 제가 야곱의 아들, 곧 위대하고 의로운 사람의 아들이라고 말하지 않은 채 침묵했습니다.[a]
  to: 그리고 저는 악한 일로 우쭐해지지 않았습니다. 오히려 저는 제 형제들을 존중했습니다. 또 그들이 두려웠기 때문에, 팔리고 있을 때 이스마엘 사람들에게 제가 위대하고 의로운 사람인 야곱의 아들이라고 말하지 않고 침묵했습니다.
  rationale: 의미를 바꾸지 않고 ἐπήρθην의 비유적 상승·자만의 뜻을 ‘우쭐해지지’로 자연스럽게 옮겼으며, πιπρασκόμενος의 진행 중인 수동 판매를 ‘팔리고 있을 때’로 명확히 했습니다. 야곱을 수식하는 μεγάλου καὶ δικαίου의 관계도 한국어에서 자연스럽고 분명하게 정리했습니다.
