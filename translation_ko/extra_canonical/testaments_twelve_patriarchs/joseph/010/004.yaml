  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/004.yaml
  text: For it comes upon all people either in deed or in word or in mind.
translation:
  language: ko
  text: 그러므로 모든 사람에게는 행위로든 말로든 마음으로든 함께 이루어집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντας γὰρ ἀνθρώπους
  english_pob_choice: all people
  chosen_korean: 모든 사람에게는
  alternatives_korean:
  - 모든 사람들에게는
  - 모든 인류에게는
  lexicon: πάντας / ἀνθρώπους
  rationale: πάντας ἀνθρώπους를 자연스러운 총칭으로 살려 ‘모든 사람’을 썼고, 조사 ‘에게는’로 뒤의 동사구가 그들에게 해당함을 드러냈습니다.
- source_word: ἢ ἐν ἔργῳ ἢ ἐν λόγῳ ἢ ἐν διανοίᾳ
  english_pob_choice: either in deed or in word or in mind
  chosen_korean: 행위로든 말로든 마음으로든
  alternatives_korean:
  - 행동으로든 말로든 생각으로든
  - 일로든 말로든 뜻으로든
  lexicon: ἔργῳ / λόγῳ / διανοίᾳ
  rationale: ἔργῳ, λόγῳ, διανοίᾳ의 세 병렬 항목을 한국어의 대조 연결 ‘-로든’으로 옮겨 원문의 열거 구조를 그대로 보존했습니다.
- source_word: συνέρχεται
  english_pob_choice: comes upon
  chosen_korean: 함께 이루어집니다
  alternatives_korean:
  - 모여듭니다
  - 함께 옵니다
  - 일어납니다
  lexicon: συνέρχομαι
  rationale: 문맥상 단순한 ‘오다’보다 ‘함께 이루어지다’가 원문의 결합·집합성을 더 잘 드러내며, 영어 개정본이 드러낸 의미 방향과도 부합합니다.
theological_decisions:
- issue: συνέρχεται의 의미를 한국어에서 어떻게 처리할지
  chosen_reading: 도덕적 행위의 범주가 사람에게 ‘함께 이루어지는/작동하는’ 것으로 옮김
  alternative_readings:
  - 사람 위에 임합니다
  - 사람에게 다가옵니다
  rationale: 이 문장은 단순한 이동이 아니라 행위·말·마음의 영역에서 하나로 모이는 성격을 말하므로, 한국어도 그 결합성을 보존하는 쪽이 더 본문에 충실합니다.
  doctrine_reference: 문맥상 인간의 행위 전반을 포괄하는 윤리적 진술
