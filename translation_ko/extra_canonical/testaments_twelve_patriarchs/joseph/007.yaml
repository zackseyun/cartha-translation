base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007.yaml
  text: '7. So that you may learn that the wickedness of the ungodly will not prevail over those who fear God in self-control, look: taking some of it before him, I ate it in your presence. And after saying this, I tasted it and said, “The God of my fathers and the angel of Abraham will be with me.” And I ate.


    8. But when she saw this, she fell on her face at my feet, weeping; and raising her up, I admonished her.


    9. And she agreed with me not to commit this impiety any longer. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would collapse suddenly, though she was not sick.


    10. And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he tried to heal her with words.


    11. Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking; or I will throw myself down a cliff, if you do not join yourself with me.”


    12. But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,


    13. “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband''s concubine, your rival, will beat your children and wipe out your memory from the earth.”'
translation:
  language: ko
  text: '7. 그러므로 당신이 알게 하려는 것입니다. 경건하지 않은 자들의 악함은 절제하며 하나님을 경외하는 이들을 이기지 못합니다. 보십시오, 내가 그것을 그에게서 받아 당신 앞에서 먹었습니다. 이렇게 말한 뒤에 내가 말했습니다. “내 조상들의 하나님과 아브라함의 천사가 나와 함께하실 것입니다.” 그리고 나는 먹었습니다.


    8. 그녀가 이것을 보고 내 발 앞에 얼굴을 대고 엎드려 울었습니다. 나는 그녀를 일으켜 세우고 훈계했습니다.


    9. 그러자 그녀는 더 이상 이 불경을 행하지 않기로 내게 동의했습니다. 그러나 그녀의 마음은 여전히 악에 기울어 있었고, 어떻게 하면 나를 덫에 빠뜨릴 수 있을지 계속 살폈습니다. 그녀는 신음하면서 병들지 않았는데도 갑자기 쓰러지곤 했습니다.


    10. 그녀의 남편이 이를 보고 그녀에게 말했습니다. “당신의 얼굴이 왜 이렇게 되었소?” 그녀가 그에게 말했습니다. “나는 마음의 고통으로 괴롭습니다. 내 영의 신음이 나를 짓누릅니다.” 그러자 그는 말로 그녀를 낫게 하려 했습니다.


    11. 그러던 중 그녀가 기회를 얻어, 남편이 아직 밖에 있는 동안 나에게 달려들어 말했습니다. “숨이 막힙니다. 당신이 나와 관계하지 않으면, 그렇지 않으면 내가 절벽으로 몸을 던지겠습니다.”


    12. 나는 베리아르의 영이 그녀를 괴롭히고 있음을 알고 주님께 기도한 뒤, 그녀에게 말했습니다.


    13. “가련한 여자여, 어찌하여 당신은 마음이 어지럽고 혼란에 빠져 죄 가운데서 스스로 눈멀게 합니까? 기억하십시오. 당신이 스스로 목숨을 끊는다면, 당신 남편의 첩이며 당신의 경쟁자인 아스테토가 당신의 자녀들을 주먹으로 치고, 땅에서 당신의 기억을 없애 버릴 것입니다.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεοσεβούντων
  english_pob_choice: those who fear God in self-control
  chosen_korean: 절제하며 하나님을 경외하는 이들
  alternatives_korean:
  - 하나님을 경외하는 자들
  - 하나님을 경외하며 절제하는 사람들
  lexicon: θεοσεβέω
  rationale: POB의 ‘in self-control’는 단순한 도덕 수식이 아니라 경건의 방식으로서의 절제를 드러내므로, 두 요소를 모두 살려 옮겼습니다.
- source_word: οὐ κατισχύσει
  english_pob_choice: will not prevail over
  chosen_korean: 이기지 못합니다
  alternatives_korean:
  - 능가하지 못합니다
  - 압도하지 못합니다
  lexicon: κατισχύω
  rationale: 문맥상 악이 경건한 자들을 지배하지 못한다는 승패 이미지가 핵심이어서, 자연스러운 현대 한국어로 ‘이기다’를 택했습니다.
- source_word: ἄγγελος Ἀβραὰμ
  english_pob_choice: the angel of Abraham
  chosen_korean: 아브라함의 천사
  alternatives_korean:
  - 아브라함의 사자
  - 아브라함 천사
  lexicon: ἄγγελος
  rationale: 본문의 직접 표현을 유지해 ‘천사’로 옮겼고, 인물명과의 속격 관계도 그대로 드러냈습니다.
- source_word: ἐνουθέτησα
  english_pob_choice: admonished
  chosen_korean: 훈계했습니다
  alternatives_korean:
  - 권면했습니다
  - 타일렀습니다
  lexicon: νουθετέω
  rationale: 단순 위로보다 도덕적 경고와 교정의 뜻이 강하므로, 한국어 성경에서 널리 이해되는 ‘훈계하다’를 택했습니다.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  english_pob_choice: join yourself with me
  chosen_korean: 나와 한몸이 되지
  alternatives_korean:
  - 나와 관계하지
  - 나와 결합하지
  lexicon: συγγίνομαι
  rationale: POB가 성적 관계를 완곡하게 드러내는 ‘join yourself with me’를 따르되, 한국어에서도 그 함의를 분명히 하는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘경건하지 않은 자들’과 ‘하나님을 경외하는 이들’의 대비
  chosen_reading: 도덕적 대비이면서도 공동체적 신앙 정체성을 드러내는 대조로 유지했습니다.
  alternative_readings:
  - ‘불경한 자들’/‘하나님을 두려워하는 자들’로 더 직역
  - 윤리적 교훈으로만 약화
  rationale: 원문은 단순한 성품 비교가 아니라 경건과 불경의 대립을 통해 요셉의 신실함을 증명하므로, 신학적 대비를 살려야 합니다.
  doctrine_reference: 경건/불경의 대조, 하나님의 보호와 신실한 자의 보존
- issue: ‘베리아르의 영’
  chosen_reading: 악한 영의 실재적 작용을 그대로 드러냈습니다.
  alternative_readings:
  - ‘벨리알의 기운’
  - ‘악한 충동’
  rationale: POB는 이를 인격적 영으로 읽고 있으므로, 심리화하지 않고 원문이 가진 영적 충돌의 강도를 유지했습니다.
  doctrine_reference: 악한 영/영적 유혹의 실재
