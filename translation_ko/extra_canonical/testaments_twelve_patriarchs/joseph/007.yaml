review_pass:
  verdict: revise
  source_fidelity: 여러 핵심 구절이 그리스어 본문과 어긋나거나 불필요하게 의미를 바꿉니다. 7절의 수신자는 단수이며, ‘그것의 일부’와 ‘맛보고’는 제시된 그리스어 본문에 근거가 약합니다. 9절은 여인이 요셉과 함께 불경을 행하지 않기로 동의한 것이 아니라 그 불경을 더는 행하지 않기로 동의한 것입니다. 11절의 ‘한몸이 되다’는 원문의 성적 완곡어법을 결혼·신학 용어처럼 들리게 바꿉니다. 13절의 이름은 Ἀστηθώ에 따라 ‘아스테토’로 바로잡고, ‘성가시게 흔들리며’도 원문의 혼란과 죄로 인한 눈멂을 반영하도록 고쳤습니다.
  naturalness: 합쇼체는 대체로 유지되었으나, ‘너희가 알다시피’, ‘무슨 일이 당신의 얼굴에 일어났습니까?’, ‘성가시게 흔들리며’는 현대 표준 한국어로 부자연스럽거나 뜻이 맞지 않습니다. 직접 인용 안에서는 ‘당신’과 정중한 종결을 일관되게 사용해 현대적인 형식을 유지했습니다.
  terminology: θεοσεβούντων은 ‘하나님을 경외하며 절제하는 이들’로, Βελίαρ는 음역하여 ‘베리아르’로 유지했습니다. συγγενῇ μετ᾿ ἐμοῦ는 문맥상 성적 관계를 뜻하므로 지나치게 혼인적·신학적인 ‘한몸’ 대신 자연스러운 완곡 표현인 ‘나와 관계하지 않으면’으로 옮겼습니다. Ἀστηθώ는 그리스어 표기에 맞추어 ‘아스테토’로 옮겼습니다.
