    rationale: συγγενῇ μετ᾿ ἐμοῦ는 이 문맥에서 성관계를 청하는 말입니다. ‘한몸’은 한국어에서 창세기 및 혼인 신학의 고정 표현으로 들려 원문보다 특정한 연상을 더합니다.
