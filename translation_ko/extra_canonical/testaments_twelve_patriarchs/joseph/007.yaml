  revised_text: '7. 그러므로 당신이 알게 하려는 것입니다. 경건하지 않은 자들의 악함은 절제하며 하나님을 경외하는 이들을 이기지 못합니다. 보십시오, 내가 그것을 그에게서 받아 당신 앞에서 먹었습니다. 이렇게 말한 뒤에 내가 말했습니다. “내 조상들의 하나님과 아브라함의 천사가 나와 함께하실 것입니다.” 그리고 나는 먹었습니다.


    8. 그녀가 이것을 보고 내 발 앞에 얼굴을 대고 엎드려 울었습니다. 나는 그녀를 일으켜 세우고 훈계했습니다.


    9. 그러자 그녀는 더 이상 이 불경을 행하지 않기로 내게 동의했습니다. 그러나 그녀의 마음은 여전히 악에 기울어 있었고, 어떻게 하면 나를 덫에 빠뜨릴 수 있을지 계속 살폈습니다. 그녀는 신음하면서 병들지 않았는데도 갑자기 쓰러지곤 했습니다.


    10. 그녀의 남편이 이를 보고 그녀에게 말했습니다. “당신의 얼굴이 왜 이렇게 되었소?” 그녀가 그에게 말했습니다. “나는 마음의 고통으로 괴롭습니다. 내 영의 신음이 나를 짓누릅니다.” 그러자 그는 말로 그녀를 낫게 하려 했습니다.


    11. 그러던 중 그녀가 기회를 얻어, 남편이 아직 밖에 있는 동안 나에게 달려들어 말했습니다. “숨이 막힙니다. 당신이 나와 관계하지 않으면, 그렇지 않으면 내가 절벽으로 몸을 던지겠습니다.”


    12. 나는 베리아르의 영이 그녀를 괴롭히고 있음을 알고 주님께 기도한 뒤, 그녀에게 말했습니다.


    13. “가련한 여자여, 어찌하여 당신은 마음이 어지럽고 혼란에 빠져 죄 가운데서 스스로 눈멀게 합니까? 기억하십시오. 당신이 스스로 목숨을 끊는다면, 당신 남편의 첩이며 당신의 경쟁자인 아스테토가 당신의 자녀들을 주먹으로 치고, 땅에서 당신의 기억을 없애 버릴 것입니다.”'
