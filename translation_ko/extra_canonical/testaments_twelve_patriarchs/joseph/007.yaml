revisions:
- from: '7. 그러므로 너희가 알다시피, 경건하지 않은 자들의 악함은 절제하며 하나님을 경외하는 이들을 이기지 못합니다. 보라, 내가 그것의 일부를 그 앞에서 가져다가, 너희 앞에서 먹었습니다. 그리고 이렇게 말한 뒤, 내가 그것을 맛보고 말했습니다. “내 조상의 하나님과 아브라함의 천사는 나와 함께하실 것입니다.” 그리고 내가 먹었습니다.


    8. 그런데 그녀가 이것을 보고는, 내 발 앞에 얼굴을 대고 엎드려 울었습니다. 나는 그녀를 일으켜 세우고 훈계했습니다.


    9. 그러자 그녀는 더 이상 그 불경한 일을 저와 함께하지 않겠다고 동의했습니다. 그러나 그녀의 마음은 여전히 악에 기울어 있었고, 어떻게 하면 저를 덫에 걸리게 할지 계속 둘러보았습니다. 그리고 신음하면서, 병은 없었지만 갑자기 쓰러지곤 했습니다.


    10. 그녀의 남편이 그녀를 보고는 말했습니다. “무슨 일이 당신의 얼굴에 일어났습니까?” 그녀가 그에게 말했습니다. “나는 마음의 고통으로 아픕니다. 그리고 내 영의 신음이 나를 붙들고 있습니다.” 그러자 그는 말로 그녀를 고치려 했습니다.


    11. 그런데 그녀가 기회를 잡자, 남편이 아직 밖에 있는 동안 내게로 달려와 말했습니다. “숨이 막힙니다. 아니면 당신이 나와 한몸이 되지 않으면 내가 절벽으로 몸을 던지겠습니다.”


    12. 나는 베리아르의 영이 그녀를 괴롭히고 있음을 알고, 주님께 기도한 뒤 그녀에게 말했습니다.


    13. “가련한 여자여, 어찌하여 당신은 성가시게 흔들리며 죄들 가운데서 스스로 눈멀게 합니까? 기억하십시오. 당신이 스스로 목숨을 끊는다면, 당신 남편의 첩이자 당신의 라이벌인 아스테오가 당신의 자녀들을 때리고 땅에서 당신의 기억을 지워 버릴 것입니다.”[a][b][c]'
  to: '7. 그러므로 당신이 알게 하려는 것입니다. 경건하지 않은 자들의 악함은 절제하며 하나님을 경외하는 이들을 이기지 못합니다. 보십시오, 내가 그것을 그에게서 받아 당신 앞에서 먹었습니다. 이렇게 말한 뒤에 내가 말했습니다. “내 조상들의 하나님과 아브라함의 천사가 나와 함께하실 것입니다.” 그리고 나는 먹었습니다.


