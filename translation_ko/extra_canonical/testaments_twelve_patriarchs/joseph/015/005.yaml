base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/005.yaml
  text: For they feared my father, lest he come among them and take vengeance for the danger; for they had heard that he was great before God and men.
translation:
  language: ko
  text: 그들이 내 아버지를 두려워했던 것은, 그가 그들 가운데로 와서 그 위험에 대한 보복을 행하지 않을까 함이었습니다. 그들은 그가 하나님과 사람들 앞에서 위대하다는 말을 들었기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφόβουντο γὰρ τὸν πατέρα μου
  english_pob_choice: For they feared my father
  chosen_korean: 그들이 내 아버지를 두려워했던 것은
  alternatives_korean:
  - 그들은 내 아버지를 두려워했습니다
  - 그들이 내 아버지를 무서워했던 것은
  lexicon: φοβέομαι
  rationale: 과거 서술의 원인절을 살리되, '두려워하다'를 택해 단순한 공포보다 존중이 섞인 경외감까지 열어 둡니다.
- source_word: ἐλθὼν ἐν αὐτοῖς
  english_pob_choice: lest he come among them
  chosen_korean: 그가 그들 가운데로 와서
  alternatives_korean:
  - 그가 그들 가운데 오셔서
  - 그가 그들 가운데 들어와서
  lexicon: ἔρχομαι + ἐν αὐτοῖς
  rationale: '''among them''의 공간적 함의를 자연스럽게 반영하여 ''가운데로''로 옮겼습니다.'
- source_word: ποιήσῃ ἐκδίκησιν κινδύνου
  english_pob_choice: take vengeance for the danger
  chosen_korean: 그 위험에 대한 보복을 행하지 않을까 함이었습니다
  alternatives_korean:
  - 그 위험에 대한 복수를 하지 않을까 함이었습니다
  - 그 위험 때문에 응징하지 않을까 함이었습니다
  lexicon: ἐκδίκησις κινδύνου
  rationale: POB의 'for the danger'를 따라 κινδύνου를 원인/대상으로 남기고, ἐκδίκησις는 법정적·보복적 성격을 살려 '보복'으로 옮겼습니다.
- source_word: μέγας ἐστὶ παρὰ Θεῷ καὶ ἀνθρώποις
  english_pob_choice: he was great before God and men
  chosen_korean: 그가 하나님과 사람들 앞에서 위대하다는 말을
  alternatives_korean:
  - 그가 하나님과 사람들 앞에서 크다는 말을
  - 그가 하나님과 사람들 앞에서 위대하다고
  lexicon: μέγας + παρὰ Θεῷ καὶ ἀνθρώποις
  rationale: παρά + 여격의 관계를 '앞에서'로 보존하고, μέγας는 인격적 탁월성을 드러내는 '위대하다'로 옮겼습니다.
theological_decisions:
- issue: ‘before God and men’의 관계를 어떻게 한국어로 보존할지
  chosen_reading: 하나님과 사람들 앞에서
  alternative_readings:
  - 하나님과 사람들 앞에
  - 하나님과 사람들 앞에서 크다
  rationale: 직역에 가까우면서도 한국어에서 자연스러운 표현으로, 하나님과 사람 모두의 평가/인정이라는 이중 기준을 보존합니다.
  doctrine_reference: 공적 인격과 신적 인정의 병행을 드러내는 서술
