  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Τί ὅτι εἶπας σεαυτὸν⁸ *δοῦλον εἶναι⁹; καὶ ἰδοὺ ⌜ἡμεῖς⌉¹⁰ ἐγνώκαμεν¹¹ ὅτι *υἱὸς εἰ ἀνδρὸς μεγάλου¹² ἐν γῇ¹³ Χαναάν, καὶ *ὁ πατήρ σου ⌜ἔτι⌉ πενθεῖ περί σου¹⁴ *ἐν σάκκῳ ⌜καὶ σποδῷ⌉¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/002.yaml
  text: “Why did you say that you were a slave? For behold, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”
translation:
  language: ko
  text: “어찌하여 네가 네 자신을 종이라고 말하였느냐? 보라, 우리가 네가 가나안 땅에 있는 큰 사람의 아들이라는 것과 네 아버지가 아직도 너를 위하여 베옷과 재 가운데서 슬퍼하고 있다는 것을 알게 되었다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον εἶναι
  english_pob_choice: you were a slave
  chosen_korean: 네 자신을 종이라고 말하였느냐
  alternatives_korean:
  - 네 자신을 노예라고 말하였느냐
  - 네가 종이라고 말하였느냐
  lexicon: δοῦλος
  rationale: 영문 POB의 ‘slave’는 이 문맥에서 신분의 굴욕을 드러내지만, 한국어 본문은 고정된 교회어인 ‘종’을 기본값으로 두어 원문 의미를 유지했습니다.
- source_word: υἱὸς εἰ ἀνδρὸς μεγάλου
  english_pob_choice: you are the son of a great man
  chosen_korean: 네가 가나안 땅에 있는 큰 사람의 아들이라는 것
  alternatives_korean:
  - 네가 가나안 땅의 위대한 사람의 아들이라는 것
  - 네가 가나안 땅에 있는 큰 자의 아들이라는 것
  lexicon: υἱός / ἀνὴρ μεγάλου
  rationale: ἀνδρὸς μεγάλου를 직역적으로 ‘큰 사람’으로 두어, 사회적 지위가 큰 인물을 가리키는 표현을 너무 해석적으로 풀지 않도록 했습니다.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  english_pob_choice: in sackcloth and ashes
  chosen_korean: 베옷과 재 가운데서
  alternatives_korean:
  - 굵은 베옷과 재 가운데서
  - 베옷과 재 속에서
  lexicon: σάκκος / σποδός
  rationale: 통상적 애도 관용구를 한국어 성경체에 맞게 ‘베옷과 재’로 옮기되, 상태를 나타내는 ἐν을 살려 ‘가운데서’로 처리했습니다.
theological_decisions:
- issue: ‘slave’의 신분 강조를 한국어에서 어떻게 반영할지
  chosen_reading: ‘종’으로 번역하되, 낮은 신분을 드러내는 문맥적 긴장을 유지했습니다.
  alternative_readings:
  - ‘노예’로 옮겨 법적·사회적 예속성을 더 강하게 드러냄
  - ‘종’ 대신 ‘하인’으로 완화함
  rationale: 이 텍스트는 요셉이 스스로를 낮추어 말한 장면을 전제하므로, 지나치게 완화하지 않으면서도 POB 기본 용례인 ‘종’을 사용했습니다.
  doctrine_reference: 사회적 신분과 자기비하 표현의 번역 원칙
