  text: Then the trader said to them, “Free me from the judgment of Potiphar.”
translation:
  language: ko
  text: 그때 그 상인이 그들에게 말했습니다. “저를 포티파르의 심판에서 풀어 주십시오.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μετάβολος
  english_pob_choice: the trader
  chosen_korean: 그 상인
  alternatives_korean:
  - 그 거래인
  - 그 장사꾼
  lexicon: μετάβολος
  rationale: 문맥상 사람을 매매·교환하는 상인을 가리키므로, 자연스럽고 중립적인 현대 한국어로 ‘상인’을 택했습니다.
- source_word: Λύσατέ με
  english_pob_choice: Free me
  chosen_korean: 저를 … 풀어 주십시오
  alternatives_korean:
  - 저를 … 해방해 주십시오
  - 저를 … 풀어 주시옵소서
  lexicon: λύω
  rationale: λύσατέ με의 직접적 의미를 살려 ‘풀어 주십시오’로 옮기되, 문맥상 단순 석방이 아니라 얽매임에서 벗어나게 해 달라는 요청을 드러냈습니다.
- source_word: ἀπὸ τῆς κρίσεως
  english_pob_choice: from the judgment
  chosen_korean: … 심판에서
  alternatives_korean:
  - … 재판에서
  - … 판결에서
  lexicon: κρίσις
  rationale: κρίσις는 여기서 법정적·판결적 의미가 강하므로, 일반적인 ‘재판’보다 결과와 위협성을 함께 담는 ‘심판’이 더 적절합니다.
- source_word: Πεντεφρί
  english_pob_choice: Potiphar
  chosen_korean: 포티파르
  alternatives_korean:
  - 보디발
  - 포디파르
  lexicon: Πεντεφρί
  rationale: 고유명사는 현대 외래어 표기 관례에 따라 음역했습니다.
theological_decisions:
- issue: ‘κρίσις’의 법정적 뉘앙스
  chosen_reading: 포티파르의 심판 아래서 벗어나게 해 달라는 요청으로 읽었습니다.
  alternative_readings:
  - 포티파르의 재판에서 풀어 달라는 요청
  - 포티파르의 판결에서 자유롭게 해 달라는 요청
  rationale: 문맥상 단순한 정보 전달이 아니라 처벌·판단의 결과에서 벗어나려는 청원으로 이해하는 것이 source에 더 가깝습니다.
  doctrine_reference: Source-context reading of κρίσις in narrative/judicial usage
