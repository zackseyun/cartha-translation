id: T12P.JOS.15.1
reference: Testament of Joseph 15:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἤθελε γὰρ ὁρᾶν με²⁴ ἐν πόθῳ ⌈ἁμαρτίας⌉²⁵. *ἐγὼ δὲ²⁶ ἠγνόουν ἐν²⁷ πᾶσι τούτοις²⁸. *Εἶπε δὲ πρὸς αὐτήν²⁹· Οὐκ ἐστὶ *τοῦτο τοῖς³⁰ Αἰγυπτίοις πρὸ ἀποδείξεως ἀφαιρεῖσθαι τὰ ἀλλότρια. Ταῦτα ⌜οὖν⌉³¹ εἶπε *περὶ τοῦ μεταβόλου³². *Ὁ δὲ παῖς³³ *ὀφείλει ἐγκατάκλειστος εἶναι³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/001.yaml
  text: For she wanted to see me in sinful desire, but I was unaware of all these things. And he said to her, “This is not the custom among the Egyptians, to take what belongs to others before proof is given.” So he said this concerning the merchant. But the boy ought to be kept confined.
translation:
  language: ko
  text: 그녀는 죄의 욕망으로 나를 보고 싶어 했으나, 나는 이 모든 일을 알지 못했습니다. 그리고 그는 그녀에게 말했습니다. 「이집트 사람들에게는 증거가 제시되기 전에 남의 것을 빼앗는 이런 일이 관습이 아닙니다」. 그러므로 그는 이것을 상인에 관해 말한 것입니다. 그러나 그 소년은 가둬 두어야 합니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πόθῳ ⌈ἁμαρτίας⌉
  english_pob_choice: in sinful desire
  chosen_korean: 죄의 욕망으로
  alternatives_korean:
  - 죄의 정욕으로
  - 죄를 향한 욕망으로
  - 죄악된 욕망으로
  lexicon: πόθος / ἁμαρτία
  rationale: POB의 ‘sinful desire’를 따라 직역하되, 한국어에서는 ‘죄의 욕망’이 원문의 소유격적 결합과 도덕적 상태를 가장 자연스럽게 드러냅니다.
- source_word: ἠγνόουν
  english_pob_choice: I was unaware of all these things
  chosen_korean: 나는 이 모든 일을 알지 못했습니다
  alternatives_korean:
  - 나는 이 모든 것을 알지 못했습니다
  - 나는 이 모든 일에 대해 몰랐습니다
  lexicon: ἀγνοέω
  rationale: 단순한 ‘몰랐다’보다 사건의 전개를 따라간다는 점을 살려 ‘이 모든 일’을 택했습니다.
- source_word: τὰ ἀλλότρια
  english_pob_choice: what belongs to others
  chosen_korean: 남의 것
  alternatives_korean:
  - 남의 물건
  - 다른 사람의 것
  - 타인의 소유
  lexicon: ἀλλότριος
  rationale: 복수 뉘앙스를 반영해 ‘남의 것’으로 옮기면, 특정 물건 하나가 아니라 타인의 소유 전반을 가리키는 표현이 됩니다.
- source_word: ἐγκατάκλειστος εἶναι
  english_pob_choice: to be kept confined
  chosen_korean: 가둬 두어야 합니다
  alternatives_korean:
  - 감금되어 있어야 합니다
  - 가둔 채로 있어야 합니다
  - 갇혀 있어야 합니다
  lexicon: ἐγκατάκλειστος
  rationale: 수동적 상태를 한국어 관용에 맞게 옮기면서도, 단순한 ‘보호’가 아니라 구속된 상태를 분명히 드러냈습니다.
theological_decisions:
- issue: ‘sinful desire’의 도덕적 평가를 어떻게 드러낼지
  chosen_reading: ‘죄의 욕망’으로 번역해 욕망 자체가 죄와 결합된 상태임을 직접 드러냈습니다.
  alternative_readings:
  - ‘죄악된 욕망’
  - ‘죄를 향한 욕망’
  rationale: 본문은 단순한 감정 묘사가 아니라 유혹의 성격을 규정하므로, 완곡하게 낮추기보다 죄와 욕망의 결합을 분명히 해야 합니다.
  doctrine_reference: 성화와 정결, 유혹의 실재에 대한 성경적 증언
- issue: ‘the boy ought to be kept confined’의 규범적 어조
  chosen_reading: ‘가둬 두어야 합니다’로 옮겨 처분의 필요성을 유지했습니다.
  alternative_readings:
  - ‘가둬 두는 것이 마땅합니다’
  - ‘갇혀 있어야 합니다’
  rationale: 원문의 ὀφείλει는 단순 가능성이 아니라 의무/필연을 나타내므로, 한국어에서도 규범적 뉘앙스를 보존했습니다.
  doctrine_reference: 서사 안의 윤리적 판단과 책임의 언어
