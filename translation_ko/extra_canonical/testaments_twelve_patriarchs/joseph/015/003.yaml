  to: 내가 이 말을 들었을 때, 내 속이 찢어졌고 내 마음이 녹았습니다. 나는 몹시 울고 싶었지만, 내 형제들을 부끄럽게 하지 않으려고 스스로를 억눌렀습니다. 그리고 그들에게 말했습니다. “저는 알지 못합니다. 저는 종입니다.”
  rationale: 원문의 병렬된 고통의 이미지와 감정 강도를 유보 없이 유지하고, αἰσχύνω의 직접 목적어를 한국어에 반영했습니다. 또한 문체를 현대 표준어 합쇼체로 매끄럽게 정리했으며, 대응 주석이 없는 각주 앵커를 삭제했습니다. ‘종’은 δοῦλος의 전통적 번역어로 유지하되, 번역 자체가 그 사회적 신분의 의미를 완화하거나 특정 동기를 부가하지 않도록 했습니다.
