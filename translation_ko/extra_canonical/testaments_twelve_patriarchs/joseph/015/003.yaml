id: T12P.JOS.15.3
reference: Testament of Joseph 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ταῦτα ἀκούσας ἐγὼ διελύθη τὰ σπλάγχνα μου, καὶ ἡ καρδία μου ἐτάκη, καὶ ἤθελον δακρῦσαι πάνυ¹⁶, ἀλλ''¹⁷ ἐπέσχον ἐμαυτόν¹⁸, ἵνα μὴ αἰσχύνω¹⁹ τοὺς ἀδελφούς μου, ⌜*καὶ εἶπον αὐτοῖς²⁰ Ἐγὼ οὐκ οἶδα·²¹ δοῦλός εἰμι⌉.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/003.yaml
  text: When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a slave.”
translation:
  language: ko
  text: 내가 이 말을 들었을 때, 내 속이 찢어졌고 내 마음이 녹았습니다. 나는 몹시 울고 싶었지만, 내 형제들을 부끄럽게 하지 않으려고 스스로를 억눌렀습니다. 그리고 그들에게 말했습니다. “저는 알지 못합니다. 저는 종입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελύθη τὰ σπλάγχνα μου
  english_pob_choice: my inward parts were torn apart
  chosen_korean: 내 창자가 찢어지는 듯했고
  alternatives_korean:
  - 내 속이 찢어졌고
  - 내 내장이 찢어졌고
  lexicon: σπλάγχνα → 창자/속; διελύθη → 찢어지다, 분해되다
  rationale: 몸의 깊은 내면이 무너지는 강한 감각을 살리기 위해 직설적으로 옮기되, 현대 한국어에서 자연스러운 비유 표현으로 정리했습니다.
- source_word: ἡ καρδία μου ἐτάκη
  english_pob_choice: my heart melted
  chosen_korean: 내 마음이 녹아 내렸습니다
  alternatives_korean:
  - 내 심장이 녹았습니다
  - 내 마음이 녹았습니다
  lexicon: καρδία → 마음; τήκω → 녹다
  rationale: 감정적 붕괴를 나타내는 이미지로서 ‘녹다’의 은유를 유지하면서, 한국어 흐름에 맞게 ‘녹아 내리다’로 다듬었습니다.
- source_word: ἐπέσχον ἐμαυτόν
  english_pob_choice: I restrained myself
  chosen_korean: 나 자신을 억제했습니다
  alternatives_korean:
  - 스스로를 억눌렀습니다
  - 자제했습니다
  lexicon: ἐπέχω / ἐμαυτόν → 자신을 붙들다, 억제하다
  rationale: 자기 절제를 분명히 드러내는 동작으로 보존하되, 과도한 문어성을 피했습니다.
- source_word: ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου
  english_pob_choice: so that I might not put my brothers to shame
  chosen_korean: 형제들에게 수치를 주지 않으려고
  alternatives_korean:
  - 형제들을 부끄럽게 하지 않으려고
  - 형제들에게 창피를 주지 않으려고
  lexicon: αἰσχύνω → 수치를 주다, 부끄럽게 하다
  rationale: αἰσχύνω의 사회적·명예적 뉘앙스를 살려 ‘수치’를 택했고, ‘형제들’은 혈연 관계를 분명히 하는 직역을 유지했습니다.
- source_word: δοῦλός εἰμι
  english_pob_choice: I am a slave
  chosen_korean: 나는 종입니다
  alternatives_korean:
  - 나는 노예입니다
  - 나는 종노릇하는 사람입니다
  lexicon: δοῦλος → 종 / 노예
  rationale: 기본값인 ‘종’을 따르되, 이 문맥에서는 자발적 자기비하 선언이어서 ‘노예’보다 덜 강한 한국어 관용이 더 적절합니다.
theological_decisions:
- issue: 화자 자신의 신분 고백인 δοῦλος의 뉘앙스
  chosen_reading: ‘나는 종입니다’로 옮겨, 예의와 자기비하를 동시에 드러냈습니다.
  alternative_readings:
  - ‘나는 노예입니다’로 더 강하게 bonded status를 드러내는 번역
  rationale: 본문은 형제들 앞에서 자신의 지위를 낮추는 고백이며, 바로 앞뒤의 맥락상 법적 소유관계보다 겸손한 자기표현이 핵심이므로 ‘종’이 과도한 해석을 덜합니다.
  doctrine_reference: 사회적 수치/명예 언어와 자기 비하의 수사
- issue: 감정 표현의 연속성
  chosen_reading: ‘창자가 찢어지는 듯했고… 마음이 녹아 내렸습니다’로 신체-정서의 이중 이미지를 보존했습니다.
  alternative_readings:
  - 정서 중심으로 완화하여 ‘매우 슬펐습니다’로 옮김
  rationale: 원문은 단순한 슬픔이 아니라 신체적 해체감과 감정의 붕괴를 병렬로 제시하므로, 의미를 약화시키지 않도록 이미지를 유지했습니다.
  doctrine_reference: 본문의 수사와 정서 강도 보존
