  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Τότε ⌜οὖν⌉²² ἐβουλεύσαντο²³ πωλῆσαί με, ἵνα μὴ εὑρεθῶ ἐν *ταῖς χερσὶν αὐτῶν²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/004.yaml
  text: Then, indeed, they decided to sell me, so that I might not be found in their hands.
translation:
  language: ko
  text: 그때 그들은 내가 그들의 손에 발견되지 않게 하려고 나를 팔기로 결정했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβουλεύσαντο
  english_pob_choice: decided
  chosen_korean: 결정했습니다
  alternatives_korean:
  - 상의했습니다
  - 꾀했습니다
  - 의논했습니다
  lexicon: βουλεύομαι
  rationale: 주어진 영어 POB의 ‘decided’를 따라, 단순한 협의보다 최종 결정을 강조하는 ‘결정하다’로 옮겼습니다.
- source_word: πωλῆσαί με
  english_pob_choice: sell me
  chosen_korean: 나를 팔기로
  alternatives_korean:
  - 나를 팔아버리기로
  - 나를 매매하기로
  lexicon: πωλέω
  rationale: 행위 자체를 직접적으로 드러내기 위해 ‘나를 팔다’를 유지했고, 부정한 처분의 뉘앙스를 과장하지 않기 위해 담백하게 처리했습니다.
- source_word: ἵνα μὴ εὑρεθῶ
  english_pob_choice: so that I might not be found
  chosen_korean: -게 하려는 것이었습니다
  alternatives_korean:
  - -지 않게 하려는 것이었습니다
  - 발견되지 않게 하려는 것이었습니다
  lexicon: ἵνα + μή + εὑρίσκω
  rationale: 목적절의 기능을 자연스럽게 살리면서, 수동 의미의 ‘found’를 뒤 문맥과 결합해 한국어로 매끄럽게 풀었습니다.
- source_word: ἐν ταῖς χερσὶν αὐτῶν
  english_pob_choice: in their hands
  chosen_korean: 자기들의 손에
  alternatives_korean:
  - 그들의 손 안에
  - 그들 손에
  lexicon: χείρ
  rationale: 관용적이면서도 직역성을 유지하는 표현으로, 통제 아래 있음을 드러내는 ‘손에’ 구조를 살렸습니다.
theological_decisions:
- issue: ‘in their hands’라는 관용구의 의미 범위
  chosen_reading: 물리적으로 붙잡힌 상태를 넘어, 그들의 통제와 소유 아래 놓이지 않게 하려는 뜻으로 이해했습니다.
  alternative_readings:
  - 단순히 손으로 붙잡히지 않게 하려는 뜻
  - 법적 소유 관계를 피하려는 뜻
  rationale: 문맥상 요셉을 팔아넘기려는 형제들의 의도가 강조되므로, ‘손에’는 통제 아래 있음과 처분 권한을 함께 암시하는 것으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 서사 문맥 해석
