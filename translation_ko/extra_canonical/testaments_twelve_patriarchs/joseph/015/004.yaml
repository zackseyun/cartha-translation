review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the decision to sell Joseph, but its purpose clause changes the Greek passive ('that I might not be found') into an active clause in which they fail to find him. The revised wording preserves the passive sense and the image 'in their hands.'
  naturalness: ‘그들이 자기들의 손에 나를 찾지 못하게’ is unnatural Korean and is semantically ambiguous. Integrating the purpose clause before the main action produces clear, modern formal-polite Korean.
  terminology: ‘나를 팔기로 결정했습니다’ adequately reflects πωλῆσαί με and ἐβουλεύσαντο. ‘그들의 손에 발견되지 않게’ retains the source’s deliberately concrete ‘hands’ expression without imposing a more specific interpretation such as ownership or control.
  issues:
  - severity: medium
    issue: The purpose clause reverses the grammatical perspective of the Greek passive.
    rationale: ἵνα μὴ εὑρεθῶ means ‘so that I might not be found,’ whereas ‘그들이 ... 나를 찾지 못하게’ means ‘so that they might not be able to find me.’
  - severity: low
    issue: The draft contains an unprovided footnote anchor [a].
    rationale: No corresponding footnote is supplied, and no note is needed for the revised translation.
  revised_text: 그때 그들은 내가 그들의 손에 발견되지 않게 하려고 나를 팔기로 결정했습니다.
  revised_footnotes: []
