base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/007.yaml
  text: And they came near and asked me, saying, “Say that you were bought by us with silver, and he will release us.”
translation:
  language: ko
  text: 그들은 다가와 저에게 이렇게 요청했습니다. “우리가 은으로 당신을 사들였다고 말하십시오. 그러면 그가 우리를 풀어 줄 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  english_pob_choice: And they came near
  chosen_korean: 다가와
  alternatives_korean:
  - 가까이 와서
  - 접근하여
  lexicon: προσέρχομαι
  rationale: 행동의 진행을 자연스럽게 살리면서도, 원문의 ‘다가옴’을 직접적으로 반영했습니다.
- source_word: ᾔτουν με λέγοντες
  english_pob_choice: and asked me, saying
  chosen_korean: 저에게 말했습니다
  alternatives_korean:
  - 저에게 요청하며 말했습니다
  - 저에게 간청하며 말했습니다
  lexicon: αἰτέω / λέγω
  rationale: 여기서는 단순한 질문이라기보다 특정 발화를 요구하는 장면이므로, 한국어에서는 압축해 ‘말했습니다’로 옮겨 흐름을 자연스럽게 했습니다.
- source_word: ἐν ἀργυρίῳ ἠγοράσθης ἡμῖν
  english_pob_choice: you were bought by us with silver
  chosen_korean: 은으로 우리에게 팔렸다고
  alternatives_korean:
  - 은으로 우리 손에 사들여졌다고
  - 은값으로 우리에게 매입되었다고
  lexicon: ἀγοράζω / ἀργύριον
  rationale: 문맥상 ‘buy’는 종의 매입을 가리키므로, 한국어에서는 의미를 분명히 드러내는 ‘팔렸다’로 옮기되, ‘은으로’로 수단을 보존했습니다.
- source_word: ἀπολῦσαι ἡμᾶς ἔχει
  english_pob_choice: he will release us
  chosen_korean: 그가 우리를 풀어 줄 것입니다
  alternatives_korean:
  - 그가 우리를 놓아줄 것입니다
  - 그가 우리를 해방할 것입니다
  lexicon: ἀπολύω
  rationale: 주어진 영어 수정안대로 미래적 의미를 반영해 ‘할 것입니다’로 옮겼고, ἀπολύω의 기본 뜻을 살려 ‘풀어 주다’로 번역했습니다.
theological_decisions:
- issue: 직접화법 안의 요청문 어조
  chosen_reading: 「…이라고 말하십시오」로 정중한 명령형을 유지했습니다.
  alternative_readings:
  - 「…이라고 말해라」
  - 「…이라고 하십시오」
  rationale: 원문은 타인에게 시키는 요청이므로 명령성은 보존해야 하지만, 한국어 본문 전체의 합쇼체에 맞춰 공손한 요청형으로 조정했습니다.
  doctrine_reference: 문체/화법 일관성
