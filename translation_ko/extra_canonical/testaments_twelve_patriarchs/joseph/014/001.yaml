  - severity: high
    issue: ὡς ἀδικήσαντα의 의미 누락 및 문장 구조 혼동
    rationale: 이는 납치된 자유인을 ‘죄를 지은 사람처럼’ 처벌한다는 뜻입니다. 초안은 이를 ‘그가 잘못한 자처럼’으로 불명확하게 처리했습니다.
  - severity: medium
    issue: 직접 발화와 인칭·높임의 부정확성
    rationale: λέγουσα 뒤에는 직접 인용이 오며, ‘벌하신’은 본문에 없는 존대를 삽입합니다. 발화 상대는 ‘당신’으로 자연스럽게 유지할 수 있습니다.
  revised_text: 그런데 멤피스는 창문들을 통해 내가 맞고 있는 것을 보았습니다. 그의 집이 가까이에 있었기 때문입니다. 그래서 그녀는 그에게 사람을 보내어 이렇게 말했습니다. “당신의 판결은 불의합니다. 납치된 자유인을 죄를 지은 사람처럼 벌하고 있기 때문입니다.”
