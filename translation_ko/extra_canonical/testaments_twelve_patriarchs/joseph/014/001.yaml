id: T12P.JOS.14.1
reference: Testament of Joseph 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ δὲ Μεμφὶς¹ ἑώρα² διὰ *τῶν θυρίδων³ ⌜*τυπτόμενόν με⁴, *πλησίον γὰρ ἦν ὁ οἶκος αὐτῆς⁵, καὶ *ἀπέστειλε πρὸς αὐτόν⁶, λέγουσα⁷· *Ἄδικος⁸ ἡ κρίσις σου⁹, ὅτι τὸν *κλαπέντα ⌜ἐλεύθερον⌉ *τιμωρεῖς, ὡς ἀδικήσαντα¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/001.yaml
  text: And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust, because you punish as a wrongdoer a free man who has been kidnapped.”
translation:
  language: ko
  text: 그런데 멤피스는 창문들을 통해 내가 맞고 있는 것을 보았습니다. 그의 집이 가까이에 있었기 때문입니다. 그래서 그녀는 그에게 사람을 보내어 이렇게 말했습니다. “당신의 판결은 불의합니다. 납치된 자유인을 죄를 지은 사람처럼 벌하고 있기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ δὲ Μεμφὶς
  english_pob_choice: And Memphis
  chosen_korean: 그리고 멤피스는
  alternatives_korean:
  - 그런데 멤피스는
  - 멤피스가
  lexicon: 고유명사
  rationale: 여기서는 인칭적 주어로 기능하는 도시명 멤피스를 그대로 음역해 유지하고, 연결은 문맥상 자연스러운 ‘그리고’로 처리했습니다.
- source_word: διὰ τῶν θυρίδων
  english_pob_choice: through the windows
  chosen_korean: 창문들로
  alternatives_korean:
  - 창문들을 통해
  - 창문 사이로
  lexicon: θύρις
  rationale: 복수형 ‘창문들’을 살리되, 행위가 시야를 통해 목격되었다는 점을 한국어로 간결하게 표현했습니다.
- source_word: ἄδικος ἡ κρίσις σου
  english_pob_choice: Your judgment is unjust
  chosen_korean: 네 판결은 불의하다고
  alternatives_korean:
  - 네 심판은 부당하다고
  - 네 재판은 불공정하다고
  lexicon: κρίσις
  rationale: κρίσις는 여기서 법적 판정/판결의 뜻이므로 ‘판결’이 가장 직접적이며, ἄδικος는 단순한 부당함보다 도덕적·법적 ‘불의’를 드러냅니다.
- source_word: τὸν κλαπέντα ἐλεύθερον τιμωρεῖς
  english_pob_choice: you punish ... a free man who has been kidnapped
  chosen_korean: 자유인을 납치한 사람을 벌하신
  alternatives_korean:
  - 자유인을 훔쳐 간 사람을 벌하신
  - 자유인을 빼앗긴 사람을 벌하신
  lexicon: κλαπέντα
  rationale: POB의 수정본처럼 passive sense를 살려 ‘납치한/납치된’ 계열로 옮기되, 문맥상 자유인이 억울하게 붙잡힌 의미를 분명히 했습니다.
theological_decisions:
- issue: 공적 판단에 대한 윤리적 평가와 응답의 형태
  chosen_reading: 이 구절은 멤피스가 불의한 판결을 지적하며 사람을 보내어 항의하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 사적 불만 표명으로 읽을 수도 있음
  - 법정 판결의 절차적 부당함만을 지적하는 것으로 볼 수도 있음
  rationale: ἄδικος와 κρίσις의 결합은 도덕적·법적 불의 모두를 함축하므로, 항의의 성격을 약화시키지 않도록 표현했습니다.
  doctrine_reference: 정의와 공의에 대한 성경적 언어 사용
