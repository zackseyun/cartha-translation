base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/003.yaml
  text: And the woman kept saying to her husband, “Why do you keep this captive and noble boy in chains, when he ought rather to be set free and waited upon?”
translation:
  language: ko
  text: 그 여인은 남편에게 계속 말했습니다. “어찌하여 당신은 이 포로이자 고귀한 소년을 쇠사슬에 묶어 두십니까? 그는 차라리 풀려나 섬김을 받아야 마땅합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμάλωτον
  english_pob_choice: this captive
  chosen_korean: 포로
  alternatives_korean:
  - 사로잡힌 자
  - 포로 된 사람
  lexicon: αἰχμάλωτος
  rationale: 포로는 단순한 ‘붙잡힌 사람’보다 억류·구속된 상태를 분명히 드러내며, POB의 captive를 자연스럽게 반영합니다.
- source_word: εὐγενῆ παῖδα
  english_pob_choice: noble boy
  chosen_korean: 고귀한 소년
  alternatives_korean:
  - 귀한 아이
  - 고상한 소년
  lexicon: εὐγενής + παῖς
  rationale: εὐγενῆ는 혈통적·품격적 고귀함을 함께 담으므로 ‘고귀한’이 적절하고, παῖς는 여기서 ‘소년/아이’의 의미로 보아 ‘소년’이 문맥상 자연스럽습니다.
- source_word: ἐν δεσμοῖς
  english_pob_choice: in chains
  chosen_korean: 쇠사슬에 묶어 두십니까
  alternatives_korean:
  - 사슬에 묶어 두십니까
  - 결박해 두십니까
  lexicon: δεσμός
  rationale: δεσμοῖς는 단순한 구속이 아니라 쇠사슬/결박의 구체성을 지니므로, POB의 chains를 살려 ‘쇠사슬에 묶어 두십니까’로 옮겼습니다.
- source_word: ὑπηρετεῖσθαι
  english_pob_choice: waited upon
  chosen_korean: 섬김을 받아야
  alternatives_korean:
  - 시중을 받아야
  - 봉사를 받아야
  lexicon: ὑπηρετέω
  rationale: 수동형은 ‘시중받다’보다 넓은 ‘섬김을 받다’가 본문의 노역·봉사 맥락을 무리 없이 담아냅니다.
theological_decisions:
- issue: 여인의 비난이 단순 감정 표현인지, 도덕적 판단을 포함하는지
  chosen_reading: 본문은 요셉이 ‘포로’이면서도 ‘고귀한 소년’이라고 강조하여, 부당한 구속에 대한 도덕적 항의를 드러냅니다.
  alternative_readings:
  - 단순히 안타까움을 표현하는 말로만 읽는 해석
  rationale: 원문은 왜 그를 묶어 두는지 묻고, 마땅히 풀어주고 섬겨야 한다고 말해 억류의 부당성을 강하게 부각합니다.
  doctrine_reference: 본문 내 윤리적 호소
- issue: register shift in quoted speech
  chosen_reading: 직접 화법은 남편에게 묻는 반말형이 아니라 공손한 ‘-십니까’ 체로 유지했습니다.
  alternative_readings:
  - 더 구어적인 ‘왜 계속 가두고 있나요?’
  rationale: 합쇼체 본문과 직접 호칭(당신)을 함께 살리면서도, 서술 전체의 현대 공손체를 유지하기 위한 선택입니다.
  doctrine_reference: Korean style consistency
