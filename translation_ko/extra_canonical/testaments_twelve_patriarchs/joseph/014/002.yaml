  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς δὲ ⌜ἐγὼ⌉¹¹ οὐκ ἤλλαξα *τὸν λόγον μου¹² ⌜τυπτόμενος⌉, ἐκέλευσε *φυλαχθῆναί με¹³, ἕως οὗ ἔλθωσιν¹⁴ οἱ κύριοι *τοῦ παιδός¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/002.yaml
  text: But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come.
translation:
  language: ko
  text: 그러나 내가 매를 맞으면서도 내 진술을 바꾸지 않았으므로, 그는 그 아이의 주인들이 올 때까지 나를 감시 아래 두라고 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  english_pob_choice: I did not alter my statement
  chosen_korean: 내 말을 바꾸지 않았으므로
  alternatives_korean:
  - 내 진술을 바꾸지 않았으므로
  - 내 말을 변경하지 않았으므로
  lexicon: λόγος
  rationale: λόγος는 여기서 단순한 ‘말씀’보다 화자의 진술·말을 가리키므로, 문맥상 자연스럽고 source-direct한 ‘내 말’을 택했습니다.
- source_word: τυπτόμενος
  english_pob_choice: being beaten
  chosen_korean: 매를 맞는 동안에도
  alternatives_korean:
  - 두들겨 맞는 동안에도
  - 맞으면서도
  lexicon: τύπτω
  rationale: 수동 분사로서 실제 구타를 받는 상황을 나타내므로, 현대 한국어에서 자연스러운 수난 표현으로 옮겼습니다.
- source_word: ἐκέλευσε φυλαχθῆναί με
  english_pob_choice: he ordered that I be kept under guard
  chosen_korean: 나를 가두어 두라고 명령했습니다
  alternatives_korean:
  - 나를 감시하라고 명령했습니다
  - 나를 지키게 하라고 명령했습니다
  lexicon: κελεύω + φυλάσσω
  rationale: φυλαχθῆναί με는 단순 보호가 아니라 구금·감금의 뉘앙스를 띠므로, ‘가두어 두다’로 옮겨 조치의 강도를 살렸습니다.
- source_word: οἱ κύριοι τοῦ παιδός
  english_pob_choice: the masters of the boy
  chosen_korean: 그 아이의 주인들
  alternatives_korean:
  - 그 아이의 주인
  - 그 종의 주인들
  lexicon: κύριος
  rationale: 복수 κύριοι를 반영해 ‘주인들’로 옮겼고, τοῦ παιδός는 문맥상 ‘아이’로 읽히지만 종속 신분의 여지도 있어 그대로 두어 해석을 과도하게 좁히지 않았습니다.
