  naturalness: 합쇼체 문장은 자연스럽습니다. ‘감시 아래 두다’는 법적·서사적 구금 상황에서 현대 한국어로 자연스럽고, 원문의 감시/구금 양면을 보존합니다.
  terminology: κύριοι와 παιδός의 관계는 ‘그 아이의 주인들’로 유지했습니다. παις가 문맥에 따라 아이 또는 하인/소년을 뜻할 수 있으나, 이 절만으로 이를 특정 신분으로 좁히지 않았습니다.
