  text: Ἐγὼ δὲ¹⁶ ἐμνημόνευον¹⁷ *λόγους πατρός μου¹⁸, καὶ εἰσερχόμενος εἰς τὸ ταμεῖον *⸀κλαίων⸀ προσηυχόμην¹⁹ Κυρίῳ²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/003.yaml
  text: But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.
translation:
  language: ko
  text: 그러나 저는 아버지의 말씀을 기억하고 있었고, 방에 들어가 울면서 주님께 기도했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνημόνευον λόγους πατρός μου
  english_pob_choice: I remembered the words of my father
  chosen_korean: 아버지의 말들을 기억했고
  alternatives_korean:
  - 아버지의 말씀을 기억했고
  - 아버지의 말을 되새겼고
  lexicon: μνημονεύω
  rationale: ἐμνημόνευον은 단순한 지적 회상보다 계속 염두에 두는 뜻이 있어 ‘기억했고’로 옮기되, λόγους는 복수성을 살려 ‘말들’로 드러냈습니다.
- source_word: εἰσερχόμενος εἰς τὸ ταμεῖον
  english_pob_choice: going into my chamber
  chosen_korean: 제 방으로 들어가며
  alternatives_korean:
  - 제 밀실로 들어가며
  - 제 내실로 들어가며
  lexicon: ταμεῖον
  rationale: ταμεῖον은 사적 공간을 가리키므로 문맥상 자연스러운 ‘방’으로 옮기되, 혼자 들어가는 동작의 진행성을 ‘-며’로 살렸습니다.
- source_word: κλαίων
  english_pob_choice: weeping
  chosen_korean: 울면서
  alternatives_korean:
  - 통곡하며
  - 눈물을 흘리며
  lexicon: κλαίω
  rationale: 현재분사로서 동시 동작을 나타내므로 ‘울면서’가 가장 직접적이며, 감정의 강도를 과장하지 않으면서도 충분히 반영합니다.
- source_word: Κυρίῳ
  english_pob_choice: the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주께서
  lexicon: κύριος
  rationale: 여기서는 기도 대상인 주님을 뜻하므로 표준적인 경어형 ‘주님께’가 문맥에 맞습니다.
theological_decisions:
- issue: 기도 행위의 서술 방식
  chosen_reading: ‘울면서 주님께 기도했습니다’로 직설적으로 옮겨, 내적 회상과 기도의 연결을 분명히 했습니다.
  alternative_readings:
  - ‘울며 주께 간구했습니다’
  - ‘눈물로 주님께 기도했습니다’
  rationale: 본문은 기억-입장-울음-기도의 연속 동작을 보여 주므로, 이를 평이하지만 선명하게 드러내는 번역을 택했습니다.
  doctrine_reference: 기도와 회개의 내적 진정성
