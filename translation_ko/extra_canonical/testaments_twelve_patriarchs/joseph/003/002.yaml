review_pass:
  verdict: revise
  source_fidelity: 현 초안은 핵심 서술을 대체로 반영하지만, 첫 문장의 ‘죽음을 위협했다’는 한국어상 여인이 화자에게 죽음을 가하겠다고 위협한 의미를 충분히 나타내지 못합니다. 또한 ἑαυτόν(‘당신 자신’)을 ‘나 자신’으로 옮긴 것은 인칭 의미의 명백한 오류입니다. 대괄호로 표시된 ‘또 나를 위협했고’는 본문상 불확실성이 있으므로 각주로 표시했습니다.
  naturalness: ‘죽이겠다고 위협했습니까’, ‘그녀와 함께하기를 원하지 않자’, ‘당신 자신을 내게 내어 준다면’으로 다듬어 현대 표준 한국어의 자연스러운 합쇼체 직접화법을 유지했습니다. δεσπότης의 서술어는 ‘주인처럼’보다 ‘우리의 주인이 될 것입니다’가 자연스럽고 원문 의미도 더 직접적으로 전달합니다.
  terminology: ἡ Αἰγυπτία는 ‘이집트 여인’, τιμωρίαις는 ‘형벌’, κυριεύσεις는 ‘다스리게 되다’, δεσπότης는 ‘주인’으로 옮겼습니다. συνελθεῖν의 완곡한 표현은 과도하게 해설하지 않고 ‘함께하기’로 보존했습니다.
  issues:
  - severity: high
    issue: ‘당신이 나 자신을 내게 내주면’
    rationale: 원문의 ἑαυτόν은 듣는 상대인 요셉의 ‘자기 자신’을 가리킵니다. ‘나 자신’은 말하는 여인을 가리키므로 인칭과 의미가 바뀝니다.
  - severity: medium
    issue: ‘내게 몇 번이나 죽음을 위협했습니까’
    rationale: 한국어에서는 ‘죽음’을 위협한 것으로 읽힐 수 있습니다. 원문의 θάνατον은 여인이 화자에게 죽음을 가하겠다고 한 위협의 내용이므로 ‘나를 죽이겠다고’가 명확합니다.
  - severity: medium
    issue: 대괄호 본문의 불확실성이 각주 없이 처리됨
    rationale: καὶ ἠπείλησέ μοι는 제시된 그리스어 본문에서 대괄호로 표시되어 있습니다. 영어 POB의 채택을 따르되, 전승상 불확실성을 해당 위치의 각주로 밝혀야 합니다.
  - severity: low
    issue: ‘우리의 주인처럼 될 것입니다’
    rationale: ὡς δεσπότης ἡμῶν은 이 문맥에서 지위의 비유적 유사성보다 ‘우리의 주인’이라는 역할 부여를 말합니다. ‘우리의 주인이 될 것입니다’가 더 자연스럽고 직접적입니다.
  revised_text: “이집트 여인이 나를 죽이겠다고 몇 번이나 위협했습니까! 몇 번이나 나를 형벌에 넘겨놓고 다시 불러들였으며, 또 나를 위협했습니까![a] 내가 그녀와 함께하기를 원하지 않자, 그녀는 내게 이렇게 말했습니다. ‘당신이 자신을 내게 내어 준다면, 당신은 나와 내 집 안에 있는 모든 사람을 다스리게 될 것이며, 우리의 주인이 될 것입니다.’”
