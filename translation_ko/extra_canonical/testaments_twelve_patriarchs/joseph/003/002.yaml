  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ποσάκις ἡ Αἰγυπτία¹ ἠπείλησέ² μοι³ θάνατον; ποσάκις⁴ τιμωρίαις⁵ ⸀με⸀⁶ παραδοῦσα⁷ ἀνεκαλέσατο⁸ [καὶ ἠπείλησέ μοι⁹] *καὶ μὴ θέλοντός μου¹⁰ συνελθεῖν αὐτῇ ἔλεγέ¹¹ μοι· Κυριεύσεις¹² *κἀμοὶ καὶ πάντων τῶν ἐν τῷ οἴκῳ μου¹³, *ἐὰν ἐπιδῷς ἑαυτὸν¹⁴ εἰς ἐμέ, καὶ ἔσῃ ὡς δεσπότης ἡμῶν¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/002.yaml
  text: How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments, she called me back, and threatened me; and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”
translation:
  language: ko
  text: “이집트 여인은 내게 몇 번이나 죽음을 위협했습니까! 몇 번이나 나를 형벌에 넘겨 놓고는 다시 불러들여 위협했고, 내가 그녀와 함께 가기를 원하지 않을 때에는 내게 이렇게 말했습니다. ‘당신은 나와 내 집에 있는 모든 사람 위에 권세를 가지게 될 것입니다. 당신이 나 자신을 내게 내주면, 당신은 우리의 주인처럼 될 것입니다.’”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  english_pob_choice: the Egyptian woman
  chosen_korean: 이집트 여인
  alternatives_korean:
  - 애굽 여자
  - 이집트 여자
  lexicon: source phrase designation
  rationale: 인물을 지칭하는 서술적 표현이라 이름을 붙이지 않고, 현대 한국어에서 자연스러운 ‘이집트 여인’으로 옮겼습니다.
- source_word: τιμωρίαις
  english_pob_choice: punishments
  chosen_korean: 형벌
  alternatives_korean:
  - 벌
  - 징벌
  lexicon: τιμωρία
  rationale: ‘punishments’의 공개적·가시적 처벌 뉘앙스를 살려 ‘형벌’로 옮겼습니다.
- source_word: Κυριεύσεις
  english_pob_choice: You shall have authority over me
  chosen_korean: 당신은 … 위에 권세를 가지게 될 것입니다
  alternatives_korean:
  - 당신은 …를 다스리게 될 것입니다
  - 당신은 … 위에 주인이 될 것입니다
  lexicon: κυριεύω
  rationale: 동사의 지배·권세 의미를 반영하되, 바로 뒤의 ‘주인’(δεσπότης)과 구별되도록 ‘권세를 가지다’로 번역했습니다.
- source_word: δεσπότης
  english_pob_choice: master
  chosen_korean: 주인
  alternatives_korean:
  - 주
  - 소유주
  - 주재자
  lexicon: δεσπότης
  rationale: 영어 POB의 ‘master’에 맞춰 관계의 소유·지배성을 드러내는 가장 직접적인 한국어 표현인 ‘주인’을 사용했습니다.
theological_decisions:
- issue: 여성의 유혹적 발화의 직접 인용 처리
  chosen_reading: 직접화법을 유지해 조세프에게 주어지는 유혹과 권력 약속의 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - 서술문으로 완화해 재진술
  - 암시적으로만 처리
  rationale: 원문과 영어 POB 모두 인용부호 안의 직접 발화를 유지하므로, 독자가 유혹의 압박과 언어적 조작을 분명히 보게 하는 쪽이 더 충실합니다.
  doctrine_reference: source transparency / narrative fidelity
