base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/001.yaml
  text: In ten temptations he proved me approved, and in them all I was patient; for patience is a great remedy, and endurance gives many good things.
translation:
  language: ko
  text: 열 번의 유혹으로 그녀는 나를 검증된 사람으로 드러냈고, 그 모든 일에서 나는 오래 참았습니다. 오래 참음은 큰 치료제이고 인내는 많은 좋은 것을 주기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόκιμον ἀπέδειξέ με
  english_pob_choice: he proved me approved
  chosen_korean: 그는 나를 입증하여 인정받게 하였고
  alternatives_korean:
  - 그는 나를 입증하였고
  - 그는 나를 합당한 자로 드러내셨고
  lexicon: δόκιμος / ἀποδείκνυμι
  rationale: δόκιμον은 단순한 시험 통과를 넘어 ‘검증되어 인정받는 상태’를 뜻하므로, ‘입증하여 인정받게 하다’로 옮겨 시험과 승인 둘을 함께 드러냈습니다.
- source_word: ἐμακροθύμησα
  english_pob_choice: I was patient
  chosen_korean: 나는 오래 참았습니다
  alternatives_korean:
  - 나는 인내했습니다
  - 나는 참았습니다
  lexicon: μακροθυμέω
  rationale: POB의 ‘patient’는 한국어에서 정서적 인내를 낳기 쉬워, 문맥상 더 직접적인 ‘오래 참다’로 옮겼습니다.
- source_word: ἡ μακροθυμία
  english_pob_choice: patience
  chosen_korean: 오래 참음
  alternatives_korean:
  - 인내
  - 참음
  lexicon: μακροθυμία
  rationale: 명사형에서도 반복어감을 살려 동일 어근을 유지하고, ‘큰 치료제’와의 결합이 자연스럽도록 ‘오래 참음’으로 번역했습니다.
- source_word: ἡ ὑπομονή
  english_pob_choice: endurance
  chosen_korean: 인내
  alternatives_korean:
  - 견딤
  - 버팀
  lexicon: ὑπομονή
  rationale: ὑπομονή는 버티며 계속 견디는 태도를 가리키므로, 결과를 낳는 지속성을 강조하는 ‘인내’를 택했습니다.
theological_decisions:
- issue: ‘열 번의 유혹’과 인물 대명사 보존
  chosen_reading: 원문처럼 유혹의 횟수와 그 유혹을 ‘그’가 행한 것으로 두어, 서술의 대상과 행위 주체를 바꾸지 않았습니다.
  alternative_readings:
  - ‘열 번의 시련’
  - 주어를 명시적으로 풀어 쓰기
  rationale: 본절은 직전·후 문맥과 연결되는 서술이므로, 원문의 지시관계를 유지하는 편이 독자가 본래의 수사와 신학적 대비를 더 잘 파악할 수 있습니다.
  doctrine_reference: 문맥 일관성과 서사적 지시 유지
