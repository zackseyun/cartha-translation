    rationale: 이 표현은 ‘입증’의 주체와 ‘인정’의 주체를 불필요하게 분리해 들리게 합니다. ‘나를 검증된 사람으로 드러냈고’는 검증과 승인된 상태를 한 표현 안에 보존합니다.
