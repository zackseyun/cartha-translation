  text: '*Ἐν δέκα²⁸ πειρασμοῖς *δόκιμον ἀπέδειξέ με²⁹ Καὶ ἐν πᾶσιν αὐτοῖς³⁰ ἐμακροθύμησα³¹. Ὅτι³² μέγα φάρμακόν ἐστιν *ἡ μακροθυμία³³ Καὶ πολλὰ³⁴ ἀγαθὰ δίδωσιν *ἡ ὑπομονή³⁵.'
