  source_fidelity: 그리스어의 동사 ἀπέδειξέ는 단수 3인칭이지만, 주어는 본절에 명시되지 않습니다. 그러나 직전 문맥의 여성을 가리키므로 남성 대명사 ‘그는’은 문맥상 부정확합니다. 또한 δόκιμον ἀπέδειξέ με는 ‘나를 입증하여 인정받게 하였다’보다 ‘나를 검증된 사람으로 드러냈다’가 더 직접적입니다. πειρασμοῖς는 여기서 ‘유혹들’로 유지할 수 있습니다.
  naturalness: ‘그 모든 일들 가운데서’는 다소 장황하므로 ‘그 모든 일에서’가 자연스럽습니다. μακροθυμία의 명사형은 ‘오래 참음’으로 유지할 수 있으며, ὑπομονή는 ‘인내’로 구별하는 것이 적절합니다.
  terminology: μακροθυμία를 ‘오래 참음’, ὑπομονή를 ‘인내’로 구별한 선택은 좋습니다. φάρμακον은 문맥상 ‘치료제’로 자연스럽게 옮길 수 있습니다.
