  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὤρθριζον δὲ³⁵ πρὸς Κύριον καὶ ἔκλαιον περὶ Μεμφίας³⁶ τῆς Αἰγυπτίας, ὅτι σφόδρα³⁷ ἀδιαλείπτως ἠνόχλει³⁸ μοι³⁹. *καὶ γὰρ⁴⁰ ἐν νυκτὶ εἰσήιει⁴¹ *πρός με⁴² λόγῳ ἐπισκέψεως.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/006.yaml
  text: And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.
translation:
  language: ko
  text: 저는 아침 일찍 주님께 일어나며, 멤피스라 하는 이집트 여인에 대해 울었습니다. 그녀가 끊임없이 저를 크게 괴롭혔기 때문입니다. 사실 밤에도 그녀는 방문하러 온다는 핑계로 제게 들어왔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὤρθριζον δὲ πρὸς Κύριον
  english_pob_choice: I would rise early to the Lord
  chosen_korean: 저는 아침 일찍 주님께 일어나며
  alternatives_korean:
  - 저는 주님께 이른 아침에 일어나며
  - 저는 새벽에 주님께 일어나며
  lexicon: Ὤρθριζον / πρὸς Κύριον
  rationale: 반복·습관적 과거의 뉘앙스를 살려 ‘일찍 일어나며’로 옮기고, πρὸς Κύριον은 방향성을 살려 ‘주님께’로 처리했습니다.
- source_word: Μεμφίας τῆς Αἰγυπτίας
  english_pob_choice: Memphis the Egyptian woman
  chosen_korean: 멤피스라 하는 이집트 여인
  alternatives_korean:
  - 이집트 사람 멤피스
  - 멤피스 이집트 여인
  lexicon: Μεμφίας / τῆς Αἰγυπτίας
  rationale: 고유명사와 출신 표지를 분리해 ‘멤피스라 하는 이집트 여인’으로 번역하여, 이름과 민족/출신 설명을 함께 드러냈습니다.
- source_word: σφόδρα ἀδιαλείπτως ἠνόχλει μοι
  english_pob_choice: she troubled me greatly without ceasing
  chosen_korean: 그녀가 끊임없이 저를 크게 괴롭혔기 때문입니다
  alternatives_korean:
  - 그녀가 매우 집요하게 저를 괴롭혔기 때문입니다
  - 그녀가 쉬지 않고 저를 심히 괴롭혔기 때문입니다
  lexicon: σφόδρα / ἀδιαλείπτως / ἠνόχλει
  rationale: σφόδρα와 ἀδιαλείπτως의 중첩된 강도를 ‘끊임없이’와 ‘크게’로 나눠 반영하고, ἠνόχλει의 지속적 괴롭힘을 ‘괴롭혔습니다’로 옮겼습니다.
- source_word: ἐν νυκτὶ εἰσήιει πρὸς με λόγῳ ἐπισκέψεως
  english_pob_choice: even at night she would come in to me under a pretext of visiting
  chosen_korean: 사실 밤에도 그녀는 방문하러 온다는 핑계로 제게 들어왔습니다
  alternatives_korean:
  - 밤에도 그녀는 방문하러 오는 체하며 제게 들어왔습니다
  - 밤에도 그녀는 방문 명목으로 제게 들어왔습니다
  lexicon: ἐν νυκτί / εἰσήιει / λόγῳ ἐπισκέψεως
  rationale: ‘방문하러 온다는 핑계로’는 λόγῳ ἐπισκέψεως의 구실/명분을 자연스럽게 드러내며, εἰσήιει의 내적 출입을 ‘제게 들어왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 주님 앞에 이른 시간에 일어나는 행위의 서술
  chosen_reading: 단순한 경건 행위의 묘사로 처리하고, 별도의 예전적·기도문적 확장은 넣지 않았습니다.
  alternative_readings:
  - 예배적 헌신의 표현으로 해석
  - 회개 의식의 일부로 강조
  rationale: 원문은 ‘주님께 일찍 일어났다’는 행위와 그 뒤의 통곡을 직접 서술할 뿐이므로, 문맥 이상의 신학적 해석을 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: 문맥 우선 원칙
