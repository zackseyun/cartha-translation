id: T12P.JOS.3.5
reference: Testament of Joseph 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν δὲ ἀπεδήμει²⁷ *ὁ κύριός μου²⁸ οἶνον²⁹ οὐκ ἔπινον, *καὶ τριημερίζων³⁰ ἐλάμβανον³¹ ⸀μου⸀ τὴν τροφήν³², καὶ ἐδίδουν³³ αὐτὴν ⸀τοῖς⸀³⁴ πένησιν καὶ ⸀τοῖς⸀³¹ ἀσθενοῦσιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/005.yaml
  text: And if my master was away, I drank no wine; and for three days I would take my food and give it to the poor and the sick.
translation:
  language: ko
  text: 그리고 내 주인이 자리를 비웠을 때에는 포도주를 마시지 않았습니다. 그리고 사흘 동안은 제 음식을 가져다가 가난한 이들과 병든 이들에게 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριός μου
  english_pob_choice: my master
  chosen_korean: 내 주인
  alternatives_korean:
  - 내 상전
  - 나의 주인
  lexicon: κύριος
  rationale: 소유격이 붙은 κύριός μου는 문자적으로 ‘나의 주인’이지만, 현대 한국어에서 종속 관계를 자연스럽게 드러내는 ‘내 주인’이 가장 직접적입니다.
- source_word: οἶνον οὐκ ἔπινον
  english_pob_choice: I drank no wine
  chosen_korean: 포도주를 마시지 않았습니다
  alternatives_korean:
  - 술을 마시지 않았습니다
  - 포도주를 입에 대지 않았습니다
  lexicon: οἶνος
  rationale: οἶνος는 일반적인 ‘술’보다 구체적인 ‘포도주’가 더 정확하며, 금욕의 내용을 분명하게 살립니다.
- source_word: τριημερίζων
  english_pob_choice: for three days
  chosen_korean: 사흘 동안
  alternatives_korean:
  - 삼 일 동안
  - 사흘간
  lexicon: τριημερίζω
  rationale: 지속 기간을 자연스러운 한국어 관용에 맞게 ‘사흘 동안’으로 옮겨 시간의 흐름을 살렸습니다.
- source_word: πένησιν ... ἀσθενοῦσιν
  english_pob_choice: the poor and the sick
  chosen_korean: 가난한 이들과 병든 이들
  alternatives_korean:
  - 가난한 사람들과 병자들
  - 빈곤한 자들과 연약한 자들
  lexicon: πένης, ἀσθενής
  rationale: 두 대상을 평행하게 유지하면서, 지나치게 교회적이거나 경직된 표현을 피하고 현대 독자가 이해하기 쉬운 말로 옮겼습니다.
theological_decisions:
- issue: 윤리적 자기절제와 자선의 연계
  chosen_reading: 주인이 없을 때 포도주를 끊고, 자신의 음식을 가난한 이들과 병든 이들에게 나누는 행위를 하나의 금욕-자선 실천으로 함께 드러냈습니다.
  alternative_readings:
  - 두 문장을 더 분리해 단순한 일상 묘사처럼 읽는 방식
  - ‘주인이 없을 때’의 의미를 약화해 일반적 부재로만 처리하는 방식
  rationale: 그리스어는 금주와 음식 나눔을 연결해 인물의 절제와 자비를 함께 보여 주므로, 한국어도 그 도덕적 긴장을 유지해야 합니다.
  doctrine_reference: 성화와 자선 실천의 결합
