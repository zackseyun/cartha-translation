review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τοῦ προσώπου τὴν χάριν은 ‘외모에서 호의를 받다’보다 ‘얼굴/용모에 은총(호의)을 받다’라는 표현으로 옮기는 편이 원문의 속격과 목적어 관계를 더 정확히 보존합니다. ‘이집트 사람’은 단수의 특정 인물을 가리킵니다.
  naturalness: 초안은 전반적으로 자연스럽고 합쇼체를 사용합니다. 그러나 ‘외모에서 호의를 받다’는 한국어에서 다소 어색하며, 외부 타인의 호의를 받는다는 뜻으로도 읽힐 수 있습니다. ‘얼굴에 은총을 받다’는 다소 문어적이지만 고대 종교 문헌의 격식에 맞고 의미도 명료합니다.
  terminology: ‘금식’, ‘하나님’, ‘이집트 사람’은 적절합니다. τρυφή는 ‘사치 속에 사는’보다 ‘호화롭게 사는’이 자연스럽고 의미를 충분히 담습니다. χάρις는 여기서 미적·호의적인 은총을 포괄하므로 ‘은총’으로 유지하고, 신체 부위인 πρόσωπον은 ‘얼굴’로 명시합니다.
  issues:
  - severity: medium
    issue: ‘외모에서 호의를 받기’는 τοῦ προσώπου τὴν χάριν의 관계를 불분명하게 옮깁니다.
    rationale: 원문은 ‘얼굴의 은총/호의’를 받는다는 뜻이며, 한국어 초안은 외모라는 영역에서 타인의 호의를 받는다는 의미로도 이해될 수 있습니다.
  - severity: low
    issue: ‘사치 속에 사는 사람처럼’은 다소 직역적인 표현입니다.
    rationale: ἐν τρυφῇ διάγων은 ‘호화롭게 사는 사람처럼’으로 자연스럽게 표현할 수 있으며 의미 손실이 없습니다.
  revised_text: 그리고 나는 그 일곱 해 동안 금식하였고, 그 이집트 사람에게는 마치 호화롭게 사는 사람처럼 보였습니다. 하나님을 위하여 금식하는 사람들은 얼굴에 은총을 받기 때문입니다.[a]
