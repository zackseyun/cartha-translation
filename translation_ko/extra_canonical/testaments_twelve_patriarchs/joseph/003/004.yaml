revisions:
- from: 그리고 나는 그 일곱 해 동안 금식하였고, 이집트 사람에게는 마치 사치 속에 사는 사람처럼 보였습니다. 왜냐하면 하나님을 위해 금식하는 사람들은 외모에서 호의를 받기 때문입니다.[a]
  to: 그리고 나는 그 일곱 해 동안 금식하였고, 그 이집트 사람에게는 마치 호화롭게 사는 사람처럼 보였습니다. 하나님을 위하여 금식하는 사람들은 얼굴에 은총을 받기 때문입니다.[a]
