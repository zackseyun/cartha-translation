source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐνήστευον ἐν τοῖς ἑπτὰ ἔτεσιν²¹ ἐκείνοις, καὶ ἐφαινόμην *τῷ Αἰγυπτίῳ²² ὡς ἐν τρυφῇ διάγων· ὅτι²³ οἱ νηστεύοντες *διὰ τὸν θεὸν²⁴ τοῦ προσώπου τὴν χάριν²⁵ λαμβάνουσιν²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/004.yaml
  text: And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; because those who fast for God receive favor in their appearance.
translation:
  language: ko
  text: 그리고 나는 그 일곱 해 동안 금식하였고, 이집트 사람에게는 마치 사치 속에 사는 사람처럼 보였습니다. 왜냐하면 하나님을 위해 금식하는 사람들은 외모에서 호의를 받기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνήστευον
  english_pob_choice: I fasted
  chosen_korean: 나는 금식하였고
  alternatives_korean:
  - 나는 단식하였고
  - 나는 금식했습니다
  lexicon: νηστεύω
  rationale: 서술의 지속적 행위를 자연스럽게 살리면서도, 본문의 핵심 종교행위를 표준적인 ‘금식’으로 옮겼습니다.
- source_word: ἐν τοῖς ἑπτὰ ἔτεσιν ἐκείνοις
  english_pob_choice: during those seven years
  chosen_korean: 그 일곱 해 동안
  alternatives_korean:
  - 그 일곱 해 동안에
  - 그 일곱 해에
  lexicon: ἑπτά / ἔτη
  rationale: 시간 부사를 간결하게 처리해 문장 흐름을 살렸고, ‘해’는 고전적 기간 단위를 자연스럽게 드러냅니다.
- source_word: τῷ Αἰγυπτίῳ
  english_pob_choice: the Egyptian
  chosen_korean: 이집트 사람에게는
  alternatives_korean:
  - 애굽 사람에게는
  - 이집트인에게는
  lexicon: Αἰγύπτιος
  rationale: 고유명사형 형용사를 문맥상 인물 지칭으로 풀어, 현대 한국어에서 더 자연스럽고 공손한 문장으로 만들었습니다.
- source_word: ἐν τρυφῇ διάγων
  english_pob_choice: one living in luxury
  chosen_korean: 마치 사치 속에 사는 사람처럼
  alternatives_korean:
  - 호화롭게 사는 사람처럼
  - 사치스럽게 사는 사람처럼
  lexicon: τρυφή
  rationale: ‘τρυφή’의 풍요·사치 뉘앙스를 살리되, 단순 상태술어보다 비교 구조를 분명히 드러냈습니다.
- source_word: τοῦ προσώπου τὴν χάριν
  english_pob_choice: favor in their appearance
  chosen_korean: 외모에서 호의를 받기
  alternatives_korean:
  - 얼굴에서 은총을 받기
  - 용모에서 호의를 얻기
  lexicon: πρόσωπον / χάρις
  rationale: 직역투의 ‘얼굴의 은혜’보다 POB의 수정 취지에 맞춰, 본문이 말하는 ‘겉모습에서 호의/호감이 드러나는 것’을 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: “하나님을 위해”의 목적격 표현
  chosen_reading: 하나님을 위해 금식하는 사람들
  alternative_readings:
  - 하나님을 위하여 금식하는 사람들
  - 하나님의 खातिर 금식하는 사람들
  rationale: 영어 POB의 최종 수정이 ‘for God’로 되돌아갔으므로, 과장된 목적 해석 없이 단순 목적/대상 표지를 유지했습니다.
  doctrine_reference: source fidelity; avoiding interpretive expansion
