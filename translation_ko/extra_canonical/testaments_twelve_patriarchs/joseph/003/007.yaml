  text: And because she had no male child, she pretended.
translation:
  language: ko
  text: 그녀에게는 남자아이가 없었기 때문에, 그녀는 가장하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기서 ‘그녀는 가장하였습니다’라는 동사로 끝나며, 무엇을 가장했는지는 밝히지 않습니다.
    reason: 한국어에서 목적어 없는 ‘가장하였습니다’가 어색하게 느껴질 수 있는 지점을 설명하면서, 원문의 미완적 종결을 해석적으로 보완하지 않았음을 나타냅니다.
lexical_decisions:
- source_word: τέκνον ἄρρεν
  english_pob_choice: male child
  chosen_korean: 남자아이
  alternatives_korean:
  - 아들
  - 남자 자녀
  - 남자아이
  lexicon: τέκνον / ἄρρεν
  rationale: 직역하면 ‘남자 자녀’이지만, 문맥상 성별이 강조된 아이를 자연스럽게 드러내기 위해 ‘남자아이’로 옮겼습니다. 일반적인 ‘아들’보다 원문의 성별 표지를 더 직접적으로 반영합니다.
- source_word: οὐκ ἦν αὐτῇ
  english_pob_choice: she had no
  chosen_korean: 그녀에게는 … 없었기 때문에
  alternatives_korean:
  - 그녀는 … 없었고
  - 그녀에게 … 없었기 때문에
  - 그녀는 … 없었습니다
  lexicon: ἔχω / εἰμί + dative
  rationale: 소유 부정을 한국어에서는 ‘~에게는 … 없었기 때문에’로 자연스럽게 풀어, 뒤의 행위 이유를 연결했습니다.
- source_word: προσεποιεῖτο
  english_pob_choice: she pretended
  chosen_korean: 그녀는 그렇게 하는 체하였습니다
  alternatives_korean:
  - 그녀는 속인 척하였습니다
  - 그녀는 가장하였습니다
  - 그녀는 꾸미고 있었습니다
  lexicon: προσποιέομαι
  rationale: 원문은 단순히 ‘가장하다/체하다’의 행위만 말하며 뒤에 목적절이 없습니다. 그래서 POB의 개정 취지에 따라 해석을 덧붙이지 않고 미완의 진술을 그대로 살렸습니다.
theological_decisions:
- issue: 미완성 종결 보존
  chosen_reading: 문장을 ‘그녀는 그렇게 하는 체하였습니다’로 끝내어, 원문의 미완성된 서술을 유지했습니다.
  alternative_readings:
  - ‘그녀는 그것을 가장하였습니다’처럼 마침을 보완하는 번역
  - ‘그녀는 아들처럼 행동하려는 체하였습니다’ 같은 해석적 보완
  rationale: 영문 POB 개정처럼 그리스어가 제공하지 않는 보충 문구를 넣지 않고, 현존 본문의 단문 종결을 보존하는 것이 사본 증거에 더 충실합니다.
  doctrine_reference: 본문 비평 및 번역 윤리
