base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020.yaml
  text: '1[[to the Hippodrome]]. For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.


    2. But you shall carry up my bones with you[3a], for when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.


    3. And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.


    3a. But another reading says: “And bring up Zelpha your mother, and place her near Bilhah [by the Hippodrome], close to Rachel.”


    12. For my kingdom among you will be brought to completion like a watchman’s hut in an orchard[12b][12], which does not appear after the summer.”'
  footnotes:
  - marker: '[to the Hippodrome]'
    text: The bracketed phrase is textually uncertain in the supplied Greek witness.
    reason: textual_variant
  - marker: 3a
    text: Some witnesses read 'Zelpha your mother ... near Bilhah ... close to Rachel' instead of 'Aseneth your mother ... near Rachel my mother.'
    reason: alternative_reading
  - marker: '12'
    text: The verse numbering in the supplied witness jumps to 12 after verse 3; the chapter appears textually compressed or excerpted in this source layer.
    reason: textual_variant
  - marker: 12b
    text: The image of a watchman’s hut in an orchard evokes a temporary shelter left behind after harvest; compare similar seasonal imagery in Isaiah 1:8.
    reason: cross_reference
translation:
  language: ko
  text: '1. 내가 죽은 뒤에 이집트 사람들이 너희를 압제할 것을 내가 압니다. 그러나 하나님께서 너희의 원한을 갚으시고, 너희를 너희 조상들의 약속으로 인도하실 것입니다.


    2. 그러나 너희는 내 뼈를 너희와 함께 운반해야 합니다. 내 뼈가 거기서 옮겨질 때, 주님께서는 빛 가운데 너희와 함께 계실 것이고, 베리알은 이집트 사람들과 함께 어둠 가운데 있을 것입니다.


    3. 그리고 어세넷인 너희 어머니를 데려다가, 라헬인 내 어머니 곁에 장사하십시오.


    3a. 어떤 사본은 “너희 어머니 실바를 데려다가, [히포드롬 근처에서] 빌하 곁, 라헬 가까이에 두십시오”라고 읽습니다.


    12. 내 나라가 너희 가운데서 완성되는 것은, 여름 뒤에 사라지는 과수원의 파수꾼 오두막과 같습니다.”[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψουσιν
  english_pob_choice: will oppress
  chosen_korean: 압제할 것입니다
  alternatives_korean:
  - 괴롭힐 것입니다
  - 환난을 주실 것입니다
  lexicon: LSJ
  rationale: 지속적이고 강한 억압의 뉘앙스를 살리기 위해 ‘압제하다’를 택했습니다.
- source_word: ποιήσει τὴν ἐκδίκησιν
  english_pob_choice: will execute your vengeance
  chosen_korean: 너희의 원한을 갚으시고
  alternatives_korean:
  - 너희를 위해 보복하실 것이고
  - 너희의 원수를 갚으시고
  lexicon: LSJ
  rationale: ποιέω와 ἐκδίκησις의 결합을 한국어 관용으로 직접 옮기되, 단순한 보복보다 원한의 해소와 응징을 함께 드러내기 위해 ‘원한을 갚다’를 사용했습니다.
- source_word: ἐπάξει
  english_pob_choice: bring you into
  chosen_korean: 인도하실 것입니다
  alternatives_korean:
  - 데려가실 것입니다
  - 이끌어 들이실 것입니다
  lexicon: LSJ
  rationale: 약속의 땅/약속 안으로의 이동을 자연스럽게 드러내면서도, 단순한 물리적 이동보다 구속사적 인도를 살리기 위해 ‘인도하다’로 옮겼습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 베리알
  alternatives_korean:
  - 벨리알
  lexicon: LSJ
  rationale: 본문의 그리스어 형태를 따라 음역했습니다. 이 문맥의 빛/어둠 대비를 보존하기 위해 악의 추상명사로 바꾸지 않았습니다.
- source_word: ὀπωροφυλάκιον
  english_pob_choice: watchman’s hut in an orchard
  chosen_korean: 과수원의 파수꾼 오두막
  alternatives_korean:
  - 과수원의 지킴이 초막
  - 과수원 감시초소
  lexicon: LSJ
  rationale: 계절적이고 임시적인 허름한 구조물을 드러내기 위해 ‘오두막’을 택했고, ‘파수꾼’은 감시 기능을 분명히 합니다.
theological_decisions:
- issue: ἐκδίκησις의 신학적 강도
  chosen_reading: 하나님은 이집트의 압제를 향해 실제로 응징하시는 분으로 제시됩니다.
  alternative_readings:
  - 하나님은 단지 위로만 하시는 분으로 완화해 읽을 수 있습니다
  - 하나님의 행동을 추상적 정의로만 좁혀 읽을 수 있습니다
  rationale: 본문은 위협에 대한 적극적 반전을 말하므로, 응징의 강도를 약화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: 베리알 대 주님의 대비
  chosen_reading: 주님은 빛 가운데, 베리알은 어둠 가운데 있다는 이원적 대조를 그대로 살렸습니다.
  alternative_readings:
  - 베리알을 ‘사탄’으로 일반화할 수 있습니다
  - 대조를 ‘선과 악’으로 풀어쓸 수 있습니다
  rationale: 사본이 제시하는 인격화된 어둠의 존재를 보존해야 본문의 묵시적 긴장이 유지됩니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
