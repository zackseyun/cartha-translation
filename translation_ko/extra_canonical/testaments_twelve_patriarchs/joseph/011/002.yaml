base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/002.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a slave?” And I said that I was a household slave, so that I might not put my brothers to shame.
translation:
  language: ko
  text: 내가 이스마엘 사람들과 함께 오는 동안 그들이 나를 계속 물으며 말하였습니다. 「당신은 종입니까?」 그래서 나는 내가 집안의 종이라고 말하였습니다. 이는 내 형제들에게 수치를 끼치지 않기 위해서였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δοῦλος / δοῦλός
  english_pob_choice: slave / household slave
  chosen_korean: 종 / 집안의 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: δοῦλος
  rationale: 영어 POB가 첫 질문을 "slave"로, 대답은 "household slave"로 구분하므로, 한국어도 일반적 신분표시는 종으로, 가정 소속을 드러내는 표현은 집안의 종으로 살렸습니다.
- source_word: ἐπηρώτων με λέγοντες
  english_pob_choice: they kept asking me, saying
  chosen_korean: 나를 계속 물으며 말하였습니다
  alternatives_korean:
  - 나에게 묻기를 반복하며 말하였습니다
  - 계속해서 나를 물었습니다
  lexicon: ἐπηρώτων / λέγοντες
  rationale: 반복적·지속적 질문의 뉘앙스를 살리기 위해 계속 물으며를 택했고, 말하였습니다로 이어지는 직접화법 구조를 유지했습니다.
- source_word: ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου
  english_pob_choice: so that I might not put my brothers to shame
  chosen_korean: 이는 내 형제들에게 수치를 끼치지 않기 위해서였습니다
  alternatives_korean:
  - 내 형제들을 부끄럽게 하지 않기 위해서였습니다
  - 형제들에게 욕됨이 돌아가지 않게 하려는 것이었습니다
  lexicon: αἰσχύνω / τοὺς ἀδελφούς μου
  rationale: αἰσχύνω의 수치/부끄러움 계열 의미를 직접 반영해 수치를 끼치지 않다로 옮겨, 형제들에게 미칠 사회적 수치의 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: 요셉의 자기 진술에서 신분을 낮추어 말하는 표현의 보존
  chosen_reading: 나는 실제로 종이라고 밝히되, 형제들을 부끄럽게 하지 않으려는 의도를 문장 끝에서 분명히 드러냈습니다.
  alternative_readings:
  - 나는 노예라고 말했다
  - 나는 집안의 노예라고 말했다
  rationale: 본문의 핵심은 신분 진술 자체보다 형제들을 수치로부터 보호하려는 의도이므로, 그 도덕적 긴장을 약화시키지 않도록 직설적 구조를 유지했습니다.
  doctrine_reference: 서술 윤리와 가족 수치 개념
