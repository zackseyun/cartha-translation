    rationale: 그리스어는 ‘내 형제들을’(τοὺς ἀδελφούς μου) 부끄럽게 하지 않겠다는 구조입니다. ‘내 형제들을 부끄럽게 하지 않기 위해서’가 이를 더 직접적으로 보존합니다.
