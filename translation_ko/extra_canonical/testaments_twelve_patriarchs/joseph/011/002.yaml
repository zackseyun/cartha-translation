  naturalness: ‘그들이 나를 계속 물으며 말하였습니다’는 한국어에서 ‘묻다’와 ‘말하다’가 중복되어 다소 부자연스럽습니다. 직접 인용 앞에서 ‘계속 나에게 물었습니다’로 처리하면 자연스럽고 반복상도 유지됩니다.
  terminology: δοῦλος의 ‘종’ 및 ἐξ οἴκου의 ‘집안의 종’은 이 본문과 영어 감사 번역의 구별을 적절히 보존합니다. ‘이스마엘 사람들’도 고유 집단명으로 자연스럽습니다.
