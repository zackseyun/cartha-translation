  to: 내가 이스마엘 사람들과 함께 오는 동안, 그들은 계속 나에게 물었습니다. 「당신은 종입니까?」 그래서 나는 집안의 종이라고 말하였습니다. 이는 내 형제들을 부끄럽게 하지 않기 위해서였습니다.
  rationale: 반복하여 묻는 미완료 과거의 뉘앙스를 ‘계속’으로 유지하되, 한국어 직접화법에 맞게 도입부를 다듬었습니다. 또한 형제들이 수치의 대상이라는 원문의 직접목적어 관계를 보존했습니다. 신분을 나타내는 ‘종’과 ‘집안의 종’의 구별 및 형제들을 보호하려는 목적은 유지했습니다.
