source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὑμεῖς οὖν¹, *τέκνα μου², ⌜ἔχετε ἐν πάσῃ³ πράξει ὑμῶν *πρὸ ὀφθαλμῶν ὑμῶν⁴ *τὸν τοῦ θεοῦ φόβον⁵, καὶ⁷ τιμᾶτε⁶ τοὺς ἀδελφοὺς ὑμῶν· πᾶς γὰρ ὁ⁷ ποιῶν⁸ νόμον Κυρίου ἀγαπηθήσεται ὑπʼ⁹ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/001.yaml
  text: And so, my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.
translation:
  language: ko
  text: 그러므로 너희도, 내 자녀들아, 너희의 모든 행위에서 하나님을 두려워하는 마음을 너희 눈앞에 두고, 너희 형제들을 존중하십시오. 주의 율법을 지키는 사람은 누구나 그분에게 사랑받을 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호칭의 친밀감을 살리면서도 합쇼체 서술과 어울리게 현대 한국어에서 자연스러운 ‘자녀들아’를 택했습니다.
- source_word: τὸν τοῦ θεοῦ φόβον
  english_pob_choice: the fear of God
  chosen_korean: 하나님의 두려움
  alternatives_korean:
  - 하나님을 경외함
  - 하나님을 두려워함
  lexicon: φόβος + θεός
  rationale: 원문의 명사구를 보존해 ‘경외’로 완전히 완화하지 않고, 하나님에 대한 경외와 두려움의 긴장을 드러냈습니다.
- source_word: τιμᾶτε τοὺς ἀδελφοὺς ὑμῶν
  english_pob_choice: honor your brothers
  chosen_korean: 너희 형제들을 존중하십시오
  alternatives_korean:
  - 너희 형제들을 공경하십시오
  - 너희 형제들을 존귀하게 여기십시오
  lexicon: τιμάω
  rationale: 관계 윤리의 핵심은 ‘존중/공경’이므로, 자연스러운 현대어로 ‘존중하십시오’를 선택했습니다.
- source_word: νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 율법
  lexicon: νόμος + κύριος
  rationale: 율법 전통을 유지하면서 Κυρίου를 한국어 관용에 맞게 ‘주의’로 옮겼습니다.
theological_decisions:
- issue: ‘fear of God’의 표현 강도
  chosen_reading: ‘하나님의 두려움’으로 옮겨 경외와 떨림의 긴장을 유지했습니다.
  alternative_readings:
  - ‘하나님을 경외함’
  - ‘하나님을 두려워함’
  rationale: 이 문맥은 단순한 경건 감정보다 행위 전체를 규율하는 지속적 경계심을 요구하므로, 완화된 표현보다 원문의 긴장을 보존하는 번역이 적절합니다.
  doctrine_reference: 잠 1:7; 전 12:13
