base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002.yaml
  text: And this man[a], Pharaoh’s chief cook, entrusted his house to me. And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame. I was imprisoned, I was beaten, I was mocked; and the Lord gave me compassion in the sight of the jailer. For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress[b]. For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, does he become weak or terrified. But in all these things he takes the lead[c], and in various ways he gives comfort.
  footnotes:
  - marker: a
    text: Some witnesses or interpreters understand ἀρχιμάγειρος as an official court title rather than a strictly culinary role; compare the Genesis narrative about Joseph in Egypt.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'from a burning flame' is likely metaphorical for the consuming danger of sexual temptation, though the Greek leaves the image itself unexpanded.
    reason: lexical_alternative
  - marker: c
    text: '''He stands over us'' may also be understood as ''he stands by us'' or ''he takes the lead for us''; the Greek verb can carry several related senses of leadership and care.'
    reason: alternative_reading
translation:
  language: ko
  text: 이 사람[a], 곧 바로의 수석 요리사가 자기 집을 내게 맡겼습니다. 나는 뻔뻔한 여자에게 맞서 싸웠습니다. 그 여자는 나와 함께 법을 어기자고 나를 계속 몰아붙였지만, 내 아버지의 하나님께서 나를 타오르는 불길에서 건져 내셨습니다.[b] 나는 감옥에 갇히고, 매를 맞고, 조롱을 받았습니다. 그러나 주님께서 간수 앞에서 제게 호의를 얻게 하셨습니다. 주님께서는 자기를 경외하는 이들을 버리지 않으십니다. 어둠 속에서도, 쇠사슬 속에서도, 환난 속에서도, 곤경 속에서도 버리지 않으십니다. 하나님께서는 사람처럼 부끄러워하지 않으시고, 인자처럼 두려워하지도 않으시며, 땅에서 난 자처럼 약해지거나 겁내지도 않으십니다. 그분께서는 이 모든 일 가운데서 앞장서시며[c], 여러 방식으로 위로하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본이나 해석은 ἀρχιμάγειρος를 엄밀히 요리 직무만을 가리키는 말이라기보다 궁정의 관직명으로 이해합니다. 창세기의 요셉 이집트 이야기와 비교하십시오.
    reason: lexical_alternative
  - marker: b
    text: ‘타오르는 불길’은 성적 유혹이 지닌 파괴적 위험을 비유적으로 가리킬 수 있으나, 그리스어 본문은 이 이미지를 더 설명하지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘앞장서시며’로 옮긴 말은 ‘돌보시며’, ‘곁에 서시며’, 또는 ‘앞장서 이끄시며’로도 이해될 수 있습니다. 그리스어 동사는 지도력과 돌봄에 관련된 여러 뉘앙스를 지닙니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρχιμάγειρος
  english_pob_choice: chief cook
  chosen_korean: 아궁이장
  alternatives_korean:
  - 수석 요리사
  - 주방장
  - 궁정의 수석 요리관
  lexicon: LSJ
  rationale: 영어 POB의 'chief cook'처럼 조리 직무를 드러내되, 궁정 관리 직함 가능성도 남겨 두기 위해 직역적 요소를 살렸습니다. 다만 한국어에서는 현대 독자가 이해할 수 있게 관청식 직함 느낌이 과해지지 않도록 '아궁이장'으로 옮겼습니다.
- source_word: ἠγωνισάμην
  english_pob_choice: I struggled
  chosen_korean: 몰아붙였지만 / 나는 … 맞섰습니다의 뉘앙스
  alternatives_korean:
  - 맞섰습니다
  - 분투했습니다
  - 싸웠습니다
  lexicon: LSJ
  rationale: 도덕적·의지적 저항을 나타내므로 단순한 물리적 싸움보다 '몰아붙이다/맞서다'의 긴장을 살렸습니다.
- source_word: ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς
  english_pob_choice: who kept pressing me to transgress with her
  chosen_korean: 나와 함께 법을 어기자고 나를 계속 몰아붙였지만
  alternatives_korean:
  - 나와 함께 불법을 저지르자고 계속 재촉했지만
  - 나와 함께 죄를 짓자고 계속 강요했지만
  lexicon: LSJ
  rationale: παρανομεῖν은 단순 성적 완곡어보다 더 넓은 '법을 어김/위법 행위'를 뜻하므로, POB의 'transgress'에 맞춰 한국어에서도 윤리·법적 의미를 유지했습니다.
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  english_pob_choice: rescued me from a burning flame
  chosen_korean: 타오르는 불길에서 건져 내셨습니다
  alternatives_korean:
  - 타오르는 화염에서 구하셨습니다
  - 불붙는 불길에서 구해 주셨습니다
  lexicon: LSJ
  rationale: 이미지의 비유성을 풀어 쓰지 않고, 위험의 생생함을 그대로 살렸습니다. '건져 내다'는 구출의 동작성과 긴박함을 잘 드러냅니다.
- source_word: εἰς οἰκτιρμούς
  english_pob_choice: gave me compassion
  chosen_korean: 호의를 주셨습니다
  alternatives_korean:
  - 긍휼을 주셨습니다
  - 연민을 베푸셨습니다
  - 자비를 주셨습니다
  lexicon: LSJ
  rationale: 문맥상 간수 앞에서 호의적 대우를 받게 되었다는 의미이므로, 한국어에서 자연스럽고 공적 문맥에 맞는 '호의'를 선택했습니다. 다만 신학적 용어로 굳어지지 않게 했습니다.
- source_word: προΐσταται
  english_pob_choice: he takes the lead
  chosen_korean: 앞서 가시며
  alternatives_korean:
  - 우리를 이끄시며
  - 우리를 돌보시며
  - 우리를 다스리시며
  lexicon: BDAG
  rationale: 이 동사는 인도·보호·주재의 여러 뜻을 가질 수 있어 하나로 좁히지 않고, POB의 폭넓은 해석을 살려 '앞서 가시며'로 옮겼습니다.
theological_decisions:
- issue: 하나님이 고난 속에서 어떻게 역사하시는가
  chosen_reading: ‘버리지 않으심’과 ‘앞서 가심/위로하심’을 함께 살려, 보호·인도·위로의 복합 의미를 유지했습니다.
  alternative_readings:
  - 단순히 지켜 주심
  - 주도적으로 이끄심만 강조
  rationale: 본문은 어둠·쇠사슬·환난·곤경 속에서도 하나님이 버리지 않으시고, 앞서 가시며 여러 방식으로 위로하신다고 진술합니다. 한 가지 기능으로 축소하지 않고 복합적 도움을 보존했습니다.
  doctrine_reference: 하나님의 섭리와 위로의 다중 양상
