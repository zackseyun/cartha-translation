    rationale: ὑπομονὴ καὶ ἡ προσευχὴ μετὰ νηστείας는 ‘인내와 금식을 곁들인 기도’가 함께 ‘많은 일을 이룬다’는 구조입니다.
  - severity: medium
    issue: 10:2의 ‘마음의 겸손 안에 있으면’이 부자연스럽고 수식 관계가 불명확함
    rationale: ἐν ταπεινώσει καρδίας는 인내와 금식의 기도를 수반하는 마음의 겸손을 나타냅니다. ‘마음을 겸손히 하여’가 자연스럽고 원문의 윤리적 조건을 보존합니다.
