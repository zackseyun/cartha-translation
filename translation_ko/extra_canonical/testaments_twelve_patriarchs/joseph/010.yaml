  terminology: ‘인내’, ‘절제’, ‘순결’, ‘금식과 함께하는 기도’, ‘거하다’, ‘지극히 높으신 분’, ‘노예 상태’, ‘중상모략’은 대체로 적절합니다. 10:6의 ‘하나님을 두려워하는 마음’은 원문의 φόβος τοῦ θεοῦ를 잘 전달합니다. ‘영화롭게 하십니다’는 δοξάζει의 높임·영광 부여의 의미를 유지합니다.
