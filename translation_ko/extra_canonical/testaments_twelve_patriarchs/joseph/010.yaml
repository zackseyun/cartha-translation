- from: '1. 그러므로 내 자녀들아, 인내가 얼마나 많은 일을 이루는지와 금식과 함께하는 기도를 보십시오.


    2. 그러므로 너희도, 인내와 금식과 함께하는 기도로 절제와 순결을 추구하고 마음의 겸손 안에 있으면, 주께서 너희 안에 거하실 것입니다. 그분은 절제를 사랑하십니다.


    3. 지극히 높으신 분이 거하시는 곳에서는, 누군가에게 시기나 노예 상태나 중상모략이 닥친다 해도, 그 사람 안에 거하시는 주께서 그의 절제 때문에 그를 악에서 건져 내실 뿐 아니라, 또한 나를 하셨듯이 그를 높이시고 영광스럽게 하십니다.


    4. 모든 사람은 행위로든 말로든 생각으로든 드러나기 때문입니다.


    5. 내 형제들은 내 아버지께서 나를 얼마나 사랑하셨는지 알았지만, 나는 마음에 교만하지 않았습니다. 어린아이였지만 내 마음에는 하나님을 두려워하는 마음이 있었습니다. 나는 모든 것이 반드시 지나가리라는 것을 알았기 때문입니다.


    6. 그리고 나는 악으로 들떠 있지 않았고, 오히려 내 형제들을 존중했습니다. 그리고 그들을 두려워했기 때문에, 팔려 가는 동안 이스마엘 사람들에게 내가 야곱의 아들, 곧 위대하고 의로운 사람의 아들이라고 말하지 않으려고 침묵했습니다.[a][b][c]'
  to: '1. 그러므로 내 자녀들아, 인내와 금식을 곁들인 기도가 얼마나 많은 일을 이루는지 보십시오.


    2. 그러므로 너희도 인내하며 절제와 순결을 추구하고, 마음을 겸손히 하여 금식과 함께 기도하면, 주께서 너희 안에 거하실 것입니다. 그분은 절제를 사랑하십니다.


    3. 지극히 높으신 분이 거하시는 곳에서는, 누군가에게 시기나 노예 상태나 중상모략이 닥친다 해도,[a] 그 사람 안에 거하시는 주께서 그의 절제 때문에 그를 악에서 건져 내실 뿐 아니라, 나에게 하신 것처럼 그를 높이시고 영화롭게 하십니다.


    4. 모든 사람은 행위로든 말로든 생각으로든 드러납니다.[b]


    5. 내 형제들은 내 아버지께서 나를 얼마나 사랑하셨는지 알았지만, 나는 마음속으로 교만해지지 않았습니다. 어린아이였지만 내 마음에는 하나님을 두려워하는 마음이 있었습니다. 모든 것이 지나갈 것을 알고 있었기 때문입니다.


    6. 나는 악한 일로 교만해지지 않았고, 오히려 내 형제들을 존중했습니다. 또 그들이 두려워서, 팔려 가면서 이스마엘 사람들에게 내가 위대하고 의로운 사람인 야곱의 아들이라고 말하지 않으려고 침묵했습니다.[c]'
  rationale: 원문을 우선하여 문장 구조와 핵심 어휘를 바로잡았습니다. 10:4는 전승된 그리스어가 난해하므로, 단정적 교리화나 과도한 본문 재구성 없이 기존의 ‘드러나다’ 해석을 유지하고 해당 절에 설명 주석을 배치했습니다. 각 주석 표지를 관련 절(10:3, 10:4, 10:6)로 옮겼습니다.
