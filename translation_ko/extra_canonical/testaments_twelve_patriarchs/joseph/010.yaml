base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010.yaml
  text: '1[a]. See, then, my children, how much endurance accomplishes, and prayer with fasting.


    2. So you also, if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.


    3[b]. And where the Most High dwells, even if envy should befall someone, or slavery, or slander, the Lord dwelling in him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.


    4. For every person, whether in deed or in word or in thought, comes together.


    5. My brothers knew how my father loved me, yet I was not exalted in my mind; but though I was a child, I had the fear of God in my heart, for I knew that all things will surely pass away.


    6. And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent, when I was being sold, so as not to tell the Ishmaelites that I was a son of Jacob[c], a great and mighty man.'
  footnotes:
  - marker: a
    text: Or 'false accusation'; the Greek term can denote malicious or trumped-up charges, fitting Joseph's experience in Egypt.
    reason: lexical_alternative
    anchor_ref: '10:3'
  - marker: b
    text: 'The Greek text here is difficult. The sense is that a person comes to prominence or is manifested in every sphere: deed, word, and thought.'
    reason: textual_variant
    anchor_ref: '10:4'
  - marker: c
    text: Some witnesses differ in this clause, but the sense is that Joseph remained silent about his family identity while being sold.
    reason: textual_variant
    anchor_ref: '10:6'
translation:
  language: ko
  text: '1. 그러므로 내 자녀들아, 인내가 얼마나 많은 일을 이루는지와 금식과 함께하는 기도를 보십시오.


    2. 그러므로 너희도, 인내와 금식과 함께하는 기도로 절제와 순결을 추구하고 마음의 겸손 안에 있으면, 주께서 너희 안에 거하실 것입니다. 그분은 절제를 사랑하십니다.


    3. 지극히 높으신 분이 거하시는 곳에서는, 누군가에게 시기나 노예 상태나 중상모략이 닥친다 해도, 그 사람 안에 거하시는 주께서 그의 절제 때문에 그를 악에서 건져 내실 뿐 아니라, 또한 나를 하셨듯이 그를 높이시고 영광스럽게 하십니다.


    4. 모든 사람은 행위로든 말로든 생각으로든 드러나기 때문입니다.


    5. 내 형제들은 내 아버지께서 나를 얼마나 사랑하셨는지 알았지만, 나는 마음에 교만하지 않았습니다. 어린아이였지만 내 마음에는 하나님을 두려워하는 마음이 있었습니다. 나는 모든 것이 반드시 지나가리라는 것을 알았기 때문입니다.


    6. 그리고 나는 악으로 들떠 있지 않았고, 오히려 내 형제들을 존중했습니다. 그리고 그들을 두려워했기 때문에, 팔려 가는 동안 이스마엘 사람들에게 내가 야곱의 아들, 곧 위대하고 의로운 사람의 아들이라고 말하지 않으려고 침묵했습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομονή
  english_pob_choice: endurance
  chosen_korean: 인내
  alternatives_korean:
  - 견딤
  - 참음
  lexicon: BDAG
  rationale: 훈계문맥의 지속적 버팀을 자연스럽게 살리면서, 한국어에서 덕목으로도 널리 통하는 표현입니다.
- source_word: προσευχὴ μετὰ νηστείας
  english_pob_choice: prayer with fasting
  chosen_korean: 금식과 함께하는 기도
  alternatives_korean:
  - 금식하는 기도
  - 기도와 금식
  lexicon: BDAG
  rationale: μετά의 동반 의미를 살려 기도와 금식을 분리하지 않으면서도, 단순 나열보다 연결 관계를 분명히 했습니다.
- source_word: σωφροσύνη / ἁγνεία
  english_pob_choice: self-control / purity
  chosen_korean: 절제와 순결
  alternatives_korean:
  - 자기 절제와 순결
  - 절제와 정결
  lexicon: BDAG
  rationale: σωφροσύνη의 도덕적 절제와 ἁγνεία의 성적·윤리적 순결을 함께 살리기 위해 두 덕목을 병렬로 옮겼습니다.
- source_word: κατοικέω / κατοικήσει ἐν ὑμῖν
  english_pob_choice: dwell / dwell in you
  chosen_korean: 거하실 것입니다 / 너희 안에 거하실 것입니다
  alternatives_korean:
  - 살아 계실 것입니다
  - 너희 가운데 거하실 것입니다
  lexicon: BDAG
  rationale: PB0 주석의 문맥처럼 단순한 동거가 아니라 하나님의 임재를 가리키므로, 성경적이면서도 과도하게 교리화하지 않는 '거하다'를 유지했습니다.
- source_word: δουλία
  english_pob_choice: slavery
  chosen_korean: 노예 상태
  alternatives_korean:
  - 노예됨
  - 종살이
  - 속박
  lexicon: BDAG
  rationale: 영어 POB가 slavery를 택해 예속의 현실을 드러내므로, 완화된 '종살이'보다 상태를 직접 드러내는 표현을 사용했습니다.
- source_word: συκοφαντία
  english_pob_choice: slander
  chosen_korean: 중상모략
  alternatives_korean:
  - 모함
  - 거짓 고발
  - 비방
  lexicon: BDAG
  rationale: 본문이 요셉의 부당한 고난을 가리키는 점을 살리면서, 부정한 고발과 비방의 뉘앙스를 함께 담는 표현으로 옮겼습니다.
- source_word: ἀνθρώπους ... ἐν ἔργῳ ... ἐν λόγῳ ... ἐν διανοίᾳ
  english_pob_choice: every person, whether in deed or in word or in thought, comes together
  chosen_korean: 모든 사람은 행위로든 말로든 생각으로든 드러나기 때문입니다
  alternatives_korean:
  - 모든 사람은 행위나 말이나 생각에서 하나로 모이기 때문입니다
  - 모든 사람은 행위, 말, 생각에서 함께 드러나기 때문입니다
  lexicon: BDAG
  rationale: 본문이 난해하여 영어 POB의 해석을 따르되, 한국어에서는 '드러나기'로 공개적 현현/판별의 뜻을 간명하게 살렸습니다.
theological_decisions:
- issue: 10:3의 '거하시는 주'와 '지극히 높으신 분'의 관계
  chosen_reading: 하나님의 임재를 별도의 체계화 없이 병렬적으로 유지하고, '주'와 '지극히 높으신 분'을 모두 살렸습니다.
  alternative_readings:
  - 동일 인물로 완전히 평준화
  - 후대 기독론적으로 정리
  rationale: 유대적 지혜/훈계 문맥의 긴장을 풀어버리지 않고, 본문이 말하는 임재의 조건과 결과를 그대로 드러내는 편이 원문에 충실합니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: 10:6의 '하나님을 두려워하는 마음'
  chosen_reading: φόβος τοῦ θεοῦ를 '하나님을 두려워하는 마음'으로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 하나님 경외
  - 하나님에 대한 경외심
  rationale: 본문의 윤리적 핵심이 단순 존경보다 두려움과 경외를 함께 포함하므로, 문맥의 중량을 살리는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md §Maintain source force and tension
