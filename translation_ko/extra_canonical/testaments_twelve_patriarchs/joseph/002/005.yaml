id: T12P.JOS.2.5
reference: Testament of Joseph 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός, Οὔτε¹⁶ ὡς υἱὸς ἀνθρώπου δειλιᾷ, Οὔτε¹⁷ ὡς γηγενὴς [ἀσθενεῖ ἢ]¹⁸ πτοεῖται¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/005.yaml
  text: For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, [does he become weak or] is he terrified.
translation:
  language: ko
  text: 하나님은 사람이 부끄러워하듯 부끄러워하지 않으시고, 사람의 아들이 두려워하듯 두려워하지도 않으시며, 땅에서 난 자가 그러하듯 [약해지시거나] 겁에 질리지도 않으십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός
  english_pob_choice: For God is not ashamed like a man
  chosen_korean: 하나님은 사람처럼 부끄러워하지 않으시며
  alternatives_korean:
  - 사람처럼 수치스러워하지 않으시며
  - 사람처럼 창피해하지 않으시며
  lexicon: Θεός → 하나님; ἐπαισχύνεται → 부끄러워하다
  rationale: ἐπαισχύνεται는 단순한 체면 손상보다 ‘부끄러워하다/수치스러워하다’의 의미가 강하므로, 합쇼체에서 자연스럽고 직접적인 ‘부끄러워하지 않으시며’로 옮겼습니다.
- source_word: υἱὸς ἀνθρώπου δειλιᾷ
  english_pob_choice: nor does he grow fearful like a son of man
  chosen_korean: 인자처럼 두려워하지도 않으시며
  alternatives_korean:
  - 사람의 아들처럼 겁내지 않으시며
  - 인자처럼 무서워하지도 않으시며
  lexicon: υἱὸς ἀνθρώπου → 인자; δειλιᾷ → 두려워하다
  rationale: 본문의 ‘사람의 아들’은 관용적으로 ‘인자’로 옮기되, δειλιᾷ의 뉘앙스를 살려 ‘두려워하다’로 표현했습니다.
- source_word: γηγενὴς [ἀσθενεῖ ἢ] πτοεῖται
  english_pob_choice: like one born of earth, [does he become weak or] is he terrified
  chosen_korean: 땅에서 난 자처럼 [약해지시거나] 놀라지도 않으십니다
  alternatives_korean:
  - 땅에서 난 사람처럼 [약해지시거나] 두려워 떨지도 않으십니다
  - 흙에서 난 자처럼 [약해지시거나] 겁내지도 않으십니다
  lexicon: γηγενής → 땅에서 난 자; ἀσθενεῖ → 약해지다; πτοεῖται → 놀라다/겁먹다
  rationale: γηγενής의 직설성을 살려 ‘땅에서 난 자’로 두었고, bracketed ἀσθενεῖ는 본문에 표시된 대로 선택적 요소로 유지했습니다. πτοεῖται는 ‘놀라다’가 가장 자연스럽지만, 문맥상 ‘겁먹다’의 의미도 포함됩니다.
theological_decisions:
- issue: 하나님의 비수치성과 비두려움의 강조
  chosen_reading: 하나님은 사람과 달리 부끄러움이나 두려움의 영향을 받지 않으시는 분으로 표현했습니다.
  alternative_readings:
  - 하나님은 사람처럼 체면을 차리거나 겁내지 않으십니다
  - 하나님은 인간적 약함의 반응을 보이지 않으십니다
  rationale: 본문은 하나님을 인간의 취약성과 대조하여 묘사하므로, 그 대조를 약화하지 않는 직역적 표현을 유지했습니다.
  doctrine_reference: 신적 무변성/초월성에 대한 서술적 대비
- issue: 대조적 병렬 구조 보존
  chosen_reading: 세 개의 부정절을 모두 ‘—며’로 연결하고, 괄호된 구절은 그대로 대괄호로 보존했습니다.
  alternative_readings:
  - 자연스러운 한국어로 단일 문장으로 재구성
  - 괄호를 풀어 한 흐름으로 번역
  rationale: 그리스어의 반복되는 οὐ… οὔτε… οὔτε 구조와 편집상 괄호를 유지해야, 본문 전승의 긴장과 가독성을 함께 보존할 수 있습니다.
  doctrine_reference: 본문 비평/전승 표지의 보존 원칙
