  source_fidelity: 첫째와 셋째 절의 부정 병렬 및 대괄호 안의 이문 표지는 대체로 잘 보존되었습니다. 다만 υἱὸς ἀνθρώπου를 ‘인자’로 옮기면 한국어 성경 용례상 특정한 메시아적 칭호로 읽히기 쉬운데, 여기서는 ἄνθρωπος 및 γηγενής와 병렬되는 일반적 인간성을 가리킵니다. 따라서 ‘사람의 아들’로 고쳐 원문의 표현과 비신학적 문맥을 함께 보존하는 것이 안전합니다. πτοεῖται는 단순한 놀람보다 공포에 사로잡힘을 뜻하므로 ‘겁에 질리다’가 더 충실합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서, 반복되는 ‘…하듯’과 ‘…않으시고/않으시며’로 원문의 비교와 병렬을 자연스럽게 드러냅니다. ‘땅에서 난 자’는 γηγενής의 직역적이고 문맥상 적절한 표현입니다.
  terminology: Θεός는 ‘하나님’으로 적절합니다. ‘인자’는 이 문맥에서 피하고 ‘사람의 아들’을 사용해야 합니다. 대괄호는 본문에 표시된 [ἀσθενεῖ ἢ]의 불확실한 첨가를 보존합니다.
