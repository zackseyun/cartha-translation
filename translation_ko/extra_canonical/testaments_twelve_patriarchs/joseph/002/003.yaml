- from: 나는 감옥에 갇혔고, 매를 맞았고, 조롱을 받았으며, 주님께서 간수 앞에서 나에게 긍휼을 베푸셨습니다.[a][b]
  to: 저는 감옥에 갇히고 매를 맞고 조롱을 받았으며, 주님께서는 간수 앞에서 제가 긍휼을 받게 하셨습니다.
  rationale: Recast the final clause so that God is the agent who causes Joseph to receive compassion, matching the Greek construction while avoiding an unnecessary claim about whether the compassion is grammatically attributed directly to God or to the jailer. Removed unsupported footnote markers. No footnote is needed for this straightforward rendering.
