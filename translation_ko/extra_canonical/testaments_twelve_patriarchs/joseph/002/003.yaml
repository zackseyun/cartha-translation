  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐφυλακίσθην⁶, ἐτύφθην⁷, ⸢ἐξεμυκτηρίσθην⸣⁸, καὶ ἔδωκέ με⁹ ὁ¹⁰ Κύριος¹¹ εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/003.yaml
  text: I was imprisoned, I was beaten, I was mocked, and the Lord gave me compassion in the sight of the jailer.
translation:
  language: ko
  text: 나는 감옥에 갇혔고, 매를 맞았고, 조롱을 받았으며, 주님께서 간수 앞에서 나에게 긍휼을 베푸셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφυλακίσθην
  english_pob_choice: I was imprisoned
  chosen_korean: 나는 감옥에 갇혔고
  alternatives_korean:
  - 나는 투옥되었고
  - 나는 갇혔고
  lexicon: φυλακίζω
  rationale: 수동 완료된 감금 상태를 자연스러운 현대 한국어로 옮기되, 형식적 어감보다 사건의 사실성을 살렸습니다.
- source_word: ἐτύφθην
  english_pob_choice: I was beaten
  chosen_korean: 매를 맞았고
  alternatives_korean:
  - 구타를 당했고
  - 맞았고
  lexicon: τύπτω
  rationale: 직접적 폭행을 드러내면서도 문어체로 무리 없이 읽히는 표현을 선택했습니다.
- source_word: ⸢ἐξεμυκτηρίσθην⸣
  english_pob_choice: I was mocked
  chosen_korean: 조롱을 받았으며
  alternatives_korean:
  - 비웃음을 당했으며
  - 희롱을 당했으며
  lexicon: ἐκμυκτηρίζω
  rationale: 코웃음치며 업신여김의 의미를 반영해 단순한 비난보다 조롱의 뉘앙스를 살렸습니다.
- source_word: εἰς οἰκτιρμοὺς
  english_pob_choice: compassion
  chosen_korean: 긍휼을 베푸셨습니다
  alternatives_korean:
  - 자비를 베푸셨습니다
  - 불쌍히 여기셨습니다
  lexicon: οἰκτιρμός
  rationale: POB의 'compassion'을 한국어 성경 문체에 맞게 ‘긍휼’로 옮기되, 행위 동사로는 ‘베푸셨습니다’를 사용해 수혜성을 분명히 했습니다.
theological_decisions:
- issue: 주님의 호의가 단순한 ‘favor’가 아니라 고난 속에서 나타난 긍휼로 제시됨
  chosen_reading: 주님께서 간수 앞에서 나에게 긍휼을 베푸셨습니다.
  alternative_readings:
  - 주님께서 간수 앞에서 나에게 호의를 베푸셨습니다.
  - 주님께서 간수 앞에서 나를 불쌍히 여기셨습니다.
  rationale: 수도/순교 전승 맥락에서 οἰκτιρμοί는 사회적 호의보다 연민과 긍휼의 의미가 더 강하므로 그 긴장을 유지했습니다.
  doctrine_reference: 자비와 긍휼의 언어(출 34:6; 시 103:13)
