id: T12P.JOS.2.4
reference: Testament of Joseph 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ¹² ἐγκαταλείπει¹³ Κύριος¹⁴ τοὺς φοβουμένους αὐτόν, *Οὐκ ἐν σκότει, ἢ δεσμοῖς¹⁵, ἢ θλίψεσιν, ἢ ἀνάγκαις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/004.yaml
  text: For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress.
translation:
  language: ko
  text: 주님은 자기를 두려워하는 사람들을 버리지 않으십니다. 어둠 속에서도, 쇠사슬 속에서도, 환난 가운데서도, 곤경 가운데서도 그렇지 않습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 본문의 호칭은 일반적인 신적 칭호이므로, 직접적이면서도 한국어에서 자연스러운 ‘주님’으로 옮겼습니다.
- source_word: φοβουμένους αὐτόν
  english_pob_choice: those who fear him
  chosen_korean: 자기를 두려워하는 사람들
  alternatives_korean:
  - 그를 경외하는 사람들
  - 그를 두려워하는 자들
  lexicon: φοβέομαι
  rationale: 여기서는 단순 공포보다 하나님에 대한 경외와 두려움을 함께 담는 표현이므로, 직역에 가까우면서도 의미를 살린 ‘자기를 두려워하는 사람들’을 택했습니다.
- source_word: δεσμοῖς
  english_pob_choice: chains
  chosen_korean: 쇠사슬 속에서도
  alternatives_korean:
  - 사슬 속에서도
  - 감옥에서도
  lexicon: δεσμός
  rationale: 행동을 가두는 물리적 속박의 이미지를 살리기 위해 ‘쇠사슬’로 옮겼습니다.
- source_word: θλίψεσιν, ἀνάγκαις
  english_pob_choice: afflictions, distress
  chosen_korean: 환난 가운데서도, 곤경 가운데서도
  alternatives_korean:
  - 고난 가운데서도, 궁핍 가운데서도
  - 억압 가운데서도, 압박 가운데서도
  lexicon: θλῖψις, ἀνάγκη
  rationale: 두 명사가 반복적으로 이어지는 병렬 구조를 살려, 각각 일반적인 고난과 압박적 궁핍/곤란의 뉘앙스를 구분해 표현했습니다.
theological_decisions:
- issue: 부정 구조와 병렬 열거의 재현
  chosen_reading: ‘어둠 속에서도, 쇠사슬 속에서도, 환난 가운데서도, 곤경 가운데서도 그렇지 않습니다’로 번역해, ‘버리지 않으십니다’의 부정이 뒤따르는 병렬 항목 전체에 걸리도록 했습니다.
  alternative_readings:
  - ‘어둠, 쇠사슬, 환난, 곤경 가운데서도 버리지 않으십니다’
  - ‘어둠이나 쇠사슬이나 환난이나 곤경 속에서는 버리지 않으십니다’
  rationale: 헬라어의 ‘οὐκ … ἢ … ἢ …’ 구조는 부정이 열거 전체를 포괄하므로, 한국어에서도 그 범위를 분명히 드러내는 것이 문장의 힘을 보존합니다.
  doctrine_reference: 본문의 문법 구조와 신적 신실성
- issue: ‘두려움’의 신학적 색조
  chosen_reading: ‘두려워하는’은 단순 공포가 아니라 하나님께 대한 경외를 포함하는 표현으로 이해했습니다.
  alternative_readings:
  - ‘경외하는’
  - ‘두려워하는’
  rationale: 영어 POB의 ‘fear him’은 경건한 경외를 함축하므로, 한국어 독자가 지나친 심리적 공포로만 읽지 않도록 하면서도 원문의 긴장을 유지했습니다.
  doctrine_reference: 경외와 신실한 관계의 어휘
