base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/006.yaml
  text: But in all these things he takes the lead, and in various ways he encourages. For a short time he withdraws, in order to test the inner intent of the soul.
translation:
  language: ko
  text: 그러나 이 모든 일에서 그는 앞장서며, 여러 방식으로 격려합니다. 그는 영혼 속의 의도를 시험하려고 잠시 물러납니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προΐσταται
  english_pob_choice: takes the lead
  chosen_korean: 앞장섭니다
  alternatives_korean:
  - 인도합니다
  - 우두머리가 됩니다
  lexicon: προΐστημι
  rationale: 문맥상 단순한 ‘있다/서다’가 아니라 다른 이들보다 먼저 나아가 주도하는 의미이므로, POB의 ‘takes the lead’를 살려 ‘앞장서다’로 옮겼습니다.
- source_word: παρακαλεῖ
  english_pob_choice: encourages
  chosen_korean: 격려합니다
  alternatives_korean:
  - 권면합니다
  - 위로합니다
  - 권고합니다
  lexicon: παρακαλέω
  rationale: 영어 POB가 ‘comfort’에서 ‘encourages’로 수정한 점을 반영해, 위로보다 권면·고무의 뉘앙스가 드러나는 ‘격려하다’를 선택했습니다.
- source_word: ἀφίσταται
  english_pob_choice: withdraws
  chosen_korean: 물러납니다
  alternatives_korean:
  - 떠납니다
  - 멀어집니다
  - 물러서십니다
  lexicon: ἀφίστημι
  rationale: 일시적으로 거리를 두는 동작을 자연스럽게 보여 주는 표현으로 ‘물러나다’를 택했습니다.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  english_pob_choice: the inner intent of the soul
  chosen_korean: 영혼의 내적 의도
  alternatives_korean:
  - 영혼의 생각
  - 영혼의 계획
  - 마음의 의도
  lexicon: διαβούλιον
  rationale: 직역하면 ‘영혼의 의논/심의’에 가깝지만, 영어 POB의 ‘inner intent’가 드러내는 내면의 결단과 의도를 살려 ‘내적 의도’로 옮겼습니다.
theological_decisions:
- issue: 주어가 일반 인물인지, 문맥상 인격화된 영적 존재인지
  chosen_reading: 본문의 동사는 한 인물이 공동체 안에서 보이는 지도와 권면, 잠시의 물러섬을 묘사하는 것으로 읽었습니다.
  alternative_readings:
  - 하나님의 섭리적 행위에 대한 비유로 읽기
  - 영적 덕목 자체의 인격화로 읽기
  rationale: 현 문장에는 직접적인 신명 호칭이나 명시적 신학 용어가 없어, 본문이 말하는 표면적 행위를 과도하게 신학화하지 않고 묘사적 의미를 유지했습니다.
  doctrine_reference: 문맥 우선 원칙
