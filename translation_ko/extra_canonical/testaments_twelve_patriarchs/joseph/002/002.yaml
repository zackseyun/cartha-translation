id: T12P.JOS.2.2
reference: Testament of Joseph 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἠγωνισάμην πρὸς γυναῖκα ἀναιδῆ ἐπείγουσάν² με παρανομεῖν μετʼ αὐτῆς, ἀλλʼ ὁ Θεὸς *τοῦ πατρός μου³ ἐρρύσατό⁴ με ἐκ⁵ φλογὸς καιομένης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/002.yaml
  text: And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame.
translation:
  language: ko
  text: 나는 나와 함께 율법을 어기도록 나를 계속 강요하는 뻔뻔한 여자에게 맞서 싸웠습니다. 그러나 내 아버지의 하나님이 나를 타는 불길에서 건져 내셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγωνισάμην
  english_pob_choice: I struggled
  chosen_korean: 싸웠습니다
  alternatives_korean:
  - 분투했습니다
  - 몸부림쳤습니다
  lexicon: ἀγωνίζομαι
  rationale: 도덕적 유혹에 맞서는 적극적 저항의 긴장을 살리기 위해, 단순한 감정보다 몸을 건 대항을 드러내는 동사로 옮겼습니다.
- source_word: γυναῖκα ἀναιδῆ
  english_pob_choice: a shameless woman
  chosen_korean: 뻔뻔한 여자
  alternatives_korean:
  - 수치 모르는 여자
  - 뻔뻔스러운 여자
  lexicon: γυνή / ἀναιδής
  rationale: ἀναιδής의 수치 없음, 대담한 무례를 한국어에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: παρανομεῖν
  english_pob_choice: to transgress
  chosen_korean: 죄를 짓도록
  alternatives_korean:
  - 율법을 어기도록
  - 불법을 행하도록
  lexicon: παρανομέω
  rationale: 여기서는 단순 위법보다 도덕적·언약적 일탈을 뜻하므로, 한국어로는 의미를 자연스럽게 풀어 ‘죄를 짓다’로 옮겼습니다.
- source_word: ὁ Θεὸς τοῦ πατρός μου
  english_pob_choice: the God of my father
  chosen_korean: 내 아버지의 하나님
  alternatives_korean:
  - 아버지의 하나님
  - 내 아버지의 하나님
  lexicon: Θεός
  rationale: 관계성을 그대로 살리면서도 한국어에서 가장 자연스러운 소유 구문으로 재현했습니다.
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  english_pob_choice: rescued me from a burning flame
  chosen_korean: 나를 타는 불길에서 건져 내셨습니다
  alternatives_korean:
  - 나를 불타는 화염에서 구해 내셨습니다
  - 나를 타오르는 불꽃에서 건져 내셨습니다
  lexicon: ῥύομαι / φλόξ
  rationale: 구출 행위의 강한 이미지를 살리기 위해 ‘건져 내셨습니다’를 택했고, φλογὸς καιομένης는 ‘타는 불길’로 압축해 역동성을 유지했습니다.
theological_decisions:
- issue: ‘내 아버지의 하나님’의 관계적 표지
  chosen_reading: 하나님을 조상-언약의 하나님으로 드러내는 표현을 보존했습니다.
  alternative_readings:
  - 그 아버지의 하나님
  - 아버지의 하나님
  rationale: 본문은 단순 호칭이 아니라 화자의 정체성과 하나님의 구원 행위를 연결하는 관계 표지를 담고 있으므로, 소유 관계를 분명히 살렸습니다.
  doctrine_reference: 성서 서사에서 조상들의 하나님이라는 언약적 호칭
- issue: ‘타는 불길’의 이미지
  chosen_reading: 실제 화재 묘사로만 좁히지 않고, 위기에서의 구출 이미지를 함께 드러냈습니다.
  alternative_readings:
  - 불꽃
  - 화염
  rationale: 원문과 영어 POB는 물리적 불과 함께 비유적 위협의 강도를 전달하므로, 한국어에서도 생생한 심판/위기 이미지를 유지했습니다.
  doctrine_reference: 성서적 구원-보호 이미지
