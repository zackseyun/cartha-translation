  source_fidelity: 원문의 ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς는 그 여자가 화자에게 ‘그녀와 함께’ 율법을 어기도록 압박한 것을 수식하는 분사구문입니다. 초안의 ‘그녀가 … 몰아붙일 때 싸웠습니다’는 이를 시간절처럼 처리하여 관계가 다소 흐려집니다. 또한 παρανομεῖν은 일반적인 ‘죄를 짓다’보다 ‘율법을 어기다’라는 뜻이 더 직접적입니다.
  naturalness: ‘뻔뻔한 여자’와 ‘내 아버지의 하나님’은 현대 표준어 합쇼체에서 자연스럽습니다. 다만 압박 행위를 여자에게 직접 연결하는 관형절로 고치면 문장이 더 명료하고 자연스럽습니다.
  terminology: ἀναιδής는 ‘뻔뻔한’, ἀγωνίζομαι는 ‘맞서 싸우다’, ῥύομαι는 ‘건져 내다’로 적절합니다. παρανομεῖν은 율법 위반의 어감을 보존하여 ‘율법을 어기다’로 수정합니다. ‘내 아버지의 하나님’은 원문의 관계 표지를 충실히 보존합니다.
  issues:
