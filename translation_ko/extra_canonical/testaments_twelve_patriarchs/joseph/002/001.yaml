  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ οὗτος [¹ὁ ἀρχιμάγειρος Φαραὼ]¹ ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/001.yaml
  text: And this man, the captain of Pharaoh's guard, entrusted his house to me.
translation:
  language: ko
  text: 그리고 이 사람, 곧 바로의 경호대장은 자기 집안을 제게 맡겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바로의 경호대장’은 여기서 사용한 그리스어 판본에서 대괄호 안에 제시되어 있습니다.
    reason: 원전 제시문의 대괄호 처리를 보존하여 해당 직함의 본문상 지위를 투명하게 표시합니다.
lexical_decisions:
- source_word: ἐπίστευσέ μοι
  english_pob_choice: entrusted ... to me
  chosen_korean: 내게 맡겼습니다
  alternatives_korean:
  - 내게 신뢰했습니다
  - 내게 맡겨 주었습니다
  lexicon: πιστεύω
  rationale: 여기서는 단순한 ‘믿다’보다, 사람에게 업무와 책임을 넘겨 준 뜻이므로 ‘맡기다’가 영어 POB의 ‘entrusted’와 원문 둘 다에 가장 가깝습니다.
- source_word: τὸν οἶκον αὐτοῦ
  english_pob_choice: his house
  chosen_korean: 자기 집안을
  alternatives_korean:
  - 자기 집을
  - 그의 집을
  lexicon: οἶκος
  rationale: οἶκος는 건물만이 아니라 가정·식솔·가문을 함께 가리킬 수 있어, 문맥상 관리 대상인 ‘집안’을 택했습니다.
- source_word: '[ὁ ἀρχιμάγειρος Φαραὼ]'
  english_pob_choice: the captain of Pharaoh's guard
  chosen_korean: 바로의 경호대장으로서
  alternatives_korean:
  - 바로의 친위대장으로서
  - 바로의 시종장으로서
  lexicon: ἀρχιμάγειρος
  rationale: 주석에 있는 설명어를 본문 의미에 반영하되, 군사적·궁정적 직책을 함께 살릴 수 있는 ‘경호대장’을 사용했습니다.
theological_decisions:
- issue: 문두 접속사와 지시대명사 처리
  chosen_reading: ‘그리고 바로 이 사람은’으로 시작해 앞 이야기와의 연속성과 인물 지시를 분명히 했습니다.
  alternative_readings:
  - ‘이 사람은’으로 단순화
  - ‘그리고 이 사람은’
  rationale: 원문의 καὶ οὗτος는 단순 접속이면서 지시 기능을 함께 가지므로, 한국어에서도 연속성과 강조를 함께 드러내는 방식이 가장 자연스럽습니다.
  doctrine_reference: 문맥 연속성 및 서술 지시
