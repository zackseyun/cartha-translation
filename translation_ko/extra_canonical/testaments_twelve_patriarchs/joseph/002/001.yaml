- from: 그리고 바로 이 사람은 바로바로의 경호대장으로서 자기 집안을 내게 맡겼습니다.[a]
  to: 그리고 이 사람, 곧 바로의 경호대장은 자기 집안을 제게 맡겼습니다.[a]
  rationale: 중복된 ‘바로’를 바로잡고, καὶ οὗτος는 ‘그리고 이 사람, 곧’으로 자연스럽게 옮겼습니다. 영어 POB가 채택한 직함 번역은 유지하되, 그리스어 판본에서 그 표현이 대괄호 안에 있다는 점을 각주로 밝혔습니다.
