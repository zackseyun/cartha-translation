id: T12P.JOS.13.2
reference: Testament of Joseph 13:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὁ δὲ μετάβολος πεσὼν εἰς τοὺς πόδας αὐτοῦ¹³ *ἐδέετο λέγων¹⁴· Δέομαί σου¹⁵, κύριε, *οὐκ οἶδα¹⁶ ὃ¹⁷ λέγεις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/002.yaml
  text: But the broker fell at his feet and begged, saying, “I beg you, lord, I do not know what you are saying.”
translation:
  language: ko
  text: 그러나 그 중개인은 그의 발치에 엎드려 간청하며 말했습니다. "주여, 저는 당신이 무슨 말씀을 하시는지 알지 못합니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ μετάβολος
  english_pob_choice: the broker
  chosen_korean: 그 중개인
  alternatives_korean:
  - 그 브로커
  - 중개자
  - 거간꾼
  lexicon: μετάβολος
  rationale: 영어 POB의 'broker'를 따라 중개 역할을 나타내되, 현대 한국어에서 자연스럽고 중립적인 '중개인'으로 옮겼습니다.
- source_word: πεσὼν εἰς τοὺς πόδας αὐτοῦ
  english_pob_choice: fell at his feet
  chosen_korean: 그의 발치에 엎드려
  alternatives_korean:
  - 그의 발 앞에 쓰러져
  - 그의 발에 엎드려
  lexicon: πίπτω + εἰς τοὺς πόδας
  rationale: 직역보다 한국어 서술에 자연스러운 '발치에 엎드려'를 택해, 굴복과 간청의 동작을 살렸습니다.
- source_word: ἐδέετο λέγων· Δέομαί σου, κύριε
  english_pob_choice: begged, saying, “I beg you, lord,”
  chosen_korean: 간청하며 말했습니다. "주여, 저는 당신에게 간청합니다,"
  alternatives_korean:
  - 애원하며 말했습니다. "주님, 간청합니다,"",
  lexicon: δέομαι
  rationale: 두 번 반복되는 간구를 살리기 위해 '간청하다'를 반복 없이 자연스럽게 배치하되, 직접 인용 안에는 동일한 간구성을 보존했습니다.
- source_word: κύριε
  english_pob_choice: lord
  chosen_korean: 주여
  alternatives_korean:
  - 주님
  - 나리
  lexicon: κύριος
  rationale: 문맥상 존칭 호칭이므로 '주여'로 옮겼고, 뒤의 직접 화법 안에서 간청의 공손함을 유지했습니다.
- source_word: οὐκ οἶδα ὃ λέγεις
  english_pob_choice: I do not know what you are saying
  chosen_korean: 저는 당신이 무슨 말씀을 하시는지 알지 못합니다
  alternatives_korean:
  - 저는 무슨 말씀인지 알지 못합니다
  - 제가 무슨 말씀을 하시는지 모르겠습니다
  lexicon: οὐκ οἶδα + ὃ λέγεις
  rationale: 직접 화법의 상대를 분명히 드러내면서도, '무슨 말씀을 하시는지'로 현재적 발화를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 간청하는 직접 화법의 존칭 수준
  chosen_reading: 직접 인용에서 '주여'와 공손한 2인칭 표현('당신')을 사용해 아첨이 아닌 절박한 예의를 드러냈습니다.
  alternative_readings:
  - 주님
  - 당신
  rationale: 그리스어 κύριε와 Δέομαί σου의 공손한 호소를 한국어 합쇼체 안에서 가장 자연스럽게 반영하기 위한 선택입니다.
  doctrine_reference: 수사적 존칭과 서사적 예의의 재현
