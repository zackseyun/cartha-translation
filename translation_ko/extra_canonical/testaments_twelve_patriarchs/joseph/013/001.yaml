id: T12P.JOS.13.1
reference: Testament of Joseph 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὁ δὲ ⌜Πεντεφρὶς¹⁾ πεισθεὶς² τοῖς λόγοις ⌜αὐτῆς¹³ ἐκέλευσεν⁴ †ἐλθεῖν⁵ τὸν μετάβολον, *καὶ λέγει αὐτῷ⁶· *Τί τοῦτο ὃ ἀκούω ⌜περί σου¹⁷, ὅτι κλέπτεις⁸ ψυχὰς⁹ ἐκ γῆς¹⁰ Χαναάν¹¹, *καὶ εἰς παῖδας μεταπωλεῖς¹²;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/001.yaml
  text: But Pentephris, persuaded by her words, ordered the broker to come, and said to him, “What is this that I hear concerning you, that you steal souls from the land of Canaan and sell them as slaves?”
translation:
  language: ko
  text: 그런데 페테프리스는 그녀의 말에 설득되어 중개인을 오라고 명하고, 그에게 이렇게 말했습니다. “내가 당신에 대해 듣는 이게 무엇입니까? 당신은 가나안 땅에서 영혼들을 훔쳐 와서 노예로 되팝니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρὶς
  english_pob_choice: Pentephris
  chosen_korean: 페테프리스
  alternatives_korean:
  - 펜테프리스
  - 페테프리스
  lexicon: 고유명사
  rationale: 헬라어 고유명사를 현대 외래어 표기 감각에 맞춰 옮겼으며, 본문의 인물 식별을 위해 음역을 유지했습니다.
- source_word: ἐκέλευσεν ἐλθεῖν
  english_pob_choice: ordered the broker to come
  chosen_korean: 중개인을 오라고 명하고
  alternatives_korean:
  - 중개인을 불러오라고 명하고
  - 중개인이 오게 하라고 명하고
  lexicon: 동사구
  rationale: ἐλθεῖν의 기본값은 ‘오다’이므로, POB의 의미를 살리되 한국어 명령문으로 자연스럽게 옮겼습니다.
- source_word: κλέπτεις ψυχὰς
  english_pob_choice: you steal souls
  chosen_korean: 영혼들을 훔쳐 와서
  alternatives_korean:
  - 혼들을 훔쳐 와서
  - 목숨들을 훔쳐 와서
  lexicon: ψυχή
  rationale: ψυχάς를 POB처럼 ‘souls’에 대응시키되, 한국어에서는 복수성과 생동감을 살려 ‘영혼들’로 옮겼습니다.
- source_word: μεταπωλεῖς εἰς παῖδας
  english_pob_choice: sell them as slaves
  chosen_korean: 노예로 되팝니다
  alternatives_korean:
  - 노예로 팝니다
  - 종으로 팔아넘깁니다
  lexicon: παῖς
  rationale: 본문의 παῖδας는 문맥상 노예 상태를 가리키므로, POB의 ‘slaves’를 따라 ‘노예’로 구체화했습니다.
theological_decisions:
- issue: ψυχάς를 문자적으로 ‘영혼들’로 유지할지 여부
  chosen_reading: 본문의 강한 표현을 살려 ‘영혼들’로 유지했습니다.
  alternative_readings:
  - 사람들을
  - 목숨들을
  rationale: 이 구절은 인간을 단순한 물건이 아니라 영혼으로 묘사하는 과장적이고 윤리적으로 충격적인 표현을 사용하므로, 이를 완화하지 않고 그대로 드러내는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 인간의 영적 존엄성과 착취 비판의 수사
- issue: μεταπωλεῖς의 의미를 ‘되팝니다’로 처리할지 여부
  chosen_reading: ‘되팝니다’로 옮겨 재판매의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 팝니다
  - 다시 팝니다
  rationale: POB 개정에서 ‘again’이 불필요하다고 정리된 점을 반영하되, μεταπωλεῖς의 재판매/전매 느낌은 한국어 동사 ‘되팝니다’가 가장 간결하게 전달합니다.
  doctrine_reference: 서사적 의미 보존
