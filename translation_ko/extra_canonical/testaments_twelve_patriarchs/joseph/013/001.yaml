revisions:
- from: 그런데 페테프리스는 그녀의 말에 설득되어 중개인을 오라고 명하고, 그에게 이렇게 말했습니다. “내가 당신에 대해 듣는 이게 무엇입니까? 당신은 가나안 땅에서 영혼들을 훔쳐 와서 노예로 되팝니다.”[a]
  to: 그런데 펜테프리스는 그녀의 말에 설득되어 중개인에게 오라고 명한 뒤, 그에게 말했습니다. “내가 너에 관하여 듣는 이것이 무엇입니까? 네가 가나안 땅에서 사람들을 훔쳐 내어 노예로 판다니?”
  rationale: The revision preserves the Greek sequence and accusation while using idiomatic modern formal-polite Korean. It avoids adding ‘again’ to μεταπωλεῖς, renders ψυχάς according to its contextual sense of persons, restores the question’s syntactic force, and removes the unpaired footnote marker.
  reviewer_model: gpt-5.6-terra
