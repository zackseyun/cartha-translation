- from: 그러나 그는 그를 믿지 않았습니다. 오히려 벌거벗긴 채 매질하라고 명령했습니다. 그리고 그가 이 말들을 계속하자, 펜테프리스가 말했습니다. 「그러면 그 젊은이를 데려오십시오」[a]
  to: 그러나 그는 그를 믿지 않았습니다. 오히려 그를 벌거벗긴 채 매질하라고 명령했습니다. 그가 이러한 말을 계속 고집하자, 펜테프리스가 말했습니다. “그러면 그 젊은이를 데려오게 하십시오.”
  rationale: 목적어를 보충하여 벌거벗긴 채 매질당하는 사람이 누구인지 명확히 했습니다. 지속적으로 같은 주장을 하는 ἐπιμένω의 의미를 ‘계속 고집하자’로 옮겼고, 수동 명령 Ἐναχθήτω를 ‘데려오게 하십시오’로 반영했습니다. 대응 각주가 없는 [a]는 삭제했습니다.
