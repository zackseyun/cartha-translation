source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὁ δὲ οὐκ²⁷ ἐπίστευσεν αὐτῷ²⁸, ἀλλ’ ἐκέλευσεν γυμνὸν τύπτεσθαι²⁹. Ἐπιμένοντος δὲ αὐτοῦ *τούτοις τοῖς λόγοις³⁰, λέγει³¹ *ὁ Πεντεφρής³²· Ἐναχθήτω³³ οὖν³⁴ ὁ νεανίσκος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/004.yaml
  text: But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”
translation:
  language: ko
  text: 그러나 그는 그를 믿지 않았습니다. 오히려 그를 벌거벗긴 채 매질하라고 명령했습니다. 그가 이러한 말을 계속 고집하자, 펜테프리스가 말했습니다. “그러면 그 젊은이를 데려오게 하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστευσεν
  english_pob_choice: did not believe him
  chosen_korean: 믿지 않았습니다
  alternatives_korean:
  - 신뢰하지 않았습니다
  - 그 말을 받아들이지 않았습니다
  lexicon: πιστεύω
  rationale: 주어의 반응을 가장 직접적으로 살려, 단순한 지적 판단보다 상대의 말을 받아들이지 않는 뜻을 자연스럽게 드러냈습니다.
- source_word: γυμνὸν τύπτεσθαι
  english_pob_choice: beaten naked
  chosen_korean: 벌거벗긴 채 매질하라고
  alternatives_korean:
  - 알몸으로 매질하라고
  - 벌거벗긴 채 때리라고
  lexicon: γυμνός + τύπτω
  rationale: γυμνὸν을 상태부사구로 살려 ‘벌거벗긴 채’로 옮기고, τύπτεσθαι는 문맥상 공개적 구타를 뜻하므로 ‘매질하라’로 옮겼습니다.
- source_word: ὁ νεανίσκος
  english_pob_choice: the young man
  chosen_korean: 그 젊은이
  alternatives_korean:
  - 그 소년
  - 그 청년
  lexicon: νεανίσκος
  rationale: 연령과 신분을 과도하게 특정하지 않도록 중립적인 ‘젊은이’를 택했습니다.
theological_decisions:
- issue: 직접화법의 명령형 처리
  chosen_reading: Pentephris의 말은 보고체에서 인용부호 안 명령으로 옮기고, 한국어 명령법은 공손한 요청형으로 처리했습니다.
  alternative_readings:
  - 직역형 명령문으로 마침표 처리
  - 더 거친 구어 명령으로 처리
  rationale: 서술은 합쇼체를 유지하되, 인용문 안에서는 인물의 발화를 자연스럽게 보존해 원문의 긴박함을 살렸습니다.
  doctrine_reference: 번역 शैली 및 담화 재현 원칙
