source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὁ δὲ εἶπε⁴⁷· Πῶς αὐτῶν ἐγένου⁴⁸ δοῦλος; καὶ⁴⁹ εἶπον· Ὅτι ἐκ γῆς⁵⁰ Χαναὰν ἐπριάσαντό⁵¹ με.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/008.yaml
  text: But he said, “How did you become their slave?” And I said, “They bought me from the land of Canaan.”
translation:
  language: ko
  text: 그러자 그가 말했습니다. “어떻게 그들의 종이 되었습니까?” 내가 말했습니다. “그들이 나를 가나안 땅에서 사들였습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종살이하는 사람
  lexicon: δοῦλος
  rationale: 영어 POB가 ‘slave’로 분명히 신분의 종속성을 드러내고 있지만, 본문은 서술적 질문 속 표현이므로 한국어에서는 본문 전체의 문체를 해치지 않는 기본 대응어 ‘종’을 택했습니다.
- source_word: ἐπριάσαντό με
  english_pob_choice: They bought me
  chosen_korean: 나를 사들였습니다
  alternatives_korean:
  - 나를 샀습니다
  - 나를 매입했습니다
  lexicon: πριάομαι
  rationale: 구매 행위를 직접적으로 나타내는 동사이므로 ‘사들였습니다’가 가장 자연스럽고 원문의 거래 의미를 선명하게 반영합니다.
- source_word: ἐκ γῆς Χαναάν
  english_pob_choice: from the land of Canaan
  chosen_korean: 가나안 땅에서
  alternatives_korean:
  - 가나안 땅으로부터
  - 가나안에서
  lexicon: γῆ / Χαναάν
  rationale: ‘땅(land)’의 지리적 출처를 한국어 관용에 맞게 ‘가나안 땅에서’로 옮겨, 단순한 출발점이 아니라 원출처 지역을 함께 드러냈습니다.
theological_decisions:
- issue: δοῦλος의 신분 뉘앙스
  chosen_reading: 가나안 사람들에게 속박된 신분을 드러내는 ‘종’으로 번역했습니다.
  alternative_readings:
  - 노예로 번역해 강한 소유·강제성까지 드러냄
  - 일꾼으로 완화해 번역함
  rationale: 이 문맥은 자발적 고용이 아니라 매매로 얻어진 소속 상태를 말하므로, 완화하지 않고 신분적 종속을 유지해야 합니다. 다만 한국어 합쇼체 흐름을 위해 기본어 ‘종’을 사용했습니다.
  doctrine_reference: 문맥상 신분 종속성 유지
