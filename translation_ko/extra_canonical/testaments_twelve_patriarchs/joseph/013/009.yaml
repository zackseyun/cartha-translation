source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Εἶπε δὲ πρός με⁵²· ⌜Ὄντως⌉⁵³ ψεύδῃ⁵⁴. Καὶ ⌜εὐθὺς⌉⁵⁵ *ἐκέλευσε κἀμὲ γυμνὸν⁵⁶ τύπτεσθαι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/009.yaml
  text: But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked and beaten.
translation:
  language: ko
  text: 그러자 그가 내게 말했습니다. 「정말 네가 거짓말을 하고 있구나」. 그리고 그는 곧바로 나에게도 옷을 벗긴 채 매질하라고 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὄντως ψεύδῃ
  english_pob_choice: You are truly lying.
  chosen_korean: 「정말 네가 거짓말을 하고 있구나」
  alternatives_korean:
  - 「네가 참으로 거짓말하고 있다」
  - 「정말로 거짓말을 하고 있군」
  lexicon: ὄντως / ψεύδῃ
  rationale: Ὄντως는 단순 강조부사이므로 「정말」로 살리고, ψεύδῃ는 현재적 진술로 「거짓말을 하고 있구나」라고 옮겨 직접화법의 공격적 뉘앙스를 드러냈습니다.
- source_word: Καὶ εὐθὺς
  english_pob_choice: And immediately
  chosen_korean: 그리고 그는 곧바로
  alternatives_korean:
  - 그리고 즉시
  - 그러자 곧
  lexicon: εὐθύς
  rationale: εὐθὺς의 신속성을 「곧바로」로 자연스럽게 옮기되, 서술 연결은 「그리고」로 유지했습니다.
- source_word: ἐκέλευσε
  english_pob_choice: he ordered
  chosen_korean: 명령했습니다
  alternatives_korean:
  - 지시했습니다
  - 시켰습니다
  lexicon: κελεύω
  rationale: ἐκέλευσε는 권위 있는 명령의 의미이므로, 문맥상 강압성을 분명히 하는 「명령했습니다」가 가장 직접적입니다.
- source_word: γυμνὸν τύπτεσθαι
  english_pob_choice: to be stripped naked and beaten
  chosen_korean: 옷을 벗긴 채 매질하라고
  alternatives_korean:
  - 벌거벗긴 채 때리라고
  - 나체로 두들겨 패라고
  lexicon: γυμνός / τύπτω
  rationale: γυμνός는 상태를 드러내는 「옷을 벗긴 채」로, τύπτεσθαι는 반복적 폭행을 나타내는 「매질하다」로 옮겨 신체적 모욕과 폭력을 함께 보존했습니다.
theological_decisions:
- issue: 폭력적 서술의 직설성
  chosen_reading: 가해의 강도를 완화하지 않고 「옷을 벗긴 채 매질하라」는 식으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 부드럽게 하여 「벌을 주다」로 완화
  - 문화적으로 완곡하게 처리
  rationale: 원문과 영어 POB 모두 강제적 수치심과 폭력을 분명히 하므로, 독자의 충격을 줄이기보다 서술의 윤리적 무게를 유지하는 것이 적절합니다.
  doctrine_reference: 서술 윤리와 본문 충실성
