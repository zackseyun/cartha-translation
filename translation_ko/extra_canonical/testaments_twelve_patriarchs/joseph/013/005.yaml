  source_fidelity: 원문의 수동 분사 εἰσαχθείς는 ‘인도되어 들어가다’로, προσεκύνησα는 궁정의 예우 행위인 ‘절하다’로 옮기는 것이 적절합니다. τρίτος ἐν ἀξιώματι는 통치 권한 자체가 아니라 관리들 사이의 서열·지위를 뜻하므로 ‘서열이 셋째’로 명시하는 편이 충실합니다.
