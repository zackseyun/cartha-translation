  text: And when I was brought in, I bowed down to Pentephris, for he was third in rank among Pharaoh’s rulers.
translation:
  language: ko
  text: 내가 안으로 인도되었을 때, 나는 펜테프레에게 절했습니다. 그는 파라오의 관리들 가운데서 서열이 셋째였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσαχθεὶς
  english_pob_choice: when I was brought in
  chosen_korean: 내가 안으로 인도되었을 때
  alternatives_korean:
  - 들여보내졌을 때
  - 데려가졌을 때
  lexicon: εἰσάγω
  rationale: 수동 분사로서 ‘인도되다/들이다’의 의미를 살리고, 장면의 진입 동작을 자연스럽게 표현했습니다.
- source_word: προσεκύνησα
  english_pob_choice: I bowed down
  chosen_korean: 절했습니다
  alternatives_korean:
  - 몸을 굽혔습니다
  - 경배했습니다
  lexicon: προσκυνέω
  rationale: 공적인 예배보다 예우의 몸짓을 가리키는 문맥이므로, 현대 한국어에서 가장 자연스러운 ‘절하다’를 택했습니다.
- source_word: τῷ Πεντεφρῇ
  english_pob_choice: to Pentephris
  chosen_korean: 페네프레에게
  alternatives_korean:
  - 펜테프레에게
  - 페테프리에게
  lexicon: Πεντεφρῆς
  rationale: 고유명사는 현대 한국어 음역으로 옮기되, 본문의 인물명을 그대로 식별 가능하게 했습니다.
- source_word: ἐν ἀξιώματι
  english_pob_choice: in rank
  chosen_korean: 통치자들 가운데서
  alternatives_korean:
  - 직분에서
  - 신분상
  lexicon: ἀξίωμα
  rationale: 직접적으로는 ‘지위/위상’이지만, 뒤의 ‘바로의 통치자들’과 결합해 서열을 드러내므로 관계적 표현으로 풀었습니다.
theological_decisions:
- issue: ‘bowed down’의 예우성 여부
  chosen_reading: 이 절의 동작은 종교적 숭배라기보다 궁정 예우로 읽고 ‘절했습니다’로 번역했습니다.
  alternative_readings:
  - 경배했습니다
  - 몸을 굽혔습니다
  rationale: 문맥상 파라오의 관원에게 행한 인사이므로, 숭배어휘를 과도하게 강화하지 않고도 존중의 동작을 유지하는 번역이 적절합니다.
  doctrine_reference: 문맥 우선 원칙
