  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ λέγει αὐτῷ ὁ Πεντεφρής¹⁸· Πόθεν ⌜οὖν⌉ *ἐστιν ὁ παῖς¹⁹ ὁ Ἑβραῖος²⁰; καὶ²¹ εἶπεν²²· Οἱ²³ Ἰσμαηλῖται παρέθεντό²⁴ μοι αὐτόν, ἕως ὅτου²⁵ ἐπιστρέψωσιν²⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/003.yaml
  text: And Pentephris said to him, “From where, then, is this Hebrew boy?” And he said, “The Ishmaelites entrusted him to me until they return.”
translation:
  language: ko
  text: 그리고 페텐프리스가 그에게 말했습니다. 「그런데 이 히브리 소년은 어디서 온 사람이냐?」 그리고 그가 말했습니다. 「이스마엘 사람들이 그를 내게 맡겨 두었는데, 그들이 돌아올 때까지입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρής
  english_pob_choice: Pentephris
  chosen_korean: 페텐프리스
  alternatives_korean:
  - 펜테프리스
  - 페테프리스
  lexicon: 고유명사
  rationale: 그리스어 음가에 가깝게 옮기되, 한국어 외래어 표기에서 무리 없는 형태를 택했습니다.
- source_word: Πόθεν ⌜οὖν⌉
  english_pob_choice: From where, then
  chosen_korean: 그런데 … 어디서 온 사람이냐
  alternatives_korean:
  - 그런즉 … 어디에서냐
  - 그렇다면 … 어디서 왔느냐
  lexicon: 의문 부사/담화 표지
  rationale: οὖν의 연결감을 살리면서도 한국어에서 자연스러운 추궁의 말투로 옮겼습니다.
- source_word: ὁ παῖς ὁ Ἑβραῖος
  english_pob_choice: this Hebrew boy
  chosen_korean: 이 히브리 소년
  alternatives_korean:
  - 이 히브리 아이
  - 이 히브리 종
  lexicon: παῖς / Ἑβραῖος
  rationale: παῖς는 문맥상 나이 어린 아들을 가리키는 표현으로 보이며, 본문이 여기서는 소년이라는 연령 표지가 가장 직접적입니다. 영어 POB도 slave로 과도하게 확대하지 않았으므로 그 어휘를 따르지 않았습니다.
- source_word: παρέθεντό μοι αὐτόν
  english_pob_choice: entrusted him to me
  chosen_korean: 그를 내게 맡겨 두었는데
  alternatives_korean:
  - 그를 내게 맡겼는데
  - 그를 내게 부탁해 두었는데
  lexicon: παρατίθημι
  rationale: 단순한 인계가 아니라 일정 기간 보관을 맡긴 뉘앙스를 살려 ‘맡겨 두다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 신분 표지를 어떻게 처리할 것인가
  chosen_reading: 이 구절은 그를 직접 ‘노예’로 규정하기보다 ‘소년’이라고 부르는 서술을 따랐습니다.
  alternative_readings:
  - ‘히브리 노예’
  - ‘히브리 종’
  rationale: 그리스어 본문은 παῖς를 사용하며, 제공된 영어 POB도 최종본에서 ‘Hebrew boy’로 정리되어 있어 신분을 확대 해석하지 않는 것이 소스에 충실합니다.
  doctrine_reference: 문맥적 의미 우선
