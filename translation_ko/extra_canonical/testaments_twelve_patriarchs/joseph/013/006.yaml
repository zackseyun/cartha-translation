  text: And after separating me from him, he said to me, “Are you a slave or free?” And I said, “A slave.”
translation:
  language: ko
  text: 그리고 그가 나를 그에게서 떼어 놓고 나서 내게 말하였습니다. "네가 종이냐, 아니면 자유인이냐?" 그러자 내가 말하였습니다. "종입니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종들
  lexicon: δοῦλος
  rationale: 이 절의 영어 POB가 "slave"를 택해 종속된 신분을 드러내지만, 한국어 본문은 현대 합쇼체의 가독성과 본문의 직접성을 함께 살리기 위해 기본 대응어인 "종"을 사용했습니다. 대화체 속 자기 규정이므로 과도하게 해설적으로 만들지 않았습니다.
- source_word: ἐλεύθερος
  english_pob_choice: free
  chosen_korean: 자유인
  alternatives_korean:
  - 자유로운 사람
  - 자유자
  lexicon: ἐλεύθερος
  rationale: 문맥상 단순한 심리적 자유가 아니라 신분 대조이므로 "자유인"이 "종"과 가장 또렷한 대구를 이룹니다.
- source_word: Καὶ διαχωρίσας με ἀπ᾿ αὐτοῦ
  english_pob_choice: And after separating me from him
  chosen_korean: 그리고 그가 나를 그에게서 떼어 놓고 나서
  alternatives_korean:
  - 그리고 나를 그에게서 갈라놓고
  - 그리고 나를 그와 분리하고 나서
  lexicon: διαχωρίζω
  rationale: 분리의 동작을 직접적으로 살리되, 한국어에서 자연스러운 서술 흐름을 위해 "떼어 놓다"를 선택했습니다.
theological_decisions:
- issue: 자기 신분을 묻는 질문과 대답의 직설성
  chosen_reading: 예수/인물이 묻는 신분 대조를 완곡하게 누그러뜨리지 않고 그대로 재현했습니다.
  alternative_readings:
  - '"종이냐, 자유인이냐"를 "종입니까, 자유인입니까"로 완화'
  - '"노예"로 더 강하게 표기'
  rationale: 원문은 두 상태를 날카롭게 대조하며, POB의 영어도 이를 유지합니다. 한국어에서도 그 긴장을 보존하는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 사회적 신분/종속 표현의 직접 번역 원칙
