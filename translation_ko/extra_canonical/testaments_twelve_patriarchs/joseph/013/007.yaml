lexical_decisions:
- source_word: Τίνος;
  english_pob_choice: Whose?
  chosen_korean: 「누구의 것입니까?」
  alternatives_korean:
  - 「누굽니까?」
  - 「누구의 것인가요?」
  lexicon: τίς / τίνος
  rationale: 소유를 묻는 짧은 질문이므로 한국어에서도 직접적인 소유격 질문으로 옮기되, 합쇼체의 자연스러운 형태를 택했습니다.
- source_word: Τῶν Ἰσμαηλιτῶν
  english_pob_choice: The Ishmaelites’
  chosen_korean: 「이스마엘 사람들의 것입니다」
  alternatives_korean:
  - 「이스마엘인들의 것입니다」
  - 「이스마엘 사람들 것입니다」
  lexicon: Ἰσμαηλῖται
  rationale: 소속·소유 관계를 분명히 하기 위해 ‘~들의 것입니다’로 풀어, 영어 POB의 소유격 뉘앙스를 유지했습니다.
