revisions:
- from: '1[a]. 그런데 그녀가 올 때마다, 그녀는 내가 어찌 주님께 감사하고 어둠의 집에서 찬송하는지를 엿들었습니다. 나는 기쁜 목소리로 즐거워하며 내 하나님을 찬양했는데, 그것은 핑계 덕분에 내가 이집트 여인에게서 벗어났기 때문입니다. 그녀는 여러 번 내게 사람을 보내어 말했습니다. “내 욕망을 채워 주겠다고 동의하십시오. 그러면 내가 당신을 당신의 사슬에서 풀어 주고, 어둠에서 해방시켜 주겠습니다.”


    2[b]. 그러나 나는 생각으로조차 그녀에게로 기울지 않았습니다. 하나님은 어둠의 구덩이 속에서 절제 가운데 신실한 자를, 창고들 가운데서 왕처럼 사치와 불법을 함께 누리는 자보다 더 사랑하십니다.


    3. 그러나 사람이 절제 가운데 살면서도, 지극히 높으신 분께서 그에게도 영광이 마땅하다고 아시면, 그분은 그것까지도 나에게 하신 것처럼 그에게 주십니다.


    4. 그녀가 아팠지만 부적절한 때에 얼마나 자주 나에게 내려와, 내가 기도할 때 내 목소리를 들었는지 모릅니다. 그리고 나는 그녀의 신음 소리를 알아차리고는 잠잠히 있었습니다.


    5. 내가 그녀의 집에 있을 때는, 그녀가 자기 팔과 다리를 드러내어 내가 그녀에게 빠지게 하려 했습니다. 그녀는 참으로 매우 아름다웠고, 내 속임을 위해 특히 단장되어 있었습니다[c]. 그러나 주님께서 그녀의 계략에서 나를 지키셨습니다.'
  to: '1[a]. 내가 결박되어 있을 때, 이집트 여인은 슬픔에 사로잡혀 있었습니다. 그녀는 와서 내가 어떻게 주님께 감사드리고 어둠의 집에서 찬송하는지를 엿들었습니다. 나는 기쁜 목소리로 즐거워하며 내 하나님을 찬양했습니다. 구실로 내가 이집트 여인에게서 벗어나게 되었기 때문입니다. 그녀는 여러 번 내게 보내어 말했습니다. “내 욕망을 이루어 주십시오. 그러면 내가 당신을 사슬에서 풀어 주고, 어둠에서 해방시켜 주겠습니다.”


    2[b]. 그러나 나는 생각으로조차 그녀에게 기울지 않았습니다. 하나님께서는 어둠의 구덩이에서 절제 가운데 신실한 사람을, 창고들 안에서 왕으로서 방탕을 누리는 사람보다 더 사랑하십니다.


    3. 그러나 어떤 사람이 절제 가운데 살며 영광도 바랄 때, 지극히 높으신 분께서 그것이 그에게 마땅하다고 아시면, 나에게도 그러하셨듯이 그에게도 그것을 주십니다.


    4. 그녀가 병들어 있었는데도 때 아닌 시간에 얼마나 자주 내게 내려와, 내가 기도하는 목소리를 들었는지 모릅니다. 나는 그녀의 신음을 알아차리고도 잠잠히 있었습니다.


    5. 내가 그녀의 집에 있을 때, 그녀는 내가 그녀에게 넘어가게 하려고 자기 팔과 정강이를 드러내곤 했습니다. 그녀는 매우 아름다웠고, 나를 속이려고 특히 꾸미고 있었습니다[c]. 그러나 주님께서 그녀의 계략에서 나를 지키셨습니다.'
  rationale: 원문에 있는 9:1의 이어지는 문장을 복원하고, 9:3의 ‘영광도 바라다’를 반영했습니다. 난해한 9:2의 대비는 본문에서 과도하게 해석하지 않고 주석으로 불확실성을 밝혔습니다. 9:5의 유혹 장면은 원문의 완곡한 성적 표현을 노골화하지 않으면서도 자연스러운 한국어로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
