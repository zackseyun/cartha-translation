review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 IX:1 앞에 이어지는 원문의 문장(요셉이 결박되어 있는 동안 이집트 여인이 슬픔에 사로잡혔다는 내용)을 누락했고, 9:3의 ‘영광도 바라면’(θέλει καὶ δόξαν)을 빠뜨렸습니다. 또한 9:2의 ἀκολασία는 이 문맥에서 단순한 ‘불법’보다 ‘방탕’이 자연스럽고, 9:5의 성적 완곡 표현은 한국어에서도 과도한 해설 없이 유혹의 뜻이 드러나도록 다듬는 편이 좋습니다.
  naturalness: 합쇼체의 격식은 대체로 유지되었으나, ‘내게 사람을 보내어’는 원문에 없는 ‘사람’을 보태며, ‘핑계 덕분에’와 ‘내 속임을 위해’는 어색하거나 의미가 불분명합니다. ‘구실로 … 벗어나게 되었기’와 ‘나를 속이려고’가 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘주님’, ‘하나님’, ‘지극히 높으신 분’, ‘절제’는 일관되고 적절합니다. σωφροσύνη를 ‘절제’로 옮긴 선택을 유지합니다. 9:2의 δύσ해한 왕/창고 대조는 특정 해석을 확정하지 않도록 본문과 주석에서 신중히 보존합니다.
  issues:
  - severity: high
    issue: 9:1의 결박과 이집트 여인의 슬픔에 관한 이어지는 원문 문장이 누락되었습니다.
    rationale: 제시된 그리스어는 ‘내가 결박되어 있을 때 이집트 여인은 슬픔에 사로잡혀 있었다’로 시작합니다. 영어 감사본이 이를 생략했더라도 원문 우선 원칙상 한국어 본문에 반영해야 합니다.
  - severity: high
    issue: 9:3에서 ‘영광도 바라면’이라는 조건이 누락되었습니다.
