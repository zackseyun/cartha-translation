base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009.yaml
  text: '1[a]. But when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and with a cheerful voice, rejoicing, I glorified my God because by a pretext I had been delivered from the Egyptian woman. Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.”


    2[b]. But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.


    3. But if one lives in self-control, and the Most High knows that glory also is fitting for him, he grants that too to him, as also to me.


    4. How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.


    5. For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned for my deception[c]. But the Lord guarded me from her schemes.'
  footnotes:
  - marker: a
    text: The phrase 'house of darkness' likely refers to Joseph's place of confinement; the Greek preserves the imagery of darkness rather than naming a prison directly.
    reason: cultural_note
    anchor_ref: '9:1'
  - marker: b
    text: 'The Greek contrast is difficult: literally something like ''the faithful one in a pit of darkness in self-control'' versus ''the king in storerooms living luxuriously with lawlessness.'''
    reason: textual_variant
    anchor_ref: '9:2'
  - marker: c
    text: '''Legs'' translates a term more specifically meaning the lower legs or shins.'
    reason: lexical_alternative
    anchor_ref: '9:5'
translation:
  language: ko
  text: '1[a]. 그런데 그녀가 올 때마다, 그녀는 내가 어찌 주님께 감사하고 어둠의 집에서 찬송하는지를 엿들었습니다. 나는 기쁜 목소리로 즐거워하며 내 하나님을 찬양했는데, 그것은 핑계 덕분에 내가 이집트 여인에게서 벗어났기 때문입니다. 그녀는 여러 번 내게 사람을 보내어 말했습니다. “내 욕망을 채워 주겠다고 동의하십시오. 그러면 내가 당신을 당신의 사슬에서 풀어 주고, 어둠에서 해방시켜 주겠습니다.”


    2[b]. 그러나 나는 생각으로조차 그녀에게로 기울지 않았습니다. 하나님은 어둠의 구덩이 속에서 절제 가운데 신실한 자를, 창고들 가운데서 왕처럼 사치와 불법을 함께 누리는 자보다 더 사랑하십니다.


    3. 그러나 사람이 절제 가운데 살면서도, 지극히 높으신 분께서 그에게도 영광이 마땅하다고 아시면, 그분은 그것까지도 나에게 하신 것처럼 그에게 주십니다.


    4. 그녀가 아팠지만 부적절한 때에 얼마나 자주 나에게 내려와, 내가 기도할 때 내 목소리를 들었는지 모릅니다. 그리고 나는 그녀의 신음 소리를 알아차리고는 잠잠히 있었습니다.


    5. 내가 그녀의 집에 있을 때는, 그녀가 자기 팔과 다리를 드러내어 내가 그녀에게 빠지게 하려 했습니다. 그녀는 참으로 매우 아름다웠고, 내 속임을 위해 특히 단장되어 있었습니다[c]. 그러나 주님께서 그녀의 계략에서 나를 지키셨습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηκροᾶτό
  english_pob_choice: would listen in on
  chosen_korean: 엿들었습니다
  alternatives_korean:
  - 몰래 들었습니다
  - 귀를 기울여 들었습니다
  lexicon: LSJ
  rationale: 반복적·은밀한 청취를 나타내는 뉘앙스를 살리되, 한국어에서 자연스러운 감시성 표현인 ‘엿듣다’로 옮겼습니다.
- source_word: ἐν οἴκῳ τοῦ σκότους / ἐκ τοῦ σκότους
  english_pob_choice: in the house of darkness / from the darkness
  chosen_korean: 어둠의 집 / 어둠에서
  alternatives_korean:
  - 감옥 / 감옥에서
  - 어두운 집 / 어둠 속에서
  lexicon: LSJ
  rationale: 본문은 명시적으로 ‘감옥’이 아니라 ‘어둠’을 말하므로, POB의 이미지 보존 방침에 따라 어둠을 유지했습니다.
- source_word: ἱλαρᾷ φωνῇ
  english_pob_choice: with a cheerful voice
  chosen_korean: 기쁜 목소리로
  alternatives_korean:
  - 즐거운 목소리로
  - 명랑한 목소리로
  lexicon: LSJ
  rationale: 감옥/어둠의 정황과 대비되는 긍정적 정서를 간결하게 드러내는 표준어 표현으로 옮겼습니다.
- source_word: διὰ προφάσεως ἀπηλλάγην
  english_pob_choice: by a pretext I had been delivered
  chosen_korean: 핑계 덕분에 내가 ... 벗어났기 때문입니다
  alternatives_korean:
  - 구실 덕분에 내가 ... 풀려났기 때문입니다
  - 핑계로 내가 ... 해방되었기 때문입니다
  lexicon: LSJ
  rationale: πρόφασις의 ‘구실/핑계’ 의미를 살리면서, 구원·해방의 의미도 드러나게 ‘벗어나다’로 옮겼습니다.
- source_word: στεναγμούς
  english_pob_choice: groanings
  chosen_korean: 신음 소리
  alternatives_korean:
  - 탄식
  - 한숨
  lexicon: LSJ
  rationale: 영문 POB가 가볍게 ‘sighs’로 평준화했지만, 그리스어는 더 무거운 신음/탄식의 폭을 허용하므로 애매성을 남기는 ‘신음 소리’가 더 적절합니다.
theological_decisions:
- issue: 지극히 높으신 분의 보상과 보호를 드러내는 신학적 강조
  chosen_reading: 요셉의 절제와 정결을 하나님의 사랑, 지극히 높으신 분의 주심, 주님의 보호와 함께 명시했습니다.
  alternative_readings:
  - 도덕적 자제만 강조하기
  - 섭리 표현을 약화하기
  rationale: 본문은 단순한 자기수양이 아니라 하나님의 사랑과 보호가 요셉의 정절을 지탱한다는 점을 분명히 말하므로, 그 신학적 축을 유지해야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: σωφροσύνη의 번역
  chosen_reading: ‘절제’로 옮기되, 문맥상 성적 정결의 함의를 유지했습니다.
  alternative_readings:
  - 정결
  - 금욕
  - 자기통제
  rationale: 어휘 자체는 넓은 덕목이지만, 이 단락에서는 유혹에 대한 성적 절제를 지칭하므로 ‘절제’가 가장 넓고도 문맥 충실합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
