source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔκλαυσαν¹ οἱ² *υἱοὶ Συμεὼν³ τὸν πατέρα αὐτῶν⁴. Καὶ ἦσαν *εἰς Αἴγυπτον⁵ ἕως ἡμέρας ἐξόδου αὐτῶν⁶ *ἐν χειρὶ Μωϋσῆ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009/001.yaml
  text: And the sons of Simeon wept for their father. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: ko
  text: 그리고 시므온의 아들들은 자기들의 아버지를 위해 울었습니다. 그리고 그들은 모세의 손에 의해 떠나는 날까지 이집트에 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ υἱοὶ Συμεών
  english_pob_choice: the sons of Simeon
  chosen_korean: 시므온의 아들들
  alternatives_korean:
  - 시므온의 아들들
  lexicon: 고유명사
  rationale: γενική 관계를 자연스럽게 옮겨 ‘시므온의 아들들’로 했습니다.
- source_word: ἔκλαυσαν
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 울었읍니다
  lexicon: κλαίω
  rationale: 단순 과거의 ‘wept’를 직역하되, 현대 합쇼체로 자연스럽게 ‘울었습니다’로 옮겼습니다.
- source_word: ἦσαν εἰς Αἴγυπτον
  english_pob_choice: they were in Egypt
  chosen_korean: 이집트에 있었습니다
  alternatives_korean:
  - 이집트에 있었습니다
  - 이집트에 머물러 있었습니다
  lexicon: εἰμί + 전치사구
  rationale: 개정판 영어가 ‘remained’를 ‘were’로 수정한 점을 반영해, 원문의 상태 서술 ἦσαν을 추가 뉘앙스 없이 ‘있었습니다’로 옮겼습니다.
- source_word: ἐν χειρὶ Μωϋσῆ
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손에 의해
  alternatives_korean:
  - 모세의 손으로
  - 모세를 통해
  lexicon: בְּ/ἐν + 손 관용구
  rationale: 행위 매개를 드러내는 관용구를 살리되 한국어로는 가장 직접적인 ‘손에 의해’가 원문 구조를 잘 보여 줍니다.
theological_decisions:
- issue: 출애굽의 주체와 매개
  chosen_reading: ‘모세의 손에 의해’로 번역해, 출애굽이 모세라는 인간 지도자의 도구적 매개를 통해 이루어졌음을 드러냈습니다.
  alternative_readings:
  - ‘모세를 통해’로 완화
  - ‘모세의 인도로’로 의역
  rationale: 원문은 모세를 직접적 행위 주체라기보다 도구적 매개로 제시하므로, 그 긴장을 보존하는 표현을 택했습니다.
  doctrine_reference: 섭리와 인간 매개에 대한 서술적 표현
