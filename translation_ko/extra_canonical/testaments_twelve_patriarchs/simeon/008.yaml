revisions:
- from: '그리고 시므온이 자기 아들들에게 명령하는 일을 마치자, 그는 조상들과 함께 잠들었습니다. 그때 그의 나이는 백이십 세였습니다.


    그리고 그들은 그의 뼈를 헤브론으로 가져가려고 나무 관에 그를 넣었습니다. 그리고 그들은 애굽 사람들의 전쟁 때에 그것을 몰래 가지고 올라갔습니다.


    애굽 사람들은 요셉의 뼈를 왕들의 무덤들에 보관하고 있었는데, 그것을 데려오려 했기 때문입니다. 또 점쟁이들은 그들에게 말하기를, 요셉의 뼈가 나갈 때에는 온 땅에 어둠과 짙은 어둠과 애굽 사람들에게 큰 재앙이 있을 것이어서, 등불을 가지고도 각 사람이 자기 형제를 알아보지 못할 것이라고 했습니다.[a][b][c]'
  to: '그리고 시므온이 자기 아들들에게 명령을 마치고, 조상들과 함께 잠들었습니다. 그때 그의 나이는 백이십 세였습니다.


    그리고 그들은 그의 뼈를 헤브론으로 가져가려고 그를 나무 관에 넣었습니다. 그리고 그들은 애굽 사람들의 전쟁 때에 그 뼈들을 몰래 가지고 올라갔습니다.[b]


    애굽 사람들은 요셉의 뼈[c]를 왕들의 무덤에[a] 보관하고 있었습니다. 주술사들이 그들에게 말하기를, 요셉의 뼈가 나갈 때에는 온 땅에 어둠과 짙은 어둠과 애굽 사람들에게 큰 재앙이 있을 것이어서, 등불을 가지고도 각 사람이 자기 형제를 알아보지 못할 것이라고 하였습니다.'
  rationale: 원문에 없는 3절의 목적·인과절을 제거하여 본문 충실성을 회복했습니다. 복수인 ‘뼈들’을 명시하고, 주술 행위자를 가리키는 용어를 바로잡았으며, 난해한 전승과 압축된 전쟁 표현의 불확실성은 본문에 추정 내용을 넣지 않고 주석으로 보존했습니다. 문체는 현대 표준 한국어 합쇼체로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 3절의 “그것을 데려오려 했기 때문입니다”는 제시된 그리스어 본문에 근거가 없습니다. ἐφύλαττον은 ‘보관하고 있었다/지키고 있었다’이며, 이 문장을 삭제해야 합니다. 2절의 αὐτά는 복수인 ‘뼈들’을 가리키므로 대명사 ‘그것’보다 명시적으로 옮기는 편이 정확합니다. ἐπαοιδοί는 점을 치는 사람이라기보다 주문·주술을 행하는 이들이므로 ‘주술사들’이 더 가깝습니다.
  naturalness: 합쇼체와 전반적 문체는 적절합니다. 다만 ‘명령하는 일을 마치자’는 다소 명사화되어 있으므로 ‘명령을 마치고’가 더 자연스럽습니다. ‘왕들의 무덤들’은 한국어에서 복수 표지가 다소 어색하여 ‘왕들의 무덤’으로 다듬었습니다.
  terminology: ‘잠들었습니다’, ‘조상들과 함께’, ‘나무 관’, ‘큰 재앙’은 본문의 문학적·장례적 어조와 현대 표준 한국어에 적합합니다. σκότος καὶ γνόφος의 강조는 ‘어둠과 짙은 어둠’으로 유지할 수 있습니다. 기존 영문 주석의 앵커는 본문 위치와 맞지 않으므로, 본문 난독은 ‘왕들의 무덤’에, 전쟁 구문의 대안은 해당 구절에, 성경 상호참조는 요셉의 뼈 언급에 각각 배치했습니다.
  issues:
  - severity: high
    issue: 3절에 근거 없는 목적·인과절이 삽입되어 있습니다.
    rationale: ‘애굽 사람들은 … 보관하고 있었는데, 그것을 데려오려 했기 때문입니다’의 후반은 제공된 그리스어(Τὰ γὰρ ὀστᾶ … ἐφύλαττον … ἐν τοῖς μνήμασι τῶν βασιλέων)에 없으며, 의미를 부당하게 추가합니다.
  - severity: medium
    issue: 2절의 복수 대명사 αὐτά가 단수 ‘그것’으로 번역되었습니다.
    rationale: αὐτά는 앞의 τὰ ὀστᾶ(뼈들)를 받으므로 ‘그 뼈들을’로 명시하는 것이 수와 지시 대상을 보존합니다.
  - severity: medium
    issue: ἐπαοιδοί를 ‘점쟁이들’로 옮기면 핵심 의미가 좁아집니다.
    rationale: 이 말은 주로 주문·주술을 행하는 사람을 뜻하므로 ‘주술사들’이 원문의 행위와 더 잘 맞습니다.
  - severity: low
    issue: 주석 앵커의 배치가 영문 감사 기록에서 뒤섞여 있습니다.
    rationale: 본문 난독, 전쟁 구문의 불확실성, 성경 상호참조가 각각 해당 표현에 붙도록 재배치해야 독자가 주석 대상을 분명히 알 수 있습니다.
  revised_text: '그리고 시므온이 자기 아들들에게 명령을 마치고, 조상들과 함께 잠들었습니다. 그때 그의 나이는 백이십 세였습니다.


