base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008.yaml
  text: 'And when Simeon had finished commanding his sons[a], he fell asleep with his fathers, being one hundred and twenty years old.


    And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly during a war of the Egyptians.


    For the Egyptians were keeping the bones of Joseph in the tombs of the kings, so as to bring him up. For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague for the Egyptians[c][b], so that even with a lamp each man would not recognize his brother.'
  footnotes:
  - marker: a
    text: Verse 3 is textually difficult. Some witnesses read 'store-chambers' instead of 'tombs,' yielding 'the Egyptians were keeping Joseph’s bones in the store-chambers of the kings.'
    reason: textual_variant
  - marker: b
    text: The phrase 'they brought them up secretly during a war of the Egyptians' is compressed in Greek and may mean 'in secret during an Egyptian war' or 'during war among the Egyptians.'
    reason: alternative_reading
  - marker: c
    text: Compare Genesis 50:25 and Exodus 13:19 on the carrying up of Joseph’s bones.
    reason: cross_reference
translation:
  language: ko
  text: '그리고 시므온이 자기 아들들에게 명령하는 일을 마치자, 그는 조상들과 함께 잠들었습니다. 그때 그의 나이는 백이십 세였습니다.


    그리고 그들은 그의 뼈를 헤브론으로 가져가려고 나무 관에 그를 넣었습니다. 그리고 그들은 애굽 사람들의 전쟁 때에 그것을 몰래 가지고 올라갔습니다.


    애굽 사람들은 요셉의 뼈를 왕들의 무덤들에 보관하고 있었는데, 그것을 데려오려 했기 때문입니다. 또 점쟁이들은 그들에게 말하기를, 요셉의 뼈가 나갈 때에는 온 땅에 어둠과 짙은 어둠과 애굽 사람들에게 큰 재앙이 있을 것이어서, 등불을 가지고도 각 사람이 자기 형제를 알아보지 못할 것이라고 했습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  english_pob_choice: fell asleep
  chosen_korean: 잠들었습니다
  alternatives_korean:
  - 죽었습니다
  - 숨을 거두었습니다
  lexicon: LSJ
  rationale: 죽음의 완곡 표현을 살려 문학적·성경적 어조를 보존했습니다.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: with his fathers
  chosen_korean: 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 선조들과 함께
  lexicon: LSJ
  rationale: 장례 공식에 가까운 표현이므로 직역보다 한국어에서 자연스러운 ‘조상들과 함께’로 옮겼습니다.
- source_word: θήκῃ ξυλίνῃ
  english_pob_choice: wooden coffin
  chosen_korean: 나무 관
  alternatives_korean:
  - 나무 상자
  - 나무 궤
  lexicon: LSJ
  rationale: 시신을 담는 용기라는 뜻을 살리되, 현대 한국어에서 바로 이해되는 장례 용어를 택했습니다.
- source_word: ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  english_pob_choice: secretly during a war of the Egyptians
  chosen_korean: 애굽 사람들의 전쟁 때에 몰래
  alternatives_korean:
  - 애굽 사람들의 전쟁 중에 몰래
  - 애굽 사람들 사이의 전쟁 때에 몰래
  lexicon: LSJ
  rationale: 압축된 구문이므로 ‘몰래’와 전쟁 상황을 함께 보존해 의미를 과도하게 특정하지 않았습니다.
- source_word: μνήμασι τῶν βασιλέων
  english_pob_choice: the tombs of the kings
  chosen_korean: 왕들의 무덤들
  alternatives_korean:
  - 왕실 무덤들
  - 왕들의 묘실
  lexicon: LSJ
  rationale: 본문의 장례적 의미를 따라 가장 직접적인 표현으로 옮기되, 난해한 독법의 여지는 남겼습니다.
- source_word: ἐπαοιδοί
  english_pob_choice: enchanters
  chosen_korean: 점쟁이들
  alternatives_korean:
  - 주술사들
  - 주문사들
  lexicon: LSJ
  rationale: 이집트의 예언·주술적 맥락을 한국어에서 넓게 전달하는 일반어를 택했습니다.
- source_word: σκότος καὶ γνόφος
  english_pob_choice: darkness and gloom
  chosen_korean: 어둠과 짙은 어둠
  alternatives_korean:
  - 어둠과 그늘
  - 어둠과 짙은 암흑
  lexicon: LSJ
  rationale: 두 낱말의 병렬과 강조를 살리면서, ‘γνόφος’의 더 짙고 눅눅한 어감을 반영했습니다.
- source_word: πληγὴ μεγάλη
  english_pob_choice: a great plague
  chosen_korean: 큰 재앙
  alternatives_korean:
  - 큰 전염병
  - 큰 징벌
  lexicon: LSJ
  rationale: 판결·재난의 폭넓은 의미를 살려, 이 문맥에서 자연스러운 재난성 표현을 선택했습니다.
- source_word: μὴ ἐπιγινώσκειν ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  english_pob_choice: each man would not recognize his brother
  chosen_korean: 각 사람이 자기 형제를 알아보지 못할 것
  alternatives_korean:
  - 아무도 자기 형제를 알아보지 못할 것
  - 각 사람이 자기 형제를 알아보지 못하리라
  lexicon: LSJ
  rationale: 분배적 ‘ἕκαστος’를 살려 ‘각 사람’을 유지했고, 결과를 자연스러운 미래형으로 표현했습니다.
theological_decisions:
- issue: 죽음의 완곡 표현 ἐκοιμήθη의 처리
  chosen_reading: ‘잠들었습니다’로 옮겨 죽음을 직접 진술하기보다 본문이 가진 완곡한 장례 언어를 유지했습니다.
  alternative_readings:
  - 죽었습니다
  - 숨을 거두었습니다
  rationale: 이 문헌의 전승 문체를 보존하는 것이 의미 전달에 도움이 되며, 교리적 함의를 새로 추가하지 않습니다.
  doctrine_reference: 'Translation philosophy: source-text literary texture should be preserved when not obscuring meaning'
- issue: 3절의 난해한 요셉 뼈 본문
  chosen_reading: ‘왕들의 무덤들에 보관하고 있었는데, 그것을 데려오려 했기 때문입니다’로 본문의 큰 흐름을 유지했습니다.
  alternative_readings:
  - 창고들(store-chambers)
  - ‘애굽 사람들 사이의 전쟁’으로 재구성
  rationale: 그리스어가 압축적이고 전승상 어려우므로, 본문이 말하는 핵심을 옮기고 세부 불확실성은 주석에 남기는 방식이 가장 투명합니다.
  doctrine_reference: Textual criticism and translation transparency in POB practice
