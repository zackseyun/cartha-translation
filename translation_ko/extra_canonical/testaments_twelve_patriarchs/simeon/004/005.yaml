id: T12P.SIM.4.5
reference: Testament of Simeon 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Φυλάξασθε οὖν ὑμεῖς²⁷, τέκνα²⁸ μου, ἀπὸ²⁹ παντὸς ζήλου καὶ φθόνου³⁰ καὶ πορεύεσθε ἐν *ἁπλότητι καρδίας³¹, ἵνα δῷ³⁴ Γκαὶ ὑμῖν⁷³⁵ ὁ Θεὸς χάριν καὶ δόξαν καὶ εὐλογίαν *ἐπὶ τὰς κεφαλὰς ὑμῶν³⁶, καθὼς³⁷ ἴδετε³⁸ *ἐν Ἰωσήφ³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/005.yaml
  text: Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you grace and glory and blessing upon your heads, just as you saw in Joseph.
translation:
  language: ko
  text: 그러므로 너희는, 내 자녀들아, 모든 질투와 시기에서 스스로를 지키고, 마음의 순전함 가운데 걸어가십시오. 그러면 하나님께서 너희의 머리 위에 은혜와 영광과 복을 주실 것이니, 너희가 요셉에게서 본 것과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε ... ἀπὸ παντὸς ζήλου καὶ φθόνου
  english_pob_choice: guard yourselves, ... from every jealousy and envy
  chosen_korean: 모든 질투와 시기에서 스스로를 지키고
  alternatives_korean:
  - 모든 질투와 시기를 경계하고
  - 모든 질투와 시기에서 자신을 지키고
  lexicon: φυλάσσω; ζῆλος; φθόνος
  rationale: φυλάξασθε는 단순한 주의보다 능동적 자기보호를 나타내므로 ‘스스로를 지키고’로 옮겼고, ζήλος/φθόνος는 문맥상 감정적 경쟁심과 시기심을 가리켜 ‘질투와 시기’로 대응했습니다.
- source_word: ἐν ἁπλότητι καρδίας
  english_pob_choice: in simplicity of heart
  chosen_korean: 마음의 순전함 가운데
  alternatives_korean:
  - 마음의 단순함 가운데
  - 마음의 진실함 가운데
  lexicon: ἁπλότης καρδίας
  rationale: ἁπλότης는 ‘단순함’만으로는 어색하고 오해될 수 있어, 내면의 분열이나 위선이 없는 상태를 드러내는 ‘순전함’으로 옮겼습니다.
- source_word: χάριν καὶ δόξαν καὶ εὐλογίαν
  english_pob_choice: grace and glory and blessing
  chosen_korean: 은혜와 영광과 복
  alternatives_korean:
  - 은총과 영광과 축복
  - 은혜와 영광과 축복
  lexicon: χάρις; δόξα; εὐλογία
  rationale: χάριν은 POB의 개정 취지에 따라 ‘은혜’로 유지했고, εὐλογία는 예배적 어감의 ‘축복’보다 본문 직역성이 있는 ‘복’으로 간결하게 살렸습니다.
- source_word: ἐπὶ τὰς κεφαλὰς ὑμῶν
  english_pob_choice: upon your heads
  chosen_korean: 너희의 머리 위에
  alternatives_korean:
  - 너희 머리 위에
  - 너희의 머리 위로
  lexicon: ἐπί + accusative
  rationale: 신체 위에 내려지는 복의 이미지가 분명하므로 ‘머리 위에’로 직역해 상징성을 보존했습니다.
theological_decisions:
- issue: “grace”의 한국어 처리
  chosen_reading: χάριν을 ‘은혜’로 번역해 본문의 신학적 어휘를 유지했습니다.
  alternative_readings:
  - ‘호의’
  - ‘은총’
  rationale: 영문 POB가 favor에서 grace로 수정한 audit trail을 반영하여, 단순한 호의가 아니라 하나님이 주시는 은혜를 가리키는 표현으로 보았습니다.
  doctrine_reference: 은혜/χάρις의 표준 신학 용례
- issue: 윤리 권면의 흐름
  chosen_reading: 질투·시기를 피하고 마음의 순전함으로 걷는 태도를 복의 조건이 아니라 권면과 결과의 연결로 표현했습니다.
  alternative_readings:
  - 조건적 순서로 더 강하게 표현
  - 명령과 약속을 분리해 약화
  rationale: Greek ἵνα 절은 목적/결과를 함께 담으므로, 권면을 약화하지 않으면서도 하나님이 주시는 결과를 자연스럽게 연결했습니다.
  doctrine_reference: 권면-목적절 구조
