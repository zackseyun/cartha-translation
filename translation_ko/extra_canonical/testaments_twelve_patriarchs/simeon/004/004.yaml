base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/004.yaml
  text: But Joseph was a good man, and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers.
translation:
  language: ko
  text: 그런데 요셉은 선한 사람이었고, 하나님의 영을 그 안에 지니고 있었으며, 자비롭고 긍휼이 많아, 나를 원망하지 않았고 오히려 나와 내 형제들을 함께 사랑했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἀνήρ
  english_pob_choice: a good man
  chosen_korean: 선한 사람
  alternatives_korean:
  - 좋은 사람
  - 착한 사람
  lexicon: ἀγαθός + ἀνήρ
  rationale: ἀγαθὸς ἀνήρ는 단순한 호감이 아니라 도덕적 선함을 가리키므로, 인격적 평가를 드러내는 ‘선한 사람’이 가장 직접적입니다.
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  english_pob_choice: having the Spirit of God in him
  chosen_korean: 하나님의 영을 그 안에 지니고 있었으며
  alternatives_korean:
  - 하나님의 영이 그 안에 있었으며
  - 그 안에 하나님의 영을 모시고 있었으며
  lexicon: πνεῦμα θεοῦ + ἐν αὐτῷ
  rationale: ‘having’의 분사 구조를 살려 ‘지니고 있었다’로 옮겨, 영어 POB의 수정 취지대로 인과를 덧붙이지 않으면서 내재를 표현했습니다.
- source_word: ἐλεήμων
  english_pob_choice: merciful
  chosen_korean: 긍휼이 많아
  alternatives_korean:
  - 자비로워
  - 긍휼한
  lexicon: ἐλεήμων
  rationale: 자비의 성향을 나타내는 형용사로서, 교회 문맥의 익숙한 표현이지만 비교적 직접적인 ‘긍휼이 많다’를 택해 이어지는 동사들과 어조를 맞췄습니다.
- source_word: οὐκ ἐμνησικάκησέν με
  english_pob_choice: he did not hold a grudge against me
  chosen_korean: 나를 원망하지 않았고
  alternatives_korean:
  - 나를 앙심 품지 않았고
  - 나를 마음에 두고 앙심하지 않았고
  lexicon: μνησικακέω
  rationale: ‘그 원한을 기억하여 악을 품다’는 뜻을 한국어에서 자연스럽게 드러내는 표현으로 ‘원망하지 않았다’를 사용했습니다.
theological_decisions:
- issue: πνεῦμα θεοῦ의 번역에서 영/성령 중 어떤 표현을 택할지
  chosen_reading: 하나님의 영
  alternative_readings:
  - 성령
  - 하나님의 성령
  rationale: 본문은 정관사나 후기 교회적 전문용례보다 ‘하나님의 영’이라는 소유격 표현이 직접적이므로, 문맥상 신적 영을 가리키되 서술어를 과도하게 교리화하지 않는 형태를 유지했습니다.
  doctrine_reference: 성경 본문 내 용어의 직접성 유지
- issue: 끝부분의 ‘함께 사랑했다’의 관계 범위
  chosen_reading: 나와 내 형제들을 함께 사랑했습니다
  alternative_readings:
  - 나와 내 형제들을 사랑했습니다
  - 나와 함께 내 형제들을 사랑했습니다
  rationale: σὺν τοῖς ἀδελφοῖς μου는 ‘나를 포함하여 내 형제들과 함께’라는 동반 관계를 나타내므로, 사랑의 대상을 넓히되 관계 부사를 보존했습니다.
  doctrine_reference: 문장 구조 보존과 관계사 의미 유지
