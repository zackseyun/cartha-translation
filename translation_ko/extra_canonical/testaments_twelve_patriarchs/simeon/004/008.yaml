id: T12P.SIM.4.8
reference: Testament of Simeon 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὅτι⁵⁸ ἀγριοῖ τοῦτο⁵⁹ τὴν ψυχήν⁶⁰, καὶ φθείρει *τὸ σῶμα⁶¹, *ὀργὴν καὶ πόλεμον παρέχει τῷ διαβουλίῳ⁶², καὶ εἰς⁶³ αἵματα⁶⁴ παροξύνει, καὶ εἰς ἔκστασιν ἄγει⁶⁵ *τὴν διάνοιαν⁶⁶, καὶ κλόνον⁶⁹ παρέχει τῇ ψυχῇ⁷⁰ καὶ τρόμον τῷ σώματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/008.yaml
  text: For this makes the soul savage, and destroys the body; it brings anger and war into one’s plans, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling.
translation:
  language: ko
  text: 이는 영혼을 사납게 만들고 몸을 파괴하며, 계획에 분노와 전쟁을 불러일으키고, 피 흘림을 부추기며, 정신을 광란으로 이끌고, 영혼에는 동요를 일으키고 몸은 떨게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγριοῖ
  english_pob_choice: makes the soul savage
  chosen_korean: 혼을 사나운 상태로 만들고
  alternatives_korean:
  - 혼을 거칠게 만들고
  - 영혼을 난폭하게 만들고
  lexicon: ἀγριόω
  rationale: 동사형의 강한 ‘야성화/사나워짐’ 의미를 살리되, 한국어에서 자연스럽고 문맥상 심리적 거칠어짐을 드러내기 위해 ‘사나운 상태로 만들다’로 옮겼습니다.
- source_word: τὴν ψυχήν / τῇ ψυχῇ
  english_pob_choice: the soul / the soul
  chosen_korean: 혼
  alternatives_korean:
  - 영혼
  - 마음
  lexicon: ψυχή
  rationale: 본문은 동일한 ψυχή를 두 번 사용하므로, 첫 번째는 존재 전체의 내면을 가리키는 ‘혼’, 후반부의 수난 상태도 함께 살릴 수 있어 일관되게 ‘혼’으로 번역했습니다.
- source_word: τὸ σῶμα / τῷ σώματι
  english_pob_choice: the body / the body
  chosen_korean: 몸
  alternatives_korean:
  - 육체
  - 신체
  lexicon: σῶμα
  rationale: 병적·정서적 결과를 함께 받는 실제 몸을 가리키므로, 과도한 신학적 색채가 덜한 ‘몸’이 가장 직접적입니다.
- source_word: τὴν διάνοιαν
  english_pob_choice: the mind
  chosen_korean: 마음
  alternatives_korean:
  - 이성
  - 생각
  lexicon: διάνοια
  rationale: διάνοια의 인지적 의미를 반영하되, 이어지는 ‘광란’과의 대비가 살아나도록 한국어에서 넓은 인지·판단 영역을 포괄하는 ‘마음’으로 옮겼습니다.
theological_decisions:
- issue: 정서적·윤리적 파괴의 연쇄를 어떻게 표현할지
  chosen_reading: 분노와 전쟁을 사람의 계획 속으로 가져오고, 피 흘림으로 치닫게 하며
  alternative_readings:
  - 분노와 싸움을 불러오고, 피를 향해 자극하며
  - 성냄과 전쟁을 꾀하게 하며, 피로 향하게 하며
  rationale: 본문의 παρέχει / παροξύνει는 단순 감정 표출이 아니라 계획과 행동 양쪽을 자극하는 연쇄를 나타내므로, ‘계획 속으로 가져오다’와 ‘치닫게 하다’로 인과성을 살렸습니다.
  doctrine_reference: 인간 내면의 정념이 죄의 행동으로 이어지는 도덕 심리 묘사
- issue: εἰς ἔκστασιν ἄγει의 강도를 어떻게 살릴지
  chosen_reading: 마음을 광란으로 이끌고
  alternative_readings:
  - 마음을 황홀경으로 이끌고
  - 마음을 정신이 나간 상태로 이끌고
  rationale: ἔκστασις는 단순한 흥분이 아니라 정상적 정신 상태의 이탈을 가리키므로, 여기서는 긍정적 ‘황홀’ 대신 부정적 ‘광란’으로 맥락을 분명히 했습니다.
  doctrine_reference: 정신의 혼란과 도덕적 붕괴를 함께 묘사하는 지혜 전통의 경고
