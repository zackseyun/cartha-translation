    rationale: τῷ διαβουλίῳ는 ‘숙고/계획’이라는 추상 명사이며 특정 주체인 ‘사람’을 명시하지 않습니다.
  - severity: medium
    issue: ‘피 흘림으로 치닫게 하며’의 주체·작용이 다소 불명확함
