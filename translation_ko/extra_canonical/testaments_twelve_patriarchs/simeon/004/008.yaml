revisions:
- from: 이것은 혼을 사나운 상태로 만들고 몸을 망치며, 분노와 전쟁을 사람의 계획 속으로 가져오고, 피 흘림으로 치닫게 하며, 마음을 광란으로 이끌고, 혼에는 동요를, 몸에는 떨림을 줍니다.[a][b]
  to: 이는 영혼을 사납게 만들고 몸을 파괴하며, 계획에 분노와 전쟁을 불러일으키고, 피 흘림을 부추기며, 정신을 광란으로 이끌고, 영혼에는 동요를 일으키고 몸은 떨게 합니다.
  rationale: 원문의 병렬적 인과 연쇄와 강도를 유지하면서, τῷ διαβουλίῳ를 비인칭적으로 ‘계획에’로 처리해 불필요한 주체 추가를 피했습니다. παροξύνει의 사동적 의미를 ‘부추기다’로 명료화했고, 반복되는 ψυχή와 σῶμα의 대구도 보존했습니다. 근거가 제공되지 않은 각주 표지는 삭제했습니다.
