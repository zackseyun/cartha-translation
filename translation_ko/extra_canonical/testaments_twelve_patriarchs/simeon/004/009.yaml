id: T12P.SIM.4.9
reference: Testament of Simeon 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ὅτι καὶ⁷¹ ἐν ὕπνῳ *τις ζῆλος⁷² κακίας αὐτὸν⁷³ φαντάζουσα⁷⁴ κατεσθίει⁷⁵ καὶ⁷⁶ πνεύμασι πονηροῖς⁷⁷ διαταράσσει⁷⁸ τὴν ψυχὴν αὐτοῦ, καὶ ἐκθροεῖσθαι τὸ σῶμα ποιεῖ, καὶ ἐν ταραχῇ διυπνίζει⁷⁹ τὸν νοῦν, καὶ ὡς⁸⁰ πνεῦμα πονηρὸν *καὶ ἰοβόλον⁸¹, *οὕτως φαίνεται⁸² τοῖς ἀνθρώποις⁸³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/009.yaml
  text: For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body shudder, and wakes the mind in turmoil; and like an evil and venomous spirit, so he appears to people.
translation:
  language: ko
  text: 그가 잠자는 동안에도 악한 욕망이 그에게 악행의 환상을 보여 주어 그를 삼키고, 악한 영들로 그의 영혼을 흔들며, 몸을 떨게 하고, 마음을 혼란 속에서 깨우며, 악하고 독을 지닌 영처럼 사람들에게 나타납니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος κακίας
  english_pob_choice: envy
  chosen_korean: 악한 욕망
  alternatives_korean:
  - 질투
  - 시기
  - 악의한 열망
  lexicon: ζῆλος
  rationale: POB의 envy를 그대로 좁게 ‘시기’로만 고정하기보다, 문맥상 악을 향한 강한 내적 충동을 포괄하는 ‘악한 욕망’으로 옮겨 전체 문장의 진행을 자연스럽게 했습니다.
- source_word: φαντάζουσα
  english_pob_choice: presenting to him visions
  chosen_korean: 그에게 악행의 환상을 보여 주어
  alternatives_korean:
  - 그에게 환상을 제시하여
  - 그에게 악한 모습들을 비추어
  - 그에게 비전을 보여 주어
  lexicon: φαντάζω
  rationale: ‘환상’이라는 시각적 이미지와 목적어의 성격을 살리되, ‘악행’으로 수식해 원문의 wickedness를 드러냈습니다.
- source_word: κατεσθίει
  english_pob_choice: consumes him
  chosen_korean: 그를 삼키고
  alternatives_korean:
  - 그를 먹어 치우고
  - 그를 소모하고
  - 그를 집어삼키고
  lexicon: κατεσθίω
  rationale: 동사의 강한 소진·포식 이미지를 살려 직설적으로 ‘삼키다’로 옮겼습니다.
- source_word: πνεύμασι πονηροῖς
  english_pob_choice: with evil spirits
  chosen_korean: 악한 영들로
  alternatives_korean:
  - 악한 영들 때문에
  - 악한 영들과 함께
  - 악령들로
  lexicon: πνεῦμα
  rationale: 원문의 도구/매개 뉘앙스를 살리기 위해 ‘-로’ 구조를 택했고, ‘영’은 본문 맥락상 악한 영적 존재를 가리키므로 ‘악한 영들’로 번역했습니다.
- source_word: ἰοβόλον
  english_pob_choice: venomous
  chosen_korean: 독을 지닌
  alternatives_korean:
  - 독 있는
  - 독사 같은
  - 독성 있는
  lexicon: ἰοβόλος
  rationale: 문자적 의미를 살리면서도 자연스러운 현대 한국어로 풀어 ‘독을 지닌’으로 옮겼습니다.
theological_decisions:
- issue: 지면/영혼/마음의 연속된 영향 묘사
  chosen_reading: 감정적·심리적 고통을 약화하지 않고, 악한 영적 영향이 꿈, 혼, 몸, 마음에까지 미친다는 연쇄를 그대로 살렸습니다.
  alternative_readings:
  - 상징적으로만 완화하여 번역
  - 심리적 비유로만 축소
  rationale: 본문은 악의 내적 작용을 강하게 묘사하므로, 이를 도덕적 경고 수준으로만 약화하지 않고 원문의 실재적 긴장을 보존했습니다.
  doctrine_reference: 성서의 악령/영적 공격 묘사에 대한 일반적 본문 해석
