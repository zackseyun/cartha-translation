id: T12P.SIM.4.7
reference: Testament of Simeon 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὑμεῖς⁵², τέκνα μου⁵³, ἀγαπήσατε⁵⁴ ἕκαστος τὸν ἀδελφὸν⁵⁵ αὐτοῦ⁵⁶ ἐν ἀγαθῇ καρδίᾳ, καὶ *ἀποστήσεται ἀφ᾽ ὑμῶν τὸ πνεῦμα τοῦ φθόνου⁵⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/007.yaml
  text: And you also, my children, let each one love his brother with a good heart, and the spirit of envy will depart from you.
translation:
  language: ko
  text: 그리고 너희도, 내 자녀들아, 각자 자기 형제를 좋은 마음으로 사랑하십시오. 그러면 시기심의 영이 너희에게서 떠날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호소하는 표현을 살리되, 현대 한국어에서 자연스럽고 품위 있는 친근한 호칭으로 옮겼습니다.
- source_word: ἀγαπήσατε ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  english_pob_choice: let each one love his brother
  chosen_korean: 각자 자기 형제를 사랑하십시오
  alternatives_korean:
  - 각 사람마다 자기 형제를 사랑하라
  - 모두 자기 형제를 사랑하십시오
  lexicon: ἀγαπάω / ἕκαστος / ἀδελφός
  rationale: 권면형 명령을 합쇼체로 옮기고, ἕκαστος의 분배적 의미를 ‘각자’로 드러냈습니다.
- source_word: ἐν ἀγαθῇ καρδίᾳ
  english_pob_choice: with a good heart
  chosen_korean: 좋은 마음으로
  alternatives_korean:
  - 선한 마음으로
  - 착한 마음으로
  lexicon: ἀγαθός / καρδία
  rationale: ‘마음’은 καρδία의 통상적 의미를 반영하고, ἀγαθῇ는 도덕적 선함을 지나치게 경직되지 않게 ‘좋은’으로 자연스럽게 옮겼습니다.
- source_word: τὸ πνεῦμα τοῦ φθόνου
  english_pob_choice: the spirit of envy
  chosen_korean: 시기심의 영
  alternatives_korean:
  - 시기의 영
  - 질투의 영
  lexicon: πνεῦμα / φθόνος
  rationale: φθόνος를 단순 감정명사로 풀기보다 원문의 인격화된 표현을 살려 ‘영’으로 유지했습니다.
theological_decisions:
- issue: τὸ πνεῦμα τοῦ φθόνου의 성격
  chosen_reading: 시기심을 단지 내면 감정이 아니라 사람들 사이를 떠나게 되는 부정적 영적 세력으로 표현했습니다.
  alternative_readings:
  - 단순한 심리 상태로만 이해해 ‘시기’ 혹은 ‘질투’로 완화하는 읽기
  rationale: 문장 후반의 ‘떠날 것입니다’는 원문이 시기심을 단순 감정 이상으로 다루는 뉘앙스를 강화하므로, POB의 직역적 흐름을 살렸습니다.
  doctrine_reference: 영적 존재/정서의 구분에 대한 본문 수준의 해석
