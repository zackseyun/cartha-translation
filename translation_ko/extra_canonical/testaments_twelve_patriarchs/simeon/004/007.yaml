revisions:
- from: 그리고 너희도, 내 자녀들아, 각자 자기 형제를 좋은 마음으로 사랑하십시오. 그러면 시기심의 영이 너희에게서 떠날 것입니다.
  to: 그리고 너희도, 내 자녀들아, 각자 자기 형제를 선한 마음으로 사랑하십시오. 그리고 시기심의 영이 너희에게서 떠날 것입니다.
  rationale: 원문에 없는 조건 접속어 ‘그러면’을 삭제하고 καί의 병렬을 ‘그리고’로 유지했습니다. 또한 ἀγαθῇ καρδίᾳ의 윤리적 함의를 ‘선한 마음으로’로 더 정확히 옮겼습니다. ‘시기심의 영’은 번역문에서 보존하되 그 존재론적 성격을 해설로 확정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
