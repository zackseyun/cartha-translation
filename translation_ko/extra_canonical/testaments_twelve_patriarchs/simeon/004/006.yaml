id: T12P.SIM.4.6
reference: Testament of Simeon 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Πάσας⁴⁰ τὰς ἡμέρας⁴¹ οὐκ⁴² ὠνείδισεν ἡμᾶς⁴³ *περὶ τοῦ πράγματος τούτου⁴⁴, ἀλλ᾿⁴⁵ ἠγάπησεν ἡμᾶς ὡς τὴν *ψυχὴν αὐτοῦ⁴⁶ καὶ ὑπὲρ τοὺς υἱοὺς αὐτοῦ⁴⁷ ἐδόξασεν⁴⁸ ἡμᾶς, καὶ⁴⁹ *πλοῦτον καὶ κτήνη καὶ καρπὸν⁵⁰ *ἐχαρίσατο ἡμῖν⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/006.yaml
  text: All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us wealth and livestock and produce.
translation:
  language: ko
  text: 그는 평생 이 일 때문에 우리를 꾸짖지 않으셨습니다. 오히려 우리를 자기 목숨처럼 사랑하셨고, 자기 아들들보다 우리를 더 높이셨으며, 우리에게 재물과 가축과 소출을 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ὠνείδισεν ἡμᾶς περὶ τοῦ πράγματος τούτου
  english_pob_choice: he did not reproach us about this matter
  chosen_korean: 이 일에 관해 우리를 꾸짖지 않았습니다
  alternatives_korean:
  - 이 문제에 대해 우리를 책망하지 않았습니다
  - 이 일 때문에 우리를 비난하지 않았습니다
  lexicon: ὠνειδίζω
  rationale: 단순한 감정 표현보다 공개적 책망·비난의 뉘앙스를 살려 ‘꾸짖다’로 옮겼습니다. ‘이 일에 관해’는 περὶ τοῦ πράγματος τούτου의 직접 대응입니다.
- source_word: ἠγάπησεν ἡμᾶς ὡς τὴν ψυχὴν αὐτοῦ
  english_pob_choice: he loved us as his own soul
  chosen_korean: 우리를 자기 영혼처럼 사랑하고
  alternatives_korean:
  - 우리를 자기 목숨처럼 사랑하고
  - 우리를 자신의 생명처럼 사랑하고
  lexicon: ψυχή
  rationale: ψυχή를 문맥상 단순한 내면이 아니라 자기 자신과 떼어낼 수 없는 생명/혼의 비유로 보아, POB의 직역성을 살린 ‘자기 영혼처럼’으로 유지했습니다.
- source_word: ὑπὲρ τοὺς υἱοὺς αὐτοῦ ἐδόξασεν ἡμᾶς
  english_pob_choice: honored us above his own sons
  chosen_korean: 자기 아들들보다 우리를 더 높여 존귀하게 여기며
  alternatives_korean:
  - 자기 아들들보다 우리를 더 존귀하게 여기며
  - 자기 아들들 위에 우리를 영화롭게 하며
  lexicon: δοξάζω
  rationale: ἐδόξασεν의 핵심은 ‘영광을 주다/존귀하게 하다’이므로 한국어에서는 관계적 우월을 드러내는 ‘더 높여 존귀하게 여기다’로 풀었습니다.
- source_word: πλοῦτον καὶ κτήνη καὶ καρπὸν ἐχαρίσατο ἡμῖν
  english_pob_choice: granted us wealth and livestock and produce
  chosen_korean: 우리에게 재물과 가축과 소산을 주셨습니다
  alternatives_korean:
  - 우리에게 재산과 가축과 소출을 주셨습니다
  - 우리에게 부와 가축과 열매를 주셨습니다
  lexicon: πλοῦτον / κτήνη / καρπός
  rationale: πλοῦτον은 POB의 ‘wealth’를 따라 ‘재물’로, κτήνη는 가축으로, καρπός는 농산물/수확의 결과를 자연스럽게 드러내는 ‘소산’으로 옮겼습니다. ἐχαρίσατο는 ‘베풀다/주다’의 은혜로운 수여를 살려 ‘주셨습니다’로 처리했습니다.
theological_decisions:
- issue: 형제에 대한 사랑과 존귀의 강조를 어떻게 한국어로 전달할지
  chosen_reading: 관계의 과장된 헌사로서 ‘자기 영혼처럼 사랑하고, 자기 아들들보다 우리를 더 높여 존귀하게 여기며’로 옮겼습니다.
  alternative_readings:
  - 더 단순하게 ‘사랑했고, 우리를 자기 아들들보다 높였습니다’
  - 보다 교회적 어투로 ‘귀히 여기고 영화롭게 했습니다’
  rationale: 본문은 누군가의 특별한 호의와 편애를 강조하므로, 평이한 ‘좋아했다’보다 존귀함과 우선순위를 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 문학적-서사적 강조
