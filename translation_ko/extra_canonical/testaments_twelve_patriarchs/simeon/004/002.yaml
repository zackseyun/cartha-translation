    rationale: γάρ는 통상 앞말에 대한 이유·설명을 나타내며, 대조 전환을 뜻하는 ‘그런데’는 본문의 논리 관계를 바꿉니다.
  - severity: medium
    issue: ‘요셉의 판매’의 소유·주체 관계가 모호함
    rationale: τῆς πράσεως Ἰωσήφ는 요셉이 판매된 사건, 곧 ‘요셉을 판 일’입니다. 현 한국어 표현은 요셉이 무언가를 판매한 일로도 해석될 수 있습니다.
  revised_text: 이는 내가 요셉을 판 일에 책임이 있었기 때문에 다른 모든 사람보다 더 슬퍼했기 때문입니다.
