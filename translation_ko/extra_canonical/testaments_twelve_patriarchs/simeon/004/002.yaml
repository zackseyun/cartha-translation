id: T12P.SIM.4.2
reference: Testament of Simeon 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐπένθουν γὰρ *παρὰ πάντας⁷ ὅτι ἐγὼ ἤμην⁸ αἴτιος *τῆς πράσεως⁹ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/002.yaml
  text: For I was grieving more than all the others, because I was responsible for the sale of Joseph.
translation:
  language: ko
  text: 그런데 나는 요셉의 판매에 책임이 있었기 때문에, 다른 모든 사람보다 더 크게 슬퍼했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπένθουν
  english_pob_choice: I was grieving
  chosen_korean: 슬퍼했습니다
  alternatives_korean:
  - 애도했습니다
  - 슬퍼하고 있었습니다
  lexicon: πενθέω
  rationale: 과거의 지속적 슬픔을 자연스러운 합쇼체로 살리되, 장례적 ‘애도’보다 본문이 말하는 내적 비탄의 뉘앙스를 더 직접적으로 드러내기 위해 ‘슬퍼했습니다’를 택했습니다.
- source_word: παρὰ πάντας
  english_pob_choice: more than all the others
  chosen_korean: 다른 모든 사람보다 더 크게
  alternatives_korean:
  - 모든 사람보다 더
  - 누구보다도
  lexicon: παρά + πάντας
  rationale: 비교의 우위가 핵심이므로 ‘다른 모든 사람보다’로 옮기고, 감정의 강도를 살려 ‘더 크게’를 덧붙였습니다.
- source_word: αἴτιος
  english_pob_choice: responsible for
  chosen_korean: 책임이 있었기 때문에
  alternatives_korean:
  - 원인이었기 때문에
  - 책임이 있었습니다
  lexicon: αἴτιος
  rationale: 단순한 ‘원인’보다, 요셉의 판매에 대한 도덕적·행위적 책임을 드러내는 ‘책임이 있었다’가 본문의 문맥에 더 정확합니다.
- source_word: τῆς πράσεως Ἰωσήφ
  english_pob_choice: the sale of Joseph
  chosen_korean: 요셉의 판매
  alternatives_korean:
  - 요셉을 판 일
  - 요셉의 매매
  lexicon: πρᾶσις
  rationale: πρᾶσις는 ‘팔림/판매’라는 행위를 가리키므로, 한국어에서도 사건 자체를 직역성 있게 드러내는 ‘요셉의 판매’를 사용했습니다.
theological_decisions:
- issue: 요셉 사건에서의 화자 자기책임 진술
  chosen_reading: 화자가 자신을 단순한 공범이 아니라 사건의 도덕적 책임자로 고백하는 진술로 옮겼습니다.
  alternative_readings:
  - ‘내가 요셉을 판 일에 연루되어 있었기 때문에’
  - ‘내가 요셉을 팔아넘긴 책임을 느꼈기 때문에’
  rationale: 그리스어 αἴτιος는 책임/원인 모두를 포함할 수 있으나, 여기서는 회개의 자기고백적 어조가 강하므로 ‘책임이 있었다’가 가장 직접적입니다.
  doctrine_reference: 회개와 죄책 고백의 서술적 표현
