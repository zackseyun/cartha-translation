  to: 우리가 이집트로 내려갔을 때, 그가 나를 정탐꾼으로 여겨 결박했습니다. 나는 내가 마땅히 고난을 겪고 있음을 알았고, 슬퍼하지 않았습니다.
  rationale: The revision preserves all source elements while making the accusation/capacity force of ὡς κατάσκοπον explicit in natural Korean. It retains the directional sense of κατέβημεν, the speaker's acknowledgment that the suffering was just, and the restrained emotional statement. The unsupported footnote anchor has been removed.
