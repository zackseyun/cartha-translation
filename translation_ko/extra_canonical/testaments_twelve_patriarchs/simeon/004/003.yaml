id: T12P.SIM.4.3
reference: Testament of Simeon 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὅτε¹⁰ κατέβημεν εἰς Αἴγυπτον, καὶ¹¹ ἔδησέ¹² με¹³ ὡς κατάσκοπον¹⁴, ἔγνων ὅτι δικαίως πάσχω¹⁵ καὶ οὐκ ἐλυπούμην¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/003.yaml
  text: And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not grieved.
translation:
  language: ko
  text: 그리고 우리가 이집트로 내려갔을 때, 그가 나를 정탐꾼으로 묶었는데, 나는 내가 정당하게 고난을 받고 있다는 것을 알았고, 슬퍼하지 않았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὅτε … κατέβημεν εἰς Αἴγυπτον
  english_pob_choice: And when we went down into Egypt
  chosen_korean: 그리고 우리가 이집트로 내려갔을 때
  alternatives_korean:
  - 그리고 우리가 이집트로 갔을 때
  - 그리고 우리가 이집트로 내려갔을 때
  lexicon: κατέβημεν
  rationale: κατέβημεν은 단순 이동보다 ‘내려가다’의 방향성을 지니므로, 이집트에 대한 지리적 하강 표현을 살렸습니다.
- source_word: ἔδησέ με ὡς κατάσκοπον
  english_pob_choice: he bound me as a spy
  chosen_korean: 그가 나를 정탐꾼으로 묶었는데
  alternatives_korean:
  - 그가 나를 첩자처럼 묶었는데
  - 그가 나를 정탐꾼으로 묶었는데
  lexicon: κατάσκοπος
  rationale: κατάσκοπον은 ‘spy’의 직접 대응인 정탐꾼으로 옮겨, 혐의의 내용이 분명히 드러나도록 했습니다.
- source_word: δικαίως πάσχω
  english_pob_choice: I was suffering justly
  chosen_korean: 내가 정당하게 고난을 받고 있다는 것을
  alternatives_korean:
  - 내가 마땅히 고난을 받고 있다는 것을
  - 내가 정당하게 고난을 받고 있다는 것을
  lexicon: δικαίως
  rationale: δικαίως는 단순 감정 상태가 아니라 ‘정당하게/옳게’라는 평가를 나타내므로, 보복이 아닌 정당한 형벌이라는 뜻을 살렸습니다.
- source_word: οὐκ ἐλυπούμην
  english_pob_choice: I was not grieved
  chosen_korean: 슬퍼하지 않았습니다
  alternatives_korean:
  - 근심하지 않았습니다
  - 슬퍼하지 않았습니다
  lexicon: ἐλυπούμην
  rationale: ἀλυπέω 계열의 정서적 고통을 ‘슬퍼하다’로 자연스럽게 옮겨, 최신 영어 POB의 ‘grieved’와도 맞추었습니다.
theological_decisions:
- issue: 무고한 고난이 아니라 정당한 고난으로 이해되는 자기평가
  chosen_reading: 화자는 자신이 겪는 구속과 고난을 ‘정당하게’ 받은 것으로 인정합니다.
  alternative_readings:
  - 단순한 체념으로 이해할 수 있음
  - 법적 판단 없이 감정적 수용으로만 이해할 수 있음
  rationale: δικαίως는 도덕적·법적 정당성을 동반하므로, 본문은 고난 자체를 미화하기보다 자신의 처지를 공정한 결과로 수용하는 태도를 말합니다.
  doctrine_reference: 고난과 책임, 공정한 심판에 대한 성경의 일반적 도식
- issue: 감정 표현의 절제
  chosen_reading: ἐλυπούμην을 ‘슬퍼하지 않았습니다’로 번역해 정서적 동요의 부재를 드러냈습니다.
  alternative_readings:
  - ‘괴로워하지 않았습니다’로 더 강하게 표현 가능
  - ‘근심하지 않았습니다’로 더 중립적으로 표현 가능
  rationale: 영문 POB의 ‘grieved’에 맞추되, 한국어에서는 과도한 심리화 없이 간결하게 정서의 반응을 전달하는 쪽이 원문에 가깝습니다.
  doctrine_reference: 본문의 서술적 정서 표현
