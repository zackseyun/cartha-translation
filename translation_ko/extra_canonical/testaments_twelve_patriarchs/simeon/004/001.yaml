revisions:
- from: 그러나 내 아버지는 내가 우울해 보이는 것을 보고 나에 대해 계속 물으셨고, 나는 그에게 말했습니다. “내 간이 부었습니다.”[a]
  to: 그런데 아버지께서는 내가 침울해 보이는 것을 보셨기 때문에 나에 관해 계속 물으셨고, 나는 그분께 “제 간이 부었습니다”라고 말했습니다.
  rationale: 담화 표지와 한국어 직접화법 문장부호를 바로잡고, σκυθρωπός의 외양상 침울함 및 ἥπαρ의 신체기관 의미를 보존했습니다. 미해결 [a] 표지는 삭제했습니다.
