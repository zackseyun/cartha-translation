  text: Now my father kept asking about me, because he had seen me gloomy, and I said to him, “My liver is swollen.”
translation:
  language: ko
  text: 그런데 아버지께서는 내가 침울해 보이는 것을 보셨기 때문에 나에 관해 계속 물으셨고, 나는 그분께 “제 간이 부었습니다”라고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατήρ μου
  english_pob_choice: my father
  chosen_korean: 내 아버지는
  alternatives_korean:
  - 아버지는
  - 내 부친은
  lexicon: πατήρ
  rationale: 직역하되 현대 한국어에서 자연스러운 소유 표현으로 옮겼습니다.
- source_word: σκυθρωπόν
  english_pob_choice: gloomy
  chosen_korean: 우울해 보이는
  alternatives_korean:
  - 침울해 보이는
  - 근심스러워 보이는
  lexicon: σκυθρωπός
  rationale: 외양상 어두워 보이는 상태를 살려, 문맥상 ‘보였다’의 결과를 자연스럽게 표현했습니다.
- source_word: ἔλεγον αὐτῷ
  english_pob_choice: I said to him
  chosen_korean: 그에게 말했습니다
  alternatives_korean:
  - 그에게 말하였습니다
  - 그에게 말했습니다
  lexicon: λέγω
  rationale: 개정된 영어 POB의 ‘said to him’를 반영해, 직접화법을 자연스럽게 옮겼습니다.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  english_pob_choice: My liver is swollen
  chosen_korean: 내 간이 부었습니다
  alternatives_korean:
  - 내 간이 부어 있습니다
  - 내 창자가 부었습니다
  lexicon: ἥπαρ
  rationale: 그리스어 원문과 영어 POB의 직설적 신체 표현을 유지했습니다. 한국어에서도 같은 생리적 이미지를 보존하는 것이 핵심입니다.
theological_decisions:
- issue: 신체 은유를 완화할지 여부
  chosen_reading: 직역에 가깝게 ‘내 간이 부었습니다’로 유지했습니다.
  alternative_readings:
  - ‘속이 상했습니다’로 의역
  - ‘몹시 괴롭습니다’로 완화
  rationale: 원문은 감정 표현을 신체기관 상태로 말하는 독특한 서술이므로, 이를 일반 정서어로 바꾸면 소스의 강한 표현이 약화됩니다.
