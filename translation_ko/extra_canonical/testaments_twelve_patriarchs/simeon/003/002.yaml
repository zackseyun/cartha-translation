id: T12P.SIM.3.2
reference: Testament of Simeon 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ γὰρ ὁ φθόνος κυριεύει *πάσης τῆς διανοίας τοῦ ἀνθρώπου⁶ καὶ οὐκ ἀφίησιν⁷ αὐτὸν Γοὔτε φαγεῖν, οὔτε πιεῖν, οὔτε¹ ποιῆσαί τι⁸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/002.yaml
  text: For envy masters the whole mind of a person, and does not allow him either to eat or to drink or to do anything good.
translation:
  language: ko
  text: 시기심은 사람의 온 마음을 지배하고, 그 사람이 먹거나 마시거나 어떤 선한 일도 하지 못하게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  english_pob_choice: envy
  chosen_korean: 시기심
  alternatives_korean:
  - 질투
  - 시기
  lexicon: φθόνος
  rationale: 사람을 지배하는 내적 악정서를 드러내기 위해 ‘시기심’을 택했습니다. ‘질투’는 관계적 경쟁의 뉘앙스가 강하고, 단순한 ‘시기’보다 감정 상태가 더 분명합니다.
- source_word: κυριεύει
  english_pob_choice: masters
  chosen_korean: 지배하여
  alternatives_korean:
  - 주관하여
  - 다스려
  - 사로잡아
  lexicon: κυριεύω
  rationale: 원문은 시기심이 마음 전체를 장악하는 힘을 말하므로, ‘지배하여’가 통제·장악의 의미를 가장 직접적으로 살립니다.
- source_word: πάσης τῆς διανοίας τοῦ ἀνθρώπου
  english_pob_choice: the whole mind of a person
  chosen_korean: 사람의 온 마음
  alternatives_korean:
  - 사람의 온 생각
  - 사람의 모든 마음
  - 사람의 전 마음
  lexicon: διάνοια
  rationale: English POB의 ‘whole mind of a person’에 맞추되, 한국어에서는 ‘마음’이 사고와 의지를 함께 포괄하는 자연스러운 대응이어서 ‘온 마음’으로 옮겼습니다.
- source_word: οὔτε ... οὔτε ... οὔτε
  english_pob_choice: either to eat or to drink or to do anything good
  chosen_korean: 먹지도 마시지도, 혹은 아무 선한 일도 하지 못하게 합니다
  alternatives_korean:
  - 먹지도 마시지도, 또 아무 선한 일도 하지 못하게 합니다
  - 먹지도 마시지도, 아무 선한 일도 하지 못하게 합니다
  lexicon: οὔτε
  rationale: 연속된 부정을 한국어에서 자연스럽게 살리기 위해 ‘먹지도 마시지도, 혹은…하지 못하게’로 처리했습니다. 마지막 항목의 ‘anything good’는 단순 행위 일반이 아니라 선한 행위를 가리키므로 ‘아무 선한 일도’로 옮겼습니다.
theological_decisions:
- issue: 시기심의 인격화와 도덕적 주체성
  chosen_reading: 시기심이 사람의 마음을 지배하여 실제로 행동을 억제하는 내적 세력으로 묘사합니다.
  alternative_readings:
  - 단순한 감정 상태로 약화하여 ‘시기가 심하면’ 정도로 읽는 해석
  - 비유를 줄여 심리적 영향만 말하는 해석
  rationale: 원문 κυριεύει와 οὐκ ἀφίησιν은 단순 감정이 아니라 사람을 지배하고 허용하지 않는 강한 작용을 말하므로, 그 도덕적·영적 긴장을 그대로 유지했습니다.
  doctrine_reference: 인간 내면의 정욕과 죄의 지배에 대한 지혜문학적·윤리적 표현
