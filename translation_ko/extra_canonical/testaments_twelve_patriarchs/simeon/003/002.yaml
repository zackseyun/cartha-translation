  rationale: 그리스어의 인과 접속사는 문맥 의존적이므로 독립 제시된 절에서는 자연스러운 한국어 문장으로 처리했습니다. 시기심이 사람의 온 마음을 지배하고 먹고 마시며 선을 행하는 일을 모두 허락하지 않는다는 원문의 강한 병렬 부정을, 현대 합쇼체로 자연스럽게 보존했습니다. 내용이 없는 각주 표지는 제거했습니다.
