  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν γάρ²¹ τις ἐπὶ Κύριον καταφύγῃ, *ἀποτρέχει τὸ πονηρὸν πνεῦμα ἀπʼ αὐτοῦ²², καὶ γίνεται ἡ διάνοια²³ κούφη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/005.yaml
  text: For if anyone takes refuge in the Lord, the evil spirit runs away from him, and the mind becomes light.
translation:
  language: ko
  text: 만일 누군가 주님께로 피하면, 그 악한 영은 그에게서 달아나고, 마음은 가벼워집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ Κύριον καταφύγῃ
  english_pob_choice: takes refuge in the Lord
  chosen_korean: 주님께 피하면
  alternatives_korean:
  - 주님 안에 피하면
  - 주님께로 피난하면
  - 주님께 피하여 들어가면
  lexicon: καταφεύγω / κύριος
  rationale: 영어 POB의 ‘takes refuge in’을 따라 ‘피하다/피난하다’ 계열로 옮기되, 한국어에서는 목적지를 자연스럽게 드러내는 ‘주님께 피하면’이 가장 간결하고 본문의 의도를 잘 살립니다.
- source_word: τὸ πονηρὸν πνεῦμα
  english_pob_choice: the evil spirit
  chosen_korean: 그 악한 영
  alternatives_korean:
  - 악한 영
  - 악령
  - 그 사악한 영
  lexicon: πνεῦμα / πονηρός
  rationale: 직역보다 ‘악령’이 더 관용적일 수 있으나, 원문은 단수 명사구를 그대로 제시하므로 ‘그 악한 영’으로 보존해 대상의 특정성을 유지했습니다.
- source_word: γίνεται ἡ διάνοια κούφη
  english_pob_choice: the mind becomes light
  chosen_korean: 마음은 가벼워집니다
  alternatives_korean:
  - 생각이 가벼워집니다
  - 생각이 맑아집니다
  - 마음이 가벼워집니다
  lexicon: διάνοια / κούφος
  rationale: διάνοια를 ‘생각’으로 좁히기보다 한국어에서 내면 상태를 넓게 담는 ‘마음’으로 옮겼고, κούφη는 물리적 ‘가벼움’의 이미지를 살리되 문맥상 심리적 경쾌함을 드러내도록 했습니다.
theological_decisions:
- issue: ‘주님’의 지칭과 영적 대조
  chosen_reading: Κύριον은 본문 그대로 ‘주님’으로 옮기고, 그 대조항의 πνεῦμα는 ‘악한 영’으로 유지했습니다.
  alternative_readings:
  - 하나님
  - 주
  - 악령
  rationale: 여기서는 문맥상 보호와 공격의 대조가 핵심이므로, 주님의 피난처 되심과 악한 영의 퇴각을 직접 대비시키는 번역이 본문의 힘을 가장 잘 전달합니다.
  doctrine_reference: source-grounded contextual rendering
