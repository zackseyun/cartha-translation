id: T12P.SIM.3.1
reference: Testament of Simeon 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα¹ μου² Γἀκούσατέ μου καὶ¹³ φυλάξασθε⁴ ἀπὸ *τοῦ πνεύματος⁵ τῆς πλάνης καὶ τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/001.yaml
  text: And now, my children, hear me and guard yourselves against the spirit of deceit and envy.
translation:
  language: ko
  text: 그리고 이제, 내 자녀들아, 내 말을 들으십시오. 그리고 속임과 시기의 영을 경계하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 호칭의 친밀함과 권면의 직접성을 살리되, 현대 한국어에서 자연스럽고 격식을 유지하는 「자녀들아」로 옮겼습니다.
- source_word: καὶ νῦν
  english_pob_choice: And now
  chosen_korean: 그리고 이제
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: καὶ νῦν
  rationale: 서두의 전환 표시를 자연스러운 한국어 연결어로 반영했습니다.
- source_word: φυλάξασθε ἀπό
  english_pob_choice: guard yourselves against
  chosen_korean: 경계하십시오
  alternatives_korean:
  - 스스로 지키십시오
  - 조심하십시오
  lexicon: φυλάσσω + ἀπό
  rationale: 수동적으로 피하는 뜻보다 적극적으로 자신을 지키는 권면이므로, 대상 앞에 놓인 위험을 향해 경계하는 표현으로 옮겼습니다.
- source_word: τοῦ πνεύματος τῆς πλάνης καὶ τοῦ φθόνου
  english_pob_choice: the spirit of deceit and envy
  chosen_korean: 속임과 시기의 영
  alternatives_korean:
  - 기만과 시기의 영
  - 속임수와 시기의 영
  lexicon: πνεῦμα + πλάνη + φθόνος
  rationale: πνεῦμα는 여기서 악한 성향을 부추기는 인격적/영적 세력으로 읽어 ‘영’으로 유지했고, πλάνη는 문맥상 ‘속임’으로, φθόνος는 관계적 질투를 드러내는 ‘시기’로 옮겼습니다.
theological_decisions:
- issue: 악한 ‘영’의 실재를 어떻게 드러낼 것인가
  chosen_reading: ‘속임과 시기의 영’으로 번역해, 단순한 심리 상태가 아니라 공동체를 왜곡하는 영적 영향력을 나타내게 했습니다.
  alternative_readings:
  - ‘거짓과 시기의 영’
  - ‘속임수와 질투의 영’
  rationale: 헬라어 πνεῦμα와 정관사 구조는 인격화된 악의 작용을 시사하므로, 이를 약화시키지 않도록 ‘영’을 유지했습니다.
  doctrine_reference: 영적 분별과 악의 세력에 대한 신약적 권면
