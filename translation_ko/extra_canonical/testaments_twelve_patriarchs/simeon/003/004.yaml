id: T12P.SIM.3.4
reference: Testament of Simeon 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Δύο Γοὖν¹¹³ ἔτη¹⁴ *ἐν φόβῳ κυρίου¹⁵ ἐκάκωσα *τὴν ψυχήν μου ἐν νηστείᾳ¹⁶, καὶ ἔγνων ὅτι ἡ¹⁷ λύσις τοῦ φθόνου διὰ φόβου¹⁸ θεοῦ¹⁹ γίνεται²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/004.yaml
  text: For two years, then, in fear of the Lord I afflicted my soul with fasting, and I learned that the release from envy comes through fear of God.
translation:
  language: ko
  text: 그러므로 나는 두 해 동안 주님을 경외하며 금식으로 내 자신을 괴롭게 하였고, 시기로부터의 해방은 하나님을 경외함으로 이루어진다는 것을 알게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δύο Γοὖν ἔτη
  english_pob_choice: For two years, then
  chosen_korean: 그러므로 두 해 동안
  alternatives_korean:
  - 그런즉 두 해 동안
  - 그래서 두 해 동안
  lexicon: δύο; οὖν
  rationale: οὖν의 논리 전환을 ‘그러므로’로 옮겨 앞선 문맥의 결론임을 드러내고, ἔτη는 자연스러운 한국어 표현인 ‘두 해’로 옮겼습니다.
- source_word: ἐν φόβῳ κυρίου
  english_pob_choice: in fear of the Lord
  chosen_korean: 주님을 경외하는 가운데
  alternatives_korean:
  - 주님에 대한 두려움 속에서
  - 주님을 두려워하는 가운데
  lexicon: φόβος; κύριος
  rationale: φόβος를 단순한 공포보다 언약적·경건적 뉘앙스를 살려 ‘경외’로 옮기되, κύριος는 예수/하나님 호칭 문맥에 맞춰 ‘주님’으로 번역했습니다.
- source_word: ἐκάκωσα τὴν ψυχήν μου ἐν νηστείᾳ
  english_pob_choice: I afflicted my soul with fasting
  chosen_korean: 금식하며 내 혼을 괴롭게 하였고
  alternatives_korean:
  - 금식으로 내 영혼을 괴롭게 하였고
  - 금식으로 내 혼을 괴롭혔고
  lexicon: ψυχή; νηστεία; κακόω
  rationale: ψυχή는 이 문맥에서 전통적 ‘영혼’보다 보다 직접적인 ‘혼’이 적절하고, κακόω는 자학적 금욕을 가리키므로 ‘괴롭게 하다’로 옮겼습니다.
- source_word: ἡ λύσις τοῦ φθόνου
  english_pob_choice: the release from envy
  chosen_korean: 시기심에서 벗어나는 해방
  alternatives_korean:
  - 시기심으로부터의 해방
  - 시기심의 풀림
  lexicon: λύσις; φθόνος
  rationale: λύσις의 ‘해방/풀림’과 φθόνος의 도덕적 감정인 ‘시기심’을 모두 드러내기 위해, 결과적 의미를 살려 ‘벗어나는 해방’으로 옮겼습니다.
- source_word: διὰ φόβου θεοῦ
  english_pob_choice: through fear of God
  chosen_korean: 하나님에 대한 경외를 통해
  alternatives_korean:
  - 하나님을 두려워함을 통해
  - 하나님 경외를 통해
  lexicon: φόβος; θεός
  rationale: 앞의 κύριος와 같은 φόβος를 일관되게 ‘경외’로 처리하고, θεός는 프로젝트 기본어인 ‘하나님’으로 번역했습니다.
theological_decisions:
- issue: φόβος κυρίου / φόβος θεοῦ의 신학적 뉘앙스
  chosen_reading: 두 구절의 ‘fear’는 공포가 아니라 하나님/주님 앞에서의 경외와 순종을 뜻하는 것으로 읽어 한국어에서도 ‘경외’로 통일했습니다.
  alternative_readings:
  - 두려움
  - 두려워함
  rationale: 문맥상 금식과 자기 절제의 목적을 설명하는 경건적 표현이므로, 독자에게 왜곡 없이 전달하려면 ‘경외’가 가장 적합합니다.
  doctrine_reference: 경건과 회개, 하나님 경외의 지혜 문학적 표현
- issue: ψυχή의 한국어 대응
  chosen_reading: 여기서는 인격 전체를 가리키는 셈어적/헬라적 용법으로 보고 ‘혼’을 사용했습니다.
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 금식으로 스스로를 괴롭게 하는 행위를 설명하는 문맥에서 ‘혼’이 가장 중립적이며, 불필요한 영지주의적 뉘앙스를 피할 수 있습니다.
  doctrine_reference: 인간 이해론, 심신 통합적 인간관
