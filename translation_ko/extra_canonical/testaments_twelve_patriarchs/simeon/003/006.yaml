id: T12P.SIM.3.6
reference: Testament of Simeon 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ λοιπὸν συμπαθεῖ²⁴ τῷ φθονουμένῳ²⁵, καὶ²⁶ συγγινώσκει²⁷ *τοῖς ἀγαπῶσιν²⁸ αὐτόν²⁹, καὶ οὕτως³⁰ παύεται τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/006.yaml
  text: And from then on he has compassion for the one envied, and forgives those who love him, and so he ceases from envy.
translation:
  language: ko
  text: 그리고 그때부터 그는 시기를 받는 이를 가엾게 여기고, 자기를 사랑하는 이들을 용서하며, 그렇게 시기를 그칩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμπαθεῖ τῷ φθονουμένῳ
  english_pob_choice: has compassion for the one envied
  chosen_korean: 시기받는 이에게 동정하며
  alternatives_korean:
  - 시기받는 이를 불쌍히 여기며
  - 질투의 대상이 된 이를 가엾게 여기며
  lexicon: συμπαθέω
  rationale: 여기서는 단순한 감정 공감보다 ‘시기받는 사람을 향한 연민’을 드러내는 동사가 적절하므로, 합쇼체 흐름에 맞춰 ‘동정하다’로 옮겼습니다.
- source_word: συγγινώσκει τοῖς ἀγαπῶσιν αὐτόν
  english_pob_choice: forgives those who love him
  chosen_korean: 자기를 사랑하는 이들을 용서하며
  alternatives_korean:
  - 그를 사랑하는 이들을 용서하며
  - 자기를 사랑하는 이들을 너그럽게 용서하며
  lexicon: συγγιγνώσκω
  rationale: 문맥상 단순 인정보다 ‘용서하다’가 영어 POB와 원문의 의미를 가장 직접적으로 반영하므로, 대상은 자연스러운 한국어 대명사로 정리했습니다.
- source_word: παύεται τοῦ φθόνου
  english_pob_choice: ceases from envy
  chosen_korean: 시기함을 그칩니다
  alternatives_korean:
  - 시기를 멈춥니다
  - 질투를 그칩니다
  lexicon: παύομαι
  rationale: 원문은 ‘시기’라는 행위를 그치는 뜻이므로, 명사화된 ‘시기함’보다 동작을 살리는 ‘그칩니다’가 더 자연스럽고 직결됩니다.
- source_word: καὶ λοιπὸν
  english_pob_choice: And from then on
  chosen_korean: 그리고 그때부터
  alternatives_korean:
  - 그러므로 이제부터
  - 그리고 이제는
  lexicon: λοιπός
  rationale: 시간적 전개를 나타내는 연결로 읽어, 사건 이후의 상태 변화를 보여 주는 ‘그때부터’로 옮겼습니다.
theological_decisions:
- issue: 시기와 용서의 윤리적 전환을 어떻게 살릴지
  chosen_reading: 본문은 시기심의 중단을 단순한 감정 조절이 아니라, 시기받는 이를 향한 동정과 사랑하는 이들에 대한 용서로 이어지는 회복의 흐름으로 제시합니다.
  alternative_readings:
  - 단순히 감정적 자기통제의 권면으로 축소하는 읽기
  - ‘용서’보다 ‘관용’으로 약화하는 읽기
  rationale: 원문의 세 동작이 인과적으로 연결되어 있어, 윤리적 전환의 강도를 유지하는 번역이 필요합니다.
  doctrine_reference: 성품 변화와 이웃 사랑
