revisions:
- from: 그러나 그것은 항상 그를 부추겨서 미움받는 이를 죽이게 합니다. 그리고 미움받는 이는 항상 번성하지만, 시기하는 자는 쇠해 갑니다.[a]
  to: 그러나 시기는 언제나 그를 부추겨 시기받는 이를 죽이게 합니다. 시기받는 이는 언제나 번성하고, 시기하는 이는 시들어 갑니다.
  rationale: Replaced ‘미움받는 이’ with ‘시기받는 이’ throughout to reflect φθονούμενος and preserve its contrast with φθονῶν. Made the implied subject explicit as ‘시기’ for natural Korean and removed the unsupported [a] anchor. ‘시들어 갑니다’ preserves the εικόnic contrast of ἀνθεῖ and μαραίνεται.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:13Z'
review_pass:
  verdict: revise
  source_fidelity: φθονούμενος means ‘the one who is envied,’ not generally ‘the one who is hated.’ The draft’s ‘미움받는 이’ therefore changes the repeated envy-word contrast. The opening subject is most naturally supplied as ‘시기’ in Korean, consistent with the Greek’s implied antecedent and the surrounding ethical contrast.
  naturalness: ‘시기는 언제나 그를 부추겨 … 죽이게 합니다’ is clear modern formal Korean. Repeating ‘시기받는 이’ and ‘시기하는 이’ preserves the Greek participial antithesis. ‘시들어 갑니다’ also retains the imagery contrasting flourishing with withering.
  terminology: Use ‘시기받는 이’ for φθονούμενος and ‘시기하는 이’ for φθονῶν. This keeps the lexical and rhetorical relationship present in the Greek without introducing the different concept of hatred.
  issues:
  - severity: high
    issue: ‘미움받는 이’ translates φθονούμενος inaccurately.
    rationale: The passive participle derives from φθονέω (‘envy’), and is echoed by φθονῶν (‘the one who envies’) later in the verse. ‘미움받는’ breaks this deliberate lexical contrast.
  - severity: medium
    issue: The unprovided footnote anchor [a] should not remain in the translation.
    rationale: No footnote content or source-based note is supplied for this anchor; retaining it creates an unsupported anchor.
  revised_text: 그러나 시기는 언제나 그를 부추겨 시기받는 이를 죽이게 합니다. 시기받는 이는 언제나 번성하고, 시기하는 이는 시들어 갑니다.
  revised_footnotes: []
  revision_rationale: Replaced ‘미움받는 이’ with ‘시기받는 이’ throughout to reflect φθονούμενος and preserve its contrast with φθονῶν. Made the implied subject explicit as ‘시기’ for natural Korean and removed the unsupported [a] anchor. ‘시들어 갑니다’ preserves the εικόnic contrast of ἀνθεῖ and μαραίνεται.
