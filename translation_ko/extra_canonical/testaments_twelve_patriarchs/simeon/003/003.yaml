id: T12P.SIM.3.3
reference: Testament of Simeon 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλὰ⁹ *πάντοτε ὑποβάλλει¹⁰ ἀνελεῖν¹¹ τὸν φθονούμενον· *καὶ ὁ μὲν φθονούμενος πάντοτε ἀνθεῖ, ὁ δὲ φθονῶν μαραίνεται¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/003.yaml
  text: But it always urges him to kill the one envied; and the one envied always flourishes, while the one who envies wastes away.
translation:
  language: ko
  text: 그러나 시기는 언제나 그를 부추겨 시기받는 이를 죽이게 합니다. 시기받는 이는 언제나 번성하고, 시기하는 이는 시들어 갑니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε ὑποβάλλει
  english_pob_choice: it always urges him
  chosen_korean: 항상 그를 부추겨서
  alternatives_korean:
  - 항상 그를 재촉해서
  - 늘 그에게 부추깁니다
  lexicon: ὑποβάλλω
  rationale: 행동을 안에서 밀어 넣는 강한 유도를 살리기 위해 '부추기다'를 택했고, πάντοτε는 '항상'으로 직접 대응했습니다.
- source_word: ἀνελεῖν τὸν φθονούμενον
  english_pob_choice: to kill the one envied
  chosen_korean: 미움받는 이를 죽이게 합니다
  alternatives_korean:
  - 시기받는 이를 죽이게 합니다
  - 미움을 받는 이를 죽이게 합니다
  lexicon: ἀναιρέω / φθονέω
  rationale: 본문의 목적절을 자연스러운 한국어로 풀어 '죽이게 합니다'로 옮기고, φθονούμενον은 수동형 의미를 살려 '미움받는 이'로 번역했습니다.
- source_word: ὁ μὲν φθονούμενος πάντοτε ἀνθεῖ
  english_pob_choice: the one envied always flourishes
  chosen_korean: 미움받는 이는 항상 번성하지만
  alternatives_korean:
  - 시기받는 이는 항상 번성하지만
  - 미움을 받는 이는 늘 번성하지만
  lexicon: φθονούμενος / ἀνθέω
  rationale: ἀνθεῖ는 '번성하다'로 옮겨 삶의 왕성함을 유지했고, 대조를 살리기 위해 절 끝을 '하지만'으로 연결했습니다.
- source_word: ὁ δὲ φθονῶν μαραίνεται
  english_pob_choice: the one who envies wastes away
  chosen_korean: 시기하는 자는 쇠해 갑니다
  alternatives_korean:
  - 시기하는 자는 시들어 갑니다
  - 시기하는 이는 메말라 갑니다
  lexicon: φθονέω / μαραίνω
  rationale: μαραίνεται의 소진·쇠락 이미지를 한국어에서 넓게 담아 '쇠해 갑니다'로 옮겼습니다.
theological_decisions:
- issue: 본문의 반복 대조 구조
  chosen_reading: '''미움받는 이''와 ''시기하는 자''의 대조를 유지해, 시기의 내적 파괴와 대상의 지속적 번성을 함께 드러냈습니다.'
  alternative_readings:
  - '''시기받는 이''로 통일'
  - '''시샘하는 자''로 순화'
  rationale: 그리스어 수동 분사와 현재 분사의 대비가 윤리적·심리적 긴장을 이루므로, 이를 약화시키지 않도록 대조를 선명하게 보존했습니다.
  doctrine_reference: 문학적·윤리적 대조 구조
