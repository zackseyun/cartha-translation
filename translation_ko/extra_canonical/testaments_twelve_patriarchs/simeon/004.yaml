base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004.yaml
  text: 1[a]. Now my father kept asking about me, because he had seen me gloomy, and I told him, “My liver is swollen.” 2. For I was grieving more than all the others, because I was responsible for the sale of Joseph. 3. And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not distressed. 4. But Joseph was a good man[b], and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers. 5. Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you favor and glory and blessing upon your heads, just as you saw in Joseph. 6. All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us riches and livestock and produce. 7. And you also, my children, let each one love his brother with a good heart, and the spirit of
    envy will depart from you. 8. For this makes the soul savage, and destroys the body; it brings anger and war to one’s designs, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling. 9. For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body start up in fear, and wakes the mind in turmoil; and like an evil and venomous spirit[c][d], so he appears to people.
  footnotes:
  - marker: a
    text: '"My liver is swollen" reflects an ancient bodily idiom for inner anguish or distress; Simeon gives his father a physical explanation for his troubled appearance.'
    reason: cultural_note
    anchor_ref: '4:1'
  - marker: b
    text: '"Simplicity of heart" can also be rendered "single-heartedness" or "sincerity of heart."'
    reason: lexical_alternative
    anchor_ref: '4:5'
  - marker: d
    text: The pair "jealousy and envy" renders two related Greek terms (ζῆλος, φθόνος), both negative here.
    reason: lexical_alternative
    anchor_ref: '4:8'
  - marker: c
    text: The final clause may mean either that the envious person appears to others like an evil, venomous spirit, or that envy itself appears in that way.
    reason: alternative_reading
    anchor_ref: '4:9'
translation:
  language: ko
  text: '1. 그러자 내 아버지께서는 내가 침울해 보이는 것을 보시고 나에 관하여 계속 물으셨습니다.[a] 나는 아버지께 말씀드렸습니다. “제 간이 부었습니다.”


    2. 내가 요셉을 팔아넘긴 일에 책임이 있었기 때문에, 나는 다른 모든 사람보다 더 슬퍼하고 있었습니다.


    3. 우리가 이집트로 내려갔을 때 그가 나를 정탐꾼으로 결박하자, 나는 내가 마땅히 고난을 겪고 있음을 알았으므로 괴로워하지 않았습니다.


    4. 그러나 요셉은 좋은 사람이었습니다. 그는 그 안에 하나님의 영을 지니고 있었고, 자비롭고 긍휼이 많았으므로 나에게 원한을 품지 않았으며, 다른 형제들과 함께 나를 사랑했습니다.


    5. 그러므로 내 자녀들아, 모든 질투와 시기를 경계하고, 순전한 마음으로 살아가십시오.[b][d] 그러면 하나님께서도 너희에게 요셉에게서 본 것처럼 은혜와 영광과 복을 너희 머리 위에 주실 것입니다.


    6. 그는 평생토록 이 일 때문에 우리를 꾸짖지 않았습니다. 오히려 우리를 자기 자신의 영혼처럼 사랑했고, 자기 아들들보다 우리를 더 높여 주었으며, 우리에게 재물과 가축과 소출을 주었습니다.


    7. 너희도, 내 자녀들아, 저마다 선한 마음으로 자기 형제를 사랑하십시오. 그러면 시기의 영이 너희에게서 떠날 것입니다.


    8. 시기는 영혼을 사납게 하고 몸을 파괴하며, 마음속 계획에 분노와 전쟁을 불러일으키고, 피 흘림으로 몰아가며, 정신을 광란에 빠뜨리고, 영혼에는 동요를, 몸에는 떨림을 일으킵니다.


    9. 시기는 잠자는 동안에도 그에게 악한 일들의 환상을 보여 주어 그를 삼키고, 악한 영들로 그의 영혼을 어지럽히며, 몸을 깜짝 놀라게 하고, 마음을 혼란 속에서 깨웁니다. 그는 악하고 독을 품은 영처럼 사람들에게 보입니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제 간이 부었습니다’는 내적인 괴로움이나 고통을 신체 증상으로 말하는 고대의 관용적 표현입니다. 시므온은 자신의 침울한 모습을 보고 묻는 아버지에게 육체적인 이유를 댑니다.
    reason: cultural_note; 4:1의 ‘간이 부었습니다’에 연결
  - marker: b
    text: ‘순전한 마음’은 ‘한결같은 마음’ 또는 ‘진실한 마음’으로도 옮길 수 있습니다.
    reason: lexical_alternative; 4:5의 ἁπλότης καρδίας에 연결
  - marker: c
    text: 마지막 절은 시기하는 사람이 악하고 독을 품은 영처럼 사람들에게 보인다는 뜻으로 이해할 수 있습니다. 일부 해석은 시기 자체가 그렇게 나타난다는 뜻으로 봅니다.
    reason: alternative_reading; 4:9의 마지막 절에 연결
  - marker: d
    text: ‘질투와 시기’는 여기에서 모두 부정적인 뜻으로 쓰인, 서로 관련된 두 그리스어 단어(ζῆλος, φθόνος)를 옮긴 것입니다.
    reason: lexical_alternative; 4:5의 ‘질투와 시기’에 연결
lexical_decisions:
- source_word: σκυθρωπός
  english_pob_choice: gloomy
  chosen_korean: 침울해
  alternatives_korean:
  - 우울해
  - 침통해
  lexicon: LSJ
  rationale: 겉으로 드러나는 낙담한 표정을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  english_pob_choice: My liver is swollen
  chosen_korean: 제 간이 부었습니다
  alternatives_korean:
  - 간이 부었습니다
  - 속이 상했습니다
  lexicon: LSJ
  rationale: 고대의 신체 관용구를 완화하지 않고, 한국어에서도 구체적 신체 표현을 살렸습니다.
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  english_pob_choice: having the Spirit of God in him
  chosen_korean: 그 안에 하나님의 영이 있었으며
  alternatives_korean:
  - 그 안에 하나님의 성령이 있었으며
  - 그 안에 하나님의 영이 깃들어 있었으며
  lexicon: LSJ
  rationale: 문맥상 하나님의 영의 내재를 가리키므로 ‘영’으로 옮기되, 한국어에서 자연스러운 서술형으로 구성했습니다.
- source_word: ἁπλότης καρδίας
  english_pob_choice: simplicity of heart
  chosen_korean: 마음의 단순함
  alternatives_korean:
  - 마음의 성실함
  - 단일한 마음
  lexicon: LSJ
  rationale: 텍스트가 요구하는 내적 분할 없음, 곧 간단명료하고 꾸밈없는 마음을 살렸습니다.
- source_word: ζῆλος / φθόνος
  english_pob_choice: jealousy and envy
  chosen_korean: 질투와 시기
  alternatives_korean:
  - 열심과 시기
  - 질투와 투기
  lexicon: LSJ
  rationale: 이 문맥에서는 두 단어가 모두 부정적 정념이므로 일반적으로 이해되는 비슷한 악덕쌍으로 구분해 옮겼습니다.
- source_word: διαβουλίῳ
  english_pob_choice: one’s designs
  chosen_korean: 한 사람의 계획
  alternatives_korean:
  - 의도
  - 생각
  lexicon: LSJ
  rationale: 정신 내부의 숙고와 의도 영역을 가리키므로, 한국어에서 이해하기 쉬운 ‘계획’으로 옮겼습니다.
- source_word: ἔκστασις
  english_pob_choice: frenzy
  chosen_korean: 광란
  alternatives_korean:
  - 혼절
  - 정신이상
  lexicon: LSJ
  rationale: 정신이 제 자리에서 이탈한 격한 상태를 과도한 의학화 없이 강하게 살렸습니다.
- source_word: ἰοβόλος
  english_pob_choice: venomous
  chosen_korean: 독을 가진
  alternatives_korean:
  - 독사 같은
  - 독을 뿜는
  lexicon: LSJ
  rationale: ‘venomous’의 비유적 공격성을 유지하면서도 한국어에서 직설적으로 이해되게 했습니다.
theological_decisions:
- issue: Joseph에게서의 하나님의 영
  chosen_reading: 그 안에 하나님의 영이 있었으며
  alternative_readings:
  - 그 안에 하나님의 성령이 있었으며
  - 하나님의 영이 그에게 있었기 때문에
  rationale: 문맥은 요셉의 도덕적 탁월함을 설명하는데, 원문의 참여구조를 살리면서도 신적 내주/작용의 의미를 분명히 하기 위해 ‘영’으로 번역했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 시기의 영의 인격화
  chosen_reading: 시기의 영이 너희에게서 떠날 것입니다
  alternative_readings:
  - 시기하는 영이 너희에게서 떠날 것입니다
  - 시기의 마음이 떠날 것입니다
  rationale: 본문은 시기를 단순한 감정이 아니라 영적 작용으로 묘사하므로, POB의 문맥을 따라 ‘영’ 표현을 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
