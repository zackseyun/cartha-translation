- from: 그리고 이제, 내 자녀들아, 내 말을 들으십시오. 그리고 속임의 영과 시기의 영을 경계하십시오. 시기는 한 사람의 온갖 생각을 지배하여, 그로 하여금 먹지도 마시지도, 또 어떤 선한 일도 하지 못하게 합니다. 오히려 그것은 늘 그가 시기하는 자를 죽이도록 부추기며, 시기받는 자는 늘 번성하는 반면 시기하는 자는 쇠해 갑니다. 그러므로 나는 두 해 동안 주님을 경외하는 가운데 금식하며 내 영혼을 괴롭게 했고, 하나님의 두려움을 통해 시기에서 벗어남이 온다는 것을 알게 되었습니다. 누구든지 주님께 피하면 악한 영이 그에게서 달아나고, 그 생각은 가벼워집니다. 그때부터 그는 시기받는 자를 불쌍히 여기고, 그를 사랑하는 자들을 용서하며, 그렇게 시기에서 그칩니다.[a][b][c]
