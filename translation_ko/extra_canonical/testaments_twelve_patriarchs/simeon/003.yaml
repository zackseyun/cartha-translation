base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003.yaml
  text: And now[a], my children, hear me, and guard yourselves from the spirit of deceit and envy. For envy masters a man's whole mind, and does not allow him either to eat or to drink or to do anything good. But it is always urging him to kill the one envied; and while the one envied is always flourishing, the one who envies wastes away[b]. For two years, then, in the fear of the Lord I afflicted my soul with fasting, and I learned that release from envy comes through the fear of God. For if anyone flees for refuge to the Lord, the evil spirit runs away from him, and his mind becomes light. And from then on he has compassion on the one envied, and forgives those who love him[c], and so he ceases from envy.
  footnotes:
  - marker: a
    text: Or 'spirit of error' or 'spirit of delusion.' The Greek πλάνη can denote both deception and wandering into error.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the one envied ... the one envying.' The Greek sharpens the contrast between the target of envy and the envious person.
    reason: lexical_alternative
  - marker: c
    text: '''Those who love him'' may refer either to the person formerly envied or to the one being healed from envy; the Greek pronoun is brief and contextually compressed.'
    reason: alternative_reading
translation:
  language: ko
  text: '이제, 내 자녀들아, 내 말을 들으십시오. 속임과 시기의 영을 경계하십시오.[a] 시기는 사람의 온 마음을 지배하여, 먹지도 마시지도 못하게 하고 어떤 선한 일도 하지 못하게 합니다. 오히려 시기는 늘 시기받는 사람을 죽이도록 부추깁니다. 시기받는 사람은 언제나 번성하지만, 시기하는 사람은 쇠해 갑니다.[b]


    그러므로 나는 두 해 동안 주님을 경외하며 금식으로 내 영혼을 괴롭게 했고, 하나님을 경외함을 통하여 시기에서 벗어남이 이루어진다는 것을 알게 되었습니다. 누구든지 주님께 피하면 악한 영이 그에게서 달아나고, 그의 마음은 가벼워집니다. 그러면 그는 시기받는 사람을 동정하고, 그를 사랑하는 사람들을 용서하며,[c] 그렇게 시기를 그치게 됩니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그릇됨의 영’ 또는 ‘미혹의 영’. 그리스어 πλάνη는 속임뿐 아니라 그릇됨이나 미혹을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘시기받는 사람은 … 시기하는 사람은’입니다. 그리스어는 시기의 대상과 시기하는 사람을 대조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그를 사랑하는 사람들’의 ‘그’는 시기받던 사람을 가리킬 수도 있고, 시기에서 벗어나고 있는 사람을 가리킬 수도 있습니다. 그리스어 대명사의 지시 대상은 문맥상 압축되어 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα τῆς πλάνης
  english_pob_choice: spirit of deceit
  chosen_korean: 속임의 영
  alternatives_korean:
  - 그릇됨의 영
  - 미혹의 영
  lexicon: LSJ
  rationale: πλάνη는 ‘그릇됨’과 ‘속임/미혹’의 뜻을 함께 가질 수 있는데, 시기와 결합된 도덕적 타락의 힘이라는 문맥을 살려 ‘속임의 영’으로 옮겼습니다.
- source_word: φθόνος
  english_pob_choice: envy
  chosen_korean: 시기
  alternatives_korean:
  - 질투
  lexicon: LSJ
  rationale: 본문 전체의 중심 악덕이 φθόνος이므로 용어를 일관되게 유지해야 했고, 한국어에서는 ‘시기’가 상대의 선에 대한 적대적 분노를 더 정확히 드러냅니다.
- source_word: κυριεύει πάσης τῆς διανοίας
  english_pob_choice: masters a man's whole mind
  chosen_korean: 한 사람의 온갖 생각을 지배하여
  alternatives_korean:
  - 한 사람의 온 마음을 다스려
  - 사람의 온 ذهن을 장악하여
  lexicon: LSJ
  rationale: κυριεύει의 지배성을 살리되, διάνοια를 단순한 지성보다 사고 전체로 보아 ‘온갖 생각’으로 풀어 독자에게 자연스럽게 전달했습니다.
- source_word: ἐκάκωσα τὴν ψυχήν μου ἐν νηστείᾳ
  english_pob_choice: I afflicted my soul with fasting
  chosen_korean: 금식하며 내 영혼을 괴롭게 했고
  alternatives_korean:
  - 금식으로 내 영혼을 괴롭게 했고
  - 금식으로 내 혼을 학대했고
  lexicon: LSJ
  rationale: ἐκάκωσα는 자기를 강하게 괴롭히는 표현이므로, 금식과의 결합을 살려 ‘내 영혼을 괴롭게 했다’로 옮겼습니다.
- source_word: λύσις τοῦ φθόνου
  english_pob_choice: release from envy
  chosen_korean: 시기에서 벗어남
  alternatives_korean:
  - 시기에서의 해방
  - 시기에서 풀려남
  lexicon: LSJ
  rationale: λύσις의 ‘풀림/해제’ 이미지를 살리면서도 한국어에서 가장 자연스러운 결과 상태로 표현했습니다.
- source_word: τὸ πονηρὸν πνεῦμα
  english_pob_choice: the evil spirit
  chosen_korean: 악한 영
  alternatives_korean:
  - 악령
  - 악한 영
  lexicon: LSJ
  rationale: 정관사와 형용사가 결합한 개인적 영적 존재를 가리키므로, 축소하지 않고 그대로 ‘악한 영’으로 옮겼습니다.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  english_pob_choice: those who love him
  chosen_korean: 그를 사랑하는 자들
  alternatives_korean:
  - 그를 사랑하는 사람들
  - 그를 사랑하는 이들
  lexicon: LSJ
  rationale: 대명사 αὐτόν의 지시 대상이 문맥상 약간 압축되어 있으나, 가장 직접적인 읽기를 따라 ‘그를 사랑하는 자들’로 두었습니다.
theological_decisions:
- issue: κύριος와 θεός의 한국어 처리
  chosen_reading: 주님 / 하나님
  alternative_readings:
  - 주 / 하나님
  - 야훼 / 하나님
  rationale: 이 본문은 히브리 성경 인용문이 아니라 예언적 권면 문맥이므로 κύριος는 한국어 경건어법을 살린 ‘주님’으로, θεός는 기본 용례대로 ‘하나님’으로 옮겼습니다.
  doctrine_reference: 'POB defaults: κύριος → 주/주님, Θεός → 하나님'
- issue: 시기에서 벗어남의 근거
  chosen_reading: 하나님의 두려움을 통해 시기에서 벗어남이 온다
  alternative_readings:
  - 하나님을 경외함을 통해 시기가 풀린다
  - 하나님을 두려워함으로 시기가 해방된다
  rationale: 본문은 금식과 경외를 통해 악덕이 실제로 풀린다는 도덕적·영적 인과를 말하므로, 결과적 해방을 분명히 드러냈습니다.
  doctrine_reference: preserve theological tension rather than flatten moral psychology
