    그러므로 나는 두 해 동안 주님을 경외하며 금식으로 내 영혼을 괴롭게 했고, 하나님을 경외함을 통하여 시기에서 벗어남이 이루어진다는 것을 알게 되었습니다. 누구든지 주님께 피하면 악한 영이 그에게서 달아나고, 그의 마음은 가벼워집니다. 그러면 그는 시기받는 사람을 동정하고, 그를 사랑하는 사람들을 용서하며,[c] 그렇게 시기를 그치게 됩니다.'
  rationale: 단수 ‘영’의 문법적 수식을 바로잡고, 현대 한국어의 자연스러운 표현과 합쇼체를 유지했습니다. 마지막 대명사의 해석상 모호성은 본문에서 해소하지 않고 각주로 보존했으며, 모든 각주 표지를 해당 어구에 배치했습니다.
