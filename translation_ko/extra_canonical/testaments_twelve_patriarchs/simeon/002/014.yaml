id: T12P.SIM.2.14
reference: Testament of Simeon 2:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἔγνων⁹⁴ γὰρ ὅτι πονηρὸν πρᾶγμα ἐνεθυμήθην ἐνώπιον κυρίου⁹⁵ καὶ⁹⁶ *Ἰακὼβ τοῦ πατρός μου⁹⁷ *διὰ Ἰωσὴφ⁹⁸ *τὸν ἀδελφόν μου, φθονήσας αὐτῷ⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/014.yaml
  text: For I knew that I had conceived an evil deed before the Lord and Jacob my father concerning Joseph my brother, being envious of him.
translation:
  language: ko
  text: 내가 주 앞과 내 아버지 야곱 앞에서, 내 형제 요셉에 관하여 그를 시기하여 악한 일을 마음에 품었음을 알았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεθυμήθην
  english_pob_choice: I had conceived
  chosen_korean: 마음에 품었음을
  alternatives_korean:
  - 생각했음을
  - 품었음을
  - 궁리했음을
  lexicon: ἐνθυμέομαι
  rationale: ‘conceived’에 맞추어 단순한 생각보다 내면에서 계획·의도한 뉘앙스를 살려 ‘마음에 품다’로 옮겼습니다.
- source_word: πρᾶγμα
  english_pob_choice: deed
  chosen_korean: 일
  alternatives_korean:
  - 행동
  - 일
  - 사건
  lexicon: πρᾶγμα
  rationale: 영문 POB의 ‘deed’를 따라 결과가 드러나는 행위성을 살리되, 한국어에서는 자연스러운 ‘일’로 간결하게 표현했습니다.
- source_word: ἐνώπιον κυρίου καὶ Ἰακὼβ τοῦ πατρός μου
  english_pob_choice: before the Lord and Jacob my father
  chosen_korean: 주 앞과 내 아버지 야곱 앞에서
  alternatives_korean:
  - 주님과 내 아버지 야곱 앞에서
  - 주 앞에서 그리고 내 아버지 야곱 앞에서
  lexicon: ἐνώπιον
  rationale: Ἰακώβ를 목적어가 아니라 ‘앞에서’의 대상에 함께 두는 그리스어 구조를 반영해, 두 분 모두 앞이라는 의미가 드러나도록 옮겼습니다.
- source_word: φθονήσας αὐτῷ
  english_pob_choice: being envious of him
  chosen_korean: 시기하여
  alternatives_korean:
  - 그를 시기하여
  - 그에게 질투하여
  - 그를 질투하여
  lexicon: φθονέω
  rationale: 행위의 원인·상태를 간결하게 드러내는 분사 표현을 한국어 연결어 ‘시기하여’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘before the Lord and Jacob my father’의 병렬 관계
  chosen_reading: 야곱을 주와 함께 ‘앞에’ 두어, 죄책의 인식이 하나님 앞뿐 아니라 아버지 앞에서도 성립한다는 본문의 이중 대상을 유지했습니다.
  alternative_readings:
  - ‘주 앞에서, 그리고 내 아버지 야곱에게’처럼 분리하는 번역
  - ‘주와 내 아버지 야곱을 거슬러’처럼 도덕적 반대를 강조하는 번역
  rationale: 그리스어는 ἐνώπιον을 공유하며 병렬을 이루므로, 관계를 임의로 확대해 ‘거슬러’로 바꾸지 않고 원문의 책임 의식을 보존했습니다.
  doctrine_reference: 본문의 양심·죄책 인식에 대한 서술
