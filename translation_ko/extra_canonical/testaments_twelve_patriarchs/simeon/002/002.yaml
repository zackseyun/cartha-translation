id: T12P.SIM.2.2
reference: Testament of Simeon 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐγὼ ἐγεννήθην ἐξ Ἰακὼβ *υἱὸς δεύτερος τῷ πατρὶ μου⁵, *καὶ Λία⁶ ἡ μήτηρ μου ἐκάλεσέ με⁷ Συμεώνα⁸, ὅτι⁹ ἤκουσε Κύριος τῆς δεήσεως αὐτῆς¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/002.yaml
  text: I was born from Jacob, the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.
translation:
  language: ko
  text: 저는 야곱에게서 태어났으며, 제 아버지에게는 둘째 아들이었습니다. 그리고 제 어머니 레아는 저를 시므온이라 불렀습니다. 이는 주께서 그녀의 간구를 들으셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἐξ Ἰακώβ
  english_pob_choice: I was born from Jacob
  chosen_korean: 저는 야곱에게서 태어났으며
  alternatives_korean:
  - 저는 야곱에게서 태어났습니다
  - 저는 야곱에게서 났습니다
  lexicon: γεννάω
  rationale: 출생의 출처를 직접 드러내는 표현으로 옮기되, 한국어 문장 흐름에 맞게 ‘태어났으며’로 연결했습니다.
- source_word: υἱὸς δεύτερος τῷ πατρὶ μου
  english_pob_choice: the second son to my father
  chosen_korean: 제 아버지에게는 둘째 아들이었습니다
  alternatives_korean:
  - 제 아버지에게 둘째 아들이었습니다
  - 제 아버지의 둘째 아들이었습니다
  lexicon: υἱός / δεύτερος
  rationale: 단순한 서수 정보가 아니라 아버지 기준의 가족관계를 나타내므로 ‘에게는’으로 관계를 분명히 했습니다.
- source_word: Συμεώνα
  english_pob_choice: Simeon
  chosen_korean: 시므온
  alternatives_korean:
  - 시몬
  - 시메온
  lexicon: Συμεών
  rationale: 성경 인명으로 널리 쓰이는 음역을 따라 ‘시므온’을 유지했습니다.
- source_word: τῆς δεήσεως αὐτῆς
  english_pob_choice: her petition
  chosen_korean: 그녀의 간구
  alternatives_korean:
  - 그녀의 청원
  - 그녀의 기도
  lexicon: δέησις
  rationale: δέησις는 단순 요청보다 하나님께 드리는 간청의 뉘앙스가 강하므로 ‘간구’가 가장 직접적입니다.
theological_decisions:
- issue: Κύριος의 번역
  chosen_reading: 주께서
  alternative_readings:
  - 하나님께서
  - 주님께서
  rationale: 본문의 Κύριος는 탄식/기도 응답 문맥에서 하나님을 가리키므로, POB 기본 원칙에 따라 ‘주’로 옮겼습니다.
  doctrine_reference: 구약 신명칭 전통 및 주(主) 호칭 일관성
- issue: 인칭 재현과 서사 화자 톤
  chosen_reading: 1인칭 회고체를 유지하되 현대 한국어에서 자연스럽게 평서형으로 정리했습니다.
  alternative_readings:
  - 직역형 어순 유지
  - 더 구어적인 서술
  rationale: 원문의 자기소개 서술을 훼손하지 않으면서도 합쇼체 서술문으로 읽히도록 조정했습니다.
  doctrine_reference: 서사/증언 문체 보존
