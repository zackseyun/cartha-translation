id: T12P.SIM.2.4
reference: Testament of Simeon 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἡ γὰρ καρδία μου ἦν σκληρά, καὶ *τὰ ἤπατά¹⁵ μου ἀκίνητα καὶ τὰ σπλάγχνα μου ἀσυμπαθῆ¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/004.yaml
  text: For my heart was hard, and my liver unmoved, and my inward parts without compassion.
translation:
  language: ko
  text: 그러므로 제 마음은 완고했고, 제 간은 움직이지 않았으며, 제 속은 동정심이 없었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 가슴
  lexicon: καρδία
  rationale: 여기서는 내면의 의지와 정서의 중심을 가리키므로, 한국어 성경의 자연스러운 대응인 ‘마음’이 가장 적절합니다.
- source_word: ἦν σκληρά
  english_pob_choice: was hard
  chosen_korean: 완고했고
  alternatives_korean:
  - 딱딱했고
  - 굳어 있었고
  lexicon: σκληρός
  rationale: 문맥상 단순한 물리적 경도보다 도덕적·정서적 완고함을 나타내므로, 이를 드러내는 ‘완고했고’로 옮겼습니다.
- source_word: τὰ ἤπατά
  english_pob_choice: my liver
  chosen_korean: 제 간은
  alternatives_korean:
  - 제 내장들은
  - 제 창자는
  lexicon: ἧπαρ
  rationale: 원문은 직역상 ‘간’이므로 이를 유지하되, 현대 한국어에서 의미가 낯선 점은 문맥으로 감당하도록 했습니다.
- source_word: ἀκίνητα
  english_pob_choice: unmoved
  chosen_korean: 움직이지 않았으며
  alternatives_korean:
  - 동요하지 않았으며
  - 고요했고
  lexicon: ἀκίνητος
  rationale: 신체 기관의 비유적 정지 상태를 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: τὰ σπλάγχνα μου ἀσυμπαθῆ
  english_pob_choice: my inward parts without compassion
  chosen_korean: 제 속은 동정심이 없었습니다
  alternatives_korean:
  - 제 내장은 불쌍히 여길 줄 몰랐습니다
  - 제 속마음은 무정했습니다
  lexicon: σπλάγχνα / ἀσυμπαθής
  rationale: σπλάγχνα는 내면의 감정·자비의 자리이므로 ‘제 속’으로 풀고, ἀσυμπαθῆ는 ‘동정심이 없었습니다’로 의미를 분명히 했습니다.
theological_decisions:
- issue: 신체 기관을 통한 내면 묘사
  chosen_reading: ‘마음 / 간 / 속’의 병렬을 살려, 죄책과 완고함이 전인격에 퍼진 상태로 읽었습니다.
  alternative_readings:
  - 현대적 의역으로 모두 ‘마음’으로 통일
  - 신체 기관을 주석 없이 삭제
  rationale: 원문은 마음과 간과 내장을 나란히 배치해 내적 완강함과 무자비함을 강조하므로, 시적·수사적 힘을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 인간 내면의 전인적 타락/완고함에 대한 성서적 수사
