  source_fidelity: 원문의 γὰρ는 앞 진술의 근거를 제시하는 접속사이므로 ‘그러므로’가 아니라 ‘이는’ 또는 ‘왜냐하면’으로 옮겨야 합니다. καρδία, ἤπατα, σπλάγχνα의 병렬과 ‘완고함/움직이지 않음/무정함’의 수사도 보존해야 합니다.
  naturalness: ‘제 간은 움직이지 않았으며’는 직역적 장점이 있으나 현대 한국어에서는 다소 기계적으로 들립니다. ‘미동도 하지 않았으며’는 ἀκίνητα의 비유적 무감각을 자연스럽게 전달하면서 기관 병렬을 유지합니다. σπλάγχνα는 ‘속’보다 ‘내장’이 원문의 신체적 표현을 더 충실히 보존합니다.
  terminology: ‘마음’은 καρδία의 내면적 용법에 적절합니다. ‘간’과 ‘내장’은 고대의 정서 기관 표상을 유지하는 번역이며, ἀσυμπαθῆ는 ‘연민이 없었습니다’로 자연스럽고 정확하게 표현할 수 있습니다.
