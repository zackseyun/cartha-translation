  revised_text: 내가 우리 양 떼를 위해 연고를 가져가려고 세겜으로 갔고 르우벤은 도단으로 갔을 때, 거기에는 우리에게 필요한 물품과 모든 비축품이 있었습니다. 내 형제 유다가 이스마엘 사람들에게 그를 팔았습니다.
