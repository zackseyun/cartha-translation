base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/009.yaml
  text: For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.
translation:
  language: ko
  text: 내가 세겜으로 가서 우리 가축 떼를 위해 연고를 가져오고, 르우벤은 도단으로 갔을 때—거기에는 우리에게 필요한 물품과 모든 저장품이 있었습니다—내 형제 유다가 이스마엘 사람들에게 그를 팔았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Σικίμοις / ἐνέγκαι ἄλειμμα
  english_pob_choice: went to Shechem to bring ointment
  chosen_korean: 세겜으로 가서 … 연고를 가져오고
  alternatives_korean:
  - 세겜으로 가서 … 기름을 가져오고
  - 세겜으로 가서 … 도유제를 가져오고
  lexicon: Σίκιμοις → 세겜; ἄλειμμα → 연고
  rationale: POB의 ‘ointment’를 따라 ἄλειμμα는 피부에 바르는 연고로 옮기는 것이 가장 자연스럽고, 본문이 ‘가축 떼를 위한’ 물품이라는 점도 살릴 수 있습니다.
- source_word: τοῖς ποιμνίοις
  english_pob_choice: for our flocks
  chosen_korean: 우리 가축 떼를 위해
  alternatives_korean:
  - 우리 양 떼를 위해
  - 우리 떼를 위해
  lexicon: ποιμνίον → 가축 떼/양 떼
  rationale: 문맥상 목축 집단 전체를 가리키므로, 한국어로는 ‘가축 떼’가 가장 무난하고 포괄적입니다.
- source_word: Δοθαείμ ... τὰ ἐγχρῄζοντα ... πᾶσα ἡ ἀπόθεσις
  english_pob_choice: where our supplies and all our stores were
  chosen_korean: 거기에는 우리에게 필요한 물품과 모든 저장품이 있었습니다
  alternatives_korean:
  - 거기에는 우리에게 필요한 것들과 모든 비축품이 있었습니다
  - 거기에는 우리의 물자와 모든 저장품이 있었습니다
  lexicon: τὰ ἐγχρῄζοντα / ἀπόθεσις → 필요한 물품 / 저장품
  rationale: 두 명사를 구별해 ‘필요한 물품’과 ‘저장품’으로 나누어, 도단이 보급 거점이었다는 영어 POB의 의미를 유지했습니다.
- source_word: ἐπώλησεν αὐτὸν ... τοῖς Ἰσμαηλίταις
  english_pob_choice: Judah my brother sold him to the Ishmaelites
  chosen_korean: 내 형제 유다가 이스마엘 사람들에게 그를 팔았습니다
  alternatives_korean:
  - 내 형제 유다가 그를 이스마엘 사람들에게 팔았습니다
  - 형제 유다가 이스마엘 사람들에게 그를 팔았습니다
  lexicon: Ἰσμαηλίταις → 이스마엘 사람들
  rationale: 족칭을 그대로 살려 ‘이스마엘 사람들’로 옮기고, 문장 주어 관계는 한국어 어순에 맞게 정리했습니다.
theological_decisions:
- issue: 본절의 서술체와 회고의 감정 톤
  chosen_reading: 평서문 회고체로 옮기되 과장된 비탄이나 해석적 감정을 덧붙이지 않았습니다.
  alternative_readings:
  - 더 서사적으로 풀어쓴 문체
  - 감탄조를 섞은 번역
  rationale: 원문은 사실 서술과 위치·보급 정보 제시에 집중하므로, 한국어도 절제된 회고체를 유지하는 것이 source-direct합니다.
  doctrine_reference: source-controlled narrative fidelity
