    rationale: ἐπορεύθην … ἐνέγκαι는 연고를 가져다주기 위한 이동을 나타냅니다. 한국어 ‘가서 가져오다’는 보통 그 장소에서 물건을 취해 화자 쪽으로 가져오는 뜻이므로, 원문의 의미 관계를 흐릴 수 있습니다.
  - severity: low
