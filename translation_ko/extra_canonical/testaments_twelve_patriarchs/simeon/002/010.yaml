- from: 루우벤은 이 말을 듣고 슬퍼했습니다. 그는 아버지에게 그를 안전하게 데려가고자 했기 때문입니다.
  to: 르우벤은 이러한 일을 듣고 슬퍼했습니다. 그는 그를 자기 아버지에게 데려가고 싶어 했기 때문입니다.
  rationale: 원문에 없는 ‘안전하게’를 제거하고, 복수 지시사 ταῦτα와 소유 관계를 더 명확히 반영했습니다. 문체는 현대 표준어 합쇼체로 유지했으며, 통용 인명 표기인 ‘르우벤’을 사용했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:04Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 기본 구조와 인과관계는 대체로 반영했습니다. 그러나 원문 ἀπαγαγεῖν에는 ‘안전하게/무사히’라는 뜻이 없으므로, ‘안전하게’는 삭제해야 합니다. 또한 ταῦτα는 복수이므로 ‘이러한 일을’로 옮기는 편이 원문에 더 가깝습니다.
  naturalness: 합쇼체 문장은 자연스럽습니다. 다만 ‘그는 아버지에게 그를’은 지시 대상이 순간적으로 겹쳐 어색할 수 있으므로 ‘그를 자기 아버지에게’로 어순을 조정하는 것이 더 명료합니다.
  terminology: 성서·유대 전승 관련 한국어 인명 표기에서는 ‘르우벤’이 가장 널리 통용되는 표준적 형태입니다. ‘루우벤’도 음가상 가능하나, 일관성과 독자 인지성을 위해 ‘르우벤’을 권합니다.
  issues:
  - severity: medium
    issue: ‘안전하게’가 원문에 없는 의미를 더합니다.
    rationale: ἀπαγαγεῖν은 ‘데려가다/데리고 돌아가다’를 뜻하며, 본문에는 안전 또는 무사함을 뜻하는 부사나 수식어가 없습니다. 영어 감사본의 ‘safely back’도 그리스어 원문보다 확장된 표현입니다.
  - severity: low
    issue: ταῦτα를 단수 ‘이 말’로 옮겼습니다.
    rationale: ταῦτα는 복수이므로 앞선 발언이나 사건들을 포괄하는 ‘이러한 일을’이 형태상 더 충실합니다.
  - severity: low
    issue: 인명 표기를 ‘루우벤’으로 사용했습니다.
    rationale: 표준 한국어 성서 독자층에서 통용되는 표기는 ‘르우벤’입니다.
  revised_text: 르우벤은 이러한 일을 듣고 슬퍼했습니다. 그는 그를 자기 아버지에게 데려가고 싶어 했기 때문입니다.
  revised_footnotes: []
