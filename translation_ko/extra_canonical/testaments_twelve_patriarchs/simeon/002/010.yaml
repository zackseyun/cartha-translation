id: T12P.SIM.2.10
reference: Testament of Simeon 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ *ὁ Ῥουβὶμ ἀκούσας ταῦτα⁶⁴ ἐλυπήθη⁶⁵. ἤθελε⁶⁶ γὰρ αὐτὸν⁶⁷ ἀπαγαγεῖν⁶⁸ πρὸς τὸν πατέρα⁶⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/010.yaml
  text: And Reuben, hearing these things, was grieved, for he wanted to bring him safely back to his father.
translation:
  language: ko
  text: 루우벤은 이 말을 듣고 슬퍼했습니다. 그는 아버지에게 그를 안전하게 데려가고자 했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Ῥουβὶμ
  english_pob_choice: Reuben
  chosen_korean: 루우벤
  alternatives_korean:
  - 르우벤
  - 르우뱐
  lexicon: 고유명사
  rationale: 히브리어 인명 ראובן을 현대 음역으로 옮겼습니다. 통용형이 일정하지 않아, 본문 음가를 가능한 한 보존하는 쪽을 택했습니다.
- source_word: ἀκούσας ταῦτα
  english_pob_choice: hearing these things
  chosen_korean: 이 말을 듣고
  alternatives_korean:
  - 이것들을 들으며
  - 그 말을 듣고
  lexicon: 청각 동사구
  rationale: 분사구를 한국어 관용에 맞게 연결하여 사건의 즉시성을 살렸고, ταῦτα는 문맥상 앞선 발언 전체를 가리키므로 ‘이 말’을 택했습니다.
- source_word: ἐλυπήθη
  english_pob_choice: was grieved
  chosen_korean: 슬퍼했습니다
  alternatives_korean:
  - 근심했습니다
  - 마음 아파했습니다
  lexicon: 감정 동사
  rationale: 단순한 유감보다 더 강한 내적 슬픔을 드러내되, 과장하지 않는 표준어 표현으로 옮겼습니다.
- source_word: ἀπαγαγεῖν πρὸς τὸν πατέρα
  english_pob_choice: bring him safely back to his father
  chosen_korean: 그를 안전하게 데려가고자 했기 때문입니다
  alternatives_korean:
  - 그를 아버지에게 안전하게 데려가려 했기 때문입니다
  - 그를 아버지께 무사히 데려가고자 했기 때문입니다
  lexicon: 동사구
  rationale: ἀπαγαγεῖν은 단순한 ‘데려오다’보다 ‘데려가다/인도하다’에 가깝고, 영어 POB의 ‘safely back’에 해당하는 안전성은 문맥상 부사로 분명히 드러냈습니다.
theological_decisions:
- issue: 루우벤의 반응과 행위 의도
  chosen_reading: 그는 아버지에게 그를 안전하게 데려가고자 했다고 직접 서술하여, 슬픔과 보호 의도를 함께 보존했습니다.
  alternative_readings:
  - 슬퍼했지만 돌려보내려 했습니다
  - 슬퍼했는데, 아버지에게 데려가려 했습니다
  rationale: 그리스어는 슬픔(ἐλυπήθη)과 의도(ἤθελε … ἀπαγαγεῖν)를 병렬로 제시하므로, 두 요소를 분리하되 인과관계를 자연스럽게 연결했습니다.
  doctrine_reference: 문맥 서술 보존
