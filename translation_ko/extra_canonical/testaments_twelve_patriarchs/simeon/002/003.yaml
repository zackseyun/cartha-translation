  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/003.yaml
  text: For I became very strong; I did not shrink from any deed, nor was I afraid of anything.
translation:
  language: ko
  text: 나는 매우 강해졌기 때문입니다. 나는 어떤 행위도 겁내어 피하지 않았고, 어떤 것도 두려워하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνατὸς ... ἐγενόμην σφόδρα
  english_pob_choice: I became very strong
  chosen_korean: 내가 매우 강해졌기 때문입니다
  alternatives_korean:
  - 나는 매우 강해졌습니다
  - 내가 매우 강력해졌기 때문입니다
  lexicon: Δυνατός
  rationale: ἐγενόμην은 ‘되다/~이 되다’의 변화 서술이므로 단순 형용사보다 ‘강해졌습니다’가 더 직접적이며, σφόδρα는 ‘매우’로 자연스럽게 옮겼습니다.
- source_word: οὐκ ἐδειλίασα πρᾶξιν
  english_pob_choice: I did not shrink from any deed
  chosen_korean: 나는 어떤 행위도 주저하지 않았고
  alternatives_korean:
  - 나는 어떤 일도 두려워하지 않았고
  - 나는 어떤 행위 앞에서도 물러서지 않았고
  lexicon: δειλιάζω / πρᾶξις
  rationale: δειλιάζω는 ‘두려워하여 주저하다/물러서다’의 뉘앙스가 있어 POB의 ‘shrink from’에 맞춰 ‘주저하지 않았다’로 옮겼고, πρᾶξις는 여기서 ‘행위’로 유지했습니다.
- source_word: οὐδὲ ἐφοβήθην ἀπὸ παντὸς πράγματος
  english_pob_choice: nor was I afraid of anything
  chosen_korean: 어떤 것에도 두려워하지 않았습니다
  alternatives_korean:
  - 아무 일에도 두려워하지 않았습니다
  - 어떤 일로부터도 두려워하지 않았습니다
  lexicon: φοβέομαι / πρᾶγμα
  rationale: ἀπὸ παντὸς πράγματος는 관용적으로 ‘무엇이든/어떤 것’의 범위를 나타내므로, POB의 최신 수정에 맞춰 ‘어떤 것에도’로 자연스럽게 표현했습니다.
