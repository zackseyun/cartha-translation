  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/001.yaml
  text: Hear, my children, Simeon your father, and I will declare to you what I have in my heart.
translation:
  language: ko
  text: 들으십시오, 나의 자녀들아. 너희 아버지 시므온인 내가 내 마음에 있는 것을 너희에게 알려 주겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  - 들으세요
  lexicon: ἀκούω
  rationale: 직접 호소의 명령을 합쇼체로 옮겨, 청중에게 주의를 환기하는 개시 명령의 힘을 살렸습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  - 내 자녀들
  lexicon: τέκνον
  rationale: 부드러운 친자 관계를 보존하되, 현대 한국어에서 자연스럽고 공적 낭독에도 적합한 호칭으로 옮겼습니다.
- source_word: Συμεὼν τοῦ πατρὸς ὑμῶν
  english_pob_choice: Simeon your father
  chosen_korean: 너희의 아버지 시므온
  alternatives_korean:
  - 너희 아버지 시므온
  - 시므온 너희의 아버지
  lexicon: Συμεών / πατήρ
  rationale: 소유 관계를 분명히 하면서도 한국어 어순에 맞게 배열하여, 화자가 자신을 아버지로 부르는 문장을 자연스럽게 전달했습니다.
- source_word: ἐν τῇ καρδίᾳ μου
  english_pob_choice: in my heart
  chosen_korean: 마음에 품고 있는 것
  alternatives_korean:
  - 내 마음속에 있는 것
  - 내 마음에 있는 것
  - 내 심장에 있는 것
  lexicon: καρδία
  rationale: καρδία의 내적 중심 의미를 한국어 관용에 따라 '마음에 품고 있는 것'으로 풀어, 단순한 신체기관이 아니라 내면의 생각과 부담을 나타냈습니다.
theological_decisions:
- issue: 화자의 자기소개와 권위 표현
  chosen_reading: 시므온은 자신을 ‘너희의 아버지’로 부르며 유언적 권위를 가지고 말을 시작합니다.
  alternative_readings:
  - 단순한 혈연 소개로만 읽기
  - 형식적 호칭 없이 바로 내용으로 들어가기
  rationale: 본문의 호칭은 단순 정보 전달이 아니라 자녀들에게 유훈을 전하는 권위 있는 서두이므로, 그 기능이 드러나도록 문장을 배치했습니다.
  doctrine_reference: 문학적-서사적 화자 기능
