source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐγὼ δὲ⁷⁰ *ταῦτα ἀκούσας⁷¹ ὠργίσθην ἐπὶ⁷² τὸν⁷³ Ἰούδαν⁷⁴ Γσφόδρα⁷⁵, ὅτι⁷⁶ ζῶντα αὐτὸν ἀπέλυσεν· καὶ *ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ⁷⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/011.yaml
  text: But when I heard this, I was very angry with Judah, because he had let him go alive; and for five months I remained angry with him.
translation:
  language: ko
  text: 그런데 내가 이것들을 듣고 나서 유다에게 매우 화를 냈습니다. 그가 그를 살아서 놓아주었기 때문입니다. 그리고 나는 다섯 달 동안 그에게 화가 난 채 지냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθην ἐπὶ τὸν Ἰούδαν σφόδρα
  english_pob_choice: I was very angry with Judah
  chosen_korean: 유다에게 매우 화를 냈습니다
  alternatives_korean:
  - 유다를 몹시 분노했습니다
  - 유다에게 크게 분노했습니다
  lexicon: ὀργίζομαι
  rationale: 상태 묘사인 ‘화가 나다’와 능동적 감정 표출을 모두 살릴 수 있도록 자연스러운 합쇼체로 옮겼습니다. σφόδρα는 ‘매우’로 강도를 드러냈습니다.
- source_word: ζῶντα αὐτὸν ἀπέλυσεν
  english_pob_choice: he had let him go alive
  chosen_korean: 그가 그를 살아서 놓아주었기 때문입니다
  alternatives_korean:
  - 그를 산 채로 풀어주었기 때문입니다
  - 그를 살아 있는 채로 놓아주었기 때문입니다
  lexicon: ἀπολύω
  rationale: ‘살아서’는 ζῶντα의 상태를 직접 반영하고, ἀπέλυσεν은 ‘놓아주다’로 자연스럽게 옮겨 원인절의 분노 이유를 분명히 했습니다.
- source_word: ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ
  english_pob_choice: for five months I remained angry with him
  chosen_korean: 나는 다섯 달 동안 그에게 화가 난 채 지냈습니다
  alternatives_korean:
  - 나는 다섯 달 동안 그에게 계속 화를 냈습니다
  - 나는 다섯 달 동안 그에게 분노한 상태로 있었습니다
  lexicon: μῆνας πέντε ... ὀργιζόμενος ἐπʼ αὐτῷ
  rationale: 직역하면 ‘다섯 달을 분노하며 지냈다’이지만, 한국어에서는 지속 상태를 ‘화가 난 채 지내다’로 표현하는 것이 가장 자연스럽습니다.
theological_decisions:
- issue: 서술체의 감정 표현 강도
  chosen_reading: 이 구절은 회개의 고백이 아니라 형제 유다에 대한 지속적 분노의 회고로 읽었습니다.
  alternative_readings:
  - 도덕적 비난의 진술
  - 개인적 감정 과장의 수사
  rationale: 본문은 원인(살아서 놓아줌)과 지속 기간(다섯 달)을 함께 제시하여, 순간적 격분이 아니라 오래 지속된 분노를 강조합니다.
  doctrine_reference: 본문 맥락 해설
