id: T12P.SIM.2.13
reference: Testament of Simeon 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
translation:
  language: ko
  text: 그리고 나는, 내 자녀들아, 이것이 요셉 때문에 내게 일어난 일인 줄 알았습니다. 그리고 회개한 뒤 울며 주 하나님께 내 손이 회복되게 해 달라고, 또 내가 모든 더러움과 시기와 모든 어리석음에서 멀리하게 해 달라고 기도했습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 자녀들아
  lexicon: τέκνα
  rationale: 호칭 기능을 살리되 현대 한국어에서 자연스러운 친밀한 부름으로 옮겼습니다.
- source_word: μετανοήσας
  english_pob_choice: after repenting
  chosen_korean: 회개한 뒤
  alternatives_korean:
  - 돌이킨 뒤
  - 생각을 바꾼 뒤
  lexicon: μετανοέω
  rationale: 개정된 POB의 판단을 따라 단순한 심경 변화가 아니라 죄를 깨닫고 돌이키는 회개의 의미를 반영했습니다.
- source_word: Κυρίῳ τῷ Θεῷ
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 여호와 하나님
  - 주님 하나님
  lexicon: κύριος + θεός
  rationale: 본문의 하나님 칭호를 합쳐 자연스럽게 옮기되, 직접 호칭이 아니므로 지나친 경어형은 피했습니다.
- source_word: ἀποκατασταθῇ ἡ χείρ μου
  english_pob_choice: my hand might be restored
  chosen_korean: 내 손이 회복되게 해 달라고
  alternatives_korean:
  - 내 손이 회복되기를
  - 내 손이 다시 놓이게 해 달라고
  lexicon: ἀποκαθίστημι
  rationale: 단순한 치유가 아니라 원상 회복의 뜻을 살려 능동적 기원을 한국어로 자연스럽게 풀었습니다.
- source_word: παντὸς μολυσμοῦ καὶ φθόνου ... πάσης ἀφροσύνης
  english_pob_choice: every defilement and envy and from all foolishness
  chosen_korean: 모든 더러움과 시기와 모든 어리석음
  alternatives_korean:
  - 모든 부정함과 시기와 모든 어리석음
  - 모든 더러움과 질투와 모든 어리석음
  lexicon: μολυσμός, φθόνος, ἀφροσύνη
  rationale: μολυσμοῦ는 의례적/도덕적 오염을 아우르는 폭넓은 ‘더러움’으로, φθόνου는 POB의 ‘envy’에 맞춰 ‘시기’로 옮겼습니다.
theological_decisions:
- issue: 회개 표현의 강도
  chosen_reading: μετανοήσας를 ‘회개한 뒤’로 옮겨 단순한 후회가 아니라 방향 전환과 하나님께 돌아섬을 드러냈습니다.
  alternative_readings:
  - 생각을 바꾼 뒤
  - 마음을 돌린 뒤
  rationale: 영어 POB의 수정판이 이미 repent를 채택했으므로, 본문 맥락상 윤리적·신앙적 전환을 분명히 하는 번역이 더 적절합니다.
  doctrine_reference: 회개/뉘우침의 구별
- issue: 주 하나님 호칭의 격식
  chosen_reading: Κυρίῳ τῷ Θεῷ를 ‘주 하나님’으로 옮겨 기도문 안의 직접 호칭이지만, 한국어 합쇼체 본문 흐름과 충돌하지 않게 했습니다.
  alternative_readings:
  - 주님 하나님
  - 주 여호와 하나님
  rationale: 원문은 정중한 기도 체이므로 존칭을 유지하되, 본문의 어휘를 과도하게 확장하지 않았습니다.
  doctrine_reference: 하나님 호칭과 기도문 번역
