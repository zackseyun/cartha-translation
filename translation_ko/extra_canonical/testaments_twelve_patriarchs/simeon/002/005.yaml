    issue: ‘영혼과 몸 안에’의 부자연스럽고 과도하게 공간적인 표현
    rationale: ἐν ψυχαῖς καὶ σώμασιν은 영혼과 몸이라는 존재의 차원에서/에 주어짐을 뜻합니다. 한국어 ‘안에’는 불필요하게 물리적 내부성을 강화하므로 ‘영혼과 몸에’가 적절합니다.
