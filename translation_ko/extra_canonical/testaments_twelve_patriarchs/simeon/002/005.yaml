- from: 용기도 또한 가장 높으신 분에게서 사람들에게 영혼과 몸 안에 주어집니다.[a]
  to: 용기 역시 지극히 높으신 분에게서 사람들에게 영혼과 몸에 주어집니다.
  rationale: 한국어 어법상 어색한 ‘안에’를 ‘에’로 바로잡고, 성서적 칭호의 관용적 표현을 사용했습니다. 원문의 수여 주체, 수여 대상, 그리고 영혼과 몸의 병렬을 보존했으며, 내용 없는 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
