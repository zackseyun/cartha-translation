  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/005.yaml
  text: For courage also is given by the Most High to men in soul and body.
translation:
  language: ko
  text: 용기 역시 지극히 높으신 분에게서 사람들에게 영혼과 몸에 주어집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀνδρεία
  english_pob_choice: courage
  chosen_korean: 용기
  alternatives_korean:
  - 담대함
  - 용맹
  lexicon: ἀνδρεία
  rationale: 행동상의 내적 담대함을 가리키므로, 현대 한국어에서 가장 자연스러운 ‘용기’로 옮겼습니다.
- source_word: ἀπὸ ὑψίστου
  english_pob_choice: by the Most High
  chosen_korean: 가장 높으신 분에게서
  alternatives_korean:
  - 지극히 높으신 분에게서
  - 지존자에게서
  lexicon: ὕψιστος
  rationale: 하나님을 가리키는 칭호로서 ‘가장 높으신 분’이 직역성과 가독성을 함께 살립니다.
- source_word: τοῖς ἀνθρώποις
  english_pob_choice: to men
  chosen_korean: 사람들에게
  alternatives_korean:
  - 사람에게
  - 인간들에게
  lexicon: ἄνθρωπος
  rationale: 일반 인간을 가리키는 복수 대상이므로 성별을 제한하지 않는 ‘사람들에게’가 적절합니다.
- source_word: ἐν ψυχαῖς καὶ σώμασιν
  english_pob_choice: in soul and body
  chosen_korean: 영혼과 몸 안에
  alternatives_korean:
  - 영혼과 몸에
  - 영혼과 육체 안에
  lexicon: ψυχή / σῶμα
  rationale: 그리스어 전치사 ἐν의 포괄성을 살려 ‘안에’를 유지하되, 한국어 어법상 자연스럽게 배치했습니다.
theological_decisions:
- issue: 인간 구성 요소 표현
  chosen_reading: ‘영혼과 몸’으로 옮겨 인간의 내적·외적 차원을 함께 지칭하는 문맥을 보존했습니다.
  alternative_readings:
  - ‘영과 몸’
  - ‘마음과 몸’
  rationale: 본문은 ψυχή와 σῶμα의 병치를 통해 용기가 단지 정신력만이 아니라 전인적 차원에서 주어진다는 점을 말합니다. 한국어에서도 이 긴장을 지키는 것이 가장 충실합니다.
  doctrine_reference: 인간론
