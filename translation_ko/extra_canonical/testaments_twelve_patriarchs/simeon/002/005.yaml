  source_fidelity: 그리스어 ἡ ἀνδρεία, ἀπὸ ὑψίστου, τοῖς ἀνθρώποις, ἐν ψυχαῖς καὶ σώμασιν의 의미는 대체로 충실하게 반영되었습니다. 다만 ἐν을 ‘안에’로 옮긴 표현은 한국어에서 부자연스럽고, 여기서는 인간의 영혼과 몸이라는 차원·영역을 나타내므로 ‘영혼과 몸에’가 더 정확하고 자연스럽습니다.
  naturalness: ‘영혼과 몸 안에’는 현대 표준 한국어에서 용기가 머무는 물리적 내부처럼 들려 어색합니다. ‘영혼과 몸에 주어집니다’는 원문의 병렬과 포괄성을 유지하면서 자연스럽습니다. ‘가장 높으신 분’도 이해 가능하나, 성서적 칭호로는 ‘지극히 높으신 분’이 더 관용적이고 격식에 맞습니다.
  terminology: ἀνδρεία는 ‘용기’, ἄνθρωποι는 성별을 한정하지 않는 ‘사람들’, ψυχαῖς/σώμασιν은 ‘영혼과 몸’으로 유지합니다. ὕψιστος는 고유한 신적 칭호의 성격을 살려 ‘지극히 높으신 분’으로 옮깁니다.
  issues:
