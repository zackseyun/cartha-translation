  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/006.yaml
  text: For in the time of my youth I was very jealous of Joseph, because my father loved him above all.
translation:
  language: ko
  text: 내 젊은 시절에 나는 요셉을 몹시 질투하였는데, 내 아버지가 그를 모든 사람보다 사랑하셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου
  english_pob_choice: For in the time of my youth
  chosen_korean: 내 젊은 시절에
  alternatives_korean:
  - 내 청년기에
  - 내 젊은 때에
  lexicon: καιρός / νεότης
  rationale: 시간적 배경을 자연스러운 현대 한국어로 간결하게 옮기되, ‘젊은 시절’로 νεότης의 생애 초기 뉘앙스를 살렸습니다.
- source_word: ἐζήλωσα
  english_pob_choice: I was very jealous
  chosen_korean: 몹시 질투하였는데
  alternatives_korean:
  - 매우 질투하였는데
  - 심히 시기하였는데
  lexicon: ζηλόω
  rationale: 문맥상 요셉에 대한 경쟁적 감정이므로 ‘질투하다’가 가장 직접적이며, 정도 부사 ‘몹시’로 영어 POB의 강한 표현을 반영했습니다.
- source_word: ἠγάπα
  english_pob_choice: loved
  chosen_korean: 사랑하셨기 때문입니다
  alternatives_korean:
  - 사랑하였기 때문입니다
  - 아끼셨기 때문입니다
  lexicon: ἀγαπάω
  rationale: ἀγαπάω의 기본 의미를 ‘사랑하다’로 유지하고, 아버지의 행위를 공손체로 자연스럽게 처리했습니다.
- source_word: ὑπὲρ πάντας
  english_pob_choice: above all
  chosen_korean: 모든 사람보다
  alternatives_korean:
  - 모두보다
  - 모든 이보다
  lexicon: comparative phrase
  rationale: ‘above all’의 비교 의미를 한국어 비교구문으로 분명히 드러냈습니다.
theological_decisions:
- issue: 화자 자신의 과거 감정 고백의 어조
  chosen_reading: 서술체를 유지하되 끝맺음을 공손체로 맞춰, 회고적 고백의 솔직함을 살렸습니다.
  alternative_readings:
  - 보다 직설적인 평서형으로 옮길 수 있음
  - 더 완곡하게 ‘시기했습니다’로 낮출 수 있음
  rationale: 이 구절은 윤리적 자기고백이므로 의미를 완화하지 않고, 현대 한국어 독자가 즉시 이해할 수 있는 고백체로 옮기는 것이 적절합니다.
  doctrine_reference: 서사적 자기고백의 직접성 보존
