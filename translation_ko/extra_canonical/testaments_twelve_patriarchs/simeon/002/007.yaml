  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: καὶ²⁹ ἐστήριξα³⁰ ἐπʼ³¹ αὐτὸν τὰ ἤπατά μου ὥστε³² ἀνελεῖν αὐτόν, *ὅτι ὁ ἄρχων³³ τῆς πλάνης καὶ³⁴ τὸ πνεῦμα τοῦ ζήλου³⁵ ἐτύφλωσέ μου τὸν νοῦν, *μὴ προσέχειν³⁶ *αὐτῷ ὡς ἀδελφῷ³⁷, μηδὲ³⁸ φείσασθαι *τῷ πατρί μου Ἰακὼβ³⁹.
