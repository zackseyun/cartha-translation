base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/007.yaml
  text: And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.
translation:
  language: ko
  text: 그리고 나는 그를 죽이려고 내 창자를 그에게 겨누었습니다. 그 까닭은 속임수의 통치자와 질투의 영이 그의 신이었기 때문입니다. 그리고 우리 조상들의 하나님이 그의 천사를 보내어 그의 손에서 그를 구해 내셨습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστήριξα ἐπʼ αὐτὸν τὰ ἤπατά μου
  english_pob_choice: I set my liver against him
  chosen_korean: “내 창자를 그에게 겨누었습니다”
  alternatives_korean:
  - 내 간을 그에게 고정했습니다
  - 내 간을 그에게 들이댔습니다
  - 내 속을 그에게 맞섰습니다
  lexicon: ἤπαρ
  rationale: 직역하면 ‘간’이지만, 한국어에서 ‘간을 겨누다/맞서다’는 관용이 자연스럽지 않아, 신체기관의 거친 비유를 살리면서도 의미가 통하도록 ‘창자를 겨누다’로 옮겼습니다.
- source_word: ὁ ἄρχων τῆς πλάνης
  english_pob_choice: the ruler of deceit
  chosen_korean: “속임수의 통치자”
  alternatives_korean:
  - 속임수의 군주
  - 기만의 지배자
  - 미혹의 통치자
  lexicon: ἄρχων
  rationale: ἄρχων의 지배자/통치자 뉘앙스를 살렸고, πλάνη는 ‘미혹’보다 여기 문맥의 도덕적 기만성을 드러내는 ‘속임수’가 더 직접적이라고 보았습니다.
- source_word: τὸ πνεῦμα τοῦ ζήλου
  english_pob_choice: the spirit of jealousy
  chosen_korean: “질투의 영”
  alternatives_korean:
  - 시기의 영
  - 열심의 영
  - 질투심의 영
  lexicon: πνεῦμα
  rationale: 여기서 πνεῦμα는 악한 영향력을 가리키는 비인격적/영적 실체로 읽혀 ‘영’을 유지했고, ζῆλος는 긍정적 열심이 아니라 문맥상 질투이므로 ‘질투’로 옮겼습니다.
- source_word: ἐτύφλωσέ μου τὸν νοῦν
  english_pob_choice: blinded my mind
  chosen_korean: “내 마음을 눈멀게 했습니다”
  alternatives_korean:
  - 내 생각을 어둡게 했습니다
  - 내 정신을 멀게 했습니다
  - 내 이성을 흐리게 했습니다
  lexicon: νοῦς
  rationale: νοῦς는 단순한 이성이 아니라 판단과 인식을 아우르는 마음/마음의 작용을 가리키므로, 한국어에서는 ‘마음을 눈멀게 하다’가 인과와 이미지를 가장 잘 살립니다.
- source_word: ἀνελεῖν αὐτόν
  english_pob_choice: to kill him
  chosen_korean: “그를 죽이려고”
  alternatives_korean:
  - 그를 없애려고
  - 그를 살해하려고
  lexicon: ἀναιρέω
  rationale: 행동 의도를 분명히 드러내는 일반적 표현으로 옮겼으며, 과도하게 현대 법률어화된 ‘살해’보다 본문의 서술성을 보존하는 ‘죽이려고’를 택했습니다.
theological_decisions:
- issue: 악한 영들의 인격성과 인간 인식의 왜곡
  chosen_reading: ‘속임수의 통치자’와 ‘질투의 영’이 시므온의 판단을 눈멀게 하여 형제애와 부친에 대한 절제를 무너뜨린 것으로 옮겼습니다.
  alternative_readings:
  - 단순한 내적 감정 상태로 완화하는 번역
  - 비인격적 은유로만 처리하는 번역
  rationale: 본문은 외부의 영적 영향이 생각과 판단을 왜곡하여 살해 의도에 이르게 했다고 말하므로, 악한 영적 주체성을 흐리지 않도록 번역했습니다.
  doctrine_reference: 악의 영적 기원과 인간 책임을 함께 드러내는 본문 해석
- issue: ‘그의 신이었기 때문입니다’의 보존
  chosen_reading: 최신 교정이 제시한 Greek line에 따라 ‘질투의 영이 그의 신이었기 때문입니다’ 구조를 유지했습니다.
  alternative_readings:
  - 원문에 없는 후대 확장 문구를 포함하는 번역
  - 해당 절을 다른 전승과 혼합하는 번역
  rationale: 이 절은 해당 그리스어 본문 자체의 문장을 따라야 하므로, 다른 전승의 문구를 끼워 넣지 않고 현재 본문이 말하는 바를 그대로 반영했습니다.
  doctrine_reference: 본문 비평 및 전승 구분
