    rationale: ‘창자’는 ἤπατα(간들)에 해당하지 않으며, ‘창자를 그에게 겨누다’는 한국어 표현으로도 어색합니다. 관용적 의미를 본문에 반영하고 문자적 신체 비유는 각주로 보존하는 편이 안전합니다.
