revisions:
- from: 그리고 나는 그를 죽이려고 내 창자를 그에게 겨누었습니다. 그 까닭은 속임수의 통치자와 질투의 영이 그의 신이었기 때문입니다. 그리고 우리 조상들의 하나님이 그의 천사를 보내어 그의 손에서 그를 구해 내셨습니다.[a][b][c]
  to: 그리고 나는 그를 죽이려고 그에게 맞서 마음을 단단히 먹었습니다.[a] 이는 속임수의 통치자와 질투의 영이 내 마음을 눈멀게 하여, 그를 형제로 여기지 않고 내 아버지 야곱조차 아끼지 않게 했기 때문입니다.
  rationale: 제시된 Charles 1908 그리스어를 우선하여, 초안에 혼입된 비원문적 내용을 제거하고 원문의 모든 절을 복원했습니다. 원문의 ‘간’ 비유는 한국어 본문에서 자연스러운 결의 표현으로 옮기고 각주에서 문자적 표현과 기능을 밝혔습니다. 신학적 해석을 추가하지 않고, 악한 영향력이 화자의 판단을 흐려 형제와 아버지에게 무정하게 되었다는 원문의 진술을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:10Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 제시된 그리스어 본문에 없는 ‘그의 신이었기 때문입니다’와 ‘우리 조상들의 하나님이 … 구해 내셨습니다’를 삽입하고, 원문의 ‘내 마음을 눈멀게 하여 … 않게 했다’라는 인과절 및 형제와 아버지 야곱에 관한 진술을 누락합니다. 원문을 따라 살해 의도, 속임수의 통치자와 질투의 영, 판단의 눈멂, 형제 및 아버지에 대한 태도를 모두 복원해야 합니다.
  naturalness: ‘창자를 그에게 겨누었습니다’는 한국어에서 자연스러운 관용이 아니며, 원문의 신체기관 비유를 직역한 흔적도 정확하지 않습니다(ἤπατα는 ‘간들’). 의미를 자연스럽게 옮기되 각주에서 문자적 표현을 밝혀 ‘마음을 단단히 먹었습니다’로 처리하는 것이 적절합니다.
  terminology: ἄρχων τῆς πλάνης는 ‘속임수의 통치자’, τὸ πνεῦμα τοῦ ζήλου는 문맥상 ‘질투의 영’으로 유지할 수 있습니다. νοῦς는 이 문맥에서 판단·인식의 기능이므로 ‘마음을 눈멀게 하다’가 적절합니다. ‘아끼지 않다’는 φείσασθαι의 ‘봐주다/아끼다’의 뜻을 자연스럽게 전달합니다.
