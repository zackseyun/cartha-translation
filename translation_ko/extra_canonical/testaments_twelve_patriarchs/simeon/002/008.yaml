source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλ᾿ ὁ θεὸς⁴⁰ αὐτοῦ καὶ⁴¹ ὁ θεὸς *τῶν πατέρων⁴² ἡμῶν⁴³ *ἀπέστειλε τὸν ἄγγελον αὐτοῦ καὶ⁴⁴ ἐρρύσατο⁴⁵ αὐτὸν ἐκ τῶν χειρῶν μου⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/008.yaml
  text: But his God and the God of our fathers sent his angel and rescued him from my hands.
translation:
  language: ko
  text: 그러나 그의 하나님과 우리 조상의 하나님은 그의 천사를 보내셔서 그를 내 손에서 구해 내셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς αὐτοῦ / ὁ θεὸς τῶν πατέρων ἡμῶν
  english_pob_choice: But his God and the God of our fathers
  chosen_korean: 그의 하나님과 우리 조상의 하나님
  alternatives_korean:
  - 그의 하나님과 우리 조상들의 하나님
  - 그의 하나님과 우리 선조들의 하나님
  lexicon: Θεός → 하나님
  rationale: 직역에 가깝게 두 호칭을 병렬로 유지해, 개인적 언약 관계와 공동체적 조상 전승을 함께 드러냈습니다.
- source_word: ἀπέστειλε
  english_pob_choice: sent
  chosen_korean: 보내셔서
  alternatives_korean:
  - 파견하셔서
  - 보내어
  lexicon: ἀποστέλλω → 보내다
  rationale: 천사를 주체적으로 파견하시는 하나님의 행위를 자연스러운 서술형으로 옮겼습니다.
- source_word: τὸν ἄγγελον αὐτοῦ
  english_pob_choice: his angel
  chosen_korean: 그의 천사
  alternatives_korean:
  - 그의 사자
  - 그의 메신저
  lexicon: ἄγγελος → 천사
  rationale: 문맥상 신적 사자를 가리키므로 한국어 성서어휘에서 가장 직접적인 ‘천사’를 선택했습니다.
- source_word: ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου
  english_pob_choice: rescued him from my hands
  chosen_korean: 그를 내 손에서 구해 내셨습니다
  alternatives_korean:
  - 그를 내 손에서 건져 내셨습니다
  - 그를 내 손아귀에서 구출하셨습니다
  lexicon: ῥύομαι → 구해 내다
  rationale: ‘손에서’라는 지배·해방의 이미지를 살리면서, 현대 한국어에서 자연스럽고 강한 구원 표현으로 옮겼습니다.
theological_decisions:
- issue: '하나님의 개입 방식: 천사를 통한 구원'
  chosen_reading: 하나님이 자신의 천사를 보내셔서 인간의 폭력적 손에서 사람을 구해 내십니다.
  alternative_readings:
  - 단순히 우연히 살아남았다는 뜻으로 완화
  - 천사를 생략하고 하나님만을 언급
  rationale: 본문은 구원이 직접적 신적 개입과 천사 파송을 통해 이루어졌음을 분명히 하므로, 그 구조를 유지해야 합니다.
  doctrine_reference: 섭리와 천사 이해
