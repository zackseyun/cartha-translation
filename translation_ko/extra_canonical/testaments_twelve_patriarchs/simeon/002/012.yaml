  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καίγε συνετρίβει με *ὁ Κύριος⁷⁸ καὶ ἐκώλυσεν δράσιν⁷⁹ *ἀπʼ ἐμοῦ⁸⁰. *ὅτι ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν ἐπὶ ἡμέρας ἑπτά⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/012.yaml
  text: And the Lord crushed me and held back action from me, for my right hand became half-withered for seven days.
translation:
  language: ko
  text: 그런데 주님께서 저를 짓누르시고 제게서 행동을 막으셨습니다. 왜냐하면 제 오른손이 이레 동안 반쯤 말라 버렸기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετρίβει με ὁ Κύριος
  english_pob_choice: the Lord crushed me
  chosen_korean: 주님께서 저를 짓누르시고
  alternatives_korean:
  - 주님께서 저를 부수시고
  - 주님께서 저를 산산이 부수시고
  lexicon: συντρίβω
  rationale: 완전한 파괴보다 강하게 눌러 꺾는 이미지를 살리면서, 고문적·영적 압박의 뉘앙스를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  english_pob_choice: held back action from me
  chosen_korean: 제게서 행동을 막으셨습니다
  alternatives_korean:
  - 제게서 행위를 멈추게 하셨습니다
  - 제게서 움직임을 가로막으셨습니다
  lexicon: κωλύω + δράσις
  rationale: ‘행동/행함’의 일반 의미를 살리되, 주어의 의지를 외적으로 제지한 뜻을 분명히 하기 위해 ‘막으셨습니다’를 택했습니다.
- source_word: ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν
  english_pob_choice: my right hand became half-withered
  chosen_korean: 제 오른손이 이레 동안 반쯤 말라 버렸기 때문입니다
  alternatives_korean:
  - 제 오른손이 반쯤 말라 버렸기 때문입니다
  - 제 오른손이 반쯤 마른 상태가 되었기 때문입니다
  lexicon: ἡμίξηρος γέγονεν
  rationale: half-withered를 직역하되, 한국어에서 자연스러운 병리 상태 표현인 ‘반쯤 말라 버렸습니다’를 사용해 신체적 손상을 분명히 했습니다.
theological_decisions:
- issue: 주님(ὁ Κύριος)의 호칭
  chosen_reading: 본문의 κύριος를 전통적 기독론적 ‘주님’으로 번역했습니다.
  alternative_readings:
  - ‘주’
  - ‘주인’
  rationale: 이 문맥에서 인격적 주권자에 대한 호칭이므로, 한국어 독자가 신적 권위를 즉시 인식하도록 ‘주님’을 유지했습니다.
  doctrine_reference: 신적 칭호 번역 관례
- issue: 직접적 징계의 강도
  chosen_reading: ‘짓누르시고’와 ‘막으셨습니다’를 함께 써서, 단순한 방해가 아니라 강한 제어와 징계의 이미지를 살렸습니다.
  alternative_readings:
  - ‘방해하셨습니다’
  - ‘제지하셨습니다’
  rationale: 그리스어 동사의 강한 제약성을 약화하지 않으면서도, 본문이 말하는 하나님의 직접 개입을 한국어로 분명히 드러냅니다.
  doctrine_reference: 섭리와 징계의 언어
