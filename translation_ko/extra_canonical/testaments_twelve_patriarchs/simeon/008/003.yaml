review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문은 ‘이집트인들이 요셉의 뼈를 왕들의 무덤에 보관하고 있었다’고만 말합니다. 초안의 ‘그를 올려 보내려고’는 제시된 그리스어에 목적을 나타내는 부정사나 접속절이 없으므로 근거 없이 추가된 내용입니다. 또한 γάρ는 이유·설명의 접속사이므로 ‘그런데’라는 역접 처리는 맞지 않습니다.
  naturalness: ‘이는 … 있었습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 문맥상 앞 진술에 대한 설명을 연결하는 γάρ의 기능도 살립니다. 한국어에서는 복수 무덤을 반드시 ‘무덤들’로 표시하지 않아도 자연스럽게 포괄할 수 있습니다.
  terminology: ‘이집트인들’, ‘요셉의 뼈’, ‘왕들의 무덤’, ‘보관하고 있었습니다’는 각각 Αἰγύπτιοι, ὀστᾶ τοῦ Ἰωσὴφ, μνήμασι τῶν βασιλέων, ἐφύλαττον을 무리 없이 반영합니다. ‘유골’보다 ‘뼈’가 원문의 직접성을 더 잘 보존합니다.
  issues:
  - severity: high
    issue: 원문에 없는 목적절이 첨가되었습니다.
    rationale: ‘그를 올려 보내려고’에 해당하는 목적 표현은 제공된 그리스어 본문에 없습니다. 영어 감사 이력의 ‘so as to bring him up’도 제시된 원문과 일치하지 않으므로, 원어 우선 원칙에 따라 한국어 번역에는 포함할 수 없습니다.
  - severity: medium
    issue: γάρ를 ‘그런데’로 옮겨 논리 관계가 바뀌었습니다.
    rationale: γάρ는 일반적으로 이유나 설명을 표시하며, 역접을 뜻하지 않습니다. ‘이는’으로 옮겨 설명적 연결을 보존했습니다.
  revised_text: 이는 이집트인들이 요셉의 뼈를 왕들의 무덤에 보관하고 있었기 때문입니다.
  revised_footnotes: []
  revision_rationale: 목적절과 대명사 ‘그’를 삭제하여 제공된 그리스어 본문에만 충실하게 했습니다. γάρ의 설명·이유 기능은 ‘이는 … 때문입니다’로 반영했습니다. 원문에 붙은 13–16 표지는 그 내용이 제공되지 않았으므로 임의의 주석이나 앵커를 만들지 않았습니다.
