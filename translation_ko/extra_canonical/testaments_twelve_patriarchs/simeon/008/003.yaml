id: T12P.SIM.8.3
reference: Testament of Simeon 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Τὰ γὰρ ὀστᾶ τοῦ Ἰωσὴφ ἐφύλαττον¹³ *οἱ Αἰγύπτιοι¹⁴ ἐν τοῖς μνήμασι¹⁵ τῶν βασιλέων¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/003.yaml
  text: For the Egyptians were keeping Joseph’s bones in the tombs of the kings, so as to bring him up.
translation:
  language: ko
  text: 그런데 이집트 사람들은 그를 올려 보내려고 왕들의 무덤들에 요셉의 뼈를 보관하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ γὰρ ὀστᾶ τοῦ Ἰωσὴφ
  english_pob_choice: Joseph’s bones
  chosen_korean: 요셉의 뼈
  alternatives_korean:
  - 요셉의 유골
  - 요셉의 뼈들
  lexicon: ὀστά
  rationale: Greek의 ὀστᾶ는 신체의 ‘뼈’를 가리키며, POB 영어도 Joseph’s bones로 좁게 잡으므로 ‘유골’보다 직접적인 ‘뼈’를 택했습니다.
- source_word: οἱ Αἰγύπτιοι
  english_pob_choice: the Egyptians
  chosen_korean: 이집트 사람들
  alternatives_korean:
  - 이집트인들
  - 애굽 사람들
  lexicon: Αἰγύπτιοι
  rationale: 현대 한국어에서 자연스럽고 표준적인 민족명으로 옮겼으며, 고전 문맥에서 ‘애굽’보다 ‘이집트’가 더 직접적입니다.
- source_word: ἐφύλαττον
  english_pob_choice: were keeping
  chosen_korean: 보관하고 있었습니다
  alternatives_korean:
  - 지키고 있었습니다
  - 간직하고 있었습니다
  lexicon: φυλάσσω
  rationale: 단순 보존 상태를 나타내는 문맥이므로 ‘지키다’보다 소유·보존의 의미가 살아 있는 ‘보관하다’가 적절합니다.
- source_word: ἐν τοῖς μνήμασι τῶν βασιλέων
  english_pob_choice: in the tombs of the kings
  chosen_korean: 왕들의 무덤들에
  alternatives_korean:
  - 왕들의 무덤 안에
  - 왕들의 묘실에
  lexicon: μνῆμα
  rationale: μνήμα는 묘/무덤을 뜻하므로 복수성을 살려 ‘무덤들’로 옮겼고, 위치는 한국어에서 자연스러운 조사로 처리했습니다.
theological_decisions:
- issue: 마지막 목적절의 처리
  chosen_reading: ‘그를 올려 보내려고’로 옮겨, 보관 행위의 목적이 요셉을 다시 올라가게 하려는 데 있음을 드러냈습니다.
  alternative_readings:
  - ‘그를 데려올 수 있도록’
  - ‘그를 올라가게 하려고’
  rationale: English POB의 so as to bring him up는 단순 결과가 아니라 의도/목적을 나타내므로 목적을 분명히 살렸습니다.
  doctrine_reference: Narrative sense and σκοπός/purpose preservation
