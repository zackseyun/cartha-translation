  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ὡς¹ συνετέλεσεν² Συμεὼν ἐντελλόμενος³ τοῖς υἱοῖς⁴ αὐτοῦ⁵, ἐκοιμήθη⁶ *μετὰ τῶν πατέρων αὐτοῦ⁷ *ὢν ἐτῶν ἑκατὸν εἴκοσι⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/001.yaml
  text: And when Simeon had finished commanding his sons, he fell asleep with his fathers, being one hundred and twenty years old.
translation:
  language: ko
  text: 그리고 시므온이 자기 아들들에게 명령하기를 마치자, 그는 조상들과 함께 잠들었습니다. 그때 그의 나이는 백이십 년이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντελλόμενος
  english_pob_choice: commanding
  chosen_korean: 명령하기를 마치자
  alternatives_korean:
  - 가르치기를 마치자
  - 분부하기를 마치자
  lexicon: ἐντέλλομαι
  rationale: 아들들에게 마지막으로 지시하는 행위를 나타내므로 단순한 ‘말하다’보다 명령의 뉘앙스를 살렸습니다.
- source_word: ἐκοιμήθη
  english_pob_choice: he fell asleep
  chosen_korean: 잠들었습니다
  alternatives_korean:
  - 죽었습니다
  - 세상을 떠났습니다
  lexicon: κοιμάομαι
  rationale: 원문의 완곡한 ‘잠들다’ 표현을 유지해 죽음을 직접 진술하되 비유를 보존했습니다.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: with his fathers
  chosen_korean: 조상들과 함께
  alternatives_korean:
  - 그의 조상들과 함께
  - 조상들 곁에
  lexicon: μετά + πατέρες
  rationale: 영어 POB의 관용을 따르되, 한국어에서는 ‘조상들’로 자연스럽게 풀어 공동조상의 묘사임을 드러냈습니다.
- source_word: ὢν ἐτῶν ἑκατὸν εἴκοσι
  english_pob_choice: being one hundred and twenty years old
  chosen_korean: 그때 그의 나이는 백이십 년이었습니다
  alternatives_korean:
  - 그는 백이십 살이었습니다
  - 나이 백이십 세였습니다
  lexicon: ἔτη + 숫자
  rationale: 직역형 ‘~세’보다 문맥상 연령 진술을 분명히 하면서도 현대 한국어에 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 죽음의 완곡어법 유지
  chosen_reading: ‘잠들었습니다’로 옮겨 죽음을 직접적이면서도 완곡하게 표현했습니다.
  alternative_readings:
  - 죽었습니다
  - 세상을 떠났습니다
  rationale: 원문의 κοιμάομαι는 단순 생물학적 종료보다 전통적인 ‘잠들다’ 은유를 담으므로, 이를 보존하는 것이 본문 의미를 더 잘 전달합니다.
  doctrine_reference: 성경적 죽음의 완곡어법
- issue: 족장적 계보 표현
  chosen_reading: ‘조상들과 함께’로 공동조상에 합류하는 표현을 살렸습니다.
  alternative_readings:
  - 조상들 곁에
  - 조상들 가운데
  rationale: 본문은 단순 매장 위치보다 족장 전통의 연속성을 암시하므로, 공동체적·계보적 의미가 드러나게 했습니다.
  doctrine_reference: 족장 전승
