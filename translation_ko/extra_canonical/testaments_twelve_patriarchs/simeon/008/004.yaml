id: T12P.SIM.8.4
reference: Testament of Simeon 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ἔλεγον γὰρ ⌜αὐτοῖς⌝¹⁷ οἱ ἐπαοιδοί¹⁸, ὅτι ἐν ἐξόδῳ τῶν¹⁹ ὀστῶν Ἰωσὴφ²⁰ ἔσται ἐν πάσῃ *τῇ γῇ²¹ σκότος καὶ γνόφος καὶ πληγὴ²² μεγάλη²³ τοῖς Αἰγυπτίοις, ὥστε μετὰ λύχνου²⁴ μὴ²⁵ ἐπιγινώσκειν ἕκαστος²⁶ *τὸν ἀδελφὸν²⁷ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/004.yaml
  text: For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague on the Egyptians, so that each man would not recognize his brother, even with a lamp.
translation:
  language: ko
  text: 주술사들이 그들에게 말하였기 때문입니다. 요셉의 뼈들이 나갈 때에 온 땅에 어둠과 짙은 암흑이 있고, 이집트 사람들에게 큰 재앙이 닥쳐, 각 사람이 등불을 가지고도 자기 형제를 알아보지 못할 것이라고 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαοιδοί
  english_pob_choice: enchanters
  chosen_korean: 마술사들
  alternatives_korean:
  - 주술사들
  - 주문사들
  - 주술꾼들
  lexicon: ἐπαοιδοί
  rationale: 영어 POB의 enchanters를 반영하되, 한국어에서는 고대 점술·주술 행위를 가리키는 표준적 표현으로 옮겼습니다.
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσὴφ
  english_pob_choice: when Joseph’s bones went out
  chosen_korean: 요셉의 뼈가 나갈 때에는
  alternatives_korean:
  - 요셉의 뼈가 나올 때에는
  - 요셉의 뼈가 떠날 때에는
  - 요셉의 뼈가 출애할 때에는
  lexicon: ἐν ἐξόδῳ
  rationale: ἐξόδῳ를 단순한 ‘떠남’보다 본문이 가리키는 뼈의 이동·출발을 자연스럽게 드러내는 ‘나가다’로 옮겼습니다.
- source_word: σκότος καὶ γνόφος
  english_pob_choice: darkness and gloom
  chosen_korean: 어둠과 짙은 캄캄함
  alternatives_korean:
  - 어둠과 캄캄함
  - 흑암과 짙은 어둠
  - 어둠과 음침함
  lexicon: σκότος, γνόφος
  rationale: 두 단어의 누적 효과를 살리기 위해 둘 다 한국어에서 강한 어둠 표현으로 구분해 옮겼습니다.
- source_word: πληγὴ μεγάλη
  english_pob_choice: a great plague
  chosen_korean: 큰 재앙
  alternatives_korean:
  - 큰 질병
  - 큰 재난
  - 큰 재해
  lexicon: πληγὴ
  rationale: πληγὴ는 여기서 특정 질병명보다 하나님이 내리는 타격·재앙의 뜻이 강하므로, 본문 의미를 넓게 드러내는 ‘재앙’이 적절합니다.
- source_word: μετὰ λύχνου μὴ ἐπιγινώσκειν
  english_pob_choice: even with a lamp ... would not recognize
  chosen_korean: 등불을 가지고도 ... 알아보지 못할 것이다
  alternatives_korean:
  - 등불이 있어도 ... 알아보지 못할 것이다
  - 등불 아래에서도 ... 알아보지 못할 것이다
  - 등잔불로도 ... 알아보지 못할 것이다
  lexicon: λύχνος, ἐπιγινώσκω
  rationale: λύχνος를 현대 독자가 이해하기 쉬운 ‘등불’로 옮기고, 부정적 인식의 불가능성을 ‘알아보지 못하다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘이집트인들’에 대한 재앙의 표기
  chosen_reading: ‘이집트 사람들에게 큰 재앙’으로 옮겨, 대상 집단과 재앙의 수혜 대상을 모두 드러냈습니다.
  alternative_readings:
  - ‘이집트인들에게 큰 재앙’
  - ‘이집트 사람들 위에 큰 재앙’
  rationale: 그리스어의 여격과 영어 POB의 on the Egyptians를 모두 반영하면서, 한국어에서 사건의 표적을 분명하게 들리게 했습니다.
  doctrine_reference: 서술적 번역 원칙
- issue: 직접화법의 따옴표 처리
  chosen_reading: 본문의 인용문을 한국어 따옴표로 묶어, 예언적 발화를 독자가 즉시 구분하도록 했습니다.
  alternative_readings:
  - 직접 인용 없이 서술문으로 평이화
  - 작은따옴표 사용
  rationale: 원문은 ‘그들이 말하기를’ 뒤에 직접 발화가 이어지는 구조이므로, 서술과 인용의 층위를 보존하는 것이 좋습니다.
  doctrine_reference: 본문-화용 구조 보존
