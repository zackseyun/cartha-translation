id: T12P.SIM.8.2
reference: Testament of Simeon 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔθηκαν αὐτὸν ἐν *θήκῃ ξυλίνῃ⁹, *τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ¹⁰ ἐν Χεβρών. Καὶ ἀνήγαγον¹¹ *αὐτὰ ἐν πολέμῳ Αἰγυπτίων κρυφῇ¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/002.yaml
  text: And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly in a war of the Egyptians.
translation:
  language: ko
  text: 그리고 그들은 그의 뼈를 헤브론으로 올려 가기 위해 그를 나무 관에 넣었습니다. 그리고 그들은 애굽인들의 전쟁 중에 그 뼈를 몰래 올려 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θήκῃ ξυλίνῃ
  english_pob_choice: a wooden coffin
  chosen_korean: 나무 관
  alternatives_korean:
  - 나무로 된 관
  - 목관
  lexicon: θήκη; ξύλινος
  rationale: ξύλινος의 재질을 살리면서, 현대 한국어에서 자연스럽고 직접적인 장례 용어로 옮겼습니다.
- source_word: τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ ἐν Χεβρών
  english_pob_choice: to bring up his bones to Hebron
  chosen_korean: 그의 뼈를 헤브론으로 올리게
  alternatives_korean:
  - 그의 뼈를 헤브론으로 가져가게
  - 그의 뼈를 헤브론으로 옮기게
  lexicon: ἀναγάγω; ὀστέα; Χεβρών
  rationale: ἀναγαγεῖν의 ‘올리다/끌어올리다’ 의미를 살려, 시신이 아니라 뼈를 옮기는 장면을 분명히 했습니다.
- source_word: ἀνήγαγον αὐτὰ ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  english_pob_choice: they brought them up secretly in a war of the Egyptians
  chosen_korean: 그들은 애굽 사람들의 전쟁 가운데 그것들을 몰래 가져올렸습니다
  alternatives_korean:
  - 그들은 애굽 사람들의 전쟁 중에 그것들을 몰래 올렸습니다
  - 그들은 애굽 사람들과의 전쟁 중에 그것들을 비밀리에 옮겼습니다
  lexicon: ἀνήγαγον; κρυφῇ; πολέμῳ Αἰγυπτίων
  rationale: 전치사 ἐν을 POB의 ‘in a war’에 맞춰 ‘전쟁 가운데’로 반영했고, κρυφῇ는 ‘몰래’로 간결하게 살렸습니다.
theological_decisions:
- issue: 문학적·서사적 표현에서 ‘뼈’의 처리
  chosen_reading: ‘그의 뼈’를 직접 언급해 매장 후 유골 이장 장면을 분명히 드러냈습니다.
  alternative_readings:
  - ‘유해를’로 완화하는 번역
  - ‘시신을’로 일반화하는 번역
  rationale: 본문은 ὀστᾶ를 사용해 뼈 자체를 지시하므로, 의미를 약화시키지 않고 서사적 초점을 유지하는 것이 적절합니다.
  doctrine_reference: source-faithfulness / lexical transparency
