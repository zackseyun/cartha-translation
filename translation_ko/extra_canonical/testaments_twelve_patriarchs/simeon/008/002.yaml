    issue: ‘가져올렸습니다’
    rationale: ‘가져오다’와 ‘올리다’를 이 형태로 결합한 표현은 비문입니다. ἀνήγαγον의 ‘올려 가다/운반해 올라가다’ 의미는 ‘올려 갔습니다’로 자연스럽게 옮길 수 있습니다.
  - severity: low
    issue: ‘그를 나무 관에 두어’ 및 ‘그것들’
    rationale: 문법적으로 가능한 범위이나 장례 맥락에서는 ‘관에 넣었습니다’가 자연스럽고, αὐτά의 지시 대상인 뼈를 반복하는 편이 한국어에서 명확합니다.
  revised_text: 그리고 그들은 그의 뼈를 헤브론으로 올려 가기 위해 그를 나무 관에 넣었습니다. 그리고 그들은 애굽인들의 전쟁 중에 그 뼈를 몰래 올려 갔습니다.
