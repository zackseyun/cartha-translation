  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001.yaml
  text: 'A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died. And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up and kissed them[b], and said:'
  footnotes:
  - marker: a
    text: Or 'A record of the words of Simeon.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'kissed them' renders an intensive Greek verb that can suggest repeated or affectionate kissing.
    reason: lexical_alternative
translation:
  language: ko
  text: 시므온의 말들의 사본[a]. 그는 죽기 전에, 자기 생애 백이십 년째에, 곧 그의 형 요셉이 죽은 때에 자기 아들들에게 말하였습니다. 시므온이 병들어 있었을 때 그의 아들들이 그를 방문하러 왔고, 그는 기운을 내어 몸을 일으켜 그들에게 입을 맞추고[b] 말하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  english_pob_choice: A copy
  chosen_korean: 사본
  alternatives_korean:
  - 기록
  - 전사본
  lexicon: LSJ
  rationale: 머리말 형식의 문서 표지로서 ‘사본’은 원문을 옮겨 적은 기록이라는 성격을 간결하게 살리면서도, ‘기록’보다 문서적 뉘앙스를 더 분명히 드러냅니다.
- source_word: λόγων
  english_pob_choice: of the words
  chosen_korean: 말들의
  alternatives_korean:
  - 말씀들의
  - 발언들의
  lexicon: LSJ
  rationale: 직역에 가깝게 복수형을 살려 ‘말들의’로 옮겨, 시므온의 유언적 발화를 문서 제목처럼 제시하는 구조를 보존했습니다.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει
  english_pob_choice: in the hundred and twentieth year
  chosen_korean: 백이십 년째에
  alternatives_korean:
  - 백이십 년에
  - 백이십세에
  lexicon: LSJ
  rationale: 연대 표지의 형식을 살리되 한국어로는 자연스럽게 ‘년째’로 풀어, 장중한 연대기적 표현을 유지했습니다.
- source_word: ἐπισκέψασθαι
  english_pob_choice: to visit
  chosen_korean: 방문하러
  alternatives_korean:
  - 문안하러
  - 찾아보러
  lexicon: BDAG
  rationale: 병든 시므온을 향한 아들들의 동작이므로 단순한 방문보다 정서가 있는 ‘방문하러’를 택해, 문맥상의 돌봄 뉘앙스를 과도하게 덧붙이지 않았습니다.
- source_word: κατεφίλησεν
  english_pob_choice: kissed
  chosen_korean: 입을 맞추고
  alternatives_korean:
  - 계속 입맞추고
  - 애정 어린 입맞춤을 하고
  lexicon: BDAG
  rationale: 강한 애정과 반복적 입맞춤의 가능성을 유지하면서도, 한국어에서는 과잉 해설 없이 자연스럽게 들리는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘형 요셉이 죽은 때에’라는 연대 통지의 처리
  chosen_reading: 본문의 연대·사건 틀을 그대로 살려 번역했습니다.
  alternative_readings:
  - 요셉의 죽음을 부차적 편집 주석으로 처리함
  - 연대 표현을 간단히 압축함
  rationale: 그리스어 사본이 머리말과 서사 시작부에서 이 정보를 함께 제시하므로, 본문을 매끄럽게 만들기 위해 생략하거나 완화하지 않았습니다.
  doctrine_reference: 원문 증언의 투명한 보존과, 조화시키려는 의도적 재구성보다 직접적인 전달을 우선하는 번역 원칙.
