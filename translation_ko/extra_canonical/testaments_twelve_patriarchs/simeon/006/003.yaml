- issue: 민족/집단 명칭의 폭력적 종말 진술을 어떻게 처리할지
  chosen_reading: 원문의 예언적 심판 진술을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 상징적으로 완화하여 번역
