  text: Then the seed of Canaan will perish, and no remnant will remain in Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed.
translation:
  language: ko
  text: 그때 가나안의 씨가 멸망할 것이며, 아말렉에는 남은 자가 없을 것이고, 모든 카파도키아 사람들은 멸망할 것이며, 모든 헷 사람들은 완전히 멸절될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ σπέρμα Χαναάν
  english_pob_choice: the seed of Canaan
  chosen_korean: 가나안의 씨
  alternatives_korean:
  - 가나안의 후손
  - 가나안 족속
  lexicon: σπέρμα
  rationale: 직역에 가깝게 ‘씨’를 유지해 혈통/후손 개념을 드러냈고, 문맥상 집단을 가리키므로 소유격 구조로 자연스럽게 옮겼습니다.
- source_word: ἐγκατάλειμμα οὐκ ἔσται
  english_pob_choice: no remnant will remain
  chosen_korean: 남은 자가 없을 것이고
  alternatives_korean:
  - 남은 자가 남지 않을 것이고
  - 남은 것이 없을 것이고
  lexicon: ἐγκατάλειμμα
  rationale: ‘남은 자’는 잔존 인원을 분명히 드러내며, 미래 부정 구문을 한국어로 자연스럽게 살렸습니다.
- source_word: ἐν τῷ ᾿Αμαλήκ
  english_pob_choice: in Amalek
  chosen_korean: 아말렉 안에는
  alternatives_korean:
  - 아말렉에
  - 아말렉 가운데에는
  lexicon: ἐν
  rationale: 편집상의 수정 의도에 맞춰 위치적 의미를 분명히 하기 위해 ‘안에는’으로 옮겼습니다.
- source_word: ἐξολοθρευθήσονται
  english_pob_choice: will be utterly destroyed
  chosen_korean: 완전히 멸절될 것입니다
  alternatives_korean:
  - 완전히 진멸될 것입니다
  - 철저히 멸망할 것입니다
  lexicon: ἐξολοθρεύω
  rationale: 완전한 소멸의 강도를 살리되, 한국어 문장으로는 ‘멸절’이 가장 직접적으로 대응합니다.
