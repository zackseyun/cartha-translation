base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/002.yaml
  text: But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.
translation:
  language: ko
  text: 그러나 여러분이 질투와 모든 완고한 마음을 여러분에게서 제거하면, 내 뼈는 이스라엘에서 장미처럼 피어나고, 내 살은 야곱에서 백합처럼 피어나며, 내 향기는 레바논의 향기 같을 것입니다. 거룩한 자들이 나로부터 영원무궁토록 많아질 것이며, 그들의 가지는 멀리 뻗을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέλητε ἀφ᾽ ὑμῶν τὸν φθόνον καὶ πᾶσαν σκληροκαρδίαν
  english_pob_choice: remove from yourselves envy and every hardness of heart
  chosen_korean: 질투와 모든 완고한 마음을 여러분에게서 제거하면
  alternatives_korean:
  - 시기와 모든 마음의 완악함을 여러분에게서 없애면
  - 질투와 모든 굳은 마음을 여러분에게서 떼어 내면
  lexicon: ἀφαιρέω; φθόνος; σκληροκαρδία
  rationale: ἀφαιρέω는 단순한 감정 조절이 아니라 ‘떼어 내다/제거하다’의 강한 동사이므로, 상태 변화가 드러나도록 ‘제거하면’으로 옮겼습니다. σκληροκαρδία는 직역하면 ‘굳은/완고한 마음’이어서, 문맥상 내적 경직을 살려 ‘완고한 마음’으로 했습니다.
- source_word: ῥόδον ... ὡς κρίνον
  english_pob_choice: my bones will blossom like a rose ... my flesh like a lily
  chosen_korean: 내 뼈는 이스라엘에서 장미처럼 피어나고, 내 살은 야곱에서 백합처럼 피어나며
  alternatives_korean:
  - 내 뼈는 이스라엘에서 장미처럼 피고, 내 살은 야곱에서 백합처럼 피하며
  - 내 뼈는 이스라엘에서 장미 같아지고, 내 살은 야곱에서 백합 같아지며
  lexicon: ῥόδον; κρίνον; ἀνθήσει
  rationale: 동사 ἀνθήσει는 ‘꽃피다/피어나다’의 이미지를 강하게 주므로, 한국어에서도 생장·개화 이미지를 유지해 ‘피어나고’로 처리했습니다. ὀστᾶ와 σάρξ의 병렬을 살려 ‘뼈’와 ‘살’을 유지했습니다.
- source_word: ὀσμὴ Λιβάνου
  english_pob_choice: the fragrance of Lebanon
  chosen_korean: 레바논의 향기
  alternatives_korean:
  - 레바논의 향내
  - 레바논의 향기로운 냄새
  lexicon: ὀσμή; Λίβανος
  rationale: ὀσμή는 단순한 냄새보다 긍정적 후각 이미지를 띠므로, 한국어 성서문맥에 자연스러운 ‘향기’로 옮겼습니다. 지명은 음역보다 이미 익숙한 ‘레바논’을 유지했습니다.
- source_word: ἅγιοι ... ἐξ ἐμοῦ ... εἰς μακρὰν ἔσονται
  english_pob_choice: Holy ones will be multiplied from me forever and ever, and their branches will extend far away
  chosen_korean: 거룩한 자들이 나로부터 영원무궁토록 많아질 것이며, 그들의 가지는 멀리 뻗을 것입니다
  alternatives_korean:
  - 성도들이 나로부터 영원히 많아질 것이며, 그들의 가지는 멀리 뻗을 것입니다
  - 거룩한 이들이 내게서 영원무궁토록 늘어날 것이며, 그들의 가지가 멀리 이를 것입니다
  lexicon: ἅγιοι; πληθυνθήσονται; κλάδοι
  rationale: 이 문맥의 ἅγιοι는 후대 교회 용어 ‘성도’보다 원문의 직역 의미인 ‘거룩한 자들/거룩한 이들’이 더 적합하여, 고유한 집합 명칭으로 오독되지 않게 했습니다. κλάδοι는 비유적 식물 이미지이므로 ‘가지’로 유지했습니다.
theological_decisions:
- issue: ἅγιοι의 번역과 공동체 정체성
  chosen_reading: ‘거룩한 자들’로 옮겨, 특정 교회 제도 용어가 아니라 하나님께 속한 사람들의 거룩함을 드러내었습니다.
  alternative_readings:
  - ‘성도들’로 옮기는 교회 전통 용어
  - ‘거룩한 이들’로 완화한 번역
  rationale: 본문은 메시아적/종말론적 번식 이미지를 사용하면서도 ἅγιοι를 집합명사로 제시하므로, 한국어에서도 신학적 함의를 유지하되 교회제도적 용어로 고정하지 않는 편이 원문에 더 가깝습니다.
  doctrine_reference: 성도의 거룩성, 하나님의 백성 정체성
