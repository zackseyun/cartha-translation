    issue: ‘모든 완고한 마음’
    rationale: σκληροκαρδία는 ‘완고한 마음들’이라기보다 ‘마음의 완고함/완악함’이라는 추상 명사입니다. 현 번역은 πᾶσαν과 결합하여 여러 ‘마음’을 뜻하는 듯하게 들릴 수 있습니다.
