revisions:
- from: 그러나 여러분이 질투와 모든 완고한 마음을 여러분에게서 제거하면, 내 뼈는 이스라엘에서 장미처럼 피어나고, 내 살은 야곱에서 백합처럼 피어나며, 내 향기는 레바논의 향기 같을 것입니다. 거룩한 자들이 나로부터 영원무궁토록 많아질 것이며, 그들의 가지는 멀리 뻗을 것입니다.
  to: 그러나 여러분이 질투와 모든 마음의 완고함을 여러분에게서 없애면, 내 뼈는 이스라엘에서 장미처럼 피어나고, 내 살은 야곱에서 백합처럼 피어나며, 내 향기는 레바논의 향기 같을 것입니다. 거룩한 자들이 나로부터 영원히 영원토록 많아질 것이며, 그들의 가지는 멀리 뻗을 것입니다.
  rationale: σκληροκαρδία의 추상적 의미를 ‘마음의 완고함’으로 바로잡았습니다. 또한 αἰῶνας αἰώνων의 반복적 영속성을 보존하되 현대 한국어 문체에 맞추어 ‘영원히 영원토록’으로 다듬었습니다. 나머지 표현은 그리스어의 병렬적 식물 이미지, 후각 이미지, 그리고 ‘거룩한 자들’과 가지의 비유를 충실히 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:13Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 이미지와 문장 구조는 원문에 충실합니다. 다만 σκληροκαρδία는 ‘완고한 마음’이라는 개별 마음의 표현보다 ‘마음의 완고함’이라는 추상 명사로 옮기는 것이 ‘모든’(πᾶσαν)의 수식 범위와 원어의 의미를 더 정확히 반영합니다.
  naturalness: 전반적으로 자연스러운 현대 한국어 합쇼체입니다. ‘영원무궁토록’은 이해 가능하나 다소 관습적·고풍스러우므로, 반복된 αἰῶνας αἰώνων를 살리면서도 현대적으로 ‘영원히 영원토록’으로 옮겼습니다.
  terminology: ‘질투’, ‘뼈’, ‘살’, ‘백합’, ‘레바논’, ‘거룩한 자들’, ‘가지’는 적절합니다. ἅγιοι를 특정 교회 제도 용어인 ‘성도’로 한정하지 않은 점도 적절합니다.
  issues:
