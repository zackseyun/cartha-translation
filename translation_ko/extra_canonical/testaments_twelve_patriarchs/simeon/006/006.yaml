id: T12P.SIM.6.6
reference: Testament of Simeon 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε δοθήσεται⁴⁸ πάντα τὰ πνεύματα τῆς πλάνης⁴⁹ εἰς καταπάτησιν⁵⁰ καὶ οἱ⁵¹ ἄνθρωποι⁵² βασιλεύσουσιν⁵³ τῶν⁵⁴ πονηρῶν πνευμάτων⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/006.yaml
  text: Then all the spirits of deceit will be given over to trampling, and men will rule over the evil spirits.
translation:
  language: ko
  text: 그때 모든 속임의 영들은 짓밟힘에 넘겨질 것이며, 사람들은 악한 영들을 다스릴 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πνεύματα τῆς πλάνης
  english_pob_choice: the spirits of deceit
  chosen_korean: 속임의 영들
  alternatives_korean:
  - 기만의 영들
  - 미혹의 영들
  - 속임수의 영들
  lexicon: πνεῦμα → 영; πλάνη → 속임/기만/미혹
  rationale: πλάνη는 단순한 오류보다 사람을 그릇된 길로 이끄는 ‘속임’의 뉘앙스가 강해, POB의 'deceit'을 따라 ‘속임의 영들’로 옮겼습니다.
- source_word: εἰς καταπάτησιν
  english_pob_choice: to trampling
  chosen_korean: 짓밟힘에
  alternatives_korean:
  - 짓밟히도록
  - 짓밟히는 데로
  - 짓밟아 버림에
  lexicon: εἰς + 명사구 → 결과/귀착
  rationale: 재진술된 영어처럼 ‘to be trampled down’보다 결과 지향의 εἰς καταπάτησιν을 살려, 자연스럽게 ‘짓밟힘에’로 표현했습니다.
- source_word: βασιλεύσουσιν
  english_pob_choice: will rule
  chosen_korean: 다스릴 것입니다
  alternatives_korean:
  - 통치할 것입니다
  - 왕 노릇할 것입니다
  - 군림할 것입니다
  lexicon: βασιλεύω → 통치하다/다스리다
  rationale: 사람이 악한 영들 위에 행사하는 지배를 현대 한국어로 가장 직접적으로 드러내기 위해 ‘다스리다’를 선택했습니다.
- source_word: οἱ ἄνθρωποι
  english_pob_choice: men
  chosen_korean: 사람들은
  alternatives_korean:
  - 사람들은
  - 남자들은
  - 인간들은
  lexicon: ἄνθρωπος → 사람
  rationale: 여기서 ἄνθρωποι는 성별 대비보다 인간 일반을 가리키므로, 한국어에서는 포괄적인 ‘사람들’이 가장 자연스럽습니다.
theological_decisions:
- issue: 악한 영들에 대한 종말론적 역전의 표현
  chosen_reading: ‘짓밟힘에 넘겨질 것이며’로 번역해, 영들의 패배와 인간의 우위가 함께 드러나도록 했습니다.
  alternative_readings:
  - ‘짓밟히도록 넘겨질 것이며’
  - ‘짓밟히는 데로 넘겨질 것이며’
  rationale: 원문은 단순 파괴가 아니라 지배 질서의 전복을 말하므로, 수동성과 결과성을 함께 살리는 표현이 적절합니다.
  doctrine_reference: 종말론적 심판과 악령 패배의 묘사
