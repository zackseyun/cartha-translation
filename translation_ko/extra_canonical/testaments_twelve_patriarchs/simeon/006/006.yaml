  source_fidelity: 그리스어의 미래 수동형 δοθήσεται, 복수 주어 πάντα τὰ πνεύματα τῆς πλάνης, εἰς καταπάτησιν의 결과·처분 방향, 그리고 οἱ ἄνθρωποι의 미래 능동형 βασιλεύσουσιν 및 τῶν πονηρῶν πνευμάτων에 대한 지배 관계를 충실히 반영합니다. ‘짓밟힘에 넘겨질’은 ‘짓밟힘/짓밟는 일에 내어 주어짐’이라는 원문의 다소 압축적인 표현을 자연스럽게 보존합니다.
  naturalness: ‘그때’, ‘모든 속임의 영들’, ‘짓밟힘에 넘겨질 것이며’, ‘다스릴 것입니다’는 현대 표준 한국어의 격식 있는 합쇼체 문장으로 자연스럽습니다. 문장의 병렬 관계도 명확합니다.
  terminology: πνεῦμα는 ‘영’, πλάνη는 영어 POB의 deceit와 원문의 미혹·기만 범위를 무리 없이 포괄하는 ‘속임’, πονηρά는 ‘악한’으로 적절히 옮겼습니다. ἄνθρωποι를 성별 비한정의 ‘사람들’로 번역한 것도 적절합니다. ‘다스리다’는 βασιλεύω의 지배 의미를 자연스럽게 전달합니다.
