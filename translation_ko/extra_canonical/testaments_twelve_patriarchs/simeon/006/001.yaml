review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘인 δικαιωθῶ의 수동 법정적 표현은 초안이 대체로 보존합니다. 그러나 ὅπως는 목적을 나타내므로 ‘그러니’라는 결과·추론 연결은 맞지 않습니다. 또한 ἀπὸ τῆς ἁμαρτίας ὑμῶν은 화자가 청중의 죄에 대해 책임을 면하거나 정당함을 인정받는다는 뜻으로 문맥화하는 편이 한국어에서 더 충실합니다.
  naturalness: ‘여러분의 죄에서 의롭다 함을 받게 하려는 것입니다’는 ‘죄에서’의 결합이 어색하고, ‘그러니’와 ‘하려는 것입니다’의 연결도 원문의 목적절을 충분히 드러내지 못합니다. ‘~에 관하여 내가 정당함을 인정받게 하려는 것입니다’가 현대 한국어 합쇼체에서 자연스럽습니다.
  terminology: δικαιωθῶ는 ‘정당함을 인정받다’로 옮겨 법정적 수동 의미를 유지하되, 이 문맥에서 구원론적 ‘의롭다 하심’으로 단정될 수 있는 불필요한 함의를 피했습니다. 이는 영어 POB의 ‘justified’와도 의미상 상응합니다.
  issues:
  - severity: medium
    issue: ὅπως의 목적 용법이 ‘그러니’로 번역됨
    rationale: ὅπως는 ‘~하도록/~하기 위하여’라는 목적을 표시합니다. ‘그러니’는 앞 문장에 근거한 결론이나 결과를 나타내므로 문법 관계를 바꿉니다.
  - severity: medium
    issue: ἀπό τῆς ἁμαρτίας ὑμῶν의 한국어 결합이 부자연스럽고 의미가 불명확함
    rationale: ‘여러분의 죄에서 의롭다 함을 받다’는 한국어에서 무엇으로부터 분리되는지 불분명합니다. 화자가 청중의 죄에 관하여 책임이 없음을 인정받는다는 원문의 법정적 취지를 ‘여러분의 죄에 관하여’로 명료하게 나타낼 수 있습니다.
  - severity: low
    issue: 원문 판본의 세 각주 표지가 번역문 끝에 한데 놓임
