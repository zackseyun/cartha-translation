lexical_decisions:
- source_word: Ἰδοὺ
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: NA
  rationale: 청중을 향한 주의 환기 표현으로, 합쇼체에서 자연스럽고 직접적인 호소를 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: εἴρηκα ... ὑμῖν πάντα
  english_pob_choice: I have told you everything
  chosen_korean: 내가 여러분에게 모든 것을 말했습니다
  alternatives_korean:
  - 내가 너희에게 모든 것을 말했습니다
  - 내가 여러분에게 다 말했습니다
  lexicon: NA
  rationale: 완료형의 결과 상태를 살리면서, ὑμῖν의 복수 직접호칭은 현대 한국어에서 자연스러운 ‘여러분’으로 옮겼습니다.
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  english_pob_choice: I may be justified from your sin
  chosen_korean: 여러분의 죄에서 의롭다 함을 받게 하려는 것입니다
  alternatives_korean:
  - 여러분의 죄로부터 의롭다 함을 받게 하려는 것입니다
  - 여러분의 죄에서 정당함을 인정받게 하려는 것입니다
  lexicon: δικαιόω
  rationale: δικαιωθῶ를 전통적 법정·의로운 판정의 의미를 살려 ‘의롭다 함을 받다’로 옮겼고, ἀπό는 원인/분리의 뉘앙스를 반영해 ‘~에서’로 처리했습니다.
theological_decisions:
- issue: δικαιωθῶ의 수동 법정 의미
  chosen_reading: 화자의 무죄 선언이 아니라, 죄와 관련하여 의롭다 함을 받는 법정적/관계적 진술로 읽었습니다.
  alternative_readings:
  - ‘정당화되다’로 더 중립적으로 옮김
  - ‘깨끗해지다/면책되다’로 완화
  rationale: 영어 POB가 revised ‘cleared’에서 ‘justified’로 조정한 점을 따라, 본문이 지닌 법정적·신학적 강도를 약화하지 않도록 했습니다.
