  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε²⁶ ἐκλείψει²⁷ *ἡ γῆ²⁸ Χάμ, καὶ πᾶς ὁ²⁹ λαὸς ἀπολεῖται. Τότε καταπαύσει *πᾶσα ἡ γῆ³⁰ ἀπὸ ταραχῆς, *καὶ πᾶσα ἡ³¹ ὑπ᾿ οὐρανῶν³² ἀπὸ πολέμου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/004.yaml
  text: Then the land of Ham will perish, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.
translation:
  language: ko
  text: 그러면 함의 땅은 멸망하고, 모든 백성도 멸망할 것입니다. 그러면 온 땅은 소란에서 그치고, 하늘 아래 있는 모든 것도 전쟁에서 그칠 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείψει / ἀπολεῖται
  english_pob_choice: will perish / will perish
  chosen_korean: 멸망하고 / 멸망할 것입니다
  alternatives_korean:
  - 사라지고 / 사라질 것입니다
  - 무너지고 / 무너질 것입니다
  lexicon: ἐκλείπω, ἀπόλλυμι
  rationale: 두 동사 모두 여기서는 단순한 쇠퇴보다 심판으로 인한 소멸을 가리키므로, 영어 POB의 ‘perish’를 따라 ‘멸망하다’로 옮기는 것이 원문의 파괴적 의미를 가장 직접적으로 드러냅니다.
- source_word: ἡ γῆ Χάμ
  english_pob_choice: the land of Ham
  chosen_korean: 함의 땅
  alternatives_korean:
  - 함의 지역
  - 함의 나라
  lexicon: γῆ
  rationale: γῆ는 여기서 ‘땅/영토’를 뜻하므로, 고유명사 ‘함’과 결합해 ‘함의 땅’으로 옮기면 지리적·상징적 대상을 자연스럽게 살릴 수 있습니다.
- source_word: καταπαύσει ... ἀπὸ ταραχῆς / ἀπὸ πολέμου
  english_pob_choice: will cease from turmoil / from war
  chosen_korean: 소란에서 그치고 / 전쟁에서 그칠 것입니다
  alternatives_korean:
  - 소란이 멈추고 / 전쟁이 멈출 것입니다
  - 소란을 벗어나고 / 전쟁을 벗어날 것입니다
  lexicon: καταπαύω + ἀπό
  rationale: ‘그치다’는 활동이나 상태가 멈추는 뜻을 잘 살리며, ‘~에서 그치다’는 ἀπό가 나타내는 ‘~로부터’의 이탈을 자연스럽게 표현합니다.
theological_decisions:
- issue: 우주적 평화의 선언과 심판적 종결의 병행
  chosen_reading: 이 구절은 ‘멸망’과 ‘그침’을 병렬해 심판을 통한 종결과 평화의 도래를 함께 말합니다.
  alternative_readings:
  - 단순한 역사적 종말 예고로만 읽는 해석
  - 윤리적 권고로만 완화하는 해석
  rationale: 원문은 미래형 진술로 심판적 파국과 전쟁의 종식이라는 두 축을 함께 제시하므로, 한쪽을 약화하지 않고 모두 보존해야 합니다.
  doctrine_reference: 종말론적 심판과 평화의 회복
