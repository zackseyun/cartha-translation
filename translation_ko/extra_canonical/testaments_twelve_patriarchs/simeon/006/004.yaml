review_pass:
  verdict: revise
  source_fidelity: 원문의 미래 진술과 병렬 구조는 대체로 보존되어 있습니다. 다만 τότε는 조건적 귀결을 나타내는 ‘그러면’보다 시간적 표지인 ‘그때에’가 적절합니다. 또한 ἀπὸ ταραχῆς / ἀπὸ πολέμου는 ‘~에서 그치다’보다 ‘~을 그치다’로 옮기는 편이 한국어에서 더 자연스럽고, 원문의 종결 의미도 유지합니다.
  naturalness: ‘그러면’의 반복과 ‘소란에서 그치고/전쟁에서 그치다’는 현대 표준 한국어에서 다소 어색합니다. ‘그때에’ 및 ‘소란을 그치고, 전쟁을 그칠 것입니다’로 다듬으면 합쇼체의 격식을 유지하면서 자연스럽습니다.
  terminology: ‘함의 땅’, ‘멸망하다’, ‘온 땅’, ‘하늘 아래 있는 모든 것’은 원문의 지명·파괴 어휘·우주적 범위를 적절히 반영합니다. 원문에 없는 해석적 신학 용어는 추가하지 않았습니다.
  issues:
