    issue: τότε를 ‘그러면’으로 번역함
    rationale: τότε는 여기서 반복되는 시간 부사로서 ‘그때에/그때’가 기본 의미입니다. ‘그러면’은 앞 절의 조건이나 논리적 귀결을 암시하여 원문에 없는 뉘앙스를 더합니다.
  - severity: low
    issue: ‘소란에서 그치고, 전쟁에서 그칠 것입니다’의 어색한 결합
