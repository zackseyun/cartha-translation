  to: 그때에 함의 땅은 멸망하고, 모든 백성도 멸망할 것입니다. 그때에 온 땅은 소란을 그치고, 하늘 아래 있는 모든 것은 전쟁을 그칠 것입니다.
  rationale: 시간 부사 τότε를 ‘그때에’로 바로 옮기고, 한국어에서 부자연스러운 ‘~에서 그치다’를 목적어를 취하는 ‘~을 그치다’로 수정했습니다. ‘함의 땅’과 ‘하늘 아래 있는 모든 것’은 원문의 표현 범위와 모호성을 유지했습니다. 대응 각주가 없는 표지는 제거했습니다.
