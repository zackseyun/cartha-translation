review_pass:
  verdict: revise
  source_fidelity: Τότε is a temporal adverb best rendered as “그때,” rather than the inferential “그러면.” The neuter adjective μέγα modifies σημεῖον (“a great sign”), and τῷ Ἰσραήλ is retained as a beneficiary/reference phrase, “이스라엘을 위하여.” ἐνδοξασθήσεται is future passive (“will be glorified”); “영광을 받게 되다” is possible but is less idiomatic with “표징” as its subject.
  naturalness: The draft is understandable, but “그러면” suggests a logical consequence not explicit in the Greek, and “표징이 영광을 받게 되다” is somewhat stilted in modern Korean. “영화롭게 되다” is a natural formal rendering that preserves the passive/resultative sense without specifying an agent.
  terminology: “표징” appropriately renders σημεῖον in a religious-literary context while avoiding the more interpretively specific “이적.” “영화롭게” is an established formal Korean biblical term for glorification and does not impose a doctrinal interpretation.
  issues:
  - severity: low
    issue: Temporal connector rendered inferentially
    rationale: Τότε means “then/at that time”; “그러면” can mean “if so/therefore,” adding a logical nuance. “그때” is closer and more neutral.
  - severity: low
    issue: Awkward collocation for the passive verb
    rationale: Although “영광을 받게 될 것입니다” can convey passive glorification, it is less natural when the subject is an inanimate “표징.” “영화롭게 될 것입니다” preserves the intended sense more idiomatically.
  revised_text: 그때 이스라엘을 위하여 큰 표징이 영화롭게 될 것입니다.
