id: T12P.SIM.6.7
reference: Testament of Simeon 6:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε ἀναστησόμαι⁵⁶ κἀγὼ⁵⁷ ἐν⁵⁸ εὐφροσύνῃ καὶ εὐλογήσω⁵⁹ τὸν ὕψιστον ἐπὶ⁶⁰ τοῖς θαυμασίοις αὐτοῦ [ὅτι ὁ⁶¹ Θεὸς σῶμα λαβών, καὶ⁶² συνεσθίων ἀνθρώποις *ἔσωσεν ἀνθρώπους⁶³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/007.yaml
  text: Then I also will arise in gladness, and I will bless the Most High for his wonders [because God, having taken a body and eaten with men, saved men].
translation:
  language: ko
  text: 그때 나도 기쁨 가운데 일어나서, 그분의 놀라운 일들로 말미암아 지극히 높으신 분을 찬송하겠습니다. [이는 하나님께서 몸을 취하시고 사람들과 함께 식사하시어 사람들을 구원하셨기 때문입니다.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστησόμαι κἀγώ
  english_pob_choice: I also will arise
  chosen_korean: 나도 기쁨 가운데 일어나며
  alternatives_korean:
  - 나 또한 일어나겠습니다
  - 나도 일어나겠습니다
  lexicon: ἀναστῆναι
  rationale: 미래적 결단을 살리면서도 문맥상 단순한 기상보다 ‘일어나 행동하다’의 뉘앙스를 반영해 자연스럽게 옮겼습니다.
- source_word: ἐν εὐφροσύνῃ
  english_pob_choice: in gladness
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 즐거움 가운데
  - 환희 가운데
  lexicon: εὐφροσύνη
  rationale: 감정 상태를 드러내는 전치사구로서 직역보다 한국어에서 더 자연스러운 상태 표현을 택했습니다.
- source_word: τὸν ὕψιστον
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: ὕψιστος
  rationale: 호칭적 용법을 살려 하나님을 직접 지칭하는 공손한 표현으로 옮겼습니다.
- source_word: τοῖς θαυμασίοις αὐτοῦ
  english_pob_choice: for his wonders
  chosen_korean: 그분의 놀라운 일들로 인해
  alternatives_korean:
  - 그분의 경이로운 일들로 인해
  - 그분의 기이한 일들 때문에
  lexicon: θαυμάσιον
  rationale: 찬송의 이유를 나타내는 목적어구를 한국어에서 자연스럽게 원인 표현으로 풀었습니다.
- source_word: σῶμα λαβών ... συνεσθίων ἀνθρώποις
  english_pob_choice: having taken a body and eaten with men
  chosen_korean: 몸을 취하시고 사람들과 함께 먹으심으로
  alternatives_korean:
  - 몸을 받아 사람이 되어 사람들과 함께 먹으심으로
  - 육체를 입으시고 사람들과 함께 잡수심으로
  lexicon: σῶμα λαβεῖν, συνεσθίειν
  rationale: 부정과거 분사들의 연속을 한국어 동작 연결로 재현하되, 신학적 의미가 드러나도록 ‘몸을 취하시고’로 옮겼습니다.
- source_word: ἔσωσεν ἀνθρώπους
  english_pob_choice: saved men
  chosen_korean: 사람들을 구원하셨기 때문입니다
  alternatives_korean:
  - 사람들을 살리셨기 때문입니다
  - 인류를 구원하셨기 때문입니다
  lexicon: σῴζειν
  rationale: 구원 행위의 종결을 분명히 하면서도 문맥의 보편적 대상을 유지했습니다.
theological_decisions:
- issue: ‘하나님’의 몸 취함과 식사 참여를 어떻게 표현할지
  chosen_reading: 본문의 기독론적 진술을 약화하지 않고, 하나님께서 실제로 몸을 취하시고 사람들과 식사하심으로 구원하셨다는 직설을 유지했습니다.
  alternative_readings:
  - 비유적으로 완화해 ‘하나님이 사람처럼 행동하셔서’로 표현
  - 주석적 설명 없이 단순히 ‘오셨기 때문입니다’로 축소
  rationale: 그리스어 분사구와 POB의 보정된 영어가 모두 구체적 성육신/동석 행위를 말하므로, 이를 축소하지 않는 것이 원문의 신학적 무게를 보존합니다.
  doctrine_reference: 성육신, 구원론
