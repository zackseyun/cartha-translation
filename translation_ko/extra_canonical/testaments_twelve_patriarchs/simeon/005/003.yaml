reference: Testament of Simeon 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Φυλάξασθε οὖν¹⁶ *ἀπὸ τῆς πορνείας¹⁷, ὅτι *ἡ πορνεία¹⁸ μήτηρ¹⁹ ἐστὶ²⁰ τῶν κακῶν, χωρίζουσα²¹ *ἀπὸ τοῦ²² θεοῦ καὶ προσεγγίζουσα²³ τῷ Βελίαρ²⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/003.yaml
  text: Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.
translation:
  language: ko
  text: 그러므로 여러분은 음행에서 자신을 지키십시오. 음행은 온갖 악의 어머니이며, 사람을 하나님에게서 멀어지게 하고 벨리아르에게 가까이 가게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε ... ἀπὸ τῆς πορνείας
  english_pob_choice: Guard yourselves ... from sexual immorality
  chosen_korean: 음행에서 자신을 지키십시오
  alternatives_korean:
  - 음행을 피하십시오
  - 음행으로부터 자신을 지키십시오
  - 음행을 경계하십시오
  lexicon: φυλάσσω / πορνεία
  rationale: φυλάξασθε의 경계·보호 뉘앙스를 살려 ‘자신을 지키십시오’로 옮기고, πορνεία는 POB의 ‘sexual immorality’에 맞춰 ‘음행’으로 간결하게 대응했습니다.
- source_word: ἡ πορνεία μήτηρ ἐστὶ τῶν κακῶν
  english_pob_choice: sexual immorality is the mother of evils
  chosen_korean: 음행은 모든 악의 어머니로서
  alternatives_korean:
  - 음행은 악들의 어머니입니다
  - 음행은 온갖 악의 어머니입니다
  lexicon: μήτηρ / τῶν κακῶν
  rationale: 비유적 진술을 그대로 살리되, τῶν κακῶν을 자연스럽고 포괄적으로 ‘모든 악’으로 옮겨 원문의 일반성을 드러냈습니다.
- source_word: χωρίζουσα ἀπὸ τοῦ θεοῦ καὶ προσεγγίζουσα τῷ Βελίαρ
  english_pob_choice: separating from God and drawing near to Beliar
  chosen_korean: 하나님에게서 멀어지게 하고 벨리아르에게 가까이 가게 합니다
  alternatives_korean:
  - 하나님에게서 분리하고 벨리아르에게 접근하게 합니다
  - 하나님으로부터 떠나게 하고 벨리아르에게 가까이 가게 합니다
  lexicon: χωρίζω / προσεγγίζω / θεός / Βελίαρ
  rationale: 두 분사구의 대조를 살려 ‘멀어지게 하다 / 가까이 가게 하다’로 균형 있게 옮겼고, θεός는 본문 관례에 따라 ‘하나님’으로, 고유명사 Βελίαρ는 음역했습니다.
theological_decisions:
- issue: ‘악의 어머니’라는 비유의 강도
  chosen_reading: 음행을 단순한 도덕적 실수보다 악을 낳는 근원적 힘으로 제시하는 원문의 수사적 강도를 유지했습니다.
  alternative_readings:
  - 완화하여 ‘큰 악을 낳는 원인’ 정도로 옮김
  - 비유를 풀어 설명적으로 재진술
  rationale: 원문은 πορνεία를 악들의 모체로 규정하므로, 이를 약화하지 않고 직설적으로 번역하는 편이 source-direct합니다.
  doctrine_reference: 문자적 비유 보존 원칙
- issue: Βελίαρ 표기
  chosen_reading: 벨리아르로 음역해 인격적/대립적 존재로서의 어감을 보존했습니다.
  alternative_readings:
  - 벨리알
  - 사탄
  rationale: 본문 고유명사를 해석어로 대체하면 본문의 대조 구조가 약해지므로, 의미를 덧씌우지 않는 음역을 택했습니다.
  doctrine_reference: 고유명사 보존 원칙
