id: T12P.SIM.5.4
reference: Testament of Simeon 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἑώρακα γὰρ ἐγὼ²⁵ ἐν χαρακτῆρι γραφῆς²⁶ Ἐνώχ, ὅτι οἱ²⁷ υἱοὶ ὑμῶν²⁸ *ἐν πορνείᾳ²⁹ φθαρήσονται, καὶ *τοῖς υἱοῖς Λευὶ³⁰ *ἀδικήσουσιν ἐν ῥομφαίᾳ³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/004.yaml
  text: For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.
translation:
  language: ko
  text: 내가 에녹의 기록에서 보았기 때문입니다. 곧 너희 아들들은 음행 가운데서 타락하고, 레위의 아들들에게 칼로 해를 끼칠 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  english_pob_choice: in the writing of Enoch
  chosen_korean: 에녹의 기록에서
  alternatives_korean:
  - 에녹의 글에서
  - 에녹의 글귀에서
  lexicon: γραφή
  rationale: Ἐνώχ의 문서/기록을 자연스럽게 옮기면서, 원문의 ‘기록된 글’이라는 의미를 살려 과도한 해석 없이 표현했습니다.
- source_word: ἐν πορνείᾳ
  english_pob_choice: in sexual immorality
  chosen_korean: 음행 가운데서
  alternatives_korean:
  - 성적 부도덕 가운데서
  - 음행으로
  lexicon: πορνεία
  rationale: POB의 ‘sexual immorality’를 한국어 성경 어휘인 ‘음행’으로 옮기되, ἐν의 국면성을 반영해 ‘가운데서’를 보탰습니다.
- source_word: φθαρήσονται
  english_pob_choice: will be corrupted
  chosen_korean: 타락하고
  alternatives_korean:
  - 부패하고
  - 망가지고
  lexicon: φθείρω
  rationale: 도덕적·성적 타락의 결과를 드러내는 동사로, 한국어에서 자연스럽고 본문의 의미를 잘 드러내는 ‘타락하다’를 선택했습니다.
- source_word: ἀδικήσουσιν
  english_pob_choice: will wrong
  chosen_korean: 잘못을 저지를 것입니다
  alternatives_korean:
  - 해를 끼칠 것입니다
  - 불의를 행할 것입니다
  lexicon: ἀδικέω
  rationale: 직접적인 폭력 행위를 단정하기보다 ‘불의/잘못을 행하다’의 폭을 유지하되, 뒤의 ‘칼’과 함께 불법적 가해를 드러내는 표현으로 다듬었습니다.
theological_decisions:
- issue: ‘레위의 아들들’에 대한 폭력과 ‘칼’의 결합
  chosen_reading: 칼로 레위의 아들들에게 해를 가할 것이라는 예언적 경고로 읽었습니다.
  alternative_readings:
  - 전쟁적 살상으로 볼 수 있습니다.
  - 비유적 적대 행위로 볼 수 있습니다.
  rationale: 원문은 ἐν ῥομφαίᾳ를 통해 수단을 명시하지만, 결과의 정확한 범위는 본문 자체가 넓게 두므로 ‘해를 저지르다’로 과도한 구체화를 피했습니다.
  doctrine_reference: 본문 문맥상 예언적 경고의 수위 유지
