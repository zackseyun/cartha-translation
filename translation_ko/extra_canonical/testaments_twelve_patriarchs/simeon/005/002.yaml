reference: Testament of Simeon 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα μου⁹, Ἀγαθύνατε τὰς καρδίας ὑμῶν¹⁰ ἐνώπιον Κυρίου¹¹, καὶ¹² εὐθύνατε τὰς ὁδοὺς ὑμῶν ἐνώπιον τῶν¹³ ἀνθρώπων¹⁴ καὶ ἔσεσθε εὑρίσκοντες χάριν *ἐνώπιον Κυρίου καὶ ἀνθρώπων¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/002.yaml
  text: And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will find favor before the Lord and men.
translation:
  language: ko
  text: 이제, 내 자녀들아, 너희의 마음을 주님 앞에서 선하게 하라. 또한 너희의 길을 사람들 앞에서 곧게 하라. 그러면 너희는 주님과 사람들 앞에서 은총을 얻게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  english_pob_choice: make your hearts good
  chosen_korean: 너희의 마음을 주님 앞에서 선하게 하라
  alternatives_korean:
  - 너희 마음을 좋게 하라
  - 너희의 마음을 선하게 하라
  lexicon: ἀγαθύνω
  rationale: 동사는 단순히 ‘좋다’보다 도덕적·품성적 선함을 지향하므로 ‘선하게 하다’로 옮겨 원문의 권면 강도를 살렸습니다.
- source_word: ἐνώπιον Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주 앞에서
  - 주님 앞에
  lexicon: ἐνώπιον + κύριος
  rationale: 전면성·대면성을 드러내는 관용구이므로 한국어에서도 ‘앞에서’로 살리고, κύριος는 본문 맥락에 맞게 ‘주님’으로 옮겼습니다.
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  english_pob_choice: make your ways straight
  chosen_korean: 너희의 길을 곧게 하라
  alternatives_korean:
  - 너희의 길을 바르게 하라
  - 너희 길을 바로잡으라
  lexicon: εὐθύνω + ὁδός
  rationale: ‘길’을 삶의 행실/행로로 유지하면서, 직선성의 이미지를 ‘곧게 하다’로 자연스럽게 살렸습니다.
- source_word: χάριν
  english_pob_choice: favor
  chosen_korean: 은총
  alternatives_korean:
  - 호의
  - 은혜
  lexicon: χάρις
  rationale: 문맥상 ‘호의/은혜’를 뜻하지만, 한국어에서는 사람과 하나님 앞에서 ‘은총을 얻다’가 본문의 호의적 수혜를 가장 간명하게 드러냅니다.
theological_decisions:
- issue: ‘앞에서’가 반복되는 대면적 표현의 보존
  chosen_reading: 하나님과 사람 모두 앞에서의 삶을 병렬적으로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 앞에서를 생략하고 의미만 압축한다
  - ‘대하여’로 바꿔 관계성만 강조한다
  rationale: 본문은 하나님 앞의 내적 선함과 사람들 앞의 외적 곧음이 함께 요구된다는 구조를 가지므로, 두 겹의 공적 책임을 분명히 보존하는 것이 중요합니다.
  doctrine_reference: 윤리적 전인성, 하나님 앞과 사람 앞의 책임
