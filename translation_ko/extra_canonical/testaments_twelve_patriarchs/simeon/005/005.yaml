revisions:
- from: 그러나 그들은 레위를 대적하여 설 수 없을 것입니다. 왜냐하면 그가 주님의 전쟁을 치르고 여러분의 온 진을 무너뜨릴 것이기 때문입니다.
  to: 그러나 그들은 레위에게 맞서 설 수 없을 것입니다. 이는 그가 주님의 전쟁을 치르고 여러분의 온 진영을 물리칠 것이기 때문입니다.
  rationale: νικάω의 승리·격퇴 의미를 과도한 물리적 파괴로 한정하지 않도록 ‘물리치다’로 고쳤고, 첫 절을 현대 표준어에 맞게 다듬었습니다. ⌜πᾶσαν⌝의 ‘온’과 군사적 의미의 ‘진영’은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:13Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 νικήσει(‘이기다, 물리치다’)를 ‘진을 무너뜨리다’로 옮기면 진영 자체의 물리적 파괴가 앞서 드러날 수 있습니다. 여기서는 적의 진영/군세를 ‘물리치다’가 더 직접적입니다. ⌜πᾶσαν⌝에 해당하는 ‘온’도 유지해야 합니다.
  naturalness: ‘레위를 대적하여 설 수 없다’는 이해 가능하나 현대 표준어에서는 ‘레위에게 맞서 설 수 없다’가 더 자연스럽습니다. ‘이는’은 이 예언적·문어적 문맥에서 ‘왜냐하면’보다 매끄럽습니다.
  terminology: ‘레위’, ‘주님’, ‘전쟁’, ‘진영’은 적절합니다. παρεμβολή는 군사적 진영 또는 군세를 가리킬 수 있으므로 ‘진영’으로 두고, νικάω의 승리 의미를 ‘물리치다’로 반영합니다.
  issues:
  - severity: medium
    issue: νικήσει의 번역이 ‘무너뜨릴’로 되어 있음
    rationale: ‘무너뜨리다’는 진영의 파괴를 구체화할 수 있지만, 그리스어 νικάω는 우선 ‘이기다/정복하다/물리치다’를 뜻합니다. 군사 집단을 목적어로 하는 한국어 표현 ‘진영을 물리치다’가 의미를 더 정확히 보존합니다.
  - severity: low
    issue: ‘대적하여 설 수 없을 것입니다’의 자연스러움
    rationale: 원문의 ‘맞서다, 저항하다’ 의미는 유지되지만, ‘레위에게 맞서 설 수 없을 것입니다’가 현대 한국어 어법상 더 자연스럽습니다.
  revised_text: 그러나 그들은 레위에게 맞서 설 수 없을 것입니다. 이는 그가 주님의 전쟁을 치르고 여러분의 온 진영을 물리칠 것이기 때문입니다.
