source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλ' οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι³², ὅτι *πόλεμον Κυρίου πολεμήσει³³ καὶ νικήσει ⌜πᾶσαν⌝³⁴ παρεμβολὴν³⁵ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/005.yaml
  text: But they will not be able to stand against Levi, because he will wage the Lord’s war and will defeat your whole camp.
translation:
  language: ko
  text: 그러나 그들은 레위에게 맞서 설 수 없을 것입니다. 이는 그가 주님의 전쟁을 치르고 여러분의 온 진영을 물리칠 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι
  english_pob_choice: they will not be able to stand against Levi
  chosen_korean: 그들은 레위를 대적하여 설 수 없을 것입니다
  alternatives_korean:
  - 레위 앞에 버틸 수 없을 것입니다
  - 레위에게 맞서 설 수 없을 것입니다
  lexicon: ἀνθίστημι / δύναμαι
  rationale: ἀντιστῆναι는 단순한 물리적 서기보다 ‘대적하여 맞서다’의 뜻이 분명하므로, 이를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: πόλεμον Κυρίου πολεμήσει
  english_pob_choice: he will wage the Lord’s war
  chosen_korean: 주님의 전쟁을 치르고
  alternatives_korean:
  - 주님의 전쟁을 벌이고
  - 주님의 전쟁을 하며
  lexicon: πόλεμος / πολεμέω
  rationale: πόλεμον ... πολεμήσει의 전쟁-관용구를 살려 ‘치르다’로 옮겨, 단순한 싸움보다 ‘전쟁을 수행하다’는 뉘앙스를 반영했습니다.
- source_word: παρεμβολὴν
  english_pob_choice: camp
  chosen_korean: 진
  alternatives_korean:
  - 진영
  - 부대
  lexicon: παρεμβολή
  rationale: 이 단어는 군사적 집결지나 야영 진을 가리키므로, 문맥에 맞게 ‘진’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 야훼 칭호의 번역
  chosen_reading: 공동체 전통어인 ‘주님’을 유지했습니다.
  alternative_readings:
  - 야훼의 전쟁
  - 주(主)의 전쟁
  rationale: 본문은 그리스어 Κυρίου를 사용하며, 이 문맥에서는 독자 친화적이면서도 신적 권위를 유지하는 ‘주님’이 적절합니다.
  doctrine_reference: 신명기적 전쟁 이미지와 주권적 하나님의 대리 개념
