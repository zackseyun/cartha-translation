id: T12P.SIM.5.1
reference: Testament of Simeon 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Διὰ τοῦτο Ἰωσὴφ ἦν¹ ὡραῖος *τῷ εἴδει², καὶ καλὸς *τῇ ὄψει, ὅτι³ οὐκ ἐνοίκησεν⁴ *ἐν αὐτῷ⁵ οὐδὲν⁶ πονηρόν· ἐκ γὰρ⁷ τῆς ταραχῆς τοῦ πνεύματος τὸ πρόσωπον δηλοῖ⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/001.yaml
  text: Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.
translation:
  language: ko
  text: 그러므로 요셉은 외모가 아름답고 모습이 고왔습니다. 악한 것은 그 안에 아무것도 거하지 않았기 때문입니다. 왜냐하면 영의 동요가 얼굴에 드러나기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει / καλὸς τῇ ὄψει
  english_pob_choice: handsome in form and beautiful in appearance
  chosen_korean: 외모가 아름답고 모습이 고왔다
  alternatives_korean:
  - 형체가 좋고 보기에 아름다웠다
  - 몸매가 좋고 용모가 아름다웠다
  lexicon: ὡραῖος, εἶδος, ὄψις
  rationale: 형식적 아름다움과 보이는 인상이라는 이중 표현을 살리되, 현대 한국어에서 자연스럽고 문어적인 짝으로 옮겼습니다.
- source_word: οὐκ ἐνοίκησεν ἐν αὐτῷ οὐδὲν πονηρόν
  english_pob_choice: nothing evil dwelt in him
  chosen_korean: 악한 것은 그 안에 아무것도 거하지 않았습니다
  alternatives_korean:
  - 악한 것은 그 안에 전혀 살지 않았습니다
  - 그 안에는 아무 악도 자리하지 않았습니다
  lexicon: ἐνοικέω, πονηρός
  rationale: ‘거하다’는 내주/상주 이미지를 유지하고, ‘아무것도’로 부정을 강하게 살려 원문의 절대적 표현을 반영했습니다.
- source_word: ἐκ γὰρ τῆς ταραχῆς τοῦ πνεύματος
  english_pob_choice: for the face reveals the turmoil of the spirit
  chosen_korean: 영의 동요
  alternatives_korean:
  - 영의 혼란
  - 영의 불안
  lexicon: ταραχή, πνεῦμα
  rationale: ταραχή의 핵심인 흔들림·동요를 살렸고, 여기서는 인간 내면의 영을 가리키므로 ‘성령’이 아니라 ‘영’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 인과구가 얼굴과 영의 관계를 어떻게 말하는지
  chosen_reading: 얼굴은 영의 동요를 드러낸다는 관찰로 이해했습니다.
  alternative_readings:
  - 얼굴이 마음의 상태를 반영한다는 일반적 격언으로 볼 수 있습니다
  - 얼굴이 영적 혼란을 증명한다는 더 강한 판단으로 읽을 수 있습니다
  rationale: POB의 영어는 ‘the face reveals the turmoil of the spirit’로, 내면 상태의 외적 표출이라는 의미를 유지하는 것이 가장 직접적입니다.
  doctrine_reference: 인간 내면과 외적 표정의 상관에 대한 지혜문학적 관찰
