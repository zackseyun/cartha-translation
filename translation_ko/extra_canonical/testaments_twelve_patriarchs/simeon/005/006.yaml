- from: 그들은 레위와 유다 가운데서 나뉘어 적은 수로 남게 될 것이며, 너희 가운데서 누구도 지도자가 되지 못할 것입니다. 이것은 우리 아버지도 그 복들에서 예언하신 것과 같습니다.
  to: 그들은 레위와 유다 가운데에 나뉘어 소수가 될 것이며, 너희 가운데에서는 아무도 통치권을 맡지 못할 것입니다. 이는 우리 아버지께서도 축복들 가운데에서 예언하신 대로입니다.
  rationale: 원문에 없는 ‘남다’를 제거하여 수적 희소성만 표현했습니다. 분사구는 레위와 유다 사이에 나뉜 상태로 유지했으며, ἡγεμονία는 직분·권한의 뜻을 살려 ‘통치권을 맡다’로 옮겼습니다. 마지막 문장은 비교절이 앞선 내용 전체를 수식하는 구조를 분명히 하고, εὐλογίαις의 복수도 보존했습니다.
  reviewer_model: gpt-5.6-terra
