source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔσονται ὀλιγοστοί³⁶ ἐπιμεριζόμενοι³⁷ *ἐν τῷ³⁸ Λευὶ καὶ *ἐν τῷ³⁹ Ἰούδᾳ⁴⁰ καὶ οὐκ⁴¹ ἔσται ἐξ ὑμῶν *τις εἰς ἡγεμονίαν⁴² καθὼς καὶ ὁ πατὴρ ἡμῶν⁴³ προεφήτευσεν⁴⁴ *ἐν ταῖς⁴⁵ εὐλογίαις⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/006.yaml
  text: And they will be few in number, being divided among Levi and among Judah, and none from among you will be for leadership, just as our father also prophesied in the blessings.
translation:
  language: ko
  text: 그들은 레위와 유다 가운데서 나뉘어 적은 수로 남게 될 것이며, 너희 가운데서 누구도 지도자가 되지 못할 것입니다. 이것은 우리 아버지도 그 복들에서 예언하신 것과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοστοί
  english_pob_choice: few in number
  chosen_korean: 적은 수로 남게 될 것이며
  alternatives_korean:
  - 소수로 남게 될 것이며
  - 얼마 되지 않을 것이며
  lexicon: ὀλιγοστοί
  rationale: 단순히 ‘적다’보다 남은 자의 수가 적다는 의미를 자연스럽게 살려, 인원 축소의 결과를 드러냈습니다.
- source_word: ἐπιμεριζόμενοι ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ
  english_pob_choice: being divided among Levi and among Judah
  chosen_korean: 레위와 유다 가운데서 나뉘어
  alternatives_korean:
  - 레위와 유다 가운데서 분배되어
  - 레위와 유다에 나뉘어
  lexicon: ἐπιμερίζομαι
  rationale: 영어 본문의 among을 따라 ‘가운데서’로 옮겨, 두 지파 사이에 흩어져 배치된 상태를 살렸습니다.
- source_word: τις εἰς ἡγεμονίαν
  english_pob_choice: for leadership
  chosen_korean: 누구도 지도자가 되지 못할 것입니다
  alternatives_korean:
  - 누구도 통치자가 되지 못할 것입니다
  - 누구도 지도권을 맡지 못할 것입니다
  lexicon: ἡγεμονία
  rationale: 문맥상 지배 권한을 가리키지만 한국어에서는 ‘지도자’가 가장 직접적이고 과도하게 해석되지 않는 표현입니다.
- source_word: ἐν ταῖς εὐλογίαις
  english_pob_choice: in the blessings
  chosen_korean: 그 복들에서
  alternatives_korean:
  - 그 축복들에서
  - 복들 가운데서
  lexicon: εὐλογίαι
  rationale: 복수형을 유지해 한 번의 축복이 아니라 여러 축복들 안에서의 예언임을 드러냈습니다.
theological_decisions:
- issue: 예언의 근거를 나타내는 전치사구의 처리
  chosen_reading: “우리 아버지도 그 복들에서 예언하신 것”으로, 예언이 축복들 안/속에서 이루어진 것으로 읽었습니다.
  alternative_readings:
  - ‘그 복들에 관하여 예언하신 것’
  - ‘그 복들 가운데서 예언하신 것’
  rationale: source의 ἐν ταῖς εὐλογίαις는 예언의 매개/범위를 암시하므로, 단순한 주제 언급으로 약화하지 않고 문맥적 연결을 살렸습니다.
  doctrine_reference: patriarchal blessing and prophetic speech
