base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/002.yaml
  text: For the Lord will raise up from Levi a high priest, and from Judah a king, [God and man]; he will save [all the nations and] the race of Israel.
translation:
  language: ko
  text: 왜냐하면 주께서 레위에게서 대제사장을, 유다에게서 왕을 일으키실 것입니다. [하나님과 사람]인 그분이 [모든 민족과] 이스라엘의 족속을 구원하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 하나님
  lexicon: κύριος
  rationale: 본문의 주어는 하나님의 주권적 행위를 가리키므로, 직역에 가깝게 ‘주’로 옮기되 문맥상 하나님을 뜻하는 것으로 이해했습니다.
- source_word: ἀρχιερέα
  english_pob_choice: a high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 제사장
  lexicon: ἀρχιερεύς
  rationale: 레위에서 일으키는 인물의 직분을 분명하게 드러내는 가장 자연스러운 대응어입니다.
- source_word: βασιλέα
  english_pob_choice: a king
  chosen_korean: 왕
  alternatives_korean:
  - 임금
  - 군주
  lexicon: βασιλεύς
  rationale: 유다에서 일어날 인물의 통치 직분을 간명하게 전달하는 표준 번역입니다.
- source_word: γένος τοῦ Ἰσραήλ
  english_pob_choice: the race of Israel
  chosen_korean: 이스라엘의 혈통
  alternatives_korean:
  - 이스라엘의 족속
  - 이스라엘 자손
  lexicon: γένος
  rationale: 영어 POB의 ‘race’를 따라 공동체적·혈연적 계통을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: '[Θεὸν καὶ ἄνθρωπον]의 괄호 처리'
  chosen_reading: 본문의 전승상 삽입/대안 읽기 성격을 살려 본문 안에 대괄호로 유지했습니다.
  alternative_readings:
  - 본문에서 아예 삭제
  - 괄호 없이 단정적 진술로 번역
  rationale: 제공된 그리스어와 영어 POB 모두 이 구절을 대안 읽기처럼 표시하고 있으므로, 해석을 고정하지 않고 가시적으로 보존하는 편이 स्रोत 기반입니다.
  doctrine_reference: 전승 비평 / 본문 비평
- issue: '[πάντα τὰ ἔθνη]의 괄호 처리'
  chosen_reading: ‘모든 민족’을 대괄호로 유지하여, 영어 POB의 bracketed alternative reading을 반영했습니다.
  alternative_readings:
  - 괄호 없이 본문으로 병합
  - 생략
  rationale: 해당 구는 보존 전승에 따라 포함 여부가 흔들리는 확장으로 보이므로, 번역문에서 그 불확실성을 그대로 표시했습니다.
  doctrine_reference: 전승 비평 / 본문 비평
