    issue: γένος τοῦ Ἰσραήλ을 ‘이스라엘의 혈통’으로 번역함
    rationale: γένος는 이 문맥에서 이스라엘이라는 집단/족속을 뜻합니다. ‘혈통’은 계통이나 혈연 자체에 초점을 두어 의미 범위가 좁고 한국어로도 다소 부자연스럽습니다.
  - severity: low
    issue: 출처와 직분을 나타내는 표현이 충분히 드러나지 않음
    rationale: ἐκ과 ὡς가 각각 ‘…에게서’와 ‘…으로서’의 뜻을 가지므로, 이를 번역에 반영하면 원문의 구조가 더 분명해집니다.
