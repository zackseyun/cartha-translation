    rationale: ἀνατελεῖ의 ‘일어나다/떠오르다’ 이미지는 유지할 수 있으나, ‘구원이 우리에게 솟아나다’는 부자연스럽습니다. ‘우리 를 위하여 일어날 것입니다’로 여격의 수혜 의미를 드러내는 편이 자연스럽습니다.
