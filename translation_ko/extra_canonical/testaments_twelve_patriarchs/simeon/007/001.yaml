  to: 이제, 내 자녀들아, 레위와 유다의 말을 들으십시오. 그리고 이 두 지파보다 스스로를 높이지 마십시오. 그들에게서 하나님의 구원이 우리를 위하여 일어날 것이기 때문입니다.
