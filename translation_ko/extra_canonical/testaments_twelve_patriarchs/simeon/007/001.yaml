    rationale: μὴ ἐπαίρεσθε ἐπὶ τὰς δύο γενεὰς ταύτας는 이 두 지파를 상대로 자신을 높이거나 그들보다 우월하게 여기지 말라는 뜻입니다. 한국어에서는 ‘이 두 지파보다 스스로를 높이지 마십시오’가 이를 자연스럽고 직접적으로 나타냅니다.
  - severity: low
