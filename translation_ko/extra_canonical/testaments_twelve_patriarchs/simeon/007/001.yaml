id: T12P.SIM.7.1
reference: Testament of Simeon 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα¹ μου, ἐπακούσατε² τοῦ³ Λευὶ καὶ τοῦ⁴ Ἰούδα⁵ καὶ⁷ μὴ ἐπαίρεσθε⁸ ἐπὶ τὰς δύο γενεὰς⁹ ταύτας, ὅτι ἐξ αὐτῶν¹⁰ ἀνατελεῖ ἡμῖν¹¹ τὸ σωτήριον ⌜τοῦ Θεοῦ⌝¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/001.yaml
  text: And now, my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will rise for us.
translation:
  language: ko
  text: 이제, 내 자녀들아, 레위와 유다의 말을 들으십시오. 그리고 이 두 지파보다 스스로를 높이지 마십시오. 그들에게서 하나님의 구원이 우리를 위하여 일어날 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 자녀들아
  lexicon: τέκνα
  rationale: 직접 호소형 표현을 살려 친근하면서도 본문 흐름에 맞는 호격으로 옮겼습니다.
- source_word: ἐπακούσατε τοῦ Λευὶ καὶ τοῦ Ἰούδα
  english_pob_choice: listen to Levi and to Judah
  chosen_korean: 레위와 유다의 말을 들으십시오
  alternatives_korean:
  - 레위와 유다에게 귀 기울이십시오
  - 레위와 유다를 들으십시오
  lexicon: ἐπακούω
  rationale: ἐπακούσατε의 청유적 명령을 한국어 자연문으로 옮기되, 단순 청취보다 ‘말을 듣다’가 권고의 의미를 분명히 드러냅니다.
- source_word: μὴ ἐπαίρεσθε ἐπὶ τὰς δύο γενεὰς ταύτας
  english_pob_choice: do not exalt yourselves over these two tribes
  chosen_korean: 이 두 지파 위에서 스스로를 높이지 마십시오
  alternatives_korean:
  - 이 두 지파를 업신여기지 마십시오
  - 이 두 지파보다 자신을 높이지 마십시오
  lexicon: ἐπαίρω
  rationale: 비교 우월을 금하는 동작을 한국어로 직접 드러내기 위해 ‘스스로를 높이다’를 유지했습니다.
- source_word: τὸ σωτήριον
  english_pob_choice: the salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구원하심
  - 구원의 길
  lexicon: σωτήριον
  rationale: 명사형 의미를 자연스럽게 살려 ‘구원’으로 옮겼고, 문맥상 주어는 뒤의 ‘하나님’이므로 별도의 설명을 덧붙이지 않았습니다.
theological_decisions:
- issue: to whom the salvation belongs
  chosen_reading: ‘하나님의 구원’으로 직역해 구원의 근원이 하나님께 있음을 분명히 했습니다.
  alternative_readings:
  - ‘하나님께서 주시는 구원’
  - ‘하나님으로부터 오는 구원’
  rationale: 원문의 τοῦ Θεοῦ를 소유/관계 구문으로 읽으면 구원의 출처가 하나님임을 가장 직접적으로 나타냅니다.
  doctrine_reference: 구원론; 하나님의 주권적 구원 행위
- issue: register of imperative speech to descendants
  chosen_reading: 직접 권고형을 한국어 합쇼체 명령/청유로 유지했습니다.
  alternative_readings:
  - 더 서술적으로 완화된 표현
  - 반말형 직설
  rationale: 부친이 자녀들에게 남기는 권고의 호소력을 살리되, 현대 출판문체에 맞게 공손한 지시형으로 정리했습니다.
  doctrine_reference: 문체/화행 보존
