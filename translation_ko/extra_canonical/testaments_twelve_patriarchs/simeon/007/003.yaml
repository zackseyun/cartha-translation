base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/003.yaml
  text: Therefore I command these things to you, so that you also may command your children, that they may keep them for their generations.
translation:
  language: ko
  text: 그러므로 나는 이것들을 여러분에게 명령합니다. 이는 여러분도 여러분의 자녀들에게 명령하여 그들이 그것을 자기들의 세대마다 지키게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  english_pob_choice: I command
  chosen_korean: 명령합니다
  alternatives_korean:
  - 지시합니다
  - 당부합니다
  lexicon: ἐντέλλομαι
  rationale: 단순한 권고가 아니라 권위를 가진 명령을 나타내므로, 강도를 유지해 ‘명령합니다’로 옮겼습니다.
- source_word: τοῖς τέκνοις ὑμῶν
  english_pob_choice: your children
  chosen_korean: 여러분의 자녀들에게
  alternatives_korean:
  - 너희 자녀들에게
  - 당신들의 자녀들에게
  lexicon: τέκνα
  rationale: 현대 한국어에서 자연스럽고 공적 문체에 맞게 ‘여러분의 자녀들’로 옮겼습니다.
- source_word: φυλάξωσιν αὐτὰ
  english_pob_choice: they may keep them
  chosen_korean: 그들이 그것을 지키게
  alternatives_korean:
  - 그것을 지키게
  - 그것들을 지키게
  lexicon: φυλάσσω
  rationale: 복수 대명사 αὐτά는 앞선 규정/가르침 전체를 가리킬 수 있어, 문맥상 한국어에서는 단수 총칭 ‘그것’을 사용해 자연스럽게 처리했습니다.
- source_word: εἰς τὰς γενεὰς αὐτῶν
  english_pob_choice: for their generations
  chosen_korean: 자기들의 세대마다
  alternatives_korean:
  - 그들의 세대들을 위해
  - 대대로
  lexicon: γενεά
  rationale: 미래의 연속성을 나타내는 표현을 보존하되, 한국어로는 반복적·지속적 뉘앙스를 살려 ‘세대마다’로 옮겼습니다.
theological_decisions:
- issue: 명령-전승 구조
  chosen_reading: 화자가 받은 명령을 다음 세대로 전달하라는 계명 전승 구조로 옮겼습니다.
  alternative_readings:
  - 단순한 교육 권고로 완화하는 번역
  - 세대 전승을 생략하는 번역
  rationale: 본문은 ‘내가 명령한다 → 너희도 자녀들에게 명령하라 → 그들이 지키게 하라’는 단계적 구조를 가지므로, 권위와 전승 의무를 분명히 드러내는 것이 적절합니다.
  doctrine_reference: 신 6:6-7의 계명 전승 원리와 병행되는 교육적-언약적 책임
- issue: 대상 독자 호칭
  chosen_reading: 직접 청중에게 공손한 복수 호칭인 ‘여러분’을 사용했습니다.
  alternative_readings:
  - 너희
  - 당신들
  rationale: 합쇼체 문체에서 직접 청중을 공손하게 지시하면서도 복수성을 유지하기에 적절합니다.
  doctrine_reference: 표준 현대 한국어 문체 규범
