id: T12P.SIM.1.2
reference: Testament of Simeon 1:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*¹Ἀρρωστοῦντος τοῦ Συμεὼν ἦλθον ἐπισκέψασθαι αὐτὸν οἱ υἱοὶ αὐτοῦ¹¹ καὶ¹² ἐνισχύσας ἐκάθισε¹³, καὶ κατεφίλησεν¹⁴ αὐτοὺς καὶ εἶπεν¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/002.yaml
  text: 'And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up, kissed them[b], and said:'
  footnotes:
  - marker: b
    text: The phrase 'kissed them' renders an intensive Greek verb that can suggest repeated or affectionate kissing.
    reason: lexical_alternative
translation:
  language: ko
  text: 시므온이 병들어 있을 때에 그의 아들들이 그를 찾아왔습니다. 그는 기운을 내어 일어나 앉아, 그들에게 입맞추고 말했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘입맞추고’로 옮긴 그리스어 동사는 강조형으로, 거듭하거나 애정 깊게 입맞추는 뜻을 나타낼 수 있습니다.
    reason: κατεφίλησεν의 강조·애정 뉘앙스 가능성을 밝혀 주되, 본문에서는 그 강도를 단정하지 않습니다.
lexical_decisions:
- source_word: Ἀρρωστοῦντος τοῦ Συμεὼν
  english_pob_choice: when Simeon was sick
  chosen_korean: 시므온이 병들어 있을 때에
  alternatives_korean:
  - 시므온이 아플 때에
  - 시므온이 병이 들어 있을 때에
  lexicon: ἀρρωστέω
  rationale: 상태를 자연스럽게 풀되, 단순 과거가 아니라 병약한 상태의 배경을 드러내는 문맥을 살렸습니다.
- source_word: ἐπισκέψασθαι αὐτόν
  english_pob_choice: came to visit him
  chosen_korean: 그를 찾아왔습니다
  alternatives_korean:
  - 그를 방문하러 왔습니다
  - 그를 찾아 문안하러 왔습니다
  lexicon: ἐπισκέπτομαι
  rationale: 가족이 병든 아버지를 찾아가는 장면이므로 ‘찾아오다’가 방문의 뜻을 자연스럽게 담습니다.
- source_word: ἐνισχύσας ἐκάθισε
  english_pob_choice: gathering his strength, he sat up
  chosen_korean: 그는 기운을 내어 일어나 앉았고
  alternatives_korean:
  - 힘을 내어 일어나 앉았고
  - 기운을 다해 일어나 앉았고
  lexicon: ἐνισχύω
  rationale: ‘기운을 내다’가 원문의 힘을 모아 움직이는 뉘앙스를 한국어로 간결하게 옮깁니다.
- source_word: κατεφίλησεν
  english_pob_choice: kissed them
  chosen_korean: 그들에게 입맞추고
  alternatives_korean:
  - 그들을 여러 번 입맞추고
  - 애정으로 입맞추고
  lexicon: καταφιλέω
  rationale: 기본 의미는 ‘입맞추다’이지만, 강한 애정 표현일 수 있으므로 표준 본문은 간명하게 두고 각주는 그 강도를 설명합니다.
theological_decisions:
- issue: 가족적 애정 표현의 강도
  chosen_reading: 그는 자녀들을 맞으며 진한 애정의 입맞춤을 한 뒤 말을 시작합니다.
  alternative_readings:
  - 단순한 인사 입맞춤
  - 정서적 과장 없이 평범한 입맞춤
  rationale: 본문은 단순 접촉보다 더 강한 애정 표현을 암시할 수 있어, 본문은 과장하지 않되 각주로 그 가능성을 남깁니다.
  doctrine_reference: 본문 내 서사적·수사적 관찰
