translation:
  language: ko
  text: 시므온이 죽기 전에, 곧 그의 생애 백스무 번째 해에 그의 형제 요셉이 죽었을 때, 자기 아들들에게 한 말의 사본[a]입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시므온이 한 말의 기록’.
    reason: ἀντίγραφον의 어휘적 대안으로, 영어 POB 각주의 ‘record’를 반영합니다.
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  english_pob_choice: A copy of the words
  chosen_korean: 말들의 사본
  alternatives_korean:
  - 말들의 기록
  - 말씀의 사본
  lexicon: ἀντίγραφον
  rationale: 영어 POB의 'copy'를 따라 사본으로 옮기되, λόγων은 문맥상 '말들'이 가장 직접적이라서 '말들의 사본'으로 처리했습니다.
- source_word: Συμεών
  english_pob_choice: Simeon
  chosen_korean: 시므온
  alternatives_korean:
  - 시몬
  lexicon: Συμεών
  rationale: 문헌 전통과 인명 관행을 반영하여 이 전승의 인물명은 시므온으로 옮겼습니다.
- source_word: ἐλάλησε τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: he spoke to his sons
  chosen_korean: 자기 아들들에게 이 말을 하였습니다
  alternatives_korean:
  - 자기 아들들에게 말하였습니다
  - 자기 아들들에게 이 말을 전하였습니다
  lexicon: λαλέω
  rationale: 직접 발화 행위를 분명히 하면서도 한국어에서 자연스러운 서술형으로 맞췄습니다.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the hundred and twentieth year of his life
  chosen_korean: 자기 생애의 백스무 해에
  alternatives_korean:
  - 자기 삶의 백이십 년째에
  - 자기 생애 120년에
  lexicon: ἔτος
  rationale: 연령 표현을 현대 한국어로 자연스럽게 옮기면서도, 단순 나이보다 '생애의 ... 해'라는 서술을 유지했습니다.
- source_word: ἀπέθανεν Ἰωσὴφ ὁ ἀδελφὸς αὐτοῦ
  english_pob_choice: Joseph his brother died
  chosen_korean: 그의 형 요셉이 죽은 그때에
  alternatives_korean:
  - 그의 형 요셉이 죽었을 때에
  - 그의 형 요셉이 죽는 때에
  lexicon: ἀποθνῄσκω
  rationale: 동시성을 드러내는 ἐν ᾧ χρόνῳ를 반영하여 '그때에'를 넣고, 관계절의 자연스러운 한국어 순서를 택했습니다.
theological_decisions:
- issue: 문헌 서문 형식의 처리
  chosen_reading: 이 절은 교리 진술이 아니라 문헌 서문이므로, 내용 의미를 훼손하지 않는 범위에서 서술적 한국어로 옮겼습니다.
  alternative_readings:
  - 문헌체를 더 직역한 표제식 번역
