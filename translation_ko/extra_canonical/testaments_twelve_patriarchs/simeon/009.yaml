base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009.yaml
  text: And the sons of Simeon wept for their father[c][b][a]. And they were in Egypt until the day of their departure by the hand of Moses.
  footnotes:
  - marker: a
    text: Or 'until the day of their exodus.'
    reason: lexical_alternative
  - marker: b
    text: '''By the hand of Moses'' is a biblical idiom meaning ''through Moses'' or ''under Moses'' leadership.'''
    reason: cultural_note
  - marker: c
    text: 'The final line in the source transitions directly into the heading of the next work: ''The Testament of Levi, the third son of Jacob and Leah.'' It is not part of Simeon 9 proper.'
    reason: textual_variant
translation:
  language: ko
  text: 그리고 시므온의 아들들은 자기 아버지를 위해 울었습니다. 그리고 그들은 모세의 손에 의한 자기들의 출애굽의 날까지 이집트에 있었습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσαν
  english_pob_choice: wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 곡했습니다
  - 애곡했습니다
  lexicon: LSJ
  rationale: κλαίω의 aorist는 통상적인 ‘울다’의 의미를 가지므로, 과도하게 장례 의례화하지 않으면서도 애도의 행위를 자연스럽게 살렸습니다.
- source_word: υἱοὶ
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 아들
  lexicon: LSJ
  rationale: 족보적·가부장적 문맥에서 υἱοὶ는 ‘아들들’이 가장 직접적입니다.
- source_word: εἰς Αἴγυπτον
  english_pob_choice: in Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 이집트 안에
  - 이집트로
  lexicon: LSJ
  rationale: ἦσαν과 함께 쓰인 εἰς는 여기서 지속적 존재를 나타내는 관용으로 읽히므로, 한국어는 위치를 나타내는 ‘-에’로 자연스럽게 옮겼습니다.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  english_pob_choice: until the day of their departure
  chosen_korean: 자기들의 출애굽의 날까지
  alternatives_korean:
  - 자기들의 떠남의 날까지
  - 자기들의 출발의 날까지
  lexicon: LSJ
  rationale: ἐξόδου는 일반명사로도 읽히지만, 모세의 언급과 연결되어 출애굽 사건을 가리키는 뉘앙스가 강하므로 ‘출애굽’으로 옮겨 역사적 암시를 살렸습니다.
- source_word: ἐν χειρὶ Μωϋσῆ
  english_pob_choice: by the hand of Moses
  chosen_korean: 모세의 손에 의한
  alternatives_korean:
  - 모세를 통해
  - 모세의 손으로
  lexicon: LSJ
  rationale: 성경적 관용구의 직설성을 유지하려고 ‘손에 의한’을 택해, 단순한 대리성 이상의 본문 풍격을 보존했습니다.
theological_decisions:
- issue: ἐξόδου를 일반적 ‘departure’가 아니라 ‘출애굽’으로 드러낼지 여부
  chosen_reading: 본문에서는 ‘출애굽’으로 옮겨 사건성을 분명히 했습니다.
  alternative_readings:
  - 떠남
  - 출발
  rationale: 본문과 모세의 연계가 이미 역사적 구출 사건을 가리키므로, 독자가 그 성경적 사건성을 즉시 이해하도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
- issue: ἐν χειρὶ Μωϋσῆ의 관용구를 해석어로 풀지, 직역을 유지할지 여부
  chosen_reading: 직역적 관용을 유지했습니다.
  alternative_readings:
  - 모세를 통해
  - 모세의 지도 아래
  rationale: 이 표현은 행위의 주체를 넘어 구속사적 매개를 드러내는 성경적 문체이므로, 너무 평이한 설명어로 바꾸지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
