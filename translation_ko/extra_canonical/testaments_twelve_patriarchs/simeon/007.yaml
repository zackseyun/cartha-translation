base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007.yaml
  text: And now[[God and man]], my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will arise for us. For the Lord will raise up from Levi as a high priest, and from Judah as a king, [God and man]; he will save [all the nations and] the race of Israel[[all the nations and]]. Therefore I command these things to you, so that you also may command your children[the race of Israel], that they may keep them throughout their generations.
  footnotes:
  - marker: '[God and man]'
    text: The Greek witness includes this phrase in brackets, suggesting textual uncertainty or possible later expansion. It is translated here for transparency rather than silently omitted.
    reason: textual_variant
  - marker: '[all the nations and]'
    text: This phrase is bracketed in the Greek witness and may reflect a textual expansion. The main text retains it with brackets to show the uncertainty.
    reason: textual_variant
  - marker: the race of Israel
    text: Or 'the people of Israel.' The Greek γένος emphasizes lineage or kin-group.
    reason: lexical_alternative
translation:
  language: ko
  text: 지금, 내 자녀들아, 레위와 유다의 말을 들으십시오. 그리고 이 두 지파를 두고 스스로 높아지지 마십시오. 왜냐하면 그들로부터 하나님의 구원이 우리에게 일어날 것이기 때문입니다. 주께서 레위로부터는 대제사장을 일으키시고, 유다로부터는 왕을 일으키실 것입니다 — [하나님과 사람]. 그는 [모든 민족과] 이스라엘의 혈통을 구원할 것입니다. 그러므로 나는 여러분에게 이 일들을 명령합니다. 이는 여러분도 여러분의 자녀에게 명령하여, 그들이 대대로 그것을 지키게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπακούσατε
  english_pob_choice: listen to
  chosen_korean: 들으십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 들어주십시오
  lexicon: BDAG
  rationale: 권면의 명령형으로서 단순 청취보다 반응을 포함한 ‘듣다’가 자연스럽고, 합쇼체에서도 직접 호소의 힘을 살립니다.
- source_word: μὴ ἐπαίρεσθε
  english_pob_choice: do not exalt yourselves over
  chosen_korean: 스스로 높아지지 마십시오
  alternatives_korean:
  - 교만해지지 마십시오
  - 자만하지 마십시오
  lexicon: LSJ
  rationale: 두 지파를 ‘두고’ 자신을 높이는 태도를 경계하는 표현이므로, 자기-고양의 동작을 직접 드러내는 번역이 가장 가깝습니다.
- source_word: τὰς δύο γενεὰς ταύτας
  english_pob_choice: these two tribes
  chosen_korean: 이 두 지파
  alternatives_korean:
  - 이 두 세대
  - 이 두 족속
  lexicon: LSJ
  rationale: γενεά의 기본값은 세대이지만, 문맥상 레위와 유다라는 계보 집단을 가리키므로 한국어로는 ‘지파’가 의미를 가장 분명하게 전달합니다.
- source_word: τὸ σωτήριον τοῦ Θεοῦ
  english_pob_choice: the salvation of God
  chosen_korean: 하나님의 구원
  alternatives_korean:
  - 하나님의 구원의 일
  - 하나님의 구원하심
  lexicon: BDAG
  rationale: ‘구원’은 σωτήριον의 핵심을 간명하게 살리면서, 한국어에서 자연스럽게 하나님의 주도적 구원 행위를 드러냅니다.
- source_word: γένος
  english_pob_choice: the race of Israel
  chosen_korean: 이스라엘의 혈통
  alternatives_korean:
  - 이스라엘의 족속
  - 이스라엘의 민족
  lexicon: LSJ
  rationale: γένος의 혈연·계보 뉘앙스를 보존하기 위해 ‘혈통’을 택했습니다. 현대어에서 오해 가능성은 있으나, 본문이 민족 일반보다 계보 집단을 강조합니다.
theological_decisions:
- issue: 괄호로 제시된 Θεὸν καὶ ἄνθρωπον
  chosen_reading: 본문에 그대로 [하나님과 사람]으로 옮기고 대괄호로 불확실성을 표시했습니다.
  alternative_readings:
  - 아예 생략하기
  - ‘신성과 인성’으로 해석해 옮기기
  rationale: 전승 본문에 괄호 처리된 표현이므로, 문헌적 투명성을 위해 보존하되 후대 교리 용어로 풀지 않았습니다.
  doctrine_reference: 본문 비평의 불확실성을 유지하고 해석을 과잉 확정하지 않음
- issue: 괄호로 제시된 πάντα τὰ ἔθνη
  chosen_reading: 본문에 [모든 민족과]로 유지했습니다.
  alternative_readings:
  - 생략하기
  - ‘모든 이방 민족과’로 한정하기
  rationale: 공급된 그리스어 전승의 괄호를 반영해 보존했으며, ἔθνη는 문맥상 ‘민족들’이 더 중립적이어서 ‘민족’으로 옮겼습니다.
  doctrine_reference: 원문 전승의 불확실성을 가시화하는 투명성 원칙
