lexical_decisions:
- source_word: Ἀκούσατε / τέκνα μου
  english_pob_choice: Hear, my children
  chosen_korean: 들으십시오, 내 자녀들아
  alternatives_korean:
  - 들으라, 내 자녀들아
  - 들으십시오, 내 자녀들이여
  lexicon: ἀκούω
  rationale: 서두의 직접 호소를 합쇼체 명령으로 살리고, 관계적 호칭은 직역에 가깝게 옮겼습니다.
- source_word: τὰ ἤπατά μου
  english_pob_choice: my liver
  chosen_korean: 내 간
  alternatives_korean:
  - 내 심장
  - 내 속
  lexicon: ἧπαρ
  rationale: 본문이 반복적으로 ‘간’을 정서·의지의 자리로 사용하므로, 전통적으로 완화하지 않고 그대로 옮겼습니다.
- source_word: ὁ ἄρχων τῆς πλάνης καὶ τὸ πνεῦμα τοῦ ζήλου
  english_pob_choice: the ruler of deceit and the spirit of jealousy
  chosen_korean: 거짓의 통치자와 시기의 영
  alternatives_korean:
  - 속임수의 지배자와 질투의 영
  - 미혹의 통치자와 질투의 영
  lexicon: ἄρχων / πνεῦμα
  rationale: POB의 ‘deceit’와 ‘jealousy’의 대립 구조를 유지하면서, 지배적 존재와 영적 동인을 분명하게 살렸습니다.
- source_word: μετανοήσας
  english_pob_choice: after changing my mind
  chosen_korean: 마음을 돌이킨 뒤
  alternatives_korean:
  - 회개한 뒤
  - 생각을 바꾼 뒤
  lexicon: μετανοέω
  rationale: 이 문맥에서는 단순한 내면 변화보다 죄를 깨닫고 방향을 바꾸는 의미를 담지만, 후대 교리어로 고정하지 않기 위해 합의역으로 처리했습니다.
- source_word: πρᾶγμα / πράξιν
  english_pob_choice: deed / matter
  chosen_korean: 행위 / 일
  alternatives_korean:
  - 행동 / 사정
  - 일 / 사건
  lexicon: πρᾶγμα / πρᾶξις
  rationale: 같은 단락 안의 두 표현 차이를 반영해, 하나는 행위, 하나는 상황·사안을 가리키는 ‘일’로 구분했습니다.
theological_decisions:
- issue: ἄρχων τῆς πλάνης와 τὸ πνεῦμα τοῦ ζήλου의 영적 원인 설명
  chosen_reading: 요셉에 대한 폭력적 의도의 원인을 외적 악의 지배와 내적 시기심의 영적 작용으로 함께 제시했습니다.
  alternative_readings:
  - 단순 심리 묘사로 완화
  - 상징적 표현으로 약화
  rationale: 본문은 책임을 흐리지 않으면서도 죄의 영적 성격을 분명히 하므로, 이를 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 인간 책임과 악의 영적 영향에 대한 본문 내 긴장
