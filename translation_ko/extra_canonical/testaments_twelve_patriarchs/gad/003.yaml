  source_fidelity: 전반적인 의미와 문단 구조는 잘 보존되었습니다. 다만 πλανᾶσθε는 ‘이끌려 잘못되다’보다 ‘미혹되다’가 자연스럽고 수동/중간태의 피동적 뉘앙스도 더 잘 드러냅니다. 또한 ὡς κἀγὼ τότε ἔβλεπον τὸν Ἰωσήφ는 미움이 화자의 영혼도 눈멀게 했던 과거 경험을 회고하는 말이므로, 이를 한 문장으로 연결하는 편이 충실합니다.
  naturalness: 초안의 ‘의를 행하고 … 지키기 위해 들으십시오’는 ‘들으십시오’가 연달아 반복되어 다소 부자연스럽습니다. 목적을 나타내는 ‘…하도록 들으십시오’로 정리했습니다. ‘그것은 사람들의 모든 행위에서 악하기 때문입니다’도 지시 대상이 다소 흐리므로 ‘미움의 영은 사람이 하는 모든 일에서 악하기 때문입니다’로 명료하게 했습니다.
  terminology: ‘의’, ‘율법’, ‘주님’, ‘미움의 영’, ‘영혼’, ‘요셉’은 적절합니다. καταλαλιά는 특히 악의적인 말이나 비방을 뜻하므로 ‘중상모략을 받아들이다’보다 ‘비방을 반기다’가 현대 한국어에서 자연스럽고 ἀσπάζεται의 호의적으로 받아들이는 뉘앙스도 살립니다.
