base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003.yaml
  text: '1[a]. And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, my children, by the spirit of hatred, because it is evil in all the deeds of men. 2. For whatever the one who hates may do, it is abominable. If someone does the law of the Lord[b], the hater does not praise him. If someone fears the Lord and desires what is righteous, the hater does not love him. 3. He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.'
  footnotes:
  - marker: a
    text: Or 'hear the true word'; the Greek opening can be taken either as an indefinite or more definite exhortational formula.
    reason: lexical_alternative
  - marker: b
    text: '''The one who prospers'' may also be rendered ''the one who succeeds'' or possibly ''the one who acts rightly,'' but the immediate context of envy favors successful action.'
    reason: lexical_alternative
translation:
  language: ko
  text: 1. 그리고 이제 진리의 말씀을 들으십시오. 의를 행하고 지극히 높으신 분의 모든 율법을 지키기 위해 들으십시오. 내 자녀들아, 미움의 영에 이끌려 잘못되지 마십시오. 그것은 사람들의 모든 행위에서 악하기 때문입니다. 2. 미워하는 자가 무엇을 하든 그것은 가증합니다. 어떤 사람이 주님의 율법을 행하면, 미워하는 자는 그를 칭찬하지 않습니다. 어떤 사람이 주님을 두려워하고 옳은 것을 바라면, 미워하는 자는 그를 사랑하지 않습니다. 3. 그는 진리를 꾸짖고, 잘되는 자를 시기하며, 중상모략을 받아들이고, 교만을 사랑합니다. 미움이 그의 영혼을 눈멀게 하기 때문입니다. 그것은 내가 요셉을 바라보았을 때 내게도 그랬습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον ἀληθείας
  english_pob_choice: a word of truth
  chosen_korean: 진리의 말씀
  alternatives_korean:
  - 참된 말씀
  - 진리의 한 말씀
  lexicon: LSJ
  rationale: ‘말씀’은 예언·권면의 서두를 자연스럽게 살리고, ‘진리의’는 ἀληθείας의 질적 의미를 압축해 옮깁니다.
- source_word: τοῦ ποιεῖν δικαιοσύνην
  english_pob_choice: listen in order to practice righteousness
  chosen_korean: 의를 행하고 … 들으십시오
  alternatives_korean:
  - 의를 실천하기 위해 들으십시오
  - 의를 행하도록 들으십시오
  lexicon: LSJ
  rationale: 목적 부정사구의 권면적 힘을 살려, ‘듣기’가 곧 ‘행함’으로 이어지는 구조를 한국어에서 직접적으로 드러냈습니다.
- source_word: πάντα νόμον ὑψίστου
  english_pob_choice: every law of the Most High
  chosen_korean: 지극히 높으신 분의 모든 율법
  alternatives_korean:
  - 지극히 높으신 분의 모든 법
  - 지극히 높으신 분의 모든 계명
  lexicon: LSJ
  rationale: νόμος의 기본 대응인 ‘율법’을 유지하고, ὑψίστου는 고유한 신적 칭호로서 ‘지극히 높으신 분’으로 옮겼습니다.
- source_word: πνεύματι τοῦ μίσους
  english_pob_choice: the spirit of hatred
  chosen_korean: 미움의 영
  alternatives_korean:
  - 증오의 영
  - 미움의 정신
  lexicon: LSJ
  rationale: 인격화된 도덕적 힘이라는 긴장을 보존하면서도, 한국어에서 과도한 신학화 없이 자연스럽게 읽히는 ‘영’을 택했습니다.
- source_word: τὸ δίκαιον
  english_pob_choice: what is righteous
  chosen_korean: 옳은 것
  alternatives_korean:
  - 의로운 것
  - 올바른 것
  lexicon: LSJ
  rationale: 여기서는 규범적·윤리적 대상을 가리키므로, ‘옳은 것’으로 간결하게 옮겨 문맥의 대조를 분명히 했습니다.
- source_word: τῷ κατορθοῦντι
  english_pob_choice: the one who prospers
  chosen_korean: 잘되는 자
  alternatives_korean:
  - 형통하는 자
  - 성공하는 자
  lexicon: LSJ
  rationale: 질투의 대상이 되는 ‘잘됨’의 결과를 드러내어, 이어지는 ‘시기하다’와의 연결을 한국어에서 분명하게 했습니다.
- source_word: καταλαλιὰν ἀσπάζεται
  english_pob_choice: embraces slander
  chosen_korean: 중상모략을 받아들이고
  alternatives_korean:
  - 중상모략을 반기고
  - 뒷말을 즐기고
  lexicon: LSJ
  rationale: ‘ἀσπάζεται’의 환영·환대의 뉘앙스를 살리되, 비난적 발화를 뜻하는 ‘중상모략’으로 관용구를 풀어 옮겼습니다.
theological_decisions:
- issue: ‘미움의 영’의 성격
  chosen_reading: 본문의 personification을 유지해 도덕적·영적 영향력으로 읽고, 본문 안에서 이를 단정적 악령론으로 확정하지 않았습니다.
  alternative_readings:
  - 증오라는 내적 태도
  - 미움을 일으키는 영적 존재
  rationale: 그리스어는 인격화된 힘을 허용하지만, 본문이 그 정체를 더 좁게 규정하지는 않으므로 긴장을 보존하는 번역이 더 충실합니다.
  doctrine_reference: 의도된 모호성 보존
