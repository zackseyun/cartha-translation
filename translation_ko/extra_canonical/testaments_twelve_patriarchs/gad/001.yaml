  naturalness: 한국어 자체에는 대체로 합쇼체가 유지되지만, ‘갓의 말들의 사본’, ‘성공한 사람을 불평하며’, ‘양 떼를 먹고’, ‘사람의 아들 아무도’, ‘그분의 행위로 하나님의 율법을 가르치기’ 등은 부자연스럽거나 의미가 불명확합니다. 그러나 문체 교정으로 해결할 수 없는 근본적인 원문 불일치가 있습니다.
