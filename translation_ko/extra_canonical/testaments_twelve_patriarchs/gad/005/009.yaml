revisions:
- from: 하나님께서 내게 간 질병을 내리셨습니다. 그리고 만일 내 아버지의 기도들이 나를 도와주지 않았다면, 내 영은 거의 소멸했을 것입니다.[a][b][c]
  to: 하나님께서는 내게 간 질환을 내리셨습니다. 내 아버지의 기도가 나를 도와주지 않았더라면, 내 영은 거의 사라졌을 것입니다.
  rationale: The revision retains the direct attribution of the illness to God, the counterfactual help of the father's prayers, and the deliberately broad πνεῦμα as ‘영’. It replaces unnatural literal plurals and removes unsupported, dangling anchors; no footnote content was supplied that can be responsibly retained or relocated.
