  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 9. Ἐπήγαγε γάρ⁴¹ μοι ὁ Θεὸς νόσον ἥπατος, καὶ εἰ μὴ⁵⁷ *αἱ εὐχαὶ⁵⁸ τοῦ πατρός μου⁵⁹ *ἐβοήθησάν μοι⁶⁰, ὀλίγου δεῖν⁶¹ *ἐξέλειπε τὸ πνεῦμα μου⁶².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/009.yaml
  text: For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed.
translation:
  language: ko
  text: 하나님께서 내게 간 질병을 내리셨습니다. 그리고 만일 내 아버지의 기도들이 나를 도와주지 않았다면, 내 영은 거의 소멸했을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπήγαγε ... ὁ Θεὸς
  english_pob_choice: God brought upon me
  chosen_korean: 하나님께서 내게 …을 내리셨습니다
  alternatives_korean:
  - 하나님께서 내게 …를 가져오셨습니다
  - 하나님께서 내게 …를 일으키셨습니다
  lexicon: Θεός → 하나님
  rationale: 동사 ἐπήγαγε는 단순 ‘주다’보다 불러오다/내리다의 뉘앙스가 있어, 병을 ‘내리셨다’로 옮겨 원문의 불리한 사건의 부과를 살렸습니다.
- source_word: νόσον ἥπατος
  english_pob_choice: a disease of the liver
  chosen_korean: 간 질병
  alternatives_korean:
  - 간의 병
  - 간병
  lexicon: νόσος / ἧπαρ
  rationale: 직역형이면서도 현대 한국어에서 자연스럽게 읽히는 표현으로 정리했습니다. ‘간 질병’은 병의 부위를 분명히 하되 과도한 의학화는 피합니다.
- source_word: αἱ εὐχαὶ τοῦ πατρός μου
  english_pob_choice: the prayers of my father
  chosen_korean: 내 아버지의 기도들
  alternatives_korean:
  - 내 아버지의 기도
  - 아버지의 기도들
  lexicon: εὐχαί
  rationale: 복수형 εὐχαί를 살려 ‘기도들’로 옮겼습니다. 이는 반복적·다수의 간구를 반영하며 단수화로 약화시키지 않기 위함입니다.
- source_word: ὀλίγου δεῖν ἐξέλειπε τὸ πνεῦμα μου
  english_pob_choice: my spirit would almost have failed
  chosen_korean: 내 영은 거의 소멸했을 것입니다
  alternatives_korean:
  - 내 영은 거의 빠져나갔을 것입니다
  - 내 영이 거의 떠나갈 뻔했습니다
  lexicon: πνεῦμα → 영
  rationale: πνεῦμα를 ‘영’으로 유지해 생명/기력의 핵심이 꺼질 뻔한 상태를 표현했습니다. ‘소멸하다’는 다소 강하지만 원문의 거의 죽음에 이르는 위기를 충분히 전달합니다.
theological_decisions:
- issue: 하나님의 주권적 원인 진술
  chosen_reading: 질병을 하나님께서 ‘내리셨다’는 서술을 그대로 유지했습니다.
  alternative_readings:
  - 하나님께서 허락하셨습니다
  - 하나님께서 보내셨습니다
  rationale: 본문은 고난의 직접적 귀속을 완화하지 않으며, 원문의 인과 진술을 보존하는 것이 더 source-direct합니다.
  doctrine_reference: 섭리와 고난의 귀속
- issue: 아버지의 기도와 생명 보존
  chosen_reading: 아버지의 기도가 화자의 생명을 지탱하는 중보적 수단으로 제시된 구도를 유지했습니다.
  alternative_readings:
  - 아버지의 기도가 나를 위로했다
  - 아버지의 기도가 나를 살렸다
  rationale: 원문은 정서적 위로보다 실제적인 도움/구원을 말하므로, 기도의 효력을 구체적으로 드러내는 쪽이 적절합니다.
  doctrine_reference: 기도의 중보성
