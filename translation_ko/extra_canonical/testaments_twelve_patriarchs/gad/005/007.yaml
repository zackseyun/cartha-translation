id: T12P.GAD.5.7
reference: Testament of Gad 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/007.yaml
  text: For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
translation:
  language: ko
  text: 그러므로 하나님 뜻에 따른 참된 회개는 [무지를 없애고] 어둠을 몰아내며, 눈을 밝히고, 영혼에 지식을 주며, 마음을 구원으로 이끕니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάνοια
  english_pob_choice: repentance
  chosen_korean: 회개
  alternatives_korean:
  - 회심
  - 뉘우침
  lexicon: μετάνοια
  rationale: 문맥상 단순 후회가 아니라 하나님을 향한 방향 전환을 가리키므로 표준적인 ‘회개’를 택했습니다.
- source_word: κατὰ Θεὸν
  english_pob_choice: according to God
  chosen_korean: 하나님에 따른
  alternatives_korean:
  - 하나님께 속한
  - 하나님 뜻에 따른
  lexicon: κατά + Θεός
  rationale: 원문의 기준/준거 의미를 살려 ‘하나님에 따른’으로 옮겼습니다.
- source_word: φυγαδεύει τὸ σκότος
  english_pob_choice: puts darkness to flight
  chosen_korean: 어둠을 도망하게 하며
  alternatives_korean:
  - 어둠을 쫓아내며
  - 어둠을 물리치며
  lexicon: φυγαδεύω + σκότος
  rationale: ‘도망하게 하다’는 퇴각·도피의 동작을 살려 어둠이 사라지는 역동을 비교적 직역에 가깝게 표현합니다.
- source_word: τὸ διαβούλιον
  english_pob_choice: the mind
  chosen_korean: 마음
  alternatives_korean:
  - 생각
  - 의중
  - 생각하는 바
  lexicon: διαβούλιον
  rationale: 영어 POB의 최신 보정처럼 의미 중심은 ‘mind’에 가깝지만, 한국어에서는 자연스럽고 넓은 인지·결단의 자리인 ‘마음’이 가장 무난합니다.
theological_decisions:
- issue: 회개의 효력 묘사
  chosen_reading: 참된 회개가 무지를 없애고, 어둠을 물리치며, 인식과 방향을 새롭게 하여 구원으로 이끈다는 진술로 읽었습니다.
  alternative_readings:
  - 회개의 결과를 상징적으로만 이해하는 읽기
  - 단순한 도덕적 개선으로 축소하는 읽기
  rationale: 원문은 회개의 실제적·변혁적 효력을 연속 동사로 강조하므로, 이를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 회개론/성화론
