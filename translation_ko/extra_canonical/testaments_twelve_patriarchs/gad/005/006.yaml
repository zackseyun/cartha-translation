  source_fidelity: 원문의 Ταῦτα(‘이것들을/이 일들을’), ἔσχατον(‘마침내’), μετὰ τὸ μετανοῆσαί με(‘내가 회개한 뒤에’) 및 περὶ Ἰωσήφ(‘요셉에 관하여’)의 의미를 대체로 보존합니다. 다만 현 번역은 ‘이것들을 나는’과 ‘요셉에 관하여 내가’의 어순이 현대 한국어에서 부자연스럽고, ‘마침내’와 ‘뒤에’의 수식 관계가 다소 흐립니다. ‘뒤에야 마침내’로 옮기면 회개 이후에 비로소 알게 되었다는 원문의 시간적 강조를 자연스럽게 드러냅니다.
  naturalness: ‘나는 요셉에 관하여 내가 회개한 뒤에’는 주어가 불필요하게 반복되고 조사 결합도 경직되어 있습니다. ‘나는 요셉에 관하여 회개한 뒤에야’가 표준어 합쇼체 문장으로 더 자연스럽습니다.
  terminology: μετανοῆσαι는 이 문맥에서 도덕적 잘못에 대한 돌이킴을 나타내므로 ‘회개하다’가 적절합니다. περὶ Ἰωσήφ의 범위를 보존하여 ‘요셉에 관하여’로 유지합니다. ἔγνων은 여기서 새롭게 깨닫거나 알게 된 의미이므로 ‘알게 되었습니다’가 무난합니다.
