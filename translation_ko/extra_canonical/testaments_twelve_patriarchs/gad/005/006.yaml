  text: These things I learned at last after I repented concerning Joseph.
translation:
  language: ko
  text: 이것들을 나는 마침내 요셉에 관하여 내가 회개한 뒤에 알게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  english_pob_choice: These things
  chosen_korean: 이것들을
  alternatives_korean:
  - 이 일들을
  - 이 모든 것들을
  lexicon: demonstrative pronoun + accusative plural
  rationale: 지시대명사 Ταῦτα의 복수 목적어를 자연스럽게 살려, 직역보다 읽기 쉬운 목적격 표현으로 옮겼습니다.
- source_word: ἔσχατον
  english_pob_choice: at last
  chosen_korean: 마침내
  alternatives_korean:
  - 끝내
  - 드디어
  lexicon: adverb
  rationale: ἔσχατον을 ‘마침내/드디어’의 시간적 종결로 이해해, 영어 POB의 ‘at last’와 같은 종결감을 살렸습니다.
- source_word: μετανοῆσαί με περὶ Ἰωσήφ
  english_pob_choice: after I repented concerning Joseph
  chosen_korean: 요셉에 관하여 내가 회개한 뒤에
  alternatives_korean:
  - 요셉에 대하여 회개한 뒤에
  - 요셉 문제에 관해 돌이킨 뒤에
  lexicon: μετανοέω + περί + object
  rationale: μετανοῆσαί는 단순한 생각 변경보다 회개/돌이킴의 의미가 강하므로 ‘회개한 뒤에’로 옮기고, περὶ Ἰωσήφ는 ‘요셉에 관하여’로 보존했습니다.
theological_decisions:
- issue: μετανοέω의 도덕적·회개적 뉘앙스
  chosen_reading: 여기서는 단순한 재고가 아니라 죄책과 방향 전환을 포함한 ‘회개’로 옮겼습니다.
  alternative_readings:
  - 생각을 바꾼 뒤에
  - 마음을 돌린 뒤에
  rationale: 영어 POB 개정이 ‘changed my mind’에서 ‘repented’로 수정된 점을 따르되, 원문의 μετανοῆσαί가 지닌 회개적 무게를 약화시키지 않기 위함입니다.
  doctrine_reference: repentance as moral turning (metanoia)
