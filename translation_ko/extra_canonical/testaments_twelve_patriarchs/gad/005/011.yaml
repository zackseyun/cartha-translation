  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 11. Ἐπεὶ Γοὖν⌉ ἔκειτο⁶⁵ τὰ ἥπατα μου ἀνιλεως⁶⁶ κατὰ τοῦ Ἰωσήφ, *τῷ ἥπατι⁶⁷ πάσχων⁶⁸ ἀνιλεως ἐκρινόμην ἐπὶ *χρόνους δέκα⁶⁹, καθ’ *ὃν χρόνον⁷⁰ ἐπείχον⁷¹ τῷ Ἰωσήφ⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/011.yaml
  text: Since, then, my liver was pitilessly set against Joseph, I too, suffering in my liver, was judged pitilessly for ten years.
translation:
  language: ko
  text: 그러므로 내 간이 요셉을 향해 무자비하게 맞서 있었으므로, 나도 간에 고통을 겪으며, 내가 요셉을 향해 계속 맞서 있던 기간인 십 년 동안 무자비하게 심판을 받았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκειτο ... ἀνιλεως κατὰ τοῦ Ἰωσήφ
  english_pob_choice: my liver was pitilessly set against Joseph
  chosen_korean: 내 간이 요셉을 향해 무자비하게 대적하게 되었습니다
  alternatives_korean:
  - 내 간이 요셉에게 무자비하게 놓여 있었습니다
  - 내 간이 요셉을 향해 가차 없이 맞서 있었습니다
  lexicon: ἔκειτο, ἀνιλεως, κατὰ + gen.
  rationale: 간(ἥπατα)을 비유적으로 그대로 살리면서, ‘set against’의 적대 상태를 한국어로 자연스럽고 직접적으로 드러냈습니다.
- source_word: τῷ ἥπατι πάσχων
  english_pob_choice: suffering in my liver
  chosen_korean: 내 간으로 고통을 겪으면서
  alternatives_korean:
  - 간이 아파서
  - 간에서 고통받으면서
  lexicon: ἥπατι, πάσχων
  rationale: 반복되는 ‘간’ 이미지를 유지하되, 신체 부위 안에서 겪는 고통이라는 점을 훼손하지 않도록 직역에 가깝게 옮겼습니다.
- source_word: ἐκρινόμην ἀνιλεως
  english_pob_choice: was judged pitilessly
  chosen_korean: 무자비하게 심판을 받았습니다
  alternatives_korean:
  - 무자비하게 판단받았습니다
  - 가차 없이 정죄를 받았습니다
  lexicon: ἐκρινόμην, ἀνιλεως
  rationale: ἐκρίνεσθαι의 법정적/판정적 의미를 살려 ‘심판을 받다’로 옮기되, ἀνιλεως의 반복을 통해 무자비한 처리라는 점을 보존했습니다.
- source_word: χρόνους δέκα
  english_pob_choice: for ten years
  chosen_korean: 십 년 동안
  alternatives_korean:
  - 열 해 동안
  - 열 년 동안
  lexicon: χρόνοι, δέκα
  rationale: English audit trail의 최종 수정처럼 χρόνους δέκα를 ‘십 년’으로 분명하게 반영했습니다.
theological_decisions:
- issue: 신체 이미지 ‘간’의 유지 여부
  chosen_reading: 본문의 상징적·내장적 비유를 완화하지 않고 ‘간’을 그대로 유지했습니다.
  alternative_readings:
  - ‘마음’이나 ‘속’으로 의역
  rationale: 원문은 감정의 중심을 간에 두는 강한 신체 은유를 사용하므로, 한국어에서도 이를 평준화하지 않는 편이 소스의 힘을 더 정확히 전달합니다.
  doctrine_reference: source-text fidelity / figurative language preservation
