  to: 그러므로 내 간이 요셉을 향해 무자비하게 맞서 있었으므로, 나도 간에 고통을 겪으며, 내가 요셉을 향해 계속 맞서 있던 기간인 십 년 동안 무자비하게 심판을 받았습니다.
