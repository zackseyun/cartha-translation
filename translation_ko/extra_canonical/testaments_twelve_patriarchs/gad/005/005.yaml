review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys fear of offending the Lord and the emphatic denial of wrongdoing even at the level of thought. However, ‘해롭게 하다’ can suggest chiefly causing harm, whereas ἀδικῆσαι more broadly means to act unjustly toward or wrong someone. The Greek emphasis is better retained with ‘부당하게 대하다.’
  naturalness: The sentence is generally natural in modern formal Korean, but the final footnote marker has no corresponding footnote. A slightly recast wording makes the scope of ‘not even in thought’ clearer and reads more smoothly.
  terminology: ‘주님’ is suitable for Κυρίῳ in this moral and devotional context. ‘부당하게 대하다’ more accurately represents ἀδικέω than the narrower ‘해롭게 하다.’
  issues:
  - severity: medium
    issue: The unanchored footnote marker [a] appears in the translation.
    rationale: No footnote text is supplied for this anchor. It should be removed to maintain a valid text/footnote set.
  - severity: low
    issue: ‘사람을 해롭게 할’ narrows ἀδικῆσαι.
    rationale: ἀδικέω denotes wronging or treating someone unjustly and need not be limited to causing harm.
  revised_text: 그는 주님을 거스르게 될까 두려워하므로, 사람을 조금이라도, 생각으로조차 부당하게 대하려 하지 않습니다.
