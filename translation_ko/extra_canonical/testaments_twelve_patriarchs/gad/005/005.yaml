id: T12P.GAD.5.5
reference: Testament of Gad 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Φοβούμενος γὰρ⁴¹ μὴ προσκρούσαι⁴² Κυρίῳ⁴³, οὐ θέλει τὸ καθόλου⁴⁴ οὐδὲ⁴⁵ ἕως ἐννοίας⁴⁶ ἀδικῆσαι ἄνθρωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/005.yaml
  text: For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.
translation:
  language: ko
  text: 그는 주님을 거스르게 될까 두려워하므로, 사람을 조금이라도, 생각으로조차 부당하게 대하려 하지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβούμενος ... μὴ προσκρούσαι Κυρίῳ
  english_pob_choice: fearing lest he offend the Lord
  chosen_korean: 주님을 거스르게 될까 두려워하므로
  alternatives_korean:
  - 주님께 실례가 될까 두려워하므로
  - 주님을 범하게 될까 두려워하므로
  lexicon: φοβέομαι / προσκόπτω / κύριος
  rationale: φοβούμενος와 μὴ προσκρούσαι를 자연스럽게 살려, 단순한 공포가 아니라 주님께 죄를 짓거나 충돌할까 두려워하는 태도로 옮겼습니다. POB의 Lord는 문맥상 주님으로 두었습니다.
- source_word: τὸ καθόλου οὐδὲ ἕως ἐννοίας
  english_pob_choice: at all, not even in thought
  chosen_korean: 전혀 하지 않습니다 — 생각조차 하지 않습니다
  alternatives_korean:
  - 아예 하지 않습니다 — 생각으로도 하지 않습니다
  - 전혀, 생각에 이르기까지도 하지 않습니다
  lexicon: καθόλου / οὐδὲ / ἕως ἐννοίας
  rationale: ‘at all, not even in thought’의 이중 부정을 한국어에서 자연스럽게 강조하기 위해 ‘전혀’와 ‘생각조차’로 분리해 재현했습니다.
- source_word: ἀδικῆσαι ἄνθρωπον
  english_pob_choice: to wrong a man
  chosen_korean: 사람을 해롭게 할
  alternatives_korean:
  - 사람을 부당하게 대할
  - 사람을 잘못되게 할
  lexicon: ἀδικέω / ἄνθρωπος
  rationale: ἀδικῆσαι는 단순한 물리적 해악보다 ‘부당하게 대함/해침’의 폭이 있으나, 한국어에서는 의미를 넓게 살려 ‘해롭게 하다’로 옮겼습니다.
theological_decisions:
- issue: 주님(Kyrios)의 지시 대상
  chosen_reading: 여기서는 인간 주인을 뜻하는 일반적 κύριος가 아니라, 하나님을 가리키는 ‘주님’으로 읽었습니다.
  alternative_readings:
  - 주인
  - 주
  rationale: 문맥이 도덕적·경건적 경고를 말하며, English POB도 Lord로 옮겼으므로 신적 대상의 경외를 드러내는 번역이 적절합니다.
  doctrine_reference: 주권적 하나님 경외
