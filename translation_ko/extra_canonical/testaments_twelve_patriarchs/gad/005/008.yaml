id: T12P.GAD.5.8
reference: Testament of Gad 5:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 8. *Καὶ οὐκ ἔμαθεν ἀπὸ ἀνθρώπων τοῦτο ἀλλ᾽ οἶδε διὰ μετανοίας τοὺς ἐπιστρέφοντας δέχεσθαι⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/008.yaml
  text: And he did not learn this from men, but through repentance he knows how to receive those who turn back.
translation:
  language: ko
  text: 그리고 그는 이것을 사람들에게서 배운 것이 아니라, 회개를 통하여, 돌아오는 이들을 받아들이는 법을 알고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔμαθεν ἀπὸ ἀνθρώπων
  english_pob_choice: did not learn this from men
  chosen_korean: 이것을 사람들에게서 배운 것이 아니지만
  alternatives_korean:
  - 사람들에게서 이것을 배우지 않았지만
  - 이것은 사람들에게서 배운 것이 아니며
  lexicon: μάνθανω / ἀπό
  rationale: 배움의 출처를 부정하는 표현을 자연스러운 합쇼체로 옮기되, ‘사람들’보다 원문의 일반적 인간 출처를 살리는 ‘사람들에게서’로 처리했습니다.
- source_word: διὰ μετανοίας
  english_pob_choice: through repentance
  chosen_korean: 회개를 통해
  alternatives_korean:
  - 회개로
  - 회개의 길로
  lexicon: διά + μετάνοια
  rationale: 원문의 수단/매개 의미를 살려 ‘통해’로 옮겼고, μετάνοια는 여기서 단순 후회가 아니라 방향 전환을 포함하는 ‘회개’로 번역했습니다.
- source_word: τοὺς ἐπιστρέφοντας
  english_pob_choice: those who turn back
  chosen_korean: 돌아오는 이들
  alternatives_korean:
  - 돌아서는 이들
  - 되돌아오는 자들
  lexicon: ἐπιστρέφω
  rationale: ‘돌아오다/되돌아서다’의 회귀·복귀 의미를 반영하되, 한국어에서 자연스럽고 품위 있는 표현인 ‘돌아오는 이들’을 택했습니다.
- source_word: δέχεσθαι
  english_pob_choice: to receive
  chosen_korean: 받아들이는 법을 알고 있습니다
  alternatives_korean:
  - 맞아들이는 법을 알고 있습니다
  - 받아주실 줄 압니다
  lexicon: δέχομαι
  rationale: 단순한 수용이 아니라 회개한 이들을 맞아들이는 태도를 드러내기 위해 ‘받아들이는 법을 알고 있습니다’로 풀어, 이어지는 행위의 능숙함을 살렸습니다.
theological_decisions:
- issue: 회개한 이들을 향한 수용의 방식
  chosen_reading: ‘회개를 통해 돌아오는 이들’을 ‘받아들이는 법을 알고 있습니다’로 옮겨, 단순 정보가 아니라 인격적·목회적 환대의 실천을 강조했습니다.
  alternative_readings:
  - ‘회개로 돌아오는 자들을 받아들입니다’
  - ‘회개하는 자들을 맞아들일 줄 압니다’
  rationale: 원문은 ‘알다’(οἶδε)와 ‘받아들이다’(δέχεσθαι)를 연결해, 경험적으로 체득된 수용 능력을 말합니다. 이를 한국어에서 너무 평면적인 현재 서술로 만들지 않기 위해 ‘법을 알고 있습니다’로 표현했습니다.
  doctrine_reference: 목회적 회복과 회개의 수용
