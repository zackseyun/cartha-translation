revisions:
- from: 의는 미움을 쫓아내고, 겸손은 질투를 없앱니다. 의로운 사람은 겸손하기 때문에 불의를 행하기를 부끄러워합니다. 그는 다른 사람에게 정죄받아서가 아니라 자기 마음에 의해 정죄받습니다. 주님께서 그의 혼을 살피시기 때문입니다.[a][b]
  to: 의는 미움을 쫓아내고, 겸손은 질투를 없앱니다. 의로운 사람은 겸손하여 불의를 행하기를 부끄러워합니다. 이는 다른 사람에게 정죄를 받기 때문이 아니라, 주님께서 그의 영혼을 살피시므로 자기 마음의 정죄를 받기 때문입니다.
  rationale: 원문의 덕목-악한 정서 대구를 유지하고, ταπεινῶς를 인과가 아닌 태도의 수식으로 조정했습니다. 또한 외부의 정죄와 자기 마음의 정죄의 대비, 그리고 주님의 살피심이 그 내적 정죄의 근거가 되는 논리 연결을 한국어 문장 안에서 명확히 했습니다. 내용이 제공되지 않은 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:01Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 원문의 대구와 동사 의미를 충실히 반영합니다. 그러나 δεύτε 문장의 ταπεινῶς는 명시적인 인과라기보다 의로운 사람이 겸손한 태도로 부끄러워한다는 수식으로 옮기는 편이 가깝습니다. 또한 원문의 ‘다른 이에게 정죄받는 것이 아니라 자기 마음에 정죄받음’과 그 근거인 주님의 살피심이 한 문장 안에서 연결되어야 합니다.
  naturalness: ‘자기 마음에 의해 정죄받습니다’는 현대 한국어에서 다소 직역투이며, 앞 문장의 ‘부끄러워합니다’와의 논리 관계도 불분명합니다. ‘자기 마음의 정죄를 받기 때문입니다’로 풀면 자연스럽고 원문의 대비를 보존합니다. ψυχή는 이 문맥에서 현대 독자가 자연스럽게 이해할 수 있는 ‘영혼’이 ‘혼’보다 적절합니다.
  terminology: ‘의’, ‘겸손’, ‘정죄’, ‘주님’은 본문의 윤리적·종교적 어휘와 합쇼체 문체에 적절합니다. ζῆλος는 여기서 ‘질투’로 옮길 수 있습니다.
  issues:
  - severity: medium
    issue: ταπεινῶς를 ‘겸손하기 때문에’로 인과화함
    rationale: 그리스어 καὶ ταπεινῶς는 ‘그리고 겸손하게/겸손한 태도로’라는 방식의 수식이며, 겸손이 부끄러움의 명시적 원인이라는 뜻을 추가하지 않는 편이 안전합니다.
  - severity: medium
    issue: 정죄의 주체와 주님의 살피심 사이의 문장 관계가 불명확함
    rationale: 원문은 다른 사람의 정죄와 자기 마음의 정죄를 대조하고, 주님께서 그의 ψυχή를 살피신다는 사실을 그 이유로 제시합니다. 초안은 이를 독립 문장으로 나누어 원인 관계가 약화되었습니다.
  - severity: low
    issue: ‘혼’의 현대 한국어 자연성
    rationale: ψυχή의 의미 범위를 과도하게 교리화하지 않으면서도 현대 표준어에서 자연스러운 표현은 ‘영혼’입니다.
  - severity: low
    issue: 근거 없는 [a][b] 각주 표지
