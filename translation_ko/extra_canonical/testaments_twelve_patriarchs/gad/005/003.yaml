  revised_text: 의는 미움을 쫓아내고, 겸손은 질투를 없앱니다. 의로운 사람은 겸손하여 불의를 행하기를 부끄러워합니다. 이는 다른 사람에게 정죄를 받기 때문이 아니라, 주님께서 그의 영혼을 살피시므로 자기 마음의 정죄를 받기 때문입니다.
