id: T12P.GAD.5.3
reference: Testament of Gad 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. Ἡ²⁵ δικαιοσύνη²⁶ ἐκβάλλει τὸ μῖσος²⁷, ἡ ταπείνωσις ἀναιρεῖ *τὸ ζῆλος²⁸. ὁ γὰρ δίκαιος καὶ ταπεινῶς αἰδεῖται ποιῆσαι ἄδικον²⁹, ⸀οὐχ ὑπ᾽ ἄλλου³⁰ καταγινωσκόμενος³¹ ἀλλ᾽³² ὑπὸ τῆς ἰδίας καρδίας³³, ὅτι Κύριος ἐπισκοπεῖ³⁴ *τὴν ψυχὴν³⁵ αὐτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/003.yaml
  text: Righteousness casts out hatred, and humility removes jealousy. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul.
translation:
  language: ko
  text: 의는 미움을 쫓아내고, 겸손은 질투를 없앱니다. 의로운 사람은 겸손하기 때문에 불의를 행하기를 부끄러워합니다. 그는 다른 사람에게 정죄받아서가 아니라 자기 마음에 의해 정죄받습니다. 주님께서 그의 혼을 살피시기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  english_pob_choice: Righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: δικαιοσύνη
  rationale: 본절의 윤리적·관계적 덕목으로서의 의미를 살려 POB의 'Righteousness'를 표준적인 '의'로 옮겼습니다.
- source_word: ταπείνωσις
  english_pob_choice: humility
  chosen_korean: 겸손
  alternatives_korean:
  - 낮아짐
  - 비천함
  lexicon: ταπείνωσις
  rationale: 문맥상 자기 낮춤의 태도를 가리키므로 현대 한국어에서 가장 자연스러운 '겸손'을 택했습니다.
- source_word: καταγινωσκόμενος / ὑπὸ τῆς ἰδίας καρδίας
  english_pob_choice: condemned ... by his own heart
  chosen_korean: 자기 마음에 의해 정죄받습니다
  alternatives_korean:
  - 자기 마음에 책망받습니다
  - 자기 양심에 의해 정죄받습니다
  lexicon: καταγινώσκω
  rationale: 핵심은 외부 비난보다 내적 정죄라는 대비이므로 '정죄받다'를 유지하되, '마음'을 통해 내적 법정의 뉘앙스를 살렸습니다.
- source_word: Κύριος ἐπισκοπεῖ
  english_pob_choice: the Lord watches over
  chosen_korean: 주님께서 ... 살피시기 때문입니다
  alternatives_korean:
  - 주님께서 ... 돌보시기 때문입니다
  - 주님께서 ... 감찰하시기 때문입니다
  lexicon: ἐπισκοπέω
  rationale: 감독/감찰의 관찰적 의미를 살리면서도 문맥의 위로 기능을 해치지 않도록 '살피시다'로 옮겼습니다.
theological_decisions:
- issue: δικαιοσύνη와 ταπείνωσις의 윤리적 인과 관계
  chosen_reading: 의는 미움을 쫓아내고, 겸손은 질투를 없앱니다.
  alternative_readings:
  - 의는 미움을 몰아내고, 겸손은 질투를 제거합니다.
  - 의는 미움을 내쫓고, 겸손은 질투를 제거합니다.
  rationale: 그리스어의 동사적 대비를 한국어에서도 대칭적으로 유지해, 덕목이 감정과 죄의 정서를 실제로 제거한다는 논지를 분명히 했습니다.
  doctrine_reference: 윤리적 덕목과 내적 죄성의 대조
- issue: 주님이 혼/영혼을 살피신다는 진술
  chosen_reading: 주님께서 그의 혼을 살피시기 때문입니다.
  alternative_readings:
  - 주님께서 그의 영혼을 살피시기 때문입니다.
  - 주님께서 그의 생명을 살피시기 때문입니다.
  rationale: ψυχή를 이 절에서는 생명 일반보다 인격의 내면을 가리키는 말로 보고, 전통적 '영혼' 대신 보다 중립적인 '혼'을 사용해 원문의 폭을 보존했습니다.
  doctrine_reference: 인간 구성요소 용어의 문맥적 번역
