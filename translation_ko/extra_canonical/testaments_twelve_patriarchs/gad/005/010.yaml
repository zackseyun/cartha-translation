  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 10. Δι’ ὧν γὰρ δ⁶³ ἄνθρωπος παρανομεῖ, δι’ ἐκείνων⁶⁴ κολάζεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/010.yaml
  text: For by the very things through which a man transgresses, through those he is punished.
translation:
  language: ko
  text: 사람이 바로 그 일로 범법하면, 바로 그 일로 벌을 받습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομεῖ
  english_pob_choice: transgresses
  chosen_korean: 범법하면
  alternatives_korean:
  - 죄를 범하면
  - 율법을 어기면
  - 어기면
  lexicon: παρανομέω
  rationale: 영어 POB의 transgresses를 따라 단순한 ‘어기다’보다 규범을 벗어난 불법적 행위를 분명히 드러내는 ‘범법하다’를 택했습니다.
- source_word: δι’ ὧν … δι’ ἐκείνων
  english_pob_choice: by the very things through which … through those
  chosen_korean: 바로 그 일로 … 바로 그 일로
  alternatives_korean:
  - 그로 말미암아 … 그로 말미암아
  - 그것들로 … 그것들로
  - 그 일로 … 그 일로
  lexicon: δι’ ὧν / δι’ ἐκείνων
  rationale: 반복되는 전치사구의 대응 관계를 살려, 범죄의 수단과 형벌의 수단이 동일함을 한국어에서도 반복 구조로 보이게 했습니다.
- source_word: κολάζεται
  english_pob_choice: is punished
  chosen_korean: 벌을 받습니다
  alternatives_korean:
  - 징계를 받습니다
  - 처벌을 받습니다
  - 형벌을 받습니다
  lexicon: κολάζω
  rationale: 본절의 결과를 일반 독자에게 자연스럽고 직접적으로 전달하는 ‘벌을 받다’를 사용하되, 수동의 의미는 유지했습니다.
theological_decisions:
- issue: 행위와 보응의 동일성
  chosen_reading: 죄를 짓는 데 사용한 바로 그 일/수단이 심판의 근거와 매개가 된다는 점을 직설적으로 보이게 했습니다.
  alternative_readings:
  - 더 완곡하게 ‘그와 같이 벌을 받습니다’로 옮김
  - 원인-결과를 약화해 일반적 교훈문으로 처리
  rationale: 문장의 대조는 도덕적 상응을 강조하므로, 동일한 표현 반복을 통해 원문의 응보 논리를 보존했습니다.
  doctrine_reference: 보응 원리 / 행위와 결과의 상응
