source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ταῦτα οὖν¹⁹ ἐκ πείρας²⁰ λέγω ὑμῖν, τέκνα μου, ὅπως ἐξώσητε²¹ τὸ μῖσος *τὸ διαβολικόν²², καὶ κολληθῆτε τῇ ἀγάπῃ τοῦ²³ Θεοῦ²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/002.yaml
  text: Therefore I say these things to you from experience, my children, so that you may drive out devilish hatred and cling to the love of God.
translation:
  language: ko
  text: 그러므로 나는 경험에서 나온 이 일들을 너희, 내 자녀들에게 말합니다. 이는 너희가 마귀적인 미움을 몰아내고 하나님의 사랑에 붙들리게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πείρας
  english_pob_choice: from experience
  chosen_korean: 경험에서 나온
  alternatives_korean:
  - 경험으로부터
  - 경험에서
  lexicon: πείρα
  rationale: 말하는 근거가 단순 정보가 아니라 실제 체험임을 살려, ‘경험에서 나온’으로 자연스럽게 옮겼습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들에게
  alternatives_korean:
  - 내 아이들아
  - 내 자녀들아
  lexicon: τέκνον
  rationale: 직접 호칭을 유지하되, 합쇼체 본문과 어울리도록 ‘자녀들’을 택했습니다.
- source_word: τὸ μῖσος τὸ διαβολικόν
  english_pob_choice: devilish hatred
  chosen_korean: 마귀적인 미움
  alternatives_korean:
  - 악마적인 미움
  - 사탄의 미움
  lexicon: μῖσος / διαβολικός
  rationale: POB의 ‘devilish’가 단순 감정이 아니라 미움의 출처와 성격을 규정하므로, ‘마귀적인’으로 직접 옮겼습니다.
- source_word: κολληθῆτε
  english_pob_choice: cling to
  chosen_korean: 붙들리게 하려는 것입니다
  alternatives_korean:
  - 매달리게 하려는 것입니다
  - 붙어 있으려 하게 하려는 것입니다
  lexicon: κολλάω
  rationale: 단순한 정서적 애착보다 강한 결합의 이미지를 살리기 위해 ‘붙들리게’로 옮겼습니다.
- source_word: τῇ ἀγάπῃ τοῦ Θεοῦ
  english_pob_choice: the love of God
  chosen_korean: 하나님의 사랑
  alternatives_korean:
  - 하나님께 대한 사랑
  - 하나님의 사랑 안에
  lexicon: ἀγάπη / Θεός
  rationale: 소유격은 하나님에게서 오는 사랑으로 자연스럽게 읽히므로, 한국어 관용에 맞는 ‘하나님의 사랑’을 유지했습니다.
theological_decisions:
- issue: τὸ μῖσος τὸ διαβολικόν의 성격 규정
  chosen_reading: ‘마귀적인 미움’으로 번역해 미움 자체를 영적·악한 기원과 연결했습니다.
  alternative_readings:
  - ‘악마의 미움’
  - ‘마귀에게서 난 미움’
  rationale: 본문은 단순히 미움을 비난하는 것이 아니라 그것을 마귀적 성격으로 규정하므로, 그 도덕적·영적 강도를 보존했습니다.
  doctrine_reference: 악의 영적 기원과 성화의 윤리
