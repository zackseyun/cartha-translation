revisions:
- from: 그러므로 나는 경험에서 나온 이 일들을 너희, 내 자녀들에게 말합니다. 이는 너희가 마귀적인 미움을 몰아내고 하나님의 사랑에 붙들리게 하려는 것입니다.
  to: 그러므로 내 자녀들아, 나는 경험으로 이것들을 너희에게 말합니다. 이는 너희가 마귀 같은 미움을 몰아내고 하나님의 사랑에 굳게 붙게 하려는 것입니다.
  rationale: 직접 호칭(τέκνα μου)과 수신자(ὑμῖν)를 각각 드러내고, ἐκ πείρας를 간결하게 ‘경험으로’ 옮겼습니다. 목적절의 두 동사는 ‘몰아내고’와 ‘굳게 붙게’로 병렬하여 ἐξώσητε와 κολληθῆτε의 의미를 보존했습니다. ‘하나님의 사랑’은 원문의 소유격을 불필요하게 한 방향으로 해석하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:58Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 τέκνα μου는 여격 수신자와 별개의 직접 호칭인데, 초안의 ‘너희, 내 자녀들에게’는 이를 어색하게 합쳐 놓았습니다. 또한 κολληθῆτε는 ‘붙들리게’(무언가에 붙잡히다)보다 하나님 사랑에 ‘붙다/결합하다’라는 의미가 더 직접적입니다.
  naturalness: ‘그러므로 나는 경험에서 나온 이 일들을 너희, 내 자녀들에게 말합니다’는 현대 한국어에서 호칭과 수신자 표현이 부자연스럽습니다. ‘그러므로 내 자녀들아, 나는 경험으로 이것들을 너희에게 말합니다’로 하면 직접 호칭, 말하는 근거, 수신자가 자연스럽게 살아납니다.
  terminology: ‘마귀적인 미움’은 διαβολικόν의 성격 규정을 보존하지만 다소 비자연스럽습니다. ‘마귀 같은 미움’은 현대 표준어에서 자연스러우면서도 ‘devilish’의 비유적·성격 규정을 유지합니다. ‘하나님의 사랑’은 τοῦ Θεοῦ의 소유격이 지닌 가능한 폭을 한국어에서도 그대로 유지합니다.
  issues:
  - severity: medium
    issue: τέκνα μου의 직접 호칭이 수신자 여격과 혼합됨
    rationale: τέκνα μου는 ‘내 자녀들아’라는 호격이며, ὑμῖν은 ‘너희에게’입니다. 초안의 ‘너희, 내 자녀들에게’는 문법 관계를 흐리고 한국어 문장도 어색하게 만듭니다.
  - severity: medium
    issue: κολληθῆτε를 ‘붙들리게’로 옮김
    rationale: κολλάω의 여기 수동형은 ‘붙게 되다, 결합되다’라는 뜻입니다. ‘붙들리다’는 외부 주체에게 사로잡히는 뜻이 강하여 원문의 결합 이미지를 부정확하게 바꿉니다.
  - severity: low
    issue: ‘마귀적인’의 현대 한국어 자연성
    rationale: 의미는 가능하지만 다소 번역투입니다. ‘마귀 같은’이 διαβολικόν의 성격 규정을 유지하면서 더 자연스럽습니다.
  revised_text: 그러므로 내 자녀들아, 나는 경험으로 이것들을 너희에게 말합니다. 이는 너희가 마귀 같은 미움을 몰아내고 하나님의 사랑에 굳게 붙게 하려는 것입니다.
  revised_footnotes: []
  revision_rationale: 직접 호칭(τέκνα μου)과 수신자(ὑμῖν)를 각각 드러내고, ἐκ πείρας를 간결하게 ‘경험으로’ 옮겼습니다. 목적절의 두 동사는 ‘몰아내고’와 ‘굳게 붙게’로 병렬하여 ἐξώσητε와 κολληθῆτε의 의미를 보존했습니다. ‘하나님의 사랑’은 원문의 소유격을 불필요하게 한 방향으로 해석하지 않습니다.
