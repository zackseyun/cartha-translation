  text: He does not speak against a holy man, because the fear of God dwells in him.
translation:
  language: ko
  text: 그는 거룩한 사람을 비방하지 않습니다. 하나님을 경외하는 마음이 그 안에 거하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ καταλαλεῖ
  english_pob_choice: He does not speak against
  chosen_korean: 비방하지 않습니다
  alternatives_korean:
  - 헐뜯지 않습니다
  - 말해 대적하지 않습니다
  - 헐뜯어 말하지 않습니다
  lexicon: καταλαλέω
  rationale: 단순한 ‘말하다’보다 타인을 험담하거나 해롭게 말하는 뉘앙스를 살려, 사람을 향한 부정적 언급을 자연스러운 현대어로 옮겼습니다.
- source_word: ἀνδρὸς ὁσίου
  english_pob_choice: a holy man
  chosen_korean: 거룩한 사람
  alternatives_korean:
  - 경건한 사람
  - 성도
  - 거룩한 자
  lexicon: ὅσιος
  rationale: ὅσιος는 ‘거룩한/경건한’의 의미를 가지므로, 문맥상 인격을 가리키는 현대 한국어로 ‘거룩한 사람’을 선택했습니다.
- source_word: ὁ φόβος τοῦ Θεοῦ
  english_pob_choice: the fear of God
  chosen_korean: 하나님의 경외
  alternatives_korean:
  - 하나님을 두려워함
  - 하나님을 경외함
  - 하나님에 대한 두려움
  lexicon: φόβος + Θεός
  rationale: 단순 공포보다 경외의 의미가 문맥상 더 적절하므로, 한국어에서 더 자연스럽고 신학적으로도 정확한 ‘하나님의 경외’를 택했습니다.
- source_word: οἰκεῖ ἐν αὐτῷ
  english_pob_choice: dwells in him
  chosen_korean: 그 안에 거하기 때문입니다
  alternatives_korean:
  - 그 안에 거하기 때문입니다
  - 그 안에 머물기 때문입니다
  - 그 속에 살기 때문입니다
  lexicon: οἰκέω
  rationale: 내주/거주를 뜻하는 동사를 ‘거하다’로 옮겨, 원문의 지속적 내적 상태를 유지했습니다.
theological_decisions:
- issue: ‘the fear of God’의 정서적 범위
  chosen_reading: 하나님을 향한 경외와 순종의 지속적 태도로 이해했습니다.
  alternative_readings:
  - 하나님을 두려워하는 감정
  - 종교적 공포
  rationale: 본문은 내적 거주와 연결되므로 단순 감정이 아니라 삶을 규정하는 경외를 가리킨다고 보았습니다.
  doctrine_reference: 지혜문학 및 경건 전통에서의 ‘여호와/하나님 경외’ 개념
