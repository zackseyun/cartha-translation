source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: V. ⸀Κακὸν οὖν¹ ἐστι² τὸ μῖσος³, ὅτι *ἐνδελεχεῖ συνεχῶς³ *τῷ ψεύδει, λαλῶν⁴ κατὰ τῆς⁵ ἀληθείας, καὶ τὰ μικρὰ μεγάλα ποιεῖ⁶, τὸ *φῶς σκότος⁷ παρέχει⁸, καὶ⁹ τὸ γλυκὺ πικρὸν λέγει¹⁰, ⸀καὶ⸀ συκοφαντίαν¹¹ ἐκδιδάσκει *καὶ ὀργὴν¹² ⸀ἐκταράσσει⸀¹³ καὶ πόλεμον ⸀διεγείρει⸀¹⁴, καὶ ὕβριν¹⁵ καὶ πᾶσαν πλεονεξίαν, κακῶν¹⁶ καὶ¹⁷ ἰοῦ διαβολικοῦ τὴν καρδίαν ἐκπληροῖ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/001.yaml
  text: Hatred, then, is evil, because it continually associates with falsehood, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.
translation:
  language: ko
  text: 그러므로 미움은 악합니다. 왜냐하면 그것은 끊임없이 거짓과 어울리며 진리를 거슬러 말하고, 작은 것을 크게 만들며, 빛을 어둠으로 제시하고, 단 것을 쓰다고 부르기 때문입니다. 또 비방을 가르치고, 진노와 전쟁을 일으키며, 마음을 교만과 온갖 탐욕과 악들과 마귀의 독으로 가득 채웁니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κακὸν ... τὸ μῖσος
  english_pob_choice: Hatred ... is evil
  chosen_korean: 미움은 악합니다
  alternatives_korean:
  - 미워함은 악합니다
  - 증오는 악합니다
  lexicon: κακός, μῖσος
  rationale: 본문은 미움의 본성을 판정하므로 형용사구를 자연스럽게 ‘악합니다’로 옮기되, μῖσος는 한국어에서 정서적 뉘앙스가 과도하게 달라질 수 있는 ‘증오’보다 중립적이면서도 강한 ‘미움’이 원문 대응에 더 가깝습니다.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  english_pob_choice: it continually associates with falsehood
  chosen_korean: 끊임없이 거짓과 어울리며
  alternatives_korean:
  - 계속해서 거짓과 함께하며
  - 끊임없이 거짓에 붙어 있으며
  lexicon: ἐνδελεχῶς, ψεῦδος
  rationale: 영문 POB의 ‘associates with falsehood’를 반영하되, 한국어에서는 관계의 지속성을 ‘어울리며’로 자연스럽게 풀어 원문의 계속적 결합을 드러냈습니다.
- source_word: συκοφαντίαν ἐκδιδάσκει
  english_pob_choice: It teaches slander
  chosen_korean: 비방을 가르치고
  alternatives_korean:
  - 중상모략을 가르치고
  - 모함을 가르치고
  lexicon: συκοφαντία
  rationale: συκοφαντία는 단순한 험담보다 ‘비방/중상’의 공적·해로운 성격이 강하므로, POB의 ‘slander’를 따라 ‘비방’으로 옮겼습니다.
- source_word: ὕβριν καὶ πᾶσαν πλεονεξίαν
  english_pob_choice: insolence and every greed
  chosen_korean: 교만과 온갖 탐욕
  alternatives_korean:
  - 오만과 온갖 탐심
  - 무례와 모든 탐욕
  lexicon: ὕβρις, πλεονεξία
  rationale: ὕβρις는 단순한 태도 이상의 ‘교만/오만한 자기과시’의 의미가 있어 ‘교만’으로, πλεονεξία는 물질적·포괄적 탐욕을 살려 ‘온갖 탐욕’으로 옮겼습니다.
- source_word: ἰοῦ διαβολικοῦ
  english_pob_choice: a devilish poison
  chosen_korean: 마귀의 독
  alternatives_korean:
  - 사탄의 독
  - 악마적인 독
  lexicon: ἰός, διαβολικός
  rationale: 직역상의 ‘독’은 유지하되, διαβολικός의 인격적 원천을 한국어 신앙어법에 과도하게 도식화하지 않기 위해 ‘마귀의 독’으로 간결하게 표현했습니다.
theological_decisions:
- issue: 미움의 도덕적 판정과 악의 기원
  chosen_reading: 미움은 단지 감정 상태가 아니라 거짓, 비방, 분쟁, 탐욕을 낳는 악의 동력으로 제시됩니다.
  alternative_readings:
  - 미움은 단순히 부정적 감정에 불과하다고 읽는 것
  - 미움의 결과 목록을 수사적 과장으로만 보는 것
  rationale: 원문은 미움을 여러 파괴적 행위의 연쇄 원인으로 설명하므로, 도덕적·영적 악성의 진술을 약화하지 않고 그대로 반영해야 합니다.
  doctrine_reference: 성서의 죄론과 혀/마음의 윤리
