  text: 7. Τὸ γὰρ πνεῦμα τοῦ μίσους *διὰ τῆς²⁹ ὀλιγοψυχίας συνεργεῖ τῷ Σατανᾷ ἐν πᾶσιν εἰς θάνατον τῶν ἀνθρώπων, τὸ δὲ πνεῦμα τῆς ἀγάπης *ἐν μακροθυμίᾳ³⁰ συνεργεῖ *τῷ νόμῳ³¹ τοῦ Θεοῦ εἰς σωτηρίαν τῶν³² ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/007.yaml
  text: For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through longsuffering, works together with the law of God for the salvation of men.
translation:
  language: ko
  text: 왜냐하면 미움의 영은 나약함을 통해 모든 일에서 사탄과 함께 일하여 사람들의 죽음에 이르게 하고, 사랑의 영은 오래 참음으로 하나님의 율법과 함께 일하여 사람들의 구원에 이르게 하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τοῦ μίσους
  english_pob_choice: the spirit of hatred
  chosen_korean: 미움의 영
  alternatives_korean:
  - 증오의 영
  - 미워함의 영
  lexicon: πνεῦμα; μῖσος
  rationale: English POB의 ‘hatred’를 따라 관계명사구로 자연스럽게 옮기되, 현대 한국어에서 과도하게 추상적이지 않은 ‘미움’을 택했습니다.
- source_word: ὀλιγοψυχίας
  english_pob_choice: faintheartedness
  chosen_korean: 나약함
  alternatives_korean:
  - 낙심
  - 소심함
  - 마음이 약함
  lexicon: ὀλιγοψυχία
  rationale: 여기서는 단순한 슬픔보다 용기가 꺾인 상태를 가리키므로, 문맥상 기능이 가장 분명한 ‘나약함’을 선택했습니다.
- source_word: τῷ νόμῳ τοῦ Θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 율례
  lexicon: νόμος
  rationale: 본문의 νόμος는 일반적 ‘법’보다 토라/계시 규범의 의미가 분명하므로 프로젝트 기본어인 ‘율법’을 유지했습니다.
theological_decisions:
- issue: 사탄과 하나님의 율법이 각각 상반된 영의 협력 대상으로 병렬 제시됨
  chosen_reading: 미움의 영은 사탄과, 사랑의 영은 하나님의 율법과 함께 일한다는 대조를 그대로 살렸습니다.
  alternative_readings:
  - 사탄에게/율법에 복종한다는 식으로 완화하는 읽기
  - 추상적 원리 간의 협력으로 바꾸는 읽기
  rationale: 본문은 인격적 대조와 도구적 협력을 동시에 강하게 말하므로, 이를 약화하지 않고 직접적으로 번역했습니다.
  doctrine_reference: 문맥상 윤리적 인격 대조 및 율법 이해
