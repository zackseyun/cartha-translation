id: T12P.GAD.4.2
reference: Testament of Gad 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Οὐ γὰρ θέλει ἀκούειν Γλόγων⁵ ἐντολῶν⁶ αὐτοῦ περὶ ἀγάπης *τοῦ πλησίον⁷* *Γκαὶ¹ εἰς Θεὸν ἁμαρτάνει⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/002.yaml
  text: For it does not want to hear the words of his commandments concerning love for his neighbor, and it sins against God.
translation:
  language: ko
  text: 그는 자기 이웃을 사랑하라는 그의 계명의 말씀을 들으려 하지 않기 때문이며, 하나님께 죄를 짓습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ θέλει ἀκούειν
  english_pob_choice: For it does not want to hear
  chosen_korean: 들으려 하지 않기 때문이며
  alternatives_korean:
  - 듣고자 하지 않기 때문이며
  - 들으려 원하지 않기 때문이며
  lexicon: θέλω / ἀκούω
  rationale: 단순한 청취가 아니라 ‘들으려 하지 않다’는 완강한 거부를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: Γλόγων ἐντολῶν αὐτοῦ
  english_pob_choice: the words of his commandments
  chosen_korean: 그의 계명의 말씀
  alternatives_korean:
  - 그의 계명들의 말씀
  - 그의 명령의 말씀
  lexicon: λόγος / ἐντολή
  rationale: 복수의 ‘말씀들’과 ‘계명들’의 결합을 한국어에서 가장 자연스럽게 살려, 명령이 단순 규정이 아니라 전달된 말씀으로 들리도록 했습니다.
- source_word: περὶ ἀγάπης τοῦ πλησίον
  english_pob_choice: concerning love for his neighbor
  chosen_korean: 자기 이웃을 사랑하라는
  alternatives_korean:
  - 이웃 사랑에 관한
  - 이웃을 향한 사랑에 관한
  lexicon: ἀγάπη / πλησίον
  rationale: 영문 개정이 반영한 소유격적 관계를 따라, ‘사랑 for his neighbor’의 뜻을 한국어 명사구보다 명령/주제형으로 더 자연스럽게 풀었습니다.
- source_word: εἰς Θεὸν ἁμαρτάνει
  english_pob_choice: it sins against God
  chosen_korean: 하나님께 죄를 짓습니다
  alternatives_korean:
  - 하나님을 거슬러 죄를 짓습니다
  - 하나님께 범죄합니다
  lexicon: ἁμαρτάνω + εἰς Θεόν
  rationale: εἰς Θεόν의 대상을 한국어 여격으로 자연스럽게 옮기되, ‘against God’의 대항/위반 뉘앙스를 보존했습니다.
theological_decisions:
- issue: ‘자기 이웃’의 지시 대상과 윤리적 초점
  chosen_reading: 문맥상 계명이 지시하는 사랑의 대상은 공동체적 ‘이웃’이며, 이를 ‘자기 이웃’으로 옮겨 관계적 책임을 분명히 했습니다.
  alternative_readings:
  - 이웃
  - 가까운 사람
  rationale: 본문은 추상적 박애가 아니라 특정한 공동체 윤리를 말하므로, 소유격을 살려 행위자의 책임 범위를 드러냈습니다.
  doctrine_reference: 레위기 19:18, 마태복음 22:39
