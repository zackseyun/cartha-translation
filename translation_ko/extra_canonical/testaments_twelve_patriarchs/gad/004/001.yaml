id: T12P.GAD.4.1
reference: Testament of Gad 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: IV. Φυλάξασθε οὖν, τέκνα μου¹, ἀπὸ τοῦ μίσους, ὅτι Γκαὶ² εἰς³ αὐτὸν τὸν Κύριον ἀνομίαν⁴ ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/001.yaml
  text: Therefore guard yourselves, my children, from hatred, because it even commits lawlessness against the Lord himself.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 미움을 조심하십시오. 그것은 주님 자신에게까지 불법을 행하기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  english_pob_choice: guard yourselves
  chosen_korean: 조심하십시오
  alternatives_korean:
  - 지키십시오
  - 경계하십시오
  - 자신을 지키십시오
  lexicon: φυλάσσω
  rationale: 직접적인 명령의 경계를 살리되, 한국어에서 자연스럽고 합쇼체에 맞는 표현으로 ‘조심하십시오’를 택했습니다.
- source_word: ἀπὸ τοῦ μίσους
  english_pob_choice: from hatred
  chosen_korean: 미움을
  alternatives_korean:
  - 증오를
  - 미움에서
  - 증오에서
  lexicon: μῖσος
  rationale: 감정적 적대와 반감을 모두 아우를 수 있는 일반적 표현으로 ‘미움’을 선택했습니다.
- source_word: ἀνομίαν ποιεῖ
  english_pob_choice: commits lawlessness
  chosen_korean: 불법을 행하기
  alternatives_korean:
  - 불법을 저지르기
  - 율법을 어기기
  - 악을 행하기
  lexicon: ἀνομία
  rationale: source의 ‘lawlessness’는 단순한 도덕적 악보다 ‘법/질서에 대한 위반’의 뜻이 강하므로 ‘불법을 행하다’로 옮겼습니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  - 주인
  lexicon: κύριος
  rationale: 문맥상 존칭 대상인 ‘주님’이 자연스럽고, 직접 목적어 앞에서도 한국어 문체가 매끄럽습니다.
theological_decisions:
- issue: 미움이 주님께 대한 불법으로 묘사되는 강한 인격적/신학적 진술
  chosen_reading: 미움은 단순한 내적 감정이 아니라 주님 자신을 향한 불법적 행위로 제시합니다.
  alternative_readings:
  - 미움은 하나님께 죄를 짓는다는 일반적 도덕 진술
  - 미움은 공동체 관계를 해치는 말로만 축소하는 읽기
  rationale: 원문의 εἰς αὐτὸν τὸν Κύριον 구조를 따라, 행위의 대상으로서 주님 자신을 직접 보존해야 했습니다.
  doctrine_reference: 성결 윤리와 하나님/주님에 대한 직접적 책임
- issue: 호칭 ‘τέκνα μου’의 친밀한 권면 톤
  chosen_reading: ‘내 자녀들아’로 가족적 권면의 음성을 유지했습니다.
  alternative_readings:
  - 내 아이들아
  - 내 자식들아
  rationale: 직역의 거칠음을 피하면서도 아버지적 권면의 친밀감을 보존하는 표현입니다.
  doctrine_reference: 가르침의 권면 어조
