- from: 사랑은 죽은 자들도 살리고, 죽음의 판결 아래 있는 자들도 다시 불러내고자 합니다. 그와 같이 미움은 살아 있는 자들을 죽이고자 하며, 조금이라도 죄를 지은 자들이 살기를 원하지 않습니다.[a]
  to: 사랑은 죽은 자들도 살리고, 죽음의 판결 아래 있는 자들도 다시 불러내고자 합니다. 그와 같이 미움은 살아 있는 자들을 죽이고자 하며, 작은 일에서 죄를 지은 자들이 살기를 원하지 않습니다.
  rationale: ἐν ὀλίγῳ를 ‘작은 일에서’로 바로잡아 원문과 영어 POB의 ‘in a little matter’를 반영했습니다. 대응하는 내용이 없는 [a] 표지는 삭제했으며, 그 밖의 표현은 원문의 문장 구조와 의지 표현을 보존하므로 유지했습니다.
