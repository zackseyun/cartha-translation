id: T12P.GAD.4.6
reference: Testament of Gad 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὥσπερ²³ ἡ ἀγάπη Γκαὶ¹ τοὺς νεκροὺς *θέλει ζωοποιῆσαι²⁴ καὶ τοὺς ἐν²⁵ ἀποφάσει θανάτου θέλει²⁶ ἀνακαλέσασθαι, οὕτως καὶ²⁷ τὸ μῖσος τοὺς ζῶντας θέλει ἀποκτεῖναι, καὶ *τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας²⁸ οὐ θέλει ζῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/006.yaml
  text: Just as love wants to make the dead alive and to call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned in a little matter to live.
translation:
  language: ko
  text: 사랑은 죽은 자들도 살리고, 죽음의 판결 아래 있는 자들도 다시 불러내고자 합니다. 그와 같이 미움은 살아 있는 자들을 죽이고자 하며, 조금이라도 죄를 지은 자들이 살기를 원하지 않습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀγάπη
  english_pob_choice: love
  chosen_korean: 사랑
  alternatives_korean:
  - 애정
  - 사랑의 마음
  lexicon: ἀγάπη
  rationale: source의 보편적 도덕 주제를 살리기 위해 표준적 대응인 ‘사랑’을 사용했습니다.
- source_word: θέλει ζωοποιῆσαι
  english_pob_choice: wants to make ... alive
  chosen_korean: 살리고자 합니다
  alternatives_korean:
  - 살게 하고자 합니다
  - 생명 있게 하려고 합니다
  lexicon: ζῳοποιέω
  rationale: θέλει의 의지 표현을 반영해 ‘원합니다’ 계열로 옮기되, 한국어에서는 목적형 ‘-고자 합니다’가 자연스럽고 직접적입니다.
- source_word: ἀνακαλέσασθαι
  english_pob_choice: to call back
  chosen_korean: 다시 불러내고자 합니다
  alternatives_korean:
  - 불러오고자 합니다
  - 되불러내고자 합니다
  lexicon: ἀνακαλέομαι
  rationale: 단순한 ‘부르다’보다 ‘다시 불러내다’가 ‘되돌려 불러냄’의 뉘앙스를 더 잘 보존합니다.
- source_word: ἐν ὀλίγῳ ἁμαρτήσαντας
  english_pob_choice: those who have sinned in a little matter
  chosen_korean: 조금이라도 죄를 지은 자들
  alternatives_korean:
  - 작은 일에서 죄를 지은 자들
  - 사소한 일로 죄를 지은 자들
  lexicon: ἐν ὀλίγῳ
  rationale: POB의 ‘in a little matter’를 너무 도덕적으로 축소하지 않으면서, ‘조금이라도’로 범위를 간명하게 살렸습니다.
theological_decisions:
- issue: 의인화된 사랑과 미움의 대조를 어떻게 한국어로 유지할 것인가
  chosen_reading: 사랑과 미움을 주체로 유지하여, 각각 생명을 살리고 죽이는 상반된 힘으로 번역했습니다.
  alternative_readings:
  - 사랑하는 사람/미워하는 사람으로 풀어 옮김
  - 사랑의 결과/미움의 결과로 재구성
  rationale: 본문은 추상 개념을 주어로 세워 도덕적·영적 대조를 강조하므로, 이를 평이한 행위 묘사로 바꾸지 않았습니다.
  doctrine_reference: 문맥상 교훈적 대조를 유지하는 번역 원칙
- issue: ‘살기를 원하지 않습니다’의 종말론적 강도를 어떻게 전달할 것인가
  chosen_reading: 직접적인 부정 의지로 옮겨, 미움이 생명을 거부하는 태도를 분명히 했습니다.
  alternative_readings:
  - 살기를 바라지 않습니다
  - 살게 두지 않습니다
  rationale: οὐ θέλει ζῆν은 단순한 소망 부정이 아니라 생명에 대한 의지적 거부를 드러내므로, ‘원하지 않습니다’가 가장 가깝습니다.
  doctrine_reference: 의지 동사의 의미 보존
