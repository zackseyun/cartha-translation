id: T12P.GAD.4.5
reference: Testament of Gad 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. *Τῷ γὰρ φθόνῳ συνεργεῖ τὸ μῖσος¹⁹, καὶ²⁰ κατὰ τῶν εὐπραγούντων· *ἐν προκοπῇ²¹ ἀκούων καὶ²² ὁρῶν πάντοτε ἀσθενεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/005.yaml
  text: For hatred works together with envy, even against those who prosper; hearing and seeing them in their progress, it is always weakened.
translation:
  language: ko
  text: 이는 미움이 질투와 함께 작용하여, 잘되는 사람들을 대적하기 때문입니다. 미움은 그들이 잘되어 가는 것을 듣고 볼 때마다 언제나 약해집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ γὰρ φθόνῳ ... τὸ μῖσος
  english_pob_choice: For envy, hatred works together
  chosen_korean: 질투로 인해 미움이 함께 역사하며
  alternatives_korean:
  - 질투와 함께 미움이 작용하며
  - 질투 때문에 미움이 협력하며
  lexicon: φθόνος, μῖσος
  rationale: 원문의 원인-관계와 두 항목의 구별을 살리기 위해 '질투로 인해'와 '미움'을 분리해 옮겼습니다. '함께 역사하다'는 συνεργεῖ의 상호작용을 자연스럽게 반영합니다.
- source_word: τῶν εὐπραγούντων
  english_pob_choice: those who prosper
  chosen_korean: 번성하는 자들
  alternatives_korean:
  - 잘되는 사람들
  - 형통하는 자들
  lexicon: εὐπραγέω
  rationale: 단순한 성공보다 상태의 번성과 형통을 가리키므로, 현대 한국어에서 비교적 직접적인 '번성하는 자들'로 옮겼습니다.
- source_word: ἐν προκοπῇ ... πάντοτε ἀσθενεῖ
  english_pob_choice: hearing and seeing progress always weakens it
  chosen_korean: 그들의 진보를 듣고 보고 있으면 언제나 그것은 약해집니다
  alternatives_korean:
  - 그들이 나아가는 것을 듣고 보고 있으면 늘 약해집니다
  - 진보를 듣고 보게 되면 늘 약해집니다
  lexicon: προκοπή, ἀσθενέω
  rationale: ἐν προκοπῇ를 '진보'로 직접 옮겨 원문의 핵심 이미지를 살렸고, ἀσθενεῖ는 미움이 약해지는 능동적 결과를 분명히 하기 위해 '약해집니다'로 처리했습니다.
theological_decisions:
- issue: 원문이 덕목/악덕의 내적 작용을 병렬적으로 진술하는 방식
  chosen_reading: 도덕적·심리적 관계를 설명하는 문장으로 읽고, 설교적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 악의 본성에 대한 일반 교훈으로 확장하는 읽기
  - 공동체 분열에 대한 직접적 경고로 확장하는 읽기
  rationale: 이 절은 질투와 미움의 상호작용, 그리고 타인의 번성이 미움을 약화시킨다는 관찰을 말하므로, 원문의 범위를 넘지 않도록 간결하게 유지했습니다.
  doctrine_reference: 잠 14:30; 약 3:16
- issue: 마지막 분사의 주어와 대상 관계
  chosen_reading: '''그것''을 미움으로 받아, 번성의 소식과 목격이 미움을 약화시키는 것으로 표현했습니다.'
  alternative_readings:
  - 질투가 약해진다고 읽는 해석
  - 주어를 모호하게 두는 번역
  rationale: 앞 절의 주제는 '미움'이며, 영어 POB 수정본도 마지막 의미를 미움의 약화로 정리하므로, 주어를 선명하게 해 독자가 의미를 바로 파악하도록 했습니다.
  doctrine_reference: 문맥상 수사적 관찰
