revisions:
- from: 그러므로 질투로 인해 미움이 함께 역사하며, 또 번성하는 자들을 대적합니다. 그들의 진보를 듣고 보고 있으면 언제나 그것은 약해집니다.
  to: 이는 미움이 질투와 함께 작용하여, 잘되는 사람들을 대적하기 때문입니다. 미움은 그들이 잘되어 가는 것을 듣고 볼 때마다 언제나 약해집니다.
  rationale: 원문의 γὰρ, φθόνῳ συνεργεῖ, κατὰ τῶν εὐπραγούντων, ἐν προκοπῇ ἀκούων καὶ ὁρῶν, πάντοτε ἀσθενεῖ의 관계를 유지하되, 한국어에서 마지막 동사의 주어가 अस्पष्ट하지 않도록 ‘미움’을 반복했습니다. 해석적·교리적 확대는 하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:59Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역의 ‘질투로 인해’는 여격 Τῷ ... φθόνῳ를 원인으로 한정하여 συνεργεῖ의 ‘함께 작용하다/협력하다’라는 관계를 약화합니다. 또한 γὰρ는 ‘그러므로’보다 ‘이는/왜냐하면’에 가깝습니다. 마지막 절은 미움이 그들이 잘되어 가는 것을 듣고 볼 때 약해진다는 뜻을 더 분명히 드러내야 합니다.
  naturalness: ‘함께 역사하다’는 이 문맥에서 다소 종교적이고 부자연스럽습니다. ‘함께 작용하다’와 ‘그들이 잘되어 가는 것을 듣고 볼 때마다’가 현대 표준 한국어의 합쇼체 문맥에 자연스럽습니다.
  terminology: φθόνος와 μῖσος는 각각 ‘질투’와 ‘미움’으로 구별합니다. εὐπραγούντων과 προκοπή의 성공·번영 의미는 ‘잘되는 사람들’, ‘잘되어 가는 것’으로 자연스럽게 반영합니다. 원문에 본문상 각주 표시는 있으나 제공된 자료에 각주 내용이 없으므로 임의의 각주를 추가하지 않습니다.
  issues:
  - severity: medium
    issue: ‘질투로 인해’가 συνεργεῖ의 동반 관계를 인과 관계로 바꿉니다.
    rationale: Τῷ ... φθόνῳ는 ‘질투와 함께’로 옮겨 미움과 질투의 협력을 나타내는 것이 더 직접적입니다.
  - severity: low
    issue: ‘그러므로’는 γὰρ의 접속 기능에 맞지 않습니다.
    rationale: γὰρ는 앞 진술의 이유 또는 설명을 도입하므로 ‘이는’이 적절합니다.
  - severity: medium
    issue: 마지막 문장의 ‘그것’은 선행사가 불분명합니다.
    rationale: ἀσθενεῖ의 주어를 ‘미움’으로 밝혀, 듣고 보는 행위가 미움을 약화한다는 문장 관계를 명료하게 합니다.
  revised_text: 이는 미움이 질투와 함께 작용하여, 잘되는 사람들을 대적하기 때문입니다. 미움은 그들이 잘되어 가는 것을 듣고 볼 때마다 언제나 약해집니다.
