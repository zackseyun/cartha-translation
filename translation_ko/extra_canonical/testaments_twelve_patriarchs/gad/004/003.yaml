revisions:
- from: 만일 형제가 넘어지면, 그것을 곧바로 모두에게 알리기를 서두르고, 그에 관하여 서둘러서 — 그가 심판을 받고 벌을 받아 죽게 하려는 것입니다.[a]
  to: 형제가 넘어지면, 미움은 즉시 그 일을 모든 사람에게 알리려 애쓰고, 그가 심판을 받고 벌을 받아 죽게 하려고 그를 두고 일을 서두릅니다.
  rationale: The revision explicitly identifies “미움” as the contextual referent of the source’s implicit subject, while preserving the ambiguity of “넘어지다.” It renders both urgency verbs, preserves “그 일을” as the object reported and “그를” as the person concerned, and expresses the ἵνα purpose clause directly. The unsubstantiated footnote marker is removed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the repeated urgency (σπουδάζει / σπεύδει), the comprehensive audience (τοῖς πᾶσιν), and the purpose clause with the passive sequence “having been judged and punished.” However, the sentence’s implicit subject is left as “그것,” which has no usable antecedent in the Korean excerpt and is readily mistaken for the fallen brother’s action or for the reported matter. In the immediate literary context, the subject is hatred; making this explicit supplies the source’s intended referent without narrowing πέσῃ. The final dash and explanatory ending also obscure that the final clause is the direct purpose of the hatred’s activity.
  naturalness: “그에 관하여 서둘러서” is unnatural and leaves the action governed by περὶ αὐτοῦ unclear. “그를 두고 일을 서두릅니다” is natural formal Korean while retaining the focus on the person. Removing the dash produces one coherent sentence in modern formal-polite register.
  terminology: “형제가 넘어지면” appropriately preserves the unspecific metaphor of πέσῃ. “심판을 받고 벌을 받아 죽게 하려고” accurately represents κριθεὶς καὶ κολασθεὶς ἀποθάνῃ without importing a particular judicial or doctrinal framework. “미움” is the contextually established antecedent of the Greek’s implicit subject, rather than an added theological interpretation.
  issues:
  - severity: medium
    issue: The Korean pronoun “그것” lacks an identifiable antecedent in this standalone verse and is ambiguous.
    rationale: The Greek verbal subject is implicit but contextually refers to hatred. Korean requires either an accessible antecedent or an explicit noun; otherwise readers may misassign the actions.
  - severity: medium
    issue: The rendering “그에 관하여 서둘러서 —” is syntactically and idiomatically awkward.
    rationale: It does not naturally express σπεύδει περὶ αὐτοῦ and the dash makes the purpose clause appear parenthetical rather than dependent on the preceding activity.
  - severity: low
    issue: Footnote marker [a] is unsupported by any supplied footnote content.
    rationale: No textual or translation note is provided that requires an anchor; it should be removed rather than retained as an empty marker.
  revised_text: 형제가 넘어지면, 미움은 즉시 그 일을 모든 사람에게 알리려 애쓰고, 그가 심판을 받고 벌을 받아 죽게 하려고 그를 두고 일을 서두릅니다.
  revised_footnotes: []
  revision_rationale: The revision explicitly identifies “미움” as the contextual referent of the source’s implicit subject, while preserving the ambiguity of “넘어지다.” It renders both urgency verbs, preserves “그 일을” as the object reported and “그를” as the person concerned, and expresses the ἵνα purpose clause directly. The unsubstantiated footnote marker is removed.
