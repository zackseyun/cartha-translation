id: T12P.GAD.4.3
reference: Testament of Gad 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. ΓἘὰν γὰρ πέσῃ ὁ ἀδελφός⁹, *σπουδάζει εὐθὺς¹⁰ ἀναγγεῖλαι τοῖς¹¹ πᾶσιν, καὶ σπεύδει *περὶ αὐτοῦ ἵνα κριθεὶς¹² καὶ κολασθεὶς ἀποθάνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/003.yaml
  text: For if a brother falls, it is eager at once to report it to everyone, and it hastens concerning him so that, having been judged and punished, he may die.
translation:
  language: ko
  text: 만일 형제가 넘어지면, 그것을 곧바로 모두에게 알리기를 서두르고, 그에 관하여 서둘러서 — 그가 심판을 받고 벌을 받아 죽게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέσῃ ὁ ἀδελφός
  english_pob_choice: if a brother falls
  chosen_korean: 형제가 넘어지면
  alternatives_korean:
  - 형제가 실수하면
  - 형제가 죄를 지으면
  - 형제가 넘어지면
  lexicon: πίπτω
  rationale: 여기서는 도덕적 추락을 직접 드러내지 않고, 원문과 POB의 완곡한 표현을 따라 ‘넘어지다’로 옮기는 것이 가장 근접합니다.
- source_word: σπουδάζει εὐθὺς ἀναγγεῖλαι τοῖς πᾶσιν
  english_pob_choice: it is eager at once to report it to everyone
  chosen_korean: 그것을 곧바로 모두에게 알리기를 서두르고
  alternatives_korean:
  - 그것을 즉시 모두에게 보고하려고 애쓰고
  - 그것을 곧 모두에게 전하고자 서두르고
  lexicon: σπουδάζω / ἀναγγέλλω
  rationale: σπουδάζει의 ‘열심히/서두르다’와 ἀναγγεῖλαι의 ‘알리다, 보고하다’를 함께 살리되, 한국어에서 자연스러운 동작 흐름으로 정리했습니다.
- source_word: περὶ αὐτοῦ
  english_pob_choice: concerning him
  chosen_korean: 그에 관하여
  alternatives_korean:
  - 그에 대해서
  - 그를 두고
  lexicon: περί
  rationale: 보조 전치사 περὶ αὐτοῦ의 대상을 분명히 드러내기 위해, revision pass의 ‘concerning him’을 반영해 ‘그에 관하여’로 옮겼습니다.
- source_word: κριθεὶς καὶ κολασθεὶς ἀποθάνῃ
  english_pob_choice: having been judged and punished, he may die
  chosen_korean: 그가 심판을 받고 벌을 받아 죽게 하려는 것입니다
  alternatives_korean:
  - 심판을 받고 벌을 받아 죽게 하려는 것입니다
  - 심판받고 징벌받아 죽게 하려는 것입니다
  lexicon: κρίνω / κολάζω / ἀποθνῄσκω
  rationale: κριθεὶς와 κολασθεὶς를 각각 ‘심판을 받고’, ‘벌을 받아’로 나눠 POB의 두 동작을 유지했고, ἵνα절은 목적을 드러내는 한국어로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 형제가 ‘넘어지다’의 해석 범위
  chosen_reading: 도덕적/공동체적 실패를 암시하되, 본문 자체가 특정 죄목을 명시하지 않으므로 ‘죄를 지으면’처럼 좁히지 않았습니다.
  alternative_readings:
  - 형제가 죄를 지으면
  - 형제가 실족하면
  rationale: 원문은 단순히 πέσῃ를 쓰며, POB도 ‘falls’로 유지하므로, 해석을 과도하게 특정하지 않고 원문의 폭을 보존했습니다.
  doctrine_reference: 본문 문맥의 서술 보존
