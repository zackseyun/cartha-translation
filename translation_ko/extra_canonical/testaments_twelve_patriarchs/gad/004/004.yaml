id: T12P.GAD.4.4
reference: Testament of Gad 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ *δοῦλός τις ᾖ¹³, συμβαλεῖ¹⁴ αὐτὸν πρὸς τὸν κύριον αὐτοῦ, καὶ ἐν πάσῃ θλίψει¹⁵ *ἐπιχαίρει αὐτῷ¹⁶, εἴπως¹⁷ θανατωθῇ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/004.yaml
  text: And if someone is a slave, it slanders him to his master, and in every distress it rejoices over him, if perhaps he may be put to death.
translation:
  language: ko
  text: 만일 어떤 사람이 종이면, 그것은 그를 그의 주인에게 모함하고, 온갖 환난 가운데서 그를 두고 기뻐하며, 그가 죽임을 당하기라도 하기를 바랍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλός τις
  english_pob_choice: someone is a slave
  chosen_korean: 어떤 사람이 종이라면
  alternatives_korean:
  - 누군가가 노예라면
  - 어떤 사람이 노예라면
  lexicon: δοῦλος → 종
  rationale: 본문의 δοῦλος는 예속 상태를 가리키므로 기본어는 종으로 두되, 문맥상 조건절을 자연스럽게 살려 ‘어떤 사람이 종이라면’으로 옮겼습니다.
- source_word: συμβαλεῖ
  english_pob_choice: it slanders him to his master
  chosen_korean: 그것을 자기 주인에게 고발하며
  alternatives_korean:
  - 그를 자기 주인에게 험담하며
  - 그를 자기 주인에게 모함하며
  lexicon: συμβάλλω
  rationale: 영문 POB의 ‘slanders’는 본문 의미를 반영한 해석적 선택으로 보이며, 한국어에서는 주인에게 불리한 말을 전한다는 뜻을 살려 ‘고발하며’로 처리했습니다.
- source_word: ἐν πάσῃ θλίψει
  english_pob_choice: in every distress
  chosen_korean: 모든 환난 속에서
  alternatives_korean:
  - 모든 고난 속에서
  - 온갖 환난 가운데서
  lexicon: θλῖψις → 환난
  rationale: θλῖψις의 대표적 고난·압박 의미를 따라 ‘환난’을 택했고, 전치사구는 한국어 관용에 맞게 ‘속에서’로 풀었습니다.
- source_word: ἐπιχαίρει αὐτῷ
  english_pob_choice: it rejoices over him
  chosen_korean: 그를 기뻐하고
  alternatives_korean:
  - 그를 두고 기뻐하고
  - 그 위에서 즐거워하고
  lexicon: ἐπιχαίρω
  rationale: 동사의 대상이 되는 인칭대명사를 자연스럽게 살리되, 악한 행위 주체의 냉혹한 반응을 드러내기 위해 ‘그를 기뻐하고’로 옮겼습니다.
- source_word: θανατωθῇ
  english_pob_choice: may be put to death
  chosen_korean: 죽임을 당할까 합니다
  alternatives_korean:
  - 죽임을 당할지도 모릅니다
  - 사형을 당할까 합니다
  lexicon: θανατόω
  rationale: 수동 완료성보다 결과 가능성을 나타내는 종속절의 뉘앙스를 살려 ‘죽임을 당할까 합니다’로 번역했습니다.
theological_decisions:
- issue: 본문의 악한 태도와 폭력적 결말의 진술 방식
  chosen_reading: 직설적으로 ‘고발하며… 기뻐하고… 죽임을 당할까 합니다’로 옮겨, 본문의 비윤리적 행위를 완화하지 않았습니다.
  alternative_readings:
  - 더 완곡하게 ‘험담하며… 즐거워하고… 죽임을 당할지 모릅니다’
  - 도덕적 해설을 덧붙여 의미를 누그러뜨리는 번역
  rationale: 본문은 악한 자의 행위를 노골적으로 묘사하므로, 번역에서도 그 긴장을 보존해야 합니다.
  doctrine_reference: 악에 대한 성서적 묘사의 보존
