source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 5. Οὕτως¹⁴ ὁ Θεὸς τῶν πατέρων ἡμῶν ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν, ἵνα μὴ ποιήσωμεν ἐν τῷ Ἰσραὴλ ἀνομίαν μεγάλην. [β, Α, S¹] 4. Καὶ οὕτως τῇ πλεονεξίᾳ ἐπληροφορήθημεν¹⁹ τῆς ἀναιρέσεως αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/004.yaml
  text: 'Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    And so, through greed, we were fully persuaded of his murder.'
translation:
  language: ko
  text: '이처럼 우리 조상들의 하나님께서 우리의 손에서 그를 구해 내셨습니다. 우리가 이스라엘 가운데에서 큰 불법을 저지르지 않도록 하신 것입니다.


    그리고 우리는 탐욕으로 말미암아 그의 살해에 대해 완전히 확신하게 되었습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων ἡμῶν
  english_pob_choice: the God of our fathers
  chosen_korean: 우리 조상들의 하나님
  alternatives_korean:
  - 우리 조상들의 하느님
  - 조상들의 하나님
  lexicon: Θεός
  rationale: 소유격 구조를 그대로 살려 집단의 언약적 기억을 드러내면서, POB 기본어인 하나님을 사용했습니다.
- source_word: ἐρρύσατο
  english_pob_choice: rescued
  chosen_korean: 구해 내셨습니다
  alternatives_korean:
  - 건져 내셨습니다
  - 구원하셨습니다
  lexicon: ῥύομαι
  rationale: 물리적 손에서 빼내는 구출의 뉘앙스를 살리기 위해 구해 내다를 택했습니다.
- source_word: ἀνομίαν μεγάλην
  english_pob_choice: a great lawless deed
  chosen_korean: 큰 불법
  alternatives_korean:
  - 큰 무법 행위
  - 큰 악행
  lexicon: ἀνομία
  rationale: ἀνομία의 핵심인 율법/질서에 대한 위반을 반영하여, 해석을 덜어낸 직역형 표현인 불법을 유지했습니다.
- source_word: ἐπληροφορήθημεν
  english_pob_choice: we were fully persuaded
  chosen_korean: 우리는 … 확신하게 되었습니다
  alternatives_korean:
  - 우리는 … 완전히 설득되었습니다
  - 우리는 … 확실히 믿게 되었습니다
  lexicon: πληροφορέω
  rationale: 단순한 의지 결정보다 내적 확신에 가깝게, 그리고 능동적 뉘앙스를 피하면서 수동형 의미를 한국어로 자연스럽게 옮겼습니다.
- source_word: τῆς ἀναιρέσεως αὐτοῦ
  english_pob_choice: his murder
  chosen_korean: 그의 살해
  alternatives_korean:
  - 그를 죽인 일
  - 그의 죽임
  lexicon: ἀναίρεσις
  rationale: 행위의 폭력성과 법적 책임을 드러내기 위해 중립적이면서도 강한 살해를 선택했습니다.
theological_decisions:
- issue: ἀνομία를 어떻게 옮길지
  chosen_reading: 큰 불법
  alternative_readings:
  - 큰 악행
  - 큰 무법 행위
  rationale: 본문은 단순한 도덕적 악보다 공동체 안에서 율법을 거스르는 범죄성을 강조하므로, 불법이 가장 직접적으로 긴장을 보존합니다.
  doctrine_reference: 율법과 불법의 대비
- issue: ἐπληροφορήθημεν의 수동/상태 뉘앙스
  chosen_reading: 확신하게 되었습니다
  alternative_readings:
  - 확실히 알게 되었습니다
  - 완전히 설득되었습니다
  rationale: 탐욕이 그들의 판단을 장악해 살해에 마음이 기울어졌다는 맥락을 살리되, 원문의 수동적 완료 상태를 한국어 서술로 자연스럽게 표현했습니다.
  doctrine_reference: 인간의 내적 동기와 책임
