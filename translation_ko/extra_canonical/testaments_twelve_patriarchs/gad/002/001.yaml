  source_fidelity: 원문의 ὅτι는 고백의 내용을 이끄므로, ‘여러 번 그를 죽이고 싶어 했다는 것을’으로 종속시켜 드러내는 편이 더 충실합니다. ἐκ ψυχῆς는 ‘온 마음으로’로 옮겨 강한 전인적 증오의 뜻을 자연스럽게 보존했습니다.
  naturalness: 초안도 이해 가능하지만, ‘고백합니다’ 뒤에 내용을 연결하면 현대 한국어 문장 흐름이 더 자연스럽고 원문의 논리 관계도 분명해집니다. ‘왜냐하면’보다 ‘이는’이 이 고백체의 격식 있는 문맥에 알맞습니다.
  terminology: ‘죄를 고백합니다’, ‘자녀들아’, ‘죽이고 싶어 했습니다’, ‘미워했습니다’는 원문의 의미와 현대 합쇼체 문체에 적절합니다.
  issues:
