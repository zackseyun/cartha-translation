id: T12P.GAD.2.1
reference: Testament of Gad 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: II. Ὁμολογῶ τοίνυν¹ τὴν ἁμαρτίαν μου, τέκνα², ὅτι πλειστάκις ἤθελον³ ἀνελεῖν αὐτόν, *ἐπειδὴ ἐμίσουν αὐτὸν ἐκ ψυχῆς⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/001.yaml
  text: Therefore I confess my sin, children, that many times I wanted to kill him, because I hated him from my soul.
translation:
  language: ko
  text: 그러므로 자녀들아, 나는 내가 여러 번 그를 죽이고 싶어 했다는 내 죄를 고백합니다. 이는 내가 온 마음으로 그를 미워했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ τοίνυν τὴν ἁμαρτίαν μου
  english_pob_choice: Therefore I confess my sin
  chosen_korean: 그러므로 나는 내 죄를 고백합니다
  alternatives_korean:
  - 그러므로 나는 내 죄를 인정합니다
  - 그렇다면 나는 내 죄를 고백합니다
  lexicon: ὁμολογέω; ἁμαρτία
  rationale: ὁμολογῶ는 단순한 인정보다 공개적 고백의 뉘앙스가 있어 ‘고백합니다’로 살렸고, τὴν ἁμαρτίαν μου는 ‘내 죄’로 자연스럽고 직접적으로 옮겼습니다.
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 아이들아
  - 자녀들
  lexicon: τέκνα
  rationale: 호칭으로 쓰인 τέκνα는 직역하면 ‘자녀들’이 자연스러워 호격형 ‘자녀들아’를 택했습니다.
- source_word: πλειστάκις ἤθελον ἀνελεῖν αὐτόν
  english_pob_choice: many times I wanted to kill him
  chosen_korean: 나는 여러 번 그를 죽이고 싶었습니다
  alternatives_korean:
  - 나는 자주 그를 죽이려 했습니다
  - 나는 여러 번 그를 죽이려 마음먹었습니다
  lexicon: πλειστάκις; ἀναιρέω; θέλω
  rationale: πλειστάκις는 ‘여러 번’으로, ἀνελεῖν은 실제 살해 의도를 나타내므로 약화하지 않고 ‘죽이고 싶었습니다’로 옮겼습니다.
- source_word: ἐπειδὴ ἐμίσουν αὐτὸν ἐκ ψυχῆς
  english_pob_choice: because I hated him from my soul
  chosen_korean: 왜냐하면 나는 마음속 깊이 그를 미워했기 때문입니다
  alternatives_korean:
  - 왜냐하면 나는 영혼에서 그를 미워했기 때문입니다
  - 왜냐하면 나는 속마음으로 그를 미워했기 때문입니다
  lexicon: ἐπειδή; μισέω; ἐκ ψυχῆς
  rationale: ἐκ ψυχῆς는 문자적으로 ‘영혼으로부터’이지만 한국어에서는 의미가 드러나도록 ‘마음속 깊이’로 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 회개의 고백문에서 폭력 의도의 표현을 어떻게 드러낼지
  chosen_reading: 원문의 자기비판적 고백 구조를 유지하며 살해 의도와 증오를 완화 없이 그대로 옮겼습니다.
  alternative_readings:
  - ‘죽이려 했습니다’처럼 의도만 약화해 표현
  - ‘해치고 싶었습니다’로 일반화해 표현
  rationale: 문맥상 화자의 도덕적 타락을 드러내는 핵심이므로, 독자가 죄의 강도를 오해하지 않도록 직접적 표현을 유지했습니다.
  doctrine_reference: 회개와 죄의 자백의 진정성
