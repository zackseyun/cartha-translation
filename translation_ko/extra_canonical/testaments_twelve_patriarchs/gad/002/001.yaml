    rationale: 초안의 두 번째 문장은 의미상 통하지만, ‘나는 내 죄를 고백합니다’의 내용이 무엇인지 나타내는 ὅτι의 종속 관계가 희미해집니다.
  - severity: low
    issue: ἐκ ψυχῆς의 강한 표현이 다소 완화됨
    rationale: ‘마음속 깊이’도 가능하나, ‘온 마음으로’가 ‘영혼으로부터/전심으로’라는 원문의 강도를 더 직접적으로 보존합니다.
  revised_text: 그러므로 자녀들아, 나는 내가 여러 번 그를 죽이고 싶어 했다는 내 죄를 고백합니다. 이는 내가 온 마음으로 그를 미워했기 때문입니다.
