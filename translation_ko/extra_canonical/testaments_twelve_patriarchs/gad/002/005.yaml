  to: 내 조상들의 하나님께서 내가 이스라엘에서 불법을 저지르지 않도록 그를 내 손에서 건져 내셨습니다.
  rationale: 원문에 없는 대조를 제거하고, 하나님의 구출과 화자의 불법 방지 사이의 목적 관계를 ἵνα μὴ에 맞게 직접 표현했습니다. 대응 각주가 없는 표지도 삭제했습니다.
  reviewer_model: gpt-5.6-terra
