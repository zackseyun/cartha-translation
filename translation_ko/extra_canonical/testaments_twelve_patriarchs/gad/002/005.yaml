  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[β, Α, S¹] 5. Καὶ ὁ Θεὸς τῶν πατέρων μου²⁰ ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου, ἵνα μὴ²¹ ποιήσω ἀνόμημα²² ἐν Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/005.yaml
  text: But the God of my fathers rescued him from my hands, so that I might not commit a lawless deed in Israel.
translation:
  language: ko
  text: 그러나 내 조상들의 하나님께서 그를 내 손에서 건져내셨으니, 내가 이스라엘에서 불법한 일을 저지르지 않게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  english_pob_choice: the God of my fathers
  chosen_korean: 내 조상들의 하나님
  alternatives_korean:
  - 내 아버지들의 하나님
  - 조상들의 하나님
  lexicon: Θεός
  rationale: 소유격 1인칭과 복수 ‘πατέρων’을 자연스럽게 살려, 족장적·언약적 표현인 ‘my fathers’를 현대 한국어로 과도하게 풀지 않고 옮겼습니다.
- source_word: ἐρρύσατο
  english_pob_choice: rescued
  chosen_korean: 건져내셨으니
  alternatives_korean:
  - 구원하셨으니
  - 구해내셨으니
  lexicon: ῥύομαι
  rationale: 단순한 도움보다 위기에서 건져내는 구출의 뉘앙스를 살려, 서술과 결과절을 연결하는 문맥에 맞게 처리했습니다.
- source_word: ἀνόμημα
  english_pob_choice: a lawless deed
  chosen_korean: 불법한 일
  alternatives_korean:
  - 무법한 행위
  - 율법 없는 행위
  lexicon: ἀνόμημα
  rationale: 영 POB의 ‘lawless deed’를 직역에 가깝게 반영하되, 한국어에서 자연스러운 윤리·법적 위반 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘ἐν Ἰσραήλ’의 범위와 윤리적 무게
  chosen_reading: ‘이스라엘에서’는 행위의 장소이자 공동체적 범위를 가리키는 말로 이해했습니다.
  alternative_readings:
  - ‘이스라엘 가운데서’
  - ‘이스라엘에 대하여’
  rationale: 문맥상 단순 지리보다 언약 공동체 내부에서의 죄를 피하려는 의도가 핵심이므로, 한국어도 그 공동체적 함의를 유지했습니다.
  doctrine_reference: 공동체 윤리와 언약 백성 안에서의 죄의 책임
- issue: ἵνα μὴ의 목적절
  chosen_reading: ‘~하지 않게 하려는 것이었습니다’로 목적을 명시했습니다.
  alternative_readings:
  - ‘~하지 않도록’
  - ‘~하지 않게’
  rationale: 원문의 목적절 구조를 분명히 드러내어, 하나님이 그를 구하신 이유가 죄의 방지였음을 보존했습니다.
  doctrine_reference: 하나님의 구원과 도덕적 제지의 목적
