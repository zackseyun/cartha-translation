id: T12P.GAD.2.2
reference: Testament of Gad 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καίγε διὰ τὰ ἐνύπνια⁵ *προσεθέμην αὐτῷ τὸ μῖσος⁶, καὶ ἤθελον αὐτὸν⁷ ἐκλεῖξαι⁸ *ἐκ γῆς⁹ ⌈ζώντων⌉¹⁰, ὃν τρόπον¹¹ ἐκλείχει¹² ὁ μόσχος τὰ χλωρὰ *τοῦ πεδίου¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/002.yaml
  text: And because of the dreams I added hatred toward him, and I wanted to lick him up from the land of the living, as a calf licks up the green growth of the field.
translation:
  language: ko
  text: 그 꿈들 때문에 나는 또한 그에 대한 미움을 더했고, 그를 산 자들의 땅에서 핥아 없애고 싶었습니다. 마치 송아지가 들판의 푸른 풀을 핥아 먹듯이 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  english_pob_choice: I added hatred toward him
  chosen_korean: 나는 그에게 대한 미움을 더했고
  alternatives_korean:
  - 나는 그를 더 미워했고
  - 나는 그에게 미움을 보탰고
  lexicon: προστίθημι + μῖσος
  rationale: ‘더하다/보태다’의 의미를 살리면서도, 미움의 감정을 단순 발생이 아니라 누적·가중된 것으로 표현했습니다.
- source_word: ἐκλεῖξαι ... ἐκ γῆς ζώντων
  english_pob_choice: to lick him up from the land of the living
  chosen_korean: 그를 살아 있는 땅에서 핥아 없애 버리고 싶었습니다
  alternatives_korean:
  - 그를 살아 있는 자들의 땅에서 핥아 삼키고 싶었습니다
  - 그를 살아 있는 땅에서 핥아 사라지게 하고 싶었습니다
  lexicon: ἐκλείχω + ἐκ γῆς ζώντων
  rationale: 동사의 직유적 폭력을 살리기 위해 ‘핥아 없애 버리다’로 옮겼고, ‘land of the living’은 직역해 생존 영역에서의 제거를 드러냈습니다.
- source_word: ὃν τρόπον ἐκλείχει ὁ μόσχος τὰ χλωρὰ τοῦ πεδίου
  english_pob_choice: as a calf licks up the green growth of the field
  chosen_korean: 마치 송아지가 들의 푸른 풀을 핥아 먹듯이 말입니다
  alternatives_korean:
  - 송아지가 들의 푸른 것을 핥아 먹듯
  - 송아지가 들판의 푸른 풀을 핥아 없애듯
  lexicon: ὃν τρόπον + ὁ μόσχος + τὰ χλωρὰ τοῦ πεδίου
  rationale: 비유의 자연스러운 한국어 관용을 따르되, ‘핥아 먹다’로 원문의 반복적 소모 이미지를 유지했습니다.
theological_decisions:
- issue: 폭력적 자기고백의 표현 수위
  chosen_reading: 발화자의 의도와 감정의 과격함을 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘몹시 미워했고’처럼 완화
  - ‘해치고 싶었습니다’처럼 일반화
  rationale: 본문은 형제에 대한 적개심과 파괴 충동을 과장된 이미지로 묘사하므로, 이를 순화하면 원문의 도덕적·수사적 충격이 약해집니다.
  doctrine_reference: 본문의 자기고백적 회개 서술과 수사적 과장
