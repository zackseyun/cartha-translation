id: T12P.GAD.2.3
reference: Testament of Gad 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 3. Καὶ κρυφῆ πράσας αὐτὸν Ἰούδας τοῖς Ἰσμαιλίταις. [β, Α, S¹] 3. Διὸ¹⁵ ἐγὼ καὶ Συμεὼν¹⁶ πεπράκαμεν αὐτὸν τοῖς Ἰσμαηλίταις [*τριάκοντα χρυσίων¹⁷, καὶ τὰ δέκα ἀποκρύψαντες τὰ εἴκοσι ἐδείξαμεν τοῖς ἀδελφοῖς ἡμῶν¹⁸].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/003.yaml
  text: 'But Judah sold him secretly to the Ishmaelites.


    Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers.'
translation:
  language: ko
  text: '그런데 유다는 그를 몰래 이스마엘 사람들에게 팔았습니다.[a]


    그러므로 시므온과 내가 그를 이스마엘 사람들에게 팔았습니다. 금 서른 개를 받고, 열 개는 숨긴 뒤 스무 개만 형제들에게 보여 주었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 전승이 갈립니다. α 본문은 ‘유다가 그를 몰래 이스마엘 사람들에게 팔았다’고 전하며, β·A·S¹ 본문은 이어지는 ‘그러므로 시므온과 내가 …’라는 진술을 전합니다.
    reason: 서로 다른 사본 전승의 독법을 영어 POB와 같이 함께 제시할 때, 전승상의 차이와 본문의 긴장을 투명하게 밝혀 줍니다.
lexical_decisions:
- source_word: κρυφῆ / Διὸ
  english_pob_choice: secretly / Therefore
  chosen_korean: 몰래 / 그러므로
  alternatives_korean:
  - 은밀히 / 그래서
  - 비밀리에 / 그러므로
  lexicon: κρυφῆ, Διό
  rationale: κρυφῆ는 행위의 비밀성을 드러내는 부사로서 ‘몰래’가 자연스럽고 직접적이며, Διό는 앞선 서술에 대한 결과 연결이므로 ‘그러므로’로 옮겼습니다.
- source_word: πράσας / πεπράκαμεν
  english_pob_choice: sold / sold
  chosen_korean: 팔았습니다 / 팔았는데
  alternatives_korean:
  - 팔았습니다 / 팔았습니다
  - 넘겼습니다 / 넘겼습니다
  lexicon: πράσας, πεπράκαμεν
  rationale: 두 형태 모두 ‘팔다’의 과거적 서술이므로 동일 어근을 유지해 행위의 반복성과 연속성을 살렸습니다.
- source_word: τοῖς Ἰσμαηλίταις
  english_pob_choice: the Ishmaelites
  chosen_korean: 이스마엘 사람들에게
  alternatives_korean:
  - 이스마엘인들에게
  - 이슈마엘 사람들에게
  lexicon: Ἰσμαηλίταις
  rationale: 민족명으로서 한국어 성경 문체에 익숙한 ‘사람들’을 보조어로 두어 집단 정체성을 분명하게 했습니다.
- source_word: τριάκοντα χρυσίων / τὰ δέκα ... τὰ εἴκοσι
  english_pob_choice: thirty pieces of gold; ... hiding ten, we showed twenty
  chosen_korean: 금 서른 개를 받고, 열 개는 숨긴 뒤 스무 개만 보여 주었습니다
  alternatives_korean:
  - 금 서른 조각을 받고, 열 개는 숨긴 뒤 스무 개만 보여 주었습니다
  - 금 서른 개를 받고, 열 개를 감춘 뒤 스무 개만 보여 주었습니다
  lexicon: τριάκοντα χρυσίων, τὰ δέκα, τὰ εἴκοσι
  rationale: χρυσίων을 문자적으로 ‘금’으로 살리되, 단위가 명시되지 않은 상태를 반영해 ‘개’를 붙여 한국어 문장으로 자연스럽게 처리했습니다. ‘보여 주었습니다’는 ἐδείξαμεν의 공개/제시 행위를 반영합니다.
theological_decisions:
- issue: α-text와 β-text의 상이한 전승을 한국어 본문에 어떻게 반영할지
  chosen_reading: 본문은 POB 영어 본문에 따른 β계열 서술(시므온과 내가 팔았다)을 따르되, 장기적으로 검토 가능한 형태로만 정리했습니다.
  alternative_readings:
  - 'α-text: 유다가 몰래 팔았다'
  - '혼합 본문: 유다가 몰래 팔았다고 한 뒤, 시므온과 내가 팔았다고 재서술'
  rationale: 제공된 English POB 번역이 β계열을 본문으로 삼고 있으므로, 한국어도 그 흐름을 따르는 것이 번역 일관성과 감사 가능성에 부합합니다.
  doctrine_reference: 텍스트비평/전승비평
