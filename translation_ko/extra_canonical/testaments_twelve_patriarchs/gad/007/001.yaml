id: T12P.GAD.7.1
reference: Testament of Gad 7:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/001.yaml
  text: But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be made complete. For in this way it is to your advantage.
translation:
  language: ko
  text: 그러나 누군가가 여러분보다 더 잘되면, 슬퍼하지 마십시오. 오히려 그를 위해 기도하여, 그가 온전하게 되게 하십시오. 그렇게 하는 것이 여러분에게 유익합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ὑπὲρ ὑμᾶς εὐοδοῦται
  english_pob_choice: someone prospers more than you
  chosen_korean: 누군가가 여러분보다 더 잘되면
  alternatives_korean:
  - 누군가가 여러분보다 더 번영하면
  - 누군가가 여러분보다 더 형통하면
  lexicon: εὐοδοῦμαι
  rationale: 문맥상 타인의 성공·형통을 가리키므로, 현대 한국어에서 자연스러운 비교 표현으로 옮겼습니다. '형통'은 다소 종교적·전통적 색채가 있어 기본문에서는 더 평이한 표현을 택했습니다.
- source_word: μὴ λυπεῖσθε
  english_pob_choice: do not be grieved
  chosen_korean: 슬퍼하지 마십시오
  alternatives_korean:
  - 근심하지 마십시오
  - 마음 아파하지 마십시오
  lexicon: λυπέω
  rationale: 감정적 상심을 직접적으로 금지하는 표현이므로, 합쇼체 명령으로 간결하게 옮겼습니다.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  english_pob_choice: pray for him
  chosen_korean: 그를 위해 기도하여
  alternatives_korean:
  - 그를 위하여 기도하십시오
  - 그를 위해 간구하여
  lexicon: εὔχομαι
  rationale: εὔχεσθε는 단순한 소망보다 '기도하다'의 뜻이 분명하므로, 대상 보조구문을 자연스럽게 연결했습니다.
- source_word: ἵνα τελειωθῇ
  english_pob_choice: that he may be made complete
  chosen_korean: 그가 온전하게 되게 하십시오
  alternatives_korean:
  - 그가 완전하게 되게 하십시오
  - 그가 성숙하게 되게 하십시오
  lexicon: τελειόω
  rationale: 영어 POB의 'made complete'를 따라, 미완성 상태에서 충만·성취의 상태로 이르는 의미를 '온전하게 되다'로 옮겼습니다.
- source_word: συμφέρον
  english_pob_choice: it is to your advantage
  chosen_korean: 여러분에게 유익합니다
  alternatives_korean:
  - 여러분에게 이롭습니다
  - 여러분에게 도움이 됩니다
  lexicon: συμφέρω
  rationale: 공동체적·실천적 유익을 나타내는 말이므로, 현대 한국어에서 분명한 '유익'으로 옮겼습니다.
theological_decisions:
- issue: 타인의 형통에 대한 반응과 중보 기도의 윤리
  chosen_reading: 질투나 슬픔 대신 그를 위해 기도하라는 공동체 윤리를 분명히 드러내는 권면으로 읽었습니다.
  alternative_readings:
  - 단순한 감정 조절 권면
  - 상대의 성공을 수동적으로 수용하라는 조언
  rationale: 원문은 타인의 우월한 형통을 보았을 때의 내적 반응을 넘어, 적극적인 중보 기도로 전환하라고 명령합니다. 이 흐름을 유지해야 문장의 목적절(ἵνα τελειωθῇ)과 결론(συμφέρον)이 자연스럽게 연결됩니다.
  doctrine_reference: 공동체 사랑과 중보 기도
- issue: τελειωθῇ의 의미
  chosen_reading: 도덕적 완벽주의가 아니라 하나님 앞에서의 충만한 성숙과 완성의 방향으로 이해했습니다.
  alternative_readings:
  - 죄 없는 무결점의 상태
  - 단순한 외적 성공
  rationale: POB의 'made complete'를 따르되, 한국어 '온전하다'로 번역하여 인격과 삶의 성숙이 포함된 넓은 의미를 유지했습니다.
  doctrine_reference: 성화와 성숙
