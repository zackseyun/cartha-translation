  text: Examine the judgments of the Lord, and your purpose will be illumined and be at rest.
translation:
  language: ko
  text: 주님의 판단들을 살펴보십시오. 그러면 당신의 계획이 밝아지고 고요해질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξέτασον
  english_pob_choice: Examine
  chosen_korean: 살펴보십시오
  alternatives_korean:
  - 검토하십시오
  - 조사하십시오
  - 탐구하십시오
  lexicon: ἐξετάζω
  rationale: 명령형의 요구를 살리면서도, 단순한 학술적 ‘조사’보다 말씀의 판단을 분별하여 들여다보는 뉘앙스를 담아 자연스럽게 옮겼습니다.
- source_word: κρίματα Κυρίου
  english_pob_choice: the judgments of the Lord
  chosen_korean: 주님의 판단들
  alternatives_korean:
  - 주님의 심판들
  - 주님의 판결들
  - 주님의 결정들
  lexicon: κρίμα / κύριος
  rationale: κρίματα는 단지 형벌이 아니라 주님의 판단·결정을 가리킬 수 있어, 영어 POB의 ‘judgments’를 따라 ‘판단들’로 두었습니다.
- source_word: καταλάμψει
  english_pob_choice: will be illumined
  chosen_korean: 밝아지고
  alternatives_korean:
  - 비추어지고
  - 빛나게 되고
  - 조명될 것이고
  lexicon: καταλάμπω
  rationale: 반드시 빛의 이미지를 살리되, 한국어에서 계획·의도가 ‘밝아지다’라고도 자연스럽게 말할 수 있어 결과 상태를 간결하게 표현했습니다.
- source_word: ἡσυχάσει
  english_pob_choice: will be at rest
  chosen_korean: 평안하게 될 것입니다
  alternatives_korean:
  - 고요해질 것입니다
  - 잠잠해질 것입니다
  - 안정될 것입니다
  lexicon: ἡσυχάζω
  rationale: ‘rest’를 단순 정적이 아니라 내적 평정으로 이해하여, 문맥상 더 자연스러운 ‘평안’으로 옮겼습니다.
theological_decisions:
- issue: 주님의 판단들을 어떻게 이해할 것인가
  chosen_reading: 하나님의 통치 아래서 드러나는 주님의 판단과 결정들을 성찰하라는 권면으로 읽었습니다.
  alternative_readings:
  - 주님의 심판 행위를 묵상하라는 뜻
  - 율법적 판결들을 검토하라는 뜻
  rationale: 문맥은 형벌 예고보다 분별의 권면에 가깝기 때문에, 보편적 ‘심판’보다 판단/결정의 성격을 살리는 쪽이 원문과 영어 POB의 균형에 맞습니다.
  doctrine_reference: 서사적 지혜 권면; judgment as discernment and governance
