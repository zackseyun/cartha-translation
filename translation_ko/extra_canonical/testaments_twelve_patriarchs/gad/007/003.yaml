review_pass:
  verdict: revise
  source_fidelity: Ἐξέτασον의 단수 명령은 ‘살펴보십시오’로 적절히 반영되었습니다. κρίματα Κυρίου는 여기서 단순히 형벌만을 뜻한다고 한정할 수 없으므로 ‘주님의 판단들’은 가능한 번역입니다. 다만 ἡσυχάσει는 ‘평안하게 될 것입니다’보다 ‘고요해질 것입니다’가 정지·안정의 기본 의미를 더 직접적으로 보존합니다. διαβούλιόν σου는 ‘당신의 계획’으로 무난합니다.
  naturalness: ‘계획이 … 평안하게 될 것입니다’는 현대 한국어에서 다소 어색합니다. ‘계획이 밝아지고 고요해질 것입니다’는 합쇼체를 유지하면서도 더 자연스럽고, 계획/의도가 분명해지고 안정되는 병렬을 잘 드러냅니다.
  terminology: ‘주님’과 ‘판단’은 현대 한국어 성서 문맥에서 자연스럽고, 특정 교리적 해석을 덧붙이지 않습니다. 원문의 복수 κρίματα를 ‘판단들’로 유지했습니다.
  issues:
  - severity: low
    issue: ἡσυχάσει의 번역 표현
    rationale: ‘평안하게 될 것입니다’는 추상적이고 한국어 결합이 다소 부자연스럽습니다. ἡσυχάζω의 ‘고요해지다, 안정되다’라는 의미를 따라 ‘고요해질 것입니다’로 고치면 더 직접적입니다.
  revised_text: 주님의 판단들을 살펴보십시오. 그러면 당신의 계획이 밝아지고 고요해질 것입니다.
