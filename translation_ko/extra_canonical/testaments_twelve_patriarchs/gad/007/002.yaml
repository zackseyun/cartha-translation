  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/002.yaml
  text: And if he is exalted still more, do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who provides good and beneficial things to all people.
translation:
  language: ko
  text: 그리고 그가 더욱 높아지더라도 그를 부러워하지 마십시오. 모든 육신은 죽을 것임을 기억하십시오. 그러나 주님께는 찬송을 드리십시오. 주님은 모든 사람에게 좋은 것과 유익한 것을 공급하시는 분이십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον ὑψοῦται
  english_pob_choice: is exalted still more
  chosen_korean: 더욱 높아지더라도
  alternatives_korean:
  - 더 높여지더라도
  - 한층 더 높아지더라도
  lexicon: ὑψόω
  rationale: 지위나 명예의 상승을 자연스럽게 살리면서, 비교적 중립적인 수동 표현으로 원문의 상승 뉘앙스를 반영했습니다.
- source_word: μὴ φθονεῖτε αὐτῷ
  english_pob_choice: do not envy him
  chosen_korean: 그를 부러워하지 마십시오
  alternatives_korean:
  - 그를 시기하지 마십시오
  - 그에게 질투하지 마십시오
  lexicon: φθονέω
  rationale: φθονέω는 단순 감정뿐 아니라 남의 높아짐을 못마땅해하는 태도를 포함하므로, 표준적이고 읽기 자연스러운 ‘부러워하지 마십시오’로 옮겼습니다.
- source_word: ὕμνους προσφέρετε τῷ παρέχοντι
  english_pob_choice: offer hymns to the Lord, who provides
  chosen_korean: 주님께는 찬송을 드리십시오. 주님은 … 공급하시는 분이십니다
  alternatives_korean:
  - 주님께 찬양을 드리십시오
  - 주님께 노래를 바치십시오
  lexicon: ὕμνους / προσφέρω / παρέχω
  rationale: ὕμνους는 예배적 ‘찬송’으로, προσφέρετε는 한국어 예배 문맥에서 자연스러운 ‘드리다’로, παρέχοντι는 영어 POB의 revised cue에 맞춰 ‘공급하시는’으로 옮겼습니다.
- source_word: τὰ καλὰ καὶ συμφέροντα
  english_pob_choice: good and beneficial things
  chosen_korean: 좋은 것과 유익한 것
  alternatives_korean:
  - 선한 것과 유익한 것
  - 좋고 유익한 것
  lexicon: καλός / συμφέρω
  rationale: καλά의 도덕적·질적 선함과 συμφέροντα의 실질적 유익을 분리해, 영어 POB의 ‘good and beneficial’ 구분을 한국어로 유지했습니다.
theological_decisions:
- issue: 모든 육신의 죽음에 대한 보편적 경고
  chosen_reading: 모든 육신은 죽을 것임을 기억하십시오
  alternative_readings:
  - 모든 육체는 죽습니다
  - 모든 사람은 죽을 것입니다
  rationale: πᾶσα σὰρξ의 직설적 경고를 보존하기 위해 ‘육신’을 유지했고, 단순한 인간 일반화보다 죽음의 보편성을 더 직접적으로 드러냈습니다.
  doctrine_reference: 죽음의 보편성과 인간의 한계에 대한 지혜문학적 경고
