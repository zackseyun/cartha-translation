review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ἐξάρατε는 미움을 단순히 ‘내버리는’ 것보다 적극적으로 제거·몰아내라는 명령에 가깝습니다. ψυχή와 καρδία를 각각 ‘영혼’과 ‘마음’으로 구별한 것은 원문의 표현을 잘 보존합니다.
  naturalness: ‘마음의 올곧음 안에서’는 영어 구조를 따른 직역투로 현대 한국어에서 다소 부자연스럽습니다. ‘올곧은 마음으로’가 같은 뜻을 자연스럽게 전달합니다. ‘미움을 내버리고’도 문맥상 가능하지만, 능동적 배격의 어감에는 ‘몰아내고’가 더 적절합니다.
  terminology: ‘영혼’, ‘미움’, ‘서로 사랑하십시오’는 적절합니다. εὐθύτης의 도덕적·내적 바름은 ‘올곧은 마음’으로 자연스럽게 살릴 수 있습니다. 본문에 제시된 † 표시는 편집본의 본문상 주의를 나타내지만, 제공된 자료에는 그에 대응하는 구체적 이문이나 주석 내용이 없으므로 추정적 번역 주석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘미움을 내버리고’의 동사 강도
    rationale: ἐξάρατε는 ‘들어 올려 없애다, 제거하다’의 적극적인 명령입니다. ‘내버리다’는 버리거나 방치한다는 뜻도 낼 수 있어, ‘몰아내다’가 원문의 배격 명령을 더 정확히 반영합니다.
  - severity: low
    issue: ‘마음의 올곧음 안에서’의 직역투
    rationale: ἐν εὐθύτητι καρδίας는 사랑의 태도·방식을 나타냅니다. ‘올곧은 마음으로’가 현대 표준어에서 자연스럽고 원문의 의미도 유지합니다.
  revised_text: 그러므로 여러분의 영혼에서 미움을 몰아내고, 올곧은 마음으로 서로 사랑하십시오.
