  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐξάρατε οὖν³⁸ τὸ †μῖσος³⁹ ἀπὸ τῶν ψυχῶν ὑμῶν, καὶ ἀγαπήσατε⁴⁰ ἀλλήλους ἐν εὐθύτητι καρδίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/007.yaml
  text: Therefore cast out hatred from your souls, and love one another in uprightness of heart.
translation:
  language: ko
  text: 그러므로 여러분의 영혼에서 미움을 몰아내고, 올곧은 마음으로 서로 사랑하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρατε ... τὸ μῖσος
  english_pob_choice: cast out hatred
  chosen_korean: 미움을 내버리고
  alternatives_korean:
  - 미움을 몰아내고
  - 증오를 제거하고
  lexicon: ἐξαίρω + μῖσος
  rationale: 명령형 동사와 ‘hatred’의 강한 배격을 살리되, 현대 한국어에서 자연스럽고 문맥에 맞는 “내버리고”로 옮겼습니다.
- source_word: ἀπὸ τῶν ψυχῶν ὑμῶν
  english_pob_choice: from your souls
  chosen_korean: 여러분의 영혼에서
  alternatives_korean:
  - 여러분의 목숨에서
  - 여러분의 마음에서
  lexicon: ψυχή
  rationale: ψυχή를 단순한 감정이 아닌 인격의 내면 전체로 받아들여, POB의 “souls”를 따라 “영혼”으로 옮겼습니다.
- source_word: ἀγαπήσατε ἀλλήλους
  english_pob_choice: love one another
  chosen_korean: 서로 사랑하십시오
  alternatives_korean:
  - 서로 사랑하세요
  - 서로를 사랑하십시오
  lexicon: ἀγαπάω
  rationale: 상호적 권면을 자연스럽게 드러내기 위해 “서로”를 앞세우고, 합쇼체 명령으로 맞췄습니다.
- source_word: ἐν εὐθύτητι καρδίας
  english_pob_choice: in uprightness of heart
  chosen_korean: 마음의 올곧음 안에서
  alternatives_korean:
  - 마음의 정직함 안에서
  - 마음의 바름 안에서
  lexicon: εὐθύτης + καρδία
  rationale: εὐθύτης의 직선성·정직성을 “올곧음”으로 옮겨, 단순한 도덕성보다 내적 바름의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘영혼’과 ‘마음’의 구분
  chosen_reading: ψυχή는 ‘영혼’으로, καρδία는 ‘마음’으로 구분해 번역했습니다.
  alternative_readings:
  - ψυχή를 ‘마음’으로 완화해 번역
  - 둘 다 ‘마음’으로 통합
  rationale: 본문이 미움을 ‘영혼’에서 내버리라고 한 뒤, 사랑의 방식은 ‘마음의 올곧음’에서 하라고 구분하므로, 두 내면 용어를 구별해 유지했습니다.
  doctrine_reference: 인간 내면의 다층적 표현을 본문 수준에서 보존
