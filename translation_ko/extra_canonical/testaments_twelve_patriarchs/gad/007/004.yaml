revisions:
- from: 그러나 누군가가 에서, 곧 나의 아버지의 형제처럼 악한 일로 부유해진다면, 질투하지 마십시오. 주님의 정한 한계를 기다리십시오.
  to: 그러나 만일 누군가가 내 아버지의 형제인 에서처럼 악한 일로 부유해진다면, 시기하지 마십시오. 주님께서 정하신 한계를 기다리십시오.
  rationale: The revision corrects Korean syntax around the appositional identification of Esau, uses contextually appropriate vocabulary for ζηλόω, and clarifies the Korean expression of ὅρον Κυρίου while preserving its deliberate lack of further specification. The two imperatives remain in the source order; their sequence conveys the explanatory force of γάρ without introducing an unnatural Korean causal construction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional sense, illicit source of wealth, Esau identification, prohibition, and imperative to await the Lord's ὅρος are retained. The revision makes the apposition syntactically unambiguous in Korean and renders the possessive construction naturally as a limit set by the Lord, without specifying whether that limit is a time, judgment, or another particular outcome.
  naturalness: The draft's placement of “에서, 곧 나의 아버지의 형제처럼” is awkward because the comparative phrase is split from the person it identifies. “내 아버지의 형제인 에서처럼” is idiomatic modern Korean. “시기하지 마십시오” is the more natural term here for envy of another's wrongful prosperity.
  terminology: “악한 일” appropriately represents ἐκ κακῶν without narrowing the evil to a particular act. “주님께서 정하신 한계” avoids the potentially misleading Korean reading of “주님의 한계” as a limitation inherent in the Lord, while retaining the source's boundary/limit imagery. No doctrinally specific interpretation is introduced.
  issues:
  - severity: medium
    issue: The Esau apposition is awkwardly and ambiguously placed.
    rationale: “에서, 곧 나의 아버지의 형제처럼” can momentarily make “my father's brother” seem to be the object of comparison apart from Esau. The Greek identifies Esau as the speaker's father's brother; Korean should attach that identification directly to Esau.
  - severity: low
    issue: “질투하지 마십시오” is less precise in this context.
    rationale: ζηλώσητε here concerns envy or resentful emulation in response to evil-acquired wealth. “시기하지 마십시오” expresses that sense more idiomatically in formal Korean.
  - severity: low
    issue: “주님의 정한 한계” is grammatically compressed and can be unclear.
    rationale: Korean more naturally expresses the source genitive in context as “주님께서 정하신 한계,” preserving ὅρος as “limit” without defining it as an appointed time.
  revised_text: 그러나 만일 누군가가 내 아버지의 형제인 에서처럼 악한 일로 부유해진다면, 시기하지 마십시오. 주님께서 정하신 한계를 기다리십시오.
  revised_footnotes: []
  revision_rationale: The revision corrects Korean syntax around the appositional identification of Esau, uses contextually appropriate vocabulary for ζηλόω, and clarifies the Korean expression of ὅρον Κυρίου while preserving its deliberate lack of further specification. The two imperatives remain in the source order; their sequence conveys the explanatory force of γάρ without introducing an unnatural Korean causal construction.
