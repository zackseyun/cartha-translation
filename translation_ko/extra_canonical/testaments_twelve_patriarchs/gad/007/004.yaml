base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/004.yaml
  text: But if someone becomes rich through evil, like Esau my father's brother, do not be jealous; rather, await the appointed limit of the Lord.
translation:
  language: ko
  text: 그러나 누군가가 에서, 곧 나의 아버지의 형제처럼 악한 일로 부유해진다면, 질투하지 마십시오. 주님의 정한 한계를 기다리십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ
  english_pob_choice: But if
  chosen_korean: 그러나 누군가가
  alternatives_korean:
  - 그런데 만일
  - 하지만 만일
  lexicon: ἐὰν δὲ
  rationale: 조건 전환을 자연스럽게 살리되, 문맥상 대비를 드러내는 접속으로 한국어 흐름을 맞췄습니다.
- source_word: ἐκ κακῶν
  english_pob_choice: through evil
  chosen_korean: 악한 일로
  alternatives_korean:
  - 악으로
  - 악한 것에서
  lexicon: ἐκ + κακός
  rationale: 행위의 근원·수단을 드러내는 표현으로 옮겨, 부유함의 출처가 도덕적으로 왜곡되었음을 살렸습니다.
- source_word: ὡς Ἡσαῦ ὁ πατράδελφός μου
  english_pob_choice: like Esau my father's brother
  chosen_korean: 에서, 곧 나의 아버지의 형제처럼
  alternatives_korean:
  - 에서, 나의 아버지의 형제처럼
  - 에서처럼, 나의 아버지의 형제처럼
  lexicon: ὡς + ὁ πατράδελφός μου
  rationale: 동격 설명을 쉼표와 ‘곧’으로 풀어, 에서의 식별을 분명히 하면서도 원문의 apposition을 유지했습니다.
- source_word: μὴ ζηλώσητε
  english_pob_choice: do not be jealous
  chosen_korean: 질투하지 마십시오
  alternatives_korean:
  - 시기하지 마십시오
  - 부러워하지 마십시오
  lexicon: ζηλόω
  rationale: 문맥상 남의 악한 번영을 보고 품는 감정이므로, 한국어에서 직접적이고 경고적인 ‘질투하다’로 옮겼습니다.
- source_word: ὅρον Κυρίου
  english_pob_choice: the appointed limit of the Lord
  chosen_korean: 주님의 정한 한계
  alternatives_korean:
  - 주님의 한계
  - 주님의 정해진 경계
  lexicon: ὅρος + Κυρίου
  rationale: ὅρον을 ‘한계’로 직역해 해석을 덧붙이지 않고, Κυρίου는 소유격으로 ‘주님의’라고 표현했습니다.
- source_word: ἐκδέξασθε
  english_pob_choice: await
  chosen_korean: 기다리십시오
  alternatives_korean:
  - 기다려 주십시오
  - 기대하십시오
  lexicon: ἐκδέχομαι
  rationale: 원문의 수동적 ‘기다림/기대함’의 어감을 살리면서, 현대 한국어에서 가장 자연스러운 공손 명령형으로 처리했습니다.
theological_decisions:
- issue: 주님의 한계(ὅρον Κυρίου)의 의미를 과도하게 해석할지 여부
  chosen_reading: ‘주님의 정한 한계’로 옮기되, 심판 시점이나 운명론을 본문 밖에서 단정하지 않았습니다.
  alternative_readings:
  - ‘주님의 정해진 때’
  - ‘주님께서 정하신 한도’
  rationale: ὅρος는 문맥상 ‘정해진 경계/한계’가 핵심이므로, 시간 개념을 추가하는 해석을 피하고 본문의 긴장을 보존했습니다.
  doctrine_reference: 섭리와 심판의 시기 해석에 대한 문맥 보존 원칙
