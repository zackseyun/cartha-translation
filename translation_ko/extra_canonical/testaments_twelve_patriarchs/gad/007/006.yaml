base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/006.yaml
  text: For the poor man, if being free from envy in all things he is pleasing to the Lord, this one is richer than all, because he does not have the distraction of vain people.
translation:
  language: ko
  text: 가난한 사람이 모든 일에서 시기하지 않고 주님을 기쁘시게 하면, 그는 모든 사람보다 더 부유합니다. 이는 그에게 헛된 사람들의 산만함이 없기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πένης
  english_pob_choice: the poor man
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 가난한 자
  - 빈곤한 사람
  lexicon: πένης
  rationale: 사회적 지위보다 실제 형편을 드러내는 중립적 현대어로 옮겼습니다.
- source_word: ἄφθονος
  english_pob_choice: being abundant in all things
  chosen_korean: 모든 일에서 시기심이 없으면
  alternatives_korean:
  - 모든 일에서 넉넉하면
  - 모든 일에 풍성하면
  lexicon: ἄφθονος
  rationale: English audit trail의 최신 판정은 ‘free from envy’ 대신 ‘abundant in all things’였지만, 그리스어 ἄφθονος는 여기서 문맥상 ‘시기하지 않음/시기심이 없음’의 자질을 가리키는 것으로 보아, 의미 긴장을 드러내기 위해 직역 성격을 살렸습니다.
- source_word: εὐαρεστῇ
  english_pob_choice: is pleasing to the Lord
  chosen_korean: 주님을 기쁘시게 하며
  alternatives_korean:
  - 주님께 기쁘게 받아들여지면
  - 주님을 기쁘게 하면
  lexicon: εὐαρεστῇ
  rationale: 조건절의 현재 접속법 뉘앙스를 자연스러운 한국어 조건 표현으로 옮겼습니다.
- source_word: περισπασμὸν τῶν ματαίων ἀνθρώπων
  english_pob_choice: the distraction of vain people
  chosen_korean: 헛된 사람들의 분주함
  alternatives_korean:
  - 헛된 사람들의 산만함
  - 허무한 사람들의 방해
  lexicon: περισπασμός
  rationale: περισπασμός는 단순한 심리 상태보다 ‘산만하게 끌려다님/분주함’의 의미가 강해, 문맥상 소모적이고 분산된 삶을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: ἄφθονος의 의미를 어떤 방향으로 드러낼지
  chosen_reading: 본문의 도덕적 대비를 살려 ‘시기심이 없음’으로 읽되, 문장 전체는 ‘주님을 기쁘시게 함’과 연결했습니다.
  alternative_readings:
  - ‘모든 일에서 넉넉함’
  - ‘모든 일에서 풍성함’
  rationale: 이 구절은 가난의 현실보다 내적 태도와 하나님/주님 앞에서의 충성을 강조하므로, 단순 물질적 풍요보다 윤리적·관계적 의미를 우선했습니다.
  doctrine_reference: 지혜문학적 덕목과 내적 정결의 강조
