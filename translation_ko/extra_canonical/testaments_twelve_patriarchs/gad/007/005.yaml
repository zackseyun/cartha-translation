id: T12P.GAD.7.5
reference: Testament of Gad 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Εἰ²² ἀφαιρεῖται²³ †αὐτὰ²⁴ *ἐν κακοῖς²⁵, ἢ μετανοήσαντι²⁶, ἀφίησι²⁷, ἢ²⁸ ἀμετανόητος²⁹ τηρεῖται³⁰ εἰς *αἰωνίαν κόλασιν³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/005.yaml
  text: For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment.
translation:
  language: ko
  text: 만일 악한 가운데서 빼앗긴 것이 그에게서 빼앗기거나, 그가 회개하면 용서받습니다. 그러나 회개하지 않는 사람은 영원한 형벌을 받도록 보존됩니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφαιρεῖται ... ἐν κακοῖς
  english_pob_choice: what was taken away in evil is taken from him
  chosen_korean: «악한 가운데서 빼앗긴 것이 그에게서 빼앗기거나»
  alternatives_korean:
  - «악으로 인해 빼앗긴 것이 그에게서 제거되거나»
  - «악한 일로 빼앗긴 것이 그에게서 취해지거나»
  lexicon: ἀφαιρέω
  rationale: source의 ἀφαιρεῖται와 ἐν κακοῖς의 결합을 따라 ‘빼앗기다’와 ‘악한 가운데서’를 유지해, 단순한 상실이 아니라 악 속에서의 박탈이라는 뉘앙스를 살렸습니다.
- source_word: μετανοήσαντι / ἀμετανόητος
  english_pob_choice: if he repents / remains unrepentant
  chosen_korean: «그가 회개하면» / «회개하지 않는 사람은»
  alternatives_korean:
  - «그가 뉘우치면» / «뉘우치지 않는 사람은»
  - «그가 돌이키면» / «돌이키지 않는 사람은»
  lexicon: μετανοέω, ἀμετανόητος
  rationale: 회개-비회개의 대조를 직접 드러내기 위해 ‘회개하다/회개하지 않다’를 사용했고, ἀμετανόητος의 지속적 상태를 ‘회개하지 않는 사람’으로 옮겼습니다.
- source_word: ἀφίησι
  english_pob_choice: he is forgiven
  chosen_korean: «용서받습니다»
  alternatives_korean:
  - «사함을 받습니다»
  - «용서하심을 받습니다»
  lexicon: ἀφίημι
  rationale: 행위의 수동 결과를 자연스럽게 나타내면서도, 본문의 사죄 의미를 분명히 하기 위해 ‘용서받습니다’로 옮겼습니다.
- source_word: τηρεῖται εἰς αἰωνίαν κόλασιν
  english_pob_choice: is kept for eternal punishment
  chosen_korean: «영원한 형벌을 받도록 보존됩니다»
  alternatives_korean:
  - «영원한 형벌을 위해 지켜집니다»
  - «영원한 형벌을 위해 간직됩니다»
  lexicon: τηρέω, αἰώνιος, κόλασις
  rationale: τηρέω의 ‘보존/지켜두다’와 κόλασις의 ‘형벌’을 함께 살리되, 한국어에서 자연스러운 결과 상태를 위해 ‘받도록 보존됩니다’로 풀었습니다.
theological_decisions:
- issue: 회개 시 용서의 조건 제시
  chosen_reading: 회개하면 용서받습니다
  alternative_readings:
  - 회개하면 사함을 받습니다
  - 회개하면 용서하심을 받습니다
  rationale: 본문의 조건문 구조를 그대로 살려 회개와 용서의 직접적 연계를 드러냈습니다.
  doctrine_reference: 회개와 용서의 관계를 다루는 서사적/권면적 문맥
- issue: 최종 상태의 보존과 형벌
  chosen_reading: 영원한 형벌을 받도록 보존됩니다
  alternative_readings:
  - 영원한 형벌을 위해 지켜집니다
  - 영원한 벌로 남겨집니다
  rationale: τηρεῖται의 보존 의미와 εἰς αἰωνίαν κόλασιν의 종말론적 결과를 둘 다 보존해, 단순 처벌보다 ‘보존되어 귀결되는 형벌’이라는 긴장을 유지했습니다.
  doctrine_reference: 종말론적 심판과 보존의 표현
