  text: 3. *Καὶ ἡσυχάσας ὀλίγον εἶπε πάλιν¹¹. Τέκνα μου, ὑπακούσατε¹² Γτοῦ πατρὸς ὑμῶν¹³⌉, καὶ θάψατέ με ἐγγὺς¹⁴ τῶν πατέρων μου.
  language: Greek
