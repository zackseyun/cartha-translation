base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/003.yaml
  text: 'And after resting a little he spoke again: My children, obey your father, and bury me near my fathers.'
translation:
  language: ko
  text: 그리고 그가 잠시 쉬고 다시 말하였습니다. “내 자녀들아, 아버지의 말을 들으십시오. 그리고 나를 내 조상들 곁에 묻어 주십시오.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  english_pob_choice: My children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접적인 호칭을 살리면서, 한국어에서 자연스럽고 현대적인 부름말인 ‘자녀들아’를 택해 친족적·권면적 뉘앙스를 유지했습니다.
- source_word: ὑπακούσατε
  english_pob_choice: obey
  chosen_korean: 말을 들으십시오
  alternatives_korean:
  - 순종하십시오
  - 복종하십시오
  lexicon: ὑπακούω
  rationale: 문맥상 아버지의 유언적 권면이므로, 강한 위계 어감의 ‘복종’보다 아들들이 아버지의 말을 따르라는 자연스러운 한국어 표현으로 옮겼습니다.
- source_word: θάψατέ με
  english_pob_choice: bury me
  chosen_korean: 나를 … 묻어 주십시오
  alternatives_korean:
  - 나를 … 장사해 주십시오
  - 나를 … 매장해 주십시오
  lexicon: θάπτω
  rationale: 죽은 이를 매장하는 행위를 분명히 하되, 한국어에서 유언 장면에 어울리는 직접적 표현으로 ‘묻어 주십시오’를 사용했습니다.
- source_word: ἐγγὺς τῶν πατέρων μου
  english_pob_choice: near my fathers
  chosen_korean: 내 조상들 곁에
  alternatives_korean:
  - 내 아버지들 곁에
  - 내 선조들 가까이에
  lexicon: πατέρες
  rationale: 복수형 ‘patērōn’은 단순히 부친 한 사람보다 조상들을 가리키는 문맥이므로, 한국어에서 의미가 분명한 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: ‘아버지들’(πατέρες)의 범위
  chosen_reading: 장례 장소를 조상들의 무덤 곁에 두라는 뜻으로 이해했습니다.
  alternative_readings:
  - 친부들의 곁이라는 협의
  - 족장적 선조들을 가리키는 상징적 표현
  rationale: 문맥이 유언과 매장을 말하므로, 복수 ‘아버지들’은 혈연적 선조 전체를 가리키는 표현으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 족장 전승과 매장 관습에 대한 일반적 성서 해석
