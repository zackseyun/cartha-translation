  text: For I have known that your children will turn away from him, and in every wickedness and affliction and corruption they will be away from the Lord.
translation:
  language: ko
  text: 내가 알기로는, 너희 자녀들이 그에게서 돌아설 것이며, 모든 악과 고난과 부패 가운데서는 주님에게서 멀어질 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ γὰρ ἔγνων
  english_pob_choice: For I have known
  chosen_korean: 내가 알기로는
  alternatives_korean:
  - 내가 알았습니다
  - 내가 알고 있습니다
  lexicon: γινώσκω
  rationale: 완료적 인식의 뜻을 살리되, 예언적 확신을 한국어에서 자연스럽게 드러내기 위해 직설적 과거보다 ‘알기로는’으로 옮겼습니다.
- source_word: ἀποστήσονται
  english_pob_choice: will turn away from
  chosen_korean: 돌아설 것이며
  alternatives_korean:
  - 떠날 것이며
  - 배반할 것이며
  lexicon: ἀφίστημι
  rationale: 단순한 이탈보다 관계적 이탈과 방향 전환을 함께 담는 ‘돌아서다’가 본문에 가장 가깝습니다.
- source_word: πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ
  english_pob_choice: in every wickedness and affliction and corruption
  chosen_korean: 모든 악과 고난과 부패 가운데서는
  alternatives_korean:
  - 모든 악과 해악과 타락 가운데서는
  - 모든 악과 괴로움과 썩어짐 가운데서는
  lexicon: πονηρία / κακώσις / διαφθορά
  rationale: 세 항목의 병렬을 보존하되, 각각의 어감을 한국어 표준어로 구분해 ‘악 / 고난 / 부패’로 옮겼습니다.
- source_word: ἀπὸ Κυρίου
  english_pob_choice: away from the Lord
  chosen_korean: 주님에게서 멀어질 것입니다
  alternatives_korean:
  - 주님에게서 떨어질 것입니다
  - 주님으로부터 멀어질 것입니다
  lexicon: κύριος
  rationale: 주체가 주님으로부터 분리되는 상태를 자연스럽게 표현하면서, POB의 ‘the Lord’ 대응을 유지했습니다.
theological_decisions:
- issue: 예언적 확신의 시제 표현
  chosen_reading: ‘내가 알기로는’과 미래형 ‘돌아설 것이며 … 멀어질 것입니다’로 예언적 진술을 살렸습니다.
  alternative_readings:
  - ‘내가 알고 있습니다’로 단정적으로 옮김
  - ‘… 멀어져 있을 것입니다’처럼 상태 중심으로 옮김
  rationale: 화자가 장차 일어날 일을 지식으로 확증하는 구조이므로, 현재완료적 인식과 미래 예언을 함께 드러내는 번역이 적절합니다.
  doctrine_reference: 예언적 담화의 시제와 화용론
- issue: ‘주님’의 인격적 대상성 유지
  chosen_reading: κύριος를 ‘주님’으로 번역해 야훼/주님의 인격적 관계를 유지했습니다.
  alternative_readings:
  - ‘주’
  - ‘하나님’
  rationale: 본문은 도피의 방향이 단순 원칙이 아니라 인격적 주님에게서 멀어지는 것임을 말하므로, 호칭성을 살린 ‘주님’이 적절합니다.
  doctrine_reference: 신적 칭호의 호칭적 번역
