  text: Speak these things, you also, to your children, so that they may honor Judah and Levi; for from them the Lord will raise up for you salvation for Israel.
translation:
  language: ko
  text: 이러한 말들을 너희도 너희 자녀들에게 말하여, 그들이 유다와 레위를 존중하게 하십시오. 그들로부터 주께서 이스라엘을 위한 구원을 너희에게 일으키실 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε ... ταῦτα καὶ ὑμεῖς τοῖς τέκνοις ὑμῶν
  english_pob_choice: Speak these things, you also, to your children
  chosen_korean: 이러한 말들을 너희도 너희 자녀들에게 말하여
  alternatives_korean:
  - 이 말들을 너희도 너희 자녀들에게 말하십시오
  - 이러한 것들을 너희도 자녀들에게 말하여
  lexicon: ταῦτα / τέκνα
  rationale: ταῦτα는 구체적 교훈을 가리키므로 ‘이러한 말들’로 풀어 원문의 지시성을 살렸고, τέκνα는 문맥상 자연스럽게 ‘자녀들’로 옮겼습니다.
- source_word: τιμήσωσιν
  english_pob_choice: honor
  chosen_korean: 존중하게 하십시오
  alternatives_korean:
  - 존경하게 하십시오
  - 공경하게 하십시오
  lexicon: τιμάω
  rationale: 단순한 예절 이상의 ‘가치를 인정하고 높이다’는 의미를 살리기 위해 ‘존중하다’를 택했습니다.
- source_word: Κύριος σωτηρίαν
  english_pob_choice: the Lord will raise up ... salvation
  chosen_korean: 주께서 ... 구원을 ... 일으키실
  alternatives_korean:
  - 주님께서 ... 구원을 ... 일으키실
  - 주께서 ... 구원자를 ... 세우실
  lexicon: κύριος / σωτηρία
  rationale: 여기서는 σωτηρία를 ‘구원’으로 직역해 결과를 드러냈고, ἀνατελεῖ의 상승·출현 이미지는 ‘일으키실’로 반영했습니다.
- source_word: τῷ Ἰσραήλ
  english_pob_choice: for Israel
  chosen_korean: 이스라엘을 위한
  alternatives_korean:
  - 이스라엘에게
  - 이스라엘을 위해
  lexicon: dative of advantage
  rationale: 여격의 유익 대상 의미를 살려 ‘~을 위한’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 유다와 레위를 존중하라는 권면의 전달 방식
  chosen_reading: 후대 자녀들에게도 이어질 교육적 명령으로 이해하여, 직접적 권면형을 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하여 옮김
  - 공경의 대상으로만 제한함
  rationale: 본문은 조상들의 말을 자녀들에게 전하라고 명령하면서 유다와 레위를 특별히 높이게 하므로, 교육적·공동체적 권위를 약화시키지 않도록 했습니다.
  doctrine_reference: 족장 유언 전승의 권면적 문맥
- issue: Κύριος의 번역
  chosen_reading: 주를 일반적 호칭인 ‘주’로 옮겼습니다.
  alternative_readings:
  - 야훼로 옮김
  - 주님으로 옮김
  rationale: 본문의 헬라어 전승은 직접적인 야훼 উদ্ধ록 표지 없이 단순히 Κύριος를 사용하므로, 본문 표면을 따라 ‘주’로 처리했습니다.
  doctrine_reference: 구약 인용 표지 및 인명/칭호 구분
