  - severity: low
    issue: 본문 끝의 [a] 표지에 대응하는 번역 주석이 없습니다.
    rationale: 제공된 번역 주석 세트가 비어 있으므로 독자에게 미해결 각주 표지가 남습니다. 원전의 17·18은 비평 장치 표지이나 해당 주석 내용이 제공되지 않았으므로 새 주석을 추정하여 만들지 않고 한국어 본문의 미대응 표지를 제거하는 것이 안전합니다.
