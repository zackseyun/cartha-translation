base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/005.yaml
  text: And after five years they brought him up to Hebron, and laid him with his fathers.
translation:
  language: ko
  text: 그리고 다섯 해가 지난 뒤에 그를 헤브론으로 데려가서, 그를 그의 조상들과 함께 두었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ἔτη πέντε
  english_pob_choice: after five years
  chosen_korean: 다섯 해가 지난 뒤에
  alternatives_korean:
  - 다섯 해 후에
  - 다섯 년이 지나서
  lexicon: μετά + accusative of time
  rationale: 시간 경과를 자연스러운 한국어로 옮기되, 원문의 ‘five years’라는 구체적 기간을 그대로 살렸습니다.
- source_word: ἀνήγαγον αὐτὸν εἰς Χεβρών
  english_pob_choice: they brought him up to Hebron
  chosen_korean: 그를 헤브론으로 데려가서
  alternatives_korean:
  - 그를 헤브론으로 올라가게 하여
  - 그를 헤브론으로 데리고 올라가서
  lexicon: ἀνάγω + εἰς
  rationale: ἀνήγαγον은 단순한 이동이 아니라 ‘위로 데려감’의 뉘앙스가 있으나, 한국어에서는 문맥상 자연한 ‘데려가서’로 처리하고 지명은 표준 음역 ‘헤브론’을 유지했습니다.
- source_word: ἔθηκαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: laid him with his fathers
  chosen_korean: 그를 그의 조상들과 함께 두었습니다
  alternatives_korean:
  - 그를 그의 조상들 곁에 두었습니다
  - 그를 그의 조상들과 함께 눕혔습니다
  lexicon: τίθημι + μετὰ τῶν πατέρων
  rationale: 직역형 ‘눕혔습니다’도 가능하지만, 매장 여부가 명시되지 않은 상태에서 원문의 장례적 표현을 보존하면서도 한국어로 덜 과도한 ‘함께 두었습니다’를 택했습니다.
theological_decisions:
- issue: ‘his fathers’의 장례적 완곡 표현을 어떻게 처리할지
  chosen_reading: ‘그의 조상들과 함께 두었습니다’로 옮겨, 단정적 매장 서술로 확대하지 않았습니다.
  alternative_readings:
  - 그의 아버지들과 함께 묻었습니다
  - 그의 조상들 곁에 안장했습니다
  rationale: 원문은 직역상 장례 문맥을 암시하지만, 실제로 ‘묻다/안장하다’를 명시하지는 않으므로 번역에서 의미를 과잉 확정하지 않는 편이 원문 충실합니다.
  doctrine_reference: source-faithfulness
