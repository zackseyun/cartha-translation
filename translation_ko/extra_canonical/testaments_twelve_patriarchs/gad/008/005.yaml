  to: 그리고 다섯 해가 지난 뒤에 그를 헤브론으로 데리고 올라가, 그의 조상들과 함께 두었습니다.
  rationale: ‘데리고 올라가’로 ἀνήγαγον의 방향성을 반영했습니다. ‘조상들과 함께 두었습니다’는 장례적 문맥을 전달하면서도 원문이 명시하지 않은 매장 방식이나 장소를 덧붙이지 않습니다. 근거 없는 각주 내용을 구성하지 않기 위해 미대응 [a] 표지는 삭제했습니다.
