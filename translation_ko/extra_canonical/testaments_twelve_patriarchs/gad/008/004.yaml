  text: And drawing up his feet, he fell asleep in peace.
translation:
  language: ko
  text: 그는 두 발을 들어 올리고 평안히 잠들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  english_pob_choice: drawing up his feet
  chosen_korean: 발을 거두어 올리고
  alternatives_korean:
  - 발을 들어 올리고
  - 발을 모으고
  lexicon: ἐξαίρω
  rationale: 동작의 핵심은 ‘발을 들어/거두어 올리다’는 의미로, 죽음 직전의 자세 변화를 자연스럽게 옮기되 원문의 구체성을 유지했습니다.
- source_word: ἐκοιμήθη
  english_pob_choice: fell asleep
  chosen_korean: 잠들었습니다
  alternatives_korean:
  - 잠이 들었습니다
  - 죽었습니다
  lexicon: κοιμάω
  rationale: 직역하면 ‘잠들다’이지만, 본문은 죽음을 완곡하게 표현한 관용으로 읽히므로 한국어도 그 뉘앙스를 살렸습니다.
- source_word: ἐν εἰρήνῃ
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화 가운데
  - 평안 가운데
  lexicon: εἰρήνη
  rationale: εἰρήνη의 상태 부사를 한국어에서 가장 자연스럽게 살려, 평정과 안전의 의미를 담은 ‘평안히’로 옮겼습니다.
theological_decisions:
- issue: 죽음을 완곡하게 표현하는 ‘잠들다’의 유지 여부
  chosen_reading: ‘잠들었습니다’로 유지하여, 단순한 수면이 아니라 평안한 죽음을 암시하게 했습니다.
  alternative_readings:
  - ‘죽었습니다’로 직접 옮김
  - ‘쉬었습니다’로 완화
  rationale: 그리스어 κoιμάω의 일반적 성격과 POB의 직역-의미 균형을 고려하면, 죽음을 노골화하기보다 본문의 관용적 표현을 살리는 것이 적절합니다.
  doctrine_reference: 성경의 죽음 완곡어법
- issue: ‘평안히’의 종말론적/윤리적 함의
  chosen_reading: ‘평안히’로 옮겨, 외적 소란이 끝난 शांत한 상태를 드러냈습니다.
  alternative_readings:
  - ‘평화 가운데’
  - ‘안식 가운데’
  rationale: 원문의 εἰρήνῃ는 단순 감정이 아니라 평정과 화해의 상태를 포함하므로, 한국어에서 그 폭을 가장 무리 없이 전달하는 표현을 선택했습니다.
  doctrine_reference: 평강/평화의 성경적 어휘
