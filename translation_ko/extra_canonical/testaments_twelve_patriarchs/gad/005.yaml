base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005.yaml
  text: '1[a]. Hatred, then, is evil, because it keeps company with falsehood continually, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.


    2. Therefore I say these things to you from experience, my children, so that you may drive out the devilish hatred and cling to the love of God. 3. Righteousness casts out hatred, and humility removes jealousy[b]. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul. 4. He does not speak against a holy man, because the fear of God dwells in him. 5. For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.


    6. These things I learned at last after I repented concerning Joseph. 7. For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the purpose toward salvation. 8. And he did not learn this from men, but through repentance he knows how to receive those who turn back.


    9. For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed. 10. For by the very things through which a man transgresses, through those he is punished. 11. Since, then, my liver lay pitilessly set against Joseph, I too, suffering in my liver[c], was judged pitilessly for ten years.'
  footnotes:
  - marker: a
    text: The words 'removes ignorance and' are textually uncertain in the Greek witness and are therefore retained in brackets.
    reason: textual_variant
  - marker: b
    text: Or 'envy' for 'jealousy' in v. 3; the Greek term can cover both hostile jealousy and envious rivalry.
    reason: lexical_alternative
  - marker: c
    text: The phrase rendered 'for ten months' is literally 'for ten times/periods'; 'months' is a contextual judgment.
    reason: alternative_reading
translation:
  language: ko
  text: '1. 그러므로 미움은 악합니다. 그것은 거짓과 끊임없이 어울리며 진리를 거슬러 말하고, 작은 것을 크게 만들며, 빛을 어둠으로 보이게 하고, 단 것을 쓰다고 말합니다. 또 중상을 가르치고, 분노와 전쟁을 일으키며, 마음을 오만과 온갖 탐욕, 온갖 악과 마귀의 독으로 가득 채웁니다.


    2. 그러므로 나의 자녀 여러분, 너희가 마귀적인 미움을 몰아내고 하나님의 사랑에 굳게 붙게 하려고, 나는 경험으로 이 일을 너희에게 말합니다. 3. 의는 미움을 내쫓고, 겸손은 질투를 없앱니다[b]. 의롭고 겸손한 사람은 부당한 일을 하는 것을 부끄러워합니다. 다른 이에게 정죄받기 때문이 아니라 자기 자신의 마음에 정죄받기 때문입니다. 주님께서 그의 영혼을 살피시기 때문입니다. 4. 그는 거룩한 사람을 헐뜯지 않습니다. 하나님을 두려워하는 마음이 그 안에 거하기 때문입니다. 5. 그는 주님을 거스르게 될까 두려워하여, 전혀, 생각으로조차 사람을 해롭게 하려 하지 않습니다.


    6. 나는 요셉에 대하여 회개한 뒤에야 마침내 이러한 것들을 알게 되었습니다. 7. 하나님께 합당한 참된 회개는 [무지를 없애고][a] 어둠을 몰아내며, 눈을 밝게 하고, 영혼에 지식을 주며, 뜻을 구원으로 이끕니다. 8. 또한 그는 이것을 사람에게서 배운 것이 아니라, 회개를 통하여 돌아오는 이들을 받아들이실 줄 아십니다.


    9. 하나님께서 내게 간의 병을 내리셨습니다. 내 아버지의 기도들이 나를 도와주지 않았더라면, 내 영은 거의 끊어졌을 것입니다. 10. 사람이 범하는 바로 그 일들로 말미암아, 그는 그 일들로 벌을 받습니다. 11. 그러므로 내 간이 요셉을 향해 무자비하게 맞서 있었으므로, 나 또한 간의 고통을 겪으며, 내가 요셉에게 격분해 있던 열 해 동안[c] 무자비하게 심판을 받았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무지를 없애고’에 해당하는 그리스어 구절은 사본 전승상 불확실하므로 대괄호로 표시하였습니다.
    reason: textual_variant
  - marker: b
    text: ‘질투’는 문맥에 따라 ‘시기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그리스어는 직역하면 ‘열 기간/때’입니다. 여기의 ‘열 해’는 문맥에 따른 번역이며, 기간의 정확한 단위는 확정하기 어렵습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: μῖσος
  english_pob_choice: hatred
  chosen_korean: 미움
  alternatives_korean:
  - 증오
  - 미움
  lexicon: LSJ
  rationale: 문맥상 악덕 목록의 추상명사이므로 한국어에서는 일상적이면서도 윤리적 무게가 있는 ‘미움’을 택했습니다.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  english_pob_choice: keeps company with falsehood continually
  chosen_korean: 거짓과 끊임없이 어울리며
  alternatives_korean:
  - 거짓과 계속 함께하며
  - 거짓에 지속적으로 사로잡히며
  lexicon: LSJ
  rationale: POB의 인격화된 표현을 살려, 미움이 거짓과 동행한다는 의인법을 한국어로 자연스럽게 옮겼습니다.
- source_word: τὸ φῶς σκότος παρέχει
  english_pob_choice: presents light as darkness
  chosen_korean: 빛을 어둠처럼 내보이고
  alternatives_korean:
  - 빛을 어둠으로 만들고
  - 빛을 어둠으로 제시하며
  lexicon: LSJ
  rationale: 원문의 역전 표현을 유지하되, 한국어에서 과장 없이 읽히는 동사로 옮겼습니다.
- source_word: συκοφαντίαν
  english_pob_choice: slander
  chosen_korean: 중상
  alternatives_korean:
  - 비방
  - 참소
  lexicon: LSJ
  rationale: 타인의 명예를 해치는 말이라는 윤리적 뉘앙스를 간결하게 살리기 위해 ‘중상’을 택했습니다.
- source_word: ὕβριν
  english_pob_choice: insolence
  chosen_korean: 오만
  alternatives_korean:
  - 거만
  - 무례
  lexicon: LSJ
  rationale: 폭력적 자만의 뜻을 한국어에서 가장 자연스럽게 드러내는 말로 ‘오만’을 사용했습니다.
- source_word: τὸ διαβούλιον
  english_pob_choice: the purpose
  chosen_korean: 뜻
  alternatives_korean:
  - 의도
  - 계획
  - 목적
  lexicon: LSJ
  rationale: 내적 결심과 방향을 짧게 드러내기 위해 ‘뜻’을 택했습니다.
theological_decisions:
- issue: 회개 μετανοία/μετανοέω의 처리
  chosen_reading: v. 6는 ‘생각을 돌이키다’로, v. 7-8의 명사형은 ‘회개’로 옮겼습니다.
  alternative_readings:
  - v. 6도 ‘회개했다’로 통일
  - 전체를 ‘마음을 바꾸다’로 통일
  rationale: 6절은 요셉에 대한 태도 변화라는 인지적 전환이 핵심이고, 7-8절은 하나님을 따른 회개의 신학적 효력을 말하므로 명사형 ‘회개’가 더 적합합니다.
  doctrine_reference: 'DOCTRINE.md: μετανοέω/μετάνοια 구분 원칙'
- issue: v. 7의 대괄호 표현
  chosen_reading: '[무지를 없애고]를 괄호 유지로 반영했습니다.'
  alternative_readings:
  - 괄호 없이 본문에 통합
  - 생략
  rationale: 원문과 POB가 모두 본문 불확실성을 표시하므로, 번역에서도 투명하게 괄호를 유지했습니다.
  doctrine_reference: 본문 비평 투명성 원칙
- issue: v. 11 χρόνους δέκα
  chosen_reading: ‘열 해’로 옮겼습니다.
  alternative_readings:
  - 열 달
  - 열 기간
  rationale: POB의 최신 판단이 ‘ten years’로 정리되어 있어, 한국어도 가장 직접적인 기간 표현인 ‘열 해’를 택했습니다.
  doctrine_reference: 최신 POB 교정 반영 원칙
