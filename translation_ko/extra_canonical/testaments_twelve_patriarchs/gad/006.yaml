base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006.yaml
  text: '1[a]. And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and with the intention of the soul.


    2. For I myself, in my father’s presence, spoke peaceably to Joseph; but when I went out from his presence, the spirit of hatred darkened my mind and disturbed my understanding so that I wanted to kill him.


    3. Love one another from the heart; and if anyone sins against you[b], speak peace to him, and in your soul hold no deceit; and if he confesses and changes his mind, forgive him.


    4. But if he denies it, do not contend with him, lest, when he swears an oath, you sin doubly.


    5. Do not let a stranger hear your secret in a quarrel, lest, hating you, he become your enemy and commit a great sin against you; for many times he either kills by treachery or entangles you in evils, having taken in from you the poison.


    6. But if he denies it and is ashamed when reproved, be still and do not reprove him further. For the one who denies it repents of having done wrong against you, so as not to wrong you again, and, being afraid, makes peace.


    7. But even if he is shameless and persists in his wrongdoing, even so forgive him from the heart[c], and leave vengeance to God.'
  footnotes:
  - marker: a
    text: Verse 3 has textual variation around 'speak peace to him' and the placement of 'in your soul hold no deceit'; the sense of peaceful address without inward guile is secure.
    reason: textual_variant
  - marker: b
    text: Verse 5 is textually difficult. The warning concerns exposing a private matter during a quarrel, which may lead the other person to hostile and treacherous action; the final image uses 'poison' metaphorically for absorbed hatred.
    reason: textual_variant
  - marker: c
    text: Some witnesses in verse 6 differ in wording around the denier’s repentance and fear, but the overall sense is that shame may lead him to cease the offense and make peace.
    reason: textual_variant
translation:
  language: ko
  text: '1[a]. 이제 내 자녀들아, 내가 너희에게 권합니다. 각 사람이 자기 이웃을 사랑하고, 너희 마음에서 미움을 제거하십시오. 행위와 말과 영혼의 뜻으로 서로 사랑하십시오.


    2. 나는 내 아버지 앞에서 요셉에게 평화롭게 말했습니다. 그러나 그분 앞에서 나가자 미움의 영이 내 마음을 어둡게 하고 내 이해를 흔들어, 내가 그를 죽이고 싶어졌습니다.


    3. 서로를 마음으로부터 사랑하십시오. 그리고 누구든지 너에게 죄를 지으면[b] 그에게 평화를 말하고, 네 영혼에는 속임수를 품지 마십시오. 그가 고백하고 마음을 돌이키면, 그를 용서하십시오.


    4. 그러나 그가 부인하면, 그와 다투지 마십시오. 맹세할 때 너희가 두 배로 죄를 짓게 될까 합니다.


    5. 분쟁 중에 낯선 사람이 너희 비밀을 듣게 하지 마십시오. 그가 너희를 미워하여 너희의 원수가 되고, 너희에게 큰 죄를 저지를까 합니다. 그는 여러 번 배신으로 사람을 죽이거나, 너희에게서 그 독을 받아 너희를 악에 얽어맵니다.


    6. 그러나 그가 부인하고 책망받을 때 부끄러워하면, 잠잠하고 더 이상 그를 책망하지 마십시오. 부인하는 이는 너희에게 저지른 잘못을 고침으로써 다시는 너희에게 잘못하지 않으려 하고, 두려워하여 평화를 이룹니다.


    7. 그러나 그가 뻔뻔하고 자기 잘못을 고집하더라도, 그럼에도 마음으로부터 그를 용서하고, 복수는 하나님께 맡기십시오.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραινῶ
  english_pob_choice: I urge
  chosen_korean: 권합니다
  alternatives_korean:
  - 권면합니다
  - 촉구합니다
  lexicon: LSJ
  rationale: 테스타멘트 문맥의 훈계적 권고를 살리면서도 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: τὸν πλησίον
  english_pob_choice: neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 가까운 사람
  - 이웃 사람
  lexicon: BDAG
  rationale: 윤리적 관계를 가리키는 기본 대응어로서 문맥상 가장 분명합니다.
- source_word: ἕκαστος ... ἀγαπᾶτε / τὸ μῖσος
  english_pob_choice: love ... remove hatred
  chosen_korean: 사랑하십시오 / 미움을 제거하십시오
  alternatives_korean:
  - 사랑하십시오 / 미움을 내쫓으십시오
  - 사랑하십시오 / 미움을 없애십시오
  lexicon: LSJ
  rationale: ‘제거하다’는 단순 감정 억제가 아니라 마음에서 미움을 분리해 버리는 강한 동작을 드러냅니다.
- source_word: διανοίᾳ ψυχῆς
  english_pob_choice: with the intention of the soul
  chosen_korean: 영혼의 뜻으로
  alternatives_korean:
  - 영혼의 의도로
  - 영혼의 마음가짐으로
  lexicon: LSJ
  rationale: 겹겹의 내면성을 유지하면서도 한국어에서 과도하게 낯설지 않게 표현했습니다.
- source_word: ἐξερχόμενος ... τὸ πνεῦμα τοῦ μίσους ἐσκότιζέ μου τὸν νοῦν καὶ ἐτάρασσέ μου τὸν λογισμόν
  english_pob_choice: the spirit of hatred darkened my mind and disturbed my understanding
  chosen_korean: 미움의 영이 내 마음을 어둡게 하고 내 이해를 흔들어
  alternatives_korean:
  - 미움의 영이 내 마음을 어둡게 하고 내 생각을 어지럽혀
  - 미움의 영이 내 ذهن을 어둡게 하고 내 판단을 흔들어
  lexicon: BDAG
  rationale: νοῦς와 λογισμός의 차이를 ‘마음’과 ‘이해’로 구분해, 내적 판단의 어둠과 동요를 함께 살렸습니다.
- source_word: εἰπὲ αὐτῷ εἰρήνην
  english_pob_choice: speak peace to him
  chosen_korean: 그에게 평화를 말하고
  alternatives_korean:
  - 그에게 평화를 말하십시오
  - 그에게 평안이라고 말하십시오
  lexicon: LSJ
  rationale: 셈어적 축복/화해의 공식을 한국어로 직역에 가깝게 옮겼습니다.
- source_word: μετανοήσας
  english_pob_choice: changes his mind
  chosen_korean: 마음을 돌이키면
  alternatives_korean:
  - 회개하면
  - 생각을 바꾸면
  lexicon: BDAG
  rationale: 이 문맥에서는 죄의 자각과 적대적 태도의 전환을 가리키므로, 교리적 과잉을 피하면서도 방향 전환을 드러내는 표현을 택했습니다.
- source_word: ἐν τῇ ψυχῇ σου μὴ κρατήσῃς δόλον
  english_pob_choice: in your soul hold no deceit
  chosen_korean: 네 영혼에는 속임수를 품지 마십시오
  alternatives_korean:
  - 네 영혼에 속임수를 품지 마십시오
  - 네 마음에 간계를 지니지 마십시오
  lexicon: BDAG
  rationale: ‘품다’는 내부에 숨겨 두는 뉘앙스를 살려, 겉말과 속셈의 분리를 분명히 합니다.
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  english_pob_choice: leave vengeance to God
  chosen_korean: 복수는 하나님께 맡기십시오
  alternatives_korean:
  - 보복은 하나님께 맡기십시오
  - 원수 갚음은 하나님께 맡기십시오
  lexicon: BDAG
  rationale: 문맥상 인간의 보복을 내려놓고 하나님의 심판에 맡기라는 뜻이므로, 현대 한국어에서 가장 직접적인 표현을 사용했습니다.
theological_decisions:
- issue: 'μετανοήσας의 처리: 회개 vs 마음을 돌이키다'
  chosen_reading: 마음을 돌이키면
  alternative_readings:
  - 회개하면
  - 뉘우치면
  rationale: 이 절은 대인 관계 속에서 잘못을 인정하고 태도를 바꾸는 맥락이므로, 회개의 교리어를 자동 대입하기보다 변화된 방향성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: μετανοέω → context-sensitive, often ''change one''s mind'' in interpersonal admonition'
- issue: 'ἐκδίκησις의 처리: 복수 vs 보복 vs 원수 갚음'
  chosen_reading: 복수는 하나님께 맡기십시오
  alternative_readings:
  - 보복은 하나님께 맡기십시오
  - 원수 갚음은 하나님께 맡기십시오
  rationale: 본문은 인간의 응징을 포기하고 하나님께 맡기는 윤리를 말하므로, 단어 선택에서 그 긴장을 분명히 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: preserve ethical/theological tension; do not domesticate retributive language'
