base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004.yaml
  text: Therefore guard yourselves[a], my children, from hatred, because it works lawlessness even against the Lord himself. For it does not want to hear the words of his commandments concerning love of one's neighbor, and it sins against God. For if a brother falls, it is eager at once to report it to everyone, and it hastens that he may be judged and punished and die. And if it is some slave, it brings accusations against him before his master, and in every distress it rejoices over him, if perhaps he may be put to death. For hatred works together with envy also against those who prosper; hearing of their success and seeing it, it is always weakened. Just as love would even make the dead alive and would call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned only a little to live. For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through
    longsuffering[c][b], works together with the law of God for the salvation of men.
  footnotes:
  - marker: a
    text: Or 'it informs on him to his master.' The Greek expression can suggest hostile denunciation before an authority.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'those who have sinned only a little' may also be rendered 'those who have sinned in a small matter.'
    reason: lexical_alternative
  - marker: c
    text: '''Faintheartedness'' translates a term that can also suggest smallness of soul, discouragement, or cowardice.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나의 자녀들아, 미움을 경계하십시오. 미움은 주님 자신에게까지도 불법을 행하기 때문입니다. 미움은 이웃 사랑에 관하여 그분께서 주신 계명의 말씀을 들으려 하지 않으며, 하나님께 죄를 짓습니다. 형제가 넘어지면, 미움은 그가 넘어졌다는 일을 곧바로 모든 사람에게 알리려 하며, 그가 심판을 받고 벌을 받아 죽게 하려고 서두릅니다. 또 어떤 사람이 노예이면, 미움은 그를 그의 주인에게 고발하며[a], 그의 온갖 곤경을 두고 기뻐합니다. 그가 혹시 죽임을 당할까 하기 때문입니다. 미움은 시기와 함께 잘되는 사람들을 거슬러 일합니다. 그들이 잘되는 것을 듣고 볼 때마다 언제나 쇠약해집니다. 사랑이 죽은 이들까지도 살리려 하며 사형 선고 아래 있는 이들까지도 다시 불러내려 하는 것처럼, 미움도 살아 있는 이들을 죽이려 하며, 작은 일에서 죄를 지은 이들이 살기를 원하지 않습니다[b]. 미움의 영은 마음의 연약함을 통하여[c] 모든 일에서 사탄과 함께 일하여 사람들을 죽음에 이르게 하지만, 사랑의 영은 오래 참음으로 하나님의 율법과 함께 일하여 사람들의 구원을 위하여 일합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 그의 주인에게 불리하게 말하며” 또는 “그를 그의 주인에게 밀고하며.” 그리스어 표현은 권위자 앞에서 적대적으로 고발하거나 비난하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “조금 죄를 지은 이들.” 그리스어는 죄의 정도를 가리킬 수도, 작은 사안에서 지은 죄를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: “마음의 연약함”으로 옮긴 말은 문자적으로 ‘작은 영혼’을 뜻하며, 낙심이나 소심함, 비겁함을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλάξασθε... ἀπὸ τοῦ μίσους
  english_pob_choice: guard yourselves ... from hatred
  chosen_korean: 미움을 조심하십시오
  alternatives_korean:
  - 미움으로부터 자신을 지키십시오
  - 미움을 경계하십시오
  lexicon: LSJ
  rationale: φυλάσσω의 경계·보호 뉘앙스를 살리되, 한국어로는 자연스럽게 ‘조심하다’보다 ‘경계하다/지키다’가 가능하지만 문맥상 경고의 실천성을 살려 간결하게 옮겼습니다.
- source_word: ἀνομίαν ποιεῖ
  english_pob_choice: works lawlessness
  chosen_korean: 불법을 행합니다
  alternatives_korean:
  - 무법을 행합니다
  - 불법을 일으킵니다
  lexicon: LSJ
  rationale: ποιεῖ는 단순히 ‘한다’보다 행위의 실행을 나타내므로 ‘행하다’로 옮겼고, ἀνομία는 율법/질서에 대한 위반을 가리켜 ‘불법’으로 번역했습니다.
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  english_pob_choice: brings accusations against him before his master
  chosen_korean: 그를 주인에게 고발하며
  alternatives_korean:
  - 그를 주인 앞에 세우며
  - 그를 주인에게 불리하게 말하며
  lexicon: LSJ
  rationale: συμβάλλω의 적대적 제소·고발 의미를 살려, 단순 전달이 아니라 해를 끼치려는 행위를 드러내는 ‘고발하다’를 택했습니다.
- source_word: δοῦλός τις
  english_pob_choice: slave
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  lexicon: LSJ
  rationale: 명시적 소유·지배 관계를 드러내는 본문이므로, 프로젝트 기준에 따라 ‘종’보다 사회적 구속 상태를 더 분명히 드러내는 ‘노예’를 사용했습니다.
- source_word: ὀλιγοψυχίας
  english_pob_choice: faintheartedness
  chosen_korean: 마음이 약해짐
  alternatives_korean:
  - 소심함
  - 낙담
  lexicon: LSJ
  rationale: 원어는 ‘작은 영혼/기운 빠짐’의 뜻을 함께 지니므로, 단일 심리어로 고정하기보다 약화·위축의 상태를 드러내는 표현으로 옮겼습니다.
- source_word: μακροθυμίᾳ
  english_pob_choice: longsuffering
  chosen_korean: 오래 참음
  alternatives_korean:
  - 인내
  - 관용
  lexicon: LSJ
  rationale: 윤리적 덕목으로서의 오래 견딤과 참아 줌을 담기 위해 한국어 성경 문맥에서 자연스러운 ‘오래 참음’을 선택했습니다.
theological_decisions:
- issue: 미움과 사랑의 인격화된 힘의 유지
  chosen_reading: 미움과 사랑을 단순 감정이 아니라 사람들을 움직이는 도덕적·영적 힘으로 번역했습니다.
  alternative_readings:
  - 단순한 심리 상태로 축소
  - 수사적 비유를 약화
  rationale: 본문은 ‘미움의 영’과 ‘사랑의 영’으로 나아가므로, 앞부분에서도 그 작동성을 살려 읽도록 해야 본문의 윤리적·영적 긴장이 보존됩니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: ‘죽은 자들까지 살리려 한다’는 표현의 범위
  chosen_reading: 사랑의 생명 부여 언어는 실제 부활 교리의 진술이 아니라 강한 윤리적 과장으로 옮겼습니다.
  alternative_readings:
  - 직접적 기적 진술로 번역
  - 완화하여 단순한 도움으로 축소
  rationale: 원문은 사랑의 성향을 극대화하는 지혜문학적·유언적 수사이므로, 한국어도 그 강도를 유지하되 교리적 단정으로 오해되지 않게 했습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
