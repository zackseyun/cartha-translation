revisions:
- from: 그러므로 나의 자녀들아, 미움을 조심하십시오. 그것은 주님 자신에게까지도 불법을 행하기 때문입니다. 그것은 이웃 사랑에 관한 그분의 명령들의 말을 들으려 하지 않으며, 하나님께 죄를 범합니다. 형제가 넘어지면, 그것을 곧바로 모든 사람에게 알리기를 서두르고, 그가 심판받고 벌받아 죽게 하려고 재촉합니다. 또 어떤 사람이 노예라면, 그를 주인에게 고발하며, 온갖 곤경 속에서도 그를 보고 기뻐하니, 혹시 그가 죽임을 당할지도 모르기 때문입니다. 미움은 시기와도 함께 일하여, 잘되는 사람들을 거슬러 일합니다. 그들의 진전의 소리를 듣고 보고도 언제나 약해집니다. 사랑이 죽은 자들까지도 살리려 하고 사형 선고를 받은 자들까지도 다시 불러내려 하는 것처럼, 미움도 살아 있는 자들을 죽이려 하고, 작은 일에서 죄를 지은 자들까지도 살게 하려 하지 않습니다. 미움의 영은 마음이 약해짐을 통해 모든 일에서 사탄과 함께 일하여 사람들의 죽음을 이루지만, 사랑의 영은 오래 참음으로 하나님의 율법과 함께 일하여 사람들의 구원을 이룹니다.[a][b]
