    rationale: περισπασμός는 산만함뿐 아니라 번거로움·마음을 빼앗김을 뜻합니다. ‘헛된 사람들로 인한 번거로움’이 자연스럽고 원문의 부정적 사회적 얽매임을 보존합니다.
