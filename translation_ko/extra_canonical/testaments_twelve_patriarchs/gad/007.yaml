  text: 1[a]. But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be brought to completion. For in this way it is to your advantage. 2. And if he is exalted still more[b], do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who gives good and profitable things to all people. 3. Examine the judgments of the Lord, and your purpose will be illumined and be at rest. 4. But if someone grows rich through evil, like Esau my father's brother, do not be jealous; rather, wait for the appointed limit of the Lord. 5. For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment. 6. For the poor man, if being free from envy in all things he is pleasing to the Lord, is richer than all, because he does not have the distraction of vain people. 7. Therefore cast out hatred from your souls[d][c], and love one another in deed and in word and in the
    disposition of your soul.
  footnotes:
  - marker: a
    text: Or 'that he may be perfected' for 'that he may be brought to completion.'
    reason: lexical_alternative
  - marker: b
    text: '''The appointed limit of the Lord'' may also be understood as ''the fixed time'' or ''the decree'' of the Lord.'
    reason: lexical_alternative
  - marker: c
    text: Or 'age-long punishment' for 'eternal punishment.'
    reason: alternative_reading
  - marker: d
    text: The Greek line after 'love one another' is cut off in the surviving OCR excerpt; the closing phrase is supplied in continuity with the extant wording and the chapter's exhortational flow.
    reason: textual_variant
translation:
  language: ko
  text: '만일 누군가 여러분보다 더 잘되더라도 슬퍼하지 마십시오. 오히려 그를 위해, 그가 온전하게 되도록 기도하십시오[a]. 그렇게 하는 것이 여러분에게 유익합니다.


    또 그가 더욱 높아지더라도 그를 시기하지 마십시오. 모든 육체는 죽을 것을 기억하십시오. 그러나 모든 사람에게 좋은 것과 유익한 것을 주시는 주님께 찬송을 드리십시오.


    주님의 심판을 살피십시오. 그러면 여러분의 뜻이 밝아지고 평안해질 것입니다.


    그러나 누군가 내 아버지의 형제 에서처럼 악하게 부자가 되더라도 질투하지 마십시오. 주님께서 정하신 한도를 기다리십시오[b].


    주님께서는 재앙을 통해 그것들을 거두어 가시기도 하고, 회개한 사람을 용서하시기도 하시며, 회개하지 않는 사람은 영원한 형벌을 받도록 남겨 두십니다[c][d].


    가난한 사람이라도 모든 일에서 시기하지 않고 주님을 기쁘시게 하면 모든 사람보다 더 부유합니다. 그는 헛된 사람들로 인한 번거로움이 없기 때문입니다.


    그러므로 여러분의 영혼에서 미움을 버리고, 마음의 올곧음으로 서로 사랑하십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 완전하게 되도록’ 또는 ‘그가 완성되도록’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님께서 정하신 한도’는 ‘주님의 정하신 때’ 또는 ‘주님의 결정’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘시대에 걸친 형벌’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 이 절의 그리스어는 동사들의 주어와 연결이 다소 난해합니다. 번역은 문맥에 따라 주님이 악하게 얻은 재물을 거두시고 회개한 이를 용서하시며, 회개하지 않는 이는 형벌에 남겨 두신다는 병렬을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: τελειωθῇ
  english_pob_choice: be brought to completion
  chosen_korean: 온전하게 되게 하십시오
  alternatives_korean:
  - 완전하게 되게 하십시오
  - 완성되게 하십시오
  - 성숙하게 되게 하십시오
  lexicon: LSJ
  rationale: 단순히 성공이 지속된다는 뜻보다, 하나님 앞에서 한 사람의 상태가 완결되는 뉘앙스를 살리기 위해 '온전하게'를 선택했습니다.
- source_word: συμφέρον
  english_pob_choice: to your advantage
  chosen_korean: 유익합니다
  alternatives_korean:
  - 여러분에게 이롭습니다
  - 여러분의 이익이 됩니다
  - 여러분에게 유리합니다
  lexicon: LSJ
  rationale: 권면의 이유를 자연스럽게 설명하면서도, 소문자 수준의 도덕적·실용적 이익이라는 의미를 유지하기 위해 '유익'으로 옮겼습니다.
- source_word: πᾶσα σὰρξ
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 모든 육신
  - 모든 혈육
  lexicon: LSJ
  rationale: 죽음의 보편성을 드러내는 관용구이므로, 인류 일반으로 풀기보다 직역에 가까운 '모든 육체'를 유지했습니다.
- source_word: ὅρον Κυρίου
  english_pob_choice: the appointed limit of the Lord
  chosen_korean: 주님의 정해진 한계
  alternatives_korean:
  - 주님의 정한 때
  - 주님의 경계
  - 주님의 결정
  lexicon: LSJ
  rationale: 문맥상 악인의 번영에 대해 하나님이 정하신 경계와 한도를 기다리라는 뜻이므로, '한계'로 경계성과 예정성을 함께 살렸습니다.
- source_word: αἰωνίαν κόλασιν
  english_pob_choice: eternal punishment
  chosen_korean: 영원한 형벌
  alternatives_korean:
  - 영원한 벌
  - 영속하는 형벌
  - 세세한 형벌
  lexicon: LSJ
  rationale: κόλασις의 징벌 의미를 분명히 하되, 한국어로도 가장 직접적인 대응인 '형벌'을 택했습니다.
- source_word: μῖσος
  english_pob_choice: hatred
  chosen_korean: 미움
  alternatives_korean:
  - 증오
  - 원한
  - 혐오
  lexicon: LSJ
  rationale: 권면의 결론에서 사랑과 대조되는 내적 정서를 자연스럽게 드러내기 위해 표준어 '미움'을 선택했습니다.
theological_decisions:
- issue: 회개의 결과와 용서의 조건 표현
  chosen_reading: '''그가 회개하면 용서받습니다''로 옮겨, 회개와 용서의 연결을 분명히 했습니다.'
  alternative_readings:
  - 그가 돌이키면 용서받습니다
  - 그가 뉘우치면 용서받습니다
  rationale: 본문은 악한 취득이 제거되거나 회개가 있을 때 용서가 임하는 구조를 말합니다. 한국어에서도 회개의 도덕적 전환성과 용서의 실제를 함께 드러내야 합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: '''주님''의 표기'
  chosen_reading: κυρίῳ를 일관되게 '주님'으로 옮겨 예배적·권면적 호칭을 유지했습니다.
  alternative_readings:
  - 주께
  - 주에게
  rationale: 이 장 전체는 지혜권면과 경건한 권유의 어조를 띠므로, 한국어 독자가 자연스럽게 주님께 드리는 찬송과 순종으로 읽도록 '주님'을 사용했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
