- from: 만일 누군가 여러분보다 더 잘되더라도 슬퍼하지 마십시오. 오히려 그를 위해 기도하여 그가 온전하게 되게 하십시오[a]. 그렇게 하는 것이 여러분에게 유익합니다. 또 그가 더욱 높아지더라도 그를 시기하지 마십시오. 모든 육체는 죽을 것을 기억하십시오. 그러나 주님께 찬송을 드리십시오. 주님은 모든 사람에게 좋은 것과 유익한 것을 주시는 분입니다. 주님의 판단을 살피십시오. 그러면 여러분의 뜻이 비추어지고 평안해질 것입니다. 그러나 누군가 악으로 부자가 되더라도—내 아버지의 형제 에서처럼—질투하지 마십시오. 주님의 정해진 한계를 기다리십시오[b]. 그 악한 일로부터 빼앗긴 것이 그에게서 거두어지거나, 그가 회개하면 용서받습니다. 그러나 그가 회개하지 않으면 영원한 형벌을 받도록 보존됩니다[c]. 가난한 사람은 모든 일에서 질투 없이 주님을 기쁘시게 하면 모든 사람보다 더 부유합니다. 왜냐하면 그는 헛된 사람들의 산만함을 가지고 있지 않기 때문입니다. 그러므로 여러분의 영혼에서 미움을 버리고, 마음의 올곧음 안에서 서로 사랑하십시오.
