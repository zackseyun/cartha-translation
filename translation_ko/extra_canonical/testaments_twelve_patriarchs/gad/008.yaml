base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008.yaml
  text: 'Say these things[a], you also, to your children:


    that they honor Levi and Judah; for from them the Lord will raise up salvation for Israel.

    And tell them concerning Joseph, that they should love him, because in every affliction he was innocent,

    and he kept the commandment of God, not returning evil for evil.

    For he suffered much from his brothers, yet he loved them,

    and though they plotted against him, he spoke peaceably to them.


    And now, my children, I command you: love one another from the heart,

    and if anyone sins against you, speak peaceably to him, and in your soul hold no deceit;

    and if he confesses and repents, forgive him.

    But if he denies it, do not become heated in argument with him,

    lest, after taking in poison[b], he begin to swear and so commit a double sin.

    If anyone prospers beyond you, do not be grieved;

    but pray also for him, that he may be made complete in every good thing.


    If anyone is glorified, do not envy him;

    if anyone is enriched, do not be jealous.

    Bless the Lord who gives good things to all,

    because the poor man, if he is free from envy, is rich before the Lord.

    Do not hate a beautiful woman because of her appearance,

    and do not hate a man because of the abundance of his glory.

    For God gives the good things of the earth to whom he wills.


    Seek uprightness in your own works,

    and pray for your neighbor, so that if he prospers in every good thing, you may not be jealous.

    For the one who is jealous is always in turmoil,

    and the one who hates is always darkened.

    Love one another in deed and in word and in the intention of the soul.

    For I also spoke peaceably with Joseph, but in my heart I intended to kill him.

    The spirit of hatred is evil, because it is never at peace with men;

    it always desires their downfall.

    It weakens the body and disturbs the soul,

    and it puts wrath upon the mind.


    Therefore, if anyone does evil to you, do good to him,

    and pray for him; and you will be redeemed by the Lord from every evil.

    For if anyone prospers, and if he is shameless or lawless, do not be jealous;

    but wait for the end from the Lord.

    For either he receives his reward in this life,

    or, if he is kept for punishment, he will be repaid in the judgment.

    And if a poor man prospers and is without envy, even if he is not rich,

    he is blessed beyond all men, because he has the treasure that does not perish.

    Therefore cast away hatred[c], and love one another in uprightness of heart.'
  footnotes:
  - marker: a
    text: '''Honor Levi and Judah'' likely reflects the traditional prominence of priestly and royal lines in Israel; the wording is left broad rather than narrowed to one later interpretation.'
    reason: cross_reference
  - marker: b
    text: Or 'do not argue heatedly with him.' The image that follows suggests that contentious dispute can lead the other person into compounded guilt.
    reason: lexical_alternative
  - marker: c
    text: '''Wait for the end from the Lord'' may mean await the final outcome the Lord assigns, whether in this life or in judgment.'
    reason: lexical_alternative
translation:
  language: ko
  text: '이런 말들을 너희도 너희 자녀들에게 말하여,


    그들이 레위와 유다를 존중하게 하십시오. 왜냐하면 그들로부터 주께서 이스라엘에게 구원을 일으키실 것이기 때문입니다.

    그리고 요셉에 대하여 그들에게 말하여, 그들이 그를 사랑하게 하십시오. 그는 모든 환난 가운데서도 결백했고,

    하나님의 명령을 지키며 악으로 악을 갚지 않았습니다.

    그는 형제들에게서 많은 고난을 받았으나 그들을 사랑했고,

    그들이 그를 해치려 꾸몄음에도 그들에게 평화롭게 말했습니다.


    이제 내 자녀들아, 내가 너희에게 명령합니다. 마음에서 서로 사랑하십시오.

    누구든지 너희에게 죄를 짓거든 그에게 평화롭게 말하고, 너희 영 안에 속임수를 품지 마십시오.

    그가 자백하고 회개하면 그를 용서하십시오.

    그러나 그가 부인하거든, 그와 논쟁하며 격해지지 마십시오.

    그렇지 않으면, 독을 들인 뒤에 그는 맹세하기 시작하여 이중의 죄를 짓게 될지도 모릅니다.

    누구든지 너희보다 더 잘되더라도 슬퍼하지 말고;

    그를 위해서도 기도하여, 그가 모든 좋은 것에서 온전하게 되게 하십시오.


    누구든지 영광을 받더라도 그를 시기하지 말고;

    누구든지 부유해지더라도 질투하지 마십시오.

    모든 사람에게 좋은 것들을 주시는 주를 찬송하십시오.

    가난한 사람은 시기에서 자유롭다면 주 앞에서 부자이기 때문입니다.

    아름다운 여인을 그 외모 때문에 미워하지 말고,

    영광의 풍성함 때문에 사람을 미워하지도 마십시오.

    하나님께서는 땅의 좋은 것들을 그분이 원하시는 이에게 주십니다.


    너희 자신의 일에서 올바름을 추구하고,

    이웃을 위해 기도하십시오. 그리하여 그가 모든 좋은 것에서 잘되더라도 너희가 시기하지 않게 하려는 것입니다.

    시기하는 사람은 늘 소란스러우며,

    미워하는 사람은 늘 어두워지기 때문입니다.

    행동과 말로, 그리고 영의 뜻으로 서로 사랑하십시오.

    나도 요셉에게 평화롭게 말했지만, 내 마음으로는 그를 죽이려 했습니다.

    증오의 영은 악합니다. 그것은 사람들과 결코 평화롭지 않으며,

    늘 그들의 몰락을 바랄 뿐입니다.

    그것은 몸을 약하게 하고 영을 어지럽히며,

    마음에 분노를 불어넣습니다.


    그러므로 누구든지 너희에게 악을 행하거든 그에게 선을 행하고,

    그를 위해 기도하십시오. 그러면 너희는 주께서 모든 악에서 구속하실 것입니다.

    누구든지 잘되고, 또 수치심이 없거나 율법을 어기는 자라 해도 시기하지 말고;

    주에게서 오는 끝을 기다리십시오.

    그는 이 생에서 자기 상을 받든지,

    아니면 형벌을 위해 남겨진 경우 심판 때에 보응을 받게 될 것입니다.

    가난한 사람이 잘되고 시기함이 없으면, 비록 부유하지 않더라도,

    그는 모든 사람보다 복됩니다. 썩지 않는 보물을 가지고 있기 때문입니다.

    그러므로 증오를 버리고, 마음의 올바름 안에서 서로 사랑하십시오.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιμᾶν
  english_pob_choice: honor
  chosen_korean: 존중하다
  alternatives_korean:
  - 공경하다
  - 존귀하게 여기다
  lexicon: LSJ
  rationale: 부모-자녀를 향한 언약적 존중의 뜻을 살리되, 제의적 숭배로 좁히지 않기 위해 ‘존중하다’를 택했습니다.
- source_word: σωτηρία
  english_pob_choice: salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 해방
  lexicon: BDAG
  rationale: 예언적 문맥에서 하나님의 구원 행위를 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: ἄκακος
  english_pob_choice: innocent
  chosen_korean: 결백한
  alternatives_korean:
  - 순진한
  - 해가 없는
  lexicon: LSJ
  rationale: 요셉의 윤리적 무죄성을 드러내는 말로 ‘결백한’이 가장 적절합니다.
- source_word: εἰρηνεύειν / εἰρηνικῶς λαλεῖν
  english_pob_choice: speak peaceably
  chosen_korean: 평화롭게 말하다
  alternatives_korean:
  - 평화롭게 이야기하다
  - 화평하게 말하다
  lexicon: LSJ
  rationale: 대립을 부추기지 않는 적극적 화해의 말하기를 현대 한국어로 자연스럽게 표현했습니다.
- source_word: δόλος
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 간계
  - 기만
  lexicon: BDAG
  rationale: 마음 안의 이중성을 분명히 드러내면서도 문장이 과도하게 격식화되지 않도록 했습니다.
- source_word: θερμαίνεσθαι
  english_pob_choice: become heated
  chosen_korean: 격해지다
  alternatives_korean:
  - 달아오르다
  - 격앙되다
  lexicon: LSJ
  rationale: 논쟁이 고조되는 동작을 간결하게 살렸습니다.
- source_word: φάρμακον
  english_pob_choice: poison
  chosen_korean: 독
  alternatives_korean:
  - 독약
  - 독성
  lexicon: LSJ
  rationale: 논쟁이 내면에 해로운 것을 들이붓는다는 비유를 한국어에서도 직관적으로 전달했습니다.
- source_word: φθονεῖν / λυπεῖσθαι
  english_pob_choice: be jealous / be grieved
  chosen_korean: 시기하다 / 슬퍼하다
  alternatives_korean:
  - 질투하다 / 마음 아파하다
  lexicon: BDAG
  rationale: 남의 번영에 대한 경쟁적 감정을 구별해 번역했습니다.
- source_word: τελειωθῇ
  english_pob_choice: be made complete
  chosen_korean: 온전하게 되다
  alternatives_korean:
  - 완전하게 되다
  - 충만하게 되다
  lexicon: BDAG
  rationale: 선한 것의 결핍 없는 충만함을 한국어 성서어감으로 자연스럽게 살렸습니다.
- source_word: δοξάζεσθαι
  english_pob_choice: is glorified
  chosen_korean: 영광을 받다
  alternatives_korean:
  - 영예를 얻다
  - 존귀하게 되다
  lexicon: BDAG
  rationale: 외부로부터 부여되는 높은 명예의 의미를 반영했습니다.
- source_word: εὐθύτης
  english_pob_choice: uprightness
  chosen_korean: 올바름
  alternatives_korean:
  - 정직
  - 바름
  lexicon: LSJ
  rationale: 행위의 곧음과 도덕적 정직성을 함께 담기 위해 ‘올바름’을 선택했습니다.
- source_word: διάνοια / ἐπίνοια ψυχῆς
  english_pob_choice: intention of the soul
  chosen_korean: 영의 뜻
  alternatives_korean:
  - 영혼의 의도
  - 마음의 뜻
  lexicon: LSJ
  rationale: 원문의 내적 의도성을 살리면서도 한국어에서 과도하게 추상화되지 않도록 했습니다.
- source_word: λυτροῦσθαι
  english_pob_choice: be redeemed
  chosen_korean: 구속하다
  alternatives_korean:
  - 속량하다
  - 구원하다
  lexicon: BDAG
  rationale: 주께서 악에서 건져 내시는 구속의 의미를 유지했습니다.
theological_decisions:
- issue: 레위와 유다를 ‘존중’하게 하라는 권면과 그들에게서 주의 구원이 일어난다는 예언
  chosen_reading: 언약적 존중과 장차의 구원을 함께 살리되, 특정 후대 해석으로 좁히지 않았습니다.
  alternative_readings:
  - 레위를 제사장적으로, 유다를 왕권적으로 존귀하게 여기게 하다
  - 그들로부터 해방이 일어나게 하다
  rationale: 본문은 족장 유언의 예언적 긴장을 유지하므로, 한국어에서도 넓은 의미를 남겨 두는 편이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 악에 대한 보복 금지와 회개·용서의 순서
  chosen_reading: 자백과 회개가 있을 때 용서하되, 부인하는 경우는 논쟁의 격화를 피하라고 옮겼습니다.
  alternative_readings:
  - 사과하면 용서하라
  - 인정하면 용서하라
  rationale: 회개를 단순한 감정 변화로 축소하지 않고, 관계 회복의 윤리로 제시하는 문맥을 반영했습니다.
  doctrine_reference: DOCTRINE.md on μετανοέω
