base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/001.yaml
  text: 'And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, children, by the spirit of hatred, because it is evil in all the deeds of men.'
translation:
  language: ko
  text: 이제 진리의 말을 들으십시오. 의를 행하고 지극히 높으신 분의 모든 율법을 지키기 위해 들으십시오. 그리고 자녀들이여, 미움의 영에 미혹되지 마십시오. 그것은 사람들이 하는 모든 일에 악하게 작용하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε λόγον ἀληθείας
  english_pob_choice: hear a word of truth
  chosen_korean: 진리의 말을 들으십시오
  alternatives_korean:
  - 진리의 말씀을 들으십시오
  - 진리의 한 말을 들으십시오
  lexicon: ἀκούσατε; λόγον; ἀληθείας
  rationale: λόγος는 문맥상 단순한 '말'로도 충분히 전달되며, 예언적 훈계의 직접성을 살려 '진리의 말'로 옮겼습니다.
- source_word: δικαιοσύνην
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 의로움의 길
  lexicon: δικαιοσύνη
  rationale: 이 전승에서 반복되는 도덕·언약적 표준을 표준적인 성경 번역어 '의'로 유지했습니다.
- source_word: νόμον ὑψίστου
  english_pob_choice: every law of the Most High
  chosen_korean: 지극히 높으신 분의 모든 율법
  alternatives_korean:
  - 지극히 높으신 이의 모든 법
  - 가장 높으신 분의 모든 율법
  lexicon: νόμος; ὕψιστος
  rationale: νόμος는 토라/규범의 종교적 의미가 강하므로 '율법'으로, ὕψιστος는 하나님의 칭호로 자연스러운 '지극히 높으신 분'을 택했습니다.
- source_word: τῷ πνεύματι τοῦ μίσους
  english_pob_choice: the spirit of hatred
  chosen_korean: 미움의 영
  alternatives_korean:
  - 증오의 영
  - 미움의 영들
  lexicon: πνεῦμα; μῖσος
  rationale: πνεῦμα의 단수성과 소유격 연결을 살려, 추상적 성향이 아니라 실제로 사람을 이끄는 '미움의 영'으로 직역했습니다.
theological_decisions:
- issue: children address without possessive pronoun
  chosen_reading: ‘자녀들아’로 옮겨, 그리스어에 없는 1인칭 소유를 덧붙이지 않았습니다.
  alternative_readings:
  - 내 자녀들아
  - 얘들아
  rationale: 영어 POB 수정이 보여 주듯 소유격 'my'는 본문에 없으므로 삭제해야 하며, 호칭의 친밀성과 권면성을 유지하는 데 '자녀들아'가 적절합니다.
  doctrine_reference: 본문 비평/직역 원칙
- issue: Most High as divine title
  chosen_reading: ‘지극히 높으신 분’으로 옮겨 하나님을 가리키는 칭호로 처리했습니다.
  alternative_readings:
  - 지극히 높으신 이
  - 가장 높으신 분
  rationale: 유대교적 경건 언어에서 ὕψιστος는 하나님의 호칭으로 기능하므로, 인격적 존칭을 살린 번역이 자연스럽습니다.
  doctrine_reference: 하나님의 칭호
