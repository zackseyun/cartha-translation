revisions:
- from: 이제 진리의 말을 들으십시오. 의를 행하고 지극히 높으신 분의 모든 율법을 지키기 위해 들으십시오. 또 미움의 영에 이끌려 미혹되지 마십시오, 자녀들아. 그것은 사람의 모든 행위에 대해 악하기 때문입니다.
  to: 이제 진리의 말을 들으십시오. 의를 행하고 지극히 높으신 분의 모든 율법을 지키기 위해 들으십시오. 그리고 자녀들이여, 미움의 영에 미혹되지 마십시오. 그것은 사람들이 하는 모든 일에 악하게 작용하기 때문입니다.
  rationale: The revision removes Korean redundancy, regularizes the formal address, and makes the final causal clause idiomatic. It preserves the source’s imperative sequence, the absence of a first-person possessive before ‘children,’ and the broad, non-specific claim that the spirit of hatred is evil in relation to all human deeds.
  reviewer_model: gpt-5.6-terra
