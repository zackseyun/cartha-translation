id: T12P.GAD.3.2
reference: Testament of Gad 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Πᾶν δ᾿¹² ἐὰν¹³ ποιῇ¹⁴ ὁ μισῶν¹⁵, *βδελυκτόν ἐστιν¹⁶. ἐὰν *δέ τις¹⁷ ποιῇ¹⁸ τὸν¹⁹ νόμον Κυρίου, *τοῦτον οὐκ ἐπαινεῖ²⁰. ἐάν τις²¹ φοβεῖται²² Κύριον καὶ θέλει *τὸ δίκαιον²³, *τοῦτον οὐκ ἀγαπᾷ²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/002.yaml
  text: Whatever the one who hates may do is abominable. If anyone does the law of the Lord, the hater does not praise him. If anyone fears the Lord and desires what is righteous, the hater does not love him.
translation:
  language: ko
  text: 미워하는 자가 행하는 모든 것은 가증합니다. 누구든지 주님의 율법을 행하면, 미워하는 자는 그를 칭찬하지 않습니다. 누구든지 주님을 두려워하며 의로운 것을 원하면, 미워하는 자는 그를 사랑하지 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶν δ᾿ ἐὰν ποιῇ ὁ μισῶν
  english_pob_choice: Whatever the one who hates may do
  chosen_korean: 무엇이든 미워하는 자가 행하는 것은
  alternatives_korean:
  - 미워하는 자가 무엇을 하든지
  - 미워하는 자가 행하는 모든 것은
  lexicon: μισέω
  rationale: 주어를 ‘미워하는 자’로 분명히 살리고, 문장 전체는 영어 POB의 의미를 따라 ‘무엇이든 … 하는 것은’ 구조로 자연스럽게 옮겼습니다.
- source_word: βδελυκτόν ἐστιν
  english_pob_choice: is abominable
  chosen_korean: 가증합니다
  alternatives_korean:
  - 가증한 것입니다
  - 혐오스럽습니다
  lexicon: βδελυκτός
  rationale: βδελυκτόν의 강한 도덕적 혐오 의미를 살려 ‘가증합니다’로 옮겼습니다.
- source_word: τὸν νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 계명
  lexicon: νόμος + κύριος
  rationale: νόμος는 기본적으로 ‘율법’으로 옮기고, Κυρίου는 본문 문맥상 주님을 가리키므로 ‘주님의 율법’으로 직역했습니다.
- source_word: φοβεῖται Κύριον
  english_pob_choice: fears the Lord
  chosen_korean: 주님을 두려워하며
  alternatives_korean:
  - 주님을 경외하며
  - 주님을 무서워하며
  lexicon: φοβέομαι
  rationale: φοβεῖται는 단순 공포보다 경외의 뉘앙스를 가질 수 있으나, 대조 구조와 병렬성을 위해 ‘두려워하며’로 두었습니다.
- source_word: τὸ δίκαιον
  english_pob_choice: what is righteous
  chosen_korean: 의로운 것
  alternatives_korean:
  - 의로운 일
  - 옳은 것
  lexicon: δίκαιος
  rationale: 추상명사처럼 기능하는 대상을 한국어에서 자연스럽게 ‘의로운 것’으로 처리해 본문의 윤리적 대상을 유지했습니다.
- source_word: τοῦτον οὐκ ἐπαινεῖ / οὐκ ἀγαπᾷ
  english_pob_choice: does not praise him / does not love him
  chosen_korean: 그를 칭찬하지 않습니다 / 그를 사랑하지 않습니다
  alternatives_korean:
  - 그를 높이 평가하지 않습니다 / 그를 사랑하지 않습니다
  - 그를 칭찬하지 않으며 / 그를 사랑하지 않습니다
  lexicon: ἐπαινέω / ἀγαπάω
  rationale: 대명사 ‘그를’의 대상은 앞 절의 ‘누구든지’이며, 반복되는 배척을 분명히 드러내기 위해 동일 지시어를 유지했습니다.
theological_decisions:
- issue: ‘주님’의 지칭과 번역 일관성
  chosen_reading: Κύριος는 본문에서 하나님을 가리키는 호칭으로 보아 ‘주님’으로 번역했습니다.
  alternative_readings:
  - ‘주’를 일관되게 사용
  - ‘야훼’로 음역
  rationale: 이 본문은 인용문이 아니라 지혜적 권면의 문맥이므로 한국어 가독성과 POB 기본 용례를 따라 ‘주님’을 택했습니다.
  doctrine_reference: 그리스도론/신론 용어 일관성
