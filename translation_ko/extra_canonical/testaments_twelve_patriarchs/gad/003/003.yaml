id: T12P.GAD.3.3
reference: Testament of Gad 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. Τὴν ἀλήθειαν ψέγει²⁵, *τῷ κατορθοῦντι φθονεῖ²⁶, *καταλαλιὰν ἀσπάζεται²⁷, ὑπερηφανίαν ἀγαπᾷ²⁸, ὅτι τὸ μῖσος ἐκτυφλοῖ²⁹ τὴν ψυχὴν αὐτοῦ, ὡς³⁰ κἀγὼ³¹. Γτότε³² ἔβλεπον³³ *τὸν Ἰωσήφ³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/003.yaml
  text: He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.
translation:
  language: ko
  text: 그는 진리를 비난하고, 잘되는 사람을 시기하며, 중상을 반기고, 교만을 사랑합니다. 미움이 그의 영혼을 눈멀게 하기 때문입니다. 나도 그때 요셉을 바라볼 때에는 그러했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὴν ἀλήθειαν ψέγει
  english_pob_choice: He reproaches the truth
  chosen_korean: 진리를 비난하고
  alternatives_korean:
  - 진리를 책망하고
  - 진리를 헐뜯고
  lexicon: ἀλήθεια / ψέγω
  rationale: ψέγει는 단순히 꾸짖는 것보다 공개적으로 흠잡고 비난하는 뜻이 강하므로, 진리를 향한 적대적 태도를 드러내는 ‘비난하다’가 적절합니다.
- source_word: τῷ κατορθοῦντι φθονεῖ
  english_pob_choice: envies the one who prospers
  chosen_korean: 잘되는 사람을 시기하며
  alternatives_korean:
  - 형통하는 이를 시기하며
  - 성공하는 이를 시기하며
  lexicon: κατορθόω / φθονέω
  rationale: κατορθοῦντι는 ‘올바르게 하다’보다 ‘형통하다, 잘되다’의 결과적 뉘앙스가 자연스럽고, POB의 ‘the one who prospers’를 살려 ‘잘되는 사람’으로 옮겼습니다.
- source_word: καταλαλιὰν ἀσπάζεται
  english_pob_choice: embraces slander
  chosen_korean: 중상(中傷)을 반기고
  alternatives_korean:
  - 헐뜯는 말을 반기고
  - 비방을 좋아하고
  lexicon: καταλαλιά
  rationale: καταλαλιὰν은 단순한 ‘비방’보다 남을 깎아내리는 말, 중상모략의 성격이 있어 한국어에서 의미를 더 분명히 하는 ‘중상’을 택했습니다.
- source_word: ὑπερηφανίαν ἀγαπᾷ
  english_pob_choice: loves arrogance
  chosen_korean: 교만을 사랑합니다
  alternatives_korean:
  - 오만을 사랑합니다
  - 거만을 사랑합니다
  lexicon: ὑπερηφανία
  rationale: ὑπερηφανία는 내적 태도와 드러나는 우쭐거림을 함께 포함하므로, 교회어법에 흔한 ‘교만’을 쓰되 원문의 강한 비판을 유지했습니다.
theological_decisions:
- issue: “mixture of moral vices” with soul-blinding hatred
  chosen_reading: 미움이 그의 영혼을 눈멀게 한다는 인과를 분명히 하여, 단순한 감정 묘사가 아니라 도덕적·영적 맹목을 강조했습니다.
  alternative_readings:
  - 미움이 그의 마음을 어둡게 합니다
  - 미움이 그의 영혼을 가립니다
  rationale: ἡ ψυχή와 ἐκτυφλόω의 결합은 ‘영혼’이 미움으로 인해 실제로 맹목 상태가 되는 강한 진술이므로, 이를 약화하지 않고 직역에 가깝게 살렸습니다.
  doctrine_reference: 인간의 죄가 인식과 판단을 왜곡한다는 성경적 주제
