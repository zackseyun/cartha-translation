base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/003.yaml
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
translation:
  language: ko
  text: 마음을 다하여 서로 사랑하십시오. 누군가가 당신에게 죄를 지으면, 그에게 평화의 말을 하십시오. 그리고 마음속에 속임수를 품지 마십시오. 그가 고백하고 회개하면, 그를 용서하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπήσατε ἀλλήλους ἀπὸ καρδίας
  english_pob_choice: Love one another from the heart
  chosen_korean: 서로를 마음으로부터 사랑하십시오
  alternatives_korean:
  - 서로를 진심으로 사랑하십시오
  - 마음에서 우러나 서로 사랑하십시오
  lexicon: ἀγαπάω / καρδία
  rationale: ἀπὸ καρδίας는 단순한 감정이 아니라 마음의 중심에서 나오는 사랑을 가리키므로, 관용적으로 자연스러운 ‘마음으로부터’로 옮겨 원문의 내부성 강조를 살렸습니다.
- source_word: εἰπὲ αὐτῷ εἰρήνην / ἐν εἰρήνῃ
  english_pob_choice: speak peace to him
  chosen_korean: 그에게 평화를 말하고
  alternatives_korean:
  - 그에게 평화를 말하십시오
  - 그에게 평강을 말하고
  lexicon: εἰρήνη
  rationale: εἰρήνη를 ‘평화’로 옮겨 말의 내용이 화해와 온화를 지향함을 직접 드러냈습니다. 본문이 한 사람에게 하는 권고이므로 2인칭 명령형 대신 문맥상 자연스러운 서술형 명령을 사용했습니다.
- source_word: μὴ κρατήσῃς δόλον
  english_pob_choice: hold no deceit
  chosen_korean: 속임수를 품지 마십시오
  alternatives_korean:
  - 간계를 품지 마십시오
  - 속임을 간직하지 마십시오
  lexicon: δόλος
  rationale: δόλος는 단순한 거짓말보다 관계를 해치는 내적 속임과 계책을 뜻하므로, ‘품다’로 마음속에 간직하는 상태를 살려 번역했습니다.
- source_word: μετανοήσας
  english_pob_choice: repents
  chosen_korean: 회개하면
  alternatives_korean:
  - 돌이키면
  - 마음을 바꾸면
  lexicon: μετανοέω
  rationale: 최신 영어 감사본의 ‘repents’를 따라 μετανοέω의 통상적 회개 의미를 분명히 했습니다. ‘돌이키다’보다 신앙적·도덕적 책임의 전환을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 죄를 지은 사람에게 먼저 평화를 말하라는 권면의 윤리적 방향
  chosen_reading: 대적이나 가해자에게도 먼저 평화를 선포하고, 내면에는 속임수를 품지 않는 화해의 실천으로 읽었습니다.
  alternative_readings:
  - 단순한 인사말로 읽는 해석
  - 외적 평온만을 말하는 해석
  rationale: 본문은 관계 회복을 목표로 하는 적극적 평화 선언과 내적 진실성을 함께 요구하므로, 단순한 예의 표현보다 윤리적 화해의 명령으로 옮기는 것이 소스에 더 가깝습니다.
  doctrine_reference: 화해, 용서, 마음의 진실성
