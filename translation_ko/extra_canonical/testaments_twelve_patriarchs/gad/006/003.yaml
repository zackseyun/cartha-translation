review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 εἰπὲ αὐτῷ εἰρήνην은 ‘그에게 평화를 말하고’보다 ‘그에게 평화의 말을 하십시오/건네십시오’로 옮기는 것이 한국어에서 더 자연스럽고, 말의 내용이 평화임을 더 분명히 드러냅니다. μετανοήσας/ὁμολογήσῃ 및 이와 어순이 다른 이문에 대해서는 영어 POB의 포괄적 연결 표현을 따라 ‘고백하고 회개하면’으로 유지할 수 있습니다.
  naturalness: ‘서로를 마음으로부터’와 ‘평화를 말하고’는 직역투입니다. ‘마음을 다하여 서로 사랑하십시오’와 ‘평화의 말을 하십시오’가 현대 표준 한국어 합쇼체에서 자연스럽습니다. 또한 ‘영혼 안에’는 한국어에서 부자연스러우므로, 원문의 내면적 의미를 보존하는 ‘마음속에’가 적절합니다.
  terminology: ἀγαπήσατε는 ‘사랑하십시오’, ἁμαρτήσει εἰς σέ는 ‘당신에게 죄를 지으면’, δόλος는 관계 속의 기만·간계를 나타내는 ‘속임수’, μετανοέω는 ‘회개하다’로 옮기는 것이 적절합니다. εἰρήνη는 여기서 평화로운 화해의 말을 가리키므로 ‘평화의 말’로 표현합니다.
  issues:
  - severity: medium
    issue: ‘그에게 평화를 말하고’는 현대 한국어에서 부자연스럽고 의미 관계가 불분명합니다.
    rationale: εἰπὲ αὐτῷ εἰρήνην은 평화를 내용으로 하는 말을 그에게 하라는 뜻입니다. ‘그에게 평화의 말을 하십시오’는 이를 자연스럽고 명확하게 전달합니다.
  - severity: low
    issue: ‘마음으로부터’, ‘영혼 안에’는 직역투입니다.
    rationale: ἀπὸ καρδίας와 ἐν τῇ ψυχῇ σου의 내면성은 각각 ‘마음을 다하여’와 ‘마음속에’로 자연스럽게 보존됩니다.
  revised_text: 마음을 다하여 서로 사랑하십시오. 누군가가 당신에게 죄를 지으면, 그에게 평화의 말을 하십시오. 그리고 마음속에 속임수를 품지 마십시오. 그가 고백하고 회개하면, 그를 용서하십시오.
