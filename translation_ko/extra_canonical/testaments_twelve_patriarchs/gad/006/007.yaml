  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/007.yaml
  text: But even if he is shameless and persists in evil, even so forgive him from the heart, and give vengeance to God.
translation:
  language: ko
  text: 그러나 그가 뻔뻔하고 악에 계속 매달릴지라도, 그를 마음으로부터 용서하고, 보복은 하나님께 드리십시오.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδὴς
  english_pob_choice: shameless
  chosen_korean: 뻔뻔하고
  alternatives_korean:
  - 수치심이 없고
  - 염치없고
  - 무례하고
  lexicon: ἀναιδής
  rationale: 공개적 수치심의 결여와 태도상의 뻔뻔함을 자연스럽게 드러내는 말로 옮겼습니다.
- source_word: ἐνίσταται τῇ κακίᾳ
  english_pob_choice: persists in evil
  chosen_korean: 악에 계속 매달릴지라도
  alternatives_korean:
  - 악을 고집할지라도
  - 악에 머무를지라도
  - 악행을 계속할지라도
  lexicon: ἐνίστημι + κακία
  rationale: κακία를 단순한 ‘잘못’보다 더 강한 ‘악’으로 살리고, 지속적 대항·집착의 뉘앙스를 반영했습니다.
- source_word: ἀπὸ καρδίας
  english_pob_choice: from the heart
  chosen_korean: 마음으로부터
  alternatives_korean:
  - 마음 깊이
  - 진심으로
  - 마음에서
  lexicon: καρδία
  rationale: 출발점 의미를 살리되 한국어로는 자연스럽게 ‘마음으로부터’로 옮겨 내적 진정성을 분명히 했습니다.
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  english_pob_choice: give vengeance to God
  chosen_korean: 보복은 하나님께 드리십시오
  alternatives_korean:
  - 보복을 하나님께 맡기십시오
  - 보응은 하나님께 드리십시오
  - 원수 갚음은 하나님께 드리십시오
  lexicon: δός + ἐκδίκησις
  rationale: δὸς의 직접 목적을 살리면서도, 보복의 실행 주체를 하나님께 넘기는 권면으로 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 보복의 귀속
  chosen_reading: 문장은 인간이 보복을 실행하지 말고 그 권한을 하나님께 드리라고 권합니다.
  alternative_readings:
  - 보복을 하나님께 맡기라는 뜻
  - 하나님이 보복하실 것을 기다리라는 뜻
  rationale: ἐκδίκησις를 윤리적으로 중립화하지 않고, 본문이 요구하는 신적 심판의 귀속을 분명히 했습니다.
  doctrine_reference: 신적 심판과 원수 갚음의 위임
- issue: 용서의 범위
  chosen_reading: 상대가 뻔뻔하고 악을 계속하더라도 용서는 마음에서부터 해야 합니다.
  alternative_readings:
  - 조건 없는 용서의 강조
  - 외적 행위만 용서하면 된다는 읽기
  rationale: ἄφες αὐτῷ ἀπὸ καρδίας는 외적 제스처가 아니라 내적 태도의 용서를 요구하므로 이를 분명히 했습니다.
  doctrine_reference: 용서와 내적 성향
