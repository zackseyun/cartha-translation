  source_fidelity: ἀναιδής는 ‘염치없는/뻔뻔한’, ἐνίσταται τῇ κακίᾳ는 악을 지속적으로 고집하거나 악에 버티어 머무는 뜻입니다. ‘악에 계속 매달리다’는 원문의 지속성은 전달하지만 한국어에서 다소 부자연스럽고 불필요하게 집착·의존의 뉘앙스를 냅니다. καὶ οὕτως의 양보적 강조는 ‘그럼에도’로 보존했습니다. δὸς τῷ Θεῷ τὴν ἐκδίκησιν은 보복을 하나님께 돌리거나 넘기라는 뜻이며, ‘넘기십시오’가 δός의 행위성과 한국어의 자연스러움을 함께 살립니다.
  naturalness: ‘마음으로부터’와 ‘보복은 하나님께 드리십시오’는 직역투로 다소 어색합니다. ‘마음으로 그를 용서하고’ 및 ‘보복을 하나님께 넘기십시오’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘하나님’은 초안의 신명 표기를 유지했습니다. ἐκδίκησις는 문맥상 개인적 보복/복수의 실행을 하나님께 귀속시키는 말이므로 ‘보복’을 유지하되, 인간에게 보복을 권하는 뜻으로 들리지 않도록 목적어를 ‘하나님께 넘기십시오’로 처리했습니다.
