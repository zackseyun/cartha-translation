id: T12P.GAD.6.5
reference: Testament of Gad 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. [Μὴ³¹ ἀκούσῃ³² ἐν μάχῃ ἀλλότριος³³ τὸ³⁴ μυστήριόν σου³⁵, *ἵνα μὴ³⁶ μισήσας³⁷ *ἐχθράνῃ σε³⁸, καὶ μεγάλην ἁμαρτίαν ἐργάσηται³⁹ [ἐν σοί]⁴⁰. ὅτι πολλάκις *δολοφωνεῖ σε⁴¹ ἢ περιεργάζεται σε⁴² ἐν κακοῖς⁴³] *λαβὼν ἀπό σου⁴⁴ τὸν ἰόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/005.yaml
  text: Do not let another hear your secret in a quarrel, lest, having come to hate you, he become your enemy and commit a great sin against you; for many times he either murders you by treachery or entangles you in evils, having received the poison from you.
translation:
  language: ko
  text: 다툼 중에 다른 사람이 당신의 비밀을 듣지 못하게 하십시오. 그러지 않으면 그가 당신을 미워하여 당신의 원수가 되고, 당신에게 큰 죄를 짓게 될 것입니다. 이는 그가 흔히 당신에게서 독을 받아, 간계로 당신을 살해하거나 온갖 해악에 당신을 휘말리게 하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀκούσῃ ... ἀλλότριος τὸ μυστήριόν σου
  english_pob_choice: Do not let another hear your secret
  chosen_korean: 다른 사람이 당신의 비밀을 듣지 못하게 하십시오
  alternatives_korean:
  - 다른 자가 당신의 비밀을 듣지 못하게 하십시오
  - 낯선 사람이 당신의 비밀을 듣지 못하게 하십시오
  lexicon: μυστήριον
  rationale: μυστήριον은 여기서 계시적 '비밀'이 아니라 전투/분쟁 속에서 드러나지 말아야 할 개인적 비밀을 뜻하므로, POB의 'secret'에 맞춰 비밀로 옮겼습니다.
- source_word: ἐν μάχῃ
  english_pob_choice: in a quarrel
  chosen_korean: 전투 중에
  alternatives_korean:
  - 다툼 중에
  - 싸움 중에
  lexicon: μάχη
  rationale: μάχη는 단순한 말다툼보다 실제 충돌을 포함할 수 있어, 문맥상 긴장된 대립을 살린 '전투 중에'를 택했습니다.
- source_word: μισήσας ... ἐχθράνῃ σε
  english_pob_choice: having come to hate you ... become your enemy
  chosen_korean: 당신을 미워하게 되어 당신의 원수가 되고
  alternatives_korean:
  - 당신을 미워하게 되어 당신의 적이 되고
  - 당신을 미워하여 원수로 변하고
  lexicon: μισέω / ἐχθραίνω
  rationale: 분사 μισήσας의 진행·원인 관계를 살려 '미워하게 되어'로 옮기고, ἐχθράνῃ는 관계적 적대가 분명하므로 '원수가 되고'로 번역했습니다.
- source_word: δολοφωνεῖ σε
  english_pob_choice: murders you by treachery
  chosen_korean: 배신으로 당신을 죽이거나
  alternatives_korean:
  - 간계로 당신을 죽이거나
  - 은밀하게 당신을 살해하거나
  lexicon: δολοφονέω
  rationale: δολοφονεῖ의 강한 살해 의미를 살리면서, POB의 'by treachery'에 따라 수단을 드러내는 '배신으로'를 사용했습니다.
- source_word: λαβὼν ἀπό σου τὸν ἰόν
  english_pob_choice: having received the poison from you
  chosen_korean: 당신에게서 받은 독으로
  alternatives_korean:
  - 당신에게서 독을 받아
  - 당신으로부터 받은 독으로
  lexicon: ἰός
  rationale: ἰός는 본문과 문맥에서 '독'이 자연스럽고, 수동적 소유 관계를 살려 '당신에게서 받은 독으로'로 정리했습니다.
theological_decisions:
- issue: 원수 됨의 원인과 죄의 평가
  chosen_reading: 배신과 증오가 곧 원수 됨과 큰 죄로 이어진다는 윤리적 경고로 읽었습니다.
  alternative_readings:
  - 단순한 인간관계 훼손 경고
  - 더 강한 공동체 규범 위반 경고
  rationale: 본문은 비밀 유출이 증오, 적대, 큰 죄로 이어지는 연쇄를 제시하므로, 도덕적 결과를 약화하지 않고 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 지혜문학/교훈문학의 윤리적 권면
