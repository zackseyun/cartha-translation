revisions:
- from: 전투 중에 다른 사람이 당신의 비밀을 듣지 못하게 하십시오. 그렇지 않으면, 그가 당신을 미워하게 되어 당신의 원수가 되고, 당신에게 큰 죄를 짓게 될 것입니다. 이는 그가 여러 번 배신으로 당신을 죽이거나, 당신에게서 받은 독으로 당신을 해로운 일들에 얽어매기 때문입니다.[a][b][c]
  to: 다툼 중에 다른 사람이 당신의 비밀을 듣지 못하게 하십시오. 그러지 않으면 그가 당신을 미워하여 당신의 원수가 되고, 당신에게 큰 죄를 짓게 될 것입니다. 이는 그가 흔히 당신에게서 독을 받아, 간계로 당신을 살해하거나 온갖 해악에 당신을 휘말리게 하기 때문입니다.
  rationale: 원문의 대인 갈등 문맥에 맞게 ‘전투’를 ‘다툼’으로 고쳤습니다. 마지막 분사구를 두 동사 모두에 자연스럽게 연결하고, 살해의 간계성과 한국어 표현의 자연스러움을 보완했습니다. 초안의 인용 표지 [a][b][c]에는 제공된 각주 내용이 없으므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:01Z'
review_pass:
  verdict: revise
  source_fidelity: ‘ἐν μάχῃ’는 이 교훈 문맥에서 실제 전투라기보다 다툼·분쟁을 가리키는 것이 자연스럽습니다. 또한 마지막의 ‘λαβὼν ἀπό σου τὸν ἰόν’은 ‘죽이거나/해악에 휘말리게 하는’ 두 행위 전체에 걸리는 분사이므로, 초안처럼 독을 오직 후자의 수단으로 한정하지 않는 편이 원문 구조에 가깝습니다.
  naturalness: ‘전투 중에’는 현대 한국어에서 문자적 전쟁·전투를 강하게 떠올리게 하므로 ‘다툼 중에’가 자연스럽습니다. ‘해로운 일들에 얽어매다’보다 ‘온갖 해악에 휘말리게 하다’가 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘비밀’, ‘원수’, ‘큰 죄’, ‘독’은 문맥과 원어의 의미를 잘 반영합니다. δολοφονεῖ의 간계적 살해라는 뉘앙스는 ‘간계로 … 살해하다’로 드러냈습니다.
  issues:
  - severity: medium
    issue: ἐν μάχῃ를 ‘전투 중에’로 번역함
    rationale: μάχη는 문자적으로 싸움·전투를 뜻할 수 있으나, 이 문맥 및 영어 감사 번역의 ‘quarrel’에서는 대인 간 다툼·분쟁을 뜻하는 것으로 보는 편이 적절합니다.
  - severity: medium
    issue: ‘당신에게서 받은 독으로’가 ‘해로운 일들에 얽어매다’에만 연결됨
    rationale: λαβών은 ‘살해하거나 … 휘말리게 하거나’라는 양자택일의 술어구 전체에 걸립니다. 분사를 앞세워 그 범위를 보존해야 합니다.
  - severity: low
    issue: ‘배신으로’와 ‘해로운 일들에 얽어매다’의 표현
    rationale: δολοφονέω의 방식은 ‘배신’보다 ‘간계’가 더 직접적이며, 후자는 현대 한국어에서 다소 부자연스럽습니다.
  revised_text: 다툼 중에 다른 사람이 당신의 비밀을 듣지 못하게 하십시오. 그러지 않으면 그가 당신을 미워하여 당신의 원수가 되고, 당신에게 큰 죄를 짓게 될 것입니다. 이는 그가 흔히 당신에게서 독을 받아, 간계로 당신을 살해하거나 온갖 해악에 당신을 휘말리게 하기 때문입니다.
