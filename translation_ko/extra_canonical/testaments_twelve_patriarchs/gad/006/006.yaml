review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘다시는 당신에게 잘못을 저지르지 않으며’는 제시된 그리스어 본문에 없는 ‘다시는’과 재범 방지의 목적·결과를 추가합니다. μετανοεῖ τοῦ πλημμελῆσαι εἰς σέ는 ‘당신에게 죄를 지은 것을 회개한다’는 뜻입니다. 또한 [φοβηθεὶς]는 판본에서 대괄호 처리되어 있어 본문상의 불확실성을 주석으로 밝혀야 합니다.
  naturalness: ‘잠잠하십시오’도 가능하지만, 이 문맥의 ἡσύχασον에는 ‘가만히 있으십시오’가 현대 한국어에서 더 자연스럽습니다. εἰρηνεύει는 관계적 평화를 이루는 뜻으로 ‘평화를 이룹니다’라고 옮기는 것이 명료합니다.
  terminology: ‘책망’, ‘회개’, ‘죄를 짓다’는 문맥과 현대 정중 문체에 적절합니다. ‘화목하게 됩니다’보다 능동적 표현인 ‘평화를 이룹니다’가 εἰρηνεύει를 더 잘 반영합니다.
  issues:
  - severity: high
    issue: 원문에 없는 재범 방지 내용이 추가됨
    rationale: ‘다시는 당신에게 잘못을 저지르지 않으며’는 제시된 그리스어 본문에는 없고, 영어 POB 문안에 추가된 ‘so that he may not do wrong to you again’를 따른 것입니다. 원문 우선 원칙에 따라 삭제해야 합니다.
  - severity: medium
    issue: 대괄호 처리된 φοβηθεὶς에 대한 본문 비평 주석이 없음
    rationale: Charles 판본은 ‘두려워하여’에 해당하는 φοβηθεὶς를 대괄호로 표시합니다. 번역에는 포함하되, 해당 어구의 본문상 불확실성을 앵커 주석으로 밝혀야 합니다.
  - severity: low
    issue: εἰρηνεύει의 관계적 행위성이 다소 약함
    rationale: ‘화목하게 됩니다’는 상태 변화로 들릴 수 있습니다. ‘평화를 이룹니다’는 평화를 이루고 유지한다는 동사적 의미를 더 직접적으로 나타냅니다.
  revised_text: 그러나 그가 그것을 부인하고 책망을 받을 때 부끄러워한다면, 가만히 있으십시오. 그를 책망하지 마십시오. 부인하는 사람은 당신에게 죄를 지은 것을 회개하고, 두려워하여¹ 평화를 이룹니다.
  revised_footnotes:
  - marker: '1'
    text: ‘두려워하여’에 해당하는 그리스어 단어는 이 판본에서 대괄호로 처리되어 있어 본문상 확실하지 않습니다. 이 번역은 그 단어를 포함하는 읽기를 따릅니다.
    reason: 원문의 대괄호 표기가 나타내는 본문상 불확실성을 보존합니다.
  revision_rationale: 원문에 없는 ‘다시는 … 잘못을 저지르지 않으며’를 삭제하여 μετανοεῖ τοῦ πλημμελῆσαι εἰς σέ의 의미를 충실히 반영했습니다. 명령문의 자연스러운 현대 한국어 표현을 다듬고, εἰρηνεύει의 관계적 의미를 ‘평화를 이룹니다’로 옮겼습니다. 대괄호 처리된 φοβηθεὶς는 번역에 반영하되 주석으로 텍스트상의 불확실성을 명시했습니다.
