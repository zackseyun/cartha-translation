id: T12P.GAD.6.6
reference: Testament of Gad 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
translation:
  language: ko
  text: 그러나 그가 그것을 부인하고 책망을 받아 부끄러워하면 잠잠하십시오. 그를 책망하지 마십시오. 부인하는 자는 당신에게 죄를 지은 것을 회개하여 다시는 당신에게 잘못을 저지르지 않으며, 두려워하여 화목하게 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνήσηται
  english_pob_choice: denies it
  chosen_korean: 부인하고
  alternatives_korean:
  - 거절하고
  - 모른다고 하고
  lexicon: ἀρνέομαι
  rationale: 상황상 사실이나 책임을 ‘부인하다’는 뜻이 자연스러우며, POB의 ‘denies it’을 직역하되 한국어로는 가장 직접적인 대응을 택했습니다.
- source_word: αἰδεσθῇ ἐλεγχόμενος
  english_pob_choice: is ashamed when reproved
  chosen_korean: 책망을 받아 부끄러워하면
  alternatives_korean:
  - 꾸지람을 받아 부끄러워하면
  - 드러나 책망을 받을 때 부끄러워하면
  lexicon: αἰδέομαι / ἐλέγχω
  rationale: ἐλεγχόμενος를 단순히 ‘지적받다’보다 도덕적 책망의 뉘앙스를 살려 ‘책망을 받다’로 옮기고, αἰδεσθῇ는 결과 상태인 ‘부끄러워하다’로 자연스럽게 표현했습니다.
- source_word: ἡσύχασον μὴ ἐλέγξῃς αὐτόν
  english_pob_choice: be still; do not reprove him
  chosen_korean: 잠잠하십시오. 그를 책망하지 마십시오.
  alternatives_korean:
  - 가만히 계십시오. 그를 꾸짖지 마십시오.
  - 조용히 하십시오. 그를 지적하지 마십시오.
  lexicon: ἡσυχάζω / ἐλέγχω
  rationale: ἡσύχασον은 ‘가만히 있으라’는 명령으로 이해하여 ‘잠잠하십시오’로 옮겼고, ἐλέγξῃς는 POB의 수정 반영에 따라 반복적 의미를 더하지 않고 단회적 ‘책망하다’로 처리했습니다.
- source_word: μετανοεῖ τοῦ πλημμελῆσαι εἰς σέ
  english_pob_choice: repents of having sinned against you
  chosen_korean: 당신에게 죄를 지은 것을 회개하여
  alternatives_korean:
  - 당신을 거슬러 잘못한 것을 뉘우쳐
  - 당신에게 잘못한 것을 회개하여
  lexicon: μετανοέω / πλημμελέω
  rationale: πλημμελῆσαι를 POB의 수정에 따라 단순한 ‘잘못’보다 도덕적·죄책적 무게가 있는 ‘죄를 짓다’로 반영했고, μετανοεῖ는 표준적 종교어인 ‘회개하다’를 사용했습니다.
- source_word: φοβηθεὶς εἰρηνεύει
  english_pob_choice: and being afraid he makes peace
  chosen_korean: 두려워하여 화목하게 됩니다
  alternatives_korean:
  - 두려워하여 평화를 이룹니다
  - 두려워하여 화평을 이룹니다
  lexicon: φοβέομαι / εἰρηνεύω
  rationale: εἰρηνεύει는 단순한 내면 평안보다 관계 회복의 결과를 가리키므로 ‘화목하게 됩니다’로 옮겨 관계적 의미를 드러냈습니다.
theological_decisions:
- issue: 책망과 침묵의 윤리
  chosen_reading: 회개와 부끄러움이 드러난 뒤에는 추가 책망을 멈추고 잠잠하라는 권면으로 읽었습니다.
  alternative_readings:
  - 계속해서 책망을 중단하라는 일반적 지침
  - 상대를 보호하기 위한 절제된 대인 윤리
  rationale: 문맥은 이미 책망을 받은 사람의 회개 가능성을 전제로 하므로, 과도한 재책망을 피하라는 실제적 지혜로 번역하는 것이 원문 흐름에 맞습니다.
  doctrine_reference: 잠 17:10; 마 18:15-17
