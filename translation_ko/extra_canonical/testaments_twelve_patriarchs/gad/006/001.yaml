base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/001.yaml
  text: 'And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and in thought of soul.'
translation:
  language: ko
  text: 이제, 내 자녀들아, 내가 너희에게 권합니다. 각 사람은 자기 이웃을 사랑하고, 너희 마음에서 미움을 내버리십시오. 행위와 말과 영혼의 생각에 있어서 서로를 사랑하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γπαραινῶ ὑμῖν / I urge you
  english_pob_choice: I urge you
  chosen_korean: 내가 너희에게 권합니다
  alternatives_korean:
  - 내가 너희를 권면합니다
  - 내가 너희에게 간청합니다
  lexicon: παραίνεω
  rationale: 권면보다 조금 더 직접적인 권고의 뉘앙스를 살리되, 현대 합쇼체에서 자연스럽고 과장되지 않게 옮겼습니다.
- source_word: ἀγαπᾶτε τὸν πλησίον αὑτοῦ / love his neighbor
  english_pob_choice: let each one love his neighbor
  chosen_korean: 각 사람은 자기 이웃을 사랑하고
  alternatives_korean:
  - 각자 자기 이웃을 사랑하고
  - 각 사람이 자기 이웃을 사랑하고
  lexicon: ἀγαπάω / πλησίον
  rationale: ‘각 사람’으로 분배적 명령을 분명히 하고, πλησίον은 복음서 전통의 ‘이웃’으로 옮겼습니다.
- source_word: ἐξάρατε τὸ μῖσος ἀπὸ τῶν καρδιῶν ὑμῶν / remove hatred from your hearts
  english_pob_choice: remove hatred from your hearts
  chosen_korean: 너희 마음에서 미움을 내버리십시오
  alternatives_korean:
  - 너희 마음에서 미움을 없애십시오
  - 너희 마음에서 미움을 제거하십시오
  lexicon: μῖσος / καρδία
  rationale: ‘내버리다’는 단순 제거보다 버림의 결단을 더 잘 드러내며, καρδία는 문맥상 ‘마음’이 자연스럽습니다.
- source_word: ἐν ἔργῳ καὶ λόγῳ καὶ διανοίᾳ ψυχῆς / in deed and word and in thought of soul
  english_pob_choice: in deed and word and in thought of soul
  chosen_korean: 행위와 말과 영혼의 생각에 있어서
  alternatives_korean:
  - 행위와 말과 영혼의 생각으로
  - 행위와 말과 마음의 생각으로
  lexicon: ἔργον / λόγος / διάνοια / ψυχή
  rationale: διανοίᾳ ψυχῆς를 너무 해석하지 않고, POB의 ‘thought of soul’을 따라 ‘영혼의 생각’으로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 형제 사랑의 범위와 방식
  chosen_reading: 단순한 감정이 아니라 이웃 사랑, 미움의 제거, 그리고 행위·말·생각 전반에 걸친 실천으로 제시했습니다.
  alternative_readings:
  - 감정적 친애로 완화하기
  - ‘영혼의 생각’을 내면적 의향으로 풀어쓰기
  rationale: 본문은 사랑을 내적 태도와 외적 행위 모두에 걸친 포괄적 윤리로 제시하므로, 이를 축소하지 않았습니다.
  doctrine_reference: 윤리적 권면, 내적 동기와 외적 실천의 통합
