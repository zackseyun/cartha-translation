  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 원문의 연속된 복수 명령형 ἀγαπᾶτε와 ἐξάρατε를 한국어에서도 각각 독립된 명령으로 드러내는 편이 더 정확합니다. διανοίᾳ ψυχῆς는 다소 특이한 표현이므로 해석적으로 ‘의향’ 등으로 확정하지 않고 ‘영혼의 생각’으로 유지할 수 있습니다.
  naturalness: 초안의 ‘각 사람은 자기 이웃을 사랑하고’는 뒤의 명령문에 연결되기는 하나, 주제문처럼 들려 원문의 직접적인 권면이 약해집니다. ‘각자 … 사랑하십시오’로 하면 현대 표준어 합쇼체에서 더 자연스럽고 명료합니다. ‘행위와 말과 영혼의 생각에 있어서’보다 ‘…으로’가 원문의 수단·방식의 여격에 맞고 간결합니다.
  terminology: ‘이웃’, ‘미움’, ‘마음’, ‘영혼’은 적절합니다. ἐξάρατε의 제거 요청에는 ‘내버리십시오’도 가능하지만, ‘없애십시오’가 ‘마음에서 … 제거하다’라는 원문 구조에 더 직접적으로 대응합니다.
