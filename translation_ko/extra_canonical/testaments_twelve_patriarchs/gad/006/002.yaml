id: T12P.GAD.6.2
reference: Testament of Gad 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ἐγὼ γὰρ⁸ κατὰ πρόσωπον τοῦ πατρὸς μου⁹, εἰρηνικὰ¹⁰ ἐλάλουν τῷ Ἰωσήφ· *ἐξερχόμενος δὲ ἐξ αὐτοῦ¹¹ τὸ πνεῦμα *τοῦ μίσους ἐσκότιζέ μου τὸν νοῦν¹², καὶ ἐτάρασσέ¹³ *μου τὸν λογισμόν¹⁴ *πρὸς τὸ¹⁵ ἀνελεῖν αὐτόν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/002.yaml
  text: For I myself, in my father’s presence, spoke peaceably to Joseph; but when I had gone out from him, the spirit of hatred darkened my mind and disturbed my thoughts to kill him.
translation:
  language: ko
  text: 내가 아버지 앞에서 요셉에게 평화롭게 말하였으나, 그에게서 나오자 미움의 영이 내 생각을 어둡게 하고 내 마음을 흔들어 그를 죽이게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρηνικὰ ἐλάλουν
  english_pob_choice: spoke peaceably
  chosen_korean: 평화롭게 말하였으나
  alternatives_korean:
  - 평안하게 말하였으나
  - 화목하게 말하였으나
  lexicon: εἰρηνικά / λαλέω
  rationale: 표면상의 ‘평화롭게 말하다’라는 의미를 살리되, 문맥상 겉으로는 온화했으나 내면은 달랐다는 대비를 자연스럽게 드러냈습니다.
- source_word: τὸ πνεῦμα τοῦ μίσους
  english_pob_choice: the spirit of hatred
  chosen_korean: 미움의 영
  alternatives_korean:
  - 증오의 영
  - 혐오의 영
  lexicon: πνεῦμα / μῖσος
  rationale: 직역에 가까운 ‘영’ 구조를 유지하면서, μῖσος는 한국어에서 의미가 지나치게 격하지 않은 ‘미움’으로 옮겨 문맥의 감정적 작동을 보존했습니다.
- source_word: τὸν νοῦν / τὸν λογισμόν
  english_pob_choice: my mind / my thoughts
  chosen_korean: 내 생각을 … 내 마음을
  alternatives_korean:
  - 내 마음을 … 내 생각을
  - 내 정신을 … 내 사고를
  lexicon: νοῦς / λογισμός
  rationale: νοῦς와 λογισμός의 이중 표현을 한국어에서 기계적으로 구분하기보다, 의미의 초점을 ‘생각’과 ‘마음’의 두 층위로 나누어 번역해 문맥적 흐름을 살렸습니다.
- source_word: πρὸς τὸ ἀνελεῖν αὐτόν
  english_pob_choice: to kill him
  chosen_korean: 그를 죽이게 하였습니다
  alternatives_korean:
  - 그를 죽이려 하였습니다
  - 그를 죽이고자 하였습니다
  lexicon: ἀνελεῖν
  rationale: 원문의 목적 구문을 해석적으로 풀기보다, 행위의 방향성을 드러내는 한국어 ‘-게 하다’ 구조로 옮겨 직접성을 유지했습니다.
theological_decisions:
- issue: 악의 근원으로서의 ‘영’ 표현
  chosen_reading: ‘미움의 영’은 단순한 감정 묘사가 아니라 내적 행위를 자극하는 인격적/영적 영향으로 읽었습니다.
  alternative_readings:
  - ‘미움의 정신’으로 비인격화
  - ‘미움이 든 마음’으로 심리화
  rationale: 원문이 τὸ πνεῦμα를 사용하므로, 이를 심리 상태로만 축소하지 않고 텍스트가 말하는 영적 작용을 살리는 쪽을 택했습니다.
  doctrine_reference: 성서의 영적 영향에 대한 서술을 인격적 작용으로 존중하는 일반적 본문 읽기
- issue: 본문의 대비 구조
  chosen_reading: 겉으로는 아버지 앞에서 평화롭게 말했으나, 내면에서는 미움이 살인 의도로 이어졌다는 대비를 그대로 유지했습니다.
  alternative_readings:
  - 내면의 갈등을 완화해 도덕적 교훈으로 일반화
  - 살인 의도를 약화해 단순한 분노로 조정
  rationale: 이 절의 핵심은 외적 말과 내적 동기의 강한 대비이므로, 그 긴장과 위험성을 희석하지 않았습니다.
  doctrine_reference: 인간의 이중성 및 내적 죄의 진행을 드러내는 본문
