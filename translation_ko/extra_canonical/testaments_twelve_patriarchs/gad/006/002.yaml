  to: 나는 아버지 앞에서 요셉에게 평화롭게 말하였으나, 그에게서 나왔을 때 미움의 영이 내 마음을 어둡게 하고, 그를 죽이려는 쪽으로 내 생각을 어지럽혔습니다.
