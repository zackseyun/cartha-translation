  source_fidelity: 첫 문장은 Ἐὰν δὲ ἀρνεῖται와 μὴ φιλονείκει αὐτῷ를 충실하게 옮겼습니다. 그러나 δεύτε 절의 μήποτε는 앞선 금령의 목적/경계(‘…하지 않도록, …할까 하여’)를 나타내는데, 초안의 ‘염려됩니다’는 비인칭 서술로 바꾸어 원문의 직접적인 경고와 논리적 연결을 약화합니다.
  naturalness: ‘당신은 두 배로 죄를 짓게 될까 염려됩니다’는 현대 표준어에서 주어와 ‘염려됩니다’의 결합이 어색합니다. ‘…죄를 짓지 않도록 하십시오’로 앞 문장의 금령과 자연스럽게 연결할 수 있습니다.
  terminology: ‘부인하다’, ‘다투다’, ‘맹세하다’, ‘죄를 짓다’는 모두 문맥과 현대 합쇼체에 적절합니다. δισσῶς의 뜻은 ‘두 배로’로 유지했습니다.
