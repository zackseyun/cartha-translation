id: T12P.GAD.6.4
reference: Testament of Gad 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ ἀρνεῖται²⁸, μὴ φιλονείκει αὐτῷ, μήποτε²⁹ ὁμόσαντος αὐτοῦ δισσῶς ἁμαρτάνεις³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/004.yaml
  text: But if he denies it, do not contend with him, lest, when he swears, you sin doubly.
translation:
  language: ko
  text: 그러나 그가 부인하면 그와 다투지 마십시오. 그가 맹세할 때 당신이 두 배로 죄를 짓지 않도록 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ ἀρνεῖται
  english_pob_choice: But if he denies it
  chosen_korean: 그러나 그가 부인하면
  alternatives_korean:
  - 그러나 그가 부정하면
  - 하지만 그가 부인한다면
  lexicon: ἀρνέομαι
  rationale: 여기서는 어떤 사실이나 책임을 ‘부인하다’는 뜻이 자연스럽고, 조건절의 흐름도 현대 한국어에서 가장 분명하게 전달됩니다.
- source_word: μὴ φιλονείκει αὐτῷ
  english_pob_choice: do not contend with him
  chosen_korean: 그와 다투지 마십시오
  alternatives_korean:
  - 그와 논쟁하지 마십시오
  - 그에게 시비를 걸지 마십시오
  lexicon: φιλονεικέω
  rationale: 단순한 의견 교환보다 감정적으로 맞서는 ‘다툼/논쟁’의 뉘앙스가 있어, 평이하면서도 직접적인 ‘다투다’가 적절합니다.
- source_word: ὁμόσαντος αὐτοῦ
  english_pob_choice: when he swears
  chosen_korean: 그가 맹세할 때
  alternatives_korean:
  - 그가 맹세할 때에
  - 그가 맹세하면
  lexicon: ὄμνυμι
  rationale: 그리스어는 단순히 ‘맹세하다’로 말하며, 영어 POB의 수정처럼 ‘an oath’를 보태지 않았습니다.
- source_word: δισσῶς ἁμαρτάνεις
  english_pob_choice: you sin doubly
  chosen_korean: 당신은 두 배로 죄를 짓게 될까 염려됩니다
  alternatives_korean:
  - 당신은 두 배로 죄짓게 됩니다
  - 당신은 이중으로 죄를 범하게 됩니다
  lexicon: δισσῶς
  rationale: ‘두 배로’라는 중복/강조를 살리되, 문맥상 경고의 뉘앙스를 살려 한국어에서는 결과를 염려하는 표현으로 옮겼습니다.
theological_decisions:
- issue: 직접적 경고의 어조와 2인칭 일반화
  chosen_reading: 본문의 경고를 현대 한국어의 공손한 직접 화법으로 옮겼습니다.
  alternative_readings:
  - 명령형을 더 강하게 살려 ‘두 배로 죄를 짓게 됩니다’로 단정적으로 옮길 수 있음
  - 완곡하게 ‘죄를 짓게 될 수 있습니다’로 낮출 수 있음
  rationale: 이 절은 훈계적 경고이므로, 지나치게 완화하지 않되 합쇼체로 공손하고 분명하게 유지하는 것이 적절합니다.
  doctrine_reference: 문맥상 윤리적 권면과 책임 강조
