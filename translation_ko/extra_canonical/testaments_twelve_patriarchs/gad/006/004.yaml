    rationale: μήποτε ὁμόσαντος αὐτοῦ δισσῶς ἁμαρτάνεις는 ‘그가 맹세할 때 당신이 두 배로 죄를 짓지 않도록’이라는 앞선 명령의 경계 이유입니다. ‘염려됩니다’는 이 관계를 불명확하게 하고 한국어 문장도 부자연스럽습니다.
  revised_text: 그러나 그가 부인하면 그와 다투지 마십시오. 그가 맹세할 때 당신이 두 배로 죄를 짓지 않도록 하십시오.
