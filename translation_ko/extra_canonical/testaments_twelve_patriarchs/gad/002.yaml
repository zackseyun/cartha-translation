revisions:
- from: '1 그러므로 나는 내 죄를 여러분에게 고백합니다. 여러 번 그를 죽이려고 했습니다. 왜냐하면 내 영혼에서부터 그를 미워했기 때문입니다. 2 또 꿈들 때문에 나는 그에게 대한 미움을 더했습니다. 나는 그를 살아 있는 땅에서 없애 버리려고 했습니다. 마치 송아지가 들판의 푸른 풀을 핥아 먹어 치우듯이 말입니다. 3 그러나 유다는 그를 몰래 이스마엘 사람들에게 팔았습니다. 4 그렇게 해서 우리 조상의 하나님이 그를 우리 손에서 구해 내셨습니다. 그래서 우리가 이스라엘에서 큰 불법을 저지르지 않게 하셨습니다.


    3 그러므로 시므온과 나는 그를 이스마엘 사람들에게 은 금화 서른 닢에 팔았습니다. 그리고 열 닢을 숨긴 뒤, 스무 닢을 우리 형제들에게 보여 주었습니다. 4 그리고 탐욕 때문에 우리는 그의 살해에 완전히 마음을 빼앗겼습니다. 5 그러나 내 조상의 하나님이 그를 내 손에서 구해 내셨습니다. 그래서 내가 이스라엘에서 불법을 저지르지 않게 하셨습니다.[a][b][c][d]'
  to: '1 그러므로 자녀들아, 나는 내 죄를 고백합니다.[a] 나는 여러 번 그를 죽이려고 했습니다. 내 마음 깊이 그를 미워했기 때문입니다. 2 또 그 꿈들 때문에 나는 그에 대한 미움을 더했습니다. 나는 그를 산 자들의 땅에서 없애 버리려고 했습니다.[b] 마치 송아지가 들판의 푸른 것을 핥아 먹듯이 말입니다. 3 그리고 유다가 그를 몰래 이스마엘 사람들에게 팔았습니다.[c] 4 이처럼 우리 조상들의 하나님께서 그를 우리 손에서 구해 내셨습니다. 그리하여 우리가 이스라엘에서 큰 불법 행위를 저지르지 않게 하셨습니다.


    3 그러므로 시므온과 나는 그를 이스마엘 사람들에게 금화 서른 닢에 팔았습니다.[d] 그리고 열 닢을 숨기고 스무 닢을 우리 형제들에게 보여 주었습니다. 4 이렇게 우리는 탐욕 때문에 그를 죽이겠다는 마음으로 가득 찼습니다. 5 그러나 내 조상들의 하나님께서 그를 내 손에서 구해 내셨습니다. 그리하여 내가 이스라엘에서 불법 행위를 저지르지 않게 하셨습니다.'
  rationale: 그리스어 본문을 우선하여 호격, 접속 관계, 화폐 표현, 살해 의도의 강도를 바로잡았습니다. 서로 충돌하는 판매·구출 전승은 본문에서 모두 유지하고, 각주 표지를 해당 구절에 배치했습니다. ‘산 자들의 땅’과 송아지 비유는 원문의 비유적 긴장과 성경적 어감을 보존하면서도 현대 한국어로 읽히도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:39Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 그리스어의 두 병렬 전승을 모두 보존하고 있으나, κρυφῆ를 잇는 καί를 ‘그러나’로 처리한 점, ἐπληροφορήθημεν τῆς ἀναιρέσεως의 뜻을 다소 흐리게 처리한 점, 그리고 ‘은 금화’라는 부정확한 화폐 표현을 바로잡을 필요가 있습니다. 각주 표지도 해당 본문 위치에 붙여야 합니다.
  naturalness: ‘여러분에게 고백합니다’는 호격 τέκνα를 충분히 반영하지 못하고, ‘내 영혼에서부터’와 ‘살아 있는 땅’은 현대 표준 한국어에서 다소 부자연스럽습니다. ‘자녀들아’, ‘내 마음 깊이’, ‘산 자들의 땅’이 문맥과 문체에 더 잘 맞습니다.
  terminology: ‘이스마엘 사람들’, ‘시므온’, ‘불법 행위’는 적절합니다. χρυσίων은 ‘은 금화’가 아니라 ‘금화 서른 닢’으로 옮겨야 하며, 살해 의도는 ‘그를 죽이겠다는 마음으로 가득 찼습니다’로 명확히 하는 편이 좋습니다.
  issues:
  - severity: medium
    issue: 호격 τέκνα의 누락
    rationale: ‘여러분에게’는 수신자를 나타낼 뿐 ‘자녀들아’라는 직접 호격을 번역하지 못합니다.
  - severity: medium
    issue: ‘은 금화 서른 닢’
    rationale: 그리스어 τριάκοντα χρυσίων은 금에 관한 표현이며 ‘은’은 근거 없이 첨가되었습니다.
  - severity: medium
    issue: ἐπληροφορήθημεν τῆς ἀναιρέσεως의 의미 약화
    rationale: ‘그의 살해에 완전히 마음을 빼앗겼습니다’보다, 살해하려는 결의·의도로 가득 찼다는 뜻을 직접 드러내야 합니다.
  - severity: low
    issue: 접속사와 문체의 부자연스러움
    rationale: κρυφῆ πράσας를 시작하는 καί는 ‘그러나’가 아니라 ‘그리고’가 가깝고, ‘내 영혼에서부터’, ‘살아 있는 땅’은 자연스러운 현대 한국어로 다듬는 것이 좋습니다.
  - severity: medium
    issue: 각주 표지가 모두 마지막 문장에 집중됨
