base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002.yaml
  text: '1 Therefore I confess my sin[a], children: many times I wanted to kill him, because I hated him from my soul. 2 And because of the dreams I added hatred toward him, and I wanted to wipe him out from the land of the living, as a calf licks up the green growth of the field. 3 But Judah sold him secretly to the Ishmaelites. 4 Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers. 4 And so, through greed, we were fully set on his murder. 5 But the God of my fathers rescued him from my hands[d][c][b], so that I might not commit a lawless deed in Israel.'
  footnotes:
  - marker: a
    text: The chapter preserves more than one textual form of the Joseph-selling episode. This draft translates both strands rather than harmonizing them.
    reason: textual_variant
  - marker: b
    text: Or 'consume him' / 'wipe him out.' The Greek verb is kept literally here because of the calf simile that follows.
    reason: lexical_alternative
  - marker: c
    text: Some witnesses attribute the sale secretly to Judah; another strand says, 'Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold.'
    reason: textual_variant
  - marker: d
    text: '''Thirty pieces of gold'' reflects the Greek text here; the line about hiding ten and showing twenty also belongs to this variant strand.'
    reason: textual_variant
translation:
  language: ko
  text: '1 그러므로 나는 내 죄를 여러분에게 고백합니다. 여러 번 그를 죽이려고 했습니다. 왜냐하면 내 영혼에서부터 그를 미워했기 때문입니다. 2 또 꿈들 때문에 나는 그에게 대한 미움을 더했습니다. 나는 그를 살아 있는 땅에서 없애 버리려고 했습니다. 마치 송아지가 들판의 푸른 풀을 핥아 먹어 치우듯이 말입니다. 3 그러나 유다는 그를 몰래 이스마엘 사람들에게 팔았습니다. 4 그렇게 해서 우리 조상의 하나님이 그를 우리 손에서 구해 내셨습니다. 그래서 우리가 이스라엘에서 큰 불법을 저지르지 않게 하셨습니다.


    3 그러므로 시므온과 나는 그를 이스마엘 사람들에게 은 금화 서른 닢에 팔았습니다. 그리고 열 닢을 숨긴 뒤, 스무 닢을 우리 형제들에게 보여 주었습니다. 4 그리고 탐욕 때문에 우리는 그의 살해에 완전히 마음을 빼앗겼습니다. 5 그러나 내 조상의 하나님이 그를 내 손에서 구해 내셨습니다. 그래서 내가 이스라엘에서 불법을 저지르지 않게 하셨습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  english_pob_choice: I confess
  chosen_korean: 나는 … 고백합니다
  alternatives_korean:
  - 나는 … 인정합니다
  lexicon: BDAG
  rationale: 회개의 자기 고백이라는 문맥을 살려 단순한 ‘인정하다’보다 ‘고백하다’를 택했습니다.
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  english_pob_choice: I hated him from my soul
  chosen_korean: 내 영혼에서부터 그를 미워했기 때문입니다
  alternatives_korean:
  - 내 마음 깊이 그를 미워했기 때문입니다
  - 진심으로 그를 미워했기 때문입니다
  lexicon: BDAG
  rationale: 영혼으로부터 솟는 증오라는 강한 표현을 완화하지 않고 비교적 직역적으로 옮겼습니다.
- source_word: ἐκλεῖξαι ἐκ γῆς ζώντων
  english_pob_choice: to wipe him out from the land of the living
  chosen_korean: 그를 살아 있는 땅에서 없애 버리려고 했습니다
  alternatives_korean:
  - 그를 살아 있는 땅에서 쓸어 없애려고 했습니다
  - 그를 살아 있는 자들의 땅에서 없애려고 했습니다
  lexicon: LSJ
  rationale: 영문 POB의 수정처럼 관용적 의미는 살리되, 이어지는 송아지 비유와 충돌하지 않도록 과도한 해석은 피했습니다.
- source_word: τὰ χλωρὰ τοῦ πεδίου
  english_pob_choice: the green growth of the field
  chosen_korean: 들판의 푸른 풀
  alternatives_korean:
  - 들판의 푸른 성장물
  - 들판의 푸른 것들
  lexicon: LSJ
  rationale: 자연스러운 한국어로 옮기되, ‘푸른’과 ‘들판’의 이미지가 살아나도록 했습니다.
- source_word: ἀνομίαν μεγάλην / ἀνόμημα
  english_pob_choice: a great lawless deed / a lawless deed
  chosen_korean: 큰 불법 / 불법
  alternatives_korean:
  - 큰 악행 / 악행
  - 큰 불의 / 불의
  lexicon: BDAG
  rationale: 율법을 어기는 도덕·법정적 뉘앙스를 살리기 위해 교회적 관용구보다 ‘불법’을 택했습니다.
- source_word: κρυφῆ πράσας
  english_pob_choice: sold him secretly
  chosen_korean: 몰래 팔았습니다
  alternatives_korean:
  - 은밀하게 팔았습니다
  - 비밀리에 팔았습니다
  lexicon: BDAG
  rationale: 숨긴 거래라는 서술을 간결하게 드러내는 한국어 부사로 처리했습니다.
theological_decisions:
- issue: 본문이 보존하는 두 갈래 전승(유다가 몰래 팜 / 시므온과 내가 팜)을 어떻게 다룰지
  chosen_reading: 두 전승을 모두 한국어 본문에 그대로 반영하고, 서로 조화시키지 않았습니다.
  alternative_readings:
  - 한 줄로 합쳐 매끄럽게 재구성하기
  - 한 전승만 선택해 다른 전승을 생략하기
  rationale: 제공된 그리스어 본문은 변이 전승을 병렬로 보존하므로, 투명성을 위해 둘 다 번역하는 것이 맞습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: ἐκλεῖξαι의 의미를 관용적으로 풀지, 구체적 비유를 살릴지
  chosen_reading: ‘없애 버리려고 했습니다’로 옮기고, 뒤의 송아지 비유를 그대로 살렸습니다.
  alternative_readings:
  - ‘그를 핥아 먹어 치우려고 했습니다’로 직역하기
  - ‘그를 쓸어 없애려고 했습니다’로 완전 관용화하기
  rationale: 본문 자체가 곧바로 송아지 비유로 설명하므로, 한국어에서는 의미는 분명히 하되 비유의 생동감을 보존하는 쪽이 적절합니다.
  doctrine_reference: DOCTRINE.md §Maintain the source's rhetorical force
