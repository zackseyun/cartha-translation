  source_fidelity: 초안은 핵심 문장 대부분을 충실히 옮겼으나, 제공된 그리스어 본문 끝의 πάντα γὰρ … ἐπείθετο αὐτῷ 절(아버지가 요셉의 말을 믿었다는 진술)을 빠뜨렸습니다. 또한 원문의 οὔτε … οὔτε 병렬은 ‘듣고 싶지 않았고 보려고도 하지 않았다’로 분명히 드러내는 편이 안전합니다.
