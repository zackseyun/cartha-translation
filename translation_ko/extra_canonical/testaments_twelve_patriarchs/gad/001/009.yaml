revisions:
- from: 그리고 미움의 영이 내 안에 있었고, 나는 요셉을 듣지도 않고 보지도 않으려고 했습니다. 이는 그가 우리를 마주 보며 꾸짖었기 때문인데, 우리가 유다 없이 가축을 먹고 있다고 말했기 때문입니다.[a]
  to: 9. 그리고 미움의 영이 내 안에 있었습니다. 나는 요셉의 말도 듣고 싶지 않았고, 요셉을 보고 싶지도 않았습니다. 그가 우리 면전에서 우리를 꾸짖으며, 우리가 유다 없이 가축을 먹고 있다고 말했기 때문입니다. 그가 아버지에게 무엇이든 말하면, 아버지는 그를 믿었습니다.
  rationale: 제공된 그리스어 본문 전체를 반영하여 누락된 마지막 절을 보충했습니다. ‘듣기’와 ‘보기’의 이중 거부를 현대 한국어 합쇼체로 자연스럽게 옮기고, κατὰ πρόσωπον은 ‘우리 면전에서’로 번역했습니다. 원문에 근거가 제시되지 않은 본문 각주 표지는 삭제했습니다.
