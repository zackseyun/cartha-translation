id: T12P.GAD.1.9
reference: Testament of Gad 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 9. Καὶ τὸ πνεῦμα τοῦ⁵⁹ μίσους ἦν ἐν ἐμοί, καὶ⁶⁰ οὐκ ἤθελον⁶¹ *οὔτε †δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν⁶² ἰδεῖν τὸν Ἰωσήφ, ὅτι⁶³ κατὰ πρόσωπον⁶⁴ ἤλεγξεν ἡμᾶς Γλέγων¹⁶⁵, ὅτι χωρὶς⁶⁶ Ἰούδα⁶⁷ ἠσθίομεν *τὰ θρέμματα⁶⁸. *πάντα γὰρ⁶⁹ ὅσα ἔλεγε *τῷ πατρὶ⁷⁰ ἐπείθετο αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/009.yaml
  text: And the spirit of hatred was in me, and I did not want to perceive Joseph, neither through hearing nor through sight, because he rebuked us to our face, saying that we were eating the livestock without Judah. For in everything he said to our father, he believed him.
translation:
  language: ko
  text: 9. 그리고 미움의 영이 내 안에 있었습니다. 나는 요셉의 말도 듣고 싶지 않았고, 요셉을 보고 싶지도 않았습니다. 그가 우리 면전에서 우리를 꾸짖으며, 우리가 유다 없이 가축을 먹고 있다고 말했기 때문입니다. 그가 아버지에게 무엇이든 말하면, 아버지는 그를 믿었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  english_pob_choice: the spirit of hatred
  chosen_korean: 미움의 영
  alternatives_korean:
  - 증오의 영
  - 미움의 기운
  lexicon: πνεῦμα
  rationale: 영을 유지해 영적 실재를 살리되, μίσους는 문맥상 감정의 강도를 드러내는 ‘미움’으로 옮겼습니다.
- source_word: ἦν ἐν ἐμοί
  english_pob_choice: was in me
  chosen_korean: 내 안에 있었고
  alternatives_korean:
  - 내 안에 있었다
  - 내 속에 있었다
  lexicon: ἐν + 인칭대명사
  rationale: 직역에 가깝게 ‘내 안에’로 옮겨 내면의 내재를 분명히 했습니다.
- source_word: οὐκ ἤθελον οὔτε δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν ἰδεῖν
  english_pob_choice: I did not want either to hear or to see
  chosen_korean: 듣지도 않고 보지도 않으려고 했습니다
  alternatives_korean:
  - 듣고 보지도 않으려고 했습니다
  - 귀로도 눈으로도 보려 하지 않았습니다
  lexicon: ἀκοή, ὀφθαλμοί, ἰδεῖν
  rationale: 감각 병렬을 자연스러운 한국어로 압축하되, ‘듣다/보다’의 이중 부정을 유지해 거부의 강도를 살렸습니다.
- source_word: κατὰ πρόσωπον ἤλεγξεν ἡμᾶς
  english_pob_choice: he rebuked us to our face
  chosen_korean: 우리를 마주 보며 꾸짖었기 때문인데
  alternatives_korean:
  - 얼굴을 맞대고 꾸짖었기 때문인데
  - 면전에서 우리를 꾸짖었기 때문인데
  lexicon: κατὰ πρόσωπον, ἐλέγχω
  rationale: 관용구는 ‘마주 보며’로 풀고, ἤλεγξεν은 단순 비난보다 ‘꾸짖다’가 적합하다고 보았습니다.
- source_word: χωρὶς Ἰούδα ἠσθίομεν τὰ θρέμματα
  english_pob_choice: we were eating the livestock without Judah
  chosen_korean: 우리가 유다 없이 가축을 먹고 있다고
  alternatives_korean:
  - 우리가 유다 없이 짐승을 먹고 있다고
  - 우리가 유다를 두고 가축을 먹고 있다고
  lexicon: χωρὶς, θρέμματα
  rationale: θρέμματα는 문맥상 ‘기르는 짐승/가축’으로 보고, 영어 POB의 내용을 따라 현재분사적 보고문으로 옮겼습니다.
theological_decisions:
- issue: ‘미움의 영’의 인격적/비인격적 표현
  chosen_reading: 내면을 지배하는 영적 상태를 문자 그대로 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 단순히 ‘미움’으로 완화
  - ‘미움의 마음’으로 심리화
  rationale: 원문은 감정이 아니라 ‘영’이 내 안에 있었다고 말하므로, 영적-윤리적 원인을 흐리지 않기 위해 유지했습니다.
  doctrine_reference: 인간 내면의 영적 동인에 대한 묘사
