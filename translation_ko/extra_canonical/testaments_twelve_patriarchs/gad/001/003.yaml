  source_fidelity: 핵심 동작의 연쇄(밤의 양 떼 경비, 맹수의 접근, 추격, 따라잡음, 발을 붙듦, 내던짐, 죽임)는 충실히 반영되었습니다. 다만 ‘돌을 던지는 거리쯤에서’는 ὡσεὶ λίθου βολήν이 나타내는 내던진 거리(‘돌을 던질 만한 거리만큼’)를 출발 위치처럼 바꾸므로 수정이 필요합니다. 또한 원문의 반복·습관적 서술은 ‘죽이곤 했습니다’로 더 잘 드러낼 수 있습니다.
