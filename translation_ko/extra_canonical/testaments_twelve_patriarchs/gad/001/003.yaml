  terminology: ‘양 떼’, ‘사자’, ‘이리’, ‘들짐승’, ‘발’, ‘붙들다’는 문맥과 원어 어휘에 적절합니다. 별도의 신학 용어 또는 명칭 문제는 없습니다.
