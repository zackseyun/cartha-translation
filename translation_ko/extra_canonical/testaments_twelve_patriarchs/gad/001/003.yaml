id: T12P.GAD.1.3
reference: Testament of Gad 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. *Ἐγὼ οὖν¹³ ἐφύλαττον Γἐν τῇ¹⁴ νυκτὶ¹⁴ *τὸ ποίμνιον¹⁵, καὶ ὅταν¹⁶ ἤρχετο δ¹⁷ λέων, Γἢ ὁ λύκος¹⁸, *ἢ πᾶν θηρίον¹⁹ ἐπὶ *τὴν ποίμνην²⁰, κατεδίωκον²¹ αὐτό²², καὶ *φθάνων ἐκράτουν²³ *τὸν πόδα αὐτοῦ τῇ χειρὶ μου²⁴ καὶ *ἠκόντισα αὐτὸ ὡσεὶ λίθου βολήν, καὶ²⁵ *ἀνῄρουν αὐτό²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/003.yaml
  text: I therefore guarded the flock by night; and when a lion or a wolf or any wild beast came against the flock, I would chase it down, and overtaking it I would seize its foot with my hand, and hurl it about a stone's throw, and so kill it.
translation:
  language: ko
  text: 그러므로 저는 밤에 양 떼를 지켰습니다. 그리고 사자나 이리나 어떤 들짐승이 양 떼를 향해 올 때마다, 그것을 뒤쫓아가서 따라잡으면 제 손으로 그 발을 붙들고, 돌을 던지는 거리쯤에서 그것을 내던져 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον ... τὸ ποίμνιον / τὴν ποίμνην
  english_pob_choice: guarded the flock ... against the flock
  chosen_korean: 양 떼를 지켰습니다
  alternatives_korean:
  - 양 떼를 보호했습니다
  - 양 떼를 감시했습니다
  lexicon: ποιμνίον / ποίμνη
  rationale: 문맥상 단순한 관찰이 아니라 밤에 양 떼를 지키는 목자 행위를 가리키므로, 자연스럽고 직접적인 ‘지켰습니다’가 가장 잘 맞습니다.
- source_word: κατεδίωκον ... φθάνων
  english_pob_choice: I would chase it down ... overtaking it
  chosen_korean: 그것을 뒤쫓아가서 따라잡으면
  alternatives_korean:
  - 그것을 추격하여 따라잡으면
  - 그것을 쫓아가 잡으면
  lexicon: καταδιώκω / φθάνω
  rationale: 두 동사의 연쇄를 살려 ‘뒤쫓아가서’와 ‘따라잡으면’으로 나누어, 추격과 추월의 동작을 모두 드러냈습니다.
- source_word: ἐκράτουν τὸν πόδα αὐτοῦ τῇ χειρὶ μου
  english_pob_choice: I would seize its foot with my hand
  chosen_korean: 제 손으로 그 발을 붙들고
  alternatives_korean:
  - 제 손으로 그 발을 잡고
  - 제 손으로 그 발을 움켜쥐고
  lexicon: κρατέω / πούς / χείρ
  rationale: ‘붙들다’는 κρατέω의 지속적이고 강한 잡음을 살리면서, 손과 발의 결합을 자연스러운 한국어로 옮깁니다.
- source_word: ὡσεὶ λίθου βολήν
  english_pob_choice: about a stone's throw
  chosen_korean: 돌을 던지는 거리쯤에서
  alternatives_korean:
  - 돌을 던질 만한 거리에서
  - 돌팔매 거리에서
  lexicon: ὡσεὶ + λίθου βολή
  rationale: 관용적 의미인 ‘돌 던질 거리’를 풀어 쓰되, 본문이 비유적 거리 표현임을 유지했습니다.
theological_decisions:
- issue: 폭력적 목자 이미지의 직접성
  chosen_reading: 사자가 아니라 ‘사자나 이리나 어떤 들짐승’이 양 떼를 공격할 때, 목자가 적극적으로 추격하여 죽이는 장면을 그대로 살렸습니다.
  alternative_readings:
  - 완화하여 ‘쫓아냈습니다’로 옮김
  - 비유적으로 ‘막아냈습니다’로 옮김
  rationale: 본문은 보호 행위를 넘어 추격·붙듦·내던짐·살해를 연속 동사로 제시하므로, 그 긴장과 강도를 약화하지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 본문 묘사의 서사적 사실성 유지
- issue: ‘양 떼/양 무리’의 선택
  chosen_reading: 집단성과 생동감을 살리기 위해 ‘양 떼’로 옮겼습니다.
  alternative_readings:
  - 양 무리
  - 양들
  rationale: ποίημνιον/ποίμνη는 목자가 돌보는 한 무리를 가리키므로, 한국어에서 가장 자연스럽고 구체적인 ‘양 떼’가 적합합니다.
  doctrine_reference: 목자-양 이미지의 보존
