revisions:
- from: 그러므로 저는 밤에 양 떼를 지켰습니다. 그리고 사자나 이리나 어떤 들짐승이 양 떼를 향해 올 때마다, 그것을 뒤쫓아가서 따라잡으면 제 손으로 그 발을 붙들고, 돌을 던지는 거리쯤에서 그것을 내던져 죽였습니다.
  to: 그러므로 저는 밤에 양 떼를 지키고 있었습니다. 사자나 이리나 어떤 들짐승이 양 떼를 향해 오면, 저는 그것을 뒤쫓아가 따라잡고 제 손으로 그 발을 붙든 뒤, 그것을 돌을 던질 만한 거리만큼 내던져 죽이곤 했습니다.
  rationale: 거리 표현을 원문의 목적격 거리 용법에 맞게 ‘돌을 던질 만한 거리만큼’으로 고쳤습니다. 또한 조건절과 과거 서술의 어색한 결합을 해소하고, 문맥상 반복되는 목자의 행동을 ‘죽이곤 했습니다’로 드러냈습니다. 폭력적 행위는 원문과 영어 감사 기록에 따라 완화하지 않았습니다.
  reviewer_model: gpt-5.6-terra
