id: T12P.GAD.1.5
reference: Testament of Gad 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Καὶ³⁴ ὑπέστρεψεν ἐν³⁵ Χεβρὼν πρὸς τὸν πατέρα ἡμῶν³⁶. καὶ ἀνέκλινεν *αὐτὸν πλησίον αὐτοῦ³⁷, ὅτι ἠγάπα αὐτὸν πάνυ³⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/005.yaml
  text: And he returned to Hebron to our father. And he made him recline near himself, because he loved him very much.
translation:
  language: ko
  text: 그는 헤브론으로 우리 아버지에게 돌아갔습니다. 그리고 그를 자기 곁에 눕게 하였는데, 그를 몹시 사랑하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψεν
  english_pob_choice: he returned
  chosen_korean: 돌아갔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 되돌아갔습니다
  lexicon: ὑποστρέφω
  rationale: 단순한 귀환 동작을 자연스럽게 옮겼습니다. 문맥상 목적지는 헤브론이므로 '되돌아왔습니다'보다 '돌아갔습니다'가 더 직관적입니다.
- source_word: Χεβρὼν
  english_pob_choice: Hebron
  chosen_korean: 헤브론
  alternatives_korean:
  - 헤브론
  lexicon: Χεβρών
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했습니다.
- source_word: ἀνέκλινεν αὐτὸν πλησίον αὐτοῦ
  english_pob_choice: he made him recline near himself
  chosen_korean: 그를 자기 곁에 눕게 하였습니다
  alternatives_korean:
  - 그를 자기 곁에 기대게 하였습니다
  - 그를 자기 곁에 앉히게 하였습니다
  lexicon: ἀνακλίνω + πλησίον
  rationale: 연회/식사 자리의 'recline'를 한국어로는 '눕게 하다'가 가장 직접적입니다. '곁에'는 πλησίον의 공간적 근접을 반영합니다.
- source_word: ἠγάπα αὐτὸν πάνυ
  english_pob_choice: because he loved him very much
  chosen_korean: 그를 몹시 사랑하였기 때문입니다
  alternatives_korean:
  - 그를 매우 사랑하였기 때문입니다
  - 그를 지극히 사랑하였기 때문입니다
  lexicon: ἀγαπάω + πάνυ
  rationale: 사랑의 강도를 나타내는 πάνυ를 '몹시'로 자연스럽게 옮겼습니다. 원문의 이유절 구조도 그대로 반영했습니다.
theological_decisions:
- issue: 연회/식사 동작을 'recline'로 유지할지 여부
  chosen_reading: '''눕게 하였습니다''로 옮겨, 고대 식사 관습의 동작을 드러냈습니다.'
  alternative_readings:
  - '''앉게 하였습니다'''
  - '''쉬게 하였습니다'''
  rationale: 본문의 ἀνέκλινεν은 단순한 휴식보다 식사 자리에서의 몸가짐을 가리킬 수 있으므로, 이를 완화하지 않고 반영했습니다.
  doctrine_reference: 문화적 배경 보존 원칙
