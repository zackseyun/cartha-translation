  text: So Joseph my brother was shepherding all the livestock with us for thirty days, and being young, he was weakened by the heat.
translation:
  language: ko
  text: 그러므로 내 형 요셉은 우리와 함께 삼십 일 동안 양을 치다가, 아직 젊어서 더위에 지쳤습니다.
  philosophy: formal
lexical_decisions:
- source_word: ἐποίμαινε
  english_pob_choice: was shepherding
  chosen_korean: 양을 치다가
  alternatives_korean:
  - 목양하다
  - 가축을 돌보다
  lexicon: ποιμαίνω
  rationale: 문맥상 목자로서 돌보는 행위를 가리키므로, 자연스러운 현대 한국어로 풀어 쓴 ‘양을 치다’가 가장 직접적입니다.
- source_word: μεθ’ ἡμῶν
  english_pob_choice: with us
  chosen_korean: 우리와 함께
  alternatives_korean:
  - 우리 가운데서
  - 우리와
  lexicon: μετά + gen.
  rationale: 동행과 공동 노동의 관계를 분명히 드러내기 위해 ‘우리와 함께’로 옮겼습니다.
- source_word: ἕως ἡμέρας τριάκοντα
  english_pob_choice: for thirty days
  chosen_korean: 삼십 일 동안
  alternatives_korean:
  - 서른 날 동안
  - 30일 동안
  lexicon: ἕως + 시간표현
  rationale: 기간의 지속을 자연스럽게 전달하는 표준 한국어 표현입니다.
- source_word: ὑπάρχων νέος
  english_pob_choice: being young
  chosen_korean: 아직 젊어서
  alternatives_korean:
  - 젊은 나이여서
  - 젊었으므로
  lexicon: ὑπάρχων + νέος
  rationale: 부가적 상태 설명을 살려, 나이와 그로 인한 취약성을 함께 드러내는 표현으로 옮겼습니다.
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  english_pob_choice: was weakened by the heat
  chosen_korean: 더위에 지쳤습니다
  alternatives_korean:
  - 더위로 쇠약해졌습니다
  - 폭염에 약해졌습니다
  lexicon: μαλακίζω + ὑπό
  rationale: ‘약해지다/쇠약해지다’의 의미를 담되, 한국어에서 자연스럽고 문맥상 충분히 강한 ‘지쳤습니다’로 표현했습니다.
