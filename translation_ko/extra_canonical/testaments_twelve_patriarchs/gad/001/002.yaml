  text: 'Listen, my children: I was the ninth son born to Jacob, and I was brave over the flocks.'
translation:
  language: ko
  text: 들으십시오, 내 자녀들아. 나는 야곱의 아홉째 아들로 태어났고, 양 떼에 대해 용맹하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  lexicon: ἀκούω
  rationale: 청중을 직접 부르는 명령형으로서 현대 합쇼체에서 가장 자연스럽고, 원문의 호소력을 유지합니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνον
  rationale: 직접 호칭의 친밀감을 살리면서도, 문맥상 성인 청중에게도 어울리는 다소 격식 있는 표현을 택했습니다.
- source_word: ἐγενόμην ἔννατος υἱός τῷ Ἰακώβ
  english_pob_choice: I was the ninth son born to Jacob
  chosen_korean: 나는 야곱의 아홉째 아들로 태어났고
  alternatives_korean:
  - 나는 야곱의 아홉째 아들이었고
  - 나는 야곱의 아홉째 아들로서 태어났고
  lexicon: ἔννατος υἱός
  rationale: ἔννατος는 서수로서 ‘아홉째’가 적절하고, γενόμην의 출생 뉘앙스를 살려 ‘태어났고’로 옮겼습니다.
- source_word: ἀνδρεῖος ἐπὶ τῶν ποιμνίων
  english_pob_choice: brave over the flocks
  chosen_korean: 양 떼에 대해 용맹하였습니다
  alternatives_korean:
  - 양 떼를 상대로 용감하였습니다
  - 양 떼 앞에서 용맹하였습니다
  lexicon: ἀνδρεῖος
  rationale: ἀνδρεῖος의 강한 용맹성을 살리되, ποιμνίων을 단순히 소유물처럼 처리하지 않고 대상 관계를 드러내기 위해 ‘대해’로 표현했습니다.
theological_decisions:
- issue: 직접 호칭의 문체
  chosen_reading: 명령형은 합쇼체로, 자기 진술은 평서형 합쇼체로 유지했습니다.
  alternative_readings:
  - 전부 반말체로 통일
  - 전체를 고전적 종결로 격상
  rationale: 본문은 아버지가 자녀들에게 말을 거는 구성이므로, 현대 한국어 독자에게 자연스럽게 전달되면서도 원문의 호소력을 유지하는 문체가 적절합니다.
  doctrine_reference: 문체/화행 보존
