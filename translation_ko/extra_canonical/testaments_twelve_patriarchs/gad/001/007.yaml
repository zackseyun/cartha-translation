id: T12P.GAD.1.7
reference: Testament of Gad 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. *Ἦν γὰρ ἰδὼν⁴⁶ ὅτι ἀρνα⁴⁷ ἐξειλάμην⁴⁸ *ἐκ τοῦ⁴⁹ στόματος τῆς⁵⁰ ἄρκου, κἀκείνην⁵¹ ἐθανάτωσα, *τὸν δὲ⁵² ἀρνὸν ἔθυσα· *περὶ οὗ ἐλυπούμην⁵³, ὅτι οὐκ *ἠδύνατο ζῆν⁵⁴, καὶ⁵⁵ ἐφάγομεν αὐτόν⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/007.yaml
  text: For he had seen that I rescued a lamb from the mouth of a bear, and I killed her, but I slaughtered the lamb — over which I grieved, because it could not live — and we ate it.
translation:
  language: ko
  text: 그가 본즉, 나는 곰의 입에서 어린 양 한 마리를 구해 냈고, 그 곰을 죽였으며, 그 어린 양은 잡아 죽였습니다. 나는 그 일로 마음 아파했는데, 그것이 살아 있을 수 없었기 때문입니다. 그리고 우리는 그것을 먹었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξειλάμην ἐκ τοῦ στόματος
  english_pob_choice: I rescued ... from the mouth
  chosen_korean: 입에서 ... 구해 냈고
  alternatives_korean:
  - 입에서 ... 건져 냈고
  - 입에서 ... 구출했고
  lexicon: ἐξαιρέω
  rationale: 동사 ἐξειλάμην은 단순한 '보다'가 아니라 위험한 곳에서 건져 내는 구출을 뜻하므로, ‘구해 내다’로 살렸습니다.
- source_word: ἄρκου
  english_pob_choice: bear
  chosen_korean: 곰
  alternatives_korean:
  - 반달곰
  - 큰곰
  lexicon: ἄρκτος
  rationale: 원문의 동물명은 일반적인 ‘곰’이 가장 직접적이며, 불필요한 세부 품종은 덧붙이지 않았습니다.
- source_word: τὸν δὲ ἀρνὸν ἔθυσα
  english_pob_choice: I slaughtered the lamb
  chosen_korean: 그 어린 양은 잡아 죽였습니다
  alternatives_korean:
  - 그 어린 양을 잡아 죽였습니다
  - 그 어린 양은 제물로 바쳤습니다
  lexicon: θύω
  rationale: θύω는 문맥상 도살/잡아 죽임을 뜻하며, 제의적 ‘바치다’로 좁히면 영어 POB의 의미를 넘길 수 있어 ‘잡아 죽이다’를 선택했습니다.
- source_word: ἐλυπούμην
  english_pob_choice: I grieved
  chosen_korean: 마음 아파했습니다
  alternatives_korean:
  - 슬퍼했습니다
  - 근심했습니다
  lexicon: λυπέω
  rationale: 문맥이 도덕적 비탄보다 애통함에 가깝기 때문에, 현대 한국어에서 자연스럽고 감정의 무게를 담는 ‘마음 아파하다’로 옮겼습니다.
theological_decisions:
- issue: 살아남기 어려운 어린 양을 죽인 뒤 함께 먹는 장면의 의미
  chosen_reading: 서술은 영웅담의 잔혹함이 아니라, 살 수 없게 된 생명을 두고도 애통해하는 내적 긴장을 함께 드러냅니다.
  alternative_readings:
  - 단순한 사냥 일화로만 읽기
  - 의례적 희생 제사로 읽기
  rationale: 원문과 영어 POB 모두 어린 양에 대한 애석함(ἐλυπούμην)을 강조하므로, 한국어에서도 그 정서를 희석하지 않고 살렸습니다.
  doctrine_reference: 서사적/윤리적 맥락
