id: T12P.GAD.1.1
reference: Testament of Gad 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: I. Ἀντίγραφον διαθήκης Γάδ², ἣ³ ἐλάλησε⁴ τοῖς υἱοῖς αὐτοῦ⁵ ἐν *τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς⁶ αὐτοῦ, *λέγων αὐτοῖς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/001.yaml
  text: 'The copy of the testament of Gad, which he spoke to his sons in the one hundred and twenty-fifth year of his life, saying to them:'
translation:
  language: ko
  text: 가드의 유언 사본입니다. 그는 자신의 생애 백이십오 년에 아들들에게 이것을 말하며 이렇게 이르렀습니다:[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον διαθήκης
  english_pob_choice: The copy of the testament
  chosen_korean: 유언 사본
  alternatives_korean:
  - 언약의 사본
  - 증언의 사본
  - 유언장 사본
  lexicon: ἀντίγραφον, διαθήκη
  rationale: ἀντίγραφον은 ‘사본’이 가장 सीधे하며, διαθήκη는 이 문맥에서 고유한 성경적 ‘언약’보다 한 인물의 최종 유언을 가리키는 제목이므로 영어 POB의 ‘testament’에 맞춰 ‘유언’으로 옮겼습니다.
- source_word: Γάδ
  english_pob_choice: Gad
  chosen_korean: 가드
  alternatives_korean:
  - 갓
  lexicon: 고유명사
  rationale: 이 항목은 족장 이름이 아니라 본문 제목의 인물명으로서, 현대 외래어 표기 관행에 따라 ‘가드’로 적었습니다.
- source_word: τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: his sons
  chosen_korean: 아들들에게
  alternatives_korean:
  - 그의 아들들에게
  - 아들들
  - 자녀들에게
  lexicon: υἱοί
  rationale: υἱοί는 문자적으로 ‘아들들’이므로, 제목 문맥에서 자연스러운 여격 표현인 ‘아들들에게’로 옮겼습니다.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the one hundred and twenty-fifth year of his life
  chosen_korean: 자신의 생애 백이십오 년에
  alternatives_korean:
  - 그의 생애 백이십오 년에
  - 나이 백이십오 살에
  - 살아온 지 백이십오 년째에
  lexicon: ἔτος, ζωή
  rationale: 직역보다 한국어 제목 문체에 맞는 ‘생애 백이십오 년에’가 자연스럽고, ‘자신의’는 αὐτοῦ의 소유 관계를 분명히 합니다.
- source_word: λέγων αὐτοῖς
  english_pob_choice: saying to them
  chosen_korean: 이렇게 이르렀습니다
  alternatives_korean:
  - 그들에게 말하며
  - 말하여 이르기를
  - 그들에게 말했습니다
  lexicon: λέγω
  rationale: 본문 도입 공식인 λέγων은 다음 직접화법을 여는 관용구이므로, 한국어에서는 매끄럽게 ‘이렇게 이르렀습니다’로 처리했습니다.
theological_decisions:
- issue: διαθήκη의 의미 범주
  chosen_reading: 이 제목에서는 ‘언약’보다 ‘유언’이 더 적절합니다.
  alternative_readings:
  - 언약
  - 언약서
  - 증언
  rationale: 공동체와 하나님 사이의 구속사적 ‘언약’이 아니라, 한 인물이 자녀들에게 남기는 최종 발화의 표제를 가리키므로 한국어 독자가 의도를 오해하지 않도록 ‘유언’으로 옮겼습니다.
  doctrine_reference: 본문 장르/문맥 판정
- issue: 직접화법 도입 방식
  chosen_reading: ‘λέγων αὐτοῖς’는 따옴표 없이 서술어로 풀어 시작했습니다.
  alternative_readings:
  - ‘말하여 이르기를’로 더 문자적으로 처리
  - 직접화법 기호를 바로 여는 방식
  rationale: 이 절은 제목문과 서문 성격이 강하므로, 한국어 읽기에서 더 자연스러운 문장 종결로 처리해도 원뜻을 보존합니다.
  doctrine_reference: 문체/담화 구조
