  text: And beyond this I was angry with Joseph until the day of his being sold.
translation:
  language: ko
  text: 이 일 외에도 나는 요셉이 팔린 날까지 그에게 원한을 품고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεκότουν
  english_pob_choice: I was angry
  chosen_korean: 분노하였습니다
  alternatives_korean:
  - 성내고 있었습니다
  - 원망하였습니다
  - 노여워하였습니다
  lexicon: ἐγκοτέω
  rationale: 지속적인 감정 상태를 나타내는 미완료 과거로 보고, 단순한 순간적 화보다 누적된 분노·원망의 뉘앙스를 살렸습니다.
- source_word: τῷ Ἰωσὴφ
  english_pob_choice: with Joseph
  chosen_korean: 요셉에게
  alternatives_korean:
  - 요셉을 향해
  - 요셉과
  lexicon: 요셉(고유명사)
  rationale: 전치사 τῷ는 여기서 대상/상대를 표시하므로 한국어는 자연스럽게 여격 조사 ‘에게’를 사용했습니다.
- source_word: ἕως ἡμέρας διαπράσεως αὐτοῦ
  english_pob_choice: until the day of his being sold
  chosen_korean: 그가 팔리던 날까지
  alternatives_korean:
  - 그가 팔린 날까지
  - 그의 매각 날까지
  - 그가 매매되던 날까지
  lexicon: διαπράσις
  rationale: διαπράσεως는 ‘팔림/매각됨’의 사건을 가리키므로 수동적 의미를 살리되, 한국어에서는 문맥상 자연스러운 ‘팔리던 날까지’로 옮겼습니다.
theological_decisions:
- issue: 구약 외전/가문 유언 전승의 1인칭 화자 처리
  chosen_reading: 화자가 자신의 내적 감정과 지속을 직접 고백하는 진술로 옮겼습니다.
  alternative_readings:
