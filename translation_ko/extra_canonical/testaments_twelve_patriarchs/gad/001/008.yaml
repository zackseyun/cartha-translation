  source_fidelity: 그리스어 ἐνεκότουν은 미완료 과거로, 요셉에 대해 지속적으로 품었던 분노·원망을 나타냅니다. 초안의 ‘분노하였습니다’는 뜻은 대체로 맞지만 지속성이 약하고, ‘팔리던 날’은 사건 진행 중의 뉘앙스를 더할 수 있어 명사구 ‘그가 팔린 날’이 διαπράσεως αὐτοῦ(그의 팔림/매각)의 완료된 사건을 더 직접적으로 반영합니다.
