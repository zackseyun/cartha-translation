  text: And Joseph told our father that the sons of Zilpah and Bilhah were slaughtering the best of the livestock and eating them without the consent of Reuben and Judah.
translation:
  language: ko
  text: 그리고 요셉이 우리 아버지에게 말하기를, 실라와 빌하의 아들들이 가장 좋은 가축을 잡아 제물로 바치고, 르우벤과 유다의 허락 없이 그것을 먹고 있었습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ ΓΖέλφας καὶ Βάλλας
  english_pob_choice: the sons of Zilpah and Bilhah
  chosen_korean: 실라와 빌하의 아들들
  alternatives_korean:
  - 질바와 빌하의 아들들
  - 실바와 빌하의 아들들
  lexicon: 고유명사 음역
  rationale: 본문 인명은 한국어 성서 독자에게 익숙한 통용형을 우선하되, 그리스어 표기와 영어 POB의 Zilpah/Bilhah를 반영해 식별 가능하게 옮겼습니다.
- source_word: θύουσι
  english_pob_choice: were slaughtering
  chosen_korean: 잡아 제물로 바치고
  alternatives_korean:
  - 도살하고
  - 희생시키고
  lexicon: θύω
  rationale: θύω는 단순 도살보다 제의적·희생적 뉘앙스가 있어, 영어의 slaughtering을 유지하되 한국어에서는 의미 범위를 드러내는 표현으로 옮겼습니다.
- source_word: τὰ καλὰ θρέμματα
  english_pob_choice: the best of the livestock
  chosen_korean: 가장 좋은 가축
  alternatives_korean:
  - 좋은 가축
  - 가장 좋은 가축 떼
  lexicon: θρέμμα
  rationale: θρέμματα는 기른 가축을 가리키므로 ‘가축’으로 옮기고, τὰ καλὰ의 비교적 평가를 ‘가장 좋은’으로 표현했습니다.
- source_word: παρὰ γνώμην Ῥουβὶμ καὶ Ἰούδα
  english_pob_choice: without the consent of Reuben and Judah
  chosen_korean: 르우벤과 유다의 허락 없이
  alternatives_korean:
  - 르우벤과 유다의 뜻 없이
  - 르우벤과 유다의 의견 없이
  lexicon: γνώμη
  rationale: γνώμη는 단순 의견보다 승인·동의의 의미가 강하므로, 문맥상 자연스러운 ‘허락’으로 옮겼습니다.
theological_decisions:
- issue: θύουσι의 제의적 뉘앙스와 서술 맥락
  chosen_reading: 가축을 ‘잡아 제물로 바치고’로 옮겨, 단순 도살이 아니라 희생 행위의 성격을 드러냈습니다.
  alternative_readings:
  - ‘도살하고’로 중립화
  - ‘희생시키고’로 더 직역
  rationale: 그리스어 θύω는 희생 제의와 연결될 수 있어, 본문이 비난하는 행위의 성격을 살리되 과도한 신학화는 피했습니다.
  doctrine_reference: 제의적 동사 θύω의 일반적 헬라어 용례
- issue: 장소·인물 명칭의 통용형 사용
  chosen_reading: 실라를 사용해 본문 인명을 한국어 독자에게 읽기 쉽게 했습니다.
  alternative_readings:
  - 질바
  - 실바
  rationale: 외래어 표기 관행상 여러 전사 가능성이 있으나, 본문 식별성과 읽기 유창성을 우선했습니다.
  doctrine_reference: 고유명사 음역 원칙
