  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009.yaml
  text: 'And after commanding them many such things[[Here begins ...]], he urged them to carry his bones to Hebron and bury him with his fathers.


    2. And after eating and drinking with gladness of soul, he covered his face and died.


    3. And his sons did in every respect all that Naphtali their father had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.]'
  footnotes:
  - marker: '[Here begins ...]'
    text: 'The Greek source for this chapter closes with the incipit of the next work: ''Testament of Gad, the ninth son of Jacob and Zilpah.'' It is preserved here as a transition note rather than treated as part of Naphtali''s final words.'
    reason: textual_variant
translation:
  language: ko
  text: '그리고 그가 그들에게 이런 많은 것들을 명령한 뒤에, 자기 뼈를 헤브론으로 옮겨 가서 그의 조상들과 함께 장사하라고 권면했습니다.


    2. 그리고 기쁨으로 마음에 먹고 마신 뒤에, 그는 얼굴을 가리고 죽었습니다.


    3. 그의 아들들은 나프탈리가 자기 아버지로서 그들에게 명령한 모든 것을 빠짐없이 그대로 행했습니다.


    [여기서 가드의 증언이 시작됩니다. 야곱과 실바의 아들 가운데 아홉째인 가드의 증언입니다.][a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντειλάμενος
  english_pob_choice: after commanding
  chosen_korean: 명령한 뒤에
  alternatives_korean:
  - 지시한 뒤에
  - 명한 뒤에
  lexicon: BDAG
  rationale: 죽어 가는 아버지가 자녀들에게 최종 지시를 내리는 문맥이므로, POB의 ‘commanding’을 따라 binding force를 드러내는 ‘명령하다’가 가장 정확합니다.
- source_word: παρεκάλεσεν
  english_pob_choice: he urged
  chosen_korean: 권면했습니다
  alternatives_korean:
  - 촉구했습니다
  - 간청했습니다
  lexicon: BDAG
  rationale: 여기서는 단순한 명령 반복보다 간절한 권고의 뉘앙스가 강하므로, 합쇼체에서 자연스럽고도 힘 있는 ‘권면하다’로 옮겼습니다.
- source_word: τὰ ὀστᾶ αὐτοῦ
  english_pob_choice: his bones
  chosen_korean: 자기 뼈
  alternatives_korean:
  - 그의 유해
  - 그의 유골
  lexicon: BDAG
  rationale: 본문이 추상적인 ‘유해’가 아니라 구체적으로 ‘뼈’를 말하므로, 장례 관습의 물리성을 살리기 위해 직역적으로 유지했습니다.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들 곁에
  lexicon: BDAG
  rationale: 히브리계 장례 관용구를 한국어에서 가장 자연스럽게 전달하면서도, 단순한 공간적 의미로 축소되지 않도록 ‘조상들과 함께’로 옮겼습니다.
- source_word: ἐν ἱλαρότητι ψυχῆς
  english_pob_choice: with gladness of soul
  chosen_korean: 기쁨으로 마음에
  alternatives_korean:
  - 영혼의 기쁨으로
  - 마음의 즐거움으로
  lexicon: LSJ
  rationale: ‘ψυχή’의 내적 상태를 드러내는 표현이므로, 한국어에서는 고풍스럽지 않으면서도 심층적 정서를 나타내는 ‘마음에 기쁨으로’로 옮겼습니다.
theological_decisions:
- issue: 장례 명령과 죽음 서술의 톤
  chosen_reading: 죽음을 미화하거나 상징화하지 않고, 조상들과의 합장 요청과 얼굴을 가리고 죽는 장면을 담담하게 서술했습니다.
  alternative_readings:
  - 장례 신학을 강조해 해석적으로 풀기
  - 죽음을 완곡하게 바꾸기
  rationale: 본문은 족장 전승의 역사적·서사적 장면으로 제시되므로, 장례 관습과 임종의 사실성을 그대로 드러내는 것이 source-direct합니다.
  doctrine_reference: transparency principle; genealogical burial idiom
- issue: 말미의 다음 작품 시작 문구
  chosen_reading: 대괄호로 구분된 전환 주석으로 보존했습니다.
  alternative_readings:
  - 본문에서 삭제
  - 서술문처럼 본문에 흡수
  rationale: 그리스어 전승에 포함된 전환 표지를 투명하게 드러내되, 나프탈리의 마지막 말과는 구분해야 하므로 괄호 처리했습니다.
  doctrine_reference: paratext transparency; source-note handling
