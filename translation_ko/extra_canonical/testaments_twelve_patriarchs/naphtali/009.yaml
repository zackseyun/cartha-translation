  naturalness: 초안에는 '자기 뼈를 헤브론으로 옮겨 가서', '기쁨으로 마음에 먹고 마신' 등 현대 표준 한국어로 비문이거나 의미 관계가 불분명한 표현이 있습니다. 이를 현대적 합쇼체 서술문으로 바로잡았습니다.
