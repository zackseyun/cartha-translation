base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003.yaml
  text: '1. So then, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls. For if, in purity of heart, you keep silence, you will understand how to hold fast the will of God and to cast away the will of Beliar.


    2. The sun and the moon and the stars do not alter their appointed order; so you also must not alter the law of God through the disorder of your deeds.


    3. The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.


    4. But you, my children, must not be so. Rather, know in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.


    5. In the same way also the Watchers changed the order of their nature, and the Lord cursed them at the time of the flood; because of them he made the earth desolate and without fruit.'
translation:
  language: ko
  text: 그러므로 탐욕으로 너희 행위를 더럽히려 하거나, 헛된 말로 너희 영혼을 속이려 하지 마십시오. 마음이 깨끗할 때 잠잠히 있으면, 하나님의 뜻을 붙들고 베리아르의 뜻을 버리는 법을 깨닫게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδάζετε ἐν πλεονεξίᾳ διαφθεῖραι τὰς πράξεις ὑμῶν
  english_pob_choice: do not be eager in greed to corrupt your deeds
  chosen_korean: 탐욕으로 너희 행위를 더럽히려 하거나
  alternatives_korean:
  - 탐욕 가운데 너희 행위를 망치려 하거나
  - 욕심으로 너희 행실을 부패시키려 하거나
  lexicon: πλεονεξία / διαφθείρω
  rationale: σπουδάζετε는 단순한 속도보다 ‘열심히/간절히 하다’의 뉘앙스가 있어 부정문에서 의도적 추구를 나타내는 표현으로 옮겼고, διαφθεῖραι는 행위를 ‘더럽히다/망치다’ 중 문맥상 도덕적 오염을 드러내는 ‘더럽히다’로 옮겼습니다.
- source_word: λόγοις κενοῖς ἀπατᾶν τὰς ψυχὰς ὑμῶν
  english_pob_choice: by empty words to deceive your souls
  chosen_korean: 헛된 말로 너희 영혼을 속이려 하지 마십시오
  alternatives_korean:
  - 빈말로 너희 영혼을 속이려 하지 마십시오
  - 공허한 말로 너희 혼을 속이려 하지 마십시오
  lexicon: λόγοις κενοῖς / ἀπατάω / ψυχή
  rationale: λόγοις κενοῖς는 관용적으로 ‘헛된 말’이 자연스럽고, ψυχαί는 여기서 인격 전체를 가리키므로 ‘영혼’으로 두되 한국어 어감이 지나치게 영지주의적으로 기울지 않도록 간결하게 처리했습니다.
- source_word: καθαρότητι καρδίας ... συνήσετε τὸ θέλημα τοῦ Θεοῦ κρατεῖν ... καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ
  english_pob_choice: in purity of heart, you will understand how to hold fast the will of God and to cast away the will of Beliar
  chosen_korean: 마음이 깨끗할 때 잠잠히 있으면, 하나님의 뜻을 붙들고 베리아르의 뜻을 버리는 법을 깨닫게 될 것입니다
  alternatives_korean:
  - 마음의 순결 가운데 침묵하면, 하나님의 뜻을 굳게 붙들고 베리아르의 뜻을 내던지는 법을 알게 될 것입니다
  - 마음의 깨끗함으로 조용히 있으면, 하나님의 뜻을 지키고 베리아르의 뜻을 버리는 법을 이해하게 될 것입니다
  lexicon: καθαρότης καρδίας / συνίημι / κρατέω / ἀπορρίπτω
  rationale: καθαρότητα καρδίας는 직역적인 ‘마음의 순결’도 가능하지만 한국어에서는 내면 상태를 드러내는 ‘마음이 깨끗할 때’가 자연스럽고, σιωπῶντες의 수단적 뉘앙스를 ‘잠잠히 있으면’으로 살렸습니다. κρατεῖν은 ‘붙들다’가 가장 직접적이며, ἀπορρίπτειν은 ‘버리다’가 도덕적 결단을 잘 전달합니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 베리아르
  alternatives_korean:
  - 벨리알
  - 베리아르
  lexicon: Βελίαρ
  rationale: 고유명사는 현대 외래어 표기법에 맞춰 ‘베리아르’로 옮겨 음가를 살렸고, 전통적 표기와의 혼동을 줄이기 위해 본문에는 한 형태만 사용했습니다.
theological_decisions:
- issue: ἀπόρριψις τὸ θέλημα τοῦ Βελίαρ의 대립 구조
  chosen_reading: 하나님의 뜻을 붙드는 것과 베리아르의 뜻을 버리는 것은 병렬된 윤리적/영적 선택으로 유지했습니다.
  alternative_readings:
  - 베리아르의 뜻을 ‘악한 뜻’으로 일반화하는 읽기
  - 문장을 단순 도덕훈으로 약화시키는 읽기
  rationale: 본문은 하나님의 뜻과 베리아르의 뜻을 명시적으로 대조하므로, 악의 인격적/우주적 대립을 흐리지 않고 그대로 유지하는 것이 원문 의미에 충실합니다.
  doctrine_reference: 제2성전기 유대 문헌의 이원론적 대조어법
- issue: σιωπῶντες ἐν καθαρότητι καρδίας의 번역 톤
  chosen_reading: ‘잠잠히 있으면’으로 옮겨 침묵의 실천이 분별로 이어진다는 논리를 살렸습니다.
  alternative_readings:
  - ‘침묵하면’
  - ‘말을 삼가면’
  rationale: 이 구절은 단순 금언이 아니라 침묵과 내적 순결이 하나님의 뜻 분별로 연결된다는 수사 구조를 가지므로, 행위의 지속성을 드러내는 조건법 표현을 택했습니다.
  doctrine_reference: 지혜 문학적 권면과 윤리적 분별
