  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. Καὶ²⁵ ἡμεῖς²⁶ χειμαζόμενοι ἐπὶ τὸ πέλαγος *ἐφερόμεθα, καὶ²⁷ ἐπληρώθη τὸ πλοῖον ὑδάτων²⁸, *ἐν τρικυμίαις²⁹ περιρησσόμενον³⁰, ὥστε³¹ *καὶ συντρίβεσθαι³² αὐτό³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/005.yaml
  text: And we, being storm-tossed on the sea, were being driven over the waters, and the ship was filled and battered in the storms, so that it was in danger of breaking apart.
translation:
  language: ko
  text: 그리고 우리도 바다에서 폭풍을 만나 파도에 떠밀렸으며, 배는 폭풍 속에서 물로 가득 차 부서질 지경이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμαζόμενοι
  english_pob_choice: being storm-tossed
  chosen_korean: 폭풍을 만나 파도에 떠밀렸으며
  alternatives_korean:
  - 폭풍에 휩쓸리며
  - 풍랑에 시달리며
  lexicon: χειμάζω
  rationale: 단순히 ‘파도에 흔들리다’보다 외부의 거센 폭풍과 수동적 휩쓸림을 함께 드러내는 표현이 원문의 상황을 더 잘 살립니다.
- source_word: ἐπὶ τὸ πέλαγος
  english_pob_choice: on the sea
  chosen_korean: 바다에서
  alternatives_korean:
  - 바다 위에서
  - 바다 한복판에서
  lexicon: πέλαγος
  rationale: πέλαγος는 넓은 바다를 가리키므로, 한국어로는 자연스럽게 ‘바다에서’라고 옮겨 원문의 장면감을 유지했습니다.
- source_word: ἐφερόμεθα
  english_pob_choice: were being driven
  chosen_korean: 떠밀렸으며
  alternatives_korean:
  - 이끌려 갔으며
  - 몰려가고 있었으며
  lexicon: φέρω
  rationale: 수동 진행의 의미를 살려 배가 스스로 나아간 것이 아니라 외력에 의해 계속 밀려가고 있음을 나타냈습니다.
- source_word: ἐπληρώθη τὸ πλοῖον ὑδάτων
  english_pob_choice: the ship was filled
  chosen_korean: 배는 … 물로 가득 차
  alternatives_korean:
  - 배는 물로 가득 차
  - 배 안이 물로 가득 차
  lexicon: πληρόω
  rationale: ‘배가 물로 채워졌다’는 직접적 의미를 살리면서, 선박 전체가 물에 잠길 듯한 위태로움을 한국어로 자연스럽게 표현했습니다.
- source_word: ὥστε καὶ συντρίβεσθαι αὐτό
  english_pob_choice: so that it was in danger of breaking apart
  chosen_korean: 부서질 지경이 되었습니다
  alternatives_korean:
  - 산산조각 날 지경이 되었습니다
  - 깨질 듯했습니다
  lexicon: συντρίβω
  rationale: 원문의 결과절은 실제 분해 직전의 위기를 말하므로, ‘부서질 지경’으로 긴박함을 유지했습니다.
