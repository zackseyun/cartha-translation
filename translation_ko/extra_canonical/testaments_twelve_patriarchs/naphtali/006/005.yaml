    rationale: 원문은 배가 물로 찬 사실과 더불어, 거센 파도 속에서 사방으로 타격을 받는 상태를 명시합니다. 이 구절을 보완해야 원문의 재난 장면과 인과 관계가 충실히 전달됩니다.
