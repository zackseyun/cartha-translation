    issue: εἰσήλθομεν에 ‘들어가자마자’를 적용함
    rationale: ὡς δὲ ἡμεῖς εἰσήλθομεν은 ‘우리가 들어갔을 때/들어간 뒤’라는 시간 절이며, ‘-자마자’의 강한 즉시성은 원문에 명시되지 않았습니다.
  - severity: low
    issue: λαῖλαψ ἀνέμου μέγας의 한국어 어순
    rationale: ‘강한 바람 회오리’보다 ‘거센 회오리바람’이 자연스럽고, 강한 바람의 소용돌이라는 원문의 이미지를 잘 전달합니다.
  - severity: high
    issue: αὐχένας를 무각주로 ‘키’로 확정
    rationale: αὐχήν의 일반적 의미는 ‘목’이며, 이 문맥에서는 조타 장치로 이해될 수 있으나 본문이 난해합니다. 영어 POB처럼 독자가 문자적 의미와 문맥적 해석의 긴장을 알 수 있도록 각주가 필요합니다.
