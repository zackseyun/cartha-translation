id: T12P.NAP.6.4
reference: Testament of Naphtali 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. *Ὡς δὲ ἡμεῖς εἰσήλθομεν¹⁶ γίνεται¹⁷ χειμὼν σφοδρός¹⁸, καὶ λαῖλαψ ἀνέμου¹⁹ μέγας²⁰, καὶ ἀφίσταται²¹ ὁ πατὴρ ἡμῶν²² ἀφʼ ἡμῶν, ὁ²³ κρατῶν *τοὺς αὐχένας²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/004.yaml
  text: And when we had entered, a violent storm arose, and a whirlwind of wind; and our father withdrew from us, holding the rudders[b].
  footnotes:
  - marker: b
    text: The Greek phrase rendered 'holding the rudders' is textually difficult; the underlying word literally means 'necks' in ordinary usage, but the context appears nautical.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 우리가 들어가자마자, 심한 폭풍이 일어나고 강한 바람 회오리가 일어났으며, 우리의 아버지는 우리에게서 물러나셨고, 키를 붙들고 계셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσήλθομεν
  english_pob_choice: when we had entered
  chosen_korean: 우리가 들어가자마자
  alternatives_korean:
  - 우리가 들어갔을 때
  - 우리가 들어간 뒤
  lexicon: εἰσέρχομαι
  rationale: 과거 완료의 진입 상황을 한국어에서 자연스럽게 살리기 위해 ‘들어가자마자’로 옮겨, 뒤이어 일어난 돌발 상황과의 긴밀한 선후관계를 드러냈습니다.
- source_word: χειμὼν σφοδρός
  english_pob_choice: a violent storm
  chosen_korean: 심한 폭풍
  alternatives_korean:
  - 거센 폭풍
  - 격렬한 폭풍
  lexicon: χειμών / σφοδρός
  rationale: 바람과 파도 상황에서 단순한 ‘폭풍’보다 강도를 분명히 하도록 ‘심한’을 붙였고, ‘violent’의 물리적 격렬함을 과장 없이 전달했습니다.
- source_word: λαῖλαψ ἀνέμου μέγας
  english_pob_choice: a whirlwind of wind
  chosen_korean: 강한 바람 회오리
  alternatives_korean:
  - 큰 바람 회오리
  - 거센 회오리바람
  lexicon: λαῖλαψ / ἄνεμος / μέγας
  rationale: 직역하면 중복처럼 들릴 수 있으나, 원문의 중첩된 강풍 이미지를 보존하기 위해 ‘바람 회오리’로 옮기고 ‘강한’으로 세기를 유지했습니다.
- source_word: τοὺς αὐχένας
  english_pob_choice: the rudders
  chosen_korean: 키를
  alternatives_korean:
  - 노를
  - 키손잡이를
  lexicon: αὐχήν
  rationale: 본문은 본래 ‘목/목덜미’ 뜻이지만, 영어 POB의 판정과 문맥상 항해 비유를 따라 조타 장치로 이해하여 한국어에선 가장 자연스러운 ‘키’로 번역했습니다.
theological_decisions:
- issue: 아버지의 이동 표현 ἀφίσταται
  chosen_reading: “물러나셨고”로 옮겨, 단순한 공간 분리보다 떠남의 동작성을 살렸습니다.
  alternative_readings:
  - 떠나셨고
  - 우리에게서 떨어지셨고
  rationale: 동사 ἀφίσταμαι는 ‘떠나다/물러나다/물러서다’의 뉘앙스를 가지므로, 관계적 분리와 이동을 함께 드러내는 ‘물러나셨고’가 가장 균형적입니다.
  doctrine_reference: 서사적 동작 의미 보존
- issue: ‘our father’의 존칭 처리
  chosen_reading: 서술체는 합쇼체를 유지하되, 문맥상 인물인 ‘아버지’는 일반 서사 존칭으로 처리했습니다.
  alternative_readings:
  - 우리 아버지는 우리에게서 물러나셨고
  - 아버지께서는 우리에게서 물러나셨고
  rationale: 기도문이나 직접 호칭이 아니므로 과도한 경어를 피하고, 서사 흐름을 해치지 않는 수준에서 ‘아버지’와 과거 서술을 유지했습니다.
  doctrine_reference: 문체 일관성
