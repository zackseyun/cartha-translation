id: T12P.NAP.6.1
reference: Testament of Naphtali 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VI. *Καὶ πάλιν¹ μετὰ ἡμέρας² ἑπτὰ εἶδον *ὅτι ὁ πατὴρ μου Ἰακὼβ ἴστατο³ ἐν τῇ θαλάσσῃ Ἀμνείας⁴, καὶ ἡμεῖς⁵ σὺν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/001.yaml
  text: And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him.
  footnotes:
  - marker: a
    text: The place-name 'Amnia' is uncertain in identification; the translation preserves the Greek form rather than conjecturing a location.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 다시, 칠 일 후에 나는 내 아버지 야곱이 아므니아의 바다 곁에 서 계신 것을 보았고, 우리는 그와 함께 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ πάλιν μετὰ ἡμέρας ἑπτὰ
  english_pob_choice: And again, after seven days
  chosen_korean: 그리고 다시, 칠 일 후에
  alternatives_korean:
  - 그리고 또, 이레 후에
  - 그리고 다시, 7일 뒤에
  lexicon: ἑπτά / χρονική 표현
  rationale: ‘μετὰ ἡμέρας ἑπτὰ’는 직역상 ‘칠 일 후에’가 자연스럽고, 반복 부사 πάλιν은 ‘그리고 다시’로 살렸습니다.
- source_word: ὁ πατὴρ μου Ἰακώβ
  english_pob_choice: my father Jacob
  chosen_korean: 내 아버지 야곱
  alternatives_korean:
  - 나의 아버지 야곱
  - 내 아비 야곱
  lexicon: πατήρ
  rationale: 고전적 존칭을 과도하게 높이지 않고, 서술 문맥에 맞는 표준어 ‘아버지’를 사용했습니다.
- source_word: ἐν τῇ θαλάσσῃ Ἀμνείας
  english_pob_choice: by the sea of Amnia
  chosen_korean: 아므니아의 바다 곁에
  alternatives_korean:
  - 아므니아 바닷가에
  - 아므니아 호숫가에
  lexicon: θάλασσα
  rationale: POB가 지명을 확정하지 않고 음역을 보존한 점을 따라 ‘아므니아’를 유지했고, ἐν + 여격은 위치를 나타내므로 ‘곁에’로 자연스럽게 옮겼습니다.
- source_word: ἡμεῖς σὺν αὐτῷ
  english_pob_choice: we were with him
  chosen_korean: 우리는 그와 함께 있었습니다
  alternatives_korean:
  - 우리가 그와 함께 있었습니다
  - 우리는 그와 동행했습니다
  lexicon: σύν
  rationale: σὺν αὐτῷ의 동반 관계를 직접적으로 드러내기 위해 ‘그와 함께’로 옮겼습니다.
theological_decisions:
- issue: 시점 서술의 단순한 환시/몽상 표현
  chosen_reading: 이 구절은 예언적 환상/꿈 서술로서, 서술 시제는 과거형을 유지하되 신비적 체험을 과장하지 않았습니다.
  alternative_readings:
  - 상징적 비전으로 강하게 풀어 쓰기
  - 단순한 역사적 사건처럼 평서화하기
  rationale: 원문은 ‘나는 보았다’는 1인칭 환시 보고 형식이므로, 한국어도 동일한 체험 보고의 톤을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 서술 장르 보존 원칙
