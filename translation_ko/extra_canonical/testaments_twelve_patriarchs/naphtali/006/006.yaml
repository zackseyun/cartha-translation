  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/006.yaml
  text: But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together.
translation:
  language: ko
  text: 그런데 요셉은 작은 배를 타고 떠났고, 우리는 아홉 개의 판자 위에서 갈라졌습니다. 레위와 유다는 함께 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ Ἰωσὴφ ἐπὶ ἀκατίῳ ἐπορεύθη
  english_pob_choice: Joseph went away on a small boat
  chosen_korean: 요셉은 작은 배를 타고 떠났고
  alternatives_korean:
  - 요셉은 작은 배로 갔고
  - 요셉은 작은 배 위로 갔고
  lexicon: ἀκάτιον
  rationale: ἀκάτιον은 작은 배/보트의 뜻이므로, 문맥에 맞게 ‘작은 배를 타고’로 옮겨 자연스러운 서술을 살렸습니다.
- source_word: διεχωρίσθημεν ἐπὶ σανίδων ἐννέα
  english_pob_choice: we were separated on nine planks
  chosen_korean: 우리는 아홉 개의 판자 위에서 갈라졌습니다
  alternatives_korean:
  - 우리는 아홉 판자 위에서 나뉘었습니다
  - 우리는 아홉 개의 널빤지로 나뉘었습니다
  lexicon: σανίδες
  rationale: σανίδες는 판자/널빤지이므로, 숫자와 함께 직역에 가깝게 ‘아홉 개의 판자’로 처리했습니다.
- source_word: Λευὶ δὲ καὶ Ἰούδας ἦσαν ἐπὶ τὸ αὐτό
  english_pob_choice: Levi and Judah were together
  chosen_korean: 레위와 유다는 함께 있었습니다
  alternatives_korean:
  - 레위와 유다는 같은 곳에 있었습니다
  - 레위와 유다는 한곳에 있었습니다
  lexicon: ἐπὶ τὸ αὐτό
  rationale: 관용구 ἐπὶ τὸ αὐτό는 ‘함께, 한데’의 뜻이므로, 간결하게 ‘함께 있었습니다’로 옮겼습니다.
