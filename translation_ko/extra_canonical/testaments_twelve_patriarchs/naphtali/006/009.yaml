id: T12P.NAP.6.9
reference: Testament of Naphtali 6:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Ὡς δὲ ἐπαύσατο ὁ χειμών, *ἔφθασε τὸ σκάφος ἐπὶ τῆς γῆς⁴⁶, Γὥσπερ⁴⁷ ἐν εἰρήνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/009.yaml
  text: And when the winter ceased, the ship came to the land, as it were in peace.
translation:
  language: ko
  text: 그러나 겨울이 그치자 배가 땅에 이르렀습니다 — 마치 평화로운 듯이.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμών
  english_pob_choice: winter
  chosen_korean: 겨울
  alternatives_korean:
  - 추위
  - 겨울철
  - 폭풍
  lexicon: χειμών
  rationale: 영어 POB가 최신 수정에서 'winter'로 확정했으므로, 계절적 의미를 살려 '겨울'로 옮겼습니다. '폭풍'은 본문 의미를 벗어나므로 배제했습니다.
- source_word: ἐπαύσατο
  english_pob_choice: ceased
  chosen_korean: 그치자
  alternatives_korean:
  - 멈추자
  - 끝나자
  - 사라지자
  lexicon: παύω
  rationale: 상태가 멈추고 끝나는 뉘앙스를 자연스럽게 살리기 위해 '그치자'를 선택했습니다.
- source_word: ἔφθασε τὸ σκάφος ἐπὶ τῆς γῆς
  english_pob_choice: the ship came to the land
  chosen_korean: 배가 땅에 이르렀습니다
  alternatives_korean:
  - 배가 육지에 닿았습니다
  - 배가 땅에 도착했습니다
  - 배가 뭍에 이르렀습니다
  lexicon: φθάνω
  rationale: ἔφθασε의 도달/이름을 반영해 '이르렀습니다'로 직역에 가깝게 옮겼고, '땅'은 ἐπὶ τῆς γῆς의 평이한 대응으로 유지했습니다.
- source_word: ἐν εἰρήνῃ
  english_pob_choice: as it were in peace
  chosen_korean: 마치 평화로운 듯이
  alternatives_korean:
  - 평화 가운데
  - 평안히
  - 평화 속에서
  lexicon: εἰρήνη
  rationale: ὡσπερ/Γὥσπερ의 비교적·완곡한 표현을 살리기 위해 '마치 … 듯이' 구조를 사용했고, εἰρήνη는 POB 기본어휘에 따라 '평화'로 번역했습니다.
theological_decisions:
- issue: 비유적 비교 표현의 강도
  chosen_reading: 직설적 단정이 아니라 '마치 평화로운 듯이'라는 완곡한 비교로 유지했습니다.
  alternative_readings:
  - 평화롭게
  - 평화 가운데
  rationale: 본문의 ὡσπερ가 비교/유사성을 표시하므로, 사건을 평화 그 자체로 단정하기보다 그와 같은 상태였음을 드러내는 것이 원문에 더 가깝습니다.
  doctrine_reference: 수사적 비교의 보존
