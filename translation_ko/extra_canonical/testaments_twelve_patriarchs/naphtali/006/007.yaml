lexical_decisions:
- source_word: Καὶ διεσπάρημεν πάντες
  english_pob_choice: And we were scattered, all of us
  chosen_korean: 그리고 우리는 모두 … 흩어졌습니다
  alternatives_korean:
  - 그리고 우리 모두가 흩어졌습니다
  - 그리고 우리는 모두 뿔뿔이 흩어졌습니다
  lexicon: διασπείρω
  rationale: 수동형 과거의 의미를 자연스럽게 살리면서, 주체가 공동체 전체임을 πάντες로 반영하기 위해 ‘우리’를 앞세우고 ‘모두’로 강조했습니다.
- source_word: εἰς τὰ πέρατα τῆς γῆς
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅의 끝까지
  alternatives_korean:
  - 땅 끝까지
  - 세상의 끝까지
  lexicon: πέρατα τῆς γῆς
  rationale: 직역에 가깝게 ‘땅의 끝’이라는 공간적 이미지를 유지해, 영어 POB가 덧붙인 상징 가능성은 해석으로 과도하게 밀어넣지 않았습니다.
