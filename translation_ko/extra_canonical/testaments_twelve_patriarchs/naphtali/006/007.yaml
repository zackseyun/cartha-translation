  alternative_readings:
  - 이스라엘의 흩어짐을 예표하는 상징적 표현으로 풀어 쓰기
  rationale: 영어 POB가 이 표현의 상징 가능성을 주석으로만 언급하므로, 본문에서는 꿈속 서술의 직접성을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 서술 본문과 해석 주석의 구분 원칙
