translation:
  language: ko
  text: 그리고 우리는 모두 땅의 끝까지 흩어졌습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ‘땅의 끝까지’ 흩어졌다는 표현은 흩어짐을 상징적으로 나타낼 수도 있으나, 본문은 이를 납달리의 꿈의 일부로 제시합니다.
    reason: 영어 POB 각주의 내용을 한국어로 제공하여 앵커와 각주를 대응시키고, 상징성은 가능성으로만 유지합니다.
lexical_decisions:
- source_word: Καὶ διεσπάρημεν πάντες
  english_pob_choice: And we were scattered, all of us
  chosen_korean: 그리고 우리는 모두 … 흩어졌습니다
  alternatives_korean:
  - 그리고 우리 모두가 흩어졌습니다
  - 그리고 우리는 모두 뿔뿔이 흩어졌습니다
  lexicon: διασπείρω
  rationale: 수동형 과거의 의미를 자연스럽게 살리면서, 주체가 공동체 전체임을 πάντες로 반영하기 위해 ‘우리’를 앞세우고 ‘모두’로 강조했습니다.
- source_word: εἰς τὰ πέρατα τῆς γῆς
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅의 끝까지
  alternatives_korean:
  - 땅 끝까지
  - 세상의 끝까지
  lexicon: πέρατα τῆς γῆς
  rationale: 직역에 가깝게 ‘땅의 끝’이라는 공간적 이미지를 유지해, 영어 POB가 덧붙인 상징 가능성은 해석으로 과도하게 밀어넣지 않았습니다.
theological_decisions:
- issue: ‘땅의 끝’ 표현의 상징성
  chosen_reading: 본문의 서술을 유지하되, 상징적 분산 가능성은 본문 밖 해석으로 남깁니다.
  alternative_readings:
  - 이스라엘의 흩어짐을 예표하는 상징적 표현으로 풀어 쓰기
  rationale: 영어 POB가 이 표현의 상징 가능성을 주석으로만 언급하므로, 본문에서는 꿈속 서술의 직접성을 보존하는 쪽이 원문에 충실합니다.
  doctrine_reference: 서술 본문과 해석 주석의 구분 원칙
