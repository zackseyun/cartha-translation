revisions:
- from: 보라, 배 한 척이 우리 곁으로 항해해 오고 있었는데, 선원들과 조타수들이 타고 있었습니다. 그리고 그 배에는 이렇게 적혀 있었습니다. 「야곱의 배」.[a][b]
  to: 보십시오, 배 한 척이 선원과 조타수도 없이 항해하며 오고 있었습니다. 그 배에는 ‘야곱의 배’라고 적혀 있었습니다.
  rationale: 원문 ἐκτὸς의 배제 의미를 ‘선원과 조타수도 없이’로 바로잡고, 원문에 없는 ‘우리 곁으로’를 제거했습니다. ἤρχετο와 현재분사 ἁρμενίζον의 진행적 장면은 ‘항해하며 오고 있었습니다’로 옮겼습니다. 또한 현대 합쇼체에 맞추어 ‘보십시오’를 사용하고, 제공되지 않은 각주 내용에 대응하지 않는 표지를 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:05Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 ἐκτὸς ναυτῶν καὶ κυβερνητῶν는 통상 ‘선원들과 조타수들 없이/제외하고’를 뜻합니다. 초안의 ‘선원들과 조타수들이 타고 있었습니다’는 반대 의미가 됩니다. 또한 원문에는 ‘우리 곁으로’에 해당하는 말이 없습니다. 영어 POB의 ‘beside us, with sailors and pilots’는 제시된 그리스어 본문과 일치하지 않습니다.
  naturalness: ‘보라’는 요청된 현대 합쇼체와 맞지 않으므로 ‘보십시오’가 적절합니다. ‘선원과 조타수도 없이 항해하며 오고 있었습니다’는 원문의 진행성과 결여를 자연스럽게 보존합니다.
  terminology: ναῦται는 ‘선원’, κυβερνῆται는 선박의 키를 잡는 ‘조타수’로 옮기는 것이 적절합니다. ἐπεγέγραπτο는 배에 적힌 명문을 나타내므로 ‘적혀 있었습니다’가 자연스럽습니다.
  issues:
  - severity: high
    issue: ἐκτὸς의 의미가 반대로 번역되었습니다.
    rationale: 초안은 선원과 조타수가 배에 타고 있었다고 하나, 원문은 이들이 없는 상태를 말합니다.
  - severity: high
    issue: ‘우리 곁으로’가 원문 없이 첨가되었습니다.
    rationale: 제시된 그리스어에는 ‘우리’ 또는 ‘곁’에 해당하는 어휘가 없습니다.
  - severity: medium
    issue: 합쇼체 등록이 일관되지 않습니다.
    rationale: ‘보라’ 대신 현대 정중한 명령형인 ‘보십시오’를 사용해야 합니다.
  - severity: low
    issue: 본문에 근거 문서가 제공되지 않은 [a][b] 각주 표지가 붙어 있습니다.
    rationale: 표지에 대응하는 각주가 없으므로 완성 본문에서는 제거하는 것이 안전합니다.
  revised_text: 보십시오, 배 한 척이 선원과 조타수도 없이 항해하며 오고 있었습니다. 그 배에는 ‘야곱의 배’라고 적혀 있었습니다.
