  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἰδοὺ πλοῖον ἤρχετο⁷ ἁρμενίζον⁸ *ἐκτὸς ναυτῶν⁹ καὶ κυβερνητῶν¹⁰· ἐπεγέγραπτο *δὲ τῷ πλοίῳ¹¹ *ὅτι πλοῖον¹² Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/002.yaml
  text: 'And behold, a ship was coming, sailing beside us, with sailors and pilots. And on the ship was written this: “Jacob’s ship.”'
translation:
  language: ko
  text: 보라, 배 한 척이 우리 곁으로 항해해 오고 있었는데, 선원들과 조타수들이 타고 있었습니다. 그리고 그 배에는 이렇게 적혀 있었습니다. 「야곱의 배」.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῖον
  english_pob_choice: a ship
  chosen_korean: 배 한 척
  alternatives_korean:
  - 배
  - 선박
  - 배 한 척이
  lexicon: πλοῖον
  rationale: 문맥상 구체적인 선박을 가리키므로 ‘배 한 척’으로 자연스럽게 옮기되, 수량성과 장면의 생동감을 살렸습니다.
- source_word: ἁρμενίζον ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  english_pob_choice: sailing beside us, with sailors and pilots
  chosen_korean: 우리 곁으로 항해해 오고 있었는데, 선원들과 조타수들이 타고 있었습니다
  alternatives_korean:
  - 우리 옆에서 항해하고 있었는데, 선원들과 조타수들이 있었습니다
  - 우리 곁을 지나 항해하고 있었는데, 선원들과 조타수들이 타고 있었습니다
  lexicon: ἁρμενίζω / ναύτης / κυβερνήτης
  rationale: 영어 POB의 ‘sailing beside us’를 한국어에서 ‘우리 곁으로 항해해 오고 있었습니다’로 풀어, 단순한 병행 이동보다 시야 안으로 다가오는 장면을 살렸습니다.
- source_word: ἐπεγέγραπτο ... ὅτι πλοῖον Ἰακώβ
  english_pob_choice: 'on the ship was written this: “Jacob’s ship.”'
  chosen_korean: 그 배에는 이렇게 적혀 있었습니다. 「야곱의 배」
  alternatives_korean:
  - 그 배에 이것이 적혀 있었습니다. 「야곱의 배」
  - 그 배에는 이렇게 기록되어 있었습니다. 「야곱의 배」
  lexicon: ἐπιγράφω
  rationale: 문패·선명(船名) 같은 표기 상황이므로 ‘적혀 있었습니다’가 가장 직접적이며, 소유격 표현은 자연스러운 한국어로 ‘야곱의 배’로 옮겼습니다.
theological_decisions:
- issue: 직접 인용문의 형식과 등록
  chosen_reading: 배의 명문을 따옴표로 분리하고, 서술문은 현대 서술체로 유지했습니다.
  alternative_readings:
  - 인용부를 생략하고 서술문만 이어 쓰는 방식
  - 고전적 성경문체로 격식화하는 방식
  rationale: 본문은 단순 서술과 명문 인용이 결합된 장면이므로, 한국어에서도 구조를 분명히 드러내는 것이 원문 이해에 유리합니다.
  doctrine_reference: 문체·담화 구조 보존 원칙
- issue: ‘보라’의 감탄 표현
  chosen_reading: ἰδοὺ를 ‘보라’로 옮겨 장면 전환의 즉시성을 살렸습니다.
  alternative_readings:
  - ‘보십시오’
  - 생략
  rationale: 서사적 주의를 환기하는 표지로 기능하므로, 현대 한국어에서도 관찰자 시점을 분명히 하는 ‘보라’가 적절합니다.
  doctrine_reference: 서사 담화 표지 보존
