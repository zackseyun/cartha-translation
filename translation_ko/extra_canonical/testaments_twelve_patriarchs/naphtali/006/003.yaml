translation:
  language: ko
  text: 그리고 우리 아버지가 우리에게 말했습니다. 「자, 우리 배로 올라갑시다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ λέγει ἡμῖν ὁ πατὴρ ἡμῶν
  english_pob_choice: And our father said to us
  chosen_korean: 그리고 우리 아버지가 우리에게 말했습니다
  alternatives_korean:
  - 그리고 우리 아버지가 우리에게 이르렀습니다
  - 그리고 우리 아버지가 우리에게 말하셨습니다
  lexicon: λέγω
  rationale: 단순한 발화 동사를 자연스러운 현대 문체로 옮기되, 평서 서술의 합쇼체를 유지했습니다. '말하셨습니다'도 가능하지만, 본문이 특별한 존대 강조를 요구하지 않아 가장 평이한 '말했습니다'를 택했습니다.
- source_word: Δεῦτε
  english_pob_choice: Come
  chosen_korean: 자
  alternatives_korean:
  - 오십시오
  - 오너라
  - 어서
  lexicon: δεῦτε
  rationale: 동료들에게 함께 움직이자는 초청의 뉘앙스를 살려 현대 한국어의 권유 표현인 '자'로 옮겼습니다.
- source_word: ἀνέλθωμεν
  english_pob_choice: let us go up
  chosen_korean: 올라갑시다
  alternatives_korean:
  - 올라가봅시다
  - 올라가겠습니다
  lexicon: ἀναβαίνω
  rationale: 공동의 제안을 나타내는 접속법 권유형을 한국어 청유형으로 자연스럽게 표현했습니다.
- source_word: εἰς τὸ πλοῖον ἡμῶν
  english_pob_choice: into our ship
  chosen_korean: 우리 배로
  alternatives_korean:
  - 우리 배 안으로
  - 우리 배로 들어가
  lexicon: πλοῖον
  rationale: '''πλοῖον''은 여기서 단순히 이동 수단인 ''배''로 충분하며, ''into''의 방향성은 한국어 조사 ''로''로 간결하게 반영했습니다.'
