  text: 그러나 레위는 베옷을 입고 주님께 기도했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβαλλόμενος σάκκον
  english_pob_choice: clothed in sackcloth
  chosen_korean: 베옷을 입고
  alternatives_korean:
  - 굵은 베옷을 입고
  - 자루옷을 입고
  - 애도용 베옷을 두르고
  lexicon: περιβάλλω + σάκκος
  rationale: 동작을 자연스럽게 살리되, σάκκος의 애도·회개의 옷이라는 의미가 분명하게 드러나도록 표준적인 ‘베옷을 입고’로 옮겼습니다.
- source_word: ἐδέετο
  english_pob_choice: prayed
  chosen_korean: 기도했습니다
  alternatives_korean:
  - 간구했습니다
  - 빌었습니다
  - 기도드렸습니다
  lexicon: δέομαι
  rationale: δέομαι의 간구성을 살리면서도 한국어 본문에서 가장 읽기 자연스러운 ‘기도했습니다’를 택했습니다.
- source_word: τοῦ Κυρίου
  english_pob_choice: the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주께서
  - 야훼께
  lexicon: κύριος
  rationale: 이 문맥의 κύριος는 일반적인 호칭으로 읽히므로, 직접기도의 대상 표기로 표준적인 ‘주님께’를 사용했습니다.
theological_decisions:
- issue: 레위의 행위 묘사와 기도의 대상 표현
  chosen_reading: ‘베옷을 입고 주님께 기도했습니다’로 직설적 서술을 유지했습니다.
  alternative_readings:
  - ‘회개하며 주님께 간구했습니다’
  - ‘주님께 부르짖었습니다’
  rationale: 본문은 회개의 상징 행위와 기도 행위를 병렬로 제시할 뿐, 추가 해석어를 요구하지 않습니다. 그래서 의미를 과장하지 않고 서술을 간명하게 유지했습니다.
  doctrine_reference: 문맥 우선 원칙
