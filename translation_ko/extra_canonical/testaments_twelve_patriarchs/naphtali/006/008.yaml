  source_fidelity: 그리스어 ‘Ὁ δὲ Λευὶ περιβαλλόμενος σάκκον ἐδέετο τοῦ Κυρίου’를 충실히 옮겼습니다. 레위, 베옷, 주님, 기도라는 핵심 요소가 모두 보존되어 있으며, δέομαι의 간구적 뉘앙스도 ‘기도했습니다’가 문맥상 무리 없이 전달합니다.
  naturalness: ‘그러나 레위는 베옷을 입고 주님께 기도했습니다’는 현대 표준 한국어 합쇼체 서술로 자연스럽고 간결합니다.
  terminology: ‘베옷’은 σάκκος의 전통적이고 널리 이해되는 성경 번역어이며, ‘주님’은 τοῦ Κυρίου에 적절합니다. 불필요한 회개·애도 해석을 본문에 덧붙이지 않은 점도 적절합니다.
