id: T12P.NAP.8.4
reference: Testament of Naphtali 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. *Ἐὰν Γοὖν καὶ ὑμεῖς˥²³ ἐργάσησθε τὸ καλόν²⁴, εὐλογήσουσιν ὑμᾶς *οἱ ἄνθρωποι καὶ οἱ ἄγγελοι²⁵, καὶ ὁ²⁶ Θεὸς δοξασθήσεται ἐν τοῖς ἔθνεσιν *διʼ ὑμῶν²⁷, καὶ ὁ διάβολος φεύξεται ἀφʼ ὑμῶν, Γκαὶ τὰ θηρία φοβηθήσονται ὑμᾶς˥²⁸, *καὶ ὁ Κύριος ἀγαπήσει ὑμᾶς²⁹, [καὶ οἱ ἄγγελοι ἀνθέξονται ὑμῶν]³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/004.yaml
  text: Therefore, if you also do what is good, people and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.
translation:
  language: ko
  text: 그러므로 여러분도 선한 일을 행하시면, 사람들과 천사들이 여러분을 축복할 것이며, 하나님은 여러분을 통해 민족들 가운데서 영광을 받으실 것이고, 마귀는 여러분에게서 달아날 것이며, 들짐승들은 여러분을 두려워할 것이고, 주님은 여러분을 사랑하실 것이며, 천사들은 여러분 곁을 지킬 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐργάσησθε τὸ καλόν
  english_pob_choice: do what is good
  chosen_korean: 선한 일을 행하시면
  alternatives_korean:
  - 좋은 일을 하시면
  - 선을 행하시면
  lexicon: ἐργάζομαι + τὸ καλόν
  rationale: 행위의 지속적 실천을 살리기 위해 ‘행하다’를 썼고, τὸ καλόν은 단순한 ‘좋은 것’보다 ‘선한 일’로 옮겨 의미를 분명히 했습니다.
- source_word: οἱ ἄνθρωποι
  english_pob_choice: people
  chosen_korean: 사람들
  alternatives_korean:
  - 사람들이
  - 인류
  lexicon: ἄνθρωπος
  rationale: English POB의 ‘people’에 맞추어 남성 일반을 피하고, 집합적이고 자연스러운 한국어 표현인 ‘사람들’을 택했습니다.
- source_word: οἱ ἄγγελοι / ὁ Κύριος
  english_pob_choice: angels / the Lord
  chosen_korean: 천사들 / 주님
  alternatives_korean:
  - 천사 / 주
  - 천사들 / 하나님
  lexicon: ἄγγελος / κύριος
  rationale: 복수 천사는 문맥상 복수형을 살렸고, Κύριος는 본문 문맥에서 예배적·존칭적 호칭이므로 ‘주님’으로 옮겼습니다.
- source_word: ἐν τοῖς ἔθνεσιν διʼ ὑμῶν
  english_pob_choice: among the nations through you
  chosen_korean: 여러분을 통해 민족들 가운데서
  alternatives_korean:
  - 여러분으로 말미암아 이방들 가운데서
  - 여러분을 통하여 나라들 가운데서
  lexicon: ἔθνη / διά
  rationale: ἔθνη를 여기서는 ‘이방인들’보다 더 넓은 집합을 뜻하는 ‘민족들’로 옮기고, διʼ ὑμῶν의 매개성을 ‘여러분을 통해’로 자연스럽게 반영했습니다.
- source_word: ἀνθέξονται ὑμῶν
  english_pob_choice: will stand by you
  chosen_korean: 여러분 곁을 지킬 것입니다
  alternatives_korean:
  - 여러분을 붙들 것입니다
  - 여러분 편에 설 것입니다
  lexicon: ἀντέχω
  rationale: 직역하면 ‘맞서 붙들다/붙들어 주다’의 뉘앙스가 있으나, 영어 POB의 ‘stand by you’와 문맥상의 보호·동행 이미지를 살려 ‘곁을 지키다’로 옮겼습니다.
theological_decisions:
- issue: τίτλος Κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주(主)
  rationale: 이 본문은 하나님/주님의 축복 약속을 말하는 문맥이므로, 한국어 독자가 즉시 예배적 호칭으로 이해할 수 있는 ‘주님’을 사용했습니다.
  doctrine_reference: 주권적 하나님의 호칭 번역 관행
- issue: οἱ ἄγγελοι ἀνθέξονται ὑμῶν의 의미
  chosen_reading: 천사들은 여러분 곁을 지킬 것입니다
  alternative_readings:
  - 천사들은 여러분을 붙들 것입니다
  - 천사들은 여러분을 지지할 것입니다
  rationale: 문맥상 단순한 감정적 지지보다 보호와 동행의 약속이 두드러지므로, 오해 없이 전달되는 ‘곁을 지키다’를 선택했습니다.
  doctrine_reference: 천사 사역의 보호·동행 모티프
