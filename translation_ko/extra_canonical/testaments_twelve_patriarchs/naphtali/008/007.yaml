  text: For the commandments of the law are twofold, and they are fulfilled with skill.
translation:
  language: ko
  text: 왜냐하면 율법의 계명들은 두 가지이며, 능숙하게 지켜집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ ἐντολαὶ τοῦ νόμου
  english_pob_choice: the commandments of the law
  chosen_korean: 율법의 계명들
  alternatives_korean:
  - 율법의 명령들
  - 율법의 규례들
  lexicon: ἐντολή, νόμος
  rationale: ἐντολαί는 단순한 일반 명령보다 율법에 속한 규범들을 가리키므로, POB의 “commandments of the law”에 맞춰 ‘율법의 계명들’로 옮겼습니다.
- source_word: διπλαῖ εἰσιν
  english_pob_choice: are twofold
  chosen_korean: 두 가지이며
  alternatives_korean:
  - 이중적이며
  - 둘로 되어 있으며
  lexicon: διπλοῦς
  rationale: 형용사 διπλαῖ는 ‘두 겹/두 부분’의 성격을 나타내므로, 자연스러운 현대 한국어로 ‘두 가지’라고 했습니다.
- source_word: μετὰ τέχνης
  english_pob_choice: with skill
  chosen_korean: 지혜롭게
  alternatives_korean:
  - 솜씨 있게
  - 기교 있게
  lexicon: τέχνη
  rationale: τέχνη는 단순한 기술보다 숙련된 지식과 능숙함을 포함하므로, 문맥상 자연스럽고 긍정적인 뉘앙스를 살려 ‘지혜롭게’로 번역했습니다.
