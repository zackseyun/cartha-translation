id: T12P.NAP.8.3
reference: Testament of Naphtali 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Διὰ¹⁵ †τοῦ σκήπτρου αὐτοῦ¹⁶ ὀφθήσεται ὁ¹⁷ Θεὸς [κατοικῶν ἐν ἀνθρώποις¹⁸] ἐπὶ τῆς γῆς, τοῦ¹⁹ σῶσαι *τὸ γένος τοῦ²⁰ Ἰσραήλ, *καὶ ἐπισυνάξει²¹ δικαίους ἐκ τῶν²² ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/003.yaml
  text: Through his scepter God will appear on the earth, dwelling among men, to save the people of Israel, and he will gather the righteous from among the nations.
translation:
  language: ko
  text: 그의 홀을 통해 하나님께서 땅에 나타나시어 사람들 가운데 거하시며, 이스라엘의 백성을 구원하시고, 열방 가운데서 의인들을 모으실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ ... τοῦ σκήπτρου αὐτοῦ
  english_pob_choice: Through his scepter
  chosen_korean: 그의 홀을 통해
  alternatives_korean:
  - 그의 왕홀을 통해
  - 그의 지팡이를 통해
  lexicon: διά + σκήπτρον
  rationale: σκήπτρου는 통치권을 상징하는 홀로 보는 것이 자연스럽기 때문에, 단순한 지팡이보다 ‘홀’을 택했습니다.
- source_word: ὀφθήσεται ὁ Θεός
  english_pob_choice: God will appear
  chosen_korean: 하나님께서 나타나시어
  alternatives_korean:
  - 하나님이 보이실 것입니다
  - 하나님께서 나타나실 것입니다
  lexicon: ὁ Θεός / ὀφθήσεται
  rationale: 수동형의 ‘드러나 보이다/나타나다’ 뉘앙스를 살려, 존재가 공개적으로 현현하는 의미를 한국어로 자연스럽게 옮겼습니다.
- source_word: κατοικῶν ἐν ἀνθρώποις
  english_pob_choice: dwelling among men
  chosen_korean: 사람들 가운데 거하시며
  alternatives_korean:
  - 사람들 가운데 거처하시며
  - 사람들 가운데 머무시며
  lexicon: κατοικέω
  rationale: 단순한 체류보다 지속적인 임재를 드러내기 위해 ‘거하시다’를 사용했습니다.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  english_pob_choice: the people of Israel
  chosen_korean: 이스라엘의 백성
  alternatives_korean:
  - 이스라엘 민족
  - 이스라엘 족속
  lexicon: γένος
  rationale: English audit trail의 ‘people of Israel’을 따라, 혈통적·민족적 집단을 뜻하는 문맥을 살리되 ‘백성’으로 자연스럽게 다듬었습니다.
- source_word: ἐπισυνάξει δικαίους ἐκ τῶν ἐθνῶν
  english_pob_choice: he will gather the righteous from among the nations
  chosen_korean: 열방 가운데서 의인들을 모으실 것입니다
  alternatives_korean:
  - 민족들 가운데서 의인들을 모으실 것입니다
  - 이방 나라들 가운데서 의인들을 모으실 것입니다
  lexicon: ἐπισυνάγω / ἐθνῶν / δικαίους
  rationale: ἐθνῶν은 문맥상 이스라엘 밖의 민족들을 가리키므로 ‘열방’으로 옮기고, δικαίους는 도덕적·신학적 표지로서 ‘의인들’을 유지했습니다.
theological_decisions:
- issue: 메시아적 예언의 현현과 임재 표현
  chosen_reading: 하나님께서 땅에 나타나시어 사람들 가운데 거하시는 것으로 옮겼습니다.
  alternative_readings:
  - 하나님께서 땅에 보이시어 사람들 가운데 사시는 것으로 옮김
  - 하나님께서 세상에 드러나시어 사람들 가운데 거하시는 것으로 옮김
  rationale: 문맥은 단순한 출현이 아니라 통치와 구원, 그리고 임재를 함께 말하므로 ‘나타나시어’와 ‘거하시며’를 함께 살렸습니다.
  doctrine_reference: 메시아적 현현 / 임재 신학
- issue: 이스라엘과 열방의 구원 범위
  chosen_reading: 이스라엘의 백성을 구원하시고, 열방 가운데서 의인들을 모으실 것입니다.
  alternative_readings:
  - 이스라엘을 구원하시고, 열방에서 의인들을 불러 모으실 것입니다
  - 이스라엘 민족을 구원하시고, 여러 민족 가운데 의인들을 모으실 것입니다
  rationale: 본문은 이스라엘의 구원과 열방 가운데 있는 의인들의 수집을 병렬로 제시하므로, 두 범주를 분명히 구분해 옮겼습니다.
  doctrine_reference: 이스라엘 우선성과 열방 포함
