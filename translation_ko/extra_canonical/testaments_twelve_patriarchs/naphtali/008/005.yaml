  text: 5. *Ὡς ἄν τις³¹ τέκνου³² †ἐκθρέψῃ³³ καλῶς³⁴ μνείαν ἔχει καλήν³⁵, οὕτως³⁶ καὶ *ἐπὶ τοῦ καλοῦ ἔργου μνήμη παρὰ Θεοῦ ἀγαθή³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/005.yaml
  text: As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.
translation:
  language: ko
  text: 사람이 자녀를 잘 기르면 그 자녀에 대한 좋은 기억을 갖듯이, 선한 일에도 하나님께로부터 좋은 기억이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνου / ἐκθρέψῃ
  english_pob_choice: reared a child
  chosen_korean: 어떤 아이를 잘 길러 내면
  alternatives_korean:
  - 아이를 잘 키우면
  - 자녀를 잘 양육하면
  lexicon: τέκνον / ἐκτρέφω
  rationale: ἐκθρέψῃ는 단순히 낳는 것이 아니라 돌보고 길러 성숙하게 하는 뜻이므로, ‘잘 길러 내다’로 옮겨 양육의 완료감을 살렸습니다.
- source_word: μνείαν ἔχει καλήν
  english_pob_choice: he has a good remembrance of him
  chosen_korean: 그에 대한 좋은 기억을 가지듯이
  alternatives_korean:
  - 그를 좋은 기억으로 간직하듯이
  - 그를 좋게 기억하듯이
  lexicon: μνεία / μνήμη
  rationale: 본문은 ‘기억/회상’의 상태를 말하므로 ‘좋은 기억을 가지다’로 직역성과 자연스러움을 함께 살렸습니다.
- source_word: ἐπὶ τοῦ καλοῦ ἔργου
  english_pob_choice: for a good work
  chosen_korean: 선한 일에 대해서도
  alternatives_korean:
  - 좋은 일에 대해서도
  - 선한 행위에 대해서도
  lexicon: καλός ἔργον
  rationale: τοῦ καλοῦ ἔργου는 도덕적으로 ‘좋은/선한’ 일을 가리키므로, POB의 의미를 따라 ‘선한 일’로 옮겼습니다.
- source_word: παρὰ Θεοῦ ἀγαθή
  english_pob_choice: there is a good remembrance before God
  chosen_korean: 하나님 앞에 좋은 기억이 있습니다
  alternatives_korean:
  - 하나님 앞에 좋은 기억이 남습니다
  - 하나님께 좋은 기억이 있습니다
  lexicon: παρά + Θεός / μνήμη
  rationale: παρά Θεοῦ는 ‘하나님 앞에서/하나님께로부터’의 관계를 나타내므로, 심판자 앞에 드러나는 기억이라는 뉘앙스를 살려 ‘하나님 앞에’로 옮겼습니다.
theological_decisions:
- issue: ‘기억’의 신학적 방향
  chosen_reading: 하나님 앞에 남는 ‘좋은 기억’으로, 행위의 가치를 하나님이 기억하신다는 뜻을 살렸습니다.
  alternative_readings:
  - 하나님이 상을 주신다는 의미로 좁혀 읽기
  - 단순한 인간적 회상으로만 읽기
  rationale: 본문은 보상 언어를 직접 쓰지 않고 기억/기념의 어휘를 사용하므로, 행위가 하나님 앞에서 잊히지 않는다는 진술 자체를 유지했습니다.
  doctrine_reference: divine remembrance / memorial motif
