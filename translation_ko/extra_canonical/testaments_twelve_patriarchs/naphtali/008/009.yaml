source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/009.yaml
  text: And both are from God, and if they do not occur in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.
translation:
  language: ko
  text: 그리고 이 두 가지는 모두 하나님께로부터 온 것이며, 그것들이 각자의 정해진 순서대로 이루어지지 않으면 사람들에게 지극히 큰 죄를 초래합니다. 나머지 계명들도 마찬가지입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο
  english_pob_choice: both
  chosen_korean: 두 가지 모두
  alternatives_korean:
  - 둘 다
  - 이 둘
  lexicon: source phrase
  rationale: 두 항목이 함께 하나님에게서 나온다는 점을 분명히 드러내기 위해 자연스러운 한국어로 옮겼습니다.
- source_word: ἐν τῇ τάξει αὐτῶν
  english_pob_choice: in their proper order
  chosen_korean: 제때와 질서에 맞게
  alternatives_korean:
  - 그들의 올바른 순서대로
  - 정해진 순서에 따라
  lexicon: τάξις
  rationale: 단순한 순서뿐 아니라 정해진 배열·질서를 함께 가리키므로, 문맥상 순서와 질서를 아우르는 표현을 택했습니다.
- source_word: παρεῖχον τοῖς ἀνθρώποις ἁμαρτίαν μεγίστην
  english_pob_choice: they bring very great sin upon men
  chosen_korean: 사람들에게 매우 큰 죄를 가져옵니다
  alternatives_korean:
  - 사람들에게 지극히 큰 죄를 일으킵니다
  - 사람들에게 큰 죄를 초래합니다
  lexicon: παρέχω + ἁμαρτία
  rationale: 원문의 결과 관계를 살려 ‘가져옵니다’로 옮기고, μεγίστην은 ‘매우 큰’으로 직접 반영했습니다.
theological_decisions:
- issue: 계명들의 기원과 질서의 의미
  chosen_reading: 두 가지와 나머지 계명들 모두 하나님에게서 오지만, 정해진 질서가 어겨질 경우 죄를 낳는다는 진술로 읽었습니다.
  alternative_readings:
  - ‘두 가지’만 특별히 하나님에게서 나온 것으로 제한하는 읽기
  - ‘질서’를 단순한 시간순서가 아니라 의례적/윤리적 배열로 보는 읽기
  rationale: 본문은 개별 항목의 기원과 그 항목들이 제자리에 놓일 때의 효력을 함께 말하므로, 기원과 질서의 두 층위를 모두 유지했습니다.
  doctrine_reference: 계명의 신적 기원과 순서의 중요성
