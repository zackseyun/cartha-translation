id: T12P.NAP.8.10
reference: Testament of Naphtali 8:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. Γίνεσθε οὖν *σοφοὶ ἐν θεῷ, τέκνα μου⁶¹, καὶ φρόνιμοι, ἰδόντες⁶² τάξιν ἐντολῶν⁶³ αὐτοῦ⁶⁴ καὶ θεσμοὺς παντὸς πράγματος⁶⁵, ὅπως *ἀγαπήσει ὑμᾶς ὁ Κύριος⁶⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/010.yaml
  text: Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter, so that the Lord may love you.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 그분의 계명들의 질서와 모든 일의 규례를 깨달아 하나님 안에서 지혜롭고 분별력 있게 되십시오. 그러면 주님께서 여러분을 사랑하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφοὶ ἐν θεῷ
  english_pob_choice: wise in God
  chosen_korean: 하나님 안에서 지혜롭고
  alternatives_korean:
  - 하나님 안에서 현명하고
  - 하나님 안에서 지혜 있는
  lexicon: σοφός
  rationale: ὁ θεῷ와 결합된 지혜를 단순한 생활 지혜보다 하나님께 속한 지혜로 살려 ‘하나님 안에서’와 함께 자연스러운 형용사구로 옮겼습니다.
- source_word: φρόνιμοι
  english_pob_choice: prudent
  chosen_korean: 분별력 있게
  alternatives_korean:
  - 신중하게
  - 슬기롭게
  lexicon: φρόνιμος
  rationale: 문맥상 단순한 조심성이 아니라 명령의 질서를 알아보는 실천적 분별을 가리키므로 ‘분별력 있게’로 옮겼습니다.
- source_word: τάξιν ἐντολῶν αὐτοῦ καὶ θεσμοὺς παντὸς πράγματος
  english_pob_choice: the order of his commandments and the ordinances of every matter
  chosen_korean: 그분의 계명들의 질서와 모든 일의 규례
  alternatives_korean:
  - 그분의 계명들의 질서와 모든 일의 규정
  - 그분 계명의 질서와 모든 사안의 규례
  lexicon: τάξις / ἐντολαί / θεσμοί / πᾶς πρᾶγμα
  rationale: 영어 POB의 ‘order’와 ‘ordinances of every matter’를 따르되, παντὸς πράγματος의 소유격적 구조를 ‘모든 일의’로 반영해 원문의 형식을 보존했습니다.
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: κύριος
  rationale: 이 구절의 약속 주체를 한국어 독자에게 자연스럽게 들리도록 ‘주님’으로 옮겼으며, 이어지는 동사에 주격 주어를 분명히 했습니다.
theological_decisions:
- issue: θeological register in exhortation and promise
  chosen_reading: 권면은 직접 청중에게 말하는 합쇼체로 유지하고, 약속 진술은 ‘주님께서 … 사랑하실 것입니다’로 공손한 서술형을 사용했습니다.
  alternative_readings:
  - ‘주께서 여러분을 사랑하실 것입니다’
  - ‘주님이 여러분을 사랑하실 것입니다’
  rationale: 이 문장은 지혜와 순종에 대한 권면과 그에 따른 신적 호의를 약속하는 구조이므로, 한국어 독자에게도 권면-약속의 대비가 분명하게 드러나도록 했습니다.
  doctrine_reference: 지혜 문학적 권면과 조건적 약속의 수사 구조
- issue: direct address to audience
  chosen_reading: ‘내 자녀들아’로 원문의 τέκνα μου를 직접 호소형으로 살렸습니다.
  alternative_readings:
  - ‘내 자녀들’
  - ‘내 자녀들아’
  rationale: 수신자를 단순 지칭이 아니라 친밀한 권면 대상으로 부르기 때문에, 고전적 어조를 피하면서도 직접 호소의 힘을 보존했습니다.
  doctrine_reference: 부성적 권면의 수사
