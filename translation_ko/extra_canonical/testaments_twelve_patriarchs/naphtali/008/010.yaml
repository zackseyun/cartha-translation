revisions:
- from: 그러므로 여러분, 내 자녀들아, 하나님 안에서 지혜롭고 분별력 있게 되어, 그분의 계명들의 질서와 모든 일의 규례를 보십시오. 그러면 주님께서 여러분을 사랑하실 것입니다.
  to: 그러므로 내 자녀들아, 그분의 계명들의 질서와 모든 일의 규례를 깨달아 하나님 안에서 지혜롭고 분별력 있게 되십시오. 그러면 주님께서 여러분을 사랑하실 것입니다.
  rationale: 중복된 청중 호칭을 제거하고, ἰδόντες를 수단·동반의 분사로 자연스럽게 반영했습니다. ὅπως ἀγαπήσει의 목적/기대의 뉘앙스는 한국어 권면 문맥에서 자연스러운 결과 표현인 ‘그러면 … 사랑하실 것입니다’로 유지했습니다.
