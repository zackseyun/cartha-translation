id: T12P.NAP.8.6
reference: Testament of Naphtali 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴², *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/006.yaml
  text: But the one who does not do good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.
translation:
  language: ko
  text: 그러나 선한 일을 하지 않는 자에게는 천사들과 사람들까지도 저주할 것이며, 하나님께서는 그를 통해 민족들 가운데서 수치를 당하실 것입니다. 또한 마귀는 그를 자기의 소유 그릇으로 삼고, 모든 들짐승은 그를 지배할 것이며, 주께서도 그를 미워하실 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ποιοῦντα τὸ καλόν
  english_pob_choice: does not do good
  chosen_korean: 선한 일을 하지 않는 자
  alternatives_korean:
  - 좋은 일을 하지 않는 자
  - 선을 행하지 않는 자
  lexicon: ποιοῦντα / καλόν
  rationale: 그리스어는 단순히 ‘좋은 것’을 행하지 않는다는 뜻이므로, 자연스러운 합쇼체로 옮기되 ‘선한 일’로 보존해 행위의 윤리적 성격을 드러냈습니다.
- source_word: καταράσονται αὐτόν
  english_pob_choice: will curse him
  chosen_korean: 저주할 것입니다
  alternatives_korean:
  - 저주하겠습니다
  - 저주합니다
  lexicon: καταράζομαι
  rationale: 미래형의 선언을 살려 예언적 진술로 옮겼으며, 주어가 복수이므로 한국어에서는 서술을 자연스럽게 평서형 미래로 처리했습니다.
- source_word: ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ
  english_pob_choice: will be dishonored among the nations through him
  chosen_korean: 그를 통해 민족들 가운데서 수치를 당하실 것입니다
  alternatives_korean:
  - 그를 통해 나라들 가운데서 욕을 먹으실 것입니다
  - 그로 말미암아 민족들 사이에서 영광을 잃으실 것입니다
  lexicon: ἀδοξέω / ἔθνη
  rationale: ἀδοξήσει는 ‘영광을 잃다/수치를 당하다’의 뜻이므로, 신적 주어에 맞춰 ‘수치를 당하실 것입니다’로 옮겼고, ἔθνη는 여기서 ‘민족들’이 자연스럽습니다.
- source_word: οἰκειοῦται αὐτὸν ὡς ἴδιον σκεῦος
  english_pob_choice: claims him as his own vessel
  chosen_korean: 그를 자기의 소유 그릇으로 삼고
  alternatives_korean:
  - 그를 자기의 그릇으로 주장하고
  - 그를 자기의 전용 그릇으로 삼고
  lexicon: οἰκειόω / σκεῦος
  rationale: οἰκειοῦται는 소유권을 주장하는 뉘앙스가 있고, σκεῦος는 문자 그대로 ‘그릇/용기’이므로 POB의 이미지를 살려 ‘소유 그릇’으로 옮겼습니다.
- source_word: κατακυριεύσει αὐτῷ
  english_pob_choice: will lord it over him
  chosen_korean: 그를 지배할 것이며
  alternatives_korean:
  - 그 위에 군림할 것이며
  - 그를 압제할 것이며
  lexicon: κατακυριεύω
  rationale: 지배권을 행사한다는 뜻을 살리되, 현대 한국어에서 과도하게 관용적인 표현 대신 직접적 의미를 유지했습니다.
theological_decisions:
- issue: 하나님과 주께서 동일하게 최종적 심판 주체로 제시되는 구조
  chosen_reading: 본문의 경고적 병렬을 그대로 살려, 하나님과 주를 별도의 주체로 구분해 번역했습니다.
  alternative_readings:
  - 주께서도 그를 미워하실 것입니다를 완화하여 하나님의 심판만 강조하는 읽기
  - ‘주’와 ‘하나님’을 동일 인물로 주석적으로 통합하는 읽기
  rationale: 그리스어는 하나님과 주를 나란히 배치하여 반복적 경고를 형성하므로, 신학적 조정 없이 두 진술을 모두 보존하는 것이 원문 충실도에 더 적합합니다.
  doctrine_reference: 원문 병렬 구조 보존
- issue: ‘민족들 가운데서’의 부정적 명예/수치 언어
  chosen_reading: ὁ Θεὸς ἀδοξήσει를 ‘수치를 당하실 것입니다’로 옮겨, 단순한 사회적 오해가 아니라 신적 명예 훼손의 강도를 살렸습니다.
  alternative_readings:
  - ‘영광을 잃으실 것입니다’처럼 보다 중립적으로 옮기는 읽기
  - ‘욕을 보실 것입니다’처럼 구어적으로 약화하는 읽기
  rationale: 문맥은 개인의 실패가 하나님 이름의 공적 수치를 초래한다는 강한 경고이므로, 약화하지 않고 직접적으로 유지했습니다.
  doctrine_reference: 신명기적 명예-수치 프레임
