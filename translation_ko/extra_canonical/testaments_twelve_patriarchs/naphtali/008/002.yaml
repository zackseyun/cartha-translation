  to: 그러므로 너희도 이제 자녀들에게 레위와 유다와 하나가 되라고 명령하십시오. 유다를 통하여 이스라엘을 위한 구원이 나타날 것이며, 그 안에서 야곱이 복을 받을 것이기 때문입니다.
  rationale: 명령의 대상과 내용을 명료하게 재구성하고, 구원의 수혜 대상 및 ἀνατέλλω의 도래 이미지를 현대 한국어에 자연스럽게 반영했습니다. †αὐτῷ†의 불확정적인 선행사는 해석적으로 특정하지 않고 ‘그 안에서’로 보존했습니다.
