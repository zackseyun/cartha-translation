base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/002.yaml
  text: And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.
translation:
  language: ko
  text: 그러므로 너희도 이제 자녀들에게 명하여 레위와 유다와 하나가 되게 하십시오. 이는 유다를 통해 이스라엘에 구원이 일어날 것이며, 그 안에서 야곱이 복을 받을 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γοὖν / Καὶ ὑμεῖς Γοὖν
  english_pob_choice: And now, behold
  chosen_korean: 그러므로 너희도 이제
  alternatives_korean:
  - 이제 너희도 그러므로
  - 그러니 너희도 이제
  lexicon: source discourse marker
  rationale: 이어지는 권면을 시작하는 전환 표현으로 이해하고, POB의 'And now, behold'가 주는 호소성을 살리되 한국어에서는 자연스럽게 '그러므로 너희도 이제'로 옮겼습니다.
- source_word: ἐντείλασθε
  english_pob_choice: command
  chosen_korean: 명하여
  alternatives_korean:
  - 명령하여
  - 지시하여
  lexicon: ἐντέλλομαι
  rationale: 자녀들에게 주는 권고이지만, 원문은 분명한 명령형이므로 한국어에서도 '명하여'로 강도를 유지했습니다.
- source_word: ἑνοῦνται
  english_pob_choice: be united with
  chosen_korean: 하나가 되게
  alternatives_korean:
  - 연합하게
  - 연결되게
  lexicon: ἑνόω
  rationale: 단순한 동맹보다 결속과 일치를 더 직접적으로 나타내므로 '하나가 되게'가 가장 간명하게 원문의 의미를 담습니다.
- source_word: ἀνατελεῖ ἡ σωτηρία
  english_pob_choice: salvation will arise
  chosen_korean: 구원이 일어날 것이며
  alternatives_korean:
  - 구원이 떠오를 것이며
  - 구원이 솟아날 것이며
  lexicon: ἀνατέλλω + σωτηρία
  rationale: ἀνατέλλω의 '솟아오르다/떠오르다' 이미지를 살리되, 한국어에서는 구원의 도래를 자연스럽게 표현하는 '일어날 것이다'를 택했습니다.
theological_decisions:
- issue: 유다를 통한 구원의 도래와 야곱의 복
  chosen_reading: 원문의 예언적 인과를 유지하여, 유다를 통해 이스라엘에 구원이 일어나고 그 안에서 야곱이 복을 받는다고 직역에 가깝게 살렸습니다.
  alternative_readings:
  - 유다를 통해 이스라엘이 구원을 받게 될 것이며
  - 유다로 말미암아 이스라엘의 구원이 나타날 것이며
  rationale: 본문은 인물-지파-구원의 연관을 예언적으로 제시하므로, 관계를 완화하지 않고 '유다를 통해'와 '그 안에서'를 유지해 문장 구조와 신학적 긴장을 보존했습니다.
  doctrine_reference: messianic blessing / tribal prophecy
