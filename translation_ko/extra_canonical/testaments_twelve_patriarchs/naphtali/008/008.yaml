id: T12P.NAP.8.8
reference: Testament of Naphtali 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/008.yaml
  text: For there is a time for a man to come together with a woman, and a time for self-control for his prayer.
translation:
  language: ko
  text: 이는 남자가 여자와 합하는 때가 있고, 그의 기도를 위하여 절제할 때가 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καιρὸς ... συνουσίας γυναικός
  english_pob_choice: there is a time for a man to come together with a woman
  chosen_korean: 남자가 여자와 합하는 때
  alternatives_korean:
  - 남자가 여자와 함께하는 때
  - 남자가 여자와 성교하는 때
  lexicon: καιρός / συνουσία
  rationale: καιρός는 단순한 시각이 아니라 정해진 때를 뜻하므로 ‘때’로 옮기고, συνουσία는 문맥상 부부적 결합을 가리키지만 노골적 완곡어법보다 원문 의미를 살려 ‘합하다’로 옮겼습니다.
- source_word: ἐγκρατείας
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자기 절제
  - 금욕
  - 억제
  lexicon: ἐγκράτεια
  rationale: ἐγκρατεία의 핵심은 욕구를 다스리는 덕목이므로, POB의 ‘self-control’을 표준적이고 간결한 ‘절제’로 옮겼습니다.
- source_word: εἰς προσευχὴν αὐτοῦ
  english_pob_choice: for his prayer
  chosen_korean: 그의 기도를 위하여
  alternatives_korean:
  - 그의 기도에
  - 기도를 위해
  - 그의 기도를 위하여
  lexicon: εἰς + προσευχή
  rationale: εἰς는 목적 방향을 나타내므로 ‘-을 위하여’로 풀어 목적 관계를 분명히 했고, αὐτοῦ는 일반적인 남성 단수 소유로 이해해 ‘그의’로 반영했습니다.
theological_decisions:
- issue: 성적 결합과 영적 훈련의 긴장 관계
  chosen_reading: 문장은 부부적 결합의 때와 기도를 위한 절제의 때를 병치하여, 결혼적 관계 자체를 부정하지 않으면서도 기도에 집중하는 절제의 필요를 말합니다.
  alternative_readings:
  - 단순히 성행위를 허용하는 일반 진술로 읽기
  - 금욕을 절대 규범으로 읽기
  rationale: 원문은 δύο ‘때’를 대조하므로, 한쪽을 도덕화하거나 절대화하기보다 문맥상 균형을 유지하는 것이 필요합니다.
  doctrine_reference: 결혼과 절제에 관한 지혜 문맥
- issue: 합쇼체 유지
  chosen_reading: 서술은 현대 한국어 합쇼체로 유지하되, 원문의 일반 진술 성격을 살려 평서문으로 번역했습니다.
  alternative_readings:
  - 격식 낮은 해요체
  - 고어체 종결
  rationale: 문헌 번역의 일관성과 공개 출판 적합성을 위해 현대 표준 문체를 택했습니다.
  doctrine_reference: 번역 शैली 원칙
