source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VIII. Καὶ¹ ἰδού², τέκνα μου³, ὑπέδειξα ὑμῖν καιροὺς ἐσχάτους †ὅτι⁴ πάντα γενήσεται ἐν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/001.yaml
  text: And behold, my children, I have shown you the times, that all will happen in Israel.
translation:
  language: ko
  text: 그리고 보십시오, 내 자녀들아, 내가 너희에게 마지막 때들을 일러 주었으니, 모든 것이 이스라엘에서 일어날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδού
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 그리고 보라
  - 자, 보십시오
  lexicon: καί / ἰδού
  rationale: 문맥의 전환과 주의를 환기하는 감탄을 자연스러운 현대 한국어로 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호칭으로서의 친밀함을 유지하되, 현대 문체에서 가장 자연스러운 복수 호칭인 ‘자녀들아’로 옮겼습니다.
- source_word: ὑπέδειξα ὑμῖν καιροὺς ἐσχάτους
  english_pob_choice: I have shown you the times
  chosen_korean: 내가 너희에게 마지막 때를 보여 주었으니
  alternatives_korean:
  - 내가 너희에게 종말의 때를 보여 주었으니
  - 내가 너희에게 끝날 때를 보여 주었으니
  lexicon: καιροὺς ἐσχάτους
  rationale: καιροὺς ἐσχάτους는 단순한 ‘때들’보다 종말론적 성격이 강하므로 ‘마지막 때’로 옮겨 의미를 분명히 했습니다.
- source_word: πάντα γενήσεται ἐν Ἰσραήλ
  english_pob_choice: all will happen in Israel
  chosen_korean: 모든 것이 이스라엘에서 일어날 것입니다
  alternatives_korean:
  - 모든 일이 이스라엘에서 일어날 것입니다
  - 만사가 이스라엘에서 일어날 것입니다
  lexicon: πάντα / γενήσεται
  rationale: πάντα는 개정본에서 확인된 대로 ‘이런 것들’이 아니라 단순한 ‘모든 것’이므로, ‘모든 것이’로 정확히 반영했습니다.
theological_decisions:
- issue: 종말 표현인 καιροὺς ἐσχάτους의 한국어 강도
  chosen_reading: ‘마지막 때’로 번역해 종말론적 예고를 분명히 드러냈습니다.
  alternative_readings:
  - ‘종말의 때’
  - ‘끝날 때’
  rationale: 본문은 미래 사건의 총체를 알리는 예언적 진술이므로, 시간표현의 종말론적 긴장을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: Eschatological prophecy in apocalyptic/paraenetic literature
