  revised_text: '11. 그는 포로로 잡혀 라반에게 팔렸습니다. 라반은 자기 여종 에우난을 그에게 아내로 주었습니다. 에우난은 딸을 낳았고, 그는 자신이 포로로 잡혔던 성읍의 이름을 따라 그 딸의 이름을 젤파라고 하였습니다.


