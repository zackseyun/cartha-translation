id: T12P.NAP.1.3
reference: Testament of Naphtali 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. *Καὶ τὸ πρωὶ¹⁴ μετὰ τὸ ἐξυπνισθῆναι¹⁵ αὐτὸν εἶπεν αὐτοῖς¹⁶ ὅτι¹⁷ Ἀποθνήσκω· καὶ¹⁸ οὐκ ἐπίστευσαν¹⁹ αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/003.yaml
  text: And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him.
translation:
  language: ko
  text: 그리고 아침에 그가 깨어난 뒤, 그가 그들에게 “나는 죽어 갑니다”라고 말했습니다. 그러나 그들은 그를 믿지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρωὶ / μετὰ τὸ ἐξυπνισθῆναι αὐτὸν
  english_pob_choice: And in the morning, after he awoke
  chosen_korean: 그리고 아침에 그가 깨어난 뒤
  alternatives_korean:
  - 그리고 아침에 그가 잠에서 깬 뒤
  - 그리고 아침이 되어 그가 깨어난 뒤
  lexicon: τὸ πρωὶ, ἐξυπνισθῆναι
  rationale: 시간 부사구와 ‘깨어난 뒤’의 순차 관계를 자연스럽게 살리되, 원문의 간결한 서술 흐름을 유지했습니다.
- source_word: εἶπεν αὐτοῖς ὅτι
  english_pob_choice: he said to them, “I am dying”
  chosen_korean: 그들에게 「나는 죽어 가고 있습니다」라고 말했습니다
  alternatives_korean:
  - 그들에게 「나는 죽습니다」라고 말했습니다
  - 그들에게 「나는 죽어 가고 있습니다」라고 말했습니다
  lexicon: εἶπεν ... ὅτι Ἀποθνήσκω
  rationale: 현재형 ἀποθνήσκω의 진행 중 상태를 반영해 직설적이면서도 자연스러운 한국어로 옮겼습니다.
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  english_pob_choice: but they did not believe him
  chosen_korean: 그러나 그들은 그를 믿지 않았습니다
  alternatives_korean:
  - 그러나 그들은 그 말을 믿지 않았습니다
  - 그러나 그를 믿지 않았습니다
  lexicon: οὐκ ἐπίστευσαν
  rationale: 대상 대명사 αὐτῷ를 인물 자체에 대한 불신으로 직역해, 예언적 경고를 받아들이지 않은 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 인물의 죽음 선언을 현재진행형으로 옮길지 여부
  chosen_reading: 「나는 죽어 가고 있습니다」로 현재 진행 중인 임박한 죽음을 드러냈습니다.
  alternative_readings:
  - 「나는 죽습니다」
  - 「나는 곧 죽을 것입니다」
  rationale: 원문 Ἀποθνήσκω는 단순 미래 선언보다 현재적·진행적 자각을 강하게 전달하므로, 이를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 서사적 직설 화법의 시제·상 보존
