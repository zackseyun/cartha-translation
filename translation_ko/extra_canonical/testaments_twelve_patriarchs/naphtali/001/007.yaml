id: T12P.NAP.1.7
reference: Testament of Naphtali 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. *Ἠγάπησε γάρ³⁹ με Ῥαχιὴλ⁴⁰ πάνυ⁴¹, ὅτι ἐπὶ *τῶν γονάτων⁴² αὐτῆς ἐγεννήθην, καὶ ἔτι⁴³ ἁπαλὸν ὄντα *με κατεφίλει⁴⁴ λέγουσα· *Δοίη μοι ἀδελφόν⁴⁵ σου ἐκ τῆς κοιλίας μου κατά σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/007.yaml
  text: For Rachel loved me greatly, because I was born upon her knees; and while I was still tender she kept kissing me, saying, ‘May I be given from my own womb a brother like you.’
translation:
  language: ko
  text: 라헬은 내가 그녀의 무릎 위에서 태어났기 때문에 나를 몹시 사랑하였고, 내가 아직 여릴 때에는 나에게 계속 입맞추며 말하였습니다. 「내 자궁에서 너와 같은 형제를 내게 주십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠγάπησε ... πάνυ
  english_pob_choice: loved me greatly
  chosen_korean: 나를 몹시 사랑하였고
  alternatives_korean:
  - 나를 매우 사랑하였고
  - 나를 크게 사랑하였고
  lexicon: ἀγαπάω / πάνυ
  rationale: ἠγάπησε의 과거 사랑과 πάνυ의 강도를 함께 살려, 단순한 ‘사랑했다’보다 강한 부사 ‘몹시’를 택했습니다.
- source_word: ἐπὶ τῶν γονάτων αὐτῆς ἐγεννήθην
  english_pob_choice: I was born upon her knees
  chosen_korean: 내가 그녀의 무릎 위에서 태어났기 때문에
  alternatives_korean:
  - 내가 그녀의 무릎 위에서 태어났기 때문에
  - 내가 그녀의 무릎 위에서 태어났습니다
  lexicon: ἐπὶ τῶν γονάτων / γεννάω
  rationale: 출생 장소를 직역하되, 원인절처럼 이어지는 흐름을 살려 ‘-기 때문에’로 연결했습니다.
- source_word: ἔτι ἁπαλὸν ὄντα
  english_pob_choice: while I was still tender
  chosen_korean: 내가 아직 여린 때에
  alternatives_korean:
  - 내가 아직 연약할 때에
  - 내가 아직 어릴 때에
  lexicon: ἁπαλός
  rationale: ἁπαλόν을 연령이 어린 상태와 유연함을 함께 느끼게 하는 ‘여린’으로 옮겨, POB의 ‘tender’보다 본문에 가까운 이미지를 살렸습니다.
- source_word: κατεφίλει
  english_pob_choice: kept kissing me
  chosen_korean: 나를 계속 입맞추며
  alternatives_korean:
  - 나를 계속 키스하며
  - 나에게 거듭 입맞추며
  lexicon: καταφιλέω
  rationale: 반복적·애정적 동작을 나타내는 동사를 한국어의 진행형 구조로 살려, 단발 동작이 아니라 계속된 행위를 드러냈습니다.
- source_word: Δοίη μοι ἀδελφόν σου ἐκ τῆς κοιλίας μου κατά σε
  english_pob_choice: May I be given from my own womb a brother like you
  chosen_korean: 내 자궁에서, 너와 같은 형제를 내게 주십시오
  alternatives_korean:
  - 내 자궁에서 너와 같은 형제를 제게 주십시오
  - 내 몸의 태에서 너 같은 형제를 내게 주십시오
  lexicon: δίδωμι / ἀδελφός / κοιλία
  rationale: 기도적 소망을 ‘주십시오’로 옮기고, κοιλία를 완곡하게 ‘자궁’으로 번역해 출산의 직접성을 보존했습니다.
theological_decisions:
- issue: 출산 표현의 직설성
  chosen_reading: 본문의 신체적·모성적 이미지를 완화하지 않고 ‘무릎 위’와 ‘자궁’을 그대로 드러냈습니다.
  alternative_readings:
  - 더 완곡하게 ‘태 안’ 또는 ‘몸’으로 바꾸는 번역
  rationale: 이 구절은 라헬의 애정과 출생의 구체성을 강조하므로, 소스의 표상을 약화하지 않는 것이 더 충실합니다.
  doctrine_reference: 본문 주해 및 직역 원칙
