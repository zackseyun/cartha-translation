reference: Testament of Naphtali 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Ἐγὼ ἐγεννήθην ἀπὸ Βάλλας²⁸, Γκαὶ¹²⁹ ὅτι³⁰ ἐν πανουργίᾳ ἐποίησε³¹ Ῥαχιήλ³², καὶ ἔδωκεν *ἀντʼ αὐτῆς³³ Βάλλαν³⁴ *τῷ Ἰακώβ³⁵, καὶ *συλλαβοῦσα ἔτεκέ με ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ³⁶, Γκαὶ³⁷ διὰ τοῦτο *ἐκάλεσε τὸ ὄνομά μου³⁸ Νεφθαλείμ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/006.yaml
  text: I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me on Rachel’s knees, and for this reason she called my name Naphtali.
translation:
  language: ko
  text: 저는 빌하에게서 태어났습니다. 라헬이 꾀를 써서 빌하를 자신 대신 야곱에게 주었고, 빌하가 잉태하여 라헬의 무릎 위에서 저를 낳았기 때문입니다. 그래서 라헬은 제 이름을 납달리라고 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πανουργίᾳ ἐποίησε
  english_pob_choice: Rachel acted with cunning
  chosen_korean: 라헬이 간계로 행하여
  alternatives_korean:
  - 라헬이 교활하게 행하여
  - 라헬이 꾀를 써서 행하여
  - 라헬이 속임수로 행하여
  lexicon: πανουργία
  rationale: πανουργία는 단순한 지혜보다 부정적 뉘앙스의 간계·꾀를 뜻하므로, 라헬의 행위를 도덕적으로 중립화하지 않기 위해 ‘간계로’로 옮겼습니다.
- source_word: συλλαβοῦσα ἔτεκέ με
  english_pob_choice: conceived and bore me
  chosen_korean: 잉태하여 ... 낳았으며
  alternatives_korean:
  - 수태하여 ... 낳았으며
  - 임신하여 ... 낳았으며
  - 잉태하고 ... 낳았으며
  lexicon: συλλαμβάνω / τίκτω
  rationale: 임신의 시작과 출산을 모두 나타내는 표준적 성서 어휘 흐름을 살려 ‘잉태하여 ... 낳았으며’로 자연스럽게 표현했습니다.
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  english_pob_choice: on Rachel’s knees
  chosen_korean: 라헬의 무릎 위에서
  alternatives_korean:
  - 라헬의 무릎 위에서
  - 라헬의 무릎에
  - 라헬의 무릎 위에
  lexicon: ἐπί + genitive
  rationale: 그리스어 전치사구의 물리적 위치감을 살려 ‘무릎 위에서’로 옮겨, 출생 장면의 직접성을 유지했습니다.
- source_word: ἐκάλεσε τὸ ὄνομά μου Νεφθαλείμ
  english_pob_choice: she called my name Naphtali
  chosen_korean: 내 이름을 납달리라고 불렀습니다
  alternatives_korean:
  - 내 이름을 납달리라고 불렀습니다
  - 내 이름을 납달리라 하였습니다
  - 내 이름을 납달리라고 지었습니다
  lexicon: καλέω
  rationale: 호명 동사를 한국어 성서 문체에 맞게 ‘...이라고 불렀습니다’로 옮겨, 이름 부여 행위를 분명히 했습니다.
theological_decisions:
- issue: ‘간계’로 번역된 라헬의 행위 평가
  chosen_reading: 본문은 라헬의 행동을 긍정하지 않고, 의도적으로 도덕적 긴장을 지닌 방식으로 서술합니다.
  alternative_readings:
  - ‘지혜롭게’처럼 완화하는 번역
  - 평가를 생략한 중립적 번역
  rationale: 앞선 전승 문맥과 영어 POB의 cunning은 라헬의 행동에 편법성/교묘함을 부여하므로, 이를 약화시키지 않는 것이 원문의 효과를 더 잘 보존합니다.
  doctrine_reference: 서사 평가의 보존과 원문 수사 유지
