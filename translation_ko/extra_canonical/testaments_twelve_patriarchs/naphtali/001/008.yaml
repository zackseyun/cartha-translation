  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Ὅθεν καὶ ὅμοιός μου⁴⁶ ἦν Γκατὰ πάντα¹⁴⁷ Ἰωσὴφ⁴⁸ κατὰ τὰς †εὐλογίας⁴⁹ Ῥαχιήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/008.yaml
  text: Therefore Joseph also was like me in every way, according to the prayers of Rachel.
translation:
  language: ko
  text: 그러므로 요셉도 라헬의 기도에 따라 모든 면에서 나와 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 인쇄 본문은 ‘라헬의 축복들’(εὐλογίας)로 읽지만, 다른 독해는 ‘라헬의 기도들’(εὐχάς)로 읽습니다. 여기서는 후자의 독해를 따랐습니다.
    reason: 인쇄 본문의 εὐλογίας와 영어 POB audit trail이 채택한 εὐχάς 사이의 본문상 차이를 투명하게 제시하여, 채택한 ‘기도’ 번역이 불확실한 본문 위의 선택임을 밝힙니다.
lexical_decisions:
- source_word: Ὅθεν καὶ
  english_pob_choice: Therefore ... also
  chosen_korean: 그러므로 ...도
  alternatives_korean:
  - 그리하여 ...도
  - 그러니 ...도
  lexicon: logical connective
  rationale: 원문의 인과·결론 연결을 자연스럽게 살리면서, 문맥상 비교 진술을 이어 주는 ‘도’를 함께 반영했습니다.
- source_word: ὅμοιός μου ἦν ... κατὰ τὰς εὐχάς/εὐλογίας Ῥαχιήλ
  english_pob_choice: was like me in every way, according to the prayers of Rachel
  chosen_korean: 레아헬의 기도에 따라 모든 면에서 나와 같았습니다
  alternatives_korean:
  - 레아헬의 기도대로 모든 면에서 나와 같았습니다
  - 레아헬의 간구에 따라 모든 면에서 나와 같았습니다
  lexicon: ὅμοιος / εὐχή
  rationale: ὅμοιός μου는 단순한 유사성보다 ‘나와 같았습니다’로 직역에 가깝게 옮기고, 카운터파트인 εὐχάς에 맞추어 ‘기도’로 반영했습니다.
- source_word: Ῥαχιήλ
  english_pob_choice: Rachel
  chosen_korean: 레아헬
  alternatives_korean:
  - 라헬
  - 라히엘
  lexicon: proper noun
  rationale: 이 본문은 히브리 성서의 라헬에 해당하는 인물로 보이므로, 한국어 성경에서 널리 통용되는 ‘라헬’ 계열을 우선하되, 음역의 일관성을 위해 ‘레아헬’로 적었습니다.
theological_decisions:
- issue: εὐλογίες vs. εὐχάς의 본문 전승
  chosen_reading: 본문의 의미는 축복보다 라헬의 기도/간구로 이해해 번역했습니다.
  alternative_readings:
  - ‘축복’으로 옮기기
  - ‘복들’로 직역하기
  rationale: 제공된 최종 수정과 영어 POB의 개정 내용이 εὐχάς 독해를 지지하므로, 라헬이 주체가 되는 문맥에 맞게 ‘기도’로 반영했습니다.
  doctrine_reference: 텍스트 비평/본문 전승
- issue: 비교 진술의 강도
  chosen_reading: ‘모든 면에서’로 전면적 유사성을 나타냈습니다.
  alternative_readings:
  - ‘모든 일에서’
  - ‘전적으로’
  rationale: 영어 POB의 every way를 따라, 요셉과 화자 사이의 포괄적 유사성을 과도하게 약화하지 않도록 했습니다.
  doctrine_reference: 문맥적 의미
