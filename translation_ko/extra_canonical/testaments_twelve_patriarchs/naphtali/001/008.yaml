  to: 그러므로 요셉도 라헬의 기도에 따라 모든 면에서 나와 같았습니다.[a]
  rationale: ‘레아헬’을 통용 표기인 ‘라헬’로 바로잡았습니다. 영어 POB가 채택한 εὐχάς 독해에 따른 ‘기도’는 유지하되, 제공된 그리스어 인쇄 본문의 εὐλογίας도 각주에 밝혀 대안 독해를 은폐하지 않았습니다. 빈 중복 각주 표지는 하나의 유의미한 본문 비평 각주로 교체했습니다.
  reviewer_model: gpt-5.6-terra
