source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Συνελθόντων⁸ τῶν υἱῶν αὐτοῦ⁹ ἐν τῷ¹⁰ ἑβδόμῳ μηνί, μιᾷ¹¹ τοῦ μηνός¹², ἐποίησε δεῖπνον αὐτοῖς¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/002.yaml
  text: When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them.
translation:
  language: ko
  text: 그의 아들들이 일곱째 달 첫날에 함께 모였을 때, 그는 그들을 위해 잔치를 베풀었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνελθόντων τῶν υἱῶν αὐτοῦ
  english_pob_choice: When his sons had gathered together
  chosen_korean: 그의 아들들이 함께 모였을 때
  alternatives_korean:
  - 그의 아들들이 모였을 때
  - 그의 아들들이 한곳에 모였을 때
  lexicon: συνέρχομαι
  rationale: 분사구의 완료·동시 상황을 살려 ‘함께 모였을 때’로 옮겨, 단순한 이동보다 집합의 상태를 드러냈습니다.
- source_word: ἐν τῷ ἑβδόμῳ μηνί
  english_pob_choice: in the seventh month
  chosen_korean: 일곱째 달
  alternatives_korean:
  - 칠월
  - 제칠월
  lexicon: ἕβδομος
  rationale: 달을 가리키는 일반적 시간표현으로서 자연스러운 현대 한국어인 ‘일곱째 달’을 사용했습니다.
- source_word: μιᾷ τοῦ μηνός
  english_pob_choice: on the first day of the month
  chosen_korean: 첫날
  alternatives_korean:
  - 그 달의 첫째 날
  - 월초의 첫날
  lexicon: μία / μήν
  rationale: 원문이 달의 첫째 날을 뜻하므로 간결하게 ‘첫날’로 옮기되, 앞의 ‘일곱째 달’과 결합해 의미가 분명하도록 했습니다.
- source_word: ἐποίησε δεῖπνον αὐτοῖς
  english_pob_choice: he made a feast for them
  chosen_korean: 그는 그들을 위해 잔치를 베풀었습니다
  alternatives_korean:
  - 그는 그들을 위해 잔치를 열었습니다
  - 그는 그들을 위해 식사를 마련했습니다
  lexicon: δεῖπνον
  rationale: δεῖπνον은 단순한 식사보다 공식적이고 기쁜 연회를 가리킬 수 있어, POB의 ‘feast’를 살린 ‘잔치를 베풀었습니다’로 옮겼습니다.
