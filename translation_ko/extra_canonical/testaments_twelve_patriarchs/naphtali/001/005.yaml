id: T12P.NAP.1.5
reference: Testament of Naphtali 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. *Ἥρξατο δὲ²⁵ λέγειν²⁶· Ἀκούσατε, τέκνα *μου, υἱοὶ Νεφθαλείμ, ἀκούσατε λόγους πατρὸς ὑμῶν²⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/005.yaml
  text: 'Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father.'
translation:
  language: ko
  text: 그는 말하기를 시작했습니다. "들으십시오, 나의 자녀들아, 납달리의 아들들아. 너희 아버지의 말을 들으십시오."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥρξατο δὲ λέγειν
  english_pob_choice: Then he began to speak
  chosen_korean: 그는 말하기를 시작했습니다
  alternatives_korean:
  - 그때 그는 말하기 시작했습니다
  - 그는 말을 시작했습니다
  lexicon: ἄρχομαι + λέγω
  rationale: ἤρξατο δὲ λέγειν은 ‘말하기를 시작하다’라는 개시 표현이므로, 서술을 자연스럽게 살리되 동작의 시작을 분명히 드러냈습니다.
- source_word: Ἀκούσατε
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  lexicon: ἀκούω
  rationale: 청중에게 직접 호소하는 명령형이므로 현대 합쇼체 명령으로 옮겼습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 나의 자녀들아
  alternatives_korean:
  - 내 자녀들아
  - 내 아이들아
  lexicon: τέκνον
  rationale: τέκνα는 혈연적·관계적 친밀함을 포함하는 복수 호칭이어서, 구어적이되 품위 있는 ‘자녀들’로 옮겼습니다.
- source_word: υἱοὶ Νεφθαλείμ
  english_pob_choice: sons of Naphtali
  chosen_korean: 납달리의 아들들아
  alternatives_korean:
  - 납달리의 자손들아
  - 납달리의 아들들이여
  lexicon: υἱός
  rationale: 직역에 가깝게 ‘아들들’로 유지하여 족속 표지를 살렸습니다.
- source_word: πατρὸς ὑμῶν
  english_pob_choice: your father
  chosen_korean: 너희 아버지의
  alternatives_korean:
  - 너희의 아버지의
  - 아버지의
  lexicon: πατήρ + ὑμεῖς
  rationale: 소유 대명사를 분명히 하여 화자가 청중에게 속한 아버지를 가리킨다는 점을 드러냈습니다.
theological_decisions:
- issue: 직접 호명과 명령의 문체
  chosen_reading: 인용문 안에서는 청중을 향한 직접 명령을 현대 공손 명령형으로 유지했습니다.
  alternative_readings:
  - 반말형으로 옮겨 구어성을 높이는 방안
  - 더 경어적인 완곡 표현으로 낮추는 방안
  rationale: 원문은 아버지가 자녀들에게 강하게 주의를 환기하는 호소이므로, 합쇼체 명령이 위계를 보존하면서도 현대 한국어에서 자연스럽습니다.
  doctrine_reference: 공적 낭독체와 원문 화행 보존
- issue: 고유명사 Naphtali의 표기
  chosen_reading: 납달리
  alternative_readings:
  - 납달리므
  - 나프탈리
  rationale: 한국어 성경에서 널리 정착한 형태를 따르되, 본문 문맥상 족속명으로 일관되게 유지했습니다.
  doctrine_reference: 고유명사 관용 표기
