id: T12P.NAP.1.1
reference: Testament of Naphtali 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: Διαθήκη Νεφθαλεὶμ τοῦ ὀγδόου υἱοῦ Ἰακὼβ καὶ Βάλλας¹. I. Ἀντίγραφον διαθήκης Νεφθαλείμ ἧς² διέθετο³ ἐν καιρῷ ⸀τῆς ἐξόδου⁴ αὐτοῦ ἐν ἔτει *ἑκατοστῷ καὶ τριακοστῷ⁵ τῆς⁶ ζωῆς αὐτοῦ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/001.yaml
  text: A copy of the testament of Naphtali, the eighth son of Jacob, which he ordained at the time of his departure, in the hundred and thirtieth year of his life.
translation:
  language: ko
  text: 야곱의 여덟째 아들 납달리의 유언의 사본입니다. 그는 떠나는 때에, 곧 자기 생애의 백삼십 년 되던 해에 이것을 제정하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη / Ἀντίγραφον διαθήκης
  english_pob_choice: A copy of the testament
  chosen_korean: 유언의 사본
  alternatives_korean:
  - 언약의 사본
  - 유언의 복사본
  - 증언의 사본
  lexicon: διαθήκη
  rationale: 이 문맥은 개인의 마지막 당부를 담은 문학적 ‘testament’이므로, 법적·성경적 ‘언약’보다 ‘유언’이 원문과 POB의 영어 선택을 더 직접적으로 반영합니다.
- source_word: διέθετο
  english_pob_choice: ordained
  chosen_korean: 제정하였습니다
  alternatives_korean:
  - 정해 두었습니다
  - 마련하였습니다
  - 질서를 세우셨습니다
  lexicon: διατίθημι
  rationale: POB의 ‘ordained’는 단순한 정리보다 유언을 공적으로 확정해 두는 뉘앙스를 살리므로, 한국어에서는 격식을 갖춘 ‘제정하다’가 가장 가깝습니다.
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  english_pob_choice: at the time of his departure
  chosen_korean: 떠나는 때에
  alternatives_korean:
  - 그의 출발 때에
  - 그의 떠남의 때에
  - 세상을 떠날 때에
  lexicon: ἔξοδος
  rationale: ‘departure’는 죽음을 완곡하게 가리키는 표현이지만, 원문의 직접성을 살리기 위해 종교적 관용구인 ‘세상을 떠날 때’보다 덜 해석적인 ‘떠나는 때에’를 택했습니다.
- source_word: ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the hundred and thirtieth year of his life
  chosen_korean: 자기 생애의 백삼십 년 되던 해에
  alternatives_korean:
  - 그의 생애 백삼십 해에
  - 살아온 지 백삼십 해 되던 해에
  - 나이 백삼십 살 되던 해에
  lexicon: ἔτος / ζωή
  rationale: ‘year of his life’의 직역을 유지하되, 한국어 문장 흐름에 맞게 ‘자기 생애의 백삼십 년 되던 해에’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: διαθήκη의 의미 범위
  chosen_reading: 이 절에서는 성경적 ‘언약’이 아니라 문학 장르로서의 ‘유언’으로 번역했습니다.
  alternative_readings:
  - 언약
  - 증언
  - 유서
  rationale: 본문 전체가 족장들의 마지막 당부를 소개하는 서두이므로, 독자가 신학적 ‘언약’으로 오해하지 않도록 장르 표지를 우선했습니다.
  doctrine_reference: 문학 장르 구분 및 용어 일관성
