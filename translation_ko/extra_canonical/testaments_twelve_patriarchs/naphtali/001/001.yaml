  - severity: medium
    issue: ‘제정하였습니다’는 διέθετο의 문맥상 부정확하고 어색합니다.
    rationale: 이 동사는 유언을 마련하거나 작성하는 행위를 가리키며, 한국어 ‘제정하다’는 법률·제도 등을 공식적으로 만드는 뜻이 강합니다.
