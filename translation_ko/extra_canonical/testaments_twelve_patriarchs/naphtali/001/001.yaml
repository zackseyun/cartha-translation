revisions:
- from: 야곱의 여덟째 아들 납달리의 유언의 사본입니다. 그는 떠나는 때에, 곧 자기 생애의 백삼십 년 되던 해에 이것을 제정하였습니다.
  to: 야곱과 빌하의 여덟째 아들 납달리의 유언 사본입니다. 이는 그가 백삼십 세 되던 해에 떠날 때 작성한 것입니다.
  rationale: 원문 표제에 있는 빌하를 복원하고, 유언 문맥의 διέθετο를 현대 한국어에 맞게 ‘작성한 것’으로 옮겼습니다. ‘떠날 때’는 ἔξοδος가 지닌 완곡성과 가능한 죽음의 함의를 해석적으로 확정하지 않고 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:05Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 그리스어 표제의 ‘야곱과 빌하의 여덟째 아들’에서 빌하가 빠져 있습니다. 또한 διέθετο는 이 문맥에서 유언을 ‘제정하다’라기보다 ‘작성하다/정해 두다’로 옮기는 편이 적절합니다.
  naturalness: ‘유언의 사본’은 자연스럽지만, ‘자기 생애의 백삼십 년 되던 해’와 ‘제정하였습니다’는 현대 한국어로 다소 어색하거나 행정·법령 제정의 느낌을 줍니다. 문장을 두 문장으로 유지하면서 ‘작성한 것’으로 처리하면 자연스럽고 격식도 유지됩니다.
  terminology: διαθήκη는 이 작품의 유언·당부라는 장르상 ‘유언’이 적절합니다. ἔξοδος는 죽음으로 단정하지 않고 ‘떠날 때’로 보존합니다. 이름은 통상 한국어 성경 표기인 ‘납달리’, ‘빌하’를 사용합니다.
  issues:
