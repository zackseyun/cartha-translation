id: T12P.NAP.1.4
reference: Testament of Naphtali 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ²⁰ *δοξάζων τὸν²¹ Κύριον²² *ἐκραταιώθη καὶ εἶπεν²³, ὅτι Μετὰ τὸ δεῖπνον τὸ χθὲς *ἀπέθανεν ἡ σάρξ μου²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/004.yaml
  text: And while blessing and glorifying the Lord, he grew strong and said, “After yesterday’s meal, my flesh died.”
translation:
  language: ko
  text: 그리고 주님을 찬양하고 영화롭게 하자 힘이 회복되었고, “어제의 식사 뒤에 내 육체가 죽었습니다”라고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων τὸν Κύριον
  english_pob_choice: while blessing and glorifying the Lord
  chosen_korean: 주님을 찬양하고 영화롭게 하자
  alternatives_korean:
  - 주님을 찬양하고 영화롭게 하면서
  - 주님께 영광을 돌리며
  lexicon: δοξάζω, κύριος
  rationale: δοξάζων은 단순한 ‘축복하다’보다 ‘찬양하며 영화롭게 하다’의 병렬적 의미를 살려 옮겼고, κύριος는 본문 맥락상 주님으로 자연스럽게 번역했습니다.
- source_word: ἐκραταιώθη
  english_pob_choice: he grew strong
  chosen_korean: 힘이 회복되었고
  alternatives_korean:
  - 강건해졌고
  - 강해졌고
  lexicon: κραταιόω
  rationale: 문맥상 실제로 몸의 힘이 살아나는 상태 변화를 나타내므로 ‘회복되다’가 가장 자연스럽고, 과도한 의역 없이 결과 상태를 전달합니다.
- source_word: τὸ δεῖπνον τὸ χθὲς
  english_pob_choice: yesterday’s meal
  chosen_korean: 어제의 식사
  alternatives_korean:
  - 어제의 만찬
  - 어제의 저녁식사
  lexicon: δεῖπνον
  rationale: δεῖπνον은 반드시 호화로운 ‘잔치’가 아니라 식사 일반일 수 있으므로, 개정된 영어 POB의 ‘meal’에 맞춰 중립적인 ‘식사’를 택했습니다.
- source_word: ἀπέθανεν ἡ σάρξ μου
  english_pob_choice: my flesh died
  chosen_korean: 내 육체가 죽었습니다
  alternatives_korean:
  - 내 육신이 죽었습니다
  - 내 몸이 죽었습니다
  lexicon: σάρξ
  rationale: σάρξ를 단순한 ‘살’이 아니라 인체의 육체적 실재를 가리키는 표현으로 받아, 본문의 직설성을 유지하는 ‘육체’로 옮겼습니다.
theological_decisions:
- issue: 육체의 죽음 표현을 어떻게 이해할지
  chosen_reading: 화자는 식사 뒤에 실제로 몸의 쇠약 또는 죽음을 말하는 직설적 표현으로 읽었습니다.
  alternative_readings:
  - 비유적으로 욕망의 죽음을 말하는 표현
  - 과장된 수사로서의 표현
  rationale: 그리스어 문장은 ἀπέθανεν을 문자적으로 사용하고 있어, 본문이 허용하는 가장 직접적인 의미를 보존하는 것이 적절합니다.
  doctrine_reference: 본문 주석적 판단; 수사적 과장 가능성은 문맥 주석에서 검토 가능
