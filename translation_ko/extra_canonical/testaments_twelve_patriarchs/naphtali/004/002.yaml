id: T12P.NAP.4.2
reference: Testament of Naphtali 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἐπάξει Κύριος ὑμῖν αἰχμαλωσίαν, καὶ δουλεύσετε ⌈ἐκεῖ⌉¹³ *τοῖς ἐχθροῖς¹⁴ ὑμῶν, καὶ πάσῃ κακώσει¹⁵ καὶ θλίψει †συναναστραφήσεσθε¹⁶, ἕως ἀναλώσει¹⁷ Κύριος πάντας ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/002.yaml
  text: And the Lord will bring captivity upon you, and there you will serve your enemies, and you will be afflicted with every kind of evil and tribulation, until the Lord has consumed you all.
translation:
  language: ko
  text: 그리고 주님께서 너희에게 포로 생활을 닥치게 하실 것이며, 너희는 그곳에서 너희 원수들을 섬기고, 주님께서 너희 모두를 멸하실 때까지 온갖 학대와 환난을 겪게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 본문은 독자에게 직접 말하는 서술문이며, 여기서는 일반적인 ‘주님’이 가장 자연스럽고 경건한 한국어입니다. YHWH 명시 인용이나 구약 인용 표지가 없어 야훼로 고정하지 않았습니다.
- source_word: αἰχμαλωσίαν
  english_pob_choice: captivity
  chosen_korean: 포로 생활
  alternatives_korean:
  - 포로 됨
  - 사로잡힘
  - 포로됨
  lexicon: αἰχμαλωσία
  rationale: 단순한 ‘사로잡힘’보다 지속 상태를 드러내는 ‘포로 생활’이 문맥상의 징계와 유배 상태를 더 잘 보여 줍니다.
- source_word: δουλεύσετε
  english_pob_choice: you will serve
  chosen_korean: 섬기게 될 것이며
  alternatives_korean:
  - 노예로 일하게 될 것이며
  - 종노릇하게 될 것이며
  - 봉사하게 될 것이며
  lexicon: δουλεύω
  rationale: 영어 POB의 ‘serve’는 강제적 예속을 뜻하므로, 한국어에서는 자연스럽되 종속성을 남기는 ‘섬기다’로 옮겼습니다. 여기서는 명시적으로 ‘노예’라고 하지는 않았지만 예속의 의미는 문맥으로 유지됩니다.
- source_word: κακώσει καὶ θλίψει
  english_pob_choice: every kind of evil and tribulation
  chosen_korean: 온갖 악과 환난
  alternatives_korean:
  - 모든 해악과 고난
  - 갖가지 악과 고통
  lexicon: κακωσις, θλιψις
  rationale: 두 명사를 병렬로 살려 ‘악’과 ‘환난’으로 옮겼고, ‘πάσῃ’는 포괄성을 드러내는 ‘온갖’으로 처리했습니다.
- source_word: ἀναλώσει
  english_pob_choice: has consumed
  chosen_korean: 소멸하실 때까지
  alternatives_korean:
  - 멸하실 때까지
  - 다 없애실 때까지
  - 소진하실 때까지
  lexicon: ἀναλίσκω
  rationale: 문맥상 단순 소진보다 종결적 파괴를 나타내므로 ‘소멸하다’를 택해 심판의 강도를 유지했습니다.
theological_decisions:
- issue: 심판의 주체와 강도
  chosen_reading: 주님께서 포로 생활과 환난을 가져오시고 마침내 모두를 소멸하신다는 경고로 읽었습니다.
  alternative_readings:
  - 징계의 결과를 역사적 귀결 정도로 약화해 읽는 방식
  - ‘소멸’ 대신 완화된 ‘끝내실’로 읽는 방식
  rationale: 그리스어 동사들과 영어 POB가 모두 주도적 심판 행위를 분명히 하므로, 경고의 강도를 약화하지 않았습니다.
  doctrine_reference: 신명기적 언약 저주와 심판 경고
