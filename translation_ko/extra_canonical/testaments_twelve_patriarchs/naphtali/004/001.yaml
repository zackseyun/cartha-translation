revisions:
- from: 이것들을 내가 너희에게 말하는 것은, 내 자녀들아, 내가 에녹의 책에서 너희도 주님에게서 떠나, 이방인들의 모든 불법을 따라가며 소돔의 모든 악을 행할 것임을 알게 되었기 때문입니다.[a]
  to: 내 자녀들아, 내가 이것들을 너희에게 말하는 것은, 내가 에녹의 글에서 너희도 주님에게서 떠나 모든 이방인의 불법을 따라 행하며 소돔의 모든 악을 행할 것을 알게 되었기 때문입니다.
  rationale: 단수 γραφή를 ‘글’로 옮기고, κατὰ의 행위 방식 표현을 ‘따라 행하며’로 명료하게 반영했습니다. 문장 어순만 현대적인 합쇼체에 맞게 다듬었으며, 미래 예고와 ‘너희도’, ‘모든’의 범위는 보존했습니다. 원문에 없는 해석적 보충이나 교리적 한정은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
