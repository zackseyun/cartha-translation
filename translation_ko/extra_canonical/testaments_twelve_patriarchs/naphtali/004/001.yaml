review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 그리스어의 ‘ἐν τῇ γραφῇ Ἐνώχ’는 단수 ‘글/기록’이므로 ‘에녹의 글에서’가 ‘에녹의 책에서’보다 직접적입니다. 또한 ‘κατὰ ... ἀνομίαν’은 단순히 불법을 ‘따라간다’기보다 그 불법을 ‘따라 행한다/그에 따라 걷는다’는 뜻입니다.
  naturalness: 초안은 문법적으로 가능하나 ‘이것들을 내가 너희에게 말하는 것은, 내 자녀들아’는 현대 한국어 합쇼체에서 어순과 호격 삽입이 다소 부자연스럽습니다. ‘내 자녀들아, 내가 이것들을 너희에게 말하는 것은’이 더 자연스럽습니다.
  terminology: ‘주님’, ‘불법’, ‘소돔의 모든 악’은 문맥상 유지할 수 있습니다. ‘글’은 γραφή의 단수성을 보존하면서 특정 정경성이나 한 권의 책이라는 함의를 덜 부과합니다.
  issues:
  - severity: medium
    issue: ‘에녹의 책’
    rationale: γραφή는 단수 ‘글/기록’이며, 영어 감사 이력도 ‘writing’으로 확정했습니다. ‘책’은 가능한 번역이지만 본문이 요구하지 않는 물질적·정경적 함의를 더할 수 있습니다.
  - severity: medium
    issue: ‘이방인들의 모든 불법을 따라가며’
    rationale: κατὰ πᾶσαν ἀνομίαν은 ‘모든 불법을 따라’라는 행위의 규범·방식 표현입니다. ‘따라 행하며’가 원문의 관계를 더 명료하고 자연스럽게 반영합니다.
  - severity: low
    issue: 도입부의 어순
    rationale: 호격 ‘내 자녀들아’를 앞에 두고 주절을 정리하면 한국어 문장 흐름이 좋아지며 의미 변화가 없습니다.
  revised_text: 내 자녀들아, 내가 이것들을 너희에게 말하는 것은, 내가 에녹의 글에서 너희도 주님에게서 떠나 모든 이방인의 불법을 따라 행하며 소돔의 모든 악을 행할 것을 알게 되었기 때문입니다.
