id: T12P.NAP.4.1
reference: Testament of Naphtali 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: IV. Ταῦτα¹ λέγω ὑμῖν², τέκνα μου, ὅτι ἔγνων³ ἐν τῇ⁴ γραφῇ⁵ Ἐνώχ, ὅτι καίγε⁶ ὑμεῖς ἀποστήσεσθε ἀπὸ Κυρίου⁷, πορευόμενοι κατὰ πᾶσαν ἀνομίαν⁸ ἐθνῶν⁹, καὶ ποιήσετε¹⁰ πᾶσαν πονηρίαν¹¹ Σοδόμων¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/001.yaml
  text: These things I say to you, my children, because I have learned in the writing of Enoch that you too will depart from the Lord, walking in all the lawlessness of the nations and doing all the wickedness of Sodom.
translation:
  language: ko
  text: 이것들을 내가 너희에게 말하는 것은, 내 자녀들아, 내가 에녹의 책에서 너희도 주님에게서 떠나, 이방인들의 모든 불법을 따라가며 소돔의 모든 악을 행할 것임을 알게 되었기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα … λέγω ὑμῖν
  english_pob_choice: These things I say to you
  chosen_korean: 이것들을 내가 너희에게 말하는 것은
  alternatives_korean:
  - 이런 것들을 나는 너희에게 말합니다
  - 이 말씀들을 너희에게 하는 것은
  lexicon: λέγω
  rationale: 앞의 지시대명사와 말하기 동사를 자연스럽게 묶어, 원문의 도입 기능과 구어적 직접성을 살렸습니다.
- source_word: ἐν τῇ γραφῇ Ἐνώχ
  english_pob_choice: in the writing of Enoch
  chosen_korean: 에녹의 책에서
  alternatives_korean:
  - 에녹의 글에서
  - 에녹의 기록에서
  lexicon: γραφή
  rationale: 영어 POB의 audit trail처럼 ἐν τῇ γραφῇ를 ‘~에서’로 처리해 출처 안에서 알게 되었다는 의미를 살렸습니다.
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  english_pob_choice: you too will depart from the Lord
  chosen_korean: 너희도 주님에게서 떠나
  alternatives_korean:
  - 너희도 주님을 떠나
  - 너희도 주님에게서 돌아서
  lexicon: ἀποστήσεσθε
  rationale: 단순한 ‘이탈’보다 관계적·신앙적 이탈을 드러내는 ‘떠나’로 옮겼고, ἀπό를 한국어 조사 ‘에게서’로 반영했습니다.
- source_word: ἀνομίαν ἐθνῶν / πονηρίαν Σοδόμων
  english_pob_choice: the lawlessness of the nations / the wickedness of Sodom
  chosen_korean: 이방인들의 모든 불법 / 소돔의 모든 악
  alternatives_korean:
  - 이방인들의 모든 무법 / 소돔의 모든 악행
  - 민족들의 모든 불법 / 소돔의 모든 악
  lexicon: ἀνομία, πονηρία
  rationale: ἀνομία는 율법 위반의 성격을 드러내는 ‘불법’으로, πονηρία는 도덕적 악함을 일반적으로 가리키는 ‘악’으로 옮겼습니다.
theological_decisions:
- issue: 주님(Κυρίου)의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주(主)
  - 야훼
  rationale: 여기서는 인용 표지가 아닌 서술 내 신적 호칭으로 기능하지만, 본문이 예수 인용이 아니라 문맥상 주님에 대한 일반적 경외 표현이므로 한국어 가독성을 위해 ‘주님’으로 유지했습니다.
  doctrine_reference: 신명기적/언약적 경외 호칭의 일반 번역 관행
