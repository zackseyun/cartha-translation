id: T12P.NAP.2.6
reference: Testament of Naphtali 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. *Ὡς γὰρ ἡ ἰσχὺς αὐτοῦ, οὕτως⁴⁸ καὶ ὁ λόγος αὐτοῦ⁵⁰, ἢ ἐν νόμῳ Κυρίου, ἢ ἐν νόμῳ⁵¹ τοῦ⁵² Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/006.yaml
  text: As a person's strength is, so also is his word, whether in the law of the Lord or in the works of Beliar.
translation:
  language: ko
  text: 사람의 힘이 어떠하냐에 따라 그의 말도 그러합니다. 그러므로 그것은 주님의 율법 안에 있기도 하고, 벨리아르의 율법의 행위들 안에 있기도 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰσχὺς
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 능력
  - 힘
  lexicon: ἰσχύς
  rationale: 사람의 내적·실제적 역량을 가리키는 문맥이므로, 현대 한국어에서 가장 자연스러운 ‘힘’으로 옮겼습니다.
- source_word: λόγος
  english_pob_choice: word
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 언어
  - 말
  lexicon: λόγος
  rationale: POB가 ‘word’로 확정한 점을 따라, 인격적/발화적 내용을 드러내는 ‘말’로 옮겼습니다. 교리적 함의가 강한 ‘말씀’은 문맥상 과도할 수 있어 피했습니다.
- source_word: νόμος Κυρίου
  english_pob_choice: law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 율법
  lexicon: νόμος
  rationale: 토라적·규범적 의미가 분명하므로 기본 용례인 ‘율법’을 유지했습니다.
- source_word: νόμῳ τοῦ Βελίαρ / ἔργοις
  english_pob_choice: in the works of Beliar
  chosen_korean: 벨리아르의 율법의 행위들
  alternatives_korean:
  - 벨리아르의 율법 안에
  - 벨리아르의 행위들 안에
  - 벨리아르의 율법의 행위들
  lexicon: νόμος
  rationale: 본문은 ‘νόμῳ … ἢ ἐν νόμῳ⁵¹ τοῦ⁵² Βελίαρ’처럼 전승이 다소 불안정하고, POB의 최신 판정이 마지막 구를 ‘in the works of Beliar’로 조정했으므로, ‘안에’와 ‘행위들’을 함께 살려 구조와 의미를 모두 반영했습니다.
theological_decisions:
- issue: 벨리아르(Beliar) 관련 대조 구조
  chosen_reading: 주님의 율법과 벨리아르의 행위들 사이의 대조로 읽었습니다.
  alternative_readings:
  - 벨리아르의 율법과의 대조
  - 벨리아르의 영역 전체에 대한 대조
  rationale: 영어 POB의 수정에 따라 마지막 구는 ‘law’의 반복이 아니라 ‘works’의 대조로 이해하는 것이 본문 흐름과 더 잘 맞습니다.
  doctrine_reference: 문학적/전승비평적 판단
