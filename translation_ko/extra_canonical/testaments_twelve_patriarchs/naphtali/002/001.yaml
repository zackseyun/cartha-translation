  text: Now my mother Bilhah was the daughter of Rotheus, the brother of Deborah, the nurse of Rebecca; she was born on the same day as Rachel. 10 And Rotheus was of the lineage of Abraham, a Chaldean, God-fearing, freeborn and noble. 11 And having been taken captive, he was bought by Laban; and Laban gave him his maidservant Eunan as a wife, and she bore a daughter, and he called her name Zelpha, after the name of the city in which he had been taken captive. 12 And after this she bore Bilhah, saying, ‘My daughter is one who renews.’ II. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he indeed blessed me as a deer.
translation:
  language: ko
  text: 이제 내 어머니 빌하는 레베카의 유모 드보라의 형제인 로테우스의 딸이었습니다. 그녀는 라헬과 같은 날에 태어났습니다. 10 로테우스는 아브라함의 혈통에 속한 사람으로, 갈대아 사람이었으며, 하나님을 경외하는 자유민이자 고귀한 사람이었습니다. 11 그는 포로로 잡힌 뒤 라반에게서 사들여졌고, 라반은 자기 여종 유난을 아내로 그에게 주었습니다. 그 여자가 딸을 낳자, 그는 그 딸의 이름을 자기가 포로로 잡혀 있던 성읍의 이름을 따라 젤파라고 불렀습니다. 12 그리고 그 뒤에 빌하를 낳으며 말했습니다. “내 딸은 새롭게 하는 자입니다.” II. 나는 사슴처럼 발이 가벼웠고, 내 아버지 야곱은 나를 모든 심부름에 세웠으며, 정말로 나를 사슴처럼 축복하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ γένους ἦν Ἀβραάμ
  english_pob_choice: was of the lineage of Abraham
  chosen_korean: 아브라함의 혈통에 속한 사람
  alternatives_korean:
  - 아브라함의 족속에 속한 사람
  - 아브라함의 가문 출신인 사람
  lexicon: γένους
  rationale: γένους는 단순한 출신보다 혈통·계보의 소속을 가리키므로, POB의 'lineage'를 살려 혈통에 속한 사람으로 옮겼습니다.
- source_word: θεοσεβής
  english_pob_choice: God-fearing
  chosen_korean: 하나님을 경외하는
  alternatives_korean:
  - 경건한
  - 하나님을 두려워하는
  lexicon: θεοσεβής
  rationale: 이 형용사는 단순한 도덕적 경건보다 하나님에 대한 경외를 강조하므로, 한국어에서도 직역에 가까운 표현을 택했습니다.
- source_word: ἐλεύθερος καὶ εὐγενής
  english_pob_choice: freeborn and noble
  chosen_korean: 자유민이자 고귀한 사람이었습니다
  alternatives_korean:
  - 태생부터 자유로운 사람이자 귀족이었습니다
  - 자유민이자 귀족이었습니다
  lexicon: ἐλεύθερος, εὐγενής
  rationale: ἐλεύθερος는 신분상의 자유를, εὐγενής는 출신의 고귀함을 나타내므로 사회적 신분을 드러내는 한국어로 대응했습니다.
- source_word: ἀγγελίαν
  english_pob_choice: every errand
  chosen_korean: 모든 심부름
  alternatives_korean:
  - 모든 전갈
  - 모든 심부름거리
  lexicon: ἀγγελία
  rationale: 문맥상 '전령/소식'이 아니라 시중들며 맡는 심부름의 뜻이므로, POB의 의미를 따라 자연스러운 현대어로 옮겼습니다.
theological_decisions:
- issue: 자기 설명의 수사(“새롭게 하는 자”)를 직역할지, 이름의 의미를 풀어줄지
  chosen_reading: “내 딸은 새롭게 하는 자입니다.”
  alternative_readings:
  - “내 딸은 새로움입니다.”
  - “내 딸은 갱신하는 이입니다.”
  rationale: 문맥이 이름의 유래를 설명하는 말이므로, POB의 'one who renews'를 따라 행위 주체성을 살리되 한국어 어법에 맞게 남겼습니다.
  doctrine_reference: 명명 설명, 어원 주해
