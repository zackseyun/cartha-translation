revisions:
- from: 이제 내 어머니 빌하는 레베카의 유모 드보라의 형제인 로테우스의 딸이었습니다. 그녀는 라헬과 같은 날에 태어났습니다. 10 로테우스는 아브라함의 혈통에 속한 사람으로, 갈대아 사람이었으며, 하나님을 경외하는 자유민이자 고귀한 사람이었습니다. 11 그는 포로로 잡힌 뒤 라반에게서 사들여졌고, 라반은 자기 여종 유난을 아내로 그에게 주었습니다. 그 여자가 딸을 낳자, 그는 그 딸의 이름을 자기가 포로로 잡혀 있던 성읍의 이름을 따라 젤파라고 불렀습니다. 12 그리고 그 뒤에 빌하를 낳으며 말했습니다. “내 딸은 새롭게 하는 자입니다.” II. 나는 사슴처럼 발이 가벼웠고, 내 아버지 야곱은 나를 모든 심부름에 세웠으며, 정말로 나를 사슴처럼 축복하셨습니다.
  to: '내 어머니 빌하는 레베카의 유모 드보라의 형제인 로테우스의 딸이었습니다. 드보라는 라헬과 같은 날에 태어났습니다. 10 로테우스는 아브라함의 혈통에 속한 사람으로, 갈대아 사람이었으며, 하나님을 경외하는 자유민이자 고귀한 사람이었습니다. 11 그는 포로로 잡힌 뒤 라반에게 사들여졌고, 라반은 자기 여종 유난을 그의 아내로 주었습니다. 그 여자가 딸을 낳자, 그는 그 딸의 이름을 자신이 포로로 잡혔던 성읍의 이름을 따라 젤파라고 불렀습니다. 12 그리고 그 뒤에 그 여자는 빌하를 낳고 말했습니다. “내 딸은 새롭게 하는 이입니다.”


    II. 나는 암사슴처럼 발이 가벼웠고, 내 아버지 야곱은 나에게 모든 심부름을 맡기셨으며, 참으로 나를 암사슴처럼 축복하셨습니다.'
  rationale: 원문의 통사와 행위 관계를 우선하여 라반을 구매자로 바로잡고, 한국어에서 불필요한 담화 표지를 제거했습니다. 드보라를 받는 관계절을 명시했으며, ἔλαφος의 성별 어휘와 ἀγγελία의 문맥상 의미를 자연스러운 합쇼체로 반영했습니다. ‘새롭게 하는 이’는 Καινοποιός의 다소 불명확한 명명 설명을 교리적으로 해석하지 않고 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:08Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 첫머리의 ‘이제’는 그리스어 δέ의 단순 연결 기능을 과도하게 표면화하며, 11절 ‘라반에게서 사들여졌다’는 라반이 구매자라는 원문의 뜻을 반대로 만들 수 있습니다. 또한 9절 관계절은 문법상 드보라를 가리키므로 이를 분명히 했고, 2장 1절의 ἔλαφος(암사슴)를 반영했습니다.
  naturalness: 전반적으로 합쇼체 문체는 자연스럽지만, ‘모든 심부름에 세웠으며’보다 ‘모든 심부름을 맡기셨으며’가 현대 한국어에서 더 자연스럽습니다. ‘새롭게 하는 이’는 명명 설명의 어조를 보존하면서도 매끄럽습니다.
  terminology: 인명 음역(빌하, 로테우스, 드보라, 레베카, 라헬, 라반, 유난, 젤파, 야곱)과 ‘하나님을 경외하는’, ‘자유민’, ‘아브라함의 혈통’은 일관되고 적절합니다. θεοσεβής를 ‘하나님을 경외하는’으로 옮긴 것은 적절합니다.
  issues:
  - severity: medium
    issue: 11절의 ‘라반에게서 사들여졌고’
    rationale: ὑπὸ Λαβάν은 수동문의 행위자, 곧 라반이 그를 사들였음을 나타냅니다. ‘라반에게서’는 라반을 판매자로 읽게 할 수 있으므로 ‘라반에게 사들여졌고’로 고쳐야 합니다.
  - severity: low
    issue: 첫머리의 ‘이제’
    rationale: 영어 POB 감사 이력도 선행 담화 표지 ‘Now’를 제거했습니다. 그리스어 δέ는 여기서 한국어 ‘이제’를 요구하지 않는 연결사이므로 삭제하는 편이 자연스럽고 충실합니다.
  - severity: low
    issue: 9절 관계절의 지시 대상 및 2장 1절의 동물 명칭
    rationale: ἥτις는 여성 단수인 드보라를 가리키므로 ‘드보라는’으로 명시하는 것이 안전합니다. ἔλαφος는 암사슴을 뜻하므로 이를 반영했습니다.
  revised_text: '내 어머니 빌하는 레베카의 유모 드보라의 형제인 로테우스의 딸이었습니다. 드보라는 라헬과 같은 날에 태어났습니다. 10 로테우스는 아브라함의 혈통에 속한 사람으로, 갈대아 사람이었으며, 하나님을 경외하는 자유민이자 고귀한 사람이었습니다. 11 그는 포로로 잡힌 뒤 라반에게 사들여졌고, 라반은 자기 여종 유난을 그의 아내로 주었습니다. 그 여자가 딸을 낳자, 그는 그 딸의 이름을 자신이 포로로 잡혔던 성읍의 이름을 따라 젤파라고 불렀습니다. 12 그리고 그 뒤에 그 여자는 빌하를 낳고 말했습니다. “내 딸은 새롭게 하는 이입니다.”


    II. 나는 암사슴처럼 발이 가벼웠고, 내 아버지 야곱은 나에게 모든 심부름을 맡기셨으며, 참으로 나를 암사슴처럼 축복하셨습니다.'
