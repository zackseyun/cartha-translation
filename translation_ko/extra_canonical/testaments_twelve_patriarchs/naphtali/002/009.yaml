  - severity: low
    issue: εἰς ἀγαθόν 및 ἐν τάξει의 연결이 직역투입니다.
    rationale: ‘선을 위한 질서 안에’보다 ‘선을 이루도록 질서 있게’가 목적 관계와 행위의 질서라는 뜻을 자연스럽게 전달합니다.
