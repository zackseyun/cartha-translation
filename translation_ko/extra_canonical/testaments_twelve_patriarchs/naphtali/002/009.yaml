revisions:
- from: 그러므로, 내 자녀들아, 너희의 모든 행위가 하나님을 경외하는 가운데 선을 위한 질서 안에 있게 하여라. 그리고 아무것도 무질서하게, 경멸하며 행하지 말고, 제때가 아닌 때에 하지도 말라.[a][b][c]
  to: 그러므로 내 자녀들아, 너희의 모든 행위가 하나님을 경외하는 가운데 선을 이루도록 질서 있게 하십시오. 경멸하는 마음으로 아무 무질서한 일도 하지 말고, 각 일에 알맞은 때를 벗어나서도 하지 마십시오.[a][b][c]
  rationale: 합쇼체 명령으로 일관되게 고치고, ‘질서 있게’와 ‘선을 이루도록’으로 원문의 명령 및 목적 표현을 자연스럽게 재구성했습니다. ‘경멸하는 마음으로 아무 무질서한 일도’는 ἐν καταφρονήσει와 ἄτακτον을 모두 보존합니다. 마지막 구절은 ‘그것의 때’라는 대명사의 정확한 선행사를 확정하지 않고, 행위마다 알맞은 때가 있다는 원문의 요지를 드러냅니다. 기존의 [a]–[c] 앵커는 원문에 대응하는 주석 내용이 제공되지 않았으므로 본문에 그대로 유지했으며, 새 주석은 추가하지 않았습니다.
