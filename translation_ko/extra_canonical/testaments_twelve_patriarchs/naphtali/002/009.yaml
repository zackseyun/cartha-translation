id: T12P.NAP.2.9
reference: Testament of Naphtali 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Οὕτως⁷⁶ ⌜οὖν⌝ *ἔστωσαν, τέκνα μου, πάντα τὰ ἔργα ὑμῶν ἐν τάξει εἰς ἀγαθόν⁷⁷ ἐν φόβῳ Θεοῦ, καὶ μηδὲν ἄτακτον ποιήσητε⁷⁸ ἐν καταφρονήσει, μηδὲ⁷⁹ ἔξω⁸⁰ *καιροῦ αὐτοῦ⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/009.yaml
  text: So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.
translation:
  language: ko
  text: 그러므로, 내 자녀들아, 너희의 모든 행위가 하나님을 경외하는 가운데 선을 위한 질서 안에 있게 하여라. 그리고 아무것도 무질서하게, 경멸하며 행하지 말고, 제때가 아닌 때에 하지도 말라.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστωσαν / ἐν τάξει
  english_pob_choice: let all your works be in order
  chosen_korean: 모든 행위가 … 질서 안에 있게 하여라
  alternatives_korean:
  - 질서 있게 하게 하여라
  - 정돈되게 하여라
  lexicon: τάξις
  rationale: 단순한 ‘정리됨’보다 행위의 전체적 질서와 배치를 살리기 위해 ‘질서 안에 있게’로 옮겼습니다.
- source_word: εἰς ἀγαθόν
  english_pob_choice: for good
  chosen_korean: 선을 위한
  alternatives_korean:
  - 좋은 것을 위하여
  - 유익을 위해
  lexicon: ἀγαθός
  rationale: 목적 구문을 자연스럽게 살리면서도 도덕적 선의 방향을 분명히 하기 위해 ‘선을 위한’으로 했습니다.
- source_word: ἐν φόβῳ Θεοῦ
  english_pob_choice: in the fear of God
  chosen_korean: 하나님을 경외하는 가운데
  alternatives_korean:
  - 하나님을 두려워하는 가운데
  - 하나님에 대한 경외 속에서
  lexicon: φόβος + Θεός
  rationale: 성경적 관용구의 핵심인 경외를 살리되 현대 한국어에서 자연스럽게 들리도록 표현했습니다.
- source_word: μηδὲν ἄτακτον ποιήσητε ἐν καταφρονήσει
  english_pob_choice: do nothing disorderly in contempt
  chosen_korean: 아무것도 무질서하게, 경멸하며 행하지 말고
  alternatives_korean:
  - 아무것도 무질서한 일을 경멸 속에서 하지 말고
  - 아무 일도 무례하고 질서 없이 하지 말고
  lexicon: ἄτακτον / καταφρονήσει
  rationale: ‘무질서하게’와 ‘경멸하며’의 두 요소를 분리해, POB의 중첩된 부정을 최대한 그대로 드러냈습니다.
- source_word: μηδὲ ἔξω καιροῦ αὐτοῦ
  english_pob_choice: nor outside its proper time
  chosen_korean: 제때가 아닌 때에 하지도 말라
  alternatives_korean:
  - 그 적절한 때 밖에서 하지도 말라
  - 그때가 아니면 하지도 말라
  lexicon: καιρός
  rationale: ‘proper time’의 시간적 적절성을 살리면서, 한국어에서 가장 자연스러운 금지형으로 정리했습니다.
theological_decisions:
- issue: ‘하나님을 경외함’의 윤리적 기능
  chosen_reading: 경외는 단순한 감정이 아니라 행위를 질서 있게 하고 선을 지향하게 만드는 근거로 읽었습니다.
  alternative_readings:
  - 하나님을 두려워하는 종교적 태도
  - 예배적 경건의 일반적 표현
  rationale: 문맥이 행위의 질서와 시기를 규정하므로, 경외를 윤리적 동력으로 드러내는 것이 본문 흐름에 맞습니다.
  doctrine_reference: 지혜문학적 경건과 윤리적 순종
