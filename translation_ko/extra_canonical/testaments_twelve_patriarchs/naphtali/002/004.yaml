id: T12P.NAP.2.4
reference: Testament of Naphtali 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ καθὼς²⁵ οἶδεν²⁶ ὁ κεραμεὺς ἑνὸς ἑκάστου τὴν χρῆσιν †ὡς²⁷ ἱκανή²⁸, οὕτω²⁹ καὶ ὁ Κύριος οἶδε τὸ σῶμα, ἕως τίνος διαρκέσει ἐν *τῷ ἀγαθῷ³⁰, καὶ πότε ἔρχεται³¹ *ἐν κακῷ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/004.yaml
  text: And just as the potter knows the use of each one, as it is fit, so also the Lord knows the body, how long it will endure in good, and when it comes into evil.
translation:
  language: ko
  text: 그리고 토기장이가 각각의 쓰임을 그에 알맞게 아는 것처럼, 주님도 몸이 선한 가운데 얼마나 오래 견딜지, 또 언제 악한 가운데 이르게 될지를 아십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κεραμεύς
  english_pob_choice: the potter
  chosen_korean: 토기장이
  alternatives_korean:
  - 옹기장이
  - 도공
  lexicon: κεραμεύς
  rationale: 비유의 주체로서 성서적·관용적 표현인 ‘토기장이’를 사용해 원문 이미지를 직접 살렸습니다.
- source_word: τὴν χρῆσιν
  english_pob_choice: the use
  chosen_korean: 쓰임
  alternatives_korean:
  - 용도
  - 사용
  lexicon: χρῆσις
  rationale: 사물의 기능적 ‘사용처’보다 각 존재의 정해진 역할과 쓰임새를 가리키는 문맥이어서 ‘쓰임’이 가장 자연스럽습니다.
- source_word: ἑνὸς ἑκάστου
  english_pob_choice: each one
  chosen_korean: 각 사람
  alternatives_korean:
  - 각각
  - 각 한 사람
  lexicon: ἕκαστος
  rationale: 앞의 비유적 대상이 사람에게 적용되는 문맥이므로 한국어에서는 자연스럽게 ‘각 사람’으로 풀어 주었습니다.
- source_word: τὸ σῶμα
  english_pob_choice: the body
  chosen_korean: 몸
  alternatives_korean:
  - 육체
  - 몸뚱이
  lexicon: σῶμα
  rationale: 한국어에서 중립적이고 직설적인 대응인 ‘몸’을 택해, 원문이 말하는 인간의 육신을 그대로 전달했습니다.
theological_decisions:
- issue: ἐν τῷ ἀγαθῷ / ἐν κακῷ의 해석
  chosen_reading: ‘선한 가운데’와 ‘악한 가운데’로 옮겨 상태·영역의 대비를 드러냈습니다.
  alternative_readings:
  - ‘좋은 상태에서’ / ‘나쁜 상태에서’
  - ‘선 안에서’ / ‘악 안에서’
  rationale: 전치사 ἐν은 여기서 단순한 장소보다 존재의 상태나 영역을 나타내므로, 도덕적 대비를 살리되 한국어가 부자연스럽지 않게 처리했습니다.
  doctrine_reference: 인간의 삶과 몸의 운명에 대한 섭리적 인식
