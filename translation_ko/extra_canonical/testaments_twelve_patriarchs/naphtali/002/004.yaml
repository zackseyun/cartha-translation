- from: 그리고 토기장이가 각 사람의 쓰임을, 그것이 마땅한 만큼 아는 것처럼, 주님도 몸이 선한 가운데 얼마나 오래 지속될지, 또 언제 악한 가운데로 들어갈지를 아십니다.
  to: 그리고 토기장이가 각각의 쓰임을 그에 알맞게 아는 것처럼, 주님도 몸이 선한 가운데 얼마나 오래 견딜지, 또 언제 악한 가운데 이르게 될지를 아십니다.
  rationale: 원문에 없는 ‘사람’이라는 대상을 제거하여 비유의 지시 대상을 열어 두었고, ἐν κακῷ를 방향격 없이 옮겼습니다. ‘그에 알맞게’는 본문에 난점 표지(†)가 있는 ὡς ἱκανή를 영어 감사본의 ‘as it is fit’에 따라 제한적으로 반영한 것입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:04Z'
review_pass:
  verdict: revise
  source_fidelity: ‘각 사람’은 원문의 ἑνὸς ἑκάστου(‘각각의 것/각자의 것’)에 없는 ‘사람’을 특정하여 비유의 대상을 좁힙니다. 또한 ‘악한 가운데로 들어갈지’의 ‘-로’는 ἐν κακῷ의 상태·영역 표현에 방향성을 더합니다.
  naturalness: 수정문은 비유의 대상이 명시되지 않은 원문의 여지를 보존하면서도 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘견딜지’는 σώμα와 διαρκέσει의 관계를 간결하게 드러냅니다.
  terminology: ‘토기장이’, ‘쓰임’, ‘주님’, ‘몸’, ‘선한 가운데’, ‘악한 가운데’는 적절합니다. ‘각각의 쓰임’은 불필요하게 인간으로 한정하지 않는 표현입니다.
  issues:
  - severity: medium
    issue: ‘각 사람’이 원문의 비한정적 표현을 인간으로 특정함
    rationale: ἑνὸς ἑκάστου에는 ‘사람’이라는 명사가 없으며, 토기장이 비유 안에서는 그 대상이 그릇일 수도 있고 일반적 ‘각각의 것’일 수도 있습니다. 번역도 그 모호성을 유지해야 합니다.
  - severity: low
    issue: ‘악한 가운데로’가 방향성을 첨가함
    rationale: ἐν κακῷ는 ‘악한 가운데/악 속에서’라는 상태 또는 영역의 표현이며, ‘로’는 원문에 없는 이동 방향을 부가합니다.
  revised_text: 그리고 토기장이가 각각의 쓰임을 그에 알맞게 아는 것처럼, 주님도 몸이 선한 가운데 얼마나 오래 견딜지, 또 언제 악한 가운데 이르게 될지를 아십니다.
