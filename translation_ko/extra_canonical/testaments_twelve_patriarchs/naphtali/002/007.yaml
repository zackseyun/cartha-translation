- from: 그리고 빛과 어둠 사이에, 또 보는 것과 듣는 것 사이에 구분이 있는 것처럼, 남자와 남자 사이에도, 여자와 여자 사이에도 구분이 있습니다. 그리고 겉모습만으로는 한 사람이 다른 사람보다 못하다고 말할 수 없습니다.[a][b]
  to: 또 빛과 어둠 사이에, 시각과 청각 사이에 구분이 있는 것처럼, 남자와 남자 사이에도, 여자와 여자 사이에도 구분이 있습니다. 그리고 겉모습으로는 한 사람이 다른 사람보다 못하다고 말할 수 없습니다.[a]
