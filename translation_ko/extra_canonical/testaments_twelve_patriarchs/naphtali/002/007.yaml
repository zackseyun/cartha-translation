id: T12P.NAP.2.7
reference: Testament of Naphtali 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
translation:
  language: ko
  text: 그리고 빛과 어둠 사이에, 또 보는 것과 듣는 것 사이에 구분이 있는 것처럼, 남자와 남자 사이에도, 여자와 여자 사이에도 구분이 있습니다. 그리고 겉모습만으로는 한 사람이 다른 사람보다 못하다고 말할 수 없습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάμεσον τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους / δράσεώς τε καὶ ἀκοῆς
  english_pob_choice: between light and darkness, and between sight and hearing
  chosen_korean: 빛과 어둠 사이에, 또 보는 것과 듣는 것 사이에
  alternatives_korean:
  - 빛과 어둠 사이에, 또 시각과 청각 사이에
  - 빛과 어둠 사이에, 또 시력과 청력 사이에
  lexicon: 빛 / 어둠 / 보는 것 / 듣는 것
  rationale: 두 번째 대구는 추상명사보다 감각 행위를 드러내는 표현이 원문의 대조를 자연스럽게 살리므로, POB의 'sight and hearing'에 맞춰 '보는 것과 듣는 것'으로 옮겼습니다.
- source_word: κεχώρισται ... οὕτως κεχώρισται
  english_pob_choice: there is a division ... so there is also a division
  chosen_korean: 구분이 있는 것처럼 ... 구분이 있습니다
  alternatives_korean:
  - 나뉘어 있는 것처럼 ... 나뉘어 있습니다
  - 분리되어 있는 것처럼 ... 분리되어 있습니다
  lexicon: 구분이 있다
  rationale: 원문의 상태적 분리를 한국어에서 지나치게 강한 단절로 만들지 않도록, '구분'으로 옮겨 대구 구조를 살렸습니다.
- source_word: ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν
  english_pob_choice: in appearance one is inferior to another
  chosen_korean: 겉모습만으로는 한 사람이 다른 사람보다 못하다고
  alternatives_korean:
  - 겉으로 보기에는 한 사람이 다른 사람보다 열등하다고
  - 외모만으로는 한 사람이 다른 사람보다 뒤떨어졌다고
  lexicon: 겉모습 / 못하다고
  rationale: 최종 난해구는 POB의 수정판을 따라 'appearance'의 의미를 살리되, 'inferior'를 한국어의 직접 비교 표현인 '못하다'로 옮겨 서술의 단정성을 보존했습니다.
- source_word: ἀνδρὸς καὶ ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ γυναικός
  english_pob_choice: between man and man, and between woman and woman
  chosen_korean: 남자와 남자 사이에도, 여자와 여자 사이에도
  alternatives_korean:
  - 남자와 남자 사이에도, 여자와 여자 사이에도
  - 사람과 사람 사이에도, 여자와 여자 사이에도
  lexicon: 남자 / 여자
  rationale: 원문의 반복 대구를 그대로 반영해 남자-남자, 여자-여자 사이의 구분을 드러냈습니다.
theological_decisions:
- issue: 마지막 절의 난해한 'προσώποις'와 'ἡττόμενον'의 의미 범위
  chosen_reading: 겉모습을 기준으로 우열을 말할 수 없다는 진술로 옮겼습니다.
  alternative_readings:
  - 외모가 같다고 말할 수 없다는 뜻
  - 모든 면에서 차이가 없다는 뜻
  rationale: POB의 최신 수정이 'appearance'와 'inferior'를 더 직접적으로 반영하므로, 과도한 해석을 덧붙이지 않고 외형적 판단의 한계를 말하는 방향을 택했습니다.
  doctrine_reference: 문학적·윤리적 대구 해석; 외모 판단의 한계
