id: T12P.NAP.2.8
reference: Testament of Naphtali 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. *Πάντα ⌜γὰρ⌝⁶⁰ ἐν τάξει ἐποίησεν ὁ Θεὸς καλά· τὰς πέντε αἰσθήσεις ἐν τῇ κεφαλῇ *καὶ τὸν τράχηλον συνάψας τῇ κεφαλῇ⁶¹, *προσθεὶς αὐτῇ καὶ τρίχας εἰς εὐπρέπειαν καὶ δόξαν⁶², εἶτα⁶³ καρδίαν *εἰς φρόνησιν⁶⁴, κοιλίαν εἰς †διάκρισιν⁶⁵, *στόμαχον εἰς †ἀλεσμόν⁶⁶, †κάλαμον⁶⁷ πρὸς †ὑγείαν⁶⁸, ἧπαρ⁶⁹ πρὸς θυμόν, χολὴν πρὸς πικρίαν, ⌜καὶ⌝⁷⁰ *σπλῆνα πρὸς γέλωτα⁷¹, νεφροὺς ⌜εἰς πανουργίαν⁷², ψύας⁷³⌝ εἰς δύναμιν, *†πλευρὰν εἰς τὸ καθεύδειν†⁷⁴, ὀσφὺν⁷⁵ εἰς ἰσχύν, καὶ τὰ ἑξῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/008.yaml
  text: 'For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.'
translation:
  language: ko
  text: 왜냐하면 하나님께서 모든 것을 그 질서에 따라 좋게 만드셨습니다. 곧 머리에는 다섯 감각을 두시고, 목을 머리에 연결하시고, 아름다움과 영광을 위해 머리카락을 더하시고, 다음으로 마음을 분별을 위해, 배를 배설을 위해, 위를 갈기 위해, 기도를 공기를 들이마시기 위해, 간을 분노를 위해, 쓸개를 쓰라림을 위해, 비장을 웃음을 위해, 콩팥을 간교함을 위해, 허리를 능력을 위해, 폐를 들이마심을 위해 두셨으며, 그 밖의 나머지도 그러합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα ... ἐν τάξει ἐποίησεν ὁ Θεὸς καλά
  english_pob_choice: For God made all things good in their order
  chosen_korean: “하나님께서 모든 것을 그 질서에 따라 좋게 만드셨습니다”
  alternatives_korean:
  - “하나님께서 모든 것을 질서 있게 좋게 만드셨습니다”
  - “하나님께서 모든 것을 그 순서대로 선하게 만드셨습니다”
  lexicon: τάξις; καλά
  rationale: POB의 “in their order”를 자연스럽게 풀어, ‘질서’와 ‘좋게’를 함께 살려 창조의 선함과 배열의 의미를 모두 반영했습니다.
- source_word: καρδίαν εἰς φρόνησιν
  english_pob_choice: the heart for understanding
  chosen_korean: “마음을 분별을 위해”
  alternatives_korean:
  - “마음을 이해를 위해”
  - “마음을 깨달음을 위해”
  lexicon: καρδία; φρόνησις
  rationale: φρόνησις는 단순한 지적 이해보다 분별·신중함의 뉘앙스가 있어, 한국어에서 기능을 직접 드러내는 “분별”을 택했습니다.
- source_word: κοιλίαν εἰς διάκρισιν; στόμαχον εἰς ἀλεσμόν; κάλαμον πρὸς ὑγείαν
  english_pob_choice: the belly for excrement, the stomach for grinding, the windpipe for taking in air
  chosen_korean: “배를 배설을 위해, 위를 갈기 위해, 기도를 공기를 들이마시기 위해”
  alternatives_korean:
  - “배를 배설을 위해, 위를 분쇄를 위해, 기도를 호흡을 위해”
  - “배를 소화물 배출을 위해, 위를 씹기 위해, 기도를 들숨을 위해”
  lexicon: κοιλία; στόμαχος; κάλαμος; ἀλέμω
  rationale: POB가 생리적 기능을 직설적으로 옮긴 흐름을 따랐습니다. 특히 κάλαμον은 문맥상 ‘windpipe’로 이해되므로 ‘기도’로 옮기고, ἀλεσμόν은 ‘갈기’로 단순·직역해 기능성을 보존했습니다.
- source_word: σπλῆνα πρὸς γέλωτα, νεφρούς ... εἰς δύναμιν, πλευρὰν εἰς τὸ καθεύδειν, ὀσφὺν εἰς ἰσχύν
  english_pob_choice: the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in
  chosen_korean: “비장을 웃음을 위해, 콩팥을 간교함을 위해, 허리를 능력을 위해, 폐를 들이마심을 위해”
  alternatives_korean:
  - “비장을 웃음을 위해, 신장을 교활함을 위해, 허리를 힘을 위해, 폐를 호흡을 위해”
  - “비장을 웃음의 기관으로, 콩팥을 꾀를 위해, 허리를 강함을 위해, 폐를 들숨을 위해”
  lexicon: σπλήν; νεφρός; ὀσφύς; πνεύμων
  rationale: POB의 장기별 기능 대응을 유지하면서, νεφρούς/ψύας 구절의 의미를 따라 ‘간교함’과 ‘능력’으로 옮겼습니다. ὀσφύς는 전통적 ‘허리’가 자연스럽고, πνεύμονες의 기능은 ‘들이마심’으로 표현했습니다.
theological_decisions:
- issue: 창조의 질서와 신체 기관의 기능을 도덕적·상징적으로 연결하는 진술의 톤
  chosen_reading: 본문의 기능적 배열을 그대로 살려, 창조주 하나님이 각 기관을 특정 목적에 맞게 두셨다는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 해부학적 설명으로만 읽는 것
  - 알레고리적 교훈으로 과도하게 확장하는 것
  rationale: 이 구절은 자연 질서와 창조 목적을 동시에 말하므로, 해부학적 목록을 유지하되 저자의 신학적 의도인 창조 질서의 선함을 훼손하지 않도록 했습니다.
  doctrine_reference: 창조론 / 섭리
- issue: 기독교 정경 밖의 고대 유언 문헌 번역에서의 용어 절제
  chosen_reading: 정통 교회 용어를 억지로 덧씌우지 않고, 본문이 말하는 신체 기능과 질서에 집중했습니다.
  alternative_readings:
  - 현대 의학용어로 완전 치환하는 것
  - 상징적 영성 언어로 바꾸는 것
  rationale: 원문과 POB의 audit trail 모두 기능 대응을 중시하므로, 현대 표준어로 읽히되 원문의 거친 열거 구조를 유지했습니다.
  doctrine_reference: 본문 충실성 / 문헌 비평
