revisions:
- from: 주께서 아시는 바와 같이, 창조된 것 가운데 그분이 알지 못하시는 것은 없으며, 모든 생각도 그렇습니다. 그분은 만물을 지으셨고, 사람을 자기 형상대로 지으셨습니다.[a]
  to: 주께서 알지 못하시는 창조물이나 생각은 하나도 없습니다. 이는 주께서 만물을 지으시고 사람을 자신의 형상대로 지으셨기 때문입니다.
  rationale: 원문 첫 문장의 ‘없다’라는 부정 진술을 한국어에서 직접적으로 재구성하고, 원문에 없는 ‘아시는 바와 같이’를 삭제했습니다. 영어 POB의 감사 이력에 따른 후반의 두 창조 진술도 보존했습니다. 대응 각주가 없는 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:04Z'
