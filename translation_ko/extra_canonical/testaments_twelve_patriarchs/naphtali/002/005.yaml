id: T12P.NAP.2.5
reference: Testament of Naphtali 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. Ὅτι οὐκ ἔστι πλάσμα³³ καὶ πᾶσα ἔννοια ἣν Γοὐκ¹ ἔγνω Κύριος· *πάντα γὰρ³⁴ *ὁ ἄνθρωπον³⁵ ἔκτισεν κατʼ εἰκόνα ἑαυτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/005.yaml
  text: For there is no creation and no thought that the Lord does not know; for he created all things, and he created man in his own image.
translation:
  language: ko
  text: 주께서 알지 못하시는 창조물이나 생각은 하나도 없습니다. 이는 주께서 만물을 지으시고 사람을 자신의 형상대로 지으셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλάσμα
  english_pob_choice: creation
  chosen_korean: 창조된 것
  alternatives_korean:
  - 피조물
  - 창조물
  lexicon: πλάσμα
  rationale: 단순히 ‘만들어진 것’보다 창조 행위를 전제하는 ‘창조된 것’이 POB의 ‘creation’을 자연스럽게 반영합니다.
- source_word: πᾶσα ἔννοια
  english_pob_choice: and no thought
  chosen_korean: 모든 생각
  alternatives_korean:
  - 모든 생각
  - 모든 뜻
  - 모든 의도
  lexicon: ἔννοια
  rationale: ἔννοια는 마음속 생각·의도 범위를 가지므로, 문맥상 ‘생각’으로 옮기되 ‘모든’으로 포괄성을 살렸습니다.
- source_word: πάντα
  english_pob_choice: all things
  chosen_korean: 만물
  alternatives_korean:
  - 모든 것
  - 모든 만물
  lexicon: πάντα
  rationale: POB의 ‘all things’를 한국어로 자연스럽게 압축한 표현이며, 앞의 ‘창조된 것’과도 어울립니다.
- source_word: ὁ ἄνθρωπον ... κατʼ εἰκόνα ἑαυτοῦ
  english_pob_choice: he created man in his own image
  chosen_korean: 사람을 자기 형상대로
  alternatives_korean:
  - 인간을 자기 형상대로
  - 사람을 자신의 형상으로
  lexicon: ἄνθρωπος / εἰκών
  rationale: 원문은 단수 ‘사람’을 가리키며, ‘자기 형상대로’는 εἰκόνα ἑαυτοῦ의 직접적인 구조를 보존합니다.
theological_decisions:
- issue: 하나님의 인식 범위와 창조 범위의 병렬
  chosen_reading: 하나님은 창조된 것과 모든 생각을 아시며, 더 나아가 만물을 지으신 분으로 제시됩니다.
  alternative_readings:
  - ‘창조의 목적’을 아신다는 식의 해석
  - 지식을 약화시켜 일반적 통찰로 읽는 해석
  rationale: POB 개정안이 ‘purpose of his creation’보다 πλάσμα와 ἔννοια를 직접 반영하는 방향으로 바꾼 점을 따르며, 지식과 창조를 병렬로 유지했습니다.
  doctrine_reference: 하나님의 전지와 창조주 주권
