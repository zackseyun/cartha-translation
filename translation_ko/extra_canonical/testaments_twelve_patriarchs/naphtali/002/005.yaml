  source_fidelity: 첫 절의 부정 관계는 ‘주께서 알지 못하시는 창조물이나 생각은 없다’로 명확히 옮겨야 합니다. 초안의 ‘주께서 아시는 바와 같이’는 원문에 없는 비교·인과적 도입을 추가합니다. 후반은 제공된 원문 및 영어 POB의 해석을 따라, 만물의 창조와 사람을 자기 형상대로 지으심을 병렬로 유지했습니다.
  naturalness: ‘창조된 것 가운데 그분이 알지 못하시는 것은 없으며, 모든 생각도 그렇습니다’는 수식 범위가 어색하고 반복적입니다. ‘창조물이나 생각은 하나도 없습니다’가 현대 표준 한국어 합쇼체에서 자연스럽고 의미도 분명합니다. 호칭은 ‘주’로 일관되게 했습니다.
  terminology: πλάσμα는 여기서 ‘창조물’로, πᾶσα ἔννοια는 ‘생각’으로, πάντα는 ‘만물’로 옮겼습니다. εἰκών ἑαυτοῦ는 전통적이면서도 자연스러운 ‘자신의 형상대로’로 번역했습니다.
