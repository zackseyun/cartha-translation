  source_fidelity: 원문의 ‘머리카락의 삼분의 일’이라는 구체적 최소 단위가 초안에서 ‘한 올의 머리카락만큼’으로 바뀌어 축소되었습니다. 또한 μέτρῳ는 ‘길이’에 한정되지 않고 측량/척도를 포괄하므로 더 넓게 옮기는 것이 적절합니다.
