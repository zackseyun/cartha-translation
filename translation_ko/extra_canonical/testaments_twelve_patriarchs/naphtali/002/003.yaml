  terminology: σταθμῷ, μέτρῳ, κανόνι의 삼중 병렬을 ‘무게와 측량과 기준’으로 유지했습니다. κτίσις는 영어 POB의 ‘every creation’ 및 원문의 표현을 따라 ‘모든 창조물’로 옮기며, 본문에 없는 신적 행위자를 덧붙이지 않았습니다.
