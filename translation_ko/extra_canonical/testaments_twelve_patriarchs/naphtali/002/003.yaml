id: T12P.NAP.2.3
reference: Testament of Naphtali 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Καὶ¹⁸ οὐκ *ἔστιν ἐνλεῖπον¹⁹ *ἐκ τοῦ ἑνὸς²⁰ *τρίτου τριχός²¹· *σταθμῷ γὰρ καὶ μέτρῳ²² καὶ κανόνι πᾶσα Γἡ¹²³ *κτίσις ἐγένετο²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/003.yaml
  text: And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.
translation:
  language: ko
  text: 그리고 그 안에는 한 올의 머리카락만큼도 부족함이 없습니다. 왜냐하면 모든 창조물은 무게와 길이와 규칙으로 만들어졌기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔστιν ἐνλεῖπον ἐκ τοῦ ἑνὸς τρίτου τριχός
  english_pob_choice: there is no deficiency in it, not even by a third of a hair
  chosen_korean: 그 안에는 한 올의 머리카락만큼도 부족함이 없습니다
  alternatives_korean:
  - 결핍이 전혀 없습니다
  - 머리카락의 삼분의 일만큼도 모자라지 않습니다
  lexicon: 부족함
  rationale: 원문의 핵심은 ‘결핍/모자람이 전혀 없음’이며, EN POB의 관용적 표현을 살리되 한국어에서는 자연스러운 ‘한 올의 머리카락만큼도’로 미세함을 전달했습니다.
- source_word: σταθμῷ ... καὶ μέτρῳ καὶ κανόνι
  english_pob_choice: by weight and measure and rule
  chosen_korean: 무게와 길이와 규칙으로
  alternatives_korean:
  - 저울과 도량과 규범으로
  - 무게와 측량과 기준으로
  lexicon: 무게 / 길이 / 규칙
  rationale: σταθμός는 ‘무게’, μέτρον은 단순 수량보다 ‘길이/측량’의 감각을 살릴 수 있어 ‘길이’로, κανών은 ‘규칙’으로 옮겨 삼중 병렬을 한국어로도 보존했습니다.
- source_word: πᾶσα κτίσις ἐγένετο
  english_pob_choice: every creation was made
  chosen_korean: 모든 창조물은 만들어졌기 때문입니다
  alternatives_korean:
  - 모든 피조물은 생겨났기 때문입니다
  - 온갖 창조는 이루어졌기 때문입니다
  lexicon: 창조물 / 만들어졌습니다
  rationale: κτίσις는 결과물로서의 ‘창조물/피조물’을 뜻하므로 ‘창조물’로 옮겼고, ἐγένετο의 수동·완료적 뉘앙스를 한국어의 ‘만들어졌습니다’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 원문이 제시하는 창조의 질서성과 완전성
  chosen_reading: 하나님이 창조하신 세계는 무게, 길이, 규칙의 정밀한 질서 아래 있으며 결핍이 없다는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 자연 관찰의 비유로만 읽는 해석
  - 우주론적 규범에 대한 철학적 진술로만 제한하는 해석
  rationale: 문맥상 창조가 우연이 아니라 정밀한 질서에 따라 이루어졌다는 점을 강조하므로, 이를 약화하지 않고 직설적으로 살렸습니다.
  doctrine_reference: 창조 섭리, 질서 있는 창조
- issue: ‘한 올의 머리카락’ 표현의 정도
  chosen_reading: 영어 본문의 관용을 유지하되 과장 없이 극도의 미세성을 나타내는 한국어 표현으로 옮겼습니다.
  alternative_readings:
  - 직역하여 ‘머리카락의 삼분의 일만큼도’
  - 완화하여 ‘아주 조금도’
  rationale: 원문의 수량 표현은 수학적 정확성보다 결핍의 극소성을 강조하므로, 한국어 독자가 즉시 이해할 수 있는 관용을 선택했습니다.
  doctrine_reference: 문체적 등가, 의미 보존
