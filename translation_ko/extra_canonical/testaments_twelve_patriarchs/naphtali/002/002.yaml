id: T12P.NAP.2.2
reference: Testament of Naphtali 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καθὼς⁹ γὰρ *οἶδεν ὁ κεραμεὺς¹⁰ τὸ σκεῦος πόσον χωρεῖ, καὶ πρὸς αὐτὸ¹¹ φέρει τὸν¹² πηλόν, οὕτω¹³ καὶ ὁ Κύριος πρὸς ὁμοίωσιν τοῦ πνεύματος¹⁴ ποιεῖ¹⁵ τὸ σῶμα, καὶ πρὸς τὴν δύναμιν τοῦ σώματος¹⁶ *τὸ πνεῦμα ἐπιτίθησιν¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/002.yaml
  text: For just as the potter knows how much the vessel can hold, and according to that brings the clay for it, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body's capacity places the spirit in it.
translation:
  language: ko
  text: 토기장이가 그릇이 담을 수 있는 양을 알고 그릇에 맞추어 진흙을 가져오듯이, 주님께서도 영의 모습에 따라 몸을 지으시고 몸의 수용력에 따라 그 안에 영을 두십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κεραμεύς / τὸ σκεῦος / τὸν πηλόν
  english_pob_choice: the potter / the vessel / the clay
  chosen_korean: 토기장이 / 그릇 / 진흙
  alternatives_korean:
  - 옹기장이 / 용기 / 흙
  lexicon: κεραμεύς, σκεῦος, πηλός
  rationale: κεραμεύς는 장인의 이미지를 살려 ‘토기장이’로 옮기고, σκεῦος는 기능적 ‘그릇’으로, πηλός는 빚는 재료인 ‘진흙’으로 옮겨 비유의 감각을 유지했습니다.
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 여기서는 창조적 행위의 주체를 가리키는 일반적 신칭으로 읽히므로, 한국어 성경에서 자연스럽고 존칭을 갖춘 ‘주님’을 사용했습니다.
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος / πρὸς τὴν δύναμιν τοῦ σώματος
  english_pob_choice: according to the likeness of the spirit / according to the body's capacity
  chosen_korean: 영의 모양에 따라 / 몸의 능력에 따라
  alternatives_korean:
  - 영의 형상에 따라 / 몸의 힘에 따라
  lexicon: ὁμοίωσις, δύναμις
  rationale: ὁμοίωσις는 단순한 외형보다 ‘닮은 모양’의 대응을, δύναμις는 여기서 물리적 ‘능력/수용력’을 가리키므로 ‘능력’으로 옮겨 문맥의 대응 관계를 살렸습니다.
- source_word: ποιεῖ / ἐπιτίθησιν
  english_pob_choice: makes / places
  chosen_korean: 지으시고 / 두십니다
  alternatives_korean:
  - 만드시고 / 놓으십니다
  lexicon: ποιέω, ἐπιτίθημι
  rationale: ποιέω는 인간을 빚어 만드는 창조 행위를 나타내므로 ‘지으시고’로, ἐπιτίθημι는 어떤 대상을 안에 ‘두다/놓다’는 뜻이어서 ‘두십니다’로 옮겼습니다.
theological_decisions:
- issue: ‘영’의 의미와 인격적 주체성
  chosen_reading: 여기서는 일반적인 인간 영이라기보다, 몸에 대응해 주님이 부여하시는 생명 원리/영을 가리키는 표현으로 ‘영’을 유지했습니다.
  alternative_readings:
  - 성령
  - 혼
  rationale: 본문의 대조는 몸과 영의 대응이며, 문맥상 성령의 직접 명칭은 아니므로 ‘성령’으로 바꾸지 않고 원문의 범위를 보존했습니다.
  doctrine_reference: 창 2:7의 생기, 고전적 인간 구성 이해와의 비교
