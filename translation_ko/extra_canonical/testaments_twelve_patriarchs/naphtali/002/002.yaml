revisions:
- from: 그릇이 담을 수 있는 양을 토기장이가 알듯이, 그에 맞게 진흙을 가져오듯, 주님께서도 영의 모양에 따라 몸을 지으시고, 몸의 능력에 따라 그 안에 영을 두십니다.
  to: 토기장이가 그릇이 담을 수 있는 양을 알고 그릇에 맞추어 진흙을 가져오듯이, 주님께서도 영의 모습에 따라 몸을 지으시고 몸의 수용력에 따라 그 안에 영을 두십니다.
  rationale: The revision clarifies the vessel as the antecedent of πρὸς αὐτό, renders the contextual sense of δύναμις as capacity, and improves Korean syntax. It retains the source’s deliberately broad ‘spirit’ terminology and does not add theological specification.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the potter-and-vessel comparison, the Lord as subject, and the corresponding body/spirit sequence. However, πρὸς αὐτό is more explicitly tied to the vessel than the Korean ‘그에 맞게’ makes clear, and δύναμις in this comparison is better rendered as ‘수용력’ than the potentially strength-oriented ‘능력.’
  naturalness: The repeated comparative construction ‘알듯이, ... 가져오듯’ is awkward in modern formal Korean. Joining the potter’s knowing and bringing actions before the main comparison produces a smoother and clearer sentence.
  terminology: ‘토기장이,’ ‘그릇,’ ‘진흙,’ ‘주님,’ ‘몸,’ and ‘영’ are appropriate. ‘영의 모습’ is more natural Korean than ‘영의 모양’ while retaining the nontechnical breadth of ὁμοίωσις. ‘몸의 수용력’ conveys the contextual force of δύναμις without importing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘그에 맞게’ has an unclear antecedent.
    rationale: The Greek αὐτό refers to the vessel; ‘그릇에 맞추어’ makes the comparison’s referent explicit.
  - severity: medium
    issue: ‘몸의 능력’ can suggest physical strength rather than capacity.
    rationale: Within the vessel analogy and in line with the English audit trail, δύναμις is best represented here by ‘수용력.’
  - severity: low
    issue: The paired wording ‘알듯이, ... 가져오듯’ is stylistically awkward.
    rationale: A coordinated clause before ‘듯이’ expresses the Greek sequence naturally in formal Korean.
  revised_text: 토기장이가 그릇이 담을 수 있는 양을 알고 그릇에 맞추어 진흙을 가져오듯이, 주님께서도 영의 모습에 따라 몸을 지으시고 몸의 수용력에 따라 그 안에 영을 두십니다.
  revised_footnotes: []
  revision_rationale: The revision clarifies the vessel as the antecedent of πρὸς αὐτό, renders the contextual sense of δύναμις as capacity, and improves Korean syntax. It retains the source’s deliberately broad ‘spirit’ terminology and does not add theological specification.
