id: T12P.NAP.2.10
reference: Testament of Naphtali 2:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. *Ὅτι ἐὰν εἴπῃς τῷ ὀφθαλμῷ, Ἄκουε, οὐ δυνήσεται⁸²· οὕτως οὐδὲ *ἐν σκότει⁸³ *ὄντες δύνασθε ποιεῖν⁸⁴ ἔργα⁸⁵ φωτός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/010.yaml
  text: For if you say to the eye, “Hear,” it cannot; so neither, being in darkness, can you do the works of light.
translation:
  language: ko
  text: 만일 눈에게 “들으라”고 말해도 눈은 들을 수 없습니다. 그러므로 여러분도 어둠 속에 있으면서는 빛의 일들을 할 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμῷ
  english_pob_choice: the eye
  chosen_korean: 눈
  alternatives_korean:
  - 눈에게
  - 안구에게
  lexicon: ὀφθαλμός
  rationale: 그리스어 단수 목적어를 자연스럽게 살리되, 한국어에서는 대상화된 신체 기관을 ‘눈’으로 옮기는 것이 가장 직접적입니다.
- source_word: Ἄκουε
  english_pob_choice: Hear
  chosen_korean: 들으라
  alternatives_korean:
  - 들으시오
  - 들어라
  lexicon: ἀκούω
  rationale: 명령형의 직접성을 살리면서도 현대 한국어의 문어체에 맞게 짧고 분명하게 옮겼습니다.
- source_word: ἐν σκότει
  english_pob_choice: in darkness
  chosen_korean: 어둠 속에
  alternatives_korean:
  - 어둠 가운데
  - 어둠 안에
  lexicon: σκότος
  rationale: 상태를 나타내는 전치사구로서 ‘어둠 속에’가 원문의 정황적 의미를 가장 자연스럽게 전달합니다.
- source_word: ἔργα φωτός
  english_pob_choice: the works of light
  chosen_korean: 빛의 일들
  alternatives_korean:
  - 빛의 행위들
  - 빛의 일
  lexicon: ἔργον
  rationale: 복수 ‘ἔργα’를 살려 ‘일들’로 옮기되, ‘빛의’라는 속격 관계를 유지해 대조 구조를 드러냈습니다.
theological_decisions:
- issue: 원문의 수사적 불가능성 표현
  chosen_reading: 눈에게 말을 해도 눈은 들을 수 없다는 예를 통해, 어둠에 있는 자의 영적 무능을 강조하는 표현으로 옮겼습니다.
  alternative_readings:
  - 단순한 지각의 부조리로만 읽는 번역
  - 도덕적 권고를 약화시키는 완곡한 표현
  rationale: 영적 진리의 인식 불능을 강조하는 비유적 논리를 보존해야 하므로, 과도한 해설이나 완화를 피했습니다.
  doctrine_reference: 인간의 영적 무능과 계시 인식의 한계에 대한 문맥적 강조
