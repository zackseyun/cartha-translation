base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008.yaml
  text: '1[a]. And behold, my children, I have shown you the times, that all these things will happen in Israel.

    2. And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.

    3. Through his scepter God will appear on the earth, dwelling among men[b], to save the race of Israel, and he will gather the righteous from among the nations.

    4. Therefore, if you also do what is good, men and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.

    5. As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.

    6. But the one who does not do what is good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.

    7. For the commandments of the law are twofold, and they are fulfilled with skill.

    8. For there is a time for a man''s coming together with a woman, and a time for restraint for his prayer.

    9. And both are from God, and if they do not take place in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.

    10. Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter[d][c], so that the Lord may love you.'
  footnotes:
  - marker: a
    text: Some witnesses show textual expansion or variation in v. 3 around 'God will appear on the earth, dwelling among men.' The translation follows the fuller Greek wording in the supplied witness.
    reason: textual_variant
  - marker: b
    text: '''Through Judah'' and ''through his scepter'' in vv. 2-3 carry royal and salvation imagery; the passage may be read messianically, but the translation does not force a narrower doctrinal interpretation than the Greek itself states.'
    reason: cross_reference
  - marker: c
    text: The phrase 'coming together with a woman' in v. 8 is a decorous rendering of language referring to sexual union.
    reason: cultural_note
  - marker: d
    text: Or 'abstinence' for 'restraint' in v. 8; the sense is refraining at the proper time for prayer.
    reason: lexical_alternative
translation:
  language: ko
  text: '1. 보십시오, 내 자녀들아, 내가 너희에게 마지막 때들을 보여 주었습니다. 이 모든 일이 이스라엘에서 일어날 것입니다.


    2. 그러므로 너희도 너희 자녀들에게 명령하여 레위와 유다에게 연합하게 하십시오. 유다를 통하여 이스라엘을 위한 구원이 일어날 것이며, 그로 말미암아 야곱이 복을 받을 것이기 때문입니다.


    3. 그의 홀을 통하여 하나님께서 땅 위에 나타나시고, 사람들 가운데 거하시며[a], 이스라엘 족속을 구원하시고 민족들 가운데서 의인들을 모으실 것입니다.[b]


    4. 그러므로 너희도 선한 일을 하면, 사람들과 천사들이 너희를 축복할 것이며, 하나님께서는 너희를 통하여 민족들 가운데서 영광을 받으실 것입니다. 마귀는 너희에게서 달아날 것이고, 들짐승들은 너희를 두려워할 것이며, 주님께서는 너희를 사랑하실 것이고, 천사들은 너희를 붙들어 줄 것입니다.


    5. 누군가가 아이를 잘 기르면 그 아이에 대한 좋은 기억을 갖게 되는 것처럼, 선한 행위에 대해서도 하나님께로부터 좋은 기억이 있습니다.


    6. 그러나 선한 일을 하지 않는 사람은 천사들과 사람들에게 저주를 받을 것이며, 하나님께서는 그를 통하여 민족들 가운데서 영광을 받지 못하실 것입니다. 마귀는 그를 자기 소유의 그릇으로 삼을 것이며, 모든 들짐승이 그를 지배할 것이고, 주님께서는 그를 미워하실 것입니다.


    7. 율법의 명령들은 두 겹이며, 지혜롭게 실천되어야 합니다.


    8. 남자가 여인과 함께할 때가 있고[c], 자신의 기도를 위하여 절제할 때가 있습니다.[d]


    9. 이 둘은 모두 하나님께 속한 것이며, 그것들이 제 질서대로 이루어지지 않으면 사람들에게 매우 큰 죄를 가져옵니다. 다른 명령들도 마찬가지입니다.


    10. 그러므로 내 자녀들아, 하나님 안에서 지혜롭고 분별 있게 되어 그의 명령들의 질서와 모든 일의 규례를 깨달으십시오. 그리하면 주님께서 너희를 사랑하실 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 3절의 ‘하나님께서 땅 위에 나타나시고, 사람들 가운데 거하시며’라는 부분에서 본문 확장 또는 이문을 보입니다. 이 번역은 제시된 그리스어 사본의 더 긴 본문을 따릅니다.
    reason: textual_variant
  - marker: b
    text: 2–3절의 ‘유다를 통하여’와 ‘그의 홀을 통하여’는 왕권과 구원의 이미지를 담고 있습니다. 이 구절은 메시아적으로 읽힐 수 있으나, 번역은 그리스어 본문보다 더 좁은 교리적 해석을 강요하지 않습니다.
    reason: cross_reference
  - marker: c
    text: 8절의 ‘여인과 함께하다’는 성적 결합을 가리키는 표현을 절제하여 옮긴 것입니다.
    reason: cultural_note
  - marker: d
    text: ‘절제’는 ‘금욕’ 또는 ‘삼감’으로도 옮길 수 있습니다. 여기서는 기도를 위하여 알맞은 때에 성적 결합을 삼가는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιροὺς ἐσχάτους
  english_pob_choice: the times
  chosen_korean: 이 마지막 때
  alternatives_korean:
  - 그때들
  - 정해진 때들
  - 종말의 때
  lexicon: LSJ
  rationale: καιροὺς ἐσχάτους는 단순한 시간표현보다 종말론적 성격이 강하므로, 한국어에서는 자연스럽게 ‘이 마지막 때’로 옮겨 예언적 뉘앙스를 살렸습니다.
- source_word: ἑνοῦνται
  english_pob_choice: be united
  chosen_korean: 하나가 되게 하십시오
  alternatives_korean:
  - 연합하게 하십시오
  - 결합하게 하십시오
  - 연결되게 하십시오
  lexicon: LSJ
  rationale: 레위와 유다에 대한 충성/연대를 함께 담아야 하므로, 단순한 조직적 결합보다 공동체적 일치를 드러내는 ‘하나가 되게’로 옮겼습니다.
- source_word: σκήπτρου
  english_pob_choice: scepter
  chosen_korean: 홀
  alternatives_korean:
  - 규
  - 왕권
  - 지팡이
  lexicon: LSJ
  rationale: 왕적 표상을 살리면서도 한국어에서 고전적·상징적 이미지를 유지하기 위해 ‘홀’을 택했습니다.
- source_word: κατοικῶν ἐν ἀνθρώποις
  english_pob_choice: dwelling among men
  chosen_korean: 사람들 가운데 거하실 것이며
  alternatives_korean:
  - 사람들 가운데 사시며
  - 사람들 안에 거하실 것이며
  lexicon: LSJ
  rationale: 문맥상 하나님이 인간 사회 가운데 임재하신다는 뜻을 드러내기 위해 ‘가운데 거하실’로 옮겼고, 내주로 오해될 수 있는 표현은 피했습니다.
- source_word: οἰκειοῦται αὐτὸν ὡς ἴδιον σκεῦος
  english_pob_choice: claims him as his own vessel
  chosen_korean: 그를 자기의 그릇으로 주장할 것이며
  alternatives_korean:
  - 자기 소유의 그릇으로 삼을 것이며
  - 자기 그릇으로 차지할 것이며
  lexicon: LSJ
  rationale: οἰκειοῦται의 소유·귀속 뉘앙스와 σκεῦος의 ‘그릇’ 이미지를 함께 살리되, 한국어에서는 인격의 전유를 드러내는 ‘주장하다’로 번역했습니다.
- source_word: ἐγκρατείας
  english_pob_choice: self-control / restraint
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 금욕
  - 억제
  lexicon: LSJ
  rationale: 기도를 위한 성적 절제를 가리키는 문맥이므로, 덕목으로서도 자연스럽고 문맥상도 정확한 ‘절제’를 택했습니다.
- source_word: τάξει
  english_pob_choice: proper order
  chosen_korean: 바른 질서
  alternatives_korean:
  - 정해진 순서
  - 적절한 질서
  - 올바른 차례
  lexicon: LSJ
  rationale: 단순한 순서가 아니라 하나님께 맞는 배열과 때를 가리키므로, 윤리적·질서적 함의를 살려 ‘바른 질서’로 옮겼습니다.
theological_decisions:
- issue: 유다와 그 홀을 통한 구원 및 하나님의 현현
  chosen_reading: 본문의 왕적-구원적 진술을 약화하지 않고, 유다를 통해 구원이 일어나고 그의 홀을 통해 하나님이 땅에 나타나신다는 흐름을 그대로 옮겼습니다.
  alternative_readings:
  - 이를 단순한 다윗 왕조 기대로만 축소하기
  - 후대적 메시아 해석을 본문에 명시적으로 주입하기
  rationale: 원문은 유다, 홀, 구원, 열방 가운데 의인의 수집을 하나의 강한 구원-예언으로 묶고 있으므로, 번역은 그 긴장을 보존해야 합니다.
  doctrine_reference: 본문 존중 원칙; 예언적 표현을 본문 수준에서 투명하게 번역
- issue: 남녀의 결합과 기도를 위한 절제
  chosen_reading: 8–9절을 결혼적 결합과 기도를 위한 절제라는 구체적 윤리 지침으로 옮겼습니다.
  alternative_readings:
  - 일반적인 절제 교훈으로 완화하기
  - 의례적 정결 규정으로만 한정하기
  rationale: 그리스어는 ‘여인과 함께함’과 ‘기도를 위한 절제’를 병치하므로, 두 행위의 적절한 때를 구체적으로 드러내는 번역이 필요합니다.
  doctrine_reference: 문맥상 구체적 성윤리와 기도 실천의 병치
- issue: 마귀와 들짐승의 묘사
  chosen_reading: 비인격적 상징으로 약화하지 않고, 본문이 말하는 대적과 피조세계의 위협을 그대로 표현했습니다.
  alternative_readings:
  - 풍자적 표현으로 처리하기
  - 단순한 나쁜 환경의 비유로 바꾸기
  rationale: 본문은 선악에 따른 영적·피조적 반응을 인격적으로 서술하므로, 번역도 그 상징적 실재감을 유지해야 합니다.
  doctrine_reference: 본문의 영적 전제 보존
