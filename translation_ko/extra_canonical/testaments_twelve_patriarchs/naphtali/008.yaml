    3. 그의 홀을 통해 하나님이 땅에 나타나셔서 사람들 가운데 거하실 것이며, 이스라엘 족속을 구하시고, 민족들 가운데서 의인들을 모으실 것입니다.


    4. 그러므로 너희도 선한 일을 하면 사람들과 천사들이 너희를 축복할 것이고, 하나님은 너희를 통해 민족들 가운데서 영광을 받으실 것이며, 마귀는 너희에게서 달아날 것이고, 들짐승들은 너희를 두려워할 것이며, 주님은 너희를 사랑하실 것이고, 천사들은 너희를 도울 것입니다.


    5. 마치 누군가가 아이를 잘 길러 주면 그에 대한 좋은 기억을 남기듯이, 선한 일에도 하나님 앞에 좋은 기억이 있습니다.


    6. 그러나 선한 일을 하지 않는 자는 천사들과 사람들의 저주를 받을 것이며, 하나님은 그를 통해 민족들 가운데서 영광을 받지 못하실 것이고, 마귀는 그를 자기의 그릇으로 주장할 것이며, 모든 들짐승이 그를 지배할 것이고, 주님은 그를 미워하실 것입니다.


    7. 율법의 명령들은 두 가지이며, 그것들은 지혜롭게 이루어집니다.


