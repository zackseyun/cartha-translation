review_pass:
  verdict: revise
  source_fidelity: 그리스어는 ‘그들에게 많은 그러한 것들을 지시한 뒤’(καὶ πολλὰ τοιαῦτα ἐντειλάμενος αὐτοῖς), ‘그의 뼈를 헤브론으로 옮겨’(μετακομίσωσι τὰ ὀστᾶ αὐτοῦ ἐν Χεβρών), ‘그의 조상들과 함께 그를 묻도록’(θάψωσι αὐτὸν μετὰ τῶν πατέρων αὐτοῦ) 간청했다는 뜻입니다. 초안의 ‘자기를 장사하라고’는 한국어 간접 인용 안에서 요청 대상인 나프달리 자신을 가리키기는 하나, 주절 주어와 결부되어 재귀적으로 읽히거나 문장이 부자연스러울 수 있습니다. ‘그를 장사해 달라고’로 명료하게 고칩니다.
  naturalness: ‘그리고 이런 많은 것들을’은 현대 한국어에서 다소 어색하므로 ‘그리고 이와 같은 많은 일을’로 다듬습니다. ‘간곡히 부탁했습니다’는 παρακαλέω의 요청·권면의 힘을 자연스럽고 과장 없이 전달하며, 합쇼체 서술에도 맞습니다.
  terminology: ‘뼈’, ‘헤브론’, ‘조상들과 함께’, ‘장사하다’는 원문의 구체성과 장례 맥락을 충실히 유지합니다. ‘조상들’은 πατέρες의 문맥상 의미를 자연스럽게 드러냅니다.
  issues:
  - severity: medium
    issue: ‘자기를 장사하라고’의 지시 대상 및 문장 자연성
    rationale: 원문의 αὐτόν은 나프달리를 가리킵니다. 한국어에서는 ‘그를 장사해 달라고’라고 해야 요청 대상이 분명하고 자연스럽습니다.
  - severity: low
    issue: ‘이런 많은 것들’의 어색한 어순
    rationale: 원문의 πολλὰ τοιαῦτα는 ‘이와 같은 많은 일’을 뜻하며, 수정안이 현대 표준어에서 더 자연스럽습니다.
  revised_text: 그리고 이와 같은 많은 일을 그들에게 명령한 뒤, 그는 자기 뼈를 헤브론으로 옮기고 자기 조상들과 함께 그를 장사해 달라고 간곡히 부탁했습니다.
