id: T12P.NAP.9.1
reference: Testament of Naphtali 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: IX. *Καὶ πολλὰ¹ τοιαῦτα ἐντειλάμενος² αὐτοῖς παρεκάλεσεν ἵνα μετακομίσωσι³ τὰ ὀστᾶ αὐτοῦ⁴ *ἐν Χεβρών, καὶ θάψωσι αὐτὸν⁵ μετὰ τῶν πατέρων αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/001.yaml
  text: And after instructing them in many such things, he urged them to carry his bones to Hebron and bury him with his fathers.
translation:
  language: ko
  text: 그리고 이런 많은 것들을 그들에게 명령한 뒤, 그는 자기 뼈를 헤브론으로 옮기고 자기 조상들과 함께 자기를 장사하라고 간청했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντειλάμενος αὐτοῖς / παρεκάλεσεν
  english_pob_choice: after instructing them ... he urged them
  chosen_korean: 그들에게 명령한 뒤 ... 간청했습니다
  alternatives_korean:
  - 그들에게 지시한 뒤 ... 권했습니다
  - 그들에게 부탁한 뒤 ... 간청했습니다
  lexicon: ἐντέλλομαι, παρακαλέω
  rationale: 앞부분의 ‘명령하다’는 내용을 전달하되, 뒤의 παρεκάλεσεν은 단순한 권유보다 강한 간청의 뉘앙스가 있어 ‘간청했습니다’로 살렸습니다.
- source_word: τὰ ὀστᾶ αὐτοῦ
  english_pob_choice: his bones
  chosen_korean: 자기 뼈
  alternatives_korean:
  - 그의 뼈
  - 자신의 유해
  lexicon: ὀστέα
  rationale: 직역에 가깝게 ‘뼈’로 옮겨 원문의 구체성을 유지했습니다.
- source_word: ἐν Χεβρών
  english_pob_choice: to Hebron
  chosen_korean: 헤브론으로
  alternatives_korean:
  - 헤브론에
  - 헤브론까지
  lexicon: Χεβρών
  rationale: 목적지를 나타내는 방향격을 자연스럽게 한국어 조사 ‘-으로’로 표현했습니다.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: with his fathers
  chosen_korean: 자기 조상들과 함께
  alternatives_korean:
  - 그의 조상들과 함께
  - 열조들과 함께
  lexicon: πατέρες
  rationale: 직역 가능한 ‘조상들’로 옮겨 공동조상/열조의 의미를 현대 한국어에서 분명하게 했습니다.
theological_decisions:
- issue: 장사하다의 공손한 서술과 본문 맥락
  chosen_reading: ‘자기를 장사하라고’로 옮겨 매장 요청의 직접성을 유지했습니다.
  alternative_readings:
  - ‘묻으라고’
  - ‘매장하라고’
  rationale: 본문은 유해를 옮긴 뒤 선조들과 함께 매장해 달라는 요청을 말하므로, 한국어 성서 문체에서 자연스러운 ‘장사하다’를 사용했습니다.
  doctrine_reference: 서사적 장례 요청의 직접 의미 유지
