id: T12P.NAP.9.2
reference: Testament of Naphtali 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ⁷ φαγὼν *καὶ πιὼν⁸ ἐν ἱλαρότητι ψυχῆς⁹ συνεκάλυψε¹⁰ τὸ πρόσωπον αὐτοῦ καὶ ἀπέθανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/002.yaml
  text: And having eaten and drunk with gladness of soul, he covered his face and died.
translation:
  language: ko
  text: 그리고 기쁨으로 먹고 마신 뒤에 얼굴을 가리고 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ φαγὼν καὶ πιὼν
  english_pob_choice: having eaten and drunk
  chosen_korean: 먹고 마신 뒤에
  alternatives_korean:
  - 먹고 마시고
  - 먹은 뒤에 마시고
  - 먹고 마셨습니다
  lexicon: 표준 국어 용례
  rationale: 그리스어 분사구문의 진행·선행 관계를 한국어 자연문으로 옮기되, 영어 POB의 ‘having eaten and drunk’에 맞춰 동작의 완료를 분명히 했습니다.
- source_word: ἐν ἱλαρότητι ψυχῆς
  english_pob_choice: with gladness of soul
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 영혼의 기쁨으로
  - 마음의 기쁨으로
  - 기쁜 마음으로
  lexicon: ἱλαρότης, ψυχή
  rationale: 직역적 ‘영혼’은 한국어에서 다소 낯설고 중복될 수 있어, 원문의 내적 상태를 살리되 자연스러운 ‘기쁨으로’로 간결하게 옮겼습니다.
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  english_pob_choice: he covered his face
  chosen_korean: 얼굴을 가리고
  alternatives_korean:
  - 자기 얼굴을 가리고
  - 그의 얼굴을 덮고
  - 얼굴을 덮었습니다
  lexicon: συγκαλύπτω, πρόσωπον
  rationale: ‘가리다’는 얼굴을 손이나 천으로 덮어 보이지 않게 하는 동작을 잘 전달하며, 서술 흐름도 자연스럽게 유지합니다.
- source_word: ἀπέθανε
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 숨을 거두었습니다
  - 죽었습니다
  lexicon: ἀποθνῄσκω
  rationale: 단순하고 직접적인 종결 동사로 원문의 사실 진술을 그대로 살렸습니다.
theological_decisions:
- issue: ψυχή의 처리
  chosen_reading: ‘ψυχῆς’를 ‘영혼’으로 과도하게 고정하지 않고, 문맥상 내적 정서로 이해해 ‘기쁨으로’로 옮겼습니다.
  alternative_readings:
  - 영혼의 기쁨으로
  - 마음의 기쁨으로
  rationale: 이 구절은 인간의 내적 상태를 말하지만, 한국어에서 ‘영혼’은 번역투가 강해 의미 전달을 오히려 약화시킬 수 있어 문맥 중심으로 처리했습니다.
  doctrine_reference: 인간 내면의 정서/생명 개념을 한국어에서 자연스럽게 표현하는 번역 원칙
