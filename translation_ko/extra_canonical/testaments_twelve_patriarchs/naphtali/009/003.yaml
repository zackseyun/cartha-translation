source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Καὶ ἐποίησαν *οἱ υἱοὶ αὐτοῦ¹¹ *κατὰ πάντα¹² ὅσα¹³ ἐνετείλατο αὐτοῖς¹¹ Νεφθαλείμ¹⁴ ὁ πατὴρ αὐτῶν¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/003.yaml
  text: And his sons did according to all that Naphtali their father had commanded them.
translation:
  language: ko
  text: 그의 아들들은 아버지 네프탈림이 자기들에게 명령한 모든 것을 그대로 행했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐποίησαν
  english_pob_choice: And ... did
  chosen_korean: 그들은 ... 행했습니다
  alternatives_korean:
  - 그들은 ... 했습니다
  - 그들은 ... 따랐습니다
  lexicon: ποιέω
  rationale: 단순한 행위 완료를 나타내므로, 의미를 지나치게 풀지 않고 문맥에 맞게 ‘행했습니다’로 옮겼습니다.
- source_word: οἱ υἱοὶ αὐτοῦ
  english_pob_choice: his sons
  chosen_korean: 그의 아들들은
  alternatives_korean:
  - 그의 아들들이
  - 그의 자식들은
  lexicon: υἱοί
  rationale: 직역에 가깝게 ‘아들들’로 유지해 원문의 가족 관계를 분명히 했습니다.
- source_word: κατὰ πάντα ὅσα
  english_pob_choice: according to all ...
  chosen_korean: 모든 것을 그대로
  alternatives_korean:
  - 모든 대로
  - 모두
  lexicon: κατὰ πάντα
  rationale: ‘모든 것에 따라’라는 뜻을 자연스럽게 한국어로 풀어, 순종의 전면성을 드러냈습니다.
- source_word: ἐνετείλατο αὐτοῖς
  english_pob_choice: had commanded them
  chosen_korean: 자기들에게 명령한
  alternatives_korean:
  - 그들에게 명령한
  - 그들에게 지시한
  lexicon: ἐντέλλομαι
  rationale: 부과된 명령의 뉘앙스를 살려 ‘명령한’으로 옮겼고, 대명사는 문맥상 ‘자기들에게’로 정리했습니다.
- source_word: Νεφθαλείμ ὁ πατὴρ αὐτῶν
  english_pob_choice: Naphtali their father
  chosen_korean: 아버지 네프탈림
  alternatives_korean:
  - 그들의 아버지 네프탈림
  - 네프탈림 그들의 아버지
  lexicon: 고유명사/호격적 재배열
  rationale: 한국어 어순에 맞게 관계를 선명하게 하면서도, ‘그들의 아버지’라는 소유 관계는 유지했습니다.
theological_decisions:
- issue: 순종의 범위 표현
  chosen_reading: ‘모든 것을 그대로 행했습니다’로 번역해 아들의 전면적 순종을 강조했습니다.
  alternative_readings:
  - ‘모든 대로 행했습니다’
  - ‘명령한 바를 다 행했습니다’
  rationale: κατὰ πάντα ὅσα의 총괄적 의미를 간결하게 드러내며, 본문의 도덕적 강조를 약화하지 않습니다.
  doctrine_reference: 가족 내 권위와 순종의 서술
