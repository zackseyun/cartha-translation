base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001.yaml
  text: 'A copy of the testament of Naphtali, the eighth son of Jacob, which he set in order at the time of his departure, in the hundred and thirtieth year of his life.


    2 When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them. 3 And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him. 4 And while blessing and glorifying the Lord, he grew strong and said, “After the feast yesterday, my flesh failed and died.”


    5 Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father. 6 I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me upon Rachel’s knees, and for this reason she called my name Naphtali. 7 For Rachel loved me greatly, because I was born upon her knees; and when I was still a tender child she kissed me, saying, ‘May I be given a brother from my own womb, like you.’ 8 Therefore Joseph also was like me in every way, according to the prayers of Rachel.”'
translation:
  language: ko
  text: '나프탈리, 곧 야곱의 여덟째 아들의 유언의 사본입니다. 그는 떠날 때, 곧 자기 생애의 백삼십 년째에 이것을 정리하였습니다.


    2 그의 아들들이 일곱째 달 초하루에 함께 모였을 때, 그는 그들을 위해 잔치를 베풀었습니다. 3 아침에 그가 깨어난 뒤 그들에게 말하였습니다. “나는 죽어 가고 있습니다.” 그러나 그들은 그를 믿지 않았습니다. 4 그리고 주님을 찬양하고 영화롭게 하면서 그는 힘을 회복하고 말하였습니다. “어제 잔치 뒤에 내 육체는 힘을 잃고 죽었습니다.”


    5 그가 말하기 시작하였습니다. “내 자녀들아, 나프탈리의 아들들아, 내 아버지의 말을 들으십시오. 6 나는 빌하에게서 태어났습니다. 라헬이 꾀를 써서 빌하를 자기 대신 야곱에게 주었기 때문입니다. 빌하는 수태하여 라헬의 무릎 위에서 나를 낳았고, 이 때문에 그녀는 내 이름을 나프탈리라고 불렀습니다. 7 라헬은 내가 무릎 위에서 태어났기 때문에 나를 매우 사랑했습니다. 내가 아직 어린아이였을 때에도 그녀는 나에게 입을 맞추며 말하였습니다. ‘당신과 같은, 내 태에서 난 형제를 제가 얻기를 원합니다.’ 8 그러므로 요셉도 라헬의 기도대로 모든 면에서 나와 같았습니다.”[a][b][c]'
  philosophy: formal
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 증언
  - 서약
  lexicon: διαθήκη
  rationale: 이 작품은 족장들의 마지막 말과 지침을 담은 문학 형식이므로, POB의 'testament'에 맞춰 '유언'으로 옮겼습니다. '언약'은 신학적 오독을 낳을 수 있어 피했습니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: κύριος
  rationale: 직접 화자 문맥에서 신적 호칭으로 쓰였으므로 한국어 경건체에 맞는 '주님'을 사용했습니다.
- source_word: ἐκ τῆς κοιλίας μου κατά σε
  english_pob_choice: from my own womb, like you
  chosen_korean: 내 태에서 난 형제
  alternatives_korean:
  - 내 배에서 난 형제
  - 내 자궁에서 난 형제
  - 당신 같은 형제
  lexicon: κοιλία
  rationale: 공적 문체에서 지나치게 해부학적으로 들리지 않으면서도 출생의 혈연성을 드러내기 위해 '내 태'를 택했습니다. '같이'보다는 동등성보다 출생의 출처를 살린 표현으로 조정했습니다.
- source_word: ἐπὶ τῶν γονάτων
  english_pob_choice: upon Rachel’s knees
  chosen_korean: 라헬의 무릎 위에서
  alternatives_korean:
  - 라헬의 무릎 위에
  - 라헬의 무릎에
  lexicon: γόνυ
  rationale: 출생 장면의 관용적 표현을 자연스럽게 살리기 위해 '무릎 위에서'로 옮겼습니다. 문맥상 출산과 수양의 근접성을 함께 전달합니다.
theological_decisions:
- issue: Rachel's request in indirect speech and the tender-child scene
  chosen_reading: 아직 어린아이였을 때에도 그녀는 나에게 입을 맞추며 말하였습니다. ‘당신과 같은, 내 태에서 난 형제를 제가 얻기를 원합니다.’
  alternative_readings:
  - ‘내게 내 태에서 난 형제를 주십시오, 당신처럼.’
  - ‘내가 당신 같은 형제를 태에서 얻게 하소서.’
  rationale: 본문의 간청은 어린 나프탈리에게 향한 라헬의 정서적 소망을 담고 있으므로, 간구의 의미를 살리되 직역의 어색함을 줄였습니다. 동사형은 기원적 표현으로 유지했습니다.
  doctrine_reference: 가족 서사/출생 전승 해석
- issue: my flesh failed and died
  chosen_reading: 내 육체는 힘을 잃고 죽었습니다
  alternative_readings:
  - 내 육체가 쇠하여 죽었습니다
  - 내 살이 죽었습니다
  rationale: 최신 교정이 보존한 핵심 표현은 육체의 소멸을 문자적으로 말하므로, '힘을 잃고 죽었습니다'로 살리되 한국어 문장성은 유지했습니다.
  doctrine_reference: 사후 진술/죽음 표현
