id: T12P.NAP.3.3
reference: Testament of Naphtali 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Ἔθνη πλανηθέντα *καὶ ἀφέντα Κύριον²⁰ ἠλλοίωσαν²¹ τὴν²² τάξιν αὐτῶν, καὶ *ὑπήκουσαν ξύλοις καὶ λίθοις²³, πνεύμασι²⁴ πλάνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/003.yaml
  text: The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.
translation:
  language: ko
  text: 민족들은 길을 잃고 주님을 버려 그들의 질서를 바꾸었으며, 나무와 돌, 곧 속이는 영들에게 귀를 기울였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔθνη
  english_pob_choice: The nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: ἔθνη
  rationale: 영어 POB의 'The nations'를 따라 공동체적·집단적 의미를 살리되, 문맥상 우상숭배에 빠진 열방을 가리키므로 '민족들'이 가장 직접적입니다.
- source_word: πλανηθέντα
  english_pob_choice: having gone astray
  chosen_korean: 길을 잃고
  alternatives_korean:
  - 미혹되어
  - 방황하고
  lexicon: πλανάω
  rationale: 원문의 ‘길을 잃다/그릇되게 이끌리다’라는 상태를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἀφέντα Κύριον
  english_pob_choice: having forsaken the Lord
  chosen_korean: 주님을 버려
  alternatives_korean:
  - 주님을 떠나
  - 주를 버리고
  lexicon: ἀφίημι + κύριος
  rationale: ‘버리다’가 단순한 이탈보다 관계 단절과 언약적 배신을 더 분명히 드러내므로 채택했습니다.
- source_word: ὑπήκουσαν ξύλοις καὶ λίθοις
  english_pob_choice: gave heed to wood and stone
  chosen_korean: 나무와 돌…들에게 귀를 기울였습니다
  alternatives_korean:
  - 나무와 돌을 따랐습니다
  - 나무와 돌에 순종했습니다
  lexicon: ὑπακούω
  rationale: ὑπακούω의 핵심을 ‘귀를 기울이다/순종하다’로 살리되, 우상에 대한 복종의 뉘앙스를 한국어에서 자연스럽게 표현했습니다.
- source_word: πνεύμασι πλάνης
  english_pob_choice: spirits of deceit
  chosen_korean: 속이는 영들
  alternatives_korean:
  - 미혹의 영들
  - 기만의 영들
  lexicon: πνεῦμα + πλάνη
  rationale: ‘deceit’를 단순한 속임수보다 영적 미혹의 작용으로 읽어, 본문 결속을 살린 표현으로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역과 우상숭배 대조
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 본문은 직접적인 구약 인용 표지가 없고, 영어 POB도 'the Lord'를 사용하므로 한국어 본문은 문맥상 자연스러운 '주님'으로 두었습니다. 동시에 우상인 나무와 돌과의 대조가 선명해집니다.
  doctrine_reference: 단테우스/유대-기독교 전승의 주권 언어, 본문 내 우상 대조
