revisions:
- from: 그러므로 탐욕 가운데서 여러분의 행위를 부패시키려 하지 말고, 헛된 말로 여러분의 영혼을 속이지 마십시오. 오히려 마음의 정결함으로 침묵하면, 하나님의 뜻을 붙들고 베리알의 뜻을 버려야 한다는 것을 깨닫게 될 것입니다.[a][b][c]
  to: 그러므로 탐욕으로 여러분의 행위를 부패시키려고 애쓰지 말고, 헛된 말로 여러분의 영혼을 속이지 마십시오. 이는 마음의 정결함 가운데 침묵하면 하나님의 뜻을 굳게 붙들고 벨리알의 뜻을 버리는 것을 깨닫게 될 것이기 때문입니다.
  rationale: 원문에 없는 ‘오히려’를 제거하고, ὅτι의 인과 관계를 명시했습니다. 또한 ‘~해야 한다’라는 당위 표현을 हट하고 부정사 κρατεῖν και ἀπορρίπτειν을 ‘붙들고 ... 버리는 것을’으로 옮겨 원문의 구문과 의미를 보존했습니다. 고유명사는 표준 한국어 성서 용례에 맞추어 ‘벨리알’로 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 논리와 핵심 어휘는 대체로 반영되었으나, ‘오히려’는 원문에 없는 대조를 더하며, ‘버려야 한다는 것을’은 κρατεῖν·ἀπορρίπτειν의 부정사 내용을 당위 명제로 바꾸어 원문의 ‘붙들고 버리는 것을/방법을 깨닫다’라는 구문을 약화합니다. 또한 ὅτι의 이유 연결을 명시하는 편이 좋습니다.
  naturalness: ‘마음의 정결함으로 침묵하면’도 이해되지만, ‘마음의 정결함 가운데 침묵하면’이 정결한 마음의 상태 안에서 침묵한다는 원문의 결합을 더 자연스럽게 드러냅니다. ‘부패시키려 하지 말고’보다 ‘부패시키려고 애쓰지 말고’가 σπουδάζετε의 적극적 노력의 뉘앙스를 더 잘 살립니다.
  terminology: πλεονεξία는 ‘탐욕’, καθαρότης καρδίας는 ‘마음의 정결함’, κρατεῖν은 ‘굳게 붙들다’로 적절합니다. Βελίαρ는 한국어 성서 및 관련 문헌에서 더 널리 쓰이는 음역인 ‘벨리알’로 통일하는 것이 바람직합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘오히려’가 첨가되었습니다.
    rationale: οὐν ... μήτε/ἤ의 구조는 앞의 두 금지와 뒤의 이유를 연결할 뿐, ‘오히려’라는 역접·대조 접속을 포함하지 않습니다.
  - severity: medium
    issue: ‘버려야 한다는 것을’이 원문의 부정사 구문을 의무 명제로 전환합니다.
    rationale: συνήσετε κρατεῖν ... καὶ ἀπορρίπτειν은 하나님의 뜻을 붙들고 벨리알의 뜻을 버리는 것을(또는 그 방법을) 깨닫는다는 뜻이며, 별도의 ‘~해야 한다’ 명제를 직접 표현하지 않습니다.
  - severity: low
    issue: 이유를 나타내는 ὅτι가 번역에서 충분히 드러나지 않습니다.
    rationale: ‘이는 ... 때문입니다’로 연결하면 앞의 금지 권면과 뒤의 설명 사이의 인과 관계를 보존할 수 있습니다.
  revised_text: 그러므로 탐욕으로 여러분의 행위를 부패시키려고 애쓰지 말고, 헛된 말로 여러분의 영혼을 속이지 마십시오. 이는 마음의 정결함 가운데 침묵하면 하나님의 뜻을 굳게 붙들고 벨리알의 뜻을 버리는 것을 깨닫게 될 것이기 때문입니다.
