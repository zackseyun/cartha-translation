id: T12P.NAP.3.1
reference: Testament of Naphtali 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: III. Μὴ οὖν σπουδάζετε¹ *ἐν πλεονεξίᾳ² *διαφθεῖραι τὰς πράξεις ὑμῶν³, ἢ ἐν *λόγοις κενοῖς ἀπατᾶν⁴ τὰς ψυχὰς ὑμῶν, ὅτι⁵ σιωπῶντες⁶ ἐν *καθαρότητι καρδίας⁷ συνήσετε⁸ τὸ θέλημα τοῦ Θεοῦ⁹ κρατεῖν¹⁰, καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/001.yaml
  text: Therefore, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls, because by keeping silent in purity of heart you will understand to hold fast the will of God and to cast away the will of Beliar.
translation:
  language: ko
  text: 그러므로 탐욕 가운데서 여러분의 행위를 부패시키려 하지 말고, 헛된 말로 여러분의 영혼을 속이지 마십시오. 오히려 마음의 정결함으로 침묵하면, 하나님의 뜻을 붙들고 베리알의 뜻을 버려야 한다는 것을 깨닫게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν σπουδάζετε
  english_pob_choice: do not be eager
  chosen_korean: 부지런히 하려 하지 말고
  alternatives_korean:
  - 애써 하지 말고
  - 열심히 하지 말고
  lexicon: σπουδάζω
  rationale: 문맥상 단순한 ‘열심’이 아니라 어떤 일에 적극적으로 달려드는 태도를 금지하므로, 현대 한국어에서 자연스러운 부정 권고로 옮겼습니다.
- source_word: ἐν πλεονεξίᾳ διαφθεῖραι τὰς πράξεις ὑμῶν
  english_pob_choice: in greed to corrupt your deeds
  chosen_korean: 탐욕 가운데서 여러분의 행위를 부패시키려 하지 말고
  alternatives_korean:
  - 탐심으로 여러분의 행위를 타락시키려 하지 말고
  - 탐욕으로 여러분의 행실을 더럽히려 하지 말고
  lexicon: πλεονεξία / διαφθείρω / πράξεις
  rationale: πλεονεξία는 단순한 욕심보다 ‘탐욕’이 적절하고, διαφθείρειν은 도덕적 부패를 가리키므로 ‘부패시키다’가 가장 직접적입니다. πράξεις는 추상적 ‘행실’보다 구체적 ‘행위’가 원문에 가깝습니다.
- source_word: λόγοις κενοῖς ἀπατᾶν τὰς ψυχὰς ὑμῶν
  english_pob_choice: by empty words to deceive your souls
  chosen_korean: 헛된 말로 여러분의 영혼을 속이지
  alternatives_korean:
  - 헛된 말로 여러분의 혼을 속이지
  - 빈말로 여러분의 영혼을 속이지
  lexicon: λόγοις κενοῖς / ψυχαί
  rationale: λόγοις κενοῖς는 관용적으로 ‘빈말’이지만, POB의 ‘empty words’를 살려 ‘헛된 말’로 옮겼습니다. ψυχαί는 본문상 사람 전체의 내면을 가리키므로 ‘영혼’으로 두되, 한국어 독자가 자연스럽게 읽도록 했습니다.
- source_word: σιωπῶντες ἐν καθαρότητι καρδίας
  english_pob_choice: by keeping silent in purity of heart
  chosen_korean: 마음의 정결함으로 침묵하면
  alternatives_korean:
  - 마음의 순결함으로 잠잠하면
  - 마음이 정결하여 침묵하면
  lexicon: σιωπῶντες / καθαρότης καρδίας
  rationale: 분사구조를 한국어 부사절로 자연스럽게 풀어, 행위의 방식이 ‘침묵’임을 드러냈습니다. καθαρότης καρδίας는 예배적·윤리적 맥락의 ‘정결함’이 가장 적절합니다.
- source_word: κρατεῖν ... τὸ θέλημα τοῦ Θεοῦ
  english_pob_choice: to hold fast the will of God
  chosen_korean: 하나님의 뜻을 붙들고
  alternatives_korean:
  - 하나님의 뜻을 굳게 붙들고
  - 하나님의 뜻을 지키고
  lexicon: κρατεῖν
  rationale: κρατεῖν은 단순히 알거나 따르는 것이 아니라 ‘붙들다, 견지하다’의 강한 지속성을 지니므로 ‘붙들고’로 옮겼습니다.
- source_word: τὸ θέλημα τοῦ Βελίαρ
  english_pob_choice: the will of Beliar
  chosen_korean: 베리알의 뜻
  alternatives_korean:
  - 벨리알의 뜻
  - 베리아르의 뜻
  lexicon: Βελίαρ
  rationale: 고유명사 Βελίαρ는 한국어 음역에서 통용성을 고려해 ‘베리알’로 옮겼습니다. 인물/세력의 의지를 뜻하는 대조 구조를 살리기 위해 동일하게 ‘뜻’으로 대응했습니다.
theological_decisions:
- issue: 대조 구조에서 하나님의 뜻과 베리알의 뜻을 어떻게 처리할지
  chosen_reading: ‘하나님의 뜻을 붙들고 … 베리알의 뜻을 버려야 한다’로 분명한 윤리적 대조를 살렸습니다.
  alternative_readings:
  - ‘하나님의 뜻을 지키고 … 베리알의 뜻을 거부해야 한다’
  - ‘하나님의 뜻을 붙잡고 … 베리알의 뜻을 물리쳐야 한다’
  rationale: 원문은 단순 정보 전달이 아니라 두 의지의 충돌을 강조하므로, 한국어에서도 능동적 선택과 결단의 어조를 유지했습니다.
  doctrine_reference: Testament of Naphtali의 윤리적 이원론과 순종/거절의 권면 구조
- issue: σιωπῶντες의 기능을 어떻게 이해할지
  chosen_reading: 침묵 자체를 공로화하지 않고, ‘마음의 정결함’ 속에서 하나님의 뜻을 분별하는 수단으로 번역했습니다.
  alternative_readings:
  - ‘정결한 마음으로 잠잠하면’
  - ‘마음이 깨끗할 때 침묵하면’
  rationale: 본문은 침묵을 목적이 아니라 분별의 조건으로 두므로, 한국어에서도 수단적 의미가 드러나도록 했습니다.
  doctrine_reference: 지혜문학적 분별과 윤리적 자기절제
