base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/002.yaml
  text: The sun and the moon and the stars do not alter their order; so you also must not alter the law of God through the disorder of your deeds.
translation:
  language: ko
  text: 해와 달과 별들은 자기 질서를 어기지 않습니다. 그러므로 너희도 행위의 무질서로 하나님의 율법을 바꾸지 마십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἀστέρες / τὴν τάξιν αὐτῶν
  english_pob_choice: The sun and the moon and the stars do not alter their order
  chosen_korean: 해와 달과 별들은 자기 질서를 어기지 않습니다
  alternatives_korean:
  - 해와 달과 별들은 자기 순서를 바꾸지 않습니다
  - 해와 달과 별들은 자기 배열을 바꾸지 않습니다
  lexicon: τάξις
  rationale: τάξιν은 단순한 ‘순서/질서’의 뜻이므로, 자연물의 규칙성을 살려 ‘자기 질서’로 옮겼습니다.
- source_word: μὴ ἀλλοιώσητε
  english_pob_choice: must not alter
  chosen_korean: 바꾸지 마십시오
  alternatives_korean:
  - 변개하지 마십시오
  - 어지럽히지 마십시오
  lexicon: ἀλλοιόω
  rationale: 금지형의 핵심은 ‘다르게 만들다/변형하다’이므로, 현대 한국어에서 자연스러운 ‘바꾸다’로 옮기되 금지의 강도를 유지했습니다.
- source_word: νόμον Θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 명령
  lexicon: νόμος
  rationale: 여기서 νόμος는 토라/율법을 가리키므로 프로젝트 기본어인 ‘율법’을 유지했습니다.
- source_word: ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν
  english_pob_choice: through the disorder of your deeds
  chosen_korean: 행위의 무질서로
  alternatives_korean:
  - 여러분의 행위가 무질서하기 때문에
  - 행실의 어지러움으로
  lexicon: ἀταξία
  rationale: ἐν + 여격 구문은 수단/방식을 나타내므로 ‘~로’로 처리했고, πράξεις는 단순 행위보다 도덕적 실천을 가리키는 맥락이라 ‘행위’로 옮겼습니다.
theological_decisions:
- issue: 자연 질서와 율법 준수의 병행 경고
  chosen_reading: 천체가 자기 질서를 어기지 않는다는 진술을 근거로, 독자에게도 하나님의 율법을 행위의 무질서로 바꾸지 말라고 권면하는 구조를 유지했습니다.
  alternative_readings:
  - 자연의 ‘정해진 질서’를 강조해 해석하는 방식
  - 윤리적 무질서 자체를 비난하는 일반적 훈계로 완화하는 방식
  rationale: 본문은 자연 세계의 질서와 인간의 도덕적/율법적 질서를 대비하므로, 그 긴장을 약화하지 않고 직설적으로 살렸습니다.
  doctrine_reference: 창조 질서와 언약적 순종의 대비
