revisions:
- from: 그러나 너희, 내 자녀들아, 그렇게 되지 마십시오. 오히려 창공에서, 땅에서, 바다에서, 그리고 모든 피조물 가운데서 만물을 만드신 주님을 알고 있으십시오. 그러면 너희가 소돔처럼 되지 않을 것입니다. 소돔은 자기 본성의 질서를 바꾸었습니다.[a][b]
  to: 그러나 내 자녀들아, 너희는 창공과 땅과 바다와 모든 피조물 가운데서 만물을 만드신 주님을 알고, 소돔처럼 되지 않도록 하십시오. 소돔은 자기 본성의 질서를 바꾸었습니다.
  rationale: 원문의 권면 구조(‘너희는 그렇게 하지 말라’와 주님을 아는 일, 그리고 소돔과 같아지지 않게 하려는 목적)를 한국어의 자연스러운 합쇼체로 재구성했습니다. 원문에 없는 ‘오히려’를 제거하고, ἵνα를 ‘~하지 않도록’으로 반영했으며, 내용이 없는 각주 표지를 삭제했습니다. 소돔에 관한 표현은 해석적으로 구체화하지 않고 원문의 ‘본성의 질서’를 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:07Z'
