  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Ὑμεῖς δὲ *μὴ οὕτως²⁵, τέκνα μου, γινώσκοντες²⁶ ἐν τῷ²⁷ στερεώματι, ἐν γῇ καὶ²⁸ ἐν²⁹ θαλάττῃ, καὶ²⁸ ἐν³⁰ πᾶσι τοῖς δημιουργήμασι *Κύριον τὸν³¹ ποιήσαντα πάντα³², ἵνα μὴ γένησθε³³ ὡς Σόδομα, ἥτις³⁴ ἐνήλλαξε³⁵ τάξιν φύσεως αὐτῆς³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/004.yaml
  text: But you, my children, must not be so, knowing in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.
translation:
  language: ko
  text: 그러나 너희, 내 자녀들아, 그렇게 되지 마십시오. 오히려 창공에서, 땅에서, 바다에서, 그리고 모든 피조물 가운데서 만물을 만드신 주님을 알고 있으십시오. 그러면 너희가 소돔처럼 되지 않을 것입니다. 소돔은 자기 본성의 질서를 바꾸었습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὕτως, τέκνα μου
  english_pob_choice: must not be so, my children
  chosen_korean: “그렇게 되지 마십시오. … 내 자녀들아”
  alternatives_korean:
  - “그리하지 마십시오”
  - “그렇게 해서는 안 됩니다”
  lexicon: μὴ οὕτως / τέκνα μου
  rationale: 금지 표현 μὴ οὕτως를 자연스러운 금령으로 옮기고, τέκνα μου는 친밀한 호칭인 “내 자녀들아”로 살려 원문의 목회적 호소를 드러냈습니다.
- source_word: γινώσκοντες ἐν τῷ στερεώματι, ἐν γῇ καὶ ἐν θαλάττῃ, καὶ ἐν πᾶσι τοῖς δημιουργήμασι
  english_pob_choice: knowing in the firmament, on the earth, and in the sea, and in all created things
  chosen_korean: “창공에서, 땅에서, 바다에서, 그리고 모든 피조물 가운데서 … 알고 있으십시오”
  alternatives_korean:
  - “창공 안에서”
  - “하늘 궁창에서”
  - “알아보십시오”
  lexicon: στερέωμα / δημιουργήματα
  rationale: στερέωμα는 전통적 ‘궁창’보다 현대 독자가 이해하기 쉬운 ‘창공’으로 옮기되, 우주적 영역을 가리키는 점을 유지했습니다. δημιουργήματα는 ‘피조물’로 옮겨 창조된 것들의 총체라는 의미를 보존했습니다.
- source_word: Κύριον τὸν ποιήσαντα πάντα
  english_pob_choice: the Lord who made all things
  chosen_korean: “만물을 만드신 주님”
  alternatives_korean:
  - “모든 것을 지으신 주님”
  - “만물을 만드신 주(主)”
  lexicon: κύριος / ποιέω
  rationale: κύριος는 본문이 가리키는 주체를 존중해 ‘주님’으로 옮기고, ποιήσαντα πάντα는 창조 행위를 분명히 드러내는 ‘만물을 만드신’으로 번역했습니다.
- source_word: ἐνήλλαξε τάξιν φύσεως αὐτῆς
  english_pob_choice: changed the order of its nature
  chosen_korean: “자기 본성의 질서를 바꾸었습니다”
  alternatives_korean:
  - “본성의 질서를 뒤바꾸었습니다”
  - “자연의 질서를 바꾸었습니다”
  lexicon: τάξις / φύσις / ἐναλλάσσω
  rationale: τάξις와 φύσις의 긴장을 함께 살리기 위해 ‘본성의 질서’로 옮겼습니다. 이는 단순한 사회질서가 아니라 창조된 본성의 배열이 바뀐다는 원문의 강한 표현을 반영합니다.
theological_decisions:
- issue: 소돔의 예시가 전달하는 도덕적·창조질서적 경고
  chosen_reading: 소돔을 단순한 역사적 멸망 사례가 아니라 ‘본성의 질서를 바꾼’ 도시로 제시하여, 창조 질서를 거스르는 행위에 대한 경고로 읽었습니다.
  alternative_readings:
  - 소돔을 일반적 사악함의 대표 사례로만 읽는 해석
  - 성적 문제를 직접 언급하지 않고 완곡하게 처리하는 해석
  rationale: 본문은 소돔의 특징을 멸망 자체보다 ‘본성의 질서를 바꿈’으로 규정하므로, 경고의 초점을 창조 질서의 전복에 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 창조론, 성윤리, 타락론
