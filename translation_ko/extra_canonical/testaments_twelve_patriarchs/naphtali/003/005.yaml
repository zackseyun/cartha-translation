id: T12P.NAP.3.5
reference: Testament of Naphtali 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. Ὁμοίως³⁷ δὲ³⁸ καὶ³⁹ οἱ Ἐγρήγοροι⁴⁰ ἐνήλλαξαν τάξιν φύσεως αὐτῶν, οὓς⁴¹ κατηράσατο⁴² Κύριος ἐπὶ τοῦ κατακλυσμοῦ⁴³, διʼ οὓς⁴⁴ *ἀπὸ κατοικησίας καὶ ἄκαρπον τάξας τὴν γῆν [ἀοίκητον]⁴⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/005.yaml
  text: In the same way also the Watchers changed the order of their nature, whom the Lord cursed at the time of the flood, because of whom he made the earth uninhabited and fruitless.
translation:
  language: ko
  text: 그와 같이 감시자들도 자기 본성의 질서를 바꾸었습니다. 주님께서는 홍수 때에 그들을 저주하셨으며, 그들 때문에 땅을 사람이 살지 못하고 열매를 맺지 못하게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ Ἐγρήγοροι
  english_pob_choice: the Watchers
  chosen_korean: 감시자들
  alternatives_korean:
  - 감관들
  - 파수꾼들
  - 워처들
  lexicon: 고유명사/칭호
  rationale: 이 본문은 창세기 6장 계열의 천상 존재 칭호를 가리키므로, 전통적 번역어를 그대로 따르기보다 기능을 드러내는 직역형인 ‘감시자들’을 택했습니다.
- source_word: ἐνήλλαξαν τάξιν φύσεως αὐτῶν
  english_pob_choice: changed the order of their nature
  chosen_korean: 자기 본성의 질서를 바꾸었습니다
  alternatives_korean:
  - 자기 본성의 순서를 바꾸었습니다
  - 자기 본성의 질서를 어겼습니다
  lexicon: 동사구/명사구
  rationale: ἐνήλλαξαν의 ‘바꾸다’와 τάξις/φύσις의 결합을 살려, 단순한 ‘어기다’보다 구조적 전도와 질서 변경을 함께 보이도록 옮겼습니다.
- source_word: κατηράσατο Κύριος
  english_pob_choice: the Lord cursed
  chosen_korean: 주님께서 저주하셨고
  alternatives_korean:
  - 주님께서 저주하셨습니다
  - 주님이 저주하셨고
  lexicon: 신학 용어
  rationale: 본문의 Κύριος는 신적 주어이므로 한국어 본문에서는 존칭형 종결을 사용하되, 문맥상 이어지는 결과 절과 자연스럽게 연결되도록 ‘저주하셨고’로 처리했습니다.
- source_word: ἀπὸ κατοικησίας καὶ ἄκαρπον
  english_pob_choice: uninhabited and fruitless
  chosen_korean: 사람이 살지 못하고 열매 맺지 못하게
  alternatives_korean:
  - 거주할 수 없고 열매 없는
  - 사람 살 곳이 아니고 열매 없는
  lexicon: 형용사구/결과 구문
  rationale: ἀπὸ κατοικησίας는 단순한 추상 명사보다 결과 상태를 나타내므로 ‘사람이 살지 못하게’로 풀었고, ἄκαρπον은 농경적·비유적 무실결을 살려 ‘열매 맺지 못하게’로 옮겼습니다.
theological_decisions:
- issue: 홍수 때의 저주와 땅의 황폐화 관계
  chosen_reading: 저주와 땅의 무거주·무결실 상태를 인과적으로 연결했습니다.
  alternative_readings:
  - 저주만 따로 끊어 읽는 해석
  - ‘땅을 황폐하게 하셨다’는 완화된 표현
  rationale: 그리스어의 관계대명사와 διʼ οὓς 구조는 감시자들 때문에 발생한 결과를 분명히 묶으므로, 인과를 약화시키지 않고 두 결과를 함께 드러냈습니다.
  doctrine_reference: 본문 주해 차원의 인과 구조 보존
