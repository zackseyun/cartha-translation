  source_fidelity: 그리스어의 인칭대명사 αὐτόν/αὐτῷ를 모두 ‘그’로 일관되게 옮기고, κατέλαβεν의 포착·제지 의미도 ‘붙잡고’로 적절히 반영했습니다. 다만 εἰς τὸ ὕψος의 장소적 용법을 ‘그 높이로’라고 하면 현대 한국어에서 부자연스럽고 의미가 다소 불분명합니다.
