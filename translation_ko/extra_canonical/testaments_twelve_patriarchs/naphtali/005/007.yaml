  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. *ἐλθὼν δὲ Ἰωσὴφ κατέλαβεν³⁸ αὐτόν, καὶ συνανῆλθεν³⁹ αὐτῷ εἰς τὸ⁴⁰ ὕψος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/007.yaml
  text: But Joseph came and seized him, and went up with him to the height.
translation:
  language: ko
  text: 그런데 요셉이 와서 그를 붙잡고, 그와 함께 그 높은 곳으로 올라갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ Ἰωσὴφ
  english_pob_choice: But Joseph came
  chosen_korean: 그런데 요셉이 와서
  alternatives_korean:
  - 그런데 요셉이 오자
  - 요셉이 와서
  lexicon: 요셉
  rationale: δὲ는 단순한 접속보다 장면 전환의 뉘앙스가 있어 ‘그런데’로 살렸고, ἐλθὼν은 한국어 서술 흐름에 맞게 ‘와서’로 옮겼습니다.
- source_word: κατέλαβεν αὐτόν
  english_pob_choice: seized him
  chosen_korean: 그를 붙잡고
  alternatives_korean:
  - 그를 붙들고
  - 그를 사로잡고
  - 그를 잡아채고
  lexicon: 붙잡다
  rationale: κατέλαβεν은 단순 접촉보다 강한 제압·포착의 감각이 있어, 과도한 폭력성을 덜면서도 ‘seized’의 힘을 드러내는 ‘붙잡다’를 선택했습니다.
- source_word: συνανῆλθεν αὐτῷ
  english_pob_choice: went up with him
  chosen_korean: 그와 함께 올라갔습니다
  alternatives_korean:
  - 그와 함께 올라갔습니다
  - 그와 함께 올라갔습니다
  - 그와 함께 동행하여 올라갔습니다
  lexicon: 올라가다
  rationale: συνανῆλθεν은 ‘함께 올라가다’라는 동반 상승을 나타내므로, 관계 표지 ‘그와 함께’와 동작 ‘올라갔습니다’를 결합해 자연스럽게 반영했습니다.
- source_word: εἰς τὸ ὕψος
  english_pob_choice: to the height
  chosen_korean: 그 높이로
  alternatives_korean:
  - 그 높이까지
  - 높은 곳으로
  - 그 높이로
  lexicon: 높이
  rationale: ὕψος는 추상적 ‘높음’과 장소적 ‘높은 곳’의 여지가 있으나, 영어 POB의 ‘the height’를 따라 장소 방향을 드러내는 ‘그 높이로’로 옮겼습니다.
theological_decisions:
- issue: 서술의 모호성 vs. 문맥 충실성
  chosen_reading: 본문이 지시하는 인물 관계와 동작의 강도를 그대로 유지해, 과도한 설명 없이 장면의 역동성을 살렸습니다.
  alternative_readings:
  - 상징적 상승으로 풀어 설명하기
  - 문맥을 보강해 ‘높은 곳’의 의미를 덧붙이기
  rationale: 이 절은 해설보다 서술 자체의 밀도가 중요하므로, 원문의 긴장감과 운동성을 한국어에서 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Source-text fidelity / narrative immediacy
