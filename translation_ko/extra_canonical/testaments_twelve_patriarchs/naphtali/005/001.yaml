source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Καὶ σμικρυνθέντες¹⁸ ἐπιστρέψετε¹⁹ καὶ ἐπιγνώσεσθε Κύριον τὸν Θεὸν ὑμῶν²⁰ καὶ ἐπιστρέψει ὑμᾶς εἰς τὴν γῆν ὑμῶν κατὰ²¹ τὸ πολὺ αὐτοῦ ἔλεος²². 4. Καὶ ἔσται ὅταν²³ *ἐξέλθωσιν εἰς τὴν γῆν τῶν²⁴ πατέρων αὐτῶν, πάλιν ἐπιλήσονται²⁵ τοῦ²⁶ Κυρίου καὶ ἀσεβήσουσιν²⁷. 5. Καὶ διασπερεῖ²⁸ αὐτοὺς Κύριος²⁹ ἐπὶ πρόσωπον³⁰ πάσης τῆς γῆς, *ἄχρις οὗ ἔλθῃ³¹ *τὸ σπλάγχνον Κυρίου³², ἄνθρωπος *ποιῶν δικαιοσύνην καὶ ποιῶν ἔλεος³³ εἰς πάντας τοὺς *μακρὰν καὶ τοὺς ἐγγύς³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/001.yaml
  text: And being brought low, you will turn back and acknowledge the Lord your God, and he will bring you back into your land according to his great mercy. 4 And it shall come to pass, when they go out into the land of their fathers, again they will forget the Lord and act impiously. 5 And the Lord will scatter them upon the face of all the earth, until the compassion of the Lord shall come, a man working righteousness and showing mercy to all who are far off and to those who are near.
translation:
  language: ko
  text: 3. 그리고 너희가 낮아진 뒤에 돌아와 주 너희 하나님을 인정할 것이며, 그분께서는 크신 자비를 따라 너희를 너희 땅으로 돌아오게 하실 것입니다. 4. 그리고 그들이 자기 조상들의 땅으로 나아갈 때에, 다시 주를 잊고 불경한 일을 할 것입니다. 5. 그리고 주께서 그들을 온 땅 위에 흩으실 것입니다. 주의 긍휼, 곧 의를 행하고 멀리 있는 이들과 가까이 있는 이들 모두에게 긍휼을 베푸는 한 사람이 올 때까지 그러하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σμικρυνθέντες
  english_pob_choice: being brought low
  chosen_korean: 낮아지면
  alternatives_korean:
  - 작아지면
  - 축소되면
  - 겸손해지면
  lexicon: σμικρύνω
  rationale: 상태의 저하·비천함을 자연스러운 현대 한국어로 옮기되, 단순한 신체적 ‘작음’보다 문맥의 낮아짐을 살렸습니다.
- source_word: Κύριον τὸν Θεὸν ὑμῶν
  english_pob_choice: the Lord your God
  chosen_korean: 너희의 하나님 야훼
  alternatives_korean:
  - 너희의 주 하나님
  - 너희 하나님 여호와
  - 너희의 주 하나님 야훼
  lexicon: κύριος / Θεός / יהוה
  rationale: 문맥상 주어가 야훼이므로 프로젝트 기본값에 따라 ‘야훼’를 사용하고, 하나님은 한국어 관습대로 유지했습니다.
- source_word: ἔλεος
  english_pob_choice: mercy / great mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은혜
  - 자애
  lexicon: ἔλεος
  rationale: 영어 POB의 ‘mercy’를 따라 하나님의 구원적 긍휼을 드러내는 ‘긍휼’을 택했고, ‘큰’과 함께 강도를 보존했습니다.
- source_word: διασπερεῖ αὐτοὺς ... ἐπὶ πρόσωπον πάσης τῆς γῆς
  english_pob_choice: scatter them upon the face of all the earth
  chosen_korean: 그들을 온 땅의 표면에 흩으실 것입니다
  alternatives_korean:
  - 그들을 온 땅에 흩으실 것입니다
  - 그들을 온 지면에 흩으실 것입니다
  lexicon: διασπείρω / πρόσωπον
  rationale: ‘온 땅의 표면’은 원문의 ‘온 땅의 얼굴/표면’ 관용을 비교적 직역해 심판의 전면성을 유지합니다.
- source_word: ποιῶν δικαιοσύνην καὶ ποιῶν ἔλεος
  english_pob_choice: a man working righteousness and showing mercy
  chosen_korean: 의를 행하고 ... 긍휼을 베푸는 한 사람
  alternatives_korean:
  - 의를 행하며 자비를 베푸는 한 사람
  - 정의를 행하고 자비를 보이는 한 사람
  lexicon: δικαιοσύνη / ἔλεος
  rationale: δικαιοσύνη는 프로젝트 기본값에 따라 ‘의’로, ἔλεος는 ‘긍휼’로 일관되게 옮겨 원문 병렬을 살렸습니다.
theological_decisions:
- issue: ‘the compassion of the Lord shall come’의 주체와 지시
  chosen_reading: 야훼의 긍휼이 오는 것은 곧 이어지는 ‘한 사람’에 대한 예언적 동일시로 읽었습니다.
  alternative_readings:
  - 단순히 하나님의 자비가 시기적으로 임하는 것으로만 읽는 해석
  - ‘한 사람’과 별개의 사건으로 보는 해석
  rationale: 그리스어가 ‘ἔλθῃ τὸ σπλάγχνον Κυρίου’ 뒤에 곧바로 인격적 설명절을 붙이므로, POB의 문장 흐름을 따라 예언적 인격화를 반영했습니다.
  doctrine_reference: 예언적 인격화 / 메시아적 독법
- issue: 문체상 직접화법과 서술체의 결합
  chosen_reading: 본문의 예언적 서술을 유지하면서, 하나님의 직접 행위는 존칭 종결로 처리했습니다.
  alternative_readings:
  - 전면적인 구어체화
  - 고전적 성경체로의 전환
  rationale: 합쇼체의 현대적 가독성을 유지하되, 신적 행위가 등장하는 절에서는 ‘-실 것입니다’로 공손하고 일관된 서술을 택했습니다.
  doctrine_reference: 문체 일관성
