  source_fidelity: 원문의 동물 형상과 수량(큰 뿔 둘, 독수리의 복수 날개), 그리고 붙잡으려 했으나 능하지 못했다는 내용을 충실히 보존합니다. 다만 초안의 ‘독수리의 날개’는 한국어에서 단·복수 표지가 약하고, 마지막 ‘할 수 없었습니다’는 무엇을 할 수 없었는지가 생략되어 원문의 행위를 충분히 드러내지 못합니다.
