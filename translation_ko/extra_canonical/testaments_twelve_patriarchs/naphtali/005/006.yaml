id: T12P.NAP.5.6
reference: Testament of Naphtali 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Καὶ ἰδοὺ ταῦρος ἐπὶ τῆς γῆς, ἔχων δύο³³ κέρατα μεγάλα, καὶ πτέρυγας³⁴ ἀετοῦ ἐπὶ³⁵ νώτου αὐτοῦ· καὶ θέλοντες ἡμεῖς³⁶ πιάσαι³⁷ αὐτόν, οὐκ ἠδυνήθημεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/006.yaml
  text: And behold, a bull was on the earth, having two great horns and the wings of an eagle on its back; and though we wanted to seize it, we were not able.
translation:
  language: ko
  text: 그리고 보십시오. 땅 위에 큰 뿔 두 개와 등에 독수리의 날개 한 쌍을 지닌 수소 한 마리가 있었습니다. 우리가 그것을 붙잡으려 하였으나 붙잡을 수 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦρος
  english_pob_choice: a bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 소
  lexicon: ταῦρος
  rationale: 일반적인 ‘소’보다 더 구체적인 수컷 소를 가리키는 말이므로, 문맥의 상징적 동물을 자연스럽게 드러내는 ‘수소’를 택했습니다.
- source_word: ἔχων δύο κέρατα μεγάλα
  english_pob_choice: having two great horns
  chosen_korean: 큰 뿔 두 개를 가지고
  alternatives_korean:
  - 두 개의 큰 뿔을 지닌
  - 큰 뿔이 두 개 있는
  lexicon: ἔχω / κέρας / μέγας
  rationale: 원문의 현재분사 구조를 살려 ‘가지고 있었습니다’로 옮기고, ‘두 개의 큰 뿔’의 어순은 한국어에서 자연스럽게 재배열했습니다.
- source_word: πτέρυγας ἀετοῦ
  english_pob_choice: the wings of an eagle
  chosen_korean: 독수리의 날개
  alternatives_korean:
  - 독수리 날개
  - 독수리의 깃날개
  lexicon: πτερυξ / ἀετός
  rationale: 영어 POB의 수정처럼 소유격 관계를 분명히 드러내되, 한국어에서는 ‘독수리의 날개’가 가장 직역에 가깝고도 자연스럽습니다.
- source_word: πιάσαι
  english_pob_choice: seize
  chosen_korean: 붙잡으려고
  alternatives_korean:
  - 잡으려고
  - 붙들려고
  lexicon: πιάζω
  rationale: 손으로 붙들어 포획하려는 뜻을 살려 ‘붙잡다’를 택했습니다. 단순히 ‘잡다’보다 시도와 제압의 뉘앙스가 분명합니다.
theological_decisions:
- issue: 상징적 환상 서술의 직역 강도
  chosen_reading: 환상적 장면을 완화하지 않고, ‘수소’, ‘독수리의 날개’, ‘붙잡으려고 했으나’의 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 상징을 풀어 설명하는 의역
  - 동물 이미지를 일반화하는 번역
  rationale: 이 절은 해석보다 이미지 자체가 중요한 본문이므로, 독자가 상징의 강도를 직접 느끼도록 원문 표지를 보존하는 것이 적절합니다.
  doctrine_reference: 본문 해석의 최소개입 원칙
