- from: 그리고 보십시오, 땅 위에 한 수소가 있었는데, 큰 뿔 두 개와 등 위에 독수리의 날개를 가지고 있었습니다. 그리고 우리가 그것을 붙잡으려고 했으나, 할 수 없었습니다.
  to: 그리고 보십시오. 땅 위에 큰 뿔 두 개와 등에 독수리의 날개 한 쌍을 지닌 수소 한 마리가 있었습니다. 우리가 그것을 붙잡으려 하였으나 붙잡을 수 없었습니다.
  rationale: 원문의 형상 묘사를 유지하면서 한국어에서 자연스럽게 어순을 조정했습니다. ‘날개 한 쌍’으로 πτέρυγας의 복수를 드러내고, 마지막 절에는 ‘붙잡을 수 없었습니다’를 반복하여 πιάσαι의 행위와 οὐκ ἠδυνήθημεν의 무능 표현을 분명히 했습니다.
