base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/004.yaml
  text: And while Levi was like the sun, behold, a certain young man gives him twelve palm branches; and Judah became bright like the moon, and beneath their feet were twelve rays.
translation:
  language: ko
  text: 레위가 해와 같을 때, 보십시오, 어떤 젊은이가 그에게 열두 개의 종려나무 가지를 건넵니다. 유다는 달처럼 빛나게 되었고, 그들의 발 아래에는 열두 광선이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος ... τοῦ Λευὶ ὡς ὁ ἥλιος
  english_pob_choice: while Levi was like the sun
  chosen_korean: 레위가 해처럼 있는 동안
  alternatives_korean:
  - 레위가 해와 같을 때
  - 레위가 태양처럼 있을 동안
  lexicon: sun → 해
  rationale: ἥλιος의 직유를 자연스러운 현대 한국어로 살리되, 시각적 대비를 유지하기 위해 ‘해처럼’으로 옮겼습니다.
- source_word: ἐπιδίδωσιν
  english_pob_choice: gives
  chosen_korean: 건넵니다
  alternatives_korean:
  - 줍니다
  - 주고 있습니다
  lexicon: present vivid narration
  rationale: 현재시제의 생생한 서술을 반영하면서, 문맥상 손에 쥔 가지를 ‘건네는’ 동작이 더 구체적으로 드러나도록 했습니다.
- source_word: βαΐα φοινίκων
  english_pob_choice: palm branches
  chosen_korean: 종려나무 가지
  alternatives_korean:
  - 야자 가지
  - 종려 가지
  lexicon: palm branches
  rationale: φοινίκων은 종려를 가리키므로 한국어 성경에서 익숙한 ‘종려나무 가지’로 옮겼습니다.
- source_word: ἡ σελήνη
  english_pob_choice: the moon
  chosen_korean: 달
  alternatives_korean:
  - 달빛
  - 월(月)
  lexicon: moon
  rationale: 직유를 자연스럽게 유지하기 위해 ‘달처럼’보다 앞 절과 대칭되는 형용사구로 ‘달처럼 빛나게’라고 풀었습니다.
theological_decisions:
- issue: 상징적 천체 이미지의 보존
  chosen_reading: 레위는 해처럼, 유다는 달처럼 빛나는 이미지로 보존하고, 열두 가지와 열두 광선도 그대로 유지했습니다.
  alternative_readings:
  - 상징을 완화하여 단순한 화려함 묘사로 처리
  - 해·달 이미지를 비유적으로 더 자유롭게 풀어씀
  rationale: 이 절은 후대 전승의 상징적 환시를 전달하므로, 의미를 평탄화하지 않고 원문의 우주적 이미지와 숫자 상징을 유지하는 것이 본문 이해에 더 충실합니다.
  doctrine_reference: 문학적 상징과 환시 묘사의 보존
