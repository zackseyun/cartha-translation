  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καὶ εἶδον *ὅτι ἤμην παρεκεῖ⁴¹, καὶ ἰδοὺ γραφὴ *ἁγία ὤφθη ἡμῖν⁴², λέγουσα⁴³· Ἀσσύριοι⁴⁴, Μῆδοι⁴⁵, Πέρσαι⁴⁶, Χαλδαῖοι⁴⁷, Σύροι⁴⁸, κληρονομήσουσιν αἰχμαλωσίαν⁴⁹ τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/008.yaml
  text: And I saw that I was there, and behold, a holy writing appeared to us, saying, “Assyrians, Medes, Persians, Chaldeans, Syrians shall inherit in captivity the twelve sceptres of Israel.”
translation:
  language: ko
  text: 그리고 내가 보니 내가 거기에 있었습니다. 보라, 우리에게 거룩한 글이 나타나 말하기를, 「앗수르 사람들, 메대 사람들, 페르시아 사람들, 갈대아 사람들, 시리아 사람들은 이스라엘의 열두 홀을 포로 상태 가운데서 상속할 것입니다」라고 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην παρεκεῖ / I was there
  english_pob_choice: I was there
  chosen_korean: 내가 거기에 있었습니다
  alternatives_korean:
  - 내가 그곳에 있었습니다
  - 내가 거기 있었습니다
  lexicon: παρεκεῖ
  rationale: 장소 존재를 자연스럽게 살리되, 서술체는 현대 합쇼체로 정리했습니다.
- source_word: γραφὴ ἁγία
  english_pob_choice: a holy writing
  chosen_korean: 거룩한 글
  alternatives_korean:
  - 거룩한 기록
  - 성스러운 문서
  lexicon: γραφὴ
  rationale: 문서 자체를 가리키는 표현으로 보아 ‘글’로 옮기고, ἁγία는 ‘거룩한’으로 직접 반영했습니다.
- source_word: κληρονομήσουσιν αἰχμαλωσίαν
  english_pob_choice: shall inherit in captivity
  chosen_korean: 포로 상태 가운데서 상속할 것입니다
  alternatives_korean:
  - 포로 생활 가운데서 상속할 것입니다
  - 포로가 되어 물려받을 것입니다
  lexicon: κληρονομέω + αἰχμαλωσία
  rationale: ‘상속하다’의 의미를 유지하되, αἰχμαλωσία를 단순한 비유로 풀지 않고 ‘포로 상태’로 드러냈습니다.
- source_word: τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ
  english_pob_choice: the twelve sceptres of Israel
  chosen_korean: 이스라엘의 열두 홀
  alternatives_korean:
  - 이스라엘의 열두 홀패
  - 이스라엘의 열두 지팡이
  lexicon: σκῆπτρον
  rationale: σκῆπτρα를 왕권 표지인 ‘홀’로 옮겨, 영어의 ‘sceptres’와 상응시키면서도 한국어에서 의미가 분명하도록 했습니다.
theological_decisions:
- issue: 열거된 민족명들의 직역과 고유명사 표기
  chosen_reading: 앗수르 사람들, 메대 사람들, 페르시아 사람들, 갈대아 사람들, 시리아 사람들로 옮겼습니다.
  alternative_readings:
  - 앗시리아 사람들
  - 아시리아 사람들
  - 수리아 사람들
  rationale: 본문의 민족/제국명 목록을 독자에게 즉시 인지되도록 현대 한국어 표기로 풀되, 원문 열거 구조는 유지했습니다.
  doctrine_reference: N/A
