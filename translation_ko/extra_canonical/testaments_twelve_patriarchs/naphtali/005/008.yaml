revisions:
- from: 그리고 내가 보니 내가 거기에 있었습니다. 보라, 우리에게 거룩한 글이 나타나 말하기를, 「앗수르 사람들, 메대 사람들, 페르시아 사람들, 갈대아 사람들, 시리아 사람들은 이스라엘의 열두 홀을 포로 상태 가운데서 상속할 것입니다」라고 하였습니다.[a][b][c]
  to: 그리고 내가 보니, 내가 거기에 있었습니다. 보라, 거룩한 글이 우리에게 나타나 이렇게 말했습니다. “앗수르 사람들, 메대 사람들, 페르시아 사람들, 갈대아 사람들, 시리아 사람들은 포로 상태에서 이스라엘의 열두 왕홀을 상속하게 될 것입니다.”
  rationale: 직역적 구조와 역사적 민족명 열거를 유지하면서, 현대 한국어에 맞게 문장 연결과 핵심어를 다듬었습니다. ‘포로 상태에서’는 원문의 결합이 지닌 통사적·의미적 난점을 별도의 해석으로 해소하지 않기 위해 유지했습니다. 미제공 각주에 연결된 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:08Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 ‘내가 거기에 있음을 보았다’, ‘거룩한 글이 우리에게 나타났다’, 민족명 열거, 그리고 κληρονομήσουσιν과 αἰχμαλωσία의 결합을 유지했습니다. αἰχμαλωσία가 누구의 포로 상태를 가리키는지 문맥상 더 특정하지 않고, 원문의 다소 낯선 표현을 한국어에서도 가능한 한 열어 두었습니다. σκῆπτρα는 ‘왕홀’로 옮겨 문자적 왕권 표지라는 뜻을 보존했습니다.
  naturalness: 초안의 ‘포로 상태 가운데서 상속할 것입니다’와 ‘말하기를 … 라고 하였습니다’는 현대 한국어에서 다소 부자연스럽습니다. ‘포로 상태에서 … 상속하게 될 것입니다’ 및 직접 인용 뒤의 ‘라고 말했습니다’가 더 자연스럽고, 전체 문장을 합쇼체 서술에 맞춥니다.
  terminology: ἁγία γραφή는 여기서 정관사 없는 ‘거룩한 글/기록’이므로 특정한 정경 명칭으로 단정하지 않고 ‘거룩한 글’로 유지했습니다. σκῆπτρα의 일반적 의미인 sceptres는 ‘홀’보다 뜻이 분명한 ‘왕홀’로 수정했습니다. 앗수르, 메대, 페르시아, 갈대아, 시리아는 통용되는 한국어 역사·성서 지명 및 민족명 표기입니다.
  issues:
  - severity: medium
    issue: ‘홀’은 현대 한국어에서 의미가 불분명할 수 있습니다.
    rationale: σκῆπτρα는 통치권의 표지인 sceptres이므로 ‘왕홀’이 더 명료하면서도 원문의 은유를 해석으로 대체하지 않습니다.
  - severity: medium
    issue: ‘포로 상태 가운데서 상속할 것입니다’ 및 인용 도입 문장이 부자연스럽습니다.
    rationale: 원문의 문법적 긴장과 모호성은 보존하되, 현대 합쇼체 한국어 문장으로는 ‘포로 상태에서 … 상속하게 될 것입니다’와 ‘라고 말했습니다’가 적절합니다.
  - severity: low
    issue: 본문에 근거가 제시되지 않은 [a][b][c] 표지가 붙어 있습니다.
    rationale: 제공된 초안에는 이에 대응하는 각주 내용이 없으므로 표지를 삭제하여 본문-각주 구조를 일치시킵니다.
