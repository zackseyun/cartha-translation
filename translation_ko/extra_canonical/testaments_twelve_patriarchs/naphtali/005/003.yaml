  text: And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.
translation:
  language: ko
  text: 그리고 우리 모두 함께 달렸습니다. 레위는 해를 붙잡았고, 유다는 먼저 도착하여 달을 붙잡았으며, 두 사람 모두 그들과 함께 들어 올려졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδράμομεν πάντες ὁμοῦ
  english_pob_choice: we all ran together
  chosen_korean: 우리 모두 함께 달렸습니다
  alternatives_korean:
  - 우리 모두 한꺼번에 달렸습니다
  - 우리 모두 같이 달렸습니다
  lexicon: δράμω / ὁμοῦ
  rationale: ἐδράμομεν과 ὁμοῦ의 결합을 자연스러운 서술로 살려, ‘함께 달렸다’는 집단적 움직임을 간결하게 전달했습니다.
- source_word: ἐκράτησε τὸν ἥλιον
  english_pob_choice: Levi seized the sun
  chosen_korean: 레위는 해를 붙잡았고
  alternatives_korean:
  - 레위는 해를 붙들었고
  - 레위는 태양을 붙잡았고
  lexicon: κρατέω / ἥλιος
  rationale: κρατέω는 단순 접촉보다 ‘붙잡다’가 더 직접적이며, ἥλιος은 서사적 이미지에 맞게 ‘해’로 옮겼습니다.
- source_word: φθάσας ἔπιασε τὴν σελήνην
  english_pob_choice: Judah, arriving first, took hold of the moon
  chosen_korean: 유다는 먼저 도착하여 달을 붙잡았으며
  alternatives_korean:
  - 유다는 먼저 이르러 달을 붙잡았으며
  - 유다는 앞서 도착해 달을 붙잡았으며
  lexicon: φθάνω / ἔπιασε / σελήνη
  rationale: latest revision pass의 ‘arriving first’를 반영해 φθάσας를 ‘먼저 도착하여’로 풀고, ἔπιασε는 구어적이지만 과감한 동작을 살리는 ‘붙잡다’로 옮겼습니다.
- source_word: ὑψώθησαν ἀμφότεροι σὺν αὐτοῖς
  english_pob_choice: both of them were lifted up with them
  chosen_korean: 둘 모두 그들과 함께 높이 들렸습니다
  alternatives_korean:
  - 둘 다 그들과 함께 높이 올려졌습니다
  - 두 사람 모두 그들과 함께 높아졌습니다
  lexicon: ὑψόω / ἀμφότεροι / σὺν αὐτοῖς
  rationale: 수동형 ὑψώθησαν을 ‘높이 들리다’로 옮겨 올라감의 이미지를 살리고, ἀμφότεροι는 ‘둘 모두’로 분명히 했습니다.
theological_decisions:
- issue: 시적 환상 장면의 동사 선택과 묘사 강도
  chosen_reading: 천체를 붙잡고 높이 들리는 비현실적 장면을 그대로 유지해, 본문의 상징성과 환상성을 약화시키지 않았습니다.
  alternative_readings:
  - 상징적으로 완화해 ‘차지하다’ ‘받다’로 옮김
  - 자연주의적으로 풀어 의미를 약화시킴
  rationale: 본문은 서사적 사실 묘사보다 상징적·환상적 이미지가 핵심이므로, 독자가 낯섦을 느끼더라도 원문의 강한 장면성을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적-상징적 본문 해석
