  source_fidelity: 그리스어 Καὶ προσδραμόντες οἱ δύο ... Λευὶ καὶ Ἰούδας ἐκράτησαν αὐτούς의 연결, ‘두 사람’의 신원 제시, 달려감, 그리고 복수 목적어를 붙잡는 행위를 충실히 반영합니다. προσδραμόντες의 ‘다가가 달려들다/달려오다’라는 접근 방향도 문맥상 ‘달려가’로 무리 없이 전달됩니다.
  naturalness: “그리고 두 사람, 레위와 유다가 달려가 그들을 붙잡았습니다.”는 현대 표준 한국어 합쇼체로 자연스럽고 간결합니다. 쉼표로 삽입된 동격 표현도 이해에 지장이 없습니다.
  terminology: 레위, 유다의 고유명사 표기가 적절하며, κρατέω의 여기서의 능동적 장악 의미를 ‘붙잡았습니다’가 자연스럽고 정확하게 나타냅니다. 신학 용어 또는 교파적 해석이 추가되지 않았습니다.
