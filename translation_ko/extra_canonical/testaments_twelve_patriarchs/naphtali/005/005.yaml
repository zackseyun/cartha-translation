  text: And the two, Levi and Judah, ran up and seized them.
translation:
  language: ko
  text: 그리고 두 사람, 레위와 유다가 달려가 그들을 붙잡았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ προσδραμόντες
  english_pob_choice: And ... ran up
  chosen_korean: 그리고 ... 달려가
  alternatives_korean:
  - 그리고 ... 달려 올라가
  - 그리고 ... 뛰어가
  lexicon: προσδραμόντες
  rationale: 접두사 προσ-의 방향성을 살리되, 현대 한국어에서 자연스러운 동작 서술로는 ‘달려가’가 가장 간결하고 직접적입니다.
- source_word: οἱ δύο ὅτε Λευὶ καὶ Ἰούδας
  english_pob_choice: the two, Levi and Judah
  chosen_korean: 두 사람, 레위와 유다
  alternatives_korean:
  - 둘, 레위와 유다
  - 그 두 사람, 레위와 유다
  lexicon: οἱ δύο
  rationale: ‘the two’의 지시를 유지하면서도 본문이 바로 뒤에서 인물을 밝혀 주므로 ‘두 사람, 레위와 유다’로 자연스럽게 옮겼습니다.
- source_word: ἐκράτησαν αὐτούς
  english_pob_choice: seized them
  chosen_korean: 그들을 붙잡았습니다
  alternatives_korean:
  - 그들을 붙들었습니다
  - 그들을 사로잡았습니다
  lexicon: κρατέω
  rationale: Pob의 최신 판정처럼 ἐκράτησαν은 ‘held them fast’보다 직접적인 ‘seized’에 가깝고, 한국어에서는 폭력성과 구속감을 함께 담는 ‘붙잡다’가 적절합니다.
