  - severity: medium
    issue: 본문에 [a][b] 각주 표지가 있으나 제공된 각주 내용이 없습니다.
    rationale: 앵커가 가리키는 주석이 없으면 구조적으로 불완전하며 독자에게 근거 없는 주석 참조를 남깁니다. 본문상 필수 각주도 아니므로 표지를 삭제해야 합니다.
  - severity: low
