id: T12P.NAP.5.2
reference: Testament of Naphtali 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: V. Ἐν γὰρ *τῷ τεσσαρακοστῷ ἔτει τῆς¹ ζωῆς μου, εἶδον² *⌈ὄραμα⌉³ ἐν τῷ ὄρει τοῦ Ἐλαιῶνος³ κατὰ ἀνατολὰς Ἱερουσαλήμ, ὅτι⁴ ὁ ἥλιος καὶ ἡ σελήνη ἕστηκαν⁵. 2. Καὶ ἰδοὺ Ἰσαὰκ⁶ ὁ πατὴρ *τοῦ πατρός⁷ μου⁸ ἔλεγεν⁹ ἡμῖν· Προσδραμόντες *κρατήσατε ἕκαστος¹⁰ κατὰ δύναμιν¹¹, Γκαὶ *τοῦ πιάσαντος¹² ἔσται ὁ ἥλιος καὶ ἡ σελήνη˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/002.yaml
  text: V. For in the fortieth year of my life, I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still. 2 And behold, Isaac, the father of my father, said to us, “Run up, and let each of you seize according to his strength; and the one who takes hold shall have the sun and the moon.”
translation:
  language: ko
  text: 5. 내가 마흔 살 되던 해에 예루살렘 동쪽 감람산에서 한 환상을 보았는데, 해와 달이 멈추어 서 있었습니다. 2. 그런데 보십시오, 내 할아버지 이삭, 곧 내 아버지의 아버지가 우리에게 말했습니다. “달려가서 각자 자기 힘에 따라 붙잡으십시오. 붙잡는 사람이 해와 달을 얻게 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄραμα
  english_pob_choice: a vision
  chosen_korean: 환상
  alternatives_korean:
  - 이상
  - 묵시
  - 꿈
  lexicon: ὄραμα
  rationale: 특정한 예언적·시현적 경험을 가리키므로, 문맥상 가장 자연스러운 현대어인 ‘환상’으로 옮겨 시각적 계시의 성격을 살렸습니다.
- source_word: ἔστηκαν
  english_pob_choice: were standing still
  chosen_korean: 멈추어 서 있는 것이었습니다
  alternatives_korean:
  - 서 있었습니다
  - 정지해 있었습니다
  - 멈춰 있었습니다
  lexicon: ἵστημι
  rationale: 해와 달이 ‘서 있는’ 상태를 한국어에서 생생하게 드러내되, 단순 정지보다 서술적 긴장을 살리는 표현으로 조정했습니다.
- source_word: κατὰ δύναμιν
  english_pob_choice: according to his strength
  chosen_korean: 각자 자기 힘에 따라
  alternatives_korean:
  - 각 사람의 힘대로
  - 자기 능력에 따라
  - 힘이 닿는 대로
  lexicon: κατά + δύναμις
  rationale: 그리스어의 분배적 의미를 반영해 ‘각자’와 ‘자기 힘’으로 풀어, 개인별 능력에 맞춘 취득 조건을 분명히 했습니다.
- source_word: κρατήσατε
  english_pob_choice: seize
  chosen_korean: 붙잡아라
  alternatives_korean:
  - 잡아라
  - 붙들어라
  - 취하여라
  lexicon: κρατέω
  rationale: 물리적으로 손으로 움켜쥐는 동작을 가장 직접적으로 전달하면서도, 구어체보다 조금 더 문어적인 명령형으로 맞췄습니다.
theological_decisions:
- issue: 직접화법의 명령문 어조
  chosen_reading: 인용문 안의 명령은 보존하되, 한국어에서는 ‘달려 올라가…붙잡아라’로 간결하게 처리했습니다.
  alternative_readings:
  - ‘달려오너라’처럼 더 강한 호격적 어조
  - ‘달려 올라가서…잡아라’처럼 연결어를 덧붙이는 방식
  rationale: 본문의 생생한 지시를 살리면서도 한국어 독자가 자연스럽게 읽을 수 있는 수준으로 유지했습니다. 이 구절은 예언적 상징 서술이지 교리적 선언이 아니므로, 의미를 과잉 해석하지 않았습니다.
  doctrine_reference: 서사적 환시와 직접화법의 재현
- issue: ‘해와 달을 얻게 될 것이다’의 소유 표현
  chosen_reading: final clause를 ‘해와 달을 얻게 될 것이다’로 옮겨, 그리스어의 소유·획득 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘해와 달이 그의 것이 될 것이다’
  - ‘해와 달을 차지할 것이다’
  rationale: 영어 POB의 revised reading이 과도한 대명사 삽입을 피한 점을 따라, 원문에 없는 소유 대명사를 넣지 않고 취득 결과를 자연스럽게 표현했습니다.
  doctrine_reference: 원문 부합성 및 과잉 보강 회피
