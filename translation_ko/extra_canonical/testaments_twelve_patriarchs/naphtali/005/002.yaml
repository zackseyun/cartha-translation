    rationale: 원문은 ‘그리고 붙잡는 자에게/붙잡는 자는 해와 달을 갖게 될 것이다’라는 접속 서술입니다. ‘붙잡는 사람이’로 이어 원문의 연결을 보존하는 것이 더 정확합니다.
  - severity: low
