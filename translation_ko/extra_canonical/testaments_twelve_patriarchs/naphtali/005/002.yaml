    rationale: 명령의 강도는 유지하되 ‘붙잡으십시오’로 옮기면 전체의 현대 정중체 서술과 조화를 이룹니다.
  revised_text: 5. 내가 마흔 살 되던 해에 예루살렘 동쪽 감람산에서 한 환상을 보았는데, 해와 달이 멈추어 서 있었습니다. 2. 그런데 보십시오, 내 할아버지 이삭, 곧 내 아버지의 아버지가 우리에게 말했습니다. “달려가서 각자 자기 힘에 따라 붙잡으십시오. 붙잡는 사람이 해와 달을 얻게 될 것입니다.”
