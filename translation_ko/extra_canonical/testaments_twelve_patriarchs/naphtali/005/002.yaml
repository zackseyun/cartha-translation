revisions:
- from: V. 내 삶의 마흔째 해에 나는 예루살렘 동쪽 감람산에서 한 환상을 보았는데, 해와 달이 멈추어 서 있는 것이었습니다. 2 그리고 보십시오, 내 아버지의 아버지 이삭이 우리에게 말했습니다. “달려 올라가 각자 자기 힘에 따라 붙잡아라. 그러면 붙잡는 자가 해와 달을 얻게 될 것이다.”[a][b]
  to: 5. 내가 마흔 살 되던 해에 예루살렘 동쪽 감람산에서 한 환상을 보았는데, 해와 달이 멈추어 서 있었습니다. 2. 그런데 보십시오, 내 할아버지 이삭, 곧 내 아버지의 아버지가 우리에게 말했습니다. “달려가서 각자 자기 힘에 따라 붙잡으십시오. 붙잡는 사람이 해와 달을 얻게 될 것입니다.”
  rationale: 내용을 보충하거나 상징을 해석하지 않고, 근거 없는 각주 앵커를 삭제했습니다. 마지막 문장을 조건적 ‘그러면’ 대신 원문의 접속 흐름에 맞게 조정했으며, 직접화법을 현대 합쇼체로 통일했습니다. ‘내 할아버지 이삭’ 뒤에 ‘곧 내 아버지의 아버지’를 덧붙여 πατὴρ τοῦ πατρός μου의 반복적 계보 표현을 빠뜨리지 않았습니다.
  reviewer_model: gpt-5.6-terra
