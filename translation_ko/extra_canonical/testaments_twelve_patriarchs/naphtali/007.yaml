base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007.yaml
  text: '1[a]. I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”


    2. Then my father said to me[b], “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”


    3. And weeping he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, the one who fathered you.”


    4. So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold[c], yet I was afraid of my brothers.'
  footnotes:
  - marker: a
    text: Or, 'in their seasons.' The Greek καιροί can denote fitting or appointed times.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'counts him as being with us' may also be rendered 'numbers him among us' or 'considers him with us.'
    reason: lexical_alternative
  - marker: c
    text: The expression 'I was burning in my inward parts' reflects a visceral Greek idiom for intense inner distress.
    reason: cultural_note
translation:
  language: ko
  text: '1. 나는 이 두 꿈을 아버지께 말씀드렸습니다. 그러자 아버지께서 제게 말씀하셨습니다. “이 일들은 각각 정해진 때에 이루어져야 한다.[a] 이스라엘이 많은 고난을 겪은 뒤에 말이다.”


    2. 그때 아버지께서 제게 말씀하셨습니다.[b] “나는 요셉이 살아 있다고 하나님을 믿는다. 나는 언제나 주께서 그를 우리와 함께 있는 이로 여기시는 것을 본다.”


    3. 아버지께서는 울면서 말씀하셨습니다. “오호라, 내 아들 요셉아, 네가 살아 있구나. 나는 너를 보지 못하고, 너도 너를 낳은 야곱을 보지 못하는구나.”


    4. 그래서 아버지께서는 이 말씀으로 나도 울게 하셨습니다. 그러나 나는 요셉이 팔렸다는 것을 알리고 싶어 속이 타들어 갔습니다.[c] 하지만 나는 형제들이 두려웠습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 때에.’ 그리스어 카이로이(καιροί)는 알맞은 때 또는 정해진 때를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그를 우리와 함께 있는 이로 여기신다’는 말은 ‘그를 우리 가운데 있는 이로 세신다’ 또는 ‘그를 우리와 함께 있다고 여기신다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘속이 타들어 갔습니다’는 강한 내적 고통을 나타내는 그리스어의 신체적 관용 표현을 반영합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνύπνια
  english_pob_choice: dreams
  chosen_korean: 꿈
  alternatives_korean:
  - 비전
  - 몽상
  lexicon: LSJ
  rationale: 일반적인 의미는 ‘꿈’이며, 문맥상 더 격식 있는 ‘비전’으로 옮길 이유가 없습니다.
- source_word: δεῖ ... πληρωθῆναι
  english_pob_choice: must be fulfilled
  chosen_korean: 이루어져야 합니다
  alternatives_korean:
  - 반드시 성취되어야 합니다
  - 반드시 이루어져야 합니다
  lexicon: BDAG
  rationale: δεῖ의 필연성과 πληρωθῆναι의 충만한 성취를 함께 살리되, 한국어에서는 ‘이루어지다’가 가장 자연스럽습니다.
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  english_pob_choice: in their appointed times
  chosen_korean: 각자의 정해진 때에
  alternatives_korean:
  - 그들의 정해진 때에
  - 정해진 시기에
  lexicon: BDAG
  rationale: καιροί는 단순한 시간표가 아니라 알맞게 정해진 때를 뜻하므로, ‘각자의 정해진 때’로 옮겨 그 뉘앙스를 살렸습니다.
- source_word: ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  english_pob_choice: counts him as being with us
  chosen_korean: 그를 우리와 함께 있는 사람으로 헤아리시는
  alternatives_korean:
  - 그를 우리 가운데 한 사람으로 세우시는
  - 그를 우리와 함께 있는 자로 셈하시는
  lexicon: LSJ
  rationale: ἀριθμεῖ는 단순한 ‘세다’보다 ‘헤아리다/계수하다’에 가깝고, μεθ’ ἡμῶν은 공동체적 동반을 시사하므로 이를 함께 드러냈습니다.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις
  english_pob_choice: I was burning in my inward parts
  chosen_korean: 마음속에서 끓어오르며
  alternatives_korean:
  - 속이 타들어 가며
  - 내장 속이 불타듯하며
  lexicon: BDAG
  rationale: σπλάγχνα의 비유적·체감적 강도를 살리면서도 한국어에서 과도하게 신체적으로 들리지 않게 조정했습니다.
- source_word: πέπραται
  english_pob_choice: had been sold
  chosen_korean: 팔려 갔다는
  alternatives_korean:
  - 팔렸다는
  - 팔린
  lexicon: BDAG
  rationale: 문맥상 요셉의 매매 사건을 가리키므로 ‘팔려 갔다’가 가장 직접적이고 서술 흐름에도 맞습니다.
theological_decisions:
- issue: 기다림과 성취의 표현
  chosen_reading: 이 일들은 각자의 정해진 때에 이루어져야 합니다
  alternative_readings:
  - 이 일들은 그들의 때에 이루어져야 합니다
  - 이 일들은 각 시기에 성취되어야 합니다
  rationale: 꿈의 해석과 예언적 필연성을 함께 살리면서도, 본문이 말하는 섭리적 ‘정해진 때’를 과도하게 교리화하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
- issue: 하나님이 요셉을 '우리와 함께' 헤아리신다는 표현
  chosen_reading: 주께서 그를 우리와 함께 있는 사람으로 헤아리시는
  alternative_readings:
  - 주께서 그를 우리 가운데 شمار하시는
  - 주께서 그를 우리와 함께 있다고 여기시는
  rationale: 원문의 모호성을 지우지 않으면서, 요셉이 여전히 가족 공동체 안에 속해 있다는 야곱의 확신을 드러냈습니다.
  doctrine_reference: DOCTRINE.md § Translation philosophy 3
