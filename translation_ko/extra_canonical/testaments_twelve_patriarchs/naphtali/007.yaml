    rationale: ὅτι절은 πιστεύω의 내용이며, 요셉이 살아 있다는 사실이 하나님을 믿는 이유라고 단정하지 않습니다.
  - severity: medium
    issue: 1절의 ‘이스라엘이 많은 것을 견뎌낸 뒤’
    rationale: ὑπομένω의 목적어 없는 용법은 고난을 견딤을 뜻하며, ‘많은 것을’은 한국어에서 부자연스럽고 고난의 함의를 약화합니다.
  - severity: low
    issue: 각주 표지 [a][b][c]가 4절 끝에 일괄 배치됨
    rationale: 각 표지가 가리키는 원어 어구를 식별할 수 있도록 해당 표현 직후에 배치해야 합니다.
