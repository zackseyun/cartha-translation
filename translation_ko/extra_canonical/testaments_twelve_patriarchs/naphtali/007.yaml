revisions:
- from: '1. 나는 이 두 꿈을 아버지께 말씀드렸습니다. 그러자 아버지는 저에게 말씀하셨습니다. 「이 일들은 각자의 정해진 때에 이루어져야 합니다. 이스라엘이 많은 것을 견뎌낸 뒤에 말입니다.」


    2. 그때 아버지께서 저에게 말씀하셨습니다. 「나는 하나님을 믿는다. 요셉이 살아 있기 때문이다. 나는 늘 주께서 그를 우리와 함께 있는 사람으로 헤아리시는 것을 본다.」


    3. 그리고 아버지는 울면서 말씀하셨습니다. 「아, 내 아들 요셉아, 네가 살아 있구나. 그러나 나는 너를 보지 못하는구나. 너도 너를 낳은 야곱을 보지 못하는구나.」


    4. 그러므로 아버지는 이 말씀들로 나까지 울게 하셨습니다. 그러나 나는 마음속에서 끓어오르며 요셉이 팔려 갔다는 것을 알리고 싶었습니다. 그러나 형제들이 두려웠습니다.[a][b][c]'
  to: '1. 나는 이 두 꿈을 아버지께 말씀드렸습니다. 그러자 아버지께서 제게 말씀하셨습니다. “이 일들은 각각 정해진 때에 이루어져야 한다.[a] 이스라엘이 많은 고난을 겪은 뒤에 말이다.”


    2. 그때 아버지께서 제게 말씀하셨습니다.[b] “나는 요셉이 살아 있다고 하나님을 믿는다. 나는 언제나 주께서 그를 우리와 함께 있는 이로 여기시는 것을 본다.”


    3. 아버지께서는 울면서 말씀하셨습니다. “오호라, 내 아들 요셉아, 네가 살아 있구나. 나는 너를 보지 못하고, 너도 너를 낳은 야곱을 보지 못하는구나.”


    4. 그래서 아버지께서는 이 말씀으로 나도 울게 하셨습니다. 그러나 나는 요셉이 팔렸다는 것을 알리고 싶어 속이 타들어 갔습니다.[c] 하지만 나는 형제들이 두려웠습니다.'
  rationale: 2절의 문장 구조를 원문대로 바로잡고, 1절의 고난을 견딘다는 뜻과 4절의 내장에 타오르는 듯한 고통의 관용을 자연스러운 현대 한국어로 보존했습니다. 모호성이 있는 ‘우리와 함께’와 ‘헤아리다’의 비유는 각주에서 대안을 제시하되 본문에서 교리적으로 확대하지 않았습니다.
