  source_fidelity: 2절의 πιστεύω τῷ θεῷ ὅτι ζῇ Ἰωσήφ은 ‘요셉이 살아 있다고 하나님을 믿습니다/신뢰합니다’라는 뜻입니다. 초안은 이를 ‘나는 하나님을 믿는다. 요셉이 살아 있기 때문이다’로 나누어 인과관계를 바꾸었습니다. 또한 1절의 ὑπομείναντος는 이스라엘이 ‘많은 것을’ 견딘다는 표현보다 ‘많은 고난을 겪은 뒤’가 자연스럽고 의미가 분명합니다.
  naturalness: 합쇼체의 서술과 인용문은 전반적으로 자연스럽지만, ‘그를 우리와 함께 있는 사람으로 헤아리시는 것을 본다’는 한국어에서 다소 무겁습니다. 원문의 비유를 보존하여 ‘그를 우리와 함께 있는 이로 여기시는 것을’으로 옮기면 더 자연스럽습니다. 4절의 σπλάγχνα는 ‘마음속’보다 ‘속’으로 옮겨 신체적·정서적 관용을 더 잘 살릴 수 있습니다.
  terminology: ‘주’, ‘하나님’, ‘요셉’, ‘야곱’은 일관되고 적절합니다. ‘아, 내 아들’은 Οἴμοι의 애가조를 충분히 드러내지 못하므로 ‘오호라’로 조정했습니다. 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
