base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006.yaml
  text: 'And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him. And behold, a ship came sailing by us, with sailors and pilots. And written on the ship was this: “The Ship of Jacob.”


    And our father said to us, “Come, let us go up into our ship.” And when we had entered, a violent storm arose, and a whirlwind of wind; and our father was separated from us, holding the rudders[b]. And we, being storm-tossed upon the sea, were driven along over the waters, while the ship was filled and battered by the waves, so that it was about to be broken up.


    But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together. And we were scattered, all of us, to the ends of the earth[c]. But Levi, clothed in sackcloth, prayed to the Lord. And when the storm ceased, the ship reached the land as though in peace. And behold, our father came, and we all rejoiced with one accord.'
  footnotes:
  - marker: a
    text: The place-name 'Amnia' is uncertain in identification; the translation preserves the Greek form rather than conjecturing a location.
    reason: cultural_note
  - marker: b
    text: The Greek phrase rendered 'holding the rudders' is textually difficult; the underlying word literally means 'necks' in ordinary usage, but the context appears nautical.
    reason: textual_variant
  - marker: c
    text: The scattering 'to the ends of the earth' likely carries symbolic force for dispersion, though the text presents it as part of Naphtali's dream.
    reason: cross_reference
translation:
  language: ko
  text: '그리고 다시 칠 일 뒤에, 나는 내 아버지 야곱이 암네이아 바다[a]에 서 계시고 우리도 그와 함께 있는 것을 보았습니다.


    그런데 뱃사람들과 조타수들 없이 배 한 척이 항해하여 오고 있었습니다. 그 배에는 “야곱의 배”라고 적혀 있었습니다.


    우리 아버지께서 우리에게 말씀하셨습니다. “오십시오, 우리 배에 올라갑시다.” 우리가 배에 들어가자 거센 폭풍이 일어나고 큰 바람의 회오리가 일어났습니다. 그러자 우리 아버지는 키를 붙드신 채 우리에게서 떨어져 나가셨습니다[b]. 우리는 폭풍에 시달리며 바다 위를 떠밀려 갔고, 배는 물이 가득 차 큰 물결에 거세게 부딪혀 부서질 지경이었습니다.


    그러나 요셉은 작은 배를 타고 떠났고, 우리는 아홉 장의 널빤지 위에 나뉘어 있었습니다. 레위와 유다는 함께 있었습니다. 우리는 모두 땅 끝까지 흩어졌습니다[c]. 레위는 굵은 베옷을 입고 주님께 간구했습니다. 폭풍이 그치자 배는 마치 평안한 가운데 있는 듯 육지에 닿았습니다. 그런데 우리 아버지께서 오셨고, 우리 모두는 한마음으로 크게 기뻐했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘암네이아’는 정확한 위치를 확인하기 어려운 지명입니다. 번역은 추정하여 지명을 특정하지 않고 그리스어 형태를 음역합니다.
    reason: cultural_note
  - marker: b
    text: 그리스어는 통상 ‘목들’을 뜻하는 난해한 말을 사용합니다. 항해 문맥에서는 조타 장치와 관련된 말로 이해될 수 있어 본문에서는 ‘키’로 옮겼습니다.
    reason: textual_variant
  - marker: c
    text: ‘땅 끝까지’ 흩어졌다는 표현은 흩어짐을 상징적으로 암시할 수 있으나, 본문은 이를 납달리의 꿈 안에서 일어난 일로 서술합니다.
    reason: cross_reference
lexical_decisions:
- source_word: θάλασσα Ἀμνείας
  english_pob_choice: sea of Amnia
  chosen_korean: 암네아스 바다
  alternatives_korean:
  - 암니아 바다
  - 암네아스의 바다
  lexicon: LSJ
  rationale: 지명은 불확실하므로 의미를 풀지 않고 그리스어 형태를 음역해 보존했습니다.
- source_word: ἁρμενίζον
  english_pob_choice: came sailing
  chosen_korean: 항해해 오고
  alternatives_korean:
  - 돛을 올린 채 오고
  - 배를 타고 오고
  lexicon: LSJ
  rationale: 항해하는 장면의 동작감을 살리되, 한국어에서 너무 직역투가 되지 않도록 했습니다.
- source_word: κυβερνητῶν
  english_pob_choice: pilots
  chosen_korean: 선장들
  alternatives_korean:
  - 키잡이들
  - 조타수들
  lexicon: LSJ
  rationale: 뱃사람들과 짝을 이루는 해상 직역을 살리기 위해 ‘선장들’로 옮겼고, 전형적 해상 인물을 함께 부각했습니다.
- source_word: τοὺς αὐχένας
  english_pob_choice: the rudders
  chosen_korean: 키를 붙들고 있었습니다
  alternatives_korean:
  - 키들을 붙들고 있었습니다
  - 조타 장치를 붙들고 있었습니다
  lexicon: LSJ
  rationale: 문자적으로는 ‘목들’이지만 문맥상 조타 장치로 읽는 난점을 반영하여, 본문의 항해 장면에 맞는 한국어로 옮겼습니다.
- source_word: σάκκον
  english_pob_choice: sackcloth
  chosen_korean: 굵은 베옷
  alternatives_korean:
  - 베옷
  - 거친 베옷
  lexicon: LSJ
  rationale: 회개의 표지로서의 뉘앙스를 살리면서 한국어에서 자연스러운 전통적 표현을 택했습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주(主)
  rationale: 본문은 그리스어 Κυρίου를 사용하므로, 예수 호칭이 아니라 일반적인 경외의 호칭으로서 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: κύριος → Lord'
- issue: 흩어짐의 상징성
  chosen_reading: 꿈 서술로 그대로 옮기고, 민족적 추방 해석은 본문 밖으로 미루었습니다.
  alternative_readings:
  - 이스라엘 열두 지파의 추방을 명시적으로 풀이
  - 단순한 가족 항해 사고로 완화
  rationale: 그리스어는 상징을 암시하지만 서술 자체를 말하고 있으므로, 번역이 과잉해석을 덧붙이지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
