  lexicon: LSJ
  rationale: 예언적·묵시적 장면에서 단순한 시각 경험보다 계시적 환상을 드러내는 한국어로 옮겼습니다.
- source_word: ἕστηκαν
  english_pob_choice: were standing still
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 멈춰 서 있었습니다
  - 정지해 있었습니다
  lexicon: LSJ
  rationale: 해와 달의 정지 상태를 자연스러운 한국어로 전달하되, 과도한 해설은 피했습니다.
- source_word: κρατήσατε / κατέλαβεν
  english_pob_choice: seize / took hold of
  chosen_korean: 붙잡다
  alternatives_korean:
  - 잡다
  - 움켜쥐다
  - 붙들다
  lexicon: LSJ
  rationale: 본문 전반의 경쟁적·상징적 ‘붙잡음’을 한국어에서 가장 안정적으로 살리기 위해 ‘붙잡다’를 일관되게 사용했습니다.
- source_word: βαΐα φοινίκων
  english_pob_choice: palm branches
  chosen_korean: 종려나무 가지
  alternatives_korean:
  - 야자 가지
  - 종려 가지
  lexicon: LSJ
  rationale: 가지를 가리키는 구체성을 유지하면서도 한국어 성경어법에 맞는 자연스러운 표현을 택했습니다.
- source_word: ἀκτῖνες
  english_pob_choice: rays
  chosen_korean: 광선
  alternatives_korean:
  - 빛줄기
  - 빛살
  lexicon: LSJ
  rationale: 태양·달 상징과 연결되는 시각적 이미지를 분명히 드러내는 말로 옮겼습니다.
- source_word: ταῦρος
  english_pob_choice: bull
  chosen_korean: 수소
  alternatives_korean:
  - 황소
  - 소
  lexicon: LSJ
  rationale: 상징적 위세를 보존하면서도 한국어에서 자연스럽고 남성적 성격이 드러나는 기본명사로 처리했습니다.
theological_decisions:
- issue: ἄχρις οὗ ἔλθῃ τὸ σπλάγχνον Κυρίου의 메시아적 지시를 본문에서 얼마나 드러낼 것인지
  chosen_reading: 직역에 가깝게 ‘주님의 긍휼’이나 해석을 덧붙이지 않고, 뒤의 인물 묘사를 그대로 유지했습니다.
  alternative_readings:
  - 메시아가 올 때까지
  - 주님의 자비가 올 때까지
  rationale: 본문이 여기서는 상징적 인물의 묘사만 제시하므로, 해석을 미리 본문에 넣지 않는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 묵시문학의 점진적 계시 원리
- issue: γραφὴ ἁγία의 교회적 정전 뉘앙스
  chosen_reading: ‘거룩한 기록’으로 옮겨, 특정 정경 용어로 고정하지 않았습니다.
  alternative_readings:
  - 거룩한 성경
  - 성스러운 글
  rationale: 전승된 그리스어가 부정관사와 함께 사용한 표현이므로, 후대의 정경 개념을 과도하게 앞당기지 않도록 했습니다.
  doctrine_reference: 정전 형성 전 문헌에 대한 번역 원칙
