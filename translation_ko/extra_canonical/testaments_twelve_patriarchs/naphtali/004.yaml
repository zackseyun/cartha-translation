revisions:
- from: 이런 것들을 내가 너희에게 말합니다, 내 자녀들아. 내가 에녹의 글에서 배웠기 때문입니다. 너희도 반드시 주님에게서 떠나, 이방 민족들의 모든 불법을 따라가며 소돔의 모든 악을 행하게 될 것입니다. 주님께서 너희에게 포로 됨을 가져오시면, 너희는 거기서 너희의 원수들을 섬기게 될 것이며, 모든 고통과 환난 가운데 함께 지내다가, 주님께서 너희 모두를 멸하실 때까지 그러할 것입니다.[a]
  to: '내 자녀들아, 내가 너희에게 이런 것들을 말합니다. 내가 에녹의 글에서 배웠기 때문입니다. 너희도 반드시 주님을 떠나 이방 민족들의 온갖 불법을 따라 행하며, 소돔의 온갖 악을 행하게 될 것입니다.


    주님께서 너희에게 포로 생활을 겪게 하실 것이며, 너희는 거기서 너희 원수들을 섬기고 온갖 고난과 환난을 겪게 될 것입니다. 주님께서 너희 모두를 멸하실 때까지 그리할 것입니다.'
  rationale: 제시된 그리스어 4장 1–2절에 한정하여 번역을 수정했습니다. 미래 예언의 문법을 보존하고, ‘글’이라는 비정경적·비단정적 표현을 유지했으며, 난해한 συναναστραφήσεσθε에는 특정한 교리적·역사적 해석을 덧붙이지 않았습니다. 대응 주석이 없는 [a] 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문은 나프탈리의 유언 4장 1–2절까지만 제시하는데, 한국어 초안도 이 범위를 따릅니다. 다만 ἐπάξει의 미래 직설법을 조건절 ‘가져오시면’으로 바꾼 점, κατὰ의 ‘따라’를 다소 부자연스럽게 처리한 점, αἰχμαλωσία와 θλίψις의 표현이 어색한 점을 바로잡아야 합니다. συναναστραφήσεσθε는 본문 전승상 난해하지만 여기서는 ‘고난과 환난을 겪다’ 정도로 절제하여 옮기는 것이 안전합니다.
  naturalness: 합쇼체는 대체로 유지되었으나 ‘주님에게서 떠나’, ‘포로 됨을 가져오시면’, ‘모든 고통과 환난 가운데 함께 지내다가’는 현대 표준 한국어의 예언·권면 문체로 매끄럽지 않습니다. ‘주님을 떠나’, ‘포로 생활을 겪게 하실 것이며’, ‘온갖 고난과 환난을 겪게 될 것입니다’로 고치면 자연스럽습니다.
  terminology: ‘에녹의 글’, ‘불법’, ‘소돔의 모든 악’, ‘원수들을 섬기다’는 원문의 어휘 범위와 신학적 비단정을 잘 보존합니다. 다만 αἰχμαλωσία는 ‘포로 됨’보다 ‘포로 생활’이 자연스럽고, ‘모든 불법’은 한국어에서는 ‘온갖 불법’이 더 자연스럽습니다.
  issues:
  - severity: medium
    issue: 미래 직설법을 조건절로 옮김
    rationale: καὶ ἐπάξει Κύριος는 ‘주님께서 ... 가져오실/겪게 하실 것입니다’라는 미래 진술입니다. ‘가져오시면’은 원문에 없는 조건 관계를 만듭니다.
  - severity: medium
    issue: 고난 구문의 한국어 및 난해한 원문 처리
    rationale: πάσῃ κακώσει καὶ θλίψει συναναστραφήσεσθε를 ‘모든 고통과 환난 가운데 함께 지내다가’로 옮기면 ‘함께’의 대상이 불분명합니다. 원문의 난해성을 과도하게 해석하지 않으면서 ‘온갖 고난과 환난을 겪게 될 것’으로 옮기는 편이 자연스럽습니다.
  - severity: low
    issue: 근거 없는 각주 표지 [a]
    rationale: 번역문에 [a]가 있으나 제공된 translation_notes 및 각주 세트에는 이에 대응하는 주석이 없습니다. 본문 의미를 보태지 않는 표지이므로 제거해야 합니다.
