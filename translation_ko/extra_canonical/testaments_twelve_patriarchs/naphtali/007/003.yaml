id: T12P.NAP.7.3
reference: Testament of Naphtali 7:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Καὶ κλαίων ἔλεγε¹⁵· *Οἴμοι, τέκνον μου Ἰωσήφ, ζῇς¹⁶, καὶ *οὐ βλέπω σε¹⁷, *καὶ σὺ οὐχ¹⁸ ὁρᾷς Ἰακὼβ τὸν γεννήσαντά σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/003.yaml
  text: And weeping, he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, who fathered you.”
translation:
  language: ko
  text: 그리고 울면서 말했습니다. “아, 내 아이 요셉아, 네가 살아 있구나. 그런데 나는 너를 보지 못하고, 너도 네 아버지 야곱을 보지 못하는구나.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ κλαίων ἔλεγε
  english_pob_choice: And weeping, he said
  chosen_korean: 그리고 울면서 말했습니다
  alternatives_korean:
  - 그리고 우는 중에 말했습니다
  - 그리고 눈물을 흘리며 말했습니다
  lexicon: κλαίων, λέγω
  rationale: 분사 κλαίων을 자연스러운 서술로 풀어 ‘울면서’로 옮겨, 영어 POB의 participial opener를 한국어 문맥에 맞게 반영했습니다.
- source_word: Οἴμοι
  english_pob_choice: Alas
  chosen_korean: 아
  alternatives_korean:
  - 아이고
  - 슬프도다
  lexicon: οἴμοι
  rationale: 탄식어의 강도를 살리되 과도하게 고어화하지 않도록 짧은 감탄사 ‘아’로 옮겼습니다.
- source_word: τέκνον μου Ἰωσήφ
  english_pob_choice: my child Joseph
  chosen_korean: 내 아이 요셉아
  alternatives_korean:
  - 내 자녀 요셉아
  - 내 아들 요셉아
  lexicon: τέκνον μου
  rationale: τέκνον은 관계와 애정을 드러내는 호칭이므로 성별을 덧붙이기보다 애칭적 호소인 ‘내 아이’가 원문에 더 가깝습니다.
- source_word: τὸν γεννήσαντά σε
  english_pob_choice: who fathered you
  chosen_korean: 네 아버지 야곱
  alternatives_korean:
  - 너를 낳은 야곱
  - 너를 낳으신 야곱
  lexicon: γεννάω
  rationale: 문맥상 ‘생물학적 부친’이 아니라 야곱을 가리키는 관계적 호칭이므로, 영어 POB의 ‘who fathered you’를 한국어에서는 직역보다 호칭 구조로 자연화했습니다.
theological_decisions:
- issue: 재탄식의 직접화법에서 인물 호칭의 정서
  chosen_reading: ‘내 아이 요셉아’로 옮겨 애정과 상실의 정서를 드러냈습니다.
  alternative_readings:
  - ‘내 아들 요셉아’처럼 혈연 관계를 전면화하는 번역
  - ‘내 자녀 요셉아’처럼 더 중립적인 번역
  rationale: 원문 τέκνον μου는 단순한 생물학적 분류보다 친밀한 호소를 담고 있어, 한국어에서도 정서적 호칭을 보존하는 것이 더 충실합니다.
  doctrine_reference: 문맥적 호칭의 어조 보존
