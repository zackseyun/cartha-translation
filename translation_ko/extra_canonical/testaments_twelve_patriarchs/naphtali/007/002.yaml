  naturalness: ‘우리와 함께 있는 사람으로 여기고 계심을 보기’는 다소 장황하고, 인용문 끝의 마침표·닫는 인용부호·각주 표지가 비정상적으로 결합되어 있습니다. ‘우리와 함께 있는 이로 여기시는 것을 보기 때문입니다’가 현대 표준어 합쇼체에서 더 자연스럽습니다.
