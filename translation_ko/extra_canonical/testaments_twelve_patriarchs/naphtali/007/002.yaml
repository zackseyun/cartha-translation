  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Τότε⁸ λέγει μοι ὁ πατήρ μου· Πιστεύω⁹ *τῷ θεῷ¹⁰ ὅτι ζῇ¹¹ Ἰωσήφ¹²· ὁρῶ γὰρ ⌜πάντοτε⌝¹³ ὅτι Κύριος ἀριθμεῖ¹⁴ αὐτὸν μεθʼ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/002.yaml
  text: Then my father said to me, “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”
translation:
  language: ko
  text: 그때에 아버지께서 저에게 말씀하셨습니다. 「나는 하나님께서 요셉이 살아 있다고 믿습니다. 왜냐하면 나는 늘 주께서 그를 우리와 함께 있는 사람으로 여기고 계심을 보기 때문입니다」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιστεύω τῷ θεῷ ὅτι ζῇ Ἰωσήφ
  english_pob_choice: I believe God that Joseph is alive
  chosen_korean: 「나는 하나님께서 요셉이 살아 있다고 믿습니다」
  alternatives_korean:
  - 「나는 하나님을 믿습니다. 요셉이 살아 있습니다」
  - 「나는 하나님께 요셉이 살아 있다고 믿습니다」
  lexicon: Πιστεύω + dative τῷ θεῷ
  rationale: 그리스어는 ‘하나님을 믿다’라기보다 하나님께 대한 신뢰를 전제하며 내용절을 이끕니다. 한국어에서는 이 구조를 자연스럽게 살려 ‘하나님께서 … 믿습니다’로 옮겨, 단순 목적어화보다 진술 내용을 분명히 했습니다.
- source_word: ὁρῶ γὰρ ⌜πάντοτε⌝
  english_pob_choice: for I always see
  chosen_korean: 왜냐하면 나는 늘
  alternatives_korean:
  - 왜냐하면 나는 항상
  - 내가 언제나 보기 때문입니다
  lexicon: πάντοτε
  rationale: πάντοτε는 ‘늘/항상’의 반복·지속성을 나타내므로, 문맥에 맞는 평이한 ‘늘’을 채택했습니다.
- source_word: Κύριος ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  english_pob_choice: the Lord counts him as being with us
  chosen_korean: 주께서 그를 우리와 함께 있는 사람으로 여기고 계심
  alternatives_korean:
  - 주께서 그를 우리와 함께 있다고 세고 계심
  - 주께서 그를 우리 가운데 하나로 세고 계심
  lexicon: ἀριθμεῖ
  rationale: ἀριθμεῖ는 단순한 산술이 아니라 ‘헤아리다/여기다/계수하다’의 의미를 띠므로, 영어 POB의 의도를 따라 관계적 판정인 ‘여기다’로 옮겼습니다.
theological_decisions:
- issue: 주(κύριος)와 야훼 호칭의 처리
  chosen_reading: 여기서는 서사적 인용문 안의 κύριος를 ‘주’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 본문은 고대 문헌의 인용으로, 별도 LXX 야훼 인용 표지가 없고 인용 내부의 호칭은 일반적인 ‘주’가 가장 직접적입니다.
  doctrine_reference: 호칭 일관성 및 인용문 내부 표기 원칙
