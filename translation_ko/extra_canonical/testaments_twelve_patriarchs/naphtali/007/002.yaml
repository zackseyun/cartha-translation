  to: 그때 아버지께서 제게 말씀하셨습니다. “나는 하나님께서 요셉이 살아 있다고 하심을 믿습니다. 내가 언제나 주께서 그를 우리와 함께 있는 이로 여기시는 것을 보기 때문입니다.”
  rationale: 화자가 하나님께서 말씀하신 내용을 믿는다는 원문의 구문을 ‘하나님께서 … 하심을 믿습니다’로 명시하여 의미 역전을 피했습니다. πάντοτε는 ‘언제나’로, ἀριθμεῖ는 관계적 판정의 뜻을 살린 ‘함께 있는 이로 여기시다’로 옮겼습니다. 근거 없이 남아 있던 [a] 앵커를 제거하고 인용부호 및 문장부호를 정리했습니다.
