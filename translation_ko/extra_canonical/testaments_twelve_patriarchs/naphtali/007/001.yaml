- from: 나는 이 두 꿈을 내 아버지에게 말했습니다. 그러자 그가 저에게 말했습니다. 「이 일들은 제때에 이루어져야 합니다 — 이스라엘이 많은 것을 견딘 뒤에 말입니다.」
