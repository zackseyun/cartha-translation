source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VII. Ταῦτα¹ τὰ δύο ἐνύπνια εἶπον² τῷ πατρί μου³ καὶ⁴ εἶπέ μοι· Δεῖ *ταῦτα πληρωθῆναι⁵ κατὰ *τοὺς καιροὺς⁶ αὐτῶν, *πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/001.yaml
  text: I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”
translation:
  language: ko
  text: 나는 이 두 꿈을 내 아버지에게 말했습니다. 그러자 그가 저에게 말했습니다. 「이 일들은 제때에 이루어져야 합니다 — 이스라엘이 많은 것을 견딘 뒤에 말입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα τὰ δύο ἐνύπνια
  english_pob_choice: these two dreams
  chosen_korean: 이 두 꿈
  alternatives_korean:
  - 이 두 가지 꿈
  - 이 두 개의 꿈
  lexicon: ἐνύπνιον
  rationale: 복수 개념을 자연스럽게 살리면서도 현대 한국어에서 가장 간결하고 직접적인 표현을 택했습니다.
- source_word: Δεῖ … πληρωθῆναι
  english_pob_choice: must be fulfilled
  chosen_korean: 이루어져야 합니다
  alternatives_korean:
  - 성취되어야 합니다
  - 응하여야 합니다
  lexicon: δεῖ / πληρόω
  rationale: 필연성과 성취의 뜻을 모두 담되, 예언적 ‘성취’의 뉘앙스를 한국어에서 너무 종교어적으로 굳히지 않기 위해 ‘이루어지다’를 사용했습니다.
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  english_pob_choice: in their appointed times
  chosen_korean: 제때에
  alternatives_korean:
  - 정해진 때에
  - 그 정한 때에
  lexicon: καιρός
  rationale: ‘appointed times’의 지정된 때라는 뜻을 살리면서도 문장을 유려하게 하기 위해 간결한 ‘제때에’로 옮겼습니다.
- source_word: πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος
  english_pob_choice: after Israel has endured much
  chosen_korean: 이스라엘이 많은 것을 견딘 뒤에
  alternatives_korean:
  - 이스라엘이 많은 고난을 견딘 뒤에
  - 이스라엘이 많은 일을 참은 뒤에
  lexicon: ὑπομένω
  rationale: ὑπομένω의 ‘견디다/참다’ 의미를 보존하면서, αντικείμενον 없이도 가능한 ‘많은 것을 견딘’ 구조로 원문의 압축성을 반영했습니다.
theological_decisions:
- issue: 예언 성취 문구의 표현 수위
  chosen_reading: ‘이루어져야 합니다’로 예언의 필연성과 성취를 함께 드러냈습니다.
  alternative_readings:
  - ‘성취되어야 합니다’
  - ‘반드시 이루어져야 합니다’
  rationale: 본문의 δεῖ가 나타내는 필연성을 약화하지 않으면서도, 독자에게 너무 해석적인 어조를 덧씌우지 않기 위해 절제된 필연 표현을 선택했습니다.
  doctrine_reference: 예언 성취와 섭리의 언어
