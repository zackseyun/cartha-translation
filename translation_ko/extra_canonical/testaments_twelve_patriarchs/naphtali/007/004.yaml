base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/004.yaml
  text: So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold, yet I was afraid of my brothers.
translation:
  language: ko
  text: 그러므로 그 말들로 그도 나를 울게 하였습니다. 그러나 나는 요셉이 팔렸다는 것을 그에게 알리고 싶어 내 속이 타들어 갔지만, 형제들이 두려웠습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐποίησε ... δακρῦσαι ἐν τοῖς λόγοις τούτοις
  english_pob_choice: he made me weep also ... by these words
  chosen_korean: 그 말들로 그도 나를 울게 하였습니다
  alternatives_korean:
  - 그 말들 때문에 그도 나를 울렸습니다
  - 그는 이 말들로 나도 눈물 흘리게 했습니다
  lexicon: δακρῦσαι
  rationale: 원문의 인과 관계를 살리면서 한국어에서 자연스러운 ‘울게 하다’로 옮겼습니다.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις μου
  english_pob_choice: I was burning in my inward parts
  chosen_korean: 내 속이 타들어 갔지만
  alternatives_korean:
  - 내 창자들이 타는 듯했습니다
  - 내 심중이 불타고 있었습니다
  lexicon: σπλάγχνα
  rationale: σπλάγχνα의 내장/깊은 속이라는 감각을 직설적으로 전달하되, 현대 한국어에서 읽히는 강한 내적 격정을 ‘타들어 가다’로 표현했습니다.
- source_word: ἀναγγεῖλαι ὅτι πέπραται Ἰωσήφ
  english_pob_choice: to tell him that Joseph had been sold
  chosen_korean: 요셉이 팔렸다는 것을 그에게 알리고 싶어
  alternatives_korean:
  - 요셉이 팔려 갔다는 사실을 말하고 싶어
  - 요셉이 팔린 일을 그에게 알리고자
  lexicon: ἀναγγέλλω / πέπραται
  rationale: πέπραται의 완료형 결과를 살려 ‘팔렸다는 것’을 사용했고, ἀναγγέλλω는 ‘알리다’로 직역성이 높은 표현을 택했습니다.
- source_word: τοὺς ἀδελφούς μου
  english_pob_choice: my brothers
  chosen_korean: 형제들이
  alternatives_korean:
  - 내 형제들이
  - 형제들을
  lexicon: ἀδελφοί
  rationale: 문맥상 화자가 두려워한 대상이므로 목적어로 자연스럽게 풀어 ‘형제들이 두려웠습니다’로 옮겼습니다.
theological_decisions:
- issue: 화자의 내적 고통을 나타내는 표현
  chosen_reading: ‘내 속이 타들어 갔지만’으로 신체적·정서적 긴장을 함께 드러냈습니다.
  alternative_readings:
  - ‘내 창자가 불탔습니다’처럼 더 직역하는 방식
  - ‘몹시 알리고 싶었습니다’로 완화하는 방식
  rationale: 원문은 단순한 감정이 아니라 몸 안에서 일어나는 강한 내적 격정을 말하므로, 과도한 완화 없이 한국어 관용을 이용해 그 긴장을 보존했습니다.
  doctrine_reference: source_semantics
