revisions:
- from: 너희에게는 다른 몫이 주어진 것이 아닙니다. 다만 땅의 비옥함이 곡식의 수고로 말미암아 주어졌습니다.[a]
  to: 너희에게는 열매를 위한 수고 가운데 있는 땅의 비옥함 외에는 다른 몫이 주어지지 않았습니다.
  rationale: The revision preserves the negated “other portion … except” construction, retains the broad sense of καρποί, and renders the compact, somewhat elliptical relation expressed by ἐν πόνοις καρπῶν without recasting it as a causal claim. The unsupported note anchor is removed.
  reviewer_model: gpt-5.6-terra
