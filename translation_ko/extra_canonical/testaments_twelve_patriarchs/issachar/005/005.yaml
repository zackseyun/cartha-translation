  text: For no other portion has been given to you except the richness of the earth by the labor of fruits.
translation:
  language: ko
  text: 너희에게는 다른 몫이 주어진 것이 아닙니다. 다만 땅의 비옥함이 곡식의 수고로 말미암아 주어졌습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλη μερὶς
  english_pob_choice: no other portion
  chosen_korean: 다른 몫
  alternatives_korean:
  - 다른 분깃
  - 다른 몫의 몫
  lexicon: μερὶς
  rationale: μερὶς는 분배된 몫, 몫/분깃의 뜻이므로 문맥상 간결하고 자연스러운 ‘몫’으로 옮겼습니다.
- source_word: δέδοται ὑμῖν
  english_pob_choice: has been given to you
  chosen_korean: 주어진 것이 아닙니다
  alternatives_korean:
  - 주어졌습니다
  - 주신 것이 아닙니다
  lexicon: δίδωμι
  rationale: 완료 수동의 결과 상태를 살려 ‘주어진’으로 옮기되, 대조 구조를 살리기 위해 부정문 전체를 자연스럽게 구성했습니다.
- source_word: τῆς πιότητος τῆς γῆς
  english_pob_choice: the richness of the earth
  chosen_korean: 땅의 비옥함
  alternatives_korean:
  - 땅의 기름짐
  - 땅의 풍성함
  lexicon: πιότης
  rationale: πιότης는 ‘기름짐, 비옥함, 풍성한 상태’의 뜻이므로 농경 문맥에 맞게 ‘비옥함’으로 번역했습니다.
- source_word: ἐν πόνοις καρπῶν
  english_pob_choice: by the labor of fruits
  chosen_korean: 곡식의 수고로 말미암아
  alternatives_korean:
  - 열매의 수고로
  - 곡식의 노동으로
  lexicon: πόνος
  rationale: πόνοις는 ‘수고, 고역, 노동’의 의미이므로 이를 드러내고, καρπῶν은 농경 문맥에서 자연스러운 ‘곡식’으로 옮겼습니다.
theological_decisions:
- issue: “열매”와 농경 문맥의 구체성
  chosen_reading: καρπῶν을 일반적인 ‘열매’보다 농경적 의미가 살아 있는 ‘곡식’으로 옮겼습니다.
  alternative_readings:
  - 열매
  - 산물
  rationale: 문맥이 땅의 비옥함과 노동의 결실을 말하므로, 독자가 농경적 대조를 즉시 이해하도록 구체성을 살렸습니다.
  doctrine_reference: 문맥적 의미 우선의 번역 원칙
