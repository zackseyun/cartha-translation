  text: For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now.
translation:
  language: ko
  text: 이는 땅의 첫 열매와 소산으로 말미암아 주께서 여러분에게 복을 주실 것이기 때문입니다. 그분께서는 아벨로부터 지금까지 모든 성도에게 복을 주신 것처럼 여러분에게도 복을 주실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  english_pob_choice: in the firstfruits of the produce of the land
  chosen_korean: 땅의 첫 열매와 소산으로
  alternatives_korean:
  - 땅의 첫 소산으로
  - 땅의 첫 열매의 소산으로
  - 땅의 첫 열매들로
  lexicon: πρωτογεννήματα / καρποί / γῆ
  rationale: 영어 POB의 의미를 따라 ‘firstfruits’와 ‘produce’의 두 요소를 모두 살리되, 한국어에서는 자연스럽게 ‘첫 열매와 소산’으로 풀어 원문이 가리키는 농산물의 첫 수확을 전달했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 야훼께서
  - 주께
  lexicon: κύριος
  rationale: 본문의 ‘Lord’는 일반적인 주 호칭으로 기능하므로, 한국어에서는 문장 흐름에 맞는 ‘주께서’를 택했습니다.
- source_word: ἁγίους
  english_pob_choice: the holy ones
  chosen_korean: 모든 성도
  alternatives_korean:
  - 모든 거룩한 이들
  - 모든 거룩한 사람들
  - 모든 성인
  lexicon: ἅγιοι
  rationale: POB의 ‘holy ones’를 한국어 성경 관용에 맞게 ‘성도’로 옮겨, 거룩함을 지닌 사람들을 가리키는 집단 명칭을 분명히 했습니다.
- source_word: ἕως τοῦ νῦν
  english_pob_choice: until now
  chosen_korean: 지금까지
  alternatives_korean:
  - 현재까지
  - 이제까지
  - 오늘까지
  lexicon: ἕως
  rationale: 시간 범위를 자연스럽게 드러내는 표준적인 현대어 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘holy ones’의 공동체 정체성 표현
  chosen_reading: ‘모든 성도’로 번역해, 아벨부터 현재까지 이어지는 하나님께 속한 사람들의 연속성을 드러냈습니다.
  alternative_readings:
  - 모든 거룩한 이들
  - 모든 거룩한 사람들
  rationale: 문맥상 단순한 도덕적 수식보다 하나님께 구별된 사람들의 범주를 가리키므로, 한국어 교회 용례에서 의미가 안정적인 ‘성도’를 선택했습니다.
  doctrine_reference: 성도의 연속성, 구속사적 연계
