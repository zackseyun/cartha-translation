review_pass:
  verdict: revise
  source_fidelity: 원문은 Ὅτι로 시작하는 하나의 이유절이며, 주께서 ‘땅의 소산의 첫 열매들 안에서/관련하여’ 독자들을 복 주실 것과 아벨부터 지금까지 모든 거룩한 이들을 복 주신 일을 비교합니다. 초안은 이 내용을 두 문장으로 나누면서 주어·서술을 불필요하게 반복했고, 첫 문장의 ‘첫 열매와 소산’은 καρπῶν의 속격 관계를 등위 관계로 바꾸었습니다.
  naturalness: ‘땅의 소산의 첫 열매로 여러분에게 복을 주실 것’은 현대 표준 한국어에서 자연스럽고, 원문의 ἐν이 지닌 영역·수단의 여지를 과도하게 한쪽으로 확정하지 않습니다. 한 문장으로 비교 구문을 유지하는 편이 원문과 한국어 문장 흐름 모두에 적합합니다.
  terminology: ἅγιοι는 특정 교회 공동체를 뜻한다고 단정할 근거가 본절에 없으므로, 교파적 연상을 줄 수 있는 ‘성도’보다 원문의 표현을 보존하는 ‘거룩한 이들’이 적절합니다. Κύριος는 ‘주’로 유지합니다.
  issues:
  - severity: medium
    issue: 원문의 단일 문장이 두 문장으로 확대되고 ‘여러분에게 복을 주실 것입니다’가 반복됨
    rationale: 원문에는 한 번의 미래 동사(εὐλογήσει)와 하나의 비교절만 있습니다. 반복은 의미를 더하지 않으며 문장 구조를 변경합니다.
  - severity: medium
    issue: ‘땅의 첫 열매와 소산’이 ‘소산의 첫 열매’라는 원문의 관계를 등위 접속으로 바꿈
    rationale: πρωτογεννήμασιν καρπῶν τῆς γῆς는 땅의 소산/열매에 속한 첫 열매를 가리킵니다. ‘와’는 두 별도 항목처럼 들리게 합니다.
  - severity: low
    issue: ‘모든 성도’가 ἁγίους의 범주를 해석적으로 좁힐 수 있음
    rationale: 문맥상 특정 제도적·교회론적 공동체를 명시하지 않으므로 ‘모든 거룩한 이들’이 더 중립적이고 원문에 가깝습니다.
