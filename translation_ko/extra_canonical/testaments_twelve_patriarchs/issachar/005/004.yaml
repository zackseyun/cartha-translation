revisions:
- from: 이는 땅의 첫 열매와 소산으로 말미암아 주께서 여러분에게 복을 주실 것이기 때문입니다. 그분께서는 아벨로부터 지금까지 모든 성도에게 복을 주신 것처럼 여러분에게도 복을 주실 것입니다.[a]
  to: 이는 주께서 땅의 소산의 첫 열매로 여러분에게 복을 주실 것이며, 아벨부터 지금까지 모든 거룩한 이들에게 복을 주신 것과 같기 때문입니다.
  rationale: 원문의 단일 이유절과 비교 구문을 보존하고, ‘첫 열매’와 ‘소산’의 속격 관계를 ‘땅의 소산의 첫 열매’로 바로잡았습니다. 또한 근거 없는 문장 반복과 대응 각주 없는 앵커를 제거했으며, ἅγιοι는 교파적 함의를 덜어 낸 중립적 표현으로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
