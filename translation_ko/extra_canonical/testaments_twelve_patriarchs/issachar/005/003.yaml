base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/003.yaml
  text: Bend your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving.
translation:
  language: ko
  text: 밭을 갈도록 등을 굽히고, 매일의 모든 농사일에 힘쓰며, 감사함으로 주님께 예물을 바치십시오.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν εἰς τὸ γεωργεῖν
  english_pob_choice: Bend your back to farming
  chosen_korean: 밭을 갈도록 등을 굽히고
  alternatives_korean:
  - 농사에 등을 굽히고
  - 농사짓는 일에 몸을 낮추고
  lexicon: ὑποτίθημι / νῶτος / γεωργεῖν
  rationale: 동사 Ὑποτίθετε와 ‘등’을 결합해 몸을 숙여 농사일에 종사하라는 직접적 이미지를 살렸고, ‘밭을 갈다’는 γεωργεῖν의 농경 맥락을 구체적으로 드러냅니다.
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  english_pob_choice: labor in every work of cultivation
  chosen_korean: 매일의 모든 농사일에 힘쓰며
  alternatives_korean:
  - 모든 농사 일에 수고하며
  - 각각의 농사 일마다 일하며
  lexicon: ἐργάζεσθε / ἔργοις / καθ᾽ ἑκάστην γεωργίαν
  rationale: ‘힘쓰다’는 단순 노동보다 지속적 노력을 드러내며, καθ᾽ ἑκάστην은 반복성과 일상성을 살려 ‘매일의’로 옮겼습니다.
- source_word: δῶρα μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  english_pob_choice: offering gifts to the Lord with thanksgiving
  chosen_korean: 감사함으로 주님께 예물을 바치십시오
  alternatives_korean:
  - 감사로 주님께 선물을 드리십시오
  - 감사와 함께 주님께 제물을 바치십시오
  lexicon: δῶρα / εὐχαριστείας / Κυρίῳ / προσφέροντες
  rationale: δῶρα는 문맥상 일반적 ‘예물’이 적절하고, προσφέροντες는 예배적 봉헌의 뉘앙스를 살려 ‘바치다’로 옮겼습니다.
theological_decisions:
- issue: 농사 노동과 예물 봉헌의 결합
  chosen_reading: 육체적 노동을 하나님/주님께 드리는 경건의 행위로 함께 제시합니다.
  alternative_readings:
  - 단순히 생업 지침으로만 읽기
  - 예배적 헌신만 강조하기
  rationale: 본문은 농사일과 감사의 예물 봉헌을 병렬로 놓아, 일상 노동과 신앙적 응답이 분리되지 않음을 보여 줍니다.
  doctrine_reference: 공동체 윤리와 일의 신학
- issue: Κυρίῳ의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 하나님
  rationale: 본문의 ‘주’는 구약적 호칭의 직접 인용이라기보다 봉헌의 대상 호칭으로, 합쇼체 한국어에서 자연스럽고 경건한 ‘주님’이 적절합니다.
  doctrine_reference: 호칭 번역 일관성
