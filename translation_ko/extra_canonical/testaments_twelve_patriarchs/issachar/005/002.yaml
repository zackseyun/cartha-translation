id: T12P.ISS.5.2
reference: Testament of Issachar 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. Ἀλλὰ ἀγαπήσατε⁵ τὸν⁶ Κύριον καὶ τὸν πλησίον⁷· πένητα καὶ ἀσθενῆ⁸ ἐλεήσατε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/002.yaml
  text: But love the Lord and your neighbor. Show mercy to the poor and the weak.
translation:
  language: ko
  text: 그러나 주님과 이웃을 사랑하십시오. 가난한 이들과 약한 이들에게 자비를 베푸십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  english_pob_choice: love
  chosen_korean: 사랑하십시오
  alternatives_korean:
  - 사랑하시오
  - 사랑하라
  lexicon: ἀγαπάω
  rationale: 명령형으로서의 직접 권고를 살리되, 합쇼체에 맞게 ‘사랑하십시오’로 옮겼습니다.
- source_word: τὸν Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: κύριος
  rationale: 본문의 Κύριον은 주에 대한 호칭이므로, 자연스러운 경건한 한국어 표현인 ‘주님’을 사용했습니다.
- source_word: τὸν πλησίον
  english_pob_choice: your neighbor
  chosen_korean: 이웃
  alternatives_korean:
  - 가까운 사람
  - 이웃 사람
  lexicon: πλησίον
  rationale: 복수 소유격이 없더라도 일반적인 계명 문맥에서 ‘이웃’이 가장 직접적으로 대응합니다.
- source_word: πένητα καὶ ἀσθενῆ
  english_pob_choice: the poor and the weak
  chosen_korean: 가난한 이들과 약한 이들
  alternatives_korean:
  - 빈자와 연약한 자들
  - 가난한 자들과 병약한 자들
  lexicon: πένης / ἀσθενής
  rationale: 두 형용사를 인격화된 대상들로 살려, 단순 추상명사보다 ‘이들’을 보태 한국어 문장으로 자연스럽게 만들었습니다.
- source_word: ἐλεήσατε
  english_pob_choice: Show mercy
  chosen_korean: 자비를 베푸십시오
  alternatives_korean:
  - 불쌍히 여기십시오
  - 긍휼을 베푸십시오
  lexicon: ἐλεέω
  rationale: 동사의 실행성을 살려 ‘자비를 베풀다’로 옮겼고, ‘긍휼’은 더 교회적이어서 여기서는 평이한 ‘자비’를 택했습니다.
theological_decisions:
- issue: 문장 첫 머리의 접속사 Ἀλλὰ 처리
  chosen_reading: 그러나
  alternative_readings:
  - 그런데
  - 다만
  rationale: 앞 문맥과의 대조를 드러내는 접속사이므로, 본문의 역접을 가장 직접적으로 나타내는 ‘그러나’를 유지했습니다.
  doctrine_reference: 문맥 대조를 보존하는 번역 원칙
