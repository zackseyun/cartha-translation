  text: Therefore obey them, and walk in the simplicity of your father. [But to Gad it was given to destroy the marauding bands coming upon Israel.]
translation:
  language: ko
  text: 그러므로 그들에게 순종하십시오. 또 여러분 아버지의 순박함을 따라 살아가십시오. [그러나 갓에게는 이스라엘을 덮쳐 오는 약탈 무리를 멸하는 일이 주어졌습니다.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακούετε
  english_pob_choice: obey
  chosen_korean: 순종하십시오
  alternatives_korean:
  - 들으십시오
  - 복종하십시오
  lexicon: ὑπακούω
  rationale: 명령형의 직접적 요구를 살리면서도 한국어에서 자연스럽고 격조 있는 표현으로 옮겼습니다.
- source_word: τῇ ἁπλότητι
  english_pob_choice: the simplicity
  chosen_korean: 단순함 가운데서
  alternatives_korean:
  - 순박함 가운데서
  - 순전함 가운데서
  lexicon: ἁπλότης
  rationale: 문맥상 도덕적·인격적 특성을 가리키므로, 지나치게 지적이거나 기술적인 표현보다 ‘단순함’이 가장 직접적입니다.
- source_word: περιπατεῖτε
  english_pob_choice: walk
  chosen_korean: 걸어가십시오
  alternatives_korean:
  - 행하십시오
  - 삶을 사십시오
  lexicon: περιπατέω
  rationale: 삶의 방식 전체를 뜻하는 은유를 살리되, 한국어에서 “walk”의 이미지가 분명히 드러나도록 했습니다.
- source_word: πειρατήρια
  english_pob_choice: marauding bands
  chosen_korean: 약탈 무리
  alternatives_korean:
  - 습격 무리
  - 약탈대
  lexicon: πειρατήριον
  rationale: 영문 POB의 ‘bands’에 맞추어 사람들의 집단성을 드러내면서, 약탈·침략의 성격을 분명히 했습니다.
