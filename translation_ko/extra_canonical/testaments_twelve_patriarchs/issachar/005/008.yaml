revisions:
- from: 그러므로 그들에게 순종하십시오. 그리고 여러분의 아버지의 단순함 가운데서 걸어가십시오. [그리고 갓에게는 이스라엘에 닥쳐오는 약탈 무리를 멸하게 하셨습니다.][a][b]
  to: 그러므로 그들에게 순종하십시오. 또 여러분 아버지의 순박함을 따라 살아가십시오. [그러나 갓에게는 이스라엘을 덮쳐 오는 약탈 무리를 멸하는 일이 주어졌습니다.]
  rationale: 명령의 복수 합쇼체를 유지하고, ‘순박함을 따라 살아가십시오’로 삶의 방식에 대한 은유를 자연스럽게 옮겼습니다. 괄호는 원전의 대괄호 처리대로 보존했으며, 그 안의 ἐδόθη를 비인칭 수동 구조로 번역하여 본문이 명시하지 않는 행위자를 덧붙이지 않았습니다. 내용 없는 [a][b] 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
