id: T12P.ISS.5.1
reference: Testament of Issachar 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: V. Φυλάξατε οὖν *τέκνα μου νόμον Θεοῦ¹, καὶ *τὴν ἁπλότητα κτήσασθε², ⌜καὶ ἐν ἀκακίᾳ πορεύεσθε, μὴ περιαργαζόμενοι τοῦ³ πλησίον⁴ τὰς πράξεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/001.yaml
  text: Therefore, my children, keep the law of God, and acquire simplicity, and walk in innocence, not concerning yourselves with the deeds of your neighbor.
translation:
  language: ko
  text: 그러므로, 내 자녀들아, 하나님의 율법을 지키고, 단순함을 얻으라. 그리고 순결 가운데 걸으며, 이웃의 행위에 대해 염려하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμον Θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님께 속한 율법
  lexicon: νόμος
  rationale: 이 문맥의 νόμος는 일반적 규범이 아니라 하나님의 율법을 가리키므로, POB 기본어인 ‘율법’을 유지했습니다.
- source_word: ἁπλότητα
  english_pob_choice: simplicity
  chosen_korean: 단순함
  alternatives_korean:
  - 순박함
  - 간소함
  lexicon: ἁπλότης
  rationale: 영어 POB의 ‘simplicity’를 한국어에서 자연스럽고 직역에 가까운 ‘단순함’으로 옮겨, 덕목의 성격을 살렸습니다.
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  english_pob_choice: walk in innocence
  chosen_korean: 순결 가운데 걸으며
  alternatives_korean:
  - 무해함 가운데 걸으며
  - 순진함 가운데 걸으며
  lexicon: ἀκακία
  rationale: ἀκακία는 단순한 무지보다 ‘해를 끼치지 않는 순결/악의 없음’을 뜻하므로, 도덕적 무구함을 드러내는 ‘순결’로 렌더링했습니다.
- source_word: μὴ περιαργαζόμενοι τοῦ πλησίον τὰς πράξεις
  english_pob_choice: not concerning yourselves with the deeds of your neighbor
  chosen_korean: 이웃의 행위에 대해 염려하지 마십시오
  alternatives_korean:
  - 이웃의 행위에 간섭하지 마십시오
  - 이웃의 일에 마음을 쓰지 마십시오
  lexicon: περιαργάζομαι
  rationale: 보존된 영어 POB의 ‘concerning yourselves with’는 단순한 ‘간섭하다’보다 마음을 빼앗기거나 쓸데없이 관여하는 뉘앙스를 담아, ‘염려하지 마십시오’로 옮겼습니다.
theological_decisions:
- issue: 덕목 목록의 규범적 명령체 유지
  chosen_reading: 본문의 명령들을 현대 합쇼체로 직접 살리되, 도덕 권고의 강도를 약화하지 않았습니다.
  alternative_readings:
  - 서술형으로 완화된 표현
  - 더 구어적인 권면형 표현
  rationale: 이 구절은 권면이 아니라 실제적 명령의 연쇄이므로, ‘지키고/얻으라/걸으며/염려하지 마십시오’의 명령성을 보존했습니다.
  doctrine_reference: Parenetic imperatives in wisdom and testament literature
- issue: ‘이웃의 행위’에 대한 태도
  chosen_reading: 외적 행위를 판단하거나 불필요하게 파고들지 말라는 윤리적 경고로 이해했습니다.
  alternative_readings:
  - 단순한 사회적 무관심
  - 비판 금지의 일반 원칙
  rationale: 문맥상 이웃의 행위에 대한 지나친 관여를 경계하는 말이지, 책임 있는 관심 전체를 금하는 것은 아니므로 한국어도 그 긴장을 살렸습니다.
  doctrine_reference: Ethics of restraint and nonintrusion
