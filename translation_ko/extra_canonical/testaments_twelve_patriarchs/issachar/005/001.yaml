revisions:
- from: 그러므로, 내 자녀들아, 하나님의 율법을 지키고, 단순함을 얻으라. 그리고 순결 가운데 걸으며, 이웃의 행위에 대해 염려하지 마십시오.
  to: 그러므로 내 자녀들아, 하나님의 율법을 지키고 순박함을 갖추며, 악의 없이 행하십시오. 이웃의 행위에 지나치게 관여하지 마십시오.
  rationale: 원문의 병렬된 권면을 현대 한국어 합쇼체로 유지했습니다. ‘순박함’은 ἁπλότης의 꾸밈없고 단순한 덕목을, ‘악의 없이’는 ἀκακία의 무해함과 무구함을 살립니다. 마지막 분사는 이웃의 행위를 염려하지 말라는 뜻보다 그 일에 불필요하게 관여하지 말라는 경고이므로 ‘지나치게 관여하지 마십시오’로 조정했습니다. 제공된 자료에는 번역문에 연결할 확정적 본문 주석 내용이 없으므로 각주를 추가하지 않았습니다.
