  to: 레위와 유다는 주님께 영화롭게 되었으며, 야곱의 아들들 가운데서 높임을 받았습니다. 주님께서는 그들에게 몫을 나누어 주셨습니다. 곧 레위에게는 제사직을, 유다에게는 나라를 주셨습니다.
