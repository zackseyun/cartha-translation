base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/007.yaml
  text: 'And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord allotted to them their inheritance: to Levi, the priesthood; and to Judah, the kingdom.'
translation:
  language: ko
  text: 레위와 유다는 주님께 영화롭게 되었으며, 야곱의 아들들 가운데서 높임을 받았습니다. 주님께서는 그들에게 몫을 나누어 주셨습니다. 곧 레위에게는 제사직을, 유다에게는 나라를 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν ... παρὰ Κυρίου καὶ ἐν υἱοῖς Ἰακώβ
  english_pob_choice: were glorified by the Lord among the sons of Jacob
  chosen_korean: 주님께서 야곱의 아들들 가운데서 영화롭게 되었습니다
  alternatives_korean:
  - 주님께 인정받았습니다
  - 주님께 높임을 받았습니다
  lexicon: δοξάζω
  rationale: ἐδοξάσθησαν의 수동형은 단순한 ‘칭찬’보다 ‘영화롭게 됨/높임을 받음’의 의미가 강하므로 이를 살리고, παρὰ Κυρίου와 ἐν υἱοῖς Ἰακώβ의 관계를 자연스럽게 합쳐 옮겼습니다.
- source_word: ἐκληροδότησεν αὐτούς
  english_pob_choice: allotted to them their inheritance
  chosen_korean: 그들에게 그들의 몫을 정해 주셨습니다
  alternatives_korean:
  - 그들에게 상속을 주셨습니다
  - 그들을 유산으로 주셨습니다
  lexicon: κληροδοτέω
  rationale: 동사의 핵심은 ‘유산을 상속하다/배분하다’이지만, 여기서는 이어지는 제사직과 나라를 설명하는 분배 개념이므로 ‘몫을 정해 주다’로 자연스럽게 옮겼습니다.
- source_word: τὴν ἱερατείαν
  english_pob_choice: the priesthood
  chosen_korean: 제사직
  alternatives_korean:
  - 제사장직
  - 사제직
  lexicon: ἱερατεία
  rationale: 문맥상 직분 전체를 가리키므로 ‘제사직’이 가장 직접적이며, 전통적이지만 본문에 충실한 표현입니다.
- source_word: τὴν βασιλείαν
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 왕국
  lexicon: βασιλεία
  rationale: 여기서는 추상적 통치권보다 유다에게 주어진 통치 영역/왕권 질서를 가리키므로, POB의 일관성과 한국어 자연성을 고려해 ‘나라’로 옮겼습니다.
theological_decisions:
- issue: 레위와 유다에게 주어진 분깃의 성격
  chosen_reading: 하나님께서 두 지파에게 각각 제사직과 나라를 분배하신 것으로 읽었습니다.
  alternative_readings:
  - 단순한 역사적 특권 진술
  - 메시아적 예표를 약화한 일반 서술
  rationale: 본문은 출애굽 이후 지파들의 소명과 역할 분배를 진술하므로, ‘몫을 정해 주셨다’는 표현으로 분깃의 신적 배정성을 보존했습니다.
  doctrine_reference: 창 49장, 출 19:6의 제사장 나라 모티프
