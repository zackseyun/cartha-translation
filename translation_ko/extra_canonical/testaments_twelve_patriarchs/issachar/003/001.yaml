base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/001.yaml
  text: When therefore I grew up, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers, and I brought in fruits from the fields in their season.
translation:
  language: ko
  text: 그러므로 내가 자라났을 때에, 내 자녀들아, 나는 마음이 올곧게 살았으며, 아버지와 형제들을 위해 농부가 되었고, 밭에서 난 열매를 제철에 거두어들였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθην ἐν εὐθύτητι καρδίας
  english_pob_choice: I walked in uprightness of heart
  chosen_korean: 마음의 올곧음으로 걸어갔으며
  alternatives_korean:
  - 마음의 정직함으로 걸어갔으며
  - 마음의 바름으로 걸어갔으며
  lexicon: εὐθύτης
  rationale: 직역의 ‘곧음/바름’ 의미를 살리되, 한국어에서 자연스럽고 도덕적 태도를 드러내는 ‘마음의 올곧음’으로 옮겼습니다.
- source_word: ἐγενόμην γεωργός
  english_pob_choice: I became a farmer
  chosen_korean: 농부가 되었고
  alternatives_korean:
  - 경작자가 되었고
  - 농사꾼이 되었고
  lexicon: γεωργός
  rationale: 직업적 의미가 분명하므로 표준적이고 읽기 쉬운 ‘농부’를 택했습니다.
- source_word: ἔφερον καρποὺς ἐξ ἀγρῶν
  english_pob_choice: I brought in fruits from the fields
  chosen_korean: 들의 열매를 거두어들였습니다
  alternatives_korean:
  - 밭의 열매를 가져왔습니다
  - 들에서 난 열매를 들여왔습니다
  lexicon: καρπούς / ἀγροί
  rationale: ‘열매’를 문자 그대로 유지하되, 농사 문맥에서 한국어로 자연스러운 수확 동작을 반영해 ‘거두어들이다’로 옮겼습니다.
- source_word: κατὰ καιρὸν αὐτῶν
  english_pob_choice: in their season
  chosen_korean: 제철에
  alternatives_korean:
  - 그때에
  - 때맞추어
  lexicon: καιρός
  rationale: 시기성이 핵심이므로 간결하게 ‘제철에’로 표현해 수확의 적기라는 뜻을 살렸습니다.
theological_decisions:
- issue: 화자가 자녀들에게 들려주는 자기 회고의 어조
  chosen_reading: 직설적 회고를 살려, 평서문과 호격(내 자녀들아)을 유지했습니다.
  alternative_readings:
  - 보다 설교체로 다듬기
  - 현대적 설명을 덧붙이기
  rationale: 이 구절은 교훈적 회고문이므로, 서술의 직접성과 권면의 호격을 보존하는 것이 원문의 기능에 맞습니다.
  doctrine_reference: 문학적/수사학적 맥락 보존
