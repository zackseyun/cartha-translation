  text: III. *Ὅτε οὖν¹ ἡδρύνθην² ἐγὼ³, *τέκνα μου⁴, ἐπορεύθην⁵ ἐν *εὐθύτητι καρδίας⁶, *καὶ ἐγενόμην⁷ γεωργὸς *τῷ πατρί μου καὶ τοῖς ἀδελφοῖς μου⁸, *καὶ ἔφερον καρποὺς⁹ ἐξ ἀγρῶν¹⁰ ⌜κατὰ καιρὸν αὐτῶν⌝¹¹.
