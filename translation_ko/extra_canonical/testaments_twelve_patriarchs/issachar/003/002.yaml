  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/002.yaml
  text: And my father blessed me, seeing that I walked in simplicity before him.
translation:
  language: ko
  text: 그리고 아버지께서는 내가 순전함으로 아버지 앞에서 살아가는 것을 보시고 나를 축복해 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ηὐλόγει
  english_pob_choice: blessed
  chosen_korean: 축복하셨습니다
  alternatives_korean:
  - 복을 빌어주셨습니다
  - 복 주셨습니다
  lexicon: εὐλογέω
  rationale: 아버지가 아들을 향해 복을 선포하는 의미를 자연스럽고도 직접적으로 살리기 위해 ‘축복하셨습니다’를 택했습니다.
- source_word: ἐν ἁπλότητι
  english_pob_choice: in simplicity
  chosen_korean: 순전함 가운데
  alternatives_korean:
  - 단순함 가운데
  - 진실함 가운데
  - 한결같음 가운데
  lexicon: ἁπλότης
  rationale: 문맥상 도덕적·신앙적 ‘단순함’보다 흠이 없고 한결같은 삶의 태도를 가리키므로 ‘순전함’이 가장 근접합니다.
- source_word: πορεύομαι ἔμπροσθεν αὐτοῦ
  english_pob_choice: I walked before him
  chosen_korean: 그분 앞에서 걸어가는 것
  alternatives_korean:
  - 그분 앞에서 행하는 것
  - 그분 앞에서 걸었습니다
  lexicon: πορεύομαι + ἔμπροσθεν
  rationale: 영어 POB가 유지한 ‘before him’의 관계를 살리면서, 현재적·지속적 삶의 양태를 드러내기 위해 ‘걸어가는 것’으로 옮겼습니다.
theological_decisions:
- issue: 아버지의 축복과 순전함의 연관
  chosen_reading: 축복은 단순한 호의가 아니라, 아들의 삶이 하나님 앞에서 순전하다는 인식을 바탕으로 주어집니다.
  alternative_readings:
  - 축복은 단지 감정적 만족을 표현합니다
  - 순전함은 도덕적 무결성보다 일반적인 성실함을 뜻합니다
  rationale: 원문은 축복의 근거를 ‘보심’과 ‘순전함’에 직접 연결하므로, 행위의 도덕적·언약적 의미를 약화하지 않고 반영해야 합니다.
  doctrine_reference: 성경적 축복과 언약적 삶의 상관성
