  source_fidelity: 원문의 세 가지 부정(περίεργος, φθονερός, βάσκανος)은 초안에 대체로 보존되어 있습니다. 다만 제시된 그리스어 본문에서는 ‘내 이웃’이 시기와 악의의 대상으로 함께 연결되므로 이를 더 직접적으로 표현하는 편이 좋습니다. 영어 감사 이력에는 ‘사람을 시기하다’라는 이문/판단이 보이지만, 제시된 본문 자체를 우선하여 번역했습니다.
  naturalness: ‘내 행실에서 간섭이 많지 않으며’는 무엇에 간섭한다는 뜻인지 다소 불분명하고, ‘행실에서 간섭이 많다’도 자연스러운 결합이 아닙니다. ‘내 행동에서 남의 일에 쓸데없이 참견하지 않으며’가 현대 한국어로 더 자연스럽습니다.
  terminology: περίεργος는 여기서 ‘쓸데없이 참견하는’으로, φθονερός는 ‘시기하는’으로, βάσκανος는 ‘악의를 품는’으로 옮기는 것이 무난합니다. πλησίον은 관계적·윤리적 범위를 불필요하게 좁히지 않도록 ‘내 이웃’으로 유지했습니다.
