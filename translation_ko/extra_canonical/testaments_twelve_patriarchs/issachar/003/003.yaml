  text: And I am not meddlesome in my actions, nor envious and malicious toward my neighbor.
translation:
  language: ko
  text: 그리고 나는 내 행동에서 남의 일에 쓸데없이 참견하지 않으며, 내 이웃을 시기하지도 악의를 품지도 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος ἐν ταῖς πράξεσίν μου
  english_pob_choice: meddlesome in my actions
  chosen_korean: 내 행실에서 간섭이 많지 않으며
  alternatives_korean:
  - 내 일에 참견이 많지 않으며
  - 내 행실에 쓸데없이 관여하지 않으며
  lexicon: περίεργος
  rationale: 문맥상 과도한 참견·간섭을 가리키므로, 현대 한국어에서 자연스럽고 부정적 뉘앙스를 살릴 수 있는 ‘간섭이 많지 않다’로 옮겼습니다.
- source_word: φθονερὸς
  english_pob_choice: envious of a man
  chosen_korean: 이웃을 향해서는 시기하지도
  alternatives_korean:
  - 사람을 시기하지도
  - 어떤 사람을 질투하지도
  lexicon: φθονερὸς
  rationale: POB의 수정 이력을 반영해 ‘malicious’와 합치지 않고, 대상이 되는 타인을 향한 ‘시기’로 따로 드러냈습니다.
- source_word: βάσκανος
  english_pob_choice: malicious
  chosen_korean: 악의를 품지도 않습니다
  alternatives_korean:
  - 해코지하려 들지도 않습니다
  - 악의적이지도 않습니다
  lexicon: βάσκανος
  rationale: βάσκανος의 해로운/악의적인 태도를 한국어의 관용적 표현으로 살려, 단순한 감정의 문제가 아니라 타인을 해치려는 악의를 나타냈습니다.
- source_word: τῷ πλησίον μου
  english_pob_choice: toward my neighbor
  chosen_korean: 이웃을 향해서는
  alternatives_korean:
  - 내 이웃을 향해서는
  - 이웃에게는
  lexicon: πλησίον
  rationale: 직역적인 ‘이웃’ 의미를 유지하되, 앞 절과 대응되도록 ‘향해서는’으로 방향성을 분명히 했습니다.
theological_decisions:
- issue: 세 가지 부정의 분리
  chosen_reading: 간섭이 많지 않으며 … 시기하지도, 악의를 품지도 않습니다
  alternative_readings:
  - 시기하지도 악의를 품지도 않습니다로 묶어 번역
  - 한 문장으로 평탄하게 의역
  rationale: 원문의 περίεργος, φθονερὸς, βάσκανος를 각각 별도의 품성 결함으로 드러내어, 도덕적 자기진술의 구조를 보존했습니다.
  doctrine_reference: 문맥적 윤리 진술 보존
