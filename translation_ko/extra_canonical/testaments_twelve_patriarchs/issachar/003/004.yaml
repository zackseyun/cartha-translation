  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/004.yaml
  text: I never spoke ill of anyone, nor did I criticize a person's life.
translation:
  language: ko
  text: 나는 결코 누구에 대해서도 험담하지 않았고, 사람의 삶을 비난하지도 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ κατελάλησά τινος πώποτε
  english_pob_choice: I never spoke ill of anyone
  chosen_korean: 나는 결코 누구에 대해서도 험담하지 않았고
  alternatives_korean:
  - 나는 누구에 대해서도 험담한 적이 없고
  - 나는 결코 누구를 헐뜯지 않았고
  lexicon: καταλαλέω
  rationale: κατελάλησα는 단순한 ‘비난하다’보다 남을 험담하거나 나쁘게 말하는 뜻이 강하므로, POB의 ‘spoke ill of’에 맞춰 ‘험담하다’로 옮겼습니다.
- source_word: ἔψεξα
  english_pob_choice: criticize
  chosen_korean: 비난하지도 않았습니다
  alternatives_korean:
  - 책망하지도 않았습니다
  - 흠잡지도 않았습니다
  lexicon: ψεγω
  rationale: ἔψεξα는 직접적인 꾸짖음보다 어떤 사람의 삶 전체를 흠잡고 비판하는 뉘앙스가 있어, 문맥상 ‘비난하다’가 가장 자연스럽습니다.
- source_word: βίον ἀνθρώπου
  english_pob_choice: a person's life
  chosen_korean: 사람의 삶
  alternatives_korean:
  - 한 사람의 삶
  - 사람의 생활
  lexicon: βίος
  rationale: βίον은 단순한 ‘생활 방식’보다 사람의 실제 삶 전체를 가리킬 수 있으므로, 성별을 특정하지 않는 POB의 조정을 따라 ‘사람의 삶’으로 했습니다.
theological_decisions:
- issue: 도덕적 자기증언의 어조
  chosen_reading: 화자가 과거의 언행을 부정하는 자전적 진술로 읽고, 과도한 종교적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 금욕적 규범을 제시하는 교훈문으로 읽기
  - 공동체 윤리의 일반 원칙으로 확장해 번역하기
  rationale: 본문은 간결한 자기변증적 진술이므로, 원문이 말하는 범위를 넘지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 텍스트 표면 의미 우선 원칙
