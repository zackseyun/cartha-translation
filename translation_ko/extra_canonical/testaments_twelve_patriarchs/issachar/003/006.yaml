base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/006.yaml
  text: And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father.
translation:
  language: ko
  text: 그리고 제 아버지께서는 제 순박함을 언제나 기뻐하셨습니다. 이는 제가 처음 난 모든 것을 제사장을 통해 주님께 바치고, 그 후에 제 아버지께도 바쳤기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητί μου
  english_pob_choice: my simplicity
  chosen_korean: 제 소박함
  alternatives_korean:
  - 제 단순함
  - 제 순수함
  - 제 진솔함
  lexicon: ἁπλότης
  rationale: 문맥상 외식 없는 태도와 검소함을 가리키므로, 현대 한국어에서 자연스럽고 긍정적 뉘앙스를 유지하는 ‘소박함’이 가장 적절합니다.
- source_word: πᾶν πρῶτον γέννημα
  english_pob_choice: every firstborn
  chosen_korean: 모든 맏물
  alternatives_korean:
  - 모든 첫 소산
  - 모든 첫 열매
  - 모든 맏배
  lexicon: πρῶτον γέννημα
  rationale: 여기서는 사람의 첫 태생이 아니라 봉헌 대상인 첫 생산물을 가리키므로, 제의적 맥락을 살리는 ‘맏물’이 맞습니다.
- source_word: διὰ τοῦ ἱερέως
  english_pob_choice: through the priest
  chosen_korean: 제사장을 통해
  alternatives_korean:
  - 제사장을 거쳐
  - 제사장을 통하여
  lexicon: ἱερεύς
  rationale: διὰ + 속격의 중개 의미를 자연스럽게 드러내기 위해 ‘통해’를 사용했습니다.
- source_word: τῷ Κυρίῳ
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 주께서
  lexicon: κύριος
  rationale: 본문의 Κυρίῳ는 하나님을 가리키는 호칭이므로, 한국어 경어 체계에 맞춰 ‘주님께’로 옮겼습니다.
theological_decisions:
- issue: 헌납의 순서와 대상 표현
  chosen_reading: 맏물을 먼저 주님께 바치고, 이어 아버지께도 드렸다는 이중 봉헌의 순서를 그대로 살렸습니다.
  alternative_readings:
  - ‘주님과 아버지께 동시에 드렸다’로 완화
  - ‘아버지께 드렸다’를 일반적 존경 표현으로 약화
  rationale: 원문은 제의적 봉헌과 가정적 예우를 구분해 제시하므로, 두 동작을 분리해 번역해야 서술의 긴장이 보존됩니다.
  doctrine_reference: 가정 윤리와 제의적 충성의 병행
