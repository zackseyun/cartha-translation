  to: 서른다섯 살에 나는 아내를 맞이했습니다. 내 노동이 내 힘을 소모시켰기 때문에, 나는 여자의 쾌락을 생각하지 않았습니다. 오히려 내 수고 때문에 잠이 나를 압도했습니다.
