id: T12P.ISS.3.5
reference: Testament of Issachar 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. Τριάκοντα Γκαὶ πέντε¹²⁴ ἐτῶν ἔλαβον²⁵ ἐμαυτῷ²⁶ γυναῖκα²⁷, ὅτι ὁ κάματος κατήσθιε τὴν ἰσχύν²⁸ μου²⁹, καὶ οὐκ ἐνενόουν³⁰ ἡδονὴν³¹ γυναικός, Γἀλλὰ διὰ τοῦ κόπου³² ὁ ὕπνος μοι³³ περιεγένετο³⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/005.yaml
  text: At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman's pleasure; rather, because of my toil, sleep came over me.
translation:
  language: ko
  text: 서른다섯 살에 나는 아내를 맞이했습니다. 내 노동이 내 힘을 소모시켰기 때문에, 나는 여자의 쾌락을 생각하지 않았습니다. 오히려 내 수고 때문에 잠이 나를 압도했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκα / γυναίκος
  english_pob_choice: wife / woman's
  chosen_korean: 아내 / 여자의
  alternatives_korean:
  - 부인 / 여성의
  - 아내를 얻었습니다 / 여성의
  lexicon: γυνή
  rationale: 문맥상 결혼을 가리키는 γυναῖκα는 ‘아내’로, 뒤의 γεν. ἡδονὴν γυναικός는 직역해 ‘여자의 쾌락’으로 두어 원문의 성적 관심을 분명히 살렸습니다.
- source_word: κάματος, κόπος
  english_pob_choice: labor / toil
  chosen_korean: 노동 / 수고
  alternatives_korean:
  - 일 / 애씀
  - 수고 / 고생
  lexicon: κάματος; κόπος
  rationale: 두 단어 모두 단순한 ‘일’보다 더 강한 육체적·정신적 소진을 가리키므로, 앞은 ‘노동’, 뒤는 ‘수고’로 구분해 반복과 강도를 살렸습니다.
- source_word: κατήσθιε τὴν ἰσχύν μου
  english_pob_choice: consumed my strength
  chosen_korean: 내 힘을 소모시켰습니다
  alternatives_korean:
  - 내 힘을 삼켜 버렸습니다
  - 내 기력을 소진시켰습니다
  lexicon: κατεσθίω; ἰσχύς
  rationale: ‘삼키다/먹어 치우다’의 이미지를 담되 한국어에서는 자연스럽게 ‘소모시키다/소진시키다’로 옮겨, 힘이 갉아 먹히는 뜻을 유지했습니다.
- source_word: ὕπνος μοι περιεγένετο
  english_pob_choice: sleep came over me
  chosen_korean: 잠이 나를 덮쳤습니다
  alternatives_korean:
  - 잠이 내게 몰려왔습니다
  - 잠이 나를 사로잡았습니다
  lexicon: ὕπνος; περιγίνομαι
  rationale: 동사가 ‘덮치다/이기다’의 뉘앙스를 가지므로, 수동적 상태를 드러내는 ‘잠이 나를 덮쳤습니다’로 옮겼습니다.
