    issue: ‘땅의 좋은 소출’이 τῶν ἀγαθῶν τῆς γῆς의 범위를 수확물로 좁힙니다.
    rationale: 원문은 ‘땅의 좋은 것들’을 말하며, 농작물만을 명시하지 않습니다.
