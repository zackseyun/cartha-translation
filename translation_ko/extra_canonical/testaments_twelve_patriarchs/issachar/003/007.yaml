id: T12P.ISS.3.7
reference: Testament of Issachar 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. Καὶ ὁ⁴⁵ Κύριος ἐμυριοπλασίασε⁴⁶ τὰ ἀγαθὰ ⌜ἐν ταῖς χερσί⁴⁷ μου· ᾔδει δὲ καὶ Ἰακὼβ *ὁ πατήρ μου⁴⁸, ὅτι ὁ Θεὸς συνεργεῖ⁴⁸ τῇ ἁπλότητί μου⌝. *Πάντα γὰρ πένησι καὶ θλιβομένοις⁴⁹ παρεῖχον *ἐκ τῶν ἀγαθῶν τῆς γῆς⁵⁰ ἐν ἁπλότητι καρδίας μου⁵¹˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/007.yaml
  text: And the Lord multiplied the good things ten thousandfold in my hands; and Jacob my father also knew that God was working together with my simplicity. For I provided to all the poor and afflicted from the good things of the earth, in the simplicity of my heart.
translation:
  language: ko
  text: 주님께서는 내 손안의 좋은 것들을 만 배로 늘리셨습니다. 야곱, 곧 내 아버지도 하나님께서 나의 순박함과 함께 일하신다는 것을 알고 있었습니다. 나는 마음의 순박함으로 땅의 좋은 것들 가운데서 가난한 이들과 고난을 겪는 이들 모두에게 베풀었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: κύριος
  rationale: 여기서는 야훼 인용이 아니라 직접 서술되는 주어이므로, 존칭이 있는 신적 호칭으로 주님이 자연스럽고 본문 흐름을 살립니다.
- source_word: ἐμυριοπλασίασε τὰ ἀγαθὰ
  english_pob_choice: multiplied the good things ten thousandfold
  chosen_korean: 좋은 것들을 만 배로 늘리셨습니다
  alternatives_korean:
  - 좋은 것들을 열 배로 늘리셨습니다
  - 좋은 것들을 매우 많이 늘리셨습니다
  lexicon: μυριοπλασιάζω
  rationale: 동사의 핵심은 단순한 증가가 아니라 ‘만 배’라는 과장된 대폭 증대이므로, 수량 감각을 살려 만 배로 옮겼습니다.
- source_word: ἐν ταῖς χερσί μου
  english_pob_choice: in my hands
  chosen_korean: 내 손에
  alternatives_korean:
  - 내 손 안에
  - 내 손으로
  lexicon: χείρ
  rationale: 재물의 소유·관리 영역을 가리키는 관용적 표현으로 이해해, 직역하되 한국어에서 자연스러운 내 손에로 옮겼습니다.
- source_word: τῇ ἁπλότητί μου / ἐν ἁπλότητι καρδίας μου
  english_pob_choice: with my simplicity / in the simplicity of my heart
  chosen_korean: 나의 순박함 / 마음의 순박함
  alternatives_korean:
  - 나의 단순함 / 마음의 단순함
  - 나의 순전함 / 마음의 순전함
  lexicon: ἁπλότης
  rationale: ἁπλότης는 단순함보다 도덕적·태도적 ‘순박함, 꾸밈없음’이 더 잘 드러나므로 순박함을 택했습니다.
- source_word: πένησι καὶ θλιβομένοις
  english_pob_choice: the poor and afflicted
  chosen_korean: 가난한 이들과 고통받는 이들
  alternatives_korean:
  - 가난한 사람들과 괴로움받는 이들
  - 빈자와 압박받는 이들
  lexicon: πένης, θλίβω
  rationale: 사회적 빈곤과 고난을 함께 가리키는 두 항을, 현대 한국어에서 의미가 분명한 표현으로 옮겼습니다.
theological_decisions:
- issue: ἁπλότης를 단순한 지적 성격이 아니라 윤리적 태도로 볼지 여부
  chosen_reading: 본절의 ἁπλότης는 ‘순박함’으로, 꾸밈없고 이중적이지 않은 마음의 자세를 뜻하는 윤리적 덕목으로 번역했습니다.
  alternative_readings:
  - 단순함
  - 순전함
  rationale: 앞뒤 문맥이 가난한 이들에게 아낌없이 나누는 행위를 설명하므로, 지적 단순성이 아니라 성품의 정직하고 꾸밈없는 태도가 핵심입니다.
  doctrine_reference: 성품 윤리 / 자비 실천
