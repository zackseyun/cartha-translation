base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007.yaml
  text: '1[a]. See then, as you see: I am one hundred and twenty-six years old, and I am not conscious of committing any sin unto death. 2. Except for my wife, I have not known another woman. I did not commit sexual immorality with wandering eyes. 3. I did not drink wine for deception[b], and I did not desire anything of my neighbor. 4. No deceit came to be in my heart, and no lie went up through my lips. 5. I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth. 6. I loved the Lord with all my strength, and likewise I loved every person with all my heart, more than my children. 7. You also, my children, do these things, and every spirit of Beliar will flee from you, and no deed of wicked people will rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who walks with people in simplicity of heart. 8. And after saying these things he commanded his sons to carry him up
    to Hebron and bury him there with his fathers in the cave. 9. And stretching out his feet, he fell asleep in a good old age, sound in every limb and strong[d][c], and slept the eternal sleep.'
  footnotes:
  - marker: a
    text: Or 'I have not known in myself any sin unto death.' The Greek uses 'know' in a self-aware moral sense.
    reason: lexical_alternative
  - marker: b
    text: '''Beliar'' reflects the Greek form here; some traditions normalize the name as ''Belial.'''
    reason: alternative_reading
  - marker: c
    text: The phrase 'who walks with people in simplicity of heart' may also be understood as describing God's companionship with those who live in singleness of heart.
    reason: alternative_reading
  - marker: d
    text: Some textual forms of the closing verse vary between 'he died in a good old age' and 'he slept the eternal sleep,' with expansions about being sound in every limb and strong.
    reason: textual_variant
translation:
  language: ko
  text: 1. 보십시오. 여러분이 보는 바와 같이, 저는 이제 백스물여섯 살이며, 제 안에 죽음에 이르는 어떤 죄가 있음을 알지 못합니다. 2. 제 아내 외에는 다른 여자와 관계하지 않았습니다. 저는 방황하는 눈길로 성적 부도덕을 저지르지 않았습니다. 3. 저는 미혹을 위해 포도주를 마시지 않았고, 이웃의 어떤 것도 탐내지 않았습니다. 4. 제 마음에 속임수가 생기지 않았고, 제 입술을 통해 거짓이 나오지 않았습니다. 5. 저는 고통받는 모든 사람과 함께 신음했고, 가난한 사람에게 제 빵을 나누어 주었습니다. 저는 모든 날 동안 경건하게 살았으며, 진리를 지켰습니다. 6. 저는 주님을 사랑했고, 모든 사람을 온 마음으로 제 자녀들보다 더 사랑했습니다. 7. 너희도, 내 자녀들아, 이런 것들을 행하라. 그러면 벨리아르의 모든 영이 너희에게서 달아날 것이고, 악한 사람들의 어떤 행위도 너희를 지배하지 못할 것이다. 또 너희는 모든 들짐승을 굴복시킬 것이다. 이는 단순한 마음으로 사람들과 함께 걸으시는 하늘과 땅의 하나님께서 너희와 함께 계시기 때문이다. 8. 그가 이런 말을 한 뒤에 자기 아들들에게 그를 헤브론으로 옮겨, 그곳에서 그의 조상들과 함께 묻으라고 명하였습니다. 9. 그는 발을 뻗고 좋은 노년에 영원한 잠에 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων ... ἁμαρτίαν εἰς θάνατον
  english_pob_choice: I am not conscious of committing any sin unto death
  chosen_korean: 죽음에 이르는 어떤 죄도 내 안에 있었다는 것을 알지 못합니다
  alternatives_korean:
  - 죽음에 이르는 어떤 죄도 지은 적이 없다고 알고 있습니다
  - 내 안에 죽음에 이르는 어떤 죄도 있다고 의식하지 못합니다
  lexicon: BDAG
  rationale: ἔγνων의 자기증언적, 자각적 뉘앙스를 살리기 위해 단순한 무죄 선언보다 '알지 못합니다'를 택했고, εἰς θάνατον은 교리 용어를 덧씌우지 않고 '죽음에 이르는'으로 옮겼습니다.
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  english_pob_choice: with wandering eyes
  chosen_korean: 방황하는 눈길로
  alternatives_korean:
  - 흩어지는 눈길로
  - 방랑하는 눈으로
  - 불안한 눈길로
  lexicon: LSJ
  rationale: 직역보다 한국어 관용에 맞는 표현으로, 욕망에 끌려 흔들리는 시선을 드러내는 '방황하는 눈길'을 사용했습니다.
- source_word: οἶνον εἰς ἀποπλάνησιν
  english_pob_choice: wine for deception
  chosen_korean: 속이기 위해 포도주를 마시지 않았고
  alternatives_korean:
  - 미혹되게 하는 포도주를 마시지 않았고
  - 속임수의 포도주를 마시지 않았고
  lexicon: BDAG
  rationale: ἀποπλάνησις의 의미 범위를 살리되, 한국어에서는 목적 표현으로 풀어 '속이기 위해'라고 옮겨 음주 절제의 도덕적 의도를 보이게 했습니다.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  english_pob_choice: anything of my neighbor
  chosen_korean: 이웃의 어떤 것도
  alternatives_korean:
  - 이웃의 어떤 소유물도
  - 이웃의 바라는 것이라면 무엇이든
  lexicon: BDAG
  rationale: 이 문구는 십계명의 탐내지 말라를 떠올리게 하므로, 소유물로 한정하지 않고 '이웃의 어떤 것도'로 넓게 살렸습니다.
- source_word: πνεῦμα τοῦ Βελίαρ
  english_pob_choice: spirit of Beliar
  chosen_korean: 벨리아르의 모든 영
  alternatives_korean:
  - 벨리알의 모든 영
  - 벨리아르의 영
  lexicon: LSJ
  rationale: 본문의 그리스어 표기 Βελίαρ를 따라 음역을 유지했고, 복수적 개입성을 드러내는 문맥에 맞게 '모든 영'으로 옮겼습니다.
- source_word: συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας
  english_pob_choice: who walks with people in simplicity of heart
  chosen_korean: 사람들과 함께 단순한 마음으로 걸으시기 때문이다
  alternatives_korean:
  - 사람들과 함께 마음의 단일함으로 걸으시기 때문이다
  - 단순한 마음을 지닌 사람들과 함께 걸으시기 때문이다
  lexicon: BDAG
  rationale: 가장 가까운 선행사인 '하늘과 땅의 하나님'을 수식하는 것으로 보고, 하나님의 동행을 드러내는 구조로 옮겼습니다.
theological_decisions:
- issue: 이사갈의 죄 인식 진술의 강도
  chosen_reading: 무죄 절대 선언이 아니라, '죽음에 이르는 죄'에 대한 자기 인식 부재로 번역했습니다.
  alternative_readings:
  - 나는 완전히 죄가 없다
  - 나는 죽음에 이르는 죄를 전혀 지은 적이 없다
  rationale: 본문은 자기증언과 한정 표현(εἰς θάνατον)을 함께 지니므로, 한국어도 이를 살려 과도한 무죄론으로 기울지 않게 했습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: '''하늘과 땅의 하나님''의 동행 표현'
  chosen_reading: 하나님께서 사람들과 함께 걸으신다고 읽었습니다.
  alternative_readings:
  - 사람들이 하나님과 함께 걸으신다
  - 단순한 마음을 지닌 사람들에 대한 일반적 교훈이다
  rationale: 문법상 가장 가까운 선행사와 서술 구조를 따라, 하나님 자신의 동행을 약속하는 진술로 번역했습니다.
  doctrine_reference: DOCTRINE.md §Original-language primacy over translation tradition
