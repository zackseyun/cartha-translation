revisions:
- from: 1. 보십시오. 여러분이 보듯이 저는 이제 백스물여섯 살이며, 죽음에 이르는 어떤 죄도 내 안에 있었다는 것을 알지 못합니다. 2. 제 아내를 제외하고는 다른 여자를 알지 못했습니다. 저는 방황하는 눈길로 성적 부도덕을 저지르지 않았습니다. 3. 저는 속이기 위해 포도주를 마시지 않았고, 이웃의 어떤 것도 탐내지 않았습니다. 4. 제 마음에 속임수가 생기지 않았고, 제 입술로 거짓도 올라오지 않았습니다. 5. 저는 고통받는 모든 사람과 함께 신음했고, 가난한 사람에게 제 빵을 나누어 주었습니다. 저는 제 모든 날 동안 경건함을 행했고, 진리를 지켰습니다. 6. 저는 온 힘을 다해 주님을 사랑했고, 그와 같이 제 모든 마음으로 모든 사람을 사랑했으니, 그것은 제 자녀들보다 더 컸습니다. 7. 너희도, 내 자녀들아, 이런 것들을 행하라. 그러면 벨리아르의 모든 영이 너희에게서 달아날 것이고, 악한 사람들의 어떤 행위도 너희를 지배하지 못할 것이다. 그리고 너희는 모든 들짐승을 굴복시킬 것이니, 너희와 함께 하늘과 땅의 하나님께서 사람들과 함께 단순한 마음으로 걸으시기 때문이다. 8. 그가 이런 말을 한 뒤에 자기 아들들에게 명하여, 그를 헤브론으로 메어 올려 그곳에서 그의 조상들과 함께 굴속에 묻으라고 하였습니다. 9. 그는 발을 뻗고 누운 뒤, 좋은 노년에 이르러 편안히 잠들었으며, 영원한 잠을 잤습니다.[a][b][c]
  to: 1. 보십시오. 여러분이 보는 바와 같이, 저는 이제 백스물여섯 살이며, 제 안에 죽음에 이르는 어떤 죄가 있음을 알지 못합니다. 2. 제 아내 외에는 다른 여자와 관계하지 않았습니다. 저는 방황하는 눈길로 성적 부도덕을 저지르지 않았습니다. 3. 저는 미혹을 위해 포도주를 마시지 않았고, 이웃의 어떤 것도 탐내지 않았습니다. 4. 제 마음에 속임수가 생기지 않았고, 제 입술을 통해 거짓이 나오지 않았습니다. 5. 저는 고통받는 모든 사람과 함께 신음했고, 가난한 사람에게 제 빵을 나누어 주었습니다. 저는 모든 날 동안 경건하게 살았으며, 진리를 지켰습니다. 6. 저는 주님을 사랑했고, 모든 사람을 온 마음으로 제 자녀들보다 더 사랑했습니다. 7. 너희도, 내 자녀들아, 이런 것들을 행하라. 그러면 벨리아르의 모든 영이 너희에게서 달아날 것이고, 악한 사람들의 어떤 행위도 너희를 지배하지 못할 것이다. 또 너희는 모든 들짐승을 굴복시킬 것이다. 이는 단순한 마음으로 사람들과 함께 걸으시는 하늘과 땅의 하나님께서 너희와 함께 계시기 때문이다. 8. 그가 이런 말을 한 뒤에 자기 아들들에게 그를 헤브론으로 옮겨, 그곳에서 그의 조상들과 함께 묻으라고 명하였습니다. 9. 그는 발을 뻗고 좋은 노년에 영원한 잠에 들었습니다.
  rationale: 원문 우선 원칙에 따라 8절의 ‘굴속에’와 9절의 ‘편안히’를 삭제하고, 근거 없는 각주 표지를 제거했습니다. 1절은 죄의 부재를 단정하는 표현이 아니라 화자의 자기 인식 진술로 유지했습니다. 3절은 ἀποπλάνησις의 의미 범위를 보존하도록 ‘미혹을 위해’로 수정했으며, 나머지 문장은 현대적인 합쇼체와 자연스러운 한국어 표현으로 다듬었습니다.
