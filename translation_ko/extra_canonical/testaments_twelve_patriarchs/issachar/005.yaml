base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005.yaml
  text: '1 Therefore[a], my children, keep the law of God, and acquire simplicity, and walk in innocence, not meddling in the deeds of your neighbor. 2 But love the Lord and your neighbor; show mercy to the poor and the weak. 3 Set your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving. 4 For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now[b]. 5 For no other portion has been given to you except the richness of the earth in the toils of its fruits. 6 For my father Jacob also blessed me with blessings of the earth and of firstfruits of produce. 7 And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord gave them their inheritance: to Levi, the priesthood; and to Judah, the kingdom. 8 Therefore obey them, and walk in the simplicity of your father[c]. [But to Gad it was given to destroy the marauding raids coming upon Israel.]'
  footnotes:
  - marker: a
    text: The final clause about Gad is textually awkward in this context and may reflect a later gloss or displaced line; it is translated here because it appears in the Greek witness.
    reason: textual_variant
  - marker: b
    text: Or 'the fatness of the earth' for 'the richness of the earth,' preserving the more literal agricultural idiom.
    reason: lexical_alternative
  - marker: c
    text: '''The holy ones from Abel until now'' likely refers to the line of accepted worshipers beginning with Abel; compare the firstfruits motif in Genesis and later biblical tradition.'
    reason: cross_reference
translation:
  language: ko
  text: 1 그러므로, 내 자녀들아, 하나님의 율법을 지키고, 단순함을 얻으며, 순수함 가운데 걸으면서 이웃의 행위에 간섭하지 마십시오. 2 그러나 주님과 이웃을 사랑하고, 가난한 사람들과 약한 사람들에게 자비를 베푸십시오. 3 농사에 몸을 굽히고, 모든 경작의 일에 힘쓰며, 감사함으로 주님께 예물을 드리십시오. 4 땅의 첫 열매로 말미암아 주님께서 여러분을 복 주실 것이니 — 그가 지금까지 아벨로부터 모든 거룩한 이들을 복 주신 것과 같습니다. 5 땅의 풍성함 외에는 여러분에게 다른 몫이 주어진 것이 없으니, 그것은 그 열매들의 수고 속에 있습니다. 6 내 아버지 야곱도 땅의 복과 첫 열매의 복으로 나를 복 주었습니다. 7 레위와 유다는 야곱의 자손들 가운데서 주님께 영광을 받았습니다. 주님께서는 그들에게 그 몫을 주셨습니다. 곧 레위에게는 제사 직분을, 유다에게는 나라를 주셨습니다. 8 그러므로 그들에게 순종하고, 여러분의 아버지의 단순함 가운데 걸으십시오. [그러나 갓에게는 이스라엘에 닥쳐오는 약탈적 침입들을 멸하는 일이 주어졌습니다.][a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμον Θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 규범
  lexicon: LSJ
  rationale: 객관적 소유 관계를 살리면서 토라적 권위를 드러내기 위해 ‘율법’을 유지했습니다.
- source_word: ἁπλότητα
  english_pob_choice: simplicity
  chosen_korean: 단순함
  alternatives_korean:
  - 순박함
  - 순전함
  - 단일성
  lexicon: LSJ
  rationale: 이 문맥의 도덕적·태도적 의미를 현대 한국어로 가장 직접적으로 옮길 수 있는 말로 보았습니다.
- source_word: ἀκακίᾳ
  english_pob_choice: innocence
  chosen_korean: 순수함
  alternatives_korean:
  - 무해함
  - 순진함
  - 악의 없음
  lexicon: LSJ
  rationale: ἁπλότης와 짝을 이루는 무해하고 깨끗한 삶의 뉘앙스를 살리되, 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: μὴ περιαργαζόμενοι τοῦ πλησίον τὰς πράξεις
  english_pob_choice: not meddling in the deeds of your neighbor
  chosen_korean: 이웃의 행위에 간섭하지 마십시오
  alternatives_korean:
  - 이웃의 일에 참견하지 마십시오
  - 이웃의 행동에 meddling 하지 마십시오
  lexicon: LSJ
  rationale: περιαργαζόμενοι의 쓸데없는 개입·참견의 뜻을 살려, 단순한 관찰이 아니라 ‘간섭’의 금지를 분명히 했습니다.
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  english_pob_choice: in the firstfruits of the produce of the land
  chosen_korean: 땅의 첫 열매로 말미암아
  alternatives_korean:
  - 땅의 첫 열매 안에서
  - 땅의 첫 소산으로
  lexicon: LSJ
  rationale: 첫 열매(firstfruits)와 땅의 소산이라는 제의적·농경적 이미지를 유지하면서 한국어 문장을 매끈하게 했습니다.
- source_word: ἱερατείαν
  english_pob_choice: the priesthood
  chosen_korean: 제사 직분
  alternatives_korean:
  - 제사장직
  - 제사직
  lexicon: LSJ
  rationale: 레위에게 부여된 기능적 역할을 분명히 하면서도, 한국어에서 다소 제도적으로 굳은 표현보다 자연스럽게 옮겼습니다.
- source_word: ἐκληροδότησεν αὐτούς
  english_pob_choice: gave them their inheritance
  chosen_korean: 그 몫을 주셨습니다
  alternatives_korean:
  - 그들을 유업으로 주셨습니다
  - 그들에게 상속 몫을 주셨습니다
  lexicon: LSJ
  rationale: 직역을 넘어서기보다 문맥상 ‘유업/몫’의 의미를 살렸고, 앞의 제사 직분과 나라를 포괄하는 표현으로 처리했습니다.
- source_word: πειρατήρια
  english_pob_choice: marauding raids
  chosen_korean: 약탈적 침입들
  alternatives_korean:
  - 약탈대들
  - 침입하는 약탈 무리들
  - 해적 떼
  lexicon: LSJ
  rationale: 현문맥이 해상 해적이 아니라 이스라엘을 향한 침탈을 가리키므로, ‘침입’으로 방향성을 살리고 ‘약탈적’으로 성격을 명시했습니다.
theological_decisions:
- issue: 주님과 이웃에 대한 사랑의 병렬 명령
  chosen_reading: 주님과 이웃을 함께 사랑하라는 윤리적 병렬로 옮겼습니다.
  alternative_readings:
  - 주님을 사랑하고 이웃도 사랑하십시오
  - 주님과 이웃을 사랑하십시오
  rationale: 그리스어의 병렬 구조를 그대로 살려, 하느님 사랑과 이웃 사랑이 분리되지 않은 언약 윤리라는 점을 유지했습니다.
  doctrine_reference: Deut 6:5; Lev 19:18; Synoptic ethical summary
- issue: 8절의 갓 관련 괄호 문장
  chosen_reading: 본문과 다소 어울리지 않는 괄호 문장을 그대로 괄호 안에 두었습니다.
  alternative_readings:
  - 생략한다
  - 본문 속에 통합한다
  rationale: 영어 POB와 그리스어 증거가 함께 보여 주는 이질성을 지우지 않기 위해, 보조적·삽입적 성격을 시각적으로 드러냈습니다.
  doctrine_reference: Textual transparency / source-critical presentation
