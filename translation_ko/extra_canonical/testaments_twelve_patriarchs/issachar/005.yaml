  to: 1 그러므로 내 자녀들아, 하나님의 율법을 지키고 순박함을 갖추며, 악의 없이 살아가고 이웃의 행위에 간섭하지 마십시오. 2 오히려 주님과 이웃을 사랑하고, 가난한 이들과 약한 이들에게 자비를 베푸십시오. 3 등을 농사일에 내맡기고 온갖 경작 일에 힘쓰며, 감사함으로 주님께 예물을 드리십시오. 4 땅에서 난 첫 열매로 주님께서 여러분에게 복을 주실 것입니다. 아벨부터 지금까지 모든 거룩한 이들에게 복을 주신 것처럼 말입니다.[c] 5 여러분에게 주어진 다른 몫은 없고, 오직 땅의 기름짐과 그 열매를 얻는 수고뿐입니다.[b] 6 나의 아버지 야곱도 땅의 복과 첫 열매의 복으로 나를 축복하셨습니다. 7 레위와 유다는 야곱의 자손들 가운데서 주님께 영광을 받았습니다. 주님께서는 그들에게 각자의 유업을 주셨으니, 레위에게는 제사장직을, 유다에게는 왕권을 주셨습니다. 8 그러므로 그들에게 순종하고, 여러분의 아버지의 순박함을 따라 살아가십시오. [그러나 갓에게는 이스라엘에 침입해 오는 약탈 무리들을 멸하는 일이 주어졌습니다.][a]
  rationale: 원문의 명령형과 농경·제의 어휘를 유지하면서, 한국어의 자연스러운 합쇼체로 다듬었습니다. 특히 5절의 배타 구문과 7절의 유업 배정 의미를 회복했고, 논쟁적인 갓 조항은 괄호와 각주로 투명하게 처리했습니다. 각주 표지는 각각 실제로 설명하는 4절, 5절, 8절의 해당 어구에 배치했습니다.
