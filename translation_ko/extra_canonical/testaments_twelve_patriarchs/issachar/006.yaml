base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b]. And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will serve their enemies. Therefore you also tell these things to your children, so that, if they sin, they may return more quickly to the Lord[c], because he is merciful and will deliver them, to bring them back into their land[d].
  footnotes:
  - marker: a
    text: Or 'guilelessness' for 'innocence' (ἀκακία), highlighting freedom from deceit rather than merely blamelessness.
    reason: lexical_alternative
  - marker: b
    text: Beliar is the Greek form found here; many readers will know the name as 'Belial.'
    reason: lexical_alternative
  - marker: c
    text: '''Return to the Lord'' carries the sense of repentance as well as restoration.'
    reason: cross_reference
  - marker: d
    text: The final clause may also be understood as 'and restore them to their land.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 내 자녀들아, 마지막 때에 너희의 아들들이 순박함을 버리고 탐욕에 붙을 것이며, 순수함[a]을 떠나 교활함으로 나아갈 것입니다. 또 주님의 계명을 버리고 벨리아르[b]에 붙을 것입니다. 그들은 농사짓는 일을 버리고 그들의 악한 꾀를 따를 것이며, 민족들 가운데 흩어져 그들의 원수들을 섬길 것입니다. 그러므로 너희도 이것들을 너희 자녀들에게 일러 주어, 그들이 죄를 지으면 더 빨리 주님께 돌아오도록[c] 하십시오. 주님은 자비로우시며, 그들을 구원하시어 그들을 그들의 땅으로 돌아오게 하실 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘순수함’(ἀκακία)은 ‘속임없음’ 또는 ‘악의 없음’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘벨리아르’는 여기의 그리스어 형태입니다. 더 널리 알려진 이름은 ‘벨리알’입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘주님께 돌아오다’에는 회개와 관계의 회복이라는 뜻이 함께 담겨 있습니다.
    reason: cross_reference
  - marker: d
    text: 마지막 구절은 ‘그들을 그들의 땅으로 회복시키실 것입니다’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁπλότης
  english_pob_choice: simplicity
  chosen_korean: 단순함
  alternatives_korean:
  - 소박함
  - 간결함
  - 한결같음
  lexicon: LSJ
  rationale: 이 단어는 이 문맥에서 분별 없는 단순성이 아니라, 분열되지 않은 한결같은 삶의 덕을 가리키므로 ‘단순함’으로 옮겨 본문 대비를 살렸습니다.
- source_word: ἀπληστία
  english_pob_choice: greed
  chosen_korean: 탐욕
  alternatives_korean:
  - 끝없는 욕심
  - 탐심
  - 욕망
  lexicon: LSJ
  rationale: 그리스어는 붙잡으려는 탐심/탐욕을 뜻하므로, 현대 한국어에서 도덕적 무게가 분명한 ‘탐욕’을 택했습니다.
- source_word: ἀκακία
  english_pob_choice: innocence
  chosen_korean: 순결함
  alternatives_korean:
  - 순수함
  - 해맑음
  - 무해함
  lexicon: LSJ
  rationale: POB의 ‘innocence’는 단순한 무죄보다 속임이 없는 상태를 뜻하므로, 윤리적 결백을 드러내는 ‘순결함’으로 옮기고, 보다 정확한 뉘앙스는 본문 대비로 유지했습니다.
- source_word: πανουργία
  english_pob_choice: cunning
  chosen_korean: 교활함
  alternatives_korean:
  - 간교함
  - 약삭빠름
  - 꾀
  lexicon: LSJ
  rationale: 이 단어는 양심 없는 영리함을 가리키므로, 죄악적 뉘앙스가 강한 ‘교활함’이 본문의 대조를 가장 분명하게 드러냅니다.
- source_word: κολληθήσονται τῷ Βελίαρ
  english_pob_choice: attach themselves to Beliar
  chosen_korean: 벨리아르에 붙을 것입니다
  alternatives_korean:
  - 벨리아르에게 달라붙을 것입니다
  - 벨리아르와 결합할 것입니다
  - 벨리알에 붙을 것입니다
  lexicon: LSJ
  rationale: 반복되는 κολλάω의 결속 이미지를 살려 ‘붙다’를 유지했고, 그리스어 증언에 있는 형태를 따라 ‘벨리아르’로 음역했습니다.
- source_word: δουλεύσουσιν
  english_pob_choice: will serve
  chosen_korean: 섬길 것입니다
  alternatives_korean:
  - 종노릇할 것입니다
  - 노예가 될 것입니다
  - 예속될 것입니다
  lexicon: LSJ
  rationale: 문맥상 이방 민족들 가운데서의 종속을 뜻하지만, 주동적으로 ‘섬기다’라는 한국어는 피지배 상태를 자연스럽게 담아내므로 POB의 선택을 따랐습니다.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  english_pob_choice: return to the Lord
  chosen_korean: 주님께 돌아오게 하십시오
  alternatives_korean:
  - 주님께 돌아서게 하십시오
  - 주님께 회개하게 하십시오
  - 주님께 돌아가게 하십시오
  lexicon: LSJ
  rationale: ἐπιστρέφω는 회개와 복귀를 함께 담으므로, 단순 이동보다 관계 회복을 살리는 ‘돌아오다’로 옮겼습니다. '주님'은 이 문맥의 κύριος를 지칭합니다.
- source_word: τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν
  english_pob_choice: to bring them back into their land
  chosen_korean: 자기들의 땅으로 돌아오게 하실 것입니다
  alternatives_korean:
  - 그들의 땅으로 되돌리게 하실 것입니다
  - 그들의 땅으로 회복시키실 것입니다
  - 그들의 땅으로 돌려보내실 것입니다
  lexicon: LSJ
  rationale: 압축된 부정사 구문을 목적/결과의 의미로 풀어, 귀환과 회복의 복합 의미를 자연스럽게 살렸습니다.
theological_decisions:
- issue: ἐν ἐσχάτοις καιροῖς의 시간 표현
  chosen_reading: 마지막 때에
  alternative_readings:
  - 후일에
  - 말세에
  - 끝날에
  rationale: 장차 올 종말론적 시기를 가리키되, 과도하게 체계화하지 않기 위해 ‘마지막 때에’를 택했습니다.
  doctrine_reference: 예언적 시간표현의 긴장 보존
- issue: 주님의 계명을 버리고 벨리아르에 붙는 대조
  chosen_reading: 주님의 계명을 버리고 벨리아르에 붙을 것입니다
  alternative_readings:
  - 주님의 계명을 버리고 벨리알에게 붙을 것입니다
  - 주님의 계명을 떠나 벨리아르를 따를 것입니다
  rationale: 계명에서 벨리아르로의 결속 이동을 그대로 드러내어, 단순한 도덕적 타락이 아니라 충성의 전환이라는 본문의 신학을 보존했습니다.
  doctrine_reference: 언약적 충성/배교의 대비 보존
