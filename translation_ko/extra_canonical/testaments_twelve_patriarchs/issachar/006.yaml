revisions:
- from: 그러므로 내 자녀들아, 마지막 때에 너희의 아들들이 단순함을 버리고 탐욕에 붙으며, 순결함을 떠나 교활함에 가까이할 것이며, 주님의 계명을 버리고 벨리아르에 붙을 것입니다. 또한 농사짓는 일을 버리고 자기들의 악한 꾀를 따르며, 민족들 가운데 흩어지고 자기들의 원수들을 섬길 것입니다. 그러므로 너희도 이 말을 너희 자녀들에게 말하여, 그들이 죄를 지을 때에 더 빨리 주님께 돌아오게 하십시오. 그분은 자비로우시며, 그들을 건져내어 자기들의 땅으로 돌아오게 하실 것입니다.[a][b][c][d]
  to: 그러므로 내 자녀들아, 마지막 때에 너희의 아들들이 순박함을 버리고 탐욕에 붙을 것이며, 순수함[a]을 떠나 교활함으로 나아갈 것입니다. 또 주님의 계명을 버리고 벨리아르[b]에 붙을 것입니다. 그들은 농사짓는 일을 버리고 그들의 악한 꾀를 따를 것이며, 민족들 가운데 흩어져 그들의 원수들을 섬길 것입니다. 그러므로 너희도 이것들을 너희 자녀들에게 일러 주어, 그들이 죄를 지으면 더 빨리 주님께 돌아오도록[c] 하십시오. 주님은 자비로우시며, 그들을 구원하시어 그들을 그들의 땅으로 돌아오게 하실 것입니다.[d]
