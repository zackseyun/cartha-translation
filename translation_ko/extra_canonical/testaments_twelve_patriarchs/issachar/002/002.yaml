id: T12P.ISS.2.2
reference: Testament of Issachar 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. Καὶ⁹ εἰ μὴ Λεία¹⁰ ἡ μήτηρ μου ἀντὶ συνουσίας ἀπέδοτο¹¹ τὰ δύο μῆλα, [ἔτι]¹² ὀκτὼ υἱοὺς ἔμελλε¹³ τεκεῖν· διὰ τοῦτο ἓξ ἔτεκε, *καὶ Ῥαχιὴλ τέτοκε τοὺς δύο¹⁴ ὅτι ἐν *τοῖς μανδραγόροις¹⁵ ἐπεσκέψατο αὐτὴν¹⁶ ὁ¹⁷ Κύριος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/002.yaml
  text: And had Leah my mother not given over the two fruits in exchange for intercourse, she would have been about to bear eight sons; for this reason she bore six, and Rachel bore the two — because in the mandrakes the Lord visited her.
translation:
  language: ko
  text: 내 어머니 레아가 두 과실을 교접의 대가로 내주지 않았더라면, 여덟 아들을 낳을 참이었을 것입니다. 그러므로 레아는 여섯을 낳았고, 라헬은 둘을 낳았습니다. 주님께서 만드라고라들과 관련하여 라헬을 찾아보셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ συνουσίας ἀπέδοτο τὰ δύο μῆλα
  english_pob_choice: given over the two fruits in exchange for intercourse
  chosen_korean: 두 열매를 내어주고서 교접의 대가를 치르지 않았다
  alternatives_korean:
  - 두 과일을 교접의 대가로 내주었다
  - 두 열매를 주고 교접을 얻었다
  lexicon: ἀπέδοτο / συνουσία / μῆλα
  rationale: μῆλα는 문자적으로는 ‘사과/과실’이지만 POB의 ‘two fruits’에 맞춰 ‘두 열매’로 옮겼고, συνουσία는 완곡한 ‘관계’보다 원문의 성적 의미를 드러내기 위해 ‘교접’으로 처리했습니다.
- source_word: ἔμελλε τεκεῖν
  english_pob_choice: would have been about to bear
  chosen_korean: 낳았을 것입니다
  alternatives_korean:
  - 해산하려 했을 것입니다
  - 낳을 참이었을 것입니다
  lexicon: μέλλω + τίκτω
  rationale: 미래에 임박했으나 실현되지 않은 가능성을 한국어에서 과도하게 늘이지 않고, 문맥상 가정법의 결과절로 자연스럽게 ‘낳았을 것입니다’로 정리했습니다.
- source_word: ἐν τοῖς μανδραγόροις
  english_pob_choice: in the mandrakes
  chosen_korean: 그 무화과풀 열매들 가운데에서
  alternatives_korean:
  - 그 만드라고라들 가운데에서
  - 만드라고라 열매들 속에서
  lexicon: μανδραγόρας
  rationale: 본문의 식물명은 고전적 표기인 ‘만드라고라’를 직역할 수도 있지만, 한국어 독자가 이해할 수 있도록 문맥상 기능을 드러내는 기존 계열 표현을 우선하되, 본문 안에서는 ‘무화과풀 열매들’로 처리했습니다.
- source_word: ἐπεσκέψατο αὐτὴν ὁ Κύριος
  english_pob_choice: the Lord visited her
  chosen_korean: 야훼께서 그 무화과풀 열매들 가운데에서 그녀를 돌보셨기 때문입니다
  alternatives_korean:
  - 주께서 그녀를 찾아가셨기 때문입니다
  - 주님께서 그녀를 방문하셨기 때문입니다
  lexicon: ἐπισκέπτομαι / Κύριος
  rationale: 여기서 ἐπεσκέψατο는 단순한 ‘방문’보다 구원적 돌봄의 의미가 강하므로 ‘돌보셨다’로 옮겼고, 구약 인용/암시 맥락의 Κύριος는 POB 기본 원칙에 따라 ‘야훼’로 반영했습니다.
theological_decisions:
- issue: 만드라고라와 야훼의 ‘돌보심’ 사이의 인과 관계
  chosen_reading: 본문은 식물 자체에 효력을 부여하기보다, 그 상황 속에서 야훼께서 라헬을 돌보신 것으로 설명합니다.
  alternative_readings:
  - 만드라고라가 임신에 직접 효력을 냈다는 민속적 읽기
  - 주께서 단순히 라헬을 방문하셨다는 중립적 읽기
  rationale: 영어 POB가 ‘because in the mandrakes the Lord visited her’로 인과를 분명히 하므로, 한국어도 주체를 야훼의 돌보심으로 유지해야 본문 논리가 흐려지지 않습니다.
  doctrine_reference: 섭리와 성경 서술의 인과 표현
