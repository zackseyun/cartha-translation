    issue: 인용 구조가 중복되고 문체가 혼재함
    rationale: ‘말하되’ 뒤에 직접 인용을 둔 뒤 다시 ‘라고 하였습니다’를 붙이면 동일한 발화 표지가 겹칩니다. 또한 ‘말하되’는 현대 표준어 합쇼체 본문에 고풍스럽습니다.
  - severity: low
    issue: ‘그러므로 그때’의 어순이 부자연스러움
    rationale: Τότε γοῦν의 연결 기능은 살리되, 현대 한국어에서는 ‘그러던 때에’가 더 자연스럽습니다.
