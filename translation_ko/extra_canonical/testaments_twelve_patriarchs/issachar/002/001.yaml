  text: II. Τότε Γοὖν¹ ὤφθη τῷ² Ἰακώβ³ Γἄγγελος Κυρίου καὶ εἶπε λέγων⁴, *ὅτι τέκνα τέξει Ῥαχήλ⁵, *ἐπειδὴ κατέπτυσεν⁶ συνουσίαν⁷ ἀνδρὸς καὶ ἐξελέξατο τὴν⁸ ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/001.yaml
  text: Then an angel of the Lord appeared to Jacob, saying, “Rachel will bear children, because she despised intercourse with a husband and chose self-control.”
translation:
  language: ko
  text: 그러던 때에 주의 천사가 야곱에게 나타나 이렇게 말씀하셨습니다. “라헬은 자녀들을 낳을 것입니다. 이는 그녀가 남편과의 성관계를 멸시하고 절제를 택했기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  english_pob_choice: an angel of the Lord
  chosen_korean: 주의 천사
  alternatives_korean:
  - 주님의 천사
  - 하나님의 천사
  lexicon: ἄγγελος / κύριος
  rationale: Greek의 관용적 연결을 살려 ‘주의 천사’로 옮기되, 본문이 말하는 주의 소유격 관계를 유지했습니다.
- source_word: ὤφθη
  english_pob_choice: appeared
  chosen_korean: 나타나
  alternatives_korean:
  - 보였다
  - 현현하였다
  lexicon: ὁράω의 수동형
  rationale: 시현적/현현적 의미를 담되 현대 한국어에서 자연스러운 ‘나타나’로 옮겼습니다.
- source_word: τέκνα τέξει
  english_pob_choice: will bear children
  chosen_korean: 자녀들을 낳을 것입니다
  alternatives_korean:
  - 자녀를 낳을 것입니다
  - 아이들을 낳을 것입니다
  lexicon: τίκτω
  rationale: 복수 표지를 살려 ‘자녀들을’로 옮겼고, 특정 수를 추가하지 않기 위해 ‘두’는 넣지 않았습니다.
- source_word: συνουσίαν ἀνδρὸς
  english_pob_choice: intercourse with a husband
  chosen_korean: 남편과의 성관계
  alternatives_korean:
  - 남편과의 동침
  - 남편과의 관계
  lexicon: συνουσία / ἀνήρ
  rationale: 원문의 직접적·노골적 표현을 약화하지 않기 위해 관계를 우회하지 않고 성적 결합을 드러내는 표현을 택했습니다.
- source_word: κατέπτυσεν ... καὶ ἐξελέξατο τὴν ἐγκράτειαν
  english_pob_choice: despised ... and chose self-control
  chosen_korean: 멸시하고 절제를 택했기 때문입니다
  alternatives_korean:
  - 경멸하고 절제를 택했기 때문입니다
  - 싫어하고 절제를 선택했기 때문입니다
  lexicon: καταπτύω / ἐγκράτεια
  rationale: ‘멸시하다’는 동사의 강한 평가를 살리고, ἐγκράτεια는 금욕적 뉘앙스를 살리면서도 한국어 독자가 이해할 수 있게 ‘절제’로 옮겼습니다.
theological_decisions:
- issue: 라헬이 자녀를 낳는 이유를 설명하는 문장 구성
  chosen_reading: 본문의 인과를 그대로 따라, 라헬의 절제 선택이 자녀 출산과 연결된다는 진술을 유지했습니다.
  alternative_readings:
  - 보다 완곡하게 성윤리 일반 원칙으로 풀어쓰기
  - 인과를 약화시켜 단순 배경 설명으로 처리
  rationale: 원문은 인과 접속사 ἐπειδὴ로 분명한 이유를 제시하므로, 해석을 완화하지 않고 직설적으로 보존해야 합니다.
  doctrine_reference: 본문 주해 원칙
