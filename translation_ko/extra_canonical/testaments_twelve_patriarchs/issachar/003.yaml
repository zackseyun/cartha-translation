base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003.yaml
  text: 'For if Leah my mother had not given up marital union in exchange for the two apples[a], she would still have been destined to bear eight sons. Therefore she bore six, and Rachel bore the two, because through the mandrakes the Lord visited her. For he saw that Leah desired to be with Jacob for the sake of children, and not for the sake of pleasure. For on the next day also she again gave Jacob over. Therefore through the mandrakes the Lord listened to Rachel. For although she longed for these, she did not eat them, but dedicated them in the house of the Lord, after bringing them to the priest.


    When therefore I grew to manhood, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers. And my father blessed me, seeing that I walked before him in simplicity. And I was not meddlesome in my actions, nor envious and malicious toward my neighbor. I never slandered anyone, nor did I criticize a man''s way of life. At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman''s pleasure; rather, because of my toil, sleep came over me. And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father. And the Lord multiplied my good things ten thousandfold[d][c][b], and my father likewise increased the good things for me twofold.'
  footnotes:
  - marker: a
    text: Greek 'apples'; the surrounding tradition and the next lines identify the plants as mandrakes.
    reason: lexical_alternative
  - marker: b
    text: Or 'evil-eyed' or 'begrudging' toward my neighbor.
    reason: lexical_alternative
  - marker: c
    text: The Greek includes 'in the house of the Lord' and 'after bringing them to the priest,' language that may reflect a later cultic framing of the patriarchal story rather than the Genesis narrative itself.
    reason: textual_variant
  - marker: d
    text: '''Every firstborn'' may broadly denote first issue or first produce, not only animal offspring.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 성년이 되었을 때, 내 자녀들아, 나는 마음의 올곧음으로 살아갔으며, 아버지와 형제들을 위해 농사일을 하였습니다. 아버지는 내가 자기 앞에서 단순함으로 살아가는 것을 보시고 나를 축복하셨습니다. 나는 내 일에 쓸데없이 간섭하지 않았고, 이웃을 시기하거나 그에게 악의를 품지도 않았습니다. 나는 누구에 대해서도 결코 험담하지 않았고, 어느 사람의 삶도 흠잡지 않았습니다. 나는 서른다섯 살에 아내를 맞이하였습니다. 노동이 내 힘을 소모하였으므로, 나는 여자와의 쾌락을 생각하지 않았습니다. 오히려 수고 때문에 잠이 나를 이겼습니다. 아버지는 나의 단순함을 언제나 기뻐하셨습니다. 내가 모든 첫 소산을 제사장을 통하여 주님께 바치고, 그다음에는 아버지께도 바쳤기 때문입니다.[a] 주님께서는 내 손에 있는 좋은 것들을 만 배로 불리셨습니다. 야곱, 곧 내 아버지도 하나님께서 나의 단순함과 함께 일하신다는 것을 알았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 '모든 첫 소산'은 맏아들 또는 가축의 첫 새끼만이 아니라, 첫 산물 전반을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 문장(“주님께서는 … 알았습니다”)은 이 그리스어 판본에서 비평적 괄호 안에 제시되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: εὐθύτητι καρδίας
  english_pob_choice: uprightness of heart
  chosen_korean: 마음의 올곧음
  alternatives_korean:
  - 마음의 정직함
  - 마음의 바름
  - 마음의 진실함
  lexicon: LSJ
  rationale: ‘카르디아’의 내면성은 ‘마음’으로 살리고, 도덕적 직선성과 성실함은 ‘올곧음’으로 간결하게 옮겼습니다.
- source_word: ἁπλότης / ἁπλότητι
  english_pob_choice: simplicity
  chosen_korean: 단순함
  alternatives_korean:
  - 소박함
  - 순전함
  - 성실함
  lexicon: BDAG
  rationale: 이 장의 핵심 덕목인 ἁπλότης를 일관되게 ‘단순함’으로 옮겨, 번역어의 흐름보다 주제적 반복을 살렸습니다.
- source_word: περίεργος
  english_pob_choice: meddlesome
  chosen_korean: 간섭하는 사람이 아니었고
  alternatives_korean:
  - 오지랖 넓은
  - 참견하는
  - 쓸데없이 관여하는
  lexicon: BDAG
  rationale: 단순한 호기심이 아니라 남의 일에 지나치게 끼어드는 태도를 가리키므로, ‘간섭하는’으로 풀어 자연스럽게 표현했습니다.
- source_word: φθονερὸς καὶ βάσκανος
  english_pob_choice: envious and malicious
  chosen_korean: 시기하며 악의적이지도 않았습니다
  alternatives_korean:
  - 질투하며 악한 눈을 품지 않았습니다
  - 시기하고 악한 눈을 갖지 않았습니다
  - 질투하며 악의가 없었습니다
  lexicon: BDAG/LSJ
  rationale: φθονερὸς의 ‘시기’와 βάσκανος의 악한/해로운 태도를 함께 살려, 문맥에 맞는 도덕적 악의로 옮겼습니다.
- source_word: πᾶν πρῶτον γέννημα
  english_pob_choice: every firstborn
  chosen_korean: 모든 첫 열매
  alternatives_korean:
  - 모든 첫 태생
  - 모든 첫 소산
  - 첫것마다
  lexicon: LSJ
  rationale: 이 구절은 제의적 문맥에서 첫 산출물 전체를 가리킬 수 있으므로, ‘첫 열매’로 넓게 옮기되 제사 맥락을 유지했습니다.
- source_word: ἐμυριοπλασίασε
  english_pob_choice: multiplied ... ten thousandfold
  chosen_korean: 만 배로 불리셨고
  alternatives_korean:
  - 엄청나게 불리셨고
  - 헤아릴 수 없이 불리셨고
  - 무수히 불리셨고
  lexicon: LSJ
  rationale: 복합 동사의 과장된 확장을 한국어의 자연스러운 수사로 살려, ‘만 배로’로 강도를 유지했습니다.
theological_decisions:
- issue: ‘주님께’ 바친 뒤 ‘내 아버지께’도 바친다는 제의적·가족적 순서
  chosen_reading: 그대로 옮겨, 제사장과 주님을 거치는 제의성과 아버지에게 드리는 가족적 경계를 모두 드러냈습니다
  alternative_readings:
  - ‘주님께’만 강조하고 뒤의 아버지 언급을 완화함
  - 제의적 표현을 가족적 감사의 말로 순화함
  rationale: 원문은 제의 행위와 부친에 대한 공경을 나란히 배치하므로, 어느 쪽도 희석하지 않고 모두 보존하는 것이 출처 충실성에 맞습니다.
  doctrine_reference: 'PHILOSOPHY.md: source transparency and documented tensions'
- issue: ὁ Θεὸς συνεργεῖ τῇ ἁπλότητί μου
  chosen_reading: ‘하나님이 도우신다’로 옮기되, 단순함과 신적 협력을 직접 연결했습니다
  alternative_readings:
  - ‘하나님이 내 단순함과 함께 일하신다’
  - ‘하나님이 내 단순함에 협력하신다’
  rationale: 협력(συνεργεῖ)은 직역하면 서툴 수 있어 한국어에서는 ‘도우신다’가 자연스럽지만, 주어-목적어 관계가 단순함과 연결된다는 점은 문맥상 유지했습니다.
  doctrine_reference: 성경 한국어 문체의 자연스러움과 원문 의미 보존의 균형
