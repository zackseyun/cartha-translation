review_pass:
  verdict: revise
  source_fidelity: ἐπιστρέψαι αὐτούς εἰς τὴν γῆν αὐτῶν은 그들을 그들의 땅으로 되돌아가게/돌려보내는 뜻입니다. 초안의 ‘돌이키게 하실 것입니다’는 한국어에서 회개나 마음의 전환을 연상하기 쉬우며, 귀환의 목적지를 자연스럽게 연결하지 못합니다. ‘구해 내어 … 돌려보내실 것입니다’는 ἐξελεῖται와 귀환의 목적 구문을 보존합니다.
  naturalness: ‘자비로우시며’와 ‘그들을 구해 내어 … 돌려보내실 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘돌려보내다’는 사람을 본래 있던 곳으로 돌아가게 한다는 문맥에 적절하며, ‘그들의 땅으로’와 매끄럽게 결합됩니다.
  terminology: ἐλεήμων은 ‘자비로우시며’, ἐξαιρέω는 ‘구해 내어’, γῆ는 ‘땅’으로 옮기는 것이 적절합니다. ‘회복시키다’는 가능한 해석이지만 본문의 직접적인 귀환 동작보다 해석적이므로 각주에만 제시합니다.
  issues:
  - severity: medium
    issue: ‘돌이키게 하실 것입니다’의 의미 및 결합이 부자연스럽습니다.
    rationale: 한국어 ‘돌이키다’는 흔히 마음·행동을 바꾸거나 회개하는 뜻으로 쓰이며, ‘그들의 땅으로’와 결합할 때 귀환시키는 동작이 선명하지 않습니다. ἐπιστρέψαι αὐτούς εἰς τὴν γῆν αὐτῶν의 공간적 귀환을 드러내도록 ‘그들의 땅으로 돌려보내실’로 고칩니다.
