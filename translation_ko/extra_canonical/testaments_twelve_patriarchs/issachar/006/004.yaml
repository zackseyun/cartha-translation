id: T12P.ISS.6.4
reference: Testament of Issachar 6:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 4. Ὅτι ἐλεήμων ἐστὶ καὶ ἐξελεῖται²⁰ αὐτοὺς *τοῦ ἐπιστρέψαι αὐτοὺς²¹ εἰς τὴν γῆν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/004.yaml
  text: because he is merciful and will deliver them, to turn them back to their land[d].
  footnotes:
  - marker: d
    text: The final clause may also be understood as 'and restore them to their land.'
    reason: alternative_reading
translation:
  language: ko
  text: 그분은 자비로우시며, 그들을 구해 내어 그들의 땅으로 돌려보내실 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: 마지막 구절은 “그들을 그들의 땅으로 회복시키실 것입니다”로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεήμων
  english_pob_choice: he is merciful
  chosen_korean: 자비로우시며
  alternatives_korean:
  - 긍휼이 많으시며
  - 불쌍히 여기시며
  lexicon: ἐλεήμων
  rationale: 하나님의 성품을 나타내는 형용사로서, POB의 'merciful'을 자연스럽고 격식 있게 옮겨 자비의 성격을 분명히 했습니다.
- source_word: ἐξελεῖται
  english_pob_choice: will deliver them
  chosen_korean: 그들을 구해 내시고
  alternatives_korean:
  - 그들을 건져 내시고
  - 그들을 구원하시고
  lexicon: ἐξαιρέω
  rationale: 단순한 '구하다'보다 위기에서 '건져 내다/구해 내다'의 구출 뉘앙스가 더 가깝고, 본문 흐름상 해방 행위를 잘 드러냅니다.
- source_word: ἐπιστρέψαι
  english_pob_choice: to turn them back
  chosen_korean: 돌이키게 하실 것입니다
  alternatives_korean:
  - 되돌리게 하실 것입니다
  - 다시 돌아오게 하실 것입니다
  lexicon: ἐπιστρέφω
  rationale: POB의 수정 반영처럼 'turn back'의 직접적 의미를 살리되, 목적절로서 자연스럽게 '돌이키게 하실 것입니다'로 옮겼습니다.
- source_word: εἰς τὴν γῆν αὐτῶν
  english_pob_choice: to their land
  chosen_korean: 그들의 땅으로
  alternatives_korean:
  - 그들 자신의 땅으로
  - 그 땅으로
  lexicon: γῆ
  rationale: 문맥상 단순한 토지가 아니라 조상적 귀환의 대상인 'their land'이므로, 소유를 분명히 한 '그들의 땅'으로 옮겼습니다.
theological_decisions:
- issue: 회복의 목적절 표현
  chosen_reading: 구출과 귀환은 그분의 자비에서 나오는 동일한 구원 행위의 두 측면으로 읽었습니다.
  alternative_readings:
  - '''그들을 구해 내시고''와 ''그들을 그들의 땅으로 돌이키게 하실 것입니다''를 분리된 두 행동으로 읽는 방식'
  rationale: 그리스어는 자비와 구출을 이유로 제시한 뒤 목적을 덧붙여, 단순한 이동이 아니라 회복과 귀환의 신학을 함께 드러냅니다.
  doctrine_reference: 회복/귀환 신학, 하나님의 자비와 구원 행위
