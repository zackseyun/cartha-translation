id: T12P.ISS.6.3
reference: Testament of Issachar 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. Καὶ ὑμεῖς οὖν εἴπατε ταῦτα¹⁵ τοῖς τέκνοις ὑμῶν, ὅπως, ἐὰν ἁμάρτωσι¹⁶, τάχιον¹⁷ ἐπιστρέψωσι¹⁸ πρὸς τὸν¹⁹ Κύριον,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/003.yaml
  text: Therefore you also tell these things to your children, so that, if they sin, they may turn back more quickly to the Lord[c],
  footnotes:
  - marker: c
    text: '''Return to the Lord'' carries the sense of repentance as well as restoration.'
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 너희도 그들이 죄를 짓거든 더 빨리 주님께로 돌이키도록 이 말들을 너희 자녀들에게 말하십시오.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ‘주님께로 돌이키다’는 회개뿐 아니라 회복의 의미도 지닙니다.
    reason: ἐπιστρέφω의 돌이킴이 지닌 회개와 회복의 함의를 설명하며, 영어 POB 각주 c에 대응합니다.
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν εἴπατε
  english_pob_choice: Therefore you also tell
  chosen_korean: 그러므로 너희도 이 말들을 … 말하여
  alternatives_korean:
  - 그러므로 너희도 말하십시오
  - 그렇다면 너희도 이 일들을 말하십시오
  lexicon: εἴπατε, οὖν
  rationale: οὖν의 연결을 ‘그러므로’로 살리고, 명령형 εἴπατε를 현대 합쇼체 명령으로 옮겼습니다. ‘이 말들’은 뒤의 ταῦτα를 가리켜 내용의 집합성을 유지합니다.
- source_word: τοῖς τέκνοις ὑμῶν
  english_pob_choice: to your children
  chosen_korean: 너희 자녀들에게
  alternatives_korean:
  - 너희 아이들에게
  - 너희 자손들에게
  lexicon: τέκνα
  rationale: τέκνα는 문맥상 가족의 자녀를 가리키므로 가장 직접적인 ‘자녀들’로 옮겼습니다.
- source_word: ἐὰν ἁμάρτωσι
  english_pob_choice: if they sin
  chosen_korean: 그들이 죄를 짓거든
  alternatives_korean:
  - 그들이 죄를 범하거든
  - 그들이 죄를 지으면
  lexicon: ἁμαρτάνω
  rationale: 조건절의 미래적 가능성을 살리기 위해 ‘-거든’을 썼고, ἁμάρτωσι의 행위성을 유지하려고 ‘죄를 짓다’로 번역했습니다.
- source_word: τάχιον ἐπιστρέψωσι
  english_pob_choice: may turn back more quickly
  chosen_korean: 더 빨리 … 돌이키게 하십시오
  alternatives_korean:
  - 더 속히 … 돌아서게 하십시오
  - 더 빨리 … 회개하게 하십시오
  lexicon: τάχιον, ἐπιστρέφω
  rationale: latest audit가 ‘turn back’로 보정한 ἐπιστρέφω의 회심·돌이킴 뉘앙스를 살리기 위해 ‘돌이키다’를 택했습니다. τάχιον은 비교급적 부사로 ‘더 빨리’로 옮겼습니다.
- source_word: πρὸς τὸν Κύριον
  english_pob_choice: to the Lord
  chosen_korean: 주님께로
  alternatives_korean:
  - 주님께
  - 주께로
  lexicon: κύριος
  rationale: 종착점이 아니라 방향성을 지닌 πρὸς를 반영해 ‘-께로’를 사용했습니다. 문맥상 경건한 호칭으로 ‘주님’을 택했습니다.
theological_decisions:
- issue: ἐπιστρέφω의 회개와 회복 뉘앙스
  chosen_reading: ‘돌이키다’로 번역해 회개와 관계 회복의 두 층위를 함께 드러냈습니다.
  alternative_readings:
  - 단순히 ‘돌아가다’로 처리
  - 직접적으로 ‘회개하다’로 의역
  rationale: POB의 각주가 지적하듯 이 표현은 단순 이동이 아니라 하나님께로의 회복적 전환을 포함합니다. 한국어 ‘돌이키다’가 그 긴장을 비교적 정확히 보존합니다.
  doctrine_reference: 회개와 회복
