  lexicon: ἀπληστία
  rationale: 단순한 욕심보다 강한 도덕적·신학적 뉘앙스를 지닌 ‘탐욕’이 적절합니다.
- source_word: ἀκακία
  english_pob_choice: innocence
  chosen_korean: 무죄함
  alternatives_korean:
