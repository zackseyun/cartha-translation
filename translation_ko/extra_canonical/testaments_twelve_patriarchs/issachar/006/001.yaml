  alternatives_korean:
  - 주님의
  - 야훼의
  lexicon: κύριος
  rationale: 이 본문은 후기 유대 문헌의 일반적 주석적 용례이므로, POB의 통상 표기인 ‘주님’을 유지했습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  lexicon: Βελίαρ
  rationale: 본문이 가진 그리스어 형태를 그대로 반영해 ‘벨리아르’로 옮기고, 익숙한 변형형은 각주로 처리했습니다.
theological_decisions:
- issue: 마지막 때의 윤리적 타락 서술과 소속의 전이
  chosen_reading: 아들들이 단순함과 무죄함을 버리고 탐욕과 간사함, 결국 벨리아르에게 붙는다는 대비를 직설적으로 살렸습니다.
  alternative_readings:
  - 완화하여 도덕적 퇴락 일반으로 옮김
  - ‘붙다’를 ‘섬기다’로 해석함
  rationale: 원문은 단순한 품성 변화가 아니라 충성 대상의 이동을 보여 주므로, 반복되는 ‘달라붙다’의 이미지를 보존했습니다.
  doctrine_reference: 악에 대한 소속 전이와 종말론적 경고의 문맥
- issue: ἀκακία의 의미 범위
  chosen_reading: 본문은 ‘무죄함’을 채택하되, 각주에서 ‘guilelessness’ 가능성을 밝혔습니다.
  alternative_readings:
  - ‘순진무구함’으로 의역
  - ‘무해함’으로 완화
  rationale: 원문의 윤리적 결함 없음과 속임수 부재를 함께 시사하는 단어이므로, 본문과 각주로 의미 폭을 함께 보존하는 것이 적절합니다.
  doctrine_reference: 인격적 순전함과 속임수의 반대 개념
