  to: 그들은 농사짓는 일을 버리고 그들의 악한 계략을 따를 것이며, 민족들 가운데 흩어질 것이며, 그들의 원수들에게 종노릇할 것입니다.
  rationale: 미래 시제의 병렬을 분명히 하고, δουλεύσουσιν의 강제적 예속 의미를 ‘종노릇할 것입니다’로 구체화했습니다. 원문에 없는 강조인 ‘여러’는 피했으며, 대응 각주가 없는 표지는 제거했습니다.
