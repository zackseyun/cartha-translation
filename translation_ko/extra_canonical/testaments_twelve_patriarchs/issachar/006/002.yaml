id: T12P.ISS.6.2
reference: Testament of Issachar 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. Καὶ ἀφέντες⁷ τὸ¹⁰ γεωργεῖν¹¹ ἐξακολουθήσουσι¹² τοῖς Γπονηροῖς¹¹³ διαβουλίοις αὐτῶν καὶ διασπαρήσονται ἐν τοῖς ἔθνεσιν καὶ δουλεύσουσιν¹⁴ τοῖς ἐχθροῖς αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/002.yaml
  text: And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will slave for their enemies.
translation:
  language: ko
  text: 그들은 농사짓는 일을 버리고 그들의 악한 계략을 따를 것이며, 민족들 가운데 흩어질 것이며, 그들의 원수들에게 종노릇할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες τὸ γεωργεῖν
  english_pob_choice: And leaving farming
  chosen_korean: 농사짓는 일을 버리고
  alternatives_korean:
  - 농사를 떠나고
  - 경작하는 일을 버리고
  lexicon: ἀφίημι + γεωργεῖν
  rationale: geōrgein은 단순한 ‘일’보다 농사·경작을 가리키므로, 한국어로는 자연스러운 ‘농사짓는 일’을 택했습니다.
- source_word: τοῖς πονηροῖς διαβουλίοις αὐτῶν
  english_pob_choice: their evil schemes
  chosen_korean: 그들의 악한 음모를
  alternatives_korean:
  - 그들의 악한 계획을
  - 그들의 악한 꾀를
  lexicon: πονηρός + διαβούλιον
  rationale: διαβούλια는 단순한 생각보다 의도적인 모의·음모의 뉘앙스가 강하므로 ‘음모’로 옮겼습니다.
- source_word: διασπαρήσονται ἐν τοῖς ἔθνεσιν
  english_pob_choice: they will be scattered among the nations
  chosen_korean: 여러 민족들 가운데로 흩어지고
  alternatives_korean:
  - 민족들 가운데 흩어지고
  - 열국 가운데로 흩어지고
  lexicon: διασπείρω + ἔθνη
  rationale: ἔθνη는 이 문맥에서 ‘민족들/열국들’을 뜻하므로, 자연스러운 복수 표현인 ‘여러 민족들 가운데로’로 살렸습니다.
- source_word: δουλεύσουσιν τοῖς ἐχθροῖς αὐτῶν
  english_pob_choice: they will slave for their enemies
  chosen_korean: 그들의 원수들에게 노예가 될 것입니다
  alternatives_korean:
  - 그들의 원수들을 섬기게 될 것입니다
  - 그들의 원수들에게 종살이하게 될 것입니다
  lexicon: δουλεύω
  rationale: POB가 최신 보정에서 serve를 slave로 바꾼 점을 반영해, 종속 상태를 분명히 드러내는 ‘노예가 될 것입니다’를 선택했습니다.
theological_decisions:
- issue: δουλεύσουσιν의 종속성 표현
  chosen_reading: 도덕적 봉사보다 강제적 종속 상태를 드러내는 번역을 택했습니다.
  alternative_readings:
  - 섬기게 될 것입니다
  - 종살이하게 될 것입니다
  rationale: POB의 auditable revision이 이미 ‘slave’로 수정한 만큼, 본문이 말하는 굴복·예속의 강도를 희석하지 않도록 했습니다.
  doctrine_reference: 사회적·정치적 예속을 가리키는 어휘 선택
