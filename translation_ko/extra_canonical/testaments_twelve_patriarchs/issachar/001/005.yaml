  text: Now these were fragrant fruits, which grow in the land of Haran below a watercourse.
translation:
  language: ko
  text: 그것들은 하란 땅의 물길 아래쪽에서 자라는 향기로운 열매였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῆλα εὔοσμα
  english_pob_choice: fragrant fruits
  chosen_korean: 향기로운 열매
  alternatives_korean:
  - 향긋한 열매
  - 좋은 향이 나는 열매
  - 달콤한 향의 열매
  lexicon: μῆλα / εὔοσμα
  rationale: εὔοσμα는 단순한 ‘좋은 냄새’보다 ‘향기로운’이 자연스럽고, μῆλα는 여기서 일반적 ‘열매’로 옮기는 것이 문맥상 무난합니다.
- source_word: ἐν τῇ γῇ Χαράν
  english_pob_choice: in the land of Haran
  chosen_korean: 하란에서
  alternatives_korean:
  - 하란 땅에서
  - 하란 지역에서
  - 가나안 땅 하란에서
  lexicon: γῆ / Χαράν
  rationale: 영어 본문이 ‘land of Haran’으로 풀어 놓았으므로 지명은 유지하되, 한국어에서는 자연스럽게 ‘하란에서’로 처리했습니다.
- source_word: ὑποκάτω φάραγγος ὑδάτων
  english_pob_choice: below a watercourse
  chosen_korean: 물길 아래에서
  alternatives_korean:
  - 물도랑 아래에서
  - 개울 아래에서
  - 수로 아래에서
  lexicon: ὑποκάτω / φάραγξ / ὑδάτων
  rationale: φάραγγος ὑδάτων는 문자적으로 ‘물의 골짜기/협곡’에 가깝지만, POB의 ‘watercourse’에 맞추어 의미를 과하게 특정하지 않는 ‘물길’로 옮겼습니다.
theological_decisions:
- issue: 서술의 성격
  chosen_reading: 이 구절은 신학적 주장보다 지리·서술 정보를 전달하는 문장으로 처리했습니다.
  alternative_readings:
  - 상징적으로 과도하게 해석하는 번역
  - 설명적 요소를 덧붙이는 번역
  rationale: 원문은 열매의 성격과 자라는 위치를 진술할 뿐이므로, 해석을 덧붙이지 않고 평이하게 옮기는 것이 가장 충실합니다.
  doctrine_reference: 문맥 우선 원칙
