    rationale: 그리스어는 ἐν τῇ γῇ Χαράν, 곧 ‘하란 땅에서’라고 할 뿐 가나안을 언급하지 않습니다. 지명 추가는 지리 정보와 본문 의미를 변경합니다.
  - severity: medium
    issue: ‘그러나’가 δέ의 연결 기능을 불필요하게 강한 역접으로 만들었습니다.
