base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/007.yaml
  text: So there were two fruits. And Leah said to Rachel, “Let it be enough for you that you have taken my husband; will you also take these from me?”
translation:
  language: ko
  text: 그러므로 사과가 두 개 있었습니다. 그리고 레아가 라헬에게 말했습니다. 「당신이 내 남편을 빼앗아 간 것만으로도 족하지 않습니까? 이것들까지도 내게서 빼앗아 가려 하십니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἱκανούσθω σοι
  english_pob_choice: Let it be enough for you
  chosen_korean: 당신이 … 족하지 않습니까?
  alternatives_korean:
  - 그것으로 당신에게 충분하지 않습니까?
  - 당신에게 그것이면 족하지 않습니까?
  lexicon: ἱκανόω
  rationale: 본문의 Ἱκανούσθω는 단순한 사실 질문보다 상대에게 멈추라고 하는 용법에 가깝기 때문에, 한국어에서는 질문형으로 그 뉘앙스를 살려 옮겼습니다.
- source_word: τὸν ἄνδρα μου
  english_pob_choice: my husband
  chosen_korean: 내 남편
  alternatives_korean:
  - 나의 남편
  - 내 배우자
  lexicon: ἀνήρ
  rationale: 직역해도 무리가 없는 표준 표현이므로, 관계의 직접성을 살려 ‘내 남편’으로 옮겼습니다.
- source_word: μὴ καὶ ταῦτα λήψῃ ἀπ᾿ ἐμοῦ
  english_pob_choice: will you also take these from me?
  chosen_korean: 이것들까지도 내게서 빼앗아 가려 하십니까?
  alternatives_korean:
  - 이것들까지도 내게서 가져가려 하십니까?
  - 이것들까지도 내게서 빼앗겠습니까?
  lexicon: λαμβάνω
  rationale: 문맥상 단순 취득보다 ‘빼앗다/가져가다’의 갈등적 의미가 강해, 관계적 긴장을 드러내는 ‘빼앗아 가다’를 선택했습니다.
- source_word: τὰ μῆλα
  english_pob_choice: two fruits
  chosen_korean: 사과가 두 개
  alternatives_korean:
  - 두 과실
  - 두 열매
  lexicon: μῆλον
  rationale: ἔμ라 사본 전통의 μῆλα는 통상 ‘사과/열매’ 범위가 가능하므로, 한국어에서는 가장 자연스러운 ‘사과’로 풀되 수량 표현을 살렸습니다.
theological_decisions:
- issue: 레아의 말투와 히브리/그리스어 직접화법의 담화 효과
  chosen_reading: 직접화법의 긴박함을 살리되, 현대 한국어에서 자연스러운 공손체로 유지했습니다.
  alternative_readings:
  - 더 구어적인 반말형
  - 더 전통적인 성경체 종결형
  rationale: 본문은 서사 속 대화이므로 장면의 감정은 보존하되, 출판용 합쇼체를 유지하는 것이 가장 균형적입니다.
  doctrine_reference: 문체 및 담화 재현 원칙
