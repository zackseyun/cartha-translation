  text: And Rachel said, "I will not give these to you, but I will keep them in exchange for children; for the Lord has overlooked me, and I have borne no children to Jacob."
translation:
  language: ko
  text: 라헬이 말했습니다. “나는 이것들을 당신에게 주지 않겠습니다. 그러나 자녀와 바꾸어 이것들을 가지겠습니다. 왜냐하면 주님께서 저를 돌아보셨고, 저는 야곱에게 자녀를 낳아 주지 못했기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπε δὲ Ῥαχήλ
  english_pob_choice: And Rachel said
  chosen_korean: 라헬이 말했습니다
  alternatives_korean:
  - 라헬이 말하였습니다
  - 라헬이 이르렀습니다
  lexicon: 고유명사
  rationale: 서사체에 맞는 현대적 보고문으로 옮기되, 공적 낭독에 어울리는 합쇼체를 유지했습니다.
- source_word: οὐ δώσω σοι ταῦτα / ἀλλ᾽ ἵνα σχῶ ταῦτα ἀντὶ τέκνων
  english_pob_choice: I will not give these to you, but I will keep these in exchange for children
  chosen_korean: 나는 이것들을 당신에게 주지 않겠습니다. 그러나 자녀를 대신하여 이것들을 가지겠습니다
  alternatives_korean:
  - 나는 이것들을 당신에게 주지 않겠습니다. 그러나 자녀를 위해 그것들을 간직하겠습니다
  - 나는 이것들을 당신에게 주지 않겠습니다. 그러나 자녀 대신 이것들을 보관하겠습니다
  lexicon: δίδωμι / ἔχω / ἀντί
  rationale: ταῦτα를 '이것들'로 구체적으로 살리고, ἵνα σχῶ를 단순 보관보다 '가지겠습니다'로 옮겨 보유 의지를 드러냈습니다. ἀντὶ τέκνων은 '자녀를 대신하여'로 유지해 교환·대체의 뉘앙스를 살렸습니다.
- source_word: παρεῖδε γάρ με ὁ Κύριος
  english_pob_choice: for the Lord has looked upon me
  chosen_korean: 왜냐하면 주님께서 저를 돌아보셨고
  alternatives_korean:
  - 왜냐하면 주님께서 저를 보셨고
  - 왜냐하면 주님께서 저를 눈여겨보셨고
  lexicon: παρέρχομαι / παραΐδω
  rationale: 문맥상 '외면하다'보다 POB 개정 취지에 맞는 '돌아보다'를 선택해, 신적 주의와 긍휼의 응답을 한국어로 자연스럽게 표현했습니다.
- source_word: τῷ Ἰακώβ
  english_pob_choice: to Jacob
  chosen_korean: 야곱에게
  alternatives_korean:
  - 야곱에게는
  - 야곱을 위해
  lexicon: 여격
  rationale: 목적·귀속의 관계를 평이하게 드러내는 여격으로 옮겼습니다.
theological_decisions:
- issue: 하나님을 부르는 호칭
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 직접 인용된 내러티브에서 독자 친숙성과 경건한 호칭을 함께 살리기 위해 '주님'을 택했습니다. 본문은 서술형 고유명 호칭이며 YHWH 음역 문제를 전면화할 필요는 없습니다.
  doctrine_reference: 성경 번역 관행 / 고유명사 표기
