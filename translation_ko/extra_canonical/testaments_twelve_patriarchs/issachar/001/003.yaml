translation:
  language: ko
  text: 르우벤은 내 형제가 들에서 낸 만드라고라를 가져왔고, 라헬이 그를 만나 그것들을 그에게서 빼앗았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ῥουβὶμ ... ὁ ἀδελφός μου
  english_pob_choice: Reuben my brother
  chosen_korean: 르우벤은 내 형제가
  alternatives_korean:
  - 르우벤 내 형제는
  - 르우벤, 내 형제는
  lexicon: 고유명사/친족 관계
  rationale: 주어를 자연스러운 현대 한국어 어순으로 옮기되, ἀδελφός μου의 친족 표지를 살려 ‘내 형제’로 유지했습니다.
- source_word: μανδραγόρους
  english_pob_choice: mandrakes
  chosen_korean: 만드라고라
  alternatives_korean:
  - 맨드레이크
  - 만드레이크
  lexicon: 식물명
  rationale: 원문의 고유 식물명을 음역해 보존했으며, 한국어 성경 독자에게도 비교적 익숙한 ‘만드라고라’를 택했습니다.
- source_word: ἐκ τοῦ ἀγροῦ
  english_pob_choice: from the field
  chosen_korean: 들에서 낸
  alternatives_korean:
  - 밭에서
  - 들판에서
  lexicon: 전치사구
  rationale: 단순한 출처를 넘어 ‘밖으로 가져온’ 동작을 드러내기 위해 ‘들에서 낸’으로 옮겼습니다.
- source_word: προσαπαντήσασα ... ἔλαβεν αὐτούς
  english_pob_choice: met him and took them from him
  chosen_korean: 그를 만나 그것들을 그에게서 빼앗았습니다
  alternatives_korean:
  - 그를 만나 그것들을 가져갔습니다
  - 그를 만나 그것들을 그에게서 받았습니다
  lexicon: 동사구
  rationale: ἔλαβεν의 단순 ‘받다’보다 문맥상 적극적 취득을 보여 주는 동작을 살려 ‘빼앗았습니다’로 번역했습니다.
