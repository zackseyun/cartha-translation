base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/012.yaml
  text: But Laban deceived me with guile, and removed me that night, and did not allow Jacob to see me; for if I had been there, this would not have happened to him.
translation:
  language: ko
  text: 그러나 라반이 저를 속임수로 속였고, 그날 밤 저를 옮겨 놓았으며, 야곱이 저를 보지 못하게 했습니다. 만일 제가 그곳에 있었다면, 이런 일은 그에게 일어나지 않았을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δόλῳ / ἐν ⌜δόλῳ⌝
  english_pob_choice: with guile
  chosen_korean: 속임수로
  alternatives_korean:
  - 간계로
  - 교활하게
  - 속임수 가운데
  lexicon: δόλος
  rationale: 도구·수단을 나타내는 전치사구를 자연스럽게 살리면서도, 단순한 ‘기만’보다 계획적 속임의 뉘앙스를 유지했습니다.
- source_word: ἠπάτησέ με
  english_pob_choice: deceived me
  chosen_korean: 저를 속였고
  alternatives_korean:
  - 저를 기만했고
  - 저를 속였습니다
  - 저를 속여
  lexicon: ἀπατάω
  rationale: 직접목적어 ‘저를’과 서술 동사 ‘속였고’를 써서 행위의 주체와 피해를 분명히 드러냈습니다.
- source_word: μετέστησέ με τὴν νύκτα ἐκείνην
  english_pob_choice: removed me that night
  chosen_korean: 그날 밤 저를 옮겨 놓았으며
  alternatives_korean:
  - 그날 밤 저를 옮겼으며
  - 그 밤 저를 다른 곳으로 옮겨 놓았으며
  - 그날 밤 저를 빼돌렸으며
  lexicon: μεθίστημι
  rationale: ‘removed’의 이동·배치 의미를 살리되, 한국어에서 문맥상 이해되는 ‘옮겨 놓다’로 옮겨 야곱이 그 자리에 없게 된 상황을 분명히 했습니다.
- source_word: οὐκ εἴασε ... ἰδεῖν με
  english_pob_choice: did not allow Jacob to see me
  chosen_korean: 야곱이 저를 보지 못하게 했습니다
  alternatives_korean:
  - 야곱이 저를 보도록 허락하지 않았습니다
  - 야곱이 저를 보지 못하게 허락하지 않았습니다
  - 야곱이 저를 보지 못하게 두지 않았습니다
  lexicon: ἐάω + ἰδεῖν
  rationale: 직역보다 한국어에서 자연스러운 부정 가능형으로 옮기되, 허락의 부재라는 원뜻은 유지했습니다.
- source_word: ἐπεί, ἐὰν ἤμην ἐκεῖ ... τοῦτο αὐτῷ οὐκ ἐγένετο
  english_pob_choice: for if I had been there, this would not have happened to him
  chosen_korean: 만일 제가 그곳에 있었다면, 이런 일은 그에게 일어나지 않았을 것입니다
  alternatives_korean:
  - 제가 거기에 있었더라면, 이런 일은 그에게 생기지 않았을 것입니다
  - 제가 거기에 있었으면, 이런 일은 그에게 일어나지 않았을 것입니다
  lexicon: ἐγένετο
  rationale: 조건법과 결과절을 현대 한국어의 자연스러운 가정법으로 재현하면서, 사건의 발생 여부를 그대로 유지했습니다.
theological_decisions:
- issue: 서술자의 자기 피해와 하나님의 섭리적 보호 사이의 긴장
  chosen_reading: 본문은 라반의 속임수와 야곱이 보지 못하게 된 사건을 서술하지만, 직접적으로 하나님을 언급하지는 않으므로 서술 범위를 넘지 않게 번역했습니다.
  alternative_readings:
  - 하나님의 섭리적 개입을 암시하는 해석을 본문에 반영하는 방식
  - 라반의 악의를 강조하는 해석적 증강
  rationale: 이 절은 원인 설명을 서술적 조건문으로 제시할 뿐이므로, 해석을 덧붙이지 않고 사건의 인과만 드러내는 것이 적절합니다.
  doctrine_reference: 본문 내 직접 신학 명제 없음
