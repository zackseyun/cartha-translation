revisions:
- from: 그러나 여전히, 그 무화과풀을 두고 나는 야곱과 함께하는 한밤을 당신에게 빌려줍니다.
  to: 하지만 그래도, 만드라고라를 받는 대가로 야곱을 하룻밤 동안 당신에게 빌려드립니다.
  rationale: 식물명을 정확한 통용명으로 바로잡고, 시간 표현을 ‘하룻밤 동안’으로 고쳤습니다. 또한 임대의 대상과 수혜자를 분명히 하여 원문의 거래적·완곡한 표현과 서사적 의미를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역의 ‘무화과풀’은 μανδραγόρας(만드라고라)를 잘못 옮긴 것이며, ‘한밤’은 μίαν νύκτα(하룻밤)와 다릅니다. 또한 τῷ Ἰακώβ는 여기서 야곱을 ‘당신에게’ 내어 주는 거래의 대상으로 표현하는 것이 자연스럽고 원문에 가깝습니다.
  naturalness: ‘그러나 여전히’와 ‘그 무화과풀을 두고’는 현대 표준 한국어에서 다소 부자연스럽습니다. ‘하지만 그래도’ 및 ‘만드라고라를 받는 대가로’가 원문의 양보와 교환 관계를 더 명료하고 자연스럽게 전달합니다.
  terminology: μανδραγόρας는 통용 식물명인 ‘만드라고라’로 음역하는 것이 안전합니다. ἐκμισθῶ의 거래적 은유는 ‘빌려드립니다’로 유지하되, 야곱이 그 동작의 대상임을 분명히 해야 합니다.
  issues:
  - severity: high
    issue: μανδραγόρας를 ‘무화과풀’로 번역함
    rationale: μανδραγόρας는 만드라고라(mandrake)이며 무화과풀을 가리키지 않습니다.
  - severity: high
    issue: μίαν νύκτα를 ‘한밤’으로 번역함
    rationale: ‘한밤’은 자정 무렵을 뜻할 수 있으나, 원문은 ‘하룻밤/한 밤 동안’이라는 시간 단위입니다.
  - severity: medium
    issue: τῷ Ἰακώβ의 관계를 ‘야곱과 함께하는’으로 처리함
    rationale: 문맥과 ἐκμισθῶ σοι의 수여 대상은 야곱을 상대에게 하룻밤 내어 주는 거래입니다. ‘야곱을 … 당신에게 빌려드립니다’가 이를 정확히 드러냅니다.
  revised_text: 하지만 그래도, 만드라고라를 받는 대가로 야곱을 하룻밤 동안 당신에게 빌려드립니다.
  revised_footnotes: []
