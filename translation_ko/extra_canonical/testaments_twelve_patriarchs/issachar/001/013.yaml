id: T12P.ISS.1.13
reference: Testament of Issachar 1:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 13. *Ἀλλ᾽ οὖν ἀντὶ τῶν μανδραγόρων ἐκμισθῶ σοι μίαν νύκτα τῷ Ἰακώβ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/013.yaml
  text: But still, in exchange for the mandrakes I hire out to you one night with Jacob.
translation:
  language: ko
  text: 하지만 그래도, 만드라고라를 받는 대가로 야곱을 하룻밤 동안 당신에게 빌려드립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλ᾽ οὖν
  english_pob_choice: But still
  chosen_korean: 그러나 여전히
  alternatives_korean:
  - 그렇지만
  - 하지만 그래도
  lexicon: ἀλλά + οὖν
  rationale: 대조와 양보를 함께 살려, 앞선 맥락을 뒤집지 않으면서도 계속되는 양보의 뉘앙스를 간결하게 표현했습니다.
- source_word: ἀντὶ τῶν μανδραγόρων
  english_pob_choice: in exchange for the mandrakes
  chosen_korean: 그 무화과풀을 두고
  alternatives_korean:
  - 그 만드라고라를 대신하여
  - 그 두리안풀과 맞바꾸어
  lexicon: ἀντί + μανδραγόρας
  rationale: ἀντί의 교환 의미를 살려 ‘두고’로 처리했고, μανδραγόρας는 본문 맥락에 맞는 식물명으로 ‘무화과풀’로 옮겼습니다.
- source_word: ἐκμισθῶ σοι
  english_pob_choice: I hire out to you
  chosen_korean: 나는 당신에게 빌려줍니다
  alternatives_korean:
  - 나는 당신에게 내어줍니다
  - 나는 당신에게 임대합니다
  lexicon: ἐκμισθόω
  rationale: 고대적 거래 표현을 현대 한국어에서 가장 자연스럽게 드러내기 위해 ‘빌려줍니다’를 택했습니다.
- source_word: μίαν νύκτα τῷ Ἰακώβ
  english_pob_choice: one night with Jacob
  chosen_korean: 야곱과 함께하는 한밤
  alternatives_korean:
  - 야곱과의 한밤
  - 야곱과 함께하는 한 밤
  lexicon: νύξ + δοτική
  rationale: τῷ Ἰακώβ의 동반/관계 의미를 살려 ‘~과 함께하는’으로 풀었고, ‘한밤’으로 시간 단위를 간결하게 유지했습니다.
theological_decisions:
- issue: 본문의 거래적·완곡한 성격
  chosen_reading: 직설적으로 ‘빌려줍니다’라고 옮겨 거래와 교환의 성격을 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘내어줍니다’로 처리
  - 관계 서술 중심으로 의역
  rationale: 본문은 야곱과의 한밤을 물물교환처럼 제시하므로, 이를 흐리지 않도록 거래적 표현을 유지했습니다.
  doctrine_reference: 서사 문맥 보존 및 원문 의미 충실성
