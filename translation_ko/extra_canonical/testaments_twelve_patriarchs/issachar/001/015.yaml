revisions:
- from: 야곱이 레아를 알았고, 그 여자가 임신하여 나를 낳았으며, 이 때문에 나는 ‘임금’이라 불렸습니다.
  to: 야곱이 레아와 동침하였고, 레아가 임신하여 나를 낳았습니다. 이 일, 곧 그 삯 때문에 나는 잇사갈이라 불렸습니다.
  rationale: 성관계의 관용적 서술은 현대 한국어에서 의미가 분명한 ‘동침하다’로 옮겼습니다. τὸν μισθόν의 어원적 말놀이는 ‘그 삯’으로 보존하되, Ἰσαχάρ은 고유명사 ‘잇사갈’로 유지했습니다. ‘이 일, 곧 그 삯’은 원문의 διὰ τούτου와 τὸν μισθόν의 연결을 드러내며, 영어 감사 번역의 ‘because of this—the wages’도 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ἔτεκεν ἐμέ를 정확히 반영하지만, Ἰσαχάρ이라는 고유명을 ‘임금’으로 번역하여 원문의 명명 내용을 잃었습니다. 또한 τὸν μισθόν(삯/품삯)의 어원적 설명은 이름과 구별해 보존해야 합니다.
  naturalness: ‘야곱이 레아를 알았고’는 한국어 현대 산문에서 성관계의 의미가 자연스럽게 전달되지 않습니다. ‘레아와 동침하였고’가 원문의 완곡성을 크게 벗어나지 않으면서도 뜻을 분명히 합니다. ‘그 여자’는 불필요하므로 ‘레아가’로 바로 받는 편이 자연스럽습니다.
  terminology: 고유명사는 한국어 성서 통용 표기인 ‘잇사갈’을 사용하고, μισθός는 ‘삯’으로 옮겨 명명 어원을 본문에서 유지합니다. ‘임금’은 현대 한국어에서 직위·급료 양쪽으로 읽힐 수 있어 여기서는 ‘삯’보다 덜 정확합니다.
  issues:
  - severity: high
    issue: Ἰσαχάρ을 ‘임금’으로 번역함
    rationale: 원문은 ‘삯’(τὸν μισθόν)을 이유로 하여 화자가 ‘이사갈/잇사갈’이라 불렸다고 말합니다. 이름 자체를 보통명사로 바꾸면 고유명사와 명명 진술이 사라집니다.
  - severity: medium
    issue: ‘알다’가 성관계 의미를 전달하지 못함
    rationale: ἔγνω는 여기서 성관계를 가리키는 관용 표현이지만, 현대 한국어의 ‘알다’에는 그 용법이 정착되어 있지 않아 의미가 불명확합니다.
  - severity: low
    issue: ‘그 여자’라는 지시 표현
    rationale: 앞에 레아가 명시되어 있으므로 ‘레아가’라고 반복하는 편이 자연스럽고 존중 있는 서술입니다.
  revised_text: 야곱이 레아와 동침하였고, 레아가 임신하여 나를 낳았습니다. 이 일, 곧 그 삯 때문에 나는 잇사갈이라 불렸습니다.
