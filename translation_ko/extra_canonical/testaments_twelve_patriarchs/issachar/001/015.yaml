id: T12P.ISS.1.15
reference: Testament of Issachar 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 15. *⁶²Ἔγνω δὲ Ἰακὼβ τῇ Λείᾳ⁶², καὶ Γσυλλαβοῦσα¹ *ἔτεκεν ἐμέ⁶³, καὶ διὰ Γτούτου⁶⁴ τὸν μισθὸν ἐκλήθην⁶⁵ Ἰσαχάρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/015.yaml
  text: And Jacob knew Leah, and she conceived and bore me; and because of this — the wages — I was called Issachar.
translation:
  language: ko
  text: 야곱이 레아를 알았고, 그 여자가 임신하여 나를 낳았으며, 이 때문에 나는 ‘임금’이라 불렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνω ... Ἰακὼβ τῇ Λείᾳ
  english_pob_choice: Jacob knew Leah
  chosen_korean: 야곱이 레아를 알았고
  alternatives_korean:
  - 야곱이 레아와 동침했고
  - 야곱이 레아와 관계했고
  lexicon: ἔγνω
  rationale: ἐγινώσκω의 완곡한 성관계 표현으로 이해하여, 한국어에서도 직접적이되 과도하게 노골적이지 않은 ‘알다’로 옮겼습니다.
- source_word: ἔτεκεν ἐμέ
  english_pob_choice: bore me
  chosen_korean: 나를 낳았으며
  alternatives_korean:
  - 나를 낳았고
  - 나를 출산했으며
  lexicon: τίκτω
  rationale: 출생 행위를 자연스럽게 드러내는 기본 대응으로 ‘낳다’를 사용했습니다.
- source_word: τὸν μισθὸν
  english_pob_choice: the wages
  chosen_korean: ‘임금’이라
  alternatives_korean:
  - ‘보수’라
  - ‘삯’이라
  - ‘품삯’이라
  lexicon: μισθός
  rationale: 문맥상 어근 의미인 ‘보상/삯’을 살리면서도, 본문이 곧바로 이름 유래를 연결하므로 한국어 독자가 어색함 없이 읽도록 음역명과의 연결을 드러냈습니다.
- source_word: Ἰσαχάρ
  english_pob_choice: Issachar
  chosen_korean: 이사갈
  alternatives_korean:
  - 잇사갈
  - 이스사갈
  lexicon: Ἰσαχάρ
  rationale: 통용 표기보다 어근 연상(‘삯/임금’)이 드러나도록 본문에서는 의미 번역을 우선하되, 고유명사는 기존 성서 음역을 따랐습니다.
theological_decisions:
- issue: 성적 관계의 완곡한 표현
  chosen_reading: ‘알다’로 번역해 히브리식 완곡 표현을 유지했습니다.
  alternative_readings:
  - 직설적으로 ‘동침하다’로 옮김
  - 중립적으로 ‘관계하다’로 옮김
  rationale: 원문은 혼인 관계 안의 성적 결합을 완곡하게 말하므로, 한국어에서도 같은 수준의 절제를 유지하는 것이 적절합니다.
  doctrine_reference: 창세기/족장 전승의 서술체와 성서적 완곡어법
