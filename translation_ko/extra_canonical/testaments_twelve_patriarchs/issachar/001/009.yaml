  text: But Leah said to her, “Jacob is mine, because I am the wife of his youth.”
translation:
  language: ko
  text: 그러나 레아가 그녀에게 말했습니다. 「야곱은 제 것입니다. 저는 그의 젊은 시절의 아내이기 때문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπε δὲ πρὸς αὐτὴν ἡ Λεία
  english_pob_choice: But Leah said to her
  chosen_korean: 그러나 레아가 그 여자에게 말했습니다
  alternatives_korean:
  - 그런데 레아가 그녀에게 말했습니다
  - 레아가 그 여자에게 말했습니다
  lexicon: 레아 / 말했습니다
  rationale: δέ의 전환을 자연스러운 역접으로 살리고, πρὸς αὐτὴν은 직접 대화의 방향을 드러내되 현대 한국어에서 무리 없는 「그 여자에게」로 옮겼습니다.
- source_word: ἐμός ἐστιν ὁ Ἰακώβ
  english_pob_choice: Jacob is mine
  chosen_korean: 야곱은 내 것입니다
  alternatives_korean:
  - 야곱은 내 사람입니다
  - 야곱은 제 것입니다
  lexicon: ἐμός / Ἰακώβ
  rationale: 소유 대명사의 강한 단언을 살려 「내 것입니다」로 옮기되, 고전적 소유 표현을 현대 문체에 맞게 정리했습니다.
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: 왜냐하면
  alternatives_korean:
  - ~이기 때문입니다
  - 왜냐하면 ~
  lexicon: ὅτι
  rationale: 공식적이면서도 구어적이지 않은 인과를 분명하게 드러내기 위해 「왜냐하면」을 택했습니다.
- source_word: γυνὴ νεότητος αὐτοῦ
  english_pob_choice: the wife of his youth
  chosen_korean: 그의 젊은 시절의 아내
  alternatives_korean:
  - 그의 젊은 시절의 아내
  - 그가 젊었을 때의 아내
  lexicon: γυνή / νεότης
  rationale: 직역적으로 ‘아내’와 ‘젊은 시절’을 연결해, 관계의 지속성과 시기성을 함께 드러냈습니다.
theological_decisions:
- issue: 레아의 발화 등록과 인칭 표현
  chosen_reading: 레아의 직접 발화는 일반 서술은 합쇼체로 유지하되, 인용문 안에서는 주장 내용을 평서로 분명히 제시했습니다.
  alternative_readings:
  - 인용문 전체를 더 구어적으로 풀어쓰기
  - 직접화법을 간접화법으로 바꾸기
  rationale: 본문은 레아의 자기 주장과 소유 선언을 강조하므로, 직접화법을 유지해야 의미의 힘이 보존됩니다.
  doctrine_reference: 서사 본문의 화행 보존
