base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/008.yaml
  text: And Rachel said to her, “Let Jacob be with you tonight in exchange for your son’s mandrakes.”
translation:
  language: ko
  text: 레아가 라헬에게 말했습니다. 「이 밤에는 네 아들 밤색사과풀과 바꾸어 야곱이 너와 함께 있게 하십시오」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπε δὲ αὐτῇ Ῥαχήλ
  english_pob_choice: And Rachel said to her
  chosen_korean: 라헬이 레아에게 말했습니다
  alternatives_korean:
  - 라헬이 그녀에게 말했습니다
  - 라헬이 그 여자에게 말했습니다
  lexicon: 인명/대명사
  rationale: 문맥상 대화 상대는 레아이며, 한국어는 인칭 대명사보다 이름을 반복하는 편이 관계를 분명하게 드러냅니다.
- source_word: Ἔστω σοι ὁ Ἰακὼβ
  english_pob_choice: Let Jacob be with you
  chosen_korean: 야곱이 너와 함께 있게 하십시오
  alternatives_korean:
  - 야곱이 너와 함께 있으라
  - 야곱이 네 곁에 있게 하십시오
  lexicon: ἔστω / 서술적 허용
  rationale: Ἔστω는 허용·양보의 뜻이므로 명령형보다 ‘~하게 하십시오’가 자연스럽고, ‘함께 있게’는 관계적 동반을 살립니다.
- source_word: τῇ νυκτὶ ταύτῃ
  english_pob_choice: tonight
  chosen_korean: 이 밤에는
  alternatives_korean:
  - 오늘 밤
  - 이 밤에
  lexicon: νύξ
  rationale: 문맥상 시간 부사이므로 ‘오늘 밤’도 가능하지만, 원문의 지시적 뉘앙스를 살려 ‘이 밤에는’으로 옮겼습니다.
- source_word: ἀντὶ τῶν μανδραγόρων ⌈τοῦ υἱοῦ σου⌉
  english_pob_choice: in exchange for your son’s mandrakes
  chosen_korean: 네 아들 밤색사과풀과 바꾸어
  alternatives_korean:
  - 네 아들의 합환채와 맞바꾸어
  - 네 아들의 밤색사과풀 대신
  lexicon: μανδραγόρας / ἀντί
  rationale: μανδραγόρας는 전통적으로 ‘합환채’로도 옮기지만, 식물명을 더 직접적으로 드러내기 위해 ‘밤색사과풀’을 채택했습니다. ἀντί는 교환·대가의 뜻이므로 ‘~과 바꾸어’가 적절합니다.
theological_decisions:
- issue: 대화체의 공손도와 명령/허용 뉘앙스
  chosen_reading: 라헬의 말은 평서문 안의 허용형으로 처리하고, 한국어는 문장 전체를 합쇼체로 유지했습니다.
  alternative_readings:
  - 직설적 명령형으로 옮겨 ‘야곱이 너와 함께 있으라’로 할 수 있음
  - 대화체를 전부 해체형으로 낮출 수 있음
  rationale: 본문은 신학적 진술보다 서사적 대화이며, 합쇼체가 현대 한국어 독자에게 자연스럽고 본문의 허용적 톤도 유지합니다.
  doctrine_reference: 문체/화행 보존
