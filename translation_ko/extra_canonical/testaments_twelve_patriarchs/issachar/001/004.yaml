  text: But Reuben was weeping, and at his cry Leah my mother came out.
translation:
  language: ko
  text: 그러나 르우벤은 울고 있었고, 그의 외침을 듣고 레아, 곧 내 어머니가 나오셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔκλαιε ... δὲ Ῥουβὶμ
  english_pob_choice: But Reuben was weeping
  chosen_korean: 그러나 르우벤은 울고 있었고
  alternatives_korean:
  - 그런데 르우벤은 울고 있었습니다
  - 르우벤은 울고 있었습니다
  lexicon: ἔκλαιε
  rationale: 미완료 과거의 진행성을 살려 단순 과거보다 ‘울고 있었고’로 옮겼고, δὲ는 앞뒤를 잇는 대비/전환으로 ‘그러나’가 자연스럽습니다.
- source_word: ἐπὶ τῇ φωνῇ αὐτοῦ
  english_pob_choice: at his cry
  chosen_korean: 그의 외침을 듣고
  alternatives_korean:
  - 그의 소리에
  - 그의 목소리로 인해
  lexicon: ἐπὶ + dative / φωνή
  rationale: φωνή는 여기서 단순한 ‘목소리’보다 울부짖음에 가까운 반응을 암시하므로, 사건의 원인관계를 분명히 하는 ‘외침을 듣고’가 소스 의미를 잘 드러냅니다.
- source_word: ἐξῆλθεν Λεία ἡ μήτηρ μου
  english_pob_choice: Leah my mother came out
  chosen_korean: 레아, 곧 내 어머니가 나오셨습니다
  alternatives_korean:
  - 레아 내 어머니가 나오셨습니다
  - 레아, 내 어머니가 밖으로 나오셨습니다
  lexicon: ἐξῆλθεν / ἡ μήτηρ μου
  rationale: ἐξέρχομαι는 단순히 ‘밖으로 나오다’이므로 과잉 설명을 피하고 ‘나오셨습니다’로 간결하게 옮겼습니다. ‘내 어머니’는 관계를 보존하되 한국어 문맥을 위해 동격 표지 ‘곧’을 더해 인물 동일성을 분명히 했습니다.
theological_decisions:
- issue: 이 절의 서술 시점과 직접 인용 형태
  chosen_reading: 내려진 신탁이나 교훈문이 아니라 회고적 서술이므로, 자연스러운 서사체로 옮기되 존칭을 유지했습니다.
  alternative_readings:
  - 직설적 대화체처럼 더 구어적으로 옮김
  - 고전적 문체로 격상
  rationale: 원문은 단순한 사건 서술이므로 불필요한 성경체를 덧입히지 않고 현대 표준어 서술문으로 유지하는 것이 가장 투명합니다.
  doctrine_reference: 번역 문체 일관성 원칙
- issue: 레아에 대한 존칭 처리
  chosen_reading: ‘나오셨습니다’로 높임을 유지했습니다.
  alternative_readings:
  - ‘나왔습니다’로 중립화
  rationale: 화자의 어머니를 가리키는 표현이므로 한국어 서술에서 자연스러운 존칭을 사용해 관계를 보존했습니다.
  doctrine_reference: 한국어 존대법
