  text: 4. Ἔκλαιε¹⁹ δὲ ²⁰Ῥουβὶμ²⁰, καὶ ἐπὶ τῇ φωνῇ αὐτοῦ ἐξῆλθεν²² Λεία ἡ μήτηρ μου²³.
  language: Greek
base_translation:
