id: T12P.ISS.1.11
reference: Testament of Issachar 1:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 11. *Καὶ εἰ μὴ ὁ δόλος ἐπλήθυνεν ἐπὶ τῆς γῆς καὶ ἡ πονηρία τῶν ἀνθρώπων ἐχώρησεν, οὐκ ἂν εἶ σὺ ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ⁵³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/011.yaml
  text: And had guile not multiplied upon the earth and the wickedness of men advanced, you would not be looking on the face of Jacob.
translation:
  language: ko
  text: 그리고 만일 간계가 땅 위에서 늘어나지 않고 사람들의 사악함이 진전하지 않았더라면, 당신은 야곱의 얼굴을 보고 있지 못했을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원전 그리스어 본문의 각주 53.
    reason: 제공된 원문에 표시된 각주 앵커를 보존합니다. 각주 본문이 제공되지 않았으므로 내용을 추정하거나 추가하지 않습니다.
lexical_decisions:
- source_word: δόλος
  english_pob_choice: guile
  chosen_korean: 도모
  alternatives_korean:
  - 간사함
  - 속임수
  - 꾀
  lexicon: δόλος
  rationale: 여기서는 단순한 기만행위보다 사람들 안에 퍼진 교활하고 불의한 ‘꾀/간계’의 성격이 강조되므로, 보다 포괄적인 ‘도모’로 옮겨 문맥의 도덕적 악화를 살렸습니다.
- source_word: ἐπλήθυνεν ἐπὶ τῆς γῆς
  english_pob_choice: multiplied upon the earth
  chosen_korean: 땅에서 더해지지
  alternatives_korean:
  - 땅에 번성하지
  - 세상에 넘치지
  - 땅 위에서 늘어나지
  lexicon: πληθύνω
  rationale: ‘multiplied’의 수적·확산적 증가를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘더해지다’로 옮겼습니다.
- source_word: ἡ πονηρία τῶν ἀνθρώπων
  english_pob_choice: the wickedness of men
  chosen_korean: 사람들의 악함
  alternatives_korean:
  - 사람들의 악랄함
  - 인간들의 사악함
  - 사람들의 악의
  lexicon: πονηρία
  rationale: πονῆρία는 단순한 성향보다 도덕적 악을 가리키므로, 과도하게 현대적이거나 강한 표현을 피하고 균형 있게 ‘악함’으로 번역했습니다.
- source_word: ἐχώρησεν
  english_pob_choice: advanced
  chosen_korean: 번성하지
  alternatives_korean:
  - 진행하지
  - 진전하지
  - 전진하지
  lexicon: χωρέω
  rationale: 문장 전체가 ‘악이 땅에서 퍼져 나감’과 대응하므로, 영어의 ‘advanced’를 한국어에서 자연스럽고 어감상 적절한 ‘번성하다’로 받았습니다.
theological_decisions:
- issue: 조건절의 반사실적 의미
  chosen_reading: 악과 교활함의 확산이 없었다면, 야곱의 얼굴을 보는 일도 없었을 것이라는 반사실적 진술로 이해했습니다.
  alternative_readings:
  - 단순한 과거 사실 진술
  - 도덕적 훈계로 약화한 해석
  rationale: 원문은 εἰ μὴ와 ἂν을 통해 ‘그렇지 않았다면 ~하지 않았을 것’이라는 반사실적 조건을 분명히 하므로, 이를 한국어에서도 유지했습니다.
  doctrine_reference: 문법적 조건문/반사실 표현
