revisions:
- from: 그리고 만일 사람들의 악함이 땅에서 더해지지 않고 도모가 번성하지 않았더라면, 너는 야곱의 얼굴을 보고 있지 못했을 것입니다.[a]
  to: 그리고 만일 간계가 땅 위에서 늘어나지 않고 사람들의 사악함이 진전하지 않았더라면, 당신은 야곱의 얼굴을 보고 있지 못했을 것입니다.[a]
  rationale: 원문의 병렬 구조를 그대로 회복하여 δόλος에는 ‘땅 위에서 늘어나다’를, 사람들의 πονηρία에는 ‘진전하다’를 연결했습니다. ‘간계’와 ‘사악함’은 도덕적으로 부정적인 원문의 어휘를 자연스러운 현대 한국어로 반영합니다. εἰ μὴ와 ἄν이 이루는 반사실 조건은 ‘않았더라면 … 못했을 것입니다’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:09Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 두 주어에 딸린 술어·수식어의 관계가 바뀌어 있습니다. 원문은 ‘간계가 땅 위에서 늘어나고’와 ‘사람들의 사악함이 진전하고’라는 순서와 결합입니다. 또한 δόλος의 ‘도모’는 일반적으로 계획·의도를 뜻하므로 여기의 부정적 도덕 성격을 충분히 담지 못합니다.
  naturalness: 반사실 조건문과 합쇼체 종결은 자연스럽지만, ‘악함이 땅에서 더해지다’와 ‘도모가 번성하다’는 어휘 결합이 다소 부자연스럽고 의미 배정도 원문과 맞지 않습니다.
  terminology: δόλος는 ‘간계’로, πονηρία는 ‘사악함’으로 옮기는 것이 문맥상 적절합니다. ἐχώρησεν은 ‘진전하다’로 번역하여 ‘advanced’ 및 원문의 진행 의미를 보존했습니다. 여성 단수 분사 ὁρῶσα는 한국어의 2인칭 표현에서는 별도로 표시하지 않았습니다.
