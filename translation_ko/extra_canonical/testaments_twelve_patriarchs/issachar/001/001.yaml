  text: A copy of the words of Issachar. For he called his sons and said to them, "Listen, children, to Issachar your father; give ear to the words of one beloved by the Lord.
translation:
  language: ko
  text: 잇사갈의 말들을 베낀 것입니다. 그는 자기 아들들을 불러 그들에게 말했습니다. 「들으십시오, 아버지 잇사갈의 자녀들아. 주님께 사랑받은 이의 말들에 귀를 기울이십시오.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾿Αντίγραφον λόγων Ἰσαχάρ
  english_pob_choice: A copy of the words of Issachar.
  chosen_korean: 잇사갈의 말들을 베낀 것입니다.
  alternatives_korean:
  - 잇사갈의 말들의 사본입니다.
  - 잇사갈의 말씀을 옮겨 적은 것입니다.
  lexicon: source_note
  rationale: ἀντίγραφον은 단순한 제목성 표지로서 ‘사본/베낀 것’의 뜻을 가지므로, 문체를 살려 본문의 성격을 드러냈습니다.
- source_word: τοὺς υἱοὺς αὐτοῦ
  english_pob_choice: his sons
  chosen_korean: 자기 아들들을
  alternatives_korean:
  - 그의 아들들을
  - 자신의 아들들을
  lexicon: source_note
  rationale: 대명사 αὐτοῦ를 자연스러운 한국어 소유 표현으로 옮겨, 누가 부름을 받았는지 분명히 했습니다.
- source_word: ἀκούσατε
  english_pob_choice: Listen
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
  - 들어라
  lexicon: source_note
  rationale: 복수 명령형을 현대 한국어의 정중한 직접 명령으로 옮겨, 아버지가 아들들에게 말하는 장면을 살렸습니다.
- source_word: τέκνα Ἰσαχὰρ τοῦ πατρὸς ὑμῶν
  english_pob_choice: children of Issachar your father
  chosen_korean: 아버지 잇사갈의 자녀들아
  alternatives_korean:
  - 잇사갈의 자녀들아
  - 잇사갈 너희 아버지의 자녀들아
  lexicon: source_note
  rationale: τέκνα를 ‘자녀들’로 옮기고, τοῦ πατρὸς ὑμῶν의 호격적 관계를 한국어 어순에 맞게 정리했습니다.
- source_word: ἐνωτίσασθε ῥήματα ἠγαπημένου ὑπὸ Κυρίου
  english_pob_choice: give ear to the words of one beloved by the Lord
  chosen_korean: 주님께 사랑받은 이의 말들에 귀를 기울이십시오
  alternatives_korean:
  - 주님께 사랑받은 사람의 말들에 귀를 기울이십시오
  - 주님이 사랑하신 이의 말들에 귀를 기울이십시오
  lexicon: source_note
  rationale: ἐνωτίζομαι의 관용적 의미를 ‘귀를 기울이다’로 풀었고, ἠγαπημένου ὑπὸ Κυρίου는 수동적 ‘사랑받은’으로 유지했습니다.
theological_decisions:
- issue: Κυρίου의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 구절의 Κυρίου는 직접 인용된 야훼 표지라기보다 칭호적 용례로 보이며, 본문 흐름상 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: 호칭 번역 원칙
