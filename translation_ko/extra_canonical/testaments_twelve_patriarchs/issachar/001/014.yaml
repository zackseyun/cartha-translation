  to: 그리고 라헬이 말을 이어 이렇게 말했습니다. 「저는 만드라고라[a] 하나를 가져가겠습니다. 그 하나를 대가로 당신에게 그를 그 밤에 빌려주겠습니다.」
  rationale: 식물명을 정확히 바로잡고, ‘임대/대여’라는 원문의 표현을 ‘일하게 하다’로 의역하지 않도록 수정했습니다. ‘그’와 ‘그 하나’는 원문 및 영어 감사 이력처럼 문맥상 가능한 연결을 강제적으로 해설하지 않고 그대로 유지했습니다.
