  - severity: medium
    issue: ‘그를 밤 동안 일하게 하겠습니다’
    rationale: ἐκμισθώσω σοι는 그를 상대에게 빌려주거나 임대한다는 뜻입니다. ‘일하게 하다’는 원문에 없는 노동의 의미를 더합니다.
