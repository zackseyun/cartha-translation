  verdict: revise
  source_fidelity: ‘고들빼기 열매’는 μανδραγόρων(만드라고라/mandrake)을 잘못 지칭하므로 교정이 필요합니다. 또한 ἐκμισθώσω는 ‘일하게 하다’보다 ‘빌려주다/임대하다’가 원문의 거래·교환 표현을 더 충실히 보존합니다. 대명사 ‘그’는 원문처럼 선행사를 보충하지 않았습니다.
  naturalness: ‘라헬이 말을 이어 이렇게 말했습니다’와 ‘그 밤에 빌려주겠습니다’는 현대 표준 한국어의 합쇼체 서술과 직접 인용으로 자연스럽습니다. ‘당신’은 2인칭을 명시하되 과도한 관계 해석을 피합니다.
  terminology: μανδραγόρας는 통용 식물명 ‘만드라고라’로 옮겼고, 독자의 이해를 위해 각주에서 ‘맨드레이크’라는 이칭을 덧붙였습니다. ἐκμισθόω의 임대·대여 의미는 ‘빌려주겠습니다’로 유지했습니다.
  issues:
