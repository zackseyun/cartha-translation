id: T12P.ISS.1.14
reference: Testament of Issachar 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 14. ⌈Καὶ προσέθηκε Ῥαχὴλ λαλεῖν καὶ εἶπεν. Ἕνα τῶν μανδραγόρων λήψομαι, καὶ ἀντὶ τοῦ ἑνὸς ἐκμισθώσω σοι ἐν τῇ νυκτί⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/014.yaml
  text: And Rachel went on speaking and said, "I will take one of the mandrakes, and in exchange for the one I will hire him out to you for the night."
translation:
  language: ko
  text: 그리고 라헬이 말을 계속하여 이렇게 말했습니다. 「저는 그 고들빼기 열매 중 하나를 가져가겠습니다. 그리고 그 하나의 대가로, 당신에게 그를 밤 동안 일하게 하겠습니다」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθηκε ... λαλεῖν
  english_pob_choice: went on speaking
  chosen_korean: 말을 계속하여 이렇게 말했습니다
  alternatives_korean:
  - 또 말했습니다
  - 말하기를 더했습니다
  lexicon: προσθέω + λαλέω
  rationale: 동작의 지속성을 살려 ‘말을 계속하여’로 옮기고, 구어체가 아닌 서술체 합쇼체로 정리했습니다.
- source_word: μανδραγόρων
  english_pob_choice: mandrakes
  chosen_korean: 고들빼기 열매
  alternatives_korean:
  - 만드라고라
  - 맨드레이크
  lexicon: μανδραγόρας
  rationale: 한국어 독자가 이해할 수 있도록 식물명을 풀어 쓰되, 원문의 특이한 식물이라는 점을 유지했습니다.
- source_word: ἐκμισθώσω σοι
  english_pob_choice: I will hire him out to you
  chosen_korean: 당신에게 그를 밤 동안 일하게 하겠습니다
  alternatives_korean:
  - 당신에게 그를 빌려드리겠습니다
  - 당신에게 그를 고용해 드리겠습니다
  lexicon: ἐκμισθόω
  rationale: 원문의 ‘임대/고용하여 내주다’라는 뜻을 자연스러운 한국어로 풀어, 인물을 사물처럼 거래하는 뉘앙스를 과도하게 완화하지 않도록 했습니다.
- source_word: ἐν τῇ νυκτί
  english_pob_choice: for the night
  chosen_korean: 밤 동안
  alternatives_korean:
  - 그 밤에
  - 하룻밤 동안
  lexicon: νύξ
  rationale: 기간의 의미를 분명히 드러내기 위해 ‘밤 동안’으로 옮겼습니다.
theological_decisions:
- issue: 대화체의 직접 인용과 화자 표지
  chosen_reading: 라헬의 발화를 직접 인용부호로 살리고, 서술문은 현대 한국어의 자연스러운 말투로 정리했습니다.
  alternative_readings:
  - 문어체로 더 직역하기
  - 간접화법으로 바꾸기
  rationale: 원문이 대화의 흐름을 강조하므로, 독자가 발화의 진행을 분명히 따라가도록 했습니다.
  doctrine_reference: 문체/서사 전달 원칙
