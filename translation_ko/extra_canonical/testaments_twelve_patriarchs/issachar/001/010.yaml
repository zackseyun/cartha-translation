  text: 10. *Καὶ εἶπε Ῥαχήλ⁴⁷. *Μὴ καυχῶ μηδὲ δόξαζε σεαυτήν⁴⁸, *ὅτι ἐμὲ πρότερόν σου ἡρμόσατο⁴⁹, καὶ *δι᾽ ἐμὲ⁵⁰ ἐδούλευσε *τῷ πατρὶ ἡμῶν⁵¹ *ἔτη δεκατέσσαρα⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/010.yaml
  text: And Rachel said, “Do not boast, nor glorify yourself, for he was joined to me before you, and because of me he served our father fourteen years.”
translation:
  language: ko
  text: 라헬이 말했습니다. “자랑하지도 말고, 스스로를 높이지도 마십시오. 그는 당신보다 먼저 나와 결합하였고, 나 때문에 우리 아버지를 열네 해 동안 섬겼습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ καυχῶ μηδὲ δόξαζε σεαυτήν
  english_pob_choice: Do not boast, nor glorify yourself
  chosen_korean: “자랑하지도 말고, 스스로를 영화롭게도 하지 마십시오”
  alternatives_korean:
  - “자랑하지도 말고, 스스로를 높이지도 마십시오”
  - “자랑하지도 말고, 스스로를 영광스럽게 하지 마십시오”
  lexicon: καυχῶ / δόξαζε / σεαυτήν
  rationale: 두 금지형을 모두 살리되, δόξαζε는 단순한 ‘칭찬하다’보다 자기 과시의 뉘앙스가 있어 ‘스스로를 영화롭게 하다’로 옮겼습니다.
- source_word: ἡρμόσατο
  english_pob_choice: he was joined to me
  chosen_korean: “나와 결합되었고”
  alternatives_korean:
  - “나와 합쳐졌고”
  - “내게 배필로 주어졌고”
  lexicon: ἁρμόζω
  rationale: 문맥상 결혼 결합을 가리키지만, 직역의 결을 살려 ‘결합되다’로 번역해 원문의 서술을 보존했습니다.
- source_word: ἐδούλευσε
  english_pob_choice: he served
  chosen_korean: “섬긴”
  alternatives_korean:
  - “일한”
  - “종노릇한”
  lexicon: δουλεύω
  rationale: 아버지에 대한 야곱의 노동을 자연스럽게 드러내면서도, 단순한 일반노동보다 ‘섬기다’가 관계적 봉사의 뉘앙스를 더 잘 담습니다.
theological_decisions:
- issue: 발화자 표기와 본문 인물명
  chosen_reading: 본문의 헬라어는 ‘라헬’이 말하는 장면을 제시하므로 한국어 본문도 이를 그대로 반영했습니다.
  alternative_readings:
  - ‘그리고 라헬이 말했습니다’
  - ‘그때 라헬이 말했습니다’
  rationale: 서술 연결을 자연스럽게 하면서도 인물 표기를 보존하는 것이 원문 정보에 충실합니다.
  doctrine_reference: 서사 본문 인물 식별의 명료성
