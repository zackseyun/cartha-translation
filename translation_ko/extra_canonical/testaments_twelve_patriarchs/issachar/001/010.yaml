    rationale: 그리스어 본문은 ‘Καὶ εἶπε Ῥαχήλ’, 곧 ‘라헬이 말하였다’라고 명시합니다. 이는 인물 식별을 바꾸는 실질적 오류입니다.
  - severity: low
    issue: ‘스스로를 영화롭게 하다’의 현대 한국어 어색함
    rationale: δόξαζε σεαυτήν의 자기 과시 의미는 유지되지만, 현대 합쇼체 문장에서는 ‘스스로를 높이다’가 더 자연스럽습니다.
  - severity: medium
    issue: 열네 해 동안 섬긴 주체와 기간의 연결이 간접적으로 표현됨
    rationale: 원문은 그가 라헬 때문에 그들의 아버지를 열네 해 섬겼다고 말합니다. 직접적인 절로 옮기면 의미 관계가 명료해집니다.
