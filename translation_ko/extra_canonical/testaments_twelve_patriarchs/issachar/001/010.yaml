review_pass:
  verdict: revise
  source_fidelity: 원문은 발화자를 분명히 ‘라헬’(Ῥαχήλ)로 제시하지만, 초안 본문은 ‘레아’로 잘못 표기합니다. 또한 ἐδούλευσε...ἔτη δεκατέσσαρα는 그가 아버지를 섬긴 기간을 말하므로, 이를 직접 서술하는 편이 정확합니다. ἡρμόσατο의 혼인적 결합 의미는 ‘결합하였고’로 보존하되, 본문의 표현이 지닌 상세한 법적 관계의 불확실성은 과도하게 특정하지 않았습니다.
  naturalness: ‘스스로를 영화롭게 하다’는 이해 가능하나 현대 표준 한국어에서는 다소 부자연스럽고 신학 용어처럼 들릴 수 있습니다. ‘스스로를 높이다’가 자기 과시라는 문맥과 금지 명령의 병렬을 자연스럽게 전달합니다. 마지막 절도 ‘섬긴 세월이 열네 해였습니다’보다 인물과 기간을 직접 밝혀 더 매끄럽습니다.
  terminology: καυχῶ와 δόξαζε의 두 금지 명령은 ‘자랑하지도 말고 … 높이지도 마십시오’로 모두 보존했습니다. δι᾽ ἐμέ는 ‘나 때문에’, δουλεύω는 이 문맥에서 ‘섬기다’로 옮겼습니다. 인명은 원문대로 ‘라헬’로 바로잡았습니다.
  issues:
