base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004.yaml
  text: He does not envy in his deliberations[a], nor does malicious envy consume his soul, nor is there distraction in greed in his mind. But he walks in simplicity of soul; he sees everything with uprightness of heart, not accepting evil eyes from the world’s error[b], so that he may not see the commandments of the Lord as distorted.
  footnotes:
  - marker: a
    text: The phrase translated 'evil eyes' may also evoke the idiom of the 'evil eye,' that is, a hostile or envious way of looking.
    reason: lexical_alternative
  - marker: b
    text: 'The opening bracketed clause reflects a textual expansion in the printed Greek layer: ''nor does malicious envy consume his soul.'' It is translated here as part of the witness text.'
    reason: textual_variant
translation:
  language: ko
  text: 그는 자기의 의논 속에서 시기하지 않으며, 악의적인 시기가 그의 영혼을 소모하지도 않으며, 탐욕 때문에 마음이 산만하지도 않습니다. 그러나 그는 영혼의 단순함 가운데 걸어가며, 마음의 올바름으로 모든 것을 보고, 세상의 오류에서 오는 악한 눈을 받아들이지 않으니, 주님의 계명들을 뒤틀린 것으로 보지 않게 하려는 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλοῖ ἐν διαβουλίοις
  english_pob_choice: envy in his deliberations
  chosen_korean: 자기의 의논 속에서 시기하지 않으며
  alternatives_korean:
  - 자기의 deliberations에서 질투하지 않으며
  - 그의 궁리 속에서 시기하지 않으며
  lexicon: LSJ
  rationale: διαβουλίαις는 단순한 외적 계획보다 숙고·의논의 영역을 가리키므로 ‘의논’으로 옮겨 내적 사유의 장을 살렸고, ζηλοῖ는 이 문맥에서 긍정적 열심이 아니라 시기라는 악덕을 뜻하므로 ‘시기하다’로 옮겼습니다.
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  english_pob_choice: malicious envy consume his soul
  chosen_korean: 악의적인 시기가 그의 영혼을 소모하지도 않으며
  alternatives_korean:
  - 악한 눈의 시기가 그의 영혼을 갉아먹지도 않으며
  - 악의가 그의 영혼을 소모하지도 않으며
  lexicon: LSJ
  rationale: βάσκανος는 ‘악의적 시기’ 혹은 ‘악한 눈’의 뉘앙스를 가지지만, 뒤에 실제로 ὀφθαλμοὺς πονηρούς가 나오므로 여기서는 반복을 피하면서도 해로운 시기의 힘을 드러내는 ‘악의적인 시기’로 옮겼습니다.
- source_word: περισπασμός ἐν ἀπληστείᾳ
  english_pob_choice: distraction in greed
  chosen_korean: 탐욕 때문에 마음이 산만하지도 않으며
  alternatives_korean:
  - 탐욕 속에서 분산되지도 않으며
  - 채워지지 않는 욕심 때문에 분주해지지도 않으며
  lexicon: LSJ
  rationale: περισπασμός는 마음이 여러 방향으로 끌려 흩어지는 상태이므로 ‘산만하다’로 자연스럽게 옮겼고, ἀπληστεία는 ‘탐욕’으로 압축해 문맥의 윤리적 성격을 분명히 했습니다.
- source_word: ἁπλότητι ψυχῆς / εὐθύτητι καρδίας / μὴ ἐπιδεχόμενος
  english_pob_choice: simplicity of soul / uprightness of heart / not accepting
  chosen_korean: 영혼의 단순함 / 마음의 올바름 / 받아들이지 않으니
  alternatives_korean:
  - 영혼의 순수함 / 마음의 정직함 / 용납하지 않으니
  - 영혼의 단일함 / 마음의 곧음 / 들이지 않으니
  lexicon: LSJ
  rationale: ἁπλότης와 εὐθύτης는 도덕적 단순성·곧음을 가리키므로 ‘영혼의 단순함’과 ‘마음의 올바름’으로 옮겼고, ἐπιδέχεσθαι는 안으로 받아들이는 행위이므로 ‘받아들이지 않다’로 처리했습니다.
- source_word: ὀφθαλμοὺς πονηρούς ἀπὸ τῆς πλάνης τοῦ κόσμου
  english_pob_choice: evil eyes from the world’s error
  chosen_korean: 세상의 오류에서 오는 악한 눈
  alternatives_korean:
  - 세상의 미혹에서 오는 악한 눈
  - 세상의 잘못에서 비롯된 악한 눈
  lexicon: LSJ
  rationale: ὀφθαλμοὺς πονηρούς는 직역하면 ‘악한 눈들’이지만, 한국어에서는 관용적 의미가 살아나도록 ‘악한 눈’으로 두고, πλάνη는 ‘오류’로 옮겨 세상이 빚어내는 인식의 왜곡을 드러냈습니다.
- source_word: διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  english_pob_choice: the commandments of the Lord as distorted
  chosen_korean: 주님의 계명들을 뒤틀린 것으로
  alternatives_korean:
  - 주님의 계명들을 왜곡된 것으로
  - 주님의 계명들을 굽은 것으로
  lexicon: LSJ
  rationale: διεστραμμένας는 ‘뒤틀린, 비뚤어진, 왜곡된’의 뜻을 가지므로 감각적으로 분명한 ‘뒤틀린’으로 옮겨 계명에 대한 오도된 인식을 살렸습니다. Κυρίου는 이 본문에서 주님으로 읽는 것이 자연스럽습니다.
theological_decisions:
- issue: 윤리적 진술의 화자 시점
  chosen_reading: 원문의 격언적 3인칭 묘사를 따라 ‘그는 … 않습니다’로 유지했습니다.
  alternative_readings:
  - ‘사람은 … 않습니다’로 일반화
  - 직접 권면형으로 전환
  rationale: 이 본문은 교훈집의 성격을 가진 서술형 도덕 진술이므로, 개별 인물을 본보기로 제시하는 3인칭을 유지하는 편이 원문 효과와 맞습니다.
  doctrine_reference: testamentary wisdom style
- issue: ‘악한 눈’의 관용과 본문 흐름
  chosen_reading: 직전의 ‘악의적인 시기’와 구별되도록 뒤의 ὀφθαλμοὺς πονηρούς는 ‘악한 눈’으로 남겼습니다.
  alternative_readings:
  - 둘 다 ‘악한 눈’으로 통일
  - 둘 다 ‘시기’로 완화
  rationale: 본문은 같은 악덕 영역을 말하지만 서로 다른 표현을 사용하므로, 반복을 피하면서도 시기/관망의 왜곡이라는 긴장을 살려 구별해 번역했습니다.
  doctrine_reference: moral psychology in wisdom literature
