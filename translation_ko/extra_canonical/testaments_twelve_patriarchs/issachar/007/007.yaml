id: T12P.ISS.7.7
reference: Testament of Issachar 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. *Ταῦτα καὶ ὑμεῖς, τέκνα μου, ποιεῖτε²², καὶ²³ πᾶν πνεῦμα τοῦ Βελίαρ φεύξεται ἀφ᾽ ὑμῶν καὶ πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν²⁴ καὶ¹¹ πᾶν ἄγριον θηρίον²⁵ καταδουλώσετε²⁶ ἔχοντες μεθ᾽ ὑμῶν²⁷ τὸν θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς²⁸ *συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας²⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/007.yaml
  text: You also, my children, do these things, and every spirit of Beliar will flee from you, and every deed of wicked people will not rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who goes with people in simplicity of heart.
translation:
  language: ko
  text: 이것들도 너희, 내 자녀들아, 행하십시오. 그러면 벨리알의 영마다 너희에게서 달아날 것이며, 악한 사람들의 모든 행위도 너희를 지배하지 못할 것입니다. 또 너희는 모든 들짐승을 굴복시킬 것이며, 하늘과 땅의 하나님을 너희와 함께 모시되, 마음의 순수함 가운데 사람들과 함께 다니시는 분을 모실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자녀들
  lexicon: τέκνα
  rationale: 직접 호칭으로는 구어적이지만 지나치게 유아적이지 않은 «내 자녀들아»가 관계성과 권면의 뉘앙스를 가장 잘 살립니다.
- source_word: πᾶν πνεῦμα τοῦ Βελίαρ
  english_pob_choice: every spirit of Beliar
  chosen_korean: 벨리알의 영마다
  alternatives_korean:
  - 벨리알의 모든 영
  - 벨리알에게 속한 모든 영
  lexicon: πνεῦμα
  rationale: πᾶν + 단수 συλλογικά 구조를 살려 «영마다»로 옮기고, τοῦ Βελίαρ는 소유/출처 관계를 드러내는 속격으로 처리했습니다.
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων
  english_pob_choice: every deed of wicked people
  chosen_korean: 악한 사람들의 모든 행위
  alternatives_korean:
  - 악한 사람들의 모든 일
  - 악인들의 모든 행위
  lexicon: πρᾶξις
  rationale: πρᾶξις는 단순한 ‘일’보다 행위·실천에 가까워 «행위»가 적절하며, πονηρῶν ἀνθρώπων은 «악한 사람들»로 직역했습니다.
- source_word: κυριεύσει ὑμῶν
  english_pob_choice: will not rule over you
  chosen_korean: 너희를 지배하지 못할 것입니다
  alternatives_korean:
  - 너희를 다스리지 못할 것입니다
  - 너희를 제압하지 못할 것입니다
  lexicon: κυριεύω
  rationale: 권세를 행사해 ‘지배하다’는 뜻을 살리되, 본문의 부정 미래 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: καταδουλώσετε
  english_pob_choice: you will subdue
  chosen_korean: 굴복시킬 것이며
  alternatives_korean:
  - 정복할 것이며
  - 종으로 삼을 것이며
  lexicon: καταδουλόω
  rationale: 어근상 종속시키다의 강한 뜻이 있지만, 여기서는 야생 짐승을 대상으로 한 관용적 승복의 의미를 살려 «굴복시키다»로 옮겼습니다.
- source_word: συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας
  english_pob_choice: who goes with people in simplicity of heart
  chosen_korean: 마음의 순수함 가운데 사람들과 함께 다니시는 분
  alternatives_korean:
  - 마음의 단순함 가운데 사람들과 함께 가시는 분
  - 마음의 순전함으로 사람들과 동행하시는 분
  lexicon: συμπορεύομαι / ἁπλότης
  rationale: συμπορεύομαι는 ‘함께 가다/동행하다’의 뉘앙스가 있어 «함께 다니시다»로, ἁπλότης καρδίας는 문맥상 «마음의 순수함»으로 풀었습니다.
theological_decisions:
- issue: 악한 영과 벨리알의 관계
  chosen_reading: ‘벨리알의 영’은 벨리알에 속하거나 그 영향 아래 있는 영적 세력을 가리키는 표현으로 그대로 유지했습니다.
  alternative_readings:
  - ‘사탄의 영’처럼 후대 교회어로 평탄화
  - ‘벨리알의 악령들’처럼 설명적 확대
  rationale: 본문은 고유명사 벨리알을 사용하므로 이를 보존해야 독자가 당시의 영적 적대 구도를 직접 읽을 수 있습니다.
  doctrine_reference: 사탄/악령에 대한 유대-기독교 전승의 고유명사 보존
- issue: ‘하나님’이 사람들과 함께 다니신다는 묘사
  chosen_reading: 본문이 말하는 임재는 정태적 거주보다 동행의 이미지를 가지므로 ‘함께 다니시는 분’으로 번역했습니다.
  alternative_readings:
  - ‘함께 계시는 분’
  - ‘사람들과 동행하시는 하나님’
  rationale: συμπορευόμενον은 단순한 존재 표지보다 동행/동반의 운동성을 담으므로, 하나님의 능동적 임재를 드러내는 쪽이 원문에 가깝습니다.
  doctrine_reference: 하나님의 동행 임재
