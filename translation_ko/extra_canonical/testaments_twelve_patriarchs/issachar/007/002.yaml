  text: Except for my wife, I have not known another. I did not commit sexual immorality with wandering eyes.
translation:
  language: ko
  text: 다만 내 아내 외에는 다른 여자를 가까이하지 않았습니다. 나는 눈길을 방황하게 하여 성적 부정을 저지르지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῆς συμβίου μου
  english_pob_choice: my wife
  chosen_korean: 내 아내
  alternatives_korean:
  - 내 아내 외의 여인
  - 내 배우자
  lexicon: συμβίος
  rationale: συμβίος는 문자적으로 ‘함께 사는 자/배우자’로, 문맥상 아내를 가리키므로 자연스러운 현대 한국어로 옮기되 혼인 관계를 분명히 했습니다.
- source_word: οὐκ ἔγνων ἄλλην
  english_pob_choice: I have not known another
  chosen_korean: 다른 이를 알지 못했습니다
  alternatives_korean:
  - 다른 여자를 알지 못했습니다
  - 다른 이를 알지 않았습니다
  lexicon: ἄλλος
  rationale: 원문은 단지 ‘다른 사람/것’이라고만 말하므로, English POB의 수정에 따라 ‘여자’를 덧붙이지 않고 원문 범위를 유지했습니다.
- source_word: ἐπόρνευσα
  english_pob_choice: commit sexual immorality
  chosen_korean: 성적 부정을 저지르지 않았습니다
  alternatives_korean:
  - 음행하지 않았습니다
  - 간음을 저지르지 않았습니다
  lexicon: πορνεύω
  rationale: πορνεύω의 넓은 성적 비정절함을 ‘성적 부정’으로 옮겨, 단순 간음보다 넓은 의미를 보존했습니다.
- source_word: ἐν μετεωρισμῷ Γὀφθαλμῶν μου
  english_pob_choice: with wandering eyes
  chosen_korean: 방황하는 눈으로
  alternatives_korean:
  - 흩어진 눈으로
  - 방자한 눈으로
  lexicon: μετεωρισμός
  rationale: 직역하면 ‘눈의 떠다님/산만함’으로, 관용적으로는 시선이 흔들리는 태도를 뜻하므로 ‘방황하는 눈’으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 성적 순결 진술의 범위
  chosen_reading: 본문은 단순한 외적 행동만이 아니라 눈의 태도까지 포함해, 정결을 내면의 시선과 행위 모두로 제시합니다.
  alternative_readings:
  - 단순히 간음 금지의 선언으로만 읽는 해석
  - 정욕적 시선만을 강조하는 해석
  rationale: ἐπόρνευσα와 ‘눈의 방황’이 병치되어 있어, 행위와 내적 태도를 함께 살리는 번역이 원문 효과를 가장 잘 드러냅니다.
  doctrine_reference: 성결 윤리와 내면의 절제
- issue: 다른 대상의 생략 유지
  chosen_reading: ‘another’를 ‘다른 이를’로 유지해 원문의 의도적 생략을 보존합니다.
  alternative_readings:
  - ‘다른 여자’를 보충하는 읽기
  - ‘다른 아내’를 보충하는 읽기
  rationale: 영문 POB 개정이 ‘woman’을 제거한 점은 그리스어의 간결함을 반영하므로, 한국어도 범위를 넓히지 않도록 했습니다.
  doctrine_reference: 원문 의미 보존
