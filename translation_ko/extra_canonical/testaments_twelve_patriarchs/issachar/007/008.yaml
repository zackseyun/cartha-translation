review_pass:
  verdict: revise
  source_fidelity: 헬라어의 명령 내용(아들들에게 자신을 헤브론으로 올려 가게 하고, 그곳에서 조상들과 함께 장사 지내게 함)은 대체로 반영되어 있습니다. 다만 ‘메어 올리고’는 시신 운구를 뜻할 수는 있으나 현대 표준어 문장에서는 부자연스럽고, ‘묻게 하셨습니다’는 주어에 대한 불필요한 높임과 어색한 사동 구성이 있습니다. 제시된 본문에는 ‘동굴’이 없으므로 이를 보태지 않습니다.
  naturalness: ‘그는 … 명하여’와 ‘… 하셨습니다’의 결합은 현대 합쇼체 서술에서 높임의 기준이 흔들립니다. ‘명령했습니다’와 ‘장사 지내게 했습니다’로 통일하면 자연스럽고 분명합니다.
  terminology: ‘헤브론’은 통용 표기이며, μετὰ τῶν πατέρων αὐτοῦ는 한국어 성서 문맥에서 자연스러운 ‘그의 조상들과 함께’로 옮길 수 있습니다. θάπτω에는 ‘묻다’보다 장례 맥락을 명확히 하는 ‘장사 지내다’가 적절합니다.
  issues:
  - severity: medium
    issue: ‘묻게 하셨습니다’의 높임 및 사동 표현
    rationale: 본문의 주어가 존대 대상이라는 문맥적 근거가 없는데 ‘하셨습니다’로 높였고, ‘명하여 … 묻게 하다’의 연결도 어색합니다. 현대 합쇼체 평서 서술로 ‘장사 지내게 했습니다’가 적절합니다.
  - severity: medium
    issue: ‘메어 올리고’의 현대어 자연성
    rationale: 운구 의미를 의도한 선택이나, 사람을 ‘메다’는 표현은 이 문맥에서 자연스럽지 않습니다. ἀναγάγω의 상향 이동은 ‘옮겨 가게 하고’로 무리 없이 보존됩니다.
  revised_text: 이 말을 한 뒤, 그는 자기 아들들에게 자신을 헤브론으로 옮겨 가서 그곳에 자기 조상들과 함께 장사 지내라고 명령했습니다.
