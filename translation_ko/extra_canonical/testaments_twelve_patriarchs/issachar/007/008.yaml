  text: And after saying these things, he commanded his sons to carry him up to Hebron, and there to bury him with his fathers.
translation:
  language: ko
  text: 그리고 이 말을 한 뒤에 그는 자기 아들들에게 명하여, 자신을 헤브론으로 메어 올리고, 거기서 자기 조상들과 함께 묻게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνετείλατο τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: he commanded his sons
  chosen_korean: 자기 아들들에게 명하여
  alternatives_korean:
  - 자기 아들들에게 명령하여
  - 아들들에게 명하여
  lexicon: ἐντέλλομαι
  rationale: 명령 행위를 자연스럽게 살리되, 서술체 문맥에 맞게 '명하여'로 다듬어 원문의 행위와 한국어 흐름을 함께 유지했습니다.
- source_word: ἀναγάγωσιν αὐτὸν ἐν Χεβρών
  english_pob_choice: carry him up to Hebron
  chosen_korean: 자신을 헤브론으로 메어 올리고
  alternatives_korean:
  - 자신을 헤브론으로 데려가고
  - 자신을 헤브론으로 올려 가고
  lexicon: ἀναγάγω
  rationale: 단순한 이동보다 장례를 위한 운구의 뉘앙스가 있어 '메어 올리고'로 옮겨 올라가는 방향성과 부담을 함께 드러냈습니다.
- source_word: κακεῖ θάψωσιν αὐτὸν
  english_pob_choice: and there to bury him
  chosen_korean: 거기서
  alternatives_korean:
  - 그리고 거기서
  - 그곳에
  lexicon: κακεῖ
  rationale: 장소 지시어를 간결하게 살려, 앞의 목적절과 연결되는 장례 지시를 자연스럽게 표현했습니다.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  english_pob_choice: with his fathers
  chosen_korean: 자기 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 조상들과 함께
  lexicon: μετά + πατέρες
  rationale: 직역의 '아버지들'은 한국어에서 어색하므로, 조상 집단을 가리키는 관용적 의미를 살려 '조상들'로 옮겼습니다.
