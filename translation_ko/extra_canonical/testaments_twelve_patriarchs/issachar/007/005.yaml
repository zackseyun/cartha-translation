id: T12P.ISS.7.5
reference: Testament of Issachar 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. ⌈Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα καὶ πτωχῷ μετέδωκα ἄρτον¹² μου⁷. Εὐσέβειαν ἐποίησα¹⁴ ἐν πάσαις ταῖς¹⁵ ἡμέραις μου, *᾿Αλήθειαν ἐφύλαξα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/005.yaml
  text: I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth.
translation:
  language: ko
  text: 나는 고통받는 모든 사람과 함께 신음했고, 가난한 사람에게 내 빵을 나누어 주었습니다. 나는 내 모든 날 동안 경건을 실천했고, 진리를 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παντὶ ἀνθρώπῳ ὀδυνομένῳ
  english_pob_choice: every person in pain
  chosen_korean: 고통받는 모든 사람
  alternatives_korean:
  - 모든 고통받는 사람
  - 아픔을 겪는 모든 사람
  lexicon: πάντες/πᾶς, ἀνθρώπος, ὀδυνάομαι
  rationale: dative의 포괄성과 현재분사 ὀδυνομένῳ의 지속적 고통을 살려, '고통받는'으로 자연스럽게 옮겼습니다.
- source_word: συνεστέναξα
  english_pob_choice: I groaned together with
  chosen_korean: 함께 신음했고
  alternatives_korean:
  - 함께 탄식했고
  - 동고동락하며 신음했고
  lexicon: συναστενάζω
  rationale: συν-의 연대감을 살려 '함께'를 유지하고, 내적 고통의 소리를 드러내는 '신음'을 택했습니다.
- source_word: πτωχῷ μετέδωκα ἄρτον μου
  english_pob_choice: I shared my bread with the poor
  chosen_korean: 가난한 사람과는 내 빵을 나누었습니다
  alternatives_korean:
  - 가난한 이에게 내 빵을 나누어 주었습니다
  - 가난한 사람과 내 빵을 함께 나누었습니다
  lexicon: πτωχός, μεταδίδωμι, ἄρτος
  rationale: πτωχός를 '가난한 사람'으로 옮겨 사회적 빈곤을 분명히 했고, ἄρτος는 본문 의미를 해치지 않는 일상어 '빵'으로 풀었습니다.
- source_word: Εὐσέβειαν ἐποίησα ἐν πάσαις ταῖς ἡμέραις μου
  english_pob_choice: I practiced godliness in all my days
  chosen_korean: 나는 모든 나날에 경건을 행했고
  alternatives_korean:
  - 나는 모든 날에 경건을 실천했고
  - 나는 평생 경건을 행했고
  lexicon: εὐσέβεια, ποιέω, πᾶς, ἡμέρα
  rationale: εὐσέβεια는 단순한 종교심보다 삶의 태도 전체를 가리키므로 '경건'을 유지했고, '모든 나날'로 지속성을 살렸습니다.
- source_word: ᾿Αλήθειαν ἐφύλαξα
  english_pob_choice: I kept truth
  chosen_korean: 진리를 지켰습니다
  alternatives_korean:
  - 진실을 지켰습니다
  - 진리를 보전했습니다
  lexicon: ἀλήθεια, φυλάσσω
  rationale: ἀλήθεια는 단순한 사실 진술보다 윤리적·신앙적 진리의 범위를 가지므로 '진리'가 가장 적절합니다.
theological_decisions:
- issue: 경건과 진리의 병렬 서술
  chosen_reading: 화자가 자선 행위와 경건 실천, 진리 수호를 자기 삶의 일관된 표지로 제시합니다.
  alternative_readings:
  - 단순한 도덕적 자기변호로 읽는 해석
  - 공동체 규범의 요약으로 읽는 해석
  rationale: 본문은 행위 목록을 통해 삶 전체의 신실함을 증언하므로, 이를 축소하지 않고 병렬 구조를 그대로 살렸습니다.
  doctrine_reference: 성화와 윤리적 증언의 일관성
- issue: 고통받는 이들과의 연대
  chosen_reading: '''함께 신음했고''로 번역해 단순 동정이 아니라 고통의 공유를 드러냈습니다.'
  alternative_readings:
  - '''불쌍히 여겼다''로 완화하는 번역'
  - '''탄식했다''로만 옮겨 연대성을 약화하는 번역'
  rationale: συν- 접두사의 공동성을 보존해야 화자가 타인의 고통을 자신의 것으로 함께 짊어진 의미가 드러납니다.
  doctrine_reference: 이웃 사랑과 연대의 윤리
