revisions:
- from: 나는 고통받는 모든 사람과 함께 신음했고, 가난한 사람과는 내 빵을 나누었습니다. 나는 모든 나날에 경건을 행했고, 진리를 지켰습니다.
  to: 나는 고통받는 모든 사람과 함께 신음했고, 가난한 사람에게 내 빵을 나누어 주었습니다. 나는 내 모든 날 동안 경건을 실천했고, 진리를 지켰습니다.
  rationale: 수혜자 여격을 정확히 반영하도록 ‘가난한 사람에게’로 고쳤으며, 나머지는 원문의 의미를 유지하면서 현대 한국어 문체에 맞게 최소한으로 다듬었습니다. 원문에 제시된 본문상 이문이나 해석상 불확실성을 새로 만들지 않았으므로 각주는 필요하지 않습니다.
