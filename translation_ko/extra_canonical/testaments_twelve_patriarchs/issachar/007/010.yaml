  text: And he stretched out his feet and died in a good old age, having every limb sound, and being strong he slept the eternal sleep.
translation:
  language: ko
  text: 그는 그들에게 말했습니다. “내 말을 들으십시오. 그는 아름다운 노년기에 발을 뻗고 죽었으며, 모든 지체가 온전하였고, 힘이 있던 그는 영원한 잠에 들었습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  english_pob_choice: He said to them
  chosen_korean: 그는 그들에게 말했습니다
  alternatives_korean:
  - 그가 그들에게 말했습니다
  - 그는 그들에게 이르렀습니다
  lexicon: ἔφη/λέγω 계열
  rationale: 서술문으로 자연스럽게 풀되, ‘말했습니다’로 발화 행위를 분명히 드러내어 뒤따르는 직접화법과 잘 연결했습니다.
- source_word: Ἀκούσατέ μου
  english_pob_choice: Listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 제 말을 들으십시오
  - 내게 들으십시오
  lexicon: ἀκούω
  rationale: 명령형의 직접성과 공손한 청중 호칭을 살려 표준적인 현대 한국어 명령문으로 옮겼습니다.
- source_word: ἐν γήρει καλῷ
  english_pob_choice: in a good old age
  chosen_korean: 아름다운 노년기에
  alternatives_korean:
  - 좋은 노년에
  - 복된 노년에
  lexicon: γήρας + καλός
  rationale: 단순한 수명 길이보다 ‘좋음/아름다움’의 평가가 결합된 표현이어서, 직역적이면서도 자연스러운 ‘아름다운 노년기’로 옮겼습니다.
- source_word: ὕπνωσεν ὕπνον αἰώνιον
  english_pob_choice: he slept the eternal sleep
  chosen_korean: 영원한 잠에 들었습니다
  alternatives_korean:
  - 영원한 잠을 잤습니다
  - 영원한 잠에 빠졌습니다
  lexicon: ὕπνος αἰώνιος
  rationale: 죽음을 ‘잠’으로 비유하는 원문 이미지를 보존하면서, 한국어 문맥에서는 ‘들었습니다’가 가장 자연스럽고 완곡합니다.
theological_decisions:
- issue: 죽음을 ‘잠’으로 부르는 비유의 보존
  chosen_reading: ‘영원한 잠에 들었습니다’로 직역적 비유를 유지했습니다.
  alternative_readings:
  - 죽었습니다
  - 잠들었습니다
  rationale: 원문은 단순한 사망 통보가 아니라 죽음을 ‘영원한 잠’으로 묘사합니다. 이 비유를 약화하지 않고 그대로 살리는 것이 서술의 신학적 색채를 유지합니다.
  doctrine_reference: 죽음의 은유적 표현 보존
