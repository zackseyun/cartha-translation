  text: 9. Καὶ ἐκτείνας τοὺς πόδας αὐτοῦ³⁷ ἐκοιμήθη ἐν γήρει καλῷ ὕπνον αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/009.yaml
  text: And stretching out his feet, he fell asleep in a good old age the eternal sleep.
translation:
  language: ko
  text: 그리고 그는 발을 뻗은 채 좋은 노년기에 잠들었으며, 영원한 잠을 잤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  english_pob_choice: stretching out his feet
  chosen_korean: 발을 뻗은 채
  alternatives_korean:
  - 그의 발을 펴고
  - 발을 내민 채
  lexicon: ἐκτείνω
  rationale: 동작의 결과 상태를 자연스럽게 살리면서도, 발을 실제로 뻗는 모습을 간결하게 반영했습니다.
- source_word: ἐκοιμήθη
  english_pob_choice: fell asleep
  chosen_korean: 잠들었으며
  alternatives_korean:
  - 잠들었고
  - 잠들어
  lexicon: κοιμάω
  rationale: 원문의 ‘잠들다’는 완곡한 죽음 표현을 한국어에서도 그대로 살려, 다음 절의 ‘영원한 잠’과 호응하게 했습니다.
- source_word: ἐν γήρει καλῷ
  english_pob_choice: in a good old age
  chosen_korean: 좋은 노년기에
  alternatives_korean:
  - 복된 노년에
  - 아름다운 노년에
  lexicon: γῆρας
  rationale: γήρει καλῷ의 직역을 유지하되 한국어에서 자연스러운 시간 부사구로 옮겨, 단순히 ‘오래 살았다’는 의미를 넘어서 ‘좋은/복된 노년’의 뉘앙스를 보존했습니다.
- source_word: ὕπνον αἰώνιον
  english_pob_choice: the eternal sleep
  chosen_korean: 영원한 잠
  alternatives_korean:
  - 영원한 수면
  - 영원한 잠자리
  lexicon: ὕπνος
  rationale: 죽음에 대한 관용적 표현을 직설적으로 살리면서도 한국어 합쇼체 문맥에서 과도하게 설명적이지 않게 유지했습니다.
theological_decisions:
- issue: 죽음을 ‘잠’으로 표현하는 완곡법
  chosen_reading: ‘잠들었으며 … 영원한 잠을 잤습니다’로, 죽음을 단순 소멸이 아니라 잠에 비유한 원문의 표현을 유지했습니다.
  alternative_readings:
  - ‘죽었습니다’로 직접 번역
  - ‘평안히 세상을 떠났습니다’로 완화
  rationale: 원문은 κοιμάω와 ὕπνον αἰώνιον을 통해 의도적으로 완곡한 죽음 표상을 사용하므로, 한국어도 그 신학적·문학적 긴장을 보존해야 합니다.
  doctrine_reference: '성서의 죽음-잠 비유(예: 단 12:2, 요 11:11-14의 관련 비유)'
