  naturalness: “일백스물여섯” is understandable but dated in otherwise modern standard Korean; “백스물여섯” is more natural. The revised phrasing preserves the source’s deliberate repetition of seeing while reading naturally in formal-polite Korean.
  terminology: “죽음에 이르는 죄” is a faithful, non-denominational rendering of ἁμαρτίαν εἰς θάνατον. “제 안에 ... 있음을 알지 못했습니다” keeps ἐν ἐμοὶ and the γνώσκω/οἶδα-type knowledge wording without turning it into a stronger claim of sinlessness or a doctrine-specific category.
