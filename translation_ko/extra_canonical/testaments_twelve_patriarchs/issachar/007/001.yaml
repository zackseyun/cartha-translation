  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VII. *Ἰδοὺ οὖν ὡς ὁρᾶτε, ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω¹, καὶ οὐκ *ἔγνων †ἐν ἐμοὶ ἁμαρτίαν Γεἰς θάνατον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/001.yaml
  text: 'See then, as you see: I am one hundred and twenty-six years old, and I have not known any sin in me leading to death.'
translation:
  language: ko
  text: 그러므로 보십시오. 여러분이 보시는 바와 같이, 나는 백스물여섯 살입니다. 나는 제 안에 죽음에 이르는 죄가 하나라도 있음을 알지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ οὖν ὡς ὁρᾶτε
  english_pob_choice: See then, as you see
  chosen_korean: 그러므로 이제 보십시오
  alternatives_korean:
  - 그러므로 이제 보아라
  - 그러니 이제 보십시오
  lexicon: ἰδού / ὁράω
  rationale: ὡς ὁρᾶτε의 직접적인 관찰 호소를 살려, 장중한 담화 전환으로 ‘보십시오’를 택했습니다. ‘as you see’의 의미는 문맥상 ‘이제 보십시오’에 자연스럽게 담깁니다.
- source_word: ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω
  english_pob_choice: I am one hundred and twenty-six years old
  chosen_korean: 나는 일백스물여섯 살입니다
  alternatives_korean:
  - 나는 백스물여섯 살입니다
  - 나는 126세입니다
  lexicon: ἑκατόν / εἴκοσι / ἓξ / ἔτη
  rationale: 연령 진술을 현대 한국어에서 자연스럽고 분명하게 옮겨 ‘살입니다’로 처리했습니다. ‘일백스물여섯’은 수사 의미를 보존하면서도 문체상 무리하지 않습니다.
- source_word: οὐκ ἔγνων ... ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον
  english_pob_choice: I have not known any sin in me leading to death
  chosen_korean: 내 안에 죽음에 이르는 어떤 죄도 알지 못했습니다
  alternatives_korean:
  - 내 안에 죽음으로 향하는 어떤 죄도 알지 못했습니다
  - 내 안에서 죽음에 이르는 죄를 알지 못했습니다
  lexicon: ἁμαρτία / εἰς θάνατον / ἐν ἐμοί
  rationale: ‘ἐν ἐμοί’를 단순한 행위 전이보다 내면적 실재로 보아 ‘내 안에’로 옮겼고, εἰς θάνατον은 POB의 ‘leading to death’를 따라 ‘죽음에 이르는’으로 처리했습니다. ‘알지 못했습니다’는 οὐκ ἔγνων의 인식 동사를 직접 반영합니다.
theological_decisions:
- issue: 죄와 죽음의 관계를 어떻게 한국어로 드러낼지
  chosen_reading: ‘죽음에 이르는 어떤 죄’로 옮겨, 죄의 일반성이 아니라 치명적 결과를 지닌 죄를 구별해 드러냈습니다.
  alternative_readings:
  - ‘죽음으로 가는 죄’
  - ‘사망에 이르는 죄’
  rationale: 원문은 특정 범주의 죄가 죽음에 이른다는 방향성을 말하므로, ‘죽음에 이르는’이 결과 지향을 가장 सीधे하게 전달합니다.
  doctrine_reference: 문맥상 도덕적 자기진술이며, 후대의 교리적 ‘사망에 이르는 죄’ 용어를 자동 이식하지 않도록 주의했습니다.
