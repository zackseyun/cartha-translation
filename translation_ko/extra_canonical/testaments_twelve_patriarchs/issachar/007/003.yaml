  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/003.yaml
  text: I did not drink wine for deception, and I did not desire anything that belonged to my neighbor.
translation:
  language: ko
  text: 나는 속이기 위해 포도주를 마시지 않았고[6], 이웃의 어떤 것도 탐내지 않았습니다.[7]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '6'
    text: 그리스어 판본의 각주 표지입니다. 제공된 자료에는 이 표지에 해당하는 주석 내용이 포함되어 있지 않습니다.
    reason: 원문 판본에 나타난 앵커를 보존하되, 제공되지 않은 비평 장치의 내용을 추정하여 보충하지 않습니다.
  - marker: '7'
    text: 그리스어 판본의 각주 표지입니다. 제공된 자료에는 이 표지에 해당하는 주석 내용이 포함되어 있지 않습니다.
    reason: 원문 판본에 나타난 앵커를 보존하되, 제공되지 않은 비평 장치의 내용을 추정하여 보충하지 않습니다.
lexical_decisions:
- source_word: Οἶνον εἰς ἀποπλάνησιν
  english_pob_choice: wine for deception
  chosen_korean: “속임수를 위해 포도주를”
  alternatives_korean:
  - “미혹을 위해 포도주를”
  - “배반을 위해 포도주를”
  lexicon: οἶνος, ἀποπλάνησις
  rationale: ἀποπλάνησιν은 단순한 ‘미혹’보다 의도적 기만·유인에 가깝기 때문에, POB의 ‘for deception’을 살려 ‘속임수’를 택했습니다.
- source_word: οὐκ ἔπιον
  english_pob_choice: I did not drink
  chosen_korean: “마시지 않았으며”
  alternatives_korean:
  - “마시지 않았습니다”
  - “마시지 않았고”
  lexicon: πίνω
  rationale: 서술의 병렬성을 살리기 위해 앞절과 연결되는 합쇼체 과거형 ‘-지 않았으며’로 옮겼습니다.
- source_word: πᾶν ἐπιθύμημα
  english_pob_choice: anything
  chosen_korean: “어떤 것에도”
  alternatives_korean:
  - “모든 욕망을”
  - “아무것도”
  lexicon: ἐπιθύμημα, πᾶς
  rationale: ἐπιθύμημα는 단순 물건보다 ‘바라는 대상/욕망의 대상’의 뉘앙스가 있어, POB의 ‘anything’에 맞추되 대상성을 살렸습니다.
- source_word: τοῦ πλησίου
  english_pob_choice: that belonged to my neighbor
  chosen_korean: “이웃의”
  alternatives_korean:
  - “내 이웃에게 속한”
  - “이웃의 소유를”
  lexicon: πλησίον
  rationale: 소유 관계가 문맥상 함축되므로, 한국어에서는 ‘이웃의 것’보다 자연스러운 ‘이웃의’로 압축했습니다.
theological_decisions:
- issue: 윤리적 진술의 강도
  chosen_reading: 두 절 모두 자기 정당화보다 절제와 비탐심을 강조하는 직접 진술로 옮겼습니다.
  alternative_readings:
  - 도덕적 교훈 문장으로 완화
  - 해석적 주석어를 덧붙여 맥락화
  rationale: 본문의 단순하고 단정적인 자기 증언 형식을 유지하는 것이 원문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 성화·자기절제의 내적 윤리
- issue: ‘욕심내지 않았습니다’의 선택
  chosen_reading: ἐπεθύμησα를 ‘욕심내다’로 번역해 금지된 탐욕의 의미를 분명히 했습니다.
  alternative_readings:
  - ‘원하지 않았습니다’
  - ‘바라지 않았습니다’
  rationale: 한국어에서 ‘욕심내다’가 이웃의 소유를 탐하는 뉘앙스를 가장 직접적으로 전달합니다.
  doctrine_reference: 계명적 비탐심의 윤리
