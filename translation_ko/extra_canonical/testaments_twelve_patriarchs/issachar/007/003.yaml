  rationale: 직접 목적어와 소유 관계를 분명히 하도록 둘째 절을 “이웃의 어떤 것도 탐내지 않았습니다”로 고쳤습니다. 첫째 절은 ἀποπλάνησις의 ‘기만/속임’ 의미를 자연스러운 목적 표현으로 유지했습니다. 원문에 보이는 각주 표지는 대응 번호로 정리했으며, 미제공 장치 내용은 만들어 내지 않았습니다.
