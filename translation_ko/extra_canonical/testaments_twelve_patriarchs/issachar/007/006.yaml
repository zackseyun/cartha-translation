    issue: ‘내 자녀보다 더하여’라는 비교 표현
    rationale: ‘더하여’는 이 문맥에서 현대어로 어색하며, 무엇을 누구보다 더 사랑했다는 비교 관계가 즉시 파악되지 않습니다. 비교절을 독립된 서술로 정리하는 것이 원문의 의미를 더 명료하고 자연스럽게 전달합니다.
