  terminology: ‘주님’, ‘모든 사람’, ‘온 마음으로’, ‘자녀들’은 현대 한국어에서 자연스럽고 원문의 포괄성 및 경건한 문체에 적절합니다. ‘주님’은 원문의 Κύριον에 대한 기존 선택을 유지합니다.
  issues:
