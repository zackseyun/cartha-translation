  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 6. Τὸν Κύριον ἠγάπησα¹⁷ καὶ πάντα ἄνθρωπον ἐξ ὅλης τῆς καρδίας¹⁸ μου *ὑπὲρ τὰ²¹ τέκνα μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/006.yaml
  text: I loved the Lord and every person with all my heart, more than my children.
translation:
  language: ko
  text: 나는 주님을 사랑하였고, 모든 사람을 온 마음으로 사랑하였으며, 내 자녀들보다도 더 사랑하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님을
  alternatives_korean:
  - 주를
  - 주(主)를
  lexicon: Κύριος
  rationale: 문맥상 하나님을 가리키는 호칭이므로, 한국어에서는 관계성과 경외를 함께 살리는 표준적 표현인 「주님」을 썼습니다.
- source_word: ἠγάπησα
  english_pob_choice: I loved
  chosen_korean: 사랑하였습니다
  alternatives_korean:
  - 사랑했습니다
  - 사랑하였나이다
  lexicon: ἀγαπάω
  rationale: 완료된 과거의 사랑 행위를 평서적으로 옮기되, 현대 합쇼체로 자연스럽게 표현했습니다.
- source_word: πάντα ἄνθρωπον
  english_pob_choice: every person
  chosen_korean: 모든 사람을
  alternatives_korean:
  - 모든 이를
  - 모든 인간을
  lexicon: πᾶς + ἄνθρωπος
  rationale: 성별을 배제하는 포괄적 의미를 살려 「모든 사람」으로 옮겼습니다.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  english_pob_choice: with all my heart
  chosen_korean: 온 마음으로
  alternatives_korean:
  - 마음 다해
  - 온전히 마음을 다하여
  lexicon: ק/καρδία (heart)
  rationale: 직역보다 한국어 관용에 맞는 표현을 택하되, 전인적 헌신이라는 의미는 유지했습니다.
- source_word: ὑπὲρ τὰ τέκνα μου
  english_pob_choice: more than my children
  chosen_korean: 내 자녀보다 더하여
  alternatives_korean:
  - 내 자녀보다 더
  - 내 자녀들보다 더
  lexicon: ὑπέρ + comparative
  rationale: 비교의 우위라는 원문 의미를 분명히 드러내기 위해 「보다 더하여」로 옮겼습니다.
theological_decisions:
- issue: 주님 사랑과 사람 사랑의 우선순위 비교
  chosen_reading: 원문처럼 주님 사랑과 모든 사람 사랑을 함께 두되, 마지막 비교구를 통해 자녀 사랑보다도 앞서는 강한 헌신을 드러냈습니다.
  alternative_readings:
  - 자녀보다 더 사랑했습니다
  - 자녀보다 더 사랑하였습니다
  rationale: POB의 영어 본문이 already "more than my children"을 분명히 하므로, 비교의 긴장을 약화하지 않고 유지하는 것이 필요합니다.
  doctrine_reference: 윤리적 헌신과 제자도에 관한 직접적 서술
