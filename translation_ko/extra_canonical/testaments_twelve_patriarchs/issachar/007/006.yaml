  source_fidelity: 그리스어는 ‘주님’과 ‘모든 사람’을 사랑했다는 두 목적어를 병렬로 두며, ‘온 마음으로’와 ‘내 자녀들보다 더’라는 수식은 문맥상 ‘모든 사람’을 사랑한 방식과 비교를 강조합니다. 개정문은 이 비교를 유지하고, 비교 대상이 화자의 자녀임을 분명히 합니다.
