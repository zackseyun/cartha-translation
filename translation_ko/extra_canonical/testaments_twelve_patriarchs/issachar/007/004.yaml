  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 4. Δόλος⁸ οὐκ ἐγένετο *ἐν τῇ¹⁰ καρδίᾳ μου ψεῦδος οὐκ ἀνῆλθε διὰ τῶν¹¹ χειλέων μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/004.yaml
  text: No deceit came to be in my heart, and no lie went up through my lips.
translation:
  language: ko
  text: 제 마음에는 속임이 생기지 않았고, 제 입술로는 거짓이 올라오지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δόλος
  english_pob_choice: deceit
  chosen_korean: 속임
  alternatives_korean:
  - 속임수
  - 기만
  - 간계
  lexicon: δόλος
  rationale: 문맥상 마음 안에서 생겨난 도덕적 ‘속임/기만’의 부재를 말하므로, 과장된 ‘간계’보다 간결한 ‘속임’이 자연스럽고 원문 의미를 유지합니다.
- source_word: ἐν τῇ καρδίᾳ μου
  english_pob_choice: in my heart
  chosen_korean: 제 마음에는
  alternatives_korean:
  - 내 마음 안에는
  - 제 심장에는
  lexicon: καρδία
  rationale: 히브리적·고대적 인간 이해에서 καρδία는 내면 전체를 가리키므로, 한국어로는 ‘마음’이 가장 직접적입니다.
- source_word: ψεῦδος
  english_pob_choice: lie
  chosen_korean: 거짓
  alternatives_korean:
  - 거짓말
  - 허위
  - 망령됨
  lexicon: ψεῦδος
  rationale: 원문은 발화 내용의 허위성을 말하므로, 구어적인 ‘거짓말’보다 명사적·문어적인 ‘거짓’이 대구를 살립니다.
- source_word: ἀνῆλθε διὰ τῶν χειλέων μου
  english_pob_choice: went up through my lips
  chosen_korean: 제 입술로는 올라오지 않았습니다
  alternatives_korean:
  - 제 입술을 통해 올라오지 않았습니다
  - 제 입술에서 나오지 않았습니다
  lexicon: ἀναβαίνω + διά + χείλη
  rationale: ‘올라오다’는 원문의 상승 이미지를 보존하며, ‘입술에서 나오다’보다 더 स्रोत직역적이지만 한국어로도 충분히 자연스럽습니다.
theological_decisions:
- issue: 부정 병렬의 반복 구조
  chosen_reading: 두 절을 모두 동일한 부정 구조로 옮겨, 마음과 입술의 이중 검증을 드러냈습니다.
  alternative_readings:
  - 한 문장으로 압축해 ‘마음에도, 입술에도 속임이나 거짓이 없었습니다’라고 할 수 있음
  rationale: 원문은 ‘속임’과 ‘거짓’을 각각 마음과 입술에 대응시키는 병렬을 이루므로, 이를 유지하는 편이 저자의 윤리적 강조를 더 분명히 전달합니다.
  doctrine_reference: 성화와 진실성의 일치에 대한 일반적 성경 윤리
