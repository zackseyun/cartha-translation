id: T12P.ISS.4.6
reference: Testament of Issachar 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 6. Πορεύεται²⁹ δὲ³⁰ ἐν *ἁπλότητι ⌜ψυχῆς⌝³¹ πάντα³² ὁρᾷ³³ ἐν *εὐθύτητι ⌜καρδίας⌝³⁴ *μὴ ἐπιδεχόμενος³⁵ *ὀφθαλμοὺς πονηροὺς³⁶ ἀπὸ τῆς πλάνης τοῦ κόσμου *ἵνα μὴ ἴδῃ διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/006.yaml
  text: But he walks in simplicity of soul; he sees all things with uprightness of heart, not accepting evil eyes from the world’s error, so that he may not see the commandments of the Lord as distorted.
translation:
  language: ko
  text: 그러나 그는 마음의 순박함 가운데 걸으며, 마음의 올곧음으로 모든 것을 봅니다. 그는 세상의 미혹에서 비롯된 악한 눈들을 받아들이지 않습니다. 이는 주님의 계명들을 비뚤어진 것으로 보지 않기 위해서입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητι ψυχῆς
  english_pob_choice: simplicity of soul
  chosen_korean: 마음의 단순함
  alternatives_korean:
  - 영혼의 단순함
  - 혼의 순결함
  - 마음의 순박함
  lexicon: ἁπλότης, ψυχή
  rationale: ψυχῆς를 ‘영혼’보다 한국어 자연성이 높은 ‘마음’으로 풀되, ἁπλότητι의 핵심인 꾸밈없음·분별되지 않은 단일성을 ‘단순함’으로 살렸습니다.
- source_word: ἐν εὐθύτητι καρδίας
  english_pob_choice: with uprightness of heart
  chosen_korean: 마음의 올곧음으로
  alternatives_korean:
  - 마음의 정직함으로
  - 마음의 바름으로
  - 마음의 의로움으로
  lexicon: εὐθύτης, καρδία
  rationale: εὐθύτης는 도덕적 ‘정직함’보다 직선적·비틀림 없는 상태를 드러내는 ‘올곧음’이 더 가깝고, καρδία는 문맥상 ‘마음’이 가장 자연스럽습니다.
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηροὺς
  english_pob_choice: not accepting evil eyes
  chosen_korean: 악한 눈을 받아들이지 않으므로
  alternatives_korean:
  - 악한 눈을 용납하지 않으므로
  - 사악한 눈을 받아들이지 않으므로
  - 악한 시선을 받아들이지 않으므로
  lexicon: ὀφθαλμοί πονηροί
  rationale: 직역상 ‘악한 눈들’이지만, 한국어에서는 관용적 의미를 살려 ‘악한 눈’으로 옮기되, ‘받아들이지 않으므로’로 행위적 거부를 분명히 했습니다.
- source_word: διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  english_pob_choice: the commandments of the Lord as distorted
  chosen_korean: 주님의 계명들을 비뚤어진 것으로
  alternatives_korean:
  - 주님의 계명들을 뒤틀린 것으로
  - 주님의 계명들을 왜곡된 것으로
  - 주님의 계명들이 비뚤어졌다고
  lexicon: διαστρέφω, ἐντολή, κύριος
  rationale: ‘distorted’의 결과 상태를 한국어 서술형으로 옮겨, 계명 자체를 ‘비뚤어진 것’으로 오해하지 않도록 하면서도 왜곡된 인식의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: ‘Lord’의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  - 주인
  rationale: 이 문맥의 κύριος는 지칭 대상을 독자가 즉시 알아보도록 하는 서사적 호칭이므로, 합쇼체 본문에서는 ‘주님’이 가장 자연스럽습니다.
  doctrine_reference: POB source-rendering convention for κύριος when not an explicit OT citation
- issue: ‘world’s error’와 ‘evil eyes’의 관계
  chosen_reading: 세상의 오류로부터 오는 악한 눈
  alternative_readings:
  - 세상의 오류인 악한 눈
  - 세상의 미혹에서 오는 악한 시선
  rationale: 원문은 ἀπὸ τῆς πλάνης τοῦ κόσμου를 ‘악한 눈’과 연결해 출처를 밝히므로, 단순히 수사로만 처리하지 않고 ‘세상의 오류로부터 오는’이라고 보존했습니다.
  doctrine_reference: source-level syntactic relation in Greek participial phrase
