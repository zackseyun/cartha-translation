base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/005.yaml
  text: He does not envy in deliberations, nor does malicious envy consume his soul, nor is there distraction in greed in his mind.
translation:
  language: ko
  text: 그는 의논하는 가운데 시기하지 않으며, 악의적인 시샘이 그의 영혼을 소모하지도 않으며, 그의 마음에는 탐욕 가운데서 생기는 산만함도 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ ζηλοῖ ἐν διαβουλίοις
  english_pob_choice: He does not envy in deliberations
  chosen_korean: 그는 의논할 때에 시기하지 않으며
  alternatives_korean:
  - 그는 의논 가운데 시기하지 않으며
  - 그는 숙의할 때에 질투하지 않으며
  lexicon: ζηλόω / διαβούλιον
  rationale: ζηλοῖ는 단순한 질투보다 관계적 시기·시샘의 뉘앙스가 있어 ‘시기하다’로 옮겼고, διαβουλίοις는 공식적 토론·의논의 자리이므로 ‘의논할 때에’로 자연스럽게 표현했습니다.
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  english_pob_choice: malicious envy consume his soul
  chosen_korean: 악의적인 시기는 그의 영혼을 소모하지 않으며
  alternatives_korean:
  - 악의적인 시기는 그의 영혼을 갉아먹지 않으며
  - 악한 시샘이 그의 혼을 녹여버리지 않으며
  lexicon: βάσκανος / ἐκτήκει / ψυχή
  rationale: βάσκανος는 ‘악의적인 시기, 해로운 시샘’의 뜻을 살려 ‘악의적인 시기’로 옮겼고, ἐκτήκει는 ‘소모하다/녹이다’의 강한 소진 이미지를 반영해 ‘소모하다’를 택했습니다. ψυχή는 이 문맥에서 인격 전체를 가리키는 말로 ‘영혼’이 적절합니다.
- source_word: περισπασμὸς ἐν ἀπληστείᾳ ἐν νοΐ
  english_pob_choice: there is distraction in greed in his mind
  chosen_korean: 탐욕 속에서 그의 마음은 산만하지 않습니다
  alternatives_korean:
  - 탐욕 가운데 그의 마음은 분산되지 않습니다
  - 탐심 속에서 그의 생각은 분주하지 않습니다
  lexicon: περισπασμός / ἀπληστία / νοῦς
  rationale: περισπασμός는 ‘산만함, 주의가 흩어짐’이 핵심이므로 ‘산만하지 않습니다’로 풀었고, ἀπληστία는 단순한 욕심보다 끝없는 탐욕이어서 ‘탐욕’이 적절합니다. νοΐ는 지성/마음의 자리로, 한국어에서는 문맥상 ‘마음’이 가장 안정적입니다.
theological_decisions:
- issue: 복수형적 수단구문(ἐν διαβουλίοις, ἐν ἀπληστείᾳ)와 부정의 병렬 구조
  chosen_reading: 세 개의 병렬 부정 진술을 그대로 살려, 각 항목이 서로 다른 내적 태도와 작용을 가리키도록 번역했습니다.
  alternative_readings:
  - 하나의 문장으로 더 압축해 의미를 통합하는 번역
  - 후반부를 의역해 성품 묘사로 부드럽게 만드는 번역
  rationale: 이 절은 덕목 대비를 이루는 선언문이므로 병렬성과 반복을 유지하는 편이 원문의 윤리적 강도를 더 잘 드러냅니다.
  doctrine_reference: 문맥상 윤리적 성품 묘사; 특정 교리 쟁점 없음
