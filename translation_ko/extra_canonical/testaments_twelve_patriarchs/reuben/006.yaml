review_pass:
  verdict: revise
  source_fidelity: 전반적으로 권면의 명령형과 레위·유다에 관한 난해한 전승을 잘 보존했습니다. 그러나 3절의 ἀνίατος는 ‘고치기 어려운’보다 ‘고칠 수 없는’이 정확하며, 6절은 하나님께서 ‘그들을 위해’ 보복하신다는 뜻이지 그들에게 보복을 집행하신다는 뜻이 아닙니다. 8절의 ‘말씀하실 일을’도 원문의 난해함을 보존하면서 더 정확히 옮길 필요가 있습니다.
  naturalness: 현대 한국어 합쇼체의 문체는 대체로 자연스럽습니다. 다만 ‘음행에는 그 안에’는 군더더기가 있고, ‘그의 안에서’는 한국어로 다소 불명확하므로 문장 구조를 다듬었습니다. 각주 표지는 해당 본문에 직접 배치해야 합니다.
  terminology: ‘음행’, ‘벨리아르’, ‘제사직’, ‘왕권’, ‘씨’는 본문의 어휘와 전승적 어조에 적절합니다. προσκυνέω는 후대의 교리적 의미를 덧붙이지 않도록 ‘절하십시오’로 유지했습니다. ποιεῖν ἀλήθειαν은 관용적 의미를 반영하여 ‘진실하게 행하고’로 옮기고 각주로 보완했습니다.
  issues:
  - severity: medium
    issue: 3절의 ‘고치기 어려운 병’
    rationale: ἀνίατος는 단지 치료가 어렵다는 뜻보다 ‘치료할 수 없는, 불치의’라는 뜻입니다.
  - severity: high
    issue: 6절의 ‘그들에게 보복을 집행하실 것’
    rationale: 영어 POB의 ‘execute their vengeance’ 및 문맥상 하나님이 그들을 위해 원수를 갚으신다는 의미입니다. 현 번역은 하나님이 그들을 처벌하신다는 뜻으로 읽힐 수 있습니다.
  - severity: medium
    issue: 8절의 ‘그들로 말미암아 말씀하실 일을 완성’
    rationale: 난해한 본문이지만 영어 감사 번역은 ‘그들로부터/그들을 통하여 말씀될 일을 완성’이라는 방향입니다. 현 문구는 주께서 미래에 말씀하실 행위로 의미를 좁힙니다.
  - severity: medium
    issue: 각주 표지가 모두 12절 끝에 몰려 있음
    rationale: a는 7–8절의 본문 난점, b는 3절의 벨리아르, c는 9절의 ‘진실을 행하다’, d는 12절의 ‘씨’에 각각 붙어야 독자가 주석 대상을 식별할 수 있습니다.
  revised_text: 1. 그러므로 여러분은 음행에서 자신을 지키고 마음을 깨끗하게 유지하십시오. 또한 모든 여자에게서 여러분의 감각을 지키십시오. 2. 여자들에게도 마찬가지로 남자들과 가까이 어울리지 말라고 명령하십시오. 그래야 그들도 마음을 깨끗하게 유지할 수 있습니다. 3. 끊임없는 만남은, 비록 그 불경한 행위가 실제로 행해지지 않더라도, 그들에게는 고칠 수 없는 병이 되고, 우리에게는 벨리아르에게서 오는 파멸의 수치와 영원한 치욕이 됩니다.[b] 4. 음행에는 분별도 하나님을 향한 경건도 없으며, 온갖 시기는 그 욕망 안에 깃듭니다. 5. 그러므로 내가 여러분에게 말합니다. 여러분은 레위의 아들들을 시기하게 될 것이며, 그들보다 높아지려고 할 것입니다. 그러나 이 일 때문에 여러분은 이기지 못할 것입니다. 6. 하나님께서는 그들을 위해 보복하실 것이며, 여러분은 악한 죽음을 맞게 될 것입니다. 7. 하나님께서는 레위에게 제사직을 주셨고, 유다에게는 그와 함께 왕권을 주셨습니다. 8. 이 둘을 거슬러 자신을 높이지 마십시오. 주께서 그들을 통하여 말씀될 일을 이루실 것입니다.[a] 9. 나는 하늘의 하나님을 두고 여러분에게 맹세시킵니다. 여러분 각 사람은 자기 이웃에게 진실하게 행하고,[c] 각 사람은 자기 형제에게 사랑을 가지십시오. 10. 또 겸손한 마음으로 레위에게 가까이 가십시오. 그러면 그의 입에서 복을 받게 될 것입니다. 11. 그는 이스라엘과 유다를 축복할 것입니다. 주께서 그 안에서 모든 백성 앞에 왕으로 다스리시기로 택하셨기 때문입니다. 12. 그리고 그의 씨에게 절하십시오.[d] 그 씨가 여러분을 위해 눈에 보이는 전쟁들과 보이지 않는 전쟁들에서 죽을 것이기 때문입니다. 그리고 여러분 가운데에는 영원한 왕이 있을 것입니다.
  revised_footnotes:
  - marker: a
    text: 7–8절은 현존 그리스어 전승에서 본문이 난해합니다. 이 번역은 레위에게 제사직이, 유다에게 왕권이 주어졌으며, 두 계열 어느 쪽에도 맞서지 말라는 개연성 높은 뜻을 반영합니다.
