base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006.yaml
  text: '1. Guard yourselves, therefore, from sexual immorality, and be keeping your mind pure. Guard also your senses from every woman. 2. And command the women likewise not to associate closely with men, so that they too may keep their minds pure. 3. For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a ruinous disgrace of Beliar and an everlasting reproach. 4. For sexual immorality has within itself neither understanding nor reverence for God, and every jealousy dwells in its desire. 5. Therefore I say to you: you will be jealous of the sons of Levi, and you will seek to exalt yourselves above them, but you will not prevail because of this. 6. For God will execute their vengeance, but you will die an evil death. 7. For to Levi God gave the priesthood, and to Judah with him the kingdom. 8. And do not be lifted up against these two, from whom the Lord will bring to completion what is to be spoken. 9. I adjure you
    by the God of heaven, that each of you practice truth toward his neighbor and that each have love toward his brother. 10. And draw near to Levi in humility of heart, so that you may receive a blessing from his mouth. 11. For he will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. And bow down to his seed, because for your sake it will die in visible and invisible wars, and among you there will be an everlasting king.'
  footnotes:
  - marker: a
    text: Verses 7–8 are textually difficult in the present Greek witness. The translation reflects the probable sense that Levi is given priesthood and Judah kingship, with a warning not to oppose either line.
    reason: textual_variant
  - marker: b
    text: '''Beliar'' follows the Greek form of the name here; some readers may know the form ''Belial.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'do truth' toward his neighbor — an idiom for acting with truthfulness and faithfulness, not merely speaking true words.
    reason: lexical_alternative
  - marker: d
    text: '''Bow down to his seed'' can denote homage to a descendant line rather than divine worship.'
    reason: lexical_alternative
translation:
  language: ko
  text: 1. 그러므로 여러분은 음행에서 자신을 지키고, 마음을 깨끗하게 유지하십시오. 또한 모든 여자에게서 여러분의 감각을 지키십시오. 2. 여자들에게도 마찬가지로 남자들과 가까이 어울리지 말라고 명령하십시오. 그래야 그들도 마음을 깨끗하게 유지할 수 있습니다. 3. 끊임없는 만남은, 비록 그 불경한 행위가 실제로 행해지지 않더라도, 그들에게는 고치기 어려운 병이 되고, 우리에게는 벨리아르의 파멸적인 수치와 영원한 치욕이 됩니다. 4. 음행에는 그 안에 이해도 없고 하나님을 향한 경건함도 없습니다. 그리고 모든 질투는 그 욕망 안에 깃듭니다. 5. 그러므로 내가 여러분에게 말합니다. 여러분은 레위의 아들들을 시기하게 될 것이며, 그들보다 높아지려고 할 것입니다. 그러나 이 일로 여러분은 이기지 못할 것입니다. 6. 하나님께서는 그들에게 보복을 집행하실 것이며, 여러분은 악한 죽음을 맞게 될 것입니다. 7. 레위에게는 하나님께서 제사직을 주셨고, 그와 함께 유다에게는 왕권을 주셨습니다. 8. 그러므로 이 둘을 거슬러 높아지지 마십시오. 주께서 그들로 말미암아 말씀하실 일을 완성하실 것입니다. 9. 나는 여러분에게 하늘의 하나님을 두고 맹세합니다. 여러분 각 사람은 자기 이웃에게 진실을 행하고, 각 사람은 자기 형제에게 사랑을 가지십시오. 10. 또 겸손한 마음으로 레위에게 가까이 가십시오. 그러면 그의 입에서 복을 받게 될 것입니다. 11. 그는 이스라엘과 유다를 축복할 것입니다. 주께서 그의 안에서 모든 백성 앞에서 다스리시기로 선택하셨기 때문입니다. 12. 그리고 그의 씨에게 절하십시오. 그 씨가 여러분을 위해 보이는 전쟁과 보이지 않는 전쟁에서 죽을 것이기 때문입니다. 그리고 여러분 가운데에는 영원한 왕이 있을 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  english_pob_choice: Guard yourselves
  chosen_korean: 여러분은 ... 자신을 지키고
  alternatives_korean:
  - 스스로를 지키십시오
  - 경계하십시오
  lexicon: LSJ
  rationale: 강한 권면의 명령형을 살리면서도 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: πορνεία
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 간음
  lexicon: BDAG
  rationale: 이 단락의 정결 권면 맥락에서 더 직접적이고 간결한 대응어라서 선택했습니다.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  english_pob_choice: keep your mind pure
  chosen_korean: 마음을 깨끗하게 유지하십시오
  alternatives_korean:
  - 마음을 깨끗이 하십시오
  - 생각을 정결하게 하십시오
  lexicon: LSJ
  rationale: διάνοια를 ‘마음’으로 자연스럽게 옮기되, 지속적 상태를 나타내는 영어 표현에 맞춰 ‘유지하십시오’를 사용했습니다.
- source_word: αἰσθήσεις
  english_pob_choice: senses
  chosen_korean: 감각
  alternatives_korean:
  - 지각
  - 감각 기관
  lexicon: LSJ
  rationale: 성적 유혹의 통로가 되는 몸의 지각을 가리키므로 추상적인 ‘지각’보다 ‘감각’이 더 적절합니다.
- source_word: συνδιάζειν
  english_pob_choice: associate closely with
  chosen_korean: 가까이 어울리지 말라고
  alternatives_korean:
  - 함께 지내지 말라고
  - 밀접히 교제하지 말라고
  lexicon: LSJ
  rationale: 행동 자체의 성격을 과도하게 확대하지 않으면서도 친밀한 교제를 경계하는 뜻을 살렸습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  lexicon: LSJ
  rationale: 영어 POB의 음역을 따라 본문에서는 그리스어 형태를 반영한 ‘벨리아르’를 유지했습니다.
- source_word: ποιεῖν ἀλήθειαν
  english_pob_choice: practice truth
  chosen_korean: 진실을 행하고
  alternatives_korean:
  - 진리를 행하고
  - 진실하게 행동하고
  lexicon: LSJ
  rationale: 이 관용구는 단순한 말의 정확성보다 실제 삶의 성실한 행위를 뜻하므로 ‘행하다’로 옮겼습니다.
- source_word: προσκυνήσατε
  english_pob_choice: bow down to
  chosen_korean: 절하십시오
  alternatives_korean:
  - 경배하십시오
  - 엎드려 절하십시오
  lexicon: BDAG
  rationale: 문맥상 신적 예배라기보다 왕족 계열에 대한 경의와 복종의 표시이므로 ‘절하다’가 가장 안전합니다.
theological_decisions:
- issue: vv. 7–8의 직분과 왕권 진술
  chosen_reading: 레위에게는 제사직, 유다에게는 왕권이 주어졌다고 분명하게 옮기고, 두 계열을 거슬러 높아지지 말라는 경고를 유지했습니다.
  alternative_readings:
  - 문장을 더 파편적으로 남기는 번역
  - 왕권과 제사직의 배분을 완화하는 번역
  rationale: 그리스어 전승이 난해하지만 남아 있는 단서들이 레위-유다의 이중 위임을 지지하므로, 의미를 과도하게 희석하지 않고 투명하게 번역했습니다.
  doctrine_reference: 전승의 난점을 해소하기보다 본문이 주는 긴장을 보존합니다.
- issue: v. 12의 ‘씨’와 ‘영원한 왕’
  chosen_reading: ‘그의 씨’와 ‘영원한 왕’을 그대로 살려, 후대적 메시아 해석을 본문 자체에 미리 주입하지 않았습니다.
  alternative_readings:
  - ‘씨’를 ‘후손’으로 풀어쓰기
  - ‘영원한 왕’을 곧바로 메시아로 명시하기
  rationale: 본문은 레위와 유다의 계보, 그리고 왕적 기대를 함께 두고 있으므로 해석을 단정하기보다 전승의 여지를 남기는 것이 더 충실합니다.
  doctrine_reference: 전승의 신학적 긴장을 보존합니다.
