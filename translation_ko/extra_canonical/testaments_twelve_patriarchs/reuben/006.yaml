  text: Φυλάξατε¹ οὖν² ἀπὸ τῆς³ πορνείας, καὶ * ἔστε καθαρεύοντες⁴ τῇ διανοίᾳ. * φυλάξατε καὶ⁵ * τὰς αἰσθήσεις ὑμῶν⁶ ἀπὸ πάσης γυναικῶν⁷. 2. Κἀκείνας⁸ δὲ⁹ ἐντέλλεσθε¹⁰ μὴ συνδιάζειν¹¹ τοῖς ἀνδράσιν¹², ἵνα καὶ αὐταὶ καθαρεύωσι¹³ τῇ διανοίᾳ¹⁴. 3. * Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰. 4. Ὅτι ἣ²¹ πορνεία * οὔτε σύνεσιν οὔτε22 †εὐσέβειαν23 ἔχει ἐν ἑαυτῇ· καὶ24 πᾶς25 ζῆλος κατοικεῖ26 ἐν τῇ ἐπιθυμίᾳ αὐτῆς27. 5. Διὰ τοῦτο Γοὖν λέγω ὑμῖν128 ζηλώσετε29 Γτοὺς υἱοὺς β-d,A,S¹ τοῦ30 Λευὶ1 καὶ ζητήσετε31 ὑψωθῆναι ὑπὲρ αὐτούς32, ἀλλ᾿33 διὰ τοῦτο. οὐ ἰσχύσετε34. 6. Ὁ γὰρ Θεὸς35 ποιήσει36 τὴν ἐκδίκησιν37 β δυνή- αὐτῶν Γ*ὑμεῖς δὲ ἀποθανεῖτε38 θανάτῳ πονηρῷ1. 7. Τῷ γὰρ39 σεσθε. Λευ c λαλεῖν. 9. Ὁρκῶ ὑμᾶς τὸν Θεὸν τοῦ οὐρανοῦ⁶⁰ τοῦ⁶¹ ποιεῖν⁶² ἀλήθειαν * ἕκαστος πρὸς τὸν πλησίον αὐτοῦ⁶³ * καὶ ἀγάπην ἔχειν ἕκαστος πρὸς τὸν ἀδελφὸν αὐτοῦ⁶⁴. 10. Καὶ πρὸς τὸν⁶⁵ Λευὶ ἐγγίσατε⁶⁶ ἐν ταπεινώσει καρδίας
    Γὑμῶν⌉⁶⁷, ἵνα * δέξησθε εὐλογίαν⁶⁸ ἐκ τοῦ⁶⁹ στόματος αὐτοῦ. 11. Αὐτὸς γὰρ⁷⁰ εὐλογήσει τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν· * ὅτι ἐν αὐτῷ⁷¹ ἐξελέξατο Κύριος⁷² βασιλεύειν⁷³ ἐνώπιον⁷⁴ * παντὸς τοῦ λαοῦ⁷⁵. 12. Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
