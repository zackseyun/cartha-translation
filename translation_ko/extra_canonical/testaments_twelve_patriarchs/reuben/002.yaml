revisions:
- from: '그리고 이제, 내 자녀들아, 내가 회개 중에 본 것, 곧 속임의 일곱 영들에 관하여 내 말을 들으십시오. 그러므로 사람을 대적하도록 주어진 일곱 영이 있었으니, 그것들이 바로 젊음의 일들에 대한 머리들입니다.


    또 다른 일곱 영이 창조 때 그에게 주어졌으니, 사람의 모든 일이 그것들 안에 있게 하려는 것이었습니다. 첫째는 생명의 영으로, 이것으로 사람의 구성체가 빚어집니다. 둘째는 보는 영으로, 이것으로 욕망이 생깁니다. 셋째는 듣는 영으로, 이것으로 가르침이 생깁니다. 넷째는 냄새의 영으로, 이것으로 공기와 숨을 들이마시기 위한 맛들이 주어집니다. 다섯째는 말의 영으로, 이것으로 지식이 생깁니다. 여섯째는 맛의 영으로, 이것으로 음식과 음료를 먹는 일이 생기며, 그 안에서 힘이 형성됩니다. 왜냐하면 음식들 안에 힘의 바탕이 있기 때문입니다. 일곱째는 씨 뿌림과 성교의 영으로, 이것으로 쾌락을 사랑함으로 죄들이 함께 모입니다. 그러므로 이 영은 창조에서는 마지막이고 젊음에서는 첫째입니다. 왜냐하면 그것은 무지로 가득 차 있으며, 젊은 사람을 마치 눈먼 사람처럼 구덩이로, 또 마치 짐승처럼 절벽으로 이끌기 때문입니다.[a][b][c]'
