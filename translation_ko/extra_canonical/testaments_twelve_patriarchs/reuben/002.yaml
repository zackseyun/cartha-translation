base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002.yaml
  text: 'And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance. There were given, then, seven spirits set against man, and these are the heads of the works of youthfulness[b].


    And seven other spirits were given to him at creation, so that every work of man might be in them. The first is the spirit of life, by which a person’s constitution is formed. The second is the spirit of sight, by which desire comes to be. The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are produced for the drawing in of air and breath[c]. The fifth is the spirit of speech, by which knowledge comes to be. The sixth is the spirit of taste, by which the eating of foods and drinks comes to be, and strength is formed by it, because in foods is the basis of strength. The seventh is the spirit of procreation and intercourse, by which sins come together through the love of pleasure. Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the young man like a blind man into a pit, and like an animal over a cliff.'
  footnotes:
  - marker: a
    text: Or 'spirits of error' or 'spirits of delusion.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the heads of the works of youthfulness' is literal in structure; it likely means the chief sources or governing beginnings of youthful sins.
    reason: lexical_alternative
  - marker: c
    text: The wording about smell, tastes, and the drawing in of air is difficult in Greek and may reflect a compressed or unstable textual formulation.
    reason: textual_variant
translation:
  language: ko
  text: '그리고 이제, 내 자녀들아, 내가 회개할 때 속임의 일곱 영에 관하여 본 것을 들으십시오.[a] 그러므로 사람을 대적하여 일곱 영이 주어졌으니, 이것들이 젊음의 행위들의 우두머리들입니다.[b]


    또 창조 때에 그에게 다른 일곱 영이 주어졌으니, 모든 인간의 행위가 그것들 안에 있도록 하려는 것이었습니다. 첫째는 생명의 영으로, 이것으로 사람의 짜임이 이루어집니다. 둘째는 시각의 영으로, 이것으로 욕망이 생깁니다. 셋째는 청각의 영으로, 이것으로 가르침이 생깁니다. 넷째는 후각의 영으로, 이것으로 공기와 숨을 들이마시기 위한 맛들이 생깁니다.[c] 다섯째는 말의 영으로, 이것으로 지식이 생깁니다. 여섯째는 미각의 영으로, 이것으로 음식과 음료를 섭취하는 일이 생기며, 그것으로 힘이 형성됩니다. 음식들 안에 힘의 바탕이 있기 때문입니다. 일곱째는 생식과 성교의 영으로, 이것으로 쾌락을 사랑함을 통해 죄들이 함께 모입니다. 그러므로 이 영은 창조에서는 마지막이고 젊음에서는 첫째입니다. 그것이 무지로 가득 차 있으며, 젊은이를 마치 눈먼 사람을 구덩이로 이끌듯, 또 짐승을 절벽으로 이끌듯 이끌기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘오류의 영들’, ‘미혹의 영들’. 헬라어 πλάνη는 오류, 방황, 기만을 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘젊음의 행위들의 우두머리들’은 구조를 살린 번역입니다. 문맥상 젊은 시절의 죄된 행위를 낳거나 지배하는 주요 근원을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 후각, ‘맛들’, 공기와 숨을 들이마심의 관계를 말하는 이 문구는 헬라어가 압축되어 있고 의미가 어렵습니다. 번역은 본문의 표현을 가능한 한 가깝게 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: πνευμάτων τῆς πλάνης
  english_pob_choice: spirits of deceit
  chosen_korean: 속임의 영들
  alternatives_korean:
  - 오류의 영들
  - 미혹의 영들
  lexicon: LSJ
  rationale: πλάνη는 오류·방황·기만의 의미권을 가지며, 이 문맥에서는 사람을 잘못 이끄는 능동적 뉘앙스가 강하므로 '속임'이 가장 직접적입니다.
- source_word: ἐν τῇ μετανοίᾳ μου
  english_pob_choice: in my repentance
  chosen_korean: 회개 중에
  alternatives_korean:
  - 내 회개 안에서
  - 내가 회개할 때
  lexicon: BDAG
  rationale: 고백적 서술의 분위기를 살리되, 한국어로는 상태나 시점을 자연스럽게 드러내는 '회개 중에'가 가장 읽기 쉽습니다.
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  english_pob_choice: the heads of the works of youthfulness
  chosen_korean: 젊음의 일들에 대한 머리들
  alternatives_korean:
  - 젊은 시절의 일들의 우두머리들
  - 젊음의 일들의 근원들
  lexicon: LSJ
  rationale: κεφαλαί의 비유를 살리기 위해 '머리들'을 유지했고, νεωτερισμός은 여기서 단순한 새로움이 아니라 젊은 충동의 영역을 가리키므로 '젊음'으로 옮겼습니다.
- source_word: ὑπόστασις τῆς ἰσχύος
  english_pob_choice: the basis of strength
  chosen_korean: 힘의 바탕
  alternatives_korean:
  - 힘의 실체
  - 힘의 기초
  lexicon: LSJ
  rationale: 이 문맥의 ὑπόστασις는 교리적 '위격/실체'가 아니라 힘을 떠받치는 밑받침을 뜻하므로, 후대 신학 용어를 피한 '바탕'이 가장 적절합니다.
theological_decisions:
- issue: ὑπόστασις를 교리적 '실체'로 읽을지, 일상적 기반으로 읽을지
  chosen_reading: 힘의 바탕
  alternative_readings:
  - 힘의 실체
  - 힘의 기초
  rationale: 본 절은 성육신이나 삼위일체 논의가 아니라 감각과 욕망의 질서를 설명하는 훈계 문맥이므로, 후대 신학적 전문용어를 끌어오지 않는 번역이 원문 의도에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: 비신학적 문맥의 ὑπόστασις 처리 원칙'
