review_pass:
  verdict: revise
  source_fidelity: 전반적 구조와 일곱 영의 열거는 원문을 잘 따르지만, 몇몇 표현이 헬라어의 관계와 의미를 부정확하거나 지나치게 직역적으로 옮겼습니다. 특히 κατὰ τοῦ ἀνθρώπου는 ‘사람을 대적하여’, ἐν αὐτῷ는 문맥상 여섯째 영을 매개로 한 힘의 형성으로, βρωμάτων τε καὶ πομάτων은 ‘음식과 음료를 섭취함’으로 옮기는 편이 충실합니다. 난해한 넷째 항목은 원문의 불안정성과 압축성을 번역과 주석에서 유지해야 합니다.
  naturalness: 초안의 ‘회개 중에 본 것’, ‘젊음의 일들에 대한 머리들’, ‘사람의 구성체’, ‘냄새의 영’, ‘맛들이 주어집니다’는 현대 표준 한국어 합쇼체에서 다소 부자연스럽거나 의미가 흐립니다. ‘회개할 때 본 것’, ‘젊음의 행위들의 우두머리들’, ‘사람의 짜임’, ‘후각의 영’ 등으로 다듬되, 난해한 본문을 과도하게 해석하지 않았습니다.
  terminology: πλάνη는 이 훈계 문맥에서 ‘미혹’이 자연스럽고 원문의 오류·기만·잘못 이끎의 범위를 보존합니다. νεωτερισμός의 비유적 ‘머리들’은 ‘우두머리들’로 옮기고 주석으로 문자적 비유와 가능한 뜻을 밝혔습니다. ὑπόστασις는 비신학적 문맥에 맞게 ‘바탕’으로 유지했습니다. σπορά는 여기서 생식의 뜻이므로 ‘생식과 성교’가 현대적이며 정확합니다.
  issues:
  - severity: medium
    issue: 각주 표지 [a][b][c]가 본문 끝에 한꺼번에 놓여 있습니다.
    rationale: 각주가 가리키는 어구 바로 뒤에 표지를 두어야 독자가 πλάνη, κεφαλαί, 난해한 후각 관련 구절을 각각 확인할 수 있습니다.
  - severity: medium
    issue: ‘그러므로 사람을 대적하도록 주어진 일곱 영이 있었으니’는 ἐδόθη와 κατὰ τοῦ ἀνθρώπου를 충분히 반영하지 못합니다.
    rationale: 수동 동사 ‘주어졌습니다’와 적대 관계 ‘사람을 대적하여’를 명시하는 것이 원문에 가깝습니다.
  - severity: medium
    issue: ‘음식과 음료를 먹는 일’은 πομάτων을 포괄하지 못합니다.
    rationale: 음료는 먹는 것이 아니라 마시는 것이므로 ‘음식과 음료를 섭취하는 일’이 정확합니다.
  - severity: low
    issue: 감각 목록의 ‘보는 영’과 ‘냄새의 영’이 다소 구어적이고 불균형합니다.
