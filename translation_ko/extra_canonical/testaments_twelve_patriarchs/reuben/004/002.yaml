  text: For until my father's death I did not have the boldness to look my father in the face.
translation:
  language: ko
  text: 내 아버지께서 돌아가실 때까지는, 나는 내 아버지의 얼굴을 똑바로 쳐다볼 담대함이 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι τελευτῆς τοῦ πατρός μου
  english_pob_choice: until my father's death
  chosen_korean: 내 아버지께서 돌아가실 때까지
  alternatives_korean:
  - 내 아버지가 죽을 때까지
  - 아버지의 죽음까지
  lexicon: ἄχρι + τελευτή
  rationale: 시간의 종결점을 자연스럽게 살리면서도, 죽음의 의미를 직접적이되 정중한 표현으로 옮겼습니다.
- source_word: παρρησίαν
  english_pob_choice: the boldness
  chosen_korean: 담대함
  alternatives_korean:
  - 대담함
  - 자유롭게 감히 하는 마음
  lexicon: παρρησία
  rationale: 공개적·자유로운 발언의 뉘앙스가 있지만, 여기서는 ‘얼굴을 똑바로 쳐다볼’ 행위에 필요한 용기라는 문맥을 따라 ‘담대함’이 가장 자연스럽습니다.
- source_word: ἀτενίσαι εἰς
  english_pob_choice: to look ... in the face
  chosen_korean: 얼굴을 똑바로 쳐다볼
  alternatives_korean:
  - 얼굴을 바라볼
  - 정면으로 쳐다볼
  lexicon: ἀτενίζω + εἰς
  rationale: 단순한 ‘보다’보다, 직접 마주 보며 응시하는 동작을 분명히 드러내기 위해 ‘똑바로 쳐다볼’로 옮겼습니다.
theological_decisions:
- issue: The verse is a first-person confession of filial reverence, not a doctrinal statement.
  chosen_reading: 서술을 그대로 따라, 도덕적 긴장과 수치/존중의 감각을 보존했습니다.
  alternative_readings:
  - 아버지를 뵐 수 없었습니다
  - 아버지 앞에 설 용기가 없었습니다
  rationale: 원문은 단지 ‘볼 수 없음’이 아니라 아버지의 얼굴을 마주할 담대함이 없었던 내적 상태를 말하므로, 그 긴장을 약화하지 않도록 했습니다.
  doctrine_reference: source-oriented narrative sense
