revisions:
- from: 그러므로 여러분은 요셉이 어떻게 한 여자에게서 자신을 지켰는지, 또 모든 음행에서 자신의 생각을 깨끗하게 했는지, 그리고 하나님과 사람들 앞에서 호의를 얻었는지를 들었습니다.
  to: 여러분은 요셉이 어떻게 한 여자에게서 자신을 지키고, 모든 음행으로부터 자기 생각을 깨끗하게 하였으며, 하나님과 사람들 앞에서 호의를 얻었는지를 들었기 때문입니다.
  rationale: The revision corrects the reversed logical force of γάρ and explicitly renders ἀπό as '으로부터.' It retains the source's indefinite 'a woman,' the inward focus of ἐννοίας ('thoughts'), the comprehensive force of πάσης ('all'), and the relational sense of χάρις ('favor').
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:05Z'
review_pass:
  verdict: revise
  source_fidelity: γάρ is causal ('for/because'), not inferential ('therefore'); the draft reverses the logical relation. The cleansing is also explicitly 'from all sexual immorality,' which Korean should mark with 에게서/으로부터 rather than 에서. The remaining elements accurately represent Joseph's self-guarding, his thoughts, and favor before God and people.
  naturalness: The draft is generally clear and appropriately formal, but '모든 음행에서 ... 깨끗하게 했다' is less idiomatic and can suggest the setting in which cleansing occurred. '모든 음행으로부터 ... 깨끗하게 하였으며' is clearer. A verse-final causal formulation naturally preserves γάρ in Korean when the preceding context is not reproduced.
  terminology: '''음행'' is a suitable formal rendering of πορνεία in this ethical context. ''호의'' appropriately renders χάρις here, since it is found before both God and people and does not require a technical-theological sense of ''grace.'''
  issues:
  - severity: high
    issue: γάρ is rendered as '그러므로.'
    rationale: γάρ introduces a reason or explanation ('for/because'), whereas '그러므로' marks a conclusion and reverses the source's logical connection.
  - severity: medium
    issue: '''모든 음행에서'' does not clearly express ἀπό (''from'').'
    rationale: The Greek states that Joseph cleansed his thoughts away from all sexual immorality. '모든 음행으로부터' preserves this relation more precisely.
  revised_text: 여러분은 요셉이 어떻게 한 여자에게서 자신을 지키고, 모든 음행으로부터 자기 생각을 깨끗하게 하였으며, 하나님과 사람들 앞에서 호의를 얻었는지를 들었기 때문입니다.
  revised_footnotes: []
  revision_rationale: The revision corrects the reversed logical force of γάρ and explicitly renders ἀπό as '으로부터.' It retains the source's indefinite 'a woman,' the inward focus of ἐννοίας ('thoughts'), the comprehensive force of πάσης ('all'), and the relational sense of χάρις ('favor').
