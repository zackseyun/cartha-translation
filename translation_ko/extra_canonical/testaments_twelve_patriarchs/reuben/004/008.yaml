id: T12P.REU.4.8
reference: Testament of Reuben 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Ἠκούσατε γὰρ περὶ Ἰωσὴφ πῶς ἐφύλαξεν ἑαυ- τὸν ἀπὸ⁶² γυναικός, καὶ τὰς ἐννοίας ἐκαθάρισεν⁶³ ἀπὸ πάσης⁶⁴ πορνείας, Γκαὶ⁶⁵ εὗρεν χάριν ἐνώπιον θεοῦ⁶⁶ καὶ ἀνθρώ- πων.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/008.yaml
  text: For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from all sexual immorality, and found favor before God and men.
translation:
  language: ko
  text: 여러분은 요셉이 어떻게 한 여자에게서 자신을 지키고, 모든 음행으로부터 자기 생각을 깨끗하게 하였으며, 하나님과 사람들 앞에서 호의를 얻었는지를 들었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε γὰρ
  english_pob_choice: For you have heard
  chosen_korean: 그러므로 여러분은 … 들었습니다
  alternatives_korean:
  - 여러분은 … 들으셨습니다
  - 왜냐하면 여러분은 … 들었습니다
  lexicon: ἀκούω
  rationale: 문두 γὰρ의 논리 연결을 살리되, 본문 전체의 권면 흐름에 맞게 ‘그러므로’로 자연스럽게 이어 주었습니다.
- source_word: γυναικός
  english_pob_choice: from a woman
  chosen_korean: 한 여자에게서
  alternatives_korean:
  - 여자에게서
  - 여인에게서
  lexicon: γυνή
  rationale: 본문은 특정 유혹의 대상을 일반적으로 가리키므로, 과장 없이 ‘한 여자’로 옮겼습니다.
- source_word: τὰς ἐννοίας ἐκαθάρισεν ἀπὸ πάσης πορνείας
  english_pob_choice: cleansed his thoughts from all sexual immorality
  chosen_korean: 모든 음행에서 자신의 생각을 깨끗하게 했는지
  alternatives_korean:
  - 모든 음행에서 그의 생각을 정결하게 했는지
  - 모든 음란함에서 그의 마음을 깨끗하게 했는지
  lexicon: ἐννοία / καθαρίζω / πορνεία
  rationale: ἐννοίας를 ‘생각’으로, ἐκαθάρισεν을 ‘깨끗하게 했다’로, πορνεία를 ‘음행’으로 직역해 POB의 의미를 유지했습니다.
- source_word: εὗρεν χάριν ἐνώπιον θεοῦ καὶ ἀνθρώπων
  english_pob_choice: found favor before God and men
  chosen_korean: 하나님과 사람들 앞에서 호의를 얻었는지
  alternatives_korean:
  - 하나님과 사람들 앞에서 은혜를 얻었는지
  - 하나님과 사람들 앞에서 호의를 얻었습니다
  lexicon: χάρις / ἐνώπιον
  rationale: χάριν은 여기서 관계적 ‘호의’를 뜻하므로 ‘은혜’보다 문맥상 자연스러운 ‘호의’를 택했고, ἐνώπιον은 ‘앞에서’로 살렸습니다.
theological_decisions:
- issue: Joseph의 윤리적 모범을 직접적 권면 근거로 제시하는 방식
  chosen_reading: 요셉의 절제와 정결을 신앙적 모범으로 분명히 드러내되, 본문이 말하는 범위를 넘어 도덕적 일반론을 덧붙이지 않았습니다.
  alternative_readings:
  - 요셉이 성적 유혹을 이겼다고 완곡하게 풀어 쓰는 방식
  - ‘생각’을 ‘마음’으로 바꾸어 내면성 강조를 약화시키는 방식
  rationale: 이 구절은 요셉의 외적 행동과 내적 정결을 함께 제시하므로, 둘 다 선명하게 보이도록 옮기는 것이 본문 의도에 부합합니다.
  doctrine_reference: 성화와 절제의 모범 본문
- issue: χάρις의 번역
  chosen_reading: 여기서는 은혜보다 ‘호의’가 더 직접적인 대응이라고 보았습니다.
  alternative_readings:
  - 은혜
  - 총애
  rationale: 하나님과 사람들 모두에게 적용되는 표현이므로, 신학적 용어 ‘은혜’보다 관계적 호의가 문맥상 더 정확합니다.
  doctrine_reference: 관계적 호의/호감의 어휘 구분
