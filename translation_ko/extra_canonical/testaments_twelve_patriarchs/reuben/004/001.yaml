  source_fidelity: 핵심 권고와 병렬 구조는 대체로 충실합니다. 다만 ἣν αὐτὸς θέλει는 문자상 ‘그분이 친히 원하시는’ 아내이며, ‘친히 택하신’은 원문의 동사 θέλει(원하다/뜻하다)를 ‘선택하다’로 좁힙니다. 또한 마지막 ἵνα 절은 목적을 나타내는데, 초안의 ‘그러면 … 않아도 됩니다’는 허용 또는 단순 결과처럼 들립니다.
  naturalness: 합쇼체 문장으로 자연스럽지만, ‘양 떼 가운데서 수고하면서’와 뒤의 ‘그렇게 하십시오’는 한국어에서 수식 관계와 지시 대상이 다소 불분명합니다. 명령의 병렬을 분명히 하고 목적절을 자연스럽게 정리할 수 있습니다.
  terminology: ‘여인들’, ‘마음의 단순함’, ‘선한 일’, ‘배움’, ‘양 떼’, ‘아내’는 문맥과 원문에 적절합니다. ‘주님을 두려워하며’는 φόβῳ κυρίου의 두려움과 경외의 긴장을 보존합니다.
  issues:
  - severity: medium
    issue: ‘주께서 친히 택하신 아내’
    rationale: 원문의 αὐτὸς θέλει는 ‘그 자신이 원하다/뜻하다’이지 직접적으로 ‘택하다’가 아닙니다. 신적 선택이라는 해석을 단정하지 않도록 ‘주님께서 친히 원하시는 아내’로 옮기는 편이 더 충실합니다.
  - severity: medium
    issue: 마지막 목적절의 의미와 종결 표현
    rationale: ἵνα μὴ πάθητε는 ‘여러분이 … 겪지 않도록’이라는 목적입니다. ‘그러면 … 않아도 됩니다’는 목적의 뉘앙스를 약화하고 가능·허용처럼 들립니다.
  - severity: low
    issue: 무정의 각주 표지 [a][b]
    rationale: 본문에 각주 표지만 있고 대응 각주가 제공되지 않았습니다. 본 절의 번역에 필수적인 주석도 아니므로 표지를 삭제해 독해상 혼선을 없앱니다.
