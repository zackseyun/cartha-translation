  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Μὴ οὖν προσέχετε, Γτέκνα μου1, κάλλος2 γυναικῶν3, μηδὲ ἐννοεῖσθε4 τὰς πράξεις αὐτῶν· ἀλλὰ πορεύεσθε ἐν5 ἁπλότητι καρδίας, ἐν φόβῳ κυρίου6, καὶ μοχθοῦντες7 ἐν ἔργοις *καλοῖς, καὶ8 *ἐν γράμμασι, καὶ ἐν τοῖς ποιμνίοις9 ὑμῶν, ἕως οὗ10 *ὁ κύριος δώῃ ὑμῖν11 *σύζυγον, ἣν αὐτὸς θέλει12, ἵνα μὴ πάθητε13, ὡς κἀγώ14.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/001.yaml
  text: Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 여인의 아름다움에 주의를 기울이지 말고, 그들의 행위에 마음을 두지도 마십시오. 오히려 마음의 단순함 속에서, 주를 두려워하며, 선한 일과 배움과 여러분의 양 떼 가운데서 수고하면서, 주께서 친히 택하신 아내를 여러분에게 주실 때까지 그렇게 하십시오. 그러면 여러분은 내가 겪은 것처럼 고난을 겪지 않아도 됩니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν προσέχετε
  english_pob_choice: do not pay attention to
  chosen_korean: 주의를 기울이지 말고
  alternatives_korean:
  - 귀를 기울이지 말고
  - 신경 쓰지 말고
  lexicon: προσέχω
  rationale: 단순한 관심 금지보다 지속적으로 마음을 두는 뜻을 살려, 자연스러운 표준어로 ‘주의를 기울이다’로 옮겼습니다.
- source_word: κάλλος γυναικῶν
  english_pob_choice: the beauty of women
  chosen_korean: 여인의 아름다움
  alternatives_korean:
  - 여자들의 아름다움
  - 여성의 아름다움
  lexicon: κάλλος
  rationale: 원문의 일반적 복수 의미를 보존하면서, 문맥상 유혹의 대상이 되는 여성을 드러내기 위해 ‘여인’으로 옮겼습니다.
- source_word: ἐν ἁπλότητι καρδίας
  english_pob_choice: in simplicity of heart
  chosen_korean: 마음의 단순함 속에서
  alternatives_korean:
  - 마음의 순전함 속에서
  - 진실한 마음으로
  lexicon: ἁπλότης
  rationale: ἁπλότης의 핵심인 분열되지 않은 내적 단순성을 살리기 위해 ‘단순함’으로 직역에 가깝게 옮겼습니다.
- source_word: ἐν φόβῳ κυρίου
  english_pob_choice: in the fear of the Lord
  chosen_korean: 주를 두려워하며
  alternatives_korean:
  - 주를 경외하며
  - 주님을 두려워하며
  lexicon: φόβος + κύριος
  rationale: ‘주에 대한 두려움’의 태도를 동사형으로 풀어 한국어 문장 흐름을 살리되, 경외와 두려움의 긴장을 유지했습니다.
- source_word: ἐν ἔργοις καλοῖς, καὶ ἐν γράμμασι
  english_pob_choice: in good works, and in learning
  chosen_korean: 선한 일과 배움
  alternatives_korean:
  - 좋은 일과 학문
  - 선한 행실과 배움
  lexicon: ἔργα καλά / γράμματα
  rationale: γράμμασι를 단순한 ‘글자들’이 아니라 교육·학습의 의미로 이해해, POB의 ‘learning’을 반영하여 ‘배움’으로 옮겼습니다.
- source_word: ἕως οὗ ὁ κύριος δώῃ ὑμῖν σύζυγον
  english_pob_choice: until the Lord gives you a wife
  chosen_korean: 주께서 … 아내를 여러분에게 주실 때까지
  alternatives_korean:
  - 주께서 … 배우자를 여러분에게 주실 때까지
  - 주께서 … 짝을 여러분에게 주실 때까지
  lexicon: σύζυγος
  rationale: σύζυγον은 문자적으로는 ‘짝/배우자’이지만, 영어 POB의 선택을 따라 혼인 맥락에서 자연스러운 ‘아내’로 구체화했습니다.
theological_decisions:
- issue: 혼인 상대의 선택 주체
  chosen_reading: 아내는 주께서 친히 택하신 분으로 묘사하여, 결혼을 하나님의 선택과 섭리 아래 두었습니다.
  alternative_readings:
  - 단순히 ‘주께서 주시는 아내’로만 옮겨 선택의 강조를 약화하는 해석
  - ‘배우자’로 중립화하여 남성 화자의 맥락을 흐리는 해석
  rationale: 원문 αὐτὸς θέλει와 영어 POB의 ‘whom he himself chooses’가 선택의 주체를 분명히 하므로, 그 신학적 강조를 보존했습니다.
  doctrine_reference: 섭리와 결혼 윤리
- issue: γυναικῶν의 윤리적 긴장
  chosen_reading: 여인의 아름다움에 주의를 두지 말라는 권고를 직접적으로 유지했습니다.
  alternative_readings:
  - ‘이성의 매력’처럼 완화하는 번역
  - 문화적 이유로 생략하는 번역
  rationale: 원문은 성적 유혹에 대한 경계라는 긴장을 분명히 드러내므로, 이를 완화하지 않고 직설적으로 보존했습니다.
  doctrine_reference: 성윤리와 절제
