id: T12P.REU.4.3
reference: Testament of Reuben 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: καὶ ἕως νῦν ἡ συνείδησίς μου τύπτει με περὶ τῆς ἁμαρτίας μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/003.yaml
  text: And even now my conscience strikes me concerning my sin.
translation:
  language: ko
  text: 그리고 지금까지도 내 죄를 두고 내 양심이 나를 치고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ συνείδησίς μου
  english_pob_choice: my conscience
  chosen_korean: 내 양심
  alternatives_korean:
  - 내 conscience
  - 내 의식
  - 내 마음
  lexicon: συνείδησις
  rationale: συνείδησις는 도덕적 자기판단의 내적 인식을 가리키므로, 한국어에서는 통상적이고 이해 가능한 ‘양심’이 가장 직접적입니다.
- source_word: τύπτει
  english_pob_choice: strikes me
  chosen_korean: 나를 치고 있습니다
  alternatives_korean:
  - 나를 때리고 있습니다
  - 나를 괴롭히고 있습니다
  - 나를 찌르고 있습니다
  lexicon: τύπτω
  rationale: 영어 POB의 수정처럼 τύπτει는 ‘괴롭히다’보다 ‘치다/때리다’의 물리적 이미지가 살아 있으므로, ‘나를 치고 있습니다’로 옮겨 현재적 지속성을 살렸습니다.
- source_word: περὶ τῆς ἁμαρτίας μου
  english_pob_choice: concerning my sin
  chosen_korean: 내 죄 때문에
  alternatives_korean:
  - 내 죄에 관하여
  - 내 죄를 두고
  - 내 죄와 관련하여
  lexicon: περὶ + ἁμαρτία
  rationale: περὶ는 단순한 주제 표지보다 원인·관련성을 포함할 수 있어, 문맥상 양심의 찔림 원인을 드러내는 ‘때문에’가 가장 자연스럽고 source-adequate합니다.
- source_word: καὶ ἕως νῦν
  english_pob_choice: And even now
  chosen_korean: 그리고 지금에 이르기까지도
  alternatives_korean:
  - 그리고 지금까지도
  - 그리고 이 순간까지도
  - 그리고 여전히
  lexicon: καὶ ἕως νῦν
  rationale: καὶ ἕως νῦν의 누적·지속 뉘앙스를 살리기 위해 ‘지금에 이르기까지도’로 옮겨, 단순한 현재 상태보다 오래 지속된 현재성을 드러냈습니다.
theological_decisions:
- issue: 양심의 주체성과 죄책의 지속성
  chosen_reading: 본문은 죄가 과거 사건으로 끝나지 않고, 현재까지도 양심을 계속하여 책망하는 상태를 말한다고 읽었습니다.
  alternative_readings:
  - 단순한 후회의 감정으로 축소하는 읽기
  - 일시적 양심의 가책으로 약화하는 읽기
  rationale: τύπτει의 현재형과 ἕως νῦν의 결합은 지속 중인 내적 고발을 강조하므로, 죄의 무게가 지금도 작동한다는 점을 보존했습니다.
  doctrine_reference: 회개와 죄책의 지속성에 대한 성경적 증언
