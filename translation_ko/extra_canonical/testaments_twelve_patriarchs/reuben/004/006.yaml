id: T12P.REU.4.6
reference: Testament of Reuben 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Βόθρος γάρ ἐστι ψυχῆς ἡ ἁμαρτία τῆς πορνείας⁵², χωρίζουσα ἀπὸ⁵³ θεοῦ καὶ προσεγγίζουσα *τοῖς εἰδώλοις⁵⁴, ὅτι αὕτη *ἐστὶν ἡ⁵⁵ πλανῶσα τὸν νοῦν *καὶ τὴν διάνοιαν⁵⁶, καὶ κατάγει⁵⁷ νεανί- σκους εἰς ᾅδην, οὐκ ἐν καιρῷ αὐτῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/006.yaml
  text: For the sin of sexual immorality is a pit for the soul, separating it from God and drawing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.
translation:
  language: ko
  text: 음행의 죄는 영혼을 파놓은 구덩이입니다. 그것은 하나님에게서 사람을 떼어 놓고 우상들에 가까이 이끕니다. 왜냐하면 그것이 바로 마음과 분별을 그릇되게 하며, 젊은이들을 제때가 이르기 전에 하데스로 끌어내리기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βόθρος ... ἡ ἁμαρτία τῆς πορνείας
  english_pob_choice: the sin of sexual immorality is a pit for the soul
  chosen_korean: 음행의 죄는 영혼을 파놓은 구덩이입니다
  alternatives_korean:
  - 성적 부도덕의 죄는 영혼의 함정입니다
  - 음행의 죄는 영혼의 함정입니다
  lexicon: βόθρος, ἁμαρτία, πορνεία
  rationale: βόθρος의 물리적 이미지인 ‘구덩이’를 살려, 단순 비유인 ‘함정’보다 원문의 위험성과 추락감을 더 직접적으로 반영했습니다. πορνεία는 이 문맥에서 ‘음행’이 가장 자연스럽고, POB의 성적 부도덕보다 더 소스-근접합니다.
- source_word: χωρίζουσα ἀπὸ θεοῦ
  english_pob_choice: separating it from God
  chosen_korean: 하나님에게서 사람을 떼어 놓고
  alternatives_korean:
  - 하나님에게서 분리하고
  - 하나님으로부터 갈라놓고
  lexicon: χωρίζω
  rationale: 현재분사의 지속적 작용을 살려 ‘떼어 놓고’로 옮겼습니다. 주어가 ‘죄’이므로 한국어에서는 목적어를 보충해 ‘사람을’로 자연화했습니다.
- source_word: προσεγγίζουσα τοῖς εἰδώλοις
  english_pob_choice: drawing it near to idols
  chosen_korean: 우상들에 가까이 이끕니다
  alternatives_korean:
  - 우상들에 가까이 끌어당깁니다
  - 우상들에게 다가가게 합니다
  lexicon: προσεγγίζω, εἴδωλον
  rationale: 개정된 영어 POB의 ‘drawing it near’에 맞추어 능동적 유인성을 살렸습니다. ‘우상들’은 복수형을 반영하고, ‘가까이 이끕니다’는 한국어에서 가장 자연스럽게 그 방향성을 드러냅니다.
- source_word: πλανῶσα τὸν νοῦν καὶ τὴν διάνοιαν
  english_pob_choice: leads the mind and understanding astray
  chosen_korean: 마음과 분별을 그릇되게 하며
  alternatives_korean:
  - 마음과 이해를 미혹하며
  - 생각과 분별을 그릇되게 하며
  lexicon: νοῦς, διάνοια, πλανάω
  rationale: νοῦς와 διάνοια를 단순 반복하지 않고 한국어에서 기능적으로 구분되는 ‘마음’과 ‘분별’로 옮겼습니다. πλανάω는 도덕적/인지적 왜곡을 함께 담는 ‘그릇되게 하다’가 적절합니다.
theological_decisions:
- issue: ᾅδης의 음역과 사후 세계 표현
  chosen_reading: 하데스
  alternative_readings:
  - 음부
  - 저승
  - 스올
  rationale: 이 문헌은 헬라어 ᾅδης를 직접 사용하므로, 정경 번역의 관습적 대응어보다 원어 음역을 유지해 텍스트의 층위를 보존했습니다.
  doctrine_reference: 사후 세계 어휘의 원어-대응 보존 원칙
