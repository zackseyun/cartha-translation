revisions:
- from: 음행의 죄는 영혼을 파놓은 구덩이입니다. 그것은 하나님에게서 사람을 떼어 놓고 우상들에 가까이 이끕니다. 왜냐하면 그것이 바로 마음과 분별을 그릇되게 하며, 젊은이들을 제때가 이르기 전에 하데스로 끌어내리기 때문입니다.[a]
  to: 음행의 죄는 영혼을 빠뜨리는 구덩이입니다. 그것은 영혼을 하나님에게서 떼어 놓고 우상들에게 가까이 이끕니다. 이는 바로 그것이 생각과 이해력을 미혹하고, 젊은이들을 그들의 때가 이르기도 전에 하데스로 끌어내리기 때문입니다.
  rationale: The revision corrects the opening image, keeps the soul as the implicit object of the participles, renders πλανῶσα as “미혹하고,” and accurately expresses premature descent to Hades. It also removes an unpaired footnote anchor. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the main sequence and the rendering of ᾅδην as “하데스” is appropriate. However, “영혼을 파놓은 구덩이” reverses the source’s metaphor and is not meaningful Korean: βόθρος ... ψυχῆς is a pit for/of the soul, not a pit the soul has dug. The supplied object “사람을” also unnecessarily shifts the referent from the soul, and “제때가 이르기 전에” does not convey οὐκ ἐν καιρῷ αὐτῶν (“before their time”).'
  naturalness: Several phrases are awkward or unidiomatic, particularly “영혼을 파놓은 구덩이” and “제때가 이르기 전에.” The revision uses natural modern formal-polite Korean while retaining the original’s personification of the sin.
  terminology: “음행,” “하나님,” “우상들,” and “하데스” are suitable. “생각과 이해력” distinguishes νοῦς and διάνοια more naturally and precisely than “마음과 분별” in this context. The unsupported [a] anchor is removed.
  issues:
  - severity: high
    issue: The opening metaphor is mistranslated and unnatural.
    rationale: “영혼을 파놓은 구덩이” means a pit that has been dug for/by the soul and does not represent βόθρος ... ψυχῆς. The phrase should identify sexual immorality’s sin as a destructive pit in relation to the soul.
  - severity: medium
    issue: The object of separation is shifted from the soul to a supplied generic person.
    rationale: The Greek context presents the sin as separating the soul from God. Retaining “영혼을” preserves the metaphor’s internal coherence without adding a different referent.
  - severity: high
    issue: The temporal clause is mistranslated.
    rationale: οὐκ ἐν καιρῷ αὐτῶν means “before their time,” not “before the proper time arrives.”
  - severity: medium
    issue: The [a] footnote anchor has no corresponding footnote.
    rationale: No footnote content is provided, and the Greek superscripts are edition apparatus markers rather than a basis for this unexplained Korean anchor. It should be removed.
  revised_text: 음행의 죄는 영혼을 빠뜨리는 구덩이입니다. 그것은 영혼을 하나님에게서 떼어 놓고 우상들에게 가까이 이끕니다. 이는 바로 그것이 생각과 이해력을 미혹하고, 젊은이들을 그들의 때가 이르기도 전에 하데스로 끌어내리기 때문입니다.
  revised_footnotes: []
  revision_rationale: The revision corrects the opening image, keeps the soul as the implicit object of the participles, renders πλανῶσα as “미혹하고,” and accurately expresses premature descent to Hades. It also removes an unpaired footnote anchor. No doctrinal interpretation has been added.
