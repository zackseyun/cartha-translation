review_pass:
  verdict: revise
  source_fidelity: ‘자기 영의 악한 욕망에 대한 충고’는 ψυχή를 ‘영’으로 특정하고, διαβούλιον과 ἐπιθυμία πονηράν의 관계를 ‘욕망에 대한 충고’로 바꾸어 원문의 내적 권유/악한 욕망이라는 표현을 흐립니다. 또한 두 번째 문장은 앞 문맥의 ἐπειδὴ γάρ(‘왜냐하면/…했기 때문에’)의 인과 관계를 자연스럽게 연결하지 못합니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 ‘약물도 가져다주었습니다’와 ‘마음의 권유, 곧 악한 욕망’이 자연스럽습니다. 원문의 인과를 한 문장으로 연결하면 문맥도 더 명료해집니다.
  terminology: ἡ Αἰγυπτία는 ‘이집트 여인’, μάγοι는 ‘마술사들’, φάρμακα는 의미를 과도하게 한정하지 않는 ‘약물’로 유지할 수 있습니다. ψυχή는 여기서 ‘영’보다 ‘마음’이 자연스럽고 불필요한 신학적 함의를 피합니다. ἐπιθυμία πονηράν은 ‘악한 욕망’으로 유지합니다.
  issues:
  - severity: medium
    issue: ψυχή를 ‘영’으로 옮기고 διαβούλιον을 ‘악한 욕망에 대한 충고’로 재구성함
    rationale: 원문은 ‘그의 ψυχή의 권유/숙고’와 ‘악한 욕망’을 밀접하게 병치합니다. ‘영의 악한 욕망에 대한 충고’는 충고의 대상을 바꾸며, ψυχή에 대한 불필요하게 특정적인 신학 용어를 도입합니다.
  - severity: medium
    issue: ἐπειδὴ γάρ가 나타내는 인과 관계의 연결이 약함
    rationale: 이집트 여인이 여러 일을 한 까닭을 요셉의 자기 절제와 연결하는 문장 구조를 한국어에서도 드러내는 것이 원문에 더 충실합니다.
  revised_text: 이는 이집트 여인이 그에게 여러 일을 하고 마술사들을 불러들이며 그에게 약물도 가져다주었기 때문입니다. 요셉이 모든 악한 욕망으로부터 자신을 지켰고, 자기 마음의 권유, 곧 악한 욕망을 받아들이지 않았기 때문입니다.[a]
  revised_footnotes:
  - marker: a
    text: 그리스어 본문은 이 구절의 일부 전승에서 불확실하거나 손상된 형태로 전해집니다. 여기서는 ‘모든 악한 욕망’이라는 전승된 번역 방향을 따랐습니다.
    reason: ‘모든 악한 욕망’에 해당하는 구절의 본문 상태가 불안정하므로, 단정적인 본문 확정 없이 그 불확실성을 밝혀야 합니다.
  revision_rationale: 문장을 원문의 인과 구조에 맞추고, ψυχή를 문맥상 자연스러운 ‘마음’으로 옮겼습니다. 마지막 구절은 διαβούλιον과 ἐπιθυμία πονηράν의 병치 관계를 ‘권유, 곧 악한 욕망’으로 보존하여 특정 교리적 해석이나 과도한 문법적 재구성을 피했습니다. 원문의 불안정한 구절은 각주로 표시했습니다.
