id: T12P.REU.4.9
reference: Testament of Reuben 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Καὶ γὰρ⁶⁷ πολλὰ ἐποίησεν αὐτῷ ἡ Αἰγυπτία, καὶ μάγους προσεκάλεσεν⁶⁸ καὶ *φάρμακα αὐτῷ προσήνεγκε⁶⁹, ἐπειδὴ γὰρ ἐφύλαξεν ἑαυτὸν Ἰωσὴφ ἀπὸ πάσης. β, Α, S¹ κυρίου. καὶ⁷⁰ οὐκ ἐδέξατο⁷¹ τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ⁷² ἐπιθυμίαν πονηράν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/009.yaml
  text: For the Egyptian woman did many things to him, and called in magicians and brought him potions; for Joseph guarded himself from every evil desire and did not accept the counsel of his soul for wicked desire.
translation:
  language: ko
  text: 그리고 이집트 여인은 그에게 많은 일을 했고, 마술사들을 불러들였으며, 그에게 약물도 가져다주었습니다. 요셉은 모든 악한 욕망에서 자신을 지켰기 때문입니다. 그리고 그는 자기 영의 악한 욕망에 대한 충고를 받아들이지 않았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  english_pob_choice: the Egyptian woman
  chosen_korean: 이집트 여인
  alternatives_korean:
  - 이집트 여자
  - 애굽 여인
  lexicon: 고유명사·민족 표지
  rationale: 인물의 출신을 드러내면서도 현대 한국어에서 자연스러운 성별 표지를 유지하기 위해 ‘이집트 여인’으로 옮겼습니다.
- source_word: μάγους προσεκάλεσεν
  english_pob_choice: called in magicians
  chosen_korean: 마술사들을 불러들였으며
  alternatives_korean:
  - 요술사들을 불러왔으며
  - 박사들을 불러들였으며
  lexicon: μάγος
  rationale: μάγος의 문맥상 점술·주술 행위자를 가리키므로, 독자가 기능을 즉시 이해할 수 있게 ‘마술사들’로 렌더링했습니다.
- source_word: φάρμακα προσήνεγκε
  english_pob_choice: brought him potions
  chosen_korean: 그에게 약물도 가져다주었습니다
  alternatives_korean:
  - 그에게 독약도 가져다주었습니다
  - 그에게 혼합약도 가져다주었습니다
  lexicon: φάρμακον
  rationale: φάρμακα는 문맥상 약물/혼합된 약재를 뜻할 수 있어, 과도하게 특정하지 않되 부정적 주술 맥락을 살린 ‘약물’로 옮겼습니다.
- source_word: οὐκ ἐδέξατο τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ
  english_pob_choice: did not accept the counsel of his soul
  chosen_korean: 자기 영의 악한 욕망에 대한 충고를 받아들이지 않았습니다
  alternatives_korean:
  - 자기 영의 충고를 받아들이지 않았습니다
  - 자기 혼의 조언을 받아들이지 않았습니다
  lexicon: διαβούλιον / ψυχή
  rationale: διαβούλιον을 단순한 ‘조언’보다 내적 숙고의 결과인 ‘충고’로 살리고, ψυχή는 본문 흐름상 내면적 자아를 가리켜 ‘영’으로 옮겼습니다.
theological_decisions:
- issue: ἐπιθυμία πονηράν의 윤리적 강도
  chosen_reading: ‘악한 욕망’으로 직역해 성적 유혹을 도덕적으로 완곡하게 약화하지 않았습니다.
  alternative_readings:
  - 악한 정욕
  - 사악한 욕구
  rationale: 본문은 요셉의 자기 절제와 유혹 거절을 강조하므로, ἐπιθυμία의 욕망성을 분명히 드러내는 표현이 필요합니다.
  doctrine_reference: 금욕/성윤리의 서술을 도덕화하지 않고 본문 강조점을 보존하는 번역 원칙
