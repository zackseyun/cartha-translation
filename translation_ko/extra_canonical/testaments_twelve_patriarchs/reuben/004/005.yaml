source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο⁴⁵ *τέκνα μου⁴⁶, *Γλέγω ὑμῖν⁴⁷, φυλάξατε⁴⁸ Γπάντα⁴⁹ ὅσα ἐντέλλομαι⁵⁰ ὑμῖν, καὶ οὐ μὴ ἁμάρτητε⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/005.yaml
  text: Therefore, my children, I tell you, keep all that I command you, and you will certainly not sin.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 내가 너희에게 말합니다. 내가 너희에게 명하는 모든 것을 지키십시오. 그러면 너희는 결코 죄를 짓지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자녀들이여
  lexicon: τέκνα
  rationale: 친밀한 호칭을 살리되, 현대 한국어에서 자연스럽고 공적인 권면체로는 ‘내 자녀들아’가 가장 적절합니다.
- source_word: φυλάξατε
  english_pob_choice: keep
  chosen_korean: 지키십시오
  alternatives_korean:
  - 간직하십시오
  - 준수하십시오
  lexicon: φυλάσσω
  rationale: 단순 보유가 아니라 명령을 실제로 따르고 보존하라는 의미이므로 ‘지키십시오’가 원문의 요구를 가장 직접적으로 반영합니다.
- source_word: πάντα ὅσα
  english_pob_choice: all that
  chosen_korean: 모든 것
  alternatives_korean:
  - 내가 명하는 모든 것
  - 내가 명하는 모든 일
  lexicon: πᾶς + ὅσος
  rationale: 영문 POB의 수정 취지와 그리스어 구조를 반영해 범위를 넓은 ‘모든 것’으로 옮기되, 바로 뒤의 관계절로 내용을 분명히 했습니다.
- source_word: οὐ μὴ ἁμάρτητε
  english_pob_choice: you will certainly not sin
  chosen_korean: 결코 죄를 짓지 않을 것입니다
  alternatives_korean:
  - 반드시 죄를 짓지 않을 것입니다
  - 전혀 죄를 짓지 않을 것입니다
  lexicon: οὐ μή + aorist subjunctive
  rationale: οὐ μή의 강한 부정을 한국어에서 과장 없이 드러내기 위해 ‘결코’로 옮겼습니다.
theological_decisions:
- issue: 강한 부정(οὐ μή)의 확실성 표현
  chosen_reading: 미래 시점의 확정적 부정으로 ‘결코 죄를 짓지 않을 것입니다’라고 옮겼습니다.
  alternative_readings:
  - ‘반드시 죄를 짓지 않을 것입니다’
  - ‘죄를 짓지 않게 될 것입니다’
  rationale: 원문은 단순한 가능성 부정이 아니라 강한 확정 부정이므로, 한국어에서도 그 강조를 유지해야 합니다.
  doctrine_reference: 문법적 강조 표현
