id: T12P.REU.4.7
reference: Testament of Reuben 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ γὰρ πολλοὺς ἀπώλεσεν ἡ πορνεία· ὅτι κἂν *γέρων ᾖ τις⁵⁸, κἂν⁵⁹ εὐγενής, Γκἂν πλούσιος, κἂν πένης⁶⁰, *ὀνειδισμὸν ἑαυτῷ φέρει παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων καὶ †πρόσκομμα τῷ Βελίαρ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/007.yaml
  text: For sexual immorality has destroyed many; for whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.
translation:
  language: ko
  text: 음행은 많은 사람을 멸망시켰습니다. 왜냐하면 사람이 늙었든, 귀했든, 부유했든, 가난했든, 그는 사람들 앞에서 자기 자신에게 치욕을 가져오고 벨리아르에게는 걸림돌이 되기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 성적 음행
  lexicon: πορνεία
  rationale: 단순한 도덕 일반보다 성적 타락의 범위를 가리키므로, 교회 전통어인 ‘음행’이 원문의 강도를 비교적 직접적으로 드러냅니다.
- source_word: ὀνειδισμὸν ἑαυτῷ φέρει
  english_pob_choice: he brings reproach on himself
  chosen_korean: 자기 자신에게 치욕을 가져오고
  alternatives_korean:
  - 자기에게 수치를 가져오고
  - 자기에게 모욕을 불러오고
  lexicon: ὀνειδισμός / φέρω
  rationale: ὀνειδισμός의 공개적 수치와 비난의 뉘앙스를 살려 ‘치욕’으로 옮기고, φέρει는 자연스러운 한국어로 ‘가져오다’로 풀었습니다.
- source_word: παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων
  english_pob_choice: before the sons of men
  chosen_korean: 사람들 앞에서
  alternatives_korean:
  - 사람의 아들들 앞에서
  - 인간들 앞에서
  lexicon: υἱοὶ τῶν ἀνθρώπων
  rationale: 직역인 ‘사람의 아들들’도 가능하지만, 한국어에서 의미가 자연스럽게 전달되도록 집합적 표현인 ‘사람들’로 옮겼습니다.
- source_word: πρόσκομμα τῷ Βελίαρ
  english_pob_choice: a stumbling block to Beliar
  chosen_korean: 벨리아르에게는 걸림돌이 되며
  alternatives_korean:
  - 벨리아르에게는 걸려 넘어지는 것이 되며
  - 벨리아르 앞에 장애물이 되며
  lexicon: πρόσκομμα
  rationale: πρόσκομμα는 단순한 ‘장애물’보다 넘어짐을 유발하는 ‘걸림돌’이 더 직접적이어서 그 의미를 살렸습니다.
theological_decisions:
- issue: γὰρ의 인과적 연결
  chosen_reading: ‘왜냐하면’으로 앞절과의 논리적 이유 관계를 분명히 했습니다.
  alternative_readings:
  - ‘그리고’
  - 문장 분리
  rationale: 헬라어 γὰρ가 제시하는 설명/이유 관계를 살려, 앞의 진술을 근거로 이어지는 구조를 한국어에서도 분명히 드러냈습니다.
  doctrine_reference: 문맥 연결과 수사 구조
