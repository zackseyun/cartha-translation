review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal sense of πορνεία, the inclusive age/status series, public reproach, and the difficult expression πρόσκομμα τῷ Βελίαρ. However, the Korean causal framing ('왜냐하면 ... 때문입니다') makes the second clause read as a straightforward reason for the first and is less faithful to the Greek’s compact explanatory continuation. The wording for ὀνειδισμὸν ἑαυτῷ φέρει is also overly literal and unnatural in Korean.
  naturalness: ‘자기 자신에게 치욕을 가져오고’ is not idiomatic modern Korean. ‘사람들 사이에서 자신에게 수치를 불러오며’ communicates the public reproach naturally while retaining the reflexive sense. A direct conditional-series sentence is clearer than the double causal construction.
  terminology: ‘음행’ is an acceptable established rendering of πορνεία in this literary-religious context. ‘벨리아르’ appropriately transliterates Βελίαρ. ‘걸림돌’ suitably renders πρόσκομμα without attempting to resolve the text’s difficult implication.
  issues:
  - severity: medium
    issue: Overly explicit and awkward double causal construction
    rationale: The combination ‘왜냐하면 ... 때문입니다’ is stylistically redundant and gives the Greek explanatory sequence a more rigid causal form than necessary.
  - severity: medium
    issue: Unnatural rendering of ὀνειδισμὸν ἑαυτῷ φέρει
    rationale: ‘자기 자신에게 치욕을 가져오다’ is a calque-like expression. ‘자신에게 수치를 불러오다’ is idiomatic and retains the sense of incurring reproach.
  revised_text: 음행은 많은 사람을 멸망시켰습니다. 사람이 늙었든, 귀족이든, 부유하든, 가난하든, 그는 사람들 사이에서 자신에게 수치를 불러오며 벨리아르에게 걸림돌이 됩니다.
  revised_footnotes: []
  revision_rationale: The revision retains the source’s broad generic reference (τις), the fourfold social-status contrast, public reproach, and the unresolved phrase about being a stumbling block to Beliar. It replaces an unnatural Korean calque and removes the redundant causal formula while preserving the explanatory progression.
