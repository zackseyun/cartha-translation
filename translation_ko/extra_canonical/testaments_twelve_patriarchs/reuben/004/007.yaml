- from: 음행은 많은 사람을 멸망시켰습니다. 왜냐하면 사람이 늙었든, 귀했든, 부유했든, 가난했든, 그는 사람들 앞에서 자기 자신에게 치욕을 가져오고 벨리아르에게는 걸림돌이 되기 때문입니다.
  to: 음행은 많은 사람을 멸망시켰습니다. 사람이 늙었든, 귀족이든, 부유하든, 가난하든, 그는 사람들 사이에서 자신에게 수치를 불러오며 벨리아르에게 걸림돌이 됩니다.
  rationale: The revision retains the source’s broad generic reference (τις), the fourfold social-status contrast, public reproach, and the unresolved phrase about being a stumbling block to Beliar. It replaces an unnatural Korean calque and removes the redundant causal formula while preserving the explanatory progression.
