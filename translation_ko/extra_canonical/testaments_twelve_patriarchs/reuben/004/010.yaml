  source_fidelity: 본문의 ‘그러므로’, ‘너희 조상들의 하나님’, ‘그를 …에서 건져 내셨습니다’는 Διὰ τοῦτο, ὁ θεὸς τῶν πατέρων ὑμῶν, ἐρρύσατο αὐτὸν ἀπό를 충실히 반영합니다. ‘온갖 숨은 악한 죽음’도 πονηροῦ와 κεκρυμμένου를 모두 θανάτου에 연결한 한 덩어리의 표현으로 유지하여, 악과 죽음을 별개의 대상으로 분리하지 않습니다.
  naturalness: 합쇼체 문장으로 자연스럽고, ‘건져 내셨습니다’는 격식 있는 현대 한국어에 잘 맞습니다. ‘숨은 악한 죽음’은 다소 낯선 결합이지만 원문의 압축되고 특이한 수식 구조를 불필요하게 해설하지 않고 보존하는 데 적절합니다.
  terminology: ‘너희 조상들의 하나님’과 ‘건져 내셨습니다’는 성서적 문맥에서 자연스럽고 일관된 용어입니다. ‘악한 죽음’은 죽음 자체를 수식하는 원문의 표현을 보존하며, 교리적 해석을 덧붙이지 않습니다.
