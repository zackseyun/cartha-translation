  text: 그러므로 너희 조상들의 하나님께서 그를 온갖 숨은 악한 죽음에서 건져 내셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ὑμῶν
  english_pob_choice: the God of your fathers
  chosen_korean: 너희 조상들의 하나님
  alternatives_korean:
  - 너희 아버지들의 하나님
  - 조상들의 하나님
  lexicon: θεός / πατέρες
  rationale: 직역에 가깝게 유지하되, 한국어 성경에서 자연스럽고 소유 관계가 분명한 표현으로 옮겼습니다.
- source_word: ἐρρύσατο
  english_pob_choice: delivered
  chosen_korean: 건져 내셨습니다
  alternatives_korean:
  - 구해 주셨습니다
  - 구원하셨습니다
  lexicon: ῥύομαι
  rationale: 단순한 도움보다 위험한 상태에서의 구출을 드러내는 동사로 옮겨, 문맥의 강한 구출 의미를 살렸습니다.
- source_word: ἀπὸ παντὸς πονηροῦ κεκρυμμένου θανάτου
  english_pob_choice: from every hidden evil death
  chosen_korean: 온갖 숨은 악한 죽음에서
  alternatives_korean:
  - 모든 숨겨진 악한 죽음에서
  - 모든 은밀한 악한 죽음에서
  lexicon: πονηρός / κεκρυμμένου / θάνατος
  rationale: 개정된 영어 POB처럼 κεκρυμμένου가 θανάτου를 수식하므로, '숨은'을 '죽음'에 걸리게 하여 한 덩어리의 수식구로 처리했습니다.
theological_decisions:
- issue: ‘hidden evil death’의 수식 관계
  chosen_reading: ‘숨은’은 ‘악’보다 ‘죽음’에 연결되는 표현으로 번역했습니다.
  alternative_readings:
  - ‘숨은 악과 죽음에서’
  - ‘숨겨진 악한 죽음에서’
  rationale: 그리스어에서는 κεκρυμμένου가 θανάτου를 수식하므로, 영어 POB 수정 취지를 따라 분리하지 않고 하나의 결합 표현으로 유지하는 것이 본문을 가장 정확히 반영합니다.
  doctrine_reference: 문법/구문 결정
