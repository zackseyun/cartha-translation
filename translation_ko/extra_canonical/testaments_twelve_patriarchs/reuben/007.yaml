review_pass:
  verdict: revise
  source_fidelity: 현존 그리스어는 ‘르우빔이 ... 죽었다’와 ‘그들이 그를 관에 두었다, ~까지’까지만 전하며, ἕως 뒤에서 절단됩니다. 따라서 애굽에서의 이장과 헤브론 매장 내용은 현존 그리스어 자체가 아니라 최소한의 문맥 보충임을 각주로 명시해야 합니다. 보충된 서술에서는 죽은 르우벤이 능동적으로 ‘올라오는’ 것처럼 표현하지 말고, 유해가 옮겨지는 수동 표현을 써야 합니다.
  naturalness: ‘르우벤’, ‘이집트’, ‘관에 안치하였으며’, ‘유해가 ... 옮겨져’는 현대 표준어 성경 문체에서 자연스럽고, 합쇼체를 유지합니다. ‘조상들의 굴’은 의미는 통하지만 ‘조상들이 묻힌 굴’이 한국어에서 더 분명합니다.
  terminology: 고유명사는 한국어 성경의 통용 표기인 ‘르우벤’, ‘헤브론’을 사용했습니다. σορῷ는 ‘관’으로, ἐντειλάμενος는 유언적 지시의 힘을 살린 ‘명한 뒤’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘그가 애굽에서 올라와’가 죽은 르우벤을 능동적 행위자로 표현합니다.
    rationale: 영어 감사 번역은 ‘he was brought up from Egypt’라고 수동태이며, 장례 문맥상 옮겨지는 것은 르우벤 자신이 아니라 그의 유해입니다. ‘그의 유해가 이집트에서 옮겨져’로 바로잡아야 합니다.
  - severity: low
    issue: 고유명사 ‘르우빔’은 표준 한국어 성경의 통용 표기와 다릅니다.
    rationale: 그리스어 형태는 Ῥουβίμ이지만, 한국어 본문에서는 널리 정착한 이름인 ‘르우벤’이 자연스럽고 독자 혼동을 줄입니다.
  - severity: medium
    issue: 현존 그리스어에 없는 이장·매장 보충 부분의 텍스트상 한계가 한국어 각주로 제공되지 않았습니다.
