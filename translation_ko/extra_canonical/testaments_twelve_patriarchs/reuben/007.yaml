  to: 르우벤이 이러한 것들을 자기 아들들에게 명한 뒤 죽었습니다[a]. 그들은 그를 관에 안치하였으며, 그의 유해가 이집트에서 옮겨져 헤브론에 있는 조상들이 묻힌 굴에 장사될 때까지 그렇게 두었습니다[b].
  rationale: 현존 그리스어의 절단 상태를 각주로 분명히 하고, 문맥 보충부의 이장 행위를 ‘유해가 ... 옮겨져’라는 자연스러운 수동 표현으로 수정했습니다. 또한 표준 한국어 성경 관행에 맞추어 ‘르우벤’을 사용하고, 매장 장소의 의미를 더 명료하게 했습니다.
