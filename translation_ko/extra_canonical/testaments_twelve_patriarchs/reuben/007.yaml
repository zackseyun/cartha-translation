  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/007.yaml
  text: And Reuben died[a], after commanding these things to his sons. And they placed him in a coffin until he was brought up from Egypt and buried in Hebron[b], in the cave where his fathers were.
  footnotes:
  - marker: a
    text: The Greek witness supplied for this chapter is very brief and breaks off after 'until.' The remainder of the burial notice is translated with minimal completion from the testament's narrative context rather than from a full reconstructed Greek text.
    reason: textual_variant
  - marker: b
    text: Hebron and the cave of the fathers echo the ancestral burial tradition in Genesis.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 르우빔이 이 일들을 자기 아들들에게 명한 뒤 죽었습니다[a]. 그들은 그를 관에 넣어 두었고, 그가 애굽에서 올라와 헤브론에 있는 조상들의 굴에 장사될 때까지 그렇게 두었습니다[b].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανε
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 별세했습니다
  - 잠들었습니다
  lexicon: LSJ
  rationale: 그리스어의 평이한 죽음 표현을 자연스러운 현대 한국어로 옮기되, 완곡한 표현은 피했습니다.
- source_word: ἐντειλάμενος
  english_pob_choice: after commanding
  chosen_korean: 명한 뒤
  alternatives_korean:
  - 지시한 뒤
  - 가르친 뒤
  lexicon: LSJ
  rationale: 죽음에 앞선 선행 행위를 나타내는 분사 관계를 살려, 유언적 명령의 강한 뉘앙스를 유지했습니다.
- source_word: υἱοῖς
  english_pob_choice: sons
  chosen_korean: 아들들에게
  alternatives_korean:
  - 자녀들에게
  lexicon: LSJ
  rationale: 그리스어가 구체적으로 ‘아들들’을 가리키므로, 족장 서사의 친족 언어를 보존했습니다.
- source_word: σορῷ
  english_pob_choice: coffin
  chosen_korean: 관에
  alternatives_korean:
  - 널에
  - 석관에
  lexicon: LSJ
  rationale: 장례용 용기를 가리키는 말로서, 한국어에서는 ‘관’이 가장 분명하고 읽기 쉬운 대응입니다.
theological_decisions:
- issue: 전승이 매우 짧아 ἕως 뒤가 끊긴 상태를 어떻게 처리할지
  chosen_reading: 현존 본문의 죽음-매장 통지를 직역하되, 서술이 요구하는 최소한의 문맥만 보충해 ‘애굽에서 올라와…장사될 때까지’로 완결했습니다.
  alternative_readings:
  - 끊긴 채로 ‘…까지’에서 끝내기
  - 다른 전승을 따라 더 넓게 재구성하기
  rationale: 제공된 그리스어는 ἕως에서 절단되어 있으므로, 과도한 복원은 피하면서도 본문이 의도하는 임시 안치의 의미는 드러나게 했습니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy; transparency about textual complexity'
