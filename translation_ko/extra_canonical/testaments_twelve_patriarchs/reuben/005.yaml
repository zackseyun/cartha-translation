base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005.yaml
  text: 1[a]. For women are evil, my children; and because they do not have authority or power over a man, they scheme by their appearance how they may draw him to themselves. 2. And the one whom they are not able to enchant by appearance, him they overcome through deceit. 3[b]. For an angel of God also told me concerning them and taught me that women are overcome by the spirit of sexual immorality more than a man, and in their heart they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive. 4. For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him. 5. Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and their faces for the deception of the mind; for every woman who uses deceit in these things is reserved for eternal punishment. 6. For in this way they also
    charmed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were changing themselves into the form of men and appearing to them while they were with their husbands. 7. And they also, desiring in their minds their appearance, gave birth to giants[d][c]. For the Watchers appeared to them as reaching up to heaven.
  footnotes:
  - marker: a
    text: Or 'by their outward form' in verses 1-2; the Greek term can denote appearance, figure, or presentation.
    reason: lexical_alternative
  - marker: b
    text: '''Watchers'' refers to heavenly beings known from Jewish traditions about the time before the flood; compare Genesis 6 in later interpretive tradition, especially 1 Enoch.'
    reason: cross_reference
  - marker: c
    text: The wording in verses 6-7 reflects a developed interpretive tradition about the Watchers, their desire, and the birth of giants.
    reason: cultural_note
  - marker: d
    text: 'The final clause may be understood hyperbolically: the Watchers appeared to the women as towering up to heaven.'
    reason: lexical_alternative
translation:
  language: ko
  text: 1. 여자들은 악합니다, 내 자녀들아. 여자들은 남자에 대하여 권위나 힘을 가지고 있지 못하므로, 외모[a]로 어떻게 그를 자기들에게로 끌어들일지를 꾀합니다. 2. 외모로 홀릴 수 없는 남자는 속임수로 굴복시킵니다. 3. 하나님의 한 천사가 그들에 관하여 내게 말하고 가르쳐 주었습니다. 여자들은 남자보다 더 성적 부정의 영에게 굴복당하며, 마음속으로 남자들을 거슬러 일을 꾀합니다. 또 꾸밈으로 남자들의 생각을 미혹하고, 눈길로 독을 심으며, 먼저 생각으로, 그다음에는 행위로 사로잡습니다. 4. 여자는 남자를 대놓고 강요할 수 없지만, 음녀의 방식으로 그를 교활하게 다룹니다. 5. 그러므로 성적 부정을 피하십시오, 내 자녀들아. 너희 아내들과 딸들에게 명하여, 마음을 미혹하려고 머리와 얼굴을 꾸미지 못하게 하십시오. 이런 일에 속임수를 쓰는 모든 여자는 영원한 형벌을 위하여 예비되어 있습니다. 6. 이런 방식으로 여자들은 홍수 전에 감시자들[b]도 홀렸습니다. 감시자들은 여자들을 계속 바라보다가 그 여자들을 향한 욕망에 사로잡혔고, 마음속으로 그 일을 꾀했습니다. 그들은 자신들을 남자의 모습으로 바꾸어, 여자들이 자기 남편들과 함께 있을 때 그 여자들에게 나타났기 때문입니다. 7. 여자들은 그들의 모습을 마음속에 그리며 갈망하여 거인들을 낳았습니다[c]. 감시자들은 여자들에게 하늘에 닿을 만큼 큰 모습으로 나타났습니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1–2절의 ‘외모’는 그리스어 σχήμα을 옮긴 말이며, 겉모습, 몸가짐, 또는 외적 표현을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감시자들’은 홍수 이전의 시대에 관한 유대 전승에 나오는 천상 존재들을 가리킵니다. 후대의 해석 전통에서는 창세기 6장과 특히 에녹1서의 전승과 관련지어 이해됩니다.
    reason: cross_reference
  - marker: c
    text: 6–7절의 감시자들의 욕망과 거인들의 출생에 관한 표현은 발전된 감시자 전승을 반영합니다.
    reason: cultural_note
  - marker: d
    text: 마지막 표현은 과장적 묘사로 이해할 수 있습니다. 곧 감시자들이 여자들에게 하늘에 닿을 만큼 우뚝 솟은 모습으로 나타났다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πονηραὶ
  english_pob_choice: evil
  chosen_korean: 악합니다
  alternatives_korean:
  - 악합니다
  - 사악합니다
  - 나쁩니다
  lexicon: LSJ
  rationale: 여기서는 단순한 성격평가가 아니라 강한 도덕적 규정이므로, 완곡한 표현보다 직설적인 ‘악합니다’가 본문의 경고를 더 잘 보존합니다.
- source_word: σχήματα / τοῦ σχήματος
  english_pob_choice: appearance
  chosen_korean: 외모
  alternatives_korean:
  - 외모
  - 겉모습
  - 겉치레
  lexicon: LSJ
  rationale: πρόσωπον이 아니라 시각적 매력을 뜻하는 문맥이므로, ‘외모’가 자연스럽고 본문의 유혹 수단을 분명히 드러냅니다.
- source_word: δολιεύονται
  english_pob_choice: scheme
  chosen_korean: 꾀합니다
  alternatives_korean:
  - 꾀합니다
  - 계략을 꾸밉니다
  - 속임수를 씁니다
  lexicon: LSJ
  rationale: 지속적인 교활함과 모략의 뉘앙스를 살리면서도, 이어지는 ἐν καρδίᾳ μηχανῶνται와 구별되도록 ‘꾀합니다’로 옮겼습니다.
- source_word: ἐπισπάσωνται
  english_pob_choice: draw ... to themselves
  chosen_korean: 끌어올지
  alternatives_korean:
  - 끌어오게 할지
  - 자기들에게 끌어당길지
  - 끌어당길지
  lexicon: LSJ
  rationale: ‘자기들에게로 끌어당기다’는 방향성과 자기중심성을 함께 살리기 위해 ‘끌어올지’를 선택했습니다.
- source_word: μηχανῶνται
  english_pob_choice: devise things
  chosen_korean: 꾀하고
  alternatives_korean:
  - 꾀하고
  - 궁리하고
  - 생각해 내고
  lexicon: LSJ
  rationale: 도구적 ‘계략’보다 내면에서 일어나는 고안·궁리의 뜻을 살려, 마음속에서 남성들에 맞서는 일을 ‘꾀한다’고 옮겼습니다.
- source_word: τῷ πνεύματι τῆς πορνείας
  english_pob_choice: the spirit of sexual immorality
  chosen_korean: 성적 부정의 영
  alternatives_korean:
  - 성적 부정의 영
  - 음행의 영
  - 음란의 영
  lexicon: LSJ
  rationale: POB의 ‘spirit’을 보존하면서 πορνεία를 현대 한국어의 공적 문체에 맞게 ‘성적 부정’으로 옮겨, 단순한 성적 행위보다 더 넓은 도덕적 타락을 드러냈습니다.
- source_word: κοσμήσεως
  english_pob_choice: adornment
  chosen_korean: 꾸밈
  alternatives_korean:
  - 꾸밈
  - 장식
  - 단장
  lexicon: LSJ
  rationale: 머리와 얼굴의 장식을 가리키는 구체성을 유지하되, 본문이 비판하는 외적 치장을 폭넓게 담기 위해 ‘꾸밈’을 사용했습니다.
- source_word: πρὸς ἀπάτην διανοίας
  english_pob_choice: for the deception of the mind
  chosen_korean: 마음의 미혹을 위한
  alternatives_korean:
  - 마음의 미혹을 위한
  - 생각을 속이기 위한
  - 지성을 미혹하기 위한
  lexicon: LSJ
  rationale: διανοία를 단지 지성으로 좁히지 않고, 사람의 내적 판단 전체를 뜻하는 말로 받아 ‘마음의 미혹’으로 옮겼습니다.
- source_word: τετήρηται εἰς κόλασιν αἰώνιον
  english_pob_choice: is reserved for eternal punishment
  chosen_korean: 영원한 형벌을 위해 예비되어 있습니다
  alternatives_korean:
  - 영원한 형벌을 위해 예비되어 있습니다
  - 영원한 징벌을 위해 보존되어 있습니다
  - 영원한 벌을 위해 간직되어 있습니다
  lexicon: LSJ
  rationale: 완료 수동의 보존·예비 상태를 드러내기 위해 ‘예비되어 있습니다’를 택했고, κόλασις는 여기서 명백히 징계적 형벌을 뜻하므로 ‘영원한 형벌’로 옮겼습니다.
- source_word: Ἐγρηγόρους
  english_pob_choice: Watchers
  chosen_korean: 감시자들
  alternatives_korean:
  - 감시자들
  - 워처들
  - 각성한 자들
  lexicon: LSJ
  rationale: Second Temple 전승의 고유명사를 한국어로 설명 가능하게 유지하기 위해 직역 계열인 ‘감시자들’을 사용했습니다.
theological_decisions:
- issue: 여자들에 대한 일반화된 경고 문장
  chosen_reading: 본문의 수사적·경고적 화법을 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - ‘악한 여자들’의 범위를 좁혀 해석적으로 완화하기
  - 현대 독자를 위해 성별 일반화를 약화해 재서술하기
  rationale: 이 단락은 번역자가 교정할 문장이 아니라 르우벤의 경고 연설로 제시된 본문이므로, 원문의 거친 수사와 도덕적 긴장을 드러내는 것이 번역 투명성에 부합합니다.
  doctrine_reference: 'PHILOSOPHY.md: original-language primacy; transparency around difficult material'
- issue: τῷ πνεύματι τῆς πορνείας
  chosen_reading: ‘성적 부정의 영’으로 옮겨, 영적 실재를 지우지 않았습니다.
  alternative_readings:
  - 심리적 충동으로만 환원하기
  - ‘음행’으로 좁혀 단순한 행위 규범으로 만들기
  rationale: 본문은 단순한 욕망을 넘어 사람을 지배하는 영적 힘을 말하므로, ‘영’의 요소를 유지해야 본문의 신학적 긴장이 보존됩니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it'
