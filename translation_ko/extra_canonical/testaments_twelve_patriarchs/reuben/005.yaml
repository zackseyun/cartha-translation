revisions:
- from: 1. 여자들은 악합니다, 내 자녀들아. 그리고 그들은 남자에 대해 권위도 힘도 없기 때문에, 그들의 외모로 어떻게 그를 자기들에게 끌어올지 꾀합니다. 2. 외모로는 유혹하지 못하는 사람은, 속임수로 이깁니다. 3. 하나님의 한 천사도 그들에 관하여 내게 말하며 가르쳐 주었는데, 여자들은 한 남자보다 더 성적 부정의 영에 지배를 받으며, 마음으로는 남자들에 맞서는 일을 꾀하고, 꾸밈으로 그들의 생각을 미혹하며, 한 번의 시선으로 독을 뿌리고, 먼저 생각으로, 그다음에는 행위로 사로잡는다고 하였습니다. 4. 여자는 공개적으로 남자를 강제로 굴복시킬 수 없지만, 창녀 같은 모습으로 그를 교활하게 다룹니다. 5. 그러므로 성적 부정을 피하십시오, 내 자녀들아. 또 너희 아내들과 너희 딸들에게 명하여, 마음의 미혹을 위한 머리와 얼굴의 치장을 하지 않게 하십시오. 이런 일에서 속임수를 쓰는 모든 여자는 영원한 형벌을 위해 예비되어 있습니다. 6. 이와 같이 그들도 홍수 이전에 감시자들을 유혹하였습니다. 그들이 계속해서 그들을 바라보았기 때문에 그들도 그들을 향한 욕망에 빠졌고, 그들은 그 행위를 마음으로 생각해 냈습니다. 그들은 남자의 모습으로 자신을 바꾸고, 자기 남편들과 함께 있는 동안 그들에게 나타났기 때문입니다. 7. 여자들도 그들의 모습을 마음으로 바라며 거인들을 낳았습니다. 감시자들은 그들에게 하늘에 닿을 듯한 존재로 나타났습니다.[a][b][c][d]
  to: 1. 여자들은 악합니다, 내 자녀들아. 여자들은 남자에 대하여 권위나 힘을 가지고 있지 못하므로, 외모[a]로 어떻게 그를 자기들에게로 끌어들일지를 꾀합니다. 2. 외모로 홀릴 수 없는 남자는 속임수로 굴복시킵니다. 3. 하나님의 한 천사가 그들에 관하여 내게 말하고 가르쳐 주었습니다. 여자들은 남자보다 더 성적 부정의 영에게 굴복당하며, 마음속으로 남자들을 거슬러 일을 꾀합니다. 또 꾸밈으로 남자들의 생각을 미혹하고, 눈길로 독을 심으며, 먼저 생각으로, 그다음에는 행위로 사로잡습니다. 4. 여자는 남자를 대놓고 강요할 수 없지만, 음녀의 방식으로 그를 교활하게 다룹니다. 5. 그러므로 성적 부정을 피하십시오, 내 자녀들아. 너희 아내들과 딸들에게 명하여, 마음을 미혹하려고 머리와 얼굴을 꾸미지 못하게 하십시오. 이런 일에 속임수를 쓰는 모든 여자는 영원한 형벌을 위하여 예비되어 있습니다. 6. 이런 방식으로 여자들은 홍수 전에 감시자들[b]도 홀렸습니다. 감시자들은 여자들을 계속 바라보다가 그 여자들을 향한 욕망에 사로잡혔고, 마음속으로 그 일을 꾀했습니다. 그들은 자신들을 남자의 모습으로 바꾸어, 여자들이 자기 남편들과 함께 있을 때 그 여자들에게 나타났기 때문입니다. 7. 여자들은 그들의 모습을 마음속에 그리며 갈망하여 거인들을 낳았습니다[c]. 감시자들은 여자들에게 하늘에 닿을 만큼 큰 모습으로 나타났습니다[d].
  rationale: 원문의 성별 일반화와 영적·도덕적 어휘를 완화하지 않았습니다. 다만 방향을 나타내는 동사, ‘음녀의 방식’이라는 관용적 표현, 6–7절의 서사상 지시 대상을 바로잡고, 한국어 문장 안에서 읽히도록 명시했습니다. 각주는 영어 감사 이력의 내용에 따라 관련 본문 위치에 앵커를 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:17Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 본문의 거친 경고 어조와 핵심 어휘를 대체로 보존합니다. 그러나 1절의 ‘끌어올지’는 ἐπισπάσωνται(자기들에게로 끌어당기다)의 방향성을 잘못 표현하며, 6–7절에서는 반복되는 대명사의 지시 대상이 한국어에서 지나치게 불분명합니다. 원문의 문맥상 여자들, 감시자들, 여자들의 남편들을 필요한 범위에서 명시하여 사건의 진행을 재현했습니다.
  naturalness: 합쇼체의 기본 문체는 유지되어 있으나 ‘남자에 대해 권위도 힘도 없기 때문에’, ‘공개적으로’, ‘창녀 같은 모습’, ‘한 번의 시선으로 독을 뿌리고’ 등은 다소 부자연스럽거나 원문의 뜻을 좁힙니다. 이를 현대 한국어의 자연스러운 공식 문체로 다듬었습니다.
  terminology: ‘성적 부정의 영’, ‘영원한 형벌’, ‘감시자들’, ‘거인들’은 유지했습니다. 다만 σχήμα의 ‘외모/모습’과 πορνικοῖς의 ‘음녀의 방식’을 문맥에 맞게 구별했고, ἐνσπείρουσι의 ‘심다’를 보존했습니다. 각주 표지는 관련 어구에 직접 붙여 재배치했습니다.
  issues:
  - severity: medium
    issue: 1절 ‘자기들에게 끌어올지’
    rationale: ἐπισπάσωνται는 ‘자기들에게로 끌어당기다/끌어들이다’이지 위로 끌어올리는 뜻이 아닙니다.
  - severity: medium
    issue: 6–7절 대명사 지시 대상의 불명확성
    rationale: 그리스어의 대명사 연쇄는 앞 문맥에서 여자들과 감시자들을 구별해 읽을 수 있으나, 한국어 초안의 ‘그들’ 반복은 누가 보고, 욕망하고, 모습을 바꾸며, 나타나는지를 알아보기 어렵게 합니다.
  - severity: medium
    issue: 각주 표지가 모두 7절 끝에 집중됨
    rationale: a는 1–2절의 σχήμα, b는 6절의 감시자들, c는 7절의 거인 전승, d는 마지막 절의 과장적 높이 묘사에 각각 붙어야 합니다.
  - severity: low
    issue: 4절 ‘창녀 같은 모습’
    rationale: ἐν σχήματι πορνικοῖς는 단순한 외형보다 ‘음녀의 방식/행색’을 가리키므로 ‘음녀의 방식으로’가 더 충실합니다.
