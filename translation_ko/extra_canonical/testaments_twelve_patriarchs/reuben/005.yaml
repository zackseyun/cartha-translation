  text: Πονηραὶ ¹γάρ¹¹ εἰσιν αἱ γυναῖκες, τέκνα² μου, *καὶ ἐν τῷ μὴ ἔχειν αὐτὰς³ ἐξουσίαν *ἢ δύναμιν⁴ ἐπὶ *τὸν ἄνδρα⁵, δολιεύονται⁶ ἐν σχήμασιν⁷ ὅπως⁸ αὐτὸν⁹ *πρὸς ἑαυτὰς¹⁰ ἐπισπάσωνται¹¹. 2. Καὶ¹² ὃν¹³ διὰ *τοῦ σχήματος¹⁴ οὐκ ἰσχύουσιν¹⁵ καταγοητεῦσασθαι¹⁶, τοῦτον¹⁷ δι᾿¹⁸ ἀπάτης κατα- γωνίζονται¹⁹. 3. ⌜Ὅτι⌝ καίγε²⁰ *περὶ αὐτῶν²¹ εἰπεῖν²² μοι δ᾽ ἄγγελος τοῦ Θεοῦ, καὶ ἐδίδαξέ με²³, ὅτι²⁴ αἱ²⁵ γυναῖκες ἡττῶνται²⁶ *τῷ πνεύματι τῆς πορνείας²⁷ *ὑπὲρ τὸν ἄνδρα²⁸, καὶ *ἐν καρδίᾳ²⁹ μηχανῶνται³⁰ *κατὰ τῶν ἀνθρώπων³¹, καὶ³² *διὰ τῆς κοσμήσεως³³ πλανῶσι Γαὐτῶν˥³⁴ τὰς δια- β, Α, S¹ νοίας³⁵, *καὶ διὰ³⁶ τοῦ βλέμματος *τὸν ἰὸν³⁷ ἐνσπείρουσι³⁸, πρῶτον καὶ τότε *τῷ ἔργῳ³⁹ αἰχμαλωτίζουσιν⁴⁰. 4. Οὐ γὰρ τὰς. δύναται γυνὴ *ἄνδρα βιάσαι εἰς πρόσωπον ἀλλ᾽ ἐν σχήματι β, Α, S¹ πορνικοῖς τοῦτον πανουργεύεται⁴¹. 5. *Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην
