    text: ‘감시자들’은 홍수 이전의 시대에 관한 유대 전승에 나오는 천상 존재들을 가리킵니다. 후대의 해석 전통에서는 창세기 6장과 특히 에녹1서의 전승과 관련지어 이해됩니다.
