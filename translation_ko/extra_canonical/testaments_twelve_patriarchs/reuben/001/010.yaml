id: T12P.REU.1.10
reference: Testament of Reuben 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 10. Καὶ⁶⁴ οἶνον καὶ σίκερα οὐκ ἔπιον, καὶ κρέας⁶⁵ οὐκ εἰσῆλθεν *ἐν τῷ στόματί⁶⁶ μου· καὶ πᾶν⁶⁷ ἄρτον ἐπι- θυμίας⁶⁸ οὐκ ἔφαγον⁶⁹ *ἀλλ᾽ ἤμην⁷⁰ πενθῶν ἐπὶ τῇ ἁμαρτίᾳ μου⁷¹, μεγάλη γὰρ ἦν, *οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/010.yaml
  text: And I drank no wine or strong drink, and no meat entered my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great, such as had not happened in Israel.
translation:
  language: ko
  text: 포도주와 독주는 마시지 않았고, 고기도 제 입에 들어오지 않았으며, 맛있는 빵도 먹지 않았습니다.[a] 그러나 저는 제 죄를 두고 애통하고 있었습니다. 제 죄는 매우 큰 죄였고, 이스라엘에서는 그와 같은 일이 일어난 적이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘욕망의 빵’입니다. 문맥상 욕망을 일으키는 맛있는 빵 또는 별미를 가리킵니다.
    reason: ἄρτον ἐπιθυμίας의 문자적 형태와 문맥상 자연스러운 의미를 함께 제시합니다.
lexical_decisions:
- source_word: οἶνον καὶ σίκερα
  english_pob_choice: wine or strong drink
  chosen_korean: 포도주와 독주
  alternatives_korean:
  - 포도주와 센 술
  - 포도주와 강한 술
  lexicon: οἶνον, σίκερα
  rationale: σίκερα는 발효성 알코올 음료 전반을 가리키므로 한국어 성경 문맥에서 자연스럽고 구분이 분명한 ‘독주’를 택했습니다.
- source_word: κρέας οὐκ εἰσῆλθεν ἐν τῷ στόματί μου
  english_pob_choice: no meat entered my mouth
  chosen_korean: 고기도 제 입에 들어오지 않았으며
  alternatives_korean:
  - 고기도 제 입으로 들어오지 않았으며
  - 고기는 제 입에 들어오지 않았으며
  lexicon: κρέας, στόμα
  rationale: 직역을 유지하되 한국어에서는 ‘들어오다’가 식사와 섭취의 자연스러운 표현이므로, 능동화하지 않고도 의미를 살렸습니다.
- source_word: ἄρτον ἐπιθυμίας
  english_pob_choice: bread of desire
  chosen_korean: 욕망의 빵
  alternatives_korean:
  - 갈망의 빵
  - 원하는 빵
  lexicon: ἄρτον, ἐπιθυμίας
  rationale: 문자적으로는 ‘빵/떡’이지만, 이 절의 금식·절제 맥락을 살려 ‘욕망의 빵’으로 옮겨 원문이 주는 금욕적 대비를 보존했습니다.
- source_word: πενθῶν ἐπὶ τῇ ἁμαρτίᾳ μου
  english_pob_choice: mourning over my sin
  chosen_korean: 제 죄 때문에 슬퍼하고 있었으니
  alternatives_korean:
  - 제 죄를 두고 애도하고 있었으니
  - 제 죄로 인해 애통하고 있었으니
  lexicon: πενθῶν, ἁμαρτία
  rationale: πενθέω의 지속적 애통을 한국어에서 자연스럽게 풀어 ‘슬퍼하고 있었습니다’로 옮겼고, 원인 관계는 ‘때문에’로 명료하게 했습니다.
theological_decisions:
- issue: 금식과 자기절제의 강조 방식
  chosen_reading: 문장의 동사들을 과거 서술로 유지하면서도, ‘슬퍼하고 있었습니다’로 지속성을 살려 회개와 애도의 태도를 드러냈습니다.
  alternative_readings:
  - ‘슬퍼하고 있었습니다’ 대신 ‘애통하고 있었습니다’
  - ‘마음 아파하고 있었습니다’
  rationale: 원문은 단순한 식사 금지가 아니라 죄를 두고 애통하는 내적 상태를 함께 제시하므로, 금욕 행위와 회개의 정서를 동시에 보존하는 것이 중요합니다.
  doctrine_reference: 회개와 금식의 결합
