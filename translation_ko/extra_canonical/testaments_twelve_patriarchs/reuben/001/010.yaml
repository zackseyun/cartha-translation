revisions:
- from: 포도주와 독주는 마시지 않았고, 고기도 제 입에 들어오지 않았으며, 욕망의 빵도 먹지 않았습니다. 그러나 저는 제 죄 때문에 슬퍼하고 있었으니, 그것은 크고도 이스라엘에서 아직 일어난 적이 없는 것이었습니다.[a]
  to: 포도주와 독주는 마시지 않았고, 고기도 제 입에 들어오지 않았으며, 맛있는 빵도 먹지 않았습니다.[a] 그러나 저는 제 죄를 두고 애통하고 있었습니다. 제 죄는 매우 큰 죄였고, 이스라엘에서는 그와 같은 일이 일어난 적이 없었습니다.
  rationale: 문장의 부정적 금식 목록, 지속적인 애통, 죄의 비할 데 없는 심각성이라는 원문의 흐름을 유지했습니다. 불명확한 직역 표현은 자연스러운 현대 한국어로 바꾸되 주석으로 원문의 표현과 의미 범위를 보존했고, 고아 상태였던 각주 표지도 유효한 주석에 연결했습니다.
