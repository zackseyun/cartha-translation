id: T12P.REU.1.7
reference: Testament of Reuben 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 7. *Λέγω δὲ ὑμῖν⁴⁷ ὅτι *ἔπληξέ με⁴⁸ *πληγῇ μεγάλῃ⁴⁹ *ἐπὶ τῆς λαγόνος⁵⁰ μου ἕως⁵¹ μῆνας⁵² ἑπτά· καὶ εἰ μὴ *ὁ πατήρ μου Ἰακὼβ⁵³ προσηύξατο⁵⁴ *περὶ ἐμοῦ πρὸς Κύριον⁵⁵ ἤθελε⁵⁶ Κύριος⁵⁷ ἀνελεῖν με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/007.yaml
  text: And I tell you that he struck me with a severe blow on my loins for seven months; and if my father Jacob had not prayed to the Lord for me, the Lord would have destroyed me.
translation:
  language: ko
  text: 내가 여러분에게 말합니다. 그가 일곱 달 동안 제 허리 부분에 큰 타격을 가했습니다. 내 아버지 야곱이 저를 위하여 주님께 기도하지 않았다면, 주님께서는 저를 멸하셨을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘멸하셨을 것입니다’: 그리스어는 ‘멸하려 하셨을 것이다’로도 직역할 수 있으나, 이 조건문의 문맥에서는 야곱의 기도가 없었더라면 일어났을 결과를 가리킵니다.'
    reason: ἤθελε Κύριος ἀνελεῖν με의 의지 동사와 부정 과거 조건문의 잠재적 결과를 설명하여, 번역이 실제 과거 사건을 단정하는 것으로 오해되지 않게 합니다.
lexical_decisions:
- source_word: ἔπληξέ με πληγῇ μεγάλῃ
  english_pob_choice: he struck me with a severe blow
  chosen_korean: 큰 상처를 입혀서
  alternatives_korean:
  - 심하게 쳐서
  - 큰 타격을 입혀서
  - 매우 심한 상처를 주어서
  lexicon: πλήσσω / πληγή
  rationale: 동사는 단순한 ‘치다’보다 몸에 손상을 가하는 폭력을 가리키며, 명사구는 그 결과를 강조하므로 ‘큰 상처를 입히다’로 자연스럽게 옮겼습니다.
- source_word: ἐπὶ τῆς λαγόνος μου
  english_pob_choice: on my loins
  chosen_korean: 제 허리 위에
  alternatives_korean:
  - 제 옆구리에
  - 제 허리 부분에
  - 제 사타구니에
  lexicon: λαγών
  rationale: λαγών은 넓게 허리/옆구리/사타구니 부위를 가리킬 수 있으나, 본문의 의미를 과도하게 특정하지 않도록 ‘허리 위에’로 처리했습니다.
- source_word: μῆνας ἑπτά
  english_pob_choice: for seven months
  chosen_korean: 일곱 달 동안
  alternatives_korean:
  - 7개월 동안
  - 일곱 달 내내
  lexicon: μῆν
  rationale: 기간 표현은 한국어에서 가장 자연스러운 ‘일곱 달 동안’으로 옮겼습니다.
- source_word: προσηύξατο περὶ ἐμοῦ πρὸς Κύριον
  english_pob_choice: prayed to the Lord for me
  chosen_korean: 저를 위해 주님께 기도하지 않았다면
  alternatives_korean:
  - 저를 위해 주님께 기도하지 않았다면
  - 저를 두고 주님께 기도하지 않았다면
  lexicon: προσεύχομαι / περί / πρός / κύριος
  rationale: 기도의 방향(주님께)과 대상(저를 위해)을 모두 살리기 위해 자연스러운 한국어 어순으로 재구성했습니다.
- source_word: ἤθελε Κύριος ἀνελεῖν με
  english_pob_choice: the Lord would have destroyed me
  chosen_korean: 주님께서 저를 멸하셨을 것입니다
  alternatives_korean:
  - 주님께서 저를 없애버리셨을 것입니다
  - 주님께서 저를 죽이셨을 것입니다
  lexicon: ἀναιρέω / κύριος
  rationale: ἀνελεῖν은 단순 파괴보다 생명 제거를 포함한 ‘멸하다/죽이다’의 강한 의미이므로, 본문과 문맥에 맞게 ‘멸하셨을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 주님의 의지 표현(ἤθελε)
  chosen_reading: ‘멸하셨을 것입니다’로 직역적 가능성보다 결과를 평서적으로 표현했습니다.
  alternative_readings:
  - ‘멸하기를 원하셨을 것입니다’
  - ‘멸할 뜻이 있으셨을 것입니다’
  rationale: 영어 POB의 최신 수정이 ‘would have destroyed me’로 정리한 것처럼, 본문은 실제 결과가 아닌 잠재적 결과를 말하므로 한국어도 가정법의 기능을 살려 자연스럽게 표현했습니다.
  doctrine_reference: 문법적 가정법/잠재적 결과
- issue: ‘주님’의 표기
  chosen_reading: Κύριος를 모두 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 주
  - 주(主)
  rationale: 문맥상 신적 호칭이며, 한국어 종교 문체에서 기도와 서술을 자연스럽게 연결하는 표현은 ‘주님’입니다.
  doctrine_reference: 호칭 번역 관례
