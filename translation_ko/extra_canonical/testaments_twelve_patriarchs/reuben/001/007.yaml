revisions:
- from: 그리고 제가 여러분에게 말합니다. 그가 제 허리 위에 큰 상처를 입혀서 일곱 달 동안 아팠습니다. 또한 내 아버지 야곱이 저를 위해 주님께 기도하지 않았다면, 주님께서 저를 멸하셨을 것입니다.[a]
  to: 내가 여러분에게 말합니다. 그가 일곱 달 동안 제 허리 부분에 큰 타격을 가했습니다. 내 아버지 야곱이 저를 위하여 주님께 기도하지 않았다면, 주님께서는 저를 멸하셨을 것입니다.[a]
  rationale: 원문의 의미를 넘는 ‘아팠습니다’를 삭제하고, λαγών의 해부학적 범위를 과도하게 좁히지 않는 ‘허리 부분’을 사용했습니다. 기간은 원문 및 영어 POB의 표면적 연결을 따라 타격 행위에 붙였으며, 후반의 기도 대상·수혜자·가정적 멸망의 의미는 유지했습니다.
  reviewer_model: gpt-5.6-terra
