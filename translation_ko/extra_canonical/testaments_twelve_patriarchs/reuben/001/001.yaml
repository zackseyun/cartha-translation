  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/001.yaml
  text: A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.
translation:
  language: ko
  text: 르우벤의 유언 사본입니다. 그가 죽기 전에 자기 아들들에게 명령한 것들, 곧 자기 생애의 백이십오 년째에 한 말입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾿Αντίγραφον
  english_pob_choice: A copy
  chosen_korean: 사본입니다
  alternatives_korean:
  - 복사본입니다
  - 옮긴 글입니다
  lexicon: αντίγραφον
  rationale: 문서의 복제본이라는 뜻을 살려 ‘사본’으로 옮기고, 서술형 합쇼체로 마무리했습니다.
- source_word: διαθήκης
  english_pob_choice: testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 증언
  lexicon: διαθήκη
  rationale: 이 문맥에서는 계약보다 개인의 마지막 지시와 유언장 성격이 강하므로 ‘유언’이 자연스럽고 source-direct입니다.
- source_word: ὅσα ἐνετείλατο τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: what he commanded his sons
  chosen_korean: 그가 죽기 전에 자기 아들들에게 명령한 것들
  alternatives_korean:
  - 그가 자기 아들들에게 명령한 것들
  - 그가 자기 아들들에게 분부한 것들
  lexicon: ἐντέλλομαι + υἱοί
  rationale: 과거 시점의 유언적 지시를 드러내기 위해 ‘명령한 것들’로 옮기고, ‘자기 아들들’로 소유 관계를 분명히 했습니다.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the one hundred and twenty-fifth year of his life
  chosen_korean: 자기 생애의 백이십오 년째
  alternatives_korean:
  - 그의 생애 백이십오 년째
  - 나이 백이십오 세에
  lexicon: ἔτος τῆς ζωῆς
  rationale: 직역하면 ‘생애의 해’이므로 한국어에서도 ‘생애의 백이십오 년째’로 시간표현을 보존했습니다.
theological_decisions:
- issue: διαθήκη의 의미를 ‘언약’으로 볼지 ‘유언’으로 볼지
  chosen_reading: 본문은 족장의 최후 지시를 여는 표제이므로 ‘유언’으로 이해했습니다.
  alternative_readings:
  - 언약
  - 증언
  rationale: 문맥상 하나님과의 언약 진술이 아니라 르우벤이 아들들에게 남기는 마지막 말을 소개하는 문장입니다.
  doctrine_reference: 문맥 우선의 서사적 번역 원칙
