translation:
  language: ko
  text: 그가 일어나서 그들에게 입을 맞추고 말씀하셨습니다. “들으십시오, 내 형제들과 내 아들들아. 내가 여러분에게 명하는 바에 관하여 여러분의 아버지 르우벤에게 귀를 기울이십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
