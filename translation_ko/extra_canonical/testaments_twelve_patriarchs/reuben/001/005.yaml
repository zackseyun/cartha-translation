  text: And rising up, he kissed them and said to them, “Hear, my brothers and my sons; listen to Reuben your father in what I command you.”
translation:
  language: ko
  text: 그가 일어나서 그들에게 입을 맞추고 그들에게 말했습니다. “들으십시오, 내 형제들과 내 아들들아. 내가 너희에게 명령하는 것을 들으십시오. 르우벤 너희 아버지를 들으십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἀναστὰς / rising up
  english_pob_choice: And rising up
  chosen_korean: 그가 일어나서
  alternatives_korean:
  - 일어나
  - 일어난 뒤
  lexicon: ἀνίστημι
  rationale: 서사적 동작을 자연스러운 한국어 과거 서술로 옮겼습니다.
- source_word: κατεφίλησεν αὐτοὺς / he kissed them
  english_pob_choice: he kissed them
  chosen_korean: 그들에게 입을 맞추고
  alternatives_korean:
  - 그들에게 입맞춤하고
  - 그들을 입맞추고
  lexicon: καταφιλέω
  rationale: καταφιλέω의 강한 포옹성·애정성을 살리되, 현대 한국어에서 가장 자연스러운 동사구로 옮겼습니다.
- source_word: ἀδελφοί μου καὶ υἱοί μου
  english_pob_choice: my brothers and my sons
  chosen_korean: 내 형제들과 내 아들들아
  alternatives_korean:
  - 내 형제들아, 내 아들들아
  - 내 형제와 내 아들들아
  lexicon: ἀδελφοί / υἱοί
  rationale: 호격의 대상을 분명히 드러내기 위해 관용적 호격 어미를 사용했습니다.
- source_word: ἐνωκλαύσας τίσασθε ... ὅσα ἐντέλλομαι
  english_pob_choice: listen to Reuben your father in what I command you
  chosen_korean: 내가 너희에게 명령하는 것을 들으십시오. … 르우벤 너희 아버지를 들으십시오
  alternatives_korean:
  - 내가 너희에게 명령하는 바를 들으십시오
  - 내가 명하는 대로 르우벤 너희 아버지를 들으십시오
  lexicon: ἐντέλλομαι / ἀκούω
  rationale: 영어 POB의 최종 수정처럼 ‘listen to’를 반복되는 청유로 살리고, 명령의 내용을 직접 목적어로 두어 원문의 촉구를 보존했습니다.
theological_decisions:
- issue: 호격과 명령문의 어조
  chosen_reading: ‘들으십시오’와 ‘-아/야’ 호격을 사용해 아버지의 권면과 유언적 권위를 드러냈습니다.
  alternative_readings:
  - 보다 평이한 서술형으로 완화
  - 개역적 어조로 격상
  rationale: 이 구절은 단순 정보 전달이 아니라 자녀들에게 주는 강한 권면이므로, 현대 합쇼체 안에서 직접성과 긴박감을 유지했습니다.
  doctrine_reference: 문학적-서사적 어조 보존
