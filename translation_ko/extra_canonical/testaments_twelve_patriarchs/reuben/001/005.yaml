  source_fidelity: 초안은 두 명령을 모두 살리려 했으나, ‘내가 너희에게 명령하는 것을 들으십시오’와 ‘르우벤 너희 아버지를 들으십시오’로 분리하여 원문의 결속된 표현(‘내가 너희에게 명하는 바에 관하여/대하여, 너희 아버지 르우벤에게 귀를 기울이라’)을 부자연스럽게 만들었습니다. 또한 ἐνωτίσασθε의 ‘귀를 기울이다’라는 강한 청취 촉구를 ‘르우벤을 들으십시오’보다 명확하게 옮길 필요가 있습니다.
  naturalness: ‘그들에게 입을 맞추고’는 자연스럽지만, 직접화법 안의 ‘내 형제들과 내 아들들아’는 쉼표와 호격을 갖추고, 마지막 촉구는 ‘귀를 기울이십시오’로 옮기는 것이 현대 표준어 합쇼체에 더 자연스럽습니다.
  terminology: 인명 ‘르우벤’은 적절합니다. ‘여러분의 아버지 르우벤’은 원문의 자기지칭을 보존합니다. ‘명하는 바’는 ἐντέλλομαι의 권위 있는 지시를 과도하게 교리화하지 않고 유지합니다.
