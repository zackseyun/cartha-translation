revisions:
- from: 보십시오, 오늘 제가 여러분에게 하늘의 하나님을 증인으로 불러 세웁니다. 그러니 여러분은 젊음의 무지와 음행 속을 걸어가지 마십시오. 그 음행에서 저는 휩쓸려 들어가 아버지 야곱의 침상을 더럽혔습니다.[a][b]
  to: 보십시오, 오늘 하늘의 하나님을 여러분을 거슬러 증인으로 세웁니다. 그러므로 젊은 시절의 무지와 음행 가운데서 살아가지 마십시오. 그 음행에 휩쓸려 들어가 제 아버지 야곱의 침상을 더럽혔습니다.
  rationale: 경고적 증인 호출의 방향을 ‘여러분을 거슬러’로 명시하고, ‘걸어가다’를 한국어에서 자연스러운 삶의 방식 표현인 ‘살아가다’로 바꾸었습니다. ἐξεχύθην에 대해서는 영어 POB 감사 이력의 문맥적 결정인 ‘was swept away’를 따라 ‘휩쓸려 들어가’로 유지했습니다. 내용 없는 각주 표지는 삭제했습니다.
