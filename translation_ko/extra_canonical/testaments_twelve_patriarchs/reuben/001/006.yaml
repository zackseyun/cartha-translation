  text: 6. Καὶ³⁹ *ἰδοὺ ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν τοῦ β-dg, οὐρανοῦ σήμερον⁴⁰, *ὅπως μὴ πορευθῆτε⁴¹ ἐν ἀγνοίᾳ νεότητος⁴² Ab*deg Γκαὶ πορνείᾳ, *ἐν ᾗ⁴³ ἐξεχύθην ἐγὼ καὶ ἐμίανα⁴⁴ κοίτην⁴⁵ ἀδελφοί μου. τοῦ πατρός μου Ἰακώβ⁴⁶.
