  text: And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was swept away and defiled the bed of my father Jacob.
translation:
  language: ko
  text: 보십시오, 오늘 제가 여러분에게 하늘의 하나님을 증인으로 불러 세웁니다. 그러니 여러분은 젊음의 무지와 음행 속을 걸어가지 마십시오. 그 음행에서 저는 휩쓸려 들어가 아버지 야곱의 침상을 더럽혔습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: ἰδοὺ
  rationale: 호소적·주의 환기 기능을 살리면서 현대 한국어의 자연스러운 독자 호출로 옮겼습니다.
- source_word: ἐπιμαρτύρομαι ὑμῖν
  english_pob_choice: I call ... to witness against you
  chosen_korean: 여러분에게 ...을 증인으로 불러 세웁니다
  alternatives_korean:
  - 여러분을 상대로 ...을 증언하게 합니다
  - 여러분에게 ...을 증언합니다
  lexicon: ἐπιμαρτύρομαι
  rationale: 단순한 ‘말한다’보다 엄숙한 증인 호출의 법정적 뉘앙스를 살렸습니다.
- source_word: ἀγνοίᾳ νεότητος
  english_pob_choice: the ignorance of youth
  chosen_korean: 젊음의 무지
  alternatives_korean:
  - 청춘의 무지
  - 젊은 시절의 무지
  lexicon: ἀγνοία
  rationale: 직역에 가깝게 유지하되, 문맥상 젊은 시절의 미성숙과 분별 부족을 함께 드러내는 표현으로 잡았습니다.
- source_word: ἐξεχύθην
  english_pob_choice: was swept away
  chosen_korean: 휩쓸려 들어가
  alternatives_korean:
  - 쏟아져 나가
  - 내몰려
  lexicon: ἐκχέω
  rationale: 최신 POB 수정의 의미를 반영해 ‘휩쓸려’로 수동적, 유동적 유혹에 끌려간 뉘앙스를 살렸습니다.
- source_word: κοίτην
  english_pob_choice: the bed
  chosen_korean: 침상
  alternatives_korean:
  - 잠자리
  - 침대
  lexicon: κοίτη
  rationale: 성적 부정과 결부된 완곡하면서도 성서적 어감을 유지하기 위해 ‘침상’을 택했습니다.
theological_decisions:
- issue: 죄의 범주를 어떻게 드러낼 것인가
  chosen_reading: ‘음행’으로 옮겨 성적 부정행위를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘성적 부도덕’
  - ‘음란’
  rationale: 문맥이 일반적 도덕성보다 성적 죄를 가리키므로, 너무 넓거나 약한 표현보다 소스의 직접성을 우선했습니다.
  doctrine_reference: 성윤리/회개 권면
- issue: 증인 호출의 화법
  chosen_reading: 하늘의 하나님을 증인으로 불러 세우는 엄숙한 경고문 형식으로 유지했습니다.
  alternative_readings:
  - ‘하늘의 하나님께 맹세합니다’
  - ‘하늘의 하나님을 증언으로 삼습니다’
  rationale: ἐπιμαρτύρομαι의 경고·증언 호출 성격을 살리되, 맹세로만 축소하지 않도록 했습니다.
  doctrine_reference: 언약적 경고/증언 화행
