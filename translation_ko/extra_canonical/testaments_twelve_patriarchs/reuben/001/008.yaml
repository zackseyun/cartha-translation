id: T12P.REU.1.8
reference: Testament of Reuben 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 8. Ἤμην γὰρ⁵⁸ ἐτῶν τριάκοντα ὅτε ἔπραξα τὸ πονηρὸν ἐνώπιον Κυρίου⁵⁹. καὶ ἐμαλακίσθην *μῆνας ἑπτὰ⁶⁰ ἕως θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/008.yaml
  text: For I was thirty years old when I did evil before the Lord, and for seven months I was weakened to the point of death.
translation:
  language: ko
  text: 내가 서른 살이었을 때 주님 앞에서 악을 행하였기 때문입니다. 그리고 나는 죽을 지경에 이를 때까지 일곱 달 동안 쇠약해졌습니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: ἐτῶν τριάκοντα
  english_pob_choice: I was thirty years old
  chosen_korean: 서른 살이었을 때
  alternatives_korean:
  - 서른 살이었습니다
  - 나이가 서른이었을 때
  lexicon: 연령 표현
  rationale: 원문의 상태를 간결하게 살리되, 한국어 자연성을 위해 '서른 살이었을 때'로 옮겼습니다.
- source_word: ἔπραξα τὸ πονηρὸν
  english_pob_choice: I did evil
  chosen_korean: 악을 행하였기 때문에
  alternatives_korean:
  - 악을 저질렀기 때문에
  - 악한 일을 하였기 때문에
  lexicon: πονηρός
  rationale: POB의 수정본처럼 목적어를 'the evil thing' 식으로 풀지 않고, 원문의 관용적 표현을 따라 '악을 행하다'로 옮겼습니다.
- source_word: ἐνώπιον Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주 앞에서
  lexicon: κύριος
  rationale: 문맥상 하나님의 임재 앞에서의 행위를 가리키므로, 한국어에서 자연스러운 '주님 앞에서'를 사용했습니다.
- source_word: ἐμαλακίσθην ... μῆνας ἑπτὰ ἕως θανάτου
  english_pob_choice: I was weakened to the point of death for seven months
  chosen_korean: 죽을 지경에 이를 때까지 일곱 달 동안 쇠약해졌습니다
  alternatives_korean:
  - 죽음에 이르기까지 일곱 달 동안 약해졌습니다
  - 일곱 달 동안 죽을 만큼 쇠약해졌습니다
  lexicon: μαλακίζω
  rationale: 수동형의 상태 변화를 살리면서도 한국어에서 어색한 직역을 피하기 위해 '쇠약해졌습니다'로 옮기고, 'ἕως θανάτου'는 '죽을 지경에 이를 때까지'로 표현했습니다.
theological_decisions:
- issue: 주님(κύριος) 호칭의 한국어 처리
  chosen_reading: 여기서는 일반적인 경외 호칭으로 '주님'을 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 문맥상 직접 인용된 야훼 표지의 확정적 전용이라기보다 회고적 서술의 경칭 사용으로 보이므로, 본문 흐름을 해치지 않는 '주님'이 가장 적절합니다.
  doctrine_reference: 하나님의 이름과 주권 호칭의 번역 일관성
