  text: Two years after the death of Joseph his brother, when Reuben had fallen sick, his sons and the sons of his sons gathered to visit him.
translation:
  language: ko
  text: 요셉 곧 그의 형제의 죽음 이후 이 년이 지나고, 르우벤이 병들었을 때, 그의 아들들과 그의 아들의 아들들이 그를 방문하려고 모였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς Ἰωσὴφ τοῦ ἀδελφοῦ αὐτοῦ
  english_pob_choice: Two years after the death of Joseph his brother
  chosen_korean: 요셉 곧 그의 형제의 죽음 이후 이 년이 지나고
  alternatives_korean:
  - 형제 요셉의 죽음 이후 두 해가 지나고
  - 요셉의 형제가 죽은 지 두 해가 지나고
  lexicon: Μετά + accusative/phrase; τελευτή
  rationale: 시간 관계를 자연스럽게 옮기되, 원문의 ‘요셉’과 ‘그의 형제’의 관계를 유지해 사건의 기준점을 분명히 했습니다.
- source_word: ἀρρωστήσαντος Ῥουβήμ
  english_pob_choice: when Reuben had fallen sick
  chosen_korean: 르우벤이 병들었을 때
  alternatives_korean:
  - 르우벤이 병에 들었을 때
  - 르우벤이 앓게 되었을 때
  lexicon: ἀρρωστέω
  rationale: 병든 상태를 간명하고 현대적으로 표현하되, 완료된 상태의 의미를 살렸습니다.
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  english_pob_choice: his sons and the sons of his sons
  chosen_korean: 그의 아들들과 그의 아들의 아들들이
  alternatives_korean:
  - 그의 아들들과 손자들이
  - 그의 아들들과 아들들의 아들들이
  lexicon: υἱός
  rationale: 족보적 반복을 그대로 살려 ‘손자들’보다 원문 구조가 드러나도록 옮겼습니다.
- source_word: συνήχθησαν ἐπισκέψασθαι αὐτόν
  english_pob_choice: gathered to visit him
  chosen_korean: 그를 방문하려고 모였습니다
  alternatives_korean:
  - 그를 찾아뵙기 위해 모였습니다
  - 그를 문안하려고 모였습니다
  lexicon: συνάγω; ἐπισκέπτομαι
  rationale: ‘모이다’와 ‘방문하다’의 두 동작을 함께 드러내면서, 방문 목적을 자연스러운 한국어로 정리했습니다.
