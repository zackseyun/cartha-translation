  text: And he said to them, “My children, behold, I am dying and going the way of my fathers.”
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「얘들아, 보아라. 나는 죽어 가며 내 조상들의 길을 가고 있습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  english_pob_choice: My children
  chosen_korean: 얘들아
  alternatives_korean:
  - 내 자녀들아
  - 내 아이들아
  lexicon: τέκνον
  rationale: 친근한 호칭으로 원문의 직접호소를 살리되, 장엄한 설교체보다 구어적 직접성을 유지했습니다.
- source_word: ἰδοὺ
  english_pob_choice: behold
  chosen_korean: 보아라
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: ἰδού
  rationale: 청자를 향한 주의 환기와 긴박감을 자연스러운 현대 한국어 명령형으로 옮겼습니다.
- source_word: ἀποθνήσκω
  english_pob_choice: I am dying
  chosen_korean: 나는 죽어 가며
  alternatives_korean:
  - 나는 죽고 있으며
  - 나는 죽어 갑니다
  lexicon: ἀποθνῄσκω
  rationale: 진행 중인 죽음의 상태를 드러내기 위해 현재진행적 뉘앙스를 살렸습니다.
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  english_pob_choice: going the way of my fathers
  chosen_korean: 내 조상들의 길을 가고 있습니다
  alternatives_korean:
  - 내 아버지들의 길을 가고 있습니다
  - 내 조상들의 길로 가고 있습니다
  lexicon: ὁδός / πατέρες
  rationale: 원문의 관용적 표현을 직역하되, ‘조상들’로 번역해 혈통적·장례적 의미를 모두 담았습니다.
theological_decisions:
- issue: ‘the way of my fathers’의 관용성
  chosen_reading: 죽음 이후 조상들의 길을 따라간다는 유대적 관용 표현으로 읽어, 완곡하게 풀지 않고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 단순히 ‘조상들이 걸었던 삶의 방식’을 뜻하는 비유로 완화하여 번역
  rationale: 문맥상 임종 선언이므로, 죽음을 에둘러 말하는 고전적 표현의 무게를 보존하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 장례·임종 언어의 관용 표현 보존
