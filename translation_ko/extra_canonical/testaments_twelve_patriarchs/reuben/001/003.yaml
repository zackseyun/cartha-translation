  source_fidelity: 그리스어의 두 현재형 동사(ἀποθνήσκω, πορεύομαι)와 ‘내 아버지들/조상들의 길’이라는 임종 관용구는 대체로 반영되었습니다. 그러나 ‘죽어 가며’는 뒤 절에 수단·동반의 연결 뉘앙스를 더할 수 있어, 원문의 병렬 진술을 더 직접적으로 나타내는 표현이 적절합니다.
