revisions:
- from: 그러나 그곳에서 유다와 갓과 아셀, 자기 형제들을 보자 그들에게 말했습니다. 「저를 일으켜 주십시오. 그러면 제 형제들과 제 자녀들에게 내 마음에 숨겨 둔 것들을 말하겠습니다. 보십시오, 이제 저는 죽어 갑니다」.[a]
  to: 그때 그곳에 있는 유다와 갓과 아셀, 곧 자기 형제들을 보고 그들에게 말했습니다. “저를 일으켜 주십시오. 그러면 제 형제들과 제 자녀들에게 제 마음에 숨겨진 것들을 말하겠습니다. 보십시오, 이제 저는 죽어 갑니다.”
  rationale: A safe revision replaces the overly contrastive connective, makes the Greek apposition idiomatic in Korean, preserves the passive/ambiguous force of κρυπτά, and removes the unpaired footnote anchor. The deathbed expression remains clear and contextually faithful.
