  text: Then, seeing Judah and Gad and Asher there, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am passing away.”
translation:
  language: ko
  text: 그러나 그곳에서 유다와 갓과 아셀, 자기 형제들을 보자 그들에게 말했습니다. 「저를 일으켜 주십시오. 그러면 제 형제들과 제 자녀들에게 내 마음에 숨겨 둔 것들을 말하겠습니다. 보십시오, 이제 저는 죽어 갑니다」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ ... Ἰούδαν καὶ Γὰδ καὶ ᾿Ασήρ ... τοὺς ἀδελφοὺς αὐτοῦ
  english_pob_choice: Then, seeing Judah and Gad and Asher there, his brothers
  chosen_korean: 그러나 그곳에서 유다와 갓과 아셀, 자기 형제들을 보자
  alternatives_korean:
  - 그런데 유다와 갓과 아셀을 그곳에서 보자
  - 유다와 갓과 아셀을 보고, 자기 형제들이 거기 있는 것을 보고
  lexicon: 보이다/보다
  rationale: Ἰδών(보고)과 '그곳에서'의 장소 정보를 살려 자연스러운 서술형으로 옮겼고, 형제들을 동격으로 설명하는 구조를 유지했습니다.
- source_word: Ἀναστήσατέ με
  english_pob_choice: Raise me up
  chosen_korean: 저를 일으켜 주십시오
  alternatives_korean:
  - 나를 일으켜 세워 주십시오
  - 나를 들어 올려 주십시오
  lexicon: 일으키다
  rationale: 병상에서 몸을 일으켜 달라는 뜻을 반영하여, 단순한 물리적 '들어 올림'보다 문맥에 맞는 '일으키다'를 택했습니다.
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου κρυπτά
  english_pob_choice: the things hidden in my heart
  chosen_korean: 내 마음에 숨겨 둔 것들
  alternatives_korean:
  - 내 마음속에 감추어 둔 것들
  - 내 마음에 감춰진 것들
  lexicon: 마음
  rationale: κρυπτά의 '숨겨진/감추어진 것들'을 직역하되, 한국어에서 자연스러운 '숨겨 둔 것들'로 옮겨 내면적 비밀을 살렸습니다.
- source_word: ἐκλείπω
  english_pob_choice: I am passing away
  chosen_korean: 죽어 갑니다
  alternatives_korean:
  - 사라져 갑니다
  - 기력이 다해 갑니다
  lexicon: 죽어 가다
  rationale: 죽음 직전의 소멸을 나타내는 ἐκλείπω의 문맥상 의미를 따라, 완곡하지만 분명한 '죽어 갑니다'로 옮겼습니다.
theological_decisions:
- issue: 화자의 임종 선언을 어떻게 한국어로 표현할지
  chosen_reading: '''이제 저는 죽어 갑니다''로, 현재 진행 중인 임종 상태를 분명히 드러냈습니다.'
  alternative_readings:
  - 이제 저는 사라져 갑니다
  - 이제 저는 기운이 빠져 갑니다
  rationale: 본문은 단순한 약화가 아니라 죽음이 임박한 상태를 말하므로, 독자가 장면의 긴박함을 즉시 이해하도록 했습니다.
  doctrine_reference: 본문 문맥(임종 고백)
