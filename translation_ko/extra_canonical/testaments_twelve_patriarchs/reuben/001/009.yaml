  source_fidelity: 원문의 시간 순서(μετὰ τοῦτο), 내적·자발적 결단(ἐν προαιρέσει ψυχῆς μου), 주 앞에서의 회개(ἐνώπιον Κυρίου), 그리고 칠 년의 기간을 전반적으로 충실히 반영했습니다. 다만 ‘영혼의 결단으로’는 한국어에서 다소 직역투이며, προαίρεσις의 숙고된 의지·결심을 자연스럽게 드러내기 위해 ‘내 마음으로 굳게 결심하고’로 옮기는 편이 좋습니다.
  naturalness: 초안은 이해 가능하나 쉼표가 과도하고 ‘그리고 이 일 후에, 내 영혼의 결단으로, 나는’은 현대 한국어 합쇼체 서술로 다소 부자연스럽습니다. ‘그 후 나는 내 마음으로 굳게 결심하고’가 자연스러운 문장 흐름을 제공합니다.
  terminology: μετανοέω는 이 문맥에서 ‘회개했습니다’가 적절하며, Κυρίου는 ‘주님’보다 원문의 칭호적 간결성을 유지하는 ‘주’가 적절합니다. ψυχή를 반드시 ‘영혼’으로 고정할 필요는 없으며, 관용적 한국어 표현인 ‘마음’이 이 구문의 의지적 의미를 더 정확히 전달합니다.
