translation:
  language: ko
  text: 그 후 나는 내 마음으로 굳게 결심하고 주 앞에서 일곱 해 동안 회개했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  english_pob_choice: And after this
  chosen_korean: 그리고 이 일 후에
  alternatives_korean:
  - 그리고 그 후에
  - 그 뒤에
  lexicon: μετά + 대격
  rationale: 시간적 순서를 자연스럽게 살리되, 전후 서술 연결을 분명하게 했습니다.
- source_word: ἐν προαιρέσει ψυχῆς μου
  english_pob_choice: with the resolve of my soul
  chosen_korean: 내 영혼의 결단으로
  alternatives_korean:
  - 내 영혼의 의지로
  - 내 마음의 결심으로
  lexicon: προαίρεσις; ψυχή
  rationale: προαιρέσις의 ‘의지/결단’ 의미와 ψυχή의 ‘영혼’을 함께 살려, 단순한 감정이 아니라 내적 결단을 드러냈습니다.
- source_word: ἐνώπιον Κυρίου
  english_pob_choice: before the Lord
  chosen_korean: 주 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 주님 앞에
  lexicon: ἐνώπιον + γεν.
  rationale: ἐνώπιον의 ‘면전에서/앞에서’라는 공간·관계적 뉘앙스를 간결하게 반영했습니다.
- source_word: μετενόησα
  english_pob_choice: I repented
  chosen_korean: 회개했습니다
  alternatives_korean:
  - 뉘우쳤습니다
  - 돌이켰습니다
  lexicon: μετανοέω
  rationale: 문맥상 단순 후회보다 도덕·종교적 전환을 가리키므로 ‘회개했습니다’가 가장 직접적입니다.
theological_decisions:
- issue: ‘회개’의 지속 기간 표현
  chosen_reading: 일곱 해 동안 회개했습니다
  alternative_readings:
  - 일곱 해 동안 뉘우쳤습니다
  - 일곱 해 내내 회개했습니다
  rationale: 원문은 동작의 지속을 기간 구문으로 표현하므로, 한국어도 지속성을 드러내되 과도한 해석 없이 옮겼습니다.
  doctrine_reference: repentance in penitential narrative
- issue: ‘주’의 호칭
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 하나님
  rationale: 원문 Κυρίου를 POB 관례상 ‘주’로 두어, 서술문 내에서 간결하고 직접적인 호칭을 유지했습니다.
  doctrine_reference: divine title rendering
