base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003.yaml
  text: 'And besides all these, there is an eighth spirit, the spirit of sleep, with which are created the trance of nature and the image of death.


    With these spirits are mixed the spirits of error. First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of insatiableness of the belly. Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive. Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood in destruction and jealousy, for shaping words and hiding one’s words from one’s own kin and household. Seventh, a spirit of injustice, with which come thefts and acts of greed, so that it may satisfy the pleasures of his heart. For injustice works together with the other spirits through taking and giving.


    And over all these the spirit of sleep is joined, which is the eighth spirit of error and fantasy. And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.


    And now, my children, love the truth, and it will keep you safe. Hear the words of Reuben your father, as I teach you. Do not pay attention to a woman’s appearance, nor keep company with a married woman, nor pry into the affairs of women.'
translation:
  language: ko
  text: '이 모든 것 위에, 여덟째 영이 있으니 곧 잠의 영입니다. 그것과 함께 자연의 황홀 상태와 죽음의 형상이 창조되었습니다.


    이러한 영들과 함께 오류의 영들이 뒤섞입니다. 첫째는 성적 부도덕의 영으로, 본성과 감각 안에 자리합니다. 둘째는 배의 만족을 채우지 못하는 탐식의 영입니다. 셋째는 간과 쓸개에 있는 싸움의 영입니다. 넷째는 자기를 드러내고 마술을 행하는 영으로, 지나친 궁리로 아름답게 보이게 하려는 것입니다. 다섯째는 교만의 영으로, 자랑하며 큰 생각을 품게 합니다. 여섯째는 파멸과 질투 안에 있는 거짓의 영으로, 말을 꾸미고 자기 친족과 식구에게서 말을 숨기게 합니다. 일곱째는 불의의 영으로, 그와 함께 도둑질과 탐욕이 있어 그 마음의 쾌락을 채우게 합니다. 불의는 주고받음을 통해 다른 영들과 함께 작용합니다.


    그리고 이 모든 것 위에 잠의 영이 더해지니, 이것은 오류와 환상의 여덟째 영입니다. 이처럼 모든 젊은이는 멸망하고, 진리에서 자기 마음을 어둡게 하며, 하나님의 율법을 깨닫지 못하고, 자기 아버지들의 훈계를 듣지 못합니다. 나도 내 젊은 시절에 그렇게 고통을 겪었습니다.


    이제, 내 자녀들아, 진리를 사랑하십시오. 그러면 그것이 너희를 지켜 줄 것입니다. 너희 아버지 르우벤이 너희에게 가르치는 말을 들으십시오. 여자의 외모에 마음을 두지 말고, 유부녀와 가까이 지내지 말며, 여자들의 일에 참견하지 마십시오.[a][b]'
  philosophy: formal
lexical_decisions:
- source_word: ὄγδοον πνεῦμα τοῦ ὕπνου
  english_pob_choice: an eighth spirit, the spirit of sleep
  chosen_korean: 여덟째 영… 잠의 영
  alternatives_korean:
  - 여덟째 혼… 수면의 영
  - 여덟째 영… 잠자기의 영
  lexicon: πνεῦμα
  rationale: πνεῦμα를 기본값대로 ‘영’으로 두고, τοῦ ὕπνου는 직역에 가깝게 ‘잠의’로 옮겨 원문의 열거 구조를 살렸습니다.
- source_word: ἔκστασις φύσεως καὶ εἰκὼν τοῦ θανάτου
  english_pob_choice: the trance of nature and the image of death
  chosen_korean: 자연의 황홀 상태와 죽음의 형상
  alternatives_korean:
  - 본성의 황홀과 죽음의 모습
  - 자연의 넋 잃음과 죽음의 상
  lexicon: ἔκστασις / εἰκών
  rationale: ἔκστασις는 단순 수면이 아니라 ‘황홀 상태’에 가까운 비정상적 의식 상태를 가리키므로 그 긴장을 살렸고, εἰκών은 ‘형상’으로 옮겼습니다.
- source_word: τὸ τῆς πορνείας πνεῦμα / ἀπληστείας γαστρός / ἀδικίας
  english_pob_choice: the spirit of sexual immorality / a spirit of insatiableness of the belly / a spirit of injustice
  chosen_korean: 성적 부도덕의 영 / 배의 만족을 채우지 못하는 탐식의 영 / 불의의 영
  alternatives_korean:
  - 음행의 영 / 배를 채우지 못하는 탐욕의 영 / 불의의 영
  - 음란의 영 / 끝없는 탐식의 영 / 불의의 영
  lexicon: πορνεία / γαστήρ / ἀδικία
  rationale: POB의 항목별 분류를 유지하되, πορνεία는 단순 ‘음행’보다 범위를 분명히 드러내는 ‘성적 부도덕’으로, γαστήρ는 문자적 ‘배’를 살려 식욕·탐식의 이미지를 보존했습니다.
- source_word: νόμῳ τοῦ θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 율법
  lexicon: νόμος
  rationale: 여기서 νόμος는 토라적·계시적 규범을 가리키므로 프로젝트 기본값인 ‘율법’을 사용했습니다.
- source_word: γυναικείᾳ ὄψει / θηλείας ὑπάνδρου
  english_pob_choice: a woman’s appearance / a married woman
  chosen_korean: 여자의 외모 / 유부녀
  alternatives_korean:
  - 여인의 모습 / 남편 있는 여자
  - 여성의 모습 / 혼인한 여자
  lexicon: ὄψις / ὑπάνδρος
  rationale: 첫 표현은 POB의 ‘appearance’를 따라 외형에 대한 주의를, δεύτερον은 ὑπάνδρος의 혼인 상태를 분명히 드러내기 위해 ‘유부녀’로 옮겼습니다.
theological_decisions:
- issue: 잠의 영과 오류/환상의 결합
  chosen_reading: 잠의 영은 단순한 생리적 수면이 아니라 사람을 진리에서 멀어지게 하는 오류와 환상의 영적 상태로 묘사했습니다.
  alternative_readings:
  - 단순한 수면 습관의 비유
  - 도덕적 나태의 비유
  rationale: 원문과 POB 모두 ‘오류와 환상’과 연결하므로, 윤리적 비유로 축소하지 않고 영적-인식적 타락의 의미를 유지했습니다.
  doctrine_reference: anthropology / discernment
