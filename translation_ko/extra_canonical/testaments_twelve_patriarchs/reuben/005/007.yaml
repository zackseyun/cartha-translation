id: T12P.REU.5.7
reference: Testament of Reuben 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Κἀκεῖναι γὰρ⁷⁰ ἐπιθυμοῦσαι * τῇ διανοίᾳ τῆς φαντασίας⁷¹ αὐτῶν ἔτεκον⁷² γίγαντας. Ἐφαίνοντο γὰρ αὐταῖς⁷³ * οἱ Ἐγρήγοροι⁷⁴ * ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες⁷⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/007.yaml
  text: And those women also, desiring in their minds their appearance, gave birth to giants. For the Watchers appeared to them as reaching to heaven.
translation:
  language: ko
  text: 그리고 그 여자들도 자기들의 환상의 모습에 마음이 이끌려 거인들을 낳았습니다. 감시자들은 마치 하늘에 닿을 듯 그 여자들에게 보였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖναι γὰρ ... ἐπιθυμοῦσαι
  english_pob_choice: And those women also, desiring...
  chosen_korean: 그리고 그 여자들도 ... 마음이 이끌려
  alternatives_korean:
  - 그리고 그 여자들도 ... 갈망하여
  - 그리고 그 여자들도 ... 욕망하여
  lexicon: ἐπιθυμέω
  rationale: ἐπιθυμοῦσαι는 단순한 ‘원하다’보다 강한 내적 욕구를 가리키므로, 합쇼체 문맥에서 자연스럽게 ‘마음이 이끌려’로 옮겨 욕망의 방향성을 살렸습니다.
- source_word: τῇ διανοίᾳ τῆς φαντασίας αὐτῶν
  english_pob_choice: in their minds their appearance
  chosen_korean: 자기들의 환상의 모습에
  alternatives_korean:
  - 자기들의 마음속 환상에
  - 자기들의 상상된 모습에
  lexicon: διάνοια / φαντασία
  rationale: διανοίᾳ와 φαντασίας의 결합은 ‘마음/지성 안에서 떠올린 형상’을 가리키므로, 영어 POB의 ‘their appearance’를 따라가되 한국어에서는 ‘환상의 모습’으로 압축해 의미를 드러냈습니다.
- source_word: ἔτεκον γίγαντας
  english_pob_choice: gave birth to giants
  chosen_korean: 거인들을 낳았습니다
  alternatives_korean:
  - 거인들을 출산했습니다
  - 거인들을 낳게 되었습니다
  lexicon: γίγαντες
  rationale: ἔτεκον은 직접적 출산 행위를 뜻하므로, 전통적이면서도 직설적인 ‘낳았습니다’를 택해 본문의 강한 서술을 유지했습니다.
- source_word: οἱ Ἐγρήγοροι ... φθάνοντες
  english_pob_choice: the Watchers appeared to them as reaching to heaven
  chosen_korean: 감시자들은 마치 하늘에 닿을 듯 ... 보였습니다
  alternatives_korean:
  - 감시자들은 하늘에 미칠 듯 ... 보였습니다
  - 감시자들은 하늘까지 닿는 것처럼 ... 보였습니다
  lexicon: Ἐγρήγοροι / φθάνω
  rationale: Ἐγρήγοροι를 POB 관례에 따라 ‘감시자들’로 옮기고, φθάνοντες는 단순한 위치가 아니라 ‘하늘에 닿을 듯’이라는 도달감을 살려 번역했습니다.
theological_decisions:
- issue: 감시자들의 초월적 위상을 어떻게 표현할지
  chosen_reading: ‘마치 하늘에 닿을 듯’으로 옮겨, 본문이 묘사하는 과장된 초월성과 경외/위압의 인상을 그대로 남겼습니다.
  alternative_readings:
  - ‘하늘에 닿는 것처럼’으로 완화
  - ‘하늘에 이르는 듯’으로 정리
  rationale: 이 구절은 사실 진술보다 비유적 인상을 강조하므로, 지나치게 평이하게 만들지 않고 원문의 장엄하고 불길한 분위기를 유지하는 것이 본문의 의도에 더 가깝습니다.
  doctrine_reference: 문학적-묵시적 묘사에 대한 본문 충실성
