id: T12P.REU.5.1
reference: Testament of Reuben 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πονηραὶ ¹γάρ¹¹ εἰσιν αἱ γυναῖκες, τέκνα² μου, *καὶ ἐν τῷ μὴ ἔχειν αὐτὰς³ ἐξουσίαν *ἢ δύναμιν⁴ ἐπὶ *τὸν ἄνδρα⁵, δολιεύονται⁶ ἐν σχήμασιν⁷ ὅπως⁸ αὐτὸν⁹ *πρὸς ἑαυτὰς¹⁰ ἐπισπάσωνται¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/001.yaml
  text: For women are evil, my children; and because they have no authority or power over the man, they scheme by their appearance how they may draw him to themselves.
translation:
  language: ko
  text: 내 자녀들아, 여인들은 악합니다. 왜냐하면 그들은 남자에 대하여 권세나 힘을 갖고 있지 않기 때문에, 겉모습으로 술책을 부려 그를 자기들에게로 끌어당기려 하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πονηραὶ
  english_pob_choice: evil
  chosen_korean: 악합니다
  alternatives_korean:
  - 사악합니다
  - 못됩니다
  lexicon: πονηρός
  rationale: 여기서는 도덕적 해악과 유혹의 성격을 강하게 드러내므로, 비교적 직설적인 ‘악합니다’가 본문 의미를 잘 전달합니다.
- source_word: γάρ
  english_pob_choice: For
  chosen_korean: 그리고
  alternatives_korean:
  - 왜냐하면
  - 이는
  lexicon: γάρ
  rationale: 앞선 진술을 이어 설명하는 접속으로 기능하므로, 한국어에서는 자연스러운 연결을 위해 ‘그리고’로 옮겼습니다.
- source_word: ἐξουσίαν ἢ δύναμιν
  english_pob_choice: authority or power
  chosen_korean: 권세나 힘
  alternatives_korean:
  - 권위나 능력
  - 권한이나 힘
  lexicon: ἐξουσία / δύναμις
  rationale: 두 낱말의 결합된 뉘앙스를 살리되, 본문이 말하는 남자에 대한 지배 불가능성을 드러내기 위해 ‘권세나 힘’으로 옮겼습니다.
- source_word: δολιεύονται ἐν σχήμασιν
  english_pob_choice: they scheme by their appearance
  chosen_korean: 겉모습으로 ... 술책을 부립니다
  alternatives_korean:
  - 외모로 ... 꾀를 씁니다
  - 모양으로 ... 속임수를 씁니다
  lexicon: δολιεύομαι / σχῆμα
  rationale: ‘겉모습’은 σχήμα의 외형적 의미를, ‘술책을 부립니다’는 δολιεύονται의 속임수·간계 뉘앙스를 살립니다.
- source_word: ἐπισπάσωνται πρὸς ἑαυτάς
  english_pob_choice: draw him to themselves
  chosen_korean: 그를 자기들 쪽으로 끌어당기려고
  alternatives_korean:
  - 그를 자기들에게 이끌려고
  - 그를 자기들 편으로 끌어오려고
  lexicon: ἐπισπάω / πρὸς ἑαυτόν
  rationale: 동사의 유인·끌어당김을 직접적으로 반영하면서, 목적을 드러내는 ‘-려고’로 문장 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 남자에 대한 여성의 진술 방식
  chosen_reading: 본문의 일반화된 경고를 그대로 유지하되, 특정 여성 전체에 대한 절대적 평가로 약화시키지 않고 경구적·훈계적 진술로 옮겼습니다.
  alternative_readings:
  - 여인들은 모두 악합니다
  - 여자들은 본성상 악합니다
  rationale: 문맥은 자녀들에게 주는 훈계로서 유혹과 경계에 대한 강한 일반화를 담고 있으므로, 본문의 수사적 강도를 유지하되 과도한 절대화를 덜어냅니다.
  doctrine_reference: 문맥-수사적 일반화
- issue: 윤리적 긴장 표현
  chosen_reading: ‘악합니다’, ‘술책을 부립니다’처럼 원문의 부정적 평가를 완화하지 않고 드러냈습니다.
  alternative_readings:
  - ‘문제가 있습니다’
  - ‘주의가 필요합니다’
  rationale: 저자 의도의 경고성을 약화시키면 본문의 실제 충격과 권고 기능이 사라지므로, source-direct한 표현을 유지했습니다.
  doctrine_reference: 본문의 경고 기능
