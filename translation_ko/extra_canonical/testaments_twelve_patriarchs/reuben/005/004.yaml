source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Οὐ γὰρ τὰς. δύναται γυνὴ *ἄνδρα βιάσαι εἰς πρόσωπον ἀλλ᾽ ἐν σχήματι β, Α, S¹ πορνικοῖς τοῦτον πανουργεύεται⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/004.yaml
  text: For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him.
translation:
  language: ko
  text: 여자가 남자를 노골적으로 강제로 굴복시키는 것은 불가능합니다. 그러나 창녀 같은 행실로 그를 간교하게 속입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνὴ ... ἄνδρα βιάσαι εἰς πρόσωπον
  english_pob_choice: a woman is not able to force a man openly
  chosen_korean: 여자가 남자를 노골적으로 강제로 굴복시키는 것은 불가능합니다
  alternatives_korean:
  - 여자가 남자를 얼굴 앞에서 강제로 끌어내는 것은 불가능합니다
  - 여자가 남자를 대놓고 강제할 수는 없습니다
  lexicon: βιάζω
  rationale: βιάζω의 핵심은 ‘강제로 제압하다/억누르다’이므로, 현대 한국어에서 관계의 폭력성과 직접성을 살리는 ‘강제로 굴복시키다’를 택했습니다. εἰς πρόσωπον은 ‘공공연하게/노골적으로’의 뜻으로 반영했습니다.
- source_word: ἐν σχήματι πορνικοῖς
  english_pob_choice: by a harlot's manner
  chosen_korean: 창녀 같은 행실로
  alternatives_korean:
  - 음녀의 모습으로
  - 창기의 태도로
  lexicon: σχῆμα, πορνικός
  rationale: σχῆμα는 외적 ‘모양/태도/행실’을 뜻하므로 ‘행실’로 옮겼고, πορνικός은 도덕적 성격을 분명히 드러내는 ‘창녀 같은’으로 처리했습니다.
- source_word: πανουργεύεται
  english_pob_choice: she acts craftily against him
  chosen_korean: 그를 간교하게 속입니다
  alternatives_korean:
  - 그를 교활하게 다룹니다
  - 그를 술책으로 농락합니다
  lexicon: πανουργεύομαι
  rationale: 이 동사는 단순한 재치가 아니라 속임수와 간계가 있는 행동을 가리키므로, ‘간교하게 속이다’로 옮겨 원문의 부정적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 성적 유혹을 직접적이고 비난적으로 묘사하는 어조
  chosen_reading: 원문의 도덕적 경고 성격을 유지하기 위해 완곡하게 누그러뜨리지 않고, ‘창녀 같은 행실’과 ‘간교하게 속입니다’라는 직설적 표현을 사용했습니다.
  alternative_readings:
  - 더 중립적인 ‘부정한 행실’
  - 완곡한 ‘음란한 태도’
  rationale: 본문은 단순한 중립 묘사가 아니라 경계와 비판을 동반한 경고문이므로, 소스가 지닌 윤리적 강도를 보존하는 것이 적절합니다.
  doctrine_reference: 문맥상 도덕적 훈계/경고
