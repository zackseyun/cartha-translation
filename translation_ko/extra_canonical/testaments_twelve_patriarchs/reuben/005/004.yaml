review_pass:
  verdict: revise
  source_fidelity: 초안은 대조와 전반적 경고 어조를 잘 보존합니다. 그러나 βιάσαι를 ‘강제로 굴복시키다’로 옮기면 원문에 없는 ‘굴복’의 결과를 덧붙입니다. 또한 ἐν σχήματι πορνικοῖς는 ‘행실’보다는 외적 모습·태도·차림을 가리키므로, ‘창녀 같은 모습으로’가 더 가깝습니다.
  naturalness: ‘여자는 남자를 대놓고 강제할 수 없기 때문입니다. 그러나 창녀 같은 모습으로 그를 상대로 간계를 부립니다.’는 현대 표준어 합쇼체로 자연스럽고, 원문의 대조와 일반적 진술을 명료하게 전달합니다.
  terminology: ‘창녀’는 πορνικός의 비판적이고 성적으로 표지된 어조를 유지하되, 본문이 말하는 것은 여성 일반에 대한 사실 진술이 아니라 해당 고대 훈계문의 수사라는 점을 번역에 추가 해설로 주입하지 않았습니다. ‘간계를 부립니다’는 πανουργεύεται의 부정적 책략성을 반영합니다.
  issues:
  - severity: medium
    issue: ‘강제로 굴복시키다’가 βιάσαι에 결과 의미를 추가합니다.
    rationale: βιάζω는 강제하거나 폭력을 쓰다는 뜻이지만, 이 구절은 상대를 ‘굴복’시킨다는 특정 결과를 명시하지 않습니다.
  - severity: medium
    issue: ‘창녀 같은 행실로’가 σχῆμα의 의미 영역을 좁힙니다.
    rationale: σχῆμα는 주로 외적 모양, 모습, 태도, 차림을 뜻합니다. ‘행실’은 지속적 도덕 행위를 더 강하게 암시합니다.
  - severity: low
    issue: 본문 끝의 [a]에 대응하는 각주 내용이 제공되지 않았습니다.
    rationale: 원문 및 감사 추적에 필요한 주석이 없으므로 앵커를 유지할 근거가 없습니다.
  revised_text: 여자는 남자를 대놓고 강제할 수 없기 때문입니다. 그러나 창녀 같은 모습으로 그를 상대로 간계를 부립니다.
