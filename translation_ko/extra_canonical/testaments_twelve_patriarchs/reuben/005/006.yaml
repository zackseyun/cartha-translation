base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/006.yaml
  text: For in this way they also enticed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were transforming themselves into the form of men and appearing to them while their husbands were with them.
translation:
  language: ko
  text: 이와 같이 그들은 홍수 이전의 감시자들을 유혹하였습니다. 그들이 그들을 계속 바라보고 있었기 때문에, 그들 역시 그들에 대한 욕망 속에 이르게 되었고, 마음으로 그 행위를 생각해 내었습니다. 그들은 사람의 모습으로 자신들을 변형하고 있었고, 남편들이 그들과 함께 있는 동안 그들에게 나타났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθελξαν
  english_pob_choice: enticed
  chosen_korean: 유혹하였습니다
  alternatives_korean:
  - 꾀어들였습니다
  - 매혹하였습니다
  - 현혹하였습니다
  lexicon: ἔθελξα
  rationale: POB의 revised audit가 'enticed'를 채택한 점을 따라, 단순한 미화보다 유혹으로 이끄는 작용을 드러내는 동사를 선택했습니다.
- source_word: τοὺς Ἐγρηγόρους
  english_pob_choice: the Watchers
  chosen_korean: 감시자들
  alternatives_korean:
  - 파수꾼들
  - 워처들
  lexicon: Ἐγρήγοροι
  rationale: 고유 집단명칭이지만 한국어 전통 교회 용례가 굳지 않았으므로, 의미를 직접 드러내는 ‘감시자들’로 옮기되 오해를 줄였습니다.
- source_word: ἐν ἐπιθυμίᾳ
  english_pob_choice: in desire
  chosen_korean: 욕망 속에
  alternatives_korean:
  - 정욕 속에
  - 욕심 속에
  - 갈망 속에
  lexicon: ἐπιθυμία
  rationale: 문맥상 단순한 소망이 아니라 성적 욕망을 가리키므로, 의미를 완화하지 않는 ‘욕망’으로 처리했습니다.
- source_word: μετεσχηματίζοντο εἰς ἄνδρα
  english_pob_choice: they were transforming themselves into the form of men
  chosen_korean: 사람의 모습으로 자신들을 변형하고 있었고
  alternatives_korean:
  - 남자의 형상으로 자신을 바꾸고 있었고
  - 사람 모습으로 자신들을 바꾸고 있었고
  lexicon: μετασχηματίζω + εἰς ἄνδρα
  rationale: POB의 ‘transforming’에 맞춰 진행 중인 변형을 살렸고, ἄνδρα를 ‘사람’으로 옮겨 남성성보다 인간의 외형이라는 점을 우선 반영했습니다.
- source_word: συνουσίᾳ τῶν ἀνδρῶν αὐτῶν
  english_pob_choice: while their husbands were with them
  chosen_korean: 남편들이 그들과 함께 있는 동안
  alternatives_korean:
  - 그들의 남편들이 그들과 함께 있는 동안
  - 그들의 남자들과 함께 있는 동안
  lexicon: συνουσία / ἀνήρ
  rationale: 문맥상 ‘남자들’보다 배우자 관계를 가리키는 해석이 자연스러워, POB의 audit을 따라 ‘남편들’로 옮겼습니다.
theological_decisions:
- issue: 감시자들(Ἐγρηγόροι)의 명칭을 음역할지 의미역할지
  chosen_reading: 의미를 드러내는 ‘감시자들’로 번역했습니다.
  alternative_readings:
  - 그냥 ‘워처들’로 음역
  - ‘파수꾼들’로 번역
  rationale: 이 본문은 독자가 집단의 성격을 즉시 이해해야 하므로, 음역보다 기능적 의미를 드러내는 번역이 본문의 효과를 더 잘 보존합니다.
  doctrine_reference: 본문 내부의 초자연적 존재 집단 묘사에 대한 서술 번역 원칙
