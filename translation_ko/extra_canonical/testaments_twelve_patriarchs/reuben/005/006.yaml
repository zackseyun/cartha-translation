revisions:
- from: 이와 같이 그들은 홍수 이전의 감시자들을 유혹하였습니다. 그들이 그들을 계속 바라보고 있었기 때문에, 그들 역시 그들에 대한 욕망 속에 이르게 되었고, 마음으로 그 행위를 생각해 내었습니다. 그들은 사람의 모습으로 자신들을 변형하고 있었고, 남편들이 그들과 함께 있는 동안 그들에게 나타났습니다.[a]
  to: 이와 같이 그 여자들은 홍수 이전에 파수꾼들을 유혹하였습니다. 파수꾼들은 그 여자들을 계속 바라보다가 그 여자들에 대한 욕망을 품게 되었고, 그 일을 마음에 품었습니다. 그들은 남자의 모습으로 자신들을 변형하여, 그 여자들이 자기 남편들과 함께 있을 때 그 여자들에게 나타났습니다.[a]
  rationale: 원문의 사건 순서와 문법적 지시 관계를 보존하면서, 한국어에서 불가피하게 발생하는 대명사 모호성을 해소했습니다. 영어 POB 감사본의 ‘Watchers’, ‘desire’, ‘transforming themselves into the form of men’, ‘while their husbands were with them’도 의미상 반영했습니다.
  reviewer_model: gpt-5.6-terra
