revisions:
- from: 그러므로, 내 자녀들아, 음행을 피하십시오. 그리고 당신들의 아내들과 딸들에게 그들의 머리와 얼굴을 마음의 속임수로 꾸미지 말라고 명령하십시오. 왜냐하면 이러한 것으로 속이는 모든 여자는 영원한 형벌을 받도록 보존되어 있기 때문입니다.
  to: 그러므로 내 자녀들아, 음행을 피하십시오. 너희 아내와 딸들에게 마음을 속이기 위하여 자기들의 머리와 얼굴을 꾸미지 못하게 명령하십시오. 이는 그러한 것으로 속이는 모든 여자가 영원한 형벌을 위하여 예비되어 있기 때문입니다.
  rationale: The revision corrects the syntactic force of πρὸς ἀπάτην διανοίας, improves modern formal Korean address and idiom, and represents τετήρηται εἰς κόλασιν αἰώνιον as an enduring state of being reserved for punishment. It does not add a specific object to δολιευομένη (‘deceiving’), since the Greek leaves that object unstated. No textual footnote is supplied because the source excerpt shows editorial markers but provides no corresponding apparatus readings or note content to translate.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the main clauses, including πορνεία, the imperative to command wives and daughters, and the completed passive sense of τετήρηται. However, ‘마음의 속임수로 꾸미지’ makes the Greek purpose phrase πρὸς ἀπάτην διανοίας sound like an instrumental manner (‘by deception’) rather than the intended purpose/aim. The revision renders it as a purpose while retaining the source’s unspecified object of ‘deceives.’
  naturalness: ‘당신들의’ is unnecessarily marked and less natural in this direct familial address. ‘너희 아내와 딸들’ is idiomatic in elevated modern Korean. The revised wording also avoids the awkward collocation ‘마음의 속임수로 꾸미다.’
  terminology: ‘음행,’ ‘명령하십시오,’ ‘꾸미다,’ and ‘영원한 형벌’ are suitable formal Korean renderings. ‘예비되어 있습니다’ is a more natural Korean expression for τετήρηται εἰς κόλασιν αἰώνιον (‘is reserved/kept for eternal punishment’) than ‘형벌을 받도록 보존되어 있습니다.’
  issues:
  - severity: medium
    issue: Purpose phrase rendered as an instrumental phrase
    rationale: πρὸς ἀπάτην διανοίας modifies the prohibition with a purpose/aim (‘for deception of [the] mind’). ‘마음의 속임수로’ can mean that adornment is done by means of deception, which changes the syntactic relationship.
  - severity: low
    issue: Marked and less natural second-person possessive
    rationale: In a direct address to ‘my children,’ ‘당신들의 아내들과 딸들’ is less idiomatic than ‘너희 아내와 딸들’ and may introduce an unintended politeness/distance nuance.
  - severity: low
    issue: Completed passive ‘reserved’ phrased unnaturally
    rationale: ‘영원한 형벌을 받도록 보존되어 있다’ is understandable but stiff. ‘영원한 형벌을 위하여 예비되어 있다’ naturally preserves the perfect passive state and destination.
  revised_text: 그러므로 내 자녀들아, 음행을 피하십시오. 너희 아내와 딸들에게 마음을 속이기 위하여 자기들의 머리와 얼굴을 꾸미지 못하게 명령하십시오. 이는 그러한 것으로 속이는 모든 여자가 영원한 형벌을 위하여 예비되어 있기 때문입니다.
  revised_footnotes: []
  revision_rationale: The revision corrects the syntactic force of πρὸς ἀπάτην διανοίας, improves modern formal Korean address and idiom, and represents τετήρηται εἰς κόλασιν αἰώνιον as an enduring state of being reserved for punishment. It does not add a specific object to δολιευομένη (‘deceiving’), since the Greek leaves that object unstated. No textual footnote is supplied because the source excerpt shows editorial markers but provides no corresponding apparatus readings or note content to translate.
