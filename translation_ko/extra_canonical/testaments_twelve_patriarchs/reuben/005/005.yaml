id: T12P.REU.5.5
reference: Testament of Reuben 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην διανοίας⁵⁰, ὅτι πᾶσα γυνὴ⁵¹ δολιευομένη ἐν τούτοις εἰς κόλασιν⁵² αἰώνιον⁵³ τετήρηται⁵⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/005.yaml
  text: Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and faces for the deception of the mind; for every woman who deceives by these things is reserved for eternal punishment.
translation:
  language: ko
  text: 그러므로, 내 자녀들아, 음행을 피하십시오. 그리고 당신들의 아내들과 딸들에게 그들의 머리와 얼굴을 마음의 속임수로 꾸미지 말라고 명령하십시오. 왜냐하면 이러한 것으로 속이는 모든 여자는 영원한 형벌을 받도록 보존되어 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείαν
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 성적 음란
  lexicon: πορνεία
  rationale: 한국어 성경 전통에서 πορνεία를 가장 직접적으로 옮기는 말은 ‘음행’이며, 행위의 성적·윤리적 금지를 분명히 드러냅니다.
- source_word: προστάσσετε
  english_pob_choice: command
  chosen_korean: 명령하십시오
  alternatives_korean:
  - 지시하십시오
  - 가르치십시오
  lexicon: προστάσσω
  rationale: 단순 권고보다 강한 지시 동사이므로, 아내와 딸들에게 명확히 금지 사항을 전달하는 힘을 살렸습니다.
- source_word: κοσμῶσι τὰς κεφαλὰς αὐτῶν καὶ τὰς ὄψεις
  english_pob_choice: adorn their heads and faces
  chosen_korean: 그들의 머리와 얼굴을 꾸미지
  alternatives_korean:
  - 머리와 얼굴을 장식하지
  - 머리와 얼굴을 치장하지
  lexicon: κοσμέω
  rationale: ‘꾸미다’는 외모를 장식하는 행위를 자연스럽게 담으면서도, 본문이 금하는 미용·치장의 의미를 유지합니다.
- source_word: πρὸς ἀπάτην διανοίας
  english_pob_choice: for the deception of the mind
  chosen_korean: 마음의 속임수로
  alternatives_korean:
  - 생각을 속이기 위해
  - 마음을 미혹하기 위해
  lexicon: ἀπάτη / διάνοια
  rationale: 직역형 ‘마음의 속임수’로 원문의 인식적 기만을 드러내되, 한국어에서 어색하지 않게 연결했습니다.
- source_word: τετήρηται εἰς κόλασιν αἰώνιον
  english_pob_choice: is reserved for eternal punishment
  chosen_korean: 영원한 형벌을 받도록 보존되어 있기
  alternatives_korean:
  - 영원한 형벌을 위해 예비되어 있기
  - 영원한 벌을 받도록 남겨져 있기
  lexicon: τηρέω / κόλασις / αἰώνιος
  rationale: ‘보존되어 있다’는 수동 완료의 상태를 살리고, κόλασις를 ‘형벌’로 옮겨 응보적 의미를 분명히 했습니다.
theological_decisions:
- issue: 외적 치장과 내적 속임수의 관계
  chosen_reading: 본문은 단순한 미용 비판이 아니라, 외적 치장이 ‘마음의 속임수’와 결부될 때의 영적 위험을 경고합니다.
  alternative_readings:
  - 단순한 복장 규정으로만 이해하는 읽기
  - 사회적 예절에 대한 일반 조언으로 완화하는 읽기
  rationale: 그리스어 목적구(πρὸς ἀπάτην διανοίας)와 최종 경고(영원한 형벌)를 함께 반영해야 본문의 도덕적·영적 긴장이 유지됩니다.
  doctrine_reference: 성화와 경계에 관한 경고 본문
- issue: ‘여자’의 일반화된 경고
  chosen_reading: ‘모든 여자’는 특정 개인만이 아니라, 이 행위로 속이는 모든 경우를 포괄하는 일반화로 옮겼습니다.
  alternative_readings:
  - 특정 문화권 여성에게만 한정하는 읽기
  - 개별 사례로만 축소하는 읽기
  rationale: πᾶσα γυνή와 현재 분사 δολιευομένη의 결합은 보편적 원리를 말하므로, 적용 범위를 좁히지 않았습니다.
  doctrine_reference: 본문의 일반명제 해석
