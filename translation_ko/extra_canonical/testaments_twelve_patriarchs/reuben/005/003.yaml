  text: ⌜Ὅτι⌝ καίγε²⁰ *περὶ αὐτῶν²¹ εἰπεῖν²² μοι δ᾽ ἄγγελος τοῦ Θεοῦ, καὶ ἐδίδαξέ με²³, ὅτι²⁴ αἱ²⁵ γυναῖκες ἡττῶνται²⁶ *τῷ πνεύματι τῆς πορνείας²⁷ *ὑπὲρ τὸν ἄνδρα²⁸, καὶ *ἐν καρδίᾳ²⁹ μηχανῶνται³⁰ *κατὰ τῶν ἀνθρώπων³¹, καὶ³² *διὰ τῆς κοσμήσεως³³ πλανῶσι Γαὐτῶν˥³⁴ τὰς δια- β, Α, S¹ νοίας³⁵, *καὶ διὰ³⁶ τοῦ βλέμματος *τὸν ἰὸν³⁷ ἐνσπείρουσι³⁸, πρῶτον καὶ τότε *τῷ ἔργῳ³⁹ αἰχμαλωτίζουσιν⁴⁰.
