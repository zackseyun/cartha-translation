base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/003.yaml
  text: For an angel of God also told me and taught me concerning them that women are overcome by the spirit of sexual immorality more than men, and in their hearts they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive.
translation:
  language: ko
  text: 하나님의 천사가 그들에 관하여 내게도 말하고 가르쳐 주었습니다. 여자들은 남자보다 음행의 영에 더 크게 제압당하며, 마음속으로 남자들을 거슬러 계략을 꾸밉니다. 또 꾸밈으로 그들의 생각을 빗나가게 하고, 눈길로 독을 뿌리며, 먼저 생각으로, 그다음에는 행위로 사로잡습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος τοῦ Θεοῦ
  english_pob_choice: an angel of God
  chosen_korean: 하나님의 천사 하나
  alternatives_korean:
  - 하나님의 천사
  - 천사 하나님의
  lexicon: ἄγγελος
  rationale: 정관사 없는 단수 표현을 살려 특정되지 않은 천사 한 존재임을 드러내고, ‘하나님의 천사’로 소유 관계를 자연스럽게 옮겼습니다.
- source_word: ἡττῶνται τῷ πνεύματι τῆς πορνείας
  english_pob_choice: are overcome by the spirit of sexual immorality
  chosen_korean: 음행의 영에 더 쉽게 굴복하며
  alternatives_korean:
  - 음행의 영에게 패하며
  - 음행의 영에 사로잡히며
  lexicon: ἡττῶνται / πνεῦμα τῆς πορνείας
  rationale: ‘굴복하다’는 ἡττῶνται의 패배·제압 의미를 살리고, πνεῦμα는 여기서 인격적/지배적 작용을 띠는 ‘영’으로 유지했습니다.
- source_word: διὰ τῆς κοσμήσεως ... καὶ διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  english_pob_choice: by adornment ... and through a glance they sow the poison
  chosen_korean: 꾸밈으로 ... 눈짓으로 독을 뿌려
  alternatives_korean:
  - 장식으로 ... 시선으로 독을 심어
  - 치장으로 ... 바라봄으로 독을 뿌려
  lexicon: κοσμήσεως / βλέμματος / ἰός
  rationale: κοσμήσεως는 단순 미화보다 외적 치장·꾸밈의 뉘앙스를 살려 ‘꾸밈’으로, ἰός는 문자적으로 ‘독’이므로 직역에 가깝게 처리했습니다.
- source_word: πρῶτον καὶ τότε τῷ ἔργῳ αἰχμαλωτίζουσιν
  english_pob_choice: first in thought and then by the act they take captive
  chosen_korean: 먼저는 생각으로, 그리고 그다음에는 행위로 사로잡는다고 하였습니다
  alternatives_korean:
  - 먼저 생각에서, 그다음 행위로 사로잡는다고 하였습니다
  - 먼저 마음으로, 그리고 그다음에 행동으로 사로잡는다고 하였습니다
  lexicon: πρῶτον ... τότε / τῷ ἔργῳ / αἰχμαλωτίζουσιν
  rationale: ‘사로잡다’는 αἰχμαλωτίζουσιν의 포로화 이미지를 보존하고, EN POB의 ‘thought/act’ 구도를 한국어로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 여성 일반에 대한 진술의 보존
  chosen_reading: 본문의 일반화된 진술을 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - ‘어떤 여자들은’처럼 범위를 좁히기
  - 윤리적 판단을 덧붙여 완곡하게 바꾸기
  rationale: 원문과 EN POB 모두 여성 일반을 대상으로 하는 문장 구조를 유지하므로, 후대적 완곡화를 피하고 출처가 가진 긴장을 그대로 드러냈습니다.
  doctrine_reference: 본문비평/수사학적 충실성
- issue: ‘영’의 실재적 작용
  chosen_reading: πνεῦμα τῆς πορνείας를 비유적 단순 심리 상태보다 작용하는 ‘영’으로 번역했습니다.
  alternative_readings:
  - ‘음행의 욕망’으로 심리화하기
  - ‘음란한 성향’으로 완화하기
  rationale: 원문은 인격화된 악의 작용을 전제하는 표현이므로, 이를 약화하지 않고 ‘음행의 영’으로 유지했습니다.
  doctrine_reference: 영적 실재에 대한 본문 표현
