translation:
  language: ko
  text: 또 그들은 외모로 유혹할 수 없는 사람을 속임수로 이깁니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃν διὰ τοῦ σχήματος
  english_pob_choice: whom they are not able to enchant by appearance
  chosen_korean: 외모로는 그들을 유혹할 수 없는 자
  alternatives_korean:
  - 외모로는 그들을 매혹할 수 없는 자
  - 겉모습으로는 그들을 현혹할 수 없는 자
  lexicon: σχήμα
  rationale: σχήμα는 단순한 ‘모양’보다 겉으로 드러나는 형상·외모를 가리키므로, 문맥에 맞게 ‘외모’로 옮겼습니다.
- source_word: οὐκ ἰσχύουσιν καταγοητεῦσασθαι
  english_pob_choice: are not able to enchant
  chosen_korean: 유혹할 수 없는
  alternatives_korean:
  - 매혹할 수 없는
  - 현혹시킬 수 없는
  lexicon: ἰσχύω + καταγοητεύω
  rationale: 영문 POB의 ‘are not able’에 맞춰 능력 부정을 분명히 드러내되, καταγοητεύω의 의미는 ‘유혹하다’로 자연스럽게 살렸습니다.
- source_word: δι᾿ ἀπάτης καταγωνίζονται
  english_pob_choice: through deceit
  chosen_korean: 속임수로 이깁니다
  alternatives_korean:
  - 속임수로 굴복시킵니다
  - 속임수로 제압합니다
  lexicon: ἀπάτη + καταγωνίζομαι
  rationale: ἀπάτη는 ‘속임수’가 직접적이며, καταγωνίζομαι는 ‘이기다/제압하다’의 경쟁적 뉘앙스가 있어 ‘이깁니다’로 옮겼습니다.
