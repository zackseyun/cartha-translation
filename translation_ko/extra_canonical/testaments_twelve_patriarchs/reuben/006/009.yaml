review_pass:
  verdict: revise
  source_fidelity: ‘여러분에게 맹세합니다’는 화자가 청자에게 맹세하는 뜻으로 읽히므로, ‘I adjure you’(Ὁρκῶ ὑμᾶς)의 엄숙한 명령·맹세 요구와 다릅니다. 또한 원문의 두 부정사(‘진실을 행하다’, ‘사랑을 가지다’)는 모두 이 엄숙한 요구의 내용입니다.
  naturalness: ‘하늘의 하나님을 두고 여러분에게 엄숙히 명합니다’는 현대 표준어 합쇼체에서 자연스럽고, 원문의 맹세적 엄숙성을 유지합니다. ‘사랑을 품다’는 ‘사랑을 가지다’보다 한국어에서 더 자연스럽습니다.
  terminology: ‘하늘의 하나님’, ‘이웃’, ‘형제’, ‘진실을 행하다’는 원문의 표현과 관계 윤리적 문맥을 적절히 반영합니다. ‘진실’은 여기서 교리적 ‘진리’로 한정하지 않는 안전한 선택입니다.
  issues:
