source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ὁρκῶ ὑμᾶς τὸν Θεὸν τοῦ οὐρανοῦ⁶⁰ τοῦ⁶¹ ποιεῖν⁶² ἀλήθειαν * ἕκαστος πρὸς τὸν πλησίον αὐτοῦ⁶³ * καὶ ἀγάπην ἔχειν ἕκαστος πρὸς τὸν ἀδελφὸν αὐτοῦ⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/009.yaml
  text: I adjure you by the God of heaven, that each of you do truth toward his neighbor and that each have love toward his brother.
translation:
  language: ko
  text: 하늘의 하나님을 두고 여러분에게 맹세합니다. 여러분 각자는 이웃에게 진실을 행하고, 각자는 자기 형제에게 사랑을 가져야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρκῶ ὑμᾶς
  english_pob_choice: I adjure you
  chosen_korean: 여러분에게 맹세합니다
  alternatives_korean:
  - 여러분에게 엄숙히 당부합니다
  - 여러분에게 간청합니다
  lexicon: ὁρκίζω
  rationale: 직설적인 맹세/엄숙한 서약의 행위이므로 단순한 권유보다 ‘맹세합니다’가 원문 강도를 더 잘 드러냅니다.
- source_word: τὸν Θεὸν τοῦ οὐρανοῦ
  english_pob_choice: by the God of heaven
  chosen_korean: 하늘의 하나님을 두고
  alternatives_korean:
  - 하늘의 하나님으로
  - 하늘의 하나님 앞에서
  lexicon: Θεός
  rationale: 구문상 맹세의 준거를 나타내는 표현이므로 한국어에서도 ‘을 두고’로 자연스럽게 옮겨 맹세의 형식을 살렸습니다.
- source_word: ποιεῖν ἀλήθειαν
  english_pob_choice: do truth
  chosen_korean: 진실을 행하고
  alternatives_korean:
  - 진리를 행하고
  - 진실을 실천하고
  lexicon: ποιέω + ἀλήθεια
  rationale: POB의 개정처럼 ποιεῖν ἀλήθειαν은 ‘행하다’가 핵심이며, 여기서는 도덕적 진실성의 실천을 드러내기 위해 ‘진실을 행하다’로 옮겼습니다.
- source_word: πρὸς τὸν πλησίον αὐτοῦ / πρὸς τὸν ἀδελφὸν αὐτοῦ
  english_pob_choice: toward his neighbor / toward his brother
  chosen_korean: 이웃에게 / 자기 형제에게
  alternatives_korean:
  - 이웃을 향하여 / 형제를 향하여
  - 이웃을 상대로 / 형제를 상대로
  lexicon: πλησίον / ἀδελφός
  rationale: 관계의 방향을 나타내는 πρός를 한국어에서 자연스러운 ‘~에게’로 풀되, 형제/이웃의 두 대상을 분명히 구분했습니다.
theological_decisions:
- issue: 원문의 ‘ἀλήθειαν’과 POB의 ‘do truth’가 지닌 윤리적·관계적 의미
  chosen_reading: ‘진실을 행하다’로 옮겨, 단순한 사실 진술이 아니라 삶으로 드러나는 참됨을 강조했습니다.
  alternative_readings:
  - ‘진리를 행하다’
  - ‘진실을 실천하다’
  rationale: 이 문맥은 교리적 진리보다 이웃을 향한 실제적 성실을 요구하므로, 한국어에서도 윤리적 실행성을 살리는 번역이 적합합니다.
  doctrine_reference: 성경의 진실/진리 실천 윤리
