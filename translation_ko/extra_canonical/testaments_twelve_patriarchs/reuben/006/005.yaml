  text: 'Therefore I say to you: you will envy the sons of Levi and seek to be exalted above them, but because of this you will not prevail.'
translation:
  language: ko
  text: 그러므로 내가 여러분에게 말합니다. 여러분은 레위의 아들들을 시기하고 그들보다 높여지기를 구하겠지만, 이 때문에 뜻을 이루지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο Γοὖν λέγω ὑμῖν
  english_pob_choice: Therefore I say to you
  chosen_korean: 그러므로 내가 여러분에게 말합니다
  alternatives_korean:
  - 그러므로 내가 너희에게 말합니다
  - 그러므로 내가 여러분에게 이르니
  lexicon: διὰ τοῦτο; λέγω ὑμῖν
  rationale: 원문의 결론 연결어를 ‘그러므로’로 살리고, 직접 화법의 담화 표지를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ζηλώσετε
  english_pob_choice: you will envy
  chosen_korean: 시기하고
  alternatives_korean:
  - 질투하고
  - 부러워하고
  lexicon: ζηλόω
  rationale: POB의 수정 의도에 맞춰 감정적 적대와 열망이 함께 있는 동사를 ‘시기하다’로 옮겼습니다.
- source_word: ζητήσετε ὑψωθῆναι ὑπὲρ αὐτούς
  english_pob_choice: seek to be exalted above them
  chosen_korean: 그들보다 높여지기를 구하겠지만
  alternatives_korean:
  - 그들보다 높아지기를 구하겠지만
  - 그들보다 높임을 받기를 구하겠지만
  lexicon: ζητέω + ὑψόω (passive)
  rationale: 능동적 ‘스스로 높이다’가 아니라 수동형 ‘높여지다’를 반영해, 피동적 상승을 명시했습니다.
- source_word: οὐ ἰσχύσετε
  english_pob_choice: you will not prevail
  chosen_korean: 승리하지 못할 것입니다
  alternatives_korean:
  - 이기지 못할 것입니다
  - 극복하지 못할 것입니다
  lexicon: ἰσχύω
  rationale: 문맥상 ‘힘이 미치지 못함’이 결과적으로 패배/불가함을 뜻하므로, 간결하고 자연한 ‘승리하지 못하다’로 옮겼습니다.
