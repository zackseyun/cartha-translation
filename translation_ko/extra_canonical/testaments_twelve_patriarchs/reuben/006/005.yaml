review_pass:
  verdict: revise
  source_fidelity: 핵심 구문은 대체로 충실합니다. ζηλώσετε는 ‘시기하고’로, ζητήσετε ὑψωθῆναι ὑπὲρ αὐτούς의 수동 부정사도 ‘높여지기를 구하다’로 적절히 반영되었습니다. 다만 οὐ ἰσχύσετε는 문자적으로 ‘강하지/능하지 못할 것이다’이며, 여기에는 명시적인 전투나 승패의 대상이 없습니다. ‘승리하지 못할 것입니다’는 원문보다 전투적 의미를 좁혀 넣습니다.
  naturalness: 전체 문장은 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 이 문맥에서 ‘승리하다’보다 ‘뜻을 이루다’가 대상이 명시되지 않은 ἰσχύω의 결과적 의미를 더 자연스럽고 넓게 전달합니다.
  terminology: ‘레위의 아들들’은 고유명 및 집단 지칭으로 적절합니다. ‘시기하다’와 ‘높여지다’도 원문의 경쟁적·수동적 뉘앙스를 보존합니다.
  issues:
  - severity: medium
    issue: οὐ ἰσχύσετε를 ‘승리하지 못할 것입니다’로 번역함
    rationale: ἰσχύω는 ‘강하다, 능력이 있다, 해내다/성공하다’의 폭을 가지며, 본문에는 승리의 상대나 전투가 명시되지 않습니다. ‘승리하다’는 원문에 없는 전투·경쟁 결과를 구체화합니다.
  revised_text: 그러므로 내가 여러분에게 말합니다. 여러분은 레위의 아들들을 시기하고 그들보다 높여지기를 구하겠지만, 이 때문에 뜻을 이루지 못할 것입니다.
