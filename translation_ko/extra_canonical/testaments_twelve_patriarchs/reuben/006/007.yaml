  source_fidelity: 원문 제시문은 심하게 훼손되어 문장 전체를 독립적으로 재구성하기 어렵지만, 영어 POB 감사본이 보존한 수여 구조(하나님—레위/제사장직—유다/왕권 및 ‘with him’)에는 대체로 부합합니다. 다만 γάρ의 연결은 ‘그리하여’보다 이유를 나타내는 ‘이는’이 가깝습니다.
