  terminology: ‘하나님’, ‘레위’, ‘유다’, ‘제사장직’, ‘왕권’은 현대 표준어 합쇼체와 본문의 직분·통치 용어에 적절합니다. ‘왕권’은 βασιλεία의 이 문맥상 통치권 의미를 자연스럽게 반영합니다.
