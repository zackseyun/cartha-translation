  text: For to Levi God gave the priesthood, and to Judah with him the kingdom.
translation:
  language: ko
  text: 이는 하나님께서 레위에게 제사장직을 주셨고, 유다에게는 레위와 함께 왕권을 주셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῷ ... Λευῒ
  english_pob_choice: For to Levi
  chosen_korean: 레위에게는
  alternatives_korean:
  - 레위에게
  - 레위에겐
  lexicon: 고유명사
  rationale: 여격 관계를 자연스러운 한국어로 풀어 ‘~에게는’으로 옮겨, 수여 대상의 대조를 살렸습니다.
- source_word: ἔδωκεν ... τὴν ἱερωσύνην
  english_pob_choice: God gave the priesthood
  chosen_korean: 하나님께서 제사장직을 주셨고
  alternatives_korean:
  - 하나님께서 제사직을 주셨고
  - 하나님께서 제사장 직분을 주셨고
  lexicon: ἱερωσύνην
  rationale: ἱερωσύνην은 ‘제사장직/제사장 직분’이 가장 직접적이므로, 단순한 ‘제사’보다 직분의 수여를 분명히 했습니다.
- source_word: τῷ δὲ Ἰούδᾳ ... τὴν βασιλείαν
  english_pob_choice: and to Judah with him the kingdom
  chosen_korean: 유다에게는 그와 함께 왕권을 주셨습니다
  alternatives_korean:
  - 유다에게는 그와 함께 나라를 주셨습니다
  - 유다와 함께 그 왕국을 주셨습니다
  lexicon: βασιλείαν
  rationale: βασιλείαν을 여기서는 통치권/왕권의 의미로 읽는 것이 자연스러워 ‘왕권’으로 옮겼습니다. ‘그와 함께’는 원문의 동반 수여 관계를 반영합니다.
theological_decisions:
- issue: 제사장직과 왕권의 분배를 어떻게 한국어로 드러낼지
  chosen_reading: 레위와 유다에게 각각 하나님이 맡기신 직분과 통치권을 병렬로 제시했습니다.
  alternative_readings:
  - 레위에게 제사장직, 유다에게 왕권을 주셨습니다
  - 레위에게는 제사장직을, 유다에게는 왕권을 주셨습니다
  rationale: 본문의 대구를 살리되, 영어 POB가 보존한 ‘with him’의 동반성을 너무 설명적으로 늘리지 않도록 간결하게 유지했습니다.
  doctrine_reference: 출 28–29; 창 49:10
