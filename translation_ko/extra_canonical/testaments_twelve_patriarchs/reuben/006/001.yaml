base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/001.yaml
  text: Guard yourselves, therefore, from sexual immorality, and keep your mind pure. Guard also your senses from every woman.
translation:
  language: ko
  text: 그러므로 음행에서 자신을 지키십시오. 마음을 깨끗하게 유지하십시오. 또한 모든 여자에게서 여러분의 감각을 지키십시오.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε ... ἀπὸ τῆς πορνείας
  english_pob_choice: Guard yourselves, therefore, from sexual immorality
  chosen_korean: 음행에서 자신을 지키십시오
  alternatives_korean:
  - 성적 부도덕에서 자신을 지키십시오
  - 음행을 피하십시오
  lexicon: φυλάσσω
  rationale: 명령형 ‘guard yourselves’를 자연스럽게 살리면서, πορνεία는 POB의 ‘sexual immorality’에 대응하는 표준적이고 직접적인 ‘음행’으로 옮겼습니다.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  english_pob_choice: keep your mind pure
  chosen_korean: 마음을 깨끗하게 유지하십시오
  alternatives_korean:
  - 생각을 깨끗하게 하십시오
  - 지성을 순결하게 지키십시오
  lexicon: καθαρεύω / διάνοια
  rationale: 동사의 지속적 뉘앙스를 한국어에서 무리 없이 나타내기 위해 ‘유지하십시오’를 택했고, διάνοια는 문맥상 ‘마음’으로 옮겨 사유와 내적 태도를 함께 담았습니다.
- source_word: τὰς αἰσθήσεις ὑμῶν ... ἀπὸ πάσης γυναικῶν
  english_pob_choice: Guard also your senses from every woman
  chosen_korean: 또한 모든 여자에게서 여러분의 감각을 지키십시오
  alternatives_korean:
  - 또한 모든 여자에게서 여러분의 감각을 보호하십시오
  - 또한 모든 여자에 대하여 여러분의 감각을 지키십시오
  lexicon: αἴσθησις
  rationale: αἰσθήσεις를 단순히 ‘시선’이나 ‘욕정’으로 좁히지 않고, 원문의 넓은 감각/지각 기능을 살려 ‘감각’으로 옮겼습니다.
theological_decisions:
- issue: 여성 일반에 대한 경계 표현의 직역 여부
  chosen_reading: ‘모든 여자에게서’라는 공간적/대상적 경계 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘여자들과의 관계에서’
  - ‘여자들을 멀리하고’
  rationale: 원문은 보편적 경계 지시를 강하게 말하므로, 완화된 표현보다 직접적인 대상 보존이 본문의 긴장과 경고성을 더 잘 드러냅니다.
  doctrine_reference: 성 윤리와 금욕 권고의 직접성 보존
- issue: ‘마음’과 ‘감각’의 병렬 유지
  chosen_reading: νοή/διάνοια의 내적 인지 영역과 αἰσθήσεις의 감각 영역을 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘마음’으로 통합
  - 둘 다 ‘생각’으로 통합
  rationale: 본문이 내적 사고와 외적 감각을 병렬로 다루므로, 한국어에서도 구분을 살려 윤리적 경계의 범위를 분명히 했습니다.
  doctrine_reference: 인간 내면의 인지와 감각에 대한 구분
