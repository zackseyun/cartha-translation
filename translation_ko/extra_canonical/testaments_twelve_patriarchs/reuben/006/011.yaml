id: T12P.REU.6.11
reference: Testament of Reuben 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Αὐτὸς γὰρ⁷⁰ εὐλογήσει τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν· * ὅτι ἐν αὐτῷ⁷¹ ἐξελέξατο Κύριος⁷² βασιλεύειν⁷³ ἐνώπιον⁷⁴ * παντὸς τοῦ λαοῦ⁷⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/011.yaml
  text: For he will bless Israel and Judah, because in him the Lord chose to reign before all the people.
translation:
  language: ko
  text: 그가 곧 이스라엘과 유다에게 복을 주실 것이니, 이는 그 안에서 주께서 온 백성 앞에서 다스리도록 선택하셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογήσει
  english_pob_choice: will bless
  chosen_korean: 복을 주실 것이니
  alternatives_korean:
  - 축복하실 것이니
  - 복 주실 것이니
  lexicon: εὐλογέω
  rationale: 미래시제의 ‘복을 주다’를 자연스러운 합쇼체로 옮기되, 예배적 문맥의 과도한 종교어투를 피했습니다.
- source_word: τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν
  english_pob_choice: Israel and Judah
  chosen_korean: 이스라엘과 유다
  alternatives_korean:
  - 이스라엘과 유다 지파
  - 이스라엘과 유다 사람들
  lexicon: 고유명사
  rationale: 원문의 병렬 고유명사를 그대로 유지해 민족/언약적 대상을 드러냈습니다.
- source_word: βασιλεύειν
  english_pob_choice: to reign
  chosen_korean: 다스리도록
  alternatives_korean:
  - 통치하도록
  - 왕으로 군림하도록
  lexicon: βασιλεύω
  rationale: ‘왕권적 통치’를 뜻하지만 한국어에서는 동사 ‘다스리다’가 가장 직접적이며, 문맥상 목적절로 자연스럽게 연결됩니다.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  english_pob_choice: before all the people
  chosen_korean: 온 백성 앞에서
  alternatives_korean:
  - 모든 백성 앞에서
  - 온 백성 면전에서
  lexicon: ἐνώπιον + λαός
  rationale: ‘면전’보다 현대 한국어에서 덜 경직된 ‘앞에서’가 적절하며, ‘παντὸς τοῦ λαοῦ’의 전체성을 ‘온 백성’으로 살렸습니다.
theological_decisions:
- issue: Κύριος의 번역
  chosen_reading: 주
  alternative_readings:
  - 주님
  - 하나님
  rationale: 본문의 Κύριος는 야훼 표기까지 요구되는 명시적 인용 구문이 아니라, 서술문 안의 주격 칭호이므로 간결한 ‘주’로 옮겼습니다.
  doctrine_reference: 언약적 주권 호칭
- issue: ἐξελέξατο의 주체와 목적
  chosen_reading: 주께서 … 선택하셨기 때문입니다
  alternative_readings:
  - 주께서 … 택하셨기 때문입니다
  - 주께서 … 세우셨기 때문입니다
  rationale: 문맥상 ‘선택하다’가 원문의 ἐκλέγομαι를 가장 직접적으로 반영하며, 뒤의 βασιλεύειν과 함께 ‘다스리도록 선택’이라는 목적을 분명히 보여 줍니다.
  doctrine_reference: 선택과 왕권의 결합
