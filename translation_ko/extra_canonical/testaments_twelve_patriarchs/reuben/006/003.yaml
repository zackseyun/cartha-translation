id: T12P.REU.6.3
reference: Testament of Reuben 6:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/003.yaml
  text: For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a destructive disgrace of Beliar and an everlasting reproach.
translation:
  language: ko
  text: 끊임없는 만남은, 비록 그 불경한 행위가 실제로 실행되지 않더라도, 그들에게는 여전히 고치지 못할 병이며, 우리에게는 벨리아르의 파멸적인 수치와 영원한 치욕입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἱ γὰρ συνεχεῖς συντυχίαι
  english_pob_choice: For constant encounters
  chosen_korean: 끊임없는 만남은
  alternatives_korean:
  - 지속적인 접촉은
  - 잦은 만남은
  lexicon: συντυχίαι
  rationale: 단순한 ‘만남’보다 반복적·지속적 접촉의 위험성을 드러내기 위해 ‘끊임없는 만남’으로 옮겼습니다.
- source_word: τὸ ἀσέβημα
  english_pob_choice: the ungodly act
  chosen_korean: 그 불경한 행위
  alternatives_korean:
  - 그 경건치 않은 행위
  - 그 불의한 행동
  lexicon: ἀσέβημα
  rationale: 행위의 성격을 직접 드러내는 ‘불경한 행위’가 본문의 도덕·종교적 뉘앙스를 가장 잘 반영합니다.
- source_word: νόσος ἀνίατος
  english_pob_choice: an incurable disease
  chosen_korean: 고치지 못할 병
  alternatives_korean:
  - 불치병
  - 낫지 않는 병
  lexicon: νόσος / ἀνίατος
  rationale: 의학적 비유를 자연스럽게 살리면서도 문맥의 경고성을 유지하기 위해 평이한 합쇼체 표현을 택했습니다.
- source_word: εἰς ὄλεθρον
  english_pob_choice: destructive
  chosen_korean: 파멸적인
  alternatives_korean:
  - 멸망으로 가는
  - 파괴적인
  lexicon: ὄλεθρος
  rationale: 전치사구가 결과를 나타내므로 ‘파멸적인’이 ‘destructive’의 직접성을 한국어로 가장 간명하게 옮깁니다.
- source_word: ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον
  english_pob_choice: disgrace of Beliar and an everlasting reproach
  chosen_korean: 벨리아르의 파멸적인 수치와 영원한 치욕
  alternatives_korean:
  - 벨리아르의 수치와 영원한 수치
  - 벨리아르의 치욕과 영원한 수치
  lexicon: Βελίαρ / ὄνειδος / αἰώνιον
  rationale: ‘ὄνειδος’를 단순한 ‘수치’보다 더 강한 ‘치욕’까지 포함해 드러내고, ‘αἰώνιον’은 종말론적 지속성을 살려 ‘영원한’으로 옮겼습니다.
theological_decisions:
- issue: Βελίαρ의 고유명사 처리
  chosen_reading: 본문의 인격화된 악의 존재를 ‘벨리아르’로 음역해 유지했습니다.
  alternative_readings:
  - 벨리알
  - 사탄
  rationale: 원문 고유명사 Βελίαρ를 지우지 않고 보존해야 본문의 악의 인격화와 유대계 제2성전기 표현을 그대로 드러낼 수 있습니다.
  doctrine_reference: 제2성전기 악령/악의 인격화 전통
