revisions:
- from: 그리고 그 여자들에게도 남자들과 어울리지 말라고 명하십시오. 그래야 그들 역시 생각에서 깨끗해질 것입니다.[a]
  to: 또 그 여자들에게도 남자들과 어울리지 말라고 명령하여, 그들 역시 생각을 깨끗하게 지키도록 하십시오.
  rationale: κἀκείνας의 지시성을 ‘그 여자들’로, συνδιάζειν의 일반적 교제를 ‘어울리다’로 유지했습니다. ἵνα καθαρεύωσι τῇ διανοίᾳ는 목적 관계와 지속적 정결의 뉘앙스를 살려 ‘생각을 깨끗하게 지키도록’으로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 명령과 대상(‘그 여자들’), 남성과 어울리지 말라는 금지, 그리고 내적·지성적 정결이라는 뜻은 대체로 충실합니다. 그러나 ἵνα + 접속법은 목적을 나타내며, καθαρεύωσι는 ‘깨끗해질 것입니다’라는 미래의 변화 예측보다 정결한 상태를 유지하거나 지키는 뜻으로 옮기는 것이 더 적절합니다.
  naturalness: ‘생각에서 깨끗해질 것입니다’는 현대 한국어에서 다소 부자연스럽고, 목적절의 기능도 충분히 드러나지 않습니다. ‘생각을 깨끗하게 지키도록’이 자연스럽고 원문의 목적 관계를 보존합니다.
  terminology: διάνοια는 여기서 ‘생각’으로 옮길 수 있으며, ‘생각을 깨끗하게 지키다’는 내적 정결을 불필요하게 교리화하지 않고 전달합니다. ‘여자들’과 ‘남자들’은 원문의 성별 대조를 그대로 반영합니다.
  issues:
  - severity: medium
    issue: 목적절과 동사상의 표현
    rationale: ‘그래야 … 깨끗해질 것입니다’는 ἵνα의 목적을 결과 예측으로 바꾸고, 현재 접속법 καθαρεύωσι를 일회적 변화처럼 들리는 ‘깨끗해지다’로 옮깁니다. 정결을 지키는 목적을 나타내도록 고치는 것이 안전합니다.
  revised_text: 또 그 여자들에게도 남자들과 어울리지 말라고 명령하여, 그들 역시 생각을 깨끗하게 지키도록 하십시오.
