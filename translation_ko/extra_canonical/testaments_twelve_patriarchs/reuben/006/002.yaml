  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Κἀκείνας⁸ δὲ⁹ ἐντέλλεσθε¹⁰ μὴ συνδιάζειν¹¹ τοῖς ἀνδράσιν¹², ἵνα καὶ αὐταὶ καθαρεύωσι¹³ τῇ διανοίᾳ¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/002.yaml
  text: And command those women likewise not to associate with men, so that they too may be pure in mind.
translation:
  language: ko
  text: 그리고 그 여자들에게도 남자들과 어울리지 말라고 명하십시오. 그래야 그들 역시 생각에서 깨끗해질 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκείνας
  english_pob_choice: those women
  chosen_korean: 그 여자들에게도
  alternatives_korean:
  - 그 여자들도
  - 그 여성들에게도
  lexicon: κἀκείνας
  rationale: 지시대명사 ἐκείνας의 뉘앙스를 살려 단순한 복수 명사보다 ‘그 여자들’로 특정 대상을 가리키되, 문맥상 ‘에게도’로 앞절과의 병렬을 분명히 했습니다.
- source_word: ἐντέλλεσθε
  english_pob_choice: command
  chosen_korean: 명하십시오
  alternatives_korean:
  - 명하시오
  - 지시하십시오
  lexicon: ἐντέλλομαι
  rationale: 명령 동사로서의 직접성을 살려 합쇼체 명령형으로 옮겼습니다.
- source_word: μὴ συνδιάζειν
  english_pob_choice: not to associate with
  chosen_korean: 남자들과 어울리지 말라고
  alternatives_korean:
  - 남자들과 함께 지내지 말라고
  - 남자들과 교제하지 말라고
  lexicon: συνδιάζω
  rationale: 본문이 요구하는 금지는 ‘함께 어울리다/지내다’의 관계적 동참을 가리키므로, 과도한 해석 없이 자연스러운 현대 한국어로 옮겼습니다.
- source_word: καθαρεύωσι τῇ διανοίᾳ
  english_pob_choice: be pure in mind
  chosen_korean: 생각에서 깨끗해질 것입니다
  alternatives_korean:
  - 마음에서 깨끗해질 것입니다
  - 생각이 깨끗해질 것입니다
  lexicon: καθαρεύω + διάνοια
  rationale: διάνοια를 단순 정서의 ‘마음’보다 인지적·사유적 영역인 ‘생각’으로 살렸고, καθαρεύωσι의 결과 상태를 동사적으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 도덕적 순결의 범위
  chosen_reading: ‘생각에서 깨끗해질 것입니다’로 옮겨, 육체적 접촉 자체보다 정신적·내적 순결을 강조했습니다.
  alternative_readings:
  - ‘마음이 깨끗해질 것입니다’
  - ‘사고가 깨끗해질 것입니다’
  rationale: 원문이 τῇ διανοίᾳ를 사용하므로 단순한 외적 행위 규제보다 내적 인식의 순결을 강조하는 쪽이 더 직접적입니다.
  doctrine_reference: 성결/정결의 내적 차원
