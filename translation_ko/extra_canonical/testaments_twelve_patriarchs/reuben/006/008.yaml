    rationale: 원문 대괄호 부분은 ‘대제사장 메시아, 곧 주께서 말씀하신 이의’라는 속격구로 전승되어, 앞의 ‘때들의 완성’에 어떻게 연결되는지가 압축적입니다. ‘곧’과 별도의 종결구를 보태면 원문의 불확실한 연결을 해석적으로 확정합니다.
