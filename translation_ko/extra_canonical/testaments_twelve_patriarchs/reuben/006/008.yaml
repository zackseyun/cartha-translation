  source_fidelity: 현 초안은 τελειώσεως χρόνων을 ‘때가 완전히 끝날’로 비교적 잘 옮겼으나, 복수 χρόνοι를 단수 ‘때’로 바꾸었고, 대괄호 안에 원문에 없는 해설 접속어 ‘곧’과 반복된 ‘~까지’를 넣어 괄호 구절의 불완전하고 논쟁적인 문법적 연결을 과도하게 매끈하게 만들었습니다. 대괄호는 원문처럼 보존해야 합니다.
  naturalness: ‘때들이 완성될 때까지’는 약간 문어적이지만 고대 문헌의 압축된 종말론적 표현에 적합하며, ‘때가 완전히 끝날’보다 τελείωσις의 명사적 ‘완성’을 더 직접적으로 드러냅니다. 문장 파편이라는 원문의 형태도 유지됩니다.
