  text: until the completion of the times [of the high priest Messiah, of whom the Lord spoke].
translation:
  language: ko
  text: 때들이 완성될 때까지[주께서 말씀하신 대제사장 메시아의].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως τελειώσεως χρόνων
  english_pob_choice: until the completion of the times
  chosen_korean: “때가 완전히 끝날 때까지”
  alternatives_korean:
  - “시간들의 완성 때까지”
  - “시대가 끝날 때까지”
  lexicon: ἕως + τελείωσις + χρόνος
  rationale: ἕως는 종결 시점을 나타내므로 ‘~까지’로 옮기고, τελειώσεως χρόνων은 단순한 경과가 아니라 정해진 때의 ‘완전한 마침’이라는 뉘앙스를 살려 ‘때가 완전히 끝날’로 표현했습니다.
- source_word: ἀρχιερέως
  english_pob_choice: of the high priest
  chosen_korean: “대제사장”
  alternatives_korean:
  - “큰 제사장”
  - “대사제”
  lexicon: ἀρχιερεύς
  rationale: 공적 직분을 가리키는 표준적 한국어로 ‘대제사장’을 택해, 직분명 자체가 분명히 드러나도록 했습니다.
- source_word: χριστοῦ
  english_pob_choice: Messiah
  chosen_korean: “메시아”
  alternatives_korean:
  - “그리스도”
  - “기름부음 받은 이”
  lexicon: χριστός
  rationale: POB의 일관된 용례에 따라 титular χριστός는 ‘메시아’로 옮겨, 후대 교회 용어보다 원문이 지닌 칭호성을 보존했습니다.
- source_word: ὃν εἶπε Κύριος
  english_pob_choice: of whom the Lord spoke
  chosen_korean: “주께서 말씀하신”
  alternatives_korean:
  - “주께서 언급하신”
  - “주께서 말씀하신 바 있는”
  lexicon: Κύριος
  rationale: 직역에 가깝게 유지하되, 한국어에서 자연스러운 관형절로 다듬었습니다. 여기서는 인용된 야훼 표기를 본문에 직접 넣기보다, 헬라어의 Κύριος를 ‘주’로 옮겨 문맥의 인용성을 살렸습니다.
theological_decisions:
- issue: 브래킷으로 표시된 삽입 구절의 처리
  chosen_reading: 본문 안에 대괄호를 유지해 ‘대제사장 메시아의 때’가 전승상 부가/주석적 구절임을 드러냈습니다.
  alternative_readings:
  - 대괄호 없이 매끈하게 통합하기
  - 각주로만 처리하기
  rationale: 원문과 영어 POB 모두가 대괄호 구절을 유지하므로, 한국어도 이를 보존해 텍스트 층위의 불확실성을 가리지 않도록 했습니다.
  doctrine_reference: Textual transparency / source criticism
