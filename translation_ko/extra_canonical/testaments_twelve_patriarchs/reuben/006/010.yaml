  text: And draw near to Levi in humility of your heart, so that you may receive a blessing from his mouth.
translation:
  language: ko
  text: 그리고 겸손한 마음으로 레위에게 가까이 가십시오. 그러면 그의 입에서 복을 받게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσατε
  english_pob_choice: draw near
  chosen_korean: 가까이 가십시오
  alternatives_korean:
  - 다가가십시오
  - 가까이 나아가십시오
  lexicon: ἐγγίζω
  rationale: 초대/권면의 동작을 자연스럽게 살리면서도, 원문의 접근 의미를 직접적으로 반영했습니다.
- source_word: ἐν ταπεινώσει καρδίας Γὑμῶν
  english_pob_choice: in humility of your heart
  chosen_korean: 겸손한 마음으로
  alternatives_korean:
  - 여러분의 마음의 겸손으로
  - 마음의 겸손 가운데
  lexicon: ταπείνωσις
  rationale: ‘너희의’가 포함된 소유관계를 한국어 관용으로 자연스럽게 압축하되, 내적 태도라는 뜻을 유지했습니다.
- source_word: δέξησθε εὐλογίαν
  english_pob_choice: receive a blessing
  chosen_korean: 복을 받게 될 것입니다
  alternatives_korean:
  - 복을 받으십시오
  - 복을 받게 됩니다
  lexicon: εὐλογία
  rationale: 미래적 결과를 자연스럽게 옮기면서도, 단순한 감정적 축복이 아니라 실제로 ‘받는’ 복이라는 동사를 살렸습니다.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  english_pob_choice: from his mouth
  chosen_korean: 그의 입에서
  alternatives_korean:
  - 그 입으로부터
  - 그의 입으로
  lexicon: στόμα
  rationale: 축복이 말로 선포된다는 점을 보존하기 위해 직역에 가까운 표현을 택했습니다.
theological_decisions:
- issue: 레위에게 가까이 가라는 권면의 어조
  chosen_reading: 직접 명령형으로 살려, 공동체가 레위를 존중하며 접근하라는 권면으로 읽었습니다.
  alternative_readings:
  - 완곡한 초청문으로 처리하기
  - 설명적 문장으로 풀어쓰기
  rationale: 원문 ἐγγίσατε는 단순한 정보 전달이 아니라 행동을 요구하는 권면이므로, 한국어에서도 명령형의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 본문 의미 보존 및 수사 구조
