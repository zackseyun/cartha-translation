  text: For sexual immorality has within itself neither understanding nor godliness, and every jealousy dwells in its desire.
translation:
  language: ko
  text: 음행은 그 자체 안에 분별도 경건도 없으며, 모든 질투는 그 욕망 안에 거합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  english_pob_choice: sexual immorality
  chosen_korean: 음행
  alternatives_korean:
  - 성적 부도덕
  - 성적 불순행위
  lexicon: πορνεία
  rationale: 이 문맥은 성적 방종을 가리키는 직접적 비난이므로, 의미를 좁히지 않으면서도 한국어 성서어휘로 익숙한 ‘음행’을 택했습니다.
- source_word: σύνεσιν
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 분별
  - 깨달음
  lexicon: σύνεσις
  rationale: 대조 구조에서 내적 판단력의 결여를 말하므로, 추상적이지만 자연스러운 ‘이해’로 옮겼습니다.
- source_word: εὐσέβειαν
  english_pob_choice: godliness
  chosen_korean: 경건함
  alternatives_korean:
  - 경건
  - 하나님을 경외함
  lexicon: εὐσέβεια
  rationale: 개정된 POB의 ‘godliness’를 직접 반영하되, 한국어 문장에서는 명사형 ‘경건함’이 가장 자연스럽습니다.
- source_word: ζῆλος κατοικεῖ ἐν τῇ ἐπιθυμίᾳ αὐτῆς
  english_pob_choice: every jealousy dwells in its desire
  chosen_korean: 모든 질투는 그 욕망 안에 거합니다
  alternatives_korean:
  - 모든 시기는 그 욕망 속에 삽니다
  - 모든 질투가 그 욕망 안에 머뭅니다
  lexicon: ζῆλος / ἐπιθυμία
  rationale: ζῆλος는 문맥상 경쟁적 질투를 뜻하므로 ‘질투’로 두고, κατοικεῖ는 지속적 내재를 살려 ‘거합니다’로 옮겼습니다.
theological_decisions:
- issue: εὐσέβεια의 한국어 신학 어휘 선택
  chosen_reading: ‘경건함’으로 번역해 성품과 실천을 함께 포괄했습니다.
  alternative_readings:
  - 하나님을 경외함
  - 경건
  rationale: 원문은 예배적 태도와 삶의 경건을 함께 포함하는 일반 명사이며, 문맥상 ‘godliness’를 과도하게 해설하지 않는 것이 적절합니다.
  doctrine_reference: 신약의 εὐσέβεια 용례(딤전 4:7-8 등)
