lexical_decisions:
- source_word: Θεὸς
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  lexicon: Θεός
  rationale: 이 문맥의 주어는 명시적으로 하나님이므로 한국어 성경 관행에 맞게 ‘하나님’으로 옮겼습니다.
- source_word: ἐκδίκησιν
  english_pob_choice: execute vengeance
  chosen_korean: 보복하실 것입니다
  alternatives_korean:
  - 원수를 갚으실 것입니다
  - 징벌하실 것입니다
  lexicon: ἐκδίκησις
  rationale: 단순한 처벌보다 ‘원한/악행에 대한 보응’의 강한 의미를 살려, 직접적이고 자연스러운 ‘보복’으로 옮겼습니다.
