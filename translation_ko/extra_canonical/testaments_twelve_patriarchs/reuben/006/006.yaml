review_pass:
  verdict: revise
  source_fidelity: 헬라어 γάρ는 앞말에 대한 이유·설명을 나타내므로, 접속사 ‘그러므로’(결론)는 원문의 논리 관계를 바꿉니다. 또한 ἐκδίκησιν ποιήσει αὐτῶν은 ‘그들에게 보복/응보를 행하실 것이다’라는 뜻이며, 초안의 ‘그들에게 보복하실’은 이를 적절히 반영합니다. θανάτῳ πονηρῷ는 ‘악한 죽음으로’라는 표현으로 보존할 수 있습니다.
  naturalness: ‘그러므로’만 ‘이는’으로 고치면 현대 표준어 합쇼체로 자연스럽습니다. ‘악한 죽음을 맞이할 것입니다’도 이해 가능하나, ‘악한 죽음으로 죽을 것입니다’가 원문의 동사와 여격 표현을 더 직접적으로 반영합니다.
  terminology: ‘하나님’은 본 작업의 한국어 성경 관행과 일치합니다. ‘보복’은 ἐκδίκησις의 응보·복수 의미를 유지합니다. πονηρός의 부정적·도덕적 색채를 성급히 ‘비참한’ 등으로 해석하지 않고 ‘악한’으로 남깁니다.
  issues:
  - severity: medium
    issue: γάρ를 ‘그러므로’로 번역함
    rationale: γάρ는 일반적으로 이유 또는 설명을 제시하는 접속사인데, ‘그러므로’는 결과를 이끄는 접속사입니다. 문맥상 논리 방향을 보존하려면 ‘이는’ 또는 ‘왜냐하면’이 적절합니다.
  revised_text: 이는 하나님께서 그들에게 보복하실 것이나, 여러분은 악한 죽음으로 죽을 것이기 때문입니다.
