  - 악독한 죽음
  lexicon: πονηρός
  rationale: 형용사 πονηρός의 도덕적·부정적 뉘앙스를 유지하면서도, 한국어로는 죽음의 성격을 드러내는 ‘악한 죽음’이 가장 직역에 가깝습니다.
theological_decisions:
- issue: 하나님의 보복 표현
  chosen_reading: 하나님께서 직접 ‘보복’하신다고 번역해, 원문의 심판 선언성을 약화시키지 않았습니다.
  alternative_readings:
  - 하나님께서는 그들을 벌하실 것입니다
  - 하나님께서는 원수를 갚으실 것입니다
  rationale: 본문은 단순한 결과 예고가 아니라 신적 응보를 분명히 말하므로, 완곡한 표현보다 직접적 심판 언어를 유지했습니다.
  doctrine_reference: 신적 심판과 응보
