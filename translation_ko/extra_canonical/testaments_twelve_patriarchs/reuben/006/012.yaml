id: T12P.REU.6.12
reference: Testament of Reuben 6:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/012.yaml
  text: And bow down to his offspring, because for your sake it will die in visible and invisible wars, and among you there will be an eternal king.
translation:
  language: ko
  text: 그리고 그의 후손에게 절하십시오. 이는 여러분을 위해 그 후손이 보이는 전쟁과 보이지 않는 전쟁에서 죽을 것이기 때문입니다. 그리고 여러분 가운데 영원한 왕이 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκυνήσατε
  english_pob_choice: bow down to
  chosen_korean: 절하십시오
  alternatives_korean:
  - 엎드려 경배하십시오
  - 경배하십시오
  - 무릎을 꿇으십시오
  lexicon: proskyneō
  rationale: 제의적·복종적 동작을 함께 담는 동사로, 한국어에서는 예배적 뉘앙스를 살리되 과도한 해석을 피하는 ‘절하다’가 가장 직접적입니다.
- source_word: τὸ σπέρμα αὐτοῦ
  english_pob_choice: his offspring
  chosen_korean: 그의 후손
  alternatives_korean:
  - 그의 씨
  - 그의 자손
  - 그의 자녀
  lexicon: sperma
  rationale: σπέρμα의 집합적 의미를 살리면서도 ‘씨’보다 현대 한국어에서 자연스러운 ‘후손’으로 옮겼습니다.
- source_word: ὁρατοῖς καὶ ἀοράτοις
  english_pob_choice: visible and invisible
  chosen_korean: 보이는 전쟁과 보이지 않는 전쟁
  alternatives_korean:
  - 보이는 것과 보이지 않는 것
  - 가시적인 전쟁과 비가시적인 전쟁
  - 눈에 보이는 전쟁과 눈에 보이지 않는 전쟁
  lexicon: horatos / aoratos
  rationale: 문맥상 앞의 ‘wars’에 걸리는 형용사이므로 전쟁을 반복해 한국어 의미 연결을 분명하게 했습니다.
- source_word: βασιλεὺς αἰώνιος
  english_pob_choice: an eternal king
  chosen_korean: 영원한 왕
  alternatives_korean:
  - 영존하는 왕
  - 영원하신 왕
  - 세세무궁한 왕
  lexicon: aiōnios
  rationale: αἰώνιος의 지속성을 직설적으로 살리되, 한국어 독자에게 자연스러운 ‘영원한’으로 번역했습니다.
theological_decisions:
- issue: ‘그가 죽을 것’의 주체와 문맥상 선행사
  chosen_reading: ‘그가’는 앞의 ‘그의 후손’을 가리키며, 집합적 단수 표현을 유지했습니다.
  alternative_readings:
  - ‘그 씨’ 또는 ‘그 자손들’로 풀어 집합성을 명시하는 방법
  - 메시아적 예언으로 해석해 주어를 다른 방식으로 조정하는 방법
  rationale: 원문과 POB 영어는 συλλογ적으로 ‘offspring’/‘seed’를 단수 주어로 다루므로, 한국어도 동일한 긴장을 보존하는 것이 가장 충실합니다.
  doctrine_reference: 집합적 단수 표지 유지
- issue: ‘절하십시오’의 종교적 강도
  chosen_reading: 단순한 존경 표현보다 강한 복종·예배의 동작을 담는 ‘절하십시오’를 택했습니다.
  alternative_readings:
  - ‘경배하십시오’
  - ‘무릎을 꿇으십시오’
  rationale: 원문 προσκυνέω는 단순 예의보다 더 강한 몸의 굴복을 포함하므로, 한국어에서 그 강도를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 제의적 경배 동작
