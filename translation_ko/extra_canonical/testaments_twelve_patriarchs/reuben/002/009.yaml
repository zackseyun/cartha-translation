id: T12P.REU.2.9
reference: Testament of Reuben 2:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο *ἔσχατόν ἐστι τῆς κτίσεως³¹ καὶ πρῶτον τῆς νεότητος, ὅτι *ἀγνοίας πεπλήρωται³², καὶ αὕτη τὸν νεώτερον³³ ὁδηγεῖ ὥσπερ³⁴ τυφλὸν ἐπὶ βόθρον καὶ ὡς κτῆνος ἐπὶ κρημνόν³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/009.yaml
  text: Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the younger man like a blind man into a pit and like an animal over a cliff.
translation:
  language: ko
  text: 그러므로 이 영은 창조에서는 마지막이고 청년기에서는 첫째입니다. 이 영은 무지로 가득 차 있으며, 눈먼 사람을 구덩이로, 짐승을 낭떠러지로 이끌듯이 더 젊은 사람을 이끕니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατόν ἐστι τῆς κτίσεως
  english_pob_choice: is last in creation
  chosen_korean: 창조에서는 마지막
  alternatives_korean:
  - 창조의 마지막
  - 창조에서 가장 뒤
  lexicon: ἔσχατος, κτίσις
  rationale: ‘first/last’의 대조를 살리되, 한국어에서는 ‘창조의 마지막’보다 서술형인 ‘창조에서는 마지막’이 원문의 상태 진술을 더 자연스럽게 드러냅니다.
- source_word: πρῶτον τῆς νεότητος
  english_pob_choice: first in youth
  chosen_korean: 청년기에서는 첫째
  alternatives_korean:
  - 젊음에서는 첫째
  - 청년에게는 첫째
  lexicon: πρῶτος, νεότης
  rationale: νεότης를 단순한 ‘젊은 사람’보다 기간/시기로 보는 ‘청년기’로 옮겨, 앞의 ‘창조’와 평행한 영역 표시를 살렸습니다.
- source_word: τὸν νεώτερον
  english_pob_choice: the younger man
  chosen_korean: 젊은 사람
  alternatives_korean:
  - 더 젊은 사람
  - 젊은 자
  lexicon: νεώτερος
  rationale: 개정된 POB의 ‘the younger man’을 반영하되, 한국어에서는 비교급 의미를 자연스럽게 드러내는 ‘젊은 사람’이 가장 무난합니다.
- source_word: βόθρον ... κρημνόν
  english_pob_choice: into a pit ... over a cliff
  chosen_korean: 구덩이 ... 절벽
  alternatives_korean:
  - 웅덩이 ... 낭떠러지
  - 구덩이 ... 낭떠러지
  lexicon: βόθρος, κρημνός
  rationale: 두 위험 지점을 한국어의 대표적 지형어로 옮겨, ‘blind man/animal’에 따른 추락의 이미지를 분명히 했습니다.
theological_decisions:
- issue: 이 구절의 ‘영’(πνεῦμα) 지칭을 어떻게 다룰지
  chosen_reading: 이 영
  alternative_readings:
  - 그 영
  - 이 정신
  rationale: 문맥상 특정한 악한 성향/영향을 가리키는 대명사적 사용이므로, 보편적이고 중립적인 ‘이 영’이 원문 긴장에 가장 가깝습니다.
  doctrine_reference: 성향/영의 의인화 표현을 지나치게 교리화하지 않고 본문 수준에서 유지
