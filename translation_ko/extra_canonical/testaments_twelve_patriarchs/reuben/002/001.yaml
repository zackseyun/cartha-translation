id: T12P.REU.2.1
reference: Testament of Reuben 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ νῦν¹ ἀκούσατέ μου, τέκνα μου², ἃ³ εἶδον περὶ τῶν ἑπτὰ⁴ πνευμάτων τῆς πλάνης ἐν τῇ μετανοίᾳ μου⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/001.yaml
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance.
  footnotes:
  - marker: a
    text: Or 'spirits of error' or 'spirits of delusion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이제, 내 자녀들아, 내가 회개 가운데 본 것들에 관하여 내 말을 들으십시오. 그것들은 곧 속임의 일곱 영입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνον
  rationale: 직접 호칭으로서 친밀한 부름을 살리되, 현대 한국어에서 자연스럽고 품위 있는 ‘자녀들아’로 옮겼습니다.
- source_word: ἀκούσατέ μου
  english_pob_choice: hear me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 내 말을 들으라
  - 내 말을 들으세요
  lexicon: ἀκούω
  rationale: 명령형의 요청을 합쇼체로 표현해 직접 호소의 힘을 유지했습니다.
- source_word: τὰ ἑπτὰ πνεύματα τῆς πλάνης
  english_pob_choice: the seven spirits of deceit
  chosen_korean: 속임의 일곱 영
  alternatives_korean:
  - 속임의 일곱 영들
  - 미혹의 일곱 영
  - 오류의 일곱 영
  lexicon: πνεῦμα; πλάνη
  rationale: POB의 핵심 선택을 따라 ‘deceit’를 ‘속임’으로 두어 주체적 기만의 뉘앙스를 살렸습니다.
- source_word: ἐν τῇ μετανοίᾳ μου
  english_pob_choice: in my repentance
  chosen_korean: 회개 가운데
  alternatives_korean:
  - 내 회개 속에서
  - 내 회개 중에
  lexicon: μετάνοια
  rationale: 회개라는 사건/상태 안에서 본 것이라는 의미를 자연스럽게 옮기되, 소유격 ‘my’를 문맥상 ‘내’로 분명히 반영했습니다.
theological_decisions:
- issue: πνεύματα τῆς πλάνης의 해석 범위
  chosen_reading: ‘속임의 일곱 영’으로 직역하여, 인격적/영적 존재를 가리키는 표현으로 열어 두었습니다.
  alternative_readings:
  - ‘오류의 일곱 영’
  - ‘미혹의 일곱 영’
  rationale: 원문은 ‘deceit’/‘error’/‘delusion’이 모두 가능한 범위를 가지므로, 본문이 실제로 가리키는 영적 세력의 성격을 지나치게 단정하지 않으면서도 핵심 의미를 유지했습니다.
  doctrine_reference: 영적 존재 표현의 의미 범위 유지
- issue: μετανοίᾳ μου의 관계
  chosen_reading: ‘회개 가운데’로 옮겨, 회개라는 내적 전환의 상태 속에서의 체험임을 드러냈습니다.
  alternative_readings:
  - ‘내 회개 중에’
  - ‘내가 회개할 때에’
  rationale: 원문의 전치사구가 단순한 시간표시 이상으로 회개 상태를 배경으로 한 환시를 말하므로, 그 관계성을 살렸습니다.
  doctrine_reference: 회개-계시 관계의 서술
