    rationale: ἃ εἶδον περὶ τῶν ἑπτὰ πνευμάτων τῆς πλάνης는 ‘속임의 일곱 영에 관하여 내가 본 것’이라는 하나의 내용을 이룹니다. 초안의 ‘그것들은 곧’은 원문에 없는 동격·설명 관계를 만들고, 무엇을 보았는지의 구조를 바꿉니다.
  - severity: medium
    issue: ‘회개 가운데’에 소유격 ‘내’가 누락됨
    rationale: τῇ μετανοίᾳ μου의 μου는 명시적으로 반영하는 것이 안전합니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 놓여 핵심어에 직접 연결되지 않음
    rationale: πλάνης의 어휘 대안 각주는 ‘속임’에 바로 붙여야 그 적용 범위가 분명합니다.
  revised_text: 이제 내 자녀들아, 내가 내 회개 가운데 속임[a]의 일곱 영에 관하여 본 것을 들으십시오.
