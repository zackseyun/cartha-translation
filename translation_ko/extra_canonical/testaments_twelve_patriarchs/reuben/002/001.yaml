revisions:
- from: 그리고 이제, 내 자녀들아, 내가 회개 가운데 본 것들에 관하여 내 말을 들으십시오. 그것들은 곧 속임의 일곱 영입니다.[a]
  to: 이제 내 자녀들아, 내가 내 회개 가운데 속임[a]의 일곱 영에 관하여 본 것을 들으십시오.
  rationale: 원문의 어순과 관계를 따라 ‘내가 … 일곱 영에 관하여 본 것’을 ‘들으십시오’의 목적어로 유지했습니다. ‘내 회개 가운데’는 ἐν τῇ μετανοίᾳ μου를 직역적으로 반영하면서도 한국어 문장 안에서 자연스럽게 연결됩니다. 원문과 영어 POB의 의미 범위를 보존하기 위해 πλάνης의 대안은 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘일곱 영’을 앞 문장의 목적 내용에서 분리하여 ‘그것들은’이라고 받는데, 원문의 관계대명사 ἃ(‘내가 본 것’)는 ‘속임의 일곱 영에 관하여’ 본 내용을 가리킵니다. 또한 ἐν τῇ μετανοίᾳ μου는 ‘내 회개 가운데/회개하는 동안’으로 ‘내’가 명시되어야 합니다.
  naturalness: ‘내 자녀들아’와 합쇼체 명령 ‘들으십시오’는 자연스럽고 본문의 유언적 호소에 알맞습니다. 다만 원문의 수식 관계를 한 문장 안에서 유지하는 편이 더 명료하고 자연스럽습니다.
  terminology: πλάνης는 ‘속임’ 외에도 ‘오류’, ‘미혹’ 또는 ‘망상/미혹됨’의 범위를 지닙니다. 본문에서는 영어 POB의 ‘deceit’ 선택을 따라 ‘속임’으로 옮기고, 각주에서 대안을 보존합니다. πνεύματα는 해석을 덧붙이지 않고 ‘영’으로 유지합니다.
  issues:
  - severity: high
