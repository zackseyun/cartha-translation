  text: And seven other spirits were given to him at creation, so that every work of man might be in them.
translation:
  language: ko
  text: 그리고 창조 때에 또 다른 일곱 영이 그에게 주어졌습니다. 그것은 사람의 모든 일이 그 영들 안에 있게 하시려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἕτερα ἑπτὰ πνεύματα
  english_pob_choice: And seven other spirits
  chosen_korean: 또 다른 일곱 영
  alternatives_korean:
  - 일곱 다른 영들
  - 또 일곱 영들
  lexicon: πνεύματα → 영
  rationale: πνεύματα는 여기서 초월적 존재로 보이는 복수 명사이므로, 자연스러운 한국어로 ‘영’이라고 옮기되 수량과 차이를 살려 ‘또 다른 일곱 영’으로 처리했습니다.
- source_word: ἐδόθη
  english_pob_choice: were given
  chosen_korean: 주어졌습니다
  alternatives_korean:
  - 주어졌습니다
  - 받았습니다
  lexicon: δίδωμι → 주다
  rationale: 수동형의 주어짐을 그대로 살려, 누군가에 의해 부여된 상태를 분명히 했습니다.
- source_word: ἐπὶ τῆς κτίσεως
  english_pob_choice: at creation
  chosen_korean: 창조 때에
  alternatives_korean:
  - 창조에서
  - 창조 시에
  lexicon: κτίσις → 창조
  rationale: 전치사 ἐπί의 시간적 용법을 반영해 사건의 시점을 자연스럽게 드러냈습니다.
- source_word: πᾶν ἔργον ἀνθρώπου
  english_pob_choice: every work of man
  chosen_korean: 사람의 모든 행위
  alternatives_korean:
  - 사람의 모든 일
  - 인간의 모든 행위
  lexicon: ἔργον / ἄνθρωπος → 행위 / 사람
  rationale: ἔργον은 단순한 ‘일’보다 행위성에 초점이 있어 ‘행위’로 옮겼고, ἀνθρώπου는 일반 인간을 가리키므로 ‘사람’으로 풀었습니다.
theological_decisions:
- issue: ‘그에게’가 가리키는 대상
  chosen_reading: 본문 흐름대로 단수 대명사 ‘그에게’를 유지했습니다.
  alternative_readings:
  - ‘그들에게’로 의미를 풀어 쓰는 방식
  rationale: 원문과 영어 POB가 모두 단수 수동 구문을 따르므로, 지시 대상이 문맥상 분명하지 않더라도 본문 형태를 보존하는 편이 더 स्रोत-근접합니다.
  doctrine_reference: source fidelity / ambiguity preservation
