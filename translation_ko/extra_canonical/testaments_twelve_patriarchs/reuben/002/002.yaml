lexical_decisions:
- source_word: Ἑπτὰ οὖν πνεύματα
  english_pob_choice: Then seven spirits
  chosen_korean: 그러므로 일곱 영이
  alternatives_korean:
  - 그때 일곱 영이
  - 그리하여 일곱 영이
  lexicon: πνεῦμα → 영
  rationale: 영적 존재를 뜻하는 πνεύματα를 직역해 ‘영’으로 두었고, 문두 οὖν은 인과·전개를 살려 ‘그러므로’로 옮겼습니다.
- source_word: ἐδόθη κατὰ τοῦ ἀνθρώπου
  english_pob_choice: were given against man
  chosen_korean: 사람에게 주어졌으며
  alternatives_korean:
  - 사람을 향해 주어졌으며
  - 사람에 대하여 주어졌으며
  lexicon: διδωμι + κατὰ
  rationale: κατὰ τοῦ ἀνθρώπου의 대립 방향은 ‘사람에게/사람을 향해’로 자연스럽게 나타낼 수 있어, 본문 구조를 살리되 한국어 문장을 매끄럽게 만들었습니다.
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  english_pob_choice: the heads of the works of youthfulness
  chosen_korean: 젊음의 일들의 우두머리들
  alternatives_korean:
  - 젊음의 행위들의 머리들
  - 젊은 시절의 행위들의 근원들
  lexicon: κεφαλαί → 우두머리들; νεωτερισμός → 젊음/젊은 시절
  rationale: 영문 POB가 구조를 거의 그대로 유지한 점을 따라 κεφαλαί의 비유적 ‘머리들’을 ‘우두머리들’로 옮겨, 단순한 목록이 아니라 지배적 근원이라는 뉘앙스를 남겼습니다.
theological_decisions:
- issue: 일곱 영의 정체를 특정하지 않는 문제
  chosen_reading: 본문 표현을 그대로 따라 ‘일곱 영’으로 두고, 해석적 동일시를 덧붙이지 않았습니다.
  alternative_readings:
  - 일곱 영들
  - 일곱 악한 영들
  - 일곱 가지 영적 세력
  rationale: 본문 자체는 정체를 설명하지 않으므로, 해석을 앞서 주기보다 원문의 모호성을 보존하는 편이 출처 충실성에 맞습니다.
  doctrine_reference: source-grounded restraint / lexical transparency
