  lexicon: διδωμι + κατὰ
  rationale: κατὰ τοῦ ἀνθρώπου의 대립 방향은 ‘사람에게/사람을 향해’로 자연스럽게 나타낼 수 있어, 본문 구조를 살리되 한국어 문장을 매끄럽게 만들었습니다.
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  english_pob_choice: the heads of the works of youthfulness
  chosen_korean: 젊음의 일들의 우두머리들
