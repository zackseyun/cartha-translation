translation:
  language: ko
  text: 세 번째는 청각의 영입니다. 그것을 통해 가르침이 생겨납니다. 네 번째는 후각의 영입니다. 그것을 통해 공기와 숨을 끌어들이기 위한 맛들이 주어집니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 후각, 맛, 그리고 공기와 숨을 끌어들이는 것에 관한 표현은 그리스어에서 난해하며, 압축되었거나 불안정한 본문 형태를 반영할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: πνεῦμα ἀκοῆς
  english_pob_choice: the spirit of hearing
  chosen_korean: 듣는 영
  alternatives_korean:
  - 청각의 영
  - 들음의 영
  lexicon: πνεῦμα → 영; ἀκοή → 듣다/들음
  rationale: 소유격식 표현을 직역하기보다 기능을 드러내는 한국어로 옮겨, ‘듣는’이라는 현재적 성격과 ‘영’의 병치를 자연스럽게 살렸습니다.
- source_word: διδασκαλία
  english_pob_choice: instruction
  chosen_korean: 가르침
  alternatives_korean:
  - 교훈
  - 교육
  lexicon: διδασκαλία → 가르침/교훈
  rationale: 본문이 영을 통해 생겨나는 결과를 말하므로, 추상적 ‘instruction’에 대응하는 가장 직접적인 표준어로 ‘가르침’을 택했습니다.
- source_word: ὀσφρήσεως
  english_pob_choice: the spirit of smell
  chosen_korean: 냄새 맡는 영
  alternatives_korean:
  - 후각의 영
  - 맡는 영
  lexicon: ὀσμή/ὀσφράομαι 계열 → 냄새 맡다, 후각
  rationale: 형용사화된 명사구를 한국어에서 가장 자연스럽게 풀어, 감각 기관의 기능을 분명하게 드러냈습니다.
- source_word: γίνονται γεύσεις δεδομέναι εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  english_pob_choice: tastes are given for the drawing in of air and breath
  chosen_korean: 공기와 숨을 들이마시게 하는 데 필요한 맛들이 주어집니다
  alternatives_korean:
  - 공기와 숨을 끌어들이기 위한 맛들이 주어집니다
  - 공기와 숨을 당겨 들이는 데 맛들이 주어집니다
  lexicon: γεύσεις δεδομέναι / ὁλκή / ἀναπνοή → 맛들, 주어지다, 들이마시다/숨
  rationale: 영어 POB의 ‘given’을 따라 δεδομέναι의 수동성을 살리고, ὁλκή와 ἀναπνοή의 난해함을 한국어로 과도하게 해석하지 않으면서도 의미가 통하도록 옮겼습니다.
theological_decisions:
- issue: 어색하고 압축된 감각-생리 표현의 처리
  chosen_reading: 원문의 난해함을 보존하면서도, 문장 기능상 ‘가르침’과 ‘맛들’의 관계가 드러나도록 최소한으로 풀어 옮겼습니다.
  alternative_readings:
  - 더 직역하여 난해한 어순을 그대로 옮기는 방식
  - 의미를 평이하게 재구성해 감각 은유를 완화하는 방식
  rationale: 영어 POB가 이 구절의 그리스어를 압축적이고 불안정한 표현으로 주석 처리한 만큼, 한국어도 의미를 과도하게 매끈하게 만들지 않고 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 텍스트 비평 및 번역 원칙
- issue: ‘영’의 반복 유지
  chosen_reading: 두 항 모두 ‘영’을 반복해 원문의 병렬 구조를 보존했습니다.
  alternative_readings:
  - 첫 항만 ‘영’으로 두고 둘째를 생략하는 방식
  - 둘을 하나의 문장으로 합쳐 감각 목록처럼 재구성하는 방식
  rationale: πνεῦμα의 반복은 구조적 강조이므로, 한국어에서도 반복을 유지해야 대칭성이 살아납니다.
  doctrine_reference: 문학적 구조 보존
