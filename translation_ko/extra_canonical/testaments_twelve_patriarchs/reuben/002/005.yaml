id: T12P.REU.2.5
reference: Testament of Reuben 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Τρίτον πνεῦμα ἀκοῆς μεθ’ ἧς γίνεται¹⁷ διδασκαλία. Τέταρτον πνεῦμα¹⁸ ὀσφρήσεως, μεθ’ ἧς *γίνονται γεύσεις δεδομέναι¹⁹ *εἰς ὁλκὴν²⁰ ἀέρος καὶ ἀναπνοῆς²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/005.yaml
  text: The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are given for the drawing in of air and breath[c].
  footnotes:
  - marker: c
    text: The wording about smell, tastes, and the drawing in of air is difficult in Greek and may reflect a compressed or unstable textual formulation.
