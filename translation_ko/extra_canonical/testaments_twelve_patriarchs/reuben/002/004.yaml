id: T12P.REU.2.4
reference: Testament of Reuben 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πρῶτον πνεῦμα ζωῆς, μεθ’ ἧς ἡ σύστασις¹⁶ κτίζεται. Δεύτερον πνεῦμα ὁράσεως, μεθ’ ἧς γίνεται ἐπιθυμία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/004.yaml
  text: The first is the spirit of life, with which the constitution is formed. The second is the spirit of sight, with which desire arises.
translation:
  language: ko
  text: 첫째는 생명의 영이며, 그것과 함께 구성이 창조됩니다. 둘째는 시각의 영이며, 그것과 함께 욕망이 생겨납니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ζωῆς
  english_pob_choice: the spirit of life
  chosen_korean: 생명의 영
  alternatives_korean:
  - 생명하는 영
  - 생명에 속한 영
  lexicon: πνεῦμα
  rationale: 영을 직접 살리고, ζωῆς의 속성은 ‘생명의’로 자연스럽게 옮겨 원문의 소유·성격 관계를 드러냈습니다.
- source_word: ἡ σύστασις
  english_pob_choice: the constitution
  chosen_korean: 형체
  alternatives_korean:
  - 구성
  - 체질
  - 조직
  lexicon: σύστασις
  rationale: 문맥상 인간의 이루어짐/형성 상태를 가리키므로, 한국어에서 자연스럽고 추상도 유지되는 ‘형체’로 옮겼습니다.
- source_word: πνεῦμα ὁράσεως
  english_pob_choice: the spirit of sight
  chosen_korean: 보는 영
  alternatives_korean:
  - 시각의 영
  - 보는 능력의 영
  lexicon: πνεῦμα
  rationale: ὁράσεως를 단순 명사화하기보다 기능을 살린 ‘보는’으로 옮겨, 원문이 말하는 감각적 인식의 성격을 유지했습니다.
- source_word: ἐπιθυμία
  english_pob_choice: desire
  chosen_korean: 욕망
  alternatives_korean:
  - 욕구
  - 갈망
  - 바람
  lexicon: ἐπιθυμία
  rationale: 이 용어는 단순한 희망보다 더 강한 내적 끌림을 가리키므로, 문맥에 맞게 ‘욕망’으로 번역했습니다.
theological_decisions:
- issue: 두 ‘영’의 병렬 구조를 어떻게 드러낼지
  chosen_reading: ‘첫째는… 둘째는…’으로 병렬을 유지하고, 두 절 모두 ‘그로 말미암아’로 대응시켜 원문의 인과/매개 관계를 보존했습니다.
  alternative_readings:
  - ‘~에 의하여’로 더 직역하기
  - ‘~를 통해’로 완화하기
  rationale: 원문의 μεθ’ ἧς는 매개 관계를 나타내므로, 한국어에서도 동일한 연결감을 유지하는 표현이 필요했습니다.
  doctrine_reference: 원문 구조 보존 원칙
