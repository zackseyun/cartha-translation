id: T12P.REU.2.7
reference: Testament of Reuben 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ἕκτον πνεῦμα γεύσεως μεθ’ ἧς *γίνεται βρῶσις²³ *βρωμάτων τε καὶ πομάτων²⁴, καὶ ἰσχὺς ἐν αὐτῷ²⁵ κτίζεται *ὅτι ἐν βρώμασίν ἐστιν ἡ ὑπό- στασις τῆς ἰσχύος²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/007.yaml
  text: The sixth is the spirit of taste, by which eating of foods and drinks comes to be, and strength is built up in it, because in foods is the basis of strength.
translation:
  language: ko
  text: 여섯째는 맛의 영입니다. 이것으로 음식과 마실 것들을 먹는 일이 생기며, 그 안에서 힘이 세워집니다. 왜냐하면 음식들 안에 힘의 바탕이 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕκτον πνεῦμα γεύσεως
  english_pob_choice: The sixth is the spirit of taste
  chosen_korean: 여섯째는 맛의 영입니다
  alternatives_korean:
  - 여섯째는 미각의 영입니다
  - 여섯째는 맛보는 영입니다
  lexicon: πνεῦμα
  rationale: πνεῦμα를 단순히 생리적 능력으로 축소하지 않고, POB의 ‘spirit’에 맞춰 ‘영’으로 옮겼으며 γεύσεως는 문맥상 ‘맛/미각’의 뜻이므로 ‘맛의’로 자연스럽게 처리했습니다.
- source_word: γίνεται βρῶσις βρωμάτων τε καὶ πομάτων
  english_pob_choice: by which eating of foods and drinks comes to be
  chosen_korean: 이것으로 음식과 마실 것들을 먹는 일이 생기며
  alternatives_korean:
  - 이것으로 음식과 음료를 먹는 일이 생기며
  - 이것으로 먹고 마시는 일이 생기며
  lexicon: βρῶσις / βρώματα / ποτά
  rationale: βρῶσις는 ‘먹는 행위/섭식’이므로 ‘먹는 일’로 옮기고, βρωμάτων τε καὶ πομάτων은 ‘음식과 마실 것들’로 병렬 구조를 살렸습니다.
- source_word: κτίζεται
  english_pob_choice: is built up
  chosen_korean: 세워집니다
  alternatives_korean:
  - 건축됩니다
  - 형성됩니다
  - 자라납니다
  lexicon: κτίζω
  rationale: κτίζεται는 단순한 물리적 건축보다 ‘구조가 세워짐/형성됨’의 의미가 강해, 한국어에서는 자연스럽고 역동적인 ‘세워집니다’가 가장 잘 맞습니다.
- source_word: ὑπόστασις τῆς ἰσχύος
  english_pob_choice: the basis of strength
  chosen_korean: 힘의 바탕
  alternatives_korean:
  - 힘의 근거
  - 힘의 실체
  - 힘의 기초
  lexicon: ὑπόστασις
  rationale: English audit trail이 ‘substance’에서 ‘basis’로 조정된 점을 반영해, 존재론적 ‘실체’보다 원인·토대의 의미를 살리는 ‘바탕’으로 옮겼습니다.
theological_decisions:
- issue: 지혜·분별의 덕목이 아니라 여전히 인간의 감각 능력을 ‘영’으로 의인화하는 표현인지 여부
  chosen_reading: 본문의 표현을 도덕적 덕목이 아니라 감각 능력의 작용을 가리키는 의인화로 그대로 유지했습니다.
  alternative_readings:
  - ‘맛의 영’을 ‘미각의 정신적 원리’처럼 추상화하는 읽기
  rationale: 원문은 감각 경험과 신체적 양육의 관계를 설명하므로, 이를 지나치게 윤리화하거나 영성화하지 않고 그대로 반영하는 것이 문맥에 충실합니다.
  doctrine_reference: 문맥 주해; 본문 자체의 감각-신체 연관 설명
- issue: ‘힘’의 근거를 존재론적 본질로 볼지, 실제적 토대로 볼지
  chosen_reading: ‘힘의 바탕’으로 번역해 실제로 힘이 유지·세워지는 토대를 강조했습니다.
  alternative_readings:
  - 힘의 실체
  - 힘의 본질
  - 힘의 기초
  rationale: POB의 최신 audit trail이 ‘basis’를 택하고 있어, 본문의 인과적 설명을 드러내는 쪽이 더 적절합니다.
  doctrine_reference: 본문 해석상 선택
