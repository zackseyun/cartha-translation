  to: 여섯째 영은 미각의 영입니다. 이 영으로 음식과 마실 것을 섭취하는 일이 생기며, 그 영 안에서 힘이 형성됩니다. 왜냐하면 음식 안에 힘의 바탕이 있기 때문입니다.
