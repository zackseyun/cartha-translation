  source_fidelity: 원문의 열거 구조(Πέμπτον … πνεῦμα)와 ‘말의 영’ 및 γνῶσις의 ‘지식’은 대체로 충실합니다. 다만 μεθ’ ἧς는 직역하면 ‘그것과 함께/그것을 통하여’이며, 한국어에서는 선행사인 ‘말의 영’을 다시 가리키는 ‘그것으로’가 더 분명하고 자연스럽습니다. γίνομαι의 발생 의미도 ‘생깁니다’로 보존됩니다.
