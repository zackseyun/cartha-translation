  text: 다섯째는 말의 영이며, 그것으로 지식이 생깁니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 정신
  - 영혼
  lexicon: πνεῦμα
  rationale: 여기서는 신적 성령이 아니라 성격을 규정하는 ‘영’의 열거형 표현이므로, POB의 영어처럼 ‘영’으로 자연스럽고 직접적으로 옮겼습니다.
- source_word: λαλιᾶς
  english_pob_choice: of speech
  chosen_korean: 말의
  alternatives_korean:
  - 말하는
  - 언어의
  - 화법의
  lexicon: λαλιά
  rationale: λαλιάς는 말하기/말의 작용을 가리키므로, 소유격 구조를 살려 ‘말의’로 간결하게 옮겼습니다.
- source_word: γνῶσις
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 인식
  lexicon: γνῶσις
  rationale: 문맥상 어떤 ‘앎’이 생기는지를 말하는 진술이므로, 표준적이고 명료한 ‘지식’이 가장 적절합니다.
- source_word: μεθ’ ἧς γίνεται
  english_pob_choice: by which comes to be
  chosen_korean: 이로 말미암아 …이 생깁니다
  alternatives_korean:
  - 이를 통해 …이 됩니다
  - 그것으로 …이 이루어집니다
  lexicon: γίνομαι
  rationale: 생성/발생의 동사를 반영해 결과 관계를 드러내면서도, 한국어로는 ‘이로 말미암아 …이 생깁니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 말의 영을 어떤 유형의 영으로 이해할지
  chosen_reading: 본문은 일곱 개의 ‘영’ 가운데 하나를 열거하는 문맥으로 읽어, 인격화된 덕목 또는 성향의 영을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 성령의 한 작용으로 이해하는 읽기
  - 단순한 인간적 화법의 성향으로 이해하는 읽기
  rationale: 영 자체를 신학적으로 과도하게 특정하지 않고, 원문의 분류적 열거를 보존하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 문맥 해석 및 어휘-수준 보존
