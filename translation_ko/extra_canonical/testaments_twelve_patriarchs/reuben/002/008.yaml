source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ἕβδομον πνεῦμα σπορᾶς καὶ συνουσίας²⁷, μεθ’ ἧς συνέρχονται²⁸ διὰ τῆς φιληδονίας²⁹ ἁμαρτίαι³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/008.yaml
  text: The seventh is the spirit of procreation and union, through which sins come together through love of pleasure.
translation:
  language: ko
  text: 일곱째는 씨 뿌림과 결합의 영이니, 그로 말미암아 쾌락을 사랑함으로 죄들이 함께 모입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  english_pob_choice: the spirit
  chosen_korean: 영
  alternatives_korean:
  - 성령
  - 혼
  lexicon: πνεῦμα
  rationale: 문맥상 하나님의 성령이 아니라 열거된 인간의 성향/충동을 가리키므로, 일반적인 ‘영’으로 옮겨 원문의 범주를 유지했습니다.
- source_word: σπορᾶς
  english_pob_choice: procreation
  chosen_korean: 씨 뿌림
  alternatives_korean:
  - 생식
  - 출산
  - 번식
  lexicon: σπορά
  rationale: 직역에 가까운 ‘씨 뿌림’은 생식 행위를 완곡하게 드러내면서도 원문의 비유적/성적 함의를 보존합니다.
- source_word: συνουσίας
  english_pob_choice: union
  chosen_korean: 결합
  alternatives_korean:
  - 연합
  - 교합
  - 성교
  lexicon: συνουσία
  rationale: EN POB가 ‘intercourse’보다 중립적인 ‘union’을 택한 흐름에 맞추되, 한국어에서는 문어체로도 자연한 ‘결합’이 원문의 관계적·성적 결합을 가장 절제되게 전달합니다.
- source_word: φιληδονίας
  english_pob_choice: love of pleasure
  chosen_korean: 쾌락을 사랑함
  alternatives_korean:
  - 향락을 사랑함
  - 즐거움을 사랑함
  - 쾌락애
  lexicon: φιληδονία
  rationale: 원문의 ‘쾌락을 사랑함’이라는 성향을 직접 드러내되, 단순한 즐거움이 아니라 죄를 낳는 쾌락 추구라는 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘죄들이 함께 모입니다’의 행위성
  chosen_reading: 죄들이 이 영의 작용으로 서로 모여 형성된다는 의미를 살려 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 죄들이 생깁니다
  - 죄들이 따라옵니다
  rationale: μεθ’ ἧς συνέρχονται는 단순 발생보다 ‘함께 모이다’의 결집 이미지를 담으므로, 죄를 다발적으로 모으는 원문상을 유지했습니다.
  doctrine_reference: 윤리적 경고 문맥
