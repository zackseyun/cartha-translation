  to: 일곱째는 생식과 성적 결합의 영이니, 그 결합과 함께 죄들이 쾌락을 사랑함을 통하여 함께 모입니다.
  rationale: 원문의 문법상 관계대명사의 선행사를 ‘성적 결합’으로 명시하고, 생식 및 성적 결합이라는 문맥적 의미를 현대 한국어로 자연스럽게 옮겼습니다. συνέρχονται의 ‘함께 모이다’ 이미지는 유지했으며, φιληδονία도 ‘쾌락을 사랑함’으로 보존했습니다.
