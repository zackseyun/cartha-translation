  to: 일곱째는 불의의 영입니다. 이 영에는 도둑질과 탐욕스러운 행위들이 따르는데, 이는 마음의 쾌락을 채우기 위해서입니다. 불의는 매매를 통하여 다른 영들과 함께 작용합니다.
