id: T12P.REU.3.6
reference: Testament of Reuben 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 6. Ἔβδομον πνεῦμα *ἀδικίας, μεθ’ ἧς⁴⁰ β-g, Α, κλοπαὶ⁴¹ καὶ γρηπίσματα⁴², ἵνα ἐμπλήσει⁴³ φιληδονίαν καρδίας S ποιήσῃ. αὐτοῦ. Ἡ γὰρ ἀδικία συνεργεῖ⁴⁴ *τοῖς λοιποῖς⁴⁵ πνεύμασιν β, S¹ ὑπ- διὰ τῆς δοσοληψίας⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/006.yaml
  text: Seventh, a spirit of injustice, with thefts and acts of greed, so that it may fill the pleasures of the heart. For injustice works together with the other spirits through buying and selling.
translation:
  language: ko
  text: 일곱째는 불의의 영입니다. 이 영에는 도둑질과 탐욕스러운 행위들이 따르는데, 이는 마음의 쾌락을 채우기 위해서입니다. 불의는 매매를 통하여 다른 영들과 함께 작용합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ἀδικίας
  english_pob_choice: a spirit of injustice
  chosen_korean: 불의의 영
  alternatives_korean:
  - 불법의 영
  - 부정의 영
  lexicon: πνεῦμα → 영; ἀδικία → 불의
  rationale: 직접적인 영적 실체 표현을 살리면서 ἀδικία의 윤리적·관계적 타락을 가장 자연스럽게 드러내는 표준 번역으로 옮겼습니다.
- source_word: κλοπαὶ καὶ γρηπίσματα
  english_pob_choice: thefts and acts of greed
  chosen_korean: 도둑질과 탐욕스러운 행위
  alternatives_korean:
  - 절도와 탐욕의 행위
  - 도둑질과 탐심의 행동
  lexicon: κλοπαί → 도둑질; γρηπίσματα → 탐욕스러운 행위
  rationale: κλοπαί는 분명한 절도 행위로, γρηπίσματα는 단순한 내적 욕심보다 탐욕이 드러난 행위성을 살려 표현했습니다.
- source_word: ἵνα ἐμπλήσει φιληδονίαν καρδίας
  english_pob_choice: so that it may fill the pleasures of the heart
  chosen_korean: 그것이 마음의 쾌락을 채우게 합니다
  alternatives_korean:
  - 그것이 마음의 쾌락으로 가득 차게 합니다
  - 마음의 쾌락을 만족시키게 합니다
  lexicon: ἐμπλήσει → 채우다; φιληδονίαν καρδίας → 마음의 쾌락
  rationale: φιληδονίαν καρδίας를 도덕적으로 완곡하게 풀지 않고, 원문이 말하는 ‘마음의 쾌락’이라는 목적어 구조를 그대로 유지했습니다.
- source_word: διὰ τῆς δοσοληψίας
  english_pob_choice: through buying and selling
  chosen_korean: 매매를 통해
  alternatives_korean:
  - 사고파는 일을 통해
  - 거래를 통해
  lexicon: δοσοληψία → 매매/거래
  rationale: POB의 수정판처럼 경제적 거래의 구체성을 살리되, 한국어에서는 간결한 ‘매매’가 원문의 상업적 교환을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 불의가 다른 영들과 ‘함께 일함’의 표현
  chosen_reading: 불의가 다른 영들과 함께 매매를 통해 함께 일하기 때문입니다
  alternative_readings:
  - 불의가 다른 영들과 협력하기 때문입니다
  - 불의가 다른 영들과 함께 작용하기 때문입니다
  rationale: 협력이나 작용으로 순화하면 원문이 강조하는 불의의 सक्रिय한 결탁과 경제적 교환의 장면이 약해져, ‘함께 일함’을 유지했습니다.
  doctrine_reference: 본문의 악한 영 목록과 상호작용을 해치는 완화 번역을 피함
