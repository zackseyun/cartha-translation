  verdict: revise
  source_fidelity: 첫 문장은 τὴν ἀλήθειαν과 미래형 φυλάξει를 충실히 반영합니다. 그러나 δεύτε 문장에서 초안은 ‘르우벤의 말들을 들으십시오’와 ‘내가 너희를 가르칩니다’를 별개의 문장으로 나누어, διδάσκω가 ‘말들’을 수식하면서 화자 르우벤이 청중의 아버지라는 관계를 나타내는 원문의 연결을 약화합니다. Charles 본문의 이 구절은 전승·편집상 다소 거친 배열을 보이지만, 영어 POB가 채택한 의미를 따라 한 문장으로 연결하는 것이 안전합니다.
  naturalness: ‘내 자녀들아’와 합쇼체는 공적 교훈문에 자연스럽습니다. 다만 ‘말들’은 한국어에서 다소 부자연스럽고, 뒤 문장의 분절 및 문장 끝에 붙은 각주 표지는 독해를 방해합니다. ‘말씀’은 종교 경전의 고정적 권위를 과도하게 암시할 수 있으므로 여기서는 중립적인 ‘말’을 사용했습니다.
  terminology: ‘진리’는 ἀλήθεια의 추상적·윤리적 의미를 적절히 보존합니다. φυλάξει는 ‘지켜 줄 것입니다’로 유지해 보호·수호의 뜻을 살렸습니다. Ῥουβήμ은 통용 표기인 ‘르우벤’으로 유지했습니다.
  issues:
