id: T12P.REU.3.9
reference: Testament of Reuben 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 9. Καὶ νῦν, τέκνα μου⁶⁵, τὴν ἀλήθειαν ἀγαπᾶτε⁶⁶ be, A καὶ αὕτη⁶⁷ *φυλάξει ὑμᾶς⁶⁸. Ἀκούσατε ⌜λόγους⌝⁶⁹ Ῥουβὴμ διδάσκω τοῦ πατρὸς ὑμῶν⁷⁰. ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/009.yaml
  text: And now, my children, love the truth, and it will guard you. Hear the words of Reuben, your father, as I teach you.
translation:
  language: ko
  text: 이제, 내 자녀들아, 진리를 사랑하십시오. 그러면 그것이 너희를 지켜 줄 것입니다. 르우벤의 말들을 들으십시오. 내가 너희를 가르칩니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἀλήθειαν
  english_pob_choice: the truth
  chosen_korean: 진리
  alternatives_korean:
  - 참된 것
  - 진실
  lexicon: ἀλήθεια
  rationale: 명사적 추상어로서의 ἀλήθεια를 표준적으로 ‘진리’로 옮겨, 단순한 사실성보다 도덕적·신앙적 진실성을 함께 드러냈습니다.
- source_word: φυλάξει
  english_pob_choice: will guard you
  chosen_korean: 지켜 줄 것입니다
  alternatives_korean:
  - 보호할 것입니다
  - 지킬 것입니다
  lexicon: φυλάσσω
  rationale: 영문 개정이 ‘keep you safe’에서 ‘guard you’로 조정된 점을 반영하여, 보호의 적극성을 살리면서도 현대 한국어에 자연스럽게 맞췄습니다.
- source_word: λόγους Ῥουβὴμ
  english_pob_choice: the words of Reuben
  chosen_korean: 르우벤의 말들
  alternatives_korean:
  - 르우벤의 말씀
  - 르우벤의 이야기
  lexicon: λόγος
  rationale: λόγους의 복수를 살려 ‘말들’로 옮겼고, 전승문맥상 권위 있는 교훈이지만 성경적 ‘말씀’보다는 직접적인 발화를 뜻하는 ‘말들’이 원문에 더 가깝습니다.
- source_word: διδάσκω
  english_pob_choice: as I teach you
  chosen_korean: 내가 너희를 가르칩니다
  alternatives_korean:
  - 내가 너희를 가르치는 대로
  - 내가 너희를 가르치면서
  lexicon: διδάσκω
  rationale: 현재형의 서술적 설명을 자연스러운 한국어로 풀어 ‘가르칩니다’로 옮겨, 읽는 이가 문장의 행위를 즉시 이해하도록 했습니다.
theological_decisions:
- issue: 직접 호소와 교훈의 격식
  chosen_reading: 부름말은 ‘내 자녀들아’로 유지하고, 교훈 부분은 합쇼체로 옮겼습니다.
  alternative_readings:
  - ‘나의 자녀들아’
  - 전체를 반말형으로 통일
  rationale: 원문은 친밀한 호칭과 권위 있는 훈계를 함께 담고 있으므로, 한국어에서도 호칭의 친밀성과 본문 전체의 공적·교훈적 성격을 함께 살렸습니다.
  doctrine_reference: 문학적 화자-청중 관계 보존
