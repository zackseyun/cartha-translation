  text: 8. Καὶ οὕτως ἀπόλλυται πᾶς νεώτερος⁵⁴, πνεῦμα. σκοτίζων⁵⁵ τὸν νοῦν ⌜αὐτοῦ⌝⁵⁶ ἀπὸ τῆς ἀληθείας, καὶ μὴ α, αe, *συνιὼν ἐν⁵⁷ τῷ νόμῳ τοῦ θεοῦ⁵⁸, μήτε⁵⁹ ἀκούων⁶⁰ νουθεσίας⁶¹ πλάνη καὶ φαν- πατέρων αὐτοῦ⁶² ὡς⁶³ κἀγὼ ἔπαθον⁶⁴ ἐν τῷ νεωτερισμῷ τασία. μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/008.yaml
  text: And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.
translation:
  language: ko
  text: 이와 같이 모든 젊은 남자는 멸망합니다. 그들은 진리에서 멀어져 마음을 어둡게 하고, 하나님의 율법을 깨닫지 못하며, 자기 조상들의 훈계를 듣지 않습니다. 나도 젊은 시절에 이와 같이 고난을 겪었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς νεώτερος
  english_pob_choice: every young man
  chosen_korean: 모든 젊은이
  alternatives_korean:
  - 모든 젊은 남자
  - 젊은 사람마다
  lexicon: νεώτερος
  rationale: 문맥상 연령대 전체를 가리키므로 자연스러운 집합 표현인 ‘젊은이’를 택했고, 성별을 불필요하게 강조하지 않았습니다.
- source_word: σκοτίζων τὸν νοῦν
  english_pob_choice: darkening his mind
  chosen_korean: 마음을 어둡게 하고
  alternatives_korean:
  - 생각을 어둡게 하고
  - 이성을 어둡게 하고
  lexicon: σκοτίζω / νοῦς
  rationale: νοῦς를 단순 지성보다 인식·사고의 중심으로 보아 한국어에서 가장 자연스러운 ‘마음’을 사용했습니다.
- source_word: τὸν νόμον τοῦ θεοῦ
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 규례
  lexicon: νόμος / θεός
  rationale: νόμος의 토라적 의미를 살려 관용적이면서도 원문에 충실한 ‘율법’을 유지했습니다.
- source_word: νουθεσίας πατέρων αὐτοῦ
  english_pob_choice: the instruction of his fathers
  chosen_korean: 아버지들의 훈계
  alternatives_korean:
  - 조상들의 교훈
  - 그의 아버지들의 훈계
  lexicon: νουθεσία / πατέρες
  rationale: νουθεσία는 단순 정보 전달이 아니라 교정과 권면을 포함하므로 ‘훈계’가 적절하며, 복수 ‘아버지들’은 조상/선조들의 권위를 반영합니다.
theological_decisions:
- issue: ἀπόλλυται의 파괴/멸망 이미지
  chosen_reading: ‘멸망합니다’로 번역해 단순한 실패가 아니라 파멸적 결과를 드러냈습니다.
  alternative_readings:
  - 망합니다
  - 무너집니다
  rationale: 문맥상 젊은이의 도덕적·영적 파멸을 말하므로 강한 종말적/파괴적 어감을 유지하는 것이 원문에 가깝습니다.
  doctrine_reference: 윤리적 타락의 결과에 대한 경고
