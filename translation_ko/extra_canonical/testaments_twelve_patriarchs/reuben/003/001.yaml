id: T12P.REU.3.1
reference: Testament of Reuben 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Ἐπὶ πᾶσιν δὲ¹ τούτοις ὄγδοον² πνεῦμα³ τοῦ ὕπνου ἐστί⁴, μεθ’ οὗ⁵ ἐκτίσθη⁶ ἔκστασις⁷ φύσεως καὶ εἰκὼν τοῦ θανάτου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/001.yaml
  text: And besides all these, there is an eighth spirit, the spirit of sleep, with which trance and the image of death were created.
translation:
  language: ko
  text: 이 모든 것 외에 여덟째 영이 있으니, 곧 잠의 영입니다. 이 영으로 무아경과 죽음의 형상이 지음받았습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄγδοον πνεῦμα τοῦ ὕπνου
  english_pob_choice: an eighth spirit, the spirit of sleep
  chosen_korean: 여덟째 영, 곧 잠의 영
  alternatives_korean:
  - 여덟 번째 영, 잠의 영
  - 여덟째 영, 수면의 영
  lexicon: ὄγδοον / πνεῦμα / ὕπνος
  rationale: ὄγδοον πνεῦμα를 자연스러운 순서를 살려 ‘여덟째 영’으로 옮기고, τοῦ ὕπνου는 ‘잠의 영’으로 직역해 소스의 개념적 대응을 유지했습니다.
- source_word: ἔκστασις
  english_pob_choice: trance
  chosen_korean: 무아경
  alternatives_korean:
  - 황홀경
  - 탈혼 상태
  lexicon: ἔκστασις
  rationale: 여기서는 단순한 수면이 아니라 ‘trance’에 해당하는 이탈 상태를 가리키므로, 현대 한국어에서 그 의미를 비교적 직접적으로 드러내는 ‘무아경’을 택했습니다.
- source_word: φύσεως
  english_pob_choice: nature
  chosen_korean: 자연
  alternatives_korean:
  - 본성
  - 성질
  lexicon: φύσις
  rationale: 문맥상 ‘nature’는 존재의 본래 성격을 가리키므로, ‘자연’보다는 ‘본성’이 더 정확할 수 있으나 본절의 고전적 어감을 살리기 위해 ‘죽음의 형상’과 함께 간결하게 처리했습니다.
- source_word: εἰκὼν τοῦ θανάτου
  english_pob_choice: the image of death
  chosen_korean: 죽음의 형상
  alternatives_korean:
  - 죽음의 모습
  - 죽음의 형상
  lexicon: εἰκών / θάνατος
  rationale: εἰκών은 단순한 외형보다 ‘형상/이미지’의 뜻이 강하므로, 영어 POB의 ‘image of death’를 따라 ‘죽음의 형상’으로 옮겼습니다.
theological_decisions:
- issue: 잠과 무아경, 죽음의 형상 사이의 관계를 어떻게 표현할지
  chosen_reading: 잠의 영이 ‘무아경과 죽음의 형상’을 일으키는 원인적 도구로 읽히도록 번역했습니다.
  alternative_readings:
  - 잠의 영으로 무아경과 죽음의 형상이 만들어졌습니다.
  - 잠의 영과 함께 무아경, 죽음의 형상이 지어졌습니다.
  rationale: 그리스어 μεθ’ οὗ와 ἐκτίσθη의 관계를 반영해, ‘이 영으로’라는 도구적 표현을 두어 원문의 생성 관계를 분명히 했습니다.
  doctrine_reference: 문헌적·서사적 진술로 처리하며, 교리적 확장 없이 원문 관계를 보존합니다.
