base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/005.yaml
  text: Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood, in destruction and jealousy, to forge words and hide words from his own family and household.
translation:
  language: ko
  text: 다섯째는 교만의 영이니, 그로 하여금 자랑하고 큰일을 생각하게 합니다. 여섯째는 거짓의 영이니, 멸망과 질투 가운데서 말을 꾸며 내고 자기 가족과 집안에게서 말을 숨기게 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ὑπερηφανείας
  english_pob_choice: a spirit of pride
  chosen_korean: 교만의 영
  alternatives_korean:
  - 자만의 영
  - 오만의 영
  lexicon: πνεῦμα, ὑπερηφανείας
  rationale: 명사구를 그대로 살리면서도 한국어에서 자연스럽고 성경적 대비가 분명한 ‘교만의 영’으로 옮겼습니다.
- source_word: καυχᾶται καὶ μεγαλοφρονῇ
  english_pob_choice: so that one boasts and thinks grand thoughts
  chosen_korean: 그로 하여금 자랑하고 큰일을 생각하게 합니다
  alternatives_korean:
  - 그로 하여금 자랑하고 큰 생각을 하게 합니다
  - 그로 하여금 자만하고 큰일을 품게 합니다
  lexicon: καυχᾶται, μεγαλοφρονῇ
  rationale: 첫 동사는 ‘자랑하다’로, 둘째 동사는 과장된 마음가짐을 드러내는 ‘큰일을 생각하다’로 살려 원문의 병렬을 유지했습니다.
- source_word: πλάττειν λόγους
  english_pob_choice: to forge words
  chosen_korean: 말을 꾸며 내고
  alternatives_korean:
  - 말을 위조하고
  - 말을 만들어 내고
  lexicon: πλάττειν, λόγους
  rationale: πλάττειν의 ‘만들다/빚다’와 거짓말의 조작성을 함께 살려, 한국어에서 자연스러운 ‘꾸며 내다’로 렌더링했습니다.
- source_word: ἀπὸ γένους καὶ οἰκείων
  english_pob_choice: from his own family and household
  chosen_korean: 자기 가족과 집안에게서
  alternatives_korean:
  - 자기 친족과 집안에게서
  - 자기 가족과 식구들에게서
  lexicon: γένους, οἰκείων
  rationale: 둘의 병렬을 살리되, 혈연·가정 내부를 함께 아우르는 표현으로 ‘가족과 집안’을 택했습니다.
theological_decisions:
- issue: 악한 영들의 열거를 어떻게 옮길지
  chosen_reading: 본문의 열거 구조를 유지하며 ‘영’ 표현을 그대로 살려 도덕적 성향이 아니라 실제 인격적/영적 영향으로 읽히게 했습니다.
  alternative_readings:
  - 교만한 성향
  - 거짓된 마음
  rationale: 문맥상 단순 심리 상태보다 ‘영’들의 목록이므로, 원문의 신학적 긴장을 약화시키지 않도록 직역적 틀을 유지했습니다.
  doctrine_reference: 영적 존재/성향의 목록이라는 본문 문맥 자체
- issue: ἐν ἀπωλείᾳ καὶ ζήλῳ의 연결 방식
  chosen_reading: ‘멸망과 질투 가운데서’로 옮겨, 거짓의 영이 작동하는 영역을 부사적 구문으로 살렸습니다.
  alternative_readings:
  - 멸망과 질투 속에서
  - 멸망과 질투로
  rationale: English POB의 구문과 그리스어 전치사구를 따라, ‘거짓의 영’의 활동 배경을 흐리지 않게 했습니다.
  doctrine_reference: 문맥적 수사 구조
