review_pass:
  verdict: revise
  source_fidelity: ‘큰일을 생각하게 합니다’는 μεγαλοφρονῇ(스스로를 크게 여기다, 거만한 생각을 품다)를 ‘큰일’을 계획하는 뜻으로 바꿀 위험이 있습니다. 또한 αὐτοῦ가 가리키는 ‘자기 말’을 명시하고, ἀπὸ γένους καὶ οἰκείων은 ‘자기 친족과 집안 사람들에게서’로 옮겨야 합니다.
  naturalness: 원문의 열거 형식을 ‘다섯째 영은 …입니다 / 여섯째 영은 …입니다’로 정리하면 현대 한국어 합쇼체에서 더 자연스럽습니다. ‘가족과 집안에게서’는 조사 결합이 부자연스러우므로 고쳤습니다.
  terminology: ‘교만의 영’, ‘거짓의 영’, ‘멸망과 질투’, ‘말을 꾸며 내다’는 적절합니다. μεγαλοφρονῇ는 ‘거만한 생각을 품다’로 옮겨 교만의 의미를 보존했습니다.
  issues:
  - severity: medium
    issue: μεγαλοφρονῇ의 의미가 ‘큰일을 생각하다’로 약화·변경됨
