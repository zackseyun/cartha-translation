revisions:
- from: 다섯째는 교만의 영이니, 그로 하여금 자랑하고 큰일을 생각하게 합니다. 여섯째는 거짓의 영이니, 멸망과 질투 가운데서 말을 꾸며 내고 자기 가족과 집안에게서 말을 숨기게 합니다.[a]
  to: 다섯째 영은 교만의 영이니, 사람이 자랑하며 거만한 생각을 품게 합니다. 여섯째 영은 거짓의 영이니, 멸망과 질투 가운데서[a] 말을 꾸며 내고 자기 친족과 집안 사람들에게서 자기 말을 숨기게 합니다.
  rationale: 교만의 영이 낳는 ‘거만한 생각’을 정확히 옮기고, 거짓의 영이 자기 친족과 집안 사람들에게서 ‘자기 말’을 감추는 행위를 명시했습니다. 또한 논란이 표시된 그리스어 구절은 번역에서 삭제하거나 추정 보정하지 않고 각주로 그 불확실성을 알렸습니다.
  reviewer_model: gpt-5.6-terra
