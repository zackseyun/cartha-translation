  text: 이것들과 함께하는 영들은 오류의 영들과 섞여 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτοις τοῖς πνεύμασι
  english_pob_choice: With these spirits
  chosen_korean: 이것들과 함께하는 영들
  alternatives_korean:
  - 이 영들과
  - 이런 영들과
  lexicon: πνεῦμα
  rationale: 전치사적 결합을 살려 ‘함께하는’으로 옮겨, 단순 소유나 병치를 넘는 혼합 관계를 드러냈습니다.
- source_word: συμμίγνυται
  english_pob_choice: are mixed
  chosen_korean: 섞여 있습니다
  alternatives_korean:
  - 혼합되어 있습니다
  - 뒤섞여 있습니다
  lexicon: συμμίγνυμι
  rationale: 현재형 수동의 상태를 자연스럽게 나타내면서, 원문의 혼합 이미지를 직역보다 약간 유려하게 반영했습니다.
- source_word: τὰ πνεύματα τῆς πλάνης
  english_pob_choice: the spirits of error
  chosen_korean: 오류의 영들
  alternatives_korean:
  - 미혹의 영들
  - 잘못의 영들
  lexicon: πλάνη
  rationale: πλάνη는 ‘미혹’이 가능하지만, 영어 POB의 ‘error’와 원문의 추상명사성을 따라 ‘오류’로 옮겼습니다.
theological_decisions:
- issue: ‘spirits of error’의 성격
  chosen_reading: 오류를 매개하는 영적 존재들을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 사람의 잘못된 태도나 오류 상태를 의인화한 표현
  - 단순히 거짓 가르침의 영향력을 뜻하는 비유
  rationale: 문맥상 ‘영들’이 반복되므로, 추상적 오류 자체보다 오류에 속한 영적 존재들의 혼합으로 읽는 것이 본문 구조를 더 잘 반영합니다.
  doctrine_reference: Testament of Reuben 3:2 문맥의 영적 분류 표현
