id: T12P.REU.3.4
reference: Testament of Reuben 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 4. Τρίτον πνεῦμα²¹ μάχης ἐν τῷ ἥπατι καὶ ἐν²² τῇ χόλῃ. Τέταρτον²³ πνεῦμα ἀρεσκείας²⁴ καὶ μαγ- γανείας²⁵, ἵνα διὰ²⁶ περιεργείας²⁷ ὡραῖος²⁸ ὀφθῇ²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/004.yaml
  text: Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive.
translation:
  language: ko
  text: 세 번째는 간과 쓸개에 있는 싸움의 영입니다. 네 번째는 자기 과시와 주술의 영으로, 지나친 참견을 통해 아름답게 보이게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα μάχης
  english_pob_choice: a spirit of fighting
  chosen_korean: 싸움의 영
  alternatives_korean:
  - 다툼의 영
  - 전투의 영
  lexicon: πνεῦμα → 영; μάχη → 싸움/다툼
  rationale: 문맥상 내면을 지배하는 성향을 가리키므로 자연스러운 ‘싸움의 영’으로 옮겼습니다. ‘전투’는 지나치게 군사적이고, ‘다툼’은 분쟁의 뉘앙스가 더 강합니다.
- source_word: ἐν τῷ ἥπατι καὶ ἐν τῇ χόλῃ
  english_pob_choice: in the liver and in the gall
  chosen_korean: 간의 … 쓸개의 …
  alternatives_korean:
  - 간과 쓸개에
  - 간과 담즙에
  lexicon: ἥπαρ → 간; χόλη → 쓸개/담즙
  rationale: 영문 POB의 직접 대응을 유지하면서도 한국어에서 자연스럽게 읽히도록 ‘간’과 ‘쓸개’를 택했습니다. ‘담즙’은 해부학적 대응보다 생리액을 강조합니다.
- source_word: ἀρεσκείας καὶ μαγγανείας
  english_pob_choice: self-display and sorcery
  chosen_korean: 자기 과시와 마술
  alternatives_korean:
  - 자기 내세움과 주술
  - 아첨과 요술
  lexicon: ἀρέσκεια → 남에게 보이기 위한 태도/자기 과시; μαγγανεία → 마술/주술
  rationale: ἀρέσκεια는 단순한 만족이 아니라 남에게 보이려는 과시성을 드러내므로 ‘자기 과시’가 적절합니다. μαγγανεία는 영어 POB의 ‘sorcery’를 따라 초자연적 조작의 의미를 살려 ‘마술’로 옮겼습니다.
- source_word: διὰ περιεργείας ὡραῖος ὀφθῇ
  english_pob_choice: through excessive meddling one may appear attractive
  chosen_korean: 지나친 간섭을 통해 아름답게 보이려는 것입니다
  alternatives_korean:
  - 호기심 많은 간섭으로 매력적으로 보이려는 것입니다
  - 오지랖으로 보기 좋게 보이려는 것입니다
  lexicon: περιεργία → 지나친 간섭/호기심; ὡραῖος → 아름다운, 보기 좋은
  rationale: περιεργία는 단순한 호기심보다 경계선을 넘는 간섭을 뜻하므로 ‘지나친 간섭’으로 풀었습니다. ὡραῖος는 외양상 ‘보기 좋음’이지만, 한국어 문맥에서는 ‘아름답게 보이다’가 의미를 가장 안정적으로 전달합니다.
theological_decisions:
- issue: 영들의 열거를 현대 한국어로 어떻게 전달할지
  chosen_reading: 인격화된 악한 성향/충동을 가리키는 표현으로 ‘영’을 그대로 유지했습니다.
  alternative_readings:
  - 성향
  - 정욕
  - 악령
  rationale: 본문은 특정한 내적 동인들을 ‘영’으로 열거하므로, 이를 심리적 성향으로만 환원하지 않고 원문의 표현을 보존했습니다.
  doctrine_reference: 본문-수준의 어휘 보존 원칙
- issue: ‘아름답게 보이려는 것’의 윤리적 방향성
  chosen_reading: 외적 매력 자체보다 타인에게 보이기 위한 의도와 그 배후의 교만을 드러내는 쪽으로 옮겼습니다.
  alternative_readings:
  - 매력적으로 보이려는 것
  - 예쁘게 보이려는 것
  rationale: ὡραῖος는 단순 미관이 아니라 ‘보기 좋음’의 가치 판단을 포함하므로, 자기 연출의 도덕적 함의를 드러내는 번역이 본문 의도에 맞습니다.
  doctrine_reference: 수사적 함의 보존
