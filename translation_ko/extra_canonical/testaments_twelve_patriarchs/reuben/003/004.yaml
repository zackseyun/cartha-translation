  source_fidelity: 현 초안은 τρίτον πνεῦμα μάχης를 ‘간의 싸움의 영과 쓸개의 영’으로 나누어, 원문의 단수 ‘싸움의 영’과 그 위치를 잘못 반영합니다. 또한 ἵνα ... ὀφθῇ의 목적 표현은 ‘아름답게 보이게 하려는’으로 옮기는 편이 더 가깝습니다.
  naturalness: ‘간과 쓸개에 있는 싸움의 영’은 원문의 신체 부위 연결을 자연스럽고 정확하게 나타냅니다. ‘지나친 참견’은 περιεργεία의 부정적이고 과도한 간섭의 뉘앙스를 현대 표준어로 무리 없이 전달합니다.
  terminology: πνεῦμα는 ‘영’으로 유지합니다. μαγγανεία는 오락적 ‘마술’보다 주술 행위를 뜻하는 ‘주술’이 영어 POB의 ‘sorcery’ 및 원어에 더 적합합니다. ἀρέσκεια는 영어 감사 번역의 선택을 따라 ‘자기 과시’로 유지합니다.
  issues:
