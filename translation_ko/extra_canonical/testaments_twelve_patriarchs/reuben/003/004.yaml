    rationale: 원문은 ‘간과 쓸개에 있는 싸움의 영’(πνεῦμα μάχης ... ἐν τῷ ἥπατι καὶ ἐν τῇ χόλῃ)이라는 하나의 영을 말합니다. 초안의 ‘간의 싸움의 영과 쓸개의 영’은 ‘쓸개의 영’을 추가합니다.
  - severity: medium
