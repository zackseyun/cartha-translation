  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '[7. Ἐπὶ⁴⁷ πᾶσι δὲ⁴⁸ τούτοις *τὸ νου, τὸ πνεῦμα⁴⁹ τοῦ ὕπνου⁵⁰ συνάπτεται⁵¹ *ὃ ἐστι⁵² *πλάνης καὶ ὄγδοον φαντασίας⁵³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/007.yaml
  text: And over all these, the spirit of sleep is joined, which is error and the eighth of fantasy.
translation:
  language: ko
  text: 그리고 이 모든 것 위에 잠의 영이 더해지니, 그것은 오류이며 환상의 여덟째입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πᾶσι δὲ τούτοις
  english_pob_choice: And over all these
  chosen_korean: 그리고 이 모든 것 위에
  alternatives_korean:
  - 그리고 이 모든 것 위에 더하여
  - 그리고 이 모든 것 위에
  lexicon: ἐπὶ + dative; πᾶσι τούτοις
  rationale: 위치적·비유적 중첩을 자연스럽게 살려, 단순한 추가보다 ‘위에’라는 상부적 겹침을 드러냈습니다.
- source_word: τὸ πνεῦμα τοῦ ὕπνου
  english_pob_choice: the spirit of sleep
  chosen_korean: 잠의 영
  alternatives_korean:
  - 수면의 영
  - 잠의 영
  lexicon: πνεῦμα + genitive
  rationale: ὕπνος를 ‘잠’으로 직역해 간결하게 유지하고, ‘영’을 붙여 원문의 존재론적 표현을 보존했습니다.
- source_word: συνάπτεται
  english_pob_choice: is joined
  chosen_korean: 더해지니
  alternatives_korean:
  - 결합되니
  - 연결되니
  - 더해지니
  lexicon: συνάπτω
  rationale: 단순 병합보다 앞선 목록에 ‘덧붙여지는’ 느낌이 자연스럽게 전달되도록 했습니다.
- source_word: πλάνης καὶ ὄγδοον φαντασίας
  english_pob_choice: error and the eighth of fantasy
  chosen_korean: 오류이며 환상의 여덟째
  alternatives_korean:
  - 오류이며 환상의 여덟째
  - 오류와 환상의 여덟째
  - 오류이며 상상의 여덟째
  lexicon: πλάνη; φαντασία; ὄγδοον
  rationale: 영문 POB의 분리된 구조를 따라 πλάνην은 ‘오류’로, ὄγδοον φαντασίας는 ‘환상의 여덟째’로 나누어 번역해 압축을 피했습니다.
theological_decisions:
- issue: τὸ πνεῦμα τοῦ ὕπνου의 인격화/비인격화
  chosen_reading: ‘잠의 영’을 유지하여 본문이 수면을 단순 상태가 아니라 영적 실재처럼 말하는 표현을 보존했습니다.
  alternative_readings:
  - ‘잠이라는 영적 영향’으로 완화
  - ‘잠의 기운’으로 비인격화
  rationale: 문맥상 본문은 열거된 ‘영’들의 범주 안에서 수면을 다루므로, 이를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 문학적·주제적 인격화 표현 보존
- issue: ὄγδοον φαντασίας의 문법적 애매성
  chosen_reading: ‘환상의 여덟째’로 두어 수식 관계의 애매함을 유지했습니다.
  alternative_readings:
  - ‘환상의 여덟 번째 것’
  - ‘여덟째 환상’
  - ‘환상의 여덟째 영’
  rationale: 그리스어는 ‘영’이 생략된 압축 표현이므로, 해석을 과도하게 확정하지 않고 POB의 절제를 따랐습니다.
  doctrine_reference: 본문 비약 방지 및 문법적 애매성 보존
