  source_fidelity: 원문의 ἐπὶ πᾶσι ... συνάπτεται(‘이 모든 것 위에/그 모든 것에 결합된다’)와 τὸ πνεῦμα τοῦ ὕπνου(‘잠의 영’)를 유지했습니다. 후반의 문법적으로 압축되고 다소 불안정한 표현(πλάνης καὶ ὄγδοον φαντασίας)은 영문 POB의 ‘error and the eighth of fantasy’를 따라 ‘오류이며 환상의 여덟째’로 보존하되, 한국어 문장 종결을 자연스럽게 다듬었습니다.
  naturalness: 초안의 ‘더해지니’는 앞선 열거에 단순히 추가된다는 뜻으로 읽힐 수 있어, συνάπτεται의 ‘결합되다’에 맞추었습니다. 또한 ‘여덟째입니다’보다 ‘여덟째인 것입니다’가 서술 구조상 더 자연스럽고, 원문의 난삽함도 과도하게 해석하지 않습니다.
