reference: Testament of Reuben 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 3. Πρῶτον¹² *τὸ τῆς πορνείας πνεῦμα¹³ ἐν τῇ φύσει¹⁴ καὶ¹⁵ *ταῖς αἰσθήσεσιν¹⁶ ἔγκειται¹⁷. *Δεύτερον πνεῦμα¹⁸ ἀπλη- στείας¹⁹ γαστρός²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/003.yaml
  text: First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of greediness of the belly.
translation:
  language: ko
  text: 첫째, 음행의 영은 본성 안과 감각들 안에 자리 잡고 있습니다. 둘째, 배의 탐욕의 영입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ τῆς πορνείας πνεῦμα
  english_pob_choice: the spirit of sexual immorality
  chosen_korean: 음행의 영
  alternatives_korean:
  - 성적 부도덕의 영
  - 음란의 영
  lexicon: πορνεία
  rationale: 포르네이아는 단순한 성적 욕망보다 언약적/윤리적 차원의 음행을 가리키므로, POB의 의미를 유지하면서도 한국어에서 직접적이고 성경적인 표현인 ‘음행의 영’으로 옮겼습니다.
- source_word: ἐν τῇ φύσει καὶ ταῖς αἰσθήσεσιν
  english_pob_choice: in the nature and in the senses
  chosen_korean: 본성 안과 감각들 안에
  alternatives_korean:
  - 자연과 감각들 안에
  - 성품과 감각들 안에
  lexicon: φύσις, αἴσθησις
  rationale: φύσις와 αἴσθησις는 인간 내면의 타고난 성향과 감각적 지각을 가리키므로, 자연보다 ‘본성’이 더 직접적이며, αἰσθήσεις는 단수로 축소하지 않고 복수의 ‘감각들’로 살렸습니다.
- source_word: ἔγκειται
  english_pob_choice: is lodged
  chosen_korean: 자리 잡고 있습니다
  alternatives_korean:
  - 들어앉아 있습니다
  - 내재해 있습니다
  lexicon: ἔγκειμαι
  rationale: ἔγκειται는 단순한 존재보다 내부에 박혀 있거나 자리한 상태를 뜻하므로, 현대 한국어에서 과도하게 경직되지 않으면서도 ‘lodged’의 이미지를 전달하는 표현을 택했습니다.
- source_word: ἀπληστείας γαστρός
  english_pob_choice: greediness of the belly
  chosen_korean: 배의 탐욕
  alternatives_korean:
  - 배의 탐심
  - 식욕의 탐욕
  lexicon: ἀπληστία, γαστήρ
  rationale: ἀπληστία는 ‘채움 없음’보다 ‘탐욕/탐심’의 성격이 강하고, γαστήρ는 문자적으로 배이지만 여기서는 욕망의 중심을 가리키므로, 직역적이면서도 자연한 ‘배의 탐욕’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 구절의 표현 강도
  chosen_reading: ‘배의 탐욕’으로 옮겨, 단순한 식욕 문제보다 탐욕적 욕망의 영적 차원을 드러냈습니다.
  alternative_readings:
  - ‘배의 굶주림’
  - ‘배의 만족 못함’
  rationale: 본문은 육체적 허기보다 탐욕의 영을 말하므로, 한국어에서도 도덕적·영적 경고가 살아나도록 했습니다.
  doctrine_reference: 인간 욕망과 죄의 내적 근원에 대한 유대교 지혜문학적 경계
- issue: ‘영’ 반복 유지
  chosen_reading: 두 항목 모두 ‘영’으로 반복하여 병렬 구조를 보존했습니다.
  alternative_readings:
  - 두 번째는 ‘욕심’으로 완화
  - 첫 번째만 ‘영’으로 표시
  rationale: 그리스어가 두 번 모두 πνεῦμα를 사용하므로, 반복을 유지해 두 종류의 내적 세력을 분명히 했습니다.
  doctrine_reference: 악한 성향의 인격적/동력적 표현
