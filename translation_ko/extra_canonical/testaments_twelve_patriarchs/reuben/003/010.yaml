  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 10. Μὴ⁷¹ προσέχετε⁷² ὄψει⁷³ γυναικείᾳ⁷⁴ α ὄψιν. μήτε⁷⁵ συνδιάζετε⁷⁶ μετὰ *θηλείας ὑπάνδρου⁷⁷ μήτε⁷⁸ περιεργάζεσθε⁷⁹ πρᾶξιν⁸⁰ γυναικῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/010.yaml
  text: Do not look at a woman's appearance, nor associate with a married woman, nor pry into the affairs of women.
translation:
  language: ko
  text: 여자의 겉모습을 보지 말고, 아내가 있는 여자와 어울리지 말며, 여자들의 일에 참견하지 마십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ προσέχετε ὄψει γυναικείᾳ
  english_pob_choice: Do not look at a woman's appearance
  chosen_korean: 여자의 겉모습을 보지 말고
  alternatives_korean:
  - 여자의 외모를 주의하지 말고
  - 여자의 용모를 바라보지 말고
  lexicon: προσέχω / ὄψις / γυναικεῖος
  rationale: Greek은 단순한 주의 기울임보다 ‘보다/응시하다’의 직접적 시각 행위를 가리키므로, POB의 수정판처럼 ‘보지 말고’로 옮겼습니다.
- source_word: μετὰ θηλείας ὑπάνδρου
  english_pob_choice: associate with a married woman
  chosen_korean: 아내가 있는 여자와 어울리지 말며
  alternatives_korean:
  - 유부녀와 어울리지 말며
  - 남편이 있는 여자와 어울리지 말며
  lexicon: θηλεία / ὑπάνδρος
  rationale: ὑπάνδρος는 ‘남편이 있는’ 여성을 가리키므로, 현대 한국어에서 가장 자연스럽고 중립적인 ‘아내가 있는 여자’로 풀어 옮겼습니다.
- source_word: περιεργάζεσθε πρᾶξιν γυναικῶν
  english_pob_choice: pry into the affairs of women
  chosen_korean: 여자들의 일에 참견하지 마십시오
  alternatives_korean:
  - 여자들의 일에 간섭하지 마십시오
  - 여자들의 사정에 캐묻지 마십시오
  lexicon: περιεργάζομαι / πρᾶξις / γυνή
  rationale: 문맥상 불필요하게 들춰보거나 간섭하는 행위를 가리키므로, ‘참견하다’로 자연스럽고 직접적으로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 금지 명령을 한국어에서 얼마나 직접적으로 표현할지
  chosen_reading: 금지 명령을 완곡하게 돌리지 않고 ‘보지 말고 / 어울리지 말며 / 참견하지 마십시오’로 직설적으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘주의하지 말고’ ‘가까이하지 말며’로 순화하는 방식
  rationale: 원문은 경계와 금지를 분명히 하는 훈계문이므로, 한국어도 그 긴장과 직접성을 보존하는 것이 소스 충실성에 부합합니다.
  doctrine_reference: source fidelity and ethical admonition
