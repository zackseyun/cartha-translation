review_pass:
  verdict: revise
  source_fidelity: 첫째 금지는 γυναικεία ὄψις(여성의 외모/용모)를 대상으로 하므로 ‘여자의 겉모습을 보지 말고’는 대체로 충실합니다. 둘째 ὑπάνδρος는 ‘남편이 있는, 기혼인’이라는 뜻입니다. 초안의 ‘아내가 있는 여자’는 한국어에서 ‘아내를 둔 여자’로 이해되어 원뜻을 반대로 만들 수 있습니다. 셋째 περιεργάζεσθε πρᾶξιν γυναικῶν은 여자들의 일/사정에 부당하게 관여하거나 캐묻지 말라는 뜻으로, ‘참견하지 마십시오’는 문맥상 적절합니다.
  naturalness: 합쇼체의 병렬 금지 표현은 자연스럽습니다. 다만 ‘아내가 있는 여자’는 현대 표준어에서 의도한 ‘married woman’의 자연스러운 표현이 아니므로 ‘남편이 있는 여자’로 고쳐야 합니다.
  terminology: ὑπάνδρος의 성별 관계를 정확히 드러내기 위해 ‘남편이 있는 여자’를 사용했습니다. ‘여자의 겉모습’, ‘어울리다’, ‘여자들의 일에 참견하다’는 본문의 일반적이고 비신학적인 훈계 어휘를 무리 없이 전달합니다.
  issues:
  - severity: high
    issue: ‘아내가 있는 여자’는 ὑπάνδρος의 의미를 잘못 전달할 수 있습니다.
