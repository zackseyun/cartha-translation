  text: And Reuben died, having commanded these things to his sons.
translation:
  language: ko
  text: 그리고 르우벤은 이 일들을 자기 아들들에게 명한 뒤에 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἀπέθανε Ῥουβίμ
  english_pob_choice: And Reuben died
  chosen_korean: 그리고 르우벤은 … 죽었습니다
  alternatives_korean:
  - 그리고 르우벤이 죽었습니다
  - 르우벤이 죽고
  lexicon: 고유명사 / ἀποθνῄσκω
  rationale: 서술 연결사 Καὶ를 자연스럽게 ‘그리고’로 옮기고, ἀπέθανε는 현대 문어체의 평서형 ‘죽었습니다’로 직역에 가깝게 살렸습니다.
- source_word: ἐντειλάμενος
  english_pob_choice: having commanded
  chosen_korean: 명한 뒤에
  alternatives_korean:
  - 명하여
  - 명령한 뒤에
  - 지시한 뒤에
  lexicon: ἐντέλλομαι
  rationale: 분사형의 완료적 선행 관계를 한국어에서 자연스럽게 드러내기 위해 ‘…한 뒤에’로 옮겼고, 내용상 단순한 지시보다 유언적 명령의 뉘앙스를 살렸습니다.
- source_word: τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: to his sons
  chosen_korean: 자기 아들들에게
  alternatives_korean:
  - 그의 아들들에게
  - 아들들에게
  lexicon: υἱός
  rationale: 대명사 αὐτοῦ를 반영해 소유 관계를 분명히 하되, 한국어에서는 자연스러운 ‘자기’로 처리했습니다.
theological_decisions:
- issue: 유언적 행위의 서술 방식
  chosen_reading: ‘명한 뒤에 죽었습니다’로 분사와 본동사의 선후 관계를 분명히 했습니다.
  alternative_readings:
  - ‘명령하면서 죽었습니다’
  - ‘명령한 후에 죽었습니다’
  rationale: 본문은 죽음 자체와 자녀들에게의 명령을 함께 제시하므로, 선행 분사 구조를 살려 르우벤의 마지막 행위를 유언적 맥락으로 이해하게 하는 것이 가장 충실합니다.
  doctrine_reference: 본문 문맥 보존 및 서사 구조
