base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004.yaml
  text: '1[a]. Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.


    2[b]. For until my father''s death I did not have the boldness to look my father in the face.


    3. And because of the reproach of my sin, my mind was continually consumed within me.


    4. For seven months I was sick unto death, and after I had repented with purpose of soul before the Lord, the spirit of jealousy departed from me. Until now I have kept myself on guard, and I have not sinned.


    5. Therefore, my children, I tell you: keep everything that I command you, and you will certainly not sin.


    6. For the sin of sexual immorality is a pit for the soul, separating it from God and bringing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.


    7. For sexual immorality has destroyed many. Whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.


    8. For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from every kind of sexual immorality, and found favor before God and men.


    9. For the Egyptian woman did many things against him, and called in magicians and brought him potions; but Joseph guarded himself from every evil desire and did not accept the counsel of his soul toward wicked lust.


    10[c][d]. Therefore the God of your fathers delivered him from every hidden evil and from death.'
  footnotes:
  - marker: a
    text: The Greek text at this point is damaged or compressed in the OCR layer. The sense is that Reuben, because of his sin, lacked the confidence to look his father in the face until his father's death.
    reason: textual_variant
    anchor_ref: '4:2'
  - marker: b
    text: The line about seven months of sickness and the departure of the spirit of jealousy reflects the transmitted chapter sequence known from this section of Reuben; the source layer is compressed here, so this rendering follows the extant Greek sense cautiously.
    reason: textual_variant
    anchor_ref: '4:4'
  - marker: d
    text: '''A stumbling block to Beliar'' is a difficult phrase. The Greek is preserved closely rather than paraphrased away.'
    reason: lexical_alternative
    anchor_ref: '4:7'
  - marker: c
    text: φάρμακα can mean 'drugs,' 'potions,' or magical preparations. The context of seduction and magicians supports 'potions.'
    reason: lexical_alternative
    anchor_ref: '4:9'
translation:
  language: ko
  text: '1. 그러므로 내 자녀들아, 여인들의 아름다움에 주의를 기울이지 말고 그들의 행위를 곰곰이 생각하지도 마십시오. 오히려 마음의 순전함으로, 주님을 경외하며, 선한 일과 배움과 너희 양 떼를 돌보는 일에 힘쓰십시오. 주님께서 친히 원하시는 아내를 너희에게 주실 때까지 그렇게 하십시오. 그래야 내가 겪은 것처럼 너희도 고통을 겪지 않을 것입니다.


    2. 내 아버지께서 돌아가실 때까지 나는 아버지의 얼굴을 똑바로 바라볼 담대함이 없었습니다.[a]


    3. 내 죄의 수치 때문에 내 생각은 내 안에서 늘 괴로움을 겪었습니다.


    4. 나는 칠 개월 동안 죽을 지경으로 앓았습니다. 주님 앞에서 온 마음으로 회개한 뒤에는 질투의 영이 내게서 떠났습니다. 지금까지 나는 스스로를 지켜 왔고 죄를 짓지 않았습니다.[b]


    5. 그러므로 내 자녀들아, 내가 너희에게 명령하는 모든 것을 지키십시오. 그러면 너희는 결코 죄를 짓지 않을 것입니다.


    6. 음행의 죄는 영혼의 구덩이입니다. 그것은 영혼을 하나님에게서 떼어 놓고 우상들에게 가까이 가게 합니다. 바로 이것이 생각과 판단력을 미혹하고, 젊은이들을 제때가 되기도 전에 하데스로 끌어내립니다.


    7. 음행은 많은 사람을 멸망시켰습니다. 사람이 늙었든, 귀족이든, 부자이든, 가난하든, 그는 사람들 앞에서 자기 자신에게 수치를 가져오고 벨리아르에게 걸림돌이 됩니다.[d]


    8. 너희는 요셉에 관하여 들었습니다. 그는 여자에게서 자신을 지키고 모든 음행에서 자기 생각을 깨끗하게 하여, 하나님과 사람들 앞에서 은혜를 얻었습니다.


    9. 이집트 여인은 그에게 많은 일을 꾸미고, 마술사들을 불러들이며, 그에게 약물을 가져왔습니다.[c] 그러나 요셉은 온갖 악한 욕망에서 자신을 지켰고, 자기 영혼의 꾀, 곧 악한 욕망을 받아들이지 않았습니다.


    10. 그러므로 너희 조상들의 하나님께서 그를 모든 숨은 악과 죽음에서 구해 내셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점의 그리스어 본문은 OCR 층에서 훼손되거나 압축되어 있습니다. 르우벤이 자신의 죄 때문에 아버지가 죽을 때까지 아버지의 얼굴을 마주 볼 자신이 없었다는 뜻으로 조심스럽게 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 칠 개월 동안의 병과 질투의 영이 떠났다는 진술은 이 르우벤 본문의 전승된 절 순서를 반영합니다. 제공된 원문 층은 이 대목에서 압축되어 있으므로, 현존 그리스어 본문의 뜻을 따라 신중히 번역했습니다.
    reason: textual_variant
  - marker: c
    text: φάρμακα는 ‘약물’, ‘물약’, 또는 마술적 조제물을 뜻할 수 있습니다. 마술사들이 언급되는 문맥에 따라 ‘약물’로 옮겼습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘벨리아르에게 걸림돌’이라는 표현은 그리스어에서도 난해합니다. 해석적으로 바꾸지 않고 원문의 표현을 가깝게 보존했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν προσέχετε
  english_pob_choice: do not pay attention to
  chosen_korean: 주의를 기울이지 마십시오
  alternatives_korean:
  - 눈길을 두지 마십시오
  - 귀를 기울이지 마십시오
  lexicon: BDAG
  rationale: 직설적 경계의 명령을 살리면서, 유혹적 대상에 마음을 두지 말라는 의미를 자연스럽게 전달합니다.
- source_word: κάλλος γυναικῶν
  english_pob_choice: the beauty of women
  chosen_korean: 여자의 아름다움
  alternatives_korean:
  - 여인들의 아름다움
  - 여성의 아름다움
  lexicon: LSJ
  rationale: 개별적·집합적 경계의 대상이 되는 표현을 한국어에서 가장 직접적으로 옮겼습니다.
- source_word: ἐννοεῖσθε τὰς πράξεις αὐτῶν
  english_pob_choice: dwell on their deeds
  chosen_korean: 그들의 행위를 곰곰이 생각하지도 말고
  alternatives_korean:
  - 그들의 행위를 마음에 두지도 말고
  - 그들의 행위를 생각하지도 말고
  lexicon: LSJ
  rationale: ἐννοεῖσθε의 내적 숙고를 드러내기 위해 단순한 '생각하다'보다 '곰곰이 생각하다'를 택했습니다.
- source_word: ἁπλότητι καρδίας
  english_pob_choice: simplicity of heart
  chosen_korean: 마음의 순전함
  alternatives_korean:
  - 마음의 단순함
  - 마음의 성실함
  lexicon: BDAG
  rationale: 직역인 '순전함'이 이 문맥의 분열되지 않은 내적 태도를 가장 잘 보존합니다.
- source_word: ἔργοις καλοῖς, καὶ ἐν γράμμασι
  english_pob_choice: good works ... and in learning
  chosen_korean: 선한 일과 학문
  alternatives_korean:
  - 선한 일과 글 읽기
  - 선한 일과 공부
  lexicon: LSJ
  rationale: '''γράμμασι''를 단순히 ''글자들''로 두기보다, 교육·배움의 뜻을 살려 ''학문''으로 옮겼습니다.'
- source_word: σύζυγον
  english_pob_choice: a wife
  chosen_korean: 아내
  alternatives_korean:
  - 배우자
  - 짝
  lexicon: LSJ
  rationale: 아버지의 권면 문맥에서 남성 후손에게 주어질 혼인 상대를 가장 직접적으로 나타냅니다.
- source_word: παρρησίαν
  english_pob_choice: boldness
  chosen_korean: 담대함
  alternatives_korean:
  - 대담함
  - 자유로이 나아갈 용기
  lexicon: BDAG
  rationale: 아버지의 얼굴을 마주볼 수 없는 심리적·사회적 용기를 한국어에서 자연스럽게 표현합니다.
- source_word: βόθρος
  english_pob_choice: pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 웅덩이
  - 함정
  lexicon: LSJ
  rationale: 비유의 물리적 이미지를 살리되, 한국어 성경 문체에 익숙한 '구덩이'를 사용했습니다.
- source_word: προσκομμα τῷ Βελίαρ
  english_pob_choice: a stumbling block to Beliar
  chosen_korean: 벨리아르에게는 걸림돌
  alternatives_korean:
  - 벨리아르에게는 넘어지는 장애
  - 벨리아르 앞의 걸림돌
  lexicon: LSJ
  rationale: 희귀한 표현을 과도하게 풀지 않고, 본문이 주는 직설적 이미지를 유지했습니다.
- source_word: φάρμακα
  english_pob_choice: potions
  chosen_korean: 약제
  alternatives_korean:
  - 독약
  - 물약
  - 혼합 약
  lexicon: LSJ
  rationale: 마술사들과 함께 나온 문맥을 살리면서도, '마법약'처럼 지나치게 해석하지 않도록 중립적으로 옮겼습니다.
- source_word: διαβούλιον τῆς ψυχῆς αὐτοῦ
  english_pob_choice: the counsel of his soul
  chosen_korean: 자기 영혼의 조언
  alternatives_korean:
  - 자기 내면의 뜻
  - 자기 영혼의 의논
  lexicon: LSJ
  rationale: 영혼 내부의 동의·조언이라는 이상한 문형을 가능한 한 그대로 보존했습니다.
theological_decisions:
- issue: ᾅδης의 번역
  chosen_reading: 하데스
  alternative_readings:
  - 무덤
  - 지옥
  rationale: 제2성전기 유대 문헌의 저승 이미지와 그리스어 원문을 살리기 위해 '하데스'를 유지했습니다.
  doctrine_reference: DOCTRINE.md §원어 우선 원칙
- issue: πορνεία와 우상 사이의 관계
  chosen_reading: 우상들에게 가까이 가게 합니다
  alternative_readings:
  - 우상숭배로 이끕니다
  - 우상들과 결합시킵니다
  rationale: 본문은 동일시보다 '가까이 가게 함'의 연결을 말하므로, 그 긴장을 과장하지 않고 보존했습니다.
  doctrine_reference: DOCTRINE.md §신학적 긴장 보존
