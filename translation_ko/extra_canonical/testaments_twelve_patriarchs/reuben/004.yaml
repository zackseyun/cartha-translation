  to: '1. 그러므로 내 자녀들아, 여인들의 아름다움에 주의를 기울이지 말고 그들의 행위를 곰곰이 생각하지도 마십시오. 오히려 마음의 순전함으로, 주님을 경외하며, 선한 일과 배움과 너희 양 떼를 돌보는 일에 힘쓰십시오. 주님께서 친히 원하시는 아내를 너희에게 주실 때까지 그렇게 하십시오. 그래야 내가 겪은 것처럼 너희도 고통을 겪지 않을 것입니다.


    2. 내 아버지께서 돌아가실 때까지 나는 아버지의 얼굴을 똑바로 바라볼 담대함이 없었습니다.[a]


    3. 내 죄의 수치 때문에 내 생각은 내 안에서 늘 괴로움을 겪었습니다.


    4. 나는 칠 개월 동안 죽을 지경으로 앓았습니다. 주님 앞에서 온 마음으로 회개한 뒤에는 질투의 영이 내게서 떠났습니다. 지금까지 나는 스스로를 지켜 왔고 죄를 짓지 않았습니다.[b]


    5. 그러므로 내 자녀들아, 내가 너희에게 명령하는 모든 것을 지키십시오. 그러면 너희는 결코 죄를 짓지 않을 것입니다.


    6. 음행의 죄는 영혼의 구덩이입니다. 그것은 영혼을 하나님에게서 떼어 놓고 우상들에게 가까이 가게 합니다. 바로 이것이 생각과 판단력을 미혹하고, 젊은이들을 제때가 되기도 전에 하데스로 끌어내립니다.


    7. 음행은 많은 사람을 멸망시켰습니다. 사람이 늙었든, 귀족이든, 부자이든, 가난하든, 그는 사람들 앞에서 자기 자신에게 수치를 가져오고 벨리아르에게 걸림돌이 됩니다.[d]


    8. 너희는 요셉에 관하여 들었습니다. 그는 여자에게서 자신을 지키고 모든 음행에서 자기 생각을 깨끗하게 하여, 하나님과 사람들 앞에서 은혜를 얻었습니다.


    9. 이집트 여인은 그에게 많은 일을 꾸미고, 마술사들을 불러들이며, 그에게 약물을 가져왔습니다.[c] 그러나 요셉은 온갖 악한 욕망에서 자신을 지켰고, 자기 영혼의 꾀, 곧 악한 욕망을 받아들이지 않았습니다.


    10. 그러므로 너희 조상들의 하나님께서 그를 모든 숨은 악과 죽음에서 구해 내셨습니다.'
