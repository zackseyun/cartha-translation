    7. 음행은 많은 사람을 멸망시켰습니다. 사람이 늙었든지, 귀족이든지, 부자든지, 가난한 사람이든지, 그는 사람들의 아들들 앞에서 자기 자신에게 수치를 가져오고 벨리아르에게는 걸림돌이 됩니다.


