review_pass:
  verdict: revise
  source_fidelity: ἐπιστρέψαντες is an aorist participle with antecedent action; ‘주님께 돌아오면’ makes it a condition and does not fully preserve the ‘having returned’ sense. ‘주님께 돌아온 뒤에는’ more directly reflects the sequence. The future passive ‘will receive mercy’ and the two future verbs concerning entry into the sanctuary and peace are retained.
  naturalness: ‘이와 같이’ and ‘돌아온 뒤에는’ are natural in modern formal-polite Korean. ‘평화를 주실 것입니다’ is clear, contemporary, and does not add a specialized theological sense absent from εἰρήνη.
  terminology: ‘주님,’ ‘자비를 입다,’ and ‘성소’ are appropriate. ‘평화’ is preferred over the more ecclesiastically marked ‘평강’ for the unqualified εἰρήνη. The unsupported [a][b] anchors must be removed because no corresponding footnotes are supplied.
  issues:
  - severity: medium
    issue: 분사 ἐπιστρέψαντες가 조건절 ‘주님께 돌아오면’으로 옮겨졌습니다.
    rationale: 원문과 영어 감사 기록은 ‘돌아온 후/돌아와서’라는 선행 행위를 나타냅니다. 조건적 표현은 의미 관계를 다소 바꿉니다.
  - severity: medium
    issue: 본문에 [a][b] 각주 표지가 있으나 제공된 각주가 없습니다.
    rationale: 연결되지 않은 각주 표지는 구조상 부정확하므로 삭제해야 합니다.
  - severity: low
    issue: εἰρήνην을 ‘평강’으로 한정했습니다.
    rationale: 문맥상 가능한 번역이지만, 원문은 별도의 언약적·교회적 의미를 명시하지 않습니다. ‘평화’가 더 중립적이고 현대 표준어에 가깝습니다.
  revised_text: 그리고 이와 같이 주님께 돌아온 뒤에는 자비를 입을 것이며, 그분께서 여러분을 그분의 성소로 데려가시고 평화를 주실 것입니다.
