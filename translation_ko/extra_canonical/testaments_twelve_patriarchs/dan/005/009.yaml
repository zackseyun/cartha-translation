id: T12P.DAN.5.9
reference: Testament of Dan 5:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὕτως⁷⁷ ἐπιστρέψαντες⁷⁸ πρὸς Κύριον ἐλεηθήσεσθε⁷⁹ καὶ ἄξει ὑμᾶς⁸⁰ εἰς τὸ ἁγίασμα αὐτοῦ *καὶ δώσει⁸¹ ὑμῖν εἰρήνην⁸².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/009.yaml
  text: And so, having returned to the Lord, you will receive mercy, and he will bring you into his sanctuary and give you peace.
translation:
  language: ko
  text: 그리고 이와 같이 주님께 돌아온 뒤에는 자비를 입을 것이며, 그분께서 여러분을 그분의 성소로 데려가시고 평화를 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψαντες
  english_pob_choice: having returned
  chosen_korean: 주님께 돌아오면
  alternatives_korean:
  - 주님께 돌아간 뒤
  - 주님께 돌아와
  lexicon: ἐπιστρέφω
  rationale: 분사 구조를 조건적·선행적 의미로 자연스럽게 풀어, POB의 ‘having returned’에 맞는 완료성은 살리되 한국어에서는 너무 직역적이지 않게 처리했습니다.
- source_word: ἐλεηθήσεσθε
  english_pob_choice: you will receive mercy
  chosen_korean: 자비를 입을 것이며
  alternatives_korean:
  - 긍휼을 얻을 것이며
  - 자비를 받을 것이며
  lexicon: ἐλεέω
  rationale: 수동형의 의미를 살려 ‘자비를 입다’로 옮겨, 단순한 감정보다 하나님으로부터 베푸심을 받는 뉘앙스를 드러냈습니다.
- source_word: ἁγίασμα
  english_pob_choice: his sanctuary
  chosen_korean: 그분의 성소
  alternatives_korean:
  - 그분의 성전
  - 그분의 거룩한 곳
  lexicon: ἁγίασμα
  rationale: 예배적·거룩한 장소를 가리키는 말로 보아, 한국어 성경에서 자연스러운 ‘성소’를 택했습니다.
- source_word: εἰρήνην
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  lexicon: εἰρήνη
  rationale: 이 문맥에서 단순한 정서적 평온보다 하나님이 주시는 언약적 복을 나타내므로 ‘평강’으로 옮겼습니다.
theological_decisions:
- issue: 회귀의 방향성
  chosen_reading: ‘주님께 돌아오면’으로 옮겨, 단순한 감정 변화가 아니라 하나님께로의 실제적 회심을 드러냈습니다.
  alternative_readings:
  - 주님께 돌아서면
  - 주님께 돌아가면
  rationale: 문맥상 도덕적 개선이 아니라 주님께로의 귀환이 핵심이므로, 회심의 방향을 분명히 했습니다.
  doctrine_reference: 회개와 회심
- issue: 성소의 의미
  chosen_reading: ‘그분의 성소’는 하나님 임재의 거룩한 처소로 이해했습니다.
  alternative_readings:
  - 그분의 성전
  - 그분의 거룩한 처소
  rationale: ἁγίασμα는 단순 건물보다 거룩하게 구별된 임재의 장소를 가리키므로, 예배적·신학적 함의를 보존했습니다.
  doctrine_reference: 하나님의 임재와 예배
