id: T12P.DAN.5.5
reference: Testament of Dan 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ὡς ἂν ἀποστήσεσθε⁴⁰ ἀπὸ⁴¹ Κυρίου⁴², *ἐν πάσῃ κακίᾳ⁴³ *πορευόμενοι ποιήσετε τὰ βδελύγματα τῶν ἐθνῶν ἐκπορνεύοντες ἐν⁴⁴ γυναιξὶν ἀνόμων⁴⁵ καὶ ἐν πάσῃ πονηρίᾳ⁴⁶ ἐνεργούντων⁴⁷ ⌈ἐν ὑμῖν⌉¹ *τῶν πνευμάτων⁴⁸ τῆς πονηρίας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/005.yaml
  text: And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and every evil will be at work among you through the spirits of wickedness.
translation:
  language: ko
  text: 그리고 여러분이 주님에게서 떠나 온갖 악을 행하며 이방 민족들의 가증한 일들을 행하고 무법한 여자들과 음행하면, 악의 영들이 여러분 가운데서 온갖 악을 일으킬 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  english_pob_choice: you depart from the Lord
  chosen_korean: 주님에게서 떠나
  alternatives_korean:
  - 주님을 떠나
  - 주님에게서 돌아서
  lexicon: ἀφίστημι / ἀπό
  rationale: 관계적 분리를 드러내기 위해 ‘~에게서 떠나다’를 택했고, 전치사 ἀπό의 이탈 방향을 자연스럽게 반영했습니다.
- source_word: ἐν πάσῃ κακίᾳ πορευόμενοι
  english_pob_choice: walking in every wickedness
  chosen_korean: 온갖 악 가운데서 걸어가며
  alternatives_korean:
  - 모든 악 가운데서 행하며
  - 각종 악 가운데 걸어가며
  lexicon: πορεύομαι + ἐν πάσῃ κακίᾳ
  rationale: ‘걷다/걸어가다’의 행실 은유를 살리면서, πάσῃ를 ‘온갖’으로 옮겨 포괄성을 자연스럽게 표현했습니다.
- source_word: τὰ βδελύγματα τῶν ἐθνῶν
  english_pob_choice: the abominations of the nations
  chosen_korean: 이방 민족들의 가증한 일들
  alternatives_korean:
  - 민족들의 가증한 것들
  - 이방들의 가증한 일들
  lexicon: βδέλυγμα
  rationale: βδέλυγμα의 강한 혐오·가증성을 ‘가증한 일들’로 옮기고, τῶν ἐθνῶν은 문맥상 ‘이방 민족들’로 분명히 했습니다.
- source_word: ἐκπορνεύοντες ἐν γυναιξὶν ἀνόμων
  english_pob_choice: prostituting yourselves with lawless women
  chosen_korean: 무법한 여자들과 음행하고
  alternatives_korean:
  - 무법한 여자들과 더불어 음행하고
  - 불법한 여자들과 음행하며
  lexicon: ἐκπορνεύω + ἐν γυναιξίν ἀνόμων
  rationale: ‘prostituting yourselves’의 노골성을 ‘음행하다’로 직역에 가깝게 옮기되, 한국어에서 비문이 되지 않도록 동반구문으로 정리했습니다. ἀνόμων은 ‘무법한’으로 옮겨 윤리적 일탈성을 유지했습니다.
- source_word: τῶν πνευμάτων τῆς πονηρίας
  english_pob_choice: through the spirits of wickedness
  chosen_korean: 악의 영들을 통해
  alternatives_korean:
  - 악한 영들을 통해
  - 악의 영들로 말미암아
  lexicon: πνεύματα + πονηρία
  rationale: 문구는 다수의 영적 존재를 가리키는 구조로 읽혀 복수형을 살렸고, πονηρίας는 소유격 관계를 반영해 ‘악의 영들’로 옮겼습니다.
theological_decisions:
- issue: ‘주님’이 가리키는 신적 호칭의 번역
  chosen_reading: κύριος는 여기서 언약적 호칭으로서 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 본문은 구약적 언어를 반영하지만, 인용 표지 없이 단독으로 나타나므로 본문 가독성과 경건체 균형을 위해 ‘주님’을 유지했습니다.
  doctrine_reference: 그리스어 본문에서의 κύριος 용례와 구약적 호칭 번역 원칙
- issue: ‘악의 영들’의 다중성
  chosen_reading: τῶν πνευμάτων τῆς πονηρίας는 단수의 추상 개념이 아니라 악한 영적 존재들의 작용으로 이해했습니다.
  alternative_readings:
  - 악의 영
  - 악한 영들
  - 악령들
  rationale: 복수 속격 구조와 English POB의 ‘the spirits of wickedness’를 따라, 본문이 묘사하는 악의 실재성을 희석하지 않도록 복수형을 유지했습니다.
  doctrine_reference: 영적 존재에 관한 본문 내 문법적 복수성
