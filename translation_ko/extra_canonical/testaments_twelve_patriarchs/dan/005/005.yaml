revisions:
- from: 그리고 여러분이 주님에게서 떠나, 온갖 악 가운데서 걸어가면, 이방 민족들의 가증한 일들을 행하게 될 것입니다. 곧 무법한 여자들과 음행하고, 온갖 악이 여러분 가운데서 악의 영들을 통해 일하게 될 것입니다.[a][b][c]
  to: 그리고 여러분이 주님에게서 떠나 온갖 악을 행하며 이방 민족들의 가증한 일들을 행하고 무법한 여자들과 음행하면, 악의 영들이 여러분 가운데서 온갖 악을 일으킬 것입니다.[a][b][c]
  rationale: 마지막 속격 절의 주어를 ‘악의 영들’로 바로잡아 그리스어 문법을 반영했습니다. 조건·시간적 ὡς ἂν과 미래 귀결은 ‘…하면, …것입니다’로 자연스럽게 표현했으며, 나머지 핵심 어휘와 복수형은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:32Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 본문의 마지막 구절에서 ἐνεργούντων은 복수 속격인 ‘악의 영들’(τῶν πνευμάτων τῆς πονηρίας)에 연결되어, 그 영들이 ‘여러분 가운데서’ 활동/작용하는 것을 나타냅니다. 현 번역의 ‘온갖 악이 … 악의 영들을 통해 일하게 될 것입니다’는 ‘악’을 행위 주체로, 영들을 수단으로 바꾸어 원문의 문법적 관계를 뒤집습니다.
  naturalness: ‘온갖 악 가운데서 걸어가면’은 한국어에서 다소 직역투입니다. 행실의 은유를 보존하면서 자연스럽게 ‘온갖 악을 행하며’로 옮길 수 있습니다. 또한 마지막은 ‘악의 영들이 여러분 가운데서 온갖 악을 일으킬 것입니다’가 주어와 작용을 분명히 합니다.
  terminology: κύριος의 ‘주님’, βδελύγματα의 ‘가증한 일들’, ἐκπορνεύοντες의 ‘음행하고’, ἄνομοι의 ‘무법한’은 문맥과 격식에 맞습니다. πνεύματα τῆς πονηρίας는 복수성을 살려 ‘악의 영들’로 유지합니다.
  issues:
  - severity: high
    issue: 마지막 절의 행위 주체와 관계가 역전되어 있습니다.
    rationale: ἐνεργούντων은 τῶν πνευμάτων(‘영들’)을 수식합니다. 따라서 영들이 여러분 가운데서 온갖 악과 관련하여 활동하는 것이며, ‘온갖 악이 영들을 통해 일한다’가 아닙니다.
  - severity: low
    issue: ‘온갖 악 가운데서 걸어가면’이 부자연스럽습니다.
    rationale: πορευόμενοι의 윤리적 행실 은유는 한국어에서 ‘온갖 악을 행하며’로 옮기는 편이 자연스럽고 의미도 보존합니다.
  revised_text: 그리고 여러분이 주님에게서 떠나 온갖 악을 행하며 이방 민족들의 가증한 일들을 행하고 무법한 여자들과 음행하면, 악의 영들이 여러분 가운데서 온갖 악을 일으킬 것입니다.[a][b][c]
  revised_footnotes: []
