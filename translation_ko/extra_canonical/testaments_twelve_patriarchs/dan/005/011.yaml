  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὴν αἰχμαλωσίαν λήψεται⁸⁹ ἀπὸ τοῦ Βελίαρ, [τὰς ψυχὰς τῶν ἁγίων]⁹⁰, *καὶ ἐπιστρέψει⁹¹ καρδίας⁹² ἀπειθεῖς⁹³ πρὸς Κύριον. καὶ δώσει *τοῖς ἐπικαλουμένοις αὐτὸν⁹⁴ εἰρήνην αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/011.yaml
  text: And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.
translation:
  language: ko
  text: 그리고 그는 벨리알에게서 포로들을, 곧 거룩한 이들의 영혼들을 되찾고, 불순종하는 마음들을 주님께로 돌리며, 그를 부르는 이들에게 영원한 평강을 주실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν αἰχμαλωσίαν λήψεται ... ἀπὸ τοῦ Βελίαρ
  english_pob_choice: he will take the captivity from Beliar
  chosen_korean: 벨리알에게서 포로들을 되찾고
  alternatives_korean:
  - 벨리알에게서 포로 생활을 거두고
  - 벨리알에게서 사로잡힌 자들을 데려오고
  lexicon: αἰχμαλωσίαν; Βελίαρ
  rationale: 문맥상 ‘captivity’는 추상적 상태보다 포로 된 사람들을 가리키는 표현으로 읽히므로, 한국어에서는 자연스럽게 ‘포로들’로 옮겼습니다. ‘되찾고’는 벨리알에게서 해방시키는 회복의 뉘앙스를 살립니다.
- source_word: τὰς ψυχὰς τῶν ἁγίων
  english_pob_choice: even the souls of the holy ones
  chosen_korean: 곧 거룩한 이들의 영혼들을
  alternatives_korean:
  - 곧 성도들의 영혼들을
  - 곧 거룩한 자들의 혼들을
  lexicon: ψυχὰς; ἁγίων
  rationale: ἅγιοι는 여기서 파울로스 서신의 기술용어 ‘성도’가 아니라, 본문 자체의 표현을 따라 ‘거룩한 이들’로 직역하는 편이 더 직접적입니다. ψυχή는 ‘영혼’으로 유지했습니다.
- source_word: καρδίας ἀπειθεῖς πρὸς Κύριον
  english_pob_choice: disobedient hearts to the Lord
  chosen_korean: 불순종하는 마음들을 주님께로 돌리며
  alternatives_korean:
  - 불순종하는 마음들을 주님께 향하게 하며
  - 주님께 불순종하던 마음들을
  lexicon: ἀπειθεῖς; καρδίας; πρὸς Κύριον
  rationale: ‘마음들’을 단순히 보존하면서, πρὸς의 방향성을 한국어 동사 ‘돌리다’로 나타내어 회심/전환의 동작을 드러냈습니다. κύριος는 메시아/주에 대한 문맥상 ‘주님’으로 옮겼습니다.
- source_word: τοῖς ἐπικαλουμένοις αὐτὸν εἰρήνην αἰώνιον
  english_pob_choice: eternal peace to those who call on him
  chosen_korean: 그를 부르는 이들에게 영원한 평강을
  alternatives_korean:
  - 그를 부르는 이들에게 영원한 평안을
  - 그를 부르는 자들에게 영원한 평강을
  lexicon: ἐπικαλουμένοις; εἰρήνην αἰώνιον
  rationale: ἐπικαλέομαι는 단순한 호명이 아니라 도움과 구원을 구하는 ‘부르다’이므로 그대로 유지했습니다. εἰρήνη는 프로젝트 기본어인 ‘평강’을 사용했고, αἰώνιος는 종말론적 지속성을 살려 ‘영원한’으로 옮겼습니다.
theological_decisions:
- issue: Beliar as personal evil power
  chosen_reading: 벨리알을 인격적 악의 세력으로 이해하여 그대로 음역했습니다.
  alternative_readings:
  - 벨리알을 ‘사탄’으로 의역하기
  - 벨리알을 일반적 악으로 완화하기
  rationale: 본문은 벨리알을 포로를 붙잡고 있는 주체로 제시하므로, 전통적 해석을 따라도 고유명사로 보존하는 편이 원문 긴장을 가장 잘 드러냅니다.
  doctrine_reference: Second Temple demonology / apocalyptic dualism
- issue: κύριος in a paraenetic turn
  chosen_reading: 여기서 Κύριος를 ‘주님’으로 옮기되, 예배적 호칭으로 과도하게 신학화하지는 않았습니다.
  alternative_readings:
  - ‘야훼’로 옮기기
  - ‘주’로만 옮기기
  rationale: 이 단락은 인용 표지가 없는 일반적인 권면문맥이므로, 70인역적 야훼 인용 표식은 적용하지 않았습니다. 한국어 독자는 문맥상 ‘주님’으로 이해하면 충분합니다.
  doctrine_reference: κύριος usage in non-explicit quotation context
