  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ⌈Καὶ⌉⁶⁹ διὰ τοῦτο ἀπαχθήσεσθε⁷⁰ [σὺν αὐτοῖς]⁷¹ *εἰς αἰχμαλωσίαν⁷², κἀκεῖ ἀπολήψεσθε⁷³ *πάσας τὰς πληγὰς Αἰγύπτου⁷⁴ καὶ πάσας τὰς⁷⁵ πονηρίας⁷⁶ τῶν ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/008.yaml
  text: Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.
translation:
  language: ko
  text: 그러므로 너희는 그들과 함께 포로로 끌려가게 될 것이며, 거기서 너희는 이집트의 모든 재앙과 민족들의 모든 악을 받게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαχθήσεσθε
  english_pob_choice: you will be led away
  chosen_korean: 포로로 끌려가게 될 것입니다
  alternatives_korean:
  - 끌려가게 될 것입니다
  - 사로잡혀 끌려가게 될 것입니다
  lexicon: ἀπάγω
  rationale: 단순한 이동이 아니라 강제적으로 끌려가는 수동 의미를 살려, POB의 ‘led away’에 맞게 포로 상황을 드러냈습니다.
- source_word: εἰς αἰχμαλωσίαν
  english_pob_choice: into captivity
  chosen_korean: 포로로
  alternatives_korean:
  - 포로 상태로
  - 사로잡힘 가운데
  lexicon: αἰχμαλωσία
  rationale: ‘into captivity’를 자연스럽게 옮기되, 한국어에서는 ‘포로로’가 상태와 결과를 함께 드러내어 문맥상 가장 간명합니다.
- source_word: πληγὰς Αἰγύπτου
  english_pob_choice: the plagues of Egypt
  chosen_korean: 이집트의 모든 재앙
  alternatives_korean:
  - 이집트의 재앙들
  - 이집트의 모든 재앙들
  lexicon: πληγή
  rationale: ‘plagues’를 재앙으로 옮기고, 원문의 복수성과 POB의 all을 반영해 ‘모든’으로 포괄성을 살렸습니다.
- source_word: πονηρίας τῶν ἐθνῶν
  english_pob_choice: the evils of the nations
  chosen_korean: 민족들의 모든 악
  alternatives_korean:
  - 민족들의 악행
  - 열방의 모든 악
  lexicon: πονηρία
  rationale: πονηρία의 도덕적 악함을 살리면서, τῶν ἐθνῶν을 직역에 가깝게 ‘민족들’로 옮겨 원문의 범위를 유지했습니다.
theological_decisions:
- issue: 지시대명사 ‘그들과 함께’의 포함
  chosen_reading: 원문의 [σὺν αὐτοῖς]에 따라 ‘그들과 함께’를 본문에 반영했습니다.
  alternative_readings:
  - 생략하여 ‘포로로 끌려가게 될 것이며’로만 번역
  - 각주로 처리
  rationale: 편집 괄호가 표시하는 동반성을 한국어 본문에 드러내는 편이 문장 의미와 POB의 의미 단위를 더 분명하게 보존합니다.
  doctrine_reference: source criticism / textual transmission
- issue: 재앙과 악의 병렬 구조
  chosen_reading: ‘이집트의 모든 재앙과 민족들의 모든 악’을 병렬로 유지했습니다.
  alternative_readings:
  - ‘이집트의 재앙과 민족들의 악’
  - 의미를 완화해 단일 개념으로 통합
  rationale: 원문은 두 집합을 평행하게 제시하므로, 두 항목을 분리해 번역해야 경고적 수사의 강도를 보존할 수 있습니다.
  doctrine_reference: rhetorical fidelity
