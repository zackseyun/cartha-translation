  text: Love the Lord all your life, and one another with a true heart.
translation:
  language: ko
  text: 주님을 평생 사랑하고, 서로를 참된 마음으로 사랑하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 직접 호소형 권면문맥에서 하나님을 가리키는 κύριος는 한국어 합쇼체에서 자연스럽고 경건한 호칭인 ‘주님’으로 옮겼습니다. 본문은 명시적 야훼 인용이 아니라 직접적 권면이므로 ‘야훼’로 바꾸지 않았습니다.
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  english_pob_choice: all your life
  chosen_korean: 평생
  alternatives_korean:
  - 전 생애에 걸쳐
  - 여러분의 삶 전체에서
  - 살아 있는 모든 날 동안
  lexicon: ζωή
  rationale: 영어 POB의 수정본처럼 ἐν πάσῃ τῇ ζωῇ ὑμῶν의 뜻을 과장하지 않으면서 한국어로 자연스럽게 살려 ‘평생’으로 압축했습니다.
- source_word: ἀλλήλους ἐν ἀληθινῇ καρδίᾳ
  english_pob_choice: one another with a true heart
  chosen_korean: 서로를 참된 마음으로 사랑하십시오
  alternatives_korean:
  - 서로를 진실한 마음으로 사랑하십시오
  - 서로를 참마음으로 사랑하십시오
  - 서로를 진정한 마음으로 사랑하십시오
  lexicon: ἀλλήλους / ἀληθινή / καρδία
  rationale: ἀλλήλους 앞의 사랑 동사를 한국어에서 반복해 주어, 문맥상 요구되는 상호 사랑을 분명하게 드러냈습니다. ἀληθινῇ καρδίᾳ는 관용적으로 ‘참된 마음’으로 옮겨 진실성과 내적 진정성을 함께 살렸습니다.
theological_decisions:
- issue: ‘주님’의 식별과 신학적 중립성
  chosen_reading: 본문의 Κύριον은 일반적 종교 호칭이 아니라 공동체가 충성해야 할 주님을 가리키는 표현으로 읽되, 별도의 구약 인용 표지가 없으므로 ‘야훼’ 표기는 적용하지 않았습니다.
  alternative_readings:
  - 야훼를 사랑하십시오
  - 주를 사랑하십시오
  rationale: 헬라어 본문 자체는 호칭만 제공하며, 이 절에서는 직접적인 LXX 인용 징후가 없으므로 POB의 야훼 규칙을 적용하지 않는 것이 더 엄밀합니다.
  doctrine_reference: κύριος / YHWH 구분 원칙
