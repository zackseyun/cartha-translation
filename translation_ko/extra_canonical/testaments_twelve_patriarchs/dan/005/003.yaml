  source_fidelity: ‘주님을 평생 사랑하고, 서로를 참된 마음으로 사랑하십시오’는 Ἀγαπήσατε의 복수 명령, τὸν Κύριον, ἐν πάσῃ τῇ ζωῇ ὑμῶν, 그리고 ἀλλήλους ἐν ἀληθινῇ καρδίᾳ를 충실하게 반영합니다. 한국어에서 두 번째 ‘사랑하십시오’를 보충한 것은 헬라어의 공통 동사가 두 목적어에 걸리는 구조를 자연스럽고 분명하게 드러냅니다.
