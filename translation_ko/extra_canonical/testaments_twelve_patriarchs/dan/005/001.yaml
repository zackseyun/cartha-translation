reference: Testament of Dan 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: V. Φυλάξατε¹ οὖν, *τέκνα μου², *τὴν ἐντολὴν³ τοῦ⁴ Κυρίου καὶ τὸν νόμον αὐτοῦ τηρήσατε⁵· ἀπόστητε⁶ ἀπὸ τοῦ⁷ θυμοῦ⁸, καὶ μισήσατε⁹ τὸ ψεῦδος, ἵνα¹⁰ *Κύριος κατοικήσει ἐν ὑμῖν¹¹ καὶ φεύξεται¹² *ἀφ᾽ ὑμῶν¹³ ὁ Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/001.yaml
  text: Therefore, my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.
translation:
  language: ko
  text: 그러므로, 내 자녀들아, 주님의 명령을 지키고 그분의 율법을 지키십시오. 분노에서 떠나고 거짓을 미워하십시오. 그러면 주님께서 여러분 안에 거하시고 벨리알이 여러분에게서 달아날 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε ... τὴν ἐντολὴν τοῦ Κυρίου
  english_pob_choice: keep the commandment of the Lord
  chosen_korean: 주님의 명령을 지키고
  alternatives_korean:
  - 주님의 계명을 지키고
  - 주님의 명령을 간직하고
  lexicon: ἐντολή
  rationale: ἐντολή는 단일한 ‘명령’의 의미가 분명하므로, 전통적 ‘계명’보다 직접적인 ‘명령’을 택했습니다.
- source_word: τὸν νόμον αὐτοῦ τηρήσατε
  english_pob_choice: keep his law
  chosen_korean: 그분의 율법을 지키십시오
  alternatives_korean:
  - 그분의 법을 지키십시오
  - 그분의 율법을 준수하십시오
  lexicon: νόμος
  rationale: 여기서 νόμος는 토라적 의미의 율법이 가장 자연스러워 ‘율법’을 유지했고, τηρέω는 ‘준수하다’보다 반복 명령의 평행성을 살려 ‘지키다’로 옮겼습니다.
- source_word: ἀπόστητε ἀπὸ τοῦ θυμοῦ
  english_pob_choice: Depart from anger
  chosen_korean: 분노에서 떠나고
  alternatives_korean:
  - 분노를 떠나고
  - 분노로부터 물러나고
  lexicon: ἀφίστημι
  rationale: ἀπόστητε는 단순한 회피보다 ‘떼어 나가다/떠나다’의 뉘앙스가 있어, 대상이 되는 분노로부터의 분리를 간결하게 표현했습니다.
- source_word: μισήσατε τὸ ψεῦδος
  english_pob_choice: hate falsehood
  chosen_korean: 거짓을 미워하십시오
  alternatives_korean:
  - 거짓말을 미워하십시오
  - 허위를 미워하십시오
  lexicon: ψεῦδος
  rationale: ψεῦδος는 특정한 ‘거짓말’보다 더 넓은 ‘거짓/허위’이므로, 문맥상 윤리적 대립을 살리는 ‘거짓’을 선택했습니다.
- source_word: Κύριος κατοικήσει ἐν ὑμῖν
  english_pob_choice: the Lord may dwell in you
  chosen_korean: 주님께서 여러분 안에 거하시고
  alternatives_korean:
  - 주님께서 여러분 가운데 거하시고
  - 주님께서 여러분 안에 머무시고
  lexicon: κατοικέω
  rationale: ἐν ὑμῖν을 문자적으로 살려 ‘여러분 안에’로 옮기되, κατοικήσει는 단순 체류보다 ‘거하시다’가 더 적절합니다.
- source_word: ὁ Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리알
  alternatives_korean:
  - 벨리아르
  - 벨리알
  lexicon: Βελίαρ
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, 본문 반복성과 식별성을 위해 일관된 형태를 사용했습니다.
theological_decisions:
- issue: 주님의 현존 표현(ἐν ὑμῖν)
  chosen_reading: ‘여러분 안에 거하시고’로 번역해 내적 임재를 분명히 했습니다.
  alternative_readings:
  - 여러분 가운데 거하시고
  - 여러분 사이에 거하시고
  rationale: 영문 POB의 최신 수정이 ‘dwell in you’로 정리한 점을 반영해, 공동체적 임재보다 내주적 의미를 우선했습니다.
  doctrine_reference: source alignment / auditable revision pass
- issue: 명령의 병렬 구조
  chosen_reading: 두 개의 지시형을 모두 ‘지키고 / 지키십시오’로 유지해 구조적 평행을 살렸습니다.
  alternative_readings:
  - 명령을 지키고 법을 준수하십시오
  - 명령을 지키며 율법을 지키십시오
  rationale: 원문의 두 동사(Φυλάξατε, τηρήσατε)는 모두 보존/준수의 의무를 나타내므로, 한국어에서도 반복을 통해 강조 효과를 유지했습니다.
  doctrine_reference: source syntax / discourse parallelism
