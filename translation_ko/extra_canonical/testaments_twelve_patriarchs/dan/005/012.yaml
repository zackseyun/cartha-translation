id: T12P.DAN.5.12
reference: Testament of Dan 5:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἀναπαύσονται ἐν Ἐδὲμ ἅγιοι⁹⁵, καὶ ἐπὶ *τῆς νέας⁹⁶ Ἱερουσαλὴμ εὐφρανθήσονται δίκαιοι, *ἥτις ἐστι δόξα θεοῦ αἰώνιος⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/012.yaml
  text: And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.
translation:
  language: ko
  text: 그리고 거룩한 이들은 에덴에서 쉬게 될 것이며, 의인들은 새 예루살렘 위에서 기뻐할 것입니다. 그것은 하나님의 영원한 영광입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπαύσονται
  english_pob_choice: will rest
  chosen_korean: 쉬게 될 것입니다
  alternatives_korean:
  - 안식할 것입니다
  - 쉼을 누릴 것입니다
  lexicon: ἀναπαύομαι
  rationale: 미래형의 ‘rest’를 자연스러운 합쇼체로 옮기되, 단순 휴식보다 종말론적 안식의 뉘앙스를 살렸습니다.
- source_word: ἐν Ἐδὲμ
  english_pob_choice: in Eden
  chosen_korean: 에덴에서
  alternatives_korean:
  - 에덴 안에서
  - 에덴에
  lexicon: Ἐδέμ
  rationale: 장소 부사구로 가장 सीधे한 ‘-에서’를 사용해 원문의 거주/머묾을 분명히 했습니다.
- source_word: ἐπὶ τῆς νέας Ἱερουσαλήμ
  english_pob_choice: over the new Jerusalem
  chosen_korean: 새 예루살렘 위에서
  alternatives_korean:
  - 새 예루살렘에서
  - 새 예루살렘 위에
  - 새 예루살렘을 두고
  lexicon: ἐπί + genitive
  rationale: 개정된 영어처럼 ἐπί의 방향·관련성을 반영해 ‘안에서’가 아니라 ‘위에서’로 옮겼습니다.
- source_word: ἥτις ἐστι δόξα θεοῦ αἰώνιος
  english_pob_choice: which is the eternal glory of God
  chosen_korean: 그것은 하나님의 영원한 영광입니다
  alternatives_korean:
  - 그것은 하나님의 영원한 영광입니다
  - 이는 하나님의 영원한 영광입니다
  lexicon: ἥτις + δόξα θεοῦ αἰώνιος
  rationale: 관계절의 지시를 유지하면서, ‘영원한 영광’이라는 소유격 구조를 직역보다 자연스럽게 한국어로 정리했습니다.
theological_decisions:
- issue: ‘holy ones’와 ‘righteous’의 종말론적 대상 구분
  chosen_reading: 거룩한 이들 / 의인들로 구분해 번역했습니다
  alternative_readings:
  - 성도들 / 의인들
  - 거룩한 자들 / 의인들
  rationale: 원문은 두 집단을 병렬로 제시하므로, 첫 항목은 ἅγιοι의 직접적 의미를 살려 ‘거룩한 이들’로, 둘째는 δίκαιοι를 ‘의인들’로 유지했습니다.
  doctrine_reference: 성결과 의인의 종말론적 상급에 대한 일반적 성경적 표상
- issue: ‘하나님의 영원한 영광’의 서술 관계
  chosen_reading: 새 예루살렘을 가리키는 설명절로 처리했습니다
  alternative_readings:
  - 새 예루살렘은 하나님의 영원한 영광입니다
  - 그것은 하나님의 영원한 영광이기에
  rationale: 개정된 영어의 which is를 따라 설명절로 처리해, 새 예루살렘의 정체성을 직접적으로 규정하는 문장 구조를 보존했습니다.
  doctrine_reference: 묵시문학의 상징적 동일시
