source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἀνατελεῖ ὑμῖν *ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευὶ τὸ σωτήριον Κυρίου⁸³, *αὐτὸς γὰρ⁸⁴ ποιήσει πρὸς τὸν Βελίαρ πόλεμον⁸⁵, καὶ τὴν ἐκδίκησιν τοῦ νίκους δώσει τοῖς⁸⁶ †πατράσιν⁸⁷ ὑμῶν⁸⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/010.yaml
  text: And for you the salvation of the Lord will arise from the tribe of Judah and Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.
translation:
  language: ko
  text: 그리고 여러분을 위하여 주님의 구원이 유다와 레위의 지파에서[a] 일어날 것입니다. 그분 자신이 벨리알과 전쟁을 벌이실 것이며, 여러분의 조상들에게 승리의 응징을 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 “유다와”(Ἰούδα καὶ)가 대괄호 안에 있어 본문 전승상 불확실함을 나타냅니다. 이를 제외하면 “레위 지파에서”가 됩니다.
    reason: 원전 판본이 표시한 이문적 불확실성을 보존합니다.
lexical_decisions:
- source_word: τὸ σωτήριον Κυρίου
  english_pob_choice: the salvation of the Lord
  chosen_korean: 야훼의 구원
  alternatives_korean:
  - 주님의 구원
  - 주님의 구원의 역사
  lexicon: σωτήριον
  rationale: 구원의 행위나 결과를 가리키는 명사구이므로, POB의 'salvation'을 따라 간결하게 '구원'으로 옮기고, κύριος는 본문 맥락상 야훼를 가리키는 신명 인용적 표현으로 보아 '야훼'로 처리했습니다.
- source_word: ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευί
  english_pob_choice: from the tribe of Judah and Levi
  chosen_korean: 유다와 레위 지파에서
  alternatives_korean:
  - 유다 지파와 레위 지파에서
  - 유다와 레위의 지파에서
  lexicon: φυλή
  rationale: 연결된 두 이름을 한 번의 '지파'로 묶는 영어 POB의 해석을 반영하여, 한국어에서도 자연스럽게 '유다와 레위 지파'로 처리했습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리알
  alternatives_korean:
  - 벨리아르
  - 베리알
  lexicon: Βελίαρ
  rationale: 고유명사는 현대 외래어 표기법에 따라 음역했으며, 한국 독자가 악한 존재로 식별할 수 있도록 통용 가능한 '벨리알'을 택했습니다.
- source_word: τὴν ἐκδίκησιν τοῦ νίκους
  english_pob_choice: the vengeance of victory
  chosen_korean: 승리의 복수
  alternatives_korean:
  - 승리의 응징
  - 승리의 보복
  lexicon: ἐκδίκησις
  rationale: 직역하면 다소 중첩적이지만, 본문이 말하는 것은 승리와 결부된 응징이므로 POB의 문맥을 유지하면서도 한국어로는 '승리의 복수'가 가장 간결하고 충실합니다.
theological_decisions:
- issue: κύριος의 지시 대상
  chosen_reading: 이 구절의 '주'는 일반적 주인이 아니라 야훼를 가리키는 신명적 표현으로 보아 '야훼의 구원'으로 옮겼습니다.
  alternative_readings:
  - 주님의 구원
  - 주께서 주시는 구원
  rationale: 문맥상 구원의 근원이 하나님에게 있으며, 메시아적 승리 선언 안에서 주어지는 구원이라는 점을 분명히 하기 위해 신명 번역을 택했습니다.
  doctrine_reference: OT citation / divine name rendering
