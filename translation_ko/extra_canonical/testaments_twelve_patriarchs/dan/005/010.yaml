    text: 그리스어 본문에는 “유다와”(Ἰούδα καὶ)가 대괄호 안에 있어 본문 전승상 불확실함을 나타냅니다. 이를 제외하면 “레위 지파에서”가 됩니다.
    reason: 원전 판본이 표시한 이문적 불확실성을 보존합니다.
  revision_rationale: Revised κύριος to the source-neutral "주님," clarified the compact tribal phrase without resolving its textual difficulty, replaced the dangling footnote with a note at the disputed words, and used a more natural formal equivalent for ἐκδίκησις. The translation otherwise retains the Greek word order and the deliberately terse expression "승리의 응징."
