revisions:
- from: 그리고 여러분에게 야훼의 구원이 유다와 레위 지파에서 일어날 것입니다. 그분 자신이 벨리알과 전쟁을 벌이실 것이며, 승리의 복수도 여러분의 조상들에게 주실 것입니다.[a]
  to: 그리고 여러분을 위하여 주님의 구원이 유다와 레위의 지파에서[a] 일어날 것입니다. 그분 자신이 벨리알과 전쟁을 벌이실 것이며, 여러분의 조상들에게 승리의 응징을 주실 것입니다.
  rationale: Revised κύριος to the source-neutral "주님," clarified the compact tribal phrase without resolving its textual difficulty, replaced the dangling footnote with a note at the disputed words, and used a more natural formal equivalent for ἐκδίκησις. The translation otherwise retains the Greek word order and the deliberately terse expression "승리의 응징."
  reviewer_model: gpt-5.6-terra
