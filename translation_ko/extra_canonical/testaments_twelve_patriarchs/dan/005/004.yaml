reference: Testament of Dan 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ οἶδα²⁷ ὅτι ἐν ταῖς²⁸ ἐσχάταις ἡμέραις ἀποστήσεσθε²⁹ τοῦ Κυρίου, καὶ προσοχθιεῖτε³⁰ τῷ³¹ Λευί, καὶ πρὸς τῷ³² Ἰουδὰ³³ παρατάξεσθε³⁴, ἀλλ᾽ οὐ δυνήσεσθε³⁵ πρὸς αὐτούς³⁶. *ἄγγελος γὰρ Κυρίου ὁδηγεῖ ἑκατέρους³⁷, ὅτι ἐν αὐτοῖς³⁸ στήσεται ὁ³⁹ Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/004.yaml
  text: I know that in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will array yourselves against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.
translation:
  language: ko
  text: 나는 마지막 날에 너희가 주님을 떠나리라는 것을 압니다. 너희는 레위를 격노하게 하고, 유다를 맞서 진을 칠 것이나, 그들을 이기지 못할 것입니다. 주님의 천사가 그들 둘을 인도하기 때문입니다. 그들로 말미암아 이스라엘이 설 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε τοῦ Κυρίου
  english_pob_choice: you will depart from the Lord
  chosen_korean: 너희가 주님을 떠나리라는 것
  alternatives_korean:
  - 너희가 주님에게서 돌아서리라는 것
  - 너희가 주님을 배반하리라는 것
  lexicon: ἀφίστημι
  rationale: 단순한 이탈보다 언약적 관계에서의 이탈을 살리되, 문맥을 과장하지 않도록 ‘떠나다’로 옮겼습니다.
- source_word: προσοχθιεῖτε τῷ Λευί
  english_pob_choice: you will provoke Levi to anger
  chosen_korean: 레위를 격노하게 하고
  alternatives_korean:
  - 레위를 분노하게 하고
  - 레위를 노하게 하고
  lexicon: προσόχθιζω
  rationale: 동사의 강한 감정 유발을 살려 ‘격노하게 하다’로 번역했습니다.
- source_word: παρατάξεσθε πρὸς τῷ Ἰουδὰ
  english_pob_choice: you will array yourselves against Judah
  chosen_korean: 유다를 맞서 진을 칠 것이나
  alternatives_korean:
  - 유다에 맞서 배열할 것이나
  - 유다를 향해 진을 펼 것이나
  lexicon: παρατάσσω
  rationale: 군사적 대치의 뜻을 반영하면서도 한국어에서 자연스러운 ‘맞서 진을 치다’로 풀었습니다.
- source_word: ἄγγελος ... ὁδηγεῖ ἑκατέρους
  english_pob_choice: an angel of the Lord guides them both
  chosen_korean: 주님의 천사가 그들 둘을 인도하기 때문입니다
  alternatives_korean:
  - 주님의 천사가 둘 모두를 인도하기 때문입니다
  - 주님의 천사가 양쪽을 인도하기 때문입니다
  lexicon: ἄγγελος / ὁδηγέω
  rationale: ‘둘’은 레위와 유다를 가리키므로, 대상을 분명히 하되 원문의 ‘both’를 보존했습니다.
theological_decisions:
- issue: 레위와 유다가 이스라엘의 존속에 함께 기여한다는 결론의 인과 구조
  chosen_reading: 그들 둘을 인도하는 주님의 천사 때문에, 그들로 말미암아 이스라엘이 설 것입니다.
  alternative_readings:
  - 주님의 천사가 두 지파를 이끌기 때문에 이스라엘이 그들 안에서 설 것입니다
  - 그들 둘이 인도받기 때문에 이스라엘이 설 것입니다
  rationale: 원문은 천사의 인도와 이스라엘의 존속을 직접 연결하므로, 그 인과를 분명하게 드러냈습니다.
  doctrine_reference: 문맥상 축복/예언 진술이며, 교리적 확장 없이 본문의 예언적 논리를 보존합니다.
