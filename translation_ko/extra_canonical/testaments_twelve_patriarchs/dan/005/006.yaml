  to: 나는 의인 에녹의 책에서 읽었고, 너희의 통치자는 사탄이며, 악과 교만의 영들이 복종하여 레위의 아들들을 곁에서 섬기며 그들이 주님 앞에서 죄를 짓게 할 것임을 알았습니다.
  rationale: 문장 전체의 정보와 원문의 병렬 구조를 유지하면서, ‘복종하여’가 ‘레위의 아들들을 곁에서 섬기며’에 선행하도록 조정했습니다. 이는 ὑπακούσονται τοῦ παρεδρεύειν의 통사적 관계를 더 분명하게 드러냅니다. ‘의인 에녹’으로 바꾸어 현대 한국어 명사구를 자연스럽게 했습니다.
