review_pass:
  verdict: revise
  source_fidelity: 핵심 명사와 논리 구조는 대체로 충실합니다. 다만 원문의 ὑπακούσονται τοῦ παρεδρεύειν을 현재 번역처럼 ‘시중들며 … 복종할’로 배열하면, 시중드는 행위와 복종의 관계가 역전되어 보입니다. ‘복종하여 … 섬기며’로 옮겨 ὑπακούσονται가 주동사가 되도록 바로잡는 것이 안전합니다.
  naturalness: ‘의인의 에녹의 책’은 한국어에서 수식 관계가 다소 겹쳐 어색합니다. ‘의인 에녹의 책’이 자연스럽고 의미도 보존합니다. 또한 ‘그들로 하여금’보다 단순히 ‘그들이’가 현대 표준어 문장에 더 자연스럽습니다.
  terminology: ἄρχων의 ‘통치자’, Σατανᾶς의 ‘사탄’, πνεύματα의 ‘영들’, πονηρία와 ὑπερηφανία의 ‘악과 교만’, κύριος의 ‘주님’은 모두 적절합니다. παρεδρεύειν은 여기서 레위의 아들들 곁에서 기다리며 섬기는 뜻이므로 ‘곁에서 섬기며’로 처리했습니다.
  issues:
  - severity: medium
    issue: ὑπακούσονται와 παρεδρεύειν의 문법적·의미적 관계가 한국어 어순에서 불분명합니다.
    rationale: 원문은 영들이 ‘복종하여’ 레위의 아들들을 곁에서 섬기는 것을 말합니다. 초안의 ‘시중들며 … 복종할’은 시중듦이 복종에 선행하거나 그 수단인 듯 읽혀 주동사의 관계를 흐립니다.
  - severity: low
    issue: ‘의인의 에녹의 책’이라는 명사구가 부자연스럽습니다.
    rationale: τοῦ δικαίου는 에녹을 수식하므로 한국어에서는 ‘의인 에녹의 책’이 더 자연스럽고 직접적입니다.
  revised_text: 나는 의인 에녹의 책에서 읽었고, 너희의 통치자는 사탄이며, 악과 교만의 영들이 복종하여 레위의 아들들을 곁에서 섬기며 그들이 주님 앞에서 죄를 짓게 할 것임을 알았습니다.
