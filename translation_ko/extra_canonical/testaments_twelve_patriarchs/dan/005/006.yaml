id: T12P.DAN.5.6
reference: Testament of Dan 5:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[᾿Ανέγνων γὰρ⁵⁰ ἐν βίβλῳ Ἐνὼχ⁵¹ τοῦ δικαίου ⌈καὶ ἔγνων⌉¹⁵² ὅτι ὁ⁵³ ἄρχων ὑμῶν⁵⁴ ὁ Σατανᾶς ἐστιν⁵⁵ *καὶ ὅτι⁵⁶ τὰ πνεύματα τῆς πονηρίας⁵⁷ καὶ τῆς ὑπερηφανίας †ὑπακούσονται⁵⁸ *τοῦ παρεδρεύειν⁵⁹ τοῖς υἱοῖς Λευί, τοῦ ποιεῖν⁶⁰ αὐτοὺς ἐξαμαρτάνειν ἐνώπιον Κυρίου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/006.yaml
  text: For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and pride will obey in attending the sons of Levi, to make them sin before the Lord.
translation:
  language: ko
  text: 나는 의인 에녹의 책에서 읽었고, 너희의 통치자는 사탄이며, 악과 교만의 영들이 복종하여 레위의 아들들을 곁에서 섬기며 그들이 주님 앞에서 죄를 짓게 할 것임을 알았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν βίβλῳ Ἐνὼχ τοῦ δικαίου
  english_pob_choice: in the book of Enoch the righteous
  chosen_korean: 의인의 에녹의 책에서
  alternatives_korean:
  - 의로운 에녹의 책에서
  - 의로운 에녹의 책 안에서
  lexicon: βίβλος, Ἐνὼχ, δίκαιος
  rationale: ἐν βίβλῳ는 단순히 ‘책에서’로 옮기고, τοῦ δικαίου는 에녹의 정체를 규정하는 수식으로 보아 ‘의인의’로 처리했습니다. 영어 POB의 “Enoch the righteous” 흐름을 따르되, 한국어에서는 소유격처럼 자연스럽게 배열했습니다.
- source_word: ὁ ἄρχων ὑμῶν ὁ Σατανᾶς
  english_pob_choice: your ruler is Satan
  chosen_korean: 너희의 통치자는 사탄이며
  alternatives_korean:
  - 너희의 지배자는 사탄이며
  - 너희의 우두머리는 사탄이며
  lexicon: ἄρχων, Σατανᾶς
  rationale: ἄρχων은 단순한 ‘지배자’보다 권세를 가진 통치자를 가리키므로 ‘통치자’로 옮겼습니다. Σατανᾶς는 음역형을 유지해 인물 호칭의 직접성을 살렸습니다.
- source_word: τὰ πνεύματα τῆς πονηρίας καὶ τῆς ὑπερηφανίας
  english_pob_choice: the spirits of wickedness and pride
  chosen_korean: 악과 교만의 영들
  alternatives_korean:
  - 악의 영들과 교만의 영들
  - 악과 오만의 영들
  lexicon: πνεύματα, πονηρία, ὑπερηφανία
  rationale: 두 속격이 병렬로 영들의 성격을 규정하므로, 한국어에서도 ‘악과 교만의 영들’로 간결하게 묶었습니다. ‘악’은 πονηρία의 도덕적 악함을, ‘교만’은 ὑπερηφανία의 핵심 의미를 반영합니다.
- source_word: ὑπακούσονται τοῦ παρεδρεύειν ... τοῦ ποιεῖν αὐτοὺς ἐξαμαρτάνειν
  english_pob_choice: will obey in attending ... to make them sin
  chosen_korean: 곁에서 시중들며 … 복종할 것임을 알았습니다
  alternatives_korean:
  - 곁에 머물며 … 복종할 것입니다
  - 부근에서 대기하며 … 따를 것입니다
  lexicon: ὑπακούσονται, παρεδρεύειν, ποιεῖν ἐξαμαρτάνειν
  rationale: ὑπακούσονται는 능동적 순종을 분명히 하므로 ‘복종할 것임’으로 옮겼고, παρεδρεύειν은 ‘곁에서 시중들다’로 대상 곁에 상주하는 그림을 살렸습니다. 목적절은 ‘죄를 짓게 하려고’로 풀어 ἐξαμαρτάνειν의 결과 목적을 드러냈습니다.
theological_decisions:
- issue: 주님/야훼 표기
  chosen_reading: ἐνώπιον Κυρίου는 문맥상 하나님의 권위 앞을 뜻하므로 ‘주님 앞에서’로 옮겼습니다.
  alternative_readings:
  - 야훼 앞에서
  - 주 앞에서
  rationale: 이 문장은 구약적 경외 표현이지만, 본문 자체는 Κυρίου를 인용형으로만 제시하므로 과도한 본문 확장 없이 한국어에서 자연스러운 경어형을 택했습니다. 여기서는 직접 인용된 야훼 대체 표기보다 문맥상 일반적 신적 칭호를 유지하는 편이 안전합니다.
  doctrine_reference: 인용 대상의 신명칭 처리 원칙
- issue: 악령의 의지 표현
  chosen_reading: ‘복종할 것임’으로 번역해 영들이 레위 자손에게 능동적으로 순종하는 성격을 보존했습니다.
  alternative_readings:
  - ‘따를 것이다’
  - ‘시중들 것이다’
  rationale: 영적 존재가 단순히 ‘있다’가 아니라 명령에 응답하는 존재로 묘사되므로, 본문의 긴장과 의도적 불길함을 약화시키지 않도록 했습니다.
  doctrine_reference: 영적 존재의 능동성 묘사
