id: T12P.DAN.5.2
reference: Testament of Dan 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἀλήθειαν φθέγγεσθε¹⁴ ἕκαστος πρὸς τὸν πλησίον αὐτοῦ καὶ οὐ μὴ ἐμπέσητε εἰς μῆνιν¹⁵ *καὶ ταραχάς¹⁶, ἀλλ᾽ ἔσεσθε¹⁷ ἐν εἰρήνῃ ἔχοντες τὸν θεὸν *τῆς εἰρήνης¹⁸ καὶ *οὐ μὴ κατισχύσει¹⁹ ὑμῶν²⁰ πόλεμος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/002.yaml
  text: Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace, and no war will prevail against you.
translation:
  language: ko
  text: 각 사람은 자기 이웃에게 진실을 말하십시오. 그러면 분노와 소란에 결코 빠지지 않을 것입니다. 오히려 평강 가운데 있으며 평강의 하나님을 모시게 될 것입니다. 전쟁이 여러분을 압도하지 못할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν φθέγγεσθε
  english_pob_choice: Speak truth
  chosen_korean: 진리를 … 말하십시오
  alternatives_korean:
  - 진실을 … 말하십시오
  - 진리를 … 선포하십시오
  lexicon: ἀλήθεια; φθέγγομαι
  rationale: φθέγγεσθε는 단순한 발화보다 분명한 말하기를 가리키므로, 직역적이면서도 자연스러운 ‘말하십시오’로 옮겼고, ἀλήθειαν은 윤리적 내용이 분명한 ‘진리’로 두었습니다.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  english_pob_choice: each one to his neighbor
  chosen_korean: 각자 자기 이웃에게
  alternatives_korean:
  - 각 사람은 자기 이웃에게
  - 서로에게
  lexicon: πλησίον
  rationale: πλησίον은 단순한 가까운 사람보다 ‘이웃’이 문맥상 더 정확하며, ἕκαστος를 살려 ‘각자’로 분명하게 했습니다.
- source_word: μῆνιν / ταραχάς
  english_pob_choice: wrath and tumults
  chosen_korean: 분노와 소란
  alternatives_korean:
  - 진노와 소란
  - 격노와 혼란
  lexicon: μῆνις; ταραχή
  rationale: μῆνις는 강한 분노를 뜻하지만 한국어에서는 문맥상 ‘분노’가 자연스럽고, ταραχάς는 공동체적 불안을 드러내는 ‘소란’이 적절합니다.
- source_word: τὸν θεὸν τῆς εἰρήνης
  english_pob_choice: the God of peace
  chosen_korean: 평강의 하나님
  alternatives_korean:
  - 평화의 하나님
  - 평강의 하나님이신 하나님
  lexicon: θεός; εἰρήνη
  rationale: POB의 ‘God of peace’를 따라 관용적으로 ‘평강의 하나님’으로 옮기되, εἰρήνη의 기본 대응어인 ‘평강’을 유지했습니다.
- source_word: οὐ μὴ κατισχύσει ὑμῶν πόλεμος
  english_pob_choice: no war will prevail against you
  chosen_korean: 전쟁이 여러분을 이기지 못할 것입니다
  alternatives_korean:
  - 전쟁이 여러분을 압도하지 못할 것입니다
  - 전쟁이 여러분을 이기지 못할 것입니다
  lexicon: κατισχύω; πόλεμος
  rationale: κατισχύσει는 ‘압도하다/이기다’의 의미가 있으나, 한국어에서는 전쟁의 우세를 자연스럽게 표현하는 ‘이기지 못할 것입니다’가 가장 간명합니다.
theological_decisions:
- issue: ‘평강의 하나님’을 가진 상태와 ‘평화 가운데 있음’의 관계
  chosen_reading: 평강의 하나님을 모시고 있을 것이며, 그 결과 평화 가운데 있게 된다는 흐름으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘평화의 상태에 있을 것이다’로만 읽는 해석
  - 하나님 소유를 배제한 일반적 평화 상태
  rationale: 원문은 ἐν εἰρήνῃ와 τὸν θεὸν τῆς εἰρήνης를 함께 두어 내적 평화와 하나님과의 연관을 동시에 말하므로, 둘을 분리하지 않고 연결해 살렸습니다.
  doctrine_reference: 문맥상 평강은 관계적·공동체적 상태이며 하나님과의 동행을 포함합니다.
