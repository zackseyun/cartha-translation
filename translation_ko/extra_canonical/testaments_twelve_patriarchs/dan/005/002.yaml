  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. ‘전쟁이 여러분을 이기지 못할 것입니다’도 이해되지만, 전쟁이 주어일 때에는 ‘여러분을 이기지 못할 것입니다’가 원문의 ‘우세를 점하다/압도하다’보다 다소 의인화되어 들릴 수 있습니다. ‘여러분을 압도하지 못할 것입니다’가 더 자연스럽고 가깝습니다.
