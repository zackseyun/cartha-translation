id: T12P.DAN.5.13
reference: Testament of Dan 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὐκέτι ὑπομενεῖ⁹⁸ Ἱερουσαλὴμ ἐρήμωσιν *οὐδὲ αἰχμαλωτισθήσεται Ἰσραήλ⁹⁹, ὅτι¹⁰⁰ Κύριος ἔσται¹⁰¹ *ἐν μέσῳ¹⁰² αὐτῆς¹⁰³ [τοῖς ἀνθρώποις συναναστρεφόμενος]¹⁰⁴ καὶ §¹⁰⁵ Ἅγιος Ἰσραὴλ βασιλεύων¹⁰⁶ ἐπ᾽ αὐτῆς¹⁰⁷ [ἐν *ταπεινώσει καὶ πτωχείᾳ¹⁰⁸, καὶ ὁ πιστεύων *ἐπ᾽ αὐτῷ¹⁰⁹ *βασιλεύσει ἐν τοῖς ἀνθρώποις ἐν ἀληθείᾳ¹¹⁰].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/013.yaml
  text: And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst [dwelling among men], and the Holy One of Israel reigning over her [in humility and poverty; and the one who believes in him will reign among men in truth].
translation:
  language: ko
  text: 예루살렘은 더 이상 황폐함을 견디지 않을 것이며, 이스라엘은 포로로 잡히지 않을 것입니다. 주님께서 그 한가운데에 계실 것이며, 이스라엘의 거룩하신 분께서 그 위에 통치하실 것입니다[겸손과 가난 가운데서; 그리고 그를 믿는 자는 진리 안에서 사람들 가운데서 통치할 것입니다].[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἱερουσαλὴμ ἐρήμωσιν / οὐδὲ αἰχμαλωτισθήσεται Ἰσραήλ
  english_pob_choice: Jerusalem will no longer endure desolation / nor will Israel be taken captive
  chosen_korean: 예루살렘은 더 이상 황폐함을 견디지 않을 것이며, 이스라엘은 포로로 잡히지 않을 것입니다
  alternatives_korean:
  - 예루살렘은 더 이상 황폐되지 않을 것이며, 이스라엘은 사로잡히지 않을 것입니다
  - 예루살렘은 다시 황폐해지지 않을 것이며, 이스라엘은 포로가 되지 않을 것입니다
  lexicon: ἐρήμωσις, αἰχμαλωτίζω
  rationale: 도시가 ‘황폐 상태를 겪는 것’과 백성이 ‘포로로 잡히는 것’을 분명히 나누어, POB의 두 절 병행을 한국어에서도 유지했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: κύριος
  rationale: 여기서는 직접 호칭이 아니라 서술적 주어이므로, 한국어 본문에서는 자연스러운 ‘주님’이 가장 적합합니다.
- source_word: ἐν μέσῳ αὐτῆς
  english_pob_choice: in her midst
  chosen_korean: 그 한가운데에
  alternatives_korean:
  - 그 가운데에
  - 그 중심에
  lexicon: ἐν μέσῳ
  rationale: 공동체 안쪽에 거하심을 선명하게 드러내기 위해 ‘한가운데에’를 택했습니다.
- source_word: Ἅγιος Ἰσραὴλ βασιλεύων ἐπ᾽ αὐτῆς
  english_pob_choice: the Holy One of Israel reigning over her
  chosen_korean: 이스라엘의 거룩하신 분께서 그 위에 통치하실 것입니다
  alternatives_korean:
  - 이스라엘의 거룩한 이가 그 위에 다스리실 것입니다
  - 이스라엘의 거룩하신 분께서 그 위를 다스리실 것입니다
  lexicon: Ἅγιος Ἰσραήλ, βασιλεύω
  rationale: POB의 수정 반영에 따라 ‘통치하실 것입니다’를 넣어 미래의 서술로 바꾸지 않고, 현재 분사적 울림을 살리되 한국어 문장성은 유지했습니다.
- source_word: '[τοῖς ἀνθρώποις συναναστρεφόμενος] / [ἐν ταπεινώσει καὶ πτωχείᾳ, καὶ ὁ πιστεύων ἐπ᾽ αὐτῷ βασιλεύσει ἐν τοῖς ἀνθρώποις ἐν ἀληθείᾳ]'
  english_pob_choice: '[dwelling among men] / [in humility and poverty; and the one who believes in him will reign among men in truth]'
  chosen_korean: '[겸손과 가난 가운데서; 그리고 그를 믿는 자는 진리 안에서 사람들 가운데서 통치할 것입니다]'
  alternatives_korean:
  - '[사람들 가운데 거하시며] / [겸손과 가난 가운데서; 그리고 그를 믿는 사람은 진리 가운데 사람들 위에 다스릴 것입니다]'
  lexicon: συναναστρέφομαι, ταπείνωσις, πτωχεία, πιστεύω, ἀλήθεια
  rationale: 본절의 대괄호 전승은 변동이 있으므로, 영어 POB의 현재 채택을 따라 보존하되 예배문처럼 과장하지 않고 주석적 괄호로 처리했습니다.
theological_decisions:
- issue: ‘야훼’ 대신 ‘주님’ 사용 여부
  chosen_reading: 본절의 κύριος는 인용된 여호와 이름 표지가 아니라 서술적 주어이므로 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: LXX 인용이나 야훼 대체 전통을 강하게 요구하는 맥락이 아니며, 본문 흐름에서는 일반적인 신적 호칭으로 읽히므로 표준적 번역을 유지했습니다.
  doctrine_reference: 하나님 호칭의 맥락적 번역 원칙
- issue: ‘그를 믿는 자는 … 통치할 것입니다’의 종말론적 약속 처리
  chosen_reading: 대괄호 전승을 보존하여, 믿는 자의 통치 약속을 본문 안의 확정적 진술로 제시했습니다.
  alternative_readings:
  - 본문에서 생략
  - 각주로만 처리
  rationale: 전승상 부가 구절이지만 영어 POB가 이를 보존하고 있어, 독자가 본문 증거의 긴장을 볼 수 있도록 주석적 괄호로 남겼습니다.
  doctrine_reference: 본문비평과 전승 보존 원칙
