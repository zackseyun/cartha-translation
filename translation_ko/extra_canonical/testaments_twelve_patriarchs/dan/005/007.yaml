id: T12P.DAN.5.7
reference: Testament of Dan 5:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *οἱ ἐμοὶ υἱοὶ⁶¹ συνεγγίζοντές⁶² εἰσι τοῦ⁶³ Λευὶ καὶ συναμαρτάνοντες⁶⁴ αὐτοῖς⁶⁵ ἐν πᾶσιν. *οἱ δὲ υἱοὶ τοῦ⁶⁶ Ἰούδα ἔσονται ἐν πλεονεξίᾳ ἁρπάζοντες⁶⁷ ἀλλότρια ὡς⁶⁸ λέοντες.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/007.yaml
  text: And my sons are drawing near to Levi and sinning together with them in all things. But the sons of Judah will be in greed, snatching what belongs to others like lions.
translation:
  language: ko
  text: 그리고 내 아들들은 레위에게 가까이 다가가, 모든 일에서 그들과 함께 죄를 짓고 있습니다. 그러나 유다의 아들들은 탐욕에 빠져 사자들처럼 남의 것을 빼앗을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεγγίζοντές εἰσι
  english_pob_choice: are drawing near
  chosen_korean: 가까이 가며
  alternatives_korean:
  - 다가가며
  - 점점 가까워지며
  lexicon: συνεγγίζω
  rationale: 현재분사적 진행을 살려 ‘가까이 가며’로 옮겼습니다. 단순한 미래가 아니라 진행 중인 접근을 드러내는 것이 본문 흐름에 맞습니다.
- source_word: συναμαρτάνοντες αὐτοῖς ἐν πᾶσιν
  english_pob_choice: sinning together with them in all things
  chosen_korean: 모든 일에서 그들과 함께 죄를 짓고 있습니다
  alternatives_korean:
  - 그들과 함께 모든 일에서 죄를 짓고 있습니다
  - 모든 일에서 그들과 함께 범죄하고 있습니다
  lexicon: συναμαρτάνω
  rationale: ‘함께 죄를 짓다’의 결속성을 살리면서, ἐν πᾶσιν은 ‘모든 일에서’로 자연스럽게 옮겼습니다.
- source_word: ἐν πλεονεξίᾳ
  english_pob_choice: in greed
  chosen_korean: 탐욕 속에 있으면서
  alternatives_korean:
  - 탐욕 가운데
  - 탐욕에 빠져
  lexicon: πλεονεξία
  rationale: 전치사 ἐν의 상태성을 살려 ‘~속에 있으면서’로 표현했습니다. 단순 성향보다 탐욕의 지배 상태를 드러냅니다.
- source_word: ἁρπάζοντες ἀλλότρια ὡς λέοντες
  english_pob_choice: snatching what belongs to others like lions
  chosen_korean: 사자들처럼 남의 것을 빼앗을 것입니다
  alternatives_korean:
  - 사자처럼 남의 것을 낚아챌 것입니다
  - 사자들처럼 남의 재산을 빼앗을 것입니다
  lexicon: ἁρπάζω
  rationale: ‘빼앗다’는 강탈의 의미를 분명히 하고, ἀλλότρια는 직역보다 관용적인 ‘남의 것’으로 옮겨 소유권 침해를 드러냈습니다.
theological_decisions:
- issue: 유다 지파의 비유적 묘사와 도덕적 평가
  chosen_reading: 본문의 경고를 약화하지 않고, 탐욕과 강탈의 이미지를 그대로 살려 읽었습니다.
  alternative_readings:
  - 유다의 아들들을 단순한 부정적 성향으로 완화해 읽는 방식
  - 비유적 동물 이미지를 생략하는 방식
  rationale: 본문은 윤리적 타락을 예언적 어조로 강하게 묘사하므로, ‘사자들처럼’과 ‘빼앗을 것입니다’를 유지해야 합니다.
  doctrine_reference: 예언적 경고와 도덕적 책망의 직접성
- issue: ‘그들과 함께 죄를 짓고 있습니다’의 현재성
  chosen_reading: 영어 POB의 수정본처럼 현재 진행성을 반영해 번역했습니다.
  alternative_readings:
  - 미래형으로 통일해 ‘죄를 지을 것입니다’로 옮기는 방식
  rationale: 그리스어 현재분사가 반복적·진행적 행위를 나타내므로, 현재 진행으로 옮겨 본문 긴장을 보존했습니다.
  doctrine_reference: 헬라어 분사 시상/상(aspect) 반영
