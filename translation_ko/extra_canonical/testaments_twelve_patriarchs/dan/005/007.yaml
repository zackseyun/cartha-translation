  terminology: Λευί는 ‘레위’로, πλεονεξία는 ‘탐욕’으로, ἁρπάζοντες ἀλλότρια는 ‘남의 것을 빼앗다’로 유지하는 것이 적절합니다. αὐτοῖς의 복수는 한국어 ‘그들과’로 보존하여 원문의 지시 대상상 다소 불명확한 면을 해소하려 들지 않았습니다.
