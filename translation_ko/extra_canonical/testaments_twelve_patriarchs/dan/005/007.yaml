  source_fidelity: 첫 절의 현재 분사들과 εἰσι는 진행 중인 상태로, 둘째 절의 ἔσονται는 미래로 옮긴 점이 중요합니다. 초안은 대체로 이를 반영하지만, ‘탐욕 속에 있으면서’는 미래 서술과 시간 관계가 다소 어색합니다. 또한 본문에 제공되지 않은 [a] 표지는 삭제해야 합니다.
