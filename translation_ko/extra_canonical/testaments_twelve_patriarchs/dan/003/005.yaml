base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/005.yaml
  text: And with what does it cover his eyes? With hatred of heart against his brother, unto envy.
translation:
  language: ko
  text: 그는 무엇으로 자기 눈을 가립니까? 자기 형제에 대한 마음의 미움으로, 시기에 이르기까지 가립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβάλλει τοὺς ὀφθαλμοὺς αὐτοῦ
  english_pob_choice: it covers his eyes
  chosen_korean: 그것이 그의 눈을 무엇으로 가립니다
  alternatives_korean:
  - 그것이 그의 눈을 덮습니다
  - 그것이 그의 눈을 가립니다
  lexicon: περιβάλλω
  rationale: περιβάλλει는 ‘둘러싸다/덮다’ 계열이지만, POB의 ‘covers his eyes’를 따라 한국어에서도 직역에 가까운 ‘가립니다’로 옮겨 시야를 막는 이미지를 살렸습니다.
- source_word: ἐν μίσει καρδίας
  english_pob_choice: with hatred of heart
  chosen_korean: 마음의 미움으로
  alternatives_korean:
  - 마음의 증오로
  - 마음속 미움으로
  lexicon: μῖσος, καρδία
  rationale: ‘heart’의 내적 중심성을 살리되 한국어의 자연스러운 소유격 표현으로 풀어, 감정의 근원이 마음에 있음을 분명히 했습니다.
- source_word: κατὰ τοῦ ἀδελφοῦ αὐτοῦ
  english_pob_choice: against his brother
  chosen_korean: 형제를 향하여
  alternatives_korean:
  - 그의 형제에게 대하여
  - 형제에게 맞서
  lexicon: κατά + genitive
  rationale: κατά + 속격의 적대 방향성을 ‘향하여’로 옮겨 관계적 대립을 드러냈습니다.
- source_word: εἰς φθόνον
  english_pob_choice: unto envy
  chosen_korean: 시기까지 이르게 합니다
  alternatives_korean:
  - 시기로
  - 시기하게 됩니다
  lexicon: εἰς + accusative, φθόνος
  rationale: εἰς는 목적·귀결의 방향성을 나타내므로, 단순한 상태 표시보다 결과적 도달을 드러내는 ‘~까지 이르게 합니다’를 택했습니다.
theological_decisions:
- issue: 적대감과 시기의 진행 방향
  chosen_reading: 눈을 가리는 행위가 마음의 미움에서 형제에 대한 적대, 나아가 시기로 이어지는 내적 악의 진행을 그대로 드러냅니다.
  alternative_readings:
  - 단순히 ‘시기하게 됩니다’로 정리하는 읽기
  - 도덕적 경고를 완화해 일반 감정 묘사로 읽는 방식
  rationale: 본문은 감정의 연쇄를 압축적으로 제시하므로, 결과를 약화하지 않고 ‘이르게 합니다’로 인과적 긴장을 보존했습니다.
  doctrine_reference: 인간의 내적 부패와 죄의 진행성
- issue: 직접적인 수사 의문문 유지
  chosen_reading: ‘무엇으로 가립니다?’라는 질문형을 그대로 유지했습니다.
  alternative_readings:
  - 서술형으로 바꿔 ‘그것이 그의 눈을 가립니다’로 정리
  - 설명형으로 풀어 쓰기
  rationale: 원문은 수사 의문문으로 독자의 판단을 촉구하므로, 이를 보존해야 본문의 공격성과 경고성이 살아납니다.
  doctrine_reference: 수사 의문문의 경고 기능
