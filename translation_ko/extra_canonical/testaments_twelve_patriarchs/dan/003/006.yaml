  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: III. *Καὶ γὰρ πονηρὸς ὁ θυμός¹, τέκνα μου, *ὡς καὶ αὐτὴν τὴν ψυχὴν ἐκταράσσει².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/006.yaml
  text: For anger is evil, my children, because it throws even the soul itself into turmoil.
translation:
  language: ko
  text: 내 자녀들아, 분노는 악합니다. 그것은 영혼 자체까지도 혼란에 빠뜨리기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρὸς ὁ θυμός
  english_pob_choice: anger is evil
  chosen_korean: 분노는 악합니다
  alternatives_korean:
  - 분노는 나쁩니다
  - 노여움은 악합니다
  - 성냄은 악합니다
  lexicon: πονηρός
  rationale: θύμός를 단순한 감정의 강도보다 도덕적으로 평가된 상태로 보아, POB의 ‘evil’을 따라 ‘악합니다’로 옮겼습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  - 내 자녀들
  lexicon: τέκνον
  rationale: 직접 호소하는 부름으로서 문어체에서 자연스럽고 친밀한 ‘자녀들아’를 택했습니다.
- source_word: ἐκταράσσει
  english_pob_choice: throws … into turmoil
  chosen_korean: 혼란에 빠뜨립니다
  alternatives_korean:
  - 뒤흔듭니다
  - 격동시킵니다
  - 소란하게 합니다
  lexicon: ἐκταράσσω
  rationale: 영혼을 격렬하게 뒤흔들어 평정을 깨뜨린다는 뜻을 한국어로 자연스럽게 풀어 ‘혼란에 빠뜨립니다’로 옮겼습니다.
- source_word: αὐτὴν τὴν ψυχὴν
  english_pob_choice: the soul itself
  chosen_korean: 영혼 자체까지도
  alternatives_korean:
  - 그 영혼 자체를
  - 바로 그 영혼까지도
  - 혼 자체를
  lexicon: ψυχή
  rationale: ‘자체’의 강조를 살리면서도 한국어 어순에 맞게 목적어를 자연스럽게 배치했습니다.
theological_decisions:
- issue: 분노에 대한 도덕적 평가
  chosen_reading: 분노를 단순한 감정이 아니라 악한 것으로 규정하는 진술로 읽었습니다.
  alternative_readings:
  - 분노를 조절되지 않은 상태의 감정으로만 보는 읽기
  - 문맥상 특정한 폭력적 분노로 제한하는 읽기
  rationale: 원문의 πονηρός와 영어 POB의 evil이 함께 분노 자체의 도덕적 위험성을 강조하므로, 그 긴장을 약화하지 않고 유지했습니다.
  doctrine_reference: 성화와 정서 윤리
