  source_fidelity: 주어진 그리스어의 목적격 병렬어구(‘진리와 오래 참음’)와 2인칭 복수 미래 경고(ἀπολεῖσθε)를 충실히 반영합니다. 제시된 원문과 영어가 모두 절의 앞부분을 생략 부호로 처리하므로, ‘잃게 되면’은 문장 성립을 위해 앞 문맥에서 보충되는 조건을 자연스럽게 이어 준 것으로 볼 수 있으며, ‘멸망할 것입니다’는 ἀπολεῖσθε의 경고적 파멸 의미를 적절히 전달합니다.
  naturalness: ‘진리와 오래 참음을 잃게 되면, 여러분은 멸망할 것입니다.’는 현대 표준 한국어 합쇼체의 훈계·경고 문체로 자연스럽습니다. ‘오래 참음’은 다소 명사적이지만 본문의 덕목 목록과 엄정한 문체에 잘 맞습니다.
  terminology: ἀλήθεια를 ‘진리’, μακροθυμία를 ‘오래 참음’, ἀπόλλυμι의 미래형을 ‘멸망할 것입니다’로 옮긴 선택은 종교·윤리 문맥에서 안정적이며 특정 교파적 해석을 덧붙이지 않습니다.
