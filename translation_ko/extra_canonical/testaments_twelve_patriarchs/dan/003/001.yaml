  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/001.yaml
  text: '...truth and long-suffering, you will perish.'
translation:
  language: ko
  text: 진리와 오래 참음을 잃게 되면, 여러분은 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἀλήθειαν
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참된 것
  - 진실
  lexicon: ἀλήθεια
  rationale: POB의 ‘truth’를 표준적 종교어휘인 ‘진리’로 옮기되, 단순한 사실성보다 윤리적·계시적 진리를 함께 살릴 수 있게 했습니다.
- source_word: τὴν μακροθυμίαν
  english_pob_choice: long-suffering
  chosen_korean: 오래 참음
  alternatives_korean:
  - 인내
  - 참음
  lexicon: μακροθυμία
  rationale: ‘long-suffering’의 고전적 뉘앙스를 살리면서도 현대 한국어에서 이해 가능한 표현으로 ‘오래 참음’을 택했습니다.
- source_word: ἀπολεῖσθε
  english_pob_choice: you will perish
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 망할 것입니다
  - 죽을 것입니다
  lexicon: ἀπόλλυμι
  rationale: 단순한 소멸보다 경고적·도덕적 파멸의 뉘앙스가 강하므로 ‘멸망하다’가 문맥에 더 가깝습니다.
theological_decisions:
- issue: 2인칭 복수 경고문의 한국어 호칭과 어조
  chosen_reading: 직접 경고의 문장으로 옮기되, 현대 합쇼체로 독자에게 분명히 경고하는 문체를 유지했습니다.
  alternative_readings:
  - 더 완곡한 설명문체
  - 하오체의 고전적 경고문
  rationale: 본절은 훈계적 경고이므로 직설성을 유지하되, 번역본 전체의 현대 문체에 맞춰 합쇼체로 정리했습니다.
  doctrine_reference: 훈계/권면 문체
