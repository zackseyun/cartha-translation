id: T12P.DAN.3.4
reference: Testament of Dan 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Περιβάλλεται γὰρ ⌈αὐτὸν⌉⁷ τὸ πνεῦμα τοῦ θυμοῦ τὸ δίκτυον τῆς πλάνης²¹ καὶ τυφλοῖ τοὺς²² ὀφθαλμοὺς αὐτοῦ, καὶ¹ διὰ τοῦ ψεύδους σκοτοῖ²³ τὴν διάνοιαν ⌈αὐτοῦ⌉⁷²⁴, καὶ τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/004.yaml
  text: For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision.
translation:
  language: ko
  text: 이는 분노의 영이 그를 거짓의 그물로 둘러싸고 그의 눈을 멀게 하며, 거짓을 통해 그의 마음을 어둡게 하고, 그에게 자기만의 환상을 제공합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  english_pob_choice: the spirit of anger
  chosen_korean: 분노의 영
  alternatives_korean:
  - 노여움의 영
  - 진노의 영
  lexicon: πνεῦμα
  rationale: 영을 기본으로 두고, θυμός는 감정적 분노를 가리키므로 ‘분노’가 가장 직접적입니다. “진노”는 더 심판적·신적 뉘앙스를 강하게 만들 수 있어 피했습니다.
- source_word: τὸ δίκτυον τῆς πλάνης
  english_pob_choice: the net of deceit
  chosen_korean: 거짓의 그물
  alternatives_korean:
  - 속임수의 그물
  - 미혹의 그물
  lexicon: δίκτυον
  rationale: 그물의 은유를 유지하면서 πλάνη의 핵심을 ‘거짓/속임’으로 옮겼습니다. ‘미혹’은 결과를 강조하므로 본문이 말하는 기만의 성격을 조금 약화시킬 수 있습니다.
- source_word: σκοτοῖ τὴν διάνοιαν
  english_pob_choice: darkens his mind
  chosen_korean: 그의 마음을 어둡게 하고
  alternatives_korean:
  - 그의 생각을 어둡게 하고
  - 그의 이해를 어둡게 하고
  lexicon: διάνοια
  rationale: διάνοια는 생각·이해·마음의 인식 작용을 포괄하므로, 한국어에서는 자연스럽고 넓게 ‘마음’으로 옮겼습니다. 인지적 의미를 더 분명히 하려면 ‘생각/이해’도 가능하지만, 본문의 병렬을 살리기 위해 간결하게 처리했습니다.
- source_word: τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ
  english_pob_choice: gives him his own vision
  chosen_korean: 그에게 자기만의 환상을 제공합니다
  alternatives_korean:
  - 그에게 자기의 비전을 줍니다
  - 그에게 자기의 보는 것을 줍니다
  lexicon: ὅρασις
  rationale: ὅρασις는 단순한 ‘비전’보다 ‘보이는 것/환상’의 의미가 강할 수 있어, 문맥상 자기기만적 인식을 드러내는 ‘환상’으로 옮겼습니다. ‘비전’은 현대 한국어에서 긍정적으로 들릴 수 있어 피했습니다.
theological_decisions:
- issue: “spirit of anger”의 실재성 표현
  chosen_reading: 분노라는 정서가 아니라, 분노를 작동시키는 영적 세력으로 읽히도록 ‘분노의 영’으로 옮겼습니다.
  alternative_readings:
  - ‘분노한 영’으로 성격화하기
  - 심리적 상태로만 완화하기
  rationale: 문맥은 분노를 단순 감정이 아니라 사람을 둘러싸고 눈을 멀게 하는 주체로 묘사하므로, 영적 인격성을 살려야 합니다.
  doctrine_reference: 성서의 악한 영/영적 세력에 대한 묘사 일반
- issue: ‘그의 own vision’의 평가성
  chosen_reading: ‘자기만의 환상’으로 옮겨, 자기기만적이고 왜곡된 인식을 드러내도록 했습니다.
  alternative_readings:
  - 중립적으로 ‘자기 비전’
  - ‘자기 دید’에 가깝게 직역
  rationale: 영문 POB의 ‘own vision’은 긍정적 소명보다 거짓에 의해 주어진 왜곡된 시각을 뜻하므로, 한국어에서도 평가적 의미가 드러나야 합니다.
  doctrine_reference: 지혜문학/윤리적 경고의 수사
