    rationale: 완료형 κέκτηται는 획득 사건 자체보다 현재 지니고 있는 상태를 뜻합니다. ‘세 겹의 힘을 지닙니다’가 더 정확합니다.
  - severity: low
    issue: τριπλῆν δύναμιν의 단수·삼중 구조가 ‘세 가지 힘’으로 다소 평면화됨
    rationale: 원문은 ‘세 겹의 힘’이라는 단일한 힘의 삼중 작동을 말하고 이어 세 항목을 열거합니다. ‘세 겹의 힘’이 이 구조를 더 잘 보존합니다.
  - severity: low
    issue: 정의되지 않은 [a] 각주 표지
    rationale: 제공된 초안에는 [a]에 대응하는 각주 내용이 없습니다. 의미상 필요한 각주도 아니므로 표지를 제거해야 합니다.
