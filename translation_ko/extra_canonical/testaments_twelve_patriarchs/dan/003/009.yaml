id: T12P.DAN.3.9
reference: Testament of Dan 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Διὰ τοῦτο¹¹ ὁ θυμούμενος¹², *ἐὰν μὲν ᾖ¹³ *δυνατὸς ⌈τῷ σώματι⌉¹⁴, *τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται¹⁵· μίαν¹⁶ μὲν ἀπὸ¹⁷ τῆς βοηθείας *τῶν ὑπουργούντων¹⁸. *δεύτερον δὲ¹⁹ διὰ τοῦ πλούτου *πείθων καὶ νικῶν [αὐτὸν] ἀδίκως²⁰. *τρίτον τὴν²¹ φυσικὴν ἔχων *δύναμιν δι'' αὐτῆς δρᾷ²² τὸ κακόν²³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
translation:
  language: ko
  text: 그러므로 분노하는 자는, 몸이 강하면 그의 분노 속에서 세 가지 힘을 얻습니다. 하나는 종들의 도움으로 말미암고, 둘째는 재물로 불의하게 설득하고 이깁니다. 셋째는 본래의 힘을 가지고 그것으로 악을 행합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμούμενος
  english_pob_choice: the one who is angry
  chosen_korean: 분노하는 자
  alternatives_korean:
  - 화를 내는 사람
  - 노하는 자
  lexicon: θυμός
  rationale: 행동 상태를 나타내는 현재분사로서 단순 감정보다 지속적 성향을 드러내는 ‘분노하는 자’가 문맥에 가장 가깝습니다.
- source_word: δυνατὸς τῷ σώματι
  english_pob_choice: strong in body
  chosen_korean: 몸이 강하면
  alternatives_korean:
  - 육체적으로 강하면
  - 몸으로 강하면
  lexicon: δύναται + σῶμα
  rationale: English audit trail의 수정본처럼 신체적 강함을 직설적으로 살려 ‘몸이 강하면’으로 옮겼습니다.
- source_word: ὑπουργούντων
  english_pob_choice: attendants
  chosen_korean: 종들
  alternatives_korean:
  - 시종들
  - 하인들
  - 보조자들
  lexicon: ὑπουργέω
  rationale: 의존적으로 돕는 사람들을 가리키는 말로, 한국어에서는 기능보다 지위가 드러나는 ‘종들’이 가장 자연스럽습니다.
- source_word: πείθων καὶ νικῶν [αὐτὸν] ἀδίκως
  english_pob_choice: persuading and prevailing unjustly
  chosen_korean: 불의하게 설득하고 이깁니다
  alternatives_korean:
  - 불의하게 설득하며 굴복시킵니다
  - 불의하게 꾀어 이깁니다
  lexicon: πείθω / νικῶ ἀδίκως
  rationale: 영어본의 ‘persuading and prevailing unjustly’를 따라, 설득과 승리의 두 동작을 모두 살리면서 부사 ‘불의하게’를 뒤에 두었습니다.
- source_word: τὸ κακόν
  english_pob_choice: he does evil
  chosen_korean: 악을 행합니다
  alternatives_korean:
  - 악을 합니다
  - 나쁜 일을 합니다
  lexicon: κακόν
  rationale: 행위의 결과를 직접적으로 나타내는 표현으로 ‘악을 행합니다’가 원문의 도덕적 강도를 가장 잘 보존합니다.
theological_decisions:
- issue: 분노가 힘을 얻는 방식의 병렬 구조
  chosen_reading: 분노 속에서 세 가지 힘을 얻는다고 옮겨, 본문이 분노를 개인의 내적 동력으로 확대하는 구조를 그대로 드러냈습니다.
  alternative_readings:
  - 분노로 세 가지 능력을 가진다고 옮길 수 있습니다.
  - 분노에 세 가지 힘이 생긴다고 완화할 수 있습니다.
  rationale: 그리스어의 ‘세 가지’와 각 항목의 병렬을 보존해야 본문의 경고적 논지가 약화되지 않습니다.
  doctrine_reference: 인간의 분노와 도덕적 자기증폭에 대한 잠언적 경고
- issue: 불의하게의 위치와 의미
  chosen_reading: ‘불의하게’를 설득과 승리 전체에 걸리게 하여, 수단의 부정성을 분명히 했습니다.
  alternative_readings:
  - ‘불의하게’만 뒤의 ‘이깁니다’에 붙일 수 있습니다.
  - ‘불의하게 설득하고’로만 제한할 수 있습니다.
  rationale: 원문과 영어본 모두 설득과 승리를 함께 부정하는 구조이므로, 한국어에서도 그 범위를 넓게 유지하는 것이 타당합니다.
  doctrine_reference: 의롭지 않은 수단을 통한 승리 비판
