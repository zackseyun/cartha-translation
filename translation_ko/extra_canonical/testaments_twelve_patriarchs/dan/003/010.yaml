id: T12P.DAN.3.10
reference: Testament of Dan 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ ἀσθενὴς ᾖ ὁ²⁴ θυμούμενος²⁵, *διπλοῦν τὸ τῆς ὀργῆς πάθος ἐν αὐτῷ ἀναφύει²⁶· βοηθεῖ *γὰρ αὐτῷ ὁ θυμὸς²⁷ πάντοτε ἐν παρανομίᾳ²⁸. 6. Τοῦτο τὸ πνεῦμα ἀεὶ μετὰ τοῦ ψεύδους *ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται, ἵνα ἐν ὠμότητι καὶ ψεύδει³⁰ γίνωνται³¹ αἱ πράξεις αὐτοῦ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/010.yaml
  text: But if the one who is angry is weak, the passion of wrath grows in him twofold, for anger always helps him in wrongdoing. This spirit always proceeds with falsehood at the right hand of Satan, so that his deeds may be done in cruelty and falsehood.
translation:
  language: ko
  text: 그러나 분노하는 자가 약하면, 분노의 정념이 그 안에서 두 배로 자라납니다. 분노는 언제나 그가 불법을 행하는 데 돕기 때문입니다. 이 영은 언제나 거짓과 함께 사탄의 오른편에서 나아가며, 그의 행위들이 잔인함과 거짓으로 이루어지도록 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενὴς ᾖ ὁ θυμούμενος
  english_pob_choice: the one who is angry is weak
  chosen_korean: 분노하는 자가 약하면
  alternatives_korean:
  - 화내는 자가 약하면
  - 분노한 사람이 약하면
  lexicon: ἀσθενής / θυμούμενος
  rationale: ἀσθενής는 단순한 신체적 약함보다 도덕적·정서적 취약함을 포함할 수 있어, 자연스러운 합쇼체로 ‘약하면’이라고 옮겼습니다.
- source_word: τὸ τῆς ὀργῆς πάθος ἐν αὐτῷ ἀναφύει
  english_pob_choice: the passion of wrath grows in him twofold
  chosen_korean: 분노의 정념이 그 안에서 두 배로 자라납니다
  alternatives_korean:
  - 분노의 정념이 그 안에서 두 배로 솟아납니다
  - 분노의 수난이 그 안에서 두 배로 일어납니다
  lexicon: πάθος / ὀργή / ἀναφύει
  rationale: πάθος는 단순한 감정이 아니라 ‘정념’에 가까운 내적 동인을 가리키므로, ἀναφύει의 ‘자라다/싹트다’ 의미를 살려 ‘자라납니다’로 옮겼습니다.
- source_word: ἐν παρανομίᾳ
  english_pob_choice: in wrongdoing
  chosen_korean: 불법 속에서
  alternatives_korean:
  - 불법 안에서
  - 법을 어기는 가운데
  lexicon: παρανομία
  rationale: παρανομία는 단순한 일반적 악행보다 율법/질서에 대한 위반을 드러내므로, 문맥상 ‘불법’이 가장 직접적입니다.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται
  english_pob_choice: proceeds at the right hand of Satan
  chosen_korean: 사탄의 오른편으로 나아가므로
  alternatives_korean:
  - 사탄의 오른쪽에서 나아가므로
  - 사탄의 우편으로 나아가므로
  lexicon: ἐκ δεξιῶν
  rationale: ἐκ δεξιῶν은 직역하면 ‘오른편에서/오른쪽으로부터’이지만, 한국어에서는 행위의 방향성과 결합해 ‘오른편으로’가 가장 자연스럽고 의미를 보존합니다.
- source_word: ἐν ὠμότητι καὶ ψεύδει
  english_pob_choice: in cruelty and falsehood
  chosen_korean: 잔인함과 거짓 안에서
  alternatives_korean:
  - 잔혹함과 거짓 안에서
  - 포악함과 거짓 안에서
  lexicon: ὠμότης / ψεῦδος
  rationale: ὠμότης는 ‘잔인함/가혹함’의 성격을 가지며, ψεύδει는 단순한 허위가 아니라 거짓된 방식 전체를 가리켜 ‘거짓 안에서’로 옮겼습니다.
theological_decisions:
- issue: ‘이 영’의 지시 대상
  chosen_reading: 본문의 ‘이 영’은 앞선 분노의 작용과 연결된 악한 영으로 이해하되, 본문 자체의 모호함을 유지했습니다.
  alternative_readings:
  - 분노 그 자체를 의인화한 표현
  - 사탄에게 속한 특정 영적 존재
  rationale: 그리스어는 대상을 명시적으로 풀어주지 않으므로, 한국어도 해석을 과도하게 확정하지 않고 지시적 표현을 유지했습니다.
  doctrine_reference: 악한 영/유혹의 묘사를 과잉 결정하지 않는 본문주의 원칙
- issue: ‘불법’의 윤리적 무게
  chosen_reading: παρανομία를 단순한 ‘나쁜 일’보다 율법과 질서를 어기는 행위로 반영했습니다.
  alternative_readings:
  - 죄악
  - 불의
  rationale: POB의 ‘wrongdoing’보다 원문은 더 법적·규범적 뉘앙스를 가지므로, 한국어에서도 그 긴장을 살렸습니다.
  doctrine_reference: 율법 위반과 죄의 연관성에 대한 본문적 표현
