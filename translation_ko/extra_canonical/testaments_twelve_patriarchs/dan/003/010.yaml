- from: 그러나 분노하는 자가 약하면, 분노의 정념이 그 안에서 두 배로 자라납니다. 왜냐하면 분노는 언제나 그를 불법 속에서 돕기 때문입니다. 이 영은 언제나 거짓과 함께 사탄의 오른편으로 나아가므로, 그의 행위들이 잔인함과 거짓 안에서 이루어지게 됩니다.[a][b][c][d]
  to: 그러나 분노하는 자가 약하면, 분노의 정념이 그 안에서 두 배로 자라납니다. 분노는 언제나 그가 불법을 행하는 데 돕기 때문입니다. 이 영은 언제나 거짓과 함께 사탄의 오른편에서 나아가며, 그의 행위들이 잔인함과 거짓으로 이루어지도록 합니다.
  rationale: 이 수정은 ἀναφύει의 성장 비유와 πάθος의 정념이라는 표현을 유지하면서, ἐκ δεξιῶν의 위치 관계와 ἵνα의 목적 기능을 더 정확히 반영합니다. ‘그의’는 원문의 αὐτοῦ가 누구를 가리키는지 문맥상 논의될 수 있는 점을 해소하지 않고 유지했습니다. 내용 없는 각주 표지는 제거했습니다.
