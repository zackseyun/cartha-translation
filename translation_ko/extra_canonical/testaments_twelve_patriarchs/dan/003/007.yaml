id: T12P.DAN.3.7
reference: Testament of Dan 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὸ μὲν σῶμα *ἴδιον ποιεῖται³ τοῦ θυμουμένου⁴, *τῆς δὲ ψυχῆς⁵ κατακυριεύει, καὶ παρέχει σώματι⁶· ⌈δύναμιν⌉⁷, ἵνα ποιήσῃ⁸ πᾶσαν⁹ ἀνομίαν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/007.yaml
  text: And it makes the body of the angry man its own, and gains mastery over the soul, and gives the body strength so that it may commit every lawless deed.
translation:
  language: ko
  text: 그리고 그는 화난 사람의 몸을 자기 것으로 삼고, 그 영혼을 지배하며, 몸에 힘을 더해 주어 모든 불법을 저지르게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὲν σῶμα
  english_pob_choice: the body
  chosen_korean: 몸
  alternatives_korean:
  - 몸뚱이
  - 육체
  lexicon: σῶμα
  rationale: 본문의 σῶμα를 자연스러운 현대 한국어로 옮기되, 단순한 생물학적 ‘육체’보다 인격의 전체적 현실을 가리키는 ‘몸’이 더 무난합니다.
- source_word: ἴδιον ποιεῖται
  english_pob_choice: makes ... its own
  chosen_korean: 자기 것으로 삼고
  alternatives_korean:
  - 자기 것으로 만듭니다
  - 자기 소유로 합니다
  lexicon: ποιέω + ἴδιος
  rationale: 직역하면 ‘자기 것으로 만든다’이지만, 본문의 점유·포획 뉘앙스를 살려 한국어 관용에 맞게 ‘자기 것으로 삼고’로 옮겼습니다.
- source_word: κατακυριεύει
  english_pob_choice: gains mastery over
  chosen_korean: 지배하며
  alternatives_korean:
  - 군림하며
  - 주권을 행사하며
  lexicon: κατακυριεύω
  rationale: κατακυριεύω의 강한 지배/장악 의미를 반영하면서도 문맥상 과도하게 문어적이지 않게 ‘지배하며’로 처리했습니다.
- source_word: ἀνομίαν
  english_pob_choice: lawless deed
  chosen_korean: 불법
  alternatives_korean:
  - 무법
  - 율법을 어기는 일
  - 불의한 일
  lexicon: ἀνομία
  rationale: ἀνομία를 ‘율법 없음/율법 위반’의 성격으로 보아, 행위 중심의 해석을 덧붙이기보다 명사형 ‘불법’으로 간결하게 살렸습니다.
theological_decisions:
- issue: ‘the body’와 ‘the soul’의 대조를 한국어에서 어떻게 보존할지
  chosen_reading: ‘몸’과 ‘영혼’을 병렬로 두어 본문의 이중 대조를 유지했습니다.
  alternative_readings:
  - ‘육체’와 ‘혼’
  - ‘몸’과 ‘마음’
  rationale: 본문은 신체와 영혼을 분리해 각각 다른 방식으로 장악되는 모습을 말하므로, 대조를 흐리지 않도록 대응어를 분명히 살렸습니다.
  doctrine_reference: 인간론의 이분적 대조를 표현하는 문맥적 번역
