  to: 그리고 분노는 분노하는 사람의 몸을 자기 것으로 삼고, 그 사람의 영혼을 지배하며, 몸에 힘을 주어 온갖 불법을 저지르게 합니다.
  rationale: 문맥상 암시된 주어인 ‘분노’를 명시하여 원문의 지시 관계를 보존하고, 영혼의 소유 관계를 분명히 했습니다. σώμα/ψυχή의 대조와 몸이 불법을 행하도록 힘을 받는 목적 구문은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:59Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 핵심 의미는 그리스어 및 영어 감사 번역과 대체로 일치합니다. 다만 문두의 ‘그는’은 원문의 비인칭적/추상적 선행사(문맥상의 ‘분노’)를 남성 인칭으로 바꾸어 지시 대상을 불필요하게 흐립니다. ‘분노는’으로 밝혀 주는 것이 문맥과 원문 의미에 더 충실합니다.
  naturalness: ‘화난 사람’도 가능하지만, 문어적이고 현대적인 성서 한국어 문맥에서는 ‘분노하는 사람’이 더 자연스럽습니다. 반복되는 소유 관계는 ‘그 사람의 영혼’으로 명시하면 한국어 문장 구조가 분명해집니다.
  terminology: σῶμα는 ‘몸’, ψυχή는 이 문맥에서 ‘영혼’, κατακυριεύει는 ‘지배하며’로 옮긴 것이 적절합니다. ἀνομία는 법률 용어로만 좁혀지지 않도록 ‘온갖 불법’으로 두되, 원문의 포괄적 악행 의미를 유지합니다.
  issues:
