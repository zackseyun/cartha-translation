    issue: ‘그는’의 남성 인칭 지시
    rationale: 원문은 이 절에서 명시적 남성 인칭 주어를 제시하지 않으며, 문맥상 주어는 분노입니다. ‘그는’은 인간 남성 행위자로 오해될 수 있습니다.
  - severity: low
    issue: ‘그 영혼’의 지시 관계
    rationale: 원문상 영혼은 분노하는 사람의 영혼입니다. ‘그 사람의 영혼’으로 하면 소유 관계가 명료해집니다.
  revised_text: 그리고 분노는 분노하는 사람의 몸을 자기 것으로 삼고, 그 사람의 영혼을 지배하며, 몸에 힘을 주어 온갖 불법을 저지르게 합니다.
