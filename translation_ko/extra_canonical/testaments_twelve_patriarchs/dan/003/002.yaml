revisions:
- from: 분노는 눈멂이니, 그것은 아무의 얼굴도 진리 안에서 보지 못하게 합니다.[a]
  to: 이는 분노가 눈먼 상태이기 때문이며, 누구의 얼굴도 진실하게 보지 못하게 합니다.[a]
  rationale: The text is revised solely for explicit representation of γάρ and for natural modern Korean. It preserves the metaphor of blindness, the anaphoric force of the second clause, the universal object (‘anyone’s face’), and the phrase ‘in truth.’ No footnote content is required by the supplied source or English audit trail; the retained [a] anchor should be removed because no corresponding footnote is supplied.
