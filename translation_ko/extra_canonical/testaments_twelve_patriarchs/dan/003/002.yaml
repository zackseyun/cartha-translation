id: T12P.DAN.3.2
reference: Testament of Dan 3:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Τύφλωσις *γάρ ἐστιν ὁ θυμὸς καὶ οὐκ ἐᾷ ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/002.yaml
  text: For anger is blindness, and it does not allow one to see anyone’s face in truth.
translation:
  language: ko
  text: 분노는 눈멂이니, 그것은 아무의 얼굴도 진리 안에서 보지 못하게 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τύφλωσις
  english_pob_choice: blindness
  chosen_korean: 눈멂
  alternatives_korean:
  - 눈먼 상태
  - 맹목
  - 눈이 멂
  lexicon: τύφλωσις
  rationale: 분노를 단순한 감정 과잉이 아니라 ‘보지 못하게 하는 상태’로 강하게 대응시키기 위해, 현대어이면서도 직접적인 ‘눈멂’을 택했습니다.
- source_word: ὁ θυμὸς
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 성냄
  - 화
  lexicon: θυμός
  rationale: 문맥상 도덕적·영적 해악을 가리키는 강한 감정이므로, 중립적이거나 일상적인 ‘화’보다 ‘분노’가 더 적절합니다.
- source_word: οὐκ ἐᾷ ὁρᾶν
  english_pob_choice: does not allow one to see
  chosen_korean: 보지 못하게 합니다
  alternatives_korean:
  - 보게 하지 않습니다
  - 보는 것을 허락하지 않습니다
  lexicon: ἐάω + ὁράω
  rationale: 원문의 허용/방해 의미를 자연스러운 한국어로 옮기되, 능동적 방해의 뉘앙스를 살렸습니다.
- source_word: πρόσωπόν τινος
  english_pob_choice: anyone’s face
  chosen_korean: 아무의 얼굴도
  alternatives_korean:
  - 누구의 얼굴도
  - 어떤 사람의 얼굴도
  lexicon: πρόσωπον + τις
  rationale: ‘아무의 …도’로 부정 범위를 분명히 하여, 사람을 얼굴로 인식하지 못하게 된다는 뜻을 살렸습니다.
theological_decisions:
- issue: 분노의 인식 왜곡 효과
  chosen_reading: 분노는 단지 감정이 아니라 진리를 볼 수 없게 만드는 영적·윤리적 장애로 표현했습니다.
  alternative_readings:
  - 분노는 단순히 판단을 흐리게 합니다
  - 분노는 사람을 잘못 보게 합니다
  rationale: 원문은 ‘눈멂’과 ‘진리 안에서 얼굴을 보지 못함’을 병치해 분노의 인식 붕괴를 강조하므로, 이를 약화하지 않았습니다.
  doctrine_reference: 인간의 분별과 진리 인식에 대한 도덕적·지혜문학적 경고
