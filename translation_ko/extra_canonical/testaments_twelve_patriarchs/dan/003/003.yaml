base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/003.yaml
  text: Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him.
translation:
  language: ko
  text: 비록 아버지나 어머니라도 그것을 원수처럼 대합니다. 형제라면 그를 알지 못합니다. 주님의 예언자라면 그에게 불순종합니다. 의로운 사람이라면 그를 보지 못하고, 친구라면 그를 알아보지 못합니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἂν πατήρ, ἢ μήτηρ ἐστίν
  english_pob_choice: Even if it is a father or a mother
  chosen_korean: 비록 아버지나 어머니라도
  alternatives_korean:
  - 아버지나 어머니일지라도
  - 설령 아버지나 어머니라도
  lexicon: κἂν / πατήρ / μήτηρ
  rationale: 양보절의 강한 대비를 살리되 한국어에서 자연스러운 합쇼체 표현으로 압축했습니다.
- source_word: ὡς πολεμίοις προσέχει αὐτοῖς
  english_pob_choice: it regards them as enemies
  chosen_korean: 그것을 원수처럼 대합니다
  alternatives_korean:
  - 그들을 원수로 여깁니다
  - 원수처럼 봅니다
  lexicon: ὡς / πολεμίοις / προσέχει
  rationale: προσέχει를 단순 인지보다 태도·대우의 의미로 받아, ‘원수처럼 대하다’로 옮겨 원문의 적대적 관계를 드러냈습니다.
- source_word: ἢ προφήτης Κυρίου, παρακούει
  english_pob_choice: If it is a prophet of the Lord, it disobeys him
  chosen_korean: 주님의 예언자라면 그에게 불순종합니다
  alternatives_korean:
  - 주님의 선지자라면 그에게 거역합니다
  - 주님의 예언자라면 그 말을 듣지 않습니다
  lexicon: προφήτης / Κυρίου / παρακούει
  rationale: προφήτης는 본문 맥락상 교회적 관용어보다 직접적인 ‘예언자’가 적절하고, παρακούει는 단순 청취 거부보다 ‘불순종하다’가 더 정확합니다.
- source_word: δίκαιος, οὐ βλέπει
  english_pob_choice: if a righteous man, it does not see him
  chosen_korean: 의로운 사람이라면 그를 보지 못하고
  alternatives_korean:
  - 의인이라면 그를 보지 않고
  - 의로운 사람이라면 그를 알아보지 못하고
  lexicon: δίκαιος / βλέπει
  rationale: POB의 ‘does not see him’을 따라 βλέπει의 시각적 의미를 유지하면서, 한국어에서는 결과상 ‘보지 못하다’가 가장 자연스럽습니다.
theological_decisions:
- issue: “주님의 예언자”의 호칭과 불순종의 관계
  chosen_reading: 본문은 예언자의 권위가 주님께서 부여하신 것으로 전제하므로, ‘주님의 예언자’와 ‘불순종합니다’를 함께 유지했습니다.
  alternative_readings:
  - ‘주님의 선지자’
  - ‘그에게 거역합니다’
  rationale: 원문이 단순한 직책명이 아니라 야훼의 대리 발화를 암시하므로, 예언자와 순종/불순종의 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 예언자적 권위와 순종의 주제
