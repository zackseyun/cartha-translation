  source_fidelity: 첫 문장에서 원문의 암시된 주어(‘그것’)와 목적어인 부모를 뒤바꾸어, 한국어 초안은 ‘아버지나 어머니가 그것을 원수처럼 대한다’는 뜻이 됩니다. 원문은 그 반대로, 그것이 부모를 원수처럼 대한다고 합니다. 또한 οὐ βλέπει는 능력의 결여보다 단순 부정으로 옮기는 편이 충실합니다.
  naturalness: 수정문은 앞 문장에서만 암시된 주어를 ‘그것은’으로 밝혀 대상 관계를 명료하게 하고, 이후 병렬 구문은 자연스러운 합쇼체로 유지합니다.
  terminology: ‘주님의 예언자’, ‘불순종합니다’, ‘의로운 사람’은 προφήτης Κυρίου, παρακούει, δίκαιος에 적절합니다. 본문 단독으로는 ‘그것’의 선행사를 특정할 수 없으므로 이를 보존했습니다.
