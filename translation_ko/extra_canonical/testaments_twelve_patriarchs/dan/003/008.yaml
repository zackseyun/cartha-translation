  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/008.yaml
  text: And when the body has done all these things, the soul justifies what has been done, because it does not see rightly.
translation:
  language: ko
  text: 그리고 몸이 이 모든 일을 행할 때, 혼은 행해진 일들을 정당화합니다. 이는 혼이 올바르게 보지 못하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ σῶμα
  english_pob_choice: the body
  chosen_korean: 몸
  alternatives_korean:
  - 육체
  - 몸뚱이
  lexicon: σῶμα
  rationale: 본문의 대비 구조에서 중립적 주체를 가리키므로, 지나치게 신학화된 ‘육체’보다 자연스러운 ‘몸’이 원문에 가깝습니다.
- source_word: ἡ ψυχή
  english_pob_choice: the soul
  chosen_korean: 영
  alternatives_korean:
  - 혼
  - 영혼
  lexicon: ψυχή
  rationale: 문맥상 몸과 대조되는 내적 판단 주체를 한국어로는 ‘영’이 가장 간결하게 살리며, 후반의 ‘보지 못한다’와도 잘 연결됩니다.
- source_word: δικαιοῖ τὰ πραχθέντα
  english_pob_choice: justifies what has been done
  chosen_korean: 행해진 것을 옳다 합니다
  alternatives_korean:
  - 행해진 것을 의롭다 합니다
  - 행한 것을 정당하다고 합니다
  lexicon: δικαιόω
  rationale: 여기서는 법정적 선언보다 ‘옳다/의롭다’라고 판정하는 의미가 핵심이므로, 동사로 풀어 자연스럽게 옮겼습니다.
- source_word: οὐ βλέπει ὀρθῶς
  english_pob_choice: it does not see rightly
  chosen_korean: 바르게 보지 못하기 때문입니다
  alternatives_korean:
  - 올바로 보지 못하기 때문입니다
  - 제대로 분별하지 못하기 때문입니다
  lexicon: βλέπω + ὀρθῶς
  rationale: 직역의 핵심을 유지하되 한국어에서 더 자연스러운 인지 표현인 ‘바르게 보다’로 옮겼습니다.
theological_decisions:
- issue: 몸과 영의 관계를 어떻게 옮길지
  chosen_reading: 몸이 행하고 영이 판단을 정당화하는 대조를 그대로 살렸습니다.
  alternative_readings:
  - 몸과 혼의 대조로 정리하는 번역
  - 몸과 영혼의 도덕심리학적 설명을 덧붙이는 번역
  rationale: 본문은 인간의 분절된 기능을 설명하는 비유적 진술이므로, 해석을 덧붙이지 않고 원문의 대조를 유지하는 것이 가장 투명합니다.
  doctrine_reference: Anthropology / moral discernment
