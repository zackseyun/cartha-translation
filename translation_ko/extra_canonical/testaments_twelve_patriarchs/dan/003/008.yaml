revisions:
- from: 그리고 몸이 이 모든 것을 행할 때, 영은 행해진 것을 옳다 하고, 그것은 바르게 보지 못하기 때문입니다.
  to: 그리고 몸이 이 모든 일을 행할 때, 혼은 행해진 일들을 정당화합니다. 이는 혼이 올바르게 보지 못하기 때문입니다.
  rationale: The revision corrects the key lexical error ψυχή→‘혼,’ preserves the Greek body–soul contrast and plural ‘things done,’ and uses a clear modern formal-polite Korean rendering. No footnote content is supplied in the English audit trail or draft for the edition’s superscript source marker, so no Korean footnote has been invented.
  reviewer_model: gpt-5.6-terra
