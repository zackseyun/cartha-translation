  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/002.yaml
  text: 'Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing.'
translation:
  language: ko
  text: 이제, 내 자녀들아, 보십시오. 나는 죽어 가고 있습니다. 내가 진실로 여러분에게 말합니다. 여러분은 거짓의 영과 분노로부터 자신을 지키고 진리와 오래 참음을 사랑해야 합니다. 그렇게 하지 않으면 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호칭의 친밀함과 권면의 톤을 살리되, 합쇼체 본문 안에서 자연스럽게 들리는 ‘내 자녀들아’로 옮겼습니다.
- source_word: ἰδοὺ
  english_pob_choice: look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: ἰδού
  rationale: 청중의 주의를 끄는 감탄형을 현대 한국어의 정중한 명령형으로 옮겼습니다.
- source_word: πνεύματος τοῦ ψεύδους
  english_pob_choice: the spirit of falsehood
  chosen_korean: 거짓의 영
  alternatives_korean:
  - 거짓의 영
  - 거짓말의 영
  - 거짓 영
  lexicon: πνεῦμα / ψεῦδος
  rationale: 단순한 ‘거짓말’이 아니라 성격과 작용을 가진 영적 실재를 가리키므로, 조어적 직역을 유지해 ‘거짓의 영’으로 렌더링했습니다.
- source_word: θυμοῦ
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 화
  lexicon: θυμός
  rationale: 본문이 피해야 할 내적 격정과 폭발성을 지시하므로, 일상적 ‘화’보다 더 강한 ‘분노’가 적절합니다.
theological_decisions:
- issue: 진리와 오래 참음에 대한 윤리적 병렬
  chosen_reading: ‘진리와 오래 참음을 사랑하지 않으면’으로, 두 덕목을 함께 수련해야 할 대상로 병렬 처리했습니다.
  alternative_readings:
  - ‘진리와 오래 참음을 지키지 않으면’
  - ‘진리와 오래 참음을 붙들지 않으면’
  rationale: 원문은 ἀγαπήσητε를 사용해 단순 보유가 아니라 애정과 의지를 동반한 지향을 요구하므로, ‘사랑하다’의 직접성을 유지했습니다.
  doctrine_reference: 도덕 권면의 병렬 구조와 의지적 사랑의 개념
