revisions:
- from: 이제, 내 자녀들아, 보십시오. 나는 죽어 갑니다. 그리고 내가 진실로 여러분에게 말합니다. 여러분이 거짓의 영과 분노로부터 자신을 지키지 않고 진리와 오래 참음을 사랑하지 않으면, 멸망할 것입니다.[a]
  to: 이제, 내 자녀들아, 보십시오. 나는 죽어 가고 있습니다. 내가 진실로 여러분에게 말합니다. 여러분은 거짓의 영과 분노로부터 자신을 지키고 진리와 오래 참음을 사랑해야 합니다. 그렇게 하지 않으면 멸망할 것입니다.
  rationale: The revision preserves every source element while expressing the coordinated conditional requirement unambiguously in natural Korean. It also removes the orphaned footnote marker. The declarative-plus-consequence form (‘…해야 합니다. 그렇게 하지 않으면…’) faithfully conveys the source’s warning without forcing Korean negation to bear an unclear scope.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the address, death announcement, solemn assertion, the spirit of falsehood, anger, truth, long-suffering, and the warning of destruction. However, the Korean sequence ‘자신을 지키지 않고 … 사랑하지 않으면’ can make the warning apply only when both failures occur. The Greek construction presents preservation from the two evils and love of the two virtues together as the required response; failure to do so brings destruction.
  naturalness: The draft is generally clear and in an appropriate modern formal-polite register. ‘나는 죽어 갑니다’ is less idiomatic here than the progressive present ‘나는 죽어 가고 있습니다.’ Recasting the conditional slightly makes its coordinated requirements clear in Korean.
  terminology: ‘거짓의 영,’ ‘분노,’ ‘진리,’ and ‘오래 참음’ are faithful and suitable. ‘오래 참음’ appropriately preserves the ethical sense of μακροθυμία without reducing it merely to endurance.
  issues:
  - severity: medium
    issue: Conditional scope is potentially misleading in Korean.
    rationale: ‘A를 지키지 않고 B를 사랑하지 않으면’ readily suggests that destruction follows only if both A and B are neglected. The source requires both guarding oneself and loving the virtues, with destruction following if that combined response is absent.
  - severity: low
    issue: The unsupported [a] anchor should be removed.
    rationale: No corresponding translation note or footnote is supplied, so retaining the marker creates an orphaned anchor.
  - severity: low
    issue: ‘죽어 갑니다’ is stylistically less natural for the source’s present death announcement.
    rationale: ‘죽어 가고 있습니다’ naturally conveys ἀποθνῄσκω while retaining the ongoing-present force.
  revised_text: 이제, 내 자녀들아, 보십시오. 나는 죽어 가고 있습니다. 내가 진실로 여러분에게 말합니다. 여러분은 거짓의 영과 분노로부터 자신을 지키고 진리와 오래 참음을 사랑해야 합니다. 그렇게 하지 않으면 멸망할 것입니다.
