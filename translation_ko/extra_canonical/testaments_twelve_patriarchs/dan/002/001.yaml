id: T12P.DAN.2.1
reference: Testament of Dan 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/001.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother.'
translation:
  language: ko
  text: 그리고 이제, 내 자녀들아, 보아라. 나는 죽어 가고 있습니다. 내가 너희에게 진실로 말합니다. 너희가 거짓과 분노의 영에게서 자신을 지키고 진리와 오래 참음을 사랑하지 않는다면, 너희는 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 아비가 자녀들을 부르는 직접 호칭으로 옮기되, 현대 한국어에서 자연스럽고 문학적인 호소력을 가진 ‘자녀들아’를 택했습니다.
- source_word: ἀποθνῄσκω
  english_pob_choice: I am dying
  chosen_korean: 나는 죽어 갑니다
  alternatives_korean:
  - 나는 죽습니다
  - 나는 이제 죽습니다
  lexicon: ἀποθνῄσκω
  rationale: 진행 중인 죽음을 나타내는 현재형의 뉘앙스를 살려 ‘죽어 갑니다’로 옮겼습니다.
- source_word: πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  english_pob_choice: the spirit of falsehood and of anger
  chosen_korean: 거짓의 영과 분노의 영
  alternatives_korean:
  - 거짓과 분노의 영
  - 거짓말의 영과 화의 영
  lexicon: πνεῦμα, ψεῦδος, θυμός
  rationale: 영을 하나만 공유하는 구조를 한국어에서도 자연스럽게 보이기보다, 두 항목이 나란히 병치된 경고로 읽히도록 각기 ‘...의 영’으로 풀었습니다.
- source_word: ἀλήθειαν καὶ τὴν μακροθυμίαν
  english_pob_choice: truth and long-suffering
  chosen_korean: 진리와 오래 참음
  alternatives_korean:
  - 진리와 인내
  - 진실과 오래 참음
  lexicon: ἀλήθεια, μακροθυμία
  rationale: ἀλήθεια는 단순한 사실성보다 윤리적·신학적 차원의 ‘진리’가 적절하고, μακροθυμία는 한국어 교회 언어의 관용을 고려해 ‘오래 참음’으로 옮겼습니다.
theological_decisions:
- issue: ‘spirit of falsehood’와 ‘spirit of anger’의 악한 내적 원리 표현
  chosen_reading: 두 표현을 각각 독립된 악한 영적 영향으로 보아, 인간의 판단과 관계를 왜곡하는 내적 지배를 경고하는 말로 번역했습니다.
  alternative_readings:
  - 단순한 거짓의 태도와 분노의 성향
  - 거짓과 분노라는 성격적 결함
  rationale: 본문은 단순한 감정 묘사보다 ‘영’(πνεῦμα)을 사용해 인격적·영적 차원의 동인을 말하므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 인간의 마음을 왜곡하는 악한 영적 영향에 대한 본문의 수사적 경고
- issue: 말씀의 권면이 조건절로 이어져 ‘멸망’으로 끝나는 구조
  chosen_reading: ‘너희가 ... 지키지 않고 ... 사랑하지 않으면 ... 멸망할 것입니다’로 조건-결과 구조를 분명히 살렸습니다.
  alternative_readings:
  - 그렇지 않으면 망할 것입니다
  - 그리하지 않으면 멸망합니다
  rationale: ἐὰν μὴ ... ἀπολεῖσθε의 직접적 조건 구조를 현대 한국어에서도 분명하게 드러내는 것이 본문의 경고성을 보존합니다.
  doctrine_reference: 윤리적 권면과 심판 경고의 조건문 구조
