  - severity: medium
    issue: '[a] 각주 표지가 문장 끝에 있으나 각주 내용이 없고, 원문 및 영어 감사본의 표지 위치와도 일치하지 않습니다.'
    rationale: 원문 표지는 ἰδού(‘보라’)에, 영어 감사본 표지는 ‘now’에 붙어 있습니다. 제공된 자료에는 해당 각주의 본문이 없으므로 표지를 보존하거나 내용을 추정할 수 없습니다. 불완전하고 잘못 배치된 표지는 삭제해야 합니다.
  revised_text: 그리고 이제, 내 자녀들아, 보아라. 나는 죽어 가고 있습니다. 내가 너희에게 진실로 말합니다. 너희가 거짓과 분노의 영에게서 자신을 지키고 진리와 오래 참음을 사랑하지 않는다면, 너희는 멸망할 것입니다.
