  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/005.yaml
  text: If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.
translation:
  language: ko
  text: 이제, 내 자녀들아, 보십시오. 나는 죽어 갑니다. 그리고 나는 진실로 너희에게 말합니다. 너희가 거짓의 영과 분노의 영으로부터 자신을 지키지 않고 진리와 오래 참음을 사랑하지 않으면, 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호칭의 친밀함과 권고적 어조를 살리면서도 현대 문체에서 자연스럽게 들리는 표현으로 옮겼습니다.
- source_word: ἐγὼ ἀποθνῄσκω
  english_pob_choice: I am dying
  chosen_korean: 나는 죽어 갑니다
  alternatives_korean:
  - 나는 죽습니다
  - 나는 이제 죽습니다
  lexicon: ἀποθνῄσκω
  rationale: 진행 중인 임종의 뉘앙스를 살려 단순 완료보다 과정성을 드러냈습니다.
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  english_pob_choice: the spirit of falsehood and of anger
  chosen_korean: 거짓의 영과 분노의 영
  alternatives_korean:
  - 거짓과 분노의 영
  - 거짓의 영과 노여움의 영
  lexicon: πνεῦμα / ψεῦδος / θυμός
  rationale: 원문의 반복되는 정관 구조를 따라 두 개의 영으로 병렬화했으며, POB의 문맥상 해석인 ‘spirit’ 지시를 유지했습니다.
- source_word: φυλάξητε ἑαυτοὺς ἀπό
  english_pob_choice: keep yourselves from
  chosen_korean: 자신을 지키지
  alternatives_korean:
  - 스스로를 지키지
  - 자기 자신을 지키지
  lexicon: φυλάσσω + ἑαυτόν
  rationale: 자기 보존의 명령을 자연스럽고 간결하게 표현하되, 자기 자신을 대상으로 하는 반사적 의미를 유지했습니다.
- source_word: ἀγαπήσητε τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν
  english_pob_choice: love the truth and patience/longsuffering
  chosen_korean: 진리와 오래 참음을 사랑하지
  alternatives_korean:
  - 진리와 인내를 사랑하지
  - 진리와 참음을 사랑하지
  lexicon: ἀλήθεια / μακροθυμία
  rationale: ἀλήθεια는 ‘진리’, μακροθυμία는 인격적 지속 인내를 가리키므로 ‘오래 참음’으로 구체화했습니다.
theological_decisions:
- issue: ἀληθείᾳ λέγω ὑμῖν의 강조 표현
  chosen_reading: 나는 진실로 너희에게 말합니다
  alternative_readings:
  - 내가 참으로 너희에게 말합니다
  - 진실로 내가 너희에게 말합니다
  rationale: 서문의 강조를 한국어에서 가장 자연스러운 서사적 표지로 옮겨 발화의 엄중함을 살렸습니다.
  doctrine_reference: 서약적/강조적 진술의 직설 유지
- issue: ‘멸망할 것입니다’의 종말론적 강도
  chosen_reading: 멸망할 것입니다
  alternative_readings:
  - 망할 것입니다
  - 파멸할 것입니다
  rationale: 원문의 ἀπολεῖσθε는 단순 손실보다 파멸·멸망의 결과를 가리키므로 경고의 강도를 유지했습니다.
  doctrine_reference: 윤리적 경고의 실재성
