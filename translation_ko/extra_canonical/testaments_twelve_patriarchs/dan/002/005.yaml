revisions:
- from: 이제, 내 자녀들아, 보십시오. 나는 죽어 갑니다. 그리고 나는 진실로 너희에게 말합니다. 너희가 거짓의 영과 분노의 영으로부터 자신을 지키지 않고 진리와 오래 참음을 사랑하지 않으면, 멸망할 것입니다.
  to: 이제 내 자녀들아, 보십시오. 나는 죽어 가고 있습니다. 내가 진실로 너희에게 말합니다. 너희가 거짓과 분노의 영을 멀리하고 진리와 오래 참음을 사랑하지 않으면, 너희는 멸망할 것입니다.
