base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/003.yaml
  text: This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath.
translation:
  language: ko
  text: 그리고 이제, 내 자녀들아, 보십시오, 나는 죽습니다. 내가 진실로 너희에게 말합니다. 너희가 거짓과 분노의 영으로부터 자신을 지키고 진리와 오래 참음을 사랑하지 않으면, 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 나의 자녀들아
  lexicon: τέκνα
  rationale: 직접 호칭의 친밀함을 살리되, 현대 한국어에서 자연스러운 복수 호칭으로 옮겼습니다.
- source_word: ἀληθείᾳ λέγω ὑμῖν
  english_pob_choice: in truth I tell you
  chosen_korean: 내가 진실로 너희에게 말합니다
  alternatives_korean:
  - 진실로 너희에게 말합니다
  - 참으로 너희에게 말합니다
  lexicon: ἀλήθεια
  rationale: ‘ἐν ἀληθείᾳ’의 어감을 살려 단순 부사보다는 화자의 진정성을 강조하는 형태로 옮겼습니다.
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  english_pob_choice: the spirit of falsehood and of anger
  chosen_korean: 거짓의 영과 분노의 영
  alternatives_korean:
  - 거짓과 분노의 영
  - 거짓의 영과 노여움의 영
  lexicon: πνεῦμα / ψεῦδος / θυμός
  rationale: 두 속격을 병렬로 유지해 ‘거짓’과 ‘분노’가 각각 영의 성격을 규정하는 구조를 드러냈습니다.
- source_word: ἀγαπήσητε τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν
  english_pob_choice: love truth and long-suffering
  chosen_korean: 진리를 사랑하지 않으면
  alternatives_korean:
  - 진리와 오래 참음을 사랑하지 않으면
  - 진리와 인내를 사랑하지 않으면
  lexicon: ἀλήθεια / μακροθυμία
  rationale: 제공된 그리스어 단편이 여기서 끝나므로, 본문 말미의 미완성을 그대로 남기고 번역도 그 지점에서 멈췄습니다.
theological_decisions:
- issue: 본문이 제공된 그리스어 단편에서 중간에 끊기는 점
  chosen_reading: 번역을 ‘…’로 끝내어 미완성 상태를 드러냈습니다.
  alternative_readings:
  - 문맥을 보충해 완결된 문장으로 매끄럽게 옮김
  - 영문 본문을 따라 뒤쪽 내용을 덧붙임
  rationale: 원문 증거에 없는 내용을 보충하지 않고, 제시된 사본 범위만 번역하는 원칙을 지켰습니다.
  doctrine_reference: source-bound translation principle
- issue: ‘분노’의 영을 일반적 감정이 아닌 영적 실체로 표현
  chosen_reading: ‘분노의 영’으로 직역해 두 속격 구조를 보존했습니다.
  alternative_readings:
  - ‘분노하게 하는 영’으로 기능적 번역
  - ‘노여움의 영’으로 완화
  rationale: 본문은 거짓과 분노를 각각의 ‘영’과 연결하므로, 관계를 약화시키지 않고 유지했습니다.
  doctrine_reference: lexical transparency
