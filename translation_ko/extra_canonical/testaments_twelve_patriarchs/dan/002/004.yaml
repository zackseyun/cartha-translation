source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/004.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry.
translation:
  language: ko
  text: 이제, 나의 자녀들아, 보십시오. 나는 죽어 가고 있습니다. 진실로 너희에게 말합니다. 너희가 거짓과 분노의 영으로부터 너희 자신을 지키고 진리와 오래 참음을 사랑하지 않으면, 너희는 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호소형을 살리면서 현대 한국어에서 자연스럽고 친밀한 호칭으로 옮겼습니다.
- source_word: ἀποθνῄσκω
  english_pob_choice: I am dying
  chosen_korean: 내가 죽어 갑니다
  alternatives_korean:
  - 내가 죽습니다
  - 나는 죽어 가고 있습니다
  lexicon: ἀποθνῄσκω
  rationale: 현재 진행 중인 임종의 상태를 드러내기 위해 ‘죽어 갑니다’를 택했습니다.
- source_word: πνεύματος τοῦ ψεύδους
  english_pob_choice: the spirit of falsehood
  chosen_korean: 거짓의 영
  alternatives_korean:
  - 거짓의 영
  - 거짓말의 영
  - 허위의 영
  lexicon: πνεῦμα
  rationale: πνεῦμα를 ‘영’으로 두고, ψεῦδος의 기본 의미를 따라 ‘거짓’으로 옮겨 원문의 도덕적·영적 대비를 유지했습니다.
- source_word: τοῦ θυμοῦ
  english_pob_choice: of anger
  chosen_korean: 분노의 영
  alternatives_korean:
  - 화의 영
  - 노여움의 영
  lexicon: θυμός
  rationale: θυμός의 격렬한 분노를 자연스러운 현대어 ‘분노’로 옮겨 앞의 ‘거짓의 영’과 병렬을 이루게 했습니다.
- source_word: ἀγαπήσητε τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν
  english_pob_choice: love the truth and long-suffering
  chosen_korean: 진리와 오래 참음을 사랑하지 않으면
  alternatives_korean:
  - 진리와 오래 참음을 사랑하지 않으면
  - 진리와 인내를 사랑하지 않으면
  - 진실과 오래 참음을 사랑하지 않으면
  lexicon: ἀλήθεια / μακροθυμία
  rationale: ἀλήθεια는 단순한 사실성보다 진리의 차원을 살려 ‘진리’로, μακροθυμία는 인내보다 기다림과 참음의 길이를 드러내는 ‘오래 참음’으로 옮겼습니다.
theological_decisions:
- issue: 두 개의 ‘영’이 실제 인격적/도덕적 세력으로 제시되는 방식
  chosen_reading: ‘거짓의 영’과 ‘분노의 영’을 병렬로 유지해, 단순한 심리 상태보다 공동체를 해치는 영적·윤리적 힘으로 읽게 했습니다.
  alternative_readings:
  - ‘거짓된 태도와 분노’로 완화하는 번역
  - ‘거짓의 영과 성난 기질’로 심리화하는 번역
  rationale: 원문은 두 명사를 동일 구조로 묶어 경고하므로, 번역에서도 동일한 영적 병렬성을 보존해야 합니다.
  doctrine_reference: 영적 분별과 성화에 관한 일반적 기독론/윤리적 경고
