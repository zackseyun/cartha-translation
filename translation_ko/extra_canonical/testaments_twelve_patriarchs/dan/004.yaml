    3. 그러므로 누가 여러분을 거슬러 말하더라도 분노에 흔들리지 마십시오. 또 누가 여러분을 거룩한 이들이라고 칭찬하더라도 우쭐해하지 마십시오. 기쁨으로도 불쾌감으로도 마음을 바꾸지 마십시오.


    4. 그것은 먼저 듣는 것을 즐겁게 하고, 그렇게 하여 마음을 날카롭게 하여 자극받은 것을 깨닫게 합니다.[b] 그러다가 분노하게 되면, 자신이 정당하게 분노한다고 생각합니다.


    5. 그러나 자녀들아, 여러분이 어떤 손실이나 파멸을 당하더라도 크게 동요하지 마십시오. 바로 그 영이 잃어 가는 것을 욕망하게 하여, 고난을 통하여 분노에 빠지게 하기 때문입니다.


    6. 또 여러분이 자의로든 타의로든 손실을 입더라도 슬퍼하지 마십시오. 슬픔에서 거짓과 함께 분노도 일어나기 때문입니다.[d]


    7. 분노와 거짓은 두 얼굴을 가진 악입니다. 이 둘은 마음을 어지럽히려고 서로 힘을 합칩니다. 영혼이 끊임없이 동요하면 주님께서 그 영혼에게서 떠나시고, 베리알이 그 영혼을 지배합니다.[c]'
  rationale: 원문 그리스어를 우선하여 4:1의 마태아(‘헛된’)를 회복하고, 발췌문에 없는 영어 확장 문장을 제거했습니다. 또한 4:2, 4:5, 4:7의 핵심 어휘와 지시 대상을 바로잡았으며, 난해하거나 전승상 주의가 필요한 곳에만 해당 절에 맞는 각주를 배치했습니다.
