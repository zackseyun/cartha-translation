revisions:
- from: '1. 진실로 분노는 눈먼 것입니다. 그것은 어떤 사람의 얼굴도 참되게 보지 못하게 합니다.


    2. 먼저 분노는 말 한마디에 의해 일어나고, 그다음에는 행위로 인해 분노해 가는 자를 더 강하게 만들며, 쓰라린 손실로 그를 자극합니다. 그것은 그의 의도를 혼란에 빠뜨리고, 그렇게 하여 그의 영을 큰 격분으로 일으킵니다.


    3. 그러므로 누가 여러분을 거슬러 말하더라도, 여러분은 분노로 움직이지 마십시오. 또 누가 여러분을 거룩한 사람이라고 칭찬하더라도, 높아지지 마십시오. 기쁨으로도 역겨움으로도 바뀌지 마십시오.


    4. 먼저 그것은 들리는 것을 기쁘게 하고, 그다음에는 마음을 날카롭게 하여 자극을 알아차리게 합니다. 그리고 그가 격해지면, 자신이 마땅히 분노하고 있다고 생각합니다.


    5. 그러나 여러분이 어떤 손실이나 파멸에 빠지게 되더라도, 자녀들아, 괴로워하지 마십시오. 바로 이 영이 사라져 가는 것을 두고 분노하고 싶어 하게 만들어, 그가 고난을 통해 분노에 떨어지게 하기 때문입니다.


    6. 또 여러분이 원해서든 원하지 않아서든 손실을 당할 때, 슬퍼하지 마십시오. 슬픔에서 분노도 거짓과 함께 일어나기 때문입니다.


    7. 분노와 거짓은 두 얼굴을 가진 악이며, 둘은 서로 결합하여 마음을 흔들어 놓으려 합니다. 그리고 영혼이 계속 흔들리면, 주님은 그에게서 떠나시고 베리알이 그를 지배합니다.[a][b][c][d]'
