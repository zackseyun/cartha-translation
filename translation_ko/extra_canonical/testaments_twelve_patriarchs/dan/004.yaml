base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004.yaml
  text: '1[a]. For anger is blindness. It does not allow one to see the face of any man with truth.


    2. For first it is stirred up by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it provokes him. It throws his purpose into confusion, and so it rouses his soul in great fury.


    3[b]. Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.


    4. For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.


    5. But if you fall into any loss or ruin, children, do not be distressed. For this very spirit makes one desire to be angry over what is perishing, so that he may fall into anger through affliction.


    6. And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.


    7. And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it[c][d], and Beliar rules over it.'
  footnotes:
  - marker: a
    text: The opening sentence is partially truncated in the supplied Greek excerpt; the translation reflects the sense implied by the surviving clause 'For anger is blindness.'
    reason: textual_variant
    anchor_ref: '4:1'
  - marker: b
    text: The Greek around 'to perceive the provocation' is textually difficult; possible alternatives include 'to perceive what has been stirred up' or 'to perceive the irritation.'
    reason: alternative_reading
    anchor_ref: '4:4'
  - marker: d
    text: '''With falsehood'' may mean that anger arises accompanied by deceit, or that grief gives rise to anger that is then reinforced by lies.'
    reason: alternative_reading
    anchor_ref: '4:6'
  - marker: c
    text: Beliar is a traditional name for the evil power/adversary in Jewish literature; some English traditions normalize the name as 'Belial.'
    reason: cultural_note
    anchor_ref: '4:7'
translation:
  language: ko
  text: '1. 진실로 분노는 눈먼 것입니다. 그것은 어떤 사람의 얼굴도 참되게 보지 못하게 합니다.


    2. 먼저 분노는 말 한마디에 의해 일어나고, 그다음에는 행위로 인해 분노해 가는 자를 더 강하게 만들며, 쓰라린 손실로 그를 자극합니다. 그것은 그의 의도를 혼란에 빠뜨리고, 그렇게 하여 그의 영을 큰 격분으로 일으킵니다.


    3. 그러므로 누가 여러분을 거슬러 말하더라도, 여러분은 분노로 움직이지 마십시오. 또 누가 여러분을 거룩한 사람이라고 칭찬하더라도, 높아지지 마십시오. 기쁨으로도 역겨움으로도 바뀌지 마십시오.


    4. 먼저 그것은 들리는 것을 기쁘게 하고, 그다음에는 마음을 날카롭게 하여 자극을 알아차리게 합니다. 그리고 그가 격해지면, 자신이 마땅히 분노하고 있다고 생각합니다.


    5. 그러나 여러분이 어떤 손실이나 파멸에 빠지게 되더라도, 자녀들아, 괴로워하지 마십시오. 바로 이 영이 사라져 가는 것을 두고 분노하고 싶어 하게 만들어, 그가 고난을 통해 분노에 떨어지게 하기 때문입니다.


    6. 또 여러분이 원해서든 원하지 않아서든 손실을 당할 때, 슬퍼하지 마십시오. 슬픔에서 분노도 거짓과 함께 일어나기 때문입니다.


    7. 분노와 거짓은 두 얼굴을 가진 악이며, 둘은 서로 결합하여 마음을 흔들어 놓으려 합니다. 그리고 영혼이 계속 흔들리면, 주님은 그에게서 떠나시고 베리알이 그를 지배합니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός / ὀργή
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 성냄
  lexicon: LSJ
  rationale: 본문의 반복어를 일관되게 살리되, 현대 한국어에서 윤리적·심리적 격발을 아우르는 중립적 표지로 ‘분노’가 가장 자연스럽습니다.
- source_word: ματαία ἐστίν
  english_pob_choice: is blindness
  chosen_korean: 눈먼 것입니다
  alternatives_korean:
  - 헛된 것입니다
  - 무익한 것입니다
  lexicon: LSJ
  rationale: 영문 POB의 ‘blindness’에 대응하되, 원문의 비유를 직접 살려 분노의 인식 상실을 강하게 드러냅니다.
- source_word: διαβούλιον
  english_pob_choice: purpose
  chosen_korean: 의도
  alternatives_korean:
  - 계획
  - 숙의
  - 생각
  lexicon: LSJ
  rationale: 분노가 무너뜨리는 것은 단순한 계획보다 내적 의도와 판단의 방향이므로 ‘의도’가 가장 간명합니다.
- source_word: τέκνα
  english_pob_choice: children
  chosen_korean: 자녀들아
  alternatives_korean:
  - 아이들아
  - 자녀들
  lexicon: LSJ
  rationale: 직접 호명 구조를 살리면서도 한국어 권면체의 자연스러운 부름말로 옮겼습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 베리알
  alternatives_korean:
  - 벨리알
  lexicon: Greek witness tradition
  rationale: 그리스어 전승의 형태를 따라 음역하고, 본문에 나타난 고유명사의 음가를 최대한 보존했습니다.
theological_decisions:
- issue: ἁγίους를 둘러싼 칭찬과 반응의 윤리
  chosen_reading: ‘거룩한 사람이라고 칭찬하더라도, 높아지지 마십시오’로 옮겨, 칭찬이 자만으로 변하는 영적 위험을 그대로 드러냈습니다.
  alternative_readings:
  - ‘성도라 칭찬하더라도’
  - ‘거룩하다고 불리더라도’
  rationale: 원문은 칭찬 자체보다 그것이 낳는 내적 변형을 경계하므로, 외형적 칭찬과 자만의 연결을 분명히 해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: source-directed paraenesis'
- issue: Κύριος의 번역과 영적 대립
  chosen_reading: ‘주님’으로 번역해, 영혼이 흔들릴 때 주님의 떠나심과 베리알의 지배가 대비되도록 했습니다.
  alternative_readings:
  - ‘주’
  - ‘주 하나님’
  rationale: 여기서는 경구적·신학적 울림이 강한 ‘주님’이 가장 자연스럽고, 악한 세력과의 대비도 선명해집니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
