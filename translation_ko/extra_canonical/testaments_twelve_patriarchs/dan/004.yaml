    text: ‘자극받은 것’(ἐρεθισθέν)은 난해한 표현입니다. ‘자극된 것을 깨닫게 한다’, ‘일어난 자극을 알아차리게 한다’ 또는 ‘자극을 알아차리게 한다’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘거짓과 함께’는 분노가 거짓을 동반하여 일어난다는 뜻일 수 있고, 슬픔이 거짓으로 강화된 분노를 낳는다는 뜻일 수도 있습니다.
    reason: alternative_reading
