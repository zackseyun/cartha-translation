review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 제시된 그리스어 4:1은 ‘분노의 힘을 깨달으십시오. 그것은 헛된 것입니다’(Οὐκοῦν σύνετε τὴν δύναμιν τοῦ θυμοῦ ὅτι ματαία ἐστίν)라고 하며, 초안의 ‘눈먼 것입니다’ 및 뒤따르는 ‘얼굴도 참되게 보지 못하게 합니다’는 이 발췌문에 근거하지 않습니다. 4:2의 ψυχή는 ‘영’보다 ‘영혼’으로, 4:5의 ἐπιθυμῆσαι τοῦ ἀπολλυμένου는 ‘분노하고 싶어 하게’가 아니라 잃어 가는 것을 욕망하게 하는 것으로 옮겨야 합니다. 4:7의 대명사는 계속 동요하는 ‘영혼’을 가리키므로 이를 명시했습니다.
  naturalness: 합쇼체 권면문으로 자연스럽게 다듬었습니다. ‘분노로 움직이지 마십시오’는 원문의 운동 비유를 보존하면서 ‘분노에 흔들리지 마십시오’로 자연화했고, ‘기쁨이나 불쾌감 때문에 마음을 바꾸지 마십시오’는 대조 구조를 분명히 합니다.
  terminology: θυμός/ὀργή는 ‘분노’로 일관되게, ψυχή는 ‘영혼’으로, Κύριος는 ‘주님’으로, Βελίαρ는 그리스어 형태에 따른 ‘베리알’로 유지했습니다. 4:4의 난해한 ἐρεθισθέν은 본문에서 ‘자극받은 것을’으로 절제하여 옮기고 대안 독법을 각주에 남겼습니다.
  issues:
  - severity: high
    issue: 4:1이 영어 감사본의 절단·확장된 문구를 따름
    rationale: 제시된 그리스어 본문은 μάταια(헛된)라고 할 뿐 ‘눈멂’이나 ‘어떤 사람의 얼굴’을 언급하지 않습니다. 원문 우선 원칙상 해당 추가 문장을 삭제하고 ‘헛된 것입니다’로 바로잡아야 합니다.
  - severity: high
    issue: 4:5에서 ἐπιθυμῆσαι τοῦ ἀπολλυμένου의 목적어가 ‘분노’로 바뀜
