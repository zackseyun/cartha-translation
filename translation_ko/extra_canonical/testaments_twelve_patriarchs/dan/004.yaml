theological_decisions:
- issue: ἁγίους를 둘러싼 칭찬과 반응의 윤리
  chosen_reading: ‘거룩한 사람이라고 칭찬하더라도, 높아지지 마십시오’로 옮겨, 칭찬이 자만으로 변하는 영적 위험을 그대로 드러냈습니다.
  alternative_readings:
  - ‘성도라 칭찬하더라도’
  - ‘거룩하다고 불리더라도’
  rationale: 원문은 칭찬 자체보다 그것이 낳는 내적 변형을 경계하므로, 외형적 칭찬과 자만의 연결을 분명히 해야 합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: source-directed paraenesis'
- issue: Κύριος의 번역과 영적 대립
  chosen_reading: ‘주님’으로 번역해, 영혼이 흔들릴 때 주님의 떠나심과 베리알의 지배가 대비되도록 했습니다.
  alternative_readings:
  - ‘주’
  - ‘주 하나님’
  rationale: 여기서는 경구적·신학적 울림이 강한 ‘주님’이 가장 자연스럽고, 악한 세력과의 대비도 선명해집니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: κύριος'
