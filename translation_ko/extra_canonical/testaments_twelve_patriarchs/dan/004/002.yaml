id: T12P.DAN.4.2
reference: Testament of Dan 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐν γὰρ λόγῳ παροξύνεται⁵ πρῶτον εἶτα⁶ *ἐν ἔργοις⁷ †δυναμοῖ⁸ τὸν ὀργιζόμενον⁹, καὶ¹⁰ ἐν *ζημίαις πικραῖς διαταράσσει τὸ διαβούλιον αὐτοῦ¹¹, καὶ οὕτως διεγείρει ἐν θυμῷ μεγάλῳ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/002.yaml
  text: For first he is provoked by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it throws his purpose into confusion, and so it stirs up his soul in great wrath.
translation:
  language: ko
  text: 그는 먼저 한 말로 자극을 받고, 다음에는 행동으로 분노하는 사람을 더 강하게 만들며, 쓰라린 손실로 그의 계획을 혼란에 빠뜨리고, 그래서 큰 진노 가운데 그의 영을 뒤흔듭니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγῳ παροξύνεται
  english_pob_choice: he is provoked by a word
  chosen_korean: 한 말로 자극을 받고
  alternatives_korean:
  - 한 말에 자극을 받습니다
  - 말 한마디에 격분합니다
  lexicon: παροξύνομαι
  rationale: λόγῳ를 ‘말로’ 두고 παροξύνεται의 수동/중간 의미를 ‘자극을 받다’로 옮겨, 단순한 감정보다 외부 자극에 의해 분노가 촉발되는 흐름을 살렸습니다.
- source_word: ἐν ἔργοις δυναμοῖ τὸν ὀργιζόμενον
  english_pob_choice: by deeds it strengthens the one who is becoming angry
  chosen_korean: 행동으로 분노하는 사람을 더 강하게 만들며
  alternatives_korean:
  - 행동으로 분노하는 이를 힘나게 하며
  - 행동으로 분노하는 자를 강화하며
  lexicon: δυναμόω / ὀργίζομαι
  rationale: δυναμοῖ를 단순히 ‘힘을 주다’보다 관계적·정서적 강화의 흐름을 담아 ‘더 강하게 만들다’로 옮겼고, ὀργιζόμενον은 현재 분노가 진행 중인 사람으로 보아 동사형 표현을 유지했습니다.
- source_word: ἐν ζημίαις πικραῖς διαταράσσει τὸ διαβούλιον αὐτοῦ
  english_pob_choice: by bitter losses it throws his purpose into confusion
  chosen_korean: 쓰라린 손실로 그의 계획을 혼란에 빠뜨리고
  alternatives_korean:
  - 쓴 손실로 그의 결심을 어지럽히고
  - 쓴 손해로 그의 계획을 뒤흔들고
  lexicon: ζημίαις πικραῖς / διαβούλιον
  rationale: ζημίαις πικραῖς는 문자적으로 ‘쓰라린 손실들’이지만 한국어에서는 자연스럽게 ‘쓰라린 손실’로 압축했고, διαβούλιον은 내면의 의도·계획을 가리키므로 ‘계획’으로 옮겼습니다.
- source_word: ἐν θυμῷ μεγάλῳ τὴν ψυχὴν αὐτοῦ
  english_pob_choice: it stirs up his soul in great wrath
  chosen_korean: 큰 진노 가운데 그의 영을 뒤흔듭니다
  alternatives_korean:
  - 큰 분노 가운데 그의 영혼을 뒤흔듭니다
  - 큰 격분 속에서 그의 마음을 뒤흔듭니다
  lexicon: θυμός / ψυχή
  rationale: θυμόν은 강한 분노의 정서이므로 ‘진노’로, ψυχή는 문맥상 인간 내면 전체를 가리키므로 POB의 ‘soul’을 따라 ‘영’으로 옮겨 내적 동요를 살렸습니다.
theological_decisions:
- issue: 분노가 촉발되는 단계적 묘사
  chosen_reading: 말—행동—손실의 순서로 분노가 점증하며, 마지막에 내면 전체(영)가 뒤흔들리는 구조로 옮겼습니다.
  alternative_readings:
  - 각 절을 단순 나열형으로 평평하게 번역할 수 있습니다.
  - ‘진노’ 대신 더 약한 ‘분노’로 통일할 수 있습니다.
  rationale: 원문은 원인과 결과를 단계적으로 누적시키므로, 한국어도 점층적 동사 연결로 그 긴장감을 드러내는 편이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 인간의 분노와 내적 동요에 대한 지혜문학적/윤리적 관찰
- issue: ψυχή의 번역
  chosen_reading: 여기서는 ‘영’으로 번역해 내면의 생기와 인격 전체의 흔들림을 드러냈습니다.
  alternative_readings:
  - ‘영혼’으로 번역할 수 있습니다.
  - ‘마음’으로 완화해 번역할 수 있습니다.
  rationale: 이 구절의 결말은 단순 감정이 아니라 사람의 내적 중심이 진노에 의해 흔들리는 상태를 말하므로, 너무 심리화하지 않으면서도 한국어로 자연스러운 ‘영’을 택했습니다.
  doctrine_reference: 인간의 내적 존재(ψυχή)에 대한 일반적 성경적 용례
