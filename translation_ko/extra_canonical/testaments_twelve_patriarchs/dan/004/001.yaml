lexical_decisions:
- source_word: Οὐκοῦν
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그런즉
  lexicon: οὖν
  rationale: 논리적 결론을 나타내는 연결어로 자연스럽게 옮겼습니다.
- source_word: σύνετε
  english_pob_choice: understand
  chosen_korean: 이해하십시오
  alternatives_korean:
  - 깨달으십시오
  - 알아들으십시오
  lexicon: συνίημι
  rationale: 지적 인식과 분별을 함께 담는 명령형으로, 본문이 요구하는 숙고를 현대 한국어로 분명히 살렸습니다.
- source_word: τὴν δύναμιν τοῦ θυμοῦ
  english_pob_choice: the power of anger
  chosen_korean: 분노의 능력
  alternatives_korean:
  - 분노의 힘
  - 분노의 세력
  lexicon: δύναμις / θυμός
  rationale: δύναμις의 ‘능력/힘’과 θυμός의 ‘분노’를 직결해, 분노가 실제로 사람을 지배하는 작용을 드러냈습니다.
- source_word: ματαία
  english_pob_choice: futile
  chosen_korean: 헛됩니다
  alternatives_korean:
  - 헛되다
  - 무익합니다
  - 허무합니다
  lexicon: μάταιος
  rationale: 도움이 되지 않고 목적에 이르지 못하는 상태를 간결한 현대 한국어로 표현했습니다.
theological_decisions:
- issue: 분노의 평가를 약화시키지 않고 직접적으로 옮길지 여부
  chosen_reading: 분노를 단순한 감정이 아니라 사람을 무력하게 만드는 실재적 힘으로 표현했습니다.
  alternative_readings:
  - 분노는 쓸모없습니다
  - 분노는 허망합니다
  rationale: 원문은 분노의 ‘능력’ 자체를 보게 한 뒤 그것이 ‘헛됨’이라고 말하므로, 윤리적 권고를 넘어 분노의 지배력을 드러내는 쪽이 본문 의도를 잘 반영합니다.
  doctrine_reference: 지혜문학적/윤리적 권면의 직접성 유지
- issue: 문장 종결을 단정형이 아니라 권면형으로 할지 여부
  chosen_reading: 한국어 본문은 명령형 합쇼체로 유지했습니다.
  alternative_readings:
  - 그러므로 분노의 능력을 아십시오
  - 그러므로 분노의 능력을 이해하시오
  rationale: σύνετε가 직접적인 권면이므로, 현대 공용어체의 공손한 명령형이 가장 자연스럽고 문맥에 맞습니다.
  doctrine_reference: 문체·화행 보존
