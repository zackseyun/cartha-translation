base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/003.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.
translation:
  language: ko
  text: 그러므로 누가 여러분을 거슬러 말할 때, 여러분은 분노에 휩쓸리지 마십시오. 또 누가 여러분을 거룩하다고 칭찬할 때, 교만해지지 마십시오. 즐거움이나 불쾌함 쪽으로 마음이 바뀌지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κινεῖσθε εἰς ὀργήν
  english_pob_choice: be stirred to anger
  chosen_korean: 분노에 휩쓸리지 마십시오
  alternatives_korean:
  - 분노하게 되지 마십시오
  - 성내지 마십시오
  - 격분하지 마십시오
  lexicon: κινεῖσθε / ὀργή
  rationale: ‘stirred to anger’의 수동적·내적 동요를 살려, 단순한 감정 금지보다 분노에 휘말리는 상태를 드러냈습니다.
- source_word: ἐπαίρεσθε
  english_pob_choice: be puffed up
  chosen_korean: 교만해지지 마십시오
  alternatives_korean:
  - 들뜨지 마십시오
  - 우쭐해지지 마십시오
  - 자만하지 마십시오
  lexicon: ἐπαίρω
  rationale: 칭찬을 받을 때의 내적 고양을 ‘교만’으로 옮겨, POB의 ‘be puffed up’가 지닌 도덕적·영적 함의를 반영했습니다.
- source_word: ὡς ἁγίους
  english_pob_choice: as holy
  chosen_korean: 거룩하다고
  alternatives_korean:
  - 성도라고
  - 성스럽다고
  lexicon: ἅγιος
  rationale: 문맥상 ‘holy’는 형용사적 칭찬이므로 ‘거룩하다고’로 직역성 있게 옮겼고, 여기서는 호칭인 ‘성도’보다 적절합니다.
- source_word: μεταβάλλεσθε ... εἰς τέρψιν μήτε εἰς ἀηδίαν
  english_pob_choice: Be changed neither to delight nor to disgust
  chosen_korean: 기쁨으로도, 혐오로도 변하지 마십시오
  alternatives_korean:
  - 즐거움으로도, 혐오로도 변하지 마십시오
  - 기쁨과 혐오 쪽으로도 바뀌지 마십시오
  lexicon: μεταβάλλω / τέρψις / ἀηδία
  rationale: 최종 대조는 ‘되다/바뀌다’의 방향성을 살리되, τέρψις와 ἀηδία의 정서적 양극을 ‘기쁨’과 ‘혐오’로 간결하게 대응시켰습니다.
theological_decisions:
- issue: 인격적 칭찬과 비난에 대한 공동체 윤리
  chosen_reading: 비난에도 분노에 휩쓸리지 말고, 거룩하다는 칭찬에도 교만해지지 말라는 훈계로 옮겼습니다.
  alternative_readings:
  - 중립적 자기통제 권고로 완화하는 번역
  - 감정 억제만 강조하는 번역
  rationale: 본문의 균형은 외부 평가에 흔들리지 않는 내적 절제를 요구하며, 단순한 감정 억제가 아니라 교만과 분노 모두를 경계하는 윤리입니다.
  doctrine_reference: 성화와 겸손, 분노 절제에 대한 지혜문학적 권면
