id: T12P.DAN.4.5
reference: Testament of Dan 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ³³ *ζημίᾳ ἢ ἀπωλείᾳ τινὶ περιπέσητε³⁴, τέκνα³⁵, ⌈μὴ ἐκθροεῖσθε³⁶⌉. ὅτι ⌈αὐτὸ⌉¹ τὸ πνεῦμα³⁷ *ποιεῖ ἐπιθυμῆσαι³⁸ τοῦ ἀπολλυμένου³⁹ ἵνα *θυμῷ πέσῃ διὰ τοῦ πάθους⁴⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/005.yaml
  text: But if you fall into any loss or destruction, children, do not be thrown into confusion. For that very spirit causes one to desire to be angry over what is perishing, so that he may fall into anger through passion.
translation:
  language: ko
  text: 그러나 자녀들이여, 여러분이 어떤 손실이나 파멸을 겪게 되더라도 혼란에 빠지지 마십시오. 그 영 자체가 멸망해 가는 것을 갈망하게 하여, 그가 격정을 통하여 분노에 빠지게 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζημίᾳ ἢ ἀπωλείᾳ
  english_pob_choice: any loss or destruction
  chosen_korean: 어떤 손실이나 멸망
  alternatives_korean:
  - 손해나 파멸
  - 손실이나 파괴
  lexicon: ζημία, ἀπώλεια
  rationale: ζημία는 단순한 경제적 ‘손실’만이 아니라 일반적 손상을 포함할 수 있어 ‘손실’로, ἀπώλεια는 POB의 ‘destruction’을 따라 ‘멸망’으로 옮겼습니다.
- source_word: μὴ ἐκθροεῖσθε
  english_pob_choice: do not be thrown into confusion
  chosen_korean: 혼란에 빠지지 마십시오
  alternatives_korean:
  - 두려워하지 마십시오
  - 동요하지 마십시오
  lexicon: ἐκθροέω
  rationale: POB의 ‘thrown into confusion’를 반영하되, 수동적 동요와 혼비백산의 느낌을 살려 표준어로 자연스럽게 ‘혼란에 빠지지 마십시오’로 옮겼습니다.
- source_word: τὸ πνεῦμα
  english_pob_choice: that very spirit
  chosen_korean: 그 바로 그 영
  alternatives_korean:
  - 그 영
  - 바로 그 영
  lexicon: πνεῦμα
  rationale: 지시의 강조를 살리기 위해 ‘그 바로 그’로 옮겼고, 여기서는 문맥상 일반적으로 작동하는 ‘영’으로 유지했습니다.
- source_word: ποιεῖ ἐπιθυμῆσαι τοῦ ἀπολλυμένου
  english_pob_choice: causes one to desire to be angry over what is perishing
  chosen_korean: 썩어 없어지는 것에 대해 분노하고 싶게 만들어서
  alternatives_korean:
  - 멸망하는 것 때문에 화내고 싶게 하여
  - 사라져 가는 것을 향해 분노하게 하여
  lexicon: ποιέω, ἐπιθυμέω, ἀπόλλυμι
  rationale: 문법적으로 ‘desire to be angry over’의 구조를 한국어에서 자연스럽게 풀어, ‘분노하고 싶게’로 욕구를, ‘썩어 없어지는 것’으로 ἀπολλυμένου의 현재 분사를 반영했습니다.
- source_word: θυμῷ ... διὰ τοῦ πάθους
  english_pob_choice: fall into anger through passion
  chosen_korean: 정욕을 통해 분노에 빠지게 합니다
  alternatives_korean:
  - 격정 때문에 분노에 빠지게 합니다
  - 열정 때문에 분노에 이르게 합니다
  lexicon: θυμός, πάθος
  rationale: θυμός는 ‘분노’, πάθος는 감정적 격정/정욕의 범주로 보아, 한국어에서 오해를 줄이기 위해 ‘정욕’을 택하되 ‘통해’로 매개 관계를 유지했습니다.
theological_decisions:
- issue: ἐκθροεῖσθε의 정서적 강도와 권면 톤
  chosen_reading: ‘혼란에 빠지지 마십시오’로 번역해 단순한 슬픔보다 더 강한 내적 동요와 혼비백산의 경고를 드러냈습니다.
  alternative_readings:
  - ‘당황하지 마십시오’
  - ‘두려워하지 마십시오’
  rationale: POB의 audit trail이 ‘distressed’에서 ‘thrown into confusion’으로 수정된 점을 따라, 본문이 주는 경계의 강도를 살렸습니다.
  doctrine_reference: 권면 문맥의 정서적 뉘앙스
- issue: πάθος의 윤리적 의미
  chosen_reading: ‘정욕’으로 옮겨 욕망의 격정이 분노를 촉발하는 부정적 의미를 드러냈습니다.
  alternative_readings:
  - ‘격정’
  - ‘열정’
  rationale: 문맥상 건전한 열정보다는 통제되지 않은 욕정/격정을 뜻하므로, 한국어 독자가 본문의 경고를 정확히 이해하도록 했습니다.
  doctrine_reference: 정념과 분노에 대한 윤리적 권면
