id: T12P.DAN.4.4
reference: Testament of Dan 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Πρῶτον γὰρ²⁴ τέρπει²⁵ τὴν ἀκοήν, καὶ οὕτως²⁶ ὀξύνει τὸν νοῦν²⁷ *τοῦ νοῆσαι²⁸ τὸ †ἐρεθισθέν²⁹, καὶ³⁰ θυμωθεὶς νομίζει³¹ δικαίως ὀργίζεσθαι³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/004.yaml
  text: For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.
translation:
  language: ko
  text: 먼저 듣는 것을 즐겁게 하고, 그렇게 정신을 날카롭게 하여 그 자극을 알아차리게 합니다. 그리고 분노하면, 자신이 정당하게 화를 내고 있다고 생각합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτον γὰρ
  english_pob_choice: For first
  chosen_korean: 첫째로는
  alternatives_korean:
  - 먼저는
  - 우선
  lexicon: πρῶτον
  rationale: 논리 전개를 나타내는 첫 번째 단계라는 점을 살려, 문두의 순서를 분명히 하는 표현으로 옮겼습니다.
- source_word: τέρπει τὴν ἀκοήν
  english_pob_choice: it pleases the hearing
  chosen_korean: 듣기를 즐겁게 하고
  alternatives_korean:
  - 귀를 기쁘게 하고
  - 청각을 즐겁게 하고
  lexicon: τέρπω + ἀκοή
  rationale: ἀκοή를 단순한 신체 기관보다 ‘듣는 행위/듣기’로 자연스럽게 풀어, 유혹이 감각을 먼저 즐겁게 한다는 뉘앙스를 살렸습니다.
- source_word: ὀξύνει τὸν νοῦν
  english_pob_choice: it sharpens the mind
  chosen_korean: 마음을 날카롭게 하여
  alternatives_korean:
  - 이성을 예리하게 하여
  - 생각을 날카롭게 하여
  lexicon: ὀξύνω + νοῦς
  rationale: νοῦς를 한국어의 ‘마음/생각’ 계열로 옮길 수 있으나, 문맥상 판단 능력이 예리해진다는 점을 살려 ‘마음을 날카롭게 하여’로 번역했습니다.
- source_word: τοῦ νοῆσαι τὸ ἐρεθισθέν
  english_pob_choice: to perceive the provocation
  chosen_korean: 자극을 깨닫게 합니다
  alternatives_korean:
  - 자극을 분별하게 합니다
  - 도발을 알아차리게 합니다
  lexicon: νοέω + ἐρεθίζω
  rationale: 원문은 ‘자극/도발된 것’을 분별하여 알아차리는 목적을 나타내므로, 한국어에서는 자연스럽고 직접적인 ‘자극을 깨닫게’로 처리했습니다.
- source_word: θυμωθεὶς νομίζει δικαίως ὀργίζεσθαι
  english_pob_choice: when he has become wrathful, he thinks that he is justly angry
  chosen_korean: 분노하게 되면, 자신이 마땅히 화를 내고 있다고 생각합니다
  alternatives_korean:
  - 격노하게 되면, 정당하게 분노하고 있다고 생각합니다
  - 화가 나면, 자기의 분노가 옳다고 여깁니다
  lexicon: θυμόω + νομίζω + δικαίως ὀργίζομαι
  rationale: ‘분노하게 되면’과 ‘마땅히 화를 내고 있다’의 대응으로, 분노의 자기정당화라는 문장 구조를 분명히 드러냈습니다.
theological_decisions:
- issue: 원문의 도덕적 자기정당화 진술을 어떻게 살릴지
  chosen_reading: 분노가 생긴 뒤에는 자신이 옳게 화를 내고 있다고 스스로 판단한다는 심리적 타락의 과정을 그대로 드러냈습니다.
  alternative_readings:
  - 그는 화가 난 뒤 정당한 분노라고 믿습니다
  - 그는 자기 분노를 의로운 것으로 여깁니다
  rationale: 이 절은 단순한 감정 묘사가 아니라, 자극→분노→자기정당화라는 윤리적 악순환을 말하므로 그 흐름이 약해지지 않도록 했습니다.
  doctrine_reference: 윤리적 자기기만과 분노의 정당화에 대한 성찰
