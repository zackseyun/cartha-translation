revisions:
- from: 첫째로는 듣기를 즐겁게 하고, 그 다음에는 마음을 날카롭게 하여 자극을 깨닫게 합니다. 그리고 분노하게 되면, 자신이 마땅히 화를 내고 있다고 생각합니다.
  to: 먼저 듣는 것을 즐겁게 하고, 그렇게 정신을 날카롭게 하여 그 자극을 알아차리게 합니다. 그리고 분노하면, 자신이 정당하게 화를 내고 있다고 생각합니다.
  rationale: 원문의 단계적 진행(먼저—그렇게—그리고)을 자연스럽게 보존하고, νοῦς와 δικαίως의 의미를 더 정확히 반영하도록 최소한으로 다듬었습니다. 논쟁적 형태인 ἐρεθισθέν에 대해서는 영어 POB의 ‘provocation’에 맞추어 해석을 과도하게 확정하지 않는 ‘그 자극’을 사용했습니다.
