  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ⁴¹ ἐὰν ζημιωθῆτε ἑκουσίως *ἢ ἀκουσίως⁴² *μὴ λυπεῖσθε⁴³· ἀπὸ γὰρ λύπης⁴⁴ ἐγείρεται⁴⁵ καὶ⁴⁶ θυμός⁴⁷ ⌈μετὰ ψεύδους⁷⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/006.yaml
  text: And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.
translation:
  language: ko
  text: 또 여러분이 자발적으로든 비자발적으로든 손해를 입게 되면, 슬퍼하지 마십시오. 슬픔에서 분노도 거짓과 함께 일어나기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζημιωθῆτε
  english_pob_choice: you suffer loss
  chosen_korean: 손해를 입게 되면
  alternatives_korean:
  - 손실을 입게 되면
  - 피해를 입게 되면
  - 잃게 되면
  lexicon: ζημιόω
  rationale: 영문 POB의 ‘suffer loss’를 자연스럽게 풀되, 단순한 재산 상실보다 더 넓은 ‘손해/불이익’의 의미를 살렸습니다.
- source_word: ἑκουσίως ... ἢ ἀκουσίως
  english_pob_choice: willingly or unwillingly
  chosen_korean: 자원해서든 원치 않아서든
  alternatives_korean:
  - 원해서든 원치 않아서든
  - 자발적으로든 비자발적으로든
  - 기꺼이든 마지못해서든
  lexicon: ἑκουσίως / ἀκουσίως
  rationale: 행위의 의지 여부를 대조하는 구조를 살려, 한국어에서도 대조가 분명한 표현으로 옮겼습니다.
- source_word: μὴ λυπεῖσθε
  english_pob_choice: do not be grieved
  chosen_korean: 슬퍼하지 마십시오
  alternatives_korean:
  - 근심하지 마십시오
  - 괴로워하지 마십시오
  - 마음 아파하지 마십시오
  lexicon: λυπέω
  rationale: 명령형 금지의 직접성을 살리면서, ‘그리워하다’처럼 다른 뜻으로 읽히지 않도록 ‘슬퍼하다’를 택했습니다.
- source_word: λύπης ... θυμός ... μετὰ ψεύδους
  english_pob_choice: from grief anger also arises with falsehood
  chosen_korean: 슬픔에서 분노도 함께 일어나고 거짓도 따르기 때문입니다
  alternatives_korean:
  - 슬픔에서 분노도 일어나고 거짓도 생기기 때문입니다
  - 슬픔에서 분노와 거짓이 함께 일어나기 때문입니다
  - 슬픔에서 분노도 생기고 거짓도 뒤따르기 때문입니다
  lexicon: λύπη / θυμός / ψεῦδος
  rationale: 원문의 인과를 유지하면서, λύπη와 θυμός의 심리적 연쇄를 한국어로 유려하게 드러냈습니다. 마지막의 μετὰ ψεύδους는 분노와 함께 거짓이 동반된다는 뜻으로 읽어 ‘거짓도 따르기’로 옮겼습니다.
theological_decisions:
- issue: 분노와 거짓의 연쇄를 어떻게 드러낼 것인가
  chosen_reading: 슬픔이 분노를 낳고 거짓이 그 과정에 동반된다는 경고로 읽었습니다.
  alternative_readings:
  - 단순히 슬픔과 분노가 나란히 생긴다는 묘사
  - 거짓이 분노를 수반한다는 더 직접적인 진술
  rationale: 문맥상 도덕적 권고이므로, 원문의 인과관계를 약화하지 않으면서도 한국어에서 이해가 쉬운 경고문으로 정리했습니다.
  doctrine_reference: 윤리적 권면과 정서의 인과성
