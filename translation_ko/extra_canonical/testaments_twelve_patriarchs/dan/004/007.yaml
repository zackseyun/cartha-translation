id: T12P.DAN.4.7
reference: Testament of Dan 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἔστι δὲ διπρόσωπον κακὸν ὁ θυμὸς μετὰ ψεύδους⁴⁸, καὶ συναίρονται⁴⁹ ἀλλήλοις ἵνα ταράξωσι⁵⁰ *τὴν καρδίαν⁵¹· ταρασσομένης δὲ τῆς ψυχῆς συνεχῶς, ἀφίσταται ὁ⁵² Κύριος ἀπ᾽ αὐτῆς καὶ κυριεύει αὐτῆς ὁ Βελίαρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/007.yaml
  text: And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it, and Beliar rules over it.
translation:
  language: ko
  text: 그런데 분노와 거짓말은 이중적인 악이어서 서로 합하여 마음을 어지럽힙니다. 또 영혼이 계속해서 흔들리면 주께서 그에게서 떠나시고, 벨리알이 그를 다스립니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διπρόσωπον κακὸν
  english_pob_choice: a two-faced evil
  chosen_korean: 이중적인 악
  alternatives_korean:
  - 두 얼굴의 악
  - 겉과 속이 다른 악
  lexicon: διπρόσωπος
  rationale: 직역적 이미지는 살리되, 한국어에서 자연스럽고 문맥상 분노와 거짓말의 결합을 드러내는 표현으로 옮겼습니다.
- source_word: θυμὸς μετὰ ψεύδους
  english_pob_choice: anger with falsehood
  chosen_korean: 분노와 거짓말
  alternatives_korean:
  - 분노와 거짓
  - 분노와 허위
  lexicon: θυμός + ψεῦδος
  rationale: ψεύδους를 단순한 ‘거짓’보다 행위성과 대립성을 분명히 하는 ‘거짓말’로 옮겨, 분노와 결합된 도덕적 왜곡을 살렸습니다.
- source_word: ταράξωσι τὴν καρδίαν
  english_pob_choice: to trouble the heart
  chosen_korean: 마음을 어지럽힙니다
  alternatives_korean:
  - 마음을 괴롭게 합니다
  - 마음을 뒤흔듭니다
  lexicon: ταράσσω + καρδία
  rationale: καρδία를 한국어 관용에 맞게 ‘마음’으로 옮기되, 단순한 감정이 아니라 내적 질서를 흐트러뜨리는 뜻을 ‘어지럽힙니다’로 표현했습니다.
- source_word: ἀφίσταται ὁ Κύριος ἀπ᾽ αὐτῆς
  english_pob_choice: the Lord departs from it
  chosen_korean: 주께서 그에게서 떠나시고
  alternatives_korean:
  - 주님이 그에게서 물러나시고
  - 주께서 그것을 떠나시고
  lexicon: Κύριος
  rationale: 영문 POB의 ‘the Lord’에 따라 주체를 하나님으로 읽었고, 인격화된 ‘영혼’에 맞추어 지시 대명사를 ‘그’로 자연화했습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리알
  alternatives_korean:
  - 벨리아르
  - 벨리야르
  lexicon: Βελίαρ
  rationale: 통용 가능한 음역을 택해 고유명사의 음가를 최대한 보존했습니다.
theological_decisions:
- issue: Personification of the soul and the departure of the Lord
  chosen_reading: ‘영혼이 계속해서 흔들리면’으로 옮겨, 내적 동요가 지속될 때 주의 임재가 떠나고 악한 존재가 지배한다는 경고를 그대로 드러냈습니다.
  alternative_readings:
  - ‘혼이 계속해서 흔들리면’
  - ‘마음이 계속 동요하면’
  rationale: 원문은 ψυχή의 지속적 동요를 원인으로 삼아 영적 지배의 전환을 말하므로, 심리적 완화 없이 인과 관계를 분명히 했습니다.
  doctrine_reference: 영적 분별과 유혹, 하나님의 임재와 악한 권세의 대립
