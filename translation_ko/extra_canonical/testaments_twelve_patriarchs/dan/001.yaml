  rationale: 원문의 표제와 1–9절 구조를 복원하고, 생애 제125년이라는 연대와 발라·벨리아르의 이름을 제시된 그리스어에 맞추었습니다. 원문에 없는 ‘불법 행위’와 ‘두 지파’를 삭제했으며, 1:8의 난해한 비유와 1:9의 ‘두 번째 홀’은 해석으로 고정하지 않고 각주로 불확실성을 밝혔습니다.
