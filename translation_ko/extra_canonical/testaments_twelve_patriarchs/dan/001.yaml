base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001.yaml
  text: 'In the fifth year of his life[a], Dan called together his family and said:


    2. “Hear my words, sons of Dan, and pay attention to the words of your father.

    3. I have tested in my heart, and in all my life, that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.

    4. So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.

    5. And I rejoiced over his being sold, because his father loved him more than us.

    6. For the spirit of jealousy and of arrogance kept saying to me, ‘You yourself also are his son.’

    7. And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you when he is dead.’

    8. Now this was the spirit of anger persuading me, that just as a leopard devours a young goat, so I too should destroy Joseph.

    9. But the God of my fathers did not give him into my hands[b], so that I might find him alone and kill him and commit this lawless deed[c], lest two tribes be destroyed from Israel.”'
  footnotes:
  - marker: a
    text: The opening chronological notice is terse in the Greek witness and likely means 'in the fifth year of his life' in the testamentary framework.
    reason: textual_variant
    anchor_ref: '1:1'
  - marker: b
    text: The Greek image is textually difficult. Some witnesses preserve a more graphic predatory metaphor; the main text renders the sense without overstating a corrupt detail.
    reason: textual_variant
    anchor_ref: '1:8'
  - marker: c
    text: Some witness forms read 'the God of my father Jacob' rather than 'the God of my fathers.'
    reason: alternative_reading
    anchor_ref: '1:9'
translation:
  language: ko
  text: '야곱과 발라의 일곱째 아들 단의 유언입니다.


    1. 단이 생애 제125년에, 죽음을 앞두고 자기 가문을 불러 모아 말했습니다. “단의 아들들아, 내 말을 들으십시오. 너희 아버지의 말에 귀를 기울이십시오.


    2. 나는 내 마음으로, 또 내 평생에 걸쳐 시험해 보았습니다. 진리와 의로운 행실은 선하고 하나님을 기쁘시게 하지만, 거짓과 분노는 악하여 사람에게 온갖 악을 가르친다는 것을 말입니다.


    3. 그러므로 오늘, 내 자녀들아, 내가 너희에게 고백합니다. 나는 내 마음에 선하고 참된 사람인 내 형제 요셉의 죽음을 품었습니다.


    4. 나는 그가 팔리는 것을 기뻐했습니다. 그의 아버지가 우리보다 그를 더 사랑했기 때문입니다.


    5. 시기와 오만의 영이 내게 말했습니다. ‘너도 그의 아들이다.’


    6. 또 벨리아르의 영들 가운데 하나가 나와 함께 작용하며 말했습니다. ‘이 칼을 들어 요셉을 죽여라. 그가 죽으면 네 아버지가 너를 사랑할 것이다.’


    7. 이것은 나를 설득하던 분노의 영이었습니다. 표범이 어린 염소를 먹어 치우듯이, 나도 요셉을 그렇게 없애도록 내 마음에 충동을 넣었습니다.[a]


    8. 그러나 내 조상들의 하나님께서는 그가 내 손에 떨어지도록 내버려 두지 않으셨습니다.


    9. 그래서 내가 그를 홀로 찾아 죽이고, 이스라엘에서 두 번째 홀이 사라지게 하지 못하게 하셨습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 표범과 어린 염소의 비유에서 ‘빨아 먹다/빨아 말리다’로 이해될 수 있는 난해한 동사를 전하며, 본문에는 비평상의 난문 표지가 있습니다. 번역은 요셉을 향한 포식적·파괴적 충동이라는 확실한 뜻을 옮깁니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘이스라엘에서 두 번째 홀(σκῆπτρον)이 풀려/사라지게 하다’입니다. 이 표현이 가리키는 역사적·상징적 대상을 본문만으로 특정하기 어려우므로 ‘두 번째 홀’로 보존했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγων / ῥήμασι
  english_pob_choice: words
  chosen_korean: 말 / 말씀
  alternatives_korean:
  - 말씀
  - 이야기
  lexicon: BDAG / LSJ
  rationale: 아들의 유언적 권면이라는 문맥에서 ῥήμασι는 단순한 정보가 아니라 아버지의 권위 있는 발화이므로, 본문은 ‘말’로 두고 2절에서 ‘귀를 기울이십시오’와 함께 자연스럽게 살렸습니다.
- source_word: ἀλήθεια
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 진실
  lexicon: BDAG
  rationale: 윤리적 대조(진리/거짓)로 쓰인 핵심어라서 ‘진리’가 가장 직접적이며, POB의 moral sense를 유지합니다.
- source_word: δικαιοπραγίας
  english_pob_choice: righteous conduct
  chosen_korean: 의로운 행실
  alternatives_korean:
  - 의로운 실천
  - 바른 행실
  lexicon: LSJ
  rationale: 추상적 ‘의’가 아니라 실제 삶의 실천을 가리키므로, 행위성을 드러내는 ‘의로운 행실’이 적절합니다.
- source_word: ψεῦδος / θυμός
  english_pob_choice: falsehood / anger
  chosen_korean: 거짓 / 분노
  alternatives_korean:
  - 거짓말 / 노여움
  - 허위 / 진노
  lexicon: BDAG
  rationale: 두 명사가 함께 악덕 목록을 이루므로 추상명사로 처리해 대구를 살렸고, ‘분노’는 문맥상 분노의 영과 연결됩니다.
- source_word: πνεύματα τοῦ Βελίαρ
  english_pob_choice: spirits of Beliar
  chosen_korean: 벨리아르의 영들
  alternatives_korean:
  - 벨리알의 영들
  - 벨리아르의 영
  lexicon: LSJ
  rationale: 그리스어 본문이 Βελίαρ 형을 가지므로 이를 음역해 남겼고, 복수형을 그대로 반영해 영적 존재들의 다수를 드러냈습니다.
- source_word: ἄνελε
  english_pob_choice: kill
  chosen_korean: 죽여라
  alternatives_korean:
  - 죽이라
  - 살해해라
  lexicon: BDAG
  rationale: 명령문의 폭력성과 직설성을 살리되, 현대 한국어에서 가장 자연스러운 강한 명령형으로 옮겼습니다.
- source_word: πάρδαλις / ἐκμυζῆσαι
  english_pob_choice: leopard / destroy
  chosen_korean: 표범이 어린 염소를 집어삼키듯 … 없애려 했던
  alternatives_korean:
  - 표범이 어린 염소를 먹어 치우듯 … 파괴하려 했던
  - 표범이 어린 염소를 찢듯 … 죽이려 했던
  lexicon: LSJ
  rationale: 전승이 난해하고 은유가 거칠어, 본문이 확실히 말하는 ‘포식적 파괴’만 남기고 지나친 세부는 절제했습니다.
- source_word: ἀνόμημα
  english_pob_choice: lawless deed
  chosen_korean: 이 불법
  alternatives_korean:
  - 이 불법 행위
  - 이 율법 없는 짓
  lexicon: BDAG
  rationale: 행위를 단순한 범죄가 아니라 규범을 어기는 일로 규정하므로, 법정적·도덕적 무게를 가진 ‘불법’으로 옮겼습니다.
theological_decisions:
- issue: 악의 기원과 인간 책임을 함께 보존할 것인지
  chosen_reading: 시기와 오만의 영, 벨리아르의 영, 분노의 영이 작용했지만, 다니의 의도와 행위 책임도 본문 흐름에서 그대로 드러나게 옮겼습니다.
  alternative_readings:
  - 심리적 유혹으로 완화
  - 악한 생각으로 일반화
  rationale: 이 본문은 외적 영적 작용과 내적 책임을 동시에 제시하므로, 어느 한쪽으로 환원하지 않고 둘 다 드러내야 합니다.
  doctrine_reference: 본문 내 긴장 보존
- issue: 하나님이 요셉을 ‘내 손에 넘기지 않으셨다’는 진술
  chosen_reading: 하나님의 주권적 막으심을 유지하면서도 다니의 살의는 그대로 드러내는 문장으로 번역했습니다.
  alternative_readings:
  - 허락하지 않으셨다
  - 보호하셨다
  rationale: 본문은 단순 보호보다 ‘넘기지 않으심’의 직접성을 말하므로, 결과와 주권을 함께 보존하는 표현이 필요합니다.
  doctrine_reference: 섭리와 인간 죄책의 병존
