  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/003.yaml
  text: Nevertheless Dan prophesied to them that they would forget [their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring].
translation:
  language: ko
  text: 그러나 단은 이 일 뒤에 그들이 그의 뼈를 옮겨 와 가까운 곳에 두었다고 그들에게 예언하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πλὴν οὖν
  english_pob_choice: Nevertheless / But
  chosen_korean: 그러나
  alternatives_korean:
  - 그런데
  - 하지만
  - 그렇지만
  lexicon: Greek adversative particle sequence
  rationale: 문맥상 앞선 내용과 대비를 이루는 전환이므로, 합쇼체 문장에 자연스럽고 과도하게 약화되지 않는 역접 ‘그러나’로 옮겼습니다.
- source_word: προεφήτευσεν αὐτοῖς
  english_pob_choice: prophesied to them
  chosen_korean: 그들에게 예언하여
  alternatives_korean:
  - 그들에게 예언하였고
  - 그들에게 미리 말하여
  - 그들에게 예언하였습니다
  lexicon: προφητεύω
  rationale: 동사의 핵심은 ‘예언하다’이므로 이를 유지했고, 뒤의 내용절과 자연스럽게 이어지도록 부사절형으로 처리했습니다.
- source_word: ὅτι ἐπὶ/ἐπιλά ταῦτα
  english_pob_choice: that after this
  chosen_korean: 이 일 뒤에
  alternatives_korean:
  - 그 뒤에
  - 이후에
  - 그 후에
  lexicon: temporal clause
  rationale: 영문 POB의 시간 부사절을 따라, 전승상의 애매한 구문을 한국어에서는 내용상 분명한 ‘이 일 뒤에’로 옮겨 사건 순서를 드러냈습니다.
- source_word: ἀνήνεγκαν τὰ ὀστᾶ αὐτοῦ / καὶ κατέθηκαν σύνεγγυς
  english_pob_choice: they carried up his bones and placed them nearby
  chosen_korean: 그들이 그의 뼈를 옮겨 와서 가까운 곳에 두었다
  alternatives_korean:
  - 그들이 그의 뼈를 가져다 가까이에 두었다
  - 그의 뼈를 올라 가져와 가까운 곳에 놓았다
  lexicon: bone transfer + nearby placement
  rationale: ‘옮겨 와서’는 ἀνήνεγκαν의 이동 의미를 살리고, ‘가까운 곳에 두었다’는 κατέθηκαν σύνεγγυς의 공간적 근접성을 자연스럽게 반영합니다.
theological_decisions:
- issue: 공적 예언 행위의 서술을 현대 한국어 합쇼체로 어떻게 유지할지
  chosen_reading: 서술은 합쇼체로 유지하되, 예언 행위 자체는 직설적으로 ‘예언하여’라고 번역했습니다.
  alternative_readings:
  - ‘예언하였습니다’로 완전 서술형 처리
  - ‘예고하였습니다’로 완화
  rationale: 본문은 단의 예언 행위를 사실적으로 진술하므로, 완곡한 표현보다 직접적인 ‘예언하다’를 유지하는 것이 원문에 더 가깝습니다.
  doctrine_reference: source-plain-sense
- issue: 본문의 전승 변이(‘그 뼈를 옮겨 와서…’)를 본문으로 반영할지
  chosen_reading: 영문 POB 개정과 그리스어 본문에 맞추어 뼈의 이장과 근접한 안치를 본문으로 반영했습니다.
  alternative_readings:
  - 구판식의 다른 의미를 따르는 번역
  - 변이를 본문 밖 주석으로만 처리
  rationale: 최신 감사기록이 이 구절의 실제 그리스어 어구를 명시하므로, 이를 본문에 반영하는 것이 source-grounded 원칙에 부합합니다.
  doctrine_reference: textual criticism
