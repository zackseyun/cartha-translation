base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/001.yaml
  text: And having said these things, he kissed them affectionately and fell asleep a good sleep.
translation:
  language: ko
  text: 그가 이런 말을 하고, 그들에게 다정히 입맞춘 뒤 좋은 잠에 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταφιλήσας αὐτούς
  english_pob_choice: he kissed them affectionately
  chosen_korean: 그들을 다정하게 입맞추고는
  alternatives_korean:
  - 그들에게 다정히 입맞추고는
  - 그들을 정답게 입맞추고는
  - 그들에게 애정 어린 입맞춤을 하고는
  lexicon: καταφιλέω
  rationale: καταφιλέω는 단순한 입맞춤보다 강한 애정의 표현이므로, 한국어에서는 ‘다정하게 입맞추다’로 그 뉘앙스를 살렸습니다.
- source_word: ὕπνωσεν
  english_pob_choice: fell asleep
  chosen_korean: 잠에 들었습니다
  alternatives_korean:
  - 잠들었습니다
  - 잠이 들었습니다
  lexicon: ὑπνόω
  rationale: 서술 동사로서 자연스러운 현대 한국어 표현을 택하되, 원문의 단순 완료 서술을 유지했습니다.
- source_word: ὕπνῳ καλῷ
  english_pob_choice: a good sleep
  chosen_korean: 좋은 잠에
  alternatives_korean:
  - 평안한 잠에
  - 좋은 잠으로
  - 편안한 잠에
  lexicon: ὕπνος καλός
  rationale: 직역하면 어색할 수 있으나, 원문의 형용사 καλός를 과도하게 풀지 않고 ‘좋은 잠’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘good sleep’의 의미를 해석적으로 확장할지 여부
  chosen_reading: 원문의 표현을 유지하여, 죽음이나 평안한 최후를 암시할 수는 있어도 본문에 없는 해설은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘평안한 잠’으로 의미를 해석해 완화함
  - ‘죽음의 잠’으로 설명적 번역을 덧붙임
  rationale: 이 절은 서술 자체가 간결하므로, 본문이 직접 말하는 범위를 넘지 않도록 ‘좋은 잠’이라는 표현을 보존하는 것이 가장 안전합니다.
  doctrine_reference: source-bound restraint in translation
