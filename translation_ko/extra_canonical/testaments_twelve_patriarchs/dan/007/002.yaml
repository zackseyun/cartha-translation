  text: And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.
translation:
  language: ko
  text: 그리고 그의 아들들이 그를 장사하였습니다. 그리고 이 일 후에 그들은 그의 뼈를 아브라함과 이삭과 야곱이 있는 곳으로 옮겼습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθαψαν αὐτὸν
  english_pob_choice: And his sons buried him.
  chosen_korean: 그의 아들들이 그를 장사하였습니다
  alternatives_korean:
  - 그의 아들들이 그를 묻었습니다
  - 그의 아들들이 그를 매장하였습니다
  lexicon: θάπτω
  rationale: 공적·장례적 행위를 드러내는 ‘장사하다’가 한국어에서 가장 자연스럽고, 단순히 땅에 묻는 일반 동작과 구별됩니다.
- source_word: ἀπήνεγκαν τὰ ὀστᾶ αὐτοῦ
  english_pob_choice: they carried up his bones
  chosen_korean: 그들은 그의 뼈를 … 옮겼습니다
  alternatives_korean:
  - 그들은 그의 뼈를 가져갔습니다
  - 그들은 그의 뼈를 운반했습니다
  lexicon: ἀναφέρω / ὀστέα
  rationale: 영문 POB의 ‘carried up’를 따라 상향 이동을 살리되, 한국어에서는 목적지까지 옮겨 가는 의미를 담는 ‘옮겼습니다’가 가장 간결합니다.
- source_word: ἔνθα ἦν Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  english_pob_choice: to the place where Abraham and Isaac and Jacob were
  chosen_korean: 아브라함과 이삭과 야곱이 있는 곳
  alternatives_korean:
  - 아브라함과 이삭과 야곱이 있던 곳
  - 아브라함과 이삭과 야곱이 거하던 곳
  lexicon: ἔνθα / ἦν
  rationale: 과거 위치를 한국어 현재형 서술로 풀어도 의미가 유지되며, 장면의 도착점을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 수신자에게 ‘뼈’를 옮긴 목적지의 성격을 어떻게 드러낼지
  chosen_reading: 본문은 단지 족장들이 있는 곳을 지시할 뿐이므로, 별도의 장례·내세 해설 없이 장소 표현을 유지했습니다.
  alternative_readings:
  - ‘묘소로’
  - ‘조상의 무덤으로’
  rationale: 원문과 영어 POB 모두 목적지를 구체화하지 않으므로, 해석을 덧붙이면 본문이 말하는 범위를 넘습니다.
  doctrine_reference: source fidelity / restraint in inference
