- from: 그리고 그의 아들들이 그를 장사하였습니다. 그리고 이 일 후에 그들은 그의 뼈를 아브라함과 이삭과 야곱이 있는 곳으로 옮겼습니다.[a][b]
  to: 그의 아들들이 그를 장사하였습니다. 그 뒤에 그들은 그의 뼈를 아브라함과 이삭과 야곱이 있던 곳으로 옮겼습니다.
