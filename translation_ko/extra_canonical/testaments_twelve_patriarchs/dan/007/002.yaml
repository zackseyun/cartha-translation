review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the burial and the transfer of the bones. However, the present-tense phrase “있는 곳” does not preserve the Greek imperfect ἦν (“were”); in this retrospective narrative, “있던 곳” is the appropriately noncommittal Korean equivalent. “옮겼습니다” is a natural rendering of ἀπήνεγκαν and does not add an unwarranted specification of the destination.
  naturalness: “장사하였습니다” is natural formal-polite Korean for burial. “그 뒤에” reads more naturally than repeating “그리고 … 그리고,” while retaining the sequential force of Καὶ … Καὶ μετὰ τοῦτο.
  terminology: The established biblical Korean forms 아브라함, 이삭, 야곱 are correct. No theological or funerary interpretation, such as “묘소” or “조상의 무덤,” should be added.
  issues:
  - severity: medium
    issue: Tense of the patriarchs’ location is shifted to the present.
    rationale: The Greek has ἔνθα ἦν, and the English audit trail likewise has “where … were.” “있는 곳” can imply their present presence; “있던 곳” retains the narrative past without further interpretation.
  - severity: medium
    issue: The text contains [a][b] anchors, but no corresponding footnote content is supplied.
    rationale: Unresolved anchors disrupt the reading and do not document a source-based note. The displayed source supplies no note content that would warrant retaining them.
  revised_text: 그의 아들들이 그를 장사하였습니다. 그 뒤에 그들은 그의 뼈를 아브라함과 이삭과 야곱이 있던 곳으로 옮겼습니다.
  revised_footnotes: []
