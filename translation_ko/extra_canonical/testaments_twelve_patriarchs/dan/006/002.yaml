  text: Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy.
  footnotes:
  - marker: a
    text: '''Mediator between God and men'' is translated directly from the Greek. The passage still speaks of an ''angel,'' so the wording is left unresolved rather than identified with a later doctrinal figure.'
