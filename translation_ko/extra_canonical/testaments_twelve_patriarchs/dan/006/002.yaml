  rationale: 본문의 목적어를 한국어 문맥상 자연스럽게 드러내기 위해 ‘하나님께’로 풀어 옮겼습니다.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  english_pob_choice: the angel who intercedes for you
  chosen_korean: 여러분을 위해 중재하며 곁에 머무는 천사
  alternatives_korean:
  - 여러분을 위해 간구하는 천사
  - 여러분을 위해 변호하는 천사
  lexicon: ἀγγέλος / παραιτοῦμαι
  rationale: POB의 수정본이 반영한 ‘곁에 머무름’과 ‘중재/간구’의 두 요소를 모두 살리기 위해 현재분사적 의미를 함께 드러냈습니다.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  english_pob_choice: a mediator between God and men
  chosen_korean: 하나님과 사람들 사이의 중보자
  alternatives_korean:
  - 하나님과 사람들 사이의 중재자
  - 하나님과 사람 사이의 중보자
  lexicon: μεσίτης
  rationale: ‘μεσίτης’의 관계적 기능을 살리되, 한국어 교회 용례와의 접점을 위해 ‘중보자’를 택했습니다.
- source_word: κατέναντι τῆς βασιλείας τοῦ θεοῦ
  english_pob_choice: stand opposite the kingdom of God
  chosen_korean: 하나님의 나라에 맞서 서 있을 것입니다
  alternatives_korean:
  - 하나님의 나라 앞에 서 있을 것입니다
