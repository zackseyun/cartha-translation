    anchor_ref: v2
translation:
  language: ko
  text: 하나님과 여러분을 위해 중재하며 곁에 머무는 천사에게 가까이 가십시오. 그가 하나님과 사람들 사이의 중보자이기 때문입니다[a]. 또한 이스라엘의 평강을 위해 그는 하나님의 나라에 맞서 서 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγγίσατε
  english_pob_choice: Draw near
  chosen_korean: 가까이 가십시오
  alternatives_korean:
  - 다가가십시오
  - 가까이 나아가십시오
  lexicon: ἐγγίζω
  rationale: 명령형의 직접성을 살리면서도 현대 한국어에서 자연스럽고 공손한 권면으로 옮겼습니다.
- source_word: τῷ θεῷ
  english_pob_choice: to God
  chosen_korean: 하나님
  alternatives_korean:
  - 하나님께
  - 하느님께
  lexicon: θεός
  rationale: 본문의 목적어를 한국어 문맥상 자연스럽게 드러내기 위해 ‘하나님께’로 풀어 옮겼습니다.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  english_pob_choice: the angel who intercedes for you
  chosen_korean: 여러분을 위해 중재하며 곁에 머무는 천사
  alternatives_korean:
  - 여러분을 위해 간구하는 천사
  - 여러분을 위해 변호하는 천사
  lexicon: ἀγγέλος / παραιτοῦμαι
  rationale: POB의 수정본이 반영한 ‘곁에 머무름’과 ‘중재/간구’의 두 요소를 모두 살리기 위해 현재분사적 의미를 함께 드러냈습니다.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  english_pob_choice: a mediator between God and men
  chosen_korean: 하나님과 사람들 사이의 중보자
  alternatives_korean:
  - 하나님과 사람들 사이의 중재자
  - 하나님과 사람 사이의 중보자
  lexicon: μεσίτης
  rationale: ‘μεσίτης’의 관계적 기능을 살리되, 한국어 교회 용례와의 접점을 위해 ‘중보자’를 택했습니다.
- source_word: κατέναντι τῆς βασιλείας τοῦ θεοῦ
  english_pob_choice: stand opposite the kingdom of God
  chosen_korean: 하나님의 나라에 맞서 서 있을 것입니다
  alternatives_korean:
  - 하나님의 나라 앞에 서 있을 것입니다
  - 하나님의 나라를 마주하고 설 것입니다
  lexicon: κατέναντι / βασιλεία τοῦ θεοῦ
  rationale: κ ατέναντι의 대립성을 살려 단순한 위치 표시가 아니라 ‘맞서’라는 의미를 반영했습니다.
theological_decisions:
- issue: 천사와 중보자의 관계를 특정한 후대 인물로 동일시할지 여부
  chosen_reading: 본문이 말하는 ‘천사’와 ‘중보자’를 그대로 유지하고, 동일시를 유보했습니다.
  alternative_readings:
  - 천사를 특정한 메시아적 인물로 해석
  - 중보자를 별도의 존재가 아닌 상징으로 처리
  rationale: 영어 POB의 주해가 강조하듯, 본문 자체는 여전히 ‘천사’를 말하며 신학적 동일시를 본문 밖에서 확정하지 않습니다.
  doctrine_reference: 본문 주해의 절제 원칙
- issue: τῆς βασιλείας τοῦ θεοῦ의 처리
  chosen_reading: ‘하나님의 나라’로 옮기되, 최종 대립 구문은 왕국/나라의 정치-신학적 긴장을 유지했습니다.
  alternative_readings:
  - 하나님의 왕국
  - 하나님의 통치
  rationale: 기존 POB 용례와의 일관성을 위해 ‘나라’를 기본으로 하면서, 대립의 뉘앙스를 약화하지 않도록 문장을 구성했습니다.
  doctrine_reference: 하나님의 나라
