    anchor_ref: v2
translation:
  language: ko
  text: 하나님과 여러분을 위하여 간구하는 천사에게 가까이 나아가십시오. 그는 하나님과 사람들 사이의 중재자이기 때문입니다[a]. 또한 이스라엘의 평화를 위하여 그는 하나님의 나라에 맞서 설 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님과 사람들 사이의 중재자’는 그리스어를 직접 옮긴 것입니다. 이 구절은 여전히 ‘천사’를 말하므로, 이를 후대의 특정 교리적 인물과 동일시하지 않고 그대로 두었습니다.
    reason: ‘중재자’라는 표현과 ‘천사’의 관계를 특정한 후대 인물로 해석하지 않도록, 원문의 미해결성을 보존합니다.
