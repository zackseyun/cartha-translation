  lexicon: κατέναντι / βασιλεία τοῦ θεοῦ
  rationale: κ ατέναντι의 대립성을 살려 단순한 위치 표시가 아니라 ‘맞서’라는 의미를 반영했습니다.
theological_decisions:
- issue: 천사와 중보자의 관계를 특정한 후대 인물로 동일시할지 여부
  chosen_reading: 본문이 말하는 ‘천사’와 ‘중보자’를 그대로 유지하고, 동일시를 유보했습니다.
  alternative_readings:
  - 천사를 특정한 메시아적 인물로 해석
  - 중보자를 별도의 존재가 아닌 상징으로 처리
  rationale: 영어 POB의 주해가 강조하듯, 본문 자체는 여전히 ‘천사’를 말하며 신학적 동일시를 본문 밖에서 확정하지 않습니다.
  doctrine_reference: 본문 주해의 절제 원칙
- issue: τῆς βασιλείας τοῦ θεοῦ의 처리
  chosen_reading: ‘하나님의 나라’로 옮기되, 최종 대립 구문은 왕국/나라의 정치-신학적 긴장을 유지했습니다.
  alternative_readings:
  - 하나님의 왕국
  - 하나님의 통치
  rationale: 기존 POB 용례와의 일관성을 위해 ‘나라’를 기본으로 하면서, 대립의 뉘앙스를 약화하지 않도록 문장을 구성했습니다.
  doctrine_reference: 하나님의 나라
