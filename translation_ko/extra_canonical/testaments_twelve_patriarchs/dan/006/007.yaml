  text: And his name will be in every place in Israel and among the nations.
translation:
  language: ko
  text: 그의 이름은 이스라엘의 모든 곳과 민족들 가운데 있을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄνομα αὐτοῦ
  english_pob_choice: his name
  chosen_korean: 그의 이름
  alternatives_korean:
  - 그 이름
  - 그의 명성
  lexicon: ὄνομα
  rationale: 직역에 가깝게 ‘이름’을 유지하여 인물의 명예나 기억이 아니라 이름 자체의 확산을 나타내게 했습니다.
- source_word: ἐν παντὶ τόπῳ
  english_pob_choice: in every place
  chosen_korean: 모든 곳에
  alternatives_korean:
  - 어느 곳에나
  - 각 곳에
  lexicon: ἐν + πᾶς τόπος
  rationale: ‘모든 곳’은 반복적으로 확산되는 전면성을 자연스러운 현대 한국어로 드러냅니다.
- source_word: Ἰσραήλ
  english_pob_choice: in Israel
  chosen_korean: 이스라엘의
  alternatives_korean:
  - 이스라엘 가운데
  - 이스라엘 안에
  lexicon: Ἰσραήλ
  rationale: 장소 전치사와 결합한 소속/범위 의미를 살려 ‘이스라엘의 모든 곳’으로 옮겼습니다.
- source_word: ἐν τοῖς ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데
  alternatives_korean:
  - 열방 가운데
  - 이방 민족들 가운데
  lexicon: ἔθνη
  rationale: ἔθνη의 기본 의미인 ‘민족들’을 살리되, 본문이 이스라엘과 대조하는 바깥 집단을 가리키므로 ‘가운데’를 더해 관계를 분명히 했습니다.
theological_decisions:
- issue: 이스라엘과 민족들 사이의 병렬 표현
  chosen_reading: 이스라엘 내부와 열방 전체에 걸친 이름의 확산으로 이해했습니다.
  alternative_readings:
  - 단순한 지리적 분포로 읽기
  - 종말론적 선포로 읽기
  rationale: 문맥상 과장된 전면성을 지닌 축복/예언적 진술로 보이므로, 번역에서는 선포의 범위를 또렷하게 살렸습니다.
  doctrine_reference: 문맥적 예언 언어
