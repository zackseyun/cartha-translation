id: T12P.DAN.6.1
reference: Testament of Dan 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: VI. Καὶ νῦν *φοβήθητε τὸν Κύριον¹, τέκνα μου, καὶ προσέχετε ἑαυτοῖς² ἀπὸ τοῦ Σατανᾶ καὶ *τῶν πνευμάτων³ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/001.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits.
translation:
  language: ko
  text: 이제 너희는 주님을 두려워하고, 내 자녀들아, 너희 자신을 사탄과 그의 영들로부터 지키십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  english_pob_choice: fear the Lord
  chosen_korean: 주님을 두려워하고
  alternatives_korean:
  - 주님을 경외하고
  - 주님을 무서워하고
  lexicon: φοβέομαι / κύριος
  rationale: 직접 명령의 강도를 살리면서도 한국어 성경 문맥에서 자연스러운 ‘두려워하다’를 택했습니다. 여기서는 단순 공포보다 하나님 앞의 경외를 포함합니다.
- source_word: προσέχετε ἑαυτοῖς
  english_pob_choice: watch yourselves
  chosen_korean: 너희 자신을 지키십시오
  alternatives_korean:
  - 너희를 살피십시오
  - 스스로를 조심하십시오
  lexicon: προσέχω + ἑαυτοῖς
  rationale: ‘주의를 기울이다’의 결과를 살려 자기 보호적 경계로 옮겼습니다. 현대 한국어에서 직접적이고 명료한 ‘지키다’가 적절합니다.
- source_word: Σατανᾶ καὶ τῶν πνευμάτων αὐτοῦ
  english_pob_choice: Satan and his spirits
  chosen_korean: 사탄과 그의 영들
  alternatives_korean:
  - 사탄과 그의 악한 영들
  - 사탄과 그의 영적 존재들
  lexicon: Σατανᾶς / πνεύματα
  rationale: 영들의 성격을 본문이 직접 규정하지 않으므로 ‘악한’을 덧붙이지 않고, POB의 의미를 그대로 반영해 ‘그의 영들’로 옮겼습니다.
theological_decisions:
- issue: κύριος의 번역과 경외 명령의 뉘앙스
  chosen_reading: 주님을 두려워하라는 권면을 경외와 순종을 포함한 언약적 태도로 읽었습니다.
  alternative_readings:
  - 주님을 경외하십시오
  - 주님을 무서워하십시오
  rationale: 본문의 명령은 감정적 공포보다 하나님 앞에서의 경외와 복종을 요구하는 문맥으로 이해하는 것이 자연스럽습니다.
  doctrine_reference: 하나님 경외 / 지혜 전통
- issue: ‘그의 영들’의 범위
  chosen_reading: 본문은 사탄에게 속한 여러 영적 존재를 말하며, 성격을 더 특정하지 않았습니다.
  alternative_readings:
  - 악한 영들
  - 귀신들
  rationale: 원문은 πνεύματα αὐτοῦ라고만 말하므로, 해석을 과도하게 확정하지 않고 문법적 범위 안에서 옮겼습니다.
  doctrine_reference: 영적 존재론 / 본문 충실성
