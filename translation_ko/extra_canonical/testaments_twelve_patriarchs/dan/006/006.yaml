  rationale: 원문의 난해한 병치와 영문 POB의 해석상 긴장을 보존하되, 번역투인 표현을 현대 표준 한국어로 다듬었습니다. ‘한 민족’은 ἔθνει의 부정 단수성을 반영하며, ‘옮겨 가실’은 μετελεύσεται의 전환·이동 의미를 자연스럽게 전달합니다.
