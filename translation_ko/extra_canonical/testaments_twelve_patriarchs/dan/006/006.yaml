translation:
  language: ko
  text: 그러나 이스라엘이 불법을 행하는 때에, 주께서는 그들에게서 떠나지 않으시고 자기 뜻을 찾는 한 민족에게로 옮겨 가실 것이니, 천사들 가운데 어느 누구도 그와 동등하지 않을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 문장은 난해합니다. 본문은 주께서 ‘그들에게서 떠나지 않으실’ 것이라고 하면서도 ‘자기 뜻을 찾는 한 민족에게로 옮겨 가실’ 것이라고 말합니다. 이 번역은 이 긴장을 매끄럽게 해소하지 않고 그대로 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνομίας τοῦ Ἰσραήλ
  english_pob_choice: Israel’s lawlessness
  chosen_korean: 이스라엘의 불법
  alternatives_korean:
  - 이스라엘의 무법
  - 이스라엘의 율법 없음
  - 이스라엘의 불의
  lexicon: ἀνομία
  rationale: POB가 lawlessness를 택한 점을 따라, 단순한 도덕적 나쁨보다 하나님의 질서를 거스르는 상태를 드러내는 표준적 표현으로 옮겼습니다.
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 야훼께서
  lexicon: κύριος
  rationale: 문맥상 주님의 주권적 행동을 나타내므로, 한국어 본문에서는 자연스러운 서술형인 ‘주께서’를 사용했습니다.
- source_word: μετελεύσεται ἐπ᾽ ἔθνει
  english_pob_choice: will pass over to a nation
  chosen_korean: 민족에게로 지나가실 것이니
  alternatives_korean:
  - 민족에게로 옮겨 가실 것이니
  - 민족 위로 넘어가실 것이니
  - 민족에게로 건너가실 것이니
  lexicon: μετελεύσεται
  rationale: 직역보다 ‘지나가다/지나가시다’가 본문의 이동·전환 이미지를 가장 간결하게 살리므로, 대상 ‘ἐπ᾽ ἔθνει’와 함께 자연스럽게 살렸습니다.
- source_word: οὐδεὶς τῶν ἀγγέλων ἔσται ἴσος αὐτῷ
  english_pob_choice: none of the angels will be equal to him
  chosen_korean: 천사들 가운데 어느 누구도 그와 같지 못하기 때문입니다
  alternatives_korean:
  - 천사들 가운데 누구도 그와 बराबरी할 수 없기 때문입니다
  - 천사들 중 아무도 그와 동등하지 않기 때문입니다
  lexicon: ἴσος
  rationale: ‘equal to him’의 비교 진술을 한국어에서 자연스럽게 유지하되, 마지막 이유절로 연결해 본문의 논증을 살렸습니다.
theological_decisions:
- issue: ‘주께서 그들에게서 떠나지 않으시고’와 ‘민족에게로 지나가실 것’의 긴장
  chosen_reading: 모순을 매끈하게 해소하지 않고, 같은 문장에서 남겨 두었습니다.
  alternative_readings:
  - ‘떠나지 않으시고’를 ‘버리지 않으시고’로 완화
  - ‘지나가실 것’만 남기고 앞의 부정은 약화
  rationale: 영문 POB가 문장의 긴장을 보존한 것처럼, 그리스어의 난해한 병치를 평탄화하지 않고 독자가 원문 문제를 볼 수 있게 했습니다.
  doctrine_reference: 본문 비평/난해 구절 처리 원칙
- issue: ἔθνος의 번역
  chosen_reading: ‘민족’으로 옮겼습니다.
  alternative_readings:
  - ‘나라’
  - ‘이방 민족’
  - ‘백성’
  rationale: 문맥상 특정한 정치 단위보다 하나님 뜻을 찾는 집단을 가리키므로, POB의 nation을 따라 ‘민족’이 가장 중립적이고 넓은 대응입니다.
  doctrine_reference: 어휘 선택 원칙
