source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Διὰ¹⁰ τοῦτο σπουδάζει ὁ ἐχθρὸς ὑποσκελίζειν¹¹ πάντας τοὺς ἐπικαλουμένους *τὸν Κύριον¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/003.yaml
  text: Because of this the enemy is eager to trip up all who call on the Lord.
translation:
  language: ko
  text: 이 때문에 원수는 주님을 부르는 모든 사람을 걸려 넘어뜨리려 애씁니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  english_pob_choice: Because of this
  chosen_korean: 이 때문에
  alternatives_korean:
  - 그러므로
  - 이로 인해
  lexicon: διά + οὗτος
  rationale: 앞선 문맥을 가리키는 인과 표현으로, 한국어에서 자연스럽고 문맥 연결이 분명한 「이 때문에」로 옮겼습니다.
- source_word: σπουδάζει
  english_pob_choice: is eager
  chosen_korean: 애씁니다
  alternatives_korean:
  - 서두릅니다
  - 열심히 합니다
  - 급히 합니다
  lexicon: σπουδάζω
  rationale: 단순한 속도보다 의도적이고 집요한 노력을 나타내므로, 원수가 적극적으로 해를 끼치려는 뉘앙스를 살려 「애씁니다」로 옮겼습니다.
- source_word: ὑποσκελίζειν
  english_pob_choice: to trip up
  chosen_korean: 걸려 넘어뜨리려
  alternatives_korean:
  - 발을 걸어 넘어뜨리려
  - 넘어지게 하려
  - 실족하게 하려
  lexicon: ὑποσκελίζω
  rationale: 직역하면 ‘발을 걸다’에 가깝지만, 한국어에서는 관계를 해치거나 믿음을 무너뜨리는 함의를 함께 드러내는 「걸려 넘어뜨리다」가 가장 자연스럽습니다.
- source_word: τὸν Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: κύριος
  rationale: 본문은 야훼 인용이 아니라 일반적인 경배 호칭이므로, 프로젝트 기본값에 따라 「주님」으로 옮겼습니다.
theological_decisions:
- issue: 원수의 활동 묘사
  chosen_reading: 원수는 단순히 방해하는 수준이 아니라, 주님을 부르는 사람들을 넘어지게 하려는 능동적이고 의도적인 적대 행위자로 제시됩니다.
  alternative_readings:
  - 원수는 사람들을 혼란스럽게 한다
  - 원수는 사람들을 시험한다
  rationale: σπουδάζει와 ὑποσκελίζειν의 결합은 우연한 장애가 아니라 목표 지향적 공격을 뜻하므로, 그 긴장을 약화시키지 않도록 적극성을 살렸습니다.
  doctrine_reference: 영적 대적과 유혹에 대한 성서적 묘사
- issue: ‘주님을 부르는’ 표현
  chosen_reading: 호명의 행위 자체를 유지해, 단순한 신앙 보유가 아니라 공개적으로 주님께 의지하고 간구하는 사람들을 가리키게 했습니다.
  alternative_readings:
  - 주님을 믿는
  - 주님께 기도하는
  rationale: ἐπικαλουμένους는 ‘부르다/호소하다’의 현재 분사로, 반복적이고 지속적인 의존 행위를 나타내므로 이를 직접 반영했습니다.
  doctrine_reference: 기도와 신뢰의 호소 행위
