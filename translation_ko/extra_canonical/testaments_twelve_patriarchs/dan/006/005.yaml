source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Αὐτὸς γὰρ¹⁵ ὁ ἄγγελος *τῆς εἰρήνης¹⁶ *ἐνισχύσει τὸν Ἰσραὴλ¹⁷ μὴ ἐμπεσεῖν¹⁸ αὐτὸν εἰς τέλος¹⁹ κακῶν²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/005.yaml
  text: For he himself, the angel of peace, will strengthen Israel so that it will not fall into uttermost evils.
translation:
  language: ko
  text: 그가 바로, 평강의 천사께서 이스라엘을 끝내 지극한 악들에 빠지지 않도록 강하게 하실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ ἄγγελος τῆς εἰρήνης
  english_pob_choice: For he himself, the angel of peace
  chosen_korean: 그가 바로, 평강의 천사께서
  alternatives_korean:
  - 그 자신, 평화의 천사가
  - 바로 그 평강의 천사가
  lexicon: ἄγγελος → 천사; εἰρήνη → 평강
  rationale: αὐτὸς γὰρ의 강조를 ‘그가 바로’로 살리고, εἰρήνη는 본문 맥락상 ‘평강’이 더 일관된 POB 용어이므로 그렇게 옮겼습니다.
- source_word: ἐνισχύσει
  english_pob_choice: will strengthen
  chosen_korean: 강하게 하실 것입니다
  alternatives_korean:
  - 굳세게 하실 것입니다
  - 힘을 주실 것입니다
  lexicon: ἐνισχύω → 강하게 하다
  rationale: 동사의 핵심 의미는 ‘강하게 하다, 강화하다’이므로 한국어로 자연스럽게 ‘강하게 하실 것입니다’로 옮겼습니다.
- source_word: τὸν Ἰσραήλ
  english_pob_choice: Israel
  chosen_korean: 이스라엘을
  alternatives_korean:
  - 이스라엘에게
  - 이스라엘 백성을
  lexicon: Ἰσραήλ → 이스라엘
  rationale: 직접 목적어 표지를 따라 ‘이스라엘을’로 두어 문장 구조를 분명히 했습니다.
- source_word: μὴ ἐμπεσεῖν αὐτὸν εἰς τέλος κακῶν
  english_pob_choice: so that it will not fall into uttermost evils
  chosen_korean: 끝내 지극한 악들에 빠지지 않도록
  alternatives_korean:
  - 마침내 극심한 악들에 빠지지 않도록
  - 결국 최악의 악들에 빠지지 않도록
  lexicon: ἐμπίπτω → 빠지다; εἰς τέλος κακῶν → 끝까지/최후의 악들
  rationale: μὴ ἐμπεσεῖν은 목적·결과를 나타내므로 ‘~지 않도록’으로 처리했고, εἰς τέλος κακῶν은 POB의 ‘uttermost evils’를 반영해 복수성과 강도를 살렸습니다.
theological_decisions:
- issue: 평강의 천사의 정체를 어떻게 표현할지
  chosen_reading: 본문의 수사적/천상적 표현을 그대로 살려 ‘평강의 천사’로 번역했습니다.
  alternative_readings:
  - ‘평화의 천사’로 완화해 번역
  - 해설적으로 다른 존재를 암시하는 번역
  rationale: 원문은 천사적 인격을 직접 말하며, 이를 일반적 추상어로 풀면 본문이 가진 종말론적 보호 이미지가 약해지므로 source-direct로 유지했습니다.
  doctrine_reference: 천사론; 본문 고유의 수호자 이미지
