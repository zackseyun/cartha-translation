  text: Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever. And bury me near my fathers.
translation:
  language: ko
  text: 그러므로 모든 불의에서 떠나 하나님의 의에 매달리십시오. 그러면 여러분의 후손은 영원히 구원을 받을 것입니다. 그리고 나를 내 조상들 곁에 장사하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστητε ... ἀπὸ πάσης ἀδικίας
  english_pob_choice: depart from all unrighteousness
  chosen_korean: 모든 불의에서 떠나
  alternatives_korean:
  - 모든 불의로부터 물러나
  - 온갖 불의에서 떠나
  lexicon: ἀδικία
  rationale: ἀδικία는 단순한 도덕적 잘못보다 ‘불의’라는 윤리·언약적 대립을 직접 드러내므로, POB의 ‘unrighteousness’에 맞춰 ‘불의’로 옮겼습니다.
- source_word: κολλήθητε τῇ δικαιοσύνῃ τοῦ Θεοῦ
  english_pob_choice: cling to the righteousness of God
  chosen_korean: 하나님의 의에 매달리십시오
  alternatives_korean:
  - 하나님의 의에 붙으십시오
  - 하나님의 의와 결합하십시오
  lexicon: κολλάω / δικαιοσύνη
  rationale: κολλήθητε는 강한 결속·부착을 뜻하므로 단순한 ‘따르다’보다 ‘매달리다’가 원문의 긴박한 결속 이미지를 살립니다. δικαιοσύνη는 관습적으로 ‘의’로 두었습니다.
- source_word: εἰς σωτηρίαν *ἕως τοῦ αἰῶνος
  english_pob_choice: will be for salvation forever
  chosen_korean: 영원히 구원을 받을 것입니다
  alternatives_korean:
  - 구원을 위한 존재가 될 것입니다 영원히
  - 영원한 구원을 얻게 될 것입니다
  lexicon: σωτηρία / εἰς ... ἕως τοῦ αἰῶνος
  rationale: 구문상 ‘~을 위하여’의 목적성도 있으나, 영어 POB의 해석을 따라 결과를 분명히 드러내되 ‘영원히’로 지속성을 보존했습니다.
- source_word: θάψατέ με ἐγγὺς τῶν πατέρων μου
  english_pob_choice: bury me near my fathers
  chosen_korean: 나를 내 조상들 곁에 장사하십시오
  alternatives_korean:
  - 나를 내 조상들 가까이에 묻으십시오
  - 나를 내 아버지들 곁에 장사하십시오
  lexicon: θάπτω / πατέρες
  rationale: θάψατέ는 장례 행위를 뜻하므로 ‘장사하다’로 옮겼고, πατέρες는 문맥상 혈통적 선조를 가리키므로 ‘조상들’이 자연스럽습니다.
theological_decisions:
- issue: ‘δικαιοσύνη τοῦ Θεοῦ’의 소유격 이해
  chosen_reading: 하나님에게 속한 의, 곧 하나님이 기준이 되시는 의를 지칭하는 표현으로 보아 ‘하나님의 의’로 옮겼습니다.
  alternative_readings:
  - 하나님이 베푸시는 의
  - 하나님께서 의롭게 하시는 의
  rationale: 본문의 대비가 ‘모든 불의’와 ‘의’ 사이의 윤리적 충돌을 이루므로, 문맥상 소유·원천·기준의 뉘앙스를 유지하는 직역적 표현이 적절합니다.
  doctrine_reference: 로마서 1:17; 3:21-22와의 어휘적 연관
