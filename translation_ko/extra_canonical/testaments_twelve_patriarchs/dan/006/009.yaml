translation:
  language: ko
  text: 그리고 여러분이 아버지에게서 들은 것을 자녀들에게도 전하십시오. 그렇게 하시면 민족들의 구원자께서 여러분을 받아 주실 것입니다. 그는 참되고 오래 참으며, 온유하고 겸손하며, 자신의 행위로 주님의 율법을 가르치십니다[a].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταδοτε / μεταδίδωμι
  english_pob_choice: pass on
  chosen_korean: 전하십시오
  alternatives_korean:
  - 나누십시오
  - 전해 주십시오
  - 물려주십시오
  lexicon: 없음
  rationale: 들은 내용을 다음 세대에 이어 주라는 뜻을 살려, 단순 전달보다 계승의 뉘앙스가 있는 ‘전하다’를 선택했습니다.
- source_word: ὁ Σωτὴρ τῶν ἐθνῶν
  english_pob_choice: the Savior of the nations
  chosen_korean: 민족들의 구원자
  alternatives_korean:
  - 열방의 구원자
  - 이방들의 구원자
  - 나라들의 구원자
  lexicon: 없음
  rationale: ἐθνῶν의 범위를 너무 좁히지 않으면서도 한국어에서 자연스러운 복수 표현으로 ‘민족들’을 택했습니다.
- source_word: μακρόθυμος, πρᾷος καὶ ταπεινός
  english_pob_choice: patient, gentle and humble
  chosen_korean: 오래 참으며, 온유하고 겸손하며
  alternatives_korean:
  - 인내하며, 온화하고 겸손하며
  - 참고 또 참으며, 부드럽고 낮추며
  lexicon: 없음
  rationale: 세 덕목의 병렬을 유지하되, μακρόθυμος의 지속적 인내를 ‘오래 참다’로, πρᾷος를 교회적 상투어보다 직접적인 ‘온유하다’로 옮겼습니다.
- source_word: τὸν νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 토라
  - 주님의 가르침
  lexicon: 없음
  rationale: νόμος의 기본 대응어인 ‘율법’을 유지하되, Κυρίου는 문맥상 주님으로 번역해 하나님/주님 지칭을 살렸습니다.
