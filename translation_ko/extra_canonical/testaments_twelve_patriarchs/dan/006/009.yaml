translation:
  language: ko
  text: 그리고 여러분이 아버지에게서 들은 것을 자녀들에게도 전하십시오, [그리하면 민족들의 구원자께서 여러분을 받아 주실 것입니다. 그분은 진실하시고 오래 참으시며, 온유하고 겸손하시며, 자신의 행위로 주님의 율법을 가르치십니다][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 문장은 흔히 후대의 확장 또는 삽입으로 여겨집니다. 그러나 여기서는 제공된 그리스어 증언에 들어 있으므로 번역에 포함했습니다.
    reason: textual_variant
