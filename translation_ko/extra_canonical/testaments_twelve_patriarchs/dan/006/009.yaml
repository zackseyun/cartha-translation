review_pass:
  verdict: revise
  source_fidelity: 대괄호로 표시된 그리스어 구절 전체(ἵνα 이하)를 번역문에서도 대괄호로 분명히 표시해야 합니다. 또한 ἵνα 절은 앞선 명령의 목적/귀결 관계를 나타내는데, 초안처럼 독립된 ‘그렇게 하시면 … 것입니다’ 문장으로 처리하면 그 연결과 본문비평적 범위가 흐려집니다.
