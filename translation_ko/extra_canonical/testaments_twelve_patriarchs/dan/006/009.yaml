  terminology: ‘민족들의 구원자’, ‘오래 참으시며’, ‘온유하고 겸손하시며’, ‘주님의 율법’은 그리스어 및 영문 POB의 의미 범위를 무리 없이 보존합니다. ‘자신의 행위로’는 διὰ τῶν ἔργων의 수단 표현을 유지합니다.
