  verdict: revise
  source_fidelity: 그리스어의 미래형 ἐπιστρέψει는 ‘돌아오는/돌이키는’으로 옮기는 편이 초안의 현재 관형형 ‘돌아서는’보다 정확합니다. 또한 συντελεσθήσεται는 수동 미래형이므로 ‘끝나게 되리라’가 ‘끝나리라’보다 원문의 피동·종결 뉘앙스를 더 잘 반영합니다.
  naturalness: ‘이스라엘이 돌아오는 날에’와 ‘끝나게 되리라는 것을’은 현대 표준 한국어 합쇼체 문맥에서 자연스럽습니다. 문장 끝의 설명형 종결도 앞 문맥에 자연스럽게 이어집니다.
  terminology: ἐπιστρέφω는 여기서 회개라는 교리적 의미로 한정하지 않고 ‘돌아오다’로 번역해 귀환·돌이킴의 폭을 보존했습니다. βασιλεία τοῦ ἐχθροῦ는 ‘원수의 나라’로 유지했습니다.
  issues:
