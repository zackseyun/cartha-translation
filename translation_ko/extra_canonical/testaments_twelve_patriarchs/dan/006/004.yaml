  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Οἶδε γὰρ ὅτι *ἐν ᾗ ἡμέρᾳ¹³ ἐπιστρέψει¹⁴ Ἰσραήλ, συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/004.yaml
  text: For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end.
translation:
  language: ko
  text: 그가 이스라엘이 돌아서는 그 날에 원수의 나라가 끝나리라는 것을 알기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψει
  english_pob_choice: turns back
  chosen_korean: 돌아서는
  alternatives_korean:
  - 돌아오면
  - 회개하면
  - 돌이키면
  lexicon: ἐπιστρέφω
  rationale: 영어 POB의 ‘turns back’를 따라 기본적 회귀 의미를 살리되, 종교적 뉘앙스를 과도하게 좁히지 않도록 ‘돌아서는’으로 옮겼습니다.
- source_word: συντελεσθήσεται
  english_pob_choice: will be brought to an end
  chosen_korean: 끝나리라는
  alternatives_korean:
  - 종결되리라는
  - 완결되리라는
  - 마무리되리라는
  lexicon: συντελέω
  rationale: 동사의 완료·종결 의미를 자연스러운 한국어 미래 표현으로 풀어, 외부에서 끝나게 된다는 뉘앙스를 유지했습니다.
- source_word: ἡ βασιλεία τοῦ ἐχθροῦ
  english_pob_choice: the kingdom of the enemy
  chosen_korean: 원수의 나라
  alternatives_korean:
  - 적의 나라
  - 원수의 왕국
  - 적의 왕국
  lexicon: βασιλεία / ἐχθρός
  rationale: βασιλεία는 이 문맥에서 ‘나라’가 가장 자연스럽고, ἐχθρός는 단순한 적보다 신학적 대립을 담아 ‘원수’로 옮겼습니다.
theological_decisions:
- issue: 이스라엘의 ‘turns back’ 표현의 범위
  chosen_reading: 회개만으로 좁히지 않고, 언약적 귀환/돌이킴을 포함하는 ‘돌아서는’으로 번역했습니다.
  alternative_readings:
  - 회개하면
  - 돌이키면
  rationale: 본문은 회개라는 신학적 해석을 가능하게 하지만, 어휘 자체는 더 넓은 귀환 의미도 허용하므로 과도한 해석을 피했습니다.
  doctrine_reference: 언약 회복과 회개의 관계에 대한 해석 가능성
