id: T12P.DAN.6.8
reference: Testament of Dan 6:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Διατηρήσατε οὖν³³ ἑαυτούς³⁵, τέκνα μου, ἀπὸ παντὸς *ἔργου πονηροῦ³⁶, καὶ ἀπορρίψατε *ἀφ᾽ ὑμῶν τὸν θυμὸν καὶ τὸ ψεῦδος³⁷, ⌜καὶ ἀγαπήσατε τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/008.yaml
  text: Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 모든 악한 일에서 너희 자신을 지키고, 분노와 거짓을 떨쳐 버리며, 진리와 오래 참음을 사랑하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατηρήσατε ἑαυτούς
  english_pob_choice: Keep yourselves
  chosen_korean: 너희 자신을 지키고
  alternatives_korean:
  - 너희 자신을 보존하고
  - 스스로를 지키고
  lexicon: διατηρέω
  rationale: 상태를 단순히 유지한다기보다 악에서 자신을 지켜 보전하라는 권면이므로, POB의 ‘Keep yourselves’에 맞춰 ‘너희 자신을 지키고’로 옮겼습니다.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  english_pob_choice: from every evil work
  chosen_korean: 모든 악한 일을 멀리하여
  alternatives_korean:
  - 모든 악한 일에서
  - 모든 악한 행위에서
  lexicon: ἔργον πονηρόν
  rationale: ‘from’의 분리 의미를 한국어에서 자연스럽게 드러내기 위해 ‘멀리하여’를 사용했고, ‘일’은 단순 행위 이상의 삶의 실천을 넓게 담습니다.
- source_word: ἀπορρίψατε ἀφ᾽ ὑμῶν τὸν θυμὸν καὶ τὸ ψεῦδος
  english_pob_choice: cast away from yourselves anger and falsehood
  chosen_korean: 너희에게서 분노와 거짓을 버리며
  alternatives_korean:
  - 너희에게서 분노와 거짓을 내던지며
  - 분노와 거짓을 너희에게서 떨쳐 버리며
  lexicon: ἀπορρίπτω; θυμός; ψεῦδος
  rationale: ‘cast away from yourselves’의 자기-분리성을 살리되 한국어 어순상 ‘너희에게서 … 버리며’가 가장 자연스럽습니다. ‘분노’와 ‘거짓’은 직역보다 문맥상 덜 완곡한 대응입니다.
- source_word: ἀγαπήσατε τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν
  english_pob_choice: love truth and patience
  chosen_korean: 진리와 오래 참음을 사랑하십시오
  alternatives_korean:
  - 진리와 인내를 사랑하십시오
  - 진리와 너그러움을 사랑하십시오
  lexicon: ἀλήθεια; μακροθυμία
  rationale: ἀλήθεια는 단순한 ‘참됨’보다 규범적·계시적 ‘진리’가 적절하고, μακροθυμία는 정서적 ‘참음’보다 지속적 인내를 뜻하므로 POB의 ‘patience’를 ‘오래 참음’으로 구체화했습니다.
theological_decisions:
- issue: 권면문의 명령형 어조
  chosen_reading: 현대 합쇼체 권면으로 통일하되, 원문의 연속 명령을 살려 ‘지키고… 버리며… 사랑하십시오’로 연결했습니다.
  alternative_readings:
  - 더 단정한 명령형 종결
  - 문장별로 완전 종결
  rationale: 원문은 공동체 자녀들에게 주는 직접 권면이므로, 한국어에서도 단호하지만 공손한 합쇼체가 가장 적절합니다.
  doctrine_reference: 문체/화용상 결정을 위한 번역 원칙
- issue: ‘악한 일’과 ‘분노와 거짓’의 윤리적 병렬
  chosen_reading: 세 항목을 분리해 병렬로 살리되, 의미 과장을 피하고 원문 순서를 유지했습니다.
  alternative_readings:
  - 두 번째 절을 첫 절에 흡수
  - 윤리 항목을 더 설명적으로 확장
  rationale: 원문은 세 층위의 권면을 병렬로 제시하므로, 한국어에서도 각 항목의 독립성을 유지하는 편이 출처 충실성이 높습니다.
  doctrine_reference: 본문 구조 보존
