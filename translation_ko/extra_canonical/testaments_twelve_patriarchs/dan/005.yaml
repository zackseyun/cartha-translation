source_grounding:
  english_pob_role: consult_only
status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 원문의 권면·예언 구조와 주요 명칭을 잘 보존했지만, 5절의 악의 영들에 관한 수식 관계가 한국어에서 문법적으로 무너져 원문의 의미를 제대로 전달하지 못합니다. 11절의 ‘포로 상태를 거두어 가실 것’도 벨리아르에게 사로잡힌 거룩한 이들의 영혼을 해방한다는 문맥을 흐립니다. 대괄호 처리된 본문 변이(8절, 10–11절, 13절)는 번역 선택을 밝히는 주석으로 표시해야 합니다.
  naturalness: 합쇼체의 기본 register는 적절합니다. 다만 ‘승리의 복수’, ‘그녀의 한가운데’, 5절의 ‘악의 영들도 있을 것입니다’는 현대 표준 한국어로 부자연스럽거나 의미가 불명확합니다. ‘그 도성 한가운데’ 및 ‘승리의 응징’처럼 자연스러운 표현으로 고쳤습니다.
  terminology: ‘주님’, ‘율법’, ‘벨리아르’, ‘사탄’, ‘평강’, ‘성소’는 일관되고 적절합니다. ἐκπορνεύοντες는 원문의 성적·종교적 타락의 강도를 보존하도록 ‘음행하고’로 옮겼습니다. τὸ σωτήριον Κυρίου는 인물로 한정하지 않고 ‘주님의 구원’으로 유지했습니다.
  issues:
  - severity: high
    issue: 5절의 악의 영들 구문이 의미와 문법 모두 불명확합니다.
    rationale: ‘악의 영들도 있을 것입니다’는 ἐνεργούντων(활동하는)의 수식 관계를 소실하고, 원문이 말하는 악의 영들의 활동과 그들이 행하는 악을 예언하는 구조를 단순 존재 진술로 바꿉니다.
  - severity: medium
    issue: 11절의 ‘포로 상태를 거두어 가실 것’이 해방의 대상을 흐립니다.
    rationale: αἰχμαλωσίαν 및 대괄호의 ‘거룩한 이들의 영혼’은 벨리아르의 사로잡힘에서 사람들을 빼앗아 오는 뜻으로 읽히며, 한국어는 이를 명시해야 자연스럽습니다.
  - severity: medium
    issue: 10절의 ‘승리의 복수’는 부자연스럽고 주석 앵커 [a]가 정의되지 않았습니다.
    rationale: ἐκδίκησιν τοῦ νίκους의 응보·승리 결합을 ‘승리의 응징’으로 자연스럽게 보존하고, 본문 변이와 불확실한 표현을 설명하는 주석을 제공합니다.
  - severity: low
