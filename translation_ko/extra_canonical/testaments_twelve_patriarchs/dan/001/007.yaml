id: T12P.DAN.1.7
reference: Testament of Dan 1:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἐκ τῶν πνευμάτων⁴³ τοῦ Βελίαρ †συνήργει⁴⁴ μοι, ὅτι⁴⁵· *Λαβὲ τὸ ξίφος καὶ ⌜ἐν τούτῳ⌝⁴⁶ ἄνελε τὸν Ἰωσήφ⁴⁷, καὶ ἀγαπήσει σε ὁ πατήρ⁴⁸, ἀποθανόντος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/007.yaml
  text: And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you after he dies.’
translation:
  language: ko
  text: 그리고 벨리알의 영들 중 하나가 나와 함께 작용하여 말하기를, 「이 칼을 집어 들고 이로 요셉을 죽여라. 그러면 그가 죽은 뒤에 아버지께서 너를 사랑하실 것이다」 하였습니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: ἐκ τῶν πνευμάτων τοῦ Βελίαρ
  english_pob_choice: one of the spirits of Beliar
  chosen_korean: 벨리알의 영들 중 하나
  alternatives_korean:
  - 벨리알에게 속한 영들 가운데 하나
  - 벨리알의 영들 중 한 영
  lexicon: πνεῦμα → 영; Βελίαρ → 벨리알
  rationale: 복수 표현을 살려 ‘영들 중 하나’로 옮기고, 소유/출처 관계를 자연스럽게 드러내기 위해 ‘벨리알의’로 처리했습니다.
- source_word: συνήργει μοι
  english_pob_choice: was working with me
  chosen_korean: 나와 함께 작용하여
  alternatives_korean:
  - 나와 함께 일하여
  - 나를 도와
  lexicon: συνεργέω → 함께 작용하다/협력하다
  rationale: 문맥상 선한 도움보다 악한 충동의 ‘공모적 작용’을 드러내기 위해 직역에 가까운 ‘함께 작용하여’를 택했습니다.
- source_word: ἄνελε τὸν Ἰωσήφ
  english_pob_choice: kill Joseph
  chosen_korean: 요셉을 죽여라
  alternatives_korean:
  - 요셉을 죽여라
  - 요셉을 없애라
  lexicon: ἀναιρέω → 죽이다
  rationale: 명령형의 직접성을 살리면서, 과도한 완곡화를 피해 ‘죽여라’로 옮겼습니다.
- source_word: ἀγαπήσει σε ὁ πατήρ
  english_pob_choice: your father will love you
  chosen_korean: 아버지께서 너를 사랑하실 것이다
  alternatives_korean:
  - 아버지가 너를 사랑할 것이다
  - 아버지께서 너를 좋아하실 것이다
  lexicon: ἀγαπάω → 사랑하다
  rationale: 동사의 강도를 유지하되, 예언적·유혹적 발화의 미래형을 한국어 미래 존대에 맞게 표현했습니다.
theological_decisions:
- issue: 악한 영의 작용을 어떻게 표현할 것인가
  chosen_reading: ‘벨리알의 영들 중 하나가 나와 함께 작용하여’로 옮겨, 단순한 내적 생각이 아니라 외부적 악령의 공모를 드러냈습니다.
  alternative_readings:
  - ‘벨리알의 영들 중 하나가 나를 부추겨’
  - ‘벨리알의 영들 중 하나가 나와 협력하여’
  rationale: 원문 συμμετοχή/협력의 뉘앙스를 유지하면서, 이야기 맥락상 유혹의 주체가 악령임을 분명히 했습니다.
  doctrine_reference: 악령/영적 유혹에 대한 문맥적 서술
- issue: 직접화법의 인용부호와 한국어 존대
  chosen_reading: 인용문 안에서는 명령형을 반말 체계로 유지하고, 바깥 서술은 합쇼체로 처리했습니다.
  alternative_readings:
  - 전체를 전부 합쇼체로 평준화
  - 인용문도 간접화법으로 완화
  rationale: 원문의 직접 명령과 유혹의 거칠음을 보존하기 위해 인용 내부는 직접 명령형을 살렸습니다.
  doctrine_reference: 서사 직접화법 보존
