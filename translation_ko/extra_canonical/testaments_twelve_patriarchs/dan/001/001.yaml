source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Διαθήκη Δὰν τοῦ ἑβδόμου υἱοῦ Ἰακὼβ καὶ Βάλλας¹. I. Ἀντίγραφον λόγων Δάν², *ὧν εἶπεν³ τοῖς υἱοῖς αὐτοῦ⁴ ἐπʼ ἐσχάτων⁵ τῶν⁶ ἡμερῶν αὐτοῦ⁷ *ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ⁸ ἔτει⁹ τῆς¹⁰ ζωῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/001.yaml
  text: Testament of Dan, the seventh son of Jacob and Bilhah. A copy of the words of Dan, which he spoke to his sons in the last days of his life, in the 125th year of his life.
translation:
  language: ko
  text: 단, 야곱의 일곱째 아들과 빌하의 유언입니다. 단이 자기 아들들에게 마지막 날들에 한 말의 사본이며, 자기 생애의 백이십오 년째에 한 말입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: Testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 유언서
  lexicon: διαθήκη
  rationale: 이 문맥은 족장들의 최종 연설문 제목이므로, POB의 'Testament'를 한국어로는 현대 독자가 이해하기 쉬운 '유언'으로 옮겼습니다.
- source_word: ἀντίγραφον λόγων
  english_pob_choice: A copy of the words
  chosen_korean: 말의 사본
  alternatives_korean:
  - 말씀의 사본
  - 기록
  lexicon: ἀντίγραφον
  rationale: ἀντίγραφον은 ‘사본’의 뜻을 살려 제목적 성격을 보존했고, λόγων은 단순히 ‘말씀’보다 중립적인 ‘말’로 옮겨 원문의 일반적 발화를 드러냈습니다.
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν
  english_pob_choice: in the last days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 말년의
  - 종말의
  lexicon: ἐσχάτων
  rationale: 여기서는 종말론적 전문용어보다 ‘생애의 마지막 시기’를 가리키는 문맥이므로, POB의 직역 취지를 유지해 자연스럽게 옮겼습니다.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the 125th year of his life
  chosen_korean: 자기 생애의 백이십오 년째
  alternatives_korean:
  - 그의 생애 125년째
  - 그가 산 지 백이십오 년째
  lexicon: ἔτει / ζωῆς
  rationale: 연령을 세는 헬라어 관용을 한국어의 ‘생애의 … 년째’로 자연스럽게 옮겨, 단순 생존 연수라는 점을 분명히 했습니다.
theological_decisions:
- issue: 족장 문헌 제목에서의 'Testament' 의미
  chosen_reading: 정식 성경 본문이 아니라 단행된 족장 유언문 제목으로 읽어, 서술을 과장하지 않고 문헌 성격을 드러냈습니다.
  alternative_readings:
  - 언약문으로 이해
  - 예언집 제목으로 이해
  rationale: 원문과 POB 모두 서두 제목형 진술이며, 본문 전체의 문학 장르를 고려하면 ‘유언’이 가장 정확합니다.
  doctrine_reference: 문헌 장르 표지
- issue: ‘마지막 날들’의 범위
  chosen_reading: 여기서는 종말의 날이라기보다 단의 생애 말미를 뜻하는 표현으로 처리했습니다.
  alternative_readings:
  - 종말론적 마지막 날
  - 미래의 마지막 시대
  rationale: 뒤이어 ‘자기 생애의 백이십오 년째’가 곧바로 설명되므로, 시간표현을 개인 생애의 말기로 읽는 것이 원문 문맥에 부합합니다.
  doctrine_reference: 문맥 우선 원칙
