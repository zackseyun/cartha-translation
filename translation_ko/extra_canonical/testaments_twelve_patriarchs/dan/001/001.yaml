- from: 단, 야곱의 일곱째 아들과 빌하의 유언입니다. 단이 자기 아들들에게 마지막 날들에 한 말의 사본이며, 자기 생애의 백이십오 년째에 한 말입니다.[a][b]
  to: 야곱과 빌하 사이에서 난 일곱째 아들 단의 유언입니다. 이것은 단이 생애의 마지막 날들에, 그의 생애 제125년에 자기 아들들에게 한 말의 사본입니다.
  rationale: 관계 표현과 시간 수식의 문장 구조를 바로잡아 원문의 제목형 문체, ‘사본’이라는 문헌 표지, 그리고 두 시간 표현을 모두 보존했습니다. 신학적·종말론적 의미를 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
