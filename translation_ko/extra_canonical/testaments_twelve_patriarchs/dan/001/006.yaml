  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/006.yaml
  text: For the spirit of jealousy and arrogance kept saying to me, ‘You yourself also are his son.’
translation:
  language: ko
  text: 그러므로 질투와 오만의 영이 내게 말하기를, ‘너 역시 그의 아들이다’ 하였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς ἀλαζονείας
  english_pob_choice: the spirit of jealousy and arrogance
  chosen_korean: 질투와 오만의 영
  alternatives_korean:
  - 질투와 거만의 영
  - 시기와 오만의 영
  lexicon: πνεῦμα; ζῆλος; ἀλαζονεία
  rationale: 영을 기본값으로 두고, ζῆλος는 문맥상 ‘질투’로, ἀλαζονεία는 자기과시적 태도를 가리키는 ‘오만’으로 옮겼습니다.
- source_word: ἔλεγέ μοι
  english_pob_choice: kept saying to me
  chosen_korean: 내게 말하기를
  alternatives_korean:
  - 내게 계속 말하기를
  - 내게 말하였습니다
  lexicon: λέγω
  rationale: 미완료 과거의 반복/지속 뉘앙스는 문맥상 한국어에서 자연스럽게 ‘말하기를’로 담되, 반복성을 과장하지 않았습니다.
- source_word: Καίγε σὺ αὐτὸς υἱὸς αὐτοῦ εἶ
  english_pob_choice: You yourself also are his son
  chosen_korean: 너 역시 그의 아들이다
  alternatives_korean:
  - 너 자신도 그의 아들이다
  - 너 또한 그의 아들이다
  lexicon: σύ; αὐτός; υἱός
  rationale: σὺ αὐτὸς의 강조는 ‘너 역시’로 살리고, υἱὸς는 혈연적 의미를 유지해 ‘아들’로 옮겼습니다.
theological_decisions:
- issue: ‘영’의 성격과 인격화된 발화
  chosen_reading: 이 구절의 πνεῦμα는 성령이 아니라 ‘질투와 오만의 영’이라는 부정적 충동/세력을 가리키므로, 인격화된 발화는 그대로 살리되 성령 용어로 오해되지 않게 했습니다.
  alternative_readings:
  - ‘질투와 오만의 기운’
  - ‘질투와 오만한 영’
  rationale: 본문 자체가 부정적 성향을 지닌 영적 힘을 말하므로, 교리적 중립성을 유지하면서도 원문의 표현력을 보존하는 번역이 필요합니다.
  doctrine_reference: 비정경 문헌의 심리-영적 인격화 표현
