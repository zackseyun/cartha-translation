id: T12P.DAN.1.3
reference: Testament of Dan 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ¹⁸ ἐπείρασα ἐν καρδίᾳ μου¹⁹ καὶ²⁰ ἐν πάσῃ²¹ ζωῇ μου²², ὅτι καλὸν²³ *καὶ θεῷ εὐάρεστον ἡ ἀλήθεια²⁴ μετὰ δικαιοπραγίας²⁵ *καὶ ⸀ὅτι⸁ πονηρὸν τὸ ψεῦδος²⁶ καὶ ὁ θυμὸς²⁷ πᾶσαν κακίαν *ἐκδιδάσκοντα τὸν ἄνθρωπον²⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/003.yaml
  text: I have tested in my heart and in all my life that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.
translation:
  language: ko
  text: 나는 내 마음과 내 모든 삶으로 시험해 보았습니다. 곧 진리와 의로운 행위는 선하고 하나님께 기쁘시며, 거짓과 분노는 악하여 사람에게 온갖 악을 가르칩니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείρασα ἐν καρδίᾳ μου καὶ ἐν πάσῃ ζωῇ μου
  english_pob_choice: I have tested in my heart and in all my life
  chosen_korean: 나는 내 마음과 내 모든 삶으로 시험해 보았습니다
  alternatives_korean:
  - 나는 내 마음과 내 온 삶으로 시험했습니다
  - 나는 내 마음으로 그리고 내 모든 삶으로 시험해 보았습니다
  lexicon: πειράζω / καρδία / ζωή
  rationale: 시험의 주체적 내적 검증을 살리기 위해 ‘시험해 보았습니다’를 택하고, ‘in my heart and in all my life’를 자연스러운 합쇼체로 옮겼습니다.
- source_word: καλὸν καὶ θεῷ εὐάρεστον ἡ ἀλήθεια μετὰ δικαιοπραγίας
  english_pob_choice: truth with righteous conduct is good and pleasing to God
  chosen_korean: 진리와 의로운 행위는 선하고 하나님께 기쁘시며
  alternatives_korean:
  - 진리가 의로운 행위와 함께할 때 선하고 하나님께 기쁘시며
  - 의와 함께한 진리는 선하고 하나님께 기쁘시며
  lexicon: ἀλήθεια / δικαιοπραγία / εὐάρεστος
  rationale: 직역 구조를 유지하되 한국어에서 더 자연스럽게 읽히도록 ‘진리와 의로운 행위는…’로 정리했고, ‘θεῷ εὐάρεστον’은 관용적으로 ‘하나님께 기쁘시며’로 옮겼습니다.
- source_word: πονηρὸν τὸ ψεῦδος καὶ ὁ θυμὸς πᾶσαν κακίαν ἐκδιδάσκοντα τὸν ἄνθρωπον
  english_pob_choice: falsehood and anger are evil, teaching a person every wickedness
  chosen_korean: 거짓과 분노는 악하여 사람에게 온갖 악을 가르칩니다
  alternatives_korean:
  - 거짓말과 분노는 악하여 사람에게 모든 악을 가르칩니다
  - 거짓과 노여움은 악하여 사람에게 온갖 악을 가르칩니다
  lexicon: ψεῦδος / θυμός / κακία
  rationale: ψεῦδος는 ‘거짓’, θυμός는 감정적 분노를 드러내는 ‘분노’, κακία는 ‘악’으로 옮겨 도덕적 평가를 분명히 했습니다.
theological_decisions:
- issue: ‘진리와 의로운 행위’의 관계 표현
  chosen_reading: 본문의 병렬적 도덕 진술로 이해하여, 진리와 의로운 행위를 함께 긍정하는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘진리가 의로운 행위와 함께할 때’라는 조건적 읽기
  - ‘진리와 함께하는 의로운 행위’라는 합성 읽기
  rationale: 그리스어는 ἀλήθεια와 μετὰ δικαιοπραγίας를 결합해 선함을 진술하므로, 조건문보다 병렬적 진술이 문맥에 더 가깝습니다.
  doctrine_reference: 지혜/윤리 문학의 도덕적 권면
- issue: ‘사람에게 온갖 악을 가르칩니다’의 인격화
  chosen_reading: 거짓과 분노가 사람을 악으로 이끄는 교육적·형성적 힘을 가진다는 뜻을 유지했습니다.
  alternative_readings:
  - ‘사람에게 모든 악을 가르친다’의 직설적 형식
  - ‘사람을 온갖 악으로 훈련한다’의 강화된 표현
  rationale: ἐκδιδάσκοντα는 단순 정보 전달이 아니라 잘못된 형성/훈련의 의미를 띠므로, ‘가르칩니다’로 소박하게 살리되 악한 형성의 힘을 드러냈습니다.
  doctrine_reference: 인간의 도덕적 형성에 대한 교훈적 진술
