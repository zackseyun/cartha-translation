id: T12P.DAN.1.8
reference: Testament of Dan 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Τοῦτο δὲ ἦν τὸ πνεῦμα τοῦ θυμοῦ τὸ πεῖθόν με⁴⁹· ὥσπερ⁵⁰ πάρδαλις †ἐκμύζουσα⁵¹ ἔριφον, ἵνα οὕτως *⌜ἐμοὶ ἐνέβαλεν⌝ †ἐκμυζῆσαι⁵² τὸν Ἰωσήφ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/008.yaml
  text: Now this was the spirit of anger persuading me, that just as a leopard sucks out a young goat, so it put into me to suck out Joseph.
translation:
  language: ko
  text: 이것은 곧 나를 설득하던 분노의 영이었습니다. 표범이 새끼 염소의 피를 빨아먹듯이, 그렇게 그것은 내게 요셉의 피를 빨아먹게 했습니다.[a][b]
  philosophy: formal
lexical_decisions:
- source_word: πνεῦμα τοῦ θυμοῦ
  english_pob_choice: the spirit of anger
  chosen_korean: 분노의 영
  alternatives_korean:
  - 노여움의 영
  - 화의 영
  lexicon: πνεῦμα / θυμός
  rationale: θυμοῦ를 단순한 감정이 아니라 인격적으로 작용하는 ‘영’으로 본 원문 구조를 살려, 영어 POB의 ‘spirit of anger’에 맞춰 ‘분노의 영’으로 옮겼습니다.
- source_word: τὸ πεῖθόν με
  english_pob_choice: persuading me
  chosen_korean: 나를 설득하던
  alternatives_korean:
  - 나를 꾀하던
  - 나를 유혹하던
  lexicon: πείθω
  rationale: πείθω의 기본 의미인 ‘설득하다’를 유지하되, 진행형 뉘앙스를 살려 ‘-하던’으로 처리했습니다.
- source_word: πάρδαλις ἐκμύζουσα ἔριφον
  english_pob_choice: a leopard sucks out a young goat
  chosen_korean: 표범이 새끼 염소의 피를 빨아먹듯이
  alternatives_korean:
  - 표범이 새끼 염소를 빨아먹듯이
  - 표범이 염소 새끼의 피를 빨아먹듯이
  lexicon: πάρδαλις / ἐκμυζάω / ἔριφος
  rationale: 비유의 잔혹성을 한국어에서도 분명히 드러내기 위해 ‘빨아먹다’를 살렸고, 대상의 생명력 소진을 자연스럽게 드러내기 위해 ‘피를’로 보완했습니다.
- source_word: ἐκμυζῆσαι τὸν Ἰωσήφ
  english_pob_choice: to suck out Joseph
  chosen_korean: 요셉의 피를 빨아먹게 했습니다
  alternatives_korean:
  - 요셉을 빨아먹게 했습니다
  - 요셉의 생명을 빨아먹게 했습니다
  lexicon: ἐκμυζάω
  rationale: 원문의 동사는 문자적으로 ‘빨아내다/빨아먹다’이므로, 한국어에서 의미를 분명히 하기 위해 생명 파괴의 함의를 살린 표현을 택했습니다.
theological_decisions:
- issue: 분노의 영의 인격적 작용을 어떻게 표현할 것인가
  chosen_reading: 단순한 감정 묘사가 아니라 외부에서 나를 설득하는 힘으로 표현했습니다.
  alternative_readings:
  - 분노라는 감정이 나를 휩쓸었다
  - 내가 분노를 느꼈다
  rationale: 원문은 πνεῦμα τοῦ θυμοῦ가 주체처럼 작용하며 ‘나를 설득’한다고 말하므로, 이를 약화하지 않고 유지했습니다.
  doctrine_reference: 인간 내면의 악한 충동을 외적·영적 작용으로도 서술하는 고대 유대 문학의 표현 방식
