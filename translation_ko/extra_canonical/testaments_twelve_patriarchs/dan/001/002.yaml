    rationale: Καλέσας γὰρ τὴν πατρίαν αὐτοῦ εἶπεν(‘그가 자기 집안/가족을 불러 말하였다’)이 번역에서 전부 빠져 있습니다. 영어 POB의 축약 여부와 별개로 원어 본문을 우선하여 반영해야 합니다.
  - severity: medium
    issue: 고유명사 영문 표기
    rationale: Δὰν은 표준 한국어 성서 문맥에서 ‘단’으로 표기하는 것이 적절합니다.
  - severity: low
