  source_fidelity: 초안은 직접 발화 부분의 두 명령을 대체로 옮겼지만, 원문의 도입절(“그가 자기 가족/집안을 불러 … 말하였다”) 전체가 빠져 있어 본문 충실성에 중대한 결함이 있습니다. 또한 τῆς πατρίας는 여기서 화자의 ‘아버지’가 아니라 그가 부른 자기 집안 또는 가족을 뜻합니다.
  naturalness: ‘Dan의 아들들이여’는 표준 한국어 성서 문체에 맞지 않는 영문 혼용이며, ‘아버지의 말들에 주의를 기울이십시오’는 복수 표기와 결합이 다소 부자연스럽습니다. ‘단의 아들들아’, ‘너희 아버지의 말에 귀를 기울이십시오’가 자연스럽고 현대적인 공식체입니다.
  terminology: Δάν은 통상적인 한국어 성서식 표기인 ‘단’으로 옮겼습니다. λόγοι와 ῥήματα의 어휘적 차이는 본문에서 억지로 구별하지 않고 모두 ‘말’로 처리하되, 한국어에서 자연스러운 단수 집합 표현을 사용했습니다.
