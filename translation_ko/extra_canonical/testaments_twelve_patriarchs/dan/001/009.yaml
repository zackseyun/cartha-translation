id: T12P.DAN.1.9
reference: Testament of Dan 1:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ᾿Αλλ᾿ ὁ Θεὸς *τῶν πατέρων⁵³ μου οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου, ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ, καὶ ποιήσω⁶¹ λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/009.yaml
  text: But the God of my fathers did not allow him to fall into my hands, so that I might find him alone and kill him, and bring about the loosing of a second tribe from Israel.”
translation:
  language: ko
  text: 그러나 내 조상의 하나님께서는 그를 내 손에 넘기지 않으셨습니다. 그래서 내가 그를 홀로 찾아내어 죽이고, 이스라엘에서 둘째 지파가 떨어져 나가게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  english_pob_choice: the God of my fathers
  chosen_korean: 내 조상의 하나님
  alternatives_korean:
  - 우리 조상의 하나님
  - 내 아버지들의 하나님
  lexicon: Θεός
  rationale: 직역보다 한국어에서 자연스럽고, 조상-언약적 배경을 살리면서도 소유격의 인칭을 유지했습니다.
- source_word: οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου
  english_pob_choice: did not allow him to fall into my hands
  chosen_korean: 그를 내 손에 넘기지 않으셨습니다
  alternatives_korean:
  - 그가 내 손에 떨어지지 못하게 하셨습니다
  - 그를 내 손아귀에 넣지 않으셨습니다
  lexicon: ἐμπεσεῖν εἰς τὰς χεῖράς μου
  rationale: ‘fall into my hands’의 결과적 함의를 한국어로 자연스럽게 옮기되, 하나님이 주권적으로 막으셨다는 점을 분명히 했습니다.
- source_word: ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ
  english_pob_choice: so that I might find him alone and kill him
  chosen_korean: 그래서 내가 그를 홀로 찾아내어 죽이고
  alternatives_korean:
  - 그를 혼자 발견하여 죽이려 했고
  - 홀로 있을 때 그를 찾아 죽이려 했고
  lexicon: κατὰ μόνας / εὑρὼν / ἀνελῶ
  rationale: 원문의 목적절과 행위의 연속을 살리면서, ‘홀로’와 ‘찾아내어’로 장면의 은밀성을 유지했습니다.
- source_word: ποιήσω λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ
  english_pob_choice: bring about the loosing of a second tribe from Israel
  chosen_korean: 이스라엘에서 둘째 지파가 떨어져 나가게 하려는 것이었습니다
  alternatives_korean:
  - 이스라엘에서 둘째 지파가 끊어지게 하려는 것이었습니다
  - 이스라엘에서 두 번째 지파가 풀려나게 하려는 것이었습니다
  lexicon: σκῆπτρον δεύτερον
  rationale: POB의 해석을 따라 ‘second tribe’의 분리·이탈 의미를 살렸고, ‘지파’는 이 문맥에서 부족/tribal line을 나타내는 자연스러운 대응입니다.
theological_decisions:
- issue: 하나님의 주권과 인간의 살의가 한 문장 안에 병치됨
  chosen_reading: 하나님이 허락하지 않으셔서 살인의 계획이 좌절되었음을 분명히 유지했습니다.
  alternative_readings:
  - 사건을 중립적으로 완화하여 표현함
  - 인간의 책임을 흐리게 하는 표현
  rationale: 본문은 하나님의 रोक음과 화자의 의도를 함께 드러내므로, 어느 한쪽을 약화하지 않고 병치 구조를 보존해야 합니다.
  doctrine_reference: 섭리와 인간 책임의 병행
- issue: ‘둘째 지파’의 파괴/분리 표현
  chosen_reading: ‘떨어져 나가게’로 옮겨 분리와 상실을 모두 드러냈습니다.
  alternative_readings:
  - ‘destroyed’에 맞춰 ‘멸망하게’
  - ‘loosing’에 맞춰 단순히 ‘풀리게’
  rationale: 영어 POB의 ‘loosing’은 단순 해방이 아니라 이스라엘로부터의 분리·이탈을 가리키므로, 한국어에서도 그 긴장을 유지했습니다.
  doctrine_reference: 이스라엘 지파 분열 전승
