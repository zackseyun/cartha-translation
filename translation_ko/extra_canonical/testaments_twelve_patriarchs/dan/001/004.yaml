id: T12P.DAN.1.4
reference: Testament of Dan 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ὁμολογῶ οὖν ὑμῖν σήμερον²⁹, τέκνα μου³⁰, ὅτι ἐν καρδίᾳ μου ἐθέμην³¹ περὶ τοῦ θανάτου³² Ἰωσήφ, ⸀τοῦ ἀδελφοῦ μου⸁³³, *τοῦ ἀγαθοῦ ἀνδρὸς καὶ ἀληθινοῦ³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/004.yaml
  text: So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.
translation:
  language: ko
  text: 그러므로 오늘 내가 너희에게 고백합니다, 내 자녀들아. 나는 마음속으로 내 형제요 선하고 참된 사람인 요셉의 죽음에 관하여 뜻을 정하였음을 고백합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ ... ὑμῖν σήμερον
  english_pob_choice: So I confess to you today
  chosen_korean: 그러므로 오늘 내가 너희에게 고백합니다
  alternatives_korean:
  - 그래서 오늘 내가 너희에게 고백합니다
  - 그러므로 나는 오늘 너희에게 고백합니다
  lexicon: ὁμολογέω
  rationale: 고백하다는 공개적 인정의 뉘앙스를 살리고, σήμερον은 위치상 ‘오늘’로 자연스럽게 살렸습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 나의 자녀들이여
  lexicon: τέκνα
  rationale: 직접 호칭이므로 한국어 호격을 살려 ‘자녀들아’로 옮기고, 친밀하지만 단호한 خطاب을 유지했습니다.
- source_word: ἐν καρδίᾳ μου ἐθέμην
  english_pob_choice: in my heart I resolved
  chosen_korean: 내 마음에 ... 결심하였다고
  alternatives_korean:
  - 내 마음속으로 ... 정하였다고
  - 내 속에 ... 작정하였다고
  lexicon: τίθημι + καρδία
  rationale: ‘마음에 두다/정하다’의 관용적 의미를 따라 내적 결심으로 옮겼고, ‘결심하다’가 한국어에서 가장 직접적인 대응입니다.
- source_word: περὶ τοῦ θανάτου Ἰωσήφ
  english_pob_choice: concerning the death of Joseph
  chosen_korean: 요셉 ... 죽게 하려고
  alternatives_korean:
  - 요셉의 죽음에 관하여
  - 요셉의 죽음을 두고
  lexicon: περί + θάνατος
  rationale: 최신 POB 수정처럼 ‘죽음에 관하여’만으로 끝내지 않고, 목적/귀결을 드러내는 한국어로 처리해 죽음이 결심의 내용임을 분명히 했습니다.
- source_word: τοῦ ἀδελφοῦ μου
  english_pob_choice: my brother
  chosen_korean: 내 형제인
  alternatives_korean:
  - 내 형제요
  - 내 형제요
  lexicon: ἀδελφός
  rationale: 요셉을 설명하는 동격 요소이므로 관계를 매끄럽게 살려 ‘내 형제인’으로 배치했습니다.
- source_word: τοῦ ἀγαθοῦ ἀνδρὸς καὶ ἀληθινοῦ
  english_pob_choice: that good and true man
  chosen_korean: 그 좋은 사람이
  alternatives_korean:
  - 그 선하고 참된 사람
  - 그 선하고 진실한 사람
  lexicon: ἀγαθός + ἀληθινός
  rationale: POB의 ‘good and true man’을 유지하되, ‘좋은’과 ‘참된/진실한’의 이중 평가를 한국어로 압축해 재현했습니다.
theological_decisions:
- issue: 죽음에 관한 표현을 단순한 주제 언급으로 줄일지, 결심의 목적/귀결을 드러낼지
  chosen_reading: 요셉의 죽음이 내적 결심의 대상으로 제시되도록 ‘요셉 ... 죽게 하려고 결심하였다고’로 옮겼습니다.
  alternative_readings:
  - 요셉의 죽음에 관하여 결심하였다고
  - 요셉을 죽이는 일에 대하여 결심하였다고
  rationale: 그리스어의 περί τοῦ θανάτου와 영어 POB 수정이 모두 죽음의 직접성을 유지하므로, 완곡하게 희석하지 않고 문맥상 가해 의도를 분명히 했습니다.
  doctrine_reference: 본문의 윤리적 고백을 약화시키지 않기 위한 서술 보존
- issue: 직접 호칭의 정서와 권위를 어떻게 재현할지
  chosen_reading: ‘내 자녀들아’로 호격을 살려, 회고적 고백이면서도 권면하는 어조를 유지했습니다.
  alternative_readings:
  - 내 자녀들이여
  - 내 자녀 여러분
  rationale: τέκνα μου는 단순 소유격이 아니라 친밀한 직접 부름이므로, 한국어 호격을 통해 청중에게 말하는 긴장을 보존했습니다.
  doctrine_reference: 담화 화용 보존
