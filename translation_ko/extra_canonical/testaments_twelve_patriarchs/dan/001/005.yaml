  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/005.yaml
  text: And I rejoiced over his being sold, because his father loved him more than us.
translation:
  language: ko
  text: 그리고 저는 그가 팔린 일을 기뻐했습니다. 이는 그의 아버지가 우리보다 그를 더 사랑했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἔχαιρον ἐπὶ τῇ πράσει αὐτοῦ
  english_pob_choice: And I rejoiced over his being sold
  chosen_korean: “그가 팔린 일을 기뻐했습니다”
  alternatives_korean:
  - “그의 매각을 기뻐했습니다”
  - “그가 팔려 간 일을 기뻐했습니다”
  lexicon: χαιρω; πρᾶσις
  rationale: ἔχαιρον은 지속적/반복적 기쁨을 나타내지만, 한국어에서는 자연스럽고 문맥에 맞게 과거 서술로 옮겼습니다. πρᾶσις는 ‘팔림/매각’의 뜻이므로, 문맥상 가족 관계가 드러나는 직설적 표현인 ‘팔린 일’을 택했습니다.
- source_word: ὅτι
  english_pob_choice: because
  chosen_korean: “이는 … 때문입니다”
  alternatives_korean:
  - “왜냐하면 …”
  - “그 이유는 …”
  lexicon: ὅτι
  rationale: 원인 절을 분명하게 드러내는 합쇼체 문장으로 자연스럽게 연결했습니다.
- source_word: ὑπὲρ ἡμᾶς
  english_pob_choice: more than us
  chosen_korean: “우리보다”
  alternatives_korean:
  - “우리보다 더”
  - “우리를 넘어서”
  lexicon: ὑπέρ
  rationale: 비교 대상이 ‘우리’임을 직접 반영하여, 영어 POB의 의미를 유지하면서도 한국어 비교 구문으로 자연스럽게 처리했습니다.
- source_word: ἠγάπα
  english_pob_choice: loved
  chosen_korean: “사랑했기”
  alternatives_korean:
  - “더 사랑했기”
  - “사랑하고 계셨기”
  lexicon: ἀγαπάω
  rationale: 아버지의 지속적인 애정을 나타내는 동사로, 문맥상 ‘더 사랑했기’가 비교 의미를 가장 분명하게 드러냅니다.
theological_decisions:
- issue: 형제들 사이의 질투와 아버지의 편애 진술을 어떻게 드러낼지
  chosen_reading: 화자가 ‘그가 팔린 일’을 기뻐한 이유를 아버지의 편애와 직접 연결해, 불편한 정서를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘그가 팔린 것을 보고 기뻐했습니다’
  - ‘그의 처지가 바뀐 것을 기뻐했습니다’
  rationale: 원문과 영어 POB가 모두 의도적으로 드러내는 도덕적 긴장과 냉혹한 질감을 보존하는 것이 중요합니다.
  doctrine_reference: 서사적 진술의 직설성 보존
