review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 대체로 그리스어의 권면과 신학적 긴장을 잘 보존하지만, 11절의 매장 명령이 완전히 누락되었습니다. 또한 2절에서 제시된 그리스어 본문은 († 표기와 함께) ‘하나님의 나라’를 읽는데, 초안은 영어 POB의 ‘원수의 나라’를 따라갔습니다. 원문 우선 원칙에 따라 본문은 ‘하나님의 나라’로 옮기고, 영어 감사본과의 차이는 각주로 밝혀야 합니다. 6절의 긴장 및 9절의 대괄호 문장은 유지했습니다.
  naturalness: 합쇼체와 전반적 문체는 적절합니다. 다만 ‘원수의 나라를 맞서 서게 될 것입니다’는 자연스럽지 않아 ‘…에 맞서 설 것입니다’로 다듬었습니다. ‘그가 끝내 극심한 악에 빠지지 않게’는 대명사의 선행사가 불분명하므로 ‘이스라엘이 … 빠지지 않도록’으로 명시했습니다.
  terminology: ‘주’, ‘하나님’, ‘사탄’, ‘천사’, ‘중재자’, ‘의’는 일관되고 현대적인 성서 문맥에 적절합니다. ‘중재자’는 천사와 관련된 본문의 진술을 후대 교리적 용어로 고정하지 않는 장점이 있습니다. ‘주의 율법’은 원문의 ‘율법 Κυρίου’를 보존합니다.
  issues:
  - severity: high
    issue: 11절(‘나를 내 조상들 가까이에 장사하여라’)이 누락되었습니다.
    rationale: 제시된 그리스어 본문에 독립된 종결 명령으로 포함되어 있으므로 번역문에도 반드시 포함되어야 합니다.
  - severity: high
    issue: 2절의 ‘하나님의 나라’가 ‘원수의 나라’로 변경되었습니다.
    rationale: 제시된 그리스어는 ‘τῆς βασιλείας τοῦ †θεοῦ’라고 읽습니다. † 표기가 난해하거나 손상된 전승을 시사할 수 있으나, 제공된 영어 POB의 ‘kingdom of the enemy’를 근거 없이 본문에 채택할 수는 없습니다. 원문 독법을 번역하고 그 차이를 각주로 밝혀야 합니다.
  - severity: high
    issue: 각주 표지 [a][b][c]가 모두 본문 맨 끝에 몰려 있어 앵커가 맞지 않습니다.
    rationale: a는 2절의 ‘중재자’, b는 6절의 난해한 진술, c는 9절의 대괄호 문장에 각각 직접 붙어야 합니다. 2절의 원문/영어 감사본 불일치를 설명하는 새 각주도 해당 구절에 배치합니다.
  - severity: medium
    issue: 2절의 ‘원수의 나라를 맞서 서게 될 것입니다’는 한국어 결합이 부자연스럽습니다.
    rationale: ‘…에 맞서 설 것입니다’가 원문의 적대적 대치 의미를 자연스럽게 전달합니다.
  - severity: medium
    issue: 5절의 ‘그가’는 이스라엘인지 천사인지 불분명합니다.
    rationale: 원문의 목적어는 이스라엘이므로 ‘이스라엘이’로 밝혀 번역상 혼동을 피하는 것이 안전합니다.
  revised_text: 이제 내 자녀들아, 주를 두려워하고 사탄과 그의 영들을 경계하여 너희 자신을 지키십시오. 하나님께 가까이 나아가고 너희를 위하여 중재하는 그 천사에게도 가까이 나아가십시오. 그는 하나님과 사람들 사이의 중재자이며[a], 이스라엘의 평화를 위하여 하나님의 나라에 맞서 설 것입니다.[d] 그러므로 원수는 주를 부르는 모든 사람을 넘어뜨리려고 애씁니다. 그는 이스라엘이 돌아서는 날에 원수의 나라가 끝나게 될 것을 알기 때문입니다. 바로 그 평화의 천사가 이스라엘을 강하게 하여, 이스라엘이 극심한 악에 빠지지 않도록 할 것입니다. 그러나 이스라엘의 불법의 때에 주께서는 그들에게서 떠나지 않으시고, 그의 뜻을 찾는 민족에게로 옮겨 가실 것입니다. 어떤 천사도 그와 동등하지 못하기 때문입니다.[b] 그의 이름은 이스라엘의 모든 곳과 민족들 가운데 있을 것입니다. 그러므로 내 자녀들아, 모든 악한 행위에서 너희 자신을 지키고, 너희에게서 분노와 거짓을 버리며, 진리와 오래 참음을 사랑하십시오. 또 너희가 아버지에게서 들은 것을 너희 자녀들에게도 전하십시오. [그리하여 민족들의 구원자가 너희를 받아 주실 것입니다. 그분은 참되고 오래 참으며, 온유하고 겸손하시고, 그의 행위들을 통하여 주의 율법을 가르치시는 분이기 때문입니다.][c] 그러므로 모든 불의에서 떠나 하나님의 의에 굳게 붙으십시오. 그러면 너희의 후손은 영원히 구원을 얻게 될 것입니다. 나를 내 조상들 가까이에 장사하십시오.
  revised_footnotes:
  - marker: a
    text: ‘하나님과 사람들 사이의 중재자’는 그리스어를 직접 옮긴 표현입니다. 이 구절은 여전히 그 존재를 ‘천사’라고 부르므로, 후대의 특정 교리적 인물과 동일시하지 않고 본문의 긴장을 그대로 두었습니다.
    reason: lexical_alternative; v2의 μεσίτης 및 천사 정체에 관한 해석상 긴장
  - marker: b
    text: 그리스어 본문은 주께서 ‘그들에게서 떠나지 않으실 것’이라고 하면서도 ‘그의 뜻을 찾는 민족에게로 옮겨 가실 것’이라고 말합니다. 번역은 이 긴장을 해소하지 않고 보존합니다.
    reason: alternative_reading; v6의 난해한 병렬 진술
  - marker: c
    text: 대괄호 안의 문장은 제공된 그리스어 증거에는 포함되어 있어 번역했으나, 흔히 후대의 확대 또는 삽입으로 여겨집니다.
