base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy. Because of this the enemy is eager to trip up all who call on the Lord. For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end. For the very angel of peace will strengthen Israel, so that he may not fall into the uttermost evil. But in the time of the lawlessness of Israel, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[b]. And his name will be in every place in Israel and among the nations. Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience. And what you have heard from your father, pass on also to your
    children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord.[c] Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever.
  footnotes:
  - marker: a
    text: '''Mediator between God and men'' is translated directly from the Greek. The passage still speaks of an ''angel,'' so the wording is left unresolved rather than identified with a later doctrinal figure.'
    reason: lexical_alternative
    anchor_ref: v2
  - marker: b
    text: 'The Greek line is difficult: the text as given says the Lord ''will not depart from them'' and yet ''will pass over to a nation seeking his will.'' The translation preserves this tension rather than smoothing it away.'
    reason: alternative_reading
    anchor_ref: v6
  - marker: c
    text: The bracketed sentence is often regarded as a later expansion or interpolation; it is translated here because it stands in the Greek witness provided.
    reason: textual_variant
    anchor_ref: v9
translation:
  language: ko
  text: 이제, 내 자녀들아, 주를 두려워하고 사탄과 그의 영들을 경계하여 너희 자신을 지키십시오. 하나님께 가까이 나아가고, 너희를 위하여 중재하는 그 천사에게도 가까이 나아가십시오. 그는 하나님과 사람들 사이의 중재자이며, 이스라엘의 평화를 위하여 원수의 나라를 맞서 서게 될 것입니다. 그러므로 원수는 주를 부르는 모든 사람을 넘어뜨리려 애씁니다. 그는 이스라엘이 돌아서는 날에 원수의 나라가 끝나게 될 것을 알기 때문입니다. 참으로 평화의 그 천사가 이스라엘을 강하게 하여, 그가 끝내 극심한 악에 빠지지 않게 할 것입니다. 그러나 이스라엘의 불법의 때에는 주께서 그들에게서 떠나지 않으시고, 그의 뜻을 찾는 민족에게로 옮겨 가실 것이니, 어떤 천사도 그와 같지 못하기 때문입니다. 그의 이름은 이스라엘의 모든 곳과 민족들 가운데 있을 것입니다. 그러므로 내 자녀들아, 모든 악한 행위에서 너희 자신을 지키고, 너희에게서 분노와 거짓을 버리며, 진리와 오래 참음을 사랑하십시오. 또 너희가 아버지에게서 들은 것을 너희 자녀들에게도 전하십시오. [그러면 민족들의 구원자가 너희를 받아 주실 것입니다. 그는 참되고 오래 참으며, 온유하고 겸손하고, 그의 행위로 주의 율법을 가르치기 때문입니다.] 그러므로 모든 불의를 버리고 하나님의 의에 붙어 있으십시오. 그러면 너희의 자손은 영원한 구원을 받을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  english_pob_choice: fear the Lord
  chosen_korean: 주를 두려워하십시오
  alternatives_korean:
  - 주를 경외하십시오
  - 주님을 두려워하십시오
  lexicon: BDAG
  rationale: 경고와 권면의 강한 뉘앙스를 살리기 위해 ‘두려워하다’를 유지했고, Κύριος는 본문 맥락에 따라 ‘주’로 옮겼습니다.
- source_word: πνευμάτων αὐτοῦ
  english_pob_choice: his spirits
  chosen_korean: 그의 영들
  alternatives_korean:
  - 그의 영적인 존재들
  - 그의 부리는 영들
  lexicon: BDAG
  rationale: POB가 해석을 덧붙이지 않고 관계를 열어 두었으므로, 한국어도 기능을 특정하지 않고 ‘영들’로 간단히 옮겼습니다.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  english_pob_choice: mediator between God and men
  chosen_korean: 하나님과 사람들 사이의 중재자
  alternatives_korean:
  - 하나님과 사람들 사이의 중보자
  - 하나님과 사람들 사이의 매개자
  lexicon: BDAG
  rationale: 현대 한국어에서 ‘중재자’가 관계를 조정하는 의미를 가장 자연스럽게 전달하며, 본문의 천사-중재 표현도 그대로 살립니다.
- source_word: Ἐγγίσατε τῷ θεῷ
  english_pob_choice: Draw near to God
  chosen_korean: 하나님께 가까이 나아가십시오
  alternatives_korean:
  - 하나님께 다가가십시오
  - 하나님께 가까이 오십시오
  lexicon: BDAG
  rationale: 예배적·권면적 문맥에서 쓰이는 성서적 관용구를 현대어로 자연스럽게 살렸습니다.
- source_word: τῇ δικαιοσύνῃ τοῦ Θεοῦ
  english_pob_choice: the righteousness of God
  chosen_korean: 하나님의 의
  alternatives_korean:
  - 하나님의 공의
  - 하나님의 정의
  lexicon: BDAG
  rationale: δικαιοσύνη의 표준적인 성서어법을 따라 ‘의’로 옮겨 본문 내부의 대조(ἀδικία/δικαιοσύνη)를 유지했습니다.
theological_decisions:
- issue: ‘그 천사’의 정체
  chosen_reading: 본문이 말하는 천사를 별도로 동일시하지 않고, ‘중재하는 천사’와 ‘하나님과 사람들 사이의 중재자’라는 이중 진술을 그대로 유지했습니다.
  alternative_readings:
  - 메시아적 인물로 식별
  - 후대 기독론적으로 동일시
  - 수호천사로 단순화
  rationale: Greek text and POB audit both preserve the tension; Korean rendering should not resolve it prematurely.
  doctrine_reference: 본문의 긴장을 보존하고 후대 교리 범주로 환원하지 않음
- issue: 브래킷으로 표시된 9절 후반부
  chosen_reading: 본문에 있는 대로 대괄호를 유지해 번역했습니다.
  alternative_readings:
  - 본문에서 삭제
  - 괄호 없이 본문으로 통합
  rationale: 제시된 그리스어 증거에 포함되어 있지만 후대 삽입 가능성이 있으므로, 공개 번역에서는 가시적으로 구분하는 것이 투명합니다.
  doctrine_reference: 본문비평적 투명성 유지
