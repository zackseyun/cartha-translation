  source_fidelity: 그리스어 본문은 이 절(II)의 첫 문장만 제시합니다. 초안은 전반적으로 이를 충실히 옮겼으나, τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ는 ‘거짓의 영과 분노의 영’이라는 둘의 영이라기보다 ‘거짓과 분노의 영’으로, 하나의 πνεῦμα를 두 속격이 수식하는 표현으로 보존하는 편이 정확합니다. 조건절의 두 동사(‘지키다’와 ‘사랑하다’)도 모두 부정 조건 아래에 있음을 한국어에서 분명히 했습니다.
  naturalness: ‘보라’는 현대 표준어 합쇼체 문맥에서는 다소 고어적이므로 ‘보십시오’로 조정했습니다. ἀποθνῄσκω의 현재적 진행감을 ‘죽어 가고 있습니다’로 자연스럽게 살렸습니다. ‘오래 참음’은 윤리적 명사로 자연스럽고 원문의 μακροθυμία를 잘 보존합니다.
  terminology: πνεῦμα은 ‘영’, ψεῦδος는 ‘거짓’, θυμός는 ‘분노’, ἀλήθεια는 ‘진리’, μακροθυμία는 ‘오래 참음’으로 유지합니다. ‘멸망할 것입니다’는 ἀπολεῖσθε의 엄중한 경고를 과도하게 해석하지 않고 전달합니다.
