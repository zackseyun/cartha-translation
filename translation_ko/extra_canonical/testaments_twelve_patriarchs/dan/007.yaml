base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007.yaml
  text: 'And when he had said these things, he kissed them affectionately and fell asleep in a good sleep.

    2 And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.

    3 Nevertheless, Dan prophesied to them that they would forget their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring.'
translation:
  language: ko
  text: '그가 이런 말들을 하고 나서, 그들을 다정하게 입맞춘 뒤 좋은 잠을 자듯 잠들었습니다.

    2 그의 아들들이 그를 장사하였습니다. 그리고 그 뒤에 그들은 그의 뼈를 아브라함과 이삭과 야곱이 있는 곳으로 가져갔습니다.

    3 그러나 단은 그들에게 그들이 자기들의 하나님을 잊어버리고, 자기들의 기업의 땅과 이스라엘의 씨족과 자기들의 자손의 가문으로부터 멀어지게 될 것이라고 예언하였습니다.'
  philosophy: formal
lexical_decisions:
- source_word: καταφιλήσας αὐτούς
  english_pob_choice: he kissed them affectionately
  chosen_korean: 그들을 다정하게 입맞춘 뒤
  alternatives_korean:
  - 그들에게 입맞추고
  - 그들을 애정 있게 입맞춘 뒤
  lexicon: καταφιλέω
  rationale: 단순한 '입맞추다'보다 강한 애정의 뉘앙스를 살리되, 과장되지 않게 '다정하게'로 풀어 source와 English POB의 정서를 함께 반영했습니다.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  english_pob_choice: fell asleep in a good sleep
  chosen_korean: 좋은 잠을 자듯 잠들었습니다
  alternatives_korean:
  - 평안히 잠들었습니다
  - 좋은 잠 가운데 잠들었습니다
  lexicon: ὕπνος / καλός
  rationale: 직역하면 다소 어색하므로, '좋은 잠'이라는 표현을 유지하면서 자연스러운 한국어로 옮겼습니다.
- source_word: ἀπήνεγκαν τὰ ὀστᾶ αὐτοῦ
  english_pob_choice: they carried up his bones
  chosen_korean: 그들은 그의 뼈를 ... 가져갔습니다
  alternatives_korean:
  - 그의 뼈를 ... 옮겨갔습니다
  - 그의 뼈를 ... 가지고 올라갔습니다
  lexicon: ἀπενέγκαν / ὀστέα
  rationale: English POB의 'carried up'는 상향 이동을 시사하지만 한국어에서는 중립적인 '가져갔습니다'가 본문 의미를 해치지 않으면서 더 자연스럽습니다.
- source_word: ἐπιλάθωνται τοῦ θεοῦ / ἀλλοτριωθήσονται
  english_pob_choice: they would forget their God and would be estranged from
  chosen_korean: 그들이 자기들의 하나님을 잊어버리고 ... 멀어지게 될 것이라고
  alternatives_korean:
  - 그들이 자기들의 하나님을 잊고 ... 소외될 것이라고
  - 그들이 자기들의 하나님을 잊어버리고 ... 이방인이 될 것이라고
  lexicon: ἐπιλανθάνομαι / ἀλλοτριόω
  rationale: '''잊어버리다''와 ''멀어지게 되다''는 기억 상실과 관계적·언약적 이탈을 함께 드러내며, 원문의 긴장을 과도하게 신학화하지 않습니다.'
theological_decisions:
- issue: '''their God''의 지시 대상'
  chosen_reading: 자기들의 하나님
  alternative_readings:
  - 그들의 하나님
  - 우리의 하나님
  rationale: 원문이 단수 소유 대명사와 직접 결합한 표현을 반영하여, 단의 예언 대상인 공동체의 언약적 관계를 분명히 했습니다.
  doctrine_reference: 언약적 소속과 배교 경고
- issue: '''race of Israel'' and ''family of their offspring'''
  chosen_reading: 이스라엘의 씨족과 자기들의 자손의 가문
  alternative_readings:
  - 이스라엘의 족속과 그 자손의 집안
  - 이스라엘의 نسل과 자손들의 가문
  rationale: 혈통·공동체·가문이라는 중첩된 소속 범주를 살려, 단순한 민족명보다 관계적 분리를 드러내도록 옮겼습니다.
  doctrine_reference: 공동체 정체성과 상속권 상실
