  source_fidelity: 원문을 기준으로 볼 때 초안은 핵심 윤리적 비유를 대체로 보존하지만, III.2(번역문 7절)에 있는 ‘분노가 몸을 자기 것으로 삼고 영혼을 지배하며 몸에 힘을 준다’는 세 단계의 진술 가운데 앞의 두 절을 누락했습니다. 또한 III.4(9절)의 세 가지 힘의 출처와 작용을 일부 바꾸었고, III.6(11절)를 빠뜨렸습니다. 이는 영어 POB 본문에도 있는 누락·왜곡을 따르기보다 그리스어 본문을 우선해야 하는 사안입니다.
  naturalness: 합쇼체의 기본 어조는 유지되어 있으나, ‘그것이 아버지이든’은 분노가 사람을 어떻게 대하는지를 나타내는 문맥에서 지시 대상이 다소 불분명합니다. ‘마음의 미움으로, 그 결과는 시기입니다’도 원문의 전치사적 연결을 지나치게 설명적으로 바꿉니다. 수정문은 주어와 관계를 분명히 하고 현대 표준어의 자연스러운 문장 흐름을 따릅니다.
  terminology: ‘주님의 예언자’, ‘분노의 영’, ‘영혼’, ‘불법’은 적절합니다. τύφλωσις는 ‘맹목’보다 실제 시각 상실의 은유를 보존하는 ‘눈멂’이 더 충실합니다. παρανομία는 ‘악행’으로 일반화하지 않고 ‘불법’으로 유지했습니다. θυμός와 ὀργή의 어휘적 차이는 각각 ‘분노’와 ‘격분’으로 제한적으로 드러냈습니다.
  issues:
  - severity: high
    issue: 7절(그리스어 III.2)의 앞부분 누락
    rationale: 원문은 분노가 몸을 자기 것으로 만들고 영혼을 지배한다고 말한 뒤, 몸에 힘을 주어 모든 불법을 행하게 한다고 이어집니다. 초안은 마지막 절만 번역했습니다.
  - severity: high
    issue: 9절의 세 가지 힘에 대한 의미 변형
    rationale: 원문에서 첫째는 시중드는 이들의 도움, 둘째는 재물로 남을 설득하고 부당하게 이김, 셋째는 타고난 힘으로 악을 행함입니다. 초안의 ‘그 행위를 정당화하고’와 ‘그것을 따라’는 원문에 없으며 지시 관계를 바꿉니다.
  - severity: high
    issue: 그리스어 III.6 전체 누락
    rationale: ‘이 영은 언제나 거짓과 함께 사탄의 오른쪽에서 다니며, 그의 행위들이 잔혹함과 거짓 가운데 이루어지게 한다’는 제공된 원문 마지막 절이 번역문에 없습니다.
  - severity: medium
    issue: 5절의 결과 관계 과도한 명시
    rationale: εἰς φθόνον은 ‘시기에 이르게 하는/시기를 향한’ 정도이며, ‘그 결과는 시기입니다’는 문법적 관계를 단정적 결과문으로 재구성합니다.
  - severity: low
    issue: 각주 표지의 위치와 내용 불일치
    rationale: 초안은 [a]–[d]를 본문 끝에 한꺼번에 두었고 각주 본문도 제공되지 않았습니다. 필요한 어휘 주석만 해당 낱말 뒤에 붙여야 합니다.
  revised_text: '진리와 인내[a]를 잃으면, 여러분은 멸망할 것입니다.


    2 분노는 눈멂입니다. 분노는 누구의 얼굴도 참되게 보지 못하게 합니다.[b] 3 아버지나 어머니라 해도 그들을 원수처럼 대합니다. 형제라 해도 알아보지 못합니다. 주님의 예언자라 해도 그의 말을 듣지 않습니다. 의인이라 해도 보지 못하며, 친구라 해도 알아보지 못합니다. 4 분노의 영은 그를 속임의 그물로 둘러싸고 그의 눈을 멀게 하며, 거짓을 통하여 그의 마음을 어둡게 하고 그에게 자기 자신의 시야를 줍니다.[c] 5 그러면 그것은 그의 눈을 무엇으로 가립니까? 그의 형제에 대한 마음의 미움, 곧 시기에 이르게 하는 것으로 가립니다.


    6 분노는 악합니다, 내 자녀들이여. 분노는 영혼 자체까지도 심히 뒤흔들기 때문입니다. 7 분노는 분노하는 사람의 몸을 자기 것으로 삼고 그의 영혼을 지배하며, 몸이 온갖 불법을 행하도록 그 몸에 힘을 줍니다. 8 몸이 이 모든 일을 행하고 나면, 영혼은 바르게 보지 못하므로 행해진 일들을 정당화합니다. 9 그러므로 분노하는 사람이 육체적으로 강하면, 그는 분노 가운데 세 배의 힘을 지닙니다. 첫째는 시중드는 이들의 도움에서 옵니다. 둘째는 재물을 통하여 남을 설득하고 부당하게 이기는 것입니다. 셋째는 타고난 힘을 지니고 그 힘으로 악을 행하는 것입니다. 10 그러나 분노하는 사람이 약하면, 격분의 정욕이 그 안에서 두 배로 자라납니다.[d] 분노는 언제나 그가 불법을 행하도록 돕기 때문입니다. 11 이 영은 언제나 거짓과 함께 사탄의 오른쪽에서 다니며, 그의 행위들이 잔혹함과 거짓 가운데 이루어지게 합니다.'
  revised_footnotes:
  - marker: a
    text: ‘인내’는 그리스어 μακροθυμία를 옮긴 말이며, ‘오래 참음’ 또는 ‘관용’으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘누구의 얼굴도 참되게 보지 못하게 한다’입니다. 이는 사람을 올바르게 알아보거나 판단하지 못한다는 비유입니다.
    reason: idiomatic_clarification
  - marker: c
    text: ‘자기 자신의 시야’는 분노가 현실에 대한 올바른 인식 대신 왜곡된 자기 관점을 갖게 한다는 표현입니다.
    reason: semantic_clarification
  - marker: d
    text: 여기서는 θυμός(‘분노’)와 ὀργή(‘격분’)가 구별되어 쓰입니다.
    reason: lexical_distinction
  revision_rationale: 그리스어 원문을 우선하여 영어 POB의 누락을 답습하지 않고 III.2와 III.6을 보완했습니다. III.4의 세 힘을 원문 순서와 의미대로 바로잡았으며, 5절의 시기와의 관계를 과도하게 단정하지 않았습니다. 용어는 현대 표준어 합쇼체에 맞추되, 원문의 구체적 비유와 어휘적 구별을 보존했습니다.
