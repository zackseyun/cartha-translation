base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003.yaml
  text: 'If you lose truth and patience[a], you will perish.


    2 Anger is blindness, for it does not allow one to see anyone’s face truly. 3 Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him. 4 For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision. 5 And with what does it veil his eyes? With hatred of heart against his brother, leading to envy.


    6 For anger is evil, my children, because it throws even the soul itself into turmoil. 7 And it gives strength to the body, so that it may commit every lawless deed. 8 And when the body has done all these things, the soul justifies what has been done, because it does not see rightly. 9 Therefore the one who is angry, if he is physically strong, has his soul’s power for anger threefold: one from the help of attendants, by which he justifies the deed; a second through wealth, persuading and overpowering unjustly[b]; and a third, because he has natural strength, by it he does evil. 10 But if the one who is angry is weak, he has the passion of wrath in him twofold[d][c], for anger always helps him toward wrongdoing.'
  footnotes:
  - marker: a
    text: Or 'longsuffering' for 'patience' (μακροθυμία).
    reason: lexical_alternative
  - marker: b
    text: '''See anyone’s face in truth'' is a literal image for perceiving a person rightly.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'gives him his own vision' suggests that anger replaces reality with a self-generated, distorted perception.
    reason: lexical_alternative
  - marker: d
    text: The Greek distinguishes θυμός ('anger') and ὀργή ('wrath') in the latter part of the chapter; the English preserves some of that variation.
    reason: lexical_alternative
translation:
  language: ko
  text: '진리와 인내[a]를 잃으면, 여러분은 멸망할 것입니다.


    2 분노는 눈멂입니다. 분노는 누구의 얼굴도 참되게 보지 못하게 합니다.[b] 3 아버지나 어머니라 해도 그들을 원수처럼 대합니다. 형제라 해도 알아보지 못합니다. 주님의 예언자라 해도 그의 말을 듣지 않습니다. 의인이라 해도 보지 못하며, 친구라 해도 알아보지 못합니다. 4 분노의 영은 그를 속임의 그물로 둘러싸고 그의 눈을 멀게 하며, 거짓을 통하여 그의 마음을 어둡게 하고 그에게 자기 자신의 시야를 줍니다.[c] 5 그러면 그것은 그의 눈을 무엇으로 가립니까? 그의 형제에 대한 마음의 미움, 곧 시기에 이르게 하는 것으로 가립니다.


    6 분노는 악합니다, 내 자녀들이여. 분노는 영혼 자체까지도 심히 뒤흔들기 때문입니다. 7 분노는 분노하는 사람의 몸을 자기 것으로 삼고 그의 영혼을 지배하며, 몸이 온갖 불법을 행하도록 그 몸에 힘을 줍니다. 8 몸이 이 모든 일을 행하고 나면, 영혼은 바르게 보지 못하므로 행해진 일들을 정당화합니다. 9 그러므로 분노하는 사람이 육체적으로 강하면, 그는 분노 가운데 세 배의 힘을 지닙니다. 첫째는 시중드는 이들의 도움에서 옵니다. 둘째는 재물을 통하여 남을 설득하고 부당하게 이기는 것입니다. 셋째는 타고난 힘을 지니고 그 힘으로 악을 행하는 것입니다. 10 그러나 분노하는 사람이 약하면, 격분의 정욕이 그 안에서 두 배로 자라납니다.[d] 분노는 언제나 그가 불법을 행하도록 돕기 때문입니다. 11 이 영은 언제나 거짓과 함께 사탄의 오른쪽에서 다니며, 그의 행위들이 잔혹함과 거짓 가운데 이루어지게 합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘인내’는 그리스어 μακροθυμία를 옮긴 말이며, ‘오래 참음’ 또는 ‘관용’으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘누구의 얼굴도 참되게 보지 못하게 한다’입니다. 이는 사람을 올바르게 알아보거나 판단하지 못한다는 비유입니다.
    reason: idiomatic_clarification
  - marker: c
    text: ‘자기 자신의 시야’는 분노가 현실에 대한 올바른 인식 대신 왜곡된 자기 관점을 갖게 한다는 표현입니다.
    reason: semantic_clarification
  - marker: d
    text: 여기서는 θυμός(‘분노’)와 ὀργή(‘격분’)가 구별되어 쓰입니다.
    reason: lexical_distinction
lexical_decisions:
- source_word: τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν
  english_pob_choice: truth and patience
  chosen_korean: 진리와 인내
  alternatives_korean:
  - 진실과 오래 참음
  - 참됨과 인내
  lexicon: LSJ
  rationale: ἀλήθεια와 μακροθυμία를 각각 진리/인내로 옮겨 윤리적 권면의 핵심을 살렸고, μακροθυμία는 POB의 'patience'에 맞춰 현대 한국어 '인내'로 자연스럽게 전달했습니다.
- source_word: τύφλωσις
  english_pob_choice: blindness
  chosen_korean: 맹목
  alternatives_korean:
  - 눈멂
  - 눈먼 상태
  lexicon: LSJ
  rationale: 분노를 단순한 상태가 아니라 인식 기능의 상실로 말하는 비유를 살리기 위해, 더 압축적이고 진술형에 맞는 '맹목'을 사용했습니다.
- source_word: ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ
  english_pob_choice: to see anyone’s face truly
  chosen_korean: 누구의 얼굴도 참되게 보지 못하게 합니다
  alternatives_korean:
  - 누구의 얼굴도 진리 안에서 보지 못하게 합니다
  - 사람의 얼굴을 참으로 보지 못하게 합니다
  lexicon: LSJ
  rationale: '''얼굴''과 ''참되게''를 유지해 원문의 구체적 이미지와 인식의 참됨을 함께 보존했습니다.'
- source_word: μίσει καρδίας
  english_pob_choice: hatred of heart / hatred in his heart
  chosen_korean: 마음의 미움
  alternatives_korean:
  - 마음속 미움
  - 마음 안의 미움
  lexicon: LSJ
  rationale: 원문의 속격 구조를 과도하게 풀지 않고, 내면에서 비롯된 미움을 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: πνεῦμα τοῦ θυμοῦ
  english_pob_choice: the spirit of anger
  chosen_korean: 분노의 영
  alternatives_korean:
  - 분노의 기운
  - 분노하는 영
  lexicon: LSJ
  rationale: 영의 인격적·작동적 표현을 약화시키지 않기 위해 '영'을 유지했고, POB의 직역적 어조를 따랐습니다.
- source_word: ἀνομία
  english_pob_choice: lawless deed
  chosen_korean: 불법한 일
  alternatives_korean:
  - 법 없는 일
  - 악한 일
  lexicon: LSJ
  rationale: 율법적 윤리 배경을 살리면서도 현대 한국어에서 자연스러운 '불법한'으로 옮겨 lawlessness의 뉘앙스를 유지했습니다.
- source_word: παρανομίᾳ
  english_pob_choice: in lawlessness / toward wrongdoing
  chosen_korean: 악행
  alternatives_korean:
  - 불법으로
  - 법을 어기는 일
  lexicon: LSJ
  rationale: 문맥상 분노가 사람을 악한 행위로 이끈다는 뜻을 자연스럽게 드러내기 위해 한국어에서 가장 읽히는 '악행'을 택했습니다.
theological_decisions:
- issue: κύριος in προφήτης Κυρίου
  chosen_reading: 주님의 예언자
  alternative_readings:
  - 주님의 선지자
  - 하나님의 예언자
  rationale: κύριος를 프로젝트 기본값에 따라 '주님'으로 옮기고, 예언자는 현대 한국어에서 더 통용되는 '예언자'를 사용했습니다.
  doctrine_reference: 'POB glossary: κύριος → 주님; προφήτης → 예언자'
- issue: 분노를 작동시키는 '영'의 표현
  chosen_reading: 분노의 영을 실제로 작동하는 힘으로 남겨 두되, 독립된 악령 교리로 확장하지는 않음
  alternative_readings:
  - 단순한 감정의 은유로 완화
  - 명시적 악령 존재론으로 강화
  rationale: 본문은 분노를 인격화된 작동 주체처럼 말하므로 그 언어를 보존하되, 본문이 말하지 않는 체계적 악령론은 덧붙이지 않았습니다.
  doctrine_reference: source-text constraint / ethical personification
