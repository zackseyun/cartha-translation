translation:
  language: ko
  text: 울지도 말고 슬퍼하지도 마십시오. 우리는 우리 아버지께 무슨 말씀을 드릴지 찾았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ κλαῖε μηδὲ λυποῦ
  english_pob_choice: Do not weep or be distressed
  chosen_korean: 울지도 말고 근심하지도 마십시오
  alternatives_korean:
  - 울지 마십시오, 또 슬퍼하지도 마십시오
  - 울지 말고 낙심하지도 마십시오
  lexicon: κλαίω, λυπέω
  rationale: κλαῖε는 단순한 눈물 흘림보다 강한 슬픔의 표현이므로 ‘울다’로, λυποῦ는 감정적 괴로움/근심을 가리켜 ‘근심하다’로 옮겨 원문의 병렬 금지를 살렸습니다.
- source_word: εὕρομεν τί εἴπωμεν
  english_pob_choice: we have found what we shall say
  chosen_korean: 우리는 … 무슨 말을 해야 할지 찾았습니다
  alternatives_korean:
  - 우리는 … 할 말을 찾았습니다
  - 우리는 … 무엇을 말할지 찾았습니다
  lexicon: εὑρίσκω, εἴπωμεν
  rationale: ‘찾았습니다’는 준비된 답을 발견했다는 의미를 자연스럽게 전달하고, ‘무슨 말을 해야 할지’는 원문의 미래적 발화 내용(what we shall say)을 한국어로 풀어 살렸습니다.
- source_word: τῷ πατρὶ ἡμῶν
  english_pob_choice: to our father
  chosen_korean: 우리 아버지께
  alternatives_korean:
  - 우리 아버지에게
  - 아버지께
  lexicon: πατήρ
  rationale: 관계의 방향을 드러내는 여격을 한국어는 조사 ‘께’로 자연스럽게 표시했고, 공동체 내부의 가족 호칭을 위해 ‘우리 아버지’로 옮겼습니다.
theological_decisions:
- issue: 직접 화법의 정서 강도
  chosen_reading: 명령형 금지와 이유 제시를 함께 살려, 위로/권면의 어조를 유지했습니다.
  alternative_readings:
  - 단순 서술형으로 완화
  - 더 강한 권면형으로 재구성
  rationale: 원문은 두 개의 금지 명령 뒤에 이유절이 이어지는 구조이므로, 한국어에서도 권면의 즉시성과 설명의 논리를 함께 보존하는 것이 적절합니다.
  doctrine_reference: 문맥 보존
