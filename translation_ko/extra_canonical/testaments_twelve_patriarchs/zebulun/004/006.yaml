id: T12P.ZEB.4.6
reference: Testament of Zebulun 4:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ λαβὼν τὸ ἀργύριον κατέδραμεν ὀπίσω τοῖς ἐμπόροις· μὴ εὑρὼν δὲ αὐτοὺς ὑπέστρεψεν ὀδυρόμενος²⁵. καταλιπόντες²⁶ δὲ οἱ ἔμποροι τὴν πλατεῖαν ὁδὸν διόδευσαν²⁷ διὰ *Τρωγλοδιτῶν ἐν συντόμῳ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/006.yaml
  text: And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes.
translation:
  language: ko
  text: 그리고 은을 가지고 상인들을 뒤쫓아 달려갔으나, 그들을 찾지 못하고 탄식하며 돌아왔습니다. 한편 상인들은 넓은 길을 떠나 트로글로디타이인들의 땅을 지나는 지름길로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 트로글로디타이인들은 그리스어 원문에 나오는 복수 민족명입니다.
    reason: Τρωγλοδιτῶν의 고유명사·민족명 성격을 밝히고 본문의 각주 표지에 대응합니다.
lexical_decisions:
- source_word: τὸ ἀργύριον
  english_pob_choice: the silver
  chosen_korean: 은
  alternatives_korean:
  - 은돈
  - 은전
  lexicon: ἀργύριον
  rationale: 문맥상 특정 화폐 단위보다 ‘은’ 자체를 가리키는 간결한 표현이 자연스럽고, POB 영어도 단순히 silver로 처리했습니다.
- source_word: κατέδραμεν ὀπίσω
  english_pob_choice: ran after
  chosen_korean: 뒤쫓아 달려갔습니다
  alternatives_korean:
  - 뒤따라 달렸습니다
  - 쫓아갔습니다
  lexicon: κατατρέχω
  rationale: ‘뒤쫓다’와 ‘달려가다’의 두 의미를 함께 살려 급박한 행동을 드러냈습니다.
- source_word: ὀδυρόμενος
  english_pob_choice: found no one;
  chosen_korean: 통곡하며
  alternatives_korean:
  - 슬퍼하며
  - 울부짖으며
  lexicon: ὀδύρομαι
  rationale: 단순한 실망보다 깊은 탄식과 울부짖음을 나타내므로, 통곡이 가장 강도에 맞습니다.
- source_word: τὴν πλατεῖαν ὁδὸν
  english_pob_choice: the main road
  chosen_korean: 넓은 길
  alternatives_korean:
  - 대로
  - 큰길
  lexicon: πλατύς + ὁδός
  rationale: 직역성도 유지하면서 한국어에서 자연스러운 ‘넓은 길’로 옮겼습니다.
- source_word: διὰ Τρωγλοδιτῶν ἐν συντόμῳ
  english_pob_choice: by a shorter route through the Troglodytes
  chosen_korean: 지름길로, 트로글로디타이 사람들 지역을 지나갔습니다
  alternatives_korean:
  - 짧은 길로, 트로글로디타이 지역을 지나갔습니다
  - 가까운 길로, 트로글로디타이 사람들을 거쳐 갔습니다
  lexicon: Τρωγλοδίται
  rationale: 고유명사는 음역을 유지하고, ἐν συντόμῳ는 관용적으로 ‘지름길로’ 처리해 경로상의 대비를 살렸습니다.
theological_decisions:
- issue: 서사적 시점과 문장 연결
  chosen_reading: 한 절 안의 연속 동작을 한국어 접속과 쉼표로 살려, 추상적 해설 없이 사건의 흐름을 따라가게 했습니다.
  alternative_readings:
  - 문장을 더 짧게 분절하는 방식
  - 원인절을 따로 강조하는 방식
  rationale: 원문은 행동의 연쇄와 결과를 빠르게 이어주므로, 한국어도 그 긴박감을 유지하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: source narrative coherence
- issue: Τρωγλοδιτῶν의 처리
  chosen_reading: 의미역으로 풀지 않고 음역을 유지했습니다.
  alternative_readings:
  - ‘동굴 사람들’로 의미역 처리
  - 주석 없이 일반 지명처럼 번역
  rationale: 이 명칭은 민족/지역명으로 기능하므로, 독자가 원문의 낯섦을 인지할 수 있게 음역을 보존하는 것이 적절합니다.
  doctrine_reference: proper noun transparency
