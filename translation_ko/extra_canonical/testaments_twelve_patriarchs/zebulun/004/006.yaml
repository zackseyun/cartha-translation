revisions:
- from: 그리고 은을 가지고 상인들을 뒤쫓아 달려갔으나, 그들을 찾지 못하자 통곡하며 돌아왔습니다. 그런데 상인들은 넓은 길을 버리고 지름길로, 트로글로디타이 사람들 지역을 지나갔습니다.[a]
  to: 그리고 은을 가지고 상인들을 뒤쫓아 달려갔으나, 그들을 찾지 못하고 탄식하며 돌아왔습니다. 한편 상인들은 넓은 길을 떠나 트로글로디타이인들의 땅을 지나는 지름길로 갔습니다.[a]
  rationale: 원문의 분사 연결(‘찾지 못하고 … 돌아왔다’)과 대조 접속(‘한편’)을 보존했습니다. 마지막 경로는 ‘넓은 길을 떠나’와 ‘지름길로’를 함께 살리면서, 원문에 없는 독립 명사 ‘지역’을 피하고 민족명 복수의 의미를 반영하도록 다듬었습니다.
