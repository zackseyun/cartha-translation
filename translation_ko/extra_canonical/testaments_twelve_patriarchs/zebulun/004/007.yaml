  text: Reuben was grieved, and he did not eat bread on that day. Then Dan came near and said to him,
translation:
  language: ko
  text: 르우벤은 슬퍼하고 있었고, 그날에는 빵을 먹지 않았습니다. 그러자 단이 다가와 그에게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπούμενος
  english_pob_choice: was grieved
  chosen_korean: 근심하였고
  alternatives_korean:
  - 슬퍼하였고
  - 비통해하였고
  lexicon: λυπέω
  rationale: 감정의 무게를 살리되 너무 강한 비애로 치우치지 않게 ‘근심하다’로 옮겼습니다.
- source_word: ἄρτον
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 떡
  - 양식
  - 빵(식사)
  lexicon: ἄρτος
  rationale: 문맥상 일반 음식 섭취를 가리키므로 한국어에서 자연스러운 기본어 ‘빵’을 사용했습니다.
- source_word: προσελθὼν
  english_pob_choice: came near
  chosen_korean: 가까이 와서
  alternatives_korean:
  - 다가와서
  - 나아가서
  - 그에게 와서
  lexicon: προσέρχομαι
  rationale: 단순한 접근 동작을 자연스럽게 살리면서도 원문의 ‘다가옴’을 유지했습니다.
- source_word: αὐτῷ
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그에게로
  - 그한테
  lexicon: αὐτός
  rationale: 대상 지시를 분명히 드러내기 위해 마지막 절의 간접목적어를 한국어로 명시했습니다.
theological_decisions:
- issue: “bread”와 단식의 표현 방식
  chosen_reading: ‘빵을 먹지 않았습니다’로 직역해, 단순한 금식/식사 거부를 암시하되 본문 이상의 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - ‘아무것도 먹지 않았습니다’
  - ‘금식했습니다’
  rationale: 원문은 빵 섭취의 부재를 말할 뿐이므로, 금식이라는 해석어로 좁히지 않고 식사 행위 자체를 그대로 드러냈습니다.
  doctrine_reference: 본문 의미 보존 원칙
