  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/003.yaml
  text: And when they saw that I also was not eating, they set me to guard him until he was sold.
translation:
  language: ko
  text: 그는 내가 또한 먹지 않는 것을 보고, 그가 이스마엘 사람들에게 팔릴 때까지 내게 그를 지키도록 맡겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρῶντές με δὲ μὴ ἐσθίοντα
  english_pob_choice: when they saw that I also was not eating
  chosen_korean: 내가 역시 먹지 않는 것을 보고는
  alternatives_korean:
  - 내가 역시 먹지 않는 것을 보았을 때
  - 내가 또한 먹지 않는 것을 보고
  lexicon: ὁράω, ἐσθίω
  rationale: 분사구를 자연스러운 종속절로 옮기되, ‘역시/또한’으로 화자가 다른 사람들과 함께 금식하거나 식사를 거부하는 상황을 드러냈습니다.
- source_word: ἔθετό με τηρεῖν αὐτόν
  english_pob_choice: they set me to guard him
  chosen_korean: 그를 지키게 하였습니다
  alternatives_korean:
  - 내게 그를 지키도록 맡겼습니다
  - 나를 그를 지키도록 세웠습니다
  lexicon: τίθημι + τηρέω
  rationale: ‘세우다/맡기다’의 배경 뜻은 살리되, 한국어에서는 결과를 중심으로 ‘지키게 하였습니다’가 가장 자연스럽습니다.
- source_word: ἕως οὗ ἀπεδόθη τοῖς Ἰσμαηλίταις
  english_pob_choice: until he was sold
  chosen_korean: 그가 이스마엘 사람들에게 팔릴 때까지
  alternatives_korean:
  - 그가 이스마엘 사람들에게 넘겨질 때까지
  - 그가 이스마엘 사람들에게 팔려 넘어갈 때까지
  lexicon: ἀποδίδωμι + τοῖς Ἰσμαηλίταις
  rationale: 수동형 ‘팔리다’를 사용해 거래·양도 행위를 분명히 하고, 대상인 ‘이스마엘 사람들’을 음역이 아닌 익숙한 성경식 표현으로 옮겼습니다.
theological_decisions:
- issue: 서술 시점과 인칭 유지
  chosen_reading: 1인칭 회고 문맥을 유지해 ‘내가’와 ‘그를’의 관계가 분명하게 드러나도록 했습니다.
  alternative_readings:
  - 일반화하여 ‘사람들이 … 보았습니다’처럼 옮김
  rationale: 본문은 화자의 회상 서술이므로 인칭을 보존하는 것이 사건의 증언성에 맞습니다.
  doctrine_reference: n/a
