  text: '4. (α-text omits this verse; β-text reads: ἐποίησε δὲ ἐν τῷ λάκκῳ τρεῖς ἡμέρας καὶ τρεῖς νύκτας καὶ οὕτως ἐπράθη ἄσιτος.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/004.yaml
  text: He spent three days and three nights in the pit, and so he was sold while fasting.
translation:
  language: ko
  text: 그는 그 구덩이에서 사흘 낮과 사흘 밤을 지냈고, 그리하여 금식한 채로 팔렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ λάκκῳ
  english_pob_choice: in the pit
  chosen_korean: 그 구덩이에서
  alternatives_korean:
  - 웅덩이에서
  - 구덩이 안에서
  lexicon: λάκκος
  rationale: 구덩이는 본문이 가리키는 갇힌 장소를 자연스럽게 드러내면서도 직역성을 유지합니다.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  english_pob_choice: three days and three nights
  chosen_korean: 사흘 낮과 사흘 밤
  alternatives_korean:
  - 삼 일과 삼 밤
  - 사흘과 사흘 밤
  lexicon: ἡμέρα / νύξ
  rationale: 한국어 관용을 살리되, 낮과 밤의 병렬을 보존해 원문의 시간 표현을 더 분명히 드러냅니다.
- source_word: ἐπράθη
  english_pob_choice: was sold
  chosen_korean: 팔렸습니다
  alternatives_korean:
  - 매매되었습니다
  - 팔려 갔습니다
  lexicon: πιπράσκω
  rationale: 수동태의 당함을 살리면서도 현대 한국어에서 자연스럽게 읽히는 표현을 택했습니다.
- source_word: ἄσιτος
  english_pob_choice: while fasting
  chosen_korean: 금식한 채로
  alternatives_korean:
  - 굶은 채로
  - 아무것도 먹지 않은 채로
  lexicon: ἄσιτος
  rationale: 의도적 금식의 뉘앙스를 살려, 단순히 끼니를 못 먹은 상태보다 적극적인 의미를 반영했습니다.
theological_decisions:
- issue: α-text omission vs β-text inclusion
  chosen_reading: 본문은 β-text의 전승을 따라 이 절을 번역하되, 원문 비평상 α-text가 이 절을 생략함을 반영하지는 않았습니다.
  alternative_readings:
  - α-text에서는 해당 절이 없음
  - 비평본문에 따라 각주로만 처리
  rationale: 제공된 영어 POB와 원문이 β-text를 전제로 하므로, 본문 번역은 그 전승을 그대로 따르되 본문 내에서 과잉 주석화하지 않았습니다.
  doctrine_reference: Textual criticism / manuscript tradition
