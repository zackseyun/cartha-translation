  text: 5. Ἐλθὼν δὲ Ῥουβὶμ καὶ ἀκούσας ὅτι ἐπράθη⁹ ἀπόντος *αὐτοῦ περιεσχίσατο¹¹ τὸν χιτῶνα αὐτοῦ θρηνῶν ἔλεγεν¹². Πῶς ὄψωμαι²⁴ τὸ πρόσωπον τοῦ πατρός μου Ἰακώβ;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/005.yaml
  text: When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?”
translation:
  language: ko
  text: 르우벤이 와서, 자기가 없는 동안 요셉이 팔렸다는 말을 듣고 자기 옷을 찢고 애곡하며 말했습니다. “내가 어떻게 내 아버지 야곱의 얼굴을 볼 수 있겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν δὲ Ῥουβὶμ
  english_pob_choice: When Reuben came
  chosen_korean: 그런데 르우벤이 와서
  alternatives_korean:
  - 르우벤이 오자
  - 르우벤이 왔는데
  lexicon: 르우벤
  rationale: Ἐλθὼν δὲ의 서술 연결을 자연스럽게 살리되, ‘그런데’로 앞뒤 상황 전환을 드러냈습니다.
- source_word: ἐπράθη
  english_pob_choice: he had been sold
  chosen_korean: 그가 팔렸다는
  alternatives_korean:
  - 그가 팔렸다는
  - 그가 노예로 팔렸다는
  lexicon: 팔다
  rationale: 수동 완료적 의미를 ‘팔렸다는’으로 간결하게 옮겼고, 본문 자체는 단순히 ‘팔림’을 말하므로 ‘노예로’는 덧붙이지 않았습니다.
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  english_pob_choice: he tore his garments
  chosen_korean: 자기 옷을 찢고
  alternatives_korean:
  - 겉옷을 찢고
  - 옷을 찢으며
  lexicon: χιστών / 옷을 찢다
  rationale: χιτών을 과도하게 특정하지 않고 POB의 ‘garments’에 맞춰 ‘옷’을 택해 장례·통곡의 관용적 표현을 유지했습니다.
- source_word: θρηνῶν ἔλεγεν
  english_pob_choice: mourned, saying
  chosen_korean: 슬퍼하며 말했습니다
  alternatives_korean:
  - 애곡하며 말했습니다
  - 통곡하며 말했습니다
  lexicon: 슬퍼하다
  rationale: θρηνῶν의 애도 행위를 현대 한국어에서 과장 없이 전달하면서 서술과 직접화법의 흐름을 살렸습니다.
- source_word: Πῶς ὄψωμαι τὸ πρόσωπον τοῦ πατρός μου Ἰακώβ;
  english_pob_choice: How shall I look upon the face of my father Jacob?
  chosen_korean: 내가 어떻게 아버지 야곱의 얼굴을 볼 수 있겠습니까?
  alternatives_korean:
  - 내가 어떻게 아버지 야곱의 얼굴을 뵐 수 있겠습니까?
  - 어떻게 내가 아버지 야곱의 얼굴을 보겠습니까?
  lexicon: ὄψωμαι / πρόσωπον
  rationale: ‘얼굴을 보다’라는 직역을 유지하되, 한국어 문맥에 맞게 ‘볼 수 있겠습니까?’로 전환하여 수치와 두려움의 정서를 살렸습니다.
theological_decisions:
- issue: '장면의 정서 표현: 통곡/애도/슬퍼함'
  chosen_reading: ‘자기 옷을 찢고 슬퍼하며’로 최소한의 정서 표지를 유지했습니다.
  alternative_readings:
  - ‘자기 옷을 찢고 애곡하며’
  - ‘자기 옷을 찢고 통곡하며’
  rationale: 본문은 루우벤의 애도를 보여 주지만, 헬라어의 현재분사 θρηνῶν을 과장 없이 전달하는 편이 서술의 절제를 더 잘 보존합니다.
  doctrine_reference: 서사 문맥의 정서 묘사
