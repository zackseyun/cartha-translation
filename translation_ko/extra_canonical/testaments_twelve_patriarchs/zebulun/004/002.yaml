review_pass:
  verdict: revise
  source_fidelity: 핵심 내용은 대체로 충실합니다. 다만 ἀποπηδήσαντες는 ‘그를 뛰어올라’가 아니라 시므온·단·갓이 ‘뛰어올라’ 요셉을 죽이는 동작을 수식하므로, 한국어 어순을 바로잡아야 합니다. προσέχων τῷ λάκκῳ는 ‘구덩이 곁을 지키다’보다 ‘구덩이를 지켜보다’가 원문의 주의 깊은 감시를 더 직접적으로 반영합니다.
  naturalness: 합쇼체와 전반적인 문장은 자연스럽습니다. 다만 ‘그를 뛰어올라 죽일까’는 한국어에서 ‘그를’이 ‘뛰어올라’의 대상처럼 읽힐 수 있어 부자연스럽고 의미가 흐려집니다.
  terminology: ‘요셉’, ‘유다’, ‘시므온’, ‘단’, ‘갓’ 및 ‘불쌍히 여겨’는 적절합니다. 신학적 해석이나 금식의 의미를 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘그를 뛰어올라 죽일까’의 수식 관계가 부정확하고 어색합니다.
    rationale: ἀποπηδήσαντες는 시므온·단·갓이 행하는 분사이며, αὐτόν은 ἀνέλωσιν(‘죽이다’)의 목적어입니다. ‘뛰어올라 그를 죽일까’로 배열해야 합니다.
  - severity: medium
    issue: 본문에 근거가 제시되지 않은 [a][b] 각주 표지가 남아 있습니다.
    rationale: 제공된 translation_notes 및 각주 자료에는 해당 표지에 대응하는 각주가 없습니다. 독자를 존재하지 않는 주석으로 안내하므로 제거해야 합니다.
