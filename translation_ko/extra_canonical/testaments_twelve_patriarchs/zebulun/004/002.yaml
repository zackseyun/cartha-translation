  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/002.yaml
  text: But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Dan and Gad might leap up and kill him.
translation:
  language: ko
  text: 그러나 나는 요셉을 불쌍히 여겨 먹지 않았습니다. 구덩이 곁을 지키고 있었으니, 유다가 시므온과 단과 갓이 그를 뛰어올라 죽일까 두려워했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνιζόμενος τὸν Ἰωσὴφ
  english_pob_choice: having compassion for Joseph
  chosen_korean: 요셉을 불쌍히 여겨
  alternatives_korean:
  - 요셉을 측은히 여겨
  - 요셉을 가엾게 여겨
  lexicon: σπλαγχνίζομαι
  rationale: 내장/긍휼의 강한 감정을 나타내는 동사를 한국어의 자연스러운 현대어로 옮기되, 본문의 연민을 분명히 드러내기 위해 ‘불쌍히 여겨’를 선택했습니다.
- source_word: οὐκ ἔφαγον
  english_pob_choice: did not eat
  chosen_korean: 먹지 않았습니다
  alternatives_korean:
  - 음식을 먹지 않았습니다
  - 먹지 않았습니다
  lexicon: ἐσθίω
  rationale: 금식이나 단식의 해석을 덧붙이지 않고, 단순한 부정 사실을 자연스럽게 표현했습니다.
- source_word: προσέχων δὲ τῷ λάκκῳ
  english_pob_choice: I kept watch by the pit
  chosen_korean: 구덩이 곁을 지키고 있었으니
  alternatives_korean:
  - 구덩이를 주시하고 있었으니
  - 구덩이 곁에서 살피고 있었으니
  lexicon: προσέχω + λάκκος
  rationale: προσέχων은 ‘주의를 기울이다’의 뜻이지만 여기서는 상황상 감시하며 지키는 행위를 가리키므로, 장소 표지를 살려 ‘곁을 지키고 있었습니다’로 옮겼습니다.
- source_word: ἀποπηδήσαντες
  english_pob_choice: might leap up
  chosen_korean: 뛰어올라
  alternatives_korean:
  - 달려들어
  - 튀어 올라
  lexicon: ἀποπηδάω
  rationale: ‘급히 뛰어오르다/튀어 오르다’의 동작성을 살려, 공격적 기습의 뉘앙스가 드러나도록 ‘뛰어올라’로 번역했습니다.
theological_decisions:
- issue: 유다가 두려워한 대상과 서술 시점의 긴장
  chosen_reading: 유다가 시므온과 단과 갓이 요셉을 죽일까 두려워했다는 이유를 그대로 연결해, 화자의 경계와 유다의 공포를 모두 살렸습니다.
  alternative_readings:
  - 유다가 혹시 시므온과 단과 갓이 그를 죽일까 두려워했습니다
  - 유다가 시므온과 단과 갓이 그를 죽일 것을 두려워했습니다
  rationale: 본문은 화자의 연민과 경계, 유다의 두려움을 한 문장 안에서 층위 있게 제시하므로, 인과를 과도하게 단순화하지 않고 자연스러운 한국어로 유지했습니다.
  doctrine_reference: 서사적 진술의 긴장 보존
