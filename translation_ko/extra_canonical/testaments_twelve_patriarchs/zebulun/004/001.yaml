review_pass:
  verdict: revise
  source_fidelity: 그리스어 본문은 첫 절에서 ‘그들이 그에게 저지른/보인 악행들’을 들었다고 하며, 이어 †πραθῆναι는 통상 ‘팔리다’를 뜻합니다. 초안의 ‘그에게 어떤 악이 가해졌는지’는 행위 주체와 복수·총체성을 약화시키고, ‘구덩이에 던져진’은 제시된 그리스어 어휘와 일치하지 않습니다. 칼표(†)가 있는 문제 구절이므로 본문은 그리스어의 ‘팔리다’를 번역하고 이문·전승상 문제는 각주로 밝혀야 합니다.
  naturalness: ‘그들이 그에게 저지른 온갖 악행을 들었기 때문입니다’와 ‘그가 팔린 뒤에’는 현대 표준어 합쇼체로 자연스럽고, 원문의 접속 관계와 서술의 절제를 유지합니다.
  terminology: κακά는 여기서 추상명사 ‘악’보다 구체적 복수 의미를 드러내는 ‘악행’이 적절합니다. πραθῆναι는 ‘팔리다’로 옮깁니다. 영어 POB의 ‘구덩이에 던져지다’는 현 그리스어 본문과 다른 읽기이므로 본문 번역으로 채택하지 않습니다.
  issues:
  - severity: high
    issue: πραθῆναι를 ‘구덩이에 던져진’으로 번역함
    rationale: 제시된 그리스어 πραθῆναι는 ‘팔리다’이며, 본문에는 칼표(†)가 있어 본문 상태 또는 전승상의 문제가 표시됩니다. 영어 POB의 ‘pit’는 그리스어 본문을 직접 번역한 것이 아니므로, 출처 우선 원칙상 ‘팔린’으로 옮기고 각주로 처리해야 합니다.
  - severity: medium
    issue: ὅσα ... κακά의 의미와 행위 주체가 약화됨
    rationale: ‘어떤 악이 가해졌는지’는 부정확한 의문적 표현이며, 원문의 ‘그들이 그에게 저지른/보인 온갖 악행’이라는 복수적·행위적 의미를 충분히 드러내지 못합니다.
  revised_text: 그들이 그에게 저지른 온갖 악행을 들었기 때문입니다. 그런데 그가 팔린 뒤에[a], 내 형제들은 앉아서 먹고 마셨습니다.
  revised_footnotes:
  - marker: a
    text: 그리스어 본문은 ‘그가 팔린 뒤에’(πραθῆναι)라고 읽지만, 이 단어에는 본문상의 문제를 나타내는 칼표(†)가 붙어 있습니다. 일부 전승 해석과 영어 POB는 요셉이 구덩이에 던져진 장면으로 이해합니다.
    reason: 문제 표시된 그리스어 어휘를 본문에서 충실히 번역하면서, 영어 POB와의 상이한 전승적 이해를 투명하게 밝혀 독자가 불확실성을 확인할 수 있게 합니다.
  revision_rationale: 그리스어 원문을 우선하여 πραθῆναι를 ‘팔린’으로 바로잡고, 칼표가 표시하는 본문상 불확실성과 영어 POB의 ‘구덩이’ 읽기는 각주에 한정했습니다. 또한 첫 문장의 ‘악행’과 그 행위 주체를 명확히 하되, 형제들의 행동에 대한 비난적 해설은 추가하지 않았습니다.
