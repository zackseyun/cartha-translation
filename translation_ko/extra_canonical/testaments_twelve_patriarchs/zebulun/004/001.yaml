source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. *Ἤκουσαν γὰρ ὅσα ἐνεδείξαντο αὐτῷ κακά⁵⁰. IV. Μετὰ δὲ τὸ †πραθῆναι¹ αὐτὸν ἐκάθησαν οἱ ἀδελφοί μου² ἐσθίειν καὶ πίνειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/001.yaml
  text: For they had heard how much evil had been done against him. And after he had been thrown into the pit, my brothers sat down to eat and drink.
translation:
  language: ko
  text: 그들이 그에게 어떤 악이 가해졌는지 들었습니다. 그리고 그가 구덩이에 던져진 뒤에, 내 형제들은 앉아서 먹고 마셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤκουσαν γὰρ ὅσα ἐνεδείξαντο αὐτῷ κακά
  english_pob_choice: For they had heard how much evil had been done against him.
  chosen_korean: 그들이 그에게 어떤 악이 가해졌는지 들었습니다.
  alternatives_korean:
  - 그들이 그에게 얼마나 많은 악이 행해졌는지 들었습니다.
  - 그들이 그에게 가해진 온갖 악을 들었습니다.
  lexicon: ἐνδείκνυμι / κακά
  rationale: 문맥상 ‘악’이 추상적 악행의 총량을 가리키므로, ‘가해졌는지’로 수동적 피해를 살려 원문의 피해 대상성을 분명히 했습니다.
- source_word: πραθῆναι
  english_pob_choice: thrown into the pit
  chosen_korean: 구덩이에 던져진
  alternatives_korean:
  - 구덩이로 던져진
  - 웅덩이에 던져진
  lexicon: πραθῆναι
  rationale: 영어 POB가 ‘pit’로 풀어 준 전승을 따라 ‘구덩이’로 옮겨, 요셉 전승의 구덩이 이미지와 맞췄습니다.
- source_word: ἐσθίειν καὶ πίνειν
  english_pob_choice: eat and drink
  chosen_korean: 앉아서 먹고 마셨습니다
  alternatives_korean:
  - 먹고 마셨습니다
  - 앉아 먹고 마셨습니다
  lexicon: ἐσθίειν / πίνειν
  rationale: 동사의 연속 행동을 자연스럽게 살리되, 자리에 ‘앉아서’는 원문에 있는 ἐκάθησαν을 반영해 서술했습니다.
theological_decisions:
- issue: 형제들의 식사 장면이 지닌 서사적 냉담함
  chosen_reading: 문장을 꾸미지 않고 사실 서술로 유지했습니다.
  alternative_readings:
  - 비난조로 풀어 ‘태연히’ 또는 ‘무심히’의 뉘앙스를 추가하는 읽기
  rationale: 원문은 행위의 병치를 통해 도덕적 충격을 드러내지만, 해설적 어휘를 덧붙이지 않고 독자가 판단하도록 두는 편이 본문 충실도가 높습니다.
  doctrine_reference: 서사 본문 해석의 절제 원칙
