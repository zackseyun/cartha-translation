  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003.yaml
  text: '1[a]. And when they had done this, they all sat down to eat and drink. But I, seeing that Joseph was grieving, did not eat with them, but I kept watch over the pit, praying for help for him.


    2. And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits which our fathers dug and found no water.”


    3. For this reason the Lord prevented water from springing up in them, so that Joseph might be preserved[b].


    4. And they did so until they sold him to the Ishmaelites.


    5. As for his price, my children, I had no share in it. But Simeon and Dan and Gad, and their sons, took his price and bought sandals for themselves and for their wives and their children,


    6. saying, “We will not eat from it, because it is the price of our brother’s blood; rather, we will trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”


    7. Therefore it is written in the record of the law of Moses: “The man who does not wish to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”


    8. And the brothers of Joseph were not willing to raise up the life of their brother, and the Lord removed from them the sandal which they wore against Joseph their brother.


    9. For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner of those before King Pharaoh.


    10. And not only did they bow down to him, but immediately, as they fell before him, they were also spat upon[c], and they were put to shame by the Egyptians.'
  footnotes:
  - marker: a
    text: Allusion to Deuteronomy 25:5–10, where refusal to perform a brother-in-law duty brings public shame through sandal-removal and spitting.
    reason: cross_reference
    anchor_ref: '3:7'
  - marker: b
    text: 'The Greek wording is unusual: literally, ''the brothers of Joseph were not willing to raise up the life of their brother.'' This appears to adapt the levirate-law language from the previous verse for moral analogy rather than strict legal citation.'
    reason: lexical_alternative
    anchor_ref: '3:8'
  - marker: c
    text: Some readers may take the spitting as a symbolic extension of the law-citation rather than a strictly historical detail; the Greek narrative, however, states it directly.
    reason: alternative_reading
    anchor_ref: '3:10'
translation:
  language: ko
  text: '6. 그런데 요셉이 나와 함께 울고 있는 것을 보고, 또 형제들이 그를 죽이려고 다가오는 것을 보자, 나는 뒤로 피하여 그를 도와주시기를 간구했습니다.[a]


    7. 그사이에 르우벤이 일어나 말했습니다. “형제들아, 그를 죽이지 말고, 우리 조상들이 팠으나 물을 얻지 못한 이 마른 구덩이들 가운데 하나에 그를 던지자.”


    8. 주께서 그 안에서 물이 솟아오르지 못하게 막으신 것은 바로 이 때문이니, 요셉이 보존되게 하려 하신 것이었습니다.


    9. 그들은 그를 이스마엘 사람들에게 팔 때까지 그렇게 했습니다.


    III. 1. 내 자녀들아, 나는 그 값에 한몫하지 않았습니다.


    2. 그러나 시므온과 단과 갓과 그들의 자녀들은 그 값을 받아 자기들과 자기 아내들과 자기 자녀들을 위해 신발을 샀습니다.


    3. 그들은 말했습니다. “우리는 그것을 먹지 않겠다. 그것은 우리 형제의 피 값이기 때문이다. 오히려 그것을 짓밟자. 그가 우리를 다스리겠다고 했으니, 그의 꿈이 무엇인지 보게 될 것이다.”


    4. 그러므로 모세의 율법서에 이렇게 기록되어 있습니다. “자기 형제를 위해 씨를 일으키기를 원하지 않는 사람은 그의 신발을 벗기고 그의 얼굴에 침을 뱉어야 한다.”[b]


    5. 요셉의 형제들은 자기 형제의 생명을 일으키기를 원하지 않았고,[c] 주께서는 그들이 자기 형제 요셉을 대적하여 신었던 신발을 벗기셨습니다.


    6. 그들이 이집트에 이르렀을 때, 요셉의 수행원들이 성문 밖에서 그들의 신발을 벗겼고, 그리하여 그들은 왕 바로의 예법에 따라 요셉에게 절했습니다.


    7. 그들은 요셉에게 절했을 뿐 아니라, 그 앞에 엎드리자마자 침을 맞았고 이집트 사람들에게 수치를 당했습니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문은 여기서 직역하면 ‘나는 내 뒤로 피하여’가 되는 ὄπισθεν μου를 읽습니다. 현전 문맥에서는 피신의 방향이 어색하게 남으므로, 번역은 ‘나는 뒤로 피하여’로 최소한으로 옮겼습니다.
    reason: textual_or_syntactic_difficulty
  - marker: b
    text: 신명기 25:5–10을 가리키는 인용입니다. 형제를 위해 후손을 세우는 일을 거절한 사람에게 신발을 벗기고 얼굴에 침을 뱉어 공개적으로 수치를 주는 규정이 배경입니다.
    reason: cross_reference
  - marker: c
    text: 그리스어는 직역하면 ‘그들의 형제의 생명을 일으키기를 원하지 않았다’입니다. 앞 절의 ‘씨를 일으키다’라는 레위혼인법의 표현을 윤리적 비유로 변형한 듯하므로, ‘씨’나 ‘후손’으로 평준화하지 않았습니다.
    reason: lexical_alternative
  - marker: d
    text: 침 뱉음은 앞선 율법 인용의 수치 모티프를 서사적으로 확장한 것으로 읽힐 수 있습니다. 그러나 그리스어 서술은 이를 직접 사건으로 진술합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  english_pob_choice: praying for help for him
  chosen_korean: 그를 위한 도움을 구하며 빌었습니다
  alternatives_korean:
  - 그에 대한 도움을 간구하며 빌었습니다
  - 그를 돕기 위한 도움을 구하며 기도했습니다
  lexicon: LSJ
  rationale: δεόμενος는 단순한 정보 전달보다 간청하는 행위를 나타내므로, ‘빌었습니다’와 ‘도움을 구하며’로 기도의 간구성을 살렸습니다.
- source_word: ξηρῶν λάκκων
  english_pob_choice: dry pits
  chosen_korean: 마른 구덩이들
  alternatives_korean:
  - 메마른 웅덩이들
  - 물이 없는 구덩이들
  lexicon: LSJ
  rationale: λάκκος는 여기서 물이 없는 파인 구덩이를 가리키므로 ‘구덩이’가 가장 직접적이며, ξηρῶν의 상태를 ‘마른’으로 간단히 옮겼습니다.
- source_word: τοῦ μὴ ἀναβλῦσαι ὕδωρ
  english_pob_choice: prevented water from springing up
  chosen_korean: 물이 솟아오르지 못하게 막으셨기 때문인데
  alternatives_korean:
  - 물이 솟구치지 못하게 하셨기 때문인데
  - 물이 흘러나오지 못하게 막으셨기 때문인데
  lexicon: LSJ
  rationale: ἀναβλῦσαι는 샘물처럼 ‘솟아오르다/솟구치다’는 뜻이므로, 하나님의 적극적 제지를 분명히 하면서도 자연스러운 한국어로 옮겼습니다.
- source_word: περιποίησις
  english_pob_choice: be preserved
  chosen_korean: 보존되게 하려 하신 것이었습니다
  alternatives_korean:
  - 보호되게 하려 하신 것이었습니다
  - 구원되게 하려 하신 것이었습니다
  lexicon: LSJ
  rationale: 문맥상 요셉을 구덩이에서 살아 남게 하시는 섭리를 가리키므로, ‘보존되게’가 과도한 신학적 확장 없이 목적을 잘 드러냅니다.
- source_word: ὑποδήματα
  english_pob_choice: sandals
  chosen_korean: 신발
  alternatives_korean:
  - 샌들
  - 발신
  lexicon: LSJ
  rationale: 법 인용의 상징물은 발에 신는 신이며, 한국어 성경 문맥에서는 ‘신발’이 가장 자연스럽습니다. 필요 이상으로 고대 문화색을 강요하지 않았습니다.
- source_word: ἀναστῆσαι σπέρμα
  english_pob_choice: raise up seed
  chosen_korean: 씨를 일으키기를
  alternatives_korean:
  - 씨를 세우기를
  - 자손을 일으키기를
  lexicon: LSJ
  rationale: 레위라트 법의 정형적 표현을 유지하기 위해 ‘씨를 일으키다’를 사용해 법적·성서적 어감을 보존했습니다.
- source_word: ζωὴν ἀδελφοῦ αὐτῶν
  english_pob_choice: the life of their brother
  chosen_korean: 자기 형제의 생명
  alternatives_korean:
  - 형제를 위한 생명
  - 형제의 삶
  lexicon: LSJ
  rationale: 본문은 앞선 ‘씨’ 공식과 결합된 변형 표현이지만, 현재 그리스어 표면형을 투명하게 살리기 위해 ‘생명’으로 옮겼습니다.
theological_decisions:
- issue: 주님의 주도적 개입과 요셉 보존
  chosen_reading: 주께서 물이 솟아오르지 못하게 막으셨고, 그 목적은 요셉이 보존되게 하려는 것이었습니다.
  alternative_readings:
  - 단지 구덩이가 우연히 마른 것으로 볼 수 있습니다.
  - 더 약하게 ‘살려 두시려는 뜻’ 정도로 완화할 수 있습니다.
  rationale: 그리스어는 주어를 분명히 ‘주’로 두고 목적절로 의도를 밝히므로, 하나님의 적극적 개입을 약화하지 않고 그대로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Preserve source-text plain sense over tradition inertia
- issue: 신발 벗김과 침 뱉음의 율법적 수치 모티프
  chosen_reading: 디모음의 법적 수치 표지를 요셉 이야기의 형제들에게 직접 적용해, 상징과 서술을 모두 유지했습니다.
  alternative_readings:
  - 법 인용만 하고 실제 서술의 수치 장면은 부드럽게 처리할 수 있습니다.
  - ‘신발’과 ‘침 뱉음’을 일반적 모욕으로 완화할 수 있습니다.
  rationale: 이 단락은 신명기 25장의 수치 장면을 의도적으로 불러와 요셉의 배신을 고발하므로, 불편한 표현도 완화하지 않고 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
