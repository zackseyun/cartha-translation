  verdict: revise
  source_fidelity: 현 초안은 2:6의 주어·관계가 어색하게 뒤엉켜 있으며, 직접화법의 범위가 이후의 서술까지 잘못 이어집니다. 또한 3:6의 ‘왕 바로의 예법에 따라’와 3:7의 ‘절했을 뿐 아니라’가 그리스어를 더 정확히 반영하도록 고쳤습니다. 2:6의 ὄπισθεν μου는 현전 문맥에서 해석상 난점이 있으므로, 본문에서는 ‘뒤로 피하여’로 최소한으로 옮기고 주석에서 그 난점을 밝혔습니다.
  naturalness: ‘전혀 함께하지 않았습니다’, ‘그들만 … 아니라’ 등 비자연적 표현을 현대 한국어 합쇼체에 맞게 ‘한몫하지 않았습니다’, ‘절했을 뿐 아니라’로 다듬었습니다. 인용부호는 실제 발화(2:7, 3:3, 3:4)에만 적용했습니다.
  terminology: λάκκος는 ‘구덩이’, ὑποδήματα는 본문의 율법적 상징성을 살려 ‘신발’, ἀναστῆσαι σπέρμα는 관용적·성서적인 ‘씨를 일으키다’로 유지했습니다. ζωὴν ἀδελφοῦ αὐτῶν의 비정형적 표현은 ‘형제의 생명을 일으키다’로 직역적 긴장을 보존했습니다.
  issues:
  - severity: high
    issue: 2:6의 문장이 ‘요셉이 자기와 함께 울고 있는 저와’라고 되어 있어 수식 관계와 화자가 붕괴되어 있습니다.
    rationale: 그리스어는 화자 ‘나’가 요셉이 자신과 함께 우는 것을 보고, 형제들이 요셉을 죽이러 오는 것을 보는 장면입니다.
  - severity: high
    issue: 2:7에서 시작한 직접 인용이 3:7까지 닫히지 않아, 서술과 여러 별도 발화가 모두 르우벤의 말처럼 처리되어 있습니다.
    rationale: 르우벤의 발화는 2:7에서 끝나며, 3:3의 ‘그들은 말했습니다’와 3:4의 율법 인용은 각각 별도의 인용입니다.
  - severity: medium
    issue: 3:6의 ‘왕 바로 앞에 있는 자들의 방식대로’는 κατὰ τὸν τύπον βασιλέως Φαραώ를 부정확하게 확장합니다.
    rationale: 본문은 ‘왕 바로의 예법/방식에 따라’라는 비교를 말합니다.
  - severity: medium
    issue: 3:7의 ‘그들만 요셉에게 절한 것이 아니라’는 ‘not only’의 한국어 표현으로 부자연스럽고 의미가 달라집니다.
    rationale: οὐ μόνον ... ἀλλὰ καί는 ‘그들은 … 절했을 뿐 아니라 …’로 옮겨야 합니다.
  - severity: low
    issue: 2:6의 ὄπισθεν μου(직역하면 ‘내 뒤로’)는 현전 문맥에서 화자의 피신 방향을 불명료하게 합니다.
    rationale: 번역문에서 방향 부사 ‘뒤로’를 보존하고, 본문을 임의로 ‘그 뒤로’로 정정하지 않도록 주석으로 텍스트상 난점을 알립니다.
