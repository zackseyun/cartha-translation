revisions:
- from: '6. 그런데 요셉이 자기와 함께 울고 있는 저와 형제들이 그를 죽이려고 다가오는 것을 보고, 그 뒤로 도망하여 그를 위한 도움을 구하며 빌었습니다.


    7. 그사이에 르우벤이 일어나 말했습니다. 「형제들아, 그를 죽이지 말고, 우리 조상들이 팠으나 물을 찾지 못한 이 마른 구덩이들 가운데 하나에 그를 던지자.


    8. 이는 주께서 그 안에서 물이 솟아오르지 못하게 막으셨기 때문인데, 그것은 요셉이 보존되게 하려 하신 것이었습니다.


    9. 그들은 그렇게 했고, 마침내 그를 이스마엘 사람들에게 팔았습니다.


    III. 그 값에 대해서는, 내 자녀들아, 나는 전혀 함께하지 않았습니다.


    2. 그러나 시므온과 단과 갓과 그들의 자녀들은 그의 값을 가지고 자기들과 자기 아내들과 자기 자녀들을 위해 신발을 샀습니다.


    3. 그들은 말했습니다. 「우리는 그것을 먹지 않겠다. 그것은 우리 형의 피 값이기 때문이다. 오히려 그것을 짓밟자. 그가 우리 위에 왕이 되겠다고 했기 때문이다. 그러면 그의 꿈이 무엇인지 보게 될 것이다.


    4. 그러므로 모세의 율법 기록에 이렇게 기록되어 있습니다. ‘자기 형제를 위해 씨를 일으키기를 원하지 않는 사람은 그의 신발을 벗겨야 하며, 그의 얼굴에 침을 뱉어야 한다.’


    5. 요셉의 형제들은 자기 형제의 생명을 일으키기를 원하지 않았고, 주께서는 그들이 요셉 자기 형제에게 신었던 신발을 벗기셨습니다.


    6. 또한 그들이 이집트에 왔을 때, 요셉의 종들이 성문 밖에서 그들의 신발을 벗겼고, 그리하여 그들은 왕 바로 앞에 있는 자들의 방식대로 요셉에게 절했습니다.


    7. 그들만 요셉에게 절한 것이 아니라, 곧 그 앞에 엎드리자마자 침도 맞았으며, 이집트 사람들에게 수치를 당했습니다。」[a][b][c]'
  to: '6. 그런데 요셉이 나와 함께 울고 있는 것을 보고, 또 형제들이 그를 죽이려고 다가오는 것을 보자, 나는 뒤로 피하여 그를 도와주시기를 간구했습니다.[a]


    7. 그사이에 르우벤이 일어나 말했습니다. “형제들아, 그를 죽이지 말고, 우리 조상들이 팠으나 물을 얻지 못한 이 마른 구덩이들 가운데 하나에 그를 던지자.”


    8. 주께서 그 안에서 물이 솟아오르지 못하게 막으신 것은 바로 이 때문이니, 요셉이 보존되게 하려 하신 것이었습니다.


    9. 그들은 그를 이스마엘 사람들에게 팔 때까지 그렇게 했습니다.


    III. 1. 내 자녀들아, 나는 그 값에 한몫하지 않았습니다.


    2. 그러나 시므온과 단과 갓과 그들의 자녀들은 그 값을 받아 자기들과 자기 아내들과 자기 자녀들을 위해 신발을 샀습니다.


    3. 그들은 말했습니다. “우리는 그것을 먹지 않겠다. 그것은 우리 형제의 피 값이기 때문이다. 오히려 그것을 짓밟자. 그가 우리를 다스리겠다고 했으니, 그의 꿈이 무엇인지 보게 될 것이다.”


    4. 그러므로 모세의 율법서에 이렇게 기록되어 있습니다. “자기 형제를 위해 씨를 일으키기를 원하지 않는 사람은 그의 신발을 벗기고 그의 얼굴에 침을 뱉어야 한다.”[b]


    5. 요셉의 형제들은 자기 형제의 생명을 일으키기를 원하지 않았고,[c] 주께서는 그들이 자기 형제 요셉을 대적하여 신었던 신발을 벗기셨습니다.


    6. 그들이 이집트에 이르렀을 때, 요셉의 수행원들이 성문 밖에서 그들의 신발을 벗겼고, 그리하여 그들은 왕 바로의 예법에 따라 요셉에게 절했습니다.


    7. 그들은 요셉에게 절했을 뿐 아니라, 그 앞에 엎드리자마자 침을 맞았고 이집트 사람들에게 수치를 당했습니다.[d]'
  rationale: 그리스어 본문을 우선하여 화자, 발화 경계, 비유적 율법 언어, 요셉의 형제들이 당하는 수치의 서술을 보존했습니다. 영어 감사본이 재분절한 번호와 달리, 제시된 그리스어의 2장 6–9절 및 3장 1–7절 구조를 유지했습니다. 신학적·법적 비유를 교리적으로 해소하거나 역사 서술을 완화하지 않았습니다.
