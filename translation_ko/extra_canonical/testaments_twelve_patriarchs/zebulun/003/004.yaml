lexical_decisions:
- source_word: Καὶ ἐποίησαν οὕτως
  english_pob_choice: And they did so
  chosen_korean: 그들은 … 그렇게 했습니다
  alternatives_korean:
  - 그리고 그들은 그렇게 했습니다
  - 그리하여 그들은 그렇게 했습니다
  lexicon: καί; ποιέω
  rationale: 연결과 행위 반복의 결과를 자연스러운 서술로 옮기되, 본문의 단순한 진행성을 유지했습니다.
- source_word: ἕως ὅτου
  english_pob_choice: until
  chosen_korean: …할 때까지
  alternatives_korean:
  - …까지
  - …할 때까지
  lexicon: ἕως ὅτου
  rationale: 행위가 특정 시점에 이르러 종료됨을 분명히 하는 표준적인 종속절로 옮겼습니다.
- source_word: ἐπώλησαν αὐτόν
  english_pob_choice: they sold him
  chosen_korean: 그를 팔았습니다
  alternatives_korean:
  - 그를 넘겼습니다
  - 그를 매각했습니다
  lexicon: πωλέω; αὐτός
  rationale: 본문의 직접적인 매매 행위를 그대로 살려 ‘팔았습니다’로 옮겼습니다.
- source_word: τοῖς Ἰσμαηλίταις
  english_pob_choice: to the Ishmaelites
  chosen_korean: 이스마엘 사람들에게
  alternatives_korean:
  - 이스마엘인들에게
  - 이스마엘 자손들에게
  lexicon: Ἰσμαηλίται
  rationale: 고유집단명은 현대 한국어에서 자연스럽고 이해 가능한 형태로 음역·의역하여, 문맥상 집단 수신자를 분명히 했습니다.
