  text: And the brothers of Joseph were not willing to preserve the life of their brother, and the Lord took from them the sandal that they wore against Joseph their brother.
translation:
  language: ko
  text: 요셉의 형제들은 자기들의 형제의 생명을 보존하려 하지 않았고, 주께서는 그들이 자기들의 형제 요셉을 향해 신던 신을 그들에게서 벗기셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἠθέλησαν ζωὴν ἀδελφοῦ αὐτῶν
  english_pob_choice: were not willing to preserve the life of their brother
  chosen_korean: 자기들의 형제의 생명을 보존하려 하지 않았고
  alternatives_korean:
  - 자기들의 형제의 생명을 살리려 하지 않았고
  - 형제의 생명을 지키려 하지 않았고
  lexicon: θέλω; ζωή
  rationale: ἠθέλησαν은 단순한 의지 부재를 넘는 거부를 나타내므로 ‘~하려 하지 않았다’로 옮겼고, ζωὴν은 POB의 해석을 따라 ‘생명’을 ‘보존하다’로 구체화했습니다.
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서는
  alternatives_korean:
  - 주님께서는
  - 주께서
  lexicon: κύριος
  rationale: 본문의 Κύριος는 하나님을 가리키므로, 한국어에서는 문맥상 자연스럽고 경외를 드러내는 ‘주께서는’으로 옮겼습니다.
- source_word: ὑπέλυσεν αὐτοὺς τὸ ὑπόδημα
  english_pob_choice: took from them the sandal
  chosen_korean: 그들이 자기들의 형제 요셉을 향해 신던 신을 그들에게서 벗기셨습니다
  alternatives_korean:
  - 그들이 신던 신을 그들에게서 벗기셨습니다
  - 그들이 요셉을 향해 신은 신을 그들에게서 벗기셨습니다
  lexicon: ὑπόδημα; ὑπολύω
  rationale: ὑπέλυσεν은 ‘벗기다/벗어 주다’의 동작을 나타내므로 ‘벗기셨습니다’로 살렸고, κατὰ Ἰωσὴφ는 단순한 소유가 아니라 ‘요셉을 향해’라는 대립적 방향성을 드러내도록 옮겼습니다.
- source_word: κατὰ Ἰωσὴφ τοῦ ἀδελφοῦ αὐτῶν
  english_pob_choice: against Joseph their brother
  chosen_korean: 자기들의 형제 요셉을 향해
  alternatives_korean:
  - 자기들의 형제 요셉을 대하여
  - 자기들의 형제 요셉을 거슬러
  lexicon: κατά + accusative
  rationale: κατά + 대격은 여기서 적대적 방향을 뜻하므로 ‘거슬러’가 가능하지만, 한국어 합쇼체 문맥에서는 상징적 적대 행위를 살리면서도 덜 관용적인 ‘향해’로 옮겼습니다.
theological_decisions:
- issue: 주체인 ‘주’의 표기와 경외체
  chosen_reading: Κύριος를 하나님을 가리키는 ‘주’로 읽고, 서술체는 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 옮기기
  - 일반 서술형으로 낮추기
  rationale: 본문의 주어가 신적 행위자이므로 ‘주’ 계열 번역을 유지하되, 한국어 독자에게 자연스러운 경외 표현을 적용했습니다.
  doctrine_reference: 신적 호칭의 번역 일관성
- issue: 형제들에 대한 적대의 강도
  chosen_reading: ‘against Joseph’의 적대성을 명시적으로 유지했습니다.
  alternative_readings:
  - 단순히 ‘요셉과 관련하여’로 완화하기
  - ‘요셉에게’로 일반화하기
  rationale: 문맥상 형제들의 행위는 중립적 관계가 아니라 요셉에 대한 적대 행위이므로, 원문의 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 본문의 서사적 윤리성 보존
