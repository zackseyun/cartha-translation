review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the brothers’ unwillingness to preserve their brother’s life and preserves the adversative force of κατά + accusative in relation to Joseph. Its rendering of ὑπέλυσεν … τὸ ὑπόδημα as removing footwear from them is defensible. However, the Korean phrasing for the footwear clause is unnecessarily awkward and repetitious.
  naturalness: '“자기들의 형제 요셉을 향해 신던 신” is not natural Korean: “향해 신다” does not idiomatically express hostile action, and “신던 신” is redundant. “요셉을 거슬러 신었던 신발” expresses the hostile orientation naturally while retaining the unusual footwear image.'
  terminology: “주께서는” appropriately renders Κύριος in formal-polite Korean. “생명을 보존하려 하지 않았고” is accurate and suitably formal. “신발” is a natural Korean equivalent for the singular ὑπόδημα in this context.
  issues:
  - severity: medium
    issue: The footwear clause is awkward and redundant.
    rationale: The expression “요셉을 향해 신던 신” is not idiomatic Korean and obscures the syntactic relationship of κατὰ Ἰωσὴφ to the act/image of wearing the sandal. Recasting it as “요셉을 거슬러 신었던 신발” preserves the adversative sense and reads naturally.
  - severity: low
    issue: The draft contains an undefined footnote anchor [a].
    rationale: No corresponding footnote is supplied. Removing the unsupported anchor resolves the dangling reference without affecting meaning.
  revised_text: 요셉의 형제들은 자기들의 형제의 생명을 보존하려 하지 않았고, 주께서는 그들이 자기들의 형제 요셉을 거슬러 신었던 신발을 그들에게서 벗기셨습니다.
