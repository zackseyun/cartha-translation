  text: 나는 그의 값에는 몫이 없었습니다, 내 자녀들아.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰς γὰρ τὸ τίμημα αὐτοῦ
  english_pob_choice: For I had no share in his price
  chosen_korean: 내가 그의 값에 참여하지 않았습니다
  alternatives_korean:
  - 나는 그의 값에 몫이 없었습니다
  - 나는 그의 값에 참여하지 않았습니다
  lexicon: τίμημα → 값, 대가
  rationale: τίμημα는 단순한 ‘값’ 또는 ‘대가’를 뜻하므로, 문맥을 따라 ‘값’으로 옮기되 ‘참여하다’로 소유·분담의 부재를 분명히 했습니다.
- source_word: ἐκοινώνησα
  english_pob_choice: had no share
  chosen_korean: 참여하지 않았습니다
  alternatives_korean:
  - 몫이 없었습니다
  - 나누지 않았습니다
  - 함께하지 않았습니다
  lexicon: κοινωνέω → 참여하다, 함께 나누다
  rationale: 동사의 핵심은 어떤 이익이나 몫에 ‘함께하지 않음’이므로, 수동적 부재보다 능동적 거절이 드러나는 ‘참여하지 않았습니다’가 적절합니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 자녀들
  - 자녀들아
  lexicon: τέκνα → 자녀들
  rationale: 직접 호칭이므로 한국어 관용에 맞게 ‘-아’ 호격을 살려, 문장의 종결을 부드럽게 유지했습니다.
