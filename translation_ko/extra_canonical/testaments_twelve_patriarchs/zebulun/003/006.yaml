reference: Testament of Zebulun 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. *Ἀλλὰ Συμεὼν² καὶ *ὁ Δὰν καὶ ὁ Γὰδ καὶ τὰ τέκνα αὐτῶν³, καὶ⁴ λαβόντες *τὴν τιμὴν αὐτοῦ⁵ ἐπρίαντο⁶ ὑποδήματα ἑαυτοῖς⁷ *καὶ ταῖς γυναιξὶν αὐτῶν⁸ Γκαὶ τοῖς τέκνοις αὐτῶν˥⁹, εἰπόντες· 3. *Οὐ φαγόμεθα αὐτήν¹⁰, ὅτι τιμὴ ἐστιν *αἵματος τοῦ ἀδελφοῦ ἡμῶν¹¹, ἀλλὰ καταπατήσει¹² καταπατήσωμεν¹³ αὐτήν, ἀνθ' ὧν εἶπεν βασιλεῦσαι¹⁴ ἐφ' ἡμᾶς¹⁵, καὶ ἴδωμεν¹⁶ τί ἐστι¹⁷ *τὰ ἐνύπνια¹⁸ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/006.yaml
  text: saying, “We will not eat it, because it is the price of our brother’s blood; rather, let us trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”
translation:
  language: ko
  text: “우리는 그것을 먹지 않을 것입니다. 그것은 우리 형제의 피값이기 때문입니다. 오히려 그것을 짓밟읍시다. 그가 우리를 다스리겠다고 말했기 때문입니다. 그리고 그의 꿈들이 어떤 것인지 봅시다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ φαγόμεθα αὐτήν
  english_pob_choice: We will not eat it
  chosen_korean: 우리는 그것을 먹지 않을 것입니다
  alternatives_korean:
  - 우리는 그것을 먹지 않겠습니다
  - 그것을 먹지 않을 것입니다
  lexicon: φαγόμεθα
  rationale: 부정 미래형을 자연스럽게 살리되, POB의 수정대로 ‘먹지 않을 것입니다’로 직접 대응해 대상 대명사 αὐτήν을 유지했습니다.
- source_word: καταπατήσει καταπατήσωμεν αὐτήν
  english_pob_choice: let us trample it underfoot
  chosen_korean: 그것을 짓밟읍시다
  alternatives_korean:
  - 우리가 그것을 짓밟겠습니다
  - 그것을 짓밟아 버립시다
  lexicon: καταπατέω
  rationale: 호르타토리 접속법의 권유·제안을 살려 명령형이 아닌 ‘-읍시다’로 옮겼고, καταπατέω의 강한 신체적 이미지는 ‘짓밟다’가 가장 직접적입니다.
- source_word: τιμὴ ἐστιν αἵματος τοῦ ἀδελφοῦ ἡμῶν
  english_pob_choice: it is the price of our brother’s blood
  chosen_korean: 그것은 우리 형제의 피의 대가이기 때문입니다
  alternatives_korean:
  - 그것은 우리 형제의 피값이기 때문입니다
  - 그것은 우리 형제의 피의 값이기 때문입니다
  lexicon: τιμή / αἷμα
  rationale: τιμή를 단순한 ‘값’보다 ‘대가’로 옮겨 피 흘림의 보상·상응 대가라는 문맥을 살렸고, αἵματος는 직역적으로 ‘피의’로 유지했습니다.
- source_word: βασιλεῦσαι ἐφ' ἡμᾶς
  english_pob_choice: he would reign over us
  chosen_korean: 그가 우리를 다스리겠다고
  alternatives_korean:
  - 그가 우리 위에 왕 노릇하겠다고
  - 그가 우리를 통치하겠다고
  lexicon: βασιλεύω
  rationale: 왕권적 지배를 뜻하는 βασιλεύω를 현대 독자가 이해하기 쉬운 ‘다스리다’로 옮기되, 과도한 교회적 어휘는 피했습니다.
- source_word: τὰ ἐνύπνια αὐτοῦ
  english_pob_choice: his dreams
  chosen_korean: 그의 꿈이 무엇인지
  alternatives_korean:
  - 그의 꿈들은 무엇인지
  - 그의 꿈들이 어떤 것인지
  lexicon: ἐνύπνιον
  rationale: 복수형을 살리되 한국어에서 자연스러운 간접의문 구조로 바꾸어 꿈의 내용에 대한 조롱 섞인 확인이라는 뉘앙스를 전달했습니다.
theological_decisions:
- issue: 형제의 피를 값으로 보는 표현의 윤리적·신학적 강도
  chosen_reading: ‘우리 형제의 피의 대가’로 직역해, 피 흘림이 단순한 살육이 아니라 책임을 요구하는 값비싼 죄라는 긴장을 유지했습니다.
  alternative_readings:
  - ‘우리 형제의 피값’으로 더 관용적으로 옮기는 방식
  - ‘우리 형제의 피에 대한 대가’로 풀어 쓰는 방식
  rationale: 본문의 τιμή-αἷμα 결합은 도덕적 비난을 약화시키지 않도록 강한 상응 대가의 의미를 드러내야 하므로, 완화된 표현보다 직설적 번역을 택했습니다.
  doctrine_reference: 죄와 책임, 형제 살해의 도덕적 중대성
- issue: ‘징밟읍시다’의 호르타토리 뉘앙스
  chosen_reading: 명령형이 아니라 공동 제안의 형태인 ‘-읍시다’를 사용했습니다.
  alternative_readings:
  - ‘우리가 짓밟겠습니다’
  - ‘짓밟으십시오’
  rationale: Greek hortatory subjunctive는 화자들이 함께 결의하는 장면이므로, 한국어에서도 공동 결의의 뉘앙스를 가장 잘 드러내는 합쇼체 권유형이 적절합니다.
  doctrine_reference: 담화 화용론 / 서술자의 집단 발화 재현
