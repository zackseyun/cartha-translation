  - severity: low
    issue: 복수형 τὰ ἐνύπνια가 단수처럼 처리됨
    rationale: 한국어에서 집합적으로 ‘꿈’이라고 할 수는 있으나, 원문의 복수를 자연스럽게 보존하려면 ‘그의 꿈들이 어떤 것인지’가 더 가깝습니다.
  - severity: low
    issue: 인용문 끝의 [a]에 대응하는 각주가 제공되지 않음
    rationale: 제공된 각주 세트와 translation_notes에 [a]의 내용이 없습니다. 검증 오류로 보고되지는 않았지만, 독자에게 내용 없는 앵커를 남기지 않도록 제거하는 것이 안전합니다.
