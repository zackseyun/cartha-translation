revisions:
- from: 그리고 그들은 그에게만 절한 것이 아니라, 즉시 그의 앞에 엎드려 침을 뱉었으며, 이집트인들 앞에서 수치를 당했습니다.[a]
  to: 그들은 그에게 절했을 뿐만 아니라, 그의 앞에 엎드리자마자 침을 맞았고, 이집트인들에게 수치를 당했습니다.
  rationale: 원문의 상관 구문을 ‘~했을 뿐만 아니라’로 바로잡고, 형태상 수동인 ἐνεπτύσθησαν을 수동으로 번역했습니다. παραχρῆμα와 πεσόντες의 관계는 ‘그의 앞에 엎드리자마자’로 자연스럽게 반영했으며, παρά + 속격의 행위자 용법도 보존했습니다. 대응 각주가 없는 [a] 표지는 삭제했습니다.
