  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Οὐ μόνον δὲ προσεκύνησαν αὐτῷ⁴² ἀλλὰ καὶ ἐνεπτύσθησαν⁴³ παραχρῆμα⁴⁴ πεσόντες ἔμπροσθεν αὐτοῦ, καὶ⁴⁵ ἠσχύνθησαν⁴⁶ παρὰ⁴⁷ τῶν⁴⁸ Αἰγυπτίων⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/010.yaml
  text: And not only did they bow down to him, but they also immediately fell before him and spat, and they were put to shame by the Egyptians.
translation:
  language: ko
  text: 그리고 그들은 그에게만 절한 것이 아니라, 즉시 그의 앞에 엎드려 침을 뱉었으며, 이집트인들 앞에서 수치를 당했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μόνον δὲ προσεκύνησαν αὐτῷ
  english_pob_choice: they bow down to him
  chosen_korean: 그에게만 절한 것이 아니라
  alternatives_korean:
  - 그에게 절한 것이 아니라
  - 그에게 경배한 것이 아니라
  lexicon: προσκυνέω
  rationale: 문맥상 단순한 몸의 굽힘을 넘어 존중/복종의 행위를 나타내므로 ‘절하다’를 택했습니다. ‘그에게만’은 οὐ μόνον δέ의 대조 구조를 자연스럽게 살립니다.
- source_word: ἐνεπτύσθησαν
  english_pob_choice: they spat
  chosen_korean: 침을 뱉었으며
  alternatives_korean:
  - 침을 뱉었고
  - 침을 뱉었습니다
  lexicon: ἐμπτύω
  rationale: 영문 POB의 수정 취지와 같이 수동이 아니라 능동적 행위인 ‘침을 뱉다’로 옮겼습니다.
- source_word: παραχρῆμα
  english_pob_choice: immediately
  chosen_korean: 즉시
  alternatives_korean:
  - 곧바로
  - 바로
  lexicon: παραχρῆμα
  rationale: 시간적 즉시성을 가장 간결하게 드러내는 표준어로 옮겼습니다.
- source_word: ἠσχύνθησαν παρὰ τῶν Αἰγυπτίων
  english_pob_choice: they were put to shame by the Egyptians
  chosen_korean: 이집트인들 앞에서 수치를 당했습니다
  alternatives_korean:
  - 이집트인들에게 수치를 당했습니다
  - 이집트인들로부터 부끄러움을 당했습니다
  lexicon: αἰσχύνομαι
  rationale: παρά + 인칭 주체를 단순 수동 원인보다 ‘~앞에서’라는 공개적 수치의 장면으로 살리는 편이 문맥에 더 잘 맞습니다.
theological_decisions:
- issue: ‘경배/절하다’의 강도
  chosen_reading: 예배적 숭배보다는 굴복과 모욕이 결합된 몸짓으로 이해해 ‘절하다’를 사용했습니다.
  alternative_readings:
  - 경배하다
  - 엎드려 절하다
  rationale: 이 장면은 존숭의 제스처와 함께 침 뱉음, 수치가 결합되어 있어 종교적 예배 행위로 과도하게 좁히지 않는 것이 좋습니다.
  doctrine_reference: 문맥 우선 원칙
