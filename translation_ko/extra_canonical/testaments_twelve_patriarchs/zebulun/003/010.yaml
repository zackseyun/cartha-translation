review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. οὐ μόνον … ἀλλὰ καί는 ‘그에게만’이라는 배타적 의미가 아니라 ‘그에게 절했을 뿐 아니라 …도’라는 첨가·대조 구문입니다. 또한 ἐνεπτύσθησαν은 ἐμπτύω의 부정과거 수동형이므로, 주어진 그리스어 본문에서는 ‘그들이 침을 뱉었다’가 아니라 ‘그들이 침을 맞았다/침 세례를 받았다’로 옮겨야 합니다. πεσόντες는 그들이 그의 앞에 엎드린 상황을 나타냅니다.
  naturalness: ‘그에게 절했을 뿐만 아니라, 그의 앞에 엎드리자마자 침을 맞았고’는 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 행동 순서와 즉시성을 명료하게 드러냅니다. 원안의 문장 끝에 내용 없는 [a] 표지가 붙어 있는 문제도 제거합니다.
  terminology: προσκυνέω는 이 문맥에서 예배적 의미로 한정하지 않고 ‘절하다’로 유지할 수 있습니다. αἰσχύνω의 수동형과 παρά + 속격은 행위 주체를 드러내므로 ‘이집트인들에게 수치를 당했습니다’가 ‘이집트인들 앞에서’보다 문법적으로 더 직접적입니다.
  issues:
  - severity: high
    issue: ‘그에게만’이 οὐ μόνον의 의미를 배타적으로 변경합니다.
    rationale: οὐ μόνον δέ … ἀλλὰ καί는 ‘~뿐만 아니라 ~도’라는 상관 구문이며, ‘오직 그에게’라는 의미의 μόνον이 아닙니다.
  - severity: high
    issue: ἐνεπτύσθησαν을 능동 ‘침을 뱉었으며’로 번역했습니다.
    rationale: 주어진 그리스어 형태는 부정과거 수동 직설법 3인칭 복수입니다. 영문 감사 이력의 능동 해석과 달리, 원어 본문 우선 원칙상 ‘침을 맞았다’로 옮겨야 합니다.
  - severity: medium
    issue: ‘이집트인들 앞에서’는 παρά + 속격의 행위 주체를 약화합니다.
    rationale: 수동 동사와 함께 쓰인 παρά + 속격은 통상 행위자/원인을 나타내므로 ‘이집트인들에게’가 더 충실합니다.
  - severity: low
    issue: 본문의 [a] 표지에 대응하는 각주가 제공되지 않았습니다.
    rationale: 내용 없는 각주 앵커는 제거하여 본문과 각주 구조를 일치시켜야 합니다.
  revised_text: 그들은 그에게 절했을 뿐만 아니라, 그의 앞에 엎드리자마자 침을 맞았고, 이집트인들에게 수치를 당했습니다.
