  text: 7. *Ἐν δὲ τῷ μεταξὺ ἀναστὰς³⁶ Ῥουβὴμ³⁷ εἶπεν³⁸. *Δεῦτε ἀδελφοί μου³⁹, μὴ ἀποκτείνωμεν αὐτὸν ἀλλὰ ῥίψωμεν⁴⁰ αὐτὸν εἰς ἕνα τῶν *ξηρῶν λάκκων⁴¹ τούτων⁴², ὧν ὤρυξαν οἱ πατέρες ἡμῶν, καὶ οὐχ εὗρον ὕδωρ⁴³.
