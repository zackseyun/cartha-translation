base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/002.yaml
  text: And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits, which our fathers dug and found no water.”
translation:
  language: ko
  text: 그리고 그 사이에 르우벤이 일어나 말했습니다. “자, 형제들이여, 우리가 그를 죽이지 말고 이 마른 구덩이들 가운데 하나에 그를 던져 넣읍시다. 이 구덩이들은 우리 조상들이 팠지만 물을 찾지 못한 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ μεταξὺ
  english_pob_choice: And in the meantime
  chosen_korean: 그리고 그 사이에
  alternatives_korean:
  - 그동안
  - 그 사이에
  lexicon: μεταξύ
  rationale: 시간의 경과를 자연스럽게 살리되, 서술 흐름을 해치지 않는 현대 한국어 표현으로 옮겼습니다.
- source_word: ἀναστὰς Ῥουβὴμ εἶπεν
  english_pob_choice: Reuben arose and said
  chosen_korean: 르우벤이 일어나 말했습니다
  alternatives_korean:
  - 르우벤이 일어나 말하였습니다
  - 르우벤이 일어나 이르렀습니다
  lexicon: ἀνίστημι / λέγω
  rationale: ‘일어나’는 즉각적인 동작을, ‘말했습니다’는 담화 도입을 그대로 살린 직역형입니다.
- source_word: μὴ ἀποκτείνωμεν αὐτὸν ἀλλὰ ῥίψωμεν αὐτὸν
  english_pob_choice: let us not kill him, but let us throw him
  chosen_korean: 우리가 그를 죽이지 말고, 그를 던져 넣읍시다
  alternatives_korean:
  - 우리가 그를 죽이지 말고 던집시다
  - 우리가 그를 죽이지 말고 내던집시다
  lexicon: ἀποκτείνω / ῥίπτω
  rationale: 두 동사 사이의 강한 대비를 유지하면서, ‘던져 넣다’로 뒤의 장소 목적어와 자연스럽게 결합되게 했습니다.
- source_word: εἰς ἕνα τῶν ξηρῶν λάκκων τούτων
  english_pob_choice: into one of these dry pits
  chosen_korean: 이 마른 웅덩이들 가운데 하나에
  alternatives_korean:
  - 이 메마른 구덩이들 가운데 하나에
  - 이 마른 구덩이들 중 하나에
  lexicon: ξηρός / λάκκος
  rationale: λάκκος의 구덩이·웅덩이 의미를 살리되, 한국어에서 더 자연스러운 지형적 이미지인 ‘웅덩이’로 옮겼습니다.
- source_word: ὧν ὤρυξαν οἱ πατέρες ἡμῶν, καὶ οὐχ εὗρον ὕδωρ
  english_pob_choice: which our fathers dug and found no water
  chosen_korean: 이 웅덩이들은 우리 조상들이 팠으나 물을 찾지 못한 곳입니다
  alternatives_korean:
  - 우리 조상들이 팠지만 물을 얻지 못한 곳입니다
  - 우리 조상들이 파 놓았으나 물이 없던 곳입니다
  lexicon: ὀρύσσω / εὑρίσκω / ὕδωρ
  rationale: 관계절의 의미를 분명히 하면서 ‘찾지 못한 물’이라는 원문의 부정 결과를 자연스럽게 풀어 주었습니다.
