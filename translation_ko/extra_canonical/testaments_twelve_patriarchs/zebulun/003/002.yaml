  source_fidelity: 원문의 시간 부사구, 르우벤의 발화 도입, 살해하지 말고 구덩이에 던지자는 대조적 청유, 그리고 조상들이 팠으나 물을 찾지 못했다는 관계절을 대체로 충실히 옮겼습니다. 다만 현 번역은 관계절을 ‘이 웅덩이들은 … 곳입니다’라는 독립 문장으로 바꾸어, ‘하나의 구덩이’를 수식하는 원문의 구조와 지시를 다소 흐립니다.
  naturalness: ‘오라, 내 형제들이여’는 현대 표준 한국어 합쇼체의 직접 발화로는 다소 고풍스럽고, ‘내’는 원문에 없는 소유 표현입니다. ‘자, 형제들이여’가 자연스럽고 원문의 권유를 잘 보존합니다. ‘웅덩이’보다 ‘구덩이’가 λάκκος 및 물을 얻으려 판 시설이라는 문맥에 더 직접적입니다.
  terminology: 르우벤은 통용 표기이며, ‘조상들’, ‘물’, ‘구덩이’도 적절합니다. 신학적 용어 문제는 없습니다.
