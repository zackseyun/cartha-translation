  text: 8. Διὰ γὰρ τοῦτο ἐκώλυσε ὁ⁴⁴ Κύριος *τοῦ μὴ ἀναβλῦσαι ὕδωρ⁴⁵ ἐν αὐτοῖς ἵνα *γένηται περιποίησις τῷ⁴⁶ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/003.yaml
  text: For this reason the Lord prevented water from springing up in them, so that provision might be made for Joseph, his brother.
translation:
  language: ko
  text: 그러므로 주님께서는 그들 가운데서 물이 솟아나지 못하게 막으셨습니다. 그리하여 요셉을 위한 조처가 마련되게 하시려고 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 이 문맥의 κύριος는 직접적인 여호와 인용 표지가 아니라 서사적 주어이므로, 한국어에서는 문맥상 자연스러운 '주님'으로 옮겼습니다.
- source_word: ἐκώλυσε ... τοῦ μὴ ἀναβλῦσαι ὕδωρ
  english_pob_choice: prevented water from springing up
  chosen_korean: 물이 솟아오르지 못하게 막으셨습니다
  alternatives_korean:
  - 물이 솟구치지 못하게 하셨습니다
  - 물이 나오지 못하게 막으셨습니다
  lexicon: κωλύω + ἀναβλύζω ὕδωρ
  rationale: 방해·저지를 뜻하는 ἐκώλυσε와 샘솟다/솟아오르다의 ἀναβλύζω를 함께 살려, 물의 분출이 차단되었다는 의미를 직접적으로 표현했습니다.
- source_word: ἵνα γένηται περιποίησις τῷ Ἰωσήφ
  english_pob_choice: so that provision might be made for Joseph, his brother
  chosen_korean: 그리하여 요셉을 위해 마련이 있게 하려 하셨습니다
  alternatives_korean:
  - 그리하여 요셉에게 보존이 있게 하려 하셨습니다
  - 그리하여 요셉을 위해 보호가 있게 하려 하셨습니다
  lexicon: γίνομαι + περιποίησις
  rationale: revision trail의 'provision might be made'를 따라 περιποίησις를 '마련'으로 옮겨, 보존보다 준비·공급의 뉘앙스를 살렸습니다.
- source_word: τῷ Ἰωσήφ
  english_pob_choice: for Joseph, his brother
  chosen_korean: 요셉을 위해
  alternatives_korean:
  - 그의 형제 요셉을 위해
  - 요셉, 그의 형제를 위해
  lexicon: dative reference
  rationale: 본문의 남아 있는 데이터가 τῷ Ἰωσήφ만 분명히 제시하므로, 한국어 본문에는 무리한 삽입 없이 자연스럽게 옮기고, 혈연 설명은 본문 과잉해석을 피했습니다.
theological_decisions:
- issue: 목적절의 신적 통제와 인간 유익의 연결
  chosen_reading: 주님께서 물의 분출을 막으신 목적을 요셉을 위한 마련으로 직접 연결해 옮겼습니다.
  alternative_readings:
  - 주님이 단지 자연현상을 허용하지 않으셨다는 완곡한 표현
  - 요셉이 보존되도록 하셨다는 식의 해석
  rationale: ἵνα + subjunctive는 목적을 분명히 나타내므로, 원문의 인과·목적 구조를 약화시키지 않고 보존했습니다.
  doctrine_reference: 섭리와 목적적 행위
