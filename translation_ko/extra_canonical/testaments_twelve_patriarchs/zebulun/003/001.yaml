  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/001.yaml
  text: And when Joseph saw me weeping with him, and the brothers coming on to kill him, he took refuge behind me, begging me for help on his behalf.
translation:
  language: ko
  text: 그러자 요셉은 내가 요셉과 함께 울고 있는 것을 보고, 형제들이 그를 죽이려고 다가오는 것을 보자, 내 뒤로 피신하여 그를 도와 달라고 내게 간청했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ Ἰωσὴφ
  english_pob_choice: And when Joseph saw me
  chosen_korean: 그런데 요셉이 나를 보고
  alternatives_korean:
  - 그리고 요셉이 나를 보고
  - 요셉이 나를 보았을 때
  lexicon: ἰδών
  rationale: 분사 구조를 한국어로 자연스럽게 풀면서도, 앞뒤 사건의 전환을 나타내는 δὲ를 ‘그런데’로 살렸습니다.
- source_word: συνκλαίοντά μοι αὐτῷ
  english_pob_choice: weeping with him
  chosen_korean: 나와 함께 울고 있는
  alternatives_korean:
  - 그와 함께 울고 있는
  - 함께 울고 있는
  lexicon: συνκλαίω
  rationale: 동반적 의미를 살려 ‘나와 함께’로 옮기되, 문맥상 누가 누구와 우는지의 관계가 분명하도록 했습니다.
- source_word: τοὺς ἀδελφοὺς ἐπερχομένους ἀνελεῖν αὐτόν
  english_pob_choice: the brothers coming on to kill him
  chosen_korean: 형제들이 그를 죽이러 다가오는 것을
  alternatives_korean:
  - 형제들이 그를 죽이러 오는 것을
  - 형제들이 와서 그를 죽이려는 것을
  lexicon: ἐπερχομένους / ἀνελεῖν
  rationale: ἐπερχομένους의 ‘다가오다’와 ἀνελεῖν의 ‘죽이다’를 직접적으로 반영해, 서술의 긴박함을 유지했습니다.
- source_word: κατέφυγον ὄπισθεν μου
  english_pob_choice: he took refuge behind me
  chosen_korean: 저 뒤로 피신하여
  alternatives_korean:
  - 제 뒤로 피신하여
  - 저의 뒤로 달아나 피신하여
  lexicon: καταφεύγω / ὄπισθεν
  rationale: ‘피신하다’로 보호를 구하는 동작을 살리고, ὄπισθεν을 공간적으로 ‘뒤로’로 옮겼습니다.
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  english_pob_choice: begging me for help on his behalf
  chosen_korean: 그를 위한 도움을 청했습니다
  alternatives_korean:
  - 그를 위한 도움을 간청했습니다
  - 그에게 줄 도움을 부탁했습니다
  lexicon: δέομαι / βοήθεια
  rationale: δεόμενος의 간청성을 반영하되, 한국어 문장 흐름상 ‘도움을 청했습니다’로 간결하게 정리했습니다.
theological_decisions:
- issue: 서술자의 행위와 요셉의 의존적 피신 관계
  chosen_reading: 요셉이 형제들의 위협 앞에서 화자를 뒤로 의지하며 도움을 구하는 장면으로 옮겼습니다.
  alternative_readings:
  - 단순한 정보 전달로만 옮기는 방식
  - ‘도피’보다 약한 ‘숨다’로 완화하는 방식
  rationale: 본문은 요셉의 급박한 위기와 화자에게 기대는 의존을 강조하므로, 이를 약화시키지 않도록 보존했습니다.
  doctrine_reference: source fidelity / narrative force
