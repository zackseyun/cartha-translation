revisions:
- from: 그런데 요셉이 나와 함께 울고 있는 저를 보고, 형제들이 그를 죽이러 다가오는 것을 보자, 저 뒤로 피신하여 그를 위한 도움을 청했습니다.
  to: 그러자 요셉은 내가 요셉과 함께 울고 있는 것을 보고, 형제들이 그를 죽이려고 다가오는 것을 보자, 내 뒤로 피신하여 그를 도와 달라고 내게 간청했습니다.
  rationale: 그리스어의 분사 연쇄를 한국어의 ‘보고 … 보자’ 구조로 유지했습니다. ‘내가 요셉과 함께’로 συνκλαίοντά μοι αὐτῷ의 동반 관계를 명확히 하고, ‘내 뒤로 피신하여’로 ὄπισθεν μου를 반영했습니다. 마지막에는 도움의 대상이 요셉임과 청원의 상대가 화자임을 밝혀 원문의 관계를 보존했습니다.
  reviewer_model: gpt-5.6-terra
