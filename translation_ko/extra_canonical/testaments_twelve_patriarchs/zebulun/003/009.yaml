  source_fidelity: 핵심 서술은 대체로 반영했으나, 수동태 ὑπελύθησαν(‘신을 벗김을 당했다’)를 ‘그들의 샌들을 벗기게 했고’로 옮기면 그들이 하인들에게 벗기도록 시킨 것처럼 주체·사역 관계가 바뀝니다. 또한 κατὰ τὸν τύπον βασιλέως Φαραώ에는 ‘앞에서’에 해당하는 명시적 전치사가 없으므로, ‘바로 앞에서 하는 방식’보다 왕 바로의 예법/방식을 나타내는 표현이 원문에 가깝습니다.
  naturalness: ‘샌들을 벗기게 했고’는 한국어에서도 어색하고 의미가 사역으로 읽힙니다. ‘신발을 벗겨 주었고’와 ‘바로 왕의 예법에 따라’가 자연스러운 현대 표준어 합쇼체입니다.
  terminology: παῖδες는 문맥상 요셉을 수행하거나 시중드는 이들이므로 ‘하인들’은 허용됩니다. προσκυνέω는 여기서 예배 행위로 한정하지 않고 ‘절하다’로 옮기는 것이 적절합니다. Φαραώ는 고유 칭호를 드러내도록 ‘바로 왕’으로 표기했습니다.
