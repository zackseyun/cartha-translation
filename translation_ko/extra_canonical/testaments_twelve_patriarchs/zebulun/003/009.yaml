base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/009.yaml
  text: For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner before King Pharaoh.
translation:
  language: ko
  text: 그리고 그들이 이집트에 이르렀을 때, 요셉의 하인들이 문 밖에서 그들의 샌들을 벗기게 했고, 그렇게 해서 그들은 바로 앞에서 하는 방식대로 요셉에게 절했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπελύθησαν ὑπὸ τῶν παίδων Ἰωσὴφ
  english_pob_choice: they had their sandals removed by the attendants of Joseph
  chosen_korean: 그들의 샌들을 벗기게 했고
  alternatives_korean:
  - 신을 벗겼고
  - 샌들을 풀어 주었고
  lexicon: ὑπολύω
  rationale: 문맥상 발의 신을 벗기는 동작을 가리키므로, 현대 한국어로 자연스러운 ‘샌들을 벗기다’로 옮겼습니다. παίδες는 단순한 ‘종들’보다 수행 인력의 뉘앙스가 있어 ‘하인들’로 처리했습니다.
- source_word: ἔξωθεν τοῦ πυλῶνος
  english_pob_choice: outside the gate
  chosen_korean: 문 밖에서
  alternatives_korean:
  - 성문 밖에서
  - 대문 밖에서
  lexicon: ἔξωθεν / πύλων
  rationale: 장소 대비를 분명히 하면서도 과도하게 장식적이지 않게 ‘문 밖에서’로 옮겼습니다. 여기서 πυλών은 출입구/문을 가리키므로 자연스러운 표준어 표현을 택했습니다.
- source_word: κατὰ τὸν τύπον βασιλέως Φαραώ
  english_pob_choice: in the manner before King Pharaoh
  chosen_korean: 바로 앞에서 하는 방식대로
  alternatives_korean:
  - 바로 왕 앞에서의 형식대로
  - 파라오 왕 앞에서의 관례대로
  lexicon: κατά + τύπος
  rationale: τύπος는 단순한 외형적 ‘형식’보다 모범/양식을 가리킬 수 있으나, 여기서는 요셉 앞에서의 절하는 예법을 파라오 앞의 예법과 대응시키는 뜻이므로 ‘하는 방식대로’로 풀었습니다. 영어 POB의 수정 취지에 맞춰 ‘before King Pharaoh’를 반영했습니다.
- source_word: προσεκύνησαν τῷ Ἰωσὴφ
  english_pob_choice: they bowed down to Joseph
  chosen_korean: 그들은 … 요셉에게 절했습니다
  alternatives_korean:
  - 요셉에게 엎드려 절했습니다
  - 요셉 앞에 절했습니다
  lexicon: προσκυνέω
  rationale: 예배적 숭배까지는 아니지만 깊은 경의의 몸짓을 나타내므로, 한국어 성경에서 널리 쓰이면서도 지나치게 종교화하지 않는 ‘절하다’를 선택했습니다.
theological_decisions:
- issue: παίδες Ἰωσὴφ의 사회적 뉘앙스
  chosen_reading: 요셉의 하인들
  alternative_readings:
  - 요셉의 종들
  - 요셉의 시종들
  rationale: 이 본문은 신분적 예속보다 수행하는 일행/시중드는 자들의 기능을 강조하므로, 본문 의미를 과도하게 사회사적으로 확장하지 않는 범위에서 ‘하인들’로 옮겼습니다.
  doctrine_reference: 서사 맥락에 따른 사회적 역할 번역
- issue: κατὰ τὸν τύπον βασιλέως Φαραώ의 비교 구문
  chosen_reading: 바로 앞에서 하는 방식대로
  alternative_readings:
  - 바로 왕 앞의 관례대로
  - 파라오의 예법대로
  rationale: 구문은 요셉에 대한 예를 바로에 대한 예와 대응시키는 비교이므로, ‘형식’보다 행위의 방식과 예법을 드러내는 번역이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 서사적 예법 비교
