source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. Διὰ τοῦτο οὖν¹⁹ ἐν γραφῇ *νόμου Μωσέως γέγραπται²⁰· Τὸν μὴ θέλοντα *ἀναστῆσαι σπέρμα²¹ τῷ ἀδελφῷ αὐτοῦ ὑπολύεσθαι²² τὸ ὑπόδημα αὐτοῦ²³ καὶ ἐμπτύεσθαι εἰς τὸ πρόσωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/007.yaml
  text: 'Therefore it is written in the book of the law of Moses: “The one who does not want to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”'
translation:
  language: ko
  text: 그러므로 모세의 율법서에 이렇게 기록되어 있습니다. “자기 형제를 위해 후손을 세워 주려 하지 않는 자는 그의 신발이 벗겨지고, 그의 얼굴에 침을 맞을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γραφῇ νόμου Μωσέως
  english_pob_choice: in the book of the law of Moses
  chosen_korean: 모세의 율법 책에
  alternatives_korean:
  - 모세의 율법 기록에
  - 모세 율법서에
  lexicon: γραφή / νόμος Μωσέως
  rationale: γραφή는 여기서 단순한 ‘기록’보다 권위 있는 ‘책/문서’의 의미가 분명하므로, POB의 'book'을 따라 ‘율법 책’으로 옮겼습니다.
- source_word: ἀναστῆσαι σπέρμα
  english_pob_choice: to raise up seed
  chosen_korean: 씨를 일으켜 주려
  alternatives_korean:
  - 후손을 세워 주려
  - 씨를 세우려
  lexicon: σπέρμα
  rationale: 직역에 가까운 ‘씨’를 유지해 혈통 계승의 법적·가문적 의미를 보존했고, 동작은 자연스러운 한국어로 ‘일으켜 주다’로 풀었습니다.
- source_word: ὑπολύεσθαι τὸ ὑπόδημα αὐτοῦ
  english_pob_choice: his sandal shall be removed
  chosen_korean: 그의 샌들은 벗겨지고
  alternatives_korean:
  - 그의 신발은 벗겨지고
  - 그의 샌들이 벗겨지고
  lexicon: ὑπόδημα
  rationale: ὑπόδημα는 일반적 ‘신발’보다 ‘샌들’이 더 직접적이며, 수동형을 한국어 자연문으로 옮겨 처벌 행위를 분명히 했습니다.
- source_word: ἐμπτύεσθαι εἰς τὸ πρόσωπον
  english_pob_choice: they shall spit in his face
  chosen_korean: 사람들은 그의 얼굴에 침을 뱉을 것입니다
  alternatives_korean:
  - 그의 얼굴에 침을 뱉을 것입니다
  - 그에게 침을 뱉을 것입니다
  lexicon: πρόσωπον
  rationale: πρόσωπον을 직역해 ‘얼굴’로 두어 공개적 수치의 장면을 보존했고, 수동/무인칭적 표현을 한국어의 일반 주어로 정리했습니다.
theological_decisions:
- issue: 복수형 ‘사람들은’의 처리
  chosen_reading: 무인칭적 수동 표현을 한국어에서는 일반적 행위 주어로 풀어 ‘사람들은’으로 옮겼습니다.
  alternative_readings:
  - 그들은 침을 뱉을 것입니다
  - 그에게 침을 뱉게 될 것입니다
  rationale: 원문은 행위자를 강조하지 않고 수치 의례의 결과를 말하므로, 주체를 특정하지 않되 한국어 문장을 자연스럽게 만들기 위해 일반 주어를 사용했습니다.
  doctrine_reference: 문헌학적 서술의 재현
- issue: ‘씨’의 유지
  chosen_reading: 후손 의미를 전달하되 전통적 법률 관용어인 ‘씨’를 보존했습니다.
  alternative_readings:
  - 후손
  - 자손
  rationale: 이 구절은 계대결혼/혈통 계승의 법적 표현이므로, 한국 교회어의 익숙한 ‘자손’보다 원문의 법률적·관용적 뉘앙스를 살리는 ‘씨’가 더 적합합니다.
  doctrine_reference: 계대계승 전통(신명기 25장 맥락)
