    rationale: 이 표현은 형제를 위한 후계·후손 계승을 가리키므로 ‘형제를 위해 후손을 세워 주다’가 뜻을 더 명료하게 전달합니다.
  - severity: low
    issue: 본문 끝의 [a] 표지에 대응하는 각주가 제공되어 있지 않습니다.
