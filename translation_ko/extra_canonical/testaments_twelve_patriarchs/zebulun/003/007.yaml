    issue: ‘사람들은’이 원문에 없는 행위 주체를 보충합니다.
    rationale: 그리스어는 신발을 벗기고 얼굴에 침을 뱉는 행위를 수동/비인칭적으로 제시합니다. 한국어도 ‘침을 맞을 것입니다’로 처리하면 행위자의 비특정성을 보존할 수 있습니다.
  - severity: low
