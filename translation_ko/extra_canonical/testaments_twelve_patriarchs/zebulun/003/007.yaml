  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ὑπολύεσθαι와 ἐμπτύεσθαι는 행위자를 밝히지 않는 수동/비인칭적 표현이므로, ‘사람들은’이라고 주어를 보충하기보다 수동 표현을 유지하는 편이 원문에 더 가깝습니다. ἀναστῆσαι σπέρμα는 계대의 맥락에서 ‘형제를 위해 후손을 세우다’라는 관용적 뜻이므로, 한국어에서는 이를 명료하게 옮기는 것이 적절합니다.
  naturalness: ‘모세의 율법 책’과 ‘씨를 일으켜 주다’는 다소 직역투입니다. ‘모세의 율법서’와 ‘형제를 위해 후손을 세우다’가 현대 표준 한국어의 문장 흐름과 법적·가문적 맥락에 더 자연스럽습니다. ‘침을 맞을 것입니다’는 행위자 미지정의 원문을 자연스럽게 재현합니다.
  terminology: ‘율법서’는 γραφή νόμου Μωσέως의 권위 있는 문서라는 뜻을 자연스럽게 전달합니다. σπέρμα의 비유적 법률 용례는 ‘후손’으로 옮기되, 그 계대 의미를 보존합니다. ὑπόδημα는 문맥상 ‘신발’이 자연스럽고 충분히 정확합니다.
  issues:
