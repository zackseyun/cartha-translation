theological_decisions:
- issue: 요셉에 대한 잘못을 ‘무지로’ 제한하는 표현
  chosen_reading: ‘무지로 저지른 잘못’으로 옮겨, 의도적 악이 아니라 알지 못한 채 범한 책임이라는 긴장을 유지했습니다.
  alternative_readings:
  - ‘실수로 저지른 잘못’
  - ‘몰라서 한 잘못’
  rationale: 본문은 무죄 주장과 책임 인정을 함께 담고 있으므로, 전면적 면책으로 흐르지 않도록 ‘무지로’의 뉘앙스를 보존했습니다.
  doctrine_reference: 죄의 의도성과 무지에 따른 책임의 구별
