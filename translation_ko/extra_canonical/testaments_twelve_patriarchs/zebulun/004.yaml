theological_decisions:
- issue: 르우벤의 금식과 애도 표현
  chosen_reading: ‘사흘 낮과 사흘 밤’과 ‘금식한 채 팔렸습니다’를 그대로 살려, 사건의 비극성과 윤리적 무게를 약화시키지 않았습니다.
  alternative_readings:
  - ‘사흘 동안’으로 완화
  - ‘먹지 않은 채’로 일반화
  rationale: 원문은 시간의 길이와 금식의 상태를 함께 제시하므로, 둘을 모두 보존해야 서사의 긴장이 유지됩니다.
  doctrine_reference: 본문의 서사적 사실성과 정서적 강도를 보존
