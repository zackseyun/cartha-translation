  text: And I fastened a piece of wood behind it, and
translation:
  language: ko
  text: 그리고 나는 그 뒤에 나무 한 토막을 매달았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθῆκα
  english_pob_choice: I fastened
  chosen_korean: 나는 ... 매달았습니다
  alternatives_korean:
  - 나는 ... 고정했습니다
  - 나는 ... 달아맸습니다
  lexicon: καθῆκα
  rationale: 동사는 ‘내려매다/매달다’의 동작을 직접적으로 나타내므로, 단순한 일반 동사보다 공간적·행동적 이미지를 살리는 ‘매달았습니다’가 원문의 감각을 잘 반영합니다.
- source_word: ξύλον
  english_pob_choice: a piece of wood
  chosen_korean: 나무 한 토막
  alternatives_korean:
  - 나무 조각
  - 나무 한 조각
  lexicon: ξύλον
  rationale: ξύλον은 일반적으로 ‘나무/목재’ 계열의 물질명사이므로, 영어의 a piece of wood를 따라 구체성을 살린 ‘나무 한 토막’으로 옮겼습니다.
- source_word: ὄπισθεν αὐτοῦ
  english_pob_choice: behind him
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그의 뒤에
  - 그 뒤편에
  lexicon: ὄπισθεν αὐτοῦ
  rationale: 방향 부사구를 자연스러운 한국어로 옮기되, 대명사 αὐτοῦ의 인칭을 유지해 대상이 사람임을 드러내는 ‘그 뒤에’로 처리했습니다.
- source_word: καί
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리고 또
  lexicon: καί
  rationale: 문장 말미의 접속사로, 다음 절로 이어지는 연결성을 보존하기 위해 ‘그리고’로 옮겼습니다.
theological_decisions:
- issue: 대상 지시가 사물인지 인물인지
  chosen_reading: αὐτοῦ를 따라 ‘그 뒤에’로 옮겨 대상이 사람임을 분명히 했습니다.
  alternative_readings:
  - 그것 뒤에
  - 그의 뒤쪽에
  rationale: 이 절의 영어 POB 수정도 it→him으로 바뀌었고, 그리스어 속격 대명사 αὐτοῦ 역시 인칭 지시를 담으므로 이를 반영하는 것이 문맥 보존에 더 적절합니다.
  doctrine_reference: source-language referent fidelity
