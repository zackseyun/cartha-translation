    rationale: Πρῶτος만 ‘먼저’로 반영되어 있으므로, ‘그러므로’를 보충해 문두 연결 표지를 살리는 것이 적절합니다.
  - severity: medium
    issue: ‘항해하게 하였습니다’의 사동 표현
    rationale: ἐποίησα σκάφος ἐπιπλέειν은 배를 항해하도록 만들었다기보다 항해할 배를 만들었다는 뜻입니다. 한국어 목적·용도 구문으로 바꾸어야 합니다.
