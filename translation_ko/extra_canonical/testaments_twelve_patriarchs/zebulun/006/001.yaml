id: T12P.ZEB.6.1
reference: Testament of Zebulun 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: VI. Πρῶτος ⌈οὖν⌉¹ ἐγὼ ἐποίησα σκάφος² ἐπιπλέειν³ ἐν τῇ⁴ θαλάσσῃ, ὅτι Κύριος ἔδωκέ μοι ⌈*σύνεσιν καὶ σοφίαν⁵⌉ ἐν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006/001.yaml
  text: First, then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it.
translation:
  language: ko
  text: 그러므로 나는 먼저 바다를 항해할 배를 만들었습니다. 주께서 그 안에서 나에게 총명과 지혜를 주셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτος οὖν
  english_pob_choice: First, then
  chosen_korean: 나는 먼저
  alternatives_korean:
  - 처음으로 나는
  - 먼저 나는
  lexicon: Πρῶτος, οὖν
  rationale: 문두의 순서 표지를 자연스럽게 살리되, 합쇼체 서술 흐름에 맞게 ‘나는 먼저’로 옮겼습니다.
- source_word: σκάφος
  english_pob_choice: a boat
  chosen_korean: 배
  alternatives_korean:
  - 작은 배
  - 선박
  lexicon: σκάφος
  rationale: 일반적인 ‘배’가 원문의 의미를 가장 자연스럽게 전달하며, 과도한 구체화나 기술적 어감을 피합니다.
- source_word: ἐπιπλέειν ἐν τῇ θαλάσσῃ
  english_pob_choice: to sail on the sea
  chosen_korean: 바다에서 항해하게
  alternatives_korean:
  - 바다를 항해하게
  - 바다 위를 떠다니게
  lexicon: ἐπιπλέειν, θάλασσα
  rationale: 동사의 목적 표현을 한국어에서 자연스러운 목적·용도 구문으로 풀어, 배를 ‘바다에서 항해하게’ 만들었다는 뜻을 살렸습니다.
- source_word: σύνεσιν καὶ σοφίαν
  english_pob_choice: understanding and wisdom
  chosen_korean: 총명과 지혜
  alternatives_korean:
  - 이해와 지혜
  - 분별과 지혜
  lexicon: σύνεσις, σοφία
  rationale: σύνεσις의 인지적·분별적 의미를 ‘총명’으로, σοφία를 ‘지혜’로 옮겨 두 명사의 병렬을 유지했습니다.
theological_decisions:
- issue: 주께서(Κύριος)의 번역
  chosen_reading: 주께서
  alternative_readings:
  - 주님께서
  - 하나님께서
  rationale: 문맥상 하나님을 가리키는 κύριος를 한국어에서 전통적으로도 자연스러운 존칭인 ‘주께서’로 옮겼습니다.
  doctrine_reference: κύριος의 신적 호칭 사용
- issue: 지혜의 출처가 ‘그 안에서(in it)’라는 구문
  chosen_reading: 그 안에서 나에게 총명과 지혜를 주셨기 때문입니다
  alternative_readings:
  - 그 안에 나에게 총명과 지혜를 주셨기 때문입니다
  - 그것 안에서 나에게 이해와 지혜를 주셨기 때문입니다
  rationale: ἐν αὐτῷ의 위치상 ‘그 안에서’가 가장 직접적이며, 배를 만드는 일/배 자체와 관련된 지혜의 맥락을 유지합니다.
  doctrine_reference: 문맥상의 지시대상 처리
