  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009.yaml
  text: 1 Therefore pay attention to the waters[a], and understand that when they move to one place, they carry down stones, wood, earth, and various other things. 2 But if they are divided into many streams, the ground swallows them up, and they become easy to despise. 3 So also you, if you are divided, will become like this. 4 Therefore do not be split under two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members. 5 For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow two kingdoms, and you will do every abomination. 6 And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses. 7 And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go
    astray in their evil deeds. 8 And after these things the Lord himself will rise for you[c][b], the light of righteousness.
  footnotes:
  - marker: a
    text: Some witnesses read, 'you will remember the Lord and repent, and he will turn you back,' instead of 'when you remember the Lord, you will return.'
    reason: textual_variant
  - marker: b
    text: 'Some witnesses expand the reason clause: ''because they are flesh and the spirits of error lead them astray in all their deeds.'''
    reason: textual_variant
  - marker: c
    text: Or 'will dawn for you'; the image is of the Lord appearing like rising light.
    reason: lexical_alternative
translation:
  language: ko
  text: 1 그러므로 물을 주의하여 보십시오. 물이 한곳으로 갈 때 돌과 나무와 흙과 그 밖의 여러 가지를 실어 내려가는 것을 깨달으십시오. 2 그러나 그것들이 여러 갈래로 나뉘면 땅이 그것들을 삼켜 버리고, 그것들은 쉽게 업신여김을 받게 됩니다. 3 너희도 이와 같습니다. 너희가 나뉘면 그렇게 될 것입니다. 4 그러므로 두 머리 아래로 갈라지지 마십시오. 주님께서 만드신 모든 것은 한 머리와 두 어깨와 두 손과 두 발과 그 밖의 모든 지체를 가지고 있기 때문입니다. 5 나는 내 조상들의 글에서 너희가 이스라엘 가운데서 나뉘고, 두 왕국을 따르며, 온갖 가증한 일을 행하게 될 것임을 배웠습니다. 6 그리고 너희 원수들이 너희를 포로로 끌고 갈 것이며, 너희는 여러 민족 가운데서 많은 쇠약과 환난을 겪을 것입니다. 7 그리고 이런 일들이 있은 뒤에 너희가 주님을 기억하면 돌아올 것이며, 그분은 너희에게 자비를 베푸실 것입니다. 그분은 자비롭고 긍휼이 많으시며, 사람들이 육신이어서 자기들의 악한 행위 가운데서 방황하기 때문에 그들에게 악을 헤아리지 않으십니다. 8 그리고 이런 일들 뒤에 주님 자신이 너희를 위해 일어나실 것입니다, 의의 빛으로.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 사본은 ‘너희가 주님을 기억하고 회개할 것이며, 그분이 너희를 돌아오게 하실 것이다’라고 읽습니다. 이는 ‘너희가 주님을 기억하면 돌아올 것이며’ 대신의 읽기입니다.
    reason: textual_variant
  - marker: b
    text: 일부 사본은 그 이유 절을 ‘그들이 육신이며, 오류의 영들이 그들을 모든 행위에서 그릇되게 하기 때문이다’라고 확장합니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘너희를 위해 떠오르실 것입니다.’ 주님께서 떠오르는 빛처럼 나타나시는 이미지입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὰ ὕδατα
  english_pob_choice: pay attention to the waters
  chosen_korean: 물을 주의하여 보십시오
  alternatives_korean:
  - 물에 주목하십시오
  - 물을 살펴보십시오
  lexicon: LSJ
  rationale: 감각적 이미지를 살리면서도 권면의 강도를 자연스럽게 전달하기 위해 '주의하여 보십시오'를 선택했습니다.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  english_pob_choice: move to one place
  chosen_korean: 한곳으로 모일 때
  alternatives_korean:
  - 같은 곳으로 갈 때
  - 한데 모일 때
  lexicon: BDAG
  rationale: Greek의 '한 방향으로 진행하여 하나의 지점에 이르는' 뜻을 살리되, 한국어에서는 흐름의 수렴을 자연스럽게 표현했습니다.
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  english_pob_choice: be split under two heads
  chosen_korean: 두 머리 아래에서 나뉘지 마십시오
  alternatives_korean:
  - 두 우두머리 아래에서 갈라지지 마십시오
  - 두 지도 아래로 분열되지 마십시오
  lexicon: LSJ
  rationale: κεφαλή의 문자적 '머리' 이미지를 유지하여 몸-정치 비유를 보존했고, '나뉘지 마십시오'로 반복되는 분열 어휘와 구별했습니다.
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: BDAG
  rationale: 이 문맥의 주님은 야훼를 가리키는 공적 호칭이므로 한국어에서는 경어를 살린 '주님'을 사용했습니다.
- source_word: φῶς δικαιοσύνης
  english_pob_choice: the light of righteousness
  chosen_korean: 의의 빛
  alternatives_korean:
  - 의로움의 빛
  - 정의의 빛
  lexicon: BDAG
  rationale: δικαιοσύνη의 기본 대응인 '의'를 유지하여 종교적·법정적 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 두 번의 분열 동사(διαιρεθῆτε / χωρισθῆτε) 구별
  chosen_reading: '''나뉘다''와 ''나뉘지 마십시오''로 동일 어근의 반복은 살리되, χωρισθῆτε는 ''나뉘다''보다 관계적 분리의 뉘앙스를 덜 드러내는 방식으로 처리했습니다.'
  alternative_readings:
  - 둘 다 '분열되다'로 통일
  - χωρισθῆτε를 '갈라지다'로 번역
  rationale: 본문은 수차례의 분열 경고를 반복하지만, 서로 다른 동사를 완전히 동일화하면 수사적 대비가 약해집니다. 한국어에서는 과도한 해석을 넣지 않으면서도 반복 경고의 힘을 보존해야 합니다.
  doctrine_reference: 본문의 수사적 긴장 보존
- issue: '''주님 자신이 너희를 위해 일어나실 것입니다'''
  chosen_reading: 그대로 유지해 출현·구원의 이미지와 아울러 '의의 빛'과의 연결을 열어 두었습니다.
  alternative_readings:
  - '''주님 자신이 너희를 위해 떠오르실 것입니다'''
  - 메시아적 예언으로 한정
  rationale: ἀνατελεῖ는 '일어나시다/떠오르시다' 둘 다 가능한 이미지이므로, 한국어 본문은 한쪽으로 과도하게 좁히지 않았습니다.
  doctrine_reference: 의도적 의미 개방성 보존
