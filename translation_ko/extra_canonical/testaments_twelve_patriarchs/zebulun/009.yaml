  to: 1 그러므로 물을 주의하여 보십시오. 물이 한곳으로 갈 때 돌과 나무와 흙과 그 밖의 여러 가지를 실어 내려가는 것을 깨달으십시오. 2 그러나 그것들이 여러 갈래로 나뉘면 땅이 그것들을 삼켜 버리고, 그것들은 쉽게 업신여김을 받게 됩니다. 3 너희도 이와 같습니다. 너희가 나뉘면 그렇게 될 것입니다. 4 그러므로 두 머리 아래로 갈라지지 마십시오. 주님께서 만드신 모든 것은 한 머리와 두 어깨와 두 손과 두 발과 그 밖의 모든 지체를 가지고 있기 때문입니다. 5 나는 내 조상들의 글에서 너희가 이스라엘 가운데서 나뉘고, 두 왕국을 따르며, 온갖 가증한 일을 행하게 될 것임을 배웠습니다. 6 그리고 너희 원수들이 너희를 포로로 끌고 갈 것이며, 너희는 여러 민족 가운데서 많은 쇠약과 환난을 겪을 것입니다. 7 그리고 이런 일들이 있은 뒤에 너희가 주님을 기억하면 돌아올 것이며, 그분은 너희에게 자비를 베푸실 것입니다. 그분은 자비롭고 긍휼이 많으시며, 사람들이 육신이어서 자기들의 악한 행위 가운데서 방황하기 때문에 그들에게 악을 헤아리지 않으십니다. 8 그리고 이런 일들 뒤에 주님 자신이 너희를 위해 일어나실 것입니다, 의의 빛으로.[a][b][c]
  rationale: 1절에서는 원문의 이동 동사를 ‘한곳으로 갈 때’로 옮겨 불필요한 합류의 함의를 피했습니다. 4절에서는 χωρίζω를 ‘갈라지다’로, 반복되는 διαιρέω를 ‘나뉘다’로 처리해 어휘적 구별을 보존했습니다. 나머지 변경은 현대 표준어의 자연스러움과 βδέλυγμα의 의미 강도를 위한 최소 교정입니다. 기존 영문 주석의 a·b·c 표지는 7절 변이와 8절 어휘 대안을 각각 정확히 뒷받침하도록 한국어 주석으로 제공했습니다.
