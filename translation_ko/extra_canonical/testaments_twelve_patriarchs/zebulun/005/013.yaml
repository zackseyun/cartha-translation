  rationale: 원문은 αὐτόν으로 명시적으로 남성형이므로, 서술을 일반화하지 않고 인칭 지시를 유지하는 쪽이 원문 충실도가 높습니다.
  doctrine_reference: 원문 지시대명사 보존
