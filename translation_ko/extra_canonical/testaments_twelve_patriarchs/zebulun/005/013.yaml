  language: ko
  text: 그리하여 그는 그를 그들에게 주었습니다. 그리고 그들은 단이 말한 대로 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸν
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그것을
  - 그분을
  lexicon: 대명사
  rationale: 그리스어 남성 대명사 αὐτόν을 반영하여 목적어를 ‘그를’로 옮겼습니다. 영어 POB의 수정판도 이 점을 바로잡았습니다.
- source_word: διδόναι / δέδωκεν
  english_pob_choice: he gave
  chosen_korean: 주었습니다
  alternatives_korean:
  - 내주었습니다
  - 넘겨주었습니다
  lexicon: 주다
  rationale: 행동의 결과를 자연스럽게 드러내면서도 원문의 단순한 수여 의미를 유지했습니다.
- source_word: ἐποίησαν καθὼς εἶπεν
  english_pob_choice: They did as Dan had said
  chosen_korean: 그들은 단이 말한 대로 행했습니다
  alternatives_korean:
  - 그들은 단이 한 말대로 했습니다
  - 그들은 단이 말한 대로 했습니다
  lexicon: 행하다
  rationale: καθὼς + εἶπεν의 종속 관계를 한국어에서 ‘말한 대로 행하다’로 자연스럽게 재현했습니다.
- source_word: ὁ Δάν
  english_pob_choice: Dan
  chosen_korean: 단
  alternatives_korean:
  - 단 지파의 조상 단
  lexicon: 고유명사
  rationale: 기존 한국어 성경의 통용 표기인 ‘단’을 사용했습니다.
theological_decisions:
- issue: 지시대명사의 성별 반영
  chosen_reading: ‘그를’로 옮겨 인칭과 성별 표지를 보존했습니다.
  alternative_readings:
