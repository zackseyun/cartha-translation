  text: But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.”
translation:
  language: ko
  text: 그러자 우리는 모두 일어나 그에게 말했습니다. "네가 그 채색옷을 주지 않으면, 우리는 우리 아버지에게 네가 이 악한 일을 이스라엘에서 홀로 저질렀다고 말하겠습니다."[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάντες δὲ πάντες
  english_pob_choice: But we all rose up
  chosen_korean: 그러자 우리는 모두 일어났습니다
  alternatives_korean:
  - 그런데 우리는 모두 일어났습니다
  - 그리고 우리는 모두 일어났습니다
  lexicon: ἀνίστημι
  rationale: 행동 전환을 나타내는 δέ는 자연스러운 연결어인 “그러자”로 옮기고, Ἀναστάντες는 단순히 ‘일어나다’로 처리해 장면의 즉각성을 살렸습니다.
- source_word: τὸν χιτῶνα
  english_pob_choice: the tunic
  chosen_korean: 그 채색옷
  alternatives_korean:
  - 그 속옷
  - 그 긴 옷
  - 그 튜닉
  lexicon: χιτών
  rationale: 이 문맥의 χιτών은 요셉 이야기의 “채색옷”으로 알려진 특정 겉옷을 가리키므로, 한국어 독자가 장면을 바로 알아볼 수 있게 구체화했습니다.
- source_word: σὺ μόνος ἐποίησας τὸ πονηρὸν τοῦτο ἐν Ἰσραήλ
  english_pob_choice: you alone did this evil thing in Israel
  chosen_korean: 네가 이 악한 일을 이스라엘에서 홀로 저질렀다고
  alternatives_korean:
  - 네가 이 악한 일을 이스라엘에서 혼자 행했다고
  - 네가 이 악한 일을 이스라엘 가운데서 단독으로 저질렀다고
  lexicon: μόνος, πονηρός, ποιέω
  rationale: σὺ μόνος와 τὸ πονηρὸν τοῦτο를 함께 살려 “홀로”와 “악한 일”로 대응했고, ποιέω는 사건의 무게를 살리는 “저지르다”로 옮겼습니다.
theological_decisions:
- issue: 형제들의 위협적 발화의 직접성
  chosen_reading: 직접화법을 유지해 고발과 압박의 뉘앙스를 그대로 드러냈습니다.
  alternative_readings:
  - 간접화법으로 완화해 서술하기
  - 더 공손한 말투로 순화하기
  rationale: 원문은 협박성 진술을 직접 인용으로 제시하므로, 한국어에서도 긴장감을 보존하는 편이 원문 충실도에 부합합니다.
  doctrine_reference: source fidelity / discourse force
