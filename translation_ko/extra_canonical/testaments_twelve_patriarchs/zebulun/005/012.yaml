    issue: ‘그 채색옷’이라는 특정화
    rationale: 원문 τὸν χιτῶνα에는 ‘채색’에 해당하는 수식어가 없습니다. 관련 성서 전승에 근거해 색채를 본문에 보충하면 원문보다 의미를 좁히게 됩니다.
