id: T12P.ZEB.5.14
reference: Testament of Zebulun 5:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/014.yaml
  text: And now, my children, I command you to keep the commandments of the Lord, and to show mercy to your neighbor, and to have compassion toward all, not only toward people but also toward unreasoning animals.
translation:
  language: ko
  text: 그리고 이제, 내 자녀들아, 나는 너희에게 주님의 계명들을 지키고, 너희 이웃에게 자비를 베풀며, 모든 이에게—사람들에게만이 아니라 이성 없는 짐승들에게도—긍휼을 가지라고 명합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω ὑμῖν
  english_pob_choice: I command you
  chosen_korean: 나는 너희에게 ... 명합니다
  alternatives_korean:
  - 나는 너희에게 ... 명령합니다
  - 나는 너희에게 ... 권고합니다
  lexicon: παραγγέλλω
  rationale: 화자가 자녀들에게 권위를 가지고 말하는 문맥이므로 단순 권고보다 명령의 힘을 살리되, 현대 한국어에서 자연스러운 ‘명합니다’를 선택했습니다.
- source_word: τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου
  english_pob_choice: to keep the commandments of the Lord
  chosen_korean: 주님의 계명들을 지키고
  alternatives_korean:
  - 주님의 계명들을 지켜
  - 주님의 계명들을 보존하고
  lexicon: φυλάσσειν / ἐντολαί / Κύριος
  rationale: φυλάσσειν은 ‘지키다, 준수하다’의 의미가 핵심이므로 ‘지키다’로 옮겼고, Κυρίου는 본문 문맥상 주님으로 자연스럽게 처리했습니다.
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  english_pob_choice: to show mercy to your neighbor
  chosen_korean: 너희 이웃에게 자비를 베풀며
  alternatives_korean:
  - 너희 이웃에게 긍휼을 행하며
  - 너희 이웃에게 인자함을 베풀며
  lexicon: ἔλεος / πλησίον
  rationale: ἔλεος는 단순 감정이 아니라 실제적 자비 행위를 가리키므로 ‘자비를 베풀다’로 자연스럽게 옮겼습니다.
- source_word: εὐσπλαγχνίαν ἔχειν πρὸς πάντας ... καὶ ἐν ἀλόγοις ζώοις
  english_pob_choice: to have compassion toward all, not only toward people but also toward unreasoning animals
  chosen_korean: 모든 이에게—사람들에게만이 아니라 이성 없는 짐승들에게도—긍휼을 가지라고
  alternatives_korean:
  - 모든 이에게 ... 연민을 가지라고
  - 모든 존재에게 ... 불쌍히 여기라고
  lexicon: εὐσπλαγχνία / πάντες / ἀλόγοις ζώοις
  rationale: εὐσπλαγχνία는 내장 깊은 연민을 뜻하므로 ‘긍휼’로 유지했고, ἀλόγοις ζώοις는 ‘이성 없는 짐승들’로 직역해 동물까지 포함하는 대조를 드러냈습니다.
theological_decisions:
- issue: '범위 확장: 이웃 사랑이 사람뿐 아니라 동물에게도 미친다는 점'
  chosen_reading: 본문의 윤리적 요구를 사람에 국한하지 않고, ‘모든 이’와 ‘이성 없는 짐승들’까지 포함하는 명시적 확장으로 옮겼습니다.
  alternative_readings:
  - ‘모든 이’만 일반적으로 번역해 동물 포함을 약화하는 읽기
  - ‘짐승들’을 완화해 비유적으로 읽는 해석
  rationale: 원문이 사람과 무이성 동물을 대조하며 사랑의 범위를 넓히므로, 이 긴장을 줄이지 않고 그대로 드러내는 것이 source-direct합니다.
  doctrine_reference: 창조 질서 안에서의 자비와 피조물에 대한 윤리
- issue: 호칭 ‘주님’의 선택
  chosen_reading: Κυρίου를 ‘주님의’로 번역해 하나님에 대한 직접 호칭을 표준 한국어 경건 문체로 유지했습니다.
  alternative_readings:
  - ‘야훼의’로 직접 음역하는 읽기
  - ‘주’로 더 축약하는 읽기
  rationale: 이 본문은 야훼 인용이 아니라 일반적 주권 호칭으로 보이며, 한국어 본문에서는 ‘주님’이 가장 자연스럽고 문체상 안정적입니다.
  doctrine_reference: 하나님의 주권과 계명 순종
