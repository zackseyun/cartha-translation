- from: 그리고 이제, 내 자녀들아, 나는 너희에게 주님의 계명들을 지키고, 너희 이웃에게 자비를 베풀며, 모든 이에게—사람들에게만이 아니라 이성 없는 짐승들에게도—긍휼을 가지라고 명합니다.[a]
