id: T12P.ZEB.5.16
reference: Testament of Zebulun 5:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. *Ἔχετε οὖν¹⁷ ἔλεος ἐν¹⁸ σπλάγχνοις ὑμῶν¹⁹, ὅτι *εἴ τι ἂν²⁰ ποιήσῃ²¹ τῷ πλησίον αὐτοῦ, *οὕτω Κύριος²² ποιήσει²³ *μετʼ αὐτοῦ²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/016.yaml
  text: Have mercy, therefore, in your hearts[b], because whatever anyone does to his neighbor, so the Lord will do to him.
  footnotes:
  - marker: b
    text: The phrase 'mercy in your inward parts' reflects the Greek idiom with σπλάγχνα, the inner organs as the seat of compassion.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 너희 마음의 불쌍히 여기는 마음을 가지십시오[a]. 누구든지 자기 이웃에게 행하는 그대로, 주께서도 그에게 행하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔχετε οὖν ἔλεος
  english_pob_choice: Have mercy, therefore
  chosen_korean: 그러므로 너희 마음의 불쌍히 여기는 마음을 가지십시오
  alternatives_korean:
  - 그러므로 자비를 가지십시오
  - 그러므로 긍휼을 품으십시오
  lexicon: ἔλεος
  rationale: ἔλεος는 단순한 감정이 아니라 상대를 향한 자비로운 태도이므로, 한국어에서는 문맥상 자연스럽고 의미를 살리는 표현으로 옮겼습니다.
- source_word: ἐν σπλάγχνοις ὑμῶν
  english_pob_choice: in your hearts
  chosen_korean: 너희 마음의
  alternatives_korean:
  - 너희 속사람의
  - 너희 심장 깊은 곳의
  lexicon: σπλάγχνα
  rationale: σπλάγχνα는 문자적으로는 내장을 가리키지만, 영어 POB의 각주가 지적하듯 내면의 공감과 연민의 자리라는 관용구이므로 한국어의 ‘마음’으로 옮기되 내부성을 유지했습니다.
- source_word: τῷ πλησίον αὐτοῦ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 그의 이웃
  - 가까운 이
  lexicon: πλησίον
  rationale: πλησίον은 단순한 지리적 이웃보다 관계적·윤리적 ‘이웃’을 뜻하므로, 누구든지 적용될 수 있게 자연스러운 한국어로 표현했습니다.
- source_word: οὕτω Κύριος ποιήσει μετʼ αὐτοῦ
  english_pob_choice: so the Lord will do to him
  chosen_korean: 주께서도 그에게 행하실 것입니다
  alternatives_korean:
  - 주님도 그에게 그렇게 하실 것입니다
  - 주께서 그에게도 그대로 하실 것입니다
  lexicon: Κύριος
  rationale: 대칭 구조를 살리면서도 한국어에서 덜 어색한 재진술로 옮겼고, 본문의 인과적·보응적 의미를 분명히 드러냈습니다.
theological_decisions:
- issue: 행위-보응의 대칭 구조
  chosen_reading: 사람이 이웃에게 행한 그대로 주께서도 그에게 행하신다는 도덕적 보응의 원리를 그대로 드러냈습니다.
  alternative_readings:
  - 일반적 도덕 권고로 완화하는 번역
  - 미래형을 약화해 단순한 가능성으로 읽는 번역
  rationale: 본문의 οὕτω와 미래형은 행위와 그에 상응하는 주의 행하심을 분명히 연결하므로, 그 긴장을 약화하지 않고 보존했습니다.
  doctrine_reference: 도덕적 보응 / 상응의 원리
- issue: σπλάγχνα의 신체 은유
  chosen_reading: 내장을 가리키는 신체적 은유를 한국어 관용구 ‘마음’으로 옮기되, 각주로 원어의 관용성을 밝혔습니다.
  alternative_readings:
  - 직역하여 ‘내장’으로 옮기는 번역
  - 단순히 ‘마음속’으로만 옮겨 신체성을 지우는 번역
  rationale: 본문의 표현력을 살리면서도 현대 한국어 독자가 이해하기 쉬운 수준을 유지하기 위해, 은유의 핵심을 보존한 번역을 택했습니다.
  doctrine_reference: 성서적 신체 은유
