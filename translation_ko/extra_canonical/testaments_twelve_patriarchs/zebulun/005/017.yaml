  to: 실로 내 형제들의 아들들은 요셉 때문에 병들고 죽어 갔습니다. 이는 그들이 속 깊은 곳에서 긍휼을 보이지 않았기 때문입니다. 그러나 내 아들들은 여러분이 아시는 대로 병 없이 지켜졌습니다.
