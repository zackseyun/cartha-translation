  text: 4. *Καὶ γὰρ²⁵ υἱοὶ²⁶ τῶν ἀδελφῶν μου ἠσθένουν καὶ²⁷ ἀπέθνησκον διὰ Ἰωσήφ²⁸, ⌈ὅτι οὐκ ἐποίησαν ἔλεος *ἐν σπλάγχνοις αὐτῶν²⁹⌉. οἱ δὲ *ἐμοὶ υἱοὶ³⁰ ἄνοσοι διεφυλάχθησαν³¹ καθὼς³² οἴδατε³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/017.yaml
  text: For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their inward parts; but my sons were kept free from sickness, as you know.
translation:
  language: ko
  text: 실로 내 형제들의 아들들은 요셉 때문에 병들고 죽어 갔습니다. 이는 그들이 자기들의 속사람 안에서 긍휼을 보이지 않았기 때문입니다. 그러나 내 아들들은 여러분이 아시는 대로 병 없이 지켜졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν σπλάγχνοις αὐτῶν
  english_pob_choice: in their inward parts
  chosen_korean: 자기들의 속사람 안에서
  alternatives_korean:
  - 그들의 마음속에서
  - 그들의 심장 속에서
  - 그들의 내장 안에서
  lexicon: σπλάγχνα
  rationale: POB가 ‘inward parts’로 좁혀 잡은 감각을 따라, 관용적인 ‘마음’보다 더 신체적·내적 뉘앙스를 살린 ‘속사람’으로 옮겼습니다.
- source_word: ἔλεος
  english_pob_choice: mercy
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 은혜
  - 연민
  lexicon: ἔλεος
  rationale: 원문의 윤리적·공감적 행위를 드러내기 위해, 문맥상 ‘베풀다’와 잘 어울리는 표준 교회어 ‘긍휼’을 택했습니다.
- source_word: ἄνοσοι διεφυλάχθησαν
  english_pob_choice: were kept free from sickness
  chosen_korean: 병 없이 지켜졌습니다
  alternatives_korean:
  - 병에서 지켜졌습니다
  - 병에 걸리지 않도록 보호받았습니다
  - 질병 없이 보전되었습니다
  lexicon: ἄνοσος + διαφυλάσσω
  rationale: 단순한 ‘건강함’보다 수동적 보호를 나타내는 ‘지켜졌다’를 살리고, ‘free from sickness’의 결과 상태를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 요셉 때문에의 고난과 보전의 인과를 어떻게 표현할지
  chosen_reading: ‘요셉 때문에’와 ‘지켜졌습니다’를 그대로 두어, 본문이 말하는 징계/보호의 대조를 약화시키지 않았습니다.
  alternative_readings:
  - ‘요셉으로 말미암아’로 완화
  - 원인 표현을 생략
  rationale: 본문은 형제들의 아들들은 병들고 죽어 갔고, 내 아들들은 지켜졌다는 대비를 분명히 제시하므로, 인과와 보호의 긴장을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 섭리와 징계의 대조
