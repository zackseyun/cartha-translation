base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/011.yaml
  text: And Simeon took the tunic and did not want to give it up. For he wanted to cut him down with the sword, being angry because he had not killed him.
translation:
  language: ko
  text: 그런데 시므온이 그 옷을 가져가서는 내주려 하지 않았습니다. 그는 칼로 그를 찍어 죽이려 했기 때문입니다. 그가 그를 죽이지 못한 것에 화를 냈기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν χιτῶνα
  english_pob_choice: the tunic
  chosen_korean: 그 옷
  alternatives_korean:
  - 그 속옷
  - 그 튜닉
  lexicon: χιτών
  rationale: 본문의 옷은 특정 겉옷보다 몸에 입는 기본 의복을 가리키므로, 현대 독자가 이해할 수 있는 중립적 표현인 ‘그 옷’을 택했습니다.
- source_word: οὐκ ἤθελε δοῦναι αὐτόν
  english_pob_choice: did not want to give it up
  chosen_korean: 내주려 하지 않았습니다
  alternatives_korean:
  - 주려 하지 않았습니다
  - 넘겨주려 하지 않았습니다
  lexicon: δίδωμι
  rationale: POB의 ‘give it up’처럼 단순히 ‘주다’보다 소유를 포기해 넘겨주는 뉘앙스를 살리기 위해 ‘내주다’를 사용했습니다.
- source_word: τῇ ῥομφαίᾳ κατακόψαι αὐτόν
  english_pob_choice: cut him down with the sword
  chosen_korean: 칼로 그를 찍어 죽이려 했습니다
  alternatives_korean:
  - 칼로 그를 베어 죽이려 했습니다
  - 칼로 그를 쳐 죽이려 했습니다
  lexicon: ῥομφαία, κατακόπτω
  rationale: ῥομφαία를 문맥상 일반적인 ‘칼’로 옮기고, κατακόψαι의 폭력성을 살려 단순 상처가 아니라 죽이려 한 뜻을 분명히 했습니다.
- source_word: ὀργιζόμενος ὅτι οὐκ ἀνεῖλεν αὐτόν
  english_pob_choice: being angry because he had not killed him
  chosen_korean: 그가 그를 죽이지 못한 것에 화를 냈기 때문입니다
  alternatives_korean:
  - 그를 죽이지 않은 것에 화를 냈기 때문입니다
  - 그를 죽이지 못한 데 분노했기 때문입니다
  lexicon: ὀργίζομαι, ἀναιρέω
  rationale: 원문은 이미 살해하려는 분노의 이유를 직접 밝히므로, ‘죽이지 못한 것’으로 POB의 의미를 유지하면서도 결과의 미완성을 드러냈습니다.
theological_decisions:
- issue: 폭력적 행위의 서술을 한국어에서 얼마나 직접적으로 드러낼지
  chosen_reading: 시므온이 분노한 상태에서 실제로 그를 죽이려 했다는 점을 직설적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘해치려 했다’로 완화함
  - ‘찍어 누르려 했다’처럼 비살상으로 순화함
  rationale: 원문은 살해 의도를 분명히 하며, 본문의 도덕적 긴장도 그 폭력성에 있으므로 이를 약화하지 않았습니다.
  doctrine_reference: 본문 직역의 충실성 및 서사적 윤리 보존
