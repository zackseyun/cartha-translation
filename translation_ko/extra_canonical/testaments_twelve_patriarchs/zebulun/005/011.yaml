source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 11. *Ἔλαβε δὲ Συμεὼν τὸν χιτῶνα⁶⁴, Γκαὶ˥⁶⁵ οὐκ ἤθελε δοῦναι αὐτόν⁶⁶, Γ*ἐβούλετο γὰρ⁶⁷ τῇ ῥομφαίᾳ⁶⁸ *κατακόψαι αὐτόν⁶⁹˥, ὀργιζόμενος ὅτι οὐκ⁷⁰ ἀνεῖλεν αὐτόν.
