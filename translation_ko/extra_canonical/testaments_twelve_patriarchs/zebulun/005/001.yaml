id: T12P.ZEB.5.1
reference: Testament of Zebulun 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: αὐτὸν τῷ Ἰακὼβ λέγοντες⁵⁵. Ἐπίγνωθι, ὁ⁵⁶ *χιτὼν τοῦ υἱοῦ σου ἐστίν⁵⁷; *καὶ ἐποίησαν οὕτως⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/001.yaml
  text: And they said to Jacob, “Recognize, then, whether this is your son’s tunic[a].” And they did so.
  footnotes:
  - marker: a
    text: Or 'coat' or 'robe' for χιτών; 'tunic' is chosen for greater specificity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 야곱에게 말하기를, “당신의 아들 옷인지 알아보십시오[a].” 하였고, 그들은 그렇게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπίγνωθι
  english_pob_choice: Recognize, then
  chosen_korean: “알아보십시오”
  alternatives_korean:
  - “식별해 보십시오”
  - “분별해 보십시오”
  - “확인해 보십시오”
  lexicon: ἐπιγινώσκω
  rationale: 문맥상 옷의 소유자를 알아보라는 요청이므로, 강한 직역보다 자연스럽고 정중한 명령형 “알아보십시오”가 의미를 가장 직접적으로 전달합니다.
- source_word: χιτὼν
  english_pob_choice: tunic
  chosen_korean: “옷”
  alternatives_korean:
  - “속옷”
  - “긴옷”
  - “저고리”
  lexicon: χιτών
  rationale: 영어 POB는 특수한 의복명인 tunic을 택했지만, 한국어에서는 본문의 기능상 ‘아들의 옷’으로 충분히 식별되므로 과도한 고어화 없이 “옷”으로 옮겼습니다. 다만 구체적 의복이라는 정보는 각주로 보존했습니다.
- source_word: υἱοῦ σου
  english_pob_choice: your son’s
  chosen_korean: “당신의 아들”
  alternatives_korean:
  - “아드님의”
  - “네 아들의”
  lexicon: υἱός
  rationale: 야곱에게 직접 말하는 장면이지만, 한국어 서술문에서는 존대 체계를 유지하기 위해 “당신의 아들”이 합쇼체 맥락에 가장 자연스럽습니다.
theological_decisions:
- issue: 직접화법의 공손한 명령형 처리
  chosen_reading: 야곱에게 정중한 요청으로 들리도록 “알아보십시오”를 유지했습니다.
  alternative_readings:
  - “알아보시오”
  - “알아라”
  rationale: 이 본문은 신학적 쟁점보다 서술적 정확성이 중요하며, 합쇼체의 현대 한국어 독자에게 자연스러운 대화 흐름을 보존하는 것이 우선입니다.
  doctrine_reference: 공손한 서술체와 직접화법의 일관성
