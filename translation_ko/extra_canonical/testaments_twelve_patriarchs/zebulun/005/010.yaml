  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/010.yaml
  text: For they stripped Joseph of the tunic when they sold him, and clothed him in a slave’s garment.
translation:
  language: ko
  text: 그들이 요셉을 팔 때에 그의 속옷을 벗기고 그에게 노예의 옷을 입혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτῶνα
  english_pob_choice: the tunic
  chosen_korean: 겉옷
  alternatives_korean:
  - 속옷
  - 긴옷
  - 튜닉
  lexicon: χιτών
  rationale: 고대 의복의 구체 항목을 직역하되, 현대 독자가 이해할 수 있도록 ‘겉옷’으로 옮겼습니다. 문맥상 옷을 벗겨 빼앗는 행위를 자연스럽게 드러냅니다.
- source_word: τὸν Ἰωσὴφ
  english_pob_choice: Joseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요셉
  lexicon: Ἰωσήφ
  rationale: 성경에서 확립된 고유명사 표기를 따랐습니다.
- source_word: ἐν τῷ πιπράσκειν αὐτόν
  english_pob_choice: when they sold him
  chosen_korean: 그를 팔 때에
  alternatives_korean:
  - 그를 팔면서
  - 그를 팔고 있을 때에
  lexicon: πιπράσκω
  rationale: 분사구를 한국어 시간 표현으로 자연스럽게 옮겨, 이전 초안의 ‘were selling’보다 완료적 사건성을 더 분명히 반영했습니다.
- source_word: ἱμάτιον δουλικόν
  english_pob_choice: a slave’s garment
  chosen_korean: 노예의 옷
  alternatives_korean:
  - 종의 옷
  - 노예복
  - 종복
  lexicon: ἱμάτιον; δοῦλος
  rationale: 영어 POB가 ‘slave’s’로 잡은 상태를 살려 δοῦλος의 의미를 강하게 드러냈습니다. ‘노예’가 여기서는 예속된 신분을 명확히 보여 주기에 적절합니다.
theological_decisions:
- issue: 요셉이 팔릴 때 입혀진 옷의 사회적 의미
  chosen_reading: ‘노예의 옷’은 단순한 일반 의복이 아니라, 그를 종속된 신분으로 취급하는 조롱과 억압의 표지로 읽었습니다.
  alternative_readings:
  - 그냥 평범한 옷
  - 종의 옷으로 완화
  rationale: 문맥상 형제들의 배신과 굴욕을 강조하는 표현이므로, 신분 표지를 희석하지 않고 유지했습니다.
  doctrine_reference: 요셉 서사 내 고난과 수치의 강조
