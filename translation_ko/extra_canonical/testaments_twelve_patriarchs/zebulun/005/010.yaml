review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal actions and temporal setting. However, χιτών is more specifically a tunic, ordinarily an inner garment rather than a Korean ‘겉옷’; rendering it as ‘겉옷’ reverses the usual garment distinction and obscures the contrast with ἱμάτιον, the garment subsequently put on Joseph.
  naturalness: The sentence is generally natural in modern formal-polite Korean, but repeating ‘그에게’ after ‘그를 팔 때에’ is slightly cumbersome. Reordering the temporal phrase produces a clearer, smoother sentence.
  terminology: ‘요셉’ and ‘노예의 옷’ are suitable. ‘속옷’ is the most accessible standard-Korean equivalent for χιτών in this context; it is not intended to specify modern underwear, but the tunic/inner garment.
  issues:
  - severity: medium
    issue: χιτών is rendered ‘겉옷.’
    rationale: A χιτών is a tunic, commonly the inner garment, while ἱμάτιον denotes the garment/cloak placed on Joseph. ‘겉옷’ therefore gives the first item the less likely sense and blurs the source’s lexical distinction.
  revised_text: 그들이 요셉을 팔 때에 그의 속옷을 벗기고 그에게 노예의 옷을 입혔습니다.
