  rationale: The revision corrects the garment term χιτών to ‘속옷,’ retains the temporal force of ἐν τῷ πιπράσκειν αὐτόν as ‘요셉을 팔 때에,’ and preserves the source’s statement that Joseph was clothed in a slave’s garment.
