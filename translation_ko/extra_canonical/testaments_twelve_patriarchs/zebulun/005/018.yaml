  text: 5. Καὶ ὅτε ἤμην *ἐν γῇ³⁴ Χαναὰν *εἰς τὴν παραλίαν³⁵ ἐθήρευον θήραν³⁶ Ἰακὼβ³⁷ τῷ πατρί μου³⁸, καὶ πολλῶν ἀγχομένων *ἐν τῇ θαλάσσῃ³⁹, ἐγὼ ἀβλαβὴς διέμενον⁴⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/018.yaml
  text: And when I was in the land of Canaan, by the seashore, I used to catch prey[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].
  footnotes:
  - marker: c
    text: The Greek literally says 'I hunted prey,' but the seashore setting suggests fishing or catching sea-creatures for his father.
    reason: lexical_alternative
  - marker: d
    text: The final sentence appears to continue beyond the surviving excerpt provided here; the translation ends with the extant Greek in the source segment.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 내가 가나안 땅, 해변가에 있을 때에는, 내 아버지 야곱을 위해 사냥한 것을 잡았습니다. 또 바다에서 많은 이들이 질식해 갈 때에도, 나는 무사히 지냈습니다.[c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθήρευον θήραν
  english_pob_choice: I used to catch prey
  chosen_korean: 사냥한 것을 잡았습니다
  alternatives_korean:
  - 먹이를 사냥했습니다
  - 사냥감을 잡았습니다
  - 물고기를 잡았습니다
  lexicon: θήρευω / θήρα
  rationale: Greek은 직역하면 ‘사냥하다/사냥감’이어서, 영어 POB의 ‘prey’를 따라 어류로 한정하지 않고 목적어를 풀어 ‘사냥한 것’을 살렸습니다.
- source_word: ἐν τῇ θαλάσσῃ
  english_pob_choice: in the sea
  chosen_korean: 바다에서
  alternatives_korean:
  - 바다 안에서
  - 바다 가운데서
  lexicon: θάλασσα
  rationale: 장소 부사구는 자연스러운 한국어로 간명하게 옮기되, 원문의 바다라는 장소 표지를 유지했습니다.
- source_word: ἀβλαβὴς διέμενον
  english_pob_choice: I came through unharmed
  chosen_korean: 무사히 지냈습니다
  alternatives_korean:
  - 해를 입지 않고 있었습니다
  - 무해하게 머물렀습니다
  - 상처 없이 건너갔습니다
  lexicon: ἀβλαβής / διαμένω
  rationale: 결과 상태인 ‘무사함’을 현대 한국어로 자연스럽게 풀어, 단순한 이동이 아니라 보존된 상태를 드러냈습니다.
theological_decisions:
- issue: 해변가의 ‘사냥’ 표현이 한국어 독자에게 낯설 수 있음
  chosen_reading: 어휘를 ‘사냥한 것’으로 두어, 본문이 말하는 비정상적인/넓은 의미의 포획 행위를 그대로 보이게 했습니다.
  alternative_readings:
  - ‘물고기’를 보충해 해안 어업으로 정리하는 읽기
  - ‘먹이’로 일반화해 모호성을 줄이는 읽기
  rationale: 영어 POB도 θήραν을 근거로 ‘prey’를 유지하며 어류로 좁히지 않았으므로, 본문이 가진 긴장을 보존하는 편이 원문 충실합니다.
  doctrine_reference: 원문 어휘 보존 원칙
