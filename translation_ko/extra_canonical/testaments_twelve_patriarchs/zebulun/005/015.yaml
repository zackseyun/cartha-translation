  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Διὰ γὰρ ταῦτα εὐλόγησέ με ὁ¹¹ Κύριος, *καὶ πάντων¹² τῶν ἀδελφῶν μου ἀσθενούντων ἐγὼ ἄνοσος παρῆλθον¹³. οἶδε¹⁴ γὰρ¹⁵ Κύριος ἑκάστου τὴν προαίρεσιν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/015.yaml
  text: For because of these things the Lord blessed me, and when all my brothers were ill, I passed through unharmed. For the Lord knows each person’s intention.
translation:
  language: ko
  text: 이런 일들 때문에 주님께서 저를 복 주셨습니다. 그리고 제 모든 형제들이 병들었을 때에도 저는 무사히 지나갔습니다. 주님께서는 각 사람의 의도를 아십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ ἄνοσος παρῆλθον
  english_pob_choice: I passed through unharmed
  chosen_korean: 저는 무사히 지나갔습니다
  alternatives_korean:
  - 저는 병 없이 지나갔습니다
  - 저는 해를 입지 않고 지나갔습니다
  lexicon: ἄνοσος; παρέρχομαι
  rationale: ἄνοσος는 단순한 ‘병 없음’보다 결과적으로 ‘무사함/무사히’를 더 자연스럽게 드러내므로, 한국어에서는 ‘무사히 지나갔습니다’로 옮겨 병들지 않았다는 대비를 살렸습니다.
- source_word: ἀσθενούντων
  english_pob_choice: all my brothers were ill
  chosen_korean: 제 모든 형제들이 병들었을 때에도
  alternatives_korean:
  - 제 모든 형제들이 아팠을 때에도
  - 제 모든 형제들이 병약했을 때에도
  lexicon: ἀσθενέω
  rationale: ἀσθενούντων은 문자적으로 ‘병들다/약해지다’의 뜻이어서, 평이한 문맥에는 ‘병들었을 때’가 가장 직접적입니다.
- source_word: προαίρεσιν
  english_pob_choice: intention
  chosen_korean: 의도
  alternatives_korean:
  - 뜻
  - 의향
  - 결정
  lexicon: προαίρεσις
  rationale: 이 단어는 단순한 ‘목적’보다 내적 선택과 의도를 가리키므로, POB의 revision인 ‘intention’에 맞추어 ‘의도’로 옮겼습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 이 본문은 야훼 인용 표지가 명시되지 않은 외경 문헌이므로, POB의 ‘Lord’를 한국어 경어 관습에 맞게 ‘주님’으로 번역했습니다.
theological_decisions:
- issue: 하나님의 보호와 인간의 의도에 대한 진술
  chosen_reading: 주님께서 의로운 행동을 보상하시고, 동시에 각 사람의 내적 의도를 아신다는 진술로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 교훈으로만 읽는 방식
  - ‘의도’를 외적 행동이나 결과로 희석하는 방식
  rationale: 본문은 무사함의 원인을 주님의 복 주심과 연결하고, 지식의 대상도 ‘각 사람의 의도’로 특정하므로, 내적 동기까지 아시는 분이라는 점을 보존했습니다.
  doctrine_reference: 하나님의 섭리와 전지
- issue: 주님이 병들지 않은 상태로 지나가게 하셨다는 표현
  chosen_reading: ‘무사히 지나갔습니다’로 옮겨, 질병과 해악의 부재를 함께 드러내었습니다.
  alternative_readings:
  - ‘병 없이 지나갔습니다’
  - ‘상함 없이 지나갔습니다’
  rationale: ἄνοσος는 질병의 부재를 직접 가리키지만, 문맥상 형제들의 질병과 대조되므로 한국어에서는 결과적 안전을 포괄하는 표현이 더 자연스럽습니다.
  doctrine_reference: 보호와 구원
