  source_fidelity: 원문에는 καὶ ὑμεῖς뿐 아니라 추론·강조의 접속사 γοῦν도 포함되어 있습니다. 초안은 이를 반영하지 않아 앞선 문맥으로부터의 결론적 연결이 약화됩니다. ἐὰν διαιρεθῆτε와 ἔσεσθε οὕτως는 각각 조건절의 수동 표현과 미래의 상태 예고를 적절히 유지할 수 있습니다.
  naturalness: ‘그러므로 너희도, 만일 분열되면, 이와 같을 것입니다.’는 현대 표준 한국어의 격식 있는 성경 문체로 자연스럽습니다. ‘서로 나뉘면’도 가능하지만, 원문의 수동형을 더 간결하고 직접적으로 반영하는 ‘분열되면’을 택했습니다.
  terminology: ‘분열되다’는 공동체가 갈라지는 문맥에 맞으며 특정 교파적 해석을 덧붙이지 않습니다. οὕτως의 지시성은 ‘이와 같이’로 보존했습니다.
