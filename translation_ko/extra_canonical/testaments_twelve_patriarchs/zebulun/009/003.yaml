  text: And you also, if you are divided, will be like this.
translation:
  language: ko
  text: 그리고 너희도, 만일 서로 나뉘면, 이와 같을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς
  english_pob_choice: And you also
  chosen_korean: 그리고 너희도
  alternatives_korean:
  - 너희도 또한
  - 또 너희도
  lexicon: καί + ὑμεῖς
  rationale: καί는 여기서 연결과 덧붙임을 나타내므로 ‘그리고’로, ὑμεῖς는 직접 호소를 살려 ‘너희도’로 옮겼습니다.
- source_word: ἐὰν διαιρεθῆτε
  english_pob_choice: if you are divided
  chosen_korean: 만일 서로 나뉘면
  alternatives_korean:
  - 만일 분열되면
  - 만일 갈라지면
  lexicon: ἐὰν + διαιρέω
  rationale: 동사 διαιρεθῆτε는 ‘나뉘다/분리되다’의 수동적 의미가 핵심이어서, 공동체의 갈라짐을 드러내는 ‘서로 나뉘면’으로 번역했습니다.
- source_word: ἔσεσθε οὕτως
  english_pob_choice: will be like this
  chosen_korean: 이와 같을 것입니다
  alternatives_korean:
  - 그렇게 될 것입니다
  - 이렇게 될 것입니다
  lexicon: εἰμί + οὕτως
  rationale: ἔσεσθε는 ‘되다’보다 상태를 예고하는 ‘~일 것입니다’가 자연스럽고, οὕτως는 지시적 표현이므로 ‘이와 같을’로 옮겼습니다.
theological_decisions:
- issue: 분열의 결과를 상태 예고로 표현할지 변화 서술로 표현할지
  chosen_reading: “이와 같을 것입니다”로 현재 상태를 가리키는 결과를 예고하는 문장으로 유지했습니다.
  alternative_readings:
  - “이와 같이 될 것입니다”
  - “이렇게 될 것입니다”
  rationale: 원문은 ‘분열하면 결국 이런 모습이 된다’는 결과 선언에 가깝기 때문에, 과도한 설명 없이 상태 예고를 보존했습니다.
  doctrine_reference: source fidelity / discourse force
