id: T12P.ZEB.9.4
reference: Testament of Zebulun 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. ΓΜὴ οὖν˥¹⁵ *χωρισθῆτε ἐν δυσὶ κεφαλαῖς¹⁶. ὅτι πᾶν ὃ ἐποίησεν ὁ¹⁷ Κύριος κεφαλὴν μίαν κέκτηται¹⁸, *καὶ ὤμους δύο, χεῖρας δύο, πόδας δύο καὶ τὰ λοιπὰ μέλη ἅπαντα¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/004.yaml
  text: Therefore do not be divided into two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members.
translation:
  language: ko
  text: 그러므로 여러분은 두 머리로 나뉘지 마십시오. 주께서 만드신 것은 모두 한 머리와 두 어깨, 두 손, 두 발, 그리고 그 밖의 모든 지체를 가지고 있습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  english_pob_choice: do not be divided into two heads
  chosen_korean: 두 머리로 나뉘지 마십시오
  alternatives_korean:
  - 두 머리 아래로 갈라지지 마십시오
  - 두 머리로 분열되지 마십시오
  lexicon: χωρίζω + κεφαλή
  rationale: 영문 POB의 ‘divided into two heads’를 따라, 공동체의 분열상을 자연스러운 한국어로 옮기면서도 ‘머리’ 이미지를 그대로 살렸습니다.
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 하나님께서
  lexicon: κύριος
  rationale: 본문의 Κύριος를 신적 호칭으로 반영해 ‘주께서’로 옮겼습니다.
- source_word: κεφαλὴν μίαν κέκτηται
  english_pob_choice: has one head
  chosen_korean: 한 머리를 가지고 있습니다
  alternatives_korean:
  - 머리가 하나 있습니다
  - 한 머리를 지니고 있습니다
  lexicon: κεφαλή + κτάομαι
  rationale: ‘가지다/지니다’로 소유 상태를 나타내어, 한 몸의 통일성을 강조하는 원문의 구조를 보존했습니다.
- source_word: καὶ ὤμους δύο, χεῖρας δύο, πόδας δύο καὶ τὰ λοιπὰ μέλη ἅπαντα
  english_pob_choice: and two shoulders, two hands, two feet, and all the other members
  chosen_korean: 두 어깨, 두 손, 두 발, 그리고 그 밖의 모든 지체
  alternatives_korean:
  - 두 어깨, 두 손, 두 발, 그리고 나머지 모든 지체
  - 두 어깨와 두 손과 두 발과 그 밖의 모든 지체
  lexicon: ὦμοι, χεῖρες, πόδες, μέλη
  rationale: 열거된 신체 부위를 직역하되, ‘members’를 교회적 은유에 가까운 ‘지체’로 옮겨 전체 대비를 살렸습니다.
theological_decisions:
- issue: ‘two heads’ image and communal unity
  chosen_reading: 공동체는 두 머리로 갈라진 상태가 아니라, 한 머리를 가진 한 몸처럼 하나여야 한다는 뜻으로 읽었습니다.
  alternative_readings:
  - 정치적 지도 체제에 대한 비유로만 제한하는 읽기
  - 단순한 신체 묘사로 약화시키는 읽기
  rationale: 본문은 하나님이 만드신 몸의 통일된 구조를 근거로 분열을 경고하므로, 단순 묘사보다 공동체적 권면으로 반영하는 것이 자연스럽습니다.
  doctrine_reference: 공동체의 일치와 분열 경계
- issue: Κύριος의 번역
  chosen_reading: 본문의 ‘주’는 창조주를 가리키는 신적 호칭으로 보아 ‘주께서’로 옮겼습니다.
  alternative_readings:
  - 일반적 주인/주로 옮기는 읽기
  - 하나님으로 명시하는 읽기
  rationale: 문맥상 창조 행위의 주체이므로 신적 호칭을 유지하되, 원문의 호칭 자체를 보존했습니다.
  doctrine_reference: 하나님의 창조 주권
