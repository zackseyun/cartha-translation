review_pass:
  verdict: revise
  source_fidelity: 원문의 미래 수동 표현(‘포로가 될 것이며/고난을 당할 것이다’), ‘민족들 가운데서’, 그리고 ἀσθενείαις와 θλίψεσιν의 병렬을 전반적으로 충실히 반영합니다. 다만 αἰχμαλωτεύω에 ‘포로로 사로잡다’는 뜻이 겹쳐 다소 무겁습니다.
  naturalness: ‘포로로 잡아가다’가 현대 표준 한국어에서 더 자연스럽고 간결합니다. 또한 ‘많은 약함’은 한국어에서 어색하므로, 넓은 의미의 ἀσθένεια를 과도하게 질병으로 한정하지 않는 ‘많은 쇠약’으로 다듬는 것이 적절합니다.
  terminology: ‘원수’, ‘포로’, ‘민족’, ‘환난’은 문맥과 합쇼체 문체에 적절합니다. ἔθνη에 ‘이방’이라는 해석적 한정을 더하지 않은 점도 타당합니다.
  issues:
  - severity: low
    issue: ‘포로로 사로잡을’의 의미 중복
    rationale: ‘사로잡다’ 자체가 포획의 뜻을 지녀 ‘포로로’와 결합할 때 중복감이 있습니다. αἰχμαλωτεύω의 강제 이송 의미를 살리는 ‘포로로 잡아가다’가 자연스럽습니다.
  - severity: medium
    issue: ‘많은 약함’의 비자연스러운 한국어 표현
    rationale: ἀσθενείαις는 약함·쇠약·허약 등 폭넓은 의미이나, ‘많은 약함’은 현대 한국어에서 부자연스럽습니다. ‘많은 쇠약’은 신체적·전반적 취약 상태를 보존하면서도 질병으로 단정하지 않습니다.
  revised_text: 그리고 너희의 원수들이 너희를 포로로 잡아갈 것이며, 너희는 여러 민족 가운데서 많은 쇠약과 환난을 겪게 될 것입니다.
