  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/006.yaml
  text: And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses.
translation:
  language: ko
  text: 그리고 너희의 원수들이 너희를 포로로 잡아갈 것이며, 너희는 여러 민족 가운데서 많은 쇠약과 환난을 겪게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωτεύσουσιν ὑμᾶς
  english_pob_choice: will take you captive
  chosen_korean: 너희를 포로로 사로잡을 것이며
  alternatives_korean:
  - 너희를 사로잡을 것이며
  - 너희를 포로로 끌고 갈 것이며
  lexicon: αἰχμαλωτεύω
  rationale: 포로로 잡아 가는 강한 강제성을 살리기 위해 ‘포로로 사로잡다’를 선택했습니다.
- source_word: κακωθήσεσθε
  english_pob_choice: will be afflicted
  chosen_korean: 고통을 받게 될 것입니다
  alternatives_korean:
  - 괴로움을 당하게 될 것입니다
  - 해를 입게 될 것입니다
  lexicon: κακόω
  rationale: 단순한 불편이 아니라 해를 입고 고통받는 상태를 드러내기 위해 ‘고통을 받다’로 옮겼습니다.
- source_word: ἐν ἔθνεσιν
  english_pob_choice: among the nations
  chosen_korean: 여러 민족들 가운데서
  alternatives_korean:
  - 나라들 가운데서
  - 이방 민족들 가운데서
  lexicon: ἔθνη
  rationale: 문맥상 특정 국가명보다 이민족 집단 전체를 가리키므로 ‘민족들’로 옮기되, 위치를 나타내는 ‘가운데서’를 보존했습니다.
- source_word: ἀσθενείαις καὶ θλίψεσιν
  english_pob_choice: with many weaknesses and distresses
  chosen_korean: 많은 약함과 환난
  alternatives_korean:
  - 많은 연약함과 환난
  - 많은 질병과 고난
  lexicon: ἀσθένεια, θλῖψις
  rationale: ἀσθένεια를 병증으로만 한정하지 않고 ‘약함’으로 넓게 살리며, θλῖψις는 압박·고난의 의미를 ‘환난’으로 유지했습니다.
