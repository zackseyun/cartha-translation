id: T12P.ZEB.9.2
reference: Testament of Zebulun 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἐὰν⁸ δὲ εἰς πολλὰ διαιρεθῶσιν⁹, ἡ γῆ ἀφανίζει¹⁰ αὐτά, *καὶ γίνονται¹¹ εὐκαταφρόνητα¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/002.yaml
  text: But if they are divided into many parts, the earth destroys them, and they become easy to despise.
translation:
  language: ko
  text: 그러나 그것들이 여러 부분으로 나뉘면, 땅이 그것들을 멸망시키고, 그것들은 쉽게 업신여김을 받게 됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πολλὰ διαιρεθῶσιν
  english_pob_choice: they are divided into many parts
  chosen_korean: 여러 부분으로 나뉘면
  alternatives_korean:
  - 많은 부분으로 나뉘면
  - 여러 조각으로 나뉘면
  - 여럿으로 갈라지면
  lexicon: διαιρέω
  rationale: POB의 수정본이 'parts'로 좁혀 가리키는 분할을 반영해, 해석적 요소를 줄이고 자연스러운 현대 한국어로 '여러 부분으로 나뉘면'이라고 옮겼습니다.
- source_word: ἡ γῆ ἀφανίζει αὐτά
  english_pob_choice: the earth destroys them
  chosen_korean: 땅이 그것들을 멸망시키고
  alternatives_korean:
  - 땅이 그것들을 없애고
  - 땅이 그것들을 파괴하고
  - 땅이 그것들을 삼키고
  lexicon: ἀφανίζω
  rationale: 영문 POB의 'destroys'에 맞추되, 원문의 강한 소멸 의미를 살려 '멸망시키고'로 옮겼습니다. '삼키다'는 설명을 더하는 방향이어서 피했습니다.
- source_word: εὐκαταφρόνητα γίνονται
  english_pob_choice: they become easy to despise
  chosen_korean: 그것들은 쉽게 업신여김을 받게 됩니다
  alternatives_korean:
  - 그것들은 쉽게 멸시받게 됩니다
  - 그것들은 업신여기기 쉬운 대상이 됩니다
  - 그것들은 쉽게 경멸받게 됩니다
  lexicon: εὐκαταφρόνητος
  rationale: 형용사의 뜻을 수동적 결과로 풀어, 원문이 말하는 '경시되기 쉬운 상태'를 한국어의 자연스러운 표현으로 재현했습니다.
theological_decisions:
- issue: '''땅''의 의인화된 파괴 작용을 어떻게 유지할지'
  chosen_reading: 자연을 단순 배경이 아니라 분열된 것을 무너뜨리는 능동적 주체로 유지했습니다.
  alternative_readings:
  - '''토지가 그것들을 없애고''처럼 더 중성적으로 옮김'
  - '''땅이 그것들을 삼키고''로 이미지화함'
  rationale: 원문은 ἡ γῆ를 주어로 두어 파괴 작용을 분명히 하므로, 이를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 원문 수사와 창조 세계의 능동적 역할에 대한 서술
