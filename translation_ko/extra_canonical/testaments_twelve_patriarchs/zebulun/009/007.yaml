revisions:
- from: 그리고 이 일들 뒤에 주님을 기억하면, 여러분은 돌아올 것이며 그분은 여러분에게 자비를 베푸실 것입니다. 그분은 자비롭고 긍휼이 많으시며, 사람의 자손들에게 악을 돌리지 않으십니다. 왜냐하면 그들은 육체이며 자기의 악한 행실 가운데서 길을 잃기 때문입니다.[a]
  to: 그리고 이 일들 뒤에 여러분이 주님을 기억하면, 여러분은 돌아올 것이며 그분은 여러분에게 자비를 베푸실 것입니다. 그분은 자비로우시고 긍휼이 많으시며, 사람들에게 악을 돌리지 않으십니다. 그들이 육체이고 자기들의 악한 행실 가운데서 헤매기 때문입니다.
  rationale: 정의되지 않은 [a] 앵커를 삭제했습니다. 또한 여격 구문의 귀속 대상을 한국어에서 자연스럽고 분명하게 옮기고, πλανῶνται의 의미를 ‘헤매다’로 다듬었습니다. 신학적 해석을 추가하지 않았으며, 원문의 인간적 연약함과 악한 행실이라는 인과 진술을 유지했습니다.
