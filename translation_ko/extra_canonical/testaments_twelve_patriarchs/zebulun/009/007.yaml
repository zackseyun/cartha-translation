reference: Testament of Zebulun 9:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Καὶ μετὰ ταῦτα μνησθέντες Κύριον †ἐπιστρέψετε³³ καὶ ἐλεήσει³⁴ ὑμᾶς, ὅτι ἐλεήμων ἐστὶ καὶ εὔσπλαγχνος, *καὶ οὐ λογίζεται³⁵ κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων διότι σάρξ εἰσιν καὶ πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/007.yaml
  text: And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go astray in their evil deeds.
translation:
  language: ko
  text: 그리고 이 일들 뒤에 주님을 기억하면, 여러분은 돌아올 것이며 그분은 여러분에게 자비를 베푸실 것입니다. 그분은 자비롭고 긍휼이 많으시며, 사람의 자손들에게 악을 돌리지 않으십니다. 왜냐하면 그들은 육체이며 자기의 악한 행실 가운데서 길을 잃기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 문맥상 예수 호칭이 아니라 하나님을 가리키는 일반적 ‘주님’이 가장 자연스럽고, 본문이 직접 야훼 인용 표지를 갖지는 않아 기본 호칭을 유지했습니다.
- source_word: ἐπιστρέψετε
  english_pob_choice: you will return
  chosen_korean: 돌아올 것이며
  alternatives_korean:
  - 돌이킬 것이며
  - 회개할 것이며
  lexicon: ἐπιστρέφω
  rationale: 이 동사는 단순한 이동보다 하나님께로의 귀환을 포함할 수 있지만, 여기서는 영어 POB처럼 예언적 결과 진술을 살려 직역에 가까운 ‘돌아오다’를 택했습니다.
- source_word: ἐλεήσει
  english_pob_choice: he will have mercy on you
  chosen_korean: 여러분에게 자비를 베푸실 것입니다
  alternatives_korean:
  - 여러분을 긍휼히 여기실 것입니다
  - 여러분에게 긍휼을 베푸실 것입니다
  lexicon: ἐλεέω
  rationale: 동사의 자비 행위를 한국어에서 자연스럽게 풀어 주는 표현으로 옮겼고, 대상 여격을 ‘여러분에게’로 유지해 Greek dative의 방향을 드러냈습니다.
- source_word: ἐλεήμων … εὔσπλαγχνος
  english_pob_choice: merciful and compassionate
  chosen_korean: 자비롭고 긍휼이 많으시며
  alternatives_korean:
  - 자비롭고 불쌍히 여기시는
  - 자비롭고 동정이 깊으시며
  lexicon: ἐλεήμων; εὔσπλαγχνος
  rationale: 두 형용사의 중복을 평행적으로 살리되, 전통적 교회어보다 본문 의미를 직접 드러내는 ‘긍휼이 많으시며’를 선택했습니다.
- source_word: οὐ λογίζεται κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων
  english_pob_choice: he does not reckon wickedness to the sons of men
  chosen_korean: 사람의 자손들에게 악을 돌리지 않으십니다
  alternatives_korean:
  - 사람의 자손들에게 악을 계산하지 않으십니다
  - 사람의 자손들의 악을 헤아리지 않으십니다
  lexicon: λογίζομαι; κακία; υἱοὶ τῶν ἀνθρώπων
  rationale: ‘reckon’의 회계적/법정적 뉘앙스를 살리되 한국어에서는 ‘돌리다’가 책임 귀속을 잘 드러내어, 개정된 영어 POB의 여격 의미와도 맞추었습니다.
- source_word: σάρξ εἰσιν
  english_pob_choice: because they are flesh
  chosen_korean: 왜냐하면 그들은 육체이며
  alternatives_korean:
  - 왜냐하면 그들은 육이며
  - 왜냐하면 그들은 육신이며
  lexicon: σάρξ
  rationale: 여기서는 인간의 연약하고 유한한 상태를 설명하는 문맥이므로, 신학적 용례를 과도하게 좁히지 않는 ‘육체’로 옮겼습니다.
theological_decisions:
- issue: 하나님에 대한 호칭을 야훼로 옮길지 여부
  chosen_reading: 본문의 Κύριον은 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 인용 표지나 명시적 야훼 대치가 드러나지 않는 일반 호칭으로 읽히므로, POB 기본 호칭을 따르되 한국어에서의 자연성을 우선했습니다.
  doctrine_reference: 그리스어 κύριος의 문맥적 호칭 처리 원칙
