base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/001.yaml
  text: Therefore pay attention to the waters, and understand that when they flow together to the same place, they carry down stones, wood, earth, and various other things.
translation:
  language: ko
  text: 그러므로 물을 잘 살펴보십시오. 물들이 함께 같은 곳으로 흐를 때 돌과 나무와 흙과 여러 다른 것들을 쓸어 내려간다는 것을 깨달으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε Γοὖν ἐπὶ τὰ ὕδατα
  english_pob_choice: Therefore pay attention to the waters
  chosen_korean: 그러므로 물들을 주의하십시오
  alternatives_korean:
  - 그러므로 물에 주의를 기울이십시오
  - 그러므로 물들을 살펴보십시오
  lexicon: προσέχετε / ὕδατα
  rationale: προσέχετε는 단순 관찰보다 경계하며 주의를 기울이라는 뜻이므로 ‘주의하십시오’로 옮겼고, 복수형 ‘물들’은 일반적 물질보다 여러 물줄기/흐름을 가리키는 문맥을 살렸습니다.
- source_word: ὅταν πορεύονται ἐπὶ τὸ αὐτό
  english_pob_choice: when they flow together to the same place
  chosen_korean: 그 물들이 같은 곳으로 함께 흐를 때
  alternatives_korean:
  - 그들이 한곳으로 갈 때
  - 같은 곳을 향해 흐를 때
  lexicon: πορεύονται / ἐπὶ τὸ αὐτό
  rationale: 영어 POB의 ‘flow together to the same place’를 따라, 물의 이동을 자연스럽게 드러내는 ‘함께 흐를 때’를 택했고 ἐπὶ τὸ αὐτό의 수렴 의미는 ‘같은 곳으로’로 반영했습니다.
- source_word: κατασύρουσιν
  english_pob_choice: carry down
  chosen_korean: 쓸어 내려간다는
  alternatives_korean:
  - 끌어내린다는
  - 내려보낸다는
  lexicon: κατασύρω
  rationale: κατασύρω는 아래로 끌어내리며 휩쓸어 가는 동작이므로, 단순 운반보다 강한 역동성을 가진 ‘쓸어 내려간다’로 옮겼습니다.
