review_pass:
  verdict: revise
  source_fidelity: 그리스어의 핵심 구조와 의미는 대체로 충실합니다. 다만 προσέχετε ἐπὶ τὰ ὕδατα는 한국어에서 목적어를 바로 취하는 ‘물들을 주의하십시오’보다 ‘물을 잘 살펴보십시오’가 자연스럽고, γνῶτε는 이 문맥에서 ‘이해하십시오’보다 ‘깨달으십시오’가 더 직접적입니다. ἐπὶ τὸ αὐτό의 함께 모여 같은 곳으로 향하는 뜻과 κατασύρουσιν의 아래로 휩쓸어 가는 뜻은 유지했습니다.
  naturalness: 초안의 ‘물들을 주의하십시오’는 현대 표준 한국어에서 다소 비문에 가깝고 번역투입니다. ‘물을 잘 살펴보십시오’와 ‘깨달으십시오’로 고치면 합쇼체를 유지하면서도 자연스럽습니다.
  terminology: 신학적 전문 용어 및 고유명사는 없습니다. ‘돌과 나무와 흙과 여러 다른 것들’, ‘쓸어 내려가다’는 문맥과 어휘에 적절합니다.
  issues:
  - severity: medium
    issue: ‘물들을 주의하십시오’의 결합이 부자연스럽습니다.
    rationale: ‘주의하다’는 보통 위험·사항 등을 목적어로 받거나 ‘~에 주의를 기울이다’로 씁니다. 여기서는 물의 움직임을 관찰하여 교훈을 얻으라는 비유적 권면이므로 ‘물을 잘 살펴보십시오’가 자연스럽고 의미를 보존합니다.
  - severity: low
    issue: γνῶτε를 ‘이해하십시오’로 옮긴 표현이 다소 추상적입니다.
    rationale: 명령형 γνῶτε는 ‘알라/깨달으라’에 가깝습니다. 이어지는 관찰 사실을 통해 파악하라는 문맥에는 ‘깨달으십시오’가 더 적절합니다.
  revised_text: 그러므로 물을 잘 살펴보십시오. 물들이 함께 같은 곳으로 흐를 때 돌과 나무와 흙과 여러 다른 것들을 쓸어 내려간다는 것을 깨달으십시오.
