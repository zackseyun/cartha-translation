source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. Καὶ μετὰ ταῦτα⁴⁵ ἀνατελεῖ⁴⁶ ⌜ὑμῖν⌝ *αὐτὸς ὁ⁴⁷ Κύριος, *φῶς δικαιοσύνης⁴⁸,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/008.yaml
  text: And after these things the Lord himself will rise for you, the light of righteousness.
translation:
  language: ko
  text: 그리고 이 일들 후에 주님 자신이 여러분을 위하여 의의 빛으로 떠오르실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  english_pob_choice: And after these things
  chosen_korean: 그리고 이 일들 후에
  alternatives_korean:
  - 그리고 그 후에
  - 그 일들 뒤에
  lexicon: μετά + ταῦτα
  rationale: 전후 문맥의 사건들을 가리키는 복수 지시어를 살려 자연스러운 현대어로 옮겼습니다.
- source_word: ἀνατελεῖ
  english_pob_choice: will rise
  chosen_korean: 나타나실
  alternatives_korean:
  - 일어나실
  - 떠오르실
  - 비치실
  lexicon: ἀνατέλλω
  rationale: 문맥상 천체의 물리적 ‘떠오름’보다 인격적 현현을 한국어로 자연스럽게 드러내기 위해 ‘나타나실’을 택했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: κύριος
  rationale: 문맥의 주어가 인격적으로 ‘자신이’ 오시는 분이므로, 한국어 독자에게 가장 자연스럽고 경외를 담은 ‘주님’을 사용했습니다.
- source_word: φῶς δικαιοσύνης
  english_pob_choice: the light of righteousness
  chosen_korean: 의의 빛
  alternatives_korean:
  - 의의 빛
  - 공의의 빛
  lexicon: φῶς + δικαιοσύνη
  rationale: 직역 구조를 유지하되, δικαιοσύνη를 이 문맥의 핵심 신학어인 ‘의’로 보존했습니다.
theological_decisions:
- issue: 주어와 술어의 결합 방식
  chosen_reading: ‘주님 자신이 여러분에게 나타나실 것이며’로 옮겨, 주체적 현현을 분명히 했습니다.
  alternative_readings:
  - ‘주님 자신이 여러분을 위하여 일어나실 것입니다’
  - ‘주님 자신이 여러분에게 떠오르실 것입니다’
  rationale: ἀνατελεῖ는 기본적으로 ‘돋다/떠오르다’이지만, 본문은 인격적 구원자 현현을 말하므로 의미를 과도하게 자연 현상으로 제한하지 않도록 했습니다.
  doctrine_reference: 메시아의 현현과 계시적 도래
- issue: ‘의의 빛’의 표현
  chosen_reading: 비유를 유지한 채 그대로 옮겨, 주님이 의를 드러내는 빛으로 제시된다는 점을 살렸습니다.
  alternative_readings:
  - ‘의로우신 빛’
  - ‘의의 빛 되시는 분’
  rationale: 원문은 명사구로 짧게 병렬되므로, 설명을 덧붙이기보다 상징성을 유지하는 편이 원문에 가깝습니다.
  doctrine_reference: 메시아적 빛과 의의 계시
