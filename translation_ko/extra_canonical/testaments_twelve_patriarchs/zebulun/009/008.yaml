  to: 그리고 이 일들 후에 주님 자신이 여러분을 위하여 의의 빛으로 떠오르실 것입니다.
  rationale: ‘떠오르실 것입니다’로 ἀνατέλλω의 빛 관련 은유를 보존하고, ‘의의 빛으로’를 통해 원문의 동격 명사구를 한국어에서 자연스럽게 연결했습니다. ‘여러분을 위하여’는 제시된 ⌜ὑμῖν⌝을 반영합니다.
