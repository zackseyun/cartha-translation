review_pass:
  verdict: revise
  source_fidelity: ἀνατελεῖ는 ‘나타나다’보다 본래 ‘떠오르다/돋다’의 빛 이미지를 지니며, 뒤따르는 ‘의의 빛’과도 긴밀히 연결됩니다. 또한 φῶς δικαιοσύνης는 독립된 서술어가 아니라 주님을 동격으로 규정하는 명사구입니다. ⌜ὑμῖν⌝은 제시 본문에 포함되어 있으므로 ‘여러분을 위하여’로 반영했습니다.
  naturalness: 초안의 ‘의의 빛이십니다’는 미래 동사 ‘나타나실 것이며’와 현재의 종결 서술을 부자연스럽게 결합합니다. ‘의의 빛으로 떠오르실 것입니다’는 현대 표준어 합쇼체로 자연스럽고 원문의 비유적 결속도 보존합니다.
  terminology: Κύριος는 문헌의 경외적 호칭으로 ‘주님’이 적절하며, δικαιοσύνη는 ‘의’로 유지합니다. ‘의의 빛’은 말라기 등의 표현을 직접 단정하거나 교리적으로 확대하지 않고 원문의 명사구를 보존합니다.
  issues:
