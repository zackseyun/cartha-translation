  - severity: medium
    issue: ‘의의 빛이십니다’라는 독립 현재 서술
    rationale: 원문은 ‘주님 자신’과 ‘의의 빛’을 동격으로 둔 미래 문장입니다. 초안은 시제와 문장 결속을 바꾸어 의미 관계가 불명료해집니다.
  revised_text: 그리고 이 일들 후에 주님 자신이 여러분을 위하여 의의 빛으로 떠오르실 것입니다.
