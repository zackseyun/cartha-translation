base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/005.yaml
  text: For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow after two kingdoms, and you will commit every abomination.
translation:
  language: ko
  text: 나는 내 조상들의 기록에서 너희가 이스라엘 안에서 분열되고, 두 왕국을 따르며, 모든 가증한 일을 행할 것을 알았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων ... ἐν γραφῇ τῶν πατέρων μου
  english_pob_choice: I have learned from the writings of my fathers
  chosen_korean: 우리 조상들의 글에서 배운 바에 따르면
  alternatives_korean:
  - 우리 조상들의 기록에서 알게 되었습니다
  - 내 아버지들의 글에서 알게 되었습니다
  lexicon: ἐν γραφῇ / πατέρων
  rationale: γραφή를 단순한 ‘성경’으로 좁히지 않고, 조상들의 문서·기록이라는 뜻이 드러나도록 ‘글’로 옮겼습니다. πατέρων은 문맥상 족장/조상들을 가리키므로 ‘우리 조상들’이 자연합니다.
- source_word: Διαιρεθήσεσθε ἐν Ἰσραήλ
  english_pob_choice: you will be divided in Israel
  chosen_korean: 이스라엘에서 분열될 것이며
  alternatives_korean:
  - 이스라엘 안에서 갈라질 것이며
  - 이스라엘 가운데서 나뉠 것이며
  lexicon: διαιρεθήσεσθε
  rationale: 수동 미래의 분열·분할을 직역하되, 공동체 내부의 해체를 드러내기 위해 ‘분열될 것’으로 옮겼습니다.
- source_word: δύο βασιλείαις ἐξακολουθήσετε
  english_pob_choice: you will follow after two kingdoms
  chosen_korean: 두 왕국을 따르게 될 것이고
  alternatives_korean:
  - 두 왕국을 뒤따르게 될 것이고
  - 두 왕국을 좇게 될 것이고
  lexicon: ἐξακολουθήσετε / βασιλείαις
  rationale: ἐξακολουθέω의 ‘뒤를 따르다, 따르다’라는 뉘앙스를 살려 ‘따르게 될 것’으로 옮겼습니다. βασιλείαις는 문맥상 실제 지배체제인 ‘왕국들’이 적절합니다.
- source_word: πᾶν βδέλυγμα ποιήσετε
  english_pob_choice: you will commit every abomination
  chosen_korean: 모든 가증한 일을 행할 것이고
  alternatives_korean:
  - 모든 가증한 일을 저지를 것이고
  - 모든 혐오스러운 일을 할 것이고
  lexicon: βδέλυγμα / ποιήσετε
  rationale: βδέλυγμα은 도덕적·종교적 혐오를 나타내는 표준적 대응어인 ‘가증한 일’로 옮겼고, ποιέω는 여기서 단순 행위보다 범죄적 실행의 뉘앙스를 살려 ‘행하다’로 처리했습니다.
theological_decisions:
- issue: 이스라엘의 분열과 두 왕국 언급의 예언적 경고성
  chosen_reading: 이 구절은 장차 이스라엘 내부의 분열과 우상숭배적 불순종을 경고하는 예언적 진술로 읽었습니다.
  alternative_readings:
  - 단순한 역사 서술로만 읽는 방식
  - 후대 왕국 분열사에 대한 회고로만 읽는 방식
  rationale: 본문은 미래형 동사들과 ‘모든 가증한 일’의 결합으로 경고의 성격이 강하므로, 단순 설명보다 예언적 선언으로 유지하는 편이 원문 힘을 보존합니다.
  doctrine_reference: testamentary exhortation / prophetic warning
