  source_fidelity: 초안은 미래 수동형 ‘분열될 것이며’, ‘두 왕국을 따르다’, ‘가증한 일을 행하다’를 대체로 충실히 반영합니다. 다만 Ἔγνων은 조건을 나타내지 않으므로 ‘배운 바에 따르면’보다 ‘알았습니다’가 직접적이며, τῶν πατέρων μου는 화자의 소유를 따라 ‘우리 조상들’보다 ‘내 조상들’이 적절합니다. ἐν Ἰσραήλ은 ‘이스라엘 안에서’로 옮겨 공동체 내부라는 범위를 분명히 했습니다.
  naturalness: 합쇼체의 자연스러운 문장으로, 인식 내용절을 ‘너희가 … 할 것을 알았습니다’로 구성하면 원문의 종속절 관계가 분명해집니다. 병렬된 미래 진술은 ‘분열되고, 따르며, 행할 것입니다’로 매끄럽게 연결됩니다.
  terminology: ‘기록’은 γραφή를 특정 정경 성경으로 한정하지 않으면서 문서화된 전승이라는 뜻을 전달합니다. ‘왕국’, ‘가증한 일’은 βασιλεία와 βδέλυγμα의 정치적·종교윤리적 어감을 보존합니다.
