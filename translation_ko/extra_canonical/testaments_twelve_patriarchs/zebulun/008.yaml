  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008.yaml
  text: 'And so, my children, have compassion toward every person with mercy, so that the Lord also, having had compassion on you, may show you mercy. For indeed in the last days God will send his compassion upon the earth, and wherever he finds merciful compassion, there he dwells. For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.


    And when we went down into Egypt, Joseph did not hold a grudge against us. Giving heed to him, then, you also, my children, love one another, and let each one not reckon evil against his brother. For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.'
translation:
  language: ko
  text: '그러므로 너희도, 내 자녀들아, 모든 사람에게 긍휼로 동정하십시오. 그러면 주님도 너희에게 긍휼을 베푸시려고 너희를 동정하실 것입니다. 참으로 마지막 날들에 하나님께서 자신의 긍휼을 땅에 보내실 것이며, 긍휼의 자비를 발견하는 곳마다 그분이 거기에 거하실 것입니다. 사람이 자기 이웃에게 동정하는 만큼 주님도 그에게 그만큼 동정하십니다.


    우리가 이집트로 내려갔을 때 요셉은 우리에게 원한을 품지 않았습니다. 그러므로 너희도, 내 자녀들아, 그를 유의하여 서로 사랑하고, 각자 자기 형제에 대하여 악을 헤아리지 마십시오. 이것이 하나됨을 나누고, 모든 친족을 흩으며, 영혼을 괴롭게 하고, 얼굴을 일그러지게 하기 때문입니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνία / σπλαγχνίζομαι
  english_pob_choice: have compassion / having had compassion / merciful compassion
  chosen_korean: 동정하다 / 긍휼로 동정하다 / 긍휼의 자비
  alternatives_korean:
  - 긍휼을 베풀다
  - 불쌍히 여기다
  - 마음이 움직이다
  lexicon: εὐσπλαγχνία, σπλαγχνίζομαι
  rationale: 본문은 단순한 친절보다 ‘내장/심정에서 우러난 연민’을 가리키므로, 핵심 뜻인 동정에 긍휼을 덧붙여 감정적·자비적 뉘앙스를 함께 살렸습니다.
- source_word: ἐλέος / ἐλεήσῃ
  english_pob_choice: mercy / may show you mercy
  chosen_korean: 긍휼 / 긍휼을 베푸시다
  alternatives_korean:
  - 자비
  - 은혜
  - 불쌍히 여기시다
  lexicon: ἐλέος
  rationale: POB의 mercy를 단순 반복하지 않고, 한국어에서 문맥상 가장 자연스러운 ‘긍휼’과 ‘긍휼을 베푸시다’로 옮겨 행위성과 자비성을 함께 드러냈습니다.
- source_word: μνησικακέω
  english_pob_choice: hold a grudge
  chosen_korean: 원한을 품다
  alternatives_korean:
  - 앙심을 품다
  - 악의를 품다
  - 마음에 담아두다
  lexicon: μνησικακέω
  rationale: 이 동사는 과거의 해를 기억하며 악감정을 간직하는 뜻이므로, 한국어 관용에 맞는 ‘원한을 품다’가 가장 직접적입니다.
- source_word: λογίζεσθε κακίαν
  english_pob_choice: reckon evil
  chosen_korean: 악을 헤아리다
  alternatives_korean:
  - 악으로 여기다
  - 악을 계산하다
  - 악으로 간주하다
  lexicon: λογίζομαι
  rationale: 직역적 구조를 살리면서도 한국어에서 의미가 통하도록 ‘헤아리다’를 택해, 타인에게 악을 산정·계산해 두는 태도를 드러냈습니다.
theological_decisions:
- issue: 마지막 날들에 하나님께서 ‘자신의 긍휼’을 보내신다는 표현
  chosen_reading: 문맥의 반복을 따라 ‘자신의 긍휼’로 두어, 하나님으로부터 발출되는 자비가 인격적으로 땅에 임한다는 이미지를 살렸습니다.
  alternative_readings:
  - 하나님의 긍휼
  - 그분의 자비
  - 긍휼의 영
  rationale: 원문은 단순한 추상 명사가 아니라 하나님의 내적 긍휼이 파송되는 듯한 표현을 사용하므로, 이를 평탄화하지 않고 유지했습니다.
  doctrine_reference: 자비의 파송과 임재에 대한 묵시적 표현
