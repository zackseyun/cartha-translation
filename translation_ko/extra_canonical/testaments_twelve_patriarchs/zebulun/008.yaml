revisions:
- from: '그러므로 너희도, 내 자녀들아, 모든 사람에게 긍휼로 동정하십시오. 그러면 주님도 너희에게 긍휼을 베푸시려고 너희를 동정하실 것입니다. 참으로 마지막 날들에 하나님께서 자신의 긍휼을 땅에 보내실 것이며, 긍휼의 자비를 발견하는 곳마다 그분이 거기에 거하실 것입니다. 사람이 자기 이웃에게 동정하는 만큼 주님도 그에게 그만큼 동정하십니다.


    우리가 이집트로 내려갔을 때 요셉은 우리에게 원한을 품지 않았습니다. 그러므로 너희도, 내 자녀들아, 그를 유의하여 서로 사랑하고, 각자 자기 형제에 대하여 악을 헤아리지 마십시오. 이것이 하나됨을 나누고, 모든 친족을 흩으며, 영혼을 괴롭게 하고, 얼굴을 일그러지게 하기 때문입니다.[a][b]'
