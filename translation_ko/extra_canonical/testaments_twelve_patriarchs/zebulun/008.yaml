  source_fidelity: 초안은 대체로 원문의 권면과 논지를 충실히 따릅니다. 그러나 2절의 ἐν αὐτῷ는 ‘그곳’이 아니라 긍휼을 지닌 ‘그 사람 안에/그와 함께’ 거하신다는 뜻으로 옮기는 것이 문법과 문맥에 더 맞습니다. 또한 5절의 προσέχοντες εἰς ὃν은 요셉을 본보기로 삼는 흐름을 나타내므로 이를 드러냈습니다.
  naturalness: ‘긍휼로 동정하십시오’, ‘긍휼의 자비’, ‘그를 유의하여’, ‘하나됨을 나누고’는 현대 한국어에서 다소 중복되거나 부자연스럽습니다. 반복되는 어근은 ‘긍휼을 베풀다/긍휼히 여기다’로 자연스럽게 유지하고, 권면문의 연결과 병렬을 다듬었습니다.
  terminology: σπλάγχνα 및 관련 동사는 ‘긍휼’과 ‘긍휼히 여기다’로, ἐλέος는 ‘자비’로 구별하여 옮겼습니다. μνησικακέω는 ‘원한을 품다’, λογίζεσθε κακίαν은 문맥상 ‘악한 일을 마음에 두다’로 번역했습니다.
