id: T12P.ZEB.10.5
reference: Testament of Zebulun 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: X. Καὶ νῦν τέκνα μου, μὴ λυπεῖσθε *ὅτι ἀποθνῄσκω¹, μηδὲ συμπέσητε² ὅτι ἀπολήγω³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/005.yaml
  text: And now, my children, do not be grieved that I am dying, nor fall down that I am coming to my end.
translation:
  language: ko
  text: 이제, 내 자녀들아, 내가 죽는다고 해서 슬퍼하지 말고, 내가 내 생을 마친다고 해서 쓰러지지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접 호칭인 ‘my children’을 자연스러운 합쇼체로 옮기되, 정서적 친밀감을 살리면서도 구어체로 과도하게 내려가지 않도록 ‘자녀들아’를 택했습니다.
- source_word: μὴ λυπεῖσθε
  english_pob_choice: do not be grieved
  chosen_korean: 슬퍼하지 말고
  alternatives_korean:
  - 근심하지 말고
  - 마음 아파하지 말고
  lexicon: λυπέω
  rationale: 수동적 감정 상태를 나타내는 동사를 한국어에서는 가장 직접적인 반응 표현인 ‘슬퍼하다’로 자연스럽게 옮겼습니다.
- source_word: ἀποθνῄσκω / ἀπολήγω
  english_pob_choice: I am dying / I am coming to my end
  chosen_korean: 내가 죽는다고 해서 … 내가 내 끝에 이른다고 해서
  alternatives_korean:
  - 내가 죽어 간다고 해서 … 내 종말에 이른다고 해서
  - 내가 생을 마친다고 해서 … 끝에 이른다고 해서
  lexicon: ἀποθνῄσκω, ἀπολήγω
  rationale: 앞절의 ‘죽는다’와 평행을 살리면서, 뒤절은 ‘coming to my end’의 종결성·완결성을 드러내기 위해 ‘내 끝에 이르다’로 옮겼습니다.
theological_decisions:
- issue: 죽음과 종결에 대한 감정 촉구의 어조
  chosen_reading: 아버지/교사의 마지막 권면으로, 슬픔 자체를 금지하기보다 그 슬픔에 압도되지 말라는 권면으로 읽었습니다.
  alternative_readings:
  - 단순한 금지 명령으로 읽어 ‘슬퍼하지 말라’를 더 강하게 이해하는 읽기
  rationale: 본문의 평행 구조(‘슬퍼하지 말고 … 쓰러지지 말아라’)가 감정의 절제를 촉구하는 목소리를 보여 주므로, 한국어에서도 절망적 반응을 누그러뜨리는 권면으로 유지했습니다.
  doctrine_reference: 문맥 중심의 수사적 권면
