  text: 4. *Ἐγὼ δὲ νῦν¹⁵ εἰς τὴν ἀνάπαυσίν μου¹⁶ ἀποτρέχω¹⁷, *ὡς καὶ¹⁸ οἱ πατέρες μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/008.yaml
  text: But as for me, now I hasten to my rest, as also my fathers did.
translation:
  language: ko
  text: 그러나 저는 이제 제 안식을 향해 달려갑니다. 제 조상들도 그러했듯이.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάπαυσίν μου
  english_pob_choice: my rest
  chosen_korean: 제 안식
  alternatives_korean:
  - 나의 쉼
  - 내 휴식
  - 나의 안식
  lexicon: ἀνάπαυσις
  rationale: 문맥상 단순한 ‘휴식’보다 삶의 마침에 이르는 ‘안식’이 더 자연스럽고, POB의 ‘rest’를 직접 반영하되 소유격은 한국어스럽게 제 안식으로 옮겼습니다.
- source_word: ἀποτρέχω
  english_pob_choice: hasten
  chosen_korean: 서둘러 달려갑니다
  alternatives_korean:
  - 급히 달려갑니다
  - 서둘러 갑니다
  - 달려갑니다
  lexicon: ἀποτρέχω
  rationale: 동사의 역동성을 살려 ‘달려갑니다’를 취하고, ‘hasten’의 급한 움직임을 ‘서둘러’로 보완했습니다.
- source_word: οἱ πατέρες μου
  english_pob_choice: my fathers
  chosen_korean: 저의 조상들
  alternatives_korean:
  - 내 아버지들
  - 나의 아버지들
  - 내 조상들
  lexicon: πατήρ
  rationale: 직역하면 ‘아버지들’이지만, 여기서는 선조를 가리키는 관용적 표현으로 이해되어 한국어에서는 ‘조상들’이 더 분명합니다.
theological_decisions:
- issue: 죽음 이후의 상태를 가리키는 ‘rest’의 표현
  chosen_reading: ‘안식’으로 옮겨, 단순한 잠이나 휴식이 아니라 조상들과 같은 종말론적 안식의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘쉼’으로 더 중립적으로 번역
  - ‘휴식’으로 일상어화
  rationale: 문맥은 임종 발화로 보이며, ‘안식’은 독자가 본문의 종결 감각과 조상들과의 연속성을 이해하는 데 가장 적절합니다.
  doctrine_reference: 종말론적 안식과 죽음의 완곡 표현
