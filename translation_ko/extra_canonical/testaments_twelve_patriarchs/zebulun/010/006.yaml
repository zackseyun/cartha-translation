reference: Testament of Zebulun 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἀναστήσομαι γὰρ⁴ πάλιν *ἐν μέσῳ⁵ ὑμῶν, ⌈ὡς ἡγούμενος *ἐν μέσῳ⁶ υἱῶν δικαιοσύνης⌉, καὶ⁷ εὐφρανθήσομαι⁸ *ἐν μέσῳ⁹ τῆς φυλῆς μου, *οἵτινες φυλάξουσιν¹⁰ νόμον Κυρίου [καὶ ἐντολὰς¹¹ Ζαβουλὼν πατρὸς αὐτῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
translation:
  language: ko
  text: 내가 다시 일어나 너희 가운데에 있을 것이니, 의의 아들들 가운데에 있는 지도자처럼 될 것이며, 내 지파 가운데에 있는 자들 가운데에서 기뻐할 것입니다. 그들은 주님의 율법과 그들의 아버지 스불론의 계명을 지킬 사람들입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστήσομαι
  english_pob_choice: I will rise again
  chosen_korean: 내가 다시 일어나
  alternatives_korean:
  - 내가 다시 일어서
  - 내가 부활하여
  lexicon: anistēmi
  rationale: 미래형의 ‘다시 일어나다’를 살리되, 예언적 자기언술의 자연스러운 한국어로 옮겼습니다. ‘부활하여’는 의미를 좁혀 해석을 앞서므로 피했습니다.
- source_word: ἐν μέσῳ ὑμῶν / ἐν μέσῳ τῆς φυλῆς μου
  english_pob_choice: in your midst / in the midst of my tribe
  chosen_korean: 너희 가운데에 / 내 지파 가운데에
  alternatives_korean:
  - 너희 한가운데에 / 내 지파 한가운데에
  - 너희 가운데서 / 내 지파 가운데서
  lexicon: en mesō
  rationale: 반복되는 ‘가운데’ 구조를 보존해 강조를 살렸습니다. ‘한가운데’는 구어적 강조가 강해 본문의 균형을 약간 과도하게 바꿀 수 있어 기본형을 택했습니다.
- source_word: ἡγούμενος ... υἱῶν δικαιοσύνης
  english_pob_choice: as a leader in the midst of the sons of righteousness
  chosen_korean: 의의 아들들 가운데에 있는 지도자처럼
  alternatives_korean:
  - 의의 아들들 가운데서 이끄는 자처럼
  - 의로운 아들들의 지도자처럼
  lexicon: hēgoumenos / huioi dikaiosynēs
  rationale: POB의 ‘leader’를 살리되, 시적 병행을 유지하기 위해 ‘~처럼’을 사용했습니다. ‘의로운 아들들’보다 ‘의의 아들들’이 원문의 소유격적 표현을 더 가깝게 반영합니다.
- source_word: νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 야훼의 율법
  lexicon: nomos / kyrios
  rationale: 본 문맥의 νόμος는 토라/율법을 뜻하므로 ‘율법’으로 옮겼습니다. 인용된 주님의 호칭은 본문이 직접 ‘Κυρίου’로 주어지므로 일반적으로 ‘주님’으로 처리했습니다.
theological_decisions:
- issue: 예언적 자기언술의 시점과 자기재현
  chosen_reading: 말하는 이는 미래에 ‘다시 일어날’ 인물로 자기 자신을 예언적으로 제시하며, 동시에 공동체 가운데 지도자로 서는 모습을 병치합니다.
  alternative_readings:
  - 단순한 개인적 회복 서술
  - 종말론적 부활 선언
  rationale: Ἀναστήσομαι와 병행구는 단순 회복보다 예언적, 공동체적 자기서술을 강하게 암시하지만, 본문만으로 구체적 종말론을 과잉단정하지 않도록 했습니다.
  doctrine_reference: 성경 본문 해석의 문맥 우선 원칙
- issue: 마지막 절의 계명 수락 주체
  chosen_reading: 마지막 절은 ‘그들’이 주님의 율법과 스불론의 아버지의 계명을 지키는 자들임을 밝힙니다.
  alternative_readings:
  - 앞의 ‘내 지파’ 전체를 일괄 지칭
  - 후대 삽입 가능성을 적극적으로 반영
  rationale: 영어 POB의 최신 수정이 복원한 마지막 구절을 반영하여, 본문이 요구하는 이중 계명 준수를 그대로 유지했습니다.
  doctrine_reference: 본문 비평과 전승 복원 원칙
