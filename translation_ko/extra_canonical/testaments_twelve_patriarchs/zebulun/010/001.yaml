id: T12P.ZEB.10.1
reference: Testament of Zebulun 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: καὶ ἐπιστρέψετε⁵² *εἰς τὴν γῆν⁵³ ὑμῶν⁵⁴, καὶ ὄψεσθε αὐτὸν⁵⁵ ἐν Ἱερουσαλὴμ ⌈διὰ τὸ ὄνομα αὐτοῦ *τὸ ἅγιον⁵⁶⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/001.yaml
  text: And you will return to your land, and you will see him in Jerusalem because of his holy name.
translation:
  language: ko
  text: 그리고 너희는 너희 땅으로 돌아갈 것이며, 그의 거룩한 이름 때문에 예루살렘에서 그를 보게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψετε
  english_pob_choice: you will return
  chosen_korean: 돌아갈 것입니다
  alternatives_korean:
  - 되돌아갈 것입니다
  - 회복될 것입니다
  lexicon: ἐπιστρέφω
  rationale: 단순한 물리적 귀환을 가리키므로, 회개 뉘앙스를 피하고 자연스러운 미래형으로 옮겼습니다.
- source_word: εἰς τὴν γῆν ὑμῶν
  english_pob_choice: to your land
  chosen_korean: 너희 땅으로
  alternatives_korean:
  - 너희 나라로
  - 너희 땅 안으로
  lexicon: γῆ
  rationale: γῆ는 여기서 약속된 귀환의 대상인 ‘땅’이 가장 직접적이어서, English POB의 land를 따라 ‘땅’으로 렌더링했습니다.
- source_word: ὄψεσθε αὐτόν
  english_pob_choice: you will see him
  chosen_korean: 그분을 보게 될 것입니다
  alternatives_korean:
  - 그를 보게 될 것입니다
  - 그를 뵙게 될 것입니다
  lexicon: ὁράω
  rationale: 대상을 존칭으로 직접 높여야 하는 문맥이 아니라서 ‘뵙다’보다 중립적인 ‘보다’를 택했으며, 앞뒤 문맥의 인칭 지시를 분명히 하기 위해 ‘그분’으로 풀었습니다.
- source_word: διὰ τὸ ὄνομα αὐτοῦ τὸ ἅγιον
  english_pob_choice: because of his holy name
  chosen_korean: 그분의 거룩한 이름 때문입니다
  alternatives_korean:
  - 그분의 거룩한 이름으로 말미암습니다
  - 그분의 거룩한 이름 때문에
  lexicon: ὄνομα / ἅγιος
  rationale: διὰ τὸ는 원인·이유를 나타내므로 ‘때문입니다’로 자연스럽게 옮겼고, ἅγιον은 단순한 경건성보다 이름의 구별됨을 드러내는 ‘거룩한’으로 번역했습니다.
theological_decisions:
- issue: Ἱερουσαλὴμ의 종말론적 귀환과 가시적 만남
  chosen_reading: 예루살렘에서 그분을 보게 될 것입니다라는 직접적 미래 진술로 유지했습니다.
  alternative_readings:
  - 예루살렘에서 그를 만나게 될 것입니다
  - 예루살렘에서 그분이 나타나실 것입니다
  rationale: 원문은 ‘보게 될 것이다’라는 시각적·현현적 표현을 사용하므로, 만남이나 출현으로 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: 종말론적 회복과 현현 모티프
- issue: ‘그분’ 지시 대상의 해석
  chosen_reading: 문맥상 앞선 주어를 이어받는 인칭 지시로 처리했습니다.
  alternative_readings:
  - 메시아로 명시하기
  - 주님으로 명시하기
  rationale: 원문과 English POB는 명시적 칭호를 추가하지 않으므로, 해석을 과도하게 앞당기지 않고 지시대명사 수준에서 유지했습니다.
  doctrine_reference: 원문 지시 보존
