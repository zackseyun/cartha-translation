  verdict: approve
  source_fidelity: 그리스어의 대조(δὲ), 심판 대상(τοὺς ἀσεβεῖς), 주어(Κύριος), ‘영원한 불’(πῦρ αἰώνιον), 미래의 멸망(ἀπολεῖ), 그리고 난해한 기간 표현(ἕως γενεὰς γενεῶν)을 빠짐없이 반영합니다. ‘세대들의 세대까지’는 다소 직역적이지만 원문의 중첩된 표현과 영어 POB의 ‘for generations of generations’를 보존합니다.
  naturalness: 현대 표준어 합쇼체로 자연스럽습니다. ‘세대들의 세대까지’는 일상적 표현은 아니나, 원문의 문체와 불확정적인 시간 표현을 보존하기 위한 의도적인 직역으로서 허용됩니다.
  terminology: ‘경건하지 않은 자들’, ‘주’, ‘영원한 불’, ‘멸하다’는 본문의 종교적·심판적 어휘를 과도한 교리 해석 없이 적절히 옮깁니다. ‘주께서’는 Κύριος에 대한 무리 없는 대응입니다.
