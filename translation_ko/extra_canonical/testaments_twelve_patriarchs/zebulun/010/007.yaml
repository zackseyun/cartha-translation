id: T12P.ZEB.10.7
reference: Testament of Zebulun 10:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. Ἐπὶ δὲ τοὺς ἀσεβεῖς ἐπάξει¹² Κύριος πῦρ αἰώνιον, καὶ ἀπολεῖ¹³ αὐτοὺς *ἕως γενεὰς γενεῶν¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/007.yaml
  text: But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations.
translation:
  language: ko
  text: 그러나 경건하지 않은 자들에게는 주께서 영원한 불을 내리실 것이며, 그들을 세대들의 세대까지 멸하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀσεβεῖς
  english_pob_choice: the ungodly
  chosen_korean: 경건하지 않은 자들
  alternatives_korean:
  - 불경한 자들
  - 경건치 않은 자들
  lexicon: ἀσεβής
  rationale: 하나님을 향한 경외와 경건의 결핍을 드러내는 직접적 표현으로 옮겼습니다. ‘불경한’도 가능하지만, 현대 독자가 이해하기 쉬운 ‘경건하지 않은 자들’을 택했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 야훼께서
  lexicon: κύριος
  rationale: 본문이 일반 명사적 호칭으로 주를 가리키므로 ‘주께서’로 자연스럽게 옮겼습니다. 본문에는 야훼 인용 표지가 직접 없으므로 기본적으로 호칭형을 유지했습니다.
- source_word: πῦρ αἰώνιον
  english_pob_choice: eternal fire
  chosen_korean: 영원한 불
  alternatives_korean:
  - 영구한 불
  - 영속하는 불
  lexicon: πῦρ + αἰώνιος
  rationale: 심판의 불이 시간적으로 끝나지 않음을 살려 ‘영원한 불’로 옮겼습니다. POB의 의미와도 직접 대응합니다.
- source_word: ἀπολεῖ αὐτοὺς
  english_pob_choice: he will destroy them
  chosen_korean: 그들을 … 멸하실 것입니다
  alternatives_korean:
  - 그들을 파멸시키실 것입니다
  - 그들을 없애실 것입니다
  lexicon: ἀπόλλυμι
  rationale: 완전한 멸망의 의미를 분명히 하기 위해 ‘멸하실 것입니다’를 선택했습니다. 단순한 손상이나 상실보다 강한 파괴를 드러냅니다.
theological_decisions:
- issue: 종말 심판의 기간 표현
  chosen_reading: ‘세대들의 세대까지’라는 직역적 표현을 유지해, 심판의 지속성과 세대 초월성을 드러냈습니다.
  alternative_readings:
  - ‘대대로’
  - ‘영원히’
  rationale: 영어 POB의 ‘for generations of generations’을 따르면서, 단순 의역으로 시간 감각이 약화되지 않도록 했습니다.
  doctrine_reference: 종말론/심판론
