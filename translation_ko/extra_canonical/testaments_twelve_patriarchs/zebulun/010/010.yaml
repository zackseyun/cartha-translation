id: T12P.ZEB.10.10
reference: Testament of Zebulun 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ ταῦτα εἰπὼν ἐκοιμήθη [†ὕπνῳ²⁴ καλῷ], καὶ ἔθηκαν αὐτὸν *οἱ υἱοὶ αὐτοῦ²⁵ *εἰς θήκην ξυλίνην²⁶. 7. Ὕστερον δὲ *ἀναγαγόντες ἔθαψαν αὐτὸν ἐν Χεβρών²⁷ μετὰ τῶν πατέρων αὐτοῦ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/010.yaml
  text: And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.
translation:
  language: ko
  text: 그가 이런 말들을 하고 나서 잠들었고, 그의 아들들이 그를 나무 관에 놓았습니다. 나중에 그들은 그를 메고 올라가 헤브론에 있는 그의 조상들과 함께 장사했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  english_pob_choice: he fell asleep
  chosen_korean: 잠들었고
  alternatives_korean:
  - 죽었습니다
  - 잠이 들었습니다
  lexicon: 코이마오
  rationale: 문맥상 단순한 수면이 아니라 죽음을 완곡하게 가리키는 표현이므로, 영어 POB의 'fell asleep'를 따라 한국어도 '잠들다'로 옮겼습니다.
- source_word: εἰς θήκην ξυλίνην
  english_pob_choice: in a wooden coffin
  chosen_korean: 나무 관에
  alternatives_korean:
  - 나무로 된 관에
  - 나무 상자에
  lexicon: thēkē + xylinos
  rationale: θήκη는 단순한 '상자'보다 시신을 넣는 용기라는 점이 있어, 영어 POB의 'coffin'을 따라 '관'으로 옮기되 재료를 '나무'로 분명히 했습니다.
- source_word: ἀναγαγόντες
  english_pob_choice: they carried him up
  chosen_korean: 그를 메고 올라가
  alternatives_korean:
  - 그를 데리고 올라가
  - 그를 운구하여
  lexicon: anagō
  rationale: 무덤이 헤브론에 있다는 점과 함께 '올라가다'의 방향성을 살리되, 운구의 실제 행위를 자연스럽게 드러내기 위해 '메고 올라가'로 옮겼습니다.
- source_word: ἔθαψαν αὐτὸν ἐν Χεβρών
  english_pob_choice: buried him in Hebron
  chosen_korean: 헤브론에 있는 그의 조상들과 함께 장사했습니다
  alternatives_korean:
  - 헤브론에 묻었습니다
  - 헤브론에 장사했습니다
  lexicon: thaptō
  rationale: '''장사하다''는 매장 행위를 비교적 직접적으로 살리며, ''with his fathers''와의 결합을 자연스럽게 한국어로 연결했습니다.'
theological_decisions:
- issue: 죽음을 '잠들다'로 완곡하게 표현하는 방식
  chosen_reading: 본문의 완곡어법을 유지해 죽음을 단순 소멸이 아니라 조상들과의 연속선 안에서 이해하게 했습니다.
  alternative_readings:
  - 직접적으로 '죽었다'고 번역
  - '''안식하다''로 의역'
  rationale: 그리스어 ἐκοιμήθη는 장례 문맥에서 흔한 완곡 표현이므로, 본문이 주는 정서와 고대 유대적 장례 어법을 보존하는 것이 적절합니다.
  doctrine_reference: 죽음의 완곡 표현과 성경적 장례 언어
