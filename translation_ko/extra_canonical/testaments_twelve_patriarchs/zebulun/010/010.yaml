  - severity: medium
    issue: '''그를 메고 올라가'''
    rationale: ἀναγαγόντες는 운반하여 올라간다는 뜻이지만, '메고'는 등에 지는 특정 운반 방식을 덧붙일 수 있습니다. '운구하여 올라가'는 장례 맥락과 상향 이동을 보존하면서 불필요한 구체화를 피합니다.
