  source_fidelity: 그리스어 본문(ἐκοιμήθη, ἔθηκαν ... εἰς θήκην ξυλίνην, ἀναγαγόντες, ἔθαψαν ... ἐν Χεβρών μετὰ τῶν πατέρων αὐτοῦ)과 영어 POB의 의미를 전반적으로 충실히 반영합니다. 다만 ἀναγαγόντες의 운구 및 상향 이동을 더 정확하고 자연스럽게 나타내도록 다듬었습니다. 대괄호와 †로 표시된 '좋은 잠으로'는 본문 전승상 불확실하게 표시되어 있고 영어 POB에도 반영되지 않았으므로 본문에 넣지 않았습니다.
  naturalness: 합쇼체 문체는 유지되어 있습니다. 다만 시신을 관에 두는 행위에는 '놓았습니다'보다 '넣었습니다'가 자연스럽고, '메고 올라가'는 등에 지는 행위를 구체적으로 암시하므로 장례 문맥에는 '운구하여 올라가'가 더 적절합니다.
  terminology: ἐκοιμήθη의 완곡어법은 '잠들었습니다'로 보존했습니다. θήκη ξυλίνη는 '나무 관', ἔθαψαν은 '장사했습니다'로 옮겨 원문의 장례 의미를 유지했습니다. '그의 조상들'은 πατέρων의 관용적 복수 표현을 자연스럽게 반영합니다.
  issues:
