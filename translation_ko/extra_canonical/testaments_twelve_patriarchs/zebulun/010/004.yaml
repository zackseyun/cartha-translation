base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/004.yaml
  text: And again, in the craftiness of your works you will provoke him, and you will be cast away from him until the time of completion.
translation:
  language: ko
  text: 그리고 다시, 너희 행위의 간사함 가운데서 그를 격분하게 할 것이며, 너희는 마침의 때까지 그에게서 내쳐질 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ πανουργίᾳ τῶν ἔργων ὑμῶν
  english_pob_choice: in the craftiness of your works
  chosen_korean: 너희 행위의 간사함 가운데서
  alternatives_korean:
  - 너희 일의 간사함 가운데서
  - 너희 행실의 꾀부림 가운데서
  - 너희 작품의 간사함 가운데서
  lexicon: πανουργία; ἔργον
  rationale: πανουργίᾳ는 단순한 ‘지혜’가 아니라 속임수와 교활함을 가리키므로 ‘간사함’으로 살렸고, ἔργων은 POB의 ‘works’에 맞춰 ‘행위’로 옮겨 관용적이면서도 행위성의 뉘앙스를 유지했습니다.
- source_word: παροργίσετε αὐτόν
  english_pob_choice: you will provoke him
  chosen_korean: 그를 격분하게 할 것이며
  alternatives_korean:
  - 그를 분노하게 할 것이며
  - 그를 화나게 할 것이며
  - 그를 노하게 할 것이며
  lexicon: παροργίζω
  rationale: 동사의 강한 감정 유발과 관계 훼손 뉘앙스를 살리기 위해 단순한 ‘화나게 하다’보다 더 강한 ‘격분하게 하다’를 택했습니다.
- source_word: ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
  english_pob_choice: you will be cast away from him
  chosen_korean: 너희는 그에게서 내쳐질 것입니다
  alternatives_korean:
  - 너희는 그에게서 쫓겨날 것입니다
  - 너희는 그에게서 버림받을 것입니다
  - 너희는 그에게서 밀려날 것입니다
  lexicon: ἀπορρίπτω; ἀπό + αὐτός
  rationale: 수동태의 강한 배척을 드러내기 위해 ‘내쳐지다’를 사용했고, ἀπ᾽ αὐτοῦ는 관계적 분리를 분명히 하기 위해 ‘그에게서’로 옮겼습니다.
- source_word: ἕως καιροῦ συντελείας
  english_pob_choice: until the time of completion
  chosen_korean: 마침의 때까지
  alternatives_korean:
  - 완성의 때까지
  - 종결의 때까지
  - 끝맺음의 때까지
  lexicon: καιρός; συντέλεια
  rationale: συντελείας는 단순한 끝이 아니라 정해진 완결의 때를 가리키므로, 직역보다 의미를 살린 ‘마침의 때’로 압축했습니다.
theological_decisions:
- issue: 공동체에 대한 심판 경고의 어조
  chosen_reading: 직접적인 경고문으로 유지해, 행위의 간사함이 하나님과의 관계 단절과 배척으로 이어진다는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 해석해 도덕적 권면으로 약화
  - ‘내쳐질 것입니다’를 ‘멀어질 것입니다’로 완화
  rationale: 본문은 단순한 조언이 아니라 심판적 경고이므로, 관계 단절과 배척의 실재를 약화하지 않는 표현을 유지했습니다.
  doctrine_reference: 경고 본문 해석 원칙; 언약적 심판의 경고
