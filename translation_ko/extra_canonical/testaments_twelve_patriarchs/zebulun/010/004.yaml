  to: 그리고 다시, 너희의 간교한 행위 가운데서 그를 분노하게 할 것이며, 너희는 완결의 때까지 그에게서 내쳐질 것입니다.
  rationale: The revision keeps the warning, future tense, and relational separation of the Greek while using idiomatic formal Korean. It replaces an unjustified intensification of 'provoke to anger,' clarifies the completion-time expression, and removes unsupported footnote anchors.
