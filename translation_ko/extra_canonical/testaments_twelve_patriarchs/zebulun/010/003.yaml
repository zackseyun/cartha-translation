review_pass:
  verdict: revise
  source_fidelity: 초안은 θεὸν ἐν σχήματι ἀνθρώπου를 ‘사람이 된’ 것으로 옮겨 원문의 ‘사람의 모습/형태’보다 강한 성육신 단정을 만들었습니다. 또한 ὃν ἂν ἐκλέξηται Κύριος에 없는 ‘그를 위해’를 보충했습니다. 관계절의 선행사는 문법적으로 논의될 여지가 있으므로, 번역과 주석에서 이를 단정하지 않는 편이 안전합니다.
  naturalness: ‘자기의 질투로 돌이키실’은 한국어에서 어색하고 ‘자기’의 지시 대상도 불분명합니다. ‘그의 질투에 이르게 하실’은 εἰς의 결과 방향을 자연스럽게 드러냅니다. ‘주님께서 그를 위해 선택하실 분이며’도 문장 구조와 지시 관계가 불명확합니다.
  terminology: θεός는 ‘하나님’, Κύριος는 문맥상 기존 용례를 따라 ‘주님’으로 유지했습니다. σχήμα는 ‘사람의 모습’으로 옮겨 외형적 표현을 보존했으며, παραζήλωσις는 영어 POB의 ‘his jealousy’와 같이 ‘그의 질투’로 유지하되 한국어 문맥에 맞게 처리했습니다.
  issues:
  - severity: high
    issue: ‘사람이 된 모습’이 원문보다 강한 해석을 도입함
    rationale: ἐν σχήματι ἀνθρώπου는 ‘사람의 모습/형태로’라는 표현이며, ‘사람이 됨’을 명시하지 않습니다.
  - severity: high
    issue: ‘그를 위해’의 무근거 보충
    rationale: 제시된 그리스어의 관계절에는 ‘그를 위해’에 해당하는 표현이 없습니다. αὐτῷ는 마지막 명명 구문에 속하므로 이를 관계절에 이입하지 않습니다.
  - severity: medium
    issue: 관계절의 선행사 불확실성을 본문에서 해소함
    rationale: ὃν은 θεόν과 ἀνθρώπου 모두 남성 단수 형태와 관련될 수 있어, 관계절의 정확한 연결은 단정하지 않고 주석으로 밝혀야 합니다.
  - severity: low
    issue: 기존 [a], [b] 앵커에 대응하는 각주가 없음
    rationale: 앵커가 있는 경우 완전한 각주 세트를 제공해야 합니다.
  revised_text: 그는 모든 민족을 그의 질투에 이르게 하실 것이며, 여러분은 사람의 모습으로 계신 하나님을 보게 될 것입니다. 주님께서 택하실 분입니다—예루살렘이 그의 이름입니다.[a][b]
  revised_footnotes:
  - marker: a
    text: 그리스어의 ‘주님께서 택하실 분’이라는 관계절은 바로 앞의 ‘하나님’ 또는 ‘사람’을 가리키는 것으로 문법적으로 이해될 수 있습니다. 본문은 그 연결을 단정하지 않습니다.
    reason: 관계절 선행사의 문법적·문맥적 불확실성을 보존합니다.
  - marker: b
    text: 직역하면 ‘예루살렘, 그에게 이름[이 있다]’입니다. 이 명명 구문의 지시 대상은 문맥상 명확하지 않습니다.
    reason: Ἱερουσαλὴμ ὄνομα αὐτῷ의 압축된 명명 구문과 대명사 지시의 불확실성을 보존합니다.
  revision_rationale: 원문의 ‘사람의 모습’을 유지하고, 본문에 없는 ‘그를 위해’를 삭제했습니다. 관계절과 마지막 명명 구문의 지시 관계는 번역에서 교리적으로 고정하지 않고 각주로 밝혔습니다. 다만 ‘주님께서 택하실 분입니다’는 한국어 문장으로 최소한의 완결성을 위해 독립절로 처리했습니다.
