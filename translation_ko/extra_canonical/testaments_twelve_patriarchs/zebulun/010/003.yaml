source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἐπιστρέψει *πάντα τὰ⁶⁰ ἔθνη εἰς παραζήλωσιν αὐτοῦ⁶¹, καὶ ὄψεσθε *θεὸν ἐν σχήματι ἀνθρώπου⁶² *ὃν ἂν ἐκλέξηται Κύριος Ἱερουσαλὴμ ὄνομα αὐτῷ⁶³.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/003.yaml
  text: And he will turn all the nations to his jealousy, and you will see God in human form, whom the Lord will choose for him—Jerusalem is his name.
translation:
  language: ko
  text: 그는 모든 민족들을 자기의 질투로 돌이키실 것이며, 여러분은 사람이 된 모습의 하나님을 보게 될 것입니다. 주님께서 그를 위해 선택하실 분이며—예루살렘이 그의 이름입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζήλωσιν αὐτοῦ
  english_pob_choice: his jealousy
  chosen_korean: 자기의 질투로
  alternatives_korean:
  - 그의 질투로
  - 그를 향한 질투로
  - 그의 열심으로
  lexicon: παραζήλωσις
  rationale: English POB의 최신 판정처럼 ζηλόω 계열을 단순한 ‘열심’보다 ‘질투’로 살리되, 한국어에서는 목적어를 자연스럽게 붙여 ‘자기의 질투로’라고 옮겼습니다.
- source_word: θεὸν ἐν σχήματι ἀνθρώπου
  english_pob_choice: God in human form
  chosen_korean: 사람이 된 모습의 하나님
  alternatives_korean:
  - 인간의 모습의 하나님
  - 인간 형상의 하나님
  - 사람의 형체를 지닌 하나님
  lexicon: θεός; σχήμα; ἄνθρωπος
  rationale: ‘형상’을 단순한 외형이 아니라 실제로 드러난 모습으로 살려, 하나님이 인간적 형태로 나타나심을 분명히 하면서도 원문의 긴장을 유지했습니다.
- source_word: ὃν ἂν ἐκλέξηται Κύριος
  english_pob_choice: whom the Lord will choose
  chosen_korean: 주님께서 그를 위해 선택하실 분
  alternatives_korean:
  - 주님께서 선택하실 분
  - 주님께서 택하실 분
  - 주님께서 그를 택하실 분
  lexicon: ἐκλέγομαι; Κύριος
  rationale: 대명사 관계를 한국어에서 자연스럽게 풀어, ‘그를 위해’가 앞선 인물과의 연결을 보여 주면서도 선택 주체가 주님임을 분명히 했습니다.
- source_word: Ἱερουσαλὴμ ὄνομα αὐτῷ
  english_pob_choice: Jerusalem is his name
  chosen_korean: 예루살렘이 그의 이름입니다
  alternatives_korean:
  - 예루살렘이 그 이름입니다
  - 그의 이름은 예루살렘입니다
  - 예루살렘이라는 이름을 가집니다
  lexicon: Ἱερουσαλήμ
  rationale: 이름 선언 구조를 직역에 가깝게 살려, 문장 끝의 명명 공식이 지닌 예언적 울림을 유지했습니다.
theological_decisions:
- issue: ‘하나님을 사람의 모습으로 보게 될 것’이라는 진술의 직설성
  chosen_reading: 본문의 도발적 표현을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님께서 사람처럼 보이실 것’처럼 완화하는 읽기
  - 상징적 환시로만 제한하는 읽기
  rationale: 원문은 신적 현현을 강하게 진술하므로, 한국어도 그 긴장을 유지해 독자가 본문이 의도한 충격을 인지하도록 했습니다.
  doctrine_reference: 성육신/신현 본문 해석
