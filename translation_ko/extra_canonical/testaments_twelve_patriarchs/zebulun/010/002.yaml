- from: 그리고 그의 날개에는 치유와 자비가 있을 것입니다. 그 자신이 사람들의 모든 포로 됨을 벨리알에게서 속량할 것이며, 모든 미혹의 영이 짓밟힐 것입니다.[a][b]
  to: 그리고 그의 날개에는 치유와 긍휼이 있을 것입니다. 그가 친히 사람의 자녀들이 겪는 모든 포로 상태를 벨리알에게서 속량하실 것이며, 모든 미혹의 영이 짓밟힐 것입니다.
  rationale: 원문의 병렬 구조와 미래 표현을 유지하되, εὐσπλαγχνία의 어감을 ‘긍휼’로 조정하고, ‘친히’로 Αὐτός의 강조를 자연스럽게 반영했습니다. 또한 ‘사람의 자녀들이 겪는 모든 포로 상태’로 소유·수식 관계를 명료하게 했습니다. 제공되지 않은 각주 내용에 근거 없이 표지만 남길 수 없으므로 [a][b]를 제거했습니다.
