id: T12P.ZEB.10.2
reference: Testament of Zebulun 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἴασις *καὶ εὐσπλαγχνία⁵⁷ ἐν⁵⁸ ταῖς πτέρυξιν αὐτοῦ. Αὐτὸς λυτρώσεται πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων ἐκ τοῦ Βελίαρ καὶ πᾶν πνεῦμα πλάνης πατηθήσεται⁵⁹.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/002.yaml
  text: And healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deception will be trampled down.
translation:
  language: ko
  text: 그리고 그의 날개에는 치유와 자비가 있을 것입니다. 그 자신이 사람들의 모든 포로 됨을 벨리알에게서 속량할 것이며, 모든 미혹의 영이 짓밟힐 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴασις
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 치료
  - 병 고침
  lexicon: ἴασις
  rationale: 의학적·구원적 회복을 함께 담을 수 있는 현대어로 옮겼습니다.
- source_word: εὐσπλαγχνία
  english_pob_choice: compassion
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 동정
  lexicon: εὐσπλαγχνία
  rationale: 내장 깊은 연민의 의미를 한국어에서 가장 자연스럽게 드러내는 말로 선택했습니다.
- source_word: λύτρωσεται πᾶσαν αἰχμαλωσίαν
  english_pob_choice: will redeem every captivity
  chosen_korean: 모든 포로 됨을 속량할
  alternatives_korean:
  - 모든 포로 상태를 구속할
  - 모든 사로잡힘을 해방할
  lexicon: λυτρόω, αἰχμαλωσία
  rationale: αἰχμαλωσία를 단순한 ‘포로들’보다 상태를 가리키는 ‘포로 됨’으로 살리고, λύτρωσεται는 대가를 치르고 건지는 의미를 드러내는 ‘속량하다’로 옮겼습니다.
- source_word: πλάνης
  english_pob_choice: deception
  chosen_korean: 미혹
  alternatives_korean:
  - 속임
  - 기만
  lexicon: πλάνη
  rationale: 의도적 속임수보다 사람을 잘못된 길로 이끄는 상태를 강조하는 말로, 영적 오도라는 문맥을 잘 반영합니다.
theological_decisions:
- issue: 벨리알과 미혹의 영을 종말론적 대적 세력으로 표현하는 방식
  chosen_reading: ‘벨리알에게서’와 ‘미혹의 영’으로 직접 옮겨, 단순한 도덕적 악이 아니라 인격화된 대적 세력으로 읽히게 했습니다.
  alternative_readings:
  - ‘악마에게서’
  - ‘속임의 영’
  rationale: 본문의 내러티브는 구속과 심판을 대립시키며, 벨리알과 미혹의 영을 분명한 영적 대항 세력으로 제시합니다.
  doctrine_reference: 영적 전쟁과 악의 인격화에 대한 묵시문학적 표현
