source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Ὑμεῖς δὲ φοβεῖσθε Κύριον¹⁹ [τὸν θεὸν ἡμῶν²⁰ ἐν πάσῃ ἰσχύι ὑμῶν²¹ πάσας τὰς²² ἡμέρας τῆς ζωῆς ὑμῶν]²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/009.yaml
  text: But you, fear the Lord our God with all your strength all the days of your life.
translation:
  language: ko
  text: 그러나 너희는 주를 [곧 우리 하나님을, 너희의 온 힘을 다하여 너희가 사는 모든 날 동안] 경외하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβεῖσθε Κύριον
  english_pob_choice: fear the Lord
  chosen_korean: 우리 하나님 주를 두려워하십시오
  alternatives_korean:
  - 주를 경외하십시오
  - 주님을 두려워하십시오
  lexicon: φοβέομαι; κύριος
  rationale: 명령형의 핵심은 단순한 감정이 아니라 하나님을 향한 경외와 두려움의 복합 의미이지만, 본문이 직접 말하는 ‘두려워하다’를 우선 살리면서 존칭적으로 ‘주’를 붙였습니다.
- source_word: τὸν θεὸν ἡμῶν
  english_pob_choice: our God
  chosen_korean: 우리 하나님
  alternatives_korean:
  - 우리의 하나님
  - 하나님 우리
  lexicon: θεός
  rationale: 영어 POB의 복원된 표현을 반영하여 소유 관계를 분명히 드러내되, 한국어에서는 자연스러운 ‘우리 하나님’으로 옮겼습니다.
- source_word: ἐν πάσῃ ἰσχύι ὑμῶν
  english_pob_choice: with all your strength
  chosen_korean: 너희 힘을 다하여
  alternatives_korean:
  - 모든 힘으로
  - 너희의 온 힘으로
  lexicon: ἰσχύς
  rationale: 수단·방식을 나타내는 전치사구를 한국어 관용에 맞게 ‘-을 다하여’로 옮겨, ‘모든 힘으로’의 의미를 자연스럽게 살렸습니다.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς ὑμῶν
  english_pob_choice: all the days of your life
  chosen_korean: 평생 동안
  alternatives_korean:
  - 너희 생애의 모든 날 동안
  - 너희 삶의 모든 날 동안
  lexicon: ἡμέρα; ζωή
  rationale: 직역보다 뜻을 압축해도 의미가 변하지 않는 관용적 시간 표현이므로, 지속성을 분명히 하는 ‘평생 동안’으로 옮겼습니다.
theological_decisions:
- issue: κύριος의 한국어 처리
  chosen_reading: 이 문맥의 κύριος는 하나님을 가리키므로 ‘주’로 옮기되, 바로 뒤의 ‘우리 하나님’과 함께 읽히도록 했습니다.
  alternative_readings:
  - 주님
  - 야훼
  rationale: 이 문서는 제2성전기 유대 문헌의 그리스어 본문으로, 신약의 야훼 인용 규칙을 적용할 근거가 없으므로 본문 표면의 호칭을 유지하는 것이 적절합니다.
  doctrine_reference: 호칭 보존 / 문맥적 동일시
