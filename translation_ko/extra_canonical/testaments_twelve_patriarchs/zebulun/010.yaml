base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010.yaml
  text: 'And you will return to your land, and you will see him in Jerusalem because of his holy name; and healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deceit will be trampled down. And he will turn all the nations to zeal for him, and you will see God in the form of a man, whom the Lord will choose—Jerusalem is his name.


    9. And again, by the craftiness of your deeds you will provoke him to anger, and you will be cast away from him until the time of completion.


    10. And now, my children, do not be grieved because I am dying, nor fall down in sorrow because I am coming to my end. For I will rise again in your midst, as a ruler in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, all who keep the law of the Lord. But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations. But as for me, I now hasten to my rest, as also my fathers did. But you, fear the Lord all the days of your life with all your strength.


    And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.'
translation:
  language: ko
  text: '10. 이제 내 자녀들아, 내가 죽어 간다고 해서 슬퍼하지 말고, 내가 생을 마친다고 해서 슬픔에 쓰러지지도 마십시오. 나는 너희 가운데서 다시 일어날 것이며, 의의 아들들 가운데서 지도자로 있을 것입니다. 또 나는 내 지파, 곧 주의 율법을 지키는 이들 가운데서 기뻐할 것입니다. 그러나 경건하지 않은 자들에게는 주께서 영원한 불을 내리시고, 그들을 세세토록 멸하실 것입니다. 나는 이제 내 조상들도 그러했던 것처럼 내 안식으로 급히 달려갑니다. 그러나 너희는 삶의 모든 날 동안 온 힘을 다하여 주 우리 하나님을 경외하십시오.[a]


    이 말씀을 하시고 그는 잠드셨습니다.[b] 그의 아들들은 그를 나무로 된 관에 넣었습니다. 그 뒤에 그들은 그를 옮겨 가서 그의 조상들과 함께 헤브론에 장사하였습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 하나님을’부터 ‘온 힘을 다하여’까지는 제시된 그리스어 비평판에서 대괄호로 표시된 본문입니다. 영어 POB의 본문 처리에 따라 번역에 포함하였습니다.
    reason: 5절의 대괄호 본문 채택을 투명하게 밝히고, 본문 전승의 불확실성을 보존합니다.
  - marker: b
    text: 일부 본문에는 ‘좋은 잠으로’라는 말이 덧붙지만, 제시된 비평판에서는 †와 대괄호로 표시됩니다. 본문이 불확실하므로 번역 본문에는 포함하지 않았습니다.
    reason: 6절의 비평적으로 의심스러운 첨가를 교리적 또는 서사적으로 확정하지 않기 위함입니다.
lexical_decisions:
- source_word: μὴ λυπεῖσθε / μηδὲ συμπέσητε
  english_pob_choice: do not be grieved / nor fall down in sorrow
  chosen_korean: 슬퍼하지 말고 / 마음에 쓰러지지도 마십시오
  alternatives_korean:
  - 근심하지 마십시오 / 낙심하지도 마십시오
  - 슬퍼하지 말고 / 주저앉지도 마십시오
  lexicon: λυπέω, συμπίπτω
  rationale: 앞뒤 정서를 함께 살리면서도, 영어 POB의 ‘fall down in sorrow’를 한국어로는 감정적 붕괴를 나타내는 자연스러운 표현으로 옮겼습니다.
- source_word: ἀναστήσομαι … ἐν μέσῳ ὑμῶν
  english_pob_choice: I will rise again in your midst
  chosen_korean: 나는 너희 가운데서 다시 일어나리니
  alternatives_korean:
  - 나는 너희 가운데서 다시 일어나겠습니다
  - 나는 너희 가운데서 다시 일어날 것입니다
  lexicon: ἀνίστημι
  rationale: 부활/재기 모두 가능한 동사를 문맥상 보전하되, 현재 본문은 직접적 부활 선언보다 ‘다시 일어섬’의 서술을 유지하는 편이 원문에 가깝습니다.
- source_word: ὡς ἡγούμενος ἐν μέσῳ υἱῶν δικαιοσύνης
  english_pob_choice: as a ruler in the midst of the sons of righteousness
  chosen_korean: 의의 아들들 가운데 있는 통치자처럼
  alternatives_korean:
  - 의의 아들들 가운데 있는 지도자처럼
  - 의로운 자들의 한가운데 있는 통치자처럼
  lexicon: ἡγούμενος, υἱοὶ δικαιοσύνης
  rationale: ἡγούμενος는 단순 ‘지도자’보다 ‘통치자/인도자’의 공적 지위를 드러내며, υἱοὶ δικαιοσύνης는 영어 POB의 관용을 따라 ‘의의 아들들’로 옮겼습니다.
- source_word: νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주의 율법
  alternatives_korean:
  - 주님의 율법
  - 주 하나님의 율법
  lexicon: νόμος, κύριος
  rationale: 이 문맥의 νόμος는 토라를 가리키므로 프로젝트 기본어인 ‘율법’을 유지했고, 주(主)는 소유격 구조에 맞게 간결하게 처리했습니다.
- source_word: Κύριος πῦρ αἰώνιον
  english_pob_choice: the Lord will bring eternal fire
  chosen_korean: 주께서 영원한 불을 가져오시고
  alternatives_korean:
  - 주께서 영원한 불을 내리시고
  - 주께서 영원한 불을 보내시고
  lexicon: πῦρ αἰώνιον
  rationale: αἰώνιος는 종말론적 지속성을 나타내므로 ‘영원한’으로 옮기고, 동사는 심판의 주도권을 살려 ‘가져오시고’로 처리했습니다.
theological_decisions:
- issue: 10절의 ‘다시 일어나리니’가 부활 언어인지 단순 비유인지
  chosen_reading: 본문의 직접 발화는 장차의 재등장을 말하지만, 문맥상 고인의 위로와 지도자적 귀환을 함께 암시하는 표현으로 보존했습니다.
  alternative_readings:
  - 명시적으로 ‘부활하겠습니다’로 옮기는 해석
  - 단순히 ‘다시 나타나겠습니다’로 완화하는 해석
  rationale: 영어 POB도 ‘I will rise again’으로 유지하여 의미의 폭을 열어 두고 있으므로, 한국어도 부활 단정이나 완전한 비유화 둘 다 피했습니다.
  doctrine_reference: 종말론/부활 해석의 개방성
- issue: ‘주의 율법’을 지키는 사람들을 ‘의의 아들들’과 병렬로 두는 방식
  chosen_reading: ‘의의 아들들’과 ‘주의 율법을 지키는 모든 사람’을 같은 공동체적 범주로 읽되, 두 표현을 구분하여 번역했습니다.
  alternative_readings:
  - 두 표현을 합쳐 하나의 설명구로 처리하는 읽기
  - ‘의의 아들들’을 도덕적 수식어로 약화시키는 읽기
  rationale: 원문은 공동체 정체성과 순종을 함께 제시하므로, 의미 중첩을 지우지 않고 병렬 구조를 살렸습니다.
  doctrine_reference: 언약 공동체/순종의 결합
