revisions:
- from: 10. 이제 내 자녀들아, 내가 죽는다고 해서 슬퍼하지 말고, 내가 끝에 이른다고 해서 마음에 쓰러지지도 마십시오. 나는 너희 가운데서 다시 일어나리니, 의의 아들들 가운데 있는 통치자처럼 너희 한가운데서 일어날 것입니다. 그리고 나는 내 지파 한가운데서 기뻐하리니, 곧 주의 율법을 지키는 모든 사람과 함께하겠습니다. 그러나 경건하지 않은 사람들에게는 주께서 영원한 불을 가져오시고, 세대의 세대에 걸쳐 그들을 멸하실 것입니다. 나는 이제 내 조상들이 그랬던 것처럼 내 안식으로 급히 달려갑니다. 그러나 너희는 너희 생명의 모든 날 동안 너희의 온 힘을 다해 주를 두려워하십시오.[a]
  to: '10. 이제 내 자녀들아, 내가 죽어 간다고 해서 슬퍼하지 말고, 내가 생을 마친다고 해서 슬픔에 쓰러지지도 마십시오. 나는 너희 가운데서 다시 일어날 것이며, 의의 아들들 가운데서 지도자로 있을 것입니다. 또 나는 내 지파, 곧 주의 율법을 지키는 이들 가운데서 기뻐할 것입니다. 그러나 경건하지 않은 자들에게는 주께서 영원한 불을 내리시고, 그들을 세세토록 멸하실 것입니다. 나는 이제 내 조상들도 그러했던 것처럼 내 안식으로 급히 달려갑니다. 그러나 너희는 삶의 모든 날 동안 온 힘을 다하여 주 우리 하나님을 경외하십시오.[a]


    이 말씀을 하시고 그는 잠드셨습니다.[b] 그의 아들들은 그를 나무로 된 관에 넣었습니다. 그 뒤에 그들은 그를 옮겨 가서 그의 조상들과 함께 헤브론에 장사하였습니다.'
  rationale: 누락된 6–7절을 보완하여 장 전체를 복원했습니다. 1–5절은 그리스어 어순과 의미 관계를 따라 자연스러운 합쇼체로 재번역했으며, ἀναστήσομαι의 의미 폭은 ‘다시 일어나다’로 유지하여 부활 또는 재등장의 해석을 단정하지 않았습니다. 비평판상 불확실한 본문은 영어 POB의 처리와 대조하여 필요한 경우 각주로 명시했습니다.
