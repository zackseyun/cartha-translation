    rationale: 그리스어 표제는 ‘Ζαβουλών’(스불론)이며, 그를 야곱과 레아의 여섯째 아들이라고 명시합니다. 제공된 영어 수정 이력의 ‘Dan’은 현 그리스어 원문과 충돌하므로 따를 수 없습니다.
