revisions:
- from: 단의 유언입니다. 그는 자기 아들들에게 말했습니다. “내 말을 들으십시오.”[a]
  to: 야곱과 레아의 여섯째 아들 스불론의 유언입니다. 이것은 스불론이 죽기 전에, 그의 생애 백열네째 해 곧 요셉이 죽은 지 두 해 후에 자기 아들들에게 남긴 말의 사본입니다.
  rationale: 그리스어 원문을 우선하여 인명을 스불론으로 회복하고, 표제와 제1절의 모든 정보를 반영했습니다. 절 경계를 보존하기 위해 제2절의 ‘그가 그들에게 말하였다. 내 말을 들으십시오’는 포함하지 않았습니다. 영어 감사 이력 중 ‘Dan’ 및 120년이라는 내용은 현재 제공된 그리스어 원문과 명백히 상충하므로 채택하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:16Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 그리스어 본문과 달리 인물을 ‘단’으로 바꾸었고, 세불론이 야곱과 레아의 여섯째 아들이라는 표제 및 죽기 전 아들들에게 남긴 말, 생애 114년, 요셉 사후 2년이라는 핵심 정보를 빠뜨렸습니다. 또한 Ἀκούσατέ μου는 제2절의 시작이므로 1:1 본문에 포함하지 않는 것이 맞습니다.
  naturalness: 수정문은 표제와 본문을 구분하여 현대 표준 한국어의 격식 있는 문체로 자연스럽게 옮깁니다. ‘스불론’은 한국어 성경에서 통용되는 고유명사 형태입니다.
  terminology: Ζαβουλών은 ‘스불론’으로 바로잡아야 합니다. Διαθήκη는 문서 표제에서는 ‘유언’으로, ἀντίγραφον λόγων은 ‘말의 사본’으로 옮겨 원문의 문서적 성격을 보존했습니다. 현행 [a]는 근거와 내용이 없는 앵커이므로 제거해야 합니다.
  issues:
