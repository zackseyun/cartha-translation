base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/001.yaml
  text: A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.
translation:
  language: ko
  text: 단의 유언입니다. 그는 자기 아들들에게 말했습니다. “내 말을 들으십시오.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη ... τοῦ ἕκτου υἱοῦ Ἰακὼβ καὶ Λείας
  english_pob_choice: A copy of the words of Zebulun / Dan
  chosen_korean: 단의 유언입니다
  alternatives_korean:
  - 단의 말의 사본입니다
  - 세불론의 유언입니다
  lexicon: 고유명사 번역
  rationale: 본문의 그리스어는 인물의 이름을 단으로 제시하며, 영어 POB 수정 이력도 Zebulun이 아니라 Dan을 반영하므로 한국어도 그 이름을 따릅니다. 서두의 문서 표지를 간결하게 옮겨, 이어지는 연설문 도입과 자연스럽게 연결했습니다.
- source_word: ἔλεξεν / διέθετο / Εἶπεν αὐτοῖς
  english_pob_choice: he spoke to his sons / And he said to them
  chosen_korean: 그는 자기 아들들에게 말했습니다. “내 말을 들으십시오.”
  alternatives_korean:
  - 그는 자기 아들들에게 유언했습니다.
  - 그가 그들에게 말했습니다. “들으십시오.”
  lexicon: 담화 표지
  rationale: 본문의 핵심은 ‘자기 아들들에게 한 말’이며, 이어지는 직접화법의 첫 명령형을 한국어로 자연스럽게 열기 위해 ‘말했습니다’와 ‘들으십시오’를 사용했습니다.
- source_word: Ἀκούσατέ μου
  english_pob_choice: Hear me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 내 말을 들으라
  - 제 말을 들으십시오
  lexicon: 동사-청유/명령
  rationale: 직접 화법의 명령형을 합쇼체로 옮겨 청중인 아들들에게 하는 권면의 뉘앙스를 살렸습니다. 단수 대명사 μου는 한국어에서 자연스럽게 목적어 ‘내 말’로 풀었습니다.
theological_decisions:
- issue: 문서 표지와 첫 발화만을 반영할지, 뒤에 이어지는 생애 연대 정보를 포함할지
  chosen_reading: 이 절은 장 서두의 표제와 2절의 발화 도입까지만 담고, 뒤의 연대·생애 정보는 여기서 추가하지 않았습니다.
  alternative_readings:
  - 영어 POB 초안처럼 ‘그가 죽기 전… 요셉의 죽음 후 2년’ 등의 정보를 덧붙이는 방식
  - 연대 정보를 괄호로 함께 넣는 방식
  rationale: 제시된 그리스어 본문은 아직 절 분할이 완전히 맞지 않은 단편이며, 이 단에는 단의 직접 발화 도입만 확실합니다. 그래서 소스에 분명히 보이는 범위만 옮겨 과잉 확장을 피했습니다.
  doctrine_reference: 본문비평/절 경계 보존 원칙
