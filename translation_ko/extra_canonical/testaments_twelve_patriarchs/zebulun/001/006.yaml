base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/006.yaml
  text: But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.
translation:
  language: ko
  text: 그러나 나는 요셉 때문에 여러 날 동안 몰래 울었습니다. 형제들이 모두 비밀을 누설하는 자는 죽을 것이라고 합의했기 때문에, 나는 형제들을 두려워했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον ... ἐν κρυπτῷ πολλὰς ἡμέρας
  english_pob_choice: I wept in secret for many days
  chosen_korean: 몰래 울었습니다 / 여러 날 동안
  alternatives_korean:
  - 숨은 곳에서 여러 날 울었습니다
  - 오랫동안 은밀히 울었습니다
  lexicon: ἐν κρυπτῷ / πολλὰς ἡμέρας
  rationale: ‘ἐν κρυπτῷ’는 단순히 내면적 슬픔이 아니라 드러나지 않게 숨겨서 운 상태를 뜻하므로 ‘몰래’로, ‘πολλὰς ἡμέρας’는 기간의 길이를 살려 ‘여러 날 동안’으로 옮겼습니다.
- source_word: διὰ τὸν Ἰωσὴφ
  english_pob_choice: because of Joseph
  chosen_korean: 요셉 때문에
  alternatives_korean:
  - 요셉으로 인해
  - 요셉을 두고
  lexicon: διά + accusative
  rationale: 원인은 요셉과 관련된 사건 자체에 있으므로 한국어에서도 직접적 인과를 드러내는 ‘때문에’가 가장 자연스럽습니다.
- source_word: φοβούμενος τοὺς ἀδελφούς μου
  english_pob_choice: for I was afraid of my brothers
  chosen_korean: 형들을 두려워했습니다
  alternatives_korean:
  - 형들이 무서웠습니다
  - 형들을 겁냈습니다
  lexicon: φοβέομαι
  rationale: 형제 관계를 고려해 ‘형들’로 풀되, 단순한 감정 표현보다 원문의 두려움 상태를 살려 ‘두려워했습니다’로 옮겼습니다.
- source_word: συνέθεντο πάντες ὅτι ὃς ἂν φανερώσῃ τὸ μυστήριον ἀποθανεῖται
  english_pob_choice: because they had all agreed that whoever disclosed the secret should be put to death
  chosen_korean: 형들이 모두 비밀을 누설하는 자는 죽여야 한다고 합의했기 때문에
  alternatives_korean:
  - 그들이 모두 그 비밀을 드러내는 자를 죽이기로 합의했기 때문에
  - 모두가 비밀을 밝히는 자는 죽는다고 정했기 때문에
  lexicon: συντίθημι / μυστήριον / ἀποθνῄσκω
  rationale: ‘μυστήριον’은 여기서 신비보다 ‘비밀’이 문맥에 맞고, ‘ἀποθανεῖται’는 문장 전체의 위협적 결정을 살려 ‘죽여야 한다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 직접 인용된 형제들의 결의 문구의 강도
  chosen_reading: ‘비밀을 누설하는 자는 죽여야 한다’로 옮겨, 원문의 살해 위협을 약화하지 않았습니다.
  alternative_readings:
  - ‘죽임을 당할 것이다’
  - ‘반드시 죽는다’
  rationale: 본문은 단순한 결과 진술보다 공동 결의에 따른 처형 위협을 담고 있어, 한국어에서도 그 긴장과 폭력을 분명히 드러내는 쪽이 소스 충실도에 맞습니다.
  doctrine_reference: source fidelity / narrative force
