- from: 그러나 나는 요셉 때문에 여러 날 동안 몰래 울었습니다. 형들이 모두 비밀을 누설하는 자는 죽여야 한다고 합의했기 때문에, 나는 형들을 두려워했습니다.
  to: 그러나 나는 요셉 때문에 여러 날 동안 몰래 울었습니다. 형제들이 모두 비밀을 누설하는 자는 죽을 것이라고 합의했기 때문에, 나는 형제들을 두려워했습니다.
  rationale: 원문의 인과관계와 비밀 유지에 따른 죽음의 위협은 유지하되, ἀποθανεῖται가 명시하지 않는 처형 주체와 의무성을 추가하지 않도록 ‘죽을 것이라고’로 고쳤습니다. 또한 ἀδελφούς의 연령 중립성을 보존하기 위해 ‘형들’을 ‘형제들’로 고쳤습니다.
