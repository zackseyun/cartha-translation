review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 잘 전달합니다. 다만 ἀποθανεῖται는 문법상 ‘죽을 것이다’라는 결과 진술이며, ‘죽여야 한다’는 의무 및 처형 주체를 덧붙입니다. 원문의 표현상 자발적 죽음인지 타인에 의한 죽음인지가 명시되지 않으므로 이를 보존하는 편이 안전합니다.
  naturalness: 전반적으로 자연스럽고 현대 표준 한국어 합쇼체에 맞습니다. ‘형들을 두려워했습니다’도 가능하나, 원문의 ἀδελφούς에는 연령 관계가 명시되지 않으므로 ‘형제들을 두려워했습니다’가 더 중립적이고 정확합니다.
  terminology: ‘요셉’, ‘비밀’, ‘누설하다’는 적절합니다. φανερώσῃ에는 ‘드러내다’가 더 직접적으로 대응하지만, 이 문맥에서 ‘비밀을 누설하다’도 자연스럽습니다.
  issues:
  - severity: medium
    issue: ‘죽여야 한다’가 원문의 미래 결과 진술을 의무적 처형 결정으로 한정합니다.
    rationale: ἀποθανεῖται는 ‘죽을 것이다’이며, 처형 방식이나 주체를 명시하지 않습니다. 논쟁적·미확정적인 세부를 추가하지 않도록 결과 표현으로 옮겨야 합니다.
  - severity: low
    issue: ‘형들’은 ἀδελφοί가 지닌 연령 중립성을 좁힙니다.
    rationale: 형제 전체를 가리키는 문맥에서는 ‘형제들’이 원문의 친족 명칭을 더 직접적으로 보존합니다.
  revised_text: 그러나 나는 요셉 때문에 여러 날 동안 몰래 울었습니다. 형제들이 모두 비밀을 누설하는 자는 죽을 것이라고 합의했기 때문에, 나는 형제들을 두려워했습니다.
