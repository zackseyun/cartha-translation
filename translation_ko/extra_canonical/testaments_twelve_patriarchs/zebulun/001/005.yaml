  text: I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.
translation:
  language: ko
  text: 유다의 여섯째 아들 야곱과 레아의 자손 스불론의 유언입니다. I. 스불론이 자기 아들들에게 남긴 말의 기록으로서, 그가 죽기 전에—곧 자기 생애의 백십사년째에—요셉이 죽은 뒤 두 해가 지난 때였습니다. 2. 그가 그들에게 말했습니다. “내 말을 들으십시오,”[a][b]
  philosophy: formal
lexical_decisions:
- source_word: Διαθήκη Ζαβουλὼν τοῦ ἕκτου υἱοῦ Ἰακὼβ καὶ Λείας
  english_pob_choice: A copy of the words of Dan...
  chosen_korean: 유다의 여섯째 아들 야곱과 레아의 자손 스불론의 유언입니다
  alternatives_korean:
  - 스불론의 유언입니다
  - 야곱과 레아의 여섯째 아들 스불론의 유언입니다
  lexicon: 고유명사/서두 표제
  rationale: 제공된 그리스어 본문은 스불론을 분명히 가리키므로, 영어 초안의 Dan은 오기/오정렬로 보고 본문을 따라 스불론으로 옮겼습니다. ΔΙΑΘΗΚΗ는 이 장르에서 ‘유언’이 가장 자연스럽습니다.
- source_word: Ἀντίγραφον λόγων ... ὧν διέθετο τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: A copy of the words ... which he spoke to his sons
  chosen_korean: 스불론이 자기 아들들에게 남긴 말의 기록
  alternatives_korean:
  - 스불론의 말들의 사본
  - 아들들에게 유언한 말의 사본
  lexicon: ἀντίγραφον / λόγοι / διαθέτομαι
  rationale: ἀντίγραφον은 단순한 ‘말’보다 ‘기록/사본’의 성격을 드러내고, διέθετο는 유산처럼 ‘남기다/맡기다’의 뜻이 있어 이를 함께 살렸습니다.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the one hundred and twentieth year
  chosen_korean: 자기 생애의 백십사년째에
  alternatives_korean:
  - 자기 생애의 백이십년째에
  - 백십사세 되던 해에
  lexicon: ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ
  rationale: 그리스어 수사는 백십사(114)이며, 영어 초안의 one hundred and twentieth year는 본문 수와 맞지 않아 본문을 따랐습니다.
- source_word: Ἀκούσατέ μου
  english_pob_choice: my children...
  chosen_korean: “내 말을 들으십시오,”
  alternatives_korean:
  - “제 말을 들으십시오,”
  - “나의 말을 들으라,”
  lexicon: ἀκούσατέ μου
  rationale: 직접화법은 다수 청중을 향한 정중한 명령이므로 합쇼체 명령형으로 옮겼습니다.
theological_decisions:
- issue: 본문 대조 정합성
  chosen_reading: 영어 POB 초안의 Dan/120세 표현을 따르지 않고, 제시된 그리스어 원문에 맞춰 스불론/114년을 본문에 반영했습니다.
  alternative_readings:
  - 영어 초안 유지
  - 본문과 영어 초안의 절충
  rationale: 이 항목은 원문 대조가 핵심이므로, 번역보다 정정이 우선입니다. 원문에 없는 인명과 수치를 유지하면 독자가 실제 소스 의미를 오해하게 됩니다.
  doctrine_reference: 본문비평/원문정합
