base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/002.yaml
  text: 'And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.'
translation:
  language: ko
  text: 야곱과 레아의 여섯째 아들인 스불론의 유언입니다. 이 책은 그의 아들들에게 남긴 말의 사본으로, 그가 죽기 전에, 곧 자기 생애의 백열넷째 해에, 요셉이 죽은 뒤 두 해가 지난 때에 기록되었습니다. 그가 그들에게 말했습니다. 「내 말을 들으십시오, 스불론의 아들들아. 아버지의 말에 귀를 기울이십시오.」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη Ζαβουλὼν τοῦ ἕκτου υἱοῦ Ἰακὼβ καὶ Λείας
  english_pob_choice: A copy of the words of Dan
  chosen_korean: 야곱과 레아의 여섯째 아들인 스불론의 유언입니다.
  alternatives_korean:
  - 스불론의 유언입니다.
  - 야곱과 레아의 여섯째 아들 스불론의 유언입니다.
  lexicon: 고유명사 음역 / 서문 표지
  rationale: 원문은 제목형 서문으로 스불론의 정체를 밝히는 말이므로, 본문 흐름을 해치지 않는 범위에서 ‘유언’으로 자연스럽게 옮겼습니다. 영어 판본의 unrelated Dan 서술은 교정 전 잔여물로 보이므로 따르지 않았습니다.
- source_word: Ἀντίγραφον λόγων
  english_pob_choice: A copy of the words
  chosen_korean: 이 책은 그의 아들들에게 남긴 말의 사본으로
  alternatives_korean:
  - 말의 사본입니다.
  - 말들을 베낀 글입니다.
  lexicon: ἀντίγραφον / λόγοι
  rationale: ἀντίγραφον은 단순한 ‘복사본’보다 문서의 전승을 드러내는 ‘사본’이 적절하고, λόγοι는 단수화하지 않고 ‘말’로 유지해 원문의 집합적 표현을 살렸습니다.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει
  english_pob_choice: in the one hundred and twentieth year
  chosen_korean: 자기 생애의 백열넷째 해에
  alternatives_korean:
  - 백스물넷째 해에
  - 백이십사세에
  lexicon: 연대 표기
  rationale: 원문 수사는 104년을 가리키므로, 영어 POB의 120th가 아니라 그리스어 수사를 직접 반영해 ‘백열넷째 해’로 옮겼습니다.
- source_word: μετὰ οὖν δύο ἔτη τοῦ θανάτου Ἰωσήφ
  english_pob_choice: two years after the death of Joseph
  chosen_korean: 요셉이 죽은 뒤 두 해가 지난 때에
  alternatives_korean:
  - 요셉의 죽음 후 두 해 뒤에
  - 요셉이 죽고 두 해가 지난 뒤에
  lexicon: μετά + 시간 표현
  rationale: μετά + 속격의 시간 순서를 한국어의 ‘~뒤에’로 자연스럽게 옮겨, 사건 간 시간 관계를 명료하게 했습니다.
- source_word: Ἀκούσατέ μου
  english_pob_choice: Listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 내게 들으십시오
  - 내 말을 들으라
  lexicon: ἀκούω
  rationale: 직접 권면의 명령형을 현대 한국어 합쇼체로 살려, 단순 청취가 아니라 화자의 말을 받아들이라는 요청을 분명히 했습니다.
theological_decisions:
- issue: 서문 형식의 본문 처리
  chosen_reading: 본문은 이야기 본문이 아니라 유언서 서문과 직설 화법으로 구성된 제목-도입문으로 처리했습니다.
  alternative_readings:
  - 단순히 한 문장씩 끊어 서술문으로만 옮김
  - 영어 POB의 unrelated Dan 문장을 따라 감
  rationale: 원문은 장 제목과 본문 도입이 섞인 형식이므로, 한국어에서도 문서적 서문과 직접화법을 구분해 독자가 텍스트의 성격을 이해하도록 했습니다.
  doctrine_reference: 문헌 형식 보존 / 본문 문맥 존중
