  source_fidelity: 개정이 필요합니다. 제공된 그리스어에서 1:2에 해당하는 직접 발화는 “Ἀκούσατέ μου”(“내 말을 들으십시오”)뿐입니다. 초안의 “스불론의 아들들아. 아버지의 말에 귀를 기울이십시오”는 제공된 원문 단편에는 없으므로 본문에 보태지 않아야 합니다. 또한 διέθετο는 아들들에게 말을 ‘전하다/남기다’라는 뜻이지, 그 시점에 문서가 ‘기록되었다’는 진술은 아닙니다.
  naturalness: 합쇼체는 대체로 적절하지만, 제목은 ‘입니다’보다 명사형 표제가 자연스럽습니다. ‘백열넷째 해’는 현대 한국어에서 수사가 즉시 파악되지 않으므로 ‘백십사째 해’가 분명하고 자연스럽습니다.
  terminology: Ζαβουλών은 ‘스불론’, Ἰωσήφ는 ‘요셉’으로 적절합니다. Διαθήκη는 이 문헌의 제목·유언 형식에 맞추어 ‘유언’으로 옮길 수 있습니다. Ἀντίγραφον λόγων은 ‘말의 사본’으로 유지하되, 말한 주체와 수신자를 한국어 문장 안에서 명확히 밝혔습니다.
