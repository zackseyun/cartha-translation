revisions:
- from: 야곱과 레아의 여섯째 아들인 스불론의 유언입니다. 이 책은 그의 아들들에게 남긴 말의 사본으로, 그가 죽기 전에, 곧 자기 생애의 백열넷째 해에, 요셉이 죽은 뒤 두 해가 지난 때에 기록되었습니다. 그가 그들에게 말했습니다. 「내 말을 들으십시오, 스불론의 아들들아. 아버지의 말에 귀를 기울이십시오.」[a][b]
  to: '야곱과 레아의 여섯째 아들 스불론의 유언.


    스불론이 죽기 전, 곧 요셉이 죽은 지 두 해 뒤인 그의 생애 백십사째 해에 자기 아들들에게 전한 말의 사본입니다.


    그가 그들에게 말했습니다. “내 말을 들으십시오.”'
  rationale: 제목과 서문은 제공된 그리스어의 문서 형식을 보존하되, 원문이 말하지 않는 기록 행위는 제거했습니다. 연대와 나이는 원문의 수사와 시간 관계를 정확히 반영했습니다. 1:2의 직접화법은 그리스어 단편으로 확인되는 범위만 번역했으며, 근거 없는 [a][b] 표지는 삭제했습니다. 영어 POB의 추가 문구는 감사 추적용 참고로는 인지하되, 현 제공 원문 단편보다 우선하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:17Z'
