  text: I do not know that I sinned in my days, except in thought.
translation:
  language: ko
  text: 나는 내 생애 동안 생각으로 죄를 지은 것 외에는 죄를 지은 줄 알지 못합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἥμαρτον / sinned
  english_pob_choice: I do not know that I sinned
  chosen_korean: “죄를 지었다고는 알지 못합니다”
  alternatives_korean:
  - “죄를 지었다고 생각하지 않습니다”
  - “내가 죄를 지은 적이 있는지 알지 못합니다”
  lexicon: 죄를 짓다
  rationale: 죄를 추상명사로만 두지 않고 동사구로 옮겨, 화자가 자신의 행위에 대한 부정을 말하는 본문의 직접성을 살렸습니다.
- source_word: ἐν ταῖς ἡμέραις μου / in my days
  english_pob_choice: in my days
  chosen_korean: “내 날들에”
  alternatives_korean:
  - “내 생애 동안”
  - “내 평생에”
  lexicon: 날들
  rationale: 기간 표현을 자연스러운 한국어로 옮기되, 원문의 복수적 시간 감각을 지나치게 평탄화하지 않기 위해 “내 날들”을 유지했습니다.
- source_word: εἰ μὴ ἐν διανοίᾳ / except in thought
  english_pob_choice: except in thought
  chosen_korean: “다만 생각으로는”
  alternatives_korean:
  - “오직 생각으로만은”
  - “생각에서만은”
  lexicon: 생각
  rationale: 행위가 아니라 내면의 생각 차원이라는 대조를 분명히 드러내기 위해 간결하게 옮겼습니다.
theological_decisions:
- issue: 내적 죄책의 범위
  chosen_reading: 화자는 실제 행위의 죄는 부정하면서, 예외를 ‘생각’으로 한정해 내면의 죄 가능성을 남겨 둡니다.
  alternative_readings:
  - 완전한 무죄 주장
  - 단순한 수사적 과장
  rationale: 영어 POB와 그리스어는 행위와 생각을 구분하며, 본문은 도덕적 자기점검을 말할 뿐 절대적 무죄 교리를 선언하지 않습니다.
  doctrine_reference: 성화와 인간의 내적 죄성에 대한 일반적 성경적 긴장
