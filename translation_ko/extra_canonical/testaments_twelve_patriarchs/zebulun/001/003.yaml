base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/003.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.
translation:
  language: ko
  text: 야곱과 레아의 여섯째 아들인 스불론의 유언입니다. 그는 아들들에게 남긴 말의 사본을, 자기 생애의 백이십 년째에 기록했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: Testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 증언
  - 유언서
  lexicon: διαθήκη
  rationale: 이 문맥은 성경의 공적 ‘언약’이라기보다 개인이 자녀들에게 남기는 마지막 말의 기록이므로, POB의 영어 제목 취지를 살리면서 한국어에서는 ‘유언’이 가장 자연스럽습니다.
- source_word: Ἀντίγραφον λόγων
  english_pob_choice: Copy of the words
  chosen_korean: 말의 사본
  alternatives_korean:
  - 말의 복사본
  - 말씀의 사본
  - 기록
  lexicon: ἀντίγραφον / λόγοι
  rationale: ἀντίγραφον의 ‘사본’과 λόγων의 ‘말’을 직접 반영해, 원문이 전하는 문서성·전달성을 유지했습니다.
- source_word: τοῖς υἱοῖς αὐτοῦ
  english_pob_choice: to his sons
  chosen_korean: 아들들에게
  alternatives_korean:
  - 아들들에게
  - 자식들에게
  - 후손들에게
  lexicon: υἱοί
  rationale: 직역상 ‘아들들’이 가장 정확하며, 이 텍스트의 가족 내부 خطاب을 분명히 드러냅니다.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει τῆς ζωῆς αὐτοῦ
  english_pob_choice: in the one hundred and twentieth year
  chosen_korean: 자기 생애의 백이십 년째
  alternatives_korean:
  - 백이십 살 되던 해에
  - 백이십 년에
  - 생애의 백이십 번째 해에
  lexicon: ἔτος / ζωή
  rationale: 그리스어는 ‘생애의 연도’를 말하므로, 나이를 현대 한국어로 자연스럽게 풀어 ‘백이십 년째’로 옮겼습니다.
