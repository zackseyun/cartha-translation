revisions:
- from: 야곱과 레아의 여섯째 아들인 스불론의 유언입니다. 그는 아들들에게 남긴 말의 사본을, 자기 생애의 백이십 년째에 기록했습니다.
  to: '야곱과 레아의 여섯째 아들 스불론의 유언서입니다.


    스불론이 죽기 전에, 그의 생애 제백열네 해에, 요셉이 죽은 뒤 두 해가 지나서 아들들에게 남긴 말의 사본입니다.


    그가 그들에게 말했습니다. “내 말을 들으십시오.”'
  rationale: 제공된 그리스어 단편 전체를 반영하여 표제, 문서의 성격, 수신자, 죽음 전이라는 상황, 제114년이라는 연대, 요셉 사후 2년이라는 상대 연대, 그리고 발화 도입을 모두 복원했습니다. 원문에 없는 필사 행위의 진술은 제거했습니다. 제공된 원문 주석 번호의 실질 내용은 제시되지 않았으므로 근거 없는 역주 표지는 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:16Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 제목의 기본 정보는 일부 반영하지만, 그리스어 본문이 말하는 ‘죽기 전에’, ‘생애의 백열네 번째 해에’, ‘요셉이 죽은 뒤 두 해가 지나서’ 및 이어지는 발화 도입을 빠뜨렸습니다. 또한 ‘기록했습니다’는 원문의 διέθετο(아들들에게 남기다/전하다)에 맞지 않으며, 연령을 ‘백이십 년째’로 옮긴 것은 수치상 오류입니다.
  naturalness: ‘스불론이 죽기 전에 아들들에게 남긴 말의 사본’은 현대 표준 한국어로 자연스럽고 문서의 표제 성격도 보존합니다. ‘내 말을 들으십시오’는 아들들에게 하는 직접 발화에 맞는 합쇼체입니다.
  terminology: Διαθήκη는 이 문맥에서 개인의 마지막 당부를 담은 문서이므로 ‘유언’이 가능하나, 표제의 문서성을 더 분명히 하는 ‘유언서’가 적절합니다. 고유명사는 통상 표기인 ‘스불론’, ‘야곱’, ‘레아’, ‘요셉’을 사용했습니다.
  issues:
  - severity: high
    issue: 연대 수치가 ‘백이십 년째’로 잘못 번역되었습니다.
    rationale: ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ는 제114년(100+4+10)을 뜻합니다.
  - severity: high
    issue: 핵심 시간·상황 정보가 누락되었습니다.
    rationale: πρὶν ἢ ἀποθανεῖν αὐτόν(그가 죽기 전)과 μετὰ δύο ἔτη τοῦ θανάτου Ἰωσήφ(요셉이 죽은 뒤 두 해 후)가 본문에 명시되어 있습니다.
  - severity: medium
    issue: ‘기록했습니다’가 διέθετο의 의미를 좁히고 주체·구문을 바꿉니다.
    rationale: 여기서는 스불론이 아들들에게 말을 남기거나 전한 것을 가리키며, 필사 행위를 직접 진술하지 않습니다.
  - severity: medium
    issue: 제공된 그리스어 단편의 마지막 발화 도입이 번역에서 빠졌습니다.
    rationale: Εἶπεν αὐτοῖς· Ἀκούσατέ μου는 ‘그가 그들에게 말했습니다. 내 말을 들으십시오’라는 직접 인용의 시작입니다.
