  text: Yet when they wanted to kill him, with tears I begged them not to commit this sin.
translation:
  language: ko
  text: 그러나 그들이 그를 죽이려 했을 때, 나는 눈물로 그들에게 이 죄를 짓지 말라고 간청했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθανεῖν αὐτόν / to kill him
  english_pob_choice: wanted to kill him
  chosen_korean: 그를 죽이려 했을 때
  alternatives_korean:
  - 그를 죽이고자 했을 때
  - 그를 죽이려는 마음을 품었을 때
  lexicon: ἀποθνῄσκω
  rationale: 영어 POB의 ‘wanted to kill him’에 맞추되, 한국어에서는 의도와 실행 직전의 긴장을 살리기 위해 ‘죽이려 했을 때’로 옮겼습니다.
- source_word: ἐν δάκρυσιν / with tears
  english_pob_choice: with tears
  chosen_korean: 눈물로
  alternatives_korean:
  - 눈물을 흘리며
  - 눈물 가운데
  lexicon: δάκρυον
  rationale: 부사구의 수단·상태를 자연스럽게 드러내는 한국어 관용 표현으로 ‘눈물로’가 가장 간결하고 직결됩니다.
- source_word: παρεκάλεσα / begged, pleaded
  english_pob_choice: I begged them not to commit this sin
  chosen_korean: 그들에게 이 죄를 짓지 말라고 간청했습니다
  alternatives_korean:
  - 그들에게 이 죄를 범하지 말라고 간구했습니다
  - 그들에게 이 죄를 짓지 말아 달라고 애원했습니다
  lexicon: παρακαλέω
  rationale: παρακαλέω의 간절한 요청을 ‘간청했습니다’로 옮겨 감정의 강도와 호소성을 보존했습니다.
- source_word: ἁμαρτίαν / sin
  english_pob_choice: this sin
  chosen_korean: 이 죄
  alternatives_korean:
  - 이 죄악
  - 이 잘못
  lexicon: ἁμαρτία
  rationale: source의 도덕적·신학적 판단을 약화하지 않기 위해 일반적이고 직접적인 ‘죄’를 유지했습니다.
theological_decisions:
- issue: 화자의 개입 방식
  chosen_reading: 화자는 살인을 제지하기 위해 눈물로 간청한 인물로 제시됩니다.
  alternative_readings:
  - 단순한 감정 표현으로 약화해 번역하는 방식
  - 형제들에게 도덕적 훈계를 하는 방식으로 확장하는 번역
  rationale: Greek source와 POB audit trail 모두 제지 행위와 눈물의 절박함을 강조하므로, 설교적 확장 없이 직접적인 서술을 유지했습니다.
  doctrine_reference: 본문의 윤리적 경고와 회개의 촉구에 관한 일반적 성경적 도덕 교훈
