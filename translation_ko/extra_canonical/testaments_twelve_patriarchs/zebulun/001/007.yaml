  source_fidelity: 제시된 그리스어는 제불론 유언 1장 표제와 1–2절의 일부만 포함하며, 대상 절 1:7의 그리스어 본문은 정렬되어 있지 않아 원문 대조를 완결할 수 없습니다. 다만 제공된 영어 POB 감사 문구(“Yet when they wanted to kill him, with tears I begged them not to commit this sin.”)의 의미 요소—대조, 살해 의도, 눈물, 간청, ‘이 죄’—를 한국어 번역이 충실히 보존합니다.
  naturalness: “그러나 그들이 그를 죽이려 했을 때, 나는 눈물로 그들에게 이 죄를 짓지 말라고 간청했습니다.”는 현대 표준 한국어 합쇼체로 자연스럽고 문맥상 긴박감도 적절합니다. ‘눈물로’는 간결한 문어적 표현으로 허용됩니다.
  terminology: ‘죄’는 영어 감사 문구의 sin에 정확히 대응하며 불필요하게 교리적으로 확대하지 않습니다. ‘간청했습니다’는 begged의 간절한 호소를 잘 전달합니다. 인명이나 각주 표지가 본 절 번역에 요구되지 않습니다.
