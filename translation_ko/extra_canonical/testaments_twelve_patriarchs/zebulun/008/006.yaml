base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/006.yaml
  text: For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.
translation:
  language: ko
  text: 이것은 일치를 갈라놓고, 모든 친족 관계를 흩어 놓으며, 영혼을 어지럽히고, 얼굴을 망가뜨립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρίζει ἑνότητα
  english_pob_choice: divides unity
  chosen_korean: 하나 됨을 나누고
  alternatives_korean:
  - 일치를 갈라놓고
  - 연합을 깨뜨리고
  lexicon: χωρίζω
  rationale: 행위의 결과를 ‘하나 됨’과의 분리로 살려, 단순한 분열이 아니라 기존의 일치를 끊는 뉘앙스를 반영했습니다.
- source_word: πᾶσαν συγγένειαν
  english_pob_choice: every kinship
  chosen_korean: 모든 친족 관계를
  alternatives_korean:
  - 모든 혈연을
  - 온갖 친족을
  lexicon: συγγένεια
  rationale: συγγένεια는 단순한 가족보다 친족/혈족 관계를 가리키므로, 관계성까지 드러내는 ‘친족 관계’를 택했습니다.
- source_word: διασκορπίζει
  english_pob_choice: scatters
  chosen_korean: 흩뜨리며
  alternatives_korean:
  - 흩어 버리며
  - 흩뿌리며
  lexicon: διασκορπίζω
  rationale: 대상을 사방으로 흩어 놓는 동작을 자연스럽게 살리되, 문맥상 공동체적 해체감을 유지했습니다.
- source_word: ἀφανίζει
  english_pob_choice: disfigures
  chosen_korean: 일그러뜨립니다
  alternatives_korean:
  - 흉하게 만듭니다
  - 형체를 없앱니다
  lexicon: ἀφανίζω
  rationale: 영어 POB의 ‘disfigures’에 맞춰 외형이 망가지는 효과를 살렸고, 단순한 ‘없애다’보다 얼굴의 훼손을 직접적으로 드러냈습니다.
theological_decisions:
- issue: 지혜/악행의 공동체적 파괴 묘사
  chosen_reading: 본문의 동사들을 모두 현재형으로 옮겨, 분열이 관계와 내면, 외양까지 연쇄적으로 무너뜨리는 지속적 प्रभाव을 드러냈습니다.
  alternative_readings:
  - 과거 서술형으로 완결시키는 번역
  - 설명적으로 풀어 쓰는 번역
  rationale: 이 구절은 교훈적 진술이므로 행위의 일반적 결과를 현재적 진술로 제시하는 것이 원문과 영어 POB의 힘을 가장 잘 보존합니다.
  doctrine_reference: 문맥상 공동체 윤리와 인간 온전성에 대한 일반적 교훈
