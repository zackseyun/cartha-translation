id: T12P.ZEB.8.1
reference: Testament of Zebulun 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: VIII. Καὶ ὑμεῖς οὖν, τέκνα μου, ἔχετε εὐσπλαγχνίαν *κατὰ παντὸς ἀνθρώπου¹ ἐν ἐλέει, ἵνα καὶ ὁ Κύριος *εἰς ὑμᾶς σπλαγχνισθεὶς² ἐλεήσῃ ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/001.yaml
  text: And so, my children, have compassion toward every person in mercy, so that the Lord also, having compassion on you, may show you mercy.
translation:
  language: ko
  text: 그러므로 너희도, 내 자녀들아, 모든 사람을 자비로 불쌍히 여기십시오. 그러면 주님께서도 너희를 불쌍히 여기시어 너희에게 자비를 베푸실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχετε εὐσπλαγχνίαν
  english_pob_choice: have compassion
  chosen_korean: 자비롭게 대하다
  alternatives_korean:
  - 연민을 가지다
  - 긍휼을 품다
  - 불쌍히 여기다
  lexicon: εὐσπλαγχνία
  rationale: 행위 명령으로서의 감정만이 아니라 태도와 대응을 함께 담아, 한국어에서는 자연스러운 동사구인 ‘자비롭게 대하다’로 옮겼습니다.
- source_word: κατὰ παντὸς ἀνθρώπου
  english_pob_choice: toward every person
  chosen_korean: 모든 사람에게
  alternatives_korean:
  - 모든 사람을 향해
  - 각 사람에게
  - 모든 인류에게
  lexicon: κατά + accusative
  rationale: 관계의 방향성을 살리되 문장을 매끄럽게 하기 위해 ‘~에게’로 풀어 옮겼습니다.
- source_word: ἐν ἐλέει
  english_pob_choice: in mercy
  chosen_korean: 자비 안에서
  alternatives_korean:
  - 자비로
  - 자비 속에서
  - 긍휼 안에서
  lexicon: ἐν + dative
  rationale: 영어 POB의 수정 취지를 따라 ἐν의 국면을 유지해, 단순한 수단보다 ‘자비의 영역/상태 안에서’라는 뉘앙스를 살렸습니다.
- source_word: σπλαγχνισθεὶς
  english_pob_choice: having compassion
  chosen_korean: 불쌍히 여기셔서
  alternatives_korean:
  - 자비를 베푸셔서
  - 긍휼히 여기셔서
  - 연민을 가지셔서
  lexicon: σπλαγχνίζομαι
  rationale: 주님의 반응을 한국어 성경체에서 자연스럽고 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 주님의 응답을 표현하는 종결 방식
  chosen_reading: ‘주님도 너희를 불쌍히 여기셔서 너희에게 자비를 베푸실 것입니다’로, 인간의 자비 실천과 주님의 자비로운 응답의 상응 구조를 분명히 했습니다.
  alternative_readings:
  - ‘주님도 너희에게 긍휼을 베푸셔서…’
  - ‘주님도 너희를 가엾게 여기셔서…’
  rationale: 본문의 조건-결과 구조는 윤리적 행위가 하나님의 자비로운 응답과 대응됨을 강조하므로, 동사 반복을 통해 대칭성을 유지했습니다.
  doctrine_reference: 형벌적 교환이 아니라 자비의 상호성이라는 본문 고유의 권면 구조
- issue: 호칭과 직접 권면의 어조
  chosen_reading: ‘내 자녀들아’와 ‘하십시오’ 체를 함께 사용해, 친밀한 권면과 공적 문체를 동시에 살렸습니다.
  alternative_readings:
  - ‘내 자녀들아’만 유지하고 평서형으로 처리
  - ‘얘들아’ 같은 더 구어적인 호칭
  rationale: 본문의 친자적 호칭은 보존하되, 합쇼체 전체 흐름에 맞게 직접 명령을 정중하게 처리했습니다.
  doctrine_reference: 권면 담화의 수사적 친밀성
