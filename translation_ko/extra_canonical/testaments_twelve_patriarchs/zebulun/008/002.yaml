  text: For indeed in the last days God will send his compassion upon the earth, and wherever he finds compassion of mercy, there he dwells.
translation:
  language: ko
  text: 참으로 마지막 날들에 하나님께서 자신의 긍휼을 땅 위에 보내실 것이며, 그가 긍휼의 긍휼을 찾는 곳마다 그 안에 거하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ σπλάγχνα αὐτοῦ
  english_pob_choice: his compassion
  chosen_korean: 자신의 긍휼
  alternatives_korean:
  - 그의 긍휼
  - 자비
  - 마음의 긍휼
  lexicon: σπλάγχνα
  rationale: σπλάγχνα는 문자 그대로 ‘내장’이지만, 본문과 English POB의 의미상 ‘compassion’을 따라 하나님의 깊은 긍휼을 뜻하는 표현으로 옮겼습니다.
- source_word: ἐπὶ τῆς γῆς
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 지상에
  - 땅에
  - 세상에
  lexicon: γῆ
  rationale: γῆ를 우주론적이기보다 지상적 범위의 ‘땅’으로 자연스럽게 옮겨, POB의 ‘upon the earth’를 살렸습니다.
- source_word: σπλάγχνα ἐλέους
  english_pob_choice: compassion of mercy
  chosen_korean: 긍휼의 긍휼
  alternatives_korean:
  - 자비의 긍휼
  - 연민의 긍휼
  - 긍휼과 자비
  lexicon: σπλάγχνα / ἐλέος
  rationale: 반복된 명사구를 그대로 반영해 ‘긍휼의 긍휼’로 두어, 본문이 말하는 중첩된 자비의 뉘앙스를 보존했습니다.
- source_word: ἐν αὐτῷ κατοικεῖ
  english_pob_choice: there he dwells
  chosen_korean: 그 안에 거하십니다
  alternatives_korean:
  - 그곳에 거하십니다
  - 거주하십니다
  - 머무십니다
  lexicon: κατοικέω
  rationale: 거하다/거주하다의 상주 의미를 살리되, 주어가 하나님이므로 합쇼체로 정리했습니다.
theological_decisions:
- issue: 하나님의 ‘긍휼’이 사람의 내면적 감정이 아니라 의도적으로 ‘보내지는’ 대상처럼 묘사됨
  chosen_reading: 하나님께서 자신의 긍휼을 땅 위에 보내신다고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 하나님께서 자비를 베푸신다
  - 하나님께서 은혜를 내리신다
  rationale: 원문은 ἀποστελεῖ(보내다)를 사용하여 하나님의 긍휼이 능동적으로 파견되는 것처럼 말하므로, 일반화하여 완화하지 않았습니다.
  doctrine_reference: divine agency in mercy
- issue: ‘wherever he finds compassion of mercy, there he dwells’의 상호적 표현
  chosen_reading: 긍휼의 응답이 있는 곳에 하나님이 거하신다는 상호성으로 옮겼습니다.
  alternative_readings:
  - 자비로운 사람에게 거하신다
  - 긍휼을 베푸는 곳에 거하신다
  rationale: 본문의 조건절은 하나님의 내주를 인간 쪽의 긍휼과 연결하므로, 원문의 조건-응답 구조를 보존했습니다.
  doctrine_reference: divine indwelling and mercy
