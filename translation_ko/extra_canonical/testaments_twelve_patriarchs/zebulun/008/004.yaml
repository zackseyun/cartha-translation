translation:
  language: ko
  text: 그런데 우리가 이집트로 내려갔을 때, 요셉은 우리에게 원한을 품지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατήλθομεν εἰς Αἴγυπτον
  english_pob_choice: we went down to Egypt
  chosen_korean: 우리가 이집트로 내려갔을 때
  alternatives_korean:
  - 우리가 이집트에 내려갔을 때
  - 우리가 이집트로 내려왔을 때
  lexicon: κατέρχομαι
  rationale: 동사 κατήλθομεν은 ‘내려가다’의 이동 방향을 살리되, 한국어에서는 목적지 표지 ‘-로’와 과거 종속절 형태가 자연스럽습니다.
- source_word: Αἴγυπτον
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: Αἴγυπτος
  rationale: 본문의 지명은 현대 표준어 표기인 ‘이집트’로 옮기되, 고전/성서적 관습어 ‘애굽’도 가능하지만 여기서는 현대 가독성을 우선했습니다.
- source_word: οὐκ ἐμνησικάκησεν ἡμῖν
  english_pob_choice: did not hold a grudge against us
  chosen_korean: 우리에게 원한을 품지 않았습니다
  alternatives_korean:
  - 우리에게 앙심을 품지 않았습니다
  - 우리에게 악의를 품지 않았습니다
  lexicon: μνησικακέω
  rationale: ἐμνησικάκησεν은 ‘오래 기억하며 앙갚음하려 하다/원한을 품다’의 뜻이므로, 한국어에서는 관계적 의미가 분명한 ‘원한을 품다’로 옮겼습니다.
theological_decisions:
- issue: 형제들에 대한 요셉의 태도 표현
  chosen_reading: 요셉은 우리에게 원한을 품지 않았습니다.
  alternative_readings:
  - 요셉은 우리를 원망하지 않았습니다.
  - 요셉은 우리에게 앙심을 품지 않았습니다.
  rationale: 본문은 단순한 감정 진술이 아니라 해악을 기억하며 보복하려는 태도의 부재를 말하므로, 도덕적·서사적 긴장을 살리는 표현을 택했습니다.
  doctrine_reference: 용서와 화해의 서사
