  to: 그에게 주의를 기울이면서, 너희도, 내 자녀들아, 서로 사랑하십시오. 그리고 각자 자기 형제에게 악의를 품지 마십시오.
  rationale: 미제공 각주 표지를 삭제하고, 호격과 명령의 관계를 현대 합쇼체 문장으로 정돈했습니다. ‘악의’는 κακία의 대인적 적의를, ‘품지 마십시오’는 형제에 대해 악의를 계산하여 간직하지 말라는 λογίζεσθε의 권면을 자연스럽게 반영합니다.
