id: T12P.ZEB.8.5
reference: Testament of Zebulun 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Εἰς¹⁴ ὃν *προσέχοντες καὶ ὑμεῖς, τέκνα μου ἀγαπᾶτε ἀλλήλους¹⁵, καὶ μὴ λογίζεσθε¹⁶ ἕκαστος *κακίαν πρὸς τὸν ἀδελφὸν¹⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/005.yaml
  text: Paying attention to him, you also, my children, love one another, and let each one not reckon evil against his brother.
translation:
  language: ko
  text: 그에게 주의를 기울이면서, 너희도, 내 자녀들아, 서로 사랑하십시오. 그리고 각자 자기 형제에게 악의를 품지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχοντες
  english_pob_choice: Paying attention to him
  chosen_korean: 그에게 주의를 기울이며
  alternatives_korean:
  - 그를 주목하며
  - 그에게 집중하며
  - 그를 살피며
  lexicon: προσέχω
  rationale: 단순한 시선이 아니라 계속해서 마음을 두고 주의하는 뉘앙스를 살려, 한국어에서는 ‘주의를 기울이다’로 옮겼습니다.
- source_word: ἀγαπᾶτε ἀλλήλους
  english_pob_choice: love one another
  chosen_korean: 서로 사랑하고
  alternatives_korean:
  - 서로를 사랑하고
  - 서로 아끼고
  - 서로를 사랑하십시오
  lexicon: ἀγαπάω
  rationale: 상호적 명령을 자연스럽게 드러내기 위해 ‘서로 사랑하고’로 간결하게 옮겼습니다.
- source_word: λογίζεσθε ... κακίαν
  english_pob_choice: let each one not reckon evil
  chosen_korean: 각자가 자기 형제에게 악을 헤아리지 마십시오
  alternatives_korean:
  - 각자 형제에게 악을 계산하지 마십시오
  - 각자 형제에게 악을 따져 묻지 마십시오
  - 각자 형제에게 악을 마음에 두지 마십시오
  lexicon: λογίζομαι
  rationale: λογίζομαι의 ‘계산하다/헤아리다’ 의미를 살려, 악을 상대에게 돌려 계산하거나 기록하지 말라는 뜻을 드러냈습니다.
- source_word: ἀδελφὸν αὐτοῦ
  english_pob_choice: his brother
  chosen_korean: 자기 형제에게
  alternatives_korean:
  - 그의 형제에게
  - 자기 형제에 대하여
  - 자기 동료에게
  lexicon: ἀδελφός
  rationale: 직역을 유지하되 한국어 어순에 맞게 ‘형제에게’로 정리했습니다.
theological_decisions:
- issue: 공동체 윤리 명령의 연결
  chosen_reading: 그에게 주의를 기울이는 것과 서로 사랑하는 것, 그리고 형제에게 악을 헤아리지 않는 것이 한 흐름의 권면으로 보이도록 연결했습니다.
  alternative_readings:
  - 문장을 더 분절해 각각 별개의 명령으로 처리하는 방식
  - ‘악을 기억하지 마십시오’처럼 정서적 표현으로 완화하는 방식
  rationale: 원문의 병렬 명령 구조를 보존해야 권면의 강도가 살아나므로, 연결사를 최소화하고 명령형을 유지했습니다.
  doctrine_reference: 공동체 사랑과 형제 간 비악의 원리
- issue: ‘악을 헤아리다’의 직설성
  chosen_reading: 전통적 관용구인 ‘악을 품다’보다 원문의 계산/평가 이미지를 살린 ‘악을 헤아리다’를 택했습니다.
  alternative_readings:
  - 악을 품지 마십시오
  - 악을 마음에 두지 마십시오
  - 악으로 여기지 마십시오
  rationale: λογίζεσθε의 인지·평가 행위를 드러내어, 단순 감정 억제가 아니라 타인을 악으로 판정해 기록하지 말라는 뜻을 살렸습니다.
  doctrine_reference: 용서와 형제 관계의 판단 중지
