review_pass:
  verdict: revise
  source_fidelity: 그리스어의 핵심 권면(그에게 주의를 기울임, 상호 사랑, 형제를 향한 κακία를 λογίζεσθαι 하지 않음)은 대체로 반영되었습니다. 다만 ‘형제에게 악을 헤아리다’는 πρὸς τὸν ἀδελφὸν의 ‘형제를 향하여/형제에 대하여’ 관계를 한국어에서 다소 부자연스럽게 처리합니다.
  naturalness: 현행 문장은 ‘너희도 내 자녀들아’의 호격 위치와 ‘각자가 자기 형제에게 악을 헤아리지 마십시오’가 현대 표준 한국어로 매끄럽지 않습니다. 호격을 분리하고, ‘악의를 품다’로 자연스러운 윤리적 권면 문체를 사용합니다.
  terminology: ἀγαπᾶτε ἀλλήλους는 ‘서로 사랑하십시오’로, ἀδελφός는 문맥상 ‘형제’로 유지합니다. κακία는 단순한 추상적 ‘악’보다 대인 관계에서의 ‘악의’가 적절합니다. λογίζεσθε의 계산·기록의 비유는 ‘품지 마십시오’가 다소 덜 직접적이나, 한국어에서 타인에 대한 악의를 계속 마음에 두거나 계산하지 말라는 뜻을 자연스럽게 전달합니다.
