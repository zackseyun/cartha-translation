id: T12P.ZEB.8.3
reference: Testament of Zebulun 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. Ὅσον γὰρ⁸ ἄνθρωπος σπλαγχνίζεται εἰς *τὸν πλησίον αὐτοῦ⁹, τοσοῦτον *καὶ ὁ⁴ Κύριος εἰς αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/003.yaml
  text: For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.
translation:
  language: ko
  text: 사람이 자기 이웃을 긍휼히 여기는 만큼, 주님께서도 그를 그만큼 긍휼히 여기십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνίζεται
  english_pob_choice: has compassion
  chosen_korean: 긍휼을 베푸십니다
  alternatives_korean:
  - 불쌍히 여기십니다
  - 측은히 여기십니다
  - 자비를 보이십니다
  lexicon: σπλαγχνίζομαι
  rationale: 문맥의 상호성 구조를 살리면서, 내장된 연민의 강도를 담기 위해 ‘긍휼을 베풀다’로 옮겼습니다.
- source_word: τὸν πλησίον αὐτοῦ
  english_pob_choice: his neighbor
  chosen_korean: 자기 이웃
  alternatives_korean:
  - 그의 이웃
  - 주변 사람
  lexicon: πλησίον
  rationale: 소유대명사 αὐτοῦ를 자연스럽게 풀어 ‘자기 이웃’으로 옮겨, 원문의 관계성을 분명히 했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: κύριος
  rationale: 이 구절의 대조는 일반적 신적 칭호로 읽는 것이 자연스러워 ‘주님’으로 두었습니다. 이 문맥은 구약 인용이 아니라 직접 호칭 구조이므로 ‘야훼’로 바꾸지 않았습니다.
theological_decisions:
- issue: 상호성 표현의 강도
  chosen_reading: 사람의 긍휼 행위와 주님의 응답이 같은 정도로 대응한다는 상호성 구조를 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘그만큼’과 같은 완화된 표현으로 재구성
  - 원문 순서를 더 자유롭게 풀어쓴 의역
  rationale: Ὅσον… τοσοῦτον…의 대응을 한국어에서도 드러내어, 행위와 응답의 비례성을 분명히 했습니다.
  doctrine_reference: 윤리적 보응의 비례성
- issue: 주님의 지칭 방식
  chosen_reading: Κύριος를 ‘주님’으로 번역했습니다.
  alternative_readings:
  - ‘야훼’로 음역
  - ‘주’로만 처리
  rationale: 본문은 직접적인 야훼 인용 표지가 없고, 지혜문학적 일반 진술의 어조이므로 표준적인 신칭호를 유지했습니다.
  doctrine_reference: 신적 칭호 번역 원칙
