  to: 사람이 자기 이웃을 긍휼히 여기는 만큼, 주님께서도 그를 그만큼 긍휼히 여기십니다.
  rationale: 원문의 ὅσον…τοσοῦτον… 상응 구조를 ‘~만큼… 그만큼’으로 보존했습니다. σπλαγχνίζεται는 사람과 주님에게 동일하게 쓰인 연민 동사이므로 양쪽 모두 ‘긍휼히 여기다’로 번역하여 의미와 문체의 대응을 살렸습니다. 근거 내용이 제공되지 않은 [a][b] 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
