  source_fidelity: Ὅσον…τοσοῦτον…의 비례·상응 구조와 σπλαγχνίζεται의 연민 의미는 대체로 반영되었습니다. 그러나 ‘긍휼을 베풀다’는 내적인 동정/연민보다 자비의 행위를 베푼다는 뜻으로 기울 수 있어, 여기의 동사에는 ‘긍휼히 여기다’가 더 직접적입니다. 또한 εἰς αὐτόν은 한국어에서 ‘그를’로 받는 편이 자연스럽습니다.
  naturalness: ‘사람이 자기 이웃에게 긍휼을 베푸는 만큼’도 이해되지만, ‘이웃을 긍휼히 여기는 만큼’이 현대 표준어 문장으로 더 간결하고 원문의 감정 동사에 맞습니다. ‘주님께서도’는 존칭 주어와 합쇼체 문장에 자연스럽습니다.
  terminology: Κύριος를 ‘주님’으로 옮긴 것은 문맥상 적절합니다. πλησίον은 ‘이웃’으로 유지하고, σπλαγχνίζομαι는 행위 중심의 ‘긍휼을 베풀다’ 대신 연민 중심의 ‘긍휼히 여기다’로 통일합니다.
