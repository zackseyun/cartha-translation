  source_fidelity: 현 초안은 5:1의 τὰς ἐντολὰς Κυρίου를 ‘너희 이웃을 지키고’로 옮겨, ‘주의 계명들을 지키고’라는 원문의 직접 목적어를 누락했습니다. 또한 4:11의 ‘자기가 그를 죽이지 못한 것’이라는 뜻을 ‘자기를 죽이지 않았다’로 옮겨 대명사 지시가 뒤바뀌었습니다. χιτών을 현대 한국어의 ‘속옷’으로 번역하면 내의라는 오해를 낳으므로 ‘긴옷’으로 고쳤습니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽지만, 삽입 대시의 ‘모든 사람에게—사람들만이 아니라…’는 논리적으로 어색하며, 모든 각주 표지를 마지막 문장에 한꺼번에 붙인 것은 해당 어휘와의 연결을 흐립니다. 원문상 해당 위치에 각주를 배치하고 문장을 현대적인 격식체로 다듬었습니다.
  terminology: κύριος는 ‘주님’으로, χιτών은 ‘긴옷’으로, ἱμάτιον δουλικόν은 ‘노예의 옷’으로, εὐσπλαγχνία는 ‘긍휼’로 옮겼습니다. σπλάγχνα의 관용적 의미는 ‘마음속’으로 자연스럽게 살렸고, ἀλόγοις ζώοις의 인간-동물 대비는 ‘이성 없는 동물들’로 보존했습니다.
  issues:
  - severity: high
    issue: 5:1의 ‘주의 계명들을 지키고’가 누락됨
    rationale: 그리스어 φυλάσσειν τὰς ἐντολὰς Κυρίου는 ‘주의 계명들을 지키다’입니다. 초안의 ‘너희 이웃을 지키고’는 영어 감사 문구를 따른 듯하나, 원문에 없는 목적어를 도입하고 핵심 명령을 삭제합니다.
