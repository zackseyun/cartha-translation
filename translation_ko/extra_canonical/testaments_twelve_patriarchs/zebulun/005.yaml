  rationale: 원문 우선 원칙에 따라 5:1의 ‘주의 계명들을 지키라’를 복원하고, 시므온에 관한 대명사 지시를 바로잡았습니다. 현대 한국어에서 오해되기 쉬운 ‘속옷’을 ‘긴옷’으로 바꾸었으며, 각주를 해당 본문 어휘에 연결했습니다. 바닷가의 ‘사냥’은 원문의 문자적 표현에 대한 각주를 유지한 제한적 문맥 번역입니다.
