base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005.yaml
  text: 'And they said to Jacob[a], “Recognize, then, whether this is your son’s tunic.” And they did so. For they stripped Joseph of the tunic when they were selling him, and clothed him in a slave’s garment. And Simeon took the tunic and did not want to give it. For he wanted to cut him down with the sword, being angry because he had not killed him. But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.” And so he gave it to them.


    And now, my children, I command you to guard your neighbor and to have compassion toward all, not only among people, but also toward unreasoning animals. For because of these things the Lord blessed me, and when all my brothers were sick, I passed through without illness. For the Lord knows each person’s purpose. Have mercy, therefore, in your hearts[b], because whatever a person does to his neighbor, so the Lord also will do with him. For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their hearts; but my sons were kept free from sickness, as you know.


    And when I was in the land of Canaan, by the seashore, I used to catch fish[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].'
  footnotes:
  - marker: a
    text: Or 'coat' or 'robe' for χιτών; 'tunic' is chosen for greater specificity.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'mercy in your inward parts' reflects the Greek idiom with σπλάγχνα, the inner organs as the seat of compassion.
    reason: cultural_note
  - marker: c
    text: The Greek literally says 'I hunted prey,' but the seashore setting suggests fishing or catching sea-creatures for his father.
    reason: lexical_alternative
  - marker: d
    text: The final sentence appears to continue beyond the surviving excerpt provided here; the translation ends with the extant Greek in the source segment.
    reason: textual_variant
translation:
  language: ko
  text: '그리고 그들은 야곱에게 말했습니다. “이것이 당신 아들의 긴옷[a]인지 알아보십시오.” 그들은 그렇게 했습니다. 그들이 요셉을 팔 때에 그의 긴옷을 벗기고 그에게 노예의 옷을 입혔기 때문입니다. 시므온은 그 긴옷을 가져가 내주려 하지 않았습니다. 자기가 그를 죽이지 못한 것에 화가 나서, 칼로 그를 베어 죽이려고 했기 때문입니다. 그러나 우리 모두가 일어나 그에게 말했습니다. “당신이 그 긴옷을 내주지 않으면, 우리가 우리 아버지께 당신만이 이스라엘에서 이 악한 일을 했다고 말하겠습니다.” 그러자 그는 그것을 그들에게 내주었습니다.


    이제, 나의 자녀들아, 나는 너희에게 명령합니다. 주의 계명들을 지키고, 이웃에게 자비를 베풀며, 모든 이에게 긍휼을 품으십시오. 사람에게만 그렇게 하지 말고 이성 없는 동물들에게도 그렇게 하십시오. 이런 일들 때문에 주께서 나를 복 주셨고, 내 형제들이 모두 병들었을 때에도 나는 병 없이 지냈습니다. 주님께서는 각 사람의 뜻을 아십니다. 그러므로 마음속에 자비[b]를 품으십시오. 사람이 자기 이웃에게 무엇을 하든지, 주께서도 그에게 그대로 하실 것이기 때문입니다. 내 형제들의 아들들은 요셉 때문에 병들어 죽어 갔습니다. 그들의 마음속에 자비가 없었기 때문입니다. 그러나 내 아들들은 너희가 아는 바와 같이 병에 걸리지 않도록 보전되었습니다.


    내가 가나안 땅 바닷가에 있을 때, 나는 아버지 야곱을 위해 물고기를 잡곤 했습니다[c]. 바다에서 많은 이들이 질식해 가고 있을 때에도 나는 해를 입지 않고 지나왔습니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 χιτών은 몸에 입는 기본 의복을 가리킵니다. ‘긴옷’으로 옮겼으며, ‘겉옷’ 또는 ‘로브’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 그리스어 σπλάγχνα는 문자적으로 내장을 뜻하지만, 관용적으로는 깊은 감정과 긍휼의 자리를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 그리스어는 문자적으로 ‘사냥감을 사냥하곤 했다’라고 말합니다. 바닷가와 바다라는 문맥에 따라 물고기나 바다 생물을 잡았다는 뜻으로 옮겼습니다.
    reason: lexical_alternative
  - marker: d
    text: 제공된 그리스어 본문 발췌는 이 문장으로 끝납니다.
    reason: textual_variant
lexical_decisions:
- source_word: χιτών
  english_pob_choice: tunic
  chosen_korean: 속옷
  alternatives_korean:
  - 긴옷
  - 겉옷
  - 튜닉
  lexicon: LSJ
  rationale: χιτών은 몸에 직접 입는 기본 의복이어서 한국어로는 ‘속옷’이 가장 구체적이지만, 현대 독자에게는 오해 가능성이 있어 문맥상 기본 내의/속옷의 의미로 옮겼습니다.
- source_word: ἱμάτιον δουλικόν
  english_pob_choice: slave’s garment
  chosen_korean: 노예의 옷
  alternatives_korean:
  - 종의 옷
  - 노예복
  - 종복
  lexicon: LSJ
  rationale: δουλικόν은 예속된 신분을 드러내므로, POB의 선택을 따라 ‘노예’로 옮겨 묶인 신분을 분명히 했습니다.
- source_word: ἀλόγοις ζώοις
  english_pob_choice: unreasoning animals
  chosen_korean: 이성 없는 동물들
  alternatives_korean:
  - 이성 없는 짐승들
  - 이성 없는 피조물들
  - 짐승들
  lexicon: LSJ
  rationale: 문맥이 인간을 넘어 동물까지 긍휼의 범위를 넓히므로, 비이성적 존재라는 대비를 살려 직역했습니다.
- source_word: ἐν σπλάγχνοις
  english_pob_choice: mercy in your hearts
  chosen_korean: 마음에 자비
  alternatives_korean:
  - 속사람에 자비
  - 심장 깊은 곳에 자비
  - 내장에 자비
  lexicon: LSJ
  rationale: σπλάγχνα는 문자적으로 내장이나 깊은 정서를 가리키지만, 한국어에서는 ‘마음’이 자연스럽고 본문의 윤리적 촉구를 잘 전달합니다.
- source_word: ἐθήρευον θήραν
  english_pob_choice: I used to catch fish
  chosen_korean: 물고기를 잡곤 했습니다
  alternatives_korean:
  - 사냥감을 잡곤 했습니다
  - 고기를 잡곤 했습니다
  - 어획을 하곤 했습니다
  lexicon: LSJ
  rationale: 직역하면 ‘사냥하다/사냥감’이지만 바닷가와 바다의 문맥이어서 어로 행위로 이해하는 POB의 판단을 따랐습니다.
theological_decisions:
- issue: σπλάγχνα의 정서적-윤리적 이미지
  chosen_reading: ‘마음에 자비’로 자연스럽게 옮기되, 반복되는 내적 자비의 요구를 유지했습니다.
  alternative_readings:
  - ‘속사람에 자비’
  - ‘내장에 자비’
  rationale: 현대 한국어에서는 내장 이미지가 지나치게 생경하므로, 본문의 의도인 깊은 연민과 행위 윤리를 살리는 표현을 택했습니다.
  doctrine_reference: Preserve theological tension rather than flatten idiom
- issue: ‘이성 없는 동물들’까지 포함하는 윤리 범위
  chosen_reading: 인간뿐 아니라 동물까지 긍휼의 대상에 포함했습니다.
  alternative_readings:
  - 동물들도 돌보라
  - 짐승들에게도 자비를 베풀라
  rationale: 본문은 자비의 범위를 의도적으로 넓히므로, 그 확장을 축소하지 않고 드러냈습니다.
  doctrine_reference: Original-language primacy over translation tradition
