    rationale: 각주 a–d는 각각 긴옷, σπλάγχνα, 낚시라는 해석, 제공된 발췌의 끝에 관한 주석이므로 해당 본문 위치에 붙여야 독자가 지시 대상을 알 수 있습니다.
  revised_text: '그리고 그들은 야곱에게 말했습니다. “이것이 당신 아들의 긴옷[a]인지 알아보십시오.” 그들은 그렇게 했습니다. 그들이 요셉을 팔 때에 그의 긴옷을 벗기고 그에게 노예의 옷을 입혔기 때문입니다. 시므온은 그 긴옷을 가져가 내주려 하지 않았습니다. 자기가 그를 죽이지 못한 것에 화가 나서, 칼로 그를 베어 죽이려고 했기 때문입니다. 그러나 우리 모두가 일어나 그에게 말했습니다. “당신이 그 긴옷을 내주지 않으면, 우리가 우리 아버지께 당신만이 이스라엘에서 이 악한 일을 했다고 말하겠습니다.” 그러자 그는 그것을 그들에게 내주었습니다.


    이제, 나의 자녀들아, 나는 너희에게 명령합니다. 주의 계명들을 지키고, 이웃에게 자비를 베풀며, 모든 이에게 긍휼을 품으십시오. 사람에게만 그렇게 하지 말고 이성 없는 동물들에게도 그렇게 하십시오. 이런 일들 때문에 주께서 나를 복 주셨고, 내 형제들이 모두 병들었을 때에도 나는 병 없이 지냈습니다. 주님께서는 각 사람의 뜻을 아십니다. 그러므로 마음속에 자비[b]를 품으십시오. 사람이 자기 이웃에게 무엇을 하든지, 주께서도 그에게 그대로 하실 것이기 때문입니다. 내 형제들의 아들들은 요셉 때문에 병들어 죽어 갔습니다. 그들의 마음속에 자비가 없었기 때문입니다. 그러나 내 아들들은 너희가 아는 바와 같이 병에 걸리지 않도록 보전되었습니다.


    내가 가나안 땅 바닷가에 있을 때, 나는 아버지 야곱을 위해 물고기를 잡곤 했습니다[c]. 바다에서 많은 이들이 질식해 가고 있을 때에도 나는 해를 입지 않고 지나왔습니다.[d]'
