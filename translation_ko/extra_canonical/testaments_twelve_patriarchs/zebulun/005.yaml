    rationale: ὀργιζόμενος ὅτι οὐκ ἀνεῖλεν αὐτόν은 시므온이 요셉을 죽이지 못한 것에 화가 난다는 뜻입니다. ‘자기를 죽이지 않았다’는 뜻은 원문과 다릅니다.
  - severity: medium
    issue: χιτών을 ‘속옷’으로 번역함
    rationale: χιτών은 몸에 입는 기본 의복(튜닉)이나, 현대 한국어 ‘속옷’은 내의·속내의를 주로 뜻하여 부정확한 연상을 유발합니다. ‘긴옷’이 문맥과 한국어 관습에 더 적합합니다.
  - severity: medium
