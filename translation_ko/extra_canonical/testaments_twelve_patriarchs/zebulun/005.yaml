- from: '그리고 그들은 야곱에게 말했습니다. 「알아보십시오. 이것이 당신의 아들의 속옷입니까?」 그리고 그들은 그렇게 했습니다. 요셉의 속옷을 그를 팔 때 벗겼고, 그에게 노예의 옷을 입혔기 때문입니다. 시므온은 그 속옷을 가져가서 내주려 하지 않았습니다. 그는 칼로 그를 쳐 죽이고 싶어 했고, 자기를 죽이지 않았다는 이유로 화가 났기 때문입니다. 그러나 우리 모두가 일어나 그에게 말했습니다. 「만일 당신이 그 속옷을 내주지 않으면, 우리가 우리 아버지에게 당신만이 이스라엘에서 이 악한 일을 했다고 말하겠습니다.」 그래서 그는 그것을 그들에게 내주었습니다.


    이제, 내 자녀들아, 내가 너희에게 명령합니다. 너희 이웃을 지키고 모든 사람에게 — 사람들만이 아니라 이성 없는 동물들에게도 — 동정을 품으십시오. 이런 일들 때문에 주께서 나를 복 주셨고, 내 모든 형제들이 병들었을 때 나는 병 없이 지나갈 수 있었습니다. 주님은 각 사람의 목적을 아십니다. 그러므로 너희 마음에 자비를 가지십시오. 사람이 자기 이웃에게 무엇을 하든지 주께서도 그에게 그렇게 하실 것이기 때문입니다. 내 형제들의 아들들은 요셉 때문에 병들어 죽어 갔습니다. 그들이 자기 마음에 자비를 보이지 않았기 때문입니다. 그러나 내 아들들은 너희가 아는 바와 같이 병에서 지켜졌습니다.


    그리고 내가 가나안 땅에서 바닷가에 있을 때, 나는 내 아버지 야곱을 위해 물고기를 잡곤 했습니다. 그리고 바다에서 많은 이들이 질식해 가고 있을 때 나는 해를 입지 않고 지나왔습니다.[a][b][c][d]'
