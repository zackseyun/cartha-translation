base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002.yaml
  text: '1 Sons of Zebulun[a], pay attention to the words of your father.

    2 I, Zebulun, became a good gift to my parents; for when I was born, my father prospered greatly, and the sheep and the cattle also, when with the variegated rods he had his share.

    3 And I do not know that I sinned in my days, except in intention.

    4 I do not remember that I committed lawlessness, except for the ignorance that I showed concerning Joseph, in that I gave my brothers my word not to tell my father what had happened.

    5 But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.

    6 Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin[b].

    7 For Simeon and Dan and Gad came against Joseph to kill him, and he said to them with tears,

    8 “Have mercy on me, my brothers; pity the inward compassion of Jacob our father. Do not lay your hands on me to shed innocent blood, for I have not sinned against you.

    9 But even if I have sinned, discipline me with correction, my brothers; yet do not bring your hand to the murder of your brother, for the sake of Jacob your father.”

    10 And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.

    11 And I wept together with Joseph, and my heart thundered, and the joints of my body trembled[c][d], and I had no strength.'
  footnotes:
  - marker: a
    text: The mention of the variegated rods alludes to Jacob's breeding of the flocks in Genesis 30.
    reason: cross_reference
    anchor_ref: '2:2'
  - marker: b
    text: The Greek phrase rendered 'except in intention' is difficult and may point to inward thought rather than outward deed.
    reason: lexical_alternative
    anchor_ref: '2:3'
  - marker: d
    text: Literally, 'pity the inward parts of Jacob our father'—an ancient bodily expression for deep compassion.
    reason: cultural_note
    anchor_ref: '2:8'
  - marker: c
    text: Literally, 'my liver was poured out,' a vivid ancient expression of intense grief.
    reason: cultural_note
    anchor_ref: '2:10'
translation:
  language: ko
  text: '1 너희 스불론의 아들들아, 아버지의 말을 주의해서 들으십시오.

    2 나 스불론은 부모에게 좋은 선물이 되었습니다. 내가 태어날 때 내 아버지는 크게 번성했고, 얼룩진 막대들을 사용하여 몫을 가졌을 때에는 양과 소도 많아졌습니다.

    3 나는 내 생애 동안, 의도로 한 것이 아니고서는 죄를 지었다고 알지 못합니다.

    4 나는 불법을 행한 일을 기억하지 못합니다. 다만 요셉에 관하여 내가 무지하여, 일어난 일을 아버지에게 말하지 않겠다고 형제들에게 내 말을 굳게 약속한 것뿐입니다.

    5 그러나 나는 요셉 때문에 여러 날 동안 몰래 울었습니다. 형제들이 모두 비밀을 누설하는 사람은 누구든 죽이기로 합의했기 때문에 나는 형제들이 두려웠습니다.

    6 그러나 그들이 그를 죽이려 할 때, 나는 그들이 이 죄를 짓지 말라고 눈물로 간청했습니다.

    7 시므온과 단과 갓이 요셉을 죽이러 왔고, 그는 눈물로 그들에게 말했습니다.

    8 "나에게 자비를 베풀어 주십시오, 내 형제들이여. 우리 아버지 야곱의 깊은 긍휼을 불쌍히 여기십시오. 무죄한 피를 흘리려고 내게 손을 대지 마십시오. 나는 너희에게 죄를 짓지 않았습니다.

    9 그러나 설령 내가 죄를 지었더라도, 내 형제들이여, 훈계로 나를 징계하십시오. 그러나 너희 손을 형제의 살해에 들지 마십시오. 너희 아버지 야곱을 위하여서입니다."

    10 그가 이 말을 슬픔 가운데 하고 있을 때, 나는 그의 울부짖음을 견딜 수 없어서 울기 시작했으며, 내 간이 쏟아져 나왔고, 내 내장의 실체가 모두 기운을 잃었습니다.

    11 나는 요셉과 함께 울었고, 내 마음은 천둥처럼 울렸으며, 내 몸의 관절들이 떨렸고, 나는 힘이 없었습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ Ζαβουλών
  english_pob_choice: Sons of Zebulun
  chosen_korean: 너희 스불론의 아들들아
  alternatives_korean:
  - 스불론의 아들들아
  - 스불론 자손들아
  lexicon: 고유명사 일반 표기 / 호칭형 문맥
  rationale: 직접 호칭의 복수 부름을 살리면서, 현대 한국어에서 자연스러운 2인칭 청유적 호명으로 옮겼습니다.
- source_word: προσέχετε
  english_pob_choice: pay attention
  chosen_korean: 주의해서 들으십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 들으십시오
  lexicon: BDAG
  rationale: 단순 청취보다 경계와 집중을 함께 담는 권면으로 읽히므로, 합쇼체 권고형으로 자연스럽게 옮겼습니다.
- source_word: δόσις ἀγαθή
  english_pob_choice: a good gift
  chosen_korean: 좋은 선물
  alternatives_korean:
  - 좋은 gift
  - 좋은 증여
  lexicon: LSJ
  rationale: 부모에게 유익이 된 자기 존재를 ‘선물’로 드러내는 구체성을 살렸습니다.
- source_word: ποικίλαις ῥάβδοις
  english_pob_choice: variegated rods
  chosen_korean: 얼룩진 막대들
  alternatives_korean:
  - 무늬 있는 막대들
  - 줄무늬 막대들
  lexicon: LSJ
  rationale: 창세기 30장의 가축 번식 장면을 떠올리게 하는 외형적 특징을 유지했습니다.
- source_word: παρεκτὸς ἐννοίας
  english_pob_choice: except in intention
  chosen_korean: 의도로 한 것이 아니고서는
  alternatives_korean:
  - 생각으로 한 것 외에는
  - 뜻으로 한 것 외에는
  lexicon: LSJ
  rationale: 문구의 난해함을 무리하게 매끈하게 만들지 않고, 내면 의도 차원의 예외라는 긴장을 유지했습니다.
- source_word: παρανομίαν
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 불의
  - 죄악
  lexicon: BDAG
  rationale: 도덕적 위반이면서 법-질서의 일탈이라는 강한 어감을 간결하게 살렸습니다.
- source_word: ἐβεβαίωσα
  english_pob_choice: gave my brothers my word
  chosen_korean: 내 말을 굳게 약속한
  alternatives_korean:
  - 형제들에게 내 말을 확증한
  - 형제들에게 내 뜻을 분명히 한
  lexicon: BDAG
  rationale: 형제들과의 침묵 합의에 동참한 의미를, 단순 정보 전달이 아니라 구속력 있는 약속으로 표현했습니다.
- source_word: σπλάγχνα Ἰακὼβ
  english_pob_choice: the inward compassion of Jacob our father
  chosen_korean: 우리 아버지 야곱의 깊은 긍휼
  alternatives_korean:
  - 야곱의 내장
  - 야곱의 속마음
  lexicon: LSJ
  rationale: 직역하면 낯설지만, 본문이 가리키는 몸의 언어를 한국어에서 통용되는 ‘깊은 긍휼’로 풀어 과도한 기괴함을 피했습니다.
- source_word: ἀναιρεθῆναι
  english_pob_choice: should be put to death
  chosen_korean: 죽이기로
  alternatives_korean:
  - 처형하기로
  - 살해하기로
  lexicon: BDAG
  rationale: 계획된 살해 의도를 분명히 드러내되, 서술의 흐름에 맞게 간결하게 옮겼습니다.
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  english_pob_choice: my liver was poured out
  chosen_korean: 내 간이 쏟아져 나왔고
  alternatives_korean:
  - 내 간이 흘러나왔고
  - 내 간이 퍼져 나왔고
  lexicon: LSJ
  rationale: 고대의 신체-정서 표현을 그대로 드러내어, 강렬한 비탄의 이미지를 보존했습니다.
theological_decisions:
- issue: 죄와 무죄에 대한 요셉 전승 속 자가평가의 긴장
  chosen_reading: ‘의도로 한 것이 아니고서는 죄를 지었다고 알지 못합니다’와 ‘요셉에 관하여 무지했다’는 진술을 함께 살려, 단순한 자기변호로 평탄화하지 않았습니다.
  alternative_readings:
  - ‘죄를 짓지 않았다’로 완전히 무죄 주장처럼 정리하기
  - ‘의도’ 구절을 생략하고 문장을 단순화하기
  rationale: 본문은 외적 행위와 내적 의도의 긴장을 함께 말하므로, 그 복합성을 한국어에서도 보존하는 것이 source-direct합니다.
  doctrine_reference: DOCTRINE.md § Preserve theological tension rather than resolve it
- issue: 몸의 언어로 표현된 슬픔과 긍휼
  chosen_reading: ‘깊은 긍휼’, ‘간이 쏟아져 나왔고’, ‘내장의 실체가 모두 기운을 잃었습니다’를 유지해 육체적 비탄의 수사를 살렸습니다.
  alternative_readings:
  - ‘마음이 아팠습니다’처럼 심리어로 완화하기
  - ‘그가 매우 슬퍼했습니다’로 일반화하기
  rationale: 본문의 설교적·유언적 수사는 추상적 감정보다 신체어를 통해 강하게 작동하므로, 이를 약화시키지 않았습니다.
  doctrine_reference: PHILOSOPHY.md § original-language primacy; transparency in lexical decisions
