    2 나 스불론은 내 부모에게 좋은 선물이 되었습니다. 내가 태어났을 때에 내 아버지는 크게 번성하였고, 양 떼와 소 떼도 많아졌습니다. 그가 얼룩무늬 막대들과 관련하여 자기 몫을 얻었을 때였습니다.[a]


    3 나는 내 생애 동안 생각으로 지은 죄 외에는 내가 죄를 지었다고 알지 못합니다.[b]


    4 나는 율법을 어긴 일을 저질렀다고 기억하지 못합니다. 다만 요셉에 관하여 내가 저지른 무지의 잘못이 있습니다. 곧 일어난 일을 내 아버지께 말하지 않겠다고 형제들에게 굳게 약속한 것입니다.


    5 그러나 나는 요셉 때문에 여러 날 동안 몰래 울었습니다. 형제들이 모두 비밀을 누설하는 사람은 누구든 죽임을 당하게 하기로 합의하였으므로, 나는 형제들이 두려웠습니다.


    6 그러나 그들이 그를 죽이려 할 때, 나는 눈물로 그들에게 이 죄를 짓지 말라고 간청했습니다.


    7 시므온과 단과 갓이 요셉을 죽이려고 그에게 왔고, 요셉은 눈물로 그들에게 말했습니다.


    8 “내 형제들이여, 나에게 자비를 베풀어 주십시오. 우리 아버지 야곱의 속마음을 가엾게 여겨 주십시오.[c] 무죄한 피를 흘리려고 나에게 손을 대지 마십시오. 나는 죄를 짓지 않았는데도 너희 손에 떨어졌습니다.


    9 설령 내가 죄를 지었더라도, 내 형제들이여, 훈계하여 나를 징계하십시오. 그러나 너희 아버지 야곱을 생각해서, 너희 손을 너희 형제를 죽이는 일에 쓰지 마십시오.”


    10 그가 슬퍼하며 이 말을 할 때, 나는 그의 울부짖음을 견딜 수 없어 울기 시작했습니다. 내 간이 쏟아져 나왔고,[d] 내 내장의 모든 기력이 쇠해졌습니다.


    11 나는 요셉과 함께 울었고, 내 마음은 우레처럼 울렸으며, 내 몸의 관절들이 떨렸고, 나는 서 있을 수 없었습니다.'
