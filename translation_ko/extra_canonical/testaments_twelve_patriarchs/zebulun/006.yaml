translation:
  language: ko
  text: 그러므로 나는 먼저 바다에서 항해할 배를 만들었습니다. 이는 주께서 그 배에 관하여 내게 이해와 지혜[b]를 주셨기 때문입니다. 나는 그 배의 뒤쪽에 나무 한 조각을 고정하였으며,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기 उपलब्ध한 그리스어 본문은 단편적이며, “나는 그 배의 뒤쪽에 나무 한 조각을 고정하였으며, 그리고”에서 문장이 중단됩니다.
    reason: textual_variant
  - marker: b
    text: 여기서 ‘지혜’는 추상적인 지혜만 아니라 건축에 필요한 실용적인 기술을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκάφος
  english_pob_choice: boat
  chosen_korean: 배
  alternatives_korean:
  - 배 한 척
  - 선박
  - 보트
  lexicon: LSJ
  rationale: 소형 선박까지 포괄하는 자연스러운 현대 한국어로 옮기되, 원문의 일반적 선박 의미를 지나치게 특정하지 않기 위해 ‘배’를 택했습니다.
- source_word: ἐπιπλέειν
  english_pob_choice: to sail
  chosen_korean: 항해할
  alternatives_korean:
  - 떠다니는
  - 운항할
  lexicon: LSJ
  rationale: 문맥상 단순 부유가 아니라 바다 위에서의 목적 있는 운행이므로, 한국어에서는 ‘항해할’이 가장 자연스럽고 원뜻에 가깝습니다.
- source_word: σύνεσιν καὶ σοφίαν
  english_pob_choice: understanding and wisdom
  chosen_korean: 이해와 지혜
  alternatives_korean:
  - 분별과 지혜
  - 깨달음과 지혜
  - 이해력과 지혜
  lexicon: BDAG
  rationale: ‘σύνεσις’는 단순 지식보다 이해·분별의 능력을 가리키고, ‘σοφία’는 여기서도 지혜를 유지하는 것이 원문의 신학적 울림을 살립니다.
- source_word: ἐν αὐτῷ
  english_pob_choice: in it
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그것 안에서
  - 이 일에서
  - 이것 안에서
  lexicon: BDAG
  rationale: 영문 본문이 해석적 확장을 피하고 ‘in it’을 유지하므로, 한국어도 배 자체를 가리키는 ‘그 안에서’로 좁혀 옮겼습니다.
- source_word: καθῆκα ξύλον ὄπισθεν αὐτοῦ
  english_pob_choice: I fastened a piece of wood behind it
  chosen_korean: 나는 그 뒤에 나무 한 조각을 고정하였으며
  alternatives_korean:
  - 나는 그 뒤에 나무를 붙였으며
  - 나는 그 뒤에 목재 한 조각을 달았으며
  lexicon: LSJ
  rationale: ‘καθῆκα’의 부착·고정 의미를 살리고, ‘ξύλον’은 정확한 선박 부품이 불분명하므로 과도한 구체화 없이 ‘나무 한 조각’으로 보존했습니다.
theological_decisions:
- issue: 주께서 주시는 지혜의 성격
  chosen_reading: 주께서 단지 추상적 지혜만이 아니라 배를 만드는 데 필요한 이해와 지혜를 주신 것으로 읽었습니다.
  alternative_readings:
  - 실용적 기술이나 공예적 숙련만을 가리킨다고 볼 수 있습니다.
  - 지혜를 일반적인 신적 은사로 더 넓게 이해할 수 있습니다.
  rationale: ‘σύνεσις’와 ‘σοφία’의 병렬은 기술적 숙련과 더 넓은 지혜를 함께 열어 두므로, 어느 한쪽으로 축소하지 않고 둘 다 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; preserve theological tension rather than resolve it'
