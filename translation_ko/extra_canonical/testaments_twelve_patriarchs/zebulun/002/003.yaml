  verdict: revise
  source_fidelity: 그리스어의 παρεκτὸς ἐννοίας는 문맥상 ‘의도적으로’라기보다 ‘생각/마음속에서’라는 제한을 나타냅니다. 현 번역의 ‘의도 안에서만 그랬습니다’는 의도적 행위라는 뜻으로 기울고, ‘그랬습니다’의 지시 대상도 불명확합니다. 이를 ‘생각으로 지은 죄 외에는’으로 옮겨 원문의 제한과 다소 압축적인 진술을 보존했습니다.
  naturalness: ‘내 날들에’와 ‘의도 안에서만 그랬습니다’는 현대 표준 한국어로 다소 부자연스럽습니다. ‘내 생애 동안’ 및 ‘생각으로 지은 죄 외에는’이 합쇼체 서술로 자연스럽고 의미도 명료합니다.
  terminology: ἁμαρτάνω는 ‘죄를 짓다’로 유지했습니다. ἐννοία는 여기서 ‘의도’보다 ‘생각’으로 옮기는 것이 어휘적으로 더 적절합니다. 이 표현이 생각 속의 죄, 곧 내면의 죄를 뜻하는지에 관한 해석적 여지는 주석에서 제한적으로 밝혔습니다.
  issues:
