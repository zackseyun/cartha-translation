  text: And I did not know that I had sinned in my days, except in intention.
translation:
  language: ko
  text: 그러나 나는 내 날들에 죄를 지었다는 것을 알지 못했습니다. 다만 의도 안에서만 그랬습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔγνων
  english_pob_choice: I did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알지 못하였습니다
  - 몰랐습니다
  lexicon: γινώσκω
  rationale: 과거 서술에 맞춰 ‘알지 못했습니다’로 자연스럽게 옮겨, 단순 사실 부정보다 인식 부재를 분명히 했습니다.
- source_word: ἥμαρτον
  english_pob_choice: I had sinned
  chosen_korean: 죄를 지었다는
  alternatives_korean:
  - 죄를 범했다는
  - 범죄했다는
  lexicon: ἁμαρτάνω
  rationale: 종교적 한국어에서 굳어진 ‘죄를 짓다’를 사용하되, 종속절로 풀어 원문의 완료된 과거적 뉘앙스를 살렸습니다.
- source_word: ἐν ταῖς ἡμέραις μου
  english_pob_choice: in my days
  chosen_korean: 내 날들에
  alternatives_korean:
  - 내 생애 동안
  - 내 생애에
  lexicon: ἡμέραι
  rationale: 직역에 가깝게 ‘내 날들에’로 두어 삶의 기간 전체를 가리키는 표현의 범위를 유지했습니다.
- source_word: παρεκτὸς ἐννοίας
  english_pob_choice: except in intention
  chosen_korean: 다만 의도 안에서만
  alternatives_korean:
  - 의도 외에는
  - 오직 의도 안에서만
  lexicon: ἐννοία
  rationale: ‘ἐννοία’를 단순한 마음가짐보다 ‘의도’로 옮겨, 죄책의 범위를 의도성에 한정하는 뜻을 분명히 했습니다.
theological_decisions:
- issue: 죄의 자각과 의도성의 범위
  chosen_reading: 화자는 실제 행위의 죄를 알지 못했다고 말하면서도, 그 죄가 ‘의도’ 차원에서는 있었다고 고백합니다.
  alternative_readings:
  - 단순히 ‘잘못한 적이 없다’는 무죄 주장
  - ‘생각만 있었을 뿐 행위는 없었다’는 해석
  rationale: 본문은 무죄 선언이 아니라 죄 인식의 결핍과 의도 차원의 책임을 함께 말하므로, 그 긴장을 보존했습니다.
  doctrine_reference: 양심, 죄책, 의도와 행위의 구분
