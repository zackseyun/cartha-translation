    issue: ‘다만 의도 안에서만 그랬습니다’가 παρεκτὸς ἐννοίας를 ‘의도적으로 행했다’는 뜻으로 해석하고, 지시어 ‘그랬습니다’도 모호하게 만듭니다.
    rationale: 원문은 ‘생각/마음’이라는 명사를 예외 항목으로 제시합니다. 한국어에서는 ‘생각으로 지은 죄 외에는’이 그 제한을 더 충실하고 자연스럽게 전달합니다.
