  text: And I wept together with Joseph, and my heart thundered, and the joints of my body trembled, and I had no strength.
translation:
  language: ko
  text: 그리고 저는 요셉과 함께 울었고, 제 마음은 우레처럼 울렸으며, 제 몸의 관절들은 떨렸고, 저는 설 힘이 없었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον δὲ σὺν τῷ Ἰωσὴφ
  english_pob_choice: I wept together with Joseph
  chosen_korean: 저는 요셉과 함께 울었고
  alternatives_korean:
  - 요셉과 함께 울었습니다
  - 그리고 요셉과 함께 울었습니다
  lexicon: ἔκλαιον / σὺν
  rationale: 동사 ἔκλαιον의 지속적 과거를 자연스럽게 풀어 ‘울었고’로 잇고, σὺν τῷ Ἰωσὴφ은 관계를 분명히 드러내는 ‘요셉과 함께’로 옮겼습니다.
- source_word: ἐβόμβει ἡ καρδία μου
  english_pob_choice: my heart thundered
  chosen_korean: 제 마음은 우레처럼 울렸으며
  alternatives_korean:
  - 제 마음은 천둥쳤으며
  - 제 심장은 울부짖었으며
  lexicon: ἐβόμβει / καρδία
  rationale: ἐβόμβει의 강한 울림을 직역하면 다소 어색하므로, 심장/마음의 격동을 살려 ‘우레처럼 울리다’로 옮겼습니다.
- source_word: οἱ ἁρμοὶ τοῦ σώματός μου ἔτρεμον
  english_pob_choice: the joints of my body trembled
  chosen_korean: 제 몸의 관절들은 떨렸고
  alternatives_korean:
  - 제 몸의 마디들은 떨렸고
  - 제 몸의 관절들이 떨렸고
  lexicon: ἁρμοί / ἔτρεμον
  rationale: ἁρμοί는 인체의 ‘관절/마디’를 뜻하므로 현대 독자가 이해하기 쉬운 ‘관절들’로 풀었습니다.
- source_word: καὶ οὐκ ἠδυνάμην στῆναι
  english_pob_choice: and I had no strength
  chosen_korean: 저는 설 힘이 없었습니다
  alternatives_korean:
  - 저는 일어설 수 없었습니다
  - 저는 버틸 힘이 없었습니다
  lexicon: οὐκ ἠδυνάμην στῆναι
  rationale: 직역하면 ‘서지 못했다’이지만, POB의 의미상 무력함을 살려 ‘설 힘이 없었습니다’로 자연화했습니다.
theological_decisions:
- issue: 원문이 감정·육체 반응을 병렬로 쌓는 수사
  chosen_reading: ‘울었고… 울렸으며… 떨렸고… 없었습니다’처럼 병렬 구조를 유지해 감정과 신체 반응의 누적을 살렸습니다.
  alternative_readings:
  - 문장을 더 매끈하게 하나로 합치기
  - 감정 표현을 약화해 서술적으로 정리하기
  rationale: 이 구절은 심리적·신체적 동요의 중첩이 핵심이므로, 매끄러움보다 원문의 강도를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 문학적-수사적 충실성
- issue: ‘καρδία’의 한국어 대응
  chosen_reading: ‘마음’으로 옮기되, ‘우레처럼 울렸으며’라는 표현으로 내면의 격렬함을 전달했습니다.
  alternative_readings:
  - ‘심장’으로 직역하기
  - ‘가슴’으로 의역하기
  rationale: 고대어 καρδία는 신체 기관보다 내면 전체를 가리키는 경우가 많아, 한국어 성경 관용을 고려하되 의미를 약화하지 않도록 했습니다.
  doctrine_reference: 인간 내면의 언어
