  - severity: medium
    issue: ‘설 힘이 없었습니다’가 στῆναι의 구체적 의미를 약화합니다.
    rationale: 원문은 힘의 결핍을 명시하기보다 ‘설 수 없었다’고 말합니다. ‘서 있을 수 없었습니다’가 더 직접적입니다.
