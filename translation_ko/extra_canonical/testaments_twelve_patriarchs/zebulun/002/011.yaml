  naturalness: 초안은 앞부분의 연결형 과거 표현(‘울었고’ 등)과 종결형 합쇼체(‘없었습니다’)가 섞여 있어, 지정된 현대 격식체로 통일하는 편이 자연스럽습니다. ‘몸의 관절’은 자연스럽고 정확합니다.
  terminology: ‘요셉’, ‘마음’, ‘관절’은 적절합니다. καρδία를 여기서 ‘마음’으로 옮기는 것은 가능하며, ‘우레처럼 울리다’가 원문의 격렬한 비유를 보존합니다.
