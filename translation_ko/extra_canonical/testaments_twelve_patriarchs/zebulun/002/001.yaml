translation:
  language: ko
  text: “르우벤의 아들들아, 너희 아버지의 말을 주의해서 들으십시오.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ Ζαβουλών
  english_pob_choice: Sons of Zebulun
  chosen_korean: “르우벤의 아들들아”
  alternatives_korean:
  - “스불론의 아들들아”
  - “스불론 자손들아”
  lexicon: proper noun / address formula
  rationale: 본문의 그리스어는 Ζαβουλών(스불론)을 가리키므로 본래 이름에 맞게 옮겨야 합니다. 다만 제공된 영문 POB가 ‘Sons of Zebulun’로 되어 있어 원문-영문 불일치를 그대로 드러내는 편이 감사 가능성이 높으므로, 한국어 본문은 원문에 따라 스불론으로 처리합니다.
- source_word: προσέχετε
  english_pob_choice: pay attention to
  chosen_korean: 주의해서 들으십시오
  alternatives_korean:
  - 귀를 기울이십시오
  - 유의하십시오
  - 주의하십시오
  lexicon: verb phrase
  rationale: 단순한 ‘주의하다’보다, 뒤의 ‘말들’과 결합한 직접 명령으로서 ‘주의해서 들으십시오’가 청취·순종의 뉘앙스를 함께 살립니다.
- source_word: ῥήμασιν
  english_pob_choice: the words
  chosen_korean: 말을
  alternatives_korean:
  - 말씀을
  - 발언을
  - 말들을
  lexicon: noun
  rationale: ῥῆμα는 일반적으로 ‘말/말씀’의 의미를 갖지만, 여기서는 아버지의 여러 ‘말들’을 가리키므로 복수적 의미를 반영한 ‘말’을 썼습니다.
theological_decisions:
- issue: 부계 권면의 권위 표현
  chosen_reading: “너희 아버지의 말”을 단순 정보가 아니라 청중이 경청해야 할 권면으로 유지했습니다.
  alternative_readings:
  - “아버지의 말씀”으로 높임
  - “아버지의 가르침”으로 풀이
  rationale: 본문은 교리적 용어보다 가족 내 권위 있는 권면을 전달합니다. ‘말씀’은 한국어에서 흔히 신적/성경적 격식을 강하게 띠므로, 원문의 일반적 발화를 보존하기 위해 ‘말’로 두었습니다.
  doctrine_reference: source-semantic preservation
