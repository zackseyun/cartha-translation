  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Ἀλλ'³⁵ ἔκλαιον³⁶ Γἐν κρυφῇ˥³⁷ *ἡμέρας πολλὰς³⁸ *διὰ τὸν Ἰωσήφ³⁹. *ἐφοβούμην γὰρ⁴⁰ *τοὺς ἀδελφούς μου, Γὅτι⁴¹ συνέθεντο πάντες⁴² *ὅστις ἐξείπῃ⁴³ τὸ μυστήριον ἀναιρεθῆναι⁴⁴ αὐτόν⁴⁵˥.
