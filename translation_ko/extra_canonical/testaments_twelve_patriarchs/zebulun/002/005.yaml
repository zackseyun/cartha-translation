base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/005.yaml
  text: But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be killed.
translation:
  language: ko
  text: 그러나 나는 요셉 때문에 여러 날 동안 은밀히 울었습니다. 나는 형들이 두려웠습니다. 왜냐하면 그들 모두가 비밀을 누설하는 사람은 죽이기로 합의했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαιον... Γἐν κρυφῇ
  english_pob_choice: I wept in secret
  chosen_korean: 은밀히 울었습니다
  alternatives_korean:
  - 몰래 울었습니다
  - 숨겨서 울었습니다
  lexicon: κλαίω, ἐν κρυφῇ
  rationale: ‘ἐν κρυφῇ’는 단순한 내적 슬픔보다 ‘드러나지 않게’라는 방식의 은밀함을 강조하므로, 자연스러운 합쇼체로 ‘은밀히’가 가장 직접적입니다.
- source_word: ἡμέρας πολλὰς
  english_pob_choice: for many days
  chosen_korean: 여러 날 동안
  alternatives_korean:
  - 많은 날 동안
  - 오랫동안
  lexicon: ἡμέρα, πολλός
  rationale: 기간의 길이를 드러내되 과장하지 않도록, 관용적이면서도 원문의 복수를 살린 ‘여러 날 동안’을 택했습니다.
- source_word: ἀναιρεθῆναι
  english_pob_choice: should be killed
  chosen_korean: 죽이기로
  alternatives_korean:
  - 죽이기로 정하고
  - 죽게 하기로
  lexicon: ἀναιρέω
  rationale: 개정된 영어 POB의 ‘should be killed’를 따라, 직접적이고 책임 주체가 드러나는 한국어 ‘죽이기로’로 옮겼습니다. ‘처형하다’는 법적 뉘앙스가 강해 본문보다 좁습니다.
- source_word: μυστήριον
  english_pob_choice: the secret
  chosen_korean: 비밀
  alternatives_korean:
  - 은밀한 일
  - 비밀스러운 일
  lexicon: μυστήριον
  rationale: 여기서는 종교적 ‘신비’가 아니라 형제들이 감추려 한 사건의 내용이므로, English POB의 ‘secret’에 맞춰 평이한 ‘비밀’이 가장 적절합니다.
theological_decisions:
- issue: 집단 합의와 책임의 표현
  chosen_reading: 그들 모두가 비밀을 누설하는 사람은 죽이기로 합의했습니다
  alternative_readings:
  - 누설하는 자를 죽일 것이라고 모두 합의했습니다
  - 비밀을 드러내는 자는 죽임을 당하게 하기로 했습니다
  rationale: 원문의 συνέθεντο πάντες는 ‘모두가 합의했다’는 집단적 결의를 강조하므로, 개인적 협박보다 공동 책임이 드러나는 형태로 유지했습니다.
  doctrine_reference: '서사 본문 해석: 공동 결의와 도덕적 책임'
