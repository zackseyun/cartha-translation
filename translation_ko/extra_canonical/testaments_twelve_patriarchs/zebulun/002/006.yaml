id: T12P.ZEB.2.6
reference: Testament of Zebulun 2:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. *Πλὴν ὅτε⁴⁶ ἐβούλοντο ἀνελεῖν αὐτόν⁴⁷, *ἐγὼ μετὰ δακρύων προσεκάλουν αὐτοὺς⁴⁸ μὴ ποιῆσαι τὴν ἁμαρτίαν⁴⁹ ταύτην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/006.yaml
  text: Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin.
translation:
  language: ko
  text: 그러나 그들이 그를 죽이려 할 때, 나는 눈물로 그들에게 이 죄를 짓지 말라고 간청했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβούλοντο ἀνελεῖν αὐτόν
  english_pob_choice: wanted to kill him
  chosen_korean: 그를 죽이려 할 때
  alternatives_korean:
  - 그를 죽이려고 했을 때
  - 그를 죽이려 원할 때
  lexicon: ἀνελεῖν = 죽이다 / 제거하다
  rationale: ἀνελεῖν은 단순한 ‘해치다’보다 ‘죽이다’가 직접적이며, POB의 kill him을 한국어로 자연스럽게 살렸습니다.
- source_word: μετὰ δακρύων προσεκάλουν αὐτούς
  english_pob_choice: I pleaded with them with tears
  chosen_korean: 나는 눈물로 그들에게 간청했습니다
  alternatives_korean:
  - 나는 눈물을 흘리며 그들에게 간청했습니다
  - 나는 눈물로 그들에게 호소했습니다
  lexicon: μετὰ δακρύων / προσεκάλουν = 눈물과 함께 부르다, 간청하다
  rationale: ‘with tears’의 수단·동반 의미를 ‘눈물로’로 간결하게 옮기고, προσεκάλουν의 반복적·강한 요청을 ‘간청했습니다’로 드러냈습니다.
- source_word: μὴ ποιῆσαι τὴν ἁμαρτίαν ταύτην
  english_pob_choice: not to commit this sin
  chosen_korean: 이 죄를 짓지 말라고
  alternatives_korean:
  - 이 죄를 범하지 말라고
  - 이런 죄를 저지르지 말라고
  lexicon: ποιῆσαι τὴν ἁμαρτίαν = 이 죄를 행하다/짓다
  rationale: ἁμαρτία를 직역해 ‘죄’로 유지하고, ‘commit’의 관용적 한국어인 ‘짓다’를 사용해 도덕적 행위를 분명히 했습니다.
theological_decisions:
- issue: 형제 살해를 죄로 규정하는 표현의 강도
  chosen_reading: ‘이 죄를 짓지 말라고’로 옮겨, 단순한 부정이 아니라 실제 범죄 행위를 막는 윤리적 경고로 드러냈습니다.
  alternative_readings:
  - ‘이 죄를 범하지 말라고’
  - ‘이런 죄를 저지르지 말라고’
  rationale: 원문은 살인의 의도를 죄로 명시하며 간청하는 장면이므로, 한국어에서도 죄의 실질성과 긴급성을 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 십계명과 살인 금지의 윤리적 무게(출 20:13)
