revisions:
- from: 그가 이 슬픔의 말들을 하며 말하고 있을 때, 내가 그의 통곡을 견딜 수 없어 울기 시작하였고, 내 간이 쏟아져 나왔으며, 내 내장 속의 모든 실체가 기운을 잃었습니다.
  to: 그가 슬퍼하며 이 말들을 하고 있을 때, 나는 그의 울부짖음을 견딜 수 없어 울기 시작하였고, 내 간이 쏟아져 나왔으며, 내 내장의 모든 기력이 쇠약해졌습니다.
  rationale: 화자의 애통한 태도를 발화 내용과 구별하여 반영하고, 불필요한 ‘하며 말하고’의 중복을 제거했습니다. 마지막 신체 비유는 ‘간’과 ‘내장’을 보존하되, ὑπόστασις를 현대 한국어에서 이해 가능한 ‘기력’으로 옮겨 전신적 쇠진의 이미지를 살렸습니다.
