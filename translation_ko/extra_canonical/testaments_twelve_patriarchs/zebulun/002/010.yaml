  text: And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.
translation:
  language: ko
  text: 그가 이 슬픔의 말들을 하며 말하고 있을 때, 내가 그의 통곡을 견딜 수 없어 울기 시작하였고, 내 간이 쏟아져 나왔으며, 내 내장 속의 모든 실체가 기운을 잃었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἔλεγεν ... τὰ ῥήματα ταῦτα
  english_pob_choice: And as he spoke these words
  chosen_korean: “그가 이 슬픔의 말들을 하며 말하고 있을 때”
  alternatives_korean:
  - “그가 이 말들을 하는 동안”
  - “그가 이 말씀들을 하며”
  lexicon: ῥήματα
  rationale: ῥήματα는 단순한 ‘말’보다 구체적 발화 내용을 가리키므로 ‘말들’로 옮기되, 영어 POB의 grief를 반영해 문맥상 ‘슬픔의’로 구체화했습니다.
- source_word: οἰμωγῶν
  english_pob_choice: cries
  chosen_korean: 통곡
  alternatives_korean:
  - 울부짖음
  - 곡성
  lexicon: οἰμωγή
  rationale: οἰμωγαί는 애통한 울부짖음을 뜻하므로, 단순한 ‘울음’보다 강한 정서가 드러나는 ‘통곡’이 적절합니다.
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  english_pob_choice: my liver was poured out
  chosen_korean: 내 간이 쏟아져 나왔으며
  alternatives_korean:
  - 내 간이 흘러나왔으며
  - 내 간이 쏟아졌으며
  lexicon: ἧπαρ
  rationale: ἥπαρ는 문자적으로 ‘간’이므로 전통적 완화 없이 신체 이미지 그대로 살렸고, ἐξεχύθησαν의 수동적 유출감을 ‘쏟아져 나왔으며’로 반영했습니다.
- source_word: πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου ἐχαυνοῦτο
  english_pob_choice: all the substance of my inward parts grew faint
  chosen_korean: 내 내장 속의 모든 실체가 기운을 잃었습니다
  alternatives_korean:
  - 내 속의 모든 실체가 쇠약해졌습니다
  - 내장 전체의 본질이 약해졌습니다
  lexicon: ὑπόστασις / σπλάγχνα
  rationale: ὑπόστασις는 ‘실체/기반’의 뜻을 유지해야 하고, σπλάγχνα는 감정의 중심이자 내장 이미지를 함께 지니므로, 영어 POB의 ‘substance of my inward parts’를 따라 ‘내장 속의 모든 실체’로 옮겼습니다.
theological_decisions:
- issue: 신체-감정 비유의 보존
  chosen_reading: 간과 내장을 실제 신체 이미지로 살려, 극심한 슬픔이 몸 전체를 소진시키는 표현으로 그대로 드러냈습니다.
  alternative_readings:
  - 비유적으로 완화해 ‘마음이 무너졌습니다’로 옮김
  - 문학적으로 정리해 ‘속이 다 상했습니다’로 옮김
  rationale: 원문은 내적 고통을 신체 기관의 유출과 쇠약으로 과장해 표현하므로, 이를 심리적 관용구로 평준화하면 원문의 충격과 수사학이 약화됩니다.
  doctrine_reference: 직역 충실성 및 수사적 이미지 보존
