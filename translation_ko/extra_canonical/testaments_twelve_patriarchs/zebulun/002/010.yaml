    rationale: πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου는 내장 ‘속’의 사물이 아니라 내장 전체의 지탱하는 실질 또는 기력이 쇠약해지는 이미지입니다.
  revised_text: 그가 슬퍼하며 이 말들을 하고 있을 때, 나는 그의 울부짖음을 견딜 수 없어 울기 시작하였고, 내 간이 쏟아져 나왔으며, 내 내장의 모든 기력이 쇠약해졌습니다.
