  source_fidelity: 수정 전의 ‘아버지에게 일어난 일’은 τῷ πατρί μου를 ‘아버지에게 일어난’으로 결속시켜, 사건이 아버지에게 발생했다는 뜻으로 바꿉니다. 그리스어에서 τῷ πατρί μου는 εἰπεῖν의 간접목적어, 곧 ‘내 아버지께’이며, τὸ γενόμενον은 ‘일어난 일’입니다. 이를 바로잡았습니다. 나머지는 παρανομία의 율법 위반 의미, ἄγνοια의 책임 있는 잘못이라는 표현, 그리고 ἐβεβαίωσα의 강한 확언의 뉘앙스를 대체로 보존합니다.
  naturalness: ‘아버지께 일어난 일을 말하지 말라고’는 ‘아버지께’가 ‘말하다’의 상대임을 자연스럽게 드러내며, 현대 표준어 합쇼체 문맥에도 맞습니다. 원문의 각주 표지 [a]는 제공된 각주가 없어 삭제했습니다.
  terminology: ‘율법을 어긴 일’은 παρανομία의 규범적·율법적 의미를 적절히 살립니다. ‘무지’는 원문의 ἄγνοια를 보존하되, ‘저지른’과 결합해 단순한 지식 부족으로 약화되지 않게 합니다. ‘확언한’은 ἐβεβαίωσα에 무난하게 대응합니다.
