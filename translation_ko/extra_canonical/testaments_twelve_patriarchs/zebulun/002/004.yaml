base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/004.yaml
  text: I do not remember that I committed lawlessness, except for the ignorance that I committed concerning Joseph, in that I assured my brothers not to tell my father what had happened.
translation:
  language: ko
  text: 저는 내가 율법을 어긴 일을 기억하지 못합니다. 다만 요셉과 관련하여 내가 저지른 무지, 곧 형제들에게 아버지에게 일어난 일을 말하지 말라고 확언한 일은 예외입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μνήσκομαι ὅτι παρανομίαν ἐποίησα
  english_pob_choice: I do not remember that I committed lawlessness
  chosen_korean: 저는 내가 율법을 어긴 일을 기억하지 못합니다
  alternatives_korean:
  - 내가 불법을 저질렀던 일을 기억하지 못합니다
  - 내가 율법을 범한 일을 기억하지 못합니다
  lexicon: μνήσκομαι / παρανομία
  rationale: μνήσκομαι의 ‘기억하다’와 παρανομίαν의 ‘율법을 어기다’ 의미를 살려, 추상적인 ‘불법’보다 토라 규범 위반을 드러내는 ‘율법을 어기다’로 옮겼습니다.
- source_word: τὴν ἄγνοιαν ἣν ἐποίησα ἐπὶ τοῦ Ἰωσήφ
  english_pob_choice: the ignorance that I committed concerning Joseph
  chosen_korean: 요셉과 관련하여 내가 저지른 무지
  alternatives_korean:
  - 요셉에 대해 내가 저지른 무지
  - 요셉에 관해 내가 보인 무지
  lexicon: ἄγνοια / ἐποίησα ἐπὶ
  rationale: 반복된 ἐποίησα를 따라 ‘무지’를 단순 상태가 아니라 ‘저지른 일’로 처리했고, ἐπὶ τοῦ Ἰωσήφ는 관계 범위를 나타내므로 ‘요셉과 관련하여’로 자연스럽게 반영했습니다.
- source_word: ὅτι ἐβεβαίωσα τοῖς ἀδελφοῖς μου μὴ εἰπεῖν
  english_pob_choice: in that I assured my brothers not to tell
  chosen_korean: 형제들에게 아버지에게 일어난 일을 말하지 말라고 확언한 일은
  alternatives_korean:
  - 형제들에게 말하지 말라고 확실히 말한 일은
  - 형제들에게 아버지께 그 일을 말하지 않겠다고 약속한 일은
  lexicon: ἐβεβαίωσα / μὴ εἰπεῖν
  rationale: ἐβεβαίωσα는 단순한 ‘약속’보다 ‘확언하다, 확실하게 말하다’가 더 가깝고, μὴ εἰπεῖν은 부정 부정사로서 ‘말하지 말라고’로 풀었습니다.
- source_word: τῷ πατρί μου τὸ γενόμενον
  english_pob_choice: my father what had happened
  chosen_korean: 아버지에게 일어난 일
  alternatives_korean:
  - 내 아버지에게 생긴 일
  - 내 아버지에게 있었던 일
  lexicon: γίνομαι
  rationale: τὸ γενόμενον은 ‘일어난 것/사건’을 가리키므로, 한국어에서도 사건성을 살려 ‘일어난 일’로 간결하게 옮겼습니다.
theological_decisions:
- issue: παρανομίαν의 도덕·율법적 뉘앙스
  chosen_reading: ‘율법을 어긴 일’로 옮겨, 단순한 사회적 ‘불법’보다 하나님의 법/율법 위반이라는 색채를 살렸습니다.
  alternative_readings:
  - 불법을 저지른 일
  - 법을 어긴 일
  rationale: 이 문맥은 형제들에게 한 행위에 대한 자기성찰로, παρανομία가 법적 범죄 일반보다 규범 위반의 의미를 띠므로 전통적이고도 정확한 신앙어휘인 ‘율법’을 유지하는 편이 소스에 충실합니다.
  doctrine_reference: 율법/죄의식
- issue: ‘무지’의 자기고백적 사용
  chosen_reading: ‘무지’를 지적 결핍으로만 약화시키지 않고, 실제로 저지른 잘못으로 표현했습니다.
  alternative_readings:
  - 실수
  - 부주의
  rationale: ἄγνοια는 단순한 정보 부족이 아니라 책임 있는 행위의 결핍을 가리킬 수 있으므로, 여기서는 자책의 성격을 보존하는 번역이 적절합니다.
  doctrine_reference: 책임 윤리
