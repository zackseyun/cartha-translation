id: T12P.ZEB.2.2
reference: Testament of Zebulun 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. Ἐγὼ¹⁶ Ζαβουλὼν δόσις ἀγαθὴ¹⁷ γέγονα¹⁸ τοῖς γονεῦσί μου· ἐν γὰρ τῷ τεχθῆναι¹⁹ με, ηὐξήνθη²⁰ ὁ πατήρ μου²¹ σφόδρα καὶ τὰ πρόβατα²² καὶ τὰ βουκόλια, ὅτε²³ *ἐν ταῖς ποικίλαις ῥάβδοις²⁴ εἶχον²⁵ τὸν κλῆρον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/002.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased greatly, and so did the sheep and the cattle, when he had his portion among the variegated rods.
translation:
  language: ko
  text: 나 스불론은 부모에게 좋은 선물이 되었습니다. 내가 태어났을 때 내 아버지는 크게 번성하였고, 양 떼와 소 떼도 얼룩무늬 막대들 가운데서 몫을 얻었을 때 크게 늘어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어에는 ‘그들이 몫을 가졌을 때’라는 복수 동사가 쓰였습니다. 그 주어를 양 떼와 소 떼로 보는 해석을 본문에 반영했습니다. 일부 번역은 문맥상 이를 아버지로 이해합니다.
    reason: εἶχον의 복수형과 그 주어에 관한 해석상의 불확실성을 보존하기 위함입니다.
lexical_decisions:
- source_word: δόσις ἀγαθή
  english_pob_choice: a good gift
  chosen_korean: 좋은 선물
  alternatives_korean:
  - 좋은 증여
  - 복된 선물
  - 좋은 선사
  lexicon: δόσις
  rationale: 부모에게 ‘좋은 선물’이 되었다는 직역을 유지해 출생 자체를 은혜로운 선물로 보는 의미를 자연스럽게 살렸습니다.
- source_word: ηὐξήνθη
  english_pob_choice: increased greatly
  chosen_korean: 크게 번성하였고
  alternatives_korean:
  - 크게 증가하였고
  - 매우 번성하였고
  - 크게 불어났고
  lexicon: αὐξάνω
  rationale: 가축과 아버지의 번성을 함께 포괄하도록 ‘번성하다’를 택하되, ‘크게’로 정도를 분명히 했습니다.
- source_word: ἐν ταῖς ποικίλαις ῥάβδοις ... τὸν κλῆρον
  english_pob_choice: when he had his portion among the variegated rods
  chosen_korean: 얼룩무늬 막대들 가운데서 몫을 가졌을 때
  alternatives_korean:
  - 얼룩무늬 막대들 가운데서 분깃을 가졌을 때
  - 여러 빛깔의 막대들 사이에서 그의 몫을 가졌을 때
  - 무늬 있는 막대들 가운데서 제비를 얻었을 때
  lexicon: κλῆρος
  rationale: POB의 ‘portion’에 맞추되, κλῆρος의 분깃/몫 의미를 살려 ‘몫을 가졌다’로 옮겨 구조를 보존했습니다.
theological_decisions:
- issue: 출생 축복과 가축 번영의 인과관계 표현
  chosen_reading: 태어남이 아버지의 번성과 가축의 증식과 연결된다는 진술을 그대로 살렸습니다.
  alternative_readings:
  - 출생이 단지 시간상 배경임을 약화시켜 일반적 축복 진술로 완화함
  - 가축의 번성을 별도 축복으로 분리함
  rationale: 본문은 출생과 번성의 연계를 분명히 말하므로, 인과적/상관적 긴장을 약화시키지 않고 그대로 전달하는 것이 적절합니다.
  doctrine_reference: 본문 내 축복-기억 서술에 대한 문학적 존중
- issue: ‘좋은 선물’의 신학적 뉘앙스
  chosen_reading: 스불론의 존재를 부모에게서 온 선물로 표현했습니다.
  alternative_readings:
  - 단순히 ‘좋은 아이’로 완화함
  - ‘축복’으로 바꾸어 의미를 일반화함
  rationale: δόσις ἀγαθή의 선물성은 출생을 은혜로운 증여로 보는 관점을 담으므로, 이를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 창조/출생의 선물성
