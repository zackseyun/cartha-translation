    rationale: 그리스어 본문은 εἶχον(‘그들이 가졌다’)을 사용합니다. 영어 POB는 ‘he’로 해석하지만, 한국어는 원문 우선 원칙에 따라 복수형을 반영하고, 그 주어의 정확한 지시는 주석으로 밝혀야 합니다.
  - severity: low
