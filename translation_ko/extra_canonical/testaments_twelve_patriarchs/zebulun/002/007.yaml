  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: II. Ἦλθον¹ γὰρ ὁ² Συμεὼν Γκαὶ ὁ Δὰν˥ καὶ ὁ² Γὰδ ἐπὶ τὸν Ἰωσὴφ τοῦ ἀνελεῖν αὐτόν, καὶ ἔλεγεν αὐτοῖς μετὰ δακρύων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/007.yaml
  text: For Simeon and Dan and Gad came against Joseph to kill him, and he spoke to them with tears.
translation:
  language: ko
  text: 시므온과 단과 갓이 요셉을 죽이려고 맞서 왔습니다. 그리고 그는 눈물을 흘리며 그들에게 말했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦλθον ... ἐπὶ τὸν Ἰωσὴφ
  english_pob_choice: came against Joseph
  chosen_korean: 요셉을 죽이려고 맞서 왔습니다
  alternatives_korean:
  - 요셉에게 왔습니다
  - 요셉을 향해 왔습니다
  - 요셉에게 달려들었습니다
  lexicon: ἐπὶ + accusative
  rationale: ἐπὶ τὸν Ἰωσὴφ는 단순한 이동이 아니라 적대적 접근을 뜻하므로, 문맥의 살해 의도를 드러내는 ‘맞서 왔습니다’로 옮겼습니다.
- source_word: τοῦ ἀνελεῖν αὐτόν
  english_pob_choice: to kill him
  chosen_korean: 죽이려고
  alternatives_korean:
  - 죽이기 위해
  - 그를 죽이려 하여
  lexicon: ἀναιρέω
  rationale: ἀνελεῖν은 여기서 분명히 살해를 뜻하므로, 자연스러운 목적 표현인 ‘죽이려고’로 간명하게 살렸습니다.
- source_word: ἔλεγεν
  english_pob_choice: he spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하고 있었습니다
  - 말하였습니다
  lexicon: λέγω
  rationale: 과거 미완료의 진행성은 문맥상 한 번의 발화보다 지속적 말하기에 가깝기 때문에, ‘말했습니다’로 기본 의미를 살리되 한국어 흐름을 유지했습니다.
- source_word: μετὰ δακρύων
  english_pob_choice: with tears
  chosen_korean: 눈물을 흘리며
  alternatives_korean:
  - 눈물과 함께
  - 울면서
  lexicon: μετά + genitive
  rationale: 직역보다도 눈물의 동반 상태를 자연스럽게 드러내는 관용 표현 ‘눈물을 흘리며’가 원문의 정서를 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 형제들의 적대 행위와 요셉의 눈물의 병치
  chosen_reading: 원문이 말하는 폭력적 의도와 정서적 반응을 모두 보존해, 서술의 긴장감을 약화시키지 않았습니다.
  alternative_readings:
  - 적대성을 약화시켜 단순한 이동으로 처리
  - 눈물의 표지를 생략하고 담담한 서술로 정리
  rationale: 이 절은 살해 의도와 눈물이 함께 제시되어 도덕적·서사적 대비를 형성하므로, 두 요소를 모두 선명하게 드러내야 합니다.
  doctrine_reference: 서사 보존 원칙
