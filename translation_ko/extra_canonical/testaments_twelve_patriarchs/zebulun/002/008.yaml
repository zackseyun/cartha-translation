id: T12P.ZEB.2.8
reference: Testament of Zebulun 2:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἐλεήσατέ με ἀδελφοί μου⁷. οἰκτειρήσατε⁸ σπλάγχνα⁹ Ἰακὼβ τοῦ πατρὸς ἡμῶν¹⁰. Μὴ¹¹ ἐπαγάγετε¹² τὰς χεῖρας ὑμῶν Γτοῦ˥¹³ ἐκχέαι αἷμα ἀθῷον, ὅτι οὐχ ἥμαρτον¹⁴ καὶ πεσὼν εἰς ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/008.yaml
  text: “Have mercy on me, my brothers; have compassion, by the compassion of Jacob our father. Do not bring your hands upon me to shed innocent blood, for I have not sinned against you.”
translation:
  language: ko
  text: “저에게 자비를 베풀어 주십시오, 내 형제들아. 우리 아버지 야곱의 긍휼을 따라 긍휼을 베풀어 주십시오. 제 손을 저에게 대어 무죄한 피를 흘리게 하지 마십시오. 저는 여러분에게 죄를 짓지 않았습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεήσατέ με
  english_pob_choice: Have mercy on me
  chosen_korean: 저에게 자비를 베풀어 주십시오
  alternatives_korean:
  - 저를 불쌍히 여겨 주십시오
  - 저에게 긍휼을 베풀어 주십시오
  lexicon: ἐλεέω
  rationale: 청원형 동사로서 ‘자비를 베풀다’가 가장 자연스럽고, 뒤의 οἰκτειρήσατε와 중복을 피하면서도 자비/긍휼의 어감을 살립니다.
- source_word: οἰκτειρήσατε σπλάγχνα Ἰακὼβ τοῦ πατρὸς ἡμῶν
  english_pob_choice: have compassion, by the compassion of Jacob our father
  chosen_korean: 우리 아버지 야곱의 긍휼을 따라 긍휼을 베풀어 주십시오
  alternatives_korean:
  - 우리 아버지 야곱의 불쌍히 여기는 마음을 따라 불쌍히 여겨 주십시오
  - 우리 아버지 야곱의 내장을 따라 긍휼을 베풀어 주십시오
  lexicon: οἰκτείρω, σπλάγχνα
  rationale: οἰκτειρήσατε는 ‘긍휼을 베풀다’로, σπλάγχνα는 직역의 ‘내장’보다 문맥상 ‘긍휼/compassion’이 요구되므로 관계어구로 풀어 옮겼습니다.
- source_word: Μὴ ἐπαγάγετε τὰς χεῖρας ὑμῶν… ἐκχέαι αἷμα ἀθῷον
  english_pob_choice: Do not bring your hands upon me to shed innocent blood
  chosen_korean: 제 손을 저에게 대어 무죄한 피를 흘리게 하지 마십시오
  alternatives_korean:
  - 저에게 손을 대어 무죄한 피를 흘리지 마십시오
  - 제게 손을 얹어 무죄한 피를 쏟게 하지 마십시오
  lexicon: ἐπάγω, ἐκχέω, αἷμα ἀθῷον
  rationale: ἐπαγάγετε는 단순한 ‘놓다’보다 ‘가져다가 대다/가하다’의 뉘앙스가 있어 ‘손을…대어’로 처리했고, ἐκχέαι αἷμα ἀθῷον은 관용적으로 ‘무죄한 피를 흘리게 하다’로 옮겼습니다.
- source_word: ὅτι οὐχ ἥμαρτον καὶ πεσὼν εἰς ὑμᾶς
  english_pob_choice: for I have not sinned against you
  chosen_korean: 저는 여러분에게 죄를 짓지 않았습니다
  alternatives_korean:
  - 제가 여러분께 죄를 범하지 않았습니다
  - 제가 여러분을 향해 죄를 짓지 않았습니다
  lexicon: ἁμαρτάνω
  rationale: ἐν/εἰς ὑμᾶς의 관계를 살려 ‘여러분에게’로 자연스럽게 옮겼고, 동사의 결과적 의미를 간명하게 유지했습니다.
theological_decisions:
- issue: σπλάγχνα를 신체어로 직역할지, 정서·윤리적 의미로 번역할지
  chosen_reading: 문맥상 ‘긍휼/compassion’으로 옮겨 독자가 문장의 윤리적 호소를 바로 이해하도록 했습니다.
  alternative_readings:
  - 내장
  - 심장
  - 속사람
  rationale: 이 구절의 σπλάγχνα는 문자적 신체기관보다 공감과 자비의 자리라는 관용적 의미가 강하므로, POB의 ‘compassion’ 판단을 따라 의미를 드러냈습니다.
  doctrine_reference: 성서 히브리/그리스어에서 신체어가 정서·윤리 영역을 가리키는 관용법
