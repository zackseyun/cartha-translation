  text: But even if I have sinned, discipline me with discipline, my brothers; but do not raise your hand in the murder of your brother, for the sake of Jacob your father.”
translation:
  language: ko
  text: 그러나 내가 죄를 지었더라도, 내 형제들아, 너희는 나를 훈계로 훈계하되, 너희 손을 너희 형제의 살해에 들지 마십시오. 이는 너희 아버지 야곱을 위한 것입니다.[a][b]
  philosophy: formal
lexical_decisions:
- source_word: ἐν παιδείᾳ παιδεύσατέ με
  english_pob_choice: discipline me with discipline
  chosen_korean: 나를 훈계로 훈계하되
  alternatives_korean:
  - 나를 징계로 징계하되
  - 나를 훈련으로 훈련하되
  lexicon: παιδεία / παιδεύω
  rationale: 반복 구조를 살려 ‘훈계’와 동사 ‘훈계하다’를 대응시켜, 단순한 처벌이 아니라 교정·교육적 의미가 함께 드러나게 했습니다.
- source_word: τὴν δὲ χεῖρα ὑμῶν μὴ ἐνέγκατε
  english_pob_choice: do not raise your hand
  chosen_korean: 너희 손을 … 들지 마십시오
  alternatives_korean:
  - 너희 손을 … 내지 마십시오
  - 너희 손을 … 올리지 마십시오
  lexicon: χείρ / ἐνέγκω
  rationale: 직역을 피하면서도 몸의 행동을 자연스럽게 드러내기 위해 ‘손을 들다’를 택했고, 폭력 행위를 예고하는 문맥을 유지했습니다.
- source_word: ἐν φόνῳ ἀδελφοῦ ὑμῶν
  english_pob_choice: in the murder of your brother
  chosen_korean: 너희 형제의 살해에
  alternatives_korean:
  - 너희 형제의 살육에
  - 너희 형제의 죽임에
  lexicon: φόνος
  rationale: φόνος의 강한 살인 의미를 살리되 한국어에서 가장 직접적인 법적·도덕적 표현인 ‘살해’를 사용했습니다.
- source_word: διὰ Ἰακὼβ τὸν πατέρα ὑμῶν
  english_pob_choice: for the sake of Jacob your father
  chosen_korean: 이는 너희 아버지 야곱을 위한 것입니다
  alternatives_korean:
  - 너희 아버지 야곱 때문에입니다
  - 너희 아버지 야곱을 생각해서입니다
  lexicon: διά + accusative
  rationale: διά의 목적·이유를 살려 ‘~을 위한 것입니다’로 옮겨, 야곱을 근거로 형제 살해를 금하는 논리를 분명히 했습니다.
theological_decisions:
- issue: 죄를 인정하면서도 공동체 내부의 폭력을 금하는 호소
  chosen_reading: ‘죄를 지었더라도’와 ‘살해에 들지 마십시오’를 함께 살려, 회개 요청과 살인 금지가 병렬된 긴장을 보존했습니다.
  alternative_readings:
  - ‘만일 내가 죄를 지었더라도’로 더 조건문답게 옮기는 읽기
  - ‘손을 올리지 마십시오’처럼 완곡하게 폭력을 줄이는 읽기
  rationale: 원문은 자기 죄 가능성을 인정하면서도 형제 살해를 강하게 금하는 구조이므로, 두 요소를 모두 선명하게 드러내야 합니다.
  doctrine_reference: 형제애, 공동체 윤리, 살인 금지
- issue: 직접 화법의 명령형 어조
  chosen_reading: 형제들에 대한 직접 권고를 한국어 합쇼체 명령으로 옮겼습니다.
  alternative_readings:
  - 평서문화하여 완곡하게 표현하는 읽기
  - 반말체로 낮추는 읽기
  rationale: 본문은 간절한 권면이므로 현대 한국어에서 공적·문학적 품위를 유지하는 명령형이 적절합니다.
  doctrine_reference: 수사적 권면의 보존
