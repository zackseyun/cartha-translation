  text: For five years, then, I fished, sharing with everyone I had seen, and providing for all my father’s house.
translation:
  language: ko
  text: 그런데 저는 다섯 해 동안 고기를 잡았습니다. 저는 만난 모든 사람과 나누어 주었고, 아버지의 온 집안을 위해 넉넉히 마련했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέντε οὖν ἔτη ... ἡλίευσα
  english_pob_choice: For five years, then, I fished
  chosen_korean: 그런데 저는 다섯 해 동안 고기를 잡았습니다
  alternatives_korean:
  - 그래서 저는 다섯 해 동안 낚시했습니다
  - 그리하여 저는 다섯 해 동안 물고기를 잡았습니다
  lexicon: ἡλιεύω
  rationale: ἡλίευσα는 단순한 직업 설명보다 실제 행위인 ‘고기를 잡다’가 자연스럽고, χρόνος 표현은 ‘다섯 해 동안’으로 옮겨 원문의 기간감을 살렸습니다.
- source_word: μεταδιδούς
  english_pob_choice: sharing with everyone I had seen
  chosen_korean: 만난 모든 사람과 나누어 주었고
  alternatives_korean:
  - 내가 본 모든 사람과 함께 나누었고
  - 보고 만난 모든 이들과 나누었고
  lexicon: μεταδίδωμι
  rationale: μεταδιδούς는 ‘함께 나누다/나누어 주다’의 의미가 분명하므로, POB의 ‘sharing’에 맞춰 수혜적 뉘앙스가 드러나는 ‘나누어 주었고’로 옮겼습니다.
- source_word: ὃν ἑωράκειν
  english_pob_choice: everyone I had seen
  chosen_korean: 만난 모든 사람
  alternatives_korean:
  - 내가 본 모든 사람
  - 내가 보았던 모든 사람
  lexicon: ὁράω
  rationale: 직역하면 ‘내가 본 모든 사람’이지만 한국어에서는 단순 시각보다 ‘만남’이 더 자연스럽게 관계적 접촉을 드러내므로, 원문의 범위를 해치지 않는 선에서 ‘만난’으로 다듬었습니다.
- source_word: παντὶ τῷ οἴκῳ τοῦ πατρός μου ἐξαρκῶν
  english_pob_choice: providing for all my father’s house
  chosen_korean: 아버지의 온 집안을 위해 넉넉히 마련했습니다
  alternatives_korean:
  - 아버지의 온 집안을 부양했습니다
  - 아버지의 집안 전체를 충족시켰습니다
  lexicon: ἐξαρκέω
  rationale: ἐξαρκῶν은 단순한 공급보다 ‘충분히 채워 주다/부양하다’의 의미가 있어, 현대 한국어에서 자연스럽고 내용 충실한 ‘넉넉히 마련하다’로 옮겼습니다.
theological_decisions:
- issue: 화자 자기소개의 행위열을 한국어로 어떻게 유지할지
  chosen_reading: 한 문장 안에서 ‘고기를 잡았습니다—나누어 주었고—넉넉히 마련했습니다’로 병렬하여, 행위의 지속성과 실천적 책임을 살렸습니다.
  alternative_readings:
  - 두 문장으로 나누어 설명적으로 풀기
  - ‘공급했습니다’처럼 추상화하기
  rationale: 원문은 기간+행위+두 분사구가 이어지는 구조이므로, 이를 한국어에서도 병렬로 유지해야 화자의 실천적 삶의 리듬이 보존됩니다.
  doctrine_reference: source-structure preservation
