  rationale: 연결사 οὖν을 ‘그러므로’로 바로잡고, ‘보다’라는 원문의 표현을 보존했습니다. 두 현재분사는 한국어의 연결 표현으로 옮겨, 물고기를 잡는 기간 동안 나누어 주고 집안을 공급한 지속적 행위를 자연스럽게 드러냈습니다.
