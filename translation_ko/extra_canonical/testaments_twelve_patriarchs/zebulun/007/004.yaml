  text: And from my catch, showing compassion, I shared with every stranger.
translation:
  language: ko
  text: 그리고 나는 내가 잡은 것 가운데서 모든 낯선 사람에게, 그들을 불쌍히 여기며 나누어 주곤 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῆς θήρας μου
  english_pob_choice: from my catch
  chosen_korean: 내가 잡은 것에서
  alternatives_korean:
  - 내 사냥감에서
  - 내 잡은 몫에서
  lexicon: θήρα
  rationale: θήρα는 사냥한/잡은 결과물을 가리키므로, 문맥에 맞게 자연스럽게 ‘내가 잡은 것’으로 옮겼습니다.
- source_word: παντὶ ἀνθρώπῳ ξένῳ
  english_pob_choice: to every stranger
  chosen_korean: 모든 낯선 사람에게
  alternatives_korean:
  - 모든 나그네에게
  - 모든 외국인에게
  lexicon: ξένος
  rationale: ξένος는 ‘낯선 사람/이방인/손님’의 폭을 가지므로, 여기서는 포괄적이고 현대적인 ‘낯선 사람’이 가장 직접적입니다.
- source_word: σπλαγχνιζόμενος
  english_pob_choice: showing compassion
  chosen_korean: 동정하며
  alternatives_korean:
  - 자비를 베풀며
  - 긍휼히 여기며
  lexicon: σπλαγχνίζομαι
  rationale: 내장/마음 깊은 연민을 뜻하는 동사로, 한국어에서는 행동을 수식하는 부사형 ‘동정하며’가 의미를 잘 드러냅니다.
- source_word: μετεδίδουν
  english_pob_choice: I shared
  chosen_korean: 나누어 주었습니다
  alternatives_korean:
  - 나누었습니다
  - 함께 나누었습니다
  lexicon: μεταδίδωμι
  rationale: 단순한 공유보다 실제로 분배해 주는 뉘앙스가 있어, 한국어에서는 ‘나누어 주었습니다’가 source의 행위성을 잘 반영합니다.
