source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Διὰ τοῦτο καὶ ὁ Κύριος *πολλοὺς ἰχθύας ἐνέπλησέ με²⁵ ἐν τῇ ἄγρᾳ τῶν ἰχθύων²⁶. Ὁ γὰρ μεταδιδοὺς τῷ πλησίον²⁷, λαμβάνει πολλαπλασίονα²⁸ παρὰ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/006.yaml
  text: For this reason the Lord also filled me with many fish in the catch of fish. For the one who shares with his neighbor receives many times more from the Lord.
translation:
  language: ko
  text: 이 때문에 주님께서도 물고기를 잡을 때 많은 물고기로 저를 가득 채워 주셨습니다. 이웃에게 나누어 주는 사람은 주님께로부터 여러 배를 받습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 주
  lexicon: κύριος
  rationale: 여기서는 인물 서술 속 주체를 자연스럽게 살려 ‘주님’으로 옮겼습니다. 예수 직접 호칭이 아니므로 문맥상 예배적 호칭보다는 서술형 표현이 적절합니다.
- source_word: πολλοὺς ἰχθύας ἐνέπλησέ με
  english_pob_choice: filled me with many fish
  chosen_korean: 많은 물고기를 … 가득 채워 주셨습니다
  alternatives_korean:
  - 많은 물고기로 나를 채우셨습니다
  - 많은 물고기를 가득 채우셨습니다
  lexicon: ἐμπίπλημι
  rationale: 동사 ἐνέπλησέ는 ‘채우다, 가득하게 하다’의 결과를 살려, 물고기가 ‘그물에 가득 찬’ 장면이 함께 드러나도록 옮겼습니다.
- source_word: ἐν τῇ ἄγρᾳ τῶν ἰχθύων
  english_pob_choice: in the catch of fish / in the fishing net
  chosen_korean: 그물
  alternatives_korean:
  - 고기잡이 그물
  - 물고기 잡는 그물
  lexicon: ἄγρα
  rationale: 문맥상 단순한 ‘잡은 양’보다 ‘그물’이라는 매개가 더 직접적이므로, 영어 POB의 “fishing net”에 맞춰 그물로 구체화했습니다.
- source_word: Ὁ γὰρ μεταδιδοὺς τῷ πλησίον
  english_pob_choice: For the one who shares with his neighbor
  chosen_korean: 이웃과 나누는 사람은
  alternatives_korean:
  - 이웃에게 나누어 주는 사람은
  - 이웃에게 베푸는 사람은
  lexicon: μεταδίδωμι
  rationale: μεταδιδοὺς는 단순 소유 이전이 아니라 ‘함께 나누어 주는’ 뉘앙스가 있어, ‘나누는 사람’으로 간결하게 살렸습니다.
- source_word: λαμβάνει πολλαπλασίονα παρὰ Κυρίου
  english_pob_choice: receives many times more from the Lord
  chosen_korean: 주님께로부터 여러 배를 받습니다
  alternatives_korean:
  - 주님께로부터 여러 갑절을 받습니다
  - 주님께로부터 훨씬 더 많이 받습니다
  lexicon: πολλαπλασίων
  rationale: πολλαπλασίονα는 단순 비교를 넘어 ‘여러 배, 몇 곱절’의 보상 개념이므로, ‘여러 배’로 직역에 가깝게 유지했습니다.
theological_decisions:
- issue: 보상의 근원과 보응의 진술
  chosen_reading: 나눔의 행위에 대해 주님께로부터 ‘여러 배’를 받는다는 보응 구조를 그대로 유지했습니다.
  alternative_readings:
  - 도덕적 원리로 완화하여 옮기기
  - 일반적인 축복 진술로 넓게 풀기
  rationale: 본문은 단순한 격언이 아니라 주님을 보상 주체로 명시하므로, 보상 언어를 약화시키지 않았습니다.
  doctrine_reference: 보응/상급의 진술에 대한 본문 충실성
