  naturalness: ‘물고기를 잡을 때 많은 물고기로 저를 가득 채워 주셨습니다’는 원문의 다소 강한 충만 표현을 유지하면서도 현대 한국어 합쇼체로 이해 가능합니다. 두 번째 문장은 격언체의 간결함을 보존했습니다.
  terminology: κύριος는 ‘주님’, πλησίον은 ‘이웃’, μεταδίδωμι는 ‘나누어 주는’, πολλαπλασίονα는 ‘여러 배’를 사용하여 원문과 영어 감사 기록의 의미를 유지했습니다.
  issues:
