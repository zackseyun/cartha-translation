  - severity: medium
    issue: ἄγρα를 ‘그물’로 과도하게 특정
    rationale: ἄγρα는 잡기, 사냥·어획, 잡은 것 등을 뜻하며 ‘그물’ 자체를 뜻하지 않습니다. 본문에 없는 도구를 삽입하지 않고 ‘물고기를 잡을 때’로 옮기는 것이 안전합니다.
  - severity: low
