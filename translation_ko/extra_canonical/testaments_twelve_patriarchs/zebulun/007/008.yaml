  to: 그러나 여러분이 필요한 사람에게 줄 것이 없다면, 긍휼히 여기는 마음으로 그와 함께 고통을 겪으십시오.
  rationale: 의미를 보태거나 줄이지 않고, 중복된 ‘함께’를 제거하고 ἐν σπλάγχνοις ἐλέους를 자연스러운 한국어 관용으로 다듬었습니다. 조건문의 대조 접속사 δέ는 ‘그러나’로 유지했습니다.
