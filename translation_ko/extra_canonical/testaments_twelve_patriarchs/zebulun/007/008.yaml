source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. *Καὶ τὸ μὲν ἥμισυ³² *ἐν τῷ χειμῶνι³³ ἐτοιμαίμην μετὰ τῶν ἀδελφῶν μου. 8. Εἰ δὲ μὴ ἔχετε δοῦναι τῷ χρήζοντι, συμπάσχετε αὐτῷ⁷ ἐν σπλάγχνοις ἐλέους. 9. Οἶδα⁸ ὅτι ἡ χείρ μου *οὐχ εὗρε⁹ ἐπιδοῦναι¹⁰ τῷ χρήζοντι, καὶ ἐπὶ¹¹ ἑπτὰ σταδίους συμπορευόμενος αὐτῷ ἔκλαιον· καὶ τὰ σπλάγχνα μου *ἐστρέφετο ἐπʼ αὐτῷ¹² εἰς συμπάθειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/008.yaml
  text: Half of it I would set aside in winter with my brothers. But if you do not have anything to give to the one in need, suffer with him in inward parts of mercy. I know that my own hand did not find anything to give to the one in need, and walking together with him for seven stadia I would weep; and my inward parts turned toward him in sympathy.
translation:
  language: ko
  text: 그러나 여러분이 필요한 사람에게 줄 것이 없다면, 긍휼히 여기는 마음으로 그와 함께 고통을 겪으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦναι τῷ χρήζοντι
  english_pob_choice: to give to the one in need
  chosen_korean: 필요한 사람에게 줄 것이 있다
  alternatives_korean:
  - 궁핍한 사람에게 줄 것이 있다
  - 도움이 필요한 사람에게 줄 것이 있다
  lexicon: διδόναι; χρήζω
  rationale: χρήζοντι를 단순히 ‘가난한 사람’으로 좁히지 않고, POB의 ‘the one in need’에 맞춰 ‘필요한 사람’으로 옮겨 필요 상태를 드러냈습니다.
- source_word: συμπάσχετε αὐτῷ
  english_pob_choice: suffer with him
  chosen_korean: 그와 함께 고통을 함께하십시오
  alternatives_korean:
  - 그와 함께 고난을 겪으십시오
  - 그에게 공감하십시오
  lexicon: συμπάσχω
  rationale: 동사 어근의 ‘함께 고난을 겪다’는 의미를 살려, 단순한 감정 이입보다 실제로 함께 아파하는 뜻을 드러냈습니다.
- source_word: ἐν σπλάγχνοις ἐλέους
  english_pob_choice: in inward parts of mercy
  chosen_korean: 마음의 긍휼로
  alternatives_korean:
  - 긍휼의 내장으로
  - 긍휼한 심정으로
  lexicon: σπλάγχνα; ἔλεος
  rationale: 직역하면 다소 생경한 ‘내장’ 표현이지만, 한국어 출판 문맥에서는 내면의 자비를 뜻하는 관용적 표현인 ‘마음의 긍휼’이 원문의 신체적-정서적 이미지를 가장 덜 약화시킵니다.
theological_decisions:
- issue: συμπάσχετε의 정서적 공감과 실제 연대의 강도
  chosen_reading: 단순히 ‘불쌍히 여기라’보다 ‘고통을 함께하십시오’로 옮겨, 결핍한 이와의 동참을 강조했습니다.
  alternative_readings:
  - 그를 불쌍히 여기십시오
  - 그에게 연민을 가지십시오
  rationale: 본문은 내부 감정만이 아니라 ‘함께 고통받음’을 요구하므로, 윤리적 강도를 낮추지 않는 번역이 필요합니다.
  doctrine_reference: 자비와 이웃 사랑의 실천적 연대
