  source_fidelity: 핵심 명령인 ‘필요한 사람에게 줄 것이 없을 때 그와 함께 고통을 겪으라’는 잘 반영되어 있습니다. 다만 ‘마음의 긍휼로’는 ἐν σπλάγχνοις ἐλέους(자비의 깊은 마음/긍휼의 심정으로)를 현대 한국어에서 다소 부자연스럽게 재현하며, ‘함께’가 중복되어 있습니다.
  naturalness: ‘그와 함께 마음의 긍휼로 고통을 함께하십시오’는 조사 결합과 부사의 반복 때문에 매끄럽지 않습니다. ‘긍휼히 여기는 마음으로 그와 함께 고통을 겪으십시오’가 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: χρήζων은 특정 경제적 빈곤층으로 한정하지 않은 ‘필요한 사람’으로 유지할 수 있습니다. σπλάγχνα는 문자적 신체어를 한국어에 억지로 옮기기보다 ‘긍휼히 여기는 마음’으로 번역해 자비의 깊은 정서라는 의미를 보존하는 것이 적절합니다.
