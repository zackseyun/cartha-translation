source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. *Εἰ δὲ ἦν ξένος, ἢ νοσῶν, ἢ²¹ γηράσας, ἐψήσας²² τοὺς ἰχθύας, καὶ *ποιήσας αὐτὰ ἀγαθῶς²³ κατὰ τὴν ἑκάστου χρείαν προσέφερον πᾶσι, συναλγῶν²⁴ καὶ συμπάσχων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/005.yaml
  text: If anyone was a foreigner, or sick, or aged, after boiling the fish and preparing them well, I would offer them to each according to need, suffering with them and feeling their pain.
translation:
  language: ko
  text: 만일 그가 나그네이거나 병들었거나 늙었으면, 나는 물고기를 삶고 그것들을 각 사람의 필요에 맞게 잘 준비한 뒤 모두에게 내어주었으며, 그들과 함께 아파하고 그들의 고통을 함께 느꼈습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξένος
  english_pob_choice: foreigner
  chosen_korean: 나그네
  alternatives_korean:
  - 이방인
  - 외국인
  lexicon: ξένος
  rationale: 이 문맥의 ξένος는 단순한 국적 표지가 아니라 공동체 바깥의 낯선 사람을 가리키므로, 현대 한국어에서 환대의 뉘앙스를 살리는 나그네가 가장 자연스럽습니다.
- source_word: νοσῶν
  english_pob_choice: sick
  chosen_korean: 병들었거나
  alternatives_korean:
  - 아프거나
  - 병약하거나
  lexicon: νοσῶν
  rationale: 몸이 아픈 상태를 직접적으로 드러내기 위해 병들었거나로 옮겼습니다.
- source_word: γηράσας
  english_pob_choice: aged
  chosen_korean: 늙었거나
  alternatives_korean:
  - 연로했거나
  - 나이가 들었거나
  lexicon: γηράσας
  rationale: 연령이 많은 상태를 자연스럽게 드러내되, 문장 리듬을 유지하기 위해 늙었거나를 택했습니다.
- source_word: ἐψήσας ... καὶ ποιήσας αὐτὰ ἀγαθῶς κατὰ τὴν ἑκάστου χρείαν
  english_pob_choice: after boiling the fish and preparing them well according to each person's need
  chosen_korean: 물고기를 삶고 그것들을 각 사람의 필요에 맞게 잘 준비한 뒤
  alternatives_korean:
  - 물고기를 익히고 그것들을 각 사람의 필요에 따라 잘 마련한 뒤
  - 물고기를 삶아 각 사람의 필요에 따라 잘 차린 뒤
  lexicon: ἐψήσας / ποιήσας ... ἀγαθῶς / χρεία
  rationale: ἐψήσας는 기본적으로 삶다/익히다의 조리 동작이고, ἀγαθῶς와 χρεία는 ‘좋게’보다 ‘필요에 맞게 잘’이 문맥상 더 분명하므로 조리와 배려를 함께 살렸습니다.
- source_word: προσέφερον
  english_pob_choice: I would offer them
  chosen_korean: 내어주었으며
  alternatives_korean:
  - 바쳤으며
  - 제공했으며
  lexicon: προσφέρω
  rationale: 단순 전달이 아니라 실제로 사람들에게 음식을 내놓는 행위이므로, 종교적 헌납 뉘앙스를 피하면서도 자연스러운 내어주었으며로 옮겼습니다.
theological_decisions:
- issue: 공감의 중첩 표현 συναλγῶν καὶ συμπάσχων
  chosen_reading: 그들과 함께 아파하고 그들의 고통을 함께 느꼈습니다
  alternative_readings:
  - 그들과 함께 고통을 나누었습니다
  - 그들과 함께 아파하며 함께 고난을 겪었습니다
  rationale: 두 분사는 단순한 동정이 아니라 타인의 아픔을 자기 일처럼 함께 겪는 중첩을 강조하므로, 아파하고/고통을 함께 느꼈습니다로 두 층위를 분리해 살렸습니다.
  doctrine_reference: 성도의 연대와 자비의 실천
