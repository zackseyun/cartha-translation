  terminology: αἰγιαλούς는 “해변”, ἁλιεύων ἰχθύας는 “물고기를 잡으며”, οἴκῳ τοῦ πατρός μου는 원문의 ‘집/가구’ 범위를 불필요하게 교리화하지 않고 “아버지의 집을 위해”로 유지했습니다. Αἴγυπτον은 통용 표기 “이집트”를 사용했습니다.
