  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/003.yaml
  text: And I was walking along the shore, fishing for fish for my father's house until we came to Egypt.
translation:
  language: ko
  text: 그리고 나는 해변을 따라 걸으며, 아버지의 집을 위해 물고기를 잡다가 우리가 이집트에 이를 때까지였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπορευόμενος τοὺς αἰγιαλούς
  english_pob_choice: walking along the shore
  chosen_korean: 해변을 따라 걸으며
  alternatives_korean:
  - 해안을 따라 지나가며
  - 바닷가를 따라 걸으며
  lexicon: διαπορεύομαι
  rationale: 동사는 단순한 이동보다 ‘지나가다/걸어가다’의 지속적 행위를 나타내며, τοὺς αἰγιαλούς는 ‘해변/해안’의 의미이므로 자연스러운 현대 한국어로 풀어 옮겼습니다.
- source_word: ἁλιεύων ἰχθύας
  english_pob_choice: fishing for fish
  chosen_korean: 물고기를 잡다가
  alternatives_korean:
  - 고기를 낚다가
  - 물고기를 낚으며
  lexicon: ἁλιεύω
  rationale: 중복 어감이 있는 ‘fishing for fish’를 한국어에서는 어색하지 않게 ‘물고기를 잡다’로 옮겨 원문의 행위를 분명히 했습니다.
- source_word: τῷ οἴκῳ τοῦ πατρός μου
  english_pob_choice: for my father's house
  chosen_korean: 아버지의 집을 위해
  alternatives_korean:
  - 아버지의 집을 위하여
  - 아버지 집을 위해
  lexicon: οἶκος
  rationale: οἶκος는 단순한 건물보다 가문/집안까지 포함할 수 있지만, 여기서는 POB의 영어가 ‘father's house’로 옮겨 정서적·소유적 뉘앙스를 살린 ‘아버지의 집’으로 두었습니다.
- source_word: ἕως ὅτου ἤλθομεν εἰς Αἴγυπτον
  english_pob_choice: until we came to Egypt
  chosen_korean: 우리가 이집트에 이를 때까지
  alternatives_korean:
  - 우리가 이집트에 올 때까지
  - 우리가 이집트에 도착할 때까지
  lexicon: ἕως ὅτου / ἔρχομαι
  rationale: 종결 시점을 나타내는 표현이므로 ‘~할 때까지’로 옮겼고, εἰς Αἴγυπτον은 목적지 도달을 드러내는 ‘이르다’를 택했습니다.
theological_decisions:
- issue: 1인칭 회고 서술의 시제와 문체
  chosen_reading: 과거 회고를 한국어 현재진행형으로 억지로 바꾸지 않고, ‘…걸으며…잡다가…~할 때까지였습니다’로 자연스러운 회고체를 유지했습니다.
  alternative_readings:
  - 직역식 과거형의 연속
  - 문어체 서술로 더 강하게 평탄화
  rationale: 본문은 단순 서술이므로 신학적 해석을 덧붙이지 않고, 화자의 회고를 현대 한국어 서술 흐름에 맞게 정리했습니다.
  doctrine_reference: 서사 문체 보존 원칙
