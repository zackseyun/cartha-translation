  text: 2. Καὶ ἤμην¹⁰ Γἐν αὐτῷ˥¹¹ διαπορευόμενος¹² *τοὺς αἰγιαλούς¹³, *ἁλιεύων ἰχθύας¹⁴ τῷ¹⁵ *οἴκῳ τοῦ¹⁶ πατρός μου ἕως ὅτου¹⁷ ἤλθομεν εἰς Αἴγυπτον.
