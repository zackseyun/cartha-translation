lexical_decisions:
- source_word: ὀθόνην
  english_pob_choice: a sheet
  chosen_korean: 천
  alternatives_korean:
  - 시트
  - 천 조각
  - 직물
  lexicon: ὀθόνη
  rationale: 그리스어 ὀθόνην은 펼쳐진 천/직물을 가리키므로, 문맥에 맞게 간결한 현대어 ‘천’으로 옮겼습니다.
- source_word: ἐξέτεινα
  english_pob_choice: I stretched
  chosen_korean: 펼쳐 놓았습니다
  alternatives_korean:
  - 펼쳤습니다
  - 늘였습니다
  - 펴 놓았습니다
  lexicon: ἐκτείνω
  rationale: 단순히 ‘늘이다’보다, 천을 특정 구조물에 걸어 펴는 동작을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ἑτέρῳ ξύλῳ ὀρθῷ
  english_pob_choice: another upright beam
  chosen_korean: 다른 곧은 나무
  alternatives_korean:
  - 다른 곧은 기둥
  - 또 다른 수직 목재
  - 다른 세운 나무
  lexicon: ἕτερος + ξύλον + ὀρθός
  rationale: ξύλον은 기본적으로 ‘나무/목재’를 뜻하므로, 구조물의 재료감을 살리기 위해 ‘나무’로 두고 ὀρθῷ는 ‘곧은’으로 옮겼습니다.
- source_word: ἐν μέσῳ
  english_pob_choice: in the middle
  chosen_korean: 가운데에
  alternatives_korean:
  - 중간에
  - 한가운데에
  - 중앙에
  lexicon: μέσος
  rationale: 짧은 부사구로서 한국어에서도 가장 자연스럽고 직접적인 ‘가운데에’를 선택했습니다.
