base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003.yaml
  text: 1[a]. Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph. 2. And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly. 3. Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every wickedness of affliction, they will certainly not rule over you, just as they did not over Joseph my brother. 4. How many men wanted to kill him, yet God sheltered him[b]. For the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God. 5. And he cannot be mastered by the plots of men or of beasts, since the Lord helps him through the love that he has toward his neighbor. 6. For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him. 7. And thus Jacob cried out,
    “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, for two hours he kept kissing him, saying, 8. “The heavenly prophecy will be fulfilled upon you.”
  footnotes:
  - marker: a
    text: Some witnesses expand verse 5 with wording about beasts or an 'aerial spirit,' reflecting textual instability in the description of hostile powers.
    reason: textual_variant
  - marker: b
    text: Or 'The prophecy from heaven will be fulfilled concerning you.' The prepositional wording varies slightly in the witnesses.
    reason: alternative_reading
translation:
  language: ko
  text: 1. 그러므로 이제, 내 자녀들아, 너희도 하늘과 땅의 하나님이신 주를 사랑하고, 그의 계명들을 지키며, 선하고 거룩한 사람 요셉을 본받으십시오. 2. 너희 마음은 선한 것에 두십시오. 너희가 내 마음이 그러하다는 것을 알듯이 말입니다. 바른 마음을 가진 사람은 모든 것을 바르게 봅니다. 3. 주를 두려워하고 이웃을 사랑하십시오. 그리고 벨리알의 영들이 너희를 온갖 악한 고통 속으로 몰아넣더라도, 그들이 너희를 결코 지배하지 못할 것입니다. 요셉 내 형제에게 그들이 그러하지 못했던 것과 같습니다. 4. 얼마나 많은 사람들이 그를 죽이려 했는지요. 그러나 하나님께서 그를 덮어 주셨습니다. 하나님을 두려워하고 이웃을 사랑하는 사람은 벨리알의 영에게 맞아 넘어질 수 없으며, 하나님의 두려움 아래 덮여 있기 때문입니다. 5. 또 그는 사람이나 짐승의 음모에도 지배당할 수 없습니다. 주께서 그가 이웃을 향해 가진 사랑을 통해 그를 도우시기 때문입니다. 6. 요셉은 또한 우리 아버지께 자기 형제들을 위해 기도해 달라고 간청하여, 그들이 자기에게 악을 행했기 때문에 주께서 그들에게 죄를 묻지 않게 해 달라고 했습니다. 7. 그러자 야곱이 이렇게 외쳤습니다. 「오, 좋은 자녀야, 너는 네 아버지 야곱의 깊은 사랑을 움직였구나」라고 하였고, 그를 껴안고 두 시간 동안 입을 맞추며 말했습니다. 8. 「하늘의 예언이 너에게 이루어질 것입니다.」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  english_pob_choice: love
  chosen_korean: 사랑하십시오
  alternatives_korean:
  - 사랑하세요
  - 애정을 가지십시오
  lexicon: BDAG
  rationale: 주문의 핵심 윤리 동사로서 직역적이면서도 자연스러운 표준어 공손형을 택했습니다.
- source_word: φυλάξατε ἐντολάς
  english_pob_choice: keep his commandments
  chosen_korean: 그의 계명들을 지키며
  alternatives_korean:
  - 그의 계명들을 보존하며
  - 그의 계명들을 준수하며
  lexicon: BDAG
  rationale: ‘지키다’가 계명 준수의 성경적 용례를 가장 자연스럽게 살립니다.
- source_word: μιμούμενοι
  english_pob_choice: imitating
  chosen_korean: 본받으십시오
  alternatives_korean:
  - 모범으로 삼으십시오
  - 따르십시오
  lexicon: BDAG
  rationale: 권면 문맥에서 도덕적 모방을 간결하게 전하는 한국어 관용 표현입니다.
- source_word: διάνοια / εἰς τὸ ἀγαθόν / ὀρθὴν ... ὀρθῶς
  english_pob_choice: mind ... set on what is good ... right mind ... rightly
  chosen_korean: 마음 / 선한 것에 두십시오 / 바른 마음 / 바르게
  alternatives_korean:
  - 생각 / 좋은 것에 두십시오 / 올바른 생각 / 올바르게
  - 뜻 / 선한 데 두십시오 / 바른 뜻 / 바르게
  lexicon: BDAG
  rationale: 반복되는 내적 지향과 판단의 대비를 한국어의 ‘마음/바르다/바르게’로 일관되게 살렸습니다.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  english_pob_choice: the spirits of Beliar
  chosen_korean: 벨리알의 영들
  alternatives_korean:
  - 벨리알의 악한 영들
  - 베리아르의 영들
  lexicon: BDAG
  rationale: 원문 고유명 Βελίαρ를 음역해 묵시문헌적 표현을 유지했습니다.
- source_word: ἐκστήσωσι / κατακυριεύσωσιν
  english_pob_choice: drive ... rule over
  chosen_korean: 몰아넣더라도 ... 지배하지 못할 것입니다
  alternatives_korean:
  - 몰아가더라도 ... 다스리지 못할 것입니다
  - 혼미하게 하더라도 ... 군림하지 못할 것입니다
  lexicon: BDAG
  rationale: 강압적 영적 압박과 지배의 의미를 자연스럽게 드러내되 과도한 심리화는 피했습니다.
- source_word: ἐσκέπασεν αὐτόν / σκεπαζόμενος
  english_pob_choice: sheltered him / being sheltered
  chosen_korean: 그를 덮어 주셨습니다 / 덮여 있기 때문입니다
  alternatives_korean:
  - 그를 보호하셨습니다 / 보호받고 있기 때문입니다
  - 그를 감싸 주셨습니다 / 감싸여 있기 때문입니다
  lexicon: BDAG
  rationale: 보호의 은유를 살리되, 반복되는 ‘덮다’ 계열 표현으로 본문의 이미지 연결을 유지했습니다.
- source_word: σπλάγχνα
  english_pob_choice: inward affection
  chosen_korean: 깊은 사랑
  alternatives_korean:
  - 내장 깊은 애정
  - 속마음
  lexicon: BDAG
  rationale: 직역의 거친 느낌을 줄이면서도 강한 내적 정념을 잃지 않는 표현으로 다듬었습니다.
- source_word: λογίσηται ... ἁμαρτίαν
  english_pob_choice: would not reckon sin
  chosen_korean: 죄를 묻지 않게 해 달라고
  alternatives_korean:
  - 죄로 계산하지 않게 해 달라고
  - 죄로 여기지 않게 해 달라고
  lexicon: BDAG
  rationale: 회계적 이미지 ‘reckon’을 한국어에서 자연스러운 법정·청산 뉘앙스로 옮겼습니다.
- source_word: προφητεία οὐράνιος
  english_pob_choice: the heavenly prophecy
  chosen_korean: 하늘의 예언
  alternatives_korean:
  - 하늘로부터의 예언
  - 천상의 예언
  lexicon: BDAG
  rationale: 공적이고 장엄한 예언 표현을 간결하게 옮겼습니다.
theological_decisions:
- issue: 벨리알의 영들과 하나님의 보호의 관계
  chosen_reading: 악한 영들의 공격이 वास्तविक하지만, 하나님을 두려워하는 삶이 그 공격을 막는 보호의 장이 된다고 표현했습니다.
  alternative_readings:
  - 심리적 유혹만을 뜻한다고 완화하는 읽기
  - 단순한 도덕적 경고로만 축소하는 읽기
  rationale: 본문의 영적 실재성을 지우지 않고, 원문의 보호 은유(‘덮다’)를 그대로 살렸습니다.
  doctrine_reference: 원문 이미지와 묵시문학적 영적 전투 어휘 유지
- issue: 7–8절 인용부의 호칭과 문체
  chosen_reading: 직접 화법은 원문의 정서적 호소를 따라 ‘오, 좋은 자녀야’로 옮기고, 예언 선언은 장엄한 미래형으로 처리했습니다.
  alternative_readings:
  - 더 평이한 서술체로 완화하는 읽기
  - 현대 구어체로 낮추는 읽기
  rationale: 족장 전승 특유의 감정적·예언적 문체를 보존하기 위해 직접 인용의 리듬을 유지했습니다.
  doctrine_reference: 문체 보존과 화자 등록 유지
