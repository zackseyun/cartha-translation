review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 특히 5절의 현존 그리스어 본문은 손상된 구절(†ζῆν ἀπ᾽ αὐτῆς†)을 포함하며, 제시된 영어 감사본의 “the Lord helps him”은 그리스어 본문에 명시되지 않습니다. 초안의 ‘주께서 … 도우시기 때문’도 이를 따라 원문에 없는 주어를 보충합니다. 7절 ἐνίκησας는 단순히 ‘움직였다’보다 ‘사로잡았다/압도했다’의 결과를 나타내며, 4절 πληγῆναι는 ‘맞아 넘어지다’가 아니라 ‘맞다/해를 입다’입니다. 8절 뒤의 대괄호 부분은 본문 전승상 후대적 확장으로 보이는 자료이며 영어 POB 본문도 이를 싣지 않으므로, 본문에서는 제외하고 주석으로 처리하는 것이 안전합니다.
  naturalness: 합쇼체와 문장 흐름은 대체로 좋지만, ‘하나님의 두려움 아래 덮여’는 한국어에서 부자연스럽습니다. ‘하나님을 두려워함으로 보호를 받기’가 자연스럽고 원문의 보호 비유도 충분히 전달합니다. ‘좋은 자녀야’는 요셉에게 하는 호칭으로 다소 어색하므로 ‘선한 아들아’가 문맥과 고전적 호소 문체에 더 맞습니다.
  terminology: ‘주’, ‘하나님’, ‘계명’, ‘이웃’, ‘벨리알’은 일관되게 유지했습니다. Βελίαρ의 음역은 초안의 ‘벨리알’을 유지하되, ‘벨리알의 영들’과 단수 ‘벨리알의 영’의 원문 사용을 구분했습니다. 5절의 난해하고 손상된 전승은 교리적으로 보충하지 않고 본문 및 주석에서 불확실성을 드러냈습니다.
  issues:
  - severity: high
    issue: 5절에 ‘주께서 … 도우시기 때문’이라는 내용을 넣음
    rationale: 제시된 그리스어에는 βοηθούμενος(‘도움을 받으며’)와 손상된 †ζῆν ἀπ᾽ αὐτῆς†만 있으며, ‘주’는 명시되어 있지 않습니다. 영어 감사본의 해석적 보충을 원문보다 우선할 수 없습니다.
  - severity: medium
    issue: 4절 ‘맞아 넘어질 수 없습니다’
    rationale: πληγῆναι는 ‘맞다, 타격을 입다’이며 ‘넘어지다’는 원문에 없는 결과를 덧붙입니다.
  - severity: medium
    issue: 7절 ἐνίκησας의 의미가 약화됨
    rationale: ‘깊은 사랑을 움직였다’보다 ‘아버지의 마음을 사로잡았다’가 νικάω의 승리·압도의 어감을 더 잘 전달합니다.
  - severity: medium
    issue: 각주 표지가 8절에 함께 붙어 있어 내용과 맞지 않음
    rationale: 전승 불안정에 관한 주석은 5절의 손상된 구절에, ‘upon/concerning you’의 전치사 차이에 관한 주석은 8절의 해당 구절에 각각 붙여야 합니다.
  revised_text: '1. 그러므로 이제, 내 자녀들아, 너희도 하늘과 땅의 하나님이신 주를 사랑하고 그의 계명들을 지키며, 선하고 거룩한 사람 요셉을 본받으십시오.


    2. 너희 마음을 선한 것에 두십시오. 너희가 내 마음도 그러함을 알고 있는 것과 같이 하십시오. 바른 마음을 가진 사람은 모든 것을 바르게 봅니다.


    3. 주를 두려워하고 이웃을 사랑하십시오. 벨리알의 영들이 너희를 고난의 온갖 악으로 몰아넣더라도, 그들은 결코 너희를 지배하지 못할 것입니다. 요셉, 내 형제를 지배하지 못했던 것과 같습니다.


    4. 얼마나 많은 사람이 그를 죽이려 하였습니까? 그러나 하나님께서 그를 보호하셨습니다. 하나님을 두려워하고 이웃을 사랑하는 사람은 벨리알의 영에게 해를 입을 수 없습니다. 하나님을 두려워함으로 보호를 받기 때문입니다.


    5. 또 그는 사람이나 짐승의 계략에도 지배당할 수 없습니다. 그가 이웃을 향하여 가진 사랑으로 도움을 받아 살아가기 때문입니다.[a]


    6. 요셉도 우리 아버지께 자기 형제들을 위하여 기도해 달라고 간청했습니다. 그들이 자기에게 악을 행하였으므로, 주께서 그들에게 죄를 묻지 않게 해 달라는 것이었습니다.


    7. 그러자 야곱이 이렇게 외쳤습니다. “오, 선한 아들아, 네가 네 아버지 야곱의 마음을 사로잡았구나.” 그리고 야곱은 그를 껴안고 두 시간 동안 계속 입을 맞추며 말했습니다.


