source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/002.yaml
  text: 'And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.'
translation:
  language: ko
  text: 그리고 칼은 일곱 가지 악의 어머니입니다. 먼저 마음이 벨리알을 통하여 잉태하며, 그 낳은 것들은 이렇습니다. 첫째는 시기, 둘째는 멸망, 셋째는 환난, 넷째는 포로 됨, 다섯째는 궁핍, 여섯째는 혼란, 일곱째는 황폐입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ δὲ μάχαιρα … μήτηρ ἐστί
  english_pob_choice: And the sword is the mother of seven evils.
  chosen_korean: “칼은 일곱 가지 악의 어머니입니다”
  alternatives_korean:
  - “칼은 일곱 악의 어머니입니다”
  - “칼은 일곱 가지 악을 낳는 어머니입니다”
  lexicon: μάχαιρα
  rationale: μάχαιρα는 문자 그대로 ‘칼/검’ 계열이지만, 문맥상 상징적 이미지로 기능하므로 한국어에서는 가장 직접적인 ‘칼’을 택했습니다. μήτηρ ἐστί는 은유를 살려 ‘어머니입니다’로 옮겼습니다.
- source_word: συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ
  english_pob_choice: the mind conceives through Beliar
  chosen_korean: “마음이 벨리알을 통해 잉태하고”
  alternatives_korean:
  - “생각이 벨리알을 통해 잉태하고”
  - “마음이 벨리알로 말미암아 품고”
  lexicon: διάνοια
  rationale: διάνοια는 ‘마음/생각/이해’의 범위를 가지지만, 여기서는 악의 발단이 내면에서 일어나는 점을 살려 ‘마음’으로 옮겼습니다. συλλαμβάνει는 단순히 ‘생각하다’보다 ‘잉태하다/품다’의 생명적 이미지를 유지하는 번역이 더 적합합니다.
- source_word: φθόνος, ἀπώλεια, θλῖψις, θεηλασία, ἔνδεια, ταραχή, ἐρήμωσις
  english_pob_choice: envy, destruction, affliction, captivity, want, turmoil, desolation
  chosen_korean: “시기, 멸망, 환난, 포로 됨, 궁핍, 소동, 황폐”
  alternatives_korean:
  - “질투, 파멸, 고난, 포로 상태, 결핍, 혼란, 황폐”
  - “시기, 파괴, 고통, 사로잡힘, 부족, 동요, 황무함”
  lexicon: φθόνος / ἀπώλεια / θλῖψις / θεηλασία / ἔνδεια / ταραχή / ἐρήμωσις
  rationale: 열거어는 영어 POB의 의미 흐름을 따르되, 한국어에서 대응이 비교적 안정적인 기본어를 사용했습니다. θεηλασία는 포로·노획의 뉘앙스가 있어 문맥상 ‘포로 됨’으로 옮기는 것이 가장 투명합니다.
theological_decisions:
- issue: 벨리알의 인격적/악의적 원인성
  chosen_reading: 벨리알을 악의 매개이자 내적 유혹의 통로로 보이게 하는 직역적 표현을 유지했습니다.
  alternative_readings:
  - 벨리알을 단순한 상징적 악으로 완화하는 번역
  - ‘사탄’으로 치환하는 번역
  rationale: 본문은 악이 ‘벨리알을 통해’ 잉태된다고 말하므로, 이를 일반화하거나 전통적 용어로 대체하면 원문의 인격적 악의 구조가 약해집니다.
  doctrine_reference: T12P 악의 기원/유혹 모티프
