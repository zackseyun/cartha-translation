  text: VII. ΓΔιὰ τοῦτο¹, τέκνα μου, Γλέγω ὑμῖν¹¹, φεύγετε τὴν κακίαν² †Γτοῦ Βελίαρ³ ὅτι μάχαιραν³ δίδωσιν⁴ τοῖς πειθομένοις αὐτόν⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/001.yaml
  text: Therefore, my children, I tell you, flee the evil of Beliar, because he gives a sword to those who obey him.
translation:
  language: ko
  text: 그러므로 내 자녀들아, 내가 너희에게 말합니다. 벨리아르의 악을 피하십시오. 그는 자기에게 순종하는 자들에게 칼을 줍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 직접적 호칭을 살리되, 합쇼체 본문에 맞게 자연스러운 부름말로 옮겼습니다.
- source_word: φεύγετε
  english_pob_choice: flee
  chosen_korean: 피하십시오
  alternatives_korean:
  - 도망하십시오
  - 피하시오
  lexicon: φεύγω
  rationale: 단순 회피보다 강한 ‘도피/회피’의 긴급성을 살리면서 현대 한국어 예문체로 다듬었습니다.
- source_word: τὴν κακίαν τοῦ Βελίαρ
  english_pob_choice: the evil of Beliar
  chosen_korean: 벨리아르의 악
  alternatives_korean:
  - 벨리아르의 악함
  - 벨리아르의 악한 것
  lexicon: κακία
  rationale: 악의 성격을 일반적 추상명사로 유지해 원문의 도덕적·영적 성격을 보존했습니다.
- source_word: πειθομένοις αὐτόν
  english_pob_choice: those who obey him
  chosen_korean: 자기에게 순종하는 자들
  alternatives_korean:
  - 그에게 복종하는 자들
  - 그 말을 따르는 자들
  lexicon: πείθω
  rationale: πειθομένοις는 ‘설득을 받아 따르다/순종하다’의 뉘앙스를 가지므로, 단순 복종보다 관계적 순응을 드러내는 ‘순종하다’를 택했습니다.
theological_decisions:
- issue: Βελίαρ 이름의 음역과 악의 주체성
  chosen_reading: ‘벨리아르’로 음역해 인격적 악의 세력을 그대로 드러냈습니다.
  alternative_readings:
  - 벨리알
  - 벨리아르(벨리알)
  rationale: 본문은 추상적 악이 아니라 특정한 악의 주체를 가리키므로, 전통적 교회어를 무리하게 대체하지 않고 음역을 유지했습니다.
  doctrine_reference: Second Temple Jewish demonology / 악의 인격화
