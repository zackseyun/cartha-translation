  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διὰ τοῦτο καὶ¹⁸ ὁ Κάϊν ἑπτὰ ἐκδικίαις¹⁹ παρεδόθη²⁰ ὑπὸ τοῦ Θεοῦ²¹. *κατὰ γὰρ²² ἑκατοστὸν ἔτος²³ μίαν πληγὴν ἐπήγαγεν *ἐπʼ αὐτὸν²⁴ ⸀Κύριος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/003.yaml
  text: Because of this also, Cain was handed over by God to seven acts of vengeance. For every hundredth year the Lord brought one plague upon him.
translation:
  language: ko
  text: 이 때문에 가인도 하나님께 일곱 가지 보복에 넘겨졌습니다. 이는 백 년마다 주님께서 그에게 한 재앙을 내리셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὸ τοῦ Θεοῦ
  english_pob_choice: by God
  chosen_korean: 하나님께
  alternatives_korean:
  - 하나님으로부터
  - 하나님에 의해
  lexicon: Θεός
  rationale: 수동문의 행위자를 한국어로 자연스럽게 드러내되, 원문의 행위 주체가 하나님임을 분명히 하기 위해 여격형으로 옮겼습니다.
- source_word: ἑπτὰ ἐκδικίαις
  english_pob_choice: seven acts of vengeance
  chosen_korean: 일곱 가지 보복
  alternatives_korean:
  - 일곱 보복들
  - 일곱 번의 보복
  lexicon: ἐκδίκησις
  rationale: 복수형과 수량 표현을 살리면서도, 한국어에서 어색한 직역을 피하고 보복의 연속적/복합적 성격을 나타냈습니다.
- source_word: κατὰ γὰρ ἑκατοστὸν ἔτος
  english_pob_choice: For every hundredth year
  chosen_korean: 백 년마다
  alternatives_korean:
  - 매 백 년마다
  - 백 번째 해마다
  lexicon: ἑκατοστός
  rationale: κατά + 서수의 반복 의미를 한국어의 관용적 시간 표현으로 자연스럽게 재현했습니다.
- source_word: μίαν πληγὴν ἐπήγαγεν
  english_pob_choice: brought one plague upon him
  chosen_korean: 한 재앙을 내리셨습니다
  alternatives_korean:
  - 한 재앙을 가져오셨습니다
  - 한 재앙을 그에게 내리셨습니다
  lexicon: πληγή
  rationale: πληγή의 구체적 의미 범위를 고려해 ‘재앙’으로 옮겼고, 동사의 방향성을 살려 ‘내리다’로 표현했습니다.
theological_decisions:
- issue: The divine agent is explicit in the Greek passive clause and the following clause naming the Lord.
  chosen_reading: 첫 절에서는 하나님을 행위 주체로, 다음 절에서는 주님을 재앙의 주체로 분명히 옮겼습니다.
  alternative_readings:
  - 첫 절과 둘째 절 모두 ‘주님’으로 통일
  - 첫 절을 무주어 수동으로 처리
  rationale: 원문은 ὑπὸ τοῦ Θεοῦ와 Κύριος를 구분하여 제시하므로, 두 표현을 모두 살리되 한국어에서 중복이 과도하지 않도록 분리해 번역했습니다.
  doctrine_reference: 서술의 주체 구분 보존
