  - severity: medium
    issue: ‘시기와 형제 미움 가운데 있는 이들’
    rationale: ἐπὶ φθόνῳ καὶ μισαδελφίᾳ는 가인을 닮게 되는 영역/근거를 나타냅니다. 단순히 그러한 상태에 ‘있는’ 사람이라고 하면 가인과의 유사 관계가 약해집니다.
  - severity: low
