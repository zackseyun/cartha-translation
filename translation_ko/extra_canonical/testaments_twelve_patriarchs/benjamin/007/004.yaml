revisions:
- from: 그는 이백 년 동안 고통을 겪고, 구백 년째에는 황폐하게 되었습니다. 아벨 그의 형제를 두고는 모든 악한 일들 가운데서 심판을 받았으나, 라멕은 일흔 번씩 일곱 번에 이르렀습니다. 이는 세상 끝까지, 가인과 같이 되어 시기와 형제 미움 가운데 있는 이들이 그와 같은 심판으로 벌을 받을 것이기 때문입니다.[a][b]
  to: 그는 이백 년 동안 고통을 겪고, 구백째 해에는 황폐하게 됩니다. 그의 형제 아벨 때문에 그는 온갖 악으로 심판을 받았으나, 라멕은 일흔 곱하기 일곱으로 심판을 받았습니다. 이는 시대의 끝까지 시기와 형제 미움에서 가인과 같이 되는 이들이 이와 같은 심판으로 벌을 받을 것이기 때문입니다.
  rationale: 원문의 문법적 관계와 시제를 바로잡고, 라멕 절의 생략된 서술어는 바로 앞의 ‘심판을 받다’에 근거해 최소한으로 보충했습니다. ‘일흔 곱하기 일곱’은 ἑβδομηκοντάκις ἑπτά의 수량 표현을 해석적으로 확장하지 않고 보존했습니다. 제공된 자료에 대응 각주 내용이 없으므로 미연결 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
