id: T12P.BEN.7.4
reference: Testament of Benjamin 7:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διακοσίων ἐτῶν πάσχει, καὶ ἐννακοσιοστῷ²⁶ ἔτει ἐρημοῦται²⁷· διὰ γὰρ Ἄβελ τὸν ἀδελφὸν αὐτοῦ * ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο, ὁ δὲ Λαμὲχ ἐν ἑβδομηκοντάκις ἑπτά. Ὅτι³⁶ *ἕως τοῦ αἰῶνος³⁷ οἱ ὁμοιούμενοι *τῷ Καὶν³⁸ Γ*ἐπὶ φθόνῳ καὶ μισαδελφίᾳ τοιαύτῃ⁷ κολασθήσονται Γκρίσει⁷³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/004.yaml
  text: For two hundred years he suffers, and in the nine-hundredth year he was made desolate; for because of Abel his brother he was judged in all evils, but Lamech in seventy times seven. Because to the end of the age, those who become like Cain in envy and hatred of brothers will be punished with similar judgment.
translation:
  language: ko
  text: 그는 이백 년 동안 고통을 겪고, 구백째 해에는 황폐하게 됩니다. 그의 형제 아벨 때문에 그는 온갖 악으로 심판을 받았으나, 라멕은 일흔 곱하기 일곱으로 심판을 받았습니다. 이는 시대의 끝까지 시기와 형제 미움에서 가인과 같이 되는 이들이 이와 같은 심판으로 벌을 받을 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων ἐτῶν πάσχει
  english_pob_choice: For two hundred years he suffers
  chosen_korean: 이백 년 동안 고통을 겪고
  alternatives_korean:
  - 이백 년 동안 고난을 당하고
  - 이백 년 동안 고통받고
  lexicon: Διακοσίων ἐτῶν / πάσχει
  rationale: 수량 표현은 자연스러운 시간 부사구로 옮기고, πάσχει는 단순한 ‘겪다’보다 고통의 지속을 드러내는 ‘고통을 겪다’로 옮겼습니다.
- source_word: ἐννακοσιοστῷ ἔτει ἐρημοῦται
  english_pob_choice: in the nine-hundredth year he was made desolate
  chosen_korean: 구백 년째에는 황폐하게 되었습니다
  alternatives_korean:
  - 구백째 해에는 황폐하게 되었습니다
  - 구백 년째에는 버림받아 황폐해졌습니다
  lexicon: ἐννακοσιοστῷ ἔτει / ἐρημοῦται
  rationale: ἐρημοῦται의 수동 의미를 살리되, 문맥상 ‘황폐하게 되다’가 가장 직접적이고 한국어로도 자연스럽습니다.
- source_word: ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο
  english_pob_choice: he was judged in all evils
  chosen_korean: 모든 악한 일들 가운데서 심판을 받았으나
  alternatives_korean:
  - 모든 악 가운데서 판결을 받았으나
  - 온갖 악 가운데서 정죄를 받았으나
  lexicon: ἐκρίνετο
  rationale: ἐκρίνετο는 단순 법정 판결보다 ‘심판/판정’의 폭이 있어, 앞뒤의 도덕적 대비를 살려 ‘심판을 받다’로 옮겼습니다.
- source_word: ἐπὶ φθόνῳ καὶ μισαδελφίᾳ
  english_pob_choice: in envy and hatred of brothers
  chosen_korean: 시기와 형제 미움 가운데
  alternatives_korean:
  - 시기와 형제를 미워함 가운데
  - 질투와 형제 미움 가운데
  lexicon: φθόνος / μισαδελφία
  rationale: μισαδελφία를 문자적으로 ‘형제 미움’으로 옮겨, 일반적 ‘미움’보다 형제 관계의 파괴를 드러냈습니다.
theological_decisions:
- issue: 가인과 라멕의 대조적 심판 전승을 어떻게 반영할지
  chosen_reading: 아벨 때문에 모든 악한 일들 가운데서 심판받은 가인과, 일흔 번씩 일곱 번과 연결된 라멕의 대조를 그대로 살렸습니다.
  alternative_readings:
  - 가인과 라멕을 일반적으로 ‘벌을 받았다’고 평탄화하는 번역
  - ‘판결’로만 번역해 도덕적 심판성을 약화시키는 번역
  rationale: 본문은 가인-라멕의 대비를 통해 죄와 보복의 정도를 병치하므로, 법정적 어휘와 도덕적 심판 어휘를 함께 유지했습니다.
  doctrine_reference: 창세기 4장 전승과 본문 내 윤리적 경고
- issue: Ὅτι ἕως τοῦ αἰῶνος의 종말론적 범위를 어떻게 번역할지
  chosen_reading: ‘이는 세상 끝까지’로 옮겨, 시간적 한계의 극단을 강조했습니다.
  alternative_readings:
  - ‘영원히’로 번역하는 방식
  - ‘세상 끝날까지’로 풀어 쓰는 방식
  rationale: ἕως τοῦ αἰῶνος는 단순 기간이 아니라 종말까지의 한계를 가리키므로, 자연스러운 한국어로 ‘세상 끝까지’가 가장 적절합니다.
  doctrine_reference: 종말론적 경고 표현
