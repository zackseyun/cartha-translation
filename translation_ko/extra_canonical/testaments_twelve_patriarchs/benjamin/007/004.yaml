  verdict: revise
  source_fidelity: 현 번역은 핵심적인 기간과 가인·라멕의 대비를 대체로 반영하지만, ‘아벨 그의 형제를 두고는’은 διὰ γὰρ Ἄβελ τὸν ἀδελφὸν αὐτοῦ(‘그의 형제 아벨 때문에’)를 잘못 연결합니다. 또한 ἐρημοῦται는 현재형이므로 한국어에서도 현재/미래적 서술로 유지하는 편이 안전하며, ἐπὶ φθόνῳ καὶ μισαδελφίᾳ는 ‘가운데 있는’보다 시기와 형제 미움이라는 점에서 가인을 닮는다는 뜻으로 표현해야 합니다.
  naturalness: ‘아벨 그의 형제를 두고는’과 ‘일흔 번씩 일곱 번에 이르렀습니다’는 현대 표준 한국어로 부자연스럽고 문장 관계가 불명확합니다. 보충된 동사는 앞 문맥의 ‘심판을 받다’를 따라 최소한으로 보완했습니다.
  terminology: κρίσις/ἐκρίνετο는 각각 ‘심판’ 및 ‘심판을 받다’로 일관되게 옮겼습니다. μισαδελφία는 관계 대상을 보존하여 ‘형제 미움’으로 유지했습니다. ἕως τοῦ αἰῶνος는 특정 교리적 의미를 부가하지 않고 ‘시대의 끝까지’로 옮겼습니다.
