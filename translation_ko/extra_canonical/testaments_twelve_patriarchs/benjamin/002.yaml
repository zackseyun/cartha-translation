base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002.yaml
  text: '1 And when we went down into Egypt[a], Joseph my brother recognized me and said to me, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”

    2 And he said to me, “Yes, brother. For when the Ishmaelites took me, one of them stripped me of my tunic and gave me a loincloth; and after flogging me, he told me to run.

    3 And while he was going away to hide my garment, a lion met him and killed him.

    4 So his companions, being afraid, sold me to others of their company.

    5 Thus Joseph did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.

    6 And he called his brothers to himself and said,

    7 ‘Do not tell my father what you did to me, but speak in this way, just as I explained it to Benjamin.

    8 And let such thoughts be in you[b][c][d], and let not the words come…’'
  footnotes:
  - marker: a
    text: Some witnesses read more explicitly, “They sent it and said, ‘See whether this is your son’s tunic.’”
    reason: textual_variant
    anchor_ref: '2:1'
  - marker: d
    text: Other witnesses phrase the event differently, but all preserve the sense that the man handling Joseph's garment was killed by a wild beast, commonly a lion.
    reason: textual_variant
    anchor_ref: '2:3'
  - marker: c
    text: Some manuscripts read that they sold him to Ishmaelites; others, as here, to other traders of their company.
    reason: textual_variant
    anchor_ref: '2:4'
  - marker: b
    text: The Greek text breaks off here. The unfinished sentence has been left incomplete rather than reconstructed.
    reason: textual_variant
    anchor_ref: '2:8'
translation:
  language: ko
  text: '그런데 우리가 이집트에 내려갔을 때, 내 형 요셉이 나를 알아보고 나에게 말했습니다. “그들이 네 겉옷에 피를 묻혀 놓고 이렇게 말했습니다. ‘이것이 네 아들의 겉옷인지 보아라.’”


    그리고 그는 나에게 말했습니다. “그렇다, 형제여. 이스마엘 사람들이 나를 데려갔을 때, 그들 가운데 한 사람이 내 겉옷을 벗기고 허리천을 주었으며, 나를 채찍질한 뒤 달려가라고 말했습니다.


    그리고 그가 내 옷을 숨기려고 가는 동안, 한 사자가 그를 만나 그를 죽였습니다.


    그래서 그의 동료들은 두려워하여 나를 그들 무리의 다른 사람들에게 팔았습니다.


    이렇게 요셉은 이런 말을 하면서 거짓말을 하지 않았습니다. 그는 우리 형제들의 행위를 나에게서 숨기려 했기 때문입니다.


    그리고 그는 자기 형제들을 자기에게 불러 모아 말했습니다.


    “내 아버지에게 내가 받은 일을 말하지 마십시오. 다만 내가 베냐민에게 설명한 것처럼 이렇게 말하십시오.


    그리고 이런 생각이 여러분 안에 있게 하십시오[b][c][d], 그리고 그 말들이…[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώρισέν με
  english_pob_choice: recognized me
  chosen_korean: 나를 알아보고
  alternatives_korean:
  - 나를 알아차리고
  - 나를 알아본 뒤
  lexicon: LSJ
  rationale: 상호 인식의 장면을 자연스럽게 살리면서, 단순한 ‘알다’보다 개인 식별의 의미를 드러내는 표현으로 옮겼습니다.
- source_word: ἔφυραν τὸν χιτῶνά σου αἵματι
  english_pob_choice: smeared your tunic with blood
  chosen_korean: 네 겉옷에 피를 묻혀 놓고
  alternatives_korean:
  - 네 겉옷을 피로 더럽혀 놓고
  - 네 겉옷에 피를 칠해 놓고
  lexicon: LSJ
  rationale: ‘섞다/반죽하다’의 직역보다 문맥상 피를 옷에 바르거나 묻히는 동작이므로, 물리적 접촉의 생생함을 유지하는 방향으로 옮겼습니다.
- source_word: χιτών
  english_pob_choice: tunic
  chosen_korean: 겉옷
  alternatives_korean:
  - 속옷
  - 튠닉
  lexicon: LSJ
  rationale: 고대 의복 명칭을 한국어로 읽기 쉽게 풀되, 이야기 흐름에서 특정 종류의 옷이라는 점이 드러나도록 ‘겉옷’을 택했습니다.
- source_word: περίζωμα
  english_pob_choice: loincloth
  chosen_korean: 허리천
  alternatives_korean:
  - 요천
  - 허리띠
  lexicon: LSJ
  rationale: 허리 둘레에 두르는 천이라는 뜻을 직접 살리면서도 현대 한국어에서 과도하게 낯설지 않은 표현으로 옮겼습니다.
- source_word: ὑπήντησεν αὐτῷ λέων καὶ ἀνεῖλεν αὐτόν
  english_pob_choice: a lion met him and killed him
  chosen_korean: 한 사자가 그를 만나 그를 죽였습니다
  alternatives_korean:
  - 한 사자가 그에게 달려들어 죽였습니다
  - 한 사자가 그를 만나 죽였습니다
  lexicon: LSJ
  rationale: 직역에 가깝게 ‘만나다’와 ‘죽이다’의 연쇄를 유지하여, 사건의 돌발성과 서술의 단순함을 살렸습니다.
- source_word: μέτοχοι
  english_pob_choice: companions
  chosen_korean: 동료들
  alternatives_korean:
  - 동무들
  - 동반자들
  lexicon: LSJ
  rationale: 상업 여행 집단의 동료라는 맥락을 반영해, 자연스럽고 중립적인 관계어로 처리했습니다.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  english_pob_choice: the deeds of our brothers
  chosen_korean: 우리 형제들의 행위
  alternatives_korean:
  - 우리 형제들의 일
  - 우리 형제들이 한 일
  lexicon: LSJ
  rationale: ἔργα의 도덕적·서사적 무게를 살려 ‘행위’로 옮겼고, ‘우리 형제들’은 관계의 당사성을 유지합니다.
- source_word: ἐξηγησάμην
  english_pob_choice: I explained
  chosen_korean: 설명한
  alternatives_korean:
  - 말해 준
  - 자세히 이야기한
  lexicon: LSJ
  rationale: 베냐민에게 미리 풀어 말해 준 뉘앙스를 한국어의 ‘설명하다’로 가장 간결하게 살렸습니다.
theological_decisions:
- issue: 본문의 파편적 결말(8절)
  chosen_reading: 마지막 문장은 완결하지 않고 한국어도 중간에서 끊어 두었습니다.
  alternative_readings:
  - 의미를 보충해 매끈하게 완결하는 번역
  - 추정되는 내용을 괄호로 덧붙이는 번역
  rationale: 제시된 그리스어가 명백히 미완성 상태이므로, 번역에서 임의로 완성하지 않고 끊긴 형태를 보존해야 원문 증거를 숨기지 않습니다.
  doctrine_reference: 'POB 원칙: 원문 우선과 투명한 본문 재현'
- issue: 요셉이 형제들의 죄를 숨기려 했다는 진술
  chosen_reading: ‘우리 형제들의 행위’가 드러나지 않도록 하려는 의도를 분명히 반영했습니다.
  alternative_readings:
  - 단순히 사실을 전하는 표현
  - 은폐 의도를 약화시키는 표현
  rationale: ἤθελεν γὰρ κρύπτειν ἀπʼ ἐμοῦ를 그대로 살려, 요셉의 자비와 절제라는 서술적 의도를 보존했습니다.
  doctrine_reference: 서사 윤리와 본문 의미 보존
