review_pass:
  verdict: revise
  source_fidelity: 현 초안은 영어 POB의 이문 선택을 주로 따르면서 제시된 그리스어 본문과 몇 차례 어긋납니다. 특히 3절은 ‘그들 가운데 한 사람’이 아니라 복수 주어가 요셉을 이스마엘 사람들에게 넘겼다고 하며, 4절은 옷을 숨기러 가던 사람이 아니라 막대기로 요셉을 때리던 사람이 사자에게 죽임을 당합니다. 5절 후반은 제시 본문 자체가 훼손되어 있으므로 ‘다른 동료들에게 팔았다’로 확정할 수 없습니다. 6절의 주어도 그리스어는 복수(‘그들은 거짓말하지 않았다’)입니다. 반대로 8절은 제시된 그리스어에서는 미완성이 아니라 아버지의 마음에 말들이 이르지 않게 하라는 절까지 남아 있습니다.
  naturalness: 합쇼체 서술과 인용문의 높임말은 대체로 자연스럽습니다. 다만 ‘내가 받은 일을 말하지 마십시오’는 ‘내게 한 일을 말하지 마십시오’라는 원문 의미를 바꾸며, ‘그 말들이…’라는 미완성은 이 소스에 맞지 않습니다. ‘겉옷’은 χιτών의 의복 층위를 다소 특정하므로, 보다 중립적인 ‘옷’이 안전합니다.
  terminology: ‘허리천’, ‘사자’, ‘이스마엘 사람들’, ‘베냐민’은 적절합니다. χιτών은 문맥상 반복되는 동일한 의복을 가리키므로 ‘옷’으로 일관되게 옮겼습니다. 본문이 전승상 불안정한 2절의 ‘네 아들의 옷’과 5절의 훼손 부분은 각주로 투명하게 밝혔습니다.
  issues:
  - severity: high
    issue: 3–5절이 제시된 그리스어 본문이 아니라 영어 POB가 채택한 다른 이문을 번역합니다.
    rationale: 그리스어 3절은 복수 주어가 요셉을 이스마엘 사람들에게 넘겼다고 하고, 4절은 막대기로 그를 때리던 사람이 사자에게 죽임을 당했다고 합니다. 5절 후반은 훼손되어 판매 행위를 확정할 수 없습니다.
  - severity: high
    issue: 6절의 주어가 ‘요셉’으로 단수화되었습니다.
    rationale: 본문은 οὐκ ἐψεύσαντο αὐτοὶ(‘그들은 거짓말하지 않았다’)라고 복수형을 사용합니다. 뒤의 ‘그가’는 요셉을 가리키지만, 앞 절의 복수 주어를 단수로 바꾸어서는 안 됩니다.
  - severity: high
    issue: 7절의 ‘내가 받은 일’은 ‘내게 한 일’을 뜻하는 원문 ἃ ἐποιήσατέ μοι를 바꿉니다.
    rationale: 형제들이 요셉에게 행한 일을 아버지에게 알리지 말라는 명령입니다.
  - severity: high
    issue: 8절을 미완성으로 처리하고 영어 각주 표지를 잘못 배치했습니다.
    rationale: 제시된 그리스어는 ‘이 말들이 내 아버지의 마음에 이르지 않게 하라’까지 보존합니다. 따라서 줄임표 및 원문의 8절 단절 각주는 적용할 수 없습니다.
  - severity: medium
    issue: 2절의 ‘네 아들의 옷’은 제공된 그리스어의 불안정한 구절을 평문으로 확정합니다.
    rationale: 창세기 37장의 표현 및 일부 전승이 이를 뒷받침하지만, 제공 본문은 해당 부분이 비정상적입니다. 각주로 이문/본문 상태를 밝혀야 합니다.
  revised_text: '2 그런데 우리가 이집트에 내려갔을 때, 내 형 요셉이 나를 알아보고 내게 말했습니다. “그들이 네 옷에 피를 묻히고 말하기를, ‘이것이 네 아들의 옷인지 알아보아라’ 하였다.”[a]


    3 그가 내게 말했습니다. “그렇습니다, 형제여. 그들이 내 옷을 벗기고 나를 이스마엘 사람들에게 넘겼을 때, 내게 허리천을 주었습니다. 그리고 나를 채찍질하고는 달려가라고 말했습니다.


    4 그들 가운데 한 사람이 막대기로 나를 때리고 있었는데, 사자가 그를 만나 죽였습니다.


    5 그러자 그의 동료들은 두려워하였습니다.[b]


    6 그들이 이런 말을 한 것은 거짓이 아니었습니다. 그가 우리 형제들이 한 일을 내게 숨기고 싶어 했기 때문입니다. 그리고 그는 자기 형제들을 불러 자기에게 오게 하고 말했습니다.


    7 ‘너희가 내게 한 일을 내 아버지께 말하지 말고, 내가 베냐민에게 설명한 대로 이렇게 말하여라.


    8 너희 안에 이러한 생각이 있게 하고, 이 말들이 내 아버지의 마음에 이르지 않게 하여라.’'
  revised_footnotes:
  - marker: a
    text: ‘이것이 네 아들의 옷인지’라는 말은 창세기 37:32와 일치하며 일부 전승에서 명시적으로 보입니다. 그러나 제시된 그리스어 본문의 해당 구절은 문법적으로 불안정합니다.
    reason: textual_variant
  - marker: b
    text: 제시된 그리스어 본문은 ‘그의 동료들은 두려워하여’ 뒤의 구절(ἀνέσει με κατέσχεν)이 훼손되었거나 의미가 불확실합니다. 다른 전승에는 그들이 요셉을 다른 동료들에게 팔았다는 형태가 있으나, 여기서는 그 내용을 본문에 보충하지 않았습니다.
    reason: textual_variant
  revision_rationale: 원문 우선 원칙에 따라, 영어 POB의 이문 기반 서술 대신 제공된 그리스어의 주어·행위·문장 완결성을 반영했습니다. 5절의 훼손된 구절은 추정 번역으로 메우지 않고 각주에서만 설명했습니다. 2절의 불안정한 표현은 널리 알려진 전승을 따라 번역하되 본문 상태를 각주로 밝혔습니다. 모든 문장은 현대 표준 한국어의 공식적 합쇼체로 다듬었습니다.
