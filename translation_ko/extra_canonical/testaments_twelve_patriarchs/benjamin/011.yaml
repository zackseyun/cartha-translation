base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011.yaml
  text: '1 No longer shall I be called a ravening wolf because of your ravaging[a], but a worker of the Lord, distributing food to those who do what is good.

    2 And in the last times there shall arise from my seed one beloved of the Lord, hearing his voice and doing the good pleasure of his will, enlightening all the nations with new knowledge, entering upon Israel in salvation, and snatching away from them as a wolf, and giving to the gathering of the nations.

    3 Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.

    4 And in holy books he shall be recorded, both his work and his word; and he shall be God''s chosen one forever.

    5 And through him he shall pass through again as Jacob my father, saying[e][d][c][b], “He will fill up what is lacking in your tribe.”'
  footnotes:
  - marker: a
    text: The Greek of this chapter is textually difficult, especially in verse 2, where the witness appears expanded and partially duplicated. The translation follows the extant Greek while preserving its ambiguities.
    reason: textual_variant
  - marker: b
    text: Or 'intervening in Israel with salvation' for 'entering upon Israel in salvation.'
    reason: lexical_alternative
  - marker: c
    text: Or 'assembly of the nations' for 'gathering of the nations.'
    reason: lexical_alternative
  - marker: d
    text: '''Until the consummation of the age'' may also be rendered ''until the end of the age.'''
    reason: lexical_alternative
  - marker: e
    text: The final line is obscure. 'Through him he shall pass through again as Jacob my father' may reflect a promise of renewed visitation or representation through the future figure.
    reason: textual_variant
translation:
  language: ko
  text: '1 이제 나는 너희의 약탈 때문에 ‘포악한 늑대’라 불리지 않고, 주님의 일꾼으로서 선한 일을 하는 이들에게 양식을 나누어 주는 자라 불릴 것입니다.


    2 그리고 마지막 때에 내 씨에서 주님께 사랑받는 이가 일어날 것이니, 그는 그의 음성을 듣고 그의 뜻의 선한 기쁨을 행하며, 모든 민족에게 새 지식의 빛을 비추고, 이스라엘 위로 와서 구원으로 역사하며, 늑대처럼 그들에게서 낚아채고, 민족들의 모임에 넘겨 줄 것입니다.


    3 세상의 끝에 이를 때까지 그는 민족들의 회중과 그들의 통치자들 가운데 있을 것이며, 모든 이의 입에 있는 음악적 선율과 같을 것입니다.


    4 그리고 거룩한 책들에 그의 일과 그의 말이 기록될 것이며, 그는 영원히 하나님께 선택받은 이가 될 것입니다.


    5 그리고 그를 통해 내 아버지 야곱처럼 다시 지나갈 것이며, “그는 네 지파에서 부족한 것을 채울 것입니다.”라고 말할 것입니다.[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύκος ἅρπαξ / ἁρπαγὰς
  english_pob_choice: ravening wolf / ravaging
  chosen_korean: ‘포악한 늑대’ / ‘약탈’
  alternatives_korean:
  - ‘탐욕스런 늑대’ / ‘노략’
  - ‘사나운 늑대’ / ‘빼앗음’
  lexicon: LSJ
  rationale: 늑대 이미지와 약탈의 폭력을 함께 살리기 위해 ‘포악한’과 ‘약탈’을 택했고, 단순히 ‘사나운 사람’으로 완화하지 않았습니다.
- source_word: ἐργάτης Κυρίου
  english_pob_choice: worker of the Lord
  chosen_korean: 주님의 일꾼
  alternatives_korean:
  - 주님의 노동자
  - 주님의 종
  lexicon: BDAG
  rationale: ἐργάτης의 실제적인 ‘일하는 자’라는 뜻을 살리되, 한국어에서 자연스러운 종교적 표현을 사용했습니다.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  english_pob_choice: coming upon Israel in salvation
  chosen_korean: 이스라엘 위로 와서 구원으로 역사하며
  alternatives_korean:
  - 이스라엘에 구원으로 들어와
  - 이스라엘 위에 구원으로 개입하며
  lexicon: LSJ
  rationale: 본문의 난해한 동작성을 보존하려고 ‘위로 와서’와 ‘역사하며’를 결합해, 구원의 도래와 개입의 뉘앙스를 함께 반영했습니다.
- source_word: συναγωγῇ τῶν ἐθνῶν
  english_pob_choice: gathering of the nations
  chosen_korean: 민족들의 모임
  alternatives_korean:
  - 민족들의 집회
  - 민족들의 집합
  lexicon: LSJ
  rationale: ‘gathering’의 집합적 의미를 살리면서도, 교회 제도 용어로 오해될 수 있는 표현은 피했습니다.
- source_word: συναγωγαῖς ἐθνῶν
  english_pob_choice: assemblies of the nations
  chosen_korean: 민족들의 회중
  alternatives_korean:
  - 민족들의 모임들
  - 민족들의 집회들
  lexicon: LSJ
  rationale: 장소/공동체적 모임을 뜻하는 συναγωγαῖς를 한국어 ‘회중’으로 옮겨, 공개적 집단성을 살렸습니다.
- source_word: φοιτήσει
  english_pob_choice: he shall pass through again / visit
  chosen_korean: 다시 지나갈 것이며
  alternatives_korean:
  - 방문할 것이며
  - 지나가며 나타날 것이며
  lexicon: LSJ
  rationale: 영문 주석이 밝히는 난해함을 존중하면서, 이동/통과의 기본 동작을 가장 덜 해석적으로 반영했습니다.
- source_word: ἐκλεκτὸς Θεοῦ
  english_pob_choice: God's chosen one
  chosen_korean: 하나님께 선택받은 이
  alternatives_korean:
  - 하나님의 선택받은 이
  - 하나님이 택하신 이
  lexicon: BDAG
  rationale: ‘선택받은’으로 신적 선택을 분명히 드러내고, Θεοῦ는 프로젝트 기본어휘에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: ἔθνη / συναγωγή-어휘의 교회화 방지
  chosen_reading: 이 본문은 종말론적 예언 문맥이지만 ἔθνη와 συναγωγή를 각각 ‘민족들’과 ‘모임/회중’으로 번역해, 후대 교회 제도어로 미리 고정하지 않았습니다.
  alternative_readings:
  - ‘이방인들’과 ‘집회’
  - ‘교회들’과 ‘교회 회중’
  rationale: 본문의 유대적 예언 어조와 단어의 일반적 의미를 보존하면서, 후대 기독교적 제도 의미를 과도하게 주입하지 않기 위함입니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: ‘마지막 때’와 미래 인물의 묘사
  chosen_reading: ‘마지막 때’에 내 씨에서 일어나는 인물을 미래의 단일 인물로 그대로 두었습니다.
  alternative_readings:
  - 족장 계열의 집단적 후손
  - 후대 메시아적 재해석
  rationale: 본문이 제공하는 예언적 기대를 평이하게 살리되, 후대 정경과 조화시키는 식의 해석적 축소는 피했습니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
