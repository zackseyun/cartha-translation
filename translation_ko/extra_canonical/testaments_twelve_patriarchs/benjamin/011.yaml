  text: XI. Καὶ οὐκέτι κληθήσομαι λύκος ἅρπαξ διὰ τὰς ἁρπαγὰς ὑμῶν ἀλλὰ [ἐργάτης Κυρίου διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν. 2. Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸. 3. Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²². 4. Καὶ ἐν βίβλοις ἁγίαις ἔσται ἀναγραφόμενος, καὶ τὸ ἔργον καὶ ὁ λόγος αὐτοῦ· καὶ ἔσται ἐκλεκτὸς Θεοῦ²³ *ἕως τοῦ²⁴ αἰῶνος. 5. Καὶ²⁵ δι᾽ *αὐτῶν φοιτήσει ὡς²⁶ Ἰακὼβ²⁷ ὁ πατήρ μου, λέγων· Αὐτὸς ἀναπληρώσει τὰ ὑστερήματα τῆς *φυλῆς σου²⁸].
