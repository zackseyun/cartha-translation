    rationale: 제공된 원문 5절은 Καὶ τὸν ἔχοντα χάριν ἀγαθοῦ πνεύματος ἀγαπᾷ κατὰ τὴν ψυχὴν αὐτοῦ뿐입니다. 영어 POB의 확장 목록을 본문으로 역수입하면 원문 우선 원칙을 위반합니다.
