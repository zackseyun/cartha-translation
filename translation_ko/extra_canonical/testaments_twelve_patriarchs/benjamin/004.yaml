    rationale: a는 장 앞의 OCR/배치 문제, b는 2절의 ‘어두운 눈’에 관한 어휘 주석이며, c는 확장 독법 관련 주석입니다. 확장 독법을 본문에서 제거하는 경우 c는 불필요합니다.
