base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004.yaml
  text: '1[a]. See then, my children, the outcome of the good man. Imitate the good, because of his compassion, so that you also may wear crowns of glory.


    2. For the good man does not have a darkened eye, for he shows mercy to all, even if they are sinners.


    3[b]. And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.


    4. If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.


    5. He defends the one who has the fear of the Lord; he helps the one who loves God; by admonishing, he turns back the one who rejects the Most High; and he loves, as his own soul[c], the one who has the grace of a good spirit.'
  footnotes:
  - marker: a
    text: The OCR layer contains preceding lines about 'the lamb of God' and the blameless one dying for the ungodly. These lines are textually difficult and appear displaced relative to the coherent opening of this chapter. They are not included in the main chapter translation here.
    reason: textual_variant
  - marker: b
    text: '''A darkened eye'' may also be understood as ''an evil eye,'' that is, an envious or grudging disposition.'
    reason: lexical_alternative
  - marker: c
    text: Some witnesses at this point read more briefly, while others expand the list of virtues. The translation follows the fuller ethical sequence represented in the supplied Greek layer.
    reason: textual_variant
translation:
  language: ko
  text: '1. 그러므로 내 자녀들아, 선한 사람의 결과를 보십시오. 그의 긍휼 때문에 선한 것을 본받으십시오. 그러면 여러분도 영광의 관을 쓰게 될 것입니다.


    2. 선한 사람은 어두운 눈을 가지지 않습니다. 그는 죄인이라 할지라도 모든 사람에게 자비를 베풉니다.


    3. 그들이 그에게 선한 뜻을 품지 않더라도, 그는 선을 행함으로 악을 이기며, 하나님께서 그를 보호하십니다. 그는 자기를 해치는 사람들을 자기 영혼처럼 사랑합니다.


    4. 누가 영광을 받으면 그는 그를 시기하지 않고, 누가 부유해지면 그는 질투하지 않으며, 누가 용감하면 그는 그를 칭찬합니다. 그는 절제하는 사람을 사랑하고, 가난한 사람에게 긍휼을 베풀며, 약한 사람과 함께 고난을 받고, 하나님을 두려워합니다.


    5. 그는 주를 두려워하는 사람을 변호하고, 하나님을 사랑하는 사람을 돕습니다. 가장 높으신 이를 거역하는 사람은 훈계하여 돌이키게 하고, 선한 영의 은혜를 받은 사람을 자기 영혼처럼 사랑합니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέλος
  english_pob_choice: outcome
  chosen_korean: 결과
  alternatives_korean:
  - 끝
  - 목적
  lexicon: LSJ
  rationale: 권면문 맥락에서 선한 사람의 삶이 낳는 드러난 결말을 가리키므로, 한국어로는 ‘결과’가 가장 자연스럽게 그 의미를 살립니다.
- source_word: μιμήσασθε
  english_pob_choice: imitate
  chosen_korean: 본받으십시오
  alternatives_korean:
  - 모방하십시오
  - 따르십시오
  lexicon: LSJ
  rationale: 윤리적 권면의 강한 명령을 살리면서도, 한국어 합쇼체에서 가장 자연스럽고 품위 있게 들리는 표현입니다.
- source_word: εὐσπλαγχνία
  english_pob_choice: compassion
  chosen_korean: 긍휼
  alternatives_korean:
  - 연민
  - 자비
  lexicon: LSJ
  rationale: 문맥상 선한 행위를 낳는 깊은 측은함을 가리키므로, 한국 교회어휘와도 연결되는 ‘긍휼’을 택했습니다.
- source_word: σκοτεινὸν ὀφθαλμόν
  english_pob_choice: a darkened eye
  chosen_korean: 어두운 눈
  alternatives_korean:
  - 악한 눈
  - 시기하는 눈
  lexicon: LSJ
  rationale: 은유를 풀어버리지 않고 원문 이미지를 보존하되, 주변의 비시기·자비 진술이 그 뜻을 해석하게 두기 위해 직역에 가깝게 옮겼습니다.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  english_pob_choice: being sheltered by God
  chosen_korean: 하나님께서 그를 보호하십니다
  alternatives_korean:
  - 하나님께서 그를 덮으십니다
  - 하나님 아래에서 보호받습니다
  lexicon: LSJ
  rationale: 수동 분사로 표현된 하나님의 보호를 한국어에서는 자연스럽게 능동형으로 풀어, 뜻은 유지하면서 읽기 흐름을 살렸습니다.
- source_word: συμπάσχει
  english_pob_choice: suffers together with
  chosen_korean: 함께 고난을 받습니다
  alternatives_korean:
  - 함께 아파합니다
  - 동참하여 괴로워합니다
  lexicon: LSJ
  rationale: 단순한 동정이 아니라 실제로 ‘함께 고난을 겪는’ 연대감을 나타내므로, 그 강도를 살렸습니다.
- source_word: φόβεται
  english_pob_choice: he fears God
  chosen_korean: 하나님을 두려워합니다
  alternatives_korean:
  - 하나님을 경외합니다
  - 하나님을 무서워합니다
  lexicon: LSJ
  rationale: 문맥의 덕목 목록에서 ‘경외’보다 원문의 ‘두려움’이 더 직접적이므로, 경건한 긴장감을 유지하는 표현을 택했습니다.
theological_decisions:
- issue: 어두운 눈의 의미
  chosen_reading: 은유를 그대로 살려 ‘어두운 눈’으로 옮기고, 시기나 인색한 태도는 문맥으로 드러나게 했습니다.
  alternative_readings:
  - 악한 눈
  - 시기하는 눈
  rationale: 원문은 눈의 이미지로 내면의 태도를 암시하지만, 바로 뒤의 ‘모든 사람에게 자비를 베푼다’는 설명이 그 뜻을 해석해 줍니다. 본문 이미지를 보존하는 편이 더 source-direct합니다.
  doctrine_reference: 본문 이미지 보존과 문맥 해석 우선 원칙
- issue: ‘가장 높으신 이’를 거역하는 사람에 대한 대응
  chosen_reading: 훈계하여 돌이키게 한다고 옮겼습니다.
  alternative_readings:
  - 가르쳐서 돌아오게 한다
  - 책망하여 회개시키다
  rationale: νουθετῶν ἐπιστρέφει의 의미를 둘 다 살려, 단순 경고가 아니라 관계를 회복시키는 권면의 기능을 드러냅니다.
  doctrine_reference: 권면과 회복을 함께 보는 윤리적 목회 이해
