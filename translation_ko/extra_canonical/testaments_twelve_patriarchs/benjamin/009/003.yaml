id: T12P.BEN.9.3
reference: Testament of Benjamin 9:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '[3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/003.yaml
  text: And he will enter into the first temple, and there the Lord will be insulted and will be lifted up on wood.[a]
  footnotes:
  - marker: a
    text: Verses 3–5 are textually uncertain in the witness tradition and are often regarded as a later expansion; they are translated here because they stand in the supplied Greek text.
    reason: textual_variant
    anchor_ref: 9:3-5
translation:
  language: ko
  text: 그는 첫 성전으로 들어가실 것이며, 거기서 주께서는 모욕을 당하시고 나무 위에 높이 들리실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 3–5절은 전승 증거에서 본문이 불확실하며, 흔히 후대의 첨가로 여겨집니다. 여기서는 제공된 그리스어 본문에 포함되어 있으므로 번역합니다.
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελεύσεται εἰς τὸν πρῶτον ναόν
  english_pob_choice: he will enter into the first temple
  chosen_korean: 첫째 성전으로 들어가실 것이며
  alternatives_korean:
  - 첫 번째 성전으로 들어가실 것이며
  - 첫 성전으로 들어가실 것이며
  lexicon: ναός
  rationale: ναός는 단순한 건물 일반보다 성전 자체를 가리키므로 ‘성전’으로 옮겼고, πρῶτον은 서수성을 살려 ‘첫째’로 처리했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께
  lexicon: κύριος
  rationale: 문맥상 야훼를 가리키는 주칭으로 읽히므로, 한국어에서는 직접 호칭의 무게를 살린 ‘주께서’가 가장 간결합니다.
- source_word: ὑβρισθήσεται
  english_pob_choice: will be insulted
  chosen_korean: 모욕을 당하시고
  alternatives_korean:
  - 모욕을 받으시고
  - 능욕을 당하시고
  lexicon: ὑβρίζω
  rationale: 동사는 단순한 ‘모욕하다’보다 공개적 수치와 학대를 포함하는 수동적 의미를 가지므로, 문맥에 맞게 ‘모욕을 당하시고’로 옮겼습니다.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  english_pob_choice: will be lifted up on wood
  chosen_korean: 나무에 들리실 것입니다
  alternatives_korean:
  - 나무 위에 높이 들리실 것입니다
  - 나무에 높이 달리실 것입니다
  lexicon: ξύλον
  rationale: ξύλον은 여기서 처형 도구인 ‘나무/목재’를 가리키며, ὑψωθήσεται는 단순한 물리적 상승과 함께 처형의 높이 들림을 내포하므로 ‘들리실 것입니다’로 유지했습니다.
theological_decisions:
- issue: 야훼 지칭을 한국어에서 어떻게 드러낼지
  chosen_reading: 주께서
  alternative_readings:
  - 야훼께서
  - 주님께서
  rationale: 본문의 Κύριος는 LXX 전통의 신적 칭호이지만, 이 절은 예언적 서술 안에서 직접 호칭이 아니라 서술자 관점의 칭호이므로 본문에는 ‘주께서’로 두고, 필요 시 주석에서 신적 배경을 추적하는 편이 균형적입니다.
  doctrine_reference: LXX citation and divine title rendering
- issue: 나무에 ‘들리다’ 표현이 십자가 처형의 암시를 충분히 살리는지
  chosen_reading: 나무에 들리실 것입니다
  alternative_readings:
  - 나무에 달리실 것입니다
  - 나무에 높이 달리실 것입니다
  rationale: 원문의 ὑψόω와 ξύλον 결합은 후대 기독교 문맥에서 십자가를 연상시키지만, 본문 자체는 그 표현을 직접 확정하지 않으므로 ‘들리실 것입니다’로 과잉 해석을 피했습니다.
  doctrine_reference: Christological typology and restraint
