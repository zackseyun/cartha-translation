translation:
  language: ko
  text: 그는 첫째 성전으로 들어가실 것이며, 거기서 주께서 모욕을 당하시고 나무에 들리실 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελεύσεται εἰς τὸν πρῶτον ναόν
  english_pob_choice: he will enter into the first temple
  chosen_korean: 첫째 성전으로 들어가실 것이며
  alternatives_korean:
  - 첫 번째 성전으로 들어가실 것이며
  - 첫 성전으로 들어가실 것이며
  lexicon: ναός
  rationale: ναός는 단순한 건물 일반보다 성전 자체를 가리키므로 ‘성전’으로 옮겼고, πρῶτον은 서수성을 살려 ‘첫째’로 처리했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께
  lexicon: κύριος
  rationale: 문맥상 야훼를 가리키는 주칭으로 읽히므로, 한국어에서는 직접 호칭의 무게를 살린 ‘주께서’가 가장 간결합니다.
- source_word: ὑβρισθήσεται
  english_pob_choice: will be insulted
  chosen_korean: 모욕을 당하시고
  alternatives_korean:
  - 모욕을 받으시고
  - 능욕을 당하시고
  lexicon: ὑβρίζω
  rationale: 동사는 단순한 ‘모욕하다’보다 공개적 수치와 학대를 포함하는 수동적 의미를 가지므로, 문맥에 맞게 ‘모욕을 당하시고’로 옮겼습니다.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  english_pob_choice: will be lifted up on wood
  chosen_korean: 나무에 들리실 것입니다
  alternatives_korean:
  - 나무 위에 높이 들리실 것입니다
  - 나무에 높이 달리실 것입니다
  lexicon: ξύλον
  rationale: ξύλον은 여기서 처형 도구인 ‘나무/목재’를 가리키며, ὑψωθήσεται는 단순한 물리적 상승과 함께 처형의 높이 들림을 내포하므로 ‘들리실 것입니다’로 유지했습니다.
theological_decisions:
- issue: 야훼 지칭을 한국어에서 어떻게 드러낼지
  chosen_reading: 주께서
  alternative_readings:
  - 야훼께서
  - 주님께서
  rationale: 본문의 Κύριος는 LXX 전통의 신적 칭호이지만, 이 절은 예언적 서술 안에서 직접 호칭이 아니라 서술자 관점의 칭호이므로 본문에는 ‘주께서’로 두고, 필요 시 주석에서 신적 배경을 추적하는 편이 균형적입니다.
  doctrine_reference: LXX citation and divine title rendering
- issue: 나무에 ‘들리다’ 표현이 십자가 처형의 암시를 충분히 살리는지
  chosen_reading: 나무에 들리실 것입니다
  alternative_readings:
  - 나무에 달리실 것입니다
  - 나무에 높이 달리실 것입니다
  rationale: 원문의 ὑψόω와 ξύλον 결합은 후대 기독교 문맥에서 십자가를 연상시키지만, 본문 자체는 그 표현을 직접 확정하지 않으므로 ‘들리실 것입니다’로 과잉 해석을 피했습니다.
  doctrine_reference: Christological typology and restraint
