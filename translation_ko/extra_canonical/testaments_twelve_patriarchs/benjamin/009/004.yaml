revisions:
- from: 그리고 성전의 휘장은 찢어지고, 하나님의 영이 민족들 위에 마치 쏟아지는 불처럼 지나가실 것입니다.[a][b]
  to: 그리고 성전의 휘장이 찢어질 것이며, 하나님의 영은 쏟아지는 불처럼 민족들에게로 옮겨 갈 것입니다.
  rationale: 성전 휘장이 찢어지는 미래 사건과 하나님의 영이 민족들에게로 옮겨 가는 미래 사건을 병렬로 보존했습니다. μεταβήσεται의 이동 의미와 ἐπὶ τὰ ἔθνη의 대상·방향을 ‘민족들에게로’로 반영했으며, ‘쏟아지는 불처럼’으로 ὥσπερ πῦρ ἐκχυνόμενον의 비유를 유지했습니다. 근거 없는 각주 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:59Z'
review_pass:
  verdict: revise
  source_fidelity: ‘민족들 위에 … 지나가실 것입니다’는 μεταβήσεται ἐπὶ τὰ ἔθνη의 이동 방향을 ‘민족들 위를 지나감’으로 바꾸어 버립니다. 여기서는 하나님의 영이 민족들에게로 옮겨 가는 것으로 옮기는 것이 원문 및 영어 감사본에 부합합니다. ὥσπερ πῦρ ἐκχυνόμενον의 비유도 유지해야 합니다.
  naturalness: 현 번역은 ‘민족들 위에 … 지나가실’이 한국어에서도 의미상 부자연스럽고, 영이 민족들을 통과하거나 그 위를 이동한다는 뜻으로 읽힐 수 있습니다. ‘민족들에게로 옮겨 갈 것입니다’가 자연스럽고 정확합니다.
  terminology: ‘성전의 휘장’과 ‘하나님의 영’은 적절합니다. ‘하나님의 영’은 πνεῦμα τοῦ Θεοῦ를 교리 용어로 과도하게 정규화하지 않는 중립적인 선택입니다.
  issues:
  - severity: high
    issue: ἐπὶ τὰ ἔθνη 및 μεταβήσεται의 방향성이 ‘민족들 위에 … 지나가실’로 잘못 표현됨
    rationale: μεταβαίνω는 ‘옮겨 가다, 건너가다’이며, 이 문맥의 전치사구는 영이 민족들에게로 향하는 대상을 나타냅니다. ‘위에 지나가다’는 원문의 민족들을 향한 이동을 상공 통과의 뜻으로 변질합니다.
  - severity: medium
    issue: 본문에 근거가 제시되지 않은 각주 표지 [a][b]가 붙어 있음
    rationale: 제공된 각주 내용이나 해당 표지의 근거가 없으므로 본문에 표지만 남겨 둘 수 없습니다. 표지를 제거하고 각주 세트는 비워 두는 것이 구조적으로 명료합니다.
  revised_text: 그리고 성전의 휘장이 찢어질 것이며, 하나님의 영은 쏟아지는 불처럼 민족들에게로 옮겨 갈 것입니다.
