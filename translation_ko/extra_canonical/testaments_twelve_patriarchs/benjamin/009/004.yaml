id: T12P.BEN.9.4
reference: Testament of Benjamin 9:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔσται τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον²⁴ καὶ μεταβήσεται²⁵ τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη, ὥσπερ²⁶ πῦρ ἐκχυνόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/004.yaml
  text: And the veil of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out.
translation:
  language: ko
  text: 그리고 성전의 휘장이 찢어질 것이며, 하나님의 영은 쏟아지는 불처럼 민족들에게로 옮겨 갈 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  english_pob_choice: the veil of the temple
  chosen_korean: 성전의 휘장
  alternatives_korean:
  - 성전의 장막
  - 성전의 덮개
  lexicon: ἅπλωμα
  rationale: POB의 ‘veil’을 따라, 성전 문맥에서 자연스럽고 통용되는 ‘휘장’으로 옮겼습니다. ‘장막’은 다소 일반적이고, ‘덮개’는 이미지가 약합니다.
- source_word: σχιζόμενον
  english_pob_choice: will be torn
  chosen_korean: 찢어지고
  alternatives_korean:
  - 갈라지고
  - 찢겨지고
  lexicon: σχίζω
  rationale: 종말적 분열의 강한 이미지를 살리되, 한국어에서 가장 직접적이고 자연스러운 동작으로 ‘찢어지고’를 택했습니다.
- source_word: τὸ πνεῦμα τοῦ Θεοῦ
  english_pob_choice: the Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님의 숨
  lexicon: πνεῦμα
  rationale: 여기서는 신적 영을 가리키므로 ‘영’보다도 문맥상 명확한 ‘하나님의 영’을 썼습니다. 본문이 기독론적 고유명사보다 예언적 이미지에 가깝기 때문에 ‘성령’은 보류했습니다.
- source_word: ἐπὶ τὰ ἔθνη
  english_pob_choice: to the nations
  chosen_korean: 민족들 위에
  alternatives_korean:
  - 이방 민족들에게
  - 열국 위에
  lexicon: ἔθνη
  rationale: 여기서는 복음이 특정 민족 경계를 넘어 확장되는 방향을 살리기 위해 ‘민족들’로 옮겼고, 전치사 ἐπὶ의 위임·강림 이미지를 반영해 ‘위에’를 덧붙였습니다.
- source_word: ὥσπερ πῦρ ἐκχυνόμενον
  english_pob_choice: like fire being poured out
  chosen_korean: 마치 쏟아지는 불처럼
  alternatives_korean:
  - 마치 부어지는 불처럼
  - 불이 쏟아지듯
  lexicon: ἐκχέω
  rationale: ‘poured out’의 유출·부어짐을 한국어에서 자연스러운 현재분사형으로 살려 ‘쏟아지는 불처럼’으로 옮겼습니다. ‘쏟아지는’은 불의 확산성과 격렬함을 함께 전달합니다.
theological_decisions:
- issue: 성전 휘장과 영의 강림을 예언적 상징으로 어떻게 처리할지
  chosen_reading: 성전의 휘장이 찢어짐과 하나님의 영의 민족들 위 강림을 병렬된 종말 표지로 유지했습니다.
  alternative_readings:
  - 휘장의 파열을 단순한 사건 묘사로 약화
  - 영의 이동을 비인격적 힘의 확산으로 환원
  rationale: 원문은 두 이미지를 모두 강하게 제시하므로, 상징성을 희석하지 않고 그대로 살리는 것이 예언적 의미를 보존합니다.
  doctrine_reference: 예언 문학의 상징성 및 성령/하나님의 영의 인격적-역동적 표현
- issue: ‘πνεῦμα τοῦ Θεοῦ’를 ‘성령’으로 정규화할지 여부
  chosen_reading: ‘하나님의 영’을 유지했습니다.
  alternative_readings:
  - 성령
  - 하나님의 성령
  rationale: 본문은 후대 교리 용어보다 원문 표현이 더 직접적이므로, 인격성은 유지하되 교회 용어로 과도하게 고정하지 않았습니다.
  doctrine_reference: 성령론, 본문-용어 구별
