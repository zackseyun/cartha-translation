id: T12P.BEN.9.2
reference: Testament of Benjamin 9:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πλὴν ἐν μερίδι ὑμῶν γενήσεται *ναὸς Θεοῦ¹⁴, καὶ *ἔσται ὁ ἔσχατος ἔνδοξος¹⁵ *ὑπὲρ τὸν πρῶτον¹⁶, καὶ *συναχθήσονται ἐκεῖ¹⁷ αἱ¹⁸ δώδεκα φυλαί, καὶ πάντα τὰ ἔθνη ἕως οὗ ὁ ὕψιστος ἀποστείλῃ¹⁹ τὸ σωτήριον αὐτοῦ²⁰ ἐν ἐπισκοπῇ μονογενοῦς προφήτου²¹. [3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/002.yaml
  text: Nevertheless, in your allotted portion there will be the temple of God, and the latter will be more glorious than the former; and there the twelve tribes and all the nations will be gathered, until the Most High sends his salvation in the visitation of an only-begotten prophet.
translation:
  language: ko
  text: 그렇지만 너희에게 할당된 몫에는 하나님의 성전이 있을 것이며, 나중의 것이 먼저 것보다 더 영광스러울 것이고, 거기에서 열두 지파와 모든 민족이 모일 것입니다. 이는 지극히 높으신 분이 독생자 예언자의 방문 가운데 자기의 구원을 보내실 때까지입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναὸς Θεοῦ
  english_pob_choice: the temple of God
  chosen_korean: 하나님의 성전
  alternatives_korean:
  - 하나님의 성막
  - 하나님 성전
  lexicon: ναός
  rationale: ναός는 단순한 예배 장소가 아니라 성전 자체를 가리키므로, POB의 영어를 따라 ‘성전’으로 옮겼습니다.
- source_word: ὁ ἔσχατος ... ὑπὲρ τὸν πρῶτον
  english_pob_choice: the latter ... more glorious than the former
  chosen_korean: 나중의 것이 먼저 것보다 더 영광스러울 것이고
  alternatives_korean:
  - 마지막 것이 처음 것보다 더 영광스러울 것이고
  - 나중 것이 먼저 것보다 더 영광스러울 것이고
  lexicon: ἔσχατος, πρῶτος
  rationale: 대조를 자연스럽게 살리기 위해 POB의 ‘latter/former’ 의미를 반영했으며, 단순한 시간 순서보다 앞뒤 항목의 대비가 핵심입니다.
- source_word: συναχθήσονται ἐκεῖ αἱ δώδεκα φυλαί, καὶ πάντα τὰ ἔθνη
  english_pob_choice: there the twelve tribes and all the nations will be gathered
  chosen_korean: 거기에서 열두 지파와 모든 민족이 모일 것입니다
  alternatives_korean:
  - 거기에서 열두 지파와 모든 나라가 모일 것입니다
  - 거기에서 열두 지파와 모든 이방 민족이 모일 것입니다
  lexicon: συναχθήσονται, φυλαί, ἔθνη
  rationale: 동사에 수동적 뉘앙스가 있어 ‘모이다’로 옮겼고, ἔθνη는 문맥상 ‘민족’이 가장 무난하여 ‘이방’의 해석을 과도하게 넣지 않았습니다.
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  english_pob_choice: in the visitation of an only-begotten prophet
  chosen_korean: 독생자 예언자의 방문 가운데
  alternatives_korean:
  - 독생자 예언자의 살피심 가운데
  - 독생자 예언자의 돌아보심 가운데
  lexicon: ἐπισκοπή, μονογενής, προφήτης
  rationale: ἐπισκοπή의 핵심을 ‘방문/돌봄/감찰’의 범위로 보되, POB의 ‘visitation’을 따라 ‘방문’으로 옮겼고, μονογενοῦς는 직역적 긴장을 살려 ‘독생자’로 유지했습니다.
theological_decisions:
- issue: ‘지극히 높으신 분’의 주체와 ‘자기의 구원’ 표현
  chosen_reading: 지극히 높으신 분이 자기의 구원을 보내실 것입니다
  alternative_readings:
  - 하나님이 자기의 구원을 보내실 것입니다
  - 지극히 높으신 분이 그의 구원을 보내실 것입니다
  rationale: 원문은 ὁ ὕψιστος를 직접 주어로 두고 αὐτοῦ를 ‘자기의’로 연결하므로, 소유 대명사의 지시를 약화하지 않고 보존했습니다.
  doctrine_reference: 본문 주해상 메시아적 구원 약속의 직접성을 유지하는 번역 원칙
- issue: μονογενοῦς προφήτου의 기독론적 긴장
  chosen_reading: 독생자 예언자
  alternative_readings:
  - 외아들 예언자
  - 유일무이한 예언자
  rationale: 영어 POB의 ‘only-begotten prophet’을 그대로 반영해, 전통적 교회어를 덧씌워 의미를 완화하지 않고 본문이 지닌 독특한 호칭 긴장을 살렸습니다.
  doctrine_reference: 메시아-예언자 표상과 독특한 칭호를 보존하는 번역 원칙
