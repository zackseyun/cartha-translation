id: T12P.BEN.9.1
reference: Testament of Benjamin 9:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IX. Λέγω δὲ ὑμῖν καὶ πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου, *ὅτι πορνεύ(σ)ετε¹ πορνείαν Σοδόμων καὶ ἀπολε(ῖ)σθε ἕως βραχύ. Καὶ πάλιν ἀνανεωθήσεσθε καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/001.yaml
  text: And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again, and the kingdom of the Lord will not be among you.
translation:
  language: ko
  text: 또한 나는 의인 에녹의 말씀에 따라 여러분에게 말합니다. 여러분은 소돔의 음행을 행하고 잠시 동안 멸망할 것입니다. 그 뒤에 여러분은 다시 새로워질 것이며, 주님의 나라는 여러분 가운데 있지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύ(σ)ετε πορνείαν
  english_pob_choice: you will commit the fornication of Sodom
  chosen_korean: 소돔의 음행을 행하고
  alternatives_korean:
  - 소돔의 음행을 저지르고
  - 소돔의 음행에 빠지고
  lexicon: πορνεία
  rationale: 영어 POB의 'fornication of Sodom'은 단순한 성적 부도덕보다 소돔과 연결된 강한 범죄표현이므로, 한국어에서도 직역적 완곡보다 '음행'을 유지해 원문의 도덕·심판적 뉘앙스를 보존했습니다.
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  english_pob_choice: you will perish for a little while
  chosen_korean: 잠시 동안 멸망할 것입니다
  alternatives_korean:
  - 잠시 동안 망할 것입니다
  - 잠깐 동안 죽을 것입니다
  lexicon: ἀπόλλυμι
  rationale: 문맥상 최종 소멸이 아니라 일시적 심판/멸망 상태를 가리키므로 '멸망할 것입니다'로 옮겨, 영어 POB의 'for a little while'이 드러내는 기간성을 살렸습니다.
- source_word: ἀνανεωθήσεσθε
  english_pob_choice: you will be renewed again
  chosen_korean: 다시 새로워질 것이며
  alternatives_korean:
  - 다시 갱신될 것이며
  - 다시 회복될 것이며
  lexicon: ἀνανεόω
  rationale: 동사의 핵심은 '새로움으로 다시 만들어짐'이므로 '새로워지다'를 택해, 외부적 회복보다 내적 갱신의 의미를 남겼습니다.
- source_word: ἡ βασιλεία Κυρίου
  english_pob_choice: the kingdom of the Lord
  chosen_korean: 주님의 나라
  alternatives_korean:
  - 주님의 왕국
  - 주님의 통치
  lexicon: βασιλεία
  rationale: POB의 표준 용례에 맞춰 βασιλεία를 '나라'로 옮겼고, Κυρίου는 문맥상 야훼를 가리키는 일반적 주어로서 '주님'을 사용했습니다.
theological_decisions:
- issue: 소돔의 음행과 일시적 멸망의 대비를 어떻게 한국어에서 살릴 것인가
  chosen_reading: '''소돔의 음행''과 ''잠시 동안 멸망할 것입니다''를 병치해, 죄의 특정성과 심판의 일시성을 함께 드러냈습니다.'
  alternative_readings:
  - '''소돔과 같은 음행''으로 완화하여 표현'
  - '''조금 동안 망할 것입니다''로 더 약하게 표현'
  rationale: 원문은 소돔을 단순 비유가 아니라 범죄의 규정어로 사용하고, 곧이어 회복을 말하므로 강한 죄-심판-회복 구조를 약화하지 않는 것이 중요합니다.
  doctrine_reference: 심판과 회복의 병행, 성결 윤리
