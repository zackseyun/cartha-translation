  text: And having gone up from Hades, he will pass from earth to heaven. And I knew how lowly he would be on earth, and how glorious in heaven.
translation:
  language: ko
  text: 그가 음부에서 올라와 땅에서 하늘로 옮겨 갈 것입니다. 나는 그가 땅에서는 얼마나 비천할지, 하늘에서는 얼마나 영광스러울지를 알았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνελθὼν ἐκ τοῦ ᾅδου
  english_pob_choice: having gone up from Hades
  chosen_korean: 음부에서 올라와서
  alternatives_korean:
  - 하데스에서 올라와서
  - 음부로부터 올라와서
  lexicon: ᾅδης
  rationale: 문맥상 죽은 자들의 영역을 가리키므로 한국어 성경 문체에서 널리 이해되는 ‘음부’를 택했고, 완료 분사 감각은 ‘올라와서’로 자연스럽게 옮겼습니다.
- source_word: μεταβαίνων ἀπὸ τῆς γῆς πρὸς οὐρανόν
  english_pob_choice: he will pass from earth to heaven
  chosen_korean: 땅에서 하늘로 옮겨 갈 것입니다
  alternatives_korean:
  - 땅에서 하늘로 지나갈 것입니다
  - 땅에서 하늘로 건너갈 것입니다
  lexicon: μεταβαίνω
  rationale: 단순한 이동보다 상태와 영역의 전이를 강조하는 동사이므로, ‘옮겨 가다’로 옮겨 의미를 살렸습니다.
- source_word: ταπεινὸς ἐπὶ γῆς / ἔνδοξος ἐν οὐρανῷ
  english_pob_choice: how lowly he would be on earth, and how glorious in heaven
  chosen_korean: 땅에서는 얼마나 낮은 자가 될지, 하늘에서는 얼마나 영광스러울지를
  alternatives_korean:
  - 땅에서는 얼마나 비천할지, 하늘에서는 얼마나 영광스러울지를
  - 땅에서는 얼마나 겸손할지, 하늘에서는 얼마나 영화로울지를
  lexicon: ταπεινός / ἔνδοξος
  rationale: 타인 앞에서의 사회적 낮음과 천상의 영광이라는 대비를 보존하기 위해 ‘낮은 자’와 ‘영광스럽다’를 사용했습니다.
theological_decisions:
- issue: 지상과 하늘의 상태 대비를 어떻게 표현할지
  chosen_reading: ‘낮은 자’와 ‘영광스러운’의 대비로, 지상의 비천함과 천상의 영광을 함께 드러냈습니다.
  alternative_readings:
  - ‘겸손한’과 ‘영화로운’으로 완화해서 표현하는 방식
  rationale: 본문은 단순한 성품 묘사보다 처지와 위상 변화의 대비를 말하므로, 도덕적 덕목으로 축소하지 않았습니다.
  doctrine_reference: 인물의 낮아짐과 높아짐을 함께 보는 성경적 고난-영광 패턴
