  text: Εἰς δὲ ἐξ αὐτῶν ῥάβδῳ μαστίζων με, ὑπήντησεν αὐτῷ λέων καὶ ἀνεῖλεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/003.yaml
  text: And one of them, while he was striking me with a rod, was met by a lion, and the lion killed him.
translation:
  language: ko
  text: 그들 가운데 한 사람이 막대기로 나를 때리고 있었는데, 사자가 그를 만나 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰς δὲ ἐξ αὐτῶν
  english_pob_choice: And one of them
  chosen_korean: 그들 가운데 한 사람이
  alternatives_korean:
  - 그들 중 한 사람이
  - 그들 가운데서 한 사람이
  lexicon: ἐξ + αὐτῶν
  rationale: ἐξ αὐτῶν은 출처 집단 ‘그들’에서 나온 한 사람을 가리키므로, 자연스러운 현대 한국어로는 ‘그들 가운데 한 사람’이 가장 직접적입니다.
- source_word: ῥάβδῳ μαστίζων με
  english_pob_choice: while he was striking me with a rod
  chosen_korean: 저를 몽둥이로 치고 있을 때
  alternatives_korean:
  - 저를 막대기로 때리고 있을 때
  - 저를 막대기로 채찍질하고 있을 때
  lexicon: ῥάβδος, μαστίζω
  rationale: ῥάβδος는 문맥상 ‘몽둥이/막대기’ 중에서도 타격 도구의 뉘앙스가 강하고, μαστίζων은 반복적 구타를 뜻하므로 ‘몽둥이로 치다’가 과장 없이 소스를 반영합니다.
- source_word: ὑπήντησεν αὐτῷ λέων
  english_pob_choice: was met by a lion
  chosen_korean: 사자가 그를 만나
  alternatives_korean:
  - 사자가 그에게 닥쳐
  - 사자가 그를 맞닥뜨려
  lexicon: ὑπαντάω
  rationale: ὑπήντησεν은 단순한 ‘만나다’이지만 여기서는 치명적 조우를 나타내므로 ‘사자가 그를 만나’로 직역하되, 앞뒤 문맥이 사건성을 분명히 하도록 유지했습니다.
- source_word: ἀνεῖλεν αὐτόν
  english_pob_choice: killed him
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
  - 그를 죽였습니다
  - 그를 없애 버렸습니다
  lexicon: ἀναιρέω
  rationale: ἀνεῖλεν은 ‘죽이다’의 직접적 의미가 분명하므로, 우회 표현보다 ‘죽였습니다’가 가장 정확합니다.
theological_decisions:
- issue: 폭력적 사건 묘사의 직설성
  chosen_reading: 원문의 폭력성과 갑작스러운 심판성의 인상을 약화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘쓰러뜨렸습니다’로 순화
  - 비유적으로 ‘멸했습니다’로 확대
  rationale: 이 구절은 도덕적 교훈보다 사건의 급작스러운 결과를 보여 주므로, 직설적 동사를 유지해야 서술 효과가 보존됩니다.
  doctrine_reference: 서사적 심판 묘사의 직접성 보존
