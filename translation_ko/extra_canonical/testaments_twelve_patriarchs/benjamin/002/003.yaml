    rationale: 1인칭 목적격 με는 화자의 사회적 높임이나 겸양을 표시하지 않습니다. 서사 번역에서는 ‘나를’이 의미를 중립적으로 보존합니다.
  revised_text: 그들 가운데 한 사람이 막대기로 나를 때리고 있었는데, 사자가 그를 만나 죽였습니다.
