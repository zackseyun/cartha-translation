  naturalness: ‘그들 가운데 한 사람이 막대기로 나를 때리고 있었는데’는 분사구문의 동시 상황을 자연스럽게 살리며, 현대 한국어 서사문으로도 매끄럽습니다.
  terminology: ῥάβδος는 여기서 ‘막대기’로 옮겨 도구의 종류를 불필요하게 한정하지 않았습니다. μαστίζω는 문맥상 ‘때리다’로 충분하며, ἀνεῖλεν은 ‘죽였습니다’로 직접적으로 유지했습니다.
