    rationale: λέγοντες는 단순히 '이런 말을 하면서/말할 때'라는 동반 상황을 나타냅니다. '-면서도'는 원문에 명시되지 않은 역접·양보 관계를 부가합니다.
  - severity: low
    issue: 주어의 중복과 '행적'의 의미 협소화
    rationale: '''그들은 … 자신들은''은 αὐτοὶ의 강조를 자연스럽게 반영하지 못합니다. 또한 ''행적''은 ἔργα의 ''행위들, 행한 일들''보다 특정한 기록 또는 일대기적 뉘앙스를 띨 수 있습니다.'
  revised_text: 그들 자신은 이런 말을 하면서 거짓말한 것이 아니었습니다. 그는 우리 형제들의 행위들을 내게 숨기려 했기 때문입니다.
