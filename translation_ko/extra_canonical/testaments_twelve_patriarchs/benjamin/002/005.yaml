  text: Καὶ οὐκ ἐψεύσαντο αὐτοὶ ταῦτα λέγοντες· ἤθελεν γὰρ κρύπτειν ἀπʼ ἐμοῦ *τὰ ἔργα τῶν ἀδελφῶν ἡμῶν³¹
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/005.yaml
  text: And they themselves did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.
translation:
  language: ko
  text: 그들은 이 말들을 하면서도 자신들은 거짓말하지 않았습니다. 왜냐하면 그가 우리 형제들의 행적을 나에게서 숨기고 싶어 했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐψεύσαντο αὐτοὶ
  english_pob_choice: And they themselves did not lie
  chosen_korean: 그들은 이 말들을 하면서도 자신들은 거짓말하지 않았습니다
  alternatives_korean:
  - 그들 자신은 이 말을 하며 거짓말하지 않았습니다
  - 그들 자신도 이 말을 하며 거짓말하지 않았습니다
  lexicon: ψεύδομαι
  rationale: 주어를 복수인 ‘그들’로 살리고, αὐτοὶ의 강조를 ‘자신들은’으로 반영해 ‘그들 자신’의 대비를 드러냈습니다.
- source_word: ταῦτα λέγοντες
  english_pob_choice: in saying these things
  chosen_korean: 이 말들을 하면서도
  alternatives_korean:
  - 이런 말을 하면서
  - 이것들을 말하면서
  lexicon: λέγω
  rationale: 현재분사구를 자연스러운 부가 설명으로 처리하되, 말하는 행위가 진행 중이라는 뉘앙스를 유지했습니다.
- source_word: κρύπτειν ἀπʼ ἐμοῦ
  english_pob_choice: to hide from me
  chosen_korean: 나에게서 숨기고 싶어 했기 때문입니다
  alternatives_korean:
  - 나에게 감추려 했기 때문입니다
  - 내게서 숨기려 했기 때문입니다
  lexicon: κρύπτω
  rationale: ἀπʼ ἐμοῦ의 분리 의미를 ‘나에게서’로 살리고, ἤθελεν의 의지를 ‘숨기고 싶어 했기’로 옮겼습니다.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  english_pob_choice: the deeds of our brothers
  chosen_korean: 우리 형제들의 행적
  alternatives_korean:
  - 우리 형제들의 일들
  - 우리 형제들의 행위
  lexicon: ἔργον
  rationale: ἔργα는 단순 ‘일’보다 행위·행적의 범위를 가지므로, 문맥상 은폐된 내용을 드러내는 ‘행적’으로 옮겼습니다.
theological_decisions:
- issue: 말하는 주체의 수와 강조
  chosen_reading: ‘그들 자신’이 말한 내용이 거짓이 아니었다는 점을 분명히 드러내었습니다.
  alternative_readings:
  - ‘요셉’이 거짓말하지 않았다는 식의 단수 해석
  - 강조를 약화한 평면 번역
  rationale: 그리스어 복수 주어와 αὐτοὶ의 강조를 반영해, 영어 POB의 수정된 주어 이해와 일치시키고 오독을 방지했습니다.
  doctrine_reference: source-level syntactic alignment
