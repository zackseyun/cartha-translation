revisions:
- from: 그들은 이 말들을 하면서도 자신들은 거짓말하지 않았습니다. 왜냐하면 그가 우리 형제들의 행적을 나에게서 숨기고 싶어 했기 때문입니다.
  to: 그들 자신은 이런 말을 하면서 거짓말한 것이 아니었습니다. 그는 우리 형제들의 행위들을 내게 숨기려 했기 때문입니다.
  rationale: 복수 주어 및 αὐτοὶ의 강조를 '그들 자신은'으로 자연스럽게 반영했습니다. 현재분사의 비양보적 기능을 '하면서'로 옮기고, ἔργα의 의미 범위를 보존하도록 '행위들'을 사용했습니다. 단수 '그'의 선행사는 원문처럼 특정하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:57Z'
review_pass:
  verdict: revise
  source_fidelity: 복수 주어와 αὐτοὶ의 강조, 그리고 '그가'라는 단수 주어의 모호성은 대체로 보존되었습니다. 그러나 '하면서도'는 원문 현재분사에 없는 양보·대조를 더하며, '행적'은 ἔργα보다 다소 전기적·기록물적 의미로 좁힐 수 있습니다.
  naturalness: 초안의 '그들은 … 자신들은'은 주어가 중복되어 다소 부자연스럽습니다. '그들 자신은'으로 강조를 한 번만 나타내고, 자연스러운 한국어 분사 연결로 다듬는 것이 좋습니다.
  terminology: ἔργα는 여기서 '행위들'로 옮겨 원문의 넓은 뜻과 복수성을 유지합니다. '그'가 누구인지는 본문에서 특정하지 않아 원문의 지시 대상 모호성을 보존합니다.
  issues:
