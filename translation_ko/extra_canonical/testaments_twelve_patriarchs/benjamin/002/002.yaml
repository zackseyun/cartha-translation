id: T12P.BEN.2.2
reference: Testament of Benjamin 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ λέγει μοι· Ναί, ἀδελφέ¹⁶. καὶ ὅτε¹⁷ ἐξέδυσάν με τὸν χιτῶνά μου δέδωκάν με τοῖς Ἰσμαηλίταις· καὶ δέδωκάν μοι περίζωμα, καὶ φραγγελλώσαντες εἰπόν μοι τρέχειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/002.yaml
  text: And he said to me, “Yes, brother. And when they stripped me of my tunic they gave me to the Ishmaelites; and they gave me a loincloth, and after flogging me they told me to run.”
translation:
  language: ko
  text: 그가 제게 말했습니다. “네, 형제여. 그들이 제 옷을 벗기고 저를 이스마엘 사람들에게 넘겼습니다. 또 그들은 제게 허리에 두르는 천을 주고, 저를 채찍질한 뒤 달리라고 말했습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ναί, ἀδελφέ
  english_pob_choice: “Yes, brother.”
  chosen_korean: 「네, 형제여」
  alternatives_korean:
  - 「예, 형제여」
  - 「네, 형제님」
  lexicon: Ναί; ἀδελφέ
  rationale: 짧은 호응과 친근한 호칭을 살리되, 현대 한국어에서 자연스러운 직접 화법으로 옮겼습니다.
- source_word: τὸν χιτῶνά μου
  english_pob_choice: “my tunic”
  chosen_korean: 「제 긴 옷」
  alternatives_korean:
  - 「제 속옷」
  - 「제 튜닉」
  - 「제 겉옷」
  lexicon: χιτών
  rationale: χιτών은 고대 의복명이라 한국어에 고정된 교회 용어가 약하므로, 독자가 기능을 이해할 수 있게 ‘긴 옷’으로 풀어 옮겼습니다.
- source_word: δέδωκάν με τοῖς Ἰσμαηλίταις
  english_pob_choice: “they gave me to the Ishmaelites”
  chosen_korean: 「제게 이스마엘 사람들에게 넘겼습니다」
  alternatives_korean:
  - 「저를 이스마엘 사람들에게 주었습니다」
  - 「저를 이스마엘 사람들에게 넘겨주었습니다」
  lexicon: δίδωμι + δοτική
  rationale: 수동적 인계의 뉘앙스를 살리기 위해 ‘넘겼습니다’로 옮겼고, 인명은 현대 표기 ‘이스마엘 사람들’을 사용했습니다.
- source_word: περίζωμα
  english_pob_choice: “loincloth”
  chosen_korean: 「허리띠」
  alternatives_korean:
  - 「천 허리띠」
  - 「속옷」
  lexicon: περίζωμα
  rationale: 본문의 짧은 의복 조각을 한국어로 가장 간결하게 전달할 수 있는 일반어를 택했습니다.
- source_word: φραγγελλώσαντες ... τρέχειν
  english_pob_choice: “after flogging me they told me to run”
  chosen_korean: 「채찍질한 뒤 달리라고 말했습니다」
  alternatives_korean:
  - 「매질한 뒤 달리라고 했습니다」
  - 「채찍질하고 달리라고 했습니다」
  lexicon: φραγγελλόω; λέγω + inf.
  rationale: 행위의 순서를 보존하면서도 한국어 문장 흐름이 자연스럽도록 ‘-한 뒤 … 말했습니다’ 구조로 옮겼습니다.
