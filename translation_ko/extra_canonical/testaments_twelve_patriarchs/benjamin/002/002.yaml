revisions:
- from: 그가 제게 말했습니다. 「네, 형제여. 그리고 그들이 제게서 제 긴 옷을 벗겼을 때, 제게 이스마엘 사람들에게 넘겼습니다. 그리고 그들은 제게 허리띠를 주고, 채찍질한 뒤 달리라고 말했습니다」.
  to: 그가 제게 말했습니다. “네, 형제여. 그들이 제 옷을 벗기고 저를 이스마엘 사람들에게 넘겼습니다. 또 그들은 제게 허리에 두르는 천을 주고, 저를 채찍질한 뒤 달리라고 말했습니다.”
  rationale: 목적격 누락을 바로잡아 ‘그들이 나를 이스마엘 사람들에게 넘겼다’는 원문의 인계 행위를 정확히 반영했습니다. 의복 관련 표현에서는 원문에 없는 길이를 삭제하고, περίζωμα의 최소 의복/가림 천이라는 기능을 드러냈습니다. 행위자 ‘그들’ 및 복수 표현을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:39:05Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 행위 주체와 복수성을 대체로 따랐으나, 초안의 “제게 이스마엘 사람들에게 넘겼습니다”는 목적격이 결여되어 문법적으로 성립하지 않습니다. 또한 χιτών을 “긴 옷”으로 한정할 근거는 없고, περίζωμα는 단순한 “허리띠”보다 허리를 가리는 의복 또는 천을 뜻합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 서술 및 직접화법으로 자연스럽습니다. “저를 … 넘겼습니다”로 목적어를 명시하고, 채찍질의 대상도 “저를”로 밝혀 한국어에서의 모호함을 제거했습니다.
  terminology: Ἰσμαηλίταις는 “이스마엘 사람들에게”로 유지했습니다. χιτών은 길이나 속옷 여부를 과도하게 특정하지 않고 “옷”으로, περίζωμα는 기능을 반영해 “허리에 두르는 천”으로 옮겼습니다.
  issues:
  - severity: high
    issue: “제게 이스마엘 사람들에게 넘겼습니다”
    rationale: δέδωκάν με의 목적어 με(나를)에 해당하는 목적격 표현이 빠졌고 “제게”는 여격/수혜격이므로 문법 및 의미가 모두 어긋납니다. “저를 이스마엘 사람들에게 넘겼습니다”가 필요합니다.
  - severity: medium
    issue: χιτών을 “긴 옷”으로 번역
    rationale: χιτών은 튜닉형 기본 의복을 가리키지만 길이를 원문이 명시하지 않습니다. “긴”은 불필요한 구체화입니다.
  - severity: medium
    issue: περίζωμα를 “허리띠”로 번역
    rationale: περίζωμα는 허리에 두르는, 몸을 가리는 천 또는 간략한 의복을 가리킵니다. 단순한 띠는 가림 기능을 충분히 전달하지 못합니다.
  revised_text: 그가 제게 말했습니다. “네, 형제여. 그들이 제 옷을 벗기고 저를 이스마엘 사람들에게 넘겼습니다. 또 그들은 제게 허리에 두르는 천을 주고, 저를 채찍질한 뒤 달리라고 말했습니다.”
  revised_footnotes: []
