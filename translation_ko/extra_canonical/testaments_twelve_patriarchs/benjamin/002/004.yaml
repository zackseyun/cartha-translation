lexical_decisions:
- source_word: οἱ μέτοχοι αὐτοῦ
  english_pob_choice: his companions
  chosen_korean: 그의 동료들
  alternatives_korean:
  - 그와 함께한 사람들
  - 그의 동참자들
  lexicon: μέτοχος
  rationale: μέτοχοι는 단순한 동행자라기보다 ‘함께 참여한 자들’이라는 관계를 뜻하므로, 자연스러운 현대 한국어로 ‘동료들’이 가장 무난합니다.
- source_word: φοβηθέντες
  english_pob_choice: being afraid
  chosen_korean: 두려워하여
  alternatives_korean:
  - 무서워하여
  - 두려움에 사로잡혀
  lexicon: φοβέομαι
  rationale: 원문의 수동 분사적 뉘앙스를 살려 원인·상태를 함께 드러내는 ‘두려워하여’로 옮겼습니다.
- source_word: ἐν †ἀνέσει με κατέσχεν†
  english_pob_choice: †kept me at ease†
  chosen_korean: 나를 편히 두었습니다
  alternatives_korean:
  - 나를 편안히 해 주었습니다
  - 나를 안정되게 두었습니다
  lexicon: ἀνέσις / κατέχω
  rationale: 본문의 전승상 표시된 불확실한 구절을 그대로 반영하면서, POB의 의미 단서를 따라 ‘편히 두다’로 번역해 문맥적 의미를 살렸습니다.
theological_decisions:
- issue: 본문 말미의 불확실한 구절 처리
  chosen_reading: 전승상 표시된 †...†를 유지하고, 의미는 ‘편히 두었습니다’로 조심스럽게 반영했습니다.
  alternative_readings:
  - 문자적으로 직역하여 의미를 단정하는 처리
  - 아예 생략하는 처리
  rationale: 해당 부분은 본문 비정절로 표시되어 있으므로, 확정적 번역을 피하고 독자가 텍스트의 불확실성을 인지하도록 유지하는 것이 타당합니다.
  doctrine_reference: 본문비평 원칙
