  text: Ὅτε *δὲ ἦλθον εἰς Αἴγυπτον ἐγνώρισέν³ με ὁ ἀδελφός μου†, λέγει⁴ μοι· ὅτι ἔφυραν⁹ τὸν χιτῶνά σου αἵματι¹⁰ εἶπον¹¹. Ἐπίγνωθι¹² εἰ¹³ ὃ¹⁴ χιτὼν οὗτος.
