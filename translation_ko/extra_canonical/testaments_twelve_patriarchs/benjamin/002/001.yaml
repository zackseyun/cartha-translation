base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/001.yaml
  text: And when I went into Egypt, my brother recognized me and said to me, “They smeared your tunic with blood,” they said. “See whether this is the tunic.”
translation:
  language: ko
  text: 내가 이집트에 갔을 때, 내 형제가 나를 알아보고 내게 말했습니다. “그들이 당신의 옷을 피로 더럽혔다고 그들이 말했습니다. 이것이 그 옷인지 알아보십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώρισέν με ὁ ἀδελφός μου
  english_pob_choice: my brother recognized me
  chosen_korean: 내 형제가 나를 알아보고
  alternatives_korean:
  - 내 형제가 나를 알아보았고
  - 내 형제가 나를 알아차리고
  lexicon: ἐγνωρίζω
  rationale: 형제가 ‘알아보다’는 인식의 순간을 자연스럽게 살리되, 문맥상 단순 만남이 아니라 신분을 알아본 의미를 유지했습니다.
- source_word: εἰς Αἴγυπτον
  english_pob_choice: into Egypt
  chosen_korean: 이집트에
  alternatives_korean:
  - 이집트로
  - 이집트 안으로
  lexicon: Αἴγυπτος
  rationale: 한국어에서는 이동 목적지로서의 ‘~에 갔을 때’가 가장 자연스러워, ‘into’의 방향성을 과도하게 부각하지 않고 옮겼습니다.
- source_word: ἔφυραν τὸν χιτῶνά σου αἵματι
  english_pob_choice: They smeared your tunic with blood
  chosen_korean: 그들이 네 옷을 피에 적셨습니다
  alternatives_korean:
  - 그들이 네 긴옷에 피를 묻혔습니다
  - 그들이 네 속옷에 피를 묻혔습니다
  lexicon: χιτών
  rationale: χιτών은 기본적으로 몸에 입는 속옷/긴옷이지만, 한국어 독자에게는 ‘옷’이 가장 덜 오해를 낳으면서도 본문의 상징성을 유지합니다.
- source_word: Ἐπίγνωθι εἰ ὃ χιτὼν οὗτος
  english_pob_choice: See whether this is the tunic
  chosen_korean: 이것이 그 옷인지 보십시오
  alternatives_korean:
  - 이것이 그 옷인지 알아보십시오
  - 이 옷이 맞는지 보십시오
  lexicon: ἐπίγνωθι
  rationale: 명령형 ἐπίγνωθι를 ‘보십시오’로 옮겨, 확인을 요구하는 대화체의 힘을 살리면서도 한국어 문장 흐름을 자연스럽게 했습니다.
theological_decisions:
- issue: 직접화법 안의 인용 구조
  chosen_reading: 그들이 말한 내용을 두 겹의 인용부호로 나누어, 본문이 전하는 반복 발화를 그대로 드러냈습니다.
  alternative_readings:
  - 한 번의 인용으로 단순화하기
  - 간접화법으로 재구성하기
  rationale: 헬라어 본문에는 ‘그가 내게 말했다… 그들이 말했다… 보라…’의 발화 층위가 남아 있어, 이를 보존해야 서술의 긴장과 증언 형식이 살아납니다.
  doctrine_reference: 본문 비평/서사 구조
