  source_fidelity: 원문의 두 병렬 권유 표현(γένωνται ... / μὴ ἔλθωσιν ...)과 ἐν ὑμῖν 및 εἰς καρδίαν τοῦ πατρός μου의 방향성을 대체로 충실히 반영했습니다. 다만 γένωνται는 단순한 정적 존재보다 ‘생기다/되다’의 뉘앙스도 지니나, 이 문맥에서는 ‘있게 하다’가 안전하게 허용됩니다.
  naturalness: 초안의 문장 첫머리에서 ‘그리고’를 두 차례 반복하고 두 문장을 완전히 분리하면 한국어 권면문으로 다소 번역투가 됩니다. 병렬된 권유를 한 문장으로 연결하면 현대 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ἔννοιαι는 문맥상 ‘생각들’로 적절하며, καρδία는 ‘마음’, πατρός μου는 ‘내 아버지’로 옮기는 것이 정확합니다. ‘마음에 들어가다’는 여기서 말이 아버지에게 전해져 받아들여지는 비유를 자연스럽게 보존합니다.
