translation:
  language: ko
  text: 그리고 그런 생각들이 여러분 안에 있게 하십시오. 그리고 이런 말들이 제 아버지의 마음에 들어가지 않게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ ἔννοιαι
  english_pob_choice: thoughts
  chosen_korean: 생각들
  alternatives_korean:
  - 생각
  - 생각거리
  - 의도
  lexicon: ἔννοια
  rationale: 문맥상 내면의 생각을 가리키므로 단수적 개념화보다 복수형의 자연스러운 한국어인 “생각들”로 옮겼습니다.
- source_word: γένωνται ἐν ὑμῖν
  english_pob_choice: let such thoughts be in you
  chosen_korean: 여러분 안에 있게 하십시오
  alternatives_korean:
  - 여러분 안에 있으십시오
  - 여러분 가운데 생기게 하십시오
  lexicon: γίνομαι
  rationale: 명령형의 발생·존재 의미를 살려 “있게 하십시오”로 옮기되, 수신자 내부를 가리키는 ἐν ὑμῖν을 자연스럽게 반영했습니다.
- source_word: εἰς καρδίαν
  english_pob_choice: into the heart
  chosen_korean: 마음에 들어가지 않게 하십시오
  alternatives_korean:
  - 마음속에 들어오지 않게 하십시오
  - 마음에 이르지 않게 하십시오
  lexicon: καρδία
  rationale: ‘마음’에 대한 침투 이미지를 살려 직역적으로 “들어가지 않게”를 사용했습니다. 한국어에서 “마음에 들어가다”는 비유적 수용을 자연스럽게 전달합니다.
