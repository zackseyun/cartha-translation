  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/007.yaml
  text: Do not tell my father what you did to me, but speak in this way, just as I explained to Benjamin.
translation:
  language: ko
  text: 내 아버지에게 너희가 나에게 한 일을 말하지 마십시오. 그러나 내가 베냐민에게 설명한 것처럼 이렇게 말하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ λέγετε
  english_pob_choice: Do not tell
  chosen_korean: 말하지 마십시오
  alternatives_korean:
  - 알리지 마십시오
  - 전하지 마십시오
  lexicon: λέγω
  rationale: 금지 명령을 자연스러운 합쇼체로 옮기되, 단순한 '말하다'의 의미를 유지하여 내용 은폐의 요청을 직접 드러냈습니다.
- source_word: τῷ πατρί μου
  english_pob_choice: my father
  chosen_korean: 내 아버지에게
  alternatives_korean:
  - 저의 아버지에게
  - 우리 아버지에게
  lexicon: πατήρ
  rationale: 화자의 1인칭 소유를 그대로 반영해 관계를 분명히 했습니다.
- source_word: ἃ ἐποιήσατέ μοι
  english_pob_choice: what you did to me
  chosen_korean: 내가 너희에게 당한 일
  alternatives_korean:
  - 너희가 나에게 한 일
  - 너희가 나에게 저지른 일
  lexicon: ποιέω
  rationale: 행위의 피해자적 뉘앙스를 살려 한국어에서 자연스러운 수동적 표현으로 옮겼습니다.
- source_word: οὕτως λέξατε καθὼς ἐξηγησάμην τῷ Βενιαμίν
  english_pob_choice: speak in this way, just as I explained to Benjamin
  chosen_korean: 내가 베냐민에게 설명한 것처럼 그렇게 말하십시오
  alternatives_korean:
  - 내가 베냐민에게 설명한 대로 그렇게 말하십시오
  - 내가 베냐민에게 말한 것처럼 그렇게 말하십시오
  lexicon: ἐξηγέομαι
  rationale: 최종 수정본의 영어처럼 목적어 'it'을 보충하지 않고, 그리스어의 단순한 '베냐민에게 설명했다'는 구조를 그대로 반영했습니다.
theological_decisions:
- issue: 고대 서신적·훈계적 발화의 직설 명령문 처리
  chosen_reading: 한국어 본문도 직접적인 금지와 지시를 유지해, 화자의 긴급한 요청이 약화되지 않도록 했습니다.
  alternative_readings:
  - 완곡하게 '말해 주지 마십시오'로 완화
  - 서술형으로 바꾸어 '말하면 안 됩니다'로 처리
  rationale: 원문은 청자에게 분명한 명령을 두 번 사용하므로, 완곡화보다 직접 명령형이 본문 기능을 더 잘 보존합니다.
  doctrine_reference: 서사 문맥 보존 및 담화 기능 충실성
