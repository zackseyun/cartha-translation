id: T12P.BEN.10.3
reference: Testament of Benjamin 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ποιήσατε οὖν¹¹ ἀλήθειαν *ἕκαστος πρὸς τὸν πλησίον αὐτοῦ¹², Γκαὶ τὸν νόμον Κυρίου, καὶ τὰς ἐντολὰς αὐτοῦ¹³ φυλάξατε˥.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/003.yaml
  text: Therefore, each one should practice truth toward his neighbor, and keep the law of the Lord and his commandments.
translation:
  language: ko
  text: 그러므로 각 사람은 자기 이웃에게 진리를 행하고, 주님의 율법과 그의 명령들을 지키십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσατε ... ἀλήθειαν
  english_pob_choice: practice truth
  chosen_korean: 진리를 행하고
  alternatives_korean:
  - 진리를 실천하고
  - 진리를 행하십시오
  lexicon: ποιέω / ἀλήθεια
  rationale: 직역의 ‘하다’보다 POB의 ‘practice truth’를 살려, 진리를 단지 말하는 것이 아니라 삶으로 드러내는 행위를 자연스럽게 표현했습니다.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  english_pob_choice: each one toward his neighbor
  chosen_korean: 각 사람은 자기 이웃에게
  alternatives_korean:
  - 각 사람은 그의 이웃에게
  - 각자 자기 이웃에게
  lexicon: ἕκαστος / πλησίον
  rationale: 주체성을 분명히 하면서도 현대 한국어에서 자연스러운 ‘자기 이웃에게’를 택해 관계 방향을 살렸습니다.
- source_word: τὸν νόμον Κυρίου
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 율례
  lexicon: νόμος / κύριος
  rationale: 여기서는 일반적 ‘법’보다 문맥상 규범적·성경적 의미가 강한 ‘율법’이 원문에 더 가깝습니다.
- source_word: τὰς ἐντολὰς αὐτοῦ
  english_pob_choice: his commandments
  chosen_korean: 그의 명령들을
  alternatives_korean:
  - 그의 계명들을
  - 그의 명령
  lexicon: ἐντολή
  rationale: 원문은 복수형이며, 앞의 ‘율법’과 병렬되는 별개 항목이므로 복수성을 드러냈습니다.
theological_decisions:
- issue: 주님(Κυρίου) 표기
  chosen_reading: 주님의
  alternative_readings:
  - 주의
  - 야훼의
  rationale: 이 문맥의 Κυρίου는 직접 인용되는 여호와-인용 표지라기보다 일반적인 신적 주권자 칭호로 읽는 것이 자연스러워, 본문에서는 ‘주님’으로 두었습니다.
  doctrine_reference: 일반 호칭/문맥상 신적 칭호
- issue: 행위 명령의 어조
  chosen_reading: 하십시오체의 권면
  alternative_readings:
  - 하라체
  - 해야 합니다
  rationale: 본문 전체가 공동체 권면이므로, 현대 표준어의 합쇼체 명령·권면으로 옮기되 원문의 명령성을 유지했습니다.
  doctrine_reference: 문체/화행
