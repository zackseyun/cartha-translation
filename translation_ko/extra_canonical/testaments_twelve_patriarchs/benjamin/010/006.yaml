  source_fidelity: 인명 열거와 미래의 ‘보게 될 것’ 및 ‘그의 오른편’은 대체로 충실합니다. 그러나 ἀνασταμένους는 ‘일어나 있는’보다 ‘일어난’으로 옮기는 편이 완료분사의 선행된 일어남을 더 정확히 반영합니다. ἐν ἀγαλλιάσει는 단순한 ‘기쁨 가운데’보다 기뻐하는 행위를 분명히 드러내는 표현이 자연스럽습니다.
  naturalness: ‘그리고 그때’는 다소 중복적으로 들리며, ‘기쁨 가운데 일어나 있는 것’은 한국어에서 수식 관계가 흐립니다. ‘그때 … 기뻐하며 그의 오른편에 일어난 것을’은 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: 에녹, 셋, 아브라함, 이삭, 야곱 및 ‘오른편’은 적절합니다. 본문은 ‘그’가 누구인지 명시하지 않으므로 이를 추가로 특정하지 않았습니다.
  issues:
