lexical_decisions:
- source_word: ὄψεσθε
  english_pob_choice: you will see
  chosen_korean: 보게 될 것입니다
  alternatives_korean:
  - 보게 됩니다
  - 볼 것입니다
  lexicon: ὁράω
  rationale: 미래에 직접 목격하는 뜻을 자연스럽게 살리되, 예언적 진술의 장중함을 유지했습니다.
- source_word: ἀνασταμένους
