  - 일으켜 세워진
  lexicon: ἀνίστημι
  rationale: 본문의 인물들이 ‘부활하여 일어난 상태’임을 드러내면서도, 동사의 결과 상태를 한국어로 과도하게 해석하지 않도록 했습니다.
- source_word: ἐκ δεξιῶν
  english_pob_choice: at his right hand
  chosen_korean: 그의 오른편에서
  alternatives_korean:
  - 그의 오른쪽에서
  - 그의 우편에서
  lexicon: δεξιός
  rationale: ‘오른편’은 성서적 표현을 살리면서도 현대 한국어에서 충분히 자연스럽습니다.
- source_word: ἐν ἀγαλλιάσει
  english_pob_choice: in rejoicing
  chosen_korean: 기쁨 가운데
  alternatives_korean:
  - 환희 가운데
  - 기뻐하며
  lexicon: ἀγαλλίασις
  rationale: 단순한 감정보다 넘치는 기쁨의 상태를 나타내는 표현으로 옮겼습니다.
