    issue: ἀνασταμένους의 결과 상태 표현
    rationale: ‘일어나 있는’도 가능한 번역이나, 완료분사는 이들이 이미 일어난 상태가 된 것을 가리키므로 ‘일어난’이 더 직접적입니다.
  - severity: low
    issue: ἐν ἀγαλλιάσει의 한국어 수식 관계
    rationale: ‘기쁨 가운데’는 무엇을 수식하는지 다소 흐리므로 ‘기뻐하며’로 옮겨 기쁨의 동반 상황을 명료하게 합니다.
