review_pass:
  verdict: revise
  source_fidelity: 첫 절의 ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν은 이스라엘을 수식하기보다 ‘민족들 가운데 택함을 받은 이들’이라는 별도 집단 가운데서 이스라엘을 책망한다는 구조입니다. 또한 τοῖς ἀπατήσασιν은 마디안 사람들을 수식하므로, ‘그들’이라는 느슨한 대명사보다 이를 명시할 필요가 있습니다. 대괄호 안의 전승은 문법적으로 불안정하고 지시 대상도 확정하기 어려우므로, 보완 해석을 가하지 않고 대괄호 및 주석으로 불확실성을 보존했습니다.
  naturalness: 합쇼체의 자연스러운 문장으로 정리했습니다. 다만 대괄호 안은 원문 자체가 불완전하거나 전승상 불안정한 구절이므로, ‘그렇게’라는 최소한의 연결 표현을 사용하여 원문에 없는 목적어나 지시 대상을 확정하지 않았습니다.
  terminology: ἐλέγχω는 여기서 ‘책망하다’로 유지할 수 있습니다. ἐκλεκτοί는 ‘택함을 받은 이들’, ἀπηλλοτριώθησαν Θεοῦ는 수동 관계 단절을 드러내는 ‘하나님에게서 소외되었고’, μερίς는 ‘몫에 속한’으로 옮겼습니다. Κύριος는 기존 호칭 관례에 맞추어 ‘주’로 유지했습니다.
  issues:
  - severity: high
    issue: ‘이방 민족들 가운데서 택하심을 받은 이스라엘’은 수식 관계를 바꿉니다.
    rationale: 그리스어에서 ‘이스라엘’은 ἐλέγξει의 목적어이고, ‘민족들의 택함 받은 이들’은 ἐν으로 이끄는 별도 전치사구입니다.
  - severity: high
    issue: 대괄호 전승의 수동태와 불명확한 연결이 인과적 능동 표현으로 바뀌었습니다.
    rationale: 초안의 ‘멀어지게 되었고’는 문맥상 인과를 확정하며, 대괄호와 원문의 전승상·문법상 불안정성도 표시하지 않습니다. 원문은 ‘하나님에게서 소외되었다’는 수동 표현입니다.
  - severity: medium
    issue: ‘그들은’의 선행사가 불분명합니다.
    rationale: ‘형제들을 속인’ 주체는 마디안 사람들입니다. 이 수식 관계를 명시해야 비교절의 기본 구조가 보존됩니다.
  - severity: medium
    issue: 본문의 [a] 표지에 대응하는 각주가 없습니다.
    rationale: 매달린 각주 표지는 구조상 불완전합니다. 대괄호 전승의 불안정성과 번역 방침을 설명하는 각주를 제공해야 합니다.
  revised_text: 그는 민족들 가운데서 택함을 받은 이들 사이에서 이스라엘을 책망하실 것입니다. 이는 그들의 형제들을 속인 마디안 사람들 가운데서 에서를 책망하신 것과 같습니다. [그들이 음행과 우상 숭배를 통하여 그렇게 되었고 하나님에게서 소외되었으며,] 그리하여 주를 경외하는 이들의 몫에 속한 자녀가 되었습니다.[a]
  revised_footnotes:
  - marker: a
    text: 대괄호 안의 구절은 전승상 불안정하며 문법적 연결과 복수 대명사의 지시 대상이 분명하지 않습니다. 번역은 이를 본문 밖으로 삭제하거나 특정 인물 집단으로 확정하지 않고, 원문의 대괄호와 불명확성을 유지합니다. ‘그렇게’는 원문의 목적보어가 명시되지 않은 γενέσθαι(‘되다’)를 보완하지 않기 위한 최소한의 연결 표현입니다.
    reason: 원문 대괄호 전승을 투명하게 표시하고, 본문에 있던 매달린 [a] 표지를 유효한 각주로 연결합니다.
  revision_rationale: 수정본은 ‘택함을 받은 이들’과 ‘이스라엘’의 문법 관계를 바로잡고, 마디안 사람들이 형제들을 속였다는 수식 관계를 명시했습니다. 또한 논쟁적·불안정한 대괄호 전승을 삭제하거나 교리적으로 해석하지 않고, 수동태와 불확정성을 보존했습니다.
