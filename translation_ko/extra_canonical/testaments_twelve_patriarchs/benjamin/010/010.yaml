id: T12P.BEN.10.10
reference: Testament of Benjamin 10:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐλέγξει ἐν τοῖς ἐκλεκτοῖς *τῶν ἐθνῶν⁵⁸ τὸν Ἰσραήλ, ὥσπερ ἤλεγξεν τὸν Ἡσαῦ ἐν τοῖς Μαδιωαίοις τοῖς †ἀπατήσασιν⁵⁹ *ἀδελφοὺς αὐτῶν⁶⁰ [γενέσθαι διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας, καὶ⁶¹ ἀπηλλοτριώθησαν Θεοῦ]⁶², γενόμενοι⁶³ οὖν⁶⁴ τέκνα ἐν μερίδι φοβουμένων⁶⁵ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/010.yaml
  text: And he will convict Israel among the chosen of the nations, just as he convicted Esau among the Midianites, who deceived their brothers [to become through fornication and idolatry, and they were alienated from God], thus becoming children in the portion of those who fear the Lord.
translation:
  language: ko
  text: 그러면 이방 민족들 가운데서 택하심을 받은 이스라엘을 책망하실 것이며, 마치 마디안 사람들 가운데서 에서를 책망하신 것과 같습니다. 그들은 형제들을 속여 음행과 우상숭배를 통해 하나님에게서 멀어지게 되었고, 마침내 주를 경외하는 자들의 몫 안에서 자녀가 되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλέγξει
  english_pob_choice: will convict
  chosen_korean: 책망하실 것이며
  alternatives_korean:
  - 정죄하실 것이며
  - 드러내실 것이며
  - 깨우치실 것이며
  lexicon: ἐλέγχω
  rationale: 문맥상 단순한 꾸짖음보다 잘못을 드러내어 바로잡는 강한 책무를 나타내므로, POB의 ‘convict’를 한국어로 자연스럽게 옮긴 ‘책망하다’를 택했습니다.
- source_word: ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν
  english_pob_choice: among the chosen of the nations
  chosen_korean: 이방 민족들 가운데서 택하심을 받은
  alternatives_korean:
  - 열방의 택하신 자들 가운데서
  - 민족들 가운데 택함 받은
  - 이방인들 중 택하신 자들 가운데서
  lexicon: ἐκλεκτός / ἔθνη
  rationale: ‘민족들’의 범위를 살리면서도 하나님의 선택 개념을 분명히 드러내기 위해 ‘택하심을 받은’을 사용했습니다.
- source_word: ἀπηλλοτριώθησαν Θεοῦ
  english_pob_choice: they were alienated from God
  chosen_korean: 하나님에게서 멀어지게 되었고
  alternatives_korean:
  - 하나님에게서 멀어졌고
  - 하나님으로부터 소원해졌고
  - 하나님에게서 끊어졌고
  lexicon: ἀπαλλοτριόω
  rationale: 관계적 분리를 뜻하는 표현으로, 단절의 결과를 한국어에서 가장 자연스럽게 드러내는 ‘멀어지다’를 택했습니다.
- source_word: μερίδι φοβουμένων Κύριον
  english_pob_choice: in the portion of those who fear the Lord
  chosen_korean: 주를 경외하는 자들의 몫 안에서
  alternatives_korean:
  - 주를 경외하는 이들의 몫 안에서
  - 주를 두려워하는 자들의 분깃 안에서
  - 주를 경외하는 자들의 분깃 가운데
  lexicon: μερίς / φοβέομαι + Κύριος
  rationale: ‘portion’의 상속·배분 이미지를 살리되 한국어에서 문맥상 자연한 ‘몫’을 택했고, Κύριος는 본문 전체의 주격 호칭에 맞춰 ‘주’로 옮겼습니다.
theological_decisions:
- issue: ‘형제들’의 주체가 누구인지와 bracketed clause의 처리
  chosen_reading: 본문의 괄호절을 유지해, 형제들을 속인 행위가 음행과 우상숭배를 통해 하나님에게서 멀어지는 결과로 이어졌음을 함께 보이도록 했습니다.
  alternative_readings:
  - 괄호절을 생략해 매끄럽게 번역
  - ‘형제들’ 주어를 에서의 형제들로 구체화
  rationale: 원문이 괄호로 보존한 전승상의 덧붙임을 삭제하면 텍스트의 긴장과 해석 가능성이 약화되므로, POB의 주석적 투명성을 살려 유지했습니다.
  doctrine_reference: textual transparency
