id: T12P.BEN.10.8
reference: Testament of Benjamin 10:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ οἱ⁴³ πάντες ἀναστήσονται, οἱ μὲν εἰς δόξαν, οἱ δὲ εἰς ἀτιμίαν, καὶ κρινεῖ Κύριος⁴⁴ ἐν πρώτοις τὸν Ἰσραὴλ⁴⁵ περὶ τῆς *ἀδικίας αὐτῶν⁴⁶ [ὅτι παραγενόμενον⁴⁷ Θεὸν⁴⁴ ἐν σαρκί⁴⁸, οὐκ ἐπίστευσαν αὐτῷ⁴⁹].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/008.yaml
  text: And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first concerning their unrighteousness, [because when God came to them in flesh, they did not believe him].
translation:
  language: ko
  text: 그리고 모든 사람이 일어날 것입니다. 어떤 이들은 영광으로, 어떤 이들은 수치로 일어날 것이며, 주님께서 먼저 이스라엘의 불의에 대해 그들을 심판하실 것입니다. [하나님께서 육신으로 그들에게 오셨을 때 그들이 그분을 믿지 않았기 때문입니다].[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσονται
  english_pob_choice: will rise
  chosen_korean: 일어날 것입니다
  alternatives_korean:
  - 부활할 것입니다
  - 일어날 것입니다
  lexicon: ἀνίστημι
  rationale: 죽은 자의 종말론적 ‘일어남’을 자연스럽게 살리되, 본문이 단순한 기상보다 부활/소생의 종말론을 가리킨다는 점을 유지했습니다.
- source_word: δόξαν / ἀτιμίαν
  english_pob_choice: glory / dishonor
  chosen_korean: 영광 / 수치
  alternatives_korean:
  - 영광 / 불명예
  - 영광 / 수치
  lexicon: δόξα / ἀτιμία
  rationale: 대조 구조를 한국어에서도 선명하게 살리기 위해 전형적 대응어를 쓰되, ‘불명예’보다 수치의 도덕·사회적 뉘앙스가 본문에 더 가깝다고 보았습니다.
- source_word: κρineῖ Κύριος
  english_pob_choice: the Lord will judge
  chosen_korean: 주님께서 … 심판하실 것입니다
  alternatives_korean:
  - 주님께서 … 판단하실 것입니다
  - 주님께서 … 심판하실 것입니다
  lexicon: κύριος / κρίνω
  rationale: κύριος는 문맥상 하나님을 가리키므로 ‘주님’으로 옮겼고, κρίνω는 단순 판정보다 법정적 심판이 강해 ‘심판하실 것입니다’가 가장 적절합니다.
- source_word: ἀδικίας
  english_pob_choice: their unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불의
  - 불의함
  lexicon: ἀδικία
  rationale: 개인의 상태를 표현하는 추상명사로서 ‘불의’가 가장 간결하며, 공동체의 죄책을 드러내는 문맥에 맞습니다.
- source_word: ἐν σαρκί
  english_pob_choice: in flesh
  chosen_korean: 육신으로
  alternatives_korean:
  - 육신 안에서
  - 육신으로
  lexicon: σάρξ
  rationale: ‘하나님이 육신으로 오셨다’는 구절의 충격을 살리면서도, 인격적 현현을 뜻하는 문맥을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 본문의 종말론적 일반 부활 진술
  chosen_reading: ‘모든 사람이 일어날 것입니다’로 일반적 종말의 부활/소생을 열어 두었습니다.
  alternative_readings:
  - ‘모든 사람이 부활할 것입니다’로 명시
  - ‘모든 사람이 일어설 것입니다’로 완화
  rationale: 원문은 단순한 기상보다 종말론적 부활을 가리키지만, 한국어에서 너무 교리화된 용어를 고정하지 않고 문맥이 드러나는 수준으로 번역했습니다.
  doctrine_reference: 종말론/부활
