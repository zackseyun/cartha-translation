revisions:
- from: 그리고 모든 사람이 일어날 것입니다. 어떤 이들은 영광으로, 어떤 이들은 수치로 일어날 것이며, 주님께서 먼저 이스라엘의 불의에 대해 그들을 심판하실 것입니다. [하나님께서 육신으로 그들에게 오셨을 때 그들이 그분을 믿지 않았기 때문입니다].[a][b]
  to: 그리고 모두가 일어날 것입니다. 어떤 이들은 영광에 이르고, 어떤 이들은 수치에 이를 것입니다. 주님께서 먼저 그들의 불의 때문에 이스라엘을 심판하실 것입니다. [하나님께서 육신을 입고 그들에게 오셨을 때, 그들이 그분을 믿지 않았기 때문입니다.]
  rationale: The revision keeps the source's universal rising, the glory/dishonor contrast, the priority of Israel in judgment, and the bracketed causal clause. It clarifies that Israel—not an unclear pronoun—is judged concerning its unrighteousness, improves formal Korean flow, and removes unsupported footnote anchors. The supplied audit-trail revision is unrelated to the present Greek source and has not been followed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft generally follows the supplied Greek and English audit text. However, the object of ''judge'' is syntactically obscured in Korean: the Greek says that the Lord will judge Israel first, with their unrighteousness as the matter concerning which Israel is judged. The bracketed causal clause is correctly retained as bracketed material.'
  naturalness: The repeated '일어날 것입니다' is grammatically possible but unnecessarily heavy. The phrase '이스라엘의 불의에 대해 그들을 심판하실' has an unclear pronoun antecedent and is less natural than directly making Israel the object of judgment.
  terminology: '''영광,'' ''수치,'' ''불의,'' ''주님,'' and ''심판'' are appropriate modern formal-polite renderings. ''육신을 입고 오셨을 때'' naturally conveys ἐν σαρκί in this context without adding a doctrinal gloss.'
  issues:
  - severity: medium
    issue: The main-clause syntax makes the object of judgment unclear.
    rationale: κρίνει ... τὸν Ἰσραήλ requires Israel to be presented as the direct object of the Lord's judgment; '그들을' after '이스라엘의 불의' is potentially ambiguous in Korean.
  - severity: low
    issue: The draft contains unexplained [a][b] anchors.
    rationale: No corresponding footnote entries are provided. Removing unsupported anchors resolves the dangling-anchor problem without affecting the bracketed textual material or passage meaning.
  - severity: low
    issue: The resurrection clause is repetitious in Korean.
    rationale: Rendering the two εἰς clauses as destinations/states after the initial 'will rise' preserves the Greek contrast more idiomatically.
  revised_text: 그리고 모두가 일어날 것입니다. 어떤 이들은 영광에 이르고, 어떤 이들은 수치에 이를 것입니다. 주님께서 먼저 그들의 불의 때문에 이스라엘을 심판하실 것입니다. [하나님께서 육신을 입고 그들에게 오셨을 때, 그들이 그분을 믿지 않았기 때문입니다.]
  revised_footnotes: []
  revision_rationale: The revision keeps the source's universal rising, the glory/dishonor contrast, the priority of Israel in judgment, and the bracketed causal clause. It clarifies that Israel—not an unclear pronoun—is judged concerning its unrighteousness, improves formal Korean flow, and removes unsupported footnote anchors. The supplied audit-trail revision is unrelated to the present Greek source and has not been followed.
