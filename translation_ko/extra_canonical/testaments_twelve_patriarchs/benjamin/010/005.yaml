id: T12P.BEN.10.5
reference: Testament of Benjamin 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ πάντα δέδωκαν ἡμῖν εἰς κληρονομίαν¹⁹ *εἰπόντες· Φυλάξατε τὰς ἐντολὰς τοῦ Θεοῦ²⁰ ἕως ὅτου²¹ ἀποκαλύψει [Κύριος τὸ σωτήριον αὐτοῦ πᾶσι τοῖς ἔθνεσι].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/005.yaml
  text: For they gave us all these things as an inheritance, saying, ‘Keep the commandments of God until the time when [the Lord reveals his salvation to all the nations].’
translation:
  language: ko
  text: 그들이 우리에게 이 모든 것을 유산으로 주며 말하기를, “하나님의 계명을 지키십시오. [주께서 그의 구원을 모든 민족에게] 나타내실 때까지.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκαν ἡμῖν εἰς κληρονομίαν
  english_pob_choice: they gave us all these things as an inheritance
  chosen_korean: 우리에게 이 모든 것을 유산으로 주며
  alternatives_korean:
  - 우리에게 이 모든 것을 상속으로 주며
  - 우리에게 이 모든 것을 기업으로 주며
  lexicon: κληρονομία
  rationale: κληρονομία는 단순한 ‘선물’보다 상속·유산의 관념이 강하므로, 현대 한국어에서는 자연스럽고 법적·가족적 뉘앙스를 살릴 수 있는 ‘유산’으로 옮겼습니다.
- source_word: τὰς ἐντολὰς τοῦ Θεοῦ
  english_pob_choice: the commandments of God
  chosen_korean: 하나님의 계명
  alternatives_korean:
  - 하나님의 명령
  - 하나님의 규례
  lexicon: ἐντολή
  rationale: ἐντολάς는 윤리적 권고보다 규범적 명령을 가리키지만, 한국어 성경 문맥에서 ‘계명’이 가장 직접적으로 대응합니다.
- source_word: ἕως ὅτου ἀποκαλύψει
  english_pob_choice: until the time when [the Lord reveals his salvation to all the nations]
  chosen_korean: '[주께서 그의 구원을 모든 민족에게] 나타내실 때까지'
  alternatives_korean:
  - '[주께서 그의 구원을 모든 민족에게] 드러내실 때까지'
  - '[주께서 그의 구원을 모든 민족에게] 계시하실 때까지'
  lexicon: ἀποκαλύψει
  rationale: ἀποκαλύψει는 ‘계시하다’도 가능하지만, 한국어에서는 ‘구원을 드러내다/나타내다’가 구원 사건의 공개성을 더 자연스럽게 전달합니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 야훼께서
  lexicon: κύριος
  rationale: 이 절의 대괄호 안 문구는 LXX적 야훼 인용 가능성이 있으나, 현재 본문은 보존된 그리스어 전승의 표면형을 따르고 있으므로 인용 확정 없이 ‘주’로 번역했습니다.
theological_decisions:
- issue: 대괄호 안 삽입문구의 번역 범위
  chosen_reading: 본문에 보존된 삽입문구를 그대로 유지해 “[주께서 그의 구원을 모든 민족에게]”로 옮겼습니다.
  alternative_readings:
  - 이 절을 대괄호 없이 한 문장으로 매끄럽게 재구성함
  - 삽입문구를 각주로만 처리함
  rationale: 이 전승은 본문 비평상 불확정 요소를 드러내므로, 대괄호를 유지해 독자가 문장 핵심과 전승의 경계를 함께 보도록 했습니다.
  doctrine_reference: textual criticism / transparency
- issue: ‘모든 민족’의 보편 범위
  chosen_reading: ‘모든 민족’으로 직역해 구원의 보편적 향방을 보존했습니다.
  alternative_readings:
  - ‘열방에게’
  - ‘모든 나라에’
  rationale: ἔθνεσι는 이 문맥에서 특정 민족 집단이 아니라 열방 전체를 가리키므로, 보편성을 분명히 하는 ‘모든 민족’이 적절합니다.
  doctrine_reference: missional universality
