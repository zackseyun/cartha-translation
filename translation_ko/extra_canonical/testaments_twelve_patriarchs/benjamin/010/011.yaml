revisions:
- from: 그러므로 여러분, 내 자녀들아, 여러분이 주님의 계명들 안에서 거룩함 가운데 걸어가면, 여러분은 다시 나와 함께 소망 가운데 거주하게 될 것이며, 온 이스라엘이 주님께 모일 것입니다.
  to: 그러므로 내 자녀들아, 너희가 주님의 계명들 안에서 거룩함 가운데 살아가면, 너희는 다시 내 안에서 소망 가운데 거하게 될 것이며, 온 이스라엘은 주님께 모일 것입니다.
  rationale: 'The revision removes an unrepresented and redundant audience address, makes the conduct idiom natural in modern formal Korean, and most importantly restores the explicit force of ἐν ἐμοί as “내 안에서.” It retains the source''s sequence and ambiguity: holiness in the Lord''s commandments, dwelling again in hope in Benjamin, and all Israel being gathered toward the Lord.'
