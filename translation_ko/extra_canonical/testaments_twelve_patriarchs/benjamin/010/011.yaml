  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⌜Ὑμεῖς οὖν, τέκνα μου⁶⁷, ἐὰν⁶⁸ πορευθῆτε⁶⁹ ἐν ἁγιασμῷ ⌜*ἐν ταῖς ἐντολαῖς⁷⁰ Κυρίου⌝, πάλιν κατοικήσετε⁷¹ ⌜ἐπʼ ἐλπίδι⌝ *ἐν ἐμοί⁷², καὶ συναχθήσεται⁷³ *πρὸς Κύριον⁷⁴ πᾶς Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/011.yaml
  text: You therefore, my children, if you walk in holiness in the commandments of the Lord, you will again dwell in hope with me, and all Israel will be gathered to the Lord.
translation:
  language: ko
  text: 그러므로 여러분, 내 자녀들아, 여러분이 주님의 계명들 안에서 거룩함 가운데 걸어가면, 여러분은 다시 나와 함께 소망 가운데 거주하게 될 것이며, 온 이스라엘이 주님께 모일 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἁγιασμῷ
  english_pob_choice: walk in holiness
  chosen_korean: 거룩함 가운데 걸어가면
  alternatives_korean:
  - 거룩함 안에서 걸어가면
  - 성결 가운데 걸어가면
  lexicon: ἁγιασμός
  rationale: ἁγιασμῷ는 상태로서의 거룩함을 가리키므로 ‘성결’보다 더 직접적인 ‘거룩함’이 적합하며, 동사 πορευθῆτε의 지속적 삶의 행위를 ‘걸어가다’로 살렸습니다.
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  english_pob_choice: in the commandments of the Lord
  chosen_korean: 주님의 계명들 안에서
  alternatives_korean:
  - 주님의 계명들 속에서
  - 주님의 계명에 따라
  lexicon: ἐν + ἐντολαί
  rationale: 개정판의 ‘according to’보다 그리스어 전치사구의 직설성을 살려 ‘안에서’로 옮겼고, 복수형 ‘계명들’을 유지했습니다.
- source_word: ἐπʼ ἐλπίδι
  english_pob_choice: in hope
  chosen_korean: 소망 가운데
  alternatives_korean:
  - 소망 안에서
  - 기대 가운데
  lexicon: ἐλπίς
  rationale: ἐλπίδι는 ‘희망/소망’의 상태를 나타내므로 ‘소망’이 적절하며, 한국어에서는 자연스러운 상태 표현인 ‘가운데’로 옮겼습니다.
- source_word: συναχθήσεται πρὸς Κύριον
  english_pob_choice: will be gathered to the Lord
  chosen_korean: 주님께 모일 것입니다
  alternatives_korean:
  - 주님께로 모일 것입니다
  - 주님 앞으로 모일 것입니다
  lexicon: συνάγω + πρός
  rationale: ‘모이다’가 공동체적 수집을 가장 자연스럽게 드러내며, πρός는 방향성을 살려 ‘께’로 옮겼습니다.
theological_decisions:
- issue: Κύριος의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 구절의 Κυρίου / Κύριον은 명시적 야훼 인용 표지가 없고 서간체적 권면 문맥이므로, 독자 친화적이면서도 주어의 존귀를 보존하는 ‘주님’으로 통일했습니다.
  doctrine_reference: 일반적 호칭 유지; YHWH 인용 표지 없음
- issue: ἐν ἐμοί의 의미
  chosen_reading: 나와 함께
  alternative_readings:
  - 내 안에서
  - 내 안에
  rationale: 직역하면 ‘내 안에’이지만, 뒤의 ‘거주하게 될’과 결합할 때 한국어에서 오해를 줄이면서도 동거/동참의 의미를 살리기 위해 ‘나와 함께’로 풀었습니다.
  doctrine_reference: 공동체적 연합 표현
