revisions:
- from: 요셉이 이집트에 있을 때, 나는 그의 모습과 얼굴의 형상을 보고 싶어 했습니다. 그리고 아버지 야곱의 기도들을 통해, 낮에 깨어 있는 중에 그를 보았는데, 그의 온모습이 바로 그러했습니다.[a]
  to: 요셉이 이집트에 있을 때, 나는 그의 모습과 얼굴의 형태를 보고 싶어 했습니다. 아버지 야곱의 기도를 통해 나는 낮에 깨어 있을 때 그의 온 모습 그대로 그를 보았습니다.
  rationale: 마지막 절을 ‘그의 온 모습 그대로 그를 보았습니다’로 재구성하여, 깨어 있는 낮에 본 요셉의 모습이 실제 그의 전체 모습과 같았다는 원문의 비교·일치 관계를 명료하게 했습니다. 불필요하고 내용이 없는 각주 표지는 삭제했습니다.
