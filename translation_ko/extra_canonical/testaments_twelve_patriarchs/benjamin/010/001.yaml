id: T12P.BEN.10.1
reference: Testament of Benjamin 10:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: X. Ὅτε¹ δὲ *ἦν Ἰωσὴφ ἐν Αἰγύπτῳ², ἐπεθύμουν ἰδεῖν τὴν εἰδέαν³ αὐτοῦ Γκαὶ τὴν μόρφωσιν⁴ τῆς ὄψεως αὐτοῦ⁵. καὶ δι᾽ εὐχῶν Ἰακὼβ τοῦ πατρός μου⁶ εἶδον Γαὐτόν, ἐν ἡμέρᾳ γρηγορῶν, *καθ᾽ ὃ ἦν⁶ πᾶσα⁷ ἡ εἰδέα⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/001.yaml
  text: Now when Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, just as his whole appearance was.
translation:
  language: ko
  text: 요셉이 이집트에 있을 때, 나는 그의 모습과 얼굴의 형상을 보고 싶어 했습니다. 그리고 아버지 야곱의 기도들을 통해, 낮에 깨어 있는 중에 그를 보았는데, 그의 온모습이 바로 그러했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον τὴν εἰδέαν αὐτοῦ καὶ τὴν μόρφωσιν τῆς ὄψεως αὐτοῦ
  english_pob_choice: I longed to see his appearance and the form of his face
  chosen_korean: 그의 모습과 얼굴의 형상
  alternatives_korean:
  - 그의 외모와 얼굴의 모양
  - 그의 용모와 얼굴의 형체
  lexicon: εἰδέα, μόρφωσις, ὄψις
  rationale: 두 표현이 서로 겹치면서도 미묘하게 다른 시각적 형상성을 강조하므로, 단순히 하나로 합치지 않고 ‘모습’과 ‘얼굴의 형상’으로 나누어 원문의 중첩을 살렸습니다.
- source_word: δι᾽ εὐχῶν Ἰακὼβ τοῦ πατρός μου
  english_pob_choice: through the prayers of Jacob my father
  chosen_korean: 아버지 야곱의 기도들을 통해
  alternatives_korean:
  - 아버지 야곱의 기도를 통해
  - 아버지 야곱의 기원들로 말미암아
  lexicon: εὐχαί
  rationale: 복수형 ‘기도들’을 그대로 반영해, 단일한 일반명사로 평탄화하지 않고 여러 차례의 기도를 가리키는 뉘앙스를 유지했습니다.
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  english_pob_choice: while awake by day
  chosen_korean: 낮에 깨어 있는 중에
  alternatives_korean:
  - 낮에 깨어 있을 때
  - 낮 동안 깨어 있으면서
  lexicon: γρηγορέω
  rationale: ‘깨어 있는 중에’는 현재 진행적 상태를 자연스럽게 살리면서도, 꿈이 아니라 의식적으로 본 체험이라는 대비를 분명히 합니다.
- source_word: καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ
  english_pob_choice: just as his whole appearance was
  chosen_korean: 그의 온모습이 바로 그러했습니다
  alternatives_korean:
  - 그의 온모습이 그러했습니다
  - 그의 전체 모습이 바로 그러했습니다
  lexicon: πᾶσα + εἰδέα
  rationale: ‘just as’의 비교 감각을 살리면서 한국어에서 어색한 반복을 피하기 위해, 결론부를 ‘바로 그러했습니다’로 옮겨 앞의 묘사와 일치함을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 야곱의 기도가 환시의 매개로 제시되는 방식
  chosen_reading: 본문의 초점은 예언적 환시의 가능 근거를 야곱의 기도에 두는 서술로 유지했습니다.
  alternative_readings:
  - 단순히 상징적 표현으로 완화하는 읽기
  - 기도의 효력을 약화시키는 일반적 서술로 바꾸는 읽기
  rationale: 원문은 ‘기도들을 통해’라는 매개 표현을 분명히 하므로, 이를 완화하지 않고 그대로 보존하는 것이 서술의 신학적 긴장을 가장 잘 드러냅니다.
  doctrine_reference: 성경 외 문헌의 환시/중보 기도 서술
- issue: ‘온모습’의 반복적 강조
  chosen_reading: 마지막 절은 앞의 ‘모습/얼굴의 형상’을 요약하며 동일성을 강조하는 문장으로 읽었습니다.
  alternative_readings:
  - 단순한 재진술로 약화시키는 읽기
  - ‘정확히’ 같은 부사로 의미를 과도하게 규정하는 읽기
  rationale: 개정된 영어 POB가 ‘exactly as’에서 ‘just as’로 조정한 흐름에 맞추어, 한국어도 과도한 정밀성보다 일치의 자연스러운 강조를 살렸습니다.
  doctrine_reference: 문학적 평행법과 시각적 환시 묘사
