review_pass:
  verdict: revise
  source_fidelity: 원문의 시간적 분사구문(‘이것들을 말한 뒤’)과 이어지는 발화, οὖν의 추론적 연결, τέκνα μου의 친근한 복수 호칭, 그리고 현재형 ἀποθνῄσκω의 진행성을 대체로 충실히 반영했습니다. 다만 γινώσκετε는 복수 명령형이므로 표준 합쇼체 명령으로 더 자연스럽고 분명하게 옮기는 것이 좋습니다.
  naturalness: ‘너희가 알라’는 현대 표준어 합쇼체로는 부자연스럽고 문어적·고풍스럽게 들립니다. ‘알아 두십시오’는 유언적 권고의 직접성을 유지하면서 현대적이고 자연스럽습니다.
  terminology: ‘내 자녀들아’는 τέκνα μου의 호칭을 적절히 보존합니다. ‘죽어 가고 있다’는 현재형의 임박하고 진행적인 죽음의 뉘앙스를 무리 없이 반영합니다.
  issues:
