translation:
  language: ko
  text: 이런 말들을 하고 나서 그는 그들에게 말했습니다. “그러므로 내 자녀들아, 내가 죽어 가고 있음을 너희가 알라.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ταῦτα εἰπὼν λέγει αὐτοῖς
  english_pob_choice: And after saying these things he said to them
  chosen_korean: 이런 말들을 하고 나서 그는 그들에게 말했습니다
  alternatives_korean:
  - 그리고 이런 것들을 말한 뒤 그가 그들에게 말했습니다
  - 이 말을 하고 나서 그는 그들에게 말했습니다
  lexicon: καί / ταῦτα εἰπών / λέγει αὐτοῖς
  rationale: 시간 순서를 드러내는 '하고 나서'로 보존하고, 반복된 말하기 동사를 자연스러운 서술형으로 옮겼습니다.
- source_word: τέκνα μου
  english_pob_choice: my children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자식들아
  lexicon: τέκνα
  rationale: 호칭으로 직접 부르는 복수형을 살리면서, 한국어에서 자연스러운 친밀한 부름인 '자녀들아'를 택했습니다.
- source_word: ἀποθνῄσκω
  english_pob_choice: I am dying
  chosen_korean: 내가 죽어 가고 있음을
  alternatives_korean:
  - 내가 죽고 있음을
  - 내가 곧 죽는다는 것을
  lexicon: ἀποθνῄσκω
  rationale: 진행 중인 죽음을 나타내는 현재형의 뉘앙스를 살려 '죽어 가고 있다'로 옮겼습니다.
theological_decisions:
- issue: 직설 화법의 명령형 뉘앙스
  chosen_reading: “그러므로 내 자녀들아, 내가 죽어 가고 있음을 너희가 알라.”
  alternative_readings:
  - “그러므로 내 자녀들아, 내가 죽어 가고 있음을 알아라.”
  - “그러므로 내 자녀들아, 내가 죽어 가고 있음을 너희는 알아야 한다.”
  rationale: 원문의 γινώσκετε는 단순 진술이 아니라 청자에게 지식을 촉구하는 직접 명령이므로, 예언적/유언적 발화의 긴박함을 유지했습니다.
  doctrine_reference: 담화 기능 보존
