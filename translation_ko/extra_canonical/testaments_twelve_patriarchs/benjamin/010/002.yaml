    rationale: γινώσκετε는 청자 복수에게 직접 요구하는 명령형입니다. ‘너희가 알라’는 현대 한국어에서 자연스럽지 않으며 목표 합쇼체와도 맞지 않습니다. ‘알아 두십시오’가 직접적 촉구와 현대 formal-polite register를 함께 살립니다.
