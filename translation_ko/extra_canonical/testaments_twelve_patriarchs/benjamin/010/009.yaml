id: T12P.BEN.10.9
reference: Testament of Benjamin 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ τότε κρινεῖ πάντα τὰ ἔθνη [ὅσα οὐκ ἐπίστευσαν αὐτῷ ἐπὶ τῆς⁵⁰ γῆς φανέντι⁵⁷].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/009.yaml
  text: And then he will judge all the nations, [as many as did not believe him when he appeared on earth].
translation:
  language: ko
  text: 그때 그분께서는 [땅에 나타나셨을 때 그분을 믿지 않은] 모든 민족을 심판하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρινεῖ
  english_pob_choice: he will judge
  chosen_korean: 심판하실 것입니다
  alternatives_korean:
  - 판단하실 것입니다
  - 재판하실 것입니다
  lexicon: κρίνω
  rationale: 미래 능동의 κρίνω는 여기서 단순한 판별이 아니라 종말론적 판결을 가리키므로, 한국어로는 ‘심판하다’가 가장 직접적입니다.
- source_word: πάντα τὰ ἔθνη
  english_pob_choice: all the nations
  chosen_korean: 모든 민족을
  alternatives_korean:
  - 모든 나라를
  - 모든 이방 민족을
  lexicon: ἔθνη
  rationale: ἔθνη는 문자적으로 ‘민족들’이며, 이 문맥에서는 개별 국가보다 집합적 민족 집단을 가리키므로 ‘민족’이 적절합니다.
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  english_pob_choice: did not believe him
  chosen_korean: 그분을 믿지 않은
  alternatives_korean:
  - 그분을 믿지 않았던
  - 그를 믿지 않은
  lexicon: πιστεύω
  rationale: πιστεύω의 기본 의미인 ‘믿다’를 유지하되, 목적어 대명사는 앞선 ‘그분’을 반복해 문맥상 대상을 분명히 했습니다.
- source_word: ἐπὶ τῆς γῆς φανέντι
  english_pob_choice: when he appeared on earth
  chosen_korean: 땅에 나타나셨을 때
  alternatives_korean:
  - 땅에 현현하셨을 때
  - 땅에서 드러나셨을 때
  lexicon: φαίνω
  rationale: φανέντι는 ‘나타나다/드러나다’의 수동 분사이므로, 인격적 현현을 자연스럽게 살려 ‘나타나셨을 때’로 옮겼습니다.
theological_decisions:
- issue: 구두 안의 보충 설명을 본문과 분리할지 여부
  chosen_reading: 대괄호 안의 절을 인용문으로 처리해 본문 의미를 유지했습니다.
  alternative_readings:
  - 대괄호 보충을 본문에 통합
  - 각주로만 처리
  rationale: 원문 자체가 괄호 보충을 포함한 형태이므로, 한국어 본문에서도 그 경계를 드러내어 텍스트 비평적 층위를 보존했습니다.
  doctrine_reference: 본문 비평 및 수용사적 표시
