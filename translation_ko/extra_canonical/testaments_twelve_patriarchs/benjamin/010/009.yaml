revisions:
- from: 그때 그분께서 믿지 않았던 모든 민족을 심판하실 것입니다. 「그분이 땅에 나타나셨을 때 그분을 믿지 않은 자들」입니다.[a]
  to: 그때 그분께서는 [땅에 나타나셨을 때 그분을 믿지 않은] 모든 민족을 심판하실 것입니다.
  rationale: 원문의 대괄호 범위를 보존하되, 그 안의 절을 ‘모든 민족’을 한정하는 한국어 관형절로 배치했습니다. 이에 따라 부자연스럽고 원문에 없는 인용 형식 및 ‘입니다’를 삭제했으며, 대응 각주가 없는 [a] 표지도 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:58Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 미래 동사 ‘κρινεῖ’와 ‘모든 민족’을 심판의 대상으로 삼는 구조는 대체로 반영되었으나, 대괄호 안의 한정절이 인용문 및 독립 서술문(‘입니다’)으로 바뀌어 원문의 문장 구조와 의미 관계가 훼손되었습니다.
  naturalness: ‘「…」입니다’는 앞 문장과 문법적으로 연결되지 않아 부자연스럽습니다. 대괄호 한정절을 ‘모든 민족’에 직접 연결하면 현대 표준 한국어 합쇼체로 자연스럽습니다.
  terminology: ‘심판하실 것입니다’, ‘모든 민족’, ‘믿지 않은’, ‘땅에 나타나셨을 때’는 각각 κρινεῖ, πάντα τὰ ἔθνη, οὐκ ἐπίστευσαν αὐτῷ, ἐπὶ τῆς γῆς φανέντι에 적절히 대응합니다.
  issues:
