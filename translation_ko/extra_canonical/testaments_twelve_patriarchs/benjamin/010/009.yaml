    rationale: 그리스어의 대괄호 절은 ‘모든 민족’을 한정하는 관계절이며, 발화 인용이나 정의문이 아닙니다. 현 번역은 문장 구조를 바꾸고 ‘입니다’의 지시 대상도 불분명하게 만듭니다.
  - severity: medium
    issue: 본문의 [a] 각주 표지에 대응하는 각주가 제공되지 않았습니다.
    rationale: 미제공 각주 표지는 구조적으로 불완전합니다. 원문 대괄호 자체로 보충/불확실성의 경계를 충분히 나타낼 수 있으므로 표지를 제거하는 것이 안전합니다.
