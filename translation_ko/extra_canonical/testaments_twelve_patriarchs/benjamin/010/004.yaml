  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ ὑμῖν ἀντὶ πάσης κληρονομίας καταλειμπάνω¹⁴. καὶ ὑμεῖς Γοὖν δότε αὐτὰ¹⁵ τοῖς τέκνοις ὑμῶν *εἰς κατάσχεσιν¹⁶ αἰώνιον· οὕτω¹⁷ Γγὰρ˥ ἐποίησεν¹⁸ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/004.yaml
  text: For these things I leave to you instead of every inheritance. And you, therefore, give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did.
translation:
  language: ko
  text: 이것들을 나는 모든 유산 대신에 여러분에게 남겨 둡니다. 그러므로 여러분도 그것들을 자녀들에게 영원한 소유로 주십시오. 이는 아브라함과 이삭과 야곱이 그렇게 하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ πάσης κληρονομίας
  english_pob_choice: instead of every inheritance
  chosen_korean: 모든 유산 대신에
  alternatives_korean:
  - 모든 상속 대신에
  - 모든 유업 대신에
  lexicon: κληρονομία
  rationale: κληρονομία는 문맥상 물려주는 재산/유산을 가리키므로, 문어적이되 자연스러운 ‘유산’으로 옮기고, ἀντί의 대체 의미는 ‘대신에’로 살렸습니다.
- source_word: καταλειμπάνω
  english_pob_choice: I leave
  chosen_korean: 남겨 둡니다
  alternatives_korean:
  - 두고 갑니다
  - 남깁니다
  lexicon: καταλείπω
  rationale: 단순히 ‘남기다’보다 수혜자에게 유산처럼 넘겨 두는 뉘앙스가 있어 ‘남겨 둡니다’가 더 자연스럽고 원문에도 가깝습니다.
- source_word: εἰς κατάσχεσιν αἰώνιον
  english_pob_choice: as an everlasting possession
  chosen_korean: 영원한 소유로
  alternatives_korean:
  - 영원한 점유로
  - 영속적인 소유로
  lexicon: κατάσχεσις
  rationale: κατάσχεσις는 ‘소유/점유/보유’의 의미가 가능하나, POB의 ‘possession’에 맞추되 한국어에서는 가장 안정적인 ‘소유’로 옮겼습니다.
- source_word: οὖν
  english_pob_choice: therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그러니
  lexicon: οὖν
  rationale: 앞선 명령을 이어 주는 논리적 접속으로, 현대 문어체에서 가장 자연스럽고 격식을 유지하는 ‘그러므로’를 택했습니다.
theological_decisions:
- issue: 아브라함·이삭·야곱의 예를 권면의 근거로 제시하는 방식
  chosen_reading: 이 구절은 족장들의 행위를 모범으로 제시하여 자녀에게 신앙 유산을 전수하라는 권면을 강화합니다.
  alternative_readings:
  - 단순한 역사적 언급
  - 가계 재산 상속에 대한 실용적 조언
  rationale: 마지막 절의 ‘그렇게 하였습니다’는 단순 정보가 아니라 앞 명령을 정당화하는 예시 기능을 합니다. 한국어에서도 이 논리 구조가 드러나도록 옮겼습니다.
  doctrine_reference: 전승과 모범(example) 기능, 세대 간 신앙 전수
