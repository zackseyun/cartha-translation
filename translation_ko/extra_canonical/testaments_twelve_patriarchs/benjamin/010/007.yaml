  text: Τότε καὶ ἡμεῖς ἀναστησόμεθα³³ ἕκαστος *ἐπὶ σκήπτρον ἡμῶν³⁴ προσκυνοῦντες τὸν βασιλέα *τῶν οὐρανῶν³⁵ [τὸν ἐπὶ γῆς φανέντα³⁶ ἐν³⁷ μορφῇ ἀνθρώπου *ἐν ταπεινώσει³⁸, καὶ ὅσοι πιστεύσωσιν³⁹ αὐτῷ⁴⁰ ἐπὶ τῆς⁴¹ γῆς *χαρίσονται σὺν αὐτῷ⁴²].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/007.yaml
  text: Then we also will rise, each on our scepter, worshiping the king of the heavens, [the one who appeared on earth in the form of a man in humility; and as many as believed in him on the earth will rejoice with him].
translation:
  language: ko
  text: 그러면 우리도 일어나서, 각자 우리의 홀 위에 서서 하늘의 왕께 경배할 것입니다. [그분은 땅에 사람의 형상으로 겸손 가운데 나타나신 분이며, 땅에서 그를 믿는 모든 이는 그와 함께 기뻐할 것입니다.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστησόμεθα
  english_pob_choice: will rise
  chosen_korean: 일어나
  alternatives_korean:
  - 다시 살아날
  - 부활할
  lexicon: ἀνίστημι
  rationale: 미래형 부활의 의미를 살리되, 문맥상 집단적 종말 사건을 자연스럽게 드러내는 합쇼체 표현으로 옮겼습니다.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  english_pob_choice: on our scepter
  chosen_korean: 자기 홀을 잡고
  alternatives_korean:
  - 우리의 홀 위에서
  - 우리의 홀에 올라
  lexicon: σκῆπτρον
  rationale: 직역의 어색함을 피하면서도 ‘홀’을 왕권의 표지로 유지했습니다.
- source_word: προσκυνοῦντες
  english_pob_choice: worshiping
  chosen_korean: 경배할 것입니다
  alternatives_korean:
  - 엎드려 경배할 것입니다
  - 예배할 것입니다
  lexicon: προσκυνέω
  rationale: 하늘의 왕에게 드리는 예배 행위를 분명히 하되, 본문의 예배적 어감을 살렸습니다.
- source_word: βασιλέα τῶν οὐρανῶν
  english_pob_choice: king of the heavens
  chosen_korean: 하늘의 왕
  alternatives_korean:
  - 하늘들의 왕
  - 하늘 나라의 왕
  lexicon: βασιλεύς
  rationale: 복수형 직역보다 한국어에서 자연스러운 ‘하늘의 왕’으로 옮기되, 하늘의 통치권을 유지했습니다.
theological_decisions:
- issue: 대괄호 안의 그리스도론적 묘사와 믿음/불신의 대상
  chosen_reading: 대괄호 안을 본문 일부로 살려, 그가 땅에 사람의 형상으로 겸손하게 나타나셨고 땅에서 그를 믿은 이들이 그와 함께 기뻐할 것이라고 옮겼습니다.
  alternative_readings:
  - 대괄호를 생략하고 앞 절만 번역
  - 장차 그가 모든 민족을 심판할 것이라는 다른 전승형으로 대체
  rationale: 제공된 그리스어 본문과 EN POB 현행 본문을 우선해 번역해야 하므로, 이 자리의 계시-심판 전승을 임의로 다른 판본 내용으로 바꾸지 않았습니다.
  doctrine_reference: 본문 비평/전승 차이의 보존
