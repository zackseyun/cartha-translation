  terminology: ‘하늘의 왕’, ‘경배하다’, ‘사람의 형상’, ‘겸손 가운데’는 원문의 왕권·예배·현현·ταπείνωσις의 어감을 무리 없이 보존합니다. 대괄호는 이 판본에서 괄호 처리된 본문 범위를 그대로 유지합니다.
  issues:
