    rationale: ἐπὶ σκήπτρον ἡμῶν(‘우리의 홀 위에’)을 ‘자기 홀을 잡고’로 바꾸어 원문의 위치 관계와 ‘우리의’라는 소유 표현을 변경합니다.
  - severity: low
