  to: 그러면 우리도 일어나서, 각자 우리의 홀 위에 서서 하늘의 왕께 경배할 것입니다. [그분은 땅에 사람의 형상으로 겸손 가운데 나타나신 분이며, 땅에서 그를 믿는 모든 이는 그와 함께 기뻐할 것입니다.]
  rationale: 난해한 ‘홀 위에’라는 표현은 의역으로 해소하지 않고 보존했습니다. 대괄호 안은 제공된 그리스어와 영어 POB 본문을 따라 유지하되, πιστεύσωσιν의 포괄성을 ‘믿는 모든 이’로 반영했습니다. 대응 각주가 없는 표지는 제거했습니다.
