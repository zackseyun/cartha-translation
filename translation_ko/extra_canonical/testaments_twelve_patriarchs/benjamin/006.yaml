base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar’s deceit[a], for the angel of peace guides his soul. He does not look with passion on perishable things, nor does he gather wealth for pleasure. He does not delight in pleasure, nor grieve his neighbor; he is not filled with luxury, nor led astray by the wanderings of the eyes. For the Lord is his portion. A good purpose does not accept the glory or the dishonor that comes from men, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him and gives light to his soul, and he rejoices toward all people at all times. The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, of poverty and wealth; rather, it has one sincere and pure disposition toward all. It does not have double sight or hearing; for in everything that it does, or speaks, or sees, it knows that the Lord is looking on his soul. And it cleanses
    the mind, so as not to be condemned by men and by God. But the disposition of Beliar is twofold, and it has no singleness. Flee, therefore, evil-mindedness, my children, and love the good mind, which the law of God knows, so that you may rest in hope, because the good-minded man does not have a darkened eye. He shows mercy to all, even if they are sinners; even if they devise evil against him, by doing good he overcomes evil, being shielded by what is good. And he loves the righteous as his own soul. If anyone is glorified, he does not envy him; if anyone is enriched, he is not jealous; if anyone is valiant, he praises him; the virtuous man he commends; on the poor man he has mercy; with the weak he has compassion; to God he sings praise[d][c][b]. The one who has the grace of a good spirit he loves as his own soul.
  footnotes:
  - marker: a
    text: Or 'counsel' or 'resolve' for 'purpose' (διαβούλιον).
    reason: lexical_alternative
  - marker: b
    text: '''Beliar'' reflects the Greek form in this witness; many readers will know the name as ''Belial.'''
    reason: lexical_alternative
  - marker: c
    text: '''Double sight or hearing'' preserves the chapter''s imagery of duplicity versus singleness rather than paraphrasing it as mere hypocrisy.'
    reason: lexical_alternative
  - marker: d
    text: '''A darkened eye'' may also suggest the idiom ''an evil eye,'' that is, envy or grudging hostility.'
    reason: lexical_alternative
translation:
  language: ko
  text: 선한 사람의 의도는 미혹의 영 벨리아르의 손 안에 있지 않습니다. 평화의 천사가 그의 영혼을 인도하기 때문입니다. 그는 썩어 없어질 것들을 정욕으로 바라보지 않고, 쾌락을 위해 재물을 모으지도 않습니다. 그는 쾌락을 기뻐하지 않고, 이웃을 괴롭게 하지도 않으며, 사치에 채워지지 않고, 눈이 이리저리 방황하는 데도 이끌리지 않습니다. 주님은 그의 몫이시기 때문입니다. 선한 의도는 사람에게서 오는 영광도 수치도 받아들이지 않으며, 속임수도 거짓도 다툼도 비방도 알지 못합니다. 주님께서 그 안에 거하시며 그의 영혼에 빛을 비추시고, 그는 늘 모든 사람을 향해 기뻐합니다. 선한 마음은 축복과 저주, 모욕과 존중, 고요함과 소란, 위선과 진리, 가난과 부유함의 두 혀를 가지지 않습니다. 오히려 모든 사람을 향해 한 가지 진실하고 깨끗한 성향을 가집니다. 또 보기도 듣기도 둘로 나뉘지 않습니다. 왜냐하면 그가 행하는 것이나 말하는 것이나 보는 것은 무엇이든 주님께서 그의 영혼을 살피고 계심을 알기 때문입니다. 그리고 그는 사람들에게도 하나님께도 정죄받지 않도록 마음을 깨끗하게 합니다. 그러나 벨리아르의 성향은 두 갈래이고, 그 안에는 하나됨이 없습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβούλιον
  english_pob_choice: purpose
  chosen_korean: 의도
  alternatives_korean:
  - 목적
  - 뜻
  - 결심
  lexicon: LSJ
  rationale: 이 문맥에서는 외적 조언보다 내적이고 도덕적인 방향성을 가리키므로, 한국어 ‘의도’가 가장 자연스럽고 문맥 적합합니다.
- source_word: πλάνης
  english_pob_choice: deceit
  chosen_korean: 미혹
  alternatives_korean:
  - 속임
  - 오류
  - 방황
  lexicon: LSJ
  rationale: 벨리아르의 영과 결합된 표현이라 단순한 실수보다 영적·도덕적 그릇됨을 강조해야 하므로, ‘미혹’이 가장 잘 맞습니다.
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  lexicon: Greek witness tradition
  rationale: 그리스어 증거의 형태를 따라 음역해 본문 전승을 보존했습니다.
- source_word: ἐμπαθῶς
  english_pob_choice: with passion
  chosen_korean: 정욕으로
  alternatives_korean:
  - 욕망으로
  - 열정적으로
  - 탐욕스럽게
  lexicon: LSJ
  rationale: 세속적 사물에 대한 비정상적 욕망의 뉘앙스를 살리기 위해 ‘정욕으로’로 옮겼습니다.
- source_word: τὰ φθαρτά
  english_pob_choice: perishable things
  chosen_korean: 썩어 없어질 것들
  alternatives_korean:
  - 부패할 것들
  - 덧없는 것들
  - 사라질 것들
  lexicon: LSJ
  rationale: 단순히 일시적이라는 뜻보다 소멸성과 부패성을 함께 드러내는 표현이므로 이렇게 옮겼습니다.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  english_pob_choice: the wanderings of the eyes
  chosen_korean: 눈이 이리저리 방황하는 데
  alternatives_korean:
  - 눈의 방황에
  - 눈의 유혹에
  - 흩어진 눈길에
  lexicon: LSJ
  rationale: 감각적 이미지와 도덕적 흔들림을 함께 살리기 위해 직역에 가깝게 표현했습니다.
- source_word: μερὶς
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 기업
  - 부분
  lexicon: LSJ
  rationale: 하나님이 자신의 실제 소유와 분깃이 되신다는 의미를 현대 한국어에서 가장 간명하게 전달합니다.
- source_word: δύο γλώσσας
  english_pob_choice: two tongues
  chosen_korean: 두 혀
  alternatives_korean:
  - 이중적 말
  - 두 입
  - 이중 혀
  lexicon: LSJ
  rationale: 상징적 이미지를 유지해야 하므로 직역을 택했습니다.
- source_word: διάθεσιν
  english_pob_choice: disposition
  chosen_korean: 성향
  alternatives_korean:
  - 태도
  - 기질
  - 마음가짐
  lexicon: LSJ
  rationale: 내적 지속 상태를 뜻하는 말로서, 윤리적 방향성을 담는 ‘성향’이 적절합니다.
theological_decisions:
- issue: 영적 대립의 인격화
  chosen_reading: ‘미혹의 영 벨리아르’와 ‘평화의 천사’를 그대로 살려, 선한 사람의 삶이 영적 세력 간 대립 속에서 이해되도록 옮겼습니다.
  alternative_readings:
  - 비유적 윤리 표현으로 완화
  - 벨리아르를 단순한 악의 개념으로 처리
  rationale: 본문은 단순한 심리 묘사가 아니라 영적 실재를 전제하는 방식으로 말하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 본문 내 영적 이원성 표현의 직접 반영
- issue: ‘사람에게서 오는 영광도 수치도’의 구조
  chosen_reading: δόξης ... ἀτιμίας ἀνθρώπων을 ‘사람에게서 오는 영광도 수치도’로 옮겨, 인간 기원의 평가를 함께 드러냈습니다.
  alternative_readings:
  - ‘영광과 수치’
  - ‘사람들의 칭찬과 모욕’
  rationale: 그리스어 속격이 출처를 분명히 하므로, 인간에게서 비롯되는 가치평가라는 점을 한국어에서도 보이게 했습니다.
  doctrine_reference: 헬라어 속격 구조의 의미 보존
