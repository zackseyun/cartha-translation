revisions:
- from: 선한 사람의 의도는 미혹의 영 벨리아르의 손 안에 있지 않습니다. 평화의 천사가 그의 영혼을 인도하기 때문입니다. 그는 썩어 없어질 것들을 정욕으로 바라보지 않고, 쾌락을 위해 재물을 모으지도 않습니다. 그는 쾌락을 기뻐하지 않고, 이웃을 괴롭게 하지도 않으며, 사치에 채워지지 않고, 눈이 이리저리 방황하는 데도 이끌리지 않습니다. 주님은 그의 몫이시기 때문입니다. 선한 의도는 사람에게서 오는 영광도 수치도 받아들이지 않으며, 속임수도 거짓도 다툼도 비방도 알지 못합니다. 주님께서 그 안에 거하시며 그의 영혼에 빛을 비추시고, 그는 늘 모든 사람을 향해 기뻐합니다. 선한 마음은 축복과 저주, 모욕과 존중, 고요함과 소란, 위선과 진리, 가난과 부유함의 두 혀를 가지지 않습니다. 오히려 모든 사람을 향해 한 가지 진실하고 깨끗한 성향을 가집니다. 또 보기도 듣기도 둘로 나뉘지 않습니다. 왜냐하면 그가 행하는 것이나 말하는 것이나 보는 것은 무엇이든 주님께서 그의 영혼을 살피고 계심을 알기 때문입니다. 그리고 그는 사람들에게도 하나님께도 정죄받지 않도록 마음을 깨끗하게 합니다. 그러나 벨리아르의 성향은 두 갈래이고, 그 안에는 하나됨이 없습니다.[a][b][c]
  to: '선한 사람의 의도는 벨리아르의 미혹의 영의 손안에 있지 않습니다.[a] 평화의 천사가 그의 영혼을 인도하기 때문입니다. 그는 썩어 없어질 것들을 욕망을 품고 바라보지 않으며, 쾌락을 위하여 재물을 모으지도 않습니다. 그는 쾌락을 즐기지 않고 이웃을 괴롭히지도 않으며, 사치로 가득 차지도 않고 눈의 방황에 미혹되지도 않습니다. 주님께서 그의 몫이시기 때문입니다.


    선한 의도는 사람에게서 오는 영광이나 수치를 받아들이지 않으며, 어떠한 속임수나 거짓이나 다툼이나 비방도 알지 못합니다. 주님께서 그 사람 안에 거하시며 그의 영혼을 밝히시고, 그는 언제나 모든 사람을 향하여 기뻐합니다. 선한 마음은 축복과 저주, 모욕과 존중, 고요함과 소란, 위선과 진리, 가난과 부유함을 말하는 두 혀를 가지지 않습니다. 오히려 모든 사람을 향하여 진실하고 깨끗한 한 가지 성향을 지닙니다.


    그것은 이중의 봄이나 들음을 지니지 않습니다.[b] 그가 무엇을 행하고 말하고 보든, 주님께서 그의 영혼을 살피고 계심을 알기 때문입니다. 그는 사람들에게나 하나님께 정죄받지 않도록 자기 마음을 깨끗하게 합니다. 이와 같이 벨리아르의 행위들도 이중적이며, 그 안에는 한결같음이 없습니다.'
  rationale: 제공된 그리스어 본문 6:1–7의 범위를 유지했습니다. 핵심적으로 벨리아르에 관해 말하는 마지막 문장을 ‘성향’이 아니라 원문의 ‘행위들’로 바로잡았고, 욕망·사치·눈의 방황에 관한 표현과 몇몇 직역투를 현대 표준 한국어 합쇼체로 다듬었습니다. 영어 감사 기록에 있는 후속 권면은 제공된 원어 본문에는 포함되어 있지 않으므로 본 개정문에 첨가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:10Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 범위는 제공된 그리스어 본문(6:1–7)에 맞습니다. 다만 마지막 문장의 τὰ ἔργα(‘행위들’)를 ‘성향’으로 옮긴 것은 원문과 맞지 않으며, ‘두 갈래’도 διπλᾶ(‘이중적인’)보다 지나치게 구체적입니다. 또한 ἐμπαθῶς는 성적인 ‘정욕’에 한정되지 않으므로 더 넓은 욕망의 표현이 적절합니다.
  naturalness: 전반적으로 합쇼체와 문체는 안정적입니다. 그러나 ‘사치에 채워지지 않고’, ‘눈이 이리저리 방황하는 데도 이끌리지 않습니다’, ‘늘 모든 사람을 향해 기뻐합니다’는 다소 직역투입니다. 이를 자연스럽게 다듬되 원문의 반복과 윤리적 대조는 유지했습니다.
  terminology: Βελίαρ는 그리스어 증거에 따라 ‘벨리아르’로 유지했습니다. διαβούλιον은 문맥상 ‘의도’로 유지할 수 있습니다. διάθεσις는 ‘성향’, ἁπλότης는 도덕적 비이중성을 나타내는 ‘한결같음’으로 옮겼습니다. ‘두 혀’와 ‘이중의 봄이나 들음’은 본문의 비유적 이미지를 보존했습니다.
  issues:
