  revised_text: '선한 사람의 의도는 벨리아르의 미혹의 영의 손안에 있지 않습니다.[a] 평화의 천사가 그의 영혼을 인도하기 때문입니다. 그는 썩어 없어질 것들을 욕망을 품고 바라보지 않으며, 쾌락을 위하여 재물을 모으지도 않습니다. 그는 쾌락을 즐기지 않고 이웃을 괴롭히지도 않으며, 사치로 가득 차지도 않고 눈의 방황에 미혹되지도 않습니다. 주님께서 그의 몫이시기 때문입니다.


