base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/004.yaml
  text: A good purpose does not accept glory or dishonor from people, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him, and he lights up his soul, and he rejoices toward all at every time.
translation:
  language: ko
  text: 선한 뜻은 사람들에게서 오는 영광이나 수치를 받아들이지 않으며, 어떤 속임수나 거짓말이나 다툼이나 비방도 알지 못합니다. 주님께서 그 안에 거하시기 때문이며, 그의 영혼을 비추시고, 언제나 모든 사람을 향해 기뻐하십니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ἀγαθὸν διαβούλιον
  english_pob_choice: A good purpose
  chosen_korean: 선한 뜻
  alternatives_korean:
  - 선한 계획
  - 좋은 목적
  - 좋은 뜻
  lexicon: ἀγαθὸν διαβούλιον
  rationale: διαβούλιον은 단순한 ‘계획’보다 의도와 결심을 포함한 ‘뜻’으로 옮기는 것이 자연스럽고, ἀγαθόν의 도덕적 선함을 살려 ‘선한 뜻’으로 번역했습니다.
- source_word: δόξης ⌈οὐκ ἀτιμίας⌉ ἀνθρώπων
  english_pob_choice: glory or dishonor from people
  chosen_korean: 사람들에게서 오는 영광이나 수치
  alternatives_korean:
  - 사람들로부터 오는 영광이나 불명예
  - 사람의 영광이나 수치
  - 사람들에게서 오는 영광이나 불명예
  lexicon: δόξα / ἀτιμία / ἀνθρώπων
  rationale: ἀνθρώπων을 포괄적으로 ‘사람들’로 옮기고, ἀτιμία는 전통적 종교어인 ‘불명예’보다 대조가 분명한 ‘수치’로 번역해 대구를 살렸습니다.
- source_word: δόλον ἢ ψεῦδος ἢ μάχην ἢ λοιδωρίαν
  english_pob_choice: deceit or falsehood or strife or reviling
  chosen_korean: 속임수나 거짓말이나 다툼이나 비방
  alternatives_korean:
  - 간계나 거짓이나 싸움이나 욕설
  - 속임수나 거짓이나 분쟁이나 모욕
  lexicon: δόλος / ψεῦδος / μάχη / λοιδορία
  rationale: 각 항목의 병렬을 유지하되, λοιδωρία는 단순한 ‘욕함’보다 공개적 비난을 포함하는 ‘비방’이 문맥에 더 가깝습니다.
- source_word: φωτίζει τὴν ψυχὴν αὐτοῦ
  english_pob_choice: he lights up his soul
  chosen_korean: 그의 영혼을 비추시고
  alternatives_korean:
  - 그의 영혼에 빛을 비추시고
  - 그의 영혼을 밝히시고
  - 그의 영혼에 빛을 주시고
  lexicon: φωτίζω / ψυχή
  rationale: 영혼에 외부 광원을 ‘비추다’는 동작을 직접 살리면서도 한국어로 자연스럽게 만들었습니다. POB의 ‘lights up’보다 원문의 현재적 작용을 더 간결하게 반영합니다.
theological_decisions:
- issue: 주어가 ‘주님’으로 보편적 칭호인지, 야훼로 표기할지
  chosen_reading: 문맥상 인물 내부에 거하시는 주님을 가리키는 일반 호칭으로 ‘주님’이라고 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 문헌의 그리스어 κύριος는 본문 인용 구조나 야훼 인용 표지가 없으므로, 본문 흐름에 맞게 일반적 신적 칭호로 처리했습니다.
  doctrine_reference: κύριος 일반 용례
