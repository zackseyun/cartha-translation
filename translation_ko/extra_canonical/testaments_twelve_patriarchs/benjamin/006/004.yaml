  naturalness: The formal-polite register is appropriate. Removing the unsupported footnote markers and using ‘모든 이를 향해’ yields a clean, natural modern Korean sentence while retaining the source’s ‘toward all’ phrasing.
  terminology: ‘선한 뜻,’ ‘영광,’ ‘수치,’ ‘속임수,’ ‘거짓,’ and ‘주님’ are suitable. ‘모욕’ better represents λοιδωρία without adding the specific implication of false accusation that ‘비방’ can carry.
