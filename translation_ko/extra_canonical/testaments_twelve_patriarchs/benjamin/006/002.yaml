source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '[Καὶ]³ οὐχ ὁρᾷ⁴ ἐμπαθῶς]⁵ *τὰ φθαρτά⁶, οὐδὲ⁷ συνάγει⁸ πλοῦτον ⌈εἰς φιληδονίαν⌉⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/002.yaml
  text: He does not look upon perishable things with passion, nor does he gather wealth for pleasure.
translation:
  language: ko
  text: 그는 썩어질 것들을 향해 정욕으로 바라보지 않고, 쾌락을 위해 재물을 모으지도 않습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ὁρᾷ ἐμπαθῶς τὰ φθαρτά
  english_pob_choice: He does not look upon perishable things with passion
  chosen_korean: 썩어질 것들을 향해 정욕으로 바라보지 않고
  alternatives_korean:
  - 썩어질 것들을 열정으로 바라보지 않고
  - 썩어질 것들을 탐욕스럽게 바라보지 않고
  lexicon: ὁράω, ἐμπαθῶς, φθαρτός
  rationale: ἐμπαθῶς는 단순한 시선이 아니라 정념/정욕이 섞인 응시를 뜻하므로 ‘정욕으로 바라보다’로 옮겨 감정의 강도를 살렸습니다. φθαρτά는 ‘썩어질 것들’로 두어 유한성과 소멸성을 드러냈습니다.
- source_word: συνάγει πλοῦτον
  english_pob_choice: gather wealth
  chosen_korean: 재물을 모으지도 않습니다
  alternatives_korean:
  - 부를 쌓지도 않습니다
  - 재산을 모으지도 않습니다
  lexicon: συνάγω, πλοῦτος
  rationale: συνάγει는 단순 소유보다 축적·모음을 강조하므로 ‘모으다’로 대응했고, πλοῦτος는 문맥상 물질적 부를 가리켜 ‘재물’로 옮겼습니다.
- source_word: εἰς φιληδονίαν
  english_pob_choice: for pleasure
  chosen_korean: 쾌락을 위해
  alternatives_korean:
  - 향락을 위해
  - 쾌락을 목적으로
  lexicon: φιληδονία
  rationale: φιληδονία는 중립적 즐거움보다 쾌락추구/향락의 뉘앙스가 강하므로, 단순 ‘즐거움’보다 ‘쾌락’이 원문의 윤리적 대비를 더 잘 드러냅니다.
theological_decisions:
- issue: 금욕적 대비의 윤리적 강조
  chosen_reading: 이 절은 외적 소유 자체보다, 썩어질 것에 대한 정욕적 시선과 재물의 쾌락적 축적을 함께 금하는 대비로 읽었습니다.
  alternative_readings:
  - 단순히 세속 재물에 대한 경계로만 읽는 해석
  - 물질 자체를 악으로 보는 해석
  rationale: 원문은 ‘썩어질 것들’과 ‘재물’ 모두를 대상으로 삼지만, 초점은 존재 자체의 악마성이 아니라 욕망의 방식과 목적에 있습니다.
  doctrine_reference: 윤리적 성화와 욕망의 절제
