  to: 그것에는 이중의 봄도 이중의 들음도 없습니다. 그것이 하는 모든 일과 말하는 것과 보는 것에서, 주님께서 그의 영혼을 살피신다는 것을 알기 때문입니다. 그리고 사람들에게, 마찬가지로 하나님께 정죄받지 않도록 자신의 마음을 깨끗이 합니다. 이와 같이 벨리아르의 일들도 이중적이며, 그 안에는 순전함이 없습니다.
  rationale: 원문의 대명사 전개가 다소 불규칙한 점은 ‘그것/그의/자신의’로 보존하되, 정결 행위의 주체를 하나님으로 전환한 초안의 해석적 변경을 바로잡았습니다. 또한 ‘이중적’과 ‘순전함’의 대조를 통해 διπλᾶ와 ἁπλότης의 윤리적 대비를 보존했습니다.
