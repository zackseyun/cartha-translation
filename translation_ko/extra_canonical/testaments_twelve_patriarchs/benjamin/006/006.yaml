  source_fidelity: 수정이 필요합니다. 특히 καθαίρει의 주어는 문맥상 행위자(그/그것)이지 하나님이 아닙니다. 초안의 높임 종결 ‘깨끗하게 하십니다’는 하나님이 마음을 정결하게 하신다는 뜻으로 바꾸어 원문의 행위 주체를 변경합니다. 또한 διπλᾶ는 ‘둘로 나뉘어’라기보다 ‘이중적이다/두 겹이다’라는 성격을 뜻합니다.
  naturalness: 초안의 ‘이중의 시력/청각’은 한국어에서 생리적 능력을 가리키는 경향이 있어 윤리적 비유 문맥에 다소 부자연스럽습니다. ‘이중의 봄과 이중의 들음’이 원문의 반복과 비유성을 더 잘 보존합니다. 문장 전체는 현대 표준어 합쇼체로 매끄럽게 다듬었습니다.
  terminology: Κύριος는 ‘주님’, Θεός는 ‘하나님’, Βελίαρ는 ‘벨리아르’로 유지할 수 있습니다. διάνοια는 여기서 ‘마음’으로, ἁπλότης는 이중성과 대조되는 윤리적 ‘순전함’으로 옮겼습니다.
  issues:
