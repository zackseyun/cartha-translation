id: T12P.BEN.6.6
reference: Testament of Benjamin 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Οὐκ ἔχει *ὅρασιν οὔτε ἀκοὴν³⁶ διπλῆν· *πᾶν γὰρ ὃ³⁷ ποιεῖ, Γἢ³⁸ λαλεῖ, *ἢ ὁρᾷ³⁸, οἶδεν ὅτι³⁹ Κύριος ἐπισκέπτει⁴⁰ τὴν⁴¹ ψυχὴν αὐτοῦ. Καὶ καθαίρει τὴν διάνοιαν αὐτοῦ πρὸς⁴² τὸ μὴ καταγνωσθῆναι ὑπὸ *τῶν ἀνθρώπων, ὁμοίως καὶ ὑπὸ Θεοῦ. Ὁμοίως δὲ καὶ τοῦ Βελίαρ τὰ ἔργα διπλᾶ ἐστιν, καὶ ἀπλότητα ἐν αὐτοῖς οὐκ ἔχουσιν⁴³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/006.yaml
  text: It has neither double sight nor double hearing; for in everything it does, or speaks, or sees, it knows that the Lord watches over his soul. And he cleanses his mind so as not to be condemned by men, likewise also by God. And in the same way the works of Beliar are twofold, and they have no singleness in them.
translation:
  language: ko
  text: 그것은 이중의 시력도 이중의 청각도 없습니다. 그것이 하는 모든 일이나 말하는 것, 혹은 보는 것마다 주님께서 그의 영혼을 살피고 계심을 알기 때문입니다. 그리고 사람들에게도, 마찬가지로 하나님께도 정죄받지 않도록 그의 마음을 깨끗하게 하십니다. 이와 같이 벨리아르의 일들도 둘로 나뉘어 있으며, 그 안에는 한결같음이 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔχει ὅρασιν οὔτε ἀκοὴν διπλῆν
  english_pob_choice: neither double sight nor double hearing
  chosen_korean: 이중의 시력도 이중의 청각도 없습니다
  alternatives_korean:
  - 두 겹의 시야도 두 겹의 청각도 없습니다
  - 겹된 보는 것과 듣는 것이 없습니다
  lexicon: ὅρασις, ἀκοή, διπλοῦς
  rationale: English POB의 대구를 살리되, 현대 한국어에서 자연스러운 ‘시력/청각’으로 옮겨 반복 구조를 유지했습니다.
- source_word: Κύριος
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주(主)
  lexicon: κύριος
  rationale: 본문이 하나님을 가리키는 호칭이므로 한국어 독자가 즉시 알아볼 수 있는 ‘주님’을 택했습니다.
- source_word: ἐπισκέπτει τὴν ψυχὴν αὐτοῦ
  english_pob_choice: watches over his soul
  chosen_korean: 그의 영혼을 살피고 계심
  alternatives_korean:
  - 그의 영혼을 돌보고 계심
  - 그의 영혼을 방문하고 계심
  lexicon: ἐπισκέπτομαι, ψυχή
  rationale: ἐπισκέπτει는 단순한 ‘방문’보다 돌봄과 감찰의 뜻이 강하므로, 문맥상 ‘살피다’로 자연스럽게 풀었습니다.
- source_word: τὴν διάνοιαν αὐτοῦ
  english_pob_choice: his mind
  chosen_korean: 그의 마음
  alternatives_korean:
  - 그의 생각
  - 그의 정신
  lexicon: διάνοια
  rationale: διάνοια를 한국어 성경 문맥에서 흔한 ‘마음’으로 옮겨 내적 성향 전체를 포괄하게 했습니다.
- source_word: τῶν ἀνθρώπων ... ὑπὸ Θεοῦ
  english_pob_choice: by men ... by God
  chosen_korean: 사람들에게도, 마찬가지로 하나님께도
  alternatives_korean:
  - 사람들에 의해서도, 또한 하나님께도
  - 사람들과 하나님께도
  lexicon: ἄνθρωπος, Θεός
  rationale: 수동태 맥락을 살리면서도 한국어에서 ‘사람들에게도… 하나님께도’가 가장 매끄럽게 정죄 주체를 드러냅니다.
- source_word: τοῦ Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  - 베리아르
  lexicon: Βελίαρ
  rationale: 고유명사는 본문 전승과 학술 음역을 반영해 ‘벨리아르’로 옮겼습니다.
- source_word: ἀπλότητα
  english_pob_choice: singleness
  chosen_korean: 한결같음
  alternatives_korean:
  - 단일성
  - 순전함
  lexicon: ἁπλότης
  rationale: 이 대목의 대비는 ‘twofold’와 ‘singleness’의 윤리적 대조이므로, 현대 한국어에서 자연스럽고 의미를 보존하는 ‘한결같음’으로 번역했습니다.
theological_decisions:
- issue: 하나님의 감찰과 정죄의 관계
  chosen_reading: 주님이 영혼을 살피시고 마음을 깨끗하게 하셔서 사람과 하나님 앞에서 정죄받지 않게 하십니다.
  alternative_readings:
  - 주님이 영혼을 방문하셔서
  - 하나님이 사람들 앞에서만 정죄되지 않게 하십니다
  rationale: 본문은 단순 관찰이 아니라 내면을 정화하여 양쪽 심판 앞에서 무죄 상태를 지키는 뜻이므로, 감찰과 정화의 연계를 분명히 했습니다.
  doctrine_reference: 윤리적 정결과 하나님의 심판 전 감찰이라는 본문 내 논리
