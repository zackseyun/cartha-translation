id: T12P.BEN.6.1
reference: Testament of Benjamin 6:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VI. Τὸ διαβούλιον τοῦ ἀγαθοῦ ἀνδρὸς οὐκ ἔστιν ἐν χειρὶ πλάνης¹ πνεύματος² Βελίαρ· ὁ γὰρ ἄγγελος τῆς εἰρήνης ὁδηγεῖ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/001.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar's error, for the angel of peace guides his soul.
translation:
  language: ko
  text: 선한 사람의 뜻은 베리알의 오류의 영의 손에 있지 않습니다. 평화의 천사가 그의 영혼을 인도하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ διαβούλιον
  english_pob_choice: The purpose
  chosen_korean: 뜻
  alternatives_korean:
  - 목적
  - 의도
  - 계획
  lexicon: διαβούλιον
  rationale: 행동의 내적 의도와 방향을 가리키므로, 한국어에서는 문맥에 따라 자연스러운 ‘뜻’으로 옮겼습니다. ‘목적’보다 더 직접적으로 인물의 내적 결심을 드러냅니다.
- source_word: πλάνης πνεύματος Βελίαρ
  english_pob_choice: the spirit of Beliar's error
  chosen_korean: 베리알의 오류의 영
  alternatives_korean:
  - 베리알의 속임수의 영
  - 베리알의 미혹의 영
  - 베리알의 오류를 일으키는 영
  lexicon: πλάνη / πνεῦμα
  rationale: πλάνη는 POB 수정안의 ‘error’를 따라 ‘오류’로 살렸고, πνεύματος는 소유격 관계를 유지해 ‘오류의 영’으로 직역에 가깝게 처리했습니다.
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  english_pob_choice: the angel of peace
  chosen_korean: 평화의 천사
  alternatives_korean:
  - 평강의 천사
  - 평안의 천사
  lexicon: ἄγγελος / εἰρήνη
  rationale: ἄγγελος는 일반적으로 ‘천사’이고, εἰρήνη는 프로젝트 기본어인 ‘평강’도 가능하지만 본문 대비의 흐름상 ‘평화’가 더 자연스럽고 직관적이어서 채택했습니다.
- source_word: ὁδηγεῖ τὴν ψυχὴν αὐτοῦ
  english_pob_choice: guides his soul
  chosen_korean: 그의 영혼을 인도합니다
  alternatives_korean:
  - 그의 혼을 이끕니다
  - 그의 생명을 인도합니다
  lexicon: ὁδηγέω / ψυχή
  rationale: ὁδηγεῖ는 ‘인도하다’가 가장 직접적이며, ψυχή는 이 문맥에서 인간의 내면 존재를 가리키므로 ‘영혼’으로 옮겼습니다.
theological_decisions:
- issue: 베리알의 정체와 소유격 관계
  chosen_reading: ‘베리알의 오류의 영’은 베리알에게 속한 왜곡/미혹의 영이 인간의 뜻을 지배하지 못한다는 뜻으로 유지했습니다.
  alternative_readings:
  - ‘베리알의 오류’로 단순화
  - ‘오류를 일으키는 베리알의 영’으로 재구성
  rationale: 원문의 소유격 연쇄를 보존해야 ‘누구의 영향 아래 있는가’라는 대비가 선명해집니다. POB 수정안의 error도 반영했습니다.
  doctrine_reference: 사탄적 영향 아래 놓인 인간 의지와 하나님의 평화의 사자라는 대비
