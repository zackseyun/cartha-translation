  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/003.yaml
  text: He does not delight in pleasure, [does not grieve his neighbor, does not fill himself with luxury, does not go astray by the wanderings of the eyes]. For the Lord is his portion.
translation:
  language: ko
  text: 그는 쾌락을 기뻐하지 않습니다. [그는 이웃을 슬프게 하지 않고, 사치로 자신을 채우지 않으며, 눈의 방황을 따라 빗나가지도 않습니다.] 주님이 그의 몫이기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ τέρπεται ἐν ἡδονῇ
  english_pob_choice: He does not delight in pleasure
  chosen_korean: 그는 쾌락을 기뻐하지 않습니다
  alternatives_korean:
  - 그는 즐거움을 누리지 않습니다
  - 그는 쾌락을 좋아하지 않습니다
  lexicon: τερπεται / ἡδονῇ
  rationale: 터프메타이(τερπεται)는 단순 선호보다 ‘기뻐하다/즐거워하다’의 정서적 반응을 담고 있어, ἡδονῇ를 ‘쾌락’으로 두고 ‘기뻐하지 않습니다’로 옮기면 문장의 금욕적 대조가 살아납니다.
- source_word: οὐ λυπεῖ τὸν πλησίον
  english_pob_choice: does not grieve his neighbor
  chosen_korean: 그는 이웃을 슬프게 하지 않고
  alternatives_korean:
  - 그는 이웃을 괴롭게 하지 않고
  - 그는 이웃에게 슬픔을 주지 않고
  lexicon: λυπεῖ / πλησίον
  rationale: λυπέω는 ‘슬프게 하다, 괴롭게 하다’의 범위가 있는데, 여기서는 행동의 결과를 분명히 하기 위해 ‘슬프게 하지 않고’로 자연스럽게 옮겼습니다.
- source_word: οὐκ ἐμπίπλαται τρυφῇ
  english_pob_choice: does not fill himself with luxury
  chosen_korean: 사치로 자신을 채우지 않으며
  alternatives_korean:
  - 사치에 탐닉하지 않으며
  - 사치로 배를 채우지 않으며
  lexicon: ἐμπίπλαται / τρυφῇ
  rationale: ἐμπίπλαται는 ‘가득 채우다’이고 τρυφή는 사치·사치스런 향락을 뜻하므로, ‘사치로 자신을 채우다’가 원문의 동사상과 명사상을 함께 살립니다.
- source_word: οὐ πλανᾶται μετεωρισμοῖς ὀφθαλμῶν
  english_pob_choice: does not go astray by the wanderings of the eyes
  chosen_korean: 눈의 방황을 따라 빗나가지도 않습니다
  alternatives_korean:
  - 눈의 유혹에 따라 떠돌아다니지도 않습니다
  - 눈이 헤매는 대로 길을 벗어나지도 않습니다
  lexicon: πλανᾶται / μετεωρισμοῖς ὀφθαλμῶν
  rationale: μετεωρισμοῖς ὀφθαλμῶν은 직역하면 ‘눈의 떠다님/방황’이므로, 한국어에서는 ‘눈의 방황’으로 밀착시키고 πλανᾶται를 ‘빗나가지도 않습니다’로 옮겨 도덕적 일탈의 의미를 드러냈습니다.
- source_word: Κύριος ... μερὶς αὐτοῦ
  english_pob_choice: For the Lord is his portion
  chosen_korean: 주님이 그의 몫이기 때문입니다
  alternatives_korean:
  - 주님은 그의 몫이십니다
  - 주님이 그의 분깃이기 때문입니다
  lexicon: Κύριος / μερὶς
  rationale: μερὶς는 ‘몫, 분깃’이 가능하지만 현대 독자에게는 ‘몫’이 더 직접적이어서 본문 의미를 유지하면서도 읽기 쉬운 형태로 옮겼습니다.
theological_decisions:
- issue: 기초적 금욕 윤리의 표현
  chosen_reading: 본문의 부정 연쇄를 각각 독립된 금지로 살려, 쾌락·이웃 해침·사치·눈의 방황을 모두 끊는 인물을 묘사했습니다.
  alternative_readings:
  - 한 문장으로 압축해 도덕적 요지만 제시하는 읽기
  - 후반부를 해설적 문장으로 완화하는 읽기
  rationale: 그리스어는 병렬 부정절로 구성되어 있어, 이를 축약하면 금욕적 윤리의 리듬과 강도가 약해집니다. 따라서 병렬 구조를 유지해 원문의 도덕적 압박을 보존했습니다.
  doctrine_reference: 문학적-윤리적 문맥 보존
- issue: ‘주님이 그의 몫’의 소유 관계
  chosen_reading: ‘주님이 그의 몫이기 때문입니다’로 옮겨, 하나님 자체가 그의 분깃이라는 사상적 긴장을 유지했습니다.
  alternative_readings:
  - ‘주님은 그의 분깃이십니다’
  - ‘주님이 그의 상속 몫입니다’
  rationale: 명사형 분깃 이미지는 유지하되, 현대 한국어에서 가장 자연스럽고 간명한 ‘몫’을 사용했습니다. 다만 관계의 강도를 약화시키지 않도록 주어-보어 구성을 그대로 살렸습니다.
  doctrine_reference: 지혜문학적 소유/분깃 모티프
