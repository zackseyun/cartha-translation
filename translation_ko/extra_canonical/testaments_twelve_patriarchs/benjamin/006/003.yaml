  source_fidelity: 대체로 그리스어의 부정 병렬과 대괄호 처리, 그리고 γάρ의 인과 관계를 충실히 반영합니다. 다만 첫 절의 ‘쾌락을 기뻐하다’는 현대 한국어 결합이 다소 어색하여 ‘쾌락을 즐기다’가 τέρπεται ἐν ἡδονῇ를 더 자연스럽고 충분히 가깝게 전달합니다. ‘눈의 방황’은 μετεωρισμοῖς ὀφθαλμῶν의 의도적인 비유와 다소 불확정적인 표현을 보존합니다.
  naturalness: ‘사치로 자신을 채우다’는 직역적이지만 이해 가능하므로 유지하되, ‘가득’을 보태어 ἐμπίπλαται의 충만 의미와 한국어의 자연스러운 표현을 함께 살렸습니다. ‘주님께서 그의 몫이시기 때문입니다’는 현대 합쇼체와 주님에 대한 통상적 존칭에 맞습니다.
  terminology: ‘이웃’, ‘사치’, ‘눈의 방황’, ‘몫’은 본문 어휘의 의미 범위 안에 있습니다. ‘몫’은 μερίς의 현대적 대응어로 적절합니다. 대괄호는 원전 제시문과 영어 POB의 괄호 처리에 맞춰 유지합니다.
