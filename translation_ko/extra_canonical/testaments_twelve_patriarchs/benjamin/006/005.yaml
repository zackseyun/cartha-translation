id: T12P.BEN.6.5
reference: Testament of Benjamin 6:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ ἀγαθὴ διάνοια²⁸ οὐκ ἔχει δύο γλώσσας²⁹ εὐλογίας καὶ κατάρας³⁰, ὕβρεως καὶ ⌈τιμῆς⌉³¹, ἡσυχίας καὶ ταραχῆς, ὑποκρίσεως καὶ ἀληθείας, [πενίας καὶ πλούτου]³², ἀλλὰ *μίαν ἔχει περὶ πάντας³³ εἰλικρινῆ³⁴ καὶ³⁵ καθαρὰν ⌈διάθεσιν⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/005.yaml
  text: The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, [of poverty and wealth], but rather has one sincere and pure disposition toward all.
translation:
  language: ko
  text: 선한 마음에는 축복과 저주를, 모욕과 존중을, 고요함과 소란을, 위선과 진실을, [가난과 부요를] 말하는 두 혀가 없으며, 오히려 모든 사람에 대하여 한결같이 진실하고 깨끗한 성향을 지닙니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὴ διάνοια
  english_pob_choice: the good mind
  chosen_korean: 선한 마음
  alternatives_korean:
  - 좋은 마음
  - 선한 생각
  lexicon: ἀγαθός, διάνοια
  rationale: διάνοια는 단순한 감정이 아니라 내적 사고·성향을 가리키므로 ‘마음’으로 풀되, ἀγαθὴ는 도덕적 선함을 살려 ‘선한’으로 옮겼습니다.
- source_word: δύο γλώσσας
  english_pob_choice: two tongues
  chosen_korean: 두 혀
  alternatives_korean:
  - 두 말
  - 두 입술
  lexicon: γλῶσσα
  rationale: 직역적 이미지가 이중적 말과 위선을 선명하게 드러내므로 ‘두 혀’를 유지했습니다.
- source_word: εἰλικρινῆ καὶ καθαρὰν διάθεσιν
  english_pob_choice: one sincere and pure disposition
  chosen_korean: 하나의 진실하고 깨끗한 성향
  alternatives_korean:
  - 한결같고 깨끗한 태도
  - 진실하고 순결한 마음가짐
  lexicon: εἰλικρινής, καθαρός, διάθεσις
  rationale: διάθεσις는 단발적 태도보다 지속적인 내적 성향을 뜻하므로 ‘성향’으로 옮겼고, εἰλικρινῆ와 καθαρὰν은 각각 ‘진실하고 깨끗한’으로 살렸습니다.
- source_word: '[πενίας καὶ πλούτου]'
  english_pob_choice: '[of poverty and wealth]'
  chosen_korean: '[가난과 부요]'
  alternatives_korean:
  - '[빈곤과 부]'
  - '[가난과 부유함]'
  lexicon: πενία, πλοῦτος
  rationale: 괄호 속 대구를 본문에 반영하되, 한국어에서는 자연스럽고 대조가 분명한 ‘가난과 부요’로 옮겼습니다.
theological_decisions:
- issue: 이중언어·대구법의 윤리적 강조
  chosen_reading: 선한 마음은 상반된 말과 태도를 함께 품지 않는 하나의 내적 성향을 말합니다.
  alternative_readings:
  - 단순히 거짓말을 하지 않는다는 뜻
  - 대인 관계의 예절만을 말한다는 뜻
  rationale: 원문은 말의 이중성뿐 아니라 축복/저주, 모욕/존귀 등 전반적 삶의 대조를 나열하므로, 윤리적 통합성과 진정성을 강조하는 문맥을 살렸습니다.
  doctrine_reference: 성화와 진실성의 윤리
- issue: ‘모든 사람을 향해’의 범위
  chosen_reading: 모든 사람을 향해 하나의 진실하고 깨끗한 성향을 가진다고 옮겼습니다.
  alternative_readings:
  - 모든 것에 대해
  - 모든 이에게 대하여
  rationale: περὶ πάντας는 사람들을 포괄하는 방향성을 나타내므로, 관계적 지향을 드러내는 ‘모든 사람을 향해’로 자연스럽게 표현했습니다.
  doctrine_reference: 보편적 사랑과 일관된 인격
