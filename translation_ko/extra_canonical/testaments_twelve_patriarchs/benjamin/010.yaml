base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010.yaml
  text: '1[a]. Now when Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, exactly as his whole appearance was.


    2. And after saying these things he said to them, “Know then, my children, that I am dying. 3[b]. Therefore do truth, each one toward his neighbor, and keep the law of the Lord and his commandments. 4. For these things I leave you instead of every inheritance. And you also give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did. 5. For they gave all these things to us as an inheritance, saying, ‘Keep the commandments of God until the time when you will see Enoch and Seth and Abraham and Isaac and Jacob risen up at his right hand in rejoicing.’


    6. Then we also will rise, each with our scepter, and we will worship the King of the heavens. 7. [the one who appeared on earth in the form of a man in humility; and all who believe in him on the earth will rejoice with him.]


    8. And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first for their unrighteousness [because when God came to them in flesh, they did not believe him]. 9. And then he will judge all the nations [which did not believe him when he appeared on earth]. 10. And through the chosen ones from among the nations he will convict Israel, just as he convicted Esau through the Midianites, who deceived their brothers into becoming, through sexual immorality and idolatry, estranged from God, and so they became children in the portion of those who fear the Lord.


    11. You therefore, my children, if you walk in holiness in the commandments of the Lord, you will dwell again with confidence in me[d][c], and all Israel will be gathered to the Lord.'
  footnotes:
  - marker: a
    text: The clauses in vv. 7-9 enclosed in brackets are widely regarded as later Christian expansion because of their explicit language about God appearing in flesh and belief in him on earth.
    reason: textual_variant
  - marker: b
    text: Or 'practice truth' for 'do truth' (v. 3). The Greek idiom is concrete and ethical.
    reason: lexical_alternative
  - marker: c
    text: '''With confidence'' in v. 11 renders a difficult phrase literally ''in hope.'''
    reason: lexical_alternative
  - marker: d
    text: The phrase 'each over our scepter' (v. 6) is textually difficult; it may evoke restored dignity or tribal rule in the resurrection.
    reason: cultural_note
translation:
  language: ko
  text: '1. 요셉이 이집트에 있을 때 나는 그의 모습과 얼굴의 형상을 보고 싶어 했습니다. 그리고 아버지 야곱의 기도 덕분에, 낮에 깨어 있을 때 그의 온 모습을 보았습니다.


    2. 그리고 이런 말을 한 뒤 그가 그들에게 말했습니다. "이제 알아두십시오, 내 자녀들아. 나는 죽고 있습니다. 3. 그러므로 각자 이웃에게 진리를 행하고, 주님의 율법과 그분의 명령들을 지키십시오. 4. 나는 이것들을 모든 유산 대신에 여러분에게 남깁니다. 여러분도 이것들을 자녀들에게 영원한 소유로 주십시오. 아브라함과 이삭과 야곱이 그렇게 했기 때문입니다. 5. 그들은 우리에게 이 모든 것을 유산으로 주며 이렇게 말했습니다. ''하나님의 명령들을 지키십시오. 그러면 여러분은 에녹과 셋과 아브라함과 이삭과 야곱이 기뻐하며 그의 오른편에 일어선 것을 볼 때까지 지키게 될 것입니다.''


    6. 그러면 우리도 각자 우리의 홀을 가지고 일어나서 하늘들의 왕께 경배할 것입니다. 7. [그분은 땅에서 낮은 모습으로 사람의 형상으로 나타나셨고, 땅에서 그를 믿는 모든 사람은 그와 함께 기뻐할 것입니다.]


    8. 그러면 모든 사람이 일어날 것이니, 어떤 이들은 영광으로, 어떤 이들은 불명예로 일어날 것입니다. 그리고 주님께서는 먼저 이스라엘을 그들의 불의 때문에 심판하실 것입니다. [하나님이 육신으로 그들에게 오셨을 때 그들은 그분을 믿지 않았기 때문입니다.] 9. 그런 다음 그분은 모든 민족을 심판하실 것입니다. [그분이 땅에 나타나셨을 때 그를 믿지 않은 민족들을 심판하실 것입니다.] 10. 그리고 그분은 민족들 가운데서 택하신 이들을 통해 이스라엘을 책망하실 것입니다. 마치 에서가 미디안 사람들을 통해 책망을 받았던 것처럼 말입니다. 그들은 형제들을 속여, 성적 부도덕과 우상숭배를 통해 하나님에게서 멀어지게 했고, 그래서 주님을 경외하는 이들의 몫에 속한 자녀들이 되었습니다. 11. 그러므로 내 자녀들아, 여러분이 주님의 명령들 가운데서 거룩함으로 걸으면, 여러분은 다시 내 안에서 소망 가운데 거할 것이며, 온 이스라엘이 주님께 모일 것입니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδέα / μόρφωσις / ὄψις
  english_pob_choice: appearance / form / face
  chosen_korean: 모습 / 얼굴의 형상 / 온 모습
  alternatives_korean:
  - 모양 / 형체 / 얼굴
  - 외모 / 모습 / 용모
  lexicon: LSJ
  rationale: 서로 가까운 표현을 겹쳐 배치한 수사 효과를 살리기 위해 한국어도 3중 구조를 유지했습니다. εἰδέα와 μόρφωσις, ὄψις의 미묘한 차이를 모두 단일어로 지우지 않도록 했습니다.
- source_word: ποιήσατε ... ἀλήθειαν
  english_pob_choice: do truth
  chosen_korean: 진리를 행하다
  alternatives_korean:
  - 진리를 실천하다
  - 참되게 행하다
  lexicon: LSJ
  rationale: 직역처럼 보이더라도 윤리적 행위를 구체적으로 요구하는 관용을 반영했습니다. 한국어에서는 ‘진리를 행하다’보다 자연스러운 의미를 살리면서도 본문의 결을 유지하려고 ‘진리를 행하다’의 동사성을 살렸습니다.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  english_pob_choice: with our scepter
  chosen_korean: 우리의 홀을 가지고
  alternatives_korean:
  - 우리의 홀 위에서
  - 우리의 홀과 함께
  lexicon: LSJ
  rationale: 본문의 어두움을 과하게 해석하지 않기 위해 도구/동반의 뉘앙스를 남겼습니다. 왕권 또는 부족적 존귀를 암시하는 이미지를 보존하되, 의미를 단정하지 않았습니다.
- source_word: ἐπʼ ἐλπίδι ἐν ἐμοί
  english_pob_choice: with confidence in me
  chosen_korean: 내 안에서 소망 가운데
  alternatives_korean:
  - 내 안에서 확신 가운데
  - 내게 소망 가운데
  lexicon: LSJ
  rationale: English POB의 해석을 그대로 따르기보다, 최신 수정 논의에서 회수된 더 문자적인 ‘in hope’를 한국어의 관용과 긴장감 있게 반영했습니다. ‘내 안에서’는 이어지는 ἐν ἐμοί를 살리고, ‘소망 가운데’는 ἐπʼ ἐλπίδι의 희망 상태를 드러냅니다.
- source_word: ἀδικία
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불법
  - 부정함
  - 불의함
  lexicon: LSJ
  rationale: 이스라엘에 대한 언약적·도덕적 책임을 가리키는 표현이므로, 단순한 ‘잘못’보다 신학적 무게가 있는 ‘불의’를 택했습니다.
theological_decisions:
- issue: 7-9절의 괄호 친 기독론적 확장문
  chosen_reading: 본문에 포함하되 대괄호로 표시하여 후대적 확장 가능성을 투명하게 드러냈습니다.
  alternative_readings:
  - 해당 절들을 완전히 삭제하기
  - 괄호 없이 본문으로 평탄화하기
  rationale: 제공된 그리스어 본문과 English POB가 모두 이 구절들을 전하므로 번역은 하되, 육신으로 오신 하나님과 믿음의 대상에 대한 직접 언급이 후대적 삽입으로 널리 여겨진다는 점을 가려서는 안 됩니다.
  doctrine_reference: 텍스트 복잡성은 투명하게 보존하고, 본문 비평상 긴장은 해소하지 않는다.
- issue: 11절의 ἐπʼ ἐλπίδι
  chosen_reading: ‘소망 가운데’로 옮기되, 그 소망은 공동체적 안전감과 종말론적 기대를 함께 암시하도록 했습니다.
  alternative_readings:
  - ‘확신 가운데’로 옮기기
  - ‘희망 안에서’로 직역하기
  rationale: English POB의 최신 수정은 더 문자적인 ‘in hope’를 회수했지만, 한국어에서는 소망 상태를 나타내는 표현이 가장 자연스럽습니다. 다만 단순한 감정이 아니라 언약적 안정과 기대를 함께 지닌 말로 이해되도록 했습니다.
  doctrine_reference: 희망/확신의 뉘앙스는 문맥상 중첩되며, 어느 하나로만 환원하지 않는다.
