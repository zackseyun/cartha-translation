review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ἐπὶ κόπρου καὶ βόρβορον은 ‘대변이나 더러움에서 오는 더러움’처럼 더러움이 중복되는 표현보다 ‘분뇨와 오물로 인해 더럽혀짐’으로 옮기는 것이 원문 관계를 더 정확히 드러냅니다. συνεχόμενος는 ‘붙들려’보다 오염 가운데 ‘갇혀/에워싸여’ 있는 상태를 뜻합니다. 난해하고 본문비평상 의심스러운 οἰκοδομεῖ는 †표시와 함께 보존해야 합니다.
  naturalness: ‘대변이나 더러움에서 오는 더러움’은 현대 한국어에서 부자연스럽고 의미가 중첩됩니다. ‘분뇨와 오물로 인해 더럽혀지지 않습니다’와 ‘땅의 더러움들 가운데 갇혀 있어도’가 자연스럽고 원문의 강한 이미지를 유지합니다. 근거 없이 붙은 [a] 표지는 삭제합니다.
  terminology: καθαρὸς νοῦς는 윤리적·종교적 대조 문맥에서 ‘정결한 마음’이 적절합니다. κόπρος/βόρβορος는 ‘분뇨와 오물’, δυσωδία는 ‘악취’로 옮깁니다. οἰκοδομεῖ의 목적어 없는 난해함과 원문 비평 표지는 ‘†세웁니다†’ 및 주석으로 보존합니다.
  issues:
  - severity: medium
    issue: ‘대변이나 더러움에서 오는 더러움’
    rationale: μιασμὸν ἐπὶ κόπρου καὶ βόρβορον의 관계를 한국어에서 부자연스럽게 중복시키며, ‘분뇨와 오물로 인해 더럽혀짐’이 더 충실합니다.
  - severity: low
    issue: ‘붙들려 있으면서도’
    rationale: συνεχόμενος는 이 문맥에서 오염물 가운데 붙잡히거나 에워싸인 상태를 가리키므로 ‘가운데 갇혀 있어도’가 더 자연스럽습니다.
  - severity: medium
    issue: 미정의 [a] 각주 표지
    rationale: 제공된 각주 세트에 [a]의 내용이 없으므로 독립된 앵커로 남겨서는 안 됩니다. 본문비평 표지 †에 대응하는 주석으로 정리해야 합니다.
  revised_text: 정결한 마음은 분뇨와 오물로 인해 더럽혀지지 않습니다. 오히려 그 둘을 물리치고 악취를 몰아냅니다. 이와 같이 정결한 마음도 땅의 더러움들 가운데 갇혀 있어도 오히려 †세웁니다†. 자신은 더럽혀지지 않습니다.
  revised_footnotes:
  - marker: †
    text: ‘세웁니다’에 해당하는 그리스어는 본문비평상 문제가 있는 독법으로 표시되어 있습니다. 문맥상 목적어가 제시되지 않아 의미가 난해하므로, 번역도 이를 보완하지 않았습니다.
    reason: 원전의 † 표지를 보존하고, 난해한 οἰκοδομεῖ에 임의의 목적어나 해석을 덧붙이지 않기 위함입니다.
  revision_rationale: 원문의 오염 이미지와 ‘오염 가운데 있으나 더럽혀지지 않음’이라는 대조를 더 정확하고 자연스러운 현대 한국어로 다듬었습니다. 난해한 οἰκοδομεῖ는 교리적 또는 해석적 보충 없이 본문비평 표지와 함께 보존했으며, 내용이 없는 [a] 표지는 제거했습니다.
