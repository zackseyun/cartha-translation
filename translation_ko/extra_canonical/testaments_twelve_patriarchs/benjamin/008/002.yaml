id: T12P.BEN.8.2
reference: Testament of Benjamin 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ καθαρὸς νοῦς οὐκ ἔχει μιασμὸν ἐπὶ¹⁷ κόπρου¹⁸ καὶ¹⁹ βόρβορον²⁰, Γ*ἀλλὰ μᾶλλον²¹ ἀμφότερα ψύγει²² καὶ ἀπελαύνει τὴν δυσωδίαν⁷, οὕτω καὶ ὁ καθαρὸς²³ νοῦς ἐν τοῖς μιασμοῖς²⁴ τῆς¹⁷ γῆς συνεχόμενος μᾶλλον †οἰκοδομεῖ²⁶, αὐτὸς δὲ οὐ μιαίνεται⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/002.yaml
  text: For the pure mind has no defilement from dung or filth, but rather repels both and drives away the stench; thus also the pure mind, when held among the defilements of the earth, rather †builds up†, and is itself not defiled.
translation:
  language: ko
  text: 깨끗한 마음은 대변이나 더러움에서 오는 더러움이 없습니다. 오히려 그것들을 모두 물리치고 악취를 쫓아냅니다. 이와 같이 깨끗한 마음도 땅의 더러움들 가운데 붙들려 있으면서도 오히려 †세워 갑니다†. 그러나 그것 자체는 더럽혀지지 않습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρὸς νοῦς
  english_pob_choice: the pure mind
  chosen_korean: 깨끗한 마음
  alternatives_korean:
  - 순수한 정신
  - 정결한 마음
  lexicon: καθαρός / νοῦς
  rationale: νοῦς를 단순한 '정신'보다 인격적·윤리적 중심을 드러내는 '마음'으로 옮기고, καθαρός는 종교적 전문어보다 본문의 대비를 살리는 '깨끗한'으로 표현했습니다.
- source_word: μιασμὸν ... κόπρου καὶ βόρβορον
  english_pob_choice: defilement from dung or filth
  chosen_korean: 대변이나 더러움에서 오는 더러움
  alternatives_korean:
  - 똥이나 진흙에서 오는 부정함
  - 분뇨와 오물의 더러움
  lexicon: μιασμός / κόπρος / βόρβορος
  rationale: 원문은 강한 감각적 이미지이므로 완곡화하지 않고, κόπρος와 βόρβορος의 중첩된 오염 이미지를 한국어에서 직설적으로 살렸습니다.
- source_word: ἀπελαύνει τὴν δυσωδίαν
  english_pob_choice: drives away the stench
  chosen_korean: 악취를 쫓아냅니다
  alternatives_korean:
  - 악취를 몰아냅니다
  - 구린내를 내쫓습니다
  lexicon: ἀπελαύνω / δυσωδία
  rationale: δυσωδία의 후각적 불쾌감을 '악취'로 옮기고, 동사는 능동적으로 밀어내는 뉘앙스가 살아 있는 '쫓아내다'를 택했습니다.
- source_word: μᾶλλον †οἰκοδομεῖ†
  english_pob_choice: rather †builds up†
  chosen_korean: 오히려 †세워 갑니다†
  alternatives_korean:
  - 오히려 †건설합니다†
  - 오히려 †덕을 세웁니다†
  lexicon: οἰκοδομέω
  rationale: 본문의 †표시는 전승상 난점을 반영하므로, 의미를 살리되 과도한 교회어인 '덕을 세우다'는 피하고 '세워 갑니다'로 보존했습니다.
theological_decisions:
- issue: 청결한 마음이 '땅의 더러움들 가운데' 있을 때의 작용
  chosen_reading: 외적 오염 한가운데서도 오히려 파괴되지 않고 건설적 작용을 한다는 대조로 읽었습니다.
  alternative_readings:
  - 도덕적 시험 속에서도 손상되지 않는 내적 순결
  - 세상 오염에 접촉해도 오히려 선을 증대시킨다는 은유
  rationale: 문맥은 물질적 더러움의 이미지에서 출발하지만 결론은 내적 순결의 보존과 적극성에 있으며, 그 긴장을 약화하지 않도록 번역했습니다.
  doctrine_reference: 청결/오염의 윤리적 대비와 내적 순결의 보존
