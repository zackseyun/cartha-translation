  - severity: low
    issue: ‘매달리십시오’의 어감
    rationale: προσκολλάομαι의 ‘붙다/결속하다’는 뜻은 맞지만, ‘매달리다’는 한국어에서 원문의 비유에 없는 절박한 의존의 뉘앙스를 줄 수 있습니다.
