revisions:
- from: 그러므로 너희, 내 자녀들아, 악을 — 곧 시기와 형제 미움 — 피하고 선함과 사랑에 매달리십시오.[a][b]
  to: 그러나 너희는, 내 자녀들아, 악, 곧 시기와 형제들에 대한 미움을 피하고 선함과 사랑에 굳게 붙으십시오.
  rationale: 대조 접속사 δέ를 ‘그러나’로 바로잡아 원문의 담화 관계를 보존했습니다. 악의 구체적 양상이라는 영어 POB의 병렬/설명 구조를 ‘곧’으로 유지하고, 결속을 뜻하는 προσκολλᾶσθε는 자연스러운 현대 합쇼체인 ‘굳게 붙으십시오’로 옮겼습니다. 제공되지 않은 각주에 연결되는 표지는 삭제했습니다.
