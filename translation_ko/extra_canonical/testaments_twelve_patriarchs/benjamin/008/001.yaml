id: T12P.BEN.8.1
reference: Testament of Benjamin 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VIII. *Ὑμεῖς δέ¹, *τέκνα μου², ἀπόδρατε³ τὴν κακίαν, Γ*τὸν φθόνον⁴ καὶ τὴν⁵ μισαδελφίαν⁶, καὶ προσκολλᾶσθε⁶ τῇ ἀγαθότητι Γκαὶ τῇ ἀγάπῃ⁷⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/001.yaml
  text: But you, my children, flee evil — envy and hatred of brothers — and cling to goodness and love.
translation:
  language: ko
  text: 그러나 너희는, 내 자녀들아, 악, 곧 시기와 형제들에 대한 미움을 피하고 선함과 사랑에 굳게 붙으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς δέ ... τέκνα μου
  english_pob_choice: But you, my children
  chosen_korean: 그러므로 너희, 내 자녀들아
  alternatives_korean:
  - 그런데 너희, 내 자녀들아
  - 너희는, 내 자녀들아
  lexicon: τέκνα
  rationale: 호격 구조를 살리되, 문맥상 권면 전환을 드러내기 위해 ‘그러므로’를 두고 ‘내 자녀들아’로 직접 부릅니다.
- source_word: ἀπόδρατε τὴν κακίαν
  english_pob_choice: flee evil
  chosen_korean: 악을 피하고
  alternatives_korean:
  - 악에서 달아나고
  - 악을 도망하고
  lexicon: κακία
  rationale: 동사 ἀπόδρατε는 단순 회피보다 강한 ‘피하다/달아나다’의 의미가 있어 자연스러운 현대어로 ‘피하고’로 옮겼습니다.
- source_word: τὸν φθόνον καὶ τὴν μισαδελφίαν
  english_pob_choice: envy and hatred of brothers
  chosen_korean: 곧 시기와 형제 미움
  alternatives_korean:
  - 곧 질투와 형제에 대한 미움
  - 곧 시기와 형제들에 대한 증오
  lexicon: φθόνος, μισαδελφία
  rationale: μισαδελφία는 문자적으로 ‘형제 혐오/형제 미움’이므로 ‘형제 미움’으로 직역해 관계적 적대성을 유지했습니다.
- source_word: προσκολλᾶσθε τῇ ἀγαθότητι ... καὶ τῇ ἀγάπῃ
  english_pob_choice: cling to goodness and love
  chosen_korean: 선함과 사랑에 매달리십시오
  alternatives_korean:
  - 선함과 사랑에 붙으십시오
  - 선함과 사랑을 굳게 따르십시오
  lexicon: ἀγαθότης, ἀγάπη, προσκολλάομαι
  rationale: προσκολλάομαι의 결속·부착 이미지를 살려 ‘매달리다’로 옮겼고, ἀγαθότης는 추상적 ‘선’보다 성격적 ‘선함’이 적절합니다.
theological_decisions:
- issue: 악/시기/형제 미움/선함/사랑의 윤리적 대조
  chosen_reading: 권면문의 대조 구조를 그대로 살려, 악의 종류를 구체화하고 선함·사랑에 적극적으로 결속하라는 윤리적 촉구로 번역했습니다.
  alternative_readings:
  - 악을 버리고 선과 사랑을 택하십시오
  - 악을 떠나 선과 사랑을 붙드십시오
  rationale: 본문은 단순한 도덕 일반론이 아니라 구체적 악목록과 긍정적 덕목을 병렬로 제시하므로, 대조를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 윤리적 권면의 병렬 구조 보존
- issue: 호격과 명령형의 수신자 관계
  chosen_reading: ‘내 자녀들아’라는 호격과 명령형 ‘피하고/매달리십시오’를 함께 유지해 아버지적 권면의 어조를 드러냈습니다.
  alternative_readings:
  - 너희는 ... 피하십시오
  - 내 자녀들아 ... 피하십시오
  rationale: 그리스어의 Ὑμεῖς δέ와 τέκνα μου가 만들어내는 직접적 목회/부성 권면을 한국어에서도 분명히 보여 주는 것이 중요합니다.
  doctrine_reference: 수사적 호격 보존
