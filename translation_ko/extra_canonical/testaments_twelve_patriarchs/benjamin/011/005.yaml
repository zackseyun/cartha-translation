id: T12P.BEN.11.5
reference: Testament of Benjamin 11:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ²⁵ δι᾽ *αὐτῶν φοιτήσει ὡς²⁶ Ἰακὼβ²⁷ ὁ πατήρ μου, λέγων· Αὐτὸς ἀναπληρώσει τὰ ὑστερήματα τῆς *φυλῆς σου²⁸].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/005.yaml
  text: And through them he will visit as Jacob my father, saying, “He will fill up what is lacking in your tribe.”
translation:
  language: ko
  text: 그리고 그들을 통해 내 아버지 야곱처럼 찾아오실 것이며, 「그는 당신의 지파에 부족한 것을 채워 주실 것입니다」라고 말합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ αὐτῶν
  english_pob_choice: through them
  chosen_korean: 그들을 통해
  alternatives_korean:
  - 그들을 통하여
  - 그들을 경유하여
  lexicon: διά + 대명사
  rationale: 복수 대명사 αὐτῶν을 자연스럽게 반영해 ‘그들을 통해’로 옮기되, 원인의 매개성을 유지했습니다.
- source_word: φοιτήσει
  english_pob_choice: will visit
  chosen_korean: 찾아오실 것이며
  alternatives_korean:
  - 방문하실 것이며
  - 오고 가실 것이며
  lexicon: φοιτέω
  rationale: 단순한 ‘지나가다’보다 POB의 ‘will visit’이 암시하는 내방/방문 의미를 살려, 예언적 문맥에 맞는 ‘찾아오시다’로 표현했습니다.
- source_word: τὰ ὑστερήματα
  english_pob_choice: what is lacking
  chosen_korean: 부족한 것
  alternatives_korean:
  - 결핍된 것
  - 모자란 것
  lexicon: ὑστέρημα
  rationale: 결손·부족의 일반적 의미를 살려, 한국어에서 자연스럽고 문맥상 중립적인 ‘부족한 것’으로 옮겼습니다.
- source_word: φυλῆς σου
  english_pob_choice: your tribe
  chosen_korean: 당신의 지파
  alternatives_korean:
  - 네 지파
  - 그대의 지파
  lexicon: φυλή
  rationale: 직접 화법 안의 2인칭을 예언적·장중한 어조로 유지하기 위해 ‘당신의’로 옮겼고, ‘지파’는 혈연-집단 단위를 보존했습니다.
theological_decisions:
- issue: 인칭 지시의 보존
  chosen_reading: 「그들」은 앞 문맥의 복수적 매개를 그대로 유지하고, 인용문 안의 ‘당신’은 수신자 공동체를 향한 예언적 직접 호칭으로 남겼습니다.
  alternative_readings:
  - 그에게/네 지파로 단수화
  - 수신자를 ‘너’로 평준화
  rationale: 원문과 POB가 보여 주는 복수-단수의 긴장을 지우지 않기 위해, 복수 대명사와 2인칭 호칭을 각각 보존했습니다.
  doctrine_reference: 문맥적 대명사 해석, 예언적 خطاب 유지
