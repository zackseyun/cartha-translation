  source_fidelity: δι᾽ αὐτῶν의 복수 매개와 φοιτήσει의 방문/내방 의미, 그리고 인용문 안의 2인칭 단수와 φυλή(지파)는 대체로 충실히 반영되었습니다. 다만 원문의 λέγων은 앞선 미래 동작에 딸린 발화이므로, 초안의 현재형 ‘말합니다’는 시제와 문장 연결을 어색하게 만듭니다. ‘내 아버지 야곱처럼’은 원문의 다소 압축적이고 문맥 의존적인 비교를 해석적으로 확장하지 않고 보존합니다.
  naturalness: ‘찾아오실 것이며, …라고 말합니다’는 미래 서술과 현재형 발화가 혼재되어 현대 한국어 문장으로 부자연스럽습니다. ‘찾아오셔서 … 말씀하실 것입니다’로 연결하면 원문의 분사 구문과 예언적 미래를 자연스럽게 재현합니다.
  terminology: ‘그들을 통하여’, ‘지파’, ‘부족한 것’은 적절합니다. 인용문 내 ‘그는’은 원문의 αὐτός를 유지하며, 높임 표현은 초안의 격식 있는 종교 문체를 유지했습니다.
