revisions:
- from: 그리고 그들을 통해 내 아버지 야곱처럼 찾아오실 것이며, 「그는 당신의 지파에 부족한 것을 채워 주실 것입니다」라고 말합니다.[a]
  to: 그리고 그들을 통하여 내 아버지 야곱처럼 찾아오셔서, “그는 당신의 지파에 부족한 것을 채우실 것입니다”라고 말씀하실 것입니다.
  rationale: 발화 분사 λέγων을 ‘찾아오셔서 … 말씀하실 것입니다’로 옮겨 미래 시제와 문장 연결을 바로잡았습니다. 비교구 ‘내 아버지 야곱처럼’ 및 대명사의 불명확한 지시 관계는 원문보다 더 특정하지 않았습니다. 근거 없는 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
