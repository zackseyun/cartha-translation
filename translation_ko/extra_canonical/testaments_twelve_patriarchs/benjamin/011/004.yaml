  text: And in holy books he shall be recorded, both his work and his word; and he shall be God's chosen one forever.
translation:
  language: ko
  text: 그리고 그는 그의 행위와 말과 함께 거룩한 책들에 기록될 것이며, 영원히 하나님께서 택하신 이가 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν βίβλοις ἁγίαις
  english_pob_choice: in holy books
  chosen_korean: 거룩한 책들에
  alternatives_korean:
  - 성스러운 책들에
  - 거룩한 성문서들에
  lexicon: βίβλοις / ἁγίαις
  rationale: ἐν + 여격은 ‘~에’로 자연스럽게 옮기고, ἁγίαις는 문맥상 성문서 일반보다 ‘거룩한 책들’이 원문의 직접성을 잘 살립니다.
- source_word: ἀναγραφόμενος
  english_pob_choice: shall be recorded
  chosen_korean: 기록될 것이며
  alternatives_korean:
  - 기록될 것이고
  - 기재될 것이며
  lexicon: ἀναγράφω
  rationale: 공적인 문서에 이름이나 행적이 ‘기록되다’는 뜻을 한국어로 가장 सीधे하게 반영합니다.
- source_word: τὸ ἔργον καὶ ὁ λόγος αὐτοῦ
  english_pob_choice: his work and his word
  chosen_korean: 그의 행위와 그의 말
  alternatives_korean:
  - 그의 일과 그의 말
  - 그의 행위와 그의 말씀
  lexicon: ἔργον / λόγος
  rationale: ἔργον은 단순한 ‘일’보다 행위·행적의 의미가 더 분명하고, λόγος는 종교적 뉘앙스를 과도하게 끌어오지 않도록 ‘말’로 옮겼습니다.
- source_word: ἐκλεκτὸς Θεοῦ
  english_pob_choice: God's chosen one
  chosen_korean: 하나님께서 택하신 이
  alternatives_korean:
  - 하나님의 택함을 받은 이
  - 하나님이 택하신 자
  lexicon: ἐκλεκτός / Θεός
  rationale: ἐκλεκτός는 ‘택하신 이’로 인격적 호칭을 살리고, Θεός는 프로젝트 기본어휘에 따라 ‘하나님’으로 옮겼습니다.
theological_decisions:
- issue: ἕως τοῦ αἰῶνος의 종말적 지속 표현
  chosen_reading: 영원히
  alternative_readings:
  - 세세토록
  - 영원까지
  rationale: 관용적 종말 지속 표현으로서 의미를 자연스럽게 전달하되, ‘세세토록’보다 현대 문장 흐름에 맞는 ‘영원히’를 택했습니다.
  doctrine_reference: 지속성/종말론적 시간 표현
