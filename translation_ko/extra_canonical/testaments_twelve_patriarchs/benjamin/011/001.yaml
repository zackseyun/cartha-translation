id: T12P.BEN.11.1
reference: Testament of Benjamin 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XI. Καὶ οὐκέτι κληθήσομαι λύκος ἅρπαξ διὰ τὰς ἁρπαγὰς ὑμῶν ἀλλὰ [ἐργάτης Κυρίου διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/001.yaml
  text: No longer shall I be called a ravening wolf because of your acts of plunder, but [a worker of the Lord, distributing food to those who do what is good].
translation:
  language: ko
  text: 더 이상 너희의 약탈 행위 때문에 나는 탐욕스러운 늑대라 불리지 않을 것입니다. 오히려 [주님의 일꾼으로서, 선한 일을 하는 이들에게 양식을 나누어 주는 자라] 불릴 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι κληθήσομαι
  english_pob_choice: No longer shall I be called
  chosen_korean: 더 이상 나는 … 불리지 않을 것입니다
  alternatives_korean:
  - 더 이상 나는 …라 불리게 되지 않을 것입니다
  - 다시는 나는 …라 불리지 않을 것입니다
  lexicon: οὐκέτι + κληθήσομαι
  rationale: 미래 수동의 호칭 변경을 자연스러운 공적 문장으로 옮기되, 단순한 현재 평가가 아니라 ‘불리다’라는 명명 행위를 살렸습니다.
- source_word: λύκος ἅρπαξ
  english_pob_choice: a ravening wolf
  chosen_korean: 탐욕스러운 늑대
  alternatives_korean:
  - 포식하는 늑대
  - 약탈하는 늑대
  lexicon: λύκος ἅρπαξ
  rationale: λύκος와 ἅρπαξ의 결합은 단순 동물 묘사보다 ‘난폭하게 약탈하는 존재’의 비유이므로, 한국어에서는 자연스럽고 직설적인 ‘탐욕스러운 늑대’로 처리했습니다.
- source_word: διὰ τὰς ἁρπαγὰς ὑμῶν
  english_pob_choice: because of your acts of plunder
  chosen_korean: 너희의 약탈 행위 때문에
  alternatives_korean:
  - 너희의 강탈들 때문에
  - 너희의 빼앗음들 때문에
  lexicon: ἁρπαγάς
  rationale: ἁρπαγάς는 ‘plunder/robbery’ 계열의 명사이므로, POB의 ‘acts of plunder’를 따라 ‘약탈 행위’로 옮겨 반복적·구체적 행위를 드러냈습니다.
- source_word: ἐργάτης Κυρίου
  english_pob_choice: a worker of the Lord
  chosen_korean: 주님의 일꾼
  alternatives_korean:
  - 주님의 일하는 자
  - 주님의 노동자
  lexicon: ἐργάτης
  rationale: ἐργάτης는 단순 직업명이 아니라 주를 위해 일하는 존재를 가리키므로, 한국어 성경체에서 자연스러운 ‘일꾼’으로 옮겼습니다.
theological_decisions:
- issue: bracketed second clause in the Greek source
  chosen_reading: 본문에는 [ ]를 유지하여 뒤의 절이 원문에서 괄호로 표시된 삽입적 표현임을 드러냈습니다.
  alternative_readings:
  - 괄호를 풀어 하나의 자연문장으로 제시
  - 각주로만 처리하고 본문에서는 제거
  rationale: 사본 전승상의 표시를 본문에서 보존해야 번역 독자가 해당 절의 지위가 다소 불안정하다는 점을 인지할 수 있습니다.
  doctrine_reference: Textual criticism / source transparency
