  - severity: low
    issue: εὐδοκία의 번역
    rationale: ‘선한 뜻’은 가능한 번역이지만 εὐδοκία의 기쁨·호의의 뉘앙스가 약합니다. ‘기뻐하시는 뜻’이 문맥과 한국어 관용에 더 가깝습니다.
  - severity: medium
    issue: 근거 없는 각주 표지 [a][b][c]
    rationale: 제공된 초안에는 이 표지들에 대응하는 각주가 없습니다. 독자가 주석을 기대하게 하는 구조적 잔여물이므로 삭제해야 합니다.
