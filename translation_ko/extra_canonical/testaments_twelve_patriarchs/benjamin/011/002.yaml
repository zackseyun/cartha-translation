id: T12P.BEN.11.2
reference: Testament of Benjamin 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/002.yaml
  text: And in the last times a beloved one of the Lord shall arise [from the seed of Judah and Levi], doing good pleasure with his mouth, [enlightening all the nations with new knowledge], a light of knowledge, coming upon Israel in salvation, and snatching from them like a wolf, and giving to the assembly of the nations.
translation:
  language: ko
  text: 그리고 마지막 때에 주의 사랑받는 이가 일어나 [유다와 레위의 씨에서] 자기 입으로 선한 뜻을 행하고, [모든 민족을 새 지식으로 비추며], 지식의 빛이 되어 이스라엘 위에 구원을 가져오며, 늑대처럼 그들에게서 낚아채고, 민족들의 회중에게 내어줄 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεται ἐν ὑστέροις
  english_pob_choice: shall arise in the last times
  chosen_korean: 마지막 때에 … 일어나
  alternatives_korean:
  - 마지막 때에 … 나타나
  - 말세에 … 일어나
  lexicon: ἀνίστημι
  rationale: 미래적 출현과 등장을 살리되, 한국어에서는 ‘일어나’가 인물의 공적 등장과 부상을 자연스럽게 드러냅니다.
- source_word: ἀγαπητὸς Κυρίου
  english_pob_choice: a beloved one of the Lord
  chosen_korean: 주의 사랑받는 이
  alternatives_korean:
  - 주님의 사랑받는 이
  - 주께 사랑받은 이
  lexicon: ἀγαπητός
  rationale: ‘사랑받는 이’로 관계를 직역하되, 경어체 문맥에서 ‘주의’가 간결하고 자연스럽습니다.
- source_word: ποιῶν εὐδοκίαν
  english_pob_choice: doing good pleasure
  chosen_korean: 선한 뜻을 행하고
  alternatives_korean:
  - 기뻐하시는 뜻을 행하고
  - 선하신 뜻을 이루며
  lexicon: εὐδοκία
  rationale: 그리스어 표현은 단순한 ‘선행’이 아니라 기쁨/호의에 속한 뜻의 실행이므로, 의미를 살려 ‘선한 뜻’으로 옮겼습니다.
- source_word: φῶς γνώσεως
  english_pob_choice: a light of knowledge
  chosen_korean: 지식의 빛
  alternatives_korean:
  - 앎의 빛
  - 지식의 광명
  lexicon: φῶς; γνῶσις
  rationale: 명사구의 압축을 한국어에서도 유지하여, ‘빛’이 곧 ‘지식’을 비추는 메타포를 간명하게 드러냈습니다.
- source_word: τὰ ἔθνη / τῇ συναγωγῇ τῶν ἐθνῶν
  english_pob_choice: all the nations / the assembly of the nations
  chosen_korean: 모든 민족 / 민족들의 회중
  alternatives_korean:
  - 열방 / 민족들의 모임
  - 나라들 / 민족들의 모임
  lexicon: ἔθνη; συναγωγή
  rationale: 여기서는 ἐθνῶν을 ‘민족들’로 옮겨 민족 집합성을 보존하고, συναγωγή는 본문 의미에 맞게 ‘회중’으로 처리했습니다.
theological_decisions:
- issue: 유다와 레위의 씨에서라는 괄호 구절의 처리
  chosen_reading: '[유다와 레위의 씨에서]를 본문에 포함해, 그리스어 사본 전승의 괄호 표지를 반영했습니다.'
  alternative_readings:
  - 괄호 없이 본문으로 자연화
  - 각주로만 처리
  rationale: 공개 번역본의 감정과 달리, 이 전승은 삽입/변이 가능성을 드러내므로 본문과 괄호를 함께 유지하는 편이 감사 추적에 유리합니다.
  doctrine_reference: 텍스트 비평 및 본문 전승 표지 보존 원칙
- issue: 이스라엘 위에 구원을 가져오며와 늑대 비유의 긴장
  chosen_reading: ‘이스라엘 위에 구원을 가져오며’와 ‘늑대처럼 그들에게서 낚아채고’를 모두 보존했습니다.
  alternative_readings:
  - 구원의 은유를 약화
  - 늑대 비유를 완화해 ‘빼앗고’로 번안
  rationale: 구원과 포식 비유가 병치된 긴장을 완화하지 않고 그대로 두어, 본문의 예상 밖의 메시아적 양가성을 유지합니다.
  doctrine_reference: 메시아 예언의 복합 이미지 보존
