revisions:
- from: 그리고 마지막 때에 주의 사랑받는 이가 일어나 [유다와 레위의 씨에서] 자기 입으로 선한 뜻을 행하고, [모든 민족을 새 지식으로 비추며], 지식의 빛이 되어 이스라엘 위에 구원을 가져오며, 늑대처럼 그들에게서 낚아채고, 민족들의 회중에게 내어줄 것입니다.[a][b][c]
  to: 그리고 마지막 때에 주의 사랑받는 이가 일어나 [유다와 레위의 씨에서] 그의 입으로 기뻐하시는 뜻을 행하며, [모든 민족을 새 지식으로 비추고], 지식의 빛으로서 구원 가운데 이스라엘에 임하며, 늑대처럼 그들에게서 낚아채고, 민족들의 회중에게 주실 것입니다.
  rationale: 그리스어의 괄호 표지를 그대로 유지했습니다. ‘지식의 빛’은 원문의 독립적인 명사구적 병치를 살려 ‘빛으로서’로 연결했으며, 이스라엘에 대한 ἐπεμβαίνων의 동작을 ‘구원을 가져오다’로 해석 확정하지 않고 ‘구원 가운데 … 임하다’로 보존했습니다. ‘낚아채고’와 ‘주실 것입니다’의 생략된 목적어도 원문처럼 보충하지 않았습니다. 대응 각주가 없는 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:40Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 괄호로 표시된 두 구절과 ‘지식의 빛’, 목적어가 생략된 ‘낚아채고/주며’의 긴장을 대체로 보존합니다. 그러나 ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ를 ‘이스라엘 위에 구원을 가져오며’로 옮긴 것은 ‘이스라엘에 임하다/다가가다’라는 동작을 ‘구원을 가져오다’로 바꾸어 원문의 표현을 다소 평준화합니다.
  naturalness: ‘이스라엘 위에 구원을 가져오며’는 현대 한국어에서 부자연스럽고, 끝의 [a][b][c]는 제공된 각주 없이 남아 있어 독해를 방해합니다. ‘구원 가운데 이스라엘에 임하며’는 원문의 다소 낯선 병치를 유지하면서도 자연스럽습니다.
  terminology: ‘주의 사랑받는 이’, ‘유다와 레위의 씨’, ‘새 지식’, ‘지식의 빛’, ‘민족들의 회중’은 적절합니다. εὐδοκία는 단순한 윤리적 ‘선한 뜻’보다 호의·기쁨의 뜻을 포함하므로 ‘기뻐하시는 뜻’으로 옮기는 편이 낫습니다. 다만 그 뜻의 주체는 문맥상 암시될 뿐 원문이 명시하지 않으므로 해설 각주는 추가하지 않습니다.
  issues:
  - severity: medium
    issue: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ의 의미 평준화
