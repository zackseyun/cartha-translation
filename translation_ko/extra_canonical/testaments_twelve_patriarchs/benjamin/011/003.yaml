  - severity: low
    issue: 음악 비유의 중복
    rationale: ‘한 곡의 음악 같은 선율’은 음악과 선율의 의미가 중첩됩니다.
  - severity: medium
    issue: 무대응 각주 표지 [a]
    rationale: 번역문에 [a] 표지가 있으나 제공된 translation_notes 및 각주 자료에는 이에 대응하는 각주가 없습니다. 표지를 제거하여 앵커 불일치를 해소해야 합니다.
