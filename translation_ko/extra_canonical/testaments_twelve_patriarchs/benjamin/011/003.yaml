id: T12P.BEN.11.3
reference: Testament of Benjamin 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/003.yaml
  text: Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.
translation:
  language: ko
  text: 그 시대가 끝날 때까지 그는 민족들의 회중과 그들의 통치자들 가운데에 있으리니, 마치 모든 사람의 입에 있는 한 곡의 음악 같은 선율과도 같습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως συντελείας τοῦ αἰῶνος
  english_pob_choice: Until the consummation of the age
  chosen_korean: 그 시대가 끝날 때까지
  alternatives_korean:
  - 시대의 완성까지
  - 세상 끝날 때까지
  lexicon: ἕως / συντέλεια / αἰών
  rationale: until + consummation of the age를 자연스러운 현대 한국어로 옮기되, 단순한 종말보다 ‘그 시대의 끝’이라는 시간적 종결감을 살렸습니다.
- source_word: ἐν συναγωγαῖς ἐθνῶν
  english_pob_choice: in the assemblies of the nations
  chosen_korean: 민족들의 회중
  alternatives_korean:
  - 나라들의 모임
  - 이방들의 회당
  lexicon: συναγωγή / ἔθνος
  rationale: συναγωγαῖς는 ‘회당’의 어원적 의미를 지니지만, 여기서는 유대교 제도명보다 ‘모인 회중’의 의미가 더 직접적이므로 ‘회중’으로 옮겼습니다.
- source_word: ὡς μουσικὸν μέλος
  english_pob_choice: like a musical strain
  chosen_korean: 마치 한 곡의 음악 같은 선율과도
  alternatives_korean:
  - 마치 음악적 선율처럼
  - 한 곡의 음악 같은 가락처럼
  lexicon: μουσικός / μέλος
  rationale: μουσικὸν μέλος의 시적 비유를 유지하면서, 한국어에서 자연스러운 중첩 없이 ‘선율’로 핵심 이미지를 전달했습니다.
theological_decisions:
- issue: ἔσται ἐν ... καὶ ἐν τοῖς ἄρχουσιν αὐτῶν의 공간적/사회적 범위
  chosen_reading: 그는 민족들의 회중과 그들의 통치자들 가운데에 있으리니
  alternative_readings:
  - 그는 민족들의 회당과 그들의 통치자들 사이에 있으리니
  - 그는 민족들 가운데와 그들의 지도자들 가운데 있으리니
  rationale: 단순한 ‘안에’보다 공동체와 권력층 모두를 포괄하는 ‘가운데에’가 문맥의 확장성을 더 잘 드러냅니다.
  doctrine_reference: 문학적·예언적 상징 해석
