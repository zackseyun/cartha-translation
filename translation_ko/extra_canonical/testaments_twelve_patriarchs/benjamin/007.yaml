    이 때문에 가인은 일곱 가지 복수의 행위에 넘겨졌습니다. 백 년마다 주님께서 그에게 차례로 한 재앙씩 내리셨고, 구백 년째에는 그가 황폐하게 되었습니다.[a][b][c]'
  to: '그러므로 내 자녀들아, 내가 너희에게 말합니다. 벨리아르[b]의 악을 피하십시오. 그가 자기에게 순종하는 자들에게 칼을 주기 때문입니다. 그 칼은 일곱 악의 어머니입니다.[c] 먼저 마음이 벨리아르로 말미암아 잉태하고, 첫째는 시기, 둘째는 멸망, 셋째는 환난, 넷째는 포로됨[a], 다섯째는 궁핍, 여섯째는 혼란, 일곱째는 황폐입니다.


    이 때문에 가인은 일곱 가지 보복에 넘겨졌습니다. 주님께서는 백 년마다 그에게 재앙 하나를 내리셨습니다. 가인은 이백 년 동안 고통을 받았고, 구백 번째 해에 황폐해졌습니다. 이는 그가 자기 형제 아벨 때문에 온갖 재앙으로 심판을 받았고, 라멕은 일흔일곱 배로 심판을 받았기 때문입니다.


    시기와 그러한 형제 미움으로 가인을 본받는 자들은 영원토록 심판으로 벌을 받을 것입니다.'
  rationale: 원전에 있는 7:4 후반과 7:5를 복원하여 본문 범위를 완성했습니다. 가인과 라멕의 수치 비교는 원문의 다소 압축되고 거친 문장을 신학적으로 조화시키지 않고, 라멕에 생략된 ‘심판을 받다’를 한국어 문법상 보충하여 옮겼습니다. 칼·어머니·잉태의 비유는 보존하면서 불명확한 대명사를 제거했고, 본문비평·이명·문화 설명 각주를 각각 적절한 본문 위치에 배치했습니다.
  reviewer_model: gpt-5.6-terra
