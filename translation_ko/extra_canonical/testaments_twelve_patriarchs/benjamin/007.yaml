base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007.yaml
  text: '7[a]. And he purifies his mind so as not to be condemned by men, and likewise by God. In the same way, the works of Beliar also are twofold, and they have no simplicity in them.


    Therefore, my children[b], I tell you: flee the evil of Beliar, because he gives a sword to those who obey him. And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.


    Because of this, Cain was handed over to seven acts of vengeance. For in one hundred years the Lord brought one plague upon him after another[c], and in the nine-hundredth year he was made desolate.'
  footnotes:
  - marker: a
    text: The fourth evil is textually uncertain in the Greek OCR layer. Some witnesses read 'captivity' (αἰχμαλωσία), while the printed line here appears corrupted. 'Captivity' is adopted because it fits the parallel witness forms and the sequence of calamities.
    reason: textual_variant
  - marker: b
    text: Beliar is the form found in this Greek witness; many readers will know the name as Belial.
    reason: lexical_alternative
  - marker: c
    text: 'The statement that the sword is ''the mother of seven evils'' is immediately explained by a conception/birth metaphor: the mind conceives through Beliar, and seven evils are born from it.'
    reason: cultural_note
translation:
  language: ko
  text: '그러므로, 내 자녀들아, 내가 너희에게 말합니다. 벨리아르의 악을 피하십시오. 그가 자기에게 순종하는 자들에게 칼을 주기 때문입니다. 그 칼은 일곱 악의 어머니입니다. 먼저 마음이 벨리아르를 통해 그것을 잉태하니, 그 낳음은 이러합니다. 첫째는 시기, 둘째는 멸망, 셋째는 환난, 넷째는 포로됨, 다섯째는 궁핍, 여섯째는 소동, 일곱째는 황폐입니다.


    이 때문에 가인은 일곱 가지 복수의 행위에 넘겨졌습니다. 백 년마다 주님께서 그에게 차례로 한 재앙씩 내리셨고, 구백 년째에는 그가 황폐하게 되었습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βελίαρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  lexicon: Greek witness tradition
  rationale: 그리스어 증언에 나타난 μορφή가 Βελίαρ이므로 이를 반영해 표기했고, 더 익숙한 ‘벨리알’은 각주로만 대안 제시가 적절합니다.
- source_word: μάχαιρα
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 칼날
  lexicon: LSJ
  rationale: 이 문맥의 무기는 악을 낳게 하는 도구로 기능하므로 ‘칼’이 자연스럽고, 한국어 성서문맥에서도 무기 이미지를 과도하게 장식하지 않습니다.
- source_word: πειθομένοις
  english_pob_choice: those who obey him
  chosen_korean: 자기에게 순종하는 자들
  alternatives_korean:
  - 그에게 설득되는 자들
  - 그를 따르는 자들
  lexicon: LSJ
  rationale: 단순한 설득보다 실제적 복종을 뜻하는 윤리적 문맥이므로 ‘순종하는 자들’이 더 정확합니다.
- source_word: συλλαμβάνει
  english_pob_choice: conceives
  chosen_korean: 잉태하니
  alternatives_korean:
  - 품으니
  - 받아들이니
  lexicon: LSJ
  rationale: 곧바로 ‘어머니’와 ‘낳음’의 비유가 이어지므로, 마음이 악을 ‘잉태’한다는 출산 은유를 살리는 것이 원문의 힘을 보존합니다.
- source_word: αἰχμαλωσία / θεηλασία
  english_pob_choice: captivity
  chosen_korean: 포로됨
  alternatives_korean:
  - 사로잡힘
  - 포로 상태
  lexicon: LSJ
  rationale: 본문 전승이 불안정한 네 번째 악을 영어 주석의 판단대로 ‘captivity’로 받아, 한국어에서는 칼의 결과로 드러나는 구속 상태를 뜻하는 ‘포로됨’으로 옮겼습니다.
- source_word: ἐκδικίαις
  english_pob_choice: acts of vengeance
  chosen_korean: 일곱 가지 복수의 행위
  alternatives_korean:
  - 일곱 번의 보복
  - 일곱 가지 징벌
  lexicon: LSJ
  rationale: 복수의 반복성과 행위성을 함께 살리기 위해 직역에 가깝게 옮겼고, 단순한 ‘징벌’로 완화하지 않았습니다.
theological_decisions:
- issue: 칼과 일곱 악의 관계를 설명하는 비유 구조
  chosen_reading: ‘그 칼은 일곱 악의 어머니입니다’와 ‘마음이 … 잉태하니’로 출산 은유를 그대로 살렸습니다.
  alternative_readings:
  - ‘그 칼은 일곱 악을 낳습니다’
  - ‘그 칼은 일곱 악의 근원입니다’
  rationale: 본문은 악이 외적 도구에서 내적 잉태와 출산으로 이어지는 계열적 이미지를 사용하므로, 이를 평이한 원인 진술로 바꾸면 수사적 긴장이 약해집니다.
  doctrine_reference: DOCTRINE.md preserve theological tension rather than resolve it
- issue: 구백 년째 ‘황폐하게 되었습니다’의 종결형
  chosen_reading: 종말적 결과를 나타내는 수동형으로 ‘황폐하게 되었습니다’를 유지했습니다.
  alternative_readings:
  - ‘황폐해졌습니다’
  - ‘파괴되었습니다’
  rationale: 원문 ἐρημοῦται의 결과 상태를 드러내면서도 가인의 형벌이 누적되어 완결되는 구조를 보존합니다.
  doctrine_reference: PHILOSOPHY.md consistency of key terms
