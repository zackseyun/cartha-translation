id: T12P.BEN.5.4
reference: Testament of Benjamin 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ἐὰν γὰρ˥²⁶ ὑβρίσει²⁷ *ἄνδρα ὅσιον²⁸ μετανοεῖ²⁹, ἐλεεῖ γὰρ ⌈ὁ ὅσιος⌉ τῶν λοιδορούν³⁰ καὶ σιωπᾷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/004.yaml
  text: For if anyone insults a holy man, he repents; for the holy one has mercy on those who revile him and keeps silent.
translation:
  language: ko
  text: 왜냐하면 누가 거룩한 사람을 모욕하면, 그는 회개합니다. 거룩한 이는 자신을 비방하는 이들을 긍휼히 여기며 침묵합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβρίσει
  english_pob_choice: insults
  chosen_korean: 모욕하면
  alternatives_korean:
  - 욕하면
  - 모독하면
  - 해를 끼치면
  lexicon: ὑβρίζω
  rationale: 영문 POB의 최종 수정본이 ‘insults’로 정리되었으므로, 한국어도 외적 폭력보다 언어적 모욕을 드러내는 ‘모욕하다’로 옮겼습니다.
- source_word: μετανοεῖ
  english_pob_choice: repents
  chosen_korean: 회개합니다
  alternatives_korean:
  - 마음을 돌이킵니다
  - 뉘우칩니다
  lexicon: μετανοέω
  rationale: 문맥상 단순한 생각 변경이 아니라 도덕적·영적 전환을 가리키므로, POB의 ‘repents’를 따라 ‘회개합니다’로 옮겼습니다.
- source_word: ὅσιος
  english_pob_choice: holy man / the holy one
  chosen_korean: 거룩한 사람 / 거룩한 이는
  alternatives_korean:
  - 경건한 사람
  - 성인
  lexicon: ὅσιος
  rationale: ὅσιος의 핵심은 제의적 경건보다 하나님 앞에서의 거룩함이므로, 한국어에서도 ‘거룩한’으로 유지해 대조를 살렸습니다.
- source_word: λοιδορούν
  english_pob_choice: those who revile him
  chosen_korean: 자신을 비방하는 이들
  alternatives_korean:
  - 자기를 욕하는 이들
  - 자기를 모욕하는 이들
  lexicon: λοιδορέω
  rationale: 반복되는 공격의 성격을 자연스럽게 보여 주면서도, 원문의 ‘비방/욕설’ 뉘앙스를 유지하기 위해 ‘비방하다’를 택했습니다.
theological_decisions:
- issue: 거룩한 사람이 모욕을 받았을 때의 반응
  chosen_reading: 거룩한 이는 보복 대신 불쌍히 여기고 침묵합니다.
  alternative_readings:
  - 거룩한 이는 용서하고 침묵합니다.
  - 거룩한 이는 참아 내고 침묵합니다.
  rationale: 원문은 단순한 내적 태도보다 가해자에 대한 자비와 침묵을 함께 제시하므로, 두 요소를 모두 살렸습니다.
  doctrine_reference: 윤리적 성화와 원수 사랑의 실천
- issue: 원문의 행위 주어 구성
  chosen_reading: 앞절은 ‘누가…모욕하면’, 뒷절은 ‘거룩한 이는…합니다’로 분리했습니다.
  alternative_readings:
  - 주어를 더 직역해 ‘어떤 사람이…’로 옮김
  - 대응 구조를 더 평행하게 재배열
  rationale: 그리스어의 조건절과 결과절 대조를 한국어에서 분명히 보여 주기 위해 주어와 동사를 자연스럽게 배치했습니다.
  doctrine_reference: 문장 구조의 수사적 평행성
