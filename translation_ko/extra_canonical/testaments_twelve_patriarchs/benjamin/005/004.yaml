- from: 그러므로 누가 한 거룩한 사람을 모욕하면, 그는 회개합니다. 거룩한 이는 자신을 비방하는 이들을 불쌍히 여기며 침묵합니다.[a][b][c]
  to: 왜냐하면 누가 거룩한 사람을 모욕하면, 그는 회개합니다. 거룩한 이는 자신을 비방하는 이들을 긍휼히 여기며 침묵합니다.
  rationale: The revision corrects the logical force of γάρ, removes an unnatural and unsupported Korean indefinite marker, and removes unattached footnote anchors. It retains the source's implied offender as the subject of “회개합니다,” the repeated designation of the holy person, and the paired actions of mercy and silence.
