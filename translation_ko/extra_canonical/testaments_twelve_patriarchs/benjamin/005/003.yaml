  naturalness: ‘좋은 행위를 두려워하고 마음에 빛이 있으면’은 조건절로 자연스럽게 풀었지만, 병렬 명사구와 ὅπου의 ‘있는 곳’ 구성을 바꿉니다. ‘그것에게서’도 지시 대상이 불명확하고 비자연스럽습니다. ‘…있는 곳에서는 어둠이 달아납니다’가 현대 표준어 합쇼체에 자연스럽습니다.
