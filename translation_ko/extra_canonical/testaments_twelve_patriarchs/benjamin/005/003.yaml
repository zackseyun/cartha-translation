base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/003.yaml
  text: For where there is fear of good works and light in the mind, darkness flees from it.
translation:
  language: ko
  text: 선한 행위에 대한 두려움과 마음속의 빛이 있는 곳에서는 어둠이 달아납니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβος ἀγαθῶν ἔργων
  english_pob_choice: fear of good works
  chosen_korean: 좋은 행위를 두려워하고
  alternatives_korean:
  - 좋은 행위에 대한 두려움이 있고
  - 선한 행위를 두려워하고
  lexicon: φόβος, ἀγαθός, ἔργον
  rationale: φόβος를 명사구로만 굳히기보다 문맥상 행위적 태도를 드러내는 동사형으로 옮겨, 좋은 행위를 두려워한다는 의미를 자연스럽게 살렸습니다.
- source_word: φῶς εἰς διάνοιαν
  english_pob_choice: light in the mind
  chosen_korean: 마음에 빛이 있으면
  alternatives_korean:
  - 지성 안에 빛이 있으면
  - 생각 속에 빛이 있으면
  lexicon: φῶς, διάνοια
  rationale: διάνοια를 단순 지성보다 사고·마음의 자리로 넓게 받아, 한국어에서 가장 자연스러운 ‘마음’으로 표현했습니다.
- source_word: τὸ σκότος ἀποδιδράσκει ἀπʼ αὐτοῦ
  english_pob_choice: darkness flees from it
  chosen_korean: 어둠은 그것에게서 달아납니다
  alternatives_korean:
  - 어둠은 그것을 떠나 달아납니다
  - 어둠이 그에게서 도망합니다
  lexicon: σκότος, ἀποδιδράσκω, αὐτοῦ
  rationale: ἀποδιδράσκω의 ‘달아나다/도망하다’라는 강한 동작을 살리되, 한국어 문장 흐름에 맞게 주어-목적어를 정리했습니다.
theological_decisions:
- issue: ‘좋은 행위’와 ‘빛’의 병렬 구조
  chosen_reading: 두 요소를 조건절로 묶어, 선행에 대한 두려움과 내적 계몽이 함께 있을 때 어둠이 물러난다는 대비를 드러냈습니다.
  alternative_readings:
  - ‘좋은 행위를 두려워함과 마음의 빛’으로 명사구 병렬을 살리는 읽기
  - ‘선한 일에 대한 경외’로 도덕적 경외감을 강조하는 읽기
  rationale: 그리스어는 병렬 명사구를 통해 내적 상태와 결과를 연결하므로, 한국어에서도 대립 구조가 선명하게 보이도록 옮기는 것이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 지혜·윤리적 권면 문맥의 대조법
