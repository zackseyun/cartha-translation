revisions:
- from: 만일 누군가 의로운 사람을 배반하면, 의로운 사람은 기도합니다. 그리고 비록 잠시 낮아지더라도, 머지않아 그는 훨씬 더 빛나게 나타납니다. 곧 내 형제 요셉이 그러하였습니다.[a]
  to: 만일 누군가 의로운 사람을 배반하면, 그 의로운 사람은 기도합니다. 비록 잠시 낮아지더라도, 머지않아 더 밝게 나타납니다. 내 형제 요셉이 그러하였습니다.
  rationale: 원문의 비교급을 과장하지 않도록 ‘훨씬’을 삭제하고, 누락된 내용의 [a] 표지를 제거했습니다. 그 밖에는 조건절, 의인의 기도, 잠시의 낮아짐, 조속한 회복적 드러남, 그리고 요셉의 예시라는 원문의 구성과 의미를 유지했습니다.
