review_pass:
  verdict: revise
  source_fidelity: 그리스어는 ‘의로운 사람을 배반하면, 그 의로운 사람이 기도하며, 잠시 낮아진다 해도 오래지 않아 더 밝게 나타난다’는 조건적·일반적 진술이고, 요셉을 그 사례로 듭니다. 초안은 이 흐름을 충실히 옮겼습니다. 다만 φαιδρότερος는 비교급 ‘더 밝게/더 빛나게’이며, ‘훨씬’에 해당하는 별도의 강화 표현은 본문에 없습니다. μετʼ οὐ πολύ는 시간상 ‘머지않아’에 속합니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. ‘그는’을 유지해도 무방하나, 앞의 ‘의로운 사람’이 주어임을 다시 밝혀 주면 일반 원리로서의 문장이 더 또렷합니다. ‘더 밝게 나타납니다’는 φαιδρότερος ἀναφαίνεται를 현대 한국어로 자연스럽게 반영합니다.
  terminology: δίκαιος를 ‘의로운 사람’으로 옮긴 것은 적절하며, 여기서 ‘의인’보다 평이한 문체에도 맞습니다. προδίδωμι의 ‘배반하다’와 ταπεινωθῇ의 외적 낮아짐을 표현한 ‘낮아지다’도 적절합니다. 요셉의 호칭 ‘내 형제 요셉’도 보존했습니다.
  issues:
  - severity: medium
    issue: ‘훨씬 더 빛나게’의 ‘훨씬’
    rationale: 그리스어 φαιδρότερος는 ‘더 밝게/더 빛나게’라는 비교급입니다. μετʼ οὐ πολύ는 ‘오래지 않아’라는 시간 표현이므로 비교 정도를 ‘훨씬’으로 강화하지 않습니다. 영어 감사본의 ‘far more radiant’보다 원문을 우선하여 강화어를 제거하는 것이 안전합니다.
  - severity: medium
    issue: 본문의 [a] 각주 표지가 있으나 제공된 각주 내용이 없음
    rationale: 완결되지 않은 각주 표지는 구조적으로 독자를 잘못된 참조로 이끕니다. 원문상 이 구절에 번역 각주가 반드시 필요한 쟁점도 아니므로 표지를 삭제해야 합니다.
  revised_text: 만일 누군가 의로운 사람을 배반하면, 그 의로운 사람은 기도합니다. 비록 잠시 낮아지더라도, 머지않아 더 밝게 나타납니다. 내 형제 요셉이 그러하였습니다.
