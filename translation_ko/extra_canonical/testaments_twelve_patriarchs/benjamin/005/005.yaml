id: T12P.BEN.5.5
reference: Testament of Benjamin 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Κἄν³¹ τις *δίκαιον προδώσει³², *ὁ δίκαιος προσεύχεται· εἰ καὶ πρὸς³³ ὀλίγον ταπεινωθῇ, *μετʼ οὐ³⁴ πολὺ φαιδρότερος³⁵ ἀναφαίνεται, οἷος γέγονεν³⁶ Ἰωσὴφ ὁ ἀδελφός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/005.yaml
  text: And if anyone betrays a righteous man, the righteous man prays; and even if for a little while he is brought low, before long he reappears far more radiant, as Joseph my brother became.
translation:
  language: ko
  text: 만일 누군가 의로운 사람을 배반하면, 그 의로운 사람은 기도합니다. 비록 잠시 낮아지더라도, 머지않아 더 밝게 나타납니다. 내 형제 요셉이 그러하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιον / ὁ δίκαιος
  english_pob_choice: a righteous man / the righteous man
  chosen_korean: 의로운 사람 / 의로운 사람은
  alternatives_korean:
  - 의인
  - 의로운 자
  - 의로운 영혼
  lexicon: δίκαιος
  rationale: source는 특정한 '의로운 사람'과 그 일반적 범주를 함께 가리키므로, 문맥상 자연스러운 '의로운 사람'을 택해 POB의 의미를 유지했습니다.
- source_word: προδώσει
  english_pob_choice: betrays
  chosen_korean: 배반하면
  alternatives_korean:
  - 넘기면
  - 팔아넘기면
  - 속이면
  lexicon: προδίδωμι
  rationale: 배신 행위를 직접적으로 드러내는 '배반하다'가 원문의 도덕적·관계적 강도를 가장 잘 반영합니다.
- source_word: ταπεινωθῇ
  english_pob_choice: he is brought low
  chosen_korean: 낮아지더라도
  alternatives_korean:
  - 겸손해지더라도
  - 억눌리더라도
  - 비천해지더라도
  lexicon: ταπεινόω
  rationale: 여기서는 내적 겸손보다 외적 낮아짐/굴욕의 의미가 더 자연스러워 '낮아지다'로 옮겼습니다.
- source_word: φαιδρότερος ἀναφαίνεται
  english_pob_choice: reappears far more radiant
  chosen_korean: 훨씬 더 빛나게 나타납니다
  alternatives_korean:
  - 훨씬 더 환하게 드러납니다
  - 훨씬 더 빛을 내며 나타납니다
  - 훨씬 더 밝게 다시 나타납니다
  lexicon: φαιδρότερος / ἀναφαίνομαι
  rationale: φαιδρότερος의 시각적 밝음을 살리되, 한국어에서 과장되지 않게 '빛나게 나타납니다'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 의인의 고난 이후의 회복을 어떻게 표현할 것인가
  chosen_reading: 원문의 '잠시 낮아짐'과 '훨씬 더 빛나는 재출현'을 그대로 살려, 의인의 고난이 최종적 패배가 아니라 회복과 드러남으로 끝난다는 흐름을 유지했습니다.
  alternative_readings:
  - '''겸손해지다''로 영적 훈련의 의미를 강조하는 읽기'
  - '''더 존귀하게 된다''로 결과 중심으로 풀어 쓰는 읽기'
  rationale: 문맥은 윤리 교훈이면서도 요셉의 예를 들어 외적 상태의 전환을 말하므로, 고난-회복의 서사를 약화시키지 않는 표현이 적절합니다.
  doctrine_reference: 고난 후의 회복과 의인의 인내에 관한 성경적 전형
- issue: 요셉의 예시 연결
  chosen_reading: 마지막의 '내 형제 요셉이 그러하였습니다'를 설명 없이 직역에 가깝게 유지했습니다.
  alternative_readings:
  - '''요셉도 그랬습니다''처럼 현대적으로 축약하는 읽기'
  - '''곧 내 형제 요셉이 그러하였습니다''처럼 서술형으로 풀어 쓰는 읽기'
  rationale: 원문은 예시를 통해 앞선 진술을 확증하므로, 인물 소개를 과도하게 풀지 않고 간명하게 마무리하는 것이 적절합니다.
  doctrine_reference: 성경적 모범 인물로서 요셉의 전형성
