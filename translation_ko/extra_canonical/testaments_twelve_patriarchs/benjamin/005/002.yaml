id: T12P.BEN.5.2
reference: Testament of Benjamin 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἐὰν ἦτε ἀγαθοποιοῦντες καὶ *τὰ ἀκάθαρτα¹⁶ πνεύματα φεύξονται¹⁷ *ἀφʼ ὑμῶν¹⁸, καὶ¹⁹ τὰ θηρία²⁰ *φοβηθήσονται ὑμᾶς²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/002.yaml
  text: If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.
translation:
  language: ko
  text: 만일 여러분이 선을 행한다면, 부정한 영들은 여러분에게서 도망칠 것이며, 들짐승들도 여러분을 두려워할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοποιοῦντες
  english_pob_choice: doing good
  chosen_korean: 선을 행하고 있다면
  alternatives_korean:
  - 좋은 일을 하고 있다면
  - 선행하고 있다면
  lexicon: ἀγαθοποιέω
  rationale: 현재 진행형의 조건절로서 윤리적 선행의 지속을 자연스럽게 드러내기 위해 ‘선을 행하고 있다면’으로 옮겼습니다.
- source_word: τὰ ἀκάθαρτα πνεύματα
  english_pob_choice: the unclean spirits
  chosen_korean: 더러운 영들
  alternatives_korean:
  - 부정한 영들
  - 깨끗하지 않은 영들
  lexicon: ἀκάθαρτος + πνεύματα
  rationale: 영적 존재의 부정성은 ‘더러운’이 한국어에서 가장 직접적으로 전달하며, 종교적 관용구인 ‘부정한 영들’도 가능하지만 본문은 오염·불결의 뉘앙스를 살리는 쪽이 더 간명합니다.
- source_word: φεύξονται ἀφʼ ὑμῶν
  english_pob_choice: will flee from you
  chosen_korean: 여러분에게서 도망칠 것이며
  alternatives_korean:
  - 여러분에게서 달아날 것이며
  - 여러분을 피해 달아날 것이며
  lexicon: φεύγω + ἀπό
  rationale: ‘도망칠’은 ἀπό를 포함한 분리·회피의 동작을 자연스럽게 나타내며, 전투적·비유적 장면에서도 무리가 없습니다.
- source_word: τὰ θηρία φοβηθήσονται ὑμᾶς
  english_pob_choice: the wild beasts will fear you
  chosen_korean: 들짐승들도 여러분을 두려워할 것입니다
  alternatives_korean:
  - 들짐승들도 여러분을 무서워할 것입니다
  - 야생 짐승들도 여러분을 두려워할 것입니다
  lexicon: θηρία + φοβέομαι
  rationale: θηρία는 단순한 짐승보다 거친 야생동물을 가리키므로 ‘들짐승’이 적절하며, 여기에 ‘도’로 앞 절과 평행을 살렸습니다.
theological_decisions:
- issue: 악한 영적 존재와 야수의 회피를 선행의 결과로 제시하는 인과 구조
  chosen_reading: 윤리적 선행이 영적·피조계의 두려움과 회피를 불러오는 조건절로 유지했습니다.
  alternative_readings:
  - 도덕적 권면으로 완화
  - 상징적 표현으로 약화
  rationale: 본문은 실제 결과를 진술하는 서술형 구조이므로, 상징화하거나 약화하면 본문의 강한 약속성을 잃게 됩니다.
  doctrine_reference: 경전 본문 자체의 진술을 우선 보존하는 원칙
- issue: ‘더러운 영들’의 번역 톤
  chosen_reading: 전통 교회어의 ‘부정한 영들’ 대신 ‘더러운 영들’을 사용했습니다.
  alternative_readings:
  - 부정한 영들
  - 악한 영들
  rationale: 본문의 ἀκάθαρτος는 의례적 부정성뿐 아니라 오염·더러움의 감각을 포함하므로, 직역적이면서도 독자에게 즉시 이해되는 표현을 택했습니다.
  doctrine_reference: 어휘 의미 범위 보존 원칙
