revisions:
- from: 그러므로 너희도 좋은 마음을 가지면, 악한 사람들도 너희와 평화를 누릴 것이며, 방탕한 사람들은 너희에게 부끄러움을 당하여 선한 것으로 돌아올 것이고, 탐욕을 부리는 사람들은 자기들의 탐욕의 것들을 고난받는 이들에게 넘겨줄 것입니다.[a]
  to: 그러므로 너희도 좋은 마음을 가지면, 악한 사람들도 너희와 평화롭게 지낼 것이며, 방탕한 사람들은 너희를 보고 부끄러워하여 선한 것으로 돌아올 것이고, 탐욕스러운 사람들은 그 욕망에서 떠날 뿐 아니라 자기들이 지니고 있던 탐욕의 재물도 고난받는 이들에게 줄 것입니다.
  rationale: 누락된 ‘욕망에서 떠날 뿐 아니라’와 ‘자기들이 지니고 있던’을 복원하여 원문의 대조와 소유 관계를 살렸습니다. αἰδεσθέντες ὑμᾶς는 한국어 관용에 맞게 ‘너희를 보고 부끄러워하여’로, τὰ τῆς πλεονεξίας는 의미를 과도하게 특정하지 않으면서 자연스러운 ‘탐욕의 재물’로 다듬었습니다. 근거가 제공되지 않은 [a] 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:01Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ἀποστήσονται τοῦ πάθους(‘그 욕망/정념에서 떠나다’)와 οὐ μόνον … ἀλλὰ καί(‘…할 뿐 아니라 또한 …하다’)의 대조 구문을 빠뜨렸습니다. 또한 ἃ εἶχον에 해당하는 ‘그들이 지니고 있던’이 본문에서 명시되어야 합니다. 나머지 주요 대응은 대체로 원문과 영어 POB 감사 기록에 부합합니다.
  naturalness: ‘너희에게 부끄러움을 당하여’와 ‘탐욕의 것들’은 현대 한국어에서 부자연스럽습니다. 각각 ‘너희를 보고 부끄러워하여’와 ‘탐욕의 재물’로 옮기면 αἰδεσθέντες ὑμᾶς 및 τὰ τῆς πλεονεξίας의 의미 관계를 유지하면서 자연스럽습니다.
  terminology: ‘좋은 마음’, ‘악한 사람들’, ‘방탕한 사람들’은 문맥과 합쇼체 문체에 적절합니다. πάθος는 여기서 탐욕스러운 이들이 버려야 할 욕망/정념을 가리키므로, 탐욕(πλεονεξία)과 동일시하지 않고 ‘그 욕망’으로 번역했습니다.
  issues:
  - severity: high
    issue: ‘그 욕망에서 떠날 뿐 아니라’에 해당하는 절이 누락되었습니다.
    rationale: 원문의 οὐ μόνον ἀποστήσονται τοῦ πάθους ἀλλὰ καί는 탐욕스러운 이들이 욕망에서 떠나는 것과 재물을 주는 것을 병렬하는 핵심 구문입니다.
  - severity: medium
    issue: ἃ εἶχον(‘그들이 지니고 있던’)이 번역에 반영되지 않았습니다.
    rationale: ‘탐욕의 것들’만으로는 해당 재물이 그들의 기존 소유였다는 관계가 충분히 드러나지 않습니다.
  - severity: medium
    issue: ‘너희에게 부끄러움을 당하여’와 ‘탐욕의 것들’이 부자연스럽습니다.
    rationale: 전자는 수동적 피해의 뉘앙스를 불러올 수 있고, 후자는 한국어 명사 결합으로 어색합니다.
