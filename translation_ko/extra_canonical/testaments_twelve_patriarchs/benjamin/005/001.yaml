    issue: 본문 끝의 [a]에 대응하는 번역 주석이 제공되지 않았습니다.
    rationale: 검토 가능한 주석 목록에 [a]의 내용이 없으므로, 근거 없는 표지는 삭제하는 것이 안전합니다.
