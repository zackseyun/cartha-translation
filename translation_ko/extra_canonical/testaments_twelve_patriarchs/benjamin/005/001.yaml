id: T12P.BEN.5.1
reference: Testament of Benjamin 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: V. Ἐὰν ⸀οὖν καὶ ὑμεῖς¹· ἔχετε² ἀγαθὴν³ ⸀διάνοιαν⁴, καὶ⸃ οἱ πονηροὶ ἄνθρωποι⁵ *εἰρηνεύσουσιν μεθʼ ὑμῶν⁶, καὶ οἱ ἄσωτοι αἰδεσθέντες⁷ ὑμᾶς⁸ ⸀ἐπιστρέψουσιν⁹ εἰς *τὸ ἀγαθόν¹⁰, καὶ οἱ πλεονεκτοῦντες¹¹ οὐ μόνον ἀποστήσονται *τοῦ πάθους¹² ἀλλὰ καὶ *τὰ τῆς¹³ πλεονεξίας *ἃ εἶχον¹⁴ δώσουσιν¹⁵ τοῖς θλιβομένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/001.yaml
  text: If, then, you also have a good mind, even wicked people will be at peace with you, and the profligate, being put to shame by you, will turn to what is good; and those who are greedy will not only turn away from their passion, but will also give to those in distress the things of greed that they had.
translation:
  language: ko
  text: 그러므로 너희도 좋은 마음을 가지면, 악한 사람들도 너희와 평화를 누릴 것이며, 방탕한 사람들은 너희에게 부끄러움을 당하여 선한 것으로 돌아올 것이고, 탐욕을 부리는 사람들은 자기들의 탐욕의 것들을 고난받는 이들에게 넘겨줄 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὴν διάνοιαν
  english_pob_choice: a good mind
  chosen_korean: 좋은 마음
  alternatives_korean:
  - 선한 생각
  - 건전한 마음
  - 착한 심성
  lexicon: διάνοια
  rationale: διάνοια는 단순한 지적 기능보다 마음의 태도와 생각의 방향을 함께 가리키므로, POB의 ‘a good mind’를 자연스럽게 살린 ‘좋은 마음’으로 옮겼습니다.
- source_word: οἱ πονηροὶ ἄνθρωποι
  english_pob_choice: wicked people
  chosen_korean: 악한 사람들
  alternatives_korean:
  - 악인들
  - 사악한 사람들
  - 불의한 사람들
  lexicon: πονηρός
  rationale: 포악함보다 도덕적 악함을 나타내는 일반적 표현으로 이해하여, 문맥상 무난한 ‘악한 사람들’을 택했습니다.
- source_word: ἄσωτοι
  english_pob_choice: profligate
  chosen_korean: 방탕한 사람들
  alternatives_korean:
  - 방탕자들
  - 난봉꾼들
  - 탕진하는 사람들
  lexicon: ἄσωτος
  rationale: POB가 ‘lawless’에서 수정하여 ‘profligate’로 확정한 만큼, 성적·도덕적 문란을 내포하는 ‘방탕한 사람들’이 가장 직접적입니다.
- source_word: αἰδεσθέντες ὑμᾶς
  english_pob_choice: being put to shame by you
  chosen_korean: 너희에게 부끄러움을 당하여
  alternatives_korean:
  - 너희 때문에 부끄러워하여
  - 너희를 보고 부끄러워하여
  - 너희에게 수치를 당하여
  lexicon: αἰδέομαι
  rationale: 수치심을 느끼는 주체는 그들이고 원인은 ‘너희’이므로, 관계를 드러내는 수동적 표현 ‘부끄러움을 당하여’로 옮겼습니다.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  english_pob_choice: the things of greed that they had
  chosen_korean: 자기들의 탐욕의 것들
  alternatives_korean:
  - 탐욕으로 얻은 것들
  - 탐욕의 소유물들
  - 가지고 있던 탐욕의 것들
  lexicon: πλεονεξία
  rationale: 원문은 ‘가지고 있던’이라는 소유 사실을 분명히 하되 과잉 번역을 피하므로, POB의 수정 취지를 따라 간결하게 ‘자기들의 탐욕의 것들’로 옮겼습니다.
theological_decisions:
- issue: ‘좋은 마음’이 단순한 심리 상태인지, 윤리적·영적 태도인지
  chosen_reading: 윤리적 삶을 낳는 내적 태도와 생각의 정향으로 읽었습니다.
  alternative_readings:
  - 지적 사고력
  - 일시적 호의
  - 도덕적 성향
  rationale: 문맥에서 ‘악한 사람들’과 ‘탐욕을 부리는 사람들’의 변화가 이어지므로, 단순한 심리 상태보다 공동체를 향한 선한 내적 방향을 뜻한다고 보는 것이 자연스럽습니다.
  doctrine_reference: 잠언적 권면의 문맥 이해
