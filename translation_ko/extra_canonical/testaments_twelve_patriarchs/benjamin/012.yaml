base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012.yaml
  text: '1. And after saying these things, he stretched out his feet and fell asleep in a good sleep[a].

    2. And his sons did as he had commanded them, and they carried up his body and buried him in Hebron with his fathers.


    2. The number of his life was one hundred and twenty-five years[b]. And when he had finished his words, he said, “I command you, my children, carry up my bones out of Egypt, and bury me in Hebron near my fathers.”

    2. And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.

    3. And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly during the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].

    4. And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.'
  footnotes:
  - marker: a
    text: Some Greek witnesses add 'and good' after 'a good sleep.'
    reason: textual_variant
  - marker: b
    text: The chapter preserves overlapping closing notices about Benjamin's death, burial, and the later transfer of the patriarchs' bones. The repetition likely reflects a complex transmission history, but it is translated here as it stands in the Greek witness.
    reason: textual_variant
  - marker: c
    text: The phrase 'beside the feet of their fathers' is literal Greek and may refer to burial placement near the ancestral tombs rather than directly at the fathers' feet.
    reason: lexical_alternative
translation:
  language: ko
  text: '1. 이 말을 하고 나서 그는 발을 쭉 뻗고 좋은 잠[a]에 잠들었습니다. 그의 아들들은 그가 그들에게 명령한 대로 하여 그의 시신을 메고 헤브론에서 그의 조상들과 함께 장사했습니다. 그가 말을 모두 마친 뒤에 이렇게 말했습니다. “내가 너희, 내 자녀들에게 명령합니다. 내 뼈를 이집트에서 가져와 헤브론에서 내 조상들 가까이에 나를 장사하십시오.”


    2. 베냐민은 좋은 노년에 백이십오 세로 죽었고[b], 그들은 그를 관에 안치했습니다.


    3. 이스라엘 자손이 이집트에서 떠난 뒤 아흔한째 해에, 그들과 그들의 형제들은 가나안에서 전쟁 중에 자기 조상들의 뼈를 몰래 가져와, 헤브론에서 자기 조상들의 발 곁에 장사했습니다[c].


    4. 그들은 가나안 땅에서 돌아와, 이집트 땅에서 떠나는 날까지 이집트에서 살았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 그리스어 사본은 ‘좋은 잠’ 뒤에 ‘그리고 선한’을 덧붙입니다.
    reason: textual_variant
  - marker: b
    text: 이 장에는 베냐민의 죽음과 매장, 그리고 뒤이은 족장들의 뼈 이장에 관한 종결 고지들이 서로 겹쳐 보존되어 있습니다. 이는 복잡한 전승 과정을 시사할 수 있으나, 여기서는 그리스어 사본의 본문을 그대로 번역했습니다.
    reason: textual_variant
  - marker: c
    text: ‘조상들의 발 곁에’는 그리스어를 직역한 표현입니다. 조상들의 발 바로 곁이라기보다, 조상 묘소 가까이의 매장 위치를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  english_pob_choice: fell asleep in a good sleep
  chosen_korean: 좋은 잠에 잠들었습니다
  alternatives_korean:
  - 편안히 잠들었습니다
  - 좋은 잠을 잤습니다
  lexicon: LSJ
  rationale: 죽음을 잠으로 말하는 완곡법을 살리되, ‘잠들다’로 반복된 수면 어휘를 유지했습니다.
- source_word: ἄραντες
  english_pob_choice: carried up
  chosen_korean: 메고 올라가
  alternatives_korean:
  - 들고 올라가
  - 옮겨
  lexicon: LSJ
  rationale: 시신을 실제로 들어 운반하는 동작을 살리면서, 뒤의 ‘내 뼈를 … 메고 올라가서’와 어휘적 연결도 보존했습니다.
- source_word: ἐντέλλομαι / ἀνενέγκατε
  english_pob_choice: I command / carry up
  chosen_korean: 내가 … 명령합니다 / 메고 올라가서
  alternatives_korean:
  - 내가 … 지시합니다 / 가져가서
  - 내가 … 당부합니다 / 옮겨
  lexicon: BDAG, LSJ
  rationale: 유언의 권위가 강한 문맥이므로 ‘명령합니다’를 택했고, ἀνενέγκατε는 ‘메고 올라가서’로 옮겨 출애굽지에서의 이동 방향을 드러냈습니다.
- source_word: ἐν γήρει καλῷ
  english_pob_choice: in a good old age
  chosen_korean: 좋은 노년의
  alternatives_korean:
  - 복된 노년에
  - 평안한 노년에
  lexicon: LSJ
  rationale: 전형적인 성서적 표현을 한국어의 자연스러운 문장으로 옮기되, ‘좋은’의 평가적 뉘앙스를 유지했습니다.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  english_pob_choice: beside the feet of their fathers
  chosen_korean: 자기들의 조상들의 발 곁에
  alternatives_korean:
  - 조상들의 발치에
  - 조상들의 발 가까이에
  lexicon: LSJ
  rationale: 헬라어의 구체적인 신체 이미지를 완화하지 않고 살렸습니다. 장지의 정확한 배치보다 ‘발 곁’이라는 표현 자체가 핵심입니다.
theological_decisions:
- issue: 반복되는 장례·유해 이동 진술
  chosen_reading: 본문에 보존된 반복과 중복을 그대로 옮겼습니다.
  alternative_readings:
  - 더 매끄럽게 하나로 합쳐 번역함
  - 후대적 반복으로 보이는 대목을 삭제함
  rationale: 이 장은 전승된 그리스어 본문 자체가 중첩된 종결 진술을 담고 있으므로, 조화시키지 않고 드러내는 것이 투명성에 맞습니다.
  doctrine_reference: 원문 직접 번역 원칙
- issue: ‘관에 안치했습니다’의 해석
  chosen_reading: ἐν παραθήκῃ를 문맥상 ‘관’으로 옮겼습니다.
  alternative_readings:
  - ‘위탁 상태에 두었습니다’
  - ‘보관함에 두었습니다’
  rationale: 장례 문맥에서 독자가 이해할 수 있는 가장 자연스러운 실재를 택했지만, 본문의 이상한 표현성은 가능한 한 유지했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
