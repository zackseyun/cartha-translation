base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001.yaml
  text: 'The Copy of the Words of Benjamin[a], the twelfth son of Jacob, which he set in order for his sons, having lived one hundred and twenty-five years.


    And after kissing them, he said:


    Just as Isaac was born to Abraham in his old age, so I also was born to Jacob. And since Rachel my mother died while giving birth to me, I had no milk; so I was nursed by Bilhah, her maidservant. For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and after conceiving she bore me. For my father loved Rachel exceedingly, and he prayed to see two sons from her. Because of this I was called Benjamin[b], which means son of days.'
  footnotes:
  - marker: a
    text: Genesis more commonly explains the name Benjamin differently; here the Greek testament gives the etymology 'son of days.'
    reason: cross_reference
  - marker: b
    text: 'The Greek line about Rachel''s death at Benjamin''s birth is textually awkward in this OCR layer, but the sense is clear in context: she died in giving birth to him.'
    reason: textual_variant
translation:
  language: ko
  text: '베냐민, 곧 야곱과 라헬의 열두째 아들의 말의 사본입니다. 그는 자기 아들들을 위해 이것을 정리하였고, 백이십오 년을 살았습니다.


    그들을 입맞추고는 말하였습니다.


    “이삭이 아브라함에게 그의 노년 중에 태어났듯이, 나도 야곱에게 그렇게 태어났습니다. 또 내 어머니 라헬은 나를 낳다가 죽었으므로 나는 젖이 없었습니다. 그래서 나는 그녀의 여종 빌하에게서 젖을 먹었습니다. 라헬은 요셉을 낳은 뒤 십이 년 동안 불임이었으나, 금식하며 주님께 기도하였고, 잉태한 뒤에 나를 낳았습니다. 내 아버지는 라헬을 매우 사랑하였고, 그녀에게서 두 아들을 보기를 바라셨습니다. 그러므로 나는 베냐민이라 불렸는데, 그것은 ‘날들의 아들’이라는 뜻입니다.”[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη ... Ἀντίγραφον λόγων
  english_pob_choice: The Copy of the Words
  chosen_korean: “말의 사본”
  alternatives_korean:
  - “말들의 사본”
  - “유언의 사본”
  lexicon: LSJ
  rationale: Διαθήκη와 Ἀντίγραφον λόγων의 결합을 직역하기보다, 본문 머리말의 문서적 성격을 드러내는 쪽으로 ‘말의 사본’이라 옮겨 Greek witness의 형식을 살렸습니다.
- source_word: διέθετο
  english_pob_choice: set in order
  chosen_korean: “정리하였고”
  alternatives_korean:
  - “배열하였고”
  - “마련하였고”
  - “유언으로 남겼고”
  lexicon: LSJ
  rationale: 유언적 문맥에서 단순한 ‘말하다’보다 아들에게 전해질 내용을 체계적으로 정리했다는 뉘앙스를 살리기 위해 ‘정리하였고’로 옮겼습니다.
- source_word: μετὰ νηστείας
  english_pob_choice: with fasting
  chosen_korean: “금식하며”
  alternatives_korean:
  - “금식과 함께”
  - “금식 중에”
  lexicon: LSJ
  rationale: 기도와 병렬되는 수단/상태를 자연스럽게 드러내면서도, 행위의 절제를 분명히 보여 주는 표현으로 ‘금식하며’를 택했습니다.
- source_word: ὅ ἐστιν υἱὸς ἡμερῶν
  english_pob_choice: which means son of days
  chosen_korean: “날들의 아들”
  alternatives_korean:
  - “날의 아들”
  - “세월의 아들”
  - “나이 든 아들”
  lexicon: LSJ
  rationale: 본문이 라헬의 사건과는 별도로 그리스어 자체의 어원 설명을 제시하므로, 전통적 히브리어 설명과 구분되는 ‘날들의 아들’을 그대로 반영했습니다.
- source_word: τῷ Ἰακώβ
  english_pob_choice: to Jacob
  chosen_korean: “야곱에게”
  alternatives_korean:
  - “야곱에게도”
  - “야곱에게서”
  lexicon: LSJ
  rationale: 이스라엘 족장 야곱을 지시하는 여격을 한국어 목적어격으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 베냐민 이름 설명의 전통과 그리스어 증언의 긴장
  chosen_reading: 본문의 그리스어 설명대로 ‘날들의 아들’로 옮겼습니다.
  alternative_readings:
  - 전통적 설명인 ‘오른손의 아들’로 조정하기
  - ‘노년의 아들’로 의미화하기
  rationale: 창세기의 전통적 어원과 다른 그리스어 본문의 자기 해설을 보존하는 것이 이 번역 단위의 투명성에 더 부합합니다.
  doctrine_reference: 원문 증언 우선 원칙; 상호본문적 긴장 보존
- issue: 라헬이 베냐민을 낳다가 죽었다는 표현
  chosen_reading: ‘나를 낳다가 죽었으므로’로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘나를 낳을 때 죽었습니다’
  - ‘나를 낳는 중에 죽었습니다’
  rationale: 본문의 난삽한 전승 흔적을 완화하지 않고, 사건의 충격과 맥락을 그대로 드러내는 표현을 택했습니다.
  doctrine_reference: 본문 비평적 투명성
