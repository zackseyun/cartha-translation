revisions:
- from: '베냐민, 곧 야곱과 라헬의 열두째 아들의 말의 사본입니다. 그는 자기 아들들을 위해 이것을 정리하였고, 백이십오 년을 살았습니다.


    그들을 입맞추고는 말하였습니다.


    “이삭이 아브라함에게 그의 노년 중에 태어났듯이, 나도 야곱에게 그렇게 태어났습니다. 또 내 어머니 라헬은 나를 낳다가 죽었으므로 나는 젖이 없었습니다. 그래서 나는 그녀의 여종 빌하에게서 젖을 먹었습니다. 라헬은 요셉을 낳은 뒤 십이 년 동안 불임이었으나, 금식하며 주님께 기도하였고, 잉태한 뒤에 나를 낳았습니다. 내 아버지는 라헬을 매우 사랑하였고, 그녀에게서 두 아들을 보기를 바라셨습니다. 그러므로 나는 베냐민이라 불렸는데, 그것은 ‘날들의 아들’이라는 뜻입니다.”[a][b]'
  to: '베냐민, 곧 야곱과 라헬의 열두째 아들의 유언입니다.


    1. 베냐민이 백스물다섯 해를 살고 자기 아들들에게 남긴 말의 사본입니다.


    2. 그들을 거듭 입맞추고 말하였습니다.


    “이삭이 아브라함이 늙었을 때 태어났던 것처럼, 나도 야곱에게 태어났습니다. 3. 내 어머니 라헬은 나를 낳다가 죽었으므로[b], 나는 젖을 먹을 수 없었습니다. 그래서 나는 라헬의 여종 빌하에게서 젖을 먹었습니다. 4. 라헬은 요셉을 낳은 뒤 열두 해 동안 아이를 낳지 못하였으나, 금식하며 주님께 기도하였고, 잉태하여 나를 낳았습니다. 5. 내 아버지는 라헬을 몹시 사랑하셨고, 라헬에게서 두 아들을 보기를 기도하셨습니다. 6. 그러므로 나는 베냐민이라 불렸습니다[a]. 그 이름은 ‘날들의 아들’이라는 뜻입니다.”'
  rationale: 표제의 ‘유언’을 복원하고, 수신자를 ‘아들들에게’로 바로잡았습니다. 문서 표제와 서술의 문체를 현대적이면서도 격식 있는 합쇼체로 정리했으며, 원문의 명시적 기도 행위와 그리스어식 이름 풀이를 보존했습니다. 두 각주는 각각 관련 단어와 사건에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:06Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 라헬의 죽음, 빌하의 수유, 라헬의 금식 기도, 그리고 ‘날들의 아들’이라는 그리스어 내부 어원 설명을 대체로 충실히 반영합니다. 그러나 표제의 Διαθήκη를 누락했고, ‘자기 아들들을 위해’는 τοῖς υἱοῖς αὐτοῦ(그의 아들들에게)를 ‘위하여’로 바꾸어 전달 대상을 흐립니다. 또한 εὔχετο는 ‘바라셨습니다’보다 ‘기도하셨습니다’가 직접적입니다.
  naturalness: ‘말의 사본’ 및 ‘그는 … 정리하였고’는 표제부로서 다소 부자연스럽고, 현대 한국어 합쇼체 문장으로도 일관되지 않습니다. ‘유언’과 ‘…에게 남긴 말의 사본’으로 문서의 성격과 수신자를 자연스럽게 나타낼 수 있습니다. ‘젖이 없었습니다’는 원문의 압축성을 살리되 한국어에서는 ‘젖을 먹을 수 없었습니다’가 의미상 더 명료합니다.
  terminology: 고유명사 베냐민, 야곱, 라헬, 빌하 및 ‘주님’은 적절합니다. υἱὸς ἡμερῶν은 전통적 이름 풀이로 조화시키지 않고 ‘날들의 아들’로 보존해야 합니다. Διαθήκη는 이 문맥에서 교리적 의미를 덧붙이지 않는 ‘유언’이 적절합니다.
  issues:
  - severity: medium
    issue: 표제의 Διαθήκη가 번역에서 빠졌습니다.
    rationale: 원문은 ‘베냐민의 유언’이라는 문서 표제 뒤에 ‘베냐민의 말의 사본’을 이어 놓습니다. 후자만 번역하면 표제의 장르 표지가 소실됩니다.
  - severity: medium
    issue: τοῖς υἱοῖς αὐτοῦ를 ‘자기 아들들을 위해’로 옮겼습니다.
    rationale: 여격은 내용을 받는 대상, 곧 ‘그의 아들들에게’를 가리킵니다. ‘위해’는 목적·수혜의 뜻을 더해 원문의 관계를 흐립니다.
  - severity: low
    issue: ἐξ αὐτῆς와 εὔχετο의 번역이 각각 다소 완곡합니다.
    rationale: ‘그녀에게서’는 선행사 라헬을 명시하는 편이 자연스럽고, ‘보기를 바라셨습니다’보다 ‘보기를 기도하셨습니다’가 εὔχετο의 종교적 행위를 그대로 반영합니다.
  - severity: low
    issue: 각주 표지가 문단 끝에 함께 붙어 있어 해당 본문과의 연결이 불명확합니다.
    rationale: 이름 어원 각주는 ‘베냐민’에, 라헬의 출산 중 죽음에 관한 본문비평 각주는 해당 절에 직접 붙여야 합니다.
