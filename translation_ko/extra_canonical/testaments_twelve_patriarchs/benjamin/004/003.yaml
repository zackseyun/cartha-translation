id: T12P.BEN.4.3
reference: Testament of Benjamin 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⸢Κἂν *μὴ βούλωνται περὶ αὐτοῦ εἰς καλά¹⁴, *οὗτος τὸ ἀγαθὸν ποιῶν¹⁵ νικᾷ τὸ κακόν, σκεπόμενος¹⁶ ὑπὸ τοῦ Θεοῦ¹⁷⸣. τοὺς †ἀδικοῦντας¹⁸ ἀγαπᾷ ὡς τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/003.yaml
  text: And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.
translation:
  language: ko
  text: 비록 그들이 그에게 선한 뜻을 품지 않는다 해도, 그는 선을 행함으로 악을 이기며, 하나님께서 그를 보호하십니다. 그는 자신과 같이 그에게 해를 끼치는 이들을 사랑합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ βούλωνται περὶ αὐτοῦ εἰς καλά
  english_pob_choice: they do not intend good toward him
  chosen_korean: 그들이 그에게 선한 뜻을 품지 않는다
  alternatives_korean:
  - 그에게 좋은 것을 바라지 않는다
  - 그에게 선을 의도하지 않는다
  lexicon: βουλομαι; εἰς καλά
  rationale: εἰς καλά를 단순한 ‘좋은 것들’이 아니라 상대를 향한 선한 의도/뜻으로 이해해 자연스럽게 옮겼습니다.
- source_word: τὸ ἀγαθὸν ποιῶν νικᾷ τὸ κακόν
  english_pob_choice: by doing good he overcomes evil
  chosen_korean: 선을 행함으로 악을 이기며
  alternatives_korean:
  - 선을 행하여 악을 이기며
  - 선한 일을 함으로 악을 이기며
  lexicon: ἀγαθόν; ποιέω; νικάω
  rationale: 행위의 수단성을 드러내기 위해 ‘~함으로’로 옮기되, ἀγαθόν은 일반적 ‘선’으로 간결하게 처리했습니다.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  english_pob_choice: being sheltered by God
  chosen_korean: 하나님께서 그를 보호하십니다
  alternatives_korean:
  - 하나님께서 그를 가리십니다
  - 하나님 아래에서 보호를 받습니다
  lexicon: σκεπάζω; ὑπό + genitive; Θεός
  rationale: 수동 분사를 한국어 수동 표현으로 풀어내면서, ‘덮임/가림’의 이미지보다 현재적 보호의 의미가 살아나도록 했습니다.
- source_word: τοὺς ἀδικοῦντας
  english_pob_choice: those who wrong him
  chosen_korean: 그에게 해를 끼치는 이들
  alternatives_korean:
  - 그에게 잘못하는 이들
  - 그를 부당하게 대하는 이들
  lexicon: ἀδικέω
  rationale: ἀδικέω의 폭넓은 ‘해침/잘못함’ 의미를 살려, 관계적·실질적 피해를 주는 대상으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 보호를 나타내는 수동 분사 구문
  chosen_reading: ‘하나님께서 그를 보호하십니다’로 능동화해 의미를 분명히 했습니다.
  alternative_readings:
  - ‘하나님께 덮여 있습니다’
  - ‘하나님 아래에서 보호를 받습니다’
  rationale: 한국어에서는 수동 분사가 그대로 남으면 이미지가 불분명해질 수 있어, 문맥상 의도된 하나님의 보호를 직접 드러냈습니다.
  doctrine_reference: 섭리와 보호에 대한 성경적 표현의 한국어 가독성
