  to: 선한 사람은 어두운 눈을 가지지 않습니다. 그가 모든 사람에게 자비를 베풀기 때문입니다. 그들이 죄인일지라도 말입니다.
  rationale: 원문의 이유를 나타내는 γάρ를 ‘때문입니다’로, 죄인 여부에도 불구하고 자비를 베푼다는 κἄν의 양보를 ‘죄인일지라도 말입니다’로 옮겼습니다. ‘어두운 눈’은 특정 해석을 강요하지 않고 그대로 보존했으며, 비문적 종결과 근거 없는 각주 표지는 제거했습니다.
