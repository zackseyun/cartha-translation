  source_fidelity: 원문의 대조(γάρ)와 양보절(κἂν ... ὦσιν)은 대체로 반영되었습니다. 다만 현행 번역의 끝맺음인 “비록 그들이 죄인일지라도 그렇습니다”는 원문에 없는 지시·확인 표현을 덧붙이며 한국어 문장으로도 부자연스럽습니다.
  naturalness: ‘어두운 눈’이라는 의도적으로 해석을 열어 둔 비유는 유지할 수 있습니다. 그러나 ‘자비를 베푸니, 비록 … 그렇습니다’의 연결은 비문에 가까우므로, 이유와 양보를 자연스러운 현대 합쇼체로 재구성해야 합니다.
  terminology: ‘선한 사람’, ‘어두운 눈’, ‘자비를 베풀다’, ‘죄인’은 각각 ἀγαθὸς ἄνθρωπος, σκοτεινὸς ὀφθαλμός, ἐλεεῖ, ἁμαρτωλοί에 적절히 대응합니다. ‘어두운 눈’의 정확한 관용적 함의는 단정하지 않는 것이 바람직합니다.
  issues:
