  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ¹⁰ ἀγαθὸς ⁹ἄνθρωπος⁹ οὐκ ἔχει σκοτεινὸν ὀφθαλμόν¹¹, ἐλεεῖ¹² γὰρ πάντας, κἂν *ἁμαρτωλοὶ ὦσιν¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/002.yaml
  text: For the good man does not have a dark eye, for he has mercy on all, even if they are sinners.
translation:
  language: ko
  text: 선한 사람은 어두운 눈을 가지지 않습니다. 그가 모든 사람에게 자비를 베풀기 때문입니다. 그들이 죄인일지라도 말입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  english_pob_choice: the good man
  chosen_korean: 선한 사람
  alternatives_korean:
  - 좋은 사람
  - 선한 사람은
  lexicon: ἀγαθός, ἄνθρωπος
  rationale: ἀγαθός는 도덕적 선함을 가리키므로 ‘선한’이 적절하고, ἄνθρωπος는 문맥상 특정 남성이 아니라 일반적인 ‘사람’으로 옮겼습니다.
- source_word: οὐκ ἔχει σκοτεινὸν ὀφθαλμόν
  english_pob_choice: does not have a dark eye
  chosen_korean: 어두운 눈을 가지지 않습니다
  alternatives_korean:
  - 어두운 눈을 갖지 않습니다
  - 어둠한 눈을 가지지 않습니다
  lexicon: σκοτεινός, ὀφθαλμός
  rationale: σκοτεινὸν ὀφθαλμόν을 직역에 가깝게 옮기되, 한국어에서는 ‘어두운 눈’이 가장 자연스럽고 이미지도 보존합니다.
- source_word: ἐλεεῖ γὰρ πάντας
  english_pob_choice: for he has mercy on all
  chosen_korean: 그는 모든 사람에게 자비를 베푸니
  alternatives_korean:
  - 그는 모든 이에게 긍휼을 베푸니
  - 그는 모두에게 자비를 보이니
  lexicon: ἐλεέω, πάντας
  rationale: ἐλεεῖ는 단순한 감정이 아니라 실제로 자비를 베푸는 행위이므로 ‘자비를 베풀다’로 옮겼고, πάντας는 ‘모든 사람에게’로 분명히 했습니다.
- source_word: ἁμαρτωλοὶ ὦσιν
  english_pob_choice: they are sinners
  chosen_korean: 그들이 죄인일지라도
  alternatives_korean:
  - 그들이 죄인이라도
  - 그들이 죄인일지라도
  lexicon: ἁμαρτωλός, κἂν
  rationale: κἂν은 양보를 나타내므로 ‘-일지라도’로 옮겨, 죄인이라는 상태가 자비의 범위를 제한하지 않음을 드러냈습니다.
theological_decisions:
- issue: ‘어두운 눈’ 이미지의 의미
  chosen_reading: 이 표현을 도덕적 편협함이나 악의적 시선의 비유로 유지하고, 의미를 과도하게 해석하지는 않았습니다.
  alternative_readings:
  - 편견 있는 눈
  - 사악한 눈
  - 인색한 눈
  rationale: 원문은 비유적 표현을 제시할 뿐이므로, 한국어에서도 상징을 보존하되 구체적 해석을 단정하지 않는 편이 원문에 충실합니다.
  doctrine_reference: Theological neutrality / literary imagery
