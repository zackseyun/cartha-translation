id: T12P.BEN.4.1
reference: Testament of Benjamin 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IV. ¹Ἴδετε¹ οὖν², *τέκνα μου³, τοῦ ἀγαθοῦ ἀνδρὸς⁴ τὸ τέλος⁵. μιμήσασθε⁶ [* ἐν ἀγαθῇ διὰ⁷ τὴν εὐσπλαγχνίαν⁷ αὐτοῦ, ἵνα ⁸καὶ ὑμεῖς⁷ στεφάνους⁸ δόξης φορέσητε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/001.yaml
  text: See then, my children, the end of the good man. Imitate [in goodness] because of his compassion, so that you also may wear crowns of glory.
translation:
  language: ko
  text: 그러므로, 내 자녀들아, 좋은 사람의 끝을 보십시오. 그의 긍휼로 말미암아 선함 안에서 본받으십시오. 그러면 너희도 영광의 관들을 쓰게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδετε οὖν
  english_pob_choice: See then
  chosen_korean: 그러므로 … 보십시오
  alternatives_korean:
  - 그러니 … 보십시오
  - 그런즉 … 보십시오
  lexicon: Ἴδετε
  rationale: 권면형 명령을 자연스러운 합쇼체로 살리되, οὖν의 연결 논리를 드러내기 위해 ‘그러므로’를 앞에 두었습니다.
- source_word: τὸ τέλος
  english_pob_choice: the end
  chosen_korean: 끝
  alternatives_korean:
  - 마침
  - 결말
  - 종말
  lexicon: τέλος
  rationale: 문맥상 생애의 마무리와 결과를 가리키므로, 과도하게 신학화하지 않고 가장 직접적인 대응인 ‘끝’으로 옮겼습니다.
- source_word: μιμήσασθε [ἐν ἀγαθῇ]
  english_pob_choice: Imitate [in goodness]
  chosen_korean: 선함 안에서 본받으십시오
  alternatives_korean:
  - 선하게 본받으십시오
  - '[선함 안에서] 본받으십시오'
  - 좋은 일을 본받으십시오
  lexicon: μιμέομαι
  rationale: 그리스어 전치사구 ἐν ἀγαθῇ를 단순 목적어로 바꾸지 않고, 행위의 방식인 ‘안에서’로 보존해 본받음의 영역을 분명히 했습니다.
- source_word: εὐσπλαγχνίαν
  english_pob_choice: compassion
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 연민
  - 동정
  lexicon: εὐσπλαγχνία
  rationale: 내장적 연민을 뜻하는 강한 동정심을 한국어 성경어법의 ‘긍휼’로 옮겨 도덕적 온정 이상을 유지했습니다.
- source_word: στεφάνους δόξης
  english_pob_choice: crowns of glory
  chosen_korean: 영광의 관들
  alternatives_korean:
  - 영광의 월계관들
  - 영광의 면류관들
  - 영광의 왕관들
  lexicon: στέφανος
  rationale: δόξης의 수식 관계를 그대로 살리되, στεφάνους를 상징적 왕권보다 상급의 상징인 ‘관들’로 번역했습니다.
theological_decisions:
- issue: 권면의 표준어 톤과 직접 인용 여부
  chosen_reading: 저자는 독자에게 직접 권면하는 형태로 ‘보십시오’와 ‘본받으십시오’를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화하여 ‘볼 수 있습니다’
  - 권면을 줄여 ‘보게 됩니다’
  rationale: 원문의 명령법을 약화하면 교훈적 긴장과 호소력이 줄어들므로, 직접 권면의 힘을 유지했습니다.
  doctrine_reference: 문학적-수사적 충실성
