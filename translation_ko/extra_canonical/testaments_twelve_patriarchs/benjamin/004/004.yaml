reference: Testament of Benjamin 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἐάν¹⁹ τις δοξάζηται²⁰, οὐ²¹ φθονεῖ αὐτόν²²· ἐάν τις πλουτεῖ²³, οὐ ζηλοῖ²⁴· *ἐάν τις ἀνδρεῖος²⁵, ἐπαινεῖ²⁶ αὐτόν²⁷· τὸν σώφρονα ἀγαπῶν²⁸· ⸀τὸν πένητα ἐλεεῖ²⁹· *τῷ ἀσθενοῦντι³⁰ συμπάσχει³¹· τὸν Θεὸν φοβεῖται³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/004.yaml
  text: If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.
translation:
  language: ko
  text: 누구든지 영화롭게 되면, 그를 시기하지 않습니다. 누구든지 부자가 되면, 질투하지 않습니다. 누구든지 용감하면, 그를 칭찬합니다. 절제하는 사람을 사랑합니다. 가난한 사람을 불쌍히 여기고, 약한 사람과 함께 고난을 받으며, 하나님을 두려워합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζηται
  english_pob_choice: is glorified
  chosen_korean: 영화롭게 되면
  alternatives_korean:
  - 영광을 받으면
  - 영예를 얻으면
  lexicon: δοξάζω
  rationale: 수동형의 ‘영화롭게 되다’가 지위의 상승을 비교적 직접적으로 드러내므로, 문맥상 가장 자연스럽고도 원문에 가까운 표현으로 옮겼습니다.
- source_word: φθονεῖ / ζηλοῖ
  english_pob_choice: does not envy / is not jealous
  chosen_korean: 시기하지 않습니다 / 질투하지 않습니다
  alternatives_korean:
  - 부러워하지 않습니다
  - 탐내지 않습니다
  lexicon: φθονέω / ζηλόω
  rationale: 두 동사를 분리해, 전자는 타인의 높아짐에 대한 시기, 후자는 타인의 소유에 대한 질투라는 뉘앙스를 살렸습니다.
- source_word: τὸν σώφρονα
  english_pob_choice: the self-controlled man
  chosen_korean: 절제하는 사람
  alternatives_korean:
  - 신중한 사람
  - 자제하는 사람
  lexicon: σώφρων
  rationale: 행위적·윤리적 특성을 드러내는 말이므로, ‘절제하는’이 문맥의 덕목 표현을 가장 잘 반영합니다.
- source_word: τὸν πένητα
  english_pob_choice: the poor
  chosen_korean: 가난한 사람
  alternatives_korean:
  - 빈곤한 사람
  - 가난한 자
  lexicon: πένης
  rationale: 사회적 계층으로 뭉뚱그리기보다 사람을 가리키는 구조를 살려, 현대 한국어에서 자연스러운 ‘가난한 사람’으로 옮겼습니다.
- source_word: συμπάσχει
  english_pob_choice: he suffers together with
  chosen_korean: 함께 고난을 받으며
  alternatives_korean:
  - 함께 아파하며
  - 동참하여 고난을 겪으며
  lexicon: συμπάσχω
  rationale: ‘함께’의 공동성은 유지하되, 단순한 감정 공유가 아니라 실제 고난의 참여라는 뜻을 드러내기 위해 ‘고난을 받다’를 택했습니다.
- source_word: τὸν Θεὸν φοβεῖται
  english_pob_choice: he fears God
  chosen_korean: 하나님을 두려워합니다
  alternatives_korean:
  - 하나님을 경외합니다
  - 하나님을 무서워합니다
  lexicon: φοβέομαι
  rationale: 독자에게 익숙한 종교어인 ‘경외하다’도 가능하지만, 원문의 두려움과 경외를 함께 담는 직역적 표현으로 ‘두려워합니다’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 φοβεῖται 의미를 ‘찬양하다’가 아니라 ‘두려워하다/경외하다’로 확정하는 문제
  chosen_reading: ‘하나님을 두려워합니다’로 옮겨, 원문의 경외-두려움의 종교적 태도를 보존했습니다.
  alternative_readings:
  - 하나님을 경외합니다
  - 하나님께 찬양을 드립니다
  rationale: 본문의 그리스어는 Θεὸν φοβεῖται이므로, 최신 보정에서 바로잡힌 대로 ‘두려워하다’ 계열을 반영해야 합니다. ‘찬양하다’는 본문 근거가 약합니다.
  doctrine_reference: 경외(fear of God) 전통적 성서 어휘
