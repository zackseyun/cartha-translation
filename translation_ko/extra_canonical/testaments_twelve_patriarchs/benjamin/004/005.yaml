  text: Καὶ τὸν ἔχοντα χάριν *ἀγαθοῦ πνεύματος³³ ἀγαπᾷ κατὰ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/005.yaml
  text: And he loves the one who has the grace of a good spirit as his own soul.
translation:
  language: ko
  text: 그리고 선한 영의 은혜를 가진 사람을 자기 영혼처럼 사랑합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ἔχοντα χάριν
  english_pob_choice: the one who has the grace
  chosen_korean: 은혜를 가진 사람
  alternatives_korean:
  - 은혜를 지닌 사람
  - 은총을 가진 사람
  lexicon: χάρις
  rationale: 여기서는 ‘은혜’가 단순한 호의가 아니라 어떤 사람 안에 있는 긍정적 자질로 묘사되므로, ‘가진 사람’으로 직역에 가깝게 살렸습니다.
- source_word: ἀγαθοῦ πνεύματος
  english_pob_choice: a good spirit
  chosen_korean: 선한 영
  alternatives_korean:
  - 좋은 영
  - 선한 마음
  lexicon: πνεῦμα
  rationale: 원문은 ‘영(πνεῦμα)’을 사용하므로 심리적 의미로 완화하지 않고 ‘영’으로 두었으며, ἀγαθοῦ는 도덕적 선함을 반영해 ‘선한’으로 옮겼습니다.
- source_word: ἀγαπᾷ κατὰ τὴν ψυχὴν αὐτοῦ
  english_pob_choice: he loves ... as his own soul
  chosen_korean: 자기 영혼처럼 사랑합니다
  alternatives_korean:
  - 자기 혼처럼 사랑합니다
  - 자기 생명처럼 사랑합니다
  lexicon: ψυχή
  rationale: κατὰ τὴν ψυχὴν αὐτοῦ는 비교의 기준을 나타내므로 ‘처럼’으로 자연스럽게 옮겼고, ψυχή는 문맥상 ‘영혼’이 가장 직접적입니다.
theological_decisions:
- issue: ‘good spirit’의 의미를 심리적 성향으로 축소할지 여부
  chosen_reading: ‘선한 영’으로 유지하여 영적/인격적 차원을 남겼습니다.
  alternative_readings:
  - 선한 마음
  - 좋은 성품
  rationale: 본문은 ‘영(πνεῦμα)’을 말하므로, 이를 마음이나 성품으로 바꾸면 원문의 영적 표현이 약화됩니다.
  doctrine_reference: 본문의 어휘 수준 보존
