revisions:
- from: '1. 또 저는 의로운 에녹의 말씀으로 여러분에게 말합니다. 여러분은 소돔의 음행을 행할 것이며, 잠시 동안 멸망할 것입니다. 그러고 나서 다시 새로워질 것이며, 주님의 나라는 여러분 가운데 있지 않을 것입니다. 2. 그러나 여러분의 몫이 된 땅에는 하나님의 성전이 있을 것이며, 마지막 것이 처음 것보다 더 영광스러울 것입니다. 그곳에 열두 지파가 모일 것이며, 모든 민족도 지극히 높으신 분이 자기의 구원을 한 분뿐인 예언자의 살핌 가운데 보내실 때까지 모일 것입니다.


    3. 그는 첫 번째 성전에 들어갈 것이며, 그곳에서 주님은 모욕을 당하실 것이고, 나무 위로 들려질 것입니다. 4. 그리고 성전의 휘장 같은 덮개가 찢어질 것이며, 하나님의 영이 마치 쏟아지는 불처럼 민족들 위로 옮겨 갈 것입니다. 5. 그리고 그가 하데스에서 올라온 뒤에는 땅에서 하늘로 지나가실 것입니다. 저는 그가 땅에서는 얼마나 비천하실지, 그리고 하늘에서는 얼마나 영광스러우실지를 압니다.[a][b][c][d][e]'
  to: '1. 또 저는 의로운 에녹의 말씀을 따라 여러분에게 말합니다. 여러분은 소돔의 음행을 저지를 것이며, 잠시 동안 멸망할 것입니다. 그리고 다시 새로워질 것이며, 주님의 나라는 여러분 가운데 있지 않을 것입니다. 2. 그러나 여러분에게 할당된 땅에는 하나님의 성전이 있을 것이며, 나중 성전은 처음 성전보다 더 영광스러울 것입니다. 그곳에 열두 지파와 모든 민족이 모일 것이며, 지극히 높으신 분께서 유일한 예언자의 방문 때에 자기의 구원을 보내실 때까지 그러할 것입니다.[b]


    3. 그는 첫 성전에 들어갈 것이며, 그곳에서 주님은 모욕을 당하실 것이고 나무에 들려질 것입니다.[a][c] 4. 성전에 드리운 휘장이 찢어질 것이며,[d] 하나님의 영은 쏟아지는 불처럼 민족들에게로 옮겨 갈 것입니다. 5. 그는 하데스에서 올라온 뒤 땅에서 하늘로 옮겨 갈 것입니다.[e] 저는 그가 땅에서는 얼마나 비천할지, 하늘에서는 얼마나 영광스러울지를 압니다.'
  rationale: 원문의 문법과 어휘를 우선하여 ἐπισκοπή의 사건적 의미, ἐπί ξύλου의 위치 표현, ἅπλωμα의 드리운 직물 이미지를 바로잡았습니다. ‘주님’과 대명사의 관계는 해석으로 동일시하지 않고 원문의 긴장을 유지했습니다. 또한 모든 각주 표지를 해당 본문 어구에 재배치하여 본문 비평·어휘 주석의 대상을 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
