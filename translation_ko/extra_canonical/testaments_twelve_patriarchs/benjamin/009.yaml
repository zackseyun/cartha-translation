base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009.yaml
  text: '1. And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again[b], and the kingdom of the Lord will not be among you. 2. Nevertheless, in your allotted portion there will be the temple of God, and the last will be more glorious than the first; and there the twelve tribes will be gathered, and all the nations, until the Most High sends his salvation in the visitation of an only-begotten prophet.


    3. And he will enter into the first temple, and there the Lord will be treated with outrage, and he will be lifted up on wood. 4. And the curtain-spread of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out. 5. And when he has gone up from Hades, he will pass from earth to heaven. And I know how lowly he will be on earth[e][d][c], and how glorious in heaven.'
  footnotes:
  - marker: a
    text: Verses 3–5 are textually uncertain in the witness tradition and are often regarded as a later expansion; they are translated here because they stand in the supplied Greek text.
    reason: textual_variant
  - marker: b
    text: Or 'of a unique prophet' for 'of an only-begotten prophet.'
    reason: lexical_alternative
  - marker: c
    text: '''Lifted up on wood'' is a literal rendering of the Greek phrase; compare the idiom of being raised on a tree/wooden stake.'
    reason: lexical_alternative
  - marker: d
    text: '''Curtain-spread'' renders an unusual Greek term for a temple hanging; many readers may understand it as the temple veil.'
    reason: lexical_alternative
  - marker: e
    text: Hades is the realm of the dead, not necessarily the final place of punishment.
    reason: cultural_note
translation:
  language: ko
  text: '1. 또 저는 의로운 에녹의 말씀으로 여러분에게 말합니다. 여러분은 소돔의 음행을 행할 것이며, 잠시 동안 멸망할 것입니다. 그러고 나서 다시 새로워질 것이며, 주님의 나라는 여러분 가운데 있지 않을 것입니다. 2. 그러나 여러분의 몫이 된 땅에는 하나님의 성전이 있을 것이며, 마지막 것이 처음 것보다 더 영광스러울 것입니다. 그곳에 열두 지파가 모일 것이며, 모든 민족도 지극히 높으신 분이 자기의 구원을 한 분뿐인 예언자의 살핌 가운데 보내실 때까지 모일 것입니다.


    3. 그는 첫 번째 성전에 들어갈 것이며, 그곳에서 주님은 모욕을 당하실 것이고, 나무 위로 들려질 것입니다. 4. 그리고 성전의 휘장 같은 덮개가 찢어질 것이며, 하나님의 영이 마치 쏟아지는 불처럼 민족들 위로 옮겨 갈 것입니다. 5. 그리고 그가 하데스에서 올라온 뒤에는 땅에서 하늘로 지나가실 것입니다. 저는 그가 땅에서는 얼마나 비천하실지, 그리고 하늘에서는 얼마나 영광스러우실지를 압니다.[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύσετε / πορνείαν
  english_pob_choice: you will commit the fornication
  chosen_korean: 소돔의 음행을 행할 것이며
  alternatives_korean:
  - 성적 부도덕을 저지를 것이며
  - 음행을 저지를 것이며
  lexicon: BDAG
  rationale: 반복 구조의 강한 비난을 살리되, 한국어에서는 '음행'이 종교·예언 문맥에서 더 직접적이고 문체상도 어울립니다.
- source_word: ἡ βασιλεία Κυρίου
  english_pob_choice: the kingdom of the Lord
  chosen_korean: 주님의 나라
  alternatives_korean:
  - 주님의 통치
  - 주님의 왕국
  lexicon: BDAG
  rationale: 보편적으로 알아보기 쉬운 표현을 쓰되, 왕권/통치의 의미를 함께 지닌 '나라'로 유지했습니다.
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  english_pob_choice: in the visitation of an only-begotten prophet
  chosen_korean: 한 분뿐인 예언자의 살핌 가운데
  alternatives_korean:
  - 외아들 예언자의 방문 가운데
  - 유일한 예언자의 방문 가운데
  lexicon: BDAG
  rationale: ἐπισκοπή를 단순한 '방문'보다 파수·돌봄의 뉘앙스를 지닌 '살핌'으로 옮겨, 예언적 개입의 뜻을 살렸습니다. μονογενής는 여기서 '한 분뿐인'으로 옮겨, 기독교 용어에 고정되지 않은 상태에서 단어의 배타성을 드러냈습니다.
- source_word: τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον
  english_pob_choice: the curtain-spread of the temple will be torn
  chosen_korean: 성전의 휘장 같은 덮개가 찢어질 것이며
  alternatives_korean:
  - 성전 휘장이 찢어질 것이며
  - 성전의 덮개가 찢어질 것이며
  lexicon: LSJ
  rationale: ἅπλωμα의 비정상적·드문 표현을 살리기 위해 표준적인 '휘장'으로 완전히 평준화하지 않고, '휘장 같은 덮개'로 우회해 원문의 낯선 이미지를 보존했습니다.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  english_pob_choice: will be lifted up on wood
  chosen_korean: 나무 위로 들려질 것입니다
  alternatives_korean:
  - 나무에 들려질 것입니다
  - 나무에 달릴 것입니다
  lexicon: BDAG
  rationale: ξύλον의 직설성을 유지하되, 한국어에서 가장 자연스러운 수동 표현으로 옮겼습니다. '달리다'는 해석을 과도하게 좁힐 수 있어 피했습니다.
- source_word: ᾅδου
  english_pob_choice: Hades
  chosen_korean: 하데스
  alternatives_korean:
  - 음부
  - 죽은 자들의 세계
  lexicon: BDAG
  rationale: 전통적 교회어인 '음부'보다 고유명사 '하데스'를 유지하여, 사후 세계를 특정 종말론적 지옥으로 단정하지 않도록 했습니다.
theological_decisions:
- issue: τὸ ἅπλωμα τοῦ ναοῦ의 이미지
  chosen_reading: 성전의 휘장 같은 덮개
  alternative_readings:
  - 성전 휘장
  - 성전의 장막
  rationale: 원문은 NT의 통상어 καταπέτασμα가 아니라 ἅπλωμα를 쓰므로, 표준 교회 용어로 평탄화하지 않고 낯선 직물 이미지를 일부 남겨 두었습니다.
  doctrine_reference: '원문 우선 원칙: 어휘가 드문 경우 의미를 좁히기보다 긴장을 보존한다.'
- issue: μονογενοῦς προφήτου의 해석
  chosen_reading: 한 분뿐인 예언자
  alternative_readings:
  - 독생한 예언자
  - 유일한 예언자
  rationale: μονογενής의 신학적 함의를 완전히 풀어버리지 않되, 한국어에서 과도하게 교리화된 '독생'을 바로 쓰지 않고, 원문이 가진 유일성의 강조를 우선 드러냈습니다.
  doctrine_reference: '의미의 긴장 보존: 후대 교리어를 자동 대입하지 않는다.'
