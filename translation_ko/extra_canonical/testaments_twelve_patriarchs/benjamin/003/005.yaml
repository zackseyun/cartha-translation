id: T12P.BEN.3.5
reference: Testament of Benjamin 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀπὸ²⁴ ἐπιβουλῆς ἀνθρώπων ἢ θηρίων οὐ δύναται κυριευθῆναι²⁸, βοηθούμενος *†ζῆν ἀπ᾽ αὐτῆς† ὑπὸ τῆς ἀγάπης²⁹ ἧς³⁰ ἔχει πρὸς τὸν πλησίον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/005.yaml
  text: And he cannot be mastered by the plots of men or of beasts, being helped †to live from it† by the love which he has toward his neighbor.
translation:
  language: ko
  text: 그리고 사람이나 짐승의 음모로는 지배될 수 없습니다. 그는 이웃을 향한 사랑으로 말미암아 그 사랑에 힘입어 살아갑니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιβουλῆς ἀνθρώπων ἢ θηρίων
  english_pob_choice: the plots of men or of beasts
  chosen_korean: 사람이나 짐승의 음모
  alternatives_korean:
  - 사람들의 책략이나 짐승들의 책략
  - 사람이나 짐승의 계략
  lexicon: ἐπιβουλή
  rationale: ἐπιβουλή는 단순한 ‘공격’보다 악의적인 모의·음모를 뜻하므로, 문맥에 맞게 ‘음모’로 옮겼습니다.
- source_word: οὐ δύναται κυριευθῆναι
  english_pob_choice: he cannot be mastered
  chosen_korean: 지배될 수 없습니다
  alternatives_korean:
  - 다스림을 당할 수 없습니다
  - 정복될 수 없습니다
  lexicon: κυριεύω
  rationale: κυριεύω의 피동형은 ‘지배하다/주관하다’의 수동 의미이므로, 강한 종속 상태를 드러내는 ‘지배될 수 없다’로 옮겼습니다.
- source_word: βοηθούμενος
  english_pob_choice: being helped
  chosen_korean: …힘입어 살아갑니다
  alternatives_korean:
  - 도움을 받으며 살아갑니다
  - 도움받아 살아갑니다
  lexicon: βοηθέω
  rationale: 분사 구조를 한국어에서 자연스럽게 풀어, 이어지는 ζῆν과 결합된 상태를 ‘살아갑니다’로 드러냈습니다.
- source_word: ὑπὸ τῆς ἀγάπης ἧς ἔχει πρὸς τὸν πλησίον
  english_pob_choice: by the love which he has toward his neighbor
  chosen_korean: 이웃을 향한 사랑으로 말미암아 그 사랑에
  alternatives_korean:
  - 이웃에 대한 사랑으로 말미암아
  - 이웃에게 가진 사랑으로
  lexicon: ἀγάπη / πλησίον
  rationale: πρὸς τὸν πλησίον의 방향성을 ‘이웃을 향한’으로 살리고, ἀγάπη는 본문상 추상명사로서 ‘사랑’이 가장 직접적입니다.
theological_decisions:
- issue: 보조 수단의 주체가 본문상 하나님/주가 아니라 ‘사랑’인지 여부
  chosen_reading: 본문을 따라 ‘사랑’ 자체가 그를 살아가게 하는 매개로 작동한다고 옮겼습니다.
  alternative_readings:
  - 주님이 사랑을 통해 그를 돕습니다
  - 그는 주님의 도움을 받습니다
  rationale: 그리스어 본문에는 ὑπὸ τῆς ἀγάπης가 직접 제시되므로, 영어 초안의 ‘Lord’는 보조적 해석으로 보아 한국어 본문에서는 원문 명시를 우선했습니다.
  doctrine_reference: source-priority / audit-trail alignment
