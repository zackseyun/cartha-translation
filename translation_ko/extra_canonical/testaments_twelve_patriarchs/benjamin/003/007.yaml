    issue: λέγων이 번역에서 탈락하고 문장 종결이 바뀜
    rationale: 원문은 야곱이 끌어안고 두 시간 동안 계속 입맞춘 뒤 ‘말하기를’로 다음 발화를 도입합니다. 이를 보존해야 다음 절과의 문법적 연결이 유지됩니다.
  - severity: medium
    issue: ‘내장 깊은 정을 이겼구나’가 부자연스럽고 의미 관계가 불분명함
    rationale: σπλάγχνα의 강한 내적 애정과 ἐνίκησας의 압도·정복 비유는 ‘속마음을 사로잡았구나’로 자연스럽게 전달할 수 있습니다.
  - severity: low
    issue: ‘좋은 자녀야’가 현대 한국어 호칭으로 어색함
    rationale: 직접 부르는 τέκνον χρηστόν에는 ‘착한 아이야’가 자연스럽습니다.
  revised_text: '그리하여 야곱이 이렇게 외쳤습니다. “오, 착한 아이야, 네가 네 아버지 야곱의 속마음을 사로잡았구나.” 그리고 그는 그를 끌어안고 두 시간 동안 계속 입을 맞추며 말하기를:'
