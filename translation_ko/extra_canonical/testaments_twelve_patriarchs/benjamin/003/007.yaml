id: T12P.BEN.3.7
reference: Testament of Benjamin 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ *οὕτως ἐβόα Ἰακώβ³⁷· *ὦ τέκνον χρηστόν³⁸, ἐνίκησας³⁹ τὰ σπλάγχνα⁴⁰ Ἰακὼβ τοῦ πατρός σου· καὶ περιλαβὼν⁴¹ αὐτὸν⁴² ἐπὶ⁴³ δύο⁴⁴ ὥρας κατεφίλει, λέγων·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/007.yaml
  text: And thus Jacob cried out, “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, he kept kissing him for two hours, saying,
translation:
  language: ko
  text: '그리하여 야곱이 이렇게 외쳤습니다. “오, 착한 아이야, 네가 네 아버지 야곱의 속마음을 사로잡았구나.” 그리고 그는 그를 끌어안고 두 시간 동안 계속 입을 맞추며 말하기를:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ τέκνον χρηστόν
  english_pob_choice: O good child
  chosen_korean: 오, 좋은 자녀야
  alternatives_korean:
  - 오, 착한 아이야
  - 오, 선한 자녀야
  - 오, 좋은 아이야
  lexicon: τέκνον / χρηστόν
  rationale: τέκνον은 단순히 어린이를 뜻하기보다 관계적 호칭이므로 ‘자녀’로 살렸고, χρηστόν은 도덕적 ‘착함’보다 ‘좋은/호감 가는’ 뉘앙스가 있어 ‘좋은’으로 옮겼습니다.
- source_word: ἐνίκησας τὰ σπλάγχνα
  english_pob_choice: you have stirred the inward affection
  chosen_korean: 네가 … 내장 깊은 정을 이겼구나
  alternatives_korean:
  - 네가 … 내장 깊은 애정을 움직였구나
  - 네가 … 속 깊은 애정을 이겼구나
  - 네가 … 간절한 심정을 사로잡았구나
  lexicon: σπλάγχνα
  rationale: σπλάγχνα는 단순한 감정이 아니라 ‘내장/가슴속 정’의 강한 신체적 이미지를 지니므로, 기존 관용적 순화보다 원문의 거친 정서성을 살려 ‘내장 깊은 정’으로 표현했습니다.
- source_word: περιλαβών … κατεφίλει
  english_pob_choice: embracing him, he kept kissing him
  chosen_korean: 그를 끌어안고 … 계속 입을 맞추었습니다
  alternatives_korean:
  - 그를 껴안고 … 계속 키스했습니다
  - 그를 포옹하고 … 줄곧 입맞춤했습니다
  - 그를 안고 … 계속 입을 맞추었습니다
  lexicon: περιλαμβάνω / καταφιλέω
  rationale: 두 동사의 결합은 단순한 포옹과 한 번의 입맞춤이 아니라 지속적인 애정 행위를 나타내므로, 현대 한국어에서 자연스러우면서도 반복성을 드러내는 ‘끌어안고 … 계속 입을 맞추었습니다’로 옮겼습니다.
theological_decisions:
- issue: 가족적 애정의 과장된 신체 이미지
  chosen_reading: 본문의 정서는 단순한 감상보다 격렬한 부자 관계의 애정을 드러내는 것으로 보아, 이를 완화하지 않고 직설적으로 번역했습니다.
  alternative_readings:
  - 더 완곡하게 ‘깊이 사랑하는 마음’으로 순화하기
  - ‘마음을 움직였다’처럼 비신체적으로 바꾸기
  rationale: σπλάγχνα와 연속된 입맞춤은 문학적으로 강한 애정 표현이므로, 독자가 원문의 과장된 정서를 그대로 느끼도록 하는 것이 source-direct합니다.
  doctrine_reference: 문학적-서사적 정서 표현의 보존
- issue: 인용부호 안의 호칭과 직접 화법
  chosen_reading: 야곱의 외침은 직접 화법으로 보존하되, 현대 한국어 합쇼체 서술 안에서 호칭은 감탄형으로 처리했습니다.
  alternative_readings:
  - 서술체로 풀어 ‘좋은 자녀라고 불렀습니다’로 바꾸기
  - 기도문식 높임으로 바꾸기
  rationale: 원문은 감탄과 직접 대화를 통해 감정을 전달하므로, 화자 감정을 약화시키지 않는 범위에서 자연스러운 현대 문체를 택했습니다.
  doctrine_reference: 서사체 직접화법 보존
