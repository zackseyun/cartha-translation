base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/006.yaml
  text: For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him.
translation:
  language: ko
  text: 요셉도 우리 아버지께 자기 형제들을 위해 기도해 주시기를 간청했습니다. 이는 주께서 그들이 요셉에게 악을 행한 죄를 그들에게 돌리지 않으시도록 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  english_pob_choice: begged
  chosen_korean: 간청했습니다
  alternatives_korean:
  - 부탁했습니다
  - 애원했습니다
  lexicon: δέομαι
  rationale: 단순한 요청보다 더 강한 청원을 나타내므로, 정중하되 절실한 뉘앙스를 살려 ‘간청했습니다’로 옮겼습니다.
- source_word: προσεύξηται ὑπὲρ τῶν ἀδελφῶν αὐτοῦ
  english_pob_choice: pray for his brothers
  chosen_korean: 자기 형제들을 위해 기도해 달라고
  alternatives_korean:
  - 형제들을 위하여 기도해 달라고
  - 형제들을 위해 빌어 달라고
  lexicon: προσεύχομαι + ὑπέρ
  rationale: ‘ὑπὲρ’를 위해/위하여의 의미로 풀어, 중보 기도의 목적을 자연스럽게 드러냈습니다.
- source_word: λογίσηται ... ἁμαρτίαν
  english_pob_choice: would not reckon sin to them
  chosen_korean: 그들에게 죄를 돌리지 않으시게 하려는 것이었습니다
  alternatives_korean:
  - 그들에게 죄를 계산하지 않으시게 하려는 것이었습니다
  - 그들에게 죄를 헤아려 주지 않으시게 하려는 것이었습니다
  lexicon: λογίζομαι + ἁμαρτία
  rationale: 회계적/법정적 ‘reckon’의 뉘앙스를 살리되 한국어에서 자연스러운 성경어인 ‘죄를 돌리다’로 옮겼습니다.
- source_word: ἐποίησαν πονηρὸν εἰς αὐτόν
  english_pob_choice: they had done evil against him
  chosen_korean: 그들이 요셉에게 악을 행했기 때문입니다
  alternatives_korean:
  - 그들이 그에게 악한 일을 했기 때문입니다
  - 그들이 그를 향해 악을 저질렀기 때문입니다
  lexicon: ποιέω πονηρόν
  rationale: 직역을 유지하되 한국어에서 자연스러운 인과 구문으로 정리해 원인의 강조를 살렸습니다.
theological_decisions:
- issue: 주어가 되는 'Κύριος'의 번역
  chosen_reading: 주께서
  alternative_readings:
  - 하나님께서
  - 야훼께서
  rationale: 문맥상 인물들의 죄를 계산하지 않으시는 주체를 가리키는 일반적 신칭으로 처리했습니다. 본 구절은 명시적 여호와 인용문이 아니므로 야훼로 확대하지 않았습니다.
  doctrine_reference: Divine naming and LXX-style quotation handling
