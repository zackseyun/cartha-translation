  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/004.yaml
  text: How many men wanted to kill him, and God sheltered him; for the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God.
translation:
  language: ko
  text: 얼마나 많은 사람이 그를 죽이려고 했는지 모릅니다. 그러나 하나님께서 그를 보호하셨습니다. 하나님을 두려워하고 자기 이웃을 사랑하는 사람은 베리알의 영에게 맞을 수 없으니, 이는 하나님의 두려움 아래 보호받기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πόσοι τῶν ἀνθρώπων ἤθελον αὐτὸν ἀνελεῖν
  english_pob_choice: How many men wanted to kill him
  chosen_korean: 얼마나 많은 사람이 그를 죽이려고 했는지 모릅니다
  alternatives_korean:
  - 얼마나 많은 사람들이 그를 죽이려 했는지 모릅니다
  - 얼마나 많은 사람들이 그를 죽이고자 했는지 모릅니다
  lexicon: ἀνελεῖν
  rationale: 살해 의도를 분명히 드러내기 위해 ‘죽이려고 했습니다’를 택했고, 수사적 감탄의 흐름을 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ὁ Θεὸς ἐσκέπασεν αὐτόν
  english_pob_choice: God sheltered him
  chosen_korean: 하나님께서 그를 보호하셨습니다
  alternatives_korean:
  - 하나님께서 그를 덮어 주셨습니다
  - 하나님께서 그를 감싸셨습니다
  lexicon: σκέπω
  rationale: ἑσκέπασεν의 ‘덮다/보호하다’ 의미를 살리되, 문맥상 구출·보호의 의미가 분명하므로 ‘보호하셨습니다’로 자연스럽게 옮겼습니다.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ Βελίαρ
  english_pob_choice: by the spirit of Beliar
  chosen_korean: 베리알의 영에게
  alternatives_korean:
  - 베리알의 영으로부터
  - 베리알의 영에 의해
  lexicon: πνεῦμα
  rationale: 이 구절의 πνεῦμα는 악한 영적 존재를 가리키므로 ‘영’으로 유지했고, 피동 표현에서 한국어 자연성을 위해 ‘에게’ 구문을 사용했습니다.
- source_word: σκεπαζόμενος ὑπὸ τοῦ φόβου τοῦ Θεοῦ
  english_pob_choice: being sheltered by the fear of God
  chosen_korean: 하나님의 두려움 아래 보호받기 때문입니다
  alternatives_korean:
  - 하나님을 두려워함으로 보호받기 때문입니다
  - 하나님을 경외함 아래 보호받기 때문입니다
  lexicon: φόβος
  rationale: φόβος τοῦ Θεοῦ는 단순 공포보다 경외와 두려움을 함께 품는 표현이므로, 본문 의미를 보존하면서도 현대 독자가 이해하기 쉬운 ‘하나님의 두려움’으로 처리했습니다.
theological_decisions:
- issue: 베리알의 영과 하나님의 두려움의 대비
  chosen_reading: 사람을 해치려는 의도와 악한 영의 공격은 하나님을 두려워하고 이웃을 사랑하는 사람에게 미치지 못하며, 그 사람은 하나님의 보호 아래 있습니다.
  alternative_readings:
  - 도덕적 덕목에 대한 일반적 교훈으로 완화하는 읽기
  - 악령에 대한 직접적 영적 보호 약속으로만 읽는 방식
  rationale: 원문은 윤리적 표지(하나님을 두려워함, 이웃 사랑)와 영적 보호(베리알의 영) 사이의 직접 연결을 분명히 하므로, 둘을 함께 살리는 번역이 필요합니다.
  doctrine_reference: 영적 전쟁과 경건의 보호에 대한 본문 자체의 진술
