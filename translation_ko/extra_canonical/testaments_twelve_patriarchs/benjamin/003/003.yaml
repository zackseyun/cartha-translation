id: T12P.BEN.3.3
reference: Testament of Benjamin 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/003.yaml
  text: Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every evil affliction, they will certainly not rule over you, just as they did not over Joseph my brother.
translation:
  language: ko
  text: 주님을 두려워하고 이웃을 사랑하십시오. 벨리알의 영들이 여러분을 온갖 악한 고난으로 몰아넣을지라도, 그들은 결코 여러분을 지배하지 못할 것입니다. 그들이 내 형 요셉을 지배하지 못했던 것과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβεῖσθε Κύριον
  english_pob_choice: Fear the Lord
  chosen_korean: 주님을 두려워하고
  alternatives_korean:
  - 주를 두려워하고
  - 야훼를 두려워하고
  lexicon: Κύριος
  rationale: 공동체 독자에게 바로 이해되는 경건한 명령형을 살리되, 이 문맥의 '주'는 일반 호칭보다 신적 권위를 가리키므로 '주님'으로 옮겼습니다.
- source_word: ἀγαπᾶτε τὸν πλησίον
  english_pob_choice: love your neighbor
  chosen_korean: 이웃을 사랑하십시오
  alternatives_korean:
  - 네 이웃을 사랑하십시오
  - 가까운 사람을 사랑하십시오
  lexicon: ἀγαπάω / πλησίον
  rationale: πλησίον은 율법적·윤리적 문맥에서 '이웃'이 가장 자연스럽고, 명령의 보편성을 유지할 수 있어 '이웃'으로 번역했습니다.
- source_word: τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως
  english_pob_choice: the spirits of Beliar ... into every evil affliction
  chosen_korean: 벨리알의 영들이 여러분을 온갖 악한 고통으로 몰아넣을지라도
  alternatives_korean:
  - 벨리알의 영들이 여러분을 모든 악한 환난으로 몰아넣을지라도
  - 벨리알의 영들이 여러분을 온갖 악한 괴로움으로 몰아넣을지라도
  lexicon: πνεύματα / θλῖψις / πονηρία
  rationale: πνεύματα는 복수의 영적 세력을 그대로 살렸고, θλίψεως는 단순한 감정이 아니라 압박·고난의 성격이 있어 '고통'으로, πονηρία는 도덕적 악을 지시하므로 '악한'으로 처리했습니다.
- source_word: οὐ μὴ κατακυριεύσωσιν ὑμῶν
  english_pob_choice: they will certainly not rule over you
  chosen_korean: 그들은 결코 여러분을 지배하지 못할 것입니다
  alternatives_korean:
  - 그들은 결코 여러분을 다스리지 못할 것입니다
  - 그들은 반드시 여러분을 지배하지 못할 것입니다
  lexicon: κατακυριεύω
  rationale: 강한 부정 구조 οὐ μὴ와 지배/압제의 동사를 함께 살려, 단순 통치보다 억압적 장악의 뉘앙스를 드러내는 '지배하다'를 택했습니다.
- source_word: Ἰωσὴφ τὸν ἀδελφόν μου
  english_pob_choice: Joseph my brother
  chosen_korean: 요셉 곧 내 형에게 그랬던 것처럼 말입니다
  alternatives_korean:
  - 요셉 내 형에게 그랬던 것처럼 말입니다
  - 내 형 요셉에게 그랬던 것처럼 말입니다
  lexicon: ἀδελφός
  rationale: '''형''은 혈연 관계를 분명히 하면서도 한국어에서 더 자연스럽고, 비교 구문의 의미를 위해 ''곧''을 보충해 요셉이 바로 ''내 형''임을 명시했습니다.'
theological_decisions:
- issue: 벨리알의 영들 표현과 악의 근원성
  chosen_reading: 벨리알을 인격적 악의 세력으로 유지하고, '영들'을 복수로 살려 영적 공격의 실제성을 드러냈습니다.
  alternative_readings:
  - 벨리알의 악한 영향력
  - 사탄의 영들
  rationale: 본문은 단순한 심리 상태보다 외적 영적 세력을 말하므로, 문맥을 약화시키는 의역보다 원문의 인격적·다중적 악 세력을 보존하는 편이 타당합니다.
  doctrine_reference: 제2성전기 유대교의 악령/영적 대적 전승
