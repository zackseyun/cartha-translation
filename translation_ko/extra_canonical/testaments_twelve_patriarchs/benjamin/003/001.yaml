  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: III. *Νῦν οὖν, τέκνα μου, καὶ ὑμεῖς ⸀ἀγαπήσατε¹ Κύριον τὸν Θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς², καὶ³ φυλάξατε⁴ ἐντολὰς αὐτοῦ, *μιμούμενοι τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα ⸀Ἰωσήφ⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/001.yaml
  text: Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph.
translation:
  language: ko
  text: 그러므로 이제 내 자녀들아, 너희도 하늘과 땅의 하나님이신 주님을 사랑하고, 그의 계명들을 지키며, 선하고 거룩한 사람 요셉을 본받으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  english_pob_choice: must love
  chosen_korean: 사랑하고
  alternatives_korean:
  - 사랑하십시오
  - 사랑해야 합니다
  lexicon: ἀγαπάω
  rationale: 명령형의 요청을 살리되, 한국어에서는 자연스러운 병렬 명령 구조로 옮겨 본문 흐름을 유지했습니다.
- source_word: Κύριον τὸν Θεὸν τοῦ οὐρανοῦ καὶ τῆς γῆς
  english_pob_choice: the Lord, the God of heaven and earth
  chosen_korean: 하늘과 땅의 하나님이신 주
  alternatives_korean:
  - 하늘과 땅의 주 하나님
  - 하늘과 땅의 하나님 되시는 주
  lexicon: κύριος / Θεός
  rationale: 하나님과 주의 관계를 중복 없이 살리기 위해 관형절로 압축하여, 원문의 호칭 구조를 자연스럽게 표현했습니다.
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  english_pob_choice: keep his commandments
  chosen_korean: 그의 계명들을 지키며
  alternatives_korean:
  - 그분의 계명들을 지키고
  - 그의 계명들을 지키십시오
  lexicon: φυλάσσω / ἐντολή
  rationale: 연결형 '-며'로 앞뒤 권면을 이어 주어, 문장의 계속되는 권고 성격을 드러냈습니다.
- source_word: μιμούμενοι τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα Ἰωσήφ
  english_pob_choice: imitating the good and holy man Joseph
  chosen_korean: 선하고 거룩한 사람 요셉을 본받으십시오
  alternatives_korean:
  - 선하고 거룩한 사람 요셉을 모방하십시오
  - 선하고 경건한 사람 요셉을 본받으십시오
  lexicon: μιμέομαι / ἀγαθός / ὅσιος
  rationale: μιμούμενοι를 한국어의 자연스러운 권면 표현인 '본받다'로 옮겼고, ὅσιος는 '거룩한'으로 살려 도덕적·종교적 품위를 함께 반영했습니다.
theological_decisions:
- issue: 권면의 어조와 대화체 대상
  chosen_reading: 직접 호소를 유지하기 위해 '내 자녀들아'와 '너희도'를 살리고, 마지막 동사는 공손한 명령형으로 번역했습니다.
  alternative_readings:
  - 더 중립적인 '자녀들'
  - 모두 평서형으로 완화
  rationale: 원문이 공동체를 향한 직접 권고이므로, 대상 호칭과 명령성을 약화하지 않는 것이 적절합니다.
  doctrine_reference: paraenesis / exhortation register
