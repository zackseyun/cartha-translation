id: T12P.BEN.3.8
reference: Testament of Benjamin 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/008.yaml
  text: “The heavenly prophecy concerning you will be fulfilled, [concerning the lamb of God and savior of the world,] for the blameless one will be handed over by lawless men, and the sinless one will die for the ungodly [in the blood of the covenant, for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants].”
translation:
  language: ko
  text: 너에 관한 하늘의 예언이 이루어질 것입니다. [하나님의 어린양과 세상의 구원자에 관한 예언입니다.] 이는 흠 없는 이가 율법 없는 자들에게 넘겨지고, 죄 없는 이가 경건하지 않은 자들을 위하여 죽을 것이기 때문입니다. [그는 언약의 피로 민족들과 이스라엘을 구원하고, 벨리알과 그의 종들을 멸할 것입니다.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πληρωθήσεται ... προφητεία οὐράνιος
  english_pob_choice: The heavenly prophecy ... will be fulfilled
  chosen_korean: 하늘의 예언이 이루어질 것입니다
  alternatives_korean:
  - 하늘의 예언이 성취될 것입니다
  - 천상적 예언이 이루어질 것입니다
  lexicon: προφητεία / οὐράνιος
  rationale: οὐράνιος를 단순히 ‘천상적’으로 옮기기보다, POB의 ‘heavenly’ 감각을 살리면서 자연스러운 한국어로 ‘하늘의’라고 했습니다. πληρωθήσεται는 수동 미래로 ‘이루어질 것입니다’가 가장 직접적입니다.
- source_word: περὶ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου
  english_pob_choice: concerning the lamb of God and savior of the world
  chosen_korean: 「하나님의 어린양이자 세상의 구원자」에 관한 예언입니다
  alternatives_korean:
  - 「하나님의 어린양과 세상의 구원자」에 관한 예언입니다
  - 「하나님의 어린양이시며 세상의 구원자이신 분」에 관한 예언입니다
  lexicon: ἀμνός / σωτήρ
  rationale: 이 괄호 안 구는 본문상 삽입적 설명이므로 예언의 주제를 풀어주되, ‘어린양’과 ‘구원자’를 직접 살려 원문의 호칭을 유지했습니다.
- source_word: ἄμωμος ... ἀνόμων
  english_pob_choice: the blameless one will be handed over by lawless men
  chosen_korean: 이는 율법 없는 자들에게 넘겨질 흠 없는 이가 있고
  alternatives_korean:
  - 이는 불법한 자들에게 넘겨질 흠 없는 이가 있고
  - 이는 법 없는 자들에게 넘겨질 흠 없는 이가 있고
  lexicon: ἄμωμος / ἄνομος
  rationale: ἄμωμος는 도덕적·제의적 결함 없음의 뉘앙스를 살려 ‘흠 없는 이’로 옮겼고, ἄνομος는 POB의 ‘lawless’에 맞춰 ‘율법 없는 자들’로 직역해 성격을 드러냈습니다.
- source_word: ὁ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται
  english_pob_choice: the sinless one will die for the ungodly
  chosen_korean: 죄 없는 이가 경건하지 않은 자들을 위해 죽을 것이기 때문입니다
  alternatives_korean:
  - 죄 없는 이가 악인들을 위해 죽을 것이기 때문입니다
  - 죄 없는 이가 불경한 자들을 위해 죽을 것이기 때문입니다
  lexicon: ἀναμάρτητος / ἀσεβής
  rationale: ἀναμάρτητος는 단순히 ‘죄 없는’으로, ἀσεβής는 POB의 ‘ungodly’에 맞춰 ‘경건하지 않은 자들’로 옮겨 신앙적 결핍을 드러냈습니다.
theological_decisions:
- issue: 삽입구절의 출처성 및 본문 내 처리
  chosen_reading: 대괄호 안 문구는 본문 속 보충적 설명으로 유지하되, 한국어에서도 괄호를 보존해 전승상의 삽입성을 드러냈습니다.
  alternative_readings:
  - 괄호를 풀어 본문 문장에 통합
  - 각주로만 처리
  rationale: 원문과 POB 모두 대괄호로 삽입 가능성을 표지하므로, 한국어도 동일한 표시를 유지하는 편이 독자가 본문층위를 구분하는 데 유리합니다.
  doctrine_reference: Textual criticism / source transparency
- issue: ‘벨리알과 그의 종들’의 종말 진술
  chosen_reading: καταλύσει를 ‘멸망’으로 옮겨 종말적 파괴를 직접 드러냈습니다.
  alternative_readings:
  - 무너뜨릴 것입니다
  - 폐하게 할 것입니다
  rationale: 본문은 단순한 약화가 아니라 벨리알의 패배와 붕괴를 말하므로, 한국어에서도 강한 종말론적 의미를 보존했습니다.
  doctrine_reference: Eschatology / conflict with evil
