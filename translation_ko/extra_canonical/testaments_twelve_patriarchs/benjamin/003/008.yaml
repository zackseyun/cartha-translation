revisions:
- from: 당신에 관한 하늘의 예언이 이루어질 것입니다. 「하나님의 어린양이자 세상의 구원자」에 관한 예언입니다. 이는 율법 없는 자들에게 넘겨질 흠 없는 이가 있고, 죄 없는 이가 경건하지 않은 자들을 위해 죽을 것이기 때문입니다. [언약의 피 안에서, 민족들과 이스라엘의 구원을 위해, 그리고 벨리알과 그의 종들의 멸망을 위해.][a]
  to: 너에 관한 하늘의 예언이 이루어질 것입니다. [하나님의 어린양과 세상의 구원자에 관한 예언입니다.] 이는 흠 없는 이가 율법 없는 자들에게 넘겨지고, 죄 없는 이가 경건하지 않은 자들을 위하여 죽을 것이기 때문입니다. [그는 언약의 피로 민족들과 이스라엘을 구원하고, 벨리알과 그의 종들을 멸할 것입니다.]
  rationale: The revision restores the two square-bracketed segments exactly as distinct textual layers, removes the unsupported footnote anchor, and corrects the main clause so that the two future predicates remain parallel. The final bracketed clause is rendered as an explicit continuation referring to the sinless one; this is required for natural Korean because the Greek’s compact prepositional phrase depends on the preceding subject and verb. No denominational interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the major lexical content, but it fails to preserve the source’s two distinct square-bracketed passages: the first disputed phrase is converted into quotation marks and an independent sentence. The final bracketed phrase is also rendered with an undefined [a] anchor. The revised text restores both source brackets and retains the single syntactic flow of the Greek.'
  naturalness: Several phrases are unnatural or syntactically misleading in Korean, especially “넘겨질 흠 없는 이가 있고,” which introduces an existential construction absent from the Greek, and “언약의 피 안에서,” which is overly literal and awkward. The revision uses a direct coordinated future construction and idiomatic formal Korean while preserving the source’s semantic relations.
  terminology: “하늘의 예언,” “하나님의 어린양,” “세상의 구원자,” “흠 없는 이,” “죄 없는 이,” and “벨리알” are suitable. “율법 없는 자들” appropriately reflects ἀνόμων. “경건하지 않은 자들” is an acceptable non-sectarian rendering of ἀσεβῶν. “멸하기” reflects καταλύσει without adding doctrinal interpretation.
  issues:
  - severity: high
    issue: The first square-bracketed source passage is not preserved as a square-bracketed passage.
    rationale: The Greek edition and English audit text mark [περὶ τοῦ ἀμνοῦ ...] as a disputed or secondary textual segment. Recasting it in Korean quotation marks as a separate declarative sentence changes both its textual status and its syntax.
  - severity: medium
    issue: The clause “넘겨질 흠 없는 이가 있고” introduces an existential construction.
    rationale: 'ἄμωμος ... παραδοθήσεται is directly predicative: “the blameless one will be handed over.” The added “이가 있고” weakens and alters the source’s parallelism with the following future verb.'
  - severity: medium
    issue: The [a] footnote anchor is undefined and does not correspond to a supplied footnote.
    rationale: The bracketed textual material itself is the source’s textual-critical signal; an unprovided anchor is structurally invalid and should be removed.
  - severity: low
    issue: “언약의 피 안에서” is excessively literal Korean.
    rationale: Although ἐν is formally “in,” “언약의 피로” is the natural Korean expression here and can convey the source phrase without introducing a different theological claim.
  revised_text: 너에 관한 하늘의 예언이 이루어질 것입니다. [하나님의 어린양과 세상의 구원자에 관한 예언입니다.] 이는 흠 없는 이가 율법 없는 자들에게 넘겨지고, 죄 없는 이가 경건하지 않은 자들을 위하여 죽을 것이기 때문입니다. [그는 언약의 피로 민족들과 이스라엘을 구원하고, 벨리알과 그의 종들을 멸할 것입니다.]
