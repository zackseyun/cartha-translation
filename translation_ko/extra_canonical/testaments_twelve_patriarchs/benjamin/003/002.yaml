  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/002.yaml
  text: And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly.
translation:
  language: ko
  text: 그리고 너희의 마음이 선한 것을 향하게 하십시오. 너희가 나의 마음도 그러하다는 것을 아는 것처럼 말입니다. 왜냐하면 바른 마음을 가진 사람은 모든 것을 바르게 보기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ διάνοια ὑμῶν
  english_pob_choice: your mind
  chosen_korean: 너희의 마음
  alternatives_korean:
  - 너희의 생각
  - 너희의 마음가짐
  - 너희의 의식
  lexicon: διάνοια
  rationale: διάνοια는 단순한 지적 기능보다 사고와 내적 지향을 함께 가리킬 수 있어, 문맥상 도덕적·내적 성향을 담는 ‘마음’으로 옮겼습니다.
- source_word: εἰς τὸ ἀγαθόν
  english_pob_choice: on what is good
  chosen_korean: 선한 것을 향하게
  alternatives_korean:
  - 좋은 것에
  - 선한 것에
  - 선한 일들을 향해
  lexicon: ἀγαθός
  rationale: 전치사 εἰς는 방향성을 나타내므로, 단순한 대상 제시보다 ‘향하게’로 옮겨 마음의 지향을 드러냈습니다.
- source_word: ὀρθὴν / ὀρθῶς
  english_pob_choice: right / rightly
  chosen_korean: 바른 / 바르게
  alternatives_korean:
  - 올바른 / 올바르게
  - 곧은 / 곧게
  lexicon: ὀρθός
  rationale: ὀρθός의 반복을 살려 동일한 어근의 대응을 유지했고, 도덕적·인식적 정확성을 자연스럽게 드러내는 ‘바른/바르게’를 택했습니다.
theological_decisions:
- issue: 권면문의 호소 방식
  chosen_reading: 명령형으로 현재적 실천을 요청하는 권면으로 옮겼습니다.
  alternative_readings:
  - 서술형 권고
  - 미래형 소망
  rationale: ἔστω는 단순 진술보다 청자에게 현재적으로 지향을 요구하는 권면의 힘이 있어, 한국어에서도 합쇼체 명령형으로 살렸습니다.
  doctrine_reference: 문맥상 윤리적 권면의 직접성 보존
- issue: κἀμὲ οἴδατε의 뉘앙스
  chosen_reading: ‘너희가 나의 마음도 그러하다는 것을 아는 것처럼’으로 관계적 공감의 비교를 살렸습니다.
  alternative_readings:
  - 너희가 나를 아는 것처럼
  - 너희가 내 뜻을 아는 것처럼
  rationale: 본문은 단순한 인지 사실보다 ‘나에 대해서도 이미 알고 있는 바와 같은 방식으로’라는 비교를 담고 있어, 개인적·관계적 연결을 유지했습니다.
  doctrine_reference: 본문의 비교 구조와 화자-청자 관계 보존
