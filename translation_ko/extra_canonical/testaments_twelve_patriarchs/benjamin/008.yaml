base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008.yaml
  text: '1[a]. Therefore, if you also walk in holiness according to the Lord’s commands, you will dwell with me in safety, and all Israel will be gathered to the Lord.


    2. And I will no longer be called a ravening wolf because of your ravaging, but a worker of the Lord, distributing food to those who do what is good.


    3. And there will arise in the latter times one beloved of the Lord, from the tribe of Judah and Levi, who will accomplish the good pleasure of God with a new understanding for all the nations.


    4. His presence is in the mouth of all, and he will be chosen forever by the Lord, and through him the knowledge of the Lord will be given on the earth in portions of joy; and through him Israel will be enlightened.


    5. Then he will enter into the first temple, and there the Lord will be abused, and he will be lifted up upon a tree.


    6[b]. And the veil of the temple will be torn, and the Spirit of God will pass on to the nations like fire poured out.


    7. And he will ascend from Hades and will pass from earth into heaven.


    8. And I know how lowly he will be on earth, and how glorious in heaven.


    9. Now when Joseph was in Egypt, I longed to see his figure and appearance; and through the prayers of Jacob my father I saw him, while awake, that a spotless and holy virgin was giving birth to a lamb,


    10. and on its left side there was as it were a lion; and all the beasts rushed against him, and the lamb overcame them and destroyed them, and trampled them underfoot.


    11. And because of him the angels and men rejoiced, and all the land.


    12. These things will happen in their proper times. Therefore, my children, when you see that all these things have happened in Israel, know that the kingdom of the Lord is near.


    13. Then flee from every lawless deed and from the works of Beliar, and cling to what is good and to the law of the Lord.


    14. And bury me near my fathers.


    15. And he finished his commands, and said, “I am going to sleep with my fathers.”


    16. And he stretched out his feet and died in a beautiful and good old age.


    17. And each of his sons did as he had commanded them, and they put him in a coffin and kept him in Egypt until the day of the exodus.


    18. And when the sons of Israel went up from Egypt, they carried up the bones of Benjamin also[c], and buried them in Hebron at the right side of Abraham and Isaac and Jacob.'
  footnotes:
  - marker: a
    text: Or 'on a cross'; the Greek says 'upon a tree,' preserving scriptural resonance with earlier sacred language.
    reason: lexical_alternative
  - marker: b
    text: The prophecy in verses 3–8 is often regarded by scholars as containing later expansion or Christian interpolation, but it is translated here as it stands in the Greek witness.
    reason: textual_variant
  - marker: c
    text: '''Beliar'' reflects the Greek form found in this testamentary tradition; many readers will know the name as ''Belial.'''
    reason: lexical_alternative
translation:
  language: ko
  text: '1[a]. 그러므로 여러분도 주님의 명령에 따라 거룩함 가운데서 걷는다면, 여러분은 안전하게 나와 함께 살 것이며, 온 이스라엘이 주님께 모일 것입니다.


    2. 그러면 나는 여러분의 파괴 때문에 더 이상 탐욕스러운 늑대라고 불리지 않고, 선을 행하는 이들에게 양식을 나누어 주는 주님의 일꾼이라고 불릴 것입니다.


    3. 그리고 마지막 때에 주님께 사랑받는 이가 일어날 것인데, 그는 유다와 레위 지파에서 나와서 모든 민족을 위한 새 이해와 함께 하나님의 기쁘신 뜻을 이루실 것입니다.


    4. 그의 존재는 모든 사람의 입에 있고, 그는 주님께 영원히 선택될 것이며, 그를 통해 주님을 아는 지식이 기쁨의 몫으로 땅 위에 주어질 것이고, 그를 통해 이스라엘이 비출 것입니다.


    5. 그때 그는 첫 번째 성전으로 들어갈 것이며, 거기서 주님은 모욕을 당하실 것이고, 나무 위로 들려질 것입니다.


    6[b]. 그러면 성전의 휘장이 찢어지고, 하나님의 영이 불처럼 쏟아져 내려가듯 민족들에게 넘어갈 것입니다.


    7. 그리고 그는 하데스에서 올라와 땅에서 하늘로 지나갈 것입니다.


    8. 나는 그가 땅에서는 얼마나 낮아질지, 하늘에서는 얼마나 영광스러울지 알고 있습니다.


    9. 이제 요셉이 이집트에 있을 때 나는 그의 모습과 형상을 보고 싶어 했습니다. 그리고 내 아버지 야곱의 기도를 통해, 깨어 있는 중에 나는 흠 없는 거룩한 처녀가 어린 양을 낳는 것을 보았습니다.


    10. 그리고 그 왼쪽에는 마치 사자가 있는 듯했고, 모든 짐승이 그를 향해 달려들었지만, 어린 양이 그들을 이기고 멸하였으며, 그들을 밟아 짓밟았습니다.


    11. 그리고 그 때문에 천사들과 사람들, 그리고 온 땅이 기뻐하였습니다.


    12. 이 일들은 그것들에게 정해진 때에 일어날 것입니다. 그러므로 내 자녀들아, 여러분이 이 모든 일이 이스라엘 가운데 일어났음을 보게 되면, 주님의 나라가 가까이 왔음을 아십시오.


    13. 그런 다음 모든 불법한 행위와 벨리아르의 일에서 도망하고, 선한 것과 주님의 율법에 매달리십시오.


    14. 그리고 나를 내 조상들 가까이에 묻으십시오.


    15. 그리고 그는 자신의 명령을 마치고, “나는 내 조상들과 함께 잠들러 갑니다”라고 말하였습니다.


    16. 그리고 그는 발을 뻗고, 아름답고 선한 늙은 나이로 죽었습니다.


    17. 그의 아들들은 모두 그가 명령한 대로 행하였고, 그를 관에 넣어 이집트에 두었으며, 출애굽의 날까지 보존하였습니다.


    18. 그리고 이스라엘의 아들들이 이집트에서 올라올 때, 그들은 베냐민의 뼈도 함께 가져올라가, 아브라함과 이삭과 야곱의 오른쪽 편에 있는 헤브론에 그를 묻었습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδρατε τὴν κακίαν
  english_pob_choice: flee from every lawless deed
  chosen_korean: 모든 불법한 행위에서 도망하다
  alternatives_korean:
  - 악에서 도망하다
  - 모든 악한 행위에서 달아나다
  lexicon: LSJ
  rationale: 명령형의 강한 회피 동사를 살리면서, POB의 'lawless deed'에 맞춰 악을 일반화하지 않고 불법성의 윤리적 색채를 유지했습니다.
- source_word: μισαδελφίαν
  english_pob_choice: ravaging / no direct English equivalent in the main line
  chosen_korean: 형제 미움
  alternatives_korean:
  - 형제혐오
  - 형제에 대한 미움
  lexicon: LSJ
  rationale: 합성어의 의미를 풀어 '형제 사랑의 반대'라는 공동체적 윤리 대립을 드러내는 쪽이 가장 직접적입니다.
- source_word: ἀγαθότητι καὶ τῇ ἀγάπῃ
  english_pob_choice: what is good ... love
  chosen_korean: 선한 것 ... 사랑
  alternatives_korean:
  - 선함 ... 사랑
  - 선과 사랑
  lexicon: BDAG
  rationale: 두 추상명사를 한국어에서 자연스럽게 병렬하되, ἀγαθότης의 덕목성을 살려 '선한 것'으로 옮겼습니다.
- source_word: ἠγαπημένος κυρίου
  english_pob_choice: beloved of the Lord
  chosen_korean: 주님께 사랑받는 이
  alternatives_korean:
  - 주님의 사랑받는 자
  - 주님이 사랑하시는 이
  lexicon: BDAG
  rationale: 수동형 의미를 살리고, 인칭적·예언적 문맥에 어울리는 중립적 호칭으로 정리했습니다.
- source_word: καταπέτασμα
  english_pob_choice: veil
  chosen_korean: 휘장
  alternatives_korean:
  - 장막 휘장
  - 커튼
  lexicon: BDAG
  rationale: 성전 문맥에서는 한국어 기독교 독자가 즉시 알아들을 수 있는 '휘장'이 가장 직접적이면서도 공간적 의미를 보존합니다.
- source_word: πνεῦμα θεοῦ
  english_pob_choice: Spirit of God
  chosen_korean: 하나님의 영
  alternatives_korean:
  - 하나님의 성령
  - 하나님의 영
  lexicon: BDAG
  rationale: 원문이 단지 πνεῦμα가 아니라 하나님의 영적 주체를 가리키지만, 이 비정경 텍스트에서는 문맥상 '성령'으로 좁히기보다 '하나님의 영'이 더 덜 과잉해석적입니다.
- source_word: ἐπὶ ξύλου
  english_pob_choice: upon a tree
  chosen_korean: 나무 위
  alternatives_korean:
  - 나무에
  - 십자가 위
  lexicon: BDAG
  rationale: ξύλον의 문자적 이미지와 성서적 울림을 유지하기 위해 '나무'를 살렸고, 전치사는 한국어에서 가장 자연스러운 위치표현으로 풀었습니다.
- source_word: Βελιάρ
  english_pob_choice: Beliar
  chosen_korean: 벨리아르
  alternatives_korean:
  - 벨리알
  lexicon: LSJ
  rationale: 본문의 그리스어 전승형을 따라 음역했으며, 통용형보다 원문 전승을 우선했습니다.
theological_decisions:
- issue: 예언된 인물의 이중 계통(유다와 레위)
  chosen_reading: 유다와 레위에서 나온다고 그대로 옮기고, 한 직분으로 조화시키지 않았습니다.
  alternative_readings:
  - 유다적 메시아로만 이해
  - 레위적 제사장으로만 이해
  - 후대 기독교적 왕·제사장 통합으로 정리
  rationale: 원문은 의도적으로 복합적 기대를 제시하므로, 번역은 그 긴장을 해소하지 않고 보존해야 합니다.
  doctrine_reference: DOCTRINE.md §Preserve theological tension rather than resolve it
- issue: '''나무 위''의 수난 이미지'
  chosen_reading: '''나무 위로 들려질 것입니다''로 직역해, 십자가를 명시하지 않았습니다.'
  alternative_readings:
  - '''십자가에 달릴 것입니다''로 해석 번역'
  - '''나무에 달릴 것입니다''로 완화'
  rationale: ξύλον의 성서적 표지를 유지하면서, 후대 교리적 용어를 본문에 선반영하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Original-language primacy over translation tradition
- issue: 1절 각주 표기
  chosen_reading: 1[a]로 표시해 POB의 번역 전승상 대체문구 가능성을 드러냈습니다.
  alternative_readings:
  - 각주 없이 본문만 제시
  - 단순 괄호 처리
  rationale: POB의 주석성·투명성을 살려, 해당 절이 전승상 선택 번역임을 보여 주기 위함입니다.
  doctrine_reference: PHILOSOPHY.md §What 'transparent' actually means here
