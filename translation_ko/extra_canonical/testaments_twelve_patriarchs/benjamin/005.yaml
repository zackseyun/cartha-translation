base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005.yaml
  text: '1[a]. If, then, you also have a good mind, even wicked people will be at peace with you, and the lawless[b], being put to shame before you, will turn back to what is good; and those who are greedy will not only withdraw from their passion, but will also give to those in distress the things of greed that they had possessed.


    2. If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.


    3. For where there is the fear of good works and light in the mind, darkness flees away from it.


    4. For if anyone does violence to a holy man, he changes his mind; for the holy one has mercy on those who revile him and keeps silent.


    5. And if anyone betrays a righteous soul and insults a righteous soul, the righteous man prays; and even if for a little while he is brought low, before long he appears far more radiant[e][d][c], as Joseph my brother also became.'
  footnotes:
  - marker: a
    text: Or 'the dissolute' or 'the reckless' for 'the lawless' (ἄσωτοι).
    reason: lexical_alternative
  - marker: b
    text: Literally 'the things of greed'; possibly 'the gains of greed' or 'what they had acquired by greed.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'the fear of good works' is difficult. It may mean reverence associated with good deeds or fear produced by a life of goodness.
    reason: alternative_reading
  - marker: d
    text: '''Changes his mind'' renders μετανοεῖ; alternatively, ''repents.'''
    reason: lexical_alternative
  - marker: e
    text: 'Joseph''s story is the model: though humbled for a time, he was later shown to be glorious and vindicated. See Genesis 37; 39–45.'
    reason: cross_reference
translation:
  language: ko
  text: '1. 그러므로 여러분도 선한 마음가짐을 지니고 있으면, 악한 사람들도 여러분과 평화를 이룰 것이며, 방탕한 자들[a]은 여러분을 보고 부끄러워하여 선한 것으로 돌아설 것입니다. 또 탐욕스러운 자들은 자기 욕망에서 물러날 뿐만 아니라, 자기들이 가지고 있던 탐욕의 소유물[b]을 고난받는 이들에게 줄 것입니다.


    2. 여러분이 선을 행하면, 부정한 영들마저 여러분에게서 달아날 것이며, 들짐승들도 여러분을 두려워할 것입니다.


    3. 선한 일들에 대한 두려움과 마음속의 빛이 있는 곳에서는 어둠이 그곳에서 달아납니다.[c]


    4. 누구든지 거룩한 사람을 모욕한다면, 그는 마음을 돌이킵니다.[d] 거룩한 이는 자기를 비방하는 사람들을 불쌍히 여기고 잠잠하기 때문입니다.


    5. 또 누구든지 의로운 사람을 배신하면, 의로운 사람은 기도합니다. 그가 잠시 낮아질지라도 머지않아 훨씬 더 빛나게 나타납니다[e]. 내 형 요셉도 그렇게 되었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘방탕한 자들’(ἄσωτοι)은 ‘방종한 자들’ 또는 ‘무절제한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘탐욕의 것들’입니다. ‘탐욕으로 얻은 것들’ 또는 ‘탐욕의 이득’으로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘선한 일들에 대한 두려움’(φόβος ἀγαθῶν ἔργων)은 난해한 표현입니다. 선한 행위와 관련된 경외를 뜻할 수도 있고, 선한 삶이 일으키는 두려움을 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: d
    text: ‘마음을 돌이킵니다’는 μετανοεῖ를 옮긴 말입니다. ‘뉘우칩니다’ 또는 ‘회개합니다’로도 번역할 수 있습니다. ‘모욕한다면’(ὑβρίσει)은 능욕하거나 심하게 가해하는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 요셉의 이야기가 본보기입니다. 그는 한동안 낮아졌으나 뒤에 영화롭게 되고 억울함을 벗었습니다. 창세기 37장, 39–45장을 보십시오.
    reason: cross_reference
lexical_decisions:
- source_word: διάνοιαν
  english_pob_choice: good mind
  chosen_korean: 좋은 마음
  alternatives_korean:
  - 좋은 생각
  - 건전한 마음
  - 선한 마음가짐
  lexicon: LSJ
  rationale: 이 문맥에서 διάνοια는 단순한 지적 능력보다 도덕적으로 올바른 내적 태도를 가리키므로, POB의 ‘good mind’를 살리되 한국어에서는 자연스러운 ‘좋은 마음’으로 옮겼습니다.
- source_word: ἄσωτοι
  english_pob_choice: the lawless
  chosen_korean: 무법한 자들
  alternatives_korean:
  - 방탕한 자들
  - 방종한 자들
  - 불법한 자들
  lexicon: LSJ
  rationale: 이 말은 단순한 방탕함보다 규범을 벗어난 도덕적 무질서를 강조하므로, POB의 ‘lawless’를 따라 법 질서의 부정 상태를 드러내는 ‘무법한 자들’로 옮겼습니다.
- source_word: τὰ τῆς πλεονεξίας
  english_pob_choice: the things of greed
  chosen_korean: 탐욕의 것들
  alternatives_korean:
  - 탐욕으로 얻은 것들
  - 탐욕의 소득
  - 탐욕의 소유물
  lexicon: LSJ
  rationale: 원문은 압축적이라 정확한 획득 방식까지 단정하지 않고, POB처럼 구조를 보존하는 번역이 필요합니다. 그래서 의미를 넓게 유지하는 ‘탐욕의 것들’로 두었습니다.
- source_word: ἀκάθαρτα πνεύματα
  english_pob_choice: unclean spirits
  chosen_korean: 더러운 영들
  alternatives_korean:
  - 부정한 영들
  - 불결한 영들
  lexicon: BDAG
  rationale: 영적 존재의 부정성과 오염성을 나타내는 표준적 표현을 살리되, 현대 한국어에서 직관적인 ‘더러운 영들’로 옮겼습니다.
- source_word: φόβος ἀγαθῶν ἔργων
  english_pob_choice: the fear of good works
  chosen_korean: 선한 일에 대한 두려움
  alternatives_korean:
  - 선한 일들에 대한 경외
  - 선한 일로부터 생기는 두려움
  - 선한 일에 대한 경외심
  lexicon: LSJ
  rationale: 이 구절은 문법적으로 난해하므로 해석을 과도하게 풀지 않고, POB의 어순과 긴장을 살려 ‘선한 일에 대한 두려움’으로 최대한 투명하게 옮겼습니다.
- source_word: ὑβρίσει
  english_pob_choice: does violence
  chosen_korean: 모욕하면
  alternatives_korean:
  - 폭력을 행사하면
  - 능욕하면
  - 학대하면
  lexicon: LSJ
  rationale: 이 동사는 단순한 언어적 insult보다 더 넓은 수치와 폭력을 포함할 수 있지만, 이 문맥의 대조는 거룩한 사람을 향한 가해 행위를 가리키므로 한국어에서는 ‘모욕하면’이 가장 자연스럽습니다.
- source_word: μετανοεῖ
  english_pob_choice: changes his mind
  chosen_korean: 마음을 돌이킬 것입니다
  alternatives_korean:
  - 회개할 것입니다
  - 뜻을 바꿀 것입니다
  lexicon: BDAG
  rationale: POB의 audit trail대로 이곳은 회개 용어보다 태도와 판단의 전환을 가리키므로, ‘마음을 돌이킬 것입니다’로 옮겨 의미의 방향 전환을 살렸습니다.
- source_word: φαιδρότερος
  english_pob_choice: far more radiant
  chosen_korean: 훨씬 더 빛나게
  alternatives_korean:
  - 훨씬 더 환하게
  - 훨씬 더 영광스럽게
  - 훨씬 더 찬란하게
  lexicon: LSJ
  rationale: 요셉의 예시는 굴욕 후의 외적·상징적 회복을 가리키므로, 단순 감정이 아닌 가시적 밝음을 드러내는 ‘빛나게’가 적절합니다.
theological_decisions:
- issue: φόβος ἀγαθῶν ἔργων의 난해한 구조 보존
  chosen_reading: ‘선한 일에 대한 두려움’으로 직역에 가깝게 두어, 원문의 모호성을 본문 안에서 유지했습니다.
  alternative_readings:
  - 선한 일에 대한 경외
  - 선한 일로 인해 생기는 두려움
  rationale: 원문 자체가 해석을 요구하므로, 본문에서 결론을 내려 버리기보다 독자가 텍스트의 긴장을 보도록 남겨 두는 것이 맞습니다.
  doctrine_reference: 'DOCTRINE.md: preserve theological tension rather than resolve it'
- issue: μετανοεῖ의 의미
  chosen_reading: ‘마음을 돌이킬 것입니다’
  alternative_readings:
  - 회개할 것입니다
  - 뉘우칠 것입니다
  rationale: 이 장면은 죄책 고백보다 거룩한 사람 앞에서의 태도 전환을 말하므로, 회개 용어로 신학적으로 좁히지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: μετανοέω → change of mind / repent by context'
