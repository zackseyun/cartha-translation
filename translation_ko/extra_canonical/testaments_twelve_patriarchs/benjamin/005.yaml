revisions:
- from: '1. 그러므로 여러분도 좋은 마음을 가지고 있으면, 악한 사람들도 여러분과 평화를 누릴 것이며, 무법한 자들[a]은 여러분 앞에서 부끄러워하며 좋은 것으로 돌아설 것입니다. 또한 탐욕스러운 자들은 자기의 욕망에서 물러날 뿐만 아니라, 자기들이 지니고 있던 탐욕의 것들[b]도 고난받는 이들에게 내줄 것입니다.


    2. 여러분이 선을 행하고 있으면, 더러운 영들은 여러분에게서 달아날 것이며, 들짐승들도 여러분을 두려워할 것입니다.


    3. 선한 일에 대한 두려움과 마음의 빛이 있는 곳에서는 어둠이 그것으로부터 달아납니다.[c]


    4. 만일 누구든지 거룩한 사람을 모욕하면, 그는 마음을 돌이킬 것입니다.[d] 거룩한 이는 자기를 비방하는 사람들을 불쌍히 여기고 잠잠하기 때문입니다.


    5. 또 누구든지 의로운 영혼을 배반하고 의로운 영혼을 욕하면, 의로운 사람은 기도합니다. 그리고 잠시 낮아질지라도, 머지않아 그는 훨씬 더 빛나게 나타납니다[e]. 내 형 요셉도 그렇게 되었습니다.'
  to: '1. 그러므로 여러분도 선한 마음가짐을 지니고 있으면, 악한 사람들도 여러분과 평화를 이룰 것이며, 방탕한 자들[a]은 여러분을 보고 부끄러워하여 선한 것으로 돌아설 것입니다. 또 탐욕스러운 자들은 자기 욕망에서 물러날 뿐만 아니라, 자기들이 가지고 있던 탐욕의 소유물[b]을 고난받는 이들에게 줄 것입니다.


    2. 여러분이 선을 행하면, 부정한 영들마저 여러분에게서 달아날 것이며, 들짐승들도 여러분을 두려워할 것입니다.


    3. 선한 일들에 대한 두려움과 마음속의 빛이 있는 곳에서는 어둠이 그곳에서 달아납니다.[c]


    4. 누구든지 거룩한 사람을 모욕한다면, 그는 마음을 돌이킵니다.[d] 거룩한 이는 자기를 비방하는 사람들을 불쌍히 여기고 잠잠하기 때문입니다.


    5. 또 누구든지 의로운 사람을 배신하면, 의로운 사람은 기도합니다. 그가 잠시 낮아질지라도 머지않아 훨씬 더 빛나게 나타납니다[e]. 내 형 요셉도 그렇게 되었습니다.'
  rationale: 그리스어 원문을 우선하여 5절의 영어 본문 혼입을 삭제하고, 4절 현재형을 반영했습니다. 어휘상 ἄσωτοι를 ‘방탕한 자들’로 바로잡고, 난해한 3절 및 πλεονεξία 관련 표현은 본문과 주석에서 모호성을 유지했습니다. 모든 주석 표지는 본문에 한 번씩 정확히 연결했습니다.
  reviewer_model: gpt-5.6-terra
