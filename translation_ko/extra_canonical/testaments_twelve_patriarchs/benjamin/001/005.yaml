  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Σφόδρα γὰρ²⁵ *ἠγάπα ὁ πατήρ μου²⁶ τὴν Ῥαχήλ²⁷, καὶ ηὔχετο δύο υἱοὺς ἰδεῖν ἐξ αὐτῆς²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/005.yaml
  text: For my father loved Rachel exceedingly, and he prayed to see two sons from her.
translation:
  language: ko
  text: 내 아버지께서는 라헬을 몹시 사랑하셨고, 그녀에게서 두 아들을 보기를 바라며 기도하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σφόδρα ... ἠγάπα
  english_pob_choice: loved ... exceedingly
  chosen_korean: 몹시 사랑하셨고
  alternatives_korean:
  - 매우 사랑하셨고
  - 지극히 사랑하셨고
  lexicon: ἀγαπάω
  rationale: Σφόδρα의 강한 정도 부사를 살려 사랑의 강도를 분명히 드러내되, 현대 한국어에서 자연스럽고 과장되지 않은 ‘몹시’로 옮겼습니다.
- source_word: τὴν Ῥαχήλ
  english_pob_choice: Rachel
  chosen_korean: 라헬을
  alternatives_korean:
  - 라헬을
  - 라헬을 매우
  lexicon: 고유명사
  rationale: 성서 인명은 현대 음역 관례에 따라 라헬로 옮겼습니다.
- source_word: ηὔχετο
  english_pob_choice: he prayed
  chosen_korean: 기도하셨습니다
  alternatives_korean:
  - 간구하셨습니다
  - 빌었습니다
  lexicon: εὔχομαι
  rationale: 문맥상 단순한 소망이 아니라 하나님께 드리는 청원의 뉘앙스가 있어 ‘기도하다’로 옮겼습니다.
- source_word: δύο υἱοὺς ἰδεῖν ἐξ αὐτῆς
  english_pob_choice: to see two sons from her
  chosen_korean: 그녀에게서 두 아들을 보기를
  alternatives_korean:
  - 그녀에게서 두 아들을 얻기를
  - 그녀에게서 두 아들을 보기 위하여
  lexicon: 두 아들을 보기를
  rationale: ἰδεῖν은 여기서 ‘직접 보게 되다/얻게 되다’의 희망 표현으로 읽히며, 한국어에서는 자연한 목적절로 살렸습니다.
theological_decisions:
- issue: 본문의 청원 동사 ηὔχετο의 종교적 성격
  chosen_reading: 아버지의 개인적 소망이 아니라 하나님께 드리는 기도로 이해해 ‘기도하셨습니다’로 번역했습니다.
  alternative_readings:
  - 원어의 희망적 뉘앙스를 따라 ‘바랐습니다’로 완화하는 읽기
  - ‘간구하셨습니다’로 더 강하게 청원성을 드러내는 읽기
  rationale: 영어 POB도 prayed를 택하고 있으며, 문맥상 출산을 위한 신앙적 청원으로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 서사 문맥의 기도 표현
- issue: ‘두 아들을 보기를’의 종말적/예언적 뉘앙스
  chosen_reading: 단순한 시각적 ‘보기’보다 소원 성취를 포함한 목적 표현으로 유지했습니다.
  alternative_readings:
  - ‘두 아들을 얻기를’로 결과를 더 분명히 하는 읽기
  - ‘두 아들을 보게 되기를’로 수동적 기대를 강조하는 읽기
  rationale: 원문 ἰδεῖν은 문자적으로 ‘보다’이지만, 여기서는 출산을 향한 기대를 담은 관용적 희망 표현이어서 의미를 과도하게 바꾸지 않는 선에서 옮겼습니다.
  doctrine_reference: 서사적 희망 표현
