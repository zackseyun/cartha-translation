  source_fidelity: 핵심 의미는 충실합니다. 다만 원문의 ηὔχετο δύο υἱοὺς ἰδεῖν(‘두 아들을 보게 해 달라고 기도했다’)에 대해 초안의 ‘보기를 바라며 기도하셨습니다’는 ‘바라며’를 별도로 보태어 기도와 소망을 병렬적·부수적으로 표현합니다. 한국어에서는 청원의 내용을 직접 드러내는 표현이 원문에 더 가깝습니다.
  naturalness: ‘두 아들을 보기를 바라며 기도하셨습니다’도 이해되지만 다소 겹치고 문어적으로 뻣뻣합니다. ‘두 아들을 보게 해 달라고 기도하셨습니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘라헬’, ‘몹시 사랑하셨고’, ‘기도하셨습니다’는 적절합니다. 대명사 ‘그녀’ 대신 선행 인명인 ‘라헬’을 반복하면 짧은 문장 안에서 더 분명하고 자연스럽습니다.
  issues:
  - severity: low
    issue: 기도의 내용을 ‘보기를 바라며’로 우회적으로 표현함
    rationale: 그리스어 부정사 ἰδεῖν은 기도의 직접 내용입니다. ‘보게 해 달라고’로 옮기면 청원 구조와 ‘보다’의 의미를 모두 더 직접적으로 보존합니다.
  revised_text: 내 아버지께서는 라헬을 몹시 사랑하셨고, 라헬에게서 두 아들을 보게 해 달라고 기도하셨습니다.
