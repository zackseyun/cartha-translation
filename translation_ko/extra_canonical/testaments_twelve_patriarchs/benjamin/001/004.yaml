  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/004.yaml
  text: For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and having conceived, she bore me.
translation:
  language: ko
  text: 라헬은 요셉을 낳은 뒤 십이 년 동안 아이를 낳지 못했습니다. 라헬은 금식하며 주님께 기도했고, 잉태하여 나를 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστείρευσεν
  english_pob_choice: was barren
  chosen_korean: 불임이었습니다
  alternatives_korean:
  - 열매를 맺지 못했습니다
  - 아이를 낳지 못했습니다
  lexicon: στείρω / ἐστερέω 계열
  rationale: 단순히 아이가 없었던 상태가 아니라 출산하지 못하는 상태를 분명히 드러내기 위해 ‘불임’이 가장 직접적입니다.
- source_word: πρὸς Κύριον
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 주께
  - 하나님께
  lexicon: κύριος
  rationale: 본문은 기도 대상이신 κύριος를 가리키므로, 한국어에서는 경건한 호격을 살린 ‘주님께’가 자연스럽습니다.
- source_word: μετὰ νηστείας
  english_pob_choice: with fasting
  chosen_korean: 금식하며
  alternatives_korean:
  - 금식과 함께
  - 금식하면서
  lexicon: νηστεία
  rationale: 기도와 금식이 동반된 행위를 한국어 서술 흐름에서 자연스럽게 연결하기 위해 ‘금식하며’로 옮겼습니다.
- source_word: συλλαβοῦσα τέτοκέ με
  english_pob_choice: having conceived ... she bore me
  chosen_korean: 금식 중에 잉태하여 나를 낳았습니다
  alternatives_korean:
  - 잉태한 뒤 나를 낳았습니다
  - 잉태하여 저를 낳았습니다
  lexicon: συλλαμβάνω / τίκτω
  rationale: 최신 POB 수정처럼 잉태가 금식과 연관된다는 점을 살려 ‘금식 중에’로 반영했고, 두 동사의 연속 관계를 간결하게 유지했습니다.
theological_decisions:
- issue: 금식과 잉태의 관계
  chosen_reading: 라헬이 기도와 금식 가운데 잉태하였다는 연속성을 본문대로 드러냈습니다.
  alternative_readings:
  - ‘기도한 뒤에 잉태하여’처럼 금식의 연결을 약화시키는 읽기
  rationale: 개정된 영어 POB가 잉태 시점에 금식의 요소를 분명히 넣고 있으므로, 한국어도 그 신학적·서사적 긴장을 보존해야 합니다.
  doctrine_reference: 본문 주해상의 시간관계 보존
