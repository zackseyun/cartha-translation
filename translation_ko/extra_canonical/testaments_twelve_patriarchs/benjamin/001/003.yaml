id: T12P.BEN.1.3
reference: Testament of Benjamin 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ ἐπειδὴ¹⁶ Ῥαχὴλ *ἡ μήτηρ μου¹⁷ τέθνηκε¹⁸ γεννῶσά με, *γάλα οὐκ ἔσχον· Βαλλὰν οὖν τὴν παιδίσκην αὐτῆς ἐθήλασα¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/003.yaml
  text: And since Rachel, my mother, died while giving birth to me, I had no milk; so I was nursed by Bilhah, her slave-girl.
translation:
  language: ko
  text: 레아헬, 곧 내 어머니는 나를 낳다가 죽으셨으므로 나는 젖이 없었습니다. 그래서 나는 그의 노예 소녀 발라에게 젖을 먹었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ῥαχήλ ἡ μήτηρ μου
  english_pob_choice: Rachel, my mother
  chosen_korean: 레아헬, 곧 내 어머니
  alternatives_korean:
  - 라헬, 내 어머니
  - 라헬, 곧 내 어머니
  lexicon: 고유명사 음역 / 삽입구
  rationale: 본문의 삽입적 호격 구조를 살려 ‘곧’로 동격을 풀어 주었고, 고유명사는 현대 음역에 맞춰 라헬보다 레아헬로 옮겼습니다.
- source_word: τέθνηκε γεννῶσά με
  english_pob_choice: died while giving birth to me
  chosen_korean: 나를 낳다가 죽으셨으므로
  alternatives_korean:
  - 나를 낳는 중에 죽으셨으므로
  - 나를 해산하다가 죽으셨으므로
  lexicon: 동사구 / 출산 상황
  rationale: γέννῶσά με의 출산 행위를 자연스럽게 드러내면서, τέθνηκε의 완료적 결과를 한국어의 과거 서술로 반영했습니다.
- source_word: παιδίσκην
  english_pob_choice: slave-girl
  chosen_korean: 노예 소녀
  alternatives_korean:
  - 여종
  - 여종 소녀
  - 하녀
  lexicon: 사회적 신분 명사
  rationale: 영어 POB가 ‘slave-girl’을 채택한 점을 따라, 단순한 가사종인 ‘하녀’보다 예속 상태를 분명히 드러내는 ‘노예 소녀’를 택했습니다.
- source_word: ἐθήλασα
  english_pob_choice: I was nursed by
  chosen_korean: 젖을 먹었습니다
  alternatives_korean:
  - 젖을 먹여 길러졌습니다
  - 유모로부터 젖을 먹었습니다
  lexicon: 수유 표현
  rationale: 수동 의미를 한국어에서는 통상적 수유 표현으로 자연스럽게 풀어, 문맥상 양육 주체가 발라임을 유지했습니다.
theological_decisions:
- issue: 노예 신분을 나타내는 παιδίσκη의 번역
  chosen_reading: 발라를 ‘노예 소녀’로 번역해 예속된 신분을 분명히 드러냈습니다.
  alternative_readings:
  - ‘여종’으로 완화하는 번역
  - ‘하녀’로 직업적 의미로 축소하는 번역
  rationale: 본문과 영어 POB가 모두 Bilhah의 예속성을 강조하므로, 사회적 위계를 흐리는 완화 번역을 피했습니다.
  doctrine_reference: 성경 본문의 역사적·사회적 현실을 가리는 완화 번역을 지양하는 원칙
