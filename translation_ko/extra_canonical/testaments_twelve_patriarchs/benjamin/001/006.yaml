lexical_decisions:
- source_word: Διὰ τοῦτο ἐκλήθην
  english_pob_choice: Because of this I was called
  chosen_korean: 이 때문에 나는 …이라고 불렸는데
  alternatives_korean:
  - 그래서 나는 …이라고 불렸습니다
  - 이로 인해 나는 …이라는 이름을 얻었습니다
  lexicon: ἐκλήθην
  rationale: 원문의 수동형 ‘불리다’를 살려, 이름이 주어진 결과를 자연스러운 현대 문체로 옮겼습니다.
