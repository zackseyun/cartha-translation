  lexicon: υἱὸς ἡμερῶν
  rationale: 직역에 가깝게 ‘날들의 아들’을 유지하되, 의미 설명 구문임을 분명히 했습니다.
- source_word: (latest revision pass) She bore me.
  english_pob_choice: She bore me.
  chosen_korean: 그가 나를 낳았습니다
