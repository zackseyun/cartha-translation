  rationale: 히브리어계 성경 인명으로서 한국어 성경에서 널리 쓰이는 표기를 따랐습니다.
- source_word: ὅ ἐστιν υἱὸς ἡμερῶν
  english_pob_choice: which means son of days
  chosen_korean: 그 뜻은 ‘날들의 아들’입니다
