base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/002.yaml
  text: 'And after kissing them, he said: “Just as Isaac was born to Abraham in his old age, so I also was born to Jacob.”'
translation:
  language: ko
  text: 그들에게 입맞춘 뒤 이렇게 말했습니다. “이삭이 아브라함의 노년에 태어난 것처럼, 나도 야곱에게서 태어났습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταφιλήσας δὲ αὐτοὺς
  english_pob_choice: And after kissing them
  chosen_korean: 그들에게 입맞춘 뒤
  alternatives_korean:
  - 그들에게 입을 맞춘 후
  - 그들에게 입맞춤하고
  lexicon: Καταφιλέω
  rationale: 동작의 선행을 자연스럽게 살리되, 원문의 강한 애정 표현을 보존하기 위해 단순히 ‘인사했다’로 약화하지 않았습니다.
- source_word: εἶπεν
  english_pob_choice: he said
  chosen_korean: 이렇게 말했습니다
  alternatives_korean:
  - 말했습니다
  - 말하셨습니다
  lexicon: λέγω
  rationale: 직접 인용이 이어지므로 한국어에서 문장 흐름을 매끄럽게 하기 위해 ‘이렇게’로 인용 도입을 자연화했습니다.
- source_word: ἐν γήρει αὐτοῦ
  english_pob_choice: in his old age
  chosen_korean: 그의 노년에
  alternatives_korean:
  - 그의 늙은 나이에
  - 그가 늙었을 때
  lexicon: γῆρας
  rationale: 원문의 시간 배경을 간결하게 드러내는 표준적인 표현으로 옮겼습니다.
- source_word: τῷ Ἰακώβ
  english_pob_choice: to Jacob
  chosen_korean: 야곱에게서
  alternatives_korean:
  - 야곱에게
  - 야곱을 통해
  lexicon: dative relation
  rationale: 출생의 귀속 대상이라는 관계를 한국어에서 자연스럽게 드러내기 위해 ‘~에게서 태어났다’로 옮겼습니다.
theological_decisions:
- issue: 출생 관계의 표현
  chosen_reading: ‘이삭이 아브라함에게서 태어났다’, ‘나도 야곱에게서 태어났습니다’로 병렬해, 아버지-자식 출생 관계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘아브라함에게 태어났다’처럼 단순화
  - ‘아브라함의 아들로 태어났다’로 의역
  rationale: 원문은 혈통적 출생 관계를 비교문으로 제시하므로, 친족 관계를 흐리지 않고 직접적으로 표현하는 것이 적절합니다.
  doctrine_reference: 문맥상 족장 전승의 자기 비유이며, 신학적 재해석 없이 서술 의미를 보존합니다.
