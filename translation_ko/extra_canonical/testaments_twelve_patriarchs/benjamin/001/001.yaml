  text: The Testament of Benjamin, the twelfth son of Jacob and Rachel. The Copy of the Words of Benjamin, which he set in order for his sons, after he had lived one hundred and twenty-five years.
translation:
  language: ko
  text: 야곱과 라헬의 열두 번째 아들 베냐민의 유언입니다. 이는 베냐민이 백이십오 년을 살고 나서 자기 아들들에게 정리하여 남긴 말씀의 사본입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  english_pob_choice: The Testament
  chosen_korean: 유언
  alternatives_korean:
  - 언약
  - 테스타먼트
  lexicon: διαθήκη
  rationale: 이 문맥은 후대에 정리된 족장의 마지막 말들을 가리키므로, 한국어에서는 문학적·장르적 기능을 살리는 ‘유언’이 가장 자연스럽습니다.
- source_word: Ἀντίγραφον λόγων
  english_pob_choice: The Copy of the Words
  chosen_korean: 말씀의 사본
  alternatives_korean:
  - 말들의 사본
  - 말의 복사본
  - 언설의 필사본
  lexicon: ἀντίγραφον, λόγοι
  rationale: ἀντίγραφον은 ‘사본’, λόγοι는 이 전승물의 내용물인 ‘말씀/말들’로 옮길 수 있어, 전승 문서의 형식을 드러내는 ‘말씀의 사본’으로 다듬었습니다.
- source_word: διέθετο
  english_pob_choice: he set in order
  chosen_korean: 정리하였습니다
  alternatives_korean:
  - 배치하였습니다
  - 유언으로 남겼습니다
  - 편성하였습니다
  lexicon: διατίθημι
  rationale: 문서나 말들을 차례 있게 정돈한다는 뜻을 살려, 지나치게 추상적인 ‘배치’보다 자연스러운 ‘정리하였습니다’를 택했습니다.
- source_word: ζήσας ἔτη ἑκατὸν εἴκοσι πέντε
  english_pob_choice: after he had lived one hundred and twenty-five years
  chosen_korean: 백스물다섯 해를 산 뒤에
  alternatives_korean:
  - 백스물다섯 살을 살고서
  - 백스물다섯 해를 살았을 때
  lexicon: ζάω
  rationale: ζήσας는 단순한 연령 표기보다 ‘산 뒤에’라는 완료된 생애의 종결을 강조하므로, 연대적 의미를 살려 번역했습니다.
theological_decisions:
- issue: 문서 제목과 본문 첫 문장의 관계
  chosen_reading: 첫 문장은 전체 저작의 표제처럼 ‘베냐민…의 유언’과 ‘베냐민의 말씀의 사본’ 두 층위를 함께 드러냅니다.
  alternative_readings:
  - 둘 중 하나만 제목으로 처리
  - 후자를 본문만으로 흡수
  rationale: 원문과 영어 POB 개정본 모두 opening title clause를 복원하고 있어, 한국어도 두 표현을 모두 살려 전승 문서의 복합 표제를 보존했습니다.
  doctrine_reference: 텍스트 비평/서지학적 구조 보존
