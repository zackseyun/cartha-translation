id: T12P.BEN.12.1
reference: Testament of Benjamin 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XII. ¹Καὶ ταῦτα εἰπὼν ἐκτείνας τοὺς πόδας αὐτοῦ ἐκοιμήθη †ὕπνῳ² καλῷ [καὶ ἀγαθῷ]³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/001.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good [and good] sleep.
translation:
  language: ko
  text: 이런 말을 하고 나서 그는 발을 뻗고 좋은 잠에 들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ταῦτα εἰπὼν
  english_pob_choice: And after saying these things
  chosen_korean: 이런 말을 하고 나서
  alternatives_korean:
  - 이 일들을 말한 뒤에
  - 이것들을 말하고 나서
  lexicon: καὶ + ταῦτα εἰπών
  rationale: 앞서 한 말을 마무리하는 시간적 연결을 자연스럽게 옮기되, 지시대명사 ταῦτα의 구체성을 과도하게 풀지 않았습니다.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  english_pob_choice: he stretched out his feet
  chosen_korean: 그는 발을 뻗고
  alternatives_korean:
  - 그는 자기 발을 뻗고
  - 그는 발을 길게 뻗고
  lexicon: ἐκτείνω + τοὺς πόδας
  rationale: 직역의 어색함을 피하면서도 ‘뻗다’로 동작의 이미지와 신체성을 유지했습니다.
- source_word: ἐκοιμήθη
  english_pob_choice: fell asleep
  chosen_korean: 잠에 들었습니다
  alternatives_korean:
  - 잠들었습니다
  - 잠이 들었습니다
  lexicon: κοιμάω (aorist passive used in intransitive sense)
  rationale: 문맥상 자연스러운 한국어 관용을 택하되, 단순히 ‘죽다’로 확장하지 않고 수면의 의미를 보존했습니다.
- source_word: ὕπνῳ καλῷ [καὶ ἀγαθῷ]
  english_pob_choice: in a good [and good] sleep
  chosen_korean: 좋은 잠
  alternatives_korean:
  - 아주 좋은 잠
  - 복된 잠
  lexicon: ὕπνος + καλός + ἀγαθός
  rationale: Greek 본문의 반복된 형용사와 영어 본문의 괄호 처리를 반영해, 중복을 억지로 한국어에 재현하지 않고 ‘좋은’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘잠들다’ 표현의 의미 범위
  chosen_reading: 이 구절은 단순한 수면을 말하는 것으로 읽었습니다.
  alternative_readings:
  - 죽음을 완곡하게 가리키는 표현으로 읽을 수 있음
  - 예언자적 평안의 죽음을 암시하는 표현으로 읽을 수 있음
  rationale: 본문은 직접적으로 죽음을 말하지 않고 κοιμάω의 일반적 수면 의미를 사용할 수 있으므로, 문맥을 넘는 신학적 확장을 피했습니다.
  doctrine_reference: 본문 주해 원칙
