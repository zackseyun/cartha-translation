translation:
  language: ko
  text: 그들은 가나안 땅에서 돌아와, 이집트에서 그들이 이집트 땅에서 떠나는 날까지 살았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψαν
  english_pob_choice: they returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 돌아갔습니다
  lexicon: ἐπιστρέφω
  rationale: 단순한 이동의 반대 방향을 자연스럽게 살리면서, 이어지는 동작과 연결되는 서술형 과거로 처리했습니다.
- source_word: γῆς Χαναάν
  english_pob_choice: from the land of Canaan
  chosen_korean: 가나안 땅에서
  alternatives_korean:
  - 가나안에서
  - 가나안 땅으로부터
  lexicon: γῆ
  rationale: γῆ를 ‘땅’으로 옮겨 원문의 지리적·서사적 감각을 보존했습니다.
- source_word: ᾤκησαν ἐν Αἰγύπτῳ
  english_pob_choice: lived in Egypt
  chosen_korean: 이집트에서 살았습니다
  alternatives_korean:
  - 이집트에 거주했습니다
  - 이집트에서 거하였습니다
  lexicon: οἰκέω
  rationale: 거주·정착의 의미를 ‘살았습니다’로 자연스럽게 전달하되, 원문의 지속성을 유지했습니다.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  english_pob_choice: until the day of their departure
  chosen_korean: 그들이 이집트 땅에서 떠나는 날까지
  alternatives_korean:
  - 그들의 출애굽 날까지
  - 그들이 나가는 날까지
  lexicon: ἔξοδος
  rationale: ἔξοδος를 직역적이면서도 문맥상 분명하게 ‘떠나는 날’로 옮겨, 서사 흐름을 유지했습니다.
theological_decisions:
- issue: ‘출애굽’ 용어를 직접 사용할지 여부
  chosen_reading: 본문은 서술적 표현인 ‘떠나는 날까지’를 사용했습니다.
  alternative_readings:
  - 출애굽하는 날까지
  - 이집트에서 나오는 날까지
  rationale: 원문은 명사형 사건명보다 ‘그들의 떠남’이라는 표현을 쓰므로, 과도한 성서용어화를 피하고 원문 구조를 따랐습니다.
  doctrine_reference: Source transparency over ecclesial idiom
