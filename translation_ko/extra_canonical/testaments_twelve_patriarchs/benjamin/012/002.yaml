source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Οἱ δὲ υἱοὶ αὐτοῦ ἐποίησαν ὡς προσέταξεν αὐτοῖς, καὶ ἄραντες τὸ σῶμα αὐτοῦ ἔθαψαν αὐτὸ⁴ ἐν Χεβρὼν μετὰ τῶν πατέρων αὐτοῦ. Καὶ⁶ *ὡς ἐπλήρωσε τοὺς λόγους αὐτοῦ⁷ εἶπεν⁸. Ἐντέλλομαι ὑμῖν, *τέκνα μου⁹, ἀνενέγκατε¹⁰ τὰ ὀστᾶ μου ἐξ Αἰγύπτου, καὶ *θάψατέ με¹¹ εἰς¹² Χεβρὼν ἐγγὺς¹³ τῶν πατέρων μου. 2. Καὶ¹⁴ ἀπέθανε Βενιαμίν¹⁵ *ἑκατὸν εἴκοσι πέντε¹⁶ ἐτῶν ἐν γήρει καλῷ· καὶ ἔθηκαν αὐτὸν ἐν παραθήκῃ¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/002.yaml
  text: 'And his sons did as he had commanded them, and they carried his body and buried him in Hebron with his fathers.


    And when he had finished his words, he said, “I command you, my children, carry my bones up out of Egypt, and bury me in Hebron near my fathers.”

    And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.'
translation:
  language: ko
  text: '그의 아들들은 그가 그들에게 명령한 대로 행하여 그의 시신을 옮겨, 헤브론에서 그의 조상들과 함께 장사했습니다.


    그가 자기 말을 마치자 말했습니다. “내 자녀들아, 내가 너희에게 명령합니다. 내 뼈를 이집트에서 가지고 올라가, 내 조상들 가까이에 있는 헤브론에 나를 장사하십시오.”


    벤야민은 좋은 노년에 이르러 백스물다섯 살에 죽었고, 그들은 그를 관에 안치했습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ σῶμα αὐτοῦ / τὰ ὀστᾶ μου
  english_pob_choice: his body / my bones
  chosen_korean: 그의 시신 / 내 뼈
  alternatives_korean:
  - 그의 몸 / 내 유골
  - 그의 시체 / 내 뼈
  lexicon: σῶμα, ὀστέα
  rationale: 본문은 첫째 문장에서는 장사된 대상이 ‘몸’이 아니라 이미 죽은 뒤의 시신임을, 둘째 문장에서는 실제로 이집트에서 옮겨 올 유해가 ‘뼈’임을 구분해 말하므로, 한국어도 시신/뼈로 구별해 옮겼습니다.
- source_word: ἔθαψαν / θάψατέ με
  english_pob_choice: buried / bury me
  chosen_korean: 장사했습니다 / 장사하십시오
  alternatives_korean:
  - 묻었습니다 / 묻어 주십시오
  - 장례했습니다 / 장례해 주십시오
  lexicon: θάπτω
  rationale: 장례 행위의 결과와 명령을 모두 드러내기 위해, 한국어 성경에서 익숙한 ‘장사하다’를 사용하되 명령형도 같은 동사로 맞추어 본문 연결을 살렸습니다.
- source_word: πατέρων
  english_pob_choice: with his fathers / near my fathers
  chosen_korean: 그의 조상들과 함께 / 내 조상들 가까운
  alternatives_korean:
  - 그의 조상들과 함께 / 내 조상들 곁의
  - 그의 조상들 곁에 / 내 조상들 근처에
  lexicon: πατέρες
  rationale: 여기서 πατέρες는 단순한 ‘아버지들’보다 조상들을 가리키는 장례 문맥이므로, 관계성과 매장 위치를 함께 살려 ‘조상들’로 옮겼습니다.
- source_word: ἐν παραθήκῃ
  english_pob_choice: in a coffin
  chosen_korean: 관에 안치했습니다
  alternatives_korean:
  - 관에 넣었습니다
  - 관에 두었습니다
  lexicon: παραθήκη
  rationale: 직역하면 ‘맡겨 둠/보관함’의 뜻이지만, 영어 POB의 ‘coffin’은 장례 맥락을 해석한 표현이므로 한국어도 완곡하게 ‘관에 안치했습니다’로 옮겨 문맥을 반영했습니다.
theological_decisions:
- issue: 히브론 매장과 조상들 곁에 묻히기를 요청하는 장례-언약 기억의 표현
  chosen_reading: 본문의 초점은 단순한 매장 지시가 아니라, 조상들과 함께/가까이 묻힘으로써 족장 전승과 약속의 땅 기억을 잇는 데 있다고 보고 그대로 살렸습니다.
  alternative_readings:
  - 단순한 가족묘 지시로만 읽는 해석
  - 유해 운송 지시를 중심으로 보는 해석
  rationale: 본문은 동일한 장소(헤브론)와 조상들을 반복해 강조하므로, 장례 요청이 신앙적 기억의 행위라는 점을 번역에서 약화시키지 않았습니다.
  doctrine_reference: 족장 전승과 약속의 땅에 대한 기억, 장례 관습
