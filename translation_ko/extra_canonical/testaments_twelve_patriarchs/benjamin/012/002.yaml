  terminology: ‘시신/뼈’의 구별, ‘장사하다’, ‘조상들’, ‘관에 안치하다’는 장례 문맥과 원문의 표현을 적절히 살립니다. ‘백스물다섯 살’은 현대 한국어 산문에서 자연스러운 수사 표기입니다.
