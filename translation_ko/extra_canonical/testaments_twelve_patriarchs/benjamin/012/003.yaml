  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/003.yaml
  text: And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly in the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].
  footnotes:
  - marker: c
    text: The phrase 'beside the feet of their fathers' is literal Greek and may refer to burial placement near the ancestral tombs rather than directly at the fathers' feet.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이스라엘 자손이 이집트에서 떠난 지 아흔한 해에, 그들과 그들의 형제들은 가나안 전쟁 속에서 몰래 그들의 조상들의 뼈를 옮겨 와서, 헤브론에 그들의 조상들의 발곁에 장사했습니다.[c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνενηκοστῷ πρώτῳ ἔτει
  english_pob_choice: in the ninety-first year
  chosen_korean: 아흔한 해에
  alternatives_korean:
  - 아흔한 번째 해에
  - 제91년에
  lexicon: 91년/연도 표현
  rationale: 연대 표지를 자연스러운 현대 한국어로 옮기되, 서수 의미를 분명히 드러냈습니다.
- source_word: ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου
  english_pob_choice: after the departure of the sons of Israel from Egypt
  chosen_korean: 이스라엘 자손이 이집트에서 떠난 지
  alternatives_korean:
  - 이스라엘 자손의 이집트에서의 출애굽 후
  - 이스라엘 자손이 이집트에서 나온 뒤
  lexicon: 출애굽/이집트 탈출
  rationale: 원문의 ‘떠남’(ἐξόδος)을 사건 서술로 살려 직역에 가까운 형태로 두었습니다.
- source_word: ἐν τῷ πολέμῳ Χαναάν
  english_pob_choice: in the war in Canaan
  chosen_korean: 가나안 전쟁 속에서
  alternatives_korean:
  - 가나안에서의 전쟁 중에
  - 가나안의 전쟁 때
  lexicon: 전쟁 배경 표지
  rationale: 전치사구를 과도하게 풀지 않고, 사건이 전쟁 상황 안에서 일어났음을 간결하게 반영했습니다.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  english_pob_choice: beside the feet of their fathers
  chosen_korean: 그들의 조상들의 발곁에
  alternatives_korean:
  - 그들의 조상들의 발 옆에
  - 그들의 조상들의 발치에
  lexicon: 상징적 묘지 위치
  rationale: 영어 POB 주석처럼 문자적 표현을 유지하되, 한국어에서는 ‘발곁’으로 옮겨 매장 위치의 문학적·상징적 뉘앙스를 살렸습니다.
- source_word: ἀνήγαγον τὰ ὀστᾶ
  english_pob_choice: brought up the bones
  chosen_korean: 뼈를 옮겨 와서
  alternatives_korean:
  - 뼈를 가져와서
  - 뼈를 끌어올려서
  lexicon: 유골 운반
  rationale: ‘올리다/가져오다’의 이동 의미를 살리면서 한국어에서 자연스럽고 장례 맥락에 맞는 표현으로 정리했습니다.
theological_decisions:
- issue: ‘몰래’와 전쟁 배경의 결합
  chosen_reading: 그들은 전쟁 중에 은밀히 조상들의 유골을 옮겼다는 서술로 읽었습니다.
  alternative_readings:
  - 단순한 비밀 이장
  - 전쟁과 무관한 은밀한 운반
  rationale: 원문의 ἐν κρυφῇ와 전쟁 배경을 함께 살려, 행위의 은밀성과 당시 상황의 위험성을 모두 반영했습니다.
  doctrine_reference: 서사적 정황 보존
- issue: ‘발곁’의 직역 유지
  chosen_reading: 묘지의 정확한 위치를 말하는 문자적 표현으로 남겨, 전통적 완곡화보다 원문의 낯선 이미지를 보존했습니다.
  alternative_readings:
  - ‘무덤 곁에’로 완화
  - ‘발치에’로 일반화
  rationale: 영어 POB의 각주 취지와 같이, 이 표현이 단순한 발밑이 아니라 조상 무덤 근처의 장례 배치를 가리킬 수 있음을 드러내기 위해 직역을 유지했습니다.
  doctrine_reference: 문학적 직역과 주석 보존
