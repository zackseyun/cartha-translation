  - severity: medium
    issue: ‘restore’의 회복 의미가 약화됨
    rationale: ‘바로잡아 주십시오’는 교정 행위에 치우칠 수 있습니다. 원문의 배척하지 말고 연약하고 잘못한 지체로 회복시키라는 목회적 대조를 ‘회복시켜 주십시오’가 더 잘 보존합니다.
  - severity: medium
    issue: 교회들을 가리키는 한정 표현의 범위가 바뀜
    rationale: ‘그때 하나님을 알던 모든 교회’는 영어 증언의 ‘all those churches which alone at that time knew God’를 모든 교회에 대한 포괄 진술처럼 만들 수 있습니다. ‘그 당시 하나님을 알았던 그 교회들에서만’으로 한정성을 보존합니다.
