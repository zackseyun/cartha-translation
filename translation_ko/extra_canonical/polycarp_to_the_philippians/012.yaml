  english_witness: 'I was exceedingly grieved for Valens, who aforetime was a presbyter among you, because he is so ignorant of the office which was given unto him. I warn you therefore that ye refrain from covetousness, and that ye be pure and truthful. Refrain from all evil.


    But he who cannot govern himself in these things, how doth he enjoin this upon another? If a man refrain not from covetousness, he shall be defiled by idolatry, and shall be judged as one of the Gentiles who know not the judgment of the Lord, Nay, know we not, that the saints shall judge the world, as Paul teacheth?


    But I have not found any such thing in you, neither have heard thereof, among whom the blessed Paul labored, who were his letters in the beginning. For he boasteth of you in all those churches which alone at that time knew God; for we knew Him not as yet.


    Therefore I am exceedingly grieved for him and for his wife, unto whom may the Lord grant true repentance. Be ye therefore yourselves also sober herein, and hold not such as enemies but restore them as frail and erring members, that ye may save the whole body of you. For so doing, ye do edify one another.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: ko
  text: '11


    나는 전에 여러분 가운데서 장로로 섬겼던 발렌스가 자신에게 맡겨진 직분을 그토록 깨닫지 못하는 것을 보고 그 때문에 몹시 슬퍼했습니다. 그러므로 여러분에게 권고합니다. 탐욕을 멀리하고, 순결하며 진실하십시오. 모든 악을 멀리하십시오.


    그러나 이런 일에서 자기 자신도 다스리지 못하는 사람이 어떻게 다른 사람에게 그렇게 하라고 명할 수 있겠습니까? 누구든지 탐욕을 멀리하지 않으면 우상 숭배로 더럽혀질 것이며, 주님의 심판을 알지 못하는 이방인들 가운데 하나로 심판받을 것입니다. 아니, 바울이 가르친 대로 성도들이 세상을 심판하리라는 것을 우리가 알지 못합니까?


    그러나 나는 여러분 가운데서 그런 일을 찾아보지도 못했고 들어 보지도 못했습니다. 복된 바울께서 여러분 가운데서 수고하셨고, 여러분은 처음부터 그의 편지들이었습니다.[a] 그분은 그때 하나님을 알던 모든 교회에서 여러분을 자랑하셨습니다. 그때에는 그 교회들만 하나님을 알았고, 우리는 아직 그분을 알지 못했습니다.[b]


    그러므로 나는 그와 그의 아내 때문에 몹시 슬퍼합니다. 주님께서 그들에게 참된 회개를 허락해 주시기를 바랍니다. 여러분 자신도 이 일에 정신을 차리십시오. 그런 사람들을 원수로 여기지 말고, 연약하여 빗나간 지체들로서 바로잡아 주십시오. 그리하여 여러분의 온몸을 구하십시오. 그렇게 함으로써 여러분은 서로를 세워 줍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “여러분은 처음부터 그의 편지들이었습니다”라는 표현은 전승된 본문의 독특한 비유를 그대로 살린 것입니다. 빌립보 신자들의 삶이 바울의 사역을 드러내는 ‘편지’였다는 뜻으로 이해할 수 있습니다.
    reason: 문장 자체가 이례적이어서 오역으로 보이지 않도록 설명하되, 비유를 본문에서 제거하지 않기 위해서입니다.
  - marker: b
    text: 이 문장의 정확한 구문과 범위는 전승 및 번역상 불확실합니다. 여기서는 ‘그때 하나님을 알던 교회들’과 ‘아직 하나님을 알지 못했던 우리’를 대조하는 흐름을 따랐습니다.
    reason: 제공된 영어 증언의 모호한 관계절 구조를 단정적으로 해소하지 않고 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: presbyter
  choice: 장로
  rationale: 초기 교회의 직분을 가리키는 통상적인 현대 한국어 표현을 사용했습니다.
- source_word: covetousness
  choice: 탐욕
  rationale: 재물에 대한 부당한 욕심이라는 문맥을 간결하고 폭넓게 전달합니다.
- source_word: restore
  choice: 바로잡아 주십시오
  rationale: 잘못한 지체를 배척하지 않고 회복시키라는 뜻을 자연스럽게 나타내며, 교회적 절차를 과도하게 구체화하지 않습니다.
- source_word: edify
  choice: 세워 줍니다
  rationale: 공동체의 영적·도덕적 성장을 뜻하는 건축 비유를 보존했습니다.
theological_decisions:
- issue: 성도들이 세상을 심판한다는 진술
  choice: 성도들이 세상을 심판하리라는 것을
  alternative: 성도들이 세상을 판단하리라는 것을
  rationale: 고린도전서 6:2의 반향과 종말론적 법정 의미를 살리되 별도의 해석을 덧붙이지 않았습니다.
- issue: 탐욕과 우상 숭배의 관계
  choice: 우상 숭배로 더럽혀질 것이며
  alternative: 우상 숭배자로 더럽혀질 것이며
  rationale: 탐욕이 우상 숭배와 연결된다는 원문의 긴장을 보존하고, 사람의 신분으로 단정하는 해석은 피했습니다.
- issue: 온몸을 구한다는 표현
  choice: 여러분의 온몸을 구하십시오
  alternative: 여러분의 공동체 전체를 온전하게 지키십시오
  rationale: 지체와 몸의 비유 및 ‘구하다’라는 강한 표현을 해설적으로 약화하지 않고 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 권면은 단호하되 목회적 회복의 어조를 유지했습니다. 제공 자료가 공공 영역 영어 번역 증언에 기초하고 직접적인 그리스어·라틴어 원문 검토가 보류된 상태이므로, 특히 3단락의 난해한 구문은 잠정적으로 번역하고 각주로 불확실성을 밝혔습니다.
