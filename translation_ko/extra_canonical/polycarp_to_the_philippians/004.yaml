base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: ko
  text: '형제자매 여러분, 내가 의에 관하여 이런 것들을 여러분에게 쓰는 것은 스스로 이 일을 맡았기 때문이 아니라 여러분이 내게 요청했기 때문입니다.


    나뿐 아니라 나와 같은 어느 누구도 복되고 영광스러운 바울의 지혜를 따를 수 없습니다. 그는 여러분 가운데 갔을 때 당시 사람들과 얼굴을 마주하고 진리에 관한 말씀을 주의 깊고 확실하게 가르쳤으며, 떠나 있을 때에도 여러분에게 편지를 썼습니다. 여러분이 그 편지를 부지런히 살펴보면, 여러분에게 주어진 믿음 안에서 든든히 세워질 수 있을 것입니다.


    이 믿음은 우리 모두의 어머니이며, 소망이 그 뒤를 따르고 사랑이 그 앞서 갑니다. 곧 하나님과 그리스도를 향한 사랑과 우리 이웃을 향한 사랑입니다. 누구든지 이 일들에 힘쓰면 의의 계명을 이루는 것입니다. 사랑을 지닌 사람은 모든 죄에서 멀리 떨어져 있기 때문입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 고대 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 그리스어 및 라틴어 사본 전통에 대한 직접 대조가 아직 필요합니다.
    reason: 제공 자료가 원어 본문 자체가 아니라 공용 영어 증언이며 원어 검토가 미완료임을 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: brethren
  choice: 형제자매 여러분
  rationale: 고대 공동체 전체를 향한 호칭의 포괄적 기능을 현대 표준 한국어로 자연스럽게 전달했습니다.
- source_word: righteousness
  choice: 의
  rationale: 윤리적 올바름과 하나님 앞에서의 의로움을 함께 열어 두는 전통적이고 폭넓은 표현입니다.
- source_word: word concerning truth
  choice: 진리에 관한 말씀
  rationale: ‘말씀’의 종교적 문맥을 살리면서도 진리와의 관계를 원문 증거대로 명시했습니다.
- source_word: be built up unto the faith given to you
  choice: 여러분에게 주어진 믿음 안에서 든든히 세워질
  rationale: 건축 은유를 보존하되 한국어에서 자연스럽게 읽히도록 ‘든든히’를 보충했습니다.
- source_word: mother of us all
  choice: 우리 모두의 어머니
  rationale: 믿음을 어머니로 부르는 대담한 은유를 해소하지 않고 그대로 보존했습니다.
- source_word: occupied with these
  choice: 이 일들에 힘쓰면
  rationale: 단순한 관심이 아니라 지속적인 실천과 전념을 나타내도록 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 믿음·소망·사랑의 관계
  choice: 믿음은 어머니이고 소망은 뒤를 따르며 사랑은 앞서 간다는 순서와 비유를 그대로 유지했습니다.
  alternative: 세 덕목의 우열이나 구원론적 체계로 풀어서 번역할 수 있습니다.
  rationale: 본문의 독특한 수사와 잠재적 신학적 긴장을 번역자가 해소하지 않기 위해서입니다.
- issue: ‘의의 계명’을 이룬다는 표현
  choice: ‘의의 계명을 이루는 것입니다’로 직결성을 유지했습니다.
  alternative: ‘의롭게 살라는 계명을 지킨 것입니다’로 의미를 명시할 수 있습니다.
  rationale: 의가 계명을 수식하는지, 계명의 내용이나 성격을 나타내는지에 관한 여지를 보존했습니다.
- issue: 사랑과 죄의 관계
  choice: ‘모든 죄에서 멀리 떨어져 있다’는 강한 진술을 유지했습니다.
  alternative: ‘죄를 멀리한다’로 행위적·권면적 의미를 완화할 수 있습니다.
  rationale: 사랑을 지닌 사람의 상태에 관한 원문의 긴장감 있는 단언을 교리적으로 완화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 초기 그리스도교 서신의 품위와 권면조를 유지하되, ‘~하노라’ 같은 고어체는 피했습니다. 바울과 수신 공동체의 역사적 관계, 믿음·소망·사랑의 은유적 배열은 설명적으로 평탄화하지 않았습니다.
