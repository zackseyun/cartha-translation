  witness_license: Public domain witness
  english_witness: 'I exhort you all therefore to be obedient unto the word of righteousness and to practice all endurance, which also ye saw with your own eyes in the blessed Ignatius and Zosimus and Rufus, yea and in others also who came from among yourselves, as well as in Paul himself and the rest of the Apostles;


    being persuaded that all these ran not in vain but in faith and righteousness, and that they are in their due place in the presence of the Lord, with whom also they suffered. For they loved not the present world, but Him that died for our sakes and was raised by God for us.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: ko
  text: '9 그러므로 나는 여러분 모두에게 의의 말씀에 순종하고 온갖 인내를 실천하라고 권면합니다. 여러분은 복된 이그나티우스와 조시무스와 루푸스에게서, 또 여러분 가운데서 나온 다른 이들에게서, 그리고 바울 자신과 나머지 사도들에게서도 그러한 인내를 직접 보았습니다.


    여러분은 이들이 모두 헛되이 달린 것이 아니라 믿음과 의 안에서 달렸으며, 주님 곁에서 그들에게 합당한 자리에 있음을 확신하고 있습니다. 그들은 또한 주님과 함께 고난을 받았습니다. 이는 그들이 현세를 사랑한 것이 아니라, 우리를 위하여 죽으시고 하나님께서 우리를 위하여 다시 살리신 그분을 사랑했기 때문입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: word of righteousness
  choice: 의의 말씀
  rationale: 초기 그리스도교 문헌의 성경적 울림을 보존하면서 ‘의를 가르치는 말씀’으로 의미를 좁히지 않았습니다.
- source_word: practice all endurance
  choice: 온갖 인내를 실천하십시오
  rationale: 인내를 단순한 태도가 아니라 지속적으로 행해야 할 덕목으로 제시하는 권면의 힘을 살렸습니다.
- source_word: ran not in vain
  choice: 헛되이 달린 것이 아니라
  rationale: 바울 서신을 연상시키는 경주 은유를 풀어 쓰지 않고 그대로 보존했습니다.
- source_word: present world
  choice: 현세
  rationale: 현재의 세상 질서와 시대를 가리키는 뜻을 간결하고 자연스럽게 전달합니다.
- source_word: was raised by God
  choice: 하나님께서 … 살리신
  rationale: 수동문의 행위자가 하나님임을 분명히 보존하고, 부활을 뜻하는 자연스러운 한국어 표현을 사용했습니다.
theological_decisions:
- issue: ‘with whom also they suffered’에서 관계대명사의 선행사
  choice: 그들은 주님과 함께 고난을 받았습니다
  alternative: 그들은 그분을 위해 고난을 받았습니다 / 그들이 함께 고난받은 이들과 주님 앞에 있습니다
  rationale: 제공된 영어 증언의 문법을 따라 ‘주님과 함께’로 옮기되, 원문 전승 검토 전에는 해석의 불확실성이 있으므로 각주로 밝혔습니다.
- issue: 순교자들이 ‘주님 앞에서 마땅한 자리’에 있다는 진술
  choice: 이제 주님 앞에서 마땅한 자리에 있다는 것
  alternative: 주님 곁의 그들에게 합당한 처소에 있다는 것
  rationale: 사후 상태를 특정 교리 체계로 구체화하지 않고, 증언이 말하는 확신만 보존했습니다.
- issue: 그리스도를 지칭하는 표현
  choice: 우리를 위하여 죽으셨으며 하나님께서 우리를 위하여 살리신 분
  alternative: 우리를 위해 죽고 하나님에 의해 일으켜진 이
  rationale: 그리스도의 죽음과 하나님의 부활 행위를 모두 명시하면서도 원문에 없는 칭호를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 교부 문헌에 어울리는 품위를 유지하되 고어투는 피했습니다. 인명은 통용되는 음역을 적용했고, ‘의의 말씀’, ‘헛되이 달리다’ 같은 성경적 표현과 은유는 보존했습니다. 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 그리스어·라틴어 원문 전승의 직접 대조가 필요합니다.
