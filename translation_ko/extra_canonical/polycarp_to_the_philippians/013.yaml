base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/013.yaml
  text: 'For I am convinced that you are well trained in the sacred writings, and nothing is hidden from you. But this has not been granted to me. Only, as it is said in these Scriptures, “Be angry and do not sin,” and, “Do not let the sun set on your wrath.” Blessed is the one who remembers this; and I trust that this is in you.


    Now may the God and Father of our Lord Jesus Christ, and the eternal High Priest himself, the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long-suffering and in patient endurance and in purity; and may he grant you a lot and portion among his saints, and to us with you, and to all who are under heaven, who will believe in our Lord and God Jesus Christ and in his Father who raised him from the dead.


    Pray for all the saints. Pray also for kings and powers and princes, and for those who persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all people, that you may be perfect in him.'
translation:
  language: ko
  text: '나는 여러분이 성스러운 문서들을 잘 익혔고, 아무것도 여러분에게 감추어져 있지 않다고 확신합니다. 그러나 나에게는 이것이 허락되지 않았습니다. 다만 이 문서들에 기록된 대로, “화를 내더라도 죄를 짓지 마십시오.” 또 “해가 질 때까지 노여움을 품고 있지 마십시오.” 이 말씀을 기억하는 사람은 복이 있습니다. 나는 여러분 가운데 이러한 마음이 있다고 믿습니다.


    이제 우리 주 예수 그리스도의 하나님 아버지와, 영원한 대제사장이신 바로 그분, 곧 [하나님의 아들 예수 그리스도께서[a] 여러분을 믿음과 진리 안에서 굳게 세워 주시고, 온유함과 분노를 멀리함과 관용과 오래 참음과 끈기 있는 인내와 순결을 온전히 갖추게 해 주시기를 빕니다. 또한 그분께서 자신의 성도들 가운데서 받을 몫과 유업을 여러분에게 주시고, 여러분과 함께 우리에게도 주시며, 하늘 아래에서 우리 주님이시며 하나님이신 예수 그리스도와 그분을 죽은 사람들 가운데서 일으키신 그분의 아버지를 믿게 될 모든 사람에게도 주시기를 빕니다.


    모든 성도를 위하여 기도하십시오. 왕들과 권세자들과 통치자들을 위해서도 기도하고, 여러분을 박해하고 미워하는 사람들과 십자가의 원수들을 위해서도 기도하십시오. 그리하여 여러분의 열매가 모든 사람 가운데 분명히 드러나고, 여러분이 그분 안에서 온전해지기를 바랍니다.


    [a] 전승된 본문은 이 지점에서 불완전하거나 복원된 흔적이 있어, 여는 대괄호를 그대로 표시했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 본문은 이 지점에서 불완전하거나 복원된 흔적이 있어, 여는 대괄호를 그대로 표시했습니다.
    reason: 영어 증언에 보존된 여는 대괄호가 필사본 손상 또는 편집적 복원을 나타내므로 이를 독자에게 알립니다.
lexical_decisions:
- source_word: sacred writings / scriptures
  choice: 성스러운 문서들 / 이 문서들
  rationale: 초기 그리스도교 문헌의 문맥에서 가리키는 기록들의 권위를 살리되, 문서와 성경이라는 두 영어 표현의 차이를 과도하게 신학적으로 확정하지 않았습니다.
- source_word: wrath
  choice: 노여움 / 분노
  rationale: 인용문에서는 자연스러운 성경 어법인 ‘노여움’을, 덕목 목록에서는 분노를 피한다는 뜻이 분명한 ‘분노를 멀리함’을 사용했습니다.
- source_word: lot and portion
  choice: 몫과 유업
  rationale: 배정받는 몫이라는 표현과 성도들 가운데 누리는 종말론적 상속의 함의를 함께 보존했습니다.
- source_word: long-suffering / patient endurance
  choice: 오래 참음 / 끈기 있는 인내
  rationale: 서로 가까운 두 덕목을 하나로 합치지 않고, 장기간 참는 태도와 시련 속에서 버티는 인내를 구별했습니다.
- source_word: perfect
  choice: 온전해지다
  rationale: 도덕적 무결점으로 좁혀 읽기보다 성숙과 완성의 폭을 보존하는 표현을 택했습니다.
theological_decisions:
- issue: ‘our Lord and God Jesus Christ’의 호칭 관계
  choice: 우리 주님이시며 하나님이신 예수 그리스도
  alternative: 우리 주 예수 그리스도의 하나님
  rationale: 제공된 문장의 병렬 구조상 ‘주님’과 ‘하나님’이 모두 예수 그리스도를 수식하는 읽기를 반영했으며, 이어지는 ‘그분의 아버지’와도 구별했습니다.
- issue: 기도문의 주어와 대명사 지시
  choice: 예수 그리스도를 ‘그분’으로 받아 동사들을 연결
  alternative: 하나님 아버지와 예수 그리스도를 복합 주어로 처리
  rationale: ‘영원한 대제사장이신 바로 그분’이라는 단수 강조와 이어지는 단수 대명사를 존중했습니다. 다만 전승 상태 때문에 구문상 긴장은 남아 있습니다.
- issue: ‘who shall believe’의 시간적 의미
  choice: 믿게 될
  alternative: 믿는
  rationale: 제공된 증언의 미래적 표현을 보존하여 현재의 신자들로만 범위를 제한하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 권면과 축복 기도의 장중함을 유지했습니다. 직접 그리스어·라틴어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언에 근거한 잠정 번역입니다.
