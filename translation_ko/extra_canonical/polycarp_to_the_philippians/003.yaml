base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: ko
  text: '그러므로 여러분은 허리를 동여매고, 헛되고 공허한 말과 많은 이들의 잘못을 버리며 두려움과 진실함으로 하나님을 섬기십시오. 여러분은 우리 주 예수 그리스도를 죽은 사람들 가운데서 일으키시고 그분에게 영광과 자기 오른편의 보좌를 주신 분을 믿었습니다. 하늘과 땅에 있는 모든 것이 그리스도께 복종하게 되었고, 숨 쉬는 모든 피조물이 그분을 섬깁니다. 그분은 산 사람과 죽은 사람을 심판하러 오십니다. 하나님께서는 그분에게 순종하지 않는 자들에게서 그분의 피에 대한 책임을 물으실 것입니다.[a]


    그리스도를 죽은 사람들 가운데서 일으키신 분은 우리도 일으키실 것입니다. 우리가 그분의 뜻을 행하고, 그분의 계명 안에서 살아가며, 그분이 사랑하신 것들을 사랑한다면 말입니다. 그러므로 모든 불의와 탐욕과 돈을 사랑하는 마음과 험담과 거짓 증언을 멀리하고, 악을 악으로, 모욕을 모욕으로, 폭행을 폭행으로, 저주를 저주로 갚지 마십시오.


    오히려 주님께서 가르치실 때 하신 말씀을 기억하십시오. “심판하지 마십시오. 그러면 여러분도 심판받지 않을 것입니다. 용서하십시오. 그러면 여러분도 용서받을 것입니다. 자비를 베푸십시오. 그러면 여러분도 자비를 받을 것입니다. 여러분이 재는 그 잣대로 여러분에게도 다시 재어 줄 것입니다.” 또 이렇게 말씀하셨습니다. “가난한 사람들과 의를 위하여 박해받는 사람들은 복이 있습니다. 하나님의 나라가 그들의 것이기 때문입니다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “하나님께서는 그분에게 순종하지 않는 자들에게서 그분의 피를 요구하실 것입니다”입니다. 여기서 ‘그분’은 문맥상 그리스도를 가리키지만, ‘피를 요구하다’가 뜻하는 구체적인 심판의 방식은 명시되어 있지 않습니다.
    reason: 대명사의 지시 대상과 ‘피를 요구하다’라는 법적·심판적 표현의 난해성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 이 문구는 익숙한 마태복음의 표현과 달리 ‘마음이 가난한 사람들’이 아니라 ‘가난한 사람들’, ‘하늘나라’가 아니라 ‘하나님의 나라’라고 전해집니다.
    reason: 정경 복음서의 병행문과 무심코 조화하지 않고 폴리카르포스가 전한 문구의 차이를 보존하기 위해서입니다.
lexical_decisions:
- source_word: ἀναζωσάμενοι τὰς ὀσφύας (as reflected in the witness, “gird up your loins”)
  choice: 허리를 동여매고
  rationale: 행동을 준비하라는 뜻을 지닌 고대의 신체 비유를 평면화하지 않고, 현대 한국어에서도 이해 가능한 형태로 보존했습니다.
- source_word: φόβῳ καὶ ἀληθείᾳ (as reflected in the witness, “in fear and truth”)
  choice: 두려움과 진실함으로
  rationale: ‘두려움’을 단순히 ‘경외’로 해석해 좁히지 않고 원문의 긴장감을 보존했으며, ‘truth’는 섬김의 태도를 자연스럽게 나타내도록 ‘진실함’으로 옮겼습니다.
- source_word: τὴν τῶν πολλῶν πλάνην (as reflected in the witness, “the error of the many”)
  choice: 많은 이들의 잘못
  rationale: 다수의 그릇된 상태나 길을 가리키는 표현을 특정 이단이나 교리로 한정하지 않았습니다.
- source_word: ἐντολαῖς αὐτοῦ πορευώμεθα (as reflected in the witness, “walk in his commandments”)
  choice: 그분의 계명 안에서 살아가며
  rationale: ‘걷다’라는 셈어적·성서적 생활 비유의 의미를 현대 한국어 독자가 자연스럽게 이해하도록 삶의 방식으로 표현했습니다.
- source_word: φιλαργυρία
  choice: 돈을 사랑하는 마음
  rationale: 단순한 소유가 아니라 돈에 대한 애착을 뜻하므로 ‘탐욕’과 구별하면서도 일상적으로 이해되게 옮겼습니다.
- source_word: πτωχοί (as reflected in the witness, “the poor”)
  choice: 가난한 사람들
  rationale: ‘마음이 가난한’이라는 정경 본문의 확장 표현을 본문에 끌어오지 않고, 전승된 문구 자체를 따랐습니다.
theological_decisions:
- issue: 부활 약속에 붙은 조건절
  choice: ‘우리가 … 한다면’이라는 조건을 그대로 유지했습니다.
  alternative: 조건절을 약화하여 선행을 부활의 결과나 증거로만 풀이할 수 있습니다.
  rationale: 본문은 ‘그분의 뜻을 행하고… 사랑한다면’이라는 실제 조건 구문을 제시하므로, 특정 구원론에 맞추어 그 긴장을 해소하지 않았습니다.
- issue: ‘그분의 피’를 요구하신다는 문장의 의미
  choice: 하나님께서 불순종하는 자들에게서 그리스도의 피에 대한 책임을 물으신다고 번역했습니다.
  alternative: 하나님께서 그들을 그리스도의 피로 심판하시거나 그들의 피를 요구하신다고 해석할 수 있습니다.
  rationale: 대명사가 가리키는 가장 가까운 대상은 그리스도이지만, 표현의 구체적 심판 방식은 불분명하므로 ‘책임을 묻다’로 자연스럽게 옮기고 각주에서 직역을 밝혔습니다.
- issue: 주님의 말씀과 정경 복음서의 문구 차이
  choice: 제공된 전승의 ‘가난한 사람들’과 ‘하나님의 나라’를 그대로 보존했습니다.
  alternative: 마태복음과 조화하여 ‘마음이 가난한 사람들’ 및 ‘하늘나라’로 옮길 수 있습니다.
  rationale: 폴리카르포스가 인용하거나 회상한 형태를 정경 본문의 익숙한 문구로 조화시키지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면은 공손하지만 단호한 복수 명령형으로 옮겼고, 성서적 이미지와 초기 그리스도교 문헌의 장중함은 유지하되 고어투는 피했습니다. 제공 자료가 공공영역 영어 증언이며 직접적인 그리스어·라틴어 대조가 아직 보류 중이라는 한계를 고려하여, 원문 전승이 비교적 분명하게 반영된 표현은 보존하고 불확실한 해석은 각주와 결정 사항에 명시했습니다.
