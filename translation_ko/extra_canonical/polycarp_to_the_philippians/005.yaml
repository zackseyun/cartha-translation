base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: ko
  text: '그러나 돈을 사랑하는 것은 온갖 고난의 시작입니다. 그러므로 우리는 세상에 아무것도 가지고 오지 않았고 아무것도 가지고 나갈 수 없다는 것을 알고, 의의 갑옷으로 무장합시다. 먼저 우리 자신이 주님의 계명에 따라 살아가도록 가르치고,


    그런 다음에는 우리의 아내들도 그들에게 주어진 믿음과 사랑과 순결 안에서 살아가도록 가르칩시다. 아내들은 온전히 진실하게 자기 남편을 아끼고, 온전히 절제하며 모든 사람을 차별 없이 사랑하고, 자녀들이 하나님을 경외하도록 훈련해야 합니다.


    우리 가운데 과부들은 주님을 믿는 일에 맑은 정신을 지니고, 모든 사람을 위하여 끊임없이 간구해야 합니다. 온갖 비방과 험담과 거짓 증언과 돈을 사랑하는 마음과 모든 악을 멀리해야 합니다. 그들은 자신들이 하나님의 제단이라는 것과, 모든 제물이 흠이 없는지 세밀히 살펴진다는 것을 알아야 합니다. 그들의 생각이나 의도나 마음속에 감추어진 어떤 것도 하나님께 숨겨지지 않습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 증언을 바탕으로 하되 확인 가능한 그리스어 어휘를 참조한 잠정 번역입니다. 그리스어와 라틴어 사본 전통에 대한 전면적인 대조 검토가 남아 있습니다.
    reason: 제공 자료 자체가 원어 전승에 대한 직접 검토가 아직 이루어지지 않았다고 밝히므로, 본문의 잠정적 성격을 독자에게 투명하게 알립니다.
lexical_decisions:
- source_word: 'φιλαργυρία (영어 증언: love of money)'
  choice: 돈을 사랑하는 것 / 돈을 사랑하는 마음
  rationale: 단순히 돈을 소유하는 것이 아니라 돈에 집착하고 탐하는 태도를 가리키도록 자연스럽게 옮겼습니다.
- source_word: 'πανοπλία τῆς δικαιοσύνης (영어 증언: armor of righteousness)'
  choice: 의의 갑옷
  rationale: 군사적 비유를 보존하면서도 현대 독자가 이해하기 쉬운 전통적 표현을 사용했습니다.
- source_word: ἐγκράτεια (영어 증언은 chastity로 반영)
  choice: 절제
  rationale: 앞서 ‘순결’이 별도로 언급되므로 중복을 피하고, 이 말의 넓은 뜻인 자기 통제와 절제를 살렸습니다.
- source_word: 'θυσιαστήριον θεοῦ (영어 증언: God’s altar)'
  choice: 하나님의 제단
  rationale: 과부들의 중보 기도를 제단의 봉헌 행위에 비유하는 강한 원문 이미지를 그대로 보존했습니다.
- source_word: 'μωμοσκοπεῖται (영어 증언: are carefully inspected)'
  choice: 흠이 없는지 세밀히 살펴진다
  rationale: 제물이 흠 없는지 검사한다는 제의적 함의를 드러내어 앞의 ‘제단’ 비유와 연결했습니다.
theological_decisions:
- issue: ‘하나님의 제단’이라는 과부들에 대한 비유
  choice: 비유를 완화하지 않고 직역에 가깝게 보존했습니다.
  alternative: ‘하나님께 기도를 드리는 사람들’처럼 뜻을 풀어 쓸 수 있습니다.
  rationale: 원문의 제의적 이미지와 과부들의 중보 역할 사이의 신학적 긴장을 독자가 직접 접하도록 하기 위해서입니다.
- issue: 하나님께 숨겨지지 않는 내면의 범위
  choice: ‘생각이나 의도나 마음속에 감추어진 어떤 것도’로 병렬 구조를 유지했습니다.
  alternative: ‘마음속 모든 것’으로 압축할 수 있습니다.
  rationale: 생각, 의도, 마음의 비밀을 구별하여 열거하는 원문의 강조를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면의 반복은 ‘합시다’와 ‘해야 합니다’로 자연스럽게 구분했으며, 고대의 가정·과부 관련 표현은 삭제하거나 현대적 관념으로 재구성하지 않고 문맥에 맞게 명료화했습니다.
