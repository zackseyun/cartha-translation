review_pass:
  verdict: revise
  source_fidelity: 핵심 논지와 문단 구성, 집사·장로·처녀 등의 직분/집단 명칭, 종말의 약속과 조건적 권면은 대체로 충실합니다. 다만 πνεῦμα는 제공된 영어의 대문자 표기만으로 ‘성령’으로 확정할 수 없고, 원문의 무표지 표현이 지닌 여지를 살려 ‘영’으로 옮기는 편이 안전합니다. 또한 ‘그분의 의로우심’보다 δικαιοσύνη에 대응하는 ‘그분의 의 앞에서’가 더 직접적이며, 성적 범주 가운데 μαλακοί는 ‘여성스럽게 처신하는’이라는 행동 묘사로 좁히지 않는 편이 낫습니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽습니다. 그러나 ‘하나님은 업신여김을 받지 않으신다’와 ‘사람의 집사’는 현대 한국어에서 다소 어색합니다. 각각 ‘하나님은 조롱당하지 않으심’과 ‘사람들의 집사가 아니라’로 다듬으면 자연스럽고 원문의 강조도 유지됩니다.
  terminology: ‘집사’, ‘장로’, ‘계명’, ‘하나님의 나라’, ‘상속받다’는 적절합니다. 주님에게 쓰인 διάκονος의 말놀이도 본문과 주석으로 유지할 수 있습니다. ‘영’은 원문의 대소문자로 판별되지 않는 πνεῦμα의 모호성을 보존하며, μαλακοί와 ἀρσενοκοῖται는 현대 정체성 용어로 환원하지 않는 제한적 주석이 필요합니다.
  issues:
  - severity: medium
    issue: πνεῦμα를 본문에서 ‘성령’으로 확정함
    rationale: 그리스어 사본에는 현대식 대소문자 구별이 없으며, 이 문맥의 πνεῦμα가 성령을 뜻하는지 인간의 영을 뜻하는지는 번역문만으로 확정할 수 없습니다. ‘영’으로 두고 주석에서 가능성을 밝혀야 합니다.
  - severity: low
    issue: ‘그분의 의로우심 앞에’
    rationale: 영어 witness의 ‘His righteousness’ 및 그 배후의 δικαιοσύνη에는 ‘의’가 직접 대응합니다. ‘의로우심’은 추상 명사를 성품 진술로 약간 바꿉니다.
  - severity: medium
    issue: μαλακοί를 ‘여성스럽게 처신하는 남자들’로 해석함
    rationale: 이 표현은 고대 용어의 범위를 특정한 현대 한국어 행동 묘사로 좁힙니다. 원어의 문자적 성별화는 보존하되, 의미 범위가 논쟁적인 용어임을 주석에서 밝혀야 합니다.
  - severity: low
    issue: ‘업신여김을 받지 않으신다’ 및 ‘사람의 집사’의 어색한 결합
    rationale: 뜻은 전달되지만 현대 표준어로는 ‘조롱당하지 않으심’과 ‘사람들의 집사가 아니라’가 더 자연스럽습니다.
  revised_text: '그러므로 하나님은 조롱당하지 않으심을 알고 있으므로, 우리는 그분의 계명과 영광에 합당하게 살아가야 합니다.


    이와 같이 집사들도 사람들의 집사가 아니라 하나님과 그리스도의 집사로서, 그분의 의 앞에 흠이 없어야 합니다. 그들은 헐뜯는 자가 아니며, 한 입으로 두말하지 않고, 돈을 사랑하지 않으며, 모든 일에 절제하고, 자비로우며, 부지런하고, 모든 이를 섬기는 이, 곧 집사가 되신 주님의 진리를 따라 살아가야 합니다.[a] 우리가 이 현세에서 그분을 기쁘시게 해 드리면, 그분께서 우리를 죽은 이들 가운데서 일으키시겠다고 약속하신 대로 오는 세상도 받을 것입니다. 또 우리가 그분께 합당하게 살아가면 그분과 함께 다스릴 것입니다. 참으로 우리가 믿는다면 말입니다.[b]


