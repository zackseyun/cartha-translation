    In like manner deacons should be blameless in the presence of His righteousness, as deacons of God and Christ and not of men; not calumniators, not double-tongued, not lovers of money, temperate in all things, compassionate, diligent, walking according to the truth of the Lord who became a minister (deacon) of all. For if we be well pleasing unto Him in this present world, we shall receive the future world also, according as He promised us to raise us from the dead, and that if we conduct ourselves worthily of Him we shall also reign with Him, if indeed we have faith.


    In like manner also the younger men must be blameless in all things, caring for purity before everything and curbing themselves from every evil. For it is a good thing to refrain from lusts in the world, for every lust warreth against the Spirit, and neither whoremongers nor effeminate persons nor defilers of themselves with men shall inherit the kingdom of God, neither they that do untoward things. Wherefore it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk in a blameless and pure conscience.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: ko
  text: '그러므로 하나님은 업신여김을 받지 않으신다는 것을 알고 있으니, 우리는 그분의 계명과 영광에 합당하게 살아가야 합니다.


    이와 같이 집사들도 사람의 집사가 아니라 하나님과 그리스도의 집사로서, 그분의 의로우심 앞에 흠이 없어야 합니다. 헐뜯지 말고, 한 입으로 두말하지 말며, 돈을 사랑하지 말고, 모든 일에 절제하며, 긍휼히 여기고, 부지런하며, 모든 이의 종 곧 집사가 되신 주님의 진리를 따라 살아가야 합니다.[a] 우리가 이 현세에서 그분을 기쁘시게 해 드리면, 그분이 약속하신 대로 우리를 죽은 이들 가운데서 일으키실 것이며, 오는 세상도 받을 것입니다. 또 우리가 그분께 합당하게 처신하면 그분과 함께 다스릴 것입니다. 참으로 우리가 믿는다면 말입니다.[b]


    이와 같이 젊은 남자들도 모든 일에 흠이 없어야 하며, 무엇보다 순결을 소중히 여기고 모든 악을 멀리하도록 자신을 절제해야 합니다. 세상에 있는 욕망들을 멀리하는 것은 좋은 일입니다. 모든 욕망은 성령을 거슬러 싸우기 때문입니다.[c] 음행하는 자들이나, 여성스럽게 처신하는 남자들이나, 남자들과 더불어 자신을 더럽히는 자들은 하나님의 나라를 상속받지 못하며, 그릇된 일을 하는 자들도 마찬가지입니다.[d] 그러므로 이 모든 일을 멀리하고, 하나님과 그리스도께 하듯 장로들과 집사들에게 복종하는 것이 마땅합니다.[e] 처녀들은 흠 없고 순결한 양심으로 살아가야 합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘종’과 ‘집사’는 고대 교회 문맥에서 같은 계열의 말로 연결됩니다. 이 표현은 모든 이를 섬기신 주님과 교회의 집사 직분을 의도적으로 겹쳐 들려줍니다.
    reason: 원문의 servant/deacon 말놀이를 한국어 본문만으로 완전히 재현하기 어렵습니다.
  - marker: b
    text: ‘그분’이 하나님을 가리키는지 그리스도를 가리키는지는 이 대명사들만으로는 모든 곳에서 확정하기 어렵습니다.
    reason: 신학적으로 중요한 대명사 지시의 실제 모호성을 보존합니다.
  - marker: c
    text: 여기서는 ‘성령’으로 옮겼으나, 직접적인 그리스어·라틴어 본문 검토 전에는 ‘영’이라는 번역 가능성도 남아 있습니다.
    reason: 제공 자료가 영어 증언이며 원어 검토가 아직 이루어지지 않았음을 투명하게 밝힙니다.
  - marker: d
    text: 이 세 표현은 고대의 도덕적·성적 범주를 반영합니다. 각각의 정확한 범위와 서로의 관계는 논쟁의 여지가 있으며, 현대의 성적 지향이나 성정체성 범주와 그대로 같다고 단정해서는 안 됩니다.
    reason: 논쟁적인 성적 용어를 과도하게 현대화하거나 교리적으로 단정하지 않습니다.
  - marker: e
    text: ‘하나님과 그리스도께 하듯’은 복종의 태도를 비교하는 표현이며, 장로와 집사를 하나님 또는 그리스도와 동일시한다는 뜻으로 풀어 쓰지 않았습니다.
    reason: 강한 권위 표현을 보존하면서 가능한 오독을 방지합니다.
lexical_decisions:
- source_word: walk / walking
  choice: 살아가다
  rationale: 셈어적·성경적 행위 은유를 현대 한국어에서 자연스럽게 전달하면서 지속적인 삶의 방식을 나타냅니다.
- source_word: deacons / minister (deacon)
  choice: 집사 / 종 곧 집사
  rationale: 교회 직분인 ‘집사’를 유지하고, 주님께 적용된 동일 어근의 ‘섬기는 이’와 ‘집사’ 사이의 말놀이를 드러냅니다.
- source_word: double-tongued
  choice: 한 입으로 두말하다
  rationale: 서로 다른 말을 하거나 진실하지 못한 태도를 뜻하는 관용적 의미를 평이하게 표현합니다.
- source_word: presbyters
  choice: 장로들
  rationale: 초기 교회의 직분을 가리키는 통상적인 한국어 용어를 사용합니다.
- source_word: virgins
  choice: 처녀들
  rationale: 문맥상 공동체 안의 미혼·동정 여성 집단을 지칭하는 전통적 의미를 직접 보존합니다.
- source_word: effeminate persons
  choice: 여성스럽게 처신하는 남자들
  rationale: 제공된 영어 증언의 성별화된 표현을 완곡하게 지우지 않되, 특정 현대 성정체성 범주로 단정하지 않습니다.
theological_decisions:
- issue: ‘His’가 가리키는 대상
  choice: 문맥에 따라 ‘그분’을 유지
  alternative: 각 경우를 ‘하나님’ 또는 ‘그리스도’로 명시
  rationale: 제공된 증언에서 대명사의 지시 대상이 일부 모호하므로 이를 임의로 해소하지 않았습니다.
- issue: 미래 세계의 수령, 부활, 공동 통치의 관계
  choice: 약속과 조건의 연결을 유지
  alternative: 구원론적 체계에 맞추어 문장을 재배열
  rationale: 원문의 권면적 조건문과 종말론적 긴장을 교리적으로 평준화하지 않았습니다.
- issue: 욕망이 싸우는 대상인 ‘Spirit’
  choice: ‘성령’
  alternative: ‘영’ 또는 인간의 ‘영’
  rationale: 대문자 표기를 따른 유력한 이해를 본문에 채택하되, 직접 원어 검토 전의 불확실성을 각주에 밝혔습니다.
- issue: 성적 행위를 나타내는 세 범주
  choice: 서로 구분하여 직역에 가깝게 보존
  alternative: 모두 ‘성적으로 부도덕한 자들’로 포괄
  rationale: 고대 표현의 중첩과 불편함을 삭제하거나 현대의 정체성 범주와 동일시하지 않고 증언의 구분을 유지했습니다.
- issue: 장로와 집사에게 ‘하나님과 그리스도께 하듯’ 복종
  choice: 비교 표현을 그대로 유지
  alternative: ‘하나님과 그리스도의 대표자이므로’로 설명
  rationale: 본문의 강한 비교를 보존하되, 직분자와 하나님을 존재론적으로 동일시하는 해석은 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 일반 독자가 이해할 수 있도록 ‘행하다’보다 ‘살아가다’, ‘비방자’보다 ‘헐뜯다’ 같은 자연스러운 표현을 택하면서도 ‘계명’, ‘의로우심’, ‘현세’, ‘상속받다’, ‘장로’, ‘집사’ 등 초기 기독교 문헌의 핵심 어휘는 유지했습니다. 제공 자료 자체가 원어 검토 대기 상태이므로 이 초안은 영어 공개 증언과 POB 감수층을 대조한 잠정 원문 지향 번역입니다.
