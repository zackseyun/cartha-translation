base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: ko
  text: '폴리카르포스가 빌립보인들에게 보낸 편지 1장


    나는 우리 주 예수 그리스도 안에서 여러분과 함께 크게 기뻐했습니다. 여러분이 참된 사랑의 본보기들[a]을 맞아들이고, 여러분에게 마땅한 대로 그들의 길을 배웅해 주었기 때문입니다. 그들은 거룩함에 어울리는 사슬에 둘러싸인 사람들입니다. 그 사슬은 하나님과 우리 주께 참으로 선택받은 이들의 면류관입니다.[b]


    또한 예로부터 널리 알려진 여러분의 믿음의 굳건한 뿌리가 지금까지 그대로 있어 우리 주 예수 그리스도를 향해 열매를 맺고 있기 때문입니다. 그분은 우리 죄 때문에 죽음에 이르기까지 견디셨으나, 하나님께서 음부의 고통을 풀어 그분을 일으키셨습니다.[c]


    여러분은 그분을 보지 못했으나 말로 다 할 수 없고 영광스러운 기쁨으로 그분을 믿습니다. 많은 사람이 그 기쁨에 들어가기를 바랍니다. 여러분은 행위에서 난 것이 아니라 은혜로 구원받았으며, 하나님의 뜻으로 예수 그리스도를 통하여 구원받았음을 알고 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘본보기들’은 ‘모방한 이들’ 또는 ‘참된 사랑을 구현한 이들’로도 이해할 수 있습니다. 문맥상 사슬에 매인 방문자들을 가리킵니다.
    reason: 원어 μιμήματα가 지닌 의미 범위와 지시 대상의 여지를 보존하기 위해서입니다.
  - marker: b
    text: 여기서 사슬은 투옥의 표지인 동시에, 하나님과 주께 선택받은 이들이 받는 영예로운 면류관에 비유됩니다.
    reason: ‘사슬’과 ‘면류관’의 역설적인 비유를 현대 독자가 분명히 이해하도록 돕기 위해서입니다.
  - marker: c
    text: ‘음부’는 죽은 자들의 영역을 가리킵니다. 이 문장은 사도행전 2:24의 표현을 반영합니다.
    reason: ᾅδης를 ‘지옥’으로 좁혀 번역하지 않았음을 밝히고 성경적 상호본문성을 알리기 위해서입니다.
lexical_decisions:
- source_word: τὰ μιμήματα τῆς ἀληθοῦς ἀγάπης
  choice: 참된 사랑의 본보기들
  rationale: μιμήματα는 문자적으로 ‘모방물들, 본보기들, 구현들’을 뜻합니다. 문맥상 사슬에 매인 방문자들을 가리키므로, 영어 증언의 ‘followers’보다 원어의 의미를 살리되 누구를 모방한다는 해석은 확정하지 않았습니다.
- source_word: τοῖς ἁγιοπρεπέσιν δεσμοῖς
  choice: 거룩한 이들에게 어울리는 사슬
  rationale: ἁγιοπρεπής의 ‘거룩함에 합당한/거룩한 이에게 어울리는’ 뜻을 자연스럽게 드러내면서 투옥의 실제 사슬이라는 이미지를 보존했습니다.
- source_word: διαδήματα
  choice: 면류관
  rationale: 왕권이나 영예를 나타내는 관을 뜻하며, 순교를 향한 고난의 사슬을 영예로 보는 비유를 보존했습니다.
- source_word: τὰς ὠδῖνας τοῦ ᾅδου
  choice: 음부의 고통
  rationale: ᾅδης를 최종 심판의 장소로 단정하는 ‘지옥’ 대신 죽은 자들의 영역을 가리키는 ‘음부’로 옮겼고, ὠδῖνες의 고통이라는 의미를 유지했습니다.
- source_word: χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ
  choice: 말로 다 할 수 없고 영광스러운 기쁨
  rationale: 베드로전서 1:8을 반영하는 표현으로, 불가능한 직역투를 피하면서 두 수식어를 모두 보존했습니다.
theological_decisions:
- issue: ‘하나님과 우리 주께 선택받은’의 관계
  choice: 하나님과 우리 주께 참으로 선택받은
  alternative: 하나님이신 우리 주께 참으로 선택받은
  rationale: 원문의 ὑπὸ θεοῦ καὶ τοῦ κυρίου ἡμῶν은 ‘하나님’과 ‘우리 주’를 문법적으로 구별해 읽을 수 있으므로, 둘을 동일 인물로 단정하지 않고 원문의 결합 구조를 보존했습니다.
- issue: 구원에서 은혜, 행위, 하나님의 뜻의 관계
  choice: 행위에서가 아니라 은혜로… 하나님의 뜻에 따라 예수 그리스도를 통하여
  alternative: 행위로 구원받은 것이 아니라 하나님의 뜻으로 말미암아 예수 그리스도를 통해 은혜로 구원받았다
  rationale: 원문의 대조와 수단 표현을 보존하고 특정 교파의 구원론적 체계를 덧붙이지 않았습니다.
- issue: 음부의 고통을 푼 행위의 목적어
  choice: 하나님께서 음부의 고통을 풀어 그분을 일으키셨습니다
  alternative: 하나님께서 그분을 일으키시고 음부의 고통에서 풀어 주셨습니다
  rationale: 원문은 하나님이 ‘음부의 고통’을 푸셨다고 직접 말합니다. 예수께서 고통에서 풀려났다는 식으로 목적어를 바꾸지 않고 사도행전 2:24과 상응하는 표현을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 서신의 장중함은 유지하되 긴 원문 문장을 여러 문장으로 나누어 일반 독자가 이해하기 쉽게 했습니다. 신학적 전문어는 필요한 범위에서만 사용했으며, ‘음부’, ‘은혜’, ‘행위’, ‘면류관’처럼 초기 그리스도교 문맥에 중요한 용어는 보존했습니다. 제공 자료에는 직접 원어 검토가 보류되었다고 되어 있으나, 현존 그리스어 본문의 핵심 어휘와 통사에 대조하여 초안을 작성했으며 라틴 전승의 상세한 이문 검토는 추가로 필요합니다.
