  naturalness: 합쇼체와 전반적 문장은 자연스럽습니다. 다만 ‘우리 주님이시며 하나님이신 분의 눈앞’은 다소 우회적이므로 ‘우리의 주님이시며 하나님이신 분 앞에’가 더 자연스럽습니다. ‘병든 사람들을 모두 찾아보며’보다 ‘병든 이들을 모두 찾아가 돌보며’가 방문과 돌봄을 더 분명히 합니다.
  terminology: ‘장로들’, ‘그리스도의 심판대’, ‘거짓 형제들’, ‘주님의 이름을 지닌 자들’은 적절합니다. ‘온갖 분노’는 all anger를 잘 옮기지만, ‘돈을 사랑하는 모든 마음’은 어색하므로 ‘온갖 돈 사랑’으로 고칩니다. disputed/압축 표현인 ‘debtors of sin’은 ‘죄의 빚진 자들’로 유지하고 각주에서 의미를 확정하지 않습니다.
