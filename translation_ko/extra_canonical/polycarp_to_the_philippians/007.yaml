    그러므로 그분 자신께서 명령하신 대로, 또 우리에게 복음을 전한 사도들과 우리 주님의 오심을 미리 선포한 예언자들이 전한 대로, 두려움과 온전한 경외심으로 그분을 섬깁시다. 선한 것에 열심을 내고, 실족하게 하는 것들과 거짓 형제들과 위선으로 주님의 이름을 지닌 자들을 멀리합시다. 그들은 어리석은 사람들을 미혹합니다.'
