id: POLY.007
reference: Polycarp to the Philippians — PolPhil. 6
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'And the presbyters also must be compassionate, merciful towards all men, turning back the sheep that are gone astray, visiting all the infirm, not neglecting a widow or an orphan or a poor man: but providing always for that which is honorable in the sight of God and of men, abstaining from all anger, respect of persons, unrighteous judgment, being far from all love of money, not quick to believe anything against any man, not hasty in judgment, knowing that we all are debtors of sin.


    If then we entreat the Lord that He would forgive us, we also ought to forgive: for we are before the eyes of our Lord and God, and we must all stand at the judgment-seat of Christ, and each man must give an account of himself.


    Let us therefore so serve Him with fear and all reverence, as He himself gave commandment and the Apostles who preached the Gospel to us and the prophets who proclaimed beforehand the coming of our Lord; being zealous as touching that which is good, abstaining from offenses and from the false brethren and from them that bear the name of the Lord in hypocrisy, who lead foolish men astray.'
