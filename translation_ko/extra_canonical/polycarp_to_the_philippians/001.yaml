  text: 'Polycarp and the elders who are with him, to the church of God residing in Philippi: May mercy and peace from God Almighty and Jesus Christ our Savior be multiplied to you.'
translation:
  language: ko
  text: 폴리카르포스와 그와 함께 있는 장로들은 빌립보에 나그네로 머무는 하나님의 교회에 문안합니다. 전능하신 하나님과 우리 구주 예수 그리스도에게서 오는 긍휼과 평화가 여러분에게 더욱 풍성해지기를 바랍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Polycarp
  choice: 폴리카르포스
  rationale: 고대 인명의 그리스어 형태를 반영하는 한국어 음역을 사용했습니다.
- source_word: presbyters
  choice: 장로들
  rationale: 초기 교회의 직분 또는 지도자 집단을 가리키는 통상적인 한국어 성서 용어를 선택했습니다.
- source_word: sojourneth
  choice: 나그네로 머무는
  rationale: 단순히 ‘거주하는’보다 임시 체류와 이방인적 정체성을 함께 함축하는 표현을 보존했습니다.
- source_word: mercy
  choice: 긍휼
  rationale: 신적 자비를 나타내는 교회 문헌의 장중한 문맥에 맞추되 현대 독자에게도 익숙한 성서 어휘를 사용했습니다.
- source_word: peace
  choice: 평화
  rationale: 개인의 내적 평안에 한정되지 않는 공동체적·관계적 의미를 드러내기 위해 ‘평화’를 선택했습니다.
- source_word: be multiplied
  choice: 더욱 풍성해지기를 바랍니다
  rationale: 인사말의 기원 형식을 자연스러운 현대 한국어 합쇼체로 옮기면서 증가의 의미를 유지했습니다.
theological_decisions:
- issue: 긍휼과 평화의 근원 및 하나님과 예수 그리스도의 관계
  choice: 전능하신 하나님과 우리 구주 예수 그리스도에게서 오는
  alternative: 전능하신 하나님과 우리 구주이신 예수 그리스도에게서 오는
  rationale: 영어 증언이 ‘God Almighty and Jesus Christ our Savior’를 병렬적으로 제시하므로, ‘우리 구주’가 예수 그리스도를 수식한다는 문법 관계를 보존하면서 두 분을 임의로 동일시하거나 분리하는 해설을 덧붙이지 않았습니다.
- issue: 교회의 체류 정체성
  choice: 빌립보에 나그네로 머무는 하나님의 교회
  alternative: 빌립보에 거주하는 하나님의 교회
  rationale: ‘sojourneth’가 지닌 임시 체류 및 순례자적 뉘앙스를 살리되, 그 의미를 특정 교리 체계로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 장중한 합쇼체를 사용했습니다. 서두의 발신자·수신자 구조를 명료하게 하기 위해 ‘문안합니다’를 보충했으며, 고대 서신 인사말의 품위를 유지했습니다. 다만 직접적인 그리스어·라틴어 원문 검토가 아직 이루어지지 않았으므로, 제공된 공용 영어 증언에 근거한 잠정 번역입니다.
