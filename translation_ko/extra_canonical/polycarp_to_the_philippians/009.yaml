source:
  text: 'Let us therefore without ceasing hold fast by our hope and by the earnest of our righteousness, which is Jesus Christ who took up our sins in His own body upon the tree, who did no sin, neither was guile found in His mouth, but for our sakes He endured all things, that we might live in Him.


    Let us therefore become imitators of His endurance; and if we should suffer for His name''s sake, let us glorify Him. For He gave this example to us in His own person, and we believed this.'
  text_scope: public_domain_english_witness
  manuscript: Greek and Latin manuscript tradition
  ancient_language: Greek/Latin (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.x.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Let us therefore without ceasing hold fast by our hope and by the earnest of our righteousness, which is Jesus Christ who took up our sins in His own body upon the tree, who did no sin, neither was guile found in His mouth, but for our sakes He endured all things, that we might live in Him.


    Let us therefore become imitators of His endurance; and if we should suffer for His name''s sake, let us glorify Him. For He gave this example to us in His own person, and we believed this.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: ko
  text: '그러므로 우리는 우리의 소망과 우리 의의 보증이신 예수 그리스도를 끊임없이 굳게 붙잡읍시다. 그분은 친히 자신의 몸으로 나무 위에서 우리의 죄를 짊어지셨습니다. 그분은 죄를 짓지 않으셨고, 그 입에서는 속임수도 발견되지 않았습니다. 그러나 우리가 그분 안에서 살게 하시려고 우리를 위하여 모든 것을 견디셨습니다.


    그러므로 우리도 그분의 인내를 본받읍시다. 우리가 그분의 이름 때문에 고난을 받는다면, 그분께 영광을 돌립시다. 그분이 몸소 우리에게 이러한 본을 보이셨고, 우리는 이것을 믿었습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: earnest
  choice: 보증
  rationale: ‘earnest’는 약속의 확실성을 보장하는 담보나 첫 몫을 뜻합니다. 문맥상 자연스럽고 이해하기 쉬운 ‘보증’을 선택했습니다.
- source_word: tree
  choice: 나무
  rationale: 벧전 2:24의 성경적 표현을 반영하여 ‘십자가’로 명시하지 않고 원문의 환유적 표현인 ‘나무’를 보존했습니다.
- source_word: endurance
  choice: 인내
  rationale: 고난을 견디어 내는 지속성과 태도를 함께 나타내는 자연스러운 한국어 표현입니다.
- source_word: guile
  choice: 속임수
  rationale: 거짓이나 기만이 없었다는 뜻을 현대 독자가 쉽게 이해하도록 옮겼습니다.
theological_decisions:
- issue: ‘the earnest of our righteousness’에서 의와 그리스도의 관계
  choice: 우리 의의 보증이신 예수 그리스도
  alternative: 우리의 의를 보증하는 첫 몫이신 예수 그리스도
  rationale: 그리스도 자신이 ‘보증’이라는 문법적 관계를 유지하면서도, ‘의’가 칭의인지 도덕적 의인지 단정하지 않아 원문의 신학적 여지를 보존했습니다.
- issue: ‘that we might live in Him’의 의미
  choice: 우리가 그분 안에서 살게 하시려고
  alternative: 우리가 그분으로 말미암아 살게 하시려고
  rationale: ‘그분 안에서’라는 결합과 참여의 표현을 그대로 살리고, 단지 수단이나 원인으로 환원하지 않았습니다.
- issue: ‘let us glorify Him’의 대상
  choice: 그분께 영광을 돌립시다
  alternative: 그 이름을 영화롭게 합시다
  rationale: 제공된 증언의 대명사 목적어를 따라 고난 가운데 그리스도께 영광을 돌린다는 뜻으로 옮겼습니다.
- issue: 마지막 ‘we believed this’의 지시 대상
  choice: 우리는 이것을 믿었습니다
  alternative: 우리는 그분을 믿었습니다
  rationale: 증언이 보존한 ‘this’의 모호성을 해소하지 않고, 앞서 제시된 그리스도의 본과 가르침을 가리킬 수 있도록 유지했습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용했습니다. 공동체에 권면하는 1인칭 복수 명령을 ‘붙듭시다’, ‘본받읍시다’, ‘영광을 돌립시다’로 일관되게 표현했으며, 성경 인용을 연상시키는 문장은 장중하되 일반 독자가 이해할 수 있도록 다듬었습니다. 직접적인 그리스어·라틴어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언과 감수된 영어 POB를 바탕으로 한 잠정 번역입니다.
