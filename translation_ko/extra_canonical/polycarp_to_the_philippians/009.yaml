  - severity: low
    issue: ‘나무에 달려 자신의 몸으로’의 어순
    rationale: 원문의 ‘in his own body upon the tree’는 자신의 몸으로 죄를 담당한 사건의 장소를 함께 나타냅니다. ‘자신의 몸으로 나무 위에서’로 배열하면 수식 관계가 더 분명합니다.
