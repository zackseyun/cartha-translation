  terminology: ‘육체로 오셨음’, ‘적그리스도’, ‘십자가의 증언’, ‘주님의 말씀’, ‘사탄의 맏아들’은 원문의 강한 표현과 의미 폭을 적절히 보존합니다. ‘영’은 본문에서 해설적으로 한정하지 않는 것이 타당합니다.
