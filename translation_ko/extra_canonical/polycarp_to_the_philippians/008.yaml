id: POLY.008
reference: Polycarp to the Philippians — PolPhil. 7
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'For every one who shall not confess that Jesus Christ is come in the flesh, is antichrist: and whosoever shall not confess the testimony of the Cross, is of the devil; and whosoever shall pervert the oracles of the Lord to his own lusts and say that there is neither resurrection nor judgment, that man is the firstborn of Satan.


    Wherefore let us forsake the vain doing of the many and their false teachings, and turn unto the word which was delivered unto us from the beginning, being sober unto prayer and constant in fastings, entreating the all-seeing God with supplications that He bring us not into temptation, according as the Lord said, The Spirit is indeed willing, but the flesh is weak.'
  text_scope: public_domain_english_witness
  manuscript: Greek and Latin manuscript tradition
  ancient_language: Greek/Latin (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.x.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'For every one who shall not confess that Jesus Christ is come in the flesh, is antichrist: and whosoever shall not confess the testimony of the Cross, is of the devil; and whosoever shall pervert the oracles of the Lord to his own lusts and say that there is neither resurrection nor judgment, that man is the firstborn of Satan.


    Wherefore let us forsake the vain doing of the many and their false teachings, and turn unto the word which was delivered unto us from the beginning, being sober unto prayer and constant in fastings, entreating the all-seeing God with supplications that He bring us not into temptation, according as the Lord said, The Spirit is indeed willing, but the flesh is weak.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: ko
  text: '7


    예수 그리스도께서 육체로 오셨음을 고백하지 않는 사람은 누구나 적그리스도입니다. 십자가의 증언을 고백하지 않는 사람은 마귀에게 속한 사람입니다. 또 주님의 말씀을 자기 욕망에 맞게 왜곡하여 부활도 심판도 없다고 말하는 사람은 사탄의 맏아들입니다.


    그러므로 우리는 많은 사람의 헛된 행실과 그들의 거짓 가르침을 버리고, 처음부터 우리에게 전해진 말씀으로 돌아갑시다. 기도할 때 정신을 차리고 금식을 꾸준히 하며, 모든 것을 보시는 하나님께 우리가 시험에 빠지지 않게 해 달라고 간구합시다. 주님께서 “영은 참으로 원하지만 육신은 약합니다”[a]라고 말씀하신 것과 같습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영’은 여기서 사람의 내적 영을 가리키는 것으로 이해할 수 있으나, 표현 자체는 그 대상을 더 구체적으로 한정하지 않습니다.
    reason: 신학적으로 중요한 지시 대상의 모호성을 본문에서 임의로 해소하지 않기 위해서입니다.
lexical_decisions:
- source_word: is antichrist
  choice: 적그리스도입니다
  rationale: 칭호를 완곡하게 풀지 않고 원문의 단정적인 서술을 보존했습니다.
- source_word: the testimony of the Cross
  choice: 십자가의 증언
  rationale: ‘십자가에 관한 증언’과 ‘십자가가 증언하는 바’ 사이의 가능한 의미 폭을 성급히 한정하지 않았습니다.
- source_word: the oracles of the Lord
  choice: 주님의 말씀
  rationale: 현대 독자가 자연스럽게 이해하도록 옮기되, 주님에게서 나온 권위 있는 말씀이라는 뜻을 유지했습니다.
- source_word: the firstborn of Satan
  choice: 사탄의 맏아들
  rationale: 강렬한 친족 비유를 ‘추종자’ 등으로 약화하지 않고 그대로 살렸습니다.
- source_word: being sober unto prayer
  choice: 기도할 때 정신을 차리고
  rationale: 술 취하지 않는다는 문자적 인상보다 기도 가운데 깨어 있고 절제하는 태도를 자연스럽게 전달했습니다.
- source_word: constant in fastings
  choice: 금식을 꾸준히 하며
  rationale: 복수형이 나타내는 반복적·지속적 실천을 한국어로 분명히 표현했습니다.
theological_decisions:
- issue: ‘육체로 오셨음’의 표현
  choice: 육체로 오셨음을
  alternative: 사람의 몸으로 오셨음을
  rationale: 성육신에 관한 원문의 전통적이고 신학적으로 긴장된 표현을 해설적으로 축소하지 않았습니다.
- issue: ‘마귀에게 속함’의 관계 표현
  choice: 마귀에게 속한 사람
  alternative: 마귀에게서 난 사람 / 마귀의 사람
  rationale: ‘is of the devil’이 나타내는 소속·기원·성격의 폭을 고려하여, 현대 한국어에서 자연스러우면서도 기원을 과도하게 확정하지 않는 표현을 택했습니다.
- issue: 주기도문의 시험 간구
  choice: 우리가 시험에 빠지지 않게 해 달라고
  alternative: 우리를 시험으로 이끌지 말아 달라고
  rationale: 하나님이 유혹의 직접 행위자라는 뜻으로 불필요하게 오해되지 않도록 자연스럽게 옮겼으나, 시험을 피하게 해 달라는 간구는 보존했습니다.
- issue: ‘영’의 지시 대상
  choice: 영
  alternative: 마음
  rationale: 인간의 내적 영을 가리킬 가능성이 크지만 성령으로 읽힐 여지도 문법적으로 완전히 제거하지 않기 위해 ‘마음’으로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 권면은 공동체적 ‘-합시다’로, 교리적 단언은 ‘-입니다’로 옮겼습니다. 제공 자료에는 그리스어·라틴어 전승에 대한 직접 검토가 아직 이루어지지 않았다고 명시되어 있으므로, 이번 초안은 제공된 공용 영문 증언과 감사용 영어 POB를 대조해 작성한 잠정 출판 초안입니다. 원어 전승을 직접 대조할 때 어휘와 구문을 재검토해야 합니다.
