id: POLY.011
reference: Polycarp to the Philippians — PolPhil. 10
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'Stand fast therefore in these things and follow the example of the Lord, being firm in the faith and immovable, in love of the brotherhood kindly affectioned one to another, partners with the truth, forestalling one another in the gentleness of the Lord, despising no man.


    When ye are able to do good, defer it not, for Pitifulness delivereth from death. Be ye all subject one to another, having your conversation unblamable among the gentiles, that your good works both ye may receive praise and the Lord may not be blasphemed in you.


    But woe to him through whom the name of the Lord be blasphemed. Therefore teach all men soberness, in which ye yourselves also walk.'
  text_scope: public_domain_english_witness
  manuscript: Greek and Latin manuscript tradition
  ancient_language: Greek/Latin (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.x.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Stand fast therefore in these things and follow the example of the Lord, being firm in the faith and immovable, in love of the brotherhood kindly affectioned one to another, partners with the truth, forestalling one another in the gentleness of the Lord, despising no man.


    When ye are able to do good, defer it not, for Pitifulness delivereth from death. Be ye all subject one to another, having your conversation unblamable among the gentiles, that your good works both ye may receive praise and the Lord may not be blasphemed in you.


    But woe to him through whom the name of the Lord be blasphemed. Therefore teach all men soberness, in which ye yourselves also walk.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: ko
  text: '그러므로 여러분은 이러한 일들에 굳게 서서 주님의 본을 따르십시오. 믿음 안에서 굳세고 흔들리지 않으며, 형제자매 사랑으로 서로에게 다정한 마음을 품고, 진리와 한마음이 되며, 주님의 온유함으로 서로를 먼저 대하고, 아무도 업신여기지 마십시오.



    선을 행할 수 있을 때에는 미루지 마십시오. 구제는 죽음에서 건져 냅니다.[a] 여러분은 모두 서로에게 복종하고, 이방 사람들 가운데서 흠잡을 데 없이 살아가십시오. 그리하여 여러분도 선한 행실로 말미암아 칭찬을 받고, 여러분으로 말미암아 주님이 모독을 받지 않게 하십시오.[b]



    그러나 주님의 이름이 그로 말미암아 모독을 받게 하는 사람에게는 화가 있습니다. 그러므로 모든 사람에게 절제를 가르치십시오. 여러분 자신도 그렇게 살아가십시오.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구제’는 단순한 연민의 감정보다 가난하거나 어려운 이들을 돕기 위해 베푸는 자선·구제의 실천을 가리킵니다.
    reason: 핵심 명사의 구체적인 실천적 의미를 밝혀 주기 위해서입니다.
  - marker: b
    text: 직역하면 ‘주님이 여러분 안에서 모독을 받지 않게’입니다. 여기서는 공동체의 행실을 통해 주님의 이름이 모독받지 않게 하라는 문맥적 뜻으로 옮겼습니다.
    reason: 원문의 관계 표현과 자연스러운 한국어 번역의 관계를 투명하게 밝히기 위해서입니다.
  - marker: c
    text: ‘절제’는 술을 삼가는 것에만 한정되지 않으며, 자제력과 분별력을 지닌 건전한 삶의 태도를 포함합니다.
    reason: 현대 한국어에서 이 말이 지나치게 좁게 이해되지 않도록 하기 위해서입니다.
lexical_decisions:
- source_word: follow the example of the Lord
  choice: 주님의 본을 따르십시오
  rationale: ‘example’의 모범적 의미를 자연스럽고 존엄한 한국어로 옮겼습니다.
- source_word: love of the brotherhood
  choice: 형제자매를 사랑하여
  rationale: 공동체 전체를 가리키는 표현이므로 남성만을 지칭하는 것으로 오해되지 않게 하면서 가족적 공동체 의미를 살렸습니다.
- source_word: partners with the truth
  choice: 진리와 동행하며
  rationale: 진리와 적극적으로 연대하고 그에 따라 사는 뜻을 자연스럽게 나타냅니다.
- source_word: forestalling one another in the gentleness of the Lord
  choice: 서로 앞장서서 주님의 온유함을 보이고
  rationale: ‘forestalling’의 고어적 의미를 상대보다 먼저 실천한다는 권면으로 옮기되 경쟁적 뉘앙스는 피했습니다.
- source_word: Pitifulness
  choice: 자비를 베푸는 일
  rationale: 단순한 감정적 연민보다 실제적인 긍휼과 구제 행위를 포괄하도록 번역했습니다. 다만 직접 원문 대조가 아직 이루어지지 않은 점을 각주에 밝혔습니다.
- source_word: conversation
  choice: 살아가십시오 / 선한 행실
  rationale: 고어 영어에서 ‘conversation’은 말이 아니라 생활 방식과 행실을 뜻하므로 문맥에 맞게 옮겼습니다.
- source_word: soberness
  choice: 절제 있는 삶
  rationale: 술 취하지 않음에만 한정하지 않고 분별력, 자제, 건전한 생활 태도를 포함하는 윤리적 의미를 전달합니다.
theological_decisions:
- issue: ‘자비를 베푸는 일은 죽음에서 건져 낸다’는 문장의 구원론적 함의
  choice: 본문의 강한 인과 표현을 그대로 보존
  alternative: 자비가 위험이나 심판을 피하게 ‘도와준다’고 완화
  rationale: 본문이 가진 신학적 긴장과 지혜문학적 어조를 번역자가 해소하지 않도록 ‘건져 내다’를 유지했습니다.
- issue: ‘the Lord may not be blasphemed in you’의 관계 표현
  choice: 여러분 때문에 주님이 모독을 받지 않게
  alternative: 여러분 안에서 주님이 모독을 받지 않게
  rationale: 문맥상 공동체의 행실이 외부인의 모독을 초래하지 않아야 한다는 뜻을 자연스럽게 드러냈습니다. 다만 관계 표현의 직역 가능성은 각주에 남겼습니다.
- issue: ‘all people’에게 절제를 가르치라는 범위
  choice: 모든 사람에게
  alternative: 공동체의 모든 사람에게
  rationale: 제공된 증거가 범위를 제한하지 않으므로 보편 표현을 그대로 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 공손한 합쇼체를 사용했습니다. 공동체를 향한 권면의 단호함을 유지하되 고어적 직역투는 피했습니다. 제공 자료가 공용 영어 번역 증거이며 직접적인 그리스어·라틴어 검토가 보류 중이므로, 확정하기 어려운 어휘는 각주에서 명시했습니다.
