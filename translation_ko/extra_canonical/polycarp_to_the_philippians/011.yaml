    issue: ‘Pitifulness’를 ‘자비를 베푸는 일’로 옮김
    rationale: 이 표현은 본문 및 유대 지혜문학의 관용에서 구제·자선, 곧 가난한 이에게 베푸는 실천을 특별히 가리킵니다. 일반적인 긍휼 행위로 넓히면 어휘의 구체성이 약해집니다.
  - severity: medium
    issue: ‘partners with the truth’를 ‘진리와 동행하며’로 옮김
    rationale: ‘동행’은 자연스럽지만 원문의 진리와 한마음으로 결속됨이라는 뜻을 충분히 드러내지 못합니다.
  - severity: low
    issue: 화 선언을 ‘모독을 받는다면’이라는 조건문으로 처리함
    rationale: 원문은 주님의 이름이 그 사람을 통해 모독받게 하는 자에게 화가 있다는 일반적 선언입니다. 조건 형식을 제거하는 편이 더 충실합니다.
  - severity: low
    issue: ‘여러분의 선한 행실이 칭찬을 받고’의 주어 처리
    rationale: 영어 증거의 뜻은 선한 행실로 말미암아 수신자들이 칭찬을 받는다는 것입니다. 이를 명시하면 의미가 더 정확해집니다.
