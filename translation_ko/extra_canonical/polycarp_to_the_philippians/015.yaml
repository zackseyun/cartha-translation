base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: ko
  text: 나는 이 글을 그레스게를 통해 여러분에게 씁니다. 나는 얼마 전에도 그를 여러분에게 부탁드렸고, 지금도 다시 부탁드립니다. 그는 우리와 함께 지내는 동안 흠 없이 처신했으며, 여러분과 함께 있을 때에도 그와 같으리라고 믿습니다. 그의 누이가 여러분에게 가거든, 그도 잘 맞아 주십시오. 여러분과 여러분에게 속한 모든 이가 은혜 가운데 주 예수 그리스도 안에서 평안하기를 빕니다. 아멘.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 현재 제공된 공용 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 그리스어와 라틴어 사본 전승에 대한 직접 대조는 아직 이루어지지 않았습니다.
    reason: 원자료 설명에 명시된 증거상의 한계를 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: by/through Crescens
  choice: 그레스게를 통해
  rationale: 서신을 전달하는 사람이라는 문맥을 자연스럽게 나타냈습니다. 이름은 한국어 성경에서 익숙한 표기인 ‘그레스게’를 사용했습니다.
- source_word: commended
  choice: 부탁드렸고 … 다시 부탁드립니다
  rationale: 단순한 칭찬이 아니라 공동체가 그를 받아들이고 돌보도록 맡기거나 천거하는 뜻을 살리되, 한국어에서 자연스러운 표현을 택했습니다.
- source_word: walked blamelessly with us
  choice: 우리와 함께 지내는 동안 흠 없이 처신했으며
  rationale: ‘걷다’라는 직역보다 삶과 행실을 가리키는 관용적 의미를 분명하고 자연스럽게 전달했습니다.
- source_word: his sister
  choice: 그의 누이
  rationale: 여성 친족을 가리키는 일차적 의미를 유지했습니다. 현 단계의 영어 증거만으로 신앙 공동체의 자매라는 뜻으로 바꾸지 않았습니다.
- source_word: Fare ye well … in grace
  choice: 은혜 가운데 … 평안하기를 빕니다
  rationale: 고대 서신의 작별 인사를 현대 한국어의 품위 있는 축원 형식으로 옮겼습니다.
theological_decisions:
- issue: ‘그의 누이’가 친누이인지 신앙 공동체의 여성 구성원인지 여부
  choice: 그의 누이
  alternative: 그 자매
  rationale: 제공된 증거는 소유 관계가 있는 ‘his sister’로 읽히므로 친족 의미를 우선 보존했습니다. 직접적인 그리스어·라틴어 대조가 이루어지기 전에는 교회적 호칭으로 단정하지 않았습니다.
- issue: ‘여러분과도 마찬가지’가 과거 행실인지 미래 행실인지 여부
  choice: 여러분과 함께 있을 때에도 그와 같으리라고 믿습니다
  alternative: 여러분과 함께 있을 때에도 그와 같았다고 믿습니다
  rationale: 영어 증거는 시간 관계를 완전히 명시하지 않지만, 전달자를 지금 천거하는 서신 문맥과 English POB의 미래 해석을 반영했습니다. 다만 원문 전승 검토 뒤 재확인이 필요합니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 서신의 정중하고 목회적인 어조를 유지하면서도 지나치게 고어적인 표현은 피했습니다. ‘잘 맞아 주십시오’는 천거받은 이를 환대하고 돌보라는 뜻을 일반 독자가 자연스럽게 이해하도록 한 표현입니다.
