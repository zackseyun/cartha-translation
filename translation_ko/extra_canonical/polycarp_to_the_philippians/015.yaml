    reason: 원자료 설명에 명시된 증거상의 한계를 독자에게 투명하게 알리기 위해서입니다.
  revision_rationale: 누이에 관한 문장을 원문의 수동적 추천·천거 의미와 여성 지시 대상에 맞게 바로잡았습니다. 앞의 두 차례와 뒤의 한 차례에 나오는 commended를 ‘추천하다’로 통일하여 의미 연결을 보존했습니다. ‘여러분과도 마찬가지로 그러하리라’는 제공된 English POB의 미래적 해석을 유지하되, 직접적인 그리스어·라틴어 대조가 아직 없다는 한계는 기존 각주로 보존했습니다.
