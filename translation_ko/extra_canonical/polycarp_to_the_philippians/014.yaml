  english_witness: 'Ye wrote to me, both ye yourselves and Ignatius, asking that if any one should go to Syria he might carry thither the letters from you. And this I will do, if I get a fit opportunity, either I myself, or he whom I shall send to be ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and others as many as we had by us, we send unto you, according as ye gave charge; the which are subjoined to this letter; from which ye will be able to gain great advantage. For they comprise faith and endurance and every kind of edification, which pertaineth unto our Lord. Moreover concerning Ignatius himself and those that were with him, if ye have any sure tidings, certify us.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/014.yaml
  text: 'You yourselves and Ignatius wrote to me, asking that if anyone should go to Syria, he might carry your letters there. And I will do this, if I get a suitable opportunity, either I myself or the one whom I shall send as an ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and as many others as we had with us, we send to you, according as you gave charge; they are attached to this letter. From them you will be able to gain great advantage, for they comprise faith and endurance and every kind of edification that pertain to our Lord. Moreover, concerning Ignatius himself and those who were with him, if you have any reliable news, let us know.'
translation:
  language: ko
  text: '13


    여러분과 이그나티우스는 내게 편지를 보내어, 누군가 시리아로 가게 되면 여러분의 편지들을 그곳으로 가져가게 해 달라고 부탁하였습니다. 적당한 기회가 생기면 내가 직접 가든지, 아니면 여러분을 위해서도 사절로 보낼 사람을 통하여 그렇게 하겠습니다.


    이그나티우스가 우리에게 보낸 그의 편지들과, 우리가 가지고 있던 다른 편지들을 여러분의 부탁대로 모두 보냅니다. 이 편지에 그것들을 덧붙였습니다. 여러분은 그 편지들에서 큰 유익을 얻을 수 있을 것입니다. 그 안에는 우리 주님과 관련된 믿음과 인내와 온갖 세움의 가르침이 담겨 있기 때문입니다.[a] 또한 이그나티우스 자신과 그와 함께 있던 사람들에 관하여 확실한 소식이 있으면 우리에게 알려 주십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 저작권 영어 증언에 근거한 잠정 번역입니다. 그리스어와 라틴어 사본 전통에 대한 직접 검토가 아직 이루어지지 않았으므로, ‘우리 주님과 관련된’이라는 구절의 정확한 수식 범위 등은 원문 검토 뒤 조정될 수 있습니다.
    reason: 직접적인 고대어 원문 검토가 보류된 상태임을 투명하게 밝히고, 문법적 모호성을 독단적으로 확정하지 않기 위해서입니다.
lexical_decisions:
- source_word: ambassador
  choice: 사절
  rationale: 공동체를 대표하여 파견되는 사람이라는 공적 의미를 살리면서도 현대 독자가 쉽게 이해할 수 있는 말입니다.
- source_word: endurance
  choice: 인내
  rationale: 고난이나 시련 가운데 굳게 견디는 초기 그리스도교의 덕목을 자연스럽고 전통적으로 전달합니다.
- source_word: edification
  choice: 세움의 가르침
  rationale: 단순한 지식 전달이 아니라 공동체와 신앙을 세우는 유익이라는 뜻을 드러내기 위해 풀어 옮겼습니다.
- source_word: sure tidings
  choice: 확실한 소식
  rationale: 소문의 반대인 신뢰할 만한 정보를 요청한다는 뜻을 간결하게 나타냅니다.
theological_decisions:
- issue: ‘which pertaineth unto our Lord’가 수식하는 범위
  choice: 믿음과 인내와 온갖 세움의 가르침 전체가 ‘우리 주님과 관련된’ 것으로 번역
  alternative: 마지막 항목인 ‘온갖 세움’만 우리 주님과 관련된 것으로 번역
  rationale: 제공된 증거만으로 문법적 수식 범위를 확정하기 어려우므로, 영어 증언의 자연스러운 포괄적 독법을 본문에 반영하되 각주에서 잠정성을 밝혔습니다.
- issue: ‘his letters’의 소유·작성 의미
  choice: 이그나티우스의 편지들
  alternative: 이그나티우스가 전달한 편지들
  rationale: 문맥상 이그나티우스가 작성한 편지 모음을 가리키는 것으로 이해하는 것이 가장 자연스럽지만, 전달 행위와 작성 주체를 과도하게 세분하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서신의 공적인 어조와 초기 그리스도교 문헌의 품위를 유지하되, ‘기별’, ‘덕을 세움’ 같은 낡거나 교파적으로 들릴 수 있는 표현은 피했습니다. 제공 자료가 공개 저작권 영어 증언이며 고대어 검토가 보류된 상태이므로, 확정적 원문 번역으로 가장하지 않았습니다.
