  naturalness: 합쇼체와 전반적 문체는 자연스럽습니다. 다만 ‘여러분을 위해서도 사절로 보낼 사람’은 ‘또한’의 연결이 다소 불분명하므로, ‘여러분을 대표하는 사절로 보낼 사람’을 쓰면 더 명료합니다. ‘온갖 세움의 가르침’도 현대 한국어에서 부자연스럽습니다.
  terminology: ‘사절’, ‘인내’, ‘확실한 소식’은 적절합니다. edification은 교파적 전문어를 피하면서 ‘덕을 세우는 모든 일’로 옮겨, 공동체적·윤리적 유익이라는 뜻을 보존했습니다. ‘우리 주님’은 유지했습니다.
