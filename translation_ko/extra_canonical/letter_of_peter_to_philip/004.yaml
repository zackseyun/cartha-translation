translation:
  language: ko
  text: '“이제 아이온들[a]의 [결핍]에 관하여 말하겠습니다. 그 결핍은 이러합니다. 어머니의 반항과 무분별함이 아버지의 위대하심의 질서를 벗어나 드러났을 때, 어머니는 아이온들을 세우고자 했습니다. 어머니가 말하자 전제자가 뒤따랐습니다. 그러나 어머니가 한 부분을 내버리자 전제자가 그것을 붙잡았고, 그것은 결핍이 되었습니다. 이것이 아이온들의 결핍입니다.


    “전제자는 한 부분을 차지한 뒤 그것을 심고, 그 위에 권능들과 권세들을 배치했으며, 그것을 죽을 운명의 아이온들 안에 가두었습니다. 모든 우주적 권능은 자신들이 생겨난 것을 몹시 기뻐했습니다. […][b] 그러나 그들은 선재하시는 [아버지]를 알지 못했습니다. 그분에게 낯선 자들이었기 때문입니다. [그 대신 이] 전제자에게 권력이 주어졌고, 그들은 그를 경배하며 찬양했습니다.


    “이제 권능들의 찬양 때문에 전제자의 마음은 교만해졌습니다. 그는 대적자가 되어, 한 형상을 [다른 형상으로] 바꾸고 한 모습을 다른 모습으로 바꾸고자 했습니다. 그는 자기 권위 아래 있는 권능들에게 죽을 몸들을 빚으라고 맡겼고, 그 몸들은 만들어진 닮은 형상의 불일치에서 생겨났습니다.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이온’은 이 문헌에서 초월적 존재, 영역 또는 질서를 가리키는 전문 용어입니다. 문맥상 한 가지 뜻으로만 확정하기 어려워 음역했습니다.
    reason: 핵심 우주론 용어의 다의성과 낯섦을 설명하기 위해서입니다.
  - marker: b
    text: 대괄호 속 말은 판독이 손상된 부분의 복원 표시이며, […]는 이 지점에 본문 공백이 있음을 나타냅니다.
    reason: 제공된 영어 증거가 보존한 사본 손상과 편집적 복원 신호를 독자에게 알리기 위해서입니다.
  - marker: c
    text: 이 번역은 제공된 공개 영역 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 콥트어 사본에 대한 직접 검토가 남아 있습니다.
    reason: 직접 원어 검토가 아직 이루어지지 않았다는 자료상의 한계를 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌의 고유한 우주론적 존재·영역을 가리키므로 일반어인 ‘시대’로 환원하지 않고 음역했습니다.
- source_word: deficiency
  choice: 결핍
  rationale: 존재론적 부족이나 흠결을 뜻하는 반복 핵심어로서 문단 전체에서 일관되게 옮겼습니다.
- source_word: tyrannical one
  choice: 전제자
  rationale: 폭압적 통치자라는 뜻과 인물 호칭의 성격을 함께 살리되, 해석적으로 특정 신적 존재의 이름을 덧붙이지 않았습니다.
- source_word: powers and authorities
  choice: 권능들과 권세들
  rationale: 서로 구별되는 우주적 세력의 두 명칭을 한국어 종교 문헌에서 이해 가능한 용어로 구분했습니다.
- source_word: pre-existent Father
  choice: 선재하시는 아버지
  rationale: 시간 이전부터 존재한다는 의미를 간결하고 존중하는 문체로 표현했습니다.
- source_word: image / form / likeness
  choice: 형상 / 모습 / 닮은 형상
  rationale: 원문 증거가 제시하는 세 표현의 구별을 가능한 한 유지하여 동일 개념으로 평준화하지 않았습니다.
- source_word: disparity
  choice: 불일치
  rationale: 마지막 구문의 난해함을 해소하려고 특정 교리적 의미를 보충하지 않고, 대응·유사성의 어긋남이라는 의미를 보존했습니다.
theological_decisions:
- issue: 어머니의 행위와 아버지의 질서의 관계
  choice: ‘아버지의 위대하심의 질서를 벗어나’로 번역
  alternative: ‘아버지의 위대하심의 질서와 별개로’
  rationale: 행위가 정해진 질서 밖에서 일어났다는 방향성을 살리면서도, 고의적 악행이라는 판단을 추가하지 않았습니다.
- issue: 전제자에게 주어진 권력의 주체와 성격
  choice: 수동형 ‘권력이 주어졌고’를 유지
  alternative: 특정 주체가 전제자에게 권력을 주었다고 명시
  rationale: 제공된 증거가 권력을 준 주체를 밝히지 않으므로 그 신학적 공백을 보존했습니다.
- issue: 죽을 몸들의 기원에 관한 마지막 문장
  choice: ‘만들어진 닮은 형상의 불일치에서 생겨났다’로 난해성을 유지
  alternative: 몸들이 불완전한 모상을 따라 창조되었다고 해설적으로 번역
  rationale: 원문의 통사와 개념이 불확실하므로 창조론적 함의를 한 방향으로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 인용 담화의 반복과 우주론적 전문어는 유지하되, 지나치게 고어적인 표현은 피했습니다. 대괄호와 본문 공백 표시는 사본 및 복원 상태를 보존합니다.
