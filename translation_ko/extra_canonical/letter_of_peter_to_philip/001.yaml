base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/001.yaml
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
translation:
  language: ko
  text: '[a] 베드로가 빌립에게 보낸 편지


    예수 그리스도의 사도 베드로가 우리의 사랑하는 형제이며 동료 사도인 빌립과 그대와 함께 있는 형제들에게 문안합니다.


    우리 형제여, 나는 그대가 이것을 알기 바랍니다. 온 세상의 구원자이신 우리 주께서 우리에게 함께 모여, [b] 우리 주 예수 그리스도께서 우리에게 약속하신 구원에 관해 가르치고 선포하라고 지시하셨습니다.


    그러나 그대는 우리에게서 떨어져 나갔고, 우리가 서로 어떻게 협력하여 그 소식을 전할 수 있을지 배우려고 함께 모이기를 원하지 않았습니다.


    그러므로 우리 형제여, 우리 하나님이신 예수의 지시에 따라 와 주시겠습니까?


    빌립은 이 편지를 받아 읽고는 기쁨에 넘쳐 베드로에게 갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제목 첫머리에는 사본의 손상 또는 복원상의 불확실성이 있습니다.
    reason: 제공된 원문 증언의 첫 대괄호를 반영합니다.
  - marker: b
    text: 이 대목에는 사본의 손상 또는 복원상의 불확실성이 있습니다.
    reason: ‘우리 주 예수 그리스도’ 앞에 표시된 원문 증언의 대괄호를 반영합니다.
lexical_decisions:
- source_word: directives / instructions
  choice: 지시
  rationale: 권위 있는 명령이라는 뜻을 유지하면서도 현대 독자가 자연스럽게 이해할 수 있는 표현입니다.
- source_word: co-apostle
  choice: 동료 사도
  rationale: 빌립이 베드로와 함께 사도의 역할을 맡았다는 관계를 간결하고 자연스럽게 드러냅니다.
- source_word: coordinate ourselves
  choice: 서로 협력하다
  rationale: 함께 행동을 조율한다는 뜻을 현대 한국어에서 자연스럽고 명료하게 전달합니다.
- source_word: announce the message
  choice: 그 소식을 전하다
  rationale: 원문 증언에 구체적인 목적어가 제시되지 않은 점을 존중하여 ‘복음’ 등으로 특정하지 않았습니다.
- source_word: delighting with glee
  choice: 기쁨에 넘쳐
  rationale: 중첩된 기쁨의 강도를 살리되 한국어의 불필요한 동어 반복을 피했습니다.
theological_decisions:
- issue: ‘our God, Jesus’에서 예수와 하나님을 연결하는 표현
  choice: 우리 하나님이신 예수
  alternative: 우리 하나님 예수
  rationale: 영어 증언의 동격 구조가 나타내는 직접적인 동일시를 보존하면서 한국어 문장으로 분명하게 표현했습니다. 이를 ‘우리 하나님과 예수’처럼 두 대상으로 나누지 않았습니다.
- issue: 약속된 구원의 행위 주체
  choice: 우리 주 예수 그리스도께서 우리에게 약속하신 구원
  alternative: 우리에게 약속된 구원
  rationale: 제공된 증언의 ‘promised to us by … our Lord Jesus Christ’를 따라 약속의 주체를 예수 그리스도로 명시했습니다. 다만 해당 부분 앞의 본문 손상은 각주로 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서신의 인사말과 권고는 품위를 유지하되 일반 독자가 쉽게 이해하도록 구성했습니다. 콥트어 원문에 대한 직접 검토가 아직 이루어지지 않았으므로, 제공된 공개 영역 영어 증언을 토대로 한 잠정 번역입니다.
