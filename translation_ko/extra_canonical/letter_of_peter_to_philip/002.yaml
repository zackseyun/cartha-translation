translation:
  language: ko
  text: '그때 베드로는 다른 이들을 불러 모았습니다. 그들은 올리브산이라 불리는 산으로 갔습니다. 그곳은 복되신 그리스도께서 육신으로 계실 때에 그들이 그분과 함께 모이곤 하던 곳이었습니다.


    사도들은 함께 모여 무릎을 꿇고 이렇게 기도하며 말했습니다.


    “아버지, 아버지, 빛의 아버지여,


    멸할 수 없는 이들이 아버지께 속한 분이시여,


    저희의 말을 들어 주십시오.


    아버지의 거룩한 아들 예수 그리스도를 기뻐하셨듯이,


    그분께서 저희를 위하여 어둠 속에서 빛이 되셨기 때문입니다.[a]


    참으로 저희의 말을 들어 주십시오.”


    그들은 다시 기도하며 말했습니다.


    “생명의 아들이시여, 불멸의 아들이시여,


    빛 가운데 거하시는 분이시여,


    아들이시여, 불멸의 그리스도시여,


    저희의 구속자여,


    저희에게 힘을 주십시오.


    그들이 저희를 죽이려고 쫓고 있습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 번역의 기초가 된 영어 증언에는 ‘빛’ 뒤에 내용이 없는 복원 표지 ‘[]’가 있습니다. 필사본의 이 지점에 결락 또는 불확실성이 있음을 나타냅니다.
    reason: 빈 복원 표지를 본문에 그대로 두면 한국어 독자에게 의미가 불분명하므로, 본문 표지 [a]와 각주로 원문 증언의 불확실성을 보존했습니다.
lexical_decisions:
- source_word: Olivet
  choice: 올리브산
  rationale: 현대 한국어 독자가 바로 이해할 수 있는 통용 지명을 사용했습니다.
- source_word: when he dwelt in the body
  choice: 육신으로 계실 때에
  rationale: 신체적 현존을 나타내는 증언의 표현을 보존하면서도 자연스럽고 존엄한 한국어로 옮겼습니다.
- source_word: the indestructible ones
  choice: 멸할 수 없는 이들
  rationale: 특정 집단의 정체를 교리적으로 확정하지 않고 원문의 실질적 모호성을 유지했습니다.
- source_word: deathlessness
  choice: 불멸
  rationale: 죽음에 종속되지 않는 상태를 간결하고 문맥에 맞게 나타냈습니다.
- source_word: redeemer
  choice: 구속자
  rationale: 해방과 구원의 의미를 지닌 종교 문헌의 존엄한 호칭으로 옮겼습니다.
- source_word: hunting for us
  choice: 쫓고 있습니다
  rationale: 살해 의도를 뒤에서 명시하므로, 추적과 박해의 의미가 자연스럽게 드러나도록 옮겼습니다.
theological_decisions:
- issue: ‘멸할 수 없는 이들’이 아버지께 속한다는 표현의 정체
  choice: ‘멸할 수 없는 이들’로 직역에 가깝게 보존
  alternative: ‘불멸의 존재들’ 또는 ‘영원히 멸망하지 않는 사람들’
  rationale: 천상 존재인지 구원받은 사람들인지 확정하지 않고 증언의 긴장을 유지했습니다.
- issue: ‘그분께서 … 빛이 되셨다’의 주어
  choice: 직전의 ‘예수 그리스도’를 받는 ‘그분’으로 표현
  alternative: ‘아버지께서’ 또는 주어를 생략한 표현
  rationale: 제공된 증언의 문법적 흐름을 따르되, 콥트어 원문 검토 전임을 고려해 별도의 교리적 해석을 덧붙이지 않았습니다.
- issue: ‘생명의 아들 / 불멸의 아들 / 불멸의 그리스도’의 호칭 관계
  choice: 반복되는 호칭을 각각 보존
  alternative: ‘생명과 불멸의 아들이신 그리스도’로 통합
  rationale: 기도문의 병행 구조와 신학적 호칭의 누적을 축약하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 읽기 쉽게 다듬고, 기도문은 존엄성과 반복적 운율을 살렸습니다. 이 초안은 제공된 공용 영어 증언을 바탕으로 한 잠정 번역이며, 콥트어 원문 대조가 남아 있습니다. 영어 증언의 ‘[1]’은 본문 내용이 아니라 끼어든 필사본 쪽수 표기로 판단하여 옮기지 않았습니다.
