  terminology: ‘올리브산’, ‘육신’, ‘멸할 수 없는 이들’, ‘불멸’, ‘구속자’는 교리적으로 과도하게 특정하지 않고 증언의 표현을 적절히 보존합니다. ‘그들’은 정체가 특정되지 않은 원문의 대명사를 보존하므로 ‘사람들’보다 적절합니다.
