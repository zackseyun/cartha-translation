    issue: 마지막 문장의 주어를 ‘사람들’로 특정
    rationale: 증언은 정체를 밝히지 않는 ‘they’를 사용하므로, 한국어에서도 ‘그들’로 두어 모호성을 보존하는 편이 낫습니다.
