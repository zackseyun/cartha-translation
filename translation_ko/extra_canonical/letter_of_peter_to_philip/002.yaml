  source_fidelity: 제공된 영어 증언과 대조할 때, 서술부와 결락 표지 처리, ‘육신으로 계실 때’, ‘올리브산’은 대체로 충실합니다. 그러나 ‘멸할 수 없는 이들이 아버지께 속해 있으니’는 원문의 호격적 관계절을 인과절로 바꾸므로 바로잡는 것이 안전합니다. 둘째 기도문의 연속된 호칭들도 접속해 통합하기보다 각각의 호격으로 보존하는 편이 원문의 열거와 반복에 더 충실합니다.
