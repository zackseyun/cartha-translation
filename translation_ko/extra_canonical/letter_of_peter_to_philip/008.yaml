base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: ko
  text: '그때 베드로가 [다른 사도들을] 불러 모으고 말했습니다. “우리의 주 예수 그리스도시여, 우리 안식의 창시자시여, 우리에게 통찰의 영을 주셔서 우리도 기적을 행할 수 있게 해 주십시오!”


    그때 베드로와 다른 사도들은 [그분을] 보았습니다. 그들은 거룩한 영으로 충만해졌고, 저마다 치유를 행했습니다. 그들은 주 예수를 선포하러 떠났습니다. 그 뒤 다시 모여 서로 인사하고 “아멘” 하고 말했습니다.


    그때 예수께서 나타나 그들에게 말씀하셨습니다. “너희 [모두]에게 평화가 있고, 내 이름 안에서 신실한 모든 이에게도 평화가 있기를 바랍니다. 너희가 떠날 때에는 기쁨과 은혜와 능력이 너희의 것이 될 것입니다.


    “두려워하지 마십시오. 보십시오, 내가 언제나 너희와 함께 있겠습니다.”


    그때 사도들은 네 전도 사명을 위해 서로 헤어졌으며,[a] 예수의 능력을 지니고 평안히 길을 떠났습니다.


    《베드로가 빌립에게 보낸 편지》'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “네 메시지로”입니다. 네 방향으로 흩어졌다는 뜻인지, 네 가지 전도 임무를 받았다는 뜻인지 확실하지 않습니다.
    reason: 손상되었거나 의미가 불명확한 증언을 본문에서 지나치게 확정하지 않도록 대안적 이해를 보존합니다.
lexical_decisions:
- source_word: repose
  choice: 안식
  rationale: 단순한 휴식보다 종교적·종말론적 함의를 담을 수 있는 존엄한 표현이며, 원문의 신학적 여지를 보존합니다.
- source_word: spirit of insight
  choice: 깨달음의 영
  rationale: ‘통찰의 영’도 가능하지만, 현대 독자에게 자연스러우면서도 영적 이해 능력이라는 뜻을 살렸습니다.
- source_word: a holy Spirit
  choice: 거룩한 영
  rationale: 부정관사와 대문자 표기가 함께 있는 증언의 긴장을 특정 교리적 해석으로 해소하지 않고 그대로 옮겼습니다.
- source_word: miracles / wonders
  choice: 기적
  rationale: 이어지는 치유 행위와 잘 연결되며 일반 독자에게 명료합니다.
- source_word: faithful in my name
  choice: 내 이름을 신실하게 믿는
  rationale: ‘이름 안에서 신실한’이라는 직역의 어색함을 피하면서 충실함과 믿음 양쪽의 의미를 열어 두었습니다.
- source_word: four messages
  choice: 네 갈래의 전도 사명
  rationale: 원문 증언의 표현은 불확실하나 문맥상 네 방향 또는 네 임무로 파송되는 의미를 자연스럽게 전달하되 각주로 불확실성을 밝혔습니다.
theological_decisions:
- issue: ‘a holy Spirit’의 정체
  choice: 거룩한 영
  alternative: 성령
  rationale: 본문이 부정관사를 포함하는 증언에 기대고 있으므로, 정관화된 교리 용어 ‘성령’으로 단정하지 않았습니다.
- issue: ‘author of our repose’의 의미
  choice: 우리에게 안식을 주시는 분
  alternative: 우리 안식의 창시자
  rationale: ‘author’가 기원자·수여자라는 의미를 가질 수 있어 자연스러운 한국어로 옮기되, 안식의 신학적 성격은 유지했습니다.
- issue: 마지막 파송의 구조
  choice: 네 갈래의 전도 사명을 따라
  alternative: 네 가지 메시지를 전하러
  rationale: 문맥상 사도들이 나뉘어 전도하러 떠난다는 뜻이 유력하지만, 증언의 문자적 형태가 불명확하므로 각주에서 대안을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체 서술을 사용했습니다. 예수의 직접 발화는 권위와 친밀감을 살려 해라체로 옮겼습니다. 대괄호는 증언에서 복원된 부분을 표시하므로 유지했으며, 본문 범위가 결론의 짧은 병행본이므로 제공된 English POB와 같은 범위를 번역했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 이 초안은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다.
