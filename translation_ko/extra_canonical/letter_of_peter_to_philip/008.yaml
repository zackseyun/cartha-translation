revisions:
- from: '그때 베드로가 [다른 사도들을] 불러 모으고 말했습니다. “우리의 주 예수 그리스도시여, 우리에게 안식을 주시는 분이시여, 우리에게 깨달음의 영을 주셔서 우리도 기적을 행할 수 있게 해 주십시오!”


    그때 베드로와 다른 사도들은 [그분을] 보았습니다. 그들은 거룩한 영으로 충만해졌고, 저마다 병을 고쳤습니다. 그들은 주 예수를 선포하러 떠났습니다. 그 뒤 다시 모여 서로 인사하고 “아멘” 하고 말했습니다.


    그때 예수께서 나타나 그들에게 말씀하셨습니다. “너희 [모두]에게 평화가 있고, 내 이름을 신실하게 믿는 모든 이에게도 평화가 있기를 바란다. 너희가 떠날 때 기쁨과 은혜와 능력이 너희와 함께할 것이다.


    “두려워하지 마라. 보아라, 내가 언제나 너희와 함께 있겠다.”


    그때 사도들은 네 갈래의 전도 사명을 따라 서로 헤어졌으며,[a] 예수의 능력을 지니고 평안히 길을 떠났습니다.


    《베드로가 빌립에게 보낸 편지》'
  to: '그때 베드로가 [다른 사도들을] 불러 모으고 말했습니다. “우리의 주 예수 그리스도시여, 우리 안식의 창시자시여, 우리에게 통찰의 영을 주셔서 우리도 기적을 행할 수 있게 해 주십시오!”


    그때 베드로와 다른 사도들은 [그분을] 보았습니다. 그들은 거룩한 영으로 충만해졌고, 저마다 치유를 행했습니다. 그들은 주 예수를 선포하러 떠났습니다. 그 뒤 다시 모여 서로 인사하고 “아멘” 하고 말했습니다.


