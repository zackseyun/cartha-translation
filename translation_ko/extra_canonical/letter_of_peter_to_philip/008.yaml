    “두려워하지 마십시오. 보십시오, 내가 언제나 너희와 함께 있겠습니다.”


    그때 사도들은 네 전도 사명을 위해 서로 헤어졌으며,[a] 예수의 능력을 지니고 평안히 길을 떠났습니다.


    《베드로가 빌립에게 보낸 편지》'
  rationale: 지정된 합쇼체에 맞추어 직접 발화의 종결을 통일했습니다. 또한 영어 증언의 author 및 faithful in my name을 더 직접적으로 반영하되, ‘거룩한 영’과 ‘네 메시지’의 불확실성은 기존 방침대로 보존했습니다. ‘performed healings’는 복수의 치유 행위를 자연스럽게 나타내는 ‘치유를 행했습니다’로 조정했습니다.
