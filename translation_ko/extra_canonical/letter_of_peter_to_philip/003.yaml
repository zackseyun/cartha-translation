translation:
  language: ko
  text: '그때 밝은 빛이 나타났고, 나타나신 분의 모습으로 말미암아 산이 환히 빛났습니다. 그 빛 가운데서 한 음성이 그들에게 외쳐 말했습니다.


    “내가 너희에게 말할 수 있도록 내 말에 귀를 기울여라.

    어찌하여 너희는 나를 찾느냐?

    나는 너희와 언제나 함께 머무는 예수 그리스도다.”


    사도들이 대답했습니다.


    “주님, 저희는 에온들[a]의 결핍과

    그들의 충만을 이해하고 싶습니다.

    또 저희가 어찌하여 이 거처에 붙들려 있는지도 알고 싶습니다.

    저희는 어떻게 이곳에 이르렀습니까?

    어떻게 떠나게 됩니까?

    [본문 훼손][b] 저희는 어떻게 담대히 말할 권한을 얻게 됩니까?[c]

    어찌하여 권세들이 저희와 싸웁니까?”


    그러자 그 빛 가운데서 한 음성이 그들에게 외쳐 말했습니다. “내가 이 모든 것을 너희에게 말했다는 것을 증언하는 이들이 바로 너희다. 그러나 너희가 믿지 않으므로, 내가 이 일들을 다시 말해 주겠다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에온’은 이 문헌에서 시대, 초월적 영역 또는 영적 존재를 가리킬 수 있는 우주론적 용어입니다. 정확한 뜻을 하나로 한정하지 않기 위해 음역했습니다.
    reason: 전문 용어의 진정한 의미적·신학적 모호성을 보존하기 위해서입니다.
  - marker: b
    text: 이 지점에는 전승 본문의 훼손이나 복원되지 않은 부분을 나타내는 공백 표시가 있습니다.
    reason: 제공된 증거 본문의 대괄호 신호를 독자가 알아볼 수 있도록 보존하기 위해서입니다.
  - marker: c
    text: ‘담대히 말하다’는 거리낌 없이 공개적으로 말하는 자유나 권한을 뜻할 수 있습니다.
    reason: ‘권한’과 ‘담대함’이 결합된 원문 증거의 표현 범위를 설명하기 위해서입니다.
lexical_decisions:
- source_word: aeons
  choice: 에온들
  rationale: 이 문헌의 우주론적 전문 용어가 단순히 ‘시대들’이나 ‘영원들’을 뜻하는지, 인격적·초월적 존재 또는 영역을 뜻하는지 확정하지 않고 음역하여 고유한 개념과 모호성을 보존했습니다.
- source_word: fullness
  choice: 충만
  rationale: ‘결핍’과 대조되는 우주론적·신학적 함의를 살리면서도 한국어 독자가 이해할 수 있는 관용적 표현을 택했습니다.
- source_word: dwelling-place
  choice: 거처
  rationale: 물리적 장소와 현존재의 상태라는 두 가능성을 모두 열어 두기 위해 ‘감옥’이나 ‘세상’처럼 해석적인 표현을 피했습니다.
- source_word: authority for boldness of speech
  choice: 담대히 말할 권한
  rationale: ‘권한’과 ‘거리낌 없이 말함’이라는 두 요소를 함께 드러내되, 법정적 또는 종교적 전문 의미로 좁히지 않았습니다.
- source_word: powers
  choice: 권세들
  rationale: 단순한 능력이 아니라 대항하는 복수의 세력 또는 존재를 가리킬 가능성을 보존했습니다.
- source_word: unfaithfulness
  choice: 믿지 않음
  rationale: 불충실과 불신앙 사이의 의미 범위를 고려하되, 이 문맥에서 가르침을 다시 말하는 이유와 자연스럽게 이어지는 표현을 사용했습니다.
theological_decisions:
- issue: ‘에온들’의 존재론적 성격
  choice: 전문 용어를 음역하고 설명 각주를 붙였습니다.
  alternative: ‘영겁들’, ‘시대들’, ‘영적 세계들’ 또는 ‘영적 존재들’로 번역할 수 있습니다.
  rationale: 본문만으로 에온들이 시간적 시대, 초월적 영역, 인격적 존재 가운데 무엇인지 단정하면 특정 우주론을 본문에 주입할 수 있습니다.
- issue: ‘결핍’과 ‘충만’의 관계
  choice: 원문의 대조를 그대로 유지했습니다.
  alternative: ‘에온들에게 부족한 것과 그들을 채우는 것’처럼 풀어 쓸 수 있습니다.
  rationale: 이 표현들이 고유한 우주론적 상태나 영역을 지칭할 가능성이 있어 인과관계를 해설적으로 확정하지 않았습니다.
- issue: 음성이 예수와 동일한지 여부
  choice: 첫 발화에서는 자기 정체를 예수 그리스도로 밝히게 하되, 서술부에서는 계속 ‘한 음성’으로 번역했습니다.
  alternative: 두 번째 발화자를 곧바로 ‘예수께서’라고 명시할 수 있습니다.
  rationale: 서술문이 사용하는 ‘음성’과 ‘빛’의 현현 언어를 보존하고, 본문이 직접 명시한 범위를 넘어 발화자를 재규정하지 않았습니다.
- issue: unfaithfulness의 신학적 뉘앙스
  choice: ‘믿지 않으므로’로 옮겼습니다.
  alternative: ‘너희의 불충실함 때문에’ 또는 ‘너희의 불신앙 때문에’로 옮길 수 있습니다.
  rationale: 도덕적 배신이나 교리적 불신앙 한쪽으로 과도하게 좁히지 않으면서, 반복 교육의 문맥을 자연스럽게 전달했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 서술부와 사도들의 말에 사용했고, 예수의 직접 발화는 권위 있는 해라체로 처리했습니다. 행갈이와 수사적 질문의 연속을 보존했습니다. 다만 콥트어 원문 대조가 아직 이루어지지 않았으므로, 본 번역은 제공된 공개 영역 영어 증거본에 근거한 잠정 출판 초안입니다.
