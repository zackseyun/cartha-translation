id: LPPH.007
reference: Letter of Peter to Philip — Suffering and Death
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'The apostles then thanked the Lord with all praises and returned to Jerusalem.


    While they were going down (the mountain, heading towards Jerusalem) on the road, they conversed concerning the light that had become visible, and a dispute began concerning the Lord, during which they said: “If he, our Lord, suffered, how much more (will) we?”


    Peter responded, and said: “He suffered for our sake, and we will have to suffer, too, on account of our being small.” [ 4 ]


    A voice then came to them, and said: “I informed you many times that you will have to suffer. You will have to be dragged to synagogues and in front of governors, which will cause you to suffer. He, however, who will not suffer, he, too, [will] not [] [. . . my] Father [. . .], so that he can [. . .].”


    The aptles, however, were very glad, and went up to Jerusalem, going up to the temple, and teaching salvation in the name of the Lord, Jesus Christ, and they healed [a] multitude.


    Peter, however, began speaking, and said to his disciples: “When our Lord Jesus dwelt in the body, he told us everything, because he himself had descended. My brethren, pay attention to my voice.”


    He was filled with a holy Spirit, and spoke in the following way:


    “Our light, Jesus, [de]scended,

    and was crucified,

    and he wore a crown of thorns,

    and he donned a purple robe,

    and he was hanged on a tree,

    and he was interred in a tomb,

    and he rose from among the dead.


    “My brethren, Jesus is an alien to such suffering as this. We, however, are those who have suffered on account of the trespass of the Mother. This is why he announced everything with a symbolic meaning when he was among us. The Lord Jesus, Son of the measureless glory of the Father, is the author of our life.


    “My brethren, let us pay no attention to these Godless [5] ones, nor walk in [] [. . .].”'
