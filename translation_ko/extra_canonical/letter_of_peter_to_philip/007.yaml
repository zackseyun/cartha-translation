    죽은 자들 가운데서 살아나셨습니다.


    “나의 형제들이여, 예수께서는 이와 같은 고난과는 낯선 분이십니다.[b] 그러나 어머니의 범법 때문에 고난을 받은 것은 바로 우리입니다.[c] 그러므로 그분은 우리 가운데 계실 때 모든 것을 상징적인 뜻으로 알려 주셨습니다. 아버지의 한량없는 영광의 아들이신 주 예수께서는 우리 생명의 창시자이십니다.


