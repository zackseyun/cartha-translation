translation:
  language: ko
  text: '그때 사도들은 온갖 찬양으로 주님께 감사드리고 예루살렘으로 돌아갔습니다.


    그들이 길을 따라 산에서 내려가 예루살렘으로 향하는 동안, 나타났던 빛에 관하여 서로 이야기했습니다. 그러다가 주님에 관한 논쟁이 일어났고, 그들은 이렇게 말했습니다. “우리 주님께서 고난을 받으셨다면, 우리는 얼마나 더 많은 고난을 받겠습니까?”


    베드로가 대답했습니다. “그분은 우리를 위하여 고난을 받으셨습니다. 우리도 미약한 존재이기 때문에 고난을 받아야 할 것입니다.”


    그때 한 음성이 그들에게 들려와 말했습니다. “너희가 고난을 받아야 한다고 내가 여러 번 너희에게 알려 주었다. 너희는 회당으로 끌려가고 총독들 앞에 끌려가 고난을 받게 될 것이다. 그러나 고난을 받지 않을 사람은 그도 또한 [하지] 않을 것이다 […] [… 나의] 아버지 […] 그가 […] 할 수 있도록.”[a]


    그러나 사도들은 크게 기뻐하며 예루살렘으로 올라갔습니다. 그들은 성전으로 올라가 주 예수 그리스도의 이름으로 구원을 가르쳤고, 많은 사람을 고쳐 주었습니다.


    그때 베드로가 제자들에게 말하기 시작했습니다. “우리 주 예수께서 몸 안에 머무셨을 때, 친히 내려오신 분이기에 우리에게 모든 것을 말씀해 주셨습니다. 나의 형제들이여, 내 말에 귀를 기울이십시오.”


    그는 거룩한 영으로 충만해져 이렇게 말했습니다.


    “우리의 빛이신 예수께서 [내]려오셨고,

    십자가에 못 박히셨으며,

    가시관을 쓰셨고,

    자주색 옷을 입으셨으며,

    나무에 달리셨고,

    무덤에 묻히셨으며,

    죽은 자들 가운데서 살아나셨습니다.


    “나의 형제들이여, 예수께서는 이와 같은 고난과는 무관한 분이십니다.[b] 그러나 어머니의 범법 때문에 고난을 받은 것은 바로 우리입니다.[c] 그러므로 그분은 우리 가운데 계실 때 모든 것을 상징적인 뜻으로 알려 주셨습니다. 아버지의 한량없는 영광의 아들이신 주 예수께서는 우리 생명의 창시자이십니다.


    “나의 형제들이여, 이 경건하지 않은 자들에게 마음을 두지 말고, […] 안에서 걷지도 맙시다.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 사본이 심하게 훼손되어 뜻을 온전히 복원할 수 없습니다. 대괄호와 생략 부호는 결락되거나 복원된 글자를 나타냅니다.
    reason: 손상된 본문을 매끄럽게 추정하여 채우지 않고 독자에게 불확실성을 알립니다.
  - marker: b
    text: 또는 “예수께서는 이와 같은 고난에 낯선 분이십니다.” 앞에서 예수의 고난을 말한 진술과의 긴장이 원문 증거에 그대로 남아 있습니다.
    reason: ‘alien’의 의미 범위와 신학적 긴장을 보존합니다.
  - marker: c
    text: ‘어머니’가 누구를 가리키는지는 이 대목만으로 분명하지 않습니다.
    reason: 문헌의 특수 용어에 특정 우주론적 해석을 강요하지 않습니다.
  - marker: d
    text: 끝부분이 결락되어 있어 무엇 ‘안에서’ 걷지 말라는 것인지 알 수 없습니다.
    reason: 손상된 구절의 통사적·의미적 공백을 명시합니다.
lexical_decisions:
- source_word: on account of our being small
  choice: 우리도 미약한 존재이기 때문에
  rationale: ‘small’의 비유적·존재론적 여지를 ‘미약한 존재’로 보존하면서도 한국어 문맥에서 자연스럽게 표현했습니다.
- source_word: a holy Spirit
  choice: 거룩한 영
  rationale: 영어 증거문의 부정관사로 생기는 모호성을 교리적으로 확정하지 않도록 고유명사식 ‘성령’ 대신 직역에 가까운 표현을 택했습니다.
- source_word: an alien to such suffering
  choice: 이와 같은 고난과는 무관한 분
  rationale: ‘alien’이 나타내는 낯섦·비소속성을 자연스러운 한국어로 옮기되, 고난의 외관과 실재에 관한 본문의 긴장을 해소하지 않았습니다.
- source_word: the trespass of the Mother
  choice: 어머니의 범법
  rationale: 문헌의 특수한 우주론적 용어일 수 있는 ‘Mother’를 ‘어머니’로 그대로 보존하고, ‘trespass’는 도덕적 위반을 드러내는 ‘범법’으로 옮겼습니다.
- source_word: the author of our life
  choice: 우리 생명의 창시자
  rationale: ‘author’가 가진 기원자·수립자의 의미를 보존하면서 특정 교리적 해석을 덧붙이지 않았습니다.
- source_word: Godless ones
  choice: 경건하지 않은 자들
  rationale: ‘신이 없는’이라는 존재론적 단정보다 원문의 비난적 종교 의미를 자연스럽게 전달하되 ‘불경한 자들’도 가능한 번역입니다.
theological_decisions:
- issue: 예수의 고난과 ‘고난과 무관함’ 사이의 긴장
  choice: 두 진술을 모두 그대로 보존
  alternative: 후자를 ‘고난에 지배받지 않는 분’ 등으로 조화시킴
  rationale: 본문은 십자가 고난을 진술한 직후 예수가 그러한 고난과 ‘alien’하다고 말합니다. 이 문헌의 신학적 긴장을 번역자가 해소하지 않았습니다.
- issue: ‘거룩한 영’의 정체
  choice: 거룩한 영
  alternative: 성령
  rationale: 제공된 영어 증거문이 ‘a holy Spirit’으로 되어 있고 콥트어 직접 검토가 보류 중이므로, 삼위일체적 고유명칭으로 단정하지 않았습니다.
- issue: ‘어머니’의 정체
  choice: 어머니
  alternative: 모체, 신적 어머니 또는 특정 우주론적 존재로 풀이
  rationale: 본문 자체가 정체를 설명하지 않으므로 해석적 명칭을 도입하지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되 고대 종교 문헌에 어울리는 품위를 유지했습니다. 제공된 공용 영어 증거문을 토대로 한 잠정 번역이며 콥트어 원문 직접 대조가 필요합니다. 사본 면수 표시는 본문에서 제외했고, 결락과 복원 표시는 보존했습니다. ‘aptles’는 문맥상 ‘apostles’로 바로잡았습니다.
