  terminology: ‘권세들’(powers), ‘통치자들’(archons), ‘내면의 사람’(Inner Man), ‘현현’(apparition)은 용어상 일관되고 해석을 과도하게 확정하지 않습니다. ‘청원’은 request의 폭을 유지하면서도 문맥상 아버지께 드리는 요청이라는 함의를 보존합니다.
