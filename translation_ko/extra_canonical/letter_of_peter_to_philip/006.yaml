translation:
  language: ko
  text: '“그러나 여러분이 갇혀 있는 것은 여러분이 내게 속해 있기 때문입니다. 여러분이 자기 안에서 썩어 없어질 것을 없애 버리면, 그때 여러분은 죽을 수밖에 없는 사람들 가운데서 빛이 될 것입니다.


    “여러분이 권세들과 싸우는 것은, 그들이 여러분과 달리 안식을 얻지 못하고 여러분이 구원받기를 원하지 않기 때문입니다.”


    그러자 사도들은 다시 한번 경배하며 말했습니다. “주님, 저희에게 가르쳐 주십시오. 통치자들이 저희보다 강한데, 저희가 어떻게 그들과 싸워야 합니까?”


    그때 그 현현 가운데서 한 음성이 그들에게 크게 외쳐 말했습니다. “여러분은 다음과 같이 그들과 싸워야 합니다. 통치자들이 ‘내면의 사람’[a]과 싸우기 때문입니다. 여러분은 다음과 같이 그들과 싸워야 합니다.


    “함께 모여 세상에 약속과 더불어 구원을 가르치고, 내 아버지의 능력으로 허리를 동이고, 여러분의 간구를 아뢰십시오. 그러면 아버지께서 여러분을 도우실 것입니다. 아버지께서 나를 보내셨을 때 여러분을 도우신 것과 같습니다. [][두려워하지] 마십시오. [내가 언제나 여러분과 함께 있을 것입니다.] 내가 전에 몸 안에 거할 때 여러분에게 말한 그대로입니다.”[b]


    그러자 하늘에서 번개가 치고 천둥이 울렸으며, 그들이 그곳의 현현 가운데서 보았던 이는 하늘로 들려 올라갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내면의 사람’은 이 문헌의 개념어입니다. 여기서는 그 뜻을 ‘영혼’이나 ‘참된 자아’로 한정하지 않았습니다.
    reason: 개념의 신학적 모호성을 보존하면서 현대 독자가 일반적인 심리학 용어로만 오해하지 않도록 하기 위해서입니다.
  - marker: b
    text: 이 대목의 빈 대괄호 []는 본문의 결손을, 글자가 든 대괄호는 편집자가 복원한 문구를 나타냅니다. 이 번역은 제공된 공개 영역 영어 증언문에 근거한 잠정 번역이며, 콥트어 사본에 대한 직접 검토가 필요합니다.
    reason: 사본 훼손·복원 표지를 설명하고 현재 번역 근거의 한계를 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: detention
  choice: 갇혀 있는 것
  rationale: ‘구금’이라는 제도적 뉘앙스보다 실제로 붙들려 자유롭지 못한 상태를 자연스럽게 나타냈습니다.
- source_word: what is destructible
  choice: 썩어 없어질 것
  rationale: 소멸·부패할 수 있는 것이라는 의미를 살리되, 그 정체를 특정한 교리적 개념으로 단정하지 않았습니다.
- source_word: mortals
  choice: 죽을 수밖에 없는 사람들
  rationale: 단순히 ‘사람들’이라고 하여 필멸성의 대조를 잃지 않도록 풀어 옮겼습니다.
- source_word: powers
  choice: 권세들
  rationale: 인격적·초월적 세력을 가리킬 수 있는 용어의 폭을 유지했습니다.
- source_word: archons
  choice: 통치자들
  rationale: ‘권세들’과의 어휘상 구별을 보존하면서도 특정 영지주의 체계를 번역문에 덧씌우지 않았습니다.
- source_word: Inner Man
  choice: ‘내면의 사람’
  rationale: 대문자로 표시된 개념적 중요성을 인용 부호로 드러내되, 의미를 ‘영’이나 ‘참자아’로 해석해 확정하지 않았습니다.
- source_word: apparition
  choice: 현현
  rationale: 단순한 환각을 암시하는 ‘환영’보다, 눈앞에 나타난 신비한 형상을 뜻하는 문맥을 품위 있게 나타냅니다.
- source_word: gird yourselves
  choice: 허리를 동이고
  rationale: 준비와 무장을 나타내는 원문의 비유를 보존했습니다.
- source_word: make known your request
  choice: 여러분의 간구를 아뢰십시오
  rationale: 요청을 드러내어 알린다는 뜻을 자연스러운 기도 언어로 옮겼으나 응답 방식은 규정하지 않았습니다.
- source_word: dwelt in the body
  choice: 몸 안에 거할 때
  rationale: ‘몸을 입었을 때’처럼 성육신 교리를 명시적으로 해석하지 않고, 몸과 거주의 긴장을 보존했습니다.
theological_decisions:
- issue: 권세들과 통치자들의 정체
  choice: 서로 관련된 적대 세력으로 나타내되 ‘권세들’과 ‘통치자들’을 구별하여 번역함
  alternative: 두 표현을 모두 ‘악한 영들’ 또는 모두 ‘권세들’로 통일함
  rationale: 증언문이 사용하는 두 용어의 구별과 모호성을 보존하고, 그 존재론적 성격을 번역자가 확정하지 않기 위해서입니다.
- issue: ‘내면의 사람’의 의미
  choice: 개념어를 그대로 보존함
  alternative: ‘영혼’, ‘영적인 사람’, ‘참된 자아’로 해석함
  rationale: 본문만으로는 정확한 인간론적 함의를 확정할 수 없으므로 신학적 긴장을 남겼습니다.
- issue: ‘아버지께서 나를 보내셨을 때 여러분을 도우신 것’의 관계
  choice: 제공된 증언문의 주어와 시간 관계를 그대로 유지함
  alternative: ‘아버지께서 나를 보내어 여러분을 도우신 것’으로 목적 관계를 명확히 함
  rationale: 원문 증언이 지닌 통사적 모호성을 자의적으로 해소하지 않았습니다.
- issue: 훼손·복원된 예수의 약속
  choice: 빈 대괄호와 복원 대괄호를 본문에 그대로 보존함
  alternative: 대괄호를 제거하고 매끄러운 완문으로 제시함
  rationale: 사본 훼손과 편집상 복원 여부는 본문비평상 중요한 정보이므로 독자에게 숨기지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 자연스럽고 명료하게 다듬되, 반복되는 ‘다음과 같이 싸워야 합니다’는 수사적 강조로 보고 보존했습니다. 인용문 안의 명령과 약속은 엄숙하되 일반 독자가 이해할 수 있는 어휘로 옮겼습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 이 초안은 잠정적입니다.
