    rationale: 영어 증언문의 ‘superior to us’는 단순한 물리적 강함보다는 상대적 우세·상위성을 말합니다. ‘저희보다 우세한데’가 더 가깝습니다.
  - severity: medium
    issue: ‘여러분의 간구를 아뢰십시오’
    rationale: ‘make known your request’는 요청을 알리라는 표현이며, ‘간구’와 ‘아뢰다’는 이를 기도 행위로 더 구체화합니다. ‘여러분의 청원을 알리십시오’가 원문의 중립성을 더 잘 보존합니다.
