  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: “Now, concerning the fullness, it is I, [even] I, who was dispatched down into the body for the sake of this seed that had been lost, and I descended to their mortal mold. They, however, failed to notice me, imagining me to be a mortal person. I spoke with the one who is mine, and he paid attention to me, just like you, too, who have paid attention this day. I granted him authority to come into the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] by means of his salvation. Given that he was deficiency, he turned into fullness.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex VIII,2 and Codex Tchacos
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/the-letter-of-peter-to-philip
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: “Now, concerning the fullness, it is I, [even] I, who was dispatched down into the body for the sake of this seed that had been lost, and I descended to their mortal mold. They, however, failed to notice me, imagining me to be a mortal person. I spoke with the one who is mine, and he paid attention to me, just like you, too, who have paid attention this day. I granted him authority to come into the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] by means of his salvation. Given that he was deficiency, he turned into fullness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: ko
  text: “이제 충만[a]에 관하여 말하겠습니다. 잃어버린 이 씨를 위하여 몸 안으로 내려보냄을 받은 이는 바로 나, 나 자신입니다. 나는 죽을 수밖에 없는 그들의 형체로 내려갔습니다. 그러나 그들은 나를 죽을 수밖에 없는 사람으로 여겨 알아보지 못했습니다. 나는 내게 속한 이에게 말했고, 그는 오늘 여러분이 귀 기울인 것처럼 내 말에 귀를 기울였습니다. 나는 그에게 자기 아버지 됨의 유업에 들어갈 권한을 주었고, 나는 [그를] … 채워진 … 그의 구원을 통하여[b] 데려갔습니다. 그는 결핍이었으나 충만이 되었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘충만’은 이 문단에서 ‘결핍’과 대조되는 용어입니다. 완전한 상태 또는 충만의 영역을 가리킬 수 있으나, 뜻을 하나로 확정하지 않았습니다.
    reason: 핵심 신학 용어의 의미 범위와 본문의 의도적인 대조를 알립니다.
  - marker: b
    text: 이 부분의 사본은 손상되어 문장이 온전하지 않습니다. 대괄호는 보충된 말을, 줄임표는 읽을 수 없거나 빠진 부분을 나타냅니다. 이 번역은 공개 영역 영어 번역 증거를 바탕으로 한 잠정안이며, 콥트어 원문 대조가 필요합니다.
    reason: 사본의 결락과 현재 번역 근거의 한계를 독자에게 투명하게 밝힙니다.
lexical_decisions:
- source_word: fullness
  choice: 충만
  rationale: 문맥에서 ‘결핍’과 대조되는 신학적·우주론적 개념을 보존하면서도 현대 한국어 독자가 이해할 수 있는 용어입니다.
- source_word: seed
  choice: 씨
  rationale: 집단 또는 영적 기원을 가리킬 수 있는 원문의 비유적 모호성을 ‘후손’ 등으로 한정하지 않고 유지합니다.
- source_word: mortal mold
  choice: 죽을 수밖에 없는 그들의 형체
  rationale: ‘mortal’의 필멸성과 ‘mold’의 형상·틀 의미를 함께 살리되, ‘육체’로 단순화하지 않았습니다.
- source_word: the one who is mine
  choice: 내게 속한 이
  rationale: 소유, 소속, 친밀한 관계 가운데 어느 하나로 의미를 좁히지 않습니다.
- source_word: fatherhood
  choice: 아버지 됨
  rationale: 추상 명사와 신분·상태의 의미를 보존하며, ‘아버지의 유산’으로 고쳐 읽지 않습니다.
- source_word: deficiency
  choice: 결핍
  rationale: ‘충만’과 의도적으로 대응하는 추상적 상태를 유지합니다.
theological_decisions:
- issue: ‘충만’과 ‘결핍’의 성격
  choice: 두 표현을 추상 명사로 그대로 유지했습니다.
  alternative: ‘불완전한 존재’와 ‘완전한 존재’처럼 해석하여 풀어 쓸 수 있습니다.
  rationale: 본문이 존재 상태, 우주론적 영역, 영적 조건 중 무엇을 뜻하는지 확정하지 않으므로 신학적 긴장을 보존했습니다.
- issue: ‘아버지 됨의 유업’의 의미
  choice: 다소 낯설더라도 직역에 가까운 표현을 유지했습니다.
  alternative: ‘자기 아버지의 유업’ 또는 ‘아버지의 지위’를 물려받는 것으로 번역할 수 있습니다.
  rationale: 영어 증거 본문의 fatherhood는 ‘아버지’ 자체가 아니라 ‘아버지 됨’을 나타내므로, 소유 관계를 임의로 확정하지 않았습니다.
- issue: 구원이 누구에게 속하는지
  choice: ‘그의 구원’으로 남겼습니다.
  alternative: ‘그를 구원함으로써’로 행위 중심으로 해석할 수 있습니다.
  rationale: 대명사의 관계와 구문의 손상 때문에 의미가 불확실하므로 소유 표현을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 계시 담화의 장중함은 유지하되 지나치게 고어적인 표현을 피했습니다. 반복된 ‘나’를 살려 화자의 강조를 보존했고, 사본 손상 구간은 매끄럽게 추정하여 메우지 않았습니다.
