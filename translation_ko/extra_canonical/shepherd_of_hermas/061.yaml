base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/061.yaml
  text: 'Then the angel of the Lord commanded that crowns be brought[a]. And crowns were brought, as if made from palms, and he crowned the men who had handed in the rods that had shoots and some fruit, and he dismissed them into the tower. 2. And the others also he sent into the tower—those who had handed in their rods green and having shoots, but whose shoots did not have fruit—giving them seals. 3. And all who were going into the tower had the same clothing, white as snow. 4. And those who had handed in their rods green, just as they had received them, he dismissed, giving them clothing and seals. 5. After the angel had finished these things, he says to the shepherd: “I am going; but you are to dismiss these to the walls, as each one is worthy to dwell. Pay close attention to their rods, and so dismiss them—pay close attention. See that no one slips past you,” he says; “but if anyone does slip past you, I will test them upon the altar.” Having said these things to the shepherd, he went
    away. 6. The shepherd says to me, “Let us take the rods of all and plant them, to see if any of them will be able to live.” I say to him, “Sir, how can these dry things live?” 7. Answering me he says, “This tree is a willow, and its kind loves life. If, then, the rods are planted and receive a little moisture, many of them will live; then let us also try pouring water on them. If any of them is able to live, I will rejoice over it; but if it does not live, I shall not be found negligent.” 8. Then the shepherd commanded me to call them just as each of them had been stationed. Rank by rank they came and were handing their rods to the shepherd. The shepherd took the rods and planted them according to the ranks; and after planting he provided much water for them, so that because of the water the rods could not be seen. 9. And after he had watered the rods, he says to me, “Let us go, and after a few days let us return and inspect all the rods; for the one who created this tree desires all
    who have taken branches from this tree to live. And I too hope that, these rods having received moisture and having been watered with water[f][e][d][c][b], the greater part of them will live.”'
  footnotes:
  - marker: a
    text: Crowns “as if made from palms” echoes Greco-Roman victory/festival wreaths; palm branches commonly signified triumph.
    reason: cultural_note
  - marker: b
    text: “Seals” in Hermas often resonate with baptismal sealing and divine ownership; the translation keeps the literal term to preserve the symbolism.
    reason: cultural_note
  - marker: c
    text: “To the walls … to dwell” situates people within the tower’s structure in the allegory; elsewhere in Hermas the tower represents the community being built.
    reason: cross_reference
  - marker: d
    text: The willow (ἰτέα) readily takes root from cuttings when given moisture, reinforcing the image of life restored by watering.
    reason: cultural_note
  - marker: e
    text: “Rank by rank” renders τάγματα τάγματα, a phrase of orderly, almost military grouping.
    reason: cultural_note
  - marker: f
    text: “Test upon the altar” retains the cultic image of evaluation in a sacred setting rather than a generic examination.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 주님의 천사가 관들을 가져오라고 명령했습니다[a]. 관들이 가져와졌는데, 마치 종려나무로 만든 것 같았습니다. 그는 싹과 약간의 열매가 달린 막대기를 바친 사람들을 관 씌우고 탑으로 내보냈습니다. 2. 또 다른 사람들도 탑으로 보냈는데—그들은 막대기를 푸른 채로, 그리고 싹이 있는 채로 바쳤지만 그 싹에는 열매가 없었습니다—그들에게는 인장을 주었습니다. 3. 탑으로 들어가는 사람들은 모두 같은 옷을 입고 있었는데, 눈처럼 흰 옷이었습니다. 4. 그리고 막대기를 푸른 채로, 받은 그대로 바쳤던 사람들은 그들을 내보내며 옷과 인장을 주었습니다. 5. 천사가 이 일들을 마친 뒤, 목자에게 말했습니다. “나는 가겠습니다. 그러나 당신은 각 사람이 거주할 만한 자격에 따라 이들을 성벽으로 내보내야 합니다. 그들의 막대기를 주의 깊게 살펴보고, 그렇게 내보내십시오—주의 깊게 살펴보십시오. 아무도 당신을 지나치지 않게 하십시오.” 그가 말했습니다. “만일 누가 당신을 지나쳐 가면, 나는 그들을 제단 위에서 시험하겠습니다.” 그가 목자에게 이렇게 말하고 떠났습니다. 6. 목자는 제게 말했습니다. “우리는 모두의 막대기를 가져다가 심어 봅시다. 그중 어떤 것이 살아날 수 있는지 보려는 것입니다.” 제가 그에게 말했습니다. “선생님, 이렇게 마른 것들이 어떻게 살아날 수 있습니까?” 7. 그가 제게 대답했습니다. “이 나무는 버드나무인데, 그 종류는 살기를 좋아합니다. 그러므로 막대기들을 심고 조금만 습기를 받게 하면, 그중 많은 것이 살아날 것입니다. 그러면 우리도 그것들에게 물을 주어 봅시다. 그중 어떤 것이 살아날 수 있으면, 나는 그것을 기뻐할 것입니다. 그러나 살아나지 못하더라도 나는 게으르다고 여겨지지 않을 것입니다.” 8. 그때 목자는 각 사람이 서 있던 대로 그들을 부르라고 제게 명령했습니다. 그들은 대열대로 와서 막대기를 목자에게 바쳤습니다. 목자는 그 막대기들을 받아 대열에 따라 심었고, 심은 뒤에는 그들에게 많은 물을 주어서, 물 때문에 막대기들이
    보이지 않을 정도였습니다. 9. 그리고 막대기들에 물을 준 뒤, 그는 제게 말했습니다. “가십시다. 며칠 후에 다시 와서 모든 막대기를 살펴봅시다. 이 나무를 만드신 분은 이 나무에서 가지를 받은 사람들 모두가 살기를 바라시기 때문입니다. 그리고 나도, 이 막대기들이 습기를 받고 물로 적셔져서, 그 대부분이 살아날 것을 희망합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος κυρίου
  english_pob_choice: the angel of the Lord
  chosen_korean: 주님의 천사
  alternatives_korean:
  - 주님의 천사
  - 야훼의 천사
  - 주(主)의 천사
  lexicon: BDAG
  rationale: 주님의 천사로 옮겨, 본문이 말하는 파견된 천사라는 서술 기능을 살리되 신적 호칭으로 과도하게 확장하지 않았습니다.
- source_word: στεφάνους / στέφανοι
  english_pob_choice: crowns
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 화관
  - 면류관
  lexicon: BDAG
  rationale: στέφανος는 승리의 화관/관을 가리킬 수 있지만, 여기서는 상징적 수여물로서 간결한 ‘관’이 자연스럽고 본문 비유와도 맞습니다.
- source_word: ἐνεχθῆναι / ἐνέχθησαν
  english_pob_choice: be brought / were brought
  chosen_korean: 가져오라고 / 가져와졌는데
  alternatives_korean:
  - 가져오라고 / 가져와졌는데
  - 가져오게 하라고 / 가져왔습니다
  lexicon: BDAG
  rationale: 수동 구문을 살리면서도 한국어 문장 흐름이 자연스럽도록 ‘가져와졌습니다’로 옮겼습니다.
- source_word: ἐπιδεδωκότας τὰς ῥάβδους
  english_pob_choice: had handed in the rods
  chosen_korean: 막대기를 바친 사람들
  alternatives_korean:
  - 막대기를 바친 사람들
  - 막대기를 내놓은 사람들
  - 막대기를 제출한 사람들
  lexicon: LSJ
  rationale: 의례적·상징적 맥락에서 단순한 제출보다 ‘바치다’가 더 잘 맞으며, 반복되는 행위를 자연스럽게 전달합니다.
- source_word: ῥάβδους / ῥαβδία
  english_pob_choice: rods
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 막대
  - 몽둥이
  lexicon: LSJ
  rationale: 여기서는 길쭉한 식물 조각을 가리키므로 ‘지팡이’보다 중립적인 ‘막대기’가 적절합니다.
- source_word: παραφυάδας
  english_pob_choice: shoots
  chosen_korean: 싹
  alternatives_korean:
  - 싹
  - 새순
  - 눈
  lexicon: LSJ
  rationale: 식물의 새로 돋는 성장이라는 의미를 한국어로 가장 직접적으로 전달합니다.
- source_word: σφραγῖδας
  english_pob_choice: seals
  chosen_korean: 인장
  alternatives_korean:
  - 인장
  - 도장
  - 표
  lexicon: BDAG
  rationale: 상징적 표시이자 소유·인증의 뉘앙스를 보존하기 위해 ‘인장’을 택했습니다.
- source_word: ἱματισμός
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 옷
  - 의복
  - 복장
  lexicon: BDAG
  rationale: 집합적 의미를 살리되 문맥상 가장 자연스러운 ‘옷’으로 옮겼습니다.
- source_word: ἐπιδεδωκότας χλωρὰς
  english_pob_choice: had handed in their rods green
  chosen_korean: 막대기를 푸른 채로
  alternatives_korean:
  - 막대기를 푸른 채로
  - 막대기를 푸르게
  - 초록빛인 막대기를
  lexicon: LSJ
  rationale: χλωρός의 ‘푸른/생기 있는’ 감각을 살리면서, 막대기 자체의 상태를 간명하게 전달합니다.
- source_word: τὰς χλωρὰς ὡς ἔλαβον
  english_pob_choice: just as they had received them
  chosen_korean: 받은 그대로
  alternatives_korean:
  - 받은 그대로
  - 그들이 받은 그대로
  - 그 상태 그대로
  lexicon: BDAG
  rationale: 반복적 대조를 압축해, 변형 없이 보존된 상태라는 의미를 자연스럽게 드러냅니다.
- source_word: τάγματα τάγματα
  english_pob_choice: Rank by rank
  chosen_korean: 대열대로
  alternatives_korean:
  - 대열대로
  - 순서대로
  - 부대별로
  lexicon: LSJ
  rationale: 반복을 한국어에서 부자연스럽지 않게 압축하면서, 질서정연한 집단 이동이라는 효과를 유지했습니다.
theological_decisions:
- issue: σφραγῖδες의 상징성
  chosen_reading: ‘인장’으로 그대로 옮기고, 세례나 소유 표지로의 의미는 본문 밖의 해석으로 열어 둡니다.
  alternative_readings:
  - 세례의 표지로 명시하기
  - 단순한 표식으로 약화하기
  rationale: 헤르마스에서는 인장이 상징적으로 자주 사용되지만, 이 절에서는 문맥상 복수의 상징을 한꺼번에 고정하기보다 독자가 본문 내 연결을 추적하도록 두는 편이 더 충실합니다.
  doctrine_reference: 상징어는 문맥을 보존하고 해석을 단정하지 않는 POB 원칙
