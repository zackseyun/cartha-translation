revisions:
- from: 먼저, 아무도 비방하지 마십시오. 비방하는 사람의 말을 기꺼이 듣지 마십시오. 그렇지 않고 듣는 너도 만일 듣는 그 비방하는 말을 믿으면 중상하는 자의 죄를 범하게 되리라. 그것을 믿으면 너 자신도 네 형제와 원망할 일이 있을 것이기 때문이다. 그러므로 너는 중상하는 자의 죄를 범하게 될 것이다.
  to: 무엇보다도 아무도 비방하지 마십시오. 또 비방하는 사람의 말을 հաճ거워하며 듣지도 마십시오. 그렇지 않으면, 듣는 여러분도 들은 그 비방을 믿을 경우 비방하는 사람의 죄에 대한 죄책이 있게 될 것입니다. 여러분도 그것을 믿으면, 여러분 자신이 여러분의 형제를 거슬러 말할 것을 갖게 되기 때문입니다. 그러므로 여러분은 비방하는 사람의 죄에 대한 죄책이 있게 될 것입니다.
  rationale: 원문의 반복 어휘와 논리적 조건문을 살리면서, 현대 표준 한국어 합쇼체로 다듬었습니다. 'κατὰ τοῦ ἀδελφοῦ σου'는 문맥상 형제에게 불리한 말을 갖게 된다는 뜻이므로 '형제를 거슬러 말할 것을 갖게 되다'로 옮겼습니다.
