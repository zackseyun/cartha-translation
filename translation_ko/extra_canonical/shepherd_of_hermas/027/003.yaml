  text: 비방은 악합니다. 그것은 안정을 모르는 악령으로서, 결코 평화롭지 않고 언제나 분열 가운데 거합니다. 그러므로 그것을 멀리하십시오. 그러면 모든 이와 더불어 언제나 풍요를 누리게 될 것입니다.
