    rationale: ‘멀리하라’, ‘네가 … 것이다’는 명령과 대명사 사용에서 현대 formal-polite 합쇼체가 아닙니다.
  - severity: medium
    issue: ‘중상’은 καταλαλία의 의미를 불필요하게 좁힐 수 있습니다.
    rationale: 본문은 거짓 고발에 한정하지 않고 남을 헐뜯는 말 전반을 다룹니다. ‘비방’이 더 적절합니다.
  - severity: low
