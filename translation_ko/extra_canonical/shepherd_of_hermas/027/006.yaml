revisions:
- from: 그러므로 주는 사람은 죄가 없다. 그는 수행할 직무를 주님께 받은 대로, 누구에게 주어야 하고 주지 말아야 할지 구별하지 않고 단순하게 그 일을 수행했습니다. 그리하여 이 직분은 단순하게 수행되었으므로 하나님 앞에 영광을 얻게 되었습니다. 그러므로 오직 이와 같이 하나님만을 섬기는 사람은 살리라.
  to: 그러므로 주는 사람에게는 책임이 없습니다. 그는 주님에게서 수행하도록 받은 봉사의 직무를, 누구에게 주고 누구에게 주지 말아야 할지를 구별하지 않고 순전하게 수행했습니다. 그러므로 이 봉사의 직무는 순전하게 수행되어 하나님 앞에서 영예롭게 되었습니다. 그러므로 이와 같이 순전하게 하나님을 섬기는 사람은 살 것입니다.
  rationale: 원문의 논리와 반복 어휘를 보존하면서, 원문에 없는 배타적 강조를 제거하고 미래 시제를 현대 합쇼체로 바로잡았습니다. ‘책임이 없습니다’는 문맥상 주는 사람이 수령자의 동기나 용도에 대해 책임을 지지 않는다는 ἀθῷος의 뜻을 자연스럽게 반영합니다.
