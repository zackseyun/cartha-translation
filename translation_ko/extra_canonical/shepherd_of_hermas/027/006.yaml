review_pass:
  verdict: revise
  source_fidelity: 핵심 구조는 대체로 반영했으나, 마지막 문장의 ‘오직 ... 하나님만을’은 원문의 제한 표현이 아니며, 미래형 ζήσεται도 정확히 옮기지 못했습니다. 또한 διακονία는 여기서 반복되는 ‘봉사/섬김의 직무’로 일관되게 드러내는 것이 좋습니다.
  naturalness: 전반적으로 이해 가능하나 ‘하나님 앞에 영광을 얻게 되었습니다’보다 ‘하나님 앞에서 영예롭게 되었습니다’가 주어인 봉사 직무와 더 자연스럽게 연결됩니다. 종결을 현대 합쇼체 미래형으로 정리했습니다.
  terminology: ἀθῷος는 문맥상 ‘책임이 없습니다’로, διακονία는 ‘봉사의 직무’로 옮겼습니다. τῷ Θεῷ는 ‘하나님을 섬기는’으로 번역하되 원문에 없는 ‘오직’과 ‘만’을 제거했습니다.
  issues:
