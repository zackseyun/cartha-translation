    issue: ‘오직 이와 같이 하나님만을 섬기는’
    rationale: οὕτως ἁπλῶς διακονῶν τῷ Θεῷ에는 ‘오직’ 또는 ‘하나님만’이라는 배타적 제한이 없습니다. ‘이와 같이 순전하게 하나님을 섬기는’이 원문에 충실합니다.
  - severity: medium
    issue: ‘살리라’
    rationale: ζήσεται는 미래 직설법이므로 현대 합쇼체에서는 ‘살 것입니다’가 적절합니다.
  - severity: low
    issue: διακονία의 번역 연결
    rationale: ‘직무’와 ‘이 일을 수행’도 가능하지만, 본문이 강조하는 맡겨진 봉사의 수행을 ‘봉사의 직무’로 일관되게 나타내면 의미 연결이 더 분명합니다.
