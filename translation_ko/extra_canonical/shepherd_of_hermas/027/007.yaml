  naturalness: The proposed revision uses modern formal-polite Korean while retaining the compact exhortatory form of the Greek.
  terminology: ἁπλότης is rendered "순전함," fitting the ethical sense of sincerity/singleness rather than "온전함." μετάνοια is retained as "회개." ἀμίαντος is rendered "흠이 없다," conveying unstained/undefiled without importing a technical doctrinal sense.
  issues:
