    rationale: The Greek consistently addresses one person (σοι, σου); "너희" alters the referent.
  - severity: high
    issue: The clause concerning repentance has been substantively recast.
    rationale: The source speaks of the repentance of the addressee and of the household being found in simplicity, not of them repenting so as to appear in wholeness.
  - severity: medium
    issue: The textual uncertainty over "your" before "heart" is unrepresented.
    rationale: The supplied Greek encloses σου in brackets; a footnote preserves this uncertainty without forcing a reading.
