revisions:
- from: 그러므로 받는 사람들은 왜, 무엇을 받았는지 하나님께 답변할 것입니다. 환난 중에 받는 자는 심판을 받지 아니할 것이나 외식함으로 받는 자는 형벌을 받으리라.
  to: 그러므로 받는 사람들은 왜 받았는지, 또 무엇을 위해 받았는지 하나님께 해명해야 합니다. 곤경에 처해 받는 사람들은 심판을 받지 않겠지만, 외식하여 받는 사람들은 형벌을 받을 것입니다.
  rationale: 수령의 이유와 목적을 구별하는 원문의 병렬 구조를 회복하고, 하나님께 책임을 설명한다는 표현을 자연스러운 현대 한국어로 옮겼습니다. θλιβόμενοι는 특정한 종류의 고난으로 한정하지 않고 ‘곤경에 처해’로 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:49Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘무엇을 받았는지’는 그리스어 εἰς τί(‘무엇을 위하여/어떤 목적으로’)를 목적어로 바꾸어, 수령의 목적에 관한 원뜻을 놓칩니다. ‘답변할 것입니다’도 ἀποδώσουσιν λόγον(하나님께 설명·책임을 제시하다)의 책임성 있는 의미를 충분히 드러내지 못합니다. 나머지 대조와 판결/형벌의 진술은 대체로 충실합니다.
  naturalness: ‘환난 중에 받는 자’는 다소 문어적이고 상황이 불분명합니다. ‘곤경에 처해 받는 사람들’로 하면 θλιβόμενοι의 수동적 곤궁 상태를 자연스럽게 반영합니다. 합쇼체 문체는 유지됩니다.
  terminology: ‘하나님’, ‘심판’, ‘외식’, ‘형벌’은 적절합니다. 다만 ἐν ὑποκρίσει는 여기서 위선적인 동기나 가장하여 받는 방식을 가리키므로 ‘외식하여’가 자연스럽습니다.
  issues:
  - severity: high
    issue: εἰς τί의 목적 의미가 ‘무엇을 받았는지’로 번역되었습니다.
    rationale: 본문은 받았던 물건의 내용을 묻는 것이 아니라, 왜 받았으며 어떤 목적을 위해 받았는지를 하나님께 설명하게 된다고 말합니다.
  - severity: medium
    issue: ἀποδώσουσιν λόγον의 책임을 묻는 표현이 약화되었습니다.
    rationale: ‘답변할 것입니다’보다 ‘해명해야 합니다’가 하나님 앞에서 설명과 책임을 제출한다는 관용적 의미를 더 잘 전달합니다.
  revised_text: 그러므로 받는 사람들은 왜 받았는지, 또 무엇을 위해 받았는지 하나님께 해명해야 합니다. 곤경에 처해 받는 사람들은 심판을 받지 않겠지만, 외식하여 받는 사람들은 형벌을 받을 것입니다.
