revisions:
- from: 오직 단정함을 입으라 이는 악한 장애물이 없고 모든 것이 순조롭고 즐겁느니라 선한 일을 하십시오. 그리고 하나님께서 여러분에게 주시는 수고를 모든 사람에게 단순하게 나누어 주고, 누구에게 주어야 하고 누구에게 주지 말아야 할지 주저하지 마십시오. 모든 사람에게 주라. 하나님은 모든 사람이 자신의 은사로 주어지기를 원하시기 때문이다.
  to: 그러나 품위를 입으십시오. 그 안에는 악한 걸림돌이 전혀 없고, 모든 것이 평탄하고 기쁩니다. 선한 일을 하십시오. 하나님께서 여러분에게 주신 수고로 얻은 것 가운데서, 도움이 필요한 모든 이에게 꾸밈없이 주십시오. 누구에게 주고 누구에게 주지 말아야 할지를 망설이지 마십시오. 모든 이에게 주십시오. 하나님께서는 자신의 선물들 가운데서 모든 이에게 베풀어 주기를 원하시기 때문입니다.
  rationale: 원문의 대조 접속사, 품위와 걸림돌의 비유, 하나님이 주신 수고에서 베푼다는 표현, 수혜자를 가려 주지 말라는 권면, 그리고 하나님의 선물에서 모든 이에게 베풀어야 한다는 결론을 보존했습니다. 마지막 문장은 원문의 다소 압축된 표현을 한국어에서 명료하게 하되, 받는 이의 책임에 관한 다음 절의 내용을 앞당기지 않았습니다.
