review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 핵심 권면을 대체로 담았으나, ‘하나님께서 여러분에게 주시는 수고’는 원문의 ‘하나님께서 주신 수고에서’라는 표현을 한국어로 부자연스럽게 옮겼고, ‘모든 사람이 자신의 은사로 주어지기를’은 문법과 의미가 불명확합니다. 또한 ἁπλῶς의 ‘꾸밈없이/아낌없이’라는 방식과 ‘도움이 필요한 이들’이라는 한정이 더 분명해야 합니다.
  naturalness: 현대 표준어 합쇼체로 문장 종결과 명령형을 일관되게 정리했습니다. ‘단정함’은 가능하나 이 문맥의 σεμνότης에는 ‘품위’가 더 자연스럽고, ‘악한 장애물’보다 ‘악한 걸림돌’이 자연스럽습니다.
  terminology: θεός는 ‘하나님’으로 유지했습니다. σεμνότης는 ‘품위’, πρόσκομμα는 비유를 보존하여 ‘걸림돌’, κόποι는 하나님이 주신 수고의 결과까지 자연스럽게 드러내는 ‘수고로 얻은 것’으로 옮겼습니다. ἁπλῶς는 차별하거나 계산하지 않는 문맥에 따라 ‘꾸밈없이’로 번역했습니다.
  issues:
  - severity: medium
    issue: ‘하나님께서 여러분에게 주시는 수고’
    rationale: 원문은 하나님이 주신 수고(κόποι) ‘가운데서’ 베풀라고 합니다. 초안은 ‘수고를 모든 사람에게 나누어 준다’로 읽혀 수고 자체를 나누는 듯하며 한국어도 부자연스럽습니다.
  - severity: high
    issue: ‘하나님은 모든 사람이 자신의 은사로 주어지기를 원하시기 때문이다’
    rationale: 원문의 ‘하나님께서는 자신의 선물들 가운데서 모든 이에게 주어지기를 원하신다’는 뜻이 불분명하고, 초안은 ‘모든 사람’이 주어지는 것처럼 문법적으로 어색합니다.
  - severity: medium
    issue: 명령형 종결의 혼용
    rationale: ‘입으라’, ‘하라’, ‘주라’와 ‘하십시오’, ‘마십시오’가 섞여 있어 요청된 현대 합쇼체에 맞게 통일해야 합니다.
