  text: Τῇ δὲ δευτέρᾳ ὁράσει εἶδες αὐτὴν ἑστηκυῖαν καὶ τὴν ὄψιν νεωτέραν ἔχουσαν καὶ ἱλαρωτέραν παρὰ τὸ πρότερον, τὴν δὲ σάρκα καὶ τὰς τρίχας πρεσβυτέρας. ἄκουε, φησίν, καὶ ταύτην τὴν παραβολήν. 2. ὅταν πρεσβύτερός τις, ἤδη ἀφηλπικὼς ἑαυτὸν διὰ τὴν ἀσθένειαν αὐτοῦ καὶ τὴν πτωχότητα, οὐδὲν ἕτερον προσδέχεται εἰ μὴ τὴν ἐσχάτην ἡμέραν τῆς ζωῆς αὐτοῦ· εἶτα ἐξαίφνης κατελείφθη αὐτῷ κληρονομία, ἀκούσας δὲ ἐξηγέρθη καὶ περιχαρὴς γενόμενος ἐνεδύσατο τὴν ἰσχύν, καὶ οὐκέτι ἀνάκειται, ἀλλὰ ἕστηκεν, καὶ ἀνανεοῦται αὐτοῦ τὸ πνεῦμα τὸ ἤδη ἐφθαρμένον ἀπὸ τῶν προτέρων αὐτοῦ πράξεων, καὶ οὐκέτι κάθηται, ἀλλὰ ἀνδρίζεται· οὕτως καὶ ὑμεῖς, ἀκούσαντες τὴν ἀποκάλυψιν ἣν ὑμῖν ὁ Κύριος ἀπεκάλυψεν. 3. ὅτι ἐσπλαγχνίσθη ἐφ’ ὑμᾶς, καὶ ἀνενεώσατο τὰ πνεύματα ὑμῶν, καὶ ἀπέθεσθε τὰς μαλακίας ὑμῶν, καὶ προσῆλθεν ὑμῖν ἰσχυρότης καὶ ἐδυναμώθητε ἐν τῇ πίστει, καὶ ἰδὼν ὁ Κύριος τὴν ἰσχυροποίησιν ὑμῶν ἐχάρη· καὶ διὰ τοῦτο ἐδήλωσεν ὑμῖν τὴν οἰκοδομὴν τοῦ πύργου, καὶ ἕτερα δηλώσει, ἐὰν ἐξ ὅλης καρδίας εἰρηνεύετε ἐν ἑαυτοῖς.
