base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020.yaml
  text: 'But in the second vision you saw her standing, with a countenance[a] younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.


    “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he rises up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage[b]. So also you, when you heard the revelation that the Lord revealed to you.


    “For he had compassion on you and renewed your spirits, and you put away your softness[c]; strength came to you and you were strengthened in faith[d]; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower[f], and he will make other things known, if, with a whole heart, you are at peace among yourselves[e].”'
  footnotes:
  - marker: a
    text: “Countenance” translates ὄψις, which can mean face or appearance; the point is her visibly younger, more cheerful look.
    reason: lexical_alternative
  - marker: b
    text: “Takes courage” renders ἀνδρίζεται, literally “acts like a man,” an idiom for showing courage.
    reason: lexical_alternative
  - marker: c
    text: '“Softness” (μαλακία) in ancient moral language denotes laxity or lack of resolve, not a gendered slur in this context. Alternatives: “weakness,” “cowardice.”'
    reason: cultural_note
  - marker: d
    text: “In faith” could also be read “in the faith”; the Greek uses the article with an abstract noun.
    reason: lexical_alternative
  - marker: e
    text: “Be at peace among yourselves” renders εἰρηνεύετε ἐν ἑαυτοῖς, an idiom for mutual peace within the community.
    reason: cultural_note
  - marker: f
    text: The “building of the tower” refers back to the tower imagery earlier in this vision, where the tower symbolizes the community being built.
    reason: cross_reference
translation:
  language: ko
  text: '둘째 환상에서 너희는 그녀가 서 있는 것을 보았습니다. 얼굴은 전보다 더 젊고 더 즐거웠지만, 살과 머리털은 더 늙어 보였습니다. 「들으십시오,」라고 그녀가 말했습니다. 「이 비유도 들으십시오.


    「어떤 늙은이가 있습니다. 그는 자기의 약함과 가난 때문에 이미 자기 자신에 대한 희망을 버리고, 자기 생애의 마지막 날밖에는 아무것도 바라지 않습니다. 그러다가 갑자기 유산이 그에게 남겨집니다. 그것을 듣고 그는 일어나고, 매우 기뻐하여 힘을 입습니다. 그는 더 이상 눕지 않고 서 있으며, 그의 영은—이미 이전의 행위들로 인해 부패해 있었지만—새로워집니다. 더 이상 앉아 있지 않고 용기를 냅니다[b]. 이와 같이 너희도 주님께서 너희에게 계시하신 계시를 들었을 때 그러했습니다.


    「주님께서 너희를 불쌍히 여기시고 너희의 영들을 새롭게 하셨으며, 너희는 너희의 나약함을 벗어 버렸습니다[c]. 힘이 너희에게 왔고, 너희는 믿음 안에서 강해졌습니다[d]. 주님께서 너희의 강해짐을 보시고 기뻐하셨습니다. 그러므로 주님은 너희에게 탑의 건축을 알리셨고[f], 너희가 마음을 다하여 서로 평화를 이루고 있으면[e] 다른 것들도 알려 주실 것입니다。」[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  english_pob_choice: countenance
  chosen_korean: 얼굴
  alternatives_korean:
  - 용모
  - 겉모습
  lexicon: LSJ
  rationale: ἑστηκυῖαν 및 뒤의 살·머리털과 함께 대비되는 외관을 살리되, 한국어에서는 자연스럽게 ‘얼굴’로 옮겨 젊고 즐거운 인상을 드러냈습니다.
- source_word: ἱλαρωτέραν
  english_pob_choice: more cheerful
  chosen_korean: 더 즐거웠지만
  alternatives_korean:
  - 더 기쁨에 찬
  - 더 환한
  lexicon: BDAG
  rationale: ὄψις의 외적 인상과 맞물려 밝고 기쁜 표정을 나타내는 말로 옮겼습니다.
- source_word: παραβολήν
  english_pob_choice: parable
  chosen_korean: 비유
  alternatives_korean:
  - 우화
  - 예화
  lexicon: BDAG
  rationale: 해설적 짧은 비교라는 장르를 한국어 성경 문체에 맞게 ‘비유’로 번역했습니다.
- source_word: ἐξηγέρθη
  english_pob_choice: he rises up
  chosen_korean: 그는 일어나고
  alternatives_korean:
  - 그는 일어서고
  - 그는 깨어나고
  lexicon: BDAG
  rationale: 부활적/각성적 뉘앙스보다 자세의 연쇄를 살리는 동작 표현으로, 앞뒤의 눕다–서다–앉다 대비를 유지했습니다.
- source_word: ἀνδρίζεται
  english_pob_choice: takes courage
  chosen_korean: 용기를 냅니다
  alternatives_korean:
  - 남자답게 행동합니다
  - 담대해집니다
  lexicon: BDAG
  rationale: 직역의 성별 어감을 피하면서도 관용적 의미인 담대함을 드러내는 표현을 택했습니다.
- source_word: μαλακίας
  english_pob_choice: softness
  chosen_korean: 나약함
  alternatives_korean:
  - 연약함
  - 무기력
  lexicon: LSJ
  rationale: 문맥상 도덕적 해이보다 힘없는 태도/결의 부족을 가리키므로, 한국어에서 오해를 줄이는 ‘나약함’을 사용했습니다.
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  english_pob_choice: be at peace among yourselves
  chosen_korean: 서로 평화를 이루고
  alternatives_korean:
  - 서로 평안하게 지내고
  - 너희 자신들 가운데 평화를 누리고
  lexicon: BDAG
  rationale: 상호적 공동체 평화를 뜻하는 관용구로 이해하여, 자연스럽고 공동체적인 한국어로 옮겼습니다.
theological_decisions:
- issue: Κύριος의 지시 대상
  chosen_reading: ‘주님’으로 옮겨, 계시하고 기뻐하시는 주체로서 하나님의 주권을 드러냈습니다.
  alternative_readings:
  - 주인
  - 주
  rationale: 문맥상 계시와 기쁨의 원천이 신적 주체이므로, 공손한 신학 용어 ‘주님’을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md — Contested terms: κύριος → Lord'
- issue: ‘믿음 안에서’의 의미
  chosen_reading: ‘믿음 안에서 강해졌습니다’로 옮겨 내적 신뢰의 회복을 강조했습니다.
  alternative_readings:
  - 그 믿음 안에서
  - 신앙 안에서
  rationale: 본문은 공동체의 내적 신뢰가 강화되는 과정을 말하므로, 교리적 체계어보다 직접적인 ‘믿음’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md — Contested terms: πίστις → faith'
