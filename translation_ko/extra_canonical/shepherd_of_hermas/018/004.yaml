  text: 그녀가 떠나가실 때, 나는 그녀가 나에게 나타나셨던 세 가지 모습에 관하여 나에게 밝혀 달라고 그녀에게 물었습니다. 그녀가 나에게 대답하여 말씀하셨습니다. “이 일에 대해서는 다른 이에게 물어야 합니다. 그래야 그것이 당신에게 밝혀질 것입니다.”
