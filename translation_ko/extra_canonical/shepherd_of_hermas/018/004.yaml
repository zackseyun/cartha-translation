review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the narrative, but it weakens ἀποκαλύψῃ (‘reveal’) into ‘tell’ and renders ἕτερον (‘another [person]’) as ‘another person’ without preserving the indefinite wording. Its final clause also shifts the passive ‘that it may be revealed to you’ into the active-resultative ‘then you too will know.’
  naturalness: The Korean is understandable, but ‘그 여자가’ is unnecessarily distancing after ‘그녀,’ and ‘가면서’ is less precise than ‘떠나가실 때/떠나가시는 동안’ for ὑπάγουσαν. A more natural formal-polite rendering can retain the source’s respectful direct speech.
  terminology: ‘모습’ is suitable for μορφαί in this context. ‘밝히다/드러내다’ better represents the revelation language (ἀποκαλύπτω) than the generic ‘말하다.’
  issues:
  - severity: medium
    issue: ἀποκαλύψῃ is rendered as ‘말해 달라고.’
    rationale: The Greek specifically asks her to reveal the significance/details concerning the three forms; ‘밝혀 달라’ preserves this disclosure language.
  - severity: medium
    issue: The reply’s ἕτερον and passive ἵνα ... ἀποκαλυφθῇ are not represented closely.
    rationale: ‘다른 이에게 물어야 합니다. 그래야 그것이 당신에게 밝혀질 것입니다’ preserves both the indefinite ‘another’ and the passive revelation formulation.
  - severity: low
    issue: ‘그 여자가’ is stylistically inconsistent and distancing.
    rationale: The referent is the same female figure already designated ‘그녀’; ‘그녀가’ is more natural and cohesive.
  revised_text: 그녀가 떠나가실 때, 나는 그녀가 나에게 나타나셨던 세 가지 모습에 관하여 나에게 밝혀 달라고 그녀에게 물었습니다. 그녀가 나에게 대답하여 말씀하셨습니다. “이 일에 대해서는 다른 이에게 물어야 합니다. 그래야 그것이 당신에게 밝혀질 것입니다.”
