review_pass:
  verdict: revise
  source_fidelity: 초안은 대체로 본문의 권면과 경고를 따르지만, 수·인칭과 문체가 혼용되어 있고, σκολιότης, ἐκ καταχύματος, ἀσυνκρασία, τόπον 등의 의미가 일부 부정확하거나 불명료합니다. 특히 ‘망대’는 본문의 반복되는 πύργος(탑)와 일관되지 않으며, 마지막의 본문상 불확실한 수식어는 각주로 밝혀야 합니다.
  naturalness: ‘되옵소서’, ‘하느니라’, ‘자들아’, ‘하노라’와 합쇼체가 섞여 있어 현대 표준어 합쇼체로 통일이 필요합니다. ‘가진 사람과 부족한 사람과 공유하지 않는 당신’은 문장 구조가 부자연스럽고 의미가 불명확합니다.
  terminology: ἁγιασθῆτε는 ‘거룩하게 되십시오’, σκολιότης는 도덕적 ‘그릇됨’, ἀσυνκρασία는 ‘절제하지 못함’, πύργος는 ‘탑’으로 옮겼습니다. Θεός는 ‘하나님’, Κύριος는 ‘주님’으로 구별했습니다. [ἀσχέτων]은 전승상 불확실하므로 ‘쓸모없는’이라는 번역에 각주를 붙였습니다.
  issues:
  - severity: high
    issue: 문체와 인칭의 혼용
    rationale: ‘너’, ‘당신’, ‘너희’, ‘되옵소서’, ‘하느니라’, ‘하십시오’가 혼재합니다. 목표 문체인 현대 합쇼체 및 복수 청자에 맞추어 ‘여러분’과 ‘-십시오’로 통일해야 합니다.
  - severity: medium
    issue: 핵심 어휘와 구문의 부정확성
    rationale: ‘구부러진 것’은 σκολιότης의 도덕적 의미를 충분히 전달하지 못하며, ‘풍성하게 나누어 혼자만 먹지 말고’는 ‘풍족하게 혼자서만 누리지 말고’라는 원문의 대비를 뒤집습니다. ‘있을 곳’은 선행을 할 ‘기회/여지’가 없다는 뜻입니다.
  - severity: medium
    issue: πύργος 번역 불일치
    rationale: 같은 상징물 πύργος를 ‘탑’과 ‘망대’로 달리 옮겼습니다. 문맥 전체의 반복을 살려 ‘탑’으로 통일합니다.
  - severity: medium
    issue: 불확실한 그리스어 [ἀσχέτων] 미표시
    rationale: ‘쓸모없는 재물’의 근거가 되는 어휘는 제시된 본문에서 대괄호로 표시되어 있어 전승상 불확실성을 각주로 보존해야 합니다.
