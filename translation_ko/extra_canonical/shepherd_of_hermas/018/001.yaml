revisions:
- from: 모든 악과 모든 구부러진 것에서 거룩하게 되옵소서. 그러나 너는 네 악에서 떠나기를 원하지 않는다. 이제 내 말을 듣고 서로 화목하며 서로 돌보고 지지하십시오. 그리고 하나님의 창조물을 풍성하게 나누어 혼자만 먹지 말고, 궁핍한 사람들에게도 나누어 주십시오. 어떤 사람들은 많은 음식으로 말미암아 육체를 약하게 하고 육체를 망하게 하느니라. 그러나 먹을 것이 없는 자의 육체는 영양분이 부족하여 썩고 그 몸은 썩어가느니라. 그렇다면 이러한 절도 부족은 가진 사람과 부족한 사람과 공유하지 않는 당신에게 해롭습니다. 다가올 심판을 바라보십시오. 그러므로 부유한 자들아, 탑이 아직 완성되지 않았을 때 주린 자들을 찾으라. 망대를 다 건축한 후에 너희가 선한 일을 하고 싶어 할 것이나 너희가 있을 곳은 없을 것이기 때문이라. 그러므로 너희 재물을 자랑하는 너희는 깨어 있으라 그렇지 아니하면 궁핍한 자들이 탄식하며 그들의 탄식이 주님께 상달되며 너희도 너희 쓸데없는 물건과 함께 망대 문밖에 쫓겨날까 하노라
