  rationale: 원문의 문단 구성과 권면·경고의 흐름을 유지하면서 현대 표준어 합쇼체로 일관되게 다듬었습니다. ‘탑’의 상징어를 통일하고, 풍요와 궁핍의 대비 및 탑 완성 전의 시급성을 더 정확히 반영했습니다. 마지막 재물 수식어의 본문상 불확실성은 각주로 처리했습니다.
