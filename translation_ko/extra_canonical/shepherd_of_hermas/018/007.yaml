    issue: ‘주님를’의 조사 오류 및 종결·인용부호 부재
    rationale: 목적격 조사는 ‘주님을’이어야 하며, 대화문은 화자 전환과 합쇼체 종결을 명확히 해야 합니다.
  - severity: low
    issue: ‘세 형태’ 및 ‘두 마음’의 다소 직역적인 표현
    rationale: μορφῶν은 환상에서 보인 인물의 모습들을, διψυχίαι는 두 마음을 품는 상태를 뜻하므로 한국어 표현을 조금 다듬는 것이 자연스럽습니다.
