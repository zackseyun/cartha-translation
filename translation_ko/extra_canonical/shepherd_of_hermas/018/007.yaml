  source_fidelity: 핵심 의미는 그리스어와 영어 감사 번역을 대체로 충실히 옮겼습니다. 다만 μορφαί는 여기서 세 차례 나타난 여인의 서로 다른 ‘모습/형상’을 가리키므로 ‘세 모습’이 더 자연스럽고, διψυχίαι는 단순히 ‘두 마음’이라고만 하기보다 두 마음을 품는 상태를 드러내는 편이 의미를 분명히 합니다.
  naturalness: 현 초안은 문장부호가 없어 대화의 전환이 불분명하고, ‘주님를’은 조사의 명백한 오류입니다. 현대 표준어 합쇼체에 맞추어 직접 화법과 존대 종결을 정리할 필요가 있습니다.
  terminology: κύριε/Κύριον은 문맥상 ‘주님’으로 일관되게 옮길 수 있습니다. πρεσβυτέρα는 앞선 환상의 인물을 가리키므로 ‘연로한 여인’으로 옮겼습니다. διψυχίαι는 교리적으로 특정 해석을 덧붙이지 않고 ‘두 마음을 품는 것’으로 번역했습니다.
  issues:
