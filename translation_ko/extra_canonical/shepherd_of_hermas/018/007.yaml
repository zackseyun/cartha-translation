revisions:
- from: 내가 대답하여 이르되 주여 내가 구하는 것은 이것뿐이니 늙은 여인의 세 형태에 관한 계시가 완전하게 되기를 원하나이다. 그가 내게 대답하여 이르되 너희가 언제까지 어리석게 지내겠느냐 오히려 너희의 두 마음으로 어리석게 되고 너희 마음이 주님를 향하지 아니하니라
  to: '내가 그에게 대답하여 말하였습니다. “주여, 제가 구하는 것은 이것 하나뿐입니다. 연로한 여인의 세 모습에 관하여 계시가 완전해지게 해 주십시오.”


    그가 내게 대답하여 말하였습니다. “너희가 언제까지 깨닫지 못하겠느냐? 오히려 너희가 두 마음을 품기 때문에 깨닫지 못하는 것이며, 너희 마음이 주님을 향하고 있지 않기 때문이다.”'
  rationale: 원문의 대화 구조와 요청의 한정(‘이것 하나뿐’)을 보존하면서, 명백한 조사 오류를 바로잡고 현대 표준어 합쇼체로 문장을 정리했습니다. ‘두 마음을 품기’는 διψυχίαι의 비유적·복수형 표현을 과도하게 교리화하지 않고 자연스럽게 반영합니다.
