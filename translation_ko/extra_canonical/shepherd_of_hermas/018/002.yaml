review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 핵심 권면의 흐름을 대체로 따르지만, φαρμακοί를 ‘중독자들’로 옮긴 것은 원문 및 영어 감사 번역의 ‘poisoners’와 맞지 않습니다. 또한 복수 청자에게 단수 ‘당신’을 사용하고, ‘원하지 아니하느니라’의 부정 구문이 원문의 뜻을 흐리며, ‘이제’는 원문의 νῦν을 충실히 반영하되 합쇼체 문체로 다듬는 것이 좋습니다.
  naturalness: 초안에는 ‘선두에 있는 자들’, ‘겉껍질로 덮여 있으므로’, ‘직고하게 되리라’처럼 현대 표준어 합쇼체로는 부자연스럽거나 문체가 섞인 표현이 있습니다. ‘교회의 지도자들’, ‘완고하게 굳어져’, ‘보고드리게 하십시오’로 정리하면 현대적이고 자연스럽습니다.
  terminology: φαρμακοί/φάρμακα의 반복과 비유를 살려 ‘독약을 쓰는 자들’ 및 ‘약물과 독’으로 옮겼습니다. πρωτοκαθεδρίταις는 문자적으로 ‘으뜸 자리에 앉은 이들’로 번역하고 주석으로 설명했습니다. παιδεύειν/παιδεία는 문맥상 ‘가르치다/가르침’으로 일관되게 번역했습니다.
  issues:
  - severity: high
    issue: ‘중독자들은 마약을’
    rationale: φαρμακοί는 여기서 중독자가 아니라 약물·독을 다루는 자, 영어 감사 번역의 문맥에서는 ‘독약을 쓰는 자들/독살자들’입니다. ‘마약’도 원문의 일반적 φάρμακα보다 지나치게 협소합니다.
  - severity: high
    issue: 복수 호칭과 단수 대명사의 혼용
    rationale: 원문은 일관되게 복수 청자에게 말합니다. ‘여러분’ 뒤의 ‘당신은’을 복수로 바로잡아야 합니다.
  - severity: medium
    issue: ‘겉껍질로 덮여 있으므로 … 원하지 아니하느니라’
    rationale: ἐνεσκιρωμένοι ἐστὲ는 완고하게 굳은 상태를 나타내는 비유이며, 이어지는 οὐ θέλετε는 ‘원하지 않습니다’입니다. 초안은 인과 관계와 부정의 범위를 부자연스럽게 만들었습니다.
  - severity: medium
    issue: ‘선두에 있는 자들’, ‘직고하게 되리라’
    rationale: 전자는 πρωτοκαθεδρίταις의 좌석·지위 비유를 충분히 드러내지 못하고, 후자는 고어적 문체입니다. 현대 합쇼체에 맞게 고쳤습니다.
  revised_text: 그러므로 이제 나는 교회의 지도자들과 으뜸 자리에 앉은 이들에게 말합니다. 독약을 쓰는 자들처럼 되지 마십시오. 독약을 쓰는 자들은 자기들의 약물을 상자에 넣어 가지고 다니지만, 여러분은 약물과 독을 마음속에 지니고 있습니다. 여러분은 완고하게 굳어져, 마음을 깨끗하게 하고 깨끗한 마음으로 생각을 하나로 합하여 위대한 왕께 자비를 받으려 하지 않습니다. 그러므로 자녀들아, 여러분의 이러한 분열이 여러분의 생명을 빼앗을까 조심하십시오. 여러분 자신에게는 가르침이 없으면서, 어떻게 주님의 택하신 이들을 가르치려 하십니까? 그러므로 서로를 가르치고 서로 화목하십시오. 그러면 나도 아버지 앞에 기쁘게 서서 여러분 모두를 위하여 여러분의 주님께 보고드리게 하겠습니다.
  revised_footnotes:
  - marker: a
    text: ‘으뜸 자리에 앉은 이들’은 그리스어 πρωτοκαθεδρίταις를 옮긴 말로, 공동체 안에서 높은 자리나 주도적 지위를 차지한 이들을 가리킵니다.
    reason: 현대 한국어 독자에게 문자적 좌석 표현의 사회적 의미를 설명합니다.
  - marker: b
    text: ‘독약을 쓰는 자들’과 ‘약물’은 그리스어 φαρμακοί와 φάρμακα를 옮긴 말입니다. φάρμακον은 약이나 독을 모두 뜻할 수 있으며, 여기서는 이어지는 ‘독’과의 병치 때문에 해로운 약물의 비유가 두드러집니다.
    reason: 원문의 의도적인 약/독 어휘 반복과 의미 범위를 보존합니다.
  revision_rationale: 원문을 우선하여 νῦν οὖν, 복수 청자, φαρμακοί/φάρμακα의 비유, ἐνεσκιρωμένοι의 완고함, παιδεύειν/παιδεία의 반복, 그리고 ‘아버지 앞에서 … 주님께 보고하다’라는 결말을 충실히 반영했습니다. 영어 감사 번역의 의미도 확인했으나, 영어판에서 생략된 선행 담화표지 ‘Now’는 그리스어에 명시되어 있으므로 한국어에는 ‘그러므로 이제’로 반영했습니다.
