revisions:
- from: 이런 일들 때문에 나는 매우 괴로워했고 이 계시를 알고 싶었습니다. 그리고 나는 밤에 환상 중에 그 나이 많은 여인이 나에게 “모든 일에 겸손이 필요하니 금식하라 그리하면 주께 구하는 것을 받으리라”고 말하는 것을 보았습니다. 내가 어느 날 금식하고 있는데 그 날 밤에 한 청년이 내게 나타나서 이르되 너희가 기도하면서 계시를 구하니 많은 것을 구하여 너희 육체를 해칠까 조심하라 이 계시가 너희에게 족하도다 네가 본 것보다 더 큰 계시를 볼 수 있느냐?
  to: 이 일들 때문에 나는 이 계시를 알고 싶어 매우 괴로워했습니다. 그런데 나는 밤의 환상에서 그 연로한 여인이 내게 이렇게 말하는 것을 보았습니다. “모든 질문에는 겸손이 필요합니다. 그러므로 금식하십시오. 그러면 주님께 구하는 것을 받게 될 것입니다.” 그래서 나는 하루 동안 금식했습니다. 바로 그날 밤 한 젊은이가 내게 나타나 이렇게 말했습니다. “네가 기도하면서 계시들을 구하고 있으니, 많은 것을 구하다가 네 육신을 해치지 않도록 조심하십시오. 이 계시들로 네게는 충분합니다. 네가 본 것들보다 더 강력한 계시들을 볼 수 있겠습니까?”
  rationale: 원문의 질문, 금식, 환상, 계시의 복수, 그리고 더 강력한 계시라는 비교 표현을 보존했습니다. 원문이 청년의 발화 안에서 단수 2인칭을 사용하므로 이를 ‘네’로 유지하되, 전체 번역의 합쇼체 요구에 맞추어 문장 종결은 현대적인 존대형으로 정리했습니다.
