revisions:
- from: 형제 여러분, 작년에 있었던 첫 번째 환상에서 그 여자는 나이가 많아 의자에 앉아 있는 모습으로 나에게 나타났습니다. 그리고 두 번째 환상에서 그녀의 모습은 더 젊어졌지만 그녀의 살과 머리카락은 더 늙었습니다. 그녀가 서서 나에게 말했습니다. 그리고 그녀는 전보다 더 명랑해졌습니다. 그리고 세 번째 환상에서 그녀는 완전히 더 젊고 아름다움이 가장 뛰어났습니다. 단지 그녀의 머리카락만 더 오래되었습니다. 그리고 그녀는 끝까지 유쾌하게 쿠션이 있는 좌석에 앉았습니다.
