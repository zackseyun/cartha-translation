revisions:
- from: 그러나 주님의 크신 긍휼이 너와 네 집을 긍휼히 여기사 너를 굳세게 하시고 그의 영광 중에 너를 굳게 세우시리라 다만 게으르지 말고, 용기를 내어 집안을 튼튼하게 하십시오. 망치질하는 대장장이가 자기가 의도한 일을 완수하는 것처럼 날마다 말하는 의로운 말이 모든 악을 이긴다. 그러므로 자녀를 훈계하는 일을 그치지 마십시오. 만일 그들이 마음을 다하여 회개하면 거룩한 자들과 함께 생명책에 기록될 줄을 내가 아노라.
  to: 그러나 주님의 풍성한 긍휼이 너와 네 집에 자비를 베푸셨고, 그분께서 너를 굳세게 하시며 자신의 영광 가운데 굳게 세우실 것입니다. 다만 게으르지 말고 용기를 내어 네 집을 굳세게 하십시오. 대장장이가 자기 일을 망치로 두드려 자신이 원하는 것을 이루어 내듯이, 날마다 전해지는 의로운 말도 모든 악을 이깁니다. 그러므로 자녀들을 훈계하기를 그치지 마십시오. 그들이 온 마음으로 회개하면 거룩한 자들과 함께 생명의 책들에 기록될 것임을 내가 알고 있습니다.
  rationale: 원문의 미래 시제, 권면, 비유의 구조를 유지하되, 현대 표준어 합쇼체에 맞게 문체를 통일했습니다. ‘날마다 전해지는 의로운 말’은 원문의 다소 압축된 표현을 과도하게 해석하지 않고 자연스럽게 재현합니다. ‘생명의 책들’은 원문의 복수형을 보존합니다.
