revisions:
- from: 그녀는 이 말을 멈추고 나에게 “내가 읽는 것을 듣고 싶나요?”라고 말했습니다. 그리고 저는 “그렇습니다, 아가씨”라고 말합니다. 그녀는 나에게 “듣는 사람이 되어 하나님의 영광을 들어라”고 말했습니다. 나는 내가 기억할 수 없는 크고 놀라운 일들을 들었습니다. 그 말은 다 무서웠기 때문입니다. 사람이 감당할 수 없는 말이었기 때문입니다. 그래서 나는 마지막 말이 우리에게 유익하고 온화했기 때문에 다음과 같은 말씀을 기억했습니다.
  to: '그녀가 이 말씀을 마치자, 그녀는 나에게 말씀하셨습니다. “내가 낭독하는 것을 듣고 싶으십니까?” 나도 말했습니다. “원합니다, 여주인님.” 그녀는 나에게 말씀하셨습니다. “듣는 이가 되어 하나님의 영광을 들으십시오.” 나는 매우 크고 놀라운 것들을 들었지만 기억할 수 없었습니다. 모든 말씀이 두려워서 사람이 감당할 수 없는 것이었기 때문입니다. 그러나 마지막 말씀들은 우리에게 유익하고 온화했으므로, 나는 그것들을 기억했습니다:'
  rationale: 원문의 역사적 현재를 한국어의 자연스러운 과거 서술로 통일했습니다. 호칭, 낭독, 두려운 말씀의 이유절, 그리고 ‘마지막 말씀들’의 지시를 원문에 맞게 바로잡았으며, 이어지는 인용을 예고하는 콜론을 유지했습니다.
