  source_fidelity: 초안은 전체 전개를 대체로 따르지만, κυρία를 ‘아가씨’로 옮긴 것은 화자에게 사용되는 존칭 호칭과 맞지 않습니다. 또한 ‘모든 말이 무서웠기 때문입니다. 사람이 감당할 수 없는 말이었기 때문입니다’는 한 원인절을 부자연스럽게 중복합니다. 마지막에 기억한 것은 ‘다음과 같은 말씀’이 아니라 ‘마지막 말씀들’입니다.
  naturalness: 합쇼체의 직접화법과 서술 시제를 일관되게 정리하고, ‘읽는 것’을 낭독의 의미가 드러나도록 다듬었습니다. ‘듣는 사람이 되어’는 명령의 뜻을 보존하면서 자연스럽게 옮겼습니다.
  terminology: κυρία는 여기서 ‘여주인님’으로 옮겨 호칭의 존중을 보존했습니다. ‘하나님의 영광’은 δόξας의 문맥상 집합적 표현으로 번역했으며, 특정 교리적 해석을 덧붙이지 않았습니다.
