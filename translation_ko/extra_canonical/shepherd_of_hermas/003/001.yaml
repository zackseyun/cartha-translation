revisions:
- from: 하나님이 너희에게 진노하시는 것은 이로 인한 것이 아니요 오직 너희 가족이 주님와 그 부모에게 범죄하여 돌이키게 하려 하심이니라 그런데도 네가 네 자녀를 사랑하여 네 집 사람을 훈계하지 아니하고 도리어 그 집이 망하게 하였느니라 이 때문에 주님께서는 당신에게 진노하십니다. 그러나 그분은 네 집안의 과거의 모든 악을 고쳐 주실 것이다. 그들의 죄와 불법으로 말미암아 당신도 세상 일로 멸망하였나이다.
  to: 하나님께서 당신에게 진노하시는 것은 이 일 때문이 아니라, 죄를 지은 당신의 집안을 주님께로, 또 그들의 부모인 우리에게로 돌이키게 하시려는 것입니다. 그러나 당신은 자녀를 지나치게 사랑하여 당신의 집안을 훈계하지 않고, 그것이 심하게 타락하도록 내버려 두었습니다. 그러므로 주님께서 당신에게 진노하십니다. 그러나 그분께서는 당신의 집안에서 전에 일어난 모든 악한 일을 고쳐 주실 것입니다. 그들의 죄와 불법 때문에 당신 자신도 세상살이의 일들로 말미암아 쇠약해졌습니다.
