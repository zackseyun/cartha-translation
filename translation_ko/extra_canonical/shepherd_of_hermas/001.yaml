base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess [1]? Did I not always respect you as a sister? Why are you falsely accusing me, woman, of these wicked and unclean things?"


    She laughed and says to me, "Evil desire has risen up into your heart [2]. Or does it not seem to you a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his honor is established in the heavens [3], and he has the Lord readily reconciled [4] in every affair of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves [5], who exult in their wealth, and who do not hold fast to the good things that are coming.


    "Will their souls repent [6]—those who have no hope, but have despaired of themselves and of their life? But you—pray to God, and he will heal your sins [7], and those of your whole household, and of all the holy ones [8]."'
translation:
  language: ko
  text: '"내가 말했습니까? 내가 언제나 당신을 여신처럼 여기지 않았습니까? 내가 언제나 당신을 자매로 공경하지 않았습니까? 어찌하여 이 여자여, 당신은 이 악하고 부정한 일들로 나를 거짓 고발합니까?"


    그는 나를 향해 웃으며 말했습니다. "악한 욕망이 당신의 마음속에 솟아올랐습니다 [2]. 아니면 의로운 사람에게 악한 욕망이 마음속에 올라오는 것이 악한 일로 보이지 않습니까? 그것은 참으로 죄입니다—큰 죄입니다, 라고 그녀가 말했습니다. 의로운 사람은 의로운 일을 생각하기 때문입니다. 그러므로 의로운 일을 생각함으로써 그의 명예는 하늘들에 세워지고 [3], 그는 자기의 모든 일에서 주님과 쉽게 화해하게 됩니다 [4]. 그러나 마음속에서 악을 꾀하는 사람들은 자신에게 죽음과 포로 됨을 불러옵니다—특히 이 현재 세상을 자기 것으로 삼는 사람들 [5], 자기 부를 자랑하는 사람들, 그리고 다가오는 좋은 것들을 굳게 붙들지 않는 사람들입니다.


    "그들의 영혼이 회개하겠습니까 [6]—그들은 소망이 없고, 자기 자신과 자기 삶에 대해 절망한 사람들입니다. 그러나 당신은 하나님께 기도하십시오. 그러면 그분이 당신의 죄들과 [7] 당신 온 집안의 죄들, 그리고 모든 성도들의 죄들을 고치실 것입니다 [8]."[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς θεὰν / ὡς ἀδελφήν
  english_pob_choice: regard you as a goddess / respect you as a sister
  chosen_korean: 당신을 여신처럼 여기지 않았습니까 / 당신을 자매로 공경하지 않았습니까
  alternatives_korean:
  - 여신으로 여기지 않았습니까 / 자매로 대하지 않았습니까
  - 여신처럼 생각하지 않았습니까 / 자매처럼 존중하지 않았습니까
  lexicon: θεά, ἀδελφή
  rationale: POB의 대조를 살리되, θεά는 직역에 가까운 ‘여신’, ἀδελφή는 단순한 친족 표현보다 관계적 존중을 드러내는 ‘자매로 공경하다’로 옮겼습니다.
- source_word: καταψεύδῃ
  english_pob_choice: falsely accusing
  chosen_korean: 거짓 고발합니까
  alternatives_korean:
  - 거짓말합니까
  - 허위로 비난합니까
  lexicon: καταψεύδομαι
  rationale: 단순한 ‘거짓말’보다 타인에 대한 허위 진술의 뉘앙스를 살려, 문맥상 상대를 향한 거짓 고발로 옮겼습니다.
- source_word: ἁμαρτία ... μεγάλη
  english_pob_choice: It is indeed a sin—and a great one
  chosen_korean: 그것은 참으로 죄입니다—큰 죄입니다
  alternatives_korean:
  - 그것은 참으로 죄입니다—매우 큰 죄입니다
  - 그것은 죄입니다—실로 중대한 죄입니다
  lexicon: ἁμαρτία
  rationale: 원문의 강조 구조를 유지하면서 ‘큰 죄’로 단호하게 번역해 죄의 중대성을 분명히 했습니다.
- source_word: κατορθοῦται ἡ δόξα αὐτοῦ ἐν τοῖς οὐρανοῖς
  english_pob_choice: his honor is established in the heavens
  chosen_korean: 그의 명예는 하늘들에 세워지고
  alternatives_korean:
  - 그의 영광은 하늘에 확립되고
  - 그의 명예는 하늘에서 굳게 서고
  lexicon: δόξα
  rationale: 영광/명예의 긴장을 고려해 POB의 ‘honor’를 따르되, 복수형 ‘하늘들’은 원문의 τοῖς οὐρανοῖς을 반영했습니다.
- source_word: εὐκατάλλακτον ἔχει τὸν Κύριον
  english_pob_choice: has the Lord readily reconciled
  chosen_korean: 주님과 쉽게 화해하게 됩니다
  alternatives_korean:
  - 주님과 쉽게 화목하게 됩니다
  - 주님을 쉽게 달래게 됩니다
  lexicon: καταλλάσσω
  rationale: 직역보다 관계 회복의 뜻이 분명한 ‘화해’로 옮기되, εὐ-의 용이함은 ‘쉽게’로 반영했습니다.
theological_decisions:
- issue: “those who secure this present age for themselves”의 해석
  chosen_reading: 이 현재 세상을 자기 것으로 삼는 사람들
  alternative_readings:
  - 이 시대를 확보하는 사람들
  - 이 현재 세상을 차지하는 사람들
  rationale: POB의 해석을 따라 현재 질서를 소유물처럼 붙드는 태도를 드러내는 표현으로 옮겼습니다.
  doctrine_reference: 세속적 소유욕과 종말론적 대비
- issue: “their souls will repent”의 인격화된 회개
  chosen_reading: 그들의 영혼이 회개하겠습니까
  alternative_readings:
  - 그들의 영혼이 돌이키겠습니까
  - 그들이 회개하겠습니까
  rationale: 원문의 의문형과 영혼 주어를 유지해, 단순 정보가 아니라 절망한 존재의 가능성에 대한 수사적 질문으로 남겼습니다.
  doctrine_reference: 회개와 소망의 상실
