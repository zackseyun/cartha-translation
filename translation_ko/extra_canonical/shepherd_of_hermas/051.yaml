base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051.yaml
  text: 'I say, "Sir[a], I do not understand these parables, nor am I able to grasp them unless you explain them[b] to me."


    He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the instructions of your prudence[c] will fill his own soul and will pray on your behalf to the Lord.


    "If, then, you complete the fast in this way as I commanded you, your sacrifice[h] will be acceptable with God, and this fast will be recorded[d]; and the service[e] performed in this way is good and cheerful[f] and welcome to the Lord.


    "You shall keep these things thus—you, with your children and your whole household; and having kept them you will be blessed; and as many as, on hearing them, keep them will be blessed—for from the Lord they will receive understanding[g], and it is from him that one receives it."


    I say to him, "Sir[a], since I have you with me, I must ask you and question you; for you show me everything and speak with me. But if apart from you I were seeing or hearing them, I would have asked the Lord to make them clear to me."'
translation:
  language: ko
  text: '내가 말합니다. 「주님, 저는 이 비유들을 알지 못하며, 주님께서 그것들을 저에게 풀어 주시지 않으면 그것들을 깨달을 수도 없습니다.」


    그가 말합니다. 「내가 모든 것을 너에게 풀어 주겠다. 그리고 내가 너와 함께 말하는 것은 무엇이든 너에게 보여 주겠다. 네 분별의 가르침을 받은 사람은 자기 영혼을 채우고, 너를 위해 주님께 기도할 것이다.


    그러므로 내가 네게 명한 대로 네가 이 금식을 이렇게 마치면, 네 제사는 하나님께 기쁘게 받아들여질 것이며, 이 금식은 기록될 것이다. 또 이렇게 행해지는 봉사는 좋고 기쁜 것이며, 주님께 기쁘게 받아들여진다.


    너는 너와 네 자녀와 온 집안과 함께 이 일들을 이렇게 지켜야 한다. 그리고 그것들을 지킨 너는 복되며, 그것들을 듣고 지키는 사람들도 모두 복되다. 그들은 주님으로부터 분별력을 받을 것이며, 그것을 주시는 분은 그분이십니다.」


    내가 그에게 말합니다. 「주님, 제가 주님을 곁에 모시고 있으니, 저는 주님께 여쭙고 묻지 않을 수 없습니다. 주님께서 제게 모든 것을 보여 주시고 저와 함께 말씀하시기 때문입니다. 그러나 주님을 떠나 그것들을 보고 듣고 있었다면, 저는 그것들이 저에게 분명히 알려지게 해 달라고 주님께 구했을 것입니다.」[a][b][c][d][e][f][g][h]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  english_pob_choice: Sir
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 주인님
  lexicon: κύριος
  rationale: 이 본문은 존칭 호칭이지만, 같은 대화 안에서 주님(Κύριε)께 기도하고 주님께로부터 분별력을 받는다는 진술이 이어져 단순한 사회적 호칭보다 종교적·존칭적 울림을 함께 살리는 편이 원문에 더 가깝습니다.
- source_word: παραβολὰς
  english_pob_choice: parables
  chosen_korean: 비유들
  alternatives_korean:
  - 우화들
  - 비유적인 말들
  lexicon: παραβολή
  rationale: 원문의 비유 담화 형식을 그대로 드러내기 위해 표준적인 ‘비유들’을 택했습니다.
- source_word: ἐπιλύσῃς
  english_pob_choice: explain / explain them
  chosen_korean: 풀어 주시지
  alternatives_korean:
  - 설명해 주시지
  - 해석해 주시지
  lexicon: ἐπιλύω
  rationale: 단순한 정보 전달보다 난해한 내용을 ‘풀다’는 뉘앙스가 있어, 본문 전체의 해석 행위를 자연스럽게 살립니다.
- source_word: ἐντολάς / φροσύνης
  english_pob_choice: instructions of your prudence
  chosen_korean: 분별의 가르침
  alternatives_korean:
  - 신중함의 명령
  - 지혜의 명령
  lexicon: ἐντολή / φρόνησις
  rationale: 영어 POB의 'prudence'는 단순한 지식이 아니라 실천적 분별을 가리키므로, 한국어에서는 ‘분별’과 ‘가르침’을 결합해 그 성격을 드러냈습니다.
- source_word: θυσία
  english_pob_choice: sacrifice
  chosen_korean: 제사
  alternatives_korean:
  - 희생
  - 희생제물
  lexicon: θυσία
  rationale: 금식과 병렬되는 예배 행위의 맥락이므로, 한국어 성경 전통에서 가장 직접적인 대응인 ‘제사’를 사용했습니다.
- source_word: λειτουργία
  english_pob_choice: service
  chosen_korean: 봉사
  alternatives_korean:
  - 예배
  - 섬김
  - 공적 봉사
  lexicon: λειτουργία
  rationale: 문맥상 금식의 수행 방식 자체를 가리키므로, 너무 제의적으로 고정하지 않고 행위의 실천성을 살리는 ‘봉사’를 선택했습니다.
- source_word: σύνεσιν
  english_pob_choice: understanding
  chosen_korean: 분별력
  alternatives_korean:
  - 이해
  - 깨달음
  lexicon: σύνεσις
  rationale: 영어 POB가 'understanding'으로 풀었지만, 본문은 주님으로부터 받는 실천적 분별을 말하므로 ‘분별력’이 더 정확합니다.
theological_decisions:
- issue: ‘Sir’와 이어지는 Κύριε의 한국어 호칭 처리
  chosen_reading: 본문의 호칭을 일관되게 ‘주님’으로 옮겨, 인물에 대한 공손한 호칭과 신적 존칭의 중첩을 그대로 드러냈습니다.
  alternative_readings:
  - 선생님으로 낮추어 번역
  - 첫 항만 주님, 이후는 선생님으로 번역
  rationale: 직역적 사회호칭보다 문맥 안에서의 경건한 대화 양식이 더 중요하며, 이어지는 ‘주님께 기도한다’와의 연결도 자연스럽습니다.
  doctrine_reference: 문맥상 경칭과 예배적 존칭의 중첩
