base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019.yaml
  text: '“Listen,” he says[1], “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your softness and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep,[1] so also you, having been softened by the affairs of life, have handed yourselves over to negligence,[2] and you did not cast your anxieties upon the Lord;[4] instead your mind has been shattered, and you have grown old in your sorrows.”


    “Why then was she seated in a chair? I would like to know, sir.”[3] “Because every weak person sits in a chair because of his weakness, in order that the weakness of his body may be steadied[a][5][4][3][2]. You have the pattern of the first vision.”[5]'
  footnotes:
  - marker: '1'
    text: “Sleep” is a common early Christian euphemism for death.
    reason: cultural_note
  - marker: '2'
    text: The Greek term is ἀκηδία (“acedia”), meaning neglect, lack of care, or listless indifference.
    reason: lexical_alternative
  - marker: '3'
    text: Vocative κύριε here is a respectful “sir,” addressed to the interpreter; distinct from “the Lord” (God) in the previous clause.
    reason: cultural_note
  - marker: '4'
    text: Compare 1 Peter 5:7, which uses the same verb (“cast”) for placing anxieties upon the Lord.
    reason: cross_reference
  - marker: '5'
    text: “Pattern” translates τύπος, which can also mean “type,” “figure,” or “model”; here it denotes the explanation corresponding to the first vision.
    reason: lexical_alternative
  - marker: a
    text: Or '“Why then was she seated in a chair? I wanted to know, sir.”'.
    reason: previous_rendering
translation:
  language: ko
  text: '「들으십시오」라고 그가 말합니다. 「당신이 묻고 있는 세 가지 모양에 관하여 말입니다. 첫 번째 환상에서, 왜 그녀가 당신에게 늙은 여자이자 의자에 앉아 있는 모습으로 나타났습니까? 그것은 당신의 영이 늙었고 이미 시들었으며, 당신의 약함들과 두 마음 때문에 힘이 없기 때문입니다. 마치 노인들이 더는 새로워질 희망이 없어서 자기들의 잠밖에는 아무것도 기대하지 않는 것처럼, 당신들도 삶의 일들 때문에 약해져서 무기력에 자신을 내맡겼고, 당신의 염려를 주님께 던져 올리지 않았습니다. 그리하여 당신의 마음은 부서졌고, 당신은 슬픔들 가운데서 늙어 버렸습니다.」


    「그렇다면 왜 그녀는 의자에 앉아 있었습니까? 저는 알고 싶습니다, 선생님.」 「왜냐하면 모든 약한 사람은 자기의 약함 때문에 의자에 앉으니, 그 몸의 약함이 지탱되게 하려는 것입니다. 당신은 첫 번째 환상의 본을 가지고 있습니다.」[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  english_pob_choice: forms
  chosen_korean: 모양
  alternatives_korean:
  - 형태
  - 모습
  - 형상
  lexicon: LSJ
  rationale: 환상에서 보이는 외적 형상을 가리키므로, 지나치게 철학적이지 않으면서 시각적 이미지를 살리는 ‘모양’을 택했습니다.
- source_word: μαλακιῶν / μαλακισθέντες
  english_pob_choice: softness / having been softened
  chosen_korean: 약함들 / 약해져서
  alternatives_korean:
  - 부드러움들 / 부드러워져서
  - 나약함들 / 나약해져서
  - 무기력 / 무기력해져서
  lexicon: LSJ
  rationale: POB의 번역 논의가 이 표현을 도덕적·영적 쇠약으로 읽고 있으므로, 현대 한국어에서 자연스럽고 같은 이미지 흐름을 유지하는 ‘약함들 / 약해져서’를 사용했습니다.
- source_word: ἀκηδία
  english_pob_choice: negligence
  chosen_korean: 무기력
  alternatives_korean:
  - 태만
  - 무관심
  - 아케디아
  lexicon: LSJ
  rationale: 본문의 핵심은 삶의 일들에 압도되어 돌봄과 긴장이 사라진 상태이므로, 현대 독자가 바로 이해할 수 있는 ‘무기력’을 본문에 두고, 전통 용어는 각주 없이 과도한 전문화를 피했습니다.
- source_word: μερίμνας
  english_pob_choice: anxieties
  chosen_korean: 염려
  alternatives_korean:
  - 걱정들
  - 근심들
  - 불안들
  lexicon: BDAG
  rationale: 복수형의 구체적 짐을 살리면서도 자연스러운 한국어로는 ‘염려’가 가장 안정적이어서, 동사 ‘던져 올리지 않았습니다’와 함께 압박감을 유지했습니다.
- source_word: ἐπερίψατε
  english_pob_choice: cast
  chosen_korean: 던져 올리지 않았습니다
  alternatives_korean:
  - 던지지 않았습니다
  - 내맡기지 않았습니다
  - 맡기지 않았습니다
  lexicon: BDAG
  rationale: 1베드로 5:7과의 평행을 해치지 않으면서도, 원문의 동작성을 살리기 위해 ‘던져 올리다’로 옮겼습니다.
- source_word: Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  - 주인
  lexicon: BDAG
  rationale: 이 문맥에서는 하나님께 염려를 올려 드리는 뜻이 분명하므로, 공손한 신앙 언어인 ‘주님’을 사용했습니다.
- source_word: κύριε
  english_pob_choice: sir
  chosen_korean: 선생님
  alternatives_korean:
  - 주님
  - 주인이시여
  - 님
  lexicon: BDAG
  rationale: 해석자에게 드리는 정중한 호칭이므로, 신적 호칭과 혼동되지 않도록 ‘선생님’으로 옮겼습니다.
- source_word: τύπος
  english_pob_choice: pattern
  chosen_korean: 본
  alternatives_korean:
  - 모형
  - 패턴
  - 유형
  lexicon: BDAG
  rationale: 여기서는 첫 번째 환상에 상응하는 설명이라는 뜻이어서, 교훈적 뉘앙스를 살리는 ‘본’을 택했습니다.
theological_decisions:
- issue: τὸ πνεῦμα ὑμῶν의 의미
  chosen_reading: ‘당신의 영’은 성령이 아니라 사람의 내적 상태를 가리킵니다.
  alternative_readings:
  - 성령
  - 공동체의 영
  rationale: 문맥이 영적 쇠약과 도덕적 무기력을 설명하고 있으므로, 인간의 내면을 말하는 것으로 읽어야 합니다.
  doctrine_reference: 본문 문맥 우선; 인간 영과 성령 구분 유지
- issue: κοίμησιν의 처리
  chosen_reading: ‘잠’의 완곡어법을 본문에 유지했습니다.
  alternative_readings:
  - 죽음
  - 휴식
  rationale: 초기 기독교적 완곡어법을 보존해야 원문의 문체와 정서가 살아납니다.
  doctrine_reference: 완곡어법 보존 원칙
