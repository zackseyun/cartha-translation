theological_decisions:
- issue: δοῦλοι τοῦ Θεοῦ의 한국어 처리
  chosen_reading: 하나님의 종들
  alternative_readings:
  - 하나님의 노예들
  - 하나님의 종들
  rationale: POB 기본 정책은 ‘slaves’이나, 이 구절에서는 ‘하나님의 소유됨’보다 ‘하나님께 속해 섬기는 사람들’이라는 기능이 더 전면에 있어 한국어 독자에게는 ‘종들’이 의미를 더 안정적으로 전달합니다.
  doctrine_reference: 'Translation philosophy: contested terms (δοῦλος).'
- issue: πνεῦμα θεῖον과 πνεῦμα ἅγιον의 구별
  chosen_reading: ‘신적인 영’과 ‘성령’을 구별해 옮김
  alternative_readings:
  - 모두 ‘성령’으로 통일
  - 모두 ‘하나님의 영’으로 통일
  rationale: Hermas는 신적 성질(theios)과 거룩함(hagios)을 구별해 사용하므로, 이를 구분해 번역해야 저자의 영감론과 판별 논리가 흐려지지 않습니다.
  doctrine_reference: Hermas's angelology and pneumatology; lexical distinction between theios and hagios.
- issue: πᾶν γὰρ πνεῦμα ἀπὸ Θεοῦ δοθὲν οὐκ ἐπερωτᾶται의 구조
  chosen_reading: ‘하나님께로부터 주어진 영은 아무도 묻지 않습니다’
  alternative_readings:
  - ‘하나님께로부터 주어진 모든 영은 묻지 않는다’
  - ‘하나님께로부터 주어진 영은 질문받지 않는다’
  rationale: 그리스어의 부정 일반화는 ‘아무도 묻지 않는다’로 자연스럽게 풀어야 하며, 점술적 상담을 금하는 논지를 분명히 드러냅니다.
  doctrine_reference: Greek syntax in a negative general statement; corroborated by the English audit correction.
