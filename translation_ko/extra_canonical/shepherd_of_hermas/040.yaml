  text: "1[2]. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the slaves of God—of the double‑minded, not of the faithful.\n\n2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet[4], having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.\n\n3. For he, being empty, answers empty men with empty things; for whatever he is asked, he answers according to the emptiness of the person. But he also speaks some true words; for the devil fills him with his own spirit, if perhaps he may be able to tear away some of the righteous.\n\n4. Therefore, as many as are strong in the faith\
    \ of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.\n\n5. For no spirit given from God is consulted, but, having the power of the Deity, it speaks everything from itself, because it is from above, from the power of the divine Spirit.\n\n6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.\n\n7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.\n\
    \n8. First of all, the one who has the [divine] spirit from above is gentle and quiet and humble‑minded, and refrains from every evil and from the vain desire of this age, and makes himself lower than all people; and when consulted he answers nothing to anyone, nor does he speak privately—nor does the holy Spirit speak whenever a person wishes it to speak—but it speaks when God wishes him to speak.\n\n9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.\n\n10. Thus the spirit of the Deity will be made manifest. As for the spirit of the Deity of the Lord, this is its power.\n\n11. “Hear now,” he says, “about the spirit that is earthly and empty and has no power, but is foolish.\n\n12. First,\
    \ that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.\n\n13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.\n\n14. [Heaven.] \n\n19. “How,” I say, “sir, can these things be? For you have said both these things are impossible.” “As these, then, are impossible, so also the spirits that are earthly\
    \ are impossible and inert.\n\n20. Take now the power that comes from above. Hail is a very small pellet, and when it falls on a man’s head, how much pain it causes! Or again, take a drop that falls from the roof tile to the ground, and it bores through the stone.\n\n21. You see, then, that things from above, though very small when they fall upon the earth, have great power; so also the divine spirit that comes from above is powerful. Trust in this spirit[a][21][14][10][9][8], but keep away from the other.”"
  footnotes:
  - marker: '2'
    text: The bracketed clause “and according to the desires of their wickedness” is marked as secondary by some editors; the Greek source layer flags it as editorially uncertain.
    reason: textual_variant
  - marker: '4'
    text: “Like the nations” refers to pagan peoples (Gentiles) and their divinatory practices.
    reason: cultural_note
  - marker: '8'
    text: “Nor does he speak in private” renders κατὰ μόνας (“when alone/privately”). The point is that true prophecy is not dispensed on demand in private consultation.
    reason: cultural_note
  - marker: '9'
    text: “Angel of the prophetic spirit” reflects Hermas’s angelology, in which angelic beings oversee aspects of divine revelation and community life.
    reason: cross_reference
  - marker: '10'
    text: “The Deity” translates θεότης, a rare term also found in Col 2:9. It denotes divine nature/essence, not merely ‘divineness.’
    reason: cross_reference
  - marker: '14'
    text: The source layer preserves only the single word “heaven.” Most editions supply several lines here with two illustrative impossibilities; the omission likely reflects a lacuna in this OCR layer.
    reason: textual_variant
  - marker: '21'
    text: The contrast between things “from above” and “earthly” runs through this Mandate, culminating in the hail and drip images to illustrate true (from above) versus false (earthly) spirits.
    reason: cross_reference
  - marker: a
    text: Or 'For every spirit given from God is not consulted'.
    reason: previous_rendering
translation:
  language: ko
  text: "1. 그는 내게 사람들이 벤치에 앉아 있는 것과, 또 다른 사람이 의자에 앉아 있는 것을 보여 주셨습니다. 그리고 그분이 내게 말씀하셨습니다. “벤치에 앉아 있는 사람들을 보느냐?” 내가 대답했습니다. “보입니다, 주님.” “이 사람들은 신실한 사람들이고, 의자에 앉아 있는 사람은 거짓 예언자이다. 그는 하나님의 종들의 이해를—두 마음을 품은 사람들의 이해를, 신실한 사람들의 이해는 아니라—파괴한다.\n\n2. 그러므로 두 마음을 품은 사람들은 마치 마술사에게 가듯 그에게 가서 자기들에게 무슨 일이 일어날지 묻는다. 그러면 그 거짓 예언자는 자기 안에 신적인 영의 능력이 전혀 없으면서도, 그들의 질문에 따라 [그리고 그들의 악한 욕망에 따라] 그들과 이야기하고, 그들이 원하는 대로 그들의 영혼을 채워 줍니다.\n\n3. 그는 비어 있기 때문에 빈 사람에게 빈 것으로 대답합니다. 그가 무엇을 질문받든지, 그는 그 사람의 공허함에 따라 대답합니다. 그러나 그는 참된 말도 몇 마디 합니다. 악마가 그의 자기 영으로 그를 채우기 때문입니다. 그렇게 해서 혹시라도 의인들 중 일부를 떼어 내려고 합니다.\n\n4. 그러므로 주님의 믿음 안에서 강하고, 진리를 입은 사람들은 그런 영들에게 달라붙지 않고, 오히려 그것들로부터 멀리합니다. 그러나 두 마음을 품고 자주 회개하는 사람들은 이방 사람들처럼 점을 치며, 우상숭배를 함으로써 자기들에게 더 큰 죄를 가져옵니다. 어떤 일에 관해 거짓 예언자를 찾아가는 사람은, 진리에서 비어 있고 어리석은 우상숭배자이기 때문입니다.\n\n5. 하나님께로부터 주어진 영은 아무도 묻지 않습니다. 오히려 신성의 능력을 지니고 자기 자신으로부터 모든 것을 말합니다. 그것은 위로부터, 신적인 영의 능력으로부터 왔기 때문입니다.\n\n6. 그러나 사람들의 욕망에 따라 묻히고 말하는 영은 땅에 속하고 가벼우며 능력이 없습니다. 그리고 묻히지 않으면 전혀 말하지 않습니다.\n\n7. 내가 말했습니다. “그러면, 주님, 사람은 어느 쪽이 예언자이고\
    \ 어느 쪽이 거짓 예언자인지 어떻게 알겠습니까?” 그분이 말씀하셨습니다. “두 예언자에 관해 들으라. 그리고 내가 이제 너에게 말하려는 대로, 예언자와 거짓 예언자를 시험하여라. 신적인 영을 가진 사람은 그의 삶으로 시험하여라.\n\n8. 먼저, 위로부터 온 [신적인] 영을 가진 사람은 온유하고 조용하며 겸손하고, 모든 악과 이 시대의 헛된 욕망을 멀리하며, 자신을 모든 사람보다 더 낮게 여깁니다. 그리고 묻히더라도 아무에게도 아무 대답도 하지 않으며, 사적으로도 말하지 않습니다. —사람이 말하고 싶다고 해서 성령이 말하는 것도 아닙니다.— 오직 하나님께서 그를 말하게 하시고자 할 때에만 말합니다.\n\n9. 그러므로 신적인 영을 가진 사람이 신적인 영에 대한 믿음을 가진 의인들의 모임 안으로 들어가고, 그 사람들의 모임을 통해 하나님께 간구가 드려질 때, 그에게 배정된 예언하는 영의 천사가 그 사람을 채웁니다. 그리고 성령으로 채워진 그 사람은 주님께서 원하시는 대로 많은 사람에게 말합니다.\n\n10. 그러므로 신성의 영이 드러나게 될 것입니다. 주님의 신성의 영에 관해서는 이것이 그 능력입니다.\n\n11. 이제 땅에 속하고 비어 있으며 능력이 없고 어리석은 그 영에 관하여 들어라.\n\n12. 먼저, 영이 있다고 생각하는 그 사람은 자신을 높이고 으뜸 자리에 앉고 싶어 합니다. 그리고 곧바로 그는 무례하고 뻔뻔하며 말이 많아지고, 많은 사치와 다른 많은 속임수 속에서 지냅니다. 그리고 그는 자기 예언에 대한 보수를 받습니다. 그러나 받지 못하면 예언하지 않습니다. 신적인 영이 보수를 받고 예언할 수 있겠느냐? 하나님의 예언자는 그렇게 할 수 없다. 오히려 그런 예언자들의 영은 땅에 속한 것이다.\n\n13. 그 뒤로 그는 의인들의 모임에는 전혀 가까이하지 않고, 그들을 피합니다. 그는 두 마음을 품은 사람들과 비어 있는 사람들에게 달라붙어, 구석에서 그들에게 예언하고, 그들의 욕망에 따라 모든 것을 빈말로 말하며 그들을 속입니다. 그는 빈 사람들에게도\
    \ 대답하기 때문입니다. 빈 그릇이 빈 그릇들과 함께 놓이면 깨지지 않고 서로 잘 어울리는 것과 같습니다.\n\n14. [하늘.] \n\n19. 내가 말했습니다. “그렇다면, 주님, 이런 일들이 어떻게 일어날 수 있습니까? 당신께서는 이 두 가지 모두 불가능하다고 말씀하셨습니다.” “이것들이 불가능하듯이, 땅에 속한 영들도 불가능하며 무기력하다.\n\n20. 이제 위로부터 오는 능력을 보아라. 우박은 아주 작은 알갱이지만, 그것이 사람의 머리에 떨어지면 얼마나 아픔을 주느냐! 또 지붕기와에서 땅으로 떨어지는 물방울 하나를 보아라. 그것이 돌을 뚫는다.\n\n21. 그러므로 위로부터 오는 것들은, 비록 땅 위에 떨어질 때 아주 작아 보여도, 큰 능력을 가지고 있음을 보게 된다. 그와 같이 위로부터 오는 신적인 영도 능력이 있다. 그러므로 이 영을 믿고, 다른 영에게서는 멀리하라.”[a][b]"
