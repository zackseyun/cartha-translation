base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004.yaml
  text: 'So when she had finished reading and had risen from the chair[a], four young men came, lifted the chair, and went away toward the east.


    Then she called me over, touched my chest, and said to me, "Did my reading please you?" And I said to her, "Lady, these last things please me, but the earlier things are hard and harsh." But she said to me, "These last things are for the righteous, but the earlier are for the nations[b] and for the apostates."


    While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage[c], Hermas."'
  footnotes:
  - marker: a
    text: “These last things … the earlier things” refers to the latter and former parts of her reading, not to eschatological “last things.”
    reason: cultural_note
  - marker: b
    text: Or “Gentiles.”
    reason: lexical_alternative
  - marker: c
    text: Literally, “Act like a man.”
    reason: lexical_alternative
translation:
  language: ko
  text: '그 여자가 읽기를 마치고 의자에서 일어나자, 네 젊은이들이 와서 그 의자를 들어 동쪽으로 갔습니다.


    그러자 그 여자가 나를 불러 가까이 오게 하고 내 가슴을 만지며 나에게 말했습니다. "내가 읽은 것이 당신에게 좋았습니까?" 내가 그 여자에게 말했습니다. "부인, 이 마지막 부분들은 저에게 좋지만, 앞부분들은 어렵고 거칩니다." 그러자 그 여자가 나에게 말했습니다. "이 마지막 부분들은 의로운 사람들을 위한 것이고, 앞부분들은 이방인들과 배교자들을 위한 것입니다."


    그 여자가 나와 이야기하고 있는 동안 두 남자가 나타나 그녀를 팔꿈치들로 붙들고, 의자도 있던 곳, 곧 동쪽으로 갔습니다. 그 여자는 기쁘게 갔으며, 가는 동안 나에게 말했습니다. "용기를 내십시오, 헤르마스."[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγινώσκουσα / ἀνάγνωσις
  english_pob_choice: reading
  chosen_korean: 읽기 / 읽은 것
  alternatives_korean:
  - 낭독
  - 공적 낭독
  lexicon: BDAG
  rationale: 여기서는 여자가 실제로 읽는 장면이므로, liturgical 뉘앙스를 덧붙이지 않고 단순히 ‘읽기’로 옮겼습니다.
- source_word: καθέδρα
  english_pob_choice: chair
  chosen_korean: 의자
  alternatives_korean:
  - 자리
  - 좌석
  lexicon: LSJ
  rationale: 환상 속 구체적 물건이므로 일반적이면서도 눈에 보이는 ‘의자’가 가장 자연스럽습니다.
- source_word: ἀγκών
  english_pob_choice: elbows
  chosen_korean: 팔꿈치들
  alternatives_korean:
  - 팔
  - 팔뚝
  lexicon: LSJ
  rationale: 두 사람이 그녀를 붙드는 위치가 구체적이므로, 관절 부위를 살린 ‘팔꿈치들’로 옮겼습니다.
- source_word: ἄνδρίζου
  english_pob_choice: Take courage
  chosen_korean: 용기를 내십시오
  alternatives_korean:
  - 담대하십시오
  - 남자답게 하십시오
  lexicon: BDAG
  rationale: 직역하면 ‘사람답게/남자답게 하라’는 관용구이지만, 한국어에서는 그 뜻을 잘 전달하는 공손한 권면인 ‘용기를 내십시오’가 적절합니다.
- source_word: ἔθνη
  english_pob_choice: nations
  chosen_korean: 이방인들
  alternatives_korean:
  - 민족들
  - 열국
  lexicon: BDAG
  rationale: 이 문맥에서는 하나님 백성 밖의 사람들을 가리키므로, POB의 ‘nations’와 병행되도록 ‘이방인들’로 옮겼습니다.
- source_word: ἀποστάται
  english_pob_choice: apostates
  chosen_korean: 배교자들
  alternatives_korean:
  - 반역자들
  - 등 돌린 자들
  lexicon: LSJ
  rationale: 단순한 반항이 아니라 신앙 공동체에서 떨어져 나간 사람을 가리키므로, 종교적 이탈을 드러내는 ‘배교자들’이 맞습니다.
theological_decisions:
- issue: ἔσχατα / πρότερα의 의미 범위
  chosen_reading: 종말론적 ‘마지막 일들’이 아니라 읽은 내용의 ‘마지막 부분들 / 앞부분들’로 이해해 번역했습니다.
  alternative_readings:
  - 마지막 것들 / 먼저 것들
  - 나중 것들 / 먼저 것들
  rationale: POB 주석처럼 여기서는 문서의 앞뒤 부분을 가리키는 표현이지, 종말 사건을 말하는 것이 아니므로 한국어도 그 구분이 드러나게 했습니다.
  doctrine_reference: 문맥 주해
