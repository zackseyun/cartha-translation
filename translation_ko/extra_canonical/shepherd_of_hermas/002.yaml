base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002.yaml
  text: 'After she had spoken these words[1], the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”


    While I was considering these things and pondering them in my heart, I see before me a great white chair made of snowy wool. And an elderly woman came in most radiant clothing, holding a book in her hands, and sat down alone and greeted me, “Hermas, greetings.” And I, grieving and weeping, said, “Lady, greetings.”


    And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention, always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because of a most excellent woman, who said that I sinned against her.”


    But she said, “By no means does this matter apply to the slave of God. Yet surely a thought concerning her rose up in your heart. For such an intention brings sin upon the slaves of God. For it is an evil and startling intention for a most reverent spirit, and one already proven, if it should desire an evil deed—especially Hermas, the self-controlled one[a][8][7][6][5][4][3][2], who abstains from every evil desire and is full of all simplicity and great innocence.”'
  footnotes:
  - marker: '1'
    text: “Greetings” translates chaire; literally, “rejoice.”
    reason: lexical_alternative
  - marker: '2'
    text: “Seat” (kathédra) could also be taken as “chair”; some renderings choose “throne,” but the Greek term is neutral.
    reason: lexical_alternative
  - marker: '3'
    text: “Be gracious to me” (hilateuthē) can be translated “be propitiated toward me.” Likewise, “appease God” (exilasomai) could be “propitiate” or “make atonement to God.”
    reason: lexical_alternative
  - marker: '4'
    text: “Complete sins” renders teleios, which denotes completeness or perfection; here it intensifies the totality or gravity of the sins.
    reason: lexical_alternative
  - marker: '5'
    text: The “elderly woman” addressed as “Lady” will later be identified symbolically with the Church; see subsequent visions.
    reason: cross_reference
  - marker: '6'
    text: The material and color—“snow‑white wool”—echo apocalyptic purity imagery (cf. Dan 7:9), though here it is the seat that is woolen and white.
    reason: cross_reference
  - marker: '7'
    text: The rare adjective astomachētos is the opposite of being irritable or quick‑tempered (cf. stomachomai, “to be angry”).
    reason: cultural_note
  - marker: '8'
    text: “Spirit” here refers to a person’s inner disposition, not the Holy Spirit, as indicated by the context of a tested, proven character.
    reason: cultural_note
  - marker: a
    text: Or 'concerning my complete sins'.
    reason: previous_rendering
translation:
  language: ko
  text: '그 여인이 이런 말을 한 뒤에 하늘이 닫혔고, 나는 온몸이 떨리며 슬퍼하고 있었습니다. 나는 속으로 말했습니다. “이 죄가 내게 적혀 있다면, 내가 어떻게 구원을 받을 수 있겠습니까? 또는 내가 어떻게 하나님께 내 이미 저지른 죄들에 대해 속죄하겠습니까? 또 어떤 말로 주님께 청해야 그분이 내게 은혜를 베푸시겠습니까?”


    내가 이런 것들을 마음속에서 생각하며 분별하고 있을 때, 내 앞에 눈처럼 흰 양털로 된 커다란 흰 의자가 보였습니다. 그리고 매우 빛나는 옷을 입은 한 늙은 여인이 책을 손에 들고 와서, 혼자 앉아 나에게 인사했습니다. “헤르마스여, 평안하시오.” 나도 슬퍼하며 울면서 말했습니다. “부인, 평안하시오.”


    그녀가 나에게 말했습니다. “헤르마스여, 왜 그렇게 침울하시오? 늘 너그럽고 다투기를 좋아하지 않으며, 언제나 웃는 당신이 왜 이렇게 얼굴빛이 어둡고 즐겁지 않소?” 내가 그녀에게 말했습니다. “제가 그분께 죄를 지었다고 말한 아주 훌륭한 한 여인 때문입니다.”


    그러나 그녀는 말했습니다. “그런 일은 하나님의 종에게 전혀 해당되지 않습니다. 다만 분명히 그 일에 대한 생각이 당신의 마음에 올라온 것입니다. 그런 의도는 하나님의 종들에게 죄를 불러옵니다. 왜냐하면 악한 일을 바라게 된다면, 이미 증명된 지극히 경건한 영에게는 그런 의도야말로 악하고 놀라운 것이기 때문입니다. 특히 모든 악한 욕망을 멀리하고 모든 단순함과 큰 순수함으로 가득한 헤르마스 당신에게는 더욱 그렇습니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείσθησαν οἱ οὐρανοί
  english_pob_choice: the heavens were shut
  chosen_korean: 하늘이 닫혔고
  alternatives_korean:
  - 하늘들이 닫혔고
  - 하늘이 막혔고
  lexicon: LSJ / BDAG
  rationale: 복수형 ‘하늘들’의 묵시적 뉘앙스는 살릴 수 있으나, 한국어에서는 단수 ‘하늘’이 자연스럽고 종결 동작을 분명히 전합니다.
- source_word: πεφρικώς
  english_pob_choice: shuddering all over
  chosen_korean: 온몸이 떨리며
  alternatives_korean:
  - 몸서리치며
  - 전신이 떨리며
  lexicon: LSJ
  rationale: 문맥상 공포와 전율을 함께 나타내므로, 신체 전체 반응을 드러내는 표현으로 옮겼습니다.
- source_word: ἀναγράφεται
  english_pob_choice: is charged against me
  chosen_korean: 내게 적혀 있다면
  alternatives_korean:
  - 내게 기록되어 있다면
  - 내게 죄로 기록되어 있다면
  lexicon: BDAG
  rationale: 심판/장부 이미지의 ‘기록’ 의미를 살리되, 한국어에서는 ‘적혀 있다’가 가장 직접적이고 간결합니다.
- source_word: δοῦλος τοῦ Θεοῦ
  english_pob_choice: slave of God
  chosen_korean: 하나님의 종
  alternatives_korean:
  - 하나님의 노예
  - 하나님께 속한 종
  lexicon: BDAG
  rationale: 본문은 소속과 복속을 강하게 말하지만, 한국어 출판문맥에서는 ‘종’이 이 항목의 통상 번역으로서 오해를 줄이면서도 본질을 유지합니다. 다만 POB의 논점을 훼손하지 않도록 ‘하나님의 종’으로 유지했습니다.
theological_decisions:
- issue: δοῦλος(하나님의 종) 번역의 강도
  chosen_reading: ‘하나님의 종’으로 옮기되, 소속과 의무의 강한 관계를 유지합니다.
  alternative_readings:
  - 하나님의 노예
  - 하나님의 종이요 종속된 자
  rationale: 이 문맥은 신분적 귀속을 말하지만, 한국어에서 ‘노예’는 불필요한 현대적 오해를 크게 일으킬 수 있습니다. 그래서 의미는 보존하되 수용 가능한 교회 한국어의 범위 안에서 ‘종’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: contested terms / δοῦλος'
