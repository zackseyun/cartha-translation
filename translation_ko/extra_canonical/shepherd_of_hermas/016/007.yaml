revisions:
- from: 그러나 이것을 당신에게만 나타내신 것이 아니라, 모든 사람에게 알리시려는 것입니다. 헤르마스여, 사흘 후에 내가 네게 이르는 말을 너는 먼저 깨달을 것이요 내가 먼저 네게 명하노니 이 모든 것을 거룩한 자들의 귀에 고하여 그들이 듣고 행한 후에 그 악에서 깨끗함을 받고 너도 그들과 함께 깨끗함을 받게 하라.”
  to: 그러나 이것들이 당신에게만 계시된 것이 아니라, 당신이 모든 이에게 이것들을 알리도록 계시된 것입니다. 사흘 뒤에—당신이 먼저 이해해야 하기 때문입니다—헤르마스여, 내가 이제 당신에게 하려는 이 말들을 먼저 당신에게 명합니다. 이 모든 말을 성도들의 귀에 들려주십시오. 그들이 이 말을 듣고 행하여 자기들의 악행에서 깨끗하게 되고, 당신도 그들과 함께 깨끗하게 되도록 하십시오.”
  rationale: 원문의 직접화법과 삽입구를 보존하면서 현대 한국어 합쇼체로 문장을 재구성했습니다. ‘사흘 뒤에’가 뒤따르는 전달 명령에 연결됨을 드러냈고, 원문의 복수 지시어와 ‘악행들’을 반영했습니다.
