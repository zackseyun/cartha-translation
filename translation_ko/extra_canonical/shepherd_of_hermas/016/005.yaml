revisions:
- from: '"나는 원했어요, 아가씨, 그들 각각이 어떤 힘을 가지고 있는지 알고 싶었어요." "그들이 가지고 있는 능력을 들어보세요. 그들의 능력은 서로 결합되어 있고, 태어날 때와 같이 서로 따릅니다. 신앙에서 자제, 자제 단순성, 단순성 순진함, 순수함에서 위엄, 위엄 있는 지식, 그리고 지식 사랑이 나옵니다. 그러므로 이들의 일은 순수하고 위엄 있고 신성합니다. 그러므로 이것을 섬기고 그들의 일을 굳게 붙잡을 수 있는 사람은 누구든지 그의 영광을 얻게 될 것입니다. 하나님의 거룩한 자들과 함께 망대에 거하니라”'
  to: “저는 알고 싶습니다, 부인. 그들 각각이 어떤 능력을 지니고 있는지요.” 그가 말했습니다. “그들이 지닌 능력을 들으십시오. 그들의 능력은 서로에게 붙들려 있으며, 태어난 순서대로 서로를 따릅니다. 신앙에서 절제가 나고, 절제에서 순박함이 나며, 순박함에서 악의 없음이 나고, 악의 없음에서 품위가 나며, 품위에서 지식이 나고, 지식에서 사랑이 납니다. 그러므로 이들의 행위는 순결하고 품위 있으며 신성합니다. 그러므로 누구든지 이들을 섬기고 그들의 행위를 굳게 지켜 낼 수 있다면, 하나님의 거룩한 이들과 함께 그 망대 안에 거처를 얻게 될 것입니다.”
  rationale: 원문의 대화 형식, 덕목들의 의인화와 생성 순서, ‘서로에게 붙들려’라는 상호 결속의 비유, 그리고 망대 안의 거처라는 종말론적 결론을 보존했습니다. 현대 표준어 합쇼체로 문체를 통일했습니다.
