  source_fidelity: 원문 6–8절의 덕목 계열과 결론을 옮기려 했으나, 호칭·덕목의 계열·핵심 동사·결말에서 원문과 다른 내용이 있습니다. 특히 원문의 ‘망대 안에서 하나님의 거룩한 이들과 함께 거처를 얻는다’가 ‘그의 영광을 얻게 될 것입니다’로 바뀌어 있습니다.
