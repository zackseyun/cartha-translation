  terminology: κύρια는 여기서 ‘아가씨’보다 ‘부인’이 적절합니다. Πίστις는 ‘신앙’, Ἐγκράτεια는 ‘절제’, Ἁπλότης는 ‘순박함’, Ἀκακία는 ‘악의 없음’, Σεμνότης는 ‘품위’, Ἐπιστήμη는 ‘지식’, Ἀγάπη는 ‘사랑’으로 일관되게 옮겼습니다.
