  text: “그런데 여주인이시여, 다른 여인들은 누구입니까?” “그들은 서로의 딸들입니다. 그들의 이름은 단순함, 지식, 순수함, 존엄함, 사랑입니다. 그러므로 그들의 어머니가 하는 일을 모두 행하면, 당신은 살 수 있습니다.”
