revisions:
- from: 이제 그들의 기능을 들어보세요. 그 중 첫 번째, 그녀의 손을 꼭 잡은 사람은 믿음이라고 불립니다. 그녀를 통해 하나님의 택하신 자들이 구원을 얻느니라. 둘째, 띠를 띠고 용감하게 행동하는 사람은 절제라고 합니다. 그녀는 믿음의 딸입니다. 그러므로 그를 따르는 사람은 모든 악한 일을 멀리하고 모든 악한 욕망을 멀리하면 영생을 상속받을 것이라고 믿기 때문에 그의 삶에 복이 있습니다.”
  to: 이제 그들의 역할을 들으십시오. 그들 가운데 첫째, 두 손을 맞잡고 있는 이는 믿음이라 불립니다. 하나님의 택하신 이들은 이 믿음을 통하여 구원을 받습니다. 둘째, 허리에 띠를 띠고 용감하게 행하는 이는 절제라 불립니다. 그녀는 믿음의 딸입니다. 그러므로 누구든지 그녀를 따르는 이는 자신의 삶에서 복된 사람이 됩니다. 이는 그가 모든 악한 행위를 멀리할 것이며, 모든 악한 욕망을 멀리한다면 영생을 상속받게 될 것이라고 믿기 때문입니다.”
  rationale: 원문 16:3과 영어 audit trail을 대조하여, 첫째와 둘째 의인화된 덕목의 묘사 및 대명사 지시를 바로잡았습니다. 또한 원문의 미래적 결과와 조건절을 유지하면서 현대 한국어 합쇼체로 통일했습니다.
