revisions:
- from: 그리고 나는 그녀에게 시대에 대해 계속 물었습니다. 이미 끝이었는지 여부입니다. 그러나 그가 큰 소리로 부르짖어 이르되 어리석은 사람아 망대가 아직 건축하는 것을 보지 못하느냐 망대가 건축 중이면 무너져 내리나 속히 쌓이리라 더 이상 내게 묻지 말라 이 생각과 너희 심령의 소생함이 너와 성도들에게 족하도다
  to: 나는 그 여자에게 그 시기에 관하여 계속 물었습니다. “이미 종말이 왔습니까?” 그러자 그 여자가 큰 소리로 외쳤습니다. “분별없는 사람이여, 탑이 아직도 건축되고 있는 것이 보이지 않습니까? 그러므로 탑의 건축이 완성되면 끝에 이릅니다. 그러나 곧 건축될 것입니다. 더 이상 나에게 아무것도 묻지 마십시오. 이 일깨움과 여러분 영들의 새로워짐이면 그대와 성도들에게 충분합니다.”
  rationale: 원문의 화자 성별, 탑이 아직 건축 중이라는 비유, ‘완성되면 끝에 이름’이라는 표현을 보존했습니다. 원문에 없는 붕괴의 의미를 제거하고, ὑπόμνησις와 ἀνακαίνωσις를 각각 ‘일깨움’과 ‘영들의 새로워짐’으로 옮겼습니다. 직접 화법과 현대 합쇼체 문장을 정비했습니다.
