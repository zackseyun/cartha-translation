  source_fidelity: 원문에서 여성이 말하는 점, 아직 건축 중인 탑, 탑의 건축 완료와 끝, 곧 건축될 것이라는 진술이 핵심입니다. 초안은 화자를 남성으로 바꾸고, 탑이 무너진다는 내용을 삽입하여 원문 의미를 크게 훼손합니다.
  naturalness: 초안은 문장 경계와 인용 표지가 없고, ‘이미 끝이었는지 여부입니다’, ‘건축하는 것을’ 등 현대 한국어 합쇼체로 부자연스럽습니다. 문장과 직접 화법을 명료하게 정리해야 합니다.
  terminology: ‘망대’는 이 문맥에서 가능하지만 일반 독자에게 더 자연스러운 ‘탑’을 사용했습니다. ‘성도들’은 ἅγιοι를 전통적으로 옮기는 표현으로 유지하고, ὑπόμνησις는 ‘생각’이 아니라 ‘깨우침/상기’이므로 ‘일깨움’으로 바로잡았습니다.
