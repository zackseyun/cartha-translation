  naturalness: 초안에는 문장부호와 연결 표현이 부족하여 읽기 어렵고, ‘그에게 단번에 유업이 남아 있느니라’ 및 ‘흥분하여 기뻐하여’는 현대 표준어 합쇼체에 다소 부자연스럽습니다. 자연스러운 서술문으로 정리했습니다.
