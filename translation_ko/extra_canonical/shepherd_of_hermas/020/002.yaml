revisions:
- from: “노인이 이미 그 연약함과 가난으로 말미암아 자기에 대한 소망을 버리고 목숨의 마지막 날 외에는 아무것도 바라지 아니하거든 그에게 단번에 유업이 남아 있느니라 그가 듣고 흥분하여 기뻐하여 힘을 얻고 다시 눕지 아니하고 일어서며 그 심령이 새롭게 되어 다시 앉지 아니하고 담력을 얻느니라. 주님께서 당신에게 계시해 주셨습니다.
