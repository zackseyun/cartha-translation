  rationale: 원문의 비유 구조와 반복되는 대조(눕지 않고 일어섬, 앉지 않고 용기를 냄)를 보존했습니다. 누락된 ‘이전 행실’과 복수 청자를 복원했으며, 현 단락 끝의 구문이 다음 단락의 설명과 연결되는 원문상의 흐름을 한국어에서 최소한의 보충 서술로 자연스럽게 표현했습니다.
