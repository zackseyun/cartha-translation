  to: 그러나 둘째 환상에서는 당신이 그녀가 서 있는 것을 보았고, 그 모습은 전보다 더 젊고 더 밝았으나, 살과 머리카락은 더 늙어 보였습니다. “이 비유도 들어 보십시오.
