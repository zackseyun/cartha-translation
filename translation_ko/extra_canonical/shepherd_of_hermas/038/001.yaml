revisions:
- from: “그러므로 어리석은 자들아 들으라 근심이 성령을 약화시키고 또 구원하게 하느니라 두 마음을 품은 자가 무슨 일을 하고 그 두 마음으로 말미암아 실패하면 이 근심이 그 사람 속에 들어와 성령을 근심케 하고 약화시키느니라 또 어떤 일에 급한 성질이 붙어 심히 분개하면 다시 근심이 조급한 자의 마음에 들어와서 성령을 근심케 하느니라” 자기가 행한 일로 말미암아 근심하고 회개하니 이는 악한 일을 행하였음이니라 그러므로 이 슬픔은 구원을 가져다 주는 것 같습니다. 왜냐하면 그는 악한 일을 행한 후에 회개하였기 때문입니다. 그러므로 이 두 가지가 모두 성령을 근심케 하는 것입니다. 두 마음을 품는 것은 목적을 달성하지 못하기 때문입니다. 급한 성격은 악한 일을 행하므로 성령을 근심하게 합니다. 그러므로 둘 다 성령을 근심케 하는 자 곧 두 마음을 품고 ​​조급한 성품을 취하는 자니라. 그러므로 근심을 네게서 없애고 네 안에 거하시는 성령을 괴롭게 하지 말라 두렵건대 근심이 하나님께 호소하여 떠나지 않게 하라. 이 육체에 주신 하나님의 영은 슬픔과 고난을 견디지 아니하느니라.”
  to: “그러므로 들으십시오, 어리석은 자여. 근심이 어떻게 성령을 약화시키고 또다시 구원에 이르게 하는지를 말입니다. 두 마음을 품은 사람이 어떤 일을 시작하였다가 자기의 두 마음 때문에 그 일에 실패하면, 이 근심이 그 사람 안으로 들어가 성령을 근심하게 하고 약화시킵니다. 또 어떤 일로 성급한 분노가 사람에게 달라붙어 그가 몹시 격분하면, 다시 근심이 성급한 분노를 낸 사람의 마음에 들어갑니다. 그러면 그는 자신이 행한 일을 슬퍼하고, 악을 행하였기 때문에 회개합니다. 그러므로 이 근심은 구원에 이르는 듯합니다. 악을 행한 뒤에 그가 회개하였기 때문입니다. 그러므로 이 두 가지는 모두 성령을 근심하게 합니다. 두 마음을 품음은 자기가 시작한 일에 성공하지 못했기 때문이며, 성급한 분노는 악을 행했기 때문에 성령을 근심하게 합니다. 그러므로 두 마음을 품음과 성급한 분노, 이 둘은 모두 성령에게 괴로움이 됩니다. 그러므로 그대 자신에게서 근심을 없애고, 그대 안에 거하시는 성령을 괴롭게 하지 마십시오. 그렇지 않으면 성령께서 하나님께 간구하시고 그대에게서 떠나실지도 모릅니다. 이 육체에 주어진 하나님의 영은 근심이나 곤고함을 견디지 못합니다.”
  rationale: 원문의 문단 구조와 논리적 연결을 복원했습니다. 특히 성급한 분노 뒤에 일어나는 근심·회개를 그 행위자의 것으로 명확히 하고, ‘구원에 이르게 한다’는 첫 진술과 ‘구원에 이르는 듯하다’는 후속의 제한적 표현을 모두 보존했습니다. §5에서는 성령이 하나님께 간구하고 떠날 수 있다는 원문 주어를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
