review_pass:
  verdict: revise
  source_fidelity: 원문은 ‘어리석은 자여’라고 단수로 부르며, 근심이 성령을 ‘약화시키고/소모시키며’, 분노 뒤의 회개와 관련해서는 구원에 이르는 듯 보인다는 복합 논지를 전개합니다. 초안은 직접 인용의 경계가 §3 중간에서 잘못 끊기고, 회개·악행의 주체와 성령을 근심하게 하는 두 경우의 설명이 누락·혼선되었습니다. 또한 §5의 하나님께 간구하고 떠나는 주체는 근심이 아니라 성령입니다.
  naturalness: 개정문은 현대 표준어 합쇼체로 문장을 재구성하고, ‘근심케 하느니라’ 같은 고어적 종결과 비문을 피했습니다. ‘두 마음을 품음’, ‘성급한 분노’는 문맥상 자연스럽게 유지했습니다.
  terminology: πνεῦμα τὸ ἅγιον은 일관되게 ‘성령’으로, λύπη는 ‘근심’으로, ὀξυχολία는 단순한 성격 일반이 아니라 분노의 급발성을 나타내는 ‘성급한 분노’로 옮겼습니다. διψυχία는 신학적으로 과도하게 해석하지 않고 ‘두 마음을 품음’으로 번역했습니다.
  issues:
  - severity: high
    issue: 직접 인용의 범위와 화자의 발화가 §3에서 잘못 분절됨
    rationale: 원문에서 ‘그가 자기 행한 일을 슬퍼하고 회개한다’는 성급한 분노를 낸 사람에 대한 서술인데, 초안은 인용을 앞서 닫아 문법적·의미적 연결이 무너졌습니다.
  - severity: high
    issue: §3의 회개와 악행에 관한 절이 앞 문장과 분리되어 주체가 불명확함
    rationale: ὁ ὀξυχολήσας 및 αὐτοῦ는 분노한 사람을 가리키며, 그가 악을 행했기에 슬퍼하고 회개하는 것입니다.
  - severity: high
    issue: §5에서 하나님께 간구하고 떠나는 주체를 ‘근심’으로 처리함
    rationale: ἐντεύξηται와 ἀποστῇ의 주어는 ‘네 안에 거하시는 성령’입니다. 근심이 하나님께 호소한다는 초안은 원문과 다릅니다.
  - severity: medium
    issue: ‘어리석은 자들아’라는 복수 호칭
    rationale: 원문 ἀνόητε는 단수 호격이므로 ‘어리석은 자여’가 맞습니다.
  - severity: medium
    issue: 두 번째 사례에서 성령을 근심하게 하는 내용이 중복되고 회개의 인과가 탈락함
    rationale: 원문은 근심이 사람의 마음에 들어오고 그가 자신의 악행을 슬퍼하여 회개한다고 말한 뒤, 그 근심이 구원을 지닌 듯 보인다고 설명합니다.
  - severity: medium
    issue: ‘둘 다 성령을 근심케 하는 자’라는 사람 지칭
    rationale: 원문은 사람들을 지칭하지 않고 ‘두 마음을 품음과 성급한 분노’라는 두 상태/행태가 성령에게 괴로움이라고 합니다.
