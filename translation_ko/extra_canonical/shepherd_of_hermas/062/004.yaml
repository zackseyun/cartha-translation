    rationale: 원문 βλέπεις는 2인칭 단수입니다. 한국어에서는 ‘그대는’ 또는 주어 생략과 단수 존대 서술로 처리하는 편이 정확합니다.
  - severity: low
    issue: ‘무익하게 된’의 어색한 수식
    rationale: ἠχρειωμένας는 막대기가 쓸모없게 되거나 망가진 상태를 가리키므로 ‘쓸모없게 된’이 현대 한국어에서 더 자연스럽습니다.
