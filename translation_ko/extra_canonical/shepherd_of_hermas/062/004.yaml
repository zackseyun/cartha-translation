  source_fidelity: 원문의 2인칭 단수 관찰 표현과 미래형 결론을 반영해야 합니다. 또한 ῥάβδοι는 이 비유에서 각 사람에게 속한 ‘막대기들’이며, ἠχρειωμένας는 ‘무익하게 된’보다 ‘쓸모없게 된/망가진’이라는 뜻이 더 자연스럽습니다.
  naturalness: 초안의 ‘너희가 … 보느니라’, ‘임이니라’, ‘보리라’는 현대 표준어 합쇼체가 아니라 고전적 성경체입니다. 현대의 격식 있는 존댓말로 다듬는 것이 필요합니다.
  terminology: ‘율법’은 νόμος에 적절합니다. 상징물 ῥάβδοι는 ‘지팡이’보다 일반적인 ‘막대기’가 원문의 물리적 대상을 더 무리 없이 나타냅니다. κατοικία는 여기서 ‘거처’로 옮깁니다.
