revisions:
- from: “너희가 각 사람의 지팡이를 보느니라 지팡이는 율법임이니라 그러면 너희가 무익하게 된 많은 지팡이를 보리니 율법을 지키지 아니한 자를 다 알아보고 각 사람의 처소를 보리라.”
  to: “그대는 각 사람의 막대기들을 보십니다. 막대기들은 율법입니다. 그러므로 그대는 쓸모없게 된 많은 막대기들을 보십니다. 그러면 율법을 지키지 않은 모든 사람을 알게 될 것이며, 각 사람의 거처도 보게 될 것입니다.”
  rationale: 현대 합쇼체로 바꾸고, 원문의 단수 수신자와 ‘알게 될 것이다/보게 될 것이다’라는 미래적 진술을 보존했습니다. 비유의 상징 관계인 ‘막대기들=율법’도 명시적으로 유지했습니다.
