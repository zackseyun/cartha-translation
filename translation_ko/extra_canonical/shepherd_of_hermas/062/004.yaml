  text: “너희가 각 사람의 지팡이를 보느니라 지팡이는 율법임이니라 그러면 너희가 무익하게 된 많은 지팡이를 보리니 율법을 지키지 아니한 자를 다 알아보고 각 사람의 처소를 보리라.”
