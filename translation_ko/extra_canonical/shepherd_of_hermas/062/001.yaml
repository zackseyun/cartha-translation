  text: 내가 그에게 이르되 주여 이 나무가 무엇인지 내게 알게 하옵소서 가지가 많이 잘렸으나 나무가 건전하고 잘린 것이 하나도 없는 것 같으므로 내가 어안이 벙벙하니이다 그러므로 내가 어리둥절하노라
