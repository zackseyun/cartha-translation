  terminology: ‘선생님’은 여기서 존칭 κύριε를 현대 한국어로 자연스럽게 옮기며, 뒤따르는 설명의 화자 관계도 보존합니다. ‘가지’와 ‘나무’는 원문의 κλάδοι와 δένδρον에 적절히 대응합니다.
