  source_fidelity: 원문의 핵심 대조 구조(많은 가지가 잘렸으나 나무는 온전함)와 화자의 당혹감은 대체로 반영되어 있습니다. 그러나 κύριε는 이 문맥에서 영어 POB의 “Sir”에 해당하는 호칭인데, 초안의 ‘주여’는 불필요하게 신적 호칭으로 좁힐 수 있습니다. 또한 ὑγιές는 ‘건전하고’보다 나무의 상태에 맞게 ‘온전하며’가 자연스럽고, ἀπ' αὐτοῦ의 ‘그 나무에서’도 드러내는 편이 정확합니다.
