revisions:
- from: “들어보세요.” 그가 말합니다. “평지와 산과 온 땅을 덮는 이 큰 나무는 하나님이 온 천하에 주신 율법이니라 이 율법은 하나님의 아들이시니 땅 끝까지 전파되시리니 그늘 아래 있는 백성들은 그 선포를 듣고 믿는 자들이니라.
  to: “들으십시오.” 그가 말합니다. “평야와 산과 온 땅을 덮는 이 큰 나무는 온 세상에 주어진 하나님의 율법입니다. 이 율법은 땅끝까지 선포된 하나님의 아들이며, 그 그늘 아래 있는 백성들은 그 선포를 듣고 그를 믿은 사람들입니다.”
  rationale: 원문의 두 진술, 곧 큰 나무가 하나님의 율법이라는 것과 그 율법이 하나님의 아들이라는 것을 그대로 보존했습니다. κηρυχθεὶς는 ‘선포된’으로, πιστεύσαντες는 ‘믿은’으로 옮겨 태와 상을 반영했으며, 문체를 현대 표준어 합쇼체로 정비했습니다.
