  - severity: medium
    issue: 현대 합쇼체 및 문장 구조 불일치
    rationale: 초안의 연결과 종결은 문장부호 없이 이어지며 고어체 ‘-니라/-시리니’를 사용합니다.
  - severity: medium
    issue: ‘믿는 자들’이 완료 분사의 뉘앙스와 대상 지시를 약화함
    rationale: 원문은 선포를 듣고 그를 믿은 사람들을 가리킵니다.
