  source_fidelity: 초안은 핵심 의미를 대체로 전달하지만, ἐπιδεδωκότες는 단순히 ‘건네다’보다 받은 지팡이를 ‘되돌려 주다/반납하다’라는 문맥에 맞게 옮기는 것이 정확합니다. 또한 πεφυλακότες는 완료의 결과를 담아 ‘지켜 왔습니다’로 옮길 수 있습니다.
  naturalness: ‘녹색 지팡이를 받은 대로 건넨’은 한국어에서 다소 부자연스럽고 행위의 방향이 불분명합니다. ‘받은 그대로 푸른 지팡이를 되돌려 준’이 자연스럽고 문맥도 분명합니다. ‘심고 물을 준 이 지팡이들’은 화자가 지팡이를 심고 물 주었다는 뜻으로 읽힐 수 있으므로 수동 표현으로 바로잡았습니다.
  terminology: χλωράς는 이 문맥에서 ‘푸른’으로 일관되게 옮길 수 있습니다. σεμνοὶ는 ‘위엄이 있는’보다 인격적 품위를 나타내는 ‘품위 있고’가 현대 한국어에 더 적절합니다. ‘주의 계명’은 원문의 Κυρίου와 기존 용어를 충실히 반영합니다.
  issues:
