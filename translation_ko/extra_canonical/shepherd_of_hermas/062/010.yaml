  language: ko
  text: “받은 그대로 푸른 지팡이를 되돌려 준 이들은 품위 있고 의로운 사람들이며, 매우 순수한 마음으로 살아왔고 주의 계명을 지켜 왔습니다. 나머지는 내가 심기고 물을 받은 이 지팡이들을 살펴볼 때 알게 될 것입니다.”
