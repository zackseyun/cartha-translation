  to: “그에게서 받은 율법을 범한 사람들은 모두 회개하도록 내 권세 아래에 남겨 두었습니다. 그러나 이미 율법을 기쁘게 하고 그것을 지킨 사람들은 그분 자신의 권세 아래에 두십니다.”라고 그가 말합니다.
  rationale: 수혜자들이 ‘그에게서’ 율법을 받았다는 원문의 관계를 분명히 하고, 율법에 대한 두 개의 병렬 동사(기쁘게 하다, 지키다)를 모두 보존했습니다. 또한 직접화법 안에서 ‘내 권세’와 ‘그분 자신의 권세’의 대조를 유지했습니다.
