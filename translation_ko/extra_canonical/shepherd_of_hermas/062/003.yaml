revisions:
- from: “크고 영광스러운 천사 미가엘이니 이 백성을 다스리는 권세를 가지고 그들을 다스리는 자는 율법을 믿는 자들의 마음에 주시는 이시니라 그러므로 율법을 주신 사람들이 그 율법을 지키는지 알아보시려고 친히 돌보시느니라.
  to: “크고 영광스러운 천사는 미가엘입니다. 그는 이 백성에 대한 권세를 가지고 그들을 다스립니다. 그가 믿는 이들의 마음속에 그들에게 율법을 주는 이입니다. 그러므로 그는 자신이 율법을 준 이들이 그것을 지켰는지를 살피십니다.”
  rationale: 원문의 문장 단위를 보존하여 미가엘의 권세와 통치, 믿는 이들의 마음에 율법을 주는 행위, 그리고 율법 준 이들이 이를 지켰는지 살피는 행위를 명료하게 옮겼습니다. 영어 감사 번역의 ‘visits’는 한국어에서 불필요하게 물리적 방문으로 한정하지 않고 문맥상 ‘살피십니다’로 번역했습니다.
