revisions:
- from: 그러나 너희를 구원하는 것은 너희가 살아계신 하나님에게서 떠나지 아니한 것과 너희의 단순함과 절제력이니라. 만일 너희가 이것들 안에 거하면 이것들이 너희를 구원하였느니라 또 이같은 일을 행하며 순수함과 단순함으로 행하는 모든 자를 구원하느니라. 이것들은 모든 불의를 이기고 영생에 이르도록 유지됩니다.
  to: 그러나 당신을 구원하는 것은 당신이 살아 계신 하나님에게서 떠나지 않은 것과 당신의 순전함과 큰 절제입니다. 당신이 계속 그 안에 머문다면, 이것들이 당신을 구원한 것입니다. 또 이런 일을 행하고 무악함과 순전함 가운데 살아가는 모든 사람을 구원합니다. 이들은 모든 악을 이기고 영원한 생명에 이르기까지 굳게 섭니다.
  rationale: The revision restores the singular address, preserves the perfect-plus-conditional force of 'have saved you, if you continue,' identifies the final subject correctly as the practitioners, and uses consistent modern formal-polite Korean. No footnote is required for this unit.
