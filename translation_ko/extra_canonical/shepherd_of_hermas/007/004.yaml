  to: 그리고 너는 막시무스에게 이렇게 말하십시오. “보라, 네가 다시 부인하려 한다면 환난이 다가오고 있습니다. 광야에서 백성에게 예언한 엘닷과 모닷에 기록된 바와 같이, 주님께서는 자신에게로 돌아오는 이들에게 가까이 계십니다.”
  rationale: 원문의 조건절을 조건으로 바로잡고, 임박성을 나타내는 ἔρχεται를 ‘다가오고 있습니다’로 옮겼습니다. 마지막 구절은 기록 출처의 정확한 성격을 단정하지 않도록 ‘엘닷과 모닷에 기록된’으로 표현했으며, 인용문을 완결했습니다.
