  text: 그리고 너는 막시무스에게 이렇게 말하라. 보라, 네가 다시 부인하는 것이 좋을지라도 환난이 오게 되리라. 광야에서 백성에게 예언한 엘닷과 모닷의 글에 주님께서는 자기에게로 돌아오는 자에게 가까이 계시느니라
