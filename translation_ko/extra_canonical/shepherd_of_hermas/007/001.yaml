review_pass:
  verdict: revise
  source_fidelity: 초안은 μνησικακέω를 ‘원한을 품다’로 옮긴 점과 가정의 범죄 때문에 고난을 겪었다는 큰 흐름은 반영합니다. 그러나 ‘여동생이 ... 깨끗함을 받도록 허락하지 마십시오’는 헬라어의 목적절과 부정 명령의 관계를 반대로 만들며, 2인칭 단수인 원문을 ‘너희’로 바꾸었습니다. 또한 ‘공의로운 징계로 징계를 받으리라’는 반복이 부자연스럽고, ‘무시하고’는 παρενεθυμήθης의 ‘소홀히 하다/등한히 하다’보다 강합니다.
  naturalness: 합쇼체를 일관되게 사용하고, ‘자매를 그대로 내버려 두지 마십시오’로 원문의 타동사 ἐάσῃς와 목적절의 의미를 자연스럽게 살렸습니다. ‘개인적으로 큰 환난’은 현대 한국어에서 다소 어색하므로 ‘큰 개인적 고난’으로 다듬었습니다.
  terminology: μνησικακία 계열은 문맥상 ‘원한을 품다/원한’으로 통일했습니다. παιδεία δικαία는 법정적 ‘공의’보다 폭넓은 윤리적 의미를 보존하도록 ‘의로운 훈육’으로 옮겼습니다. οἶκος는 단순 가족보다 넓은 집안/가구를 뜻할 수 있으므로 ‘집안’으로 번역했습니다.
  issues:
  - severity: high
    issue: 자매에 관한 문장이 의미상 반전됨
    rationale: ‘당신의 여동생이 ... 깨끗함을 받도록 허락하지 마십시오’는 자매가 정결하게 되는 것을 금하는 뜻이 됩니다. 원문은 자매를 그대로 방치하지 말라는 명령 뒤에, 자녀들과 자매가 이전 죄들에서 깨끗하게 되도록 한다는 목적을 둡니다.
  - severity: medium
    issue: 호칭과 인칭의 불일치
    rationale: 원문은 헤르마스에게 계속 2인칭 단수로 말하지만 초안은 ‘당신’에서 ‘너희’로 전환합니다.
  - severity: medium
    issue: ‘무시하고’가 원문의 의미를 과도하게 강화함
    rationale: παρενεθυμήθης는 돌봄을 소홀히 하거나 등한히 했다는 뜻이며, 의도적 경멸을 암시할 수 있는 ‘무시하다’보다 절제된 표현이 적절합니다.
