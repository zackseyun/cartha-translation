revisions:
- from: 그러나 헤르마스여, 당신은 더 이상 당신의 자녀에 대해 원한을 품지 말며, 당신의 여동생이 계속해서 그들의 이전 죄에서 깨끗함을 받도록 허락하지 마십시오. 너희가 그들에게 원한을 품지 아니하면 그들은 공의로운 징계로 징계를 받으리라. 원한을 품는 것은 죽음을 낳는다. 그러나 헤르마스여, 당신은 가족의 범죄로 인해 개인적으로 큰 환난을 겪었습니다. 당신은 그들을 돌보지 않고 무시하고 당신의 악한 사업 거래에 말려들었기 때문입니다.
  to: 그러나 헤르마스여, 더 이상 자녀들에게 원한을 품지 말고, 자매를 그대로 내버려 두지도 마십시오. 그리하여 그들이 이전의 죄들에서 깨끗하게 되도록 하십시오. 당신이 그들에게 원한을 품지 않는다면, 그들은 의로운 훈육을 받을 것입니다. 원한은 죽음을 낳습니다. 그러나 헤르마스여, 당신은 집안의 범죄들 때문에 큰 개인적 고난을 겪었습니다. 당신이 그들을 돌보는 일에 마음을 쓰지 않고 소홀히 하며, 당신의 악한 사업 거래에 얽혀 있었기 때문입니다.
  rationale: 자매를 ‘그대로 내버려 두지 말라’는 원문의 생략·연결된 구문을 한국어에서 명료하게 풀되, 정결의 대상인 복수 ‘그들’과 이전 죄들의 표현을 유지했습니다. 전 구절을 2인칭 단수 합쇼체로 통일하고, 훈육·돌봄·사업 거래 관련 어휘를 원문의 의미 범위 안에서 자연스럽게 조정했습니다.
