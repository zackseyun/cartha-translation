base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025.yaml
  text: 'After I had prayed in the house and sat down on the couch[a], a certain man entered, glorious in appearance, in shepherd’s attire, wearing a white skin, and having a bag on his shoulders and a staff in his hand. And he greeted me, and I returned his greeting.


    2. And immediately he sat beside me and says to me, “I have been sent by the most venerable angel, that I may dwell with you for the rest of the days of your life.”


    3. I thought that he had come to test me, and I say to him, “Who then are you? For I,” I say, “know the one to whom I was handed over.” He says to me, “Do you not recognize me?” “No,” I say. “I,” he says, “am the Shepherd to whom you were entrusted.”


    4. While he was still speaking, his appearance was changed, and I recognized him, that he was the one to whom I had been entrusted, and immediately I was confounded, and fear seized me, and I was completely crushed with grief, because I had answered him so wickedly and senselessly.


    5. But he answered me and says, “Do not be confounded, but be strengthened in my mandates, which I am about to command you. For I have been sent,” he says, “that I may show you again all the things you saw before, especially the main points that are beneficial for you. First of all, write my mandates and the parables; but the other things, as I show you, so you will write.” For this reason, he says, “I command you first to write the mandates and parables, so that you may read them readily at hand and be able to keep them.”


    6. So I wrote the mandates and the parables, just as he commanded me.


    7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance[g][f][e][d][c][b], commanded me to write all these things in this way.'
  footnotes:
  - marker: a
    text: 'Shepherd’s attire: white skin, bag, and staff were typical of pastoral imagery, signaling the figure’s role and purity in the vision.'
    reason: cultural_note
  - marker: b
    text: The verb ἀσπάζομαι means “to greet”; in early Christian contexts, greetings could include a kiss (cf. Rom 16:16), but the text here simply says “greeted.”
    reason: cultural_note
  - marker: c
    text: “Mandates” translates ἐντολαί; many English versions read “commandments,” but Hermas uses ἐντολαί as a section title for his paraenetic instructions.
    reason: lexical_alternative
  - marker: d
    text: “Parables” renders παραβολαί and corresponds to the section often called the “Similitudes.”
    reason: cross_reference
  - marker: e
    text: “Main points” translates κεφάλαια, which can mean principal matters or summaries; it does not here denote book chapters.
    reason: lexical_alternative
  - marker: f
    text: The pronoun “you” in “beneficial for you” is plural (ὑμῖν), indicating that the instruction is for the community, not only Hermas.
    reason: cultural_note
  - marker: g
    text: “Testing me” translates ἐκπειράζων με; the nuance is of examination or proving, not enticing to sin.
    reason: lexical_alternative
translation:
  language: ko
  text: '내가 집에서 기도하고 침상에 앉았을 때, 한 사람이 들어왔는데, 그의 모습은 영광스러웠고 목자의 차림에 하얀 가죽을 입고 있었으며, 어깨에는 자루를 메고 손에는 지팡이를 쥐고 있었습니다. 그는 나에게 인사했고, 나도 그에게 인사했습니다.


    2. 곧 그는 내 곁에 앉아 나에게 말했습니다. “나는 가장 존귀한 천사에게서 보내졌습니다. 당신의 생애 나머지 날들 동안 당신과 함께 거주하게 하려는 것입니다.”


    3. 나는 그가 나를 시험하러 온 줄 알았고, 그에게 말했습니다. “당신은 도대체 누구십니까? 나는, 내가, 누구에게 넘겨졌는지 알고 있습니다.” 그는 나에게 말했습니다. “당신은 나를 알아보지 못합니까?” “아닙니다.” 내가 말했습니다. “나는,” 그가 말했습니다, “당신에게 맡겨진 목자입니다.”


    4. 그가 아직 말하고 있을 때 그의 모습이 바뀌었고, 나는 그가 바로 내가 맡겨진 그 사람임을 알아보았습니다. 그러자 나는 곧 당황했고, 두려움이 나를 사로잡았으며, 내가 그에게 그렇게 악하고 어리석게 대답한 탓에 슬픔으로 완전히 짓눌렸습니다.


    5. 그러나 그가 내게 대답하여 말했습니다. “당황하지 말고, 내가 곧 당신에게 명령할 내 명령들 안에서 강해지십시오. 나는 보내심을 받았습니다.” 그가 말했습니다. “당신이 전에 본 것들을 모두 다시 당신에게 보여 주려는 것입니다. 곧 당신에게 유익한 주된 것들입니다. 무엇보다도 먼저 내 명령들과 비유들을 적으십시오. 다른 것들은 내가 당신에게 보여 주는 대로 당신도 그렇게 적으십시오. 그러므로 나는 당신에게 먼저 명령합니다. 명령들과 비유들을 적으십시오. 그래야 당신이 그것들을 가까이 두고 읽을 수 있고, 또한 지킬 수 있습니다.”


    6. 그래서 나는 그가 내게 명령한 대로 명령들과 비유들을 적었습니다.


    7. 그러므로 그것들을 듣고 지키며, 그것들 안에서 행하고, 깨끗한 마음으로 그것들을 실천하면, 주께서 당신에게 약속하신 것을 받게 될 것입니다. 그러나 듣고도 회개하지 않고, 오히려 당신의 죄에 죄를 더하면, 주께로부터 반대되는 것들을 받게 될 것입니다. 목자, 곧 회개의 천사가 이 모든 것을 내가 이렇게 적도록 명령했습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχήματι ποιμενικῷ
  english_pob_choice: in shepherd’s attire / guise
  chosen_korean: 목자의 차림
  alternatives_korean:
  - 목자의 복장
  - 목자의 모습
  lexicon: LSJ
  rationale: σχῆμα은 외양/차림을 가리키며 ποιμενικῷ가 목자 이미지를 덧붙이므로, ‘차림’이 시각적·구체적 뉘앙스를 자연스럽게 살립니다.
- source_word: δέρμα λευκόν
  english_pob_choice: white skin
  chosen_korean: 하얀 가죽
  alternatives_korean:
  - 흰 가죽
  - 흰 가죽옷
  lexicon: LSJ
  rationale: δέρμα은 동물 가죽을 가리키므로, ‘가죽’으로 옮겨 소박하고 물질적인 이미지를 보존했습니다.
- source_word: ᾧ παρεδόθην
  english_pob_choice: to whom I was entrusted / handed over
  chosen_korean: 내가 맡겨진
  alternatives_korean:
  - 내가 넘겨진
  - 내가 인계된
  lexicon: BDAG
  rationale: 문맥상 보호·위임의 뉘앙스가 있어 ‘맡겨진’이 적절하며, 앞부분의 ‘넘겨졌는지’와 대비를 이룹니다.
- source_word: ἀφρόνως
  english_pob_choice: senselessly / foolishly
  chosen_korean: 어리석게
  alternatives_korean:
  - 분별 없이
  - 미련하게
  lexicon: BDAG
  rationale: ἄφρων은 분별 없는 어리석음을 뜻하므로, 도덕적 강도와 자연스러움을 함께 살려 ‘어리석게’로 옮겼습니다.
- source_word: ἐντολαί
  english_pob_choice: mandates / commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 훈시들
  lexicon: LSJ
  rationale: 이 작품 내부에서는 섹션 제목 기능이 있어, ‘명령들’이 전통적 성서어휘의 중첩을 피하면서도 지시문 성격을 분명히 드러냅니다.
theological_decisions:
- issue: ἄγγελος τῆς μετανοίας의 직함 보존
  chosen_reading: ‘회개의 천사’로 직역해 이 작품 특유의 천사론적 호칭을 유지했습니다.
  alternative_readings:
  - ‘회개를 관장하는 천사’
  - ‘회개시키는 천사’
  rationale: 본문은 단순한 기능 설명보다 고유 호칭을 제시하므로, 해석을 덧씌우지 않고 명칭 자체를 보존하는 것이 투명합니다.
  doctrine_reference: 원문 직함 보존과 주석적 투명성 원칙
- issue: ὑμῖν/σοι의 인칭 범위
  chosen_reading: 한국어에서는 자연스러운 ‘당신’으로 두되, 본문 후반의 복수 지시 가능성은 번역문 내부에서 과도하게 풀지 않았습니다.
  alternative_readings:
  - ‘너희’로 공동체성 명시
  - ‘그대’로 단수화
  rationale: 이 절은 개인 비전이면서도 공동체적 교훈으로 확장되므로, 한국어에서 가능한 범위를 유지하는 편이 원문 긴장을 보존합니다.
  doctrine_reference: 원문 인칭 범위의 보존
