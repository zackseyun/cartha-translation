  source_fidelity: 원문의 ἐν πολλῇ ἁπλότητι καὶ ἀκακίᾳ καὶ σεμνότητι는 양육의 방식/환경을 나타내므로 ‘~으로 양육’보다 ‘~가운데서 양육’이 더 충실합니다. στάξαντος는 ‘내려’보다 ‘방울방울 내리신’으로 옮겨 ‘drip’의 비유를 보존했습니다. δικαιωθῆτε는 수동형으로 ‘의롭다 하심을 받다’가 적절합니다.
  naturalness: 초안의 ‘들어라, 얘들아’, ‘하였나니’, ‘저가’는 현대 표준어 합쇼체와 맞지 않거나 문체가 혼재되어 있습니다. 직접 호칭과 서술을 현대적 존대 문체로 통일했습니다.
  terminology: ἁπλότης는 여기서 ‘단순함’보다 윤리적 뉘앙스를 살린 ‘순박함’으로, ἀκακία는 ‘순결함’으로, σεμνότης는 ‘품위’로 옮겼습니다. δικαιοσύνη/δικαιόω의 연결을 위해 ‘의’와 ‘의롭다 하심’을 유지했습니다.
  issues:
