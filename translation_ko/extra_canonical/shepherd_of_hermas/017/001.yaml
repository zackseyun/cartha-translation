    rationale: ‘들어라’, ‘얘들아’, ‘하였나니’, ‘저가’는 각각 반말·구어·고어 문체가 섞여 있어 지정된 현대 formal-polite register를 충족하지 못합니다.
  - severity: medium
    issue: στάξαντος의 ‘방울방울 내리다’ 이미지가 약화되었습니다.
    rationale: ‘의를 내려’는 가능하나 원문의 ‘drip’ 동작과 영어 감사 기록의 표현을 충분히 드러내지 못합니다.
  - severity: low
