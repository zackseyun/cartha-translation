base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060.yaml
  text: '…with their whole heart[1]. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.


    And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.


    After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off[2]. But wait until you see everything, and it will be shown to you what it is.


    The angel who had given the rods to the people again demanded them back from them; and in the order they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.


    From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them[a][5][4][3]; and these stood apart.'
  footnotes:
  - marker: '1'
    text: The normalized Greek here has ‘when [God] sees the heart of the one repenting clean from every …’ with the object incomplete. Many editions read ‘from every evil,’ making explicit what the sense implies.
    reason: textual_variant
  - marker: '2'
    text: The phrase ‘angel of the Lord’ at the start of the scene is implied by context; some lines in the source are damaged. Later in the unit the figure is explicitly called ‘the angel of the Lord.’
    reason: textual_variant
  - marker: '3'
    text: ‘Chastise’ translates a verb that can also mean ‘torment’ or ‘put to the test’ (βασανίζω). The sense here is self‑imposed discipline of the soul in repentance.
    reason: lexical_alternative
  - marker: '4'
    text: A ‘cubit’ is an ancient measure roughly the length of a forearm (about 18 inches / 45 cm).
    reason: cultural_note
  - marker: '5'
    text: ‘As though eaten by a worm’ reflects σητός, a worm or wood‑borer that gnaws and hollows wood; ‘worm‑eaten’ is a common rendering.
    reason: lexical_alternative
  - marker: a
    text: Or 'clean in every respect'.
    reason: previous_rendering
translation:
  language: ko
  text: '…그들의 온 마음으로 말합니다[1]. 그러므로 회개하는 사람들의 죄가 즉시 용서된다고 생각합니까? 전적으로 그렇지는 않습니다. 오히려 회개하는 사람은 자신의 영혼을 괴롭게 해야 하고, 자신의 모든 행실에서 굳게 겸손해져야 하며, 온갖 종류의 환난 가운데서 괴로워해야 합니다. 그리고 닥쳐오는 환난들을 견뎌 내면, 만물을 창조하고 강하게 하신 이가 반드시 불쌍히 여기시고, 어떤 치유를 주실 것입니다. 이것은 회개하는 사람의 마음이 모든 것에서 깨끗하다고 하나님께서 보실 때입니다[2].


    그리고 주님의 천사—지극히 영광스럽고 매우 키가 큰—가 버드나무 곁에 서 있었는데, 큰 낫을 들고 있었습니다. 그는 버드나무에서 가지들을 잘라 그 버드나무 아래에 가려 있던 사람들에게 주었고, 그들에게는 길이 한 규빗쯤 되는 작은 막대기들을 계속 주었습니다[3][4].


    모두가 막대기들을 받은 뒤에 천사는 낫을 놓았고, 그 나무는 내가 전에 보았던 그대로 온전했습니다. 나는 속으로 놀라며 말했습니다. “어떻게 그렇게 많은 가지가 잘렸는데도 나무가 온전합니까?” 목자가 내게 말했습니다. “그렇게 많은 가지가 잘렸는데도 나무가 온전하게 남았다고 해서 놀라지 마라. 그러나 모든 것을 다 볼 때까지 기다려라. 그러면 그것이 무엇인지 네게 알려질 것이다.”


    그 뒤에 사람들에게 막대기들을 주었던 천사가 다시 그들에게서 그것들을 요구했습니다. 그리고 그들이 받았던 순서대로 그도 그에게 불렸고, 각 사람은 자기 막대기를 돌려주었습니다. 주님의 천사가 그것들을 받아 살펴보았습니다.


    어떤 이들에게서 그는 마치 벌레가 먹어 갉아 먹은 듯한 마른 막대기들을 받았고[5], 천사는 그런 막대기들을 내놓은 사람들을 따로 서 있게 하라고 명령했습니다. 다른 이들은 마른 막대기들을 내놓았지만 벌레에게 먹히지는 않았습니다. 그들도 따로 서 있게 하라고 명령받았습니다. 다른 이들은 반쯤 마른 막대기들을 내놓았고, 그들도 따로 섰습니다. 또 다른 이들은 반쯤 마른 막대기들과 갈라진 부분이 있는 막대기들을 내놓았고, 그들도 따로 섰습니다. 또 다른 이들은 푸른 막대기들과 갈라진 부분이 있는 막대기들을 내놓았고, 그들도 따로 섰습니다. 또 다른 이들은 막대기의 절반은 마르고 절반은 푸르렀는데, 그들도 따로 섰습니다. 또 다른 이들은 막대기의 두 부분은 푸르고 나머지 한 부분은 말라 있는 막대기들을 내놓았고, 그들도 따로 섰습니다. 또 다른 이들은 두 부분은 마르고 나머지 한 부분은 푸른 막대기들을 내놓았고, 그들도 따로 섰습니다. 또 다른 이들은 거의 온통 푸른 막대기들을 내놓았으나, 막대기들의 아주 작은 부분만 말라 있었는데, 바로 끝부분이었습니다. 또 그것들에는 갈라진 부분도 있었습니다[a][3][5]. 그들도 따로 섰습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοοῦντων / μετανοοῦντα
  english_pob_choice: repenting / the one who repents
  chosen_korean: 회개하는 사람
  alternatives_korean:
  - 회개하는 이
  - 회심하는 사람
  lexicon: BDAG / LSJ
  rationale: 문맥이 죄의 용서와 연결되므로 단순한 인지적 ‘생각의 변화’보다 도덕적·의지적 회개를 드러내는 표현이 적절합니다.
- source_word: βασανίσαι
  english_pob_choice: chastise
  chosen_korean: 괴롭게 해야 하고
  alternatives_korean:
  - 징계해야 하고
  - 고문해야 하고
  - 시험해야 하고
  lexicon: BDAG / LSJ
  rationale: 자기 영혼에 가해지는 엄격한 수련의 뜻을 살리면서, 현대 한국어에서 ‘고문’처럼 과도하게 폭력적으로 들리는 표현은 피했습니다.
- source_word: ταπεινοφρονῆσαι
  english_pob_choice: be humble-minded
  chosen_korean: 굳게 겸손해져야 하며
  alternatives_korean:
  - 마음이 낮아져야 하며
  - 겸손한 마음을 가져야 하며
  lexicon: BDAG / LSJ
  rationale: 태도와 지속성을 함께 드러내기 위해 ‘겸손해지다’에 ‘굳게’를 붙여, 단순 감정이 아니라 행실 전반을 규정하는 자세로 표현했습니다.
- source_word: ὑπενέγκῃ / θλίψεις
  english_pob_choice: bears the tribulations
  chosen_korean: 환난들을 견뎌 내면
  alternatives_korean:
  - 환난을 참아 내면
  - 환난을 감당하면
  lexicon: BDAG
  rationale: ‘견뎌 내다’가 압박을 끝까지 버틴다는 이미지를 살리며, θλίψεις의 ‘압박/환난’ 성격도 잘 전달합니다.
- source_word: ἴασίν τινα
  english_pob_choice: some healing
  chosen_korean: 어떤 치유
  alternatives_korean:
  - 어느 정도의 치유
  - 일정한 치유
  lexicon: BDAG / LSJ
  rationale: τινα의 비특정성을 살리되, 추상화하지 않고 구체적 치유의 의미를 남겼습니다.
- source_word: καθαρὰν ... ἀπὸ παντός
  english_pob_choice: clean from everything
  chosen_korean: 모든 것에서 깨끗하다고
  alternatives_korean:
  - 모든 악에서 깨끗하다고
  - 전부에서 깨끗하다고
  lexicon: LSJ
  rationale: 원문의 ἀπό가 분리의 뜻이므로 ‘~에서 깨끗하다’로 옮겼고, OCR로 빠진 항목을 임의 보충하지는 않았습니다.
- source_word: ἰτέα
  english_pob_choice: willow
  chosen_korean: 버드나무
  alternatives_korean:
  - 위로우
  - 버들나무
  lexicon: LSJ
  rationale: 한국어에서 가장 자연스럽고 표준적인 나무 이름을 택했습니다.
- source_word: ῥάβδος / ῥαβδίον
  english_pob_choice: little rods
  chosen_korean: 작은 막대기
  alternatives_korean:
  - 작은 지팡이
  - 작은 몽둥이
  lexicon: LSJ
  rationale: 의식용으로 제시된 짧은 막대의 성격을 살리면서도, ‘지팡이’나 ‘몽둥이’보다 중립적인 표현을 택했습니다.
- source_word: σχισμὰς ἐχούσας
  english_pob_choice: having splits
  chosen_korean: 갈라진 부분이 있는
  alternatives_korean:
  - 금이 간
  - 갈라짐이 있는
  lexicon: LSJ
  rationale: 나무 막대의 물리적 상태를 자연스럽게 드러내기 위해 ‘갈라진 부분’으로 옮겼습니다.
theological_decisions:
- issue: 회개와 용서의 즉시성
  chosen_reading: ‘즉시 용서’가 아니라, 참된 회개와 견딤이 동반될 때 하나님이 긍휼과 치유를 주신다는 조건부 진술로 옮겼습니다.
  alternative_readings:
  - 즉시 용서됨
  - 완전히 용서됨
  rationale: οὐ παντελῶς는 강한 전면 부정보다 ‘전적으로는 아니다’에 가깝고, 이 문맥은 회개를 단순 선언이 아니라 인내와 자기 낮춤이 포함된 실제적 과정으로 제시합니다.
  doctrine_reference: 'Cartha Translation Philosophy: preserve theological tension'
- issue: 주님의 천사
  chosen_reading: 초월적 천사로 읽어 ‘주님의 천사’로 옮겼습니다.
  alternative_readings:
  - 주님의 사자
  - 주님의 전령
  rationale: 영광과 큰 낫, 나무를 다루는 역할이 환상 문맥의 천상 존재를 가리키므로, 중립적인 ‘전령’보다 ‘천사’가 본문 의도를 더 잘 드러냅니다.
  doctrine_reference: 'Cartha Translation Philosophy: visionary register'
