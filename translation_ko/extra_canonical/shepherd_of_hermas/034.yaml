  yaml_path: translation/extra_canonical/shepherd_of_hermas/034.yaml
  text: '1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be beyond compare. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.


    2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In the one who has no power, there is no fear; but in the one who has glorious power, there is also fear. For everyone who has power is feared, but the one who has no power is despised by all.


    3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.


    4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live for him; and all who fear him among those who keep his commandments will live for God.


    5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live for God’?” “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore the life of those who fear him and keep his commandments is with God; but for those who do not keep his commandments, there is not even life in them.”'
translation:
  language: ko
  text: '1. “주님을 두려워하고, 그의 명령들을 지키십시오.” 하나님의 명령들을 지킴으로써 당신은 모든 행위에서 능력 있게 될 것이며, 당신의 행실은 비길 데 없을 것입니다. 주님을 두려워하면 모든 일을 잘하게 됩니다. 이것이 당신이 가져야 할 두려움이며—그러면 당신은 구원을 받을 것입니다.


    2. 그러나 마귀는 두려워하지 마십시오. 주님을 두려워하면 마귀를 제압하게 될 것이기 때문입니다. 그 안에는 능력이 없기 때문입니다. 능력이 없는 자에게는 두려움도 없습니다. 그러나 영광스러운 능력이 있는 자에게는 두려움도 있습니다. 능력이 있는 자는 누구나 두려움의 대상이 되지만, 능력이 없는 자는 모든 이에게 멸시를 받습니다.


    3. 그러나 마귀의 일들은 두려워하십시오. 그것들은 악하기 때문입니다. 그러므로 주님을 두려워하면 마귀의 일들을 두려워하게 될 것이며, 그것들을 행하지도 않고, 그것들로부터 물러날 것입니다.


    4. 그러므로 두 가지 두려움이 있습니다. 만일 악한 일을 하고 싶으면 주님을 두려워하십시오. 그러면 그것을 행하지 않을 것입니다. 반대로 선한 일을 하고 싶으면 주님을 두려워하십시오. 그러면 그것을 행할 것입니다. 그러므로 주님을 두려워하는 것은 강하고 크며 영광스럽습니다. 그러니 주님을 두려워하십시오. 그러면 그를 위해 살게 될 것입니다. 그리고 그의 명령들을 지키는 이들 가운데서 그를 두려워하는 모든 사람은 하나님을 위해 살게 될 것입니다.


    5. “왜 그렇게 말씀하셨습니까, 주님? 그의 명령들을 지키는 이들에 대해 ‘그들은 하나님을 위해 살 것이다’라고 하신 이유가 무엇입니까?” “그것은,” 그가 말했습니다, “모든 피조물이 주님을 두려워하지만, 그의 명령들은 지키지 않기 때문입니다. 그러므로 그를 두려워하고 그의 명령들을 지키는 이들의 생명은 하나님과 함께 있습니다. 그러나 그의 명령들을 지키지 않는 이들에게는 그들 안에 생명조차 없습니다.”[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주군
  lexicon: κύριος
  rationale: 직접 권면과 반복구에서 하나님/주를 가리키는 경칭으로 자연스러운 합쇼체의 호칭인 ‘주님’을 사용했습니다.
- source_word: φοβήθητι / φοβοῦ / φοβούμενος
  english_pob_choice: fear
  chosen_korean: 두려워하십시오 / 두려워하면
  alternatives_korean:
  - 경외하십시오
  - 무서워하십시오
  lexicon: φοβέομαι
  rationale: 본문의 핵심 개념은 단순 공포보다 경외와 두려움이 함께 있는 반응이지만, 반복되는 수사와 대비를 살리기 위해 기본어로 ‘두려워하다’를 택했습니다.
- source_word: ἐντολάς
  english_pob_choice: commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 법도들
  lexicon: ἐντολή
  rationale: 이 단락은 율법 용어보다 실제로 따르도록 주어진 명령의 느낌이 강하므로, 교회적 상투어인 ‘계명들’보다 직접적인 ‘명령들’로 옮겼습니다.
- source_word: πρᾶξίς σου ἀσύγκριτος ἔσται
  english_pob_choice: your conduct will be beyond compare
  chosen_korean: 당신의 행실은 비길 데 없을 것입니다
  alternatives_korean:
  - 당신의 행위는 비교할 수 없을 것입니다
  - 당신의 실천은 비할 데 없을 것입니다
  lexicon: ἀσύγκριτος
  rationale: POB의 ‘beyond compare’는 비교 불가의 탁월함을 뜻하므로, 한국어에서도 자연스럽고 품격 있는 표현인 ‘비길 데 없다’로 대응했습니다.
theological_decisions:
- issue: ‘그를 위해 살게 될 것입니다’와 ‘하나님을 위해 살게 될 것입니다’의 이중 종결
  chosen_reading: 4절 후반은 “그를 위해 살게 될 것입니다”와 “하나님을 위해 살게 될 것입니다”를 모두 살려, 주님을 두려워하는 결과가 곧 하나님께 속한 삶으로 이어진다는 구조를 유지했습니다.
  alternative_readings:
  - 둘 다 ‘하나님을 위해 살게 될 것입니다’로 통일
  - 둘 다 ‘주님을 위해 살게 될 것입니다’로 통일
  rationale: 그리스어는 4절에서 αὐτῷ와 τῷ Θεῷ를 구별하므로, 같은 한국어로 평준화하지 않고 상호 연관을 드러내는 쪽이 본문 구조에 더 충실합니다.
  doctrine_reference: 문맥 구조 보존
