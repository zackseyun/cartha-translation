revisions:
- from: 여러 번 금식하고 주님께 그 나이든 여자를 통해 보여 주겠다고 약속하신 계시를 알려 달라고 간구한 후 바로 그날 밤 그 노파가 나에게 나타나 이렇게 말했습니다. “네가 이토록 궁핍하고 모든 것을 알고자 하니 네가 머무는 들로 오라. 다섯 시쯤에 내가 네게 나타나서 네가 보아야 할 것을 보이리라.”
