revisions:
- from: 나는 그녀에게 “아가씨, 들판 어느 곳으로 가시나요?”라고 물었다. “원하는 곳이면 어디든지요.” 그녀가 말합니다. 나는 한적하고 좋은 곳을 선택했습니다. 그러나 내가 그 사람에게 말하기 전에 그 사람은 나에게 “네가 원하는 곳으로 내가 가겠다”고 말했습니다.
  to: 나는 그녀에게 말했습니다. “부인, 들판의 어느 곳으로 가야 합니까?” 그녀가 말했습니다. “원하시는 곳이면 어디든지요.” 나는 좋고 한적한 곳을 골랐습니다. 그러나 내가 그녀에게 말하고 그 장소를 알려 주기도 전에, 그녀가 내게 말했습니다. “네가 원하는 곳으로 내가 가겠다.”
  rationale: 호격 κύρια를 ‘부인’으로 바로잡고, 장소를 묻는 질문의 의미를 보존했습니다. 또한 화자가 장소를 말하기도 전에 상대가 답했다는 원문의 시간 관계를 복원했습니다. 원문의 역사적 현재(φησίν)는 한국어 서술 흐름에 맞춰 과거형으로 통일했습니다.
