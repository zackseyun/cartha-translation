    rationale: εἰς ποῖον τόπον τοῦ ἀγροῦ는 ‘들판의 어느 곳에’라는 장소 지정 질문이지, 상대가 어디로 가는지를 묻는 말이 아닙니다.
  - severity: high
    issue: ‘그 장소를 말하기 전에’가 누락됨
    rationale: πρὶν ... εἰπεῖν τὸν τόπον은 헤르마스가 장소를 실제로 말하기도 전에 그녀가 알아차렸다는 서술의 핵심입니다.
