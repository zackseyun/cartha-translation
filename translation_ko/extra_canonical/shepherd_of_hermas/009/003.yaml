  source_fidelity: 수정이 필요합니다. κύρια는 여기서 젊은 여성을 뜻하는 ‘아가씨’가 아니라 존칭 호격 ‘부인’(Lady)이며, ‘들판 어느 곳으로 가시나요?’는 화자의 이동 여부를 묻는 뜻으로 바뀝니다. 또한 ‘그 장소를 말하기 전에’라는 원문의 핵심 내용이 빠졌습니다.
  naturalness: 합쇼체 문장은 자연스럽게 다듬을 수 있습니다. 인용문 안의 ‘원하시는 곳이면 어디든지요’는 자연스럽지만, 앞뒤 서술의 시제와 지시 대상은 일관되게 정리해야 합니다.
  terminology: κύρια는 이 문맥에서 ‘부인’으로 옮기는 것이 원문의 존칭과 영어 POB의 ‘Lady’를 가장 무리 없이 반영합니다. 특별한 신학 용어 또는 주석은 필요하지 않습니다.
