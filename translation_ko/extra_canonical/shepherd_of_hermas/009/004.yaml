  text: 형제들이여, 그래서 나는 들판으로 가서 시간을 세어 그 여자에게 오라고 ​​지시한 곳에 이르렀습니다. 거기에는 상아색 침상이 놓여 있고 그 침상 위에는 아마포 베개가 놓여 있고 그 위에는 고운 아마포로 만든 수건이 펼쳐져 있는 것이 보입니다.
