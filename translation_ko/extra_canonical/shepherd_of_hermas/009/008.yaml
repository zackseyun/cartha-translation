  source_fidelity: 원문의 시간 순서와 대화 내용은 대체로 충실히 옮겼습니다. 다만 νεανίσκοι는 단순히 ‘젊은 남자들’로, πρεσβύτεροι는 본문이 사용하는 ‘장로들/연장자들’로 유지하는 편이 적절합니다.
