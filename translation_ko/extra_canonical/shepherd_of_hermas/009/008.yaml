  terminology: Κυρία는 문맥상 정중한 호칭인 ‘부인’으로, πρεσβύτεροι는 교회적 용례를 보존하여 ‘장로들’로 옮겼습니다. 특정 교파적 직분 해석을 추가하지 않았습니다.
