revisions:
- from: 이것들은 놓여 있고 그 곳에는 아무도 없음을 보고 나는 깜짝 놀랐고, 마치 떨림이 나를 사로잡고 내 머리털이 쭈뼛 섰습니다. 내가 혼자였기 때문에 마치 몸서리치는 느낌이 들었습니다. 그러다가 나는 정신을 차리고 하나님의 영광을 기억하고 용기를 내어 무릎을 꿇고 전과 같이 다시 내 죄를 주님께 자백했습니다.
  to: 이 물건들이 놓여 있고 그곳에는 아무도 없는 것을 보고, 나는 깜짝 놀랐습니다. 마치 떨림이 나를 사로잡아 내 머리털이 쭈뼛 섰고, 혼자 있었기 때문에 마치 전율이 엄습했습니다. 그러다가 정신을 차리고 하나님의 영광을 기억하여 용기를 내고, 무릎을 꿇어 전과 같이 다시 내 죄를 주님께 고백했습니다.
  rationale: 원문의 관찰 구조를 자연스러운 한국어 목적절로 바로잡고, 두 차례의 ὡσεί(‘마치’)를 보존했습니다. ‘혼자 있었기 때문에’가 μόνου μου ὄντος를 수식하도록 배치했으며, 고백과 무릎 꿇음의 순서도 원문에 맞추었습니다.
