review_pass:
  verdict: revise
  source_fidelity: 초안은 오른쪽과 왼쪽 자리의 대조 및 ‘그 이름을 위하여 고난을 받았다’는 핵심을 대체로 반영합니다. 그러나 화자의 숙고와 슬픔, 여인의 직접 발화, 헤르마스에게만 향하는 2인칭 단수, 장래의 약속, 그리고 같은 일을 행하고 같은 고난을 견디는 모든 이에게 적용되는 마지막 절을 누락하거나 왜곡했습니다.
  naturalness: 초안에는 ‘오른쪽에 앉지 못하게 하여 생각하고 한탄하더니’처럼 문장 관계가 부자연스럽고, 직접 인용부호·문장부호·높임 종결이 없어 현대 한국어 합쇼체 문장으로 읽기 어렵습니다. 수정문은 서술과 인용을 명확히 구분했습니다.
  terminology: ‘하나님’, ‘그 이름’, ‘고난을 받다’, ‘단순함’은 원문의 종교적·윤리적 어휘를 과도하게 해석하지 않고 유지할 수 있습니다. 원문의 2인칭 단수에 맞추어 ‘너’로 통일했습니다.
  issues:
  - severity: high
    issue: 직접 발화와 문장 구조가 무너져 있음
    rationale: 원문에서 여인이 헤르마스에게 하는 긴 발화가 초안에서는 인용 표시와 적절한 종결 없이 이어져 화자와 의미 관계가 불분명합니다.
  - severity: high
    issue: 마지막 약속의 상당 부분 누락
    rationale: ‘그들과 함께 앉게 될 것이며, 그들의 일을 행하고 그들이 견딘 것을 견디는 모든 이도 그러할 것’이라는 원문을 초안은 명령처럼 축소하여 옮겼습니다.
  - severity: high
    issue: 2인칭 단수의 왜곡
    rationale: 여인은 헤르마스 한 사람에게 말하는데 초안이 ‘너희는’으로 복수화했습니다.
  - severity: medium
    issue: ‘many things are lacking to you’의 의미 불명확
    rationale: ‘그들과 함께 앉을 것이 부족하다’는 한국어로 자연스럽지 않고 원문의 ‘네게는 아직 부족한 것이 많다’를 전달하지 못합니다.
