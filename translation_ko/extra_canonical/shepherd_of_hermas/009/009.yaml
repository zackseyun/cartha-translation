revisions:
- from: 그래서 내가 오른쪽에 앉고 싶어하자 그 여자는 허락하지 않고 왼쪽에 앉으라고 손짓을 했습니다. 그래서 내가 오른쪽에 앉지 못하게 하여 생각하고 한탄하더니 헤르마스야 오른쪽 자리는 다른 사람들의 것이니 이미 하나님을 기쁘시게 하고 그 이름을 위하여 고난을 받은 자들의 것인데 너희는 그들과 함께 앉을 것이 부족하도다 그러나 너희는 단순함에 머물라 그들과 함께 앉으라.
  to: 그래서 내가 오른쪽 자리에 앉으려고 하자, 그 여인은 허락하지 않고 손으로 왼쪽 자리에 앉으라고 가리켰습니다. 내가 오른쪽 자리에 앉도록 허락하지 않은 것을 생각하며 슬퍼하고 있을 때, 그 여인이 내게 말했습니다. “헤르마스야, 네가 슬프냐? 오른쪽 자리에는 이미 하나님을 기쁘시게 하고 그 이름을 위하여 고난을 받은 다른 이들이 앉는다. 그러나 네게는 그들과 함께 앉기까지 아직 부족한 것이 많다. 다만 네가 네 단순함 안에 계속 머문다면, 너도 그들과 함께 앉게 될 것이다. 또 그들의 일을 행하고 그들이 견딘 것을 견디는 모든 이도 그러할 것이다.”
  rationale: 원문의 인과 관계와 직접 화법을 복원하고, 헤르마스 한 사람을 향한 호칭과 2인칭 단수를 유지했습니다. ‘remain in your simplicity’는 교리적으로 확대하지 않고 ‘네 단순함 안에 계속 머문다면’으로, 마지막의 보편적 약속은 ‘모든 이도 그러할 것이다’로 옮겼습니다.
