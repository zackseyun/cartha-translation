review_pass:
  verdict: revise
  source_fidelity: 원문의 ἐξομολογουμένου(고백하다)와 ἐρωτῶν/ἐρώτα(묻다)의 구별을 반영할 필요가 있습니다. 초안의 ‘의에 대해서도 구하라’는 ‘묻다’를 ‘구하다’로 바꾸며, 마지막 절도 가정이 몫을 받는다는 뜻으로 주체가 바뀝니다.
  naturalness: ‘그녀’로 시작한 뒤 ‘그 사람은’이라고 한 지시 대상의 불일치가 있습니다. 또한 인용문은 ‘죄에 관한 것만 계속 묻지 말고’라고 하면 원문의 대조와 한국어 문맥이 더 자연스럽습니다.
  terminology: δικαιοσύνη는 여기서 ‘의’로 옮기는 것이 적절합니다. οἶκος는 문맥상 ‘가정’으로 옮길 수 있으며, ‘그 의의 얼마를’로 μέρος τι ἐξ αὐτῆς를 보존했습니다.
  issues:
  - severity: medium
    issue: 인물 지시가 ‘그녀’에서 ‘그 사람’으로 바뀝니다.
    rationale: 원문은 여성 인물인 πρεσβυτέρα를 일관되게 가리키므로 한국어 지시어도 일관되어야 합니다.
  - severity: medium
    issue: ἐρώτα(묻다)를 ‘구하라’로 번역했습니다.
    rationale: 이 구절은 죄에 관해서만 질문하지 말고 의에 관해서도 질문하라는 권면입니다. ‘구하다’는 의미를 바꾸고 앞의 ‘묻지 말고’와의 대조를 약화합니다.
  - severity: medium
    issue: ‘네 가족이 받을 몫’이 원문의 수혜 주체와 목적 표현을 바꿉니다.
    rationale: 원문은 헤르마스가 자신의 가정을 위해 의에서 얼마를 받도록(ἵνα λάβῃς … εἰς τὸν οἶκόν σου) 하라는 말입니다.
