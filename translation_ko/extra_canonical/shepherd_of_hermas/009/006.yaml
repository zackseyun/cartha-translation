revisions:
- from: 그리고 그녀는 내가 전에도 본 적이 있는 여섯 명의 젊은이와 함께 왔고, 내 옆에 서서 내가 기도하고 내 죄를 주님께 고백하는 동안 그 사람은 귀를 기울였습니다. 그리고 나를 만지며 말하기를 “헤르마스야, 네 죄에 대하여 다 묻지 말고 의에 대해서도 구하라. 그러면 네 가족이 받을 몫을 얻게 될 것이다.”
  to: 그리고 그녀는 내가 전에 본 적도 있는 여섯 젊은이와 함께 왔습니다. 그녀는 내 곁에 서서, 내가 기도하며 내 죄를 주님께 고백하는 것을 들었습니다. 그리고 내게 손을 대며 말했습니다. “헤르마스야, 네 죄에 관한 것만 계속 묻지 말고, 의에 관해서도 물어라. 그러면 네 가정을 위해 그 의의 얼마를 받을 수 있을 것이다.”
  rationale: 여성 지시어를 일관되게 하고, ‘묻다’와 ‘고백하다’를 원문의 서로 다른 동사에 맞춰 구별했습니다. 마지막 문장은 헤르마스가 자신의 가정을 위해 의의 일부를 받는다는 원문의 목적 관계를 유지했습니다.
