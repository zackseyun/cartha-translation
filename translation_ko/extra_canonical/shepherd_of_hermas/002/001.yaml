review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 흐름을 대체로 따르지만, ἀναγράφεται를 ‘내게로 돌리면’으로 옮긴 것은 수동적 ‘(죄로) 기록되다/고발되다’의 뜻을 충분히 반영하지 못합니다. 또한 ‘내게 은혜를 베푸시옵소서’는 화자의 질문 안에서 주님께 드리는 청원의 목적절(ἵνα ἱλατευθῇ μοι)을 직접 기도로 바꾸어 구문과 의미가 흐려집니다.
  naturalness: 초안에는 ‘이 죄가 내게로 돌리면’, ‘내가 무슨 말로 주님께 구하여 내게 은혜를 베푸시옵소서 하였노라’처럼 현대 표준 한국어 합쇼체 문장으로 부자연스럽거나 문법적으로 불완전한 부분이 있습니다. 인용문과 의문문을 분명히 하여 자연스럽게 다듬었습니다.
  terminology: σωθῆναι는 ‘구원을 얻다’, ἐξιλάσομαι는 ‘속죄하다’, ἱλατευθῇ μοι는 하나님이 화자에게 호의/자비를 보이시게 되기를 구하는 뜻으로 ‘내게 자비를 베푸시도록’으로 옮겼습니다. τελείων의 다소 불명확한 뉘앙스는 교리적으로 확대하지 않고 ‘이미 지은 죄들’로 절제하여 반영했습니다.
