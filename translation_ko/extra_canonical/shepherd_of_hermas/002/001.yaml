revisions:
- from: 그 여자가 이 말을 한 후에 하늘이 닫히고 나는 온통 떨고 슬펐습니다. 내가 속으로 이르기를 이 죄가 내게로 돌리면 내가 어찌 구원을 얻으리요 나의 지은 죄를 내가 어떻게 하나님께 속죄하여야 하며 내가 무슨 말로 주님께 구하여 내게 은혜를 베푸시옵소서 하였노라
  to: 그녀가 이 말을 한 뒤에 하늘이 닫혔고, 나는 온몸이 떨리며 슬픔에 잠겼습니다. 나는 속으로 말했습니다. “이 죄가 내 죄로 기록된다면, 내가 어떻게 구원을 얻을 수 있겠는가? 또 내가 이미 지은 죄들을 두고 어떻게 하나님께 속죄하겠는가? 주님께서 내게 자비를 베푸시도록 내가 무슨 말로 주님께 간청하겠는가?”
  rationale: 원문의 수동 표현, 연속된 세 의문문, 그리고 마지막 ἵνα 목적절을 보존하면서 현대 표준 한국어 합쇼체 서술로 정리했습니다. 본문 범위 밖의 인물 정체를 단정하지 않기 위해 ‘그녀’로 유지했습니다.
