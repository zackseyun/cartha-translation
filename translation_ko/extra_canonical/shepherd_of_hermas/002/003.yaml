  naturalness: 합쇼체의 기본 방향은 맞지만, 호격과 수식어를 자연스럽게 연결하고 인용문의 문장 구조를 완결해야 합니다.
  terminology: ‘헤르마스’, ‘죄를 짓다’, ‘다투지 않다’는 문맥상 적절합니다. γυναικὸς ἀγαθωτάτης는 교리적 함의 없이 ‘아주 훌륭한 한 여자’로 옮깁니다.
