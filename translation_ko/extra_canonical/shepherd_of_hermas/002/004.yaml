  source_fidelity: 초안은 핵심 논지를 대체로 반영하지만, περὶ αὐτῆς를 ‘그에게’로 옮겨 선행 대상의 성을 잘못 처리했습니다. 또한 ‘악한 일을 원하는 자에게는 이미 입증된 것’은 ‘이미 검증된 가장 경건한 영이 악한 일을 욕망한다면’이라는 그리스어 수식 관계를 바꿉니다.
  naturalness: 초안은 고전 번역투 어미와 긴 무표지 연결 때문에 현대 한국어 합쇼체로는 다소 부자연스럽습니다. 직접화법의 발화 표지와 문장 관계를 분명히 했습니다.
  terminology: δοῦλος τοῦ Θεοῦ는 ‘하나님의 종’, βουλή는 문맥상 ‘의도’, ἐγκρατής는 ‘절제하는 사람’으로 옮겼습니다. πνεῦμα는 원문의 표현을 보존하여 ‘영’으로 유지했습니다.
  issues:
  - severity: high
    issue: ‘그에게 대한 생각’
    rationale: 원문 περὶ αὐτῆς는 앞서 언급된 여성에 관한 생각을 뜻하므로 ‘그 여자에 관한 생각’이어야 합니다.
  - severity: high
    issue: ‘악한 일을 원하는 자에게는 이미 입증된 것’
    rationale: ‘이미 검증된’은 ‘가장 경건한 영’을 수식하며, 악한 일을 욕망하는 것은 조건절입니다. 초안은 수식 관계와 의미를 변경합니다.
  - severity: medium
    issue: 현대 합쇼체 및 문장 구조
    rationale: ‘아니하니라/일어났도다/버리고’ 등의 문체와 무표지 접속은 요구된 현대 formal-polite register에 맞지 않습니다.
