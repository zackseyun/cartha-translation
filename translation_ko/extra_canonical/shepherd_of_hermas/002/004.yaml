revisions:
- from: 이르되 이 일이 하나님의 종에게 해당되지 아니하니라 그러나 정녕 네 마음에 그에게 대한 생각이 일어났도다 이런 꾀는 하나님의 종들에게 죄를 불러들이느니라 이는 가장 경건한 심령에게 있어서 악하고 무서운 생각이요 악한 일을 원하는 자에게는 이미 입증된 것이니 특히 절제하는 자 헤르마스는 모든 악한 욕심을 버리고 모든 단순함과 큰 순결이 가득한 자니라
  to: 그러자 그녀가 말했습니다. “결코 그렇지 않습니다. 이 일은 하나님의 종에게 해당하지 않습니다. 그러나 분명히 그 여자에 관한 생각이 당신의 마음에 떠올랐습니다. 하나님의 종들에게 그러한 의도는 죄를 가져옵니다. 지극히 경건하고 이미 검증된 영이 악한 일을 욕망한다면, 그것은 악하고 놀라운 의도입니다. 더욱이 절제하는 사람인 헤르마스는 모든 악한 욕망을 멀리하고 온갖 순진함과 큰 무고함으로 가득한 사람입니다.”
  rationale: 대상 대명사의 성을 바로잡고, ‘이미 검증된’의 수식 범위와 조건절을 원문에 맞게 복원했습니다. ‘지극히 경건한 영’이라는 다소 낯선 표현은 πνεῦμα의 원문상 모호성을 해석적으로 좁히지 않기 위해 유지했습니다.
