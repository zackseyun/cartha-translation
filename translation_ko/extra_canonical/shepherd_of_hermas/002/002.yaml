revisions:
- from: 내가 이런 것들을 생각하고 마음 속으로 곰곰이 생각하고 있을 때, 눈 덮인 양털로 만든 크고 하얀 의자가 내 앞에 놓여 있었습니다. 그리고 아주 빛나는 옷을 입은 한 노부인이 손에 책을 들고 오더니 혼자 앉아 “헤르마스, 안녕하십니까”라고 인사했습니다. 그리고 나는 슬퍼하며 울면서 “부인님, 안녕하세요.”라고 말했습니다.
  to: 내가 이런 일들을 마음속으로 숙고하고 분별하고 있을 때, 눈 같은 양털로 된 크고 흰 의자가 내 앞에 있는 것을 보았습니다. 그런데 아주 빛나는 옷을 입고 손에 책을 든 한 나이 든 여인이 와서 홀로 앉아 나에게 인사했습니다. “헤르마스, 평안하십니까?” 나도 슬퍼하며 울면서 말했습니다. “부인님, 평안하십니까?”
