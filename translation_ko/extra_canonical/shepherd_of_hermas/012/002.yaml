  language: ko
  text: “이들은 처음 창조된 하나님의 거룩한 천사들이니 주께서 그의 모든 피조물을 그들에게 맡기사 모든 피조물을 증가시키고 건축하며 다스리게 하였느니라 그러므로 이들로 탑의 건축이 완성되리라.”
