revisions:
- from: “저희도 하나님의 거룩한 사자들이니 이 여섯은 그들보다 크니라 그 때에 망대 건축이 완성되리니 망대 건축이 이루어졌으므로 다 함께 망대 주위에서 즐거워하며 하나님께 영광을 돌리리라.”
  to: “그들도 하나님의 거룩한 천사들입니다. 그러나 이 여섯은 그들보다 뛰어납니다. 그러므로 망대의 건축이 완성될 것이며, 모두 함께 망대 주위에서 기뻐하고, 망대의 건축이 완성되었으므로 하나님께 영광을 돌릴 것입니다.”
  rationale: 원문의 대조(‘그러나 이 여섯은’), 논리적 귀결(οὖν), 미래 완료 선언과 완성에 근거한 공동의 기쁨 및 하나님 찬양을 보존했습니다. 현대 표준어 합쇼체로 문체를 정비했습니다.
