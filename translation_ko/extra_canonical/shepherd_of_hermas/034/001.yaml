  language: ko
  text: 1. 이르시되 주님를 경외하고 그 계명들을 지키라 네가 하나님의 계명을 지키면 모든 일에 능하고 네 행실이 지극히 크리라 네가 주님를 경외하면 모든 일이 잘 되리라 이것이 네가 마땅히 두려워할 것이니 그리하면 구원을 얻으리라 하셨느니라
