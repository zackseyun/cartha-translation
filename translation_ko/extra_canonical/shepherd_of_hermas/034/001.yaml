  english_pob_role: consult_only
status: reviewed
revisions:
- from: 1. 이르시되 주님를 경외하고 그 계명들을 지키라 네가 하나님의 계명을 지키면 모든 일에 능하고 네 행실이 지극히 크리라 네가 주님를 경외하면 모든 일이 잘 되리라 이것이 네가 마땅히 두려워할 것이니 그리하면 구원을 얻으리라 하셨느니라
  to: 1. 그가 말씀하셨습니다. “주님을 경외하고 그분의 계명들을 지키십시오. 하나님의 계명들을 지키면 모든 일에서 강건하게 되고, 여러분의 행위는 비길 데 없게 될 것입니다. 주님을 경외하면 모든 일을 잘 행하게 될 것입니다. 이것이 여러분이 마땅히 가져야 할 경외이며, 여러분은 구원을 받을 것입니다.”
  rationale: 원문의 직접 인용 구조를 살리고 현대 합쇼체로 통일했습니다. ‘경외’는 하나님을 향한 φόβος의 종교적 의미를 보존하며, ‘모든 일에서 강건하게’, ‘비길 데 없게’는 각각 δυνατὸς와 ἀσύγκριτος를 반영합니다. 마지막 문장은 원문의 다소 반복적인 표현을 한국어에서 자연스럽게 하되 구원 약속을 보존하여 옮겼습니다.
