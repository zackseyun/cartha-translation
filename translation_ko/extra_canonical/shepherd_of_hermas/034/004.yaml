review_pass:
  verdict: revise
  source_fidelity: 'The draft contains substantial grammatical and semantic errors. It mistranslates the outcomes of both conditional clauses, uses an incorrect instrumental rendering for ζήσῃ αὐτῷ, and does not adequately represent the concluding restriction/qualification concerning those who keep the commandments. The revision follows the Greek and the English audit trail: two fears are stated, fear of the Lord prevents evil and enables good, and those fearing him among commandment-keepers live to/for God.'
  naturalness: The draft has repeated object-particle errors ("주님를"), inconsistent singular/plural address, missing sentence boundaries, archaic mixed register ("영화롭도다"), and unnatural phrases such as "그러면 그렇게 될 것입니다." The revised wording is modern standard Korean in consistent formal-polite 합쇼체.
  terminology: '"주님을 경외하십시오" appropriately renders φοβοῦ τὸν Κύριον in this religious context. "계명" renders ἐντολάς, and "하나님" retains the draft''s established designation for Θεός. "그분을 위해/하나님을 위해 살 것입니다" conveys the Greek dative ζῆν + dative without incorrectly making the Lord merely the means by which one lives.'
  issues:
  - severity: high
    issue: Conditional outcomes are mistranslated or left vague.
    rationale: The Greek explicitly says fearing the Lord means one will not do evil, and will do good. "그리하지 아니하리라" lacks clear antecedence, while "그러면 그렇게 될 것입니다" does not say that the good will be done.
  - severity: high
    issue: ζήσῃ αὐτῷ is rendered "그로 말미암아 살리라."
    rationale: The dative αὐτῷ is not instrumental ('by means of him'). It denotes living to/for him; the revision renders this naturally as living for him.
  - severity: medium
    issue: The final phrase concerning commandment-keepers is syntactically unclear.
    rationale: The Greek has "all who fear him, among those who keep his commandments," followed by "will live to God." The revision explicitly retains the qualifying phrase.
  - severity: medium
    issue: Register and grammar are inconsistent.
    rationale: The draft combines 합쇼체 with archaic declarative style, has "주님를" twice, and shifts between singular and plural addressees without source-based reason.
  revised_text: 4. 그러므로 두 가지 두려움이 있습니다. 악을 행하고 싶으시면 주님을 경외하십시오. 그러면 그것을 행하지 않게 될 것입니다. 반대로 선을 행하고 싶으시면 주님을 경외하십시오. 그러면 그것을 행하게 될 것입니다. 그러므로 주님을 경외함은 강하고 크며 영광스럽습니다. 그러므로 주님을 경외하십시오. 그러면 그분을 위해 살게 될 것입니다. 그분을 경외하는 이들 가운데 그분의 계명을 지키는 모든 이는 하나님을 위해 살게 될 것입니다.
