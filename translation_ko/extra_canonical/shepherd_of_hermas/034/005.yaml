- from: 5. 내가 대답했습니다. “주님, 그분의 계명을 지키는 자에 대하여 ‘그들은 하나님을 위하여 살 것이다’라고 말씀하신 이유는 무엇입니까?” “피조물이 다 주님를 경외하되 그의 계명을 지키지 아니함이니라 그러므로 그를 경외하고 그의 계명을 지키는 자의 생명은 하나님께 있거니와 그의 계명을 지키지 아니하는 자에게는 생명이 없느니라”고 그는 말했습니다.
  to: 5. 제가 물었습니다. “주님, 어찌하여 그분의 계명을 지키는 이들에 관하여 ‘그들은 하나님을 위하여 살 것입니다’라고 말씀하셨습니까?” 그분이 말씀하셨습니다. “모든 피조물은 주님을 경외하지만 그분의 계명은 지키지 않습니다. 그러므로 그분을 경외하고 그분의 계명을 지키는 이들의 생명은 하나님과 함께 있습니다. 그러나 그분의 계명을 지키지 않는 이들에게는 생명조차 없습니다.”
  rationale: 조사 오류를 바로잡고, 문체를 현대 합쇼체로 통일했습니다. ζήσονται τῷ Θεῷ는 인용문에서 ‘하나님을 위하여 살 것입니다’로, ζωή ἐστι παρὰ τῷ Θεῷ는 뒤 문장에서 ‘하나님과 함께 있습니다’로 구별하여 원문의 표현상 대조를 보존했습니다.
