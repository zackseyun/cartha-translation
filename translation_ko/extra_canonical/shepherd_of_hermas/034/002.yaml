- from: 2. 그러나 마귀를 두려워하지 마십시오. 주님을 경외함으로써 여러분은 마귀를 지배하게 될 것입니다. 왜냐하면 그에게는 능력이 없기 때문입니다. 능력이 없는 사람에게는 두려움이 없습니다. 그러나 영광스러운 능력이 있는 사람에게는 두려움도 있습니다. 권세가 있는 사람은 누구나 두려움을 갖고, 권세가 없는 사람은 모든 사람에게 멸시를 받습니다.
  to: 2. 그러나 마귀를 두려워하지 마십시오. 주님을 경외함으로써 여러분은 마귀를 제압하게 될 것입니다. 왜냐하면 그에게는 능력이 없기 때문입니다. 능력이 없는 사람에게는 두려움도 없습니다. 그러나 영광스러운 능력이 있는 사람에게는 두려움도 있습니다. 능력이 있는 사람은 누구나 두려움의 대상이 되지만, 능력이 없는 사람은 모든 사람에게 멸시를 받습니다.
  rationale: 원문의 핵심어 δύναμις를 ‘능력’으로 일관되게 유지하고, ‘두려움’의 대조가 한국어에서 오해되지 않도록 마지막 문장을 문맥에 맞게 명료화했습니다. 그 밖의 문장 구성과 신학적으로 비결정적인 표현은 초안의 의미를 유지했습니다.
