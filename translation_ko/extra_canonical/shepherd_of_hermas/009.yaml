  chosen_korean: 여사님
  alternatives_korean:
  - 레이디
  - 부인
  lexicon: BDAG
  rationale: 존칭적 호칭이라는 점을 살리면서도 현대 한국어에서 너무 장식적이거나 가벼워 보이지 않는 공손한 호칭을 택했습니다.
- source_word: ὥραν πέμπτην
  english_pob_choice: the fifth hour
  chosen_korean: 다섯째 시간쯤
