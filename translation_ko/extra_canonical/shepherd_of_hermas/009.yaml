  lexicon: LSJ
  rationale: 희귀한 가구 명칭이지만 문맥상 사람이 앉는 자리로 기능하므로 가장 중립적인 '의자'를 택했습니다.
- source_word: κεβριδάριον
  english_pob_choice: linen cushion
  chosen_korean: 리넨 베개
  alternatives_korean:
