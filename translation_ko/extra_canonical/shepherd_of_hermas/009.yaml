  rationale: 초기 기독교의 관용구를 살리되, 한국어에서 자연스러운 서술형으로 옮겼습니다. 대문자화 없이도 경외적 표현을 유지합니다.
  doctrine_reference: Early Christian idiom / Acts 5:41 parallel
- issue: χρησιμοποίηση of direct address to the woman
  chosen_reading: 여사님
  alternative_readings:
