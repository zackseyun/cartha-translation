theological_decisions:
- issue: δικαιοσύνη의 번역
  chosen_reading: 의
  alternative_readings:
  - 의로움
  - 정의
  rationale: 이 단락에서는 도덕적·영적 상태를 가리키는 말로 쓰이므로, 전통적 신학어 '의'가 가장 직접적입니다. 각주로 '정의' 가능성을 열어 둘 수 있습니다.
  doctrine_reference: 'POB contested terms: δικαιοσύνη'
- issue: τοῦ ὀνόματος의 처리
  chosen_reading: 그 이름을 위하여
  alternative_readings:
