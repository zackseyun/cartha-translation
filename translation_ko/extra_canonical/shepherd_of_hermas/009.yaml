base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009.yaml
  text: 'The vision I saw[1], brothers, was like this.


    After fasting many times and pleading with the Lord to make known to me the revelation he had promised to show me through that aged woman, on that very night the aged woman appeared to me and said: “Since you are so needy and so eager to know everything, come to the field where you spend your time, and about the fifth hour I will appear to you and show you what you must see.”


    I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”


    So I went, brothers, into the field, and I counted the hours[2], and I came to the place where I had directed her to come; and I see an ivory seat set there, and upon the seat there lay a linen cushion, and on top a spread-out towel of fine linen.


    Seeing these things set there and no one in the place, I was astonished, and a tremor, as it were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone. Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed my sins to the Lord, as before.


    And she came with six young men—whom I had seen also before—and she stood near me and listened closely while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”


    And she raised me by the hand and leads me to the seat, and she says to the young men, “Go and build.”


    And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her, “Lady, let the elders sit first.” “What I tell you,” she says, “sit.”


    So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them[c][b][a][8][7][6][5][4][3], as will all who do their works and bear what they also bore.”'
  footnotes:
  - marker: '1'
    text: The fifth hour of the day is roughly mid-to-late morning (about 11 a.m.) in Roman reckoning.
    reason: cultural_note
  - marker: '2'
    text: The Greek address Kyria means “Lady,” a respectful form of address.
    reason: lexical_alternative
  - marker: '3'
    text: The term translated “seat” renders a rare Greek word (sympelion) for a piece of furniture; it may be a low bench or couch.
    reason: cultural_note
  - marker: '4'
    text: “Fine linen” translates karpasion (carbasus), a high-quality linen fabric.
    reason: cultural_note
  - marker: '5'
    text: “Righteousness” can also mean “justice,” depending on context.
    reason: lexical_alternative
  - marker: '6'
    text: “Household” translates oikos, which can mean a physical house or an extended household.
    reason: lexical_alternative
  - marker: '7'
    text: “Elders” (presbyteroi) may refer either to older men or to those holding an office of oversight in the community.
    reason: lexical_alternative
  - marker: '8'
    text: “For the sake of the Name” is an early Christian idiom for suffering on account of God’s/Jesus’ name (cf. Acts 5:41).
    reason: cross_reference
  - marker: a
    text: Or '“What I say to you—sit,” she says.'.
    reason: previous_rendering
  - marker: b
    text: Or 'but for you, many things are lacking for you to sit with them.'.
    reason: previous_rendering
  - marker: c
    text: Or 'stop asking all these things about your sins'.
    reason: previous_rendering
translation:
  language: ko
  text: '내가 본 환상은, 형제들이여, 이러하였습니다.


    여러 번 금식하고, 그 노파를 통해 내게 보여 주기로 약속하신 계시를 내게 밝혀 달라고 주님께 간청한 뒤, 바로 그날 밤에 그 노파가 내게 나타나 말했습니다. “네가 이처럼 필요로 하고 모든 것을 알고 싶어 하니, 네가 머무는 밭으로 와라. 다섯째 시간쯤에 내가 네게 나타나 네가 보아야 할 것을 보여 주겠다.”


    내가 그녀에게 물었습니다. “여사님, 밭의 어느 곳입니까?” 그녀가 말했습니다. “네가 원하는 곳이면 어디든지.” 나는 좋고 한적한 자리를 골랐습니다. 그런데 내가 그녀에게 말하고 그 장소를 밝히기도 전에, 그녀가 내게 말했습니다. “네가 원하는 바로 그곳으로 내가 가겠다.”


    그래서 나는 형제들이여, 밭으로 갔고, 시간을 헤아렸으며, 내가 그녀에게 오라고 지시해 둔 곳에 이르렀습니다. 그런데 거기에 상아로 된 의자가 놓여 있고, 그 의자 위에는 리넨 베개가 놓여 있으며, 그 위에는 펼쳐 놓은 고운 리넨 수건이 있었습니다.


    거기에 놓인 이런 것들을 보고도 그 자리에 아무도 없는 것을 보자, 나는 놀랐고, 마치 떨림이 나를 사로잡은 듯했으며, 내 머리카락이 곤두섰습니다. 그리고 혼자였으므로 마치 전율이 나에게 덮쳐 온 듯했습니다. 그러다가 제정신을 차리고 하나님의 영광을 기억하며 용기를 얻어 무릎을 꿇고, 전과 같이 다시 주님께 내 죄를 고백하였습니다.


    그녀는 내가 전에 본 적 있는 젊은이 여섯 명과 함께 왔고, 내 곁에 서서 내가 주님께 기도하며 내 죄를 고백하는 동안 귀 기울여 들었습니다. 그리고 나를 만지며 말했습니다. “헤르마스, 네 죄에 관해 모든 것을 묻는 일을 멈추어라. 의에 대해서도 물어서, 네 집안을 위해 그것의 얼마라도 얻어라.”


    그녀는 내 손을 잡아 일으켜 의자 쪽으로 나를 데리고 가서, 젊은이들에게 말했습니다. “가서 지으라.”


    젊은이들이 물러가고 우리만 남았을 때, 그녀가 내게 말했습니다. “여기에 앉아라.” 내가 그녀에게 말했습니다. “여사님, 먼저 장로들이 앉게 하십시오.” “내가 네게 말하는 대로,” 그녀가 말했습니다, “앉아라.”


    내가 오른쪽에 앉으려 하자 그녀는 허락하지 않고, 손으로 나에게 신호하여 왼쪽에 앉으라고 하였습니다. 그래서 내가 생각하며, 그녀가 나를 오른쪽에 앉게 허락하지 않은 것을 슬퍼하고 있을 때, 그녀가 내게 말했습니다. “헤르마스, 네가 슬퍼하느냐? 오른쪽 자리는 이미 하나님을 기쁘시게 해 드렸고 그 이름을 위하여 고난을 받은 다른 사람들의 자리이다. 그러나 네가 그들과 함께 앉기에는 아직 많이 부족하다. 그러나 네가 네 단순함 안에 머무는 만큼 머문다면, 너도 그들과 함께 앉게 될 것이며, 그들이 했던 일을 하고 그들이 견딘 것을 견디는 모든 이들도 그러할 것이다.”[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
