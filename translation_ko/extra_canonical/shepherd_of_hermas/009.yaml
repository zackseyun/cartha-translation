  - 리넨 쿠션
  lexicon: LSJ
  rationale: 작고 부드러운 받침물이라는 기능을 살리되, 한국어에서 자연스러운 가구 용어로 옮겼습니다.
- source_word: λεντίον
  english_pob_choice: towel
  chosen_korean: 수건
  alternatives_korean:
