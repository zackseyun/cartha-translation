  rationale: 고대 시간 표현을 그대로 유지하고, 한국 독자를 위해 시간 감각을 해치지 않도록 '쯤'을 보완했습니다.
- source_word: συμπέλιον
  english_pob_choice: seat
  chosen_korean: 의자
  alternatives_korean:
