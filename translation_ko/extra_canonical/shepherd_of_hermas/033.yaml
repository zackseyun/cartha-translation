base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033.yaml
  text: 'He says[1], “I commanded you in the first commandment to keep faith and fear and self-control.”[2] “Yes, lord,” I say. “But now,” he says, “I also want to make known to you their powers, so that you may understand what power and activity each of them has. For their activities are twofold; so they have to do with what is righteous and what is unrighteous. So you—trust what is righteous, but do not trust what is unrighteous; for what is righteous has a straight road, but what is unrighteous a crooked one. But you, walk on the straight [and level][1] road, and leave the crooked[2].


    For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come craving for many undertakings, and extravagance in many foods, and intoxicants and many revelries, and luxuries of various kinds, and things that are not fitting; and desire for women, and greed, and haughtiness, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.


    So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s slaves. You therefore have the activities of both angels; discern them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God.[3] But believe that the works of the angel of wickedness are grievous; so by not doing them[a][3], you will live
    to God.”'
  footnotes:
  - marker: '1'
    text: Some witnesses include 'and level' (καὶ ὁμαλῇ) after 'straight.'
    reason: textual_variant
  - marker: '2'
    text: The 'first commandment' alludes back to the opening mandate where foundational virtues are given.
    reason: cross_reference
  - marker: '3'
    text: '''Trust the works'' reflects πιστεύειν with a dative; alternatives include ''give credence to'' or ''heed.'''
    reason: lexical_alternative
  - marker: a
    text: Or 'and pleasures of various kinds that are not fitting'.
    reason: previous_rendering
translation:
  language: ko
  text: '그가 말씀하십니다. 「내가 첫째 계명에서 너에게 믿음과 두려움과 절제는 지키라고 명령하였다」[2] 「예, 주님」, 제가 말합니다. 「하지만 이제」, 그가 말씀하십니다, 「나는 또한 그들의 능력을 너에게 알려 주기를 원한다. 그래야 너는 각각이 어떤 능력과 작용을 가지고 있는지 깨달을 것이다. 왜냐하면 그들의 작용은 둘로 나뉘기 때문이다. 그러므로 그것들은 의로운 것과 불의한 것에 관련된다. 그러니 너는 의로운 것을 신뢰하고, 불의한 것은 신뢰하지 마라. 왜냐하면 의로운 것은 곧은 길을 가지고 있지만, 불의한 것은 굽은 길을 가지고 있기 때문이다. 그러나 너는 곧은 [그리고 평탄한][1] 길로 걸어가고, 굽은 길은 버려라.


    굽은 길에는 난간이 없고, 길 없는 곳들과 많은 걸림돌이 있으며, 거칠고 가시돋쳐 있습니다. 그러므로 그것은 해롭습니다. 그러나 다른 길의 행위들도 들으십시오. 먼저, 급한 성미나 쓴마음이 여러분에게 닥쳐오면, 그것이 여러분 안에 있음을 아십시오. 그런 다음 많은 일에 대한 갈망과, 많은 음식과 음료에 대한 사치와, 많은 술취함과, 여러 가지 사치와, 마땅하지 않은 것들이 따르고, 여자들에 대한 욕망과, 탐욕과, 교만과, 자랑과, 그 밖에 이와 비슷하고 닮은 것들이 따릅니다. 그러므로 이런 것들이 여러분의 마음에 떠오를 때마다, 악의 천사가 여러분과 함께 있음을 아십시오.


    그러므로 그 행위들을 알아차리면 그에게서 물러나고, 그를 조금도 신뢰하지 마십시오. 그의 행위들은 악하며 하나님의 노예들에게 유익하지 않기 때문입니다. 그러므로 여러분은 두 천사의 작용을 모두 가지고 있습니다. 그것들을 분별하고 의의 천사를 신뢰하십시오. 그러나 악의 천사에게서는 물러나십시오. 그의 가르침은 모든 행위에서 악하기 때문입니다. 만일 어떤 사람이 신실한 사람이라면, 이 천사의 생각이 그 사람의 마음에 떠오를 때, 그 남자나 여자는 반드시 어떤 죄를 짓게 될 것입니다. 그러나 다시 어떤 남자나 여자가 매우 악하다면, 의의 천사의 행위들이 그 사람의 마음에 떠오를 때, 그 사람은 반드시 무슨 좋은 일인가를 하게 되어 있습니다. 그러니 그가 말씀하십니다. 의의 천사를 따르는 것이 좋고, 악의 천사를 버리는 것이 좋다는 것을 보십시오. 믿음에 관하여 이 계명은 분명히 밝힙니다. 곧 여러분이 의의 천사의 행위들을 신뢰하고, 그것들을 행한 뒤 하나님께로 살게 하려는 것입니다.[3] 그러나 악의 천사의 행위들은 무겁고 괴롭다고 믿으십시오. 그러므로 그것들을 행하지 않음으로써 여러분은 하나님께로 살게 될 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστιν
  english_pob_choice: faith
  chosen_korean: 믿음
  alternatives_korean:
  - 신뢰
  - 신실함
  lexicon: BDAG
  rationale: 첫 계명에서 지켜야 할 덕목을 가리키므로 표준적인 교회·학술 용례인 ‘믿음’을 택했습니다.
- source_word: φόβον
  english_pob_choice: fear
  chosen_korean: 두려움
  alternatives_korean:
  - 경외
  - 경외심
  lexicon: BDAG
  rationale: 문맥상 하나님 앞의 경외를 포함하지만, 원문의 직설적 긴장감을 살리기 위해 ‘두려움’으로 옮겼습니다.
- source_word: ἐγκράτειαν
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 자기 절제
  lexicon: BDAG
  rationale: 윤리적 덕목 목록의 표준 번역으로 자연스럽고 간결합니다.
- source_word: δυνάμεις / ἐνέργειαι
  english_pob_choice: powers / activities
  chosen_korean: 능력과 작용
  alternatives_korean:
  - 권능과 활동
  - 힘과 역사
  lexicon: LSJ
  rationale: 두 단어의 구분을 살려, 각각의 내적 효력과 실제로 드러나는 작용을 함께 표현했습니다.
- source_word: δίκαιον / ἄδικον
  english_pob_choice: what is righteous / what is unrighteous
  chosen_korean: 의로운 것 / 불의한 것
  alternatives_korean:
  - 의로운 자 / 불의한 자
  - 의 / 불의
  lexicon: BDAG
  rationale: 명사적 중성 표현을 살려 추상적 항목처럼 번역했고, 뒤의 ‘의의 천사’와 연결되도록 했습니다.
- source_word: ὁδός
  english_pob_choice: road / path
  chosen_korean: 길
  alternatives_korean:
  - 도로
  - 길목
  lexicon: LSJ
  rationale: 비유가 반복되므로 한국어에서는 가장 자연스러운 ‘길’로 통일했습니다.
- source_word: ἀνοδίαι
  english_pob_choice: pathless places
  chosen_korean: 길 없는 곳들
  alternatives_korean:
  - 무로(無路)의 곳
  - 길 없는 구간
  lexicon: LSJ
  rationale: 원문의 복수성과 지형적 이미지를 그대로 드러내기 위해 직역에 가깝게 처리했습니다.
- source_word: πικρία
  english_pob_choice: bitterness
  chosen_korean: 쓴마음
  alternatives_korean:
  - 비통함
  - 쓰라림
  lexicon: BDAG
  rationale: 내면의 정서이면서도 이어지는 악한 영향의 목록과 잘 맞는 자연스러운 한국어 표현입니다.
- source_word: κραιπάλαι
  english_pob_choice: revelries
  chosen_korean: 술취함
  alternatives_korean:
  - 연회
  - 유흥
  lexicon: LSJ
  rationale: 본문에 이미 ‘음료’와 함께 나오는 방탕의 양상을 반영해, 한국어 독자가 즉시 이해할 수 있도록 했습니다.
- source_word: ἀλαζονεία
  english_pob_choice: boastfulness
  chosen_korean: 자랑
  alternatives_korean:
  - 허풍
  - 과시
  lexicon: BDAG
  rationale: 교만과 병렬되는 자기과시적 태도를 간결하게 담았습니다.
- source_word: δούλοις τοῦ Θεοῦ
  english_pob_choice: slaves of God
  chosen_korean: 하나님의 노예들
  alternatives_korean:
  - 하나님의 종들
  - 하나님의 종노릇하는 자들
  lexicon: BDAG
  rationale: 예속성과 소속을 강하게 드러내는 원문의 충격을 유지하기 위해 ‘노예’로 옮겼습니다.
- source_word: ἀπόστα
  english_pob_choice: withdraw
  chosen_korean: 물러나고
  alternatives_korean:
  - 떠나고
  - 멀어지고
  lexicon: BDAG
  rationale: 단순한 거리두기와 도덕적 분리를 함께 담는 가장 자연스러운 한국어 동사입니다.
- source_word: πιστὸς ἀνήρ
  english_pob_choice: faithful man / faithful person
  chosen_korean: 신실한 사람
  alternatives_korean:
  - 믿는 남자
  - 신실한 남자
  lexicon: BDAG
  rationale: 뒤이어 ‘남자나 여자’가 나오므로, 성별을 미리 고정하지 않고 인격적 신실함을 살렸습니다.
- source_word: ζήσῃ τῷ Θεῷ
  english_pob_choice: live to God
  chosen_korean: 하나님께로 살게 하려는 것입니다
  alternatives_korean:
  - 하나님을 향해 살 것입니다
  - 하나님을 위해 살 것입니다
  lexicon: BDAG
  rationale: 여격의 방향성을 살리면서도 한국어 문장에서는 결과절로 자연스럽게 풀어 주었습니다.
theological_decisions:
- issue: 불의한 것/의로운 것과 그 천사들의 관계
  chosen_reading: ‘의의 천사’와 ‘악의 천사’가 각각 의로운 것과 불의한 것을 매개하는 존재로 유지했습니다.
  alternative_readings:
  - 의로운 천사/악한 천사
  - 의/불의 자체
  rationale: 본문은 추상 개념보다 천사적 매개를 강조하므로, moral taxonomy를 흐리지 않고 원문의 구도를 보존했습니다.
  doctrine_reference: Hermas의 도덕적 이원론과 천사 매개 윤리
- issue: πιστεύειν + 여격의 번역
  chosen_reading: 문맥에 따라 ‘신뢰하다’로 옮기되, ‘믿음’ 논의의 결론부에서는 ‘신뢰하다’와 ‘믿음’을 함께 살렸습니다.
  alternative_readings:
  - 믿다
  - 신뢰를 두다
  - 귀 기울이다
  rationale: 대상이 사람이나 행위일 때는 단순 인지 동의보다 충성과 의탁의 뉘앙스가 강하므로 ‘신뢰’가 더 적절합니다.
  doctrine_reference: 행위와 충성의 결합을 요구하는 고대 기독교 윤리
