revisions:
- from: 우선, 하나님은 한 분이시며, 만물을 창조하시고 질서를 세우시며, 무(無)에서 만물을 존재하게 하시고, 만물을 담고 계시는 분임을 믿으십시오. 그러나 그분만이 참을 수 없으십니다. 그러므로 그를 믿고 그를 두려워하라. 두려워하고 자제하십시오. 이것을 지키라 그리하면 네가 이 계명을 지키면 네게서 모든 악을 버리고 모든 의의 덕을 입으리니 그리하면 네가 하나님을 위하여 살리라.
  to: 무엇보다 먼저, 하나님은 한 분이시며, 만물을 창조하시고 질서를 세우시며, 존재하지 않던 것으로부터 만물을 존재하게 하시고, 만물을 담고 계시되 오직 그분만은 어느 것에도 담기지 않으시는 분임을 믿으십시오. 그러므로 그분을 믿고 경외하십시오. 그분을 경외하며 절제하십시오. 이것들을 지키십시오. 그러면 자신에게서 모든 악을 벗어 버리고 의에 속한 모든 덕을 입게 될 것이며, 이 계명을 지키면 하나님을 위하여 살게 될 것입니다.
  rationale: ἀχώρητος의 핵심 의미를 바로잡고, 원문의 대조(만물을 포괄하시는 분이나 자신은 포괄되지 않으심)를 보존했습니다. 명령형과 미래형의 전개 및 마지막 조건절을 현대 표준 한국어 합쇼체로 일관되게 재구성했습니다.
