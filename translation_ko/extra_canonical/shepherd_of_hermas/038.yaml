base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/038.yaml
  text: '“Listen, then,” he says, “foolish one, how sorrow wears down[a] the Holy Spirit and again saves. Whenever the double‑minded[b] person sets himself to some deed and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper[c] clings to a person about some matter and he becomes exceedingly embittered, again sorrow enters into the heart of the one who gave way to quick temper, and he is grieved over his deed that he did and repents, because he worked evil. This sorrow, then, seems to have salvation[f], because having done the evil he repented. Therefore both actions grieve the Spirit: double‑mindedness, because it did not succeed in its deed; and quick temper grieves the Spirit, because it did the evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you, lest it
    plead[d] with God and depart from you. For the Spirit of God that has been given into this flesh does not endure sorrow or anguish[e].”'
translation:
  language: ko
  text: “그런즉 들어보십시오. 어리석은 사람아, 슬픔이 어떻게 성령을 닳아 없어지게 하는지, 또 어떻게 다시 구원에 이르게 하는지 말입니다. 어떤 두 마음을 품은 사람이 어떤 일을 시도했다가 자기의 두 마음 때문에 그것을 이루지 못하면, 그 슬픔이 그 사람 안으로 들어가 성령을 근심하게 하고 성령을 닳아 없어지게 합니다. 또 어떤 일에 관해 성급한 분노가 사람에게 붙어 그가 몹시 쓰라려지면, 다시 그 사람의 마음속으로 슬픔이 들어가서, 그가 행한 일 때문에 슬퍼하고 자기가 악을 행했기 때문에 회개합니다. 그러므로 이 슬픔은, 악을 행한 뒤에 회개했으므로, 구원이 있는 것처럼 보입니다. 그러므로 두 행위 모두 영을 근심하게 합니다. 두 마음을 품는 것은 그 일이 이루어지지 않았기 때문이고, 성급한 분노는 악을 행했기 때문입니다. 그러므로 두 가지 모두—두 마음을 품는 것과 성급한 분노—성령에게는 괴로운 일입니다. 그러므로 슬픔을 당신에게서 벗겨 내고, 당신 안에 거하시는 성령을 괴롭게 하지 마십시오. 그러면 그 영이 하나님께 간구하고 당신에게서 떠날지도 모릅니다. 하나님의 영은 이 육체에 주어진 것이므로 슬픔이나 답답함을 견디지 못하기 때문입니다.”[a][b][c][d][e][f]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ λύπη
  english_pob_choice: sorrow
  chosen_korean: 슬픔
  alternatives_korean:
  - 근심
  - 비애
  lexicon: λύπη
  rationale: POB가 일관되게 sorrow를 사용하므로 기본적으로 슬픔으로 옮기되, 문맥상 성령을 ‘근심하게’ 하는 동작은 근심하다로 자연스럽게 구분했습니다.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  english_pob_choice: the Holy Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 거룩한 영
  - 하나님의 영
  lexicon: πνεῦμα ἅγιον
  rationale: 여기서는 하나님의 영으로서의 강한 지시가 분명하므로 성령으로 번역했고, 뒤의 τὸ πνεῦμα τοῦ θεοῦ는 원문에 맞게 하나님의 영으로 따로 살렸습니다.
- source_word: δίψυχος
  english_pob_choice: double-minded
  chosen_korean: 두 마음을 품은 사람
  alternatives_korean:
  - 우유부단한 사람
  - 양심이 갈린 사람
  lexicon: δίψυχος
  rationale: 단순한 결단력 부족보다 내적 분열과 양면성을 드러내는 표현이므로, 전통적이지만 의미를 직접 드러내는 두 마음을 품은 사람을 택했습니다.
- source_word: ὀξυχολία
  english_pob_choice: quick temper
  chosen_korean: 성급한 분노
  alternatives_korean:
  - 화를 잘 냄
  - 격한 성미
  lexicon: ὀξυχολία
  rationale: POB의 quick temper를 따라 단순 성격이 아니라 분노가 빠르게 치솟는 상태를 살렸습니다.
- source_word: λυπεῖ τὸ πνεῦμα
  english_pob_choice: grieves the Spirit
  chosen_korean: 영을 근심하게 합니다
  alternatives_korean:
  - 영을 슬프게 합니다
  - 영의 마음을 아프게 합니다
  lexicon: λυπέω
  rationale: 동사의 반복을 살리면서도 한국어에서 성령을 직접 ‘슬프게 하다’보다 ‘근심하게 하다’가 더 자연스럽고 문맥에 맞아 선택했습니다.
- source_word: ἐντεύξηται τῷ θεῷ
  english_pob_choice: plead with God
  chosen_korean: 하나님께 간구하고
  alternatives_korean:
  - 하나님께 중보하고
  - 하나님께 호소하고
  lexicon: ἐντυγχάνω
  rationale: 주어가 성령이면서 대상을 향해 중재적 호소를 하는 뜻이므로 간구하다가 가장 직접적이며, 간구하고 떠날지도 모릅니다로 절박성을 살렸습니다.
- source_word: στενοχωρίαν
  english_pob_choice: anguish
  chosen_korean: 답답함
  alternatives_korean:
  - 고통
  - 곤궁
  lexicon: στενοχωρία
  rationale: POB가 anguish로 읽은 긴축·압박의 뜻을 한국어에서 심리적 압박감에 가까운 답답함으로 옮겨, 슬픔과 병렬되는 두 항을 유지했습니다.
theological_decisions:
- issue: 성령의 인격적 반응과 중보적 행동
  chosen_reading: 성령을 근심하게 하고… 그 영이 하나님께 간구하고 당신에게서 떠날지도 모릅니다
  alternative_readings:
  - 성령을 슬프게 하고… 성령이 하나님께 호소하고 떠날지도 모릅니다
  rationale: 원문의 ψυχή가 아니라 πνεῦμα에 귀속된 반응이며, 성령이 단지 영향력이 아니라 인격적으로 근심하고 간구하는 주체라는 점을 드러내야 합니다.
  doctrine_reference: 성령의 인격성
- issue: ‘구원이 있는 것처럼 보입니다’의 긴장 보존
  chosen_reading: 구원이 있는 것처럼 보입니다
  alternative_readings:
  - 구원에 이르는 듯합니다
  - 구원에 도움이 되는 듯합니다
  rationale: 원문 δοκεῖ σωτηρίαν ἔχειν의 외관상 구원/해방의 가능성을 말하는 긴장을 완화하지 않고, 회개가 항상 근본적으로 선하다고 단정하지 않는 문맥을 살렸습니다.
  doctrine_reference: 회개와 구원의 관계
