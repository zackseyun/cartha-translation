source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Πρῶτον πάντων πίστευσον ὅτι εἷς ἐστὶν ὁ Θεός, ὁ τὰ πάντα κτίσας καὶ καταρτίσας, καὶ ποιήσας ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι τὰ πάντα, καὶ πάντα χωρῶν, μόνος δὲ ἀχώρητος ὤν. 2. πίστευσον οὖν αὐτῷ καὶ φοβήθητι αὐτόν, φοβηθεὶς δὲ ἐγκράτευσαι. ταῦτα φύλασσε καὶ ἀποβαλεῖς πᾶσαν πονηρίαν ἀπὸ σεαυτοῦ καὶ ἐνδύσῃ πᾶσαν ἀρετὴν δικαιοσύνης καὶ ζήσῃ τῷ θεῷ, ἐὰν φυλάξῃς τὴν ἐντολὴν ταύτην.
  language: Greek
  pages:
  - 334
  unit_id: M.1
  label: Mandate 1
  sequence: 26
base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/026.yaml
  text: First of all[1], believe that God is one—the one who created and set in order all things, and brought all things into being from what was not, and who encompasses all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, practice self-control. Keep these things, and you will throw off every wickedness from yourself and put on every virtue of righteousness, and you will live to God[a][5][4][3][2], if you keep this command.
  footnotes:
  - marker: '1'
    text: Lit. "from the not-being into being"; also rendered "from non-being into being" or paraphrased "out of nothing."
    reason: lexical_alternative
  - marker: '2'
    text: 'Or: "contains all things, being himself uncontained."'
    reason: lexical_alternative
  - marker: '3'
    text: 'Or: "be self-controlled"; older English: "be continent."'
    reason: lexical_alternative
  - marker: '4'
    text: 'Or: "clothe yourself with every virtue of righteousness."'
    reason: lexical_alternative
  - marker: '5'
    text: 'Or: "you will live to God."'
    reason: lexical_alternative
  - marker: a
    text: Or 'and you will live for God'.
    reason: previous_rendering
translation:
  language: ko
  text: 무엇보다 먼저, 하나님은 한 분이심을 믿으십시오 — 곧 만물을 창조하시고 질서 있게 세우셨으며, 보이지 않는 것에서 만물을 존재하게 하셨고, 만물을 포함하시되 그분만은 담아낼 수 없는 분이십니다. 그러므로 그분을 믿고 그분을 두려워하십시오. 두려워한 뒤에는 절제하십시오. 이 일들을 지키면, 여러분은 스스로에게서 모든 악을 벗어 던지고 의의 온갖 덕을 입게 되며, 이 계명을 지키면 하나님을 향하여 살게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτον πάντων
  english_pob_choice: First of all
  chosen_korean: 무엇보다 먼저
  alternatives_korean:
  - 첫째로
  - 모든 것보다 먼저
  lexicon: LSJ
  rationale: 우선순위를 분명히 하는 관용구로, 현대 한국어 합쇼체에서도 자연스럽고 권면문의 강세를 살립니다.
- source_word: εἷς ἐστὶν ὁ Θεός
  english_pob_choice: God is one
  chosen_korean: 하나님은 한 분이심
  alternatives_korean:
  - 하나님은 하나이심
  - 한 분 하나님이 계심
  lexicon: BDAG
  rationale: 단순한 수적 진술을 유지하면서도 한국어에서는 ‘한 분이심’이 신앙고백적 울림을 가장 잘 살립니다.
- source_word: καταρτίσας
  english_pob_choice: set in order
  chosen_korean: 질서 있게 세우셨으며
  alternatives_korean:
  - 정돈하셨으며
  - 정립하셨으며
  - 제자리에 맞추셨으며
  lexicon: BDAG
  rationale: κτίσας와 병렬되는 동사로서 단순 창조를 넘어 세계를 질서화하시는 뜻을 살렸습니다.
- source_word: ποιήσας ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  english_pob_choice: brought all things into being from what was not
  chosen_korean: 보이지 않는 것에서 만물을 존재하게 하셨고
  alternatives_korean:
  - 무(無)에서 만물을 존재하게 하셨고
  - 없는 것에서 만물을 있게 하셨고
  lexicon: LSJ
  rationale: 문자적으로는 ‘존재하지 않던 것에서 존재로’이지만, 한국어에서는 ‘존재하게 하셨고’가 원문의 생성 의미를 자연스럽게 전달합니다.
- source_word: πάντα χωρῶν
  english_pob_choice: encompasses all things
  chosen_korean: 만물을 포함하시되
  alternatives_korean:
  - 만물을 담으시되
  - 만물을 포괄하시되
  - 만물을 품으시되
  lexicon: LSJ
  rationale: ‘포함하다/담다’ 계열로 χωρέω의 ‘들어가게 하다, 수용하다’의 의미를 살리되, 신적 무한성을 강조하기 위해 연결형으로 처리했습니다.
- source_word: ἀχώρητος
  english_pob_choice: uncontainable
  chosen_korean: 담아낼 수 없는 분이십니다
  alternatives_korean:
  - 포함될 수 없는 분이십니다
  - 담길 수 없는 분이십니다
  - 갇힐 수 없는 분이십니다
  lexicon: LSJ
  rationale: πάντα χωρῶν과의 어휘 대구를 한국어에서도 살리기 위해 ‘담다/포함하다’ 계열로 대응했습니다.
- source_word: πίστευσον οὖν αὐτῷ
  english_pob_choice: put your trust in him
  chosen_korean: 그분을 믿고
  alternatives_korean:
  - 그분을 신뢰하고
  - 그분께 믿음을 두고
  lexicon: BDAG
  rationale: 앞절의 ‘믿으십시오’와 이어지는 동격적 권면으로, 대상 인칭을 자연스럽게 유지했습니다.
- source_word: ἐγκράτευσαι
  english_pob_choice: practice self-control
  chosen_korean: 절제하십시오
  alternatives_korean:
  - 자기 절제를 실천하십시오
  - 스스로 절제하십시오
  lexicon: BDAG
  rationale: 한국어 윤리어휘에서 간결하고 직접적인 대응어이며, 문맥상 단회적 행위가 아니라 지속적 자기 다스림을 뜻합니다.
- source_word: ἀποβαλεῖς πᾶσαν πονηρίαν
  english_pob_choice: throw off every wickedness
  chosen_korean: 모든 악을 벗어 던지고
  alternatives_korean:
  - 모든 악을 버리고
  - 모든 악을 떨쳐 내고
  lexicon: BDAG
  rationale: ‘throw off’의 격렬한 이미지와 ἐνδύσῃ와의 의복 은유를 살리기 위해 ‘벗어 던지고’를 택했습니다.
- source_word: ἐνδύσῃ πᾶσαν ἀρετὴν δικαιοσύνης
  english_pob_choice: put on every virtue of righteousness
  chosen_korean: 의의 온갖 덕을 입게 되며
  alternatives_korean:
  - 의의 모든 덕을 입고
  - 의로운 모든 덕으로 옷 입게 되며
  lexicon: BDAG
  rationale: ‘입다’로 의복 은유를 유지하면서, ἀρετή를 ‘덕’으로, δικαιοσύνης를 ‘의’로 대응했습니다.
- source_word: ζήσῃ τῷ θεῷ
  english_pob_choice: you will live to God
  chosen_korean: 하나님을 향하여 살게 될 것입니다
  alternatives_korean:
  - 하나님을 위해 살게 될 것입니다
  - 하나님께 살게 될 것입니다
  lexicon: BDAG
  rationale: 여격의 관계·지향성을 한국어에서는 ‘~을 향하여’가 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: 창조의 기원 표현 ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  chosen_reading: ‘보이지 않는 것에서 만물을 존재하게 하셨고’로 옮겨, 무(無)로부터의 창조를 암시하되 철학적 용어를 덧씌우지 않았습니다.
  alternative_readings:
  - ‘무에서 만물을 존재하게 하셨고’
  - ‘없는 것에서 만물을 있게 하셨고’
  rationale: 본문의 초점은 형이상학적 정의가 아니라 하나님이 모든 것의 기원이심을 고백하는 데 있으므로, 원문의 생성 운동을 그대로 살리는 쪽을 택했습니다.
  doctrine_reference: 창조와 하나님의 주권
- issue: 하나님의 초월성 대구 πάντα χωρῶν, μόνος δὲ ἀχώρητος
  chosen_reading: ‘만물을 포함하시되 그분만은 담아낼 수 없는 분이십니다’로 대구를 살렸습니다.
  alternative_readings:
  - ‘만물을 담으시되 그분 자신은 담기지 않는 분이십니다’
  - ‘만물을 포함하시나 홀로 포섭될 수 없으신 분이십니다’
  rationale: 원문은 ‘포함함/포함될 수 없음’의 역설로 하나님의 무한성과 피조 세계의 한계를 말하므로, 한국어에서도 같은 긴장을 유지해야 합니다.
  doctrine_reference: 하나님의 초월성과 무한성
- issue: πίστευσον οὖν αὐτῷ의 신뢰 뉘앙스
  chosen_reading: 앞의 ‘믿으십시오’와 연결해 ‘그분을 믿고’로 옮겼습니다.
  alternative_readings:
  - ‘그분을 신뢰하고’
  - ‘그분께 믿음을 두고’
  rationale: 여격이 주는 관계적 의미를 살리면서도, 앞절의 명제적 믿음과 지나치게 분리되지 않게 하여 권면의 흐름을 유지합니다.
  doctrine_reference: 믿음과 순종의 연속성
