revisions:
- from: 이를 위하여 주인이 너희를 부요하게 하여 너희로 그를 위하여 이 직분을 행하게 하였느니라 당신이 도시에 도착했을 때 찾을 수 있는 그런 밭[과 사유지]과 집을 사는 것이 훨씬 낫습니다. 이 사치는 선하고 즐거운 것이니 근심도 없고 두려움도 없고 기쁨이 있는 것이라. 그러므로 이방인의 사치를 행하지 말라. 이는 하나님의 종들인 너희에게 무익하니라. 오히려 당신이 기뻐할 수 있는 당신만의 사치를 실천하십시오. 이런 종류의 사치는 모두 유익합니다. 그러나 민족의 사치는 씁쓸하고 가혹합니다. 그러므로 이 비유는 가난한 자와 부자를 위한 하나님의 종들 앞에 제시된 것입니다.
