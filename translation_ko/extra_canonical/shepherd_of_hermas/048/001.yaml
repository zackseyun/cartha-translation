  source_fidelity: 핵심 권고의 흐름(부요함의 목적, 가난한 이들을 위한 섬김, 이방인의 πολυτέλεια를 피하라는 명령, 가난한 자와 부자 모두에게 적용되는 비유)은 대체로 반영되었으나, 2인칭 호칭이 혼재하고 일부 표현이 원문의 복수 청자와 문체를 흐립니다. 대괄호 안의 καὶ κτήματα는 본문 이문/삽입 가능성을 표시하므로 한국어에서도 각주 표지로 보존하는 것이 안전합니다. 제시된 그리스어는 11절 중간이 전승·OCR상 불연속적이므로, 해당 부분의 영어 POB 감사문구를 따르되 단정적 해석을 덧붙이지 않았습니다.
  naturalness: 초안은 ‘하였느니라/낫습니다/실천하십시오’가 한 문단 안에 섞여 합쇼체가 일관되지 않고, 복수 청자에게 ‘당신’ 단수를 사용합니다. ‘주인이 너희를 부요하게 하여 너희로’도 현대 한국어로 다듬을 필요가 있습니다.
  terminology: δεσπότης는 문맥상 ‘주인’, διακονίαι는 ‘섬김의 일들’, δοῦλοι τοῦ Θεοῦ는 ‘하나님의 종들’로 옮겼습니다. ἔθνη는 여기서 ‘민족’보다 관용적인 종교·윤리적 대조를 살린 ‘이방인들’이 적절합니다. πολυτέλεια는 문맥상 반복되는 핵심어이므로 ‘사치’를 유지했습니다.
