  source_fidelity: 수정이 필요합니다. 초안은 πρὸς τὸν Κύριον πτωχεύει를 ‘주 앞에서는 가난하다’로 대체로 옮겼으나, περισπώμενος περὶ τὸν πλοῦτον αὐτοῦ(자기 재물에 마음이 분산됨)를 ‘자기 부에 관심이 없고’로 정반대로 번역했습니다. 또한 단수의 부자·궁핍한 이를 복수로 바꾸는 곳이 있고, ‘그에게 필요한 것’, 보상의 믿음, 궁핍한 이의 간구, 삶이 계속되도록 돕는다는 인과관계가 여러 곳에서 흐려졌습니다. 대괄호로 제시된 두 본문 이문은 각주로 보존했습니다.
  naturalness: 초안은 합쇼체, 해라체, 성경식 문어체가 혼재하고 인용부호 및 문장 경계가 무너져 있습니다. 현대 표준어 합쇼체로 일관되게 정리했습니다. ‘간구’는 본문의 ἔντευξις에 맞추되, ‘중보’라는 해석어를 본문에 덧붙이지 않았습니다.
  terminology: Θεός는 ‘하나님’, Κύριος는 ‘주님’으로 일관했습니다. ἐξομολόγησις는 이 문맥에서 교리적으로 한정하지 않고 ‘고백’으로 옮겼습니다. διακονία는 ‘섬김’으로 번역했습니다. ‘느릅나무’와 ‘포도나무’의 비유 및 ‘간구’의 상호성도 유지했습니다.
