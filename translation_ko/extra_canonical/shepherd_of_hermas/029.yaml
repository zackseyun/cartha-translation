base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029.yaml
  text: '“I am commanding you,” he says[1], “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.


    “For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a slave of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”


    I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”


    “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say[2], "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the slaves of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.


    “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.


    “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin[a][8][7][6][5][4][3], there is One who is able to give healing—for he is the One who has authority over all.”'
  footnotes:
  - marker: '1'
    text: “Another man’s wife” (γυναικὸς ἀλλοτρίας) is a common idiom for a woman belonging to another, i.e., a married woman not one’s own.
    reason: cultural_note
  - marker: '2'
    text: The phrase “rise up upon the heart” reflects the Greek idiom ἀναβαίνειν ἐπὶ τὴν καρδίαν, a vivid picture of a thought’s ascent into the inner life.
    reason: cultural_note
  - marker: '3'
    text: “Brings death upon himself” translates κατεργάζομαι + θάνατος; alternatively, “works out death for himself.”
    reason: lexical_alternative
  - marker: '4'
    text: Rendered “Sir” (Κύριε) to reflect respectful address to the shepherd; alternatively “Lord.”
    reason: lexical_alternative
  - marker: '5'
    text: “Not repeatedly” (μὴ ἐπὶ πολὺ) could also be read “not for long,” but the context (μετάνοιά ἐστιν μία, “repentance is one”) suggests limitation of frequency rather than duration.
    reason: lexical_alternative
  - marker: '6'
    text: “Repentance is one” echoes Hermas’s distinctive teaching about a single decisive repentance after grave sin; cf. its reception in later penitential discipline.
    reason: cross_reference
  - marker: '7'
    text: “To remain by yourselves” (ἐφ᾽ ἑαυτοῖς μένειν) idiomatically means to remain unmarried/single in this context, preserving space for the other’s repentance.
    reason: cultural_note
  - marker: '8'
    text: “Makes images as the nations do” (τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν) points to idol-making; Hermas labels such idolatry as ‘adultery’ in a covenantal sense (cf. Rom 1:23 for ὁμοίωμα with images).
    reason: cross_reference
  - marker: a
    text: Or 'he becomes guilty of her sin. Let the one who has sinned and is repenting be received'.
    reason: previous_rendering
translation:
  language: ko
  text: '“내가 너에게 명령합니다.” 그가 말했습니다. “정결을 지키고, 다른 사람의 아내나 어떤 음행이나 그런 악한 비슷한 것들에 대한 생각이 네 마음 위로 올라오지 못하게 하십시오. 그런 일을 함으로써 너는 큰 죄를 짓게 됩니다. 그러나 자신의 아내를 늘 기억하면 결코 범죄하지 않을 것입니다.


    “그 생각이 네 마음 위로 올라오면 너는 범죄하게 됩니다. 그리고 그 밖의 다른 그런 악한 것들이라면, 너는 죄를 짓게 됩니다. 이 생각은 하나님의 종에게 큰 죄입니다. 누구든지 이 악한 일을 행하면 자기에게 죽음을 불러옵니다. 그러니 너는 자신을 살피십시오. 이 생각에서 멀리하십시오. 절제가 거하는 곳에는 의인의 마음 위로 불법이 올라와서는 안 됩니다.”


    나는 그에게 말했습니다. “주님, 제가 몇 가지를 여쭙도록 허락해 주십시오.” “말하십시오.” 그가 말했습니다. “주님, 어떤 사람이 주 안에서 신실한 아내를 두었는데, 그 여자가 어떤 간음 중에 있는 것을 그가 발견하면, 남편이 그 여자와 함께 살아도 죄를 짓습니까?”


    “그가 모르는 동안에는 죄를 짓지 않습니다. 그러나 남편이 그 여자의 죄를 알게 되었는데도 아내가 회개하지 않고 자기의 음행에 머물러 있고, 남편이 그 여자와 함께 산다면, 그는 그 여자의 죄에 대한 유죄자가 되고 그 여자의 간음에 동참하는 자가 됩니다. 그러므로 주님, 제가 묻습니다. 아내가 이 욕망에 머문다면 남편은 어떻게 해야 합니까?” “그는 그 여자를 이혼하십시오.” 그가 말했습니다. “그리고 남편은 홀로 남아 있어야 합니다. 그러나 아내를 이혼한 뒤에 다른 여자를 맞아들이면, 그도 역시 간음하는 것입니다. 그러면 주님, 아내가 이혼된 뒤에 회개하여 자기 남편에게 돌아가고자 하면, 받아들여지지 않겠습니까?” “참으로 그렇습니다.” 그가 말했습니다. “남편이 그 여자를 받아들이지 않으면 그는 죄를 짓고 자기에게 큰 죄를 불러옵니다. 오히려 죄를 짓고 회개하는 사람은 받아들여져야 합니다 — 그러나 거듭해서는 안 됩니다. 하나님의 종들에게는 회개가 하나이기 때문입니다. 그러므로 회개 때문에 남자는 결혼해서는 안 됩니다. 이 규정은 여자와 남자에게 모두 적용됩니다.


    “또 그는 말했습니다. “누구든지 자기 육체를 더럽히는 것만이 간음이 아닙니다. 민족들이 하는 것처럼 형상들을 만드는 사람도 간음하는 것입니다. 그러므로 그런 일들 가운데서도 누군가가 계속하고 회개하지 않는다면, 그에게서 멀리하십시오. 그와 함께 살지 마십시오. 그렇지 않으면 너도 그의 죄에 동참하는 자가 됩니다. 이 때문에 남자든 여자든 너희는 각각 자기들끼리 머물라고 명령을 받은 것입니다. 이런 경우에는 회개가 있을 수 있기 때문입니다.


    “그러므로 나는 이 행위가 그런 식으로 이루어지도록 빌미를 주는 것이 아니라, 죄를 지은 사람이 더 이상 죄를 짓지 않도록 말하는 것입니다. 그러나 그의 이전 죄에 대해서는 치유를 베풀 수 있는 분이 계십니다. 그분은 모든 것을 다스리는 권위를 가지신 분이기 때문입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐντέλλομαί
  english_pob_choice: I am commanding
  chosen_korean: 내가 너에게 명령합니다
  alternatives_korean:
  - 내가 너에게 명합니다
  - 내가 너에게 지시합니다
  lexicon: BDAG
  rationale: 직접 화법의 강한 명령성을 살리면서 현대 합쇼체에 자연스럽게 옮겼습니다.
- source_word: ἁγνεία
  english_pob_choice: chastity
  chosen_korean: 정결
  alternatives_korean:
  - 순결
  - 정숙
  lexicon: BDAG
  rationale: 성윤리 맥락을 유지하되 한국어에서 과도하게 협소한 뉘앙스를 피하면서도 본문의 도덕적 순결성을 드러냅니다.
- source_word: ἀναβαίνειν ἐπὶ τὴν καρδίαν
  english_pob_choice: rise up upon the heart
  chosen_korean: 마음 위로 올라오다
  alternatives_korean:
  - 마음에 들어오다
  - 마음에 떠오르다
  lexicon: BDAG
  rationale: 그리스어의 상승 은유를 그대로 살려, 단순한 '생각나다'보다 더 강한 침투 이미지를 보존했습니다.
- source_word: γυναικὸς ἀλλοτρίας
  english_pob_choice: another man’s wife
  chosen_korean: 다른 사람의 아내
  alternatives_korean:
  - 남의 아내
  - 다른 이의 아내
  lexicon: BDAG
  rationale: 관용구적 의미를 따라 배우자가 있는 타인의 아내를 분명히 했습니다.
- source_word: ἁμαρτία ἐργάζῃ
  english_pob_choice: commit a great sin
  chosen_korean: 큰 죄를 짓게 됩니다
  alternatives_korean:
  - 큰 죄를 행하게 됩니다
  - 큰 죄를 저지르게 됩니다
  lexicon: BDAG
  rationale: 한국어에서 죄와의 결합은 '짓다'가 자연스러우며, 행위의 중대성을 유지합니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종된 사람
  lexicon: BDAG
  rationale: 이 구절은 하나님께 속한 자의 소속성과 복종을 강조하지만, 한국어 본문 흐름에서는 '종'이 가장 자연스럽고 POB 기본 용례에도 부합합니다.
- source_word: ἔνοχος γίνεται τῆς ἁμαρτίας αὐτῆς
  english_pob_choice: he becomes guilty of her sin
  chosen_korean: 그 여자의 죄에 대한 유죄자가 됩니다
  alternatives_korean:
  - 그 여자의 죄를 함께 짊어지게 됩니다
  - 그 여자의 죄에 책임을 지게 됩니다
  lexicon: BDAG
  rationale: ἔνοχος의 법적 책임감을 살리면서, 한국어에서 명확한 판정 표현으로 옮겼습니다.
- source_word: ἴασιν δοῦναι
  english_pob_choice: to give healing
  chosen_korean: 치유를 베풀 수 있는
  alternatives_korean:
  - 낫게 하실 수 있는
  - 회복을 주실 수 있는
  lexicon: BDAG
  rationale: 본문의 의료적 은유를 보존하기 위해 '치유'를 사용했습니다.
theological_decisions:
- issue: Κύριε의 호칭 처리
  chosen_reading: 인간적 존칭으로 보고 '주님'을 사용했습니다.
  alternative_readings:
  - 주님
  - 주여
  rationale: 이 대목의 화자는 환시 속 인물과 대화하고 있으므로, 신적 칭호로 단정하기보다 존칭을 유지하는 것이 문맥에 맞습니다. 다만 한국어 독자가 자연스럽게 읽도록 '주님'을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: contested title usage in visionary dialogue'
- issue: μετάνοια의 반복 가능성
  chosen_reading: '''거듭해서는 안 됩니다''로 옮겨 회개의 횟수 제한을 드러냈습니다.'
  alternative_readings:
  - 오랫동안이 아닙니다
  - 반복되지 않습니다
  rationale: '''회개가 하나''라는 뒤 문장과 연결될 때, 시간 길이보다 반복 횟수 제한이 핵심이므로 그 의미를 살렸습니다.'
  doctrine_reference: 'DOCTRINE.md: contested terms – μετάνοέω policy'
- issue: 형상 만들기와 간음의 연계
  chosen_reading: '''민족들이 하는 것처럼 형상들을 만드는 사람도 간음하는 것입니다''로 옮겼습니다.'
  alternative_readings:
  - 이방인들처럼 형상을 만드는 사람
  - 우상들을 만드는 사람
  rationale: ὁμοιώματα ποιῇ τοῖς ἔθνεσιν의 우상 제작 함의를 유지하면서도, 본문이 직접 '간음'이라는 언약적 은유를 적용하는 점을 살렸습니다.
  doctrine_reference: Hermas의 언약적 우상숭배-간음 은유
