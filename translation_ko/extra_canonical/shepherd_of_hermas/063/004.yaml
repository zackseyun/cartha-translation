  to: 4. 먼저 마르고 잘린 막대기들을 가진 사람들이 그것들을 내놓았는데, 그것들도 마르고 잘린 것으로 드러났습니다. 그는 그들에게 따로 서 있으라고 명령했습니다.
  rationale: 누락된 ‘막대기들’을 본문에 복원하고, 확인·판정의 의미를 지닌 εὑρέθησαν과 분리하여 서라는 명령을 자연스러운 현대 한국어 합쇼체로 옮겼습니다. 상징적 막대기의 의미나 ‘잘린’ 상태에 대한 해석은 추가하지 않았습니다.
