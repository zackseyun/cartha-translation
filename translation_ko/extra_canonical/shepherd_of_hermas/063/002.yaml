review_pass:
  verdict: revise
  source_fidelity: 핵심 동작과 순서는 대체로 옮겼지만, κατὰ τὸ τάγμα ὡς ἕκαστος ἔδωκε τὰς ῥάβδους는 ‘각자가 막대기를 내놓았던 순서/등급에 따라’라는 뜻입니다. 초안의 ‘각각 받은 대로’는 ἔδωκε(‘주었다, 내놓았다’)를 반대로 옮겼습니다. 또한 ῥάβδοι는 여기서 일관되게 ‘막대기’로 옮기는 것이 안전합니다.
  naturalness: 합쇼체 서술과 직접 인용의 명령형을 정비하고, ‘띠를 띠고’보다 자연스러운 ‘허리에 띠를 두르고’를 사용했습니다. ‘자신들의 대열에 서 있었습니다’는 원문의 완료된 동작보다 상태를 강조하므로 ‘대열을 이루어 섰습니다’로 다듬었습니다.
  terminology: ποιμήν은 직전 문맥의 ‘목자’를 가리키지만, 이 절에서는 대명사로 충분하므로 ‘그분’으로 유지했습니다. ῥάβδοι는 영어 감사 번역의 rods 및 이어지는 문맥의 심어진 물건을 반영하여 ‘막대기’로 통일했습니다.
  issues:
  - severity: high
    issue: ‘각각 받은 대로’
    rationale: 원문 ὡς ἕκαστος ἔδωκε τὰς ῥάβδους는 각 사람이 막대기들을 ‘주었던/내놓았던’ 방식 또는 순서에 따른다는 뜻이며, ‘받은’ 것은 의미를 역전합니다.
  - severity: medium
    issue: ‘가지를 심은 사람들’
    rationale: 원문은 ‘심겨 있는 막대기들의 주인인 사람들’(τοὺς ἄνδρας ὧν εἰσὶν αἱ ῥάβδοι πεφυτευμέναι)을 말합니다. 초안은 사람들이 가지를 심었다는 행위로 읽히며 소유 관계와 막대기라는 표현이 흐려집니다.
  - severity: low
    issue: 인용문 명령형 ‘부르라’
    rationale: 지정된 현대 합쇼체에 맞추어 ‘부르십시오’로 고쳤습니다.
