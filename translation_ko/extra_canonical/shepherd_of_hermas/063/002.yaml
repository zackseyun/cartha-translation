  text: 2. 그분께서는 내가 띠를 띠고 그를 섬길 준비를 하는 것을 보시고 말씀하셨습니다. "가지를 심은 사람들을 각각 받은 대로 차례대로 부르라." 그리고 나는 들판에 나가서 그들을 모두 불렀습니다. 그리고 그들은 모두 자신들의 대열에 서 있었습니다.
