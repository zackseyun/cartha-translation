revisions:
- from: 2. 그분께서는 내가 띠를 띠고 그를 섬길 준비를 하는 것을 보시고 말씀하셨습니다. "가지를 심은 사람들을 각각 받은 대로 차례대로 부르라." 그리고 나는 들판에 나가서 그들을 모두 불렀습니다. 그리고 그들은 모두 자신들의 대열에 서 있었습니다.
  to: 2. 그분께서는 내가 허리에 띠를 두르고 그분을 섬길 준비가 된 것을 보시고 말씀하셨습니다. “심겨 있는 막대기들의 주인인 사람들을, 각자가 막대기를 내놓았던 순서에 따라 부르십시오.” 그래서 나는 들판으로 나가 그들을 모두 불렀습니다. 그러자 그들은 모두 자기들의 대열을 이루어 섰습니다.
  rationale: ‘받다’를 원문의 ‘내놓다/주다’로 바로잡고, 심겨 있는 막대기의 소유자라는 관계를 명시했습니다. 명령문과 서술을 현대 표준 한국어 합쇼체로 정비하되, ‘순서/등급’으로도 이해될 수 있는 τάγμα의 구체적 제도적 의미는 확정하지 않고 ‘대열’과 ‘순서’로 문맥상 자연스럽게 보존했습니다.
