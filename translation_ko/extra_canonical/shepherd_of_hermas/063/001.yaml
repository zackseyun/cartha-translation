  terminology: ποιμήν은 문맥상 칭호로서 ‘목자’로 유지했습니다. ὠμόλινον은 ‘생마포 옷’으로, σάκκος는 ‘굵은 베’로 옮겨 두 표현의 구별을 보존했습니다.
