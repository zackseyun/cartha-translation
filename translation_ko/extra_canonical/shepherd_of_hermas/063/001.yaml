revisions:
- from: 며칠 후에 우리가 그곳에 이르니 목자는 천사의 자리에 앉았고 나는 그 곁에 섰느니라. 그리고 그는 나에게 “생마포 옷을 입고 나를 섬기라”고 말했습니다. 그래서 나는 굵은 베로 만든 깨끗한 아마포 옷을 입었습니다.
  to: 며칠 뒤에 우리는 그곳에 이르렀습니다. 목자는 천사의 자리에 앉으셨고, 나는 그 곁에 섰습니다. 목자가 나에게 말씀하셨습니다. “생마포 옷을 두르고 나를 섬기십시오.” 그래서 나는 굵은 베로 만든 깨끗한 생마포 옷을 둘렀습니다.
  rationale: 현대 합쇼체로 문체를 통일하고, 원문의 ὠμόλινον과 σάκκος를 각각 ‘생마포’와 ‘굵은 베’로 보존했습니다. περιζώννυμι의 ‘허리에 두르다’라는 동작도 ‘입다’보다 직접적인 ‘두르다’로 옮겼습니다.
