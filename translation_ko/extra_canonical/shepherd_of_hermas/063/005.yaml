  text: 5. 이어서 마르기는 했지만 잘리지는 않은 막대기를 가진 사람들이 그것들을 내놓았습니다. 그런데 그들 가운데 어떤 이들은 자기 막대기를 푸릇푸릇한 채로 내놓았고, 어떤 이들은 좀먹은 것처럼 마르고 잘린 채로 내놓았습니다. 그래서 그는 푸릇푸릇한 막대기를 내놓은 사람들에게는 따로 서 있으라고 명령하셨고, 마른 막대기를 내놓은 사람들에게는—
