base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021.yaml
  text: 'But in the third vision you saw her younger[a], beautiful, and cheerful, and her appearance was beautiful.


    For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and accepts nothing else except the message that he heard, and from then on he is strengthened for the good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.


    And because you saw her sitting on a stool, the position is firm; because the bench has four feet and stands firmly. For indeed the world is held together by four elements.


    Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed[e][d][c][b], it will be revealed to you.'
  footnotes:
  - marker: a
    text: The phrase 'good message' translates ἀγγελία ἀγαθή, which can also mean 'good news' or 'good tidings.'
    reason: lexical_alternative
  - marker: b
    text: '''Stool'' renders συμψέλιον, a small four-legged seat; ''bench'' is another possibility.'
    reason: lexical_alternative
  - marker: c
    text: '''Four elements'' reflects ancient cosmology (earth, water, air, fire), used here to symbolize firmness and order.'
    reason: cultural_note
  - marker: d
    text: '''Will be new'' translates νέοι ἔσονται; it could also be read ''will be young.'' ''New'' aligns with the renewal imagery in this context.'
    reason: lexical_alternative
  - marker: e
    text: '''You have the revelation in full'' reflects the idiomatic sense of ἀπέχεις as ''to have in full'' (commercial idiom), not ''to be far from.'''
    reason: cultural_note
translation:
  language: ko
  text: '그러나 셋째 환상에서 당신은 그녀가 더 젊고, 아름답고, 즐거운 모습을 보았습니다. 또 그녀의 모양도 아름다웠습니다.


    마치 어떤 슬퍼하는 사람에게 좋은 소식이 하나 오면, 그는 곧 전에 있던 슬픔을 잊고, 들은 그 소식 외에는 아무것도 받아들이지 않으며, 그 뒤로는 선한 것에 힘을 얻고, 받은 기쁨 때문에 그의 영이 새로워지는 것과 같습니다. 이처럼 당신도 이 좋은 것들을 보고 당신의 영들의 새롭게 됨을 받았습니다.


    그리고 당신이 그녀가 의자에 앉아 있는 것을 보았기 때문에, 그 자리는 견고합니다. 그 의자는 네 다리를 가졌고 굳게 서 있기 때문입니다. 또한 세상은 네 요소로 붙들려 있기 때문입니다.


    그러므로 온전히 회개한 사람들은 새 사람이 되어 견고하게 세워질 것이니, 곧 마음을 다해 회개한 사람들입니다. 당신은 계시를 온전히 받았습니다. 이제 계시에 대해 더 이상 아무것도 묻지 마십시오. 그러나 필요한 것이 있으면, 그것이 당신에게 드러날 것입니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεωτέραν
  english_pob_choice: younger
  chosen_korean: 더 젊고
  alternatives_korean:
  - 더 새로운
  - 젊은
  lexicon: LSJ
  rationale: 비교급 νέος의 기본 뜻을 살리되, 문맥상 외형의 변화가 강조되므로 ‘더 젊고’로 옮겼습니다.
- source_word: ἱλαράν
  english_pob_choice: cheerful
  chosen_korean: 즐거운
  alternatives_korean:
  - 명랑한
  - 기쁜
  - 환한
  lexicon: LSJ
  rationale: 얼굴빛이나 태도의 밝음을 나타내므로, 한국어에서는 자연스럽고 공손한 ‘즐거운’이 적절합니다.
- source_word: ἀγγελία ἀγαθή
  english_pob_choice: good message
  chosen_korean: 좋은 소식
  alternatives_korean:
  - 좋은 메시지
  - 복된 소식
  lexicon: LSJ
  rationale: POB 주석이 지적하듯 ‘좋은 소식/기쁜 소식’까지 가능한데, 문맥상 전달된 소식을 자연스럽게 살리는 표현으로 옮겼습니다.
- source_word: προσδέχεται
  english_pob_choice: accepts
  chosen_korean: 받아들이지
  alternatives_korean:
  - 기다리지
  - 환영하지
  lexicon: BDAG
  rationale: 들어온 소식 외에는 다른 것을 받아들이지 않는다는 뜻이므로, ‘받아들이지’가 의미를 가장 सीधे하게 드러냅니다.
- source_word: συμψέλιον
  english_pob_choice: stool
  chosen_korean: 의자
  alternatives_korean:
  - 발판
  - 벤치
  - 작은 의자
  lexicon: LSJ
  rationale: 원문 주석의 핵심은 네 다리가 있는 작은 좌석이라는 점이므로, 한국어에서는 문맥상 이해가 쉬운 ‘의자’로 옮기되 설명절을 통해 ‘네 다리’를 살렸습니다.
- source_word: στοιχείων
  english_pob_choice: elements
  chosen_korean: 네 요소
  alternatives_korean:
  - 원소
  - 기초 요소
  - 네 원소
  lexicon: BDAG
  rationale: 고대 우주론의 네 요소(땅, 물, 공기, 불)를 가리키는 표현이므로, 오해를 줄이기 위해 ‘네 요소’로 옮겼습니다.
- source_word: ἀπέχεις
  english_pob_choice: you have the revelation in full
  chosen_korean: 계시를 온전히 받았습니다
  alternatives_korean:
  - 계시를 충만히 갖고 있습니다
  - 계시를 전부 받았습니다
  lexicon: BDAG
  rationale: 상업적 관용구의 의미를 직역하기보다, 문맥상 ‘이 계시를 완전히 받았다’는 종결감을 살리는 한국어로 풀었습니다.
- source_word: ὁλοτελῆ
  english_pob_choice: complete
  chosen_korean: 온전히
  alternatives_korean:
  - 완전히
  - 전부의
  lexicon: LSJ
  rationale: 계시의 완전성을 나타내는 형용사를 한국어 부사로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: μετανοέω의 한국어 표기
  chosen_reading: ‘회개하다’로 옮겨 도덕적·영적 전환의 요구를 분명히 했습니다.
  alternative_readings:
  - 돌이키다
  - 마음을 바꾸다
  rationale: 문맥이 단순한 인지 변화가 아니라 전인적 회심과 갱신을 말하므로, 합쇼체 한국어 성경 관용에 맞는 ‘회개하다’가 적절합니다.
  doctrine_reference: DOCTRINE.md — μετανοέω policy
- issue: ‘영들의 새롭게 됨’의 복수형 보존
  chosen_reading: ‘당신의 영들의 새롭게 됨’으로 복수형을 유지했습니다.
  alternative_readings:
  - 당신의 영의 새롭게 됨
  - 당신의 내면의 새로움
  rationale: 그리스어 복수형을 지워 한 사람의 단수 내면으로 평준화하지 않고, 본문의 독특한 표현을 그대로 드러냈습니다.
  doctrine_reference: Hermas style preservation
