base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/048.yaml
  text: 'For to this end the Master has made you rich[1], that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the slaves of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the slaves of God, for the poor and the rich.


    ‘How so, sir?’ I say. ‘Make it known to me.’ ‘Listen,’ he says: ‘The rich man has much money, but toward the Lord he is poor, being distracted about his wealth, and he has very little confession and intercession toward the Lord; and what he has is small and feeble, and has no power to go up above. When, therefore, the rich man goes to the needy and supplies him with what is necessary, believing that what he does for the needy he will be able to find as his wage from God—for the needy is rich in intercession [and in confession], and his intercession has great power with God—the rich man supplies the needy with everything without doubting. And the needy, being supplied by the rich, intercedes for him, giving thanks to God on behalf of the one who gives to him. And that one is still more eager concerning the needy, so that he may be unceasing in his life; for he knows that the intercession of the needy is acceptable and abundant with God. Therefore both complete the work: the needy performs
    the intercession in which he is rich, [which he received from the Lord;] this he renders to the Lord for the one who supplies him. And likewise the rich man without doubting provides to the needy the wealth which he received from the Lord. And this is a great work and acceptable with God, because he understood concerning his wealth and worked for the needy out of the gifts of the Lord and fulfilled the Lord’s ministry rightly. Therefore, among people the elm seems not to bear fruit; and they do not know nor understand that[2], if there should be a drought, the elm, having water, nourishes the vine, and the vine, having unceasing water, gives double fruit, both for itself and for the elm. In the same way also the needy[b][a][14][13][12][11][10][9][8][7][6][5][4][3], interceding with the Lord on behalf of the rich...'
  footnotes:
  - marker: '1'
    text: '"and estates" (καὶ κτήματα) appears bracketed in the Greek; some witnesses include it, others omit it.'
    reason: textual_variant
  - marker: '2'
    text: ἐπιδημήσῃς can mean "be present as a resident/visitor"; here, the thought is of arriving again at one’s own city, an eschatological image in Hermas.
    reason: lexical_alternative
  - marker: '3'
    text: Hermas pointedly redefines "luxury" as joyful, fear-free generosity that stores up for life in the coming city.
    reason: cultural_note
  - marker: '4'
    text: The Greek δοῦλοι τοῦ Θεοῦ is rendered "slaves of God" to preserve the ownership-and-obedience nuance; "servants" is a smoother but less exact alternative.
    reason: lexical_alternative
  - marker: '5'
    text: '"and in confession" (καὶ τῇ ἐξομολογήσει) is bracketed; the phrase may be a scribal addition or gloss.'
    reason: textual_variant
  - marker: '6'
    text: ἔντευξις is a specific term for petitionary approach/intercession; alternatives are "petition" or general "prayer."
    reason: lexical_alternative
  - marker: '7'
    text: The clause likely means the needy person is sustained continually by the rich man’s care. Some take it of the rich man’s own constancy in doing good.
    reason: alternative_reading
  - marker: '8'
    text: '"Abundant with God" could also be translated "rich toward God," preserving the idiom πλουσία πρὸς τὸν Θεόν.'
    reason: lexical_alternative
  - marker: '9'
    text: '"Ministry" (διακονία) here is not a formal office but the service assigned by the Master, fulfilled in almsgiving.'
    reason: cultural_note
  - marker: '10'
    text: 'The elm-and-vine image explains the mutual benefit: the elm stores/nourishes with water; the vine yields fruit for both itself and the elm.'
    reason: cultural_note
  - marker: '11'
    text: The Greek here is difficult; the subject of "thrown to the ground it is rotten and bears little" is not explicit in the preserved text, but likely contrasts transient worldly luxury with enduring Christian "luxury."
    reason: alternative_reading
  - marker: '12'
    text: '"which he received from the Lord" is bracketed in the Greek and may reflect a textual variant.'
    reason: textual_variant
  - marker: '13'
    text: μισθός is rendered "wage" to retain the remuneration metaphor; "reward" is an alternative.
    reason: lexical_alternative
  - marker: '14'
    text: '"the nations" translates ἔθνη; "Gentiles" is an alternative. Hermas contrasts pagan luxury with Christian use of wealth.'
    reason: lexical_alternative
  - marker: a
    text: Or 'in which you are able to give; but when it is thrown to the ground it bears rotten and little fruit.'.
    reason: previous_rendering
  - marker: b
    text: Or 'unhesitatingly provides to the needy'.
    reason: previous_rendering
translation:
  language: ko
  text: '이 목적 때문에 주인은 여러분을 부유하게 하셨으니, 여러분이 그분을 위해 이런 섬김을 수행하게 하려는 것입니다. 그런 밭들 [과 영지들]과 집들을 사는 것이 훨씬 더 낫습니다. 여러분이 그 도시에 들어갈 때, 그 안에서 그런 것들을 찾게 될 것입니다. 이 사치는 좋고 즐겁습니다. 슬픔도 두려움도 없고, 오직 기쁨만 있습니다. 그러므로 이방 민족들의 사치를 행하지 마십시오. 그것은 하나님의 종들인 여러분에게 유익하지 않습니다. 오히려 여러분 자신의 사치를 행하십시오. 그 안에서는 여러분이 기뻐할 수 있습니다. 이런 종류의 모든 사치는 유익합니다. 그러나 이방 민족들의 사치는 쓰고 거칩니다. 이 비유는 이제 하나님의 종들, 곧 가난한 사람과 부유한 사람을 위해 제시된 것입니다.


    “어찌 그렇습니까, 주인님?” 내가 말했습니다. “저에게 알려 주십시오.” 그가 말했습니다. “들으십시오. 부유한 사람은 돈이 많지만, 주님을 향해서는 가난합니다. 그는 자기 재산에 정신이 빼앗겨 있고, 주님을 향한 고백과 간구도 매우 적습니다. 그리고 그가 가진 것도 작고 연약하여 위로 올라갈 힘이 없습니다. 그러므로 부유한 사람이 가난한 사람에게 가서 필요한 것을 공급할 때, 그가 가난한 사람을 위해 하는 일이 하나님께서 주시는 삯으로 자기가 받을 수 있을 것이라고 믿습니다. 왜냐하면 가난한 사람은 간구 [와 고백]에 부유하고, 그의 간구는 하나님께 큰 힘이 있기 때문입니다. 그래서 부유한 사람은 주저하지 않고 가난한 사람에게 모든 것을 공급합니다. 그리고 공급받은 가난한 사람은 그를 위해 간구하며, 자신에게 주는 이를 대신하여 하나님께 감사드립니다. 그러면 그 사람은 가난한 사람을 더욱 힘써 돌보게 되어, 그의 삶이 끊이지 않게 하려 합니다. 그는 가난한 사람의 간구가 하나님께서 받으실 만하며, 하나님 앞에서 풍성하다는 것을 알기 때문입니다. 그러므로 두 사람은 모두 일을 완수합니다. 가난한 사람은 자신이 부유한 그 간구를 행합니다. [그가 주님께로부터 받은 것인데,] 이것을 자신을 공급하는 이를 위해 주님께 돌려 드립니다. 그리고 부유한 사람도 마찬가지로, 주님께로부터 받은 그 재산을 주저하지 않고 가난한 사람에게 제공합니다. 이것은 하나님께서 받으시는 위대한 일입니다. 왜냐하면 그가 자기 재산에 대해 깨달았고, 주님의 선물들로 가난한 사람을 위해 일했으며, 주님의 섬김을 올바르게 완수했기 때문입니다. 그러므로 사람들 가운데서는 느릅나무가 열매를 맺지 않는 것처럼 보입니다. 그러나 그들은, 가뭄이 들면 물을 가진 느릅나무가 포도나무를 먹이고, 포도나무는 끊임없는 물을 받아 자기 자신을 위해서도, 느릅나무를 위해서도 두 배의 열매를 맺는다는 것을 알지 못하고 깨닫지도 못합니다. 이와 같이 가난한 사람도 주님께 간구하여 부유한 사람을 위하여…[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주님
  - 주인님
  - 소유주
  lexicon: LSJ / Lampe
  rationale: 가장자리의 지배·소유 뉘앙스를 살리되, 문맥상 비유적 지시자인 하나님을 자연스럽게 가리키도록 '주인'을 기본으로 두었습니다.
- source_word: διακονίας
  english_pob_choice: ministries
  chosen_korean: 섬김
  alternatives_korean:
  - 사역
  - 봉사
  - 섬김들
  lexicon: BDAG / Lampe
  rationale: 공식 직분보다 맡겨진 실천적 봉사를 가리키므로, 문맥에 맞게 '섬김'으로 옮겼습니다.
- source_word: πολυτέλεια
  english_pob_choice: luxury
  chosen_korean: 사치
  alternatives_korean:
  - 호화
  - 사치스러움
  - 풍성함
  lexicon: LSJ
  rationale: Hermas가 이 단어를 역설적으로 재정의하므로, 윤리적 긴장이 드러나는 '사치'를 유지했습니다.
- source_word: μισθός
  english_pob_choice: wage
  chosen_korean: 삯
  alternatives_korean:
  - 보상
  - 상급
  - 품삯
  lexicon: BDAG / LSJ
  rationale: 경제적 보수의 은유를 살리기 위해 '삯'을 택했습니다. '보상'보다 덜 추상적입니다.
- source_word: ἀδιστάκτως
  english_pob_choice: without doubting
  chosen_korean: 주저하지 않고
  alternatives_korean:
  - 의심하지 않고
  - 망설이지 않고
  - 흔들림 없이
  lexicon: LSJ / Lampe
  rationale: 본문의 반복 어휘가 내포하는 이중심·의심의 반대를 살리면서, 한국어로는 행동 양상을 자연스럽게 드러냈습니다.
- source_word: πλουσία πρὸς τὸν Θεόν
  english_pob_choice: abundant with God
  chosen_korean: 하나님 앞에서 풍성하다
  alternatives_korean:
  - 하나님께 풍성하다
  - 하나님과 함께 풍부하다
  - 하나님께 부유하다
  lexicon: Lampe
  rationale: 문맥상 간구의 효력과 수량적 풍성함을 함께 담아, 어색한 직역 대신 관계적·서술적 표현을 사용했습니다.
- source_word: δοῦλοι τοῦ Θεοῦ
  english_pob_choice: slaves of God
  chosen_korean: 하나님의 종들
  alternatives_korean:
  - 하나님의 노예들
  - 하나님의 종
  - 하나님께 속한 노예들
  lexicon: BDAG
  rationale: 프로젝트 기본값은 '종'이지만, 한국어 출판 가독성과 비유의 수용성을 고려해 과도한 충격을 피하는 쪽을 택했습니다.
- source_word: ἔντευξις
  english_pob_choice: intercession
  chosen_korean: 간구
  alternatives_korean:
  - 중보
  - 청원
  - 중재 기도
  lexicon: BDAG / Lampe
  rationale: 하나님께 드리는 청원의 기능을 살리되, 한국어에서 더 자연스러운 기도 용어인 '간구'를 사용했습니다.
- source_word: ἐξομολόγησις
  english_pob_choice: confession
  chosen_korean: 고백
  alternatives_korean:
  - 자백
  - 회개 고백
  - 감사 고백
  lexicon: BDAG / Lampe
  rationale: Hermas의 참회적 문맥을 반영하면서도 한국어에서 넓게 쓰이는 '고백'을 유지했습니다.
theological_decisions:
- issue: δοῦλοι τοῦ Θεοῦ의 한국어 정착
  chosen_reading: 본문에는 '하나님의 종들'을 사용했습니다.
  alternative_readings:
  - 하나님의 노예들
  - 하나님의 종
  rationale: 원어의 소유·귀속 뉘앙스는 유지하되, 이 외경 본문의 수용성과 문장 흐름을 고려했습니다. 다만 주석적 번역에서는 더 강한 '노예'도 가능하므로, 번역 일관성은 별도 문서에서 재검토할 수 있습니다.
  doctrine_reference: 'Cartha Translation Philosophy: contested terms — δοῦλος'
- issue: ἔντευξις/ἐξομολόγησις의 기도적 성격
  chosen_reading: '''간구''와 ''고백''으로 옮겨, 가난한 사람의 기도적 풍성함을 드러냈습니다.'
  alternative_readings:
  - 중보/자백
  - 청원/감사
  rationale: 문맥은 단순한 일반기도가 아니라, 부유한 사람을 위한 매개적 기도와 참회적 고백을 함께 보여 줍니다. 한국어로는 '간구'가 기능을 가장 자연스럽게 드러냅니다.
  doctrine_reference: Hermas penitential/parabolic context
