lexical_decisions:
- source_word: Μετὰ ἡμέρας ὀλίγας / εἰς τὸ πεδίον
  english_pob_choice: After a few days / in the same field
  chosen_korean: 며칠 뒤 / 그곳, 곧 … 바로 그 들판
  alternatives_korean:
  - 며칠 후 / 같은 들판
  - 며칠 뒤 / 그 평지
  lexicon: LSJ / BDAG
  rationale: πεδίον은 단순한 ‘들판’이 기본값이며, 앞선 장면과의 동일 장소성을 살려 ‘바로 그 들판’으로 옮겼습니다.
- source_word: κύριε
  english_pob_choice: sir
  chosen_korean: 주인님
  alternatives_korean:
  - 주님
  - 선생님
  lexicon: BDAG
  rationale: 이 장면에서 κύριε는 신적 호칭이 아니라 존칭이므로, 대화 상대에 대한 공손한 호칭으로 ‘주인님’을 택했습니다.
- source_word: ποιμένα τὸν τιμωρητὴν
  english_pob_choice: the shepherd, the punisher
  chosen_korean: 목자, 곧 형벌을 내리는 자
  alternatives_korean:
  - 목자, 곧 형벌자
  - 목자, 곧 징벌하는 자
  lexicon: LSJ
  rationale: τιμωρητής는 단순한 ‘징계자’보다 실제로 형벌을 집행하는 자를 가리키므로, 역할을 분명히 하는 표현으로 옮겼습니다.
- source_word: θλίβει / θλιβῆναι / θλῖψις
  english_pob_choice: afflicts / be afflicted / affliction
  chosen_korean: 괴롭히고 있다 / 괴로움을 당해야 한다 / 괴로움
  alternatives_korean:
  - 압박하고 있다 / 압박을 받아야 한다 / 압박
  - 환난을 주고 있다 / 환난을 받아야 한다 / 환난
  lexicon: BDAG
  rationale: 이 문맥에서는 압박보다 실제 고통과 시련의 뉘앙스가 강하므로, 일관되게 ‘괴로움/괴로움을 당하다’로 옮겼습니다.
theological_decisions:
- issue: ἔνδοξος ἄγγελος와 τιμωρητής의 천사-징벌 장면
  chosen_reading: ‘영광스러운 천사’와 ‘형벌의 천사’라는 본래의 구분을 유지했습니다.
  alternative_readings:
  - ‘영광된 천사’와 ‘징벌천사’로 통합
  - 보다 완곡하게 ‘권위 있는 천사’로 처리
  rationale: 본문은 동일 인물/기능의 층위를 구분하며, 회개의 목적과 징벌의 집행을 함께 보여 줍니다. 이를 평준화하면 서술의 긴장이 약해집니다.
  doctrine_reference: DOCTRINE.md — 천사론 및 징계의 매개성
- issue: εὐσταθοῦντος δὲ σοῦ
  chosen_reading: ‘네가 굳건하면’으로 옮겨, 조건적 대비를 드러냈습니다.
  alternative_readings:
  - ‘네가 서 있으면’
  - ‘네가 안정되어 있으면’
  rationale: 문법적으로는 분사구문이지만, 한국어에서는 조건적 의미가 자연스러워 ‘굳건하면’이 본문의 논리를 가장 분명하게 전달합니다.
  doctrine_reference: DOCTRINE.md — 분사구문과 조건 표현
