translation:
  language: ko
  text: '비유 7


    1[7]. 며칠 뒤 나는 그를 그곳, 곧 내가 또한 목자들을 보았던 바로 그 들판에서 보았습니다. 그리고 그는 나에게 말했습니다. 「무엇을 찾고 있느냐?」 「주인님, 저는 여기 있습니다」라고 내가 말했습니다. 「당신이 목자, 곧 형벌을 내리는 자에게 제 집을 떠나라고 명령하셔서, 그가 저를 너무나 괴롭히고 있기 때문입니다.」 그는 말했습니다. 「너는 반드시 괴로움을 당해야 한다. 그리하심은 영광스러운 천사가 너에 관하여 그렇게 명령했기 때문이다. 그가 너를 시험받게 하기를 원하기 때문이다.」 「주인님, 제가 무슨 그렇게 악한 일을 했기에 이 천사에게 넘겨져야 합니까?」


    2. 그는 말했습니다. 「들으라. 너의 죄는 많지만, 네가 이 천사에게 넘겨질 정도로 많지는 않다. 오히려 네 집안은 큰 불법 행위들과 죄들을 저질렀고, 영광스러운 천사는 그들의 행위 때문에 격분하였다. 그래서 그가 너를 일정한 시간 동안 괴로움을 당하게 하라고 명령한 것은, 그들도 회개하고 이 시대의 모든 욕망에서 자신을 깨끗하게 하게 하려는 것이다. 그러므로 그들이 회개하고 깨끗해지면, 형벌의 천사는 물러날 것이다.」


    3. 내가 그에게 말했습니다. 「주인님, 만일 그들이 영광스러운 천사를 격분시킬 만큼 그런 일을 했다면, 저는 무슨 일을 했습니까?」 그는 말했습니다. 「그렇지 않으면, 너, 곧 온 집안의 머리인 네가 괴로움을 당하지 않는 한 그들은 괴로움을 당할 수 없다. 네가 괴로움을 당하면 그들도 필연적으로 괴로움을 당하겠지만, 네가 굳건하면 그들은 아무 괴로움도 가질 수 없다.」


    4. 「그런데 보십시오, 주인님. 그들이 마음을 다하여 회개했습니다.」 그가 말했습니다. 「나도 그들이 회개했다는 것을 알고 있다—」[a][b]'
