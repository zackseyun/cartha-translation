  text: 그러므로 온전히 회개한 이들, 곧 온 마음으로 회개한 이들은 완전히 새로워지고 굳게 기초가 세워질 것입니다. 그대는 계시를 온전히 받았습니다. 이제 더 이상 계시에 관하여 아무것도 묻지 마십시오. 그러나 무엇인가 필요하면 그것이 그대에게 계시될 것입니다.
