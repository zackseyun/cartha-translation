  naturalness: 문장 종결이 ‘아니하느니라/되었느니라’로 되어 있어 요구된 현대 합쇼체와 맞지 않습니다. 현대적인 합쇼체로 자연스럽게 다듬는 것이 필요합니다.
  terminology: ἀγγελία는 이 문맥에서 ‘좋은 소식’이 적절하며, πνεῦμα는 특정 교리 용어로 한정하지 않고 ‘마음’으로 옮겨 자연스럽게 처리할 수 있습니다.
