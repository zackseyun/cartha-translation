revisions:
- from: 근심하는 사람에게 좋은 말씀이 오면 즉시 그 근심을 잊어버리고 들은 말씀 외에는 아무 것도 받아들이지 아니하느니라 그 후로 선한 일에 힘을 얻고 기쁨을 얻음으로 그 심령이 새롭게 됨과 같이 너희도 이 좋은 일을 봄으로 심령이 새롭게 되었느니라.
  to: 좋은 소식이 근심하는 사람에게 이르면, 그는 곧 이전의 슬픔들을 잊고 자기가 들은 그 소식 외에는 아무것도 받아들이지 않습니다. 그 뒤로 그는 선한 일을 하도록 힘을 얻고, 받은 기쁨 때문에 그의 마음이 새로워집니다. 이와 같이 여러분도 이 좋은 것들을 보고 여러분의 마음이 새로워졌습니다.
  rationale: ἀγγελία를 일관되게 ‘소식’으로 번역하여 원문의 일반적 의미를 보존하고, ‘이전의 슬픔들’과 ‘여러분의 마음’으로 복수 표현을 반영했습니다. εἰς τὸ ἀγαθόν은 문맥상 ‘선한 일을 하도록’으로 자연스럽게 옮겼으며, 전체를 현대 합쇼체로 수정했습니다.
