base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028.yaml
  text: 'Again he says to me: “Love truth[a], and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.


    Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.


    So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’


    He says, ‘You are thinking rightly and truly; for it was necessary for you, as a slave of God, to walk in truth, and not to let an evil conscience dwell with the spirit of truth[b], nor to bring grief upon the holy and true Spirit.’ ‘Never,’ I say, ‘sir, have I heard such words clearly.’


    ‘Now then,’ he says, ‘you are hearing; keep them, so that even the former lies that you spoke in your dealings, if these are found true, those also may become credible; for those too can become credible. If you keep these and from now on speak all truth, you will be able to gain life for yourself[g][f][e][d][c]. And whoever hears this command and abstains from the most evil lie will live to God.’'
  footnotes:
  - marker: a
    text: ‘Defrauders’ translates ἀποστερηταί, active ‘those who deprive/defraud.’ Some take it as ‘bereft of the Lord,’ but the deposit image favors the active sense.
    reason: lexical_alternative
  - marker: b
    text: ‘Deposit’ (παρακαταθήκη) is a technical term for something entrusted for safekeeping; compare 1 Timothy 6:20; 2 Timothy 1:12, 14.
    reason: cross_reference
  - marker: c
    text: ‘Venerable’ renders σεμνός; alternatives include ‘august’ or ‘noble.’ The word is not the usual term for ‘holy’ (ἅγιος).
    reason: lexical_alternative
  - marker: d
    text: ‘When these are found true’ (τούτων εὑρεθέντων ἀληθινῶν) may refer either to the words now spoken truly (preferred) or to the former utterances themselves.
    reason: alternative_reading
  - marker: e
    text: ‘Sir’ translates κύριε in direct address to the messenger, to distinguish from ‘the Lord’ (Κύριος) used of God/the Lord in the same unit.
    reason: cultural_note
  - marker: f
    text: ‘Will live to God’ renders the Greek dative; ‘will live for God’ is a smoother alternative.
    reason: lexical_alternative
  - marker: g
    text: Or 'by all people'.
    reason: previous_rendering
translation:
  language: ko
  text: '그분이 다시 내게 말씀하셨습니다. 「진리를 사랑하십시오. 그리고 모든 진리가 당신의 입에서 나가게 하십시오. 그러면 하나님께서 이 육체 안에 거하게 하신 영이 모든 사람 앞에서 참된 것으로 드러날 것이고, 그렇게 되어 당신 안에 거하시는 주님께서 영광을 받으실 것입니다. 왜냐하면 주님은 모든 말씀에서 참되시고, 그분께는 아무런 거짓도 없기 때문입니다.


    그러므로 거짓말하는 자들은 주님을 버리는 것이며, 주님께 받은 맡겨진 것을 돌려주지 않는 주님의 사기꾼이 됩니다. 그들은 그분께서 받게 하신 거짓 없는 영을 받았습니다. 그런데 그것을 거짓되게 돌려드리면, 주님의 계명을 더럽힌 것이 되고 사기꾼이 됩니다.


    이 말씀들을 듣고 저는 크게 울었습니다. 그런데 제가 우는 것을 보시고 그분이 말씀하셨습니다. ‘왜 우느냐?’ ‘주님, 제가 구원을 받을 수 있을지 모르겠습니다.’ ‘왜냐?’고 그분이 물으셨습니다. ‘주님, 저는 아직 제 생애에 참된 말을 한 번도 해 본 적이 없고, 늘 모든 사람과 함께 속이며 살았습니다. 그리고 제 거짓을 모든 사람 앞에서 참된 것처럼 드러냈습니다. 누구도 저에게 반박하지 않았고, 제 말은 믿어졌습니다. 그러니 제가 이런 일을 하고도 어떻게 살 수 있겠습니까?’


    그분이 말씀하셨습니다. ‘그대는 옳고 참되게 생각하고 있습니다. 하나님의 종인 그대는 진리 안에서 걸어야 했고, 악한 양심이 진리의 영과 함께 거하지 못하게 해야 했으며, 거룩하고 참된 영께 슬픔을 끼쳐 드려서도 안 되었습니다.’ ‘주님, 저는 그런 말씀을 지금까지는 분명히 들어 본 적이 없습니다.’


    ‘그러므로 이제 듣고 있는 것입니다.’ 그분이 말씀하셨습니다. ‘그것들을 지키십시오. 그러면 이전에 당신이 거래 가운데 말한 거짓말들도, 이것들이 참된 것으로 드러나면, 그것들도 신뢰받는 것이 될 수 있습니다. 왜냐하면 그것들도 신뢰받는 것이 될 수 있기 때문입니다. 당신이 이것들을 지키고 이제부터는 모든 진리를 말하면, 스스로 생명을 얻을 수 있습니다. 또한 이 계명을 듣고 가장 악한 거짓말을 멀리하는 사람은 하나님을 향해 살 것입니다.’[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλήθειαν ἀγάπα / πᾶσα ἀλήθεια
  english_pob_choice: love truth / all truth
  chosen_korean: 진리를 사랑하십시오 / 모든 진리
  alternatives_korean:
  - 참을 사랑하십시오
  - 진실을 사랑하십시오
  lexicon: BDAG
  rationale: ἀλήθεια의 반복을 한국어에서도 일관되게 ‘진리’로 살려, 단순한 사실성보다 윤리적 진실성을 강조하는 본문의 힘을 유지했습니다.
- source_word: ἐκπορευέσθω
  english_pob_choice: go forth
  chosen_korean: 나가게 하십시오
  alternatives_korean:
  - 흘러나가게 하십시오
  - 나오게 하십시오
  lexicon: BDAG
  rationale: 입에서 말이 ‘나가다’는 이미지를 자연스러운 현대 한국어로 옮기되, 발화의 역동성을 유지했습니다.
- source_word: κατῴκισεν
  english_pob_choice: has caused to dwell
  chosen_korean: 거하게 하신
  alternatives_korean:
  - 머물게 하신
  - 살게 하신
  lexicon: LSJ
  rationale: κατοικίζω의 사역적 뉘앙스를 살리면서도 한국어에서 과도하게 설명적이지 않은 표현을 택했습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 종된 사람
  lexicon: BDAG
  rationale: 이 문맥에서는 하나님의 소속성과 의무를 드러내는 기본어로서 ‘종’이 가장 직접적이며, 본문 전통 용례도 함께 고려했습니다.
- source_word: ἀποστερηταί
  english_pob_choice: defrauders
  chosen_korean: 사기꾼
  alternatives_korean:
  - 빼앗는 자
  - 가로채는 자
  lexicon: LSJ
  rationale: 예고된 ‘맡겨진 것/예치물’ 이미지를 고려하면 적극적으로 남의 것을 가로채는 자라는 뜻이 강하므로, 현대 독자에게 가장 분명한 ‘사기꾼’으로 옮겼습니다.
- source_word: παρακαταθήκη
  english_pob_choice: deposit
  chosen_korean: 맡겨진 것
  alternatives_korean:
  - 예치물
  - 보관물
  lexicon: BDAG
  rationale: 기술 용어의 법적·신탁적 의미를 살리되, 한국어에서는 문맥상 ‘주님께 받은 맡겨진 것’이 가장 자연스럽습니다.
theological_decisions:
- issue: ἐν τῇ σαρκὶ ταύτῃ의 ‘이 육체 안에 거하게 하신 영’의 성격
  chosen_reading: 하나님께서 사람 안에 거하게 하신 내주하는 영으로 이해했습니다.
  alternative_readings:
  - 단순한 인간 영
  - 호흡 또는 생명력
  rationale: ‘하나님께서 받게 하신 거짓 없는 영’과 ‘당신 안에 거하시는 주님’이라는 뒤 문맥이 이어져, 단순 인간 영보다 하나님이 주신 내주 선물을 가리키는 흐름이 강합니다.
  doctrine_reference: 'POB translation philosophy: source-grounded interpretive restraint'
- issue: ἀθετοῦσι τὸν Κύριον의 의미
  chosen_reading: ‘주님을 버리는 것’으로 옮겨, 단순한 무시가 아니라 주님의 권리를 거부하는 행위로 드러냈습니다.
  alternative_readings:
  - 주님을 무효화하는 것
  - 주님을 거절하는 것
  rationale: 뒤따르는 ‘맡겨진 것’을 돌려주지 않는다는 예치물 비유가 있으므로, 관계적 배반과 책임 거부의 강도를 살리는 번역이 필요합니다.
  doctrine_reference: POB lexical/theological consistency with deposit metaphor
- issue: ζήσεται τῷ Θεῷ의 방향성
  chosen_reading: ‘하나님을 향해 살 것입니다’로 옮겼습니다.
  alternative_readings:
  - 하나님을 위해 살 것입니다
  - 하나님께 살 것입니다
  rationale: 한국어에서 ‘하나님을 향해 살다’는 다소 낯설지만, 여격의 방향성을 보존하면서도 의미를 과도하게 평탄화하지 않습니다.
  doctrine_reference: source-driven dative orientation
