base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041.yaml
  text: 'He says to me: “Remove from yourself every evil desire[h], but clothe yourself with the desire that is good and dignified[a]; for when you are clothed with this desire, you will hate the evil desire and you will bridle[b] it as you wish.


    2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes[c] people—especially if a slave of God falls into it and is not sensible, he is grievously consumed by it. It consumes such as these: those who do not have the garment of good desire, but are mixed up with this age[d]. These, therefore, it hands over to death.”


    3. “What deeds of evil desire,” I say, “hand people over to death, sir[e]? Make them known to me, so that I may keep away from them.” “Listen,” [he says][f], “by what deeds evil desire puts the slaves of God[g] to death.”'
translation:
  language: ko
  text: '그가 제게 말했습니다. "온갖 악한 욕망을 너 자신에게서 제거하십시오. 그러나 선하고 품위 있는 욕망을 입으십시오. 이 욕망을 입고 나면 악한 욕망을 미워하게 되고, 원하는 대로 그것을 길들일 수 있을 것입니다.


    2. "악한 욕망은 사나우며 길들이기도 어렵습니다. 그것은 무서운 것이어서, 그 사나움으로 사람들을 크게 삼켜 버립니다. 특히 하나님의 종이 그 안에 빠져 분별력이 없으면, 그에게는 더욱 심하게 삼켜집니다. 이 욕망은 이런 사람들, 곧 선한 욕망의 옷을 입지 않고 이 시대와 뒤섞여 있는 사람들을 삼켜 버립니다. 그러므로 그것은 그들을 죽음에 넘겨줍니다."


    3. "악한 욕망의 어떤 행위들이 사람들을 죽음에 넘겨줍니까, 주님? 그것들을 제게 알려 주십시오. 그래서 제가 그것들에서 멀리 떨어져 있게 하려는 것입니다."


    "들으십시오," 그가 말했습니다. "악한 욕망이 어떤 행위들로 하나님의 종들을 죽음에 이르게 하는지."[a][b][c][d][e][f][g][h]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία πονηρά / ἐπιθυμία ἡ πονηρά
  english_pob_choice: evil desire
  chosen_korean: 악한 욕망
  alternatives_korean:
  - 악한 갈망
  - 악한 정욕
  lexicon: ἐπιθυμία
  rationale: POB의 핵심 대조를 살리기 위해 '욕망'을 기본으로 두고, moral force를 '악한'으로 분명히 했습니다. '정욕'은 한국어에서 성적 의미로 좁아질 수 있어 문맥을 좁힐 위험이 있습니다.
- source_word: ἐπιθυμία τὴν ἀγαθὴν καὶ σεμνήν
  english_pob_choice: the desire that is good and dignified
  chosen_korean: 선하고 품위 있는 욕망
  alternatives_korean:
  - 선하고 단정한 욕망
  - 좋고 품위 있는 욕망
  lexicon: ἐπιθυμία / σεμνός
  rationale: ἀγαθός와 σεμνός의 두 형용사를 각각 '선하다'와 '품위 있다'로 나누어, 도덕적 선함과 품위/존엄의 뉘앙스를 함께 드러냈습니다.
- source_word: δοῦλος Θεοῦ / τοὺς δούλους τοῦ Θεοῦ
  english_pob_choice: a slave of God / the slaves of God
  chosen_korean: 하나님의 종 / 하나님의 종들
  alternatives_korean:
  - 하나님의 노예 / 하나님의 노예들
  - 하나님께 속한 종 / 하나님께 속한 종들
  lexicon: δοῦλος
  rationale: 이 문맥의 POB는 'slave(s)'로 신분의 예속성을 강조하지만, 한국어 본문에서 '노예'는 과도한 현대적 뉘앙스가 강해 독서성을 해칠 수 있어, 본문은 '종'으로 두고 audit는 유지했습니다.
- source_word: ἐμπεφυρμένους τῷ αἰῶνι τούτῳ
  english_pob_choice: mixed up with this age
  chosen_korean: 이 시대와 뒤섞여 있는
  alternatives_korean:
  - 이 시대에 휩쓸려 있는
  - 이 세상과 얽혀 있는
  lexicon: ἐμπεφυρμένους
  rationale: POB의 문구 'mixed up with'를 너무 추상화하지 않고, 혼합·얽힘의 상태를 살리기 위해 '뒤섞여 있는'을 택했습니다. '이 세상'보다 '이 시대'가 αἰών의 시간적-질서적 의미를 더 직접적으로 반영합니다.
theological_decisions:
- issue: '''slave of God''의 신분 표현을 한국어에서 어떻게 유지할지'
  chosen_reading: 본문은 '하나님의 종'으로 읽되, POB의 예속성 강조는 audit에서 보존했습니다.
  alternative_readings:
  - 하나님의 노예
  - 하나님께 속한 종
  rationale: 이 단락은 악한 욕망의 지배성을 강조하므로 δοῦλος의 강한 종속 의미가 중요하지만, 한국어 본문에서는 의미 왜곡 없이 읽히는 표현을 우선했습니다.
  doctrine_reference: 사회·수사적 번역 결정을 위한 용례 판단
- issue: '''그가 말했습니다''와 인용문 내부의 명령형/대화체 유지'
  chosen_reading: 서술은 합쇼체로 유지하고, 직접 인용은 원문의 명령과 질문의 긴박성을 살려 '하십시오/들으십시오'로 옮겼습니다.
  alternative_readings:
  - 전면 평서체
  - 보다 완곡한 청유형
  rationale: 본문의 권면과 응답 구조가 명확하므로, 화행의 힘을 약화시키지 않기 위해 직접 화법의 명령성을 유지했습니다.
  doctrine_reference: 문체·화행 보존 원칙
