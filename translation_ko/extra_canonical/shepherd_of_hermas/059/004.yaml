revisions:
- from: 3. 나는 그에게 말합니다. “주님, 만일 그들이 영광의 천사를 원망하게 할 만큼 행했다면 저는 어떻게 하였겠습니까?” “그렇지 아니하면 온 집의 가장인 네가 환난을 받지 아니하면 저희가 환난을 당하지 아니하리니 네가 환난을 당하면 그들도 환난을 받을 것이요 네가 굳게 선다면 그들도 환난을 당하지 아니하리라”고 말씀하셨습니다.
  to: 3. 나는 그에게 말합니다. “주님, 그들이 영광스러운 천사를 분노하게 할 그런 일을 하였다면, 저는 무슨 일을 하였습니까?” 그가 말합니다. “그렇지 않으면, 온 집안의 가장인 네가 괴로움을 겪지 않는 한 그들은 괴로움을 겪을 수 없다. 네가 괴로움을 겪으면 반드시 그들도 괴로움을 겪겠지만, 네가 굳게 서 있으면 그들은 아무 괴로움도 겪을 수 없다.”
