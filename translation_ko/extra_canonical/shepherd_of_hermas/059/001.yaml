translation:
  language: ko
  text: '비유 7


    며칠 뒤에 나는 전에 목자들을 보았던 바로 그 들판에서 그를 보았습니다. 그가 나에게 말했습니다. “무엇을 찾고 있습니까?”


    제가 말했습니다. “주님, 징벌의 목자에게 제 집에서 나가라고 명령해 주시기를 바라며 왔습니다. 그가 저를 몹시 괴롭히기 때문입니다.”


    그가 말했습니다. “당신은 괴로움을 받아야 합니다. 영광스러운 천사가 당신에 관하여 그렇게 명령했기 때문입니다. 그분은 당신이 시험을 받기를 원하십니다.”


    제가 말했습니다. “주님, 제가 이 천사에게 넘겨질 만큼 그렇게 악한 무슨 일을 했습니까?”'
