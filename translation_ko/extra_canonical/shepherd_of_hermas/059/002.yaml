revisions:
- from: 1. 며칠 후에 내가 목자들을 보았던 그 들판에서 그를 보았는데 그가 나에게 "무엇을 구하느냐?" “주님, 제가 여기 있습니다. 벌을 주는 목자에게 명령하여 내 집에서 나가라고 하십시오. 그가 나를 크게 괴롭게 하기 때문입니다.” 그분은 “너희가 환난을 받는 것이 마땅하니 영광의 천사가 너희를 위하여 이같이 명하였으니 이는 너희가 시험을 받기를 원하심이라”고 말씀하십니다. “주님, 제가 무슨 악한 일을 해서 제가 이 천사의 손에 넘겨질 만큼 악한 일을 하였습니까?”라고 나는 말합니다.
