base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053.yaml
  text: '“I rejoiced[i], Sir[a],” I say, “when I heard this explanation.”


    “Listen now,” he says: “Keep this flesh of yours clean and undefiled, so that the spirit that dwells in it[c] may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart[b] that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh,[d] you will not live.”


    “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”


    “As to former ignorances[f],” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances,[e] if from now on you do not defile your flesh or the spirit; for both are shared[g] and cannot be defiled apart from one another. Therefore keep both clean, and you will live to God[h].”'
  footnotes:
  - marker: a
    text: Greek κύριε here is a polite address to the shepherd/angelic guide, hence “Sir,” not the divine title “Lord.”
    reason: cultural_note
  - marker: b
    text: “Rise up in your heart” is a Semitic-Greek idiom for “come into your mind” or “occur to you.”
    reason: cultural_note
  - marker: c
    text: “The spirit that dwells in it” may be understood as the human spirit or as the (Holy) Spirit; the Greek does not specify ἅγιον here. The explicit “Holy Spirit” follows in v.2.
    reason: alternative_reading
  - marker: d
    text: 'The words “the flesh” in the second clause are textually uncertain (daggered in some editions). The sense is maintained either way: defilement leads to death.'
    reason: textual_variant
  - marker: e
    text: Many editions bracket “But now guard yourself … will give healing for former ignorances,” as some witnesses omit it. It fits Hermas’ exhortational style; we include it here.
    reason: textual_variant
  - marker: f
    text: “Former ignorances” renders ἀγνοήματα, idiomatically “offenses committed in ignorance.”
    reason: lexical_alternative
  - marker: g
    text: “Both are shared” renders κοινά ἐστι as “held in common/partnered,” not “common” in the sense of “profane/unclean.”
    reason: lexical_alternative
  - marker: h
    text: “Live to God” mirrors the Greek dative (orientation). “Live for God” is an acceptable paraphrase.
    reason: lexical_alternative
  - marker: i
    text: Or 'Therefore keep both pure, and you will live to God[h].'.
    reason: previous_rendering
translation:
  language: ko
  text: '“제가 그 설명을 듣고 기뻐했습니다, 선생님[a]”라고 제가 말했습니다.


    “이제 잘 들으십시오.” 그가 말했습니다. “이 육체를 깨끗하고 더럽혀지지 않게 지키십시오. 그러면 그 안에 거하는 영[c]이 그것에 대해 증언하고, 당신의 육체가 의롭다 하심을 받을 것입니다. 이 육체가 썩어 없어질 것이라는 생각이 당신 마음에[b] 올라오지 않도록 조심하십시오. 그리고 어떤 더러움으로든 그것을 잘못 사용하지 마십시오. 왜냐하면 당신의 육체를 더럽히면 성령도 더럽히게 되고, 육체를 더럽히면[d] 살지 못할 것이기 때문입니다.


    “그러나, 선생님, 제가 말했습니다. 이 말씀을 듣기 전에 이미 어떤 이전의 무지함이 있었다면, 자기 육체를 더럽힌 사람은 어떻게 구원을 받겠습니까?”


    “그 이전의 무지함들에 대해서는[f] 하나님만이 그것들에 대한 치유를 주실 수 있습니다. 모든 권세가 그분께 속해 있기 때문입니다. 그러나 이제는 자신을 지키십시오. 그러면 전능하신 주님께서—긍휼이 많으신 분이시니—이전의 무지함들에 대한 치유를 주실 것입니다[e]. 다만 이제부터는 당신의 육체도 영도 더럽히지 마십시오. 둘은 함께 속해 있어서[g] 서로 떼어 놓고는 더럽혀질 수 없습니다. 그러므로 둘 모두를 깨끗하게 지키십시오. 그러면 하나님께 살게 될 것입니다[h].”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  english_pob_choice: Sir
  chosen_korean: 선생님
  alternatives_korean:
  - 주님
  - 님
  lexicon: BDAG
  rationale: 여기서는 신적 호칭이 아니라 안내자에게 드리는 공손한 호칭이므로, 한국어에서는 ‘선생님’이 문맥상 가장 자연스럽고 예절 있는 대응입니다.
- source_word: σάρκα
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 몸
  - 살
  lexicon: BDAG
  rationale: 이 단락은 정결/더러움의 윤리적 언어를 쓰므로, 단순한 ‘몸’보다 ‘육체’가 원문의 اخلاق적 긴장을 더 잘 살립니다.
- source_word: καθαρὰν
  english_pob_choice: clean
  chosen_korean: 깨끗하고
  alternatives_korean:
  - 순수하고
  - 정결하게
  lexicon: BDAG
  rationale: 시작과 끝의 καθαρά/καθαρὰν이 포함구조를 이루므로, 두 곳 모두 ‘깨끗하다’ 계열로 맞추어 반복 효과를 살렸습니다.
- source_word: ἀμίαντον
  english_pob_choice: undefiled
  chosen_korean: 더럽혀지지 않게
  alternatives_korean:
  - 오염되지 않게
  - 순결하게
  lexicon: BDAG
  rationale: ‘undefiled’는 도덕·정결의 오염 금지를 뜻하므로, 한국어에서도 ‘더럽혀지지 않게’로 직관적으로 옮겼습니다.
- source_word: ἐπίλυσιν
  english_pob_choice: explanation
  chosen_korean: 설명
  alternatives_korean:
  - 해석
  - 해명
  lexicon: BDAG
  rationale: 해몽/해석의 기술적 느낌을 살리면서도 현대 한국어에서 가장 자연스러운 말이 ‘설명’입니다.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  english_pob_choice: the Holy Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 거룩한 영
  - 성스러운 영
  lexicon: BDAG
  rationale: 이곳은 ἅγιον이 명시되어 있으므로 프로젝트 기본어인 ‘성령’을 사용했습니다.
- source_word: ἴασιν
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 회복
  - 치료
  lexicon: BDAG
  rationale: 주어진 문맥이 회개와 회복의 치료 은유를 사용하므로 ‘치유’가 가장 적절합니다.
- source_word: ἀγνοημάτων
  english_pob_choice: former ignorances
  chosen_korean: 이전의 무지함들
  alternatives_korean:
  - 이전의 잘못들
  - 무지에서 비롯된 허물들
  lexicon: LSJ
  rationale: 복수형 ἀγνοήματα를 살리되, 한국어에서는 ‘무지함들’이 다소 생경하므로 ‘이전의 무지함들’로 옮겨 원문의 느낌을 유지했습니다.
- source_word: κοινά ἐστι
  english_pob_choice: are shared
  chosen_korean: 함께 속해 있어서
  alternatives_korean:
  - 공동으로 속해 있어서
  - 공유되어 있어서
  lexicon: BDAG
  rationale: 여기서 κοινά는 ‘공동으로/함께 나누는’ 뜻이므로, ‘함께 속해 있어서’로 옮겨 육체와 영의 상호의존성을 드러냈습니다.
- source_word: ζήσῃ τῷ Θεῷ
  english_pob_choice: live to God
  chosen_korean: 하나님께 살게 될 것입니다
  alternatives_korean:
  - 하나님을 향해 살게 될 것입니다
  - 하나님을 위해 살게 될 것입니다
  lexicon: BDAG
  rationale: 여격의 방향성을 한국어에서 자연스럽게 풀어 ‘하나님께 살다’로 옮겼습니다.
theological_decisions:
- issue: v.1의 κατοικοῦν ἐν αὐτῇ의 영 정체성
  chosen_reading: ‘그 안에 거하는 영’으로 두어 v.2의 ‘성령’과 구분되는 여지를 남깁니다.
  alternative_readings:
  - ‘그 안에 거하는 성령’
  - ‘그 안에 거하는 인간의 영’
  rationale: 원문은 v.1에서 ἅγιον이 없고, v.2에서야 ‘성령’이 명시됩니다. 따라서 초반에는 모호성을 보존하는 편이 본문 진행을 더 잘 드러냅니다.
  doctrine_reference: '번역 원칙: 신학적 긴장 보존'
- issue: ‘깨끗하다’와 ‘더럽히다’의 정결 어휘
  chosen_reading: 청결/오염의 정결 어휘를 일관되게 사용했습니다.
  alternative_readings:
  - ‘순수하다/순결하다’
  - ‘정결하다/부정하다’
  rationale: 이 구절은 육체와 영의 정결을 경고하는 문맥이므로, ‘깨끗하다’와 ‘더럽히다’의 대비가 가장 직접적으로 원문을 전달합니다. 또한 시작과 끝의 반복을 살려 포함구조를 유지합니다.
  doctrine_reference: '번역 원칙: 문학적 구조와 어휘 반복 보존'
