review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the stones as those who suffered because of the Lord's name. However, it renders the stones' fitting at their joints as actively 'connecting the joint parts,' whereas the Greek says that their joints fit together with those of the other stones already built.
  naturalness: ‘건물에 박고’ is unnecessarily forceful and less natural for stones being placed in a symbolic building. ‘접합 부분을 연결하는’ is awkward and does not express reciprocal fitting. A passive construction with ‘이음매가 잘 맞는’ is natural Korean.
  terminology: ‘주의 이름’ appropriately reflects τοῦ ὀνόματος τοῦ Κυρίου. ‘주의 이름 때문에’ clearly conveys ἕνεκεν without adding interpretive content.
  issues:
  - severity: medium
    issue: ‘접합 부분을 연결하는’ mistranslates συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν μετὰ τῶν ἑτέρων λίθων.
    rationale: The phrase describes the stones' joints as fitting/matching together with the other already-built stones; it does not say that they connect joint sections.
  - severity: low
    issue: ‘건물에 박고’ is overly concrete and forceful.
    rationale: ἐπιτιθέμενοι means being placed/set upon or into the building. ‘놓이고’ retains the imagery without implying hammering or driving in.
  - severity: low
    issue: The dialogue uses the archaic declarative ‘-니라’ alongside a modern question.
    rationale: The specified modern formal-polite 합쇼체 is better maintained with ‘-입니다’ and ‘-습니까?’.
  revised_text: “또 깊은 곳에서 끌어 올려져 건축물에 놓이고, 이미 세워진 다른 돌들과 그 이음매가 잘 맞는 이들은 누구입니까?” “이들은 주의 이름 때문에 고난을 받은 이들입니다.”
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek stone-and-building imagery, accurately renders the mutual fitting of joints, and uses consistent modern formal-polite Korean. No footnote is needed for this straightforward unit.
