review_pass:
  verdict: revise
  source_fidelity: 원문의 직분 목록(사도, 감독, 교사, 집사), 하나님을 경외하는 태도, 택하신 이들을 위한 감독·가르침·섬김, 죽은 이들과 아직 살아 있는 이들의 대조, 상호 일치와 평화의 내용을 모두 명료하게 반영하도록 수정했습니다. 원문의 건축 비유인 ‘이음새/맞물림’과 ‘탑의 건축’도 보존했습니다.
  naturalness: 초안에는 ‘네모 있고’, ‘서로 화평하며’, ‘타워의 건물’ 등 현대 표준 한국어로 부자연스럽거나 문장이 미완결된 표현이 있으며, 종결도 요구된 합쇼체와 맞지 않습니다. 문장을 자연스러운 현대 합쇼체로 재구성했습니다.
  terminology: ἐπίσκοποι는 문맥상 전통적 직분명인 ‘감독들’로, διάκονοι는 ‘집사들’로 옮겼습니다. ‘잠들었다’는 죽음을 완곡하게 표현하는 원문의 κεκοιμημένοι를 유지했습니다. ‘이음새’는 ἁρμογαί(돌들이 맞물리는 접합부)를 구체적으로 드러냅니다.
  issues:
  - severity: high
    issue: 문장이 ‘타워의 건물’로 끝나며 문법적으로 미완결되고, 원문의 ‘탑의 건축에서 그들의 이음새가 서로 맞는다’는 결론이 정확히 전달되지 않습니다.
    rationale: 핵심 건축 비유의 논리와 문장 완결성을 위해 ‘그러므로 탑을 세우는 일에서 그들의 이음새가 서로 잘 맞습니다’로 바로잡아야 합니다.
  - severity: medium
    issue: ‘네모 있고 희고’ 및 ‘서로 화평하며’는 현대 한국어로 부자연스럽습니다.
    rationale: ‘네모나고 희며’, ‘서로 평화를 누리고’가 자연스럽고 원문의 의미도 충실히 전달합니다.
  - severity: medium
    issue: 초안의 종결 표현 ‘-느니라/-나니’는 요청된 현대 formal-polite 합쇼체와 일치하지 않습니다.
    rationale: 현대 합쇼체인 ‘-습니다’로 통일해야 합니다.
  - severity: medium
    issue: ‘하나님의 영광으로 행하며’는 κατὰ τὴν σεμνότητα τοῦ Θεοῦ(하나님을 향한 경외/경건의 태도에 따라 살아감)를 충분히 반영하지 못합니다.
    rationale: ‘하나님을 경외하는 가운데 살아가며’가 문맥과 어휘 의미에 더 부합합니다.
