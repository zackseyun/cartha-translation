revisions:
- from: “집에 들어가는 돌들에 대하여 들어 보라 네모 있고 희고 서로 맞물리는 돌들은 곧 사도들과 감독들과 교사들과 집사들이니 그들은 하나님의 영광으로 행하며 순결하고 경건함으로 택하신 자들을 감독하고 가르치며 섬기는데 어떤 사람은 잠들었고 어떤 사람은 아직 살아 있느니라 그들이 항상 서로 화합하며 서로 화평하며 서로 말을 들었나니 이러므로 그들의 마디가 서로 합하느니라 타워의 건물.
  to: “이제 건축에 들어가는 돌들에 대하여 들으십시오. 네모나고 희며 그 이음새가 서로 잘 맞는 돌들은 사도들과 감독들과 교사들과 집사들입니다. 이들은 하나님을 경외하는 가운데 살아가며, 하나님께서 택하신 이들을 순결하고 경건하게 돌보고 가르치고 섬겼습니다. 그들 가운데 어떤 이들은 잠들었고, 어떤 이들은 아직 살아 있습니다. 그들은 언제나 서로 뜻을 같이하고, 서로 평화를 누리며, 서로의 말을 들었습니다. 그러므로 탑을 세우는 일에서 그들의 이음새가 서로 잘 맞습니다.”
