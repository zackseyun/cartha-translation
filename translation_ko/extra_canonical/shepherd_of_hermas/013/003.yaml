  rationale: 원문의 돌-건축 비유와 λατομέω의 의미를 보존하고, κυρία의 존칭 및 현대 한국어 문체를 바로잡았습니다. '주님 앞에서 올바르게'는 속격 표현의 의미를 자연스럽게 재현하되 특정 교리적 해석을 덧붙이지 않습니다.
