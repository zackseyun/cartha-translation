  - severity: medium
    issue: '''주의 의로 행하고'''
    rationale: ἐν τῇ εὐθύτητι τοῦ Κυρίου는 주님의 올바름/곧음 가운데 행한 것을 말하며, '의'는 한국어에서 다른 신학적 함의를 더하기 쉽습니다.
