  source_fidelity: 원문의 'ξηρά'는 '마른 땅'보다 여기서는 돌이 나르는 곳을 가리키는 '육지'가 자연스럽습니다. 'λατομουμένους'는 단순히 '치움'이 아니라 돌을 채석하거나 다듬는 행위를 뜻하므로 수정이 필요합니다. 'οἰκοδομή'는 '집'보다 문맥상 '건축물/건축'으로 옮겨야 합니다.
  naturalness: 초안의 '아가씨'는 κυρία에 대한 호칭으로 부적절하게 현대적이고 연령을 특정합니다. '부인'이 원문의 존칭을 더 잘 반영합니다. 또한 인용문 안에서 화자가 답하는 형식을 분명히 하고, 현대 표준 한국어 합쇼체로 다듬었습니다.
  terminology: '''주님'', ''계명''은 적절합니다. ''주의 의로''는 원문의 ''주님의 올바름/곧음''을 ''의''로 신학적으로 좁힐 수 있으므로 ''주님 앞에서 올바르게''로 옮겼습니다.'
