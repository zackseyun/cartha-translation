- from: '"나는 마른 땅에서 운반되는 다른 돌들이 누구인지 알고 싶습니다, 아가씨." 그녀는 “치움을 받지 않고 집에 들어가는 자들을 주님께서 승인하셨으니 이는 그들이 주의 의로 행하고 그의 계명들을 지켰음이라”고 말했습니다.'
