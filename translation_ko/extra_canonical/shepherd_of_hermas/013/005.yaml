  source_fidelity: 초안은 회개 조건과 망대 건축 기간이라는 핵심 논지를 대체로 담고 있으나, 첫 질문의 동사 반복과 후반 조건절의 중복·연결 불명확으로 그리스어의 논리 구조가 흐려졌습니다. 또한 ἔκβολοι(내쫓긴 자들)의 뜻을 명확히 해야 합니다.
