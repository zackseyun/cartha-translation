  terminology: ‘망대’, ‘회개’, ‘믿음’은 본문의 상징과 주요 용어를 적절히 보존합니다. οἰκοδομή는 문맥상 ‘건축’으로, εὔχρηστοι는 ‘건축에 쓸모가 있을’로 옮겼습니다.
