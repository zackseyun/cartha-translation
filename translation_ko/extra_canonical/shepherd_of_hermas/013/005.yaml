revisions:
- from: “그리고 그들이 버리고 버린 사람들은 누구입니까?” "이들은 죄를 짓고 회개하고자 하는 사람들이니라 그러므로 저희가 망대 밖에 쫓겨나지 아니하였으니 이는 그들이 회개하면 건축에 유익이 되기 때문이라. 그러므로 만일 회개하려는 자들이 지금 회개하면 망대가 건축되는 동안에 회개하면 믿음이 강하리라 그러나 만일 그 건물이 완성되면 저희가 다시 있을 곳은 없고 쫓겨나리라 그러나 저희에게 남은 것은 오직 망대 곁에 누울 뿐이니라"
  to: “그들이 버리고 내던지던 이들은 누구입니까?” “이들은 죄를 지었으나 회개하려는 사람들입니다. 그러므로 그들을 망대 밖 멀리 내던지지 않았습니다. 그들이 회개하면 그 건축에 쓸모가 있을 것이기 때문입니다. 그러므로 회개하려는 이들이 지금, 망대가 건축되는 동안에 회개하면 믿음 안에서 굳세게 될 것입니다. 그러나 건축이 완성되면 그들에게는 더 이상 자리가 없고, 내쫓긴 자들이 될 것입니다. 다만 그들에게 남는 것은 망대 곁에 놓여 있는 것뿐입니다.”
  rationale: 원문의 반복된 회개 조건을 한국어에서 중복 없이 명료하게 재구성하되, ‘지금’과 ‘망대가 건축되는 동안’이라는 시간적 한정은 보존했습니다. ‘멀리 내던지지 않았다’, ‘내쫓긴 자들’, ‘망대 곁에 놓여 있다’는 각각 μακρὰν οὐκ ἀπερίφησαν, ἔκβολοι, παρὰ τῷ πύργῳ κεῖσθαι를 반영합니다. 본문에 없는 교리적 해석은 추가하지 않았습니다.
