  text: “이끌려 와 건축물 안에 놓이는 이들은 누구입니까?” “그들은 믿음에 새로 들어온 신실한 이들입니다. 그러나 그들 가운데 악이 발견되었으므로, 천사들에게서 선을 행하라는 권고를 받고 있습니다.”
