  terminology: πίστει는 ‘믿음’, πιστοί는 ‘신실한 이들’로 구별해 옮겼습니다. ἀγαθοποιεῖν은 ‘선을 행하다’, πονηρία는 판단을 과도하게 구체화하지 않고 ‘악’으로 번역했습니다.
