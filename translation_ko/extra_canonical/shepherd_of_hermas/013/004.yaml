revisions:
- from: “그리고 건물 안으로 끌려들어가는 사람들은 누구입니까?” “그들은 믿음과 신실함에 있어서 새로운 자들이라 그러나 그들 가운데 악이 드러났으므로 천사들에게 선을 행하라는 권고를 받는도다.”
  to: “이끌려 와 건축물 안에 놓이는 이들은 누구입니까?” “그들은 믿음에 새로 들어온 신실한 이들입니다. 그러나 그들 가운데 악이 발견되었으므로, 천사들에게서 선을 행하라는 권고를 받고 있습니다.”
  rationale: 원문의 수동적 건축 비유(이끌려 와 놓임)를 보존하고, ‘믿음에 새로 들어온’과 ‘신실한’을 정확히 연결했습니다. 현재 수동형 νουθετοῦνται는 ‘권고를 받고 있습니다’로 재현했으며, 현대 정중 합쇼체로 통일했습니다.
