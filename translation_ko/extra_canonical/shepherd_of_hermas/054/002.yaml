revisions:
- from: 내가 속으로 이 말을 하다가 홀연히 내 곁에 앉으시어 이르시되 내가 너희에게 명령한 계명에 너희가 어찌하여 두 마음을 품느냐 이것은 선한 것이니라 두 마음을 품지 말고 오직 주님를 믿는 믿음으로 옷 입고 그리하면 이 가운데 행하리라 내가 이 계명 안에서 너희를 강하게 하리라.
  to: 내가 속으로 이런 말을 하고 있을 때, 갑자기 그가 내 곁에 앉아 계신 것을 보고, 그가 나에게 이렇게 말씀하셨습니다. “내가 네게 명령한 계명들에 대하여 어찌하여 두 마음을 품습니까? 그것들은 선합니다. 결코 두 마음을 품지 말고 주님의 믿음을 옷 입듯 입으십시오. 그러면 그 계명들을 따라 행하게 될 것입니다. 내가 그 계명들 안에서 당신을 굳세게 하겠습니다.”
  rationale: The revision restores the singular addressee throughout, explicitly identifies the repeated plural pronoun as the commandments, corrects grammar and punctuation, and renders the Greek sudden perception and direct speech in modern formal-polite Korean. ‘주님의 믿음’ retains the source’s genitive expression without imposing an interpretive expansion.
