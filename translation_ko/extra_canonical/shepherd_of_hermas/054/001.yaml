  rationale: 초안의 미완결 인용문을 원문에 따라 완성하고, ‘모든 것’ 및 계명들에 대한 다섯 가지 서술을 빠짐없이 반영했습니다. 원문의 미래형 복 선언은 현대 합쇼체 문체로 ‘복될 것입니다’로 옮겼으며, 교단적 해석을 덧붙이지 않았습니다.
