  - severity: medium
    issue: ‘회개하여’의 시제·상과 ‘이 세상에서’의 수식 관계
    rationale: οἱ μετανοοῦντες는 ‘회개하는 여러분’이며, τοῦ αἰῶνος τούτου는 악한 것들을 수식합니다. ‘이 세상에서 너를 괴롭게 하는 악’은 의미 관계를 흐립니다.
