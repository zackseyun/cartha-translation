  verdict: revise
  source_fidelity: 원문의 복수 호격(‘회개하는 이들’)과 복수 대명사를 일관되게 반영해야 합니다. ‘악들’은 ‘이 시대의 악한 것들’이며, 그것들이 회개자들을 ‘짓누르는’ 것으로 표현됩니다. ‘ἐν αὐταῖς πορεύεσθε’는 계명들을 단지 ‘지키라’기보다 그 안에서 ‘걸어가라/행하라’는 뜻입니다. 끝의 [πάντα]는 본문 전승상 불확실한 낱말이므로 대괄호로 보존합니다.
  naturalness: 초안에는 ‘너희가 회개하여 … 너를’, ‘더 더 하지’, ‘하나님께 대하여 살리라’처럼 수·문법·띄어쓰기와 현대 한국어 흐름에 문제가 있습니다. 합쇼체의 직접 권면으로 매끄럽게 다듬었습니다.
  terminology: ‘회개’, ‘의’, ‘계명’, ‘죄’는 유지했습니다. δικαιοσύνης는 여기서 ‘의의 모든 덕’으로 옮겨 원문의 속격 관계를 보존했고, τῷ Θεῷ는 직역적이면서 자연스러운 ‘하나님을 위하여 살게 될 것입니다’로 옮겼습니다.
