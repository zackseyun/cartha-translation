revisions:
- from: “그러므로 너희가 회개하여 이 세상에서 너를 괴롭게 하는 악을 벗어 버리고 의의 모든 덕을 입으면 이 계명들을 지켜 다시는 죄를 더하지 아니하리라 그런즉 너희가 더 더 하지 아니하면 이전 죄에서 떠나리라 그런즉 나의 이 계명을 지키라 그리하면 너희가 하나님께 대하여 살리라 이것이 내가 너희에게 말한 것이 [all]이니라.”
  to: “그러므로 회개하는 여러분은 여러분을 짓누르는 이 시대의 악한 것들을 벗어 버리십시오. 그리고 의의 모든 덕을 입으면, 이 계명들을 지킬 수 있게 되어 다시는 여러분의 죄에 죄를 더하지 않게 될 것입니다. 그러므로 더 이상 아무것도 더하지 않으면, 여러분의 이전 죄들에서 떠나게 될 것입니다. 그러므로 나의 이 계명들 안에서 걸어가십시오. 그러면 하나님을 위하여 살게 될 것입니다. 이 [모든 것]을 내가 여러분에게 말하였습니다.”
  rationale: 복수 청자와 문법 관계를 바로잡고, ‘짓누르는 이 시대의 악한 것들’, ‘계명들 안에서 걸어가십시오’라는 표현으로 원문의 어휘와 비유를 반영했습니다. 불확실한 [πάντα]는 번역문과 각주에서 모두 보존했습니다.
  reviewer_model: gpt-5.6-terra
