  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: ko
  text: “그러므로 회개하는 여러분은 여러분을 짓누르는 이 시대의 악한 것들을 벗어 버리십시오. 그리고 의의 모든 덕을 입으면, 이 계명들을 지킬 수 있게 되어 다시는 여러분의 죄에 죄를 더하지 않게 될 것입니다. 그러므로 더 이상 아무것도 더하지 않으면, 여러분의 이전 죄들에서 떠나게 될 것입니다. 그러므로 나의 이 계명들 안에서 걸어가십시오. 그러면 하나님을 위하여 살게 될 것입니다. 이 [모든 것]을 내가 여러분에게 말하였습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: 모든 것
    text: ‘모든 것’에 해당하는 그리스어 낱말은 일부 본문 전승에서 빠져 있어 대괄호로 표시했습니다.
    reason: 원문의 대괄호 [πάντα]가 나타내는 본문 전승의 불확실성을 보존합니다.
