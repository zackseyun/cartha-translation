revisions:
- from: 그는 아주 많은 양을 방목하고 있었는데 그 양들은 마치 사치스럽고 사치스러워서 이리저리 뛰어다니면서 즐거워했습니다. 그리고 목자는 자신의 양 떼를 보고 매우 기뻐했습니다. 목자의 모습은 매우 유쾌하여 양들 사이를 뛰어다니고 있었습니다.
  to: 그는 아주 많은 양을 치고 있었습니다. 그 양들은 마치 흥청거리며 사치스럽게 지내는 듯했고, 이리저리 뛰어다니며 즐거워했습니다. 목자 자신도 자기 양 떼를 보며 매우 기뻐했습니다. 목자의 모습도 매우 즐거워 보였으며, 그는 양들 사이를 뛰어다니고 있었습니다.
