revisions:
- from: 그러므로 거짓말하는 자들은 주님을 거부하고, 주님을 속이는 사람들이 되며, 자기들이 받은 것을 그분께 돌려드리지 않습니다. 그들은 그에게서 거짓 없는 영을 받았기 때문입니다. 만일 거짓으로 돌려보내면 그들은 주님의 명령을 더럽히고 사기꾼이 되는 것입니다.
  to: 그러므로 거짓말하는 자들은 주님을 저버리고 주님의 것을 가로채는 자들이 됩니다. 그들은 자신들이 받은 맡겨진 것을 그분께 돌려드리지 않기 때문입니다. 그들은 그분에게서 거짓 없는 영을 받았습니다. 만일 그 영을 거짓된 것으로 돌려드리면, 그들은 주님의 명령을 더럽히고 주님의 것을 가로채는 자들이 된 것입니다.
  rationale: παρακαταθήκη의 ‘맡겨진 것’이라는 예탁 비유와 ἀποστερηταί의 박탈·가로챔의 의미를 보존했습니다. τοῦτο가 가리키는 ‘거짓 없는 영’을 명시하여 한국어의 지시 대상도 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:52Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 논지는 대체로 반영했으나, παρακαταθήκην(맡겨진 것/위탁물)을 단순히 ‘받은 것’으로 옮겨 중요한 비유를 약화했습니다. 또한 ἀποστερηταί는 ‘사기꾼’보다 주님에게서 빼앗는 자, 곧 주님의 것을 가로채는 자라는 의미가 더 직접적입니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽지만, ‘만일 거짓으로 돌려보내면’은 무엇을 돌려보내는지 불분명하고 ‘그에게서’는 앞선 존칭 지시와 조화되지 않습니다.
  terminology: ‘거짓 없는 영’은 ἄψευστον πνεῦμα을 잘 반영합니다. 다만 ‘주님의 명령’과 ‘맡기신 것’의 관계가 드러나도록 παρακαταθήκη의 위탁·예탁 비유를 보존하는 편이 좋습니다.
  issues:
  - severity: high
    issue: ‘자기들이 받은 것’이 ‘맡겨진 것(παρακαταθήκη)’을 평면화함
    rationale: 원문은 하나님에게서 받은 ‘거짓 없는 영’을 맡겨진 예탁물로 표현하며, 이를 그대로 돌려드리지 않는 행위를 문제 삼습니다.
  - severity: medium
    issue: ‘사기꾼’은 ἀποστερηταί의 대상을 충분히 드러내지 못함
    rationale: 문맥상 주님께 속한 것을 빼앗거나 가로채는 자라는 뜻이므로 ‘주님의 것을 가로채는 자들’이 더 충실합니다.
  - severity: medium
    issue: ‘만일 거짓으로 돌려보내면’의 목적어가 불명확함
    rationale: 원문 τοῦτο는 앞의 ‘거짓 없는 영’을 가리키므로, ‘그 영을 거짓된 것으로 돌려드리면’처럼 밝혀야 합니다.
