revisions:
- from: 그래서 나는 이 말을 듣고 크게 울었습니다. 그런데 내가 우는 것을 보고 '왜 우시나요?' '선생님, 저는 구원받을 수 있을지 모르겠습니다'라고 말합니다. '왜?'라고 합니다. 내가 말하노니 주여 나는 평생에 한 번도 진실한 말을 한 적이 없고 모든 사람에게 항상 거짓을 행하며 모든 사람 앞에 내 거짓말이 진실한 것으로 드러났나이다 아무도 내 말에 반대하지 않았지만 내 말이 믿었습니다. 그러면 나는 '선생님, 이런 일을 하고 어떻게 살 수 있습니까?'라고 말합니다.
