revisions:
- from: '''이제 당신은 듣고 있습니다. 그리하여 너희가 거래할 때 말한 이전 거짓말이라도 그것이 사실이면 그것 역시 믿을 만하게 될 것이다. 왜냐하면 그것들도 믿을 만한 것이 될 수 있기 때문입니다. 네가 이것을 지키고 이제부터 모든 진실을 말하면 너는 생명을 얻을 수 있을 것이다. 그리고 이 명령을 듣고 가장 악한 거짓말을 멀리하는 사람은 하느님을 위해 살 것입니다.'''
  to: “그러므로 이제 듣고 있으니, 이것들을 지키십시오. 그러면 당신이 일상사에서 전에 했던 거짓말들도, 이것들이 참된 것으로 드러나면, 그것들 역시 믿을 만한 것이 될 것입니다. 그것들도 믿을 만한 것이 될 수 있기 때문입니다. 당신이 이것들을 지키고 이제부터 모든 진실을 말한다면, 자기 자신을 위하여 생명을 얻을 수 있을 것입니다. 그리고 이 명령을 듣고 가장 악한 거짓말을 멀리하는 사람은 하느님을 위하여 살 것입니다.”
  rationale: The revision restores the singular exhortation, the imperative to observe the teachings, and the Greek conditional relationship between present truthfulness and the credibility of prior statements. It uses consistent formal-polite Korean and retains the source’s somewhat striking assertion that past lies may become credible, without adding an interpretive explanation.
  reviewer_model: gpt-5.6-terra
