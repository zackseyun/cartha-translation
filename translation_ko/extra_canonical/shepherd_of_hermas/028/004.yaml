  language: ko
  text: 그는 '당신의 생각은 옳고 진실합니다. 너는 하나님의 종으로서 진리를 따라 행하고 악한 양심이 진리의 영과 함께 거하지 말며 거룩하고 참된 성령을 근심하게 하지 말아야 할 것이니라' 내가 말하노니 '주여 나는 이런 말씀을 분명히 들은 적이 없나이다'
