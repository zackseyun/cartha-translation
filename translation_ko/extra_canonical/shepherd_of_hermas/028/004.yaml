  to: '그가 말씀하셨습니다. “그대의 생각은 옳고 진실합니다. 하나님의 종으로서 그대는 진리 안에서 살아야 했으며, 악한 양심이 진리의 영과 함께 거하지 않게 하고, 거룩하고 참된 성령을 근심하게 하지 말아야 했습니다.”


