review_pass:
  verdict: revise
  source_fidelity: 원문의 단수 2인칭(σου, σοὶ)을 초안이 복수형 ‘너희’로 옮겼습니다. 또한 ‘모든 진리’가 입에서 ‘나오게’ 한다는 표현과, 하나님께서 이 육신 안에 거하게 하신 영이 모든 사람 앞에서 참되게 드러난다는 구문을 더 정확히 반영할 필요가 있습니다.
  naturalness: 초안은 직접 인용문의 종결과 문장 연결이 현대 표준 한국어 합쇼체에 맞지 않고, ‘주는 주는’이라는 중복이 있습니다. 수정문은 직접 권면을 ‘-하십시오’로, 서술을 ‘-습니다’로 통일했습니다.
  terminology: θεός는 ‘하나님’, κύριος는 ‘주님’, πνεῦμα는 ‘영’으로 일관되게 옮겼습니다. σάρξ의 구체성을 보존하여 ‘이 육신’으로 번역했습니다.
  issues:
