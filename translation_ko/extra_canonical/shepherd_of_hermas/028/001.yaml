revisions:
- from: 또 그가 내게 이르시되 진리를 사랑하며 모든 진리를 너희 입에서 내라 그리하면 하나님이 이 육신에 거하게 하신 영이 모든 사람 앞에 참됨이 나타나게 되고 그리하면 너희 안에 거하시는 주가 영광을 받으시리라 주는 주는 모든 말씀에 진실하시고 그에게는 거짓이 없으시니라.
  to: 다시 그가 내게 말씀하셨습니다. “진리를 사랑하십시오. 모든 진실이 당신의 입에서 나오게 하십시오. 그리하면 하나님께서 이 육신 안에 거하게 하신 영이 모든 사람 앞에서 참된 것으로 드러나게 될 것이며, 그리하여 당신 안에 거하시는 주님께서 영광을 받으실 것입니다. 주님은 모든 말씀에 참되시며, 그분에게는 아무 거짓도 없습니다.”
  rationale: 원문의 단수 خطاب과 명령법을 보존하고, ‘영’이 ‘모든 사람 앞에서 참된 것으로 드러난다’는 목적절의 문법적 관계를 명료하게 옮겼습니다. 신적 칭호와 ‘육신’이라는 표현을 유지하면서 현대 한국어 합쇼체 문장으로 다듬었습니다.
