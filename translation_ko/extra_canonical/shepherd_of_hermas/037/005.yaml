  rationale: The revision follows the Greek syntax and sequence closely while using consistent modern formal-polite Korean. It preserves the source’s broad and somewhat unusual θεότης language as ‘신성’ rather than importing a narrower doctrinal formulation, and it retains the agricultural image of vineyards becoming barren through neglect.
