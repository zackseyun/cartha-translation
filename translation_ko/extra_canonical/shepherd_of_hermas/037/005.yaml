revisions:
- from: “들어보세요.” 그가 말합니다. “진리를 구하지도 않고 신을 구하지도 않고 오직 믿기만 하고 사업과 부와 이교와 이 시대의 여러 가지 일에 얽매이는 자들은 다 신의 비유를 깨닫지 못하나니 이는 이런 일로 말미암아 어두워지고 부패하여 황폐하게 됨이니라. 좋은 포도원을 방치하면 가시덤불과 각종 잡초가 무성해 지는 것과 같이, 방금 언급한 이 많은 일들을 믿고 추구하는 사람들도 그 이해력에서 벗어나 의에 대해 전혀 깨닫지 못합니다. 그리고 그들은 신성과 진리에 관한 이야기를 들어도 그들의 마음은 자기 일에 사로잡혀 아무것도 깨닫지 못합니다.
