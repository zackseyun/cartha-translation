  english_pob_role: consult_only
status: reviewed
revisions:
- from: “오직 하나님을 경외하며 신성과 진리를 구하며 주를 향하는 마음을 가진 자는 자기가 말하는 모든 것을 속히 깨닫고 깨닫나니 이는 그 속에 주님를 경외함이 있음이라 주님께서 거하시는 곳에는 총명이 넘치나니 그러므로 주님를 의지하라 그리하면 너희가 모든 것을 깨닫고 깨달으리라.”
  to: 그러나 하나님을 경외하고 신성과 진리에 관하여 탐구하며 마음을 주님께 두는 사람들은, 주님을 경외함이 그들 안에 있으므로 그들에게 말해지는 모든 것을 곧 깨닫고 이해합니다. 주님께서 거하시는 곳에는 큰 총명이 있기 때문입니다. 그러므로 주님께 굳게 붙으십시오. 그러면 모든 것을 깨닫고 이해하게 될 것입니다.
  rationale: 원문의 수신 대상(αὐτοῖς), 단수 명령과 약속의 형태를 보존하고, 반복되는 νοεῖν/συνιέναι는 "깨닫고 이해하다"로 구분했습니다. θεότης의 다소 넓은 표현은 "신성"으로 유지했으며, 현대 합쇼체로 문체와 조사를 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:51Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 의미는 대체로 반영했으나, "자기가 말하는 모든 것"은 αὐτοῖς(그들에게)를 잘못 해석하여 화자가 말하는 내용으로 바꾸었습니다. 또한 결론의 명령과 미래형은 단수입니다.
  naturalness: 현대 표준어 합쇼체로는 "깨닫나니/있음이라/깨달으리라"가 지나치게 고풍스럽고, 조사 "주님를"은 문법적으로 틀렸습니다. 문장을 자연스러운 현대 문체로 정리할 필요가 있습니다.
  terminology: θεότης는 이 문맥에서 "신성"으로 옮길 수 있으며, "하나님을 경외하다", "주님", "총명"은 적절합니다. κολλήθητι는 단순한 신뢰보다 관계적·지속적 의미를 살려 "굳게 붙으십시오"로 옮겼습니다.
  issues:
  - severity: high
    issue: '"자기가 말하는 모든 것"'
    rationale: 원문 πάντα τὰ λεγόμενα αὐτοῖς는 '그들에게 말해지는 모든 것'이지, 그들이 말하는 모든 것이 아닙니다.
  - severity: medium
    issue: 단수 호칭을 복수로 변경
    rationale: κολλήθητι 및 συνήσεις/νοήσεις는 모두 단수이므로 "너희가"가 아니라 단수 존대 명령·미래로 옮겨야 합니다.
  - severity: medium
    issue: 조사 오류와 고풍스러운 문체
    rationale: '"주님를"은 "주님을"이어야 하며, 합쇼체 목표에 맞게 고풍스러운 종결을 현대적으로 바꾸어야 합니다.'
  - severity: low
    issue: '"의지하라"'
    rationale: κολλήθητι는 '붙다, 밀착하다'이므로, 단순히 신뢰한다는 뜻의 "의지하다"보다 "굳게 붙으십시오"가 더 가깝습니다.
