  to: “주님, 저는 분별력이 없어서 이 비유들을 이해하지 못합니다. 그것이 어떻게 몰아내고 또다시 구원할 수 있는지, 저는 이해하지 못합니다.”
  rationale: The revision restores the omitted self-description, preserves the implicit reference to the preceding discussion rather than introducing “this parable” as a new subject, and retains the source’s syntactically elliptical objects. This avoids resolving the difficult wording into a doctrinally or textually over-specific interpretation.
