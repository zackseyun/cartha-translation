base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006.yaml
  text: 'After fifteen days[1], when I had been fasting and had asked the Lord many things, the understanding of the writing was revealed to me.[1] And this was written:


    “Your offspring, Hermas,[2] have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and interminglings of wickedness,[3] and thus their lawless deeds were filled up.


    But make these words known to all your children and to your wife, who is to be your sister;[4] for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.


    After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.[6]


    For the Master swore by his glory concerning his chosen ones: if, after this appointed day[2], sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.[9]


    Therefore you shall say to those who lead the church[10] that they should set their ways straight in righteousness, so that they may receive the promises in full, with much glory.


    Hold fast, then, you who work righteousness, and do not be double‑minded, so that your passage may be with the holy angels.[11] Blessed are you who endure the great tribulation that is coming, and who will not deny their life.[12]


    For the Lord swore by his Son[13] that those who denied their Lord are rejected from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion[b][a][14][13][12][11][10][9][6][4][3], he became merciful.”[14]'
  footnotes:
  - marker: '1'
    text: ‘Writing’ renders γραφή here as the particular document revealed to Hermas within the vision, not ‘Scripture’ in general.
    reason: cultural_note
  - marker: '2'
    text: Greek σπέρμα = ‘seed’/‘offspring,’ a collective term for one’s descendants.
    reason: lexical_alternative
  - marker: '3'
    text: The rare term συμφυρμός means ‘mixing/commingling’; here ‘interminglings of wickedness’ suggests entanglement or complicity in various evils.
    reason: lexical_alternative
  - marker: '4'
    text: ‘Your wife, who will be your sister’ reflects early Christian usage of sibling language for fellow believers within the household.
    reason: cultural_note
  - marker: '6'
    text: ‘Double‑mindedness’ (διψυχία) is a stock Hermas term for vacillation between God and evil; cf. Mandates.
    reason: cross_reference
  - marker: '9'
    text: ‘The nations’ (ἔθνη) can also be rendered ‘the Gentiles.’ The contrast is between insiders (‘holy ones/righteous’) and outsiders.
    reason: lexical_alternative
  - marker: '10'
    text: ‘Those who lead the church’ translates τοῖς προηγουμένοις τῆς ἐκκλησίας, literally ‘those who go before’—a standard term for leaders/presiders.
    reason: cultural_note
  - marker: '11'
    text: ‘Passage’ (πάροδος) evokes the transit through death or judgment; the imagery is intentionally left unflattened.
    reason: cultural_note
  - marker: '12'
    text: '‘Will not deny their life’ is ambiguous: it may mean not renouncing true life in God, or not denying even at the cost of their earthly lives.'
    reason: cultural_note
  - marker: '13'
    text: 'Oath formula: ‘swore by his Son,’ parallel to ‘by his glory’ above, underscores the solemnity of the declaration.'
    reason: cross_reference
  - marker: '14'
    text: ‘To be rejected from their life’ renders ἀπεγνωσθαι ἀπὸ τῆς ζωῆς, i.e., to be disowned/cast off from life (whether present or eternal).
    reason: lexical_alternative
  - marker: a
    text: Or 'those who have denied their Lord have been rejected from their life—those who are now about to deny'.
    reason: previous_rendering
  - marker: b
    text: Or 'remove from their heart the double‑mindedness'.
    reason: previous_rendering
translation:
  language: ko
  text: '열다섯 날이 지난 뒤, 내가 금식하며 주님께 많은 것을 구하였을 때, 그 글의 뜻이 나에게 드러났습니다.[1] 그리고 이렇게 기록되어 있었습니다.


    「너의 자손, 헤르마스여, 그들은 하나님을 버리고 주님을 모독하였으며, 큰 악 가운데서 그들의 부모를 배반하였습니다. 그리고 그들은 부모를 배신한 자들로 들렸고, 그들을 배반하고도 이익을 얻지 못한 채 오히려 자기들의 죄에 음란한 행위들과 악의 뒤섞임을 더하여, 그리하여 그들의 불법이 가득 찼습니다.[3]


    그러나 이 말들을 너의 모든 자녀와, 네게 있는 네 자매가 될 네 아내에게 알리십시오.[4] 그녀도 자기 혀를 절제하지 않는데, 그 혀로 악을 행하기 때문입니다. 그러나 그녀가 이 말들을 들으면 절제할 것이며, 긍휼을 얻을 것입니다.


    너는 그분이 너에게 드러나도록 내게 명령하신 이 말들을 그들에게 알려 준 뒤에는, 그들이 전에 지은 모든 죄가 그들에게서 사라지고, 또한 이 날까지 죄를 지은 모든 성도에게도 그러할 것입니다. 다만 그들이 마음을 다해 회개하고, 자기 마음에서 그들의 두 마음을 없애 버려야 합니다.[6]


    주인은 자기 영광을 두고 자기 택하신 이들을 향하여 맹세하셨습니다. 이 정해진 날 뒤에라도 죄가 여전히 일어난다면, 그들은 구원을 얻지 못할 것입니다. 의인에게는 회개의 끝이 있기 때문입니다. 성도 모두에게 회개의 날들은 끝났지만, 민족들에게는 마지막 날까지 회개가 있습니다.[9]


    그러므로 너는 회중을 이끄는 이들에게 그들의 길을 의 가운데서 바로잡으라고 말해야 합니다. 그래야 그들이 많은 영광과 함께 약속들을 온전히 받게 될 것입니다.[10]


    그러므로 의를 행하는 여러분은 굳게 버티고, 두 마음을 품지 마십시오. 그래야 여러분의 지나감이 거룩한 천사들과 함께하게 될 것입니다.[11] 다가오는 그 큰 환난을 견디며, 자기 생명을 부인하지 않는 여러분은 복이 있습니다.[12]


    주님께서 자기 아들을 두고 맹세하시기를, 자기들의 주님을 부인한 자들은 그들의 생명에서 거절당하였다고 하셨습니다—곧 지금 오는 날들에 그분을 부인하려는 바로 그 사람들입니다. 그러나 이전에 부인했던 이들에게는, 그분의 큰 긍휼로 말미암아, 그분이 자비로우신 분이 되셨습니다.”[14]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ γνῶσις τῆς γραφῆς
  english_pob_choice: the understanding of the writing
  chosen_korean: 그 글의 뜻
  alternatives_korean:
  - 그 기록의 이해
  - 그 글의 이해
  lexicon: BDAG; LSJ
  rationale: 여기서 γραφή는 보편적 ‘성경’이 아니라 환상 속에 제시된 특정 기록이므로, ‘그 글’로 옮겨 문맥의 대상을 분명히 했습니다.
- source_word: σπέρμα
  english_pob_choice: offspring
  chosen_korean: 자손
  alternatives_korean:
  - 후손
  - 씨
  lexicon: BDAG; LSJ
  rationale: 집합적 후손을 가리키는 말로, 한국어에서는 ‘자손’이 가장 자연스럽고 문맥의 집합성을 유지합니다.
- source_word: συμφυρμοὺς πονηρίας
  english_pob_choice: interminglings of wickedness
  chosen_korean: 악의 뒤섞임
  alternatives_korean:
  - 악의 혼합
  - 악의 뒤얽힘
  - 악의 섞임
  lexicon: LSJ; Lampe (Patristic)
  rationale: συμφυρμός의 ‘뒤섞임/혼합’ 이미지를 살리되, 문장이 과도하게 난해해지지 않도록 간결하게 옮겼습니다.
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  english_pob_choice: those who lead the church
  chosen_korean: 회중을 이끄는 이들
  alternatives_korean:
  - 교회를 이끄는 이들
  - 회중의 지도자들
  - 회중을 앞서가는 이들
  lexicon: BDAG; LSJ; Lampe (Patristic)
  rationale: ἐκκλησία를 이 문맥에서는 제도적 ‘교회’보다 모임으로서의 ‘회중’으로 보는 것이 더 직접적이며, προηγούμενοι의 ‘앞서는/이끄는’ 뜻을 한국어로 자연스럽게 살렸습니다.
theological_decisions:
- issue: μετὰ τὸ γνωρίσαι... ἀφίενται αὐτοῖς αἱ ἁμαρτίαι
  chosen_reading: 죄 사함을 단정형으로 약하게 바꾸지 않고, 조건이 성취되면 실제로 죄가 사라진다고 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 그들의 죄가 용서됩니다
  - 그들의 죄가 용서될 것입니다
  rationale: 문맥은 회개의 조건 아래 죄 사함을 선언하므로, 한국어에서도 약화하지 않고 선포적 진술로 유지했습니다.
  doctrine_reference: Translation Philosophy §Preserve source force
- issue: οὐκ ἀρνήσονται τὴν ζωὴν αὐτῶν
  chosen_reading: ‘자기 생명을 부인하지 않는’으로 옮겨, 생명의 대상이 현세 생명인지 하나님 안의 참 생명인지의 긴장을 보존했습니다.
  alternative_readings:
  - 자기 삶을 포기하지 않는
  - 주님을 부인하지 않는
  rationale: 바로 뒤에 ‘주님을 부인한 자들’이 나오지만, 여기의 표현은 그와 동일시되지 않으므로 의미를 열어 두는 것이 원문에 더 충실합니다.
  doctrine_reference: Translation Philosophy §Preserve theological tension
- issue: ὤμοσεν ... κατὰ τοῦ υἱοῦ αὐτοῦ
  chosen_reading: ‘자기 아들을 두고 맹세하시기를’로 직역하여, 충격적이지만 본문의 맹세 형식을 그대로 살렸습니다.
  alternative_readings:
  - 자기 아들을 증인으로 삼아
  - 자기 아들을 걸고
  rationale: 이 문장은 후대적 교리 정리로 완화하기보다, 본문이 의도한 엄숙성과 표현의 강도를 드러내는 것이 중요합니다.
  doctrine_reference: Doctrine.md §Contested terms
