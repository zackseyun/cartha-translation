translation:
  language: ko
  text: 그러나 나는, 회개의 천사로서 여러분에게 말합니다. 악마를 두려워하지 마십시오. 나는 온 마음으로 회개하는 여러분과 함께 있으려고 파견되었기 때문입니다 — 그가 말합니다 — 그리고 강해—[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος τῆς μετανοίας
  english_pob_choice: the angel of repentance
  chosen_korean: 회개의 천사
  alternatives_korean:
  - 회개를 맡은 천사
  - 회개의 사자
  lexicon: BDAG
  rationale: Hermas의 인물은 단순한 전달자가 아니라 회개자들을 돕는 천상 존재이므로, ‘천사’를 유지해 문맥의 천상적 성격을 살렸습니다.
- source_word: μὴ φοβήθητε
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: BDAG
  rationale: 금지 명령은 현대 표준어에서 가장 자연스러운 공손체로 옮기되, 경고와 격려의 어조를 유지했습니다.
- source_word: μετανοούντων ἐξ ὅλης καρδίας
  english_pob_choice: those who are repenting with all your heart
  chosen_korean: 온 마음으로 회개하는 여러분
  alternatives_korean:
  - 마음을 다해 회개하는 여러분
  - 온전히 마음을 다하여 회개하는 여러분
  lexicon: BDAG
  rationale: ἐξ ὅλης καρδίας의 히브리적 관용구를 ‘온 마음으로’로 살리고, 직접 호칭의 흐름에 맞게 ‘여러분’으로 처리했습니다.
- source_word: ἀπεστάλην
  english_pob_choice: I was sent
  chosen_korean: 파견되었기 때문입니다
  alternatives_korean:
  - 보내심을 받았기 때문입니다
  - 파송되었기 때문입니다
  lexicon: BDAG
  rationale: 수동 분사적 의미를 자연스러운 합쇼체로 풀어, 공식적 파견의 뉘앙스를 드러냈습니다.
- source_word: διάβολος
  english_pob_choice: the devil
  chosen_korean: 악마
  alternatives_korean:
  - 마귀
  - 사탄
  lexicon: BDAG
  rationale: 초기 기독교의 인격적 악한 존재를 가리키므로, 현대어에서 이해가 쉬운 ‘악마’를 택했습니다.
theological_decisions:
- issue: ‘회개의 천사’의 정체
  chosen_reading: 문자적 천사적 존재로 유지했습니다.
  alternative_readings:
  - 비유적 ‘회개의 정신’으로 완화
  - 단순한 ‘전령’으로 번역
  rationale: Hermas 내부의 천사론을 반영해야 하므로, 상징화하거나 일반화하지 않았습니다.
  doctrine_reference: Hermas의 angelology
- issue: μετανοέω 계열의 의미
  chosen_reading: ‘회개하다’로 번역했습니다.
  alternative_readings:
  - 생각을 바꾸다
  - 마음을 돌이키다
  rationale: 이 작품에서는 도덕적·영적 전환을 가리키므로, 제목과 본문이 이어지도록 ‘회개’ 용어를 유지했습니다.
  doctrine_reference: 회개 교리
