base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056.yaml
  text: 'Therefore[a], seeing them being scourged and harried like this, I was grieved for them, because they were being tormented in this way and had no respite at all. I said to the shepherd who was speaking with me, “Sir, who is this shepherd, so pitiless and harsh, showing no compassion at all for these sheep?” He said, “This is the angel of punishment; he is one of the righteous angels[b], appointed over punishment. Therefore he takes over those who have wandered away from God and have gone after the desires and deceits of this age, and he punishes them, as they deserve, with dreadful and various punishments.”


    “I wished, Sir,” I said, “to know what these various punishments are.” He said, “Listen. The various punishments and torments are torments of this present life: for some are punished with losses, some with deprivations, some with various sicknesses, some with every kind of disorder; some are insulted by the unworthy, and suffer in many other undertakings. For many, being unsettled in their plans, take on many projects, and nothing at all advances for them. They say of themselves that they do not prosper in their undertakings, and it does not rise up into their heart that they have done evil, but they blame the Lord.


    “When, then, they are pressed by every affliction, then they are handed over to me for good discipline, and they are strengthened in faith in the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me[i][h][g][f][e][d][c], and they no longer suffer any of the evils.”'
  footnotes:
  - marker: a
    text: The 'shepherd who was speaking with me' is the angelic guide figure in Hermas, often identified with the Shepherd/Angel of repentance.
    reason: cultural_note
  - marker: b
    text: '''Angel of punishment'' could also be rendered ''angel of retribution.'' The Greek τιμωρία denotes punitive justice.'
    reason: lexical_alternative
  - marker: c
    text: '''Torments of this present life'' clarifies that βιωτικαί refers to temporal, not eschatological, afflictions.'
    reason: cultural_note
  - marker: d
    text: '''Take on many projects'' could also be ''impose many burdens on themselves'' or ''attempt many things.'''
    reason: lexical_alternative
  - marker: e
    text: '''It does not rise upon their heart'' is a Semitic-style idiom for ''it does not occur to them'' or ''they do not realize.'''
    reason: lexical_alternative
  - marker: f
    text: '''Strengthened in faith in the Lord'' could also be taken as ''strengthened in the Lord’s faithfulness.'' The context favors faith directed toward the Lord.'
    reason: lexical_alternative
  - marker: g
    text: Or 'Seeing them being scourged'.
    reason: previous_rendering
  - marker: h
    text: Or 'He takes over those'.
    reason: previous_rendering
  - marker: i
    text: Or 'and they suffer many other such things'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 그들이 이렇게 채찍질당하고 괴로워하는 것을 보며, 나는 그들을 불쌍히 여겼습니다. 그들이 이런 식으로 고통받고 있었고, 조금도 쉬지 못했기 때문입니다. 나는 나와 함께 말하던 목자에게 말했습니다. 「주님, 이 양들에게 조금도 불쌍히 여김이 없는, 이렇게 냉혹하고 쓰라린 이 목자는 누구입니까?」 그가 말했습니다. 「이 사람은 벌의 천사입니다. 그는 의로운 천사들 가운데 하나이며, 벌을 맡도록 정해진 사람입니다. 그러므로 그는 하나님에게서 벗어나 이 시대의 욕망과 속임수를 따라간 이들을 맡아, 그들이 마땅히 받아야 할 대로 무섭고도 여러 가지 벌로 그들을 벌합니다.


    「제가, 주님, 이 여러 가지 벌이 무엇인지 알고 싶습니다」라고 하자, 그가 말했습니다. 「들으십시오. 여러 가지 벌과 고통은 이 현재 삶의 고통들입니다. 어떤 이들은 손실로 벌을 받고, 어떤 이들은 박탈로, 어떤 이들은 여러 가지 병으로, 어떤 이들은 온갖 혼란으로 벌을 받습니다. 어떤 이들은 보잘것없는 자들에게 모욕을 당하고, 또 다른 많은 일들에서도 고통을 겪습니다. 많은 사람은 자기 계획이 흔들려 많은 일을 벌이지만, 그들에게는 아무것도 전혀 진척되지 않습니다. 그들은 자기 일들이 잘되지 않는다고 말하면서도, 자기들이 악을 행했다는 생각은 마음에 떠오르지 않고, 오히려 주님을 탓합니다.


    「그러나 그들이 온갖 환난으로 압박을 받을 때, 그때 그들은 좋은 훈련을 받도록 내게 넘겨지고, 주님 안의 믿음이 강해집니다. 그리고 삶의 남은 날들을 깨끗한 마음으로 주님을 섬기며 보냅니다. 또 그들이 회개하면, 그들이 행했던 악한 일들이 그들의 마음에 떠오르고, 그때 그들은 하나님을 찬양하면서, 그분이 의로운 심판자이시며 각 사람이 자기 행위에 따라 정당하게 고난을 받았다고 말합니다. 그 뒤에는 깨끗한 마음으로 주님을 섬기며, 자기들이 하는 모든 일에서 형통하고, 주님에게서 무엇이든지 구하는 것을 받습니다. 그러면 그들은 다시 주님을 찬양합니다. 자기들이 내게 넘겨졌기 때문이며, 더는 어떤 악도 겪지 않기 때문입니다.」[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαστιγούμενα καὶ ταλαιπωρούμενα
  english_pob_choice: scourged and harried / afflicted
  chosen_korean: 채찍질당하고 괴로워하는
  alternatives_korean:
  - 매질당하고 학대받는
  - 채찍질당하고 고통받는
  lexicon: LSJ; BDAG
  rationale: μαστιγούμενα의 강한 체벌 이미지를 살리고, ταλαιπωρούμενα는 단순한 ‘고통’보다 지속적으로 시달리는 뉘앙스를 살려 ‘괴로워하는’으로 옮겼습니다.
- source_word: Κύριε (to the shepherd-guide)
  english_pob_choice: Sir
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 어르신
  lexicon: BDAG
  rationale: 본문의 화자가 영적 안내자에게 경의를 표하는 호칭이라, 한국어에서는 자연스러운 존칭인 ‘주님’을 택했습니다. 다만 본문 속 대화 상대가 하나님은 아니므로, 독자가 혼동하지 않도록 문맥 전체를 목자-안내자 대화로 유지했습니다.
- source_word: ἄγγελος τῆς τιμωρίας
  english_pob_choice: angel of punishment
  chosen_korean: 벌의 천사
  alternatives_korean:
  - 징벌의 천사
  - 보복의 천사
  lexicon: LSJ
  rationale: τιμωρία의 기본 의미인 형벌/징벌을 반영하면서, 전통적 교회 용어로 완화하지 않고 직접적으로 ‘벌’로 옮겼습니다.
- source_word: ἐκ δὲ τῶν ἀγγέλων τῶν δικαίων
  english_pob_choice: one of the righteous angels
  chosen_korean: 의로운 천사들 가운데 하나
  alternatives_korean:
  - 의로운 천사들 중 하나
  - 의로운 천사들에 속한 하나
  lexicon: BDAG
  rationale: ἐκ + 속격 복수는 ‘~가운데 하나’로 자연스럽게 옮길 수 있으며, δικαίος는 이 문맥에서 도덕적으로 올바른 천사들을 가리키므로 ‘의로운’이 적절합니다.
- source_word: ἀποπλανηθέντας ... καὶ πορευθέντας ταῖς ἐπιθυμίαις καὶ ἀπάταις τοῦ αἰῶνος τούτου
  english_pob_choice: those who have wandered away from God ... the desires and deceits of this age
  chosen_korean: 하나님에게서 벗어나 이 시대의 욕망과 속임수를 따라간 이들
  alternatives_korean:
  - 하나님에게서 떠나 ... 이 시대의 욕망과 속임수에 따라간 이들
  - 길을 잃고 ... 이 세대의 욕망과 속임수로 간 이들
  lexicon: BDAG
  rationale: 목자-양 이미지에 맞춰 ἀποπλανηθέντας의 ‘길을 잃다/벗어나다’ 의미를 살리되, 단순한 방향 상실보다 하나님으로부터의 이탈을 분명히 했습니다.
- source_word: ζημίαις, ὑστερήσεσιν, ἀσθενείαις, ἀκαταστασίᾳ
  english_pob_choice: losses, deprivations, sicknesses, disorder
  chosen_korean: 손실로, 박탈로, 여러 가지 병으로, 온갖 혼란으로
  alternatives_korean:
  - 손해로, 결핍으로, 병약함으로, 불안정으로
  - 손실, 결핍, 질병, 무질서
  lexicon: BDAG
  rationale: 열거된 고난의 유형을 한국어로 구체화하되, βιωτικαί βάσανοι라는 현재 삶의 징계를 훼손하지 않도록 평이하고 분명하게 옮겼습니다.
- source_word: ἐπιβάλλονται πολλά
  english_pob_choice: take on many projects
  chosen_korean: 많은 일을 벌이지만
  alternatives_korean:
  - 많은 일을 떠안지만
  - 많은 계획을 세우지만
  lexicon: LSJ; BDAG
  rationale: πράξις의 ‘행위/일/시도’ 의미를 살려, 단순한 ‘프로젝트’보다 자연스러운 한국어로 ‘일을 벌이다’의 감각을 반영했습니다.
- source_word: οὐκ ἀναβαίνει ἐπὶ τὴν καρδίαν
  english_pob_choice: does not rise up into their heart
  chosen_korean: 마음에 떠오르지 않습니다
  alternatives_korean:
  - 마음에 올라오지 않습니다
  - 생각나지 않습니다
  lexicon: BDAG
  rationale: 직역투의 심장-상승 은유는 한국어에서 자연스럽지 않으므로, 의미를 살린 관용 표현으로 옮겼습니다.
- source_word: παραδίδονται ... εἰς ἀγαθὴν παιδείαν
  english_pob_choice: handed over ... for good discipline
  chosen_korean: 좋은 훈련을 받도록 내게 넘겨지고
  alternatives_korean:
  - 좋은 훈육을 위해 내게 맡겨지고
  - 유익한 징계를 받도록 내게 넘겨지고
  lexicon: BDAG
  rationale: παιδεία의 핵심은 단순 처벌보다 교정적 훈련이므로 ‘훈련’으로 옮기되, 수동적 인계의 뉘앙스를 ‘내게 넘겨지고’로 살렸습니다.
- source_word: ἰσχυροποιοῦνται ἐν τῇ πίστει τοῦ Κυρίου
  english_pob_choice: are strengthened in faith in the Lord
  chosen_korean: 주님 안의 믿음이 강해집니다
  alternatives_korean:
  - 주님에 대한 믿음이 강해집니다
  - 주님 안에서 믿음이 굳세어집니다
  lexicon: BDAG
  rationale: 문맥상 믿음의 대상은 주님이며, 한국어에서는 ‘주님 안의 믿음’이 다소 더 자연스럽게 그 방향성을 드러냅니다.
- source_word: δοξάζουσι τὸν Θεόν
  english_pob_choice: they glorify God
  chosen_korean: 하나님을 찬양하면서
  alternatives_korean:
  - 하나님께 영광을 돌리면서
  - 하나님을 영화롭게 하면서
  lexicon: BDAG
  rationale: δόξαζω는 ‘영광을 돌리다’도 가능하지만, 회개와 인정의 응답으로서의 예배적 반응을 한국어로는 ‘찬양하다’가 더 자연스럽게 전달합니다.
theological_decisions:
- issue: Κύριε를 목자에게 부르는 호칭의 번역
  chosen_reading: 본문의 Κύριε는 하나님/그리스도 호칭이 아니라 안내자에게 대한 존칭으로 이해해 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 선생님
  - 주여
  rationale: 여기서는 화자가 천사적 목자와 대화하므로 신적 호칭으로 번역하면 오해가 생길 수 있습니다. 한국어의 실제 대화 관용과 경외의 정도를 함께 고려했습니다.
  doctrine_reference: 문맥적 호칭 구별; 천사적 안내자와 하나님 호칭의 혼동 방지
- issue: βιωτικαί βάσανοι의 성격
  chosen_reading: 현재 삶에서 겪는 교정적 고난으로 이해해, 이생의 징계와 훈련이라는 방향을 살렸습니다.
  alternative_readings:
  - 종말론적 형벌
  - 단순한 세상 고난
  rationale: 본문이 손실, 박탈, 병, 혼란 등 구체적 현세 고난을 열거하고 회개와 순종으로 이끄는 점을 고려하면, 징벌이면서도 교정적인 성격이 분명합니다.
  doctrine_reference: 회개로 이끄는 현세적 징계; 교정적 형벌 개념
- issue: ἡ πίστις τοῦ Κυρίου의 이해
  chosen_reading: 대상격으로 읽어 ‘주님에 대한 믿음’의 방향을 유지했습니다.
  alternative_readings:
  - 주님의 신실하심
  - 주님의 믿음
  rationale: 문맥은 그들이 주님을 섬기며 강해진다는 흐름이므로, 믿음의 주체보다 믿음의 대상이 강조된다고 보았습니다.
  doctrine_reference: 믿음의 대상은 주님; 문맥상 목적격 해석
