base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030.yaml
  text: 'I asked him again[1], saying, "Since the Lord has counted me worthy that you should dwell with me always, bear with a few more words from me, since I understand nothing, and my heart has been hardened by my former deeds. Give me understanding, for I am very foolish and altogether perceive nothing."


    Answering me, he says, "I," he says, "am over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did comes up upon his heart, and he repents and no longer works the evil, but works the good lavishly[2], and he humbles his own soul and chastises it, because he sinned. You see then that repentance is great understanding."


    "For this reason then," I say, "sir, I seek to learn everything exactly from you: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."


    "You will live," he says, "if you keep my commandments and walk in them; and whoever, having heard these commandments, keeps them[6][5][4][3], will live to God."'
  footnotes:
  - marker: '1'
    text: “I am over repentance” can also be rendered “I preside over repentance.” Elsewhere in Mandate 4 the figure is identified as the angel associated with repentance.
    reason: lexical_alternative
  - marker: '2'
    text: Literally “goes up upon his heart,” an idiom for a deed coming forcibly to mind or weighing on one’s conscience.
    reason: cultural_note
  - marker: '3'
    text: Some witnesses omit “the man.” The sense is “the one who has sinned.”
    reason: textual_variant
  - marker: '4'
    text: “Lavishly” translates πολυτελῶς; alternatives include “abundantly” or “generously.” The term’s core sense is “in costly/splendid fashion.”
    reason: lexical_alternative
  - marker: '5'
    text: Vocative κύριε addressed to the messenger is rendered “sir” here to distinguish from “the Lord” (God) mentioned earlier in the sentence.
    reason: lexical_alternative
  - marker: '6'
    text: “Will live to God” preserves the Greek dative; many would say “live for God.”
    reason: lexical_alternative
translation:
  language: ko
  text: '나는 다시 그에게 물으며 말했습니다. 「주님께서 당신이 늘 내 곁에 함께 머물도록 나를 합당하다고 여기셨으니, 내 말을 조금만 더 참아 주십시오. 저는 아무것도 이해하지 못하고, 제 마음은 이전의 행실 때문에 굳어 버렸습니다. 제게 깨달음을 주십시오. 저는 매우 어리석고, 전혀 아무것도 알지 못합니다.」


    그가 내게 대답하며 말했습니다. 「나는 회개에 대해 맡은 자이며, 회개하는 모든 사람에게 이해를 줍니다. 아니, 이것 자체—회개하는 것—이 이해라고 당신에게는 보이지 않습니까? 회개하는 것은 큰 이해입니다. 죄를 지은 사람은 자기가 주님 앞에서 악한 일을 했음을 깨닫고, 그가 행한 일이 그의 마음 위로 올라오며, 회개하고 더 이상 악을 행하지 않고 오히려 선을 풍성히 행하며, 자기 영혼을 낮추고 그것을 징계합니다. 자기가 죄를 지었기 때문입니다. 그러므로 회개는 큰 이해임을 당신은 보게 됩니다.」


    그때 내가 말했습니다. 「그러니 주님, 저는 당신에게서 모든 것을 정확히 배우고자 합니다. 첫째로 저는 죄인이기 때문이고, 둘째로 어떤 행위를 하여 제가 살게 될지 알지 못하기 때문입니다. 제 죄는 많고도 여러 가지이기 때문입니다.」


    그가 말했습니다. 「당신은 살 것입니다. 당신이 내 계명들을 지키고 그 안에서 걸어가면 말입니다. 그리고 이 계명들을 듣고 그것들을 지키는 사람은 누구나 하나님께 살 것입니다.」[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῆς μετανοίας
  english_pob_choice: am over repentance
  chosen_korean: 회개에 대해 맡은 자
  alternatives_korean:
  - 회개 위에 있다
  - 회개를 관장한다
  - 회개를 맡고 있다
  lexicon: LSJ
  rationale: ἐπί with the genitive can indicate oversight or authority; ‘맡은 자’ preserves the office/supervision sense without adding 해석적으로 ‘천사’라는 말을 본문에 삽입하지 않습니다.
- source_word: σύνεσις / συνέτισόν / συνίω
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 깨달음
  - 분별
  - 지각
  lexicon: BDAG
  rationale: 본문이 ‘이해를 줍니다—회개는 큰 이해입니다’로 같은 어휘군을 반복하므로, 한국어도 ‘이해’로 일관시켜 내부 연결을 살렸습니다.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν
  english_pob_choice: comes up upon his heart
  chosen_korean: 그의 마음 위로 올라오며
  alternatives_korean:
  - 마음에 떠오르며
  - 마음에 올라오며
  - 양심에 걸리며
  lexicon: LSJ
  rationale: 직역에 가까운 표현을 택해 관용구의 강한 이미지와 본문 주석상 설명 가능성을 유지했습니다.
- source_word: πολυτελῶς
  english_pob_choice: lavishly
  chosen_korean: 풍성히
  alternatives_korean:
  - 후하게
  - 넉넉히
  - 호화롭게
  lexicon: LSJ
  rationale: ‘풍성히’는 행위의 넉넉함과 적극성을 살리면서도, ‘호화롭게’처럼 과도한 미감 중심 의미로 흐르지 않게 합니다.
- source_word: ζήσεται τῷ Θεῷ
  english_pob_choice: will live to God
  chosen_korean: 하나님께 살 것입니다
  alternatives_korean:
  - 하나님을 위해 살 것입니다
  - 하나님과 함께 살 것입니다
  - 하나님께로 살 것입니다
  lexicon: BDAG
  rationale: 여격의 방향성을 살리면서 한국어에서는 가장 자연스러운 ‘~께 살다’로 옮겼습니다.
theological_decisions:
- issue: κύριος를 주님/주(主)로 구분하는 방식
  chosen_reading: 앞의 ὁ Κύριος는 ‘주님’으로, 이어지는 대화 상대의 호격 κύριε는 존칭 대화체로 ‘주님’보다 직접적인 호칭을 피하면서 문맥상 존대 표현으로 처리했습니다.
  alternative_readings:
  - 모두 ‘주님’으로 통일
  - 호격을 ‘선생님’으로 번역
  rationale: 본문은 하나님을 가리키는 ‘주님’과 대화 상대에 대한 경칭을 구분할 필요가 있으므로, 한국어에서는 문맥적 구분을 통해 혼동을 줄였습니다.
  doctrine_reference: Translation philosophy §4 (문맥에 따른 일관성과 구분)
- issue: ‘회개는 큰 이해입니다’의 문장 구조
  chosen_reading: 회개 자체를 이해로 규정하는 원문 논리를 그대로 살려, 회개를 단순 감정 변화가 아니라 인식과 행위 전환을 포함하는 영적 분별로 옮겼습니다.
  alternative_readings:
  - 회개는 큰 지혜입니다
  - 회개는 큰 깨달음입니다
  rationale: 본문은 회개가 죄의 인식, 악행 중단, 선행, 자기 낮춤과 징계를 포함한다고 설명하므로, ‘이해’가 반복 어휘와 논증을 가장 잘 연결합니다.
  doctrine_reference: What matters most §2 (source-primacy and lexical coherence)
