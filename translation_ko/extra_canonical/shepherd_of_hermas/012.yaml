base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012.yaml
  text: 'Answering[1], I say to her, "Lady, this matter is great and marvelous. And the six young men who are building—who are they, Lady?"


    "These are the holy angels of God, the first-created,[1] to whom the Lord entrusted all his creation—to make it grow and to build it up and to rule over all creation. By these, therefore, the building of the tower[5] will be brought to completion.[4]"


    2[2]. "And the others who are carrying the stones—who are they?"


    "They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."


    3. I asked her, saying, "Lady, I wished to know the outcome[2] of the stones and their power—what sort it is."


    Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded[3]—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather[5][4][3], all are strong and sure and well-founded."'
  footnotes:
  - marker: '1'
    text: '''First-created'' translates οἱ πρῶτοι κτισθέντες. Alternatives include ''first in rank'' or ''first appointed'', but the Greek participle naturally means ''created''.'
    reason: lexical_alternative
  - marker: '2'
    text: The word rendered 'origin' is ἔξοδος, which can mean 'coming forth' or 'issue'; in context it refers to the stones' emergence and provenance.
    reason: lexical_alternative
  - marker: '3'
    text: '''Double-minded'' (διψύχος) appears in early Christian moral vocabulary; compare James 1:8; 4:8 for similar usage.'
    reason: cross_reference
  - marker: '4'
    text: Two related verbs are used for 'be brought to completion' in this section (τελεσθήσεται and συντελεσθήσεται), both conveying consummation of the work.
    reason: lexical_alternative
  - marker: '5'
    text: Within Hermas, the tower is the central symbol for the people of God being built; see Vision 3 overall for the imagery's development.
    reason: cross_reference
translation:
  language: ko
  text: '대답하면서 나는 그 여자에게 말했습니다. 「부인, 이 일은 매우 크고 놀랍습니다. 그리고 짓고 있는 저 여섯 젊은이는 누구입니까, 부인?」


    「이들은 하나님의 거룩한 천사들로서, 처음에 지음 받은 자들입니다.[a] 주께서 그분의 모든 창조물을 그들에게 맡기셔서 그것을 자라게 하고, 세우고, 온 창조물을 다스리게 하셨습니다. 그러므로 이들을 통해 그 탑의 건축이 마침내 완성될 것입니다.[b]」


    2. 「그런데 다른 이들, 곧 돌들을 나르는 자들은 누구입니까?」


    「그들도 하나님의 거룩한 천사들입니다. 그러나 이 여섯은 그들보다 더 높습니다. 그러므로 그 탑의 건축은 마침내 완성될 것이고, 모두가 함께 탑 주위에서 기뻐하며 하나님께 영광을 돌릴 것입니다. 그 탑의 건축이 완성되었기 때문입니다.」


    3. 나는 그 여자에게 물으며 말했습니다. 「부인, 저는 돌들의 나옴과 그 힘이 어떤 것인지 알고 싶었습니다.[c]」


    그녀가 나에게 대답합니다. 「그것이 당신이 모든 사람보다 더 가치 있어서 계시된 것은 아닙니다. 당신보다 앞선 이들과 당신보다 더 나은 이들이 있는데, 그들에게 이 환상들이 계시되는 것이 마땅했습니다. 그러나 하나님의 이름이 영광을 받게 하려고, 그것이 당신에게 계시되었고 또 계시될 것입니다. 그것은 두 마음을 품은 사람들,[d] 곧 이런 것들이 참인지 아닌지 자기 마음속에서 생각하는 사람들을 위한 것입니다. 그들에게 이것들이 모두 참되다고 말하십시오. 그리고 진리 밖에는 아무것도 없습니다. 오히려 모든 것은 강하고 확실하며 잘 기초가 놓여 있습니다.」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  english_pob_choice: Lady
  chosen_korean: 부인
  alternatives_korean:
  - 여사님
  - 아씨
  lexicon: LSJ; BDAG
  rationale: 여성 인물에 대한 정중한 호칭을 현대 한국어 합쇼체로 자연스럽게 옮기되, 소유·지배 뉘앙스는 피했습니다.
- source_word: οἱ πρῶτοι κτισθέντες
  english_pob_choice: the first-created
  chosen_korean: 처음에 지음 받은 자들
  alternatives_korean:
  - 첫째로 지음 받은 자들
  - 가장 먼저 창조된 자들
  lexicon: BDAG; LSJ
  rationale: κτισθέντες의 피조됨을 유지하면서 순서의 선행성을 드러내기 위해 직역에 가깝게 옮겼습니다.
- source_word: αὔξειν καὶ οἰκοδομεῖν
  english_pob_choice: to make it grow and to build it up
  chosen_korean: 그것을 자라게 하고, 세우고
  alternatives_korean:
  - 그것을 증가시키고 세우고
  - 그것을 자라게 하고 건축하고
  lexicon: BDAG
  rationale: αὔξειν의 성장/증가와 οἰκοδομεῖν의 건축 이미지를 살리면서 한국어에서는 자연스럽게 ‘자라게 하고, 세우고’로 풀었습니다.
- source_word: ἔξοδος
  english_pob_choice: outcome
  chosen_korean: 나옴
  alternatives_korean:
  - 출현
  - 나가는 일
  lexicon: LSJ; Lampe
  rationale: 이 문맥에서는 돌들의 출처와 등장 양상을 가리키므로, POB 각주가 설명하듯 ‘origin’보다 더 직접적인 ‘나옴’이 원뜻에 가깝습니다.
- source_word: διψύχους
  english_pob_choice: double-minded
  chosen_korean: 두 마음을 품은 사람들
  alternatives_korean:
  - 우유부단한 사람들
  - 두 마음의 사람들
  lexicon: BDAG
  rationale: 야고보서 계열의 초기 그리스도교 도덕 용어를 한국어 관용구로 옮겨 내적 분열을 분명히 했습니다.
theological_decisions:
- issue: οἱ πρῶτοι κτισθέντες의 천사론적 지위
  chosen_reading: ‘처음에 지음 받은 자들’로 직역하여, 천사들 가운데 창조상의 선행성을 드러냈습니다.
  alternative_readings:
  - ‘첫째 계급의 자들’
  - ‘처음 임명된 자들’
  rationale: μορφολογικά κτισθέντες는 ‘지음 받은’이 가장 자연스러우며, 본문의 천사 계층 이해를 임의로 재구성하지 않도록 했습니다.
  doctrine_reference: POB contested terms / early Christian angelology
- issue: 두 마음을 품은 사람들(διψύχους)의 표상
  chosen_reading: 내적 분열과 의심을 가리키는 초기 교회적 도덕 범주로 유지했습니다.
  alternative_readings:
  - ‘흔들리는 사람들’
  - ‘양쪽 마음을 가진 사람들’
  rationale: 본문은 환상의 진위를 두고 마음속에서 따지는 자들을 지칭하므로, 단순 심리 상태보다 도덕·영적 분열의 뉘앙스가 살아 있어야 합니다.
  doctrine_reference: James 1:8; 4:8 parallels
