    issue: ‘멀리 쫓겨나는’ 및 ‘멸망을 받아’
    rationale: 원문은 망대에서 ‘멀리 내던져진’ 상태를 말하며, ‘멸망’이라는 별도 내용을 말하지 않습니다.
  - severity: medium
    issue: ‘외식을 믿고’
    rationale: ἐν ὑποκρίσει는 믿음의 방식, 곧 위선적으로 믿었다는 뜻입니다. ‘외식’을 믿음의 대상으로 오해하게 할 수 있습니다.
  - severity: medium
