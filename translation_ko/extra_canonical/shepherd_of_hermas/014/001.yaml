  source_fidelity: 원문의 핵심 비유와 인과관계는 대체로 반영되었으나, κατακοπτομένους(산산이 찍히거나 잘려 나감)를 단순히 ‘찍혀’로 처리하고, ῥιπτομένους(내던져짐)를 ‘쫓겨나는’으로 옮긴 점은 부정확합니다. 또한 ‘외식을 믿고’는 ἐπίστευσαν δὲ ἐν ὑποκρίσει(위선적으로 믿었다)를 자연스럽고 정확하게 전달하지 못하며, 원문에 없는 ‘멸망을 받아’를 추가했습니다.
  naturalness: 초안은 고전 성경체 종결(‘-느니라’, ‘인하여’)과 문장부호 부재로 현대 표준어 합쇼체 요구에 맞지 않습니다. 의미 단위를 나누고 현대적인 격식체로 다듬는 것이 필요합니다.
  terminology: ‘망대’, ‘불법’, ‘구원’, ‘주님’, ‘건축’은 문맥상 유지할 수 있습니다. 다만 οἱ υἱοὶ τῆς ἀνομίας는 ‘불법의 아들들’보다 현대 한국어에서 자연스러운 ‘불법의 자녀들’로 옮겼습니다.
  issues:
