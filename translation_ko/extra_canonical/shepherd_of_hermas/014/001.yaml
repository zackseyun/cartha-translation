revisions:
- from: “찍혀 망대에서 멀리 쫓겨나는 자들에 대하여 네가 알고자 하느냐 이들은 불법의 아들들이요 외식을 믿고 불법이 자기들에게서 떠나지 아니하므로 구원을 얻지 못함은 그 악한 행위로 말미암아 건축에 합당하지 못함이라 그들이 주님의 진노를 인하여 멸망을 받아 멀리 쫓겨났느니라.
  to: “망대에서 산산이 찍혀 멀리 내던져지는 이들이 누구인지 알고 싶으십니까? 이들은 불법의 자녀들입니다. 그들은 위선적으로 믿었고, 모든 악이 그들에게서 떠나지 않았습니다. 그러므로 그들의 악행 때문에 건축에 쓸모가 없어서 구원이 없습니다. 그래서 그들은 주님의 진노로 산산이 찍혀 멀리 내던져졌습니다. 이는 그들이 주님을 진노하게 했기 때문입니다.”
  rationale: 수동 동사들의 물리적 비유(‘산산이 찍혀’, ‘내던져져’)를 보존하고, ‘위선적으로 믿었다’로 원문의 부사구를 명확히 반영했습니다. 원문에 없는 ‘멸망’을 삭제했으며, 현대 표준어 합쇼체와 완결된 인용문 형식으로 정리했습니다.
