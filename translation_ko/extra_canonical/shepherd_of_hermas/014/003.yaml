revisions:
- from: 3. 갈라진 자들은 누구니 이는 마음에 서로 원망을 품고 서로 화평하지 아니하고 얼굴은 화평한 자이나 떠나갈 때에는 그 악이 마음에 그대로 남아 있는 자니 이것이 곧 돌의 갈라진 틈이니라
  to: 3. 갈라진 틈이 있는 돌들은 누구입니까? 이들은 마음속으로 서로에게 악의를 품고 서로 평화롭게 지내지 않으면서도, 겉으로는 평화로운 모습을 하는 사람들입니다. 그러나 서로 헤어지고 나면 그들의 악의가 마음속에 남아 있습니다. 이것들이 그 돌들이 지닌 갈라진 틈입니다.
  rationale: 원문의 돌 비유와 수사적 질문을 보존하고, 내면의 상호 적대와 외적 평화의 가장이라는 대조를 자연스러운 현대 한국어 합쇼체로 옮겼습니다. ‘악의’는 복수형 ‘악들/악한 것들’이 이 문맥에서 가리키는 지속되는 악한 적의를 간결하게 반영합니다.
