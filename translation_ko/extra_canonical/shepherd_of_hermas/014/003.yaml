  text: 3. 갈라진 자들은 누구니 이는 마음에 서로 원망을 품고 서로 화평하지 아니하고 얼굴은 화평한 자이나 떠나갈 때에는 그 악이 마음에 그대로 남아 있는 자니 이것이 곧 돌의 갈라진 틈이니라
