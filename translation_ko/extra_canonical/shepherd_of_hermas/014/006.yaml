  source_fidelity: 초안은 재물이 제거된 뒤 하나님/주님께 유익하게 된다는 핵심 비유를 대체로 반영합니다. 그러나 ψυχαγωγῶν αὐτούς를 ‘저희를’로 옮겨 지시 대상이 화자 쪽으로 바뀌었고, ‘재물이 벗겨지면’은 περικοπῇ(잘려 나가다)를 충분히 반영하지 못합니다. 또한 돌이 ‘스스로 떨어져 나간다’는 표현은 돌이 잘린 뒤 자기 일부를 버린다는 원문의 구조를 흐립니다.
  naturalness: 현대 표준 한국어 합쇼체에 맞추어 인용문의 종결을 일관되게 다듬고, ‘그 건물’은 문맥상 건축 과정/구조물을 가리키므로 ‘건축에 쓸모 있게’로 자연스럽게 옮겼습니다.
  terminology: κύρια는 문맥상 호칭인 ‘부인’으로 유지했습니다. εὔχρηστοι는 ‘유익’보다 기능적 의미가 분명한 ‘쓸모 있다’로, οἰκοδομή는 ‘건축’으로 옮겼습니다. ‘하나님’과 ‘주님’의 구별은 각각 Θεῷ와 Κυρίῳ를 따라 유지했습니다.
