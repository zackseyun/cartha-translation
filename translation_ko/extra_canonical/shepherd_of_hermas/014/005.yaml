  source_fidelity: 원문의 화자는 여성(ἀποκριθεῖσά)인데 초안은 ‘그가’로 옮겨 성별이 맞지 않습니다. 또한 ‘묻고’(ἐπερωτᾷς)를 ‘구하고’로 옮긴 것은 의미가 다르며, ‘희고 둥근 것들’은 문맥상 건축에 쓰이는 돌들을 가리키므로 이를 밝혀야 합니다.
  naturalness: 초안은 ‘이르되’, ‘자들이요’, ‘자니라’가 혼재하여 요청된 현대 표준어 합쇼체와 맞지 않습니다. 인용문과 서술을 현대적인 합쇼체로 일관되게 고쳤습니다.
  terminology: κύρια는 현대 한국어에서 ‘아가씨’보다 ‘부인’이 적절합니다. πραγματεῖαι는 단순한 ‘장사’보다 ‘사업 활동’으로 옮겨 재산과 함께 주님을 부인하게 하는 세속적 거래·활동이라는 뜻을 보존했습니다.
