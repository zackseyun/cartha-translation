revisions:
- from: 5. “그리고 건물에 맞지 않는 희고 둥근 것들은 누구입니까, 아가씨?” 그가 내게 대답하여 이르되 너희가 언제까지 어리석고 깨닫지 못하며 모든 것을 구하고 아무것도 깨닫지 못하겠느냐 이 사람들은 믿음이 있으면서도 이 세대의 부를 누리는 자들이요 환난이 올 때에는 자기의 재물과 장사로 말미암아 자기 주를 부인하는 자니라
  to: 5. “그리고 건축에 맞지 않는 희고 둥근 돌들은 누구입니까, 부인?” 그 여자가 내게 대답하여 말씀하셨습니다. “언제까지 어리석고 깨닫지 못하겠습니까? 모든 것을 물으면서도 아무것도 깨닫지 못하는군요. 이들은 믿음은 있으나 이 세대의 부도 가진 사람들입니다. 환난이 닥치면, 자기들의 재물과 사업 활동 때문에 자기들의 주님을 부인합니다.”
  rationale: 여성 화자, ‘묻다’의 의미, 돌이라는 비유의 대상을 바로잡고, 전체를 현대 표준어 합쇼체로 통일했습니다. ‘이 세대’와 ‘자기들의 주님’이라는 원문의 표현을 유지했으며, 본문에 필요한 주석은 없습니다.
