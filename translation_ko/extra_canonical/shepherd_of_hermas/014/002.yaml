  naturalness: 초안의 ‘들어가지 아니하는’, ‘거하지 아니하며’, ‘무익한 자들이라’는 현대 표준어 합쇼체와 거리가 있습니다. 문장을 현대적인 존대 종결로 다듬고 병렬 구조를 명료하게 해야 합니다.
  terminology: ἀλήθεια는 ‘진리’, ἅγιοι는 문맥상 ‘성도들’로 옮길 수 있습니다. ἐψωριακότες는 문자적으로 옴/피부병에 걸린 이들을 가리키는 비유이므로 ‘옴에 걸린 이들’로 유지합니다. ἄχρηστοι는 건축 비유 안에서 ‘쓸모없습니다’가 자연스럽습니다.
