  to: 2. “또 네가 본 다른 이들, 곧 많이 누워 있으면서 건축물 안으로 들어가지 않는 이들은 옴에 걸린 이들입니다. 이들은 진리를 알았으나 그 안에 머물지 않았고 성도들에게 굳게 붙어 있지도 않았습니다. 그러므로 쓸모없습니다.”
  rationale: 원문의 비유적 표현과 논리적 순서(진리를 앎—그 안에 머물지 않음—성도들에게 붙어 있지 않음—쓸모없음)를 유지하면서, 현대 표준어 합쇼체로 고쳤습니다. ‘옴에 걸린 이들’은 원문의 난해하고 불쾌할 수 있는 피부병 비유를 완화하거나 해석적으로 바꾸지 않고 보존합니다.
