  language: ko
  text: 2. “또 네가 본 다른 이들, 곧 많이 누워 있으면서 건축물 안으로 들어가지 않는 이들은 옴에 걸린 이들입니다. 이들은 진리를 알았으나 그 안에 머물지 않았고 성도들에게 굳게 붙어 있지도 않았습니다. 그러므로 쓸모없습니다.”
