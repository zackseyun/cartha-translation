    rationale: 원문은 ‘쓸모 있는’ 것과 ‘생명에 유익한’ 것을 병렬합니다.
  - severity: medium
    issue: ‘쓰임 받았음이니라’가 χρᾶσαι의 현재적 의미를 완료된 과거로 바꿉니다.
    rationale: 여기서는 같은 돌들 가운데서 현재 쓰임을 받고 있다는 진술로 옮기는 것이 원문에 더 가깝습니다.
