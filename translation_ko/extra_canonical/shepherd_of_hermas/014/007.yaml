  to: 7. “그대 자신에게서 먼저 배우십시오. 그대가 부유했을 때에는 쓸모없었지만, 이제는 쓸모가 있고 생명에 유익합니다. 하나님께 쓸모 있는 사람이 되십시오. 그대 자신도 바로 그 돌들로 쓰임을 받고 있기 때문입니다.”
  rationale: 원문의 대조 구조(부유할 때의 무용함/현재의 유용함), ‘생명에 유익함’, 하나님께 유용해지라는 권면, 그리고 마지막 현재 진술을 보존했습니다. 현대 표준어 합쇼체에 맞추어 어휘와 문장부호를 정비했습니다.
