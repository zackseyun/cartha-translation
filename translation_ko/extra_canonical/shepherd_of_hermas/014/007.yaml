review_pass:
  verdict: revise
  source_fidelity: 초안은 부유함과 쓸모없음, 그리고 하나님께 쓸모 있는 사람이 되라는 핵심 뜻을 대체로 반영합니다. 그러나 현재의 χρᾶσαι(‘쓰임을 받고 있다’)는 ‘쓰임 받았음’이라는 완료된 과거 표현보다 현재 진행의 뜻으로 옮기는 것이 적절합니다. 또한 τῇ ζωῇ는 ‘생명에 유익하다’로 보존할 수 있습니다.
  naturalness: ‘네가 부할 때’는 현대 표준어로 다소 부자연스럽고, 문장부호와 연결이 부족합니다. ‘부유했을 때’, ‘쓸모가 있고 생명에 유익합니다’로 다듬으면 현대 합쇼체로 자연스럽습니다.
  terminology: θεός는 ‘하나님’으로 일관되게 옮겼습니다. εὔχρηστος는 문맥상 ‘쓸모 있는’으로, ὠφέλιμος는 ‘유익한’으로 구별하여 번역했습니다.
  issues:
