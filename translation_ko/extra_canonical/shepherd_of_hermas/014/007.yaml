  text: 7. “그대 자신에게서 먼저 배우십시오. 그대가 부유했을 때에는 쓸모없었지만, 이제는 쓸모가 있고 생명에 유익합니다. 하나님께 쓸모 있는 사람이 되십시오. 그대 자신도 바로 그 돌들로 쓰임을 받고 있기 때문입니다.”
