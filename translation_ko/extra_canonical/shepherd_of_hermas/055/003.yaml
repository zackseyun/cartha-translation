revisions:
- from: 5. 우리가 다시 조금 더 가니 그가 나에게 큰 목자를 보여 주는데 그는 흰 염소 가죽을 입고 사나운 모습으로 그 어깨에 자루를 메고 매듭이 있는 매우 단단한 지팡이와 큰 채찍을 가졌더라. 그 사람의 표정은 매우 엄숙하여 나는 그 사람을 두려워하였으니 그 모습이 그러하였느니라.
  to: 5. 우리가 다시 조금 더 가니, 그가 나에게 큰 목자를 보여 주셨습니다. 그는 외양이 사나웠고 흰 염소 가죽을 걸치고 있었으며, 어깨에는 자루를 메고 있었습니다. 또 매듭이 있는 매우 단단한 지팡이와 큰 채찍을 가지고 있었습니다. 그의 눈빛은 매우 매서워서 나는 그가 두려웠습니다. 그의 눈빛이 그러했습니다.
  rationale: 원문의 강한 외양과 특히 위협적인 눈빛을 ‘사나웠고’, ‘매우 매서워서’로 바로잡았습니다. 묘사의 순서와 반복 강조를 유지하되, 전체를 현대 표준어 합쇼체로 통일했습니다.
