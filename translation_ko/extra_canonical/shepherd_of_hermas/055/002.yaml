revisions:
- from: “네가 본 이 양들은 뛰지 아니하고 한곳에서 풀을 뜯는 자들이니 이들은 자기를 사치와 속임에 넘겨 주면서도 전혀 주를 훼방하지 아니하는 자들이라 그러므로 이 사람들은 진리에서 부패하여졌으니 그들에게는 회개의 소망이 있으니 그 가운데서 살 수 있느니라 썩어질 것은 새롭게 되기를 바라는 바가 있으나 사망은 영원한 멸망이 있느니라”
  to: “당신이 본, 뛰어다니지 않고 한곳에서 풀을 뜯던 양들은 자기 자신을 향락과 속임수에 내맡긴 사람들입니다. 그러나 그들은 주님을 전혀 모독하지 않았습니다. 그러므로 이들은 진리에서 타락해 버렸지만, 그들 안에는 회개의 소망이 있으며, 그 회개를 통해 살 수 있습니다. 그러므로 부패에는 어느 정도 새로워질 소망이 있지만, 죽음에는 영원한 멸망이 있습니다.”
  rationale: 원문의 대조(향락과 속임수에 자신을 내맡김 / 주님을 모독하지 않음), 회개가 생명으로 이르는 수단이라는 지시 관계, 그리고 부패와 죽음의 대조를 보존했습니다. 원문의 τινος가 지닌 비특정성을 ‘어느 정도’로 절제하여 옮겼으며, 전체를 현대 표준어 합쇼체로 다듬었습니다.
