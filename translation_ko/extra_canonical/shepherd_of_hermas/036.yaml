base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036.yaml
  text: 'He says to me: Remove double-mindedness from yourself[a], and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”


    Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great tender mercy—for he will certainly not abandon you, but will bring the request of your soul to completion.


    For God is not like human beings who remember wrongs; rather, he does not remember wrongs, and he has compassion on what he has made.


    Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will not be left short in any of your petitions, if you ask from the Lord without doubting.


    But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.


    But those who are whole in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.


    Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.


    So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.


    Look at this double-mindedness: for it is evil and senseless, and it uproots many from the faith, even those who are very faithful and strong. For this double-mindedness is a daughter of the devil, and it acts very wickedly toward the slaves of God.


    Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith[b]. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.


    “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.


    Therefore serve faith, which has power, and keep away from double-mindedness, which has no power[j][i][h][g][f][e][d][c], and you will live to God—and all who think these things will live to God.”'
  footnotes:
  - marker: a
    text: “Double‑mindedness” (διψυχία) is a stock vice in Hermas, distinct from the act of doubting (διστάζειν).
    reason: lexical_alternative
  - marker: b
    text: “Bring the request of your soul to completion” renders πληροφορήσει; alternatives include “fully grant” or “fully assure.” Context favors fulfillment of the petition.
    reason: lexical_alternative
  - marker: c
    text: “Vanities of this age” echoes LXX usage of ματαιότης; the phrase contrasts transient worldly emptiness with God’s permanence.
    reason: cultural_note
  - marker: d
    text: The phrase “the things previously spoken to you” (τῶν προειρημένων σοι ῥημάτων) is idiomatic; it likely points back to earlier admonitions or matters already mentioned.
    reason: alternative_reading
  - marker: e
    text: '“Not be left short” translates the rare ἀνυστέρητος; alternatives: “not deprived,” “not disappointed.”'
    reason: lexical_alternative
  - marker: f
    text: “Testing” (πειρασμός) here emphasizes proving or refining rather than enticement to sin.
    reason: cross_reference
  - marker: g
    text: “Slaves of God” reflects δοῦλοι; while “servants” is common, the stronger term emphasizes belonging and allegiance.
    reason: lexical_alternative
  - marker: h
    text: “Earthly spirit” (ἐπίγειον πνεῦμα) contrasts with “from above” (ἄνωθεν); the imagery is vertical, not merely “worldly attitude.”
    reason: cultural_note
  - marker: i
    text: “Live to God” preserves the dative construction (τῷ θεῷ) common in early Christian texts; “live for God” is a possible paraphrase.
    reason: lexical_alternative
  - marker: j
    text: “God … does not remember wrongs” renders μνησικακέω/ἀμνησίκακος; it stresses God’s refusal to bear a grudge, not amnesia.
    reason: cultural_note
translation:
  language: ko
  text: '그가 내게 말합니다. 「너 자신에게서 두 마음을 제거하고, 하나님께 무엇이든 구할 때에는 조금도 두 마음을 품지 마십시오. 곧 마음속으로 ‘내가 주님께 무엇을 구하고 받아낼 수 있겠습니까? 내가 그분께 그렇게 많은 죄를 지었는데’라고 말하지 마십시오.


    이 일들에 대해 생각하지 마십시오. 오히려 온 마음으로 주님께 돌아서서, 의심하지 말고 그에게 구하십시오. 그러면 그의 큰 긍휼을 알게 될 것입니다. 그는 결코 당신을 버리지 않으시고, 당신의 영혼의 요청을 이루어 주실 것입니다.


    하나님은 잘못을 기억하는 사람들과 같지 않으십니다. 오히려 그는 잘못을 기억하지 않으시고, 자신이 지은 것에 긍휼을 베푸십니다.


    그러므로 이 세대의 모든 헛된 것들과 전에 당신에게 말한 말들에서 당신의 마음을 깨끗하게 하고, 주님께 구하십시오. 그러면 모든 것을 받을 것이며, 주님께 의심 없이 구하면 어떤 요청에서도 부족함을 당하지 않을 것입니다.


    그러나 당신의 마음이 흔들리면, 요청하는 것 가운데 아무것도 결코 받지 못할 것입니다. 하나님에 관하여 의심하는 사람들—이 사람들이 바로 두 마음을 품은 사람들입니다—는 그들의 요청을 전혀 얻지 못합니다.


    하지만 믿음 안에서 온전한 사람들은 모든 것을 구하며, 주님께 신뢰를 두고 받습니다. 그들은 의심 없이 구하고 조금도 두 마음을 품지 않기 때문입니다. 두 마음을 품은 사람은 누구나, 회개하지 않으면 구원받기가 어렵습니다.


    그러므로 당신의 마음에서 두 마음을 깨끗하게 하고, 믿음을 입으십시오. 믿음은 강하기 때문입니다. 그리고 하나님을 믿으십시오. 그러면 당신이 구하는 모든 요청을 받을 것입니다. 그리고 만일 주님께 어떤 요청을 드린 뒤 그것을 더디 받게 되더라도, 영혼의 요청을 빨리 받지 못했다고 해서 두 마음을 품지 마십시오. 분명히 그것은 당신이 알지 못하는 어떤 시험이나 어떤 범죄 때문이어서, 당신이 요청을 더디 받는 것입니다.


    그러므로 영혼의 요청을 구하는 일을 멈추지 마십시오. 그러면 그것을 받을 것입니다. 그러나 구하는 중에 지쳐서 두 마음을 품게 되면, 당신 자신을 책망하고 당신에게 주는 분을 책망하지 마십시오.


    이 두 마음을 보십시오. 그것은 악하고 어리석으며, 믿음에서 많은 사람을 뿌리째 뽑습니다. 매우 신실하고 강한 사람들까지도 그렇습니다. 또 이 두 마음은 마귀의 딸이며, 하나님의 종들에게 매우 악하게 행합니다.


    그러므로 두 마음을 업신여기고, 모든 일에서 그것을 다스리십시오. 강하고 능력 있는 믿음을 입었기 때문입니다. 믿음은 모든 것을 약속하고 모든 것을 완성하지만, 두 마음은 스스로를 신뢰하지 않기 때문에 자신이 하는 모든 일에서 실패합니다.


    「그러면 보십시오」라고 그가 말합니다. 「믿음은 위로부터, 곧 주님께로부터 온 것이며 큰 능력을 가지고 있습니다. 그러나 두 마음은 마귀에게서 온 땅의 영이어서 능력이 없습니다.


    그러므로 능력이 있는 믿음을 섬기고, 능력이 없는 두 마음을 멀리하십시오. 그러면 하나님께 살게 될 것입니다. 그리고 이 일을 생각하는 모든 사람도 하나님께 살게 될 것입니다」.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία / δίψυχος
  english_pob_choice: double-mindedness / double-minded
  chosen_korean: 두 마음
  alternatives_korean:
  - 의심
  - 흔들림
  - 양심의 갈림
  lexicon: BDAG
  rationale: 이 작품에서 διψυχία는 단순한 의심보다 지속적인 내적 분열의 악덕으로 기능하므로, 한국어에서는 직역적이면서도 관용적인 ‘두 마음’을 택해 비덕(vice) 성격을 살렸습니다.
- source_word: αἰτήμα / αἰτοῦ / αἰτημάτων
  english_pob_choice: request / petitions
  chosen_korean: 요청
  alternatives_korean:
  - 간구
  - 청원
  - 구하는 것
  lexicon: BDAG
  rationale: 본문은 구체적인 청원 행위를 가리키므로 ‘요청’이 의미를 가장 직접적으로 드러냅니다. ‘간구’는 기도어로 굳어져 있어 과도하게 교회화될 수 있습니다.
- source_word: εὐσπλαγχνία
  english_pob_choice: great tender mercy
  chosen_korean: 큰 긍휼
  alternatives_korean:
  - 큰 자비
  - 깊은 연민
  - 따뜻한 긍휼
  lexicon: BDAG
  rationale: 내장적·가슴 아픈 연민의 뉘앙스를 가진 말이므로 ‘긍휼’을 유지하고, μεγάλη의 강조를 ‘큰’으로 반영했습니다. ‘자비’보다 문맥의 정서적 압력이 더 잘 살아납니다.
- source_word: πληροφορήσει
  english_pob_choice: bring the request of your soul to completion
  chosen_korean: 이루어 주실 것입니다
  alternatives_korean:
  - 완전히 채워 주실 것입니다
  - 온전히 이루실 것입니다
  - 만족하게 하실 것입니다
  lexicon: BDAG
  rationale: 청원 문맥에서 πληροφορέω는 단순한 내적 확신보다 요청의 성취를 가리키므로, 한국어에서는 결과를 분명히 드러내는 ‘이루어 주실 것입니다’로 옮겼습니다.
- source_word: μνησικακέω / ἀμνησίκακος
  english_pob_choice: remember wrongs / does not remember wrongs
  chosen_korean: 잘못을 기억하다 / 잘못을 기억하지 않으시다
  alternatives_korean:
  - 원한을 품다 / 원한을 품지 않으시다
  - 악한 일을 기록하다 / 기록하지 않으시다
  lexicon: BDAG
  rationale: 하나님의 성품을 ‘기억하지 않으신다’로 번역해, 분노의 저장이나 기록 유지라는 도덕적·법정적 뉘앙스를 살렸습니다.
- source_word: ὁλοτελεῖς
  english_pob_choice: whole in faith
  chosen_korean: 믿음 안에서 온전한
  alternatives_korean:
  - 믿음에 완전한
  - 믿음 안에서 완전한
  - 믿음이 전적인
  lexicon: BDAG
  rationale: ὁλοτελής는 무결점보다는 분열되지 않은 온전함을 뜻하므로, ‘온전한’으로 옮겨 믿음의 내적 통일성을 드러냈습니다.
- source_word: ἀνυστέρητος
  english_pob_choice: not be left short
  chosen_korean: 부족함을 당하지 않을 것입니다
  alternatives_korean:
  - 빠짐없이 받을 것입니다
  - 결핍되지 않을 것입니다
  - 모자라지 않을 것입니다
  lexicon: LSJ
  rationale: 희귀 형용사의 의미를 한국어에서 자연스럽게 드러내기 위해 결과적 상태인 ‘부족함을 당하지 않을 것입니다’로 풀었습니다.
- source_word: ἐπίγειον πνεῦμα
  english_pob_choice: earthly spirit
  chosen_korean: 땅의 영
  alternatives_korean:
  - 지상의 영
  - 세속의 영
  - 땅에서 난 영
  lexicon: BDAG
  rationale: 위로부터/땅이라는 대조를 보존하기 위해 ‘땅의 영’으로 직행했습니다. ‘세속의 영’은 해석을 덧씌울 수 있습니다.
- source_word: δοῦλοι τοῦ θεοῦ
  english_pob_choice: slaves of God
  chosen_korean: 하나님의 종들
  alternatives_korean:
  - 하나님의 노예들
  - 하나님의 종노릇하는 사람들
  lexicon: BDAG
  rationale: 한국어 표준 문체에서 이 단락은 소유 강조보다 가르침의 직접성을 우선해 ‘종들’로 옮겼습니다. 본문 전체의 수사적 흐름을 해치지 않도록 한 절충입니다.
theological_decisions:
- issue: διψυχία를 단순한 심리적 의심으로 약화시키지 않을 것
  chosen_reading: ‘두 마음’을 반복적으로 유지하고, ‘의심’은 διστάζω/ἀδιστάκτως에 한해 사용했습니다.
  alternative_readings:
  - 의심
  - 우유부단함
  - 불신
  rationale: 본문은 ‘의심하는 행위’와 ‘두 마음’이라는 지속적 상태를 구별합니다. 이 구분을 유지해야 경고의 윤리적 강도가 살아납니다.
  doctrine_reference: Hermas Mandate 9의 수사 구조
- issue: δοῦλοι τοῦ θεοῦ의 사회적 강도
  chosen_reading: ‘하나님의 종들’로 번역했습니다.
  alternative_readings:
