revisions:
- from: “너희 자손 헤르마스는 하나님을 버리고 주님를 모독하며 큰 죄악으로 자기 부모를 배반하여 부모를 배반한 자라 하는 소리를 들었나니 배반하여도 유익을 얻지 못하고 오히려 음란과 불의를 섞은 죄를 더하여 불법이 가득하였느니라.
  to: “헤르마스여, 그대의 자손은 하나님을 저버리고 주님을 모독했으며, 큰 악을 행하여 자기 부모를 배신했습니다. 그들은 부모를 배신한 자들이라는 말을 들었습니다. 그러나 그들은 배신하고도 아무런 이득을 얻지 못했고, 오히려 자기 죄에 방탕과 악한 혼합을 더했습니다. 그리하여 그들의 불법이 가득 차게 되었습니다.”
