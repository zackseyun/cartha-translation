  english_pob_role: consult_only
status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 초안은 자녀들에게 알리라는 명령과 아내가 말을 듣고 자비를 받으리라는 흐름을 대체로 반영합니다. 그러나 συμβίῳ(아내)와 μελλούσῃ σου ἀδελφῇ(당신의 자매가 될)를 분명히 구별하지 않아, 원문의 의도적으로 낯선 병치가 불투명해졌습니다. 또한 '악을 행합니다'는 '그 혀로 악을 행한다'는 수단·연결을 명시하는 편이 정확합니다.
  naturalness: 합쇼체 명령문은 '알리십시오'가 자연스럽습니다. '혀를 금하지 않고'보다 '혀를 삼가지 않으며'가 현대 한국어에서 자연스럽고, 뒤의 '삼갈 것입니다'와도 잘 연결됩니다.
  terminology: συμβίος는 '아내'로, ἀδελφή는 '자매'로 옮기되 두 표현의 관계가 본문만으로 확정되지 않으므로 각주에서 설명합니다. ἔλεος는 문맥상 '자비'로 유지합니다.
  issues:
  - severity: medium
    issue: '''네 자매가 될 아내''가 아내와 자매라는 두 호칭의 낯선 병치를 충분히 드러내지 못합니다.'
    rationale: 그리스어는 '당신의 아내, 곧 당신의 자매가 될 이'라고 표현합니다. 관계의 정확한 의미를 해석으로 확정하지 말고 본문에서 보존하며 각주로 밝혀야 합니다.
  - severity: medium
    issue: '''자기 혀를 금하지 않고 악을 행합니다''가 악행의 수단인 혀를 약화합니다.'
    rationale: ἐν ᾗ πονηρεύεται는 '그 혀로 악을 행한다/악하게 말한다'는 연결을 나타냅니다.
  revised_text: 그러나 이 말씀을 너의 모든 자녀와 네 아내, 곧 네 자매가 될 이에게 알려 주십시오.† 그 여자도 자기 혀를 삼가지 않으며, 그 혀로 악을 행합니다. 그러나 이 말씀을 들으면 혀를 삼갈 것이며 자비를 받을 것입니다.
  revised_footnotes:
  - marker: †
    text: 직역하면 “네 아내, 네 자매가 될 이”입니다. 여기서 ‘자매’가 가리키는 관계의 정확한 의미는 본문만으로 확정되지 않습니다.
    reason: συμβίῳ(아내)와 μελλούσῃ σου ἀδελφῇ(네 자매가 될 이)의 병치를 보존하고, 논쟁될 수 있는 관계 의미를 특정 해석으로 고정하지 않기 위해.
  revision_rationale: 원문의 명령형과 아내/자매의 병치를 명료하게 보존하고, 혀가 악행의 수단이라는 표현을 회복했습니다. 문체는 현대 표준어 합쇼체로 다듬었습니다.
