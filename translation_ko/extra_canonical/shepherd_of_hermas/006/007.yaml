review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ἐμμείνατε는 단순히 ‘인내하라’보다 ‘굳게 머물라/계속하라’에 가깝습니다. 또한 ἡ πάροδος는 ‘지나가라’라는 명령이 아니라 명사 ‘지나감, 통과’이며, ἵνα 이하의 목적을 자연스럽게 옮겨야 합니다. 마지막의 ‘자기 생명’은 원문의 복수 소유대명사와 수식 관계를 흐리므로 ‘자기들의 생명’ 또는 문맥상 ‘목숨’을 쓰는 편이 낫습니다.
  naturalness: ‘너희가 거룩한 천사들과 함께 지나가라’는 한국어에서 명령처럼 들리고 문법적으로도 부자연스럽습니다. ‘너희의 지나감이 거룩한 천사들과 함께하게 하려는 것이다’로 옮기면 원문의 목적절과 문체를 모두 살립니다.
  terminology: ‘의’와 ‘환난’은 적절합니다. διψυχήσητε는 ‘두 마음을 품다’로 번역 가능하나, 여기서는 ‘마음이 흔들리지 마십시오’가 현대 한국어에서 더 자연스럽고 의미도 잘 전달합니다. ‘생명을 부인하다’보다 ‘목숨을 부인하다’가 한국어에서 더 직접적이며 원문의 τὴν ζωήν을 문맥상 충실히 반영합니다.
