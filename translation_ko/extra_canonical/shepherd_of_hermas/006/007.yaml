revisions:
- from: 그러므로 의를 행하는 자들아, 인내하고 두 마음을 품지 말라. 그리하여 너희가 거룩한 천사들과 함께 지나가라. 다가오는 큰 환난을 견디며 자기 생명을 부인하지 아니하는 너희는 복이 있도다.
  to: 그러므로 의를 행하는 이들이여, 굳게 서고 마음이 흔들리지 마십시오. 그리하여 여러분의 지나감이 거룩한 천사들과 함께하게 하십시오. 다가오는 큰 환난을 견디는 이들과 자기들의 목숨을 부인하지 않을 이들은 복이 있습니다.
  rationale: 원문의 권면 동사 ἐμμείνατε와 ὑπομένετε를 각각 ‘굳게 서다’와 ‘견디다’로 구별했습니다. 또한 ἡ πάροδος를 명사 ‘지나감’으로 보존하여 목적절의 구조를 반영했습니다. 마지막 관계절은 미래형 οὐκ ἀρνήσονται를 ‘부인하지 않을’로 유지했습니다.
