  - severity: low
    issue: ‘자기 생명’의 지시 대상이 불분명함
    rationale: 원문은 ‘그들의 생명’을 뜻하므로, 복수 주어에 맞추어 ‘자기들의 목숨’으로 명시하는 편이 정확합니다.
