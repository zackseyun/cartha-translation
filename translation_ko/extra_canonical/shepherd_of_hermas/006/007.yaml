  text: 그러므로 의를 행하는 자들아, 인내하고 두 마음을 품지 말라. 그리하여 너희가 거룩한 천사들과 함께 지나가라. 다가오는 큰 환난을 견디며 자기 생명을 부인하지 아니하는 너희는 복이 있도다.
