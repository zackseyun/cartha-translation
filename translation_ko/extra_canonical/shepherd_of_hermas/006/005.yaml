revisions:
- from: 주께서 택하신 자들을 위하여 자기의 영광을 가리켜 맹세하시기를 만일 이 날 이후에도 여전히 죄가 있으면 그들에게는 구원이 없으리라 하셨나니 의인에게는 회개가 끝나느니라. 모든 성도에게는 회개의 날이 찼으나 이방인에게는 마지막 날까지 회개할 것이 있느니라.
  to: 주께서는 자기 영광을 두고 자기 택하신 이들에 관하여 맹세하셨습니다. 정해진 이 날이 지난 뒤에도 죄를 짓는 일이 생기면, 그들에게는 구원이 없을 것입니다. 의인들에게는 회개에 끝이 있기 때문입니다. 모든 성도들에게 회개의 날들은 이미 다 찼습니다. 그러나 이방인들에게는 마지막 날까지 회개가 있습니다.
  rationale: 현대 합쇼체로 문체를 통일하고, 죄가 ‘생기는’ 사건이라는 원문의 표현을 반영했습니다. 또한 이방인에 대한 ‘회개가 있다’는 표현을 원문의 여지를 넘어서지 않도록 직역적으로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:51Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 맹세, 택하신 이들, 정해진 날 이후의 죄, 의인을 위한 회개의 종결, 성도들과 이방인에 관한 대조라는 핵심 뜻을 대체로 담고 있습니다. 그러나 ‘죄가 있으면’은 γένηται(죄를 짓는 일이 생기다)의 사건성을 약화하며, ‘회개할 것이 있느니라’는 μετάνοιά ἐστιν(회개가 있다)을 부자연스럽게 바꾸고 의미를 다소 흐립니다.
  naturalness: 초안의 ‘하셨나니’, ‘없으리라’, ‘끝나느니라’, ‘찼으나’, ‘있느니라’는 요청된 현대 표준어 합쇼체가 아니라 고전 성경체입니다. 현대적인 합쇼체 문장으로 고치는 것이 필요합니다.
  terminology: ‘구원’, ‘의인’, ‘회개’, ‘성도’, ‘이방인’, ‘마지막 날’은 적절합니다. ‘택하신 이들’은 ἐκλεκτοί를 자연스럽고 충실하게 옮깁니다. ‘회개의 날들이 다 찼습니다’는 πεπλήρωνται αἱ ἡμέραι μετανοίας의 완료된 상태를 보존합니다.
  issues:
  - severity: medium
    issue: 현대 합쇼체 register 미준수
    rationale: 초안은 고전 성경체 종결을 사용하므로, 명시된 번역 변종인 현대 formal-polite 합쇼체에 맞지 않습니다.
  - severity: low
    issue: ‘죄가 있으면’의 사건성 약화
    rationale: 원문의 ‘ἁμάρτησις γένηται’는 단순한 죄의 존재라기보다 죄를 짓는 일이 발생하는 것을 가리킵니다.
  - severity: low
    issue: ‘회개할 것이 있느니라’의 부정확하고 부자연스러운 표현
    rationale: 원문은 이방인들에게 마지막 날까지 ‘회개가 있다’고 말합니다. ‘회개할 것이 있다’는 한국어상 회개해야 할 잘못이 있다는 뜻으로도 읽힐 수 있습니다.
