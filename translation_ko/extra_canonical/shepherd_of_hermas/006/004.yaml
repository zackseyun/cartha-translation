revisions:
- from: 주께서 너희에게 나타내라고 나에게 분부하신 이 말씀을 너희가 그들에게 알게 한 후에 그들의 이전 범한 모든 죄가 사하여지고 또 오늘까지 죄를 지은 모든 성도가 만일 마음을 다하여 회개하여 두 마음을 마음에서 버리면 사하여질 것이니라
  to: 주인께서 이 말씀들이 네게 계시되도록 내게 명하신 대로, 네가 그들에게 이 말씀을 알려 준 뒤에는, 그들이 전에 지은 모든 죄가 용서받을 것입니다. 또 오늘까지 죄를 지은 모든 성도도 온 마음으로 회개하고 마음에서 두 마음 품는 것을 버리면 용서받을 것입니다.
  rationale: 원문의 단수 수신자와 전달 관계를 회복하고, δεσπότης를 ‘주인’으로 구별했습니다. 조건절을 두 문장에 걸쳐 명료하게 하되, 모든 성도에게 적용되는 회개와 내적 양면성의 제거라는 원문의 조건 및 종말론적·규범적 긴장을 완화하거나 해석적으로 확장하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:51Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 조건(온 마음의 회개와 두 마음을 버림) 및 용서의 범위를 대체로 반영합니다. 그러나 원문의 단수 수신자(σοι)를 복수 ‘너희’로 옮겼고, δεσπότης는 여기서 κύριος와 구별되어 ‘주인’으로 옮기는 것이 적절합니다. 또한 ‘마음을 다하여’의 주체와 조건절의 범위가 더 분명해질 필요가 있습니다.
  naturalness: 초안의 긴 문장은 현대 한국어로 읽기에 다소 경직되어 있으며, ‘두 마음을 마음에서 버리면’은 중복되고 자연스럽지 않습니다. 조건과 결과를 분명히 나누어 합쇼체로 다듬는 것이 좋습니다.
  terminology: δεσπότης는 이 문맥에서 ‘주인’으로, ἅγιοι는 ‘성도들’로, διψυχίαι는 문자성을 보존하여 ‘두 마음 품는 것’으로 옮겼습니다. 이는 특정 교파적 해석을 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: 단수 수신자를 복수로 번역함
    rationale: 원문의 σοι는 ‘네게’라는 단수이며, 이어지는 ‘네가 그들에게’라는 전달 구조를 보존해야 합니다.
  - severity: low
    issue: δεσπότης와 κύριος의 구별이 사라짐
    rationale: 이 절은 δεσπότης를 사용하므로, 앞 절들의 κύριος와 구별되는 ‘주인’으로 옮기는 편이 원문 충실성에 맞습니다.
  - severity: low
    issue: 조건절의 주체와 표현이 불명료함
    rationale: 회개하고 두 마음을 버리는 주체가 앞의 ‘그들’ 및 ‘성도들’임을 드러내고, 어색한 중복 표현을 정리해야 합니다.
  revised_text: 주인께서 이 말씀들이 네게 계시되도록 내게 명하신 대로, 네가 그들에게 이 말씀을 알려 준 뒤에는, 그들이 전에 지은 모든 죄가 용서받을 것입니다. 또 오늘까지 죄를 지은 모든 성도도 온 마음으로 회개하고 마음에서 두 마음 품는 것을 버리면 용서받을 것입니다.
