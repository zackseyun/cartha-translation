  text: 주께서 너희에게 나타내라고 나에게 분부하신 이 말씀을 너희가 그들에게 알게 한 후에 그들의 이전 범한 모든 죄가 사하여지고 또 오늘까지 죄를 지은 모든 성도가 만일 마음을 다하여 회개하여 두 마음을 마음에서 버리면 사하여질 것이니라
