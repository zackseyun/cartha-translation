  terminology: ἐκκλησία는 문맥상 ‘교회’로, προηγούμενοι는 특정 직분 명칭을 과도하게 단정하지 않는 ‘교회를 이끄는 이들’로 옮겼습니다. δικαιοσύνη는 ‘의’로 유지했습니다.
