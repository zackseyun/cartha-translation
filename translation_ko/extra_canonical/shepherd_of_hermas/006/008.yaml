revisions:
- from: 주님께서는 자기 아들을 두고 맹세하셨습니다. 자기 주님을 부인하는 사람들은 그들의 생명에서 끊어질 것입니다. 그들은 앞으로 그분을 부인할 사람들입니다. 그러나 그분은 그 큰 긍휼로 인해 이전에 부인했던 사람들에게 자비를 베푸셨습니다.”
  to: 주님께서는 자기 아들을 두고 맹세하셨습니다. 자기 주님을 부인한 사람들, 곧 이제 다가오는 날들에 그분을 부인하려는 사람들은 자기 생명에서 끊어졌습니다. 그러나 이전에 부인했던 사람들에게는 그분의 큰 긍휼 때문에 자비를 베푸셨습니다.”
  rationale: 완료형을 ‘부인한’ 및 ‘끊어졌습니다’로 옮기고, 원문의 난해하지만 의도적인 것으로 보이는 ‘이제 장차 부인할 이들’과 ‘이전에 부인한 이들’의 대조를 ‘곧’과 ‘그러나’로 보존했습니다. 해석적 조화나 교리적 설명은 덧붙이지 않았습니다.
