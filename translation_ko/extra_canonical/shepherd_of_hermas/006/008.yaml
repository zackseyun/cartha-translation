  terminology: ‘주님’, ‘아들’, ‘부인하다’, ‘긍휼’, ‘자비’는 이 문맥에 적절합니다. ‘생명에서 끊어지다’는 원문의 ἀπὸ τῆς ζωῆς αὐτῶν를 직역적으로 보존하는 표현입니다.
