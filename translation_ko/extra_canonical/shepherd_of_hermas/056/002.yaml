    rationale: οὐκ ἀναβαίνει ... ὅτι ἔπραξαν πονηρά는 자신들이 악을 행했다는 생각이 마음에 떠오르지 않는다는 뜻인데, 초안은 악을 마음에 품는 것으로 옮겼습니다.
  - severity: medium
    issue: 주님을 '원망하다'로 번역
    rationale: αἰτιῶνται는 여기서 주님에게 책임을 돌리거나 탓한다는 뜻이며, '원망하다'보다 직접적이고 중립적인 '탓하다'가 적절합니다.
  - severity: medium
