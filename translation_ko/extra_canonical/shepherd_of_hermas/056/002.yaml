  terminology: τιμωρίαι/βάσανοι는 '처벌/고통'으로, βιωτικαί는 사후 형벌로 한정하지 않고 '현세의 삶에서 겪는'으로 옮겼습니다. 계획의 ἀκαταστατοῦντες 및 πάσῃ ἀκαταστασίᾳ는 각각 '갈피를 잡지 못하다'와 '온갖 혼란'으로 구별했습니다. 대화 상대에게 쓰인 κύριε는 영어 audit trail의 'Sir'에 따라 '선생님'으로, 하나님을 가리키는 Κύριον은 '주님'으로 옮겼습니다.
