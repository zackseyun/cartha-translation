revisions:
- from: “저는 이런 다양한 처벌이 무엇인지 알고 싶었습니다.”라고 말했습니다. 이르시되 들으라 여러 가지 형벌과 환난이 현세의 괴로움이라 어떤 사람은 손해를 받고 어떤 사람은 궁핍함을 어떤 사람은 각종 질병으로 어떤 사람은 각종 질병으로 어떤 사람은 각종 질병으로 어떤 사람은 무익한 자들에게 능욕을 받고 그 밖의 여러 가지로 고난을 받느니라 많은 사람은 자기 계획이 확정되지 아니하여 많은 일을 하려 하나 아무 성과도 얻지 못하느니라 그들은 악한 일을 했다고 마음속에 품고 주님를 원망합니다.
