revisions:
- from: 그러므로 그들이 이같이 채찍질을 당하고 고난을 받는 것을 보고 내가 그들을 위하여 슬퍼하였으니 이는 그들이 이같이 고난을 받고 전혀 쉼이 없었음이라. 나는 나와 말하는 목자에게 “주여, 이렇게 가차없고 가혹하며 이 양들을 전혀 긍휼히 여기지 않는 이 목자가 누구입니까?”라고 물었습니다. “이는 징벌을 내리는 천사니 그는 의로운 천사 중에 징벌을 맡기는 자라 그러므로 하나님을 떠나 이 세대의 정욕과 거짓을 좇는 자들을 맡아 무서운 형벌과 여러 가지 형벌로 그들의 합당한 대로 형벌하시느니라”
