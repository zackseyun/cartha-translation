  rationale: 원문의 수동적 고난 묘사와 징벌 천사의 역할을 보존하면서, 중복되고 고어적인 표현을 현대 표준어 합쇼체로 다듬었습니다. 대괄호로 전승상 불확실성이 표시된 οὕτως는 영어 POB의 처리와 같이 ‘이렇게/이처럼’으로 번역문에 반영하되 별도 각주를 만들지 않았습니다.
