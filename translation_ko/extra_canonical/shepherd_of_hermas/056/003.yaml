revisions:
- from: “그러므로 저희가 온갖 환난을 당하거든 내게 맡겨 선한 징계를 받고 주의 믿음으로 굳건하게 되어 남은 생애에 청결한 마음으로 주를 섬기며 회개하면 그 행한 악행이 마음에 떠오르고 하나님께 영광을 돌려 이르되 그는 의로운 재판장이시라 하고 각 사람이 그 행한 대로 의롭게 고난을 받았다 하느니라.” 그 후에 그들은 깨끗한 마음으로 주님을 섬기며, 그들이 하는 모든 일이 형통하고, 그들이 구하는 것은 무엇이든 주님께 받습니다. 그리고 그들은 나에게 넘겨져 더 이상 어떤 재앙도 겪지 않으므로 주님께 영광을 돌립니다.”
  to: “그러므로 그들이 온갖 환난을 겪을 때에는, 선한 징계를 받도록 내게 넘겨집니다. 그러면 그들은 주님의 믿음 안에서 굳세어지고, 남은 생애 동안 깨끗한 마음으로 주님을 섬깁니다. 그리고 그들이 회개하면, 그들이 행한 악한 일들이 그들의 마음에 떠오릅니다. 그때 그들은 하나님께 영광을 돌리며 말합니다. ‘그분은 의로운 재판장이시며, 각 사람은 자기 행위에 따라 마땅히 고난을 겪었습니다.’ 그 뒤로 그들은 깨끗한 마음으로 주님을 섬기고, 하는 모든 일에서 형통하며, 구하는 것은 무엇이든 주님에게서 받습니다. 그리고 그들은 자신들이 내게 넘겨졌고 더 이상 어떤 악한 일도 겪지 않게 되었기 때문에 주님께 영광을 돌립니다.”
  rationale: 그리스어 원문과 영어 POB의 문단 전체를 따라, 인용문 구조와 조건·시간 관계를 바로잡고 현대 합쇼체로 통일했습니다. 원문의 ‘마음에 떠오르다’, ‘행위에 따라’, ‘내게 넘겨지다’라는 표현 및 결과의 병렬 관계를 보존했습니다.
