  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the slave took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: ko
  text: 그가 나에게 말했습니다. “내가 너희에게 말합니다. 이것은 너희가 주님께 드리는 금식이라고 생각하는 금식이 아닙니다. 비유를 들어 보십시오. 잡초가 없는 포도원은 잡초에 질식하지 않으므로 더 많은 열매를 맺습니다. 그래서 그 종은 [도구를] 들고 포도원을 파서, 포도원에 있던 잡초를 모두 뽑아 냈습니다. 그러자 그 포도원은 매우 아름답고 번성하게 되었으며, 그것을 질식시키는 잡초가 없었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: 도구를
    text: 그리스어 본문에는 ‘들고/취하여’의 목적어가 명시되어 있지 않습니다. 문맥상 작업 도구를 보충한 것입니다.
    reason: 원문에 없는 보충어임을 표시하여 본문 비평적 불확실성을 보존합니다.
