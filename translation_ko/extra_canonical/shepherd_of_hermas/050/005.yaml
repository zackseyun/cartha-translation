  text: 그가 나에게 이르되 내가 너희에게 이르노니 이것은 너희가 주께 단식하는 줄 아는 금식이 아니니라 비유를 들으라 포도원에는 잡초가 없어야 열매를 많이 맺고 잡초에 막히지 아니하느니라 이에 종이 도구를 들고 포도원을 파고 포도원에 있는 잡초를 다 뽑았더니 그 포도원이 심히 아름답고 무성하여 심히 무성하더라
