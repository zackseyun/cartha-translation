  text: '"What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."'
translation:
  language: ko
  text: “재일[1]이 무엇입니까?” 그가 말씀하셨습니다. 제가 말씀드렸습니다. “주인님, 저는 금식합니다.” 그가 말씀하셨습니다. “너희가 행하는 이 금식은 무엇입니까?” 제가 말씀드렸습니다. “주인님, 저는 늘 하던 대로 금식합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: ‘재일’(στατίων)은 여기서 고대 기독교에서 정해진 때에 지키던 금식일 또는 금식 준수를 가리킵니다.
    reason: 오늘날 한국어에서 낯선 기술적 용어인 στατίων의 역사적 의미를 보충하되, 본문의 문답 구조와 의미를 유지합니다.
