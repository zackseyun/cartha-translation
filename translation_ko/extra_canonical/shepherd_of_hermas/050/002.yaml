review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘역’은 στατίων(고대 기독교의 정해진 금식 준수일)를 잘못 옮긴 것이며, δεύτε 질문의 ‘이 금식’과 ‘너희가 행하는’이라는 강조도 충분히 반영하지 못했습니다. κύριε는 여기서 ‘선생님’보다는 호칭 ‘주인님’이 원문에 더 가깝습니다.
  naturalness: 초안은 현재형 서술과 인용 방식이 다소 혼재하고, ‘익숙해졌기 때문에’는 ὡς εἰώθειν(늘 하던 대로)의 뜻을 바꿉니다. 수정문은 현대 표준 한국어의 격식체 대화로 자연스럽게 정리했습니다.
  terminology: στατίων은 음역이나 일반적인 ‘단식’으로 평준화하지 않고 ‘재일’로 옮긴 뒤 주석에서 고대 기독교의 정해진 금식일이라는 뜻을 밝혔습니다. νηστεύω는 일관되게 ‘금식하다’로 번역했습니다.
  issues:
  - severity: high
    issue: στατίων을 ‘역’으로 번역함
    rationale: 문맥상 교통·근무의 ‘역’이 아니라 고대 기독교에서 지키던 정해진 금식일(라틴어 statio에 대응하는 용례)입니다.
  - severity: medium
    issue: ‘선생님’ 및 ‘익숙해졌기 때문에’
    rationale: κύριε는 대화 상대에 대한 호칭이며 ‘주인님’이 더 직접적입니다. ὡς εἰώθειν은 이유가 아니라 관례·방식, 곧 ‘늘 하던 대로’입니다.
  - severity: medium
    issue: 둘째 물음의 의미가 축소됨
    rationale: τί ἐστιν αὕτη ... ἣν νηστεύετε는 ‘너희가 행하는 이 금식은 무엇이냐’라는 표현으로, 단순히 ‘단식하는 것이 무엇이냐’라고 하면 지시와 강조가 흐려집니다.
