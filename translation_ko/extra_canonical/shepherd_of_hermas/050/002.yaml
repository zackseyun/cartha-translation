revisions:
- from: '"역이 뭐예요?" 그가 말했다. 나는 "저는 금식하고 있습니다, 선생님"이라고 말합니다. 그분은 “너희가 단식하는 것이 무엇이냐”고 말씀하십니다. 나는 "선생님, 익숙해졌기 때문에 금식합니다."라고 말합니다.'
  to: “재일[1]이 무엇입니까?” 그가 말씀하셨습니다. 제가 말씀드렸습니다. “주인님, 저는 금식합니다.” 그가 말씀하셨습니다. “너희가 행하는 이 금식은 무엇입니까?” 제가 말씀드렸습니다. “주인님, 저는 늘 하던 대로 금식합니다.”
  rationale: 원문의 문답 순서와 반복되는 ‘금식’ 어휘를 보존했습니다. στατίων은 기술적 의미를 본문에서 간결하게 제시하고 주석으로 설명했으며, ‘늘 하던 대로’로 관례를 나타내는 원문의 뉘앙스를 살렸습니다.
