revisions:
- from: “얼마 후에 종의 주인이 와서 포도원에 들어갔다가 포도원에 울타리가 잘 쳐져 있고 파고 있고 잡초가 뽑혀 있는 것을 보고 종의 행한 일로 말미암아 크게 기뻐하니 주인이 친구와 아들을 다시 불러 그 종이 받은 몫으로 행한 일을 고하니 그들이 그 종이 자기와 공동 상속자가 되도록 더욱 찬성하더라” 아들."
  to: “얼마 후 그 종의 주인[a]이 와서 포도원에 들어갔습니다. 그는 포도원이 울타리로 잘 둘러져 있고, 더욱이 땅이 파여 있으며, 잡초가 모두[b] 뽑혀 있는 것을 보고, 그 종이 한 일로 말미암아 크게 기뻐했습니다. 주인은 다시 자기 친구들과 아들을 불러, 그 종이 자신이 받은 양식으로 행한 일을 그들에게 알렸습니다. 그러자 그들은 그 종이 주인의 아들과 공동 상속자가 되는 것을 더욱더 찬성했습니다.”
  rationale: 원문의 주어·관계어·공동 상속 표현을 회복하고, ‘양식’이라는 문맥상 의미를 반영했습니다. 또한 괄호 친 본문 요소는 독자가 확인할 수 있도록 각주로 처리했으며, 문체는 현대 표준어 합쇼체로 다듬었습니다.
