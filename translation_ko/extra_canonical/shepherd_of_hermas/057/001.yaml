  source_fidelity: 초안은 화자 전환과 인용의 경계가 무너져 있으며, 핵심 대조인 ‘방종하고 속임을 당하는 자들’이 ‘속이는 자들’로 바뀌었습니다. 또한 하루 방종·속임과 하루의 고통이라는 조건절 및 그에 따른 일 년의 비례 관계가 훼손되었습니다. 수정문은 헬라어의 문답 구조와 시간 비례를 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 직접화법을 일관되게 처리했습니다. ‘방종’은 τρυφή의 도덕적·사치스러운 자기 탐닉의 문맥을 간결하게 살리며, ‘괴로움을 당하다’는 반복되는 βασανίζεσθαι를 자연스럽게 반영합니다.
  terminology: κύριε는 ‘주님’으로, ἀπάτη는 문맥상 ‘속임’으로, τιμωρία와 βάσανος의 병치는 ‘형벌과 고통’으로 옮겼습니다. 원문의 표현상 두 용어가 병치되므로 하나로 평준화하지 않았습니다.
  issues:
