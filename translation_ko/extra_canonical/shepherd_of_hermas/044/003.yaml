revisions:
- from: 이제 내가 너희에게 말하노니 만일 너희가 이것을 지키지 아니하고 등한히 여기거든 마귀의 계명을 따르지 말라. 그리고 마귀를 두려워하지 마십시오. 마귀는 여러분을 해칠 힘이 없습니다. 내가 너와 함께 있으리라 나는 그를 다스리는 회개의 천사니라. 마귀는 두려움만 갖고 있을 뿐 그 두려움에는 힘이 없습니다. 그러므로 그를 두려워하지 마십시오. 그러면 그가 여러분에게서 도망갈 것입니다.”
  to: 내가 여러분에게 말합니다. 여러분이 이 계명들을 지키지 않고 소홀히 여긴다면, 어렵고 쓰며 사납고 방탕한 마귀의 계명들을 따르지 마십시오. 또 마귀를 두려워하지 마십시오. 그에게는 여러분을 대적할 힘이 없습니다. 회개의 천사로서 그를 지배하는 내가 여러분과 함께 있겠습니다. 마귀에게는 두려움만 있을 뿐이며, 그의 두려움에는 힘이 없습니다. 그러므로 그를 두려워하지 마십시오. 그러면 그가 여러분에게서 달아날 것입니다.”
  rationale: 누락된 네 수식어를 모두 복원하고, κατακυριεύων의 권세·지배 의미와 καθ' ὑμῶν의 대적 의미를 반영했습니다. 원문에 나타나는 단수와 복수의 호칭 전환은 현대 한국어 합쇼체에서 부자연스럽지 않도록 ‘여러분’으로 통일했으며, 교리적 해석을 추가하지 않았습니다.
