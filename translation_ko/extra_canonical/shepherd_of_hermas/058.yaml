  yaml_path: translation/extra_canonical/shepherd_of_hermas/058.yaml
  text: '“Since,” I say, “sir,[6] I have not understood at all about the time of deception and delight[1] and torment,[2] make it more plain to me.”


    He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found a fool. Listen then,” he says, “as you desire, so that you may understand these things.


    “The person who delights and is deceived for a single day and does what he wants has clothed himself with much foolishness and does not perceive the deed he is doing; for on the next day he forgets what he did the day before. For delight and deception have no memory because of the foolishness with which he has clothed himself. But when punishment and torment cling to a person for one day, he is punished and tormented for up to a year; for punishment and torment have great memory.


    “So, being tormented and punished the whole year, he at last[5] remembers the delight and the deception, and he knows that because of them he suffers the evil things. Every person who delights and is deceived is tormented in this way, because, though they had life, they have handed themselves over to death.”


    “What delights, sir,” I say, “are harmful?”


    He says, “Every deed is a delight to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, takes delight; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore delights in his act. All these delights are harmful to the slaves of God.[3] Therefore, because of these deceptions, those who are punished and tormented suffer.


    “But there are also delights that save people; for many, by doing good things, take delight, being carried along by their own pleasure. This delight, therefore, is beneficial for the slaves of God, and it secures life for such a person;[6] but the harmful delights previously mentioned procure torments and punishments for them; and if they persist and do not repent,[4] they procure death for themselves.”'
translation:
  language: ko
  text: '“제가 말했습니다. ‘주님, 저는 속임의 때와 즐김과 고통에 관해 전혀 이해하지 못했습니다. 더 분명히 알려주십시오.’


    그가 제게 대답하여 말했습니다. “그대의 어리석음은 여전하며, 그대는 자기 마음을 깨끗하게 하고 하나님을 섬기려 하지 않습니다. 때가 차서 그대가 어리석은 사람으로 드러나지 않도록 조심하십시오. 그러니 듣십시오”라고 그가 말했습니다. “그대가 원하는 대로, 이것들을 깨닫게 하겠습니다.


    “하루 동안 즐기며 속는 사람은 자기 뜻대로 행함으로 많은 어리석음을 입은 것이며, 자기가 하는 행위를 알아차리지 못합니다. 다음 날에는 전날에 한 일을 잊어버리기 때문입니다. 즐김과 속임은 그가 입은 어리석음 때문에 기억이 없습니다. 그러나 형벌과 고통이 사람에게 하루 동안 달라붙으면, 그는 일 년까지 형벌을 받고 고통을 겪습니다. 형벌과 고통은 강한 기억을 가지고 있기 때문입니다.


    “그러므로 한 해 내내 고통받고 형벌을 받는 사람은 마침내 즐김과 속임을 기억하고, 그것들 때문에 자기가 악한 것들을 겪는다는 것을 알게 됩니다. 즐기며 속는 모든 사람도 이런 식으로 고통받습니다. 생명을 가지고 있으면서도 자기들을 죽음에 내맡겼기 때문입니다.”


    제가 말했습니다. “주님, 어떤 즐김이 해롭습니까?”


    그가 말했습니다. “사람에게 즐거움이 되는 행위는 무엇이든지, 그가 기쁘게 행하는 것은 다 즐김입니다. 분노가 심한 사람도 자기 욕망을 충분히 채우면 즐기는 것이고, 간음하는 자와 술 취하는 자와 비방하는 자와 거짓말하는 자와 탐욕스러운 자와 가로채는 자와 이와 같은 일을 하는 자도 자기의 병을 충분히 채우는 것입니다. 그러므로 그는 자기 행위에서 즐깁니다. 이런 모든 즐김은 하나님의 종들에게 해롭습니다. 그러므로 이러한 속임들 때문에 형벌을 받는 이들과 고통받는 이들이 고통을 겪습니다.


    “그러나 사람들을 구원하는 즐김들도 있습니다. 많은 이들이 선한 일을 하면서, 자기의 기쁨에 이끌려 즐기기 때문입니다. 그러므로 이런 즐김은 하나님의 종들에게 유익하며, 그런 사람에게 생명을 마련해 줍니다. 그러나 앞서 말한 해로운 즐김들은 그들에게 고통과 형벌을 가져오며, 그들이 계속 머물러 회개하지 않으면 자기들을 위해 죽음을 마련합니다.”[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπάτη / τρυφή
  english_pob_choice: deception / delight, indulgence
  chosen_korean: 속임 / 즐김
  alternatives_korean:
  - 속임수 / 향락
  - 기만 / 유흥
  - 속임 / 향락
  lexicon: ἀπάτη, τρυφή
  rationale: POB의 구분을 살려 ἀπάτη는 ‘속임’, τρυφή는 단순 쾌락보다 행위의 즐김·탐닉을 드러내는 ‘즐김’으로 옮겼습니다.
- source_word: βασάνος / τιμωρία
  english_pob_choice: torment / punishment
  chosen_korean: 고통 / 형벌
  alternatives_korean:
  - 고문 / 벌
  - 괴로움 / 징벌
  - 고통 / 징벌
  lexicon: βασάνος, τιμωρία
  rationale: βασάνος의 강한 고통·가혹함을 ‘고통’으로, τιμωρία는 법적 보응의 뉘앙스를 살려 ‘형벌’로 옮겼습니다.
- source_word: δοῦλοι τοῦ Θεοῦ
  english_pob_choice: slaves of God
  chosen_korean: 하나님의 종들
  alternatives_korean:
  - 하나님의 노예들
  - 하나님의 종
  - 하나님께 속한 종들
  lexicon: δοῦλος
  rationale: 본문의 강한 종속성을 살리되 한국어 가독성과 종교어법을 고려해 ‘종들’로 옮겼고, POB의 문제의식은 ‘하나님의’로 유지했습니다.
- source_word: μετανοήσωσι
  english_pob_choice: repent
  chosen_korean: 회개하지
  alternatives_korean:
  - 뉘우치지
  - 돌이키지
  - 회개하지
  lexicon: μετανοέω
  rationale: 종결 조건절의 종교적·윤리적 결단을 분명히 하기 위해 가장 직접적인 표준어 ‘회개하다’를 사용했습니다.
- source_word: ζωὴν περιποιεῖται
  english_pob_choice: it secures life
  chosen_korean: 생명을 마련해 줍니다
  alternatives_korean:
  - 생명을 얻습니다
  - 생명을 보장합니다
  - 생명을 얻게 합니다
  lexicon: περιποιέω
  rationale: 단순 소유가 아니라 ‘얻어 두다/마련하다’의 결과적 의미를 살려, 보존·획득의 뉘앙스를 함께 담았습니다.
theological_decisions:
- issue: ‘즐김’과 ‘속임’의 이중 구조
  chosen_reading: 즐김은 행위의 쾌락적 몰입, 속임은 그 행위가 주는 인식 왜곡으로 구분해 반복했습니다.
  alternative_readings:
  - 둘 다 단순한 ‘쾌락’으로 통합
  - 둘 다 ‘유혹’으로 일반화
  rationale: 원문은 τρυφή와 ἀπάτη를 병렬로 두어 행위의 즐거움과 그에 따른 자기기만을 함께 경고하므로, 한국어에서도 두 요소를 구분해 드러내야 합니다.
  doctrine_reference: 인간의 자기기만과 죄의 지배에 대한 경고
- issue: ‘생명을 가지고 있으면서도 자기들을 죽음에 내맡겼기 때문입니다’
  chosen_reading: 생명의 선재성을 인정하되, 자발적 자기-인도(내맡김)를 강조했습니다.
  alternative_readings:
  - 원인 없이 ‘죽었습니다’로 단순화
  - 외부의 강제만 강조
  rationale: ἔχοντες ζωὴν εἰς θάνατον ἑαυτοὺς παραδεδώκασι의 긴장을 보존해, 생명을 가진 상태에서 스스로 죽음 쪽으로 넘겨졌다는 책임을 드러냈습니다.
  doctrine_reference: 인간 책임과 자초한 심판
