  source_fidelity: 초안은 ἐπιθυμία πονηρά를 ‘악한 일’로 옮겨 핵심 명사인 ‘악한 욕망’을 놓쳤고, 복수형 ἔργα 및 ‘그것들’의 지시도 충분히 반영하지 못했습니다. 또한 ἐν ποίοις ἔργοις를 ‘어떤 행위로’로 명확히 옮길 필요가 있습니다.
  naturalness: 초안의 ‘내가 말하노니’, ‘주여’, ‘나로 … 하소서’는 요청된 현대 표준 한국어 합쇼체에 맞지 않습니다. 직접화법의 인용 범위와 문장부호도 자연스럽게 정리했습니다.
  terminology: ἐπιθυμία는 문맥상 일관되게 ‘욕망’으로, δοῦλοι τοῦ Θεοῦ는 ‘하나님의 종들’로 옮겼습니다. θάνατος는 원문의 표현을 보존하여 ‘죽음’으로 유지했습니다.
