revisions:
- from: 3. 내가 말하노니 주여 무슨 악한 일이 사람을 죽음에 넘겨주나이까 이 일을 내게 알게 하여 나로 그들을 멀리하게 하소서 “들어보세요” [그는 말한다] “악한 욕망이 어떤 행위로 하나님의 종들을 죽이는가.”
  to: 3. 제가 말했습니다. “주님, 악한 욕망의 어떤 행위들이 사람들을 죽음에 넘겨줍니까? 제가 그것들을 멀리하도록 제게 알려 주십시오.” “들으십시오. [그가 말합니다.] 악한 욕망이 어떤 행위들로 하나님의 종들을 죽음에 이르게 하는지 말입니다.”
  rationale: 원문의 질문·응답 구조를 분명히 하고, ‘악한 욕망’ 및 그에 속한 복수의 ‘행위들’이라는 문법적 관계를 보존했습니다. ἀφέξομαι의 목적을 ‘그것들을 멀리하도록’으로 자연스럽게 옮겼으며, 죽음에 ‘넘겨주다’와 ‘죽음에 이르게 하다’라는 원문의 표현을 각각 유지했습니다. 대괄호로 표시된 발화 표지는 본문 비평상의 불확정성을 보존하기 위해 유지했습니다.
