  - severity: medium
    issue: 복수형과 지시 대상의 불명확성
    rationale: ἔργα와 τὰ παραδιδόντα는 복수이며, ἀπ’ αὐτῶν은 그 행위들을 가리킵니다. 이를 ‘어떤 행위들’, ‘그것들’로 반영해야 합니다.
  - severity: medium
    issue: 현대 합쇼체 register 미준수
    rationale: ‘말하노니/주여/하소서’는 고풍스러운 문체이므로 현대 정중체로 고쳐야 합니다.
