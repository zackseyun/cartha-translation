  text: 3. 내가 말하노니 주여 무슨 악한 일이 사람을 죽음에 넘겨주나이까 이 일을 내게 알게 하여 나로 그들을 멀리하게 하소서 “들어보세요” [그는 말한다] “악한 욕망이 어떤 행위로 하나님의 종들을 죽이는가.”
