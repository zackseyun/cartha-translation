review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the overall warning, but δαπανᾷ (“consumes/ruins”) is repeatedly rendered as “멸망시키다,” which is stronger and can blur the source’s distinction between being grievously harmed and being finally “handed over to death.” συνετός is more specifically “sensible/discerning” than “깨닫지 못하다.”
  naturalness: The draft uses archaic biblical endings (e.g., -나니, -느니라, 아니하고), rather than the requested modern formal-polite 합쇼체. Its long unpunctuated sequence also obscures the Greek argument.
  terminology: “하나님의 종,” “선한 욕망,” “악한 욕망,” and “사망” are suitable. “이 세대” appropriately preserves αἰών without importing a more specific doctrinal interpretation.
  issues:
  - severity: medium
    issue: Modern formal-polite register is not maintained.
    rationale: The requested target register is modern 합쇼체, whereas the draft consistently employs archaic scriptural-style endings.
  - severity: medium
    issue: ‘멸망시키다’ overstates δαπανᾷ in its repeated occurrences.
    rationale: The verb denotes consuming, exhausting, or grievously ruining; the final clause separately states that evil desire hands people over to death. Rendering both with destruction language weakens that progression.
  - severity: low
    issue: ‘깨닫지 못하면’ is less precise than a term for discernment.
    rationale: συνετός means sensible, prudent, or discerning in this context.
  revised_text: 2. “악한 욕망은 사납고 길들이기 어렵습니다. 그것은 무섭고, 그 사나움으로 사람들을 크게 해칩니다. 특히 하나님의 종이 그것에 빠져 분별력이 없으면, 그것에게 심한 해를 입습니다. 악한 욕망은 선한 욕망의 옷을 입지 않고 이 세대에 얽매여 있는 그런 사람들을 해칩니다. 그러므로 그것은 이들을 사망에 넘겨줍니다.”
