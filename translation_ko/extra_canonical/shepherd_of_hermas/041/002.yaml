revisions:
- from: 2. “악한 욕망은 사납고 길들이기 어렵고 무섭고 그 흉악함으로 사람을 심히 멸망시키나니 만일 하나님의 종이 이에 빠져 깨닫지 못하면 더욱 심히 멸망하느니라 이런 사람들 곧 선한 욕망의 옷을 입지 아니하고 이 세대에 얽매인 자들을 멸망시키느니라 그러므로 이 사람들은 사망에 넘겨지느니라”
  to: 2. “악한 욕망은 사납고 길들이기 어렵습니다. 그것은 무섭고, 그 사나움으로 사람들을 크게 해칩니다. 특히 하나님의 종이 그것에 빠져 분별력이 없으면, 그것에게 심한 해를 입습니다. 악한 욕망은 선한 욕망의 옷을 입지 않고 이 세대에 얽매여 있는 그런 사람들을 해칩니다. 그러므로 그것은 이들을 사망에 넘겨줍니다.”
  rationale: The revision preserves the source’s metaphor of wildness and taming, distinguishes repeated grievous harm from the concluding delivery to death, renders συνετός as discernment, and uses clear modern formal-polite Korean. No footnote is required because the translation preserves the source’s imagery and does not resolve a disputed ambiguity.
