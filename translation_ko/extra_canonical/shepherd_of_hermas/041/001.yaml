revisions:
- from: 그분께서 나에게 이르시되 모든 악한 욕망을 네게서 버리고 선하고 고상한 욕망을 입으라 네가 이 욕망을 입으면 악한 욕망을 미워하고 네 뜻대로 제어하리라.
  to: 그분께서 제게 말씀하셨습니다. “자신에게서 모든 악한 욕망을 버리고, 선하고 고상한 욕망을 입으십시오. 이 욕망을 입으면 악한 욕망을 미워하게 되고, 원하는 대로 그것을 제어하게 될 것입니다.”
  rationale: 원문의 화자 표시는 문맥 밖에서 특정하지 않고 '그분'으로 유지했습니다. ἐπιθυμία의 반복은 '욕망'으로 보존했으며, ἐνδύω의 비유는 '입다'로, χαλιναγωγέω는 의미를 과도하게 확장하지 않고 '제어하다'로 옮겼습니다. 현대 합쇼체에 맞추어 명령과 미래 결과를 정리했습니다.
