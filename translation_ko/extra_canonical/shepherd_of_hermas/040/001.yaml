revisions:
- from: 1. 그는 나에게 벤치에 앉아 있는 남자와 의자에 앉아 있는 남자를 보여주었다. 그리고 그는 나에게 “벤치에 앉아 있는 사람들이 보이나요?”라고 말했습니다. “알겠습니다, 선생님.” 내가 말했다. “저 사람들은 신실하며 의자에 앉은 자는 거짓 선지자니 하나님의 종들 곧 두 마음을 품은 자들의 지각을 멸하고 충실한 자들의 생각을 멸하는 자니이다”라고 그는 말합니다.
  to: 1. 그가 나에게 긴 의자에 앉아 있는 사람들과 의자에 앉아 있는 다른 한 사람을 보여 주었습니다. 그가 나에게 말씀하셨습니다. “긴 의자에 앉아 있는 사람들이 보입니까?” 내가 말했습니다. “보입니다, 주님.” 그가 말씀하셨습니다. “이 사람들은 신실한 사람들입니다. 의자에 앉아 있는 사람은 거짓 선지자입니다. 그는 하나님의 종들, 곧 두 마음을 품은 사람들의 지각을 파멸시키지만, 신실한 사람들의 지각을 파멸시키지는 않습니다.”
  rationale: 원문의 수, 문답, 부정 대조를 회복했습니다. ‘두 마음을 품은’은 δίψυχοι의 비유적 표현을 보존하며, 본 절만으로 특정 교리적 해석을 덧붙이지 않았습니다.
