revisions:
- from: 3. 그분은 비어 계시지만, 빈 사람들에게 헛된 것으로 응답하십니다. 무엇을 구하시든지 그 사람의 공허함에 따라 대답하시기 때문입니다. 그러나 그는 또한 몇 가지 진실한 말을 합니다. 마귀가 그 사람에게 자기 영을 가득 채워 주기 때문입니다. 혹시 그 사람이 의로운 사람 가운데 몇 사람을 빼앗을 수만 있다면 말입니다.
  to: 3. 그는 공허하기 때문에 공허한 사람들에게 헛된 것들로 대답합니다. 그가 무엇을 질문받든, 그 사람의 공허함에 따라 대답합니다. 그러나 그는 또한 몇 마디 참된 말을 합니다. 마귀가 의로운 사람들 가운데 누군가를 혹시라도 무너뜨릴 수 있을까 하여 자기 영으로 그를 채우기 때문입니다.
  rationale: 거짓 예언자에 대한 부적절한 존칭을 제거하고, κενός/κένωμα의 반복을 ‘공허한/헛된’으로 유지했습니다. 또한 마귀의 목적을 나타내는 εἴ τινα δυνήσεται ῥῆξαι를 불확실성을 보존하여 ‘혹시라도 … 무너뜨릴 수 있을까 하여’로 옮겼습니다.
