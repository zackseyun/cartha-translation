revisions:
- from: 12. 첫째, 영이 있는 것 같은 그 사람은 자기를 높여 첫째 자리를 차지하려고 합니다. 그리고 즉시 그는 주제넘고 수치심이 없고 말이 많으며 많은 사치와 많은 다른 속임수 속에서 살며 그의 예언에 대한 대가를 받습니다. 만일 받지 못하면 예언하지 아니하느니라. 신의 영이 대가를 받고 예언할 수 있습니까? 하나님의 선지자는 이런 일을 할 수 없습니다. 오히려 그러한 선지자들의 영은 세상적인 것입니다.
