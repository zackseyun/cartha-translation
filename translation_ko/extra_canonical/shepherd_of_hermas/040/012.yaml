  terminology: ‘하나님의 영’, ‘하나님의 선지자’, ‘땅에 속한 영’으로 통일하면 θεῖος/Θεός 및 ἐπίγειος의 대조가 더 분명해집니다. ‘예언’과 ‘선지자’는 본문 문맥에서 무리 없이 유지할 수 있습니다.
