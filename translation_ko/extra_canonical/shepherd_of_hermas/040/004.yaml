revisions:
- from: 4. 그러므로 주의 믿음이 강하고 진리를 옷 입은 자들은 이런 귀신을 좇지 말고 도리어 멀리하라. 그러나 두 마음을 품고 ​​자주 회개하는 자들은 이방인과 같이 점을 행하고 우상 숭배를 하여 더 큰 죄를 스스로 짓느니라 무슨 일에든지 거짓 선지자에게 문의하는 자는 우상 숭배자요 진리가 없고 어리석은 자니라.
  to: 4. 그러므로 주의 믿음 안에서 강하고 진리를 입은 이들은 그러한 영들에게 붙지 않고 그들에게서 멀리합니다. 그러나 두 마음을 품고 자주 회개하는 이들은 이방인들처럼 점을 치며, 우상 숭배를 함으로써 자신들에게 더 큰 죄를 더합니다. 어떤 일에 관하여 거짓 예언자에게 묻는 사람은 우상 숭배자이며, 진리가 없고 어리석은 사람입니다.
  rationale: 원문의 의미와 논리적 대비를 보존하면서, πνεῦμα를 ‘귀신’으로 협소하게 해석하지 않고 ‘영’으로 옮겼습니다. 또한 직역투와 문장부호 오류를 바로잡아 현대 표준어 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:52Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 대조 구조(‘그러나’)와 핵심 진술은 대체로 반영되었습니다. 다만 τοῖς τοιούτοις πνεύμασιν은 ‘이런 귀신’보다 가치 판단을 덜 덧붙이는 ‘그러한 영들’로 옮기는 편이 적절하며, ‘점을 행하고’는 μαντεύονται의 자연스러운 한국어 표현으로 다듬을 필요가 있습니다.
  naturalness: 초안에는 ‘진리를 옷 입은’, ‘귀신을 좇지 말고’, ‘스스로 짓느니라 무슨’ 등 현대 표준어 문체와 문장부호 면에서 다듬을 부분이 있습니다. 합쇼체의 현대적 격식 문장으로 정리했습니다.
  terminology: πνεῦμα는 여기서 참된 예언의 영과 대비되는 대상이므로 ‘귀신’으로 한정하지 않고 ‘영’으로 유지했습니다. δίψυχοι는 직역적이며 문맥상 적합한 ‘두 마음을 품은 이들’로, εἰδωλολατροῦντες는 ‘우상 숭배를 함으로써’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘이런 귀신’
    rationale: 원문의 πνεύμασιν은 본문 안에서 신적 영과 거짓 예언의 영을 대조하는 폭넓은 ‘영’입니다. ‘귀신’은 한국어에서 악령으로 의미를 좁히므로 ‘그러한 영들’이 더 충실합니다.
  - severity: medium
    issue: 문장 연결 및 종결 표현
    rationale: ‘스스로 짓느니라 무슨 일에든지’는 문장부호가 빠져 있으며, 전체 문장이 현대 합쇼체의 일관된 종결형을 따르지 않습니다.
  - severity: low
    issue: ‘점을 행하고’ 및 ‘문의하는’
    rationale: 현대 한국어에서는 ‘점을 치며’, ‘묻는’이 더 자연스럽고 원문의 의미를 충분히 보존합니다.
