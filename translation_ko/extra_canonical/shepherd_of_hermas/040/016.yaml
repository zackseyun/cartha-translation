  text: 20. 이제 위로부터 오는 능력을 받으라. 우박은 아주 작은 알갱이인데, 그것이 사람의 머리에 떨어지면 얼마나 큰 고통을 주는가! 또는 다시 기와에서 땅으로 떨어지는 한 방울을 가져다가 돌을 뚫습니다.
