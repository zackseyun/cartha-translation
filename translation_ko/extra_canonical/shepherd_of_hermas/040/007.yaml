revisions:
- from: 7. 내가 말하노니 선생님이여 그 중에 누가 선지자이고 누가 거짓 선지자인지 사람이 어찌 알리이까 “두 선지자의 말을 들으라 내가 너희에게 이르는 도로서 너희가 선지자와 거짓 선지자를 시험하되 신령에 속한 자를 그의 생활로 시험하라”고 말씀하십니다.
  to: 7. “그러면, 주인님, 사람이 누가 예언자이고 누가 거짓 예언자인지 어떻게 알 수 있습니까?” 제가 물었습니다. 그가 말씀하셨습니다. “두 예언자에 관하여 들으십시오. 내가 이제 당신에게 말하려는 대로 예언자와 거짓 예언자를 분별하십시오. 신적인 영을 지닌 사람은 그의 삶을 보고 분별하십시오.”
  rationale: 원문의 대화 구조, 단수 청자, ‘신적인 영을 지닌 사람’이라는 수식 관계, 그리고 삶을 기준으로 하는 판별의 뜻을 보존하면서 현대 표준 한국어 합쇼체로 다듬었습니다.
