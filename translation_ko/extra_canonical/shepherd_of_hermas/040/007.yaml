  source_fidelity: 초안은 예언자와 거짓 예언자를 삶으로 시험하라는 중심 뜻을 대체로 전달하지만, 1인칭 화자 표현과 호칭, 단수 청자, 그리고 ‘신적인 영을 지닌 사람’을 시험하라는 문법적 대상을 충분히 정확히 반영하지 못합니다.
  naturalness: ‘내가 말하노니’, ‘알리이까’, ‘이르는 도로서’, ‘신령에 속한 자’는 현대 표준 한국어 합쇼체에 비해 고어적이거나 부자연스럽습니다. 직접화법의 화자 전환도 명시하는 편이 자연스럽습니다.
  terminology: προφήτης/ψευδοπροφήτης는 ‘예언자/거짓 예언자’로, πνεῦμα τὸ θεῖον은 교단적으로 한정하지 않고 ‘신적인 영’으로 옮기는 것이 적절합니다. δοκιμάζω는 여기서 ‘시험하다’보다 사람을 판별한다는 문맥에 맞게 ‘분별하다’로 옮겼습니다.
