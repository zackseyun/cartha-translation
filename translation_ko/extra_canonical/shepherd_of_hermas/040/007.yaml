    rationale: 원문은 ‘신적인 영을 지닌 사람’(τὸν ἄνθρωπον τὸν ἔχοντα τὸ πνεῦμα τὸ θεῖον)을 가리키며, 초안의 표현은 의미를 다소 달리하고 현대어로도 부자연스럽습니다.
  - severity: low
    issue: δοκιμάζω의 문맥적 번역
    rationale: 예언자와 거짓 예언자를 구별하는 문맥이므로 ‘분별하십시오’가 ‘시험하라’보다 한국어에서 뜻을 더 명확히 드러냅니다.
