revisions:
- from: 13. 그리고 의인들이 모이는 곳에는 전혀 가까이 가지 않으시고 피하십니다. 그는 두 마음을 품은 자들과 헛된 자들을 붙들고 한구석에서 그들에게 예언하며 모든 것을 그들의 뜻대로 헛되이 말하여 그들을 속이고 왜냐하면 그분께서는 빈 것에도 응답하시기 때문입니다. 빈 그릇은 빈 그릇과 함께 놓으면 깨지지 아니하고 서로 합하느니라.
  to: 13. 그러고 나서 그는 의로운 사람들이 모이는 곳에는 전혀 가까이 가지 않고 그들을 피합니다. 그는 두 마음을 품은 자들과 헛된 자들에게 달라붙어, 구석에서 그들에게 예언하며 그들의 욕망에 따라 모든 것을 헛되이 말하여 그들을 속입니다. 그가 헛된 자들에게 대답하는 것도 그러하기 때문입니다. 빈 그릇은 빈 그릇들과 함께 놓여도 깨지지 않고, 서로 잘 맞습니다.
  rationale: 원문의 대조 구조(의로운 이들의 모임을 피함/두 마음을 품고 헛된 이들에게 달라붙음), ‘욕망에 따라’라는 기만의 방식, 그리고 빈 그릇의 비유를 보존했습니다. 거짓 예언자에 대한 불필요한 높임말을 제거하고, 현대 표준 한국어 합쇼체로 문장 구조와 종결을 정리했습니다.
