  - severity: medium
    issue: ‘붙들고’ 및 ‘빈 것에도 응답’이 원문의 대상과 관계를 불명확하게 함
    rationale: κολλᾶται는 ‘달라붙다’이며, κενοῖς는 ‘헛된 자들’이라는 사람들을 가리킵니다.
