  source_fidelity: 초안은 전반적인 논지를 따르지만, 거짓 예언자를 높임말 주어(‘가시고/피하십니다’, ‘그분’)로 지칭하여 문체상 부정확하며, ‘붙들고’는 κολλᾶται(달라붙다)의 의미를 충분히 반영하지 못합니다. 또한 ‘빈 것에도 응답’은 사람들을 가리키는 복수 여격 κενοῖς를 ‘헛된 자들에게도 대답한다’로 옮기는 것이 정확합니다.
  naturalness: 원문 초안의 ‘말하여 그들을 속이고 왜냐하면’은 접속이 비문에 가깝고, 마지막 ‘합하느니라’는 요청된 현대 합쇼체와 맞지 않습니다. 문장을 나누고 현대적인 연결 표현을 사용해야 합니다.
  terminology: διψύχοι는 ‘두 마음을 품은 자들’로 유지할 수 있으며, κενός 계열은 이 단락의 반복과 비유를 살려 ‘헛된 자들/빈 사람들’ 및 ‘빈 그릇’으로 일관되게 처리했습니다. ‘예언하다’는 본문의 주장 내용을 중립적으로 재현합니다.
