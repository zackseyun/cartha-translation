review_pass:
  verdict: revise
  source_fidelity: 초안은 첫 번째 τὸ πνεῦμα τὸ θεῖον을 곧바로 ‘성령’으로 옮겨, 뒤의 명시적 τῷ πνεύματι τῷ ἁγίῳ와의 표현상 구별을 흐립니다. 또한 현재형 λαλεῖ를 과거형 ‘말했습니다’로 옮겼고, ‘그에게 맡겨진’은 πρὸς αὐτόν(그 곁에 있는/그와 함께 있는)에 비해 해석을 더했습니다.
  naturalness: 초안의 ‘그 사람들이 모여 하나님께 중보하면’은 주어와 구조가 다소 중복되며, 문장 말미의 ‘충만케 하고 그리고’는 현대 한국어 합쇼체 문장으로 부자연스럽습니다.
  terminology: θεῖον πνεῦμα는 이 절에서 ‘하나님의 영’으로, 명시적으로 ἅγιον이라 한 곳은 ‘성령’으로 번역하여 원문의 용어 구별을 보존했습니다. ἔντευξις는 문맥에 맞게 ‘중보 기도’로 옮겼습니다.
  issues:
