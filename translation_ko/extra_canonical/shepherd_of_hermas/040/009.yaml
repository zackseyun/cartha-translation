revisions:
- from: 9. 그러므로 성령을 받은 사람이 성령을 믿는 의인들의 모임에 와서 그 사람들이 모여 하나님께 중보하면 그에게 맡겨진 예언의 영의 사자가 그 사람을 충만케 하고 그리고 그는 성령으로 충만하여 주님의 뜻대로 무리에게 말했습니다.
  to: 9. 그러므로 하나님의 영을 가진 사람이 하나님의 영에 대한 믿음을 지닌 의인들의 모임에 들어가고, 그 사람들의 모임이 하나님께 중보 기도를 드리면, 그 곁에 있는 예언의 영의 천사가 그 사람을 충만하게 합니다. 그러면 그는 성령으로 충만해져, 주님께서 바라시는 대로 무리에게 말합니다.
  rationale: 원문의 용어 구별(‘하나님의 영’과 ‘성령’), 현재 시제, 그리고 예언의 영의 천사가 그 사람 ‘곁에 있다’는 표현을 보존했습니다. ‘중보 기도’는 ἔντευξις의 문맥상 의미를 자연스러운 현대 한국어로 전달합니다.
