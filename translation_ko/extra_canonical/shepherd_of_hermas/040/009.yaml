    issue: ‘성령을 받은 사람’
    rationale: 원문은 ‘신적인/하나님의 영을 가진 사람’이며, 뒤의 ‘성령으로 충만하여’와 구별됩니다.
  - severity: medium
    issue: ‘그에게 맡겨진 예언의 영의 사자’
    rationale: πρὸς αὐτὸν은 ‘그 곁에 있는’이라는 위치·관계 표현으로, ‘맡겨진’은 원문에 없는 역할 규정을 보탭니다.
  - severity: medium
    issue: ‘말했습니다’
    rationale: λαλεῖ는 현재형이므로 일반적·반복적 상황을 나타내는 현재형으로 번역해야 합니다.
  - severity: low
    issue: 문장 연결과 중복된 주어
    rationale: ‘그 사람들이 모여… 중보하면’ 및 ‘충만케 하고 그리고’는 원문의 흐름을 한국어에서 매끄럽게 전달하지 못합니다.
