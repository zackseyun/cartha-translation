revisions:
- from: 급한 성격은 우선 어리석고 경솔하고 무의미합니다. 그러면 무의미함에서 괴로움이 옵니다. 괴로움, 분노에서; 분노, 분노에서; 분노에서 분노. 그러면 수많은 악으로 구성된 분노는 크고 치료할 수 없는 죄가 됩니다.
  to: 성급한 분노는 먼저 어리석고 경솔하며 분별이 없습니다. 이어서 그 무분별함에서 쓴 마음이 생기고, 쓴 마음에서 격분이, 격분에서 분노가, 분노에서 격노가 생깁니다. 그러고 나서 이처럼 많은 악으로 이루어진 격노는 크고 고칠 수 없는 죄가 됩니다.
  rationale: 원문의 단계적 수사와 반복을 한국어에서 읽히도록 ‘생기고’와 병렬 구조로 재구성했습니다. 정동 용어들은 완전히 동일시하지 않고 구별하되, 원문의 상승적 흐름을 유지했습니다.
