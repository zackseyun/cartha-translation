  source_fidelity: 현 초안은 ὀξυχολία에서 비롯되는 단계적 전개(무분별함→쓴맛/괴로움→θυμός→ὀργή→μῆνις)를 여러 번 ‘분노’로 중복하거나 문장 단위가 무너진 형태로 옮겨, 그리스어 원문의 논리와 의미를 보존하지 못합니다. 개정문은 각 단계와 ‘크고 고칠 수 없는 죄’라는 결론을 보존합니다.
  naturalness: 현 초안의 “괴로움, 분노에서; 분노, 분노에서”는 비문입니다. 개정문은 현대 표준 한국어의 합쇼체로 인과관계를 자연스럽고 명료하게 제시합니다.
  terminology: ὀξυχολία는 문맥상 지속적 성품/정동을 가리키므로 ‘성급한 분노’로, πικρία는 ‘쓴 마음’, θυμός·ὀργή·μῆνις의 상승은 각각 ‘격분·분노·격노’로 구별했습니다. ἁμαρτία μεγάλη καὶ ἀνίατος는 교파적 해석을 더하지 않고 ‘크고 고칠 수 없는 죄’로 직역적 의미를 유지했습니다.
