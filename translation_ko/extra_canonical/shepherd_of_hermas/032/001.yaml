revisions:
- from: “오래 참고 지혜로우라 그리하면 네가 모든 악한 일을 다스리며 모든 의로운 일을 행하리라 너희가 오래 참으면 너희 속에 거하시는 성령이 순결하여 다른 악한 영에 의해 어두워지지 아니하시고 넓은 곳에 거하시면 그 있는 그릇으로 말미암아 즐거워하며 하나님을 섬기며 그 자체가 형통하리로다”라고 말씀하십니다.
  to: 그가 말합니다. “오래 참고 분별력을 가지십시오. 그러면 모든 악한 일을 제압하고 모든 의를 행하게 될 것입니다. 여러분이 오래 참으면, 여러분 안에 거하시는 성령께서는 다른 악한 영에게 어두워지지 않으시고 순결하실 것입니다. 오히려 넓은 곳에 거하시며, 자신이 거하시는 그릇과 함께 기뻐하고 즐거워하실 것이며, 자신 안에 풍성함을 지니시고 큰 기쁨으로 하나님을 섬기실 것입니다.”
  rationale: 원문의 두 문장(§§1–2)을 모두 보존하고, 단수로 시작한 권면이 인용 안에서 일반적 청자 복수로 전환되는 초안의 불일치를 해소하기 위해 전체를 공손한 복수 청자 ‘여러분’으로 통일했습니다. 다만 원문 자체는 단수이므로, 더 엄격한 문법적 일치를 원할 경우 ‘너는/네 안에’로 일관되게 바꿀 수 있습니다. 본문에서는 현대 합쇼체의 자연스러운 독자 호칭을 우선했습니다.
  reviewer_model: gpt-5.6-terra
