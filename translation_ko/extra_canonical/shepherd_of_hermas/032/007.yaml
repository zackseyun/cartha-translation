revisions:
- from: 그러므로 급한 성질, 곧 가장 악한 영을 피하고 오래 참음을 옷 입고 급한 성질과 악독을 대적하십시오. 그러면 여러분은 주님께서 사랑하시는 품위를 얻게 될 것입니다. 그러므로 여러분은 이 명령을 결코 무시하지 않도록 주의하십시오. 너희가 이 명령을 익히면 내가 너희에게 내리는 다른 명령도 지킬 수 있을 것이기 때문이다. 그 안에서 강해지고 힘을 얻으십시오[-]. 그리고 그 안에서 걷기를 원하는 모든 사람이 힘을 얻도록 하십시오.”
  to: 그러므로 가장 악한 영인 성급한 분노를 피하고, 오래 참음을 옷 입으십시오. 성급한 분노와 쓴 마음을 대적하십시오. 그러면 여러분은 주님께서 사랑하시는 품위를 지닌 이로 드러날 것입니다. 그러므로 이 명령을 결코 소홀히 하지 않도록 주의하십시오. 여러분이 이 명령을 잘 지키게 되면, 내가 앞으로 여러분에게 명할 다른 명령들도 지킬 수 있을 것입니다. 이 명령들 안에서 굳세어지고 강건해지십시오. 또한 그 명령들 안에서 행하고자 하는 모든 사람이 강건해지기를 바랍니다.”
  rationale: 원문의 어휘 대조(ὀξυχολία, πικρία, μακροθυμία, σεμνότης)를 반영하고, ‘이 명령을 지배하다’라는 표현은 한국어에서 자연스럽게 ‘잘 지키게 되면’으로 처리했습니다. 수신자 호칭을 ‘여러분’으로 통일했으며, 불필요한 편집 표기를 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:56Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 권면의 흐름은 대체로 반영했으나, ὀξυχολία와 πικρία의 구별, μετὰ τῆς σεμνότητος의 의미, κυριεύσῃς의 ‘숙달/지배’의 뉘앙스, 그리고 마지막 수동 명령형을 더 정확히 옮길 필요가 있습니다.
  naturalness: 초안은 ‘여러분’과 ‘너희’가 섞여 있고, ‘그 안에서 걷기’, ‘힘을 얻도록 하십시오’가 부자연스럽거나 원문의 명령 방식과 다릅니다. 대시 표기([-])도 삭제되어야 합니다.
  terminology: ὀξυχολία는 ‘급한 성질’보다 ‘성급한 분노’가 문맥상 더 명확하며, πικρία는 ‘악독’이 아니라 ‘쓴 마음’ 또는 ‘쓴 감정’입니다. μακροθυμία는 ‘오래 참음’으로 유지할 수 있으며, σεμνότης는 ‘품위’로 옮길 수 있습니다.
  issues:
  - severity: medium
    issue: ‘악독’
    rationale: πικρία는 ‘악독’이 아니라 bitterness, 곧 ‘쓴 마음/쓴 감정’입니다.
  - severity: medium
    issue: ‘품위를 얻게 될 것입니다’
    rationale: μετὰ τῆς σεμνότητος는 품위를 단순히 획득한다기보다, 주님께 사랑받는 품위와 함께 있는 상태를 가리킵니다.
  - severity: medium
    issue: 대명사 혼용 및 마지막 명령의 의미
    rationale: ‘여러분/너희’가 혼용됩니다. 또한 πάντες ἐνδυναμούσθωσαν은 ‘모든 사람이 강건해지게 하십시오’보다 ‘모든 사람이 강건해지기를 바랍니다/강건해지게 하십시오’의 수동적 권면으로 옮겨야 합니다.
  - severity: low
    issue: '[-] 표기 잔존'
    rationale: 영어 원문의 편집 표지를 한국어 본문에 남길 이유가 없습니다.
