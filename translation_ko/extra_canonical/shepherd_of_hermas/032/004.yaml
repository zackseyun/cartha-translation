  source_fidelity: 원문의 핵심 대비와 비유는 대체로 반영되었으나, ‘주님께서 그 안에 거하신다’(καὶ ἐν αὐτῇ κατοικεῖ)라는 절이 빠졌습니다. 또한 ὀξυχολία는 단순히 ‘급한 성격’이나 ‘빠른 성품’보다 성급하게 일어나는 분노를 가리키므로 ‘성급한 분노’가 더 충실합니다.
  naturalness: 초안은 전반적으로 자연스럽지만 ‘여러분도 알다시피’는 단수 명령형인 βλέπεις를 복수의 관용적 표현으로 바꾸고, ‘하나님께 유익이 되지 않습니다’는 하나님에게 이익이 된다는 뜻으로 읽힐 수 있습니다. ‘하나님께 더 이상 쓸모없게 됩니다’가 자연스럽고 원의에 맞습니다.
  terminology: ‘오래 참음’은 μακροθυμία에 적절합니다. ‘주님께 봉사할 수 있는’은 εὔχρηστος(쓸모 있는, 유용한)의 의미를 다소 의역하므로 ‘주님께 쓸모 있는’으로 바로잡았습니다. 본문에 각각 ‘주님’과 ‘하나님’이 쓰인 원문의 호칭 구별도 유지했습니다.
  issues:
  - severity: high
    issue: ‘주님께서 그 안에 거하신다’는 절이 누락되었습니다.
    rationale: 그리스어 본문과 영어 POB 모두 오래 참음이 주님께 쓸모 있을 뿐 아니라 주님께서 그 안에 거하신다고 진술합니다.
  - severity: medium
    issue: ὀξυχολία를 ‘급한 성격/빠른 성품’으로 옮겼습니다.
    rationale: 이 말은 성격 일반보다 급하고 격한 분노를 뜻하므로 ‘성급한 분노’가 문맥과 어휘 의미를 더 잘 보존합니다.
  - severity: medium
    issue: ‘하나님께 유익이 되지 않습니다’는 εὔχρηστος의 의미를 부정확하게 전달합니다.
    rationale: 여기서는 하나님께 이득을 준다는 뜻이 아니라 하나님께 쓰임에 적합하다는 뜻입니다.
  - severity: low
    issue: ‘여러분도 알다시피’가 원문의 단수 권유를 복수 독자 호명으로 확장합니다.
    rationale: ‘그러므로 보십시오’는 원문의 직접적 호소를 유지하면서 현대 한국어 합쇼체에도 자연스럽습니다.
