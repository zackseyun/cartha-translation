revisions:
- from: 그러므로 여러분도 알다시피 오래 참음은 꿀보다 더 달고 주님께 봉사할 수 있는 것입니다. 그러나 급한 성격은 쓰라리고 쓸모가 없습니다. 그러므로 빠른 성품과 오래 참음이 섞이면 오래 참음은 더럽혀지고 더 이상 하나님께 유익이 되지 않습니다. 오래 참음은 언제나 그 안에 쓴 것이 없고 항상 온화하고 조용합니다. 그러므로 이 오래 참음은 온전한 믿음을 가진 사람들과 함께 거합니다.
