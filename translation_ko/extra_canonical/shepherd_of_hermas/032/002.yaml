revisions:
- from: 그러나 급한 성격을 띠면 온유하신 성령이 즉시 비좁아져서 깨끗한 곳이 없게 되어 그곳을 떠나려고 애쓰시느니라. 이는 악령에게 막혀 자기의 뜻대로 주를 섬길 수 없고 급한 성질로 더럽혀짐이라. 주님께서는 오래 참음 안에 거하시지만, 마귀는 급한 성격을 갖고 있습니다. 그러므로 두 영이 한 곳에 함께 거하면 그 안에 거하는 사람에게는 무익하고 해가 됩니다.
  to: 그러나 성급한 분노가 닥쳐오면, 부드러우신 성령께서는 곧 답답함을 겪으십니다. 깨끗한 거처를 얻지 못하시므로 그곳을 떠나려 하십니다. 성령께서는 악한 영에게 짓눌리고 성급한 분노로 더럽혀져, 바라시는 대로 주님을 섬길 자리를 얻지 못하십니다. 오래 참음 안에는 주님께서 거하시고, 성급한 분노 안에는 마귀가 거합니다. 그러므로 이 두 영이 한 사람 안에 함께 거하면, 그 영들이 거하는 그 사람에게 유익하지 않고 해롭습니다.
  rationale: 원문의 조건절, 성령의 압박과 떠나려는 의도, 악한 영과 성급한 분노가 방해하는 방식, 그리고 주님과 마귀의 거처에 관한 병행 대조를 보존했습니다. 신학적 체계화 없이 본문의 비유적·권면적 언어를 그대로 유지했습니다.
