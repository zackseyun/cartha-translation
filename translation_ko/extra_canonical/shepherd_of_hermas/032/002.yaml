review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 대조와 결론을 대체로 따르지만, ὀξυχολία가 ‘닥쳐오는’ 상황이라는 표현과 ‘마귀가 급한 성격 안에 거한다’는 대조를 정확히 옮기지 못했습니다. 또한 성령이 ‘비좁아진다’기보다 거처가 협소해짐을 겪는다는 뜻입니다.
  naturalness: ‘급한 성격을 띠면’, ‘깨끗한 곳이 없게 되어’ 및 ‘애쓰시느니라’는 현대 표준어 합쇼체 문맥에서 부자연스럽거나 의미 관계가 흐립니다. 문장을 정리하면 원문의 반복과 인과관계가 자연스럽게 드러납니다.
  terminology: μακροθυμία는 이 문맥에서 ‘오래 참음’으로, ὀξυχολία는 지속적 성격 규정보다 갑작스러운 ‘성급한 분노’로 옮겼습니다. πνεῦμα τὸ ἅγιον, πονηρὸν πνεῦμα, διάβολος은 각각 ‘성령’, ‘악한 영’, ‘마귀’로 구별했습니다.
  issues:
  - severity: high
    issue: ‘마귀는 급한 성격을 갖고 있습니다’
    rationale: 원문 ἐν δὲ τῇ ὀξυχολίᾳ ὁ διάβολος은 마귀가 성급한 분노 ‘안에 거한다’는 병행 대조이지, 마귀의 성격을 서술하는 말이 아닙니다.
  - severity: medium
    issue: ‘그러나 급한 성격을 띠면’
    rationale: ἐὰν ... ὀξυχολία τις ἐπέλθῃ는 어떤 성급한 분노가 ‘닥쳐오다/일어나다’라는 사건 표현입니다.
  - severity: medium
    issue: ‘온유하신 성령이 즉시 비좁아져서’
    rationale: τρυφερὸν은 여기서 ‘부드럽고 섬세한’ 성령의 성격을, στενοχωρεῖται는 그 영이 압박·곤경을 겪는 상태를 말합니다. ‘온유’는 πραότης와 혼동될 수 있고, 성령 자체가 물리적으로 비좁아진다는 표현도 부정확합니다.
