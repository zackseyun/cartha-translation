revisions:
- from: 쑥을 조금 취하여 꿀병에 넣으면 꿀이 다 없어지지 아니하겠느냐? 아주 적은 양의 쑥도 많은 꿀을 망칩니다. 꿀의 단맛을 없애고 더 이상 그 주인에게 쓸모가 없게 됩니다. 왜냐하면 꿀이 쓴맛이 나고 쓸모가 없어지기 때문입니다. 그러나 쑥을 꿀에 넣지 않으면 꿀이 달아서 그 주인에게 쓰일 만한 것이 되느니라.
  to: 작은 쓴쑥을 가져다가 꿀 한 단지에 넣으면, 온 꿀을 못 쓰게 만들지 않겠습니까? 지극히 적은 쓴쑥 때문에 그토록 많은 꿀이 망가지며, 쓴쑥은 꿀의 단맛을 없애 버립니다. 그래서 그 꿀은 쓰게 되어 쓸모를 잃고, 더 이상 주인에게 예전과 같은 인정을 받지 못합니다. 그러나 쓴쑥을 꿀에 넣지 않으면, 꿀은 달게 남아 그 주인에게 쓸모 있는 것이 됩니다.
  rationale: 원문의 수사 의문문, 쓴쑥이 꿀의 단맛과 쓸모를 훼손한다는 인과관계, 그리고 쓴쑥이 없을 때의 대조를 보존했습니다. 현대 표준 한국어 합쇼체로 종결을 통일했으며, 원문의 ‘은총/호의’(χάρις)는 이 비유의 기능적 문맥을 드러내도록 ‘인정’을 보완하여 번역했습니다.
