revisions:
- from: 이 모든 영들이 한 그릇, 곧 성령도 거하시는 바로 그 그릇에 거하시면 그 그릇이 영들을 담을 수 없느니라. 넘친다. 악한 영과 함께 거하거나 거칠게 사는 습관이 없는 온유한 영은 그러한 사람에게서 물러나 온화하고 조용하게 거하려고 노력합니다. 그러다가 그것이 거하는 사람에게서 떠나면 그 사람에게는 의로운 영이 없게 됩니다. 그 후로 그는 악령으로 가득 차서 그의 모든 행위가 불안정하고 악령들에게 여기저기 끌려다니고 그의 선한 이해력에 완전히 눈이 먼 사람입니다. 성미가 급한 모든 사람에게 이런 일이 일어납니다.
  to: 이 모든 영들이 한 그릇, 곧 성령께서도 거하시는 바로 그 그릇 안에 함께 거하면, 그 그릇은 그것들을 담아 낼 수 없고 넘쳐 납니다. 그러므로 악한 영이나 거침과 함께 거하는 데 익숙하지 않은 섬세한 영은 그러한 사람에게서 떠나, 온유함과 평온함 가운데 거할 곳을 찾습니다. 그리고 그 영이 거하던 그 사람에게서 떠나면, 그 사람은 의로운 영이 없는 상태가 됩니다. 그 뒤 그는 악한 영들로 가득 차서, 악한 영들에게 이리저리 끌려다니며 그의 모든 행위에서 불안정해지고, 선한 이해력을 완전히 잃습니다. 성미가 급한 모든 사람에게 이와 같은 일이 일어납니다.
  rationale: 원문의 인과관계와 비유의 ‘그릇’ 이미지를 보존하면서, τρυφερόν과 πραότης의 구별을 드러냈습니다. 또한 ‘찾습니다’, ‘완전히 잃습니다’ 등의 표현으로 그리스어의 의미와 현대 합쇼체 문체를 자연스럽게 반영했습니다.
