revisions:
- from: 그러나 슬픔에 잠긴 사람은 언제나 악하게 행동합니다. 첫째, 기쁨으로 인간에게 주신 성령을 근심하게 하기 때문에 악을 행합니다. 둘째, 성령을 근심하게 하여 불법을 행하고 주님께 기도하지도 아니하고 자백하지도 아니하는 것입니다. 슬픔에 잠긴 사람의 기도는 결코 하나님의 제단에 올라갈 힘이 없기 때문입니다.
  to: 그러나 슬픔에 잠긴 사람은 언제나 악을 행합니다. 첫째, 사람에게 기쁨에 찬 성령으로 주어진 성령을 근심하게 하기 때문에 악을 행합니다. 둘째, 성령을 근심하게 하여 주님께 기도드리지도 고백하지도 않으면서 불법을 행합니다. 슬픔에 잠긴 사람의 기도는 결코 하나님의 제단에 올라갈 힘이 없기 때문입니다.
