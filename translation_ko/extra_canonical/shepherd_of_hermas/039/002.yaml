  source_fidelity: 초안은 전체 논지를 충실히 옮기지만, τὸ πνεῦμα τὸ ἅγιον τὸ δοθὲν τῷ ἀνθρώπῳ ἱλαρόν은 ‘기쁨으로 인간에게 주신 성령’이 아니라 사람에게 주어진 성령 자체가 ‘기쁨에 찬/즐거운’ 것으로 묘사된 표현입니다.
  naturalness: ‘기도하지도 아니하고’와 ‘자백하지도 아니하는 것입니다’는 현대 합쇼체에서 다소 부자연스럽습니다. ‘기도드리지도 고백하지도 않으면서’가 자연스럽고 원문의 분사 연결을 잘 살립니다.
  terminology: ‘성령’, ‘불법’, ‘주님’, ‘하나님의 제단’은 적절합니다. ἐξομολογούμενος는 여기서 해석을 과도하게 좁히지 않고 ‘고백하다’로 옮깁니다.
