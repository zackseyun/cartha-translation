    rationale: ‘기도하지도 아니하고 자백하지도 아니하는 것입니다’보다 ‘기도드리지도 고백하지도 않으면서’가 자연스럽고, λυπῶν 이하의 수단·동반 상황을 더 정확히 나타냅니다.
