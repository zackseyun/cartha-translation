    rationale: ἱλαρόν은 ‘주신’의 방식이 아니라 ‘성령’을 수식합니다. 따라서 성령이 사람에게 기쁘고 즐거운 상태로 주어졌다는 뜻을 반영해야 합니다.
  - severity: low
