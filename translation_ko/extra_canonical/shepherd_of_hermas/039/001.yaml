  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: ko
  text: 그러므로 하나님께 늘 은총을 얻고 그분께서 받아 주시는 즐거움을 입으십시오. 그리고 그 안에서 기뻐하십시오. 쾌활한 사람은 누구나 선을 행하고 좋은 것을 생각하며 슬픔을 업신여깁니다.
  philosophy: optimal-equivalence
lexical_decisions: []
theological_decisions: []
