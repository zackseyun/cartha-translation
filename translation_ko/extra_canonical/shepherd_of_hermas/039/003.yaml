revisions:
- from: 나는 “왜 슬퍼하는 사람의 기도가 제단에 올라가지 않습니까?”라고 묻습니다. “슬픔이 그 마음에 깃들었느니라 그러므로 근심이 기도와 합하여 그 기도가 순수하게 제단에 올라가는 것을 허락하지 아니하느니라 식초와 포도주를 섞으면 그 즐거움이 같지 아니함 같이 근심에 성령이 섞이면 기도도 같지 아니하니라.”
  to: 나는 “왜 슬퍼하는 이의 기도는 제단에 올라가지 않습니까?”라고 물었습니다. 그가 말했습니다. “슬픔이 그의 마음에 자리 잡고 있기 때문입니다. 그러므로 기도에 섞인 슬픔은 그 기도가 순수하게 제단에 올라가는 것을 막습니다. 식초와 포도주를 함께 섞으면 같은 맛을 내지 못하는 것처럼, 성령과 섞인 슬픔도 그 기도를 같은 기도가 되지 못하게 합니다.”
  rationale: 원문의 문답 형식, ‘마음에 자리 잡은 슬픔’, 기도가 ‘순수하게’ 제단에 오르지 못한다는 진술, 그리고 식초와 포도주의 비유를 모두 보존했습니다. 마지막 절의 ‘같은 기도’라는 다소 난해한 표현은 교리적으로 해석을 덧붙이지 않고 직역에 가깝게 유지했습니다.
