    rationale: 원문은 ‘슬픔이 성령과 섞인’ 것으로 말하지만, 초안의 ‘근심에 성령이 섞이면’은 성령이 근심에 섞이는 것으로 표현합니다.
  - severity: medium
    issue: ‘슬픔이 그의 마음에 자리 잡고 있기 때문입니다’라는 근거가 생략·약화되었습니다.
    rationale: Ὅτι ... ἡ λύπη ἐγκάθηται εἰς τὴν καρδίαν αὐτοῦ를 명시적으로 옮겨야 문답의 논리가 보존됩니다.
