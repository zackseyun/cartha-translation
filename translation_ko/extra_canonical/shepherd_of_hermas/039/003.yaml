  source_fidelity: 원문의 문답 구조와 핵심 비유는 반영되어 있으나, 초안은 ἡ λύπη ἐγκάθηται(슬픔이 마음에 자리 잡고 있다)를 직접적으로 옮기지 않았고, ‘근심에 성령이 섞이면’은 원문의 ‘성령과 섞인 슬픔’이라는 주어·관계를 바꿉니다. 또한 ‘기도도 같지 아니하니라’는 원문의 다소 난해한 표현을 충분히 전달하지 못합니다.
  naturalness: 초안은 현대 표준 한국어 합쇼체가 아니라 고어체 종결(‘-느니라’, ‘-아니하니라’)을 사용하고, 인용문 안의 문장부호와 문장 경계가 없어 읽기가 어렵습니다. 현대적이면서도 문어적인 합쇼체로 정리하는 것이 안전합니다.
  terminology: ἔντευξις는 문맥상 ‘기도’로, θυσιαστήριον은 ‘제단’으로, πνεῦμα ἅγιον은 ‘성령’으로 일관되게 옮겼습니다. 마지막 문장은 원문의 비유적이고 다소 압축된 표현을 보존하여 ‘같은 기도가 되지 못합니다’로 번역했습니다.
