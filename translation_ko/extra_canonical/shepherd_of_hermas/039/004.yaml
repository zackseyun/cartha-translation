  language: ko
  text: 그러므로 이 악한 슬픔에서 자신을 깨끗하게 하십시오. 그러면 하나님을 위하여 살게 될 것입니다. 또한 자기에게서 슬픔을 버리고 모든 기쁨을 입는 사람은 모두 하나님을 위하여 살게 될 것입니다.
