base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places[h]: these are those who have believed[a], but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.


    But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to change their mind[a] because of the cravings of their lewdness[b] and the evils they have done.


    And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name[j] of the Lord; then, when the purity of the truth comes to their remembrance, they change their mind[d] and go back again after their evil desires.


    So she finished the explanation of the tower. But, plucking up my courage again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.


    Rather, they will fit in another place, much smaller[e]; and this will be when they have been tormented and have completed the days of their sins[i]. And for this reason they will be transferred, because they have shared in the righteous word[f]. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart[g]. But if they do not come up into their heart[f][d][c], they are not saved because of their hardness of heart.”'
  footnotes:
  - marker: a
    text: 'Greek metanoēsai: here rendered “change their mind” to reflect a cognitive reconsideration. Traditional “repent” is also possible.'
    reason: lexical_alternative
  - marker: b
    text: 'Greek aselgeia: “lewdness” here; alternatives include “licentiousness” or “sensuality.”'
    reason: lexical_alternative
  - marker: c
    text: 'Greek hagnotēs tēs alētheias: literally “the purity/chastity of the truth,” i.e., the moral purity that the truth entails.'
    reason: lexical_alternative
  - marker: d
    text: Greek metanoousin in v. 3 denotes reconsidering their intent to be baptized; hence “change their mind,” not “repent.”
    reason: lexical_alternative
  - marker: e
    text: “Much smaller” (polu elattōni) can also mean “much lesser/inferior,” indicating a humbler place in relation to the tower.
    reason: lexical_alternative
  - marker: f
    text: “The righteous word” may also be read “the word of the Righteous One,” i.e., of God/the Lord.
    reason: lexical_alternative
  - marker: g
    text: “Come up into their heart” is a Semitic idiom for “occur to them,” “come to mind,” implying remembrance and acknowledgment.
    reason: cultural_note
  - marker: h
    text: '“Pathless places” renders anodiai—areas without a road. Alternatives: “trackless places,” “roadless wastes.”'
    reason: lexical_alternative
  - marker: i
    text: “Complete the days of their sins” is an idiom for undergoing the set period due because of their sins.
    reason: cultural_note
  - marker: j
    text: “Baptized into the name” reflects the early baptismal formula (εἰς τὸ ὄνομα). Many English versions read “in the name.”
    reason: lexical_alternative
translation:
  language: ko
  text: '그런데 당신이 본 다른 돌들—곧 탑에서 멀리 던져져 길 위에 떨어지고, 길에서 굴러 오솔길 없는 곳들로 가는 돌들은—믿기는 했지만, 두 마음 때문에 자기들의 참된 길을 버리는 사람들입니다. 그래서 더 나은 길을 찾을 수 있다고 생각하다가 길을 잃고, 오솔길 없는 곳들을 다니며 고생합니다.


    불 속에 떨어져 타 버리는 돌들은 살아 계신 하나님에게서 끝내 돌아선 사람들입니다. 그들의 음탕함의 욕망[b]과 그들이 행한 악한 일들 때문에, 회개하려는 마음이 더 이상 그들의 마음에 떠오르지 않았습니다.


    또 물 가까이에 떨어졌지만 물로 굴러 들어갈 수 없는 다른 돌들은 누구인지 알고 싶습니까? 이들은 말씀을 듣고 주님의 이름으로 세례를 받으려는 사람들입니다[j]. 그러다가 진리의 순결[c]이 기억나면 마음을 바꾸고[d] 다시 자기들의 악한 욕망을 따라 돌아갑니다.


    그렇게 해서 그녀는 탑에 대한 설명을 마쳤습니다. 그러나 내가 다시 용기를 내어 그녀에게 더 물었습니다. 탑의 건축물에 맞지 않아 버려진 이 돌들, 곧 이 탑 안에 자리가 있는지, 또 그들에게 회개가 있는지 말입니다. 그녀는 “그들에게는 회개가 있습니다. 그러나 이 탑에는 들어맞을 수 없습니다.


    그들은 더 작은[e] 다른 곳에 들어맞을 것입니다. 그것은 그들이 고통을 당하고 자기들의 죄의 날들을 다 채울 때입니다[i]. 그들이 의로운 말씀[f]에 참여했기 때문에, 이런 이유로 그들은 옮겨질 것입니다. 그러다가 그들이 겪은 악한 일들이 자기들의 마음에 떠오르면[g] 그들은 자기들의 고통에서 옮겨질 것입니다. 그러나 그것이 그들의 마음에 떠오르지 않으면[g], 그들은 마음의 완고함 때문에 구원을 받지 못합니다”라고 말했습니다.[a][h]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  english_pob_choice: double‑mindedness
  chosen_korean: 두 마음
  alternatives_korean:
  - 우유부단함
  - 양분된 마음
  - 이중적 마음
  lexicon: BDAG
  rationale: 분열된 내면과 충성의 흔들림을 한국어로 간결하게 드러내며, 단순한 망설임보다 도덕적·영적 분열을 살립니다.
- source_word: ἀνοδίαι
  english_pob_choice: pathless places
  chosen_korean: 오솔길 없는 곳들
  alternatives_korean:
  - 길 없는 곳들
  - 발자취 없는 곳들
  - 사람 다니지 않는 곳들
  lexicon: LSJ
  rationale: 길에서 벗어난 돌의 이미지를 살리면서, ‘pathless’의 무경로성을 한국어로 자연스럽게 옮깁니다.
- source_word: ἀσέλγεια
  english_pob_choice: lewdness
  chosen_korean: 음탕함
  alternatives_korean:
  - 방탕
  - 방종
  - 음란함
  lexicon: BDAG
  rationale: 문맥상 욕망의 성적·도덕적 문란을 드러내는 구체적 표현으로, POB의 강한 도덕 어조를 반영합니다.
- source_word: μετανοέω
  english_pob_choice: change their mind
  chosen_korean: 마음을 바꾸다
  alternatives_korean:
  - 생각을 돌이키다
  - 회개하다
  - 뜻을 바꾸다
  lexicon: BDAG
  rationale: v.3에서는 세례를 받으려는 결정을 다시 숙고하는 인지적 의미가 두드러져, ‘회개하다’보다 ‘마음을 바꾸다’가 원문 긴장을 더 잘 보존합니다.
- source_word: ἁγνότης τῆς ἀληθείας
  english_pob_choice: the purity of the truth
  chosen_korean: 진리의 순결
  alternatives_korean:
  - 진리의 깨끗함
  - 진리의 순수함
  - 진리의 정결
  lexicon: BDAG
  rationale: 문자적으로는 ‘진리의 순결’이 가장 가깝고, 윤리적 요구가 내포된 표현을 과도하게 풀지 않도록 했습니다.
- source_word: ῥῆμα τοῦ δικαίου
  english_pob_choice: the righteous word
  chosen_korean: 의로운 말씀
  alternatives_korean:
  - 의로운 말씀
  - 의인의 말씀
  - 의로운 한 말씀
  lexicon: BDAG
  rationale: 문장 전체의 청각적·선포적 뉘앙스를 살리면서, ‘word of the Righteous One’으로 과도하게 신학화하지 않고 형용사적 독법을 따랐습니다.
- source_word: εἰς τὸ ὄνομα
  english_pob_choice: be baptized into the name
  chosen_korean: 주님의 이름으로 세례를 받다
  alternatives_korean:
  - 주님의 이름 안에서 세례를 받다
  - 주님의 이름으로 침례를 받다
  - 주님의 이름 안으로 세례를 받다
  lexicon: BDAG
  rationale: 한국어에서는 ‘into the name’를 직역하면 어색하므로, 초기 기독교 입회 공식을 유지하면서 ‘주님의 이름으로’로 자연화했습니다.
theological_decisions:
- issue: μετανοέω / μετάνοια의 구분
  chosen_reading: v.2–3에서는 인지적 전환을 나타내는 ‘마음을 바꾸다’를 쓰고, v.5에서는 기술적 명사로서 ‘회개’는 유지했습니다.
  alternative_readings:
  - 모든 곳을 ‘회개하다/회개’로 통일
  - 모든 곳을 ‘생각을 바꾸다’로 통일
  rationale: 본문은 ‘마음에 떠오르다’와 ‘기억나다’라는 표현과 결합되어 반복적 자기성찰을 가리키는 부분과, 구원론적 범주로서의 회개를 묻는 부분을 구별합니다.
  doctrine_reference: 'DOCTRINE.md: μετανοέω → change of mind / repent per context'
- issue: εἰς τέλος ἀποστάντες τοῦ Θεοῦ τοῦ ζῶντος
  chosen_reading: ‘살아 계신 하나님에게서 끝내 돌아선 사람들’로 옮겨 최종적·완결적 이탈을 드러냈습니다.
  alternative_readings:
  - ‘죽을 때까지 돌아선 사람들’
  - ‘완전히 배교한 사람들’
  rationale: 본문의 초점은 단순한 순간적 타락이 아니라, 살아 계신 하나님으로부터의 결정적 이탈입니다. 따라서 해석을 지나치게 제도화하지 않으면서도 최종성을 보존했습니다.
  doctrine_reference: 'PHILOSOPHY.md: Preserve theological tension rather than resolve it'
