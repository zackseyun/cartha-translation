revisions:
- from: 네 마음이 성결하고 흠이 없게 되어 남은 생애 동안 흠 없이 주를 섬기면 내가 이 일을 면할 줄을 내가 알았노라. 여러분의 염려를 주님께 맡기십시오. 그러면 그분께서 친히 그것을 지도하실 것입니다.
  to: 나는 여러분의 마음이 깨끗하고 흠이 없게 되어, 남은 생애의 날 동안 흠 없이 주님을 섬기면 내가 그 짐승을 피할 수 있음을 알았습니다. 여러분의 염려를 주님께 맡기십시오. 그러면 그분께서 친히 그것들을 잘 처리해 주실 것입니다.
  rationale: 앞선 문맥의 짐승을 αὐτήν의 선행사로 명시하여 한국어의 지시 대상을 분명히 했습니다. 원문에 있는 화자 ‘나’와 청자 복수의 다소 어색한 전환은 그대로 보존했습니다. ‘남은 생애의 날 동안’은 τὰς λοιπὰς τῆς ζωῆς ἡμέρας를 반영하며, 마지막 문장은 영어 감사 번역의 ‘direct’보다 그리스어 κατορθόω의 의미를 더 가깝게 살렸습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:53Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘이 일을 면할 줄’은 여성형 대명사 αὐτήν이 가리키는 앞선 짐승을 사건처럼 바꾸어 놓습니다. 또한 καθαρά는 여기서 ‘깨끗한’이 더 직접적이며, κατορθώσει αὐτάς는 염려들을 ‘지도하다’보다 ‘잘 처리하다/바로잡다’의 뜻에 가깝습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 정리하고, 원문의 조건절과 권면의 흐름을 유지했습니다.
  terminology: κύριος는 본문 내에서 일관되게 ‘주님’으로 옮겼습니다. ἄμωμος는 ‘흠이 없는’, μέριμναι는 ‘염려’로 번역했습니다.
  issues:
  - severity: medium
    issue: ‘이 일을 면할 줄’
    rationale: 원문의 αὐτήν은 앞 문맥의 여성명사 ‘짐승’을 받으며, ‘일’로 일반화하면 지시 대상이 달라집니다.
  - severity: medium
    issue: ‘성결하고’ 및 ‘지도하실’
    rationale: καθαρά는 ‘깨끗한’이 자연스럽고 직접적입니다. κατορθώσει는 염려를 지도한다기보다 잘 처리하거나 바로잡는다는 뜻입니다.
  - severity: low
    issue: ‘네 마음’과 ‘여러분’의 혼용
    rationale: 원문은 ὑμῶν 등 복수 청자를 사용하므로 ‘여러분’으로 통일하는 편이 적절합니다.
