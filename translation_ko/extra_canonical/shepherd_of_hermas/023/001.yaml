  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: ko
  text: 그 짐승이 나를 지나간 뒤, 내가 앞으로 삼십 피트쯤 나아가니, 보십시오, 신방에서 나오는 듯이 치장한 한 처녀가 나를 마주 왔습니다. 그녀는 온통 흰 차림에 흰 샌들을 신고 있었으며, 이마까지 덮개를 쓰고 있었습니다. 그 덮개는 미트라[1]였고, 그녀의 머리카락은 희었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: '그리스어 ‘미트라’(μίτρα): 머리에 두르는 띠 또는 덮개를 가리키는 말입니다. 정확한 형태는 확정하기 어렵습니다.'
    reason: μίτρα를 단순히 현대식 ‘터번’으로 단정하지 않고, 원어의 복식상 모호성을 보존합니다.
