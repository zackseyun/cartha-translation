revisions:
- from: 그 짐승이 내 옆을 지나가고 내가 앞으로 삼십 피트쯤 가니, 보라, 한 처녀가 나를 맞다. 그 처녀는 신방에서 나오는 것 같이 치장하고 온전한 흰옷과 흰 신을 신고 이마까지 가리웠더라. 그 머리에는 터번을 썼고 머리는 희었다.
  to: 그 짐승이 나를 지나간 뒤, 내가 앞으로 삼십 피트쯤 나아가니, 보십시오, 신방에서 나오는 듯이 치장한 한 처녀가 나를 마주 왔습니다. 그녀는 온통 흰 차림에 흰 샌들을 신고 있었으며, 이마까지 덮개를 쓰고 있었습니다. 그 덮개는 미트라[1]였고, 그녀의 머리카락은 희었습니다.
  rationale: 원문의 사건 순서, 처녀의 복장 묘사, 머리 덮개의 모호한 복식 용어를 보존하면서 현대 표준 한국어 합쇼체로 문장을 자연스럽게 고쳤습니다.
