review_pass:
  verdict: revise
  source_fidelity: 개정안은 πιστεύσατε의 복수 명령을 합쇼체로 옮기고, διψύχοι를 ‘두 마음을 품은 자들’로 유지했습니다. καὶ…καὶ의 병렬을 ‘그러시고 또한’으로 반영하여, 진노를 돌이키심과 채찍/징벌을 보내심을 대조 접속사로 임의 해석하지 않았습니다. μάστιγας는 일반적인 ‘재앙’보다 원문의 징계·채찍질 비유를 보존하는 ‘징벌’로 옮겼습니다.
  naturalness: 초안에는 ‘주님를’이라는 조사 오류와 종결형(믿으라/내리시는도다/있을 것이다/좋았을 것입니다)의 혼용이 있습니다. 개정안은 현대 표준어 합쇼체로 통일하고 문장부호와 호격을 자연스럽게 정리했습니다.
  terminology: ‘주님’, ‘진노’, ‘화’는 문맥에 맞는 공적·종교 문헌의 격식을 유지합니다. ‘두 마음을 품은’은 διψύχοι의 도덕적·내적 분열이라는 표현을 과도하게 교리화하지 않고 보존합니다.
  issues:
  - severity: high
    issue: 조사 오류와 종결형 혼용
    rationale: ‘주님를’은 문법 오류이며, 한 단락 안에 해라체·한다체·합쇼체가 섞여 있어 지정된 현대 합쇼체 등록을 충족하지 못합니다.
  - severity: medium
    issue: 접속 관계의 부정확성
    rationale: 원문은 ‘그의 진노를 … 돌이키시고 또한 … 채찍들을 보내신다’라고 καὶ로 연결합니다. 초안의 ‘돌이키시되’는 원문에 없는 양보·대조 관계를 도입합니다.
  - severity: medium
    issue: μάστιγας의 의미 약화
    rationale: μάστιγας는 본래 채찍·채찍질이며 여기서는 징계의 의미입니다. ‘재앙’은 가능 범위가 넓어 원문의 징계적 이미지를 흐립니다.
