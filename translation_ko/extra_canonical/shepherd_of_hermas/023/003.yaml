revisions:
- from: 두 마음을 품은 자들아 주님를 믿으라 그가 모든 것을 하실 수 있고 그의 진노를 너희에게서 돌이키시되 두 마음을 품은 너희에게 재앙을 내리시는도다 이 말을 듣고 불순종한 자들에게는 화가 있을 것이다. 그들은 차라리 태어나지 않았더라면 좋았을 것입니다.
