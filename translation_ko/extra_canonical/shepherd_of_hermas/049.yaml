base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049.yaml
  text: '…they make their wealth complete, and in turn the rich, by supplying the poor with the things they need, make their souls complete[a].


    9. Thus both become partners in the work of righteousness. Therefore the one who does these things will not be abandoned by God, but will be inscribed in the books of the living[b].


    10. Blessed are those who have and understand that they are made rich from the Lord; for those who think this way will be able to do some good.


    Another parable.


    1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir[c], that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age[d].”


    2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”


    3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent which are dry or which are living, so in this age neither the righteous nor the sinners are apparent, but all are alike.”


    Another parable.


    1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see these trees?” “I see,” I say, “sir, some sprouting and others dry.”


    2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”


    3. “For just as in summer the fruits of each tree become visible and are recognized for what they are, so also the fruits of the righteous will be visible, and all will be known, [those who are least] being flourishing in that age[e].”


    4. “But the nations[f] and the sinners—like the dry trees you saw—will be found such, dry and fruitless in that age, and as …[g]”'
  footnotes:
  - marker: a
    text: The verb πληροφορέω can mean to bring something to full measure or fulfillment. In this context it contrasts material 'wealth' with the 'soul,' each being made complete through mutual support.
    reason: lexical_alternative
  - marker: b
    text: On the motif, compare Exod 32:32–33; Ps 69:28; Dan 12:1. Hermas’s wording is plural ('books of the living'), not the singular 'book of life.'
    reason: cross_reference
  - marker: c
    text: Greek κύριε here is respectful address to the visionary guide; 'sir' avoids confusion with the divine title 'Lord.'
    reason: cultural_note
  - marker: d
    text: Greek αἰών denotes an age or epoch. Hermas contrasts the present age (winter) with the coming age (summer).
    reason: cultural_note
  - marker: e
    text: Some witnesses include the words 'οἱ ἐλάχιστοι ὄντες' ('even the least'), which would read, 'and all—even the least—will be known as flourishing in that age.'
    reason: textual_variant
  - marker: f
    text: ἔθνη is rendered 'the nations' rather than 'Gentiles' to retain a broad, non-technical sense.
    reason: lexical_alternative
  - marker: g
    text: The source text in our witness breaks off mid-sentence here; subsequent words are not present in the provided Greek layer.
    reason: textual_variant
translation:
  language: ko
  text: '…그들은 자기들의 재산을 온전하게 하고, 부유한 이들은 또한 가난한 이들에게 필요한 것을 공급함으로써 자기들의 영혼을 온전하게 합니다[a].


    9. 그러므로 둘 다 의로운 일에 동참하는 사람들이 됩니다. 그러므로 이런 일을 하는 사람은 하나님께 버림받지 않고, 살아 있는 이들의 책들[b]에 기록될 것입니다.


    10. 자기들이 가진 것과, 자신들이 주님께로부터 부유하게 된다는 것을 깨닫는 이들은 복됩니다. 이런 생각을 하는 사람들은 무언가 선한 일을 할 수 있을 것입니다.


    다른 비유입니다.


    1. 그는 잎이 없는 많은 나무들을 제게 보여 주셨는데, 그것들은 제게 마치 마른 것처럼 보였습니다. 모두 같은 모습이었기 때문입니다. 그리고 그분이 제게 말씀하셨습니다. “이 나무들을 보느냐?” “봅니다, 선생님[c]. 그것들이 서로 같고 마른 것처럼 보입니다.” 제가 대답하자, 그분은 제게 말씀하셨습니다. “네가 보는 이 나무들은 이 시대[d]에 사는 사람들이다.”


    2. “그렇다면, 선생님, 왜 그것들은 마른 것처럼 보이고 서로 같은 것입니까?” 제가 말했습니다. “그것은,” 그분이 말씀하셨습니다. “이 시대에서는 의인도 죄인도 보이지 않기 때문인데, 그들은 서로 같아 보인다. 이 시대는 의인에게 겨울이며, 그들은 죄인들 가운데 살면서도 보이지 않는다.”


    3. “겨울에는 잎을 떨어뜨린 나무들이 서로 같아서, 어느 것이 마른 것인지 어느 것이 살아 있는 것인지 드러나지 않는 것처럼, 이 시대에도 의인도 죄인도 드러나지 않고 모두가 서로 같습니다.”


    다른 비유입니다.


    1. 그는 다시 많은 나무들을 제게 보여 주셨는데, 어떤 것은 싹이 트고 어떤 것은 말라 있었습니다. 그리고 그분이 제게 말씀하셨습니다. “이 나무들을 보느냐?” “봅니다, 선생님. 어떤 것은 싹이 트고 어떤 것은 말라 있습니다.” 제가 말했습니다.


    2. “싹이 트는 이 나무들은,” 그분이 말씀하셨습니다. “다가오는 시대에 살게 될 의인들이다. 다가오는 시대는 의인에게는 여름이지만 죄인에게는 겨울이기 때문이다. 그러므로 주님의 자비가 비치면, 그때 하나님을 섬기는 이들이 드러날 것이며, 모두가 드러날 것이다.”


    3. “여름에는 각 나무의 열매가 드러나 그 열매가 어떤 종류인지 알아볼 수 있는 것처럼, 의인들의 열매도 드러날 것이며, 그 시대에 번성하는 것으로 모두 알려질 것입니다[e].”


    4. “그러나 민족들[f]과 죄인들은—네가 본 마른 나무들처럼—그 시대에 마르고 열매 없는 존재로 드러날 것이며, 그리고 …[g]”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληροφοροῦσι
  english_pob_choice: make complete
  chosen_korean: 온전하게 합니다
  alternatives_korean:
  - 채웁니다
  - 완성합니다
  lexicon: BDAG; LSJ
  rationale: 재물과 영혼이 서로 보완되어 ‘완전함’에 이른다는 뉘앙스를 살리면서, 현대 한국어에서 자연스럽고 과도하게 신학화되지 않은 표현을 택했습니다.
- source_word: ἔργου τοῦ δικαίου
  english_pob_choice: the work of righteousness
  chosen_korean: 의로운 일
  alternatives_korean:
  - 의의 일
  - 의의 사역
  lexicon: BDAG
  rationale: 문맥상 추상적 ‘의’보다 삶의 실천을 가리키므로, 독자가 바로 이해할 수 있는 ‘의로운 일’로 옮겼습니다.
- source_word: βίβλους τῶν ζώντων
  english_pob_choice: books of the living
  chosen_korean: 살아 있는 이들의 책들
  alternatives_korean:
  - 생명책
  - 살아 있는 자들의 책들
  lexicon: LSJ; BDAG
  rationale: 본문의 복수형과 ‘살아 있는 이들’이라는 표현을 유지해, 전통적 단수형 ‘생명책’으로 평준화하지 않았습니다.
- source_word: κύριε
  english_pob_choice: sir
  chosen_korean: 선생님
  alternatives_korean:
  - 선생님
  - 나리
  lexicon: BDAG
  rationale: 여기서는 시현을 인도하는 존재에게 드리는 공손한 호칭이므로, 신적 칭호인 ‘주님’과 구별되면서도 현대 한국어에서 자연스러운 ‘선생님’을 선택했습니다.
- source_word: αἰών
  english_pob_choice: age
  chosen_korean: 시대
  alternatives_korean:
  - 세상
  - 시기
  lexicon: BDAG
  rationale: 현재 시대와 다가오는 시대를 대조하는 종말론적 시간표현이므로, 공간적 뉘앙스의 ‘세상’보다 ‘시대’가 더 적합합니다.
- source_word: ἔθνη
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방인들
  lexicon: BDAG
  rationale: 문맥이 이스라엘/이방의 기술적 구분보다 넓은 집단 범주를 가리키므로, 비기독교적·비기술적 범주인 ‘민족들’로 옮겼습니다.
theological_decisions:
- issue: 보이는/드러나는 반복과 종말론적 대비
  chosen_reading: ‘보이지 않음’과 ‘드러남’을 반복해 현재 시대와 오는 시대의 대비를 살렸습니다.
  alternative_readings:
  - 단순히 ‘숨겨진다/나타난다’로 평준화
  - 도덕적 성공 여부 중심으로 재구성
  rationale: 본문의 핵심은 현재에는 의인과 죄인이 겉으로 구별되지 않지만, 오는 시대에는 열매로 드러난다는 대비이므로, 가시성 언어를 유지해야 합니다.
  doctrine_reference: 종말론적 계시와 분별의 주제
