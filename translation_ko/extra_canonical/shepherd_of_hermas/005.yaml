base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005.yaml
  text: 'As I was going to Cumae at the same season as the year before[a], while walking I recalled last year’s vision, and again a spirit lifts me up and carries me away to the same place as the year before.


    So, having come to the place, I knelt and began to pray to the Lord and to glorify his name, because he had deemed me worthy and had made known to me my former sins.


    And after I rose from prayer, I see before me the old woman whom I had also seen last year, walking and reading a little book. And she says to me, “Are you able to announce these things to the elect of God?” I say to her, “Lady, I am not able to remember so many things; but give me the little book, so that I may copy it.” “Take it,” she says, “and you will give it back to me.”


    So I took it, and withdrawing to a certain place in the field, I copied it all letter for letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand[f][e][d][c][b]; but by whom I did not see.'
  footnotes:
  - marker: a
    text: Cumae was an ancient Greek-founded city in Campania, famous for the Sibyl. Hermas situates the vision during a journey there.
    reason: cultural_note
  - marker: b
    text: Or “the Spirit,” i.e., the Holy Spirit; the Greek has no article, and the agent is left unspecified.
    reason: alternative_reading
  - marker: c
    text: Literally, “I set the knees,” a Greek idiom for kneeling.
    reason: cultural_note
  - marker: d
    text: The Greek βιβλαρίδιον is a diminutive; possible renderings include “booklet” or “small scroll.”
    reason: lexical_alternative
  - marker: e
    text: Ancient manuscripts were often written without spaces (scriptio continua), hence “I could not find the syllables,” and he copies letter by letter.
    reason: cultural_note
  - marker: f
    text: “Elect” can also be rendered “chosen ones.”
    reason: lexical_alternative
translation:
  language: ko
  text: '내가 지난해와 같은 시기에 쿠마이로 가는 중에, 걸으면서 지난해의 환상을 떠올렸습니다. 그런데 다시 한 영이 나를 들어 올려, 지난해와 같은 그곳으로 데려갔습니다.


    그곳에 이르러 나는 무릎을 꿇고 주님께 기도하기 시작하며, 그분의 이름을 찬양했습니다. 그분이 나를 합당한 사람으로 여기시고, 내 이전의 죄들을 내게 알게 하셨기 때문입니다.


    기도를 마치고 일어나자, 지난해에도 보았던 그 늙은 여인이 내 앞에 서 있었습니다. 그 여인은 걸으면서 작은 책을 읽고 있었습니다. 그가 내게 말했습니다. “하나님의 택하신 이들에게 이것들을 전할 수 있습니까?” 나는 그 여인에게 말했습니다. “부인, 나는 이렇게 많은 것을 기억할 수 없습니다. 그러니 그 작은 책을 제게 주십시오. 제가 그것을 베껴 적겠습니다.” “가져가십시오.” 그가 말했습니다. “그리고 다시 내게 돌려주십시오.”


    그래서 나는 그것을 받아, 들판의 어떤 곳으로 물러가 한 자 한 자 다 베껴 썼습니다. 왜냐하면 나는 음절들을 알아볼 수 없었기 때문입니다. 그런데 내가 책의 글자들을 다 마치자, 갑자기 그 작은 책이 내 손에서 채여 갔습니다. 그러나 누가 그렇게 했는지는 보지 못했습니다.[a][b][c][d][e][f]'
  philosophy: optimal-equivalence
