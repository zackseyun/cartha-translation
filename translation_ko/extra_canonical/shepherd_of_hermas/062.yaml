  yaml_path: translation/extra_canonical/shepherd_of_hermas/062.yaml
  text: 'I say to him, “Sir, make known to me what this tree is; for I am perplexed about it, because, though so many branches have been cut off, the tree is sound, and nothing appears to have been cut away from it. About this, therefore, I am at a loss.”


    “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.[a]


    “And the great and glorious angel is Michael, who has authority over this people and governs them. For he is the one who gives the law to them, into the hearts of those who believe; therefore he himself visits those to whom he gave it, to see whether they have kept it.


    “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”[b][c]


    I say to him, “Sir, why did he send some away into the tower, but leave others to you?”


    “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”[d][e]


    “Who then, Sir,” I say, “are the ones who are crowned and go into the tower?”


    “[Those who grappled with the devil and overcame him,” he says, “are crowned.][f][g] These are the ones who suffered for the law.[h]


    “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.


    “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”'
  footnotes:
  - marker: a
    text: Hermas here identifies the “law of God” with the Son of God and his proclamation. The term “law” in this Similitude functions as God’s binding instruction embodied and announced by the Son, not as a narrow reference to the Mosaic code.
    reason: cultural_note
  - marker: b
    text: '“The rods are the law”: see the willow-rod allegory introduced earlier in Similitude 8 for how individual rods symbolize people’s relation to the divine law.'
    reason: cross_reference
  - marker: c
    text: '“Made worthless” translates a verb meaning “rendered useless” or “spoiled.” Alternatives: “ruined,” “rendered useless.”'
    reason: lexical_alternative
  - marker: d
    text: “Repentance” renders the noun metanoia. While it can denote a change of mind, Hermas’s penitential context supports the established church sense of turning back through confession and amendment.
    reason: cultural_note
  - marker: e
    text: 'Literal: “have been well-pleasing with respect to the law.” Some English versions supply an implicit object (“to God”), but the Greek does not state one.'
    reason: alternative_reading
  - marker: f
    text: “Crowned” evokes the athletic victor’s wreath and, in Christian usage, the honor of those who overcome in trial.
    reason: cultural_note
  - marker: g
    text: 'Textual variant: The sentence “Those who grappled with the devil and overcame him are crowned” is bracketed in some editions and absent in some witnesses.'
    reason: textual_variant
  - marker: h
    text: 'The contrast suggests two groups: some suffered (likely to the point of death), others were pressed by trials but neither underwent that ultimate suffering nor denied the law.'
    reason: cultural_note
  - marker: a
    text: Or 'and you will see the dwelling of each one.[b][c]'.
    reason: previous_rendering
  - marker: b
    text: Or '“[Those who grappled with the devil and overcame him are crowned.][f][g]'.
    reason: previous_rendering
translation:
  language: ko
  text: '그에게 말했습니다. 「주님, 이 나무가 무엇인지 저에게 알려 주십시오. 많은 가지들이 잘려 나갔는데도 나무는 멀쩡하고, 그것에서 잘려 나간 것이 아무것도 보이지 않아서 저는 당황스럽습니다. 그러므로 이 점에서 저는 난감합니다」.


    그가 말했습니다. 「들으십시오. 평야와 산과 온 땅을 덮고 있는 이 큰 나무는 온 세상에 주어진 하나님의 율법입니다. 그리고 이 율법은 땅끝까지 선포된 하나님의 아들입니다. 그 그늘 아래 있는 민족들은 그 선포를 듣고 그를 믿은 사람들입니다.[a]


    그리고 그 크고 영광스러운 천사는 미가엘인데, 그는 이 백성에 대한 권한을 가지고 그들을 다스립니다. 그가 믿는 사람들의 마음속에 그 율법을 주는 자이기 때문입니다. 그러므로 그가 그것을 준 사람들을 친히 찾아가, 그들이 그것을 지켰는지 보십니다.


    각 사람의 막대기들을 보셨지요. 막대기들은 곧 율법입니다. 그러므로 여러 막대기가 무용하게 된 것도 보셨을 것입니다.[b][c] 그리고 율법을 지키지 않은 모든 사람을 알아보게 되실 것이며, 각 사람의 거처도 보게 되실 것입니다」.


    그에게 말했습니다. 「주님, 왜 어떤 이들은 탑으로 보내시고, 다른 이들은 당신에게 남겨 두셨습니까?」


    그가 말했습니다. 「그에게서 받은 율법을 어긴 사람들은 모두 회개하도록 내 권한 아래 남겨 두었습니다. 그러나 이미 율법에 대해 기뻐하였고 그것을 지킨 사람들은 자기 권한 아래 두셨습니다.[d][e]


    그러면 주님, 탑으로 올라가는, 관을 쓴 이들은 누구입니까?」


    「[악마와 맞붙어 그를 이긴 이들은 관을 씁니다]」[f][g] 그들은 율법 때문에 고난을 겪은 사람들입니다.[h]


    그러나 다른 이들은 자기 막대기를 녹색이고 곁가지를 지닌 채, 그러나 열매는 없는 모습으로 내놓았는데—이들은 율법 때문에 압박을 받았지만, 고난을 당하지도 않았고 자기들의 율법을 부인하지도 않은 사람들입니다.


    그리고 받은 그대로 녹색 막대기를 내놓은 사람들은 품위 있고 의로우며, 매우 깨끗한 마음으로 걸어 왔고, 주님의 계명들을 지켜 온 사람들입니다. 나머지는 내가 이 심어지고 물을 댄 막대기들을 살필 때 알게 될 것입니다」.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  english_pob_choice: Sir
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 주인님
  lexicon: BDAG
  rationale: 이 장면의 대화 상대는 천사적 안내자이므로 영어 POB의 'Sir' 취지를 따라 공손한 호칭을 살렸고, 한국어에서는 인물 관계상 가장 자연스러운 공경 호칭으로 옮겼습니다.
- source_word: νόμος
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: BDAG / LSJ
  rationale: 이 비유에서는 반복적으로 상징어로 기능하므로 '율법'을 유지해 hermas 특유의 종교적-언약적 울림을 보존했습니다.
- source_word: συμπαλαίσαντες
  english_pob_choice: grappled
  chosen_korean: 맞붙어
  alternatives_korean:
  - 씨름하여
  - 격투하여
  lexicon: LSJ
  rationale: 접전의 이미지를 살리되 한국어에서 과도하게 낯선 표현은 피하기 위해 '맞붙어'로 옮겼습니다.
- source_word: ἠχρειωμένας
  english_pob_choice: made worthless
  chosen_korean: 무용하게 된
  alternatives_korean:
  - 쓸모없게 된
  - 헛되게 된
  lexicon: BDAG
  rationale: 가지가 잘려 나가 생명력은 남아 있으나 기능을 잃은 상태를 드러내기 위해 '무용하게 된'을 택했습니다.
- source_word: εὐηρέστησαν τῷ νόμῳ
  english_pob_choice: have been pleasing to the law
  chosen_korean: 율법에 대해 기뻐하였고
  alternatives_korean:
  - 율법을 기뻐하였고
  - 율법을 기쁘게 하였고
  lexicon: BDAG
  rationale: 그리스어는 'to the law'라는 전치사구만 두고 있어, 대상이 명시되지 않은 긴장을 살리면서도 한국어에서 부자연스러운 직역을 피했습니다.
theological_decisions:
- issue: 하나님의 아들과 율법의 동일시
  chosen_reading: '''이 율법은 땅끝까지 선포된 하나님의 아들입니다''를 직역해, 율법-아들 동일시를 그대로 드러냈습니다.'
  alternative_readings:
  - '''하나님의 아들에 관한 선포입니다'''
  - 율법을 모세 율법으로 좁혀 해석
  rationale: 본문은 상징의 핵심을 분명히 진술하므로, 후대 교리로 완화하거나 재해석하지 않고 Hermas의 독특한 알레고리를 보존해야 합니다.
  doctrine_reference: 알레고리/기독론적 상징을 평준화하지 않는 번역 원칙
- issue: 악마와의 씨름 구절의 처리
  chosen_reading: 괄호 안 구절을 본문에 포함하고 각주로 본문 전승의 변이를 밝혔습니다.
  alternative_readings:
  - 해당 구절 생략
  - 본문으로 단정
  rationale: 정규화된 원문이 괄호로 표기한 전승 차이를 투명하게 드러내기 위해 포함하되, 본문비평의 불확실성은 유지했습니다.
  doctrine_reference: 본문비평 투명성 원칙
- issue: μετάνοια의 의미
  chosen_reading: '''회개''로 옮겼습니다.'
  alternative_readings:
  - 마음의 변화
  - 되돌아섬
  rationale: Hermas의 징계와 회복 맥락에서는 한국 교회어에서 확립된 '회개'가 가장 적절합니다.
  doctrine_reference: 회개 용어의 문맥 우선 원칙
