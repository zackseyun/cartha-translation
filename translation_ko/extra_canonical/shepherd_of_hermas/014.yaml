base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014.yaml
  text: '“Do you want to know about those who are being cut down and hurled far from the tower? These are the sons of lawlessness[a]; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not serviceable for the building on account of their wicked deeds. Therefore they were cut away and flung far off because of the anger of the Lord, because they provoked him.


    2. “And the others you saw—many lying there, not going into the building—these are the scabbed ones: they came to know the truth, but did not remain in it, nor did they cling to the holy ones; therefore they are useless.


    3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but put on a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.


    4. “And the ones cut short—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are truncated and not whole.


    5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”


    6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth—which captivates their souls—has been cut back, then they will be useful to God. For just as a round stone, unless it is trimmed and sheds something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut back, cannot become useful to the Lord.


    7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God[b][c][d][e][f][g][h]; for you yourself also are used from the same stones.”'
  footnotes:
  - marker: a
    text: Semitic idiom meaning people characterized by lawlessness; retained literally to preserve tone.
    reason: cultural_note
    anchor_ref: 3:vi.1 ‘sons of lawlessness’
  - marker: h
    text: 'Greek ἐψωριακότες derives from ψώρα ‘scab, itch.’ Alternatives: ‘scabby,’ ‘mange-covered.’ ‘Leprous’ is not accurate here.'
    reason: lexical_alternative
    anchor_ref: 3:vi.2 ‘scabbed ones’
  - marker: g
    text: Greek σχίσματα can also mean ‘divisions’ or ‘schisms.’ ‘Cracks’ fits the stone metaphor; the ecclesial sense is acknowledged here.
    reason: lexical_alternative
    anchor_ref: 3:vi.3 ‘cracks’
  - marker: f
    text: ψυχαγωγῶν often means to charm or entertain; the phrase highlights the seductive pull of wealth.
    reason: cultural_note
    anchor_ref: 3:vi.6 ‘which captivates their souls’
  - marker: e
    text: Literally ‘four‑cornered’ (τετράγωνος), the standard shape for stones that fit securely in ancient masonry.
    reason: lexical_alternative
    anchor_ref: 3:vi.6 ‘square’
  - marker: d
    text: 'Some witnesses include δὲ (‘and/but’) after ἀπὸ: ‘And learn first from yourself.’ The sense is unchanged.'
    reason: textual_variant
    anchor_ref: 3:vi.7 textual
  - marker: c
    text: 'Greek χρᾶσαι ἐκ τῶν αὐτῶν λίθων is syntactically awkward. Taken deponently: ‘you make use of…’; some interpret it passively, ‘you are also used from the same stones,’ i.e., selected as a stone for the building.'
    reason: lexical_alternative
    anchor_ref: 3:vi.7 ‘make use of the same stones’
  - marker: b
    text: Or 'Become useful to God; for even you yourself make use of the same stones.'.
    reason: previous_rendering
translation:
  language: ko
  text: '“성벽에서 멀리 내던져지고 잘려 나가는 이들이 누구인지 알고 싶습니까? 이들은 불법의 아들들입니다. 그들은 위선 가운데 믿었고, 어떤 악도 그들에게서 떠나지 않았습니다. 그러므로 그들은 구원을 얻지 못합니다. 그들의 악한 행위 때문에 건축에 쓸모가 없기 때문입니다. 그래서 그들은 주님의 분노 때문에 잘려 나가고 멀리 던져졌습니다. 그가 그분을 노하게 했기 때문입니다.


    2. “그리고 당신이 본 다른 이들—많이 누워 있으면서 건축 속으로 들어가지 않는 이들—이들은 딱지가 앉은 사람들입니다. 그들은 진리를 알게 되었지만 그 안에 머물지 않았고, 거룩한 이들에게도 붙어 있지 않았습니다. 그러므로 그들은 쓸모없습니다.


    3. “그리고 금이 간 것들은 누구입니까? 이들은 서로의 마음에 대해 품은 것들이 있고, 서로 평안하지 않으면서도 평화의 얼굴을 하고 있는 사람들입니다. 그러나 그들이 서로를 떠나면, 그들의 악함은 마음속에 남아 있습니다. 그러니 이 금들은 돌들이 가진 금이입니다.


    4. “그리고 잘려 짧아진 것들은, 믿고 있으며 의에서는 더 큰 부분을 가지고 있지만 불법의 어떤 부분들도 가지고 있는 사람들입니다. 그러므로 그들은 잘려 짧아졌고 온전하지 않습니다.


    5. “그리고 하얗고 둥글며 건축에 맞지 않는 것들은 누구입니까, 부인?” 그분이 내게 대답하며 말씀하셨습니다. “언제까지 너는 어리석고 깨닫지 못한 채, 모든 것을 묻고도 아무것도 이해하지 못하겠느냐? 이들은 믿음을 가지고 있으면서도 이 시대의 부를 함께 가진 사람들이다. 환난이 오면, 그들의 부와 그들의 거래 때문에 그들은 자기들의 주님을 부인한다.


    6. 내가 그분께 대답했습니다. “부인, 그렇다면 그들은 언제 건축에 맞게 되겠습니까?” 그분이 말씀하셨습니다. “그들의 혼을 사로잡는 그 부가 잘려 나갈 때, 그때 그들은 하나님께 쓸모 있게 될 것이다. 둥근 돌이 잘려 깎이고 무엇인가를 자기에게서 떼어 내지 않으면 네모난 돌이 될 수 없는 것처럼, 이 시대에 부유한 사람들도 그들의 부가 잘려 나가지 않으면 주님께 쓸모 있게 될 수 없다.


    7. “먼저 너 자신에게서 배우라. 네가 부자였을 때는 쓸모없었지만, 지금은 쓸모 있고 생명에 유익하다. 하나님께 쓸모 있게 되어라. 너 자신도 같은 돌들 가운데서 쓰이고 있기 때문이다.”[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ τῆς ἀνομίας
  english_pob_choice: sons of lawlessness
  chosen_korean: 불법의 아들들
  alternatives_korean:
  - 불법의 자녀들
  - 불법한 자들
  lexicon: BDAG
  rationale: ‘sons of …’라는 셈어적 표현을 살려 문자적 결을 유지했습니다. ‘불법’은 ἀνομία의 기본 의미를 직접 반영합니다.
- source_word: ἐπίστευσαν δὲ ἐν ὑποκρίσει
  english_pob_choice: they believed in hypocrisy
  chosen_korean: 위선 가운데 믿었고
  alternatives_korean:
  - 위선으로 믿었고
  - 가식으로 믿었고
  lexicon: BDAG
  rationale: 명사형 ‘위선’을 살려 신앙의 방식 자체가 왜곡되었음을 드러냈습니다. 한국어에서는 ‘믿었다’에 부사구로 결합해 자연스럽게 옮겼습니다.
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  english_pob_choice: serviceable for the building
  chosen_korean: 건축에 쓸모가 없기 때문입니다
  alternatives_korean:
  - 건축에 적합하지 않기 때문입니다
  - 건축에 유용하지 않기 때문입니다
  lexicon: LSJ
  rationale: 반복되는 돌-건축 비유를 살리기 위해 ‘건축’과 ‘쓸모’의 직설적 어휘를 유지했습니다. 본문 전체의 도구적/실용적 대조를 보존합니다.
- source_word: ἐψωριακότες
  english_pob_choice: scabbed ones
  chosen_korean: 딱지가 앉은 사람들
  alternatives_korean:
  - 딱지투성이인 사람들
  - 옴이 난 사람들
  lexicon: LSJ
  rationale: ψώρα 계열의 구체적이고 불쾌한 신체 이미지를 살리되, ‘나병환자’처럼 과도한 병명으로 옮기지 않았습니다.
- source_word: σχίσματα
  english_pob_choice: cracks
  chosen_korean: 금이 간 것들 / 금이
  alternatives_korean:
  - 갈라진 것들
  - 분열들
  lexicon: LSJ
  rationale: 문맥이 돌의 형상이므로 ‘금’이라는 물질적 균열을 택했습니다. 교회적 의미의 ‘분열’ 가능성은 본문 주석 없이 앞세우지 않았습니다.
- source_word: κεκολοβωμένοι / κολοβοί
  english_pob_choice: cut short / truncated
  chosen_korean: 잘려 짧아진 것들 / 잘려 짧아졌고
  alternatives_korean:
  - 잘린 것들
  - 절단된 것들
  lexicon: LSJ
  rationale: 돌을 다듬다 짧아진 이미지와 불완전함을 동시에 살리기 위해 ‘잘려 짧아지다’로 옮겼습니다. 의학적 뉘앙스는 피했습니다.
- source_word: ὁ ψυχαγωγῶν αὐτούς
  english_pob_choice: which captivates their souls
  chosen_korean: 그들의 혼을 사로잡는
  alternatives_korean:
  - 그들의 영혼을 매혹하는
  - 그들의 혼을 끌어당기는
  lexicon: LSJ
  rationale: ψυχαγωγέω의 ‘혼을 이끌다/사로잡다’는 의미를 반영했습니다. ‘사로잡다’는 부의 매혹적 지배력을 잘 보여 줍니다.
- source_word: γίνεσθε τῷ Θεῷ εὔχρηστοι
  english_pob_choice: Become useful to God
  chosen_korean: 하나님께 쓸모 있게 되어라
  alternatives_korean:
  - 하나님께 유용하게 되십시오
  - 하나님께 쓸모 있는 자가 되십시오
  lexicon: BDAG
  rationale: γίνεσθε의 복수 명령형을 살리기 위해 한국어에서도 일반 청중을 향한 권고로 옮겼습니다. ‘쓸모’는 반복되는 εὔχρηστος 어휘군을 일관되게 반영합니다.
- source_word: χρᾶσαι ἐκ τῶν αὐτῶν λίθων
  english_pob_choice: you yourself also are used from the same stones
  chosen_korean: 너 자신도 같은 돌들 가운데서 쓰이고 있기 때문입니다
  alternatives_korean:
  - 너 자신도 같은 돌들에서 사용되고 있기 때문입니다
  - 너 자신도 같은 돌들에서 쓰이고 있기 때문입니다
  lexicon: LSJ
  rationale: 문맥상 동사 χράομαι의 수동적 이해를 반영하여 ‘쓰이다’로 옮겼습니다. ‘같은 돌들 가운데서’는 선택/소속의 뉘앙스를 자연스럽게 살립니다.
theological_decisions:
- issue: ἅγιοι의 번역
  chosen_reading: ‘거룩한 이들’로 옮겼습니다.
  alternative_readings:
  - 성도
  - 성인들
  rationale: 이 문맥은 제도적 호칭보다 공동체의 거룩함을 가리키는 표현이므로, 더 원문에 가까운 ‘거룩한 이들’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: ἅγιοι → holy ones'
- issue: κύριος / τοῦ Κυρίου의 번역
  chosen_reading: ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 주
  - 주인
  rationale: 본문의 심판 및 관계 호칭으로서 자연스럽고, 한국어 독자에게도 경건한 인격적 호칭을 전달합니다.
  doctrine_reference: 'DOCTRINE.md: κύριος → 주님'
- issue: ‘믿음’과 ‘위선’의 병치
  chosen_reading: πιστεύω 계열을 ‘믿다’로 유지하면서 그 방식이 ‘위선 가운데’였음을 드러냈습니다.
  alternative_readings:
  - 가식적으로 믿다
  - 겉으로만 믿다
  rationale: 단순한 불신이 아니라 왜곡된 믿음이라는 원문 긴장을 보존해야 하므로, 믿음 자체를 지우지 않고 방식의 타락을 표현했습니다.
  doctrine_reference: 'DOCTRINE.md: πιστεύω/πίστις — faith under distortion'
