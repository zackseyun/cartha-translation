revisions:
- from: “이것들이 좋은 것 같나요?” “주님, 이것보다 나은 것이 무엇입니까?” 나는 말한다. “그러므로 가서 그들 가운데서 행하고 그들에게서 자제하지 마십시오. 그러면 여러분은 하느님을 위하여 살 것입니다.
  to: '“이것들이 그대에게 좋은 것으로 보입니까?”

    “주님, 무엇이 이것들보다 더 좋겠습니까?” 하고 내가 말했습니다.

    “그러니 이것들을 따라 살아가며, 이것들을 삼가지 마십시오. 그러면 하느님을 위하여 살게 될 것입니다.”'
  rationale: 대명사의 지시 대상(선한 것들)을 ‘이것들’로 분명히 하고, πορεύεσθαι ἐν의 관용적 윤리 표현을 자연스러운 한국어로 옮겼습니다. 또한 ‘삼가지 마십시오’로 ἐγκρατεύεσθαι의 문맥상 역설을 보존했습니다.
  reviewer_model: gpt-5.6-terra
