  source_fidelity: 초안은 선행되는 선행 목록이라는 구조와 다수의 항목을 반영하지만, 핵심 명령인 ‘믿음에서 걸려 넘어진 이들을 내버리지 말고 돌이켜 기쁘게 하라’(μὴ ἀποβάλλεσθαι ... ἀλλ᾿ ἐπιστρέφειν καὶ εὐθύμους ποιεῖν)를 ‘쫓아내고’로 정반대로 옮겼습니다. 또한 ἐξ ἀναγκῶν λυτροῦσθαι는 일반적 ‘환난’보다 ‘곤경/궁핍에서 구해 내다’가 정확하며, 목록의 문장 경계와 병렬이 크게 훼손되었습니다.
  naturalness: 초안의 ‘다음에는 다음의 것을 들으라’, ‘조용함’, ‘오래 참음’ 등은 현대 표준어 합쇼체의 자연스러운 병렬 목록으로 읽히지 않습니다. 모든 항목을 ‘-하는 것’ 형태로 통일하고, 도입 명령을 현대적 존대 명령형으로 다듬었습니다.
  terminology: ‘과부’, ‘고아’, ‘형제애’, ‘의’, ‘믿음’은 원문의 의미와 한국어 종교·윤리 문맥에 맞게 유지했습니다. φιλόξενον εἶναι는 단순히 나그네 한 사람을 대접한다기보다 ‘손님을 잘 대접하는 것’으로, λυτροῦσθαι는 ‘구해 내는 것’으로 옮겼습니다. ἀδελφότητα는 특정 교파적 조직 명칭으로 좁히지 않고 ‘형제애’를 유지했습니다.
