revisions:
- from: “다음에는 다음의 것을 들으라 과부들을 섬기는 것, 고아와 궁핍한 자를 방문하는 것, 하나님의 종들을 환난에서 속량하는 것, 나그네를 대접하는 것(손대접할 때에 때로 선한 일을 할 기회를 얻음이니라), 아무에게도 대적하지 아니하는 것, 조용함, 모든 사람보다 낮아지는 것, 노인을 공경하는 것, 의를 행하는 것, 형제애를 보존하는 것, 욕을 참는 것, 오래 참음, 원한을 품지 아니하는 것, 심령이 피곤한 자를 격려하고, 믿음에서 떨어진 자들을 쫓아내고 그들을 돌아서게 하며 죄를 지은 자들을 권면하여 채무자와 궁핍한 자들을 학대하지 말며 이런 것입니다.
  to: “이제 이것들에 뒤따르는 것들을 들으십시오. 과부들을 섬기는 것, 고아들과 궁핍한 사람들을 돌보는 것, 하나님의 종들을 곤경에서 구해 내는 것, 손님을 잘 대접하는 것(손님을 대접하다 보면 때로 선을 행할 기회를 얻게 됩니다), 아무에게도 맞서지 않는 것, 조용히 지내는 것, 모든 사람보다 자신을 낮추는 것, 노인을 공경하는 것, 의를 실천하는 것, 형제애를 지키는 것, 모욕을 견디는 것, 오래 참는 것, 원한을 품지 않는 것, 마음이 지친 사람들을 격려하는 것, 믿음에서 걸려 넘어진 사람들을 내버리지 말고 돌이켜 기쁘게 하는 것, 죄를 짓는 사람들을 훈계하는 것, 채무자들과 궁핍한 사람들을 괴롭히지 않는 것, 그리고 이와 같은 것들입니다.”
  rationale: 원문의 병렬된 실천 목록을 현대 한국어의 일관된 ‘-하는 것’ 형식으로 재구성했습니다. 특히 믿음에서 넘어진 사람에 대한 돌봄의 명령을 원문대로 보존했으며, 구금·노예제에 관한 λυτροῦσθαι는 역사적 제도를 과도하게 확대하지 않고 문맥상 ‘곤경에서 구해 내다’로 번역했습니다. 괄호 속 환대의 선행 가능성도 유지했습니다.
