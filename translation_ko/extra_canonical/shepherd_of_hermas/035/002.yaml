review_pass:
  verdict: revise
  source_fidelity: 초안은 선을 행하지 않기 위한 절제와 악을 행하지 않기 위한 절제의 대조를 대체로 반영합니다. 그러나 마지막 권면에서 원문의 ‘모든 악을 삼가며 선을 행하라’를 ‘절제하여 선을 행하라’로 축소하여 ‘모든 악’이라는 범위와 ‘악을 삼감’의 대상을 놓쳤습니다.
  naturalness: 초안은 합쇼체를 요구하면서도 ‘행치 말며’, ‘행하라’, ‘것이요’, ‘너희가’처럼 문체와 인칭이 섞여 있습니다. 현대 표준어 합쇼체로 일관되게 다듬을 필요가 있습니다.
  terminology: ἐγκρατεύεσθαι는 이 문맥에서 악을 행하지 않도록 자신을 절제하거나 삼가는 뜻입니다. ‘악한 것을 절제하다’는 한국어로 대상 관계가 부자연스러우므로 ‘악한 일은 절제하여 그것을 행하지 마십시오’로 옮겼습니다. δικαιοσύνη는 여기서 ‘의’로 유지할 수 있습니다.
  issues:
  - severity: high
    issue: 마지막 문장에서 ‘모든 악에서 절제하고’라는 원문의 범위와 대상이 누락되었습니다.
    rationale: ἐγκράτευσαι οὖν ἀπὸ πονηρίας πάσης ἐργαζόμενος τὸ ἀγαθόν은 모든 악을 삼가면서 선을 행하라는 권면입니다.
  - severity: medium
    issue: 합쇼체가 일관되지 않고 인칭이 혼용됩니다.
    rationale: ‘알려 주십시오’ 뒤에 ‘행하라’와 ‘너희가’가 이어져, 목표 독자층과 현대 formal-polite register에 맞지 않습니다.
  - severity: medium
    issue: ‘악한 것을 절제하고’는 한국어에서 의미 관계가 불분명합니다.
    rationale: 절제의 대상은 악 자체라기보다 악을 행하려는 행위·욕망이므로, 문맥상 ‘악한 일은 절제하여 그것을 행하지 마십시오’가 자연스럽고 충실합니다.
