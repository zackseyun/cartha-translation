revisions:
- from: “주님, 사람이 절제해야 할 일과 하지 말아야 할 일을 나에게 알려 주십시오.” “듣고 악한 것을 절제하고 행치 말며 선한 것을 절제하지 말고 도리어 행하라 너희가 절제하여 선을 행하지 아니하면 큰 죄를 범하는 것이요, 악을 행하지 아니하려고 절제하면 큰 의를 이루는 것이니 그러므로 절제하여 선을 행하라.”
  to: “주님, 무엇에 대해서는 절제해야 하고 무엇에 대해서는 절제하지 않아야 하는지 제게 알려 주십시오.” “들으십시오. 악한 일은 절제하여 그것을 행하지 마십시오. 그러나 선한 일은 절제하지 말고 그것을 행하십시오. 선을 행하지 않으려고 절제한다면 큰 죄를 짓는 것입니다. 그러나 악을 행하지 않으려고 절제한다면 큰 의를 이루는 것입니다. 그러므로 모든 악을 삼가며 선을 행하십시오.”
  rationale: 원문의 대조 구조와 반복되는 ‘절제’ 어휘를 보존하되, 한국어에서 자연스럽게 이해되도록 절제의 대상과 행위의 대상을 명확히 했습니다. 또한 누락된 ‘모든 악’을 복원하고 문체를 현대 표준어 합쇼체로 통일했습니다.
  reviewer_model: gpt-5.6-terra
