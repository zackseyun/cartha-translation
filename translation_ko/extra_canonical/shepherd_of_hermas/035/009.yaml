    rationale: 이 표현은 선한 덕목들 ‘로부터’ 자신을 억제하거나 삼가지 않는다는 뜻입니다. 초안의 ‘절제하지 아니하면’은 무엇을 절제하지 않는지 불명확하며, 한국어에서는 일반적으로 절제 자체를 긍정적으로 이해하게 하므로 원문의 역설적 권면을 충분히 전달하지 못합니다.
  - severity: medium
