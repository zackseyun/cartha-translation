  source_fidelity: 핵심 대조 표현인 μὴ ἐγκρατεύηται ἀπ᾿ αὐτῶν(‘그것들로부터 절제하지 않다’, 곧 선한 일들을 삼가거나 억제하지 않다)이 초안에서는 ‘절제하지 아니하면’으로 번역되어 의미가 불분명하고, 문맥상 반대가 될 소지가 있습니다. 또한 ‘자기 생활에 복을 받으느니라’는 μακάριος γίνεται(‘복되게 된다’)를 다소 부자연스럽게 옮깁니다.
  naturalness: 합쇼체의 현대 표준어로 문장을 분명히 하고, 열거 뒤의 서술 관계를 자연스럽게 다듬었습니다.
  terminology: πίστις는 ‘믿음’, φόβος κυρίου는 ‘주님을 경외함’, ὁμόνοια는 ‘화합’, ῥήματα δικαιοσύνης는 복수성을 살려 ‘의로운 말들’, ὑπομονή는 ‘인내’로 옮겼습니다. 특정 교파적 해석은 더하지 않았습니다.
  issues:
