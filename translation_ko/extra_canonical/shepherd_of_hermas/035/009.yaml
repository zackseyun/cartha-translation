revisions:
- from: “먼저 믿음과 주를 경외함과 사랑과 화합과 의의 말과 진리와 인내는 사람의 생활에 이보다 더 나은 것이 없나니 누구든지 이것을 지키고 절제하지 아니하면 자기 생활에 복을 받으느니라.
  to: “무엇보다 먼저 믿음, 주님을 경외함, 사랑, 화합, 의로운 말들, 진리, 인내가 있습니다. 사람의 삶에는 이것들보다 더 좋은 것이 없습니다. 누구든지 이것들을 지키고 이것들로부터 자신을 억제하지 않으면, 자기 삶에서 복되게 됩니다.”
  rationale: 원문의 덕목 열거와 ‘선한 것들은 억제하지 말고 행하라’는 앞선 문맥을 반영하여, 절제의 대상이 선한 덕목들임을 명시했습니다. ‘복되게 됩니다’로 원문의 서술을 자연스러운 현대 합쇼체로 옮겼습니다.
