revisions:
- from: “주님, 우리가 자제해야 할 악에는 어떤 종류가 있습니까?” 그는 이렇게 말합니다. “간음과 음행과 불법적인 술 취함과 악한 사치와 많은 음식과 사치와 자랑과 거만과 교만과 거짓말과 중상과 위선과 분개와 모든 신성 모독에서 떠나십시오.
  to: “주님, 우리가 자제해야 할 악에는 어떤 것들이 있습니까?” 내가 말하자, 그가 말씀하셨습니다. “들으십시오. 간음과 음행, 무절제한 술 취함, 악한 사치, 많은 음식, 재물의 호화로움, 자랑, 거만, 교만, 거짓말, 비방, 위선, 앙심, 그리고 온갖 신성 모독을 멀리하십시오.”
  rationale: 원문의 열거 순서와 의미를 보존하면서, 누락된 ‘재물의 호화로움’을 복원했습니다. 도덕적 권면의 격식 있는 합쇼체를 유지하고, 원문의 ‘자제하다’와 결론의 ‘~에서 떠나다’의 의미 관계를 자연스러운 한국어로 표현했습니다.
