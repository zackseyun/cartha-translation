  text: “주님, 우리가 자제해야 할 악에는 어떤 종류가 있습니까?” 그는 이렇게 말합니다. “간음과 음행과 불법적인 술 취함과 악한 사치와 많은 음식과 사치와 자랑과 거만과 교만과 거짓말과 중상과 위선과 분개와 모든 신성 모독에서 떠나십시오.
