revisions:
- from: “그러므로 이 계명을 지키라 너희가 선을 행하고 절제하지 아니하면 하나님을 위하여 살리니 이 일을 행하는 자마다 하나님을 위하여 살리라 또 너희가 악을 행하지 아니하고 절제하지 아니하면 하나님을 위하여 살리니 무릇 이 계명을 지켜 행하는 자는 하나님을 위하여 살리라.”
  to: 그러므로 이 계명을 지키십시오. 선을 행하고 선을 행하기를 삼가지 않으면, 하나님을 위하여 살 것입니다. 이와 같이 행하는 모든 사람도 하나님을 위하여 살 것입니다. 또 악을 행하지 않고 악을 행하기를 삼가면, 하나님을 위하여 살 것입니다. 이 계명들을 지키고 그 안에서 행하는 모든 사람도 하나님을 위하여 살 것입니다.
  rationale: 원문의 반복적 권면과 선·악에 대한 역설적 ‘절제’의 대조를 한국어에서 명시적으로 재현했습니다. ‘하나님을 위하여 살다’는 τῷ θεῷ의 방향성을 보존하며, 교파적 해석을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:52Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 핵심 대조인 ‘선을 행하기를 삼가지 말라’와 ‘악을 행하기를 삼가라’가 초안에서 충분히 보존되지 않았습니다. 특히 두 번째 조건절은 그리스어 ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ(악을 삼가다)와 반대로 ‘절제하지 아니하면’으로 옮겨져 의미가 뒤집혔습니다.
  naturalness: 초안은 문장부호와 접속이 부족하여 현대 한국어 합쇼체 문장으로 읽기 어렵습니다. 조건절과 결과절을 분명히 나누어 자연스럽게 다듬었습니다.
  terminology: ἐγκρατεύεσθαι의 이 문맥상 용법은 일반적 자기 절제 자체보다 특정 행위를 ‘삼가다’라는 뜻이므로, 선과 악 각각에 대해 ‘행하기를 삼가다’로 일관되게 옮겼습니다. ζῇν τῷ θεῷ는 원문의 방향성을 보존하여 ‘하나님을 위하여 살다’로 유지했습니다.
  issues:
  - severity: high
    issue: 악에 관한 둘째 조건절의 의미가 반대로 번역됨
    rationale: 원문은 ‘악을 행하지 않고 그것을 삼가면’이라고 하나, 초안은 ‘절제하지 아니하면’이라고 하여 ἐγκρατεύσῃ의 의미를 부정했습니다.
  - severity: high
    issue: 선에 관한 첫째 조건절에서 ‘선을 행하기를 삼가지 말라’는 대조가 불명확함
    rationale: 원문의 논지는 선을 행하는 데서는 삼가지 말고, 악을 행하는 데서는 삼가라는 것입니다. 이를 명시해야 대조 구조가 보존됩니다.
  - severity: medium
    issue: 마지막의 복수형 ‘이 계명들’이 단수형으로 축소됨
    rationale: 원문 ταύτας τὰς ἐντολάς는 ‘이 계명들’을 뜻하므로 복수로 옮기는 것이 정확합니다.
  - severity: medium
    issue: 현대 합쇼체의 문장 구조와 문장부호가 미흡함
    rationale: 명령문, 조건절, 병렬 구조를 현대적인 격식체로 명확히 구분할 필요가 있습니다.
