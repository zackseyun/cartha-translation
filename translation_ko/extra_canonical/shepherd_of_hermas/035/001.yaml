  text: 그가 말씀하셨습니다. “내가 너에게 하나님께서 지으신 것들에는 두 가지 측면이 있다고 말했습니다. 절제에도 두 가지가 있습니다. 어떤 것들에 대해서는 절제해야 하지만, 어떤 것들에 대해서는 절제해서는 안 됩니다.”
