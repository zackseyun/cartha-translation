review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 권면을 대체로 반영하지만, ἀπὸ πάντων τούτων(‘이 모든 것에서/로부터’)을 ‘이 모든 것 가운데서’로 옮겨 방향이 바뀌었고, 단수 2인칭을 복수 ‘너희’로 바꾸었습니다. 또한 ‘하느님/하나님’이 혼용되며, ‘절제할찌니’와 이어지는 문장은 현대 표준어와 문장 구조에 맞지 않습니다.
  naturalness: 인용 대화의 경계와 문장부호를 정리하고, 현대 합쇼체로 자연스럽게 다듬어야 합니다. ‘악한 것 같지 아니하니?’ 및 ‘절제할찌니’는 이 번역의 요구 register에 비해 고어적·비표준적입니다.
  terminology: δοῦλοι τοῦ θεοῦ는 ‘하나님의 종들’로, δουλεύων τῷ θεῷ는 ‘하나님을 섬기는 사람’으로 일관되게 옮겼습니다. ἐγκρατεύεσθαι는 본문에서 반복되는 ‘악을 하지 않는 절제’를 드러내도록 ‘절제하십시오/절제하는’으로 유지했습니다. θεός의 호칭은 초안의 주된 용례에 맞추어 ‘하나님’으로 통일했습니다.
  issues:
  - severity: high
    issue: ‘이 모든 것 가운데서 절제할찌니’
    rationale: 원문의 ἀπὸ πάντων τούτων은 악행들 ‘로부터/에서’ 자신을 절제하라는 뜻이지, 그 악행들 ‘가운데서’ 절제하라는 뜻이 아닙니다.
  - severity: medium
    issue: ‘너희가 하나님을 향하여 살며’
    rationale: 원문 ζήσῃ는 단수 2인칭이며, ζῆν τῷ θεῷ는 ‘하나님을 위하여/하나님께 속하여 살다’라는 여격 표현입니다. 복수화와 ‘향하여’는 수정이 필요합니다.
  - severity: medium
    issue: 하느님/하나님 혼용 및 비현대적 문체
    rationale: 한 단락 안에서 신명 호칭이 혼용되고, ‘아니하니’, ‘절제할찌니’는 현대 표준어 합쇼체에 맞지 않습니다.
  - severity: low
    issue: ‘그들 가운데서 절제하는 자들’
    rationale: 원문의 αὐτά는 사람들보다 앞서 열거된 악행들을 가리킵니다. 한국어에서는 ‘그것들을 절제하는 사람들’보다 ‘그러한 것들을 절제하는 사람들’이 자연스럽고 지시 대상도 분명합니다.
