revisions:
- from: “네가 보기에는 이것들이 악한 것 같지 아니하니?” 나는 “하느님의 종들에게는 매우 악한 일입니다”라고 말합니다. “하나님을 섬기는 자는 이 모든 것 가운데서 절제할찌니 그런즉 이 모든 것에 절제하라 그리하면 너희가 하나님을 향하여 살며 그들 가운데서 절제하는 자들과 함께 등록되리라 그러므로 이것들은 절제할 것이니라.
  to: '“이것들이 네게 악한 것으로 보이지 않느냐?”


    제가 말했습니다. “하나님의 종들에게는 아주 악한 것들입니다.”


    그가 말했습니다. “하나님을 섬기는 사람은 이 모든 것에서 절제해야 합니다. 그러므로 이 모든 것에서 절제하십시오. 그러면 하나님을 위하여 살고, 그러한 것들을 절제하는 사람들과 함께 기록될 것입니다. 그러므로 네가 절제해야 할 것은 바로 이러한 것들입니다.”'
  rationale: 원문의 화자 전환, 단수 2인칭, ἀπό의 ‘~로부터’ 의미, 그리고 ‘하나님을 위하여 살다’라는 여격 표현을 반영했습니다. 반복되는 ἐγκρατεύεσθαι는 문맥상 ‘악한 행위를 하지 않도록 절제하다’라는 권면을 보존하도록 일관되게 번역했습니다.
  reviewer_model: gpt-5.6-terra
