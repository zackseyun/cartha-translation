  text: “주님, 아직도 악한 일이 있습니까?”라고 나는 말합니다. “하느님의 종이 자제해야 할 일이 많이 있습니다. 곧 도적질, 거짓, 속임, 거짓 증언, 탐욕, 악한 욕망, 속임, 허영, 자랑, 그리고 또 이와 같은 것들이 있습니다.”
