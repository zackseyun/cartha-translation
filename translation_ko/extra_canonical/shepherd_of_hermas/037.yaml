base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037.yaml
  text: '“Remove sorrow from yourself,” he says[a], “for it is a sister of double‑mindedness and quick temper.”


    “How, lord,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness another, and sorrow another.”


    “You are senseless, man,” he says, “and do you not perceive that sorrow is more evil than all the spirits and most dreadful for the slaves of God, and that beyond all the spirits it destroys a person and wears away the Holy Spirit—and then saves again?”


    “I, lord,” I say, “am senseless, and I do not understand these parables. For how can it wear away and then save? I do not understand.”


    “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.


    “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord[h][g][f][e][d][c][b], and you will understand and comprehend all things.”'
  footnotes:
  - marker: a
    text: The Greek λύπη can also be rendered ‘grief’ or ‘sadness.’ The vice here is personified as a ‘sister’ to other vices.
    reason: lexical_alternative
  - marker: b
    text: Ὀξυχολία denotes a choleric, hot‑tempered disposition; alternatives include ‘quick temper’ or ‘irritability.’
    reason: lexical_alternative
  - marker: c
    text: ‘Slaves of God’ translates δοῦλοι τοῦ θεοῦ; some render ‘servants of God,’ but the stronger term highlights allegiance and ownership.
    reason: lexical_alternative
  - marker: d
    text: ‘Wears down’ (ἐκτρίβει) pictures attrition by friction; alternatives include ‘rub out’ or ‘grind away.’
    reason: lexical_alternative
  - marker: e
    text: '‘Parables of the divine’ reflects θεότης, an abstract for God’s divine nature or reality; alternatives: ‘of God,’ ‘of the Deity,’ or ‘of the Godhead.’'
    reason: lexical_alternative
  - marker: f
    text: ‘Pagan friendships’ (φιλίαι ἐθνικαί) points to entangling social ties with non‑Christian pagan society, not a prohibition on neighbor‑love.
    reason: cultural_note
  - marker: g
    text: The paradox ‘and again saves’ is intentional; Hermas will distinguish sorrow that destroys from sorrow that leads to salvation in the next section of Mandate 10.
    reason: cross_reference
  - marker: h
    text: Or 'nor sought about the divine'.
    reason: previous_rendering
translation:
  language: ko
  text: '“근심을 네 자신에게서 제거하십시오”라고 그는 말합니다. “근심은 이중마음과 성급함의 자매이기 때문입니다.


    “어째서입니까, 주님”이라고 제가 말합니다. “그것이 이 둘의 자매입니까? 성급함은 제게 한 가지이고, 이중마음은 또 다른 것이며, 근심은 또 다른 것으로 보입니다.”


    “어리석은 사람이로다”라고 그는 말합니다. “너는 근심이 모든 영들보다 더 악하고, 하나님의 종들에게는 가장 두려운 것임을 알지 못하느냐? 그리고 모든 영보다도 더 사람을 파멸시키고 성령을 닳아 없어지게 하다가 — 다시 살리기도 한다는 것을 알지 못하느냐?”


    “저는, 주님”이라고 제가 말합니다. “어리석습니다. 이 비유들을 이해하지 못하겠습니다. 어떻게 닳아 없어지게 하다가 다시 살릴 수 있습니까? 이해하지 못하겠습니다.”


    “들으십시오”라고 그는 말합니다. “진리에 관하여 결코 탐구하지도 않고, 신적인 것에 관하여도 찾지 않았으나, 오직 믿기만 했고, 이 시대의 많은 사업과 부와 이방인과의 우정과 다른 여러 일들에 얽혀 있는 사람들 — 그러므로 이런 것들에 마음을 두는 사람들은 신적인 것의 비유들을 이해하지 못합니다. 그들은 이런 일들에 의해 어두워지고, 파괴되며, 황폐해집니다. 좋은 포도원도 돌보지 않으면 가시와 여러 잡초 때문에 황폐해지듯이, 앞서 말한 이 많은 일들에 빠져드는 믿는 사람들도 자기의 이해에서 빗나가, 의에 관하여는 전혀 아무것도 이해하지 못합니다. 또한 신적인 것과 진리에 관하여 들어도, 그들의 마음은 자기 일에 사로잡혀 있어 전혀 아무것도 이해하지 못합니다.


    “그러나 하나님을 경외하고 신적인 것과 진리에 관하여 탐구하며, 마음을 주님께 두는 사람들은 자기에게 말해 주는 모든 것을 더 빨리 이해하고 깨닫습니다. 그들 안에 주님을 경외함이 있기 때문입니다. 주님이 계시는 곳에는 많은 깨달음도 있기 때문입니다. 그러므로 주님께 붙으십시오. 그러면 모든 것을 이해하고 깨달을 것입니다.”[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπη
  english_pob_choice: sorrow
  chosen_korean: 근심
  alternatives_korean:
  - 슬픔
  - 비탄
  lexicon: LSJ
  rationale: 이 단락의 λύπη는 단순 감정명사이면서 도덕적 해악으로 의인화되므로, 일상적이면서도 내적 부담을 드러내는 ‘근심’이 가장 자연스럽습니다.
- source_word: διψυχία
  english_pob_choice: double-mindedness
  chosen_korean: 이중마음
  alternatives_korean:
  - 두 마음
  - 의심
  lexicon: LSJ
  rationale: 분열된 내면과 흔들림을 직접 드러내는 말로, 한국어 교회어의 관용적 표현보다 원문의 결을 살리는 ‘이중마음’을 택했습니다.
- source_word: ὀξυχολία
  english_pob_choice: quick temper
  chosen_korean: 성급함
  alternatives_korean:
  - 급한 성질
  - 격한 성질
  - 분노
  lexicon: LSJ
  rationale: 단발적 분노보다 쉽게 달아오르는 성향을 가리키므로, 한국어에서 그 성향을 넓게 담는 ‘성급함’으로 옮겼습니다.
- source_word: δοῦλοι τοῦ θεοῦ
  english_pob_choice: slaves of God
  chosen_korean: 하나님의 종들
  alternatives_korean:
  - 하나님의 노예들
  - 하나님의 종들
  lexicon: LSJ
  rationale: POB의 영어는 강한 종속성을 살리지만, 한국어 ‘노예’는 이 문맥에서 지나치게 비유적 파괴력을 줄 수 있어, 신분적 소속을 드러내는 ‘종들’로 두었습니다.
- source_word: ἐκτρίβει
  english_pob_choice: wears away
  chosen_korean: 닳아 없어지게 하다
  alternatives_korean:
  - 갉아 없애다
  - 마모시키다
  - 갈아 없애다
  lexicon: LSJ
  rationale: 마찰에 의한 소모라는 이미지를 살리기 위해 ‘닳아 없어지게 하다’를 택해, 영을 직접 파괴한다기보다 소진시키는 비유를 보존했습니다.
- source_word: θεότης
  english_pob_choice: the divine
  chosen_korean: 신적인 것
  alternatives_korean:
  - 하나님
  - 신성
  - 신성한 것
  lexicon: LSJ
  rationale: 추상명사 θεότης의 성격을 유지하면서도 한국어에서 지나치게 형이상학적이거나 교리화된 용어를 피하기 위해 ‘신적인 것’을 사용했습니다.
theological_decisions:
- issue: τὸ πνεῦμα τὸ ἅγιον의 번역과 소멸/회복의 긴장
  chosen_reading: 성령을 닳아 없어지게 하다가 — 다시 살리기도 한다
  alternative_readings:
  - 성령을 약화시키다가 — 다시 구원하기도 한다
  - 거룩한 영을 소모시키다가 — 다시 살리기도 한다
  rationale: 원문의 역설을 해소하지 않고 그대로 보존했습니다. 여기서의 ‘닳아 없어지게 함’은 하나님의 본질 훼손이 아니라 사람 안에서의 작용과 유익의 소진을 가리키는 수사로 읽어야 하므로, 다음 문맥의 긴장을 그대로 남겼습니다.
  doctrine_reference: Hermas Mandate 10의 뒤이은 전개에서 ‘근심’의 두 종류가 구분됨
- issue: τὸ πνεῦμα τὸ ἅγιον의 표기
  chosen_reading: 성령
  alternative_readings:
  - 거룩한 영
  - 성스러운 영
  rationale: 이 구절은 그리스도의 내주와 관련된 문맥이 아니라, 하나님께 속한 영의 실재를 가리키므로 한국어 교회 전통과도 맞는 ‘성령’을 유지하되, 문맥상 인간 안에서의 작용을 함께 읽게 했습니다.
  doctrine_reference: 영의 내주와 인간 내면에 대한 고대 기독교적 수사
