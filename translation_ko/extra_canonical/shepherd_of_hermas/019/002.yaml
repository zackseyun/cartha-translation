  naturalness: 초안은 합쇼체와 고어체 종결(‘-함이니라’, ‘-느니라’)이 섞여 있고, 큰따옴표와 영어식 따옴표가 혼용되어 있습니다. 현대 표준 한국어의 일관된 합쇼체로 다듬는 것이 필요합니다.
  terminology: καθέδρα는 문맥상 ‘의자’로, ἀσθενής/ἀσθένεια는 ‘연약한 사람/연약함’으로 옮겼습니다. τύπος는 해석을 과도하게 덧붙이지 않고 ‘모형’으로 유지했습니다.
