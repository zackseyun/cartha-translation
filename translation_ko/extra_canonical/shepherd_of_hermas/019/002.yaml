- from: '"그럼 왜 그녀는 의자에 앉아 있었나요? 알고 싶었어요." “이는 약한 자마다 자기의 연약함을 인하여 의자에 앉음이라 그 몸의 연약함을 받들어 주려 함이니라 너희는 첫째 환상의 본을 가졌느니라.”'
  to: “그러면 왜 그녀는 의자에 앉아 있었습니까? 알고 싶습니다, 주님.” “모든 연약한 사람은 자신의 연약함 때문에 의자에 앉습니다. 이는 그 몸의 연약함이 지탱되게 하려는 것입니다. 당신은 첫째 환상의 모형을 지니고 있습니다.”
  rationale: 문답의 구조와 이유절을 보존하면서, 단수 호칭을 반영하고 현대 합쇼체로 통일했습니다. σώματος의 단수 지시를 ‘그 몸’으로 유지했으며, τύπος는 특정 신학적 해석을 부가하지 않는 ‘모형’으로 옮겼습니다.
