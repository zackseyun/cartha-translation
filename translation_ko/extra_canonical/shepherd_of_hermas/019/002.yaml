  language: ko
  text: “그러면 왜 그녀는 의자에 앉아 있었습니까? 알고 싶습니다, 주님.” “모든 연약한 사람은 자신의 연약함 때문에 의자에 앉습니다. 이는 그 몸의 연약함이 지탱되게 하려는 것입니다. 당신은 첫째 환상의 모형을 지니고 있습니다.”
