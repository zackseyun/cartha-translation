  text: '"그럼 왜 그녀는 의자에 앉아 있었나요? 알고 싶었어요." “이는 약한 자마다 자기의 연약함을 인하여 의자에 앉음이라 그 몸의 연약함을 받들어 주려 함이니라 너희는 첫째 환상의 본을 가졌느니라.”'
