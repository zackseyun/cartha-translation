  source_fidelity: 초안은 여성 인물을 남성 대명사로 옮기고, ‘세 가지 μορφαί’, ‘두 마음’, ‘무관심/태만에 자신을 내맡김’, 주님께 염려를 맡김 등의 의미와 문장 관계를 여러 곳에서 불명확하거나 부정확하게 처리했습니다. 원문의 1–3절 범위와 영어 감사 번역의 범위를 따라 수정했습니다.
  naturalness: 초안은 문장부호와 띄어쓰기가 부족하고 ‘첫번째’, ‘의자에 앉은 노파의 모습’, ‘두 마음을 품음이라 힘이 없느니라’ 등에서 현대 표준 한국어 합쇼체의 자연스러운 흐름이 깨집니다. 인용문 안에서도 현대적이면서 격식 있는 종결로 다듬었습니다.
  terminology: μορφαί는 ‘모양’보다 문맥상 ‘형상’으로, πνεῦμα는 ‘영’으로, διψυχίαι는 의미를 보존하여 ‘두 마음’으로 옮겼습니다. κοίμησις의 완곡한 표현은 원문을 과도하게 해석하지 않고 ‘잠’으로 유지했습니다. ἀκηδίαι는 ‘방임’이 아니라 ‘무관심’으로 옮겼습니다.
  issues:
  - severity: high
    issue: 여성 인물 지시의 오역
    rationale: 원문은 ὤφθη(그녀가 나타났다) 및 영어 감사 번역의 ‘she’를 통해 첫 환상의 여성 형상을 가리키는데, 초안은 ‘그가’로 옮겼습니다.
  - severity: high
    issue: 핵심 원인절과 대조절의 의미·문법 불명확
    rationale: ‘너희 연약함과 두 마음을 품음이라 힘이 없느니라’는 ‘너희의 약함과 두 마음 때문에 힘이 없다’는 원문 의미를 자연스럽고 정확하게 전달하지 못합니다. 또한 ‘스스로 방임’은 자신을 무관심/태만에 내맡긴다는 뜻을 잃습니다.
  - severity: medium
    issue: 현대 표준어 합쇼체 및 문장 구조 미준수
    rationale: 띄어쓰기, 문장부호, 인용문의 종결 방식이 미흡하며, 장문의 논리 관계가 분명하지 않습니다.
  - severity: low
    issue: μορφαί의 표현
    rationale: ‘세 가지 모양’도 가능한 번역이나, 환상에서 나타난 모습들을 가리키는 문맥에는 ‘세 가지 형상’이 더 자연스럽고 정확합니다.
