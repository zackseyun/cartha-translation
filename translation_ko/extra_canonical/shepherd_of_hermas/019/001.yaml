revisions:
- from: '"네가 묻는 세 가지 모양에 대하여 들으라 첫번째 환상에서 그가 왜 네게 의자에 앉은 노파의 모습으로 나타났느냐 이는 네 심령이 늙고 이미 말랐고 너희 연약함과 두 마음을 품음이라 힘이 없느니라 늙은이가 더 이상 새 힘을 얻을 바를 바랄 수 없듯 잠 외에는 아무 것도 바라지 아니함과 같이 너희도 인생의 일로 약하여 스스로 방임하였으니 너희 염려를 주께 맡기지 아니하였으니 도리어 너희 마음이 상하였고 슬픔 중에 늙었느니라.”'
  to: “네가 묻고 있는 세 가지 형상에 대하여 들으십시오. 첫째 환상에서, 왜 그녀가 늙은 여자로서 의자에 앉아 네게 나타났습니까? 그것은 너희의 영이 늙고 이미 시들었으며, 너희의 약함과 두 마음 때문에 힘이 없기 때문입니다. 늙은 사람들이 더 이상 새로워질 희망이 없어서 자기들의 잠 외에는 아무것도 기대하지 않는 것처럼, 너희도 삶의 일들로 약해져 자신을 무관심에 내맡겼고, 너희의 염려를 주님께 맡기지 않았습니다. 오히려 너희의 마음은 산산이 부서졌고, 너희는 슬픔 가운데 늙어 버렸습니다.”
  rationale: 원문의 문답 구조와 복수 청자에 대한 호소를 유지하고, 여성으로 나타난 첫 환상의 형상, 영의 쇠약, 약함과 두 마음, 삶의 일들, 무관심, 주님께 염려를 맡기지 않음, 마음의 파괴와 슬픔으로 인한 노쇠라는 논리적 전개를 현대 한국어로 명료하게 옮겼습니다. 원문에 있는 ‘잠’의 완곡성을 유지했으며 교리적 해석을 덧붙이지 않았습니다.
