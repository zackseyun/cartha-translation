base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess? Did I not always respect you as a sister? Why do you falsely accuse me, woman, of these wicked and unclean things?"'
translation:
  language: ko
  text: 내가 말했느냐? 내가 항상 너희를 여신으로 여기지 않았느냐? 내가 항상 너희를 자매로 존중하지 않았느냐? 여자여, 어찌하여 이 악하고 더러운 일들을 내게 거짓으로 고발하느냐?
  philosophy: optimal-equivalence
lexical_decisions:
- term: Did I not always regard you as a goddess?
  korean: 여신으로 여기지 않았느냐
  rationale: Source Greek context implies a metaphorical or delusional attribution of divinity to the speaker by the addressee. '여신' (goddess) is used to preserve the specific noun rather than generalizing to '존귀한 분' (honorable person), maintaining the tension of the accusation.
- term: Did I not always respect you as a sister?
  korean: 자매로 존중하지 않았느냐
  rationale: '''자매'' (sister) is used to reflect the familial/spiritual bond implied in the Shepherd of Hermas tradition, distinct from ''누이'' which is more archaic or poetic. ''존중'' (respect) captures the verb ''regard''/''honour'' in the context of the accusation.'
- term: wicked and unclean things
  korean: 악하고 더러운 일들
  rationale: Direct translation of 'wicked' (πονηρά) and 'unclean' (ἀκάθαρτα) to preserve the moral and ritualistic weight of the accusation without softening to '나쁜 일' (bad things).
theological_decisions:
- decision: Register shift to 합쇼체 (-느냐)
  rationale: The source text is a rhetorical question/accusation. Using '-느냐' (formal-polite interrogative) maintains the direct address and the intensity of the rebuke while adhering to the modern formal-polite style requirement, avoiding archaic '-시더냐'.
