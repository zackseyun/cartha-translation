  naturalness: 현대 표준 한국어 합쇼체로 문장을 정리하고, 직접 권면은 ‘기도하십시오’로 자연스럽게 옮겼습니다.
  terminology: θεός는 ‘하나님’, ἅγιοι는 문맥상 ‘성도들’로 옮겼습니다. 죄를 ‘치유하다’는 다소 이례적 결합이지만, 원문의 치유 은유를 보존합니다.
  issues:
