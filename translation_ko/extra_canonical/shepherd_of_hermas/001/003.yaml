revisions:
- from: “희망이 없고 자기 자신과 생명에 대하여 절망한 자들의 영혼이 회개하리로다. 그러나 너는 하나님께 기도하라 그리하면 너희와 네 온 가족과 모든 거룩한 자의 죄를 사하시리라.”
  to: “희망이 없고 자신과 자기들의 삶에 대하여 절망한 이들의 영혼은 회개할 것입니다. 그러나 당신은 하나님께 기도하십시오. 그러면 하나님께서 당신과 당신의 온 집안과 모든 성도들의 죄를 치유하실 것입니다.”
  rationale: 원문의 미래 시제와 권면의 대조를 유지했습니다. 특히 ‘치유하다’라는 표현을 보존하여 죄에 관한 용서와 치유의 개념을 원문보다 좁히거나 바꾸지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:52Z'
