  text: “희망이 없고 자기 자신과 생명에 대하여 절망한 자들의 영혼이 회개하리로다. 그러나 너는 하나님께 기도하라 그리하면 너희와 네 온 가족과 모든 거룩한 자의 죄를 사하시리라.”
