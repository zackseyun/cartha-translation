revisions:
- from: 그가 웃으며 나에게 이르되 악한 욕심이 네 마음에 찼도다 의인이 그 마음에 들어가면 악한 줄로 여기지 아니하느냐 이는 죄요 큰 일이라 이르시되 의인은 공의를 계획하나니 그러므로 그의 영광이 하늘에 굳게 서리라 그의 영광이 하늘에 굳게 서리라 그의 범사에 주님께서 즐거이 화목하게 하시느니라 죽음과 포로의 길을 스스로 가져가라. 특히 이 세대를 자기를 위하여 보장하고 자기의 부를 자랑하며 장차 오는 좋은 일을 굳게 잡지 아니하는 자들에게라.
