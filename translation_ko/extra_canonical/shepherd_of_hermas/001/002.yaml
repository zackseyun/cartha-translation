  rationale: 영어 POB가 제시한 8절 범위에 맞추어 전체를 다시 번역했습니다. 원문의 화자 성별, 수사 의문문, ‘의로운 일을 계획함’의 인과관계, 그리고 악을 꾀하는 자들이 자신에게 초래하는 결과를 보존했습니다. 원문상 다소 압축적인 ‘주님을 쉽게 화해하게 지닌다’는 표현은 한국어에서 관계를 명료하게 하되 특정 교리 해석을 강요하지 않도록 옮겼습니다.
