base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007.yaml
  text: 'But you[a], Hermas, no longer bear a grudge against your children, nor give up on your sister, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Resentment produces death. But you[b], Hermas, have had great private tribulations because of the transgressions of your household, because you did not take concern for them, but became preoccupied and were entangled with your business dealings—the wicked ones.


    But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in guilelessness and simplicity. These prevail over all wickedness and remain for eternal life.


    Blessed are all who practice righteousness; they will never be destroyed.


    And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who return, as it is written in Eldad and Modat[e][d][c], who prophesied to the people in the wilderness.'
  footnotes:
  - marker: a
    text: '“Nor give up on your sister”: ἐάω can mean leave/let go/allow. Here the sense is not permitting or abandoning her, but not forsaking her so that they may be cleansed.'
    reason: lexical_alternative
  - marker: b
    text: '“Disciplined with righteous discipline”: παιδεία includes both instruction and corrective training; hence ‘discipline.’'
    reason: lexical_alternative
  - marker: c
    text: '“The Lord is near to those who return, as it is written in Eldad and Modat”: Hermas appears to cite a writing known as Eldad and Modat. Eldad and Medad are named in Numbers 11:26–29 as prophesying among the people; some early Christians knew a (now lost) work under this title.'
    reason: cross_reference
  - marker: d
    text: '“If it seems good to you to deny again”: likely an admonition about denial of the faith under pressure; the object is implied in the Greek and left unstated.'
    reason: cultural_note
  - marker: e
    text: '“Those who return”: ἐπιστρέφω can also be rendered ‘turn back’ or, contextually, ‘repent’; we keep ‘return’ to preserve the distinct lexical choice.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그러나 너, 헤르마스야, 이제 더 이상 네 자녀들에게 원한을 품지 말고, 네 자매를 버려 두지도 마십시오. 그러면 그들이 이전의 죄들에서 깨끗하게 될 것입니다. 그들은 네가 그들에게 원한을 품지 않으면 의로운 훈련으로 훈련을 받을 것이기 때문입니다. 원한은 죽음을 만들어 냅니다. 그런데 너, 헤르마스야, 네 집안의 범법들 때문에 개인적인 큰 환난을 겪었습니다. 그것은 네가 그들에 대해 관심을 두지 않았고, 오히려 네 생각이 다른 데로 쏠려 네 악한 사업 일들에 얽매였기 때문입니다.


    그러나 너를 구하는 것은 네가 살아 계신 하나님에게서 떠나지 않았다는 것과, 네 단순함과 큰 절제입니다. 이것들이 네가 그것들 안에 계속 머물면 너를 구하였고, 또한 그런 것들을 행하며 순전함과 단순함 가운데 걷는 모든 사람도 구합니다. 이런 사람들은 모든 악함을 이기고 영원한 생명으로 남습니다.


    의를 행하는 모든 사람은 복이 있습니다. 그들은 결코 멸망하지 않을 것입니다.


    그리고 너는 마시무스에게 이렇게 말해야 합니다. 「보십시오, 다시 부인하려고 한다면 환난이 올 것입니다. 돌아오는 자들에게는 주께서 가까이 계십니다. 이는 광야에서 그 백성에게 예언한 엘닷과 모닷에 기록된 바와 같습니다.」[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακήσῃς / μνησικακία
  english_pob_choice: bear a grudge / resentment
  chosen_korean: 원한을 품다
  alternatives_korean:
  - 앙심을 품다
  - 원망하다
  - 속에 담아 두다
  lexicon: LSJ; Lampe
  rationale: μνησικακέω/μνησικακία는 상처를 기억하며 앙심을 품는 뜻이므로, 관계적 적대감을 드러내는 ‘원한을 품다’가 가장 가깝습니다.
- source_word: ἐάσῃς (τὴν ἀδελφήν σου)
  english_pob_choice: give up on
  chosen_korean: 버려 두다
  alternatives_korean:
  - 내버려 두다
  - 포기하다
  - 떠나게 하다
  lexicon: LSJ
  rationale: 여기서는 단순 허용이 아니라 돌봄을 포기하는 뉘앙스이므로, ‘버려 두다’가 source-direct합니다.
- source_word: θλίψεις (ἰδιωτικὰς)
  english_pob_choice: tribulations (private)
  chosen_korean: 개인적인 큰 환난
  alternatives_korean:
  - 사적인 큰 고난
  - 개인적 고통
  - 사사로운 환난
  lexicon: BDAG; LSJ
  rationale: θλίψις의 종교적·고난적 어감을 살리면서 ἰδιωτικός의 ‘개인적/사적인’ 대비를 드러내기 위해 이렇게 옮겼습니다.
- source_word: παρενεθυμήθης / ταῖς πραγματείαις σου… ταῖς πονηραῖς
  english_pob_choice: became preoccupied and were entangled with your business dealings—the wicked ones
  chosen_korean: 네 생각이 다른 데로 쏠려 네 악한 사업 일들에 얽매였다
  alternatives_korean:
  - 사악한 사업에 몰두했다
  - 악한 거래에 얽혀 있었다
  - 장사 일에 마음을 빼앗겼다
  lexicon: LSJ; Lampe
  rationale: 희귀 동사의 의미를 직역하기보다 ‘생각이 다른 데로 쏠리다’로 풀어 주어, 관심 이탈과 얽힘이라는 이중 의미를 함께 살렸습니다.
- source_word: ἁπλότης
  english_pob_choice: simplicity
  chosen_korean: 단순함
  alternatives_korean:
  - 순박함
  - 순전함
  - 소박함
  lexicon: BDAG; LSJ
  rationale: Hermas에서의 ἁπλότης는 꾸밈없고 분열되지 않은 성품이므로, 문맥상 ‘단순함’을 기본으로 하되 뒤에서 ‘순전함’으로 한 번 더 풀어 보완했습니다.
- source_word: ἐγκράτεια
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 자기 절제
  - 금욕
  lexicon: BDAG
  rationale: 도덕적·수행적 덕목을 한국어로 가장 자연스럽게 나타내는 표준어로 ‘절제’를 선택했습니다.
- source_word: ἐπιστρεφομένοις
  english_pob_choice: to those who return
  chosen_korean: 돌아오는 자들
  alternatives_korean:
  - 돌아서는 자들
  - 회개하는 자들
  - 돌아가는 자들
  lexicon: BDAG
  rationale: ἐπιστρέφω의 distinct한 ‘돌아감’ 이미지를 살리기 위해 ‘회개하다’로 흡수하지 않고 ‘돌아오는 자들’로 옮겼습니다.
theological_decisions:
- issue: '보존해야 할 긴장: 현재적 구원과 계속성'
  chosen_reading: ‘이것들이 네가 그것들 안에 계속 머물면 너를 구하였다’로 옮겨, 현재 완료적 구원과 지속의 조건을 함께 드러냈습니다.
  alternative_readings:
  - ‘이것들이 너를 구할 것이다’
  - ‘이것들이 너를 구했다’
  rationale: Hermas의 훈계는 현재의 구원 경험과 지속적 인내를 함께 묶으므로, 한쪽으로 평탄화하지 않았습니다.
  doctrine_reference: Shepherd of Hermas paraenesis; perseverance-oriented moral soteriology
- issue: 엑스트라-성경 문헌 인용 보존
  chosen_reading: ‘엘닷과 모닷에 기록된 바와 같습니다’라고 직역해, 잃어버린 문헌 제목을 본문 수준에서 보존했습니다.
  alternative_readings:
  - 민수기 11장의 엘닷과 메닷으로 조정
  - 문헌명을 풀어 쓰지 않음
  rationale: 저자가 실제로 인용하는 것은 현존하지 않는 문헌 제목이므로, 본문의 고유한 인용 관행을 유지하는 편이 source-faithful합니다.
  doctrine_reference: Early Christian citation practice; preserve authorial horizon
