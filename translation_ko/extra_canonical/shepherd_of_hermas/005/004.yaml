revisions:
- from: 그래서 그것을 가져다가 들판의 한 곳으로 물러나서 음절을 알아듣지 못해서 한 글자 한 글자 베껴썼습니다. 그리고 내가 그 책의 글자들을 다 읽었을 때, 갑자기 그 작은 책이 내 손에서 빼앗겨졌습니다. 그러나 나는 누구를 보지 못했습니다.
  to: 그래서 나는 그것을 받아 들판의 한 곳으로 물러가, 음절들을 알아낼 수 없었기 때문에 모든 것을 한 글자씩 베껴 썼습니다. 내가 그 책의 글자들을 다 마쳤을 때, 갑자기 그 작은 책이 내 손에서 낚아채어졌습니다. 그러나 누가 그것을 낚아챘는지는 보지 못했습니다.
  rationale: 필사의 완료를 읽기의 완료로 바꾼 오류를 바로잡고, 음절을 판별하지 못했다는 이유와 글자 단위의 필사를 보존했습니다. 마지막 문장도 행위자의 미확인을 명시하여 원문의 의미를 충실히 옮겼습니다.
