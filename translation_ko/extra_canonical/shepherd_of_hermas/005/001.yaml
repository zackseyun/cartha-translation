revisions:
- from: 작년과 같은 계절에 쿠마에로 가다가 지난해의 환상이 생각나고 다시 성령께서 나를 들어올려 전년과 같은 곳으로 데려가십니다.
  to: 작년에도 그랬던 때에 쿠마에로 가다가, 걸어가면서 작년의 환상을 떠올렸습니다. 그러자 다시 영이 나를 들어 올려 작년에도 갔던 바로 그곳으로 데려갑니다.
  rationale: The revision preserves the travel setting, the recollection while walking, and the Greek historical present for the spirit's action. It also avoids doctrinally specifying the unqualified πνεῦμα as the Holy Spirit.
