revisions:
- from: 내가 다시 청하여 이르되 주님께서 나를 합당하다고 여기사 항상 나와 함께 거하시기를 원하노니 몇 마디만 더 참아 주십시오. 나는 아무것도 깨닫지 못하고 이전 행위로 내 마음이 완악해졌나이다. 나는 심히 미련하여 아무것도 깨닫지 못하노라.
  to: 내가 다시 그에게 여쭈었습니다. “주님께서 당신이 항상 저와 함께 거하도록 저를 합당하게 여기셨으니, 제 말을 조금만 더 참아 주십시오. 저는 아무것도 깨닫지 못하며, 지난 행위들 때문에 제 마음이 완악해졌습니다. 저를 깨우쳐 주십시오. 저는 매우 어리석어서 도무지 아무것도 깨닫지 못합니다.”
  rationale: 누락된 ‘저를 깨우쳐 주십시오’를 보완하고, 주님·상대방·화자 사이의 관계를 원문에 따라 명료하게 했습니다. 전체를 현대 표준 한국어의 정중한 합쇼체로 통일했으며, ‘지난 행위들 때문에’로 ἀπὸ τῶν προτέρων μου πράξεων의 원인과 복수성을 반영했습니다.
