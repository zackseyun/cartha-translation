review_pass:
  verdict: revise
  source_fidelity: 초안은 화자가 자신이 죄인임과 무엇을 행해야 살 수 있는지 알지 못함을 이유로 묻는다는 기본 뜻을 반영합니다. 그러나 ‘내 죄가 많고 많기’는 원문의 πολλαί ... καὶ ποικίλαι(많고 여러 가지인)를 정확히 옮기지 못합니다. 또한 ‘모든 일’은 여기서 ‘모든 것’을 뜻하는 원문보다 다소 좁게 들릴 수 있습니다.
  naturalness: 초안의 ‘여쭈노니’, ‘때문이요’, ‘살는지’, ‘니이다’는 요청된 현대 표준어 합쇼체에 맞지 않고 고어적·문어적인 혼합 문체입니다. 문장을 현대 합쇼체로 정리하는 것이 필요합니다.
  terminology: κύριε는 이 대화의 호칭으로 ‘주님’이 자연스럽습니다. ἔργα는 ‘일들/행위들’이라는 윤리적 행위의 뜻을 보존하도록 ‘어떤 일을 행해야’로 옮겼습니다. ‘죄인’과 ‘죄’는 적절합니다.
  issues:
  - severity: medium
    issue: ‘많고 많기’가 ‘많고 여러 가지이기’를 대체함
    rationale: πολλαί(많은)와 ποικίλαι(다양한, 여러 가지인)의 병렬을 반복 표현으로 바꾸어 의미 하나가 탈락했습니다.
  - severity: medium
    issue: 현대 합쇼체 대신 고어적 종결과 연결 표현 사용
    rationale: ‘여쭈노니’, ‘살는지’, ‘니이다’는 현대 표준어의 공식적인 합쇼체와 거리가 있습니다.
  - severity: low
    issue: ‘모든 일’
    rationale: πάντα는 문맥상 ‘모든 것’을 가리키므로, ‘모든 일’보다 포괄적인 표현이 원문에 가깝습니다.
