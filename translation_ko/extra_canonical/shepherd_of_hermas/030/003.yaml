revisions:
- from: “그러므로 주여 내가 모든 일을 주의하여 여쭈노니 첫째는 내가 죄인이기 때문이요 또 무엇을 하여야 살는지 알지 못하오니 내 죄가 많고 많기 때문이니이다.”
  to: “그러므로, 주님, 제가 모든 것을 주님께 자세히 여쭙습니다. 첫째, 제가 죄인이기 때문입니다. 둘째, 어떤 일을 행해야 제가 살 수 있는지 알지 못하기 때문입니다. 제 죄가 많고 여러 가지이기 때문입니다.”
  rationale: 원문의 이유 제시 구조와 ‘무슨 일을 행하여 살 것인가’라는 물음을 보존하면서, 누락된 ‘여러 가지’의 의미를 회복했습니다. 고어적 문체를 현대 표준어 합쇼체로 고쳤으며, 별도의 본문 비평상 쟁점이나 주석 표지는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
