  - severity: high
    issue: ‘선을 풍성히 행한다’의 의미와 문법 관계가 바뀜
    rationale: ἀλλὰ τὸ ἀγαθὸν πολυτελῶς ἐργάζεται는 회개한 사람이 더는 악을 행하지 않고 선을 풍성히 행한다는 현재의 대조입니다. 초안의 ‘행하였거늘’은 과거 완료·양보 관계를 도입합니다.
  - severity: medium
