revisions:
- from: 대답하여 이르시되 나는 회개하도록 정하였나니 회개하는 모든 자에게 깨달음을 주노라 너희가 보기에는 회개하는 이것이 명철인 줄로 생각지 아니하느냐 회개하는 것은 큰 총명이니라 범죄한 사람이 자기가 주 앞에서 악한 일을 행한 줄을 깨닫고 그 행한 일이 그 마음에 사무쳐 회개하여 다시는 악을 행치 아니하느니라 많은 선을 행하였거늘 그가 죄를 지었으므로 자기의 영혼을 낮추고 괴롭게 하느니라.
  to: 그가 내게 대답하여 말했습니다. “나는 회개를 맡고 있으며, 회개하는 모든 사람에게 깨달음을 줍니다. 회개하는 바로 이 일이 깨달음이라고 생각하지 않습니까? 회개하는 것은 큰 깨달음입니다. 죄를 지은 사람은 자기가 주 앞에서 악한 일을 했음을 깨닫고, 자기가 행한 일이 그의 마음에 떠오릅니다. 그래서 그는 회개하고 더 이상 악을 행하지 않으며, 오히려 선을 풍성히 행합니다. 또 자기가 죄를 지었기 때문에 자기 영혼을 낮추고 괴롭게 합니다. 그러므로 회개가 큰 깨달음임을 알겠습니까?”
  rationale: 원문의 화자 역할, 회개와 깨달음의 논증, 악을 그치고 선을 풍성히 행한다는 대조를 보존했습니다. 대괄호로 보충된 ὁ ἀνήρ은 번역에서 자연스럽게 ‘사람’으로 반영하되 별도 각주는 두지 않았습니다.
