  source_fidelity: 초안은 ἐπὶ τῆς μετανοίας εἰμὶ를 ‘회개하도록 정하였나니’로 옮겨 화자가 회개하도록 임명되었다는 뜻으로 바꾸었습니다. 이는 ‘나는 회개를 맡고 있다/회개에 관한 일을 맡고 있다’는 원문의 의미와 다릅니다. 또한 ‘선을 풍성히 행하고’(ἀλλὰ τὸ ἀγαθὸν πολυτελῶς ἐργάζεται)가 ‘많은 선을 행하였거늘’로 되어 시제와 접속 관계가 바뀌었습니다.
  naturalness: 초안은 ‘이르시되’, ‘주노라’, ‘행치 아니하느니라’ 등 현대 표준어 합쇼체가 아닌 고전 성경체를 사용하며, 문장 경계와 인용 구조도 불분명합니다. 수정문은 현대적인 합쇼체로 원문의 반복적 문답 형식을 유지했습니다.
  terminology: μετάνοια는 ‘회개’, σύνεσις는 문맥상 ‘깨달음’으로 일관되게 옮겼습니다. ‘주’는 원문의 κύριος를 반영합니다. ‘자기 영혼을 낮추고 괴롭게 한다’는 표현은 ψυχή와 βασανίζει의 자기 낮춤 및 고통의 의미를 보존합니다.
