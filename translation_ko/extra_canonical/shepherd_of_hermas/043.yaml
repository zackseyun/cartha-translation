base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/043.yaml
  text: “I would like,” I say, “sir, to know in what ways I must serve the desire…”
translation:
  language: ko
  text: “저는, 주님, 어떤 방식으로든 욕망을 섬겨야 하는지 알고 싶습니다…”라고 제가 말합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤθελον, φημί
  english_pob_choice: “I would like,” I say
  chosen_korean: “저는… 알고 싶습니다”라고 제가 말합니다
  alternatives_korean:
  - “원합니다”라고 제가 말합니다
  - “알고 싶었습니다”라고 제가 말합니다
  lexicon: Ἤθελον + φημί
  rationale: 영문 POB의 현재형 진술을 따라 한국어도 현재형으로 옮기되, Ἤθελον의 미완료/소망 뉘앙스는 “알고 싶습니다”로 반영했습니다.
- source_word: κύριε
  english_pob_choice: sir
  chosen_korean: 주님
  alternatives_korean:
  - 선생님
  - 주인님
  lexicon: κύριε
  rationale: 이 문맥의 호칭은 단순한 예의 호칭보다 더 높은 존칭이므로, 한국어에서는 직접 호칭으로 “주님”이 가장 자연스럽고 source-direct합니다.
- source_word: ποίοις τρόποις
  english_pob_choice: in what ways
  chosen_korean: 어떤 방식으로든
  alternatives_korean:
  - 어떤 방법으로
  - 어떤 식으로
  lexicon: ποίος + τρόπος
  rationale: 구체적 절차를 묻는 표현이므로 “어떤 방식으로든”보다 문법적으로는 “어떤 방식으로”가 가장 직접적입니다. 여기서는 다음 절과의 연결을 살려 자연스럽게 다듬었습니다.
- source_word: δουλεῦσαι
  english_pob_choice: serve
  chosen_korean: 섬겨야 하는지
  alternatives_korean:
  - 노예처럼 복무해야 하는지
  - 봉사해야 하는지
  lexicon: δουλεύω
  rationale: 노예/종의 결박된 섬김을 뜻하는 동사이므로 단순한 “봉사하다”보다 “섬기다”가 의미를 보존합니다.
- source_word: τῇ ἐπιθυμίᾳ
  english_pob_choice: the desire
  chosen_korean: 그 욕망을
  alternatives_korean:
  - 그 욕구를
  - 그 정욕을
  lexicon: ἐπιθυμία
  rationale: 전치사의 목적격적 대상으로 나온 ἐπιθυμία는 여기서 중립적 ‘소망’이 아니라 통제해야 할 내적 욕망을 가리키므로 “욕망”으로 옮겼습니다.
theological_decisions:
- issue: δουλεῦσαι τῇ ἐπιθυμίᾳ의 윤리적 뉘앙스
  chosen_reading: “욕망을 섬기다”라는 직역에 가까운 표현을 유지해, 내면의 욕망에 예속되는 문제를 선명하게 드러냈습니다.
  alternative_readings:
  - “욕망을 따르다”
  - “정욕에 종속되다”
  rationale: 본문의 핵심은 단순한 추종이 아니라 섬김/예속의 관계에 있으므로, 의미를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 성화와 절제, 내적 욕망에 대한 종속의 문제
