base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052.yaml
  text: 'He says[1], “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.


    Therefore[2], having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the slave—listen.


    The Holy Spirit, which preexisted, which created all creation, God caused to dwell in flesh that he willed. This flesh, then, in which the Holy Spirit dwelt, served the Spirit well, walking in modesty and purity, in no way at all defiling the Spirit. Therefore, since it had conducted itself well and purely, and had toiled together with the Spirit and cooperated in every matter, conducting itself strongly and courageously, he chose it as a partner with the Holy Spirit; for the conduct of this flesh pleased [the Lord], because it was not defiled upon the earth while having the Holy Spirit.


    Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward[b][a][4][3]. You have the interpretation of this parable also.”'
  footnotes:
  - marker: '1'
    text: The Greek at this point in our OCR is damaged. Many editions read that the Lord ‘entrusted them to the angels to keep them.’ We translate accordingly.
    reason: textual_variant
  - marker: '2'
    text: ‘Dig’ renders σκάφεῦσαι, keeping the field/labor metaphor active in the parable.
    reason: cultural_note
  - marker: '3'
    text: ‘The Holy Spirit, which pre‑existed’ translates τὸ πνεῦμα τὸ ἅγιον τὸ προόν. Alternatives include ‘the pre‑existent Holy Spirit’ or ‘the holy pre‑existent Spirit.’
    reason: lexical_alternative
  - marker: '4'
    text: ‘Place of dwelling’ renders τόπον τινὰ κατασκηνώσεως, an image of a settled abode; it anticipates reward imagery (‘wage’) in what follows.
    reason: cultural_note
  - marker: a
    text: Or '‘You see,’ he says, ‘that he himself is Lord of the people, having received all authority from his Father. And that the Lord took his Son and the glorious angels as counselor concerning the inheritance of the slave—listen.'.
    reason: previous_rendering
  - marker: b
    text: Or 'Therefore he took the Son and the glorious angels as counselor,'.
    reason: previous_rendering
translation:
  language: ko
  text: '그가 말합니다. 「나는 방금도 너에게 네가 교활하고 고집 세며, 비유의 해석을 묻고 다닌다고 말했다. 그러나 네가 이처럼 끈질기므로, 내가 너를 위해 밭의 비유와 나머지를 풀이하겠다. 그는 그들을 지키도록 천사들에게 맡겼으며, 그 자신도 그들의 죄를 깨끗하게 하되, 많은 수고를 하고 많은 고역을 감당하였습니다. 아무도 수고나 노동 없이 땅을 팔 수는 없기 때문입니다.


    그러므로 그는 백성의 죄를 깨끗하게 한 뒤 그들에게 생명의 길들을 보이시고, 아버지에게서 받은 율법을 그들에게 주셨습니다. 「보아라」, 그가 말합니다. 「그가 친히 백성의 주이심을, 아버지에게서 모든 권위를 받으셨음을. 그리고 주께서 그의 아들과 영광스러운 천사들을 그 종의 상속 문제에 관해 참모로 삼으신 일을 들어라.


    영원부터 계신 거룩한 영, 곧 모든 창조를 지으신 분을 하나님께서 그분이 원하신 육체 안에 거하게 하셨습니다. 그러므로 그 육체는, 그 안에 거룩한 영이 거하였던 그 육체는, 단정함과 순결함 가운데 걸으며 영을 조금도 더럽히지 않고, 영을 잘 섬겼습니다. 그러므로 그 육체는 선하고 순결하게 처신하였고, 영과 함께 수고하며 모든 일에 협력하고, 힘 있고 용감하게 행하였으므로, 그가 그것을 거룩한 영과 함께하는 동반자로 택하셨습니다. 그 육체의 행실이 [주님께] 기쁨이 되었기 때문입니다. 그것이 거룩한 영을 지닌 채 땅 위에서 더럽혀지지 않았기 때문입니다.


    그러므로 그분은 아들과 영광스러운 천사들을 참모로 삼으셨는데, 이는 이 육체도 영을 흠 없이 섬겼으므로, 어떤 거처를 얻고, 자기 섬김의 보상을 잃어버린 것처럼 보이지 않게 하려는 것이었습니다. 거룩한 영이 거하였던, 더럽혀지지 않고 흠 없는 모든 육체는 보상을 받게 될 것입니다. 당신은 이 비유의 해석도 받았습니다。」[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανοῦργος
  english_pob_choice: crafty
  chosen_korean: 교활하고
  alternatives_korean:
  - 간교하고
  - 약삭빠르고
  lexicon: LSJ; BDAG
  rationale: 비난조의 도덕적 뉘앙스를 살리면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다.
- source_word: αὐθάδης
  english_pob_choice: headstrong
  chosen_korean: 고집 세며
  alternatives_korean:
  - 제멋대로이며
  - 독선적이며
  lexicon: LSJ; BDAG
  rationale: 완고하고 자기 뜻을 밀어붙이는 성격을 보여 주되, 지나치게 철학적이거나 추상적인 표현은 피했습니다.
- source_word: ἐπίλυσις
  english_pob_choice: interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 풀이
  - 설명
  lexicon: BDAG
  rationale: 비유를 푸는 전문적 의미를 살려, 본문 전체의 ‘비유 해석’ 어조와 맞췄습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 이 단락에서는 상속 관계와 소유 관계를 드러내지만, 한국어 본문 흐름에서는 ‘종’이 가장 직접적이고 과도한 현대적 사회제도 연상을 덜 불러옵니다.
- source_word: τὸ πνεῦμα τὸ ἅγιον τὸ προόν
  english_pob_choice: The Holy Spirit, which preexisted
  chosen_korean: 영원부터 계신 거룩한 영
  alternatives_korean:
  - 먼저 계셨던 거룩한 영
  - 선재하신 거룩한 영
  lexicon: BDAG; LSJ
  rationale: 선재성을 분명히 하면서도, ‘거룩한 영’이라는 원문의 명칭을 보존해 후속 문맥의 긴장을 그대로 드러냈습니다.
- source_word: κατῴκισεν ... εἰς σάρκα
  english_pob_choice: caused to dwell in flesh
  chosen_korean: 육체 안에 거하게 하셨습니다
  alternatives_korean:
  - 육체 안에 거처하게 하셨습니다
  - 육체 안에 머물게 하셨습니다
  lexicon: BDAG
  rationale: 하나님의 주도성을 살리면서, 영의 내주를 ‘거하다’라는 성경적 표현으로 전달했습니다.
- source_word: μισθός
  english_pob_choice: reward
  chosen_korean: 보상
  alternatives_korean:
  - 삯
  - 상급
  lexicon: BDAG
  rationale: 수고·노동·섬김의 이미지가 이어지므로, 노동의 대가라는 뉘앙스를 가진 ‘보상’이 가장 자연스럽습니다.
theological_decisions:
- issue: ‘거룩한 영’과 ‘육체’의 관계를 어떻게 드러낼 것인가
  chosen_reading: 원문이 말하는 내주와 협력의 구조를 그대로 살려, 영과 육체를 구분한 채 번역했습니다.
  alternative_readings:
  - 영과 육체를 하나의 인격적 주체로 통합하여 완화하기
  - 후대 삼위일체 용어로 정리하기
  rationale: 헤르마스의 표현은 신학적 긴장을 품고 있으므로, 이를 조화시키거나 설명적으로 정리하지 않고 원문 구조를 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
- issue: v.4의 ‘주’와 ‘그의 아들’의 관계
  chosen_reading: ‘주께서 그의 아들과 …’로 옮겨, 주체가 아들을 참모로 삼는 장면을 보존했습니다.
  alternative_readings:
  - ‘주’가 곧 하나님 아버지라고 명시하기
  - 관계를 단순화하여 요약하기
  rationale: 앞절의 ‘아버지에게서 모든 권위를 받으셨음’과 이어져, 아들이 주권 아래 참모를 두는 흐름이 가장 자연스럽습니다.
  doctrine_reference: Contextual referent of κύριος in the passage.
