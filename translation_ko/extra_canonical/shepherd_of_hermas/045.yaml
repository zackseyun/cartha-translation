base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045.yaml
  text: 'I say to him[a], "Lord, listen to a few words from me." He says, "Speak what you wish."


    "A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be made subject to them; but the devil is harsh and tyrannizes them."


    "He is not able," he says, "to tyrannize the slaves of God—those who put their hope in him with their whole heart. The devil can grapple, but he cannot overthrow. If, therefore, you resist him[b], defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.


    "When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not examine the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the enjoyment of the wine is lost.


    "So also the devil comes upon all the slaves of God, putting them to the test. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes[h][g][f][e][d][c], and they become enslaved to him."'
  footnotes:
  - marker: a
    text: Empty translates Greek apokenos, "empty, drained, hollow"; here it figuratively contrasts with being "full in faith."
    reason: lexical_alternative
  - marker: b
    text: Clay jars renders keramia, common earthenware vessels for wine in antiquity. The note about empty jars souring reflects ancient experience with residues tainting wine.
    reason: cultural_note
  - marker: c
    text: Putting them to the test translates ekpeirazō; with the devil as subject, "tempting them" is also possible.
    reason: lexical_alternative
  - marker: d
    text: Literally, "having no place to enter"; idiomatically, no opening or opportunity.
    reason: lexical_alternative
  - marker: e
    text: 'Grapple/overthrow renders antipalaio/katapalaio, evoking wrestling: he can wrestle but cannot throw down or pin.'
    reason: lexical_alternative
  - marker: f
    text: Enjoyment renders hēdonē; "pleasure" is a possible alternative.
    reason: lexical_alternative
  - marker: g
    text: Or 'I said to him'.
    reason: previous_rendering
  - marker: h
    text: Or '"A person, Lord, is eager'.
    reason: previous_rendering
translation:
  language: ko
  text: '그에게 말했습니다. 「주님, 제가 몇 마디만 말씀드리겠습니다.」 그가 말합니다. 「네가 원하는 것을 말하라.」


    「사람은, 주님, 하나님의 명령들을 지키고자 열망합니다. 또 주께서 그의 명령들 안에서 강하게 하시고 그것들에 순종하게 해 달라고 구하지 않는 이는 아무도 없습니다. 그러나 악마는 포악하여 그것들을 억압합니다.」


    「그는 하나님께 속한 종들 — 곧 온 마음으로 그를 바라는 이들 — 을 억압할 수는 없습니다. 악마는 맞붙어 씨름할 수는 있지만, 넘어뜨릴 수는 없습니다. 그러므로 너희가 그에게 맞서면, 그는 패배한 채 너희에게서 부끄러움을 당하고 달아날 것입니다. 그러나 비어 있는 이들은,」 그가 말합니다, 「악마가 능력이 있는 것처럼 그를 두려워합니다.


    사람이 좋은 포도주로 진흙 항아리들을 가득 채우고 그 항아리들 가운데 몇 개가 비어 있으면, 그는 항아리들 쪽으로 와서 가득 찬 것들은 살펴보지 않습니다. 그것들이 가득 찬 줄 알기 때문입니다. 그러나 그는 비어 있는 것들은 살펴보는데, 혹시 시었을까 두려워하기 때문입니다. 비어 있는 항아리들은 곧장 시어 버리고, 포도주의 기쁨은 사라집니다.


    이와 같이 악마도 하나님의 모든 종들에게 와서 그들을 시험합니다. 그러므로 믿음으로 가득 찬 이들은 그에게 강하게 맞섰고, 그는 들어갈 곳이 없으므로 그들에게서 물러납니다. 그러면 그는 비어 있는 이들에게 와서, 들어갈 자리를 얻고 그들 안으로 들어가며, 자기 뜻대로 그들 안에서 행하고, 그들은 그에게 종이 됩니다.」[a][b][c][d][e][f][g]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주인님
  - 선생님
  lexicon: BDAG
  rationale: 대화 상대에 대한 존칭을 살리되, 이 문맥의 경건한 직접호칭에 맞게 합쇼체의 주님을 택했습니다.
- source_word: ἐντολὰς τοῦ Θεοῦ
  english_pob_choice: commandments of God
  chosen_korean: 하나님의 명령들
  alternatives_korean:
  - 하나님의 계명들
  - 하나님의 규례들
  lexicon: BDAG
  rationale: ἐντολαί의 규범적·명령적 힘을 살리면서도, 본문이 ‘지키다’와 결합한 도덕적 권면이라는 점을 한국어로 자연스럽게 옮겼습니다.
- source_word: ὑποταγῇ αὐταῖς
  english_pob_choice: be made subject to them
  chosen_korean: 그것들에 순종하게 해 달라
  alternatives_korean:
  - 그것들에 복종하게 해 달라
  - 그것들에 굴복하게 해 달라
  lexicon: BDAG
  rationale: 수동형의 ‘~되다’보다 기도적·간청적 문맥에 맞는 ‘순종하게 해 달라’가 자연스럽고, 명령들 아래에 자신을 두는 의미를 살립니다.
- source_word: καταδυναστεύει
  english_pob_choice: tyrannizes
  chosen_korean: 억압합니다
  alternatives_korean:
  - 폭압합니다
  - 군림합니다
  lexicon: LSJ
  rationale: 반복적·강압적 지배를 드러내되, 한국어에서 지나치게 고어적이지 않은 표현으로 악마의 압제성을 전달합니다.
- source_word: δούλους τοῦ Θεοῦ
  english_pob_choice: slaves of God
  chosen_korean: 하나님께 속한 종들
  alternatives_korean:
  - 하나님의 노예들
  - 하나님의 종들
  lexicon: BDAG
  rationale: 본 문맥의 소유·충성 관계는 살리되, 한국어 수용성을 위해 본문에서는 ‘종들’로 두고, ‘하나님께 속한’으로 소속성과 예속성을 드러냈습니다.
- source_word: ἀντιπαλαῖσαι / καταπαλαῖσαι
  english_pob_choice: grapple / overthrow
  chosen_korean: 맞붙어 씨름할 수는 있지만, 넘어뜨릴 수는 없습니다
  alternatives_korean:
  - 맞붙어 씨름할 수는 있지만, 꺾을 수는 없습니다
  - 씨름은 할 수 있지만, 제압할 수는 없습니다
  lexicon: LSJ
  rationale: 레슬링 이미지를 그대로 살려 ‘씨름’으로 옮기고, 결정적 패배 동작인 ‘넘어뜨리다’로 대응시켰습니다.
- source_word: ἐκπειράζων
  english_pob_choice: putting them to the test
  chosen_korean: 그들을 시험합니다
  alternatives_korean:
  - 그들을 시험해 봅니다
  - 그들을 유혹합니다
  lexicon: BDAG
  rationale: 악마가 주어일 때는 시험과 유혹이 모두 가능하지만, 본문은 일반적 시련·검증의 뜻을 유지하는 것이 더 직접적입니다.
- source_word: ἡδονή
  english_pob_choice: enjoyment
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 쾌락
  lexicon: BDAG
  rationale: 포도주의 맛과 만족을 가리키는 문맥이므로, 도덕적으로 과도한 뉘앙스가 있는 ‘쾌락’ 대신 ‘기쁨’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: δοῦλοι τοῦ Θεοῦ의 한국어 표현
  chosen_reading: 하나님께 속한 종들
  alternative_readings:
  - 하나님의 노예들
  - 하나님의 종들
  rationale: 본 단락의 강조점은 하나님께 대한 절대적 소속과 악마에 대한 대비이므로, ‘속한’을 덧붙여 관계성을 분명히 하면서도 한국어에서의 과도한 충격을 줄였습니다.
  doctrine_reference: 'DOCTRINE.md §Contested terms: doulos'
- issue: 악마의 작용을 나타내는 ἐκπειράζων의 의미
  chosen_reading: 그들을 시험합니다
  alternative_readings:
  - 그들을 유혹합니다
  rationale: 문맥상 악마의 공격은 시험과 유혹을 모두 포함할 수 있으나, 여기서는 믿음의 충만함과 비어 있음의 대비를 드러내는 일반적 ‘시험’이 본문의 구조를 가장 잘 보존합니다.
  doctrine_reference: 'Project style guidance: Preserve lexical tension where the source permits multiple senses'
