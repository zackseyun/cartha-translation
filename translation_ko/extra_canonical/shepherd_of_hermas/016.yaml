base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016.yaml
  text: 'When[1], then, I had stopped questioning her about all these things, she says to me, “Do you want to see something else?” And because I was eager to behold it, I became very glad to see.


    Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do, lady,” I said. “This tower is supported by these women at the Lord’s command.


    Now hear their functions.[1] The first of them, the one clasping her hands,[2] is called Faith; through her the chosen of God are saved. And the second[2], the one girded about and acting bravely,[3] is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”


    “But the others, lady, who are they?” “They are daughters of one another. And they are called Simplicity, Knowledge, Innocence, Dignity, and Love. Whenever, then, you do all the works of their mother, you are able to live.”


    “I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”


    And I kept asking her about the times—whether it is already the end. But she cried out with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever, then, the tower is completed in its building, it comes to an end. But it will be built up quickly. Do not question me any further; this reminder and the renewal of your spirits are enough for you and for the holy ones.


    But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils[b][a][3], and you also with them.”'
  footnotes:
  - marker: '1'
    text: Greek energeiai can mean 'activities,' 'operations,' or 'functions.'
    reason: lexical_alternative
  - marker: '2'
    text: Greek literally 'holding the hands'.
    reason: lexical_alternative
  - marker: '3'
    text: Greek andrizomenē means 'acting bravely' or 'showing courage'; literally it carries a 'be manly/courageous' nuance.
    reason: lexical_alternative
  - marker: a
    text: Or 'master their works'.
    reason: previous_rendering
  - marker: b
    text: Or 'this reminder is enough for you and for the holy ones, and for the renewal of your spirits.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러자 내가 그녀에게 이 모든 것에 대해 묻기를 멈추었을 때, 그녀가 내게 말했습니다. 「또 다른 것을 보고 싶으냐?」 내가 그것을 보기를 몹시 바라며, 기뻐서 매우 즐거워졌습니다.


    그녀가 나를 바라보고 미소 지으며 내게 말했습니다. 「네가 탑 둘레에 있는 일곱 여인을 보느냐?」 「봅니다, 부인」 하고 내가 말했습니다. 「이 탑은 주님의 명령에 따라 이 여자들이 떠받치고 있습니다.


    이제 그들의 기능을 들으십시오. 그들 가운데 첫째, 두 손을 맞잡고 있는 여인은 믿음이라 불립니다. 그를 통해 하나님께서 택하신 이들이 구원을 받습니다. 둘째, 띠를 두르고 용감하게 행동하는 여인은 절제라 불립니다. 그녀는 믿음의 딸입니다. 그러므로 누구든지 그녀를 따르는 사람은 자기 삶에서 복을 받게 되는데, 그것은 모든 악한 행위를 삼가게 되고, 또 모든 악한 욕망을 삼간다면 영원한 생명을 상속받으리라고 믿기 때문입니다.」


    「그런데 다른 여자들은 누구입니까, 부인?」 「그들은 서로의 딸들입니다. 그리고 이름은 하나같이 순서대로 단순함, 지식, 순결, 품위, 사랑입니다. 그러므로 자기 어머니의 일들을 모두 행할 때, 너는 살 수 있습니다.」


    내가 말했습니다. 「부인, 그들 각각이 어떤 힘을 가지고 있는지 알고 싶습니다.」 그녀가 말했습니다. 「들으십시오. 그들이 가진 힘이 무엇인지. 그들의 힘은 서로에게 붙들려 있으며, 그들이 태어난 것과 같이 서로를 따릅니다. 믿음에서 절제가 나고, 절제에서 단순함이, 단순함에서 순결이, 순결에서 품위가, 품위에서 지식이, 지식에서 사랑이 납니다. 그러므로 이들의 일은 모두 깨끗하고 품위 있고 신적입니다. 그러므로 누구든지 이것들을 섬기고 그 일들을 굳게 붙들 수 있다면, 하나님의 거처인 탑 안에서 성도들과 함께 살게 될 것입니다.


    그리고 나는 때가 이미 끝인지 그녀에게 계속 물었습니다. 그러자 그녀가 큰 소리로 외치며 말했습니다. 「어리석은 사람아, 네가 아직도 탑이 세워지는 것을 보지 못하느냐? 그러므로 탑이 건축을 마치면 끝이 옵니다. 그러나 그것은 곧 세워질 것입니다. 더 이상 내게 아무것도 묻지 마라. 이 상기와 너희 영의 새롭게 됨이 너와 성도들에게는 충분하다.


    그러나 그것이 너에게만 계시된 것이 아니라, 너는 그것을 모든 사람에게 알리라는 뜻이다. 사흘 뒤에—네가 먼저 이해해야 하므로, 그리고 내가 먼저 네게 명령하노니, 헤르마스야, 내가 이제 네게 말하려는 이 말들을—성도들의 귀에 모두 전하여라. 그들이 그것을 듣고 행함으로써 자기들의 악에서 깨끗하게 되도록 하려는 것이며, 너도 그들과 함께 그러하도록 하려는 것이다.」[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαυσάμην ἐρωτῶν
  english_pob_choice: had stopped questioning
  chosen_korean: 묻기를 멈추었을 때
  alternatives_korean:
  - 질문하기를 그쳤을 때
  - 묻는 것을 멈추었을 때
  lexicon: BDAG
  rationale: ἐπαύσαμην은 동작의 중지를, ἐρωτῶν은 계속된 질문 행위를 가리키므로 자연스러운 서술형으로 옮겼습니다.
- source_word: ἐνεργείας
  english_pob_choice: functions
  chosen_korean: 기능
  alternatives_korean:
  - 일들
  - 작용
  - 활동
  lexicon: LSJ
  rationale: 이 문맥에서는 의인화된 덕목들이 각자 하는 일을 가리키므로, ‘기능’이 가장 간결하게 구체성을 살립니다.
- source_word: βαστάζεται
  english_pob_choice: is supported
  chosen_korean: 떠받치고 있습니다
  alternatives_korean:
  - 지탱되고 있습니다
  - 받치고 있습니다
  lexicon: BDAG
  rationale: 탑의 이미지를 유지하면서 구조적 지탱의 뜻을 분명히 드러내기 위해 ‘떠받치다’로 옮겼습니다.
- source_word: Ἁπλότης
  english_pob_choice: Simplicity
  chosen_korean: 단순함
  alternatives_korean:
  - 성실함
  - 순전함
  - 단일함
  lexicon: BDAG
  rationale: 덕목 목록의 흐름과 현대 한국어의 명료성을 고려해, 윤리적·내면적 간명함을 드러내는 ‘단순함’을 택했습니다.
- source_word: Ἀκακία
  english_pob_choice: Innocence
  chosen_korean: 순결
  alternatives_korean:
  - 무구함
  - 순진함
  - 악함이 없음
  lexicon: LSJ
  rationale: 이 단어는 ‘해코지 없음/순진무구함’의 뜻이지만, 덕목 연쇄 안에서는 도덕적 순수함을 드러내는 ‘순결’이 가장 자연스럽습니다.
- source_word: Σεμνότης
  english_pob_choice: Dignity
  chosen_korean: 품위
  alternatives_korean:
  - 위엄
  - 단정함
  - 경건한 엄숙함
  lexicon: BDAG
  rationale: ‘존귀한 엄숙함’의 뉘앙스를 현대적으로 살리면서 덕목 목록에 어울리는 표현으로 ‘품위’를 선택했습니다.
- source_word: κρατῆσαι τῶν ἔργων αὐτῶν
  english_pob_choice: hold fast to their works
  chosen_korean: 그 일들을 굳게 붙들 수 있다면
  alternatives_korean:
  - 그 일들을 지킬 수 있다면
  - 그 일들을 장악할 수 있다면
  lexicon: BDAG
  rationale: 이미 수정된 POB 결정에 따라 κρατέω + 속격의 뜻을 ‘지배하다’가 아니라 ‘굳게 붙들다/지키다’로 반영했습니다.
theological_decisions:
- issue: 여러 덕목의 의인화 유지
  chosen_reading: 여인들을 추상적 개념으로만 풀지 않고, 탑을 떠받치고 서로에게서 태어나는 실제 인물처럼 묘사했습니다.
  alternative_readings:
  - 덕목 이름만 나열하는 방식으로 평탄화하기
  rationale: 원문은 비전 형식으로 덕목들을 인격화해 묘사하므로, 그 상징적 힘을 보존하는 것이 문맥상 더 충실합니다.
  doctrine_reference: 비전문학의 상징적 의인화
- issue: ἀνακαίνωσις τῶν πνευμάτων ὑμῶν
  chosen_reading: ‘너희 영의 새롭게 됨’을 ‘충분하다’의 주어로 삼아, 상기와 새롭게 됨이 함께 충분하다는 구조를 살렸습니다.
  alternative_readings:
  - ‘너희 영의 새롭게 하심이 너희에게 충분하다’로 처리하기
  rationale: 그리스어 문법상 ἀνακαίνωσις는 목적어가 아니라 ὑπόμνησις와 함께 술어 ἀρκετή의 주어입니다. 이를 한국어에서도 병렬 주어로 보존해야 합니다.
  doctrine_reference: 문법-의미 일치
