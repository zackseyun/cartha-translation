  source_fidelity: 현 초안은 핵심 의미를 대체로 따르지만, 그리스어의 일관된 단수 2인칭(σου, συ)을 복수 ‘너희’로 옮겼고, ‘원하는 대로 들어라’는 표현이 문맥상 다소 부자연스럽습니다. ‘때가 차서’와 ‘어리석은 자가 될까’도 원문의 경고와 ‘발견되다/드러나다’의 뉘앙스를 더 정확히 반영할 필요가 있습니다.
  naturalness: 현대 표준어 합쇼체 대신 ‘이르시되’, ‘정결케’, ‘싫어하는도다’, ‘하셨느니라’ 등 고어적 성서체가 사용되었습니다. 현대 정중체로 자연스럽게 고쳤습니다.
  terminology: ‘하나님’은 초안과 일관되며, τῷ Θεῷ의 번역으로 적절합니다. ‘마음을 깨끗하게 하다’는 καθαρίσαι τὴν καρδίαν을 자연스럽고 충실하게 반영합니다.
