revisions:
- from: 그가 내게 대답하여 이르시되 너희의 어리석음이 계속되고 마음을 정결케 하는 것과 하나님을 섬기기를 싫어하는도다 때가 차서 너희가 어리석은 자가 될까 두려우니라 그런즉 너희는 원하는 대로 들어라 이 일을 깨닫게 되리라 하셨느니라
  to: 그가 내게 대답하여 말씀하셨습니다. “당신의 어리석음은 끈질기며, 당신은 마음을 깨끗하게 하고 하나님을 섬기려 하지 않습니다. 때가 다 차고 당신이 어리석은 사람으로 드러날까 조심하십시오. 그러므로 당신이 바라는 대로 들으십시오. 그리하여 이것들을 깨닫도록 하십시오.”
  rationale: 원문의 단수 호칭, 지속적인 어리석음, 마음을 깨끗이 하여 하나님을 섬기라는 대비, 때가 찰 것에 대한 경고, 그리고 깨달음을 위한 청취의 목적을 보존했습니다. 대괄호로 표시된 φησί는 본문 전승상의 편집 표지이므로, 이 짧은 독자 단위에서는 별도 주석 없이 자연스러운 인용문으로 처리했습니다.
