revisions:
- from: “그러나 면죄부에는 사람을 구원하는 일이 있으니 많은 사람이 선한 일을 하여 자기 일을 좇아 방종하는 것이니 그러므로 하나님의 종들에게는 유익하고 그 사람의 생명을 건지려니 앞에 말한 해로운 면죄부는 그들에게 형벌을 주나니 고집하고 회개하지 아니하면 자기를 죽음에 이르게 하느니라.”
  to: “그러나 사람을 구원하는 즐거움들도 있습니다. 많은 사람이 자기 즐거움에 이끌려 선한 일을 하며 즐거워합니다. 그러므로 이러한 즐거움은 하나님의 종들에게 유익하며, 그런 사람에게 생명을 얻게 합니다. 그러나 앞서 말한 해로운 즐거움들은 그들에게 고통과 형벌을 가져옵니다. 그들이 계속 그렇게 하고 회개하지 않으면, 자기 자신에게 죽음을 가져옵니다.”
  rationale: 원문의 대조 구조, 곧 선한 일을 기꺼이 행하는 데 따르는 유익한 τρυφή와 악한 행위에서 비롯되는 해로운 τρυφή를 ‘즐거움’으로 일관되게 재현했습니다. ‘생명을 얻게 하다’와 ‘죽음을 가져오다’는 각각 περιποιεῖται의 반복을 자연스럽게 반영합니다.
