revisions:
- from: “누구든지 방종하여 하루 동안 속임을 당하고 제 뜻대로 행하는 자는 어리석은 옷을 입고 자기가 하는 일을 깨닫지 못하리니 이는 전날에 행한 일을 다음날이면 잊어버리기 때문이라 그 행한 어리석음으로 말미암아 방종과 속임이 기억되지 아니하나 형벌과 환난이 하루 동안 계속되면 형벌을 받아 일년까지 괴롭게 하리니 형벌을 위하여 고통은 큰 기억을 가지고 있습니다.
  to: “하루 동안 향락에 빠지고 속임을 당하며 자기가 원하는 것을 행하는 사람은 많은 어리석음을 입었으며, 자기가 하는 행위를 깨닫지 못합니다. 다음 날에는 하루 전에 무엇을 행했는지 잊어버리기 때문입니다. 그가 입은 어리석음 때문에 향락과 속임에는 기억력이 없습니다. 그러나 형벌과 고통이 사람에게 하루 동안 들러붙으면, 그는 일 년까지 형벌을 받고 고통을 당합니다. 형벌과 고통에는 큰 기억력이 있기 때문입니다.”
  rationale: 원문의 현재적 일반 진술, ‘어리석음을 입다’라는 비유, 향락과 형벌의 하루/일 년 대조, 그리고 형벌과 고통에 기억력을 부여하는 의인화를 모두 보존했습니다. ‘일 년까지’는 μέχρις ἐνιαυτοῦ의 상한·종결점을 과도하게 해석하지 않고 반영합니다.
