revisions:
- from: 그러므로 여러분의 죄로 인해 인생에 절망하고 죄를 더하고 인생을 무겁게 짓고 있는 하나님을 믿으십시오. 여러분이 전심으로 주께로 돌아와 남은 생애 동안 의를 행하고 그 뜻대로 의롭게 섬기면 하나님께서 여러분의 이전 죄를 고치시고 마귀의 일을 제어할 권세를 얻으실 것입니다. 그리고 마귀의 위협을 전혀 두려워하지 마십시오. 그는 죽은 사람의 힘줄처럼 무력하기 때문입니다.
