  source_fidelity: 초안은 회개, 의의 실천, 하나님의 치유, 마귀의 일에 대한 승리라는 본문의 주요 흐름을 대체로 반영합니다. 그러나 첫 문장에서 관계 수식이 잘못 연결되어 ‘하나님을 믿으십시오’가 ‘인생에 절망하고… 있는 하나님’을 목적어로 삼는 것처럼 읽힙니다. 또한 ἴασιν(‘치유/낫게 함’)과 δύναμιν(‘힘, 능력’)을 더 직접적으로 옮길 필요가 있습니다.
  naturalness: 첫 문장의 수식 범위가 불명확하여 현대 한국어로 부자연스럽고 의미를 왜곡합니다. 문장을 재구성하고 ‘삶’을 반복적으로 자연스럽게 처리하면 합쇼체 문체에서 명료해집니다.
  terminology: ‘주’, ‘하나님’, ‘마귀’, ‘의’는 적절합니다. δικαιοσύνη는 여기서 ‘의를 행하다’로 유지할 수 있으며, δουλεύσητε αὐτῷ ὀρθῶς는 ‘그분을 바르게 섬기다’가 자연스럽습니다. ‘권세’보다 δύναμις에 가까운 ‘힘’을 사용했습니다.
