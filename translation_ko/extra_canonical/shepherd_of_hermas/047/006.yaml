  verdict: revise
  source_fidelity: The draft mistranslates ἀλλότρια (“belonging to another/not one’s own”) as “other matters,” shifts repeated singular address to plural, and renders χρᾶσαι (“make use of/follow”) as “keep.” It also omits the source/audit trail’s terminal ellipsis.
  naturalness: The draft has several nonstandard or archaic constructions for the requested modern formal-polite register, inconsistent pronouns, and malformed quotation punctuation. The revision uses natural formal-polite Korean while retaining the direct, admonitory style.
  terminology: “두 마음을 품은” adequately conveys δίψυχος; “비참한” conveys ταλαίπωρος naturally. “법을 따르다” is used for χρᾶσαι in this legal/civic metaphor, without importing later theological terminology such as “율례.”
  issues:
