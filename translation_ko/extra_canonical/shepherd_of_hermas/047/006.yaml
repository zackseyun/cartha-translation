revisions:
- from: 어리석고 두 마음을 품고 ​​곤고한 사람아, 너는 이 모든 것이 다 다른 일이며 남의 권세 아래 있는 줄을 알지 못하느냐? 이 성읍 주인이 이르기를 나는 너희가 내 성에 거하는 것을 원하지 아니하노라 오히려 이 성에서 나가라. 내 법을 지키지 아니하니라.' 그러므로 네가 밭과 거처와 그 밖의 재물이 많더라도 그에게 쫓겨나게 되면 네 밭과 집과 네 예비한 나머지는 어떻게 하겠느냐? 이 땅의 주인이 너희에게 말하기를 내 율례를 따르든지 아니면 내 땅에서 떠나라 하신 것이 옳으니이다. 그러면 너희가 어떻게 하려느냐?
