  verdict: revise
  source_fidelity: 초안은 마귀의 능력을 끊고 그를 제어하며 그의 일들을 이긴다는 중심 뜻을 대체로 담았습니다. 그러나 ἐλπίζω(‘바랍니다/소망합니다’)를 기도 청원인 ‘...하옵소서’로 바꾸어 화자의 진술을 기도로 변경했습니다. 또한 ‘강건하여졌나니’, ‘하심이라’, ‘알았나이다’는 목표 register인 현대 합쇼체에 맞지 않습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 자연스럽게 정리하고, 직접화법의 인용 부호 및 문장 연결을 다듬었습니다.
  terminology: δικαιώματα는 여기서 ‘의로운 요구’ 또는 ‘의로운 규례’라는 의미입니다. 문맥상 ‘주님의 모든 의로운 요구를 지킬 힘’을 얻었다고 옮겨 자연스럽게 표현했습니다. ‘마귀’와 ‘주님’은 원문의 διαβόλου 및 Κύριε에 맞게 유지했습니다.
  issues:
  - severity: high
    issue: ‘내가 ... 지킬 수 있기를 원하며 주께서 나를 강건하게 하옵소서’
    rationale: 원문의 ‘나는 ... 지킬 수 있기를 바랍니다/소망합니다, 주님께서 나를 강하게 하심으로’는 화자의 희망 진술입니다. 초안은 이를 주님께 드리는 청원으로 바꾸어 의미와 발화 기능을 변경합니다.
  - severity: medium
    issue: 고어체 종결과 연결 표현
    rationale: ‘강건하여졌나니’, ‘하심이라’, ‘알았나이다’, ‘이기리라’는 현대 formal-polite 합쇼체의 일관된 문체가 아닙니다.
  - severity: low
    issue: ‘주의 모든 의로운 요구에 강건하여졌나니’
    rationale: 원문 ἐνεδυναμώθην ἐν πᾶσι τοῖς δικαιώμασι는 직역하면 다소 어색합니다. 한국어에서는 모든 의로운 요구를 지킬 힘을 얻었다고 표현하는 것이 문맥과 자연스러움을 함께 살립니다.
