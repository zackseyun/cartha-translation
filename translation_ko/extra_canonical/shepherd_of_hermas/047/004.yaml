revisions:
- from: 나는 그에게 "주여, 이제 나는 주의 모든 의로운 요구에 강건하여졌나니 이는 주께서 나와 함께 하심이라. ​​주께서 마귀의 모든 능력을 끊으시고 우리가 그를 제어하며 그의 모든 일을 이기리라는 것을 내가 알았나이다. 그리고 주여, 이제 내가 주께서 명하신 이 계명을 지킬 수 있기를 원하며 주께서 나를 강건하게 하옵소서."
  to: 나는 그에게 말했습니다. “주님, 이제 저는 주님의 모든 의로운 요구를 지킬 힘을 얻었습니다. 주님께서 저와 함께 계시기 때문입니다. 또 주님께서 마귀의 모든 능력을 꺾으실 것이며, 우리가 그를 제압하고 그의 모든 일을 이길 것임을 압니다. 그리고 주님, 이제 주님께서 명하신 이 계명들을, 주님께서 저를 강하게 하심으로 제가 지킬 수 있기를 바랍니다.”
