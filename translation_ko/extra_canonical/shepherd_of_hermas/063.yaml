  text: 'And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood by him. And he says to me, “Gird yourself with a raw-linen sash, and serve me.” So I girded myself with a clean raw-linen sash made from a sack.


    2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the plain and called them all; and they all stood in their ranks.


    3. He says to them, “Let each pull up his own rods and bring them to me.”


    4. First those who had the dry and cut [rods] handed them in, and they were found likewise to be dry and cut; and he ordered them to stand apart.


    5. Then those who had the dry but not cut [rods] handed them in. And some of them handed in their rods green, but others dry and cut, as if worm-eaten. So those who had handed in green [rods] he ordered to stand apart, but those with dry—'
translation:
  language: ko
  text: '며칠 뒤에 우리는 그곳에 이르렀습니다. 목자는 천사의 자리에 앉았고, 나는 그 곁에 서 있었습니다. 그가 내게 말했습니다. “거친 아마포 허리띠를 두르고 나를 섬기십시오.” 그래서 나는 자루로 만든 깨끗한 거친 아마포 허리띠를 두르았습니다.


    2. 그가 내가 허리를 동이고 그를 섬길 준비가 된 것을 보고 말했습니다. “가지가 박혀 있는 사람들을, 각 사람이 막대기를 낸 순서대로 불러오십시오.” 나는 들판으로 나가서 그들을 모두 불렀고, 그들은 다 자기 순서대로 섰습니다.


    3. 그가 그들에게 말했습니다. “각 사람은 자기 막대기를 뽑아 나에게 가져오십시오.”


    4. 먼저 마르고 꺾인 막대기를 가진 사람들이 그것을 내놓았는데, 그것은 역시 마르고 꺾인 것으로 드러났습니다. 그는 그들에게 따로 서 있으라고 하였습니다.


    5. 그다음에는 마르되 꺾이지 않은 막대기를 가진 사람들이 그것을 내놓았습니다. 그런데 그들 가운데 어떤 이들은 막대기를 푸르게 내놓았고, 어떤 이들은 벌레 먹은 듯 마르고 꺾인 막대기를 내놓았습니다. 그러므로 푸른 막대기를 내놓은 사람들에게는 따로 서 있으라고 하였지만,[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠμόλινον
  english_pob_choice: raw-linen
  chosen_korean: 거친 아마포
  alternatives_korean:
  - 생아마포
  - 날아마포
  lexicon: ὠμόλινος
  rationale: POB의 raw-linen은 가공되지 않은 아마 섬유의 질감을 가리키므로, 한국어에서는 의미를 드러내는 ‘거친 아마포’로 옮겨 재질과 질감을 함께 살렸습니다.
- source_word: διακόνει μοι / τοῦ διακονεῖν αὐτῷ
  english_pob_choice: serve me / ready to serve him
  chosen_korean: 나를 섬기십시오 / 그를 섬길 준비
  alternatives_korean:
  - 나를 시중드십시오 / 그를 시중들 준비
  - 나를 봉사하십시오 / 그를 봉사할 준비
  lexicon: διακονέω
  rationale: 이 동사는 단순한 예절상의 시중보다 실제 봉사와 수행을 포함하므로, 현대 한국어에서는 ‘섬기다’가 가장 자연스럽고 넓은 의미를 보존합니다.
- source_word: ῥάβδοι
  english_pob_choice: rods
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 몽둥이
  lexicon: ῥάβδος
  rationale: 문맥상 심볼로 제시된 물건이므로 ‘지팡이’보다 중립적인 ‘막대기’가 적절합니다.
- source_word: ἐν τάγματι / κατὰ τὰ τάγματα
  english_pob_choice: by rank / in their ranks
  chosen_korean: 순서대로 / 자기 순서대로
  alternatives_korean:
  - 계급에 따라 / 계열대로
  - 대열대로
  lexicon: τάγμα
  rationale: 이 장면에서는 군사적 계급보다 진행 순서와 배열이 강조되므로, 한국어에서는 ‘순서’가 의미를 더 정확히 전달합니다.
theological_decisions:
- issue: 목자가 천사의 자리에 앉는 표현
  chosen_reading: “목자는 천사의 자리에 앉았고”로 직역해, 목자와 천사의 구분 및 역할 교체를 그대로 보존했습니다.
  alternative_readings:
  - ‘목자가 천사의 자리로 갔다’
  - ‘목자가 그 천사처럼 앉았다’
  rationale: 원문은 자리(place of the angel)를 말하므로, 목자가 그 자리에 앉았다는 서술을 유지해야 환상 내 상징 구조가 흐려지지 않습니다.
  doctrine_reference: 문맥적 상징 보존
