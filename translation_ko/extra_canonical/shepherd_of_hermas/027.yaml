base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027.yaml
  text: 'He says to me: Have simplicity[1], and become guileless, and you will be like the little ones who do not know the wickedness that destroys the life of human beings.


    First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.


    Slander is evil; it is a restless demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have well‑being with all.


    But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.


    Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.


    Therefore the one who gives is innocent[2]; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.


    So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity[a][7][6][5][4][3], and your heart clean and unstained.'
  footnotes:
  - marker: '1'
    text: “Well‑being” renders εὐθηνία, which can also mean “prosperity.” The context (“with all”) suggests good standing and flourishing in relationships rather than material plenty.
    reason: lexical_alternative
  - marker: '2'
    text: “Demon” translates δαιμόνιον; some would paraphrase “evil spirit,” but Hermas’s personification is intentional.
    reason: lexical_alternative
  - marker: '3'
    text: “Dignity” renders σεμνότης; alternatives include “gravity” or “reverent seriousness.”
    reason: lexical_alternative
  - marker: '4'
    text: “Give simply” (ἁπλῶς) can also mean “give generously,” but Hermas emphasizes single‑heartedness as well as liberality.
    reason: lexical_alternative
  - marker: '5'
    text: “Slander” translates καταλαλέω/καταλαλία; “backbiting” is another English option.
    reason: lexical_alternative
  - marker: '6'
    text: “Have something against your brother” reflects a Greek idiom for holding a grievance.
    reason: cultural_note
  - marker: '7'
    text: “Ministry” renders διακονία; “service” is possible but less clearly ecclesial.
    reason: lexical_alternative
  - marker: a
    text: Or 'Thus this ministry, carried out in simplicity, became glorious with God.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그가 내게 말합니다. 「순수함을 지니고, 간교함이 없는 사람이 되십시오. 그러면 당신은 사람의 생명을 파괴하는 그 악을 알지 못하는 어린아이들과 같아질 것입니다.


    무엇보다도 누구도 중상하지 마십시오. 그리고 중상하는 사람의 말을 기꺼운 마음으로 듣지 마십시오. 그렇지 않으면 듣는 당신도, 들은 중상을 믿는다면, 중상하는 사람의 죄에 유죄가 됩니다. 왜냐하면 그것을 믿음으로써 당신 자신도 형제에게 대하여 무언가를 가지게 되기 때문입니다. 그러므로 당신은 중상하는 사람의 죄에 유죄가 됩니다.


    중상은 악합니다. 그것은 불안정한 악령이며, 결코 평안하지 않고 언제나 분열 한가운데에 머뭅니다. 그러니 그것을 멀리하십시오. 그러면 당신은 항상 모든 이와 함께 평안을 누리게 될 것입니다.


    그러나 품위를 입으십시오. 그 안에는 악한 걸림돌이 전혀 없고, 모든 것이 매끄럽고 즐겁습니다. 선한 일을 하십시오. 그리고 하나님께서 당신에게 주시는 당신의 수고에서, 필요로 하는 모든 사람에게 단순하게 주십시오. 누구에게 주어야 하는지, 혹은 누구에게 주어서는 안 되는지 망설이지 마십시오. 모든 사람에게 주십시오. 하나님께서는 자기의 선물들 가운데서 모든 사람에게 주어지기를 원하십니다.


    그러므로 받는 사람들은 왜 받았는지, 또 무엇을 위해 받았는지 하나님께 답변하게 될 것입니다. 왜냐하면 고난 가운데 받는 사람들은 심판을 받지 않을 것이지만, 위선 가운데 받는 사람들은 벌을 받을 것이기 때문입니다.


    그러므로 주는 사람은 무죄합니다. 왜냐하면 그도 주님께로부터 수행해야 할 봉사를 받았을 때, 단순하게 그것을 수행하며 누구에게 주어야 하는지, 혹은 주어서는 안 되는지 아무런 구별도 하지 않았기 때문입니다. 그러므로 이렇게 단순하게 수행된 이 봉사는 하나님 앞에서 영광스럽게 되었습니다. 그러므로 이렇게 단순하게 하나님을 섬기는 사람은 살 것입니다.


    그러니 내가 당신에게 말한 이 계명을 지키십시오. 그리하여 당신과 당신 집안의 회개가 순수함 안에서 드러나고, 당신의 마음이 깨끗하고 더럽혀지지 않게 하십시오.」[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότης / ἁπλῶς
  english_pob_choice: simplicity / simply
  chosen_korean: 순수함 / 단순하게
  alternatives_korean:
  - 순결함 / 순수하게
  - 성실함 / 성실하게
  - 한결같음 / 한결같게
  lexicon: BDAG
  rationale: ἁπλότης의 핵심은 한마음·한결같음의 도덕적 태도이므로 명사형은 ‘순수함’으로, 부사형은 반복을 살려 ‘단순하게’로 옮겼습니다.
- source_word: ἄκακος
  english_pob_choice: guileless
  chosen_korean: 간교함이 없는
  alternatives_korean:
  - 순진한
  - 해가 없는
  - 순박한
  lexicon: BDAG
  rationale: 문맥상 속임수와 술책이 없는 성품을 가리키므로, 어린아이 비유와도 맞는 ‘간교함이 없는’으로 풀어 의미를 분명히 했습니다.
- source_word: καταλαλέω / καταλαλία
  english_pob_choice: slander / slander
  chosen_korean: 중상 / 중상하다
  alternatives_korean:
  - 비방 / 비방하다
  - 뒷말 / 험담하다
  lexicon: BDAG
  rationale: 상대의 명예를 해치는 발화를 지적하는 말이므로, 윤리적·법적 무게를 가진 ‘중상’을 택했습니다.
- source_word: ἀκατάστατον
  english_pob_choice: restless
  chosen_korean: 불안정한
  alternatives_korean:
  - 초조한
  - 정처 없는
  - 요란한
  lexicon: BDAG
  rationale: 영적 존재의 끊임없는 동요와 질서를 잃은 상태를 나타내므로, 단순한 감정 상태보다 구조적 불안정을 드러내는 ‘불안정한’이 적절합니다.
- source_word: εὐθηνία
  english_pob_choice: well-being
  chosen_korean: 평안
  alternatives_korean:
  - 형통
  - 번영
  - 잘됨
  lexicon: LSJ
  rationale: 문장 끝의 ‘with all’과 결합해 관계적·공동체적 상태를 말하므로, 물질적 번영보다 공동체적 안녕을 드러내는 ‘평안’을 선택했습니다.
- source_word: σεμνότης
  english_pob_choice: dignity
  chosen_korean: 품위
  alternatives_korean:
  - 엄숙함
  - 위엄
  - 근엄함
  lexicon: BDAG
  rationale: 도덕적 품격과 단정한 태도를 가리키므로, 한국어에서 자연스럽고 과도하게 경직되지 않은 ‘품위’로 옮겼습니다.
- source_word: διακονία / διακονεῖν
  english_pob_choice: ministry / minister
  chosen_korean: 봉사 / 섬기다
  alternatives_korean:
  - 사역 / 사역하다
  - 직무 / 수행하다
  lexicon: BDAG
  rationale: 이 문맥에서는 자선 행위가 하나님께서 맡기신 섬김으로 제시되므로, 교회적 뉘앙스를 살리되 한국어에서는 ‘봉사’가 가장 무난합니다.
theological_decisions:
- issue: δαιμόνιον의 인격화된 악의 표현
  chosen_reading: ‘악령’으로 번역해 중상을 단순한 도덕 결함이 아니라 실제로 사람을 어지럽히는 악의 작용으로 드러냈습니다.
  alternative_readings:
  - 악한 영
  - 악한 힘
  rationale: 본문은 중상을 ‘악령’으로 의인화하므로, 이를 약화하지 않고 초기 기독교적 세계관을 보존하는 것이 필요합니다.
  doctrine_reference: Hermas의 악령/영적 전쟁 표현
- issue: εὐθηνία의 의미
  chosen_reading: 관계적 안녕을 강조하는 ‘평안’으로 옮겼습니다.
  alternative_readings:
  - 잘됨
  - 형통
  - 번영
  rationale: ‘with all’이라는 결합이 물질적 풍요보다 공동체적 화평과 안녕을 가리키므로, 문맥에 맞게 번역했습니다.
  doctrine_reference: 공동체 윤리와 평강의 결합
