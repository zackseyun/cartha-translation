revisions:
- from: 형제들이여, 내가 자고 있을 때 아주 잘생긴 청년이 나에게 이런 말을 했습니다. “너희가 그 작은 책을 받은 그 노파, 너희는 그가 누구라고 생각하느냐?” 나는 “시빌라”라고 말했습니다. “당신은 착각하고 있습니다.”라고 그는 말합니다. “그녀는 그렇지 않아요.” “그럼 그 사람은 누구예요?” 나는 말한다. 그는 “교회”라고 말합니다. 나는 그에게 “그럼 왜 늙었습니까?”라고 말했습니다. “그가 먼저 창조되었기 때문에 그가 늙었고 세상도 그를 위하여 지음받았느니라.”
  to: 형제 여러분, 내가 잠들어 있을 때 매우 잘생긴 한 청년이 내게 나타나 이렇게 말함으로써 내게 계시로 알려졌습니다. “당신이 그 작은 책을 받은 그 나이 든 여인이 누구라고 생각합니까?” 나는 “시빌라입니다”라고 대답했습니다. 그가 말했습니다. “틀렸습니다. 그분은 시빌라가 아닙니다.” 나는 “그러면 그분은 누구입니까?”라고 물었습니다. 그가 말했습니다. “교회입니다.” 나는 그에게 “그러면 왜 나이 든 여인입니까?”라고 물었습니다. 그가 말했습니다. “모든 것 가운데 가장 먼저 창조되었기 때문입니다. 그러므로 나이 든 여인이며, 그분을 위하여 세상이 지어졌습니다.”
  rationale: 원문의 단수 호칭, 여성 의인화, 계시의 수동 표현, 그리고 교회가 먼저 창조되고 세상이 그분을 위하여 형성되었다는 문장 구조를 보존했습니다. 논쟁적 우주론적 진술을 해설하거나 완화하지 않았습니다.
