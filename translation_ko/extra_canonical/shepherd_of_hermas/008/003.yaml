revisions:
- from: 3. “그러므로 너는 소책자 두 권을 써서 하나는 글레멘드에게, 하나는 그랍테에게 보내라. 그 일은 그에게 맡겨졌으니 글레멘트는 그것을 바깥 성읍들에 보낼 것이요 그랍테는 과부들과 고아들을 권면할 것이요 너는 이 성에서 교회를 다스리는 장로들과 함께 큰 소리로 읽으라.”
  to: 3. “그러므로 작은 책자 두 권을 쓰고, 하나는 클레멘트에게, 하나는 그랍테에게 보내십시오. 클레멘트는 그것을 외부 도시들에 보낼 것입니다. 이것이 그에게 맡겨졌기 때문입니다. 그랍테는 과부들과 고아들을 권면할 것입니다. 그러나 당신은 이 도시에서 교회를 이끄는 장로들과 함께 그것을 소리 내어 읽으십시오.”
  rationale: 인명 오기를 바로잡고, 원문의 수신·전달·권면·낭독의 순서를 보존했습니다. 또한 현대 한국어 합쇼체와 자연스러운 문장 구성을 적용했으며, προϊστάμενοι의 의미는 특정 교회 제도 용어로 한정하지 않고 ‘교회를 이끄는 장로들’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
