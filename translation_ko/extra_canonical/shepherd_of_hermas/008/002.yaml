  text: 2. 그 후에 나는 내 집에서 환상을 보았습니다. 노파가 와서 나에게 그 책을 이미 장로들에게 드렸는지 물었습니다. 나는 그것을 준 적이 없다고 부인했다. “잘 했어요.”라고 그녀는 말합니다. “내게 덧붙일 말이 있으니 그러므로 내가 그 말을 다 마치면 너희를 통하여 택하신 모든 사람에게 그 내용이 알려지리라.
