revisions:
- from: 2. 그 후에 나는 내 집에서 환상을 보았습니다. 노파가 와서 나에게 그 책을 이미 장로들에게 드렸는지 물었습니다. 나는 그것을 준 적이 없다고 부인했다. “잘 했어요.”라고 그녀는 말합니다. “내게 덧붙일 말이 있으니 그러므로 내가 그 말을 다 마치면 너희를 통하여 택하신 모든 사람에게 그 내용이 알려지리라.
  to: 2. 그 후에 나는 내 집에서 환상을 보았습니다. 그 노파가 와서 내가 이미 그 책을 장로들에게 주었는지 물었습니다. 나는 아직 주지 않았다고 부인했습니다. 그녀가 말했습니다. “잘하셨습니다. 내가 덧붙일 말씀들이 있기 때문입니다. 그러므로 내가 모든 말씀을 마치면, 당신을 통하여 택함을 받은 모든 이에게 그것들이 알려질 것입니다.”
  rationale: 단수 대명사와 복수 ‘말씀들’을 원문에 맞추고, 미완으로 끝난 인용문을 완결했습니다. 문체는 현대 표준어 합쇼체로 통일했으며, 교회론적 의인화나 ‘택함’의 의미에 별도 교리적 해석을 덧붙이지 않았습니다.
