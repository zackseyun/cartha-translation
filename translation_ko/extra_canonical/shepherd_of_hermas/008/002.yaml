  source_fidelity: 핵심 서술은 대체로 원문을 따르지만, 마지막 문장의 διὰ σοῦ는 단수 ‘당신을 통하여’인데 초안은 ‘너희를 통하여’로 옮겨 인칭·수 일치가 어긋납니다. 또한 인용문이 끝맺히지 않아 본문 단위가 불완전합니다.
  naturalness: ‘부인했다’는 주변 합쇼체 서술과 어울리지 않고, ‘내게 덧붙일 말’ 및 ‘그 말을 다 마치면’은 원문의 복수 ῥήματα와 완료(‘모든 말씀을 마치면’)를 충분히 반영하지 못합니다. 수정문은 현대 표준어 합쇼체로 통일했습니다.
  terminology: πρεσβύτεροι는 이 문맥에서 ‘장로들’로 유지할 수 있습니다. ἐκλεκτοῖς는 신학적 해석을 더하지 않고 ‘택함을 받은 모든 이들’로 옮겼습니다. πρεσβυτέρα는 문맥상 인물 지칭인 ‘노파’로 유지했습니다.
