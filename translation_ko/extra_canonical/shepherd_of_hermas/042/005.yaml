revisions:
- from: 5. 그러므로 그것에 대하여 면류관을 썼으니 의를 사모하고 너희 받은 승리를 그것에 넘겨 주고 그 뜻대로 섬기라. 선한 욕망을 섬기고 순종하면 악한 욕망을 다스리고 원하는 대로 굴복시킬 수 있습니다.
  to: 5. 그러므로 그것을 이기고 면류관을 쓴 뒤, 의에 대한 욕망에게로 가서, 그대가 얻은 승리를 그 욕망에 넘겨주고 그것이 바라는 대로 그것을 섬기십시오. 선한 욕망을 섬기고 그것에 복종하면, 악한 욕망을 다스리고 원하는 대로 그것을 복종시킬 수 있습니다.
  rationale: 원문의 비유적 표현인 승리의 면류관과 승리를 선한 욕망에 넘겨주는 행위를 보존하면서, 한국어에서 선행사가 분명하도록 ‘그 욕망’을 사용했습니다. 전체를 현대 표준어 합쇼체로 통일했습니다.
