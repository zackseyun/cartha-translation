    issue: ‘의를 사모하고’가 ‘의에 대한 욕망에게로 가라’라는 원문의 명령을 축소함
    rationale: ἐλθὲ πρὸς τὴν ἐπιθυμίαν τῆς δικαιοσύνης는 단순히 의를 사모하라는 말이 아니라 그 선한 욕망으로 나아가라는 표현입니다.
  - severity: medium
    issue: 문체와 인칭의 불일치
    rationale: ‘섬기라’와 ‘있습니다’가 혼재하고, 원문 단수에 없는 ‘너희’가 들어가 있습니다.
  - severity: low
    issue: ‘그것에 대하여 면류관을 썼으니’의 어색하고 불명확한 표현
    rationale: κατ᾽ αὐτῆς는 악한 욕망을 이긴 승리를 뜻하므로 ‘그것을 이기고 면류관을 쓴 뒤’가 더 명확합니다.
