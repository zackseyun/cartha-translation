  source_fidelity: 원문의 단수 명령과 조건문의 논리를 살리되, κατ᾽ αὐτῆς는 앞 단락의 ‘악한 욕망’을 가리키도록 ‘그것을 이기고’로 명확히 했습니다. ‘의를 사모하고’는 ‘의에 대한 욕망에게로 가라’라는 명령을 충분히 반영하지 못하므로 수정했습니다.
  naturalness: 초안의 ‘그것에 대하여 면류관을 썼으니’와 ‘너희 받은’은 현대 한국어로 부자연스럽고, 명령형 ‘섬기라’와 종결형 ‘있습니다’가 혼재합니다. 합쇼체 명령형과 자연스러운 지시어로 통일했습니다.
  terminology: ἐπιθυμία는 문맥상 반복되는 핵심어이므로 ‘욕망’으로 일관되게 옮겼으며, δικαιοσύνη는 전통적이면서도 중립적인 ‘의’로 유지했습니다. ‘선한 욕망’과 ‘악한 욕망’의 대조도 보존했습니다.
  issues:
