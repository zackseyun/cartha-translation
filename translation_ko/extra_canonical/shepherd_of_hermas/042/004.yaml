revisions:
- from: 4. 그러나 너희는 의를 사모하고 주님를 경외함으로 무장하고 그들을 대적하라 선한 욕망에는 하나님을 경외하는 마음이 깃들어 있기 때문입니다. 만일 그 악한 정욕이 너희가 하나님을 경외함으로 무장하고 이에 저항하는 것을 보면 너희에게서 멀리 도망하여 너희 무기를 두려워하여 더 이상 너희에게 나타나지 아니하리라.
  to: 4. 그러나 당신은 의를 향한 열망을 입고, 주님을 경외함으로 무장하여 그것들에 맞서십시오. 하나님을 경외함은 선한 열망 안에 깃들어 있기 때문입니다. 악한 열망이 당신이 하나님을 경외함으로 무장하고 자신에게 맞서고 있는 것을 보면, 당신의 무기를 두려워하여 당신에게서 멀리 달아나고 더 이상 당신에게 나타나지 않을 것입니다.
  rationale: 원문의 단수 호칭, ‘입다’와 ‘무장하다’의 비유, 선한 열망과 악한 열망의 대조를 보존하면서 현대 표준 한국어 합쇼체로 다듬었습니다. 본문에 필요한 의미를 모두 담을 수 있어 각주는 필요하지 않습니다.
