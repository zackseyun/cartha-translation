  terminology: δικαιοσύνη는 ‘의’, φόβος τοῦ Κυρίου/Θεοῦ는 ‘주님을/하나님을 경외함’, ἐπιθυμία는 이 문맥에서 선악 양쪽에 쓰이므로 각각 ‘선한/악한 열망’으로 번역했습니다. ‘주님’과 ‘하나님’의 원문상 교차는 조화시키지 않았습니다.
