revisions:
- from: 2. 그러므로 이것은 하나님의 종들을 죽이는 악한 정욕이니라. 이 악한 욕망은 마귀의 딸이기 때문입니다. 그러므로 악한 정욕을 제어해야 합니다. 그러면 그 제어로 하나님을 위해 살 수 있습니다.
  to: 2. 그러므로 이러한 욕망들은 하나님의 종들을 죽음에 이르게 하는 악한 욕망들입니다. 이 악한 욕망은 마귀의 딸이기 때문입니다. 그러므로 악한 욕망들을 멀리해야 합니다. 그것들을 멀리함으로써 하나님을 위하여 살 수 있습니다.
  rationale: 원문의 복수 표현, ‘죽음에 이르게 하다’라는 현재분사의 작용, ‘멀리하다’라는 ἀπέχεσθαι의 의미 및 반복되는 분사구문을 반영했습니다. 신학적 해석을 덧붙이지 않고 ‘마귀의 딸’이라는 원문의 비유를 보존했습니다.
