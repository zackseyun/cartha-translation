    issue: 복수 주어를 단수로 번역함
    rationale: αὗται ... αἱ ἐπιθυμίαι는 ‘이러한 욕망들은’이라는 복수입니다. 단수 번역은 원문의 문법과 의미 범위를 축소합니다.
  - severity: high
    issue: ‘제어해야 합니다’는 ἀπέχεσθαι의 의미를 바꿈
    rationale: ἀπέχεσθαι ἀπό는 악한 욕망을 통제한다는 뜻보다 그것들로부터 ‘멀리하다/삼가다’는 뜻입니다.
  - severity: medium
    issue: ‘그 제어로’가 분사구문의 의미를 충분히 반영하지 못함
    rationale: ἀποσχόμενοι는 ‘그것들을 멀리함으로써’라는 뜻이며, 앞 절의 ‘악한 욕망들’과의 연결을 명시하는 편이 정확합니다.
  - severity: low
