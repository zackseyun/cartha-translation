  source_fidelity: 초안은 복수 주어 αὗται(‘이러한 것들/욕망들’)를 단수 ‘이것’과 단수 ‘정욕’으로 옮겨 원문의 수를 잃었습니다. 또한 ἀπέχεσθαι는 ‘제어하다’가 아니라 ‘멀리하다/삼가다’이며, ἀποσχόμενοι(‘멀리함으로써’)의 반복도 보존해야 합니다.
  naturalness: 현대 표준어 합쇼체로 문장 종결을 일관되게 정리하고, ‘악한 욕망’으로 용어를 통일하면 자연스럽습니다.
  terminology: ἐπιθυμία는 이 문맥에서 ‘욕망’으로 일관되게 번역했습니다. ‘마귀의 딸’은 원문의 비유적·의인화된 표현을 그대로 유지했습니다. δοῦλοι τοῦ Θεοῦ는 ‘하나님의 종들’로 유지했습니다.
  issues:
