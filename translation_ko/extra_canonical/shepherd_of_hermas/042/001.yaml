revisions:
- from: 무엇보다도 먼저는 남의 아내와 남편을 탐하는 것과 사치하는 것과 헛된 음식과 술을 많이 탐하는 것과 그 밖의 여러 가지 어리석은 방종을 탐하는 것이니라. 모든 방종은 하나님의 종들에게는 어리석고 헛된 것이기 때문입니다.
  to: 무엇보다 앞서는 것은 남의 아내나 남편을 탐하는 욕망과 부에서 오는 사치를 탐하는 욕망, 많은 헛된 음식과 취하게 하는 술을 탐하는 욕망, 그리고 그 밖의 많은 어리석은 방종을 탐하는 욕망입니다. 모든 방종은 하나님의 종들에게 어리석고 헛된 것이기 때문입니다.
  rationale: 원문의 열거가 모두 ‘욕망’에 속함을 한국어에서 분명히 하고, 부와 연관된 사치 및 취하게 하는 술이라는 세부 의미를 보완했습니다. 원문의 포괄적이고 비유적 열거를 유지하며 교리적 해석은 덧붙이지 않았습니다.
