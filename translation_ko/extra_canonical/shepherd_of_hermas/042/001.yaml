  terminology: ‘하나님의 종들’은 δούλοις τοῦ Θεοῦ를 충실하고 자연스럽게 반영합니다. ‘방종’은 τρυφαί의 부정적으로 평가된 향락·방종의 문맥에 적절합니다.
