  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Lightfoot & Harmer 1891 (normalized OCR)
  text: Ἀκούσατέ μου, τέκνα. ἐγὼ ὑμᾶς ἐξέθρεψα ἐν πολλῇ ἁπλότητι καὶ ἀκακίᾳ καὶ σεμνότητι διὰ τὸ ἔλεος τοῦ Κυρίου τοῦ ἐφ᾽ ὑμᾶς στάξαντος τὴν δικαιοσύνην, ἵνα δικαιωθῆτε καὶ
  language: Greek
  pages:
  - 326
  unit_id: V.3.ix
  label: Vision 3, section ix
  sequence: 17
base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/017.yaml
  text: Listen to me[a], children. I reared you in great simplicity and guilelessness and dignity, through the mercy of the Lord, who caused righteousness to drip upon you[d][c][b], so that you might be made righteous and …
  footnotes:
  - marker: a
    text: 'Guilelessness: ἀκακία also means ''innocence'' or ''harmlessness''.'
    reason: lexical_alternative
  - marker: b
    text: 'Dignity: σεμνότης can also mean ''seriousness'', ''reverence'', or ''modesty''.'
    reason: lexical_alternative
  - marker: c
    text: 'The image of blessing or speech ''dropping/dripping'' (στάζω) appears in the LXX (e.g., Deut 32:2: ''My speech shall drop as the rain'').'
    reason: cross_reference
  - marker: d
    text: Or 'be justified' (δικαιωθῆτε); here rendered 'be made righteous' to reflect impartation rather than a strictly forensic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 들으십시오, 자녀들. 저는 여러분을 큰 단순함과 순전함과 품위 가운데서, 주님의 긍휼을 통해 길렀습니다. 그분은 여러분 위에 의를 떨어지게 하셨습니다[a][b][c][d], 그래서 여러분이 의롭게 되도록 하셨습니다…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατέ μου, τέκνα
  english_pob_choice: Listen to me, children
  chosen_korean: 들으십시오, 자녀들
  alternatives_korean:
  - 제 말을 들으십시오, 자녀들
  - 들으라, 자녀들
  lexicon: BDAG
  rationale: ἀκούω의 명령형으로서 직접적 호소를 살리되, 현대 합쇼체에 맞게 자연스럽고 공손하게 옮겼습니다.
- source_word: ἐξέθρεψα
  english_pob_choice: I reared (you)
  chosen_korean: 길렀습니다
  alternatives_korean:
  - 키웠습니다
  - 양육했습니다
  lexicon: LSJ
  rationale: 자녀를 ‘기르다/길르다’는 뜻을 살려 부모적 화자를 드러내며, 과도하게 해설적이지 않게 표현했습니다.
- source_word: ἁπλότητι καὶ ἀκακίᾳ καὶ σεμνότητι
  english_pob_choice: great simplicity and guilelessness and dignity
  chosen_korean: 큰 단순함과 순전함과 품위
  alternatives_korean:
  - 큰 단순함과 순결함과 엄숙함
  - 큰 단순함과 무해함과 존엄
  lexicon: BDAG/LSJ
  rationale: ἁπλότης는 ‘단순함/성실함’, ἀκακία는 ‘순전함’이 ‘guilelessness’에 가깝고, σεμνότης는 ‘품위’가 가장 간결하게 핵심을 담습니다.
- source_word: διὰ τὸ ἔλεος τοῦ Κυρίου
  english_pob_choice: through the mercy of the Lord
  chosen_korean: 주님의 긍휼을 통해
  alternatives_korean:
  - 주님의 자비로
  - 주님의 긍휼로 말미암아
  lexicon: BDAG
  rationale: διά + 대격의 매개/원인 관계를 자연스럽게 살렸고, ἔλεος는 문맥상 ‘긍휼’이 가장 적절합니다.
- source_word: στάξαντος τὴν δικαιοσύνην
  english_pob_choice: who caused righteousness to drip upon you
  chosen_korean: 여러분 위에 의를 떨어지게 하셨습니다
  alternatives_korean:
  - 여러분 위에 의를 떨어뜨리게 하셨습니다
  - 여러분 위에 의를 뚝뚝 떨어지게 하셨습니다
  lexicon: LSJ/BDAG
  rationale: στάζω의 ‘방울져 떨어지다’ 이미지를 유지하되, 한국어로는 과도한 직역보다 ‘떨어지게 하셨습니다’가 문맥상 자연스럽습니다.
- source_word: δικαιωθῆτε
  english_pob_choice: be made righteous
  chosen_korean: 의롭게 되도록 하셨습니다
  alternatives_korean:
  - 의롭다 하심을 받도록 하셨습니다
  - 의롭게 되게 하셨습니다
  lexicon: BDAG
  rationale: POB의 해석처럼 형식적 법정 선언보다 의의 부여/형성의 뉘앙스를 살려 ‘의롭게 되다’로 옮겼습니다.
theological_decisions:
- issue: 'δικαιωθῆτε의 해석: 선언적 vs. 형성적 의미'
  chosen_reading: ‘의롭게 되다’로 번역해, 의가 주어져 삶이 변화되는 방향을 드러냈습니다.
  alternative_readings:
  - ‘의롭다 하심을 받다’로 번역하는 법정적 읽기
  rationale: 앞선 ‘의를 떨어지게 하다’라는 이미지가 내재적/전달적 의미를 강하게 시사하므로, 단순한 선언보다 의의 부여를 더 잘 반영합니다.
  doctrine_reference: Hermas 문맥의 도덕적·형성적 의롭다 함 이해
- issue: 화자 인칭과 호칭
  chosen_reading: 화자는 자녀들을 훈육하는 부모적/회중적 목소리로 읽었습니다.
  alternative_readings:
  - 하나님께서 직접 말씀하시는 것으로 읽기
  rationale: ‘주님의 긍휼’을 매개로 하면서 자신이 자녀들을 ‘길렀다’고 말하는 구조는, 본문 내 화자를 주님과 구별된 교육적 목소리로 읽는 것이 자연스럽습니다.
  doctrine_reference: Vision 3의 담화 상황
