  terminology: ἁγνεία는 ‘순결’, σεμνότης는 ‘품위’로 옮겼습니다. ἄφεσις는 문맥상 ‘용서’로, ἐντολαί는 ‘계명’으로 일관되게 옮겼습니다. 재혼 허용과 독신의 더 큰 명예라는 본문의 비교를 유지하되 교리적 해석은 덧붙이지 않았습니다.
