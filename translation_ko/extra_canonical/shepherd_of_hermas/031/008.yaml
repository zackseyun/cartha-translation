revisions:
- from: “그는 죄를 짓지 않는다”고 그는 말합니다. “그러나 혼자 살면 주 앞에서 더 큰 존귀와 큰 영광을 얻고 장가가면 죄를 짓지 아니하느니라 그러므로 순결과 단정함을 지키라 그리하면 너희가 하나님께 대하여 살리라 내가 너희에게 말하고 말하는 이 일을 이제부터 네가 내게 부탁한 날부터 내가 네 집에 거하리라 네가 나의 계명을 지키면 모든 사람이 사함을 얻으리라 네가 나의 계명을 지키면 모든 사람이 사함을 얻으리라 나의 계명을 지키고 이 순결함 가운데 행하라.”
  to: “그가 말했습니다. ‘그는 죄를 짓지 않습니다. 그러나 누가 혼자 지내면, 그는 주님 앞에서 자신을 위해 더 큰 존귀와 큰 영광을 얻습니다. 그러나 그가 다시 혼인해도 죄를 짓지 않습니다. 그러므로 순결과 품위를 지키십시오. 그러면 하나님을 위해 살 것입니다. 내가 당신에게 말하는 것과 앞으로 말할 것을, 당신이 내게 맡겨진 날부터 이제부터 지키십시오. 그러면 내가 당신의 집에 거하겠습니다. 당신이 내 계명을 지키면, 당신의 이전 범죄들은 용서받을 것입니다. 또 모든 사람도 이 내 계명들을 지키고 이 순결 가운데서 행하면 용서받을 것입니다.’”
  rationale: 영어 POB 감사본이 다루는 범위에 맞추어, 원문의 재혼과 독신에 관한 진술, 순결과 품위의 권면, 단수·복수의 조건문, 그리고 용서의 두 진술을 모두 복원했습니다. ‘하나님을 위해 살 것입니다’는 τῷ Θεῷ의 목적·관계 의미를 자연스러운 현대 한국어로 유지한 번역입니다.
