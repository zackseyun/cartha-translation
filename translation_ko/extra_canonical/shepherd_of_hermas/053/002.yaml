  to: “이제 들으십시오. 여러분의 이 육체를 정결하고 더럽혀지지 않게 지키십시오. 그러면 그 안에 거하시는 영이 그 육체를 위하여 증언하게 되어, 여러분의 육체가 의롭다고 인정받게 될 것입니다. 이 육체가 썩어질 것이라는 생각이 여러분의 마음에 일어나, 여러분이 그것을 어떤 더러움에 오용하지 않도록 조심하십시오. 여러분의 육체를 더럽히면 성령도 더럽히게 됩니다. 또 육체를 더럽히면 살지 못할 것입니다.”
  rationale: 원문의 단수 خطاب은 한국어 현대 공식 문체에서 자연스러운 일반 권면 표현인 ‘여러분’으로 일관되게 옮겼습니다. 조건·결과 관계, 영이 육체를 위하여 증언한다는 지시 관계, 그리고 마지막 생명 상실의 경고를 분명히 했습니다. 본문에 원문상 확정적으로 표기된 ‘성령’을 유지하되 추가 신학 해석은 넣지 않았습니다.
