review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 경고와 성령 언급을 담고 있으나, 단수 소유격을 복수 ‘너희’로 바꾸었고, ‘증거하여’의 대상 및 조건·결과의 문장 구조가 불분명합니다. 또한 ‘어떤 더러운 데에 쓰나니’는 원문의 조건절(‘어떤 더러움에 그것을 오용하지 않도록’)을 정확히 반영하지 못합니다.
  naturalness: 현대 표준 한국어 합쇼체로는 ‘들으라’, ‘깨어라’, ‘살지 못하리라’가 고풍스럽고, 쉼표 없이 이어진 긴 문장이 읽기 어렵습니다. 문장을 나누고 현대적인 존대 명령형으로 정리하는 것이 자연스럽습니다.
  terminology: σάρξ은 문맥상 ‘육체’, πνεῦμα은 ‘영’, τὸ πνεῦμα τὸ ἅγιον은 ‘성령’으로 옮기는 것이 적절합니다. ‘의롭다 함을 얻다’는 δικαιωθῇ의 수동 의미를 살릴 수 있으나, 여기서는 ‘의롭다고 인정받게’가 현대어로 더 명료합니다.
  issues:
  - severity: high
    issue: 단수 خطاب을 복수로 변경함
    rationale: 원문은 ‘네 육체’(τὴν σάρκα σου), ‘네 마음’(τὴν καρδίαν σου)으로 일관되게 단수입니다. 초안의 ‘너희’는 원문의 대상을 변경합니다.
  - severity: high
    issue: ‘어떤 더러운 데에 쓰나니’가 원문의 경고·조건 구조를 흐림
    rationale: βλέπε μήποτε ... καὶ παραχρήσῃ는 ‘그런 생각이 마음에 일어나 어떤 더러움에 육체를 오용하지 않도록 조심하십시오’라는 경고입니다. 초안은 서술형 연결로 바꾸어 의미 관계가 불명료합니다.
  - severity: medium
    issue: 현대 합쇼체 및 문장 분절 미흡
    rationale: 초안은 고어체 종결과 과도하게 긴 무구두점 문장으로 되어 있어 지정된 현대 공식 존대 문체에 맞지 않습니다.
  - severity: medium
    issue: ‘그 가운데 거하는 영’과 ‘이를 증거하여’의 지시 대상이 모호함
    rationale: ἐν αὐτῇ와 αὐτῇ는 육체를 가리킵니다. ‘그 육체 안에 거하시는 영이 그 육체를 위하여 증언하게’로 밝혀야 합니다.
