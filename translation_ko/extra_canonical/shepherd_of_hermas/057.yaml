  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Are then, Lord, those who indulge and are deceived tormented for the same amount of time as the time of the deceit? It is one hour, but the hour of the torment has the force of thirty days. Therefore, if someone indulges for one day and is deceived, and is tormented for one day, the day of torment is equivalent to a whole year. So then, as many days as a person indulges, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very small, but the time of punishment and torment is great."
translation:
  language: ko
  text: 내가 그에게 말했습니다. 「주님, 이것을 더 자세히 제게 알려 주십시오」. 그가 말했습니다. 「무엇을 찾고 있느냐?」 내가 말했습니다. 「그러면, 주님, 쾌락을 누리고 속는 사람들은 속임의 시간과 같은 기간 동안 형벌을 받습니까? 속임의 시간은 한 시간이지만, 고통의 시간은 서른 날의 힘을 지니고 있습니다. 그러므로 어떤 사람이 하루 동안 쾌락을 누리고 속아 넘어간 뒤, 하루 동안 고통을 받는다면, 고통의 날은 한 해 전체에 해당합니다. 그러니 사람이 쾌락을 누리는 날수만큼, 그만큼의 해 동안 고통을 받습니다」. 그가 말했습니다. 「그러므로 너는 쾌락과 속임의 시간은 매우 짧고, 벌과 고통의 시간은 매우 길다는 것을 보게 된다」.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶντες / τρυφήσῃ
  english_pob_choice: indulge / indulges himself
  chosen_korean: 쾌락을 누리다 / 쾌락을 누리다
  alternatives_korean:
  - 사치하다
  - 방탕하다
  - 향락을 즐기다
  lexicon: τρυφάω
  rationale: POB의 ‘indulge’가 단순한 ‘즐기다’보다 도덕적 자기방임과 쾌락 추구를 함께 담으므로, 현대 한국어에서 의미를 비교적 직접적으로 드러내는 ‘쾌락을 누리다’를 택했습니다.
- source_word: ἀπατώμενοι / ἀπάτης
  english_pob_choice: are deceived / deceit
  chosen_korean: 속다 / 속임
  alternatives_korean:
  - 기만당하다 / 기만
  - 미혹되다 / 미혹
  - 속임수
  lexicon: ἀπατάω
  rationale: 행위의 수동성과 도덕적 기만성을 살리기 위해 동사는 ‘속다’, 명사는 ‘속임’으로 옮겼습니다. POB가 ‘deceit’를 유지한 점도 반영했습니다.
- source_word: βασανίζονται / βασάνου / βασανισθῇ / βασανίζεται
  english_pob_choice: tormented / torment
  chosen_korean: 고통을 받다 / 고통
  alternatives_korean:
  - 고문을 당하다 / 고문
  - 괴로움을 당하다 / 괴로움
  - 형벌을 받다
  lexicon: βασανίζω
  rationale: βασανίζω의 본래 강한 ‘고문/가혹한 고통’ 뉘앙스를 살리되, 한국어에서 본문 전체의 비유적·교훈적 문맥에 맞게 지나치게 형법적으로 좁아지지 않도록 ‘고통’을 기본어로 택했습니다.
- source_word: τιμωρίας
  english_pob_choice: punishment
  chosen_korean: 벌
  alternatives_korean:
  - 형벌
  - 징벌
  - 처벌
  lexicon: τιμωρία
  rationale: 본문 후반의 대조를 살리기 위해 ‘punishment’는 비교적 직역적인 ‘벌’로 두어, 앞의 ‘고통’과 어감 차이를 분명하게 했습니다.
theological_decisions:
- issue: 문학적·교훈적 경고에서의 형벌-고통 대비
  chosen_reading: 본문의 초점은 속임의 짧음과 벌/고통의 길이를 대조하여 도덕적 경고를 강화하는 데 있으므로, 강도를 약화시키지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 교훈적 권면으로 완화하여 ‘괴로움’ 정도로 낮추는 번역
  - 법정적 어조를 강하게 하여 ‘형벌’로 일괄하는 번역
  rationale: 그리스어가 분명히 두 계열의 낱말(τιμωρία / βασανίζω)을 병치하므로, 의미 차이를 보존하는 것이 본문 이해에 중요합니다.
  doctrine_reference: lexical distinction preservation
