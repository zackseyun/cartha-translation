revisions:
- from: “내가 첫 계명에서 믿음과 두려움과 절제를 지키라 명하였느니라”고 말씀하셨습니다. “예, 주님.” 내가 말합니다. “이제 나도 그들의 능력을 너희에게 알게 하여 각각의 능력과 활동이 무엇인지 알게 하려 하노라 그들의 일이 이중이라 의인과 불의한 자를 다스리느니라 그러므로 너희가 의인을 신뢰하고 불의한 자를 믿지 말라 공의의 길은 곧고 불의의 길은 굽은 길이라 오직 너희는 곧은 길로 가고 굽은 길을 떠나라.
  to: '그가 말씀하셨습니다. “내가 첫째 계명에서 네게 믿음과 두려움과 절제를 지키라고 명령하였다.”


    내가 말했습니다. “예, 주님.”


    그가 말씀하셨습니다. “그러나 이제 나는 그것들의 능력도 네게 밝혀 주어, 그것들 각각이 어떤 능력과 활동을 지니는지 네가 깨닫게 하고자 한다. 그것들의 활동은 두 갈래이므로, 의로운 자와 불의한 자 위에 놓여 있다. 그러므로 너는 의로운 자를 믿고 불의한 자는 믿지 말아라. 의로움은 곧은 길을 지니지만, 불의는 굽은 길을 지니기 때문이다. 그러나 너는 곧고[a] 평탄한 길로 가고, 굽은 길은 버려라.”'
  rationale: 단수 청자와 논리 구조를 원문에 맞게 복원하고, ‘능력’과 ‘활동’의 병렬을 유지했습니다. κεῖνται ἐπὶ의 다소 넓은 표현은 특정 교리적 해석을 덧붙이지 않고 ‘위에 놓여 있다’로 직역에 가깝게 보존했습니다. 현대 합쇼체의 서술 및 직접 화법으로 다듬었으며, 대괄호 이문에는 각주 표지를 달았습니다.
