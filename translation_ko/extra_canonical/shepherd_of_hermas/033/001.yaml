review_pass:
  verdict: revise
  source_fidelity: 초안은 단수 청자(σοι)를 복수인 ‘너희’로 바꾸고, ‘그들의 활동은 두 갈래’ 및 ‘의인과 불의한 자 위에 놓여 있다’라는 논리 연결을 부정확하게 옮겼습니다. 또한 ‘각각이 지닌 능력과 활동’을 ‘각각의 능력과 활동이 무엇인지’로 바꾸어 원문의 관계를 흐렸습니다. 대괄호 속 ‘그리고 평탄한’은 본문 이문 표지로 보존해야 합니다.
  naturalness: 직접 화법과 서술 화법을 현대 한국어 합쇼체로 정리하고, 누락된 문장부호와 접속 관계를 복원했습니다.
  terminology: πίστις, φόβος, ἐγκράτεια를 각각 ‘믿음’, ‘두려움’, ‘절제’로 유지했습니다. δίκαιος/ἄδικος는 이 대목에서 인격화된 두 천사와 혼동되지 않도록 ‘의로운 자/불의한 자’로 옮겼고, δικαιοσύνη/ἀδικία는 ‘의로움/불의’로 구별했습니다.
  issues:
  - severity: high
    issue: 청자의 수가 단수에서 복수로 변경됨
    rationale: 원문은 전 구간에서 σοι 및 σύ를 사용하여 헤르마스 한 사람에게 말합니다. ‘너희’는 원문의 문법적 대상을 변경합니다.
  - severity: high
    issue: ‘그들의 활동은 두 갈래’ 및 ‘의로운 자와 불의한 자 위에 놓여 있다’의 의미가 부정확함
    rationale: διπλαῖ ... αἱ ἐνέργειαι αὐτῶν 및 κεῖνται οὖν ἐπὶ δικαίῳ καὶ ἀδίκῳ를 ‘그들의 일이 이중이라 의인과 불의한 자를 다스리느니라’로 옮긴 것은 활동의 성격과 적용 범위를 각각 변질합니다.
  - severity: medium
    issue: 대괄호 이문 누락
    rationale: καὶ ὁμαλῇ는 제시된 원문에서 대괄호로 표시되어 있으므로, 독자가 본문상 불확실성을 알 수 있게 표지해야 합니다.
  - severity: medium
    issue: 현대 합쇼체 및 인용 구조 미흡
    rationale: ‘하였느니라’, ‘하노라’는 요청된 현대 formal-polite 합쇼체와 맞지 않으며, 인용문 사이의 문장 경계도 불명확합니다.
