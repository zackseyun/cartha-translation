revisions:
- from: 그러므로 너희가 그의 일을 알거든 그에게서 떠나고 그를 신뢰하지 말라. 그의 일은 사악하고 하나님의 종들에게 해로우니라. 그러므로 당신은 두 천사의 활동을 모두 가지고 있습니다. 그들을 이해하고 의의 천사를 신뢰하십시오. 그러나 악의 천사에게서 물러가라. 그의 가르침은 모든 일에서 악하기 때문이다. 만일 어떤 사람이 충실한 사람인데, 이 천사에 대한 생각이 그 마음에 떠오르면, 그 남자나 여자는 틀림없이 죄를 범할 것입니다. 그러나 만일 어떤 남자나 여자가 또 심히 악하여 그 마음에 의의 사자의 역사가 일어나면 그 사람은 반드시 선한 일을 행할 것이니라 그러면 당신도 알다시피 의의 천사를 따르고 악의 천사를 버리는 것이 좋다는 것입니다. 믿음에 관하여는 이 계명이 명백히 나타내었으니 곧 의의 사자가 행한 일을 믿고 행한 후에 하나님을 위하여 살찌니라. 그러나 악한 천사의 행위는 고통스럽다는 것을 믿으십시오. 그러므로 그것을 행하지 아니하면 너희가 하나님을 위하여 살리라.”
