  - 환한 마음 / 환한
  lexicon: LSJ; BDAG
  rationale: 문맥상 단순한 감정이 아니라 اخلاق적이고 지속적인 밝은 태도를 가리키므로 ‘기쁨/기쁜’이 가장 무난합니다. 다만 본문 전체의 슬픔과의 대비를 살려 과도한 감정어는 피했습니다.
- source_word: εὐπρόσδεκτον
  english_pob_choice: welcome / acceptable
  chosen_korean: 기꺼이 받아들여지는
  alternatives_korean:
  - 받아들여지는
  - 기쁘게 받아들여지는
  - 기뻐하는
  lexicon: BDAG
  rationale: 하나님께 대한 수용성을 나타내므로 ‘기꺼이 받아들여지는’이 관계적 뉘앙스를 살리면서도 자연스럽습니다.
- source_word: λύπη / λυπηρὸς
  english_pob_choice: sorrow / sorrowful
  chosen_korean: 슬픔 / 슬퍼하는
  alternatives_korean:
  - 근심 / 근심하는
  - 비통 / 비통한
  - 우울 / 우울한
  lexicon: BDAG
  rationale: 이 단락의 대조축은 기쁨-슬픔이며, ‘슬픔’이 가장 직설적으로 반복과 대비를 살립니다.
- source_word: ἔντευξις / ἐντυγχάνω
  english_pob_choice: prayer / praying
  chosen_korean: 기도 / 기도하다
  alternatives_korean:
