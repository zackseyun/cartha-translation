base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039.yaml
  text: 'Clothe yourself[a], then, with cheerfulness, which always has favor with God and is welcome to him, and delight yourself in it. For every cheerful man does good, thinks what is good, and despises sorrow.


    But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being—a cheerful Spirit; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.


    “Why,” I ask, “does the prayer of the one who is sorrowing not ascend to the altar?” “Because,” he says, “sorrow has settled in his heart[b]. Therefore sorrow, mixed with the prayer, does not allow the prayer to ascend pure to the altar. For just as vinegar and wine, mixed together, do not have the same pleasure, so also sorrow, mixed with the Holy Spirit, does not have the same prayer.”


    Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God[d][c], as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.'
  footnotes:
  - marker: a
    text: 'Greek idiom ἐπὶ τὸ αὐτό: “together, in one (place/vessel).” Literally, “to the same [place].”'
    reason: lexical_alternative
  - marker: b
    text: The word for “prayer” here is ἔντευξις, a petitionary approach; the verb ἐντυγχάνω (“to make petition”) occurs in the same sentence.
    reason: lexical_alternative
  - marker: c
    text: The phrase describes the Holy Spirit as cheerful, in contrast to the sorrow that grieves him (cf. the thematic contrast throughout this mandate).
    reason: cultural_note
  - marker: d
    text: “Live to God” renders the dative (τῷ θεῷ) literally; many would say “live for God.”
    reason: lexical_alternative
translation:
  language: ko
  text: '그러므로 기쁨을 입으십시오. 그것은 항상 하나님께 은혜를 입고 그분께 기꺼이 받아들여지는 것이니, 그 안에서 즐거워하십시오. 기쁜 사람마다 선한 일을 하고, 선한 것을 생각하며, 슬픔을 업신여깁니다.


    그러나 슬퍼하는 사람은 언제나 악을 행합니다. 첫째로, 인간에게 주어진 그 성령—기쁜 성령—을 슬프게 하므로 악을 행합니다. 둘째로, 성령을 슬프게 함으로써 불법을 행하며, 주님께 기도하지도 않고 고백하지도 않습니다. 슬퍼하는 사람의 기도는 결코 하나님의 제단으로 올라갈 힘이 없습니다.


    “왜,” 내가 말했습니다, “슬퍼하는 사람의 기도는 제단으로 올라가지 않습니까?” “그것은,” 그가 말했습니다, “슬픔이 그의 마음에 자리 잡고 있기 때문입니다. 그러므로 슬픔이 기도와 섞이면 그 기도가 깨끗하게 제단으로 올라가는 것을 허락하지 않습니다. 마치 식초와 포도주가 함께 섞여도 같은 기쁨을 내지 못하는 것처럼, 슬픔이 성령과 섞여도 같은 기도를 내지 못합니다.”


    그러므로 이 악한 슬픔에서 자신을 깨끗하게 하십시오. 그러면 당신은 하나님께 살게 될 것입니다. 그리고 자기에게서 슬픔을 벗어 버리고 온전히 기쁨을 입는 모든 사람도 하나님께 살게 될 것입니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
