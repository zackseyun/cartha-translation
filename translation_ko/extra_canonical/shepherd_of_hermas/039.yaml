  - 청원 / 청원하다
  - 중보 / 중보하다
  lexicon: BDAG
  rationale: 문맥은 제단으로 올라가는 청원적 기도를 가리키지만, 한국어에서는 ‘기도’가 가장 넓고 자연스럽습니다. 반복되는 동사는 그대로 ‘기도하다’로 옮겼습니다.
theological_decisions:
- issue: 성령에 대한 ‘기쁜 성령’의 수식 관계
  chosen_reading: τὸ πνεῦμα τὸ ἅγιον … ἱλαρόν을 ‘그 성령—기쁜 성령—’으로 옮겨, ἱλαρόν이 성령의 성격을 수식한다는 읽기를 반영했습니다.
  alternative_readings:
  - ‘기쁘게 주어진 성령’으로 읽기
  - 인간의 영을 가리키는 것으로 읽기
  rationale: 원문의 관사-명사-관사-형용사 배열과 POB의 문맥 판단을 따라, 슬픔과 대비되는 성령의 성향을 드러내는 번역이 가장 적절합니다.
  doctrine_reference: Mandate 10의 반복되는 윤리적 대조와 성령의 슬픔이라는 표현
- issue: ‘하나님께 살게 될 것입니다’의 조사 처리
  chosen_reading: τῷ θεῷ를 직역하여 ‘하나님께 살게 될 것입니다’로 유지했습니다.
  alternative_readings:
  - 하나님을 위하여 살게 될 것입니다
  - 하나님 앞에서 살게 될 것입니다
  rationale: 초점은 목적격화된 신학적 매끄러움보다 원문의 여격 구조가 주는 직접성을 살리는 데 있습니다.
  doctrine_reference: 원문 여격의 보존 원칙
