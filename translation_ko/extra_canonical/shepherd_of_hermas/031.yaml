base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031.yaml
  text: '“Still,” I say[1], “sir, I will add another question.”


    “Speak,” he says.


    “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”[1][2]


    He says to me, “You heard well; for so it is. For the one who has received forgiveness—”[3]


    “Bear with me,” I say, “and make this clear to me also.”


    “Speak,” he says.


    “If a woman,” I say, “sir, or again some man, should fall asleep, and one of them marries[2], does the one who marries sin?”[4]


    “He does not sin,” he says; “but if someone remains by himself,[5] he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep chastity and modesty, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all[8][6][5][4][3], if they keep these commandments of mine and walk in this purity.”[6][8]'
  footnotes:
  - marker: '1'
    text: “Repentance” here refers to the decisive turning associated with baptism, the release of former sins.
    reason: cultural_note
  - marker: '2'
    text: “We went down into the water” is early Christian language for baptism without naming it explicitly (cf. Didache 7).
    reason: cultural_note
  - marker: '3'
    text: The Greek is abrupt here (“For the one who has received forgiveness—”); many editors assume an interruption at this point.
    reason: textual_variant
  - marker: '4'
    text: “Fall asleep” is a common early Christian euphemism for dying.
    reason: cultural_note
  - marker: '5'
    text: Or, more literally, “remains by himself/alone.”
    reason: lexical_alternative
  - marker: '6'
    text: “Chastity” could also be rendered “purity,” but the context favors sexual continence; “modesty” translates σεμνότης, moral gravity of comportment.
    reason: lexical_alternative
  - marker: '8'
    text: “Forgiveness” translates ἄφεσις; “remission” is a traditional alternative emphasizing release.
    reason: lexical_alternative
translation:
  language: ko
  text: '“아직도,” 내가 말했습니다, “주인님, 하나 더 묻겠습니다.”


    그가 말했습니다. “말해 보아라.”


    “제가 들은 바에 따르면,” 내가 말했습니다, “주인님, 어떤 교사들에게서, 물속으로 내려가서 우리의 이전 죄를 용서받은 그때 외에는 다른 회개는 없다고 합니다.”


    그가 내게 말했습니다. “잘 들었다. 사실이 바로 그러하다. 용서를 받은 사람은—”


    “부디 제 말을 참아 주시고, 이것도 제게 분명히 알려 주십시오.”


    그가 말했습니다. “말해 보아라.”


    “만일 어떤 여자가,” 내가 말했습니다, “주인님, 또는 다시 어떤 남자가 잠들고, 그들 가운데 하나가 혼인하면, 혼인하는 사람이 죄를 짓습니까?”


    그가 말했습니다. “그는 죄를 짓지 않는다. 그러나 어떤 사람이 자기 홀로 남아 있으면, 그는 주님 앞에서 더 큰 존귀와 큰 영광을 자신을 위해 얻습니다. 그러나 그가 또 혼인하더라도 죄를 짓지 않습니다. 그러므로 정결과 단정함을 지키십시오. 그러면 당신은 하나님께로 살게 될 것입니다. 내가 당신에게 말하고 또 앞으로 말하려는 이 일들을, 당신이 내게 맡겨진 날부터 지금부터 지키십시오. 그러면 내가 당신의 집에 머물겠습니다. 그리고 당신의 이전 잘못들에는 용서가 있을 것입니다. 당신이 내 계명들을 지키면 말입니다. 또한 모든 이에게도 용서가 있을 것입니다. 그들이 이 내 계명들을 지키고 이 정결함 안에서 걸어간다면 말입니다.”[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  english_pob_choice: sir
  chosen_korean: 주인님
  alternatives_korean:
  - 주님
  - 선생님
  lexicon: BDAG; LSJ
  rationale: 이 발화는 신적 호칭이 아니라 천사적 목자에 대한 존칭이므로, 한국어에서는 대화체의 예스러운 존대인 ‘주인님’으로 옮겨 κύριος의 경의적 용법을 살렸습니다.
- source_word: ἑτέρα μετάνοια
  english_pob_choice: repentance
  chosen_korean: 회개
  alternatives_korean:
  - 변화
  - 돌이킴
  lexicon: BDAG; LSJ
  rationale: 이 문맥의 μετάνοια는 죄 사함과 세례적 정결에 묶인 종교적 용어이므로, 기술적·교회적 뉘앙스를 보존하는 ‘회개’가 가장 적절합니다.
- source_word: εἰς ὕδωρ κατέβημεν
  english_pob_choice: we went down into the water
  chosen_korean: 물속으로 내려가서
  alternatives_korean:
  - 물로 들어가서
  - 물에 내려가서
  lexicon: BDAG; LSJ
  rationale: 세례를 직접 명명하지 않으면서 초기 기독교의 물로 ‘내려감’ 이미지를 살리기 위해 직역에 가깝게 옮겼습니다.
- source_word: ἄφεσιν ἁμαρτιῶν
  english_pob_choice: forgiveness of our former sins
  chosen_korean: 우리의 이전 죄를 용서받은
  alternatives_korean:
  - 우리의 이전 죄 사함을 받은
  - 우리의 옛 죄가 사면된
  lexicon: BDAG; LSJ
  rationale: ἄφεσις의 핵심을 ‘용서’로 자연스럽게 풀되, ‘이전 죄’라는 범위를 유지해 세례 전 죄의 해방을 드러냈습니다.
- source_word: ἁγνεία
  english_pob_choice: chastity
  chosen_korean: 정결
  alternatives_korean:
  - 순결
  - 깨끗함
  lexicon: BDAG; LSJ
  rationale: 이 단락은 재혼 논의 속 성적 절제의 권면이므로, ‘정결’로 옮겨 도덕적·성윤리적 초점을 보존했습니다.
- source_word: σεμνότης
  english_pob_choice: modesty
  chosen_korean: 단정함
  alternatives_korean:
  - 품위
  - 경건한 태도
  lexicon: BDAG; LSJ
  rationale: σεμνότης는 외적 행동의 품위와 엄숙함을 가리키므로, 한국어에서는 행실의 절도를 드러내는 ‘단정함’이 가장 자연스럽습니다.
- source_word: ἐφ' ἑαυτῷ μείνῃ
  english_pob_choice: remains by himself
  chosen_korean: 자기 홀로 남아 있으면
  alternatives_korean:
  - 혼자 남아 있으면
  - 독신으로 지내면
  lexicon: BDAG; LSJ
  rationale: 문자적으로는 ‘자기 자신 위에/안에 머무르다’의 뉘앙스가 있어, 재혼하지 않고 홀로 남는 상태를 보존하는 표현으로 옮겼습니다.
- source_word: παρεδόθης
  english_pob_choice: were entrusted (to me)
  chosen_korean: 내게 맡겨진
  alternatives_korean:
  - 내게 넘겨진
  - 내게 전해진
  lexicon: BDAG; LSJ
  rationale: 단순한 전달보다 보호·관리의 뉘앙스가 있어, 목자의 돌봄에 ‘맡겨짐’을 드러내는 표현을 택했습니다.
- source_word: προτέροις σου παραπτώμασιν
  english_pob_choice: your former trespasses
  chosen_korean: 당신의 이전 잘못들
  alternatives_korean:
  - 당신의 옛 허물들
  - 당신의 전의 범죄들
  lexicon: BDAG; LSJ
  rationale: παραπτώματα는 고의적 반역보다 도덕적 실족을 가리키므로, 일반적이면서도 책임을 흐리지 않는 ‘잘못들’로 옮겼습니다.
- source_word: ἐντολάς μου
  english_pob_choice: my commandments
  chosen_korean: 내 계명들
  alternatives_korean:
  - 내 명령들
  - 내 지시들
  lexicon: BDAG; LSJ
  rationale: 규범적 권위를 지닌 복수 명령이므로, 한국어 성서 문맥에서 익숙하면서도 강한 ‘계명’이 적합합니다.
theological_decisions:
- issue: ‘다른 회개가 없다’는 진술과 세례적 용례
  chosen_reading: 이 문장을 세례 때의 죄 사함과 연결된 निर्ण정적 회개로 직접 번역하되, 후대적 조정 없이 본문이 말하는 유일성을 드러냈습니다.
  alternative_readings:
  - 모든 이후 회개를 부정하는 뜻으로 완화하기
  - 단지 마음가짐의 변화로 축소하기
  rationale: 직후에 그 진술을 “잘 들었다. 사실이 바로 그러하다”라고 즉시 확증하므로, 본문 내부의 강한 단정성을 그대로 반영하는 것이 타당합니다.
  doctrine_reference: Shepherd of Hermas 4.iii의 세례/회개 이해
- issue: 재혼 허용과 독신 권면
  chosen_reading: 재혼은 죄가 아니지만, 홀로 남아 있는 것은 더 큰 존귀와 영광을 얻는 것으로 번역해 허용과 권면을 함께 보존했습니다.
  alternative_readings:
  - 재혼을 사실상 금지로 읽기
  - 독신을 단순한 선호로 약화하기
  rationale: 본문은 두 번 “죄를 짓지 않는다”라고 말하면서도 독신의 가치를 분명히 높이므로, 둘 중 어느 쪽도 지우지 않도록 유지해야 합니다.
  doctrine_reference: 혼인·절제에 대한 파라넷적 권면
