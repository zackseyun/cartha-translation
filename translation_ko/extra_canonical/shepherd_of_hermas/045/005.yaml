  terminology: θεοῦ δοῦλοι는 ‘하나님의 모든 종들’, διάβολος는 ‘마귀’, πίστει πλήρεις와 ἀπόκενοι의 대조는 ‘믿음이 충만한 사람들’과 ‘비어 있는 사람들’로 옮겨 비유의 표현을 보존했습니다. ὑπόδουλοι는 단순히 ‘종이 된다’보다 강한 ‘예속된다’로 옮겼습니다.
  issues:
