revisions:
- from: “이와 같이 마귀가 하나님의 모든 종에게 임하여 저희를 시험하나니 그러므로 믿음이 충만한 자들이 저를 강하게 대적하니 저가 저희를 떠나서 들어갈 곳이 없고 그 후에 빈 자들에게로 들어가서 거처를 얻어 저희 가운데 들어가서 자기의 뜻을 행하매 저희가 그에게 종이 되느니라.”
  to: “이와 같이 마귀는 하나님의 모든 종들에게 와서 그들을 시험합니다. 그러므로 믿음이 충만한 사람들은 그를 굳게 대적하고, 그는 들어갈 자리가 없어서 그들에게서 물러납니다. 그러면 그는 비어 있는 사람들에게 와서, 들어갈 자리를 얻어 그들 안으로 들어가며, 그들 안에서 자기가 원하는 것을 행합니다. 그래서 그들은 그에게 예속됩니다.”
  rationale: 현대 합쇼체로 문체를 정비하고, 원문의 ‘충만함/비어 있음’ 비유와 마귀가 접근하여 들어가 지배하는 순서를 보존했습니다. 교파적 해석을 덧붙이지 않았습니다.
