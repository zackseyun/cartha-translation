  source_fidelity: 초안은 본문의 전반적 비유와 논지를 따르지만, 원문의 현재적 서술과 논리적 연결을 더 정확히 드러낼 필요가 있습니다. 특히 διάβολος가 ‘빈 자들’에게 먼저 ‘찾아오고’, 들어갈 ‘자리’를 얻어 그들 안으로 들어간다는 흐름을 분명히 했습니다.
