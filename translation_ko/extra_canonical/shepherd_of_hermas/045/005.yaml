    rationale: 원문은 마귀가 빈 자들에게 와서, 들어갈 자리를 얻은 뒤 그들 안으로 들어간다고 단계적으로 서술합니다.
  - severity: low
    issue: ‘종이 되느니라’의 강도
    rationale: ὑπόδουλοι는 지배 아래 놓이는 의미를 강조하므로 ‘그에게 예속됩니다’가 더 가깝습니다.
