  terminology: θεός는 ‘하나님’, κύριος는 호칭 및 기도 대상인 ‘주님’, διάβολος는 ‘마귀’, ἐντολαί는 ‘계명’으로 일관되게 옮겼습니다. καταδυναστεύει는 이 문맥에서 ‘지배합니다’로 번역했습니다.
