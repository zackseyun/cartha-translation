revisions:
- from: “사람이여, 주님은 하나님의 계명을 지키기를 간절히 원하시며 그의 계명에 굳건함을 얻고 그 계명에 복종하기를 주께 구하지 아니하는 자가 없나니 마귀는 가혹하고 그들을 압제하느니라.”
  to: “한 사람이, 주님, 하나님의 계명들을 지키기를 열심히 원합니다. 또 주님께서 자신을 그분의 계명들 안에서 강하게 하시고 그 계명들에 복종하게 해 주시기를 주님께 구하지 않는 사람은 없습니다. 그러나 마귀는 가혹하여 그들을 지배합니다.”
  rationale: 영어 POB 감사본이 제시한 해당 발화 범위와 그리스어 문장 구조를 따라, 사람이 ‘계명을 지키기를 원하는’ 주어임을 복원했습니다. αὐτοῦ의 선행을 불필요하게 교리적으로 특정하지 않고 ‘그분의 계명들’로 처리했으며, 복수 계명에 맞추어 표현을 정리했습니다.
