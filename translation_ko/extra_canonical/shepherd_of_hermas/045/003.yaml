  english_pob_role: consult_only
status: reviewed
revisions:
- from: “그는 하나님의 종들, 곧 온 마음으로 그에게 바라는 자들을 압제할 수 없느니라. 마귀는 그들과 씨름할 수 있으나 그들을 이길 수는 없느니라. 그러므로 너희가 그를 대적하면 그는 치욕을 당하고 너희에게서 도망하리라. 그러나 공허한 자들은 마귀가 능력 있는 것처럼 마귀를 두려워한다.
  to: “그분께 온 마음을 다해 소망을 두는 하나님의 종들을 마귀는 압제할 수 없습니다. 마귀는 그들과 맞서 싸울 수는 있으나 그들을 이길 수는 없습니다. 그러므로 여러분이 그를 대적하면, 그는 패하여 수치를 당하고 여러분에게서 도망할 것입니다. 그러나 비어 있는 이들은 마귀가 능력이 있는 자인 양 두려워합니다.”
  rationale: Modernized the register to 합쇼체, closed the quotation, improved idiomatic Korean, and retained the Greek contrast between the devil's ability to oppose and his inability to overcome. '비어 있는 이들' preserves the deliberately metaphorical and initially unexplained ἀπόκενοι without importing an interpretive doctrine.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft faithfully represents the supplied English audit trail and the Greek of source paragraph 2: the devil cannot dominate wholehearted servants of God, can contend but not prevail, flees defeated when resisted, and is feared by those who are ''empty.'' ''공허한 자들'' is semantically possible for ἀπόκενοι, but less natural than ''비어 있는 이들'' in this metaphorical context.'
  naturalness: The draft uses archaic biblical declarative endings ('-느니라,' '-하리라'), whereas the requested target register is modern formal-polite 합쇼체. The opening quotation mark is also not closed. A more idiomatic rendering of the final comparison is needed.
  terminology: '''하나님의 종들,'' ''마귀,'' and ''대적하다'' are appropriate. ''온 마음으로 그에게 바라는'' is understandable, but ''온 마음을 다해 그분께 소망을 두는'' more directly and naturally conveys ἐξ ὅλης καρδίας ἐλπιζόντων ἐπ’ αὐτόν. ''능력 있는 것처럼'' should be recast as ''능력이 있는 자인 양'' to preserve the comparative force.'
  issues:
  - severity: medium
    issue: Register does not follow the requested modern formal-polite 합쇼체.
    rationale: The repeated archaic endings '-느니라' and '-하리라' should be modernized to '-습니다' forms.
  - severity: low
    issue: The quotation mark is unclosed.
    rationale: The translation begins with an opening quotation mark but lacks a closing quotation mark.
  - severity: low
    issue: The final clause is awkwardly phrased in Korean.
    rationale: '''마귀가 능력 있는 것처럼 마귀를 두려워한다'' repeats ''마귀'' and does not naturally express ὡς δύναμιν ἔχοντα (''as though he had power'').'
