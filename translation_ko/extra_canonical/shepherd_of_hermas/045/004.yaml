revisions:
- from: “사람이 심히 많은 질그릇에 좋은 포도주를 채우고 그 중에 빈 그릇이 몇 개 있으면, 그 항아리에 가서는 그 그릇이 가득한 줄을 알므로 그 그릇을 살펴보지 아니하고 빈 항아리를 살펴보나니, 그것이 신맛이 날까 두려워함이라, 빈 항아리는 빨리 시큼하여 포도주의 맛을 잃어버리느니라.
  to: “사람이 아주 많은 질항아리를 좋은 포도주로 채우고, 그 항아리들 가운데 몇 개가 비어 있으면, 그는 그 항아리들에 다가가 가득 찬 것들은 살펴보지 않습니다. 그것들이 가득 찬 것을 알고 있기 때문입니다. 그러나 그는 빈 것들은 혹시 시어 버렸을까 염려하여 살펴봅니다. 빈 항아리들은 금세 시어 버리고, 포도주의 즐거움이 사라지기 때문입니다.”
