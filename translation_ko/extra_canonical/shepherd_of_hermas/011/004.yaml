revisions:
- from: 나는 그녀에게 "부인이여, 당신은 저를 단 한 번만이라도 제게 모든 것을 드러내기에 합당하다고 여기셨으니 그것을 밝혀 주십시오."라고 말합니다. 그녀는 나에게 "무엇이든지 당신에게 나타날 것이니 드러날 것입니다. 오직 마음을 하나님께로 향하고 무엇을 보든지 두 마음을 품지 마십시오"라고 말했습니다.
  to: 나는 그녀에게 말했습니다. “부인이여, 당신께서 한 번 나를 모든 것을 내게 드러내기에 합당하다고 여기셨으니, 드러내 주십시오.” 그러자 그녀가 나에게 말했습니다. “당신에게 드러날 수 있는 것은 무엇이든지 드러날 것입니다. 오직 당신의 마음을 하나님께 향하게 하고, 무엇을 보든지 두 마음을 품지 마십시오.”
  rationale: 원문의 단회성(ἅπαξ), ‘모든 것’(πάντα), 그리고 계시 가능성의 한정(ὃ ἐὰν ἐνδέχηται)을 명확히 반영했습니다. 직설적 권면의 문체와 διψυχήσῃς의 이미지를 유지하면서 현대 합쇼체와 일관된 과거 서술로 정리했습니다.
