revisions:
- from: 나는 그녀에게 "왜 물 위에 탑을 세웠습니까, 아가씨?"라고 물었습니다. 그녀는 “내가 전에도 말하였거니와 너희가 부지런히 구하면 진리를 찾게 되느니라 그러면 어찌하여 그 탑이 물 위에 건축되었는가 보라 너희 생명이 물로 말미암아 구원을 얻었으니 구원을 얻을 것임이니라 이 탑은 전능하고 영광스러운 이름의 말씀으로 세워졌고 보이지 않는 주의 능력으로 견고히 세워졌느니라”고 말합니다.
