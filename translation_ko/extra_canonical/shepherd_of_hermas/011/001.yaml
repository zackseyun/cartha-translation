  text: After showing me these things, she wanted to go away. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a cunning man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."
translation:
  language: ko
  text: 그녀는 나에게 이런 것들을 보여 주고 떠나려 하셨습니다. 나는 그녀에게 말씀드렸습니다. “부인이여, 이런 것들을 보고도 그 일들이 무엇인지 알지 못한다면 그것이 저에게 무슨 유익이 있겠습니까?” 그러자 그녀가 나에게 말씀하셨습니다. “당신은 탑에 관한 일들을 알고 싶어하는 꾀가 많은 사람이군요.” 내가 말씀드렸습니다. “그렇습니다, 부인이여. 제가 그것을 형제들에게 전하여, 그들이[a] 이것을 듣고 큰 영광 가운데서 주님을 알게 하려는 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 전승에서 ‘더 기뻐하고, 그들이’에 해당하는 구절이 불확실하게 전해집니다. 그리스어 본문은 이를 대괄호로 표시합니다.
    reason: 제공된 원문에서 ἱλαρώτεροι γένωνται, καὶ ταῦτα가 대괄호 처리되어 있으므로, 번역문이 이를 확정된 본문처럼 제시하지 않도록 표시합니다.
