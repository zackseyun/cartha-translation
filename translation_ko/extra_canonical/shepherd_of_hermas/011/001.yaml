    issue: 시제와 화자 표지가 혼재함
    rationale: 원문은 과거 서술 가운데 현재형 직접화법을 사용합니다. 초안의 ‘싶어했습니다/말합니다/대답했다’ 혼용은 한국어 서술 흐름을 어색하게 합니다.
  - severity: medium
    issue: 호칭이 ‘부인’에서 ‘아가씨’로 변경됨
    rationale: 두 차례의 Κυρία는 같은 인물에게 쓰인 동일한 존칭입니다. ‘아가씨’는 의미와 관계 설정을 바꿉니다.
  - severity: medium
    issue: Πανοῦργος의 번역이 과도하게 부정적임
    rationale: ‘교활한’은 악의적 기만의 뉘앙스가 강합니다. 여기서는 질문을 거듭하는 화자에 대한 핀잔이므로 ‘꾀가 많은’이 더 적절합니다.
  - severity: high
    issue: 대괄호로 전해진 본문 구절의 불확실성이 표시되지 않음
    rationale: '[ἱλαρώτεροι γένωνται, καὶ ταῦτα]는 제공된 그리스어 본문에서 대괄호 처리되어 있으므로, 번역에도 각주 앵커로 본문 상태를 밝혀야 합니다.'
