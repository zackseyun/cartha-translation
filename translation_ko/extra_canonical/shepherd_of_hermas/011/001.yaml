  source_fidelity: 원문의 화자 전환과 직접화법, 그리고 ‘탑에 관한 일들을 알고 싶어하는’이라는 책망의 어조가 초안에서 일부 유지되었으나, ἤθελεν ἀποτρέχειν(떠나려 하다), τί ἐστιν τὰ πράγματα(그 일들이 무엇인지), Πανοῦργος(꾀가 많은/약삭빠른) 등의 뜻과 시제가 충분히 반영되지 않았습니다. 또한 대괄호 안 구절은 본문상 불확실성이 있으므로 표시가 필요합니다.
  naturalness: 초안은 서술 시제가 ‘싶어했습니다/말합니다/대답했다’로 혼재하며, 호칭도 ‘부인이여’에서 ‘아가씨’로 바뀌어 자연스럽지 않고 원문의 일관성도 잃었습니다. 수정문은 현대 표준어 합쇼체의 서술 및 대화 형식으로 통일했습니다.
  terminology: κύρια는 이 문맥에서 존중의 호칭인 ‘부인’으로 일관되게 옮겼습니다. ἀδελφοί는 공동체 구성원을 가리키므로 ‘형제들’로, κύριος는 ‘주님’으로 유지했습니다. ‘교활한’은 한국어에서 도덕적으로 지나치게 부정적으로 들릴 수 있어 Πανοῦργος의 문맥상 핀잔 섞인 뜻을 살린 ‘꾀가 많은’으로 조정했습니다.
