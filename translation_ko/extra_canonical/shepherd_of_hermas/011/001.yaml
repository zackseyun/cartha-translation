revisions:
- from: 나에게 이런 것들을 보여준 후 그녀는 떠나고 싶어했습니다. 나는 그녀에게 "부인이여, 이런 일들을 보고도 그것이 무엇인지 알지 못하는 것이 나에게 무슨 유익이 있겠습니까?"라고 말합니다. 그녀는 나에게 대답했다. "당신은 탑에 관한 일을 알고 싶어하는 교활한 사람입니다." “그렇습니다, 아가씨, 내가 이 일을 형제들에게 전하고, 그들도 이 말을 듣고 더욱 기뻐하며 큰 영광 가운데 주님을 알게 되기를 바랍니다.”
