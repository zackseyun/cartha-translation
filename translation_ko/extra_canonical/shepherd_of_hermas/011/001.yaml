  rationale: 원문에 맞추어 떠나려는 행동, 질문의 내용, 탑에 관한 일을 알고자 한다는 책망, 형제들에게 전하려는 목적을 충실히 재구성했습니다. 존칭과 서술 시제를 일관되게 하고, 대괄호 처리된 전승상의 불확실성은 각주로 밝혔습니다.
