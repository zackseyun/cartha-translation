revisions:
- from: 이르되 많은 사람이 듣고 듣고 기뻐하는 자도 있겠고 우는 자도 있겠으나 저희도 듣고 회개하면 기뻐하리니 그러므로 탑의 비유를 들으라 내가 모든 것을 너희에게 보이리라 또 계시로 말미암아 더 이상 근심하지 말라 이 계시는 끝이 있고 이미 이루어졌음이라 그러나 너희는 계시 구하기를 그치지 아니하느니라 너희는 뻔뻔한 자니라
  to: 그녀가 말했습니다. “많은 사람이 듣기는 할 것입니다. 그러나 듣고 나서 그들 가운데 어떤 이들은 기뻐하고, 어떤 이들은 울 것입니다. 그러나 이들도 듣고 회개하면 역시 기뻐할 것입니다. 그러므로 탑에 관한 비유들을 들으십시오. 내가 모든 것을 당신에게 밝혀 주겠습니다. 그리고 계시에 관하여 더는 나를 괴롭히지 마십시오. 이 계시들은 끝이 있기 때문입니다. 이미 완결되었기 때문입니다. 그러나 당신은 계시를 구하기를 멈추지 않을 것입니다. 당신은 염치없는 사람이기 때문입니다.”
  rationale: 원문의 단수 청자, 논리적 대조, 계시 요구에 대한 화자의 질책을 보존하고, 초안의 고어체를 현대 합쇼체로 바꾸었습니다. ‘끝이 있다’와 ‘이미 완결되었다’는 원문의 반복적 근거를 그대로 유지했습니다.
