  to: “네가 보고 있는, 건축되고 있는 그 탑은 나, 곧 지금과 이전에 네게 나타난 교회이다. 그러므로 네가 탑에 관하여 무엇이든 묻고 싶은 것이 있으면, 내가 네게 밝혀 주겠다. 그러면 네가 성도들과 함께 기뻐하게 될 것이다.”
