  source_fidelity: 마지막 절의 δυσκόλως σωθήσεται는 구원을 받는 과정에서 ‘어려움을 겪는다’는 뜻을 덧붙이지 않고, ‘겨우/어렵게 구원을 받는다’로 옮겨야 합니다. 또한 μηδὲν διψυχοῦντες는 ‘조금도 두 마음을 품지 않고’라는 표현으로 충분히 반영됩니다.
  naturalness: 초안의 ‘두 마음을 품지 않고 의심하지 않고’는 같은 의미를 중복하여 다소 부자연스럽습니다. ‘조금도 두 마음을 품지 않고’로 간결하게 다듬는 것이 현대 한국어 합쇼체에 적절합니다.
  terminology: πίστις는 ‘믿음’, κύριος는 ‘주’, διψυχία 계열은 문맥상 반복되는 핵심어이므로 ‘두 마음을 품다’로 일관되게 유지했습니다. σωθήσεται는 교리적으로 확장하지 않고 ‘구원을 받다’로 번역했습니다.
