revisions:
- from: 그러나 믿음이 온전한 자들은 주를 신뢰하고 모든 것을 구하며, 두 마음을 품지 않고 의심하지 않고 구하므로 받습니다. 두 마음을 품은 사람마다 회개하지 않으면 어려움을 겪으면서 구원을 받게 될 것입니다.
  to: 그러나 믿음 안에서 온전한 사람들은 주를 신뢰하며 모든 것을 구하고, 조금도 두 마음을 품지 않고 구하므로 받습니다. 두 마음을 품은 사람은 누구나 회개하지 않으면 겨우 구원을 받을 것입니다.
  rationale: 원문의 대조 구조와 핵심 어휘를 유지하면서, 구원에 이르는 과정에 관한 불필요한 의미를 제거했습니다. ‘모든 것’은 πάντα의 포괄성을 보존했으며, ‘두 마음’은 본 단락에서 반복되는 διψυχία 어근을 일관되게 드러냅니다.
  reviewer_model: gpt-5.6-terra
