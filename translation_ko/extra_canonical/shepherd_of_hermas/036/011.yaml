  language: ko
  text: “그러므로 그가 말했습니다. ‘믿음은 위로부터, 곧 주님에게서 오며 큰 능력이 있다는 것을 알겠지요. 그러나 마음이 둘로 나뉨은 마귀에게서 온 땅에 속한 영으로서 아무 능력도 없습니다.’”
