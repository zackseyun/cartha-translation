review_pass:
  verdict: revise
  source_fidelity: 초안은 διψυχία를 ‘두 마음’으로 옮긴 점은 어근상 가능하지만, 문맥상 ‘의심하며 흔들리는 마음’이라는 뜻이 충분히 드러나지 않습니다. 또한 ‘자신을 신뢰하지 않기 때문에’(μὴ καταπιστεύουσα ἑαυτῇ)를 단순히 ‘믿지 아니하므로’로 옮겨 대상이 탈락했습니다.
  naturalness: ‘모든 일에 제어하고’는 목적어와 지배 관계가 불분명하며, 문장 종결도 합쇼체와 ‘-느니라’가 섞여 있습니다. 현대 표준어 합쇼체로 문장을 일관되게 다듬을 필요가 있습니다.
  terminology: διψυχία는 이 단락에서 반복되는 핵심어이므로 ‘두 마음’보다 의미를 분명히 하는 ‘의심하며 흔들리는 마음’으로 일관되게 옮겼습니다. πίστις는 ‘믿음’으로 유지했습니다.
  issues:
  - severity: high
    issue: ‘모든 일에 제어하고’
    rationale: κατακυρίευσον αὐτῆς ἐν παντὶ πράγματι는 ‘모든 일에서 그것을 지배하십시오/극복하십시오’라는 뜻입니다. 초안은 무엇을 제어하는지 명확하지 않고 자연스럽지 않습니다.
  - severity: medium
    issue: διψυχία의 의미가 불명확함
    rationale: ‘두 마음’은 한국어에서 다른 뜻으로도 이해되기 쉬우며, 본문의 의심·망설임의 의미가 충분히 전달되지 않습니다.
  - severity: high
    issue: ‘믿지 아니하므로’의 대상 누락
    rationale: μὴ καταπιστεύουσα ἑαυτῇ는 두 마음이 ‘자신을 신뢰하지 못한다’는 말입니다. 초안은 재귀 대상과 논리를 생략했습니다.
  - severity: medium
    issue: 종결 어미 혼용
    rationale: 요청된 현대 formal-polite 합쇼체에 맞추어 전체를 ‘-하십시오/-합니다’로 통일해야 합니다.
