  text: 그러므로 두 마음을 무시하고 모든 일에 제어하고 강하고 강한 믿음을 입으십시오. 믿음은 모든 것을 약속하고 모든 것을 이루느니라 그러나 두 마음을 품은 자는 믿지 아니하므로 모든 일을 실패하느니라
