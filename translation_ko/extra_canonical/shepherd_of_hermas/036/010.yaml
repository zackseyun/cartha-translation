revisions:
- from: 그러므로 두 마음을 무시하고 모든 일에 제어하고 강하고 강한 믿음을 입으십시오. 믿음은 모든 것을 약속하고 모든 것을 이루느니라 그러나 두 마음을 품은 자는 믿지 아니하므로 모든 일을 실패하느니라
  to: 그러므로 의심하며 흔들리는 마음을 업신여기고, 모든 일에서 그것을 극복하십시오. 강하고 능력 있는 믿음을 입으십시오. 믿음은 모든 것을 약속하고 모든 것을 이루지만, 의심하며 흔들리는 마음은 자신을 신뢰하지 못하므로 자신이 하는 모든 일에서 실패합니다.
  rationale: 원문의 명령형 두 개(‘업신여기십시오’, ‘극복하십시오’)와 ‘믿음을 입으십시오’를 보존하고, διψυχία의 문맥적 의미 및 ‘자신을 신뢰하지 못하므로’라는 재귀 표현을 명시했습니다. 접속 대조와 종결을 현대 합쇼체로 정리했습니다.
