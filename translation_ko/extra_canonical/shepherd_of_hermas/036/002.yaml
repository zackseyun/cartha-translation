review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central exhortation accurately, but its mixed speech level ('구하라' alongside future '-것이다') does not meet the specified modern formal-polite register. '생각하지 말고' is somewhat broad for διαλογίζου, which here means to deliberate or reason over such objections.
  naturalness: The Korean is generally clear, but a consistent 합쇼체 and a more idiomatic rendering of the conditional assurance improve readability. Omitting an explicit singular second-person pronoun avoids unnatural or confrontational Korean while retaining the source sense.
  terminology: '''주님'' appropriately renders κύριος. ''긍휼'' naturally conveys εὐσπλαγχνία in this religious-literary context. ''영혼의 간구'' preserves the source image of ''the request of your soul'' more closely than ''영혼의 요구.'''
  issues:
  - severity: medium
    issue: Inconsistent register
    rationale: The imperatives '말고…구하라' are non-polite, while '알게 될 것이다' is declarative plain style. The requested target is modern formal-polite 합쇼체.
  - severity: low
    issue: The rendering of διαλογίζου is underspecified
    rationale: '''생각하지 말고'' is possible, but ''곰곰이 따지지 말고'' more precisely reflects the instruction not to reason through these self-disqualifying thoughts.'
  - severity: low
    issue: '''영혼의 요구'' is less natural and less fitting than a petition term'
    rationale: αἴτημα denotes a request/petition in context; '영혼의 간구' retains that sense in natural Korean religious prose.
