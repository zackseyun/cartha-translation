revisions:
- from: 이런 것들을 생각하지 말고 오직 마음을 다하여 주께로 향하고 의심하지 말고 그에게 구하라. 그러면 너는 그의 크신 자비를 알게 될 것이다. 왜냐하면 그분은 결코 너를 버리지 않으시고 네 영혼의 요구를 이루어 주실 것이기 때문이다.
  to: 이런 것들을 곰곰이 따지지 말고, 온 마음을 다해 주님께 돌아서서 조금도 주저하지 말고 그분께 구하십시오. 그러면 그분의 크신 긍휼을 알게 될 것입니다. 그분께서는 결코 버리지 않으시고, 영혼의 간구를 이루어 주실 것이기 때문입니다.
  rationale: 'The revision preserves the Greek sequence and assurance: do not deliberate over such objections, turn wholeheartedly to the Lord, ask without hesitation, know his abundant compassion, and receive the assurance that he will not abandon the petitioner but fulfill the soul''s petition. It also consistently uses 합쇼체 and avoids importing interpretive qualifications.'
