  source_fidelity: 개정이 필요합니다. 원문의 2인칭 단수(σου, αἰτήσῃς)를 초안이 '너희/여러분'이라는 복수로 바꾸었고, 한 문단 안에서 호칭 수도 혼용합니다. 또한 πάντα 및 ἀνυστέρητος의 병렬은 '모든 것을 받을 것'과 청원에 부족함이 없을 것이라는 약속을 함께 보존해야 합니다.
