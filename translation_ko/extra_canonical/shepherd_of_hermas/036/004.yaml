revisions:
- from: 그러므로 이 세상의 모든 헛된 것과 이전에 너희에게 말한 말씀에서 너희 마음을 깨끗케 하고 주께 구하라. 그리고 여러분이 의심하지 않고 주님께 구한다면 여러분은 모든 것을 받을 것이며 여러분의 청원 중 어떤 것에도 부족함이 없을 것입니다.
  to: 그러므로 이 세상의 모든 헛된 것들과 네게 앞서 말해진 말씀들에서 네 마음을 깨끗하게 하십시오. 주님께 구하십시오. 의심하지 않고 주님께 구한다면, 모든 것을 받고 청한 모든 것 가운데 하나도 모자라지 않을 것입니다.
  rationale: 원문의 단수 수신자를 일관되게 보존하고, 현대 합쇼체로 다듬었습니다. '앞서 말해진 말씀들'은 원문의 다소 특이한 결합을 해석적으로 좁히지 않고 유지했으며, 두 약속(모든 것을 받음/청원에 결핍이 없음)을 모두 반영했습니다.
