  text: 그러므로 이 세상의 모든 헛된 것과 이전에 너희에게 말한 말씀에서 너희 마음을 깨끗케 하고 주께 구하라. 그리고 여러분이 의심하지 않고 주님께 구한다면 여러분은 모든 것을 받을 것이며 여러분의 청원 중 어떤 것에도 부족함이 없을 것입니다.
