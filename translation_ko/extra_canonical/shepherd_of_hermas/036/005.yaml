  text: 그러나 만일 너희가 마음이 흔들리면 너희가 구하는 것을 결코 받지 못할 것이니라. 하나님을 의심하는 자들은 두 마음을 품어 간구하는 것을 도무지 얻지 못하는 자들이니라.
