revisions:
- from: 그러나 만일 너희가 마음이 흔들리면 너희가 구하는 것을 결코 받지 못할 것이니라. 하나님을 의심하는 자들은 두 마음을 품어 간구하는 것을 도무지 얻지 못하는 자들이니라.
  to: 그러나 네 마음에 의심이 생기면, 네가 간구한 것들 가운데 아무것도 결코 받지 못할 것입니다. 하나님을 두고 의심하는 사람들은 두 마음을 품은 사람들로서, 그들이 간구한 것들을 전혀 얻지 못합니다.
  rationale: 원문의 단수 خطاب을 회복하고, ‘의심하다’와 ‘두 마음을 품다’의 연결을 자연스럽게 정리했습니다. ‘아무것도 결코’는 이중 부정의 강조를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:32Z'
