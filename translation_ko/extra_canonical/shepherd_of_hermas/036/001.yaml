  language: ko
  text: 그분께서 내게 말씀하십니다. “자신에게서 의심하는 마음을 버리십시오. 하나님께 무엇이든 구할 때에는 결코 의심하지 말며, 속으로 ‘내가 주님께 이처럼 많은 죄를 지었는데, 어떻게 주님께 구하여 받을 수 있겠는가?’라고 말하지 마십시오.”
