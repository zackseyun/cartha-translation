    rationale: 여기서 διψυχία는 하나님께 구할 때 품는 의심·망설임을 뜻합니다. ‘두 마음’은 한국어에서 다른 의미로 이해될 가능성이 있어 독자의 이해를 흐릴 수 있습니다.
  - severity: low
