  source_fidelity: 그리스어의 핵심 권면인 διψυχία(하나님께 구할 때의 의심·망설임)를 초안의 ‘두 마음’으로 옮긴 것은 직역적이지만, 현대 한국어에서는 뜻이 불분명하고 문맥상 부적절하게 들릴 수 있습니다. 또한 ἆρον ἀπὸ σεαυτοῦ(‘자신에게서 제거하십시오’)의 명령이 보다 분명히 드러나야 합니다. 속으로 ‘말하며’라는 분사도 자연스럽게 반영할 수 있습니다.
  naturalness: ‘두 마음을 품다’는 현대 한국어에서 흔히 연애 감정이나 양다리의 뉘앙스를 줄 수 있어, 기도 중의 내적 의심을 가리키는 이 문맥에는 ‘의심하는 마음’이 자연스럽습니다. 인용문의 참여 구문은 ‘…죄를 지었는데’로 풀어 합쇼체 문장 흐름을 살렸습니다.
  terminology: θεός는 ‘하나님’, κύριος는 ‘주님’으로 일관되게 옮겼습니다. διψυχία는 이 절의 문맥에서 ‘의심하는 마음’으로 번역하여, 뒤의 ‘결코 의심하지 마십시오’와 의미상 연결되게 했습니다.
  issues:
