  source_fidelity: 원문의 대조 구조(‘능력 있는 믿음’과 ‘능력 없는 διψυχία’)와 미래 결과 진술은 대체로 반영했으나, ‘두 마음’은 διψυχία의 지속적·인격적 의미를 충분히 전달하지 못하고, ‘하나님을 향하여 살리라’는 현대 한국어에서 부자연스럽습니다.
  naturalness: ‘하나님을 향하여 살리라’는 문어적 직역투이며 합쇼체의 현대적 종결에도 맞지 않습니다. ‘하나님을 위하여 살 것입니다’가 자연스럽고 원문의 여격 용법을 무리 없이 살립니다.
  terminology: πίστις는 ‘믿음’으로 유지합니다. διψυχία는 여기서 단순한 감정 변화가 아니라 믿음에 반하는 망설임/양심적 분열을 가리키므로 ‘두 마음을 품는 태도’로 옮겨 문맥상 의미를 명확히 했습니다. ‘섬기다’는 원문의 δούλευε(섬기라)의 의인화된 표현을 보존합니다.
  issues:
