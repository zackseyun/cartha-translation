    issue: ‘두 마음’
    rationale: διψυχία를 명사구로 직역한 표현이지만 현대 한국어에서는 의미가 불분명합니다. 본문 문맥의 믿음 안에서의 망설임·양분된 마음을 드러내도록 ‘두 마음을 품는 태도’로 고치는 것이 안전합니다.
  - severity: medium
    issue: ‘하나님을 향하여 살리라’
    rationale: ζήσῃ τῷ θεῷ 및 ζήσονται τῷ θεῷ의 결과적 미래 진술을 현대 합쇼체로 자연스럽게 옮겨야 합니다. ‘하나님을 위하여 살 것입니다’가 적절합니다.
  - severity: low
    issue: ‘이런 것을 생각하는 자마다’
    rationale: ταῦτα는 복수이며 ‘이러한 것들을 생각하는 모든 사람’이 더 자연스럽고 원문을 충실히 반영합니다.
