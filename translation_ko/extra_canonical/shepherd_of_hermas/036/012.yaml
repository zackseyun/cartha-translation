  to: 그러므로 능력 있는 믿음을 섬기고, 능력 없는 두 마음을 품는 태도를 멀리하십시오. 그리하면 하나님을 위하여 살 것입니다. 이러한 것들을 생각하는 모든 사람도 하나님을 위하여 살 것입니다.”
  rationale: 원문의 명령(δούλευε, ἀπόσχου), 믿음과 διψυχία의 대조, 그리고 두 차례의 미래 결과(ζήσῃ, ζήσονται)를 유지하면서, 직역투를 현대 표준 한국어 합쇼체로 바로잡았습니다. 교리적 해석을 추가하지 않았습니다.
