revisions:
- from: 그러므로 너희 마음을 두 마음에서 깨끗하게 하고 믿음을 더하라 그 마음이 강하니라 너희 구하는 것은 다 받으리라 하나님을 믿으라 그리고 만일 주님께 어떤 요청을 한 후에 그것을 더디게 받는다면, 영혼의 요청을 빨리 받지 못했다고 해서 두 마음을 품지 마십시오. 왜냐하면 여러분이 여러분의 요청을 더디게 받아들이는 것은 확실히 여러분이 알지 못하는 어떤 시험이나 어떤 범법 때문입니다.
  to: 그러므로 그대의 마음에서 두 마음을 깨끗이 없애고 믿음을 입으십시오. 믿음은 강하니, 하나님을 믿으십시오. 그러면 그대가 구하는 모든 간구를 받을 것입니다. 또 그대가 전에 주님께 어떤 간구를 드렸는데 그것을 더디 받게 되더라도, 그대 영혼의 간구를 빨리 받지 못했다고 해서 두 마음을 품지 마십시오. 이는 반드시 어떤 시험이나 그대가 알지 못하는 어떤 잘못 때문에 그대가 그 간구를 더디 받는 것이기 때문입니다.
  rationale: 원문의 단수 권면을 일관되게 유지하고, 믿음을 ‘입으라’는 은유와 두 마음에 대한 반복을 보존했습니다. 또한 지연된 응답의 이유를 원문이 제시하는 범위 안에서 ‘어떤 시험이나 그대가 알지 못하는 어떤 잘못’으로 옮겼으며, 이를 특정 교리적 인과론으로 확대하지 않았습니다.
