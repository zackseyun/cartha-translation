  english_pob_role: consult_only
status: reviewed
revisions:
- from: 그러므로 너희 영혼에 구하는 것을 쉬지 말고 구하라. 그러면 너희는 그것을 받을 것이다. 그러나 너희가 구하다가 피곤하여 두 마음을 품어 구하면 너희 자신을 탓하고 너희에게 주시는 분을 탓하지 말라.
  to: 그러므로 그대 영혼의 소원을 구하기를 멈추지 마십시오. 그러면 그것을 받을 것입니다. 그러나 구하면서 낙심하고 두 마음을 품게 되면, 주시는 분이 아니라 그대 자신을 탓하십시오.
  rationale: 원문의 단수 خطاب을 일관되게 유지하고, ‘영혼의 간구’를 자연스러운 한국어인 ‘영혼의 소원’으로 옮겼습니다. ‘낙심하고 두 마음을 품게 되면’은 ἐκκακήσῃς와 διψυχήσῃς의 연속을 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:15:50Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 2인칭 단수(σου, αἰτούμενος, σεαυτόν)를 반영해야 합니다. 또한 αἴτημα τῆς ψυχῆς σου는 ‘영혼에 구하는 것’이 아니라 ‘영혼의 소원/간구’라는 뜻입니다.
  naturalness: 초안의 ‘너희 영혼에 구하는 것을’은 한국어 문법과 의미 연결이 부자연스럽습니다. 현대 합쇼체에 맞게 단수 호칭을 유지하고 문장을 다듬었습니다.
  terminology: διψυχήσῃς는 문맥상 의심으로 인한 내적 분열을 가리키므로 ‘두 마음을 품게 되면’으로 옮겨 원문의 핵심 표현을 보존했습니다. ἐκκακήσῃς는 ‘낙심하다’로 자연스럽게 반영했습니다.
  issues:
  - severity: high
    issue: 인칭 수의 불일치
    rationale: 그리스어는 이 절 전체에서 2인칭 단수인데 초안은 ‘너희/너희는’이라는 복수로 번역했습니다.
  - severity: high
    issue: 첫 문장의 의미 및 문법 오류
    rationale: ‘너희 영혼에 구하는 것’은 αἴτημα τῆς ψυχῆς σου를 잘못 분석한 표현이며 한국어로도 성립하기 어렵습니다.
  - severity: medium
    issue: ἐκκακήσῃς의 의미가 충분히 반영되지 않음
    rationale: ‘피곤하여’보다 ‘낙심하여’가 기도 요청을 지속하다 지쳐 포기하는 문맥을 더 정확히 전달합니다.
  revised_text: 그러므로 그대 영혼의 소원을 구하기를 멈추지 마십시오. 그러면 그것을 받을 것입니다. 그러나 구하면서 낙심하고 두 마음을 품게 되면, 주시는 분이 아니라 그대 자신을 탓하십시오.
