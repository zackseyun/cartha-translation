  text: 이 두 마음을 보라 이는 악하고 어리석어 많은 사람 곧 심히 신실하고 강한 자라도 믿음에서 떠나게 하는 것이니라 이 두 마음은 마귀의 딸이라 하나님의 종들에게 심히 악하게 행하는 것이니라
