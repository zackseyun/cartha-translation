  naturalness: 초안은 구두점과 문장 연결이 부족하고 ‘이는 … 것이니라’ 같은 문체가 요청된 현대 합쇼체에 맞지 않습니다. ‘두 마음을 품는 태도’로 풀어 쓰고 현대적인 종결을 사용하면 자연스럽습니다.
  terminology: ‘마귀’, ‘하나님의 종들’, ‘믿음’은 적절합니다. διψυχία의 비유적·핵심적 표현은 ‘두 마음을 품는 태도’로 옮겨, 단순한 감정적 망설임으로 축소하지 않았습니다.
