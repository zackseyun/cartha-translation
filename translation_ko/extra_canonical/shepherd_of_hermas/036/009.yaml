revisions:
- from: 이 두 마음을 보라 이는 악하고 어리석어 많은 사람 곧 심히 신실하고 강한 자라도 믿음에서 떠나게 하는 것이니라 이 두 마음은 마귀의 딸이라 하나님의 종들에게 심히 악하게 행하는 것이니라
  to: 이 두 마음을 품는 태도를 보십시오. 그것은 악하고 분별이 없으며, 많은 사람들, 곧 매우 신실하고 강한 사람들까지 믿음에서 뿌리째 뽑아 냅니다. 이 두 마음을 품는 태도는 마귀의 딸이며, 하나님의 종들에게 매우 악하게 행합니다.
  rationale: διψυχία의 반복을 일관되게 ‘두 마음을 품는 태도’로 번역하여 원문의 비유와 문맥상의 의미를 함께 보존했습니다. ‘뿌리째 뽑아 냅니다’로 ἐκριζοῖ를 반영하고, 전체를 현대 합쇼체로 다듬었습니다.
