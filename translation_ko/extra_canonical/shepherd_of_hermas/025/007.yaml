revisions:
- from: 7. 그러므로 너희가 이 말씀을 듣고 지켜 행하며 청결한 마음으로 행하면 주께서 너희에게 약속하신 것을 얻으리라. 그러나 여러분이 듣고도 회개하지 않고 여전히 죄를 더한다면, 여러분은 주님으로부터 반대되는 것들을 받게 될 것입니다. 회개의 천사인 목자는 이 모든 것을 이렇게 기록하라고 나에게 명했습니다.
