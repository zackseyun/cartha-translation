  text: 제가 집에서 기도한 뒤 침상에 앉아 있었는데, 모습이 영광스럽고 목자 차림을 한 어떤 사람이 흰 가죽옷을 입고 어깨에 자루를 메고 손에는 지팡이를 들고 들어왔습니다. 그는 저에게 인사했고, 저도 그에게 인사했습니다.
