review_pass:
  verdict: revise
  source_fidelity: 원문은 목자가 자신이 앞으로 명할 계명들 안에서 강건해지라고 하고, 앞서 본 모든 것, 특히 유익한 핵심 사항들을 다시 보이기 위해 파송되었다고 말합니다. 초안은 ‘내 계명을 굳건하게 하라’로 명령의 대상을 바꾸고, 단수·복수 지시 대상과 ‘손에 두고 읽다’의 뜻을 충분히 반영하지 못합니다.
  naturalness: 초안은 문장 경계와 인용 구조가 불명확하며, ‘이르시되/하시니라’와 현대 합쇼체 ‘말씀하십니다’가 섞여 있습니다. 현대 정중체의 일관된 서술과 직접 인용으로 다듬는 것이 자연스럽습니다.
  terminology: ἐντολαί는 ‘계명들’, παραβολαί는 이 작품의 관례에 맞게 ‘비유들’로 옮겼습니다. κεφάλαια는 신학적 전문어로 과도하게 한정하지 않고 ‘핵심 사항들’로 번역했습니다.
  issues:
  - severity: high
    issue: ‘내 계명을 굳건하게 하라’
    rationale: ἰσχυροποιοῦ ἐν ταῖς ἐντολαῖς μου는 계명을 굳게 만들라는 뜻이 아니라 ‘내 계명들 안에서 강건해지라/굳세어지라’는 뜻입니다.
  - severity: medium
    issue: 인칭과 지시 대상의 혼동
    rationale: 원문은 주로 헤르마스에게 단수로 말하면서 ‘너희에게 유익한’이라는 복수 표현을 포함합니다. 초안은 이를 여러 곳에서 임의로 ‘너희’로 바꾸어 화자의 직접 지시를 흐립니다.
  - severity: medium
    issue: ‘쉽게 읽고’
    rationale: ὑπὸ χεῖρα ἀναγινώσκῃς는 ‘손에 두고/가까이 두고 읽다’라는 뜻이며 단순히 읽기 쉽다는 뜻은 아닙니다.
  - severity: medium
    issue: 현대 합쇼체와 문장 구조의 불일치
    rationale: 초안은 고전적 종결과 현대 정중 종결을 혼용하고, 긴 문장 안에서 인용과 발화 귀속이 불분명합니다.
