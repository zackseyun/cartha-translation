- from: 5. 그가 내게 대답하여 이르시되 당황하지 말고 내가 네게 명하는 내 계명을 굳건하게 하라 나는 너희가 전에 본 모든 것 특히 너희에게 유익한 주요한 것을 다시 너희에게 보이리라 내가 보내심을 받았노라 하시고 먼저 나의 계명과 비유를 기록하고 그 외에는 내가 네게 보이는 대로 쓰라 하시니라 그러므로 그분은 “내가 너희에게 명령하는 것은 먼저 계명과 비유를 기록하여 너희가 쉽게 읽고 지키게 하라”고 말씀하십니다.
