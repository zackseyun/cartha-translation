  text: 3. 나는 그가 나를 시험하러 온 줄로 생각하고 그에게 말하기를 "그러면 너는 누구냐? 나는 나를 맡은 분이 누구인지 안다"고 말합니다. 그는 나에게 “당신은 나를 알아보지 못합니까?”라고 말했습니다. “아니요.” 나는 말한다. “나는 너희를 맡은 목자니라”고 그분은 말씀하십니다.
