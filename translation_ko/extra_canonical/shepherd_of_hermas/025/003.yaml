- from: 3. 나는 그가 나를 시험하러 온 줄로 생각하고 그에게 말하기를 "그러면 너는 누구냐? 나는 나를 맡은 분이 누구인지 안다"고 말합니다. 그는 나에게 “당신은 나를 알아보지 못합니까?”라고 말했습니다. “아니요.” 나는 말한다. “나는 너희를 맡은 목자니라”고 그분은 말씀하십니다.
  to: 3. 나는 그가 나를 시험하려고 온 것이라고 생각하고 그에게 말했습니다. “그러면 당신은 누구십니까? 저는 제가 맡겨진 분이 누구신지 압니다.” 그가 나에게 말씀하셨습니다. “당신은 나를 알아보지 못합니까?” 나는 대답했습니다. “아니요.” 그가 말씀하셨습니다. “내가 바로 네가 맡겨진 목자다.”
  rationale: 원문의 단수 인칭, ‘맡겨짐’의 방향, 그리고 ‘목자’라는 명칭을 보존했습니다. 한국어 서술은 현대적인 합쇼체 과거 시제로 통일하되, 인용문 속 목자의 ‘너’는 원문의 친근한 단수 2인칭을 반영하여 유지했습니다.
