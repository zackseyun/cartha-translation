  text: 4. 그가 아직 말하고 있을 때에 그의 모습이 변하자, 나는 그가 내가 맡겨졌던 바로 그분임을 알아보았습니다. 나는 즉시 당황하였고, 두려움이 나를 사로잡았으며, 그에게 그렇게 악하고 어리석게 대답한 까닭에 온몸이 슬픔에 짓눌렸습니다.
