base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022.yaml
  text: 'The vision that I saw[a], brothers, came twenty days after the former vision; it was as a pattern of the tribulation that is coming.


    I was going into the countryside by the Campanian road. It is about ten stadia from the public road, and the place is easy to travel.


    So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.


    And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”


    I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me[b].


    As the dust grew greater and greater, I supposed it was something divine. The sun shone out a little, and behold, I see a very great beast, like some sea monster, and from its mouth fiery locusts were coming out. The beast was about a hundred feet in length, and its head was like a jar.


    I began to weep and to ask the Lord that he would deliver me from it. And I remembered the word that I had heard: “Do not be double-minded, Hermas.”


    So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a rushing roar that it could ravage a city.


    I came near it, and that huge sea monster stretched itself out on the ground and did nothing except thrust out its tongue; it did not move at all until I had passed by it.


    Now the beast had four colors on its head: black, then fiery and blood-red, then golden[l][k][j][i][h][g][f][e][d][c], then white.'
  footnotes:
  - marker: a
    text: “As a pattern” translates εἰς τύπον—literally, “as a type.” Early Christians used τύπος for prefigurative images.
    reason: lexical_alternative
  - marker: b
    text: The Campanian road likely refers to a Roman route leading toward Campania from Rome.
    reason: cultural_note
  - marker: c
    text: Ten stadia ≈ 1.8 km / 1.1 miles.
    reason: cultural_note
  - marker: d
    text: '“Through his holy Church”: In earlier visions Hermas receives revelations mediated by a woman who personifies the Church.'
    reason: cross_reference
  - marker: e
    text: “Do not be double‑minded” echoes the ethical vice of divided loyalty; compare James 1:6–8.
    reason: cross_reference
  - marker: f
    text: '“Herds”: κτήνη can mean domestic animals in general; alternatives include “beasts” or “cattle.”'
    reason: lexical_alternative
  - marker: g
    text: κῆτος denotes a large sea creature or sea‑monster; “whale” is another possible rendering.
    reason: lexical_alternative
  - marker: h
    text: Fiery locusts evoke apocalyptic imagery; compare Joel 2 and Revelation 9.
    reason: cross_reference
  - marker: i
    text: '“Its head was like earthenware”: κεραμος can mean tile, pottery, or clay vessel—the simile is obscure.'
    reason: lexical_alternative
  - marker: j
    text: “Deliver” renders a verb from the ransom/deliverance word‑group (λυτρ‑); alternatives include “rescue” or “ransom.”
    reason: lexical_alternative
  - marker: k
    text: “Putting on faith” uses clothing imagery for virtue; compare 1 Thessalonians 5:8.
    reason: cross_reference
  - marker: l
    text: Or 'Now the beast was approaching with a rushing roar, so that it could ravage a city.'.
    reason: previous_rendering
translation:
  language: ko
  text: '내가 본 그 환상은, 형제 여러분, 앞선 환상 후 이십 일 만에 있었습니다. 그것은 다가오는 환난의 한 모형이었습니다.


    나는 캄파니아 길을 따라 시골로 들어가고 있었습니다. 공도에서 약 열 스타디온쯤 떨어진 곳이었고, 그곳은 가기 쉬운 곳이었습니다.


    그래서 나 홀로 걸으면서, 주님께서 그의 거룩한 교회를 통해 내게 보여 주신 계시들과 환상들을 완성해 주시고, 넘어져 있는 그의 종들에게 회개를 주셔서, 그의 크고 영광스러운 이름이 영광을 받게 해 주시며, 또 나를 그의 놀라운 일들을 보여 줄 만한 사람으로 여기신 일을 인하여 나를 강하게 해 주시기를 간구하고 있었습니다.


    내가 그분을 찬양하며 감사드리고 있을 때, 음성의 소리 같은 것이 내게 응답하여 말했습니다. “두 마음을 품지 말아라, 헤르마스.” 나는 속으로 생각하기 시작하며 말했습니다. “주님께서 이렇게나 나를 굳게 세우셨고 영광스러운 것들을 보게 하셨는데, 내가 무엇 때문에 두 마음을 품겠습니까?”


    나는 조금 더 걸어갔습니다, 형제 여러분. 그런데 보십시오, 하늘까지 닿는 듯한 먼지가 일어나는 것이 보였습니다. 그래서 나는 속으로 말하기 시작했습니다. “아마 짐승들이 와서 먼지를 일으키는 것인가?” 그것은 내게서 한 스타디온쯤 되는 곳이었습니다.


    먼지가 점점 더 커지자, 나는 그것이 어떤 신적인 것이라고 생각했습니다. 해가 잠시 비치더니, 보십시오, 나는 매우 큰 짐승 하나를 보았는데, 어떤 바다 괴물 같았고, 그 입에서는 불붙은 메뚜기들이 나오고 있었습니다. 그 짐승은 길이가 백 피트쯤 되었고, 머리는 마치 항아리 같았습니다.


    나는 울기 시작하며, 주님께 그것으로부터 나를 구해 달라고 간구했습니다. 그리고 내가 들었던 말씀을 다시 떠올렸습니다. “두 마음을 품지 말아라, 헤르마스.”


    그러므로 형제 여러분, 주님의 믿음을 입고, 그분이 내게 가르쳐 주신 큰 일들을 기억하며, 나는 용기를 내어 그 짐승에게 내 몸을 맡겼습니다. 그때 그 짐승은 포효를 내며 몰려오고 있었는데, 한 도시를 황폐하게 할 수 있을 만큼의 소리를 내고 있었습니다.


    내가 그 가까이 가자, 그 큰 바다 괴물은 땅에 몸을 펴고 혀만 내밀 뿐 아무것도 하지 않았습니다. 내가 그것을 지나갈 때까지는 전혀 움직이지 않았습니다.


    그 짐승의 머리에는 네 가지 색이 있었습니다. 검은색, 그다음에는 불빛 같은 붉은색과 피 같은 붉은색, 그다음에는 황금색, 그다음에는 흰색이었습니다.[a][b][c][d][e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τύπον τῆς θλίψεως
  english_pob_choice: as a pattern of the tribulation
  chosen_korean: 다가오는 환난의 한 모형
  alternatives_korean:
  - 다가오는 환난의 패턴
  - 다가오는 환난의 유형
  lexicon: BDAG; LSJ
  rationale: τύπος의 예표적 의미를 살리되 한국어에서는 ‘모형’이 가장 자연스럽게 선행 표상과 예고의 뉘앙스를 전달합니다.
- source_word: τῇ Καμπανῇ
  english_pob_choice: the Campanian road
  chosen_korean: 캄파니아 길
  alternatives_korean:
  - 캄파니아 도로
  - 캄파니아 가도
  lexicon: LSJ
  rationale: 지명형 고유 도로명으로 읽히므로 현대 한국어에서는 ‘길’이 가장 간명하고 읽기 쉽습니다.
- source_word: τῆς ὁδοῦ τῆς δημοσίας
  english_pob_choice: the public road
  chosen_korean: 공도
  alternatives_korean:
  - 공공도로
  - 큰길
  lexicon: LSJ
  rationale: δημοσία ὁδός의 공적 간선도로 의미를 간결하게 반영했습니다.
- source_word: διὰ τῆς ἁγίας Ἐκκλησίας αὐτοῦ
  english_pob_choice: through his holy Church
  chosen_korean: 그의 거룩한 교회를 통해
  alternatives_korean:
  - 그의 거룩한 회중을 통해
  - 그의 거룩한 모임을 통해
  lexicon: BDAG
  rationale: 이 대목에서는 계시의 매개자인 인격화된 교회가 전면에 있으므로 ‘교회’를 유지하는 것이 문맥에 맞습니다.
- source_word: Μὴ διψυχήσεις
  english_pob_choice: Do not be double-minded
  chosen_korean: 두 마음을 품지 말아라
  alternatives_korean:
  - 의심하지 말아라
  - 흔들리지 말아라
  lexicon: BDAG; LSJ
  rationale: 한국어 관용구로 내부 분열과 양쪽을 향한 마음을 가장 자연스럽게 드러냅니다.
- source_word: ἀκρίδες πύριναι
  english_pob_choice: fiery locusts
  chosen_korean: 불붙은 메뚜기들
  alternatives_korean:
  - 불 같은 메뚜기들
  - 불의 메뚜기들
  lexicon: BDAG
  rationale: 계시적 이미지의 강도를 살리면서도 직역 과잉을 피했습니다.
- source_word: κῆτος
  english_pob_choice: sea-monster
  chosen_korean: 바다 괴물
  alternatives_korean:
  - 큰 바다 짐승
  - 고래
  lexicon: LSJ
  rationale: κῆτος의 괴물성을 유지하면서 한국어 독자에게도 즉시 장면이 떠오르게 했습니다.
- source_word: ῥοίζῳ
  english_pob_choice: with such a rushing roar
  chosen_korean: 포효를 내며
  alternatives_korean:
  - 쏜살같은 소리로
  - 쌩쌩 몰아치며
  lexicon: LSJ
  rationale: 원문의 소리와 돌진의 위협을 함께 살리되 문장 흐름상 자연스럽게 정리했습니다.
- source_word: λυμᾶναι
  english_pob_choice: ravage
  chosen_korean: 황폐하게 할
  alternatives_korean:
  - 짓밟을
  - 파괴할
  lexicon: BDAG; LSJ
  rationale: 도시를 대상으로 한 파괴적 황폐화를 드러내는 표현이 가장 적절합니다.
theological_decisions:
- issue: διψυχέω의 영적 윤리 범주
  chosen_reading: ‘두 마음을 품다’로 번역해 내적 분열의 죄를 드러냈습니다.
  alternative_readings:
  - 의심하다
  - 흔들리다
  rationale: 이 작품에서 διψυχία는 단순한 지적 의심보다 충성의 분열을 가리키므로, 도덕적·영적 긴장을 보존하는 표현이 필요합니다.
  doctrine_reference: 'Hermas의 윤리 어휘: divided loyalty / double-mindedness'
- issue: τὸν Κύριον과 신앙의 대상
  chosen_reading: ‘주님께서… 하셨고’ 및 ‘주님의 믿음’을 유지했습니다.
  alternative_readings:
  - 주(主)
  - 그리스도
  rationale: 본문의 예배적 호칭을 존중하면서도, 본 단락의 수신자에게 직접 향하는 신앙적 호소를 자연스럽게 옮겼습니다.
  doctrine_reference: 'POB glossary: κύριος of Jesus'
