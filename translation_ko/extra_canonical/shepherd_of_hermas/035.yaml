  yaml_path: translation/extra_canonical/shepherd_of_hermas/035.yaml
  text: '“I said to you,” he says[1], “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.


    “Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”


    “What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness,[2] from wicked luxury, from many foods[3] and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.


    “These deeds are the most evil of all in the life of human beings. From these works[2], then, the slave of God must exercise self‑control; for the one who does not exercise self‑control from these is not able to live to God.[4] Listen, then, also to the things that follow these.”


    “Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the slave of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastful pretension, and whatever things are like these.”


    “Do these not seem to you to be evil?” “Very evil,” I say, “for the slaves of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled[5] with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.


    “But the things from which you must not exercise self‑control,” he says, “but rather do them—listen: Do not exercise self‑control with regard to the good, but do it.”


    “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works of the good, which you must do and not exercise self‑control from.


    “First of all: faith, fear of the Lord, love, concord, words of righteousness,[6] truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.


    “Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the slaves of God from distresses;[7] to be hospitable (for in hospitality one sometimes finds an opportunity for doing good[12]); to oppose no one; to be quiet;[8] to make yourself one who has less than all people;[9] to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have scandalized away from the faith,[10] but to turn them back and make them cheerful; to admonish those who sin; not to press debtors and the needy;[11] and if there is anything like these.


    “Do these seem to you to be good?” “What, Lord, is better than these?” I say. “Go, then,” he says, “walk in them and do not exercise self‑control from them, and you will live to God.


    “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God[12][11][10][9][8][7][6][5][4][3]; and all will live to God—whoever keeps these commandments and walks in them.”'
  footnotes:
  - marker: '1'
    text: “Twofold” signals Hermas’s recurring motif of paired ways (evil/good; restrain/do). The phrase “things created by God are twofold” introduces the moral polarity that follows.
    reason: cultural_note
  - marker: '2'
    text: 'μεθύσμα ἀνομίας: a binge or bout of drinking characterized by lawless excess; hence “lawless drunkenness.”'
    reason: lexical_alternative
  - marker: '3'
    text: 'ἐδέσματα πολλὰ: literally “many foods/dishes,” pointing to excess in eating (delicacies).'
    reason: lexical_alternative
  - marker: '4'
    text: “Live to God” is Hermas’s preferred idiom for a life oriented toward God. It echoes early Christian diction and is kept intentionally.
    reason: cross_reference
  - marker: '5'
    text: “Be enrolled” evokes civic registers or a record; Hermas does not specify which book, but the image is of being listed among the self‑restrained.
    reason: cultural_note
  - marker: '6'
    text: ῥήματα δικαιοσύνης could be rendered “righteous speech” or “just words.” The literal “words of righteousness” is retained.
    reason: lexical_alternative
  - marker: '7'
    text: 'ἐξ ἀναγκῶν λυτροῦσθαι: literally “to ransom from necessities/constraints,” i.e., to rescue fellow believers from pressing hardships, debts, or bondage.'
    reason: lexical_alternative
  - marker: '8'
    text: 'ἡσύχιος: quiet, peaceable, non‑contentious.'
    reason: lexical_alternative
  - marker: '9'
    text: 'ἐνδεέστερον γίνεσθαι πάντων ἀνθρώπων: literally “to become more in want than all people,” i.e., willingly accept lack so as to prefer others.'
    reason: cultural_note
  - marker: '10'
    text: “Scandalized away from the faith” reflects the verb σκανδαλίζω; alternatives include “stumbled” or “led astray.”
    reason: lexical_alternative
  - marker: '11'
    text: “Not to press debtors” (χρεώστας μὴ θλίβειν) has the sense of not dunning or harassing those who owe, especially the needy.
    reason: lexical_alternative
  - marker: '12'
    text: “Doing good” renders ἀγαθοποίησις—beneficence; hospitality often provides concrete opportunities for such good works.
    reason: cultural_note
translation:
  language: ko
  text: '“내가 너에게 말했다,” 그가 말합니다. “하나님이 지으신 것들은 둘로 나뉘어 있습니다. 자기절제도 마찬가지로 둘로 나뉘어 있습니다. 어떤 것에 대해서는 자기절제를 해야 하고, 어떤 것에 대해서는 해서는 안 됩니다.


    “주님, 어느 것에 대해서는 자기절제를 해야 하고 어느 것에 대해서는 해서는 안 되는지 알려 주십시오.” 내가 말하자, 그가 말합니다. “들으십시오. 악한 것에 대해서는 자기절제를 하고 그것을 행하지 마십시오. 그러나 선한 것에 대해서는 자기절제를 하지 말고 오히려 그것을 행하십시오. 선한 것을 행하지 않으려고 자기절제하면 큰 죄를 짓는 것이고, 악한 것을 행하지 않으려고 자기절제하면 큰 의를 이루는 것입니다. 그러므로 모든 악에서 자기절제하고 선을 행하십시오.


    “주님, 어떤 악에서 우리가 자기절제해야 합니까?” 내가 묻자, 그가 말합니다. “들으십시오. 간음과 음행에서, 불법한 취음에서, 악한 사치에서, 많은 음식과 재물의 사치와 자랑과 오만과 교만에서, 그리고 거짓말과 중상과 위선과 원한과 모든 모독에서입니다.


    “이것들은 사람의 삶에서 가장 악한 행위들입니다. 그러므로 하나님의 종은 이런 일들에서 자기절제해야 합니다. 이런 것들에서 자기절제하지 않는 사람은 하나님을 향해 살 수 없습니다. 그러니 이제 이 뒤에 오는 것들도 들으십시오.


    “아직도 악한 행위들이 있습니까?” 내가 묻자, 그가 말합니다. “물론 많습니다. 하나님의 종이 자기절제해야 할 것들은 도둑질, 거짓말, 착취, 거짓 증언, 탐욕, 악한 욕망, 속임, 헛된 영광, boastful pretension, 그리고 이런 것들과 비슷한 것들입니다.


    “이것들이 악한 것처럼 보이지 않습니까?” “매우 악합니다, 하나님의 종들에게는요.” 내가 말하자, 그가 말합니다. “이 모든 것에서 하나님을 섬기는 사람은 자기절제해야 합니다. 그러므로 이 모든 것에서 자기절제하여 하나님을 향해 살고, 그것들에서 자기절제하는 사람들과 함께 등록되십시오. 그러니 이것들이 바로 여러분이 자기절제해야 할 것들입니다.


    “그러나 여러분이 자기절제해서는 안 되고 오히려 행해야 할 것들은 들으십시오. 선한 것에 대해서는 자기절제하지 말고 그것을 행하십시오.”


    “주님, 선한 것들의 능력을 제게 알려 주십시오. 그러면 제가 그것들 가운데서 걸으며 그것들을 섬기고, 그것들을 실천함으로써 구원을 얻을 수 있을 것입니다.” “들으십시오. 또 선한 것들의 행위도 있으니, 여러분이 해야 하고 그것들에서 자기절제해서는 안 되는 것들입니다.


    “첫째는 믿음, 주님을 두려워함, 사랑, 일치, 의의 말, 진리, 인내입니다. 이것들보다 사람의 삶에서 더 나은 것은 없습니다. 누구든지 이것들을 지키고 그것들에서 자기절제하지 않으면, 그의 삶에서 복을 받게 됩니다.


    “그다음으로는 이것들을 따르는 것들을 들으십시오. 곧 과부들을 섬기는 것, 고아들과 궁핍한 사람들을 방문하는 것, 하나님의 종들을 환난에서 속량하는 것, 손님을 잘 대접하는 것—사실 손님 대접에서는 때때로 선행의 기회가 발견됩니다—아무에게도 맞서지 않는 것, 조용한 사람이 되는 것, 모든 사람보다 더 부족한 처지가 되는 것, 장로들을 공경하는 것, 의를 실천하는 것, 형제됨을 지키는 것, 모욕을 견디는 것, 오래 참는 것, 원한을 품지 않는 것, 마음이 지친 사람들을 격려하는 것, 믿음에서 넘어져 떠난 사람들을 내버리지 말고 오히려 돌이켜 기쁘게 하는 것, 죄짓는 사람들을 훈계하는 것, 채무자들과 궁핍한 사람들을 압박하지 않는 것, 그리고 이와 비슷한 것이 있으면 그것들입니다.


    “이것들이 선한 것처럼 보입니까?” “주님, 이것들보다 더 나은 것이 무엇이 있겠습니까?” 내가 말합니다. “그러므로 가서 그것들 가운데서 걸으며 그것들에서 자기절제하지 마십시오. 그러면 하나님을 향해 살 것입니다.


    “그러므로 이 계명을 지키십시오. 선한 것을 행하고 그것에서 자기절제하지 않으면 하나님을 향해 살 것이며, 이와 같이 행하는 모든 사람도 하나님을 향해 살 것입니다. 또 다시, 악한 것을 행하지 않고 그것에서 자기절제하면 하나님을 향해 살 것이며, 이 계명을 지키고 그것들 가운데서 걷는 사람은 누구나 모두 하나님을 향해 살 것입니다.”[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκράτεια / ἐγκρατεύεσθαι
  english_pob_choice: self-control / exercise self-control
  chosen_korean: 자기절제 / 자기절제하다
  alternatives_korean:
  - 절제 / 절제하다
  - 자제 / 자제하다
  lexicon: BDAG; Lampe
  rationale: 이 단락의 반복되는 핵심어이므로 명사와 동사를 일관되게 살렸습니다. 현대 한국어에서는 ‘자기절제’가 의미를 분명히 전달하며, 선한 것과 악한 것의 대비도 유지합니다.
- source_word: δοῦλος τοῦ θεοῦ
  english_pob_choice: slave of God
  chosen_korean: 하나님의 종
  alternatives_korean:
  - 하나님의 노예
  - 하나님을 섬기는 사람
  lexicon: BDAG
  rationale: 이 책 전체의 문맥에서는 하나님께 속한 사람의 복종을 강조하지만, 본문은 한국어 독자가 즉시 읽을 수 있어야 하므로 ‘종’으로 옮겼습니다. 다만 소유·예속의 강한 뉘앙스는 본문 전체의 명령형 구조로 최대한 보존했습니다.
- source_word: μεθύσμα ἀνομίας
  english_pob_choice: lawless drunkenness
  chosen_korean: 불법한 취음
  alternatives_korean:
  - 법 없는 술취함
  - 방탕한 술취함
  lexicon: LSJ; Lampe
  rationale: 직역하면 ‘불법한 술취함’이지만, 한국어에서 ‘취음’이 지나치게 낯설 수 있어 간결하게 처리했습니다. 단순 음주가 아니라 무절제하고 법도 없는 취흥의 상태를 지시한다는 점을 살렸습니다.
- source_word: πολυτέλεια πλούτου / κλέμμα / ἀποστέρησις / ὑπερηφανία
  english_pob_choice: the extravagance of wealth / theft / defrauding / haughtiness
  chosen_korean: 재물의 사치 / 도둑질 / 착취 / 교만
