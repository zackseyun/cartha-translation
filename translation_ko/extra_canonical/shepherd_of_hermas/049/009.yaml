  text: 1. 그는 다시 나에게 많은 나무를 보여 주었고, 어떤 나무는 싹이 트고 어떤 나무는 말라붙었습니다. 그리고 그는 나에게 "이 나무들이 보이나요?"라고 말했습니다. “알겠습니다. 선생님, 어떤 것은 싹이 트고 어떤 것은 말랐습니다.”
