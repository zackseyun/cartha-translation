  text: 1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see these trees?” “I see,” I say, “sir, some sprouting and others dry.”
translation:
  language: ko
  text: '1. 그가 다시 나에게 많은 나무를 보여 주셨습니다. 어떤 나무들은 싹이 돋아 있고, 어떤 나무들은 말라 있었습니다. 그가 나에게 말씀하셨습니다. “이 나무들이 보이나요?”

    “보입니다, 선생님. 어떤 나무들은 싹이 돋아 있고, 어떤 나무들은 말라 있습니다.”'
