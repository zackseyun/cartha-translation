revisions:
- from: 2. “이 싹이 나는 나무들은 의인들이요 내세에 거하리라 내세는 의인에게는 여름이요 죄인에게는 겨울이니라 그러므로 주님의 인자하심이 비취실 때에 하나님을 섬기는 자들을 나타내시고 모든 것이 나타나리라”고 말씀하셨습니다.
  to: 2. 그가 말씀하셨습니다. “싹이 돋아나는 이 나무들은 장차 다가올 시대에 살 의인들입니다. 다가올 시대는 의인들에게는 여름이지만 죄인들에게는 겨울입니다. 그러므로 주님의 자비가 비치실 때에 하나님을 섬기는 이들이 드러날 것이며, 모두가 드러날 것입니다.”
  rationale: 원문의 직접화법 구조, 미래 지향적 분사(‘장차 … 살’), αἰών의 ‘다가올 시대’라는 표현, 그리고 ‘모두가 드러날 것이다’라는 포괄적 진술을 유지하면서 현대 표준 한국어 합쇼체로 자연스럽게 다듬었습니다. ‘모두’의 범위를 본문보다 좁히지 않았습니다.
