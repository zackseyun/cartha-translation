  source_fidelity: The draft omits the substantive force of οἱ ἔχοντες ('those who have [possessions]') and renders the passive πλουτίζονται somewhat actively. It otherwise conveys the blessing and the resulting capacity for good.
  naturalness: The two independent clauses need clear sentence division and a connective for natural modern Korean. The revised wording uses formal-polite Korean consistently.
