  language: ko
  text: 2. “그렇다면 왜 그들은 건조하고 비슷합니까?” 나는 말한다. “이 세상에서는 의인이나 죄인이 보이지 아니하고 같으니라 이 세상은 의인에게 겨울이요 죄인 중에 거할 때에는 보이지 아니함이니라”고 말씀하셨습니다.
