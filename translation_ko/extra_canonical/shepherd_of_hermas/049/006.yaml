  language: ko
  text: 2. “그러면, 주님, 왜 그 나무들은 마치 말라 있고 서로 같습니까?” 제가 말했습니다. 그가 말씀하셨습니다. “이 시대에는 의인들도 죄인들도 드러나지 않고 서로 같습니다. 이 시대는 의인들에게 겨울이기 때문입니다. 그들은 죄인들과 함께 살고 있으므로 드러나지 않습니다.”
