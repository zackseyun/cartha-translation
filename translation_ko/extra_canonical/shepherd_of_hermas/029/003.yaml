  source_fidelity: 원문의 질문은 ‘주님 안에서 신실한 아내를 둔 사람이 그 아내가 어떤 간음을 저지른 것을 발견한 경우, 그와 계속 함께 사는 남편도 죄를 짓는가’입니다. 초안은 대체로 이를 반영하지만, ‘그 여자와 동거하여’는 아내를 가리키는 αὐτῆς보다 불필요하게 거리감이 있고, 조건과 질문의 관계도 다소 불분명합니다.
  naturalness: ‘몇 가지 여쭤보겠습니다’와 ‘말해 보세요’는 현대 구어적이며, 서술 시제도 ‘말했습니다’와 ‘말합니다’가 혼재합니다. 합쇼체의 문어적 대화로 정리하면 더 자연스럽습니다.
  terminology: κύριε는 영어 POB의 “Sir”에 맞추어 두 번 모두 ‘선생님’으로 일관되게 옮겼습니다. ‘주 안에서 신실한’은 ἐν Κυρίῳ πιστήν을 충실히 반영합니다. ‘간음’과 ‘함께 살다’는 각각 μοιχεία와 συνζῆν에 적합합니다.
  issues:
