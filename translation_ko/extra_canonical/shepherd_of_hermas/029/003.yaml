  text: 나는 그에게 말했습니다. “선생님, 몇 가지를 여쭈어도 되겠습니까?” 그가 말했습니다. “말하십시오.” 내가 말했습니다. “선생님, 어떤 사람이 주님 안에서 신실한 아내를 두었는데 그 아내가 간음을 저지른 것을 발견한다면, 그 남편이 그 아내와 계속 함께 살아도 죄를 짓습니까?”
