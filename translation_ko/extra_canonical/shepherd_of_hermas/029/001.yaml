review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the sense, but it weakens the Greek image of a thought ‘rising upon the heart’ and renders ὁμοιωμάτων too vaguely as ‘모양.’
  naturalness: The draft uses obsolete and nonstandard biblical-style forms (‘말찌니라,’ ‘아니하리라’) rather than the requested modern formal-polite 합쇼체. ‘남의 아내에 관한 일’ is also unnatural and less precise than the source.
  terminology: ‘순결’ appropriately renders ἁγνείαν. ‘음행’ is retained for πορνεία without importing a narrower doctrinal definition. ‘악한 형상들’ preserves the source’s plural ὁμοιωμάτων while avoiding an interpretive expansion.
  issues:
  - severity: medium
    issue: Register is archaic rather than modern formal-polite.
    rationale: The requested target register is modern 합쇼체; the draft’s ‘말찌니라/아니하리라’ does not meet it.
  - severity: medium
    issue: The prohibition is rendered as merely ‘do not think.’
    rationale: ἀναβαινέτω ... ἐπὶ τὴν καρδίαν specifically depicts such a thought arising in or coming upon the heart; this should be retained.
  - severity: medium
    issue: ‘남의 아내에 관한 일’ and ‘악한 모양’ are imprecise.
    rationale: The former should identify a thought concerning another’s wife, and the latter should reflect the plural ‘evil likenesses/images’ more closely.
