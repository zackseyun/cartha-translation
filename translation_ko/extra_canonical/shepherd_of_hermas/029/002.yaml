  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a slave of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: ko
  text: “이 생각이 그대의 마음에 일어나면, 그대는 죄를 범하게 됩니다. 또 그와 같이 악한 다른 생각들이[a] 일어나면, 죄를 짓게 됩니다. 이 생각은 하나님의 종에게 큰 죄입니다. 누구든지 이 악한 일을 행하면 자기 자신에게 죽음을 초래합니다. 그러므로 스스로를 살피고 이 생각을 멀리하십시오. 순결이 머무는 곳에는 불법이 의로운 사람의 마음에 일어나서는 안 됩니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그와 같이 악한 다른 것들’입니다. 문맥상 앞의 ‘생각’이 생략되어 있으므로 ‘다른 생각들’로 보충했습니다.
    reason: ἕτερα οὕτως πονηρά의 생략을 한국어에서 자연스럽게 보충하되, 원문의 표현상 생략 사실을 드러냅니다.
