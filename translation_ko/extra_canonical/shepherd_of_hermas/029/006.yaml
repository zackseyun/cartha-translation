  to: “그러므로 나는 이러한 행위가 이런 식으로 이루어지도록 구실을 주는 것이 아니라, 죄를 지은 사람이 더 이상 죄를 짓지 않게 하려는 것입니다. 그러나 그가 전에 지은 죄에 관해서는 치유를 베푸실 수 있는 분이 계십니다. 그분은 모든 것에 대한 권세를 가지신 분이시기 때문입니다.”
  rationale: 원문의 부정-목적 대조(‘구실을 주는 것이 아니라 … 죄를 짓지 않게 하려는 것’)를 명확히 하고, 치유를 베푸실 수 있는 분과 그분의 보편적 권세를 자연스러운 현대 합쇼체로 옮겼습니다. 본문상 별도 주석이 필요한 본문비평적 불확실성은 없습니다.
