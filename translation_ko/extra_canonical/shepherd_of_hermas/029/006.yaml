  terminology: ἴασις는 여기서 ‘고침’보다 ‘치유’가 자연스럽고 의미 범위도 적절합니다. ἐξουσία는 ‘권세’로 옮기되, ‘권세이심’이 아니라 그 권세를 ‘가지신 분’으로 표현해야 합니다.
