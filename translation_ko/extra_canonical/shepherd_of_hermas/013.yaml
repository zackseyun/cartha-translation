base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013.yaml
  text: '“Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints [a]—these are the apostles and bishops [b] and teachers and deacons [c], who walked in the reverent dignity of God [d] and who oversaw and taught and served God’s elect with purity and reverence [e]—some have fallen asleep [f], and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.


    “And the ones drawn up from the deep [g] and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord [h].”


    “I want to know who the other stones are that are being carried from the dry land [i], lady.” She said, “Those that go into the building without being hewn [j]—the Lord approved these, because they walked in the uprightness of the Lord [k] and accomplished his commandments [l].”


    “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful [m]. But they are being admonished [n] by the angels to do good, because evil was found in them.”


    “And those whom they were casting away and throwing aside [o]—who are they?” “These are people who have sinned and want to repent [p]. For this reason they were not flung far away outside the tower, because they will be useful for the building [q], if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out [r]. But they have only this: to lie beside the tower [s].”'
translation:
  language: ko
  text: '“이제 건물에 들어가는 돌들에 관해 들으십시오. 그러므로 정사각형이고 흰색이며 자기들의 이음매에 잘 맞는 돌들은—이들은 사도들과 감독들과 교사들과 집사들입니다. 이들은 하나님의 경건한 위엄을 따라 걸었고, 하나님의 택하신 이들을 깨끗함과 경외함으로 살피고 가르치고 섬겼습니다. 그들 가운데는 이미 잠든 이들도 있고, 아직 살아 있는 이들도 있습니다. 그들은 언제나 서로 뜻을 같이했고, 서로 평강을 누렸으며, 서로의 말을 들었습니다. 그러므로 탑의 건물에서 그들의 이음매가 서로 잘 맞습니다.


    “그리고 깊은 곳에서 끌어올려 건물에 놓이며, 이미 세워진 다른 돌들과 이음매가 서로 잘 맞는 돌들은 누구입니까?” “이들은 주의 이름 때문에 고난을 받은 사람들입니다.”


    “또 마른 땅에서 옮겨져 오는 다른 돌들이 누구인지 알고 싶습니다, 부인.” 그녀가 말했습니다. “건물로 들어가되 다듬어지지 않은 돌들—이 돌들을 주님께서 인정하셨습니다. 그들이 주님의 바른 길을 따라 걸었고 그의 계명들을 이루어 냈기 때문입니다.”


    “그리고 옮겨져 와서 건물에 놓이는 이들은 누구입니까?” “그들은 믿음에 새롭고 신실한 사람들입니다. 그러나 악한 것이 그들 가운데서 드러났기 때문에, 천사들이 그들에게 선을 행하라고 권면하고 있습니다.”


    “그리고 그들이 내던지고 제쳐 두었던 이들은 누구입니까?” “이들은 죄를 지었으나 회개하기를 원하는 사람들입니다. 그러므로 그들이 회개하면 건물에 유용하게 쓰일 수 있으므로, 탑 밖 멀리 내던져지지 않았습니다. 그러므로 회개할 사람들은—회개만 한다면—믿음 안에서 강해질 것입니다. 지금, 탑이 세워지고 있을 때 회개한다면 그렇게 될 것입니다. 그러나 건물이 완성되면 더는 자리가 없고, 오히려 쫓겨날 것입니다. 다만 그들에게 남은 것은 탑 곁에 놓여 있는 것입니다.”[a][b][c][d][e][f][g][h][i][j][k][l][m][n][o][p][q][r][s]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθοι / οἰκοδομή / πύργος
  english_pob_choice: stones / building / tower
  chosen_korean: 돌들 / 건물 / 탑
  alternatives_korean:
  - 돌 / 집 / 망루
  - 돌들 / 건축물 / 탑
  lexicon: 일반 명사
  rationale: 오이코도메와 퓌르고스를 각각 ‘건물’과 ‘탑’으로 나누어, 본문의 상징 구조를 유지하면서도 자연스러운 현대 한국어로 옮겼습니다.
- source_word: σεμνότης τοῦ Θεοῦ / σεμνῶς
  english_pob_choice: reverent dignity of God / with purity and reverence
  chosen_korean: 하나님의 경건한 위엄 / 깨끗함과 경외함으로
  alternatives_korean:
  - 하나님에 대한 경건한 품위 / 정결과 경건으로
  - 하나님의 엄숙한 존엄 / 순결과 경건으로
  lexicon: σεμνότης, σεμνός
  rationale: 세므노테스를 단순한 ‘경건’이나 ‘단정함’으로 약화하지 않고, 하나님께 합당한 위엄과 경외의 태도를 함께 드러내는 표현으로 살렸습니다.
- source_word: ἐπίσκοποι / διάκονοι
  english_pob_choice: bishops / deacons
  chosen_korean: 감독들 / 집사들
  alternatives_korean:
  - 주교들 / 집사들
  - 감독자들 / 일꾼들
  lexicon: ἐπίσκοπος, διάκονος
  rationale: ἐπίσκοπος는 교회 제도 용어로 굳어진 ‘주교’보다, 프로젝트 기본어인 ‘감독’을 유지하는 편이 원문과 POB의 투명성에 맞습니다. διάκονος도 여기서는 직분명으로 읽혀 ‘집사들’이 적절합니다.
- source_word: οἱ παθόντες ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου
  english_pob_choice: the ones who suffered on account of the name of the Lord
  chosen_korean: 주의 이름 때문에 고난을 받은 사람들
  alternatives_korean:
  - 주님의 이름 때문에 고난받은 이들
  - 주의 이름으로 인해 고난을 당한 이들
  lexicon: πάσχω, ὄνομα
  rationale: ‘이름 때문에’라는 인과를 유지하되, 한국어에서 더 자연스럽고 신학적으로도 분명한 ‘주의 이름 때문에 고난을 받은 사람들’로 옮겼습니다.
- source_word: κατωρθώσαντο τὰς ἐντολὰς αὐτοῦ
  english_pob_choice: accomplished his commandments
  chosen_korean: 그의 계명들을 이루어 냈습니다
  alternatives_korean:
  - 그의 계명들을 지켰습니다
  - 그의 계명들을 실행했습니다
  lexicon: κατορθόω, ἐντολή
  rationale: POB가 ‘kept’ 대신 ‘accomplished’를 택해 행위의 성취성을 살린 점을 반영했습니다. 단순한 준수보다 ‘이루어 냈다’가 더 가깝습니다.
- source_word: νέοι εἰσὶν ἐν τῇ πίστει καὶ πιστοί
  english_pob_choice: new in the faith and faithful
  chosen_korean: 믿음에 새롭고 신실한 사람들
  alternatives_korean:
  - 믿음에 새로 들어온 이들이며 충실한 사람들
  - 믿음 안에서 어린데도 믿음직한 사람들
  lexicon: νέος, πιστός
  rationale: ‘새롭다’와 ‘신실하다’를 병렬로 유지해, 초신자와 신실함의 긴장을 함께 보존했습니다.
theological_decisions:
- issue: 교직 용어의 번역
  chosen_reading: ἐπίσκοποι를 ‘감독들’로, διάκονοι를 ‘집사들’로 옮겼습니다.
  alternative_readings:
  - 주교들 / 부제들
  - 감독자들 / 섬기는 이들
  rationale: 문헌상 초기 교회 직분 명칭을 너무 후대적 교회 용어로 고정하지 않기 위해, POB 기본 용어인 ‘감독’과 ‘집사’를 유지했습니다.
  doctrine_reference: 초기 교회 직분 이해와 용어 투명성
- issue: ‘하나님의 경건한 위엄’ 표현
  chosen_reading: σεμνότης τοῦ Θεοῦ를 ‘하나님의 경건한 위엄’으로 옮겼습니다.
  alternative_readings:
  - 하나님을 향한 경외로운 품위
  - 하나님의 단정한 품위
  rationale: 본문은 단순한 외적 품행보다 하나님 앞에서의 경외와 위엄 있는 태도를 함께 말하므로, 그 복합성을 살린 표현을 선택했습니다.
  doctrine_reference: 경건, 경외, 성품 형성
