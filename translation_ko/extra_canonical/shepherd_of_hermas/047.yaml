base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047.yaml
  text: '…to establish them in the faith.


    Therefore[f], believe God—you who, on account of your sins, have despaired of your life, and are adding sin to sin, and are burdening your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will make healing for your former transgressions[b], and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is strengthless, like the sinews of a dead man[c].


    Listen to me, then, and fear the One who is able to do all things, to save and to destroy[d]; and keep these commandments, and you will live to God.


    I say to him, “Lord, now I have been strengthened in all the righteous requirements of the Lord, because you are with me; and I know that you will cut off all the devil’s power, and we shall gain mastery over him and prevail against all his works. And I hope, Lord, that now I can keep these commandments that you have commanded, with the Lord strengthening me.”


    “You will keep them,” he says, “if the turning is toward your own city[a].


    Foolish, double‑minded, and wretched man, do you not understand that all these things are alien, and are under the authority of another? For the lord of this city will say, ‘I do not want you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’ So then, you—having fields and dwellings and many other possessions—when you are cast out by him, what will you do with your field and your house, and the rest of the things you have prepared for yourself? For the lord of this land says to you, rightly, ‘Either make use of my laws, or withdraw from my land.’ So then, what are you about to do, having…[e]'
  footnotes:
  - marker: a
    text: The Greek reads irregularly, “if the turning (ἡ κάμψαι) is to your own city.” Many editors suspect a scribal lapse (e.g., τό for ἡ, or an omitted μή). The parable that follows supports the sense of orienting toward one’s true city.
    reason: textual_variant
  - marker: b
    text: Greek ἴασιν can mean healing or cure. Some translations smooth to “forgiveness/remission,” but Hermas’s moral-therapeutic imagery is likely intentional.
    reason: lexical_alternative
  - marker: c
    text: In antiquity sinews were a metaphor for strength. Saying the devil is like the sinews of a dead man underscores utter powerlessness.
    reason: cultural_note
  - marker: d
    text: This phrasing echoes early Christian speech about God as the one able to save and to destroy (cf. echoes in James 4:12; Matt 10:28), though Hermas is not directly quoting.
    reason: cross_reference
  - marker: e
    text: The Greek text in this source slice breaks off mid-sentence here (“So then, what are you about to do, having…”); the unit continues in the next segment.
    reason: textual_variant
  - marker: f
    text: Or 'believe in God—you who, on account of your sins, have despaired of your life, and are adding sin to sin, and are burdening your life—for if you turn back'.
    reason: previous_rendering
translation:
  language: ko
  text: '…그들을 믿음 안에 굳게 세우기 위함입니다.


    그러므로 하나님을 믿으십시오. 여러분은 죄 때문에 자기 삶을 포기하게 되었고, 죄를 죄에 더하며 자기 삶을 무겁게 짓누르고 있습니다. 이는 여러분이 온 마음으로 주께 돌아와 남은 생애 동안 의를 행하고, 그의 뜻에 따라 바르게 그를 섬기면, 그분이 여러분의 이전 죄들에 대해 치유를 베푸시고, 여러분은 악마의 일들을 제압할 힘을 얻게 되기 때문입니다. 그리고 악마의 위협을 조금도 두려워하지 마십시오. 그는 죽은 사람의 힘줄처럼 무력합니다.


    그러므로 제 말을 들으십시오. 그리고 모든 것을 하실 수 있고, 살리기도 하시고 멸하기도 하시는 그분을 두려워하십시오. 이 계명들을 지키십시오. 그러면 여러분은 하나님을 향해 살게 될 것입니다.


    제가 그에게 말했습니다. “주님, 이제 저는 주님의 모든 의로운 요구에 의해 힘을 얻었습니다. 주님께서 저와 함께 계시기 때문입니다. 저는 또한 주님께서 악마의 모든 권세를 끊어 버리시리라는 것을 압니다. 그래서 우리는 그를 제압하고 그의 모든 일에 맞서 이길 것입니다. 주님, 이제는 주님께서 명하신 이 계명들을, 주님께서 제게 힘을 주시는 가운데, 제가 지킬 수 있기를 바랍니다.”


    “네가 지킬 것이다.” 그가 말했습니다. “그 돌아섬이 너의 자기 도시를 향해 있기만 하면 된다[a].


    어리석고, 마음이 두 갈래이며, 비참한 사람아, 너는 이 모든 것이 남의 것이며 다른 이의 권위 아래 있다는 것을 깨닫지 못하느냐? 이 도시의 주인은 말할 것이다. ‘나는 네가 내 도시에 머무는 것을 원하지 않는다. 오히려 이 도시에서 나가라. 네가 내 법들을 사용하지 않기 때문이다.’ 그러므로 네가 밭들과 거처들과 다른 많은 소유를 가지고 있다가 그에게서 쫓겨나면, 네 밭과 네 집과 네가 너를 위해 마련해 둔 나머지 것들을 가지고 무엇을 하겠느냐? 이 땅의 주인이 네게 이렇게 정당하게 말할 것이다. ‘내 법들을 사용하든지, 아니면 내 땅에서 물러가라.’ 그러므로 너는 어떻게 하려 하느냐, 네가 소유한…[e]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πιστεύσατε τῷ Θεῷ
  english_pob_choice: believe God
  chosen_korean: 하나님을 믿으십시오
  alternatives_korean:
  - 하나님을 신뢰하십시오
  - 하나님을 믿으십시오
  lexicon: BDAG
  rationale: 명령형 πιστεύσατε의 직접적 촉구를 살리되, 한국어에서는 자연스러운 합쇼체로 옮겼습니다. 대상은 τῷ Θεῷ이므로 ‘믿다’의 직접 목적어 형태를 유지했습니다.
- source_word: προστιθέντες ἁμαρτίαις καὶ καταβαρύνοντες τὴν ζωὴν ὑμῶν
  english_pob_choice: adding sin to sin ... burdening your life
  chosen_korean: 죄를 죄에 더하며 자기 삶을 무겁게 짓누르고 있습니다
  alternatives_korean:
  - 죄를 죄에 더하고 있습니다
  - 자기 삶을 짓누르고 있습니다
  lexicon: BDAG
  rationale: ‘죄를 죄에 더하다’의 누적적 죄책 이미지를 보존하고, καταβαρύνοντες는 단순한 무게감보다 삶을 눌러 짓누르는 동작성을 살렸습니다.
- source_word: ἴασιν
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 회복
  - 용서
  lexicon: BDAG
  rationale: 히아신은 법정적 ‘용서’보다 치료적 이미지를 띠므로, POB의 의도를 따라 ‘치유’를 유지했습니다.
- source_word: ἄτονος ... ὥσπερ νεκροῦ νεῦρα
  english_pob_choice: strengthless, like the sinews of a dead man
  chosen_korean: 무력합니다. 그는 죽은 사람의 힘줄처럼
  alternatives_korean:
  - 힘이 없습니다
  - 쇠약합니다
  lexicon: LSJ
  rationale: ἄτονος는 단순 연약함보다 ‘힘이 없음/무력함’이 적절하고, νεῦρα는 현대어 ‘신경’보다 고대 비유를 살리는 ‘힘줄’이 자연스럽습니다.
- source_word: ἡ κάμψαι εἰς τὴν ἰδίαν πόλιν
  english_pob_choice: if the turning is toward your own city
  chosen_korean: 그 돌아섬이 너의 자기 도시를 향해 있기만 하면 된다
  alternatives_korean:
  - 네가 자기 도시로 돌아서기만 하면 된다
  - 네가 자기 도시를 향해 굽어지기만 하면 된다
  lexicon: LSJ
  rationale: 전승된 그리스어가 비정상적이므로, POB의 취지를 따라 ‘돌아섬/향해’로 처리해 도시-귀향 비유를 유지했습니다.
- source_word: ἀλλότριά ἐστι, καὶ ὑπ᾽ ἐξουσίαν ἑτέρου εἰσίν
  english_pob_choice: all these things are alien, and are under the authority of another
  chosen_korean: 이 모든 것이 남의 것이며 다른 이의 권위 아래
  alternatives_korean:
  - 이 모든 것이 낯선 것이며 다른 이의 권위 아래
  - 이 모든 것이 타인의 것이며 다른 이의 권위 아래
  lexicon: BDAG
  rationale: ἀλλότρια는 단지 ‘낯선’이 아니라 소유권상 남의 것임을 뜻하므로, 이어지는 ‘주인’ 비유와 맞물리도록 ‘남의 것’으로 옮겼습니다.
theological_decisions:
- issue: ‘너의 자기 도시’와 뒤따르는 소유 비유의 방향성
  chosen_reading: ‘그 돌아섬이 너의 자기 도시를 향해 있기만 하면 된다’로 옮겨, 본문이 요구하는 방향 전환과 이후의 ‘이 도시/이 땅’ 대조를 그대로 살렸습니다.
  alternative_readings:
  - ‘네가 자기 도시로 돌아서기만 하면 된다’
  - ‘네가 자기 도시를 향해 돌이키기만 하면 된다’
  rationale: 전승 본문의 난해한 구문을 단정적으로 교정하기보다, 이어지는 비유가 가리키는 삶의 방향 전환을 드러내는 쪽을 택했습니다.
  doctrine_reference: hermeneutics / textual criticism
- issue: ‘하나님을 믿으십시오’와 ‘주께 돌아와’의 관계
  chosen_reading: 믿음의 명령과 회개의 명령을 분리하지 않고, 하나님을 믿는 것이 곧 주께 온 마음으로 돌아오는 실제적 순종으로 이어지게 번역했습니다.
  alternative_readings:
  - ‘하나님을 신뢰하십시오’
  - ‘하나님을 믿으십시오. 그러므로 회개하십시오’
  rationale: 이 문맥에서 믿음은 단순 내적 동의가 아니라 삶의 방향 전환과 계명 준수를 포함하는 충실한 응답입니다.
  doctrine_reference: repentance / faith
