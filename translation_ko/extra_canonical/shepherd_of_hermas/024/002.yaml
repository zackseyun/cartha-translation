review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 대비(검음/불빛과 핏빛/금빛)는 대체로 반영하지만, 인용부호가 ‘탑’ 앞에서 잘못 닫혀 있고, 마지막 ‘탑을 세우는 일에 유용하게 될 것이다’가 인용문 밖에 놓였습니다. 또한 ‘너희도 정결하게 되어 정결하게 되리라’는 중복으로 원문의 ‘정결하게 되고 탑 건축에 쓸모 있게 됨’을 정확히 옮기지 못합니다. ‘ἐν αὐτοῖς’의 복수 지시 대상은 문맥상 앞선 불/피의 재난과 관련되나 단정하기 어려우므로 ‘그것들 가운데서’로 보존했습니다.
  naturalness: 초안의 ‘불타고 붉은 것’, ‘황금 부분’, ‘타워 건설에 유용합니다’는 현대 표준 한국어 합쇼체로 다소 부자연스럽거나 문체가 혼재합니다. ‘불빛과 핏빛을 띤 것’, ‘금빛 부분’, ‘탑을 세우는 일에 쓸모 있게 될 것입니다’로 다듬었습니다.
  terminology: ‘κόσμος’는 ‘세상’, ‘δοκιμάζεται’는 ‘시험/연단을 받다’, ‘σκωρία’는 ‘찌꺼기’, ‘οἰκοδομὴ τοῦ πύργου’는 ‘탑을 세우는 일’로 일관되게 옮겼습니다. 교파적 해석을 덧붙이지 않았습니다.
  issues:
  - severity: high
    issue: 인용부호와 문장 경계 오류
    rationale: 원문에서 발화는 ‘탑을 세우는 일에 쓸모 있게 될 것이다’까지 계속되지만, 초안은 인용부호를 앞서 닫아 마지막 절을 발화 밖으로 분리했습니다.
  - severity: high
    issue: ‘정결하게’의 부당한 반복 및 결말 누락
    rationale: 초안은 ‘정결하게 되어 정결하게 되리라’라고 반복하며, 원문의 ‘탑 건축에 쓸모 있게 될 것’이라는 결말을 발화 안에서 누락·왜곡했습니다.
  - severity: medium
    issue: ‘그것으로 시험을 받고’의 지시 대상 처리
    rationale: 그리스어 ‘ἐν αὐτοῖς’는 복수형으로 되어 있어 단수 ‘그것’으로 축소하지 않고 ‘그것들 가운데서’로 옮겨 문법적 모호성을 보존하는 편이 안전합니다.
  - severity: low
    issue: 현대적 자연스러움과 등록
    rationale: ‘타워 건설에 유용합니다’는 외래어와 종결법이 앞 문맥의 격식 있는 발화와 어울리지 않습니다.
  revised_text: “들으십시오. 검은 것은 여러분이 사는 이 세상입니다. 불빛과 핏빛을 띤 것은 이 세상이 피와 불로 멸망해야 하기 때문입니다. 금빛 부분은 이 세상을 피하여 나온 여러분입니다. 금은 불로 시험을 받아 쓸모 있게 되듯이, 여러분도 그것들 가운데서 시험을 받고 있습니다. 그러므로 그 가운데 남아 그것에 불타는 이들은 정결하게 될 것입니다. 금이 자기 찌꺼기를 버리듯이, 여러분도 모든 슬픔과 곤경을 버리고 정결하게 되어 탑을 세우는 일에 쓸모 있게 될 것입니다.”
  revised_footnotes:
  - marker: a
    text: ‘그것들 가운데서’는 그리스어 복수형 표현을 따른 것입니다. 정확한 지시 대상은 문맥상 앞서 언급된 재난의 요소들과 관련되지만, 본문은 이를 더 명시하지 않습니다.
    reason: 그리스어 지시어의 수와 해석상 여지를 보존하기 위해서입니다.
  revision_rationale: 원문의 발화 범위와 문장 구조를 회복하고, 중복된 표현을 삭제했습니다. 금의 불 시험과 신자들의 시험이라는 비유, 정결함, 탑 건축에 쓸모 있게 됨을 빠짐없이 현대 표준 한국어 합쇼체로 옮겼습니다. 지시 대상이 불확정적인 복수 표현은 본문과 각주에서 그 모호성을 보존했습니다.
