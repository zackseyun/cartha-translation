  text: 나는 그녀에게 그 짐승의 머리에 있는 네 가지 색깔에 대해 물었습니다. 그러나 그녀는 나에게 "또 그런 일에 대해 궁금하시군요"라고 대답했습니다. "그렇습니다, 아가씨." 나는 말한다. "이것이 무엇인지 나에게 알려 주십시오."
