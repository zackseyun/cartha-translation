  text: “그러므로 성도들의 귀에 대고 말하기를 그치지 마십시오. 여러분에게도 다가올 큰 환난의 표상이 있습니다. 그러나 여러분이 원한다면 아무것도 없을 것입니다. 앞서 기록된 것들을 기억하십시오.”
