base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003.yaml
  text: 'But it is not for this that God is angry with you, but so that you may turn back your household[a], which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.


    But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and set you on a foundation in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word day by day[e] prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent[f] with their whole heart, they will be written in the books of life[b] with the holy ones[g].


    After these words of hers ceased, she says to me, “Do you wish to hear me reading?” And I say, “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous things which I was not able to remember; for all the words were terrifying—things a human being is not able to bear. So I remembered the last words, for they were beneficial and gentle for us:


    “Behold, the God of hosts[c], who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters[d], and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”'
  footnotes:
  - marker: h
    text: The Greek text reads ἡμᾶς (us), a common itacism for ὑμᾶς (you). The context clearly refers to Hermas and his wife.
    reason: textual_variant
  - marker: a
    text: Or 'After she had finished these words,'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러나 하나님께서 당신에게 진노하시는 것은 이 때문이 아니라, 주님과 우리, 곧 그들의 부모에게 죄를 지은 당신의 집안을 돌이키게 하시려는 것입니다. 당신이 자녀들을 사랑하는 사람으로서 당신의 집안을 훈계하지 않고, 그것이 심하게 망가지도록 내버려 두었으므로, 주님께서 당신에게 진노하십니다. 그러나 그분은 당신의 집안에 있었던 모든 이전의 악을 고쳐 주실 것입니다. 그들의 죄와 불법 행위 때문에 당신도 세상일들에 의해 무너졌기 때문입니다.


    주님의 풍성한 긍휼이 당신과 당신의 집안에 자비를 베푸셨고, 그분은 당신을 강하게 하시고 자기의 영광 안에 당신을 세우실 것입니다. 그러므로 게으르지 말고, 힘을 내어 당신의 집안을 강하게 하십시오. 대장장이가 자기가 만드는 일을 망치로 두드리며 자기가 뜻하는 것을 이루듯이, 의로운 말도 날마다 모든 악을 이겨 냅니다. 그러므로 자녀들을 훈계하는 일을 그치지 마십시오. 나는 그들이 마음을 다해 회개하면, 성도들과 함께 생명의 책들에 기록될 것을 알고 있습니다.


    이 말들을 그분이 그치신 뒤에, 그분이 제게 말씀하셨습니다. “내가 읽는 것을 듣고 싶으십니까?” 그러자 제가 말했습니다. “그러고 싶습니다, 부인이시여.” 그분이 제게 말씀하셨습니다. “듣는 사람이 되어서, 하나님의 영광들을 들으십시오.” 저는 크고 놀라운 일들을 들었으나, 그것들을 기억할 수 없었습니다. 모든 말이 두려웠기 때문입니다. 사람은 그것들을 감당할 수 없습니다. 그래서 저는 마지막 말들을 기억했는데, 그것들은 우리에게 유익하고 온화했기 때문입니다.


    “보십시오, 만군의 하나님께서는 보이지 않는 능력과 강한 능력, 그리고 그분의 큰 이해로 세상을 창조하시고, 그분의 영광스러운 계획으로 그분의 창조물에 아름다움을 더하셨으며, 그분의 강한 말씀으로 하늘을 고정하시고 물 위에 땅을 세우셨으며, 자기의 지혜와 섭리로 자기의 거룩한 교회를 창조하시고, 또한 그것을 복 주셨습니다. 보십시오, 그분은 하늘들과 산들과 언덕들과 바다들을 옮기고 계시며, 그의 택하신 이들에게는 모든 것이 평탄하게 됩니다. 이는 그들이 큰 믿음으로 받아들인 하나님의 규례들을 지킬 경우, 그분께서 많은 영광과 기쁨과 함께 약속하신 그 약속을 그들에게 주시려는 것입니다.”[a][b][c][d][e][f][g][h]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  english_pob_choice: household
  chosen_korean: 집안
  alternatives_korean:
  - 가정
  - 집
  - 가문
  lexicon: BDAG; LSJ
  rationale: 이 문맥에서는 가족 구성원 전체와 그 질서를 가리키므로, 한국어에서는 ‘집안’이 가장 자연스럽게 사회적 범위를 드러냅니다.
- source_word: ἐπιστρέψῃς
  english_pob_choice: turn back
  chosen_korean: 돌이키게 하시려는 것입니다
  alternatives_korean:
  - 돌아오게 하시려는 것입니다
  - 회복하게 하시려는 것입니다
  lexicon: BDAG
  rationale: 단순 이동이 아니라 도덕적·관계적 전환을 뜻하므로 ‘돌이키다’를 택했고, 목적절 구조를 살렸습니다.
- source_word: νουθετέω
  english_pob_choice: admonish
  chosen_korean: 훈계하다
  alternatives_korean:
  - 권면하다
  - 경고하다
  - 가르치다
  lexicon: BDAG
  rationale: 자녀를 향한 도덕적 훈계를 가리키므로, 현대 합쇼체에서 자연스럽고 강도도 유지되는 ‘훈계하다’가 적절합니다.
- source_word: ἡ πολυσπλαγχνία
  english_pob_choice: abundant compassion
  chosen_korean: 풍성한 긍휼
  alternatives_korean:
  - 큰 자비
  - 넘치는 긍휼
  - 풍부한 자비
  lexicon: BDAG
  rationale: πολυ-의 증대 의미를 ‘풍성한’으로 살리고, σπλάγχνα 계열의 정서적 자비를 교회 언어에 맞는 ‘긍휼’로 옮겼습니다.
- source_word: Θεὸς τῶν δυνάμεων
  english_pob_choice: God of hosts
  chosen_korean: 만군의 하나님
  alternatives_korean:
  - 하늘의 군대의 하나님
  - 권능의 하나님
  - 만군의 주
  lexicon: BDAG; LSJ
  rationale: LXX 계열 호칭으로서 ‘hosts’를 한국어 성경의 익숙한 ‘만군’으로 옮기되, 본문에 나온 Θεός를 살려 ‘하나님’을 유지했습니다.
theological_decisions:
- issue: ἐκκλησία의 번역
  chosen_reading: 교회
  alternative_readings:
  - 회중
  - 모임
  rationale: 이 본문은 2세기 기독교 공동체를 가리키므로, 제도적·신앙공동체적 의미를 함께 담는 ‘교회’가 가장 적절합니다.
  doctrine_reference: POB terminology policy — ecclesial context carve-out
- issue: βίβλους τῆς ζωῆς의 복수형 보존
  chosen_reading: 생명의 책들
  alternative_readings:
  - 생명책
  - 생명책에
  rationale: 그리스어 복수형 βίβλους를 평준화하지 않고 보존하여, 전승된 텍스트의 형식을 그대로 드러냈습니다.
  doctrine_reference: Transparency policy — preserve source plurality
- issue: μετανοήσωσιν의 번역
  chosen_reading: 회개하다
  alternative_readings:
  - 마음을 바꾸다
  - 돌이키다
  rationale: 구체적 죄와 불법 행위가 언급되므로, 단순한 심리 변화보다 윤리적 전환을 뜻하는 ‘회개하다’가 가장 적합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — μετανοέω'
