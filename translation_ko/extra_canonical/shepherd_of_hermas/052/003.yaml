  source_fidelity: 개정이 필요합니다. 초안은 핵심 내용을 대체로 반영하지만, 첫 문장에서 성령과 하나님의 문법적 역할이 혼동되어 있고, 6절에서 육신을 가리키는 여성 단수 대명사를 ‘그’로 처리하여 주체가 불명확해졌습니다. 또한 하나님께서 그 육신을 성령의 동반자로 택하셨다는 명시적 의미가 약화되었습니다.
  naturalness: 현대 표준어 합쇼체로 문장을 재구성하고, 반복되는 ‘이 육신’을 필요한 범위에서 ‘그 육신’으로 정리했습니다. ‘성령을 받아’는 원문의 ‘성령을 지닌 채/성령이 거하신’보다 의미가 달라져 수정했습니다.
  terminology: πνεῦμα τὸ ἅγιον은 ‘성령’, σάρξ은 문맥상 ‘육신’, κοινωνός는 ‘동반자’로 옮겼습니다. ‘선재하시고’는 προόν의 의미를 유지합니다. 대괄호 속 ‘[주님]’은 전승상 불확실한 독법을 보존했습니다.
  issues:
