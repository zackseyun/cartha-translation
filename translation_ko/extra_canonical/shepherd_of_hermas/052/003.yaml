revisions:
- from: 선재하시고 모든 피조물을 창조하신 성령께서 하나님께서 원하시는 대로 육신에 거하게 하신 것입니다. 그러므로 성령이 거하시는 이 육신은 성령을 잘 섬기며 겸허와 순결함으로 행하여 조금도 성령을 더럽히지 아니하였느니라. 그러므로 그가 선하고 순전하게 행하고 성령과 함께 수고하며 모든 일에 협력하여 강하고 담대히 행하였으므로 성령의 동역자로 택하셨으니 이 육신의 행실은 [주]를 기쁘시게 하였으니 이는 이 육신이 성령을 받아 땅에서 더럽혀지지 아니하였음이라.
  to: '선재하시고 모든 피조물을 창조하신 성령을 하나님께서는 자신이 원하신 육신 안에 거하게 하셨습니다. 그러므로 성령이 거하신 이 육신은 겸허와 순결 가운데 살아가며 성령을 잘 섬겼고, 조금도 성령을 더럽히지 않았습니다.


    그러므로 그 육신이 선하고 순결하게 살아가고, 성령과 함께 수고하며 모든 일에서 협력하고, 강하고 용감하게 처신하였으므로, 하나님께서는 그 육신을 성령의 동반자로 택하셨습니다. 그 육신의 삶이 [주님]을 기쁘시게 하였기 때문입니다. 그 육신은 성령을 모신 채 땅 위에서 더럽혀지지 않았습니다.'
  rationale: 원문의 문법 관계를 분명히 하여 하나님이 성령을 육신에 거하게 하시고, 그 육신을 성령의 동반자로 택하신다는 흐름을 살렸습니다. 육신을 여성 단수로 받는 대명사의 지시 대상도 명확히 했으며, 논쟁적·불확실한 ‘[주님]’ 독법은 해석적으로 확정하지 않고 대괄호 및 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
