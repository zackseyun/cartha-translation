    rationale: εἵλατο는 하나님을 주어로 하여 그 육신을 성령과의 κοινωνός로 택하셨다는 뜻입니다. 초안은 ‘택하셨으니’의 주어가 분명하지 않습니다.
  - severity: medium
    issue: ‘성령을 받아’가 ‘성령이 거하심/성령을 모심’을 대체함
    rationale: ἔχουσα τὸ πνεῦμα τὸ ἅγιον은 성령을 지닌 상태를 말하며, 수령 행위로 한정하지 않는 편이 정확합니다.
