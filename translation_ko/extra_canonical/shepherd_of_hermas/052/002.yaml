  - severity: high
    issue: ‘보좌로 삼으셨으니’
    rationale: σύμβουλον은 ‘조언자/고문’이지 ‘보좌’가 아닙니다. 또한 원문은 주께서 아들과 천사들을 조언자로 취하신 일을 말합니다.
  - severity: medium
    issue: 문체와 인용부호
    rationale: ‘주셨느니라’, ‘들으라’는 현대 합쇼체가 아니며, 시작된 직접 인용문이 닫히지 않았습니다.
