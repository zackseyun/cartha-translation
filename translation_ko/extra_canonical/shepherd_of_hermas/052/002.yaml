revisions:
- from: 그러므로 그분께서는 백성의 죄를 깨끗하게 하시고 생명의 길을 보이시며 아버지께 받은 율법을 그들에게 주셨느니라. “보시다시피 그는 만민의 주가 되사 아버지께 모든 권위를 받으셨고 주께서 종의 기업에 대하여 그 아들과 영광의 천사들을 보좌로 삼으셨으니 들으라.
  to: 그러므로 그분께서는 백성의 죄를 깨끗하게 하시고 그들에게 생명의 길들을 보이셨으며, 자신의 아버지에게서 받으신 율법을 그들에게 주셨습니다. 그가 말했습니다. “보십시오. 그분 자신은 자신의 아버지에게서 모든 권위를 받으셔서 그 백성의 주이십니다. 또 주께서 그 종의 상속에 관하여 자신의 아들과 영광스러운 천사들을 조언자로 삼으신 일에 대해서는, 들으십시오.”
  rationale: 원문의 범위를 보존하여 ‘백성’과 ‘그 종’을 유지하고, 조언자를 뜻하는 σύμβουλον을 정확히 반영했습니다. 서술과 명령을 현대 격식체 합쇼체로 고쳤으며 직접 인용의 종결을 표시했습니다.
