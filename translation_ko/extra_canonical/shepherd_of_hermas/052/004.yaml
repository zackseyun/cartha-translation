revisions:
- from: 그러므로 하나님께서 아들과 영광의 천사들을 모사로 삼으셨으니 이는 이 육체도 흠 없이 성령을 섬겨 거할 곳을 얻게 하시고 섬김의 상을 잃지 않게 하려 하심이니라. 성령이 거하시는 더럽지 않고 더러움이 없는 모든 육체는 상을 받을 것입니다. 이 비유에 대한 해석도 당신에게 있습니다.”
  to: 그러므로 그는 아들과 영광의 천사들을 조언자로 삼으셨습니다. 이는 이 육체도 성령을 흠 없이 섬겼으므로 거할 어떤 곳을 얻게 하시고, 그 섬김의 보상을 잃어버린 것으로 여겨지지 않게 하려는 것이었습니다. 성령께서 거하셨던, 더럽혀지지 않고 흠 없이 발견되는 모든 육체는 보상을 받을 것입니다. 이제 이 비유의 해석도 알게 되었습니다.”
  rationale: The revision avoids specifying an implicit subject, renders the purpose and passive sense of the Greek more closely, distinguishes the two purity terms, preserves the perfect sense of the Spirit’s dwelling, and uses modern formal-polite Korean. No footnote is needed because the source’s wording is sufficiently represented without resolving broader theological questions.
