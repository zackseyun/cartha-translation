base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010.yaml
  text: '1[1]. “What,” I said, “did they endure?” She says, “Listen: scourges, prisons, great afflictions[2], crucifixions, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”


    2. “But you are very eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”


    3. After she had said these things, she wanted to depart; but I fell at her feet and asked her by the Lord to show me the vision that she had promised me.


    4. And again she took hold of my hand, raised me up, and seated me on the plaited bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square-cut, shining stones?”


    5. The tower was being built foursquare by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.


    6. The stones hauled up from the deep they set, every one, into the building just as they were; for they were fitted and matched the jointing with the other stones, and so were cemented to one another, so that their joint was not visible. The construction of the tower appeared as if it had been built from a single stone.


    7. But of the other stones being brought from the dry land, some they were rejecting, and some they were putting into the building; others they were cutting and throwing far from the tower.


    8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others had been truncated, others were white and round, not fitting for the building.


    9. And I saw other stones being hurled far from the tower and coming into the road, and not remaining in the road but rolling into the trackless places; others falling onto a fire and being burned; others falling near waters and not being able to roll into the water[13][12][11][10][9][8][7][6][5][4][3], though they wanted to roll and come into the water.'
  footnotes:
  - marker: '1'
    text: “Crucifixions” translates σταυρούς; some prefer “crosses” as metonymy for the punishment.
    reason: lexical_alternative
  - marker: '2'
    text: “Because of the Name” is early Christian idiom for suffering on account of Jesus’ name; the Greek leaves the referent implicit.
    reason: cultural_note
  - marker: '3'
    text: “Sanctuary” renders ἁγίασμα; alternatives include “holy place” or “sacred precinct.”
    reason: lexical_alternative
  - marker: '4'
    text: “Not double‑minded” translates μὴ διψυχοῦντες; alternatives include “not wavering.” The term is a stock vice in Hermas.
    reason: lexical_alternative
  - marker: '5'
    text: “Up to this day” (εἰς ταύτην τὴν ἡμέραν) can also be read “as of this day.”
    reason: lexical_alternative
  - marker: '6'
    text: “Plaited bench” (συμπλέσιον) refers to seating made of interlaced material (e.g., twigs or rushes).
    reason: cultural_note
  - marker: '7'
    text: 'Some witnesses include an emphatic “You,” here: “[You,] look …”.'
    reason: textual_variant
  - marker: '8'
    text: “Foursquare” renders ἐν τετραγώνῳ; it may also be translated “in a square.”
    reason: lexical_alternative
  - marker: '9'
    text: “Myriads” (μυριάδες) literally means tens of thousands; here it conveys an immense number.
    reason: cultural_note
  - marker: '10'
    text: “Scabby” renders ἐψωριακότες (from ψώρα, scab/mange).
    reason: cultural_note
  - marker: '11'
    text: '“Truncated” renders κεκολοβωμένοι; alternatives: “maimed,” “cut short.”'
    reason: lexical_alternative
  - marker: '12'
    text: '“Trackless places” translates ἀνοδία (lit. ‘no‑road’); also possible: “pathless places.”'
    reason: lexical_alternative
  - marker: '13'
    text: Wild beasts (θηρία) evokes execution by animals in Roman arenas.
    reason: cultural_note
translation:
  language: ko
  text: '1. 내가 말했습니다. “그들이 무엇을 견디어 냈습니까?” 그녀가 말했습니다. “들으십시오. 채찍질과 감옥과 큰 환난과 십자가형과 들짐승들입니다 — 이름 때문에 말입니다. 그러므로 성소의 오른쪽 부분은 그들에게, 그리고 이름 때문에 고난을 받는 누구에게나 속합니다. 그러나 나머지 사람들에게는 왼쪽 부분이 속합니다. 그러나 오른쪽에 앉은 사람들과 왼쪽에 앉은 사람들 모두에게 선물은 같고 약속도 같습니다 — 다만 오른쪽에 앉은 이들은 거기에 앉아 어떤 영광을 가지고 있습니다.”


    2. “그런데 당신은 그들과 함께 오른쪽에 앉기를 몹시 원하고 있습니다. 그러나 당신의 부족함이 많습니다. 그래도 당신은 당신의 부족함에서 깨끗하게 될 것이며, 두 마음을 품지 않는 모든 사람도 오늘까지의 모든 죄에서 깨끗하게 될 것입니다.”


    3. 그녀가 이렇게 말하고 나서 떠나려고 하였습니다. 그러나 나는 그녀의 발 앞에 엎드려, 주님께 걸어 그가 내게 약속한 환상을 보여 달라고 청했습니다.


    4. 그러자 그녀가 다시 내 손을 잡아 일으키고, 왼쪽의 짜 맞춘 의자에 나를 앉혔으며, 그녀 자신은 오른쪽에 앉았습니다. 그리고 밝은 막대기를 들어 올리며 내게 말했습니다. “당신은 큰 것을 봅니까?” 내가 그녀에게 말했습니다. “여주인님, 저는 아무것도 보지 못합니다.” 그녀가 내게 말했습니다. “[당신은] 보십시오 — 당신 앞에 물 위에 지어지고 있는, 네모지게 다듬은 빛나는 돌들로 된 큰 탑이 보이지 않습니까?”


    5. 탑은 그녀와 함께 온 여섯 젊은이들이 네모반듯하게 세우고 있었고, 다른 수많은 사람들이 돌들을 나르고 있었습니다. 어떤 돌들은 깊은 곳에서, 어떤 돌들은 땅에서 가져와 그 여섯 젊은이들에게 건네주었습니다. 그러면 그들이 그것을 받아 지었습니다.


    6. 깊은 곳에서 끌어올린 돌들은 하나하나 그대로 건물에 놓았습니다. 그것들은 다른 돌들과 맞물리고 결합이 어울렸기 때문이며, 그래서 서로 붙어 그 이음새가 보이지 않았습니다. 탑의 건축은 마치 한 돌로 지어진 것처럼 보였습니다.


    7. 그러나 마른 땅에서 가져오는 다른 돌들 가운데서는 어떤 것은 거절하고, 어떤 것은 건물에 넣었으며, 또 어떤 것은 잘라 탑에서 멀리 던졌습니다.


    8. 또 다른 많은 돌들이 탑 둘레에 놓여 있었고, 그들은 그것들을 건물에 쓰지 않았습니다. 그 가운데 어떤 것들은 딱지투성이였고, 어떤 것들은 금이 가 있었고, 어떤 것들은 잘려 나갔고, 어떤 것들은 희고 둥글었는데, 건물에 맞지 않았기 때문입니다.


    9. 나는 또 다른 돌들이 탑에서 멀리 내던져져 길로 들어오는 것을 보았습니다. 그러나 그것들은 길에 머물지 않고 길 없는 곳으로 굴러갔습니다. 또 어떤 것들은 불 위에 떨어져 타 버렸고, 또 어떤 것들은 물 가까이 떨어졌으나 물속으로 굴러 들어갈 수 없었습니다 — 비록 그것들이 물속으로 굴러 들어가고 싶어 하였고, 물로 가고 싶어 했지만 말입니다.[a][b][c][d][e][f][g]'
  philosophy: optimal-equivalence
