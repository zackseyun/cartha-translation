theological_decisions:
- issue: 이름 때문에 고난받는 이들의 지위와 보상
  chosen_reading: 오른쪽/왼쪽의 구분은 보상의 차등이 아니라 영예의 차이로만 표현하고, 선물과 약속은 동일하다고 옮겼습니다.
  alternative_readings:
  - 오른쪽이 더 높은 구원 상태를 뜻한다
  - 왼쪽은 열등한 신분을 뜻한다
  rationale: 본문이 분명히 ‘선물’과 ‘약속’은 같다고 말하므로, 차이를 과장하지 않고 ‘어떤 영광’만 남겼습니다.
  doctrine_reference: Hermas의 도덕-회개적 보상 언어
