  yaml_path: translation/extra_canonical/shepherd_of_hermas/050.yaml
  text: '"Have you come?" I say[e], "Because, sir, I am keeping a station[a]."


    "What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."


    He says, "You do not know how to fast to the Lord, nor is this useless fast that you fast to him a fast."


    I say, "Why, sir, do you say this?"


    He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds[f]. So the slave took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.


    "After a time the master of the slave [and of the field][b] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out[c], he rejoiced greatly over his slave on account of his deed. Summoning again his friends and his son, the master announced to them the deed the slave had done with his portions[d] which he had received; and they approved all the more that the slave should become co-heir with his son."'
  footnotes:
  - marker: a
    text: 'Station (Latin statio): an appointed fast or vigil day in early Christian practice.'
    reason: cultural_note
  - marker: b
    text: The bracketed phrase "[and of the field]" indicates textual uncertainty in the source.
    reason: textual_variant
  - marker: c
    text: The source shows bracketed or truncated words here; the sense is that all the weeds had been pulled up.
    reason: textual_variant
  - marker: d
    text: 'Greek ἐπὶ τοῖς ἐδέσμασιν αὐτοῦ οἷς ἔλαβεν: literally, "upon/with the portions he had received"; i.e., in regard to or using the food portions allotted to him.'
    reason: lexical_alternative
  - marker: e
    text: Or 'He says to me, "Have you come?"'.
    reason: previous_rendering
  - marker: f
    text: Or 'with the portions[d] he had received'.
    reason: previous_rendering
translation:
  language: ko
  text: '"오셨습니까?" 제가 말했습니다. "왜냐하면, 선생님, 저는 금식 중입니다."


    그가 말했습니다. "금식이 무엇이냐?" 제가 말했습니다. "선생님, 저는 금식합니다." 그가 말했습니다. "그렇다면 네가 금식하고 있는 이 금식은 무엇이냐?" 제가 말했습니다. "선생님, 저는 늘 해 오던 대로 금식합니다."


    그가 말했습니다. "너희는 주님께 금식하는 것이 무엇인지 알지 못하는구나. 또한 너희가 그분께 금식한다고 생각하는 이 쓸모없는 금식은 금식이 아니다."


    제가 말했습니다. "왜, 선생님, 그렇게 말씀하십니까?"


    그가 제게 말했습니다. "내가 네게 말한다. 이것은 네가 주님께 금식하고 있다고 생각하는 종류의 금식이 아니다. 비유를 들어 설명하겠다. 잡초가 없는 포도원은 더 많은 열매를 맺고, 잡초에 질식되지도 않는다. 그러므로 종은 [자기 도구를] 들고 포도원을 파고, 포도원 안에 있던 모든 잡초를 뽑아냈습니다. 그리하여 그 포도원은 잡초가 그를 질식시키지 않아 매우 아름답고 무성하게 되었습니다.


    "얼마 후 종의 주인 [그리고 밭의 주인]이 와서 포도원으로 들어갔습니다. 그리고 그 포도원이 보기 좋게 울타리가 쳐지고, 또 파헤쳐져 있으며, [모든] 잡초가 뽑혀 있는 것을 보고, 자기가 받은 자기의 몫으로 그 종이 한 일 때문에 크게 기뻐했습니다. 그러고는 다시 자기 친구들과 자기 아들을 불러 모아, 주인이 그들에게 자기가 받은 음식 몫들로 하여 그 종이 행한 일을 알렸습니다. 그러자 그들은 그 종이 자기 아들과 함께 공동 상속자가 되어야 한다는 데 더욱더 동의했습니다."[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στατίων
  english_pob_choice: station (fast day)
  chosen_korean: 금식 중
  alternatives_korean:
  - 정해진 금식일
  - 스테이티온
  lexicon: Lampe, Patristic Greek Lexicon
  rationale: 라틴어 차용어 statio의 고유한 교회 관습을 직접 한국어로 옮기기보다, 문맥상 실제 행위인 금식을 자연스럽게 드러내되 역사적 용어는 주석 없이도 이해되도록 본문에서는 기능적으로 처리했습니다.
- source_word: νηστεία / νηστεύω
  english_pob_choice: fasting / to fast
  chosen_korean: 금식 / 금식하다
  alternatives_korean:
  - 단식 / 단식하다
  - 절식 / 절식하다
  lexicon: LSJ
  rationale: 의례적·윤리적 실천을 가리키는 기본 의미를 살려 가장 직접적인 대응인 ‘금식’을 사용했습니다.
- source_word: κύριε
  english_pob_choice: sir
  chosen_korean: 선생님
  alternatives_korean:
  - 주인님
  - 어르신
  lexicon: BDAG
  rationale: 여기서는 하나님 호칭이 아니라 스승적·존칭적 대화 상대에게 하는 공손한 호칭이므로, 한국어 대화체에서 자연스러운 ‘선생님’으로 옮겼습니다.
- source_word: δοῦλος
  english_pob_choice: slave
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 하인
  lexicon: BDAG
  rationale: 이 비유에서는 소유-봉사 관계가 분명하지만, 한국어 독자에게 지나치게 생경한 ‘노예’보다는 고전적 종속 관계를 드러내는 ‘종’이 문맥상 더 자연스럽습니다.
- source_word: συγκληρονόμον τῷ υἱῷ αὐτοῦ
  english_pob_choice: co-heir with his son
  chosen_korean: 공동 상속자가
  alternatives_korean:
  - 함께 상속을 받는 자가
  - 동반 상속자가
  lexicon: BDAG
  rationale: 상속 비유의 핵심을 보존하기 위해 ‘공동 상속자’로 옮기되, 한국어 문장 흐름에 맞게 서술형으로 풀었습니다.
theological_decisions:
- issue: κύριε의 일관 번역
  chosen_reading: 예수/하나님을 가리키는 것이 아닌 대화 상대에 대한 존칭은 ‘선생님’으로, 주님에 대한 언급은 ‘주님’으로 구분했습니다.
  alternative_readings:
  - 모든 κύριε를 ‘주님’으로 통일
  - 모든 κύριε를 ‘주인님’으로 통일
  rationale: 본문은 동일한 형태의 호격이라도 발화 대상이 다르므로, 인물 구분과 신학적 혼동을 피하기 위해 호칭을 구분했습니다.
  doctrine_reference: 발화자·수신자 구분과 호칭의 지시 대상
