base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011.yaml
  text: 'After showing me these things[1], she wanted to run off. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a crafty man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."


    She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent, they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."


    "The tower that you see being built is I, the Church, the one shown to you both now and before. Whatever[2], therefore, you wish to inquire about the tower, I will reveal to you, so that you may rejoice with the holy ones."


    I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."


    I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the Almighty and glorious Name[a][9][8][7][6][5][4][3], and is held fast by the unseen power of the Master."'
  footnotes:
  - marker: '1'
    text: Some witnesses include the clause "that they may become more cheerful, and"; others omit it.
    reason: textual_variant
  - marker: '2'
    text: '"Parables" here refers to symbolic explanations of the vision’s elements, not necessarily short teaching stories.'
    reason: cultural_note
  - marker: '3'
    text: '"Are complete" could also be rendered "are fulfilled."'
    reason: lexical_alternative
  - marker: '4'
    text: '"Church" translates Ἐκκλησία, which could also mean "assembly" or "congregation"; here it is a personified title.'
    reason: lexical_alternative
  - marker: '5'
    text: '"Holy ones" is the literal sense of ἅγιοι and corresponds to the traditional "saints."'
    reason: lexical_alternative
  - marker: '6'
    text: '"Double-minded" echoes early Christian idiom (cf. James 1:8; 4:8) for inner division or wavering.'
    reason: cross_reference
  - marker: '7'
    text: The saving "through water" strongly evokes baptism (cf. 1 Peter 3:20–21) in early Christian teaching.
    reason: cross_reference
  - marker: '8'
    text: '"Name" is capitalized to reflect the reverential use of "the Name" for God in Jewish-Christian usage.'
    reason: cultural_note
  - marker: '9'
    text: '"Master" translates δεσπότης; some English versions use "Lord" here, but this rendering keeps it distinct from κύριος earlier in the sentence.'
    reason: lexical_alternative
  - marker: a
    text: Or '"As for the tower that you see being built, I am the Church'.
    reason: previous_rendering
translation:
  language: ko
  text: '이것들을 내게 보여 준 뒤에 그녀는 떠나려 했습니다. 나는 그녀에게 말했습니다. 「부인, 이런 것들을 보았는데도 그 사정이 무엇인지 알지 못한다면, 내게 무슨 유익이 있겠습니까?」 그녀는 내게 대답하며 말했습니다. 「너는 탑에 관한 것들을 알고 싶어 하는 간교한 사람이구나.」 나는 말했습니다. 「예, 부인, 형제들에게 그것들을 전하여, 그들이 더 기뻐하고 이 일들을 들은 뒤 주님을 큰 영광 가운데 알게 하려는 것입니다.」


    그녀가 말했습니다. 「많은 사람이 듣겠지만, 들은 이들 가운데 어떤 이들은 기뻐하고 어떤 이들은 울 것입니다. 그러나 그들 가운데 이들조차도, 듣고 회개하면, 그들도 기뻐할 것입니다. 그러니 탑의 비유들을 들으십시오. 내가 모든 것을 당신에게 드러내겠습니다. 그리고 더는 계시에 관해 나를 괴롭히지 마십시오. 이 계시들은 끝이 있기 때문이며, 이미 완성되었기 때문입니다. 그러나 당신은 계시를 계속 구할 것이니, 당신은 뻔뻔한 사람입니다.」


    「당신이 건축되는 것을 보는 그 탑은 곧 나, 곧 교회입니다. 지금과 이전에 당신에게 보인 바로 그 교회입니다. 그러므로 당신이 탑에 관해 무엇을 묻고 싶든지 내가 당신에게 드러내겠습니다. 그리하여 당신이 거룩한 이들과 함께 기뻐하게 하려는 것입니다.」


    나는 그녀에게 말했습니다. 「부인, 한 번에 모든 것을 내게 드러내기에 합당한 사람으로 저를 여기셨으니, 드러내 주십시오.」 그녀가 내게 말했습니다. 「당신에게 드러낼 수 있는 것은 다 드러날 것입니다. 다만 당신의 마음은 하나님을 향하게 하고, 당신이 보는 것마다 두 마음을 품지 마십시오.」


    나는 그녀에게 물었습니다. 「왜 탑은 물 위에 세워졌습니까, 부인?」 그녀가 말했습니다. 「내가 전에 이미 당신에게 말했는데도 당신은 부지런히 찾고 있습니다. 그러므로 찾는 사람은 진리를 발견합니다. 그렇다면 왜 탑이 물 위에 세워졌는지 들으십시오. 당신의 생명이 물을 통해 구원받았고 또한 구원받을 것이기 때문입니다. 그리고 탑은 전능하시고 영광스러운 이름의 말씀 위에 기초가 놓였으며, 보이지 않는 주인의 능력으로 굳게 붙들려 있습니다.」[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  english_pob_choice: Lady
  chosen_korean: 부인
  alternatives_korean:
  - 여주인
  - 마님
  lexicon: BDAG
  rationale: 여성에게 대한 공손한 호칭을 살리되, 한국어에서 자연스럽고 품위 있는 합쇼체 호칭으로 옮겼습니다.
- source_word: πανοῦργος
  english_pob_choice: crafty
  chosen_korean: 간교한
  alternatives_korean:
  - 교활한
  - 능란한
  lexicon: LSJ
  rationale: 문맥의 약한 책망과 비꼬는 뉘앙스를 살려, 단순히 영리하다는 뜻으로 약화시키지 않았습니다.
- source_word: παραβολαί
  english_pob_choice: parables
  chosen_korean: 비유들
  alternatives_korean:
  - 비사들
  - 상징적 설명들
  lexicon: BDAG
  rationale: 이 문맥에서는 짧은 교훈담이 아니라 환상의 요소를 풀이하는 상징적 설명이므로, 한국어로는 가장 직접적인 '비유들'을 택했습니다.
- source_word: Ἐκκλησία
  english_pob_choice: Church
  chosen_korean: 교회
  alternatives_korean:
  - 회중
  - 모임
  lexicon: BDAG
  rationale: 여기서는 의인화된 한 실체로 말하므로, 제도적 뉘앙스를 살린 대문자 개념어 '교회'가 적합합니다.
- source_word: ἅγιοι
  english_pob_choice: holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도들
  - 성인들
  lexicon: BDAG
  rationale: 직역성을 유지하면서도 한국어 독자가 자연스럽게 이해하도록 '거룩한 이들'로 옮겼습니다.
- source_word: διψυχήσῃς
  english_pob_choice: double-minded
  chosen_korean: 두 마음을 품지
  alternatives_korean:
  - 의심하지
  - 흔들리지
  lexicon: BDAG
  rationale: 야고보서적 관용구를 살려 내적 분열과 흔들림을 드러내는 표현으로 옮겼습니다.
- source_word: τεθεμελίωται
  english_pob_choice: has been founded
  chosen_korean: 기초가 놓였으며
  alternatives_korean:
  - 세워졌으며
  - 기초를 두었으며
  lexicon: BDAG
  rationale: 건축 은유를 유지하면서 'founded'의 기초-설립 이미지를 자연스럽게 살렸습니다.
- source_word: παντοκράτωρ
  english_pob_choice: Almighty
  chosen_korean: 전능하시고
  alternatives_korean:
  - 전능하신
  - 만유의 주
  lexicon: BDAG
  rationale: 하나님의 수식어로 굳어진 표현을 살리되, 한국어 합쇼체 문맥에 맞게 공손형으로 옮겼습니다.
- source_word: ὄνομα
  english_pob_choice: Name
  chosen_korean: 이름
  alternatives_korean:
  - 이름(‘이름’의 대문자 의미)
  lexicon: BDAG
  rationale: 원문의 경외적 용례를 살려 '영광스러운 이름'으로 옮겼으며, 본문에서는 자연스러운 한국어를 우선했습니다.
- source_word: δεσπότης
  english_pob_choice: Master
  chosen_korean: 주인
  alternatives_korean:
  - 주
  - 주님
  lexicon: BDAG
  rationale: κύριος와 구별되는 소유·지배의 뉘앙스를 살려 '주인'으로 번역했습니다.
- source_word: ἀποκαλύπτω / ἀποκάλυψις
  english_pob_choice: reveal / revelations
  chosen_korean: 드러내다 / 계시
  alternatives_korean:
  - 밝히다 / 묵시
  - 계시하다 / 계시들
  lexicon: BDAG
  rationale: 반복되는 계시 언어를 한국어에서 가장 직접적인 종교 용어와 서술어로 대응시켰습니다.
theological_decisions:
- issue: 탑과 교회의 동일시
  chosen_reading: 탑은 말하는 여성 자신, 곧 교회와 동일시됩니다.
  alternative_readings:
  - 탑은 교회의 상징일 뿐이며 인격적 동일시는 아니다
  - 교회와 유사성을 보이는 상징적 대상이다
  rationale: 원문이 '그 탑... 곧 나, 곧 교회입니다'라고 직접 동일시하므로, 비유 수준으로 약화하지 않았습니다.
  doctrine_reference: 본문 자체의 명시적 동일시; Hermas의 상징 해석 방식
- issue: 물을 통한 구원
  chosen_reading: 세례적 함의를 살리되, 본문 의미를 '물을 통해 구원받음'으로 직역했습니다.
  alternative_readings:
  - 홍수 구원에 대한 일반적 상징
  - 단순한 정결 상징
  rationale: 초기 기독교 문맥에서 물과 구원은 세례를 강하게 환기하지만, 원문 자체는 그보다 넓게 표현하므로 본문을 과잉 해석하지 않으면서 함의를 보존했습니다.
  doctrine_reference: 초기 교회의 세례-구원 연관 전통
- issue: 두 마음을 품지 마십시오
  chosen_reading: 내적 분열과 망설임을 금하는 경고로 읽었습니다.
  alternative_readings:
  - 지적 의심 금지
  - 우유부단 금지
  rationale: διψυχία의 초기 기독교 관용구를 반영해, 단순한 지적 회의보다 윤리적·영적 분열을 더 잘 드러내는 표현으로 옮겼습니다.
  doctrine_reference: 야고보서 1:8, 4:8의 유사 용례
