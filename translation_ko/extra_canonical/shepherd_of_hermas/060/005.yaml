  rationale: 원문의 행위 주체와 지시 대상을 바로잡고, 막대의 각 상태를 일관되고 자연스러운 현대 한국어로 옮겼습니다. 특히 ‘두 부분’과 ‘세 번째 부분’은 각각 2/3와 1/3을 뜻하므로 비율을 명시했습니다.
