revisions:
- from: 어떤 사람에게서 그는 마른 가지를 받아서 마치 나방이 먹는 것처럼 먹었습니다. 천사는 그런 지팡이를 건넨 사람들에게 따로 떨어져 있으라고 명령했습니다. 어떤 사람들은 마른 막대를 주었지만 좀이 먹지도 않았습니다. 이것들 역시 그는 떨어져 있으라고 명령했다. 다른 사람들은 반쯤 마른 막대를 건네주었습니다. 그리고 이것들은 따로 서있었습니다. 다른 사람들은 반쯤 말라서 갈라진 막대를 건네주었습니다. 그리고 이것들은 따로 서있었습니다. 다른 사람들은 녹색 막대와 갈라진 막대를 건네주었습니다. 그리고 이것들은 따로 서있었습니다. 다른 사람들은 막대를 절반은 건조하고 절반은 녹색으로 건네주었습니다. 그리고 이것들은 따로 서있었습니다. 다른 사람들은 막대의 두 부분은 녹색이고 세 번째 부분은 마른 막대를 제시했습니다. 그리고 이것들은 따로 서있었습니다. 다른 사람들은 두 부분은 건조하고 세 번째 부분은 녹색으로 전달했습니다. 그리고 이것들은 따로 서있었습니다. 다른 사람들은 막대를 거의 완전히 녹색으로 건네주었지만, 막대의 끝부분만 건조된 것은 거의 없었습니다. 그리고 그들은 분열을 겪었습니다. 그리고 이것들은 따로 서있었습니다.
