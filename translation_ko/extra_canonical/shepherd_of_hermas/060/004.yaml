  language: ko
  text: 사람들에게 지팡이들을 주었던 천사가 다시 그들에게서 그것들을 돌려달라고 요구했습니다. 그들은 지팡이를 받은 대로 그에게 불려 왔고, 저마다 지팡이들을 돌려주었습니다. 주님의 천사는 그것들을 받아 살펴보았습니다.
