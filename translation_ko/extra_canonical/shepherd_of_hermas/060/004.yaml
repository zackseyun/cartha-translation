- from: 사람들에게 지팡이를 주었던 천사가 다시 지팡이를 돌려달라고 요구했습니다. 그들이 그것을 받은 대로 부르심을 받아 각각 그 지팡이를 돌려드렸느니라. 주님의 사자가 그들을 데려다가 살펴보니라
  to: 사람들에게 지팡이들을 주었던 천사가 다시 그들에게서 그것들을 돌려달라고 요구했습니다. 그들은 지팡이를 받은 대로 그에게 불려 왔고, 저마다 지팡이들을 돌려주었습니다. 주님의 천사는 그것들을 받아 살펴보았습니다.
  rationale: 원문의 행위 주체와 목적어를 바로잡아 천사가 사람들에게서 지팡이를 회수하고 그 지팡이들을 검사하는 장면을 충실히 재현했습니다. καθὼς … οὕτως의 표현은 특정 해석을 과도하게 단정하지 않도록 ‘받은 대로’로 보존했으며, 전체 문체를 현대 합쇼체로 통일했습니다.
