    issue: '''소리를 내는가?''라는 오역'
    rationale: 원문 Πῶς ... τὸ δένδρον ὑγιές ἐστι는 '그 나무가 어떻게 온전한가/건강한가'라는 뜻이며, 소리와 관련된 말이 없습니다.
  - severity: medium
    issue: 문체와 의미의 불일치
    rationale: '''건전하니라''는 현대 합쇼체와 맞지 않고, 뒤의 ''그대로 남아 있는 것''은 나무가 온전하다는 원문의 핵심 진술을 약화합니다.'
