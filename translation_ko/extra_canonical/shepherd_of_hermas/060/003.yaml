revisions:
- from: 모든 사람이 지팡이를 받은 후에 천사가 낫을 놓으니 그 나무는 내가 전에 본 것과 같이 건전하니라. 나는 속으로 놀랐다. 가지가 많이 잘려진 나무는 어떻게 소리를 내는가? 목자가 나에게 이르되, 가지가 많이 잘렸는데도 나무가 그대로 남아 있는 것을 이상히 여기지 말라. 그러나 모든 것을 볼 때까지 기다리십시오. 그러면 그것이 무엇인지 알게 될 것입니다.
  to: 모든 사람이 지팡이들을 받은 뒤에, 천사는 낫을 내려놓았습니다. 그런데 그 나무는 내가 전에 보았던 그대로 온전했습니다. 나는 속으로 놀라며 말했습니다. “그렇게 많은 가지가 잘렸는데, 어떻게 그 나무가 온전할 수 있습니까?” 목자가 제게 말했습니다. “그렇게 많은 가지가 잘렸는데도 그 나무가 온전하게 남아 있었다고 놀라지 마십시오. 모든 것을 볼 때까지 기다리십시오. 그러면 그것이 무엇인지 당신에게 밝혀질 것입니다.”
  rationale: 원문의 서술 순서와 대화 구조를 유지하면서, ὑγιές의 의미를 '온전하다'로 정확히 바로잡았습니다. '그것이 무엇인지'는 선행하는 환상의 의미를 가리키는 원문의 중성 지시를 그대로 보존했습니다.
