revisions:
- from: …온 마음을 다해. 그러면 회개하는 사람의 죄는 즉시 용서받을 수 있다고 생각합니까? 완전히는 아닙니다. 오히려 회개하는 사람은 자기 영혼을 괴롭게 하고 모든 행실에 겸손하고 담대해야 하며 온갖 환난 가운데서 슬퍼해야 합니다. 그리고 만일 그가 그에게 닥쳐오는 환난을 참는다면, 만물을 창조하시고 그것을 강하게 하신 분은 분명히 동정심을 갖고 어느 정도 치유해 주실 것입니다. 그리고 이것은 [God]이 모든 것에서 깨끗하게 회개하는 사람의 마음을 볼 때입니다.
  to: …그들의 온 마음을 다하여. 그러므로 회개하는 이들의 죄가 곧 용서된다고 생각합니까? 완전히 그렇지는 않습니다. 오히려 회개하는 사람은 자기 영혼을 괴롭게 하고, 모든 행실에서 크게 자신을 낮추며, 온갖 환난 가운데서 괴로워해야 합니다. 그에게 닥쳐오는 환난을 견디어 낸다면, 만물을 창조하시고 강하게 하신 분께서 반드시 그를 긍휼히 여기시고 어떤 치유를 주실 것입니다. 그리고 이것은 [하나님]께서 회개하는 사람의 마음이 모든 것에서 깨끗해진 것을 보실 때입니다.
  rationale: 원문의 질문 형식과 ἰσχυρῶς의 수식 관계를 바로잡고, ‘어떤 치유’라는 비한정 표현을 보존했습니다. 끝 문장은 제시된 원문과 영어 감사 기록처럼 절 단위로 끝나는 조건절이므로, 내용을 보충하지 않고 대괄호 신명 및 조건 관계만 충실하고 자연스럽게 옮겼습니다.
