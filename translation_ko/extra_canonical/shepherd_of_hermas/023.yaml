base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023.yaml
  text: 'After the beast had passed by me and I had gone forward about thirty feet[c], behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was bound with a headband, and her hair was white.


    I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Throw your cares upon the Lord, and he himself will set them right.


    Put your trust in the Lord, you double‑minded, because he is able to do all things and turns his anger away from you, but sends scourges upon you, you double‑minded. Woe to those who have heard these words and refuse to heed; it would have been preferable for them not to have been born.'
  footnotes:
  - marker: c
    text: “I knew how to escape it”—the Greek has a feminine pronoun (“her”); contextually this refers back to the “tribulation” (Greek θλῖψις, feminine) mentioned in the previous section, rather than the beast (which is neuter).
    reason: lexical_alternative
translation:
  language: ko
  text: '짐승이 내 곁을 지나가고 내가 한 사십 보쯤 앞으로 갔을 때, 보십시오, 한 처녀가 나를 맞이했는데, 마치 신방에서 나오는 사람처럼 꾸며져 있었고, 온통 흰옷에 흰 신발을 신고 있었으며, 이마까지 가려져 있었습니다. 그녀의 가리는 것은 머리띠로 묶여 있었고, 머리카락은 희었습니다.


    나는 여러분의 마음이 깨끗하고 흠이 없게 되고, 또한 여러분이 삶의 남은 날 동안 주님을 흠 없이 섬기면 그것을 피할 수 있음을 알았습니다. 여러분의 염려를 주님께 내던지십시오. 그러면 그분이 그것을 바로잡아 주실 것입니다.


    두 마음을 품은 사람들이여, 주님을 신뢰하십시오. 그분은 모든 것을 하실 수 있고, 여러분에게서 자신의 분노를 돌이키시며, 두 마음을 품은 여러분에게 채찍질을 보내십니다. 이 말을 듣고도 귀 기울이지 않는 사람들은 화가 있습니다. 그들은 차라리 태어나지 않았더라면 더 좋았을 것입니다.[c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρθένος
  english_pob_choice: virgin
  chosen_korean: 처녀
  alternatives_korean:
  - 동정녀
  - 젊은 여자
  lexicon: BDAG
  rationale: 상징적으로 순결과 긴장을 함께 지닌 인물을 가리키므로, 단순한 ‘젊은 여자’보다 ‘처녀’가 원문의 표상과 문맥을 더 잘 살립니다.
- source_word: νυμφών
  english_pob_choice: bridal chamber
  chosen_korean: 신방
  alternatives_korean:
  - 혼인방
  - 결혼방
  lexicon: BDAG
  rationale: 혼인 이미지가 분명한 고대적 표현이므로, 한국어에서도 고전적이면서도 자연스러운 ‘신방’이 적절합니다.
- source_word: κεκοσμημένη
  english_pob_choice: adorned
  chosen_korean: 꾸며져 있었습니다
  alternatives_korean:
  - 장식되어 있었습니다
  - 단장되어 있었습니다
  lexicon: BDAG
  rationale: 의도적으로 단장된 상태를 나타내므로, 외적 치장을 드러내는 표현으로 옮겼습니다.
- source_word: ὑποδήμασιν λευκοῖς
  english_pob_choice: white sandals
  chosen_korean: 흰 신발
  alternatives_korean:
  - 흰 샌들
  - 흰 버선신
  lexicon: BDAG
  rationale: 고대의 구체적 형태는 샌들이지만, 현대 한국어에서는 의미 전달이 쉬운 ‘흰 신발’로 풀고, 필요한 경우 주석으로 문화적 차이를 보완할 수 있습니다.
- source_word: μερίμνας
  english_pob_choice: cares
  chosen_korean: 염려
  alternatives_korean:
  - 근심
  - 걱정
  lexicon: BDAG
  rationale: 마음의 부담과 걱정을 포괄하는 표준적 표현으로, 영적 권면의 어조를 유지합니다.
- source_word: κατορθώσει
  english_pob_choice: will set them right
  chosen_korean: 바로잡아 주실 것입니다
  alternatives_korean:
  - 이루어 주실 것입니다
  - 성취하게 하실 것입니다
  lexicon: LSJ
  rationale: 상황을 바르게 정돈하고 올곧게 하신다는 뜻을 살려, 관계적·목회적 뉘앙스를 가진 ‘바로잡아 주다’로 옮겼습니다.
- source_word: δίψυχοι
  english_pob_choice: double-minded
  chosen_korean: 두 마음을 품은 사람들
  alternatives_korean:
  - 우유부단한 사람들
  - 흔들리는 사람들
  lexicon: BDAG
  rationale: 내적 분열과 이중성을 드러내는 표현이므로, 직역보다 한국어 관용구로 그 윤리적 긴장을 살렸습니다.
- source_word: μάστιγας
  english_pob_choice: scourges
  chosen_korean: 채찍질
  alternatives_korean:
  - 채찍
  - 징벌
  lexicon: BDAG
  rationale: 물리적 징계의 이미지가 분명하므로, 단순한 추상어보다 ‘채찍질’이 원문의 구체성을 더 잘 전달합니다.
theological_decisions:
- issue: κύριος의 번역
  chosen_reading: 문맥상 하나님/주님을 가리키는 κύριος는 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 주
  - 주인
  rationale: 경배와 순종의 대상으로 말해지는 대상이므로, 한국어 신앙어휘에서 자연스럽고 공경적인 ‘주님’이 적절합니다.
  doctrine_reference: Cartha Translation Philosophy §Contested terms
- issue: ‘분노를 돌이키시며 … 채찍질을 보내십니다’의 긴장 보존
  chosen_reading: 하나님의 진노를 거두심과 징계의 भेज임을 둘 다 그대로 살렸습니다.
  alternative_readings:
  - 징계를 완화해 표현함
  - 둘 중 하나만 강조함
  rationale: 원문은 자비와 경고를 동시에 말하므로, 그 긴장을 해소하지 않고 함께 보존하는 것이 Hermas의 권면 구조에 충실합니다.
  doctrine_reference: 본문 신학적 긴장 보존 원칙
