revisions:
- from: 그러자 주님의 천사가 면류관을 가져오라고 명령했습니다. 그리고 종려나무로 만든 것 같은 면류관을 가져왔고, 새싹과 열매가 달린 막대를 건넨 사람들에게 면류관을 씌운 다음 그들을 망대 안으로 보내었습니다. 2. 또 다른 사람들도 망대에 보내시니 곧 푸른 가지와 가지가 있으나 그 가지에 열매가 없는 자들을 내어 인장을 주셨느니라 3. 망대에 들어가는 사람들은 모두 눈처럼 흰 옷을 입고 있었습니다. 4. 푸른 지팡이를 건네준 사람들은 받은 대로 보내시고 옷과 인장을 주시며 보내시니라. 5. 천사가 이 일을 마친 후에 목자에게 이르되 내가 가노니 각 사람의 거주하기에 합당한 대로 이것을 성벽에 내보내고 그 지팡이를 주의하여 돌려보내며 너희가 지나쳐 지나가는 사람이 없도록 주의하라'고 말했습니다. “만일 누구든지 너희 앞에서 지나가면 내가 그를 제단 위에서 시험하리라.” 목자는 이 말을 하고 떠나갔습니다. 6. 목자가 나에게 말하기를, "모든 사람의 가지를 가져다가 심고, 그들 중에 누구든지 살 수 있는지 알아보자." 내가 그에게 말했습니다. “주님, 이 마른 것들이 어떻게 살 수 있습니까?” 7. 그가 나에게 대답했다. “이 나무는 버드나무인데 그 종류는 생명을 사랑합니다. 그러면 막대를 심고 약간의 수분을 받으면 그 중 많은 수가 살 것입니다. 그럼 우리도 그 위에 물을 부어보도록 할게요. 그들 중 누구라도 살 수 있다면, 나는 기뻐할 것이다. 그러나 그것이 살아 있지 않더라도 나는 태만한 사람으로 여겨지지 않을 것입니다.” 8. 그러자 목자는 각자 맡은 대로 그들을 부르라고 나에게 명령했습니다. 그들은 차례대로 와서 그들의 지팡이를 목자에게 건네주고 있었습니다. 목자는 나뭇가지를 가져다가 서열에 따라 심었습니다. 심은 뒤에는 그들에게 많은 물을 주셨고, 물 때문에 가지들이 보이지 않게 되었습니다. 9. 가지에 물을 준 후에 그가 나에게 이르되 우리가 가서 며칠 후에 다시 가서 그 가지를 다 살펴보자 이 나무를 창조하신 이가 이 나무 가지에 물을 준 자가
    살기를 원하시느니라 나도 희망하노라 이 가지가 습기를 받고 물로 물을 받은 후에 그 대다수가 살기를 원하노라
