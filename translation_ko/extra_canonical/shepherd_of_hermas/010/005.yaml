  text: 5. 그녀와 함께 온 여섯 젊은이가 정사각형 모양으로 탑을 짓고 있었습니다. 수많은 다른 사람들이 돌들을 가져오고 있었는데, 어떤 이들은 깊은 곳에서, 어떤 이들은 땅에서 가져와 그 여섯 젊은이에게 건네주고 있었습니다. 그들은 그것들을 받아 쌓고 있었습니다.
