revisions:
- from: 9. 또 나는 또 다른 돌들이 망대에서 멀리 던져져 길로 들어와 길에 머물지 아니하고 황무지로 굴러 들어가는 것을 보았습니다. 어떤 사람들은 불에 떨어져 타 죽기도 했습니다. 어떤 사람들은 물 근처에 떨어지고 물 속으로 굴러 들어갈 수 없으나 굴러 물 속으로 들어가고 싶었습니다.
  to: 9. 또 나는 다른 돌들이 망대에서 멀리 던져져 길로 들어오지만 길에 머물지 않고 길 없는 곳으로 굴러 들어가는 것을 보았습니다. 또 어떤 돌들은 불 속에 떨어져 타고 있었고, 어떤 돌들은 물가 가까이에 떨어져 물속으로 굴러 들어갈 수 없었습니다. 비록 그들은 굴러서 물속으로 들어가기를 원했지만 말입니다.
  rationale: 원문의 반복되는 ‘다른 돌들’을 일관되게 보존하고, 길·길 없는 곳·불·물이라는 환상 장면의 병렬을 유지했습니다. 물에 들어가기를 ‘원하는’ 돌이라는 원문의 의인화도 해석적으로 완화하지 않고 그대로 옮겼습니다.
