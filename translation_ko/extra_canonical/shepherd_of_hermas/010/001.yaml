revisions:
- from: 1. 나는 “그들이 무엇을 참았습니까?”라고 말했습니다. "들으십시오. 채찍질과 투옥과 큰 환난과 십자가와 들짐승은 이름을 위하여 하신 것이라 그러므로 성소의 오른편은 저희의 것이요 이름으로 말미암아 고난을 받는 자의 것은 좌편이요 나머지는 왼편에 속하였느니라 그러나 오른편에 앉은 자나 왼편에 앉은 자나 은사는 같고 약속도 같으니 오직 오른편에 앉은 자만이 거기에 앉아서 영광을 얻으리라."
