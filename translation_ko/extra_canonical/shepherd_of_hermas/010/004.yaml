  rationale: 원문의 동작 순서, 좌우의 위치, 호칭, 그리고 대괄호로 표시된 불확실한 ‘Σὺ’를 보존했습니다. 건축 중인 탑이라는 현재 진행의 의미를 명시하고, 어색한 표현을 현대 표준어 합쇼체에 맞게 다듬었습니다.
