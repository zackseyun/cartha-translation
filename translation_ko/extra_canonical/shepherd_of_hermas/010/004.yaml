revisions:
- from: 4. 그리고 다시 그녀는 내 손을 잡고 나를 일으켜 왼쪽 의자에 앉혔습니다. 그리고 그녀는 오른쪽에 앉았습니다. 그리고 그 여자는 밝은 막대를 들고 나에게 “굉장한 것을 보았느냐?”라고 말했습니다. 나는 그녀에게 “부인님, 아무것도 보이지 않습니다.”라고 말했습니다. 그녀는 나에게 이렇게 말했습니다. “[당신은] 보십시오. 당신 맞은편에 물 위에 네모지고 빛나는 돌들로 세워진 큰 탑이 보이지 않습니까?”
