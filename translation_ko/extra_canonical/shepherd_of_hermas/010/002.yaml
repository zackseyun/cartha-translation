  language: ko
  text: 2. 그러나 당신은 그들과 함께 오른편에 앉기를 몹시 바라십니다. 그러나 당신에게는 부족한 점이 많습니다. 그래도 당신은 당신의 부족한 점들에서 깨끗하게 될 것이며, 두 마음을 품지 않는 모든 사람도 오늘에 이르기까지 지은 모든 죄에서 깨끗하게 될 것입니다.
