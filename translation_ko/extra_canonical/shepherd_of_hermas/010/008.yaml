  source_fidelity: 원문의 ‘다른 많은 돌’, 망대 주위에 놓여 있음, 건축에 사용되지 않음, 그리고 네 부류의 상태를 모두 반영하도록 수정했습니다. κεκολοβωμένοι는 단순히 ‘찢겨진’ 것보다 일부가 잘려 나가거나 훼손된 돌이라는 뜻에 가깝습니다.
