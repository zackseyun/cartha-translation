  language: ko
  text: 8. 또 다른 많은 돌이 망대 주위에 놓여 있었으나, 건축에는 쓰이지 않고 있었습니다. 그 가운데 어떤 돌에는 피부병이 나 있었고, 어떤 돌에는 갈라진 틈이 있었으며, 어떤 돌은 일부가 잘려 나가 있었고, 어떤 돌은 희고 둥글어서 건축에 맞지 않았습니다.
