  terminology: ‘망대’는 이 문맥의 πύργος에 적절합니다. ἐψωριακότες는 피부병에 걸린 상태를 비유적으로 묘사하므로 ‘피부병이 난’으로 옮겨 원문의 결함 이미지를 보존했습니다.
