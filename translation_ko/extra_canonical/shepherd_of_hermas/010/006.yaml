revisions:
- from: 6. 그들은 깊은 곳에서 끌어올린 돌들을 각각 그대로 건물 안으로 들어 올렸습니다. 그 돌들은 다른 돌들과 잘 맞물려 연결되어 있어서 서로 연결되어 있어서 그 연결부가 보이지 않았습니다. 탑의 구조는 마치 하나의 돌로 지어진 것처럼 보였습니다.
  to: 6. 깊은 곳에서 끌어올린 돌들은 모두 그런 상태 그대로 건축물에 놓았습니다. 그 돌들은 잘 다듬어져 다른 돌들과의 이음새에 꼭 들어맞았으므로, 서로 붙어 이음새가 보이지 않았습니다. 탑의 건축물은 마치 하나의 돌로 지어진 것처럼 보였습니다.
  rationale: 원문의 ‘모두’, ‘그대로’, 돌들의 정확한 결합, 보이지 않는 이음새, 그리고 하나의 돌로 지어진 듯한 탑이라는 순서를 보존하면서 중복 표현과 부정확한 동작 묘사를 바로잡았습니다.
