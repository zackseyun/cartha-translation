  text: 그가 말씀하셨습니다. “내가 모든 것을 네게 설명해 주겠고, 내가 너와 나누는 모든 말을 네게 보여 주겠다. 분별의 계명들을 받은 사람은 자기 영혼을 채우고 너를 위하여 주님께 기도할 것이다.”
