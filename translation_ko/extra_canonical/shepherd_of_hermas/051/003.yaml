    rationale: 원문의 σοι와 σου는 모두 단수이며, 화자인 목자가 헤르마스에게 직접 말하는 문맥입니다. ‘너희’가 아니라 ‘네/당신’으로 번역해야 합니다.
  - severity: high
    issue: 마지막 절의 주어와 술어 왜곡
    rationale: ‘이 방법으로 행한 예배는 주님께서 선하시고…’는 원문의 ‘그렇게 행해지는 섬김은 좋고 기쁘며 주님께 받아들여진다’를 재현하지 못합니다.
  - severity: medium
    issue: ‘기쁘게 받으시게 되고’의 비문
    rationale: 원문은 제사가 하나님께 ‘받아들여진다’(δεκτή)고 하며, 하나님이 ‘기쁘게 받으시게 된다’는 구조가 아닙니다.
