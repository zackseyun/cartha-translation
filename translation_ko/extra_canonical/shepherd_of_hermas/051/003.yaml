  source_fidelity: 초안은 조건절의 핵심 의미와 ‘하나님께 받아들여짐’, ‘기록됨’이라는 큰 흐름을 반영하지만, 원문의 2인칭 단수(σοι, σου)를 복수 ‘너희’로 바꾸었고, 마지막 술어들의 주어·의미 관계가 무너져 있습니다. 원문은 ‘이와 같이 행해지는 봉사/섬김’이 ‘좋고 기쁘며 주님께 받아들여진다’고 말합니다.
  naturalness: 초안의 ‘하나님 앞에 기쁘게 받으시게 되고’는 주체와 피동 표현이 어색하며, ‘주님께서 선하시고 기뻐하시고 기뻐하시는 것’은 문법적으로도 의미상으로도 자연스럽지 않습니다. 현대 표준어 합쇼체로 문장을 정리할 필요가 있습니다.
  terminology: θυσία는 문맥상 ‘제사’로, λειτουργία는 예배로 지나치게 특정하지 않고 ‘섬김’으로 옮겼습니다. ἱλαρά는 ‘기쁘며’로 반영했습니다. θεός와 κύριος의 구별은 각각 ‘하나님’과 ‘주님’으로 유지했습니다.
  issues:
