  text: “그러므로 네가 내가 네게 명령한 대로 이렇게 금식을 마치면, 네 제사는 하나님께 받아들여질 것이며, 이 금식은 기록될 것입니다. 또 이와 같이 행해지는 섬김은 좋고 기쁘며 주님께 받아들여집니다.”
