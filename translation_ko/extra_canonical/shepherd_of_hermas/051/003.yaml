- from: “그러므로 너희가 내가 명령한 대로 금식을 마치면 너희 제물은 하나님 앞에 기쁘게 받으시게 되고 이 금식은 기록되게 되리니 이 방법으로 행한 예배는 주님께서 선하시고 기뻐하시고 기뻐하시는 것이니라.
  to: “그러므로 네가 내가 네게 명령한 대로 이렇게 금식을 마치면, 네 제사는 하나님께 받아들여질 것이며, 이 금식은 기록될 것입니다. 또 이와 같이 행해지는 섬김은 좋고 기쁘며 주님께 받아들여집니다.”
  rationale: 원문의 단수 호칭을 보존하고, ‘제사—하나님께 받아들여짐’, ‘금식—기록됨’, ‘이와 같이 행해지는 섬김—좋고 기쁘며 주님께 받아들여짐’이라는 세 병렬 진술을 분명하게 재구성했습니다. 신학적으로 특정한 예배 형식으로 한정하지 않기 위해 λειτουργία는 ‘섬김’으로 옮겼습니다.
