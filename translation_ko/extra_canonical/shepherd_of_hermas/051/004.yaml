  text: “당신은 자녀들과 온 집안 식구들과 함께 이 일들을 이와 같이 지키십시오. 그것들을 지키면 복을 받을 것입니다. 또 이 일들을 듣고 지키는 사람은 모두 복을 받을 것이며, 주님께로부터 깨달음을 받을 것입니다.”
