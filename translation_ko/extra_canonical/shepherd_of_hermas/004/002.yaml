    rationale: ταῦτα ... τὰ ἔσχατα 및 τὰ πρότερα는 방금 낭독된 내용의 후반부와 앞부분을 대조하는 표현입니다. ‘이 마지막 것들/앞의 것들’로 원문의 반복과 모호성을 유지할 수 있습니다.
