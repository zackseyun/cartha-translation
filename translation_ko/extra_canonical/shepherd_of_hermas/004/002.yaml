revisions:
- from: 그런 다음 그녀는 나를 불러 내 ​​가슴을 만지며 "내가 읽은 내용이 마음에 드셨나요? "라고 말했습니다. 그리고 나는 그녀에게 말했습니다. "부인이여, 마지막 일은 마음에 들지만 이전 일은 힘들고 가혹합니다." 그러나 그가 나에게 말했습니다. “나중에 있는 것은 의인들을 위한 것이나 먼저 있는 것은 이방인들과 배교한 자들을 위한 것이니라.”
  to: '그러자 그녀는 나를 불러 내 가슴을 만지며 내게 말했습니다. “내가 읽은 것이 마음에 드셨습니까?”


    나는 그녀에게 말했습니다. “부인이여, 이 마지막 것들은 마음에 듭니다만, 앞의 것들은 힘들고 가혹합니다.”


    그러나 그녀는 내게 말했습니다. “이 마지막 것들은 의인들을 위한 것이고, 앞의 것들은 이방 민족들과 배교자들을 위한 것입니다.”'
  rationale: 여성 화자의 지시를 바로잡고, 낭독 내용의 앞부분과 뒷부분을 대조하는 원문의 표현을 자연스러운 합쇼체로 유지했습니다. ‘이방 민족들’과 ‘배교자들’은 원문의 범주를 별도의 교리적 해석 없이 번역한 것입니다.
