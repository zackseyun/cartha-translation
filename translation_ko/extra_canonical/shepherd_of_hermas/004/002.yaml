  source_fidelity: 초안은 화자가 여성인 대상을 가리키는 대명사를 마지막 문장에서 남성형 ‘그가’로 바꾸었으며, ‘마지막 일/이전 일’은 본문의 중성 복수 표현이 가리키는 읽힌 내용의 대조를 다소 부자연스럽게 처리했습니다. 수정문은 여성 화자, ‘내가 읽은 것’, ‘이 마지막 것들/앞의 것들’, 그리고 ‘이방 민족들과 배교자들’이라는 원문의 대조를 보존합니다.
  naturalness: 띄어쓰기 오류(‘내 ​​가슴’)와 인용부호 앞의 불필요한 공백을 바로잡고, 현대 표준어 합쇼체로 문장을 자연스럽게 다듬었습니다.
  terminology: ‘의인’, ‘이방 민족들’, ‘배교자들’은 각각 δικαίοις, ἔθνεσιν, ἀποστάταις에 충실하며 특정 교파적 해석을 더하지 않습니다.
