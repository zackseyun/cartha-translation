base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024.yaml
  text: 'I asked her about the four colors that the beast had upon its head[a]. But she answered me and says, "Again you are curious about such matters." "Yes, my Lady," I say; "make known to me what these things are."


    She says, "Listen: the black is this world, in which you dwell. And the fiery and blood-red is because this world must be destroyed by blood and fire. But the golden portion is you who have escaped this world. For just as gold is tested by fire and becomes useful, so also you are being tested among them[e]. Therefore, those who remain and are fired by it[f] will be purified. Just as gold casts off its dross, so also you will cast off every grief and distress, and you will be purified and will be useful for the building of the tower.


    "But the white portion is the age that is coming, in which the elect of God will dwell; because those chosen by God for eternal life will be spotless and pure.


    "You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."


    Having said these things, she went away, and I did not see to what place she went; for a noise occurred. And I turned around in fear[o][n][m][l][k][j][i][h][f][e][c][b], thinking that the beast was coming.'
  footnotes:
  - marker: a
    text: 'Greek θηρίον. Alternative: ''wild beast''.'
    reason: lexical_alternative
  - marker: b
    text: Greek κυρία. 'Lady' keeps respectful address without connotations of ownership that 'Mistress' may carry.
    reason: lexical_alternative
  - marker: c
    text: 'Greek πυροειδὲς καὶ αἱματῶδες: ''fiery and blood‑red.'' Alternatives: ''fiery and blood‑stained'' or ''blood‑colored.'''
    reason: lexical_alternative
  - marker: e
    text: The phrase reads 'so also you are being tested in/among them (ἐν αὐτοῖς)'. Some witnesses include 'those who dwell' ([οἱ κατοικοῦντες]), yielding 'you who dwell among them.' The referent of 'them' may be the elements/events just mentioned (blood, fire) or the conditions of this world.
    reason: textual_variant
  - marker: f
    text: '''Fired by it'' follows the metallurgical metaphor; ''it'' most naturally refers to the fire/testing process.'
    reason: cultural_note
  - marker: h
    text: 'Cross‑reference: the tower vision throughout Visions 3–4, where stones are prepared for building.'
    reason: cross_reference
  - marker: i
    text: 'Greek αἰὼν ὁ ἐπερχόμενος: ''the age that is coming.'' Alternative: ''the world to come.'''
    reason: lexical_alternative
  - marker: j
    text: 'Greek ἅγιοι: rendered ''holy ones'' rather than ''saints'' to preserve early-Christian diction.'
    reason: lexical_alternative
  - marker: k
    text: 'Greek τύπος: ''pattern'' here. Alternatives: ''type,'' ''token,'' ''sign.'''
    reason: lexical_alternative
  - marker: l
    text: 'Greek θλῖψις μεγάλη ἐρχομένη: ''the great tribulation that is coming.'' Alternative: ''the coming great distress/affliction.'''
    reason: lexical_alternative
  - marker: m
    text: '''If you are willing, it will be nothing'' may mean the trial’s impact will be as nothing for those prepared; alternative understanding: ''if you are willing, nothing will happen'' (the event is averted).'
    reason: alternative_reading
  - marker: n
    text: '''The things written beforehand'' (τὰ προγεγραμμένα) likely refers to earlier written admonitions or previously revealed parts of the vision.'
    reason: cross_reference
  - marker: o
    text: 'Greek ψόφος: ''noise'' or ''sound'', an unspecified disturbance.'
    reason: lexical_alternative
translation:
  language: ko
  text: '나는 그녀에게 그 짐승의 머리 위에 있던 네 가지 색에 대해 물었습니다[a]. 그러자 그녀는 내게 대답하며 말했습니다. 「또 그런 일에 호기심을 보이는구나.」 「네, 제 주인님,」 제가 말했습니다. 「이것들이 무엇인지 저에게 알려 주십시오.」


    그녀가 말했습니다. 「들으십시오. 검은 것은 이 세상입니다. 너희가 그 안에 거주하고 있지요. 그리고 불빛과 피빛의 것은 이 세상이 피와 불로 멸망해야 하기 때문입니다. 그러나 금빛 부분은 이 세상을 빠져나간 너희입니다. 금이 불로 시험을 받아 쓸모 있게 되듯이, 너희도 그들 가운데서 시험을 받고 있습니다[e]. 그러므로 남아 있고 그것에 의해 불로 달궈진 자들은 정결하게 될 것입니다[f]. 금이 자기 찌꺼기를 벗어버리듯이, 너희도 모든 슬픔과 답답함을 벗어 버릴 것이며, 정결하게 되어 탑을 세우는 데 유용하게 될 것입니다.


    「그러나 흰 부분은 다가오는 그 시대입니다[i]. 그 안에서 하나님의 택하신 이들이 살게 될 것입니다. 이는 하나님께서 영생을 위해 택하신 이들이 흠 없고 깨끗할 것이기 때문입니다.


    「그러므로 너는 성도들의 귀에 대고 말하는 일을 그치지 마십시오. 너희는 또한 다가오는 큰 환난의 본보기[k][l]를 가지고 있습니다. 그러나 너희가 원하면 그것은 아무것도 아닐 것입니다[m]. 미리 기록된 것들을 기억하십시오[n].」


    그 말을 하고 그녀는 떠났는데, 나는 그녀가 어느 곳으로 갔는지 보지 못했습니다. 소리가 났기 때문입니다[o]. 그래서 나는 짐승이 오는 줄 알고 두려워하며 뒤돌아섰습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  english_pob_choice: beast
  chosen_korean: 짐승
  alternatives_korean:
  - 들짐승
  - 야수
  lexicon: LSJ
  rationale: 묵시적 상징 동물의 강한 이미지를 살리면서, 본문 전체의 비유적 긴장을 유지하기 위해 ‘짐승’으로 옮겼습니다.
- source_word: κυρία
  english_pob_choice: Lady
  chosen_korean: 제 주인님
  alternatives_korean:
  - 부인
  - 귀부인
  - 여주인
  lexicon: LSJ
  rationale: 존칭을 유지하되 ‘주인님’은 소유 뉘앙스를 지나치게 강하게 만들 수 있어, 담화 맥락상 예의를 살리는 표현으로 처리했습니다.
- source_word: πυροειδὲς καὶ αἱματῶδες
  english_pob_choice: fiery and blood-red
  chosen_korean: 불빛과 피빛
  alternatives_korean:
  - 불같고 피붉은
  - 불빛이며 피빛인
  lexicon: LSJ
  rationale: 색채 이미지라는 점을 살리되 한국어에서 자연스럽고 간결하게 보이도록 ‘~빛’ 구조로 옮겼습니다.
- source_word: ἐν αὐτοῖς
  english_pob_choice: among them
  chosen_korean: 그들 가운데서
  alternatives_korean:
  - 그 안에서
  - 그들 안에서
  lexicon: BDAG
  rationale: 미상대명사의 지시 대상을 단정하지 않고, 시험의 환경/조건 속에 있다는 의미를 살리기 위해 중립적으로 표현했습니다.
- source_word: πυρωθέντες
  english_pob_choice: fired by it
  chosen_korean: 불로 달궈진
  alternatives_korean:
  - 불에 태워진
  - 불로 정련된
  lexicon: LSJ
  rationale: 금속 세공의 이미지를 보존하면서, 정련의 과정이 수동적으로 가해지는 느낌을 한국어에서도 드러내기 위해 선택했습니다.
- source_word: ὁ αἰὼν ὁ ἐπερχόμενος
  english_pob_choice: the age that is coming
  chosen_korean: 다가오는 그 시대
  alternatives_korean:
  - 오는 시대
  - 내세
  lexicon: BDAG
  rationale: κόσμος(세상)과 구별되는 종말론적 ‘시대’를 유지하기 위해 ‘시대’로 옮겼습니다.
- source_word: ἅγιοι
  english_pob_choice: holy ones
  chosen_korean: 성도들
  alternatives_korean:
  - 거룩한 이들
  - 성인들
  lexicon: BDAG
  rationale: 한국어 교회용례가 이미 굳은 표준 표현을 사용하되, 문맥의 공동체적 호칭을 유지했습니다.
- source_word: τύπος
  english_pob_choice: pattern
  chosen_korean: 본보기
  alternatives_korean:
  - 모형
  - 형식
  - 표본
  lexicon: BDAG
  rationale: 경고적·예표적 성격을 한국어에서 직관적으로 드러내기 위해 ‘본보기’로 옮겼습니다.
- source_word: θλῖψις μεγάλη ἐρχομένη
  english_pob_choice: the great tribulation that is coming
  chosen_korean: 다가오는 큰 환난
  alternatives_korean:
  - 다가오는 큰 고난
  - 오는 큰 재난
  lexicon: BDAG
  rationale: 묵시문맥의 압박과 고통을 함께 살릴 수 있는 표준적 표현으로 선택했습니다.
- source_word: ψόφος
  english_pob_choice: noise
  chosen_korean: 소리
  alternatives_korean:
  - 잡음
  - 울림
  lexicon: LSJ
  rationale: 불특정한 청각적 방해를 자연스럽게 옮기되, 사건의 갑작스러움을 살렸습니다.
theological_decisions:
- issue: ἅγιοι의 한국어 처리
  chosen_reading: ‘성도들’로 옮겨 공동체적 호칭을 유지했습니다.
  alternative_readings:
  - ‘거룩한 이들’
  - ‘성인들’
  rationale: 이 텍스트는 교회적 공동체를 가리키는 용례가 자연스럽기 때문에, 한국어 독자가 즉시 알아볼 수 있는 표현을 택했습니다.
  doctrine_reference: early Christian communal address
- issue: ἐὰν δὲ ὑμεῖς θελήσητε, οὐδὲν ἔσται의 의미
  chosen_reading: ‘너희가 원하면 그것은 아무것도 아닐 것입니다’로 옮겨, 다가오는 환난의 효력이 준비된 이들에게는 무력해질 수 있음을 살렸습니다.
  alternative_readings:
  - ‘너희가 원하면 아무 일도 일어나지 않을 것입니다’
  - ‘너희가 원하면 그것은 사라질 것입니다’
  rationale: 문맥상 환난 자체의 취소보다, 그것이 믿는 이들에게 미치는 영향이 무력화되는 paraenetic 의미가 더 잘 맞습니다.
  doctrine_reference: paraenesis / endurance under trial
