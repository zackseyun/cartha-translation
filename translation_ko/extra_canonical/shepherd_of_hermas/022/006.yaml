revisions:
- from: 먼지가 점점 더 커질수록 나는 그것이 신성한 것이라고 생각했습니다. 해가 조금 빛나더니 보라 바다 괴물과 같은 심히 큰 짐승이 있는데 그 입에서 메뚜기 떼가 나오더라. 그 짐승의 길이는 약 100피트였고, 머리는 항아리 같았습니다.
  to: 먼지구름이 점점 더 커지자, 나는 그것이 신적인 어떤 일이라고 짐작했습니다. 해가 잠시 비치더니, 그런데 보니 어떤 바다 괴물 같은 매우 큰 짐승이 있었고, 그 입에서는 불타는 메뚜기들이 나오고 있었습니다. 그 짐승의 길이는 약 백 피트였고, 머리는 항아리 같았습니다.
  rationale: 불타는 메뚜기라는 명시적 수식어를 복원하고, 먼지의 증대와 해의 잠시 비침을 자연스러운 현대 한국어로 옮겼습니다. κῆτος의 비특정성을 ‘어떤 바다 괴물’로 보존했으며, 길이 단위는 원문의 피트를 그대로 유지했습니다.
