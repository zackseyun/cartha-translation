  source_fidelity: 핵심 형상과 치수는 대체로 옮겼으나, πύριναι(‘불 같은/불타는’)가 ‘메뚜기 떼’에서 빠졌습니다. 또한 μικρὸν ἐξέλαμψεν은 해가 ‘조금 빛났다’보다 ‘잠시 빛을 발했다/비쳤다’라는 돌발적 뉘앙스가 더 가깝습니다.
  naturalness: ‘먼지가 점점 더 커질수록’은 먼지 자체의 크기보다 먼지구름의 팽창을 가리키는 한국어 표현이 자연스럽습니다. 서술 종결도 합쇼체 과거형으로 통일하는 것이 좋습니다.
  terminology: θηρίον은 ‘짐승’, κῆτός τι는 특정 종을 단정하지 않는 ‘어떤 바다 괴물’로 유지했습니다. κέραμος는 여기서 토기 항아리로 이해할 수 있으므로 ‘항아리’가 무난합니다.
