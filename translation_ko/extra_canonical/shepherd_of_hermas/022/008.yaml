  text: 그러므로 형제들아, 내가 주의 믿음을 믿고 그분께서 내게 가르치신 놀라운 일들을 기억하고 용기를 내어 내 몸을 짐승에게 넘겨 주었느니라. 이제 그 짐승이 성을 무너뜨릴 만큼 큰 소리로 다가오고 있었습니다.
