revisions:
- from: 그러므로 형제들아, 내가 주의 믿음을 믿고 그분께서 내게 가르치신 놀라운 일들을 기억하고 용기를 내어 내 몸을 짐승에게 넘겨 주었느니라. 이제 그 짐승이 성을 무너뜨릴 만큼 큰 소리로 다가오고 있었습니다.
  to: 그러므로 형제들이여, 주의 믿음을 옷 입고 그분께서 내게 가르쳐 주신 위대한 일들을 기억하여 용기를 내어 나 자신을 그 짐승에게 내맡겼습니다. 그 짐승은 성 하나를 파괴할 수 있을 만큼 큰 포효를 내며 다가오고 있었습니다.
  rationale: The revision restores the metaphor of putting on faith, retains the ambiguous 'faith of the Lord' as '주의 믿음,' translates 'myself' without adding 'body,' and uses consistent modern formal-polite narrative style. '포효' communicates the beast's ῥοίζος naturally, while '성 하나를 파괴할 수 있을 만큼' conveys the stated destructive capacity.
