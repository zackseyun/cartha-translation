revisions:
- from: 내가 그분께 영광을 돌리고 감사하고 있을 때, 음성 같은 것이 나에게 대답했습니다. “헤르마스, 두 마음을 품지 마십시오.” 나는 속으로 이렇게 생각하기 시작했습니다. '내가 주님께 이렇게 굳건히 서고 영광스러운 일을 본 적이 있는데 왜 두 마음을 품어야 합니까?'
  to: 내가 그분께 영광을 돌리고 감사하고 있을 때, 음성 같은 소리가 나에게 응답했습니다. “헤르마스, 두 마음을 품지 마십시오.” 나는 속으로 생각하기 시작하며 말했습니다. ‘주님께서 나를 이처럼 굳게 세우셨고 영광스러운 일들을 보았는데, 내가 무엇 때문에 두 마음을 품겠습니까?’
  rationale: The revision corrects the source-critical passive sense of Hermas being established by the Lord, refines the description of the voice-like sound, and preserves the Greek term's broader sense of double-mindedness without interpretive narrowing.
