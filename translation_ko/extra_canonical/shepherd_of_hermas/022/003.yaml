- from: 그러므로 내가 홀로 행하여 주께 간구하노니 그 거룩한 교회로 내게 보이신 계시와 이상을 이루게 하시고 나를 강건하게 하시고 넘어진 종들에게 회개하게 하사 그 크고 영화로운 이름을 영광되게 하시기를 구하노니 이는 나를 그 기사를 내게 보이는데 합당한 자로 여기셨음이니라
  to: 그러므로 저는 홀로 걸으며 주께서 그의 거룩한 교회를 통하여 제게 보여 주신 계시들과 환상들을 완성해 주시고, 저를 강하게 하시며, 실족한 그의 종들에게 회개를 주시기를 간구하고 있었습니다. 이는 그분의 크고 영광스러운 이름이 영광을 받게 하시려는 것이며, 그분께서 제게 자신의 놀라운 일들을 보여 주시기에 제가 합당하다고 여기셨기 때문입니다.
