  language: ko
  text: 그러므로 내가 홀로 행하여 주께 간구하노니 그 거룩한 교회로 내게 보이신 계시와 이상을 이루게 하시고 나를 강건하게 하시고 넘어진 종들에게 회개하게 하사 그 크고 영화로운 이름을 영광되게 하시기를 구하노니 이는 나를 그 기사를 내게 보이는데 합당한 자로 여기셨음이니라
