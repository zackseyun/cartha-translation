  text: 나는 그것 가까이 다가갔습니다. 그러자 그토록 거대한 바다 괴물은 몸을 땅에 길게 뻗고, 혀를 내미는 것 외에는 아무것도 하지 않았습니다. 내가 그것을 지나갈 때까지 그것은 전혀 움직이지 않았습니다.
