  language: ko
  text: 또 물 가까이에 떨어졌지만 물속으로 굴러 들어가지 못하는 다른 돌들이 누구인지 알고 싶습니까? 이들은 말씀을 듣고 주의 이름으로 세례를 받기를 원하는 사람들입니다. 그러다가 진리의 순결함을 기억하게 되면 회개하고, 다시 자기들의 악한 욕망을 좇아 돌아갑니다.
