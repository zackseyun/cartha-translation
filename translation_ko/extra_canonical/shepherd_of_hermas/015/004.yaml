    issue: 질문의 대상과 서술이 바뀜
    rationale: 원문은 이미 ‘버려져 탑 건축에 맞지 않는’ 돌들에 관해 묻지만, 초안은 그 돌들이 버려졌는지를 질문합니다.
  - severity: high
    issue: ἔχουσιν μετάνοιαν을 완료된 회개로 번역함
    rationale: ‘그들은 회개했습니다’는 원문의 현재 표현과 맞지 않습니다. 여기서는 회개가 그들에게 열려 있거나 가능하다는 뜻을 보존해야 합니다.
  - severity: medium
    issue: ἁρμόσαι의 건축 비유가 약화됨
    rationale: ‘탑에 들어갈 수 없다’보다 ‘이 탑에 맞추어질 수 없다’가 돌과 건축의 비유 및 원문의 동사를 더 충실히 반영합니다.
