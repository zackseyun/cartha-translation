revisions:
- from: 그래서 그녀는 탑에 대한 설명을 마쳤다. 그러나 나는 다시 담대해져서 탑을 쌓는데 합당하지 못한 이 모든 돌들이 버려졌는지, 그것들에 대한 회개가 있는지, 이 탑에 그 돌들이 자리를 잡을 수 있는지 더 질문했습니다. “그들은 회개했습니다. 하지만 그들은 이 탑에 들어갈 수 없습니다.
  to: 그러자 그녀는 탑에 대한 설명을 마쳤습니다. 그러나 나는 다시 염치없게도 그 여자에게, 버려져 탑 건축에 맞지 않는 이 모든 돌들에게 회개가 있는지, 또 이 탑 안에 자리가 있는지를 더 물었습니다. “그들에게는 회개가 있습니다. 그러나 그들은 이 탑에 맞추어질 수 없습니다.
  rationale: 질문의 문법적 범위를 바로잡고, ‘회개’가 이미 완료된 행위라는 오해를 피했으며, 돌이 탑의 건축에 결합되는 비유를 유지했습니다. 인용 부호는 다음 독자 구획에서도 그 여자의 답변이 이어지는 편집상 분할을 반영하여 닫지 않았습니다.
