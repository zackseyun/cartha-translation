  text: 그래서 그녀는 탑에 대한 설명을 마쳤다. 그러나 나는 다시 담대해져서 탑을 쌓는데 합당하지 못한 이 모든 돌들이 버려졌는지, 그것들에 대한 회개가 있는지, 이 탑에 그 돌들이 자리를 잡을 수 있는지 더 질문했습니다. “그들은 회개했습니다. 하지만 그들은 이 탑에 들어갈 수 없습니다.
