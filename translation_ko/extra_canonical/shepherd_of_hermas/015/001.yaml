revisions:
- from: 또 네가 본 다른 돌들은 망대에서 멀리 던져져 길에 떨어지며 길에서 굴러가며 길 없는 곳으로 굴러가는 것을 네가 보았느니라. 이들은 믿었으나 두 마음을 품음으로 인하여 자기의 바른 길을 떠난 자들이라. 그러므로 그들은 더 나은 길을 찾을 수 있다고 생각하여 길 없는 길을 걷다가 길을 잃고 비참함을 겪습니다.
  to: 또 네가 본 다른 돌들은 망대에서 멀리 던져져 길에 떨어지고, 그 길에서 굴러 길 없는 곳으로 들어가는 돌들입니다. 이들은 믿기는 하였으나, 마음이 갈라져 자기들의 참된 길을 버리는 사람들입니다. 더 나은 길을 찾을 수 있다고 생각하여, 길 없는 곳들을 걸으며 방황하고 고난을 겪습니다.
  rationale: The revision preserves the Greek stone-and-road imagery, including the plural 'pathless places,' and retains the causal force of διψυχία without overinterpreting it. It also removes redundancy and regularizes the passage in modern formal-polite Korean.
