revisions:
- from: 그러나 불에 떨어져 불에 타버린 자들은 마침내 살아계신 하나님에게서 돌아선 자들이요 그들의 음란한 욕망과 그들이 행한 악한 일로 말미암아 다시 회개할 마음이 떠오르지 아니하는 자들이니라.
  to: 그러나 불 속에 떨어져 타 버리는 사람들은 끝내 살아 계신 하나님에게서 돌아선 사람들입니다. 그들의 방탕한 욕망과 그들이 저지른 악행들 때문에 회개하려는 생각이 더는 그들의 마음에 떠오르지 않았습니다.
  rationale: The revision retains the source's imagery, definitive turning away from the living God, and the causal relation to sensual debauchery and evil deeds. It renders the Greek heart-idiom as the thought of repentance arising in the heart, while using consistent modern formal-polite prose.
