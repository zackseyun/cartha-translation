  text: 그러나 불에 떨어져 불에 타버린 자들은 마침내 살아계신 하나님에게서 돌아선 자들이요 그들의 음란한 욕망과 그들이 행한 악한 일로 말미암아 다시 회개할 마음이 떠오르지 아니하는 자들이니라.
