review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central identification and causal statement, but "회개할 마음" can imply a disposition or willingness rather than the Greek idiom meaning that the thought/notion of repenting no longer arose in them. "마침내" is possible for εἰς τέλος, though "끝내" more naturally conveys definitive apostasy here.
  naturalness: The sentence is understandable, but the final -니라 is not the requested modern formal-polite 합쇼체. Recasting the final clause also produces more idiomatic Korean.
  terminology: '"살아 계신 하나님" accurately renders τοῦ Θεοῦ τοῦ ζῶντος. "방탕한 욕망" is an appropriately natural rendering of ἀσελγεία in this context, and "악행" clearly renders πονηρίαι.'
  issues:
  - severity: medium
    issue: Register mismatch
    rationale: The draft ends in the archaic declarative form "-니라," rather than modern formal-polite 합쇼체 requested for this translation.
  - severity: medium
    issue: '"회개할 마음" narrows the Greek idiom'
    rationale: ἀνέβη ἐπὶ τὴν καρδίαν τοῦ μετανοῆσαι literally expresses the thought of repenting no longer coming into their heart/mind. "회개하려는 생각" preserves this more closely without implying only an absence of desire.
  revised_text: 그러나 불 속에 떨어져 타 버리는 사람들은 끝내 살아 계신 하나님에게서 돌아선 사람들입니다. 그들의 방탕한 욕망과 그들이 저지른 악행들 때문에 회개하려는 생각이 더는 그들의 마음에 떠오르지 않았습니다.
