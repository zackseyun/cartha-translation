revisions:
- from: 오히려 훨씬 더 작은 다른 장소에 적합할 것입니다. 그리고 이때가 그들이 고통을 받고 그들의 죄의 날들을 마치는 때일 것이다. 그리하여 그들은 의인의 말씀에 참여하였으므로 옮겨지리라. 그리고 만일 그들이 행한 악행이 그들의 마음에 떠오르면 그들은 고통에서 벗어나게 될 것입니다. 그러나 만일 그들이 마음에 떠오르지 아니하면 그들의 마음이 완악하므로 구원을 얻지 못하느니라.”
  to: 그러나 그들은 훨씬 더 작은 다른 곳에 들어맞게 될 것입니다. 이것은 그들이 고난을 받고 자기 죄의 날들을 다 채운 뒤에 일어날 것입니다. 그들이 의로운 이의 말씀에 참여하였기 때문에, 그들은 옮겨질 것입니다. 그들이 행한 악한 일들이 그들의 마음에 떠오르면, 그때 그들은 고난에서 옮겨지게 될 것입니다. 그러나 그 악한 일들이 그들의 마음에 떠오르지 않으면, 그들은 마음이 완고하기 때문에 구원받지 못할 것입니다.”
  rationale: 원문의 조건절에서 ‘악한 일들’을 주어로 명시하여 의미를 회복하고, 수동태와 문맥상의 돌-건축 비유를 유지했습니다. 또한 전체를 현대 표준어 합쇼체로 통일했습니다.
