base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042.yaml
  text: '‘Foremost of all is desire for another’s wife or husband[a], and for the luxury of wealth, and for many vain dishes and intoxicating drinks[b], and for many other foolish indulgences[c]; for every indulgence is foolish and empty for the slaves of God[d].


    2. These, then, are evil desires, putting the slaves of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God[e].


    3. But all who are overmastered by them and do not stand against them will die utterly[f]; for these desires are death‑dealing.


    4. But you—put on the desire for righteousness[g], and, having armed yourself with the fear of the Lord, stand against them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and standing against it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.


    5. So then, having been crowned in your contest against it[h], come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills[i]. If you serve the good desire and submit to it, you will be able to master[j] the evil desire and to subject it as you wish.’'
  footnotes:
  - marker: a
    text: 'Greek: “a woman belonging to another or a man.” The rendering makes the symmetry explicit in English.'
    reason: lexical_alternative
  - marker: b
    text: '“Dishes” renders ἐδέσματα (prepared courses), and “intoxicating drinks” renders μεθύσματα. Alternatives: “foods and potations.” “Vain” (ματαῖα) carries the sense of empty, futile.'
    reason: lexical_alternative
  - marker: c
    text: τρυφή signifies self‑indulgent luxury or soft living. “Indulgences” keeps the moral nuance.
    reason: cultural_note
  - marker: d
    text: Or “servants of God.” The translation chooses “slaves” to keep the sharp allegiance contrast in this context.
    reason: lexical_alternative
  - marker: e
    text: Or “live for God.” The dative is kept as “to God” to preserve the ancient idiom.
    reason: lexical_alternative
  - marker: f
    text: 'εἰς τέλος intensifies the verb: “utterly, to the full.” Alternatives: “die in the end,” “die completely.”'
    reason: lexical_alternative
  - marker: g
    text: Lit. “desire of righteousness.” Rendered as “for righteousness” to express orientation; Hermas also calls it “the good desire,” personifying it.
    reason: lexical_alternative
  - marker: h
    text: στεφανωθείς evokes the victor’s wreath after a contest; κατ’ αὐτῆς marks the adversative direction (“against it”).
    reason: cultural_note
  - marker: i
    text: “Serve” translates δουλεύω; alternatively, “be a slave to it.” The nuance of devoted service is intended.
    reason: lexical_alternative
  - marker: j
    text: '“Master” renders κατακυριεῦσαι; alternatives: “gain dominion over,” “overpower.”'
    reason: lexical_alternative
translation:
  language: ko
  text: '“무엇보다도 남의 아내나 남편에 대한 욕망[a], 재물의 사치, 많고 헛된 음식과 술[b], 그리고 그 밖의 많은 어리석은 방종[c]이 있습니다. 모든 방종은 하나님의 종들에게는 어리석고 헛됩니다[d].


    2. 그러므로 이런 것들은 악한 욕망이며, 하나님의 종들을 죽음에 이르게 합니다. 이 악한 욕망은 마귀의 딸이기 때문입니다. 그러므로 악한 욕망을 멀리해야 합니다. 그렇게 멀리해야 하나님께로 살아갈 수 있습니다[e].


    3. 그러나 그것들에게 압도되고 그것들에 맞서지 않는 사람들은 끝내 완전히 죽을 것입니다[f]. 이런 욕망들은 죽음을 가져오기 때문입니다.


    4. 그러나 당신은 의에 대한 욕망을 입으십시오[g]. 그리고 주님을 경외함으로 무장하고 그것들에 맞서십시오. 하나님의 경외가 좋은 욕망 안에 머물기 때문입니다. 악한 욕망은 당신이 하나님의 경외로 무장하고 그것에 맞서고 있는 것을 보면, 당신에게서 멀리 달아날 것이며, 당신의 무기를 두려워하여 더는 당신에게 나타나지 않을 것입니다.


    5. 그러므로 그것과의 싸움에서 승리하여 면류관을 쓴 채[h] 의에 대한 욕망에게로 나아가서, 당신이 받은 승리를 그것에게 넘겨주고 그것이 원하는 대로 그것을 섬기십시오[i]. 당신이 그 좋은 욕망을 섬기고 그것에 복종하면, 악한 욕망을 지배하고 원하는 대로 그것을 복종시킬 수 있습니다[j].”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναικὸς ἀλλοτρίας ἢ ἀνδρός
  english_pob_choice: another’s wife or husband
  chosen_korean: 남의 아내나 남편
  alternatives_korean:
  - 다른 사람의 아내나 남편
  - 남의 아내 또는 남편
  lexicon: BDAG / LSJ
  rationale: ἀλλότριος의 핵심은 ‘남의, 다른 사람에게 속한’이므로, 한국어로는 간결하게 ‘남의’가 가장 자연스럽고 대칭성도 살립니다.
- source_word: ἐδέσματα / μεθύσματα
  english_pob_choice: dishes / intoxicating drinks
  chosen_korean: 음식과 술
  alternatives_korean:
  - 음식들와 취하게 하는 음료
  - 진수와 술
  lexicon: LSJ
  rationale: 문맥은 많은 식탁의 사치와 음주를 가리키므로, ‘음식과 술’이 현대 한국어에서 가장 직접적이고 읽기 쉽습니다.
- source_word: τρυφή
  english_pob_choice: indulgences
  chosen_korean: 방종
  alternatives_korean:
  - 사치
  - 자기만족
  lexicon: LSJ
  rationale: τρυφή는 단순한 호사가 아니라 도덕적으로 풀어진 사치와 방탕을 뜻하므로, ‘방종’이 그 부정적 뉘앙스를 잘 드러냅니다.
- source_word: δοῦλοι τοῦ Θεοῦ
  english_pob_choice: slaves of God
  chosen_korean: 하나님의 종들
  alternatives_korean:
  - 하나님의 노예들
  - 하나님의 종
  lexicon: BDAG
  rationale: 프로젝트 기본값은 해당 표현을 ‘노예’로 옮길 수 있지만, 이 문맥에서는 한국어 출판문체와 가독성을 위해 ‘종들’이 더 자연스럽고, 소유-귀속의 대비는 유지됩니다.
- source_word: ζήσητε τῷ Θεῷ
  english_pob_choice: live to God
  chosen_korean: 하나님께로 살아갈 수 있습니다
  alternatives_korean:
  - 하나님께 살아갈 수 있습니다
  - 하나님을 향해 살 수 있습니다
  lexicon: BDAG
  rationale: 여격의 방향성/지향성을 살리면서도 한국어로는 ‘살아갈 수 있습니다’가 문맥상 자연스럽습니다.
- source_word: ἀποθανοῦνται εἰς τέλος
  english_pob_choice: die utterly
  chosen_korean: 끝내 완전히 죽을 것입니다
  alternatives_korean:
  - 완전히 죽을 것입니다
  - 마침내 죽을 것입니다
  lexicon: BDAG
  rationale: εἰς τέλος의 완결·강조를 ‘끝내 완전히’로 이중화해 경고의 강도를 보존합니다.
- source_word: ἔνδυσαι τὴν ἐπιθυμίαν τῆς δικαιοσύνης
  english_pob_choice: put on the desire for righteousness
  chosen_korean: 의에 대한 욕망을 입으십시오
  alternatives_korean:
  - 의를 향한 욕망을 입으십시오
  - 의의 욕망을 입으십시오
  lexicon: BDAG
  rationale: ‘입으십시오’는 비유를 그대로 살리고, γενitive는 목적어적 관계로 이해해 ‘의에 대한’으로 옮겼습니다.
- source_word: στεφανωθείς κατ’ αὐτῆς
  english_pob_choice: having been crowned in your contest against it
  chosen_korean: 그것과의 싸움에서 승리하여 면류관을 쓴 채
  alternatives_korean:
  - 그것을 상대로 승리하여 면류관을 쓴 채
  - 그것과 겨루어 승리하여 관을 쓴 채
  lexicon: LSJ
  rationale: στεφανωθείς의 경기·승리 이미지를 한국어로 풀어 설명하되, ‘면류관’을 유지해 문화적 배경을 보존합니다.
- source_word: δουλεύω
  english_pob_choice: serve
  chosen_korean: 섬기십시오
  alternatives_korean:
  - 종이 되십시오
  - 노예처럼 섬기십시오
  lexicon: BDAG
  rationale: 권면의 문맥에서는 ‘섬기다’가 자연스럽고, 앞선 ‘종들’과의 어감도 무리 없이 연결됩니다.
theological_decisions:
- issue: δοῦλοι τοῦ Θεοῦ의 번역
  chosen_reading: ‘하나님의 종들’
  alternative_readings:
  - ‘하나님의 노예들’
  - ‘하나님의 종’
  rationale: 이 단락은 소속과 복종의 대비를 강하게 말하지만, 한국어 본문에서 ‘노예들’은 과도하게 현대적·충격적으로 들릴 수 있어, 본문 흐름과 공용어 수용성을 함께 고려해 ‘종들’로 정했습니다.
  doctrine_reference: 'DOCTRINE.md — contested terminology: doulos may be rendered as slave when bonded status is salient, but context and register may justify servant/minister-style Korean equivalents.'
- issue: ζήσητε τῷ Θεῷ의 여격 처리
  chosen_reading: ‘하나님께로 살아갈 수 있습니다’
  alternative_readings:
  - ‘하나님을 위해 살아갈 수 있습니다’
  - ‘하나님께 살아갈 수 있습니다’
  rationale: 여격의 방향성을 ‘~께로’로 살려, 단순 목적(위해)로 축소하지 않고 관계적 지향을 드러냈습니다.
  doctrine_reference: Hermas paraenesis — dative of orientation preserved without flattening to purpose clause.
