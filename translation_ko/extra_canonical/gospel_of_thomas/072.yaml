base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/072.yaml
  text: A man said to him[a], "Tell my brothers, so that they may divide my father's property with me." He said to him, "Man, who has made me a divider?" He turned to his disciples and said to them, "I am not a divider, am I?"
  footnotes:
  - marker: a
    text: Initial ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ (‘a man said’) is partially restored on NH II, 46; restoration brackets in Dilley’s printed text indicate minor loss.
    reason: lacuna_or_restoration
  - marker: b
    text: Printed text reads ⲛ̄ⲛⲁⲥⲛⲏⲩ (‘my brothers,’ plural); normalized line lists ⲛⲡⲁⲥⲟⲛ (‘my brother,’ sing.). Context favors plural, but either is grammatically possible.
    reason: textual_variant
  - marker: c
    text: ⲛⲡϩⲛⲁⲁⲩ can also mean ‘inheritance’ or ‘possessions’; ‘property’ is chosen to avoid legal connotations not explicit in the Coptic.
    reason: lexical_alternative
  - marker: d
    text: ⲕⲱⲧⲛⲧⲟϥ (normalized) vs. ⲕⲟⲧϥ (printed) reflects Sahidic/Lycopolitan orthographic variation of ‘turn (oneself).’
    reason: dialect_note
  - marker: e
    text: The particle ⲙⲏ may be read deictically (‘Look/Behold’) or, by influence of Greek μή, with prohibitive nuance (‘Do not [let it be] that I am…’). We render ‘Look’ but the clause is taken as a denial in context.
    reason: lexical_alternative
  - marker: f
    text: Compare Luke 12:13–14, where ‘judge’ (δικαστής) appears alongside ‘divider’; Thomas’s version retains only ‘divider.’
    reason: cross_reference
  - marker: g
    text: Or '"Look—I am not a divider."'.
    reason: previous_rendering
translation:
  language: ko
  text: 한 사람이 그에게 말했습니다. "내 형제들에게 말해 주십시오. 그래서 그들이 아버지의 재산을 나와 함께 나누게 하십시오." 예수께서 그에게 말씀하셨습니다. "사람아, 누가 나를 나누어 주는 사람으로 세웠습니까?" 그는 제자들에게 돌아서서 그들에게 말씀하셨습니다. "나는 나누어 주는 사람이 아니지 않습니까?"[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 초두의 ‘한 사람’은 필사본 복원 구간이 있어 일부가 보충된 것으로 이해됩니다.
    reason: source_note
  - marker: b
    text: ‘형제들’은 정규화 본문에 단수형이 보이지만, 문맥상 복수형이 더 자연스럽습니다.
    reason: textual_variant
  - marker: c
    text: ‘재산’은 본문의 소유·유산 의미를 살린 번역이며, 법률적 ‘상속’으로 좁히지는 않았습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘돌아서서’는 사본의 ‘turn oneself’ 계열 표현을 반영한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ ⲛⲁⲛⲧⲟϥ
  english_pob_choice: A man said to him
  chosen_korean: 한 사람이 그에게 말했습니다
  alternatives_korean:
  - 어떤 사람이 그에게 말했습니다
  - 한 남자가 그에게 말했습니다
  lexicon: Crum; Lambdin
  rationale: ⲡⲉϫⲉ + 목적어 구문은 자연스럽게 ‘말했습니다’로 옮기고, ⲣⲱⲙⲉ는 여기서 성별 대비보다 일반적 ‘사람’이 무난합니다.
- source_word: ϫⲟⲟⲥ
  english_pob_choice: tell
  chosen_korean: 말해 주십시오
  alternatives_korean:
  - 말하십시오
  - 전해 주십시오
  lexicon: Crum s.v. ϫⲟⲟⲥ
  rationale: 청원형 요청으로서 직접성은 살리되, 한국어에서는 상대에게 부탁하는 표현인 ‘말해 주십시오’가 가장 자연스럽습니다.
- source_word: ⲛⲡϩⲛⲁⲁⲩ
  english_pob_choice: property
  chosen_korean: 재산
  alternatives_korean:
  - 소유물
  - 유산
  lexicon: Crum s.v. ϩⲛⲁⲁⲩ
  rationale: Coptic는 가족 재산·소유를 가리키지만 법률 용어로 과도하게 좁히지 않도록 ‘재산’을 택했습니다.
- source_word: ⲛⲣⲉϥⲡⲱϣⲉ
  english_pob_choice: a divider
  chosen_korean: 나누어 주는 사람
  alternatives_korean:
  - 분배하는 사람
  - 나누는 자
  - 중재자
  lexicon: Crum s.v. ⲡⲱϣⲉ
  rationale: 직역형 ‘분배자’도 가능하지만, 문맥상 유산 분할을 맡는 기능을 살려 한국어에서 곧장 이해되는 ‘나누어 주는 사람’으로 풀었습니다.
- source_word: ⲁⲛⲧⲟϥ ⲕⲱⲧⲛⲧⲟϥ
  english_pob_choice: He turned to his disciples
  chosen_korean: 그는 제자들에게 돌아서서
  alternatives_korean:
  - 그는 제자들에게 돌아서며
  - 그는 제자들을 향해 몸을 돌려
  lexicon: Crum s.v. ⲕⲱⲧⲛ; Layton
  rationale: 반사적 ‘돌아서다’의 동작을 살리면서, 대상 표지를 자연스럽게 한국어 부사구로 처리했습니다.
theological_decisions:
- issue: 마지막 문장의 ⲙⲏ 처리
  chosen_reading: 나는 나누어 주는 사람이 아니지 않습니까?
  alternative_readings:
  - 나는 나누어 주는 사람이 아닙니까?
  - 나는 나누어 주는 사람이 아니오?
  rationale: ⲙⲏ는 여기서 부정적 대답을 기대하는 수사 의문으로 읽는 것이 문맥과 최근 교정 판단에 가장 잘 맞습니다. 그래서 단순 부정문보다 질문형으로 유지했습니다.
  doctrine_reference: Thomas 72 rhetorical question
