review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 첫 청원의 목적절은 ‘그들이 … 나누도록’으로 표현하는 편이 Coptic의 ϩⲓⲛⲁ 목적 구문을 더 정확하고 자연스럽게 반영합니다. 마지막 ⲙⲏ는 부정의 답을 예상하는 수사 의문으로 처리한 현행 번역이 적절합니다.
  naturalness: 현 번역은 합쇼체를 일관되게 사용하지만, ‘그래서 … 나누게 하십시오’는 요청의 목적 관계가 다소 불명확하고 명령이 중첩되어 들립니다. 또한 네 각주 표지를 마지막 문장에 한꺼번에 붙인 것은 해당 어구와의 연결을 흐립니다.
  terminology: ⲛⲣⲉϥⲡⲱϣⲉ는 문맥상 ‘분배자’가 ‘나누어 주는 사람’보다 간결하고 자연스럽습니다. 이는 ‘중재자’나 ‘재판관’으로 확대하지 않고 원문의 ‘나누는 사람’이라는 뜻을 보존합니다.
  issues:
  - severity: medium
    issue: 첫 청원의 목적절 표현
    rationale: ‘그래서 그들이 … 나누게 하십시오’는 두 번째 명령처럼 들릴 수 있습니다. ϩⲓⲛⲁ + 접속법의 목적 관계를 ‘… 나누도록’으로 나타내는 것이 더 충실합니다.
  - severity: medium
    issue: 각주 표지의 위치
    rationale: a–d가 모두 마지막 수사 의문문 뒤에 붙어 있으나, 각주는 각각 ‘한 사람’, ‘형제들’, ‘재산’, ‘돌아서서’에 관한 것입니다. 해당 낱말 또는 구 뒤에 배치해야 합니다.
  - severity: low
    issue: ‘나누어 주는 사람’의 어휘 선택
    rationale: 의미상 가능하나, 원문의 행위자 명사와 한국어 관용에 맞추어 ‘분배자’가 더 간결합니다. 법적 직함인 ‘재판관’이나 ‘중재자’로 바꾸지 않습니다.
