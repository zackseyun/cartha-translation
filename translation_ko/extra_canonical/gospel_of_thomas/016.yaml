base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
  footnotes:
  - marker: '1'
    text: The manuscript spells the infinitive 'to cast' as ⲁⲛⲟⲩϫⲉ instead of the standard Sahidic ⲉⲛⲟⲩϫⲉ, a common vowel interchange in this text.
    reason: dialect_note
  - marker: '2'
    text: Compare with Luke 12:51-53 and Matthew 10:34-35. Thomas shares the Synoptic themes of division and the sword but uniquely concludes with the fractured family members standing as 'solitary ones' (monachos).
    reason: cross_reference
  - marker: '3'
    text: Greek loanword monachos. In Thomas, this denotes not a later Christian monk, but a 'single one' or 'solitary'—one who has achieved spiritual unity and stands undivided, even when earthly family is fractured.
    reason: theological_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「아마 사람들은 내가 세상에 평강을 던지러 왔다고 생각할 것입니다. 그러나 나는 땅 위에 분열을 던지러 왔다는 것을 그들은 알지 못합니다. 곧 불, 칼, 전쟁입니다. 한 집에는 다섯이 있게 될 것이니, 셋은 둘을, 둘은 셋을 거슬러 설 것입니다. 아버지는 아들을 거슬러, 아들은 아버지를 거슬러 설 것입니다. 그리고 그들은 단독한 자들로 서게 될 것입니다」[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 토마스복음 본문은 평강과 분열에 같은 동사 ‘던지다’(cast)를 반복해 역설을 강화합니다.
    reason: source_note
  - marker: b
    text: 여기서 ‘단독한 자들’은 후대의 수도사 개념이 아니라, 분열되지 않은 ‘한 사람’이라는 토마스복음 특유의 용례를 반영합니다.
    reason: theological_note
  - marker: c
    text: 이 구절은 누가복음 12:51-53, 마태복음 10:34-35와 비교할 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲧⲁⲭⲁ
  english_pob_choice: Perhaps
  chosen_korean: 아마
  alternatives_korean:
  - 아마도
  - 혹시
  lexicon: BDAG 992
  rationale: 사람들의 추측을 가리키는 말이므로, 직설적이면서도 자연스러운 ‘아마’로 옮겼습니다.
- source_word: ⲛⲟⲩϫⲉ
  english_pob_choice: cast
  chosen_korean: 던지다
  alternatives_korean:
  - 던져 놓다
  - 내던지다
  - 뿌리다
  lexicon: Crum 240a
  rationale: 평강과 분열 모두에 같은 동사를 적용하는 거친 대조를 살리기 위해, 원문의 ‘cast’에 가장 가까운 ‘던지다’를 택했습니다.
- source_word: ⲡⲱⲣϫ
  english_pob_choice: divisions
  chosen_korean: 분열
  alternatives_korean:
  - 갈라짐
  - 나뉨
  - 분리
  lexicon: Crum 269a
  rationale: 단순한 분리보다 관계의 갈라짐과 대립을 함께 드러내는 말이어서 ‘분열’이 가장 적절합니다.
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  english_pob_choice: solitary ones
  chosen_korean: 단독한 자들
  alternatives_korean:
  - 홀로인 자들
  - 고독한 자들
  - 독자적인 자들
  lexicon: BDAG 656
  rationale: 후대의 수도사 의미를 피하면서도, Thomas 본문의 ‘하나로 묶이지 않은/단독한’ 상태를 드러내기 위해 ‘단독한 자들’로 옮겼습니다.
theological_decisions:
- issue: ⲙⲟⲛⲁⲭⲟⲥ의 의미
  chosen_reading: 후대 수도자 ‘수도사’가 아니라, 분열된 가족 관계 속에서도 내적으로 나뉘지 않은 ‘단독한 자들’로 이해했습니다.
  alternative_readings:
  - 수도사
  - 홀로 있는 자들
  - 독신자들
  rationale: 본문 자체는 교회 제도나 수도 생활을 말하지 않으며, 토마스복음의 문맥상 영적으로 분열되지 않은 상태를 가리키는 표현으로 읽는 것이 source-grounded입니다.
  doctrine_reference: Thomas saying 16; English POB theological note on monachos
- issue: 가문/가족 분열의 표현
  chosen_reading: 아버지와 아들이 서로 ‘거슬러 선다’는 직접적 대립 표현을 유지했습니다.
  alternative_readings:
  - 반대한다
  - 맞선다
  - 대적한다
  rationale: 누가복음 12:51-53 및 마태복음 10:34-35와 연결되는 긴장을 약화하지 않도록, 원문의 대립 구조를 가능한 한 선명하게 보존했습니다.
  doctrine_reference: Luke 12:51-53; Matthew 10:34-35
