base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
  footnotes:
  - marker: a
    text: Literally 'the things which you have' (ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ).
    reason: lexical_alternative
    anchor_ref: what belongs to you
  - marker: b
    text: The Coptic form ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ uses the regional/Lycopolitan suffix ⲧⲏⲛⲉ for the second-person plural, rather than the standard Sahidic ⲧⲏⲩⲧⲛ.
    reason: dialect_note
    anchor_ref: what is in your hands
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “천사들과 예언자들[a]이 너희에게 올 것이며, 그들은 너희에게 너희에게 속한 것을 줄 것입니다. 너희는 또 너희 손에 있는 것[b]을 그들에게 주고, 너희 자신에게 이렇게 말하십시오. ‘그들은 어느 날 와서 그들의 것을 가져갈까?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 복수 표지로 ‘천사들’과 ‘예언자들’을 가리킵니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘너희 손에 있는 것’입니다. 이 표현은 손에 지니거나 쥔 것을 떠올리게 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛ̄ⲁⲅⲅⲉⲗⲟⲥ ... ⲙⲛ̄ⲛ̄ⲡⲣⲟⲫⲏⲧⲏⲥ
  english_pob_choice: the angels and the prophets
  chosen_korean: 천사들과 예언자들
  alternatives_korean:
  - 천사와 예언자들
  - 천사들과 선지자들
  lexicon: Crum; standard loanword usage
  rationale: 복수 표지가 분명하므로 단수로 줄이지 않고, ⲡⲣⲟⲫⲏⲧⲏⲥ는 표준어에서 낯설지 않은 ‘예언자들’로 옮겨 원문의 평행 구조를 살렸습니다.
- source_word: ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ
  english_pob_choice: what belongs to you
  chosen_korean: 너희에게 속한 것
  alternatives_korean:
  - 너희가 가진 것
  - 너희의 것
  lexicon: Crum 327a
  rationale: 단순 소유보다 ‘속하다’가 원문의 소유·귀속 관계를 더 분명히 드러내므로, 회수될 대상이 ‘너희에게 속한 것’임을 살렸습니다.
- source_word: ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  english_pob_choice: what is in your hands
  chosen_korean: 너희 손에 있는 것
  alternatives_korean:
  - 너희가 손에 쥔 것
  - 너희가 가지고 있는 것
  lexicon: Crum 425b
  rationale: 손에 들려 있는 물리적 이미지를 직접 반영해, 소유 일반보다 ‘손에 있는 것’으로 옮겼습니다.
- source_word: ⲧⲁⲁⲩ ⲛⲁⲩ
  english_pob_choice: give them what is in your hands
  chosen_korean: 그들에게 주고
  alternatives_korean:
  - 그들에게 그것들을 주고
  - 그들에게 건네주고
  lexicon: Crum 279b
  rationale: 명령형의 핵심은 ‘주다’이므로 과도한 해설을 덜고 간결하게 처리했습니다. 앞절의 ‘너희 손에 있는 것’이 이미 목적어를 제시하므로 한국어에서는 반복을 줄였습니다.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ϫⲟⲟⲥ ⲛⲏⲧⲛ̄
  english_pob_choice: say to yourselves
  chosen_korean: 스스로에게 이렇게 말하십시오
  alternatives_korean:
  - 너희 자신에게 말하십시오
  - 자기들에게 말하십시오
  lexicon: Crum 706a
  rationale: ⲛⲏⲧⲛ̄이 ‘너희에게/너희 자신에게’의 방향성을 가지므로, 자연스러운 현대 한국어로 자기대화를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 보내는 이들과 받는 이들 사이의 교환 구조
  chosen_reading: 천사들과 예언자들이 너희에게 와서 너희에게 속한 것을 주고, 너희도 그들에게 너희 손에 있는 것을 주는 상호 교환의 구조로 옮겼습니다.
  alternative_readings:
  - 일방적으로 천사와 예언자가 가져다주는 이미지
  - 단순한 소유 반환만 강조하는 읽기
  rationale: 원문은 ‘너희에게 속한 것’과 ‘그들의 것’을 대조하며 상호 회수/반환의 긴장을 만듭니다. 한국어도 이 대칭을 보존해야 본문의 의미가 흐려지지 않습니다.
  doctrine_reference: Gospel of Thomas의 상호성/귀속 모티프
