  to: 예수께서 말씀하셨습니다. “천사들과 예언자들[a]이 너희에게 올 것이며, 그들은 너희에게 너희에게 속한 것을 줄 것입니다. 너희는 또 너희 손에 있는 것[b]을 그들에게 주고, 너희 자신에게 이렇게 말하십시오. ‘그들은 어느 날 와서 그들의 것을 가져갈까?’”
