base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
  footnotes:
  - marker: take it
    text: The Coptic pronoun is masculine singular and could refer either to the house (ⲡⲏⲉⲓ) or to the strong man (ⲡϫⲱⲱⲣⲉ, 'take him by force').
    reason: lexical_alternative
  - marker: overturn
    text: The Coptic verb ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ literally means 'to pour out' or 'to overturn,' a notable divergence from the canonical Synoptic parallels (Mark 3:27, Matt 12:29) which use ⲧⲱⲣⲡ ('to plunder' or 'snatch').
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "강한 자의 집에 들어가서 그를 힘으로 빼앗지 못하는 사람은 없습니다. 다만 먼저 그의 손을 묶어야 합니다. 그제야 그의 집을 뒤엎을 것입니다."[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문의 남성 단수 대명사는 ‘집’ 또는 ‘강한 자’ 둘 다를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ은 문자적으로 ‘쏟아 버리다/뒤엎다’의 뜻을 가지며, 공관복음의 평행구절에 나오는 ‘약탈하다’와는 다릅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛ̄ϭⲟⲙ
  english_pob_choice: It is not possible
  chosen_korean: “못하는 사람은 없습니다”
  alternatives_korean:
  - “할 수 없습니다”
  - “가능하지 않습니다”
  lexicon: Crum 815b
  rationale: 부정 존재 구문을 한국어의 가능성 표현으로 자연스럽게 옮기되, 주어를 일반화해 원문의 ‘someone’ 의미를 살렸습니다.
- source_word: ϫⲱⲱⲣⲉ
  english_pob_choice: strong man
  chosen_korean: “강한 자”
  alternatives_korean:
  - “힘센 사람”
  - “강한 사람”
  lexicon: Crum 785a
  rationale: 원문의 실체명사적 용법을 살려 ‘강한 자’로 옮겼고, 관용적으로 익숙한 표현이면서도 인물 유형을 분명히 드러냅니다.
- source_word: ϫⲓⲧϥ⳿ ⲛ̄ϫⲛⲁϩ
  english_pob_choice: take it by force
  chosen_korean: “그를 힘으로 빼앗지”
  alternatives_korean:
  - “그것을 힘으로 빼앗지”
  - “그를 강제로 취하지”
  lexicon: Crum 776b
  rationale: ⲛϫⲛⲁϩ의 ‘힘으로/강제로’라는 부사적 의미를 반영했습니다. 목적어 대명사는 원문의 모호성을 유지하기 위해 ‘그를/그것을’ 가능성을 열어 두되, 본문은 문맥상 인물을 지시하는 독해를 택했습니다.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  english_pob_choice: overturn
  chosen_korean: “뒤엎을 것입니다”
  alternatives_korean:
  - “엎어 버릴 것입니다”
  - “뒤집어엎을 것입니다”
  - “비워 버릴 것입니다”
  lexicon: Crum 264b
  rationale: 사본의 동사는 공관복음의 ‘약탈하다’와 달리 ‘쏟아내다/뒤엎다’의 의미권에 있으므로, 그 차이를 살려 ‘뒤엎다’로 번역했습니다.
theological_decisions:
- issue: ‘그를/그것을’ 대명사 지시 대상의 모호성
  chosen_reading: 본문은 영어 POB의 각주처럼 대상을 단정하지 않고, 한국어 본문은 ‘그를’로 두어 강한 자를 지시하는 읽기를 우선 반영했습니다.
  alternative_readings:
  - ‘그것을 힘으로 빼앗지’로 하여 집을 지시하는 읽기
  - 대명사를 회피해 ‘그 집을 힘으로 빼앗지’로 풀기
  rationale: 원문 대명사는 집과 강한 자 둘 다를 가리킬 수 있는 문법적 여지를 지니므로, 본문은 유력한 읽기를 택하되 해석의 긴장을 지우지 않도록 했습니다.
  doctrine_reference: source-critical humility; ambiguity preserved
