base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/028.yaml
  text: Jesus said[1], "I stood in the midst of the world, and I appeared to them in flesh.[1] I found them all drunk; I found not one of them thirsting.[2] And my soul was pained over the children of humanity,[3] for they are blind in their heart and they do not see that they came into the world empty, seeking also to go out of the world empty.[4] But now they are drunk. When they have shaken off their wine[a][5][4][3][2], then they will repent."[5]
  footnotes:
  - marker: '1'
    text: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ can mean ‘shone forth’ or ‘was manifested’; ‘appeared’ balances literal sense and English idiom.
    reason: lexical_alternative
  - marker: '2'
    text: The Coptic construction is compressed; the Greek POxy witness reads explicitly ‘I found not one thirsting among them,’ which supports the negative sense taken here.
    reason: textual_variant
  - marker: '3'
    text: Lit. ‘sons of men’ in the Greek fragment; the Coptic has ‘children of the human,’ here rendered inclusively as ‘children of humanity.’
    reason: cross_reference
  - marker: '4'
    text: ⲉⲓ … ⲉⲃⲟⲗ is literally ‘go out’; ‘leave’ is a possible alternative.
    reason: lexical_alternative
  - marker: '5'
    text: The idiom ‘shake off their wine’ renders ⲛⲟⲩϩⲉ with ⲡⲉⲩⲏⲣⲡ as object; alternatives include ‘when the wine leaves them’ or ‘when they sober up.’
    reason: lexical_alternative
  - marker: a
    text: Or 'and that they also seek'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “나는 세상의 한가운데에 서 있었고, 육신으로 그들에게 나타났습니다.[1] 나는 그들 모두가 취해 있는 것을 보았고, 그들 가운데 목마른 이는 하나도 보지 못했습니다.[2] 내 영혼은 사람의 자녀들 때문에 괴로웠습니다.[3] 그들은 마음이 눈멀어, 자신들이 빈 채로 세상에 왔고 빈 채로 세상을 떠나기를 또한 찾고 있다는 것을 보지 못하기 때문입니다.[4] 그러나 지금 그들은 취해 있습니다. 그들이 자기들의 포도주를 떨쳐 내면,[5] 그때에 그들은 회개할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 콥트어 ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ은 ‘나타나다’ 외에 ‘빛나다’, ‘드러나다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: '2'
    text: 콥트어 표현은 압축되어 있습니다. 그리스어 POxy 증인은 ‘그들 가운데 목마른 이는 하나도 보지 못했다’는 부정의 뜻을 명시적으로 뒷받침합니다.
    reason: textual_variant
  - marker: '3'
    text: 그리스어 단편은 문자적으로 ‘사람들의 아들들’이라 읽히며, 콥트어는 인간을 가리키는 ‘사람의 자녀들’이라는 표현을 사용합니다.
    reason: cross_reference
  - marker: '4'
    text: 콥트어 ⲉⲓ … ⲉⲃⲟⲗ은 문자적으로 ‘들어오다 … 나가다’입니다. ‘세상을 떠나다’는 자연스러운 한국어 표현입니다.
    reason: lexical_alternative
  - marker: '5'
    text: ‘자기들의 포도주를 떨쳐 내다’는 원문의 관용적 표현을 가깝게 옮긴 것입니다. ‘포도주가 그들에게서 떠날 때’ 또는 ‘술이 깰 때’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲱϩⲉ ⲉⲣⲁⲧ ϩⲛⲡⲙⲏⲧⲉ
  english_pob_choice: stood in the midst
  chosen_korean: 세상의 한가운데에 서 있었고
  alternatives_korean:
  - 세상의 한복판에 서 있었고
  - 세상 한가운데 서 있었고
  lexicon: Crum; Layton
  rationale: ‘서 있다’와 ‘한가운데’의 결합을 자연스러운 현대 한국어로 옮기되, 중심성의 강한 이미지는 유지했습니다.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  english_pob_choice: appeared
  chosen_korean: 나타났습니다
  alternatives_korean:
  - 드러났습니다
  - 현현하셨습니다
  lexicon: Crum
  rationale: 직역적이면서도 한국어에서 무리 없는 표현으로, ‘보이게 되다/드러나다’의 공개적 출현을 살렸습니다.
- source_word: ϩⲛⲥⲁⲣⲝ
  english_pob_choice: in flesh
  chosen_korean: 육신 가운데
  alternatives_korean:
  - 육체 가운데
  - 살로
  lexicon: Crum
  rationale: ‘살’보다 문어적이며, 단순한 몸이 아니라 육체성 자체를 강조하는 표현을 유지했습니다.
- source_word: ⲧⲏⲣⲛⲧⲟⲟⲩ / ⲗⲁⲁⲩ
  english_pob_choice: all of them / not one
  chosen_korean: 그들 모두가 / 목마른 이는 하나도
  alternatives_korean:
  - 그들 전부가 / 목마른 사람은 하나도
  - 그들 가운데 아무도 목마르지 않은
  lexicon: Layton; Crum
  rationale: 총체성과 부정을 분명히 드러내기 위해 ‘모두’와 ‘하나도’의 대조를 사용했습니다.
- source_word: ⲥⲁⲣⲝ / ϯⲧⲕⲁⲥ / ⲃⲗⲗⲉ / ϩⲏⲧ
  english_pob_choice: my soul was pained ... blind in their heart
  chosen_korean: 내 영혼은 … 고통스러웠습니다 ... 마음속이 눈멀어
  alternatives_korean:
  - 내 혼은 … 괴로웠습니다 ... 마음이 눈멀어
  - 내 영은 … 아팠습니다 ... 심장이 눈멀어
  lexicon: Crum
  rationale: ‘영혼’은 내적 고통의 주체를, ‘마음속이 눈멀어’는 단순한 육체적 실명보다 내면의 무지/둔함을 드러내는 표현을 살렸습니다.
- source_word: ⲉⲩϣⲟⲩⲉⲓⲧ ⲉⲩϣⲓⲛⲉ ⲟⲛ ⲉⲧⲣⲟⲩⲉⲓ ⲉⲃⲟⲗ
  english_pob_choice: came into the world empty, seeking also to go out of the world empty
  chosen_korean: 세상에 들어올 때 빈손으로 왔으며 세상에서 나갈 때도 빈손으로 나가려는 것을
  alternatives_korean:
  - 세상에 올 때 빈손이었고 또한 세상에서 나갈 때도 빈손이기를 구하는 것을
  - 세상에 들어올 때 비어 있었고 세상 밖으로 나가기를 찾는 것을
  lexicon: Crum; Layton
  rationale: 문법상 부사적/상황적 진행을 반영해, ‘빈손으로’와 ‘나가려는’으로 생동감 있게 옮기되 ‘empty’의 반복을 유지했습니다.
- source_word: ⲛⲟⲩϩⲉ ⲡⲉⲩⲏⲣⲡ
  english_pob_choice: shake off their wine
  chosen_korean: 자기들의 포도주를 떨쳐 버리면
  alternatives_korean:
  - 자기들의 포도주를 털어 버리면
  - 포도주의 취기를 벗어 버리면
  - 술이 그들에게서 떠나면
  lexicon: Crum
  rationale: 비유적이면서도 낯선 동사를 살리기 위해 ‘떨쳐 버리다’를 택했고, 대상은 직설적으로 ‘포도주’로 유지했습니다.
- source_word: ⲙⲉⲧⲁⲛⲟⲉⲓ
  english_pob_choice: repent
  chosen_korean: 회개할 것입니다
  alternatives_korean:
  - 마음을 돌이킬 것입니다
  - 돌아설 것입니다
  lexicon: Crum; Lambdin
  rationale: 예언적 결과를 나타내는 종결을 반영하면서, 통상적인 종교용어를 그대로 사용해 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘사람의 자녀들’의 포괄성
