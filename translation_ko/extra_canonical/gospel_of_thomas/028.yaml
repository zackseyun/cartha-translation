- from: 예수께서 말씀하셨습니다. "나는 세상의 한가운데에 서 있었고, 육신 가운데 그들에게 나타났습니다. 나는 그들 모두가 취해 있는 것을 보았고, 목마른 이는 하나도 찾지 못했습니다. 그리고 내 영혼은 사람의 자녀들을 두고 고통스러웠습니다. 그들은 마음속이 눈멀어 있고, 세상에 들어올 때 빈손으로 왔으며 세상에서 나갈 때도 빈손으로 나가려는 것을 보지 못하기 때문입니다. 그러나 지금은 그들이 취해 있습니다. 그들이 자기들의 포도주를 떨쳐 버리면, 그때 그들은 회개할 것입니다."
  to: 예수께서 말씀하셨습니다. “나는 세상의 한가운데에 서 있었고, 육신으로 그들에게 나타났습니다.[1] 나는 그들 모두가 취해 있는 것을 보았고, 그들 가운데 목마른 이는 하나도 보지 못했습니다.[2] 내 영혼은 사람의 자녀들 때문에 괴로웠습니다.[3] 그들은 마음이 눈멀어, 자신들이 빈 채로 세상에 왔고 빈 채로 세상을 떠나기를 또한 찾고 있다는 것을 보지 못하기 때문입니다.[4] 그러나 지금 그들은 취해 있습니다. 그들이 자기들의 포도주를 떨쳐 내면,[5] 그때에 그들은 회개할 것입니다.”
  rationale: 원문의 문법적 관계와 반복되는 ‘빈 채로’를 보존하고, 한국어에서 부자연스러운 장소 표현을 방식 표현으로 바로잡았습니다. ‘찾다’의 지속성을 유지하되 특정 교리적 해석을 덧붙이지 않았습니다. 영어 감사 흔적에서 제시된 주요 어휘·본문 난점에 대응하는 주석 앵커도 복원했습니다.
