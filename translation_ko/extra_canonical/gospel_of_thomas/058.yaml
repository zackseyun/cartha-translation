  source_fidelity: 번역의 기본 의미는 원문 사본형 ⲛ̄ⲧⲁϩϩⲓⲥⲉ … ⲁϥϩⲉ ⲁⲡⲱⲛϩ(‘수고한 사람이 생명을 찾았다’)에 충실합니다. 다만 제공된 정규화문에 들어 있는 독립대명사 분석은 사본의 형태와 맞지 않으며, 현 번역의 ‘그는’은 사본의 일반적인 3인칭 남성 단수 주어 접사에 부합합니다. ⲁⲡⲱⲛϩ는 사본 표기이고, 목적어로는 정규화하여 ⲉⲡⲱⲛϩ로 이해하는 것이 타당합니다.
  naturalness: ‘노고한’은 현대 표준 한국어에서 다소 부자연스럽고 명사 ‘노고’의 영향이 강합니다. ‘수고한’이 ϩⲓⲥⲉ의 노력·고됨의 범위를 자연스럽게 전달합니다. 각주 표지를 해당 어구에 붙이고, 본문을 단순 반복하는 각주는 삭제하는 편이 읽기 좋습니다.
  terminology: ‘복이 있습니다’, ‘사람’, ‘생명’은 현대 합쇼체와 간결한 복 선언 문맥에 적절합니다. ‘수고한’은 ‘고통받은’으로 의미를 한정하지 않으면서도 ϩⲓⲥⲉ의 고된 노력의 뉘앙스를 보존합니다.
