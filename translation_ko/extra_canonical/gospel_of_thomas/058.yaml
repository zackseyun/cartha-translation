base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/058.yaml
  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
  footnotes:
  - marker: a
    text: Makarios (ⲙⲁⲕⲁⲣⲓⲟⲥ) can nuance “happy” or “fortunate” as well as “blessed.”
    reason: lexical_alternative
  - marker: b
    text: ⲡⲣⲱⲙⲉ denotes a human being generically; “person” avoids implying male-only reference though “man” is a possible rendering.
    reason: lexical_alternative
  - marker: c
    text: ϩⲓⲥⲉ ranges from “labor/toil” to “suffer/be distressed”; some translate “Blessed is the one who has suffered.”
    reason: lexical_alternative
  - marker: d
    text: The independent pronoun ⲁⲛⲧⲟϥ is emphatic; the translation carries this forward as “that one has found life” rather than “he himself has found life.”
    reason: dialect_note
  - marker: e
    text: Printed form ⲁⲡⲱⲛϩ likely reflects orthographic variation; normalized Sahidic expects ⲉⲡⲱⲛϩ as the object of ϩⲉ.
    reason: textual_variant
  - marker: f
    text: Or 'that one has found life'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “수고한[c] 사람[b]은 복이 있습니다[a]. 그는 생명을 찾았습니다[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲙⲁⲕⲁⲣⲓⲟⲥ는 ‘복된’뿐 아니라 ‘행복한’ 또는 ‘행운의’ 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲡⲣⲱⲙⲉ는 일반적인 인간을 가리킵니다. ‘사람’은 성별을 한정하지 않는 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ϩⲓⲥⲉ는 ‘수고하다, 애쓰다’에서 ‘고통받다, 괴로워하다’까지의 의미 범위를 가집니다.
    reason: lexical_alternative
  - marker: e
    text: 사본의 ⲁⲡⲱⲛϩ는 정규화하면 ⲉⲡⲱⲛϩ로 이해되며, 여기서는 ‘생명’을 뜻합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  english_pob_choice: blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복됩니다
  - 행복합니다
  - 복되다
  lexicon: Crum, s.v. ⲙⲁⲕⲁⲣⲓⲟⲥ
  rationale: 마카리오스의 복됨/행복/행운의 뉘앙스 중에서, 토마스 복음서의 간결하고 단정한 어조를 살리기 위해 ‘복이 있습니다’로 옮겼습니다.
- source_word: ⲡⲣⲱⲙⲉ
  english_pob_choice: person
  chosen_korean: 사람
  alternatives_korean:
  - 사람 한 명
  - 인간
  - 남자
  lexicon: Crum, s.v. ⲣⲱⲙⲉ
  rationale: ⲡⲣⲱⲙⲉ는 일반적 ‘인간/사람’을 뜻하므로, 성별을 불필요하게 한정하지 않는 ‘사람’이 가장 자연스럽습니다.
- source_word: ϩⲓⲥⲉ
  english_pob_choice: labored
  chosen_korean: 노고한
  alternatives_korean:
  - 수고한
  - 애쓴
  - 고생한
  - 수고하며 애쓴
  lexicon: Crum, s.v. ϩⲓⲥⲉ
  rationale: 이 동사는 수고와 고된 노력을 모두 아우를 수 있어, 단순한 ‘일하다’보다 강하고, ‘고통받다’보다 덜 좁은 ‘노고한’으로 옮겼습니다.
- source_word: ϩⲉ
  english_pob_choice: has found
  chosen_korean: 찾았습니다
  alternatives_korean:
  - 발견했습니다
  - 얻었습니다
  - 찾아냈습니다
  lexicon: Crum, s.v. ϩⲉ
  rationale: 완료적 결과를 살리되 한국어 문맥에서 가장 간결한 표현으로 ‘찾았습니다’를 택했습니다.
theological_decisions:
- issue: “복이 있습니다”의 축복 선언 어조
  chosen_reading: 직설적인 복 선언으로 유지했습니다.
  alternative_readings:
  - ‘행복합니다’로 심리 상태를 강조하기
  - ‘복되다’로 더 고전적 문체를 택하기
  rationale: 본문의 μακάριος는 단순 감정 상태보다 ‘복된 상태’를 선언하는 말이므로, 한국어에서도 축복 선언의 힘을 유지하는 것이 적절합니다.
  doctrine_reference: 축복 선언/복 선언의 문체 보존
- issue: ϩⲓⲥⲉ의 의미 범위
  chosen_reading: ‘노고하다’로 노동과 수고의 뉘앙스를 중심에 두었습니다.
  alternative_readings:
  - ‘고난받은 사람’으로 suffering을 강조하기
  - ‘수고한 사람’으로 더 평이하게 옮기기
  rationale: 원어는 ‘노동하다/수고하다’와 ‘고통받다/곤궁하다’ 사이의 범위를 가지므로, 문맥을 과도하게 고난 신학으로 좁히지 않고도 힘든 수고의 뉘앙스를 살렸습니다.
  doctrine_reference: 의미 범위 보존
