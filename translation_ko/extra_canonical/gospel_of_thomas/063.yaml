base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
  footnotes:
  - marker: a
    text: Coptic ⲭⲣⲏⲙⲁ can mean money, wealth, or property (Greek χρῆμα). ‘Money’ is chosen for concreteness; ‘wealth’ would also be possible.
    reason: lexical_alternative
  - marker: b
    text: ⲧⲱⲱϭⲉ is rendered ‘plant’ (Crum s.v.). Some may hear an echo of Luke’s ‘build,’ but the Coptic verb here is agricultural, not architectural.
    reason: lexical_alternative
  - marker: c
    text: ⲁϩⲟ denotes storehouses/barns/granaries. ‘Storehouses’ is chosen to avoid over-specificity.
    reason: lexical_alternative
  - marker: d
    text: ‘So that I will lack nothing’ renders ⲣϭⲣⲱϩ with the negative ⲛⲗⲁⲁⲩ, literally ‘be in need of nothing.’
    reason: cultural_note
  - marker: e
    text: In ⲱϩⲥ (‘reap’), the letter ϩ is a restoration in Dilley’s edition due to manuscript damage.
    reason: lacuna_or_restoration
  - marker: f
    text: For context, compare Luke 12:16–21 (the rich man and barns), noting the significant differences in wording and emphasis.
    reason: cross_reference
  - marker: g
    text: Or 'for I will sow'.
    reason: previous_rendering
  - marker: h
    text: Or 'Whoever has ears to hear,'.
    reason: previous_rendering
  - marker: i
    text: Or 'This was what he was thinking'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「한 부자에게는 많은 재산[a]이 있었습니다. 그는 말했습니다. ‘나는 내 재산을 써서 씨를 뿌리고, 거두고, 심으며, 내 곳간들을 소출로 채워 아무것도 부족하지 않게 하겠습니다.’」 이는 그가 마음속으로 품고 있던 생각들이었습니다. 그런데 바로 그날 밤, 그는 죽었습니다. 귀가 있는 사람은 들으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲭⲣⲏⲙⲁ는 ‘돈’, ‘재산’, ‘부’ 또는 ‘소유물’을 뜻할 수 있습니다. 여기서는 단순한 현금보다 넓은 의미를 나타내는 ‘재산’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲭⲣⲏⲙⲁ
  english_pob_choice: money
  chosen_korean: 재산
  alternatives_korean:
  - 돈
  - 돈줄
  - 부
  lexicon: Crum s.v. ⲭⲣⲏⲙⲁ; Greek χρῆμα
  rationale: 문맥상 단순 현금이라기보다 가진 자산 전반을 가리키므로, 한국어에서는 ‘재산’이 영어 POB의 ‘money’보다 의미를 더 자연스럽고 넓게 반영합니다.
- source_word: ϫⲉⲕⲁⲁⲥ
  english_pob_choice: so that
  chosen_korean: -해서
  alternatives_korean:
  - 그래서
  - -하도록
  - -하려고
  lexicon: Crum s.v. ϫⲉⲕⲁⲁⲥ
  rationale: 의도/목적 절을 나타내므로, 반복을 줄이면서도 한국어 문장 흐름에 맞는 목적 연결로 옮겼습니다.
- source_word: ϫⲟ
  english_pob_choice: sow
  chosen_korean: 씨를 뿌리다
  alternatives_korean:
  - 파종하다
  - 뿌리다
  lexicon: Crum s.v. ϫⲟ
  rationale: 농경적 동작을 살리기 위해 ‘씨를 뿌리다’로 구체화했습니다.
- source_word: ⲱϩⲥ
  english_pob_choice: reap
  chosen_korean: 거두다
  alternatives_korean:
  - 추수하다
  - 수확하다
  lexicon: Crum s.v. ⲱϩⲥ
  rationale: 씨 뿌리기와 평행을 이루는 짧은 동사로서, 현대 한국어에서는 ‘거두다’가 가장 간결합니다.
- source_word: ⲧⲱⲱϭⲉ
  english_pob_choice: plant
  chosen_korean: 심다
  alternatives_korean:
  - 재배하다
  - 가꾸다
  lexicon: Crum s.v. ⲧⲱⲱϭⲉ
  rationale: 영어 POB의 주석처럼 건축이 아니라 농경 동사이므로, 가장 기본적인 ‘심다’를 선택했습니다.
- source_word: ⲁϩⲟ
  english_pob_choice: storehouses
  chosen_korean: 곳간들
  alternatives_korean:
  - 창고들
  - 창고
  - 곡간들
  lexicon: Crum s.v. ⲁϩⲟ
  rationale: 곡물 저장 공간의 이미지를 살리면서도 너무 좁게 한정하지 않기 위해 ‘곳간들’을 택했습니다.
- source_word: ⲕⲁⲣⲡⲟⲥ
  english_pob_choice: produce
  chosen_korean: 생산물
  alternatives_korean:
  - 열매
  - 소출
  - 수확물
  lexicon: Crum s.v. ⲕⲁⲣⲡⲟⲥ; Greek καρπός
  rationale: 저장고에 채워 넣는 대상이라는 점을 살려, 농산물의 총칭으로 ‘생산물’을 사용했습니다.
- source_word: ⲣϭⲣⲱϩ + ⲛⲗⲁⲁⲩ
  english_pob_choice: lack nothing
  chosen_korean: 아무것도 부족하지 않게
  alternatives_korean:
  - 모자람이 없게
  - 결핍되지 않게
  - 아무것도 부족하지 않도록
  lexicon: Crum s.v. ϭⲣⲱϩ
  rationale: 직역의 딱딱함을 피하면서도 ‘need nothing’의 부정적 의미를 분명히 드러내기 위해 이처럼 옮겼습니다.
theological_decisions:
- issue: 마지막 경고 형식의 종결어
  chosen_reading: “귀 있는 사람은 들으십시오.”로 옮겨, 짧은 경구적 경고의 긴박함을 유지했습니다.
  alternative_readings:
  - “들을 귀가 있는 사람은 들으십시오.”
  - “누구든지 들을 귀가 있으면 들으십시오.”
  rationale: 콥트어는 단순히 ‘귀를 가진 사람’이라는 더 짧은 형식을 사용하므로, 복음서식 관용구로 과도하게 확장하지 않고 Thomas의 압축된 종결을 살렸습니다.
  doctrine_reference: '본문비평/형식비평: Thomas의 독자적 종결 공식 유지'
- issue: ‘그날 밤 그가 죽었습니다’의 서술 방식
  chosen_reading: 직설적으로 ‘그날 밤, 그는 죽었습니다’라고 옮겨 급전직하의 심판성을 살렸습니다.
  alternative_readings:
  - “그날 밤 그는 숨졌습니다.”
  - “그날 밤 그는 죽었습니다.”
  rationale: 원문은 완곡하게 돌리지 않고 사건의 급작스러움을 강조하므로, 한국어에서도 완곡어보다 직접적인 표현이 적절합니다.
  doctrine_reference: 죽음/무상성의 경고를 있는 그대로 전달
