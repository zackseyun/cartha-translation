revisions:
- from: 예수께서 말씀하셨습니다.[a] 「한 부자에게 많은 재산이 있었습니다. 그는 말했습니다. ‘나는 내 재산을 사용해서, 씨를 뿌리고 거두고 심으며, 내 곳간들을 생산물로 채워 아무것도 부족하지 않게 하겠습니다.’」 이것들은 그가 마음속에서 생각하던 것들이었습니다. 그리고 그날 밤, 그는 죽었습니다. 귀 있는 사람은 들으십시오.
  to: 예수께서 말씀하셨습니다. 「한 부자에게는 많은 재산[a]이 있었습니다. 그는 말했습니다. ‘나는 내 재산을 써서 씨를 뿌리고, 거두고, 심으며, 내 곳간들을 소출로 채워 아무것도 부족하지 않게 하겠습니다.’」 이는 그가 마음속으로 품고 있던 생각들이었습니다. 그런데 바로 그날 밤, 그는 죽었습니다. 귀가 있는 사람은 들으십시오.
  rationale: 주석 표지를 해당 어휘로 옮겨 앵커를 바로잡았습니다. 목적을 나타내는 구문과 농경 동작들의 나열을 보존하면서 한국어 문장을 다듬었고, 원문의 복수적 ‘생각들’과 짧은 종결 공식도 유지했습니다. ‘바로’는 원문의 그 밤이라는 급작스러운 전환을 한국어에서 자연스럽게 드러내며, 별도의 교리적 해석을 더하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:17Z'
review_pass:
  verdict: revise
