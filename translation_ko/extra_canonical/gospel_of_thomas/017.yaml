- source_word: ⲙⲡⲉⲃⲁⲗ … ⲛⲁⲩ
  english_pob_choice: eye … has not seen
  chosen_korean: 눈이 보지 못한 것
  alternatives_korean:
  - 눈이 본 적 없는 것
  - 한 눈도 보지 못한 것
  lexicon: Crum, s.v. ⲃⲁⲗ; Layton, s.v. ⲛⲁⲩ
  rationale: 무관사 일반적 표현을 한국어의 자연스러운 부정 완료형으로 옮기되, 원문의 감각적 병렬성을 유지했습니다.
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  english_pob_choice: ear … has not heard
  chosen_korean: 귀가 듣지 못한 것
  alternatives_korean:
  - 귀가 들은 적 없는 것
  - 귀가 듣지 못한 일
  lexicon: Crum, s.v. ⲙⲁⲁϫⲉ; Crum, s.v. ⲥⲱⲧⲙ
  rationale: ‘귀’와 ‘듣다’의 대응을 살려 첫 절과 대구를 이루게 했습니다.
- source_word: ϭⲓϫ … ϭⲙϭⲱⲙ
  english_pob_choice: hand … has not touched
  chosen_korean: 손이 만지지 못한 것
  alternatives_korean:
  - 손이 닿지 못한 것
  - 손이 다루지 못한 것
  lexicon: Crum, s.v. ϭⲓϫ; Crum, s.v. ϭⲙϭⲱⲙ
  rationale: ϭⲙϭⲱⲙ의 촉각적 접촉 의미를 한국어에서 가장 직접적으로 드러내는 ‘만지다’로 옮겼습니다.
- source_word: ⲙⲡⲉⲛⲧⲟϥ ⲉϩⲣⲁⲓ ϩⲓⲡϩⲏⲧ
  english_pob_choice: it has not arisen upon the human heart
  chosen_korean: 그것이 인간의 마음 위에 떠오르지 않은 것
  alternatives_korean:
  - 인간의 마음에 들어오지 않은 것
  - 인간의 마음속에 생겨나지 않은 것
  lexicon: Crum, s.v. ⲉϩⲣⲁⲓ; Layton, s.v. ϩⲓ
  rationale: 직역의 ‘upon the heart’와 ‘arisen’의 이미지를 살리되, 한국어에서는 ‘떠오르다’로 자연스럽게 구현했습니다.
theological_decisions:
- issue: 마음/심장 표현의 처리
  chosen_reading: ϩⲓ ⲡϩⲏⲧ을 ‘인간의 마음 위에’로 옮겨, 단순한 내면화가 아니라 표면 위로 ‘떠오름’의 이미지를 남겼습니다.
  alternative_readings:
  - ‘인간의 마음속에’
  - ‘인간의 심장에’
  rationale: 본문은 관용적 ‘in the heart’가 아니라 ‘upon the heart’이므로, 내면화의 일반화보다 원문의 비유적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: source-faithfulness / lexical tension
- issue: ‘인간’의 보편성
  chosen_reading: ⲡⲣⲱⲙⲉ를 ‘인간’으로 옮겨 성별이 아니라 보편적 인간성을 드러냈습니다.
  alternative_readings:
  - ‘사람’
  - ‘남자’
  rationale: 원문은 일반 인간을 가리키므로, 성별화된 표현보다 보편적 의미를 보존하는 번역이 적합합니다.
  doctrine_reference: generic humanity
