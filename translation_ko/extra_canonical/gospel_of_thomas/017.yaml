base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/017.yaml
  text: Jesus said[a], “I will give you what eye has not seen, and what ear has not heard[e][d][c][b], and what hand has not touched—and it has not arisen upon the human heart.”
  footnotes:
  - marker: a
    text: “You” is plural in Coptic (ⲛⲁⲛⲧⲱⲧⲛ).
    reason: dialect_note
  - marker: b
    text: The prepositional phrase is literally “upon the heart” (ϩⲓ ⲡϩⲏⲧ), not the more idiomatic English “in/into the heart.”
    reason: lexical_alternative
  - marker: c
    text: Cf. Isaiah 64:4; 1 Corinthians 2:9 for a related triad (“eye has not seen …”), though Thomas’s wording is translated directly from the Coptic here.
    reason: cross_reference
  - marker: d
    text: 'MS object marking after the perception verbs appears as ⲉⲣⲟϥ in the first clause; Dilley normalizes with ⲛⲧⲟϥ across the triad. Sense: “see/hear/touch it.”'
    reason: textual_variant
  - marker: e
    text: Or 'I myself will give you'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다.[a] 「나는 여러분에게 눈이 보지 못한 것과, 귀가 듣지 못한 것과, 손이 만지지 못한 것과, 그것이 인간의 마음 위에 떠오르지 않은 것을 주겠습니다.[b][c][d][e]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예수’는 본문에 없지만, 이 설화의 화자를 가리키는 관례적 제목입니다.
    reason: source_note
  - marker: b
    text: 직역하면 “마음 위에”이며, 흔한 관용구 ‘마음속에’로 완화하지 않았습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 이사야 64:4 및 1 고린도 2:9와 유사한 삼중 병렬을 보입니다.
    reason: cross_reference
  - marker: d
    text: Perception 동사들 뒤의 목적 표지는 사본에서 일부 이형을 보이지만, 뜻은 “그것을 보다/듣다/만지다”입니다.
    reason: textual_variant
  - marker: e
    text: 또는 “나는 여러분에게 주겠습니다”.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  english_pob_choice: you (plural)
  chosen_korean: 여러분에게
  alternatives_korean:
  - 당신들에게
  - 너희에게
  lexicon: Layton, s.v. ⲧⲱⲧ
  rationale: Coptic 2인칭 복수 목적어를 한국어에서 자연스러운 복수 호칭으로 옮겼습니다.
- source_word: ⲙⲡⲉⲃⲁⲗ … ⲛⲁⲩ
  english_pob_choice: eye … has not seen
  chosen_korean: 눈이 보지 못한 것
  alternatives_korean:
  - 눈이 본 적 없는 것
  - 한 눈도 보지 못한 것
  lexicon: Crum, s.v. ⲃⲁⲗ; Layton, s.v. ⲛⲁⲩ
  rationale: 무관사 일반적 표현을 한국어의 자연스러운 부정 완료형으로 옮기되, 원문의 감각적 병렬성을 유지했습니다.
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  english_pob_choice: ear … has not heard
  chosen_korean: 귀가 듣지 못한 것
  alternatives_korean:
  - 귀가 들은 적 없는 것
  - 귀가 듣지 못한 일
  lexicon: Crum, s.v. ⲙⲁⲁϫⲉ; Crum, s.v. ⲥⲱⲧⲙ
  rationale: ‘귀’와 ‘듣다’의 대응을 살려 첫 절과 대구를 이루게 했습니다.
- source_word: ϭⲓϫ … ϭⲙϭⲱⲙ
  english_pob_choice: hand … has not touched
  chosen_korean: 손이 만지지 못한 것
  alternatives_korean:
  - 손이 닿지 못한 것
  - 손이 다루지 못한 것
  lexicon: Crum, s.v. ϭⲓϫ; Crum, s.v. ϭⲙϭⲱⲙ
  rationale: ϭⲙϭⲱⲙ의 촉각적 접촉 의미를 한국어에서 가장 직접적으로 드러내는 ‘만지다’로 옮겼습니다.
- source_word: ⲙⲡⲉⲛⲧⲟϥ ⲉϩⲣⲁⲓ ϩⲓⲡϩⲏⲧ
  english_pob_choice: it has not arisen upon the human heart
  chosen_korean: 그것이 인간의 마음 위에 떠오르지 않은 것
  alternatives_korean:
  - 인간의 마음에 들어오지 않은 것
  - 인간의 마음속에 생겨나지 않은 것
  lexicon: Crum, s.v. ⲉϩⲣⲁⲓ; Layton, s.v. ϩⲓ
  rationale: 직역의 ‘upon the heart’와 ‘arisen’의 이미지를 살리되, 한국어에서는 ‘떠오르다’로 자연스럽게 구현했습니다.
theological_decisions:
- issue: 마음/심장 표현의 처리
  chosen_reading: ϩⲓ ⲡϩⲏⲧ을 ‘인간의 마음 위에’로 옮겨, 단순한 내면화가 아니라 표면 위로 ‘떠오름’의 이미지를 남겼습니다.
  alternative_readings:
  - ‘인간의 마음속에’
  - ‘인간의 심장에’
  rationale: 본문은 관용적 ‘in the heart’가 아니라 ‘upon the heart’이므로, 내면화의 일반화보다 원문의 비유적 긴장을 보존하는 쪽을 택했습니다.
  doctrine_reference: source-faithfulness / lexical tension
- issue: ‘인간’의 보편성
  chosen_reading: ⲡⲣⲱⲙⲉ를 ‘인간’으로 옮겨 성별이 아니라 보편적 인간성을 드러냈습니다.
  alternative_readings:
  - ‘사람’
  - ‘남자’
  rationale: 원문은 일반 인간을 가리키므로, 성별화된 표현보다 보편적 의미를 보존하는 번역이 적합합니다.
  doctrine_reference: generic humanity
