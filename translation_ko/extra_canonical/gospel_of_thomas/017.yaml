  naturalness: ‘눈이 보지 못한 것, 귀가 듣지 못한 것, 손이 만지지 못한 것’은 자연스럽고 병렬성이 좋습니다. 마지막 절은 원문의 낯선 전치사 이미지를 보존하기 위해 다소 의도적으로 직역되어야 합니다. ‘인간의 마음’보다 ‘사람의 마음’이 현대 한국어에서 더 자연스럽고, 원문의 일반적 단수도 잘 반영합니다.
