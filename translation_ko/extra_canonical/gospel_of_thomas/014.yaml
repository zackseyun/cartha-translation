base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
  footnotes:
  - marker: '1'
    text: Lit. 'they will condemn you', a common Coptic idiom for the passive voice.
    reason: register_note
  - marker: '2'
    text: The Coptic verb ϫⲡⲟ can mean 'acquire' or 'beget'.
    reason: lexical_alternative
  - marker: '3'
    text: 'The Coptic uses left-dislocation for emphasis: ''what they will set before you, eat it; the sick among them, heal them.'''
    reason: register_note
translation:
  language: ko
  text: 예수께서 그들에게 말씀하셨습니다. "만일 여러분이 금식하면, 스스로에게 죄를 낳게 될 것입니다. 또 만일 여러분이 기도하면, 정죄를 받게 될 것입니다. 또 만일 여러분이 구제를 하면, 여러분의 영에게 악을 행하는 것입니다. 그리고 여러분이 어느 땅에 들어가서 지역들을 돌아다닐 때, 그들이 여러분을 받아들이면, 그들이 여러분 앞에 차려 주는 것을 먹으십시오. 그리고 그들 가운데 병든 사람들을 고치십시오. 왜냐하면 여러분의 입으로 들어가는 것은 여러분을 더럽히지 않지만, 여러분의 입에서 나오는 것 — 그것이 여러분을 더럽히는 것이기 때문입니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어는 ‘그들이 여러분을 정죄할 것이다’라는 능동형 표현을 써서 수동 의미를 나타내는 관용을 사용합니다.
    reason: source_note
  - marker: b
    text: 콥트어 ⲕⲱ ϩⲁ-는 문자적으로는 ‘아래에 두다’이지만, 음식과 환대의 문맥에서는 ‘앞에 차려 놓다’라는 뜻입니다.
    reason: source_note
  - marker: c
    text: “여러분의 입에서 나오는 것”은 콥트어에서 강조를 위한 좌분리 구문입니다.
    reason: source_note
lexical_decisions:
- source_word: ϫⲡⲟ
  english_pob_choice: acquire
  chosen_korean: 낳게 될 것입니다
  alternatives_korean:
  - 얻게 될 것입니다
  - 스스로 죄를 얻게 될 것입니다
  - 죄를 만들어 내게 될 것입니다
  lexicon: Crum 778a
  rationale: ϫⲡⲟ는 ‘낳다/생겨나게 하다/얻다’의 폭을 가지므로, 금식의 결과로 죄가 ‘생겨난다’는 역설을 살리면서도 합쇼체 본문에 자연스러운 표현으로 옮겼습니다.
- source_word: ⲕⲁⲧⲁⲕⲣⲓⲛⲉ
  english_pob_choice: condemned
  chosen_korean: 정죄를 받게 될 것입니다
  alternatives_korean:
  - 정죄될 것입니다
  - 유죄 판결을 받게 될 것입니다
  lexicon: Greek loanword (κατακρίνω)
  rationale: 콥트어의 수동 관용을 한국어에서는 자연스러운 피동으로 풀어, 단순한 비난이 아니라 법정적·판결적 뉘앙스가 드러나도록 했습니다.
- source_word: ⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  english_pob_choice: give alms
  chosen_korean: 구제를 하면
  alternatives_korean:
  - 자선을 베풀면
  - 구제헌금을 하면
  - 자비를 베풀면
  lexicon: Greek loanword (ἐλεημοσύνη)
  rationale: 전통적 ‘구제’는 단순 기부보다 자비 행위의 실천을 넓게 담아내며, 이 본문의 도발적인 역설을 가장 직접적으로 전달합니다.
- source_word: ϫⲱϩⲙ̄
  english_pob_choice: defile
  chosen_korean: 더럽히는
  alternatives_korean:
  - 부정하게 하는
  - 오염시키는
  lexicon: Crum 797a
  rationale: ϫⲱϩⲙ의 핵심 뜻은 ‘더럽히다/오염시키다’이므로, 예수 말씀의 핵심 대조를 살려 ‘더럽히다’로 옮겼습니다.
theological_decisions:
- issue: 금식·기도·구제에 대한 역설적 진술을 완화할지 여부
  chosen_reading: 본문의 도발을 그대로 살려, 금식은 ‘죄를 낳게 됨’, 기도는 ‘정죄를 받게 됨’, 구제는 ‘영에게 악을 행함’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 금식하면 죄를 짓게 됩니다
  - 기도하면 책망을 받게 됩니다
  - 구제하면 영에 해를 끼칩니다
  rationale: 토마스복음의 문맥은 일반적 경건 행위를 뒤집는 급진적 역설에 있으므로, 의미를 누그러뜨리기보다 원문의 충격을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Thomasine sayings tradition; paradoxical reversal of piety
- issue: ⲡⲉⲧⲛ̄ⲡⲛⲉⲩⲙⲁ를 ‘영’으로 옮길지 ‘성령’으로 옮길지
  chosen_reading: 여기서는 소유격 표현을 따라 ‘여러분의 영’으로 옮겼습니다.
  alternative_readings:
  - 여러분의 성령
  - 여러분의 마음
  rationale: 문맥상 개인의 내적 존재를 가리키는 일반적 ‘영’이며, 신적 인격을 가리키는 성령으로 읽을 근거가 없습니다.
  doctrine_reference: Greek/Coptic pneuma semantics; Thomasine anthropological usage
