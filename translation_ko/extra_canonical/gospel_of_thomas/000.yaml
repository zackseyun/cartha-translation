base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/000.yaml
  text: These are the hidden sayings which the living Jesus spoke[4][3][2][1], and Didymos Judas Thomas wrote them.
  footnotes:
  - marker: '1'
    text: ϩⲏⲡ may be rendered “hidden” or “secret.” “Hidden” is chosen to preserve the Coptic sense of concealment without importing later esoteric connotations.
    reason: lexical_alternative
  - marker: '2'
    text: Didymos is a Greek loan meaning “Twin.” The full designation “Didymos Judas Thomas” likely apposes Greek and Semitic forms of “Twin.”
    reason: cultural_note
  - marker: '3'
    text: The particle ⲛϭⲓ can function to identify an agent after a verb; here it is rendered “by” rather than “namely,” to reflect agency in English.
    reason: dialect_note
  - marker: '4'
    text: The printed line shows ⲧⲟⲛϩ for ⲱⲛϩ. This is an orthographic/dialectal variation; meaning is “living/being alive.”
    reason: textual_variant
translation:
  language: ko
  text: 이것들은 살아 계신 예수가 말씀하신 숨은 말씀들이며, 디디모스 유다 토마스가 그것들을 기록했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ϩⲏⲡ은 “숨은” 또는 “비밀의”로도 옮길 수 있지만, 여기서는 은밀성의 뜻을 유지하는 쪽을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 디디모스는 그리스어 차용어로 “쌍둥이”를 뜻합니다. 본문의 이름은 그리스어와 셈어형 명칭이 나란히 제시된 것으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 사본의 ⲧⲟⲛϩ는 ⲱⲛϩ의 철자/방언 변이로 보이며, 뜻은 “살아 있는/생명 있는”입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲛ̄ϣⲁϫⲉ
  english_pob_choice: sayings
  chosen_korean: 말씀들
  alternatives_korean:
  - 말들
  - 가르침들
  - 담화들
  lexicon: Crum, s.v. ϣⲁϫⲉ
  rationale: 복수의 짧은 단위를 가리키는 Thomas의 서문 성격을 살리면서, 한국어에서는 자연스럽고 격식을 유지하는 “말씀들”이 가장 덜 해석적입니다.
- source_word: ϩⲏⲡ
  english_pob_choice: hidden
  chosen_korean: 숨은
  alternatives_korean:
  - 숨겨진
  - 비밀의
  - 감추어진
  lexicon: Crum, s.v. ϩⲏⲡ
  rationale: POB의 “hidden”을 따라, 후대의 난해한 비밀주의 뉘앙스를 덜어내면서도 은폐/감춤의 감각은 유지했습니다.
- source_word: ⲱⲛϩ
  english_pob_choice: living
  chosen_korean: 살아 계신
  alternatives_korean:
  - 살아 있는
  - 생존하시는
  lexicon: Crum, s.v. ⲟⲛϩ
  rationale: 예수에 대한 서술이므로 한국어에서는 존칭이 자연스럽고, “살아 계신”이 단순한 생물학적 ‘alive’보다 인격적·칭호적 느낌을 잘 전달합니다.
- source_word: ⲇⲓⲇⲩⲙⲟⲥ ⲓⲟⲩⲇⲁⲥ ⲑⲱⲙⲁⲥ
  english_pob_choice: Didymos Judas Thomas
  chosen_korean: 디디모스 유다 토마스
  alternatives_korean:
  - 디디모스 유다 토마스스
  - 디두모 유다 도마
  - 쌍둥이 유다 토마스
  lexicon: Crum, s.v. ⲇⲓⲇⲩⲙⲟⲥ; Crum, s.v. ⲓⲟⲩⲇⲁⲥ; Crum, s.v. ⲑⲱⲙⲁⲥ
  rationale: 본문의 인명 배열을 그대로 음역해 유지하고, 각 이름이 겹쳐 제시되는 특이한 명칭 구조를 보존했습니다.
- source_word: ⲛϭⲓ
  english_pob_choice: by
  chosen_korean: 가
  alternatives_korean:
  - 에게서
  - 에 의해
  - —
  lexicon: Layton, Coptic Grammar (agent/identifying particle); Crum, s.v. ⲛϭⲓ
  rationale: 이 입자는 여기서 행위자 표지를 이루므로, 한국어에서는 주어 표시로 자연스럽게 풀어 “기록했습니다”의 주체를 분명히 했습니다.
theological_decisions:
- issue: 살아 계신 예수에 대한 호칭의 한국어 존칭 수준
  chosen_reading: “살아 계신 예수”로 번역해 인격적·칭호적 존칭을 유지했습니다.
  alternative_readings:
  - 살아 있는 예수
  - 생명 있는 예수
  rationale: Coptic의 ⲱⲛϩ는 문자적으로 ‘살아 있는’이지만, 한국어에서 예수를 수식할 때는 존칭적 표현이 원문의 생동감과 더 잘 맞습니다.
  doctrine_reference: 문체/호칭 선택
