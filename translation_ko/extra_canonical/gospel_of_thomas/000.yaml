  rationale: 이 입자는 여기서 행위자 표지를 이루므로, 한국어에서는 주어 표시로 자연스럽게 풀어 “기록했습니다”의 주체를 분명히 했습니다.
theological_decisions:
- issue: 살아 계신 예수에 대한 호칭의 한국어 존칭 수준
  chosen_reading: “살아 계신 예수”로 번역해 인격적·칭호적 존칭을 유지했습니다.
  alternative_readings:
  - 살아 있는 예수
  - 생명 있는 예수
  rationale: Coptic의 ⲱⲛϩ는 문자적으로 ‘살아 있는’이지만, 한국어에서 예수를 수식할 때는 존칭적 표현이 원문의 생동감과 더 잘 맞습니다.
  doctrine_reference: 문체/호칭 선택
