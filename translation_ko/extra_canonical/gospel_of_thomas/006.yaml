base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/006.yaml
  text: 'His disciples questioned him and said to him[1], "Do you want us to fast? And how shall we pray? Shall we give alms? And what shall we observe concerning eating?"


    Jesus said, "Do not lie, and what you hate, do not do. For all things are revealed before heaven. For there is nothing hidden that will not be revealed[2], and nothing covered that will remain without being uncovered."'
  footnotes:
  - marker: '1'
    text: The Greek fragment P.Oxy. 654 reads "before truth" (ἐνώπιον τῆς ἀληθείας) instead of "before heaven".
    reason: textual_variant
  - marker: '2'
    text: The Greek fragment P.Oxy. 654 reads "and nothing buried that will not be raised" (καὶ τεθαμμένον ὃ οὐκ ἐγερθήσεται) instead of "and nothing covered that will remain without being uncovered".
    reason: textual_variant
translation:
  language: ko
  text: '그의 제자들이 그에게 물었습니다. 「당신께서는 우리가 금식하기를 원하십니까? 그리고 우리는 어떻게 기도해야 합니까? 우리가 자선을 베풀어야 합니까? 그리고 먹는 일에 관해서는 무엇을 지켜야 합니까?」


    예수께서 말씀하셨습니다. 「거짓말하지 마십시오. 그리고 여러분이 미워하는 것은 행하지 마십시오. 모든 것은 하늘 앞에서 드러납니다. 숨겨져 있지만 드러나지 않을 것은 아무것도 없고, 덮여 있지만 벗겨지지 않은 채 남을 것도 아무것도 없습니다.」[a][b]'
  philosophy: formal
  footnotes:
  - marker: a
    text: 그리스어 파피루스 단편 P.Oxy. 654는 “진리 앞에서”(ἐνώπιον τῆς ἀληθείας)라고 읽습니다.
    reason: textual_variant
  - marker: b
    text: 그리스어 파피루스 단편 P.Oxy. 654는 “묻혔으나 일으켜지지 않을 것은 아무것도 없다”(καὶ τεθαμμένον ὃ οὐκ ἐγερθήσεται)라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ
  english_pob_choice: fast
  chosen_korean: 금식하다
  alternatives_korean:
  - 단식하다
  - 금식하기를 하다
  lexicon: Crum / POB audit trail
  rationale: 콥트어의 그리스어 차용어 νηστεύω는 ‘금식하다’가 가장 직접적이며, 현대 한국어 교회 용례와도 맞습니다.
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
  english_pob_choice: how
  chosen_korean: 어떻게
  alternatives_korean:
  - 무슨 방식으로
  - 어찌
  lexicon: Crum 54b / POB audit trail
  rationale: 직역보다 자연스러운 한국어 의문부사 ‘어떻게’가 원문의 관용구 뜻을 정확히 살립니다.
- source_word: ϭⲓⲛⲟⲩⲱⲙ
  english_pob_choice: concerning eating
  chosen_korean: 먹는 일에 관해서
  alternatives_korean:
  - 먹는 것에 관하여
  - 식사에 관해서
  - 음식에 관해서
  lexicon: Crum 819a / POB audit trail
  rationale: 여기서는 시간 부사절 ‘먹을 때’가 아니라 주제 표지 ‘먹는 일에 관해서’가 원문의 명사구를 더 정확히 반영합니다.
- source_word: ϫⲉϭⲟⲗ
  english_pob_choice: lie
  chosen_korean: 거짓말하다
  alternatives_korean:
  - 거짓을 말하다
  - 속이다
  lexicon: Crum 808b / POB audit trail
  rationale: 경구적 압축감을 살리면서도 한국어에서 곧바로 이해되는 표현으로 옮겼습니다.
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ
  english_pob_choice: before
  chosen_korean: 하늘 앞에서
  alternatives_korean:
  - 하늘 앞에
  - 하늘의 면전에서
  lexicon: Crum 192a / POB audit trail
  rationale: 콥트어 관용구는 ‘~의 앞에서/면전에서’라는 뜻이므로, 원문이 말하는 공개성·현전성을 살려 옮겼습니다.
theological_decisions:
- issue: '복음서 전승과의 차이: Coptic 본문은 ‘covered/uncovered’이며 P.Oxy. 654는 ‘buried/raised’입니다.'
  chosen_reading: 콥트어 본문을 따라 ‘덮여 있지만 벗겨지지 않은 채 남을 것도 아무것도 없습니다’로 번역했습니다.
  alternative_readings:
  - ‘묻혀 있지만 일으켜지지 않을 것’
  - ‘숨겨져 있지만 드러나지 않을 것’
  rationale: 현재 기준 본문은 콥트어이며, 그 문맥은 종말론적 ‘묻힘/부활’보다 계시적 ‘가려짐/폭로됨’의 의미를 더 강하게 드러냅니다.
  doctrine_reference: 본문 비평 / 계시의 공개성
