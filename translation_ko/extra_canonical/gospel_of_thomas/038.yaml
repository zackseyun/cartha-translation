review_pass:
  verdict: revise
  source_fidelity: 초안은 핵심 의미를 대체로 충실히 옮겼습니다. 그러나 ‘바랐지만’은 콥트어의 단순 접속(‘그리고’)에 없는 역접을 더하며, ‘간절히’는 ⲣⲉⲡⲓⲑⲩⲙⲉⲓ의 ‘바라다/원하다’보다 강도를 다소 높입니다. 이를 제거하여 원문의 병렬적 진행과 의미 범위를 보존하는 편이 안전합니다.
  naturalness: 수정문은 현대 표준 한국어의 공적 합쇼체에 맞습니다. ‘나를 찾을 날들이 올 것이며’는 미래-존재 표현을 자연스럽게 살리고, 이어지는 ‘찾지 못할 것입니다’는 원문의 ‘찾다/발견하다’ 대조를 유지합니다.
  terminology: ‘예수께서 말씀하셨습니다’, ‘말씀’, ‘다른 이’, ‘찾다’는 본문 장르와 한국어 성서 문체에 무리 없이 맞습니다. ‘말씀’의 단수 처리와 뒤따르는 복수 대명사 사이의 원문상 수 불일치는 주석으로 밝혀, 본문을 부자연스럽게 만들지 않으면서 보존합니다.
