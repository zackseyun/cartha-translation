base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/038.yaml
  text: Jesus said[a], “Many times you have desired to hear these words that I am saying to you, and you have no other from whom to hear them. There will be days when you will seek me[d][c][b], and you will not find me.”
  footnotes:
  - marker: a
    text: Coptic reads literally ‘this saying’ (singular) before shifting to ‘them/these’ in the next clause; ‘these words’ harmonizes number for English flow while reflecting the plurality of what is being said.
    reason: lexical_alternative
  - marker: b
    text: The phrase ‘no other from whom to hear [them]’ reflects the Coptic construction with ⲕⲉⲟⲩⲁ (‘another one’) and ⲛ̄ⲧⲟϥ (‘from him’), which functions here as a relative ‘from whom’.
    reason: dialect_note
  - marker: c
    text: Literally, ‘There exist some days to come-to-be,’ a Coptic future-existential idiom.
    reason: cultural_note
  - marker: d
    text: Cf. John 7:34; 8:21; 13:33 for a similar motif; Thomas’s wording stands on its own and is not conformed to the canonical phrasing.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “너희는 내가 너희에게 말하는 이 말씀[a]을 듣기를 여러 번 바랐고, 너희에게는 그 말씀을 들을 다른 이[b]가 없습니다. 너희가 나를 찾을 날들이[c] 올 것이며, 너희는 나를 찾지 못할 것입니다.[d]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어는 앞부분에서 단수 ‘이 말씀’으로 시작하지만, 이어지는 절에서는 이를 받는 복수 대명사를 사용합니다. 한국어 본문은 자연스러운 표현을 위해 단수 ‘이 말씀’으로 통일했습니다.
    reason: lexical_alternative
  - marker: b
    text: 콥트어의 ⲕⲉⲟⲩⲁ는 문자적으로 ‘다른 한 사람’이며, 뒤의 표현은 그에게서 그 말씀을 들을 수 없다는 뜻으로 기능합니다. 한국어에서는 ‘그 말씀을 들을 다른 이’로 옮겼습니다.
    reason: dialect_note
  - marker: c
    text: 직역하면 ‘날들이 존재하게 될 것입니다’에 가까운 콥트어의 미래-존재 표현입니다.
    reason: source_note
  - marker: d
    text: 요한복음 7:34, 8:21, 13:33에도 유사한 모티프가 나타나지만, 이 본문은 그 정경 본문들의 표현에 맞추어 번역하지 않았습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲁϩ ⲛⲥⲟⲡ
  english_pob_choice: many times
  chosen_korean: 여러 번
  alternatives_korean:
  - 자주
  - 많은 번
  lexicon: Crum; Layton
  rationale: 사미드 콥트어 관용구의 반복성을 자연스러운 현대 한국어로 옮기되, 과도하게 문어적이지 않게 유지했습니다.
- source_word: ⲣ̄ⲉⲡⲓⲑⲩⲙⲉⲓ
  english_pob_choice: desired
  chosen_korean: 간절히 바라다
  alternatives_korean:
  - 원하다
  - 갈망하다
  lexicon: Lambdin; Crum
  rationale: 단순한 ‘원하다’보다 강한 내적 열망을 드러내되, 본문이 허용하는 범위를 넘지 않도록 했습니다.
- source_word: ⲉⲥⲱⲧⲙ
  english_pob_choice: hear
  chosen_korean: 듣다
  alternatives_korean:
  - 청종하다
  - 들어 청하다
  lexicon: Lambdin; Crum
  rationale: 감각적 ‘듣기’의 기본 의미를 살려, 순종의 뉘앙스를 덧씌우지 않았습니다.
- source_word: ⲡⲉⲓϣⲁϫⲉ ⲡⲁⲓ … ⲛⲛⲧⲟⲟⲩ
  english_pob_choice: these words
  chosen_korean: 이 말씀
  alternatives_korean:
  - 이 말들
  - 이 말씀들
  lexicon: Crum; Layton
  rationale: 콥트어는 앞에서 단수 ‘이 말씀’을 쓰다가 뒤에서 복수 지시로 넘어가지만, 한국어에서는 예수의 발화 단위를 자연스럽게 묶는 ‘이 말씀’이 가장 적절합니다.
- source_word: ⲙⲛⲧⲁⲛⲧⲱⲧⲛ ⲕⲉⲟⲩⲁ ⲉⲥⲱⲧⲙ ⲛ̄ⲧⲟⲟⲧϥ
  english_pob_choice: you have no other from whom to hear [them]
  chosen_korean: 너희에게는 그 말씀을 들을 다른 이가 없습니다
  alternatives_korean:
  - 너희는 그 말을 들을 다른 사람이 없습니다
  - 너희에게는 들을 다른 이가 없습니다
  lexicon: Crum; Layton
  rationale: ‘다른 이’로 ⲕⲉⲟⲩⲁ의 ‘다른 한 사람’을 살리고, 관계절을 한국어 자연어로 풀어 ‘from whom’의 기능을 반영했습니다.
- source_word: ⲟⲩⲛ ϩⲛ ϩⲟⲟⲩ ⲛⲁϣⲱⲡⲉ
  english_pob_choice: There will be days
  chosen_korean: 너희가 나를 찾게 될 날들이 있을 터인데
  alternatives_korean:
  - 날들이 있을 것이고
  - 그런 날들이 올 것입니다
  lexicon: Crum
  rationale: 콥트어의 미래-존재 관용구를 한국어의 전망 표현으로 옮기면서, ‘찾게 될 날들’로 뒤의 목적절을 자연스럽게 연결했습니다.
- source_word: ⲛⲧⲉⲧⲛ̄ϣⲓⲛⲉ ⲛ̄ⲥⲱⲉⲓ
  english_pob_choice: you will seek me
  chosen_korean: 너희가 나를 찾게 될
  alternatives_korean:
  - 너희가 나를 찾을
  - 너희가 나를 구하게 될
  lexicon: Layton
  rationale: ‘찾다’가 본문의 ⲛⲥⲱⲉⲓ를 가장 직접적으로 반영하며, 한국어에서는 ‘찾게 될 날들’이 시간절로 가장 자연스럽습니다.
theological_decisions:
- issue: 예수의 발화에 대한 호칭과 직접인용의 문체
  chosen_reading: 서술문은 ‘예수께서 말씀하셨습니다’로 두고, 직접인용 안에서는 그대로 공손한 예수의 자기진술과 경고를 유지했습니다.
  alternative_readings:
  - ‘예수께서 이르셨습니다’
  - 직접인용을 더 평이한 구어로 처리
  rationale: 토마스 복음의 격언적 음성을 살리면서도, 한국어 합쇼체로 공적 낭독에 적합한 문체를 유지하기 위해서입니다.
  doctrine_reference: 문체·화자표지 일관성
