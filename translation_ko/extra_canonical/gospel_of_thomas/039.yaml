base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/039.yaml
  text: Jesus said[a], “The Pharisees and the scribes have received the keys of knowledge; they have hidden them. They did not enter, and they did not allow those who wished to enter[e][d][c][b]. But you—become prudent like serpents and innocent like doves.”
  footnotes:
  - marker: a
    text: 'POxy 655 reads the similes in the plural (“serpents … doves”), while the Coptic has generic singular: “the serpent … the dove.” This draft follows the Coptic usage.'
    reason: textual_variant
  - marker: b
    text: Cf. Luke 11:52 (“You have taken away the key of knowledge…”) and Matthew 23:13 (blocking entry), for thematic parallels.
    reason: cross_reference
  - marker: c
    text: Cf. Matthew 10:16 (“wise as serpents and innocent as doves”) for a related formulation.
    reason: cross_reference
  - marker: d
    text: 'Coptic ⲛⲡϩⲉ means “in the manner of,” here introducing comparisons: “like the serpent … like the dove.”'
    reason: dialect_note
  - marker: e
    text: Or 'like the serpent and innocent like the dove'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “바리새인들과 서기관들은 지식의 열쇠를 받았고 그것들을 숨겼습니다. 그들은 들어가지 않았고, 들어가려는 이들도 들어가지 못하게 했습니다. 그러나 여러분은 뱀처럼 분별 있고 비둘기처럼 순전하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사본 원문에서 ‘뱀’과 ‘비둘기’는 복수형입니다. 한국어의 ‘뱀처럼’, ‘비둘기처럼’은 일반적 범주를 가리키므로 이 복수의 뜻을 자연스럽게 포함합니다.
    reason: textual_variant
  - marker: b
    text: 눅 11:52(‘지식의 열쇠’)와 마 23:13(들어가려는 이들을 막음)에는 이 말씀과 관련된 주제가 나타납니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲫⲁⲣⲓⲥⲁⲓⲟⲥ / ⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ
  english_pob_choice: the Pharisees and the scribes
  chosen_korean: 바리새인들과 서기관들
  alternatives_korean:
  - 바리새파 사람들과 율법학자들
  - 바리새인과 서기관
  lexicon: Layton; Crum
  rationale: 집단을 가리키는 복수 표현으로 이해하여 한국어도 복수형으로 옮겼습니다. ‘서기관들’은 유대 종교 엘리트라는 표준적 대상을 유지합니다.
- source_word: ϣⲁϣⲧ / ⲅⲛⲱⲥⲓⲥ
  english_pob_choice: the keys of knowledge
  chosen_korean: 지식의 열쇠
  alternatives_korean:
  - 앎의 열쇠
  - 지성의 열쇠
  lexicon: Crum; Layton
  rationale: ⲅⲛⲱⲥⲓⲥ는 여기서 기술적 ‘그노시스’보다 일반적 ‘지식’이 자연스럽고, 복수 ‘keys’는 ‘열쇠’로 유지했습니다.
- source_word: ⲟⲩϩⲟⲡ / ⲙⲡⲉⲛⲧⲟⲟⲩⲃⲱⲕ ⲉϩⲟⲩⲛ
  english_pob_choice: they have hidden them / they did not enter
  chosen_korean: 그것을 숨겼습니다 / 그들은 들어가지 않았고
  alternatives_korean:
  - 그것들을 감추었습니다 / 그들은 안으로 들어가지 않았고
  - 그것을 감추었습니다 / 그들은 들어가지 못했습니다
  lexicon: Crum
  rationale: 동사의 기본 의미를 직역하기보다 한국어에서 자연스러운 ‘숨기다’로 옮겼고, ‘들어가다’는 ⲃⲱⲕ ⲉϩⲟⲩⲛ의 이동-진입 의미를 반영했습니다.
- source_word: ⲛⲉⲧⲟⲩⲱϣ ⲉⲃⲱⲕ ⲉϩⲟⲩⲛ
  english_pob_choice: those who wished to enter
  chosen_korean: 들어가려는 이들
  alternatives_korean:
  - 들어가고 싶어하는 이들
  - 들어가기를 원한 사람들
  lexicon: Crum
  rationale: 의지 표현을 간결하게 살리면서도 한국어 문맥에서 자연스럽게 읽히도록 했습니다.
- source_word: ⲫⲣⲟⲛⲓⲙⲟⲥ / ⲁⲕⲉⲣⲁⲓⲟⲥ
  english_pob_choice: prudent ... innocent
  chosen_korean: 신중하고 ... 순결하십시오
  alternatives_korean:
  - 지혜롭고 ... 순진하십시오
  - 분별 있고 ... 순전하십시오
  lexicon: Layton
  rationale: ⲫⲣⲟⲛⲓⲙⲟⲥ는 단순한 지적 ‘지혜’보다 상황을 분별하는 ‘신중함’이 더 가깝고, ⲁⲕⲉⲣⲁⲓⲟⲥ는 ‘무죄’보다 도덕적·상징적 결을 살린 ‘순결’이 한국어에서 더 직접적으로 전달된다고 보았습니다.
- source_word: ⲛⲡϩⲉ ⲛⲡϩⲟϥ / ⲛⲡϩⲉ ⲛⲡϭⲣⲟⲙⲡⲉ
  english_pob_choice: like serpents ... like doves
  chosen_korean: 뱀처럼 ... 비둘기처럼
  alternatives_korean:
  - 뱀과 같이 ... 비둘기와 같이
  - 뱀처럼 ... dove처럼
  lexicon: Crum
  rationale: 비교 구문 ⲛⲡϩⲉ는 한국어의 ‘-처럼’이 가장 자연스럽고, Coptic의 복수형을 반영해 복수 명사로 옮겼습니다.
theological_decisions:
- issue: ‘지식의 열쇠’가 단순 정보가 아니라 진입을 가능케 하는 권위의 상징이라는 점
  chosen_reading: 본문의 핵심을 지식 자체보다 접근 권한과 책임의 상징으로 읽되, 한국어 본문은 상징을 과도하게 해설하지 않고 그대로 둡니다.
  alternative_readings:
  - 단순히 배우는 지식의 열쇠로 읽기
  - 구원의 비밀 지식으로 특수화하여 읽기
  rationale: 이 문맥은 ‘들어가다/들어가게 하다’와 결합되어 있어, 지식이 문을 여는 권한 또는 해석 권위로 기능한다는 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 해석학적 상징 읽기; 눅 11:52, 마 23:13 평행
