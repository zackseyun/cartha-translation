revisions:
- from: 예수께서 말씀하셨습니다. 「바리새인들과 서기관들은 지식의 열쇠를 받았지만, 그것을 숨겼습니다. 그들은 들어가지 않았고, 들어가려는 이들도 들어가지 못하게 했습니다. 그러나 여러분은 뱀처럼 신중하고, 비둘기처럼 순결하십시오」[a][b]
  to: 예수께서 말씀하셨습니다. “바리새인들과 서기관들은 지식의 열쇠를 받았고 그것들을 숨겼습니다. 그들은 들어가지 않았고, 들어가려는 이들도 들어가지 못하게 했습니다. 그러나 여러분은 뱀처럼 분별 있고 비둘기처럼 순전하십시오.”[a][b]
  rationale: 원문에 없는 역접을 हट하고, 사본 원문의 복수형과 충돌하는 각주를 바로잡았습니다. ‘순전하십시오’로 바꾸어 ⲁⲕⲉⲣⲁⲓⲟⲥ의 넓은 윤리적 의미를 보존했으며, 한국어 일반명사의 자연스러운 무표지 수 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:14Z'
review_pass:
  verdict: revise
  source_fidelity: ‘받았지만’의 역접은 콥트어에 명시되어 있지 않으므로 제거하는 것이 안전합니다. 또한 사본 원문에는 동물 명사가 복수형으로 나타나며, 초안의 각주 a는 정규화 텍스트의 단수형 표기에 기대어 이를 부정확하게 설명합니다. 한국어의 무표지 일반명사 ‘뱀/비둘기’는 이 복수 일반성을 자연스럽게 포괄할 수 있습니다.
  naturalness: ‘분별 있고 … 순전하십시오’는 현대 표준 한국어의 합쇼체로 자연스럽고, 각각 prudent와 innocent/guileless의 대조를 과도한 교리적 함의 없이 전달합니다. ‘들어가려는 이들도 들어가지 못하게 했습니다’도 원문의 허용하지 않음을 자연스럽게 드러냅니다.
  terminology: ‘바리새인들’, ‘서기관들’, ‘지식의 열쇠’는 적절합니다. ⲁⲕⲉⲣⲁⲓⲟⲥ에 ‘순결’보다 ‘순전’을 사용하여 성적·의례적 순결로 의미가 좁혀지는 것을 피했습니다.
  issues:
  - severity: medium
    issue: ‘받았지만’에 원문에 없는 역접이 추가되었습니다.
    rationale: 원문은 ‘열쇠를 받았다/취했다’와 ‘그것들을 숨겼다’를 단순히 이어 말합니다. 한국어에서 역접을 넣으면 두 행위의 논리 관계를 해석적으로 강화합니다.
  - severity: high
    issue: 각주 a가 콥트어 동물 명사를 복수형으로 나타낸다는 설명과 함께 비교 구문을 ⲛⲡϩⲉ로 제시합니다.
    rationale: 사본 원문은 ⲛ̄ⲑⲉ ⲛ̄ⲛϩⲟϥ 및 ⲛ̄ⲑⲉ ⲛ̄ⲛ̄ϭⲣⲟⲙⲡⲉ로, 동물 명사가 복수입니다. 제공된 정규화 텍스트의 단수형 표기는 이 대목에서 사본 표기와 충돌하므로 각주는 사본 원문을 기준으로 바로잡아야 합니다.
  - severity: low
    issue: ‘순결하십시오’는 ⲁⲕⲉⲣⲁⲓⲟⲥ의 의미를 다소 좁힐 수 있습니다.
    rationale: 이 말은 ‘순수한, 해가 없는, 꾸밈없는’의 폭을 지닙니다. ‘순전하십시오’가 이 폭을 더 잘 보존합니다.
  revised_text: 예수께서 말씀하셨습니다. “바리새인들과 서기관들은 지식의 열쇠를 받았고 그것들을 숨겼습니다. 그들은 들어가지 않았고, 들어가려는 이들도 들어가지 못하게 했습니다. 그러나 여러분은 뱀처럼 분별 있고 비둘기처럼 순전하십시오.”[a][b]
  revised_footnotes:
