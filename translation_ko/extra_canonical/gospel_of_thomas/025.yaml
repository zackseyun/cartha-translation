base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
  footnotes:
  - marker: a
    text: ‘Soul’ translates ψυχή (ⲯⲩⲭⲏ), which can also mean ‘life’ or ‘self.’
    reason: lexical_alternative
  - marker: b
    text: The manuscript line shows ⲙ̄ⲙⲟϥ (direct object ‘him’), while the normalized form has ⲛⲛⲧⲟϥ (‘for him’). Either way, the sense is ‘guard/protect him.’
    reason: textual_variant
  - marker: c
    text: ‘Pupil of your eye’ is literal; later idiom ‘apple of your eye’ is traditional in English but not required by the Coptic lexeme ⲡⲉⲗⲟⲩ.
    reason: lexical_alternative
  - marker: d
    text: 'Compare the Hebrew Bible motif: Deut 32:10; Ps 17:8; Prov 7:2 (LXX).'
    reason: cross_reference
  - marker: e
    text: The comparative is written ⲛ̄ⲑⲉ in the manuscript but normalized as ⲛⲡϩⲉ; both mean ‘as/like’ in Sahidic/Lycopolitan usage.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “네 형제를 네 영혼[a]처럼[e] 사랑하십시오. 그를 네 눈의 눈동자[c]처럼[d] 지키십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영혼’은 ψυχή(ⲯⲩⲭⲏ)의 번역으로, 문맥에 따라 ‘생명’ 또는 ‘자기 자신’을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 사본에는 직접목적어 ⲙ̄ⲙⲟϥ(‘그를’)이 있고, 정규화본에는 ⲛⲛⲧⲟϥ(‘그를 위하여/그에게’에 가까움)가 있습니다. 어느 독법이든 여기서는 그를 지키고 보호하라는 뜻입니다.
    reason: textual_variant
  - marker: c
    text: ‘눈동자’는 문자적으로 눈의 동공을 가리킵니다. 영어의 전통적 관용 번역인 ‘눈의 사과’(apple of your eye)를 따를 필요는 없습니다.
    reason: lexical_alternative
  - marker: d
    text: 이 표현은 신명기 32:10, 시편 17:8, 잠언 7:2의 성경적 모티프와 비교할 수 있습니다.
    reason: cross_reference
  - marker: e
    text: 비교 표현은 사본의 ⲛ̄ⲑⲉ와 정규화본의 ⲛⲡϩⲉ 모두에서 ‘~처럼/~같이’라는 뜻입니다.
    reason: dialect_note
