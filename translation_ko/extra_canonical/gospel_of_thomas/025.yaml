base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
  footnotes:
  - marker: a
    text: ‘Soul’ translates ψυχή (ⲯⲩⲭⲏ), which can also mean ‘life’ or ‘self.’
    reason: lexical_alternative
  - marker: b
    text: The manuscript line shows ⲙ̄ⲙⲟϥ (direct object ‘him’), while the normalized form has ⲛⲛⲧⲟϥ (‘for him’). Either way, the sense is ‘guard/protect him.’
    reason: textual_variant
  - marker: c
    text: ‘Pupil of your eye’ is literal; later idiom ‘apple of your eye’ is traditional in English but not required by the Coptic lexeme ⲡⲉⲗⲟⲩ.
    reason: lexical_alternative
  - marker: d
    text: 'Compare the Hebrew Bible motif: Deut 32:10; Ps 17:8; Prov 7:2 (LXX).'
    reason: cross_reference
  - marker: e
    text: The comparative is written ⲛ̄ⲑⲉ in the manuscript but normalized as ⲛⲡϩⲉ; both mean ‘as/like’ in Sahidic/Lycopolitan usage.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “네 형제를 네 영혼처럼 사랑하십시오. 네 눈의 눈동자처럼 그를 지키십시오.”[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영혼’은 ψυχή의 번역으로, 문맥에 따라 ‘생명’ 또는 ‘자기 자신’이 될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 동사형은 사본의 직접목적형과 정규화본의 간접목적형 차이가 있으나, 의미는 모두 ‘그를 지키다/보호하다’로 같습니다.
    reason: textual_variant
  - marker: c
    text: ‘눈동자’는 문자적으로는 ‘눈의 동공’에 해당하며, 후대의 관용적 ‘눈의 apple’처럼 옮길 필요는 없습니다.
    reason: lexical_alternative
  - marker: d
    text: 이 표현은 신 32:10; 시 17:8; 잠 7:2의 성경적 모티프와 비교할 수 있습니다.
    reason: cross_reference
  - marker: e
    text: 비교 표현은 사본의 ⲛ̄ⲑⲉ와 정규화본의 ⲛⲡϩⲉ 모두에서 ‘~처럼/~같이’의 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 이르셨습니다
  - 예수께서 말씀하셨다
  lexicon: Coptic reporting formula ⲡⲉϫⲉ + subject
  rationale: 도입부의 단순한 발화 표지이므로 현대 한국어의 공손한 서술형으로 자연스럽게 옮겼습니다.
- source_word: ⲥⲟⲛ
  english_pob_choice: brother
  chosen_korean: 형제
  alternatives_korean:
  - 동료
  - 이웃
  - 형제자매
  lexicon: Crum s.v. ⲥⲟⲛ
  rationale: 본문은 혈연보다 친족적·공동체적 관계를 가리키는 기본어로 쓰이므로, POB의 ‘brother’를 한국어의 일반적 ‘형제’로 옮겼습니다.
- source_word: ⲯⲩⲭⲏ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 생명
  - 자기 자신
  lexicon: Greek loanword ψυχή; Crum s.v. ⲯⲩⲭⲏ
  rationale: POB가 지적하듯 이 단어는 ‘영혼/생명/자기 자신’의 여지가 있으나, 본문 대구를 살리면서도 한국어에서 가장 직접적인 대응은 ‘영혼’입니다.
- source_word: ⲉⲓⲣⲉ ⲧⲏⲣⲉ(ⲓ)
  english_pob_choice: guard
  chosen_korean: 지키십시오
  alternatives_korean:
  - 보호하십시오
  - 간수하십시오
  - 지켜 주십시오
  lexicon: Crum s.v. ⲧⲏⲣⲉ ‘keep, guard’
  rationale: 개인의 보호를 뜻하는 명령으로 읽히며, 한국어에서는 ‘지키다’가 가장 간결하고 소리 값도 잘 맞습니다.
- source_word: ⲡⲉⲗⲟⲩ
  english_pob_choice: pupil
  chosen_korean: 눈동자
  alternatives_korean:
  - 동공
  - 눈의 동자
  lexicon: Crum s.v. ⲗⲟⲩ ‘pupil (of the eye)’
  rationale: 직역하면 ‘눈의 동공’이지만, 한국어 성경 문맥에서 ‘눈동자’가 자연스럽고 원문의 ‘소중히 여겨 보호해야 할 가장 중심부’ 이미지를 잘 전달합니다.
