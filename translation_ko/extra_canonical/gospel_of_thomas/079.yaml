base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/079.yaml
  text: A woman said to him in the crowd[a], “Blessed is the womb that bore you, and the breasts that nursed you.” He said to her, “Blessed are those who have heard the word of the Father and have kept it in truth; for days will come when you will say, ‘Blessed is the womb that has not conceived[e][d][c][b], and the breasts that have not given milk.’”
  footnotes:
  - marker: a
    text: The Coptic literally reads “your breasts,” a possessive construction used for the breasts from which you were nursed; rendered idiomatically in English as “the breasts that nursed you.”
    reason: dialect_note
  - marker: b
    text: “Have kept it in truth” could also be rendered “have guarded it” or “have truly kept it.”
    reason: lexical_alternative
  - marker: c
    text: Minor restorations in Dilley’s edition (e.g., in ‘woman,’ ‘womb,’ ‘breasts,’ ‘to nurse’) do not affect the sense of the saying.
    reason: lacuna_or_restoration
  - marker: d
    text: Compare Luke 11:27–28 (response to a woman’s blessing) and Luke 23:29 (“Blessed are the barren … the breasts that never nursed”).
    reason: cross_reference
  - marker: e
    text: Or 'has not borne'.
    reason: previous_rendering
translation:
  language: ko
  text: 무리 가운데 있던 한 여자가 그에게 말했습니다. “당신을 낳은 태와 당신에게 젖을 먹인 젖가슴이[a] 복이 있습니다.” 그가 그 여자에게 말씀하셨습니다. “아버지의 말씀을 듣고 그것을 진리 안에서 지킨[b] 사람들은 복이 있습니다. 여러분이 이렇게 말하게 될 날들이 올 것이기 때문입니다. ‘잉태하지 않은 태가[e][c] 복이 있고, 젖을 먹이지 않은 젖가슴이 복이 있습니다.’”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어는 문자적으로 ‘당신의 젖가슴들’이라는 소유 표현을 사용합니다. 이는 당신에게 젖을 먹인 젖가슴을 가리키므로, 한국어에서는 수유 관계를 드러내어 옮겼습니다.
    reason: dialect_note
  - marker: b
    text: ‘지킨’은 ‘보존한’, ‘간직한’, 또는 ‘참되게 지킨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 딜리 판본의 ‘여자’, ‘태’, ‘젖가슴’, ‘젖을 먹이다’ 등에 있는 소규모 복원은 이 말씀의 뜻을 바꾸지 않습니다.
    reason: lacuna_or_restoration
  - marker: d
    text: 누가복음 11:27–28의 한 여자의 축복과 그 응답, तथा 누가복음 23:29의 ‘잉태하지 못한 태’와 ‘젖을 먹이지 않은 젖가슴’이라는 표현을 비교하십시오.
    reason: cross_reference
  - marker: e
    text: ‘잉태하지 않은’은 ‘낳지 않은’으로도 번역될 수 있으나, 여기의 콥트어 동사는 특히 잉태하거나 임신하는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲏϣⲉ
  english_pob_choice: crowd
  chosen_korean: 무리
  alternatives_korean:
  - 군중
  - 사람들
  lexicon: Crum s.v. ⲙⲏϣⲉ
  rationale: 문맥상 특정 집단이 아닌 ‘사람들이 모인 자리’를 가리키므로, 자연스러운 현대 한국어로 ‘무리’가 적절합니다.
- source_word: ϩⲏ
  english_pob_choice: the womb
  chosen_korean: 태
  alternatives_korean:
  - 자궁
  - 배
  lexicon: Crum s.v. ϩⲏ
  rationale: 앞선 ‘낳은’ 동사와의 대응을 살리면서도 한국어에서 문학적으로 자연스러운 표현이어서 ‘태’를 택했습니다.
- source_word: ϥⲓ ϩⲁ
  english_pob_choice: bore
  chosen_korean: 밴
  alternatives_korean:
  - 낳은
  - 잉태한
  lexicon: Crum s.v. ϥⲓ; Lambdin, Introduction to Sahidic Coptic §143
  rationale: 여기서는 출산 행위 자체보다 ‘몸에 품어 낳은’ 결과를 말하므로, ‘밴’이 한국어 원문과 가장 잘 맞습니다.
- source_word: ⲓⲃⲉ
  english_pob_choice: breasts
  chosen_korean: 젖가슴
  alternatives_korean:
  - 가슴
  - 유방
  lexicon: Crum s.v. ⲓⲃⲉ
  rationale: 수유 문맥을 분명히 드러내면서도 너무 의학적이지 않은 표현으로 ‘젖가슴’을 선택했습니다.
- source_word: ⲥⲁⲛⲟⲩϣ
  english_pob_choice: nursed
  chosen_korean: 젖먹인
  alternatives_korean:
  - 먹인
  - 젖을 먹여 기른
  lexicon: Crum s.v. ⲥⲁⲛⲟⲩϣ
  rationale: 동사의 의미가 ‘젖을 먹이다’이므로, 명사구와 결합한 관형형 ‘젖먹인’이 간결하고 정확합니다.
- source_word: ⲡⲗⲟⲅⲟⲥ
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 로고스
  lexicon: Greek λόγος
  rationale: 토마스 복음 전반의 종교적·계시적 용례를 반영하여 한국어 성경 문체에서 자연스러운 ‘말씀’으로 옮겼습니다.
- source_word: ϩⲁⲣⲉϩ ⲉⲣⲟϥ
  english_pob_choice: have kept it
  chosen_korean: 지킨
  alternatives_korean:
  - 간직한
  - 보존한
  - 지켜 온
  lexicon: Crum s.v. ϩⲁⲣⲉϩ
  rationale: 지키다/보호하다의 뜻을 살리면서 문장 흐름을 매끄럽게 하기 위해 관형형 ‘지킨’으로 옮겼습니다.
- source_word: ϩⲛ ⲟⲩⲙⲉ
  english_pob_choice: in truth
  chosen_korean: 진리 안에서
  alternatives_korean:
  - 진리로
  - 참되게
  lexicon: Crum s.v. ⲙⲉ
  rationale: 직역의 ‘진리 안에서’를 택해, 단순한 부사 ‘참되게’보다 관계적·존재론적 뉘앙스를 보존했습니다.
- source_word: ⲙⲡⲉⲛⲧⲟⲥⲱⲱ
  english_pob_choice: has not conceived
  chosen_korean: 밴 적도 없는
  alternatives_korean:
  - 잉태하지 않은
  - 임신한 적도 없는
  lexicon: Crum s.v. ⲱ
  rationale: 주석된 수정에 따라 ‘conceive/become pregnant’의 의미를 반영해야 하므로, 앞의 ‘밴’과 대구를 이루는 표현으로 처리했습니다.
- source_word: ⲧⲟⲟⲩϯ ⲉⲣⲱⲧⲉ
  english_pob_choice: have not given milk
  chosen_korean: 젖을 준 적도 없는
  alternatives_korean:
  - 젖먹인 적도 없는
  - 젖을 먹인 적도 없는
  lexicon: Crum s.v. ⲧⲟⲟⲩϯ; ⲣⲱⲧⲉ
  rationale: 직역보다 한국어에서 자연스럽고, 앞 절의 ‘밴 적도 없는’과 균형을 이루는 표현입니다.
theological_decisions:
- issue: 복 있는 자의 기준이 모친적 생물학이 아니라 말씀 청종과 보존에 놓임
  chosen_reading: 예수의 응답을 ‘아버지의 말씀을 듣고 그것을 진리 안에서 지킨 사람들’의 복으로 제시해, 첫 축복의 생물학적 축복을 전복하는 대조를 살렸습니다.
  alternative_readings:
  - ‘말씀을 들은 자’로만 약화해서 읽기
  - 마리아 중심의 기독론적 해석으로 좁히기
  rationale: 본문의 핵심은 출산/수유의 복보다 더 큰 복으로서 말씀의 청종과 보존을 제시하는 데 있으므로, 대조 구조를 흐리지 않도록 했습니다.
  doctrine_reference: Luke 11:27–28 parallel; Gospel of Thomas saying structure
- issue: ‘진리 안에서’의 관계적 표현 유지
  chosen_reading: 단순히 ‘참되게’라고 풀지 않고 ‘진리 안에서’로 옮겨, 행위의 방식이 아닌 진리라는 영역/관계 안에 있음을 드러냈습니다.
  alternative_readings:
  - ‘참되게 지킨’
  - ‘진실로 지킨’
  rationale: 토마스 문헌 특유의 영지적·계시적 어조를 고려하면, ‘안에서’라는 전치사적 구조를 보존하는 편이 더 स्रोत-가깝습니다.
  doctrine_reference: Thomasine sayings style
