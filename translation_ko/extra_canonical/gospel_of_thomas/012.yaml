base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/012.yaml
  text: The disciples said to Jesus[a], "We know that you will depart from us. Who will be great over us?" Jesus said to them, "Wherever you are, you are to go to James the Just—this one[f][e][d][c][b], for whose sake heaven and earth came into being."
  footnotes:
  - marker: a
    text: 'ⲛⲁⲃⲱⲕ: rendered as "depart"; alternatives "go" or "leave" are possible depending on whether movement or separation is emphasized.'
    reason: lexical_alternative
  - marker: b
    text: 'ⲉⲧⲉⲣⲉⲛⲁⲣⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲛⲁⲛⲟⲛ: translated as "be great over us." Some take ⲣⲛⲟϭ idiomatically as "rule"; we avoid importing political language not present in the Coptic.'
    reason: lexical_alternative
  - marker: c
    text: 'ⲡⲙⲁ ⲉⲧⲉⲣⲉⲁⲛⲧⲱⲧⲛⲉⲓ ⲙⲙⲁⲩ: literally, "the place where you yourselves have come." Many modern renderings smooth this to "wherever you are." We preserve the relative clause and reflexive emphasis.'
    reason: alternative_reading
  - marker: d
    text: 'ⲁⲡⲡⲉ ("heaven"): Lycopolitan-style spelling in NH II; equivalent to standard Sahidic ⲁⲡⲉ/ⲧⲁⲡⲉ.'
    reason: dialect_note
  - marker: e
    text: 'James the Just as a leader: see Acts 15 and Galatians 1–2 for later early Christian context; Hegesippus (via Eusebius, Hist. Eccl. 2.23) uses the sobriquet "the Just."'
    reason: cross_reference
  - marker: f
    text: Or 'Where you yourselves have come,'.
    reason: previous_rendering
translation:
  language: ko
  text: 제자들이 예수님께 말했습니다. "우리는 당신이 우리에게서 떠나실 것을 압니다. 누가 우리보다 더 크게 되겠습니까?" 예수님께서 그들에게 말씀하셨습니다. "여러분이 있는 곳, 여러분은 가서 야고보 의인에게 가야 합니다 — 이 사람에게, 하늘과 땅이 그를 위해 생겨났기 때문입니다."[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲛⲁⲃⲱⲕ는 ‘떠나시다/가시다/가다’가 가능하지만, 문맥상 공동체를 떠나는 뉘앙스를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲉⲧⲛⲁⲣ̄ⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲱⲛ은 직역하면 ‘우리 위에 크게 되다’이며, ‘다스리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: Coptic 구문 ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ는 문자적으로 ‘여러분이 와 있는 그곳’에 가깝습니다.
    reason: alternative_reading
  - marker: d
    text: ⲡⲇⲓⲕⲁⲓⲟⲥ는 별칭형으로 쓰인 ‘the Just’이며, ‘의인’은 한국어에서 가장 간결한 대응입니다.
    reason: lexical_alternative
  - marker: e
    text: ‘for whose sake’는 원인만이 아니라 목적·의도도 담을 수 있는 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: ⲛⲁⲃⲱⲕ
  english_pob_choice: depart / go / leave
  chosen_korean: 떠나실
  alternatives_korean:
  - 가실
  - 떠나가실
  lexicon: Crum; Layton
  rationale: 문맥상 단순 이동보다 제자 공동체를 떠나는 의미가 강하므로, 예수님의 미래 이동을 공손하게 ‘떠나실’로 옮겼습니다.
- source_word: ⲉⲧⲛⲁⲣ̄ⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲱⲛ
  english_pob_choice: be great over us
  chosen_korean: 우리보다 더 크게 되겠습니까
  alternatives_korean:
  - 우리 위에 더 크게 되겠습니까
  - 우리를 다스리겠습니까
  lexicon: Crum; Layton
  rationale: 본문의 핵심은 정치적 지배보다 ‘크다/우위에 있다’는 표현이므로, POB의 선택을 따라 권력어를 덜어내고 위계를 드러냈습니다.
- source_word: ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ
  english_pob_choice: Wherever you are
  chosen_korean: 여러분이 있는 곳
  alternatives_korean:
  - 여러분이 와 있는 곳
  - 여러분이 도달한 곳
  lexicon: Layton; Coptic syntax note
  rationale: 문법상 ‘여러분이 와 있는 그곳’에 해당하는 구문이지만, 한국어에서는 자연스럽게 ‘여러분이 있는 곳’으로 옮기되, 임의의 ‘어디든지’로 풀지 않았습니다.
- source_word: ϣⲁⲓⲁⲕⲱⲃⲟⲥ ⲡⲇⲓⲕⲁⲓⲟⲥ
  english_pob_choice: James the Just
  chosen_korean: 야고보 의인
  alternatives_korean:
  - 야고보, 의인인 그 사람
  - 야고보 공의로운 자
  lexicon: Crum; standard biblical name form
  rationale: ⲡⲇⲓⲕⲁⲓⲟⲥ는 호칭형 별칭이므로, 전통적이면서도 직접적인 ‘의인’으로 옮겨 제목성을 살렸습니다.
- source_word: ⲧⲡⲉ ⲙⲛ̄ⲡⲕⲁϩ ϣⲱⲡⲉ ⲉⲧⲃⲉⲛⲧⲟϥ
  english_pob_choice: for whose sake heaven and earth came into being
  chosen_korean: 하늘과 땅이 그를 위해 생겨났기 때문입니다
  alternatives_korean:
  - 하늘과 땅이 그 때문에 생겨났기 때문입니다
  - 하늘과 땅이 그를 위하여 있게 되었기 때문입니다
  lexicon: Crum; idiomatic causative relative
  rationale: ⲉⲧⲃⲉⲛⲧⲟϥ는 ‘그를 위해/그 때문에’를 모두 가능하게 하지만, POB의 ‘for whose sake’에 따라 목적·의도 뉘앙스를 살렸습니다.
theological_decisions:
- issue: ‘James the Just’의 호칭 번역
  chosen_reading: ‘의인’은 단순 성품 묘사가 아니라 인물의 별칭으로 읽고, 본문에 그대로 드러냅니다.
  alternative_readings:
  - ‘의로운 사람’처럼 서술적으로 완화
  - ‘공의로운 자’처럼 더 추상적으로 번역
  rationale: 본문은 야고보를 지시하는 호칭 구조이므로, 별칭성을 유지하는 쪽이 화자의 강조를 더 잘 보존합니다.
  doctrine_reference: 인물 호칭 보존 / 본문 의미 우선
- issue: ‘그를 위해 하늘과 땅이 생겨났다’의 목적성
  chosen_reading: 창조의 이유를 단순한 인과보다 목적·의도에 가까운 표현으로 유지합니다.
  alternative_readings:
  - ‘그 때문에 하늘과 땅이 생겨났습니다’
  - ‘그로 말미암아 하늘과 땅이 생겨났습니다’
  rationale: POB audit trail이 보존한 ‘for whose sake’를 따라, 본문이 인물의 중요성을 극대화하는 수사임을 유지했습니다.
  doctrine_reference: 목적/의도적 인과 표현
