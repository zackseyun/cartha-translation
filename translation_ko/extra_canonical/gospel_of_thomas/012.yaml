    rationale: 본문은 단순히 제자들과 비교하여 더 위대하냐가 아니라, 그들 위에 큰 이가 누구냐를 묻습니다.
  - severity: medium
    issue: ‘여러분이 있는 곳, 여러분은 가서 … 가야 합니다’는 지시문의 한국어 표현이 부자연스럽고 동사 ‘가다’가 중복됩니다.
    rationale: ⲡⲙⲁ … ⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁⲃⲱⲕ ϣⲁ는 장소 절과 야고보에게 가라는 지시를 구성합니다.
  - severity: low
