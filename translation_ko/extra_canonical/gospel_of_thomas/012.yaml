  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 질문의 ⲉϩⲣⲁⲓ ⲉϫⲛⲁⲛⲟⲛ은 ‘우리보다’라는 단순 비교가 아니라 ‘우리 위에/우리 위로’라는 우위 관계를 나타냅니다. 또한 예수님의 지시는 ‘있는 곳’과 ‘가다’가 중복되지 않도록 옮겨야 합니다. ⲉⲧⲃⲉⲛⲧⲟϥ는 넓게 ‘그 때문에/그를 위하여’의 범위를 가지므로, 목적성만을 단정하는 주석은 피하는 것이 안전합니다.
  naturalness: 초안의 ‘여러분이 있는 곳, 여러분은 가서 야고보 의인에게 가야 합니다’는 한국어에서 어색할 뿐 아니라 ‘가서 … 가다’가 중복됩니다. ‘여러분이 어디에 있든지 … 가야 합니다’는 현대 표준어 합쇼체로 자연스럽고, 영어 POB의 ‘Wherever you are’를 충실히 반영합니다.
  terminology: ‘야고보 의인’은 James the Just의 별칭적 성격을 간결하게 유지합니다. ‘예수님/예수님께서’ 및 직접화법의 합쇼체는 목표 등록에 적절합니다.
