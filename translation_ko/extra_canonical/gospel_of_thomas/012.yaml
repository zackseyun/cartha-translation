revisions:
- from: 제자들이 예수님께 말했습니다. "우리는 당신이 우리에게서 떠나실 것을 압니다. 누가 우리보다 더 크게 되겠습니까?" 예수님께서 그들에게 말씀하셨습니다. "여러분이 있는 곳, 여러분은 가서 야고보 의인에게 가야 합니다 — 이 사람에게, 하늘과 땅이 그를 위해 생겨났기 때문입니다."[a][b][c][d][e]
  to: 제자들이 예수님께 말했습니다. “우리는 당신이 우리에게서 떠나실[a] 것을 압니다. 누가 우리 위에 큰 자가 되겠습니까?[b]” 예수님께서 그들에게 말씀하셨습니다. “여러분이 어디에 있든지[c] 야고보 의인[d]에게 가야 합니다. 하늘과 땅이 그를 위하여 생겨난 바로 그 사람이기 때문입니다.[e]”
