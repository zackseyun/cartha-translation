  language: ko
  text: 예수께서 말씀하셨습니다. 「지나가는 이들이 되십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “지나가는 이들”입니다. 문맥상 “지나쳐 가는 이들”, “일시적인 존재”, 또는 “여행자들”로도 이해될 수 있습니다. 바탕 동사는 그리스어 차용어로, “지나가다”를 뜻합니다.
    reason: lexical_alternative
