  text: 예수께서 말씀하셨습니다. 「지나가는 사람이 되십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “지나가는 사람들”이며, 더 넓게는 “지나쳐 가는 이들”, “일시적인 존재”, “여행자들”로도 옮길 수 있습니다.
    reason: lexical_alternative
