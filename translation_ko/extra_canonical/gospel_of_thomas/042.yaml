  lexicon: Crum; Lambdin; Layton (grammar)
  rationale: 그리스어 차용어 ‘지나가다’의 의미를 살려, 명사적으로는 ‘지나가는 사람’으로 옮겨 간결한 잠언형 표현을 유지했습니다.
theological_decisions:
- issue: 이 말의 명령적 뉘앙스
  chosen_reading: 단순한 존재 변화보다는 ‘지나가는 상태가 되라’는 권고/명령으로 읽었습니다.
  alternative_readings:
  - 존재론적 변화를 강조하는 ‘되다’
  - 일시성 자체를 은유적으로 강조하는 해석
  rationale: ϣⲱⲡⲉ ⲉⲣⲉ- 구문은 잠언적 명령으로 기능하므로, 화자의 의도를 약화시키지 않도록 명령형으로 옮겼습니다.
