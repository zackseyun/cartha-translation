  source_fidelity: 첫 절의 ‘나는 이 집을 허물 것이다’는 복원된 콥트어와 잘 맞습니다. 그러나 둘째 절의 능력 부정은 미래의 의미인데, 초안의 ‘세울 수 없습니다’는 현재형입니다. 또한 ‘짓다/세우다’라는 행위는 콥트어에 명시되어 있지 않고 집이라는 선행사와 문맥에서 보충되는 것이므로 주석에서 이를 분명히 해야 합니다.
  naturalness: ‘이 집을 허물 것이며, 아무도 그것을 지을 수 없을 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 미래 선언과 부정 능력 표현을 정확히 드러냅니다.
  terminology: ‘집’은 ⲉⲓⲏⲓ의 기본 의미를 충실히 옮깁니다. 파괴의 능동성을 ‘허물다’로 유지했습니다. ‘짓다’는 한국어에서 집의 건축에 가장 자연스럽지만, 원문상 보충된 말임을 각주로 밝혀야 합니다.
