base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/071.yaml
  text: Jesus said[a], I will cast down this house[c][b], and no one will be able to build it.
  footnotes:
  - marker: a
    text: 'The object after ‘cast down’ is restored: the manuscript shows ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϯⲛⲁϣⲟⲣ[ϣⲣ ⲙⲡⲉⲉ]ⲓ̣ⲏ̣ⲉⲓ; Dilley normalizes to ⲛⲡⲉⲓⲏⲓ (‘this house’).'
    reason: lacuna_or_restoration
  - marker: b
    text: The verb ϣⲕⲱⲧ is ‘be able’ (Crum); the action (‘build’) is inferred from the object ‘house’ and context. Some translations supply ‘rebuild,’ but ‘again’ is not explicit in the Coptic.
    reason: lexical_alternative
  - marker: c
    text: ⲙⲛ̄ⲗⲁⲁⲩ is the negative + indefinite ‘no one’; ⲗⲁⲁⲩ is common across Sahidic/Lycopolitan.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “나는 이 집을 허물 것이며, 아무도 그것을 지을 수 없을 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 집’은 필사본의 손상된 부분을 복원한 읽기에 따른 것입니다. 현존 필사본에는 ⲡⲉϫⲉⲓ︤ⲥ︥ ϫⲉϯⲛⲁϣⲟⲣ[ϣⲣ ⲙⲡⲉⲉ]ⲓ̣ⲏ̣ⲉⲓ로 남아 있으며, 정규화 본문은 ⲛⲡⲉⲓⲏⲓ(‘이 집’)로 읽습니다.
    reason: lacuna_or_restoration
  - marker: b
    text: ⲛⲁϣⲕⲱⲧ은 ‘할 수 있을 것이다/능할 것이다’라는 뜻입니다. ‘짓다’는 앞의 ‘집’과 문맥에 따라 보충한 말이며, 원문에는 ‘다시’라는 말이 명시되어 있지 않습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲙⲛ̄ⲗⲁⲁⲩ는 부정사와 부정대명사의 결합으로, ‘아무도 없다’ 또는 ‘아무도 …하지 못한다’는 뜻입니다.
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 말씀하셨어요
  - 예수께서 이르셨습니다
  lexicon: Crum; Layton Grammar
  rationale: 발화 도입 공식은 평서형 서술로 옮기되, 합쇼체에 맞게 ‘말씀하셨습니다’를 택해 화자 표지를 자연스럽게 유지했습니다.
- source_word: ϣⲟⲣϣⲣ
  english_pob_choice: cast down
  chosen_korean: 허물 것이며
  alternatives_korean:
  - 무너뜨릴 것이며
  - 헐어 버릴 것이며
  - 무너질 것이며
  lexicon: Crum
  rationale: Coptic의 거칠고 직접적인 ‘tear down/demolish’ 의미를 살려, 단순한 붕괴보다 주체적 파괴 행위를 드러내는 ‘허물다’로 옮겼습니다.
- source_word: ⲡⲉⲓⲏⲓ
  english_pob_choice: this house
  chosen_korean: 이 집
  alternatives_korean:
  - 이 집안
  - 이 건물
  - 이 거처
  lexicon: Crum
  rationale: ⲉⲓⲏⲓ는 기본적으로 ‘house, dwelling’이므로 가장 सीधे한 현대 한국어 대응인 ‘집’을 사용했고, 지시어 ⲡⲉⲓ-의 ‘이’도 보존했습니다.
- source_word: ϣⲕⲱⲧ
  english_pob_choice: be able
  chosen_korean: 수 없습니다
  alternatives_korean:
  - 할 수 없습니다
  - 세울 수 없습니다
  - 능히 …할 수 없습니다
  lexicon: Crum
  rationale: 어근은 ‘능하다/할 수 있다’이지만, 문맥상 대상은 집을 다시 세우는 행위이므로 한국어에서는 능력 부정을 자연스럽게 ‘수 없습니다’로 표현했습니다.
- source_word: ⲛⲧⲟϥ
  english_pob_choice: it
  chosen_korean: 그것
  alternatives_korean:
  - 이를
  - 그 집을
  - 그것을
  lexicon: Layton Grammar
  rationale: 능력 구문에서의 목적 대상을 한국어 지시대명사 ‘그것’으로 처리해, 앞의 ‘이 집’을 가리키는 대상을 분명히 했습니다.
theological_decisions:
- issue: 첫 인칭 예언적 발화의 직설성
  chosen_reading: ‘나는 이 집을 허물 것이며’처럼 예수의 자기 선언을 직접 인용으로 유지했습니다.
  alternative_readings:
  - ‘이 집은 허물어질 것입니다’처럼 수동적으로 완화
  - ‘나는 이 성전을 무너뜨리겠습니다’처럼 전통 교회어로 전환
  rationale: 토마스 복음서의 격한 자기 선언과 주체성을 약화하지 않기 위해, 능동적·직설적 표현을 유지했습니다.
  doctrine_reference: source-directed narrative voice; avoid domesticating prophetic speech
