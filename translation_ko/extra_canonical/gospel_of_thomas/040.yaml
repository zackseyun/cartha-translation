base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/040.yaml
  text: Jesus said[a], "A grapevine was planted outside the Father, and since it is not established[e][d][c][b], it will be uprooted from its root and will perish."
  footnotes:
  - marker: a
    text: The noun is a Greek loan (ἄμπελος), here spelled without the nasal (ⲙ) as ⲃⲁⲡⲉⲗⲟⲟⲗⲉ, a dialectal/orthographic feature.
    reason: dialect_note
  - marker: b
    text: ⲥⲧⲁϫⲣⲟ could also be rendered “be firm/strong,” or idiomatically “take root.” “Be established” keeps the broader semantic range without adding imagery not stated by the verb itself.
    reason: lexical_alternative
  - marker: c
    text: Coptic uses an impersonal “they” (ⲛⲧⲟⲟⲩ) for generic agency; English could paraphrase with a passive (“it will be uprooted”), but the translation retains the active impersonal form.
    reason: lexical_alternative
  - marker: d
    text: ϩⲁ ⲡⲉⲥⲛⲟⲩⲛⲉ can be “from its root” or “by its root”; either preposition reflects separation/source.
    reason: lexical_alternative
  - marker: e
    text: Or 'A grapevine was planted outside the Father; and since it was not established, they will uproot it from its root, and it will perish.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다[a]. "아버지 밖에 심겨진 포도나무는, 그것이 세워져 있지 않기 때문에 뿌리에서 뽑혀서 멸망할 것입니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 ‘예수’는 콥트어 고유명사 ⲓⲏⲥⲟⲩⲥ에 대한 표기입니다.
    reason: source_note
lexical_decisions:
- source_word: ⲟⲩⲃⲁⲡⲉⲗⲟⲟⲗⲉ
  english_pob_choice: grapevine
  chosen_korean: 포도나무
  alternatives_korean:
  - 포도덩굴
  - 덩굴포도나무
  lexicon: Crum; Layton
  rationale: 그리스어 차용어 ἄμπελος에 해당하는 농경적 표현으로, 한국어에서는 가장 자연스럽고 표준적인 성서어인 ‘포도나무’가 적절합니다.
- source_word: ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ
  english_pob_choice: outside
  chosen_korean: 밖에
  alternatives_korean:
  - 바깥에
  - 밖으로
  lexicon: Layton (syntax)
  rationale: ‘outside’의 위치 표현을 간결하게 살려, 토마스 복음서 특유의 짧은 문장 호흡을 유지했습니다.
- source_word: ⲥⲧⲁϫⲣⲟ
  english_pob_choice: be established
  chosen_korean: 세워져 있지 않기
  alternatives_korean:
  - 굳건하지 않기
  - 단단하지 않기
  - 뿌리내리지 않기
  lexicon: Crum
  rationale: 이 동사는 ‘견고하다/굳다’의 범위를 가지므로, 포도나무의 비유 안에서 너무 좁은 ‘뿌리내리다’보다 더 넓은 ‘세워져 있다’로 옮겨 원문의 의미 범위를 보존했습니다.
- source_word: ⲛⲧⲟⲟⲩ + ⲛⲁⲡⲱⲣⲕⲛⲧⲟⲥ
  english_pob_choice: it will be uprooted
  chosen_korean: 뿌리에서 뽑혀서
  alternatives_korean:
  - 뿌리째 뽑혀서
  - 뿌리에서 뽑혀서
  lexicon: Layton; Crum
  rationale: 콥트어의 비인칭 3인칭 복수 용법을 한국어에서는 자연스러운 수동 표현으로 옮기되, ‘뿌리에서’라는 분리/근원 의미를 살렸습니다.
theological_decisions:
- issue: ‘아버지’의 관계 표현을 친밀화할지 여부
  chosen_reading: 직역적으로 ‘아버지 밖에’로 두어, 단순한 농경 비유가 아니라 아버지와의 경계 밖에 놓인 존재의 상태를 드러냈습니다.
  alternative_readings:
  - ‘하나님 아버지 밖에’
  - ‘아버지에게서 떨어져’
  rationale: 원문에는 단지 정관사 있는 ‘아버지’가 있을 뿐이므로, ‘하나님’이나 ‘아버지에게서 떨어져’로 확장하지 않고 원문의 절제된 표현을 유지했습니다.
  doctrine_reference: source-level restraint; no harmonization to canonical parallels
