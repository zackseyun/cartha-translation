revisions:
- from: 예수께서 말씀하셨습니다[a]. "아버지 밖에 심겨진 포도나무는, 그것이 세워져 있지 않기 때문에 뿌리에서 뽑혀서 멸망할 것입니다."
  to: 예수께서 말씀하셨습니다. “아버지 밖에 심긴 포도나무는 굳게 서 있지 않으므로, 뿌리에서 뽑혀 멸망할 것입니다.”
  rationale: 문장의 자연스러움을 높이기 위해 ‘심겨진’을 ‘심긴’으로, 포도나무에 어색한 ‘세워져 있지 않기’를 원문의 의미 범위를 유지하는 ‘굳게 서 있지 않으므로’로 고쳤습니다. 미래의 비인칭 행위는 한국어의 자연스러운 수동 표현 ‘뽑혀’로 유지했습니다. 번역에 실질적으로 기여하지 않는 명칭 표기 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:12Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ⲥⲧⲁϫⲣⲟ의 상태 표현을 포도나무에 대해 ‘세워져 있다’로 옮기면 한국어에서 다소 부자연스럽고, 원문의 ‘견고히 자리 잡다/확고하다’라는 폭넓은 뜻도 충분히 드러나지 않습니다. 비인칭 3인칭 복수는 한국어 수동으로 자연스럽게 보존할 수 있습니다.
  naturalness: ‘심겨진’보다 ‘심긴’이 현대 표준어 문장에 더 자연스럽습니다. ‘굳게 서 있지 않으므로’는 포도나무 비유의 문맥에서 자연스러우면서도 ‘뿌리내리다’처럼 원문에 없는 이미지를 확정적으로 덧붙이지 않습니다.
  terminology: ‘포도나무’, ‘아버지’, ‘멸망하다’는 적절합니다. ‘아버지’를 ‘하나님 아버지’ 등으로 확대하지 않은 점도 원문에 충실합니다. 기존 각주 a는 예수라는 이름 자체의 콥트어 표기를 설명하지만, 번역 이해에 필요한 정보가 아니며 앵커가 ‘말씀하셨습니다’에 붙어 있어 제거하는 편이 낫습니다.
  issues:
  - severity: medium
    issue: ‘세워져 있지 않기’가 포도나무에 대해 부자연스럽고 ⲥⲧⲁϫⲣⲟ의 의미를 충분히 살리지 못합니다.
    rationale: 이 동사는 ‘견고하다, 확고히 서다, 굳게 자리 잡다’의 뜻 범위를 지닙니다. ‘굳게 서 있지 않다’는 한국어 문맥에서 더 자연스럽고, 특정한 ‘뿌리내리다’로 의미를 좁히지 않습니다.
  - severity: low
    issue: 각주 a는 불필요하며 앵커 위치와 주석 내용의 관련성이 약합니다.
    rationale: ‘예수’는 한국어 성서 번역에서 확립된 표기이며, 해당 음역 사실은 본 구절의 번역상 난점을 설명하지 않습니다.
  revised_text: 예수께서 말씀하셨습니다. “아버지 밖에 심긴 포도나무는 굳게 서 있지 않으므로, 뿌리에서 뽑혀 멸망할 것입니다.”
