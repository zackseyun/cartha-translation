translation:
  language: ko
  text: '예수께서 제자들에게 말씀하셨습니다. 「나를 누구에 견주어, 내가 누구와 같은지 말해 보십시오.」


    시몬 베드로가 그분께 말했습니다. 「당신은 의로운 천사와 같습니다.」


    마태가 그분께 말했습니다. 「당신은 한 사람, 곧 철학자이며 이해력이 있는 사람과 같습니다.」[a]


    도마가 그분께 말했습니다. 「스승님, 제 입으로는 당신이 누구와 같은지 도무지 말할 수 없겠습니다.」


    예수께서 말씀하셨습니다. 「나는 네 스승이 아닙니다. 네가 내가 직접 길어 낸, 거품 이는 샘에서 마시고 취하게 되었기 때문이다.」[b][c]


    그리고 그분은 도마를 데리고 물러나, 그에게 세 마디 말씀하셨습니다.


    도마가 자기 동료들에게 왔을 때, 그들이 그에게 물었습니다. 「예수께서 너에게 무엇을 말씀하셨느냐?」


    도마가 그들에게 말했습니다. 「내가 그분이 내게 하신 말씀 가운데 하나라도 너희에게 말한다면, 너희는 돌을 집어 나를 향해 던질 것이고, 돌들에서 불이 나와 너희를 삼킬 것입니다.」[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ는 문자적으로 ‘사람, 철학자, 마음/이해의 사람’에 가깝습니다. 따라서 ‘지혜로운 철학자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲃⲣⲃⲣ는 소리와 움직임을 함께 떠올리게 하는 말입니다. ‘부글부글 끓는’이나 ‘콸콸 솟는’ 같은 번역도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: ϣⲓⲛⲧⲟⲥ는 ‘재다’ 외에 ‘배분하다’ 또는 ‘길어 내다’로 이해할 수 있습니다. 여기서는 샘물 은유를 살려 번역했습니다.
    reason: lexical_alternative
  - marker: d
    text: 본문의 돌과 불의 이미지는 돌팔매 장면을 떠올리게 하지만, 돌들에서 불이 나오는 반전으로 그 이미지를 뒤집습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲉⲧⲟⲛⲧⲛⲁⲛⲟⲕ
  english_pob_choice: compare me
  chosen_korean: 나를 비교하여
  alternatives_korean:
  - 나를 견주어
  - 나를 비유하여
  lexicon: Crum; Layton
  rationale: 직설적 비교 요청을 살리기 위해 ‘비교하다’를 택했고, 뒤의 ‘내가 누구와 같은지’와 자연스럽게 이어지도록 목적어+부사절 형태로 옮겼습니다.
- source_word: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ
  english_pob_choice: a human being—a philosopher, a man of understanding
  chosen_korean: 사람과 같습니다. 철학자이며, 이해력이 있는 사람입니다
  alternatives_korean:
  - 지혜로운 철학자이며, 마음이 깊은 사람입니다
  - 철학자이자 통찰력 있는 사람입니다
  lexicon: Crum; Layton
  rationale: ⲣⲱⲙⲉ의 ‘사람’과 ⲛⲣⲙⲛϩⲏⲧ의 ‘이해/마음’을 함께 드러내기 위해 apposition 구조를 유지했습니다.
- source_word: ⲡⲥⲁϩ
  english_pob_choice: teacher
  chosen_korean: 스승님
  alternatives_korean:
  - 선생님
  - 선생
  lexicon: Crum
  rationale: 호칭으로서의 친근함과 권위를 함께 살리되, 종교적 관용구에 지나치게 기울지 않도록 ‘스승님’을 사용했습니다.
- source_word: ⲃⲣⲃⲣ
  english_pob_choice: bubbling
  chosen_korean: 거품 이는
  alternatives_korean:
  - 부글부글 끓는
  - 콸콸 솟는
  lexicon: Crum
  rationale: 의성·의태적 뉘앙스를 살려 샘의 움직임을 감각적으로 표현했습니다.
- source_word: ϣⲓⲛⲧⲟⲥ
  english_pob_choice: measured out
  chosen_korean: 내가 직접 길어 낸
  alternatives_korean:
  - 내가 재어 둔
  - 내가 측량해 둔
  lexicon: Crum; Layton
  rationale: 샘물 은유에 맞게 ‘재다’보다 ‘길어 내다’를 택하되, ⲁⲛⲟⲕ의 강조를 살리기 위해 ‘내가 직접’으로 옮겼습니다.
- source_word: ⲁⲛⲟⲕ
  english_pob_choice: I myself
  chosen_korean: 내가 직접
  alternatives_korean:
  - 내가 바로
  - 나 자신이
  lexicon: Crum
  rationale: 자기 강조를 분명히 하기 위해 독립대명사의 강조 기능을 한국어 부사 ‘직접’으로 반영했습니다.
- source_word: ϥⲓⲱⲛⲉ / ⲛⲟⲩϫⲉ
  english_pob_choice: pick up stones and throw them at me
  chosen_korean: 돌을 집어 나에게 던질 것이고
  alternatives_korean:
  - 돌을 들어 나를 칠 것이고
  - 돌을 집어 나를 향해 던질 것이고
  lexicon: Crum
  rationale: 두 동작(집다/던지다)을 분리해 번역하고, ⲉⲣⲟⲉⲓ의 방향성을 ‘나에게’로 자연스럽게 살렸습니다.
- source_word: ⲣⲱⲕϩ
  english_pob_choice: consume
  chosen_korean: 삼킬 것입니다
  alternatives_korean:
  - 태울 것입니다
  - 소멸시킬 것입니다
  lexicon: Crum
  rationale: 불이 돌에서 나와 사람들을 해치는 종결 이미지를 한국어에서 가장 직접적으로 전달하는 동사를 선택했습니다.
theological_decisions:
- issue: 예수의 자기부정 문구의 역설
  chosen_reading: 예수께서 “나는 네 스승이 아닙니다”라고 말하는 역설적 표현을 그대로 유지했습니다.
  alternative_readings:
  - 나는 네 선생이 아니다로 완화
  - 나는 네 교사가 아니다로 일반화
  rationale: 본문은 제자-스승 관계를 뒤집으며, 도마가 이미 ‘마셨다’는 진술과 함께 긴장을 형성합니다. 이를 약화시키지 않기 위해 직접적으로 옮겼습니다.
  doctrine_reference: Thomasine paradox / source-level rhetorical tension
