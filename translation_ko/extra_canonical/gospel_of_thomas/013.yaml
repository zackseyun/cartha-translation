translation:
  language: ko
  text: '예수께서 제자들에게 말씀하셨습니다. 「나를 비교하여, 내가 누구와 같은지 말해 보십시오.」


    시몬 베드로가 그분께 말했습니다. 「당신은 의로운 천사와 같습니다.」


    마태가 그분께 말했습니다. 「당신은 사람과 같습니다. 철학자이며, 이해력이 있는 사람입니다.」


    도마가 그분께 말했습니다. 「스승님, 제 입으로는 당신이 누구와 같은지 도무지 말할 수 없습니다.」


    예수께서 말씀하셨습니다. 「나는 네 스승이 아닙니다. 왜냐하면 너희가 내가 직접 길어 낸, 거품 이는 샘에서 마시고 취하였기 때문입니다.」


    그리고 그분은 도마를 데리고 물러가 그에게 세 마디 말씀하셨습니다.


    도마가 자기 동료들에게 왔을 때, 그들이 그에게 물었습니다. 「예수께서 너에게 무엇을 말씀하셨느냐?」


    도마가 그들에게 말했습니다. 「내가 그분이 내게 하신 말씀 가운데 하나라도 너희에게 말한다면, 너희는 돌을 집어 나에게 던질 것이고, 돌들 가운데서 불이 나와 너희를 삼킬 것입니다.」[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ는 문자적으로 ‘사람, 철학자, 마음/이해의 사람’에 가깝기 때문에, ‘지혜로운 철학자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲃⲣⲃⲣ는 소리와 움직임을 함께 떠올리게 하는 말이어서, ‘부글부글 끓는’이나 ‘콸콸 솟는’도 가능합니다.
    reason: lexical_alternative
  - marker: c
    text: ϣⲓⲛⲧⲟⲥ는 ‘재다’ 외에 ‘배분하다’, ‘길어 내다’의 뜻으로도 이해할 수 있습니다. 여기서는 샘물 은유를 살려 번역했습니다.
    reason: lexical_alternative
  - marker: d
    text: 본문의 불과 돌 이미지는 돌팔매 장면을 떠올리게 하지만, 그 반전을 통해 심판적 역설을 강화합니다.
    reason: cross_reference
