base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/108.yaml
  text: Jesus said[a], “Whoever drinks from my mouth will become like me. I myself shall become he[e][d][c][b], and the hidden things will be revealed to him.”
  footnotes:
  - marker: a
    text: ‘Drink from my mouth’ preserves the Coptic idiom; mouth often metonymically signifies teaching/utterance. The translation does not paraphrase this as ‘drink my words.’
    reason: cultural_note
  - marker: b
    text: ‘My equal’ renders ⲛ ⲡⲁϩⲉ; many English versions soften to ‘like me.’ Both are possible; ‘equal’ follows the stronger equative force of ⲡⲁϩⲉ (Crum).
    reason: lexical_alternative
  - marker: c
    text: '‘I myself shall become he’: the Coptic uses an emphatic pronoun (ϩⲱⲱ) and a compact copular construction (ⲉⲣⲉ … ⲡⲉ). Alternative, slightly smoother English is ‘I shall be he.’'
    reason: lexical_alternative
  - marker: d
    text: The phrase-joined layer shows ⲛⲉⲑⲏⲡ, normalized as the relative ⲡⲉⲧⲉⲣⲉϩⲱⲡ ‘what is hidden’; the sense is the same.
    reason: textual_variant
  - marker: e
    text: Or 'my equal'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다[a]. 「내 입에서 마시는 사람은 나와 같이 될 것이며, 나 자신도 그와 같이 될 것입니다[b][c]. 그리고 숨겨진 것들이 그에게 드러날 것입니다[d].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예수께서 말씀하셨습니다’는 콥트어 서두의 서술 공식을 자연스럽게 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 콥트어 관용구 ⲛ̄ⲧⲁϩⲉ는 ‘~와 같이, ~처럼’의 뜻으로 읽을 수 있으므로, ‘나와 같이’가 원문의 의미를 충실히 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 원문의 강조 표현 ϩⲱⲱ는 ‘나 자신도’로 옮겼습니다.
    reason: lexical_alternative
  - marker: d
    text: 콥트어 ⲟⲩⲱⲛϩ는 ‘드러나다, 나타나다, 분명해지다’의 뜻을 지니며, 여기서는 수동적으로 ‘드러날 것입니다’가 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲱ ⲉⲃⲟⲗ ϩⲛⲡⲁⲧⲁⲡⲣⲟ
  english_pob_choice: Whoever drinks from my mouth
  chosen_korean: 내 입에서 마시는 사람
  alternatives_korean:
  - 내 입에서 마시는 자
  - 내 입에서 마시는 이
  lexicon: Crum; Layton
  rationale: ⲥⲱ는 기본적으로 ‘마시다’이며, ⲉⲃⲟⲗ ϩⲛ은 출처를 나타내므로 ‘내 입에서’가 자연스럽고 원문 구조를 보존합니다.
- source_word: ⲛⲧⲟϥⲛⲁϣⲱⲡⲉ ⲛⲡⲁϩⲉ
  english_pob_choice: will become like me
  chosen_korean: 나와 같이 될 것이며
  alternatives_korean:
  - 내게서 나와 같은 자가 될 것이며
  - 나의 동등한 존재가 될 것이며
  lexicon: Crum; Layton
  rationale: 최근 검토본의 Coptic 관용구 ⲛ̄ⲧⲁϩⲉ는 ‘~처럼, ~와 같이’의 뜻이므로, ‘나와 같이’가 원문의 관용적 의미를 가장 정확하게 담습니다.
- source_word: ⲁⲛⲟⲕ ϩⲱⲱ ⲁⲛⲟⲕⲛⲁϣⲱⲡⲉ ⲉⲣⲉⲛⲧⲟϥ ⲡⲉ
  english_pob_choice: I myself shall become he / I shall be he
  chosen_korean: 나 자신도 그와 같이 될 것입니다
  alternatives_korean:
  - 나 자신도 그가 될 것입니다
  - 나 자신도 그와 같은 존재가 될 것입니다
  lexicon: Layton; Crum
  rationale: ϩⲱⲱ는 강조를 더하는 표현이므로 ‘나 자신도’로 살렸고, 종속절의 강한 동일시를 한국어에서는 자연스럽게 ‘그와 같이 될 것입니다’로 옮겼습니다.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ / ⲛⲉⲑⲏⲡ
  english_pob_choice: the hidden things
  chosen_korean: 숨겨진 것들
  alternatives_korean:
  - 감추인 것들
  - 숨은 것들
  lexicon: Crum; Layton
  rationale: ⲟⲩⲱⲛϩ는 ‘드러나다, 나타나다’의 의미이므로, ⲡⲉⲧⲉⲣⲉϩⲱⲡ 계열을 한국어의 자연스러운 집합적 표현인 ‘숨겨진 것들’로 옮겼습니다.
theological_decisions:
- issue: 발화체의 충격적 동일시 표현
  chosen_reading: ‘나 자신도 그와 같이 될 것입니다’로, 원문의 자기-동일시 강도를 유지하되 한국어가 허용하는 범위에서 과도한 문법적 어색함은 완화했습니다.
  alternative_readings:
  - 나 자신도 그가 될 것입니다
  - 나 자신도 그와 같은 자가 될 것입니다
  rationale: 콥트어는 단순 비교를 넘어 상호 동일시를 강하게 암시하므로, 이를 약화하지 않되 수용 가능한 현대 한국어로 전달했습니다.
  doctrine_reference: Gospel of Thomas saying-level christological language; source-text sensitivity
