base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “가시는 데서 포도를 따지 못하고, 엉겅퀴에서 무화과를 거두지 못합니다. 그들은 열매를 맺지 않기 때문입니다. 선한 사람은 자기 창고에서 선한 것을 꺼내고, 악한 사람은 자기 마음에 있는 악한 것[c]을 자기 창고에서 꺼내며, 악한 말을 합니다[d]. 마음의 넘침에서 악한 것을 꺼내기 때문입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 무화과는 콥트어 본문에서 ‘거두다/모으다’의 대상로 제시된 열매를 반영한 것입니다.
    reason: source_note
  - marker: c
    text: 본문은 ‘그의 마음에 있는 악한 것’이라는 관계를 분명히 하며, 이를 축약하지 않고 유지했습니다.
    reason: source_note
  - marker: d
    text: ‘악한 말’은 이어지는 ‘마음의 넘침’과 맞물리는 결과 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: “They do not pick grapes from thorns”
  english_pob_choice: They do not pick grapes from thorns
  chosen_korean: 가시는 데서 포도를 따지 못하고
  alternatives_korean:
  - 가시나무에서 포도를 따지 못하고
  - 가시에서 포도를 따지 못하고
  lexicon: 포도 / 가시
  rationale: 콥트어 ⲛϣⲟⲛⲧⲉ는 가시·가시덤불 계열로 이해되므로, 자연스러운 한국어로 ‘가시는 데서’라고 옮겨 이미지와 불가능성을 살렸습니다.
- source_word: “nor do they gather figs from thistles”
  english_pob_choice: nor do they gather figs from thistles
  chosen_korean: 엉겅퀴에서 무화과를 거두지 못합니다
  alternatives_korean:
  - 엉겅퀴에서 무화과를 모으지 못합니다
  - 엉겅퀴에서 무화과를 따지 못합니다
  lexicon: 무화과 / 엉겅퀴
  rationale: ⲥⲣ̄ϭⲁⲙⲟⲩⲗ은 엉겅퀴류로 보이며, ἀπὸ ἀκάνθων/τριβόλων류의 관용적 이미지에 맞춰 ‘거두지 못합니다’로 수확의 뉘앙스를 살렸습니다.
- source_word: “A good person brings out a good thing from his storehouse… an evil person brings out an evil thing from his storehouse that is in his heart”
  english_pob_choice: A good person brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart
  chosen_korean: 선한 사람은 자기 창고에서 선한 것을 꺼내고, 악한 사람은 자기 마음에 있는 악한 것[c]을 자기 창고에서 꺼내며
  alternatives_korean:
  - 선한 사람은 자기 곳간에서 선한 것을 꺼내고, 악한 사람은 자기 마음에 있는 악한 것[c]을 자기 곳간에서 꺼내며
  - 좋은 사람은 자기 저장고에서 좋은 것을 꺼내고, 나쁜 사람은 자기 마음에 있는 나쁜 것[c]을 자기 창고에서 꺼내며
  lexicon: 창고 / 마음
  rationale: 콥트어 ⲫϩⲟⲩⲟ는 ‘넘침’보다도 저장된 것, 축적된 내용의 이미지를 주므로 ‘창고’로 옮겼고, POB의 ‘that is in his heart’에 따라 ‘마음에 있는’ 구조를 유지했습니다.
- source_word: “for from the overflow of the heart he brings out evil”
  english_pob_choice: for from the overflow of the heart he brings out evil
  chosen_korean: 마음의 넘침에서 악한 것을 꺼내기 때문입니다
  alternatives_korean:
  - 마음의 넘침에서 악을 꺼내기 때문입니다
  - 마음이 넘쳐 나오는 대로 악한 것을 꺼내기 때문입니다
  lexicon: 넘침 / 악한 것
  rationale: ⲫϩⲟⲩⲟ ⲙⲫⲏⲧ는 ‘마음의 넘침/과잉’이라는 비유를 살려 직역에 가깝게 옮기되, 한국어 문장으로는 자연스럽게 ‘~기 때문입니다’로 연결했습니다.
theological_decisions:
- issue: 악한 말과 마음의 관계
  chosen_reading: 겉으로 나오는 말은 마음의 내용과 넘침에서 나온다는 구조를 그대로 유지했습니다.
  alternative_readings:
  - 악한 말은 단지 외부 행위의 결과로 완화해서 표현
  - ‘마음에서’만 옮기고 ‘넘침’ 이미지는 생략
  rationale: 이 말씀의 핵심 대비는 선/악의 내적 저장과 외적 발화의 연결이므로, 도덕적 교훈으로만 순화하지 않고 내면-발화 연계를 보존했습니다.
  doctrine_reference: 인간의 내면성과 말의 도덕적 책임
