revisions:
- from: 예수께서 말씀하셨습니다. “가시는 데서 포도를 따지 못하고, 엉겅퀴에서 무화과를 거두지 못합니다. 그들은 열매를 맺지 않기 때문입니다. 선한 사람은 자기 창고에서 선한 것을 꺼내고, 악한 사람은 자기 마음에 있는 악한 것[c]을 자기 창고에서 꺼내며, 악한 말을 합니다[d]. 마음의 넘침에서 악한 것을 꺼내기 때문입니다.”[b]
  to: 예수께서 말씀하셨습니다. “가시나무에서 포도를 따지 못하고, 엉겅퀴에서 무화과를 거두지 못합니다. 그것들은 열매를 맺지 않기 때문입니다. 선한 사람은 자기 창고에서 선한 것을 꺼내고, 악한 사람은 자기 마음에 있는 악한 것을 자기 창고에서 꺼내며, 악한 말을 합니다. 마음에 가득한 것에서 악한 것을 꺼내기 때문입니다.”
  rationale: 원문의 비유적 식물 명칭과 마음의 ‘풍성함/넘침’ 이미지를 현대 한국어에서 자연스럽고 명료하게 옮겼습니다. ‘마음에 있는 악한 것’은 콥트어의 관계절이 ‘악한 것’을 수식하는 구문을 보존합니다. 내용 반복 또는 표지 위치가 부정확한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:17Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 가시·엉겅퀴, 선한/악한 사람, 마음과 발화의 연계를 대체로 충실히 보존합니다. 다만 첫 이미지의 ‘가시는 데서’는 원문의 가시덤불/가시나무를 자연스럽게 지시하지 못하며, 마지막 구절의 ‘마음의 넘침에서’는 한국어 결합이 부자연스럽습니다. 악한 사람이 ‘자기 마음에 있는 악한 것’을 자기 창고에서 꺼낸다는 배열은 콥트어의 ‘그의 창고에서, 그의 마음 안에 있는 악한 것을’에 부합하므로 유지합니다.
  naturalness: ‘가시나무에서’, ‘그것들은 열매를 맺지 않기 때문입니다’, ‘마음에 가득한 것에서’로 고치면 현대 표준 한국어의 문장 연결과 지시 관계가 명료해집니다. 합쇼체도 일관되게 유지됩니다.
  terminology: ‘예수’, ‘선한 사람/악한 사람’, ‘마음’, ‘창고’, ‘악한 것’은 무난합니다. ⲁϩⲟ의 저장/축적 비유에는 ‘창고’가 가능하나, 불필요한 해설 각주는 본문 이해에 기여하지 않습니다. 영어 감사 기록의 각주 표지 체계와 달리 한국어 본문의 [b]가 문장 끝에 놓여 있어 해당 내용과의 연결도 부정확합니다.
  issues:
  - severity: medium
    issue: ‘가시는 데서’라는 표현
    rationale: 원문의 ⲥⲟⲛⲧⲉ는 가시 또는 가시덤불을 가리키며, ‘가시는 데’는 현대 한국어에서 부자연스럽고 장소·식물 이미지가 흐려집니다. ‘가시나무에서’가 자연스럽습니다.
  - severity: low
    issue: ‘그들은 열매를 맺지’의 지시 대상
    rationale: 직전의 가시나무와 엉겅퀴를 가리키므로 ‘그것들은’으로 하면 사람으로 오해될 가능성을 없앱니다.
  - severity: medium
    issue: ‘마음의 넘침에서’의 한국어 결합
    rationale: 원문의 ‘마음의 풍성함/넘침에서’ 비유는 보존해야 하지만, 한국어로는 ‘마음에 가득한 것에서’가 더 자연스럽고 원문의 축적·넘침 의미를 유지합니다.
  - severity: low
