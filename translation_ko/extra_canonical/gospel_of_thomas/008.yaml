base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
  footnotes:
  - marker: The human
    text: Coptic ⲡⲣⲱⲙⲉ (p-rōme). Often translated 'the man', but used here in a generic sense for humanity or the seeker.
    reason: lexical_alternative
  - marker: cast
    text: The manuscript reads ⲛⲧⲁϩⲛⲟⲩϫⲉ, using ϩ for the 3rd person masculine singular suffix pronoun ϥ, a regional (often Lycopolitan) dialect feature common in this text.
    reason: dialect_note
  - marker: found
    text: Literally 'fell upon' (ⲁϥϩⲉ ⲉ-).
    reason: lexical_alternative
  - marker: down
    text: The manuscript has a small lacuna here (ⲉ[ⲡⲉ]ⲥⲏⲧ), but the restoration is standard and certain.
    reason: textual_variant
  - marker: without difficulty
    text: This parable parallels Matthew 13:47-48, but diverges significantly. Matthew describes a dragnet gathering all kinds of fish to be sorted into good and bad at the end of the age. Thomas focuses on a single wise fisherman who discards the many small fish to keep the one large, valuable fish, reflecting Thomas's emphasis on finding the 'single one' (monachos) rather than an apocalyptic sorting.
    reason: cross_reference
translation:
  language: ko
  text: 그리고 그가 말했습니다. “사람은 지혜로운 어부와 같습니다. 그가 그물을 바다에 던졌습니다. 그는 그것을 바다에서 끌어올렸는데, 그 안에는 작은 물고기들이 가득했습니다. 그들 가운데서 지혜로운 어부는 크고 좋은 물고기 하나를 발견했습니다. 그는 작은 물고기들을 모두 다시 바다 밑으로 던져 버리고, 큰 물고기를 어려움 없이 선택했습니다. 들을 귀가 있는 사람은 들으십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲡⲣⲱⲙⲉ는 여기서 특정 남성이 아니라 인간 일반/탐구하는 사람을 가리키는 일반 용법입니다.
    reason: lexical_alternative
  - marker: b
    text: ⲭⲱⲣⲓⲥϩⲓⲥⲉ는 문자적으로 ‘수고/노고 없이’라는 뜻으로, 결과적으로는 ‘어려움 없이’의 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: c
    text: Coptic ⲁϥϩⲉ ⲉ-는 문자적으로는 ‘~에 떨어지다/마주치다’이지만, 문맥상 ‘발견하다’로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ
  english_pob_choice: The human
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 한 사람
  lexicon: Crum 294a
  rationale: Thomas의 ⲡⲣⲱⲙⲉ는 특정 남성보다 인간 일반이나 탐구하는 사람을 가리키는 일반 용법이어서, 성별을 고정하지 않는 ‘사람’이 가장 자연스럽고 원문 의도를 잘 살립니다.
- source_word: ⲟⲩⲱϩⲉ
  english_pob_choice: fisherman
  chosen_korean: 어부
  alternatives_korean:
  - 낚시꾼
  - 물고기를 잡는 사람
  lexicon: Crum 508a
  rationale: 표준적인 어부 의미이므로 직역보다도 현대 한국어에서 가장 안정적인 ‘어부’를 택했습니다.
- source_word: ⲣⲙⲛϩⲏⲧ
  english_pob_choice: wise
  chosen_korean: 지혜로운
  alternatives_korean:
  - 슬기로운
  - 현명한
  lexicon: Crum 714b
  rationale: 직역의 ‘마음의 사람’보다 의미역인 ‘지혜로운’이 문맥상 더 자연스럽고, 단순한 지식보다 분별력을 강조하는 뉘앙스를 살립니다.
- source_word: ⲭⲱⲣⲓⲥϩⲓⲥⲉ
  english_pob_choice: without difficulty
  chosen_korean: 어려움 없이
  alternatives_korean:
  - 수고 없이
  - 애쓰지 않고
  lexicon: Crum 718b
  rationale: χωρὶς + ϩⲓⲥⲉ(노동, 수고, 어려움) 결합을 반영하여, ‘무난히’보다 원문의 부정적 부사 의미가 분명한 ‘어려움 없이’를 선택했습니다.
- source_word: ϩⲉ ⲉ-
  english_pob_choice: found
  chosen_korean: 발견했습니다
  alternatives_korean:
  - 찾아냈습니다
  - 우연히 만났습니다
  lexicon: Crum 657a
  rationale: 직역상 ‘우연히 부딪치다/마주치다’의 관용이지만, 한국어에서는 서사의 흐름을 해치지 않는 ‘발견했습니다’가 가장 정확하고 매끄럽습니다.
theological_decisions:
- issue: Matthew 13:47-48와의 관계에서 비유의 초점 처리
  chosen_reading: 그물에 여러 종류의 물고기가 모인 뒤 선한 것과 악한 것을 가르는 식으로 조화시키지 않고, 하나의 큰 물고기를 알아보고 선택하는 토마스의 독특한 구성을 그대로 살렸습니다.
  alternative_readings:
  - 마태복음처럼 종말론적 분별 비유로 완화하는 해석
  - 작은 물고기와 큰 물고기를 도덕적 선악 대조로 바꾸는 해석
  rationale: 원문은 종말 심판보다 ‘큰 하나’를 알아보는 지혜와 선택에 초점을 두므로, 본문 고유의 신학적 방향을 흐리지 않도록 그대로 반영했습니다.
  doctrine_reference: 토마스 복음서 8절의 단일성/발견 모티프
- issue: ‘들은 귀’ 명령형의 한국어 등록
  chosen_reading: “들을 귀가 있는 사람은 들으십시오”로 공적인 권면체를 유지했습니다.
  alternative_readings:
  - ‘들을 귀가 있으면 들으시오’
  - ‘들어라’
  rationale: 직접 인용 속 일반 청중에게 주는 결말 공식을 현대 표준어 합쇼체로 옮기되, 명령의 힘은 약화하지 않았습니다.
  doctrine_reference: 예수의 격언적 결말 공식
