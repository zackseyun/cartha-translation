base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/100.yaml
  text: They showed Jesus a gold coin,[1] and they said to him[1], "Those who belong to Caesar demand the tax from us."[2] He said to them, "Give the things of Caesar to Caesar; give the things of God to God[a][3][2]; and what is mine—give it to me."[3]
  footnotes:
  - marker: '1'
    text: ⲉⲟⲩⲛⲟⲩⲃ literally ‘a gold’; in context this denotes a coin of gold, not merely raw metal.
    reason: lexical_alternative
  - marker: '2'
    text: The phrase can also be read more literally as ‘those who [work for/serve] Caesar seek from us the tax.’ The verb ⲥϣⲓⲧⲉ is ‘seek/ask for’; in fiscal contexts ‘demand/exact’ is natural.
    reason: lexical_alternative
  - marker: '3'
    text: Thomas uniquely adds this third imperative (‘and what is mine, give it to me’) beyond the Synoptic versions.
    reason: cross_reference
  - marker: a
    text: Or "Give to Caesar what is Caesar's; give to God what is God's".
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 예수께 금화 한 닢을 보여 주고, 「가이사에게 속한 이들이 우리에게 세금을 요구합니다」라고 말했습니다. 예수께서 그들에게 말씀하셨습니다. 「가이사의 것들은 가이사에게 주고, 하나님의 것들은 하나님께 주십시오[a][b]. 그리고 내 것은 내게 주십시오[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “가이사의 것들은 가이사에게, 하나님의 것들은 하나님께 주십시오”.
    reason: previous_rendering
  - marker: b
    text: 콥트어의 소유 표현은 복수로, 문자적으로는 ‘가이사의 것들’, ‘하나님의 것들’에 가깝습니다.
    reason: grammar_note
  - marker: c
    text: 토마스복음은 여기서 정경 병행구에 없는 세 번째 명령, “그리고 내 것은 내게 주십시오”를 덧붙입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲟⲩⲛⲟⲩⲃ
  english_pob_choice: a gold coin
  chosen_korean: 금화 한 닢
  alternatives_korean:
  - 금 한 덩이
  - 금화
  lexicon: Crum; Layton
  rationale: 문맥상 단순한 금속이 아니라 화폐 단위를 가리키므로, ‘금화 한 닢’으로 구체성을 살리되 과도한 액수 추정은 피했습니다.
- source_word: ⲥϣⲓⲧⲉ
  english_pob_choice: demand
  chosen_korean: 요구합니다
  alternatives_korean:
  - 찾습니다
  - 청합니다
  - 징수합니다
  lexicon: Crum; Layton
  rationale: 세금 문맥에서 단순한 ‘찾다’보다 강한 압박의 뉘앙스가 있어 ‘요구합니다’가 자연스럽고 원문에 가깝습니다.
- source_word: ⲛⲁⲕⲁⲓⲥⲁⲣ / ⲛⲁⲡⲛⲟⲩⲧⲉ
  english_pob_choice: the things of Caesar / the things of God
  chosen_korean: 가이사에게 속한 것 / 하나님께 속한 것
  alternatives_korean:
  - 가이사의 것 / 하나님의 것
  - 가이사에게 속한 것들 / 하나님께 속한 것들
  lexicon: Layton
  rationale: Coptic의 복수 소유 표현을 한국어에서는 어색하지 않게 ‘속한 것’으로 옮겨, 대상 범주를 보존하면서도 문장을 간결하게 했습니다.
- source_word: ⲡⲉⲧⲉⲡⲱⲉⲓ
  english_pob_choice: what is mine
  chosen_korean: 내 것
  alternatives_korean:
  - 내게 속한 것
  - 내 소유
  lexicon: Crum
  rationale: 마지막 절의 단수적 대비를 살려 ‘내 것’으로 옮겼습니다. 앞의 ‘가이사/하나님께 속한 것들’과 대비되는 소유 감각을 유지합니다.
theological_decisions:
- issue: 마지막 절의 독특한 추가 명령
  chosen_reading: ‘그리고 내 것은 내게 주십시오’라는 토마스복음의 추가 문장을 본문에 그대로 반영했습니다.
  alternative_readings:
  - 정경 병행구와 맞춰 마지막 절을 생략함
  - 의미만 요약해 ‘내 것은 내게 돌려주십시오’로 완화함
  rationale: 공통복음서와 달리 토마스는 세 번째 명령을 분명히 덧붙이므로, 본문 고유의 강조를 지우지 않고 유지했습니다.
  doctrine_reference: 본문비평/정경간 비교
- issue: ‘가이사에게 속한 것들’과 ‘내 것’의 수량 대비
  chosen_reading: 앞의 두 절은 범주적 복수성, 마지막 절은 단수적 소유로 살렸습니다.
  alternative_readings:
  - 세 절 모두 동일한 소유 표현으로 평준화함
  - ‘가이사의 것 / 하나님의 것 / 내 것’으로 단순화함
  rationale: Coptic의 형태 차이가 의미상 대비를 이루므로, 번역에서도 그 구조적 긴장을 유지하는 것이 원문 충실도에 유익합니다.
  doctrine_reference: 문법-의미 대응
