base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/027.yaml
  text: If you do not fast the world[a], you will not find the kingdom; and if you do not make the Sabbath a Sabbath[e][d][c][b], you will not see the Father.
  footnotes:
  - marker: a
    text: “Fast to the world” renders Coptic ⲉ with its directional sense. Many translators smooth this to “fast from the world,” but both Coptic and the Greek witness preserve the odd prepositional choice; the strangeness is likely deliberate.
    reason: lexical_alternative
  - marker: b
    text: Greek POxy 1 reads “the kingdom of God,” whereas NH Coptic has simply “the kingdom.” This draft follows the Coptic base text.
    reason: textual_variant
  - marker: c
    text: “Make the Sabbath a Sabbath” is a literal predicate-accusative. It likely means to let the Sabbath truly be what it is (i.e., keep/observe it as such), but the rendering keeps Thomas’s compressed style.
    reason: cultural_note
  - marker: d
    text: One manuscript line shows the orthography ⲥⲁⲙⲃⲁⲧⲟⲛ (mb) before normalization to ⲥⲁⲃⲃⲁⲧⲟⲛ (bb), a common mb/bb alternation in Sahidic/Lycopolitan hands.
    reason: dialect_note
  - marker: e
    text: Or 'fast to the world'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분이 세상을 금식하지 않으면 나라를 찾지 못할 것이며, 안식일을 안식일답게 만들지 않으면 아버지를 보지 못할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘세상을 향해/세상에 금식하다’처럼 보이지만, 본문과 영어 POB는 이 낯선 결합을 의도적으로 보존합니다.
    reason: source_note
  - marker: b
    text: 콥트어 사본은 단순히 ‘나라’만 갖고 있으며, 그리스어 파피루스 전통에는 ‘하나님의 나라’가 전해집니다.
    reason: textual_variant
  - marker: c
    text: ‘안식일을 안식일로 만들다’는 문자적인 술어-목적어 구조를 그대로 살린 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ / ⲛⲧⲱⲧⲛ
  english_pob_choice: if you
  chosen_korean: 여러분이 … 않으면
  alternatives_korean:
  - 만일 여러분이 … 하지 않으면
  - 여러분이 … 하지 않으면
  lexicon: Layton, Coptic Grammar; Lambdin, Introduction to Sahidic Coptic
  rationale: 조건절의 일반적·미래적 성격을 한국어 ‘-지 않으면’으로 자연스럽게 살렸습니다.
- source_word: ⲧⲙⲣⲛⲏⲥⲧⲉⲩⲉ / ⲉⲡⲕⲟⲥⲙⲟⲥ
  english_pob_choice: fast the world
  chosen_korean: 세상을 금식하지
  alternatives_korean:
  - 세상에 금식하지
  - 세상에서 금식하지
  lexicon: Crum, Coptic Dictionary (s.v. νηστεύειν); Layton, Coptic Grammar
  rationale: 본문의 이질적인 목적어 결합을 그대로 살려, POB의 ‘fast the world’를 한국어에서도 매끄럽게 정상화하지 않고 유지했습니다.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 하나님의 나라
  - 왕국
  lexicon: Crum, Coptic Dictionary (s.v. ⲙⲛⲧⲣⲱ)
  rationale: 콥트어 본문이 단순히 ‘the kingdom’이라고만 하므로, 추가 설명을 덧붙이지 않고 간결하게 ‘나라’로 옮겼습니다.
- source_word: ⲧⲙⲉⲓⲣⲉ ⲛⲡⲥⲁⲃⲃⲁⲧⲟⲛ ⲛⲥⲁⲃⲃⲁⲧⲟⲛ
  english_pob_choice: make the Sabbath a Sabbath
  chosen_korean: 안식일을 안식일답게 만들지
  alternatives_korean:
  - 안식일을 안식일로 만들지
  - 안식일을 참된 안식일로 삼지
  lexicon: Crum, Coptic Dictionary (s.v. ⲙⲉⲓⲣⲉ; s.v. ⲥⲁⲃⲃⲁⲧⲟⲛ)
  rationale: 문자적으로는 ‘안식일을 안식일로 만들다’이지만, 한국어에서는 predicate-accusative의 압축성을 ‘안식일답게 만들다’로 옮겨 원문의 반복과 의미를 함께 살렸습니다.
- source_word: ⲡⲉⲓⲱⲧ
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 그 아버지
  - 아버지 되시는 분
  lexicon: Crum, Coptic Dictionary (s.v. ⲓⲱⲧ)
  rationale: 정관사로 표지된 호칭이므로 ‘아버지’로 옮기되, 한국어에서의 자연스러운 호칭성을 우선했습니다.
theological_decisions:
- issue: ‘fast the world’의 이질성 보존
  chosen_reading: 세상을 금식하다라는 낯선 목적어 결합을 그대로 유지했습니다.
  alternative_readings:
  - 세상에서 금식하다
  - 세상으로부터 금식하다
  rationale: 본문의 요지는 ‘금식’의 방향이 아니라 ‘세상’을 직접 목적어로 삼는 압축과 긴장에 있으므로, 이를 완화하지 않았습니다.
  doctrine_reference: Thomasine saying / source-literary integrity
- issue: ‘the kingdom’의 비한정성
  chosen_reading: ‘하나님의 나라’를 덧붙이지 않고 단순히 ‘나라’로 옮겼습니다.
  alternative_readings:
  - 하나님의 나라
  - 왕국
  rationale: 영어 POB 주석이 지적하듯 콥트어는 단순히 ‘the kingdom’이며, 사본 기반 본문을 우선해 추가 해석을 피했습니다.
  doctrine_reference: Textual criticism / Coptic base text
