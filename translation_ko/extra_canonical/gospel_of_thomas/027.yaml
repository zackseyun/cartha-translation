  english_pob_choice: make the Sabbath a Sabbath
  chosen_korean: 안식일을 안식일답게 만들지
  alternatives_korean:
  - 안식일을 안식일로 만들지
  - 안식일을 참된 안식일로 삼지
  lexicon: Crum, Coptic Dictionary (s.v. ⲙⲉⲓⲣⲉ; s.v. ⲥⲁⲃⲃⲁⲧⲟⲛ)
  rationale: 문자적으로는 ‘안식일을 안식일로 만들다’이지만, 한국어에서는 predicate-accusative의 압축성을 ‘안식일답게 만들다’로 옮겨 원문의 반복과 의미를 함께 살렸습니다.
- source_word: ⲡⲉⲓⲱⲧ
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 그 아버지
  - 아버지 되시는 분
  lexicon: Crum, Coptic Dictionary (s.v. ⲓⲱⲧ)
  rationale: 정관사로 표지된 호칭이므로 ‘아버지’로 옮기되, 한국어에서의 자연스러운 호칭성을 우선했습니다.
theological_decisions:
- issue: ‘fast the world’의 이질성 보존
  chosen_reading: 세상을 금식하다라는 낯선 목적어 결합을 그대로 유지했습니다.
  alternative_readings:
  - 세상에서 금식하다
  - 세상으로부터 금식하다
  rationale: 본문의 요지는 ‘금식’의 방향이 아니라 ‘세상’을 직접 목적어로 삼는 압축과 긴장에 있으므로, 이를 완화하지 않았습니다.
  doctrine_reference: Thomasine saying / source-literary integrity
- issue: ‘the kingdom’의 비한정성
  chosen_reading: ‘하나님의 나라’를 덧붙이지 않고 단순히 ‘나라’로 옮겼습니다.
  alternative_readings:
  - 하나님의 나라
  - 왕국
  rationale: 영어 POB 주석이 지적하듯 콥트어는 단순히 ‘the kingdom’이며, 사본 기반 본문을 우선해 추가 해석을 피했습니다.
  doctrine_reference: Textual criticism / Coptic base text
