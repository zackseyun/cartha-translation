base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
  footnotes:
  - marker: they hate you
    text: 'The Coptic uses the third-person plural for all the verbs in this sequence (hate, persecute, find, persecuted). Because this is the standard Coptic idiom for the passive voice, the saying is often translated: ''Blessed are you when you are hated and persecuted; and no place will be found in the place where you were persecuted.'' Translating it actively, however, preserves the sharp contrast between the persecutors'' actions and their failure to find a ''place''.'
    reason: textual_variant
  - marker: no place in the place
    text: 'The Coptic uses two different words for ''place'' here: the Greek loanword ⲧⲟⲡⲟⲥ (topos, often carrying theological weight in Thomas as a place of spiritual rest or standing) and the native Coptic word ⲙⲁ (ma, a physical location or spot). The persecutors will find no spiritual standing in the physical location of their persecution.'
    reason: lexical_alternative
  - marker: persecuted you
    text: Unlike the Synoptic parallels (Matthew 5:11, Luke 6:22), Thomas lacks a Christological motivation for the persecution (e.g., 'because of me' or 'on account of the Son of Man').
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “그들이 너희를 미워하고 박해할 때 너희는 복이 있습니다. 또 그들이 너희를 박해한 곳에서는, 그 장소 안에서 아무 곳도 찾지 못할 것입니다.”[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 콥트어의 두 다른 단어가 모두 ‘place’로 기능하지만, 원문은 같은 말을 반복하지 않고 ⲧⲟⲡⲟⲥ과 ⲙⲁ를 구별해 사용합니다. 그래서 한국어도 “장소”와 “곳”으로 어느 정도 차이를 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 문장은 복음서 평행본문들과 달리 박해의 이유를 ‘나 때문에’와 같이 명시하지 않습니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  english_pob_choice: blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복되다
  - 복이 있습니다
  lexicon: Coptic/SBLGNT usage of μακάριος
  rationale: 비교적 직역적이면서도 현대 한국어에서 축복 선언의 어감을 살릴 수 있어 “복이 있습니다”로 옮겼습니다.
- source_word: ⲙⲉⲥⲧⲉ-
  english_pob_choice: hate
  chosen_korean: 미워하고
  alternatives_korean:
  - 증오하고
  - 미워하고
  lexicon: Crum 186a
  rationale: 원문의 직접적 적대 감정을 표준어로 자연스럽게 드러내는 말로 “미워하다”가 적절합니다.
- source_word: ⲇⲓⲱⲕⲉ
  english_pob_choice: persecute
  chosen_korean: 박해할 때 / 박해한
  alternatives_korean:
  - 박해할 때
  - 핍박할 때
  - 박해한
  lexicon: BDAG
  rationale: 교회적 문맥에서 널리 통용되면서도 원문의 강한 추적·탄압 의미를 보존할 수 있어 “박해하다”를 택했습니다.
- source_word: ⲧⲟⲡⲟⲥ / ⲙⲁ
  english_pob_choice: place / place
  chosen_korean: 장소 / 곳
  alternatives_korean:
  - 곳 / 곳
  - 장소 / 장소
  - 자리 / 장소
  lexicon: BDAG; Crum 152a
  rationale: 영어 POB가 구분한 두 종류의 ‘place’를 한국어에서도 어느 정도 살리기 위해, 첫 번째는 상대적으로 추상적인 “장소”, 두 번째는 물리적 위치감이 강한 “곳”으로 다르게 옮겼습니다.
theological_decisions:
- issue: 능동형 유지 vs. 수동형 재구성
  chosen_reading: 원문의 세 번째 인칭 복수 흐름을 따라 “그들이 너희를 미워하고 박해할 때”로 능동형을 유지했습니다.
  alternative_readings:
  - 너희가 미움받고 박해받을 때
  - 너희가 미움받고 박해받을 때 그들은…
  rationale: 콥트어의 3인칭 복수는 통상 수동적 의미를 띨 수 있지만, 영어 POB의 판단처럼 이 본문은 박해자들의 행위를 전면에 드러내는 능동적 독법이 수사적으로 더 강하며, 뒤의 ‘찾지 못할 것입니다’와의 대비도 선명해집니다.
  doctrine_reference: 해석학/문장 구조
