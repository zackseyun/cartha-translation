    rationale: 결손 이전에 ‘그들이 그것을 하다’라는 동사구가 보존되어 있습니다. 초안의 ‘그들이 그것들을 … 할 것입니다’은 단수 대명사 ⲛⲧⲟϥ를 복수로 평준화하고, 보존된 ‘하다’를 결손부 안에 묻습니다.
  - severity: medium
    issue: 각주 b가 결손의 위치와 보존 범위를 부정확하게 설명함
    rationale: 원문은 단지 ‘뒤에 동사가 더 이어지는’ 것이 아니라, ‘그들이 그것을 하다’까지 보존하고 그 뒤에서 끊깁니다. 이 범위를 밝혀야 무근거한 복원을 피할 수 있습니다.
