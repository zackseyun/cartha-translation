  verdict: revise
  source_fidelity: 수정이 필요합니다. ⲕⲟⲡⲣⲓⲁ는 단순한 ‘무더기’가 아니라 배설물/거름 더미를 뜻하므로 그 구체적 의미를 밝혀야 합니다. 또한 둘째 경고절에는 결손 전에도 ⲉⲓⲣⲉ ⲛⲧⲟϥ(‘그들이 그것을 하다’)가 남아 있으므로, 이를 ‘그것들을 … 할 것입니다’으로 옮기면 남은 단수 대명사와 동사를 모두 흐립니다. 첫 절의 복수 목적어와 둘째 절의 단수 대명사라는 전승상의 불일치는 각각 보존했습니다.
  naturalness: ‘그렇지 않으면’보다 경고·목적의 접속을 나타내는 ‘그러지 않도록/…할까 하여’가 이 잠언적 금지문에 자연스럽습니다. ‘배설물 더미’는 현대 표준어의 공식적 문체에도 맞으며 원문의 거친 구체성을 완화하지 않습니다.
  terminology: ‘거룩한 것’, ‘개들’, ‘진주’, ‘돼지들’은 적절합니다. ‘무더기’는 ⲕⲟⲡⲣⲓⲁ의 의미를 누락하므로 ‘배설물 더미’로 고쳐야 합니다. 결손부에는 마태복음 7:6에 따른 ‘짓밟다’를 보충하지 않았습니다.
  issues:
  - severity: high
    issue: ⲕⲟⲡⲣⲓⲁ를 ‘무더기’로 번역함
    rationale: 그리스어 차용어 ⲕⲟⲡⲣⲓⲁ는 배설물 또는 거름 더미를 가리킵니다. 일반적인 ‘무더기’는 핵심 어휘 의미와 이미지의 강도를 삭제합니다.
