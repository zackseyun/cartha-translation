base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/093.yaml
  text: Do not give what is holy to the dogs[a], lest they throw them onto the dung-heap. Do not throw pearls to the pigs[f][e][d][c][b], lest they do it [...].
  footnotes:
  - marker: a
    text: ‘What is holy’ translates an adjectival noun (ⲡⲉⲧⲟⲩⲁⲁⲃ), literally ‘the holy [thing]’.
    reason: lexical_alternative
  - marker: b
    text: ‘Dung-heap’ renders Greek loan ⲕⲟⲡⲣⲓⲁ, the refuse/dung pile common in village life.
    reason: cultural_note
  - marker: c
    text: The Coptic continues only with ⲡⲗⲁ… before a break; many editors conjecture a verb like ‘trample,’ influenced by Matt 7:6, but the manuscript does not preserve it.
    reason: lacuna_or_restoration
  - marker: d
    text: Spelling ⲛ̄ⲛⲟⲩϩⲟⲟⲣ (ms) normalized to ⲛⲡⲟⲩϩⲟⲣ reflects dialectal/plural article variation.
    reason: dialect_note
  - marker: e
    text: Or 'lest they [...].'.
    reason: previous_rendering
  - marker: f
    text: Or 'lest they throw it'.
    reason: previous_rendering
translation:
  language: ko
  text: 거룩한 것을 개들에게 주지 마십시오. 그렇지 않으면 그들이 그것들을 무더기 위에 던질 것입니다. 진주를 돼지들에게 던지지 마십시오. 그렇지 않으면 그들이 그것들을 … 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 것’은 형용사적 명사 ⲡⲉⲧⲟⲩⲁⲁⲃ의 직역으로, 특정한 제의 용어로 좁히지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 뒤에 동사가 더 이어지지만 필사본이 끊겨 있으므로, 한국어도 생략부호로 결손을 드러냈습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲧⲟⲩⲁⲁⲃ
  english_pob_choice: what is holy
  chosen_korean: 거룩한 것
  alternatives_korean:
  - 성물
  - 성스러운 것
  lexicon: Crum s.v. ⲟⲩⲁⲁⲃ
  rationale: 형용사적 명사로서 특정 제의 대상을 가리키기보다 ‘거룩한 것’이라는 일반적 표현이 원문의 잠언적 성격을 잘 살립니다.
- source_word: ⲛⲡⲟⲩϩⲟⲣ / ⲛ̄ⲛⲟⲩϩⲟⲟⲣ
  english_pob_choice: to the dogs
  chosen_korean: 개들에게
  alternatives_korean:
  - 개들에게로
  - 개들한테
  lexicon: Crum s.v. ϩⲟⲟⲣ
  rationale: 일상적이고 직설적인 ‘개들’이 본문의 노골적인 대비를 가장 자연스럽게 전달합니다.
- source_word: ⲕⲟⲡⲣⲓⲁ
  english_pob_choice: dung-heap
  chosen_korean: 무더기
  alternatives_korean:
  - 똥무더기
  - 거름더미
  lexicon: Crum s.v. ⲕⲟⲡⲣⲓⲁ
  rationale: 문맥상 버려진 배설물 더미를 뜻하지만, 한국어에서 지나치게 노골적인 표현보다 ‘무더기’가 원문의 문화적 이미지를 무리 없이 옮깁니다.
- source_word: ⲛⲡⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  english_pob_choice: pearls
  chosen_korean: 진주
  alternatives_korean:
  - 보석
  - 진주들
  lexicon: Crum s.v. ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  rationale: 외래어로 자리 잡은 ‘진주’가 원문의 보석 이미지를 가장 정확하게 전달합니다.
- source_word: ⲛⲡⲉϣⲁⲩ
  english_pob_choice: to the pigs
  chosen_korean: 돼지들에게
  alternatives_korean:
  - 돼지들한테
  - 돼지에게
  lexicon: Crum s.v. ϣⲁⲩ
  rationale: ϣⲁⲩ는 돼지/멧돼지 계열을 가리키며, 현대어에서는 ‘돼지들’이 가장 즉각적이고 평이합니다.
- source_word: ⲛⲟⲩⲛⲟϫⲟⲩ / ⲛⲟⲩϫⲉ
  english_pob_choice: throw them
  chosen_korean: 그것들을
  alternatives_korean:
  - 그것을
  - 그들을
  lexicon: Crum s.v. ⲛⲟⲩϫⲉ
  rationale: 첫 절의 ⲛⲟⲩⲛⲟϫⲟⲩ는 3인칭 복수 목적어 표지를 가지므로 ‘그것들을’로 옮겨 원문의 수적 불일치를 보존합니다.
theological_decisions:
- issue: 문장 말미의 탈락/잔문 처리
  chosen_reading: ‘그들이 그것들을 … 할 것입니다’처럼 남은 동사와 공백을 모두 드러내어, 복원어를 과감히 채우지 않았습니다.
  alternative_readings:
  - ‘그들이 그것들을 짓밟을 것입니다’
  - ‘그들이 그것들을 버릴 것입니다’
  rationale: 필사본에는 다음 동사의 일부만 남아 있으므로, 마태복음 7:6의 익숙한 복원으로 본문을 평탄화하지 않고 결손을 표시하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 본문 보존 원칙; 결손 표기
