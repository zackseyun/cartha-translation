revisions:
- from: 거룩한 것을 개들에게 주지 마십시오. 그렇지 않으면 그들이 그것들을 무더기 위에 던질 것입니다. 진주를 돼지들에게 던지지 마십시오. 그렇지 않으면 그들이 그것들을 … 할 것입니다.[a][b]
  to: 거룩한 것을 개들에게 주지 마십시오. 그들이 그것들을 배설물 더미에 던지지 않도록 하십시오. 진주를 돼지들에게 던지지 마십시오. 그들이 그것을 … 할까 하여 그러지 마십시오.[a][b]
  rationale: 배설물 더미라는 ⲕⲟⲡⲣⲓⲁ의 어휘 의미를 복원하고, 첫 절의 복수 목적어와 둘째 절의 단수 대명사를 구별하여 전승된 문법적 불일치를 보존했습니다. 결손부는 보존된 ‘하다’만 번역하고, 추정되는 후속 동사는 생략부호로 남겼습니다. 문장 순서는 한국어 합쇼체에서 목적·경고 관계가 자연스럽게 드러나도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:16Z'
