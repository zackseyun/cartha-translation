base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “너희가 귀로 들은 것을—다른 귀에[a]는 지붕 위에서 선포하십시오. 누구도 등불을 켜서 그것을 되[양]동이[b] 아래에 두지 않으며, 숨겨진 곳에 두지도 않습니다. 오히려 등잔대 위에 둡니다. 그래야 들어가는 사람들과 나가는 사람들 모두 그 빛을 보게 됩니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “네 귀에”이지만, 문맥상 반복 대비를 살린 옮김입니다.
    reason: alternative_reading
  - marker: b
    text: 본문의 ‘측량 바구니’에 해당하는 말로, 영어 POB의 “measuring-basket”을 반영했습니다.
    reason: lexical_alternative
  - marker: c
    text: 그들이 보는 대상은 등불의 ‘빛’입니다.
    reason: source_note
lexical_decisions:
- source_word: ϩⲛⲡⲉⲕⲙⲁⲁϫⲉ / ϩⲛⲡⲕⲉⲙⲁⲁϫⲉ
  english_pob_choice: in your ear — in the other ear
  chosen_korean: 귀로 들은 것을—다른 귀에
  alternatives_korean:
  - 네 귀에 들은 것을—다른 귀에
  - 한 귀로 들은 것을—다른 귀에
  lexicon: ear
  rationale: ‘ear’의 반복을 살리되 한국어에서는 ‘귀로 들은 것’으로 자연스럽게 옮겨, 첫 번째와 두 번째 귀의 대비를 드러냈습니다.
- source_word: ϩⲓϫⲛ̄ⲛⲉⲧⲛϫⲉⲛⲉⲡⲱⲣ
  english_pob_choice: upon your rooftops
  chosen_korean: 지붕 위에서
  alternatives_korean:
  - 옥상에서
  - 지붕들 위에서
  lexicon: roof/top
  rationale: 복수성은 문맥상 일반화된 표현으로 보아 자연스러운 ‘지붕 위에서’로 처리했습니다.
- source_word: ⲅⲁⲣ ϫⲉⲣⲟϩⲏⲃⲥ
  english_pob_choice: for no one lights a lamp
  chosen_korean: 누구도 등불을 켜서
  alternatives_korean:
  - 아무도 등불을 켜고
  - 사람은 아무도 등불을 켜서
  lexicon: lamp/light
  rationale: 행위의 목적성을 살려 ‘켜서’로 이어, 뒤의 ‘두지 않으며’와 자연스럽게 연결했습니다.
- source_word: ⲧⲗⲩⲭⲛⲓⲁ
  english_pob_choice: lampstand
  chosen_korean: 등잔대
  alternatives_korean:
  - 촛대
  - 램프대
  lexicon: lampstand
  rationale: 성경 한국어에서 널리 쓰이는 ‘등잔대’를 사용하되, 전통적 교회어법을 기계적으로 따르지 않고 원의 의미를 보존했습니다.
theological_decisions:
- issue: 공개 선포의 명령형 강도
  chosen_reading: “지붕 위에서 선포하십시오”로 명령성을 분명히 유지했습니다.
  alternative_readings:
  - 지붕 위에 알리십시오
  - 지붕 위에서 말하십시오
  rationale: 본문은 단순 전달이 아니라 공개적 선포를 요구하므로, ‘선포하십시오’가 소스를 가장 직접적으로 반영합니다.
  doctrine_reference: 문맥상 제자도와 증언의 가시성
- issue: ‘숨겨진 곳’과 ‘등잔대’의 대비
  chosen_reading: 등불을 숨기지 말고 드러내는 대비를 그대로 유지했습니다.
  alternative_readings:
  - 감추어진 곳
  - 몰래 둔 곳
  rationale: 비유의 핵심은 은폐와 가시성의 대조이므로, 의미를 완화하지 않고 직설적으로 옮겼습니다.
  doctrine_reference: 비유적 대비 구조
