revisions:
- from: 그의 제자들이 말했습니다. 「우리에게 당신이 있는 곳을 보여 주십시오. 우리가 그것을 찾아야 하기 때문입니다.」 그가 그들에게 말했습니다. 「귀 있는 사람은 들으십시오. 한 사람 안에는 빛이 있습니다. 그는 온 세상을 비춥니다. 그러나 그가 비추지 않으면 어둠이 있습니다.」[a][b][c][d][e]
  to: 그의 제자들이 말했습니다. 「우리가 그것을 찾아야 하니, 당신이 계신 곳을 우리에게 보여 주십시오.」 그가 그들에게 말씀하셨습니다. 「귀가 있는 이는 들으십시오.[a] 빛의 사람 안에 빛이 있습니다.[b][e] 그는 온 세상을 비춥니다.[c] 그가 비추지 않으면 어둠입니다.[d]」
  rationale: 원문의 핵심 반복인 ‘빛—빛의 사람—비추다’를 보존하도록 고쳤습니다. 그리스어 단편과 다른 콥트어의 선언문·인칭 주어·종결 진술은 각주로 간결하게 밝혔으며, 각주 표지는 해당 구절에 직접 붙였습니다. ‘당신이 계신 곳’과 ‘말씀하셨습니다’는 존칭을 일관되게 적용한 합쇼체입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:16Z'
review_pass:
  verdict: revise
  source_fidelity: 본문이 ⲛⲟⲩⲣⲙⲟⲩⲟⲉⲓⲛ(‘빛의 사람’)을 단순히 ‘한 사람’으로 풀어, 빛의 사람 안에 빛이 있다는 독특한 속격 표현을 누락합니다. 또한 마지막 ⲟⲩⲕⲁⲕⲉ ⲡⲉ는 ‘어둠이 있습니다’보다 ‘어둠입니다’가 계사문 형식을 더 잘 반영합니다.
  naturalness: ‘빛의 사람’은 현대 한국어에서 다소 낯설지만, 이 격언의 의도적으로 두드러진 표현을 보존하는 데 필요한 낯섦입니다. 나머지는 합쇼체로 자연스럽게 다듬을 수 있습니다.
  terminology: ⲣⲙⲟⲩⲟⲉⲓⲛ은 ‘빛의 사람’으로 유지하고, ⲣⲟⲩⲟⲉⲓⲛ의 주어가 빛이 아니라 그 사람임을 ‘그는’으로 분명히 합니다. ‘온 세상’은 ⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ에 적절합니다.
  issues:
  - severity: high
    issue: ‘빛의 사람’ 표현의 누락
    rationale: ‘한 사람 안에는 빛이 있습니다’는 ⲛⲟⲩⲣⲙⲟⲩⲟⲉⲓⲛ의 ‘빛의 사람’을 번역에서 제거하여, 원문의 반복과 수식 관계를 보존하지 못합니다.
  - severity: medium
    issue: 마지막 계사문의 약화
    rationale: ⲟⲩⲕⲁⲕⲉ ⲡⲉ는 문자적으로 ‘그것은 어둠이다’에 가까우므로, ‘어둠입니다’가 ‘어둠이 있습니다’보다 원문의 진술 형식을 더 잘 살립니다.
  - severity: low
