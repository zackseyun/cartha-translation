base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/024.yaml
  text: His disciples said[1], "Show us the place where you are, for it is necessary for us to seek it." He said to them, "Whoever has ears, let him hear.[1] There is light within a man of light,[2] and he lights the whole world.[3] When he does not shine[a][e][4][3][2], there is darkness."[4]
  footnotes:
  - marker: '1'
    text: Lit. “whoever has ears with him.” The idiom ⲙⲙⲟϥ ‘with him’ is part of the standard hearing formula.
    reason: dialect_note
  - marker: '2'
    text: 'Coptic is declarative: “A light is within a man of light.” The Greek fragment reads conditionally, “If light is in a man of light….”'
    reason: textual_variant
  - marker: '3'
    text: 'Coptic makes the person the subject: “he lights (the whole world).” The Greek fragment has “it shines,” taking “light” as the subject.'
    reason: textual_variant
  - marker: '4'
    text: 'Coptic: “When he does not shine, it is/there is darkness.” The Greek reconstruction reads, “if it is not, (the world) is in darkness.”'
    reason: textual_variant
  - marker: e
    text: “Man of light” could be rendered “luminous person,” but the genitive construction is preserved to keep Thomas’s distinctive tone.
    reason: lexical_alternative
  - marker: a
    text: Or 'A light is within a man of light'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 제자들이 말했습니다. 「우리에게 당신이 있는 곳을 보여 주십시오. 우리가 그것을 찾아야 하기 때문입니다.」 그가 그들에게 말했습니다. 「귀 있는 사람은 들으십시오. 한 사람 안에는 빛이 있습니다. 그는 온 세상을 비춥니다. 그러나 그가 비추지 않으면 어둠이 있습니다.」[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀 있는 사람’은 콥트어의 관용적 청각 공식으로, 문자적으로는 ‘그와 함께 귀가 있는 사람’의 뜻입니다.
    reason: source_note
  - marker: b
    text: 콥트어는 “한 사람 안에 빛이 있습니다”라는 존재문으로 읽힙니다.
    reason: textual_variant
  - marker: c
    text: 여기서는 ‘그 사람’이 세상을 비추는 주어입니다.
    reason: textual_variant
  - marker: d
    text: 부정문은 “그가 비추지 않으면”으로 옮길 수 있습니다.
    reason: textual_variant
  - marker: e
    text: ‘빛의 사람’으로도 옮길 수 있지만, Thomas의 독특한 표현을 살리기 위해 본문에서는 풀어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϯⲧⲥⲉⲃⲟⲁⲛⲟⲛ / ⲧⲟⲡⲟⲥ
  english_pob_choice: Show us the place where you are
  chosen_korean: 우리에게 당신이 있는 곳을 보여 주십시오
  alternatives_korean:
  - 우리에게 당신이 있는 장소를 알려 주십시오
  - 우리에게 당신이 있는 곳을 가르쳐 주십시오
  lexicon: Crum s.v. ⲥⲃⲱ/ⲥⲃⲱⲛ; ⲧⲟⲡⲟⲥ
  rationale: 요청문의 자연스러운 한국어로 옮기되, ⲧⲟⲡⲟⲥ의 구체성을 살려 ‘곳’으로 유지했습니다.
- source_word: ⲉⲧⲉⲣⲉⲟⲩⲛ ⲙⲁⲁϫⲉ ⲙⲙⲟϥ / ⲙⲁⲣⲉϥ ⲥⲱⲧⲙ
  english_pob_choice: Whoever has ears, let him hear
  chosen_korean: 귀 있는 사람은 들으십시오
  alternatives_korean:
  - 귀가 있는 사람은 들으십시오
  - 들을 귀가 있는 사람은 들으십시오
  lexicon: Crum s.v. ⲙⲁⲁϫⲉ; ⲥⲱⲧⲙ
  rationale: 콥트어 관용구의 ‘귀 있는 사람’ 구조를 살리면서, 문맥상 명령형을 한국어 자연문으로 간결하게 옮겼습니다.
- source_word: ⲟⲩⲛⲟⲩⲟⲉⲓⲛ ϣⲱⲡⲉ / ⲛⲡϩⲟⲩⲛ ⲛⲟⲩⲣⲙⲟⲩⲟⲉⲓⲛ
  english_pob_choice: There is light within a man of light
  chosen_korean: 한 사람 안에는 빛이 있습니다
  alternatives_korean:
  - 빛이 한 사람 안에 있습니다
  - 빛이 있는 사람 안에 빛이 있습니다
  lexicon: Crum s.v. ⲟⲉⲓⲛ; ⲩⲣⲙ- + ⲟⲉⲓⲛ
  rationale: 콥트어의 존재문을 한국어 존재문으로 옮기고, ‘man of light’는 직역의 난삽함보다 뜻이 드러나도록 ‘한 사람’으로 처리했습니다.
- source_word: ⲛⲧⲟϥ ⲣⲟⲩⲟⲉⲓⲛ / ⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ
  english_pob_choice: he lights the whole world
  chosen_korean: 그는 온 세상을 비춥니다
  alternatives_korean:
  - 그는 세상 전체를 비춥니다
  - 그는 온 세상에 빛을 비춥니다
  lexicon: Crum s.v. ⲣⲟⲩⲟⲉⲓⲛ; ⲧⲏⲣ
  rationale: 콥트어에서 주어는 ‘빛’이 아니라 ‘그 사람’이므로, 능동 동사를 유지해 행위 주체를 분명히 했습니다.
- source_word: ⲉⲣⲉⲛⲧⲟϥ ⲧⲙⲣⲟⲩⲟⲉⲓⲛ / ⲟⲩⲕⲁⲕⲉ ⲡⲉ
  english_pob_choice: When he does not shine, there is darkness
  chosen_korean: 그러나 그가 비추지 않으면 어둠이 있습니다
  alternatives_korean:
  - 그가 비추지 않으면 어둠이 있습니다
  - 그가 빛나지 않으면 어둠이 있습니다
  lexicon: Crum s.v. ⲣⲟⲩⲟⲉⲓⲛ; ⲕⲁⲕⲉ
  rationale: 종결문의 대조를 살리기 위해 ‘그러나’를 넣었고, ⲧⲙ-형의 부정은 한국어 조건/시점 표현으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: Thomas 24의 ‘man of light’ 표현을 어떻게 처리할지
  chosen_reading: 직역어투를 지나치게 유지하지 않고, 의미가 드러나도록 ‘한 사람’으로 옮겼습니다.
  alternative_readings:
  - ‘빛의 사람’으로 직역
  - ‘빛의 인간’으로 직역
  rationale: 이 본문은 정체성 표지보다 존재문과 행위 대조가 핵심이므로, 한국어에서 과도하게 낯선 속격구를 피하면서도 장면의 뜻을 보존했습니다.
  doctrine_reference: 본문 이해의 문맥 판단
