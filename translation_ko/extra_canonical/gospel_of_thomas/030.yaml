base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/030.yaml
  text: Jesus says[1], "Where there are three gods, they are gods. Where there are two or one[a][3][2], I am with him."
  footnotes:
  - marker: '1'
    text: The codex as printed reads “ϩⲛ̄ⲛⲟⲩⲧⲉ ⲛⲉ” (lit. “they are in a god”), while the normalized lemma presents “ⲟⲩⲛⲟⲩⲧⲉ ⲡⲉ.” The translation takes this as a plural predication “they are gods,” which also matches the Greek witness (POxy 1).
    reason: textual_variant
  - marker: '2'
    text: POxy 1 continues with “Take up the stone … split the wood …,” which in the Coptic occurs separately at NHC II, 46:26–28 (Saying 77). The Greek also omits “two,” reading only “when one is alone.”
    reason: cross_reference
  - marker: '3'
    text: The doubled “I—I” renders ⲁⲛⲟⲕ ⲁⲛⲟⲕ, an emphatic repetition common in Coptic to mark focus/intensity.
    reason: dialect_note
  - marker: a
    text: Or 'I—I am with him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "세 신들이 있는 곳에는 그들이 신들입니다. 둘이 있거나 하나인 곳에는 나는 그와 함께 있습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나는 그와 함께 있습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: ⲡⲉϫⲉ
  english_pob_choice: says
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말합니다
  - 이르십니다
  lexicon: Crum
  rationale: 토마스 복음의 서술형 발화 공식을 현대 한국어 합쇼체로 자연스럽게 옮기되, 예수의 권위 있는 발화를 드러내기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: ⲡⲙⲁ … ⲉⲣⲉ-
  english_pob_choice: where (lit. the place where)
  chosen_korean: 곳에는
  alternatives_korean:
  - 장소에는
  - 있는 곳에는
  lexicon: Layton
  rationale: Coptic의 관계절적 ‘where’는 한국어에서 반복을 줄여 ‘곳에는’으로 압축해 자연스럽게 살렸습니다.
- source_word: ⲛⲛⲟⲩⲧⲉ
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 신들입니다
  - 신격들
  lexicon: Crum
  rationale: 복수형 무정관사 표현의 도발성을 살리기 위해 단수화하지 않고 복수 명사 ‘신들’로 옮겼습니다.
- source_word: ⲁⲛⲟⲕ ϣⲱⲡⲉ
  english_pob_choice: I am (present)
  chosen_korean: 나는 … 있습니다
  alternatives_korean:
  - 나는 … 함께합니다
  - 내가 … 있습니다
  lexicon: Crum
  rationale: ⲙⲛⲛⲧⲟϥ(그와 함께)와 결합한 존재·동반의 의미를 한국어의 ‘함께 있습니다’로 간결하게 전달했습니다.
theological_decisions:
- issue: plural 'gods' in the first clause
  chosen_reading: 복수의 ‘신들’이라는 표현을 그대로 유지했습니다.
  alternative_readings:
  - ‘하나님들’
  - ‘신적 존재들’
  rationale: 원문과 영어 POB가 모두 복수 ‘gods’를 유지하며, 본문의 충격성과 역설을 약화시키지 않기 위해 완화 번역을 피했습니다.
  doctrine_reference: source-faithfulness / lexical transparency
- issue: final clause pronoun reference
  chosen_reading: ‘그와 함께 있습니다’로 번역해 남성 단수 대상을 보존했습니다.
  alternative_readings:
  - ‘그들과 함께 있습니다’
  - ‘그와 함께 있겠습니다’
  rationale: Coptic의 단수 대명사 ⲧⲟϥ에 맞추어 단수 ‘그’를 유지했고, 미래형으로 바꾸지 않고 현재적 동반을 나타냈습니다.
  doctrine_reference: source-faithfulness / tense-aspect
