base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
  footnotes:
  - marker: '1'
    text: The Coptic ⲛⲟⲩⲱϭⲡ is a contraction of the negative Third Future ⲛⲛⲉⲩⲟⲩⲱϭⲡ ('they will not be cast down', referring to the plural 'eyes').
    reason: dialect_note
  - marker: '2'
    text: Grammatically, 'his' refers to John the Baptist. Because there is no one higher than him, he does not need to lower his eyes in deference to anyone.
    reason: cultural_note
  - marker: '3'
    text: The preposition ⲁ in ⲁ ⲓⲱϩⲁⲛⲛⲏⲥ ('than John') is a phonetic or dialectal variant of the comparative ⲉ ('than').
    reason: dialect_note
  - marker: '4'
    text: Compare with Matthew 11:11 and Luke 7:28. Thomas adds 'From Adam' and 'so that his eyes will not be cast down,' and shifts the second half from 'the least in the kingdom of heaven is greater' to 'whoever among you becomes a child will know the kingdom, and will become higher.'
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "아담부터 세례자 요한까지, 여자에게서 난 이들 가운데서는 세례자 요한보다 더 높은 이가 없습니다. 그러므로 그의 눈이 아래로 떨구어지지 않을 것입니다. 그러나 내가 말합니다. 여러분 가운데서 누구든지 어린아이가 되면 나라를 알게 될 것이며, 요한보다 더 높아질 것입니다."[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: Coptic ⲟⲩⲱϭⲡ with "eyes" is an idiom for lowering or casting down the eyes in deference or shame.
    reason: source_note
  - marker: b
    text: The preposition rendered here as "보다" reflects a dialectal/phonetic variant corresponding to the comparative force in the source.
    reason: source_note
  - marker: c
    text: Thomas adds "From Adam" and "his eyes will not be cast down," and then shifts the second half to a saying about becoming a child and knowing the kingdom.
    reason: cross_reference
lexical_decisions:
- source_word: ⲁⲇⲁⲙ / ϫⲓⲛⲁⲇⲁⲙ
  english_pob_choice: From Adam
  chosen_korean: 아담부터
  alternatives_korean:
  - 아담에서부터
  - 아담의 때부터
  lexicon: Crum / contextual source reading
  rationale: 시작점 표지를 살려 시간의 범위를 직접적으로 표현했습니다. "아담의 때부터"보다 원문의 간결한 기점을 더 가깝게 반영합니다.
- source_word: ⲡϫⲡⲟ ⲛⲡⲥϩⲓⲙⲉ
  english_pob_choice: offspring of women
  chosen_korean: 여자에게서 난 이들
  alternatives_korean:
  - 여인의 자손
  - 여자들의 소생
  lexicon: Crum 778b / source context
  rationale: 관용적 종교어인 "여인의 자손"보다, 출생 관계를 분명히 드러내는 직역적 표현을 택해 원문의 범위를 보존했습니다.
- source_word: ⲟⲩⲱϭⲡ ⲛ̄ϭⲓⲛⲉϥⲃⲁⲗ
  english_pob_choice: his eyes will not be cast down
  chosen_korean: 그의 눈이 아래로 떨구어지지 않을 것입니다
  alternatives_korean:
  - 그의 눈이 내려가지 않을 것입니다
  - 그의 눈이 아래로 숙여지지 않을 것입니다
  lexicon: Crum 508a / idiomatic source reading
  rationale: 눈을 아래로 내리다/숙이다라는 수치·경의의 관용을 살리되, 문맥상 "cast down"의 동작성을 유지하려고 "떨구어지지"로 옮겼습니다.
- source_word: ⲕⲟⲩⲉⲓ
  english_pob_choice: child
  chosen_korean: 어린아이
  alternatives_korean:
  - 아이
  - 작은 자
  - 어린 것
  lexicon: Crum 130a
  rationale: Thomas 전승의 주제인 순수한 유년성을 드러내기 위해 "어린아이"를 택했습니다. 단순히 신체적 소형을 뜻하는 "작은 자"보다 문맥 적합성이 높습니다.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 하나님의 나라
  lexicon: source context
  rationale: 본문에는 하나님을 명시하는 표지가 없으므로, 더 좁은 신학적 지정을 피하고 원문의 왕권/통치 개념을 포괄하는 "나라"로 처리했습니다.
theological_decisions:
- issue: '''higher than John''의 비교 방향과 종말론적 서열'
  chosen_reading: 본문은 요한을 최상위 인물로 세우면서도, 어린아이가 된 사람은 그보다 더 높아진다고 말하는 역전 구조로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 겸손의 권면
  - 단지 지위 비교를 위한 수사
  rationale: 앞절의 비교와 뒤절의 상승 진술을 함께 살리면, 단순 겸손보다 지위 역전의 긴장이 더 분명해집니다.
  doctrine_reference: Thomas saying theology; textual context with Saying 22
