base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
  footnotes:
  - marker: a
    text: The manuscript lacks a main verb here, reading literally 'to a Samaritan.' Editors supply 'They saw' (ⲁⲩⲛⲁⲩ) to complete the sense.
    reason: textual_variant
    anchor_ref: ⟨They saw⟩
  - marker: c
    text: The Coptic is elliptical, literally 'That one around the lamb?' The disciples' response ('So that he may kill it...') indicates they understood it as a question about the man's intentions.
    reason: lexical_alternative
    anchor_ref: That one around the lamb?
  - marker: b
    text: The Coptic uses an active third-person plural ('and they eat you'), which functions similarly to an English passive ('and you be eaten') but is more vivid.
    reason: register_note
    anchor_ref: and they eat you
translation:
  language: ko
  text: '⟨그들은⟩ 양[a]을 들고 유대로 들어가는 한 사마리아 사람을 보았습니다. 그가 자기 제자들에게 말했습니다. 「저 사람, 양을 둘러메고 간다니?」


    그들이 그에게 말했습니다. 「그것을 죽여서 먹으려는 것입니다.」


    그가 그들에게 말했습니다. 「그것이 살아 있는 동안에는 그는 그것을 먹지 않을 것입니다. 그러나 그것을 죽이면 그것은 시체가 될 것입니다.」


    그들이 말했습니다. 「그렇지 않으면 그는 그것을 할 수 없을 것입니다.」


    그가 그들에게 말했습니다. 「너희 자신은 쉬는 곳[b][c]을 너희를 위해 찾아야 합니다. 그래야 너희가 시체가 되지 않고, 그들이 너희를 먹지 않을 것입니다.」'
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문은 여기서 주동사가 빠져 있어 문자적으로는 ‘사마리아 사람에게/사마리아 사람을 향해’에 가깝습니다. 영어 POB처럼 문맥상 ‘그들은 보았습니다’를 보충할 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 콥트어는 능동 3인칭 복수를 써서 문자적으로는 ‘그들이 너희를 먹는다’라고 되어 있지만, 한국어에서는 ‘너희가 먹힌다’라는 수동적 의미로도 자연스럽게 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 본문의 ‘쉬는 곳’은 직역하면 ‘안식/휴식의 장소’이며, 토마스복음에서 자주 논의되는 ἀνάπαυσις 계열 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲩⲛⲁⲩ / “They saw”
  english_pob_choice: ⟨They saw⟩
  chosen_korean: ⟨그들은⟩
  alternatives_korean:
  - 그들은 보았습니다
  - 그들이 보았습니다
  lexicon: Coptic Scriptorium apparatus; English POB footnote a
  rationale: 본문은 मुख्य 동사가 생략되어 있어 편집자 보충을 따로 드러내기보다, 한국어 본문에서는 보충 동사를 괄호 없이 자연스럽게 처리해 문맥의 유보성을 유지했습니다.
- source_word: ⲡⲏ
  english_pob_choice: That one
  chosen_korean: 저 사람
  alternatives_korean:
  - 그 사람
  - 저 자
  lexicon: Crum 254a
  rationale: 지시대명사의 엘립시스를 살리되 한국어에서 질문처럼 들리는 최소한의 자연스러움을 확보하기 위해 ‘저 사람’으로 옮겼습니다.
- source_word: ⲕⲱⲧⲉ
  english_pob_choice: around
  chosen_korean: 둘러메고
  alternatives_korean:
  - 둘러
  - 주변에
  - 감싸고
  lexicon: Crum 120b
  rationale: 문자적으로는 ‘주변/둘레’이지만, 여기서는 ‘양을 들고’라는 행위와 결합한 구문이어서 ‘둘러메고’가 장면의 동작을 가장 압축적으로 드러냅니다.
- source_word: ⲡⲧⲱⲙⲁ
  english_pob_choice: corpse
  chosen_korean: 시체
  alternatives_korean:
  - 주검
  - 송장
  - 사체
  lexicon: BDAG 893
  rationale: 그리스어 차용어가 가리키는 ‘죽은 몸’을 한국어에서 가장 직설적으로 전달하는 말로 ‘시체’를 선택했습니다.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  english_pob_choice: rest
  chosen_korean: 쉬는 곳
  alternatives_korean:
  - 안식
  - 휴식
  - 쉼
  lexicon: BDAG 73
  rationale: 토마스복음의 신학적 핵심어이지만, 여기서는 장소성(‘place for yourselves’)이 분명하므로 추상명사 ‘안식’보다 ‘쉬는 곳’이 원문 결합을 더 잘 보존합니다.
theological_decisions:
- issue: The disciples’ reply uses a purpose clause rather than a bare prediction.
  chosen_reading: 「그것을 죽여서 먹으려는 것입니다」
  alternative_readings:
  - 「그는 그것을 죽이고 먹을 것입니다」
  - 「그는 그것을 죽여 먹을 것입니다」
  rationale: ϫⲉⲕⲁⲁⲥ는 목적을 나타내므로, 대답을 단순 미래 진술로 평탄화하지 않고 ‘~하려는 것입니다’로 옮겨 질문-응답의 긴장을 보존했습니다.
  doctrine_reference: 문법-서사 보존 원칙
- issue: The final warning keeps the vivid active agent 'they eat you' rather than smoothing it into a passive.
  chosen_reading: 「그들이 너희를 먹지 않을 것입니다」
  alternative_readings:
  - 「너희가 먹히지 않을 것입니다」
  - 「너희를 먹지 않을 것입니다」
  rationale: 원문의 3인칭 복수 능동을 살려, 독자를 향한 위협적이고 생생한 종말 이미지를 약화시키지 않았습니다.
  doctrine_reference: 서술적 직설성 유지
