revisions:
- from: 예수께서 말씀하셨습니다. "만일 육이 영 때문에 생겨난 것이라면 그것은 놀라운 일입니다. 그러나 영이 몸 때문에 생겨난 것이라면 그것은 경이 중의 경이입니다. 그런데도 나는 이 큰 부가 이 가난 속에 자리를 잡은 것을 보고 스스로 놀랍니다."[a][b][c]
  to: 예수께서 말씀하셨습니다. “만일 육이 영 때문에 생겨난 것이라면, 그것은 놀라운 일입니다. 그러나 영이 몸 때문에 생겨난 것이라면, 그것은 경이 중의 경이입니다.[a] 그러나 나는 이 큰 부가 이 가난 속에 어떻게 거처를 정했는지 놀랍니다.”
  rationale: 원문에 없는 ‘보고’를 삭제하고 ⲡⲱⲥ의 ‘어떻게’를 명시하여 마지막 문장의 구문과 의미를 회복했습니다. ⲁⲗⲗⲁ의 전환은 ‘그러나’로, ⲥⲟⲩⲱϩ의 정착·거주 의미는 ‘거처를 정하다’로 반영했습니다. 사본의 ⲁⲛⲟⲕ ⲧⲓⲣϣⲡⲏⲣⲉ는 중복된 ‘나’가 아니라 강조된 주어와 1인칭 동사이므로, 부정확한 반복 대명사 관련 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 두 조건문의 육(ⲥⲁⲣⲝ)·영(ⲡⲛⲉⲩⲙⲁ) 및 영·몸(ⲥⲱⲙⲁ)의 구별, 둘째 조건문의 역접(ⲇⲉ), ‘경이 중의 경이’라는 최상급 표현은 대체로 충실합니다. 그러나 마지막 문장의 ‘…것을 보고’는 원문에 없는 지각 행위를 보태며, ⲡⲱⲥ(‘어떻게’)가 이끄는 간접의문문의 의미도 충분히 드러나지 않습니다.
  naturalness: ‘육’, ‘영’, ‘몸’, ‘경이 중의 경이’는 현대의 격식 있는 성서 번역 문맥에서 자연스럽습니다. 마지막은 ‘어떻게 거처를 정했는지 놀랍니다’로 옮기면 원문의 의문적 감탄과 완료된 거주의 뉘앙스를 자연스럽게 살릴 수 있습니다. ‘그런데도’보다 ⲁⲗⲗⲁ의 강한 전환에는 ‘그러나’가 더 직접적입니다.
  terminology: ⲥⲁⲣⲝ는 ‘육’, ⲥⲱⲙⲁ는 ‘몸’으로 구별하고, ⲡⲛⲉⲩⲙⲁ는 특정 교리적 의미로 좁히지 않은 ‘영’으로 유지하는 것이 적절합니다. 강조된 독립대명사 ⲁⲛⲟⲕ은 한국어의 주어 ‘나는’으로 충분히 반영되며, ‘스스로’는 없어도 됩니다. ϣⲡⲏⲣⲉ의 어휘적 대안은 각주에서 제한적으로 밝혀 둘 수 있습니다.
