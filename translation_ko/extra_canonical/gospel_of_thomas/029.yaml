base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/029.yaml
  text: Jesus said[1], "If the flesh came into being because of the spirit, it is a wonder; but if the spirit came into being because of the body, it is a wonder of wonders[b][a][3][2]. Yet I myself marvel at how this great wealth has made its home in this poverty."
  footnotes:
  - marker: '1'
    text: ϣⲡⲏⲣⲉ may mean “child” in other contexts (Crum), but here the idiom ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ is a superlative, hence “a wonder of wonders.”
    reason: lexical_alternative
  - marker: '2'
    text: Dilley prints ϫⲉⲡⲱ[ⲥ] with the final ⲥ restored; the normalized form is ⲡⲱⲥ (“how”).
    reason: lacuna_or_restoration
  - marker: '3'
    text: POxy 1 preserves “…this poverty,” aligning with ⲡⲉⲓⲙⲛⲧϩⲏⲕⲉ here.
    reason: cross_reference
  - marker: a
    text: Or 'if the spirit came into being because of the body'.
    reason: previous_rendering
  - marker: b
    text: Or 'Yet I—I marvel'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "만일 육이 영 때문에 생겨난 것이라면 그것은 놀라운 일입니다. 그러나 영이 몸 때문에 생겨난 것이라면 그것은 경이 중의 경이입니다. 그런데도 나는 이 큰 부가 이 가난 속에 자리를 잡은 것을 보고 스스로 놀랍니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영이 몸 때문에 생겨난 것이라면’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그런데도 나는—나는 스스로 놀랍니다’.
    reason: previous_rendering
  - marker: c
    text: 본문의 ϣⲡⲏⲣⲉ는 이 문맥에서 ‘아이’가 아니라 ‘경이/놀라움’의 관용구로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲁⲣⲝ
  english_pob_choice: flesh
  chosen_korean: 육
  alternatives_korean:
  - 살
  - 육체
  lexicon: Crum s.v. ⲥⲁⲣⲝ; Layton §49
  rationale: ⲥⲁⲣⲝ는 ⲥⲱⲙⲁ와 의도적으로 대비되므로 둘 다 몸으로 옮기지 않고, 문맥상 물질적/육체적 존재를 가리키는 ‘육’으로 살렸습니다.
- source_word: ⲡⲛⲉⲩⲙⲁ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 영체
  - 성령
  lexicon: Crum; Layton §49
  rationale: 여기서는 신적 성령의 고유명적 용례가 아니라 육/몸과의 철학적 대비이므로, 표준적인 ‘영’이 가장 정확합니다.
- source_word: ⲟⲩϣⲡⲏⲣⲉ / ⲛϣⲡⲏⲣⲉ
  english_pob_choice: a wonder / a wonder of wonders
  chosen_korean: 놀라운 일 / 경이 중의 경이
  alternatives_korean:
  - 기이한 일 / 기이 중의 기이
  - 경탄 / 경탄 중의 경탄
  lexicon: Crum s.v. ϣⲡⲏⲣⲉ; Layton §33
  rationale: 이 표현은 단순히 ‘아이/자녀’를 뜻하는 경우가 아니라 초강조적 관용구이므로, 반복 구조를 살린 한국어 과장 표현으로 옮겼습니다.
- source_word: ⲁⲛⲟⲕ ⲁⲛⲟⲕ / ⲁⲛⲟⲕ ⳿ ϯⲣ̄ϣⲡⲏⲣⲉ
  english_pob_choice: Yet I myself marvel
  chosen_korean: 그런데도 나는 … 스스로 놀랍니다
  alternatives_korean:
  - 그러나 나는 … 놀랍니다
  - 그런데 나는 … 경탄합니다
  lexicon: Layton §66; Lambdin §151
  rationale: 본문은 중복 인칭대명사가 아니라 강조용 독립대명사 뒤의 1인칭 현재형이므로, 어색한 반복 대신 ‘나는 … 스스로’로 강조를 자연스럽게 반영했습니다.
- source_word: ⲁⲛⲧⲟⲥⲟⲩⲱϩ
  english_pob_choice: has made its home
  chosen_korean: 자리를 잡은
  alternatives_korean:
  - 거처를 정한
  - 머물게 된
  - 살림을 튼
  lexicon: Crum s.v. ⲥⲟⲩⲱϩ; Layton §202
  rationale: 완료적 뉘앙스의 거주 동사로서, ‘made its home’의 정착감을 살리되 현대 한국어에서 자연스러운 ‘자리를 잡다’로 옮겼습니다.
- source_word: ⲙⲛⲧⲣⲙⲙⲁⲟ / ⲙⲛⲧϩⲏⲕⲉ
  english_pob_choice: great wealth / this poverty
  chosen_korean: 큰 부 / 가난
  alternatives_korean:
  - 막대한 부 / 이 빈곤
  - 큰 재물 / 이 궁핍
  lexicon: Crum s.v. ⲙⲛⲧⲣⲙⲙⲁⲟ; ⲙⲛⲧϩⲏⲕⲉ
  rationale: 두 명사군의 대조를 살리기 위해 ‘wealth/poverty’를 각각 ‘부/가난’으로 간결하게 대응시켰고, 관형사 ‘이’로 후자의 지시성을 반영했습니다.
theological_decisions:
- issue: 육과 영, 몸과 영의 역설적 인과 관계
  chosen_reading: 두 조건문을 모두 가능성의 역설로 유지하고, 후반부는 저자가 직접 ‘경이 중의 경이’라고 평가하는 반응으로 옮겼습니다.
  alternative_readings:
  - 두 번째 절을 완화해 단순한 대조로만 읽는 번역
  - ‘놀라움’ 대신 평범한 감탄어로 낮추는 번역
  rationale: 이 말씀은 상식적 질서의 역전을 강조하므로, 번역에서도 수사적 충격을 약화하지 않고 유지해야 합니다.
  doctrine_reference: Gospel of Thomas의 지혜 격언 맥락
