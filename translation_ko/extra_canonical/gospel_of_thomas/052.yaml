review_pass:
  verdict: revise
  source_fidelity: 수와 대조의 기본 뜻은 대체로 충실하지만, 원문과 영어 POB가 단지 대명사로 지시하는 화자를 ‘예수’라고 명시한 것은 본문에 없는 정보를 보탭니다. 또한 원문의 단수형 ‘죽은 이’를 초안의 복수 ‘죽은 이들’로 바꾼 점은 피하는 것이 좋습니다. 사본상 이문과 관련된 각주도 해당 구절에 직접 연결해야 합니다.
  naturalness: 초안은 대체로 자연스럽지만, 요청된 현대 합쇼체와 달리 인용문 끝의 ‘말했구나’는 해라체/반말 어미입니다. 인용문 전체를 합쇼체로 통일하고, 각주 표지를 해당 어구 바로 뒤에 배치하면 더 자연스럽고 명료합니다.
  terminology: ‘예언자’, ‘살아 있는 이’, ‘너희 앞에 있는’은 원문의 표현과 현대 한국어 문체에 잘 맞습니다. ‘당신’은 제자들이 예수에게 직접 말하는 장면에서 가능하나, 본문 화자를 ‘그’로 유지하여 원문의 대명사적 표현을 보존하는 편이 안전합니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘예수께서’를 명시했습니다.
    rationale: 제시된 콥트어는 ‘그가 그들에게 말했다’라고만 하며, 영어 POB도 ‘He’로 옮깁니다. 문맥상 지시 대상에 대한 독자의 이해와 별개로 번역 본문에서는 대명사를 유지하는 것이 source-first 원칙에 맞습니다.
  - severity: medium
    issue: 직접 인용문의 ‘말했구나’가 합쇼체와 일치하지 않습니다.
    rationale: 대상 변형이 현대 공식-공손체(합쇼체)이므로 ‘말했습니다’로 고쳐야 합니다.
  - severity: low
    issue: ‘죽은 이들’이 원문의 단수 실체화 관계구문을 복수로 바꿉니다.
    rationale: 문맥상 포괄적 의미는 가능하지만, 원문의 표지된 단수를 보존하여 ‘죽은 이’로 옮기는 편이 더 충실합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 각주 대상이 불명확합니다.
