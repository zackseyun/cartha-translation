- from: 그의 제자들이 그에게 말했습니다. 「스물네 명의 예언자들이 이스라엘에서 말했고, 그들은 모두 당신에 대해 말했습니다」. 예수께서 그들에게 말씀하셨습니다. 「너희는 너희 앞에 있는 살아 있는 이를 빠뜨렸고, 죽은 이들에 대해 말했구나」.[a][b][c][d]
