base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/052.yaml
  text: His disciples said to him[a], “Twenty-four prophets spoke in Israel, and they all spoke about you.” He said to them, “You have left out the living one who is in your presence[d][c][b], and you have spoken about the dead.”
  footnotes:
  - marker: a
    text: The phrase appears in the printed transcription as ‘about your heart’ (ϩⲣⲁⲓ ⲛ̄ϩⲏⲧⲕ); Dilley’s normalized lemma reads ‘about you’ (ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ). We translate the latter but the ‘heart’ reading is possible.
    reason: textual_variant
  - marker: b
    text: ‘Leave out’ can also be rendered ‘omit’ or ‘lack’ (Crum, s.v. ⲕⲱ).
    reason: lexical_alternative
  - marker: c
    text: ‘Twenty-four prophets’ may reflect a traditional enumeration of prophetic authorities or a symbolic count (compare the 24-book reckoning of the Hebrew scriptures in some ancient traditions), though the saying does not specify.
    reason: cultural_note
  - marker: d
    text: Compare the contrast of ‘living’ and ‘dead’ in Mark 12:27 and parallels; Thomas, however, frames the point as missing the living one ‘in your presence.’
    reason: cross_reference
translation:
  language: ko
  text: 그의 제자들이 그에게 말했습니다. 「스물네 명의 예언자들이 이스라엘에서 말했고, 그들은 모두 당신에 대해 말했습니다」. 예수께서 그들에게 말씀하셨습니다. 「너희는 너희 앞에 있는 살아 있는 이를 빠뜨렸고, 죽은 이들에 대해 말했구나」.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 본문은 사본의 표기에서는 ‘당신의 마음에 관하여’(ϩⲣⲁⲓ ⲛ̄ϩⲏⲧⲕ)로도 읽을 수 있으나, 정규화된 읽기(ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ)는 ‘당신에 대해’입니다.
    reason: textual_variant
  - marker: b
    text: ⲕⲱ는 ‘빠뜨리다’ 외에도 ‘생략하다’, ‘부족하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘스물네 명의 예언자들’은 예언 권위의 전통적 수를 반영할 수도 있고, 상징적 수일 수도 있습니다.
    reason: cultural_note
  - marker: d
    text: ‘살아 있는 이’와 ‘죽은 이들’의 대조는 마가복음 12:27 및 평행본문을 떠올리게 하지만, 토마스는 이를 ‘너희 앞에 있는’ 존재를 놓친 것으로 구체화합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲟⲩⲧⲁϥⲧⲉ
  english_pob_choice: twenty-four
  chosen_korean: 스물네 명
  alternatives_korean:
  - 24명
  - 스물네
  lexicon: Crum; Layton
  rationale: 수량 표현을 현대 한국어로 자연스럽게 옮기되, 본문의 간결함을 유지했습니다.
- source_word: ⲁⲩϣⲁϫⲉ / ϣⲁϫⲉ
  english_pob_choice: spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이야기했습니다
  lexicon: Crum
  rationale: 예언자들의 발화를 ‘말했습니다’로 옮겨 서술체를 유지하면서도 예언 선포의 일반적 의미를 살렸습니다.
- source_word: ⲁⲧⲉⲧⲛ̄ⲕⲱ
  english_pob_choice: leave out
  chosen_korean: 빠뜨렸고
  alternatives_korean:
  - 생략했고
  - 빠졌고
  - 빠뜨렸습니다
  lexicon: Crum
  rationale: Coptic ⲕⲱ의 ‘omit/leave out’ 의미를 살려, 청자들이 의도적으로 누락했다는 뉘앙스를 보존했습니다.
- source_word: ⲡⲉⲧⲟⲛϩ
  english_pob_choice: the living one
  chosen_korean: 살아 있는 이
  alternatives_korean:
  - 살아 있는 자
  - 생명 있는 이
  lexicon: Layton
  rationale: 단수 명사구의 실질적 의미를 살리면서 한국어에서 지나치게 문어적이거나 교리적이지 않게 옮겼습니다.
- source_word: ⲛⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  english_pob_choice: in your presence
  chosen_korean: 너희 앞에 있는
  alternatives_korean:
  - 너희의 현존 안에 있는
  - 너희 앞에서
  lexicon: Crum; Lambdin
  rationale: 직역적 ‘앞’의 공간성을 살리되, 한국어에서는 ‘너희 앞에 있는’이 가장 자연스럽고 문맥에 맞습니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲟⲩ
  english_pob_choice: the dead
  chosen_korean: 죽은 이들
  alternatives_korean:
  - 죽은 자들
  - 죽은 사람들
  lexicon: Layton; Crum
  rationale: 대조 구조에서 집합적 의미를 분명히 하면서도 한국어에서 덜 경직된 표현을 택했습니다.
theological_decisions:
- issue: ‘살아 있는 이’와 ‘죽은 이들’의 대조를 어떻게 옮길지
  chosen_reading: 예수의 현재적 현존 속에 있는 ‘살아 있는 이’를 놓치고, 과거의 권위들만 말한 것으로 이해되도록 옮겼습니다.
  alternative_readings:
  - ‘살아 있는 자’/‘죽은 자’로 더 강한 실존적 대조를 드러내는 읽기
  - ‘산 자’/‘죽은 자’로 더 축약하는 읽기
  rationale: 토마스 복음의 요지는 단순한 생사 대비가 아니라, 청자들이 자신들 가운데 있는 살아 있는 존재를 인식하지 못했다는 책망이므로, ‘너희 앞에 있는’과 결합해 현존의 긴장을 살렸습니다.
  doctrine_reference: Gospel of Thomas Saying 52; compare Mark 12:27 as a thematic parallel, without importing canonical wording
