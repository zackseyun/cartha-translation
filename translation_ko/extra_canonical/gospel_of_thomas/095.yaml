    rationale: 원문은 ‘그/그 사람에게’를 뒤의 관계절로 규정합니다. 한국어에서는 ‘되돌려받지 않을 사람에게’로 명사를 밝혀야 관계절과 수혜자의 연결이 자연스럽고 분명합니다.
