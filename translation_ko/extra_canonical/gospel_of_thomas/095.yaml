revisions:
- from: 예수께서 말씀하셨습니다.[a] “만일 당신들에게 돈이 있다면, 이자를 붙여 빌려주지 마십시오. 오히려, 당신들이 다시 돌려받지 않을 그에게 주십시오.”
  to: 예수께서 말씀하셨습니다.[a] “돈이 있으면 이자를 받고 빌려주지 마십시오. 오히려 그 돈을 당신들이 되돌려받지 않을 사람에게 주십시오.”
  rationale: 수혜자를 ‘사람’으로 명시하고 직접 목적어 ‘그 돈’을 보충하여, 원문의 수여 지시와 뒤따르는 관계절의 의미를 자연스러운 한국어로 전달했습니다. 이는 원문에서 돈을 가리키는 대상을 문맥상 보충한 것이며, ‘되돌려받지 않을’은 원문의 ‘당신들이 그에게서 다시 취하지 않을’이라는 방향성을 유지합니다. 서두의 각주 사유도 본문 손상에 따른 복원임을 정확히 표시하도록 정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:14Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 마지막 수혜자 표현에서 ‘그에게’는 한국어에서 선행 대상이 충분히 명시되지 않아, 콥트어의 ‘특정한 사람, 곧 당신들이 되돌려받지 않을 사람’을 명료하게 드러내는 편이 낫습니다. ‘이자를 붙여 빌려주지 마십시오’는 ⲙⲡⲣϯ ⲉⲡⲙⲏⲥⲉ의 금융적 의미를 적절히 반영합니다.
  naturalness: ‘당신들에게’와 ‘그에게’의 연속은 현대 표준 한국어에서 다소 직역투이며, 특히 ‘당신들이 다시 돌려받지 않을 그에게’는 수식 관계가 불분명합니다. 주어를 생략하고 ‘그 돈을 … 사람에게’로 명시하면 합쇼체의 자연스러움과 문장 명료성이 좋아집니다.
  terminology: ‘예수께서 말씀하셨습니다’, ‘이자’, ‘빌려주다’, ‘되돌려받다’는 현대의 정중한 문체에 적합합니다. ‘고리’처럼 과도한 이자라는 제한을 암시할 수 있는 말은 피한 현 선택이 적절합니다.
