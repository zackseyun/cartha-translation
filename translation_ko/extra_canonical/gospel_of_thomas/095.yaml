base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/095.yaml
  text: Jesus said[a], “If you have money, do not lend at interest; rather[f][e][d][c][b], give it to the one from whom you will not take it back.”
  footnotes:
  - marker: a
    text: ‘Interest’ renders Coptic ⲙⲏⲥⲉ (Crum s.v.), often equivalent to ‘usury’ in antiquity; historically ‘usury’ meant any interest, not just excessive rates.
    reason: cultural_note
  - marker: b
    text: The object pronoun is plural (‘them’), likely because ‘money’ is conceptualized as coins; the translation preserves the plural in ‘them back’.
    reason: dialect_note
  - marker: c
    text: 'The recipient phrase is uncertain: the manuscript shows possible ⲙ[ⲙⲟϥ] (‘give it’), while the normalized text reads ϯ ⲛⲛⲧⲟϥ (‘give to him’). The overall sense—directing the gift to a particular kind of person defined by the relative clause—is unchanged.'
    reason: textual_variant
  - marker: d
    text: ‘Jesus said’ at the start is restored due to minor damage in NHAM02.48/lb35.
    reason: lacuna_or_restoration
  - marker: e
    text: The relative clause can also be rendered ‘to one who will not give them back to you’; the chosen translation follows the common reading ‘from whom you will not take them back’.
    reason: lexical_alternative
  - marker: f
    text: Or 'give to the one from whom you will not take them back.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다.[a] “돈이 있으면 이자를 받고 빌려주지 마십시오. 오히려 그 돈을 당신들이 되돌려받지 않을 사람에게 주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “예수께서 말씀하셨습니다”는 NHAM02.48의 일부 손상으로 인해 복원된 서두를 반영합니다.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛ ϩⲟⲙⲧ
  english_pob_choice: you have money
  chosen_korean: 당신들에게 돈이 있다면
  alternatives_korean:
  - 당신들이 돈을 가지고 있다면
  - 당신들에게 화폐가 있다면
  lexicon: Layton / Crum
  rationale: Coptic의 소유 구문을 한국어의 자연스러운 존재·소유 표현으로 옮겼습니다. ϩⲟⲙⲧ는 문맥상 일반적인 돈/화폐를 가리키므로 ‘돈’이 가장 무난합니다.
- source_word: ⲙⲡⲣϯ ⲉⲡⲙⲏⲥⲉ
  english_pob_choice: do not lend at interest
  chosen_korean: 이자를 붙여 빌려주지 마십시오
  alternatives_korean:
  - 고리로 빌려주지 마십시오
  - 이자 없이 주지 마십시오
  lexicon: Crum
  rationale: ϯ ‘주다’와 ⲙⲏⲥⲉ ‘이자, 고리’를 결합한 표현은 ‘이자를 붙여 빌려주다’로 옮기는 것이 한국어에서 기능과 금지를 함께 드러냅니다.
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϫⲓⲛⲧⲟⲟⲩ ⲁⲛ ⲛⲧⲛⲛⲧⲟϥ
  english_pob_choice: from whom you will not take it back
  chosen_korean: 당신들이 다시 돌려받지 않을 그에게
  alternatives_korean:
  - 당신들이 그에게서 다시 가져가지 않을
  - 당신들이 다시 돌려받지 않을 사람에게
  lexicon: Layton
  rationale: 반복 수령을 뜻하는 ⲛⲁϫⲓ의 방향성을 살려 ‘다시 돌려받다’로 옮겼고, 관계절은 수혜 대상을 가리키는 ‘그에게’로 처리했습니다. 한국어에서는 ‘from whom’의 방향을 조사보다 동사구로 풀어내는 편이 자연스럽습니다.
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 이르셨습니다
  - 예수께서 말씀하셨다
  lexicon: Bauer / standard biblical Korean usage
  rationale: 복원된 서두를 반영하면서도 현대 합쇼체 서술에 맞게 정중한 서술형으로 옮겼습니다.
theological_decisions:
- issue: 금지된 경제 행위의 표현 강도
  chosen_reading: 단순한 ‘대여’가 아니라 이자를 붙인 대여를 금지하는 것으로 읽고, 한국어도 그 긴장을 유지했습니다.
  alternative_readings:
  - 그냥 빌려주지 말라는 일반적 권고
  - 과도한 이자만 금지하는 제한적 명령
  rationale: 본문의 ⲙⲏⲥⲉ는 단순 대여가 아니라 이자/고리 수취를 가리키므로, 의미를 약화시키지 않도록 ‘이자를 붙여’로 직접 반영했습니다.
  doctrine_reference: 본문 주해상의 경제 윤리 이해
- issue: 수혜 대상의 지시 방식
  chosen_reading: ‘그에게’는 뒤따르는 관계절이 규정하는 특정 인물을 가리키는 지시로 처리했습니다.
  alternative_readings:
  - ‘그 사람에게’로 명시
  - 관계절을 앞세워 ‘돈을 돌려받지 않을 사람에게’로 재구성
  rationale: Coptic의 지시대명사와 관계절 결합은 대상의 유형을 규정하는 기능이므로, 한국어에서도 그 인물을 특정하면서 과도한 해설을 덧붙이지 않았습니다.
  doctrine_reference: 본문 비평 및 담화 구조
