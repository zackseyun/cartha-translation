    issue: ‘나를 낳은 참된 어머니’가 원문에 없는 내용을 추가합니다.
    rationale: 현존 본문은 ‘나의 어머니’와 ‘나의 참된 어머니’를 대조할 뿐, ‘참된 어머니’가 화자를 낳았다고 말하지 않습니다. 앞 절의 동사·내용은 훼손되어 있으므로 출산이라는 관계를 번역문에서 확정할 수 없습니다.
  - severity: low
    issue: 각주 a와 b의 표지 위치가 해당 어구 바로 뒤에 있지 않습니다.
    rationale: a는 ‘나와 같이’ 뒤, b는 ‘참된’ 뒤에 두면 각주의 지시 대상이 명확해집니다.
