revisions:
- from: 아버지와 어머니를 나와 같이 미워하지 않는 사람은 내 제자가 될 수 없습니다[a]. 또 아버지와 어머니를 나와 같이 사랑하지 않는 사람도 내 제자가 될 수 없습니다. 내 어머니는 […]였지만, 나를 낳은 참된 어머니는 나에게 생명을 주셨습니다[b][c].
  to: 아버지와 어머니를 나와 같이[a] 미워하지 않는 사람은 내 제자가 될 수 없습니다. 또 아버지와 어머니를 나와 같이 사랑하지 않는 사람도 내 제자가 될 수 없습니다. 내 어머니는 […] . 그러나 나의 참된[b] 어머니는 나에게 생명을 주셨습니다.[c]
