base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/101.yaml
  text: Whoever does not hate his father and his mother as I do cannot become my disciple[a]; and whoever does not love his father and his mother as I do cannot become my disciple. For my mother [...][c], but my true[b] [mother] gave me life.
  footnotes:
  - marker: a
    text: Lit. 'in my manner' or 'like me' (ⲛ̄ⲧⲁϩⲉ).
    reason: lexical_alternative
    anchor_ref: as I do
  - marker: b
    text: Lit. 'of truth' (ⲙ̄ⲙⲉ).
    reason: lexical_alternative
    anchor_ref: 'true'
  - marker: c
    text: The manuscript is damaged here (ⲛ̄ⲧⲁⲥ̣[.........] [..]ⲟ̣ⲗ̣). Scholars often reconstruct the missing text to mean something like 'bore me unto death' or 'gave me falsehood,' contrasting with the true mother who gave life.
    reason: textual_variant
    anchor_ref: '[...]'
translation:
  language: ko
  text: 아버지와 어머니를 나와 같이[a] 미워하지 않는 사람은 내 제자가 될 수 없습니다. 또 아버지와 어머니를 나와 같이 사랑하지 않는 사람도 내 제자가 될 수 없습니다. 내 어머니는 […] . 그러나 나의 참된[b] 어머니는 나에게 생명을 주셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나와 같은 방식으로’ 또는 ‘나처럼’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘진리의’ 또는 ‘진실한’입니다.
    reason: lexical_alternative
  - marker: c
    text: 사본의 이 부분은 훼손되어 있어, ‘내 어머니는’ 뒤의 내용 일부를 알 수 없습니다. 여러 복원안이 제안되지만, 현존 본문만으로 그 내용을 확정할 수 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲉⲥⲧⲉ
  english_pob_choice: hate
  chosen_korean: 미워하다
  alternatives_korean:
  - 증오하다
  - 미워하지 않다
  lexicon: Crum 185a
  rationale: 콥트어 ⲙⲉⲥⲧⲉ는 기본적으로 ‘미워하다’의 의미이므로, 한국어에서는 문어적이면서도 직설적인 ‘미워하다’로 옮겼습니다.
- source_word: ⲙⲣ̄ⲣⲉ
  english_pob_choice: love
  chosen_korean: 사랑하다
  alternatives_korean:
  - 좋아하다
  - 애정하다
  lexicon: Crum 155b
  rationale: ⲙⲣ̄ⲣⲉ의 기본 의미를 가장 자연스럽게 드러내는 표준어로 ‘사랑하다’를 선택했습니다.
- source_word: ⲛ̄ⲧⲁϩⲉ
  english_pob_choice: as I do
  chosen_korean: 나와 같이
  alternatives_korean:
  - 내 방식대로
  - 내가 하듯이
  lexicon: Crum 651a
  rationale: 직역하면 ‘내 방식으로/나와 같이’에 가까우므로, 행위의 동일성을 살리면서도 한국어에서 자연한 ‘나와 같이’로 처리했습니다.
- source_word: ⲙ̄ⲙⲉ
  english_pob_choice: 'true'
  chosen_korean: 참된
  alternatives_korean:
  - 진실한
  - 진정한
  lexicon: Crum 157b
  rationale: ⲙ̄ⲙⲉ의 ‘진리/진실에 속한’ 뉘앙스를 인격적 관계 안에서 드러내기 위해 ‘참된’으로 옮겼습니다.
- source_word: ⲱⲛϩ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 목숨
  - 삶
  lexicon: Crum 512a
  rationale: 문맥상 단순한 생물학적 생존보다 출생과 대조되는 생명의 부여를 말하므로 ‘생명’이 가장 적절합니다.
theological_decisions:
- issue: ‘참된 어머니’의 정체를 본문에 명시할지 여부
  chosen_reading: 본문은 ‘참된 어머니’라고만 번역하고, 정체는 본문 밖 해석으로 남겼습니다.
  alternative_readings:
  - ‘성령’으로 풀이해 본문에 반영
  - ‘지혜’로 풀이해 본문에 반영
  rationale: 콥트어 본문 자체는 ‘참된’(of truth/true)이라는 속성만 직접 말하므로, 신학적 해석은 주석 영역으로 남기는 것이 소스에 더 충실합니다.
  doctrine_reference: 본문-주석 구분 원칙
