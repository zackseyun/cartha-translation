base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/041.yaml
  text: Jesus said[a], “Whoever has something in his hand, they will give to him; and whoever does not have[f][e][d][c][b], they will take even the little that he has from him.”
  footnotes:
  - marker: a
    text: The Coptic possessive construction ⲟⲩⲛⲧⲁ- with object pronoun (here ⲧⲟϥ ‘it’) can be expletive, effectively meaning ‘to have (something).’ Hence ‘something’ is supplied for clarity.
    reason: lexical_alternative
  - marker: b
    text: The 3rd plural verbs (‘they will give/take’) function impersonally in Sahidic, roughly equivalent to English ‘it will be given/taken.’ The translation keeps the impersonal ‘they’ to reflect the Coptic.
    reason: dialect_note
  - marker: c
    text: ⲡⲕⲉϣⲏⲙ literally ‘the little (one/thing),’ a substantivized adjective; it can mean a small amount or ‘the few.’ The rendering ‘the little’ preserves the deliberate terseness.
    reason: lexical_alternative
  - marker: d
    text: Diplomatic transcription has ⲛ̄ⲧⲟⲟⲧϥ̄ ‘from him’; the normalized line shows ⲛⲧⲛⲛⲧⲟϥ. This draft follows the straightforward prepositional phrase ‘from him.’
    reason: textual_variant
  - marker: e
    text: For comparison see Mark 4:25; Matt 13:12; Luke 8:18; 19:26, which share the aphorism in passive voice and without ‘in his hand.’
    reason: cross_reference
  - marker: f
    text: Or 'the little that he has will be taken away from him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「손에 무엇이 있는 사람에게는 그것을 주고, 아무것도 없는 사람에게서는 그가 가진 작은 것마저도 빼앗을 것입니다」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 소유구문 ⲟⲩⲛⲧⲁ-는 때로 막연한 ‘무엇인가/무언가 있음’을 뜻하므로, 영어 POB의 보충어를 따라 한국어에서도 의미를 풀어냈습니다.
    reason: lexical_alternative
  - marker: b
    text: 콥트어의 3인칭 복수 미래형은 비인칭적으로 쓰여 ‘그것이 주어질 것이다/빼앗길 것이다’의 뜻을 나타낼 수 있습니다. 한국어는 원문의 평행성을 살려 능동적으로 옮겼습니다.
    reason: source_note
  - marker: c
    text: ⲡⲕⲉϣⲏⲙ은 문자적으로 ‘그 작은 것’에 가까운 표현으로, ‘작은 것’이라고 옮기면 원문의 간결한 여운을 유지할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 말씀하셨다
  - 예수께서 이르셨습니다
  lexicon: Coptic ⲡⲉϫⲉ (say/speak)
  rationale: 서술문의 간결한 과거를 한국어 합쇼체로 자연스럽게 옮기되, 인용문을 여는 발화 표지로 유지했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  english_pob_choice: whoever has something
  chosen_korean: 손에 무엇이 있는 사람
  alternatives_korean:
  - 무엇인가 가진 사람
  - 그것을 가진 사람
  lexicon: Coptic relative + possessive ⲟⲩⲛⲧⲁ-
  rationale: 문맥상 ‘가지고 있음’의 대상이 추상적 ‘무엇이든’에 가까워서, 영어 POB의 보충어 ‘something’에 해당하는 의미를 한국어로 자연스럽게 풀어냈습니다.
- source_word: ⲡⲕⲉϣⲏⲙ
  english_pob_choice: the little
  chosen_korean: 작은 것
  alternatives_korean:
  - 그 작은 것
  - 적은 것
  lexicon: Coptic ⲕⲉϣⲏⲙ (small/little thing)
  rationale: 단순히 양적 ‘적은 것’보다, 소유된 대상을 가리키는 간결한 명사구로 옮겨 원문의 압축성을 살렸습니다.
- source_word: ⲥⲉⲛⲁϯ / ⲥⲉⲛⲁϥⲓⲧϥ̄
  english_pob_choice: they will give / they will take
  chosen_korean: 주고 … 빼앗을 것입니다
  alternatives_korean:
  - 줄 것입니다 / 가져갈 것입니다
  - 주고 … 가져갈 것입니다
  lexicon: Coptic 3rd plural future used impersonally
  rationale: 사힛 콥트어의 비인칭 3인칭 복수를 한국어 능동·수동으로 기계적으로 맞추지 않고, 결과 중심의 한국어 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 비유적 격언의 주체와 일반성
  chosen_reading: 이 말씀은 특정 집단에 대한 직접 규범이라기보다, 소유와 상실의 역설을 말하는 일반 격언으로 읽었습니다.
  alternative_readings:
  - 제자 공동체 내부의 분배 원리로 읽기
  - 종말론적 심판 선언으로 읽기
  rationale: 토마스 복음의 짧은 잠언 형식과 콥트어의 비인칭 문법을 고려하면, 보편적 경구로 처리하는 것이 가장 충실합니다.
  doctrine_reference: 문학 장르 및 담화 기능
