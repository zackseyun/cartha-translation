revisions:
- from: 예수께서 말씀하셨습니다. 「손에 무엇이 있는 사람에게는 그것을 주고, 아무것도 없는 사람에게서는 그가 가진 작은 것마저도 빼앗을 것입니다」[a][b][c]
  to: 예수께서 말씀하셨습니다. 「손에 무엇인가를 가진 사람에게는 주어질 것이며,[a][b] 가진 것이 없는 사람에게서는 그가 가진 작은 것마저도 빼앗길 것입니다.[b][c]」
  rationale: 원문에 없는 ‘그것을’이라는 목적어를 제거하고, 평행한 두 비인칭 미래 동사를 한국어 수동 표현으로 일관되게 옮겼습니다. ‘작은 것마저도’는 원문의 간결성과 강조를 보존합니다. 각주도 본문 번역과 일치하도록 전면 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:16Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역의 ‘그것을 주고’는 원문에 없는 목적어를 앞절의 ‘손에 있는 무엇’으로 특정하여, 가진 것을 준다는 뜻으로 바꿉니다. 원문은 ‘그에게 줄 것이다’라고만 하며, 두 3인칭 복수 미래형은 모두 비인칭적으로 이해될 수 있습니다. 또한 ⲡⲕⲉϣⲏⲙ의 ‘작은 것’과 강조(‘마저도’)는 유지하는 편이 적절합니다.
  naturalness: ‘손에 무엇이 있는 사람’보다 ‘손에 무엇인가를 가진 사람’이 현대 한국어에서 더 자연스럽습니다. 행위자를 특정하지 않는 ‘주어질 것이며 / 빼앗길 것입니다’는 한국어 문체에도 자연스럽고 원문의 비인칭성을 잘 반영합니다.
  terminology: ‘예수께서 말씀하셨습니다’와 ‘작은 것마저도’는 합쇼체와 잠언적 문체에 적합합니다. ‘아무것도 없는 사람’은 뒤의 ‘그가 가진 작은 것’과 한국어에서 다소 충돌하므로, 원문의 역설을 보존하면서도 ‘가진 것이 없는 사람’으로 옮겼습니다.
  issues:
  - severity: high
    issue: ‘그것을 주고’가 원문에 없는 목적어를 특정합니다.
    rationale: ⲛⲧⲟⲟⲩⲛⲁϯ ⲛⲁⲛⲧⲟϥ은 ‘그에게 그들이/사람들이 줄 것이다’이며, 앞의 ‘손에 무엇인가 가진’ 대상을 ‘주는 것’으로 표시하지 않습니다.
  - severity: medium
    issue: 두 비인칭 복수 동사의 번역 방식과 각주 설명이 불일치합니다.
    rationale: 본문은 첫 동사를 능동 ‘주고’, 둘째 동사를 수동 ‘빼앗을 것입니다’로 처리하지만, 각주는 평행성을 위해 능동으로 옮겼다고 설명합니다. 한국어에서는 양쪽을 비인칭 수동으로 통일하는 것이 자연스럽고 충실합니다.
