base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
  footnotes:
  - marker: a
    text: The initial ‘Jesus said’ is partially reconstructed in the manuscript (Dilley’s brackets), normalized as ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ.
    reason: lacuna_or_restoration
  - marker: b
    text: ‘Knocks to enter’ reflects ⲧⲱϩⲙ with the directional ⲉϩⲟⲩⲛ (‘inwards, to go in’), without adding ‘door,’ which is not expressed.
    reason: cultural_note
  - marker: c
    text: ‘It will be opened for him’ renders the impersonal 3pl future ⲛⲧⲟⲟⲩ with passive sense; alternatively, ‘they will open (it) for him.’
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 찾는 사람은 찾을 것이고, 안으로 들어가려고 두드리는 사람은 그에게 열릴 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾는 사람’은 Coptic 상대절 ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ의 일반적 주어 표현을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘안으로 들어가려고’는 ⲉϩⲟⲩⲛ의 방향성을 반영한 것이며, 본문에 ‘문’은 없습니다.
    reason: source_note
  - marker: c
    text: ‘그에게 열릴 것입니다’는 비인칭 3인칭 복수형이 수동적으로 쓰인 표현을 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 말씀하셨어요
  - 예수께서 이르셨습니다
  lexicon: Coptic ⲡⲉϫⲉ + proper name ⲓⲏⲥⲟⲩⲥ
  rationale: 도입부의 간결한 서술 공식을 한국어 합쇼체로 자연스럽게 옮기되, 구어체보다 문헌체에 맞는 ‘말씀하셨습니다’를 택했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ
  english_pob_choice: the one who seeks
  chosen_korean: 찾는 사람
  alternatives_korean:
  - 구하는 사람
  - 찾고 있는 사람
  lexicon: Coptic relative construction + ϣⲓⲛⲉ
  rationale: 일반적·잠언형 진술의 간결함을 살려 ‘찾는 사람’으로 옮겼습니다. ‘구하다’도 가능하지만, 여기서는 발견과 대응되는 ‘찾다’가 더 직접적입니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲧⲱϩⲙ ⲉϩⲟⲩⲛ
  english_pob_choice: the one who knocks to enter
  chosen_korean: 안으로 들어가려고 두드리는 사람
  alternatives_korean:
  - 들어가려고 두드리는 사람
  - 안으로 들어가며 두드리는 사람
  lexicon: Coptic ⲧⲱϩⲙ + directional ⲉϩⲟⲩⲛ
  rationale: 방향어 ⲉϩⲟⲩⲛ의 ‘안으로/들어가려고’라는 뉘앙스를 살리면서, 영어 POB가 지적한 것처럼 ‘문’은 보태지 않았습니다.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁ ⲟⲩⲱⲛ ⲛⲁ ⲛⲧⲟϥ
  english_pob_choice: it will be opened for him
  chosen_korean: 그에게 열릴 것입니다
  alternatives_korean:
  - 그에게 열어질 것입니다
  - 그를 위해 열릴 것입니다
  lexicon: Coptic impersonal future passive with ⲟⲩⲱⲛ
  rationale: 비인칭 3인칭 복수형의 수동적 용법을 한국어 피동으로 자연스럽게 옮겼습니다. 목적어 ‘그것’은 한국어에서 불필요하게 느껴져 생략했습니다.
theological_decisions:
- issue: 문장형 지혜/잠언적 진술의 어조
  chosen_reading: 직설적이고 보편적인 약속으로 읽히는 현재적 진술로 유지했습니다.
  alternative_readings:
  - 미래적 보증문으로 더 강하게 표현할 수 있음
  - 명령/권면 뉘앙스를 덧붙일 수 있음
  rationale: 원문은 일반화된 조건-결과 구조를 가진 간명한 진술이므로, 과장된 신학적 해석 없이 보편 명제로 남기는 편이 원문에 가깝습니다.
  doctrine_reference: '문맥상 해석 원칙: 격언적 말씀은 수사보다 진술 구조를 우선함'
