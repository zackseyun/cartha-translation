  source_fidelity: 핵심 의미는 원문에 대체로 충실합니다. 다만 필사본에서 ‘예수께서 말씀하셨다’의 첫 부분이 복원되었다는 중요한 본문 비평 정보를 현행 각주 a가 반영하지 않습니다. 또한 두 번째 절의 수혜자 ⲛⲁ ⲛⲧⲟϥ는 한국어에서 ‘두드리는 사람에게는’으로 직접 연결하는 편이 더 명료합니다.
