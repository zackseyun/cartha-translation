revisions:
- from: 그의 제자들이 말했습니다. “언제 당신이 우리에게 드러나시겠으며, 언제 우리가 당신을 보게 되겠습니까?” 예수께서 말씀하셨습니다. “여러분이 부끄러워하지 않고 벌거벗을 때, 그리고 여러분의 옷을 가져다가 어린아이들처럼 그 옷을 여러분의 발아래 두고 그것들을 짓밟을 때, 그때 여러분은 살아 있는 이의 아들을 보게 될 것이며, 두려워하지 않게 될 것입니다.”[a][b][c][d][e][f][g]
  to: 그의 한 제자가 말했습니다. “언제[a] 당신이 우리에게 드러나시겠으며[f], 언제 우리가 당신을 보게 되겠습니까?” 예수께서 말씀하셨습니다. “여러분이 부끄러워하지 않고[b] 벌거벗을 때, 그리고 여러분의 옷을 가져다가 어린아이들처럼[c][e] 그 옷을 여러분의 발아래 두고 그것들을 짓밟을 때, 그때[d] 여러분은 살아 있는 이의 아들[g]을 보게 될 것이며, 두려워하지 않게 될 것입니다.”
  rationale: 원문 우선 원칙에 따라 첫 발화자를 단수로 바로잡았습니다. 또한 모든 기존 각주를 의미상 해당하는 본문 어구에 재배치하여 앵커를 명확히 했습니다. 본문의 의도적으로 낯선 벌거벗음·옷을 짓밟음의 이미지는 비유로 해설하거나 완화하지 않고 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:14Z'
review_pass:
  verdict: revise
  source_fidelity: 원문은 첫 화자를 단수(‘그의 제자’)로 표현하므로 ‘그의 제자들이’는 원문 수와 일치하지 않습니다. 또한 현 초안의 각주 표지가 문장 끝에 일괄 배치되어 있어, 각 대안이 가리키는 본문 어구를 식별할 수 없습니다. 나머지 핵심 동작—수치 없이 벌거벗음, 옷을 가져와 발아래 두고 짓밟음—과 ‘살아 있는 이의 아들’은 원문의 표현과 긴장을 대체로 충실히 보존합니다.
  naturalness: ‘한 제자가 말했습니다’와 인용문 안의 합쇼체는 현대 표준 한국어로 자연스럽습니다. 각주 표지를 해당 어구 바로 뒤에 배치하면 독해성과 주석 기능도 개선됩니다.
  terminology: ‘드러나시겠으며’, ‘어린아이들처럼’, ‘살아 있는 이의 아들’은 원문의 개방적인 표현을 유지하며 특정 교리적 해석을 덧붙이지 않습니다. ‘살아 있는 이’는 원문의 정관사적 호칭을 기계적으로 신격화하지 않는 적절한 번역입니다.
  issues:
  - severity: medium
    issue: 첫 화자의 수가 원문과 다릅니다.
    rationale: 사히드어 본문은 ⲡⲉϥⲙⲁⲑⲏⲧⲏⲥ, 즉 ‘그의 제자’라는 단수형을 사용합니다. 영어 POB의 복수형보다 원문을 우선하여 단수로 옮겨야 합니다.
  - severity: medium
