base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
translation:
  language: ko
  text: 그의 한 제자가 말했습니다. “언제[a] 당신이 우리에게 드러나시겠으며[f], 언제 우리가 당신을 보게 되겠습니까?” 예수께서 말씀하셨습니다. “여러분이 부끄러워하지 않고[b] 벌거벗을 때, 그리고 여러분의 옷을 가져다가 어린아이들처럼[c][e] 그 옷을 여러분의 발아래 두고 그것들을 짓밟을 때, 그때[d] 여러분은 살아 있는 이의 아들[g]을 보게 될 것이며, 두려워하지 않게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “언제 당신이 나타나시겠으며”
    reason: alternative_reading
  - marker: b
    text: 또는 “수치심 없이”
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “작은 아이들”입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 “그러면”
    reason: alternative_reading
  - marker: e
    text: 또는 “같이”
    reason: alternative_reading
  - marker: f
    text: 또는 “계시되시겠으며”
    reason: alternative_reading
  - marker: g
    text: 직역하면 “살아 있는 자의 아들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  english_pob_choice: be revealed
  chosen_korean: 드러나시겠으며
  alternatives_korean:
  - 나타나시겠으며
  - 계시되시겠으며
  lexicon: Coptic verbal expression of appearing/revealing
  rationale: ‘드러나다’는 단순 출현보다 감추인 것이 밝히 드러나는 의미를 살려, 제자들의 질문인 ‘언제 당신이 우리에게 드러나시겠습니까?’를 자연스럽게 옮겼습니다.
- source_word: ϥⲓ ⲛⲛⲉⲧⲛ̄ϣⲧⲏⲛ
  english_pob_choice: take your clothes
  chosen_korean: 여러분의 옷을 가져다가
  alternatives_korean:
  - 여러분의 옷을 집어다가
  - 여러분의 옷을 취해다가
  lexicon: Coptic verb of taking/lifting with object 'your clothes'
  rationale: 본문은 옷을 단순히 ‘벗는’ 것이 아니라 ‘가져다가’ 다른 동작으로 이어집니다. 그래서 동작의 연속성을 드러내는 표현을 택했습니다.
- source_word: ϩⲁⲡⲉⲥⲏⲧ
  english_pob_choice: under your feet
  chosen_korean: 여러분의 발아래
  alternatives_korean:
  - 발밑에
  - 여러분 발밑에
  lexicon: Coptic prepositional phrase beneath the feet
  rationale: 비유의 공간 관계를 한국어에서 가장 자연스럽게 나타내는 ‘발아래’를 사용했습니다.
- source_word: ⲛ̄ⲑⲉ ... ⲛ̄ⲛⲓⲕⲟⲩⲉⲓ ⲛ̄ϣⲏⲣⲉ ϣⲏⲙ
  english_pob_choice: like the little children
  chosen_korean: 어린아이들처럼
  alternatives_korean:
  - 작은 아이들처럼
  - 어린아이들과 같이
  lexicon: Coptic comparative phrase with diminutive children
  rationale: POB의 ‘the little children’에 맞춰, 한국어에서도 연령의 작음을 분명히 하는 ‘어린아이들처럼’으로 옮겼습니다.
- source_word: ⲡϣⲏⲣⲉ ⲛⲡⲉⲧⲉⲣⲉⲱⲛϩ
  english_pob_choice: the Son of the Living One
  chosen_korean: 살아 있는 이의 아들
  alternatives_korean:
  - 살아 계신 이의 아들
  - 살아 있는 분의 아들
  lexicon: Coptic construction with adjectival participle 'the living one'
  rationale: 원문의 ‘the Living One’에 대한 직역을 유지하되, 인격적 호칭을 과도하게 신학화하지 않도록 ‘살아 있는 이’로 옮겼습니다.
theological_decisions:
- issue: ‘벌거벗음’과 ‘부끄러워하지 않음’의 결합
  chosen_reading: 본문의 조건을 윤리적 교훈으로 완화하지 않고, 드러남과 수치의 해소가 함께 오는 급진적 표지를 그대로 유지했습니다.
  alternative_readings:
  - 영적 순결의 비유로 완화
  - 단순한 금욕적 상징으로 정리
  rationale: 토마스 복음서의 표현은 문자적·상징적 긴장을 의도적으로 남깁니다. 이를 해소하지 않고 그대로 두어야 문장의 충격과 조건성이 보존됩니다.
  doctrine_reference: Gospel of Thomas Saying 37; source-level rhetorical tension
