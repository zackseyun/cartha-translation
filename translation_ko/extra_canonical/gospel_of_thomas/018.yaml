  source_fidelity: 초안은 예수의 첫 반문에서 원문의 논리적 순서와 관계를 뒤바꾸었습니다. 콥트어는 ‘너희가 시작을 찾아냈기에/찾아냈으므로 끝을 찾는 것이냐?’라고 묻지, ‘너희가 끝을 찾느냐, 시작을 발견하지 못했느냐?’라고 두 질문을 병렬하지 않습니다. 또한 ⲉⲣⲁⲧϥ의 3인칭 남성 단수 지시 대상이 불확정적인 점을 본문과 주석에서 보존할 필요가 있습니다.
  naturalness: 합쇼체의 직접화법과 서술은 전반적으로 자연스럽습니다. 다만 ‘시작이 있는 곳에는 거기에’는 한국어에서 중복이 다소 부자연스러우므로 ‘시작이 있는 곳, 바로 그곳에’로 다듬는 것이 자연스럽고 원문의 장소 대조도 유지합니다.
  terminology: ‘끝’, ‘시작’, ‘복됩니다’, ‘죽음을 맛보지 않을 것입니다’는 원문의 대조, 마카리오스 선언, 관용구를 적절히 반영합니다. 인명은 원문에 경칭이 없으므로 ‘예수’로 일관되게 표기했습니다.
  issues:
