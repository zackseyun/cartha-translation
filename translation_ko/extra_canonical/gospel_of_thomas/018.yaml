base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/018.yaml
  text: The disciples said to Jesus[a], “Tell us how our end will be.” He said, “Have you found the beginning, then, that you are seeking the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand in the beginning; he will know the end[d][c][b], and he will not taste death.”
  footnotes:
  - marker: a
    text: “Have you found the beginning, then … ?” The particle sequence ⲁⲛⲧⲱⲧⲛ … ⲅⲁⲣ functions rhetorically; ‘then’ captures the tone without over‑translating ‘for/indeed.’
    reason: lexical_alternative
  - marker: b
    text: “In the place where the beginning is, there the end will be.” The Coptic explicitly uses ϩⲛ ⲡⲙⲁ ‘in the place’ with a relative clause; the translation keeps that structure.
    reason: cultural_note
  - marker: c
    text: '“Blessed is the one who will stand in the beginning”: literally “who will stand before it/in his presence in the beginning” (ⲉⲣⲁⲧϥ ϩⲛ ⲡⲁⲣⲭⲏ). The 3ms suffix may refer to ‘the beginning’ or to an implied ‘First/Origin.’'
    reason: dialect_note
  - marker: d
    text: “Will not taste death” renders the idiom ϫⲓϯⲡⲉ ⲛⲙⲟⲩ, a set Coptic expression for experiencing death.
    reason: cultural_note
translation:
  language: ko
  text: 제자들이 예수님께 말했습니다. 「우리의 끝이 어떻게 되겠습니까? 우리에게 말씀해 주십시오.」 예수께서 말씀하셨습니다. 「그렇다면 너희가 끝을 찾고 있느냐? 너희가 시작을 발견하지 못했느냐? 시작이 있는 곳에는 거기에 끝이 있을 것이다. 시작에 서게 될 사람은 복됩니다 — 그는 끝을 알 것이며, 죽음을 맛보지 않을 것이다.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그렇다면”은 Coptic의 ⲁⲛⲧⲱⲧⲛ … ⲅⲁⲣ가 만드는 반문적 흐름을 자연스럽게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: “시작이 있는 곳에는 거기에 끝이 있을 것이다”는 Coptic의 명시적 장소 표현 ϩⲛ ⲡⲙⲁ를 반영합니다.
    reason: source_note
  - marker: c
    text: “시작에 서게 될 사람”은 ⲉⲣⲁⲧϥ ϩⲛ ⲡⲁⲣⲭⲏ의 직역 가능성을 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: d
    text: “죽음을 맛보지 않을 것이다”는 ϫⲓϯⲡⲉ ⲛⲙⲟⲩ의 관용적 표현을 보존한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: ϫⲟⲟⲥ / ϫⲱⲛⲧⲟⲥ ⲉⲣⲟⲛ
  english_pob_choice: tell us
  chosen_korean: 말씀해 주십시오
  alternatives_korean:
  - 우리에게 말씀하십시오
  - 우리에게 말해 주십시오
  lexicon: Crum; Layton
  rationale: 직접 요청의 명령형 뉘앙스를 살리되, 한국어에서는 정중한 요청형이 가장 자연스러워 “말씀해 주십시오”로 옮겼습니다.
- source_word: ⲡϩⲁⲏ
  english_pob_choice: end
  chosen_korean: 끝
  alternatives_korean:
  - 마지막
  - 종결
  lexicon: Crum
  rationale: 시작/끝의 대조를 한국어로 또렷하게 드러내기 위해 “끝”을 택했습니다.
- source_word: ⲡⲁⲣⲭⲏ
  english_pob_choice: beginning
  chosen_korean: 시작
  alternatives_korean:
  - 근원
  - 처음
  lexicon: Crum
  rationale: 그리스어 차용어의 핵심 대비를 살리기 위해 “시작”으로 옮겼습니다. “근원”은 해석이 더 강하고, “처음”은 약간 구어적입니다.
- source_word: ϩⲛ ⲡⲙⲁ ⲉⲧⲉⲣⲉ … ⲙⲙⲁⲩ
  english_pob_choice: in the place where … there …
  chosen_korean: 시작이 있는 곳에는 거기에 …
  alternatives_korean:
  - 시작이 있는 곳에
  - 시작이 있는 자리에는 거기에 …
  lexicon: Layton
  rationale: 명시적 장소 표현을 유지해 “곳”과 “거기에”의 대응을 살렸습니다.
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  english_pob_choice: Blessed
  chosen_korean: 복됩니다
  alternatives_korean:
  - 복이 있습니다
  - 복되다
  lexicon: Crum
  rationale: μακάριος의 전통적 축복 선언을 살리되 현대 한국어 문장으로 자연스럽게 만들기 위해 서술형 “복됩니다”를 사용했습니다.
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  english_pob_choice: taste death
  chosen_korean: 죽음을 맛보지 않을 것이다
  alternatives_korean:
  - 죽음을 경험하지 않을 것이다
  - 죽음을 겪지 않을 것이다
  lexicon: Crum; Layton
  rationale: 관용구를 직역에 가깝게 유지하여 문장의 강한 이미지와 특별한 표현감을 보존했습니다.
theological_decisions:
- issue: 예수의 발화에서 2인칭 복수 질책의 어조
  chosen_reading: “그렇다면 너희가 끝을 찾고 있느냐? 너희가 시작을 발견하지 못했느냐?”로 옮겨, 질문 속 반문과 책망의 힘을 살렸습니다.
  alternative_readings:
  - “너희는 시작을 찾지 못했느냐?”
  - “왜 끝을 찾느냐?”
  rationale: 원문은 단순 정보 전달이 아니라 제자들의 질문을 되받아치는 반문이므로, 한국어도 수사적 긴장을 유지해야 합니다.
  doctrine_reference: 수사적 질문의 보존; 본문 의미 전달 원칙
- issue: 복됨 선언의 형식
  chosen_reading: “복됩니다”를 사용해 선언적 축복을 살렸습니다.
  alternative_readings:
  - “복이 있습니다”
  - “행복합니다”
  rationale: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ는 단순 감정 상태가 아니라 축복 선언이므로, 신학적 톤을 약화시키지 않는 표현이 적절합니다.
  doctrine_reference: 축복 선언 어휘 보존
