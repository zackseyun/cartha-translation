  lexicon: Layton (Grammar) on narrative quotative verb usage; Crum s.v. ⲡⲉϫⲉ
  rationale: 토마스복음의 간결한 인용문 구조를 살리되, 현대 한국어 합쇼체에 맞게 과거 서술로 옮겼습니다.
- source_word: ⲡⲉⲧⲉⲣⲉ ⲁⲛⲧⲟϥ ⲣⲣⲙⲙⲁⲟ
  english_pob_choice: Whoever has become rich
  chosen_korean: 누구든지 부자가 된 사람은
  alternatives_korean:
  - 누구든지 부유해진 사람은
  - 누구든지 부자가 된 자는
  lexicon: Crum s.v. ⲣⲣⲙⲙⲁⲟ; Layton (Grammar) on relative perfect
  rationale: 완료적 상대구문을 자연스럽게 풀어 ‘부자가 된 사람’으로 옮겨, 상태 변화의 뉘앙스를 드러냈습니다.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥ ⲣⲣⲣⲟ
  english_pob_choice: let him be king
  chosen_korean: 왕이 되십시오
  alternatives_korean:
  - 왕이 되게 하십시오
  - 다스리게 하십시오
  - 왕이 되십시오
  lexicon: Crum s.v. ⲣⲣⲣⲟ; Layton (Grammar) on jussive ⲙⲁⲣⲉ-
  rationale: 직역의 ‘왕이 되라’보다 한국어 명령형 ‘왕이 되십시오’가 원문의 단호한 권고/촉구를 더 직접적으로 전달합니다.
- source_word: ⲡⲉⲧⲉⲣⲉ ⲟⲩⲛⲧⲁ ⲛⲧⲟϥ ⲛⲟⲩⲇⲩⲛⲁⲙⲓⲥ
  english_pob_choice: whoever has power
  chosen_korean: 누구든지 권세를 가진 사람은
  alternatives_korean:
  - 누구든지 힘을 가진 사람은
  - 누구든지 능력을 가진 사람은
  - 누구든지 권세를 가진 사람은
  lexicon: Crum s.v. ⲇⲩⲛⲁⲙⲓⲥ; Layton (Grammar) on possession construction
  rationale: ⲇⲩⲛⲁⲙⲓⲥ는 문맥상 일반적 ‘힘’보다 지배력/권한의 뉘앙스를 지니므로 ‘권세’로 옮겨 병렬성을 살렸습니다.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥ ⲁⲣⲛⲁ
  english_pob_choice: let him renounce it
  chosen_korean: 그것을 버리십시오
  alternatives_korean:
  - 그것을 부인하십시오
  - 그것을 포기하십시오
  - 그것을 버리십시오
  lexicon: Crum s.v. ⲁⲣⲛⲁ
  rationale: ⲁⲣⲛⲁ의 ‘부인/포기/버림’ 가운데, 앞선 ‘권세’를 대상으로 한 문맥상 ‘버리다’가 가장 직관적으로 소유와 집착의 단절을 드러냅니다.
theological_decisions:
