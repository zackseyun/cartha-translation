base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/081.yaml
  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
  footnotes:
  - marker: a
    text: ⲣⲣⲣⲟ can be rendered "reign" or "rule"; "be king" reflects the verbal nuance tied to ⲣⲟ (king) and preserves Thomas’s stark phrasing.
    reason: lexical_alternative
  - marker: b
    text: ⲇⲩⲛⲁⲙⲓⲥ (Greek loan) may also mean "might" or "ability," and in some contexts "miraculous power." "Power" is kept here for broadness and parallelism.
    reason: lexical_alternative
  - marker: c
    text: The object of ⲁⲣⲛⲁ is implicit in Coptic; supplying "it" (i.e., the power) clarifies the sense without altering the structure.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다[a]. 「누구든지 부자가 된 사람은 왕이 되십시오. 그리고 누구든지 권세[b]를 가진 사람은 그것을 버리십시오[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲣⲣⲣⲟ는 “통치하다/다스리다”로도 옮길 수 있으나, 여기서는 ⲣⲟ(왕)와 연결된 동사적 뉘앙스를 살려 “왕이 되다”로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲇⲩⲛⲁⲙⲓⲥ는 “힘”이나 “능력”으로도 옮길 수 있지만, 여기서는 소유와 지배의 뉘앙스를 살려 “권세”를 택했습니다.
    reason: lexical_alternative
  - marker: c
    text: Coptic 본문은 버릴 대상이 암시되어 있으므로, 바로 앞의 “권세”를 가리킨다는 점을 한국어에서 분명히 했습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲉϫⲉ ⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
