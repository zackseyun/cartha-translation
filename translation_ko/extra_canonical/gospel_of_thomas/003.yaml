base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/003.yaml
  text: Jesus says[a], "If those who lead you say to you, 'Look, the kingdom is in the sky,' then the birds of the sky will precede you. If they say to you, 'It is in the sea,' then the fish will precede you. Rather, the kingdom is inside you and it is outside you. When you come to know yourselves, then you will be known, and you will realize that you are the children of the living Father. But if you do not know yourselves[b], you are in poverty[i][h][g][f][e][d][c], and you are poverty."
  footnotes:
  - marker: a
    text: '''Those who lead you'': Coptic ⲥⲱⲕ means ''draw/lead''; it need not imply ''astray''. Some versions supply ''astray'', which is not explicit here.'
    reason: lexical_alternative
  - marker: b
    text: '''Sky'' translates ⲡⲉ; ''heaven'' is an alternative. The phrase ''birds of the sky'' signals a concrete image rather than a technical term.'
    reason: lexical_alternative
  - marker: c
    text: '''You will be known'' renders an impersonal 3rd plural (''they will know you''), a common Sahidic way to express a passive without naming an agent.'
    reason: dialect_note
  - marker: d
    text: Coptic has the singular 'the child (ⲡϣⲏⲣⲉ) of the living Father' addressed to a plural 'you'. The Greek fragment is often reconstructed with 'sons' (plural). This draft preserves the Coptic singular.
    reason: textual_variant
  - marker: e
    text: Where some reconstruct the Greek as 'the kingdom of God is within you…', the Coptic simply reads 'the kingdom'. No 'of God' appears in the Coptic text.
    reason: textual_variant
  - marker: f
    text: POxy 654 is commonly restored with an additional line, 'Whoever knows himself will find it,' which is not present in the Coptic manuscript here.
    reason: textual_variant
  - marker: g
    text: All second-person forms in this saying are plural (addressed to 'you' plural), which English does not mark.
    reason: dialect_note
  - marker: h
    text: Or 'the child'.
    reason: previous_rendering
  - marker: i
    text: Or "If they say, 'It is in the sea,'".
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “만일 너희를 이끄는 자들이 너희에게 ‘보라, 나라가 하늘에 있다’라고 말하면, 하늘의 새들이 너희보다 먼저 갈 것입니다. 또 그들이 너희에게 ‘그것은 바다에 있다’라고 말하면, 바다의 물고기들이 너희보다 먼저 갈 것입니다. 그러나 나라는 너희 안에 있고 너희 밖에 있습니다. 너희가 너희 자신을 알게 되면, 그때 너희는 알려질 것이며, 너희가 살아 계신 아버지의 자녀들이라는 것을 깨닫게 될 것입니다. 그러나 너희가 너희 자신을 알지 못하면, 너희는 가난한 상태에 있으며, 너희는 가난입니다.”[a][b][c][d][e][f]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘’은 여기서 새의 이미지와 연결되는 구체적 공간 표현입니다. ‘천국’으로 옮기면 후대 기독교 용어가 강해질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 사본은 복수형 ‘자녀들/아들들’에 해당하는 형태를 지지하므로, 단수 ‘자녀’보다 복수로 옮겼습니다.
    reason: textual_variant
  - marker: c
    text: ‘알려질 것입니다’는 행위자를 밝히지 않는 3인칭 복수 관용을 피동적으로 옮긴 것입니다.
    reason: source_note
  - marker: d
    text: 본문에는 ‘그들이 너희에게’라는 반복이 두 조건문 모두에 있습니다.
    reason: source_note
  - marker: e
    text: ‘나라’는 여기서 장소라기보다 통치/실재의 영역을 함께 아우르는 표현입니다.
    reason: korean_style_note
  - marker: f
    text: ‘가난입니다’는 원문의 강한 동일시를 살리기 위한 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ⲥⲱⲕ ϩⲏⲧⲛⲧⲱⲧⲛ
  english_pob_choice: lead you
  chosen_korean: 너희를 이끄는
  alternatives_korean:
  - 너희를 끄는
  - 너희를 인도하는
  - 너희를 미혹하는
  lexicon: Crum; Layton
  rationale: ⲥⲱⲕ은 ‘끌다/이끌다’의 넓은 뜻이므로, 본문이 명시하지 않은 ‘미혹’은 넣지 않고 중립적인 ‘이끄는’으로 옮겼습니다.
- source_word: ⲡⲉ
  english_pob_choice: sky
  chosen_korean: 하늘
  alternatives_korean:
  - 공중
  - 천공
  lexicon: Crum; Layton
  rationale: 새가 나는 구체적 이미지와의 병행을 살려 ‘하늘’로 옮겼고, 여기서는 종말론적 ‘천국’보다 공간적 ‘하늘’이 더 직접적입니다.
- source_word: ⲙⲛⲧⲣⲣⲟ
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 통치
  - 왕국
  lexicon: Crum; Layton
  rationale: Thomas 전승에서 추상적 실재를 가리키는 표현이므로, POB의 ‘kingdom’에 대응하는 한국어로는 공간과 통치를 함께 아우르는 ‘나라’를 택했습니다.
- source_word: ⲛⲡⲉⲧⲛϩⲟⲩⲛ / ⲛⲡⲉⲧⲛⲃⲟⲗ
  english_pob_choice: inside you / outside you
  chosen_korean: 너희 안에 / 너희 밖에
  alternatives_korean:
  - 너희 속에 / 너희 밖에
  - 너희 안쪽에 / 너희 바깥에
  lexicon: Crum
  rationale: 공간적 대비를 살리기 위해 직역에 가깝게 ‘안에/밖에’로 두었고, 교회적 관용구인 ‘within’보다 덜 신학화된 표현을 유지했습니다.
- source_word: ⲛ̄ϣⲏⲣⲉ
  english_pob_choice: children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아이들
  - 아들들
  - 자식들
  lexicon: Crum; applied revision
  rationale: 사본의 복수형을 반영해 단수 ‘자녀’가 아니라 복수 ‘자녀들’로 옮겼습니다. 한국어에서는 성별을 덜 고정시키는 ‘자녀들’이 가장 적절합니다.
- source_word: ⲙ̄ⲡⲉⲓⲱⲧ ⲉⲧⲟⲛϩ
  english_pob_choice: the living Father
  chosen_korean: 살아 계신 아버지
  alternatives_korean:
  - 살아 계신 아버지께서
  - 생명하신 아버지
  lexicon: Crum
  rationale: 관용적인 수식구이므로 ‘살아 계신 아버지’로 자연스럽게 옮겼습니다.
- source_word: ⲙⲛⲧϩⲏⲕⲉ
  english_pob_choice: poverty
  chosen_korean: 가난
  alternatives_korean:
  - 빈곤
  - 가난한 상태
  - 궁핍
  lexicon: Crum
  rationale: 명사형 상태를 가리키지만, 한국어에서는 서술명사 ‘가난’이 가장 간결하게 원문의 역설을 살립니다.
theological_decisions:
- issue: ‘The kingdom is inside you and outside you’의 공간성
  chosen_reading: 하나님 나라를 내면의 영적 상태로만 환원하지 않고, ‘너희 안에’와 ‘너희 밖에’의 병렬된 공간적 긴장을 그대로 보존했습니다.
  alternative_readings:
  - ‘너희 마음속에’
  - ‘너희 가운데에’
  - ‘너희 안팎에’
  rationale: Coptic은 안/밖의 물리적 대비를 직접 세우므로, 이를 심리화하거나 공동체화하여 좁히지 않는 것이 본문 의미를 더 잘 보존합니다.
  doctrine_reference: 문자적 이미지와 신학적 함축의 긴장 보존
- issue: ‘you will be known’의 수동적 의미
  chosen_reading: 주체를 명시하지 않는 피동 표현으로 ‘알려질 것입니다’라고 옮겼습니다.
  alternative_readings:
  - ‘그들이 너희를 알게 될 것입니다’
  - ‘너희가 인정을 받을 것입니다’
  rationale: 사본의 3인칭 복수 관용은 행위자를 밝히지 않는 피동적 의미를 띨 수 있으므로, 한국어에서도 익명성을 유지하는 것이 적절합니다.
  doctrine_reference: 사히드 콥트어의 무인칭/피동 관용
