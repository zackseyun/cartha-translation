revisions:
- from: 예수께서 말씀하셨습니다. 「네 형제의 눈 속에 있는 티는 네가 보지만, 네 눈 속에 있는 들보는 네가 보지 못합니다. 네 눈에서 들보를 빼낸 뒤에는, 네 형제의 눈 속에 있는 티를 빼낼 수 있도록 분명히 보게 될 것입니다」.[a][b][c][d][e]
  to: 예수께서 말씀하셨습니다. “당신의 형제의 눈에 있는 티[c]는 당신이 보지만, 당신의 눈에 있는 들보[d]는 보지 못합니다. 당신의 눈에서 그 들보를 빼낸 뒤에야[b] 당신의 형제[e]의 눈에 있는 티를 빼낼 수 있도록 분명히[a] 보게 될 것입니다.”
  rationale: 의미를 바꾸지 않고 원문의 순차성(‘그때에야’)을 보완했으며, 한국어 직접 인용문 문장부호를 바로잡고 모든 주석 표지를 해당 낱말에 연결했습니다. 영어 POB의 어휘 선택과 주석 취지도 유지하되, 한국어 주석 표현을 자연스럽게 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:22Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 순서는 사히드 콥트어 원문에 충실합니다. ⲡϫⲏ/ⲡⲥⲟⲓ의 작은 것과 구조용 들보의 대비, ⲛⲟⲩϫⲉ의 ‘빼내다’, 그리고 ⲛⲁⲩ ⲉⲃⲟⲗ의 분명한 시야라는 의미가 보존되었습니다. 다만 ⲧⲟⲧⲉ(‘그때에야/그때’)의 결과적 전환을 ‘그때에야’로 드러내는 편이 더 정확합니다.
  naturalness: 본문은 대체로 자연스럽지만, 직접 인용문을 닫은 뒤 마침표를 찍고 모든 주석 표지를 한꺼번에 붙인 방식(」.[a]...)은 한국어 문장부호 및 주석 앵커 관행에 맞지 않습니다. 표지는 해당 어휘나 관용구 바로 뒤에 배치하고 마침표는 인용문 안에 둡니다. ‘눈 속’보다 ‘눈에 있는’이 이 비유에서 더 자연스럽습니다.
  terminology: ‘티’, ‘들보’, ‘형제’, ‘빼내다’는 한국어 성서 문체와 원문의 의미 대비에 적절합니다. ‘티’는 원문의 나무 조각이라는 구체성을 약화할 수 있으나 한국어 관용상 자연스러우며, 주석에서 대안을 밝혀 충분히 보완할 수 있습니다. ‘형제’를 ‘형제자매’로 확장하지 않아 원문의 어휘 범위를 보존했습니다.
