base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/026.yaml
  text: Jesus said, “The splinter that is in your brother’s eye, you see it; but the beam that is in your own eye, you do not see it. When you take the beam out of your own eye, then you will see clearly to take the splinter out of your brother’s eye.”
  footnotes:
  - marker: a
    text: “See clearly” renders the idiom ⲛⲁⲩ ⲉⲃⲟⲗ, literally “see out.”
    reason: dialect_note
  - marker: b
    text: The verb ⲛⲟⲩϫⲉ can mean “cast out/expel”; here “take out/remove” fits the eye-removal context.
    reason: lexical_alternative
  - marker: c
    text: “Splinter” could also be translated “speck.”
    reason: lexical_alternative
  - marker: d
    text: “Beam” could be rendered “log,” but ⲥⲟⲓ specifically denotes a structural beam.
    reason: lexical_alternative
  - marker: e
    text: “Brother” translates ⲥⲟⲛ; in context it can be understood inclusively as a fellow disciple.
    reason: cultural_note
  - marker: f
    text: POxy 1 preserves “…and then you will see in order to cast out the splinter which is in the eye of your brother,” aligning with the Coptic’s final clause.
    reason: cross_reference
  - marker: g
    text: Cf. Matthew 7:3–5; Luke 6:41–42 for canonical parallels.
    reason: cross_reference
  - marker: h
    text: Or 'The splinter that is in your brother’s eye—you see; but the beam that is in your own eye—you do not see.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “당신의 형제의 눈에 있는 티[c]는 당신이 보지만, 당신의 눈에 있는 들보[d]는 보지 못합니다. 당신의 눈에서 그 들보를 빼낸 뒤에야[b] 당신의 형제[e]의 눈에 있는 티를 빼낼 수 있도록 분명히[a] 보게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲛⲁⲩ ⲉⲃⲟⲗ은 문자적으로 ‘밖을 보다’에 가깝지만, 여기서는 시야가 트여 ‘분명히 보다’ 또는 ‘잘 보다’라는 관용적 의미입니다.
    reason: source_note
  - marker: b
    text: ⲛⲟⲩϫⲉ는 ‘내던지다’나 ‘쫓아내다’도 뜻할 수 있으나, 눈에서 이물질을 없애는 이 문맥에서는 ‘빼내다’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲡϫⲏ는 작은 나무 조각을 가리킬 수 있으며, ‘티’ 외에 ‘가시’나 ‘조각’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ⲡⲥⲟⲓ는 구조물에 쓰이는 보를 뜻합니다. ‘들보’ 외에 ‘보’ 또는 ‘통나무’로 옮길 수 있으나, ‘들보’가 작은 티와의 크기 대비를 잘 살립니다.
    reason: lexical_alternative
  - marker: e
    text: ⲥⲟⲛ은 문자적으로 ‘형제’입니다. 문맥에서는 공동체의 동료를 가리킬 수도 있으나, 본문은 원문의 친족 표현을 따라 ‘형제’로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡϫⲏ
  english_pob_choice: splinter
  chosen_korean: 티
  alternatives_korean:
  - 쐐기
  - 가시
  - 조각
  lexicon: Crum, s.v. ϫⲏ
  rationale: 영어 POB의 ‘splinter’는 작은 이물질을 가리키지만, 한국어에서는 눈에 들어간 매우 작은 것의 자연스러운 표현으로 ‘티’가 가장 간결하고 관용적입니다. 나무 조각의 이미지는 유지하되 과도하게 구체화하지 않았습니다.
- source_word: ⲡⲥⲟⲓ
  english_pob_choice: beam
  chosen_korean: 들보
  alternatives_korean:
  - 보
  - 통나무
  - 대들보
  lexicon: Crum, s.v. ⲥⲟⲓ
  rationale: ⲥⲟⲓ는 구조용 beam을 뜻하므로 ‘들보’가 한국어에서 가장 직접적입니다. ‘통나무’는 재료 쪽으로 옮겨가고, ‘대들보’는 다소 과장될 수 있어 피했습니다.
- source_word: ⲛⲟⲩϫⲉ
  english_pob_choice: take out
  chosen_korean: 빼내다
  alternatives_korean:
  - 꺼내다
  - 제거하다
  - 쫓아내다
  lexicon: Crum, s.v. ⲛⲟⲩϫⲉ
  rationale: 눈에서 무언가를 옮기는 문맥에서는 ‘빼내다’가 가장 자연스럽고, 영어 POB의 ‘take out/remove’와도 잘 맞습니다. ‘쫓아내다’는 의미가 너무 강합니다.
- source_word: ⲛⲁⲩ ⲉⲃⲟⲗ
  english_pob_choice: see clearly
  chosen_korean: 분명히 보다
  alternatives_korean:
  - 잘 보다
  - 또렷이 보다
  - 밖을 보다
  lexicon: Layton, Coptic Grammar (ⲉⲃⲟⲗ with perception verbs)
  rationale: 직역하면 ‘밖을 보다’에 가깝지만, 관용적으로는 시야가 트여 분명하게 보게 된다는 뜻입니다. ‘분명히 보다’가 영어 POB의 설명적 번역을 한국어로 가장 자연스럽게 옮깁니다.
- source_word: ⲥⲟⲛ
  english_pob_choice: brother
  chosen_korean: 형제
  alternatives_korean:
  - 형님
  - 동료
  - 친족
  lexicon: Crum, s.v. ⲥⲟⲛ
  rationale: 문자적으로는 ‘brother’이며, 토마스 복음서에서는 제자 공동체의 동료를 가리키는 포괄적 호칭으로 읽을 수 있습니다. 한국어에서는 그 포괄성을 살리면서도 문맥에 맞는 ‘형제’를 유지했습니다.
theological_decisions:
- issue: 말하는 자와 인용부의 구분
  chosen_reading: 예수의 직접 화법을 따옴표로 분명히 표시하고, 서술문은 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - 인용부를 생략한 평서문
  - 보다 성서적 어순을 살린 경직된 직역
  rationale: 이 구절은 경구 형태의 직접 발화이므로, 독자가 말하는 자와 말의 경계를 즉시 파악하도록 했습니다. 토마스 복음서의 간결한 수사를 해치지 않으면서도 현대 한국어로 읽기 쉽게 만들었습니다.
  doctrine_reference: 문체/담화 처리
- issue: ‘형제’의 범위
  chosen_reading: ‘형제’를 유지하되, 공동체적·제자적 관계를 암시하는 표현으로 읽히도록 번역했습니다.
  alternative_readings:
  - 성 중립을 위해 ‘동료’로 옮김
  - 관례적으로 ‘형제자매’로 확장
  rationale: 원문 ⲥⲟⲛ은 문자적으로 남성형이지만, 영어 POB 주석처럼 실제 맥락에서는 동료 제자를 포함할 수 있습니다. 다만 본문 자체의 친족 은유를 보존하기 위해 중성화하지 않았습니다.
  doctrine_reference: 용어 보존/공동체적 호칭
