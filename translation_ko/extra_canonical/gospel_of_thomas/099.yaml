revisions:
- from: 제자들이 그에게 말했습니다. 「당신의 형제들과 어머니께서 밖에 서 계십니다.」 예수께서 그들에게 말씀하셨습니다. 「여기 있는 것들 가운데 내 아버지의 뜻을 행하는 이들이 바로 내 형제요 어머니입니다. 그들이 내 아버지의 나라로 들어갈 사람들입니다.」[a][b][c][d][e][f]
  to: 한 제자가 그에게 말했습니다. 「당신의 형제들과 어머니가 밖에 서 있습니다.[a]」 그가 그들에게 말씀하셨습니다. 「여기 있는 이들[b] 중에서 내 아버지의 뜻[c]을 행하는 이들이 바로 내 형제들과 내 어머니입니다.[f] 바로 그들이 내 아버지의 나라[e]로 들어갈[d] 이들입니다.」
  rationale: 원문 우선 원칙에 따라 단수 주어, 사람을 가리키는 관계 표현, 그리고 미래의 ‘들어갈 이들’이라는 술어를 바로잡았습니다. 이름과 높임말처럼 원문에 명시되지 않은 정보를 최소화했고, 각주 표지를 해당 본문 어구에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 사본의 ⲡⲙⲁⲑⲏⲧⲏⲥ는 단수이므로 ‘제자들이’가 아니라 ‘한 제자가’여야 합니다. 또한 ⲡⲉⲧⲉⲣⲉⲛⲡⲉⲓⲙⲁ는 사람을 가리키는 관계 표현인데, 초안의 ‘여기 있는 것들 가운데’는 부당하게 사물화하고 ‘가운데’도 원문에 없습니다. 마지막 절은 미래에 왕국에 들어갈 자들을 지시하므로 이를 더 직접적으로 반영했습니다. 발화자를 ‘예수’로 명시한 것은 제시된 콥트어의 단순 대명사 ‘그’보다 한 단계 해석을 더하므로 ‘그’로 유지했습니다.
  naturalness: ‘한 제자가 그에게 말했습니다’와 ‘여기 있는 이들 중에서’는 현대 표준 한국어 합쇼체에서 자연스럽습니다. 직접 호칭 ‘당신의’는 문체상 다소 거칠 수 있으나, 원문의 2인칭 소유격을 제목·호칭 추가 없이 보존하므로 유지했습니다. 원문에 없는 인물 높임을 피하여 ‘어머니가 밖에 서 있습니다’로 했습니다.
  terminology: ‘내 아버지의 뜻’, ‘내 형제와 어머니’, ‘내 아버지의 나라’는 원문의 소유격과 핵심 어휘를 충실히 보존합니다. ⲥⲛⲏⲩ의 남성 복수에 맞춰 ‘형제들’을 유지했습니다. ‘나라’는 ⲙⲛⲧⲣⲣⲟ의 통상적이고 자연스러운 대응입니다.
  issues:
  - severity: high
    issue: 발화 주체의 수가 복수로 번역됨
    rationale: 원문 ⲡⲙⲁⲑⲏⲧⲏⲥ는 정관사 단수 명사로 ‘그 제자/한 제자’입니다.
  - severity: high
    issue: ‘여기 있는 것들 가운데’가 관계 표현의 지시 대상을 사물화하고 첨가함
    rationale: ⲡⲉⲧⲉⲣⲉⲛⲡⲉⲓⲙⲁ는 ‘여기 있는 이들’이며, ‘것들’이나 ‘가운데’는 본문에 없습니다.
  - severity: medium
    issue: ‘예수께서’가 원문의 대명사를 특정 이름으로 확정함
    rationale: 제시된 콥트어 본문은 ‘그가 그들에게 말했다’라고만 하므로, 독립 번역에서는 대명사를 유지하는 편이 안전합니다.
  - severity: low
    issue: 각주 표지가 문단 끝에 일괄 배치됨
    rationale: 각주 표지를 해당 어구 뒤에 두면 무엇을 설명하는지 명확해집니다.
