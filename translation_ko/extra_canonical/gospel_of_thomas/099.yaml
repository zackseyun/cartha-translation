base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/099.yaml
  text: The disciples said to him[a], "Your brothers and your mother are standing outside." He said to them, "Those here who do the will of my Father—these are my brothers and my mother[f][e][d][c][b]. They are the ones who will enter the kingdom of my Father."
  footnotes:
  - marker: a
    text: Lit. 'are standing before them, outside' (ⲛⲧⲟⲟⲩⲱϩ ⲉⲣⲁⲧ ⲛⲧⲟⲟⲩ ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ). The prepositional phrase may be redundant with 'outside.'
    reason: dialect_note
  - marker: b
    text: '''Those here'' renders ⲡⲉⲧⲉⲣⲉⲛⲡⲉⲓⲙⲁ, literally ''the ones in this place.'''
    reason: lexical_alternative
  - marker: c
    text: ⲟⲩⲱϣ can mean 'wish/desire' as well as 'will.'
    reason: lexical_alternative
  - marker: d
    text: '''Enter'' translates ⲁⲃⲱⲕ ⲉϩⲟⲩⲛ; ''go in'' is an equally literal option.'
    reason: lexical_alternative
  - marker: e
    text: '''Kingdom'' (ⲙⲛⲧⲣⲣⲟ) is the abstract of ''king'' (ⲣⲣⲟ), literally ''the (thing) of king.'''
    reason: cultural_note
  - marker: f
    text: Compare the family saying in Mark 3:31–35; Matthew 12:46–50; Luke 8:19–21. Thomas uniquely adds 'they will enter the Father’s kingdom.'
    reason: cross_reference
translation:
  language: ko
  text: 한 제자가 그에게 말했습니다. 「당신의 형제들과 어머니가 밖에 서 있습니다.[a]」 그가 그들에게 말씀하셨습니다. 「여기 있는 이들[b] 중에서 내 아버지의 뜻[c]을 행하는 이들이 바로 내 형제들과 내 어머니입니다.[f] 바로 그들이 내 아버지의 나라[e]로 들어갈[d] 이들입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 문자적으로 ‘그들 앞에, 밖에 서 있다’라고도 읽힐 수 있는 중복적 위치 표현을 포함합니다. ‘밖에’라는 표현과 겹칠 가능성이 있습니다.
    reason: source_note
  - marker: b
    text: ‘여기 있는 이들’은 ⲡⲉⲧⲉⲣⲉⲛⲡⲉⲓⲙⲁ, 곧 문자적으로 ‘이곳에 있는 이들’을 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ⲟⲩⲱϣ는 ‘뜻’ 외에 ‘원함, 소원’도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ⲁⲃⲱⲕ ⲉϩⲟⲩⲛ은 문자적으로 ‘안으로 가다’이며, 여기서는 ‘들어가다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: e
    text: ⲙⲛⲧⲣⲣⲟ는 ‘왕’에서 파생된 추상명사로, ‘왕국’ 또는 ‘왕권’으로도 옮길 수 있습니다.
    reason: cultural_note
  - marker: f
    text: 이 가족 관련 발언은 마가복음 3:31–35, 마태복음 12:46–50, 누가복음 8:19–21과 비교할 수 있습니다. 토마스복음은 ‘아버지의 나라로 들어감’을 덧붙입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲥⲛⲏⲩ
  english_pob_choice: brothers
  chosen_korean: 형제들
  alternatives_korean:
  - 형제자매들
  - 동생들
  lexicon: Crum, s.v. ⲥⲛⲏⲩ
  rationale: 사히드어에서 기본적으로 남성 형제를 가리키는 용법을 살려, POB의 'brothers'에 맞춰 ‘형제들’로 옮겼습니다.
- source_word: ⲥⲉⲁϩⲉⲣⲁⲧⲟⲩ ϩⲓⲡⲥⲁ ⲛⲃⲟⲗ
  english_pob_choice: are standing outside
  chosen_korean: 밖에 서 계십니다
  alternatives_korean:
  - 밖에 서 있습니다
  - 밖에 서 서 계십니다
  lexicon: Crum, s.v. ⲟⲩϩ/ⲧⲟⲟⲩⲱϩ; Layton, Grammar §91
  rationale: 현재의 서 있는 상태를 자연스럽게 살리면서, 대화 장면의 인물을 높여 ‘서 계십니다’로 옮겼습니다.
- source_word: ⲉⲧⲉⲣⲉⲉⲓⲣⲉ ⲛⲡⲟⲩⲱϣ
  english_pob_choice: do the will
  chosen_korean: 뜻을 행하는
  alternatives_korean:
  - 원하심을 행하는
  - 원하시는 바를 하는
  lexicon: Crum, s.v. ⲟⲩⲱϣ; Lambdin, Intro to Sahidic §173
  rationale: ⲟⲩⲱϣ의 범위는 ‘원함/뜻’이지만, 이 문맥에서는 하나님의 뜻이라는 신학적 표현이 가장 직접적으로 대응합니다.
- source_word: ⲙⲛⲧⲣⲣⲟ
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 왕권
  lexicon: Layton, Lexicon s.v. ⲣⲣⲟ; Crum, s.v. ⲣⲣⲟ
  rationale: POB의 'kingdom'을 한국어에서 가장 자연스럽고 문맥상 널리 이해되는 ‘나라’로 옮기되, 왕의 통치 영역이라는 의미를 유지했습니다.
theological_decisions:
- issue: ‘아버지의 나라’의 번역
  chosen_reading: ‘내 아버지의 나라’로 직역해, 소유격과 부자 관계를 모두 드러냈습니다.
  alternative_readings:
  - ‘아버지의 왕국’
  - ‘아버지의 다스림’
  rationale: 본문은 단순한 장소명보다 아버지와의 관계 속에 있는 통치 영역을 가리키므로, 원문 구조를 살려 직역하는 편이 더 안전합니다.
  doctrine_reference: 공관복음의 하나님의 나라/하늘 나라 표현과 비교되는 종말론적 통치 개념
