base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/090.yaml
  text: Jesus said[a], “Come to me; for my yoke is good, and my lordship is gentle[c][b]; and you will find rest for yourselves.”
  footnotes:
  - marker: a
    text: The word is ⲭⲣⲏⲥⲧⲟⲥ (from Greek χρηστός, “good/pleasant/kind”), not ⲭⲣⲓⲥⲧⲟⲥ (“Christ”). Hence “good,” not a title.
    reason: lexical_alternative
  - marker: b
    text: Rest renders the Greek loan ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (ἀνάπαυσις). The codex shows minor orthographic uncertainty in the upsilon, but the reading is secure.
    reason: lacuna_or_restoration
  - marker: c
    text: 'Compare Matthew 11:28–30, but note Thomas’s different phrasing: “my lordship is gentle,” and “for yourselves” rather than “for your souls.”'
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “내게로 오십시오. 내 멍에는 좋고, 내 다스림은 부드럽습니다. 그리고 여러분은 여러분 자신을 위한 안식을 얻게 될 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲭⲣⲏⲥⲧⲟⲥ는 ‘그리스도’(ⲭⲣⲓⲥⲧⲟⲥ)가 아니라 ‘좋은, 유익한, 온화한’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안식’은 그리스어 차용어 ⲁⲛⲁⲡⲁⲩⲥⲓⲥ(ἀνάπαυσις)를 옮긴 것입니다. 사본에는 이 단어의 upsilon 철자에 작은 불확실성이 있으나, 낱말의 판독은 확실합니다.
    reason: lacuna_or_restoration
  - marker: c
    text: 마태복음 11:28–30과 비교할 수 있습니다. 그러나 토마스 복음은 ‘내 다스림은 부드럽습니다’라고 하며, ‘너희 영혼을 위하여’가 아니라 ‘여러분 자신을 위하여’라고 표현합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲓⲛⲧⲱⲧⲛ ϣⲁⲁⲛⲟⲕ
  english_pob_choice: Come to me
  chosen_korean: 내게로 오십시오
  alternatives_korean:
  - 내게 오십시오
  - 내게로 오세요
  - 저에게로 오십시오
  lexicon: Layton, Coptic Grammar; Lambdin, Introduction to Sahidic Coptic
  rationale: 2인칭 복수 명령의 초청을 한국어에서는 자연스럽고 공손한 초청 표현으로 옮기되, 목적지인 ‘to me’를 살려 ‘내게로’로 표시했습니다.
- source_word: ⲟⲩⲭⲣⲏⲥⲧⲟⲥ
  english_pob_choice: good
  chosen_korean: 좋고
  alternatives_korean:
  - 선하고
  - 친절하고
  - 유익하고
  lexicon: Crum, Coptic Dictionary (loanword χρῆστος in Coptic usage)
  rationale: 그리스도(χριστός)가 아니라 χρηστός 계열의 ‘좋은/유익한/온화한’ 의미이므로, 문맥상 가장 직접적인 ‘좋다’로 옮겼습니다.
- source_word: ⲙⲛⲧϫⲟⲉⲓⲥ
  english_pob_choice: lordship
  chosen_korean: 주권
  alternatives_korean:
  - 통치
  - 지배
  - 주되심
  lexicon: Crum, Coptic Dictionary
  rationale: 주인 됨의 추상명사로서 사회적·권위적 뉘앙스를 살리기 위해 ‘주권’을 택했습니다. ‘주되심’보다 권세의 성격이 더 분명합니다.
- source_word: ⲟⲩⲣⲙⲣⲁϣ
  english_pob_choice: gentle
  chosen_korean: 온유합니다
  alternatives_korean:
  - 부드럽습니다
  - 다정합니다
  - 유순합니다
  lexicon: Crum, Coptic Dictionary
  rationale: 규범적 성품을 나타내는 형용사로, 한국어 성서 문맥에서 ‘온유하다’가 ‘gentle’의 품질과 가장 잘 대응합니다.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  english_pob_choice: rest
  chosen_korean: 안식
  alternatives_korean:
  - 쉼
  - 휴식
  - 평안
  lexicon: Crum, Coptic Dictionary (Greek loanword ἀνάπαυσις)
  rationale: 그리스어 차용어의 의미를 한국어 성서어법으로 자연스럽게 살리기 위해 ‘안식’을 사용했습니다. 단순 휴식보다 종말론적·영적 뉘앙스를 담기 쉽습니다.
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  english_pob_choice: for yourselves
  chosen_korean: 여러분 자신에게
  alternatives_korean:
  - 여러분을 위해
  - 여러분 스스로에게
  - 자기 자신에게
  lexicon: Lambdin, Introduction to Sahidic Coptic
  rationale: 수혜의 여격 의미를 한국어에서 분명히 드러내기 위해 ‘~에게’ 구조로 옮겼고, 복수 지시를 살려 ‘여러분 자신에게’로 표현했습니다.
theological_decisions:
- issue: ⲙⲛⲧϫⲟⲉⲓⲥ의 의미를 ‘lordship’으로 유지할지, 더 익숙한 종교어로 완화할지
  chosen_reading: ‘주권’으로 옮겨 예수의 권위가 단순한 호칭이 아니라 통치적 성격을 지닌다는 점을 드러냈습니다.
  alternative_readings:
  - ‘주님 되심’
  - ‘주되심’
  - ‘통치’
  rationale: 본문은 단순한 호칭보다 예수의 권위/통치 상태를 말하므로, 그 긴장을 약화하지 않기 위해 권위적 추상명사를 선택했습니다.
  doctrine_reference: Christology; authority language in wisdom/parable sayings
- issue: ‘for yourselves’를 ‘안식’의 대상 안에 포함할지, 별도로 표시할지
  chosen_reading: ‘여러분 자신에게 안식을 찾게 될 것입니다’로 옮겨, 안식이 단지 외부적 휴식이 아니라 수혜자 자신에게 실제로 주어지는 결과임을 보존했습니다.
  alternative_readings:
  - ‘여러분은 안식을 얻게 될 것입니다’
  - ‘여러분의 영혼에 안식을 얻게 될 것입니다’
  rationale: 토마스 복음은 마태복음의 ‘영혼’ 표현이 아니라 ‘여러분 자신’을 쓰므로, 본문의 차이를 지우지 않도록 반영했습니다.
  doctrine_reference: Source distinction from Matthew 11:28–30; anthropology wording
