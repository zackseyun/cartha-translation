base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/001.yaml
  text: And he said[3][2][1], "Whoever finds the interpretation(1) of these sayings(2) will not taste death(3)."
  footnotes:
  - marker: '1'
    text: Or “explanation.” We retain “interpretation” to reflect the technical hermeneutical sense of Coptic ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ (Greek ἑρμηνεία).
    reason: lexical_alternative
  - marker: '2'
    text: Manuscript exhibits a Lycopolitan-style plural demonstrative (ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ, “these sayings”), while the normalized lemmatization reads singular (ⲛⲡⲉⲓϣⲁϫⲉ). The Greek fragment (POxy 654) also favors the plural.
    reason: dialect_note
  - marker: '3'
    text: “Taste death” is a conventional idiom meaning “experience death” (cf. Crum s.v. ϫⲓϯ).
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그가 말했습니다. “이 말씀들의 해석을 찾는 사람은 죽음을 맛보지 않을 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 기술적 의미의 ἑρμηνεία 계열을 반영하므로, 여기서는 ‘해석’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 사본의 복수 지시형을 따라 ‘이 말씀들’로 옮겼습니다.
    reason: source_note
  - marker: c
    text: ‘죽음을 맛보다’는 ‘죽음을 경험하다’라는 관용적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  english_pob_choice: interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 풀이
  - 설명
  - 의미
  lexicon: Crum; Greek loanword ἑρμηνεία
  rationale: 기술적인 해석 행위를 가리키므로, 문맥에 맞는 ‘해석’으로 옮겨 원문의 해석학적 뉘앙스를 살렸습니다.
- source_word: ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ / ⲛⲡⲉⲓϣⲁϫⲉ
  english_pob_choice: these sayings
  chosen_korean: 이 말씀들
  alternatives_korean:
  - 이 말씀
  - 이 말들
  - 이 진술들
  lexicon: Coptic demonstrative usage; POB textual note
  rationale: 사본의 복수 지시형과 POB의 복수 판단을 따라 복수로 옮겼습니다. ‘말씀들’은 간결하면서도 격식을 유지합니다.
- source_word: ϫⲓϯ ⲛ ⲡⲙⲟⲩ
  english_pob_choice: taste death
  chosen_korean: 죽음을 맛보지 않을 것입니다
  alternatives_korean:
  - 죽음을 경험하지 않을 것입니다
  - 죽음을 겪지 않을 것입니다
  lexicon: Crum; idiomatic Coptic usage
  rationale: 직역적 이미지인 ‘맛보다’를 유지해 원문의 강한 관용구를 살렸습니다. 부정과 함께 자연스러운 한국어 어순으로 정리했습니다.
- source_word: ⲛⲧⲟϥ
  english_pob_choice: that one (understood generically by 'whoever')
  chosen_korean: 사람은
  alternatives_korean:
  - 그는
  - 그 사람은
  - 그 자는
  lexicon: Layton (pronouns)
  rationale: 일반적 관계절의 지시를 한국어에서는 성별화된 대명사 대신 일반 명사구로 풀어, 보편적 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: ‘해석’과 ‘죽음을 맛보지 않음’의 인식론적·종말론적 긴장
  chosen_reading: 말씀의 뜻을 참으로 파악하는 것이 죽음의 지배를 넘어서는 생명 참여와 연결된다는 단정적 진술로 읽었습니다.
  alternative_readings:
  - 단순히 죽음을 겪지 않는 물리적 약속
  - 지식 획득에 대한 상징적 과장
  rationale: 토마스복음 특유의 격언적·선언적 형식을 따라, 과도한 완화 없이 원문의 강한 상징을 유지했습니다.
  doctrine_reference: Gospel of Thomas saying form; idiomatic and sapiential register
