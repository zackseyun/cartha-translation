base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/075.yaml
  text: Jesus said[a], “Many are standing at the door[e][d][c][b], but it is the solitary ones who will enter into the place of the bridal chamber.”
  footnotes:
  - marker: a
    text: The Coptic idiom is literally ‘standing on their feet’; rendered simply ‘standing’ in English.
    reason: dialect_note
  - marker: b
    text: ⲙⲟⲛⲁⲭⲟⲥ (Greek μονάχος) can mean ‘solitary’ or later ‘monk.’ In Thomas the emphasis falls on singleness/wholeness (‘single one’), hence ‘solitary one’ here.
    reason: lexical_alternative
  - marker: c
    text: The text reads ‘the place of the bridal chamber’ (ⲡⲙⲁ ⲛϣⲉⲗⲉⲉⲧ), not simply ‘the bridal chamber’; retained to reflect the Coptic construction.
    reason: lexical_alternative
  - marker: d
    text: MS has ϩⲓⲣⲙ̄ⲡⲣⲟ vs normalized ϩⲓⲣⲛⲡⲣⲟ; and printed ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ ⲛⲉⲧⲛⲁⲃⲱⲕ vs normalized ⲡⲙⲟⲛⲁⲭⲟⲥ ⲡⲉⲧⲉⲣⲉⲛⲁⲃⲱⲕ, emphasizing a singular subject.
    reason: textual_variant
  - marker: e
    text: Or 'the solitary one is the one who will enter'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “많은 이들이 문 앞에 서 있지만, 혼자된 이들만이 신방의 자리로 들어갈 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 관용구는 문자적으로는 ‘발로 서 있는’ 느낌이지만, 한국어에서는 자연스럽게 ‘서 있다’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ⲙⲟⲛⲁⲭⲟⲥ는 ‘수도승’도 가능하지만, 여기서는 토마스의 주제어인 ‘단일성/홀로 됨’을 살린 ‘혼자된 이들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 본문은 단순한 ‘신방’이 아니라 ‘신방의 자리’라는 구조를 갖고 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 사본은 복수 형태를 보이며, 문장은 ‘혼자된 이들’이라는 복수 주어를 가리키는 구조로 읽힙니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲟⲩⲛϩⲁϩ / ⲱϩⲉⲣⲁⲧ ⲛⲧⲟⲟⲩ
  english_pob_choice: Many are standing
  chosen_korean: 많은 이들이 문 앞에 서 있지만
  alternatives_korean:
  - 많은 이들이 문 앞에 서 있습니다
  - 많은 이들이 서 있습니다
  lexicon: Crum, s.v. ⲟⲩⲛ-/ⲟⲩⲛϩⲁϩ; Crum, s.v. ⲱϩⲉⲣ ‘stand’
  rationale: 콥트어 관용구를 자연스러운 한국어 현재진행형으로 옮기되, 존재·상태 강조를 살려 ‘많은 이들’과 ‘서 있지만’을 결합했습니다.
- source_word: ⲡⲙⲟⲛⲁⲭⲟⲥ
  english_pob_choice: the solitary ones
  chosen_korean: 혼자된 이들
  alternatives_korean:
  - 고독한 이들
  - 홀로 된 이들
  - 수도승들
  lexicon: Crum, s.v. ⲙⲟⲛⲁⲭⲟⲥ; Greek μονάχος
  rationale: 본문의 핵심 대비는 제도적 ‘수도승’이 아니라 단일성/홀로 됨이므로, 그 의미를 살려 ‘혼자된 이들’로 옮겼습니다.
- source_word: ⲡⲙⲁ ⲛϣⲉⲗⲉⲉⲧ
  english_pob_choice: the place of the bridal chamber
  chosen_korean: 신방의 자리
  alternatives_korean:
  - 혼인방의 자리
  - 신방
  - 혼인 신방의 자리
  lexicon: Crum, s.v. ⲙⲁ ‘place’; Crum, s.v. ϣⲉⲗⲉⲉⲧ ‘bride-chamber’
  rationale: Coptic의 ‘place of’ 구조를 반영하려면 단순히 ‘신방’만으로는 부족하므로, ‘신방의 자리’로 구체적 공간성을 살렸습니다.
- source_word: ⲉϩⲟⲩⲛ ⲉ
  english_pob_choice: enter into
  chosen_korean: 들어갈 것입니다
  alternatives_korean:
  - 들어갈 것입니다
  - 들어갈 것입니다 안으로
  lexicon: Crum, s.v. ⲉϩⲟⲩⲛ ‘go in, enter’
  rationale: ‘enter into’의 의미를 한국어 미래형으로 간결하게 옮겨, 문장 흐름을 유지했습니다.
theological_decisions:
- issue: 혼자됨/단일성의 강조
  chosen_reading: ‘혼자된 이들’은 단순한 외로움이 아니라, 본문이 대조하는 분열되지 않은 단일성·온전함을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - ‘고독한 이들’
  - ‘수도승들’
  rationale: 토마스 복음서의 문맥에서 핵심은 제도적 수도생활보다 존재의 단일성에 있으므로, 이를 드러내는 번역을 택했습니다.
  doctrine_reference: Gospel of Thomas thematic reading; lexical note from EN POB
