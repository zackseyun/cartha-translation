base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/102.yaml
  text: 'Jesus said[d][c][b][a], “Woe to the Pharisees! For they are like a dog lying on the manger of the cattle: it neither eats nor lets the cattle eat.”'
  footnotes:
  - marker: a
    text: “Manger” renders ⲡⲟⲩⲟⲙϥ, often glossed as “feeding-trough.” Either fits the image.
    reason: lexical_alternative
  - marker: b
    text: ⲉϩⲉ denotes domestic animals/cattle. Many translations choose “oxen,” but the Coptic is generic; hence “cattle.”
    reason: cultural_note
  - marker: c
    text: The codex line has damaged letters that can resemble ⲛⲛⲉϩⲟⲟⲩ (“days”), but Dilley’s normalization reads ⲛϩⲉⲛⲉϩⲉ (“of the cattle”), confirmed by the following ⲛⲡⲉϩⲉ (“the cattle”).
    reason: lacuna_or_restoration
  - marker: d
    text: 'ⲕⲱ with an infinitive has the sense “to allow/let”; with negation here: “it does not let the cattle eat.”'
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「화가 나 있습니다, 바리새인들에게! 그들은 가축의 먹이통 위에 누워 있는 개와 같습니다. 그것은 먹지도 않고, 또 가축이 먹는 것도 허락하지 않습니다.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲟⲩⲟⲙϥ는 ‘구유’ 또는 ‘먹이통’으로 옮길 수 있습니다. 여기서는 먹는 행위와의 연결을 더 분명히 드러내기 위해 ‘먹이통’을 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲉϩⲉ는 특정한 ‘소’보다 넓게 가축을 가리킬 수 있습니다. 영어 POB의 ‘cattle’를 따라, ‘가축’으로 옮겨 넓은 의미를 유지했습니다.
    reason: cultural_note
  - marker: c
    text: 사본 행에는 훼손된 글자가 있어 ‘days’처럼 보일 수 있지만, 정규화 읽기는 ‘가축의’에 해당하는 형태이며 뒤의 ‘가축’과도 호응합니다.
    reason: textual_variant
  - marker: d
    text: ⲕⲱ + 부정사 구조는 ‘…하게 두다/허락하다’의 뜻입니다. 따라서 여기서는 ‘먹게 하지 않는다’와 같은 의미입니다.
    reason: source_note
lexical_decisions:
- source_word: ⲟⲩⲟⲓ
  english_pob_choice: Woe to
  chosen_korean: 화가 나 있습니다
  alternatives_korean:
  - 화가 있습니다
  - 불행합니다
  - 재앙이 있습니다
  lexicon: Crum
  rationale: Coptic의 강한 책망·탄식 어조를 한국어에서 가장 직접적으로 드러내되, 예수의 발화체에 맞는 현대적 경고 표현으로 옮겼습니다.
- source_word: ⲉⲓⲛⲉ
  english_pob_choice: are like
  chosen_korean: …와 같습니다
  alternatives_korean:
  - …와 비슷합니다
  - …를 닮았습니다
  lexicon: Layton
  rationale: 비교 구문을 간결하게 살려, 수사적 비유의 직설성을 유지했습니다.
- source_word: ⲡⲟⲩⲟⲙϥ
  english_pob_choice: manger
  chosen_korean: 먹이통
  alternatives_korean:
  - 여물통
  - 구유
  lexicon: Layton
  rationale: 영어 POB가 주석한 것처럼 ‘feeding-trough’의 뜻을 반영하여, 현대 한국어에서 기능이 분명한 ‘먹이통’을 택했습니다.
- source_word: ⲉⲩⲉⲓⲛⲉ / ⲛⲟⲩⲟⲩϩⲟⲣ
  english_pob_choice: dog
  chosen_korean: 개
  alternatives_korean:
  - 개 한 마리
  - 개처럼
  lexicon: Crum
  rationale: 비유의 모욕성과 날카로움을 약화하지 않도록 가장 기본적인 명사 ‘개’를 유지했습니다.
- source_word: ⲟⲩⲱⲙ
  english_pob_choice: eat
  chosen_korean: 먹다
  alternatives_korean:
  - 식사하다
  - 먹습니다
  lexicon: Crum
  rationale: 동사의 기본 의미를 그대로 살려 단순하고 직접적으로 옮겼습니다.
- source_word: ⲕⲱ
  english_pob_choice: let / allow
  chosen_korean: 허락하지 않습니다
  alternatives_korean:
  - 하게 두지 않습니다
  - 허용하지 않습니다
  - 막습니다
  lexicon: Crum
  rationale: 부정과 함께 ‘…하게 두다/허락하다’의 뜻이므로, 한국어에서는 자연스럽고 의미가 선명한 ‘허락하지 않습니다’로 옮겼습니다.
theological_decisions:
- issue: 화자 예수의 감탄·책망 어조를 한국어로 어떻게 담을지
  chosen_reading: 직설적 탄식형인 ‘화가 나 있습니다’로 시작해, 바리새인에 대한 공개적 책망의 강도를 드러냈습니다.
  alternative_readings:
  - ‘화가 있습니다’
  - ‘불행합니다’
  rationale: 이 말은 단순 정보가 아니라 강한 예언자적 비난이므로, 완곡한 표현보다 책망의 정조가 드러나는 번역이 본문 효과에 더 가깝습니다.
  doctrine_reference: 예언자적 심판 발화의 수사적 기능
- issue: ‘개’ 비유의 거침을 완화할지 여부
  chosen_reading: 문학적 완곡화 없이 ‘개’를 그대로 유지했습니다.
  alternative_readings:
  - ‘짐승’
  - ‘동물’
  rationale: 원문은 의도적으로 거친 모욕적 비유를 사용하므로, 이를 순화하면 본문의 도발성과 비판 대상의 무책임성이 약화됩니다.
  doctrine_reference: 본문의 수사적 강도 보존
