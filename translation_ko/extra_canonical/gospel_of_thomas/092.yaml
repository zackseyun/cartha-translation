base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/092.yaml
  text: Jesus said[a], “Seek, and you will find. But the things that you asked me about in those days, which I did not tell you on that day—now I am willing to tell them[e][d][c][b], and you are not seeking them.”
  footnotes:
  - marker: a
    text: The relative construction can be read as singular (“that which”) or plural (“the things that”). The surrounding plural pronominal references favor a plural sense.
    reason: textual_variant
  - marker: b
    text: Printed morphological segmentation shows “you asked them,” while the normalized line supports “you asked me.” The translation follows “me.”
    reason: textual_variant
  - marker: c
    text: ⲉϩⲛⲁ + infinitive expresses readiness or intention in Coptic; hence “I am willing to tell” could also be rendered “I am about to tell.”
    reason: lexical_alternative
  - marker: d
    text: “Seek … find” is a well-known pair (cf. Matt 7:7; Luke 11:9), but Thomas’s saying continues in a different direction, contrasting “then” and “now.”
    reason: cross_reference
  - marker: e
    text: Or 'But the things that you asked me in those days, I did not tell you then; now I am willing to tell them, and you are not seeking them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “찾으십시오. 그러면 찾을 것입니다. 그러나 여러분이 그날 나에게 물었던 것들에 대해서는, 내가 그날에는 말하지 않았습니다 — 이제는 그것들을 말하려고 합니다 — 그런데 여러분은 그것들을 찾고 있지 않습니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찾으십시오’는 본문의 ϣⲓⲛⲉ에 대응하며, 뒤의 ‘찾을 것입니다’와 동사쌍을 이룹니다.
    reason: source_note
  - marker: b
    text: ‘그날’은 ⲛ̄ⲛⲓϩⲟⲟⲩ / ⲛⲡⲓϩⲟⲟⲩ의 시간 표현을 살린 번역입니다.
    reason: source_note
  - marker: c
    text: ‘말하려고 합니다’는 ⲉϩⲛⲁ + 부정사 구조의 의지·준비를 반영합니다.
    reason: lexical_alternative
  - marker: d
    text: 이 구절은 흔한 ‘구하라…’ 공식과 닮았지만, 곧바로 ‘그러나’로 전환되는 점이 토마스의 강조점입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ϣⲓⲛⲉ
  english_pob_choice: seek
  chosen_korean: 찾으십시오
  alternatives_korean:
  - 구하십시오
  - 찾아보십시오
  lexicon: Crum; Layton
  rationale: 구하는 행위보다 적극적인 탐색을 나타내는 동사이므로, 간결한 명령형 ‘찾으십시오’가 본문의 압축성을 살리면서도 POB의 ‘seek’에 대응합니다.
- source_word: ϭⲓⲛⲉ
  english_pob_choice: find
  chosen_korean: 찾을 것입니다
  alternatives_korean:
  - 발견할 것입니다
  - 알게 될 것입니다
  lexicon: Crum; Layton
  rationale: ϣⲓⲛⲉ와 짝을 이루는 표준 대응으로 ‘찾다’를 유지해, 직선적인 대구를 한국어에서도 드러냅니다.
- source_word: ⲉⲣⲟⲟⲩ
  english_pob_choice: about them
  chosen_korean: 그것들에 대해서는
  alternatives_korean:
  - 그것들에 관해서는
  - 그 일들에 대해서는
  lexicon: Crum; Layton
  rationale: 질문의 대상이 ‘그것들’이라는 점을 살려, 한국어 조사로 문의의 범위를 분명히 했습니다.
- source_word: ⲛ̄ⲛⲓϩⲟⲟⲩ / ⲛⲡⲓϩⲟⲟⲩ
  english_pob_choice: in those days / on that day
  chosen_korean: 그날
  alternatives_korean:
  - 그때
  - 그날에
  lexicon: Crum
  rationale: 본문의 시간 대조가 ‘그날—이제’로 압축되어 있으므로, 반복을 살리면서도 자연스러운 현대 한국어로 ‘그날’을 사용했습니다.
- source_word: ⲉϩⲛⲁ + infinitive
  english_pob_choice: I am willing to tell
  chosen_korean: 말하려고 합니다
  alternatives_korean:
  - 말할 준비가 되어 있습니다
  - 말할 것입니다
  lexicon: Layton; Lambdin
  rationale: 이 구조는 의지/준비를 나타내므로, ‘말하려고 합니다’가 단순 미래보다 본문의 의도성을 더 잘 드러냅니다.
theological_decisions:
- issue: ‘seek … find’의 지혜/복음서 전승과의 관계를 어떻게 처리할지
  chosen_reading: 본문은 마태/누가의 유사한 표현을 직접 인용하지 않고, 같은 동사쌍을 사용해도 곧바로 다른 방향으로 전개되는 토마스 특유의 역전 구조를 드러내도록 옮겼습니다.
  alternative_readings:
  - 전형적인 성서어법처럼 ‘구하십시오, 그러면 받을 것입니다’ 식으로 평탄화하기
  - 유사본문을 의식해 설명을 덧붙이기
  rationale: 출처 텍스트 자체가 ‘찾으십시오… 그러나…’의 대비를 핵심으로 삼으므로, 익숙한 공관복음식 문구로 완화하지 않는 것이 본문 의미를 보존합니다.
  doctrine_reference: Thomas saying structure; cross-reference note in POB audit trail
