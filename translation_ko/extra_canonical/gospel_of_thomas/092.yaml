review_pass:
  verdict: revise
  source_fidelity: 현 초안은 첫 시간 표현 ⲛ̄ⲛⲓϩⲟⲟⲩ(‘그 여러 날/그 무렵에’)와 뒤의 ⲙ̄ⲫⲟⲟⲩ ⲉⲧⲙ̄ⲙⲁⲩ(‘그날에’)를 모두 ‘그날’로 평준화하여 시간적 반복과 대조를 약화합니다. 또한 ⲉⲙ̄ⲡⲓϫⲟⲟⲩ ⲛⲏⲧⲛ̄의 ‘내가 여러분에게 말하지 않았던’을 빠뜨렸습니다. ‘물어보았던’으로 수신자를 명시하지 않은 번역은 필사본 형태와 정규화 본문 사이의 ‘그것들에 관하여 물었다/나에게 물었다’라는 읽기의 긴장을 보존합니다.
  naturalness: 개정문은 현대 표준 한국어 합쇼체를 유지하며, ‘그 무렵에 … 그날’과 ‘이제는’의 대조가 자연스럽습니다. ‘말하려 합니다’는 ⲉϩⲛⲁ + 부정사의 의도·준비 의미를 과도하게 확정하지 않고 자연스럽게 전달합니다.
  terminology: ϣⲓⲛⲉ/ϭⲓⲛⲉ의 대구는 ‘찾으십시오/찾을 것입니다’로 유지했습니다. 질문의 내용을 가리키는 복수 대상은 ‘것들/그것들’로, 뒤의 복수 대명사와 일치시켰습니다.
  issues:
  - severity: medium
    issue: 두 시간 표현이 모두 ‘그날’로 번역됨
    rationale: 본문은 ‘그 여러 날(그 무렵)’과 ‘그날’을 구별하여 반복·대조합니다. 첫 표현을 ‘그 무렵에’로 옮겨야 합니다.
  - severity: medium
    issue: ‘내가 그날 여러분에게 말하지 않았던’이라는 관계절의 수신자가 누락됨
    rationale: ⲉⲙ̄ⲡⲓϫⲟⲟⲩ ⲛⲏⲧⲛ̄은 ‘내가 그것들을 여러분에게 말하지 않았다’입니다. 현 번역은 ‘여러분에게’를 누락합니다.
  - severity: low
    issue: 각주 b가 두 시간 표현을 모두 ‘그날’로 설명함
    rationale: 각주는 실제로 서로 다른 두 시간 표현을 반영해야 하며, 질문 동사의 대상/수신자 읽기에 관한 필사본-정규화 본문의 차이도 안내하는 것이 적절합니다.
  - severity: low
    issue: 각주 d의 ‘구하라…’ 표현
    rationale: 이 본문과 대응하는 동사쌍은 ‘찾다…찾다’입니다. ‘구하라’로 바꾸면 원문의 어휘 대구를 흐립니다.
  revised_text: 예수께서 말씀하셨습니다. “찾으십시오. 그러면 찾을 것입니다.[a][d] 그러나 여러분이 그 무렵에 물어보았고[a] 내가 그날 여러분에게 말하지 않았던 것들을, 이제는 여러분에게 말하려 합니다.[c] 그런데 여러분은 그것들을 찾지 않습니다.”
  revised_footnotes:
  - marker: a
    text: ‘찾으십시오’와 ‘찾을 것입니다’는 본문의 ϣⲓⲛⲉ(찾다)와 ϭⲓⲛⲉ(찾다, 발견하다)의 동사쌍을 옮긴 것입니다.
    reason: source_note
  - marker: b
    text: 필사본의 형태소 분절은 ‘여러분이 그것들에 관하여 물어보았다’로 읽히는 반면, 정규화 본문은 ‘여러분이 나에게 물어보았다’로 읽힐 수 있습니다. 번역은 수신자를 특정하지 않았습니다. 또한 본문은 ‘그 여러 날/그 무렵’과 ‘그날’을 구별합니다.
    reason: textual_variant
  - marker: c
    text: ⲉϩⲛⲁ + 부정사는 의지·의도 또는 준비 상태를 나타냅니다. ‘말하려 합니다’는 문맥에 따라 ‘말할 준비가 되어 있습니다’ 또는 ‘말할 작정입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘찾으십시오 … 찾을 것입니다’라는 짝은 마태복음 7:7과 누가복음 11:9의 표현을 떠올리게 하지만, 이 말씀은 이어서 과거와 현재의 대비로 다른 방향으로 전개됩니다.
    reason: cross_reference
  revision_rationale: 시간 표현의 구별과 ‘여러분에게 말하지 않았다’는 수신자를 복원했습니다. 질문 동사의 수신자에 관해서는 사본 표기와 정규화 텍스트가 상이하게 제시되므로, 한국어 본문에서는 수신자를 특정하지 않고 각주에서 그 불확실성을 밝혔습니다. 개정문에는 각주 b의 앵커를 ‘물어보았고’ 뒤에 두어 해당 쟁점과 직접 연결했습니다.
