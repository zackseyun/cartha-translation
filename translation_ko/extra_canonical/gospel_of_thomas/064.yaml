base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/064.yaml
  text: Jesus said[1], "A man had some guests. And when he had prepared the dinner, he sent his servant so that he might invite the guests. He went to the first. He said to him, 'My master invites you.' He said, 'I have some money with some merchants; they are coming to me in the evening. I will go to give them orders. I excuse myself from the dinner.' He went to another. He said to him[2], 'My master has invited you.' He said to him, 'I have bought a house, and they are asking for me for a day. I will not have time.' He came to another. He said to him, 'My master invites you.' He said to him, 'My friend is going to marry, and I am the one who will make the dinner. I will not go. I excuse myself from the dinner.' He went to another. He said to him, 'My master invites you.' He said to him, 'I have bought a village. I am going to collect rent. I will not go. I excuse myself.' The servant came. He said to his master, 'Those whom you invited to the dinner have excused themselves.' The master
    said to his servant, 'Go outside to the streets. Those whom you will find, bring them, so that they may dine[4][3]. Buyers and merchants will not enter the places of my father.'"
  footnotes:
  - marker: '1'
    text: The second invitation uses the perfect tense (ⲁⲡⲁϫⲟⲉⲓⲥ, 'has invited'), while the others use the present tense (ⲡⲁϫⲟⲉⲓⲥ, 'invites'). This variation is preserved in the translation.
    reason: textual_variant
  - marker: '2'
    text: The Coptic ϯⲛⲁϣⲓ ⲁⲛ uses a variant of the verb ϣⲉ ('to go'). Earlier translations sometimes rendered this as 'I will not be able', confusing it with the verb ϣ ('to be able'), which would require a following infinitive.
    reason: lexical_alternative
  - marker: '3'
    text: 'The manuscript has a lacuna here: ⲙⲛ̄ⲛⲉϣⲟⲧ̣[ⲉ ⲥⲉⲛⲁⲃ]ⲱ̣ⲕ̣ ⲁⲛ⳿. The restoration ''[will] not [go] in'' is standard and fits the visible traces and space.'
    reason: textual_variant
  - marker: '4'
    text: Unlike the canonical parallels (Luke 14:16-24, Matt 22:1-10), Thomas explicitly frames all the excuses around commerce and business, concluding with a direct condemnation of 'buyers and merchants'. This reflects Thomas's ascetic rejection of worldly commerce.
    reason: theological_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “어떤 사람이 손님들을 초대해 놓고, 잔치를 준비한 뒤 자기 종을 보내 그 손님들을 초대하게 했습니다.[a] 종이 첫째 사람에게 가서 말했습니다. ‘내 주인이 당신을 초대합니다.’ 그가 말했습니다. ‘나는 상인들과 관련된 돈이 있습니다.[b] 그들이 저녁에 내게 올 것입니다. 나는 그들에게 지시를 내리러 가야 합니다. 나는 이 잔치를 사양합니다.’ 종이 다른 사람에게 가서 말했습니다. ‘내 주인께서 당신을 초대하셨습니다.’ 그가 말했습니다. ‘나는 집 한 채를 샀는데, 사람들이 하루 동안 나를 필요로 합니다. 나는 시간이 없습니다.’ 종이 또 다른 사람에게 가서 말했습니다. ‘내 주인이 당신을 초대합니다.’ 그가 말했습니다. ‘내 친구가 결혼하려 하는데, 내가 잔치를 마련해야 합니다. 나는 가지 않겠습니다. 나는 이 잔치를 사양합니다.’ 종이 또 다른 사람에게 가서 말했습니다. ‘내 주인이 당신을 초대합니다.’ 그가 말했습니다. ‘나는 마을 하나를 샀습니다. 임대료를 거두러 가야 합니다. 나는 가지 않겠습니다. 사양합니다.’ 종이 와서 자기 주인에게 말했습니다. ‘당신이 잔치에 초대한 사람들이 사양했습니다.’ 주인이 자기 종에게 말했습니다. ‘밖의 거리로 나가서, 네가 찾아내는 사람들을 데려오너라. 그들이 식사하게 하여라. 구매자들과 상인들은 내 아버지의 곳에 들어가지 못한다.’”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘손님들’은 콥트어 ϣⲙⲙⲟ(직역: 낯선 사람들, 외인들)를 연회 초대의 문맥에 맞게 옮긴 것입니다.'
    reason: lexical_alternative
  - marker: b
    text: ‘상인들과 관련된 돈’은 ‘내게 돈이 있다’와 ‘상인들’의 관계를 표현하는 콥트어 구절의 정확한 관계가 한국어에서 분명하지 않음을 보존한 번역입니다. ‘상인들에게 맡긴/받을 돈’으로 특정하지 않았습니다.
    reason: source_note
  - marker: c
    text: 마지막 문장은 사본이 훼손되어 있습니다(ⲙⲛ̄ⲛⲉϣⲟⲧ̣[ⲉ ⲥⲉⲛⲁⲃ]ⲱ̣ⲕ̣ ⲁⲛ⳿). 여기의 ‘구매자들과 상인들은 … 들어가지 못한다’는 보이는 글자와 문맥에 따른 통상적 복원입니다. ‘내 아버지의 곳’은 콥트어 단수입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ϩⲛ̄ϣⲙ̄ⲙⲟ
  english_pob_choice: guests
  chosen_korean: 손님들
  alternatives_korean:
  - 나그네들
  - 손님
  - 외인들
  lexicon: Crum 566a
  rationale: 문맥상 연회 초대의 대상이므로 ‘손님들’이 가장 자연스럽고, ϣⲙⲙⲟ의 ‘낯선 사람/외인’ 뉘앙스는 연회 상황에서 흐려지지 않도록 유지했습니다.
- source_word: ⲡⲇⲓⲡⲛⲟⲛ
  english_pob_choice: the dinner
  chosen_korean: 잔치
  alternatives_korean:
  - 저녁식사
  - 만찬
  - 식사
  lexicon: Crum 113b / 139a
  rationale: 단순한 식사보다 초대와 배제의 서사가 강조되므로, 한국어에서는 ‘잔치’가 본문 전체의 사회적·서사적 기능을 가장 잘 드러냅니다.
- source_word: ⲟⲩⲛ̄ⲧⲁⲉⲓ ϩⲛ̄ϩⲟⲙⲧ⳿ ⲁϩⲉⲛⲉⲙⲡⲟⲣⲟⲥ
  english_pob_choice: I have some money with some merchants
  chosen_korean: 나는 상인들과 함께 가진 돈이 있습니다
  alternatives_korean:
  - 나는 상인들에게 맡긴 돈이 있습니다
  - 나는 상인들과 거래할 돈이 있습니다
  - 나는 상인들에게서 받을 돈이 있습니다
  lexicon: Crum 791a; Crum 117b
  rationale: ϩⲟⲙⲧ을 구체적인 돈/동전으로 보고, 상인들과 연결된 경제적 보유를 한국어로 드러내기 위해 직역을 유지했습니다.
- source_word: ⲟⲩⲉϩⲥⲁϩⲛⲉ
  english_pob_choice: give orders
  chosen_korean: 명령하러 가야 합니다
  alternatives_korean:
  - 지시하러 가야 합니다
  - 명령해야 합니다
  - 지시해야 합니다
  lexicon: Crum 506a
  rationale: 상업 거래의 처리나 감독이 아니라 직접적 명령 행위를 가리키므로, ‘명령하러 가다’로 동작 목적을 살렸습니다.
- source_word: ϫⲓ ⲛϣⲱⲙ
  english_pob_choice: collect rent
  chosen_korean: 임대료를 거두다
  alternatives_korean:
  - 세를 거두다
  - 임차료를 받다
  - 세입을 거두다
  lexicon: Crum 565b
  rationale: 해당 숙어의 경제적 의미를 살리되 현대 한국어에서 이해하기 쉬운 ‘임대료를 거두다’로 옮겼습니다.
theological_decisions:
- issue: 본문 말미의 상업 행위자에 대한 배제 선언
  chosen_reading: 사는 사람들과 상인들은 내 아버지의 장소들에 들어가지 못할 것입니다.
  alternative_readings:
  - 구매자들과 상인들은 내 아버지의 집에 들어가지 못할 것입니다
  - 사는 자들과 장사꾼들은 내 아버지의 처소에 들어가지 못할 것입니다
  rationale: 토마스복음서가 노골적으로 상업과 매매를 거부하는 종결부를 유지해야 하므로, 완화하지 않고 ‘사는 사람들’과 ‘상인들’을 병렬로 남겼습니다.
  doctrine_reference: Thomasine ascetic critique of commerce
