base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/091.yaml
  text: They said to him[a], "Say to us who you are, so that we may believe in you." He said to them, "You test the face of the sky and the earth, and the one who is before you you do not recognize[e][d][c][b]; and this kairos you do not know how to test."
  footnotes:
  - marker: a
    text: “Face” can mean “appearance”; the Coptic phrase is literally “the face of the sky and the earth.”
    reason: cultural_note
  - marker: b
    text: Kairos is a Greek loan meaning an appointed/critical time or season; left untranslated to retain its nuance.
    reason: cultural_note
  - marker: c
    text: The verb for “believe” is a Greek loan (from pisteuein) and can also mean “trust.”
    reason: lexical_alternative
  - marker: d
    text: 'The clause can also be read “what is before you,” but the following pronoun (“him”) favors a personal reference: “the one who is before you.”'
    reason: textual_variant
  - marker: e
    text: Printed has ϫⲟⲟⲥ ⲉⲣⲟⲛ; normalized reads ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ. Both mean “tell us.”
    reason: textual_variant
translation:
  language: ko
  text: 그들이 그분께 말했습니다. “우리에게 당신이 누구인지 말해 주십시오. 그래야 우리가 당신을 믿을 수 있습니다.” 그분이 그들에게 말씀하셨습니다. “너희는 하늘과 땅의 얼굴을 시험하지만, 너희 앞에 있는 그분은 알아보지 못합니다. 그런데도 이 카이로스를 어떻게 시험해야 하는지도 알지 못합니다.”[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic의 ‘하늘과 땅의 얼굴’은 문자적으로는 외형/겉모습을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘카이로스’는 정해진 때, 중요한 순간, 결정적 시기를 뜻하는 그리스어 차용어입니다.
    reason: cultural_note
  - marker: c
    text: ‘믿다’로 옮긴 동사는 그리스어 πιστεύειν 계열 차용어로, ‘신뢰하다’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 뒤절은 ‘너희 앞에 있는 것’으로도 읽을 수 있지만, 이어지는 목적어가 인격적 대상을 가리켜 ‘그분’으로 옮겼습니다.
    reason: textual_variant
  - marker: e
    text: 인쇄본의 ϫⲟⲟⲥ ⲉⲣⲟⲛ과 정규화형 ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ은 모두 ‘우리에게 말하다’의 뜻입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ϫⲟⲟⲥ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ (printed/normalized)
  english_pob_choice: say/tell (to us)
  chosen_korean: 말해 주십시오
  alternatives_korean:
  - 말해 주시옵소서
  - 우리에게 말씀해 주십시오
  - 말해 주시오
  lexicon: Crum, s.v. ϫⲟⲟⲥ; Layton (Grammar) on object complements
  rationale: 청자에게 직접 요구하는 짧은 명령문이므로 현대 합쇼체의 자연스러운 요청 표현으로 옮겼습니다.
- source_word: ⲣⲡⲓⲥⲧⲉⲩⲉ
  english_pob_choice: believe
  chosen_korean: 믿을 수 있습니다
  alternatives_korean:
  - 믿습니다
  - 신뢰할 수 있습니다
  lexicon: Lambdin (Grammar) on Greek loan-verbs; Crum, s.v. πιστεύω (loan)
  rationale: Coptic의 πιστεύω 차용어를 ‘믿다’로 옮기되, 목적절 안의 가능성/의도 뉘앙스를 살려 ‘믿을 수 있습니다’로 자연화했습니다.
- source_word: ⲡϩⲟ
  english_pob_choice: face
  chosen_korean: 얼굴
  alternatives_korean:
  - 얼굴(모양)
  - 겉모습
  - 모습
  lexicon: Crum, s.v. ϩⲟ
  rationale: 직역은 ‘얼굴’이지만 한국어에서 ‘하늘과 땅의 얼굴’은 부자연스러우므로, 주해상 ‘appearance’ 가능성을 반영해 ‘얼굴’보다 통용되는 감각으로 옮겼습니다.
- source_word: ⲡⲡⲉ / ⲧⲡⲉ
  english_pob_choice: sky
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘의 얼굴
  - 천공
  lexicon: Crum, s.v. ⲡⲉ/ⲧⲡⲉ
  rationale: 이 대목은 천지의 관찰을 가리키므로 ‘하늘’이 가장 직접적이고 자연스럽습니다.
- source_word: ⲡⲕⲁϩ
  english_pob_choice: earth
  chosen_korean: 땅
  alternatives_korean:
  - 지면
  - 대지
  lexicon: Crum, s.v. ⲕⲁϩ
  rationale: 하늘과 짝을 이루는 보이는 세계를 가리키므로 한국어에서도 가장 직관적인 ‘땅’을 택했습니다.
- source_word: ⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  english_pob_choice: the one who is before you
  chosen_korean: 너희 앞에 있는 그분
  alternatives_korean:
  - 너희 앞에 있는 이
  - 너희 앞에 계신 분
  lexicon: Crum, s.v. ⲙⲧⲟ; Layton (Grammar) on relative ⲡⲉⲧ-
  rationale: 뒤따르는 목적어 표지가 단순 사물보다 인격적 대상을 강하게 시사하므로, 문맥상 ‘그분’으로 번역해 대상을 분명히 했습니다.
- source_word: ⲥⲟⲟⲩⲛ
  english_pob_choice: know/recognize
  chosen_korean: 알아보지 못합니다
  alternatives_korean:
  - 알지 못합니다
  - 인식하지 못합니다
  lexicon: Crum, s.v. ⲥⲟⲟⲩⲛ
  rationale: 단순 지식 부재보다 ‘눈앞의 분을 알아보지 못함’이라는 관계적 뉘앙스를 드러내기 위해 ‘알아보다’를 택했습니다.
- source_word: ⲕⲁⲓⲣⲟⲥ
  english_pob_choice: kairos
  chosen_korean: 카이로스
  alternatives_korean:
  - 정한 때
  - 중요한 때
  - 기회
  lexicon: Lambdin on Greek loans; Crum, s.v. καιρός
  rationale: Thomas의 의미 밀도를 보존하기 위해 음역을 유지했습니다.
- source_word: ⲥⲟⲟⲩⲛ ⲛⲧⲉ ⲣⲡⲓⲣⲁⲍⲉ
  english_pob_choice: know how to test
  chosen_korean: 어떻게 시험해야 하는지도
  alternatives_korean:
  - 시험할 줄도
  - 검토해야 하는지도
  lexicon: Layton (Grammar) on ⲥⲟⲟⲩⲛ ⲛⲧⲉ + infinitive
  rationale: 구조상 ‘할 줄 알다/어떻게 해야 하는지 알다’의 의미이므로, 수사적 질책을 살리면서도 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 직접 화법의 인칭과 존대 유지
  chosen_reading: 요청문은 청자들의 말투로, 응답은 권위 있는 화자의 선언으로 처리해 현대 합쇼체를 유지했습니다.
  alternative_readings:
  - 전 구절을 중립적 서술체로 평평하게 처리
  - 요청문도 완전히 문어적 직설로 처리
  rationale: 본문은 대화의 긴장과 질책을 통해 의미가 전달되므로, 한국어에서도 요청과 응답의 대조를 살리는 것이 중요합니다.
  doctrine_reference: 담화 맥락과 수사적 대비
- issue: ‘카이로스’의 보존
  chosen_reading: ⟨카이로스⟩는 번역어로 풀지 않고 음역해 유지했습니다.
  alternative_readings:
  - ‘정한 때’로 의역
  - ‘적절한 시기’로 설명
  rationale: 이 용어는 단순 시간표현이 아니라 결정적/분기점적 때를 가리키므로, 한국어 독자에게도 낯선 긴장감을 보존하는 편이 원문에 충실합니다.
  doctrine_reference: 어휘적-담화적 보존 원칙
