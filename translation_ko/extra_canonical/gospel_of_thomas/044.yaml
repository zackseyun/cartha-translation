base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
  footnotes:
  - marker: blasphemes
    text: The Coptic spelling ⲡⲉⲧⲁϫⲉⲟⲩⲁ is a reduced form of the future relative ⲡⲉⲧⲛⲁϫⲓⲟⲩⲁ ('the one who will blaspheme').
    reason: dialect_note
  - marker: will be forgiven
    text: The Coptic uses the active third-person plural ('they will forgive him') as a standard circumlocution for the passive.
    reason: register_note
  - marker: neither on earth nor in heaven
    text: Thomas replaces the temporal/eschatological framework of the synoptic parallel (Matthew 12:32, 'neither in this age nor in the age to come') with a spatial/cosmic framework ('neither on earth nor in heaven'), reflecting its realized, non-apocalyptic theology.
    reason: theological_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “아버지를 모독하는[a] 자는 용서받을[b] 것입니다. 아들을 모독하는 자도 용서받을 것입니다. 그러나 성령을 모독하는 자는 땅에서도 하늘에서도 용서받지 못할 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ϫⲓⲟⲩⲁ는 ‘모독하다’ 또는 ‘신성모독하다’를 뜻하는 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: 콥트어는 여기서 문자적으로 ‘그들이 그를 용서할 것이다’라는 능동 3인칭 복수 표현을 사용하지만, 이는 수동의 뜻을 나타내는 관용적 우회표현입니다.
    reason: source_note
  - marker: c
    text: 도마복음의 이 표현은 마태복음 12:32의 ‘이 세대/오는 세대’와 달리 ‘땅/하늘’이라는 공간적 대구를 사용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲓⲟⲩⲁ
  english_pob_choice: blasphemes
  chosen_korean: 모독하는
  alternatives_korean:
  - 신성모독하는
  - 저주하는
  - 말을 거슬러 하는
  lexicon: Crum 470a / 794a
  rationale: 콥트어 ϫⲓⲟⲩⲁ는 ‘모독하다, 신성모독하다’의 관용구이므로, 단순한 ‘말하다’보다 원뜻을 드러내는 ‘모독하다’가 가장 직접적입니다.
- source_word: ⲕⲱ ⲉⲃⲟⲗ
  english_pob_choice: will be forgiven
  chosen_korean: 용서받을 것입니다
  alternatives_korean:
  - 그를 용서할 것입니다
  - 사함을 받을 것입니다
  lexicon: Crum 96b
  rationale: 본문의 능동 3인칭 복수 표현은 수동적 뜻을 나타내는 관용적 우회표현이므로, 한국어에서는 자연스러운 수동형 ‘용서받다’로 옮겼습니다.
- source_word: ⲡⲡⲛⲉⲩⲙⲁ ⲉⲧⲉⲣⲉⲟⲩⲟⲡ
  english_pob_choice: the Holy Spirit
  chosen_korean: 성령
  alternatives_korean:
  - 거룩한 영
  - 성스러운 영
  lexicon: Coptic lexical phrase / project default
  rationale: 콥트어의 ‘거룩한 영’은 하나님의 영을 가리키는 문맥이므로, 본 프로젝트의 표준 용례에 따라 ‘성령’으로 번역했습니다.
- source_word: ϩⲛⲡⲕⲁϩ / ϩⲛⲡⲡⲉ
  english_pob_choice: neither on earth nor in heaven
  chosen_korean: 땅에서도 하늘에서도
  alternatives_korean:
  - 이 땅에서도 저 하늘에서도
  - 세상에서도 하늘에서도
  lexicon: Crum 131a / 259a
  rationale: 토머스복음은 마태복음의 시간적 표현 대신 공간적 대조를 유지하므로, 이를 그대로 살려 ‘땅/하늘’의 대구로 옮겼습니다.
theological_decisions:
- issue: 본문의 종말론적 프레임
  chosen_reading: ‘땅에서도 하늘에서도’라는 공간적 대조를 그대로 유지했습니다.
  alternative_readings:
  - ‘이 세대에서도 오는 세대에서도’ 같은 시간적 표현으로 풀기
  rationale: 콥트어는 마태복음 병행구의 시간적·종말론적 틀을 바꾸어 공간적·우주적 틀을 사용하므로, 토머스의 현재화된 종말론을 훼손하지 않기 위해 직역적 구조를 보존했습니다.
  doctrine_reference: Gospel of Thomas 44 / Matthew 12:32 parallels
