revisions:
- from: 예수께서 말씀하셨습니다. “누구든지 아버지에 대해 모독하는 사람은 용서받을 것이며, 누구든지 아들에 대해 모독하는 사람도 용서받을 것입니다. 그러나 누구든지 성령에 대해 모독하는 사람은 용서받지 못할 것이니, 땅에서도 하늘에서도 그렇습니다.”[a][b][c]
  to: 예수께서 말씀하셨습니다. “아버지를 모독하는[a] 자는 용서받을[b] 것입니다. 아들을 모독하는 자도 용서받을 것입니다. 그러나 성령을 모독하는 자는 땅에서도 하늘에서도 용서받지 못할 것입니다[c].”
  rationale: 원문의 반복 구조, 모독의 대상, 용서의 수동적 의미, 그리고 ‘땅에서도 하늘에서도’라는 공간적 대구를 보존했습니다. 마지막 절의 용서 부정이 두 공간 모두에 적용됨을 한국어에서 명료하게 하기 위해 술어를 반복했으며, 각주 표지도 해당 낱말과 구절에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:17Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘와 문장 순서는 대체로 원문에 충실합니다. 다만 마지막 ‘땅에서도 하늘에서도 그렇습니다’는 콥트어의 부정된 용서 진술을 한국어에서 어색하게 분리하여, ‘그렇습니다’의 지시 대상과 부정 범위가 불분명해집니다. ‘용서받지 못할 것입니다’를 공간 대구와 함께 명시해야 합니다.
  naturalness: ‘아버지에 대해 모독하는 사람’보다 목적어를 직접 취하는 ‘아버지를 모독하는 자’가 현대 한국어 문어체와 합쇼체 성서 번역 문맥에서 자연스럽습니다. 마지막 절도 술어를 반복하면 명료하고 자연스럽습니다.
  terminology: ‘모독하다’, ‘용서받다’, ‘성령’, ‘땅’, ‘하늘’은 적절합니다. ‘신성모독’보다 ‘모독’은 반복되는 본문에서 간결하면서도 ϫⲓⲟⲩⲁ의 의미를 충분히 전달합니다.
  issues:
  - severity: medium
    issue: 마지막 절의 술어와 부정 범위가 불명료함
