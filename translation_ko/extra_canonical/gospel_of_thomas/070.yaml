revisions:
- from: 예수께서 말씀하셨습니다. “여러분 안에서 그것을 낳아 내면, 곧 여러분에게 있는 이것이 여러분을 구원할 것입니다. 그렇지 않으면 가난이 여러분 안에 있습니다. 여러분 안에, 내면에 없는 이것이 여러분을 죽일 것입니다.”[a][b][c][d][e][f]
  to: 예수께서 말씀하셨습니다. “여러분 안에서 그것을 생겨나게 하면[a], 여러분이 지닌 이것이 여러분을 구원할 것입니다[b]. 그렇지 않으면[c] 가난이 여러분 안에 있습니다[d]. 여러분 안에, 곧 여러분의 내면에 없는 이것이[f] 여러분을 죽일 것입니다[e].”
  rationale: 원문의 사역적이면서도 대상이 특정되지 않은 표현을 ‘생겨나게 하면’으로 옮겼습니다. 마지막 절의 두 내면 표지는 한국어에서 자연스럽게 연결하되 반복 효과를 보존했고, 사본 훼손에 대한 필수 주석을 복원했습니다. 각주 표지도 해당 본문 표현에 연결했으며, 교리적 단정을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:22Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘낳아 내면’은 원문의 ‘생기게 하다/나오게 하다’라는 사역적 표현을 다소 비유적으로 좁히며, ‘구원하다’는 ⲧⲟⲩϫⲟⲛ의 가능한 번역으로 유지할 수 있습니다. 마지막 절의 두 겹의 내면 표지는 ‘여러분 안에, 곧 여러분의 내면에’로 보존하는 편이 원문에 더 충실합니다. 사본의 마지막 동사에는 훼손·복원이 있으므로 주석으로 밝혀야 합니다.
  naturalness: ‘여러분 안에, 내면에 없는’은 반복은 살리지만 한국어 어순상 다소 부자연스럽습니다. ‘여러분 안에, 곧 여러분의 내면에 없는’이 자연스러우면서도 중첩된 강조를 보존합니다. 각주를 모두 문장 끝에 일괄 배치한 방식도 해당 어휘와 주석의 연결을 흐리므로 관련 표현 뒤에 붙였습니다.
  terminology: ‘가난’은 ⲙⲛⲧⲁⲁⲛⲟⲛ의 직설성을 잘 보존합니다. ‘구원하다’도 ‘죽이다’와의 강한 대조를 한국어로 유지하지만, 원문 자체가 특정한 교리 체계를 명시하는 것은 아니므로 주석에서 ‘종말론적’ 의미를 단정하지 않습니다.
  issues:
  - severity: medium
    issue: ‘낳아 내면’의 의미 범위가 원문의 사역적 ‘생기게 하다/나오게 하다’보다 좁고 한국어에서 다소 특수하게 들립니다.
    rationale: ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ는 어떤 것을 존재하게 하거나 나오게 하는 표현입니다. ‘생겨나게 하면’은 그 사역성과 원문의 의도적 모호성을 더 잘 유지합니다.
  - severity: medium
    issue: 마지막 절의 이중 내면 표지와 훼손된 동사에 관한 각주가 부정확하거나 누락되었습니다.
    rationale: ϩⲛⲛⲧⲱⲧⲛ과 ϩⲛⲧⲏⲛⲉ의 중첩을 번역과 각주에서 명료하게 반영하고, NHAM02.45의 마지막 동사 복원을 밝혀야 합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 각주 내용과 본문 어휘의 대응이 불분명합니다.
    rationale: 각주 표지를 해당 번역어 바로 뒤에 배치하면 독자가 번역 근거와 본문을 정확히 연결할 수 있습니다.
  - severity: low
    issue: ‘구원하다’를 종말론적으로 단정하는 주석 설명은 본문보다 해석을 앞섭니다.
    rationale: ‘구원하다’는 가능한 번역이지만, 이 짧은 어록만으로 특정한 구원론적 또는 종말론적 의미를 확정하지 않는 것이 안전합니다.
