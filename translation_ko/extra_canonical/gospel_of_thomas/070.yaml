base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/070.yaml
  text: Jesus said, “When you bring it forth within yourselves, this—what you have—will save you; otherwise, poverty is in you. This—what you do not have within yourselves, inside—will kill you.”
  footnotes:
  - marker: a
    text: The periphrastic ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ is rendered ‘bring it forth’; more woodenly, ‘cause it to come to be’ within you.
    reason: lexical_alternative
  - marker: b
    text: ⲧⲟⲩϫⲟⲛ is translated ‘save’; alternatives like ‘deliver/benefit’ are possible, but the antithesis with ‘kill’ favors ‘save.’
    reason: lexical_alternative
  - marker: c
    text: ⲡⲏ is taken disjunctively as ‘otherwise/or else’; some take it as ‘rather’ or omit the clause for smoother English.
    reason: alternative_reading
  - marker: d
    text: ⲙⲛⲧⲁⲁⲛⲟⲛ literally ‘poverty’; we keep the stark term rather than paraphrasing as ‘lack.’
    reason: cultural_note
  - marker: e
    text: 'Line damage in NHAM02.45 lb 33: Dilley restores ⲛⲁ- in ⲛⲁⲙⲟⲩⲟⲩⲧ ‘will kill’; reading is secure in sense though letters are partially lost.'
    reason: lacuna_or_restoration
  - marker: f
    text: ϩⲛⲧⲏⲛⲉ ‘inside/inwardly’ underscores interiority; we translate explicitly to preserve the double emphasis in the Coptic.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “여러분 안에서 그것을 생겨나게 하면[a], 여러분이 지닌 이것이 여러분을 구원할 것입니다[b]. 그렇지 않으면[c] 가난이 여러분 안에 있습니다[d]. 여러분 안에, 곧 여러분의 내면에 없는 이것이[f] 여러분을 죽일 것입니다[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘생겨나게 하면’은 ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ를 옮긴 것으로, 더 직역하면 ‘그것이 있게 하다’ 또는 ‘그것을 나오게 하다’입니다. 원문은 그 ‘그것’이 무엇인지를 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲧⲟⲩϫⲟⲛ은 ‘구원하다’로 옮겼습니다. ‘건지다’, ‘살리다’, ‘도움을 주다’도 가능한 번역이나, 뒤의 ‘죽이다’와의 대조를 고려하여 ‘구원하다’를 택했습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲡⲏ는 여기서 ‘그렇지 않으면/아니면’이라는 분기 표현으로 이해했습니다. 일부 해석은 이를 ‘오히려’로 보거나 매끄러운 번역을 위해 생략합니다.
    reason: alternative_reading
  - marker: d
    text: ⲙⲛⲧⲁⲁⲛⲟⲛ은 문자적으로 ‘가난’ 또는 ‘궁핍’입니다. 본문의 낯선 표현을 완화하지 않고 ‘가난’으로 옮겼습니다.
    reason: cultural_note
  - marker: e
    text: NHAM02.45 33행에서 ‘죽일 것이다’에 해당하는 동사의 일부 글자가 훼손되어 있습니다. 편집본은 ⲛⲁⲙⲟⲩⲟⲩⲧ, ‘죽일 것이다’를 복원하며, 문맥상 의미는 분명합니다.
    reason: lacuna_or_restoration
  - marker: f
    text: 원문은 ‘여러분 안에’(ϩⲛⲛⲧⲱⲧⲛ)와 ‘내면에/속에’(ϩⲛⲧⲏⲛⲉ)를 함께 써서 내면성을 거듭 강조합니다.
    reason: dialect_note
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ
  english_pob_choice: bring it forth / cause it to come to be
  chosen_korean: 낳아 내면
  alternatives_korean:
  - 드러내면
  - 밖으로 내면
  - 생기게 하면
  lexicon: Crum; Layton
  rationale: 내적 생성과 산출의 뉘앙스를 살리면서, 한국어에서 자연스럽고 힘 있는 표현으로 옮겼습니다.
- source_word: ⲧⲟⲩϫⲟⲛ
  english_pob_choice: save
  chosen_korean: 구원할 것입니다
  alternatives_korean:
  - 살릴 것입니다
  - 구출할 것입니다
  - 건져낼 것입니다
  lexicon: Crum
  rationale: 죽이다와의 대조가 선명하므로, 단순한 도움보다 종말론적·구원론적 무게를 가진 ‘구원하다’를 택했습니다.
- source_word: ⲡⲏ
  english_pob_choice: otherwise/or else
  chosen_korean: 그렇지 않으면
  alternatives_korean:
  - 그 아니면
  - 아니면
  - 그렇지 않다면
  lexicon: Layton; Crum
  rationale: 대조적 분기점을 만드는 담화 표지이므로, 간결한 조건 대립 표현으로 처리했습니다.
- source_word: ⲙⲛⲧⲁⲁⲛⲟⲛ
  english_pob_choice: poverty
  chosen_korean: 가난
  alternatives_korean:
  - 빈곤
  - 궁핍
  - 결핍
  lexicon: Crum
  rationale: 문맥의 날선 대조를 살리되, 현대 한국어에서 즉각 이해되는 직접적인 어휘를 선택했습니다.
- source_word: ϩⲛⲧⲏⲛⲉ
  english_pob_choice: inside/inwardly
  chosen_korean: 내면에
  alternatives_korean:
  - 안에
  - 속에
  - 내부에
  lexicon: Crum
  rationale: 단순한 공간적 ‘안’보다 내적 깊이를 분명히 하는 어휘로, 본문의 이중적 내면성 강조를 살렸습니다.
theological_decisions:
- issue: 구원(soteriological) 어휘의 선택
  chosen_reading: ⲧⲟⲩϫⲟⲛ을 ‘구원하다’로 옮겨, 본문의 대조를 단순한 유익/도움이 아니라 생사와 관련된 구원-죽음의 긴장으로 읽었습니다.
  alternative_readings:
  - 살리다
  - 건지다
  - 도와주다
  rationale: 영문 POB도 ‘save’를 택하며 ‘kill’과의 대조를 근거로 제시하므로, 한국어에서도 같은 긴장을 유지하는 것이 본문 의미를 더 잘 드러냅니다.
  doctrine_reference: 구원론적 대조의 보존
