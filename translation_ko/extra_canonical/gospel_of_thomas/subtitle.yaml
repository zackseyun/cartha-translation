    reason: cultural_note
translation:
  language: ko
  text: 토마스에 따른 복음서[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 소식’. ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ은 문자적으로는 ‘좋은 소식’이지만, 장르 표제에서는 ‘복음서’가 관용적입니다.
    reason: lexical_alternative
  - marker: b
    text: Coptic의 ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ는 문자적으로 ‘토마스에 따른’이라는 고정 표제식입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  english_pob_choice: gospel
  chosen_korean: 복음서
  alternatives_korean:
  - 복음
  - 좋은 소식
  lexicon: Coptic ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ < Greek εὐαγγέλιον
  rationale: 여기서는 본문 장르 표제이므로 ‘복음’보다 한국어 관용의 표제어인 ‘복음서’가 더 자연스럽고, ‘좋은 소식’의 직역성은 표제 기능을 약화시킵니다.
- source_word: ⲡⲕⲁⲧⲁ
  english_pob_choice: according to
  chosen_korean: 에 따른
  alternatives_korean:
  - 따른
  - according to를 음역한 형태
  lexicon: Coptic title formula using Greek κατά
  rationale: Coptic의 고정 표제식 ‘according to’를 한국어 표제 관용에 맞게 ‘에 따른’으로 옮겨, 저자/전승 귀속의 기능을 드러냅니다.
- source_word: ⲑⲱⲙⲁⲥ
  english_pob_choice: Thomas
  chosen_korean: 토마스
  alternatives_korean:
  - 도마
  lexicon: Proper name; from Greek Θωμᾶς
  rationale: 원문과 영어 audit의 고유명사 대응을 따라 음역하면 ‘토마스’가 직접적입니다. 한국 교회 전통의 ‘도마’는 익숙하지만, 여기서는 원전 기반 표제를 우선합니다.
theological_decisions:
- issue: 고정 표제식의 번역 방식
  chosen_reading: 장르 표제로서 ‘복음서’와 ‘에 따른’의 결합을 유지했습니다.
  alternative_readings:
  - ‘토마스에 관한 복음’
  - ‘토마스의 복음’
  rationale: 이 문구는 서술문이 아니라 문헌 표제이므로, Coptic의 고정형식과 그리스어 κατά의 귀속 기능을 살려 제목 구조를 보존하는 편이 가장 충실합니다.
  doctrine_reference: 문헌 표제 번역 원칙
