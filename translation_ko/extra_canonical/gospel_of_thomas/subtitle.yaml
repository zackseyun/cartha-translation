  text: The gospel according to Thomas[a][b]
  footnotes:
  - marker: a
    text: 'Or: good news; εὐαγγέλιον/ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ can be rendered literally as ''good message'', but as a genre-title ''gospel'' is customary.'
