base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/049.yaml
  text: Jesus said[a], "Blessed are the solitary and chosen, for you will find the kingdom. For you are from it[b][c], and you will go there again."
  footnotes:
  - marker: a
    text: The Greek loanword μοναχός (monachos) in Thomas denotes someone who is 'single' or 'undivided' in a spiritual sense, rather than carrying the later institutional meaning of a 'monk'.
    reason: lexical_alternative
    anchor_ref: solitary
  - marker: c
    text: The Coptic uses the preposition ⲁ (a) instead of the standard Sahidic ⲉ (e) after the verb ϩⲉ ('to find'), a regional dialectal feature common in this manuscript.
    reason: dialect_note
    anchor_ref: find the kingdom
  - marker: b
    text: Literally 'ones out of it' (plural indefinite article ϩⲉⲛ- + ⲉⲃⲟⲗ).
    reason: register_note
    anchor_ref: from it
translation:
  language: ko
  text: 예수께서 말씀하셨습니다[a]. 「외로운 이들과 선택된 이들은 복됩니다. 왜냐하면 여러분은 나라를 찾을 것이기 때문입니다[c]. 여러분은 거기에서 왔고[b], 다시 그리로 갈 것이기 때문입니다」.
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문은 예수의 발화를 여는 서술 표지입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그것으로부터 나온 이들’이라는 뜻입니다.
    reason: source_note
  - marker: c
    text: 사본에는 ϩⲉ 뒤에 표준 사힛 방언의 ⲉ 대신 지역적 변이 ⲁ가 나타납니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  english_pob_choice: solitary
  chosen_korean: 외로운 이들
  alternatives_korean:
  - 홀로 된 이들
  - 단일한 이들
  - 수도승들
  lexicon: Crum 175a; Greek loanword μοναχός
  rationale: 토마스복음서의 μοναχός는 후대 제도권의 ‘수도승’이 아니라 영적 단일성과 분리됨을 가리키므로, 제도적 의미를 피하면서 한국어로는 ‘외로운 이들’로 옮겼습니다.
- source_word: ⲥⲱⲧⲡ / ⲉⲧⲥⲟⲧⲡ
  english_pob_choice: chosen
  chosen_korean: 선택된
  alternatives_korean:
  - 택함 받은
  - 선출된
  - 선택받은
  lexicon: Crum 365a
  rationale: 수동·상태적 의미를 살려 ‘선택된’으로 옮겼으며, 능동적으로 ‘선택한’이 되지 않도록 했습니다.
- source_word: ϩⲉ
  english_pob_choice: find
  chosen_korean: 찾다
  alternatives_korean:
  - 발견하다
  - 찾아내다
  lexicon: Crum 651a
  rationale: 문맥상 나라를 ‘찾는다’는 직역이 가장 자연스럽고, 원문의 발견/획득 뉘앙스도 함께 담을 수 있습니다.
- source_word: ⲙⲛⲧⲉⲣⲟ
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 통치
  - 왕권
  lexicon: Crum 298a
  rationale: 토마스복음서의 ⲙⲛⲧⲉⲣⲟ는 단순한 정치 체제보다 실재적 귀속처를 가리키므로, 합쇼체 한국어에서는 ‘나라’가 가장 간결하고 오해가 적습니다.
theological_decisions:
- issue: ⲙⲟⲛⲁⲭⲟⲥ의 번역이 후대 수도원 제도와 연결될 위험
  chosen_reading: ‘외로운 이들’로 번역해 내적 분리와 단일성을 드러냈습니다.
  alternative_readings:
  - 수도승들
  - 독신자들
  rationale: 영문 POB의 audit trail처럼 이 용어는 제도적 ‘수도승’이 아니라 토마스적 영적 단일성의 표현이므로, 후대 교회제도 의미를 덧씌우지 않도록 했습니다.
  doctrine_reference: 토마스복음서 49의 비정전적 어휘 사용에 대한 해석적 주의
