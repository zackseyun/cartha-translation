base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/069.yaml
  text: Jesus said[1], “Blessed are those who have been persecuted in their heart; those are the ones who have truly known the Father. Blessed are those who have gone hungry[a][3][2], so that the belly of the one who desires will be filled.”
  footnotes:
  - marker: '1'
    text: The doubled 3pl pronouns around ‘persecute’ yield a passive sense (‘the one whom they have persecuted’). The phrase ‘in their heart’ could refer to the persecutors’ hearts or to the inner heart of the persecuted; the Coptic allows either, so the translation keeps ‘their’ ambiguous.
    reason: dialect_note
  - marker: '2'
    text: MS reads plural relative ⲛⲉⲧⲙ̄ⲙⲁⲩ (‘those who are there’), normalized by Dilley to singular ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ. The translation uses ‘these are’ to reflect the plural sense.
    reason: textual_variant
  - marker: '3'
    text: ‘Belly’ (ⲡϩⲏ) is concrete and earthy; alternatives ‘stomach’ or ‘gut’ are possible. The verb ⲥⲓⲟ can mean ‘be satisfied, be filled’; ‘be filled’ is chosen to keep the concrete image with ‘belly.’
    reason: lexical_alternative
  - marker: a
    text: Or 'Blessed is the one whom they have persecuted in their heart; these are the ones who have truly known the Father. Blessed is the one who has gone hungry'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “마음에서 박해를 받은 사람들은 복이 있습니다. 그들은 참으로 아버지를 알게 된 사람들입니다. 배고픈 사람들은 복이 있습니다. 그 배는 원하는 이의 것으로 채워질 것이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “마음에서 박해를 받는 사람들은 복이 있습니다. 그들은 참으로 아버지를 알게 된 사람들입니다. 배고픈 사람들은 복이 있습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  english_pob_choice: Blessed
  chosen_korean: 복이 있습니다
  alternatives_korean:
  - 복되다
  - 행복합니다
  lexicon: Crum; Greek loan (makarios) in Coptic
  rationale: 토마스복음의 축복 선언 형식을 살리면서도 현대 합쇼체에 맞게 자연스럽고 엄숙하게 옮겼습니다.
- source_word: ⲇⲓⲱⲕⲉ
  english_pob_choice: persecuted
  chosen_korean: 박해를 받은
  alternatives_korean:
  - 핍박을 받은
  - 추격을 받은
  lexicon: Crum; Greek loan diōkō
  rationale: 중립적 ‘따르다/뒤쫓다’가 아니라 적대적 폭력성을 지닌 ‘박해’를 택해 원문의 강한 뉘앙스를 보존했습니다.
- source_word: ϩⲣⲁⲓ ϩⲛⲡⲉⲩϩⲏⲧ
  english_pob_choice: in their heart
  chosen_korean: 마음에서
  alternatives_korean:
  - 그들의 마음 안에서
  - 그들 마음속에서
  lexicon: Crum (ϩⲏⲧ ‘heart’)
  rationale: Coptic이 허용하는 모호성을 완전히 해소하지 않고, 박해가 ‘마음에서’ 일어났다는 직역적 공간감을 살려 양가적 가능성을 열어 두었습니다.
- source_word: ⲡⲉⲓⲱⲧ
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 그 아버지
  - 하느님 아버지
  lexicon: Crum (ⲓⲱⲧ ‘father’)
  rationale: 토마스복음의 신학적 제목이지만 문장 안에서는 Coptic의 단순한 호칭을 따라 ‘아버지’로 두어 과도한 해석을 피했습니다.
- source_word: ⲛⲉⲧϩⲕⲁⲉⲓⲧ
  english_pob_choice: those who have gone hungry
  chosen_korean: 배고픈 사람들
  alternatives_korean:
  - 굶주린 사람들
  - 배고픔을 겪은 사람들
  lexicon: Crum (ϩⲕⲟ ‘to be hungry’)
  rationale: 원문의 상태/경험을 간결하게 살리면서도 한국어에서 가장 자연스러운 복수 표현으로 옮겼습니다.
- source_word: ⲡϩⲏ
  english_pob_choice: belly
  chosen_korean: 그 배
  alternatives_korean:
  - 배
  - 복부
  lexicon: Crum (ϩⲏ ‘belly, abdomen, stomach’)
  rationale: 토마스 특유의 육체적이고 구체적인 이미지를 유지하기 위해 ‘배’를 택했습니다.
- source_word: ⲟⲩⲱϣ
  english_pob_choice: desires
  chosen_korean: 원하는 이
  alternatives_korean:
  - 갈망하는 이
  - 원하는 사람
  lexicon: Crum (ⲟⲩⲱϣ ‘wish, desire’)
  rationale: 주어적 분사성을 살려 ‘원하는 이’로 옮기고, 소망/욕구의 내적 지향을 유지했습니다.
theological_decisions:
- issue: 복 있는 사람들의 범위를 복수로 유지할지, 단수로 일반화할지
  chosen_reading: 복수 주어를 유지하여 ‘사람들’로 번역했습니다.
  alternative_readings:
  - 복이 있는 사람은
  - 복된 이는
  rationale: 사본과 영어 주석이 모두 복수형을 지지하므로, 개인 일반화보다 공동체적/집합적 선언을 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 본문의 문법적 수(복수형) 보존
- issue: ‘마음에서 박해를 받은’의 모호성 처리
  chosen_reading: 박해의 장소를 ‘마음에서’로 남겨 두어, 박해받는 이의 내면 또는 박해자의 마음 중 어느 쪽인지 단정하지 않았습니다.
  alternative_readings:
  - 마음속에서 박해를 받은
  - 그들의 마음에서 박해를 받은
  rationale: 영어 POB가 지적한 대로 Coptic은 양쪽 가능성을 모두 허용하므로, 해석을 확정하지 않고 긴장을 보존하는 편이 소스-기반입니다.
  doctrine_reference: 애매성 보존 원칙
