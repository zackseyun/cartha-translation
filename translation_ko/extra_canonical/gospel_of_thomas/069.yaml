  verdict: revise
  source_fidelity: 첫째 복 선언의 복수형은 사본의 복수 상대형 및 지시형에 맞게 잘 보존되었습니다. ‘마음에서’는 소유·지시 대상이 불확정적인 원문의 모호성을 비교적 절제되게 남깁니다. 그러나 마지막 절의 ⲡϩⲏ ⲛⲡⲉⲧⲉⲣⲉⲟⲩⲱϣ는 ‘원하는 이의 배’이지 ‘그 배가 원하는 이의 것’이라는 뜻이 아닙니다. 또한 ϩⲓⲛⲁ는 목적/귀결을 나타내므로 ‘~이기 때문입니다’보다 ‘~채워지도록’이 적절합니다.
