  terminology: ‘복이 있습니다’, ‘박해’, ‘아버지’, ‘배’는 현대 한국어 합쇼체와 본문의 격조에 적합합니다. ‘배고픈 사람들’은 사본의 복수 상태형을 자연스럽게 반영합니다.
