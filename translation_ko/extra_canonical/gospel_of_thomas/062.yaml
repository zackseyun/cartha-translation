base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
  footnotes:
  - marker: '1'
    text: The manuscript is damaged here; '[who are worthy]' (ⲛⲉ[ⲧⲙⲡϣⲁ]) and '[my]' (ⲛ[ⲛⲁ]) are standard restorations based on context and early Christian parallels (e.g., Clement of Alexandria, Stromata 5.10.63).
    reason: textual_variant
  - marker: '2'
    text: The Coptic uses ⲉⲓ̈ϫⲱ (eijō) for 'I tell', a dialectal First Present form where standard Sahidic would use ϯϫⲱ (tijō).
    reason: dialect_note
  - marker: '3'
    text: The Coptic uses ⲙⲛ̄ⲧⲣⲉ- (mntre-), a variant spelling of the standard Sahidic negative causative imperative ⲙⲡⲣⲧⲣⲉ- (mprtre-).
    reason: dialect_note
  - marker: '4'
    text: Unlike the canonical parallel in Matthew 6:3, which applies this saying to giving alms in secret, Thomas places it immediately after a statement about esoteric mysteries, reframing the saying as an instruction on spiritual secrecy.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「나는 내 비밀들을 내 비밀들에 합당한 이들에게 말합니다. 네 오른손이 하는 일을 네 왼손이 알지 못하게 하십시오」.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문은 ‘내 비밀들’(ⲛⲁⲙⲩⲥⲧⲏⲣⲓⲟⲛ)의 복수형을 사용하므로, 단수 ‘비밀’이 아니라 복수 ‘비밀들’로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 직역상 ‘오른손이 할 일’ 뒤의 절은 병행 본문 마태복음 6:3의 구제 맥락을 따르지 않고, 토마스복음에서는 비밀 보존의 말로 배치됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲩⲥⲧⲏⲣⲓⲟⲛ
  english_pob_choice: mysteries
  chosen_korean: 비밀들
  alternatives_korean:
  - 신비들
  - 비밀
  lexicon: Crum 202a; BDAG 661
  rationale: Coptic의 그리스어 차용어 ⲙⲩⲥⲧⲏⲣⲓⲟⲛ을 ‘신비’보다 직접적인 ‘비밀’로 옮겨, 토마스복음의 은밀한 전달이라는 문맥을 살렸습니다. 복수 표지도 함께 반영했습니다.
- source_word: ⲛⲉ[ⲧⲙⲡϣⲁ]
  english_pob_choice: who are worthy
  chosen_korean: 합당한 이들
  alternatives_korean:
  - 가치 있는 이들
  - 마땅한 이들
  lexicon: Crum 131b
  rationale: 복원된 ⲙⲡϣⲁ는 ‘합당하다/가치 있다’의 뜻이므로, 인격적·자격적 적합성을 드러내는 ‘합당한 이들’로 옮겼습니다.
- source_word: ⲟⲩⲛⲁⲙ
  english_pob_choice: right hand
  chosen_korean: 오른손
  alternatives_korean:
  - 오른쪽 손
  - 우편
  lexicon: Crum 483a
  rationale: 직역하면 ‘오른손’이며, 마태복음 병행구의 관용적 의미를 유지하되 토머스의 소수언적 문맥에 맞게 자연스럽게 표현했습니다.
- source_word: ϩⲃⲟⲩⲣ
  english_pob_choice: left hand
  chosen_korean: 왼손
  alternatives_korean:
  - 좌수
  - 왼쪽 손
  lexicon: Crum 656b
  rationale: 대구를 이루는 표준어 표현으로 ‘왼손’을 택해, 오른손/왼손의 평행구조를 분명하게 했습니다.
theological_decisions:
- issue: 마태복음 6:3의 시혜 맥락을 토마스 본문에 끌어올지 여부
  chosen_reading: 이 구절을 비밀의 전달과 자기-보호적 은밀성에 관한 독립 격언으로 유지했습니다.
  alternative_readings:
  - 구제 시 비밀 유지에 대한 교훈으로 이해
  - 수도적 은닉 또는 금욕 규범으로 확장
  rationale: 토마스 본문은 ‘비밀들’ 바로 뒤에 이 말을 배치해, 자선행위가 아니라 비밀을 지키는 태도로 재맥락화합니다. 그래서 마태복음의 구체적 적용을 번역에 주입하지 않았습니다.
  doctrine_reference: 비정경 문헌의 문맥 우선 원칙
