base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
  footnotes:
  - marker: '1'
    text: The clause 'the place where the light came into being by itself, stood, and was revealed' preserves three terse verbs (ϣⲱⲡⲉ, ⲟⲩⲱϩⲉ, ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ). The intervening prepositional phrase at NHAM02.41 lb35 is partially restored and its force ('for itself' / 'to itself') is uncertain.
    reason: lacuna_or_restoration
  - marker: '2'
    text: '''Their image'' translates ⲡⲉⲩϩⲓⲕⲱⲛ. The antecedent of ''their'' is ambiguous in context and has been left unresolved rather than harmonized to ''his'' or ''its''.'
    reason: textual_variant
  - marker: '3'
    text: '''The chosen'' renders ⲡⲥⲱⲧⲡ; ''the elect'' is an equally possible gloss that carries stronger traditional connotations.'
    reason: lexical_alternative
  - marker: '4'
    text: '''Movement'' renders ⲕⲓⲙ; ''motion'' is a viable alternative. ''Rest'' renders ⲁⲛⲁⲡⲁⲩⲥⲓⲥ; ''repose'' is a stylistic alternative often used in Thomas translations.'
    reason: lexical_alternative
  - marker: '5'
    text: The question 'Are you it?' reflects an elliptical Coptic copular construction (ⲛⲧⲱⲧⲛ ⲡⲉ) with an implied predicate; the translation preserves the abruptness.
    reason: dialect_note
  - marker: a
    text: Or 'From where have you come forth?'.
    reason: previous_rendering
  - marker: b
    text: Or 'What is the sign of your father in you?'.
    reason: previous_rendering
  - marker: c
    text: Or 'It is a movement and a rest.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「만일 그들이 여러분에게 ‘너희는 어디에서 생겨났느냐?’ 하고 묻거든, 그들에게 말하십시오. ‘우리는 빛으로부터 나왔습니다 — 빛이 스스로 생겨나고, 서 있었으며, 그들의 형상 안에서 드러난 그 자리로부터입니다.’ 만일 그들이 여러분에게 ‘너희가 그것이냐?’ 하고 묻거든, ‘우리는 그것의 자녀이며, 살아 계신 아버지의 택하심을 받은 자들입니다.’라고 말하십시오. 그리고 만일 그들이 여러분에게 ‘여러분 안에 계신 여러분의 아버지의 표지는 무엇입니까?’ 하고 묻거든, 그들에게 말하십시오. ‘그것은 움직임과 쉼입니다.’」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희는 어디서 나왔느냐?’.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘여러분 안에 계신 여러분의 아버지의 표지는 무엇입니까?’.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘그것은 하나의 움직임과 하나의 쉼입니다.’.
    reason: previous_rendering
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  english_pob_choice: come into being / come forth
  chosen_korean: 생겨나다 / 나다
  alternatives_korean:
  - 나오다
  - 생기다
  lexicon: Crum s.v. ϣⲱⲡⲉ; Lambdin §126
  rationale: 원문은 단순 이동이 아니라 존재의 발생과 출현을 가리키므로, 첫 질문의 기원은 ‘생겨나다’로, 빛의 경우는 ‘생겨나고’로 옮겨 원문의 존재론적 뉘앙스를 살렸습니다.
- source_word: ⲡⲟⲩⲟⲉⲓⲛ / ϩⲛⲡⲟⲩⲟⲉⲓⲛ
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  lexicon: Crum s.v. ⲟⲩⲟⲉⲓⲛ
  rationale: Thomas의 우주론적 문맥에서 ⲟⲩⲟⲉⲓⲛ은 기본적으로 ‘빛’이 가장 직역적이며, 한국어에서도 충분히 신학적·상징적 힘을 유지합니다.
- source_word: ⲡⲥⲱⲧⲡ
  english_pob_choice: the chosen
  chosen_korean: 택하심을 받은 자들
  alternatives_korean:
  - 선택된 자들
  - 택자들
  lexicon: Crum s.v. ⲥⲱⲧⲡ
  rationale: ⲥⲱⲧⲡ의 ‘chosen’ 의미를 살리되, 한국어에서 명사형 ‘택자들’보다 문맥상 자연스럽고 소유 관계도 드러나는 ‘택하심을 받은 자들’로 풀었습니다.
- source_word: ⲡⲉⲓⲱⲧ ⲉⲧⲉⲣⲉⲱⲛϩ
  english_pob_choice: the living father
  chosen_korean: 살아 계신 아버지
  alternatives_korean:
  - 살아 있는 아버지
  - 생명의 아버지
  lexicon: Crum s.v. ⲓⲱⲧ; Layton Grammar §188
  rationale: 원문의 관형절은 아버지를 ‘살아 계신’ 분으로 규정하므로, 한국어 신학 문맥에 맞는 존칭 표현을 사용하되, 인격적 현존을 약화시키지 않도록 했습니다.
- source_word: ⲕⲓⲙ / ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  english_pob_choice: movement and rest
  chosen_korean: 움직임과 쉼
  alternatives_korean:
  - 운동과 휴식
  - 움직임과 안식
  lexicon: Crum s.v. ⲕⲓⲙ; Crum s.v. ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  rationale: 추상명사 두 개를 대구로 배치한 짧은 문장 구조를 살려, 보다 현대적이면서도 과도하게 교회어화되지 않은 ‘움직임과 쉼’으로 옮겼습니다.
theological_decisions:
- issue: ‘그것’의 지시 대상과 대명사 처리
  chosen_reading: ‘그것’은 앞선 ‘빛’을 가리키는 중성적 지시로 유지하고, ‘그들의 형상’도 원문의 복수 소유를 그대로 살렸습니다.
  alternative_readings:
  - ‘그분’으로 인격화하기
  - ‘그의 형상’으로 단수화하기
  rationale: 원문은 지시 대상을 명시적으로 단수 인격자로 고정하지 않으며, POB 주석도 대명사의 선행사가 모호하다고 지적합니다. 따라서 해석을 평준화하지 않고 모호성을 보존했습니다.
  doctrine_reference: 문학적-신학적 모호성 보존 원칙
- issue: ‘그것의 자녀’와 ‘택하심을 받은 자들’의 병렬
  chosen_reading: 두 구를 병렬로 유지해, 자기 동일성 선언과 선택받음의 선언을 함께 드러냈습니다.
  alternative_readings:
  - 한 구만 번역해 간명화하기
  - ‘선택된 자들’로만 옮기기
  rationale: 토마스 복음서의 응축된 자기 규정은 여러 칭호를 병렬로 제시하므로, 이를 단순화하지 않고 그대로 유지하는 것이 원문의 강도를 보존합니다.
  doctrine_reference: 본문 수사 보존 원칙
