base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/032.yaml
  text: Jesus said[1], "A city built upon a high mountain and fortified cannot fall[3][2], nor will it be able to be hidden."
  footnotes:
  - marker: '1'
    text: The Greek fragment of this saying (P.Oxy. 1) reads 'upon the top of a high mountain' (ἐπ' ἄκρον ὄρους ὑψηλοῦ), whereas the Coptic lacks 'the top of'.
    reason: textual_variant
  - marker: '2'
    text: The Coptic shifts to the future tense for the final clause (ⲥⲛⲁϣϩⲱⲡ⳿ ⲁⲛ, 'nor will it be able to be hidden'), whereas the Greek fragment uses the present tense for both verbs ('can neither fall nor be hidden').
    reason: textual_variant
  - marker: '3'
    text: Compare Matthew 5:14 ('A city built on a hill cannot be hid'). Thomas combines this saying with the imagery of the house built on rock that does not fall (Matthew 7:24-25).
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "높은 산 위에 세워지고 요새화된 도성은 무너질 수 없으며, 숨겨질 수도 없습니다."[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 사본의 그리스어 단편은 '높은 산의 꼭대기 위에'(ἐπ' ἄκρον ὄρους ὑψηλοῦ)라고 읽지만, 콥트어 본문에는 '꼭대기'에 해당하는 말이 없습니다.
    reason: textual_variant
  - marker: b
    text: 콥트어는 마지막 절에서 미래형과 가능성 부정을 사용해 '숨겨질 수도 없다'는 뜻을 분명히 합니다.
    reason: textual_variant
  - marker: c
    text: 이 말은 마태복음 5:14의 '산 위에 세운 동성' 이미지와, 마태복음 7:24-25의 무너지지 않는 집 이미지가 결합된 형태입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓ︤ⲥ︥ / ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 이르셨습니다
  - 예수님께서 말씀하셨습니다
  lexicon: Coptic peje + proper name Jesus
  rationale: 서술 동사를 직접 보고식으로 옮기되, 본문 인물 호칭은 표준적인 인명형을 사용해 한국어 합쇼체 흐름을 유지했습니다.
- source_word: ⲡⲟⲗⲓⲥ
  english_pob_choice: city
  chosen_korean: 도성
  alternatives_korean:
  - 도시
  - 성읍
  lexicon: Crum 268b
  rationale: 본문의 이미지는 단순한 행정 도시보다 성벽/방어를 떠올리게 하므로, 방어적 뉘앙스를 살릴 수 있는 '도성'을 택했습니다.
- source_word: ⲉϥϫⲟⲥⲉ
  english_pob_choice: high
  chosen_korean: 높은
  alternatives_korean:
  - 높이 있는
  - 고지에 있는
  lexicon: Crum 785a
  rationale: 산을 수식하는 상태 표현으로, 영어 POB의 'high'에 맞게 자연스러운 관형형 '높은'으로 옮겼습니다.
- source_word: ⲉⲥⲧⲁϫⲣⲏⲩ
  english_pob_choice: fortified
  chosen_korean: 요새화된
  alternatives_korean:
  - 견고한
  - 튼튼하게 세워진
  lexicon: Crum 461b
  rationale: 도성을 설명하는 상태형으로 'made firm'보다 방어 시설을 드러내는 '요새화된'이 본문의 군사적 이미지를 더 분명히 전달합니다.
- source_word: ⲙⲛ̄ϭⲟⲙ ⲛ̄ⲥϩⲉ
  english_pob_choice: cannot fall
  chosen_korean: 무너질 수 없으며
  alternatives_korean:
  - 떨어질 수 없으며
  - 무너질 힘이 없으며
  lexicon: Crum 652b
  rationale: 직역상의 '떨어지다'보다 도시/성채에 자연스러운 한국어 동사 '무너지다'가 문맥의 파괴 불가능성을 더 정확히 드러냅니다.
- source_word: ⲥⲛⲁϣϩⲱⲡ ⲟⲛ
  english_pob_choice: nor will it be able to be hidden
  chosen_korean: 숨겨질 수도 없습니다
  alternatives_korean:
  - 숨겨질 수 없으며
  - 감출 수도 없습니다
  lexicon: Crum 695a
  rationale: 미래 가능 불능 표현을 한국어의 '수도 없습니다'로 옮겨, Coptic의 미래형과 가능성 부정을 함께 반영했습니다.
theological_decisions:
- issue: Thomas 32의 이중 진술(붕괴 불가능 + 은폐 불가능)을 어떻게 보존할 것인가
  chosen_reading: '''무너질 수 없으며, 숨겨질 수도 없습니다''로 두 불가능성을 모두 병렬로 유지했습니다.'
  alternative_readings:
  - '''무너질 수 없고 숨겨질 수도 없습니다'''
  - '''무너지지도 숨겨지지도 않습니다'''
  rationale: 본문은 마태복음의 유사구절보다 '무너짐'과 '숨김 불가'를 함께 말하므로, 두 진술을 분리해 번역해야 토마스복음의 확장된 표현이 지워지지 않습니다.
  doctrine_reference: Gospel of Thomas 32; Matthew 5:14; Matthew 7:24-25
