base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
  footnotes:
  - marker: '1'
    text: ⲡⲙⲛⲧⲣⲣⲟ can be rendered ‘kingdom’; ‘kingship’ reflects the abstract ‘reign/rule’ nuance (Crum; Layton).
    reason: lexical_alternative
  - marker: '2'
    text: The ms line-level shows ⲧⲏ ‘there’; the normalized line prints ⲡⲏ ‘sky/heaven.’ The deictic pairing ‘here/there’ fits the immediate syntax; ‘heaven’ would be contextually awkward here.
    reason: textual_variant
  - marker: '3'
    text: ‘Earth’ (ⲡⲕⲁϩ) can also mean ‘land.’ The image is of something already diffused across the ground.
    reason: cultural_note
  - marker: a
    text: Or 'He said,'.
    reason: previous_rendering
translation:
  language: ko
  text: '그의 제자들이 그에게 말했습니다. 「하나님의 나라는 어느 날에 오십니까?」


    [그가 말씀하셨습니다.] 「그것은 지켜본다고 해서 오지 않습니다. 사람들은 ‘보라, 여기다!’ 하거나 ‘보라, 저기다!’ 하지는 않을 것입니다. 오히려 아버지의 나라는 땅 위에 퍼져 있는데, 사람들은 그것을 보지 못합니다.」[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문에는 응답을 직접 이끄는 서술동사가 없으므로, 한국어에서는 읽기 편의를 위해 보충했음을 나타냅니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  english_pob_choice: kingship
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 통치
  - 왕국
  lexicon: Crum; Layton
  rationale: Coptic의 추상명사형은 ‘왕의 다스림/통치’ 뉘앙스를 가지지만, 한국어에서는 너무 추상적인 ‘왕권’보다 문맥상 도래하는 실재를 가리키는 ‘나라’가 자연스럽고, 본문 전체의 종말론적 질문에도 잘 맞습니다.
- source_word: ϭⲱϣⲧ
  english_pob_choice: watching
  chosen_korean: 지켜본다고
  alternatives_korean:
  - 관찰한다고
  - 살핀다고
  lexicon: Crum
  rationale: 외적 표징을 주시하며 찾는 태도를 가리키므로, 단순한 시각행위보다 ‘지켜보다’가 가장 직접적으로 대응합니다.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  english_pob_choice: Look!
  chosen_korean: 보라
  alternatives_korean:
  - 여기다 보라
  - 봐라
  lexicon: Crum
  rationale: 반복되는 감탄형 명령은 한국어 성경문체에서 ‘보라’가 가장 간결하게 힘을 살립니다.
- source_word: ⲡⲓⲥⲁ / ⲧⲏ
  english_pob_choice: here / there
  chosen_korean: 여기 / 저기
  alternatives_korean:
  - 이곳 / 저곳
  - 이리 / 저리
  lexicon: Crum
  rationale: 대조되는 지시 부사로서 구어적이되 본문 어조를 해치지 않는 표준 대응을 택했습니다. 본문 대조구조를 보존하기 위해 ‘여기 / 저기’를 유지했습니다.
- source_word: ⲥⲡⲱⲣϣ
  english_pob_choice: is spread out
  chosen_korean: 퍼져 있는데
  alternatives_korean:
  - 펼쳐져 있는데
  - 흩어져 있는데
  lexicon: Crum
  rationale: 현재적·지속적 상태를 드러내면서도, ‘흩어지다’보다 분포의 넓이를 잘 보여 주는 표현으로 선택했습니다.
- source_word: ϩⲓϫⲛ ⲡⲕⲁϩ
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅에
  - 온 땅에
  - 지면에
  lexicon: Crum
  rationale: ⲡⲕⲁϩ의 기본값은 ‘땅/지면’이며, 여기서는 퍼져 있는 범위를 살리는 ‘땅 위에’가 자연스럽습니다.
- source_word: ⲛⲣⲱⲙⲉ
  english_pob_choice: people
  chosen_korean: 사람들은
  alternatives_korean:
  - 인간들은
  - 사람이
  lexicon: Crum
  rationale: 일반 복수 주어를 중립적으로 옮겼습니다. 남성 중심의 ‘남자들’은 피했습니다.
theological_decisions:
- issue: ‘kingship’의 한국어 처리
  chosen_reading: ‘나라’로 옮기되, 단순한 지리적 영역이 아니라 도래하는 통치 현실로 읽히도록 문맥 전체를 유지했습니다.
  alternative_readings:
  - 왕권
  - 통치
  - 왕국
  rationale: 토마스복음의 해당 문맥은 왕의 지배가 드러나는 방식에 관한 질문이므로, ‘나라’가 가장 넓게 의미를 담으면서도 전통적 교회용어에 갇히지 않습니다.
  doctrine_reference: 하나님의 나라 / 종말론적 통치 이해
- issue: ‘[He said]’의 괄호 처리
  chosen_reading: 응답 동사는 괄호로 보충해 읽기 쉽도록 하되, 본문에 명시되지 않았음을 드러내기 위해 대괄호를 유지했습니다.
  alternative_readings:
  - 그가 말씀하셨습니다.
  - 예수께서 말씀하셨습니다.
  rationale: Coptic 본문은 질문 뒤에 명시적 서술동사를 두지 않으므로, 가독성과 원문 충실성을 함께 지키기 위해 보충을 표시했습니다.
  doctrine_reference: 본문 비가시성 표시 / 서사 보충 원칙
