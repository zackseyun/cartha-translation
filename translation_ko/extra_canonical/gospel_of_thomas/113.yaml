revisions:
- from: '그의 제자들이 그에게 말했습니다. 「하나님의 나라는 어느 날에 오십니까?」


    [그가 말씀하셨습니다.] 「그것은 지켜본다고 해서 오지 않습니다. 사람들은 ‘보라, 여기다!’ 하거나 ‘보라, 저기다!’ 하지는 않을 것입니다. 오히려 아버지의 나라는 땅 위에 퍼져 있는데, 사람들은 그것을 보지 못합니다.」[a]'
  to: '그의 제자들이 그에게 말했습니다. 「그 나라는 어느 날에 옵니까?」


    [그가 말씀하셨습니다.][a] 「그 나라는 관찰한다고 해서 오지 않을 것입니다. 사람들은 ‘보라, 여기에 있다!’ 또는 ‘보라, 저기에 있다!’라고 말하지 않을 것입니다. 오히려 아버지의 나라는 땅 위에 퍼져 있으며, 사람들은 그것을 보지 못합니다.」'
  rationale: 원문에 없는 ‘하나님의’를 삭제하여 첫 질문의 비한정적 표현을 보존하고, 마지막 절의 명시적 ‘아버지의’와 구별했습니다. 미래 부정, 외적 관찰, ‘여기/저기’의 대조, 땅 위에 이미 퍼져 있으나 보지 못한다는 현재적 진술을 유지했습니다. 응답 동사는 원문에 없는 보충임을 대괄호와 인접 각주로 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:17Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 첫 질문의 ⲡⲙⲛⲧⲣⲣⲟ에는 ‘하나님의’라는 소유 표현이 없는데, 초안은 이를 ‘하나님의 나라’로 특정합니다. 또한 결말의 ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ는 명시적으로 ‘아버지의 나라’입니다. 응답 서술동사는 원문에 없으므로 대괄호 보충 및 각주 처리가 적절하되, 각주 표지는 보충된 말 바로 뒤에 두는 편이 정확합니다.
  naturalness: 합쇼체를 유지하면서 질문은 ‘그 나라는 어느 날에 옵니까?’로, 응답은 ‘관찰한다고 해서 오지 않을 것입니다’로 다듬었습니다. 인용문의 ‘보라, 여기다’는 다소 구어적이고 미완결적으로 들릴 수 있어 ‘보라, 여기에 있다’로 자연스럽게 정리했습니다.
  terminology: ⲡⲙⲛⲧⲣⲣⲟ의 추상적 ‘통치/왕권’ 뉘앙스는 있으나, 이 짧은 본문에서는 ‘나라’를 유지할 수 있습니다. 다만 첫 용례에 근거 없이 ‘하나님의’를 첨가하지 않고, 마지막 용례의 ‘아버지의’를 그대로 옮겨 두 용례의 차이를 보존해야 합니다.
  issues:
  - severity: high
    issue: 첫 질문에 ‘하나님의’가 첨가됨
    rationale: 원문 첫 질문은 단지 ‘그 나라/왕권’(ⲡⲙⲛⲧⲣⲣⲟ)이라고 할 뿐 ‘하나님의’ 또는 ‘아버지의’를 명시하지 않습니다. 이를 ‘하나님의 나라’로 특정하면 원문의 표현상 차이를 지웁니다.
  - severity: medium
    issue: ‘아버지의 나라’와 첫 질문의 표현상 대비가 흐려짐
    rationale: 마지막 절에는 ⲛⲡⲉⲓⲱⲧ, 즉 ‘아버지의’가 명시됩니다. 첫 질문을 ‘그 나라’로 옮겨야 원문의 명시성과 비명시성의 대비를 보존합니다.
  - severity: low
    issue: 보충 서술동사 각주의 표지 위치
    rationale: 각주가 가리키는 대상은 대괄호 속 보충 서술동사이므로, 표지를 해당 보충 직후에 두어 각주의 지시 대상을 분명히 합니다.
