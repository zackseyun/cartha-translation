base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/051.yaml
  text: 'His disciples said to him[a], "On what day will the rest of the dead take place, and on what day will the new world come?"

    He said to them, "That which you are expecting has come[b][c], but you yourselves do not know it."'
  footnotes:
  - marker: a
    text: The Coptic uses the feminine demonstrative pronoun ⲧⲏ (tē), which grammatically refers back to the feminine noun 'rest' (ⲁⲛⲁⲡⲁⲩⲥⲓⲥ, anapausis).
    reason: lexical_alternative
    anchor_ref: That which
  - marker: c
    text: The Coptic idiom ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ- literally means 'to look out before' or 'to look forward to'.
    reason: lexical_alternative
    anchor_ref: expecting
  - marker: b
    text: The Coptic uses the independent pronoun ⲛ̄ⲧⲱⲧⲛ̄ before the conjugated verb for emphasis.
    reason: register_note
    anchor_ref: you yourselves
translation:
  language: ko
  text: 그의 제자들이 그에게 말했습니다. "죽은 자들의 남은 때가 언제 일어나며, 새 세상이 언제 옵니까?" 그는 그들에게 말했습니다. "너희가 기대하는 그것은 이미 왔습니다. 그러나 너희 자신은 그것을 알지 못합니다."[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: Coptic ⲧⲏ는 여성 단수 지시대명사로, 앞의 여성명사 ⲁⲛⲁⲡⲁⲩⲥⲓⲥ('rest')를 가리킵니다.
    reason: source_note
  - marker: b
    text: 본문의 동사구 ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-은 문자적으로는 ‘앞을 내다보다’에 가깝지만, 관용적으로 ‘기대하다/고대하다’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  english_pob_choice: On what day
  chosen_korean: 언제
  alternatives_korean:
  - 어느 날에
  - 무슨 날에
  lexicon: Crum 20a
  rationale: 직역하면 ‘어느 날에’이지만, 한국어 질문에서는 시간 부사를 자연스럽게 풀어 ‘언제’로 옮겨도 원문의 특정 시점 질문을 유지할 수 있습니다.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  english_pob_choice: rest
  chosen_korean: 남은 때
  alternatives_korean:
  - 안식
  - 쉼
  lexicon: Crum 12a; BDAG 73
  rationale: 토마스복음의 핵심어인 ‘rest’는 단순한 휴식보다 종말론적 완성 상태를 가리키므로, 본문 맥락에 맞게 ‘남은 때’로 풀어 번역했습니다.
- source_word: ⲃⲃⲣⲣⲉ ⲡⲕⲟⲥⲙⲟⲥ
  english_pob_choice: the new world
  chosen_korean: 새 세상
  alternatives_korean:
  - 새로운 세계
  - 새로운 우주
  lexicon: Crum 42b
  rationale: ⲃⲣⲣⲉ는 ‘새로운’이므로 ‘child’ 같은 오독을 배제하고, ⲕⲟⲥⲙⲟⲥ를 한국어 성경 문체에 맞는 ‘세상’으로 옮겼습니다.
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-
  english_pob_choice: expecting
  chosen_korean: 기대하는
  alternatives_korean:
  - 바라보는
  - 고대하는
  lexicon: Crum 834a
  rationale: 이 관용구는 문자적으로는 ‘내다보며 바라보다’이지만 관용적으로 ‘기대하다/고대하다’의 뜻이므로, 문맥상 가장 직접적인 ‘기대하는’을 선택했습니다.
theological_decisions:
- issue: 이미 임한 실재와 미래 기대의 긴장
  chosen_reading: ‘너희가 기대하는 그것은 이미 왔습니다’로 옮겨, 기대된 종말 사건이 현재에 도래했다는 진술을 유지했습니다.
  alternative_readings:
  - ‘이미 임했습니다’
  - ‘이미 와 있습니다’
  rationale: Coptic perfect ⲁⲥⲉⲓ는 완료된 도착을 말하므로, 토마스복음 특유의 ‘이미 임한’ 종말론을 약화하지 않기 위해 미래형으로 풀지 않았습니다.
  doctrine_reference: 실현된 종말론
