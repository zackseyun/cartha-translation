base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/096.yaml
  text: Jesus said[a], "The Father's kingdom is like a woman. She took a little leaven, hid it in dough, and made it into big loaves. Whoever has ears[c][b], let him hear."
  footnotes:
  - marker: a
    text: ‘Leaven’ (ⲥⲓⲣ) refers to traditional sourdough starter, not modern commercial yeast.
    reason: cultural_note
  - marker: b
    text: ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ can also be read as ‘a large amount of bread’ or ‘many loaves.’ We render ‘big loaves’ to keep the concrete image of size.
    reason: lexical_alternative
  - marker: c
    text: Several letters are damaged or restored in NHAM02.49, but the reading ‘a woman … hid it in dough … made it into big loaves’ is secure (Dilley 2025).
    reason: lacuna_or_restoration
translation:
  language: ko
  text: 예수께서 말씀하셨습니다[a]. "아버지의 나라[b]는 여인과 같습니다. 여인은 작은 누룩[c]을 가져다가 반죽 속에 숨겨 넣고, 그것을 큰 빵덩이들[d]로 만들었습니다. 귀 있는 사람은 들으십시오."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직접 인용 표지는 화자 전환을 분명히 하기 위한 것입니다.
    reason: korean_style_note
  - marker: b
    text: Coptic ⲡⲉⲓⲱⲧ는 직역하면 ‘아버지’이며, 이 단락에서는 일반적 ‘하나님’보다 원문 호칭을 유지하는 편이 더 분명합니다.
    reason: source_note
  - marker: c
    text: ‘누룩’은 현대 상업용 효모가 아니라 전통적 발효종을 가리킵니다.
    reason: cultural_note
  - marker: d
    text: ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ은 ‘큰 빵덩이들’ 또는 ‘많은 빵’로도 읽을 수 있지만, 여기서는 크기 이미지를 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ / kingdom
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 통치
  lexicon: Crum; Layton
  rationale: Thomas의 관용구를 자연스럽게 옮기되, 하나님/아버지의 통치 영역이라는 함의를 살리기 위해 ‘나라’를 택했습니다.
- source_word: ⲥϩⲓⲙⲉ
  english_pob_choice: woman
  chosen_korean: 여인
  alternatives_korean:
  - 여자
  - 아내
  lexicon: Crum
  rationale: 기본 의미는 ‘여자’이지만, 한국어에서 비유적·서사적 문맥에 더 자연스러운 ‘여인’을 사용했습니다.
- source_word: ⲥⲓⲣ
  english_pob_choice: leaven
  chosen_korean: 누룩
  alternatives_korean:
  - 발효종
  - 이스트
  lexicon: Crum
  rationale: 고대 제빵 맥락을 보존하는 표준어는 ‘누룩’이며, 현대 상업용 이스트로 오해될 수 있는 표현은 피했습니다.
- source_word: ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ
  english_pob_choice: big loaves
  chosen_korean: 큰 빵덩이들
  alternatives_korean:
  - 큰 빵
  - 많은 빵덩이
  - 큰 빵조각들
  lexicon: Crum; Layton
  rationale: POB의 ‘big loaves’처럼 크기 이미지를 살리면서도, 복수성과 구체성을 보존하기 위해 ‘빵덩이들’로 옮겼습니다.
- source_word: ⲙⲁⲁϫⲉ
  english_pob_choice: ears
  chosen_korean: 귀
  alternatives_korean:
  - 귀들
  - 청력
  lexicon: Crum
  rationale: 관용적 경구 ‘귀 있는 사람’의 핵심 이미지를 유지하기 위해 단수형 명사 ‘귀’를 썼습니다.
theological_decisions:
- issue: ‘하늘의 나라’/‘하나님의 나라’ 대신 ‘아버지의 나라’의 유지
  chosen_reading: 본문의 ⲡⲉⲓⲱⲧ(the Father)를 따라 ‘아버지의 나라’로 직역했습니다.
  alternative_readings:
  - 하나님의 나라
  - 아버지의 통치
  rationale: 이 구절은 일반적인 신학 용어보다 ‘아버지’라는 호칭을 전면에 내세우므로, 익숙한 정형구로 흡수하지 않고 원문의 표지를 보존하는 편이 더 충실합니다.
  doctrine_reference: 본문-기반 호칭 보존
- issue: 청유문 ‘let him hear’의 한국어 처리
  chosen_reading: ‘귀 있는 사람은 들으십시오’로 번역해 포고문형 권면을 유지했습니다.
  alternative_readings:
  - 들어라
  - 들을지어다
  rationale: 합쇼체 본문 안에서 명령의 강도를 유지하면서도 현대 한국어의 공적·문학적 문체에 맞추었습니다.
  doctrine_reference: 문체 일관성
