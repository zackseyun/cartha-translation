base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
  footnotes:
  - marker: a
    text: The text abruptly shifts into the third person, quoting Jesus as an external authority. This meta-commentary is unique in the Gospel of Thomas and strongly suggests a compiler's gloss or a later redactional layer that has been incorporated into the text.
    reason: textual_variant
    anchor_ref: Does not Jesus say
  - marker: b
    text: Coptic ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ. The word ⲟⲩⲁⲁϥ functions grammatically as a reflexive ('himself'), but given Thomas's theology of the solitary (monachos), it also carries the resonance of 'finds himself alone.'
    reason: lexical_alternative
    anchor_ref: finds himself
translation:
  language: ko
  text: '예수께서 말씀하셨습니다[a]. "하늘은 너희 앞에서 말려 올라가고, 땅도 그러하며, 살아 있는 이로부터 살아나는 이는 죽음을 보지 않을 것입니다."


    예수께서 이렇게 말씀하지 않으셨습니까? "자기 자신을 찾은 사람은[b] 세상이 그에게 합당하지 않습니다."'
  philosophy: formal
  footnotes:
  - marker: a
    text: 본문은 갑자기 3인칭 인용 형식으로 전환되며, 토마스복음 안에서 드문 메타적 주석처럼 보입니다.
    reason: textual_variant
  - marker: b
    text: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ는 문법적으로 재귀 의미를 가지며, ‘홀로 된 사람’이라는 여운도 함께 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲏⲩⲉ / ⲡⲕⲁϩ
  english_pob_choice: the heavens / the earth
  chosen_korean: 하늘 / 땅
  alternatives_korean:
  - 하늘들 / 대지
  - 하늘과 땅
  lexicon: Crum
  rationale: 병렬된 두 주어를 자연스러운 현대 한국어로 옮기되, 종말론적 장면의 상투적 표현인 ‘하늘과 땅’을 유지했습니다.
- source_word: ϭⲱⲗ
  english_pob_choice: roll up
  chosen_korean: 말려 올라가고
  alternatives_korean:
  - 돌돌 말리고
  - 말려 올라가며
  lexicon: Crum
  rationale: ‘말다/말려 올라가다’는 두루마리가 말리듯 하늘이 접혀 올라가는 이미지를 비교적 직접적으로 살립니다.
- source_word: ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  english_pob_choice: presence
  chosen_korean: 앞에서
  alternatives_korean:
  - 임재 안에서
  - 면전에서
  lexicon: Crum
  rationale: ‘너희 앞에서’는 Coptic의 ‘presence/before you’ 의미를 현대 한국어로 가장 간결하게 전달합니다.
- source_word: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ
  english_pob_choice: finds himself
  chosen_korean: 자기 자신을 찾은 사람
  alternatives_korean:
  - 자기 자신을 발견한 사람
  - 홀로 된 사람
  lexicon: Crum
  rationale: 본문의 재귀적 의미를 살리면서도, 토마스복음에서 암시되는 ‘홀로 됨’의 뉘앙스는 직설적으로 과잉해석하지 않도록 했습니다.
theological_decisions:
- issue: ‘the one who lives from the living one’의 정체성
  chosen_reading: 살아 있는 이로부터 살아나는 이는
  alternative_readings:
  - 살아 계신 이로부터 생명을 받는 이는
  - 살아 있는 분으로부터 사는 이는
  rationale: 문구가 의도적으로 모호하므로, 특정 신학적 동일시를 단정하지 않고 동작 중심의 직역에 가깝게 유지했습니다.
  doctrine_reference: Gospel of Thomas 111의 모호한 생명-기원 언어
