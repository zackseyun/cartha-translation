base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/082.yaml
  text: Jesus said[a], “The one who is near me is near the fire[c][b], and the one who is far from me is far from the kingdom.”
  footnotes:
  - marker: a
    text: ‘Kingdom’ translates Coptic ⲙⲛⲧⲣⲣⲟ, which can also mean ‘kingship’ or ‘royal rule.’
    reason: lexical_alternative
  - marker: b
    text: The manuscript has ‘to me’ (ⲉⲣⲟⲓ) / ‘from me’ (ⲙ̄ⲙⲟⲓ); Dilley normalizes these with independent pronouns. The article with ‘kingdom’ varies (ⲧ-/ⲡ-).
    reason: textual_variant
  - marker: c
    text: Compare the ‘fire’ imagery in Luke 12:49 for thematic resonance, though the saying here is distinct.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “내게 가까이 있는 사람은 불[c]에 가깝고, 내게서 먼 사람은 나라[a]에서 멉니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나라’는 콥트어 ⲙⲛⲧⲣⲣⲟ를 옮긴 것으로, ‘왕권’이나 ‘통치’라는 뜻도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 필사본은 ‘내게’(ⲉⲣⲟⲓ)와 ‘내게서’(ⲙ̄ⲙⲟⲓ)에 해당하는 접어형 대명사를 읽습니다. 정규화본은 이를 독립대명사를 사용한 구조로 풀어 적습니다. ‘나라’ 앞 관사도 ⲧ-와 ⲡ-로 차이가 납니다.
    reason: textual_variant
  - marker: c
    text: ‘불’의 이미지는 누가복음 12:49의 불 이미지와 주제적으로 비교할 수 있으나, 이 발언은 그 본문과는 별개입니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉⲧϩⲏⲛ / ⲡⲉⲧⲉⲣⲉϩⲱⲛ
  english_pob_choice: the one who is near
  chosen_korean: 가까이 있는 사람
  alternatives_korean:
  - 가까운 사람
  - 내 곁에 있는 사람
  lexicon: Crum; Layton
  rationale: 상태적 ‘가까움’을 나타내므로 ‘가까이 있는 사람’으로 옮겨, 이동보다 관계적/공간적 근접성을 살렸습니다.
- source_word: ⲉⲣⲟⲓ / ⲙ̄ⲙⲟⲓ
  english_pob_choice: to me / from me
  chosen_korean: 내게 / 내게서
  alternatives_korean:
  - 나에게 / 나로부터
  - 내 곁에 / 내 곁에서
  lexicon: Layton (Grammar)
  rationale: 전치사적 대명사가 향방(향함/떨어짐)을 표시하므로, 방향성을 분명하게 드러내는 조사형 표현을 택했습니다.
- source_word: ⲥⲁⲧⲉ
  english_pob_choice: the fire
  chosen_korean: 불
  alternatives_korean:
  - 불꽃
  - 화염
  lexicon: Crum
  rationale: 기본 의미인 ‘불’이 가장 직접적이며, ‘불꽃’이나 ‘화염’은 이미지를 과도하게 구체화합니다.
- source_word: ⲙⲛⲧⲣⲣⲟ
  english_pob_choice: the kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 통치
  - 왕국
  lexicon: Crum; Layton
  rationale: 이 단어는 ‘왕권/통치/나라’의 뜻이 가능하지만, 한국어에서는 문맥상 가장 자연스럽게 ‘나라’로 옮기되, 지배 영역의 의미를 유지했습니다.
theological_decisions:
- issue: ‘kingdom’의 신학적 격식 여부
  chosen_reading: 본문의 ‘나라’는 대문자화된 교회 용어로 굳히지 않고, 단순히 ‘나라’로 옮겼습니다.
  alternative_readings:
  - 하나님의 나라
  - 왕국
  - 통치
  rationale: 이 속담형 구절은 마태복음식 정식 용례보다 더 일반적인 왕적 영역을 가리킬 수 있어, 원문이 허용하는 범위를 좁히지 않는 번역이 적절합니다.
  doctrine_reference: 용어 선택은 문맥상 의미 범위 보존에 관한 번역 판단입니다.
