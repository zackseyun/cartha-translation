  lexicon: Layton, Coptic Grammar; Crum s.v. ϭⲓⲛⲉ
  rationale: 보편적 관계절의 완료 의미를 살려 ‘찾았고’로 옮기고, 주어는 뒤의 권고문과 연결되도록 처리했습니다.
- source_word: ⲛ̄ⲧⲉⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  english_pob_choice: and become wealthy
  chosen_korean: 부유해진
  alternatives_korean:
  - 크게 된
  - 유력해진
  lexicon: Crum s.v. ⲣⲙⲙⲁⲟ
  rationale: POB의 본문 선택인 ‘wealthy’에 맞추어 물질적 부요를 우선 반영했습니다.
- source_word: ⲙⲁⲣⲉϥⲁⲣⲛⲁ
  english_pob_choice: let that one renounce
  chosen_korean: 그 세계를 버리십시오
  alternatives_korean:
  - 그 세계를 부인하십시오
  - 그 세계를 포기하십시오
  lexicon: Crum s.v. ⲁⲣⲛⲁ
  rationale: ⲁⲣⲛⲁ의 윤리적·결단적 뉘앙스를 살려 단순한 부정이 아니라 적극적 단절로 옮겼습니다.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  english_pob_choice: the world
  chosen_korean: 세계
  alternatives_korean:
  - 세상
  - 우주
  lexicon: Crum s.v. ⲕⲟⲥⲙⲟⲥ
  rationale: Thomas 문맥의 급진성을 살리면서도 한국어에서 ‘world’의 직접 대응으로 읽히는 ‘세계’를 택했습니다.
theological_decisions:
- issue: 명령형의 대상과 화자 거리감
  chosen_reading: 직접 인용 안에서 예수의 명령은 일반 독자에게 향한 권고로 읽히므로 ‘버리십시오’의 합쇼체를 유지했습니다.
  alternative_readings:
  - ‘버리라’로 더 직설적으로 옮김
  - ‘버리게 하십시오’처럼 간접화
  rationale: 합쇼체 본문 원칙을 따르되, 인용문 내부의 명령성을 약화시키지 않았습니다.
  doctrine_reference: 본문 화법/문체 원칙
