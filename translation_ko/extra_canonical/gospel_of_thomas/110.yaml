base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/110.yaml
  text: Jesus said, “Whoever has found the world[b] and become wealthy[a], let that one renounce the world.”
  footnotes:
  - marker: a
    text: Or ‘become great/prominent’; the verb ⲣⲣⲙⲙⲁⲟ can denote becoming rich or becoming great (Crum s.v. ⲣⲙⲙⲁⲟ).
    reason: lexical_alternative
  - marker: b
    text: Dilley restores the preposition [ⲙ̄] before the first ‘world’ due to a small lacuna (NHAM02.51 / lb 4).
    reason: lacuna_or_restoration
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “세계를 찾았고 부유해진 사람은 그 세계를 버리십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲣⲣⲙⲙⲁⲟ는 ‘부유해지다’뿐 아니라 ‘크게/유력하게 되다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 첫 번째 ‘세계’ 앞의 전치사는 작은 결락을 보충한 복원입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 이르셨습니다
  - 예수께서 말씀하셨다
  lexicon: Crum; Coptic quotative formula
  rationale: 서술형 인용 도입 공식을 자연스러운 현대 한국어로 옮기되, 단정한 화법을 유지했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥϭⲓⲛⲉ
  english_pob_choice: whoever has found
  chosen_korean: 세계를 찾았고
  alternatives_korean:
  - 세계를 찾은 사람은
  - 세계를 발견한 이는
  lexicon: Layton, Coptic Grammar; Crum s.v. ϭⲓⲛⲉ
  rationale: 보편적 관계절의 완료 의미를 살려 ‘찾았고’로 옮기고, 주어는 뒤의 권고문과 연결되도록 처리했습니다.
- source_word: ⲛ̄ⲧⲉⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  english_pob_choice: and become wealthy
  chosen_korean: 부유해진
  alternatives_korean:
  - 크게 된
  - 유력해진
  lexicon: Crum s.v. ⲣⲙⲙⲁⲟ
  rationale: POB의 본문 선택인 ‘wealthy’에 맞추어 물질적 부요를 우선 반영했습니다.
- source_word: ⲙⲁⲣⲉϥⲁⲣⲛⲁ
  english_pob_choice: let that one renounce
  chosen_korean: 그 세계를 버리십시오
  alternatives_korean:
  - 그 세계를 부인하십시오
  - 그 세계를 포기하십시오
  lexicon: Crum s.v. ⲁⲣⲛⲁ
  rationale: ⲁⲣⲛⲁ의 윤리적·결단적 뉘앙스를 살려 단순한 부정이 아니라 적극적 단절로 옮겼습니다.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  english_pob_choice: the world
  chosen_korean: 세계
  alternatives_korean:
  - 세상
  - 우주
  lexicon: Crum s.v. ⲕⲟⲥⲙⲟⲥ
  rationale: Thomas 문맥의 급진성을 살리면서도 한국어에서 ‘world’의 직접 대응으로 읽히는 ‘세계’를 택했습니다.
theological_decisions:
- issue: 명령형의 대상과 화자 거리감
  chosen_reading: 직접 인용 안에서 예수의 명령은 일반 독자에게 향한 권고로 읽히므로 ‘버리십시오’의 합쇼체를 유지했습니다.
  alternative_readings:
  - ‘버리라’로 더 직설적으로 옮김
  - ‘버리게 하십시오’처럼 간접화
  rationale: 합쇼체 본문 원칙을 따르되, 인용문 내부의 명령성을 약화시키지 않았습니다.
  doctrine_reference: 본문 화법/문체 원칙
