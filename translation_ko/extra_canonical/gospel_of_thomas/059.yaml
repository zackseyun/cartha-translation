base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
  footnotes:
  - marker: a
    text: “Seek after” renders ϭⲱϣⲧ with ⲛⲥⲁ; alternatives include “seek” or “search.”
    reason: lexical_alternative
  - marker: b
    text: “Living One” translates the relative phrase ⲡⲉⲧⲉⲣⲉⲱⲛϩ; literally, “the one who is living.”
    reason: lexical_alternative
  - marker: c
    text: The negative purpose construction (ϩⲓⲛⲁ ϫⲉ … ⲛⲛⲉ … ⲙⲟⲩ) can be rendered “so that you do not die” or more compactly “lest you die.”
    reason: lexical_alternative
  - marker: d
    text: ϣⲓⲛⲉ can mean “seek” or “try”; “try to see” brings out the nuance of attempted action distinct from the initial ϭⲱϣⲧ.
    reason: lexical_alternative
  - marker: e
    text: ϣϭⲙϭⲟⲙ literally “be strong,” idiomatically “be able,” commonly followed by ⲛⲁ + infinitive (here, ⲛⲁ ⲉⲛⲁⲩ, “to see”).
    reason: cultural_note
  - marker: f
    text: The manuscript’s ⲉⲣⲟϥ is a common object-marker form; Dilley’s normalized text uses ⲉⲛⲧⲟϥ. Both mean “him.”
    reason: dialect_note
  - marker: g
    text: Or 'try to see him'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “살아 있는 이[a]를, 여러분이 살아 있는 동안[b] 찾아보십시오. 그러면 여러분이 죽지 않도록 하려는 것입니다[c]. 그리고 그를 보려고 찾아보게 되겠지만[d], 볼 수 없을 것입니다[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲉⲧⲉⲣⲉⲱⲛϩ는 문자적으로 “살아 있는 이”입니다.
    reason: lexical_alternative
  - marker: b
    text: ϩⲱⲥ ⲉⲣⲉ…ⲱⲛϩ는 “~하는 동안”의 시간적 의미로 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ϩⲓⲛⲁ ϫⲉ … ⲛⲛⲉ … ⲙⲟⲩ는 “죽지 않도록/죽지 않게”라는 부정 목적을 나타냅니다.
    reason: lexical_alternative
  - marker: d
    text: ϣⲓⲛⲉ는 여기서 ‘찾다’보다 ‘찾아보다/찾으려 하다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: ϣϭⲙϭⲟⲙ은 문자적으로 ‘강하다’이지만 관용적으로 ‘~할 수 있다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱϣⲧ ⲛⲥⲁ
  english_pob_choice: seek after
  chosen_korean: 찾아보다
  alternatives_korean:
  - 찾다
  - 구하다
  lexicon: Crum; Layton
  rationale: ⲛⲥⲁ가 붙은 ϭⲱϣⲧ는 단순한 ‘찾다’보다 대상을 향해 추적하듯 ‘찾아보다’가 더 자연스럽고, 한국어에서도 추구의 뉘앙스를 살립니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  english_pob_choice: the Living One
  chosen_korean: 살아 있는 이
  alternatives_korean:
  - 살아 계신 분
  - 생명 있는 이
  lexicon: Layton (relative construction)
  rationale: 직역하면 ‘살아 있는 자/이’에 가까우므로, 존칭 신학어를 덧씌우기보다 Thomas의 중성적 표현을 살려 ‘살아 있는 이’로 옮겼습니다.
- source_word: ϩⲓⲛⲁ ϫⲉ ⲛⲛⲉ … ⲙⲟⲩ
  english_pob_choice: so that you do not die
  chosen_korean: 여러분이 죽지 않도록 하려는 것입니다
  alternatives_korean:
  - 죽지 않게 하려는 것입니다
  - 죽지 않도록
  lexicon: Lambdin; Crum (ⲙⲟⲩ)
  rationale: 부정 목적절의 기능을 한국어에서 가장 자연스럽게 드러내기 위해 결과절 형태로 풀되, 원문의 예방적 목적을 유지했습니다.
- source_word: ϣⲓⲛⲉ
  english_pob_choice: seek
  chosen_korean: 찾아보다
  alternatives_korean:
  - 찾다
  - 구하다
  - 찾으려 하다
  lexicon: Crum
  rationale: 본문 뒤의 ϣⲓⲛⲉ는 단순 동사 반복을 피하면서도 ‘그를 보려고 찾아보게 되겠지만’으로 옮겨 앞의 ‘찾아보다’와 의미상 연결을 유지했습니다.
- source_word: ϣϭⲙϭⲟⲙ
  english_pob_choice: be able
  chosen_korean: 볼 수 없습니다
  alternatives_korean:
  - 볼 수 없게 됩니다
  - 보지 못합니다
  lexicon: Crum
  rationale: 관용적으로 ‘be able (to see)’이므로 한국어에서는 가능성 표현 ‘볼 수 없습니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘Living One’의 신학적 호칭화 여부
  chosen_reading: 특정 기독론 호칭으로 좁히지 않고, 본문이 요구하는 최소한의 의미인 ‘살아 있는 이’로 유지했습니다.
  alternative_readings:
  - ‘살아 계신 분’처럼 하나님/메시아적 호칭으로 읽는 번역
  - 대문자화된 ‘생명자’식 표기
  rationale: 공관복음이나 요한문헌의 고정 신학어가 아니라 토마스복음의 표현이므로, 문맥이 요구하는 범위 이상으로 신학적 결정을 덧씌우지 않는 것이 더 원문충실적입니다.
  doctrine_reference: source-text restraint; Thomas saying genre
