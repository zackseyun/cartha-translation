base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
  footnotes:
  - marker: '1'
    text: The negative present tense ⲛ̄ⲧⲉⲧⲛ̄ⲉⲓⲙⲉ ⲁⲛ can be read as a statement ('you do not know') or a rhetorical question ('do you not know?'). Both fit the context of Jesus rebuking their lack of understanding.
    reason: textual_variant
  - marker: '2'
    text: 'The Coptic text places ''they love'' and ''they hate'' side by side without a conjunction (asyndeton: ⲥⲉⲙⲉ ⲙ̄ⲡϣⲏⲛ ⲥⲉⲙⲟⲥⲧⲉ ⲙ̄ⲡⲉϥⲕⲁⲣⲡⲟⲥ), emphasizing the contradiction. ''But'' has been supplied in English for clarity.'
    reason: register_note
translation:
  language: ko
  text: '그의 제자들이 그에게 말했습니다. 「당신이 누구이기에 우리에게 이런 것들을 말씀하십니까?」


    그런데 내가 너희에게 말하는 것을 통해서도 너희는 내가 누구인지 알지 못합니다. 그러나 너희는 유대인들과 같아졌습니다. 그들은 나무는 사랑하면서도 그 열매는 미워하고[2], 열매는 사랑하면서도 나무는 미워하기 때문입니다.[1]'
  philosophy: formal
  footnotes:
  - marker: '1'
    text: 콥트어의 부정 현재문 ⲛ̄ⲧⲉⲧⲛ̄ⲉⲓⲙⲉ ⲁⲛ은 진술문(“너희는 알지 못합니다”)과 수사 의문문(“너희는 알지 못합니까?”) 둘 다로 읽을 수 있습니다.
    reason: textual_variant
  - marker: '2'
    text: 콥트어는 ‘사랑하다’와 ‘미워하다’를 접속사 없이 나란히 놓아 모순을 강조합니다. 한국어는 뜻을 분명히 하려고 ‘그리고/하지만’을 보충할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲉⲓⲙⲉ
  english_pob_choice: know
  chosen_korean: 알다
  alternatives_korean:
  - 이해하다
  - 깨닫다
  lexicon: Crum 77a
  rationale: 본문은 정체성 인식(“who I am”)의 문제이므로, 자연스럽고 직접적인 ‘알다’가 가장 잘 맞습니다.
- source_word: ϣⲱⲡⲉ
  english_pob_choice: become
  chosen_korean: ~이/가 되다
  alternatives_korean:
  - 변하다
  - 되어 가다
  lexicon: Crum 584b
  rationale: 제자들이 유대인들과 같은 상태로 ‘변해 버렸다’는 변화의 결과를 나타내므로 ‘같아졌습니다’로 옮겼습니다.
- source_word: ϣⲏⲛ
  english_pob_choice: tree
  chosen_korean: 나무
  alternatives_korean:
  - 수목
  - tree
  lexicon: Crum 571a
  rationale: 일반적인 ‘tree’이므로 표준 한국어의 ‘나무’로 옮겼습니다.
- source_word: ⲙⲟⲥⲧⲉ
  english_pob_choice: hate
  chosen_korean: 미워하다
  alternatives_korean:
  - 증오하다
  - 싫어하다
  lexicon: Crum 183a
  rationale: 사랑과의 직접 대조를 살리면서도 문맥의 강도를 유지하는 표현으로 ‘미워하다’를 선택했습니다.
theological_decisions:
- issue: 두 번째 발화의 문장 유형
  chosen_reading: 선언문으로 옮겨, 「너희는 내가 누구인지 알지 못합니다」라고 했습니다.
  alternative_readings:
  - 질문문으로 옮겨, 「내가 누구인지 너희는 알지 못합니까?」
  rationale: 콥트어 부정 현재문의 구문과 뒤이은 대조문이 선언형 흐름과 잘 맞으므로, POB의 문법 판단을 따라 선언문으로 유지했습니다.
  doctrine_reference: None
