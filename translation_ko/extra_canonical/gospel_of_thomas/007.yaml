  source_fidelity: 개정이 필요합니다. 초안의 ‘그것이 사람이 되게 될’은 선행사인 사자를 중성 대명사로 바꾸고, ‘되게 될’은 사자가 누군가에 의해 사람이 되도록 한다는 사역적 의미를 낳습니다. 원문은 첫째 경우 사람이 사자를 먹은 결과 사자가 사람이 ‘되는’ 구문이며, 둘째 경우에는 사자가 사람을 먹고 장차 사람이 ‘될’ 것이라는 독립 미래형입니다. 또한 둘째 절의 ‘사자가 그를 먹을 것이기 때문입니다’는 원문의 단순 접속을 인과관계로 바꿉니다.
  naturalness: 합쇼체의 현대 표준어로, 평행 구조와 원문의 의도적인 역설을 유지하도록 문장을 다듬었습니다. ‘사람이 먹어 사자가 사람이 되는’ 및 ‘사자가 먹고 사자가 사람이 될’은 다소 낯선 원문의 구조를 불필요하게 해설하지 않고 자연스럽게 보존합니다.
