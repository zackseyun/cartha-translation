base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/007.yaml
  text: Jesus said[a], “Blessed is this lion which the human will eat, so that the lion becomes human; and accursed is this human whom the lion will eat[d][c][b], and the lion will become human.”
  footnotes:
  - marker: a
    text: Makarios can also be rendered “happy” or “fortunate.” “Blessed” retains the sacral coloration of the Greek loan in Coptic.
    reason: lexical_alternative
  - marker: b
    text: “Human” translates Coptic prōme, a generic term for a person; “man” is a possible rendering but can be gendered in English.
    reason: lexical_alternative
  - marker: c
    text: The complement marker with ϣⲱⲡⲉ varies (r-/n-) in the manuscript, a dialectal/orthographic fluctuation with no change in sense (“become human”).
    reason: dialect_note
  - marker: d
    text: Or 'and the lion will become human; and accursed is this human whom the lion will eat, and the lion will become human.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「복되도다, 사람이 먹어 그것이 사람이 되게 될 이 사자여. 그리고 저 사람에게는 화가 있습니다. 사자가 그를 먹을 것이기 때문입니다. 그리고 사자가 사람이 될 것입니다」.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲟⲩⲙⲁⲕⲁⲣⲓⲟς는 ‘행복한/운 좋은’으로도 옮길 수 있지만, Coptic에서 그리스어 μακάριος의 성격을 띠므로 축복 어감을 살리는 번역이 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: ⲡⲣⲱⲙⲉ는 일반적인 ‘사람/인간’이며, ‘남자’로 옮길 수도 있으나 성별화될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 첫 번째 ‘사자가 사람이 되다’는 Coptic의 ⲛ̄ⲧⲉ-…ϣⲱⲡⲉ 구문으로, 둘째 절의 독립 미래형과 문법적으로 다릅니다.
    reason: source_note
  - marker: d
    text: ⲃⲱⲧⲉ는 ‘저주받다’보다 넓게 ‘혐오스럽다/화가 있다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  english_pob_choice: blessed
  chosen_korean: 복되도다
  alternatives_korean:
  - 행복하도다
  - 복 있습니다
  lexicon: Crum; Sahidic에서 그리스어 계열 μακάριος 차용
  rationale: Thomas의 축복 선언 어감을 살리기 위해 ‘복되다’ 계열을 택했습니다. 합쇼체 본문에서는 선언형 고어체보다 현대 문장 속 축복 형식으로 다듬어 ‘복되도다’로 옮겼습니다.
- source_word: ⲡⲙⲟⲩⲓ / ⲡⲙⲟⲩⲉⲓ
  english_pob_choice: lion
  chosen_korean: 사자
  alternatives_korean:
  - 표범
  - 야수
  lexicon: Crum s.v. ⲙⲟⲩⲓ
  rationale: 기본 의미가 ‘사자’이므로 그대로 옮겼습니다. 본문의 상징성을 흐리지 않기 위해 완화하지 않았습니다.
- source_word: ⲡⲣⲱⲙⲉ
  english_pob_choice: the human
  chosen_korean: 사람
  alternatives_korean:
  - 인간
  - 남자
  lexicon: Crum s.v. ⲣⲱⲙⲉ
  rationale: Coptic의 일반적 ‘인간/사람’ 의미를 반영했습니다. 영어 POB가 gendered reading을 피하려고 ‘human’을 택한 점을 따라 한국어도 중립적인 ‘사람’으로 처리했습니다.
- source_word: ⲛ̄ⲧⲉ…ϣⲱⲡⲉ
  english_pob_choice: so that the lion becomes human
  chosen_korean: 먹어 그것이 사람이 되게 될
  alternatives_korean:
  - 그래서 사자가 사람이 되게 될
  - 사자가 사람이 되도록
  lexicon: Layton, Coptic Grammar on conjunctive/subordinate consequence
  rationale: 첫 번째 ‘사자가 사람이 됨’은 단순 병렬이 아니라 앞절의 결과를 나타내는 종속/결과 구조이므로, 영어 POB의 ‘so that…’ 취지를 따라 결과 의미를 살렸습니다.
- source_word: ⲃⲱⲧⲉ
  english_pob_choice: accursed
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 저주받습니다
  - 저주받을 것입니다
  lexicon: Crum s.v. ⲃⲟⲧⲉ/ⲃⲱⲧⲉ
  rationale: 이 단어는 단순한 감탄사 ‘슬프다’보다 강한 부정적 판정을 지니므로, 문맥상 대칭을 이루는 축복 선언과 함께 ‘화가 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 첫 번째 ‘사자가 사람이 됨’의 문법적 관계
  chosen_reading: 결과를 나타내는 종속 구문으로 읽어 ‘먹어 그것이 사람이 되게 될’이라고 옮겼습니다.
  alternative_readings:
  - ‘그리고 사자가 사람이 됩니다’로 단순 병렬 처리
  - ‘그래서 사자가 사람이 됩니다’로 더 명시적 결과 처리
  rationale: Coptic의 ⲛ̄ⲧⲉ-…ϣⲱⲡⲉ 구조는 단순 반복이 아니라 앞선 relative clause에 붙는 결과적/종속적 연결을 보이므로, 두 번째 절과 동일하게 평면화하지 않았습니다. 이는 본문의 구조적 긴장을 보존합니다.
  doctrine_reference: 문법적-해석학적 판단
- issue: ‘사람’의 보편성
  chosen_reading: ⲡⲣⲱⲙⲉ를 성별화하지 않고 ‘사람’으로 옮겼습니다.
  alternative_readings:
  - ‘남자’로 옮김
  - ‘인간’으로 옮김
  rationale: 이 말은 특정 남성 개체보다 인간 일반을 가리키는 데 더 가깝고, 영어 POB도 이를 반영해 ‘human’을 선택했습니다. 한국어에서도 성별을 도입하지 않는 것이 원문과 더 잘 맞습니다.
  doctrine_reference: 번역상의 인간 보편성 유지
