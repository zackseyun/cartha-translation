  lexicon: Layton
  rationale: ‘하나 되다/하나였던’의 의미 범위를 유지하면서, 뒤의 ‘둘이 되었습니다’와 대구를 이루도록 과거 상태로 옮겼습니다.
- source_word: ⲛⲁⲁⲁⲛⲧⲟϥ
  english_pob_choice: what will you do?
  chosen_korean: 무엇을 하겠습니까?
  alternatives_korean:
  - 무엇을 하겠습니까, 그것을
  lexicon: Crum
  rationale: 말미의 ⲁⲁ는 앞선 ⲉⲓⲣⲉ와 다른 표기 변이로 이해되며, 문맥상 동일한 질문이므로 한국어도 같은 표현으로 맞췄습니다.
theological_decisions:
- issue: “하늘”의 우주론적 의미
  chosen_reading: 첫 구절은 단순한 대기나 하늘빛이 아니라, 위계적 우주론 속의 ‘하늘’로 읽어야 하므로 ‘이 하늘’로 번역했습니다.
  alternative_readings:
  - 이 하늘
  - 이 하늘나라
  - 이 공중
  rationale: 바로 뒤의 ‘그 위에 있는 것’이 상층 하늘을 전제하므로, 본문이 말하는 것은 물리적 하늘보다 더 넓은 우주 질서입니다.
  doctrine_reference: 고대 우주론 문맥 해석
- issue: 죽음과 생명에 대한 역설적 진술
  chosen_reading: 본문은 윤리적 교훈보다 존재 상태의 역전을 압축적으로 말하므로, ‘죽은 자들은 살지 않고, 살아 있는 자들은 죽지 않을 것입니다’라는 직설적 대구를 유지했습니다.
  alternative_readings:
  - 죽은 자들은 살아 있지 않고, 살아 있는 자들은 죽음을 보지 않을 것입니다
  rationale: Thomas 특유의 수수께끼적 병렬을 약화시키지 않기 위해 설명을 덧붙이지 않았습니다.
  doctrine_reference: 본문 내 수사 구조 보존
