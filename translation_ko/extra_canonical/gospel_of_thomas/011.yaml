base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/011.yaml
  text: Jesus said[1], “This heaven will pass away, and the one above it will pass away. And the dead are not alive, and the living will not die. On the days when you ate what is dead, you made it alive. When you come to be in the light, what will you do? On the day when you were one, you became two. But when you become two[5][4][3][2], what will you do?”
  footnotes:
  - marker: '1'
    text: “This heaven” (ⲡⲉⲓⲡⲉ) can also mean “this sky.” The following phrase (“the one above it”) suggests a layered cosmology, hence “heaven.”
    reason: lexical_alternative
  - marker: '2'
    text: '“You made it alive”: the object pronoun likely refers to “what is dead” that was eaten; the causative ⲉⲓⲣⲉ ⲛ- + predicate means “cause it to be living.”'
    reason: cultural_note
  - marker: '3'
    text: '“What will you do?”: Coptic has an object pronoun (ⲛⲧⲟϥ), possibly pleonastic or referring to the ‘light’ or the previously mentioned ‘living thing.’ The translation leaves it implicit.'
    reason: lexical_alternative
  - marker: '4'
    text: '“On the day when you were one, you became two”: idiom ⲉⲓⲣⲉ ⲛⲟⲩⲁ can mean “be one” as well as “make one.” Some take it as prospective (“when you become one, you will become two”), but the following aorist favors a past reference.'
    reason: alternative_reading
  - marker: '5'
    text: 'Final question: the manuscript reads ⲛⲁⲁⲁⲛⲧⲟϥ, using ⲁⲁ (“take, do to”) where the earlier question has ⲉⲓⲣⲉ (“do/make”). Context suggests repetition of the same question; some editors treat this as an orthographic variant.'
    reason: textual_variant
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “이 하늘은 사라질 것이며, 그 하늘 위에 있는 것도 사라질 것입니다.[a] 죽은 자들은 살아 있지 않으며, 살아 있는 자들은 죽지 않을 것입니다. 여러분이 죽은 것을 먹던 때에는 그것을 살게 했습니다.[b] 여러분이 빛 속에 있게 되면, 무엇을 하겠습니까?[c] 여러분이 하나였을 때에는 둘이 되었습니다.[d] 그러나 여러분이 둘이 되면, 무엇을 하겠습니까?”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “이 하늘”의 ⲡⲉⲓⲡⲉ는 “이 하늘” 또는 “이 하늘/공중”으로도 이해될 수 있습니다. 이어지는 “그 하늘 위에 있는 것”이라는 표현 때문에 여기서는 우주론적 의미의 “하늘”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: “그것을 살게 했습니다”는 ‘죽은 것’을 가리키는 것으로 보입니다. 콥트어 ⲉⲓⲣⲉ ⲛ- + 술어의 사역 구문을 옮긴 것이며, “그것에 생명을 주었습니다”로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 질문에는 목적어 대명사(ⲛⲧⲟϥ)가 있습니다. 이것은 잉여적으로 쓰였거나 앞의 “빛” 또는 앞서 언급된 대상을 가리킬 수 있으므로, 번역에서는 특정 대상을 보충하지 않았습니다.
    reason: lexical_alternative
  - marker: d
    text: “하나였을 때에는 둘이 되었습니다”에서 ‘하나가 되다’라는 표현은 ‘하나이다’ 또는 ‘하나가 되다’로 이해될 수 있습니다. 뒤따르는 완료된 사건의 표현에 따라 여기서는 과거의 진술로 옮겼습니다.
    reason: alternative_reading
  - marker: e
    text: 마지막 질문의 사본은 앞 질문의 ‘하다’(ⲉⲓⲣⲉ)와 달리 ⲁⲁ를 사용합니다. 문맥상 같은 질문을 반복하는 것으로 보이나, 표기 또는 어휘의 변이로 이해되기도 합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲓⲡⲉ
  english_pob_choice: this heaven
  chosen_korean: 이 하늘
  alternatives_korean:
  - 이 하늘
  - 이 하늘나라
  lexicon: Crum; Layton
  rationale: Coptic ⲡⲉ는 문맥에 따라 하늘/천공을 뜻하며, 뒤의 “그 위에 있는 것”과 함께 층위 있는 우주론을 가리키므로 ‘이 하늘’이 가장 직접적입니다.
- source_word: ⲛⲁⲣⲡⲁⲣⲁⲅⲉ
  english_pob_choice: will pass away
  chosen_korean: 사라질 것입니다
  alternatives_korean:
  - 지나갈 것입니다
  - 지날 것입니다
  lexicon: Crum (Greek loan from παρέρχομαι)
  rationale: 단순한 이동이 아니라 소멸·종말의 뉘앙스를 가진 예언적 표현이므로 한국어에서는 ‘사라지다’가 의미를 가장 잘 살립니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲟⲩ … ⲛⲧⲟⲟⲩⲱⲛϩ ⲁⲛ
  english_pob_choice: the dead are not alive
  chosen_korean: 죽은 자들은 살지 않고
  alternatives_korean:
  - 죽은 자들은 살아 있지 않고
  - 죽은 자들은 생명이 없고
  lexicon: Crum
  rationale: 직역적 대립을 유지하되, 한국어에서 자연스러운 서술로 압축해 Thomas 특유의 짧은 병렬을 보존했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ … ⲛⲧⲟⲟⲩ ⲛⲁⲙⲟⲩ ⲁⲛ
  english_pob_choice: the living will not die
  chosen_korean: 살아 있는 자들은 죽지 않을 것입니다
  alternatives_korean:
  - 살아 있는 자들은 죽음을 보지 않을 것입니다
  lexicon: Crum
  rationale: 앞 절과 평행을 이루는 생사 대조를 그대로 살리기 위해 직선적으로 옮겼습니다.
- source_word: ⲉⲓⲣⲉ ⲛⲛⲧⲟϥ ⲛⲡⲉⲧⲉⲣⲉⲱⲛϩ
  english_pob_choice: you made it alive
  chosen_korean: 그것을 살렸습니다
  alternatives_korean:
  - 그것을 살게 했습니다
  - 그것에 생명을 주었습니다
  lexicon: Lambdin; Layton
  rationale: Coptic의 사역 구문 ⲉⲓⲣⲉ ⲛ- + 술어를 한국어 동사 ‘살리다’로 응축해, ‘죽은 것’을 먹음으로써 생명 상태로 바꾸는 역설을 드러냅니다.
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛ ϣⲱⲡⲉ
  english_pob_choice: when you come to be
  chosen_korean: 여러분이 빛 속에 있게 되면
  alternatives_korean:
  - 여러분이 빛 속에 들어가게 되면
  - 여러분이 빛 가운데 있게 되면
  lexicon: Layton
  rationale: 예측/진입 뉘앙스를 가진 구문이므로 ‘있게 되면’으로 옮겨 상태의 성립을 드러냈습니다.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉ … ⲛⲁⲉⲓⲣⲉ ⲛⲧⲟϥ
  english_pob_choice: what will you do?
  chosen_korean: 무엇을 하겠습니까?
  alternatives_korean:
  - 그것에 대해 무엇을 하겠습니까?
  - 무엇을 하겠습니까, 그것에
  lexicon: Lambdin; Layton
  rationale: 목적어 대명사가 문맥상 잉여적이거나 앞 문맥을 가리킬 수 있어, 한국어에서는 질문의 핵심만 남겨 수사적 긴장을 보존했습니다.
- source_word: ⲉⲓⲣⲉ ⲛⲟⲩⲁ
  english_pob_choice: you were one
  chosen_korean: 여러분이 하나였던 날에는
  alternatives_korean:
  - 여러분이 하나였을 때
  - 여러분이 하나가 되었던 날에는
  lexicon: Layton
  rationale: ‘하나 되다/하나였던’의 의미 범위를 유지하면서, 뒤의 ‘둘이 되었습니다’와 대구를 이루도록 과거 상태로 옮겼습니다.
- source_word: ⲛⲁⲁⲁⲛⲧⲟϥ
  english_pob_choice: what will you do?
  chosen_korean: 무엇을 하겠습니까?
  alternatives_korean:
  - 무엇을 하겠습니까, 그것을
  lexicon: Crum
  rationale: 말미의 ⲁⲁ는 앞선 ⲉⲓⲣⲉ와 다른 표기 변이로 이해되며, 문맥상 동일한 질문이므로 한국어도 같은 표현으로 맞췄습니다.
theological_decisions:
- issue: “하늘”의 우주론적 의미
  chosen_reading: 첫 구절은 단순한 대기나 하늘빛이 아니라, 위계적 우주론 속의 ‘하늘’로 읽어야 하므로 ‘이 하늘’로 번역했습니다.
  alternative_readings:
  - 이 하늘
  - 이 하늘나라
  - 이 공중
  rationale: 바로 뒤의 ‘그 위에 있는 것’이 상층 하늘을 전제하므로, 본문이 말하는 것은 물리적 하늘보다 더 넓은 우주 질서입니다.
