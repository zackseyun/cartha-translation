revisions:
- from: 예수께서 말씀하셨습니다. "아버지의 나라는 여인이 가득 찬 곡식 자루를 들고 가는 것과 같습니다. 그녀가 길 위를 걷고 있을 때, 아직 멀리 떨어져 있을 때 자루의 손잡이가 부러졌습니다. 곡식이 길 위에 그녀 뒤로 쏟아졌습니다. 그녀는 그것을 알지 못했고, 그 문제도 알아차리지 못했습니다. 집에 이르자 자루를 내려놓았는데, 그것이 비어 있음을 보았습니다."[a][b]
  to: 예수께서 말씀하셨습니다. “아버지의 나라는 곡식가루가 가득 든 항아리를 들고 가는 한 여인과 같습니다. 그 여인이 길을 걷고 있을 때, 아직 멀리 떨어져 있었는데, 항아리의 손잡이[a]가 부러졌습니다. 곡식가루가 길 위에 그녀의 뒤로 쏟아졌습니다. 그녀는 그것을 알지 못했고, 그 문제[b]도 알아차리지 못했습니다. 그녀가 자기 집에 이르러 항아리를 내려놓았을 때, 항아리가 비어 있음을 알게 되었습니다.”
  rationale: 원문의 용기(ϭⲗⲙⲉⲉⲓ)와 가루(ⲛⲟⲉⲓⲧ)를 정확히 반영하고, ⲟⲩⲉ의 거리 표현과 ϩⲓⲥⲉ의 문제 인지를 보존했습니다. 각주 표지는 해당 낱말에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:16Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 핵심 비유 구조와 ‘아버지의 나라’를 보존했으나, ϭⲗⲙⲉⲉⲓ는 ‘항아리/단지/pitcher’이지 ‘자루’가 아닙니다. 따라서 ‘곡식 자루’ 및 그 ‘손잡이’는 원문의 용기 이미지를 바꾸며, 자루에는 통상 손잡이가 없다는 장면상의 문제도 낳습니다. ⲛⲟⲉⲓⲧ는 곡식 일반보다 ‘곡식가루/가루’가 적절합니다. ⲟⲩⲉ의 ‘멀리 있다’는 목적지가 명시되지 않으므로 ‘집에서 아직 멀리’처럼 보충하지 않고 보존했습니다. ϩⲓⲥⲉ의 ‘문제’를 명시한 것은 적절합니다.
  naturalness: 합쇼체는 대체로 적절하나, ‘길 위를 걷고 있을 때, 아직 멀리 떨어져 있을 때’는 같은 시간절의 반복으로 어색합니다. 또한 두 각주 표지가 인용문 끝에 함께 놓여 있어 각주가 설명하는 ‘손잡이’와 ‘문제’에 연결되지 않습니다.
  terminology: ‘아버지의 나라’는 토마스복음서의 ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ를 충실히 보존합니다. 용기는 ‘항아리’, 내용물은 ‘곡식가루’로 바로잡았습니다. ⲙⲁⲁϫⲉ는 본문에서 ‘손잡이’로, 각주에서 문자적 ‘귀’로 밝혔습니다.
  issues:
  - severity: high
    issue: ϭⲗⲙⲉⲉⲓ를 ‘곡식 자루’로 번역함
    rationale: 원어와 영어 감사 기록 모두 이 단어를 jar/pitcher, 즉 항아리·단지 계열의 용기로 제시합니다. ‘자루’는 용기 종류를 바꾸고 뒤이은 손잡이 파손 장면과도 맞지 않습니다.
  - severity: medium
    issue: ⲛⲟⲉⲓⲧ를 ‘곡식’으로 번역함
    rationale: 이 단어는 flour/meal을 뜻하므로, 내용물이 쏟아지는 장면에서는 ‘곡식가루’가 더 정확합니다.
  - severity: medium
    issue: 각주 표지가 문장 끝에 일괄 배치됨
    rationale: a는 ‘손잡이’, b는 ‘문제’를 설명하므로 각각 해당 어휘 바로 뒤에 배치해야 독자가 각주의 대상을 알 수 있습니다.
  - severity: low
    issue: 시간절 반복
    rationale: ‘걷고 있을 때’와 ‘아직 멀리 떨어져 있을 때’가 병렬 반복되어 자연스럽지 않습니다. 원문의 거리 표현은 유지하되 한 문장으로 매끄럽게 연결할 수 있습니다.
