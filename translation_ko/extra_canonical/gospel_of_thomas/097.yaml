base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
  footnotes:
  - marker: handle
    text: Literally 'ear' (ⲙⲁⲁϫⲉ).
    reason: lexical_alternative
  - marker: trouble
    text: Or 'problem', 'toil' (ϩⲓⲥⲉ).
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “아버지의 나라는 곡식가루가 가득 든 항아리를 들고 가는 한 여인과 같습니다. 그 여인이 길을 걷고 있을 때, 아직 멀리 떨어져 있었는데, 항아리의 손잡이[a]가 부러졌습니다. 곡식가루가 길 위에 그녀의 뒤로 쏟아졌습니다. 그녀는 그것을 알지 못했고, 그 문제[b]도 알아차리지 못했습니다. 그녀가 자기 집에 이르러 항아리를 내려놓았을 때, 항아리가 비어 있음을 알게 되었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘귀’이지만, 여기서는 항아리의 손잡이를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 콥트어 ϩⲓⲥⲉ는 ‘문제’ 외에 ‘수고, 고생, 괴로움’도 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ
  english_pob_choice: the kingdom of the Father
  chosen_korean: 아버지의 나라
  alternatives_korean:
  - 아버지의 왕국
  - 아버지의 통치
  lexicon: Crum / POB audit trail
  rationale: ⲧⲙⲛ̄ⲧⲉⲣⲟ는 ‘나라/왕국’의 통치 영역을 가리키며, POB의 ‘the kingdom of the Father’를 자연스럽고 직역에 가깝게 옮기기 위해 ‘아버지의 나라’로 렌더링했습니다.
- source_word: ϭⲗⲙⲉⲉⲓ
  english_pob_choice: jar
  chosen_korean: 곡식 자루
  alternatives_korean:
  - 항아리
  - 단지
  - 자루
  lexicon: Crum 814b
  rationale: Coptic 단어는 기본적으로 jar/pitcher 계열이지만, 본문 전체의 ‘가득 찬 곡식’ 이미지에 맞게 한국어에서는 ‘곡식 자루’가 장면을 더 분명히 전달한다고 보았습니다.
- source_word: ⲙⲁⲁϫⲉ
  english_pob_choice: handle
  chosen_korean: 손잡이
  alternatives_korean:
  - 귀
  - 손잡이 부분
  lexicon: Crum 211a
  rationale: 직역상 ‘귀’도 가능하지만, POB 각주가 밝히듯 용기의 손잡이를 뜻하므로 한국어 본문에는 의미가 즉시 드러나는 ‘손잡이’를 택했습니다.
- source_word: ϩⲓⲥⲉ
  english_pob_choice: trouble
  chosen_korean: 문제
  alternatives_korean:
  - 고생
  - 수고
  - 재난
  lexicon: Crum 715b
  rationale: 이 말은 단순한 감정적 ‘걱정’이 아니라 뒤늦게 드러난 사태 자체를 가리키므로, 본문에서는 평이한 ‘문제’를 두고 필요하면 각주로 보완할 수 있게 했습니다.
theological_decisions:
- issue: 아버지의 나라 표현
  chosen_reading: 아버지의 나라는 예수가 비유로 제시한 현실을 그대로 살리되, 마태복음식 ‘하늘 나라’나 일반적인 ‘하나님의 나라’로 평준화하지 않았습니다.
  alternative_readings:
  - 하늘 나라
  - 하나님의 나라
  rationale: 토마스복음서의 고유한 문구가 ‘아버지의 나라’이므로, 평행본문과의 조화를 위해 익숙한 신약 표현으로 바꾸지 않았습니다.
  doctrine_reference: 본문 고유 표현 보존
