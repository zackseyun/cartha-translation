base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/056.yaml
  text: 'Jesus said: Whoever has come to know the world has found a corpse[a]; and whoever has found the corpse[c][b], the world is not worthy of him.'
  footnotes:
  - marker: a
    text: The first clause uses the indefinite article (“a corpse”), while the second uses the definite (“the corpse”), probably referring back to the same discovered corpse. Some English versions flatten both as “a corpse,” but the Coptic distinction is kept here.
    reason: dialect_note
  - marker: b
    text: “Come to know” renders the perfective nuance of ⲥⲟⲟⲩⲛ in the ⲡⲉⲧⲉⲣⲉ-relative; “know” would be a plainer alternative.
    reason: lexical_alternative
  - marker: c
    text: Compare Hebrews 11:38 (“of whom the world was not worthy”). This is not a Synoptic parallel and is cited only for thematic resonance.
    reason: cross_reference
translation:
  language: ko
  text: 예수님께서 말씀하셨습니다. “세상을 안 사람은 시체를 발견한 것입니다[a]. 그리고 시체를 발견한 사람[b]에게는 세상이 그 사람에게 합당하지 않습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 절의 해당 명사는 부정관사로 제시되어 “시체”라는 하나의 대상을 처음 언급합니다.
    reason: source_note
  - marker: b
    text: 둘째 절은 정관사를 사용하여 앞서 언급된 동일 대상을 가리키는 것으로 읽을 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수님께서 말씀하셨습니다
  alternatives_korean:
  - 예수님께서 말씀하십니다
  - 예수님께서 이르셨습니다
  lexicon: Crum; Lambdin (grammar)
  rationale: 사실 보고형 도입구로서 완료된 발화를 자연스럽게 옮기되, 문어적 품격을 유지했습니다.
- source_word: ⲥⲟⲟⲩⲛ
  english_pob_choice: come to know
  chosen_korean: 안
  alternatives_korean:
  - 알
  - 깨달은
  lexicon: Crum; Layton (grammar)
  rationale: 완결된 인식 상태를 나타내는 뉘앙스를 살리되, 한국어에서는 가장 간결한 ‘안’으로 처리했습니다.
- source_word: ⲟⲩⲡⲧⲱⲙⲁ / ⲡⲧⲱⲙⲁ
  english_pob_choice: a corpse / the corpse
  chosen_korean: 시체
  alternatives_korean:
  - 주검
  - 죽은 몸
  lexicon: Crum
  rationale: 두 절 모두 대상이 같은 ‘corpse’이며, 첫 절의 부정관사/둘째 절의 정관사 대비는 한국어에서 ‘시체’를 반복하되 문맥상 첫째는 ‘시체를’, 둘째도 동일한 지시 대상을 가리키는 방식으로 처리했습니다.
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ
  english_pob_choice: is not worthy of him
  chosen_korean: 그 사람에게 합당하지 않습니다
  alternatives_korean:
  - 그에게 합당하지 않습니다
  - 그 사람을 받을 만하지 않습니다
  lexicon: Crum; Lambdin (grammar)
  rationale: 직역적 ‘합당하지 않다’가 원문의 가치/적격성 판단을 가장 직접적으로 반영하며, 대상을 ‘그 사람’으로 받쳐 문장 연결을 자연스럽게 했습니다.
theological_decisions:
- issue: 세상(world)의 평가와 인물의 가치 판단을 어떻게 옮길지
  chosen_reading: 세상이 그 사람에게 합당하지 않습니다
  alternative_readings:
  - 세상이 그를 합당하게 여기지 않습니다
  - 그는 세상에 합당하지 않습니다
  rationale: 원문은 ‘세상’이 주어인 부정 판단을 말하므로, 평가 주체를 세상으로 유지해 문장의 역전된 충격을 보존했습니다.
  doctrine_reference: Gospel of Thomas 56의 격언적 대조 구조
- issue: 첫 절과 둘째 절의 동일한 ‘corpse’ 지시를 어떻게 처리할지
  chosen_reading: 시체를 발견한 것입니다 / 시체를 발견한 사람
  alternative_readings:
  - 시체를 발견한 것입니다 / 그 시체를 발견한 사람
  rationale: 콥트어의 정관사 대비는 한국어에서 완전히 구분하기 어렵기 때문에, 중복 지시를 과도하게 설명하지 않으면서도 동일 대상의 반복을 살렸습니다.
  doctrine_reference: 콥트어 관사 대비에 대한 서술적 처리
