  naturalness: ‘건축자들이 내버린 이 돌을 내게 보여 주십시오’로 관계절을 자연스럽게 연결하고, 두 번째 문장은 ‘이 돌이 모퉁잇돌입니다’로 명료하게 하는 편이 현대 표준 한국어 합쇼체에 더 자연스럽습니다. 각주 표지도 해당 어구 뒤에 붙여 독자의 확인 지점을 분명히 했습니다.
