base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/066.yaml
  text: Jesus said, "Show me this stone that the builders threw out; it is the cornerstone."[a][b][c][d]
  footnotes:
  - marker: a
    text: Coptic ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ, lit. ‘give me to see,’ i.e., ‘show me.’
    reason: lexical_alternative
  - marker: b
    text: Lit. ‘threw it out’; commonly rendered ‘rejected.’
    reason: lexical_alternative
  - marker: c
    text: Lit. ‘stone of the corner.’
    reason: lexical_alternative
  - marker: d
    text: Echoes Ps 118:22 (LXX 117:22) and is cited in Mark 12:10; Matt 21:42; Luke 20:17; Acts 4:11; 1 Pet 2:7.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「건축자들이 내버린[b] 이 돌을 내게 보여 주십시오[a]. 이 돌이 모퉁잇돌[c]입니다.」[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 보게 해 주십시오’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그것을 밖으로 던졌다’입니다. 흔히 ‘배척했다’로도 옮깁니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘모퉁이의 돌’입니다.
    reason: lexical_alternative
  - marker: d
    text: 시편 118:22(칠십인역 117:22)을 반영하며, 마가복음 12:10; 마태복음 21:42; 누가복음 20:17; 사도행전 4:11; 베드로전서 2:7과도 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ
  english_pob_choice: show me
  chosen_korean: 내게 보여 주십시오
  alternatives_korean:
  - 내가 보게 해 주십시오
  - 보여 주십시오
  lexicon: Crum s.v. ⲥⲁⲃⲟ; permissive ϯ + infinitive
  rationale: 직역상 ‘보게 해 주다’의 뜻이지만, 한국어에서는 자연스럽고 요청의 뉘앙스를 살리기 위해 ‘보여 주십시오’로 옮겼습니다.
- source_word: ⲛ̄ⲧⲁⲩⲥⲧⲟϥ ⲉⲃⲟⲗ
  english_pob_choice: threw it out
  chosen_korean: 내버린
  alternatives_korean:
  - 밖으로 던진
  - 버린
  lexicon: Crum s.v. ⲥⲧⲟ ‘throw’
  rationale: ‘throw out’의 물리적 이미지와 ‘거절/배제’의 함의를 함께 살리기 위해 ‘내버린’으로 옮겼습니다.
- source_word: ⲛ̄ϭⲓⲛⲉⲧ⳿ⲕⲱⲧ
  english_pob_choice: the builders
  chosen_korean: 건축자들이
  alternatives_korean:
  - 짓는 이들이
  - 짓는 사람들
  lexicon: Crum s.v. ⲕⲱⲧ ‘build’
  rationale: 문맥상 건축 행위를 하는 집단을 가리키므로, 한국어에서는 명사화된 ‘건축자들’이 가장 간결하고 대조를 분명하게 합니다.
- source_word: ⲡⲱⲛⲉ ⲛⲕⲱϩ
  english_pob_choice: the cornerstone
  chosen_korean: 모퉁잇돌
  alternatives_korean:
  - 모서리 돌
  - 귀돌
  lexicon: Crum s.v. ⲕⲱϩ ‘corner’; ⲱⲛⲉ ‘stone’
  rationale: 교차 참조되는 시편 118편의 관용구를 고려해, 한국어 성경에서 널리 통용되는 ‘모퉁잇돌’을 유지했습니다.
theological_decisions:
- issue: 시편 118:22 및 공관복음·사도행전·베드로전서의 수용을 암시하는 표현을 어떻게 처리할지
  chosen_reading: 본문 자체는 인용 표지를 달지 않고, 번역문 안에서는 그 암시를 자연스럽게 유지했습니다.
  alternative_readings:
  - 직접 각주로 본문 인용을 강조하는 방식
  - 설명적 문구를 본문에 삽입하는 방식
  rationale: 이 구절은 토마스복음서의 독립적 전승을 유지하면서도 성경적 상호텍스트성을 드러내므로, 본문은 간명하게 두고 필요 정보는 주석 계층에서 처리하는 것이 적절합니다.
  doctrine_reference: 정경 간 상호본문성, 수용사
