base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/112.yaml
  text: Jesus said[a], “Woe to the flesh that depends on the soul[c][b]; woe to the soul that depends on the flesh.”
  footnotes:
  - marker: a
    text: The verb ⲉⲓϣⲉ can also be rendered “hangs upon” or “leans on,” preserving a more concrete image.
    reason: lexical_alternative
  - marker: b
    text: ⲯⲩⲭⲏ (psyche) can also mean “life” or “self,” but “soul” keeps the stark flesh/soul polarity of the Coptic.
    reason: lexical_alternative
  - marker: c
    text: MS shows ⲧⲁⲉⲓ (fem. demonstrative) in both clauses; Dilley normalizes to ⲡⲁⲓ. The demonstrative is semantically bleached here (“that [which]”), so gender does not affect the meaning.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “영혼에 의지하는 육에게 화가 있습니다. 육에 의지하는 영혼에게 화가 있습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲉⲓϣⲉ는 “의지하다” 외에도 “매달리다”, “기대다”로 옮길 수 있으며, 원문에는 더 구체적인 몸짓의 이미지가 남아 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲯⲩⲭⲏ는 “영혼” 외에 “생명”이나 “자기”를 뜻할 수도 있지만, 여기서는 육과 영혼의 날카로운 대립을 유지하기 위해 “영혼”으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 사본에는 두 절 모두 여성 지시사 ⲧⲁⲉⲓ가 보이지만, 정규화 본문은 ⲡⲁⲓ로 읽습니다. 여기서 지시사는 관계절을 이끄는 기능을 하므로, 성의 차이는 의미를 바꾸지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓ / ⲟⲩⲟⲓ
  english_pob_choice: Woe
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 아, 슬픕니다
  - 재앙이 있습니다
  lexicon: Crum; loan from Gk οὐαί
  rationale: Coptic ⲟⲩⲟⲓ의 예언적 탄식/경고를 한국어에서 가장 자연스럽게 살리려면 “화”가 적절합니다. “재앙”은 의미가 더 강하고, “아”는 어조만 살려 경고의 힘이 약합니다.
- source_word: ⲥⲁⲣⲝ
  english_pob_choice: flesh
  chosen_korean: 육
  alternatives_korean:
  - 육체
  - 몸
  lexicon: Crum; Greek loanword
  rationale: 본문의 핵심 대립이 육/영혼의 긴장에 있으므로 “몸”보다 더 원문에 가까운 “육”을 택했습니다. “육체”는 한국어에서 다소 신학적으로 굳어진 표현이라 여기서는 문맥을 덜 날카롭게 만들 수 있습니다.
- source_word: ⲯⲩⲭⲏ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 생명
  - 자기
  lexicon: Crum; Greek loanword
  rationale: POB의 “soul”에 맞추되, 한국어에서 본문의 상응 구조를 유지하기 위해 “영혼”을 사용했습니다. “생명”이나 “자기”는 이 대조의 형이상학적 긴장을 약화시킬 수 있습니다.
- source_word: ⲉⲧⲉⲣⲉⲉⲓϣⲉ (ⲉⲓϣⲉ)
  english_pob_choice: depends on
  chosen_korean: 의지하는
  alternatives_korean:
  - 기대는
  - 기댄
  lexicon: Crum; Layton (grammar) on ⲉⲓϣⲉ with ⲛ
  rationale: “depends on”의 기능적 의존을 한국어에서 가장 간결하게 옮기기 위해 관형사형 “의지하는”을 사용했습니다. 이는 원문의 ‘달려 있음/기대어 있음’이라는 구체적 이미지를 과도하게 설명하지 않으면서도 보존합니다.
theological_decisions:
- issue: 육과 영혼의 관계를 어떻게 표현할지
  chosen_reading: ‘육에 의지하는 그 영혼’과 ‘영혼에 의지하는 그 육’으로, 상호 의존/매달림의 역설을 그대로 살렸습니다.
  alternative_readings:
  - ‘육에 매달린 영혼’
  - ‘육을 의지하는 영혼’
  rationale: 원문은 단순한 소유나 출처가 아니라 의존 방향의 역전을 경고합니다. 따라서 주어-목적 구조를 바꾸지 않고 의존의 방향을 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 문자적 대조 구조 보존; 영지적/이원론적 어법의 강도를 완화하지 않음
