base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/048.yaml
  text: Jesus said[a], "If two make peace with each other in this one house, they will say to the mountain[c][b], ‘Move away,’ and it will move."
  footnotes:
  - marker: a
    text: ‘in this one house’ could also be rendered ‘in a single house’ or ‘in this same house’ (ⲟⲩⲱⲧ has the sense ‘one/single/same’).
    reason: lexical_alternative
  - marker: b
    text: ‘with each other’ translates ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ, literally ‘with their companions/friends,’ used idiomatically for mutuality.
    reason: cultural_note
  - marker: c
    text: ‘Move away’ reflects ⲉⲃⲟⲗ ‘out, away’; alternatives include ‘move out’ or simply ‘move.’
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「만일 이 한 집[a]에서 두 사람이 서로[b] 평화를 이루면, 그들은 산에게 말할 것입니다. ‘옮겨 가라[c].’ 그러면 그것이 옮겨 갈 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 한 집’은 ⲟⲩⲱⲧ의 의미를 반영한 것으로, ‘한 집’, ‘이 같은 집’ 또는 ‘이 동일한 집’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘서로’는 ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ를 옮긴 것입니다. 직역하면 ‘그들의 동료들/친구들과 함께’에 가깝지만, 여기서는 상호성을 나타내는 관용적 표현으로 이해될 수 있습니다.
    reason: cultural_note
  - marker: c
    text: ‘옮겨 가라’는 ⲉⲃⲟⲗ의 ‘밖으로, 멀리’라는 뉘앙스를 반영한 번역으로, ‘옮겨라’ 또는 ‘물러가라’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ
  english_pob_choice: if (prospective/conditional marker)
  chosen_korean: 만일
  alternatives_korean:
  - -하면
  - 때
  lexicon: Layton, Coptic Grammar
  rationale: 예상적 조건을 나타내는 서두이므로 한국어에서도 조건의 가능성을 분명히 드러내는 ‘만일’을 택했습니다.
- source_word: ⲣⲉⲓⲣⲏⲛⲏ
  english_pob_choice: make peace
  chosen_korean: 평화를 이루면
  alternatives_korean:
  - 서로 화목하면
  - 서로 평화를 만들면
  lexicon: Crum; Greek loan (eirēnē)
  rationale: 단순 정적 상태보다 상호 화해의 행위를 담아내기 위해 ‘평화를 이루다’로 옮겼습니다.
- source_word: ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ
  english_pob_choice: with each other
  chosen_korean: 서로
  alternatives_korean:
  - 함께
  - 서로의 동료와
  lexicon: Crum s.v. ⲉⲣⲏⲩ
  rationale: 관용적 상호성을 간결하게 드러내는 한국어 표현으로 ‘서로’를 사용했습니다.
- source_word: ϩⲛ ⲡⲉⲓⲏⲓ ⲟⲩⲱⲧ
  english_pob_choice: in this one house
  chosen_korean: 이 한 집에서
  alternatives_korean:
  - 이 같은 집에서
  - 이 집 한 곳에서
  lexicon: Crum; Lambdin
  rationale: ⲟⲩⲱⲧ의 ‘one/single/same’ 뉘앙스를 살리기 위해 ‘한’으로 옮기되, 문맥상 자연스러운 ‘이 한 집’으로 유지했습니다.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  english_pob_choice: Move away
  chosen_korean: 옮겨 가라
  alternatives_korean:
  - 물러가라
  - 떠나가라
  - 옮겨 가거라
  lexicon: Crum s.v. ⲡⲱⲱⲛⲉ; ⲉⲃⲟⲗ ‘out, away’
  rationale: ⲉⲃⲟⲗ의 ‘밖으로/멀리’ 뉘앙스를 반영하되, 명령형으로서는 ‘옮겨 가라’가 산의 이동을 가장 직접적으로 전달합니다.
theological_decisions:
- issue: 산을 향한 명령의 실재성
  chosen_reading: 비유적 과장이 아니라, 말씀의 권능이 자연에 미치는 실제적 명령으로 그대로 번역했습니다.
  alternative_readings:
  - 상징적으로 옮겨 버리다
  - 비유적으로 지나가게 하다
  rationale: 본문은 산을 직접 향해 ‘말한다’고 하므로, 그 강도를 약화시키지 않고 자연적 이동의 진술로 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 말씀의 권능과 믿음의 결과를 강조하는 문맥 보존
- issue: 직접화법의 문체
  chosen_reading: 인용문 안에서는 명령형을 유지하고, 서술문은 합쇼체로 처리했습니다.
  alternative_readings:
  - 전체를 평서문으로 통일
  - 인용문도 간접화법으로 완화
  rationale: 원문의 예수 직접발화를 분명히 드러내되, 한국어 문체는 현대 공용역의 정중함을 유지했습니다.
  doctrine_reference: 인용 화법과 화자 구분의 보존
