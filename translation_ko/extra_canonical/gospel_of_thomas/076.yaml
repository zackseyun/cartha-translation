base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/076.yaml
  text: 'Jesus said[a], “The Reign of the Father is like a merchant. He had a consignment of goods, and he found a pearl. The merchant was prudent: he sold the consignment and bought the one pearl for himself. You too, seek his treasure that does not fail, that endures—the place where no moth comes in to eat it[e][d][c][b], and no worm destroys.”'
  footnotes:
  - marker: a
    text: 'He sold the consignment: lit. “he gave the consignment out.” In the buy/sell context this idiom denotes selling or otherwise liquidating the goods.'
    reason: lexical_alternative
  - marker: b
    text: 'Seek for yourselves: the Coptic has an explicit reflexive (ϩⲱⲱⲛⲧⲱⲧⲛ), emphasizing personal appropriation.'
    reason: cultural_note
  - marker: c
    text: 'His treasure: Dilley notes an orthographic issue at this point (ⲛⲥⲁⲡⲉ{ϥ}ⲉ/ϩⲟ), normalized as ⲛⲥⲁⲡⲉϥⲁϩⲟ. The translation follows the normalized reading.'
    reason: lacuna_or_restoration
  - marker: d
    text: 'Where no moth…nor worm: Thomas has ‘worm’ (ⲡϥⲛⲧ), not ‘rust’ as in some Synoptic parallels; the image is of organic decay rather than corrosion.'
    reason: cross_reference
  - marker: e
    text: Or 'You too, seek for yourselves his treasure'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「아버지의 다스리심은 상인이 자기 화물을 가지고 있다가, 진주 하나를 발견한 것과 같습니다. 그 상인은 지혜로워서 화물을 팔아 그 한 진주를 자기 것으로 샀습니다. 너희도 썩지 않는 그의 보물을, 곧 좀이 들어가 먹지 못하고 벌레가 망가뜨리지 못하는 그곳을 찾으십시오」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic의 ϩⲱⲱⲛⲧⲱⲧⲛ은 재귀가 아니라 강조적 표현이어서, ‘너희도’로 옮기고 ‘너희 자신을 위해’ 같은 의미는 넣지 않았습니다.
    reason: source_note
  - marker: b
    text: ‘벌레’는 Thomas 본문이 보존한 표현으로, 공관복음의 일부 평행본문에 보이는 ‘녹’이 아닙니다.
    reason: cross_reference
  - marker: c
    text: 본문의 ‘그의 보물’은 장기적으로 사라지지 않는 것을 가리키는 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  english_pob_choice: the Reign of the Father
  chosen_korean: 아버지의 다스리심
  alternatives_korean:
  - 아버지의 나라
  - 아버지의 통치
  lexicon: Layton; Crum (s.v. ⲣⲣⲟ)
  rationale: ⲙⲛⲧⲣⲣⲟ는 영역보다 왕의 통치/다스림을 가리키는 추상명사이므로, 한국어에서도 ‘나라’보다 ‘다스리심’이 원뜻을 더 직접적으로 드러냅니다.
- source_word: ⲣⲱⲙⲉ ⲛϣⲱⲧ / ⲡϣⲱⲧ
  english_pob_choice: merchant / the merchant
  chosen_korean: 상인
  alternatives_korean:
  - 장사꾼
  - 무역상
  lexicon: Crum (s.v. ϣⲱⲧ)
  rationale: 거래·상업의 문맥에서 가장 자연스러운 한국어는 ‘상인’이며, 뒤의 재지시도 같은 낱말로 처리하는 것이 흐름에 맞습니다.
- source_word: ⲫⲟⲣⲧⲓⲟⲛ
  english_pob_choice: consignment (of goods)
  chosen_korean: 화물
  alternatives_korean:
  - 적재물
  - 상품 묶음
  - 물건 꾸러미
  lexicon: Greek loan (φορτίον) as used in Coptic
  rationale: 상업적 맥락의 φορτίον 계열은 실물 화물/짐의 뉘앙스를 갖고 있어, ‘화물’이 가장 간결하고 문맥에 맞습니다.
- source_word: ⲥⲁⲃⲉ
  english_pob_choice: prudent
  chosen_korean: 지혜로워서
  alternatives_korean:
  - 신중해서
  - 분별 있어
  lexicon: Crum (s.v. ⲥⲁⲃⲉ)
  rationale: 이 문맥의 ⲥⲁⲃⲉ는 상거래에서의 분별 있는 판단을 뜻하므로, 결과를 드러내는 ‘지혜로워서’가 자연스럽습니다.
- source_word: ϩⲱⲱⲛⲧⲱⲧⲛ
  english_pob_choice: You too
  chosen_korean: 너희도
  alternatives_korean:
  - 너희 역시
  - 너희 또한
  lexicon: Lambdin (pronouns/reflexive); applied revision
  rationale: 최종 판정에 따라 이 형태는 재귀가 아니라 강조 부사적 ‘너희도/너희 또한’이므로, POB 수정본을 따라 중복 해석 없이 옮겼습니다.
- source_word: ⲡⲉϥⲁϩⲟ
  english_pob_choice: his treasure
  chosen_korean: 그의 보물
  alternatives_korean:
  - 그의 재물
  - 그의 숨은 재산
  lexicon: Crum (s.v. ⲁϩⲟ)
  rationale: ⲁϩⲟ는 ‘보물, 재산’의 범위를 갖지만, 뒤의 ‘썩지 않는’ 대목과 함께 읽을 때 ‘보물’이 가장 적절합니다.
- source_word: ϫⲟⲟⲗⲉⲥ / ⲡϥⲛⲧ
  english_pob_choice: moth / worm
  chosen_korean: 좀 / 벌레
  alternatives_korean:
  - 나방 / 벌레
  - 좀벌레 / 구더기
  lexicon: Crum (s.v. ϫⲟⲟⲗⲉⲥ; ⲫⲛⲧ)
  rationale: Thomas의 본문은 공관복음의 ‘녹’이 아니라 ‘벌레’ 이미지를 가지므로, 원문의 부패·훼손 이미지를 살려 ‘좀’과 ‘벌레’로 구분해 옮겼습니다.
theological_decisions:
- issue: ‘하나님의 나라’가 아니라 ‘아버지의 다스리심’으로 옮길지 여부
  chosen_reading: 비유의 초점을 장소적 왕국보다 아버지의 현재적 통치 행위에 두어 ‘아버지의 다스리심’으로 번역했습니다.
  alternative_readings:
  - 아버지의 나라
  - 아버지의 통치
  rationale: Coptic ⲙⲛⲧⲣⲣⲟ는 왕권/통치의 추상성을 강하게 띠므로, 독자가 이를 영토적 개념으로만 이해하지 않도록 했습니다.
  doctrine_reference: 하나님의 나라/통치에 대한 신약성경의 동적 표현
