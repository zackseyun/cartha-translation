  to: 예수께서 말씀하셨습니다. 「아버지의 다스리심은 화물을 가진 한 상인과 같습니다. 그가 진주 하나를 발견하였습니다. 그 상인은 현명하여 화물을 팔고 그 한 진주를 자신을 위해 샀습니다. 너희도 다하지 않고 지속되는 그의 보물, 곧 좀도 들어와 먹지 않고 벌레도 망가뜨리지 않는 곳에 있는 보물을 찾으십시오.」[a][b][c]
