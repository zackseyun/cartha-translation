  source_fidelity: 첫 문장은 3인칭 일반 명제로 잘 처리했지만, ‘찾는 것을 멈추다’는 찾는 행위가 아니라 찾는 대상을 멈춘다는 뜻으로도 읽힐 수 있어 부정확합니다. 또한 ⲣ̄ⲣ̄ⲣ̄ⲟ는 ‘왕이 되다’보다 ‘왕으로 다스리다/통치하다’라는 동사이므로 이를 반영해야 합니다. ϣⲧⲟⲣⲧⲣ와 ⲣϣⲡⲏⲣⲉ의 의미 구별도 ‘동요하다’와 ‘경탄하다’로 더 분명히 할 수 있습니다.
  naturalness: ‘찾기를 멈추지 말아야 합니다’가 현대 표준어에서 행위의 지속을 더 자연스럽고 명료하게 나타냅니다. ‘만물 위에 왕으로 다스릴 것입니다’는 원문의 왕권 동사와 ‘위에’를 모두 보존하면서 합쇼체 문맥에 맞습니다.
  terminology: ‘만물’은 ⲡⲧⲏⲣϥ(‘그 전체/the All’)의 도마복음적 집합적·우주론적 용법을 무리 없이 반영합니다. ‘동요하다’는 다음의 ‘경탄하다’와 겹치지 않으면서 ϣⲧⲟⲣⲧⲣ의 교란·불안 의미를 살립니다.
