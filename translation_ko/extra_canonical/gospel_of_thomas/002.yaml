    issue: ‘왕이 될 것입니다’가 ⲣ̄ⲣ̄ⲣ̄ⲟ의 동사적 의미를 약화합니다.
    rationale: 이 동사는 단순히 왕이라는 신분을 얻는 것보다 왕으로서 다스리는 행위를 뜻하므로 ‘왕으로 다스릴 것입니다’가 더 충실합니다.
