base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/002.yaml
  text: Jesus said[a], "Let the one who seeks not stop seeking until he finds; and when he finds, he will be disturbed; and when he is disturbed, he will marvel[e][d][c][b]; and he will reign over the All."
  footnotes:
  - marker: a
    text: The Greek fragment (POxy 654) has ‘he will be astounded … and having reigned, he will rest,’ whereas the Coptic reads ‘he will be disturbed; … he will marvel’ and ends without ‘rest.’
    reason: textual_variant
  - marker: b
    text: ϣⲧⲟⲣⲧⲣ can also be rendered ‘be troubled’ or ‘be alarmed’; here kept distinct from the next verb ‘marvel/be amazed’ (ⲣϣⲡⲏⲣⲉ).
    reason: lexical_alternative
  - marker: c
    text: ‘the All’ is a Thomasine idiom for the totality of things/the cosmos, not merely ‘many things.’
    reason: cultural_note
  - marker: d
    text: Or 'Do not let the one who seeks stop seeking'.
    reason: previous_rendering
  - marker: e
    text: Or 'when he has been disturbed'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다.[a] “찾는 사람은 찾기를 멈추지 말아야 합니다.[d] 그가 찾으면 동요할 것이고,[b] 동요하면 경탄할 것이며,[e] 만물 위에 왕으로 다스릴 것입니다.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 단편(POxy 654)은 “그는 놀라게 될 것이고 … 왕이 된 뒤에는 쉬게 될 것이다”라고 전합니다. 그러나 콥트어 본문은 “그는 동요할 것이고 … 경탄할 것이다”라고 읽으며, 끝에 ‘쉬다’라는 말이 없습니다.
    reason: textual_variant
  - marker: b
    text: ϣⲧⲟⲣⲧⲣ는 ‘괴로워하다’, ‘불안해하다’, ‘당황하다’로도 옮길 수 있습니다. 여기서는 다음 동사 ⲣϣⲡⲏⲣⲉ(‘경탄하다/놀라다’)와 구별하기 위해 ‘동요하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘만물’은 도마복음에서 사물과 우주의 총체, 곧 ‘그 전체’를 가리키는 관용적 표현입니다. 단순히 ‘많은 것들’이라는 뜻이 아닙니다.
    reason: cultural_note
  - marker: d
    text: 또는 “찾는 사람은 찾기를 그만두지 말아야 합니다.”
    reason: previous_rendering
  - marker: e
    text: 또는 “동요한 뒤에”로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ…ⲗⲟ
  english_pob_choice: Let ... not stop/cease
  chosen_korean: “...는 찾는 것을 멈추지 말아야 합니다”
  alternatives_korean:
  - '...가 찾는 것을 그만두지 말아야 합니다'
  - '...는 찾기를 중단하지 말아야 합니다'
  lexicon: Layton (Grammar) on the negative jussive; Crum s.v. ⲗⲟ
  rationale: 3인칭 금지/권고형을 한국어에서는 자연스럽게 일반적 당위로 옮기되, ‘멈추다’로 ⲗⲟ의 ‘cease/stop’ 의미를 분명히 살렸습니다.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ
  english_pob_choice: the one who seeks
  chosen_korean: “찾는 사람”
  alternatives_korean:
  - “구하는 사람”
  - “찾는 이”
  lexicon: Layton (Grammar) on the articular participle
  rationale: 서술적으로 너무 부풀리지 않으면서도 주어 기능을 살리는 표현으로, Thomas 특유의 간결한 문장을 유지합니다.
- source_word: ϣⲧⲟⲣⲧⲣ
  english_pob_choice: be disturbed
  chosen_korean: “흔들릴”
  alternatives_korean:
  - “불안해할”
  - “당황할”
  - “혼란스러워할”
  lexicon: Crum s.v. ϣⲧⲟⲣⲧⲣ
  rationale: ‘disturbed/troubled/alarmed’의 의미장을 한국어에서 가장 압축적으로 드러내는 말로 ‘흔들리다’를 택해, 다음 동사 ‘놀라다’와도 구별되게 했습니다.
- source_word: ⲣϣⲡⲏⲣⲉ
  english_pob_choice: marvel
  chosen_korean: “놀랄”
  alternatives_korean:
  - “경이로워할”
  - “탄복할”
  - “놀라워할”
  lexicon: Crum s.v. ⲣϣⲡⲏⲣⲉ
  rationale: 여기서는 단순한 감탄보다 사건에 대한 놀라움을 압축적으로 전달하는 ‘놀라다’가 가장 자연스럽습니다.
- source_word: ⲉϫⲛ ⲡⲧⲏⲣϥ
  english_pob_choice: over the All
  chosen_korean: “만물 위에”
  alternatives_korean:
  - “전체 위에”
  - “모든 것 위에”
  - “온 우주 위에”
  lexicon: Crum s.v. ⲧⲏⲣⲉ; Thomasine idiom 'the All'
  rationale: Thomas의 관용구를 단순한 ‘모든 것’보다 더 도식적으로 드러내는 방향으로, 전체 총체를 가리키는 ‘만물’로 옮겼습니다.
theological_decisions:
- issue: Thomasine saying's final exalted claim about dominion over 'the All'
  chosen_reading: 종말론적 왕권 선언이라기보다, 찾고 발견하고 충격을 통과한 자가 총체 전체를 지배하는 영적·우주론적 수위를 말하는 표현으로 옮겼습니다.
  alternative_readings:
  - 하나님 나라에 대한 은유로 완화하는 해석
  - 단순한 자기수양의 성공담으로 낮추는 해석
  rationale: 본문은 ‘the All’이라는 도마복음 특유의 우주론적 어휘를 사용하므로, 이를 교회적 종말론 용어로 대체하지 않고 그대로 드러내는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: Thomasine cosmology / Nag Hammadi idiom
- issue: Register in direct speech attributed to Jesus
  chosen_reading: 예수의 직접 인용은 한국어 본문에서 평서적·권고적 합쇼체로 유지했습니다.
  alternative_readings:
  - 구어체 반말
  - 전통적인 하오체
  rationale: 청중에게 주는 경구 형식이므로 현대 표준어 합쇼체가 가장 읽기 자연스럽고, 화자의 권위도 유지합니다.
  doctrine_reference: Korean style guidance for publication-readable scripture translation
