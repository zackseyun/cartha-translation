  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘던져 놓았습니다’의 보조동사 ‘놓다’는 던진 뒤 의도적으로 그대로 두었다는 결과·방치의 뉘앙스를 더할 수 있어, 원문의 단순 완료 행위 ⲛⲟⲩϫⲉ를 ‘던졌습니다’로 옮기는 편이 더 안전합니다. ‘세상에’, ‘불’, ‘타오를 때까지’, 그리고 ϩⲁⲣⲉϩ의 지속성을 나타내는 ‘지키고 있습니다’는 적절합니다.
  naturalness: 합쇼체가 일관되고 문장이 자연스럽습니다. ‘보십시오’는 원문의 환기하는 지시 표현에 잘 맞습니다. ‘그것’을 ‘그 불’로 명시하면 한국어에서 지시 대상이 더 선명해지면서도 의미를 보태지 않습니다.
  terminology: ‘예수’, ‘세상’, ‘불’은 표준적인 현대 한국어 성서 번역 어휘로 적절합니다. 교파적 해석을 덧붙이지 않았습니다. 영어 POB 감사 기록에 있는 누가복음 12:49 교차참조 각주(c)가 한국어 초안에서 누락되어 있으므로, 해당 앵커와 각주를 보완해야 합니다.
