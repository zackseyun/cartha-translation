base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/010.yaml
  text: Jesus said[a], “I have cast a fire upon the world, and look[c][b], I am guarding it until it blazes.”
  footnotes:
  - marker: a
    text: “Look” renders the deictic idiom ⲉⲓⲥϩⲏⲏⲧⲉ, which can also be taken as “behold” or “pay heed.”
    reason: lexical_alternative
  - marker: b
    text: ϩⲁⲣⲉϩ may also be read “watch over/keep watch over,” but “guard” retains a protective nuance.
    reason: lexical_alternative
  - marker: c
    text: Cf. Luke 12:49 (“I came to cast fire upon the earth…”), noting Thomas’s different objects (“world”) and continuation (“I am guarding it until it blazes”).
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “내가 세상에 불을 던졌습니다. 보십시오[a][c], 나는 그 불이 타오를 때까지 그것을 지키고 있습니다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ⲉⲓⲥϩⲏⲏⲧⲉ는 “보십시오” 외에도 “보라”, “유의하십시오”로도 옮길 수 있는 지시적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ϩⲁⲣⲉϩ는 “지키다” 외에 “지켜보다”, “감시하다”로도 옮길 수 있습니다. 여기서는 보호하고 살피는 뉘앙스를 살렸습니다.
    reason: lexical_alternative
  - marker: c
    text: 누가복음 12:49를 비교하십시오(“나는 땅에 불을 던지러 왔노라 …”). 다만 도마복음은 대상이 “세상”이며, “나는 그것이 타오를 때까지 그것을 지키고 있다”는 이어지는 말이 다릅니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲁⲁⲛⲟⲕ … ⲛⲟⲩϫⲉ
  english_pob_choice: I have cast
  chosen_korean: 내가 … 던져 놓았습니다
  alternatives_korean:
  - 던졌습니다
  - 내던졌습니다
  - 내버렸습니다
  lexicon: Crum, s.v. ⲛⲟⲩϫⲉ; Layton, Coptic Grammar
  rationale: 완료된 행위와 현재적 결과를 함께 드러내기 위해 한국어 완료형에 ‘-놓다’를 써서 “cast”의 단발성과 남아 있는 효과를 살렸습니다.
- source_word: ⲛⲟⲩⲕⲱϩⲧ
  english_pob_choice: a fire
  chosen_korean: 불
  alternatives_korean:
  - 하나의 불
  - 화염
  lexicon: Crum, s.v. ⲕⲱϩⲧ
  rationale: 부정관사로 표시된 단일한 ‘fire’를 자연스러운 한국어로 옮겨 ‘불’로 두었습니다.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오,
  - 보라
  - 보십시오
  lexicon: Layton, Coptic Grammar
  rationale: 지시적 감탄사 기능을 살려 직접 독자를 향한 환기 표현으로 옮기되, 합쇼체 문맥에 맞게 ‘보십시오’를 선택했습니다.
- source_word: ϩⲁⲣⲉϩ
  english_pob_choice: am guarding
  chosen_korean: 지키고 있습니다
  alternatives_korean:
  - 지켜보고 있습니다
  - 감시하고 있습니다
  - 보호하고 있습니다
  lexicon: Crum, s.v. ϩⲁⲣⲉϩ
  rationale: 단순히 바라보는 것이 아니라 보호·경계의 뉘앙스를 함께 담는 ‘지키다’를 기본으로 하여 ‘guarding’을 옮겼습니다.
- source_word: ϫⲉⲣⲟ
  english_pob_choice: blazes
  chosen_korean: 타오를 때까지
  alternatives_korean:
  - 활활 탈 때까지
  - 불타오를 때까지
  - 타오를 때까지
  lexicon: Crum, s.v. ϫⲉⲣⲟ
  rationale: ‘burn’보다 더 강한 ‘blaze’의 역동성을 살리기 위해 ‘타오르다’ 계열을 택했습니다.
theological_decisions:
- issue: ‘world’의 범위와 직설성
  chosen_reading: ‘세상’으로 옮겨 우주론적 추상화보다 말의 직접성을 살렸습니다.
  alternative_readings:
  - ‘세계’
  - ‘우주’
  rationale: ⲡⲕⲟⲥⲙⲟⲥ는 넓은 ‘world-order’이지만, 한국어에서는 Thomas의 짧고 직설적인 진술을 유지하는 ‘세상’이 가장 자연스럽습니다.
  doctrine_reference: 해석학적 어조 결정
- issue: 문장 후반의 지속 행위
  chosen_reading: ‘지키고 있습니다’로 현재진행성을 살려 불이 아직 최종적으로 타오르지 않은 상태를 드러냈습니다.
  alternative_readings:
  - ‘지킵니다’
  - ‘지키겠습니다’
  rationale: 원문은 ‘until it blazes’라는 종결 시점을 향한 지속 동작을 표현하므로, 한국어에서도 진행형이 의미를 가장 잘 보존합니다.
  doctrine_reference: 서사/수사적 뉘앙스
