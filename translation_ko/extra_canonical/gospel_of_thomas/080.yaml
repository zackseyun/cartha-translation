base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/080.yaml
  text: Jesus said[a], “Whoever has come to know the world has found the body; and whoever has found the body[e][d][c][b], the world is not worthy of him.”
  footnotes:
  - marker: a
    text: Coptic ⲡⲥⲱⲙⲁ can mean either ‘body’ or ‘corpse.’ ‘Corpse’ is chosen to preserve Thomas’s stark antithesis; ‘body’ is possible but blunter.
    reason: lexical_alternative
  - marker: b
    text: The verb ϩⲉ ‘find’ appears with ⲉ before its object here, a dialectal/orthographic trait in Nag Hammadi Coptic that does not change the verb’s sense.
    reason: dialect_note
  - marker: c
    text: 'The definite article with ⲥⲱⲙⲁ is rendered anaphorically: first mention as ‘a corpse,’ second as ‘the corpse,’ a common way to reflect Coptic generic + anaphoric definiteness in English.'
    reason: cultural_note
  - marker: d
    text: Compare Saying 56, which transmits a closely parallel maxim; Thomas preserves both forms without internal harmonization.
    reason: cross_reference
  - marker: e
    text: Or 'a corpse; and whoever has found the corpse'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다[a]. “누구든지 세상을 알게 된 사람은 몸을 발견한 것이고, 몸을 발견한 사람은 세상이 그에게 합당하지 않습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲡⲥⲱⲙⲁ는 여기서 ‘몸’을 뜻하며, 같은 문구라도 Saying 56의 다른 어휘와 구별됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 말씀하십니다
  lexicon: Crum s.v. ϫⲱ / narrative speech formula
  rationale: 토마스 복음의 관용적 발화 도입문을 한국어 서술체로 옮겨, 인용문의 시작을 자연스럽게 표시했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉ…ⲥⲟⲟⲩⲛ
  english_pob_choice: whoever has come to know
  chosen_korean: 누구든지 세상을 알게 된 사람은
  alternatives_korean:
  - 누구든지 세상을 안 사람은
  - 누구든지 세상을 알게 된 이는
  lexicon: Crum s.v. ⲥⲟⲟⲩⲛ
  rationale: 완료된 인식을 나타내는 구문을 한국어의 ‘알게 된’으로 살려, 단순 현재형보다 완료 뉘앙스를 반영했습니다.
- source_word: ⲡⲥⲱⲙⲁ
  english_pob_choice: the body
  chosen_korean: 몸
  alternatives_korean:
  - 몸체
  - 육체
  lexicon: Crum s.v. ⲥⲱⲙⲁ
  rationale: 이 절의 ⲥⲱⲙⲁ는 ‘body’이며, English POB의 최신 검토가 ‘body’로 정리한 점을 따라 한국어로는 가장 직접적이고 중립적인 ‘몸’을 택했습니다. 토마스 56의 다른 어휘와 혼동되지 않도록 ‘시체/사체’로 과장하지 않았습니다.
- source_word: ⲙⲡϣⲁ … ⲁⲛ
  english_pob_choice: is not worthy of him
  chosen_korean: 그에게 합당하지 않습니다
  alternatives_korean:
  - 그에게 어울리지 않습니다
  - 그를 감당하지 못합니다
  lexicon: Crum s.v. ϣⲁ
  rationale: ‘worth/worthy’의 관용구를 ‘합당하다’로 옮겨, 단순한 가치평가보다 ‘자격이 없다’는 문맥적 의미를 살렸습니다.
theological_decisions:
- issue: ‘world’와 ‘body’의 병치가 주는 토마스적 역설
  chosen_reading: 세상을 아는 것은 몸을 발견하는 것과 병치되고, 그 결과 세상은 그 사람에게 합당하지 않은 것으로 말해집니다.
  alternative_readings:
  - 세상을 알면 몸을 찾게 되고, 세상은 그를 감당하지 못합니다.
  - 세상을 아는 사람은 시체를 발견하며, 세상은 그에게 합당하지 않습니다.
  rationale: 원문은 인식-발견-합당성의 역설을 짧게 병치합니다. 영어 POB의 최신 판단을 따라 ⲥⲱⲙⲁ를 ‘몸’으로 두어 Saying 56과의 어휘적 차이를 보존하면서, 과도한 해석 없이 반(反)세속적 긴장을 유지했습니다.
  doctrine_reference: 토마스 복음서 내 상호비교(Saying 56) 및 어휘 구분 보존
