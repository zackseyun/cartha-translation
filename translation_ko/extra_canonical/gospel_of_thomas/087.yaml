base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
  footnotes:
  - marker: a
    text: '“Depends on”: ⲉⲓϣⲉ (ⲁϣⲉ) with ⲛ + object can express resting on or reliance; alternatives include “rests on” or “is based on.”'
    reason: lexical_alternative
  - marker: b
    text: '“These two” (ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ) points back to the pair implied in the first clause: the dependent body and the body it depends on, not to body and soul.'
    reason: cultural_note
  - marker: c
    text: Loanword ⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ/ⲟⲛ corresponds to Greek ταλαίπωρος, “wretched, miserable.”
    reason: cultural_note
  - marker: d
    text: The manuscript alternates Greek endings -ον / -ος on the adjective; this does not change meaning.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「몸에 기대는 몸은 비참하고, 이 둘에 기대는 영혼도 비참합니다」.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기대다’는 ⲉⲓϣⲉ/ⲁϣⲉ + 목적어가 지닐 수 있는 ‘의지하다, 의존하다’의 뜻을 살린 번역입니다. 물리적 ‘기댐’과 관계적 ‘의존’이 함께 배경에 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 둘’은 앞의 두 몸—기대는 몸과 그 몸이 기대는 몸—을 가리키며, 몸과 영혼을 가리키는 것이 아닙니다.
    reason: cultural_note
  - marker: c
    text: ⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ/ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ는 그리스어 ταλαίπωρος에서 온 말로, ‘비참한, 불행한’의 뜻입니다.
    reason: source_note
  - marker: d
    text: 사본에는 형용사 어미가 -ον / -ος로 번갈아 나타나지만 의미 차이는 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲛ / ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ
  english_pob_choice: wretched
  chosen_korean: 비참하고
  alternatives_korean:
  - 불쌍하고
  - 가엾고
  - 고통스러운
  lexicon: Crum; Greek loan ταλαίπωρος
  rationale: 강한 평가어로서의 뉘앙스를 살리기 위해 ‘비참하다’를 택했습니다. ‘불쌍하다’보다 자기-파국적 상태를 더 직접적으로 드러냅니다.
- source_word: 'ⲉⲓϣⲉ (relative: ⲉⲧⲉⲣⲉⲉⲓϣⲉ) + ⲛⲟⲩⲥⲱⲙⲁ / ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ'
  english_pob_choice: depends on
  chosen_korean: ~에 기대는
  alternatives_korean:
  - ~에 의존하는
  - ~에 기대고 있는
  - ~에 의지하는
  lexicon: Crum; Layton
  rationale: 본문의 관계적·지속적 의존을 자연스럽게 살리기 위해 ‘기대다’를 사용했습니다. 단순한 물리적 지지보다 의존과 의탁의 뉘앙스를 함께 담을 수 있습니다.
- source_word: ⲯⲩⲭⲏ
  english_pob_choice: soul
  chosen_korean: 영혼
  alternatives_korean:
  - 혼
  - 목숨
  - 생명
  lexicon: Crum; Layton
  rationale: 몸/영혼의 대구를 분명하게 드러내기 위해 ‘영혼’을 택했습니다. 여기서는 ‘목숨’보다 내적 실체를 가리키는 대비가 더 적절합니다.
- source_word: ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  english_pob_choice: these two
  chosen_korean: 이 둘
  alternatives_korean:
  - 이 두 가지
  - 이 둘의
  - 이 두
  lexicon: Layton (demonstratives; dual)
  rationale: 직전의 한 쌍을 가리키는 이중 지시를 간결하게 살리기 위해 ‘이 둘’로 옮겼습니다.
theological_decisions:
- issue: 예수 발화의 경고적·격언적 어조
  chosen_reading: 직설적 판단문으로 유지했습니다.
  alternative_readings:
  - 완곡한 경구로 완화
  - 도덕적 권면형으로 변환
  rationale: 도마복음의 압축적 경구 형식을 보존하기 위해 문장을 해설적으로 풀지 않고, ‘비참하다’의 단정성을 유지했습니다.
  doctrine_reference: 문체·장르 보존
- issue: ⲯⲩⲭⲏ의 번역 범위
  chosen_reading: ‘영혼’으로 고정했습니다.
  alternative_readings:
  - 생명
  - 자아
  rationale: 이 구절은 몸과 영혼의 병치를 분명히 세우므로, ‘생명’이나 ‘자아’로 넓히면 본문의 대조 구조가 흐려집니다.
  doctrine_reference: 본문 평행구조 보존
