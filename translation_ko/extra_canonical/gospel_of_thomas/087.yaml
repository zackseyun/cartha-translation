base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
  footnotes:
  - marker: a
    text: '“Depends on”: ⲉⲓϣⲉ (ⲁϣⲉ) with ⲛ + object can express resting on or reliance; alternatives include “rests on” or “is based on.”'
    reason: lexical_alternative
  - marker: b
    text: '“These two” (ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ) points back to the pair implied in the first clause: the dependent body and the body it depends on, not to body and soul.'
    reason: cultural_note
  - marker: c
    text: Loanword ⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ/ⲟⲛ corresponds to Greek ταλαίπωρος, “wretched, miserable.”
    reason: cultural_note
  - marker: d
    text: The manuscript alternates Greek endings -ον / -ος on the adjective; this does not change meaning.
    reason: dialect_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “몸에 기대는[a] 몸은 비참합니다[c][d]. 이 둘에[b] 기대는 영혼도 비참합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기대다’는 ⲉⲓϣⲉ/ⲁϣⲉ가 ⲛ과 함께 목적어를 취할 때 지닐 수 있는 ‘의지하다, 의존하다’의 뜻을 살린 번역입니다. ‘~에 의존하는’, ‘~에 기반을 두는’으로도 옮길 수 있으며, 물리적 ‘기댐’과 관계적 ‘의존’의 여지가 함께 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이 둘’(ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ)은 앞 절에서 암시된 두 몸, 곧 기대는 몸과 그 몸이 기대는 몸을 가리킵니다. 몸과 영혼을 가리키는 것은 아닙니다.
    reason: cultural_note
  - marker: c
    text: 형용사 ⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ는 그리스어 ταλαίπωρος에서 온 말로, ‘비참한, 불행한’이라는 뜻입니다.
    reason: source_note
  - marker: d
    text: 사본에서는 이 형용사의 그리스어식 어미가 -ον과 -ος로 번갈아 나타나지만, 의미 차이는 없습니다.
    reason: textual_variant
