review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional scene, the exceptional birth expression, prostration, worship, demonstrative identification, and ‘your Father.’ However, ⲉⲃⲟⲗ ϩⲛ ⲡⲥϩⲓⲙⲉ is more directly an origin/birth expression, ‘from a woman,’ than Korean ‘여자를 통해’ (‘through a woman’). ‘여자에게서’ preserves this relation without interpretive addition.
  naturalness: The proposed revision uses natural modern formal-polite Korean. ‘그 이는’ is more idiomatic and suitably neutral than ‘그 사람’ for a pointed referent who is immediately called ‘your Father.’ ‘얼굴을 땅에 대고 엎드려’ naturally expresses the distributive plural-body-part construction in Korean.
  terminology: ‘경배하십시오’ appropriately renders ⲟⲩⲱϣⲧ in conjunction with the commanded bodily prostration. ‘아버지’ preserves the source term without denominational expansion. The revised notes avoid suggesting the unsupported, stronger image ‘face into the ground.’
  issues:
  - severity: medium
    issue: ‘여자를 통해 태어나지 않은’
    rationale: ‘통해’ can imply mediation or agency. The Coptic birth idiom ⲉⲃⲟⲗ ϩⲛ + ‘woman’ denotes origin, best rendered ‘여자에게서 태어나지 않은.’
  - severity: low
    issue: Footnote c overstates the bodily image by offering ‘얼굴을 땅에 박다.’
    rationale: The source says to cast/fall down upon one’s face; it does not specifically say to drive or strike one’s face into the ground. The note should describe prostration without intensifying the action.
  revised_text: 예수께서 말씀하셨습니다. “여자에게서 태어나지 않은 이를 보게 되면, 얼굴을 땅에 대고 엎드려[b] 그에게 경배하십시오. 그 이는[a] 바로 여러분의 아버지입니다.”
  revised_footnotes:
