- from: 예수께서 말씀하셨습니다. “여자를 통해 태어나지 않은 이를 보게 되면, 얼굴을 땅에 대고 엎드려 그를 경배하십시오. 그 사람은 바로 여러분의 아버지입니다.”[a][b][c]
  to: 예수께서 말씀하셨습니다. “여자에게서 태어나지 않은 이를 보게 되면, 얼굴을 땅에 대고 엎드려[b] 그에게 경배하십시오. 그 이는[a] 바로 여러분의 아버지입니다.”
  rationale: 출생의 기원을 나타내는 Coptic 관용구를 ‘여자에게서’로 바로잡고, 지시어의 강조를 한국어에서 더 자연스럽고 중립적으로 보존했습니다. 또한 각주에서 원문보다 강한 동작을 암시하던 표현을 제거했습니다. 본문의 수수께끼적 표현과 신학적 모호성은 해설하거나 특정하지 않았습니다.
