base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/015.yaml
  text: Jesus said[a], "When you see the one who was not born from a woman, throw yourselves down upon your faces and worship him[d][c][b]. That one is your Father."
  footnotes:
  - marker: a
    text: '"Not born from a woman" evokes biblical idiom (cf. Matt 11:11; Job 14:1) but the identification with "your Father" is distinctive to Thomas.'
    reason: cross_reference
  - marker: b
    text: The idiom could be rendered "prostrate yourselves" for a more conventional liturgical tone, but "throw yourselves down" preserves Thomas’s stark diction.
    reason: lexical_alternative
  - marker: c
    text: ⲣⲉⲙⲙⲁⲩ is a deictic "that one," strengthening the demonstrative force rather than a simple "he."
    reason: dialect_note
  - marker: d
    text: Or 'upon your face'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “여자를 통해 태어나지 않은 이를 보게 되면, 얼굴을 땅에 대고 엎드려 그를 경배하십시오. 그 사람은 바로 여러분의 아버지입니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 지시어 ⲣⲉⲙⲙⲁⲩ는 단순한 ‘그’보다 ‘그 사람/그 이’를 가리키는 강조를 띱니다.
    reason: source_note
  - marker: b
    text: ‘엎드리다’는 원문의 ⲡⲱϩⲧ이 지닌 거친 하강 동작을 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘얼굴을 땅에 대고’는 문맥상 ‘얼굴을 땅에 대다/얼굴을 땅에 박다’의 직설적 몸짓을 전달합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 말씀하셨습니다
  - 예수께서 말씀하십니다
  lexicon: Coptic ⲡⲉϫⲉ + subject의 직접화법 도입 용례
  rationale: 직접 인용을 여는 서술로서 간결한 ‘말씀하셨습니다’가 토마스복음서의 단문적 어조를 잘 살립니다.
- source_word: ⲉⲧⲉⲙ̄ⲡⲟⲩϫⲡⲟϥ / ⲉⲃⲟⲗ ϩⲛ̄ⲧⲥϩⲓⲙⲉ
  english_pob_choice: was not born from a woman
  chosen_korean: 여자를 통해 태어나지 않은
  alternatives_korean:
  - 여자로부터 태어나지 않은
  - 여인에게서 태어나지 않은
  lexicon: Coptic birth idiom ⲉⲃⲟⲗ ϩⲛ + ⲥϩⲓⲙⲉ
  rationale: 문맥상 ‘태어남’의 기원을 가리키므로 직설적으로 옮기되, 한국어에서는 ‘통해’가 원문의 출생-기원을 자연스럽게 드러냅니다.
- source_word: ⲡⲱϩⲧ ⲉϫⲛⲡⲉⲧⲛϩⲟ
  english_pob_choice: throw yourselves down upon your faces
  chosen_korean: 얼굴을 땅에 대고 엎드려
  alternatives_korean:
  - 얼굴을 땅에 던지며 엎드려
  - 얼굴을 땅에 대고 엎드리십시오
  lexicon: Coptic ⲡⲱϩⲧ (‘throw down/fall’) and ⲛϩⲟ (‘face’)
  rationale: 영어 POB의 거친 몸짓을 살리면서도 한국어에서는 ‘얼굴을 땅에 대고 엎드리다’가 가장 자연스럽고 시각적입니다.
- source_word: ⲟⲩⲱϣⲧ
  english_pob_choice: worship
  chosen_korean: 경배하십시오
  alternatives_korean:
  - 예배하십시오
  - 숭배하십시오
  lexicon: Coptic ⲟⲩⲱϣⲧ (worship, do obeisance)
  rationale: 절하는 동작과 연결되는 공경 행위를 드러내기 위해 ‘경배하다’를 택했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ
  english_pob_choice: that one
  chosen_korean: 그 사람은 바로
  alternatives_korean:
  - 그분은 바로
  - 그 이는 바로
  lexicon: Coptic deictic ⲣⲉⲙⲙⲁⲩ (‘that one’)
  rationale: 지시어의 강조를 살리면서 한국어에서는 매끈하게 풀어 ‘그 사람은 바로’로 옮겼습니다.
- source_word: ⲡⲉⲧⲛⲉⲓⲱⲧ
  english_pob_choice: your Father
  chosen_korean: 여러분의 아버지
  alternatives_korean:
  - 여러분의 아버지
  - 당신들의 아버지
  lexicon: Coptic ⲉⲓⲱⲧ (‘father’)
  rationale: 직접 소유 관계를 분명히 하되, 한국어에서는 복수 대상을 자연스럽게 가리키는 ‘여러분의’가 적합합니다.
theological_decisions:
- issue: ‘여자를 통해 태어나지 않은 이’라는 표현의 직설성
  chosen_reading: 문맥의 기이함과 충격을 약화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - ‘여자에게서 태어나지 않은 이’처럼 더 관용적으로 완화
  - ‘동정녀에게서 나지 않은 이’처럼 해석을 덧붙임
  rationale: 토마스의 말은 출생의 통상성을 뒤집는 수수께끼적 표현이므로, 의미를 설명적으로 바꾸기보다 원문의 긴장을 유지하는 편이 더 충실합니다.
  doctrine_reference: 본문 의미 보존 및 수사적 충격 유지
- issue: 엎드림과 경배의 결합
  chosen_reading: ‘엎드려 … 경배하십시오’로 몸의 동작과 종교적 행위를 함께 살렸습니다.
  alternative_readings:
  - ‘절하십시오’ 하나로 단순화
  - ‘염수하시오’처럼 전통 교회식 어휘 사용
  rationale: 원문은 신체적 굴복과 숭배를 함께 요청하므로, 둘을 분리하지 않고 병렬로 옮겨야 합니다.
  doctrine_reference: 공경/예배 행위의 이중성
