base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/055.yaml
  text: Jesus said, "Whoever does not hate his father and his mother cannot be my disciple; and whoever does not hate his brothers and his sisters, and does not carry his cross as I do, will not be worthy of me."[a][b][c]
  footnotes:
  - marker: a
    text: Printed MS reads “his brothers … and his sisters” (ⲥⲛⲏⲩ … ⲥⲱⲛⲉ). Dilley’s normalized lemmatization lists “his son … his daughter.” This draft follows the manuscript reading.
    reason: textual_variant
  - marker: b
    text: Coptic ⲛⲡⲁϩⲉ = “in my way/road, in my manner.” It is not the explicit verb “follow,” which the saying does not use.
    reason: dialect_note
  - marker: c
    text: Cf. Luke 14:26–27; Matthew 10:37–38 for related motifs, though Thomas’s diction is distinct.
    reason: cross_reference
  - marker: a
    text: Or 'will not be my disciple'.
    reason: previous_rendering
  - marker: b
    text: Or 'in my way'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “자기 아버지와 어머니를 미워하지 않는 사람은 내 제자가 될 수 없습니다. 또 자기 형제들과 자매들을 미워하지 않고 자기 십자가를 내 방식대로 지지 않는 사람은 나에게 합당하지 않습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 절의 콥트어 동사 ⲙⲟⲥⲧⲉ는 강한 뜻의 ‘미워하다’입니다.
    reason: source_note
  - marker: b
    text: ⲛⲡⲁϩⲉ는 문자적으로 ‘내 길/내 방식으로’에 가까운 표현입니다. 이 말씀에는 단순히 ‘따르다’라는 동사가 쓰이지 않았습니다.
    reason: source_note
  - marker: c
    text: 필사본 본문은 ‘그의 형제들 … 그의 자매들’(ⲥⲛⲏⲩ … ⲥⲱⲛⲉ)을 읽습니다. 정규화·표제화 자료에는 이와 다른 ‘아들 … 딸’ 독법이 제시되기도 하나, 여기서는 필사본 독법을 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  english_pob_choice: hate
  chosen_korean: 미워하지 않다
  alternatives_korean:
  - 싫어하지 않다
  - 혐오하지 않다
  lexicon: Crum; Sahidic usage
  rationale: 사하고 날카로운 대립을 유지하기 위해 완화된 “덜 사랑하다”가 아니라 직접적인 “미워하다” 계열을 택했습니다.
- source_word: ϣⲣ̄ⲙⲁⲑⲏⲧⲏⲥ
  english_pob_choice: cannot be my disciple
  chosen_korean: 내 제자가 될 수 없다
  alternatives_korean:
  - 내 제자가 되지 못한다
  - 내 제자가 될 능력이 없다
  lexicon: Layton
  rationale: 첫 절은 잠재/가능성 구문으로 읽혀 단순한 미래보다 “~할 수 없다”가 원문 대비를 더 정확히 드러냅니다.
- source_word: ⲛⲡⲁϩⲉ
  english_pob_choice: as I do
  chosen_korean: 내 방식대로
  alternatives_korean:
  - 내 길에서
  - 내 길처럼
  - 내가 하는 대로
  lexicon: Crum; dialect note in audit trail
  rationale: 문맥상 공간적 ‘길’보다 예수의 십자가를 지는 방식의 동일성을 가리키므로, 한국어에서는 동작 양식을 분명히 하는 표현이 가장 자연스럽습니다.
- source_word: ⲥⲧⲁⲩⲣⲟⲥ
  english_pob_choice: cross
  chosen_korean: 십자가
  alternatives_korean:
  - 형주
  - 나무
  lexicon: Greek loanword; established Christian term
  rationale: 그리스어 차용어의 통상적 의미를 따라 표준적인 한국어 신앙어휘인 “십자가”로 옮겼습니다.
theological_decisions:
- issue: ‘hate’의 강한 대조를 약화시키지 않을지
  chosen_reading: 원문의 날선 요구를 유지해 “미워하지 않다”로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 사랑하지 않다
  - 덜 사랑하지 않다
  - 버리지 않다
  rationale: 토마스 복음서의 경구적 충격을 희석하면 본문의 급진성이 사라집니다. 한국어 독자에게도 대조의 강도를 그대로 전달하는 것이 source-direct합니다.
  doctrine_reference: 서사·수사 보존 원칙
- issue: ‘내 방식대로’의 해석 범위
  chosen_reading: ‘내 십자가를 내 방식대로 지지’로 번역해 비교/동일성의 의미를 드러냈습니다.
  alternative_readings:
  - 내 길로
  - 내 길 안에서
  - 나처럼
  rationale: Coptic 표현은 단순히 ‘따르다’가 아니라 예수의 십자가-bearing 방식과의 일치를 뜻하므로, 이를 과도하게 교회적 용어로 환원하지 않았습니다.
  doctrine_reference: source-specific lexical transparency
