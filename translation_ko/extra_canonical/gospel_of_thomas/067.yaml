base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/067.yaml
  text: Jesus said[1], "The one who knows the All, yet lacks himself[a][x][t][3][2], is lacking in every respect."
  footnotes:
  - marker: '1'
    text: “the All” renders ⲡⲧⲏⲣϥ; alternatives include “the whole” or “everything.” Thomas often uses “the All” with cosmic scope (cf. the work’s internal usage).
    reason: lexical_alternative
  - marker: '2'
    text: '“lacks himself” translates ⲉⲣⲉ ⲛⲧⲟϥ ⲣϭⲣⲱϩ ⲟⲩⲁⲁ ⲛⲧⲟϥ; alternatives: “is lacking in himself,” or “is lacking (alone/by himself).” The ⲟⲩⲁⲁ + pronoun construction supports a reflexive nuance.'
    reason: lexical_alternative
  - marker: '3'
    text: “in every respect” reflects idiomatic ⲛⲡⲙⲁ ⲧⲏⲣⲛⲧⲟϥ (‘in the place [of him] all’), an adverbial totality phrase.
    reason: dialect_note
  - marker: t
    text: 'NH II, 45.20: the second subject pronoun is supplied by the editor (⟨ϥ⟩) and normalized as ⲛⲧⲟϥ; the scribe likely omitted it. Meaning is unchanged.'
    reason: lacuna_or_restoration
  - marker: x
    text: Thematically compare Mark 8:36; Matt 16:26; Luke 9:25 (gain the world vs. loss of self), noting that Thomas’s diction is distinct.
    reason: cross_reference
  - marker: a
    text: Or 'Jesus said, "The one who has come to know the All, yet lacks himself, is lacking in every respect."'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「모든 것을 알면서도 자기 자신이 결핍된 사람은 모든 면에서 결핍되어 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 자신이 결핍된’은 ⲟⲩⲁⲁ ⲛⲧⲟϥ가 수반된 표현을 옮긴 것입니다. ‘자기 자신을 결여한’, ‘홀로 자신 안에서 결핍된’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 면에서’는 마지막 구문의 관용적 총체성 표현을 옮긴 것입니다. ‘완전히’ 또는 ‘전적으로’로도 옮길 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲧⲏⲣϥ
  english_pob_choice: the All
  chosen_korean: 모든 것
  alternatives_korean:
  - 전체
  - 만물
  lexicon: Crum; Thomasine usage
  rationale: 본문의 ⲡⲧⲏⲣϥ는 단순한 ‘전부’보다 총체성을 가리키므로, 한국어에서는 자연스럽게 ‘모든 것’으로 옮기되 토마스복음 특유의 우주적 뉘앙스를 유지했습니다.
- source_word: ⲥⲟⲟⲩⲛ (relative present ⲡⲉⲧⲥⲟⲟⲩⲛ)
  english_pob_choice: knows
  chosen_korean: 아는
  alternatives_korean:
  - 알고 있는
  - 알아 온
  lexicon: Coptic relative present; Crum
  rationale: 영어 POB의 “knows”처럼 현재적·격언적 의미를 살리되, 한국어에서는 관계절로 자연스럽게 풀어 ‘아는 사람’으로 옮겼습니다.
- source_word: ⲣϭⲣⲱϩ
  english_pob_choice: lacks
  chosen_korean: 부족하면
  alternatives_korean:
  - 결핍되면
  - 모자라면
  - 부족하다면
  lexicon: Crum
  rationale: 동사가 ‘결핍되다/모자라다’의 뜻이므로, 문맥상 자기 자신에 대한 결핍을 간결하게 드러내는 ‘부족하면’을 택했습니다.
- source_word: ⲛⲡⲙⲁ ⲧⲏⲣⲛⲧⲟϥ
  english_pob_choice: in every respect
  chosen_korean: 모든 면에서
  alternatives_korean:
  - 완전히
  - 전적으로
  lexicon: Layton; Crum
  rationale: 직역하면 어색한 관용구이므로, 총체적 결핍을 뜻하는 기능적 표현인 ‘모든 면에서’로 옮겼습니다.
theological_decisions:
- issue: ‘the All’의 범위와 토마스복음의 총체성 표현
  chosen_reading: ‘모든 것’으로 옮겨, 단순한 양적 전부가 아니라 전체성/총체성의 의미를 유지했습니다.
  alternative_readings:
  - ‘전체’
  - ‘만물’
  rationale: 이 말은 지식의 범위와 자기 인식의 결핍을 대비하는 토마스의 총체성 어휘를 사용하므로, 한국어도 그 철학적 긴장을 살려야 합니다.
  doctrine_reference: Gospel of Thomas 67; Thomasine totality motif
