- from: 예수께서 말씀하셨습니다. “두 개를 하나로 만들 때에는 인자들의 자녀가 될 것이며, ‘산아, 물러가라’고 말하면 그것이 옮겨질 것입니다.”[a][b]
  to: 예수께서 말씀하셨습니다. “둘을 하나로 만들면, 여러분은 그 사람의 자녀들이 될 것입니다.[a] 그리고 ‘산아, 물러가라’고 말하면, 그것은 옮겨 갈 것입니다.”[b]
  rationale: 원문의 단수 정관사 ⲡⲣⲱⲙⲉ와 집합적 복수 ⲛϣⲏⲣⲉ를 보존하고, 한국어 ‘인자’가 불러오는 특정 성서 칭호의 연상을 피했습니다. 또한 마지막 동사의 자동사적 미래 의미를 ‘옮겨 갈 것입니다’로 회복했습니다. 두 개를 하나로 만드는 표현의 의도는 해석으로 확정하지 않고 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:20Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ⲉⲣϣⲁⲛ ... ϫⲟⲟⲥ를 ‘말하면’으로 옮긴 점과 ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ의 이동·이탈 방향을 ‘물러가라’로 표현한 점은 원문에 충실합니다. 그러나 ⲛϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ는 단수의 정관사 명사구 ‘그 사람/그 인간의 자녀들(아들들)’이지 ‘인자들’(복수)의 자녀가 아닙니다. 또한 ‘인자’는 한국어 성서 관습상 ‘Son of Man’이라는 별도 칭호를 강하게 환기하므로 여기의 토마스식 ⲡⲣⲱⲙⲉ를 부정확하게 만듭니다. 마지막 절의 ⲛⲁⲡⲱⲱⲛⲉ는 자동사 미래이므로 수동형 ‘옮겨질 것입니다’보다 ‘옮겨 갈 것입니다’가 적절합니다.
  naturalness: ‘둘을 하나로 만들면’은 간결하고 자연스러우며, ‘산아, 물러가라’는 호격과 명령의 격조를 잘 살립니다. ‘그 사람의 자녀들이 될 것입니다’는 다소 낯선 원문의 표현을 과도하게 해석하지 않고 현대 한국어 합쇼체로 전달합니다.
  terminology: ‘인자들의 자녀’는 단수 ⲡⲣⲱⲙⲉ를 복수화하고, ‘인자’라는 정착된 신학적 용어를 도입하므로 수정해야 합니다. ⲛϣⲏⲣⲉ는 문맥상 집합적 ‘자녀들’로 옮길 수 있으며, 각주에서 더 문자적인 ‘아들들’ 가능성을 밝혀 둘 수 있습니다. ‘그 사람’은 정관사를 반영하면서 ‘인자’의 불필요한 공관복음식 연상을 피합니다.
  issues:
