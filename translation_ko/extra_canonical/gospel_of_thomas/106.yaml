base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/106.yaml
  text: Jesus said[a], “When you make the two one, you will become sons of the Human; and when you say, ‘Mountain[e][d][c][b], move away,’ it will move.”
  footnotes:
  - marker: a
    text: ‘Sons of the Human’ could be rendered ‘children of the Human’ (Coptic ⲛϣⲏⲣⲉ can be collective). Retaining ‘sons’ keeps the sharper literal edge and Thomas’s diction.
    reason: lexical_alternative
  - marker: b
    text: ‘Aloud’ translates ϫⲱⲛⲧⲟⲥ, which can also mean ‘openly’ or ‘boldly.’
    reason: lexical_alternative
  - marker: c
    text: Cf. Thomas 22, 48 (motif of making ‘two one’), where similar transformation language appears.
    reason: cross_reference
  - marker: d
    text: Cf. Mark 11:23; Matt 17:20; 21:21 for the mountain-moving motif in the Synoptics.
    reason: cross_reference
  - marker: e
    text: Or 'say it aloud,'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “둘을 하나로 만들면, 여러분은 그 사람의 자녀들이 될 것입니다.[a] 그리고 ‘산아, 물러가라’고 말하면, 그것은 옮겨 갈 것입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 사람의 자녀들’에서 ‘자녀들’은 콥트어 ⲛϣⲏⲣⲉ의 집합적 용법을 반영합니다. 더 문자적으로는 ‘그 사람의 아들들’로도 옮길 수 있습니다. ‘그 사람’은 정관사가 있는 ⲡⲣⲱⲙⲉ를 옮긴 것으로, 여기서 공관복음의 칭호인 ‘인자’로 단정하지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲉⲃⲟⲗ은 ‘밖으로/멀리’라는 방향성을 더합니다. 따라서 ‘물러가라’는 산이 현재 위치에서 떠나 이동하라는 뜻을 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲉⲓⲣⲉ ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  english_pob_choice: when you make the two one
  chosen_korean: 두 개를 하나로 만들 때에는
  alternatives_korean:
  - 두 가지를 하나로 만들 때에는
  - 둘을 하나로 만들 때에는
  lexicon: Crum s.v. ⲥⲛⲁⲩ, ⲟⲩⲁ; Layton §182
  rationale: Coptic의 ‘the two / one’ 대조를 살리되, 한국어에서 더 자연스럽게 읽히도록 ‘두 개를 하나로’로 옮겼습니다.
- source_word: ⲛϣⲏⲣⲉ ⲛⲡⲣⲱⲙⲉ
  english_pob_choice: sons of the Human
  chosen_korean: 인자들의 자녀
  alternatives_korean:
  - 사람의 아들들
  - 인자의 아들들
  - 인자의 자녀
  lexicon: Crum s.v. ϣⲏⲣⲉ, ⲣⲱⲙⲉ
  rationale: POB의 ‘the Human’을 ‘인자’로 풀기보다, 토마스 특유의 낯선 표현을 살려 ‘인자들의 자녀’로 옮겨 집단적 표현감을 유지했습니다.
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛϫⲱⲛⲧⲟⲥ ϫⲉ
  english_pob_choice: when you say, ‘Mountain, move away,’
  chosen_korean: ‘산아, 물러가라’고 말하면
  alternatives_korean:
  - ‘산아, 옮겨가라’고 말하면
  - ‘산아, 떠나라’고 말하면
  lexicon: Crum s.v. ϫⲱ, ⲉⲃⲟⲗ, ⲧⲟⲟⲩ
  rationale: 원문은 ‘말하다’에 해당하므로 ‘말하면’으로 두고, ⲉⲃⲟⲗ의 방향성을 ‘물러가라’로 자연스럽게 풀었습니다.
- source_word: ⲡⲧⲟⲟⲩ ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  english_pob_choice: Mountain… move away
  chosen_korean: 산아, 물러가라
  alternatives_korean:
  - 산아, 움직여라
  - 산아, 옮겨가라
  lexicon: Crum s.v. ⲧⲟⲟⲩ, ⲱⲱⲛⲉ
  rationale: ‘산’은 호격으로 처리했고, ⲱⲱⲛⲉ + ⲉⲃⲟⲗ의 ‘move away’는 한국어 명령형 ‘물러가라’가 가장 압축적으로 대응합니다.
theological_decisions:
- issue: ‘sons of the Human’의 성별 표지 보존 여부
  chosen_reading: ‘인자들의 자녀’로 옮겨 집단적 의미를 살리되 성별을 강하게 제한하지 않았습니다.
  alternative_readings:
  - ‘인자들의 아들들’
  - ‘사람의 자녀’
  rationale: Coptic ⲛϣⲏⲣⲉ는 집합적 의미가 가능하므로, 한국어에서는 토마스의 수수께끼 같은 표현을 유지하면서도 현대 독자가 이해할 수 있게 조정했습니다.
  doctrine_reference: 번역학적 판단이며 교리 확정이 아닙니다.
