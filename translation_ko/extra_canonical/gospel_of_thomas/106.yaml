    rationale: 원문은 ‘자녀들/아들들’의 소유·수식어인 ⲡⲣⲱⲙⲉ가 단수입니다. ‘인자들’은 근거 없이 복수화하며, ‘인자’는 여기서 원문이 사용하지 않은 ‘Son of Man’ 칭호를 암시합니다.
  - severity: medium
