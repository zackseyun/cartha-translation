base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/005.yaml
  text: 'Jesus says: Know what is before your face[a], and what is hidden from you will be uncovered[c] to you. For there is nothing hidden that will not be made manifest[d].[b]'
  footnotes:
  - marker: a
    text: ‘Before your face’ is a literal rendering of the Coptic idiom (ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ), meaning ‘right in front of you.’
    reason: cultural_note
  - marker: b
    text: 'POxy 654 adds: ‘and (nothing) buried which will not be raised up.’ The Nag Hammadi Coptic lacks this extra clause; this translation follows the Coptic.'
    reason: textual_variant
  - marker: c
    text: 'ϭⲱⲗⲡ literally ‘uncover’; alternatives: ‘reveal,’ ‘disclose.’'
    reason: lexical_alternative
  - marker: d
    text: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ means ‘become manifest/appear, come to light,’ not ‘live’ in this construction.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “얼굴 앞에 있는 것을 아십시오[a]. 그러면 당신에게 숨겨진 것이 드러날 것입니다[c]. 숨겨진 것 가운데 드러나지 않을 것은 하나도 없습니다[d].”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘얼굴 앞에’는 콥트어 관용구(ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ)를 직역한 표현으로, ‘바로 눈앞에’라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 포옥시린쿠스 파피루스 654는 “그리고 묻힌 것 가운데서도 일으켜 세워지지 않을 것은 없다”라는 추가 구절을 덧붙입니다. 나그함마디의 콥트어 본문에는 이 구절이 없으며, 이 번역은 콥트어 본문을 따릅니다.
    reason: textual_variant
  - marker: c
    text: ϭⲱⲗⲡ ⲉⲃⲟⲗ은 문자적으로 ‘덮개를 벗기다, 드러내다’라는 뜻입니다. ‘계시되다’ 또는 ‘밝혀지다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ은 이 표현에서는 ‘살다’가 아니라 ‘나타나다, 드러나다, 빛에 드러나다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  english_pob_choice: Know
  chosen_korean: 알라
  alternatives_korean:
  - 아시오
  - 알아라
  - 알십시오
  lexicon: Crum; Layton
  rationale: 토마스복음의 간결한 격언체를 살리기 위해 짧은 명령형으로 옮겼으며, 대상 독자에게 즉각적인 인식을 요구하는 힘을 보존했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ
  english_pob_choice: what is before your face
  chosen_korean: 네 얼굴 앞에 있는 것
  alternatives_korean:
  - 네 앞에 있는 것
  - 네 시야 앞에 있는 것
  - 네 얼굴 앞의 것
  lexicon: Crum (ⲙⲧⲟ ‘front, presence’); idiomatic Coptic expression
  rationale: 직역에 가까운 ‘얼굴 앞’으로 Coptic의 관용적이고 구체적인 이미지를 유지했으며, 단순한 ‘앞에’보다 원문의 물리적 긴장을 더 잘 드러냅니다.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  english_pob_choice: be uncovered
  chosen_korean: 드러날 것입니다
  alternatives_korean:
  - 벗겨질 것입니다
  - 열릴 것입니다
  - 나타날 것입니다
  lexicon: Crum; Layton
  rationale: 문자적으로는 ‘벗겨지다/드러나다’의 이미지가 있으나 한국어에서는 ‘드러나다’가 가장 자연스럽게 원문의 공개·폭로 의미를 전달합니다.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  english_pob_choice: be made manifest
  chosen_korean: 드러나지 않을 것은 하나도 없습니다
  alternatives_korean:
  - 나타나지 않을 것은 하나도 없습니다
  - 드러나게 될 것은 하나도 없습니다
  lexicon: Crum (ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ ‘appear, become manifest’)
  rationale: ‘made manifest’의 결과 상태를 자연스러운 부정 일반화로 옮겨, 숨겨진 것이 결국 드러난다는 격언의 보편성을 살렸습니다.
theological_decisions:
- issue: ‘before your face’의 직설성 유지 여부
  chosen_reading: 관용구를 풀되 이미지(얼굴 앞)를 유지해, 단순한 ‘눈앞’보다 더 구체적인 대면성을 드러냈습니다.
  alternative_readings:
  - ‘네 눈앞에 있는 것’
  - ‘네 앞에 있는 것’
  rationale: 본문은 심리적 내면보다 실제적인 대면과 인식의 우선순위를 강조하므로, 얼굴-앞의 이미지를 보존하는 것이 토마스의 격언적 압축을 더 잘 반영합니다.
  doctrine_reference: 해당 없음
- issue: 마지막 절의 보편 부정 표현
  chosen_reading: ‘숨겨진 것 가운데 드러나지 않을 것은 하나도 없습니다’로 옮겨, 보편적 폭로의 진술을 유지했습니다.
  alternative_readings:
  - ‘숨겨진 것은 모두 드러납니다’
  - ‘감춰진 것은 없을 것입니다’
  rationale: 원문은 예외 없는 일반 진술을 구성하므로, 한국어에서도 ‘하나도 없습니다’로 보편성을 보존하는 것이 적절합니다.
  doctrine_reference: '텍스트 비평적 주석: 나그함마디 콥트 본문을 따르며, POxy 654의 추가 구절은 본문에 포함하지 않았습니다.'
