review_pass:
  verdict: revise
  source_fidelity: 원문 ⲡⲙⲛⲧⲣⲣⲟ는 단지 ‘나라/왕국(kingdom)’이며 ‘하나님’이라는 말이 없습니다. 따라서 ‘하나님의 나라’는 이 대목의 콥트어가 명시하지 않는 신학적 한정을 더합니다. 그 밖에 숨겨진 보물, 원소유자와 아들의 무지, 아들의 밭 매각, 매수자의 경작 중 발견, 이자를 붙여 빌려 줌의 흐름은 원문에 충실합니다.
  naturalness: 합쇼체 서술은 자연스럽습니다. 다만 ‘누구에게나 원하는 대로’는 누가 원하는지와 방식이 무엇인지 다소 모호합니다. 원문의 ‘그가 원하는 사람들에게’를 명시하면 더 자연스럽고 정확합니다.
  terminology: ‘보물’, ‘밭을 갈고 있다가’, ‘이자를 붙여 돈을 빌려주다’는 적절합니다. 원문에 없는 ‘하나님의’를 삭제하여 ‘나라’로 옮겨야 합니다. ‘토마스복음’은 통용 표기이며, ‘토마스 복음’으로 띄어 쓰면 문서 내 가독성이 좋습니다.
  issues:
  - severity: high
    issue: ‘하나님의 나라’
    rationale: 원문은 ⲡⲙⲛⲧⲣⲣⲟ(‘나라/왕국’)만 말하며 하나님을 가리키는 낱말이 없습니다. 이를 보충하면 원문 이상의 신학적 특정화가 됩니다.
  - severity: low
    issue: ‘누구에게나 원하는 대로’의 주체·수식 범위
