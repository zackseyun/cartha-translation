base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
  footnotes:
  - marker: '1'
    text: The parable in Thomas diverges significantly from the canonical parallel in Matthew 13:44. In Thomas, the original owner is unaware of the treasure, and it is the subsequent buyer who finds it and uses it to lend at interest.
    reason: cross_reference
  - marker: '2'
    text: Several words in this saying are restored from lacunas in the manuscript, but the restorations are standard and highly certain from the surviving letters and context.
    reason: textual_variant
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “나라는 밭에 숨겨진 보물을 가진 사람과 같습니다. 그는 그것을 알지 못했습니다. 그가 죽은 뒤, 그것을 자기 아들에게 남겼습니다. 아들도 알지 못했습니다. 아들은 그 밭을 차지하여 팔았습니다. 그 밭을 산 사람이 와서, 밭을 갈고 있다가 그 보물을 발견했습니다. 그는 자기가 원하는 사람들에게 이자를 붙여 돈을 빌려주기 시작했습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 토마스 복음의 이 대목은 마태복음 13:44의 평행구와 크게 다릅니다. 여기서는 원래 주인이 보물을 모르고 있으며, 뒤이어 그 밭을 산 사람이 그것을 발견한 뒤 이자를 붙여 돈을 빌려줍니다.
    reason: cross_reference
  - marker: b
    text: 이 구절의 몇몇 단어는 사본의 손상된 부분에서 복원된 것이지만, 남아 있는 글자와 문맥상 표준적이고 매우 확실한 복원입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  english_pob_choice: the kingdom
  chosen_korean: 하나님의 나라
  alternatives_korean:
  - 나라
  - 왕국
  lexicon: Crum 190a
  rationale: 토마스복음의 비유 문맥에서 ‘나라/왕권’의 통치 실재를 가리키므로, POB 기본 용례에 따라 ‘하나님의 나라’로 옮겼습니다.
- source_word: ⲁϩⲟ / ⲡⲁϩⲟ
  english_pob_choice: treasure
  chosen_korean: 보물
  alternatives_korean:
  - 재물
  - 감춰진 보화
  lexicon: Crum 22a
  rationale: 문맥상 밭에 감춰진 귀중한 매장물을 뜻하므로 자연스럽고 간결한 ‘보물’이 적절합니다.
- source_word: ⲉⲣⲉⲛⲧⲟϥϩⲱⲡ
  english_pob_choice: hidden treasure
  chosen_korean: 숨겨진
  alternatives_korean:
  - 감춰진
  - 감추어진
  lexicon: Crum 709b
  rationale: 보물을 수식하는 상태를 분명히 드러내기 위해 명사 앞에서 ‘숨겨진’으로 처리했습니다.
- source_word: ⲉϥⲥⲕⲁⲉⲓ
  english_pob_choice: while he was plowing
  chosen_korean: 밭을 갈고 있다가
  alternatives_korean:
  - 갈다가
  - 경작하고 있다가
  lexicon: Crum 374a
  rationale: 주절이 아니라 동시적 상황을 나타내므로, 우연히 발견했다는 비유의 긴장을 살려 ‘-고 있다가’로 옮겼습니다.
- source_word: ⲛϯϩⲟⲙⲧ ⲉⲡⲙⲏⲥⲉ
  english_pob_choice: lend money at interest
  chosen_korean: 이자를 붙여 돈을 빌려주다
  alternatives_korean:
  - 돈을 이자로 빌려주다
  - 고리로 빌려주다
  lexicon: Crum 185b
  rationale: Coptic 관용 표현의 핵심인 ‘이자’와 ‘돈을 빌려주다’를 함께 드러내어, 단순 투자나 추상화로 약화되지 않게 했습니다.
theological_decisions:
- issue: 원문의 비유 역전 구조
  chosen_reading: 원 소유자는 보물을 알지 못하고, 나중에 밭을 산 사람이 우연히 발견합니다.
  alternative_readings:
  - 처음 주인이 보물을 알고 있었다
  - 아들이 보물을 알아차렸다
  rationale: 콥트어가 원 소유자의 무지(ⲛⲁⲧⲥⲟⲟⲩⲛ)와 이후 매수자의 발견을 분명히 하므로, 마태복음과의 차이를 지우지 않고 그대로 보존했습니다.
  doctrine_reference: 본문비평/복음서 평행구절 비교
- issue: 이자 수취의 보존
  chosen_reading: 그는 보물을 활용해 누구에게나 원하는 대로 이자를 붙여 돈을 빌려주기 시작했습니다.
  alternative_readings:
  - 돈을 투자하기 시작했습니다
  - 보물을 쌓아두기 시작했습니다
  rationale: 텍스트는 도덕적으로 완화된 ‘투자’가 아니라 명시적으로 이자 수취를 말하므로, 난감한 요소를 그대로 살려야 합니다.
  doctrine_reference: 본문의 직설적 의미 보존
