  to: 예수께서 말씀하셨습니다. “나라는 밭에 숨겨진 보물을 가진 사람과 같습니다. 그는 그것을 알지 못했습니다. 그가 죽은 뒤, 그것을 자기 아들에게 남겼습니다. 아들도 알지 못했습니다. 아들은 그 밭을 차지하여 팔았습니다. 그 밭을 산 사람이 와서, 밭을 갈고 있다가 그 보물을 발견했습니다. 그는 자기가 원하는 사람들에게 이자를 붙여 돈을 빌려주기 시작했습니다.”[a][b]
