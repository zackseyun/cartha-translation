  - severity: medium
    issue: ‘많은 첫째’가 수식 관계를 불명확하게 함
    rationale: ‘첫째인 많은 사람이’로 옮겨 ‘많은 이들’이 ‘첫째’라는 원문의 술어 관계를 명료하게 해야 합니다.
