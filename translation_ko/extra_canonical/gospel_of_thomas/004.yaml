base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
  footnotes:
  - marker: '1'
    text: P.Oxy. 654 includes the phrase "and the last first" after "will become last," which the Coptic omits.
    reason: textual_variant
  - marker: '2'
    text: The Coptic text creates a wordplay between ϫⲛⲁⲩ (jnau, "hesitate") and ϫⲛⲉ (jne, "ask"), which is lost in English.
    reason: register_note
  - marker: '3'
    text: The aphorism "many who are first will be last" appears in Matthew 19:30, Mark 10:31, and Luke 13:30, but Thomas omits the canonical second half ("and the last first") and appends its own conclusion ("and they will become a single one").
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「나이 든 사람은 자기 나날에 일주일 된 작은 아이에게 생명의 자리가 어디인지 묻는 것을 부끄러워하지 않을 것이며, 그는 살 것입니다. 많은 첫째가 마지막이 되고, 그들은 하나 곧 한 사람이 될 것입니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: P.Oxy. 654는 ‘마지막이 된다’ 뒤에 “그리고 마지막은 첫째가 된다”에 해당하는 구절을 덧붙이지만, 콥트어 본문은 그것을 생략합니다.
    reason: textual_variant
  - marker: b
    text: 콥트어 본문은 ϫⲛⲁⲩ와 ϫⲛⲉ 사이에 말장난을 형성합니다. 한국어 번역에서는 그 음향 효과를 완전히 재현하기 어렵습니다.
    reason: source_note
  - marker: c
    text: ‘많은 첫째가 마지막이 된다’는 경구는 마태 19:30, 마가 10:31, 누가 13:30과 평행합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ ⲛϩⲗⲗⲟ ϩⲛⲡⲉϥϩⲟⲟⲩ
  english_pob_choice: An old man in his days
  chosen_korean: 나이 든 사람은 자기 나날에
  alternatives_korean:
  - 노인이 자기 날들에
  - 늙은 사람은 그의 날들에
  lexicon: Crum 170b / 226a
  rationale: 노인/나이 든 사람은 연령을 드러내고, ⲛϩⲟⲟⲩ를 직역해 ‘자기 나날에’로 두어 원문의 시간표현을 살렸습니다.
- source_word: ϫⲛⲁⲩ / ϫⲛⲉ
  english_pob_choice: hesitate / ask
  chosen_korean: 부끄러워하지 않을 것이며 / 묻는
  alternatives_korean:
  - 머뭇거리지 않을 것이며 / 묻는
  - 망설이지 않을 것이며 / 질문하는
  lexicon: Crum 775a-b
  rationale: 영문 본문은 ϫⲛⲁⲩ를 ‘hesitate’로 풀었지만, 문맥의 수치·위계 역전은 ‘부끄러워하지 않다’가 더 직접적으로 드러내므로 그 긴장을 살렸고, ϫⲛⲉ는 단순한 ‘묻다’로 옮겼습니다.
- source_word: ⲡⲧⲟⲡⲟⲥ ⲙ̄ⲡⲱⲛϩ
  english_pob_choice: the place of life
  chosen_korean: 생명의 자리
  alternatives_korean:
  - 생명의 장소
  - 생명의 곳
  lexicon: Crum 440a / 564b
  rationale: ⲧⲟⲡⲟⲥ는 ‘장소/자리’ 모두 가능하지만, 한국어에서는 상징적·지시적 의미를 함께 담는 ‘자리’가 자연스럽습니다.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  english_pob_choice: a single one
  chosen_korean: 하나 곧 한 사람
  alternatives_korean:
  - 한 하나
  - 한 존재
  - 하나의 한 사람
  lexicon: Crum 471a
  rationale: Thomas의 반복어구인 ‘one, single’의 수적 단일성과 결속감을 살리기 위해 ‘하나 곧 한 사람’으로 옮겼습니다.
theological_decisions:
- issue: ‘첫째가 마지막이 되고’ 뒤의 토마스 결말 표현
  chosen_reading: 마지막 구절을 ‘그들은 하나 곧 한 사람이 될 것입니다’로 번역해 공관복음의 대구를 넘어서 토마스 특유의 통합 결말을 보존했습니다.
  alternative_readings:
  - ‘그들은 하나가 될 것입니다’
  - ‘그들은 하나로 될 것입니다’
  rationale: 본문의 Coptic은 마태·마가·누가의 익숙한 역전 경구를 따르면서도, 끝을 ‘single one’으로 닫아 단순한 순서 역전을 넘어 존재의 통합을 말합니다.
  doctrine_reference: Thomasine unity motif; textual comparison with Matthew 19:30 / Mark 10:31 / Luke 13:30
- issue: 부끄러워하지 않다의 사회적 함의
  chosen_reading: ‘묻는 것을 부끄러워하지 않을 것이며’로 번역해 연장자가 어린아이에게 지혜를 구하는 수치 역전을 드러냈습니다.
  alternative_readings:
  - ‘머뭇거리지 않을 것이며’
  - ‘주저하지 않을 것이며’
  rationale: 단순한 망설임보다 연장자의 체면과 위계가 뒤집히는 긴장이 이 말씀의 핵심이므로, 수치의 뉘앙스를 남기는 편이 본문 효과에 가깝습니다.
  doctrine_reference: Honor-shame reversal in sayings tradition
