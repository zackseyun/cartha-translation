revisions:
- from: 예수께서 말씀하셨습니다. 「나이 든 사람은 자기 나날에 일주일 된 작은 아이에게 생명의 자리가 어디인지 묻는 것을 부끄러워하지 않을 것이며, 그는 살 것입니다. 많은 첫째가 마지막이 되고, 그들은 하나 곧 한 사람이 될 것입니다」.[a][b][c]
  to: 예수께서 말씀하셨습니다. “나이 든 사람이, 자기 나이에 태어난 지 이레 된 어린아이에게 생명의 자리에 관하여 묻기를 망설이지 않을 것이며[b], 그는 살 것입니다. 첫째인 많은 사람이 마지막이 될 것이며[a][c], 그들은 하나, 곧 단 하나가 될 것입니다.”
  rationale: 원어 본문을 우선하여 ϫⲛⲁⲩ를 ‘망설이다’로 바로잡고, ⲟⲩⲁ ⲟⲩⲱⲧ에 없는 ‘사람’이라는 해석적 보충을 제거했습니다. ‘자기 나이에’는 다소 낯선 원문의 ϩⲛ ⲡⲉϥϩⲟⲟⲩ를 보존하되 현대 한국어 문장 안에서 읽히도록 처리했습니다. 이문과 어휘 말놀이의 각주 앵커도 해당 본문 가까이 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:17Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ϫⲛⲁⲩ를 ‘부끄러워하다’로 옮겼으나, 콥트어와 P.Oxy. 654의 그리스어 ἀποκνήσει는 ‘망설이다/주저하다’의 뜻을 지지합니다. 또한 ⲟⲩⲁ ⲟⲩⲱⲧ은 ‘한 사람’이 아니라 ‘하나, 단 하나’라는 단일성 표현이므로 인격적 명사를 보태지 않는 것이 안전합니다. ‘많은 첫째’도 한국어에서 원문의 ‘first인 많은 사람들’을 정확히 드러내지 못합니다.
  naturalness: ‘자기 나날에’와 ‘일주일 된 작은 아이’는 현대 한국어에서 다소 부자연스럽습니다. ‘나이 든 사람이, 자기 나이에’ 및 ‘태어난 지 이레 된 어린아이’로 다듬으면 원문의 반복적 시간 표현과 연령의 대조를 유지하면서도 자연스럽습니다.
  terminology: ‘생명의 자리’는 τόπος/ⲧⲟⲡⲟⲥ의 공간적·상징적 모호성을 과도하게 해석하지 않아 유지할 수 있습니다. 종결어는 ‘하나, 곧 단 하나’로 옮겨 ⲟⲩⲁ ⲟⲩⲱⲧ의 병렬 강조를 보존합니다.
