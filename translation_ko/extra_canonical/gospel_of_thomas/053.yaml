base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/053.yaml
  text: His disciples said to him[1], “Does circumcision benefit or not?” He said to them, “If it were beneficial, their father would beget them circumcised from their mother. Rather[6][5][4][3][2], the circumcision of truth in spirit has become entirely profitable.”
  footnotes:
  - marker: '1'
    text: ‘If it were beneficial’ reflects the irrealis construction ⲛⲉⲣⲉ…; cf. Layton, Grammar §280.
    reason: lexical_alternative
  - marker: '2'
    text: ‘Beget them … from their mother’ reflects a paternal subject (ⲡⲉⲩⲉⲓⲱⲧ) and source construction (ⲉⲃⲟⲗ ϩⲛ ⲡⲉⲩⲙⲁⲁⲩ).
    reason: cultural_note
  - marker: '3'
    text: ‘Circumcision of truth’ can be taken adjectivally as ‘true circumcision.’
    reason: lexical_alternative
  - marker: '4'
    text: ‘Has become entirely profitable’ renders the idiom ⲁϥϭⲛ̄ϩⲏⲩ ⲧⲏⲣϥ; lit. ‘has become entirely (so),’ with ‘profitable’ supplied from context.
    reason: lexical_alternative
  - marker: '5'
    text: 'Conceptual echoes: Rom 2:29; Phil 3:3.'
    reason: cross_reference
  - marker: '6'
    text: Lycopolitan-influenced pronominal form ⲛⲁⲛⲧⲟϥ (‘to him’) occurs in this saying.
    reason: dialect_note
translation:
  language: ko
  text: 그의 제자들이 그에게 말했습니다. 「할례가 유익합니까, 아니면 아닙니까?」 그가 그들에게 말씀하셨습니다. 「만일 그것이 유익했다면,[a] 그들의 아버지가 어머니에게서 그들을 할례받은 상태로 얻게 하셨을 것입니다.[b] 오히려 영 안에서의 진리의 할례[c]는 완전히 유익하게 되었습니다.[d]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만일 그것이 유익했다면’은 ⲛⲉⲣⲉ…의 비현실 조건법을 반영한 번역입니다.
    reason: source_note
  - marker: b
    text: ‘그들의 아버지가 … 얻게 하셨을 것입니다’는 ‘아버지’가 주어인 ϫⲡⲟⲛ(낳다, 곧 beget)과 ‘어머니에게서’라는 출처 표현을 함께 옮긴 것입니다. 한국어에서는 부계 주어의 행위를 자연스럽게 나타내기 위해 ‘얻게 하다’로 표현했습니다.
    reason: source_note
  - marker: c
    text: ‘진리의 할례’는 ‘참된 할례’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘완전히 유익하게 되었습니다’는 ‘완전히 그렇게 되었다’라는 관용구에 앞 문맥의 ‘유익하다’를 보완하여 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲃⲃⲉ
  english_pob_choice: circumcision
  chosen_korean: 할례
  alternatives_korean:
  - 절개
  - 포경
  lexicon: Crum s.v. ⲥⲃⲃⲉ
  rationale: 유대적 의례를 가리키는 표준어로 ‘할례’가 가장 직접적이며, 문맥의 종교적 의미를 보존합니다.
- source_word: ⲣⲱⲫⲉⲗⲉⲓ
  english_pob_choice: benefit
  chosen_korean: 유익하다
  alternatives_korean:
  - 도움이 되다
  - 이익이 되다
  lexicon: Crum s.v. ὠφελεῖν
  rationale: 본문의 ‘유익/무익’ 대조를 자연스럽게 살리면서, 인용문 전체의 질문 형식을 현대 한국어로 매끈하게 옮깁니다.
- source_word: ⲛⲉⲣⲉ…ⲣⲱⲫⲉⲗⲉⲓ
  english_pob_choice: if it were beneficial
  chosen_korean: 만일 그것이 유익했다면
  alternatives_korean:
  - 만일 유익하였다면
  - 유익했더라면
  lexicon: Layton, Grammar §280
  rationale: 비현실 조건법을 한국어의 가정형으로 옮겨, POB가 지적한 반사실적 뉘앙스를 유지합니다.
- source_word: ⲛⲙⲉ
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 진실
  lexicon: Crum s.v. ⲙⲉ
  rationale: ‘truth’의 명사적 의미를 가장 안정적으로 전달하는 표준어로, 수식적 의미도 ‘진리의 할례’ 구조에서 보존됩니다.
- source_word: ϩⲛ ⲡⲛⲉⲩⲙⲁ
  english_pob_choice: in spirit
  chosen_korean: 영 안에서
  alternatives_korean:
  - 영으로
  - 성령 안에서
  lexicon: Standard Coptic usage for ⲡⲛⲉⲩⲙⲁ
  rationale: 이 문헌의 용례가 반드시 성령을 가리킨다고 단정되지 않으므로, 소문자적·비교신학적 모호성을 살려 ‘영’으로 옮깁니다.
- source_word: ⲁϥϭⲛ̄ϩⲏⲩ ⲧⲏⲣϥ
  english_pob_choice: has become entirely profitable
  chosen_korean: 완전히 유익하게 되었습니다
  alternatives_korean:
  - 전적으로 유익하게 되었습니다
  - 온전히 유익해졌습니다
  lexicon: Crum s.v. ϭⲛϩⲏⲩ
  rationale: 직역형 어순보다 한국어 자연성을 우선하되, ‘완전히/온전히’로 전체성의 강조를 살리고 ‘유익하게 되다’로 문맥상 생략된 의미를 드러냅니다.
theological_decisions:
- issue: ‘영’의 신학적 특정성
  chosen_reading: 여기서의 ‘영’은 문맥상 일반적 영적 영역을 가리키는 표현으로 유지하고, ‘성령’으로 특정하지 않았습니다.
  alternative_readings:
  - 성령 안에서
  - 성령으로
  rationale: 토마스 복음서의 본문 자체가 삼위일체적 고백 문맥을 전제하지 않으므로, 의미의 과잉특정을 피하는 것이 원문에 더 충실합니다.
  doctrine_reference: 문맥결정적 번역 원칙; 본문 내 명시성 우선
