base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/054.yaml
  text: Jesus said[a], “Blessed are the poor[f][e][d][c][b], for yours is the kingdom of the heavens.”
  footnotes:
  - marker: a
    text: ‘Blessed’ could also be rendered ‘Happy’ or ‘How fortunate,’ but the beatitude formula and evaluative tone favor ‘Blessed.’
    reason: lexical_alternative
  - marker: b
    text: Coptic ⲡϩⲏⲕⲉ is singular (‘the poor person’) used generically; English ‘the poor’ reflects the collective sense.
    reason: dialect_note
  - marker: c
    text: ⲡⲙⲛⲧⲣⲣⲟ may also be translated ‘kingdom’ or ‘reign.’ ‘Kingship’ emphasizes sovereignty rather than a place.
    reason: lexical_alternative
  - marker: d
    text: Compare Luke 6:20 (‘Blessed are you poor, for yours is the kingdom of God’) and Matthew 5:3 (‘Blessed are the poor in spirit, for theirs is the kingdom of heaven’). Thomas’s wording differs in address and attribute.
    reason: cross_reference
  - marker: e
    text: ‘Of the heavens’ reproduces the explicit plural in Coptic (ⲛⲡⲡⲉ), a Thomasine phrasing not to be conflated with ‘of God.’
    reason: dialect_note
  - marker: f
    text: Or 'Jesus said, “Blessed are the poor, for yours is the kingship of the heavens.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「가난한 사람들은 복이 있습니다. 하늘들의 나라가 여러분의 것이기 때문입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic의 ⲡϩⲏⲕⲉ는 단수형이지만 집합적으로 쓰여, 한국어에서는 복수 일반명사로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ⲡⲙⲛⲧⲣⲣⲟ는 문자적으로는 ‘왕권, 통치’의 뜻도 있지만, 이 문맥에서는 POB의 최종 영어처럼 ‘나라/kingdom’이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲛⲡⲡⲉ는 문자적으로 ‘하늘들의’라는 복수형을 보이며, Thomas의 특유한 복수 표현을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  english_pob_choice: Jesus said
  chosen_korean: 예수께서 말씀하셨습니다
  alternatives_korean:
  - 예수께서 이르셨습니다
  - 예수께서 말씀하셨다
  lexicon: Coptic speech-introducer ⲡⲉϫⲉ + proper name; cf. Crum s.v. ⲡⲉϫⲉ
  rationale: 표준적인 화자 도입 공식을 자연스럽게 옮기되, 본문 서술체를 합쇼체로 맞추었습니다.
- source_word: ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ / ⲡϩⲏⲕⲉ
  english_pob_choice: Blessed are the poor
  chosen_korean: 가난한 사람들은 복이 있습니다
  alternatives_korean:
  - 가난한 이들은 복이 있습니다
  - 가난한 사람은 복이 있습니다
  lexicon: Crum s.v. ⲙⲁⲕⲁⲣⲓⲟⲥ; Crum s.v. ⲡϩⲏⲕⲉ
  rationale: Coptic의 단수 일반명사 ⲡϩⲏⲕⲉ를 집합적 의미로 이해해 한국어에서는 복수 일반화로 자연스럽게 옮겼습니다. '복이 있습니다'가 축복 선언의 평가적 힘을 살립니다.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕권
  - 통치
  lexicon: Layton, Grammar; Crum s.v. ⲙⲛⲧⲣⲣⲟ
  rationale: POB의 최종 영어가 'kingdom'을 채택한 점을 따르되, 한국어에서는 도메인/현실성을 살리는 '나라'가 가장 무리 없는 대응입니다. 다만 원어의 통치 뉘앙스도 배경에 남습니다.
- source_word: ⲛⲡⲡⲉ
  english_pob_choice: of the heavens
  chosen_korean: 하늘들의
  alternatives_korean:
  - 하늘의
  - 하늘 나라의
  lexicon: Crum s.v. ⲡⲉ; Thomasine plural usage
  rationale: 복수형이 분명하므로 단수인 '하늘의'로 평준화하지 않고, Thomas 특유의 표현을 살려 '하늘들의'로 옮겼습니다.
theological_decisions:
- issue: ‘하늘들의 나라’의 복수 표지 보존
  chosen_reading: 한국어 본문에서 '하늘들의 나라'로 직역하여 Coptic의 복수형을 드러냈습니다.
  alternative_readings:
  - 하늘 나라
  - 하늘의 나라
  rationale: 이 구절은 마태복음식 관용어로 평준화할 수 있으나, 사본이 실제로 복수형을 쓰는 점을 가려 버리면 Thomas 특유의 문구가 약화됩니다.
  doctrine_reference: 본문 형태 보존 / Thomasine diction
