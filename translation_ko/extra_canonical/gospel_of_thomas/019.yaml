revisions:
- from: 예수께서 말씀하셨습니다. “복되도다, 오기 전에 이미 온 사람이여. 너희가 내 제자들이 되어 내 말을 들으면, 이 돌들이 너희에게 시중들 것입니다. 너희에게는 낙원에 다섯 그루의 나무가 있는데, 그것들은 여름에도 겨울에도 움직이지 않으며, 그 잎도 떨어지지 않습니다. 그것들을 알게 되는 사람은 죽음을 맛보지 않을 것입니다.”[a][b]
  to: 예수께서 말씀하셨습니다. “되기 전에 이미 된 사람은 복됩니다. 너희가 내 제자들이 되어 내 말들을 듣는다면, 이 돌들이 너희를 섬길 것입니다.[a] 너희에게는 낙원에 다섯 그루의 나무가 있습니다. 그것들은 여름에도 겨울에도 움직이지 않으며, 그 잎은 떨어지지 않습니다. 그것들을 아는 사람은 죽음을 맛보지 않을 것입니다.[b]”
  rationale: 원문의 ϣⲱⲡⲉ 반복이 만드는 ‘되기 전 이미 됨’의 역설을 보존하고, 사본 표면과 정규화본 사이의 단복수 문제를 한쪽으로 은폐하지 않도록 조정했습니다. 또한 전체 문체를 현대 표준 한국어 합쇼체로 통일하고, 불필요한 호격과 지나치게 협소한 ‘시중들다’를 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 ϣⲱⲡⲉ 반복은 단순한 물리적 ‘오다’가 아니라 ‘되다/존재하게 되다’의 역설입니다. 따라서 ‘오기 전에 이미 온’은 핵심 어휘적 긴장을 약화시키므로 ‘되기 전에 이미 된’으로 고쳤습니다. 또한 사본 표면의 복수형 분석과 정규화본의 단수 읽기가 충돌하므로, 본문은 사본 표면을 따라 복수로 번역하고 각주에서 단수 대안을 명시했습니다.
  naturalness: ‘복되도다, … 사람이여’는 현대 표준 한국어의 합쇼체와 거리가 있고 호격도 원문에 없습니다. ‘… 사람은 복됩니다’로 현대적인 선언문을 구성했습니다. ‘시중들 것입니다’는 일상적 수행·접객의 뜻이 강하므로, 다이아코네인의 폭넓은 봉사 의미에 맞게 ‘섬길 것입니다’로 조정했습니다.
  terminology: ‘복됩니다’, ‘제자들’, ‘낙원’, ‘죽음을 맛보다’는 격언적 어조와 주요 어휘를 유지합니다. ‘내 말들/이 돌들’은 사본 표면의 복수형 읽기를 반영하며, 정규화본의 ‘내 말/이 돌’은 본문비평 각주로 보존합니다.
  issues:
  - severity: medium
    issue: ϣⲱⲡⲉ를 ‘오다’로 일관되게 번역함
