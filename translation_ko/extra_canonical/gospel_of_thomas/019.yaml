base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/019.yaml
  text: Jesus said[a], “Blessed is the one who has come to be before he comes to be. If you become my disciples and listen to my words, these stones will minister to you. For you have five trees in Paradise; they do not move in summer or in winter, and their leaves do not fall[d][c][b]. Whoever comes to know them will not taste death.”
  footnotes:
  - marker: a
    text: ‘Blessed is the one who has come to be before he comes to be’ renders ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥϣⲱⲡⲉ ϩⲁⲡϩⲏ ⲉⲣⲉⲙⲡⲁⲧⲉⲛⲧⲟϥϣⲱⲡⲉ, a deliberate paradox based on ϣⲱⲡⲉ ‘to come into being’ (Crum).
    reason: lexical_alternative
  - marker: b
    text: The manuscript surface across NHAM02.36 lb 20–21 can be read as ‘my words, these stones (ⲁⲛⲁϣⲁϫⲉ ⲛⲉⲉⲓⲱⲛⲉ),’ yielding a plural ‘stones.’ Dilley’s normalized reading parses it as sg. ‘my word … this stone (ⲡⲁϣⲁϫⲉ … ⲡⲉⲓⲱⲛⲉ).’ This draft follows the normalized reading; the plural is a noted alternative.
    reason: textual_variant
  - marker: c
    text: ‘Will not taste death’ preserves the Coptic idiom ϫⲓϯⲡⲉ ⲛⲙⲟⲩ; cf. the idiom in Mark 9:1; Matt 16:28.
    reason: cross_reference
  - marker: d
    text: Or 'listen to my word, this stone will minister to you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “되기 전에 이미 된 사람은 복됩니다. 너희가 내 제자들이 되어 내 말들을 듣는다면, 이 돌들이 너희를 섬길 것입니다.[a] 너희에게는 낙원에 다섯 그루의 나무가 있습니다. 그것들은 여름에도 겨울에도 움직이지 않으며, 그 잎은 떨어지지 않습니다. 그것들을 아는 사람은 죽음을 맛보지 않을 것입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 사본 표면은 ‘내 말들’과 ‘이 돌들’로 분석될 수 있습니다. 그러나 정규화본은 ‘내 말’과 ‘이 돌’로 읽습니다. 이 번역은 사본 표면의 복수형 분석을 따르며, 단수 읽기도 가능한 본문비평적 대안으로 남아 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘죽음을 맛보다’는 ⲁⲛ ⲛⲙⲟⲩ와 함께 쓰인 콥트어 관용 표현을 직역하여 보존한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  english_pob_choice: Blessed
  chosen_korean: 복되도다
  alternatives_korean:
  - 복됩니다
  - 행복하다
  lexicon: Crum; Greek loanword usage in Coptic
  rationale: 비문체적 축복 선언의 압축성을 살리기 위해 ‘복되도다’로 옮겼습니다. 합쇼체 서술로 풀어도 되지만, 토마스의 격언적 어조를 더 직접적으로 드러냅니다.
- source_word: ϣⲱⲡⲉ
  english_pob_choice: come to be / come into being
  chosen_korean: 오기 전에 이미 온
  alternatives_korean:
  - 되기 전에 존재한
  - 태어나기 전에 태어난
  lexicon: Crum; Layton
  rationale: ‘come to be’의 존재-발생 역설을 한국어에서도 유지하려고 직역에 가깝게 구성했습니다. 자연스럽게 ‘태어나기 전에’로 좁히지 않았습니다.
- source_word: ⲁⲛⲁϣⲁϫⲉ / ⲡⲉⲓⲱⲛⲉ
  english_pob_choice: my words, these stones
  chosen_korean: 내 말 / 이 돌들
  alternatives_korean:
  - 내 말씀 / 이 돌들
  - 내 말들 / 이 돌들
  lexicon: Coptic manuscript reading; Dilley normalized text
  rationale: 사본 표면의 복수형을 반영해 ‘이 돌들’로 옮겼고, ⲁⲛⲁϣⲁϫⲉ는 한국어에서는 문맥상 ‘내 말’로 매끄럽게 처리했습니다. 정규화판의 단수 읽기는 주석으로 처리하는 편이 낫습니다.
- source_word: ⲛⲁⲣ̄ⲇⲓⲁⲕⲟⲛⲉⲓ
  english_pob_choice: will minister to
  chosen_korean: 시중들 것입니다
  alternatives_korean:
  - 섬길 것입니다
  - 봉사할 것입니다
  lexicon: Crum; Greek loanword
  rationale: 단순한 ‘섬기다’보다 도구적·대응적 뉘앙스를 살리기 위해 ‘시중들다’를 택했습니다. 한국어에서 다소 구어적이지만, 돌들이 사람에게 ‘봉사’하는 기이함을 더 생생하게 드러냅니다.
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  english_pob_choice: taste death
  chosen_korean: 죽음을 맛보지 않을 것입니다
  alternatives_korean:
  - 죽음을 경험하지 않을 것입니다
  - 죽지 않을 것입니다
  lexicon: Crum; Lambdin
  rationale: 관용구를 평탄화하지 않고 ‘맛보다’의 이미지를 보존했습니다. 영어 POB의 선택과 같은 방식으로, 죽음의 체험을 직접적으로 표현합니다.
theological_decisions:
- issue: 사본 표면의 복수형 읽기 vs 정규화본의 단수형 읽기
  chosen_reading: 본문은 사본 표면의 복수형을 따라 ‘내 말’과 ‘이 돌들’로 읽었습니다.
  alternative_readings:
  - 정규화본처럼 ‘내 말… 이 돌’로 단수 읽기
  rationale: 영어 POB audit trail과 최신 수정이 사본 표면의 복수형을 지지하므로, 편집적 정규화보다 현전하는 본문을 우선했습니다.
  doctrine_reference: 본문비평/사본 우선 원칙
- issue: ‘복되도다’의 문체 선택
  chosen_reading: 합쇼체 서술 속에서도 축복 선언의 압축성을 위해 감탄형 ‘복되도다’를 사용했습니다.
  alternative_readings:
  - ‘복됩니다’로 평서형화
  rationale: 이 말씀은 단순 정보 전달보다 선언적 축복의 힘이 핵심이므로, 한국어에서도 선언성을 유지하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 수사·화행 보존
