base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/105.yaml
  text: Jesus said[f][e][d][c][b][a], “The one who will come to know the father and the mother—they will call him ‘the son of a prostitute.’”
  footnotes:
  - marker: a
    text: Relative future literally reads “the one who will come to know,” not simply “who knows.”
    reason: lexical_alternative
  - marker: b
    text: The epithet could be rendered idiomatically as “son of a prostitute”; this draft preserves the double definiteness of the Coptic.
    reason: lexical_alternative
  - marker: c
    text: ϣⲏⲣⲉ can mean ‘child’; chosen as ‘son’ here due to the masculine article and conventional idiom.
    reason: lexical_alternative
  - marker: d
    text: ⲙⲟⲩⲧⲉ may also be translated “name” (“they will name him”).
    reason: lexical_alternative
  - marker: e
    text: Some English versions use “whore” for ⲡⲟⲣⲛⲏ; “prostitute” is chosen for precision and register.
    reason: lexical_alternative
  - marker: f
    text: Or 'Jesus said, “The one who will come to know the father and the mother—they will call him ‘the son of the prostitute.’”'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「아버지와 어머니를 알게 될 사람은 ‘창녀의 아들’이라 불릴 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲥⲟⲟⲩⲛ은 단순 현재 ‘알다’보다 미래적 상대구문으로 읽히므로 ‘알게 될’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲡⲟⲣⲛⲏ는 ‘the prostitute’가 아니라 ‘a prostitute’의 의미이므로, 한국어에서도 부정 관형으로 처리했습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲙⲟⲩⲧⲉ는 ‘이름하다’도 가능하지만, 여기서는 별칭을 붙이는 문맥이므로 ‘불리다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  english_pob_choice: come to know
  chosen_korean: 알게 될
  alternatives_korean:
  - 알는
  - 알아가는
  lexicon: Crum, s.v. ⲥⲟⲟⲩⲛ; relative future 용법
  rationale: 미래적 상대구문이므로 단순 현재형 ‘알다’보다 ‘알게 될’이 원문의 예비적·미래적 뉘앙스를 더 잘 살립니다.
- source_word: ⲡⲉⲓⲱⲧ
  english_pob_choice: the father
  chosen_korean: 아버지
  alternatives_korean:
  - 그 아버지
  - 아버지께서
  lexicon: Crum, s.v. ⲓⲱⲧ
  rationale: 문맥상 일반적 친족어이므로 자연스러운 현대 한국어로 옮기되, 불필요한 해석적 대명사는 넣지 않았습니다.
- source_word: ⲡⲙⲁⲁⲩ
  english_pob_choice: the mother
  chosen_korean: 어머니
  alternatives_korean:
  - 그 어머니
  - 어머니께서
  lexicon: Crum, s.v. ⲙⲁⲁⲩ
  rationale: 아버지와 짝을 이루는 친족어로 자연스럽게 대응시켰습니다.
- source_word: ⲡϣⲏⲣⲉ ⲛⲡⲟⲣⲛⲏ
  english_pob_choice: the son of a prostitute
  chosen_korean: 창녀의 아들
  alternatives_korean:
  - 한 창녀의 아들
  - 매춘부의 아들
  lexicon: Layton, Grammar §69–73; Crum s.v. ϣⲏⲣⲉ, loanword ⲡⲟⲣⲛⲏ
  rationale: POB가 교정한 대로 ⲡⲟⲣⲛⲏ는 ‘a prostitute’의 의미이므로 관형격은 부정관형으로 풀었습니다. ‘창녀’는 원문의 노골성을 유지하면서도 현대 한국어에서 가장 직접적인 대응입니다.
- source_word: ⲙⲟⲩⲧⲉ
  english_pob_choice: they will call him
  chosen_korean: 불릴 것입니다
  alternatives_korean:
  - 그를 부를 것입니다
  - 그를 이름 지을 것입니다
  lexicon: Crum, s.v. ⲙⲟⲩⲧⲉ
  rationale: 문장 구조상 3인칭 복수 주체가 있으나 한국어에서는 수동적으로 자연스럽게 처리할 수 있어, 호칭·별칭의 결과를 간결하게 드러내는 ‘불릴 것입니다’를 택했습니다.
theological_decisions:
- issue: 직설적 모욕 표현의 보존
  chosen_reading: ‘창녀의 아들’이라는 노골적 호칭을 그대로 유지했습니다.
  alternative_readings:
  - ‘매춘부의 아들’로 완화
  - ‘음녀의 아들’로 성서적 어휘화
  rationale: 토마스 복음서의 표현 강도와 사회적 경멸을 약화시키지 않기 위해, 원문의 도발적 뉘앙스를 유지했습니다.
  doctrine_reference: source-integrity / register preservation
