base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
  footnotes:
  - marker: reached
    text: 'The Coptic text features a deliberate wordplay here: the verb ''reached'' (ⲡⲱϩ, pōh) and the imperative ''split'' (ⲡⲱϩ, pōh) in the following sentence are identical in form.'
    reason: register_note
  - marker: Split a piece of wood
    text: In the Greek fragment P.Oxy. 1, the commands to lift the stone and split the wood appear in reverse order and are appended to the end of Saying 30.
    reason: textual_variant
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "나는 그들 모두 위에 있는 빛입니다. 나는 모든 것 그 자체입니다. 모든 것은 내게서 나왔고, 모든 것은 내게 이르렀습니다. 나무 조각을 쪼개 보십시오. 내가 거기에 있습니다. 돌을 들어 올리십시오. 그러면 거기서 나를 찾을 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲡⲱϩ(pōh)은 앞 문맥에서는 ‘이르다/도달하다’의 뜻이고, 뒤 문맥에서는 ‘쪼개다/가르다’의 뜻으로 같은 형태가 의도적으로 반복됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나무 조각을 쪼개 보십시오’는 콥트어의 명령형과 그 직후의 동일어놀이를 반영한 번역입니다. 영어 POB의 ‘Split a piece of wood’에 해당합니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  english_pob_choice: the light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 빛입니다
  lexicon: Crum 530a
  rationale: 예수의 자기지시를 자연스러운 현대 한국어로 옮기되, 원문의 명사적 동일시를 살리기 위해 ‘빛’으로 간결하게 렌더링했습니다.
- source_word: ⲡⲧⲏⲣϥ
  english_pob_choice: the All
  chosen_korean: 모든 것
  alternatives_korean:
  - 온갖 것
  - 전체
  - 만물
  lexicon: Crum 424a
  rationale: POB 영어의 ‘the All’은 원문의 실체화된 총체 개념이지만, 한국어에서는 직역투의 ‘모든 것’이 가장 이해 가능하면서도 총체성을 유지합니다.
- source_word: ⲡⲱϩ
  english_pob_choice: reached
  chosen_korean: 이르렀습니다
  alternatives_korean:
  - 닿았습니다
  - 도달했습니다
  - 미쳤습니다
  lexicon: Crum 282a
  rationale: 첫 번째 ⲡⲱϩ의 ‘reach, arrive at’ 의미를 살려, 출발점과 목적지를 이루는 병렬을 분명하게 했습니다.
- source_word: ⲡⲱϩ
  english_pob_choice: Split
  chosen_korean: 쪼개 보십시오
  alternatives_korean:
  - 쪼개십시오
  - 가르십시오
  - 부러뜨려 보십시오
  lexicon: Crum 284b
  rationale: 두 번째 ⲡⲱϩ의 ‘split, cleave’ 의미를 반영하면서, 바로 다음의 ‘거기에 있습니다’를 체험적으로 드러내기 위해 명령형에 ‘보십시오’를 덧붙였습니다. 다만 원문의 요구 강도를 약화시키지 않도록 본문은 간결하게 유지했습니다.
- source_word: ϥⲓ ⲙ̄ⲡⲱⲛⲉ ⲉϩⲣⲁⲓ
  english_pob_choice: Lift up the stone
  chosen_korean: 돌을 들어 올리십시오
  alternatives_korean:
  - 돌을 들어 보십시오
  - 돌을 치켜드십시오
  - 돌을 올리십시오
  lexicon: Crum 620b
  rationale: ϥⲓ의 ‘들다/들어올리다’와 ⲉϩⲣⲁⲓ의 ‘위로, 위쪽으로’ 방향성을 함께 반영해 ‘들어 올리다’로 옮겼습니다.
- source_word: ⲧⲉⲧⲛⲁϩⲉ ⲉⲣⲟⲉⲓ
  english_pob_choice: you will find me there
  chosen_korean: 거기서 나를 찾을 것입니다
  alternatives_korean:
  - 그곳에서 나를 발견할 것입니다
  - 거기서 나를 만나게 될 것입니다
  lexicon: Crum 654a
  rationale: 영어 POB의 ‘find’와 콥트어 ϩⲉ의 의미에 맞추어 ‘찾다’로 옮겨, 단순 시각 인지가 아니라 발견/조우의 의미를 보존했습니다.
theological_decisions:
- issue: ⲡⲧⲏⲣϥ의 총체성 표현
  chosen_reading: ‘모든 것’으로 옮겨, 예수의 자기동일시가 우주적 총체를 가리키는 발화를 현대 한국어로도 즉시 이해되게 했습니다.
  alternative_readings:
  - ‘만물’
  - ‘온갖 것’
  - ‘전체’
  rationale: 본 단락은 상징적·신비적 자기언표로, 지나치게 교리화하거나 전통적 기독교 용어로 단순화하기보다 원문의 총체성 언어를 드러내는 것이 우선입니다.
  doctrine_reference: 원문 의미 보존 및 총체성 발화에 대한 source-grounded rendering
- issue: 문장 내 2인칭 명령의 호칭 수준
  chosen_reading: 예수의 직접 명령을 합쇼체 명령형(‘보십시오’, ‘들어 올리십시오’)으로 유지했습니다.
  alternative_readings:
  - 반말형 명령
  - 더 완곡한 권유형
  rationale: 청자에게 직접 말하는 권면/명령의 힘을 살리면서도, 본문 전체의 현대 표준어 문체와 예수 발화의 존대 체계를 맞추기 위한 선택입니다.
  doctrine_reference: Korean style convention for direct speech
