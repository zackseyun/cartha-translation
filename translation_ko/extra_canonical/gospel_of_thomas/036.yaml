base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/036.yaml
  text: Jesus said[a], Do not be anxious from morning until evening, and from evening until morning[c][b], about what you will put on yourselves.
  footnotes:
  - marker: a
    text: The verb ϥⲓⲣⲟⲟⲩϣ can mean “be anxious,” “worry,” or in older idiom “take thought.” “Be anxious” is chosen for clarity and brevity.
    reason: lexical_alternative
  - marker: b
    text: POxy 655 for Logion 36 includes added elements (food, lilies, stature), aligning only in the clause about clothing; this draft follows the Nag Hammadi Coptic text.
    reason: textual_variant
  - marker: c
    text: In the phrase-joined print ⲡⲉ⟨ⲧ⟩ⲉ… shows an editorial supplementation of ⟨ⲧ⟩; Dilley’s normalized reading construes the sequence as headless relative ⲟⲩ ⲡⲉⲧⲉ– with future ⲛⲁ ϯⲛⲧⲟϥ ϩⲓⲱⲧ ⲛⲧⲱⲧⲛ.
    reason: lacuna_or_restoration
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “아침부터 저녁까지, 또 저녁부터 아침까지, 여러분이 몸에 걸칠 것에 대해 염려하지 마십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ는 ‘염려하다’ 외에 ‘걱정하다’, 옛말로는 ‘생각하다’의 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 포어시 655의 병행구는 음식, 백합, 키에 관한 덧붙임이 있으나, 이 판은 나그함마디 콥트 본문을 따릅니다.
    reason: textual_variant
  - marker: c
    text: 편집된 ⟨ⲧ⟩ 보충은 Dilley의 정규화 읽기에 따르면 ‘무엇을 여러분이 …’라는 머리 없는 관계절로 이해됩니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  english_pob_choice: do not be anxious
  chosen_korean: 염려하지 마십시오
  alternatives_korean:
  - 걱정하지 마십시오
  - 마음을 쓰지 마십시오
  lexicon: Crum; Layton
  rationale: 명령형 부정문으로서 ‘염려하다’가 본문의 불안·근심의 의미를 간결하고 자연스럽게 살립니다.
- source_word: ϫⲓⲛϩⲧⲟⲟⲩⲉ ... ϣⲁⲣⲟⲩϩⲉ / ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ... ϣⲁϩⲧⲟⲟⲩⲉ
  english_pob_choice: from morning until evening / from evening until morning
  chosen_korean: 아침부터 저녁까지 / 저녁부터 아침까지
  alternatives_korean:
  - 아침에서 저녁까지
  - 저녁에서 아침까지
  lexicon: Crum
  rationale: 대칭적인 시간 구간을 한국어 관용에 맞게 ‘부터 …까지’로 옮겨, 토마스복음서의 병렬 구조를 보존했습니다.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϯⲛⲧⲟϥ ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  english_pob_choice: what you will put on yourselves
  chosen_korean: 여러분이 몸에 걸칠 것
  alternatives_korean:
  - 여러분이 입을 것
  - 여러분이 스스로 입을 것
  lexicon: Layton; Crum
  rationale: 의복을 ‘입다’로만 풀기보다, 본문이 가리키는 구체적 착용 행위를 드러내면서도 과도한 해석을 피하기 위해 ‘몸에 걸칠 것’으로 옮겼습니다.
