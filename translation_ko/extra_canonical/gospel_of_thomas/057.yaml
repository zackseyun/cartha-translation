base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
  footnotes:
  - marker: a weed
    text: The Coptic uses the singular indefinite 'a weed' (ⲟⲩⲍⲓⲍⲁⲛⲓⲟⲛ) here and the singular definite 'the weed' (ⲡⲍⲓⲍⲁⲛⲓⲟⲛ) in the following clauses, before switching to the plural 'the weeds' (ⲛⲍⲓⲍⲁⲛⲓⲟⲛ) at the end. The Greek loanword ζιζάνιον (darnel) is typically plural in the Synoptic parallels.
    reason: textual_variant
  - marker: We will pull up
    text: The Coptic prefix ⲉⲛⲁ- (we will) is a Lycopolitan dialectal variant of the standard Sahidic ⲧⲛⲛⲁ-.
    reason: dialect_note
  - marker: they will be pulled up and burned
    text: Lit. 'they pull them up and they burn them' (active verbs with an indefinite subject, functioning as a passive).
    reason: register_note
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "아버지의 나라는 좋은 씨를 가진 사람과 같습니다. 그의 원수가 밤에 와서 그 좋은 씨 위에 잡초를 뿌렸습니다. 그 사람은 그들이 잡초를 뽑는 것을 허락하지 않았습니다. 그가 그들에게 말했습니다. '혹시 너희가 "우리가 잡초를 뽑자"고 말하면서 그와 함께 밀까지 뽑을까 염려해서입니다. 추수하는 날에는 잡초가 드러날 것이며, 그들은 그것을 뽑아 불태울 것입니다.'"[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 콥트어 ⲟⲩⲍⲓⲍⲁⲛⲓⲟⲛ은 단수 부정형 ‘잡초 하나’처럼 시작하지만, 뒤에서는 단수 정관형과 복수형으로 이어져 한국어 본문에서는 비유적 집합명사 ‘잡초’로 자연스럽게 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 콥트어의 ⲉⲛⲁ-는 표준 사히드어의 ⲧⲛⲛⲁ-에 해당하는 라이코폴리스 방언형으로, 여기서는 ‘우리가 뽑자’의 미래/의도 표현으로 이해됩니다.
    reason: source_note
  - marker: c
    text: 마지막 절은 직역하면 ‘그들이 그것들을 뽑아내고 그것들을 태운다’에 가깝고, 콥트어는 복수 목적어를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  english_pob_choice: the kingdom of the Father
  chosen_korean: 아버지의 나라
  alternatives_korean:
  - 아버지의 왕국
  - 아버지의 통치
  lexicon: Crum
  rationale: ⲙⲛⲧⲣⲣⲟ는 ‘나라/왕국’의 뜻이지만, 여기서는 소유격 구조를 살려 예수의 비유적 서술에 자연스러운 ‘아버지의 나라’로 옮겼습니다.
- source_word: ⲍⲓⲍⲁⲛⲓⲟⲛ
  english_pob_choice: weed / weeds
  chosen_korean: 잡초
  alternatives_korean:
  - 가라지
  - 독보리
  lexicon: BDAG
  rationale: 원문은 단수·복수 변화를 보이지만, 한국어 본문에서는 비유의 기능을 살려 포괄적인 ‘잡초’로 번역했습니다. 전통적 교회어인 ‘가라지’도 가능하지만, 원문의 일반 명사성에 더 가까운 표현을 택했습니다.
- source_word: ⲕⲱ ⲙⲙⲟⲟⲩ / ⲕⲟⲟⲩ
  english_pob_choice: allow them
  chosen_korean: 그들이 잡초를 뽑는 것을 허락하지 않았습니다
  alternatives_korean:
  - 그들이 뽑게 두지 않았습니다
  - 그들을 막았습니다
  lexicon: Crum
  rationale: ⲕⲱ는 단순히 ‘놓다’가 아니라 문맥상 ‘허락하다/두다’의 뜻이므로, 행위의 허용 여부를 분명히 드러내는 한국어로 옮겼습니다.
- source_word: ⲡⲱϩⲥ
  english_pob_choice: harvest
  chosen_korean: 추수하는 날
  alternatives_korean:
  - 수확하는 날
  - 거두는 날
  lexicon: Crum
  rationale: ⲡⲱϩⲥ는 ‘추수/거둠’의 뜻이므로, 관용적으로도 자연스러운 ‘추수하는 날’로 번역했습니다.
theological_decisions:
- issue: ‘좋은 씨’와 ‘잡초’의 심판적 결말을 한국어에서 어떻게 유지할 것인가
  chosen_reading: 비유의 농경 이미지를 직설적으로 살려, 잡초가 ‘드러날 것’과 ‘뽑아 불태울 것’을 그대로 표현했습니다.
  alternative_readings:
  - 상징적으로 풀어 쓰기
  - 완화하여 ‘제거될 것’으로 번역
  rationale: 토마스 복음서의 간명한 비유 문체를 보존하고, 종말적 분리와 심판의 긴장을 약화시키지 않기 위해 원문의 이미지와 동사를 직접 살렸습니다.
  doctrine_reference: 비유 해석의 문학적-신학적 긴장 보존
- issue: 마지막 절의 대명사 수를 어떻게 처리할 것인가
  chosen_reading: 마지막 문장에서 ‘그들은 그것을 뽑아 불태울 것입니다’로 번역하여, 복수 주어와 복수 목적어의 집합적 의미를 살렸습니다.
  alternative_readings:
  - 그것을 뽑고 불태울 것입니다
  - 그들을 뽑아 불태울 것입니다
  rationale: 콥트어는 끝부분에서 복수 목적어를 사용하므로, 한국어에서도 집합적 복수성을 살려 ‘그들/그것’을 구분해 표현했습니다.
  doctrine_reference: 문법 수·대상 지시의 보존
