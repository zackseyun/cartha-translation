base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
  footnotes:
  - marker: '1'
    text: Literally, ‘the side outside of the cup’ (ⲡⲥⲁ ⲛⲃⲟⲗ ⲛⲡⲡⲟⲧⲏⲣⲓⲟⲛ). A matched phrase occurs for ‘the inside’ (ⲡⲥⲁ ⲛϩⲟⲩⲛ).
    reason: dialect_note
  - marker: '2'
    text: Coptic ⲛⲟⲉⲓ can also mean ‘understand’ or ‘realize’. ‘Know’ is kept here to maintain the straightforward cognitive sense.
    reason: lexical_alternative
  - marker: '3'
    text: Coptic ⲧⲁⲙⲓⲟ in the relative clause means ‘make, fashion’; alternatives include ‘fashioned’ or ‘formed’. It does not repeat the earlier verb for ‘wash/cleanse,’ preserving the contrast between washing and making.
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「왜 잔의 바깥쪽을 씻습니까? 여러분은 안쪽을 만드신 이가 바깥쪽도 만드셨다는 것을 알지 못합니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ϫⲉⲉⲧⲃⲉⲟⲩ
  english_pob_choice: why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 이유로
  lexicon: Crum s.v. ⲉⲧⲃⲉ; Layton, Coptic Grammar
  rationale: ⲉⲧⲃⲉ + 의문사 ⲟⲩ는 “왜”라는 직설적 질문으로 옮기는 것이 가장 자연스럽고, 토마스의 압축된 어조를 살립니다.
- source_word: ⲡⲥⲁ ⲛⲃⲟⲗ / ⲡⲥⲁ ⲛϩⲟⲩⲛ
  english_pob_choice: the outside / the inside
  chosen_korean: 바깥쪽 / 안쪽
  alternatives_korean:
  - 겉면 / 내부
  - 바깥 / 안
  lexicon: Crum s.v. ⲥⲁ; Layton, Coptic Grammar
  rationale: ‘side’에 바깥/안의 방향어가 붙은 표현이므로, 대조가 분명한 ‘바깥쪽’과 ‘안쪽’으로 옮겼습니다.
- source_word: ⲡⲡⲟⲧⲏⲣⲓⲟⲛ
  english_pob_choice: cup
  chosen_korean: 잔
  alternatives_korean:
  - 컵
  - 술잔
  lexicon: Greek loanword ποτήριον; Crum s.v. loanwords
  rationale: 그리스어 차용어는 일상적 그릇을 가리키며, 한국어에서는 문맥상 가장 자연스러운 ‘잔’이 적절합니다.
- source_word: ⲛⲧⲱⲧⲛ ⲣ̄ⲛⲟⲉⲓ
  english_pob_choice: do you not know
  chosen_korean: 여러분은 … 알지 못합니까
  alternatives_korean:
  - 여러분은 … 모르십니까
  - 여러분은 … 깨닫지 못합니까
  lexicon: Crum s.v. ⲛⲟⲉⲓ; Lambdin
  rationale: 기본 인지 의미를 살려 ‘알지 못합니까’로 옮기되, 예수의 직접 질문 형식이 드러나도록 했습니다.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲧⲁⲙⲓⲟ
  english_pob_choice: the one who made
  chosen_korean: 만드신 이
  alternatives_korean:
  - 지으신 이
  - 형성하신 이
  lexicon: Crum s.v. ⲧⲁⲙⲓ; Layton, Coptic Grammar
  rationale: 여기서는 ‘씻다/깨끗하게 하다’가 아니라 ‘만들다/짓다’의 뜻이므로, 짧고 대조가 잘 드러나는 ‘만드신 이’를 택했습니다.
theological_decisions:
- issue: 예수의 직접 화법에서의 호칭과 문체
  chosen_reading: 본문은 서술자 지시를 통해 예수의 말씀을 인용하며, 한국어 본문에서는 평서적 설명 없이 직접 인용으로 처리했습니다.
  alternative_readings:
  - ‘예수께서 이르시되’와 같은 전통적 서술형
  - 간접화법 중심 번역
  rationale: 콥트어의 간결한 도입부를 살리기 위해 군더더기 없는 직접 인용 구조를 유지하는 편이 본문의 날카로운 질문을 더 잘 전달합니다.
  doctrine_reference: 문체/화법 처리 원칙
- issue: ‘안쪽을 만든 이가 바깥쪽도 만든 이’의 반복 구조
  chosen_reading: ‘만드신 이’의 반복을 그대로 살려 안/밖의 대칭을 보존했습니다.
  alternative_readings:
  - ‘지으신 분’으로 단일화
  - ‘형성하신 이’로 통일
  rationale: 본문의 논지는 정결 행위의 외형성과 창조 행위의 총체성을 대비하는 데 있으므로, 동일 동사의 반복을 유지하는 것이 의미를 가장 잘 드러냅니다.
  doctrine_reference: 수사적 대칭 보존
