revisions:
- from: 예수께서 말씀하셨습니다. 「왜 잔의 바깥쪽을 씻습니까? 여러분은, 안쪽을 만든 이가 바깥쪽도 만든 이라는 것을 알지 못합니까?」
  to: 예수께서 말씀하셨습니다. 「왜 잔의 바깥쪽을 씻습니까? 여러분은 안쪽을 만드신 이가 바깥쪽도 만드셨다는 것을 알지 못합니까?」
  rationale: 안쪽과 바깥쪽을 만든 이가 동일하다는 원문의 대칭과 ⲟⲛ의 첨가 의미를 보존하면서, 한국어의 불완전한 ‘만든 이라는’ 구성을 자연스러운 서술절로 바로잡았습니다. 원문이나 영어 감사 기록에 근거한 별도 주석이 한국어 본문에 필수적이지 않으므로 주석은 추가하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:11Z'
review_pass:
  verdict: revise
  source_fidelity: 콥트어의 두 질문, 복수 مخاطبة(‘여러분’), 잔의 안/밖 대조, 그리고 ‘만들다’ 동사의 반복은 대체로 충실히 반영되었습니다. 다만 현행 둘째 질문의 ‘바깥쪽도 만든 이라는 것’은 한국어 문법상 부자연스럽고, 술어 관계가 불명확합니다.
  naturalness: ‘안쪽을 만드신 이가 바깥쪽도 만드셨다는 것’으로 고치면 원문의 동일 주체와 첨가사 ⲟⲛ(‘도’)를 자연스러운 현대 표준 한국어로 전달합니다. 전체 문체는 현대 합쇼체에 맞습니다.
  terminology: ‘잔’, ‘바깥쪽/안쪽’, ‘만드신 이’는 각각 ποτήριον, 공간 대조 표현, ⲧⲁⲙⲓⲟ(만들다)를 적절히 옮깁니다. ‘지으신’처럼 신학적 함의가 더 강할 수 있는 표현을 피한 선택도 적절합니다.
  issues:
  - severity: medium
    issue: 둘째 질문의 ‘안쪽을 만든 이가 바깥쪽도 만든 이라는 것을’은 문법적으로 어색합니다.
    rationale: ‘-이라는 것’ 앞의 명사구가 완결되지 않아, 원문의 ‘안쪽을 만든 이가 또한 바깥쪽을 만들었다’라는 술어 관계가 한국어에서 불분명해집니다. ‘만드셨다는 것’으로 고치면 동일한 주체의 두 행위를 명료하게 보존합니다.
  revised_text: 예수께서 말씀하셨습니다. 「왜 잔의 바깥쪽을 씻습니까? 여러분은 안쪽을 만드신 이가 바깥쪽도 만드셨다는 것을 알지 못합니까?」
