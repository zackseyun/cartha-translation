base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/104.yaml
  text: They said to Jesus[a], “Come, let us pray today, and let us fast.” Jesus said, “For what is the sin that I have committed, or in what have I been overcome? But when the bridegroom goes out from the bridal chamber, then let them fast[f][e][d][c][b], and let them pray.”
  footnotes:
  - marker: a
    text: ⲟⲩ ⲡⲉ + noun here is interrogative (“what is…?”), hence “For what is the sin…?” rather than an assertion.
    reason: dialect_note
  - marker: b
    text: 'ϫⲣⲟ can mean “press, constrain, oppress, overpower.” The impersonal 3pl construction yields a passive sense: “in what have I been compelled/overpowered?”'
    reason: lexical_alternative
  - marker: c
    text: ⲛⲡϩⲟⲟⲩ literally “the day,” idiomatic for “today.”
    reason: dialect_note
  - marker: d
    text: ⲙⲁⲣⲟⲩ- is the 3rd plural jussive (“let them…”); Dilley’s normalized ⲙⲁⲣⲉⲛⲧⲟⲟⲩ- reflects subject morphology. The sense is cohortative, not simple future.
    reason: dialect_note
  - marker: e
    text: Both ⲡⲛⲩⲙⲫⲓⲟⲥ (bridegroom) and ⲡⲛⲩⲙⲫⲱⲛ (bridal chamber) are Greek loans, preserving wedding-imagery familiar in early Christian sayings.
    reason: cultural_note
  - marker: f
    text: Or 'or in what have I been compelled?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 예수께 말했습니다. “오십시오. 오늘 기도하고 금식합시다.” 예수께서 말씀하셨습니다. “내가 지은 죄가 무엇입니까? 또는 내가 무엇에 패배했습니까? 그러나 신랑이 신방에서 나가면, 그때 그들이 금식하고 기도하게 하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ϫⲣⲟ는 여기처럼 보충어 없이 쓰일 때 ‘정복하다, 이기다, 패배시키다’의 뜻이 자연스러워, “무엇에 패배했습니까?”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲡⲛⲩⲙⲫⲱⲛ은 그리스어 νυμφών에서 온 말로, 혼인 공간을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲙⲟⲩ
  english_pob_choice: come
  chosen_korean: 오십시오
  alternatives_korean:
  - 오세요
  - 와 보십시오
  lexicon: Crum; Layton
  rationale: 초청의 명령형으로서 자연스러운 한국어 공손 표현을 택해, 짧고 직접적인 요청의 톤을 살렸습니다.
- source_word: ⲛⲡϩⲟⲟⲩ
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 이날
  - 이 하루
  lexicon: Layton (syntax)
  rationale: 사히딕의 관용적 시간 표현을 현대 한국어의 평이한 ‘오늘’로 옮겼습니다.
- source_word: ⲛⲏⲥⲧⲉⲩⲉ
  english_pob_choice: fast
  chosen_korean: 금식하다
  alternatives_korean:
  - 단식하다
  - 음식을 끊다
  lexicon: Crum (loan), Lambdin
  rationale: 그리스어 차용어의 직접적 대응인 ‘금식하다’가 한국어 교회 독자에게도 가장 투명합니다.
- source_word: ⲡⲛⲟⲃⲉ
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 허물
  - 과오
  lexicon: Crum
  rationale: 도덕적 잘못을 가리키는 핵심어이므로, 문맥의 수사적 질문에 맞는 ‘죄’로 옮겼습니다.
- source_word: ϫⲣⲟ
  english_pob_choice: overcome
  chosen_korean: 패배당하다
  alternatives_korean:
  - 정복당하다
  - 압도당하다
  - 이기지 못하다
  lexicon: Crum 785a
  rationale: 개정된 POB 판단처럼, 보충어 없이 쓰인 ϫⲣⲟ는 ‘강요하다’보다 ‘이기다/정복하다, 패배시키다’의 의미가 자연스러워 수동적 결과를 드러내는 표현을 택했습니다.
- source_word: ⲡⲛⲩⲙⲫⲓⲟⲥ
  english_pob_choice: bridegroom
  chosen_korean: 신랑
  alternatives_korean:
  - 혼인하는 남자
  - 신방의 주인
  lexicon: Crum (Greek loan)
  rationale: 혼인 비유의 표준 대응어인 ‘신랑’이 한국어에서 가장 자연스럽고 이미지도 보존합니다.
- source_word: ⲡⲛⲩⲙⲫⲱⲛ
  english_pob_choice: bridal chamber
  chosen_korean: 신방
  alternatives_korean:
  - 혼인방
  - 결혼방
  lexicon: Crum (Greek loan)
  rationale: 그리스어 νυμφών의 혼인 공간 이미지를 살리면서도 한국어에서 직관적인 전통적 표현인 ‘신방’을 사용했습니다.
theological_decisions:
- issue: 예수의 응답에서 금식과 기도의 때를 신랑-신방 이미지로 제한하는 구조
  chosen_reading: 금식과 기도는 신랑이 ‘신방에서 나가’는 때에 해당하는 것으로 제시했습니다.
  alternative_readings:
  - 금식과 기도를 일반적 권면으로 완화하는 번역
  - 신랑이 ‘떠날 때’로만 평이하게 처리하는 번역
  rationale: 본문의 결론은 단순한 윤리 명령이 아니라 혼인-임재 이미지에 근거한 시기적 대비를 이루므로, 구체적 공간 이미지를 유지했습니다.
  doctrine_reference: 문학적-상징적 해석 원리; 복음서의 혼인 비유 전통
- issue: ϫⲣⲟ의 의미를 ‘강요’보다 ‘패배/압도’로 반영
  chosen_reading: “내가 무엇에서 패배당했기에”라고 옮겨, 죄에 의해 당한 패배감을 드러냈습니다.
  alternative_readings:
  - ‘무엇에 의해 강요되었기에’
  - ‘무엇에서 억눌렸기에’
  rationale: 새로 제시된 사본·어휘 검토에 따라, 이 동사는 보충어 없이 쓰일 때 ‘정복되다/패배하다’의 힘을 지니므로, 죄와의 관계에서의 도덕적 패배를 살렸습니다.
  doctrine_reference: 어휘 주해 원칙; Crum 785a
