revisions:
- from: 그들이 예수께 말했습니다. “오십시오. 오늘 기도하고 금식합시다.” 예수께서 말씀하셨습니다. “내가 어떤 죄를 지었기에, 또는 내가 무엇에서 패배당했기에 그렇습니까? 그러나 신랑이 신방에서 나가면, 그때 그들은 금식하고 기도해야 합니다.”[a][b]
  to: 그들이 예수께 말했습니다. “오십시오. 오늘 기도하고 금식합시다.” 예수께서 말씀하셨습니다. “내가 지은 죄가 무엇입니까? 또는 내가 무엇에 패배했습니까? 그러나 신랑이 신방에서 나가면, 그때 그들이 금식하고 기도하게 하십시오.”[a][b]
  rationale: 원문의 병렬 수사 의문문을 인과적 해석 없이 보존하고, 마지막 3인칭 복수 접속법을 한국어의 ‘-게 하십시오’로 옮겼습니다. 혼인 이미지와 기존의 어휘 판단은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:15Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘(죄, 패배하다, 신랑, 신방)는 대체로 충실합니다. 그러나 “-기에 … 그렇습니까?”는 원문의 두 수사 의문문에 없는 인과·귀결을 보태며, 마지막 3인칭 복수 접속법을 의무 진술로 약화합니다.
  naturalness: 현대 표준어 합쇼체는 대체로 자연스럽습니다. 다만 수사 의문문을 각각 독립시켜 “내가 지은 죄가 무엇입니까? … 무엇에 패배했습니까?”로 하면 더 자연스럽고 원문 구조에도 맞습니다. 마지막은 “금식하고 기도하게 하십시오”가 접속법의 권유를 더 잘 살립니다.
  terminology: ‘금식’, ‘죄’, ‘신랑’, ‘신방’은 적절합니다. ϫⲣⲟ는 이 문맥에서 ‘패배하다/정복당하다’ 계열이 타당하며, ‘패배당하다’보다 능동형 ‘패배했습니까’가 한국어에서 더 자연스럽습니다.
  issues:
  - severity: medium
    issue: “내가 어떤 죄를 지었기에, 또는 내가 무엇에서 패배당했기에 그렇습니까?”가 원문의 의문 구조에 인과적 귀결을 추가합니다.
    rationale: 본문은 ‘내가 지은 죄가 무엇인가?’와 ‘내가 무엇에 패배했는가?’를 병렬로 묻습니다. ‘-기에’와 ‘그렇습니까’는 ‘왜 지금 기도·금식해야 하는가’라는 해석적 연결을 명시하여 원문보다 뜻을 좁힙니다.
  - severity: medium
    issue: 마지막 “금식하고 기도해야 합니다”가 3인칭 복수 접속법을 의무 진술로 바꿉니다.
    rationale: ⲙⲁⲣⲟⲩ…는 ‘그들이 …하게 하라/하도록 하라’라는 권유·허용의 접속법입니다. 한국어에서도 해당 양태를 보존하는 편이 안전합니다.
