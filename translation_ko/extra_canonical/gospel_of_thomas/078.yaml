revisions:
- from: 예수께서 말씀하셨습니다. "무엇을 보려고 너희는 광야로 나갔습니까? 바람에 흔들리는 갈대입니까? 그리고 부드러운 옷을 입고 옷을 걸친 사람입니까? 보십시오. 부드러운 옷을 입은 이들은 너희 왕과 너희 귀족의 집에 있으며, 그들은 진리를 알 수 없습니다."[a][b][c][d][e][f]
  to: 예수께서 말씀하셨습니다. “무엇을 보려고 너희는 광야[a]로 나갔습니까? 바람에 흔들리는 갈대입니까? 또 부드러운 옷[b]을 걸친 사람입니까? 부드러운 옷을 입은 이들은 너희 왕과 너희 고위 귀족[c][d][e]의 집에 있으며, 그들은 진리[f]를 알 수 없습니다.”
  rationale: 중복된 의복 묘사와 원문에 근거하지 않는 ‘보십시오’를 제거하여 본문을 더 정확하고 자연스럽게 만들었습니다. ‘고위 귀족’으로 κοινων적 지위를 보다 정확히 반영했고, 손상된 집 구절의 복원 및 단수 표현을 각주에서 명시했습니다. 각주 표지는 해당 어휘 또는 손상·복원 구절에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:20Z'
review_pass:
  verdict: revise
  source_fidelity: 첫째 질문의 ‘무엇을 보려고’와 ‘광야’, ‘바람에 흔들리는 갈대’, 왕·귀족의 단수 소유 표현, 그리고 ‘진리를 알 수 없습니다’는 대체로 사히드어 콥트어 본문에 충실합니다. 그러나 ‘부드러운 옷을 입고 옷을 걸친 사람’은 한 사람이 옷을 입었다는 내용을 중복하여 표현합니다. 본문의 ‘부드러운 옷을 가진/걸친 사람’으로 간결하게 옮기는 편이 안전합니다. 또한 본문에는 별도의 ‘보십시오’에 해당하는 말이 확인되지 않으므로 넣지 않는 것이 좋습니다. 집/왕/귀족 구절은 손상된 사본 부분에 대한 정본의 복원에 근거하므로 그 점을 각주에 밝혀야 합니다.
  naturalness: 합쇼체는 일관되어 있으나 ‘부드러운 옷을 입고 옷을 걸친’은 현대 한국어에서 부자연스럽고 중복적입니다. ‘부드러운 옷을 걸친 사람’ 및 ‘부드러운 옷을 입은 이들은’이 자연스럽습니다. 두 번째 수사 질문은 ‘또’로 연결하면 원문의 접속을 자연스럽게 보존할 수 있습니다.
  terminology: ‘광야’, ‘갈대’, ‘진리’는 적절합니다. μεγιστανός는 단순한 세습 신분만을 뜻하지 않을 수 있으므로 ‘귀족’보다 ‘고위 귀족’이 영어 magnate 및 그리스어 차용어의 사회적 의미를 더 잘 반영합니다. ‘너희 왕과 너희 고위 귀족’이라는 단수 표현은 유지해야 합니다.
  issues:
  - severity: medium
    issue: ‘부드러운 옷을 입고 옷을 걸친 사람’이라는 중복 표현
    rationale: ⲟⲩⲣⲱⲙⲉ ⲉⲟⲩⲛϣⲧⲏⲛ ⲉⲣⲉⲛⲧⲟⲟⲩϭⲛⲟⲛ ϩⲓⲛⲧⲟϥ은 부드러운 옷을 지닌/걸친 사람을 묘사합니다. ‘입고’와 ‘걸친’을 함께 쓰면 같은 내용을 불필요하게 두 번 말하게 됩니다.
  - severity: medium
    issue: ‘보십시오’의 첨가
    rationale: 제시된 콥트어 본문은 부드러운 옷을 입은 이들이 왕과 고위 인물의 집에 있다는 진술로 이어지며, 독립된 ‘보라/보십시오’ 명령을 뒷받침하지 않습니다.
