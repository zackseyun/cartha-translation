base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/078.yaml
  text: 'Jesus said[a], "What did you go out into the wilderness to see? A reed shaken by the wind? And a person in soft clothing, with garments put on him? Look: those in soft clothing are in the house of your king and your magnate[f][e][d][c][b], and they are not able to know the truth."'
  footnotes:
  - marker: a
    text: ⲡⲥⲱϣⲉ is the “desert/wilderness.” “Wilderness” is chosen; “desert” is possible.
    reason: lexical_alternative
  - marker: b
    text: ⲛϣⲧⲏⲛ describes the softness of clothing; “soft (clothing)” could also be rendered “fine” or “delicate.”
    reason: lexical_alternative
  - marker: c
    text: '“In the house of your king and your magnate”: the manuscript at NHAM02.46 lb 32 is damaged here; Dilley’s normalized text reads ⲛ ⲡⲏⲉ ⲛⲡⲉⲧⲛⲣⲣⲟ ⲙⲛ ⲡⲉⲧⲛⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ. The translation follows this, keeping the singulars.'
    reason: lacuna_or_restoration
  - marker: d
    text: “Magnate” renders Greek loanword ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ (μεγιστανός), also translatable “grandee” or “great man.”
    reason: lexical_alternative
  - marker: e
    text: The Coptic uses singular “your king … your magnate,” which is preserved here; some readers may expect plurals by analogy with canonical phrasing.
    reason: cultural_note
  - marker: f
    text: “Know the truth” could be rendered “recognize the truth”; the verb ϣⲥⲟⲟⲩⲛ has a broad semantic range (“know, understand, perceive”).
    reason: lexical_alternative
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. "무엇을 보려고 너희는 광야로 나갔습니까? 바람에 흔들리는 갈대입니까? 그리고 부드러운 옷을 입고 옷을 걸친 사람입니까? 보십시오. 부드러운 옷을 입은 이들은 너희 왕과 너희 귀족의 집에 있으며, 그들은 진리를 알 수 없습니다."[a][b][c][d][e][f]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “광야”는 Coptic ⲡⲥⲱϣⲉ의 기본 의미인 “desert/wilderness” 가운데 성서적 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ⲛϣⲧⲏⲛ은 옷의 ‘부드러움’을 가리키며, “고운”이나 “섬세한”으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이곳의 Coptic은 단수형 “너희 왕 … 너희 귀족”을 유지합니다.
    reason: source_note
  - marker: d
    text: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ(μεγιστανός)는 고위 귀족/유력자를 가리키는 그리스어 차용어입니다.
    reason: lexical_alternative
  - marker: e
    text: 일부 독자는 관용적 성서 표현에 따라 복수형을 예상할 수 있지만, 본문은 단수를 보존합니다.
    reason: cultural_note
  - marker: f
    text: ϣⲥⲟⲟⲩⲛ은 “알다” 외에도 “이해하다, 인식하다”의 범위를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲥⲱϣⲉ
  english_pob_choice: wilderness
  chosen_korean: 광야
  alternatives_korean:
  - 사막
  - 들판
  lexicon: Crum, s.v. ⲥⲱϣⲉ
  rationale: English POB의 “wilderness”는 성서적 울림을 살리기 위한 선택이므로, 한국어에서도 자연스러운 성서어휘인 “광야”로 옮겼습니다.
- source_word: ⲟⲩⲕⲁϣ
  english_pob_choice: a reed
  chosen_korean: 갈대
  alternatives_korean:
  - 대
  - 줄기
  lexicon: Crum, s.v. ⲕⲁϣ
  rationale: 문맥상 흔들리는 식물의 전형적 이미지이므로 “갈대”가 가장 자연스럽고 관용적입니다.
- source_word: ⲛϣⲧⲏⲛ
  english_pob_choice: soft clothing
  chosen_korean: 부드러운 옷
  alternatives_korean:
  - 고운 옷
  - 섬세한 옷
  - 화려한 옷
  lexicon: Crum, s.v. ϣⲧⲏⲛ
  rationale: POB가 옷의 ‘부드러움’을 직접 드러내므로, 완곡하게 ‘고운’으로 바꾸지 않고 “부드러운 옷”을 유지했습니다.
- source_word: ⲡⲉⲧⲛⲣⲣⲟ / ⲡⲉⲧⲛⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  english_pob_choice: your king and your magnate
  chosen_korean: 너희 왕과 너희 귀족
  alternatives_korean:
  - 너희 왕과 너희 대귀족
  - 너희 왕과 너희 유력자
  - 너희 왕과 너희 대인
  lexicon: Crum, s.v. ⲣⲣⲟ; Crum, s.v. ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  rationale: Coptic의 왕과 고위 인물을 가리키는 병렬 표현을 살리되, 한국어에서는 직역투 ‘맹귀스타노스’를 쓰지 않고 의미가 분명한 “귀족”으로 옮겼습니다.
- source_word: ϣⲥⲟⲟⲩⲛ
  english_pob_choice: know the truth
  chosen_korean: 진리를 알 수 없습니다
  alternatives_korean:
  - 진리를 알지 못합니다
  - 진리를 깨달을 수 없습니다
  - 진리를 알아볼 수 없습니다
  lexicon: Crum, s.v. ϣⲥⲟⲟⲩⲛ
  rationale: 여기서는 단순한 인지 능력 부재를 말하므로, 과도하게 해석적인 “깨닫다/알아보다”보다 “알 수 없다”가 가장 직접적입니다.
theological_decisions:
- issue: “your king … your magnate”의 수신자 지칭 방식
  chosen_reading: 문맥상 청중을 향한 수사적 비판으로 읽고, 소유격 ‘너희’와 단수 명사 둘 다 유지했습니다.
  alternative_readings:
  - ‘너희 왕들과 너희 귀족들’처럼 복수화
  - 일반적 사회 비판으로 완화
  rationale: Coptic/POB가 보존한 단수 표현과 소유격을 따라, 관습적 복수화나 평탄화를 피했습니다.
  doctrine_reference: 본문 충실성 및 수사적 보존
