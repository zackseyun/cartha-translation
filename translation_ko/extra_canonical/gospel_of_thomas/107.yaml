base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/107.yaml
  text: Jesus said[a], The kingship is like a shepherd who had a hundred sheep. One of them—the great one—went astray. He left the ninety‑nine and searched for the one until he found it. After he had toiled, he said to the sheep[i][h][g][f][e][d][c][b], I love you more than the ninety‑nine.
  footnotes:
  - marker: a
    text: ‘Kingship’ renders ⲡⲙⲛⲧⲣⲣⲟ, an abstract for reign/rule; ‘kingdom’ is a common but potentially more spatial translation.
    reason: lexical_alternative
  - marker: b
    text: The text reads literally ‘the great one’ (ⲡⲛⲟϭ), which can mean ‘largest.’
    reason: lexical_alternative
  - marker: c
    text: ⲡⲥⲧⲉⲯⲓⲧ is the manuscript’s form for ‘the ninety‑nine,’ likely influenced by Greek numeral forms.
    reason: dialect_note
  - marker: d
    text: ⲟⲩⲟϣⲕ can mean ‘love’ or ‘prefer’; either ‘I love you’ or ‘I prefer you’ is possible.
    reason: lexical_alternative
  - marker: e
    text: ‘To the sheep’ (ⲡⲉⲥⲟⲟⲩ) has a minor restored letter in the manuscript (NHAM02.50 lb 27).
    reason: lacuna_or_restoration
  - marker: f
    text: Although the scenario implies a shepherd, the Coptic says ‘a man who had a hundred sheep’ without naming him ‘shepherd.’
    reason: cultural_note
  - marker: g
    text: ⲥⲱⲣⲙ is ‘go astray/wander’; the pastoral setting governs the nuance here.
    reason: cultural_note
  - marker: h
    text: The clause ‘after he had toiled’ reflects Coptic ⲛⲧⲁⲣⲉ‑ plus ϩⲓⲥⲉ, implying effort before the saying is spoken.
    reason: cultural_note
  - marker: i
    text: Or 'a man who had'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다[a]. 「하나님의 나라는 양 백 마리를 가진[b] 목자와 같습니다. 그중 하나—가장 큰 것[c]—가 길을 벗어났습니다. 그는 아흔아홉 마리를 두고 그 하나를 찾아다녔으며, 마침내 그것을 찾아낸 뒤에는 수고한 후 그 양에게 말했습니다[d][e][f][g][h], ‘나는 너를 아흔아홉 마리보다 더 사랑합니다[i].’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕권/통치’에 가까운 추상명사이지만, 한국어에서는 비유의 핵심을 살려 ‘하나님의 나라’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘목자’에 해당하는 표현으로, 단순한 소유자가 아니라 양 떼를 치는 인물을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 ‘가장 큰 것’(the great one)으로, 크기와 중요성을 함께 암시합니다.
    reason: lexical_alternative
  - marker: d
    text: ⲟⲩⲟϣⲕ는 ‘사랑하다’ 또는 ‘선호하다/더 좋아하다’의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 마지막 대상은 ‘양’으로 분명하지만, 본문은 이를 반복해 명시하지 않고 대명/지시로 이어집니다.
    reason: source_note
  - marker: f
    text: 문맥상 목자의 수고가 먼저 제시된 뒤 말이 이어지므로 ‘수고한 후’로 순서를 살렸습니다.
    reason: source_note
  - marker: g
    text: 원문은 길 잃은 한 마리를 찾는 목회적 장면입니다.
    reason: cultural_note
  - marker: h
    text: ‘찾아다녔으며’는 탐색의 지속성을 드러내는 번역입니다.
    reason: lexical_alternative
  - marker: i
    text: 문맥상 애정 표현이지만, 원문 동사의 폭을 반영해 ‘사랑합니다’로 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  english_pob_choice: kingship
  chosen_korean: 하나님의 나라
  alternatives_korean:
  - 왕권
  - 통치
  - 나라
  lexicon: Crum, s.v. ⲣⲣⲟ; Layton, Grammar §72
  rationale: Coptic abstract noun은 왕의 지위/통치를 가리키지만, 한국어에서는 이 비유문맥에서 ‘하나님의 나라’가 가장 자연스럽고 의미를 보존합니다.
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛ̄ϣⲱⲥ
  english_pob_choice: a shepherd who had
  chosen_korean: 양 백 마리를 가진 목자
  alternatives_korean:
  - 양 백 마리를 둔 사람
  - 백 마리의 양을 가진 사람
  lexicon: Crum, s.v. ⲣⲱⲙⲉ, ϣⲱⲥ
  rationale: 아라비아적/목회적 은유를 살리기 위해 단순한 ‘사람’이 아니라, 원문의 ‘shepherd’에 해당하는 목자로 옮겼습니다.
- source_word: ⲡⲛⲟϭ
  english_pob_choice: the great one
  chosen_korean: 가장 큰 것
  alternatives_korean:
  - 큰 것
  - 가장 큰 양
  lexicon: Crum, s.v. ⲛⲟϭ
  rationale: 원문은 명확히 ‘the great one’으로, 크기/중요성을 강조합니다. 한국어에서는 양을 가리키는 지시를 문맥상 유지하되 과도한 해석은 피했습니다.
- source_word: ⲥⲱⲣⲙ
  english_pob_choice: went astray
  chosen_korean: 길을 벗어났습니다
  alternatives_korean:
  - 헤맸습니다
  - 잘못된 길로 갔습니다
  lexicon: Crum, s.v. ⲥⲱⲣⲙ
  rationale: 목자-양의 배경에서 ‘길을 벗어나다’가 가장 자연스럽고, 도덕적 ‘오류’로만 좁히지 않습니다.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ ⲡⲓⲟⲩⲁ
  english_pob_choice: searched for the one
  chosen_korean: 그 하나를 찾아다녔으며
  alternatives_korean:
  - 그 하나를 찾았으며
  - 그 하나를 찾으러 다녔으며
  lexicon: Crum, s.v. ϣⲓⲛⲉ; Layton, Grammar §138
  rationale: 동사의 지속적 탐색성을 살려 ‘찾아다녔으며’로 옮겼습니다.
- source_word: ⲟⲩⲟϣⲕ
  english_pob_choice: I love you / I prefer you
  chosen_korean: 나는 너를 … 더 사랑합니다
  alternatives_korean:
  - 나는 너를 … 더 좋아합니다
  - 나는 너를 … 더 원합니다
  lexicon: Crum, s.v. ⲟⲩⲟϣⲕ
  rationale: 원문은 ‘love’와 ‘prefer’ 둘 다 가능하지만, 문맥상 양을 향한 애정 표현이어서 ‘사랑합니다’가 가장 적절합니다.
theological_decisions:
- issue: 하나님의 나라 표현의 범위
  chosen_reading: 지배/통치의 추상성보다 ‘하나님의 나라’로 번역하되, 왕권적 함의를 잃지 않도록 비유 전체를 왕의 통치 맥락으로 이해하게 합니다.
  alternative_readings:
  - 하나님의 왕권
  - 하나님의 통치
  - 하나님 나라
  rationale: ⲡⲙⲛⲧⲣⲣⲟ는 공간적 왕국보다 통치/왕권의 추상명사에 가깝지만, 한국어 독자가 즉시 이해할 수 있는 성경적 관용은 ‘하나님의 나라’입니다.
  doctrine_reference: 왕권/통치 신학, 하나님 나라 비유 해석
