revisions:
- from: 예수께서 말씀하셨습니다[a]. 「하나님의 나라는 양 백 마리를 가진[b] 목자와 같습니다. 그중 하나—가장 큰 것[c]—가 길을 벗어났습니다. 그는 아흔아홉 마리를 두고 그 하나를 찾아다녔으며, 마침내 그것을 찾아낸 뒤에는 수고한 후 그 양에게 말했습니다[d][e][f][g][h], ‘나는 너를 아흔아홉 마리보다 더 사랑합니다[i].’」
  to: 예수께서 말씀하셨습니다. 「왕권[a]은 양 백 마리를 가진 목자와 같습니다. 그중 큰 양 한 마리가 길을 잃었습니다[b]. 그는 아흔아홉 마리를 남겨 두고 그 한 마리를 찾았습니다. 그를 찾을 때까지 수고한 뒤, 그 양에게[c] 말했습니다. ‘나는 너를 아흔아홉 마리보다 더 사랑한다[d].’」
  rationale: 원문에 없는 ‘하나님의’를 제거하여 출처 충실성을 회복했습니다. 목자와 양의 비유라는 원문의 명시적 표현은 유지하고, ‘큰 양’ 및 사랑/선호의 어휘적 여지는 각주에서 보존했습니다. 문장 순서와 각주 표지를 정리하여 수고, 발견, 발화의 관계 및 사본 복원 사항을 정확히 드러냈습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:18Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 ⲡⲙⲛⲧⲣⲣⲟ는 ‘왕권/통치/나라’를 뜻하는 추상명사이며 ‘하나님의’라는 한정어는 없습니다. 따라서 ‘하나님의 나라’는 원문에 없는 신적 한정을 더합니다. 또한 ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ는 ‘목자’이고, 소유는 뒤의 ⲉⲣⲉⲟⲩⲛⲧⲁ…가 표현합니다. ‘목자’라는 본문 번역은 적절합니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽지만, ‘가장 큰 것’은 양을 가리키는 한국어 문맥에서 다소 부자연스럽습니다. ‘그중 큰 양 한 마리’가 자연스럽고 원문의 ‘the great one’이 가진 크기/중요성의 모호성도 유지합니다. 사건 순서는 ‘찾은 뒤에는 수고한 후’보다 ‘찾을 때까지 수고한 뒤’가 더 명료합니다.
  terminology: ‘하나님의 나라’는 익숙한 성경 관용구이지만 이 본문에는 하나님이라는 명칭이 없고, 원문의 추상성도 약화합니다. 여기서는 ‘왕권’으로 옮기고 각주에서 ‘통치’ 및 관용적 ‘나라’를 대안으로 밝혀야 합니다. ‘아흔아홉’은 원문의 특수한 수사 형태를 반영하므로 각주를 유지합니다.
  issues:
  - severity: high
    issue: ‘하나님의 나라’가 원문에 없는 ‘하나님의’를 삽입함
    rationale: ⲡⲙⲛⲧⲣⲣⲟ에는 신명이나 소유·속격 표지가 없습니다. 원문은 ‘왕권/통치’의 비유라고 할 뿐, 이를 ‘하나님의’ 것으로 명시하지 않습니다.
  - severity: medium
    issue: ‘가장 큰 것’의 한국어 지시 대상이 부자연스럽고 ‘가장’은 원문 이상의 최상급으로 읽힐 수 있음
    rationale: ⲡⲛⲟϭ는 문맥상 길 잃은 양을 가리키는 ‘큰 양’이며, 비교급·최상급을 명시하지 않습니다. ‘큰 양 한 마리’가 더 자연스럽고 안전합니다.
  - severity: medium
