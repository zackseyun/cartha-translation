base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/020.yaml
  text: The disciples said to Jesus[a], “Tell us what the kingdom of the heavens is like.” He said to them, “It is like a mustard seed—the smallest of all seeds; but when it falls upon worked soil[f][e][d][c][b], it produces a great branch and becomes a shelter for the birds of the sky.”
  footnotes:
  - marker: a
    text: Literally “Tell us like-what the kingdom of the heavens [is].” ⲉⲛⲓⲙ is an interrogative “how/like what.”
    reason: dialect_note
  - marker: b
    text: Literally “a grain of mustard.” The Coptic noun ⲃⲗⲃⲓⲗⲉ is a kernel or grain.
    reason: lexical_alternative
  - marker: c
    text: “Worked soil” renders the relative clause “which they work (ⲣϩⲱⲃ) at it,” an agricultural idiom for tilled ground.
    reason: cultural_note
  - marker: d
    text: ⲥⲕⲉⲡⲏ can also mean “shade” or “covering.”
    reason: lexical_alternative
  - marker: e
    text: Unlike the Synoptic phrasing “kingdom of God,” the Coptic here reads “kingdom of the heavens” (ⲡⲡⲉ).
    reason: cross_reference
  - marker: f
    text: Or 'it produces a great plant'.
    reason: previous_rendering
translation:
  language: ko
  text: 제자들이 예수께 말했습니다. 「우리에게 하늘 나라가 무엇과 같은지 말씀해 주십시오.」 예수께서 그들에게 말씀하셨습니다. 「그것은 겨자씨와 같습니다. 모든 씨 가운데 가장 작은 것이지만, 사람들이 가꾸는 땅에 떨어지면 큰 가지를 내고, 하늘의 새들이 깃들 수 있는 쉼터가 됩니다.」[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “하늘 나라가 어떤 것과 같은지”입니다. ⲉⲛⲓⲙ은 ‘어떻게/무엇과 같이’라는 뜻의 의문 표현입니다.
    reason: source_note
  - marker: b
    text: ⲧⲁⲣ는 ‘식물’이 아니라 ‘가지, 나뭇가지’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘사람들이 가꾸는 땅’은 ‘그들이 그것을 일구는 땅’이라는 농경적 관용을 풀어 옮긴 것입니다.
    reason: cultural_note
  - marker: d
    text: ⲥⲕⲉⲡⲏ는 ‘쉼터’ 외에도 ‘그늘, 덮개’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 토마스 복음의 이 본문은 공관복음의 ‘하나님의 나라’ 대신 ‘하늘 나라’ 표현을 사용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 통치
  lexicon: Crum; Layton
  rationale: Thomas의 왕권/통치 영역을 가리키는 표현이지만, 한국어에서는 ‘나라’가 문맥상 자연스럽고 비유의 공적 범위를 잘 살립니다.
- source_word: ⲛⲡⲡⲉ
  english_pob_choice: of the heavens / of the sky
  chosen_korean: 하늘 나라 / 하늘의 새들
  alternatives_korean:
  - 하늘들
  - 하늘
  - 하늘의
  lexicon: Crum
  rationale: 같은 어근이 앞에서는 관용적으로 ‘하늘 나라’에, 뒤에서는 새들의 거처를 묘사하는 물리적 ‘하늘’에 맞게 달리 옮겨 반복을 줄였습니다.
- source_word: ⲁⲩⲃⲗⲃⲓⲗⲉ ⲛϣⲗⲧⲁⲙ
  english_pob_choice: a mustard seed
  chosen_korean: 겨자씨
  alternatives_korean:
  - 겨자 한 알
  - 겨자씨앗
  lexicon: Crum (blbile ‘grain’; shltam ‘mustard’)
  rationale: ‘grain of mustard’라는 직역 가능성이 있으나, 한국어 관용과 소형 비유를 살리기 위해 ‘겨자씨’로 옮겼습니다.
- source_word: ⲛⲧⲁⲣ
  english_pob_choice: a great branch
  chosen_korean: 큰 가지
  alternatives_korean:
  - 큰 나뭇가지
  - 큰 덩굴
  - 큰 식물
  lexicon: Crum 422a
  rationale: 최근 교정처럼 ⲧⲁⲣ는 ‘branch/twig’이므로 ‘가지’가 원문의 구체적 이미지를 가장 정확하게 반영합니다.
- source_word: ⲥⲕⲉⲡⲏ
  english_pob_choice: shelter
  chosen_korean: 쉼터
  alternatives_korean:
  - 보호막
  - 덮개
  - 그늘
  lexicon: Crum; Greek σκέπη
  rationale: 기능상 ‘보호/덮음’이지만, 새들이 깃들 수 있는 장소라는 맥락을 살려 ‘쉼터’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하늘 나라/하나님의 나라 용어 선택
  chosen_reading: 이 구절은 ⲡⲡⲉ를 따라 ‘하늘 나라’로 옮겼습니다.
  alternative_readings:
  - 하나님의 나라
  - 하늘의 왕국
  rationale: POB 주석이 지적하듯 토마스 복음은 이곳에서 ‘하늘들/하늘’ 표현을 사용하므로, 공관복음의 평행구와 구분되는 본문 특성을 보존했습니다.
  doctrine_reference: 본문 비평 및 상호본문성 주석
