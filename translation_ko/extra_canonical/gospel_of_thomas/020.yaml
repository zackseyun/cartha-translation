revisions:
- from: 제자들이 예수께 말했습니다. 「우리에게 하늘 나라가 무엇과 같은지 말씀해 주십시오.」 예수께서 그들에게 말씀하셨습니다. 「그것은 겨자씨와 같습니다. 모든 씨 가운데 가장 작은 것이지만, 사람들이 가꾸는 땅에 떨어지면 큰 가지를 내고, 하늘의 새들이 깃들 수 있는 쉼터가 됩니다.」[a][b][c][d][e]
  to: 한 제자가 예수께 말씀드렸습니다.[a] “우리에게 하늘 나라[e]가 무엇과 같은지[a] 말씀해 주십시오.” 예수께서 그들에게 말씀하셨습니다. “그것은 겨자씨와 같습니다. 모든 씨 가운데 가장 작은 것이지만, 사람들이 가꾸는 땅[c]에 떨어지면 큰 가지[b]를 내고, 하늘의 새들이 깃들 수 있는 쉼터[d]가 됩니다.”
  rationale: 원문에 있는 첫 화자의 단수 명사와 응답 수령자의 복수 대명사를 보존하도록 첫 문장을 수정했습니다. 본문을 조화시키지 않고 그 불일치를 주석으로 명시했습니다. 또한 의미 변경 없이 주석 표지를 각각의 관련 어구로 옮기고, ⲧⲁⲣ의 뜻을 중립적으로 ‘가지, 나뭇가지’로 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:23Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 화자의 명사는 정규화 본문 ⲡⲙⲁⲑⲏⲧⲏⲥ에서 단수입니다. 반면 예수의 응답 수령자는 ⲛⲁⲩ로 복수입니다. 초안은 이를 모두 복수 ‘제자들/그들에게’로 평준화하여 단수라는 본문상의 특징을 잃었습니다. 나머지 비유의 핵심 요소—겨자씨, 모든 씨 중 가장 작음, 경작된 땅, 큰 가지, 하늘의 새들의 쉼터—는 충실합니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지합니다. ‘한 제자’와 뒤이은 ‘그들에게’의 수 불일치는 한국어 문체상 다소 눈에 띄지만, 원문의 단수/복수 불일치를 보존하기 위해 필요한 표현이며 주석으로 설명합니다. 각 주석 표지도 해당 어구 뒤에 배치했습니다.
  terminology: ‘하늘 나라’는 ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲡⲉ를 자연스럽게 옮기며, 뒤의 ⲡⲡⲉ는 문맥에 따라 ‘하늘의 새들’로 구별해 옮겼습니다. ⲧⲁⲣ는 ‘가지’로 유지해야 하며 ‘식물’로 옮기지 않습니다. ⲥⲕⲉⲡⲏ의 ‘쉼터’도 적절합니다.
  issues:
  - severity: high
    issue: 첫 화자를 복수 ‘제자들이’로 번역함
    rationale: 사본의 정규화 본문은 ⲡⲙⲁⲑⲏⲧⲏⲥ, 곧 정관사 남성 단수 ‘그 제자’를 읽습니다. 응답의 ⲛⲁⲩ(그들에게)는 복수이므로 이를 조화시키기보다 단수/복수의 긴장을 보존하고 주석으로 밝혀야 합니다.
  - severity: low
    issue: 모든 주석 표지가 문단 끝에 일괄 배치됨
    rationale: 주석 표지는 ‘하늘 나라’, ‘무엇과 같은지’, ‘가꾸는 땅’, ‘큰 가지’, ‘쉼터’ 등 각각의 해당 표현에 붙여 독자가 지시 대상을 알 수 있게 해야 합니다.
