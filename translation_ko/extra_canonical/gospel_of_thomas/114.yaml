base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
  footnotes:
  - marker: a
    text: The choice ‘female’ (ⲥϩⲓⲙⲉ) over ‘woman’ keeps the parallel with ‘male’ (ϩⲟⲟⲩⲧ) tight and reflects Thomas’s stark male/female polarity.
    reason: lexical_alternative
  - marker: b
    text: The object pronoun ‘her’ appears as ⲙ̄ⲙⲟⲥ in the manuscript lineation; Dilley’s normalization presents the equivalent ⲛⲛⲧⲟⲥ. Both are 3fs direct objects.
    reason: textual_variant
  - marker: c
    text: Spelling varies between ⲛϩⲟⲟⲧ and ⲛϩⲟⲟⲩⲧ for ‘male’; this is an orthographic/dialectal fluctuation without semantic difference.
    reason: dialect_note
  - marker: d
    text: ‘Heavens’ renders ⲡⲡⲉ; some translations use ‘heaven’. The Coptic expression functions as the locus of divine reign rather than a strictly spatial plural.
    reason: lexical_alternative
translation:
  language: ko
  text: 시몬 베드로가 그들에게 말했습니다. “마리아를 우리 가운데서 내보내십시오. 여자는 생명에 합당하지 않습니다.” 예수께서 말씀하셨습니다. “보십시오, 내가 그녀를 이끌어 내가 그녀를 남자로 만들겠습니다. 그러면 그녀도 너희 남자들처럼 살아 있는 영이 될 것입니다. 자기 자신을 남자로 만드는 모든 여자는 하늘 나라에 들어갈 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲥϩⲓⲙⲉ는 여기서 ‘여자’보다 성별 범주가 선명한 ‘female’의 기능을 합니다.
    reason: lexical_alternative
  - marker: b
    text: ⲙ̄ⲙⲟⲥ와 ⲛⲛⲧⲟⲥ는 모두 3인칭 여성 단수 목적어를 가리키는 이문입니다.
    reason: textual_variant
  - marker: c
    text: ⲛϩⲟⲟⲩⲧ / ⲛϩⲟⲟⲧ의 표기는 ‘남자’의 철자 차이일 뿐 의미 차이는 없습니다.
    reason: textual_variant
  - marker: d
    text: ⲡⲡⲉ는 문자적으로는 ‘하늘들’이지만, 대개 하나님의 통치 영역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥϩⲓⲙⲉ
  english_pob_choice: female
  chosen_korean: 여자
  alternatives_korean:
  - 여성
  - 여인
  lexicon: Crum s.v. ⲥϩⲓⲙⲉ
  rationale: 이 대목은 ϩⲟⲟⲩⲧ ‘남자’와의 성별 대조를 강하게 세우므로, 한국어에서도 인물 호칭보다 성별 범주를 드러내는 ‘여자’가 가장 직접적입니다.
- source_word: ϩⲟⲟⲩⲧ
  english_pob_choice: male
  chosen_korean: 남자
  alternatives_korean:
  - 남성
  - 수컷
  lexicon: Crum s.v. ϩⲟⲟⲩⲧ
  rationale: 원문은 생물학적/성별 대비를 의도하므로, 서술 전체에서 반복되는 대칭을 살리기 위해 ‘남자’로 옮겼습니다.
- source_word: ⲙⲡϣⲁ ⲁⲛ
  english_pob_choice: is not worthy
  chosen_korean: 합당하지 않습니다
  alternatives_korean:
  - 가치가 없습니다
  - 자격이 없습니다
  lexicon: Crum s.v. ϣⲁ
  rationale: 영어 POB의 ‘not worthy’를 따라가되, 한국어에서는 사람의 존엄을 평가하는 뉘앙스를 자연스럽게 드러내는 ‘합당하지 않습니다’가 가장 무난합니다.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오,
  lexicon: Layton (grammar) deictic particle
  rationale: 예수의 직접 화법에서 청중의 주의를 급히 환기하는 표지이므로, 합쇼체 명령/촉구인 ‘보십시오’가 적절합니다.
- source_word: ⲥⲱⲕ
  english_pob_choice: lead
  chosen_korean: 이끌겠습니다
  alternatives_korean:
  - 데려가겠습니다
  - 인도하겠습니다
  lexicon: Crum s.v. ⲥⲱⲕ
  rationale: ⲥⲱⲕ은 ‘이끌다/데려가다’의 넓은 뜻을 가지며, 여기서는 변형과 이동을 포함한 주도적 행위를 나타내므로 ‘이끌겠습니다’가 자연스럽습니다.
- source_word: ⲉⲓⲣⲉ … ⲛϩⲟⲟⲩⲧ
  english_pob_choice: make … male
  chosen_korean: 남자로 만들겠습니다
  alternatives_korean:
  - 남성으로 만들겠습니다
  - 남자답게 만들겠습니다
  lexicon: Crum s.v. ⲉⲓⲣⲉ; Crum s.v. ϩⲟⲟⲩⲧ
  rationale: 원문의 낯선 변환 진술을 약화하지 않기 위해, 표준적 신학 표현으로 순화하지 않고 직역에 가깝게 유지했습니다.
- source_word: ⲡⲡⲉ
  english_pob_choice: the heavens
  chosen_korean: 하늘 나라
  alternatives_korean:
  - 하늘들
  - 하늘
  lexicon: Crum s.v. ⲡⲉ/ⲡⲡⲉ
  rationale: Thomas의 관용적 표현은 하나님 통치의 장을 가리키므로, 한국어에서는 ‘하늘 나라’가 가장 읽기 자연스럽고 의미를 보존합니다.
theological_decisions:
- issue: 성별 변환 진술의 번역 강도
  chosen_reading: 예수의 발언을 원문 그대로 따라 ‘남자로 만들겠습니다’라고 옮겨, 본문의 도발적 성별 변환 논리를 완화하지 않았습니다.
  alternative_readings:
  - ‘남성으로 만들겠습니다’처럼 학술적으로 중화하는 번역
  - ‘남자답게 만들겠습니다’처럼 해석을 덧붙이는 번역
  rationale: 이 문장은 토마스복음서의 신학적 긴장을 그대로 드러내는 핵심 진술이므로, 해석을 덧입혀 의미를 완충하지 않는 것이 source-grounded 원칙에 부합합니다.
  doctrine_reference: 토마스복음서 114의 성별/구원 상징성에 대한 본문 자체의 긴장 유지
- issue: ‘하늘의 왕국’ 계열 표현
  chosen_reading: ‘하늘 나라’로 옮겨, 통치 영역을 가리키는 표현을 한국어 독자에게 명료하게 제시했습니다.
  alternative_readings:
  - ‘하늘들의 왕국’
  - ‘하늘의 왕국’
  rationale: Coptic ⲡⲡⲉ의 복수적 색채는 남기되, 한국어에서는 생소한 복수 표현보다 통치 개념을 우선하여 의미 전달을 확보했습니다.
  doctrine_reference: 종말론적/통치 개념으로서의 나라(language of reign)
