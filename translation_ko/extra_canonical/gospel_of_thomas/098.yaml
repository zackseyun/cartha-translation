    rationale: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ는 높은 사회적 지위의 사람을 뜻하지만, ‘큰사람’은 현대 한국어에서 그 뜻이 자연스럽게 전달되지 않습니다.
  - severity: low
