revisions:
- from: 예수께서 말씀하셨습니다. “아버지의 왕권은 자기 집 안에서 칼을 뽑아 벽에 꽂아, 손이 그 벽을 꿰뚫을 만큼 강한지 알아보려는 한 사람과 같습니다. 그런 다음 그 사람은 그 큰사람을 죽였습니다.”[a][b][c][d][e]
  to: 예수께서 말씀하셨습니다. “아버지의 왕권은 유력자를 죽이려고 자기 집에서 칼을 뽑아 벽에 찔러 넣고, 자기 손에 힘이 충분한지 알아보려 한 어떤 사람과 같습니다. 그러고 나서 그는 그 유력자를 죽였습니다.”[a][b][c][d]
  rationale: 원문의 서사 순서(유력자를 죽이려 함—집에서 칼을 뽑음—벽에 찔러 넣음—손의 힘을 시험함—유력자를 죽임)를 유지했습니다. 특히 ‘벽을 꿰뚫는 손’이라는 초안의 과도한 구체화를 피하고, 논쟁 여지가 있는 ⲧⲱⲕ ⲉϩⲟⲩⲛ의 직역 가능성은 각주에 보존했습니다. 불필요한 문체 편집 주석은 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:19Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘손이 그 벽을 꿰뚫을 만큼’은 원문이 말하지 않는 ‘벽을 꿰뚫음’을 손의 직접 행위로 특정합니다. 콥트어는 그가 칼을 벽에 찔러 넣어 자신의 손이 충분히 강한지 알아보려 했다고 하며, ⲧⲱⲕ ⲉϩⲟⲩⲛ에는 ‘안으로 들어가다’라는 직역 가능성이 남아 있으나 문맥상 손의 힘을 시험하는 뜻이 우세합니다.
  naturalness: ‘큰사람’은 현대 표준 한국어에서 사회적 지위를 가리키는 표현으로 부자연스럽고 의미가 불명확합니다. ‘유력자’가 그리스어 차용어 ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ의 높은 지위라는 뜻을 자연스럽게 전달합니다. 문장은 합쇼체 서술로 유지했습니다.
  terminology: ‘아버지의 왕권’은 ⲡⲙⲛⲧⲣⲣⲟ의 추상적 통치/주권 의미를 적절히 반영합니다. ‘아버지 하나님’이나 특정 교단적 용어를 덧붙이지 않은 점도 적절합니다.
  issues:
  - severity: medium
    issue: ‘손이 그 벽을 꿰뚫을 만큼 강한지’라는 표현
