base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/098.yaml
  text: Jesus said[a], “The Father’s kingship is like a man who wanted to kill a magnate. He drew the sword in his house and drove it into the wall, so that he might find out whether his hand would be strong enough[e][d][c][b]; then he killed the magnate.”
  footnotes:
  - marker: a
    text: “Kingship” renders ⲡⲙⲛⲧⲣⲣⲟ (abstract ‘rule’), not a territorial realm; “kingdom” is a viable alternative.
    reason: lexical_alternative
  - marker: b
    text: The Greek loan ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ denotes a high-ranking ‘great man’; alternatives include “great man,” “nobleman,” or “powerful man.” “Magnate” preserves the social nuance and foreign flavor.
    reason: lexical_alternative
  - marker: c
    text: The clause “whether his hand could go in” translates ⲧⲱⲕ ⲉϩⲟⲩⲛ; it can also mean “be strong enough to enter/penetrate.”
    reason: lexical_alternative
  - marker: d
    text: Or 'whether his hand could go in'.
    reason: previous_rendering
  - marker: e
    text: Or 'a man—a magnate'.
    reason: previous_rendering
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. “아버지의 왕권은 자기 집 안에서 칼을 뽑아 벽에 꽂아, 손이 그 벽을 꿰뚫을 만큼 강한지 알아보려는 한 사람과 같습니다. 그런 다음 그 사람은 그 큰사람을 죽였습니다.”[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕권’은 ⲡⲙⲛⲧⲣⲣⲟ의 추상적 의미를 살린 번역이며, ‘왕국’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘큰사람’은 그리스어 차용어 ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ가 지닌 높은 사회적 지위를 드러내기 위한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘꿰뚫을 만큼 강한지’는 ⲧⲱⲕ ⲉϩⲟⲩⲛ의 ‘강함/견고함’과 ‘안으로 들어감’의 결합을 문맥적으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘손이 안으로 들어갈 수 있는지’로도 이해될 수 있지만, 문맥은 손의 힘을 시험하는 뜻이 더 강합니다.
    reason: previous_rendering
  - marker: e
    text: 이 문장은 ‘한 사람과 같습니다’로도 옮길 수 있으나, 한국어 자연성을 위해 앞의 ‘자기 집 안에서 칼을 뽑아…’까지 한 문장 안에서 이어 주었습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ / English POB 'kingship'
  english_pob_choice: kingship
  chosen_korean: 왕권
  alternatives_korean:
  - 왕국
  - 통치
  - 나라
  lexicon: Crum; Layton
  rationale: ⲡⲙⲛⲧⲣⲣⲟ는 영토보다 ‘다스림/주권’의 추상성을 가리키므로, 한국어에서는 ‘왕권’이 ‘왕국’보다 원문의 의미를 더 정확히 반영합니다.
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ / English POB 'magnate'
  english_pob_choice: magnate
  chosen_korean: 큰사람
  alternatives_korean:
  - 유력자
  - 대인
  - 귀인
  - 거물
  lexicon: Crum
  rationale: 그리스어 차용어가 가리키는 높은 사회적 지위를 드러내면서도, 현대 한국어에서 지나치게 시대착오적이거나 교회식인 표현을 피하기 위해 ‘큰사람’으로 옮겼습니다.
- source_word: ϫⲟⲧⲥ ⲛⲧϫⲟ / English POB 'drove it into the wall'
  english_pob_choice: drove it into the wall
  chosen_korean: 벽에 꽂아
  alternatives_korean:
  - 벽을 찔러
  - 벽에 박아
  - 벽에 내리꽂아
  lexicon: Crum
  rationale: 벽에 대한 거친 동작과 방향성을 살리되, 서술의 긴박함을 유지하려고 ‘꽂아’로 간결하게 처리했습니다.
- source_word: ⲧⲱⲕ ⲉϩⲟⲩⲛ / English POB 'would be strong enough'
  english_pob_choice: would be strong enough
  chosen_korean: 꿰뚫을 만큼 강한지
  alternatives_korean:
  - 들어갈 만큼 강한지
  - 버틸 만큼 강한지
  - 밀어 넣을 만큼 강한지
  lexicon: Crum; applied revision
  rationale: 문맥상 손의 ‘힘’을 시험하는 표현이므로, 단순한 이동 가능성보다 ‘꿰뚫을 만큼 강한지’로 옮겨 ⲧⲱⲕ의 힘/강함이라는 핵심을 살렸습니다.
- source_word: ⲡⲉⲓⲱⲧ / English POB 'the Father'
  english_pob_choice: the Father
  chosen_korean: 아버지
  alternatives_korean:
  - 하늘의 아버지
  - 아버지 하나님
  lexicon: Crum
  rationale: 토마스복음서의 통상적 표지를 따라 ‘아버지’를 유지하되, 한국어 문맥에서 소유격 ‘아버지의 왕권’으로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 주어 호칭과 문장 톤
  chosen_reading: 서술문은 평서형으로 두고, 예수의 직접화법만 따옴표로 처리했습니다.
  alternative_readings:
  - 말씀하십니다/말하셨다
  - 직접화법 없이 간접서술
  rationale: 본문은 예수의 발화를 도입하는 간단한 서술이므로, 합쇼체 서술과 직접인용의 구분을 명확히 하는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문 형식 및 담화구조
- issue: ‘왕국’ 대신 ‘왕권’ 선택
  chosen_reading: 하나님의 나라 계열로 익숙한 ‘왕국’보다 추상명사 ‘왕권’을 사용했습니다.
  alternative_readings:
  - 왕국
  - 나라
  - 통치
  rationale: 이 구절의 핵심은 공간적 영역이 아니라 아버지의 지배/주권이므로, 독자가 오해하지 않도록 ‘왕권’을 채택했습니다.
  doctrine_reference: 본문 의미론 및 POB의 kingship 해설
