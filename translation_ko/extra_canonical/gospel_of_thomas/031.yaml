base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/031.yaml
  text: Jesus said[1], "No prophet is acceptable in his village[3][2]; a physician does not heal those who know him."
  footnotes:
  - marker: '1'
    text: The Greek fragment P.Oxy. 1 reads 'in his hometown' (πατρίδι) rather than 'village' (ϯⲙⲉ), and 'perform healings for' rather than 'heal'.
    reason: textual_variant
  - marker: '2'
    text: The Coptic prefix ⲙⲁⲣⲉ- (mare-) is used here as the negative aorist ('does not'), a regional dialect spelling of the standard Sahidic ⲙⲉⲣⲉ- (mere-). It should not be confused with the identical-looking jussive prefix ('let').
    reason: dialect_note
  - marker: '3'
    text: Compare Luke 4:24, 'no prophet is accepted in his hometown.' Thomas uniquely pairs this with the aphorism about the physician, though Luke 4:23 quotes the proverb 'Physician, heal yourself' immediately prior.
    reason: cross_reference
translation:
  language: ko
  text: 예수께서 말씀하셨습니다. 「어느 예언자도 자기 마을에서는 받아들여지지 않고, 어떤 의사도 자기를 아는 사람들을 고치지 않습니다.」[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: Coptic ⲙⲁⲣⲉ-는 여기서 명령형이 아니라 부정 아오리스트로 기능합니다.
    reason: source_note
  - marker: b
    text: P.Oxy. 1의 그리스어 평행본은 ‘고향’(πατρίδι)을 사용하지만, 이 사본의 Coptic은 ‘마을’(ϯⲙⲉ)을 사용합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛ̄ⲡⲣⲟⲫⲏⲧⲏⲥ
  english_pob_choice: No prophet
  chosen_korean: 어느 예언자도
  alternatives_korean:
  - 예언자는 아무도
  - 예언자란 하나도
  lexicon: Crum 171a
  rationale: 부정 존재 구문을 한국어의 범위 부정으로 옮겨, ‘한 사람도 없음’의 보편적 부정을 자연스럽게 드러냈습니다.
- source_word: ϣⲏⲡ
  english_pob_choice: acceptable
  chosen_korean: 받아들여지지 않고
  alternatives_korean:
  - acceptable하지 않고
  - 인정받지 않고
  - 환영받지 않고
  lexicon: Crum 576a
  rationale: ϣⲱⲡ의 질적 의미를 살리되, 한국어에서는 ‘받아들이다’가 가장 직접적으로 수용 불가 상태를 표현합니다.
- source_word: ϯⲙⲉ
  english_pob_choice: village
  chosen_korean: 자기 마을
  alternatives_korean:
  - 자기 동네
  - 자기 고을
  - 자기 고향
  lexicon: Crum 414a
  rationale: Coptic의 ϯⲙⲉ는 본문상 ‘마을’이 가장 직접적이며, P.Oxy. 1의 ‘hometown’과 구별되는 Coptic 증거를 유지했습니다.
- source_word: ⲙⲁⲣⲉⲥⲟⲉⲓⲛ ⲣ̄ⲑⲉⲣⲁⲡⲉⲩⲉ
  english_pob_choice: a physician does not heal
  chosen_korean: 어떤 의사도 … 고치지 않습니다
  alternatives_korean:
  - 의사는 … 치료하지 않습니다
  - 어떤 의원도 … 낫게 하지 않습니다
  lexicon: Crum 369a; BDAG 443
  rationale: ⲥⲟⲉⲓⲛ을 ‘의사’로, ⲣ̄ⲑⲉⲣⲁⲡⲉⲩⲉ를 ‘고치다’로 옮겨, 본문이 ‘치유를 행하다’가 아니라 ‘의사가 치유하다’라는 일반 진술임을 반영했습니다.
theological_decisions:
- issue: 복음서 평행구와의 조화
  chosen_reading: ‘마을’과 ‘의사도 고치지 않습니다’라는 Coptic 문구를 그대로 유지했습니다.
  alternative_readings:
  - 고향
  - 치유를 베풀지 않습니다
  rationale: 누가복음의 평행구를 떠올리게 하더라도, 여기서는 Coptic이 ‘마을’(ϯⲙⲉ)과 ‘의사’(ⲥⲟⲉⲓⲛ)를 분명히 제시하므로 이를 우선해 번역했습니다.
  doctrine_reference: 본문 비평 및 평행본문 대조
- issue: 예언자/의사 격언의 일반성
  chosen_reading: 보편적 격언으로 읽히도록 현재형 일반 진술로 옮겼습니다.
  alternative_readings:
  - 과거형 서술
  - 미래형 예고
  rationale: 문맥상 특정 사건 보고가 아니라 일반 진리 진술이므로, 한국어에서도 현재 시제의 격언형이 가장 자연스럽습니다.
  doctrine_reference: 문법-담화 기능
