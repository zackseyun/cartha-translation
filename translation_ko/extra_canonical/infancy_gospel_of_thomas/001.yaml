  text: 'I, Thomas the Israelite, considered it necessary to make known to all the Gentile brothers and sisters everything done by our Lord Jesus Christ in the village of Nazareth after he was born in our region of Bethlehem. This is the beginning:'
translation:
  language: ko
  text: 이스라엘 사람인 나 도마는, 우리 주 예수 그리스도께서 우리 고장 베들레헴에서 태어나신 뒤 나사렛 마을에서 행하신 모든 일을 모든 이방인 형제자매들에게 알릴 필요가 있다고 생각했습니다. 시작은 이러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Thomas the Israelite
  choice: 이스라엘 사람인 나 도마
  rationale: 화자의 자기소개를 자연스러운 한국어 어순으로 옮기면서 ‘Israelite’의 민족적 명칭을 보존했습니다.
- source_word: Gentile brothers (and sisters)
  choice: 이방인 형제자매들
  rationale: ‘Gentile’의 유대인·비유대인 구별을 ‘이방인’으로 유지하고, 괄호 속 여성 포함 표현을 자연스럽게 통합했습니다.
- source_word: our region of Bethlehem
  choice: 우리 고장 베들레헴
  rationale: ‘our region’의 지역적 소속감을 살리되 현대 독자가 이해하기 쉬운 표현을 택했습니다.
- source_word: This is the beginning
  choice: 시작은 이러합니다
  rationale: 뒤이어 이야기가 시작됨을 알리는 서문 종결구의 기능과 격식을 보존했습니다.
theological_decisions:
- issue: ‘our Lord Jesus Christ’의 칭호 보존
  choice: 우리 주 예수 그리스도
  alternative: 우리의 주님 예수 그리스도
  rationale: 원문의 전통적 기독론적 칭호를 그대로 보존하면서 한국어 성서 문체에 자연스러운 형태를 사용했습니다.
- issue: 예수의 출생지와 활동지의 관계
  choice: 우리 고장 베들레헴에서 태어나신 뒤 나사렛 마을에서 행하신
  alternative: 우리 지역 베들레헴에서 태어나 나사렛 동네에서 하신
  rationale: 베들레헴은 출생지, 나사렛은 이후 행적의 장소라는 문장 구조를 해석적으로 바꾸지 않고 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 다만 제공된 자료가 공공 영역 영어 증언을 바탕으로 하며 그리스어 원문 대조가 아직 이루어지지 않았으므로 잠정 번역입니다.
