  source_fidelity: 제공된 영어 증언의 문장 관계를 충실히 보존합니다. 화자(‘나 도마’), 수신자(이방인 형제자매들), 베들레헴에서의 출생 이후 나사렛에서 행하신 일이라는 시간·장소 관계, 그리고 서문의 ‘시작’ 표지가 모두 반영되어 있습니다. 그리스어 전승의 직접 대조는 아직 보류되어 있으므로, 영어 증언을 넘어서는 세부 본문비평적 확정은 하지 않았습니다.
  naturalness: ‘이스라엘 사람인 나 도마는’과 ‘알릴 필요가 있다고 생각했습니다’는 현대 표준 한국어의 격식 있는 합쇼체에 자연스럽습니다. ‘우리 고장 베들레헴’도 원문의 소속·지역 표현을 지나치게 행정적으로 만들지 않으면서 무리 없이 전달합니다.
  terminology: ‘이방인’, ‘형제자매들’, ‘우리 주 예수 그리스도’는 각각 유대인/비유대인 구별, 여성 포함 표기, 전통적 칭호를 적절히 보존합니다. ‘행하신 모든 일’은 본문이 말하는 행위를 자연스럽고 중립적으로 옮깁니다.
