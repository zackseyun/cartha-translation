translation:
  language: ko
  text: '**제7장 사가랴의 탄식**


    (1) 선생은 예수께서 첫 글자의 획들에 관하여 말한 그토록 훌륭한 식견과 설명을 듣고[a], 그 가르침과 변론에 어찌할 바를 몰랐습니다. 선생이 말했습니다. “아, 이 일을 어찌하면 좋단 말입니까! 아, 이 일을 어찌하면 좋단 말입니까! 나는 당황하고 비참해졌습니다. 이 아이를 맡아 스스로 수치를 불러들였습니다.


    (2) “형제여, 이 아이를 내게서 데려가십시오. 나는 이 아이의 눈길도, 그 말의 명료함도 견딜 수 없습니다. 이 아이는 도무지 이 세상에 속한 아이가 아닙니다. 불조차 길들일 수 있습니다! 어쩌면 이 아이는 세상이 창조되기 전부터 존재했는지도 모릅니다. 어떤 태가 이 아이를 품었습니까? 어떤 어머니가 이 아이를 길렀습니까? 나는 모르겠습니다. 아, 이 일을 어찌하면 좋단 말입니까, 형제여! 이 아이는 나를 망연자실하게 합니다. 내 정신으로는 이 아이를 따라갈 수 없습니다. 나는 스스로를 속였습니다. 세 겹으로 불행한 사람인 내가 말입니다. 제자 하나를 얻으려 했는데, 도리어 내가 선생을 둔 사람으로 드러났습니다.


    (3) “벗들이여, 늙은 내가 어린아이에게 패했으니 내 수치를 생각해 봅니다. 나는 쫓겨나 죽든지, 이 아이 때문에 이 마을에서 달아나든지 해야 합니다. 이제는 사람들 앞에 모습을 드러낼 수 없습니다. 특히 내가 아주 어린아이에게 패한 것을 본 사람들 앞에는 더욱 그럴 수 없습니다. 그러나 첫 요소인 글자의 획들에 관하여[b] 내가 누구에게 무슨 말을 할 수 있겠습니까? 벗들이여, 사실 나는 모릅니다. 시작도 끝도 이해하지 못하기 때문입니다!


    (4) “그러니 형제 요셉이여, 이 아이를 데리고 무사히[c] 집으로 돌아가십시오. 이 아이는 위대한 존재입니다. 신인지 천사인지, 아니면 달리 무엇이라 해야 할지 나는 모르겠습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘훌륭한 식견과 설명’에 해당하는 영어 증언의 문구는 직역하면 ‘그처럼 훌륭한 친숙함과 첫 글자의 그와 같은 획들’입니다. 그리스어 문헌과의 직접 대조가 필요합니다.
    reason: 잠정 번역의 근거와 이례적인 원문 표현을 투명하게 밝히기 위해서입니다.
  - marker: b
    text: ‘첫 요소인 글자’는 알파벳의 첫 글자를 가리킬 수 있습니다. 영어 증언은 ‘첫 요소의 획들’이라고 되어 있습니다.
    reason: ‘요소’와 ‘글자’ 사이의 고대적 언어유희 또는 의미 중첩을 보존하기 위해서입니다.
  - marker: c
    text: 영어 증언은 직역하면 ‘구원과 함께 네 집으로 데려가라’입니다. 여기서는 안전하고 평안하게 데려가라는 뜻으로 이해했지만, ‘구원’의 종교적 울림도 남아 있습니다.
    reason: 관용적 안녕의 뜻과 신학적 ‘구원’의 가능성 사이의 모호성을 알리기 위해서입니다.
lexical_decisions:
- source_word: good familiarity
  choice: 훌륭한 식견
  rationale: 영어 증언의 표현이 이례적이고 그리스어 직접 대조가 보류되어 있으므로, 문맥상 예수가 글자의 의미를 잘 알고 설명한 능력을 가리키는 자연스러운 한국어로 옮기되 각주에서 잠정성을 밝혔습니다.
- source_word: lines of the first letter
  choice: 첫 글자의 획들
  rationale: 글자의 모양을 이루는 선들을 가리키는 표현으로 이해하여 ‘획들’로 옮겼으며, 앞 장의 알파벳 문답과 연결되는 ‘첫 글자’를 유지했습니다.
- source_word: tame fire
  choice: 불조차 길들일 수 있습니다
  rationale: 과장되고 경이로운 진술의 비유적 힘을 약화하지 않고 직역에 가깝게 보존했습니다.
- source_word: thrice-unhappy
  choice: 세 겹으로 불행한
  rationale: 강조법의 독특한 수사적 형태를 ‘몹시 불행한’으로 평준화하지 않고 드러냈습니다.
- source_word: a great thing
  choice: 위대한 존재
  rationale: 사람을 단순히 ‘것’이라 부르는 부자연스러움을 피하면서도, 뒤이어 정체를 추측하는 문맥에 맞게 존재론적 모호성을 보존했습니다.
- source_word: with salvation
  choice: 무사히
  rationale: 한국어 본문에서는 이동의 안녕을 비는 말로 자연스럽게 옮겼으나, ‘구원’의 뜻일 가능성도 있어 각주로 원문 증언의 표현을 밝혔습니다.
theological_decisions:
- issue: 아이의 선재 가능성
  choice: ‘세상이 창조되기 전부터 존재했는지도 모릅니다’라는 추측형 진술을 유지했습니다.
  alternative: 예수의 영원한 선재를 확정적으로 진술할 수 있습니다.
  rationale: 화자가 ‘어쩌면’이라고 추측할 뿐이므로, 후대의 교리적 확정으로 강화하지 않았습니다.
- issue: ‘신인지 천사인지’라는 정체 진술
  choice: ‘신인지 천사인지, 아니면 달리 무엇이라 해야 할지’로 모호성과 화자의 무지를 그대로 두었습니다.
  alternative: ‘하나님인지’ 또는 ‘하나님의 아들인지’로 특정할 수 있습니다.
  rationale: 영어 증언은 부정관사가 있는 ‘a god’와 ‘an angel’을 병렬하며 화자가 모른다고 말합니다. 이를 정통 교리의 고정된 칭호로 바꾸지 않았습니다.
- issue: with salvation의 의미
  choice: 본문은 ‘무사히’로 번역하고 각주에 ‘구원과 함께’라는 문자적 가능성을 제시했습니다.
  alternative: ‘구원을 받아’ 또는 ‘구원과 함께’로 본문에 옮길 수 있습니다.
  rationale: 이동의 안전을 뜻하는 관용적 축원일 수 있지만 구원론적 울림도 배제할 수 없으므로, 본문은 자연스럽게 하고 각주로 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 선생의 탄식은 반복과 과장을 살리되 지나치게 고어적인 감탄사는 피했고, 요셉과 벗들을 향한 호칭은 장면의 격식을 살려 ‘형제여’, ‘벗들이여’로 옮겼습니다. 이 초안은 제공된 공공영역 영어 증언을 바탕으로 한 잠정 번역이며, 출판 확정 전에 그리스어 사본 전통과 직접 대조해야 합니다.
