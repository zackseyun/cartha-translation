translation:
  language: ko
  text: '(1) 예수께서는 그곳을 떠나 아버지 요셉과 함께 가고 계셨습니다. 그런데 달려가던 어떤 아이가 예수의 어깨를 치고 지나갔습니다. 예수께서 그 아이에게 말씀하셨습니다. “네 지도자 때문에 네가 저주를 받아라!”[a]


    그러자 그 아이는 즉시 죽었습니다.


    그 아이가 즉시 죽은 것을 본 사람들은 소리 높여 말했습니다. “이 아이는 대체 어디에서 태어났기에, 그의 말이 그대로 현실이 되는가?”


    (2) 죽은 아이의 부모는 일어난 일을 보고 예수의 아버지 요셉을 탓하며 말했습니다. “당신이 이 아이를 어디에서 얻었든, 이 마을에서는 우리와 함께 살 수 없습니다.[b] 여기에서 살고 싶다면, 이 아이가 저주하지 말고 복을 빌도록 가르치십시오. 우리가 우리 아이를 빼앗겼기 때문입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “네 지도자 때문에”는 제공된 영어 증언에 있는 이례적이고 뜻이 불분명한 표현입니다. 그리스어 원문 대조가 아직 이루어지지 않았으므로 추정하여 고치지 않았습니다.
    reason: 난해한 문구를 본문에서 보존하되 독자에게 본문 상태와 번역의 잠정성을 알리기 위해서입니다.
  - marker: b
    text: “어디에서 얻었든”은 요셉이 이 아이를 어디에서 데려왔는지 묻는 식의 원문 증언을 반영한 표현이며, 출생이나 친자 관계를 단정하지 않습니다.
    reason: ‘have this child’의 모호함을 한국어에서 가능한 한 보존하기 위해서입니다.
lexical_decisions:
- source_word: leader
  choice: 지도자
  rationale: 제공된 영어 증언의 이례적인 표현을 완화하거나 다른 신체 부위·인물로 추정하여 고치지 않고 그대로 보존했습니다.
- source_word: his word becomes deed
  choice: 그의 말이 그대로 현실이 되는가
  rationale: 직역투인 ‘말이 행위가 되다’보다 자연스러우면서도, 예수의 말이 즉각 효력을 내어 사건이 된다는 의미와 긴장을 보존했습니다.
- source_word: bless
  choice: 복을 빌다
  rationale: 문맥상 ‘저주하다’와 대조되는 발화 행위를 분명하고 자연스러운 현대 한국어로 표현했습니다.
- source_word: taken away from us
  choice: 우리가 우리 아이를 빼앗겼다
  rationale: 죽음을 가리키는 완곡하면서도 격한 부모의 표현을 유지하고, 누가 빼앗았는지는 명시하지 않았습니다.
theological_decisions:
- issue: 예수의 저주와 아이의 즉각적인 죽음 사이의 관계
  choice: 서술 순서와 즉시성을 그대로 제시했습니다.
  alternative: 죽음을 우연한 사건으로 완화하거나 저주를 예언으로 해석할 수 있습니다.
  rationale: 본문은 불편한 인과적 인상을 남기지만 이를 명시적으로 해설하지 않습니다. 따라서 그 신학적·도덕적 긴장을 번역에서 해소하지 않았습니다.
- issue: “네 지도자 때문에”라는 난해한 저주의 이유
  choice: 본문에 ‘네 지도자 때문에’를 유지하고 각주로 불확실성을 밝혔습니다.
  alternative: 문맥에 맞게 ‘네가 한 짓 때문에’ 등으로 교정할 수 있습니다.
  rationale: 제공된 증언 자체가 이례적 표현을 보존하며, 그리스어 원문 대조가 아직 이루어지지 않았으므로 추정 교정을 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 읽기 쉽게 다듬되, 원문의 짧고 충격적인 전개와 주민들의 직접적인 비난을 완화하지 않았습니다. 제공 자료가 그리스어 원문 자체가 아니라 공개 영역 영어 증언이며 원어 검토가 보류 중이므로, 난해한 대목에는 각주를 달아 잠정성을 명시했습니다.
