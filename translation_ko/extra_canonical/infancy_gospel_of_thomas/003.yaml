base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: ko
  text: '(1) 대제사장 안나스의 아들이 예수께 말했습니다. “왜 안식일에 이런 일을 하는 것이오?” 그러고는 버드나무 가지를 하나 집어 웅덩이들을 허물고, 예수께서 모아 놓으신 물을 흘려 버려 그 모인 물을 말려 버렸습니다.[a]


    (2) 예수께서는 일어난 일을 보시고 그에게 말씀하셨습니다. “네 열매에는 뿌리가 없을 것이며, 네 싹은 사나운 바람에 그슬린 가지처럼 시들어 버릴 것이다!”[b]


    (3) 그러자 그 아이는 곧 시들어 버렸습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 모인 물’은 제공된 영어 증언의 모호한 표현 ‘their gatherings’를 문맥에 따라 옮긴 것입니다. 그리스어 원문을 직접 대조하면 달라질 수 있습니다.
    reason: 직접적인 그리스어 검토가 보류된 상태에서 불확실한 구절을 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘열매’, ‘뿌리’, ‘싹’, ‘가지’, ‘시들다’는 서로 이어지는 식물 비유입니다.
    reason: 이어지는 심판 선언의 이미지 구조를 독자가 파악하도록 돕기 위해서입니다.
  - marker: c
    text: ‘시들어 버렸다’는 아이가 죽었다고 명시하지 않으며, 앞 절의 식물 비유를 그대로 되풀이합니다.
    reason: 증언이 남겨 둔 사건의 성격에 관한 모호성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: son of Annas the high priest
  choice: 대제사장 안나스의 아들
  rationale: 인명과 직분의 관계를 원문 증언대로 직접 보존했습니다.
- source_word: willow twig
  choice: 버드나무 가지
  rationale: 현대 독자가 자연스럽게 이해할 수 있는 구체적인 식물 명칭과 사물 표현을 사용했습니다.
- source_word: pools
  choice: 웅덩이들
  rationale: 앞 문맥에서 아이가 만들어 물을 모은 작은 물웅덩이를 가리키는 표현으로 옮겼습니다.
- source_word: their gatherings
  choice: 그 모인 물
  rationale: 영어 증언의 직역인 ‘그것들의 모임’은 한국어로 불분명하여, 문맥상 웅덩이에 모인 물을 가리키는 것으로 최소한만 명료화했습니다. 다만 직접 그리스어 검토 전의 잠정적 선택임을 각주에 밝혔습니다.
- source_word: fruit / root / shoot / withered
  choice: 열매 / 뿌리 / 싹 / 시들다
  rationale: 식물 비유의 어휘 연결과 뒤이어 아이에게 그대로 실현되는 ‘시들다’의 반복을 보존했습니다.
theological_decisions:
- issue: 예수의 말과 아이의 죽음 또는 신체 상태 사이의 관계
  choice: ‘시들어 버렸다’라는 동일한 식물 비유를 유지하고 죽었다고 단정하지 않음
  alternative: ‘말라 죽었다’ 또는 ‘죽었다’
  rationale: 제공된 증언은 아이가 ‘withered away’했다고만 하므로, 사건의 정확한 성격을 교리적으로나 서사적으로 확정하지 않고 원문의 긴장과 모호성을 보존했습니다.
- issue: 예수의 발언을 저주로 명시할지 여부
  choice: 본문에서는 발언 자체만 제시하고 ‘저주했다’는 해설을 덧붙이지 않음
  alternative: ‘예수께서 그를 저주하여 말씀하셨습니다’
  rationale: 장 제목은 저주로 규정하지만 제공된 본문은 단지 ‘말씀하셨다’고 하므로, 본문 번역에 해석적 표지를 추가하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 품위 있고 간결하게 유지하되, 예수께는 높임말을 적용했습니다. 안나스의 아들이 예수께 하는 말은 당시 논쟁적 상황에 맞추어 해체가 아닌 하오체형 ‘하는 것이오?’로 옮겼습니다. 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 그리스어 원문 직접 검토가 필요합니다.
