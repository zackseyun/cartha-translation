  text: '(1) A teacher named Zacchaeus was standing there. He heard Jesus saying these things to his father Joseph, and he was greatly amazed.


    (2) He said to Joseph, “Come, brother, give him to me so that he may be taught letters, know all knowledge, learn to love those his own age, honor old age, and respect elders, so that he may develop a yearning for children and teach them in return.”


    (3) But Joseph said to the teacher, “Who can control this child and teach him? Do not think of him as a small person, brother.”


    But the teacher said, “Give him to me, brother, and do not let him concern you.”


    (4) The child Jesus looked at them and addressed the teacher: “Being a teacher comes naturally to you, but you are a stranger to the name by which you are called, because I am outside you and within you on account of the nobility of my birth in the flesh. But you, a lawyer, do not know the law.”


    Then he said to Joseph, “When you were born, I already existed, standing beside you, so that you, as a father, might be taught by me a teaching that no one else knows or can teach. And you will bear the name of salvation.”


    (5) The Jews cried out and said to him, “Oh, what a new and incredible wonder! The child is perhaps five years old, and oh, what words he speaks! We have never known such words. No one—neither a lawyer nor a Pharisee—has spoken like this child.”


    (6) The child answered them, “Why are you amazed? Or rather, why do you not believe the things I have told you? The truth is that I, who was created before this world, know precisely when you were born, as well as your fathers and their fathers.”


    (7) All the people who heard this were speechless and could no longer speak to him. But he went up to them, skipped around, and said, “I was playing with you because I know that you are small-minded and amazed by small things.”


    (8) When they seemed comforted by the child’s encouragement, the teacher said to his father, “Come, bring him into the school. I will teach him letters.”


    Joseph took his hand and led him into the school. The teacher flattered him and brought him into the school. Zacchaeus wrote out the alphabet for him and began to teach him, repeating the same letter frequently. But the child did not answer him.


    The teacher became irritated and struck him on the head.


    The child became irritated and said to him, “I want to teach you rather than be taught by you, since I know the letters you are teaching more precisely. To me, these things are like a noisy gong or a clanging cymbal that produces neither the sound, nor the glory, nor the power of understanding.”


    (9) When the child’s anger had ceased, he recited all the letters by himself, from alpha to omega, with great skill. Looking directly at the teacher, he said, “If you do not know the nature of the alpha, how can you teach someone else the beta? Hypocrite! If you know, first teach me the alpha, and then I will trust you to speak about the beta.” Then he began to teach the teacher about the first element, and the teacher could say nothing to him.


    (10) While many people listened, he said to the teacher, “Listen, Teacher, and understand the arrangement of the first element. Notice how it has sharp lines and a middle stroke, which you see pointing, standing with its legs apart, coming together, going out, dragging behind, lifting up, dancing around, <…>, in triple rhythm, two-cornered, of the same form, of the same thickness, of the same family, raised, balanced, isometric, and of equal proportions. These are the lines of the alpha.”'
translation:
  language: ko
  text: '도마 유아복음 6장 — 첫 번째 스승 삭개오


    (1) 삭개오라는 교사가 그곳에 서 있었습니다. 그는 예수께서 아버지 요셉에게 하시는 이 말씀을 듣고 크게 놀랐습니다.


    (2) 그가 요셉에게 말했습니다. “형제여, 이리 와서 아이를 내게 맡기십시오. 그러면 아이가 글자를 배우고 모든 지식을 깨우치며, 또래를 사랑하고 노년을 공경하며 연장자를 존중하는 법을 배우게 하겠습니다. 그리하여 아이가 어린이들을 아끼는 마음을 품고, 그들에게도 자신이 배운 것을 가르치게 하겠습니다.”


    (3) 그러나 요셉이 그 교사에게 말했습니다. “누가 이 아이를 다스리고 가르칠 수 있겠습니까? 형제여, 이 아이를 어린 사람으로 여기지 마십시오.”


    그러자 교사가 말했습니다. “형제여, 아이를 내게 맡기고 걱정하지 마십시오.”


    (4) 어린 예수께서 그들을 바라보시고 교사에게 이렇게 말씀하셨습니다. “당신은 본래 교사 노릇에 어울리지만, 정작 자신이 불리는 그 이름에는 낯선 사람입니다. 내가 육신으로 태어난 고귀함으로 말미암아 당신 밖에도 있고 당신 안에도 있기 때문입니다.[a] 그러나 율법 교사인 당신은 율법을 알지 못합니다.”


    그리고 요셉에게 말씀하셨습니다. “당신이 태어났을 때에도 나는 이미 존재하여 당신 곁에 서 있었습니다. 이는 아버지인 당신이 다른 누구도 알지 못하고 가르칠 수도 없는 가르침을 내게 배우게 하려는 것입니다. 그리고 당신은 구원이라는 이름을 지니게 될 것입니다.”[b]


    (5) 유대인들이 외쳐 그에게 말했습니다. “오, 새롭고 믿기 어려운 놀라운 일이여! 이 아이는 아마 다섯 살쯤 되었을 텐데, 이토록 놀라운 말을 하다니! 우리는 이런 말을 들어 본 적이 없습니다. 율법 교사도 바리새인도 이 아이처럼 말한 사람은 아무도 없습니다.”


    (6) 아이가 그들에게 대답하셨습니다. “왜 놀랍게 여깁니까? 아니, 어찌하여 내가 여러분에게 한 말을 믿지 않습니까? 참으로 이 세상보다 먼저 창조된 나는 여러분이 언제 태어났는지, 또 여러분의 아버지들과 그들의 아버지들이 언제 태어났는지를 정확히 압니다.”[c]


    (7) 이 말을 들은 사람들은 모두 말문이 막혀 더는 그에게 아무 말도 할 수 없었습니다. 그러나 아이는 그들에게 다가가 뛰놀며 말했습니다. “나는 여러분과 장난을 친 것입니다. 여러분의 생각이 좁고, 작은 일에도 놀란다는 것을 알기 때문입니다.”


    (8) 사람들이 아이의 격려를 받고 마음을 놓은 듯하자, 교사가 아이의 아버지에게 말했습니다. “자, 아이를 학교로 데려오십시오. 내가 글자를 가르치겠습니다.”


    요셉은 아이의 손을 잡고 학교로 데려갔습니다. 교사는 아이의 비위를 맞추며 학교 안으로 데리고 들어갔습니다. 삭개오는 아이에게 알파벳을 써 주고, 같은 글자를 여러 번 되풀이하여 말하면서 가르치기 시작했습니다. 그러나 아이는 그에게 대답하지 않았습니다.


    교사는 화가 나서 아이의 머리를 때렸습니다.


    아이도 화가 나서 그에게 말씀하셨습니다. “나는 당신에게 배우기보다 당신을 가르치고 싶습니다. 당신이 가르치는 글자들을 내가 더 정확히 알고 있기 때문입니다. 내게 이런 것들은 요란하게 울리는 징이나 쨍그랑거리는 꽹과리와 같습니다. 그것들은 소리도, 영광도, 깨달음의 능력도 드러내지 못합니다.”[d]


    (9) 아이의 분노가 가라앉자, 아이는 알파부터 오메가까지 모든 글자를 혼자서 매우 능숙하게 외웠습니다. 그리고 교사를 똑바로 바라보며 말씀하셨습니다. “당신이 알파의 본질을 알지 못하면서 어떻게 다른 이에게 베타를 가르칠 수 있습니까? 위선자여! 알고 있다면 먼저 내게 알파를 가르치십시오. 그러면 당신이 베타에 관해 말하는 것도 믿겠습니다.” 그런 다음 아이는 첫 글자에 관하여 교사를 가르치기 시작했습니다. 교사는 아이에게 아무 말도 할 수 없었습니다.


    (10) 많은 사람이 듣는 가운데, 아이가 교사에게 말씀하셨습니다. “선생님, 들으시고 첫 글자의 짜임을 깨달으십시오. 보십시오. 그것에는 뾰족한 획들과 가운데 획이 있습니다. 그 획들이 가리키고, 다리를 벌리고 서며, 한데 모이고, 밖으로 나가고, 뒤로 끌며, 위로 들리고, 이리저리 춤추고, <…>, 세 박자를 이루며, 두 모서리를 지니고, 같은 꼴과 같은 굵기와 같은 계열을 이루며, 솟아 있고, 균형을 이루고, 같은 치수와 같은 비례를 지닌 것을 볼 수 있습니다. 이것들이 알파의 획들입니다.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “내가 … 당신 밖에도 있고 당신 안에도 있다”와 그 이유를 설명하는 문장은 의미가 매우 난해합니다. 여기서는 제공된 증언의 모호한 표현을 그대로 살렸습니다.
    reason: 난해하고 잠재적으로 여러 신학적 해석이 가능한 표현임을 알립니다.
  - marker: b
    text: “구원이라는 이름을 지니게 될 것입니다”가 정확히 무엇을 뜻하는지는 분명하지 않습니다.
    reason: 불확실한 명명 또는 구원 관련 표현을 특정 해석으로 고정하지 않습니다.
  - marker: c
    text: 이 증언은 아이 예수를 “이 세상보다 먼저 창조된” 존재라고 표현합니다. 신학적 긴장을 없애기 위해 ‘존재한’으로 바꾸지 않았습니다.
    reason: 원문의 독특한 선재·창조 진술을 독자에게 투명하게 제시합니다.
  - marker: d
    text: 징과 꽹과리에 관한 문장은 비유의 정확한 연결이 불분명합니다. ‘소리, 영광, 깨달음의 능력’도 증언의 낯선 병렬을 유지했습니다.
    reason: 문장 구조와 비유의 난해성을 숨기지 않습니다.
  - marker: e
    text: <…>는 전승 본문이 훼손되었거나 빠졌음을 나타냅니다. 알파의 획을 설명하는 나머지 표현도 매우 난해하여 대략적인 형태 묘사로 옮겼습니다.
    reason: 본문 결락과 번역 불확실성을 명시합니다.
lexical_decisions:
- source_word: letters / alphabet
  choice: 글자 / 알파벳
  rationale: 교육의 대상을 가리킬 때는 자연스러운 ‘글자’를 쓰고, 삭개오가 글자 전체를 써 준 대목에서는 그리스 문자 체계를 분명히 하려고 ‘알파벳’을 사용했습니다.
- source_word: lawyer
  choice: 율법 교사
  rationale: 현대의 법률가로 오해되지 않도록 유대 율법의 전문가라는 역사적 의미를 드러냈습니다.
- source_word: small person
  choice: 어린 사람
  rationale: 단순히 체구가 작다는 뜻으로 제한하지 않고 나이와 지위를 아우르는 원문의 표현을 보존했습니다.
- source_word: yearning for children
  choice: 어린이들을 아끼는 마음
  rationale: 성적·낭만적 의미로 오해될 수 있는 직역을 피하면서, 어린 이들을 돌보고 가르치려는 애정이라는 문맥을 살렸습니다.
- source_word: first element
  choice: 첫 글자
  rationale: 문맥상 그리스 알파벳의 첫 글자 알파를 가리키므로 일반 독자가 이해하기 쉽게 옮겼습니다.
- source_word: alpha / beta / omega
  choice: 알파 / 베타 / 오메가
  rationale: 논증이 그리스 문자의 이름과 모양에 의존하므로 음역했습니다.
- source_word: isometric
  choice: 같은 치수
  rationale: 형태 묘사의 기술적 의미를 살리되 현대 한국어 독자가 이해할 수 있도록 풀어 옮겼습니다.
theological_decisions:
- issue: 예수의 선재와 ‘창조되었다’는 진술
  choice: “이 세상보다 먼저 창조된 나는”으로 그대로 번역
  alternative: ‘이 세상보다 먼저 존재한 나는’으로 완화
  rationale: 본문의 신학적 긴장을 후대의 교리적 표현으로 조정하지 않고 제공된 증언의 명시적 진술을 보존했습니다.
- issue: ‘나는 당신 밖에도 있고 당신 안에도 있다’의 의미
  choice: 공간적·신비적 표현의 모호성을 유지
  alternative: 예수의 지혜나 권위가 교사를 초월하고 내재한다는 해석을 본문에 삽입
  rationale: 구절의 논리와 의미가 불확실하므로 특정 그리스도론적 해석으로 확정하지 않았습니다.
- issue: 요셉이 ‘구원이라는 이름’을 지닌다는 진술
