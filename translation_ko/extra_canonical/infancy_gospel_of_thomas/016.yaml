translation:
  language: ko
  text: '## 제16장 예수께서 뱀에 물린 야고보를 고치시다


    (1) 야고보가 빵을 만들 때 쓸 나뭇가지를 묶으려고 숲으로 갔습니다. 예수께서도 그와 함께 가셨습니다. 그들이 나뭇가지를 모으고 있을 때, 무서운 뱀 한 마리가 야고보의 손을 물었습니다.


    (2) 야고보는 쓰러져 죽어 가고 있었습니다. 어린 예수께서 야고보에게 달려가 물린 자리에 입김을 불자, 그 상처가 즉시 나았습니다. 그 짐승은 죽어 없어졌고, 야고보는 목숨을 건졌습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 하기오스 사바 259 사본에는 17장과 18장이 없습니다. 따라서 이어지는 두 장은 후대의 그리스어 사본들에 근거합니다.
    reason: 제공된 영어 증거의 사본 주석을 보존합니다. 이 주석은 다음의 두 장에 관한 전승 정보를 설명합니다.
lexical_decisions:
- source_word: grove
  choice: 숲
  rationale: 나뭇가지를 모을 수 있는 나무가 우거진 장소를 현대 한국어 독자가 자연스럽게 이해하도록 옮겼습니다.
- source_word: tie up sticks
  choice: 나뭇가지를 묶다
  rationale: 원문의 구체적인 행위를 유지하면서 한국어 어순에 맞게 표현했습니다.
- source_word: make bread
  choice: 빵을 만들다
  rationale: 나뭇가지가 빵을 굽는 연료였을 가능성이 있으나, 제공된 영어 증거가 단순히 ‘make bread’라고 하므로 그 모호성을 확대 해석하지 않았습니다.
- source_word: terrible snake
  choice: 무서운 뱀
  rationale: 크기나 독성을 본문에 없는 방식으로 특정하지 않고 위협적인 성격만 전달했습니다.
- source_word: blew on the bite
  choice: 물린 자리에 입김을 불다
  rationale: 상처 부위에 숨을 불어넣는 구체적 동작을 자연스러운 현대 한국어로 보존했습니다.
- source_word: the beast was destroyed
  choice: 그 짐승은 죽었다
  rationale: 문맥상 뱀의 죽음을 뜻하는 것으로 이해하되, 행위자를 예수로 명시하지 않아 원문의 수동적 표현이 지닌 여지를 보존했습니다.
- source_word: was saved
  choice: 목숨을 건졌다
  rationale: 죽어 가던 상황에서 살아났다는 문맥상의 의미를 자연스럽고 명확하게 전달했습니다.
theological_decisions:
- issue: 예수의 치유 행위와 뱀의 죽음 사이의 인과관계
  choice: 치유는 입김을 분 직후 일어난 것으로 서술하되, 뱀을 누가 또는 무엇이 죽였는지는 명시하지 않았습니다.
  alternative: 예수께서 뱀을 죽이셨다고 명시할 수 있습니다.
  rationale: 제공된 증거는 치유의 즉시성을 밝히지만 ‘the beast was destroyed’에서는 행위자를 밝히지 않으므로, 이를 신학적으로 보충하지 않았습니다.
- issue: James의 구원 표현
  choice: ‘목숨을 건졌습니다’로 옮겼습니다.
  alternative: ‘구원을 받았습니다’로 옮길 수 있습니다.
  rationale: 이 문맥은 영적 구원보다 뱀에 물려 죽을 위험에서 살아난 사건을 가리키므로, 불필요한 교리적 함의를 피했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 외경 서사에 어울리는 간결하고 품위 있는 문체를 유지했습니다. 직접적인 그리스어 원문 검토가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 번역 증거를 잠정적인 원문 증거로 삼았습니다.
