id: IGTH.016
reference: 'Infancy Gospel of Thomas — Chapter 16: Jesus Heals James’ Snakebite'
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: '(1) And James went into the grove to tie up sticks so that they might make bread. And Jesus went with him. And as they were gathering the sticks, a terrible snake bit James on his hand.


    (2) And he was sprawled out and dying. And the child Jesus ran to James and blew on the bite, and immediately the bite was healed. And the beast was destroyed, and James was saved.


    Hagios Saba 259 lacks Chapters 17 and 18. Consequently, the two chapters presented here are based on later Greek manuscripts.'
