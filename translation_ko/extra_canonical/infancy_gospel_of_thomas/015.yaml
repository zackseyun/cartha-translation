  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: ko
  text: '**유년기 도마복음 15장 — 세 번째 선생**


    (1) 며칠 뒤, 또 다른 선생이 예수의 아버지 요셉에게 말했습니다. “형제여, 이 아이를 학교에서 제게 맡겨 주십시오. 제가 다정한 말로 달래어 글자를 가르치겠습니다.”[a]


    요셉이 그에게 말했습니다. “용기가 있다면, 형제여, 이 아이를 무사히 데려가십시오.”[b]


    선생은 몹시 두렵고 걱정스러운 마음으로 아이의 손을 잡고 데려갔습니다. 그러나 아이는 기꺼이 따라갔습니다.


    (2) 예수께서는 학교에 들어가 강독대 위에 놓인 책 한 권을 보셨습니다. 그 책을 집어 드셨지만, 거기에 쓰인 것은 하나님의 율법에서 나온 것이 아니었으므로 읽지 않으셨습니다.[c] 그 대신 입을 열어 매우 놀라운 말씀을 하셨습니다. 맞은편에 앉아 있던 선생은 그 말씀을 무척 기쁘게 듣고, 더 말씀해 달라고 권했습니다. 그곳에 서 있던 사람들은 예수의 거룩한 말씀에 놀랐습니다.


    (3) 요셉은 이 선생도 더는 경험이 없는 사람이 아니며 고초를 겪었으리라고 생각하여, 서둘러 학교로 달려갔습니다.[d] 그러나 선생이 요셉에게 말했습니다. “형제여, 알아 두십시오. 제가 형제의 아이를 제자로 받아들이기는 했지만, 이 아이는 큰 은혜와 지혜로 가득합니다. 그러니 형제여, 아이를 무사히 집으로 데려가십시오.”[b]


    (4) 예수께서 선생에게 말씀하셨습니다. “당신이 올바르게 말하고 올바르게 증언했으니, 쓰러뜨림을 당한 사람도 당신 때문에 구원을 받을 것입니다.”[e] 그러자 그 선생도 즉시 구원을 받았습니다.[f] 요셉은 아이를 데리고 자기 집으로 돌아갔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “다정한 말로 달래어”는 아이를 부드러운 말로 설득한다는 뜻일 수 있으며, 직역하면 “아첨으로”입니다.
    reason: 원문 증거에 반영된 표현의 부정적·중립적 의미 범위를 보존하기 위해서입니다.
  - marker: b
    text: “무사히”로 옮긴 표현은 직역하면 “구원과 함께”이며, 안전하게 또는 온전히 데려가고 데려온다는 뜻일 수 있습니다.
    reason: 낯선 관용구의 문자적 의미와 문맥적 의미를 함께 알리기 위해서입니다.
  - marker: c
    text: 이 문장은 그 책 자체가 하나님의 율법이 아니었다는 뜻일 수도 있고, 거기에 쓰인 내용이 하나님의 율법에서 비롯되지 않았다는 뜻일 수도 있습니다.
    reason: 책과 내용 사이의 수식 관계에서 생기는 진정한 모호성을 보존하기 위해서입니다.
  - marker: d
    text: 이 문장은 전승상 의미가 불분명합니다. 요셉이 앞선 선생들의 일을 떠올리며, 이 선생도 예수 때문에 어떤 고초를 겪었으리라고 짐작했다는 뜻으로 이해할 수 있습니다.
    reason: 불확실한 영어 증언의 어색한 구문을 본문에서 과도하게 확정하지 않기 위해서입니다.
  - marker: e
    text: “쓰러뜨림을 당한 사람”이 누구인지, 또 어떤 타격을 가리키는지는 분명하지 않습니다.
    reason: 지시 대상과 사건을 특정 인물이나 앞선 장면으로 성급히 한정하지 않기 위해서입니다.
  - marker: f
    text: “구원을 받았습니다”는 문맥에 따라 안전해졌다, 회복되었다, 또는 구원받았다는 뜻을 포함할 수 있습니다.
    reason: 구원과 회복 사이의 의미 폭 및 4절의 반복을 드러내기 위해서입니다.
lexical_decisions:
- source_word: with flattery
  choice: 다정한 말로 달래어
  rationale: 아첨이라는 부정적 의미로만 좁히지 않으면서, 아이를 부드러운 말로 설득해 가르치겠다는 문맥을 자연스럽게 전달했습니다.
- source_word: letters
  choice: 글자
  rationale: 문학이나 편지가 아니라 기초 문자 교육을 가리키므로 ‘글자’로 옮겼습니다.
- source_word: with salvation
  choice: 무사히
  rationale: 이 대목에서는 데려가고 데려오는 행위와 결합하므로 안전과 온전함을 나타내는 관용적 의미가 자연스럽습니다. 다만 구원이라는 함의가 있을 수 있어 각주로 밝혔습니다.
- source_word: book
  choice: 책 한 권
  rationale: 두루마리인지 코덱스인지 확정하지 않고 일반적인 ‘책’으로 보존했습니다.
- source_word: lectern
  choice: 강독대
  rationale: 책을 놓고 읽는 받침대라는 기능을 간결하고 품위 있게 나타냅니다.
- source_word: the one struck down
  choice: 쓰러뜨림을 당한 사람
  rationale: 누구를 가리키는지와 타격의 성격을 확정하지 않고 수동적이고 모호한 표현을 유지했습니다.
- source_word: was saved
  choice: 구원을 받았습니다
  rationale: 안전해짐, 회복됨, 구원받음의 가능성을 섣불리 하나로 해소하지 않되, 4절의 신학적 문맥과 반복을 살려 본문에는 ‘구원’을 선택했습니다.
theological_decisions:
- issue: ‘하나님의 율법에서 나온 것이 아니다’의 의미
  choice: 본문의 판단을 그대로 진술
  alternative: 그 책이 율법서가 아니었다고 구체화
  rationale: 책의 정체나 예수께서 읽지 않으신 구체적 이유를 본문 이상으로 단정하지 않았습니다.
- issue: ‘쓰러뜨림을 당한 사람’의 지시 대상
  choice: 대상을 밝히지 않은 채 유지
  alternative: 앞서 벌을 받은 선생 또는 특정 인물로 명시
  rationale: 제공된 증거만으로 지시 대상을 확정할 수 없으므로 서사의 긴장과 모호성을 보존했습니다.
- issue: ‘구원을 받다’의 의미
  choice: 구원이라는 표현을 반복하여 유지
  alternative: 치유되다, 회복되다, 무사하다
  rationale: 동일 계열 표현의 반복을 살리고 영적·육체적·안전상의 의미 가능성을 열어 두었습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 ‘-했습니다’, 예수의 직접 발화는 존대 표현으로 처리하여 읽기 쉽고 품위 있게 구성했습니다. 제공 자료가 그리스어 사본 전통을 언급하지만 직접적인 그리스어 대조는 아직 이루어지지 않았으므로, 이번 초안은 공개 영역 영어 증언에 근거한 잠정 번역입니다. 불분명한 대목은 본문에서 함부로 매끈하게 고치지 않고 각주로 밝혔습니다.
