  - severity: medium
    issue: 3절 난해 구문의 추정성이 충분히 드러나지 않습니다.
    rationale: 영어 증언은 Joseph의 ‘suspecting’을 명시합니다. ‘고초를 겪었으리라고 생각하여’도 가능하나, ‘더는 경험이 없는 사람이 아니며’는 한국어에서 부자연스럽습니다. ‘더 이상 미숙하지 않고 고초를 겪었을 것이라고 짐작하여’로 옮기고 각주에서 전승의 난해함을 밝혀야 합니다.
