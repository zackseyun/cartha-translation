  issues:
  - severity: medium
    issue: 1절의 ‘with flattery’가 본문에서 완화되었습니다.
    rationale: ‘다정한 말로 달래어’는 가능한 문맥적 해석이지만, ‘아첨으로’라는 영어 증언의 직접적이고 다소 부정적인 표현을 본문에서 지웁니다. 각주로만 보완하기보다 본문에 ‘아첨하는 말로’를 두는 것이 더 충실합니다.
  - severity: low
