  terminology: ‘유월절’, ‘성전’, ‘율법학자들’, ‘바리새인들’, ‘태중의 열매’, ‘은혜’는 적절합니다. ‘교사들’과 별도로 나오는 ‘장로들’을 구별한 점도 좋습니다. ‘내 아버지의 처소’는 제공 증언의 place를 반영하되, 관련 표현의 의미 여지는 각주로 밝혀야 합니다.
