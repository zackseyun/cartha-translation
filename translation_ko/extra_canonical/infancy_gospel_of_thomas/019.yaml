base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/019.yaml
  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, according to custom. But as they were returning, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) Assuming that he was with the traveling company, they went a day’s journey and looked for him among their relatives whom they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple, sitting among the teachers, listening to them and questioning them. Those who heard him were amazed at how he questioned the elders and explained the main points of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, what have you done to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and the Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “Blessed are you, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom of praise and glory of virtue.”


    (5) Jesus got up and followed his mother from there, and he was obedient to his parents. She treasured all these things, pondering them in her heart.


    Jesus advanced in wisdom, maturity, and grace before God and humans. To whom be the [glory …].'
translation:
  language: ko
  text: '(1) 예수께서 열두 살이 되셨을 때, 그분의 부모는 관례에 따라 유월절을 지키러 예루살렘으로 갔습니다. 그런데 돌아오는 길에 예수께서는 예루살렘에 남아 계셨고, 부모는 그 사실을 알지 못했습니다.


    (2) 부모는 예수가 여행 일행 가운데 있으려니 생각하고 하룻길을 간 뒤, 아는 친족들 사이에서 그를 찾았습니다. 그러나 찾지 못하자 예루살렘으로 돌아가 그를 찾아다녔습니다.


    사흘 뒤에 그들은 성전에서 예수를 찾았습니다. 예수께서는 교사들 가운데 앉아 그들의 말을 듣기도 하고 그들에게 묻기도 하셨습니다. 그분의 말을 듣는 사람들은 그분이 장로들에게 묻고 율법의 요점과 예언자들의 수수께끼와 비유를 풀이하시는 것을 보고 놀랐습니다.


    (3) 어머니가 예수께 말했습니다. “얘야, 어찌하여 우리에게 이렇게 하였느냐? 보아라, 우리가 고통과 슬픔 속에서 너를 찾아다녔다.”


    예수께서 말씀하셨습니다. “왜 나를 찾으셨습니까? 내가 내 아버지의 처소에 있어야 한다는 것을 모르셨습니까?”[a]


    (4) 율법학자들과 바리새인들이 마리아에게 말했습니다. “당신이 이 아이의 어머니입니까?”


    마리아가 “그렇습니다” 하고 대답했습니다.


    그러자 그들이 마리아에게 말했습니다. “복되십니다. 주 하나님께서 당신 태중의 열매를 복되게 하셨기 때문입니다. 우리는 이토록 찬양받을 만한 지혜와 영광스러운 덕을 본 적이 없습니다.”[b]


    (5) 예수께서는 일어나 그곳에서 어머니를 따라가셨고 부모에게 순종하셨습니다. 어머니는 이 모든 일을 마음에 간직하고 곰곰이 생각했습니다.


    예수께서는 지혜와 성숙함이 자라고, 하나님과 사람들 앞에서 은혜를 더해 가셨습니다. 그분께 [영광이 …] 있기를 빕니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “내 아버지의 처소”는 ‘내 아버지께 속한 것들’ 또는 ‘내 아버지의 일’로 이해할 여지도 있습니다. 이 번역은 제공된 증거의 장소 표현을 따릅니다.
    reason: 원전 직접 검토가 보류된 상태에서 관련 표현의 genuine ambiguity를 보존하기 위해서입니다.
  - marker: b
    text: “찬양받을 만한 지혜와 영광스러운 덕”에 해당하는 문구는 표현이 이례적이며, 그리스어 사본 전통을 직접 대조하기 전까지는 잠정적 번역입니다.
    reason: 영어 증언 자체가 어색한 결합을 보이며, 의미를 매끄럽게 고쳐 확정하지 않기 위해서입니다.
  - marker: c
    text: 대괄호와 줄임표는 결말 부분이 훼손되었거나 복원되었을 가능성을 나타내는 제공 본문의 표지를 그대로 살린 것입니다.
    reason: 사본의 결락 또는 복원 신호를 독자에게 명시하기 위해서입니다.
lexical_decisions:
- source_word: traveling company
  choice: 여행 일행
  rationale: 함께 이동하는 순례 무리를 현대 독자가 자연스럽게 이해하도록 옮겼습니다.
- source_word: teachers
  choice: 교사들
  rationale: 성전에서 율법을 가르치던 이들을 가리키되, 본문이 별도로 언급하는 ‘율법학자들’과 동일시하지 않도록 일반적인 표현을 유지했습니다.
- source_word: elders
  choice: 장로들
  rationale: 연장자이자 권위 있는 이들을 가리키는 전승의 표현을 그대로 보존했습니다.
- source_word: main points of the law
  choice: 율법의 요점
  rationale: ‘핵심 내용’이라는 의미를 간결하고 자연스럽게 전달했습니다.
- source_word: maturity
  choice: 성숙함
  rationale: 신체적 크기나 연령만으로 한정하지 않고 성장·성숙의 폭넓은 뜻을 보존했습니다.
- source_word: grace
  choice: 은혜
  rationale: 하나님의 호의와 사람들 앞에서의 호감을 함께 포괄할 수 있는 전통적이면서 이해하기 쉬운 용어를 택했습니다.
theological_decisions:
- issue: ‘내 아버지의 place’의 의미
  choice: 내 아버지의 처소
  alternative: 내 아버지의 일 / 내 아버지께 속한 것들
  rationale: 제공된 증거가 장소 표현을 지지하므로 장소성을 살렸습니다. 다만 관련 전승의 그리스어 표현은 의미상 여지가 있을 수 있어 각주로 대안을 밝혔습니다.
- issue: ‘fruit of your womb’의 표현
  choice: 당신 태중의 열매
  alternative: 당신이 낳은 아들
  rationale: 셈어적·성서적 표현의 문학성과 축복 선언의 울림을 보존하고, 해석적으로 ‘아들’로 풀어 쓰지 않았습니다.
- issue: 마지막 송영의 대상
  choice: 그분께
  alternative: 예수께 / 하나님께
  rationale: 선행 문장의 예수를 자연스러운 지시 대상으로 반영하되, 훼손되거나 복원된 결구 때문에 원문의 상태가 불확실함을 각주로 표시했습니다.
