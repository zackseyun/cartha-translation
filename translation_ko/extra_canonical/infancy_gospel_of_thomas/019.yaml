  register: 표준 한국어의 현대적 합쇼체를 사용했습니다. 서술은 존중어를 적용하되 지나치게 고어적인 어휘를 피했고, 직접 인용에서는 부모가 아이에게 말하는 자연스러운 높임 관계와 예수가 부모에게 답하는 공손한 말투를 구분했습니다. 그리스어 원문 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언을 토대로 한 잠정 출판 초안입니다.
