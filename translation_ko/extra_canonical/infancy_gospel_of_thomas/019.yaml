    rationale: 원문 증언은 지혜·성숙·은혜 모두에서 예수가 advanced했다고 합니다. ‘지혜와 성숙함이 자라고, 은혜를 더해 가셨습니다’보다 세 항목을 함께 ‘자라 가셨습니다’로 처리하는 것이 충실합니다.
  - severity: medium
