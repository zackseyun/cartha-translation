translation:
  language: ko
  text: '(1) 이런 일들이 있은 뒤, 요셉의 이웃에 사는 어떤 아기가 병들어 죽었습니다. 아기의 어머니는 몹시 울었습니다.


    예수께서는 큰 슬픔과 소란이 일어난 것을 들으시고 급히 달려가셨습니다. 죽은 아기를 보시고 그 가슴에 손을 대며 말씀하셨습니다. “아기야, 내가 네게 말한다. 죽어 있지 말고 살아서 네 어머니와 함께 있어라.”


    그러자 아기는 곧 눈을 뜨고 웃었습니다. 예수께서 그 어머니에게 말씀하셨습니다. “네 아이를 안아 젖을 먹이고, 나를 기억하여라.”


    (2) 그곳에 서 있던 무리는 놀라서 말했습니다. “참으로 이 아이는 신이나 천사다. 그가 하는 말은 모두 그대로 이루어지기 때문이다!”[a]


    예수께서는 다시 그곳을 떠나 아이들과 함께 노셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 말은 그곳에 있던 무리가 놀라서 한 말이며, 본문 서술자가 직접 내리는 교리적 단정은 아닙니다. 이 번역은 제공된 영어 증언을 바탕으로 한 잠정 번역이며, 그리스어 사본 전통과의 직접 대조가 필요합니다.
    reason: ‘신이나 천사’라는 신학적으로 민감한 발언의 화자와 잠정적 자료 기반을 밝혀, 본문의 긴장을 보존하고 과도한 교리화를 피하기 위해서입니다.
lexical_decisions:
- source_word: baby
  choice: 아기
  rationale: 문맥상 젖을 먹는 매우 어린아이를 가리키므로 현대 한국어의 자연스럽고 정확한 표현을 택했습니다.
- source_word: touched his chest
  choice: 그 가슴에 손을 대며
  rationale: 단순한 접촉 행위를 자연스럽게 나타내면서 원문의 신체 부위를 보존했습니다.
- source_word: looked up
  choice: 눈을 뜨고
  rationale: 죽어 있던 아기가 되살아난 문맥에서 영어 증언의 표현이 뜻하는 반응을 자연스럽게 옮겼습니다. 다만 그리스어 원문 대조가 아직 이루어지지 않아 잠정적입니다.
- source_word: remember me
  choice: 나를 기억하여라
  rationale: 기억, 감사, 증언 등의 의미를 임의로 구체화하지 않고 표현 자체의 열린 뜻을 보존했습니다.
- source_word: his every word becomes a deed
  choice: 그가 하는 말은 모두 그대로 이루어지기 때문이다
  rationale: 말이 실제 사건으로 성취된다는 뜻을 현대 한국어로 분명하고 자연스럽게 전달했습니다.
- source_word: played with the children
  choice: 아이들과 함께 노셨습니다
  rationale: 예수의 어린아이로서의 행동을 단순하고 자연스럽게 보존했습니다.
theological_decisions:
- issue: 무리가 예수를 ‘a god or an angel’이라고 부르는 표현
  choice: 이 아이는 신이나 천사다
  alternative: 이 아이는 하나님이거나 천사다
  rationale: 부정관사가 있는 영어 증언의 서술과 등장인물들의 놀란 추정을 보존하고, 이를 정통 교리 진술로 바꾸지 않았습니다. ‘하나님’은 유일신에 대한 고유한 호칭으로 오해될 가능성이 있어 ‘신’을 택했습니다.
- issue: 아기를 살리는 명령의 표현
  choice: 죽어 있지 말고 살아서 네 어머니와 함께 있어라
  alternative: 죽지 말고 살아서 네 어머니와 함께 있어라
  rationale: 아기가 이미 죽었다는 앞 문맥과 ‘don’t die’의 표면적 표현 사이의 긴장을 살리기 위해 현재 상태를 가리키는 말로 옮겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 ‘-습니다’, 예수의 직접 명령은 자연스러운 해라체로 처리했습니다. 제공 자료가 그리스어 원문 자체가 아니라 공개 영어 번역 증언이며 원어 검토가 보류된 상태이므로, 어휘 선택과 각주는 잠정적으로 구성했습니다.
