    rationale: 군중 발화라는 점은 본문 자체에서 분명하며, 각주에 번역 자료의 잠정성까지 함께 넣는 것은 본문 주석으로서 불필요합니다.
  revised_text: '(1) 이런 일들이 있은 뒤, 요셉이 사는 동네에서 어떤 아기가 병들어 죽었습니다. 그 어머니는 몹시 울었습니다.


    그러나 예수께서는 큰 슬픔과 소란이 있다는 말을 들으시고 급히 달려가셨습니다. 그 아이가 죽어 있는 것을 발견하시고 가슴을 만지시며 말씀하셨습니다. “아기야, 내가 네게 말한다. 죽지 말고 살아서 네 어머니와 함께 있어라.”


    그러자 그 아기는 곧 고개를 들고 웃었습니다. 예수께서 그 어머니에게 말씀하셨습니다. “네 아이를 데려가 젖을 먹이고, 나를 기억하여라.”


    (2) 그곳에 서 있던 무리는 놀라 말했습니다. “참으로 이 아이는 신 또는 천사다. 그가 하는 모든 말이 이루어지기 때문이다!”


    예수께서는 다시 떠나 아이들과 함께 노셨습니다.'
