  naturalness: 합쇼체 서술과 직접화법의 대비는 자연스럽습니다. ‘비난하며’와 ‘그들은’을 사용하면 현대 표준 한국어에서 더 자연스럽고 원문의 지시 관계도 유지됩니다. 예수의 명령은 현대어로 ‘말해라’라고 하되, 서사 전체의 격식은 유지할 수 있습니다.
  terminology: ‘시신’, ‘잠들어라’, ‘경배했습니다’는 공급된 영어 증언의 의미 범위 안에서 적절합니다. ‘선생님’은 sir의 비신학적으로 확정되지 않은 존칭을 무리 없이 반영합니다. ‘고발’은 법률 용어성이 강하므로 ‘비난’으로 조정합니다.
  issues:
  - severity: medium
    issue: ‘accused’를 ‘고발하며’로 번역함
    rationale: ‘고발하다’는 보통 수사기관 등에 범죄 사실을 신고하는 법률적 행위를 뜻합니다. 공급된 증언의 accused는 부모가 예수께 책임을 돌리며 비난한 행위를 말하므로 ‘비난하며’가 의미 범위에 더 잘 맞습니다.
  - severity: low
    issue: ‘they saw’를 ‘사람들은 이것을 보고’로 특정함
    rationale: 원문은 ‘they’라고만 하여 앞선 집단을 명시적으로 확대하지 않습니다. ‘그들은’으로 옮겨 지시 대상의 여지를 보존하는 것이 더 충실합니다.
  - severity: low
    issue: 예수의 명령 ‘말하여라’의 문체가 다소 고어적임
