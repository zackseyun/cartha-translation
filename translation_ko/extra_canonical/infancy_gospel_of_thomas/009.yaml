base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/009.yaml
  text: '(1) Again, after many days, Jesus was playing with other children on a certain roof of an upstairs room. One of the children fell and died. When the other children saw this, they went into their houses and left Jesus alone.


    (2) The parents of the child who had died came and accused Jesus, saying, “You pushed our child down!”


    But Jesus said, “I didn’t push him down.”


    (3) They were raging and shouting. Jesus came down from the roof, stood beside the body, and cried out in a loud voice, saying, “Zeno, Zeno”—because this was his name—“rise and say whether I pushed you down.”


    He rose and said, “No, sir.”


    When they saw this, they were amazed.


    Again Jesus said to him, “Fall asleep!”


    The child’s parents praised God and worshiped the child Jesus.'
translation:
  language: ko
  text: '(1) 또 여러 날이 지난 뒤, 예수께서 어느 이층방의 지붕 위에서 다른 아이들과 함께 놀고 계셨습니다. 그런데 아이들 가운데 하나가 떨어져 죽었습니다. 다른 아이들은 이것을 보고 자기 집으로 가 버렸고, 예수만 홀로 남겨 두었습니다.


    (2) 죽은 아이의 부모가 와서 예수를 고발하며 말했습니다. “네가 우리 아이를 밀어 떨어뜨렸다!”


    그러나 예수께서는 “나는 그 아이를 밀어 떨어뜨리지 않았습니다”라고 말씀하셨습니다.


    (3) 그들은 격분하여 소리를 질렀습니다. 예수께서는 지붕에서 내려와 시신 곁에 서서 큰 소리로 외치셨습니다. “제노야, 제노야”—이것이 그 아이의 이름이었습니다—“일어나서 내가 너를 밀어 떨어뜨렸는지 말하여라.”


    그러자 그 아이가 일어나 말했습니다. “아닙니다, 선생님.”[a]


    사람들은 이것을 보고 놀랐습니다.


    예수께서 다시 그 아이에게 “잠들어라!” 하고 말씀하셨습니다.[b]


    그러자 그 아이의 부모는 하나님을 찬양하고 어린 예수께 경배했습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선생님’으로 옮긴 말은 공급된 영어 증언에서 ‘sir’입니다. ‘주님’으로도 이해될 가능성은 직접적인 그리스어 원문 검토 뒤에 판단해야 합니다.
    reason: 호칭의 신학적 의미를 성급히 확정하지 않기 위해서입니다.
  - marker: b
    text: ‘잠들어라’는 죽음을 가리키는 완곡한 표현으로 보입니다. 본문은 그 아이가 다시 죽었다고 직접 풀어 말하지 않습니다.
    reason: 원문의 표현과 서사적 여운을 보존하기 위해서입니다.
  - marker: c
    text: ‘경배했습니다’에 해당하는 동사의 정확한 뉘앙스는 그리스어 사본 전통을 직접 검토할 필요가 있습니다. 문맥에 따라 종교적 경배 또는 깊은 존경을 나타낼 수 있습니다.
    reason: 공급 자료가 영어 증언에 기초하며 그리스어 원문 검토가 아직 이루어지지 않았기 때문입니다.
lexical_decisions:
- source_word: roof of an upstairs room
  choice: 이층방의 지붕 위
  rationale: 공급된 영어 증언의 공간적 표현을 보존하면서 현대 한국어로 자연스럽게 나타냈습니다.
- source_word: accused
  choice: 고발하며
  rationale: 단순히 비난했다기보다 예수에게 죽음의 책임을 공식적으로 돌리는 장면의 강도를 살렸습니다.
- source_word: body
  choice: 시신
  rationale: 그 아이가 이미 죽었다는 문맥을 분명하고 품위 있게 전달합니다.
- source_word: sir
  choice: 선생님
  rationale: 존칭임은 드러내되 ‘주님’으로 번역하여 신학적 의미를 미리 확정하지 않았습니다.
- source_word: Fall asleep
  choice: 잠들어라
  rationale: 죽음을 완곡하게 나타내는 원문의 표현을 그대로 보존하여, ‘다시 죽어라’로 의미를 풀어 확정하지 않았습니다.
- source_word: worshipped
  choice: 경배했습니다
  rationale: 단순한 존경이나 절보다 강한 종교적·경외적 행위를 나타내는 표현을 유지했습니다.
theological_decisions:
- issue: 부활한 아이가 예수를 부르는 호칭
  choice: 선생님
  alternative: 주님
  rationale: 공급된 증언의 ‘sir’는 존칭과 더 높은 칭호 사이의 여지가 있으므로, 예수의 신적 지위를 이 한마디에 과도하게 주입하지 않는 표현을 택했습니다.
- issue: 예수가 아이에게 다시 ‘잠들라’고 한 명령
  choice: 비유적 표현을 문자적으로 보존
  alternative: 다시 죽어라
  rationale: 본문이 죽음을 잠으로 표현하는 신학적·서사적 긴장을 그대로 남기기 위해 의미를 명시적으로 해설하지 않았습니다.
- issue: 아이의 부모가 어린 예수에게 한 행위
  choice: 경배했습니다
  alternative: 절했습니다
  rationale: 증언의 ‘worshipped’가 지닌 강한 의미를 약화하지 않았으나, 행위의 완전한 신학적 성격은 각주에서 원어 검토가 필요함을 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체로 옮겼습니다. 서술에서는 예수께 존대를 사용하되, 고발하는 부모의 직접화법은 감정과 상황에 맞게 반말로 보존했습니다. 현재 초안은 공급된 공용 영어 번역 증언에 근거한 잠정 번역이며, 그리스어 사본 전통에 대한 직접 검토가 필요합니다.
