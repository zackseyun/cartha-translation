  naturalness: 서술과 대화는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽게 정리했습니다. 난해한 발화는 의미를 덧붙이지 않기 위해 다소 절제된 문장으로 유지하되, 불필요하게 부자 관계를 암시하는 호칭은 제거했습니다.
  terminology: ‘wise words’는 경전적 존칭 뉘앙스를 더할 수 있는 ‘말씀’ 대신 ‘지혜로운 말’로 옮겼습니다. ‘scourge’는 신체적 처벌의 강도를 보존하여 ‘매질하다’로, ‘subdued’는 해석을 좁히지 않도록 ‘굴복한 상태’로 옮겼습니다.
  issues:
  - severity: medium
    issue: 원문 증언에 없는 ‘아버지’ 호칭의 삽입
    rationale: 영어 증언은 Joseph과 child/you만을 제시하며, 대화 안에서 요셉을 ‘father’라고 부르지 않습니다. 이 호칭은 관계와 경어의 방향을 본문보다 구체화합니다.
  - severity: medium
    issue: ‘raised’의 수동성과 난해성이 약화됨
    rationale: ‘그들은 다시 일어나지 못할 것’은 능동·자동사적 회복으로 읽히기 쉽습니다. 제공된 증언의 수동형 ‘won’t be raised’와 그 의미의 불확실성을 보존하는 편이 안전합니다.
  - severity: low
    issue: 마지막 발화의 문장 관계를 다소 해석적으로 연결함
    rationale: 영어 증언의 ‘You haven’t clearly seen me, why I’m yours’는 구문 관계가 불분명합니다. 이를 완결된 인과·인식 문장으로 정리하지 않고, 불명료성을 주석과 함께 남겨야 합니다.
