translation:
  language: ko
  text: '**유년기 도마복음 5장 — 요셉이 예수와 맞서다**


    (1) 요셉이 예수께 말했습니다. “어찌하여 네가 그런 말을 해서, 사람들이 고통을 당하고 우리를 미워하게 하느냐?”


    그러자 아이가 요셉에게 말했습니다. “아버지는 지혜로운 말씀을 아시니, 그 말씀이 어디서 왔는지도 모르지 않으실 것입니다. 그 말씀은 다섯 살 된 아이를 두고 한 말입니다.[a] 그들은 다시 일어나지 못할 것이고, 이들은 벌을 받을 것입니다.[b]”


    그러자 곧바로 예수를 고발하던 사람들이 눈이 멀었습니다.


    (2) 요셉은 예수의 귀를 붙잡고 세게 잡아당겼습니다.


    (3) 예수께서 요셉에게 말했습니다. “아버지가 나를 찾고 발견하는 것으로 충분합니다. 그 이상으로, 타고난 무지를 떠안은 채 나를 매질해서는 안 됩니다.[c] 아버지는 나를 분명히 보지 못했고, 내가 어째서 아버지의 것인지도 알지 못했습니다.[d] 보십시오! 나는 아버지 앞에 굴복해 있습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그 말씀은 다섯 살 된 아이를 두고 한 말입니다”에 해당하는 대목은 전승상 난해합니다. 제공된 영어 증언의 문구를 잠정적으로 옮겼으며, 그 말의 화자와 정확한 지시 대상은 분명하지 않습니다.
    reason: 난해한 전승 문구와 직접 그리스어 검토가 아직 이루어지지 않았음을 알리기 위해서입니다.
  - marker: b
    text: “그들”과 “이들”이 각각 누구를 가리키는지는 분명하지 않습니다. 서로 다른 지시 표현을 그대로 구별해 옮겼습니다.
    reason: 모호한 대명사의 지시 대상을 번역자가 임의로 확정하지 않기 위해서입니다.
  - marker: c
    text: “타고난 무지를 떠안은 채”에 해당하는 문장은 문법과 의미가 매우 불확실합니다. 누가 그 무지를 지녔는지도 명확하지 않습니다.
    reason: 난해한 구문을 매끄럽게 해석하여 의미를 고정하는 일을 피하기 위해서입니다.
  - marker: d
    text: “아버지는 나를 분명히 보지 못했고, 내가 어째서 아버지의 것인지도 알지 못했습니다”에 해당하는 원문 증언은 문장 관계가 불분명합니다. “보다”가 문자적 인식인지 이해를 뜻하는지도 확정하기 어렵습니다.
    reason: 예수와 요셉의 관계에 관한 신학적 의미를 과도하게 명료화하지 않기 위해서입니다.
lexical_decisions:
- source_word: wise words
  choice: 지혜로운 말씀
  rationale: 지혜와 발언이라는 두 요소를 보존하면서도 고대 종교 문헌에 어울리는 자연스럽고 품위 있는 표현을 택했습니다.
- source_word: raised
  choice: 다시 일어나다
  rationale: 죽음에서 살아나는 것인지 쓰러진 상태에서 회복되는 것인지 확정하지 않고 원문의 공간적·생명적 중의성을 남겼습니다.
- source_word: scourge
  choice: 매질하다
  rationale: 단순히 꾸짖는 것보다 강한 신체적 징벌을 나타내는 말로 옮겼습니다.
- source_word: subdued
  choice: 굴복해 있다
  rationale: 복종, 제압, 낮아짐 가운데 어느 하나로 의미를 좁히지 않으면서 문맥의 긴장을 보존했습니다.
theological_decisions:
- issue: 예수의 정체와 요셉에게 속한다는 말
  choice: “내가 어째서 아버지의 것인지”라는 난해한 소유 표현을 유지함
  alternative: “내가 정말 아버지의 아들인지” 또는 “내가 누구인지”로 해석하여 풀어 씀
  rationale: 제공된 증거만으로 생물학적 부자 관계나 신적 정체성에 관한 특정 해석을 확정할 수 없으므로 신학적으로 명료화하지 않았습니다.
- issue: “다시 일어나지 못한다”의 의미
  choice: 회복과 부활 가능성을 모두 열어 둠
  alternative: “되살아나지 못할 것이다”로 번역함
  rationale: 영어 증언의 raised가 해당 장면의 즉각적인 회복과 죽음 이후의 부활을 모두 연상시킬 수 있어 한 의미로 한정하지 않았습니다.
- issue: 고발자들이 눈먼 사건의 인과성
  choice: 서술된 시간적 연속만 직접 표현함
  alternative: 예수가 고발자들을 눈멀게 했다고 명시함
  rationale: 본문은 사건이 즉시 일어났다고 진술하지만 행위 주체를 명시하지 않으므로 이를 보충하지 않았습니다.
translation_notes:
  register: 서술은 현대 표준어의 격식 있는 합쇼체로 옮겼습니다. 대화에서는 부자 관계가 드러나도록 요셉은 아이에게 하게체에 가까운 질문형을, 예수는 요셉에게 공손한 표현을 사용했습니다. 다만 이 초안은 제공된 공용 영어 증언에 근거한 잠정 번역이며, 그리스어 사본 전통에 대한 직접 검토가 필요합니다.
