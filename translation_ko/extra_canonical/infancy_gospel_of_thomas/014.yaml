base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: ko
  text: '(1) 요셉은 예수의 지혜와 총명을 보았습니다. 그는 예수가 글자를 모르는 채로 있기를 원하지 않았으므로, 예수를 다른 선생에게 맡겼습니다.


    그 선생은 예수에게 알파벳을 써 주고 말했습니다. “알파라고 말해 보아라.”


    (2) 아이가 말했습니다. “먼저 선생님이 베타가 무엇인지 말씀해 주시면, 제가 알파가 무엇인지 말씀드리겠습니다.”


    그러자 선생은 화가 나서 아이를 때렸습니다. 예수가 그를 저주하자, 선생은 쓰러져 죽었습니다.


    (3) 아이는 부모가 있는 집으로 들어갔습니다. 요셉은 예수의 어머니를 불러, 예수를 집 밖으로 내보내지 말라고 명했습니다. 예수를 화나게 하는 사람들이 죽지 않게 하려는 것이었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 그리스어 사본 전통에 대한 직접 검토가 아직 필요하며, 특히 ‘글자’, ‘화나게 하는’, 마지막 목적절의 표현은 원문 검토에 따라 달라질 수 있습니다.
    reason: 제공 자료가 그리스어 원문 자체가 아니라 영어 번역 증언이며, 직접적인 원어 검토가 보류되어 있다는 본문 비평상의 한계를 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: letters
  choice: 글자
  rationale: 문맥상 문자 교육을 뜻하므로 현대 독자가 자연스럽게 이해할 수 있는 ‘글자’로 옮겼습니다. 이어지는 알파와 베타 문답과도 잘 연결됩니다.
- source_word: wisdom and understanding
  choice: 지혜와 총명
  rationale: 두 개념을 합치지 않고 각각 보존하면서도 자연스럽고 품위 있는 한국어 표현을 택했습니다.
- source_word: cursed
  choice: 저주하다
  rationale: 행위의 강도와 서사의 불편한 긴장을 완화하지 않고 그대로 보존했습니다.
- source_word: provoke
  choice: 화나게 하다
  rationale: 공급된 영어 증언의 의미를 평이하고 직접적인 현대 한국어로 전달했습니다. 그리스어 원문 검토에 따라 ‘격분시키다’ 또는 ‘자극하다’로 조정될 수 있습니다.
theological_decisions:
- issue: 예수의 저주와 선생의 죽음 사이의 인과관계
  choice: ‘저주하자 … 쓰러져 죽었습니다’로 직접적인 서사적 연속성을 보존함
  alternative: 죽음을 저주와 느슨하게 연결하거나 우연처럼 표현함
  rationale: 증언 본문의 거칠고 긴장된 묘사를 해소하거나 완화하지 않았습니다.
- issue: 마지막 목적절의 의미
  choice: ‘예수를 화나게 하는 사람들이 죽지 않게 하려는 것이었습니다’
  alternative: ‘아무도 예수를 화나게 하여 죽는 일이 없도록’
  rationale: ‘those who provoke him’이 죽음의 대상이라는 문장 구조를 보존하되, 한국어로 자연스럽게 표현했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 간결하고 품위 있게 유지하고, 대화에서는 아이가 선생에게 ‘선생님’과 존댓말을 사용하도록 하여 자연스러운 한국어 관계 표현을 살렸습니다. 내용의 신학적·도덕적 불편함은 완화하지 않았습니다.
