base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: ko
  text: '(1) 어린 예수께서 웃으며 말씀하셨습니다. “이제 열매 맺지 못하는 이는 열매를 맺고, 눈먼 이는 보며, 마음이 어리석은 이들은 깨닫기를 바랍니다. 곧 내가 위로부터 여기에 온 것은 아래에 있는 이들을 건져 내어 위로 부르기 위함이며, 나를 여러분에게 보내신 분이 내게 명령하신 그대로입니다.”


    (2) 그러자 곧 그의 저주 아래 놓였던 이들이 모두 구원을 받았습니다. 그때부터는 아무도 감히 그를 자극하지 못했습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the barren
  choice: 열매 맺지 못하는 이
  rationale: 문맥의 비유적 표현을 살리면서도 한국어에서 성별이나 불임만을 지나치게 특정하지 않도록 옮겼습니다.
- source_word: foolish in heart
  choice: 마음이 어리석은 이들
  rationale: 고대의 ‘마음’이 이해와 판단의 중심을 가리키는 표현임을 보존했습니다.
- source_word: deliver
  choice: 건져 내다
  rationale: 위험이나 억압에서 구출한다는 뜻을 자연스럽게 나타내되, 뒤의 ‘위로 부르다’와 구별했습니다.
- source_word: call them up
  choice: 위로 부르다
  rationale: ‘위로부터/아래에 있는’이라는 공간적 대조를 유지하고 해석적으로 풀어 쓰지 않았습니다.
- source_word: saved
  choice: 구원을 받다
  rationale: 저주에서 풀려난 사건을 나타내는 동시에 원문의 구원론적 울림을 보존했습니다.
- source_word: provoke
  choice: 자극하다
  rationale: 화를 돋우거나 맞서게 한다는 의미의 폭을 유지했습니다.
theological_decisions:
- issue: 위로부터 온 예수의 기원과 사명
  choice: ‘위로부터 여기에 온 것’과 ‘아래에 있는 이들을 건져 내어 위로 부르는 것’을 그대로 병치했습니다.
  alternative: ‘하늘에서 내려왔다’ 또는 ‘사람들을 천국으로 인도한다’로 명시하기
  rationale: 본문이 지닌 위/아래의 상징성과 모호성을 보존하고 후대의 교리적 설명을 덧붙이지 않았습니다.
- issue: 예수를 보낸 분의 정체
  choice: ‘나를 여러분에게 보내신 분’으로 옮겼습니다.
  alternative: ‘하나님’ 또는 ‘아버지’로 명시하기
  rationale: 제시된 증거 본문이 보내신 이를 직접 특정하지 않으므로 그대로 두었습니다.
- issue: 저주받은 이들의 회복
  choice: ‘그의 저주 아래 놓였던 이들이 모두 구원을 받았다’로 옮겼습니다.
  alternative: ‘저주가 모두 풀렸다’로 축소하기
  rationale: 원문의 ‘saved’가 지닌 더 넓은 의미를 보존하되, 구체적인 회복 방식은 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 예수의 직접 발화는 권위와 소망의 뉘앙스를 함께 살리기 위해 ‘바랍니다’와 서술형 표현을 조합했습니다. 다만 직접 그리스어 대조가 아직 이루어지지 않았으므로, 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다.
