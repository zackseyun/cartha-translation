    rationale: “아버지 쪽 끝을 나란히 맞추어 놓으세요”는 ‘맞추다’와 ‘나란히 놓다’의 관계가 흐립니다. 두 판자의 아버지 쪽 끝을 맞추어 나란히 놓으라고 하면 작업 지시가 명료해집니다.
