base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/013.yaml
  text: '(1) Now Jesus was about eight years old. His father was a carpenter who made plows and yokes. He took a bed from a certain rich man so that he could make it very large and suitable. But one of the beams, called the (…), was shorter; it was not the (right) length. Joseph was distressed and did not know what to do.


    The child came to his father and said, “Set down the two boards and line them up at your end.”


    (2) Joseph did just as Jesus told him. The child Jesus stood at the other end, took hold of the short board, and stretched it. He made it equal in length to the other board.


    Then he said to his father, “Do not be distressed, but make whatever you want to.”


    Joseph embraced and kissed him, saying, “Blessed am I that God gave this child to me.”'
translation:
  language: ko
  text: '(1) 그때 예수는 여덟 살쯤이었습니다. 그의 아버지는 쟁기와 멍에를 만드는 목수였습니다. 그는 어떤 부자에게서 침상 하나를 받아, 그것을 아주 크고 알맞게 만들려고 했습니다. 그런데 (…)라고 부르는 들보 하나가 짧아서 길이가 맞지 않았습니다.[a] 요셉은 근심하며 어찌해야 할지 몰랐습니다.


    아이가 아버지에게 와서 말했습니다. “두 판자를 내려놓고 아버지 쪽 끝을 나란히 맞추어 놓으세요.”


    (2) 요셉은 아이가 말한 대로 했습니다. 아이 예수는 반대쪽 끝에 서서 짧은 판자를 붙잡아 늘였습니다. 그리하여 그 판자를 다른 판자와 같은 길이로 만들었습니다.


    그러고 나서 아버지에게 말했습니다. “근심하지 마시고, 원하시는 대로 만드세요.”


    요셉은 아이를 끌어안고 입을 맞추며 말했습니다. “하나님께서 이 아이를 내게 주셨으니, 나는 복된 사람입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 명칭은 전승에서 불분명하거나 본문이 손상되어 있어 확정할 수 없습니다. 괄호와 생략표는 그 미해결 상태를 나타냅니다.
    reason: 알 수 없는 목재 부재의 명칭을 추측하여 복원하지 않고 본문 전승의 불확실성을 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: carpenter
  choice: 목수
  rationale: 쟁기와 멍에를 제작하는 장인의 직업을 현대 한국어에서 가장 자연스럽고 넓게 전달합니다.
- source_word: bed
  choice: 침상
  rationale: 현대의 완제품 ‘침대’보다 고대의 목제 누울 자리를 가리키는 문맥에 어울리며, 시대적 분위기도 지나치게 고어적이지 않게 보존합니다.
- source_word: beams / boards
  choice: 들보 / 판자
  rationale: 제공된 영어 증거문이 처음에는 구조 부재를 ‘beam’, 작업 장면에서는 ‘boards’라고 달리 부르므로 그 구별을 그대로 반영했습니다. 그리스어 원문 대조 전에는 둘을 임의로 하나의 용어로 통일하지 않았습니다.
- source_word: stretched
  choice: 늘였습니다
  rationale: 예수가 짧은 판자의 실제 길이를 기적적으로 늘인 서술을 비유로 약화하지 않고 직접적으로 옮겼습니다.
- source_word: Blessed am I
  choice: 나는 복된 사람입니다
  rationale: 요셉의 감탄과 자신이 복을 받았다는 진술을 자연스럽고 존엄한 현대 한국어로 표현했습니다.
theological_decisions:
- issue: 예수가 판자를 늘인 사건의 성격
  choice: 물리적으로 길이를 늘인 기적으로 읽히는 직접적 서술을 유지했습니다.
  alternative: ‘잡아당겼다’처럼 결과의 기적성을 흐리게 옮길 수 있습니다.
  rationale: 증거문은 짧은 판자를 늘여 다른 판자와 같게 만들었다고 명시하므로 사건을 합리화하거나 완화하지 않았습니다.
- issue: ‘하나님께서 이 아이를 내게 주셨다’의 신적 행위
  choice: 하나님이 아이를 요셉에게 주셨다는 직접 표현을 보존했습니다.
  alternative: ‘맡기셨다’ 또는 ‘선물로 주셨다’로 해석을 덧붙일 수 있습니다.
  rationale: ‘주셨다’는 원 증거문의 단순한 표현과 그 신학적 여지를 그대로 남기며, 양육 위탁이나 선물이라는 특정 해석을 강요하지 않습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 아이가 아버지에게 하는 말은 한국어의 관계 예절에 맞게 존댓말로 옮겼습니다. 현재 초안은 제공된 공용 영어 증거문에 근거하며 그리스어 원문 대조가 아직 이루어지지 않았으므로, 불명확한 부재 명칭과 ‘들보/판자’의 용어 관계는 확정하지 않았습니다.
