translation:
  language: ko
  text: '하기오스 사바 259 사본에서는 이 대목이 16장 뒤에 나옵니다.[a]


    (1) 또 어떤 젊은이가 나무를 같은 크기로 쪼개고 있었습니다. 그러다가 발바닥을 베어 피를 다 흘리고 죽었습니다.


    (2) 소동이 일어나자 예수께서 그곳으로 달려가셨습니다. 예수께서는 사람들 사이를 헤치고 들어가 다친 발을 붙잡으셨고, 그 발은 곧 나았습니다. 그리고 그 젊은이에게 말씀하셨습니다. “가서 네 나무를 쪼개어라.”


    (3) 무리는 이것을 보고 놀라며 말했습니다. “그가 많은 생명을 죽음에서 구했으니, 살아 있는 동안 내내 모든 이를 계속 구할 것이다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 하기오스 사바 259 사본에서는 이 대목의 위치가 현재의 장 순서와 달리 16장 뒤입니다.
    reason: 사본상 본문 위치의 차이는 본문 전승을 이해하는 데 필요한 정보입니다.
  - marker: b
    text: 여기서 ‘생명’으로 옮긴 말은 영어 증언에서 ‘souls’이며, 이 문맥에서는 죽음에서 구원받은 사람들을 가리킬 수 있습니다. 이 번역은 그리스어 원문 대조 전의 잠정안입니다.
    reason: 직접적인 그리스어 원문 검토가 보류된 상태에서 의미 범위와 번역의 잠정성을 투명하게 밝혔습니다.
lexical_decisions:
- source_word: splitting wood into equal parts
  choice: 나무를 같은 크기로 쪼개고 있었습니다
  rationale: 작업의 동작과 각 조각을 고르게 만드는 뜻을 현대 한국어로 명확하고 자연스럽게 전달했습니다.
- source_word: the bottom of his foot
  choice: 발바닥
  rationale: 영어 증언의 해부학적 표현을 간결하고 정확한 표준 한국어로 옮겼습니다.
- source_word: bled out
  choice: 피를 다 흘리고
  rationale: 과다 출혈로 죽음에 이르렀다는 뜻을 과도한 의학 용어 없이 전달했습니다.
- source_word: Forcing his way through the crowd
  choice: 사람들 사이를 헤치고 들어가
  rationale: 군중을 통과하기 위해 길을 내며 나아가는 동작을 자연스럽게 표현했습니다.
- source_word: souls
  choice: 생명
  rationale: 여기서는 죽음에서 구출되는 사람의 생명을 가리키므로, 영혼과 육체의 이분법을 불필요하게 들여오지 않도록 문맥적 의미를 택했습니다.
theological_decisions:
- issue: 죽은 젊은이가 나았다는 표현과 부활의 함의
  choice: 그 발은 곧 나았습니다
  alternative: 그 젊은이는 곧 살아났습니다
  rationale: 증언문은 앞에서 그가 죽었다고 말하지만 이어서 명시적으로 치유된 대상을 ‘발’이라고 합니다. 이 긴장을 해소하여 부활을 명시하지 않고 원문의 서술을 그대로 보존했습니다.
- issue: 마지막 문장의 미래 구원 범위
  choice: 살아 있는 동안 내내 모든 이를 계속 구할 것이다
  alternative: 평생 계속해서 모두를 구할 것이다
  rationale: ‘all the days of his life’와 ‘all’을 모두 드러내되, 이 발언을 후대의 교리적 보편구원 진술로 확장하지 않고 무리의 말로 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 지문은 읽기 쉬운 서사 문체로, 예수의 명령과 무리의 말은 직접화법으로 살렸습니다. 제공된 자료가 고대 그리스어 본문 자체가 아니라 공개 영역 영어 증언이며 그리스어 검토가 보류 중이므로, 세부 어휘 선택은 잠정적입니다.
