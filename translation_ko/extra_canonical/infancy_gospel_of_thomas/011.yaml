  terminology: ‘표징’과 ‘겉옷’은 적절합니다. ‘주술을 걸다’는 bewitch의 해악적·초자연적 뜻을 ‘마술을 걸다’보다 더 잘 전달합니다. ‘우리 아이’는 복수 소유 표현을 유지하되, 수혜자를 명확히 하기 위해 조사 ‘에게’를 보충했습니다.
