base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: ko
  text: '(1) 아이 예수는 일곱 살쯤 되었습니다. 어머니 마리아가 예수에게 물을 길어 오라고 보냈습니다. 그런데 물 저장고에는 사람이 아주 많이 몰려 있었고, 물동이가 부딪혀 깨졌습니다.


    (2) 그러자 예수는 입고 있던 겉옷을 펼쳐 거기에 물을 담고 어머니에게 가져갔습니다. 마리아는 예수가 행한 표징을 보고 그에게 입을 맞추며 말했습니다. “주님, 나의 하나님, 우리 아이를 복 내려 주십시오.” 이는 누군가가 아이에게 마술을 걸까 그들이 두려워했기 때문입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 그리스어 사본 전통에 대한 직접 검토가 아직 필요합니다. 마지막 문장의 ‘그들’이 구체적으로 누구를 가리키는지는 이 증언만으로 분명하지 않습니다.
    reason: 직접적인 그리스어 원문 검토가 보류된 상태와 대명사의 실제 모호성을 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: child Jesus
  choice: 아이 예수
  rationale: 예수의 어린 나이를 드러내면서도 자연스럽고 간결한 한국어 표현을 택했습니다.
- source_word: water cistern
  choice: 물 저장고
  rationale: 물을 모아 두는 시설이라는 뜻을 현대 독자가 쉽게 이해하도록 옮겼습니다.
- source_word: pitcher
  choice: 물동이
  rationale: 물을 길어 나르는 그릇이라는 문맥상의 기능을 분명히 했습니다.
- source_word: cloak
  choice: 겉옷
  rationale: 몸 위에 걸쳐 입는 외투성 의복을 가리키는 넓고 자연스러운 표현입니다.
- source_word: sign
  choice: 표징
  rationale: 단순한 기이한 일이 아니라 의미를 지닌 놀라운 행위를 가리키는 종교 문헌의 어감을 보존했습니다.
- source_word: bewitch
  choice: 마술을 걸다
  rationale: 누군가 초자연적 수단으로 아이에게 해를 끼친다는 고대적 두려움을 독자가 이해할 수 있게 표현했습니다.
theological_decisions:
- issue: 마리아의 호칭 ‘Lord, my God’이 누구를 가리키는가
  choice: “주님, 나의 하나님”을 직접 호칭으로 그대로 보존
  alternative: 예수를 향한 고백으로 명시하거나 하나님께 드리는 기도로 풀어 쓰기
  rationale: 영어 증언 본문만으로는 호칭의 대상과 문장 관계가 확정적이지 않으므로 신학적으로 한쪽으로 해소하지 않았습니다.
- issue: ‘our child’의 복수 소유 표현
  choice: “우리 아이”
  alternative: “이 아이” 또는 “제 아이”
  rationale: 원문 증언의 복수 소유 표현을 보존하여 화자와 공동체 또는 가족을 둘러싼 모호성을 유지했습니다.
- issue: 두려워한 주체 ‘they’
  choice: “그들이”
  alternative: “마리아와 가족이”
  rationale: 본문에 명시되지 않은 집단의 정체를 임의로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 평이하고 품위 있게 유지했으며, 대화는 기도 또는 간구의 격식을 살렸습니다. 제공 자료가 영어 증언이므로 그리스어 어휘를 복원해 단정하지 않았습니다.
