base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/002.yaml
  text: '(1) The child Jesus was five years old. After it rained, he was playing at the ford of a flowing stream. He stirred up the muddy water, gathered it into pools, and made it clean and excellent, commanding it by his word alone—and not by any action.


    (2) Then he took soft clay from the mud and shaped twelve sparrows from it. But it was the Sabbath when he did these things, and many children were with him.


    (3) A certain Jew saw the child Jesus doing these things with the other children. He went to Joseph, Jesus’ father, and slandered the child Jesus, saying, “He made clay on the Sabbath, which is not permitted, and shaped twelve sparrows.”


    (4) Joseph went and rebuked Jesus, saying, “Why are you doing these things on the Sabbath?”


    But Jesus clapped his hands and, with a shout in front of everyone, commanded the birds, saying, “Go, take flight like living beings!” The sparrows took flight and went away, squawking.


    (5) When the Pharisee saw this, he was amazed and reported it to all his friends.'
translation:
  language: ko
  text: '**유년기 도마복음 2장 — 예수께서 참새들을 만드시다**


    (1) 아기 예수께서 다섯 살이셨습니다. 비가 내린 뒤, 예수께서는 흐르는 시냇물의 여울에서 놀고 계셨습니다. 흙탕물을 휘저어 웅덩이들에 모으시고, 그것을 깨끗하고 아주 좋게 만드셨습니다. 오직 말씀으로 명령하셨을 뿐, 어떤 행동으로 명령하신 것이 아니었습니다.


    (2) 그런 다음 진흙에서 부드러운 찰흙을 떠서 참새 열두 마리를 빚으셨습니다. 그런데 예수께서 이런 일을 하신 날은 안식일이었고, 많은 아이가 그분과 함께 있었습니다.


    (3) 어떤 유대인이 아기 예수께서 다른 아이들과 함께 이런 일을 하시는 것을 보았습니다. 그는 예수의 아버지 요셉에게 가서 아기 예수를 헐뜯으며 말했습니다. “저 아이는 안식일에 해서는 안 되는 진흙 반죽을 하여 참새 열두 마리를 빚었습니다.”


    (4) 요셉은 예수께 가서 꾸짖으며 말했습니다. “어찌하여 안식일에 이런 일을 하느냐?”


    그러나 예수께서는 모든 사람이 보는 앞에서 손뼉을 치시고 큰 소리로 새들에게 명령하셨습니다. “가거라. 살아 있는 것들처럼 날아오르거라!” 그러자 참새들은 날아올라 짹짹거리며 떠나갔습니다.


    (5) 그 바리새인은[a] 이것을 보고 놀라서 자기의 모든 친구에게 알렸습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 3절에서는 이 인물을 ‘어떤 유대인’이라고 부르지만, 여기서는 ‘그 바리새인’이라고 부릅니다. 전승에 나타나는 이 호칭의 변화를 그대로 보존했습니다.
    reason: 인물 호칭이 본문 안에서 바뀌는 점을 독자에게 알리고 이를 번역자가 임의로 조화시키지 않기 위해서입니다.
lexical_decisions:
- source_word: child Jesus
  choice: 아기 예수
  rationale: 다섯 살 된 예수를 가리키는 서술로서, 한국어 외경 문체에서 자연스럽고 친숙한 표현을 선택했습니다.
- source_word: ford of a flowing stream
  choice: 흐르는 시냇물의 여울
  rationale: 물이 얕아 건널 수 있는 지형이라는 뜻을 살리면서도 장면이 자연스럽게 그려지도록 옮겼습니다.
- source_word: clean and excellent
  choice: 깨끗하고 아주 좋게
  rationale: 두 평가어를 하나로 축소하지 않고 병렬 구조를 보존했습니다. 다만 물을 묘사하는 한국어로 지나치게 부자연스러운 ‘탁월하게’는 피했습니다.
- source_word: ordering them by word alone – and not ordering them by a deed
  choice: 오직 말씀으로 명령하셨을 뿐, 어떤 행동으로 명령하신 것이 아니었습니다
  rationale: ‘말’과 ‘행동’의 다소 난해한 대조를 해소하거나 재해석하지 않고 보존했습니다.
- source_word: soft clay
  choice: 부드러운 찰흙
  rationale: 형상을 빚을 수 있는 축축하고 유연한 진흙이라는 문맥을 분명히 했습니다.
- source_word: slandered
  choice: 헐뜯으며
  rationale: 단순히 중립적으로 알리거나 고발했다는 뜻보다 강한 원문의 부정적 평가를 보존했습니다.
- source_word: squawking
  choice: 짹짹거리며
  rationale: 참새가 소리를 내며 날아가는 장면을 현대 한국어에서 자연스럽게 표현했습니다.
theological_decisions:
- issue: 말씀에 의한 명령과 행동에 의한 명령의 대조
  choice: 난해한 대조를 본문에 그대로 유지했습니다.
  alternative: 예수께서 손을 대지 않고 말씀만으로 물을 깨끗하게 하셨다고 풀어 쓸 수 있습니다.
  rationale: 앞에서 물을 휘젓고 모았다는 행동이 이미 언급되므로, 본문이 정확히 어떤 행동을 부정하는지 단정하면 서사의 긴장과 모호성을 제거하게 됩니다.
- issue: 안식일 행위의 성격
  choice: ‘안식일에 해서는 안 되는 진흙 반죽’으로 옮겼습니다.
  alternative: ‘안식일에 진흙을 만들었는데, 이는 허용되지 않는 일’로 더 직역할 수 있습니다.
  rationale: 금지의 주장 주체가 고발자임을 문맥 안에 유지하면서, 특정 후대 교파의 안식일 해석을 덧붙이지 않았습니다.
- issue: 3절의 ‘어떤 유대인’과 5절의 ‘바리새인’ 사이의 호칭 변화
  choice: 두 호칭을 본문 그대로 구별하고 각주로 알렸습니다.
  alternative: 두 곳 모두 ‘바리새인’ 또는 ‘유대인’으로 통일할 수 있습니다.
  rationale: 전승이 보존한 인물 호칭의 변화를 조화시키거나 동일 인물 여부를 과도하게 단정하지 않기 위해서입니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되, 고대 종교 서사에 어울리는 단정하고 품위 있는 문장으로 다듬었습니다. 예수에 대한 서술에는 존대를 적용하고, 직접 인용은 등장인물 관계와 장면에 맞게 자연스럽게 처리했습니다. 제공 자료가 공용 영어 번역 증언이며 그리스어 직접 대조가 아직 보류 중이라는 한계 안에서, 영어 증언의 반복과 모호성을 가능한 한 보존한 잠정 출판 초안입니다.
