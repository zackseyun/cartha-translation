  - severity: medium
    issue: 예수의 말에 있는 호격 ‘man’ 누락
    rationale: ‘I tell you, man’의 호격이 한국어 본문에서 빠져 있습니다. 한국어에 자연스럽게 반영하여 발화의 직접성을 보존할 필요가 있습니다.
