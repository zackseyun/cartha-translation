base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: ko
  text: '(1) 얼마 뒤, 한 건물이 세워지고 있었습니다. 큰 소동이 일어나자, 예수께서 일어나 그곳으로 가셨습니다.


    예수께서는 한 사람이 죽어 누워 있는 것을 보시고, 그의 손을 붙잡아 말씀하셨습니다. “내가 당신에게 말합니다. 일어나 당신의 일을 하십시오.” 그러자 그 사람은 곧바로 일어나 예수께 경배했습니다.


    (2) 무리는 이것을 보고 놀라며 말했습니다. “이 아이는 하늘에서 왔습니다. 그가 많은 영혼을 죽음에서 구했으며, 평생토록 계속 구할 것이기 때문입니다.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 그리스어 사본 전통을 반영한 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 그리스어 원문과 사본들에 대한 직접 대조가 아직 필요합니다.
    reason: 제공된 자료가 직접적인 그리스어 원문이 아니라 영어 증언이며, 원어 검토가 보류 중이라는 본문 비평상의 한계를 독자에게 알립니다.
lexical_decisions:
- source_word: building was being constructed
  choice: 한 건물이 세워지고 있었습니다
  rationale: 건축 공사가 진행 중이라는 수동적·진행적 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: great commotion
  choice: 큰 소동
  rationale: 현장에 사람들이 술렁이고 모여든 상황을 과도하게 구체화하지 않고 보존했습니다.
- source_word: seized/took his hand
  choice: 그의 손을 붙잡아
  rationale: 행동의 단호함을 살리되 한국어에서 지나치게 폭력적으로 들릴 수 있는 표현은 피했습니다.
- source_word: worshipped him
  choice: 예수께 경배했습니다
  rationale: 단순한 존경보다 강한 종교적 함의를 가진 행위를 보존하고, 대명사의 지시 대상을 분명히 했습니다.
- source_word: souls
  choice: 영혼
  rationale: 원문 증거가 제한된 상태에서 영어 증언의 신학적 어휘를 약화하거나 ‘사람’으로 해석해 버리지 않고 그대로 보존했습니다.
- source_word: all the days of his life
  choice: 평생토록
  rationale: 직역투를 피하면서 생애의 모든 날이라는 시간적 범위를 충실하고 자연스럽게 나타냈습니다.
theological_decisions:
- issue: ‘하늘에서’라는 표현의 의미
  choice: “이 아이는 하늘에서 왔습니다”
  alternative: “이 아이는 하늘에 속한 아이입니다”
  rationale: 기원, 파송, 소속 가운데 하나로 의미를 한정하지 않고 영어 증언의 공간적 표현을 보존했습니다.
- issue: ‘많은 영혼을 죽음에서 구했다’의 범위
  choice: ‘영혼’과 ‘죽음에서 구하다’를 그대로 유지
  alternative: “많은 사람을 죽음에서 살려 냈다”
  rationale: 육체적 소생만을 뜻하는지 더 넓은 구원을 뜻하는지 생기는 신학적 긴장을 해소하지 않았습니다.
- issue: 경배의 대상 명시
  choice: “예수께 경배했습니다”
  alternative: “그에게 절했습니다”
  rationale: 문맥상 대상은 예수이며, ‘worshipped’의 종교적 무게를 ‘절하다’로 약화하지 않았습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 서술은 존엄하고 쉽게 읽히도록 구성했으며, 예수의 말도 상대를 불필요하게 낮추지 않는 정중한 명령형으로 옮겼습니다. 공개 영역 영어 증언만 제공되었으므로 번역의 잠정성을 각주에 명시했습니다.
