base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: ko
  text: '(1) 씨 뿌릴 때가 되자 요셉은 씨를 뿌렸고, 어린 예수님도 밀 한 말[a]을 뿌리셨습니다.


    (2) 그 아버지는 큰 말로 백 말을 거두었습니다. 그는 가난한 사람들과 고아들에게 아낌없이 나누어 주었습니다. 그러나 요셉은 예수님이 뿌리신 씨에서 거두었습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말’은 여기서 곡식의 분량을 나타내기 위해 사용한 표현입니다. 정확한 고대 계량 단위는 그리스어 사본 전통을 직접 대조한 뒤 조정될 수 있습니다.
    reason: 제공된 영어 증언은 단위를 일반적으로 ‘measure’라고 옮기며, 그리스어 원문 검토가 아직 이루어지지 않았기 때문입니다.
  - marker: b
    text: 마지막 문장은 제공된 영어 증언을 따르면 직역하여 ‘그러나 요셉은 예수님의 씨에서 취했습니다’라고도 할 수 있습니다. 무엇을 어떻게 취했다는 뜻인지, 앞 문장과 어떤 관계인지 다소 불분명합니다.
    reason: 증언의 실제 모호함과 역접을 보존하고, 문맥에 따른 ‘거두다’라는 번역이 확정적 해석으로 오인되지 않게 하기 위해서입니다.
lexical_decisions:
- source_word: one measure of wheat
  choice: 밀 한 말
  rationale: 곡식의 부피를 재는 단위라는 뜻을 자연스러운 한국어로 전달하되, 정확한 고대 단위가 확정되지 않았음을 각주로 밝혔습니다.
- source_word: a hundred great measures
  choice: 큰 말로 백 말
  rationale: 원문 증언의 ‘백’과 ‘큰 단위’라는 표현을 모두 보존하고, 앞 절의 계량 표현과 연결했습니다.
- source_word: gave graciously
  choice: 아낌없이 나누어 주었습니다
  rationale: 단순한 전달이 아니라 너그러운 베풂이라는 의미를 현대 한국어로 자연스럽게 나타냈습니다.
- source_word: the poor and the orphans
  choice: 가난한 사람들과 고아들
  rationale: 두 수혜 집단을 구별하여 명료하고 일반적인 현대어로 옮겼습니다.
- source_word: took from Jesus’ seeds
  choice: 예수님이 뿌리신 씨에서 거두었습니다
  rationale: 문맥상 수확을 가리키는 것으로 읽되, 앞 문장과의 다소 불분명한 관계를 해소하려 들지 않고 각주에 남겼습니다.
theological_decisions:
- issue: 기적적인 수확량과 요셉의 행위 사이의 관계
  choice: 백 배의 수확과 구제를 그대로 서술하고, 마지막 문장의 전환도 ‘그러나’로 보존했습니다.
  alternative: 요셉이 예수님의 씨에서 백 말을 거두어 나누어 주었다고 문장들을 하나의 인과관계로 통합할 수 있습니다.
  rationale: 제공된 증언 자체의 반복과 긴장을 번역자가 신학적·서사적으로 매끄럽게 재구성하지 않기 위해서입니다.
- issue: 예수님을 가리키는 높임 표현
  choice: ‘어린 예수님’, ‘뿌리셨습니다’로 옮겼습니다.
  alternative: 서사적 중립성을 강조하여 ‘아이 예수’, ‘뿌렸습니다’로 옮길 수 있습니다.
  rationale: 현대 한국어 독자의 일반적인 경칭 관습을 따르되, 본문에 별도의 교리적 호칭을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 아동도 이해할 수 있는 평이한 문장을 유지하면서, 기적 이야기의 장중함과 원문 증언의 다소 거친 연결을 함께 보존했습니다. 이 초안은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역이며, 그리스어 사본 전통의 직접 검토가 필요합니다.
