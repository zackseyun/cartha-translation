source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων. Μὴ οὖν ὑπερίδητε αὐτούς· αὐτοὶ γάρ εἰσιν οἱ τετιμημένοι ὑμῶν μετὰ τῶν προφητῶν καὶ διδασκάλων. Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ. Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
  pages:
  - 40
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015.yaml
  text: Appoint[a], then, for yourselves overseers and deacons worthy of the Lord—men gentle and not lovers of money, and truthful and proven; for they too minister to you the ministry of the prophets and teachers. Therefore do not disregard them, for they are your honored ones together with the prophets and teachers. And reprove one another, not in anger but in peace[b], as you have it in the gospel; and let no one speak to anyone who goes wrong against another, nor let him hear from you, until he repents. But perform your prayers and your acts of mercy and all your deeds in this way[d][c], as you have it in the gospel of our Lord.
  footnotes:
  - marker: a
    text: Or 'Elect' or 'Ordain' for 'Appoint'; the Greek can include the sense of selecting leaders, possibly with election in view.
    reason: lexical_alternative
  - marker: b
    text: '''Overseers'' translates the Greek term directly; ''bishops'' reflects the later church title derived from the same word.'
    reason: lexical_alternative
  - marker: c
    text: '''Acts of mercy'' may also be rendered ''alms'' or ''almsgiving.'''
    reason: lexical_alternative
  - marker: d
    text: The phrase 'as you have it in the gospel' likely refers to the community's received gospel teaching as an authoritative norm for conduct.
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 여러분은 자신들을 위하여 주님께 합당한 감독들과 집사들을 세우십시오 — 온유하고, 돈을 사랑하지 않으며, 진실하고, 검증된 사람들입니다. 그들도 여러분에게 예언자들과 교사들의 직무를 섬기기 때문입니다. 그러므로 그들을 업신여기지 마십시오. 그들은 예언자들과 교사들과 함께 여러분의 존중받는 사람들입니다. 또한 서로를 책망하되, 분노로 하지 말고 평강 가운데 하십시오. 여러분이 복음에서 받은 바와 같이 말입니다. 또 다른 사람에게 잘못한 자에 대하여는 아무도 말하지도 말고, 그가 여러분에게서 듣지도 못하게 하십시오. 그가 회개할 때까지입니다. 여러분의 기도와 자비의 행위와 모든 일도 이렇게 하십시오. 곧 우리 주님의 복음에 여러분이 받은 바와 같이 하십시오.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세우십시오’는 선택의 의미를 포함할 수 있는 Χειροτονήσατε를 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘감독들’은 헬라어를 직접 옮긴 말이며, ‘주교들’은 그 단어에서 비롯된 후대의 교회 직함을 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자비의 행위’는 ‘구제’ 또는 ‘구제 행위’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘복음에서 받은 바와 같이’는 공동체가 받은 복음 가르침을 행위의 규범으로 삼으라는 뜻으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: Χειροτονήσατε
  english_pob_choice: Appoint
  chosen_korean: 세우십시오
  alternatives_korean:
  - 임명하십시오
  - 선출하십시오
  - 안수하여 세우십시오
  lexicon: LSJ; BDAG
  rationale: 선정과 임명의 뜻을 살리면서, 장차의 기술적 ‘안수’ 의미를 과도하게 끌어들이지 않도록 가장 중립적인 동사로 옮겼습니다.
- source_word: ἐπισκόπους
  english_pob_choice: overseers
  chosen_korean: 감독들
  alternatives_korean:
  - 감시자들
  - 주교들
  lexicon: BDAG
  rationale: 직역적 의미인 감독을 택해, 후대의 제도화된 ‘주교’ 의미를 본문에 되돌려 넣지 않았습니다.
- source_word: διακόνους
  english_pob_choice: deacons
  chosen_korean: 집사들
  alternatives_korean:
  - 일꾼들
  - 종들
  - 봉사자들
  lexicon: BDAG
  rationale: 초기 교회 직분으로서의 뉘앙스를 살리기 위해 한국어 교회 용례가 있는 집사를 사용했습니다.
- source_word: ἀφιλαργύρους
  english_pob_choice: not lovers of money
  chosen_korean: 돈을 사랑하지 않으며
  alternatives_korean:
  - 탐욕이 없으며
  - 재물을 탐하지 않으며
  - 돈을 밝히지 않으며
  lexicon: BDAG
  rationale: 부정어와 ‘돈 사랑’의 직접성을 보존해 물질에 대한 집착 부재를 분명히 했습니다.
- source_word: λειτουργοῦσι ... τὴν λειτουργίαν
  english_pob_choice: minister ... the ministry
  chosen_korean: 직무를 섬기기
  alternatives_korean:
  - 봉사를 수행하기
  - 예배 직무를 섬기기
  - 사역을 행하기
  lexicon: BDAG; LSJ
  rationale: 동족어 반복을 한국어에서 과하게 기계적으로 반복하기보다, ‘섬기다’로 봉사성을 드러내고 ‘직무’로 공적 역할을 살렸습니다.
theological_decisions:
- issue: ἐπισκόπους / διακόνους를 후대 교회 직제 용어로 고정할지 여부
  chosen_reading: 감독들과 집사들
  alternative_readings:
  - 주교들과 부제들
  - 감독들과 봉사자들
  rationale: Didache의 초기 교회 질서를 반영하면서도, 본문의 일반적 직무 의미를 유지하는 표현을 택했습니다.
  doctrine_reference: 교회 직제의 역사적 발달과 본문 의미 구분
- issue: ἀστοχοῦντι ... μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω의 관계
  chosen_reading: 또 다른 사람에게 잘못한 자에 대하여는 아무도 말하지도 말고, 그가 여러분에게서 듣지도 못하게 하십시오.
  alternative_readings:
  - 그에게 아무도 말하지 말고, 여러분도 그에게서 듣지 마십시오.
  - 그에게서 아무도 말하지 말고, 여러분도 그를 듣지 마십시오.
  rationale: Greek 문법상 ‘듣다’의 주어는 범한 자이므로, 공동체의 단절 명령이 드러나도록 주어 관계를 보존했습니다.
  doctrine_reference: 교회 징계와 회개의 질서
- issue: ἐλεημοσύνας의 범위
  chosen_reading: 자비의 행위
  alternative_readings:
  - 구제
  - 구제 행위
  - 자선
  rationale: 구제에만 좁히지 않고, 본문이 제시하는 실천 전반의 자비성을 드러내기 위해 더 넓은 표현을 택했습니다.
  doctrine_reference: 자비와 구제의 윤리
