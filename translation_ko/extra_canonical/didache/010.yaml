base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010.yaml
  text: 'But after being filled[a], give thanks in this way:


    We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.


    You, Master Almighty,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.

    Above all we give thanks to you because you are mighty;

    to you be the glory forever.


    Remember, Lord, your church:

    to deliver it from every evil

    and to perfect it in your love;

    and gather it from the four winds,

    the one sanctified, into your kingdom,

    which you prepared for it.

    For yours is the power and the glory forever.


    Let grace come[b],

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen[d][c].


    But permit the prophets to give thanks as much as they desire.'
  footnotes:
  - marker: a
    text: Or 'child' for 'your servant' (παῖς); the Greek term can bear either sense here.
    reason: lexical_alternative
  - marker: b
    text: '''From the four winds'' is biblical imagery for gathering the scattered people from every direction.'
    reason: cultural_note
  - marker: c
    text: Maranatha is an Aramaic liturgical cry, likely meaning 'Our Lord, come.'
    reason: lexical_alternative
  - marker: d
    text: The manuscript reads 'to the God of David' (τῷ θεῷ Δαβίδ). Most editors emend the text to 'to the son of David' (τῷ υἱῷ Δαβίδ) to align with the messianic acclamation in the Gospels (e.g., Matt. 21:9).
    reason: textual_variant
translation:
  language: ko
  text: '그리고 배부른 뒤에는 이렇게 감사드리십시오.


    “거룩하신 아버지, 우리는 주님의 거룩한 이름 때문에, 또 주님께서 우리 마음속에 거하게 하신 그 이름 때문에, 그리고 예수님, 주님의 종을 통해 우리에게 알게 하신 지식과 믿음과 영원성 때문에 주님께 감사드립니다. 주님께 영광이 영원히 있습니다.


    전능하신 주권자시여, 주님은 주님의 이름을 위하여 만물을 창조하셨고, 사람들에게 음식과 음료를 주어 즐기게 하셨으니, 이는 그들이 주님께 감사하게 하려 하심입니다. 그러나 우리에게는 주님의 종을 통해 영적인 음식과 음료와 영원한 생명을 은혜로 주셨습니다. 무엇보다도 주님은 능력이 있으시므로 주님께 감사드립니다. 주님께 영광이 영원히 있습니다.


    주님, 주님의 회중을 기억하소서. 그것을 모든 악에서 건져 내시고 주님의 사랑 안에서 완전하게 하시며, 네 바람으로부터 그것을 모아 주님의 나라로, 곧 주님께서 그것을 위하여 예비하신 그 나라로 데려가소서. 능력과 영광이 영원히 주님께 있습니다.


    은혜가 오게 하시고, 이 세상이 지나가게 하소서. 다윗의 아들에게 호산나. 누구든지 거룩하면 오게 하십시오. 누구든지 거룩하지 않으면 회개하게 하십시오. 마라나타. 아멘.


    그러나 예언자들이 원하는 만큼 감사하게 하십시오.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 바람’은 성서적 이미지로, 사방에서 흩어진 백성을 모으는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 마라나타는 아람어 예전 외침으로, 대체로 ‘우리 주님, 오십시오’라는 뜻으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 일부 사본은 ‘다윗의 하나님’(τῷ θεῷ Δαβίδ)으로 읽지만, 편집본은 메시아적 호칭에 맞춰 ‘다윗의 아들’(τῷ υἱῷ Δαβίδ)을 따릅니다.
    reason: textual_variant
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  english_pob_choice: Master Almighty
  chosen_korean: 전능하신 주권자시여
  alternatives_korean:
  - 전능하신 주인님
  - 주권자 전능자시여
  lexicon: BDAG
  rationale: δέσποτα의 지배적·주권적 어감과 παντοκράτωρ의 ‘전능하신’을 함께 살리기 위해, 평범한 κύριος보다 강한 호칭인 ‘주권자시여’를 택했습니다.
- source_word: παῖς
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 아들
  - 아이
  lexicon: BDAG
  rationale: 예수님에 대한 παῖς는 ‘아들/아이’보다 종의 종말론적·성서적 울림이 더 분명하므로, 본문 전반의 예배 언어에 맞게 ‘종’으로 옮겼습니다.
- source_word: τὴν ἁγιασθεῖσαν
  english_pob_choice: the one sanctified
  chosen_korean: 거룩하게 된 그
  alternatives_korean:
  - 거룩하게 된 회중
  - 성별된
  lexicon: BDAG
  rationale: 분사구가 회중을 가리키는 설명적 수식이므로, 본문에서는 자연스럽게 ‘그것’에 붙여 ‘거룩하게 된 그’로 처리해 의미를 보존했습니다.
- source_word: μαρανᾰθά
  english_pob_choice: Maranatha
  chosen_korean: 마라나타
  alternatives_korean:
  - 우리 주여, 오소서
  - 주님이 오셨습니다
  lexicon: BDAG
  rationale: 아람어 예전 호칭은 음역을 유지하는 것이 역사적·예전적 질감을 가장 잘 보존하므로, 본문에는 음역만 두고 풀이를 붙이지 않았습니다.
theological_decisions:
- issue: 예수님을 가리키는 παῖς의 의미
  chosen_reading: ‘종’으로 유지하여 종-메시아적 뉘앙스를 살립니다.
  alternative_readings:
  - ‘아들’로 옮겨 친자 관계를 강조함
  - ‘어린아이/아이’로 옮김
  rationale: 이 기도문은 사도행전의 종-메시아 언어와 잘 맞닿아 있으므로, 친밀함보다 성경적 종의 이미지를 앞세우는 번역이 문맥상 더 적절합니다.
  doctrine_reference: 'DOCTRINE.md: original-language primacy; preserve theological tension rather than resolve it'
- issue: ‘다윗의 아들’의 본문 형태
  chosen_reading: 그리스어 본문대로 ‘다윗의 아들’로 번역하되, 별도 주해는 두지 않았습니다.
  alternative_readings:
  - 사본 변이인 ‘다윗의 하나님’으로 옮김
  rationale: 제시된 정본 그리스어가 υἱῷ를 따르고 있어, 예배적 메시아 호칭을 본문대로 살리는 것이 가장 투명합니다.
  doctrine_reference: 'DOCTRINE.md: textual transparency'
