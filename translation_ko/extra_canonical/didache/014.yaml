  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014.yaml
  text: 'But on the Lord’s day[a], after you have gathered together, break bread and give thanks, after first confessing your transgressions, so that your sacrifice may be pure. But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled. For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice, because I am a great King,” says the Lord[c][b], “and my name is marvelous among the nations.”'
  footnotes:
  - marker: a
    text: The opening phrase may also be rendered 'On the Lord’s Day.' The Greek expression is emphatic and somewhat unusual.
    reason: lexical_alternative
  - marker: b
    text: The citation is a conflation and adaptation of Malachi 1:11 and 1:14 (LXX).
    reason: cross_reference
  - marker: c
    text: '''Sacrifice'' is retained because the Greek uses explicit sacrificial language (*thusia*). In this context, it refers to the community''s entire act of worship, centered on the Eucharistic thanksgiving.'
    reason: cultural_note
translation:
  language: ko
  text: 주님의 날에 여러분이 모일 때에는 떡을 떼고 감사하십시오. 먼저 여러분의 잘못을 고백하여 여러분의 제사가 깨끗하게 되게 하십시오. 서로에게 다툼이 있는 사람은 화해하기 전에는 여러분과 함께 모이지 못하게 하십시오. 그래야 여러분의 제사가 더럽혀지지 않습니다. 이것은 주님께서 말씀하신 바입니다. "모든 곳과 모든 때에 내게 깨끗한 제사를 드리라. 내가 큰 왕이기 때문이다." 주님께서 말씀하십니다. "내 이름이 민족들 가운데서 놀랍다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἀμφιβολία here refers to interpersonal dispute or conflict, not mere doubt.
    reason: lexical_alternative
  - marker: b
    text: The citation is a conflation and adaptation of Malachi 1:11 and 1:14 (LXX).
    reason: cross_reference
  - marker: c
    text: ‘Sacrifice’ is retained because the Greek uses explicit sacrificial language (thusia). In this context, it refers to the community’s entire act of worship, centered on the Eucharistic thanksgiving.
    reason: cultural_note
lexical_decisions:
- source_word: Κατὰ κυριακὴν δὲ Κυρίου
  english_pob_choice: But on the Lord’s day
  chosen_korean: 주님의 날에
  alternatives_korean:
  - 주일에
  - 주님의 날
  - 주께 속한 날에
  lexicon: LSJ
  rationale: κυριακή와 Κυρίου의 이중 강조를 자연스러운 현대 한국어로 살리면서, 후대 교회 용어에 과도하게 고정하지 않도록 했습니다.
- source_word: κλάσατε ἄρτον καὶ εὐχαριστήσατε
  english_pob_choice: break bread and give thanks
  chosen_korean: 떡을 떼고 감사하십시오
  alternatives_korean:
  - 빵을 떼고 감사하십시오
  - 떡을 떼며 감사하십시오
  - 빵을 떼고 감사를 드리십시오
  lexicon: BDAG
  rationale: 초기 기독교의 식사/예식 표현을 살려 ‘떡을 떼다’로 옮기고, εὐχαριστήσατε는 추가 해석 없이 ‘감사하다’로 번역했습니다.
- source_word: προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν
  english_pob_choice: after first confessing your transgressions
  chosen_korean: 먼저 여러분의 잘못을 고백하여
  alternatives_korean:
  - 먼저 여러분의 허물을 고백하여
  - 미리 여러분의 죄를 고백하여
  - 먼저 여러분의 범과를 자백하여
  lexicon: LSJ
  rationale: 전치적·선행적 의미를 살리면서, παραπτώματα의 도덕적 무게를 한국어에서 과도하게 교회화하지 않고 ‘잘못’으로 표현했습니다.
- source_word: θυσία
  english_pob_choice: sacrifice
  chosen_korean: 제사
  alternatives_korean:
  - 희생제물
  - 희생
  - 예물
  lexicon: BDAG
  rationale: 문맥이 말라기 인용과 함께 예배의 제의적 언어를 반복하므로, ‘제사’가 POB의 ‘sacrifice’에 가장 직접적으로 대응합니다.
- source_word: ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ
  english_pob_choice: who has a dispute with his companion
  chosen_korean: 서로에게 다툼이 있는 사람은
  alternatives_korean:
  - 동료와 분쟁이 있는 사람은
  - 동무와 논쟁이 있는 사람은
  - 동반자와 불화가 있는 사람은
  lexicon: LSJ
  rationale: ἀμφιβολία가 여기서는 내적 의심보다 관계적 갈등을 뜻하므로, 이어지는 화해 문맥에 맞게 ‘다툼’으로 옮겼습니다.
- source_word: διαλλαγῶσιν
  english_pob_choice: they are reconciled
  chosen_korean: 화해하기 전에는
  alternatives_korean:
  - 서로 화해하기 전에는
  - 화목하기 전에는
  - 조정되기 전에는
  lexicon: BDAG
  rationale: 수동/상호적 화해의 요구를 자연스럽게 드러내면서, 공동체적 관계 회복의 뜻을 분명히 했습니다.
- source_word: κοινωθῇ ἡ θυσία ὑμῶν
  english_pob_choice: so that your sacrifice may not be defiled
  chosen_korean: 여러분의 제사가 더럽혀지지 않습니다
  alternatives_korean:
  - 여러분의 제사가 속되지 않게 하십시오
  - 여러분의 제사가 부정하게 되지 않게 하십시오
  - 여러분의 제사가 일반화되지 않게 하십시오
  lexicon: BDAG
  rationale: καθαρά와 대조되는 정결/부정의 대비를 살려 ‘더럽혀지다’로 옮겼습니다.
- source_word: Ἐν παντὶ τόπῳ καὶ χρόνῳ
  english_pob_choice: In every place and time
  chosen_korean: 모든 곳과 모든 때에
  alternatives_korean:
  - 모든 장소와 모든 때에
  - 어디서나 언제나
  - 모든 곳과 때마다
  lexicon: LSJ
  rationale: 인용문의 보편성을 직접적으로 드러내되, 한국어 어순상 가장 읽기 쉬운 형태로 정리했습니다.
theological_decisions:
- issue: θυσία를 예배 행위 전체로 좁힐지, 제의적 언어를 그대로 유지할지
  chosen_reading: 본문의 제의적 언어를 유지해 ‘제사’로 번역했습니다.
  alternative_readings:
  - 예배
  - 예물
  - 감사 예식
  rationale: 본문은 명시적으로 제사 언어를 반복하고 말라기 인용까지 연결하므로, 이를 예배 일반으로 완화하면 원문의 긴장을 약화시킵니다.
  doctrine_reference: Preserve sacrificial imagery where the source explicitly uses it.
- issue: 주님의 날 표현을 교회력적 고유명사로 고정할지
  chosen_reading: ‘주님의 날’로 옮겨, 예배일을 가리키는 표현이면서도 원문의 특이성을 남겼습니다.
  alternative_readings:
  - 주일
  - 주의 날
  - 주님의 날에
  rationale: κυριακή / Κυρίου의 이중 강조를 반영하되, 후대 표제어로만 고정하지 않도록 했습니다.
  doctrine_reference: Original-language primacy; preserve ambiguity where real.
