  source_fidelity: 수정이 필요합니다. 원문의 ἄνδρας(남자들)가 초안의 ‘사람들’에서 중화되었고, 형용사구가 ‘…사람들입니다’라는 별도 서술문이 되어 ‘세우십시오’의 목적어와 문법적으로 분리되었습니다. 또한 λειτουργία τῶν προφητῶν καὶ διδασκάλων는 예언자들과 교사들이 행하는 봉사/사역을 가리키므로 ‘직분’보다 ‘봉사’가 원문에 더 가깝습니다.
  naturalness: ‘여러분은 자신들을 위해’보다 ‘여러분을 위하여’가 현대 한국어에서 자연스럽습니다. 자격 요건을 ‘온유하고 … 검증된 남자들을 세우십시오’로 직접 목적어화하면 합쇼체 명령문이 매끄럽고 원문의 병렬 구조도 보존됩니다.
  terminology: ἐπίσκοποι와 διάκονοι에는 전통적 직분 용어인 ‘감독들’과 ‘집사들’을 유지할 수 있습니다. λειτουργία는 이 문맥에서 특정 제도적 ‘직분’으로 한정하지 않고 ‘봉사’로 옮깁니다.
