source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Χειροτονήσατε οὖν ἑαυτοῖς ἐπισκόπους καὶ διακόνους ἀξίους τοῦ Κυρίου, ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους· ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/001.yaml
  text: Appoint, then, for yourselves overseers and deacons worthy of the Lord—men who are gentle, not lovers of money, truthful, and proven; for they too perform for you the ministry of the prophets and teachers.
  footnotes:
  - marker: a
    text: Or 'men gentle and not lovers of money, and truthful and proven'.
    reason: previous_rendering
  - marker: b
    text: Or 'minister to you the ministry'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 여러분을 위하여 주님께 합당한 감독들과 집사들, 곧 온유하고 돈을 사랑하지 않으며 진실하고 검증된 남자들을 세우십시오. 그들도 여러분을 위하여 예언자들과 교사들의 봉사를 하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “온유하고 돈을 사랑하지 않으며 진실하고 검증된 남자들”.
    reason: 원문의 네 병렬 형용사를 명사 뒤에 배열하는 대안적 표현입니다.
  - marker: b
    text: 또는 “여러분에게 예언자들과 교사들의 봉사를 합니다”.
    reason: ὑμῖν을 ‘여러분에게’로 옮기고 λειτουργοῦσι ... τὴν λειτουργίαν의 동족 목적어 표현을 보다 직역적으로 반영한 대안입니다.
lexical_decisions:
- source_word: ἐπισκόπους
  english_pob_choice: overseers
  chosen_korean: 감독들
