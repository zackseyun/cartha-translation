  lexicon: ἐπίσκοπος
  rationale: 교회 직분어로 굳어진 전통적 대응인 감독을 쓰되, 본문이 지칭하는 기능적 직분을 살려 복수형으로 옮겼습니다.
- source_word: διακόνους
  english_pob_choice: deacons
  chosen_korean: 집사들
  alternatives_korean:
  - 봉사자들
  - 일꾼들
  lexicon: διάκονος
  rationale: 본문이 회중의 공식 직분을 말하므로 일반적 봉사자보다 직분어인 집사가 더 정확합니다.
- source_word: ἄνδρας πραεῖς καὶ ἀφιλαργύρους καὶ ἀληθεῖς καὶ δεδοκιμασμένους
  english_pob_choice: men who are gentle, not lovers of money, truthful, and proven
  chosen_korean: 온유하고, 돈을 사랑하지 않고, 진실하며, 검증된 사람들
  alternatives_korean:
  - 온유하며, 탐욕스럽지 않고, 진실하며, 입증된 사람들
  - 온화하고, 재물을 탐하지 않고, 참되며, 시험받은 사람들
  lexicon: πραΰς / ἀφιλάργυρος / ἀληθής / δοκιμάζω
  rationale: 네 개의 분사적 형용사를 한국어에서도 병렬로 분명히 드러내어, 인물의 자격 요건이라는 점을 살렸습니다.
- source_word: λειτουργοῦσι ... τὴν λειτουργίαν
  english_pob_choice: perform ... the ministry
  chosen_korean: 직분을 수행
  alternatives_korean:
  - 예배 봉사를 수행
  - 사역을 수행
  lexicon: λειτουργέω / λειτουργία
  rationale: 동족 목적어 구조를 자연스럽게 옮기되, 공적·준예전적 봉사라는 뉘앙스를 너무 좁히지 않도록 직분으로 처리했습니다.
theological_decisions:
- issue: ἐπίσκοποι / διάκονοι를 한국어 교회 용어로 어떻게 번역할지
  chosen_reading: 감독들과 집사들
  alternative_readings:
  - 감독자들과 봉사자들
  - 교회 지도자들과 일꾼들
  rationale: 본문은 공동체 안의 공식 직분을 지시하므로, 독자가 제도적 역할을 즉시 인지할 수 있는 직분어를 유지하는 것이 source-direct합니다.
  doctrine_reference: 교회 질서와 직분에 대한 서술적 본문
- issue: ὑμῖν γὰρ λειτουργοῦσι καὶ αὐτοὶ τὴν λειτουργίαν τῶν προφητῶν καὶ διδασκάλων의 의미
  chosen_reading: 그들도 여러분에게 예언자들과 교사들의 직분을 수행합니다
  alternative_readings:
  - 그들도 여러분을 위해 예언자들과 교사들의 봉사를 합니다
  - 그들도 여러분에게 예언자들과 교사들의 사역을 합니다
  rationale: λειτουργία의 공적 봉사 성격을 살리면서도, 본문이 단순한 일반 노동이 아니라 예언자·교사와 연결된 기능을 말한다는 점을 드러냈습니다.
  doctrine_reference: 초대교회 직분과 봉사의 기능 서술
