id: DID.15.3
reference: Didache 15:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλέγχετε δὲ ἀλλήλους μὴ ἐν ὀργῇ, ἀλλ' ἐν εἰρήνῃ, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ· καὶ παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω, ἕως οὗ μετανοήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/003.yaml
  text: And reprove one another[a], not in anger but in peace, as you have in the gospel; and let no one speak to anyone who sins against another, nor let him be heard by you, until he repents.
  footnotes:
  - marker: a
    text: Or 'anyone who goes wrong against another'.
    reason: previous_rendering
translation:
  language: ko
  text: 서로를 권고하되, 분노로 하지 말고 평강 가운데 하십시오. 이는 복음 안에서 여러분이 가진 바와 같습니다. 그리고 다른 사람에게 죄를 짓는 자를 아무도 말하지 못하게 하십시오. 그가 회개하기 전에는 여러분도 그를 들어 주지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른 이에게 잘못하는 사람’.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλέγχετε
  english_pob_choice: reprove
  chosen_korean: 권고하되
  alternatives_korean:
  - 책망하되
  - 타이르되
  lexicon: ἐλέγχω
  rationale: 상호적 교정의 뉘앙스를 살리면서도 현대 한국어에서 너무 공격적으로 들리지 않도록 ‘권고하되’로 옮겼습니다.
- source_word: ἐν εἰρήνῃ
  english_pob_choice: in peace
  chosen_korean: 평강 가운데
  alternatives_korean:
  - 평화 가운데
  - 화평 가운데
  lexicon: εἰρήνη
  rationale: POB의 기본어인 ‘평강’을 유지해 공동체적 화목의 상태를 드러냈습니다.
- source_word: παντὶ ἀστοχοῦντι κατὰ τοῦ ἑτέρου
  english_pob_choice: anyone who sins against another
  chosen_korean: 다른 사람에게 죄를 짓는 자
  alternatives_korean:
  - 다른 이를 거스르는 자
  - 다른 사람에게 잘못하는 자
  lexicon: ἀστοχέω + κατὰ τοῦ ἑτέρου
  rationale: 문맥상 단순한 ‘빗나감’이 아니라 타인에 대한 실제적 범죄를 가리키므로 ‘죄를 짓다’로 풀었습니다.
- source_word: μηδεὶς λαλειτώ μηδὲ παρ' ὑμῶν ἀκουέτω
  english_pob_choice: let no one speak ... nor let him be heard by you
  chosen_korean: 아무도 말하지 못하게 하십시오 ... 그를 들어 주지 마십시오
  alternatives_korean:
  - 아무도 그에게 말하지 못하게 하십시오
  - 여러분도 그 말을 듣지 마십시오
  lexicon: λαλέω / ἀκούω
  rationale: ἀκουέω의 수동형적 뉘앙스를 반영해 ‘그를 들어 주지 마십시오’로 옮겨, 단순 청취 금지보다 공동체적 수용 거절을 나타냈습니다.
theological_decisions:
- issue: 권징/훈계의 방식
  chosen_reading: 공동체적 책망은 분노가 아니라 평강 안에서 행해야 한다는 윤리를 살렸습니다.
  alternative_readings:
  - 강한 책망 규범
  - 단순한 조언 권면
  rationale: 본문은 ‘ἐν ὀργῇ’와 ‘ἐν εἰρήνῃ’의 대조를 통해 훈계의 정서를 규정하므로, 그 대조를 약화하지 않도록 번역했습니다.
  doctrine_reference: 공동체 윤리와 형제 권면
