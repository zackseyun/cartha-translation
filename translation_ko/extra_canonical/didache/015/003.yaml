revisions:
- from: 서로를 권고하되, 분노로 하지 말고 평강 가운데 하십시오. 이는 복음 안에서 여러분이 가진 바와 같습니다. 그리고 다른 사람에게 죄를 짓는 자를 아무도 말하지 못하게 하십시오. 그가 회개하기 전에는 여러분도 그를 들어 주지 마십시오.[a]
  to: 서로를 책망하되, 분노로 하지 말고 평화롭게 하십시오. 복음에 있는 대로 하십시오. 또 다른 사람에게 잘못을 저지르는 사람에게는 아무도 말하지 말며, 그가 회개하기까지는 여러분에게서 아무 말도 듣지 못하게 하십시오.[a]
  rationale: 원문의 명령 구조와 여격 παντὶ의 대상 관계를 회복했습니다. ‘책망’은 ἐλέγχω의 교정적 의미를 보존하며, ‘평화롭게’는 분노와의 대조를 자연스럽게 드러냅니다. 마지막 두 동사는 잘못한 사람에게 말을 걸거나 그가 공동체에게서 말을 듣는 것을 회개 때까지 금하는 병렬 명령으로 번역했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:17Z'
review_pass:
  verdict: revise
  source_fidelity: 현재 초안은 ἐλέγχετε를 ‘권고하다’로 약화하고, 특히 μηδεὶς λαλειτώ … μηδὲ παρ’ ὑμῶν ἀκουέτω의 대상 관계를 뒤집습니다. 헬라어는 다른 이를 거슬러 잘못한 사람에게 아무도 말하지 말고, 그가 회개할 때까지 여러분에게서 듣지 못하게 하라는 뜻입니다.
  naturalness: ‘평강 가운데 하십시오’와 ‘그를 들어 주지 마십시오’는 이 문맥에서 다소 부자연스럽거나 뜻이 불명확합니다. ‘평화롭게’와 ‘여러분에게서 아무 말도 듣지 못하게’가 현대 표준 한국어로 자연스럽고 원문의 관계를 명료하게 드러냅니다.
  terminology: ἐλέγχω에는 ‘책망하다/잘못을 지적하다’가 적절하며 ‘권고하다’는 지나치게 약합니다. ἀστοχέω는 여기서 타인에게 저지른 잘못을 뜻하므로 ‘잘못을 저지르는 사람’으로 옮기고, 각주에서 문자적 가능성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘권고하되’가 ἐλέγχετε의 책망·교정 의미를 약화합니다.
    rationale: 상호 권면의 온화한 방식은 뒤의 ‘분노로 하지 말고 평화롭게’가 규정합니다. 동사 자체는 잘못을 지적하고 책망하는 뜻을 유지해야 합니다.
  - severity: high
    issue: ‘다른 사람에게 죄를 짓는 자를 아무도 말하지 못하게 하십시오’는 λαλειτώ의 수혜 대상과 의미를 잘못 처리합니다.
    rationale: παντὶ ἀστοχοῦντι는 ‘잘못한 사람에게’라는 여격이며, 아무도 그에게 말하지 말라는 지시입니다. 초안은 그 사람이 말하는 것을 금하는 뜻으로 바꿉니다.
  - severity: high
    issue: ‘여러분도 그를 들어 주지 마십시오’는 παρ’ ὑμῶν ἀκουέτω를 ‘그의 말을 듣지 말라’로 뒤집습니다.
    rationale: 능동태 ἀκουέτω와 παρ’ ὑμῶν은 그 사람이 ‘여러분에게서 듣는’ 것을 가리킵니다. 회개할 때까지 공동체가 그에게 말을 건네지 말라는 병렬 지시입니다.
  - severity: low
    issue: ‘이는 복음 안에서 여러분이 가진 바와 같습니다’는 ὡς ἔχετε ἐν τῷ εὐαγγελίῳ를 어색하게 표현합니다.
    rationale: ‘복음에 있는 대로’가 생략된 목적어를 자연스럽게 보충하면서 원문의 간결성을 지킵니다.
