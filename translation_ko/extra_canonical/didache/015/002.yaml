id: DID.15.2
reference: Didache 15:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ οὖν ὑπερίδητε αὐτούς· αὐτοὶ γάρ εἰσιν οἱ τετιμημένοι ὑμῶν μετὰ τῶν προφητῶν καὶ διδασκάλων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/002.yaml
  text: Therefore do not disregard them, for they are the ones honored by you, together with the prophets and teachers.
translation:
  language: ko
  text: 그러므로 그들을 무시하지 마십시오. 그들은 예언자들과 교사들과 함께, 여러분이 높여 온 이들이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높여 온 이들’은 τετιμημένοι의 수동 완료 분사를 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν ὑπερίδητε αὐτούς
  english_pob_choice: Therefore do not disregard them
  chosen_korean: 그러므로 그들을 무시하지 마십시오
  alternatives_korean:
  - 그러므로 그들을 경시하지 마십시오
  - 그러므로 그들을 업신여기지 마십시오
  lexicon: ὑπεριδέω
  rationale: 동사 ὑπερίδητε는 ‘무시하다/경시하다’의 뜻으로, 한국어에서는 직접적이고 자연스러운 ‘무시하지 마십시오’가 문맥의 경고를 잘 살립니다.
- source_word: οἱ τετιμημένοι
  english_pob_choice: the ones honored by you
  chosen_korean: 여러분이 높여 온 이들
  alternatives_korean:
  - 여러분이 존중해 온 이들
  - 여러분에게서 존중받는 이들
  - 여러분이 존귀하게 여긴 이들
  lexicon: τιμάω
  rationale: 완료분사 τετιμημένοι의 수동적 상태를 살리면서도, ‘존중’보다 관계와 공경의 뉘앙스가 살아 있는 ‘높여 온 이들’로 옮겼습니다.
- source_word: μετὰ τῶν προφητῶν καὶ διδασκάλων
  english_pob_choice: together with the prophets and teachers
  chosen_korean: 예언자들과 교사들과 함께
  alternatives_korean:
  - 예언자들과 교사들 곁에
  - 예언자들과 교사들과 더불어
  lexicon: προφήτης / διδάσκαλος
  rationale: μετά + 속격의 동반 관계를 ‘~와 함께’로 자연스럽게 처리했고, διδάσκαλοι는 교회 직분 용어를 과도하게 고정하지 않도록 ‘교사들’로 옮겼습니다.
theological_decisions:
- issue: 수동 완료분사 τετιμημένοι의 의미
  chosen_reading: ‘여러분이 높여 온 이들’로 옮겨, 이들이 공동체 안에서 이미 공적으로 존중받아 온 상태임을 드러냈습니다.
  alternative_readings:
  - ‘여러분에게서 존중받는 이들’
  - ‘여러분이 존귀하게 여긴 이들’
  rationale: 본문의 수동적 완료 상태는 단순한 현재 호감이 아니라 이미 형성된 존중의 지위를 나타내므로, 이를 보존하는 번역이 필요합니다.
  doctrine_reference: 공동체 질서와 지도자 존중에 관한 본문 이해
