  naturalness: ‘여러분에게서 존중받는 이들’은 현대 표준 한국어의 공식적 문체에서 자연스럽고, ‘높여 온’보다 원문의 완료분사가 나타내는 존중받는 상태를 명료하게 전달합니다.
  terminology: ‘예언자들’과 ‘교사들’은 προφητῶν 및 διδασκάλων에 적절합니다. ‘무시하지 마십시오’도 ὑπερίδητε에 자연스럽게 대응합니다.
  issues:
