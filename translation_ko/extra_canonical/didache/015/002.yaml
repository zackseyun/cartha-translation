    issue: ‘여러분이 높여 온 이들’이 수동 완료분사를 능동적·지속적 표현으로 전환함
    rationale: τετιμημένοι는 ‘존중받은/존중받고 있는 이들’이라는 수동 완료분사입니다. ‘~해 온’은 원문에 명시되지 않은 시간적 지속과 능동적 행위를 부가하므로, 수동 상태를 유지하는 표현이 더 안전합니다.
