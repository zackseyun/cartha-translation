id: DID.15.4
reference: Didache 15:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰς δὲ εὐχὰς ὑμῶν καὶ τὰς ἐλεημοσύνας καὶ πάσας τὰς πράξεις οὕτω ποιήσατε, ὡς ἔχετε ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/015/004.yaml
  text: But as for your prayers and your alms and all your deeds[a], do them in this way, as you have it in the gospel of our Lord.
  footnotes:
  - marker: a
    text: Or 'But perform your prayers and your acts of mercy and all your deeds in this way'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 여러분의 기도와 구제와 모든 행위를, 주 우리의 복음에 있는 대로 그렇게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 기도와 여러분의 자선과 모든 행위를 이와 같이 행하십시오’
    reason: previous_rendering
lexical_decisions:
- source_word: Τὰς δὲ εὐχὰς ὑμῶν
  english_pob_choice: your prayers
  chosen_korean: 여러분의 기도
  alternatives_korean:
  - 너희의 기도
  - 당신들의 기도
  lexicon: εὐχή
  rationale: 문두의 전면 배치된 목적어를 살려 ‘기도’를 먼저 두었고, 현대 합쇼체에 맞게 ‘여러분의’로 자연스럽게 옮겼습니다.
- source_word: τὰς ἐλεημοσύνας
  english_pob_choice: your alms
  chosen_korean: 구제
  alternatives_korean:
  - 자선
  - 알몸
  lexicon: ἐλεημοσύνη
  rationale: ἐλεημοσύνη는 단순한 ‘자비 행위’보다 가난한 사람에게 주는 자선, 곧 구제를 가리키므로 ‘구제’가 가장 직접적입니다.
- source_word: πάσας τὰς πράξεις
  english_pob_choice: all your deeds
  chosen_korean: 모든 행위
  alternatives_korean:
  - 모든 행동
  - 모든 일
  lexicon: πρᾶξις
  rationale: πράξεις는 일반적인 ‘행위/실천’을 뜻하므로 문맥상 과장 없이 ‘모든 행위’로 옮겼습니다.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Κυρίου ἡμῶν
  english_pob_choice: in the gospel of our Lord
  chosen_korean: 주 우리의 복음에 있는 대로
  alternatives_korean:
  - 우리 주님의 복음에 있는 대로
  - 우리 주의 복음 안에 있는 대로
  lexicon: εὐαγγέλιον / κύριος
  rationale: 원문은 ‘복음 안에 있는 내용/기준’의 준거를 말하므로 ‘복음에 있는 대로’로 옮겼고, Κυρίου ἡμῶν은 예수께 대한 호칭으로 ‘주 우리’의 형태를 유지했습니다.
theological_decisions:
- issue: 문두의 대조 접속사 δέ와 목적어 전면 배치
  chosen_reading: ‘그러므로 여러분의 기도와 구제와 모든 행위’를 먼저 제시해 강조를 보존했습니다.
  alternative_readings:
  - ‘그리고 여러분의 기도와 구제와 모든 행위는’
  - ‘또 여러분의 기도와 구제와 모든 행위는’
  rationale: δὲ는 단순 연결보다 앞선 문맥과의 대비/전환을 띠며, 세 목적어를 먼저 놓는 배열이 실천 항목을 강조합니다.
  doctrine_reference: 문맥 강조와 수사 구조 보존
- issue: ‘주 우리의 복음’의 소유격 표현
  chosen_reading: 직역적 울림을 살려 ‘주 우리의 복음’으로 두었습니다.
  alternative_readings:
  - ‘우리 주님의 복음’
  - ‘우리 주의 복음’
  rationale: 원문은 Κυρίου ἡμῶν의 결합을 통해 복음의 권위를 ‘우리의 주’에게 귀속시키므로, 다소 비문처럼 보이더라도 그 관계를 선명하게 드러냈습니다.
  doctrine_reference: 그리스도론적 호칭과 권위 귀속
