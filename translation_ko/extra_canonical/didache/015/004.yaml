  source_fidelity: ‘그러므로’는 δέ의 전환·대조 기능을 인과 관계로 바꾸므로 적절하지 않습니다. 또한 ‘주 우리의 복음’은 원문의 τοῦ Κυρίου ἡμῶν(‘우리 주님의’)을 한국어에서 부자연스럽고 잘못 결합한 표현입니다. ‘우리 주님의 복음에 있는 대로’는 ὡς ἔχετε ἐν τῷ εὐαγγελίῳ를 충실하게 재현합니다.
  naturalness: ‘여러분의 기도와 구제와 모든 행위는 … 하십시오’는 전면 배치된 목적어 목록을 보존하면서 현대 한국어 합쇼체로 자연스럽습니다. ‘우리 주님의’이 표준적인 소유·호칭 결합입니다.
  terminology: εὐχαί는 ‘기도’, ἐλεημοσύναι는 가난한 이들을 위한 구체적 나눔인 ‘구제’, πράξεις는 ‘모든 행위’로 적절합니다. κύριος ἡμῶν은 ‘우리 주님’으로 옮기는 것이 정확합니다.
  issues:
