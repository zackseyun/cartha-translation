  to: 그러나 여러분의 기도와 구제와 모든 행위는 우리 주님의 복음에 있는 대로 그렇게 하십시오.[a]
  rationale: 인과 접속사 ‘그러므로’를 δέ에 맞는 ‘그러나’로 고치고, 비문인 ‘주 우리의 복음’을 정확하고 자연스러운 ‘우리 주님의 복음’으로 바로잡았습니다. 문두에 놓인 기도·구제·모든 행위의 목록과 ‘그렇게’의 지시성을 유지했습니다.
