    issue: ‘그러므로’
    rationale: 그리스어 δέ는 여기서 인과를 표시하지 않고 전환 또는 약한 대조를 표시합니다.
  - severity: high
    issue: ‘주 우리의 복음’
    rationale: τοῦ Κυρίου ἡμῶν은 ‘우리 주님의’이라는 한 소유격 단위입니다. 현 번역은 한국어 문법상 부자연스러울 뿐 아니라 ‘우리’의 소속 관계를 왜곡합니다.
  - severity: low
    issue: 각주 대안의 ‘자선’
    rationale: 영어 감사 기록의 ‘acts of mercy’에 해당하는 대안은 단순 명사 ‘자선’보다 ‘자선 행위’가 더 명시적입니다.
  revised_text: 그러나 여러분의 기도와 구제와 모든 행위는 우리 주님의 복음에 있는 대로 그렇게 하십시오.[a]
