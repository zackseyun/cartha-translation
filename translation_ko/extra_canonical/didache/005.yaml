source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία· διῶκται ἀγαθῶν, μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος, οὐ γινώσκοντες μισθὸν δικαιοσύνης, οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ, ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν· ὧν μακρὰν πραΰτης καὶ ὑπομονή, μάταια ἀγαπῶντες, διώκοντες ἀνταπόδομα, οὐκ ἐλεοῦντες πτωχόν, οὐ πονοῦντες ἐπὶ καταπονουμένῳ, οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς, φονεῖς τέκνων, φθορεῖς πλάσματος Θεοῦ, ἀποστρεφόμενοι τὸν δεόμενον, καταπονοῦντες τὸν θλιβόμενον, πλουσίων παράκλητοι, πενήτων ἄνομοι κριταί, πανθαμάρτητοι· ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων.
  language: Greek
  pages:
  - 26
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005.yaml
  text: 'But the way of death is this: first of all[a], it is evil and full of curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness; persecutors of the good, hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far away, loving vain things, pursuing recompense, not showing mercy to the poor, not laboring on behalf of one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God''s handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children[d][c][b], from all these
    things.'
  footnotes:
  - marker: a
    text: Or 'full of cursing.' The Greek permits either the state of being accursed or being characterized by curses.
    reason: lexical_alternative
  - marker: b
    text: The paired terms rendered 'sorceries' (μαγεῖαι) and 'magic arts' (φαρμακεῖαι) overlap in meaning; the translation distinguishes them to preserve the Greek doublet. The latter term is often associated with the use of drugs or potions.
    reason: lexical_alternative
  - marker: c
    text: '''Murderers of children'' likely includes the common ancient practice of infant exposure, as well as abortion.'
    reason: cultural_note
  - marker: d
    text: Or 'May you be delivered.' The Greek optative expresses a strong wish or prayer for deliverance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 죽음의 길은 이렇습니다. 무엇보다도 그것은 악하며 저주로 가득합니다. 살인, 간음, 정욕, 음행, 도둑질, 우상숭배, 주술, 마술, 강도질, 거짓 증언, 위선, 두 마음, 속임수, 교만, 악의, 제멋대로 함, 탐욕, 더러운 말, 질투, 뻔뻔함, 거만, 자랑; 선한 것을 박해하는 자들, 진리를 미워하는 자들, 거짓을 사랑하는 자들, 의의 보상을 알지 못하는 자들, 선한 것에도 의로운 판단에도 매달리지 않는 자들, 선한 것을 향해서는 깨어 있지 않고 오히려 악한 것을 향해 깨어 있는 자들; 그런 자들에게서 온유와 인내는 멀리 있습니다. 헛된 것을 사랑하는 자들, 보상을 좇는 자들, 가난한 사람에게 자비를 베풀지 않는 자들, 억압받는 이의 편에서 수고하지 않는 자들, 자기들을 지으신 이를 알지 못하는 자들, 자녀를 죽이는 자들, 하나님의 지으신 것을 파괴하는 자들, 필요한 이를 외면하는 자들, 고통받는 이를 짓누르는 자들, 부자들의 대변자들, 가난한 자들의 무법한 재판관들, 온통 죄인들입니다. 자녀들아, 이런 모든 것에서 건짐을 받으십시오.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주로 가득합니다’는 ‘저주받은 상태’와 ‘저주를 퍼붓는 성향’ 둘 다 가능함을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주술’과 ‘마술’은 의미가 겹치지만, 그리스어의 이중표현을 보존하기 위해 구별했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자녀를 죽이는 자들’은 고대의 영아 유기와 낙태 관행까지 포함할 가능성이 있습니다.
    reason: cultural_note
  - marker: d
    text: ‘건짐을 받으십시오’는 ‘may you be delivered’처럼 강한 간구로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατάρας μεστή
  english_pob_choice: full of curse
  chosen_korean: 저주로 가득합니다
  alternatives_korean:
  - 저주로 가득 차 있습니다
  - 저주받음으로 가득합니다
  lexicon: 직역 기반
  rationale: 그리스어는 상태의 충만함을 강하게 말하므로, 한국어에서도 ‘가득합니다’로 그 중압감을 살렸습니다. ‘저주받음’은 상태를 더 설명하지만 본문의 압축된 표현보다 덜 직접적입니다.
- source_word: μαγεῖαι / φαρμακεῖαι
  english_pob_choice: sorceries / magic arts
  chosen_korean: 주술, 마술
  alternatives_korean:
  - 마법, 마술
  - 주술, 약물술
  lexicon: 직역 기반
  rationale: 영어 POB가 두 용어를 구분해 보존하므로 한국어도 두 항목을 분리했습니다. 두 단어의 영역이 겹치지만, 본문의 이중열거를 살리기 위해 서로 다른 현대어를 택했습니다.
- source_word: διπλοκαρδία
  english_pob_choice: double-heartedness
  chosen_korean: 두 마음
  alternatives_korean:
  - 이중심리
  - 두 마음의 상태
  lexicon: 직역 기반
  rationale: 직역적으로는 ‘두 마음’이 가장 짧고 원문의 심리적 분열을 잘 드러냅니다. ‘이중심리’는 현대적이지만 본문이 가진 도덕적·영적 뉘앙스가 약해집니다.
- source_word: αὐθάδεια
  english_pob_choice: self-will
  chosen_korean: 제멋대로 함
  alternatives_korean:
  - 완고함
  - 자기 뜻만 고집함
  lexicon: 직역 기반
  rationale: 자기주장과 고집을 함께 담는 어감을 살리기 위해 ‘제멋대로 함’을 택했습니다. 단순한 기질적 완고함보다 공동체를 무시하는 적극적 자기의지를 드러냅니다.
- source_word: ἀνταπόδομα
  english_pob_choice: recompense
  chosen_korean: 보상
  alternatives_korean:
  - 갚음
  - 되갚음
  lexicon: BDAG
  rationale: 문맥상 ‘의의 보상’은 의를 따르는 삶의 대가/상급을 가리키는 표현으로 읽히므로, 보상의 의미를 살렸습니다. 다만 한국어에서는 ‘보상’이 가장 자연스럽지만, 여기서는 추구의 대상이 되는 결과를 드러냅니다.
- source_word: φθορεῖς πλάσματος Θεοῦ
  english_pob_choice: destroyers of God's handiwork
  chosen_korean: 하나님의 지으신 것을 파괴하는 자들
  alternatives_korean:
  - 하나님의 손으로 빚으신 것을 파괴하는 자들
  - 하나님의 창조물을 훼손하는 자들
  lexicon: 직역 기반
  rationale: πλάσμα는 ‘지음 받은 것/빚어진 것’의 뜻이므로, 하나님의 창조 행위를 직접 드러내는 표현으로 옮겼습니다. ‘창조물’도 가능하지만 ‘지으신 것’이 더 원문에 가깝습니다.
- source_word: πανθαμάρτητοι
  english_pob_choice: altogether sinful
  chosen_korean: 온통 죄인들입니다
  alternatives_korean:
  - 완전히 죄인들입니다
  - 전적으로 죄인들입니다
  lexicon: 형태론 기반
  rationale: pan- 접두사의 총체성을 살리기 위해 ‘온통’으로 포괄성을 드러냈습니다. 단순한 정도 강조인 ‘완전히’보다 전체를 둘러싼 부정적 평가가 잘 드러납니다.
- source_word: ῥυσθείητε
  english_pob_choice: Be delivered
  chosen_korean: 건짐을 받으십시오
  alternatives_korean:
  - 구원받으십시오
  - 건져 주시기를 바랍니다
  lexicon: 형태론 기반
  rationale: 부정과거 수동 optative의 간구/권고 뉘앙스를 살려, 외부로부터의 구출을 드러내는 수동 표현으로 옮겼습니다. ‘구원’은 신학적으로 더 좁게 들릴 수 있어 여기서는 더 넓은 ‘건짐’을 택했습니다.
theological_decisions:
- issue: 마법·주술 항목의 이중열거 보존
  chosen_reading: ‘주술, 마술’로 나누어 둘 다 살렸습니다.
  alternative_readings:
  - 두 항목을 모두 ‘주술’로 통합
  - ‘마법, 주술’로 통합
  rationale: 그리스어 본문은 의미가 겹치는 두 단어를 연속으로 놓아 악덕 목록을 증폭합니다. 한국어에서도 분리하여 원문의 수사적 누적을 보존하는 것이 적절합니다.
  doctrine_reference: 본문의 수사적 구조 보존
- issue: 결말의 ῥυσθείητε
  chosen_reading: ‘건짐을 받으십시오’로 간구형 권고를 살렸습니다.
  alternative_readings:
  - ‘건져 주시기를 바랍니다’
  - ‘구원받으십시오’
  rationale: 수동 optative는 자력 구제가 아니라 외부의 구출을 전제하므로, 공동체를 향한 강한 권면으로 읽는 것이 자연스럽습니다. 동시에 하나님이 구출하신다는 신학적 여지를 열어 둡니다.
  doctrine_reference: 은혜에 의한 구출
