source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὥσπερ ἦν τοῦτο κλάσμα διεσκορπισμένον ἐπάνω τῶν ὀρέων καὶ συναχθὲν ἐγένετο ἕν, οὕτω συναχθήτω σου ἡ ἐκκλησία ἀπὸ τῶν περάτων τῆς γῆς εἰς τὴν σὴν βασιλείαν· ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις διὰ Ἰησοῦ Χριστοῦ εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/004.yaml
  text: Just as this fragment was scattered upon the mountains and[a], when gathered together, became one, so let your assembly be gathered together from the ends of the earth into your kingdom. For yours is the glory and the power through Jesus Messiah forever.
  footnotes:
  - marker: a
    text: Or 'Jesus the Messiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 조각이 산들 위에 흩어져 있다가 모여 하나가 된 것처럼, 당신의 회중도 땅 끝에서 당신의 나라로 모이게 하소서. 영광과 권능이 예수 메시아를 통하여 영원히 당신의 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예수 그리스도를 통하여’.
    reason: Χριστός의 한국어 관례적 명칭 표기를 제시하는 대안 번역입니다.
lexical_decisions:
- source_word: κλάσμα
  english_pob_choice: this fragment
  chosen_korean: 이 조각
  alternatives_korean:
  - 이 파편
  - 이 부스러기
  lexicon: κλάσμα
  rationale: 빵 예식 문맥에서 κλάσμα은 ‘부서진 한 조각’의 뜻이므로, 자연스럽고 의례적 맥락을 살리는 ‘조각’으로 옮겼습니다.
- source_word: ἐκκλησία
  english_pob_choice: assembly
  chosen_korean: 회중
  alternatives_korean:
  - 모임
  - 교회
  lexicon: ἐκκλησία
  rationale: 이 문맥의 ἐκκλησία는 제도적 ‘교회’보다 함께 모인 신앙 공동체를 가리키므로, POB 기본값에 따라 ‘회중’으로 옮겼습니다.
- source_word: βασιλεία
  english_pob_choice: kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 왕국
  - 통치
  lexicon: βασιλεία
  rationale: 하나님의 통치 영역을 가리키는 βασιλεία를 한국어 성경 문맥에서 가장 자연스럽고 직관적인 ‘나라’로 옮겼습니다.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  english_pob_choice: through Jesus Messiah
  chosen_korean: 예수 메시아를 통하여
  alternatives_korean:
  - 예수 그리스도를 통하여
  - 예수 그리스도를 통해
  lexicon: Χριστός
  rationale: POB 기본 용례에 따라 Χριστός의 титул적 의미를 살려 ‘메시아’로 옮겼고, διὰ는 매개 수단을 드러내는 ‘-를 통하여’로 옮겼습니다.
theological_decisions:
- issue: Δόξα와 δύναμις를 하나님께 돌리는 인접문구의 형식
  chosen_reading: ‘당신의 영광과 권능’으로 직역하되, 전통적 송영 구조를 유지했습니다.
  alternative_readings:
  - ‘영광과 능력’
  - ‘영광과 힘’
  rationale: 원문은 소유격 σοῦ와 병렬 명사 두 개를 단순히 진술하므로, 예배문답적 어조를 살리면서도 의미를 과장하지 않는 표현을 택했습니다.
  doctrine_reference: 송영(doxology)
