  source_fidelity: κλάσμα을 ‘조각’으로, ἐκκλησία를 ‘회중’으로, βασιλεία를 ‘나라’로 옮긴 것은 문맥과 잘 맞습니다. 그러나 송영의 ὅτι σοῦ ἐστιν ἡ δόξα καὶ ἡ δύναμις는 ‘당신의 영광과 권능은 … 있습니다’보다 영광과 권능의 소유자가 하나님임을 명확히 하는 ‘영광과 권능이 당신의 것입니다’로 옮겨야 합니다. 복수형 ὀρέων도 ‘산들’로 반영하는 편이 정확합니다.
  naturalness: ‘땅의 끝들’은 한국어에서 부자연스러우므로 관용적인 ‘땅 끝’이 적절합니다. 기도문인 본문의 청원에는 ‘모이게 하십시오’보다 합쇼체 예배 언어에 자연스러운 ‘모이게 하소서’가 적합합니다. 송영은 ‘영광과 권능이 … 당신의 것입니다’가 자연스럽습니다.
  terminology: ‘회중’, ‘나라’, ‘권능’, ‘예수 메시아’는 주어진 POB 용어 선택 및 본문 문맥과 조화됩니다. 기존 각주는 본문과 동일하게 ‘예수 메시아를 통하여’를 대안으로 제시하여 기능하지 않으므로, 관례적 명칭인 ‘예수 그리스도’를 대안 표기로 바로잡습니다.
