base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/005.yaml
  text: 'But let no one eat or drink from your thanksgiving except those who have been baptized into the name of the Lord. For also concerning this, the Lord has said: “Do not give what is holy to the dogs.”'
translation:
  language: ko
  text: 그러나 여러분의 감사 예식[a]에서는 주님의 이름으로 세례를 받은 사람들 외에는 아무도 먹거나 마시게 하지 마십시오. 이 일에 관하여 주께서도 말씀하셨습니다. “거룩한 것을 개들에게 주지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘감사’입니다. 그러나 여기서는 먹고 마시는 공동 예식 전체를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστίας
  english_pob_choice: thanksgiving
  chosen_korean: 감사예물
  alternatives_korean:
  - 감사
  - 성찬
  - 감사제사
  lexicon: εὐχαριστία
  rationale: 본문이 빵과 잔을 먹고 마시는 문맥에 있으므로 단순한 추상명사 ‘감사’보다, 예식적 함의를 살리면서도 과도한 교회 용어를 피하는 ‘감사예물’이 source-direct합니다.
- source_word: βαπτισθέντες
  english_pob_choice: those who have been baptized
  chosen_korean: 세례를 받은 사람들
  alternatives_korean:
  - 침례를 받은 사람들
  - 물세례를 받은 사람들
  lexicon: βαπτίζω
  rationale: 한국어 교회 공용어 가운데 가장 널리 이해되는 표준 표현을 택하되, 대상이 사람임을 분명히 하도록 ‘사람들’을 보완했습니다.
- source_word: εἰς ὄνομα Κυρίου
  english_pob_choice: into the name of the Lord
  chosen_korean: 주님의 이름으로
  alternatives_korean:
  - 주님의 이름 안으로
  - 주님의 이름에
  lexicon: εἰς + ὄνομα
  rationale: 직역형 ‘이름 안으로’는 한국어로 부자연스러워, 입문/귀속의 의미를 드러내는 자연스러운 합쇼체 표현으로 옮겼습니다.
- source_word: τὸ ἅγιον
  english_pob_choice: what is holy
  chosen_korean: 거룩한 것
  alternatives_korean:
  - 거룩한 예물
  - 성물
  - 거룩한 것들
  lexicon: ἅγιος
  rationale: 원문은 특정 품목을 지정하지 않으므로, 중성 단수의 범주적 표현을 살려 ‘거룩한 것’으로 번역했습니다.
theological_decisions:
- issue: 주께서 말씀하신 인용문의 출처가 복음서 본문과 정확히 일치하지 않는 점
  chosen_reading: 본문의 현재 형태를 그대로 살려, 야훼/주께서 하신 권위 있는 말씀으로 제시했습니다.
  alternative_readings:
  - 마태복음 7:6과의 직접 인용으로 처리
  - 구약/예수 전승의 자유 인용으로 각주 처리
  rationale: 디다케는 예수의 권위 있는 말을 전승 인용하는 문맥이므로, 본문에 보이는 직접형을 보존하는 것이 가장 source-grounded합니다.
  doctrine_reference: 전승 인용과 정경 복음서의 관계에 대한 본문-전승 구분
- issue: ‘주’의 처리
  chosen_reading: 한국어 본문에서는 ‘주님’과 ‘주께서’를 사용했습니다.
  alternative_readings:
  - 야훼로 번역
  - 주로 번역
  rationale: 이 구절의 κύριος는 문맥상 예수의 권위 있는 발화를 가리키므로, 본문 흐름을 가장 자연스럽게 드러내는 ‘주님/주께서’를 택했습니다.
  doctrine_reference: 신약의 κύριος 호칭과 예수의 권위
