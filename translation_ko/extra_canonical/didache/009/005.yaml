  rationale: 원문의 대조 관계와 예외 제한을 보존하면서, 한국어 문법상 불완전했던 문장을 바로잡았습니다. εὐχαριστία는 본문 문맥에 따라 ‘감사 예식’으로 번역하고, 각주로 직역과 의미 범위를 밝혀 특정 교파 용어로 단정하지 않았습니다. 인용문의 비특정적 표현과 ‘주’의 호칭은 유지했습니다.
