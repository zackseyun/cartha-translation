revisions:
- from: '먼저 잔에 관하여:


    우리 아버지, 당신께 감사드립니다. 다윗의 거룩한 포도나무, 곧 당신의 종의 포도나무를 위해 감사드립니다. 그 포도나무는 당신의 종 예수로 말미암아 우리에게 알려주셨습니다. 당신께 영광이 영원히 있습니다.[a]'
  to: '먼저 잔에 관하여:


    우리 아버지, 당신께 감사드립니다.

    당신의 종 다윗의 거룩한 포도나무를 위하여 감사드립니다.

    당신께서 당신의 종 예수를 통하여 그것을 우리에게 알게 하셨습니다.

    영광이 영원히 당신께 있기를 빕니다.'
  rationale: 원문의 소유·동격 구조를 ‘당신의 종 다윗’으로 정확히 복원하고, 관계대명사 ἧς의 선행사인 포도나무를 목적어 ‘그것’으로 처리하여 하나님이 알리신 행위를 분명히 했습니다. 영어 POB의 ‘servant’와 일치하게 두 παῖς를 모두 ‘종’으로 번역했습니다. 기존 각주는 번역 선택의 원어 근거를 제공하지 않고 영어 번역에 의존하므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:36Z'
