base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/009/002.yaml
  text: 'First, concerning the cup:


    We give thanks to you, our Father,

    for the holy vine of David your servant,

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: ko
  text: '먼저 잔에 관하여:


    우리 아버지, 당신께 감사드립니다. 다윗의 거룩한 포도나무, 곧 당신의 종의 포도나무를 위해 감사드립니다. 그 포도나무는 당신의 종 예수로 말미암아 우리에게 알려주셨습니다. 당신께 영광이 영원히 있습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포도나무’는 영어 POB의 ‘vine’을 따른 직역입니다. 성찬 감사문 안에서 그리스어 ἀμπέλος의 이미지와 다윗-메시아 연결을 유지합니다.
    reason: source_note
lexical_decisions:
- source_word: Εὐχαριστοῦμέν σοι
  english_pob_choice: We give thanks to you
  chosen_korean: 당신께 감사드립니다
  alternatives_korean:
  - 감사합니다
  - 감사드리나이다
  lexicon: εὐχαριστέω
  rationale: 공적 기도문에 맞는 현대 합쇼체로 옮기되, 단순 정보 전달이 아니라 하나님께 드리는 감사 행위를 분명히 드러내기 위해 ‘감사드립니다’를 택했습니다.
- source_word: ὑπὲρ τῆς ἁγίας ἀμπέλου Δαβὶδ τοῦ παιδός σου
  english_pob_choice: for the holy vine of David your servant
  chosen_korean: 다윗의 거룩한 포도나무, 곧 당신의 종의 포도나무
  alternatives_korean:
  - 다윗의 거룩한 포도나무
  - 다윗의 거룩한 포도덩굴
  lexicon: ἁγία ἀμπέλος / παις
  rationale: ἀμπέλος는 문자적으로 포도나무이며, ‘거룩한’과 ‘다윗의’의 결합을 보존했습니다. παις는 영어 POB가 ‘servant’로 잡은 공적 호칭이므로 ‘종’으로 옮기되, 다윗을 수식하는 자리에서는 문맥상 ‘당신의 종’으로 자연화했습니다.
- source_word: ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου
  english_pob_choice: which you made known to us through Jesus your servant
  chosen_korean: 그 포도나무는 당신의 종 예수로 말미암아 우리에게 알려주셨습니다
  alternatives_korean:
  - 그것을 예수 당신의 종을 통해 우리에게 알게 하셨습니다
  - 예수, 당신의 종을 통하여 우리에게 나타내셨습니다
  lexicon: γνωρίζω / διὰ + genitive
  rationale: ‘알리다/알게 하다’의 인지 동사를 유지하면서, 매개를 나타내는 διὰ를 ‘~로 말미암아’로 옮겨 행위의 통로를 분명히 했습니다.
- source_word: σοὶ ἡ δόξα εἰς τοὺς αἰῶνας
  english_pob_choice: To you be the glory forever
  chosen_korean: 당신께 영광이 영원히 있습니다
  alternatives_korean:
  - 당신께 영광이 영원합니다
  - 영광이 영원히 당신께 있습니다
  lexicon: δόξα / εἰς τοὺς αἰῶνας
  rationale: 그리스어의 선포형 영광 송영을 한국어로 자연스럽게 살리면서도, 단순 소망형보다 현재적 송영에 가까운 ‘있습니다’를 택했습니다.
theological_decisions:
- issue: 예수와 다윗의 ‘παῖς’(종) 표현의 일관성
  chosen_reading: 예수와 다윗 모두를 ‘종’으로 유지했습니다.
  alternative_readings:
  - 예수만 ‘종’, 다윗은 생략하거나 소유격으로 완화
  - 예수를 ‘아들’로 바꾸기
  rationale: 본문은 다윗과 예수 둘 다를 하나님의 παῖς로 병렬시켜 구속사적 예언 성취와 종-메시아 정체성을 함께 드러냅니다. 전통적 ‘아들’로 바꾸면 이 병렬 구조가 흐려집니다.
  doctrine_reference: 기독론 / 성경의 직설적 종-메시아 언어 보존
- issue: 감사의 대상과 송영의 형식
  chosen_reading: 문장 전체를 공동체의 감사 기도와 송영으로 유지했습니다.
  alternative_readings:
  - 서술문처럼 평서화
  - 송영을 약화해 ‘영광이 있기를’로 변경
  rationale: Didache의 문맥은 성찬 전 감사 기도이므로, 기도체의 직접성을 살리되 한국어에서 어색하지 않은 합쇼체로 조정했습니다.
  doctrine_reference: 예전 언어 / 공동체 기도문 형식
