  source_fidelity: ‘감사제’는 εὐχαριστία의 가능한 후대 예전 용례를 반영할 수 있으나, 이 한 구절에서 그 의미를 ‘제’로 특정하여 원문의 범위보다 좁히고 희생제사적 뉘앙스를 더합니다. 또한 ‘이제’는 δέ를 과도하게 시간 부사로 옮긴 것입니다. 본문은 ‘감사’라는 표현을 유지하면서 뒤따르는 기도 형식을 도입합니다.
