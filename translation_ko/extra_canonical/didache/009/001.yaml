lexical_decisions:
- source_word: Περὶ δὲ τῆς εὐχαριστίας
  english_pob_choice: Now concerning the thanksgiving
  chosen_korean: 이제 감사제에 관하여는
  alternatives_korean:
  - 이제 감사에 관하여는
  - 감사제에 대하여는
  lexicon: εὐχαριστία
  rationale: 문맥상 단순한 ‘감사’ 행위보다 이어지는 성찬적 감사 기도 전체를 가리키므로, 예전적 용례를 살려 ‘감사제’로 옮겼습니다.
- source_word: οὕτως
  english_pob_choice: in this way
  chosen_korean: 이렇게
  alternatives_korean:
  - 이런 방식으로
  - 이와 같이
  lexicon: οὕτως
  rationale: 뒤에 바로 이어질 정형 기도문을 지시하는 도입어이므로, 한국어에서도 자연스럽고 직접적인 안내 표현인 ‘이렇게’를 택했습니다.
- source_word: εὐχαριστήσατε
  english_pob_choice: give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 감사하라
  - 감사드리십시오
  lexicon: εὐχαριστέω
  rationale: 합쇼체 본문에 맞춰 공손한 명령형으로 옮기되, 예배적 맥락을 드러내는 ‘감사하십시오’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: εὐχαριστία의 범위
  chosen_reading: 성찬 전통과 연결된 예전적 ‘감사제’로 읽되, 본문 자체가 명시하는 범위를 넘겨 확대하지는 않았습니다.
  alternative_readings:
  - 단순한 일반적 감사
  - 성찬례 전체를 가리키는 전문 용어
  rationale: Didache 9장은 이후에 식사/잔/떡에 대한 정형 기도문이 이어지므로, 여기의 εὐχαριστία는 단순 심리적 감사보다 공동체 예전의 감사 기도를 예고하는 표현으로 이해하는 것이 자연합니다.
  doctrine_reference: 문맥 기반 예전 용례
