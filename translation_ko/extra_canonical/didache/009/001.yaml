  terminology: εὐχαριστία는 여기서 일반 감사와 초기 예전적 감사의 양쪽 가능성을 지니므로, 특정 교단적·후대 전문 용어인 ‘감사제’보다 ‘감사’가 안전합니다. εὐχαριστέω는 ‘감사하십시오’로 적절합니다.
