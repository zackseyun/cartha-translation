  yaml_path: translation/extra_canonical/didache/009/003.yaml
  text: 'And concerning the broken bread:


    We give thanks to you, our Father,

    for the life and knowledge

    which you made known to us through Jesus your servant.

    To you be the glory forever.'
translation:
  language: ko
  text: "그리고 떼어진 빵에 관하여 말하면: \n\n우리 아버지여, 생명과 지식을 주셔서, \n그것을 예수, 곧 당신의 종을 통하여 우리에게 알게 하신 것에 대하여 \n감사드립니다. \n영광이 당신께 영원토록 있습니다.[a]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 παις는 ‘종/일꾼/아이/아들’로 넓게 쓰일 수 있으나, 여기서는 영어 POB의 servant를 따라 ‘종’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τοῦ κλάσματος
  english_pob_choice: And concerning the broken bread
  chosen_korean: 그리고 떼어진 빵에 관하여 말하면
  alternatives_korean:
  - 그리고 떡을 떼는 일에 관하여
  - 그리고 빵이 떼어진 것에 관하여
  lexicon: κλάσμα
  rationale: 여기서는 의례의 주제를 가리키므로, 단순히 결과 상태를 살린 ‘떼어진 빵’이 본문 의미를 가장 직접적으로 드러냅니다.
- source_word: Εὐχαριστοῦμέν σοι
  english_pob_choice: We give thanks to you
  chosen_korean: 감사드립니다
  alternatives_korean:
  - 감사합니다
  - 감사하오니
  lexicon: εὐχαριστέω
  rationale: 공동체의 감사 기도를 자연스러운 합쇼체로 옮기되, 예배적 호소문체를 살려 ‘감사드립니다’로 처리했습니다.
- source_word: τοῦ παιδός σου
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 종님
  - 당신의 아이
  - 당신의 아들
  lexicon: παῖς
  rationale: 영어 POB가 servant로 풀어 준 해석을 반영해, 신분/소속을 드러내는 ‘종’으로 옮겼습니다. ‘아들’은 본문이 요구하는 직접적 의미보다 기독교적 전통 해석을 앞세울 수 있습니다.
- source_word: σοὶ ἡ δόξα εἰς τοὺς αἰῶνας
  english_pob_choice: To you be the glory forever
  chosen_korean: 영광이 당신께 영원토록 있습니다
  alternatives_korean:
  - 영광이 당신께 세세토록 있습니다
  - 영광이 당신께 영원히 있습니다
  lexicon: δόξα / εἰς τοὺς αἰῶνας
  rationale: 직역의 경직함을 피하면서도 헌정적 선언을 유지하기 위해, 예배문체의 자연스러운 한국어로 다듬었습니다.
theological_decisions:
- issue: 예수 호칭인 παις의 번역
  chosen_reading: 예수를 ‘당신의 종’으로 옮겨, 본문이 강조하는 하위적·봉사적 소속 관계를 드러냈습니다.
  alternative_readings:
  - 예수 당신의 아들
  - 예수 당신의 종(혹은 일꾼)
  rationale: 영어 POB가 servant를 택한 것은 파이즈(pais)의 의미를 신학적으로 특정 ‘아들’로 고정하지 않기 위한 선택으로 보이며, 한국어도 그 긴장을 보존하는 편이 좋습니다.
  doctrine_reference: 기독론/종-메시아적 표현
