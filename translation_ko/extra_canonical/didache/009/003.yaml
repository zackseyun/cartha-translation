- from: "그리고 떼어진 빵에 관하여 말하면: \n\n우리 아버지여, 생명과 지식을 주셔서, \n그것을 예수, 곧 당신의 종을 통하여 우리에게 알게 하신 것에 대하여 \n감사드립니다. \n영광이 당신께 영원토록 있습니다.[a]"
  to: '그리고 떡을 뗀 것에 관하여 말씀드리면:


