  source_fidelity: 초안은 감사의 대상과 예수를 통한 계시라는 핵심을 대체로 반영합니다. 그러나 ἧς ἐγνώρισας ἡμῖν은 ‘생명과 지식’을 우리에게 알게 하셨다는 뜻인데, 초안의 ‘생명과 지식을 주셔서, 그것을 … 알게 하신 것’은 ‘주심’을 추가하고 관계절의 수식을 불필요하게 바꿉니다.
  naturalness: ‘떼어진 빵’은 현대 한국어에서 다소 부자연스럽고 수동적 결과 상태로 들립니다. ‘떡을 뗀 것’은 κλάσμα의 의례적 주제를 자연스럽게 드러냅니다. 기도문의 호칭과 송영도 ‘아버지께’로 일관되게 처리하면 더 자연스럽습니다.
