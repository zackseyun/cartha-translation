review_pass:
  verdict: revise
  source_fidelity: The draft conveys the directive well, but its rendering of χριστιανός as ‘그리스도인으로서’ adopts the predicate/adverbial construal where the Greek can also be read with ‘a Christian’ as the subject of ζήσεται. A Korean rendering should avoid needlessly deciding that syntactic question. τέχνη in this context is more specifically a livelihood or trade than a modern occupational title.
  naturalness: The main sentence is understandable and formal-polite. ‘살아갈 수 있을지 마련하십시오’ is workable, but ‘살 수 있도록 방도를 마련하십시오’ is more idiomatic Korean for προνοήσατε πῶς. The current footnote is not a clear or complete alternative translation.
  terminology: ‘생업’ appropriately covers τέχνη as a trade or means of livelihood. ‘그리스도인’ is the standard term for χριστιανός. ‘분별’ is suitable for σύνεσις.
  issues:
  - severity: medium
    issue: χριστιανός is rendered as an unambiguously adverbial/predicate expression (‘그리스도인으로서’).
    rationale: The Greek’s anarthrous χριστιανός may be understood as the subject, ‘a Christian,’ rather than necessarily as a predicate describing the previously mentioned person. The Korean should preserve this syntactic openness where possible.
  - severity: low
    issue: The footnote does not supply a clear, complete alternative and is awkwardly phrased.
    rationale: ‘그가 ... 살아가도록 어떻게 마련할지’ leaves the imperative construction and its object insufficiently expressed. A footnote should state a genuinely intelligible alternate construal.
  - severity: low
    issue: ‘직업’ is somewhat broader and more modern-institutional than τέχνη in context.
    rationale: τέχνη here concerns a practical trade or livelihood by which the visitor can support himself; ‘생업’ better matches that function.
  revised_text: 그러나 그에게 생업이 없다면, 여러분의 분별에 따라 그리스도인이 여러분 가운데서 게으르지 않고 살아갈 수 있도록 방도를 마련하십시오.[a]
  revised_footnotes:
