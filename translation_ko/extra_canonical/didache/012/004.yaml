revisions:
- from: 만일 그에게 직업이 없으면, 여러분의 분별에 따라 그가 여러분 가운데서 어떻게 그리스도인으로서 게으르지 않게 살아갈 수 있을지 마련하십시오.[a]
  to: 그러나 그에게 생업이 없다면, 여러분의 분별에 따라 그리스도인이 여러분 가운데서 게으르지 않고 살아갈 수 있도록 방도를 마련하십시오.[a]
  rationale: The revision uses ‘생업’ for a trade or livelihood, replaces the slightly stiff ‘어떻게 ... 살아갈 수 있을지 마련하십시오’ with natural formal Korean, and makes ‘그리스도인’ the main-clause subject to retain the Greek’s possible generic reading. The footnote records the contextually plausible reading in which χριστιανός characterizes the particular person already under discussion.
