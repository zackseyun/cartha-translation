    text: 또는 ‘여러분의 분별에 따라, 그가 여러분 가운데서 그리스도인으로서 게으르지 않게 살아갈 수 있도록 방도를 마련하십시오.’
    reason: χριστιανός을 일반적 주어인 ‘그리스도인’으로 볼 수 있는지, 앞서 언급된 사람을 설명하는 서술어적 표현으로 볼 수 있는지에 관한 문법적 여지를 보존합니다.
  revision_rationale: The revision uses ‘생업’ for a trade or livelihood, replaces the slightly stiff ‘어떻게 ... 살아갈 수 있을지 마련하십시오’ with natural formal Korean, and makes ‘그리스도인’ the main-clause subject to retain the Greek’s possible generic reading. The footnote records the contextually plausible reading in which χριστιανός characterizes the particular person already under discussion.
