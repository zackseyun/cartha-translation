language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: εἰ δὲ οὐκ ἔχει τέχνην, κατὰ τὴν σύνεσιν ὑμῶν προνοήσατε, πῶς μὴ ἀργὸς μεθ᾽ ὑμῶν ζήσεται χριστιανός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/004.yaml
  text: But if he has no trade[a], according to your understanding make provision for how a Christian may live among you without being idle.
  footnotes:
  - marker: a
    text: Or 'provide, according to your understanding, how a Christian may not live idle among you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 만일 그에게 직업이 없으면, 여러분의 분별에 따라 그가 여러분 가운데서 어떻게 그리스도인으로서 게으르지 않게 살아갈 수 있을지 마련하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 분별에 따라, 그가 여러분 가운데서 게으르지 않게 살아가도록 어떻게 마련할지’.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ οὐκ ἔχει τέχνην
  english_pob_choice: if he has no trade
  chosen_korean: 만일 그에게 직업이 없으면
  alternatives_korean:
  - 만일 그가 기술이 없으면
  - 만일 생업이 없으면
  lexicon: τέχνην
  rationale: τέχνην은 단순한 ‘기술’보다 생계와 연결된 직업/업을 가리킬 수 있어, 문맥상 ‘직업’이 가장 자연스럽고 오해가 적습니다.
- source_word: κατὰ τὴν σύνεσιν ὑμῶν
  english_pob_choice: according to your understanding
  chosen_korean: 여러분의 분별에 따라
  alternatives_korean:
  - 여러분의 이해에 따라
  - 여러분이 아는 바에 따라
  lexicon: σύνεσιν
  rationale: σύνεσις는 단순 지식보다 상황을 분별하는 판단력을 뜻하므로, ‘분별’로 옮겨 문맥의 책임 있는 판단을 살렸습니다.
- source_word: προνοήσατε, πῶς μὴ ἀργὸς ... ζήσεται
  english_pob_choice: make provision for how a Christian may live ... without being idle
  chosen_korean: 그가 여러분 가운데서 어떻게 그리스도인으로서 게으르지 않게 살아갈 수 있을지 마련하십시오
  alternatives_korean:
  - 그가 여러분 가운데서 어떻게 그리스도인으로서 게으르지 않게 살 수 있을지 배려하십시오
  - 그가 여러분 가운데서 게으름 없이 그리스도인으로 살아가도록 대비하십시오
  lexicon: προνοήσατε
  rationale: προνοήσατε는 단순히 ‘provide’보다 앞서 생각하고 준비하라는 뜻이 강해 ‘마련하십시오’로 옮겼습니다.
- source_word: χριστιανός
  english_pob_choice: Christian
  chosen_korean: 그리스도인
  alternatives_korean:
  - 기독교인
  - 그리스도 추종자
  lexicon: χριστιανός
  rationale: 초기 공동체 문맥에서 χριστιανός은 정체성 표지이므로, 한국어에서도 가장 직접적인 ‘그리스도인’을 유지했습니다.
theological_decisions:
- issue: ἔχει τέχνην / ἀργός와 공동체의 책임
  chosen_reading: 공동체가 나그네의 생계 방식을 분별하여 게으름 없이 살 수 있도록 준비해 주어야 한다는 실천적 지침으로 읽었습니다.
  alternative_readings:
  - 단순한 직업 소개 조항으로만 읽는 해석
  - 금지라기보다 권고적 규범으로만 약화시키는 해석
  rationale: 문장은 직업이 없는 방문자에 대해 공동체가 실제로 어떻게 도울지 제시하는 규범이므로, ‘마련하십시오’와 ‘게으르지 않게’의 긴장을 함께 살렸습니다.
  doctrine_reference: 공동체 윤리와 환대 실천
- issue: χριστιανός의 문법적 기능
  chosen_reading: ‘그리스도인으로서’는 그 사람의 행위 양식과 신분을 함께 드러내는 서술로 처리했습니다.
  alternative_readings:
  - ‘한 그리스도인이’라는 주어적 읽기
  - 단순한 명사 보충어로만 처리하는 읽기
  rationale: 문맥상 특정 인물의 생활 방식이 핵심이므로, 정체성 표지를 부사적으로 살려 ‘그리스도인으로서’라고 번역하는 편이 자연스럽습니다.
  doctrine_reference: 초기 교회 정체성과 생활 윤리
