source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δὲ θέλει πρὸς ὑμᾶς καθίσαι, τεχνίτης ὤν, ἐργαζέσθω καὶ φαγέτω·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/003.yaml
  text: But if he wants to settle among you and is a craftsman, let him work and eat.
translation:
  language: ko
  text: 그러나 그가 여러분 가운데 정착하기를 원하고 기술자라면, 일하여 먹게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλει πρὸς ὑμᾶς καθίσαι
  english_pob_choice: wants to settle among you
  chosen_korean: 여러분에게 머물기를 원하고
  alternatives_korean:
  - 여러분 가운데 정착하기를 원하고
  - 여러분 곁에 머물기를 원하고
  lexicon: θέλω / καθίζω
  rationale: 영어 POB의 'settle among you'는 단순한 방문이 아니라 공동체 안에 머무는 뜻을 담고 있으므로, 한국어에서는 과도한 이주 뉘앙스를 피하면서도 지속적 체류를 분명히 하는 '머물다'를 택했습니다.
- source_word: τεχνίτης
  english_pob_choice: a craftsman
  chosen_korean: 기술자
  alternatives_korean:
  - 장인
  - 공예가
  - 기능공
  lexicon: τεχνίτης
  rationale: τεχνίτης는 손으로 일하는 숙련된 직업인을 가리키므로, 현대 독자가 이해하기 쉬우면서도 직능을 드러내는 '기술자'로 옮겼습니다. 전통적 '장인'은 의미는 가깝지만 다소 문화적·미학적 뉘앙스가 강합니다.
- source_word: ἐργαζέσθω καὶ φαγέτω
  english_pob_choice: let him work and eat
  chosen_korean: 일하고 먹게 하십시오
  alternatives_korean:
  - 일하여 먹게 하십시오
  - 일하게 하고 먹게 하십시오
  lexicon: ἐργάζομαι / ἐσθίω
  rationale: 명령형의 병렬을 자연스러운 한국어로 살려 '일하고 먹게 하십시오'로 간결하게 옮겼습니다. 두 번째 동사는 허용의 결과를 드러내므로 '먹게 하십시오'가 원문의 허가/권면을 잘 반영합니다.
