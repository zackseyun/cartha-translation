source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ δ᾽ οὐ θέλει οὕτω ποιεῖν, χριστέμπορός ἐστι· προσέχετε ἀπὸ τῶν τοιούτων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/005.yaml
  text: But if he is not willing to do so, he is a Messiah-trader; beware of such people.
translation:
  language: ko
  text: 그러나 그가 그렇게 하려 하지 않으면, 그는 메시아 장사꾼입니다. 그런 사람들을 경계하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χριστέμπορός
  english_pob_choice: Messiah-trader
  chosen_korean: 메시아 장사꾼
  alternatives_korean:
  - 그리스도 장사꾼
  - 메시아 상인
  - 메시아 거래상
  lexicon: χριστός
  rationale: χριστός를 POB 기준에 따라 메시아로 옮기되, σύνθετος 표현의 비난조를 살리기 위해 직역적 ‘장사꾼’을 붙였습니다.
- source_word: προσέχετε ἀπὸ τῶν τοιούτων
  english_pob_choice: beware of such people
  chosen_korean: 그런 사람들을 경계하십시오
  alternatives_korean:
  - 그런 사람들을 조심하십시오
  - 그런 자들을 피하십시오
  - 그런 사람들을 주의하십시오
  lexicon: προσέχω + ἀπό
  rationale: 단순한 주의 환기를 넘는 경고이므로, 현대 한국어에서 공식적이고 직접적인 ‘경계하십시오’로 옮겼습니다.
- source_word: οὕτω ποιεῖν
  english_pob_choice: do so
  chosen_korean: 그렇게 하다
  alternatives_korean:
  - 그리하다
  - 이렇게 하다
  lexicon: ποιέω
  rationale: 앞선 맥락의 요청된 행위를 가리키는 지시적 표현이므로 자연스럽게 ‘그렇게 하다’로 처리했습니다.
theological_decisions:
- issue: χριστός의 호칭 처리
  chosen_reading: 메시아로 번역해 인물호칭이 아니라 칭호로서의 의미를 드러냈습니다.
  alternative_readings:
  - 그리스도
  - 기름부음 받은 이
  rationale: POB의 누적 정책과 본문의 풍자적 합성어 구조를 따라 ‘메시아’가 가장 직접적으로 의미를 전달합니다.
  doctrine_reference: POB glossary policy for Χριστός (titular)
