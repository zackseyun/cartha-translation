  timestamp: '2026-07-13T20:10:13Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 조건절 ἐὰν ᾖ ἀνάγκη는 이틀 또는 사흘의 제한된 체류에 관련됩니다. 초안은 이를 ‘필요가 있는 경우가 아니면’으로 앞세워, 필요가 있을 경우에는 기간 제한 없이 머물 수 있다는 뜻으로 읽힐 수 있으며, ‘이상’도 원문에 없는 상한 방식의 표현입니다.
  naturalness: ‘들어오는 이’보다 문맥상 방문하여 오는 사람을 가리키는 ‘오는 이’가 자연스럽습니다. 수정문은 현대 표준어 합쇼체를 유지하면서 조건과 기간 제한의 관계를 분명히 합니다.
  terminology: ‘길손’은 παρόδιος의 일시적으로 지나가는 여행자라는 뉘앙스를 자연스럽게 살립니다. ‘필요가 있으면’은 ἀνάγκη를 교리적 또는 과도하게 구체적인 사정으로 한정하지 않는 중립적인 표현입니다.
  issues:
  - severity: high
    issue: 조건절의 범위가 바뀌어 체류 제한의 의미가 흐려집니다.
    rationale: ‘필요가 있는 경우가 아니면, 이틀이나 사흘 이상 ... 머물지 못합니다’는 필요가 있을 때에는 ‘이틀이나 사흘 이상’ 머무를 수 있다는 예외처럼 읽힙니다. 원문은 필요가 있을 경우에도 허용되는 체류를 이틀 또는 사흘로 한정합니다.
  - severity: medium
    issue: ‘이상’은 원문에 없는 표현입니다.
    rationale: εἰ μὴ δύο ἢ τρεῖς ἡμέρας는 ‘이틀이나 사흘 외에는/동안만’이라는 제한이며, ‘이상’이라는 최소 기간 또는 상한 초과의 틀을 직접 제시하지 않습니다.
  - severity: medium
    issue: 각주가 본문의 의미를 정확히 보완하지 못하고 행위 주체를 바꿉니다.
    rationale: 원문은 여행자가 머무는 것을 서술·규정하지만, 각주는 ‘머물게 하십시오’라고 하여 수신자에게 허가 행위를 명령하는 형태로 바꿉니다.
  revised_text: 오는 이가 길손이면, 할 수 있는 한 그를 도와주십시오. 그러나 필요가 있으면, 이틀이나 사흘 동안만 여러분과 함께 머물 수 있습니다.
