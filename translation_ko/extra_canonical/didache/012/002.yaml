id: DID.12.2
reference: Didache 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/002.yaml
  text: If the one who comes is a traveler[a], help him as much as you can; but he shall not remain with you except for two or three days, if there is a need.
  footnotes:
  - marker: a
    text: Or 'But if the one who comes is a traveler, help him as much as you can; he shall not remain with you for more than two or three days, should there be a need.'.
    reason: previous_rendering
translation:
  language: ko
  text: 오는 이가 길손이면, 할 수 있는 한 그를 도와주십시오. 그러나 필요가 있으면, 이틀이나 사흘 동안만 여러분과 함께 머물 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρόδιος
  english_pob_choice: traveler
  chosen_korean: 길손
  alternatives_korean:
  - 나그네
  - 여행자
  lexicon: παρόδιος
  rationale: 여기서는 단순한 이동자보다 ‘지나가는 길의 사람’이라는 임시 체류 뉘앙스가 있어, 교회적 문맥에서 자연스러운 ‘길손’이 가장 잘 맞습니다.
- source_word: βοηθεῖτε αὐτῷ ὅσον δύνασθε
  english_pob_choice: help him as much as you can
  chosen_korean: 할 수 있는 한 그를 도와주십시오
  alternatives_korean:
  - 가능한 만큼 그를 돕습니다
  - 할 수 있는 대로 그를 도와주십시오
  lexicon: βοηθέω
  rationale: 명령형의 직접성을 살리되, 한국어에서 자연스러운 공손체 명령으로 옮겨 원문의 실천적 권면을 분명히 했습니다.
- source_word: οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας
  english_pob_choice: he shall not remain with you except for two or three days
  chosen_korean: 그러나 필요가 있는 경우가 아니면, 이틀이나 사흘 이상 여러분과 함께 머물지 못합니다
  alternatives_korean:
  - 그러나 필요한 경우가 아니면, 이틀이나 사흘만 여러분과 함께 머뭅니다
  - 그러나 필요가 있을 때를 제외하고는, 이틀이나 사흘 이상 여러분과 함께 머물지 못합니다
  lexicon: μένω; εἰ μὴ; δύο ἢ τρεῖς ἡμέρας
  rationale: '`οὐ ... εἰ μὴ`의 제한 구조를 반영해 ‘~이상 머물지 못합니다’로 옮기고, `δὲ`는 앞절과의 대비를 드러내는 ‘그러나’로 처리했습니다.'
- source_word: ἐὰν ᾖ ἀνάγκη
  english_pob_choice: if there is a need
  chosen_korean: 필요가 있는 경우
  alternatives_korean:
  - 필요가 있으면
  - 사정이 있으면
  lexicon: ἀνάγκη
  rationale: 문맥상 예외를 넓히지 않도록, 필요의 존재를 조건으로만 남기는 중립적 표현을 사용했습니다.
theological_decisions:
- issue: 나그네/길손에 대한 환대와 체류 제한의 병치
  chosen_reading: 낯선 방문자에 대한 도움은 적극적으로 요구하되, 공동체의 경계와 질서를 위해 체류 기간은 제한됩니다.
  alternative_readings:
  - 무조건적인 환대 강조
  - 공동체 규율 중심의 제한 강조
  rationale: 원문은 도움과 제한을 동시에 명령하므로, 어느 한쪽을 약화하지 않고 병치를 그대로 드러내는 것이 본문 취지에 충실합니다.
  doctrine_reference: 초대교회 공동체 규범
