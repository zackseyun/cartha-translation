revisions:
- from: 들어오는 이가 길손이면, 할 수 있는 한 그를 도와주십시오. 그러나 필요가 있는 경우가 아니면, 이틀이나 사흘 이상 여러분과 함께 머물지 못합니다.[a]
  to: 오는 이가 길손이면, 할 수 있는 한 그를 도와주십시오. 그러나 필요가 있으면, 이틀이나 사흘 동안만 여러분과 함께 머물 수 있습니다.
  rationale: 조건절을 기간 제한과 직접 연결하여, 필요가 있을 때 허용되는 체류가 이틀 또는 사흘로 제한된다는 원문의 구문을 보존했습니다. 부정-예외 구조는 한국어에서 자연스러운 제한 허용 표현인 ‘…동안만 머물 수 있습니다’로 옮겼습니다. 의미를 바꾸는 기존 대안 각주는 삭제했습니다.
