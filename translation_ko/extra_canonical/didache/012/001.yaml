id: DID.12.1
reference: Didache 12:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012/001.yaml
  text: But let everyone who comes in the name of the Lord be received; then, after testing him, you will know, for you will have understanding of right and left.
  footnotes:
  - marker: a
    text: Or 'you will know him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 주님의 이름으로 오는 사람은 누구든지 받아들이십시오. 그런 다음 그를 시험해 본 뒤 알게 될 것입니다.[a] 왜냐하면 여러분에게는 좌우를 분별할 지각이 있을 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 “그를 알게 될 것입니다”로도 옮길 수 있습니다.
    reason: γνώσεσθε는 원문에서 목적어 없이 쓰였으므로 본문은 이를 보충하지 않았다. 다만 앞선 ‘그를 시험해 본 뒤’와 연결하여 목적어를 보충한 번역도 가능하다.
lexical_decisions:
- source_word: ἐν ὀνόματι Κυρίου
  english_pob_choice: in the name of the Lord
  chosen_korean: 주님의 이름으로
  alternatives_korean:
  - 주님의 이름 안에서
  - 주님의 명으로
  lexicon: κύριος → 주님; ὄνομα → 이름
  rationale: 성경적 관용구를 살리되 한국어로 자연스럽게 옮기기 위해 ‘주님의 이름으로’로 처리했습니다. ‘명으로’도 가능하지만 현대 합쇼체 문맥에서는 덜 자연스럽습니다.
- source_word: δεχξήσθω
  english_pob_choice: be received
  chosen_korean: 받아들이십시오
  alternatives_korean:
  - 영접하십시오
  - 받으십시오
  lexicon: δέχομαι
  rationale: 손님을 맞아들이는 행위를 분명히 하면서도, 단순 수령보다 사람을 환대하는 뉘앙스를 살리기 위해 ‘받아들이십시오’를 택했습니다.
- source_word: δοκιμάσαντες αὐτὸν
  english_pob_choice: after testing him
  chosen_korean: 그를 시험해 보고 나서
  alternatives_korean:
  - 그를 검증해 보고 나서
  - 그를 살펴본 뒤
  lexicon: δοκιμάζω
  rationale: δοκιμάζω의 ‘시험하여 진가를 분별하다’는 뜻을 살려, 단순 관찰보다 더 강한 분별 행위를 드러냈습니다.
- source_word: σύνεσιν ... δεξιὰν καὶ ἀριστεράν
  english_pob_choice: understanding of right and left
  chosen_korean: 오른쪽과 왼쪽에 대한 분별
  alternatives_korean:
  - 좌우를 분별하는 이해
  - 오른손과 왼손에 대한 이해
  lexicon: σύνεσις
  rationale: 직역하면 ‘오른쪽과 왼쪽에 대한 이해’이지만, 문맥상 판단력·분별력을 가리키므로 ‘분별’로 옮겼습니다. 다만 원문의 표현을 보존하기 위해 ‘오른쪽과 왼쪽’도 함께 살렸습니다.
theological_decisions:
- issue: 구절의 마지막 절에서 γνώσεσθε를 어떻게 이해할 것인가
  chosen_reading: ‘그를 알게 될 것입니다’보다 ‘알게 될 것입니다/분별하게 될 것입니다’로, 직접목적어를 한국어에 추가하지 않았습니다.
  alternative_readings:
  - 그를 알게 될 것입니다
  - 그가 누구인지 알게 될 것입니다
  rationale: 그리스어 γνώσεσθε는 절대적으로 쓰여 ‘알아내다, 분별하다’의 뜻을 가지며, 이미 앞의 δοκιμάσαντες αὐτόν에서 ‘그를 시험해 본다’고 했으므로 뒤에 다시 ‘그를’ 보충하지 않는 편이 원문 구조를 더 정확히 반영합니다.
  doctrine_reference: 본문의 분별 권면은 교회 공동체의 식별과 질서에 관한 실천적 지침입니다.
