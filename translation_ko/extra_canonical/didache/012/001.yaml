revisions:
- from: 그러나 주님의 이름으로 오는 사람은 누구든지 받아들이십시오. 그런 다음 그를 시험해 보고 나서야 알게 될 것입니다. 왜냐하면 여러분은 오른쪽과 왼쪽에 대한 분별을 가지게 될 것이기 때문입니다.[a]
  to: 그러나 주님의 이름으로 오는 사람은 누구든지 받아들이십시오. 그런 다음 그를 시험해 본 뒤 알게 될 것입니다.[a] 왜냐하면 여러분에게는 좌우를 분별할 지각이 있을 것이기 때문입니다.
  rationale: 시간적 연결을 원문에 맞게 ‘시험해 본 뒤’로 수정하고, 목적어 없는 γνώσεσθε를 그대로 유지했습니다. 마지막의 관용적·압축적 표현은 ‘좌우를 분별할 지각’으로 옮겨 의미와 한국어 자연스러움을 함께 살렸으며, 각주 표지는 γνώσεσθε에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:57Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그를 시험해 보고 나서야’의 ‘야’는 원문의 단순한 시간적 순서(‘그를 시험한 뒤, 그러면’)보다 필연적·배타적 뉘앙스를 더합니다. 또한 마지막 표현은 원문의 ‘right and left’를 보존하면서 한국어에서 분별 능력을 뜻하도록 다듬을 필요가 있습니다. γνώσεσθε는 목적어 없이 쓰인 점을 유지합니다.
  naturalness: ‘오른쪽과 왼쪽에 대한 분별을 가지게 될 것입니다’는 현대 한국어에서 다소 부자연스럽습니다. ‘좌우를 분별할 지각이 있을 것입니다’가 간결하고 자연스럽습니다.
  terminology: ‘주님의 이름으로’, ‘받아들이십시오’, ‘시험해 본 뒤’는 적절합니다. ‘지각’은 σύνεσις의 이해력·분별력을 자연스럽게 나타내며, ‘좌우’로 원문의 병렬 표현도 유지합니다.
