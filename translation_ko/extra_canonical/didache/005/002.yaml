review_pass:
  verdict: revise
  source_fidelity: 몇몇 핵심 표현은 의미를 대체로 전달하지만, κολλώμενοι를 ‘매이지 않다’로 옮긴 것은 원문의 ‘붙들다/굳게 붙어 있다’와 방향이 다릅니다. 또한 ἀγαθῶν의 복수·인칭적 가능성, ἀγρυπνοῦντες의 목적 대조, φθορεῖς πλάσματος Θεοῦ의 ‘하나님의 피조물’이라는 뜻을 더 충실히 반영하는 편이 안전합니다.
  naturalness: 초안은 전반적으로 합쇼체를 유지하지만 ‘악한 것을 향해 깨어 있고’, ‘의로운 판단에도 매이지 않으며’는 현대 한국어에서 다소 부자연스럽거나 뜻이 흐려집니다. 병렬된 비난 목록은 ‘~하는 자들’의 구조를 유지하면 더 명료합니다.
  terminology: ‘진리’, ‘의의 보상’, ‘온유와 인내’, ‘자비’는 적절합니다. πλάσμα Θεοῦ는 ‘하나님의 작품’보다 창조된 존재라는 뜻을 보존하는 ‘하나님의 피조물’이 더 정확합니다. 본문의 ‘선한 이들/선한 것’은 문맥상 의도적으로 넓게 읽힐 수 있으므로, 인칭적 복수를 살린 ‘선한 이들을’로 번역하되 별도 해설 각주는 두지 않는 것이 좋습니다.
  issues:
  - severity: medium
    issue: οὐ κολλώμενοι를 ‘매이지 않으며’로 번역함
    rationale: κολλάω는 ‘붙다, 굳게 붙어 있다’이며, ‘매이다’는 속박되거나 얽히는 뜻으로 한국어의 의미 방향이 달라질 수 있습니다.
  - severity: medium
    issue: φθορεῖς πλάσματος Θεοῦ를 ‘하나님의 작품을 파괴하고’로 번역함
    rationale: πλάσμα은 만들어진 것, 피조물을 뜻합니다. ‘작품’은 예술 작품의 뉘앙스를 더하므로 ‘하나님의 피조물을 파괴하는 자들’이 원문에 가깝습니다.
  - severity: low
    issue: ‘악한 것을 향해 깨어 있고’라는 표현
    rationale: ἀγρυπνοῦντες οὐκ εἰς τὸ ἀγαθὸν, ἀλλ’ εἰς τὸ πονηρόν은 선을 위해서가 아니라 악을 위해 경계하고 힘쓰는 대조입니다. ‘악을 위해 깨어 있으며’가 더 직접적이고 자연스럽습니다.
  - severity: low
    issue: 번역 본문에 근거 없는 해설 각주가 부착됨
    rationale: 각주는 원문의 이문·번역상 쟁점 등을 밝혀야 합니다. 현 각주는 번역어의 신학·윤리적 범위를 확장하여 설명하므로 제거하는 것이 최적등가 번역 원칙에 맞습니다.
