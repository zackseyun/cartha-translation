base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/002.yaml
  text: persecutors of the good[a], hating truth, loving falsehood, not knowing the reward of righteousness, not clinging to what is good nor to righteous judgment, keeping watch not for what is good but for what is evil; from whom gentleness and patience are far, loving vain things, pursuing repayment, not showing mercy to the poor, not feeling distress for one who is oppressed, not knowing the one who made them, murderers of children, destroyers of God's handiwork, turning away from the one in need, oppressing the one under affliction, advocates of the rich, lawless judges of the poor, altogether sinful. Be delivered, children, from all these things.
  footnotes:
  - marker: a
    text: Or 'not laboring on behalf of one who is oppressed'.
    reason: previous_rendering
translation:
  language: ko
  text: 선한 것을 박해하는 자들, 진리를 미워하고 거짓을 사랑하며, 의의 보상을 알지 못하고, 선한 것에도 의로운 판단에도 매이지 않으며, 선한 것을 위해서가 아니라 악한 것을 향해 깨어 있고; 그들에게서 온유와 인내는 멀리 있으며, 헛된 것들을 사랑하고, 보답을 좇으며, 가난한 사람에게 자비를 베풀지 않고, 억눌린 사람을 두고 아파하지 않으며, 그들을 지으신 분을 알지 못하고, 자녀를 죽이며, 하나님의 작품을 파괴하고, 필요한 사람을 외면하며, 고난받는 사람을 괴롭히고, 부자들의 변호자이며, 가난한 사람들의 불법한 재판관들로서, 온통 죄로 가득합니다. 자녀들아, 이 모든 것에서 구출되십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선한 것’은 단지 도덕적으로 좋은 일반항이 아니라, 본문이 대조하는 선의 질서 전체를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: διῶκται ἀγαθῶν
  english_pob_choice: persecutors of the good
  chosen_korean: 선한 것을 박해하는 자들
  alternatives_korean:
  - 좋은 것을 박해하는 자들
  - 선한 사람들을 박해하는 자들
  lexicon: διώκτης, ἀγαθός
  rationale: ἀγαθῶν을 단순히 ‘좋은 것’으로 유지해 선을 대상화했고, διῶκται는 ‘박해하는 자들’로 옮겨 영어 POB의 의미를 보존했습니다.
- source_word: μισοῦντες ἀλήθειαν, ἀγαπῶντες ψεῦδος
  english_pob_choice: hating truth, loving falsehood
  chosen_korean: 진리를 미워하고 거짓을 사랑하며
  alternatives_korean:
  - 진실을 미워하고 거짓을 사랑하며
  - 진리를 증오하고 거짓을 사랑하며
  lexicon: ἀλήθεια, ψεῦδος
  rationale: ἀλήθεια는 문맥상 ‘진리’가 적절하고, ψεῦδος는 단순한 거짓말보다 더 포괄적인 ‘거짓’으로 옮겨 대조를 선명하게 했습니다.
- source_word: οὐ κολλώμενοι ἀγαθῷ οὐδὲ κρίσει δικαίᾳ
  english_pob_choice: not clinging to what is good nor to righteous judgment
  chosen_korean: 선한 것에도 의로운 판단에도 매이지 않으며
  alternatives_korean:
  - 선한 것에 붙어 있지 않고 의로운 판단에도 붙어 있지 않으며
  - 선한 것에 달라붙지 않고 의로운 판결에도 달라붙지 않으며
  lexicon: κολλάω, κρίσις δικαία
  rationale: κολλώμενοι는 ‘붙다/달라붙다’의 뜻이지만 한국어에서는 관계적 결속을 살리기 위해 ‘매이다’로 자연스럽게 옮겼고, κρίσει δικαίᾳ는 ‘의로운 판단’으로 간결하게 처리했습니다.
- source_word: οὐ πονοῦντες ἐπὶ καταπονουμένῳ
  english_pob_choice: not feeling distress for one who is oppressed
  chosen_korean: 억눌린 사람을 두고 아파하지 않으며
  alternatives_korean:
  - 억눌린 사람을 두고 괴로워하지 않으며
  - 억눌린 사람 때문에 마음 아파하지 않으며
  lexicon: πονέω, καταπονέω
  rationale: ἐπὶ + dative 구문은 단순 노동이 아니라 ‘슬퍼함/고통스러워함’의 뉘앙스를 가지므로, 개정된 영어 POB를 따라 공감의 결핍을 드러내는 ‘아파하지 않으며’로 옮겼습니다.
- source_word: πλουσίων παράκλητοι
  english_pob_choice: advocates of the rich
  chosen_korean: 부자들의 변호자이며
  alternatives_korean:
  - 부자들의 대변자이며
  - 부자들의 후원자이며
  lexicon: παράκλητος
  rationale: 여기서는 보혜사 용례가 아니라 ‘대변/옹호’의 일반적 의미이므로, 사회적 편향을 드러내는 ‘변호자’로 옮겼습니다.
theological_decisions:
- issue: τὸν ποιήσαντα αὐτούς의 신학적 지시 대상
  chosen_reading: 그들을 지으신 분을 알지 못하고
  alternative_readings:
  - 그들을 만드신 분을 알지 못하고
  - 그들을 창조하신 분을 알지 못하고
  rationale: 주체는 하나님에 대한 창조 행위이지만, 본문 자체는 후속절의 ‘하나님의 작품’과 병렬되므로 과도하게 해석하지 않고 중립적으로 ‘지으신 분’으로 처리했습니다.
  doctrine_reference: 창조주 하나님 인식에 대한 일반적 성경 신학
- issue: ῥυσθείητε, τέκνα, ἀπὸ τούτων ἁπάντων의 호소문체
  chosen_reading: 자녀들아, 이 모든 것에서 구출되십시오.
  alternative_readings:
  - 자녀들아, 이 모든 것에서 건져지십시오.
  - 자녀들아, 이 모든 것에서 구원받으십시오.
  rationale: ἀπὸ τούτων ἁπάντων은 도덕적 목록으로부터의 분리를 요청하는 절박한 명령이므로, 단순 정보 전달보다 강한 탈출 뉘앙스가 있는 ‘구출되십시오’로 옮겼습니다.
  doctrine_reference: 권면적 종말론/윤리적 분리 요청
