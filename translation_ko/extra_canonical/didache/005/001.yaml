  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη· πρῶτον πάντων πονηρά ἐστι καὶ κατάρας μεστή· φόνοι, μοιχεῖαι, ἐπιθυμίαι, πορνεῖαι, κλοπαί, εἰδωλολατρεῖαι, μαγεῖαι, φαρμακεῖαι, ἁρπαγαί, ψευδομαρτυρίαι, ὑποκρίσεις, διπλοκαρδία, δόλος, ὑπερηφανία, κακία, αὐθάδεια, πλεονεξία, αἰσχρολογία, ζηλοτυπία, θρασύτης, ὕψος, ἀλαζονεία·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/005/001.yaml
  text: 'But the way of death is this: first of all, it is evil and full of a curse: murders, adulteries, lusts, sexual immoralities, thefts, idolatries, sorceries, magic arts, robberies, false testimonies, hypocrisies, double-heartedness, deceit, arrogance, malice, self-will, greed, foul speech, jealousy, audacity, haughtiness, boastfulness;'
  footnotes:
  - marker: a
    text: Or 'full of curse'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 죽음의 길은 이것입니다. 무엇보다도 그것은 악하며 저주가 가득합니다. 살인, 간음, 정욕, 성적 부도덕, 도둑질, 우상숭배, 주술, 마술, 강탈, 거짓 증언, 위선, 두 마음, 속임, 교만, 악의, 제멋대로 함, 탐욕, 더러운 말, 질투, 대담함, 거만, 자만심입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저주가 가득합니다’는 그리스어 단수 속격 κατάρας를 자연스러운 한국어로 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: Ἡ δὲ τοῦ θανάτου ὁδός ἐστιν αὕτη
  english_pob_choice: But the way of death is this
  chosen_korean: 그러나 죽음의 길은 이것입니다
  alternatives_korean:
  - 죽음의 길은 이것입니다
  - 그런데 죽음의 길은 이것입니다
  lexicon: ὁδός→길; θάνατος→죽음
  rationale: 문장의 대조를 살려 δέ를 그러나로 옮기고, 선언문 구조를 간명하게 유지해 본문 도치의 힘을 살렸습니다.
- source_word: κατάρας μεστή
  english_pob_choice: full of a curse
  chosen_korean: 저주가 가득합니다
  alternatives_korean:
  - 한 저주로 가득합니다
  - 저주로 가득합니다
  lexicon: κατάρα→저주
  rationale: 그리스어 단수 속격이 영어에서 ‘a curse’로 정리된 점을 반영하되, 한국어에서는 자연스럽게 ‘저주가 가득합니다’로 옮겨 단수성의 의미를 보존했습니다.
- source_word: μαγεῖαι, φαρμακεῖαι
  english_pob_choice: sorceries, magic arts
  chosen_korean: 주술, 마술
  alternatives_korean:
  - 주술, 마법
  - 주술 행위, 마술
  lexicon: μαγεία/φαρμακεία→주술/마술
  rationale: 두 용어를 모두 마술적·주술적 행위로 구분해 두되, 현대 한국어에서 구별 가능한 표준어 어휘인 주술/마술로 대응했습니다.
- source_word: διπλοκαρδία
  english_pob_choice: double-heartedness
  chosen_korean: 두 마음
  alternatives_korean:
  - 이중심리
  - 양면성
  lexicon: διπλοκαρδία→두 마음
  rationale: 직역적 이미지를 유지해 내적 분열과 진정성 결여를 함께 드러내는 표현으로 옮겼습니다.
- source_word: αἰσχρολογία
  english_pob_choice: foul speech
  chosen_korean: 더러운 말
  alternatives_korean:
  - 상스러운 말
  - 음란한 말
  lexicon: αἰσχρολογία→더러운 말
  rationale: 도덕적·언어적 비천함을 포괄하는 표현으로, 영어 POB의 완곡한 톤을 유지했습니다.
theological_decisions:
- issue: 악한 길의 목록을 덧붙인 명사열의 성격
  chosen_reading: 본문은 단순한 죄목 나열이 아니라 ‘죽음의 길’의 특징을 규정하는 총체적 도덕-영적 진술로 읽었습니다.
  alternative_readings:
  - 윤리적 금지 목록으로만 읽는 해석
  - 수사적 과장에 가까운 경고로만 축소하는 해석
  rationale: 서두의 ‘악하며 저주가 가득하다’는 판단이 뒤따르는 목록 전체를 규정하므로, 목록을 평면적 체크리스트가 아니라 삶의 길의 성격 묘사로 보존했습니다.
  doctrine_reference: Didache의 두 길 교훈(윤리적 분별과 공동체 형성)
