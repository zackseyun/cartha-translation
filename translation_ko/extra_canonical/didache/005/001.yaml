  to: 그러나 죽음의 길은 이렇습니다. 무엇보다 먼저, 그것은 악하고 저주로 가득합니다. 살인, 간음, 정욕, 성적 부도덕, 도둑질, 우상숭배, 주술, 마술, 강탈, 거짓 증언, 위선, 두 마음을 품음, 속임, 교만, 악의, 고집스러움, 탐욕, 상스러운 말, 질투, 뻔뻔함, 거만, 허세입니다.
