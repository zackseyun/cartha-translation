source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Δευτέρα δὲ ἐντολὴ τῆς διδαχῆς Οὐ φονεύσεις, οὐ μοιχεύσεις, οὐ παιδοφθορήσεις, οὐ πορνεύσεις, οὐ κλέψεις, οὐ μαγεύσεις, οὐ φαρμακεύσεις, οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς. Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, οὐκ ἐπιορκήσεις, οὐ ψευδομαρτυρήσεις, οὐ κακολογήσεις, οὐ μνησικακήσεις. Οὐκ ἔσῃ διγνώμων οὐδὲ δίγλωσσος· παγὶς γὰρ θανάτου ἡ διγλωσσία. Οὐκ ἔσται ὁ λόγος σου ψευδής, οὐ κενός, ἀλλὰ μεμεστωμένος πράξει. Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου. Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
  pages:
  - 18
  - 20
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002.yaml
  text: 'And the second commandment of the teaching is this: You shall not murder[a]; you shall not commit adultery; you shall not corrupt boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not murder a child by abortion, nor kill one that has been born.b You shall not desire the things of your neighbor; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge. You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death. Your word shall not be false or empty, but filled with action.c You shall not be greedy, nor grasping, nor a hypocrite, nor ill-disposed, nor arrogant. You shall not form an evil plan against your neighbor. You shall not hate every person;d but some you shall reprove, for some you shall pray[d][c][b], and some you shall love more than your own life.'
  footnotes:
  - marker: a
    text: Or 'abuse boys' or 'commit pederasty'; the Greek term refers specifically to the sexual corruption of boys.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'you shall not murder a child in destruction, nor kill one that has been born'—a twofold prohibition covering destruction before birth and killing after birth.
    reason: lexical_alternative
  - marker: c
    text: Or 'fulfilled by action.' The Greek literally means 'having been filled with action/deed.'
    reason: lexical_alternative
  - marker: d
    text: Greek 'any man' uses a masculine singular form with representative force.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 가르침의 둘째 계명은 이렇습니다. 「살인하지 마십시오. 간음하지 마십시오. 소년을 성적으로 타락시키지 마십시오. 성적 부정을 저지르지 마십시오. 도둑질하지 마십시오. 마술을 행하지 마십시오. 주술을 사용하지 마십시오. 낙태로 아이를 죽이지도, 이미 태어난 이를 죽이지도 마십시오. 이웃의 것을 탐내지 마십시오. 거짓 맹세하지 마십시오. 거짓 증언하지 마십시오. 악담하지 마십시오. 원한을 품지 마십시오. 두 마음을 품은 사람이 되지 마십시오. 두 혀를 가진 사람이 되지 마십시오. 두 혀를 쓰는 말은 죽음의 올무이기 때문입니다. 당신의 말은 거짓되거나 공허해서는 안 되며, 행위로 채워져 있어야 합니다. 탐욕스럽거나, 강탈하는 사람이거나, 위선자이거나, 악의적인 사람이거나, 교만한 사람이 되지 마십시오. 이웃을 향해 악한 계획을 세우지 마십시오. 모든 사람을 미워하지 마십시오. 그러나 어떤 이들은 책망하고, 어떤 이들은 위해 기도하고, 어떤 이들은 자기 생명보다 더 사랑하십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 소년을 ‘성적으로 타락시키다’는 표현은 그리스어 παιδοφθορήσεις의 성적 함의를 드러내기 위한 번역 선택입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘낙태로 아이를 죽이다, 이미 태어난 이를 죽이다’는 φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς의 이중 금지를 현대 한국어로 분명하게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘행위로 채워져 있어야 합니다’는 μεμεστωμένος πράξει의 직역적 이미지를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδαχή
  english_pob_choice: the teaching
  chosen_korean: 가르침
  alternatives_korean:
  - 교훈
  - 가르침의 가르침
  - 가르침(교훈)
  lexicon: BDAG
  rationale: 본문의 정관사 있는 διδαχή를 특정한 공동체적 가르침으로 읽되, 한국어에서는 ‘가르침’이 가장 자연스럽고 기술적인 뉘앙스를 유지합니다.
- source_word: παιδοφθορήσεις
  english_pob_choice: corrupt boys
  chosen_korean: 소년을 성적으로 타락시키지 마십시오
  alternatives_korean:
  - 소년을 해치지 마십시오
  - 소년을 학대하지 마십시오
  - 소년을 성적으로 학대하지 마십시오
  lexicon: LSJ
  rationale: 그리스어는 소년의 성적 타락을 가리키므로, 단순한 ‘학대’보다 성적 의미를 드러내는 표현을 택했습니다.
- source_word: πορνεύσεις
  english_pob_choice: commit sexual immorality
  chosen_korean: 성적 부정을 저지르지 마십시오
  alternatives_korean:
  - 음행하지 마십시오
  - 성적 부도덕을 행하지 마십시오
  - 간음하지 마십시오
  lexicon: BDAG
  rationale: 넓은 성윤리 범주를 지시하므로, ‘간음’으로 좁히지 않고 한국어에서 포괄성이 살아나는 표현을 택했습니다.
- source_word: διγνώμων / δίγλωσσος / διγλωσσία
  english_pob_choice: double-minded / double-tongued / double-tongued speech
  chosen_korean: 두 마음을 품은 사람 / 두 혀를 가진 사람 / 두 혀를 쓰는 말
  alternatives_korean:
  - 양면적인 사람 / 이중적인 말
  - 의심 많은 사람 / 말이 두 개인 사람
  - 우유부단한 사람 / 이중언어를 쓰는 사람
  lexicon: BDAG / LSJ
  rationale: 윤리적 분열과 언어적 위선을 각각 드러내기 위해, 심리적 항목은 ‘두 마음’, 언어적 항목은 ‘두 혀’로 대응시켰습니다.
- source_word: μεμεστωμένος πράξει
  english_pob_choice: filled with action
  chosen_korean: 행위로 채워져 있어야 합니다
  alternatives_korean:
  - 행동으로 가득해야 합니다
  - 실천으로 충만해야 합니다
  - 행위가 가득해야 합니다
  lexicon: LSJ
  rationale: ‘말이 행위로 채워져 있다’는 원문의 역설적 이미지를 살리면서 한국어로도 자연스럽게 들리도록 옮겼습니다.
- source_word: ὑπὲρ τὴν ψυχήν σου
  english_pob_choice: more than your own life
  chosen_korean: 자기 생명보다 더 사랑하십시오
  alternatives_korean:
  - 자기 목숨보다 더 사랑하십시오
  - 자기 영혼보다 더 사랑하십시오
  - 자기 생명 이상으로 사랑하십시오
  lexicon: BDAG
  rationale: ψυχή를 여기서는 ‘생명/목숨’의 뜻으로 읽어, 현대 한국어에서 가장 직접적인 ‘생명’으로 옮겼습니다.
theological_decisions:
- issue: Οὐ μισήσεις πάντα ἄνθρωπον의 범위
  chosen_reading: 모든 사람을 미워하지 마십시오
  alternative_readings:
  - 어떤 사람도 미워하지 마십시오
  - 모든 이를 미워하지 마십시오
  rationale: πάντα ἄνθρωπον의 보편성을 살리되, 한국어에서 너무 딱딱한 직역보다 자연스러운 윤리 명령으로 정리했습니다.
  doctrine_reference: Gender-inclusive sense in context; preserve universal ethical scope.
- issue: 마지막 삼중 응답의 순서와 긴장
  chosen_reading: 어떤 이들은 책망하고, 어떤 이들은 위해 기도하고, 어떤 이들은 자기 생명보다 더 사랑하십시오
  alternative_readings:
  - 어떤 이들은 책망하고, 어떤 이들을 위해 기도하며, 어떤 이들은 사랑하십시오
  rationale: 원문은 사람들에 대한 서로 다른 대응을 병렬로 제시하므로, 기준을 평탄화하지 않고 삼중 구조를 유지했습니다.
  doctrine_reference: Preserve interpretive tension in paraenetic instruction.
