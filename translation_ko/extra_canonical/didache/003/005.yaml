source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ψεύστης· ἐπειδὴ ὁδηγεῖ τὸ ψεῦσμα εἰς τὴν κλοπήν· μηδὲ φιλάργυρος μηδὲ κενόδοξος· ἐκ γὰρ τούτων ἁπάντων κλοπαὶ γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/005.yaml
  text: My child, do not become a liar, since lying leads to theft; nor be money-loving, nor vainglorious, for from all these thefts are born.
translation:
  language: ko
  text: 내 아이야, 거짓말쟁이가 되지 마십시오. 거짓말은 도둑질로 이끌기 때문입니다. 돈을 사랑하는 사람이 되지도, 허영심 많은 사람이 되지도 마십시오. 이 모든 것에서 온갖 도둑질이 생겨납니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  english_pob_choice: My child
  chosen_korean: 내 아이야
  alternatives_korean:
  - 내 자녀야
  - 내 아이야, 내 사랑하는 자녀야
  lexicon: source-direct vocative
  rationale: 직설적이고 친밀한 호칭을 살리되, 본문의 훈계체에 맞게 자연스러운 한국어로 옮겼습니다.
- source_word: ψεύστης / ψεῦσμα
  english_pob_choice: liar / lying
  chosen_korean: 거짓말쟁이 / 거짓말
  alternatives_korean:
  - 거짓말하는 사람 / 거짓말
  - 거짓말쟁이 / 거짓됨
  lexicon: source-direct moral vocabulary
  rationale: 명사형 ψεύστης는 ‘거짓말쟁이’로, 원인절의 ψεῦσμα는 행위로서의 ‘거짓말’로 구분해 반복 구조를 유지했습니다.
- source_word: φιλάργυρος
  english_pob_choice: money-loving
  chosen_korean: 돈을 사랑하는 사람
  alternatives_korean:
  - 탐욕스러운 사람
  - 돈에 집착하는 사람
  lexicon: compound adjective
  rationale: ‘money-loving’의 직역적 의미를 보존해, 단순한 재물 욕심보다 돈에 대한 애착 자체를 드러냈습니다.
- source_word: κενόδοξος
  english_pob_choice: vainglorious
  chosen_korean: 허영심 많은 사람
  alternatives_korean:
  - 헛된 영광을 추구하는 사람
  - 허영에 빠진 사람
  lexicon: compound adjective
  rationale: 전통적 교회어 ‘헛된 영광’보다 현대 한국어에서 의미가 즉시 드러나는 표현을 택했습니다.
theological_decisions:
- issue: 반복되는 금지 명령의 어조
  chosen_reading: ‘되지 마십시오’로 공손한 훈계체를 사용해 공동체 교훈의 직접성을 살렸습니다.
  alternative_readings:
  - ‘되면 안 됩니다’
  - ‘하지 마십시오’
  rationale: 본문은 아버지/교사가 자녀에게 주는 직접 경고이므로, 명령의 강도를 유지하면서도 현대 합쇼체에 맞추었습니다.
  doctrine_reference: Didache moral instruction style
