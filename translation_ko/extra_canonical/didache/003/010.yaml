id: DID.3.10
reference: Didache 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τὰ συμβαίνοντά σοι ἐνεργήματα ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ Θεοῦ οὐδὲν γίνεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/010.yaml
  text: You shall accept the things that happen to you as good, knowing that apart from God nothing happens.
translation:
  language: ko
  text: 하나님 없이는 아무 일도 일어나지 않는다는 것을 아시고, 그대에게 일어나는 일들을 선한 것으로 받아들이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὰ συμβαίνοντά σοι
  english_pob_choice: the things that happen to you
  chosen_korean: 당신에게 일어나는 모든 일들
  alternatives_korean:
  - 당신에게 닥치는 사건들
  - 당신에게 일어나는 일들
  lexicon: συμβαίνω
  rationale: 사건으로 좁히기보다, POB의 ‘things that happen to you’를 따라 보다 넓게 ‘일들’로 옮기되, 문맥상 모든 일이라는 포괄성을 살렸습니다.
- source_word: ἐνεργήματα
  english_pob_choice: things
  chosen_korean: 일들
  alternatives_korean:
  - 사건들
  - 일
  lexicon: ἐνέργημα
  rationale: 영어 POB가 ‘events’보다 넓은 ‘things’로 정리한 점을 반영하여, 한국어도 사건보다 포괄적인 ‘일들’로 번역했습니다.
- source_word: ὡς ἀγαθὰ
  english_pob_choice: as good
  chosen_korean: 선한 것으로
  alternatives_korean:
  - 좋은 것으로
  - 선하다고
  lexicon: ἀγαθός
  rationale: 단순한 감정적 ‘좋다’보다 도덕적·신학적 평가를 드러내기 위해 ‘선한 것’으로 옮겼습니다.
- source_word: ἄτερ Θεοῦ
  english_pob_choice: apart from God
  chosen_korean: 하나님 없이는
  alternatives_korean:
  - 하나님과 떨어져서는
  - 하나님을 떠나서는
  lexicon: Θεός
  rationale: 전치사구의 의존 관계를 자연스럽게 살리면서도, 하나님의 주권 밖에서는 아무 일도 일어나지 않는다는 뜻을 간결하게 드러냈습니다.
theological_decisions:
- issue: ‘아무것도 일어나지 않는다’의 절대성
  chosen_reading: 하나님 없이는 아무것도 일어나지 않는다는 진술을 그대로 유지했습니다.
  alternative_readings:
  - 하나님 뜻 없이 아무 일도 일어나지 않는다는 뜻으로 완화
  - 하나님 없이 아무것도 존재하지 않는다는 형이상학적 진술로 확장
  rationale: 원문은 발생/일어남의 부정을 말하므로, 존재론적 확장이나 의지론적 완화 없이 사건의 발생을 직접적으로 번역했습니다.
  doctrine_reference: 섭리와 하나님의 주권에 대한 일반적 고백
