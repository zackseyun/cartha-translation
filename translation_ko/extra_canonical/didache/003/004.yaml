  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου οἰωνοσκόπος· ἐπειδὴ ὁδηγεῖ εἰς τὴν εἰδωλολατρείαν· μηδὲ ἐπαοιδὸς μηδὲ μαθηματικὸς μηδὲ περικαθαίρων, μηδὲ θέλε αὐτὰ βλέπειν· ἐκ γὰρ τούτων ἁπάντων εἰδωλολατρεία γεννᾶται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/004.yaml
  text: My child[a], do not become an observer of omens, because it leads to idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look at these things; for from all these idolatry is born.
  footnotes:
  - marker: a
    text: Or 'nor even be willing to look upon them'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아이야, 징조를 살피는 자가 되지 마십시오. 그것은 우상숭배로 이끌기 때문입니다. 또한 주술사도, 점성술사도, 정결 의식을 행하는 자도 되지 말며, 심지어 이런 것들을 보려 하지도 마십시오. 왜냐하면 이런 모든 것에서 우상숭배가 생겨나기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 바라보려 하지도 마십시오’라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον μου
  english_pob_choice: My child
  chosen_korean: 내 아이야
  alternatives_korean:
  - 내 자녀야
  - 내 아이여
  lexicon: τέκνον
  rationale: 직접 호칭의 친밀함을 살리면서도 문어체로 읽히게 했습니다. ‘내 아이야’는 본문의 보호적 권면을 자연스럽게 드러냅니다.
- source_word: οἰωνοσκόπος
  english_pob_choice: observer of omens
  chosen_korean: 징조를 살피는 자
  alternatives_korean:
  - 길흉을 점치는 자
  - 조짐을 관찰하는 자
  lexicon: οἰωνοσκόπος
  rationale: 문맥상 점복·징조 해석을 뜻하므로, 전통적 교회어보다 원문의 점술 행위를 드러내는 표현을 택했습니다.
- source_word: ἐπαοιδός / μαθηματικός / περικαθαίρων
  english_pob_choice: enchanter / astrologer / one who performs purifications
  chosen_korean: 주술사 / 점성술사 / 정결 의식을 행하는 자
  alternatives_korean:
  - 주문을 거는 자 / 천문가 / 부정을 씻는 자
  - 주문사 / 역술가 / 정화 의식을 하는 자
  lexicon: ἐπαοιδός; μαθηματικός; περικαθαίρων
  rationale: 세 항목 모두 고대 주술·점성술·정화 의례의 실제 행위를 가리키므로, 각각의 기능이 드러나도록 대응시켰습니다.
- source_word: μηδὲ θέλε αὐτὰ βλέπειν
  english_pob_choice: nor even be willing to look at these things
  chosen_korean: 심지어 이런 것들을 보려 하지도 마십시오
  alternatives_korean:
  - 심지어 그것들을 보려 하지도 마십시오
  - 심지어 그런 것들을 보고 싶어하지도 마십시오
  lexicon: αὐτὰ
  rationale: αὐτὰ는 중성 복수로 앞의 인물들이 아니라 그 행위와 대상들을 가리키므로 ‘이런 것들’로 옮겼습니다.
theological_decisions:
- issue: 우상숭배로 이끄는 행위 금지의 강도
  chosen_reading: 본문의 권면을 단순한 경계가 아니라 실제 참여와 시선의 의도까지 금하는 것으로 옮겼습니다.
  alternative_readings:
  - 가볍게 경계하는 의미로 완화
  - ‘보지 말라’를 단순한 호기심 금지로 축소
  rationale: 그리스어는 징조 관찰, 주술, 점성술, 정화 의식 전체를 우상숭배의 발생 원인으로 제시하므로, 행동과 의향 모두를 강하게 금지하는 흐름을 유지해야 합니다.
  doctrine_reference: 우상숭배 금지, 신명기 18장 관련 경고의 연속성
