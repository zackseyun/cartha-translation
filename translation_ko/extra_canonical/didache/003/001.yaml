  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: ko
  text: 내 아이야, 모든 악한 것과 그것과 같은 모든 것에서 도망치십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 악한 것’은 악 자체를 넓게 가리키는 표현입니다.
