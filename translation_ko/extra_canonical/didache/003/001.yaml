  yaml_path: translation/extra_canonical/didache/003/001.yaml
  text: My child, flee from every evil thing, and from everything like it.
translation:
  language: ko
  text: 나의 자녀여, 모든 악한 것과 그것과 같은 모든 것을 피하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  english_pob_choice: My child
  chosen_korean: 내 아이야
  alternatives_korean:
  - 내 자녀야
  - 내 아들아/내 딸아
  lexicon: τέκνον
  rationale: 직접적 호칭의 친밀함과 권면의 긴급성을 살리되, 성중립적이고 자연스러운 현대 한국어로 옮겼습니다.
- source_word: φεῦγε
  english_pob_choice: flee
  chosen_korean: 도망치십시오
  alternatives_korean:
  - 피하십시오
  - 달아나십시오
  lexicon: φεύγω
  rationale: 단순한 회피가 아니라 강한 긴급성을 가진 도피 명령이므로, 합쇼체의 명령형으로 분명하게 표현했습니다.
- source_word: ἀπὸ παντὸς πονηροῦ
  english_pob_choice: from every evil thing
  chosen_korean: 모든 악한 것에서
  alternatives_korean:
  - 모든 악에서
  - 모든 악한 일에서
  lexicon: πονηρός
  rationale: 형용사형의 추상 명사화보다, 원문의 ‘악한 것’이라는 포괄적 대상을 그대로 드러내는 표현을 택했습니다.
- source_word: ἀπὸ παντὸς ὁμοίου αὐτοῦ
  english_pob_choice: from everything like it
  chosen_korean: 그것과 같은 모든 것에서
  alternatives_korean:
  - 그와 같은 모든 것에서
  - 그것과 비슷한 모든 것에서
  lexicon: ὅμοιος
  rationale: ‘그것’이 앞의 ‘악한 것’을 가리키는 지시 관계를 살려, 동일 계열의 유사한 것까지 포함하는 반복 금지를 분명히 했습니다.
theological_decisions:
- issue: 악을 피하라는 윤리적 명령의 범위
  chosen_reading: 악 자체뿐 아니라 그것과 유사한 것까지 함께 피하라는, 경계선을 넓힌 지시로 읽었습니다.
  alternative_readings:
  - 악한 행위만 피하라는 일반적 권고
  - 우상숭배적 요소만을 가리키는 제한적 경고
  rationale: 본문이 ‘모든 악한 것’과 ‘그것과 같은 모든 것’을 병렬로 말하므로, 단순한 금지보다 유사한 것까지 경계하라는 확장된 윤리적 요구를 드러내는 것이 원문에 더 가깝습니다.
  doctrine_reference: Didache의 제자도 윤리
