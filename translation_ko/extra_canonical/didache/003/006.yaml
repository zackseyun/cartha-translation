  to: 내 아이야, 불평하는 사람이 되지 마십시오. 그것은 모독으로 이끕니다. 또한 제멋대로인 사람이 되지도 말고, 악한 마음을 품지도 마십시오. 이 모든 것에서 모독의 말들이 생겨납니다.
