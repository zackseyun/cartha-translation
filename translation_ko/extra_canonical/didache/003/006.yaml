id: DID.3.6
reference: Didache 3:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου γόγγυσος· ἐπειδὴ ὁδηγεῖ εἰς τὴν βλασφημίαν· μηδὲ αὐθάδης μηδὲ πονηρόφρων· ἐκ γὰρ τούτων ἁπάντων βλασφημίαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/006.yaml
  text: My child, do not become a grumbler, since it leads to blasphemy; nor self-willed, nor evil-minded, for from all these blasphemies are born.
translation:
  language: ko
  text: 내 아이야, 불평하는 사람이 되지 마십시오. 그것은 모독으로 이끕니다. 또한 제멋대로인 사람이 되지도 말고, 악한 마음을 품지도 마십시오. 이 모든 것에서 모독의 말들이 생겨납니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνον μου
  english_pob_choice: My child
  chosen_korean: 내 아이야
  alternatives_korean:
  - 내 자녀야
  - 내 아이여
  lexicon: source direct address
  rationale: 직접 호소형 친근함을 살리되, 현대 한국어에서 자연스럽고 부드러운 호칭으로 옮겼습니다. 합쇼체 본문 안에서 권면의 직접성을 유지합니다.
- source_word: γόγγυσος
  english_pob_choice: a grumbler
  chosen_korean: 투덜대는 사람
  alternatives_korean:
  - 불평하는 사람
  - 투덜거리는 사람
  lexicon: source direct address
  rationale: 단순한 ‘불평’보다 반복적이고 불만 섞인 태도를 드러내는 말로 옮겨, 이어지는 ‘비방’과의 연결을 살렸습니다.
- source_word: βλασφημίαν / βλασφημίαι
  english_pob_choice: blasphemy / blasphemies
  chosen_korean: 비방
  alternatives_korean:
  - 신성모독
  - 모독
  lexicon: source direct address
  rationale: 이 문맥은 하나님에 대한 직격 표현이라기보다, 불평과 자기중심성이 낳는 모독성 있는 말하기를 가리키므로, 한국어에서 그 흐름을 더 직접적으로 드러내는 ‘비방’을 택했습니다.
- source_word: αὐθάδης
  english_pob_choice: self-willed
  chosen_korean: 제멋대로 굴지
  alternatives_korean:
  - 고집부리지
  - 자기 뜻만 고집하지
  lexicon: source direct address
  rationale: 형용사적 성격을 한국어 동사 구문으로 자연스럽게 풀어, 완고한 자기주장과 행동을 함께 포착했습니다.
- source_word: πονηρόφρων
  english_pob_choice: evil-minded
  chosen_korean: 악한 마음을 품지도
  alternatives_korean:
  - 악한 생각을 품지도
  - 악의적인 마음을 품지도
  lexicon: source direct address
  rationale: ‘마음’(φρων 계열)과 ‘악함’의 결합을 살리면서, 단순 성향보다 내면의 의도와 태도를 함께 보여 주는 표현으로 옮겼습니다.
theological_decisions:
- issue: βλασφημία의 한국어 범위
  chosen_reading: ‘비방’으로 번역해, 이 경고가 단순한 종교적 금기어보다 공동체를 해치는 말과 태도의 축적을 가리킨다는 점을 드러냈습니다.
  alternative_readings:
  - 신성모독
  - 모독
  rationale: Didache의 권면 문맥에서는 불평·자기주장·악한 마음이 낳는 파괴적 언어를 강조하므로, 한국 독자가 윤리적 परिणाम을 즉시 이해하도록 했습니다.
  doctrine_reference: 초기 기독교 윤리와 공동체 언어에 관한 교훈
