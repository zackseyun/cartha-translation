  verdict: revise
  source_fidelity: 핵심어 βλασφημία/βλασφημίαι는 ‘비방’보다 ‘모독’이 원문 및 영어 POB의 ‘blasphemy’에 더 가깝습니다. 원문은 단수에서 복수로 전환하므로, 한국어에서도 그 차이를 ‘모독’과 ‘모독의 말들’로 무리 없이 반영했습니다.
  naturalness: 기존 문장은 전반적으로 자연스러우나, ‘비방’은 현대 한국어에서 주로 타인에 대한 험담·중상을 뜻하여 원문의 의미 범위를 좁힙니다. 수정문은 현대 표준어 합쇼체를 유지하면서 권면의 병렬 구조를 더 분명히 합니다.
  terminology: βλασφημία는 문맥상 반드시 하나님만을 향한 행위로 한정하지 않되, 단순한 ‘비방’보다 강한 ‘모독’으로 옮기는 것이 적절합니다. 따라서 기존 각주가 제시한 축소적 해설은 삭제하는 것이 안전합니다.
  issues:
