  - severity: medium
    issue: 각주가 ‘비방’을 원문의 의미로 정당화하며 신성모독의 의미를 사실상 배제함
    rationale: 이 문맥의 적용 대상을 단정할 필요는 없지만, 원문의 βλασφημία가 지닌 ‘모독’의 의미를 ‘파괴적 말하기’로만 축소하는 것은 번역 근거로 안전하지 않습니다.
