base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/002.yaml
  text: Do not become quick-tempered, for anger leads to murder; nor be jealous, nor quarrelsome, nor hot-headed, for from all these murders are born.
translation:
  language: ko
  text: 화를 잘 내는 사람이 되지 마십시오. 분노는 살인으로 이끌기 때문입니다. 또한 질투하는 사람, 다투는 사람, 성급한 사람도 되지 마십시오. 이런 것들에서 모두 살인들이 생겨납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὀργίλος는 ‘분노를 잘 내는 성향’을 가리키므로, 단순히 순간적으로 화난 상태보다 지속적 성격 특성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: φόνοι는 문자적으로 ‘살인들’(복수형)입니다. 영어 POB도 복수성을 유지합니다.
    reason: source_note
lexical_decisions:
- source_word: Μὴ γίνου ὀργίλος
  english_pob_choice: Do not become quick-tempered
  chosen_korean: 화를 잘 내는 사람이 되지 마십시오
  alternatives_korean:
  - 성급하게 화내는 사람이 되지 마십시오
  - 쉽게 성내는 사람이 되지 마십시오
  lexicon: ὀργίλος
  rationale: 형용사적 성격을 살려 ‘화를 잘 내는 사람’으로 옮기면, 단순한 순간 감정보다 성향의 문제라는 점이 드러납니다.
- source_word: ὁδηγεῖ γὰρ ἡ ὀργὴ πρὸς τὸν φόνον
  english_pob_choice: for anger leads to murder
  chosen_korean: 분노는 살인으로 이끌기 때문입니다
  alternatives_korean:
  - 분노는 살해로 이끌기 때문입니다
  - 분노가 살인으로 가기 때문입니다
  lexicon: ὀργή / φόνος
  rationale: ὀργή와 φόνος의 인과관계를 직역에 가깝게 유지하되, 한국어 문장으로 자연스럽게 ‘이끌다’로 표현했습니다.
- source_word: μηδὲ ζηλωτὴς μηδὲ ἐριστικὸς μηδὲ θυμικός
  english_pob_choice: nor be jealous, nor quarrelsome, nor hot-headed
  chosen_korean: 또한 질투하는 사람, 다투는 사람, 성급한 사람도 되지 마십시오
  alternatives_korean:
  - 또 질투심 많은 사람, 다투기 좋아하는 사람, 격한 사람도 되지 마십시오
  - 또 시기하는 사람, 말다툼하는 사람, 성급한 사람도 되지 마십시오
  lexicon: ζηλωτὴς / ἐριστικὸς / θυμικός
  rationale: 세 형용사를 품성 묘사로 풀어 한국어 독자가 행동 경향을 즉시 이해하도록 했으며, 각 항목의 부정 연결을 보존했습니다.
- source_word: ἐκ γὰρ τούτων ἀπάντων φόνοι γεννῶνται
  english_pob_choice: for from all these murders are born
  chosen_korean: 이런 것들에서 모두 살인들이 생겨납니다
  alternatives_korean:
  - 이 모든 것에서 살인들이 나옵니다
  - 이런 것들로 말미암아 살인들이 태어납니다
  lexicon: γεννῶνται / φόνοι
  rationale: γεννῶνται의 출생 비유를 ‘생겨납니다’로 살려, 단순 발생보다 더 강한 생성 이미지를 유지했습니다.
theological_decisions:
- issue: 복수형 φόνοι의 의미
  chosen_reading: ‘살인들이’로 복수성을 살려, 이러한 악덕에서 여러 형태의 살인이 산출된다는 경고를 드러냈습니다.
  alternative_readings:
  - ‘살인이’로 일반화
  - ‘살해가’로 완화
  rationale: 본문의 복수형을 평준화하지 않고, 악행의 결말이 단일 사건이 아니라 반복적·다양한 폭력으로 이어질 수 있음을 보존합니다.
  doctrine_reference: Didache의 윤리적 경고 구조
- issue: 직설 명령의 어조
  chosen_reading: 합쇼체 명령형 ‘~하지 마십시오’로 공동체 교훈의 권위와 현대 한국어의 공손한 경고를 함께 살렸습니다.
  alternative_readings:
  - ‘~하지 말아라’
  - ‘~하지 마라’
  rationale: 원문의 금지 명령을 약화하지 않으면서도 출판용 문체에 맞게 정중한 규범문으로 재현했습니다.
  doctrine_reference: 문체/번역 원칙
