- from: 너 자신을 높이지 말고, 네 영혼에 담대함을 주지 마십시오. 네 영혼은 높은 사람들과 하나가 되지 말고, 의인들과 겸손한 사람들과 함께 행하십시오.[a][b]
  to: 자신을 높이지 말고, 자신의 영혼에 방자함[a]을 주지 마십시오. 자신의 영혼이 높은 이들과 결합하지 않게 하며, 의롭고 겸손한 이들과 함께 지내십시오.[b]
  rationale: 수정은 θράσος의 문맥상 부정적 의미를 회복하고, κολλάω와 ἀναστρέφω의 관계적 의미를 현대 한국어로 자연스럽게 드러내는 데 한정했습니다. ‘높은 이들’의 의도적 넓이는 보존했으며, 특정 교리적 해석을 덧붙이지 않았습니다.
