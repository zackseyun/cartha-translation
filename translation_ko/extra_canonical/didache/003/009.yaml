id: DID.3.9
reference: Didache 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐχ ὑψώσεις σεαυτὸν οὐδὲ δώσεις τῇ ψυχῇ σου θράσος. Οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν, ἀλλὰ μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/009.yaml
  text: You shall not exalt yourself, nor give your soul boldness. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble.
translation:
  language: ko
  text: 자신을 높이지 말고, 자신의 영혼에 방자함[a]을 주지 마십시오. 자신의 영혼이 높은 이들과 결합하지 않게 하며, 의롭고 겸손한 이들과 함께 지내십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: θράσος는 ‘대담함’, ‘무모함’, ‘방자함’ 등의 뜻을 가질 수 있습니다. 여기서는 금지의 윤리적 문맥을 따라 부정적인 뉘앙스를 살려 ‘방자함’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ἀναστρέφω는 ‘살다’, ‘행동하다’, ‘교제하다’의 범위를 가집니다. 여기서는 사람들과의 지속적인 생활과 교제를 가리켜 ‘함께 지내십시오’로 옮겼습니다. ‘높은 이들’(ὑψηλοί)은 단순히 사회적 지위가 높은 사람들로만 한정되지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: ὑψώσεις σεαυτὸν
  english_pob_choice: You shall not exalt yourself
  chosen_korean: 너 자신을 높이지 말고
  alternatives_korean:
  - 스스로를 높이지 말고
  - 자신을 높이지 말고
  lexicon: ὑψόω
  rationale: 직접적인 자기고양 금지를 평이하게 옮기되, 합쇼체 문맥에 맞게 자연스러운 금지형으로 처리했습니다.
- source_word: δώσεις τῇ ψυχῇ σου θράσος
  english_pob_choice: nor give your soul boldness
  chosen_korean: 네 영혼에 담대함을 주지 마십시오
  alternatives_korean:
  - 네 영혼에 대담함을 주지 마십시오
  - 네 영혼에 뻔뻔함을 주지 마십시오
  lexicon: ψυχή, θράσος
  rationale: θράσος를 단순히 ‘뻔뻔함’으로 좁히기보다 POB의 수정 의도를 따라 ‘담대함’으로 옮기되, 과도한 해석을 피했습니다.
- source_word: οὐ κολληθήσεται ἡ ψυχή σου μετὰ ὑψηλῶν
  english_pob_choice: Your soul shall not be joined with the lofty
  chosen_korean: 네 영혼은 높은 사람들과 하나가 되지 말고
  alternatives_korean:
  - 네 영혼은 높은 이들과 결속되지 말고
  - 네 영혼은 교만한 자들과 어울리지 말고
  lexicon: κολλᾶσθαι, ὑψηλοί
  rationale: ‘붙다/결합하다’의 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘하나가 되다’로 풀었습니다. ὑψηλούς는 지위가 높은 사람들만이 아니라 ‘높은 이들’의 뉘앙스를 유지했습니다.
- source_word: μετὰ δικαίων καὶ ταπεινῶν ἀναστραφήσῃ
  english_pob_choice: but you shall associate with the righteous and humble
  chosen_korean: 의인들과 겸손한 사람들과 함께 행하십시오
  alternatives_korean:
  - 의인들과 겸손한 이들과 함께 사귀십시오
  - 의인들과 낮은 사람들과 함께 지내십시오
  lexicon: ἀναστρέφω, δίκαιος, ταπεινός
  rationale: ἀναστρέφω의 ‘생활하다/행하다/교제하다’ 범위를 고려해 ‘함께 행하다’로 옮겼고, δίκαιοι와 ταπεινοί는 문맥에 맞게 ‘의인’과 ‘겸손한 사람들’로 옮겼습니다.
theological_decisions:
- issue: 교만한 자들과의 분리와 의인·겸손한 이들과의 연합을 어떻게 표현할지
  chosen_reading: 행위 규범으로서의 공동체적 분별을 드러내되, 단순한 사회적 거리두기보다 삶의 동행과 연합의 대비를 살렸습니다.
  alternative_readings:
  - ‘사귀지 말고/어울리지 말고’로 더 직접적으로 분리감을 강조
  - ‘교제하지 말고’로 교회적 의미를 강화
  rationale: 본문은 도덕적 권면이면서도 관계적 연합/분리의 대조를 사용하므로, ‘함께 행하다’로 적극적 동행을 드러내는 편이 원문의 힘을 보존합니다.
  doctrine_reference: 지혜문학적 윤리 권면; 공동체 분별
