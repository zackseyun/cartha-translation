    rationale: θράσος 자체는 대담함·무모함·방자함의 범위를 가지지만, 본문의 금지 명령과 윤리적 문맥에서는 긍정적 용기인 ‘담대함’보다 방자하거나 무모한 대담함을 가리킬 가능성이 높습니다. ‘담대함’은 원문의 평가를 반대로 들리게 할 수 있습니다.
  - severity: low
