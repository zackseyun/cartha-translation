  text: But be meek, because the meek will inherit the earth.
translation:
  language: ko
  text: 그러나 온유한 사람이 되십시오. 온유한 사람들은 땅을 상속받을 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πραῢς / πραεῖς
  english_pob_choice: meek
  chosen_korean: 온유하십시오 / 온유한 사람들
  alternatives_korean:
  - 부드럽게 하십시오 / 부드러운 사람들
  - 겸손하십시오 / 겸손한 사람들
  lexicon: πραῢς
  rationale: 문맥상 단순한 성격 묘사보다 태도와 행실의 온유함을 가리키므로, 한국어에서는 교회적 상투어인 ‘온유’가 원문의 미묘함을 가장 직접적으로 살립니다.
- source_word: κληρονομήσουσι
  english_pob_choice: will inherit
  chosen_korean: 유산으로 받을 것입니다
  alternatives_korean:
  - 상속받을 것입니다
  - 차지할 것입니다
  lexicon: κληρονομέω
  rationale: ‘inherit’의 상속/유업 이미지를 살리되, 현대 한국어에서는 ‘유산으로 받다’가 소유의 결과를 자연스럽고 분명하게 전달합니다.
- source_word: τὴν γῆν
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 세상
  - 땅과 세계
  lexicon: γῆ
  rationale: 여기서는 우주적 ‘earth’보다 약속된 땅의 성격이 강하므로, 직역적이고 성서적인 ‘땅’이 원문의 범위를 더 정확히 드러냅니다.
theological_decisions:
- issue: ‘the meek will inherit the earth’의 수여 방식
  chosen_reading: 온유한 자들이 하나님께서 주시는 유업으로 땅을 받는다는 약속으로 읽었습니다.
  alternative_readings:
  - 윤리적 일반원칙으로 읽는 해석
  - 미래 종말론적 새 땅의 상속으로만 한정하는 해석
  rationale: 직접적으로는 시편적 약속 언어를 반영하지만, 본문은 단순한 성품 권면을 넘어 하나님의 보상 약속을 내포하므로 ‘유산으로 받다’ 표현을 유지했습니다.
  doctrine_reference: 시편 37:11; 마태복음 5:5
