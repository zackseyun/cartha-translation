translation:
  language: ko
  text: 인내하며 자비롭고, 순진하며, 조용하고, 선하며, 항상 네가 들은 말들 앞에서 떨도록 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘인내하며 자비롭고, 순진하며, 조용하고, 선하게 되십시오. 그리고 항상 네가 들은 말들 앞에서 떨도록 하십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: Γίνου
  english_pob_choice: Be / Become
  chosen_korean: '...하도록 하십시오'
  alternatives_korean:
  - '...이 되십시오'
  - '...하십시오'
  lexicon: γίνομαι
  rationale: 윤리적 권면에서 γίνου는 상태의 형성 명령으로 기능하므로, 한국어에서는 ‘되다’의 진행보다 결과 상태를 촉구하는 명령형으로 옮기되, 뒤의 여러 형용사를 자연스럽게 포괄하도록 ‘...하도록 하십시오’로 처리했습니다.
- source_word: μακρόθυμος καὶ ἐλεήμων καὶ ἄκακος καὶ ἡσύχιος καὶ ἀγαθὸς
  english_pob_choice: patient and merciful and guileless and quiet and good
  chosen_korean: 인내하며 자비롭고, 순진하며, 조용하고, 선하며
  alternatives_korean:
  - 오래 참으며 자비롭고, 순결하며, 잠잠하고, 선하며
  - 참고 자비롭고, 해가 없으며, 조용하고, 선하며
  lexicon: μακρόθυμος; ἐλεήμων; ἄκακος; ἡσύχιος; ἀγαθός
  rationale: 각 형용사의 윤리적 뉘앙스를 살리기 위해 μακρόθυμος는 ‘인내하다’, ἐλεήμων은 ‘자비롭다’, ἄκακος는 ‘순진하다’로 옮겼고, ἡσύχιος는 ‘조용하다’로, ἀγαθός는 보편적 도덕성을 지닌 ‘선하다’로 옮겼습니다.
- source_word: τρέμων τοὺς λόγους διὰ παντός, οὓς ἤκουσας
  english_pob_choice: always trembling at the words that you heard
  chosen_korean: 항상 네가 들은 말들 앞에서 떨도록 하십시오
  alternatives_korean:
  - 항상 네가 들은 말씀을 떨며 대하도록 하십시오
  - 항상 네가 들은 말들을 두려워하며 지키도록 하십시오
  lexicon: τρέμων; λόγοι; οὓς ἤκουσας
  rationale: τρέμων의 ‘떨다’는 태도의 강도를 보존하고, λόγοι를 단순한 ‘말씀’으로 고정하지 않고 앞의 맥락에서 들은 구체적 가르침의 복수로 보아 ‘말들’로 옮겼습니다. ‘앞에서’는 경외와 떨림의 방향성을 드러내는 자연스러운 한국어 표현입니다.
theological_decisions:
- issue: 명령형 γίνου의 한국어 처리
  chosen_reading: 윤리적 권면의 현재적 상태를 촉구하는 명령으로 이해해 ‘...하도록 하십시오’로 옮겼습니다.
  alternative_readings:
  - ‘...이 되십시오’
  - ‘...하십시오’
  rationale: 이 문장은 덕목 목록을 이루는 훈계문으로, 결과 상태의 변화와 지속을 동시에 요구합니다. 한국어에서는 ‘...하도록 하십시오’가 목록 전체를 매끄럽게 이으면서도 명령의 힘을 유지합니다.
  doctrine_reference: Didache 3:8은 교리 논증보다 윤리적 제자도 권면에 속합니다.
