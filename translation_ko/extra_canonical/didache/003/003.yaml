    rationale: αἰσχρολόγος는 상스럽거나 음란한 말을 하는 사람을 가리키므로 ‘상스러운 말을 하는 사람’이 더 직접적입니다.
  revised_text: 내 아이야, 정욕을 품는 사람이 되지 마십시오. 정욕은 음행으로 이끌기 때문입니다. 또한 상스러운 말을 하는 사람도, 거만한 눈빛을 하는 사람도 되지 마십시오. 이런 모든 것에서 온갖 간음이 생겨납니다.[a]
