  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, μὴ γίνου ἐπιθυμητής· ὁδηγεῖ γὰρ ἡ ἐπιθυμία πρὸς τὴν πορείαν· μηδὲ αἰσχρολόγος μηδὲ ὑψηλοόφθαλμος· ἐκ γὰρ τούτων ἀπάντων μοιχεῖαι γεννῶνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003/003.yaml
  text: My child[a], do not become lustful, for lust leads to sexual immorality; nor foul-mouthed, nor haughty, for from all these adulteries are born.
  footnotes:
  - marker: a
    text: Or 'nor haughty-eyed'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아이야, 정욕을 품는 사람이 되지 마십시오. 정욕은 음행으로 이끌기 때문입니다. 또한 입이 더러운 사람도 되지 말고, 눈이 높아진 사람도 되지 마십시오. 이런 것들에서 온갖 간음이 생겨납니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ὑψηλοόφθαλμος는 직역하면 ‘눈이 높은’이라는 뜻으로, 문맥에 따라 ‘교만한’ 또는 ‘훔쳐보는/눈을 굴리는’ 의미로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον μου
  english_pob_choice: My child
  chosen_korean: 내 아이야
  alternatives_korean:
  - 내 자녀야
  - 내 아이
  lexicon: Τέκνον
  rationale: 직설적 권면의 친밀한 호칭을 살리되, 한국어에서 자연스럽고 구어적이면서도 문어에 견디는 표현으로 옮겼습니다.
- source_word: ἐπιθυμητής / ἐπιθυμία
  english_pob_choice: lustful / lust
  chosen_korean: 정욕을 품는 사람 / 정욕
  alternatives_korean:
  - 욕정을 품는 사람 / 욕정
  - 탐욕을 품는 사람 / 탐욕
  lexicon: ἐπιθυμέω, ἐπιθυμία
  rationale: 문맥상 성적 욕망을 가리키므로 단순한 ‘욕심’보다 성적 뉘앙스가 분명한 ‘정욕’을 택했습니다.
- source_word: ὑψηλοόφθαλμος
  english_pob_choice: haughty
  chosen_korean: 눈이 높아진 사람
  alternatives_korean:
  - 거만한 사람
  - 교만한 사람
  - 훔쳐보는 사람
  lexicon: ὑψηλόφθαλμος
  rationale: 직역형의 ‘높은 눈’ 이미지를 살리면서도 한국어에서 실제로는 우쭐함과 탐색적 시선을 함께 떠올릴 수 있게 하여, 본문이 열거하는 음행 맥락을 너무 약화시키지 않도록 했습니다.
- source_word: μοιχεῖαι
  english_pob_choice: adulteries
  chosen_korean: 간음
  alternatives_korean:
  - 간음 행위
  - 간음들
  - 외도
  lexicon: μοιχεία
  rationale: 복수형이지만 한국어에서는 범주적 표현이 자연스러워 ‘온갖 간음’으로 옮겨, 다양한 형태의 부정한 성행위를 포괄하게 했습니다.
theological_decisions:
- issue: ὑψηλοόφθαλμος의 성격—교만인가, 음욕을 띤 시선인가
  chosen_reading: 본문의 나열 구조(정욕, 더러운 말, 높아진 눈, 그 결과로 간음)상 성적 유혹을 동반한 ‘높아진/들뜬 눈’으로 이해하고 번역했습니다.
  alternative_readings:
  - 순수한 교만/오만의 의미로만 읽음
  - ‘훔쳐보는 눈’처럼 노골적 성적 시선으로 한정함
  rationale: 영문 POB의 보정 이력은 이 표현이 단순한 교만보다 음행 맥락의 시선을 가리킨다고 보지만, 최종 판독은 다시 ‘haughty’로 되돌아갔습니다. 한국어에서는 그 긴장을 보존하기 위해 교만과 시선의 이미지를 함께 담는 표현을 택했습니다.
  doctrine_reference: 경건 윤리, 음행 경계
- issue: ἀπάντων과 μοιχεῖαι 복수의 처리
  chosen_reading: ‘이런 것들에서 온갖 간음이 생겨납니다’로 옮겨, 원문의 복수적 범주성을 유지했습니다.
  alternative_readings:
  - ‘간음이 생겨납니다’로 단수화
  - ‘모든 간음들이 생겨납니다’
  rationale: 원문은 여러 악습이 결합해 다양한 간음으로 이어진다는 점을 강조하므로, 한국어에서도 ‘온갖’으로 범주성을 살렸습니다.
  doctrine_reference: 성결 윤리
