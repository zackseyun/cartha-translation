  source_fidelity: ‘음행’은 문맥 및 영어 POB의 sexual immorality와 부합하지만, 제공된 그리스어 본문에는 πορεία(‘길/행로’)라고 되어 있어 알려진 본문의 πορνεία(‘음행’)와 불일치합니다. 이는 전사 오류일 가능성이 매우 높으나, 제공 원문 자체만으로는 확정할 수 없습니다. ὑψηλοόφθαλμος는 문자적으로 ‘높은 눈의’이며, 본문에서는 우선 거만하거나 오만한 태도를 가리키되 문맥상 음란한 시선으로도 이해되어 왔습니다.
  naturalness: 초안의 ‘눈이 높아진 사람’은 현대 한국어에서 주로 기준·눈높이가 높다는 뜻으로 읽혀 원문의 ‘높은/거만한 눈’이라는 표현을 제대로 전달하지 못합니다. 또한 ‘입이 더러운 사람’보다 ‘상스러운 말을 하는 사람’이 αἰσχρολόγος의 행위적 의미를 더 자연스럽고 정확하게 나타냅니다.
  terminology: ‘정욕’, ‘음행’, ‘간음’은 이 문맥에서 적절합니다. μοιχεῖαι의 복수는 ‘온갖 간음’으로 자연스럽게 반영할 수 있습니다. ὑψηλοόφθαλμος는 본문에서 ‘거만한 눈빛을 하는’으로 옮기고, 음란한 시선이라는 가능한 문맥적 이해는 각주에서 제한적으로 밝혀 두는 것이 안전합니다.
  issues:
  - severity: high
    issue: 제공된 그리스어의 πορεία와 번역의 ‘음행’ 사이에 직접적인 불일치가 있습니다.
    rationale: πορεία는 통상 ‘길, 행로, 여정’이고 ‘음행’은 πορνεία에 해당합니다. Didache의 널리 알려진 본문은 πορνεία일 가능성이 높지만, 본문 데이터의 전사·편집 상태를 확인해야 합니다.
  - severity: medium
    issue: ‘눈이 높아진 사람’은 ὑψηλοόφθαλμος의 자연스러운 한국어 번역이 아닙니다.
    rationale: 현대 한국어에서 이 표현은 대체로 까다로운 기준을 뜻하며, ‘높은 눈/거만한 눈’이라는 원어의 관용적 이미지를 전달하지 못합니다.
  - severity: low
