id: DID.13.3
reference: Didache 13:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/003.yaml
  text: Therefore, taking every firstfruit of the produce of the winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests.
translation:
  language: ko
  text: 그러므로 포도즙 틀[a]과 타작마당[b]에서 나는 소출의 모든 첫 열매와 소와 양의 첫 소산을 가져다가 예언자들에게 주십시오. 그들은 여러분의 대제사장들이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포도즙 틀’은 원문의 ληνός를 직역한 것으로, 포도를 밟아 즙을 내는 틀을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘타작마당’은 ἅλων의 직역으로, 곡식을 타작하는 장소를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: Πᾶσαν οὖν ἀπαρχὴν
  english_pob_choice: every firstfruit
  chosen_korean: 모든 첫 열매
  alternatives_korean:
  - 첫 열매마다
  - 각 첫 열매
  lexicon: ἀπαρχή
  rationale: Ἀπαρχή는 단순한 ‘첫 소출’이 아니라 드려야 할 첫 열매를 가리키므로, 예물의 성격이 드러나도록 ‘첫 열매’로 옮겼습니다.
- source_word: γεννημάτων ληνοῦ καὶ ἅλωνος
  english_pob_choice: of the produce of the winepress and threshing floor
  chosen_korean: 포도즙 틀과 타작마당의
  alternatives_korean:
  - 포도즙 틀과 타작마당에서 난
  - 포도즙 틀과 타작마당의 소출
  lexicon: γεννήματα / ληνός / ἅλων
  rationale: ‘생산물’의 일반어보다 각각의 수확 장소를 직접 살려, 포도즙 틀과 타작마당에서 나온 소출이라는 원문의 대비를 드러냈습니다.
- source_word: λαβὼν δώσεις
  english_pob_choice: taking ... you shall give
  chosen_korean: 가져다가 ... 주십시오
  alternatives_korean:
  - 받아서 ... 주십시오
  - 취하여 ... 주십시오
  lexicon: λαμβάνω / δίδωμι
  rationale: 명령적 권면의 흐름을 자연스럽게 살리기 위해 ‘가져다가’와 정중한 명령 ‘주십시오’를 사용했습니다.
- source_word: τοῖς προφήταις
  english_pob_choice: to the prophets
  chosen_korean: 예언자들에게
  alternatives_korean:
  - 선지자들에게
  - 예언자들께
  lexicon: προφήτης
  rationale: POB의 원칙에 맞춰 전통적 교회어 ‘선지자’보다 소명 기능이 분명한 ‘예언자’를 택했습니다.
theological_decisions:
- issue: ἀρχιερεῖς의 직분적 의미
  chosen_reading: ‘대제사장들’로 옮겨, 예언자들을 공동체의 최고 제의적 대표로 규정하는 문장 구조를 그대로 살렸습니다.
  alternative_readings:
  - ‘대사제들’
  - ‘주된 제사장들’
  rationale: 원문은 예언자들을 ‘여러분의 대제사장들’이라고 단정적으로 규정하므로, 완화하지 않고 직역에 가깝게 유지했습니다.
  doctrine_reference: Didache의 공동체 질서와 제의적 언어
- issue: 직접 호칭의 합쇼체
  chosen_reading: 설교체가 아니라 공동체 권면으로 읽히도록 ‘주십시오’ 체를 유지했습니다.
  alternative_readings:
  - ‘주어야 합니다’
  - ‘드려야 합니다’
  rationale: 원문 δεύτερον 인칭 단수 미래형의 규범성을 살리되, 현대 한국어에서 예의 바른 권면으로 들리게 했습니다.
  doctrine_reference: 문체·화행 일치
