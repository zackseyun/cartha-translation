  rationale: 포도주와 기름에 적용되는 ἀπαρχή의 의미를 ‘첫 몫’으로 옮겨 원문의 헌납·우선 배분 개념을 유지하면서도, ‘첫 열매’가 초래할 수 있는 물질적·농경적 한정을 피했습니다. 용기의 내용도 명시하여 원문의 구문을 더 정확히 반영했습니다.
  reviewer_model: gpt-5.6-terra
