source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὡσαύτως κεράμιον οἴνου ἢ ἐλαίου ἀνοίξας, τὴν ἀπαρχὴν λαβὼν δὸς τοῖς προφήταις·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/006.yaml
  text: Likewise, when you open a jar of wine or oil, take the firstfruits and give them to the prophets.
translation:
  language: ko
  text: 마찬가지로, 포도주나 기름이 든 항아리를 열 때에는 그 첫 몫을 취하여 예언자들에게 드리십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως
  english_pob_choice: Likewise
  chosen_korean: 마찬가지로
  alternatives_korean:
  - 이와 같이
  - 또한
  lexicon: 전접속사/담화 표지
  rationale: 앞선 규범 진술과의 연속성을 자연스럽게 표시하는 담화 표지로서 ‘마찬가지로’가 가장 간결하고 문맥에 맞습니다.
- source_word: κεράμιον
  english_pob_choice: a jar
  chosen_korean: 항아리
  alternatives_korean:
  - 독
  - 단지
  - 그릇
  lexicon: 명사
  rationale: 액체를 담는 용기를 가리키는 일반적이고 현대적인 표준어로 ‘항아리’를 택해, 과도하게 고풍스럽지 않으면서도 문맥을 살렸습니다.
- source_word: ἀπαρχὴν
  english_pob_choice: firstfruits
  chosen_korean: 첫 열매
  alternatives_korean:
  - 첫 소출
  - 첫 수확물
  - 처음 거둔 것
  lexicon: 제물/헌물 용어
  rationale: 헬라어의 농경·헌납 뉘앙스를 살리면서도 한국어에서 이해하기 쉬운 표현으로 ‘첫 열매’를 사용했습니다.
- source_word: προφήταις
  english_pob_choice: the prophets
  chosen_korean: 예언자들에게
  alternatives_korean:
  - 선지자들에게
  - 예언자들께
  lexicon: 직분 명칭
  rationale: Didache의 문맥에서 가르치고 말하는 은사를 지닌 사람들을 가리키므로, 전통 교회어인 ‘선지자’보다 직접적인 뜻의 ‘예언자’가 더 स्रोत-직결적입니다.
theological_decisions:
- issue: 예언자에게 바치는 첫 열매의 성격
  chosen_reading: 이 절은 일반적인 소비 행위에 앞서 첫 몫을 예언자들에게 드리라는 공동체 규범으로 읽었습니다.
  alternative_readings:
  - 단순한 관습 설명
  - 상징적 헌납 규정
  rationale: 동사 σειρά가 아니라 명령형 δὸς가 있으므로, 권고가 아니라 실천 규정으로 전달하는 것이 본문에 충실합니다.
  doctrine_reference: Didache의 공동체 질서와 초기 교회의 헌납 관행
