lexical_decisions:
- source_word: Ἐὰν σιτιαυτοῖς
  english_pob_choice: If you prepare food
  chosen_korean: 음식을 준비하거든
  alternatives_korean:
  - 빵을 만들거든
  - 음식을 지으거든
  lexicon: σιτιαυτοῖς
  rationale: POB의 최신 영어처럼 빵으로 한정하지 않고, 동사 의미를 살려 ‘음식을 준비하다’로 옮겨 더 넓은 식사 준비를 반영했습니다.
- source_word: τὴν ἀπαρχὴν
  english_pob_choice: the firstfruits
  chosen_korean: 첫열매
  alternatives_korean:
  - 처음 난 곡식
  - 첫소산
  lexicon: ἀπαρχή
  rationale: 유대-성경적 제의 용어인 ἀπαρχή를 한국어 성경에서 널리 이해되는 ‘첫열매’로 옮겨, 헌물의 우선성을 드러냈습니다.
- source_word: κατὰ τὴν ἐντολήν
  english_pob_choice: according to the commandment
  chosen_korean: 명령대로
  alternatives_korean:
  - 계명에 따라
  - 명령에 따라
  lexicon: ἐντολή
  rationale: 문맥상 구체적 규정 준수를 뜻하므로, 간결하게 ‘명령대로’로 옮겼습니다.
theological_decisions:
- issue: 헌물의 규범성
  chosen_reading: 첫열매를 음식 준비와 연결된 제의적 의무로 읽어, 단순한 감사표시가 아니라 ‘명령’에 따른 순종으로 표현했습니다.
  alternative_readings:
  - 일반적인 기부 권면으로 완화하는 읽기
  - 유대 제의 전통을 약화해 상징적으로만 읽는 해석
  rationale: 본문은 준비된 음식과 첫열매, 그리고 명령의 결합으로 규범적 행위를 말하므로, 이를 약화하지 않고 드러내는 것이 소스에 충실합니다.
  doctrine_reference: 초기 교회 문헌의 제의적/윤리적 권면
