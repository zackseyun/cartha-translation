review_pass:
  verdict: revise
  source_fidelity: 핵심 동작과 순서는 대체로 충실합니다. 다만 ἐντολή는 여기서 단순한 ‘명령’보다 규범적 ‘계명’으로 옮기는 편이 적절합니다. τὴν ἀπαρχὴν은 단수이나 한국어 ‘첫열매’는 집합적·관용적으로 자연스럽습니다.
  naturalness: ‘음식을 준비하거든, 첫열매를 가져다가 … 드리십시오’는 현대 표준어 합쇼체로 자연스럽습니다. 각주 표지는 관련 어구 바로 뒤에 두는 것이 독자에게 더 명료합니다.
  terminology: ἀπαρχή는 성경적·제의적 용례를 보존하는 ‘첫열매’를 유지합니다. ἐντολή는 ‘계명’으로 조정합니다. ‘드리십시오’는 문맥상 헌물의 전달을 자연스럽게 나타내며, 본문이 명시하지 않은 수령자를 추가하지 않습니다.
  issues:
  - severity: low
    issue: ‘명령대로’의 용어 선택
    rationale: ἐντολή는 이 문맥에서 규범적 지시인 ‘계명’으로 옮기는 것이 더 정확하고 성경 문체에도 부합합니다.
  - severity: low
    issue: 각주의 ‘문자적으로는’이라는 표현
    rationale: 제시된 그리스어 형태는 정규 전승의 표현과 어형상 문제가 있어 해당 한국어 표현을 엄밀한 문자적 번역이라고 단정하기 어렵습니다. 영어 POB의 대안 번역에 맞추어 ‘빵을 만들거든’이라는 가능 번역으로 제시하는 편이 안전합니다.
