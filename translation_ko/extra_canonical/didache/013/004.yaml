id: DID.13.4
reference: Didache 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ μὴ ἔχητε προφήτην, δότε τοῖς πτωχοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/004.yaml
  text: But if you do not have a prophet, give to the poor.
translation:
  language: ko
  text: 그러나 여러분에게 예언자가 없으면, 가난한 사람들에게 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ μὴ ἔχητε
  english_pob_choice: But if you do not have
  chosen_korean: 그러나 여러분에게 … 없으면
  alternatives_korean:
  - 하지만 여러분이 … 가지고 있지 않으면
  - 그런데 여러분에게 … 없으면
  lexicon: 조건절/부정 동사
  rationale: ἐὰν δὲ μὴ ἔχητε는 단순 조건과 부정을 나타내므로, 자연스러운 합쇼체로 ‘그러나 … 없으면’이라고 옮겼습니다.
- source_word: προφήτην
  english_pob_choice: a prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자 한 사람
  lexicon: προφήτης
  rationale: 공동체 안에서 말씀을 선포하는 인물을 가리키는 기본 의미를 살려 ‘예언자’로 옮겼습니다.
- source_word: δότε
  english_pob_choice: give
  chosen_korean: 주십시오
  alternatives_korean:
  - 주십시오
  - 나누어 주십시오
  - 드리십시오
  lexicon: δίδωμι
  rationale: 직접 목적어가 없는 명령문이므로, 한국어에서도 목적어를 보태지 않고 간단히 ‘주십시오’로 살렸습니다.
- source_word: τοῖς πτωχοῖς
  english_pob_choice: to the poor
  chosen_korean: 가난한 사람들에게
  alternatives_korean:
  - 가난한 이들에게
  - 빈곤한 사람들에게
  lexicon: πτωχός
  rationale: ‘가난한 사람들’의 의미를 분명히 하되, 한국어에서 가장 자연스러운 복수 표현으로 다듬었습니다.
theological_decisions:
- issue: 명령문의 목적어 보충 여부
  chosen_reading: ‘주십시오’만 두고, ‘그것을’ 같은 보충 목적어는 넣지 않았습니다.
  alternative_readings:
  - 그것을 가난한 사람들에게 주십시오
  - 그것을 가난한 이들에게 나누어 주십시오
  rationale: 그리스어에는 직접 목적어가 없으므로, 영어 POB의 수정 취지에 따라 한국어도 대상을 직접 목적어 없이 유지했습니다.
  doctrine_reference: source fidelity / syntax
- issue: 예언자 용어 선택
  chosen_reading: ‘선지자’보다 ‘예언자’를 택했습니다.
  alternative_readings:
  - 선지자
  rationale: 본문의 προφήτης는 예언·선포의 기능을 가리키며, 현대 표준어로는 ‘예언자’가 더 직접적입니다.
  doctrine_reference: lexical transparency
