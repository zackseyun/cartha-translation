review_pass:
  verdict: revise
  source_fidelity: 그리스어는 ‘참된 교사’가 ‘일꾼처럼’ 자기의 τροφή(먹을 것/양식)를 받을 자격이 있음을 말합니다. 초안의 뜻은 대체로 맞지만, ‘먹을 몫’은 원문의 단순한 ‘음식/양식’보다 분배된 몫이라는 의미를 더하며, 각주도 원문 어휘를 지나치게 생계 제공으로 해석합니다.
  naturalness: ‘참된 교사 자신도 일꾼처럼 자기 먹을 것을 받을 자격이 있습니다’는 현대 표준 한국어의 합쇼체로 자연스럽고, αὐτός의 강조와 καί의 첨가 의미를 ‘자신도’로 드러냅니다.
  terminology: διδάσκαλος ἀληθινός는 ‘참된 교사’, ἐργάτης는 ‘일꾼’, τροφή는 문맥상 ‘먹을 것’으로 옮기는 것이 적절합니다. ‘받을 자격이 있습니다’는 ἄξιος의 문맥상 의미를 자연스럽게 전달합니다.
  issues:
  - severity: low
    issue: ‘자기 먹을 몫’이 τροφή의 의미를 다소 확장함
    rationale: τροφή는 ‘음식, 양식, 먹을 것’을 뜻하며, ‘몫’은 원문에 명시되지 않은 분배·할당의 뉘앙스를 보탭니다.
  - severity: low
    issue: 각주가 ‘생계 제공’이라는 해석을 본문 어휘의 직역 대안처럼 제시함
    rationale: 문맥상 부양과 관련될 수 있으나, 해당 단어 자체는 우선 음식·양식을 뜻합니다. 본문을 자연스럽게 번역하면 이 각주는 필요하지 않습니다.
  revised_text: 이와 같이 참된 교사 자신도 일꾼처럼 자기 먹을 것을 받을 자격이 있습니다.
