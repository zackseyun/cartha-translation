  yaml_path: translation/extra_canonical/didache/013/002.yaml
  text: Likewise a true teacher is also himself worthy, like the worker, of his food.
translation:
  language: ko
  text: 이와 같이 참된 교사 자신도 일꾼처럼 자기 먹을 것을 받을 자격이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάσκαλος ἀληθινός
  english_pob_choice: a true teacher
  chosen_korean: 참된 교사
  alternatives_korean:
  - 진정한 교사
  - 올바른 교사
  lexicon: διδάσκαλος = 교사; ἀληθινός = 참된/진실한
  rationale: ἀληθινός는 단순한 직함이 아니라 진정성과 참됨을 강조하므로, 자연스러운 한국어에서 그 뉘앙스를 살린 ‘참된 교사’로 옮겼습니다.
- source_word: ἄξιος καὶ αὐτός
  english_pob_choice: is also himself worthy
  chosen_korean: 교사도 일꾼처럼 자기 먹을 몫을 받을 만합니다
  alternatives_korean:
  - 그도 마땅합니다
  - 그 자신도 합당합니다
  lexicon: ἄξιος = worthy/ deserving; αὐτός = himself/also
  rationale: 문맥상 ‘합당하다’의 추상어보다, 뒤의 ‘먹을 것/식량’과 연결되는 보상 의미를 살려 ‘받을 만합니다’로 자연스럽게 풀었습니다.
- source_word: ὁ ἐργάτης, τῆς τροφῆς αὐτοῦ
  english_pob_choice: the worker, of his food
  chosen_korean: 일꾼처럼 자기 먹을 몫
  alternatives_korean:
  - 일꾼처럼 자기 양식
  - 일꾼처럼 자기 먹이
  lexicon: ἐργάτης = worker; τροφή = food/nourishment
  rationale: τροφῆς는 단순한 ‘음식’보다 생계를 포함한 ‘먹을 몫/양식’의 뜻이 있어, 보상으로서의 생활 공급을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 교사와 일꾼의 보수 정당성
  chosen_reading: 참된 교사도 다른 노동자처럼 공동체로부터 생활을 보장받을 자격이 있다는 뜻으로 읽었습니다.
  alternative_readings:
  - 지식인의 일반적 보상 원리
  - 비유적 충성의 칭찬
  rationale: 문장의 비교구조(ὥσπερ ὁ ἐργάτης)와 τροφή가 가리키는 생계 의미를 따라, 교사의 물질적 부양 권리를 명시하는 것으로 번역했습니다.
  doctrine_reference: 사역자 부양, 공동체의 책임
