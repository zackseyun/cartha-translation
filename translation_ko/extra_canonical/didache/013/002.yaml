- from: 이와 같이 참된 교사도 일꾼처럼 자기 먹을 몫을 받을 만합니다.[a]
  to: 이와 같이 참된 교사 자신도 일꾼처럼 자기 먹을 것을 받을 자격이 있습니다.
  rationale: ‘자신도’로 ‘또한 그 자신도’라는 강조를 살리고, τροφή는 해석적 확장을 피하여 ‘먹을 것’으로 옮겼습니다. ‘받을 자격이 있습니다’는 한국어에서 ‘~에 합당하다’의 관계를 자연스럽게 표현합니다.
