review_pass:
  verdict: revise
  source_fidelity: 원문의 θέλων은 조건절의 ‘원할 때’가 아니라 예언자를 수식하는 ‘정착하기를 원하는’으로 옮기는 것이 충실합니다. 또한 ἄξιος ... τῆς τροφῆς αὐτοῦ는 그 예언자가 양식을 제공받을 자격이 있음을 뜻하므로, ‘음식에 합당합니다’보다 수혜 관계를 분명히 해야 합니다.
  naturalness: ‘그의 음식에 합당합니다’는 현대 한국어에서 부자연스럽고 무엇이 무엇에 합당한지 अस्पष्ट합니다. ‘그의 양식을 받을 자격이 있습니다’가 자연스럽고 문맥에도 맞습니다.
  terminology: ‘참된 예언자’는 ἀληθινὸς προφήτης를 적절히 반영합니다. τροφή는 이 문맥에서 공동체가 제공하는 생계용 양식이므로 ‘양식’을 사용했습니다.
  issues:
  - severity: medium
    issue: θέλων을 ‘원할 때’라는 조건절로 번역함
    rationale: 분사 θέλων은 ‘정착하기를 원하는’이라는 방식으로 주어를 수식합니다. 조건적 시간 표현은 원문에 없는 뉘앙스를 더합니다.
  - severity: high
    issue: ‘그의 음식에 합당합니다’의 의미와 한국어 표현이 부정확함
    rationale: ἄξιος ἐστι τῆς τροφῆς αὐτοῦ는 예언자가 자기 양식, 곧 제공받는 생계를 받을 자격이 있다는 뜻입니다. 초안은 이를 ‘음식에 합당하다’로 처리하여 관계가 역전되고 부자연스러워졌습니다.
  revised_text: 한편 여러분 가운데 정착하기를 원하는 모든 참된 예언자는 그의 양식을 받을 자격이 있습니다.
