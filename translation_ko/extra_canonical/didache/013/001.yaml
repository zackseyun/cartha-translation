  to: 한편 여러분 가운데 정착하기를 원하는 모든 참된 예언자는 그의 양식을 받을 자격이 있습니다.
  rationale: 분사의 수식 관계를 보존하고, ‘양식’을 받을 권리라는 ἄξιος 구문의 의미를 자연스러운 현대 한국어 합쇼체로 명확히 했습니다. 원문에 없는 조건성이나 추가 신학적 해석은 넣지 않았습니다.
  reviewer_model: gpt-5.6-terra
