id: DID.13.1
reference: Didache 13:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013/001.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food.
translation:
  language: ko
  text: 한편 여러분 가운데 정착하기를 원하는 모든 참된 예언자는 그의 양식을 받을 자격이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀληθινός
  english_pob_choice: 'true'
  chosen_korean: 참된
  alternatives_korean:
  - 진정한
  - 참
  - 진짜
  lexicon: ἀληθινός
  rationale: 예언자의 ‘진짜/가짜’ 구별을 살리면서도 문어체에서 자연스럽고 품위 있게 전달하기 위해 ‘참된’을 택했습니다.
- source_word: προφήτης
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  lexicon: προφήτης
  rationale: 본문의 직역 의미를 살리기 위해 ‘예언자’를 사용했습니다. 전통적 교회어인 ‘선지자’보다 현대 표준어에서 직접적입니다.
- source_word: καθῆσαι πρὸς ὑμᾶς
  english_pob_choice: settle among you
  chosen_korean: 여러분 가운데 머물기를 원할 때
  alternatives_korean:
  - 여러분 곁에 정착하기를 원할 때
  - 여러분과 함께 살기를 원할 때
  lexicon: καθῆσαι
  rationale: 단순한 방문이 아니라 함께 머물며 거주하려는 의도를 나타내므로 ‘머물기’를 택했고, 여기에 목적/의지를 분명히 하는 ‘원할 때’를 보완했습니다.
- source_word: τῆς τροφῆς αὐτοῦ
  english_pob_choice: his food
  chosen_korean: 그의 음식에
  alternatives_korean:
  - 그의 양식에
  - 그의 먹을 것에
  - 그의 식사에
  lexicon: τροφή
  rationale: 문맥상 예언자를 먹여 살릴 책임을 가리키므로 ‘양식’도 가능하지만, 원문의 일반적 의미를 유지하기 위해 ‘음식’을 택했습니다.
theological_decisions:
- issue: 예언자의 ‘합당함’이 무엇을 기준으로 하는지
  chosen_reading: 예언자가 공동체 안에 머물며 제공받는 생활비/식량에 대해 ‘받을 자격이 있음’을 말합니다.
  alternative_readings:
  - 예언자의 영적 권위를 강조하는 표현
  - 단순한 환대 의무에 대한 일반적 권면
  rationale: ἄξιός ἐστι τῆς τροφῆς αὐτοῦ는 도덕적 칭찬보다 실제 생계 공급에 대한 권리를 진술하는 쪽이 자연스럽습니다.
  doctrine_reference: Didache 13:1의 공동체 규범과 순회 예언자에 대한 환대 규정
