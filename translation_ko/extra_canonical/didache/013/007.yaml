    rationale: λαβών은 능동 부사분사로서 ‘[첫 몫을] 취하여/떼어 내어’라는 뜻입니다. 존대 과거 조건문인 ‘받으셨다면’은 독자가 받는 사람이 되는 것으로 읽힙니다.
  - severity: medium
    issue: ‘첫 열매’는 돈과 옷에 직접 연결될 때 한국어에서 부자연스럽습니다.
    rationale: ἀπαρχή는 본문에서 돈·옷·모든 소유물에서 바치는 첫 부분을 포괄합니다. ‘첫 몫’이 그 범위를 보존합니다.
