review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. λαβών은 독자가 ‘첫 몫’을 취하는 능동 분사인데, 초안의 ‘받으셨다면’은 높임 과거 조건문이 되어 행위의 방향과 문법적 관계를 바꿉니다. ἀπαρχή는 여기서 돈과 옷에도 적용되므로 문자적인 농산물 ‘첫 열매’보다 ‘첫 몫’이 문맥에 맞습니다.
  naturalness: ‘당신에게 좋게 여겨지는 대로’와 ‘받으셨다면’은 현대 한국어 합쇼체에서 부자연스럽습니다. ‘좋다고 여기는 대로’ 및 ‘떼어 내어’가 자연스럽고 원문의 참여·명령 구조를 유지합니다.
  terminology: ἀργύριον을 ‘돈’으로 옮긴 것은 문맥상 적절합니다. ἀπαρχή는 헌납을 위한 맨 처음의 몫이라는 뜻이므로, 모든 소유물에 무리 없이 적용되는 ‘첫 몫’으로 옮겼습니다. δός는 수령인을 명시하지 않으므로 ‘계명에 따라 주십시오’로 그대로 유지합니다.
