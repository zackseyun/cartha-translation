translation:
  language: ko
  text: 돈과 옷과 모든 소유물 가운데서 첫 열매를, 당신에게 좋게 여겨지는 대로, 받으셨다면 그 계명에 따라 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ἀργύριον은 문자적으로는 ‘은’이지만, 문맥상 일반적인 ‘돈’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργυρίου
  english_pob_choice: money
  chosen_korean: 돈
  alternatives_korean:
  - 은
  - 은전
  - 재물
  lexicon: ἀργύριον
  rationale: 본문에서는 일반적인 소유물 목록 안에서 자선적 헌물을 말하므로, 문자적인 ‘은’보다 기능상 의미인 ‘돈’이 더 자연스럽습니다.
- source_word: ἱματισμοῦ
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 의류
  lexicon: ἱματισμός
  rationale: 그리스어의 일반적 ‘의복’보다 한국어에서 더 직접적이고 구체적인 ‘옷’이 문맥상 자연스럽습니다.
- source_word: παντὸς κτήματος
  english_pob_choice: every possession
  chosen_korean: 모든 소유물
  alternatives_korean:
  - 모든 재산
  - 모든 소유
  lexicon: κτῆμα
  rationale: κτῆμα는 소유한 것 전반을 가리키므로, 자산·재물을 모두 포괄하는 ‘모든 소유물’로 옮겼습니다.
- source_word: ἀπαρχὴν
  english_pob_choice: firstfruit
  chosen_korean: 첫 열매
  alternatives_korean:
  - 처음 익은 열매
  - 첫 수확
  lexicon: ἀπαρχή
  rationale: 제의적·헌납적 뉘앙스를 살리면서도, 한국어에서 가장 널리 이해되는 ‘첫 열매’를 택했습니다.
theological_decisions:
- issue: 헌물 지침의 명령형 강도
  chosen_reading: 주십시오
  alternative_readings:
