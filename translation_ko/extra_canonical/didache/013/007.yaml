    issue: ‘당신에게 좋게 여겨지는 대로’는 직역투입니다.
    rationale: 원문의 ‘as it seems good to you’는 한국어로 ‘좋다고 여기는 대로’라고 하면 의미와 어조가 자연스럽게 전달됩니다.
  revised_text: 돈과 옷과 모든 소유물에서 첫 몫을 떼어 내어, 좋다고 여기는 대로 계명에 따라 주십시오.[a]
