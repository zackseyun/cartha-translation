review_pass:
  verdict: revise
  source_fidelity: ‘살아 있는 물’은 직역적으로 가능하지만, 이 세례 규정에서 ὕδωρ ζῶν은 통상 흐르는 물(샘물·유수)을 가리킵니다. ‘흐르는 물’이 원문의 실제적 물의 구분을 더 정확하고 현대 한국어로 분명하게 전달합니다. 또한 뒤 절에서 생략된 세례 행위를 보충하면 조건의 범위가 명확해집니다.
  naturalness: 전반적으로 합쇼체와 공적 지침 문체는 자연스럽습니다. 다만 ‘차가운 물로 할 수 없으면’은 무엇을 할 수 없는지 다소 생략되어 있으므로 ‘차가운 물로 세례를 베풀 수 없으면’이 더 명료합니다.
  terminology: βάπτισον은 교단적 용어를 특정하지 않는 ‘세례를 베푸십시오’로 적절합니다. θερμός는 여기서 ‘따뜻한’으로 옮기는 것이 적절합니다. ὕδωρ ζῶν은 신학적 관용어로 오해될 수 있는 ‘생수’나 직역적 ‘살아 있는 물’보다 ‘흐르는 물’이 문맥상 적합합니다.
  issues:
  - severity: medium
    issue: ὕδωρ ζῶν의 번역
    rationale: 이 문맥의 ‘살아 있는 물’은 비유적 생명이나 단순한 물의 상태가 아니라, 세례에 우선적으로 사용되는 흐르는 물을 뜻합니다. ‘흐르는 물’이 해당 물리적 의미를 정확히 전달합니다.
  - severity: low
    issue: 둘째 조건절의 행위 생략
    rationale: ‘차가운 물로 할 수 없으면’도 이해되지만, 한국어에서는 세례 행위를 명시하면 원문의 조건이 더 자연스럽고 분명해집니다.
  revised_text: 그러나 흐르는 물이 없으면 다른 물로 세례를 베푸십시오. 차가운 물로 세례를 베풀 수 없으면 따뜻한 물로 하십시오.
