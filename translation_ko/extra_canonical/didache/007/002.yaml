id: DID.7.2
reference: Didache 7:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ μὴ ἔχῃς ὕδωρ ζῶν, εἰς ἄλλο ὕδωρ βάπτισον· εἰ δʼ οὐ δύνασαι ἐν ψυχρῷ, ἐν θερμῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/002.yaml
  text: But if you do not have living water, baptize in other water; and if you cannot in cold, then in warm.
translation:
  language: ko
  text: 그러나 살아 있는 물이 없으면 다른 물로 세례를 베푸십시오. 그리고 차가운 물로 할 수 없으면 따뜻한 물로 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδωρ ζῶν
  english_pob_choice: living water
  chosen_korean: 살아 있는 물
  alternatives_korean:
  - 생수
  - 살아 있는 물
  lexicon: ὕδωρ, ζῶν
  rationale: 여기서는 예수의 ‘생수’ 관용구보다 실제 세례에 필요한 물의 상태를 가리키므로, 직역에 가까운 ‘살아 있는 물’로 옮겨 원문의 조건을 분명히 했습니다.
- source_word: εἰς ἄλλο ὕδωρ
  english_pob_choice: in other water
  chosen_korean: 다른 물로
  alternatives_korean:
  - 다른 물에
  - 다른 물로
  lexicon: ἄλλος, ὕδωρ
  rationale: 영어 POB의 수정 취지와 마찬가지로, 이 표현은 ‘into’보다 결과지향의 자연스러운 한국어 ‘다른 물로’가 원문의 시비를 잘 드러냅니다.
- source_word: βάπτισον
  english_pob_choice: baptize
  chosen_korean: 세례를 베푸십시오
  alternatives_korean:
  - 세례하십시오
  - 침례하십시오
  - 세례를 베푸십시오
  lexicon: βαπτίζω
  rationale: 의식 행위를 문맥에 맞게 분명히 하되, 한국어에서 이해가 쉬운 공적·전례적 표현인 ‘세례를 베푸십시오’를 사용했습니다.
- source_word: ἐν ψυχρῷ / ἐν θερμῷ
  english_pob_choice: in cold / in warm
  chosen_korean: 차가운 물로 / 따뜻한 물로
  alternatives_korean:
  - 차가운 데서 / 따뜻한 데서
  - 차가운 물로 / 따뜻한 물로
  lexicon: ψυχρός, θερμός
  rationale: 전치사 ἐν은 여기서 물의 온도를 수단·상태로 제시하므로, 한국어에서는 자연스럽게 ‘물로’ 보완해 의미를 명확하게 했습니다.
theological_decisions:
- issue: 세례 지침의 규범성
  chosen_reading: 이 구절은 세례의 이상적 조건(살아 있는 물)과 차선책(다른 물, 더운/차가운 물)을 실무적으로 제시하는 문장으로 읽었습니다.
  alternative_readings:
  - 상징적·영적 의미를 강조해 ‘살아 있는 물’을 비유로 보는 읽기
  - ‘뜨거운/미지근한’ 등 온도 표현을 확대 해석하는 읽기
  rationale: 원문은 교리 논증보다 세례 시행에 대한 실천 지침을 직접적으로 말하므로, 상징화하지 않고 절차적 의미를 보존했습니다.
  doctrine_reference: Didache 7:2 세례 실천 규정
