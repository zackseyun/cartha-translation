  text: Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε· ταῦτα πάντα προειπόντες, βαπτίσατε εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος ἐν ὕδατι ζῶντι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Now concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
  footnotes:
  - marker: a
    text: Or 'Having first proclaimed all these things,'.
