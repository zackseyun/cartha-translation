source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε· ταῦτα πάντα προειπόντες, βαπτίσατε εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ ἁγίου Πνεύματος ἐν ὕδατι ζῶντι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/001.yaml
  text: 'Now concerning baptism, baptize in this way: Having first said all these things, baptize into the name of the Father and of the Son and of the Holy Spirit in living water.'
  footnotes:
  - marker: a
    text: Or 'Having first proclaimed all these things,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 세례에 관하여 말씀드리겠습니다. 이 모든 것을 먼저 말한 뒤에, 아버지와 아들과 성령의 이름 안으로, 살아 있는 물에서 세례를 베푸십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 것을 먼저 선포한 뒤에’.
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ τοῦ βαπτίσματος
  english_pob_choice: Now concerning baptism
  chosen_korean: 이제 세례에 관하여 말씀드리겠습니다
  alternatives_korean:
  - 이제 세례에 대해서는 말씀드리겠습니다
  - 세례에 관하여는 이렇습니다
  lexicon: βαπτίσμα
  rationale: 도입부의 주제 전환을 한국어 담화 관용에 맞게 풀되, ‘세례’라는 표준 교회 용어를 유지했습니다.
- source_word: προειπόντες
  english_pob_choice: Having first said all these things
  chosen_korean: 이 모든 것을 먼저 말한 뒤에
  alternatives_korean:
  - 이 모든 것을 먼저 선포한 뒤에
  - 먼저 이 모든 것을 말한 다음에
  lexicon: προλέγω
  rationale: 공인된 수정안처럼 προειπόντες는 ‘미리 말하다/먼저 말하다’의 뜻이므로, ‘선포하다’보다 ‘말한 뒤에’로 옮겨 실천적 교리교육 맥락을 살렸습니다.
- source_word: ἐν ὕδατι ζῶντι
  english_pob_choice: in living water
  chosen_korean: 살아 있는 물에서
  alternatives_korean:
  - 살아 있는 물 안에서
  - 흐르는 물에서
  lexicon: ὕδωρ ζῶν
  rationale: 직역적 의미를 살리되 한국어에서 이해되는 자연스러운 표현으로 옮겼고, ‘살아 있는 물’의 상징성과 문자적 수역을 함께 보존했습니다.
theological_decisions:
- issue: “아버지와 아들과 성령의 이름 안으로”의 세례 공식
  chosen_reading: 세례를 베푸는 표적 방향을 ‘이름 안으로’로 직역해, 삼위적 세례 공식의 구조를 드러냈습니다.
  alternative_readings:
  - 아버지와 아들과 성령의 이름으로
  - 아버지와 아들과 성령의 이름 안에서
  rationale: εἰς τὸ ὄνομα는 단순한 수단을 넘어 진입/편입의 뉘앙스를 가지므로, ‘안으로’가 원문의 방향성을 가장 잘 보존합니다.
  doctrine_reference: 세례의 언약적 편입과 삼위일체적 형식
