review_pass:
  verdict: revise
  source_fidelity: The draft unnecessarily adds a first-person, prospective discourse frame ('말씀드리겠습니다') for Περὶ δὲ, whereas the Greek directly introduces the instruction and immediately commands βαπτίσατε. Its rendering of εἰς τὸ ὄνομα as '이름 안으로' is overly literal and unidiomatic in Korean; '이름으로' is the established natural rendering of this baptismal formula without imposing a doctrinal explanation. ὕδωρ ζῶν refers concretely to running/fresh water in this instructional context; a literal note preserves the wording.
  naturalness: The revised imperative construction is modern formal-polite Korean and follows the Greek’s instructional style. '흐르는 물에서' is clearer and more idiomatic than '살아 있는 물에서.'
  terminology: ‘세례,’ ‘아버지와 아들과 성령,’ and ‘이름으로’ retain standard Korean Christian terminology. The note on ‘흐르는 물’ preserves the literal expression ‘살아 있는 물’ without treating it as merely symbolic.
  issues:
  - severity: medium
    issue: The opening adds a first-person future statement not present in Greek.
    rationale: ‘이제 세례에 관하여 말씀드리겠습니다’ changes the direct instructional introduction Περὶ δὲ τοῦ βαπτίσματος, οὕτω βαπτίσατε into a narrator’s announcement.
  - severity: medium
    issue: ‘이름 안으로’ is an unnatural and interpretively loaded Korean calque.
    rationale: Although εἰς can express movement or incorporation, Korean ‘이름 안으로’ is not an idiomatic rendering of the formula and foregrounds one theological construal. ‘이름으로’ naturally renders the formula while leaving its full implications unstated.
  - severity: low
    issue: The existing footnote offers ‘선포한’ as an alternative for προειπόντες.
    rationale: The source term means to say beforehand/previously; ‘선포하다’ suggests public proclamation and is less precise in this catechetical context.
  revised_text: 세례에 관해서는 이렇게 세례를 베푸십시오. 이 모든 것을 먼저 말한 뒤에, 아버지와 아들과 성령의 이름으로 흐르는 물에서 세례를 베푸십시오.[a]
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘살아 있는 물에서’입니다.
    reason: ‘흐르는 물’은 이 문맥에서 ὕδωρ ζῶν의 구체적 의미를 자연스럽게 옮긴 것이며, 직역 표현을 함께 제시합니다.
  revision_rationale: 직접적인 명령 형식을 회복하고, προειπόντες를 ‘먼저 말한 뒤에’로 유지했습니다. 세례 공식을 자연스러운 한국어 관용으로 옮겼으며, ‘살아 있는 물’의 문자적 표현은 각주로 보존했습니다.
