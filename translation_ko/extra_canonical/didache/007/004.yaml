id: DID.7.4
reference: Didache 7:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πρὸ δὲ τοῦ βαπτίσματος προνηστευσάτω ὁ βαπτίζων καὶ ὁ βαπτιζόμενος καὶ εἴ τινες ἄλλοι δύνανται· κελεύσεις δὲ νηστεῦσαι τὸν βαπτιζόμενον πρὸ μιᾶς ἢ δύο.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/004.yaml
  text: But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able; and you shall command the one being baptized to fast one or two days beforehand.
translation:
  language: ko
  text: 그러므로 세례 전에 세례를 베푸는 사람과 세례를 받는 사람과 가능하다면 다른 사람들도 미리 금식해야 합니다. 또 세례를 받는 사람에게 하루나 이틀 전에 금식하라고 명령해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸ δὲ τοῦ βαπτίσματος
  english_pob_choice: But before the baptism
  chosen_korean: 그러므로 세례 전에
  alternatives_korean:
  - 그런데 세례 전에
  - 세례를 받기 전에
  lexicon: πρό + γενitive / βαπτίζω
  rationale: πρὸ τοῦ βαπτίσματος는 단순한 시간 부사구이므로 자연스러운 순서 표현인 ‘세례 전에’로 옮겼고, 문맥상 앞선 지시를 이어받는 연결은 ‘그러므로’로 처리했습니다.
- source_word: προνηστευσάτω ... καὶ ... νηστεῦσαι
  english_pob_choice: let ... fast beforehand ... you shall command ... to fast
  chosen_korean: 미리 금식해야 합니다 ... 금식하라고 명령해야 합니다
  alternatives_korean:
  - 미리 금식하게 하십시오
  - 금식하도록 하십시오
  lexicon: προνηστεύω / νηστεύω
  rationale: προνηστευσάτω는 ‘미리 금식하다’의 선행성까지 포함하므로 ‘미리 금식해야 합니다’로, νηστεῦσαι는 명령형에 맞게 ‘금식하라고 명령해야 합니다’로 구분해 옮겼습니다.
- source_word: ὁ βαπτίζων καὶ ὁ βαπτιζόμενος
  english_pob_choice: the one baptizing and the one being baptized
  chosen_korean: 세례를 베푸는 사람과 세례를 받는 사람
  alternatives_korean:
  - 세례하는 이와 세례받는 이
  - 세례를 주는 사람과 받는 사람
  lexicon: βαπτίζω
  rationale: 행위자와 수동 당사자를 분명히 살리되, 현대 한국어에서 자연스럽고 공적 문체에 맞는 표현으로 각각 ‘세례를 베푸는 사람’과 ‘세례를 받는 사람’을 사용했습니다.
- source_word: εἴ τινες ἄλλοι δύνανται
  english_pob_choice: and any others who are able
  chosen_korean: 가능하다면 다른 사람들도
  alternatives_korean:
  - 할 수 있는 다른 이들도
  - 능력이 있는 다른 사람들도
  lexicon: δύναμαι
  rationale: δύνανται의 가능성/능력을 간결하게 드러내기 위해 ‘가능하다면’으로 옮겼고, 대상은 ‘다른 사람들도’로 풀어 자연성을 확보했습니다.
theological_decisions:
- issue: 금식 명령의 강도와 공동체적 범위
  chosen_reading: 세례 전에 관계자들과 함께하는 예비 금식 규정을 명시하는 문장으로 옮겼습니다.
  alternative_readings:
  - 권고 수준의 금식으로 약화하기
  - 세례받는 사람만 금식하는 것으로 좁히기
  rationale: 그리스어는 명령형과 의무를 분명히 담고 있으므로 권고로 완화하지 않았고, 세례를 베푸는 사람과 다른 가능한 이들까지 포함하는 공동체적 금식의 범위를 유지했습니다.
  doctrine_reference: 예비 세례 규율과 공동체적 경건 실천
