revisions:
- from: 그러므로 세례 전에 세례를 베푸는 사람과 세례를 받는 사람과 가능하다면 다른 사람들도 미리 금식해야 합니다. 또 세례를 받는 사람에게 하루나 이틀 전에 금식하라고 명령해야 합니다.
  to: 그런데 세례 전에, 세례를 베푸는 사람과 세례를 받는 사람, 그리고 할 수 있는 다른 사람들도 미리 금식하게 하십시오. 또 세례를 받는 사람에게 세례 전에 하루나 이틀 동안 금식하라고 명령하십시오.
  rationale: δὲ의 비인과적 연결을 ‘그런데’로 바로잡고, πρὸ μιᾶς ἢ δύο의 시간 범위를 ‘세례 전에 하루나 이틀 동안’으로 명확히 했습니다. 명령형은 현대 공적 합쇼체 직접 명령으로 유지했으며, 신학적 해석을 추가하지 않았습니다.
