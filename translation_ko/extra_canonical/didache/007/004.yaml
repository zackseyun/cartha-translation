review_pass:
  verdict: revise
  source_fidelity: 첫 접속사 δέ는 문맥을 잇는 대조·전환의 뉘앙스이며, 인과를 뜻하는 ‘그러므로’로 옮기기는 어렵습니다. 또한 마지막의 πρὸ μιᾶς ἢ δύο는 세례 전에 행할 금식의 기간을 가리키므로, 한국어에서는 ‘세례 전에 하루나 이틀 동안’으로 명시하는 편이 정확합니다. 나머지 행위자 구분과 금식 명령의 범위는 원문에 충실합니다.
  naturalness: ‘세례를 베푸는 사람’과 ‘세례를 받는 사람’은 현대 표준어 공적 문체에서 자연스럽습니다. 직접 지시문인 κελεύσεις와 προνηστευσάτω의 명령 성격은 합쇼체 명령형으로 옮기는 것이 더 선명하고 자연스럽습니다.
  terminology: ‘세례’와 ‘금식’은 적절하고 널리 통용되는 용어입니다. ‘세례를 베푸는 사람/받는 사람’은 βαπτίζων/βαπτιζόμενος의 능동·수동 구별을 보존합니다.
  issues:
  - severity: medium
    issue: ‘그러므로’
    rationale: 원문의 δέ는 ‘그러므로’라는 인과 접속을 표시하지 않습니다. ‘그런데’로 옮겨 전환적 연결만 유지해야 합니다.
  - severity: medium
    issue: ‘하루나 이틀 전에 금식하라고’
    rationale: 한국어 어순상 ‘하루나 이틀 전’이라는 특정 시점으로 읽힐 수 있습니다. 원문은 세례 전에 하루 또는 이틀간 금식하라는 지시이므로 기간을 드러내야 합니다.
  - severity: low
    issue: 명령문의 서술적 처리
    rationale: ‘해야 합니다’도 규범성을 전달하지만, 원문의 직접 명령형을 살려 ‘금식하게 하십시오/명령하십시오’로 옮기면 지시문의 형식과 합쇼체 register가 더 잘 보존됩니다.
  revised_text: 그런데 세례 전에, 세례를 베푸는 사람과 세례를 받는 사람, 그리고 할 수 있는 다른 사람들도 미리 금식하게 하십시오. 또 세례를 받는 사람에게 세례 전에 하루나 이틀 동안 금식하라고 명령하십시오.
