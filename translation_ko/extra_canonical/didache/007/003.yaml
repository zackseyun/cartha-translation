source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐὰν δὲ ἀμφότερα μὴ ἔχῃς, ἔκχεον εἰς τὴν κεφαλὴν τρὶς ὕδωρ εἰς ὄνομα Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007/003.yaml
  text: But if you do not have either[a], pour water on the head three times in the name of the Father and of the Son and of the Holy Spirit.
  footnotes:
  - marker: a
    text: Or 'of Father and Son and Holy Spirit'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 둘 다 없으면, 아버지와 아들과 성령의 이름으로 머리에 물을 세 번 부으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐὰν δὲ ἀμφότερα μὴ ἔχῃς
  english_pob_choice: But if you do not have either
  chosen_korean: 그러나 둘 다 없다면
  alternatives_korean:
  - 만일 둘 중 어느 하나도 없다면
  - 그러나 둘을 모두 갖고 있지 않다면
  lexicon: ἀμφότερα
  rationale: ἀμφότερα는 ‘둘 다/둘 모두’를 뜻하므로, 문맥상 대체물 둘이 모두 없다는 조건을 자연스럽게 ‘둘 다 없다면’으로 옮겼습니다.
- source_word: ἔκχεον εἰς τὴν κεφαλὴν
  english_pob_choice: pour water on the head
  chosen_korean: 머리 위에 … 물을 부으십시오
  alternatives_korean:
  - 머리에 물을 붓십시오
  - 머리 위로 물을 쏟으십시오
  lexicon: ἐκχέω + κεφαλή
  rationale: ἔκχεον은 ‘붓다/쏟다’의 동작을 나타내며, εἰς τὴν κεφαλήν은 대상을 ‘머리 위에’ 두는 표현이므로 한국어에서도 그 이미지를 유지했습니다.
- source_word: εἰς ὄνομα Πατρὸς καὶ Υἱοῦ καὶ ἁγίου Πνεύματος
  english_pob_choice: in the name of the Father and of the Son and of the Holy Spirit
  chosen_korean: 아버지와 아들과 성령의 이름으로
  alternatives_korean:
  - 성부와 성자와 성령의 이름으로
  - 아버지와 아들과 거룩한 영의 이름으로
  lexicon: ὄνομα + genitive chain
  rationale: ὄνομα 뒤의 속격 연쇄는 한국어에서 관용적으로 ‘…의 이름으로’로 옮기는 것이 가장 직접적이며, POB의 용례에 맞춰 ‘성령’으로 두었습니다.
theological_decisions:
- issue: 삼위호칭의 표준 한국어 표기와 직접성
  chosen_reading: ‘아버지와 아들과 성령’으로 옮기되, 전통 교회 용어인 ‘성부/성자’보다 원문에 더 직접적인 표현을 채택했습니다.
  alternative_readings:
  - 성부와 성자와 성령의 이름으로
  rationale: 원문은 고유한 위격들을 나열하는 삼중 명칭이며, 한국어에서 가장 직접적이고 이해하기 쉬운 표기는 ‘아버지/아들/성령’입니다. 다만 교회 전통 용어도 가능하므로 대안으로 남겼습니다.
  doctrine_reference: 삼위일체 호칭의 세 위격 명시
