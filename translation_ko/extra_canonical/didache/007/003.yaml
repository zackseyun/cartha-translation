  to: 그러나 둘 다 없으면, 아버지와 아들과 성령의 이름으로 머리에 물을 세 번 부으십시오.
  rationale: 물 붓기의 대상을 ‘머리에’로 바로잡고, 원문의 ‘이름으로’ 구가 행위를 수식하도록 문장 순서를 조정했습니다. 의미 없는 반복 각주는 삭제했습니다. ‘둘 다’는 앞 절에서 언급된 두 선택지가 모두 없다는 ἀμφότερα의 문맥적 의미를 유지합니다.
  reviewer_model: gpt-5.6-terra
