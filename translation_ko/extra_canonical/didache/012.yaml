  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ὁ ἐρχόμενος ἐν ὀνόματι Κυρίου δεχξήσθω, ἔπειτα δὲ δοκιμάσαντες αὐτὸν γνώσεσθε· σύνεσιν γὰρ ἕξετε δεξιὰν καὶ ἀριστεράν. Εἰμὲν παρόδιος ἐστιν ὁ ἐρχόμενος, βοηθεῖτε αὐτῷ ὅσον δύνασθε· οὐ μενεῖ δὲ πρὸς ὑμᾶς εἰ μὴ δύο ἢ τρεῖς ἡμέρας, ἐὰν ᾖ ἀνάγκη. Εἰ δὲ θέλει πρὸς ὑμᾶς καθίσαι, τεχνίτης ὤν, ἐργαζέσθω καὶ φαγέτω· εἰ δὲ οὐκ ἔχει τέχνην, κατὰ τὴν σύνεσιν ὑμῶν προνοήσατε, πῶς μὴ ἀργὸς μεθ᾽ ὑμῶν ζήσεται χριστιανός. Εἰ δ᾽ οὐ θέλει οὕτω ποιεῖν, χριστέμπορός ἐστι· προσέχετε ἀπὸ τῶν τοιούτων.
  language: Greek
  pages:
  - 36
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/012.yaml
  text: But let everyone who comes in the name of the Lord be received[a]; then, after testing him, you will know him, for you will have understanding of right and left. But if the one who comes is a traveler, help him as much as you can; he shall not remain with you more than two or three days, if there is a need. But if he wants to settle among you and is a craftsman, let him work and eat. But if he has no trade, provide, according to your understanding, how a Christian may not live idle among you. But if he is not willing to do so, he is a Messiah-trader[d][c][b]; watch out for such people.
  footnotes:
  - marker: a
    text: This phrase, 'understanding of right and left,' is an idiom for discernment.
    reason: cultural_note
  - marker: b
    text: Or 'craft,' 'skill.'
    reason: lexical_alternative
  - marker: c
    text: The rare Greek term χριστέμπορος (christemporos) means one who makes a profit from Christ, treating the faith as a commodity.
    reason: lexical_alternative
  - marker: d
    text: Or 'provide, according to your understanding, how a Christian may not live idle'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 주님의 이름으로 오는 사람은 누구든지 받아들이십시오[a]. 그런 다음 그를 시험해 보아 알게 되실 것입니다. 오른쪽과 왼쪽의 분별을 가지게 되실 것이기 때문입니다. 그러나 오는 이가 나그네라면, 할 수 있는 만큼 그를 도우십시오. 필요가 있는 경우가 아니면, 두세 날 이상 여러분과 함께 머물지는 않을 것입니다. 또 그가 여러분 가운데 머물고자 하며 기술자가 맞다면, 일하게 하고 먹게 하십시오. 그러나 기술이 없다면, 여러분의 분별에 따라 한 그리스도인이 여러분 가운데서 나태하게 살지 않도록 어떻게 할지 계획하십시오[d]. 그가 그렇게 하려 하지 않으면, 그는 메시아장사꾼[c]입니다[b]. 그런 사람들을 경계하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오른쪽과 왼쪽의 분별’은 분별력이라는 관용적 표현입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘기술’, ‘기능’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 희귀한 그리스어 χριστέμπορος는 그리스도를 통해 이익을 얻는 사람, 곧 믿음을 상품처럼 다루는 사람을 뜻합니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘여러분의 분별에 따라 한 그리스도인이 여러분 가운데서 나태하게 살지 않도록 어떻게 할지 마련하십시오’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν ὀνόματι Κυρίου
  english_pob_choice: in the name of the Lord
  chosen_korean: 주님의 이름으로
  alternatives_korean:
  - 주님의 권위로
  - 주님의 이름 안에
  lexicon: ὄνομα / κύριος
  rationale: 초기 그리스도교의 수신·접수 공식성을 살리면서도, 한국어에서는 자연스럽게 ‘이름으로’가 권위·대표성까지 함께 드러냅니다.
- source_word: δεχθήτω / δεχξήσθω
  english_pob_choice: be received
  chosen_korean: 받아들이십시오
  alternatives_korean:
  - 영접하십시오
  - 받아주십시오
  lexicon: δέχομαι
  rationale: 회중의 환대 규범을 드러내되, 교회적 상투어인 ‘영접하다’보다 더 직접적으로 ‘받아들이십시오’가 원문의 수용 명령을 잘 살립니다.
- source_word: δοκιμάσαντες
  english_pob_choice: after testing him
  chosen_korean: 그를 시험해 보아
  alternatives_korean:
  - 그를 검증하여
  - 그를 살펴보아
  lexicon: δοκιμάζω
  rationale: 단순한 관찰이 아니라 공동체가 진위를 분별하기 위한 검증 행위라는 점을 ‘시험해 보아’로 옮겼습니다.
- source_word: σύνεσιν ... δεξιὰν καὶ ἀριστεράν
  english_pob_choice: understanding of right and left
  chosen_korean: 오른쪽과 왼쪽의 분별
  alternatives_korean:
  - 좌우의 이해
  - 옳고 그름의 분별
  lexicon: σύνεσις
  rationale: 관용구의 낯선 형식을 완전히 풀지 않으면서, 한국어 독자가 뜻을 파악할 수 있도록 ‘분별’로 의미를 드러냈습니다.
- source_word: παρόδιος
  english_pob_choice: traveler
  chosen_korean: 나그네
  alternatives_korean:
  - 여행자
  - 길손
  lexicon: παρόδιος
  rationale: 일시적으로 지나가는 사람이라는 사회적 뉘앙스를 가장 자연스럽게 살리는 전통적이면서도 현재 한국어에 통용되는 표현입니다.
- source_word: τεχνίτης / τέχνην
  english_pob_choice: craftsman / trade
  chosen_korean: 기술자 / 기술
  alternatives_korean:
  - 장인 / 직업
  - 일꾼 / 생업
  lexicon: τέχνη
  rationale: 한 사람은 숙련된 일종의 직업인을, 다른 한 곳은 생계를 위한 기술·업을 가리키므로 같은 어근을 각각 문맥에 맞게 나눠 옮겼습니다.
- source_word: προνοήσατε
  english_pob_choice: plan / provide
  chosen_korean: 계획하십시오
  alternatives_korean:
  - 미리 마련하십시오
  - 대책을 세우십시오
  lexicon: προνοέω
  rationale: 청중이 직접 방책을 세워 마련하라는 뜻을 살리기 위해 ‘계획하십시오’로 옮겼습니다. POB의 ‘plan’ 수정과도 부합합니다.
- source_word: ἀργὸς
  english_pob_choice: idle
  chosen_korean: 나태하게
  alternatives_korean:
  - 게으르게
  - 빈둥거리며
  lexicon: ἀργός
  rationale: 단순한 무직 상태보다 공동체 안에서 생산적으로 살지 않는 태도를 가리키므로, 도덕적 뉘앙스를 가진 ‘나태하게’가 적절합니다.
- source_word: χριστέμπορος
  english_pob_choice: Messiah-trader
  chosen_korean: 메시아장사꾼
  alternatives_korean:
  - 그리스도장사꾼
  - 메시아를 이용해 이익을 챙기는 사람
  lexicon: χριστέμπορος
  rationale: ‘메시아’를 유지해 POB 용례를 따르면서, 원문의 날카로운 비판성—메시아를 상품처럼 거래하는 자—를 한국어의 강한 복합 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘오른쪽과 왼쪽’ 관용구를 얼마나 풀어 쓸지
  chosen_reading: 본문에는 관용구의 형식을 남기되, 한국어에서는 ‘오른쪽과 왼쪽의 분별’로 이해 가능하게 옮겼습니다.
  alternative_readings:
  - 옳고 그름의 분별
  - 모든 일에 대한 분별
  rationale: 원문 특유의 표현을 지우지 않으면서도, 공동체 규범으로서의 분별력을 독자가 즉시 이해하도록 균형을 잡았습니다.
  doctrine_reference: 공동체 분별과 환대 규범
- issue: χριστέμπορος의 신학적 강도
  chosen_reading: ‘메시아장사꾼’으로 직역 성격을 유지해, 메시아를 통한 이익 추구를 정죄하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 그리스도를 이용한 장사꾼
  - 종교적 이익꾼
  rationale: 이 표현은 단순한 부정행위가 아니라 메시아 신앙을 상품화하는 행위를 겨냥하므로, 완화하지 않고 거친 어조를 보존하는 것이 본문 의도에 충실합니다.
  doctrine_reference: 기독교 공동체의 환대와 경계에 관한 교훈
