id: DID.1.6
reference: Didache 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀλλὰ καὶ περὶ τούτου δὴ εἴρηται· Ἱδρωσάτω ἡ ἐλεημοσύνη σου εἰς τὰς χεῖράς σου, μέχρις ἂν γνῷς τίνι δῷς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/006.yaml
  text: 'But about this also it has been said: Let your alms sweat in your hands until you know to whom you should give.'
translation:
  language: ko
  text: 그러나 이 일에 대해서도 이렇게 말해졌습니다. “네 구제물이 네 손 안에서 땀을 흘리게 하십시오, 네가 누구에게 줄지를 알 때까지.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ καὶ περὶ τούτου δὴ εἴρηται
  english_pob_choice: But about this also it has been said
  chosen_korean: 그러므로 이 일에 대해서도 이렇게 말해졌습니다
  alternatives_korean:
  - 그리고 이 일에 대해서도 말해졌습니다
  - 그러나 이 일에 대해서도 말해졌습니다
  lexicon: περὶ τούτου / εἴρηται
  rationale: καὶ … δὴ의 흐름을 살려 ‘이 일에 대해서도’로 두고, 수동 완료형은 자연스러운 인용 도입문인 ‘이렇게 말해졌습니다’로 옮겼습니다.
- source_word: Ἱδρωσάτω ἡ ἐλεημοσύνη σου
  english_pob_choice: Let your alms sweat
  chosen_korean: 네 구제가 네 손에서 땀나게 하라
  alternatives_korean:
  - 네 구제를 네 손에서 땀 흘리게 하라
  - 네 자선을 네 손에서 땀나게 하라
  lexicon: ἡ ἐλεημοσύνη
  rationale: ἐλεημοσύνη를 문맥에 맞게 ‘구제’로 옮기고, 동사 ἱδρωσάτω의 직설적 이미지인 ‘땀나게 하라’를 살려 원문의 충격성을 유지했습니다.
- source_word: εἰς τὰς χεῖράς σου
  english_pob_choice: in your hands
  chosen_korean: 네 손에서
  alternatives_korean:
  - 네 손 안에서
  - 네 손에
  lexicon: εἰς τὰς χεῖράς σου
  rationale: ‘네 손에서’는 손 안에 머무르며 실행을 보류하는 상태를 한국어로 자연스럽게 드러내며, ‘땀나게 하라’와도 긴밀히 연결됩니다.
- source_word: μέχρις ἂν γνῷς τίνι δῷς
  english_pob_choice: until you know to whom you should give
  chosen_korean: 네가 누구에게 줄지 알 때까지
  alternatives_korean:
  - 네가 누구에게 줄지 알기까지
  - 누구에게 주어야 할지 알 때까지
  lexicon: γνῷς / τίνι δῷς
  rationale: 직접 목적어 ‘누구에게’를 분명히 하고, 조건이 충족될 때까지의 시간을 ‘알 때까지’로 간결하게 표현했습니다.
theological_decisions:
- issue: 자선/구제 표현의 선택
  chosen_reading: ἐλεημοσύνη를 ‘구제’로 번역해 단순한 시혜보다 빈곤한 이에게 베푸는 실천적 자비를 드러냈습니다.
  alternative_readings:
  - 자선
  - 구제금
  - 자비
  rationale: 문맥상 단순한 기부 행위보다 실제로 필요한 이에게 주는 구제 행위를 가리키므로, 교회 전통어 ‘자선’보다 의미가 또렷한 ‘구제’를 택했습니다.
  doctrine_reference: 자비와 구제에 대한 실천 윤리
- issue: 명령형의 강한 비유 보존
  chosen_reading: ‘땀나게 하라’는 직역적 비유를 보존해, 선물을 즉시 내어주지 말고 분별될 때까지 붙들라는 금언의 긴박성을 드러냈습니다.
  alternative_readings:
  - 머뭇거리게 하라
  - 유보하라
  - 보류하라
  rationale: 원문은 단순한 지연이 아니라 손 안에서 땀이 날 정도의 강한 이미지로 경계를 세우므로, 이를 완화하지 않았습니다.
  doctrine_reference: 분별에 따른 자선 실천
