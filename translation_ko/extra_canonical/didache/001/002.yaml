base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/002.yaml
  text: 'Now this is the way of life: first[a], you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another either.'
  footnotes:
  - marker: a
    text: Or 'do not do to another.'.
    reason: previous_rendering
translation:
  language: ko
  text: '이것이 곧 생명의 길입니다: 첫째, 여러분을 지으신 하나님을 사랑하십시오; 둘째, 자기 자신처럼 여러분의 이웃을 사랑하십시오. 그리고 여러분이 바라지 않는 일은 다른 사람에게도 하지 마십시오.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: καὶ σύ는 ‘너도/너 역시’의 강조를 담아, 마지막 금지문을 단순한 일반 금지보다 더 직접적으로 만듭니다.
    reason: source_note
lexical_decisions:
- source_word: Ἡ μὲν οὖν ὁδὸς τῆς ζωῆς
  english_pob_choice: Now this is the way of life
  chosen_korean: 이것이 곧 생명의 길입니다
  alternatives_korean:
  - 이제 이것이 생명의 길입니다
  - 그러므로 이것이 생명의 길입니다
  lexicon: ὁδός
  rationale: ὁδός는 단순한 ‘방법’보다 삶의 방향과 실천의 길을 가리키므로, 한국어에서도 ‘생명의 길’로 자연스럽게 옮겼습니다.
- source_word: ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε
  english_pob_choice: you shall love God who made you
  chosen_korean: 여러분을 지으신 하나님을 사랑하십시오
  alternatives_korean:
  - 여러분을 만드신 하나님을 사랑하십시오
  - 여러분을 지은 하나님을 사랑하십시오
  lexicon: ποιέω
  rationale: ποιήσαντά σε는 단순 존재 부여가 아니라 ‘지으신’ 행위를 드러내므로, 창조적 행위를 살린 ‘지으신 하나님’으로 옮겼습니다.
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  english_pob_choice: your neighbor as yourself
  chosen_korean: 자기 자신처럼 여러분의 이웃을 사랑하십시오
  alternatives_korean:
  - 자기 자신같이 여러분의 이웃을 사랑하십시오
  - 여러분의 이웃을 자신처럼 사랑하십시오
  lexicon: πλησίον
  rationale: πλησίον은 추상적 ‘타인’보다 실제로 곁에 있는 이웃을 뜻하므로 ‘여러분의 이웃’으로 유지하고, 문맥상 생략된 ‘사랑하십시오’를 보완했습니다.
- source_word: καὶ σὺ ἄλλῳ μὴ ποίει
  english_pob_choice: do not do to another either
  chosen_korean: 여러분이 바라지 않는 일은 다른 사람에게도 하지 마십시오
  alternatives_korean:
  - 여러분이 바라지 않는 일은 다른 사람에게도 하지 마십시오
  - 여러분이 바라지 않는 일은 다른 이에게도 하지 마십시오
  lexicon: καί σύ + μή ποιέω
  rationale: καὶ σύ는 단순 금지보다 ‘너도/너 역시’라는 강조를 담으므로, ‘...에게도’로 부정 명령의 포괄성과 대응성을 살렸습니다.
theological_decisions:
- issue: Didache의 규범적 명령문을 한국어에서 어떤 높임과 직설성으로 표현할지
  chosen_reading: 본문의 훈계체를 살리되, 현대 표준어 합쇼체로 명령/권면을 유지했습니다.
  alternative_readings:
  - 하라체의 직접 명령
  - 더 완곡한 서술형 표현
  rationale: 이 문장은 교리 설명보다 공동체 윤리 규범을 전달하므로, 권위는 유지하되 현대 독자가 읽기 자연스러운 합쇼체 권면으로 옮겼습니다.
  doctrine_reference: 문체 결정
- issue: ‘여러분을 지으신 하나님’과 창조 신학의 강조
  chosen_reading: ποιήσαντά σε를 단순한 일반적 ‘만들다’보다 창조적 행위가 드러나는 표현으로 옮겼습니다.
  alternative_readings:
  - 만드신 하나님
  - 창조하신 하나님
  rationale: Didache의 첫째 계명은 하나님 사랑의 근거를 창조 행위에 두므로, ‘지으신’이 가장 직접적으로 원문의 논지를 보존합니다.
  doctrine_reference: 창조론
