  source_fidelity: '전반적으로 원문의 병렬 명령, 질문, 결론을 충실히 옮겼습니다. 다만 χάρις는 이 문맥에서 하나님이 베푸시는 ‘은혜’ 자체라기보다, 그렇게 사랑하는 데 따르는 ‘공로/칭찬받을 만함’(영어 POB: credit)을 묻는 말입니다. 또한 결말의 단수 ἐχθρόν은 ‘원수가 없을 것입니다’도 가능하나, ‘원수를 갖지 않게 될 것입니다’가 소유 동사 ἕξετε를 더 직접적으로 반영합니다.'
