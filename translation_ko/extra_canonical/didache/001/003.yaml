id: DID.1.3
reference: Didache 1:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τούτων δὲ τῶν λόγων ἡ διδαχὴ ἐστὶν αὕτη· Εὐλογεῖτε τοὺς καταρωμένους ὑμῖν καὶ προσεύχεσθε ὑπὲρ τῶν ἐχθρῶν ὑμῶν, νηστεύετε δὲ ὑπὲρ τῶν διωκόντων ὑμᾶς· ποία γὰρ χάρις, ἐὰν ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς· οὐχὶ καὶ τὰ ἔθνη τὸ αὐτὸ ποιοῦσιν ; ὑμεῖς δὲ ἀγαπᾶτε τοὺς μισοῦντας ὑμᾶς καὶ οὐχ ἕξετε ἐχθρόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/003.yaml
  text: 'And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.'
translation:
  language: ko
  text: 이 말씀들의 가르침은 이렇습니다. 너희를 저주하는 이들을 축복하고, 너희의 원수들을 위해 기도하며, 너희를 박해하는 이들을 위해 금식하십시오. 너희를 사랑하는 이들을 사랑한다면, 무슨 공로가 있겠습니까? 이방인들도 똑같이 하지 않습니까? 그러나 너희는 너희를 미워하는 이들을 사랑하십시오. 그러면 원수를 갖지 않게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογεῖτε
  english_pob_choice: bless
  chosen_korean: 축복하다
  alternatives_korean:
  - 축복하십시오
  - 복을 빌다
  - 복주다
  lexicon: εὐλογέω
  rationale: 저주하는 이들에게 대응하는 적극적 선행을 살리기 위해 단순한 인사성 표현보다 ‘축복하다’가 원문의 강도를 더 잘 전달합니다.
- source_word: χάρις
  english_pob_choice: credit
  chosen_korean: 은혜
  alternatives_korean:
  - 공로
  - 칭찬
  - 보상
  lexicon: χάρις
  rationale: 본문의 질문은 인간적 공로 계산이 아니라 ‘무슨 특이한 은혜/호의가 있느냐’는 뜻이므로, POB의 의미를 살려 ‘은혜’로 옮겼습니다.
- source_word: ἔθνη
  english_pob_choice: Gentiles
  chosen_korean: 이방인
  alternatives_korean:
  - 민족들
  - 열국
  - 이민족
  lexicon: ἔθνη
  rationale: 여기서는 언약 밖의 ‘이방인들’이라는 대조가 분명하므로 교회적 문맥에서 통용되는 ‘이방인’이 가장 직접적입니다.
- source_word: μισοῦντας ὑμᾶς
  english_pob_choice: those who hate you
  chosen_korean: 너희를 미워하는 이들
  alternatives_korean:
  - 너희를 증오하는 이들
  - 너희를 미워하는 사람들
  lexicon: μισέω
  rationale: 원수/박해자와 구별되는 감정적 적대까지 포함하므로, 과도하게 격한 ‘증오’보다 기본 의미인 ‘미워하다’가 적절합니다.
theological_decisions:
- issue: 명령형의 어조와 공동체적 직접성
  chosen_reading: ‘축복하십시오 / 기도하십시오 / 금식하십시오 / 사랑하십시오’로 직접 권면하는 합쇼체를 유지했습니다.
  alternative_readings:
  - 서술형으로 완화
  - 더 전통적인 경어체로 조정
  rationale: 문장은 교훈적 명령을 연속적으로 제시하므로, 현대 한국어의 공적·권면적 문체로 직접성을 살리는 것이 원문의 수사와 가장 잘 맞습니다.
  doctrine_reference: Didache의 윤리적 교훈 문맥
