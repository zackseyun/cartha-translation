id: DID.1.5
reference: Didache 1:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει· πᾶσι γὰρ θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων. Μακάριος ὁ διδοὺς κατὰ τὴν ἐντολήν· ἀθῷος γάρ ἐστιν· οὐαὶ τῷ λαμβάνοντι· εἰ μὲν γὰρ χρείαν ἔχων λαμβάνει τις, ἀθῷος ἔσται· ὁ δὲ μὴ χρείαν ἔχων δώσει δίκην, ἱνατί ἔλαβε καὶ εἰς τί, ἐν συνοχῇ δὲ γενόμενος ἐξετασθήσεται περὶ ὧν ἔπραξε, καὶ οὐκ ἐξελεύσεται ἐκεῖθεν μέχρις οὗ ἀποδῷ τὸν ἔσχατον κοδράντην.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/005.yaml
  text: Give to everyone who asks you[a], and do not demand it back; for the Father wants his own gifts to be given to all. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives; for if someone receives while having need, he will be innocent, but the one not having need will pay the penalty for why he received and for what purpose. And having come under confinement, he will be examined concerning the things he did[b], and he will not come out from there until he repays the last quadrans.
  footnotes:
  - marker: a
    text: Or "for the Father's will is that giving be done to all from his own gracious gifts.".
    reason: previous_rendering
  - marker: b
    text: 'Or ''will pay the penalty: why he received, and for what purpose.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 구하는 모든 사람에게 주십시오. 그리고 돌려달라고 요구하지 마십시오. 아버지께서는 자신의 은사들이 모든 사람에게 주어지기를 원하십니다. 계명에 따라 주는 사람은 복됩니다. 그는 죄가 없기 때문입니다. 그러나 받는 사람에게는 화가 있습니다. 필요한 가운데 받는 사람은 죄가 없을 것이나, 필요가 없는 사람은 왜 받았는지, 또 무엇을 위해 받았는지에 대해 벌을 받게 될 것입니다. 그리고 구금된 뒤에는 그가 행한 일들에 관해 심문을 받을 것이며, 마지막 1코드란트라도 갚기 전에는 그곳에서 나오지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아버지의 뜻은 그의 은혜로운 선물들로부터 모든 사람에게 주어지게 하는 것입니다.”
    reason: previous_rendering
  - marker: b
    text: '또는 “벌을 받게 될 것입니다: 왜 받았는지, 또 무엇을 위해 받았는지.”'
    reason: previous_rendering
lexical_decisions:
- source_word: Παντὶ τῷ αἰτοῦντί σε δίδου καὶ μὴ ἀπαίτει
  english_pob_choice: Give to everyone who asks you, and do not demand it back
  chosen_korean: 구하는 모든 사람에게 주십시오. 그리고 돌려달라고 요구하지 마십시오
  alternatives_korean:
  - 청하는 모든 이에게 주십시오. 그리고 되돌려 달라고 하지 마십시오
  - 요청하는 모든 사람에게 주십시오. 그리고 그것을 되돌려 달라고 하지 마십시오
  lexicon: δίδου / ἀπαίτει
  rationale: 주다-요구하다의 대조를 살리되, 한국어에서는 ‘돌려달라고 요구하다’로 압박을 유지해 반대 명령의 강도를 드러냈습니다.
- source_word: θέλει δίδοσθαι ὁ πατὴρ ἐκ τῶν ἰδίων χαρισμάτων
  english_pob_choice: for the Father wants his own gifts to be given to all
  chosen_korean: 아버지께서는 자신의 은사들이 모든 사람에게 주어지기를 원하십니다
  alternatives_korean:
  - 아버지께서는 자신의 선물들이 모든 이에게 주어지기를 바라십니다
  - 아버지께서는 자기의 은혜로운 선물들이 모두에게 나누어지기를 원하십니다
  lexicon: θέλει / δίδοσθαι / χαρίσματα
  rationale: ‘원하십니다’로 θέλει의 의지를 살리고, χαρίσματα는 ‘은사들’로 옮겨 ‘선물’보다 베풂의 성격을 유지했습니다.
- source_word: ἐντολή
  english_pob_choice: according to the commandment
  chosen_korean: 계명에 따라
  alternatives_korean:
  - 명령에 따라
  - 명령하신 대로
  lexicon: ἐντολή
  rationale: 공동체 권면문맥에서 ἐντολή의 규범성을 드러내기 위해 ‘계명’을 택했습니다.
- source_word: ἀθῷος
  english_pob_choice: innocent
  chosen_korean: 죄가 없
  alternatives_korean:
  - 무죄한
  - 책임이 없는
  lexicon: ἀθῷος
  rationale: 법정적 무죄보다는 행위 책임의 결여를 강조하는 문맥이므로 ‘죄가 없’으로 풀어 자연스럽게 연결했습니다.
- source_word: ἐν συνοχῇ ... ἐξετασθήσεται
  english_pob_choice: having come under confinement, he will be examined
  chosen_korean: 구금된 뒤에는 ... 심문을 받을 것이며
  alternatives_korean:
  - 감금된 상태에서 ... 조사받을 것이며
  - 곤란에 빠진 뒤에는 ... 확인을 받을 것이며
  lexicon: συνοχή / ἐξετασθήσεται
  rationale: συνοχή를 단순한 내적 압박보다 실제 억류 상태로 이해한 영어 전통을 따라 ‘구금’으로 옮겼고, ἐξετασθήσεται는 사법적 ‘심문’으로 처리했습니다.
theological_decisions:
- issue: 무상으로 받은 것을 다시 돌려 요구하지 말라는 자선 윤리의 강도
  chosen_reading: 구하는 사람에게 주되, 받은 것을 되돌려 달라고 요구하지 말라는 금지로 옮겼습니다.
  alternative_readings:
  - 그냥 주고 기대하지 말라는 일반적 권면으로 완화
  - 대여를 금지하는 뜻으로 좁게 읽기
  rationale: 본문은 단순한 친절이 아니라 공동체적 베풂의 비대칭성을 요구하므로, ‘돌려달라고 요구하지 마십시오’로 금지의 강도를 유지했습니다.
  doctrine_reference: 디다케 1:5의 자선 윤리
