id: DID.1.4
reference: Didache 1:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἀπέχου τῶν σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν. Ἐάν τις σοὶ δῷ ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην, καὶ ἔσῃ τέλειος· ἐὰν ἀγγαρεύσῃ σε τις μίλιον ἕν, ὕπαγε μετʼ αὐτοῦ δύο· ἐὰν ἄρῃ τις τὸ ἱμάτιόν σου, δὸς αὐτῷ καὶ τὸν χιτῶνα· ἐὰν λάβῃ τις ἀπὸ σοῦ τὸ σόν, μὴ ἀπαίτει· οὐδὲ γὰρ δύνασαι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/004.yaml
  text: Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek[a], turn to him the other also, and you will be perfect. If anyone compels you to go one mile, go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able.
  footnotes:
  - marker: a
    text: Or 'If anyone compels you for one mile'.
    reason: previous_rendering
translation:
  language: ko
  text: 육신의 것과 세상적인 욕망을 멀리하십시오. 누가 당신의 오른뺨을 치거든 다른 뺨도 돌려 대십시오. 그러면 당신은 온전한 사람이 될 것입니다. 누가 당신에게 억지로 한 마일을 가게 하거든 그와 함께 두 마일을 가십시오. 누가 당신의 겉옷을 빼앗거든 속옷도 내주십시오. 누가 당신에게서 당신의 것을 가져가거든 돌려달라고 요구하지 마십시오. 사실 당신은 그렇게 할 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 당신에게 한 마일 가도록 강요하거든’으로도 번역할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  english_pob_choice: fleshly and worldly desires
  chosen_korean: 육신의 것과 세상적인 욕망
  alternatives_korean:
  - 육체적인 것과 세상적인 욕망
  - 육신적이고 세속적인 욕망
  - 육정과 세상의 욕망
  lexicon: σαρκικός, κοσμικός, ἐπιθυμία
  rationale: σαρκικῶν과 κοσμικῶν을 단순히 도덕적 죄목으로 좁히지 않고, POB의 ‘fleshly and worldly’ 구분을 따라 육신의 것/세상적인 것으로 살려 대응했습니다.
- source_word: ῥάπισμα εἰς τὴν δεξιὰν σιαγόνα
  english_pob_choice: a blow on the right cheek
  chosen_korean: 오른뺨을 치거든
  alternatives_korean:
  - 오른뺨을 때리거든
  - 오른뺨에 손찌검하거든
  - 오른뺨을 가격하거든
  lexicon: ῥάπισμα, σιαγών
  rationale: ῥάπισμα는 구체적 ‘때림/따귀’ 행위를 가리키므로 자연스러운 한국어로 ‘치다’로 옮기되, 오른뺨이라는 방향 정보는 그대로 유지했습니다.
- source_word: ἀγγαρεύσῃ σε ... μίλιον ἕν
  english_pob_choice: compels you to go one mile
  chosen_korean: 당신에게 억지로 한 마일을 가게 하거든
  alternatives_korean:
  - 당신을 한 마일 강제로 동원하거든
  - 당신에게 한 마일 가도록 강요하거든
  - 당신을 한 마일 짜리 노역에 부리거든
  lexicon: ἀγγαρεύω, μίλιον
  rationale: ἀγγαρεύω의 ‘강제로 동원하다/부역을 시키다’ 의미를 살리면서, 영어 POB의 보강된 motion idiom에 맞춰 ‘가게 하거든’으로 자연스럽게 표현했습니다.
- source_word: ἱμάτιον / χιτών
  english_pob_choice: cloak / tunic
  chosen_korean: 겉옷 / 속옷
  alternatives_korean:
  - 외투 / 속옷
  - 망토 / 속옷
  - 겉옷 / 내의
  lexicon: ἱμάτιον, χιτών
  rationale: 고대 의복의 상대적 구분을 드러내기 위해 바깥옷과 안쪽 옷의 대비를 살렸고, 문맥상 과도한 현대화 없이 이해 가능한 한국어로 옮겼습니다.
theological_decisions:
- issue: τέλειος의 윤리적 결과
  chosen_reading: ‘온전한 사람’으로 번역하여, 단순한 도덕적 흠없음보다 공동체적·윤리적 성숙을 가리키는 결론으로 읽었습니다.
  alternative_readings:
  - 완전한 사람이 될 것입니다
  - 성숙한 사람이 될 것입니다
  - 온전하게 될 것입니다
  rationale: 문맥상 예수 전승의 급진적 실천을 통해 형성되는 삶의 상태를 가리키므로, ‘perfect’의 형용사성을 한국어에서 자연스럽게 풀어 주었습니다.
  doctrine_reference: 마 5:48의 전승과 초기 교훈문맥
