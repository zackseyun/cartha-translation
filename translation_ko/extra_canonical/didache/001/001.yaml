id: DID.1.1
reference: Didache 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὁδοὶ δύο εἰσί, μία τῆς ζωῆς καὶ μία τοῦ θανάτου, διαφορὰ δὲ πολλὴ μεταξὺ τῶν δύο ὁδῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001/001.yaml
  text: There are two ways, one of life and one of death, and there is a great difference between the two ways.
translation:
  language: ko
  text: 길은 두 가지입니다. 하나는 생명의 길이고, 하나는 죽음의 길입니다. 그리고 이 두 길 사이에는 큰 차이가 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ δύο εἰσί
  english_pob_choice: There are two ways
  chosen_korean: 길은 두 가지입니다
  alternatives_korean:
  - 두 길이 있습니다
  - 길이 둘입니다
  lexicon: ὁδός
  rationale: 복수 명사 ὁδοί를 자연스러운 현대 한국어로 옮기되, 길이 단순한 비유가 아니라 두 삶의 방향을 가리킨다는 점을 살려 「길은 두 가지입니다」로 다듬었습니다.
- source_word: μία τῆς ζωῆς καὶ μία τοῦ θανάτου
  english_pob_choice: one of life and one of death
  chosen_korean: 하나는 생명의 길이고, 하나는 죽음의 길입니다
  alternatives_korean:
  - 하나는 생명에 속한 길이고, 하나는 죽음에 속한 길입니다
  - 한 길은 생명으로 가는 길이고, 한 길은 죽음으로 가는 길입니다
  lexicon: ζωή / θάνατος
  rationale: 속격 구조를 의미대로 풀어 두 길의 성격을 분명히 하되, 원문의 대구를 유지하기 위해 「생명의 길 / 죽음의 길」로 간결하게 옮겼습니다.
- source_word: διαφορὰ δὲ πολλὴ
  english_pob_choice: and there is a great difference
  chosen_korean: 그리고 이 두 길 사이에는 큰 차이가 있습니다
  alternatives_korean:
  - 그리고 이 둘 사이에는 큰 차이가 있습니다
  - 그 두 길은 크게 다릅니다
  lexicon: διαφορά
  rationale: διαφορά의 핵심 의미를 ‘차이’로 살리고, πολλή의 강조를 ‘큰’으로 반영하여 원문의 대조를 분명하게 했습니다.
theological_decisions:
- issue: 지혜문학적 대조를 한국어에서 어떻게 보존할지
  chosen_reading: 두 길의 선택과 그 사이의 큰 차이를 분명한 진술문으로 제시했습니다.
  alternative_readings:
  - 명령형 또는 권면형으로 더 강하게 바꾸는 것
  - 운율을 살린 짧은 문장으로 압축하는 것
  rationale: 이 절은 교훈적 진술로서 두 길의 대비를 제시하므로, 과도한 권면 어조를 피하고 원문의 판단적 진술을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: Didache 서두의 교훈 구조
