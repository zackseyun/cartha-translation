source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὅρα μή τις σε πλανήσῃ ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς, ἐπεὶ παρεκτὸς Θεοῦ σε διδάσκει. Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει. Περὶ δὲ τῆς βρώσεως, ὃ δύνασαι βάστασον· ἀπὸ δὲ τοῦ εἰδωλοθύτου λίαν πρόσεχε· λατρεία γάρ ἐστι θεῶν νεκρῶν.
  language: Greek
  pages:
  - 26
  - 28
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006.yaml
  text: See that no one leads you astray from this way of the teaching[a], since he teaches you apart from God. For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can. And concerning food, bear what you are able; but be strictly on guard against what is sacrificed to idols[e][d][c][b], for it is the worship of dead gods.
  footnotes:
  - marker: a
    text: Or 'Take care that no one deceives you from this way of the teaching.'
    reason: lexical_alternative
  - marker: b
    text: '''Perfect'' may also be understood as ''complete'' or ''mature.'''
    reason: lexical_alternative
  - marker: c
    text: Greek λίαν πρόσεχε. Or 'be exceedingly careful about', or 'strictly keep away from'.
    reason: lexical_alternative
  - marker: d
    text: That is, food offered in pagan sacrifice.
    reason: cultural_note
  - marker: e
    text: Or 'lifeless gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아무도 여러분을 이 가르침의 길에서 잘못된 길로 이끌지 않도록 주의하십시오[a]. 그는 여러분을 하나님 밖에서 가르치고 있기 때문입니다. 만일 여러분이 주님의 온전한 멍에를 질 수 있다면, 여러분은 온전한 사람이 될 것입니다[b]. 그러나 할 수 없다면, 여러분이 할 수 있는 것을 하십시오. 그리고 음식에 관해서는, 여러분이 감당할 수 있는 것을 감당하십시오. 그러나 우상에게 바쳐진 음식에는 매우 조심하십시오[c][d][e][f]. 그것은 죽은 신들의 예배이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '아무도 여러분을 이 가르침에서 속이지 못하게 하십시오.'
    reason: alternative_reading
  - marker: b
    text: '''온전한''은 ''완전한'' 또는 ''성숙한''으로도 이해할 수 있습니다.'
    reason: lexical_alternative
  - marker: c
    text: 헬라어 λίαν πρόσεχε는 '매우 조심하다', '극도로 주의하다', 또는 '단단히 경계하다'의 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 곧 이방 제사에서 바쳐진 음식입니다.
    reason: cultural_note
  - marker: e
    text: 또는 '생명 없는 신들'.
    reason: lexical_alternative
  - marker: f
    text: 또는 '우상에게 바쳐진 것'.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα μή τις σε πλανήσῃ
  english_pob_choice: See that no one leads you astray
  chosen_korean: 아무도 여러분을 잘못된 길로 이끌지 않도록 주의하십시오
  alternatives_korean:
  - 아무도 여러분을 속이지 않도록 하십시오
  - 아무도 여러분을 미혹하지 않도록 하십시오
  lexicon: ὁράω; πλανάω
  rationale: 경고의 명령문을 자연스러운 합쇼체로 옮기되, '길' 이미지와 '잘못된 길로 이끌다'를 살려 πλανήσῃ의 유도·탈선 의미를 반영했습니다.
- source_word: τῆς διδαχῆς
  english_pob_choice: the teaching
  chosen_korean: 이 가르침
  alternatives_korean:
  - 이 교훈
  - 이 가르침의 내용
  lexicon: διδαχή
  rationale: 후대의 제도적 '교리'보다 원문의 제자도/교육적 의미를 살려 '가르침'으로 옮겼습니다.
- source_word: παρεκτὸς Θεοῦ σε διδάσκει
  english_pob_choice: he teaches you apart from God
  chosen_korean: 하나님 밖에서 가르치고 있기 때문입니다
  alternatives_korean:
  - 하나님을 떠나 가르치고 있기 때문입니다
  - 하나님과 무관하게 가르치고 있기 때문입니다
  lexicon: παρεκτός; Θεός; διδάσκω
  rationale: παρεκτός의 '밖에/떨어져'라는 분리 감각을 유지하면서, 가르침의 출처와 권위가 하나님과 분리되어 있음을 드러내도록 했습니다.
- source_word: τέλειος
  english_pob_choice: perfect
  chosen_korean: 온전한 사람
  alternatives_korean:
  - 완전한 사람
  - 성숙한 사람
  lexicon: τέλειος
  rationale: 문맥상 도덕적·제자도적 충만함을 가리키므로, 한국어에서 오해를 덜 낳는 '온전한'을 택하되 종결어는 명사구로 자연화했습니다.
- source_word: βαστάσαι ... βάστασον
  english_pob_choice: bear
  chosen_korean: 질 수 있다 / 감당할 수 있는 것을 감당하십시오
  alternatives_korean:
  - 메고 갈 수 있다 / 메십시오
  - 견딜 수 있다 / 견디십시오
  lexicon: βαστάζω
  rationale: 같은 동사의 반복을 한국어에서도 '감당하다'로 연결해 부담을 지는 비유를 살리면서, 앞뒤 절의 호응을 자연스럽게 만들었습니다.
- source_word: εἰδωλοθύτου
  english_pob_choice: what is sacrificed to idols
  chosen_korean: 우상에게 바쳐진 음식
  alternatives_korean:
  - 우상 제물
  - 우상에게 희생된 것
  lexicon: εἰδωλόθυτος
  rationale: 주석적 설명 없이도 문맥이 드러나도록 '음식'을 보강했으며, 이는 영어 POB의 수정 방향과도 일치합니다.
- source_word: λίαν πρόσεχε
  english_pob_choice: be strictly on guard against
  chosen_korean: 매우 조심하십시오
  alternatives_korean:
  - 극도로 주의하십시오
  - 단단히 경계하십시오
  lexicon: προσέχω
  rationale: λίαν의 강도는 '매우'로, πρόσεχε의 주의·경계는 '조심하십시오'로 살려 과도하게 군사적이거나 어색한 표현을 피했습니다.
- source_word: λατρεία ... θεῶν νεκρῶν
  english_pob_choice: it is the worship of dead gods
  chosen_korean: 그것은 죽은 신들의 예배이기 때문입니다
  alternatives_korean:
  - 그것은 죽은 신들에게 드리는 예배이기 때문입니다
  - 그것은 생명 없는 신들의 섬김이기 때문입니다
  lexicon: λατρεία; θεῶν νεκρῶν
  rationale: 문맥의 폴레믹을 살려 직역에 가깝게 유지했고, '죽은 신들'은 우상 제의의 허무함을 강하게 드러냅니다.
theological_decisions:
- issue: τέλειος의 번역 강도
  chosen_reading: 온전한 사람
  alternative_readings:
  - 완전한 사람
  - 성숙한 사람
  rationale: 딱딱한 교리어로 확정하기보다, 제자도적 요구를 드러내는 '온전한'을 택해 원문의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
- issue: θεῶν νεκρῶν의 폴레믹 강도
  chosen_reading: 죽은 신들의 예배
  alternative_readings:
  - 생명 없는 신들의 예배
  - 죽은 신들에게 드리는 예배
  rationale: 우상 제의에 대한 강한 비판을 완화하지 않고, 원문의 날카로운 대조를 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition'
