revisions:
- from: 무엇보다도 저희는 주님께 감사드립니다. 주님께서 능력자이시기 때문입니다. 영광이 주님께 영원히 있습니다.[a]
  to: 모든 것에 앞서 저희는 주님께 감사드립니다. 주님께서 능력이 크시기 때문입니다. 영광이 주님께 영원토록 있습니다.
  rationale: ‘무엇보다도’를 ‘모든 것에 앞서’로 바꾸어 Πρὸ πάντων의 순서상 선행을 직접 반영했습니다. ‘능력자이시기’를 ‘능력이 크시기’로 고쳐 δυνατός εἶ의 서술 구조와 한국어의 자연스러운 예배 문체를 살렸습니다. 기존 각주가 주장한 양의성은 본문 번역에 의해 뒷받침되지 않고, 본 구절에 필수적인 본문비평 또는 해석상 대안을 제공하지 않으므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:16Z'
review_pass:
  verdict: revise
  source_fidelity: Πρὸ πάντων은 여기서 ‘무엇보다도’라는 가치상 최상급보다 ‘모든 것에 앞서/먼저’라는 선행·순서의 표현으로 옮기는 편이 원문 및 영어 POB의 ‘Before all things’에 더 가깝습니다. δυνατός는 ‘능력자’라는 명사보다 하나님을 향한 자연스러운 서술인 ‘능력이 크시다’로 옮기는 것이 적절합니다.
  naturalness: ‘능력자이시기’는 현대 한국어 기도문에서도 다소 부자연스럽습니다. ‘모든 것에 앞서’와 ‘능력이 크시기 때문입니다’는 합쇼체의 공적 예배·감사 문맥에서 자연스럽습니다.
  terminology: ‘주님’, ‘감사드립니다’, ‘영광’, ‘영원토록’은 직접 기도와 송영 문맥에 적합합니다. 다만 원문의 2인칭 지시를 문맥상 ‘주님’으로 풀어낸 것은 유지하되, ‘전능’처럼 δυνατός보다 강한 신학 용어는 사용하지 않았습니다.
  issues:
  - severity: medium
    issue: ‘무엇보다도’가 Πρὸ πάντων의 선행·시간적 뉘앙스를 충분히 드러내지 못합니다.
    rationale: 원문은 ‘모든 것에 앞서’라는 표현이며, 영어 POB도 이를 따라 ‘Before all things’로 번역합니다. ‘무엇보다도’는 주로 중요도의 우선성을 뜻합니다.
  - severity: medium
    issue: ‘능력자이시기’는 δυνατός의 자연스러운 한국어 번역이 아니며 명사화가 불필요합니다.
    rationale: δυνατός εἶ는 ‘당신은 능력이 있으십니다/강하십니다’라는 서술입니다. ‘능력이 크시다’가 의미와 현대적 자연스러움을 함께 보존합니다.
  revised_text: 모든 것에 앞서 저희는 주님께 감사드립니다. 주님께서 능력이 크시기 때문입니다. 영광이 주님께 영원토록 있습니다.
