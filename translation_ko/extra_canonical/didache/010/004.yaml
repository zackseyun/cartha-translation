  text: Πρὸ πάντων εὐχαριστοῦμέν σοι ὅτι δυνατός εἶ· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/004.yaml
  text: Before all things we give thanks to you because you are mighty; to you be the glory forever.
translation:
  language: ko
  text: 무엇보다도 저희는 주님께 감사드립니다. 주님께서 능력자이시기 때문입니다. 영광이 주님께 영원히 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무엇보다도’는 Πρὸ πάντων의 시간적 의미와 우선성 의미를 함께 담은 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ πάντων
  english_pob_choice: Before all things
  chosen_korean: 무엇보다도
  alternatives_korean:
  - 모든 것보다 먼저
  - 우선
  lexicon: Πρὸ πάντων
  rationale: 시간적 선행과 우선성을 함께 담으면서 한국어 예배문맥에서 자연스럽게 읽히도록 옮겼습니다.
- source_word: εὐχαριστοῦμέν
  english_pob_choice: we give thanks
  chosen_korean: 감사드립니다
  alternatives_korean:
  - 감사합니다
  - 감사를 드립니다
  lexicon: εὐχαριστέω
  rationale: 공동체의 감사 행위를 합쇼체로 자연스럽게 드러내면서도 직접적인 감사 표현을 유지했습니다.
- source_word: δυνατός εἶ
  english_pob_choice: you are mighty
  chosen_korean: 능력자이시기 때문입니다
  alternatives_korean:
  - 강하십니다
  - 능하십니다
  lexicon: δυνατός
  rationale: 단순한 ‘힘이 있다’보다 하나님께 대한 찬양 맥락을 살려 ‘능력자’로 옮겼으며, 문장 종결은 이유절로 처리해 앞선 감사의 근거를 분명히 했습니다.
- source_word: ἡ δόξα
  english_pob_choice: the glory
  chosen_korean: 영광
  alternatives_korean:
  - 영예
  - 찬양
  lexicon: δόξα
  rationale: 예배적 송영 공식에 따라 ‘영광’으로 직역해 신학적 무게를 보존했습니다.
theological_decisions:
- issue: 송영의 주체와 종결 형식
  chosen_reading: ‘영광이 주님께 영원히 있습니다’로 옮겨, 헌정적 송영을 한국어 예배체로 유지했습니다.
  alternative_readings:
  - ‘주님께 영광이 영원토록 있습니다’
  - ‘주님께 영광이 세세토록 있습니다’
  rationale: 원문의 소유/귀속 구조(σοὶ ἡ δόξα)와 영원성(εἰς τοὺς αἰῶνας)을 함께 드러내는 쪽을 택했습니다.
  doctrine_reference: 송영(doxology), 하나님의 영원한 주권
- issue: 감사의 대상과 호칭
  chosen_reading: 본문의 2인칭 단수 호칭을 일관되게 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 하나님
  - 주
  rationale: 직접 호칭이므로 한국어 예배문에서 가장 자연스럽고 존중을 드러내는 ‘주님’을 사용했습니다.
  doctrine_reference: 하나님께 드리는 직접 기도·찬양의 호칭
