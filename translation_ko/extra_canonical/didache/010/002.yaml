id: DID.10.2
reference: Didache 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εὐχαριστοῦμέν σοι, Πάτερ ἅγιε, ὑπὲρ τοῦ ἁγίου ὀνόματός σου, οὗ κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν, καὶ ὑπὲρ τῆς γνώσεως καὶ πίστεως καὶ ἀθανασίας, ἧς ἐγνώρισας ἡμῖν διὰ Ἰησοῦ τοῦ παιδός σου· σοὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/002.yaml
  text: 'We give thanks to you, Holy Father,

    for your holy name,

    which you caused to dwell in our hearts,

    and for the knowledge and faith and immortality

    which you made known to us through Jesus your servant;

    to you be the glory forever.'
translation:
  language: ko
  text: '거룩하신 아버지, 우리는 당신께 감사드립니다.


    당신께서 우리 마음속에 머물게 하신 당신의 거룩한 이름[a]과,


    당신의 종 예수를 통하여 우리에게 알려 주신 지식과 믿음과 불멸을 위하여 감사드립니다.


    영광이 영원토록 당신께 있기를 빕니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신께서 우리 마음속에 장막을 치게 하신 당신의 이름’이라는 거주와 임재의 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅγιε / ἁγίου
  english_pob_choice: Holy Father / holy name
  chosen_korean: 거룩하신 아버지 / 거룩한 이름
  alternatives_korean:
  - 성스러운 아버지
  - 거룩한 아버지
  lexicon: ἅγιος
  rationale: 하나님을 부르는 호칭은 합쇼체에 맞게 ‘거룩하신 아버지’로 옮기고, ὀνόμα는 관용적으로 ‘이름’으로 두되 수식어 ‘거룩한’을 유지했습니다.
- source_word: κατεσκήνωσας ἐν ταῖς καρδίαις ἡμῶν
  english_pob_choice: which you caused to dwell in our hearts
  chosen_korean: 그 이름을 우리 마음속에 거처하게 하셨기 때문입니다
  alternatives_korean:
  - 우리 마음속에 살게 하셨기 때문입니다
  - 우리 마음에 장막을 치게 하셨기 때문입니다
  lexicon: κατοικέω / σκηνόω 계열의 거주 이미지
  rationale: 직역의 ‘장막을 치다’보다 한국어에서 자연스러운 ‘거처하게 하다’로 옮기면서도, 내주(內住) 이미지를 유지했습니다.
- source_word: γνώσεως καὶ πίστεως καὶ ἀθανασίας
  english_pob_choice: the knowledge and faith and immortality
  chosen_korean: 지식과 믿음과 영원한 생명
  alternatives_korean:
  - 지식과 믿음과 불멸
  - 앎과 믿음과 불사성
  lexicon: γνῶσις / πίστις / ἀθανασία
  rationale: ἀθανασία는 추상명사 ‘불멸’도 가능하지만, 한국어 독자가 즉시 이해하기 쉬운 ‘영원한 생명’으로 풀어 의미를 살렸습니다.
- source_word: διὰ Ἰησοῦ τοῦ παιδός σου
  english_pob_choice: through Jesus your servant
  chosen_korean: 당신의 종 예수를 통해
  alternatives_korean:
  - 당신의 아이 예수를 통해
  - 당신의 아들 예수를 통해
  lexicon: παῖς
  rationale: 본문의 παῖς는 ‘아들’이 아니라 ‘종/종된 이’의 뉘앙스를 지니므로, POB의 ‘servant’를 따라 ‘종’으로 번역했습니다.
theological_decisions:
- issue: Ἰησοῦ τοῦ παιδός σου의 호칭
  chosen_reading: 예수를 ‘당신의 종’으로 번역했습니다.
  alternative_readings:
  - ‘당신의 아들 예수’로 순화
  - ‘당신의 아이 예수’로 음역적 보존
  rationale: 그리스어 παῖς는 이 문맥에서 종의 의미를 강하게 가질 수 있으므로, 전통적 기독론 용어로 평탄화하지 않고 POB의 해석을 따라 보존했습니다.
  doctrine_reference: 사도행전 3:13, 3:26의 παῖς 전통과 연관된 종-메시아 표현
