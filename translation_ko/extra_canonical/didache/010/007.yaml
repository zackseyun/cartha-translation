  text: But permit the prophets to give thanks as they desire.
translation:
  language: ko
  text: 그러나 예언자들에게는 그들이 원하는 대로 감사 기도를 드리게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐπιτρέπετε는 공동체가 예언자들을 제약하지 말고 감사 기도를 드리도록 허용하라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: Τοῖς δὲ προφήταις
  english_pob_choice: the prophets
  chosen_korean: 예언자들에게는
  alternatives_korean:
  - 선지자들에게는
  - 예언자들에게
  lexicon: προφήτης
  rationale: 디다케 문맥의 προφήτας는 예언적 발화를 하는 사람들을 가리키므로, 현대 표준어에서 이해가 쉬운 ‘예언자’로 옮겼습니다. 조사는 대비를 드러내기 위해 ‘-에게는’을 사용했습니다.
- source_word: ἐπιτρέπετε
  english_pob_choice: permit
  chosen_korean: '...드리게 하십시오'
  alternatives_korean:
  - 허락하십시오
  - 허용하십시오
  - 허락해 주십시오
  lexicon: ἐπιτρέπω
  rationale: 명령형의 공적·공동체적 뉘앙스를 살리되, 한국어에서 자연스러운 종결로 ‘-게 하십시오’를 택해 허가의 의미를 명확히 했습니다.
- source_word: εὐχαριστεῖν
  english_pob_choice: to give thanks
  chosen_korean: 감사 기도를 드리게
  alternatives_korean:
  - 감사하다
  - 감사하게
  - 감사를 드리게
  lexicon: εὐχαριστέω
  rationale: 예배적 감사의 행위를 분명히 드러내기 위해 단순한 ‘감사하다’보다 ‘감사 기도를 드리다’로 구체화했습니다.
- source_word: ὅσα θέλουσιν
  english_pob_choice: as they desire
  chosen_korean: 그들이 원하는 대로
  alternatives_korean:
  - 그들이 바라보는 만큼
  - 원하는 만큼
  lexicon: ὅσα + θέλω
  rationale: 영어 POB의 최신 수정이 반영한 대로 수량화보다 의지·자유를 나타내는 표현으로 이해해, 자연스럽고 직접적으로 ‘그들이 원하는 대로’라고 옮겼습니다.
theological_decisions:
- issue: 예언자들의 감사 발화에 대한 허용의 범위
  chosen_reading: 회중이 예언자들에게 감사 기도의 형식을 그들의 자유에 따라 맡기도록 허용하는 지시로 읽었습니다.
  alternative_readings:
  - 감사 자체의 양이나 분량을 허용하는 지시
  - 예언자 개인의 자의적 예식 허용
  rationale: ὅσα θέλουσιν은 ‘얼마나 많이’보다 ‘원하는 바/원하는 대로’에 더 가깝고, 문맥상 예언자들의 감사 표현의 자유를 인정하는 뜻이 자연스럽습니다.
  doctrine_reference: 초기 교회 예식 질서와 은사적 자유의 조화
- issue: 합쇼체 명령의 화법
  chosen_reading: 공동체 지침으로서 ‘...하십시오’ 체를 유지했습니다.
  alternative_readings:
  - 더 구어적인 ‘...하세요’
  - 격식적인 ‘...하시오’
  rationale: 본문은 공동체에 주는 규범적 지시이므로 현대 문어체 합쇼체가 가장 적절합니다.
  doctrine_reference: 문체 일관성
