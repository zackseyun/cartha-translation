  to: 그러나 예언자들에게는 그들이 원하는 대로 감사드리도록 허락하십시오.[a]
  rationale: ‘감사 기도’를 원문의 일반적인 동사 ‘감사드리다’로 조정하여 불필요한 구체화를 피했습니다. ‘원하는 대로’는 영어 POB와 조응하면서도 자연스러운 한국어로 유지했고, ὅσα θέλουσιν의 방식·범위 관련 여지를 각주에 보존했습니다.
