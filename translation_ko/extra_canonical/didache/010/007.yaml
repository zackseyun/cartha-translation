review_pass:
  verdict: revise
  source_fidelity: 핵심 구조와 명령형은 잘 반영했으나, εὐχαριστεῖν은 본문 자체에서는 단순히 ‘감사드리다/감사하다’이며 ‘기도’를 명시하지 않습니다. 또한 ὅσα θέλουσιν은 문맥상 예언자들에게 감사의 표현을 자유롭게 맡기는 뜻이지만, 방식뿐 아니라 범위·분량의 뉘앙스도 가질 수 있으므로 각주에서 이를 보존하는 편이 좋습니다.
  naturalness: ‘예언자들에게는 원하는 대로 감사드리도록 허락하십시오’는 현대 표준어 합쇼체의 공동체 지침 문맥에서 자연스럽고, 원문의 허용 명령을 분명히 드러냅니다.
  terminology: προφῆται는 ‘예언자들’로 적절합니다. εὐχαριστεῖν에 ‘감사 기도’를 보충하는 것은 바로 앞의 감사 예식 문맥과 조화될 수 있으나, 이 절의 어휘보다 구체적이므로 ‘감사드리다’로 옮기는 것이 더 절제되고 충실합니다.
  issues:
