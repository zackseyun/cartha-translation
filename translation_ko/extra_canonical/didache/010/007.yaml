    rationale: εὐχαριστεῖν은 ‘감사드리다’라는 동사이며, ‘기도’는 원문에 직접 나타나지 않습니다. 문맥적 설명은 각주에서 처리하는 편이 안전합니다.
  - severity: low
    issue: 기존 각주가 ὅσα θέλουσιν의 가능한 범위를 충분히 드러내지 않음
    rationale: 이 표현은 예언자들의 자유를 나타내지만, ‘원하는 대로’는 방식의 자유와 범위 또는 분량의 자유를 모두 암시할 수 있습니다. 한쪽으로 단정하지 않는 주석이 바람직합니다.
