    issue: Μετὰ δὲ를 ‘그러므로’로 번역함
    rationale: δὲ는 여기서 앞 단락에 이어지는 전환·연결을 나타내며, ‘그러므로’가 암시하는 강한 추론·결론 관계는 본문에 없습니다. ‘그리고’가 문맥과 원문에 더 가깝습니다.
  - severity: low
    issue: 각주가 독자에게 필요한 본문 변이·대안 번역이 아니라 번역자의 선택을 설명함
    rationale: ‘배부르게 된 뒤에’는 본문에서 충분히 명확하며, 원문상 중대한 모호성이나 논쟁적 이문이 아닙니다. 각주를 유지할 필요가 없습니다.
