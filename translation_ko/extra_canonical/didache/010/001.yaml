lexical_decisions:
- source_word: Μετὰ δὲ τὸ ἐμπλησθῆναι
  english_pob_choice: after you are satisfied
  chosen_korean: 배부르게 된 뒤에
  alternatives_korean:
  - 먹고 난 뒤에
  - 채워진 뒤에
  - 만족하게 된 뒤에
  lexicon: ἐμπλησθῆναι
  rationale: 식사 직후의 맥락에서 ἐμπλησθῆναι는 영적 ‘채움’이 아니라 음식으로 배부른 상태를 뜻하므로, 자연스럽고 오해 없는 ‘배부르게 된 뒤에’로 옮겼습니다.
- source_word: εὐχαριστήσατε
  english_pob_choice: give thanks
  chosen_korean: 감사하십시오
  alternatives_korean:
  - 감사하라
  - 감사를 드리십시오
  - 감사드리십시오
  lexicon: εὐχαριστέω
  rationale: 명령형으로서의 직접적 촉구를 살리되, 현대 합쇼체의 문맥에 맞게 ‘감사하십시오’로 옮겼습니다.
- source_word: οὕτως
  english_pob_choice: in this way
  chosen_korean: 이렇게
  alternatives_korean:
  - 이와 같이
  - 이런 방식으로
  lexicon: οὕτως
  rationale: 앞뒤 문맥이 ‘감사 기도문’을 제시하는 구조이므로, 단순한 방식의 지시를 담는 ‘이렇게’가 가장 자연스럽습니다.
theological_decisions:
- issue: 식후 감사의 성격
  chosen_reading: 이 절은 식사가 끝난 뒤 드리는 감사 기도를 도입하는 지시문으로 이해했습니다.
  alternative_readings:
  - 영적으로 ‘채워진 뒤’라는 비유적 읽기
  - 일반적인 만족 상태에 대한 교훈적 읽기
  rationale: Didache 10:1의 문맥은 식사 후 감사이며, 본문의 동사는 음식으로 배부른 상태를 가리키므로 그 실천적 의미를 살렸습니다.
  doctrine_reference: 초대교회 식사 후 감사 기도 전통
