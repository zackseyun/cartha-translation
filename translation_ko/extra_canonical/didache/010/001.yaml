  source_fidelity: 그리스어 Μετὰ δὲ는 단순한 논리적 결론을 뜻하는 ‘그러므로’가 아니라 앞선 식사 감사에 이어지는 전환의 ‘그러나/그리고 나서’에 가깝습니다. ἐμπλησθῆναι는 식사 문맥에서 ‘배부르게 되다’로 적절하며, εὐχαριστήσατε와 οὕτως도 각각 명령과 방식 지시를 잘 반영합니다.
  naturalness: ‘배부르게 된 뒤에’와 ‘이렇게 감사하십시오’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 문두 ‘그러므로’는 원문의 접속 표현을 과도하게 논리화하므로 ‘그리고’로 고치는 것이 자연스럽고 충실합니다.
  terminology: ‘감사하십시오’는 εὐχαριστήσατε에 알맞으며 특정 교파적 용어를 강요하지 않습니다. 식사 문맥을 나타내는 ‘배부르게 된 뒤에’도 적절합니다. 현 각주는 번역 선택의 내부 설명에 가까워 독자 주석으로는 불필요하므로 삭제하는 편이 낫습니다.
  issues:
