id: DID.10.5
reference: Didache 10:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μνήσθητι, Κύριε, τῆς ἐκκλησίας σου τοῦ ῥύσασθαι αὐτὴν ἀπὸ παντὸς πονηροῦ καὶ τελειῶσαι αὐτὴν ἐν τῇ ἀγάπῃ σου, καὶ σύναξον αὐτὴν ἀπὸ τῶν τεσσάρων ἀνέμων, τὴν ἁγιασθεῖσαν εἰς τὴν σὴν Βασιλείαν, ἣν ἡτοίμασας αὐτῇ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/005.yaml
  text: Remember[a], Lord, your church, to deliver it from every evil and to perfect it in your love; and gather it from the four winds, the one sanctified for your kingdom, which you prepared for it. For yours is the power and the glory forever.
  footnotes:
  - marker: a
    text: Or 'and gather it, the sanctified one,'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님, 주님의 회중을 기억하셔서 모든 악에서 건져 내시고 주님의 사랑 안에서 온전하게 하시며, 주님께서 그 회중을 위하여 예비하신 주님의 나라를 위하여 거룩하게 된 그 회중을 사방에서 모아 주십시오. 권능과 영광이 영원토록 주님의 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησία
  english_pob_choice: your church
  chosen_korean: 당신의 회중
  alternatives_korean:
  - 당신의 교회
  - 당신의 모임
  lexicon: ἐκκλησία
  rationale: 이 문맥은 제도명보다 하나님께 속한 모인 공동체를 가리키므로, 본문 흐름을 살려 ‘회중’으로 옮겼습니다.
- source_word: ῥύσασθαι
  english_pob_choice: to deliver it from every evil
  chosen_korean: 모든 악에서 건져 내시고
  alternatives_korean:
  - 모든 악에서 구원하시고
  - 모든 악에서 해방하시고
  lexicon: ῥύομαι
  rationale: 구체적 위험에서 건져 내는 뉘앙스를 살려 ‘건져 내다’로 옮겼습니다.
- source_word: τελειῶσαι
  english_pob_choice: to perfect it
  chosen_korean: 완전하게 하시며
  alternatives_korean:
  - 온전하게 하시며
  - 완성하게 하시며
  lexicon: τελειόω
  rationale: 윤리적·종말론적 완성의 뜻을 유지하면서 한국어로는 ‘완전하게 하다’가 가장 직접적입니다.
- source_word: τὴν ἁγιασθεῖσαν
  english_pob_choice: the one sanctified
  chosen_korean: 거룩하게 된 그 회중
  alternatives_korean:
  - 성결케 된 그 회중
  - 성화된 그 회중
  lexicon: ἁγιάζω
  rationale: 영문 개정처럼 개인화된 ‘한 사람’으로 오해되지 않도록, 분사구를 회중에 대한 수식으로 분명히 살렸습니다.
theological_decisions:
- issue: κυριος 기도문에서의 직접 호칭과 마무리 송영의 존칭 처리
  chosen_reading: 기도 전체를 하나님께 드리는 청원문으로 보고 ‘주님’과 ‘당신’의 존칭을 일관되게 사용했습니다.
  alternative_readings:
  - ‘주여’
  - ‘당신의 것’ 대신 더 전통적인 송영 표현
  rationale: 합쇼체 본문으로 읽히도록 하면서도, 직접 호칭과 송영의 예배적 성격을 유지했습니다.
  doctrine_reference: 공동체 기도문/송영의 예전적 언어
- issue: ‘네 바람에서부터’의 방향성 보존
  chosen_reading: ‘네 바람에서부터’로 직역해 원문의 전 우주적 집합 이미지를 살렸습니다.
  alternative_readings:
  - ‘사방에서’
  - ‘네 곳 모퉁이에서’
  rationale: 일반화된 표현보다 원문의 상징적 범위를 드러내는 표현이 더 source-direct합니다.
  doctrine_reference: 종말론적 집합 이미지
