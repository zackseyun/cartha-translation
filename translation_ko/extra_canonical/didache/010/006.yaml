  to: 은혜가 오기를, 이 세상이 지나가기를 바랍니다. 다윗의 아들에게 호산나![a] 누구든지 거룩하면 오십시오. 누구든지 거룩하지 않으면 회개하십시오. 마라나타.[b] 아멘.
