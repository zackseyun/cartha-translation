id: DID.10.6
reference: Didache 10:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐλθέτω χάρις καὶ παρελθέτω ὁ κόσμος οὗτος. Ὡσαννὰ τῷ υἱῷ Δαβίδ. Εἴ τις ἅγιός ἐστιν, ἐρχέσθω· εἴ τις οὐκ ἔστι, μετανοείτω· μαρανᾰθά. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/006.yaml
  text: 'Let grace come,

    and let this world pass away.

    Hosanna to the son of David.

    If anyone is holy, let him come;

    if anyone is not, let him repent.

    Maranatha. Amen.'
translation:
  language: ko
  text: 은혜가 오기를, 이 세상이 지나가기를 바랍니다. 다윗의 아들에게 호산나![a] 누구든지 거룩하면 오십시오. 누구든지 거룩하지 않으면 회개하십시오. 마라나타.[b] 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호산나’는 히브리어에서 온 예배의 외침을 음역한 말입니다.
    reason: cultural_note
  - marker: b
    text: ‘마라나타’는 아람어 예배 표현입니다. 그 분절과 정확한 뜻에는 논의가 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐλθέτω χάρις
  english_pob_choice: Let grace come
  chosen_korean: 은혜가 오게 하시고
  alternatives_korean:
  - 은혜가 오기를
  - 은혜가 임하게 하십시오
  lexicon: χάρις
  rationale: 직역처럼 보이면서도 한국어에서 자연스럽게 청원형을 살리기 위해 ‘오게 하시고’를 택했습니다. ‘임하다’는 더 종교적이지만 원문의 동사 감각보다 해석이 강합니다.
- source_word: παρελθέτω ὁ κόσμος οὗτος
  english_pob_choice: let this world pass away
  chosen_korean: 이 세상은 지나가게 하십시오
  alternatives_korean:
  - 이 세상은 사라지게 하십시오
  - 이 세상은 지나가게 되기를
  lexicon: κόσμος
  rationale: κόσμος를 단순히 ‘세상’으로 옮기되, 종말론적 소멸/지남의 뉘앙스를 살려 ‘지나가게 하십시오’로 번역했습니다.
- source_word: Ὡσαννὰ τῷ υἱῷ Δαβίδ
  english_pob_choice: Hosanna to the son of David
  chosen_korean: 다윗의 아들에게 호산나
  alternatives_korean:
  - 다윗의 아들에게 구원하소서
  - 다윗의 아들에게 호산나
  lexicon: υἱῷ Δαβίδ
  rationale: 통용되는 예배적 외침 ‘호산나’를 유지하고, τῷ υἱῷ Δαβίδ는 관용적으로 ‘다윗의 아들’로 옮기되 한국어 어순에 맞춰 배치했습니다.
- source_word: Εἴ τις ἅγιός ἐστιν
  english_pob_choice: If anyone is holy
  chosen_korean: 거룩한 사람이 있으면
  alternatives_korean:
  - 누구든지 거룩하면
  - 누구든지 성도이면
  lexicon: ἅγιος
  rationale: 여기서는 집합명사적 ‘성도’보다 자격 진술인 ‘거룩한 사람’이 원문의 조건문을 더 직접적으로 드러냅니다.
theological_decisions:
- issue: 종말 기원문의 정서와 명령형 처리
  chosen_reading: ‘은혜가 오게 하시고, 이 세상은 지나가게 하십시오’로 번역해 공동체적 종말 기원의 간구성을 살렸습니다.
  alternative_readings:
  - ‘은혜가 오기를, 이 세상이 지나가기를’처럼 보다 문어적 소망형
  - ‘은혜여 오라’처럼 호격화하는 해석
  rationale: 원문은 선언형이 아니라 간구/소망의 리듬을 갖고 있으므로, 한국어에서도 명령형 청원으로 그 긴장을 보존하는 편이 자연스럽습니다.
  doctrine_reference: 종말론적 기도 어조
