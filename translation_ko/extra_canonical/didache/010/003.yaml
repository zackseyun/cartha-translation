  source_fidelity: 핵심 어휘와 대조 구조는 대체로 충실합니다. 다만 ἵνα σοι εὐχαριστήσωσιν의 목적절을 ‘그들이 주님께 감사하게 하려는 것이었습니다’로 독립 서술하면 목적 관계가 다소 불분명하고 한국어 문장도 부자연스럽습니다. ‘감사드리게 하시려고’로 목적을 직접 연결하는 편이 원문에 더 가깝습니다.
