id: DID.10.3
reference: Didache 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Σὺ, δέσποτα παντοκράτορ, ἔκτισας τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου, τροφήν τε καὶ ποτὸν ἔδωκας τοῖς ἀνθρώποις εἰς ἀπόλαυσιν ἵνα σοι εὐχαριστήσωσιν, ἡμῖν δὲ ἐχαρίσω πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον διὰ τοῦ παιδός σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/010/003.yaml
  text: 'You, almighty Master,

    created all things for the sake of your name,

    and gave food and drink to people for enjoyment,

    so that they might give thanks to you;

    but to us you graciously gave spiritual food and drink

    and eternal life through your servant.'
translation:
  language: ko
  text: 주권자시며 전능하신 분이시여, 주님의 이름을 위하여 만물을 창조하셨고, 사람들에게 먹을 것과 마실 것을 즐기도록 주셔서 그들이 주님께 감사드리게 하셨습니다. 그러나 우리에게는 주님의 종을 통하여 영적인 먹을 것과 마실 것과 영원한 생명을 은혜로 주셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: δέσποτα παντοκράτορ는 직역하면 ‘주권자, 전능자’에 가깝습니다.
    reason: source_note
  - marker: b
    text: διὰ τοῦ παιδός σου의 παῖς는 문맥상 ‘종’으로도, 경우에 따라 ‘아들’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: δέσποτα παντοκράτορ
  english_pob_choice: almighty Master
  chosen_korean: 주권자 전능하신 분이시여
  alternatives_korean:
  - 전능하신 주인님이시여
  - 전능하신 주님이시여
  lexicon: δέσποτα, παντοκράτωρ
  rationale: δέσποτα는 단순한 ‘주인’보다 권세를 지닌 주권자/주재자 뉘앙스가 강하고, παντοκράτορ는 ‘전능하신’이 핵심이므로 두 요소를 함께 살렸습니다.
- source_word: τὰ πάντα ἕνεκεν τοῦ ὀνόματός σου
  english_pob_choice: created all things for the sake of your name
  chosen_korean: 주님의 이름을 위하여 만물을 지으셨고
  alternatives_korean:
  - 주님의 이름 때문에 모든 것을 지으셨고
  - 주님의 이름을 위해 모든 것을 창조하셨고
  lexicon: τὰ πάντα, ἕνεκεν, ὄνομα
  rationale: ἕνεκεν은 목적/이유를 나타내므로 ‘위하여’로 옮기고, τὰ πάντα는 문맥상 ‘만물’이 자연스럽습니다.
- source_word: τοῖς ἀνθρώποις εἰς ἀπόλαυσιν
  english_pob_choice: to people for enjoyment
  chosen_korean: 사람들에게는 먹을 것과 마실 것을 주어 즐기게 하셨으니
  alternatives_korean:
  - 사람들에게 즐거움을 위해
  - 사람들에게 누리도록
  lexicon: ἀνθρώποις, ἀπόλαυσις
  rationale: ἀπόλαυσις는 단순 소유보다 ‘즐기도록/누리도록’의 목적을 나타내므로, 앞의 음식·음료를 함께 받아 자연스러운 한국어로 풀었습니다.
- source_word: πνευματικὴν τροφὴν καὶ ποτὸν καὶ ζωὴν αἰώνιον
  english_pob_choice: spiritual food and drink and eternal life
  chosen_korean: 영적인 먹을 것과 마실 것과 영원한 생명
  alternatives_korean:
  - 영적 양식과 마실 것과 영원한 생명
  - 성령의 먹을 것과 마실 것과 영원한 생명
  lexicon: πνευματική, τροφή, ποτόν, ζωὴ αἰώνιος
  rationale: πνευματική는 여기서 물질적 음식과 대비되는 ‘영적인’ 의미이고, τροφή/ποτόν은 제의적·상징적 어감보다 평이한 ‘먹을 것/마실 것’으로 옮겼습니다.
- source_word: διὰ τοῦ παιδός σου
  english_pob_choice: through your servant
  chosen_korean: 주님의 종을 통해
  alternatives_korean:
  - 주님의 아이를 통해
  - 주님의 아들을 통해
  - 주님의 종을 통하여
  lexicon: παῖς
  rationale: παῖς는 ‘아들’과 ‘종’ 사이의 의미 영역이 있으나, 이 문맥의 감사기도에서는 하나님께 드리는 종/섬김의 의미가 더 직접적이어서 ‘종’을 택했습니다.
theological_decisions:
- issue: 하나님 호칭으로서의 δεσπότης와 παντοκράτωρ의 합성 뉘앙스
  chosen_reading: ‘주권자 전능하신 분이시여’로 옮겨 절대 주권과 전능을 함께 드러냈습니다.
  alternative_readings:
  - ‘전능하신 주인님이시여’
  - ‘만물의 주재자이시여’
  rationale: 이 기도문은 단순 호칭보다 찬양적 서두이므로, ‘주권자’로 통치 권위를, ‘전능하신’으로 παντοκράτωρ의 범위를 살리는 것이 적절합니다.
  doctrine_reference: 하나님의 주권과 전능에 대한 기독교 신학 일반
- issue: διὰ τοῦ παιδός σου의 해석
  chosen_reading: 문맥상 예배자들이 하나님께 드리는 감사기도이므로, 구원사적 제목보다 ‘주님의 종’을 택했습니다.
  alternative_readings:
  - ‘주님의 아들을 통해’
  - ‘주님의 종을 통해’
  rationale: 헬라어 παῖς는 문맥에 따라 아들/종을 모두 가질 수 있으나, 본문 자체는 메시아 칭호를 명시하지 않으며 앞뒤가 봉헌적 감사 구조이므로 더 절제된 ‘종’이 원문에 가깝습니다.
  doctrine_reference: παις의 의미 범위에 대한 원문 문맥 판단
