source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται. Πυκνῶς δὲ συναχθήσεσθε ζητοῦντες τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν· οὐ γὰρ ὠφελήσει ὑμᾶς ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν, ἐὰν μὴ ἐν τῷ ἐσχάτῳ καιρῷ τελειωθῆτε. Ἐν γὰρ ταῖς ἐσχάταις ἡμέραις πληθυνθήσονται οἱ ψευδοπροφῆται καὶ οἱ φθορεῖς καὶ στραφήσονται τὰ πρόβατα εἰς λύκους καὶ ἡ ἀγάπη στραφήσεται εἰς μῖσος· αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος. Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος. Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον
    φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν· οὐ πάντων δέ, ἀλλ᾽ ὡς ἐρρέθη· Ἥξει ὁ Κύριος καὶ πάντες οἱ ἅγιοι μετ᾽ αὐτοῦ. Τότε ὄψεται ὁ κόσμος τὸν Κύριον ἐρχόμενον ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ.
  language: Greek
  pages:
  - 40
  - 42
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016.yaml
  text: 'Keep watch over your life.a Do not let your lamps be quenched[a], and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming. And gather together often, seeking the things that are fitting for your souls;c for the whole time of your faith will not profit you unless you are made complete in the last season. For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred. For as lawlessness increases, they will hate one another and persecute and betray, and then the world-deceiverd will appear as a son of Gode and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened since the age began. Then the creation of menf will come into the fire of testing, and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.g
    And then the signs of the truth will appear: first, a sign of an opening out in heaven;h then a sign of a trumpet''s voice; and the third, the resurrection of the dead—yet not of all, but as it was said: The Lord will come[k][j][i][h][g][f][e][d][c][b], and all the holy ones with him.i Then the world will see the Lord coming upon the clouds of heaven.j'
  footnotes:
  - marker: a
    text: Or 'for your life.' The Greek preposition ὑπέρ can carry a protective sense.
    reason: lexical_alternative
  - marker: b
    text: Literally 'do not let your loins be unloosed,' an image of readiness for action also found in biblical exhortation (e.g., Luke 12:35, Eph. 6:14).
    reason: cultural_note
  - marker: c
    text: Or 'what pertains to your souls' / 'what is beneficial for your souls.'
    reason: lexical_alternative
  - marker: d
    text: Greek ὁ κοσμοπλάνος, a rare apocalyptic term for the final Antichrist figure.
    reason: lexical_alternative
  - marker: e
    text: The Greek says ὡς υἱὸς Θεοῦ, 'as a son of God,' without the definite article, suggesting a claim to divine status rather than the specific title 'the Son of God.'
    reason: alternative_reading
  - marker: f
    text: The phrase ἡ κτίσις τῶν ἀνθρώπων, 'the creation of men,' is unusual and may be understood more broadly as 'the human race' or 'mankind.'
    reason: alternative_reading
  - marker: g
    text: The clause 'will be saved by the accursed one himself' (σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος) is textually and theologically difficult. Interpretations vary widely, and the transmitted Greek may be corrupt. Some suggest it means 'saved from under the curse itself' (i.e., the world-deceiver's reign).
    reason: textual_variant
  - marker: h
    text: The expression σημεῖον ἐκπετάσεως, rendered 'a sign of an opening out in heaven,' is rare and uncertain; alternatives include 'an outspreading' or 'an unfolding' in heaven.
    reason: lexical_alternative
  - marker: i
    text: A quotation echoing Zechariah 14:5.
    reason: cross_reference
  - marker: j
    text: The final line echoes the imagery of the Son of Man's coming in Daniel 7:13 and the Gospel tradition (e.g., Matt. 24:30, 26:64).
    reason: cross_reference
  - marker: k
    text: Or 'by the accursed one himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분의 생명을 두고 깨어 있으십시오. 여러분의 등불이 꺼지지 않게 하고, 여러분의 허리가 풀어지지 않게 하십시오. 오히려 준비하고 있으십시오. 우리 주께서 어느 시간에 오실지 여러분은 알지 못하기 때문입니다. 또 자주 모여 여러분의 영혼에 합당한 것을 찾으십시오. 믿음의 온 기간이 마지막 때에 완전하게 되지 않으면 여러분에게 아무 유익이 없기 때문입니다. 마지막 날들에는 거짓 예언자들과 타락시키는 자들이 많아지고, 양들은 늑대들로 바뀌며, 사랑은 미움으로 바뀔 것입니다. 불법이 늘어나므로 그들은 서로 미워하고 박해하며 넘겨줄 것입니다. 그러면 세상의 속이는 자가 하나님의 아들인 것처럼 나타나 표징들과 이적들을 행할 것이며, 땅은 그의 손에 넘겨질 것입니다. 그는 세상이 시작된 이래 결코 일어난 적이 없는 무법한 일들을 행할 것입니다. 그때 사람들의 피조 세계는 시험의 불길 속으로 들어가고, 많은 사람이 걸려 넘어져 멸망할 것이나, 자기들의 믿음 안에 견디는 자들은 그 저주 아래에서 구원을 받을 것입니다. 그리고 그때 진리의 표징들이 나타날 것입니다. 먼저 하늘에 펼쳐지는 표징이 있고, 다음에는 나팔 소리의 표징이 있으며, 세 번째는 죽은 자들의 부활입니다. 그러나 모든 사람의 부활은 아니고, 말씀하신 바와 같습니다. “주께서 오실 것이며, 모든 거룩한 이들이 그와 함께 올 것입니다.” 그러면 세상은 하늘 구름 위에 오시는 주를 보게 될 것입니다.[a][b][c][d][e][f][g][h][i][j]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여러분의 생명을 위해’로도 옮길 수 있습니다. ὑπέρ는 보호를 위한 의미를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘허리를 풀어지게 하지 말라’입니다. 준비 태세를 나타내는 성경적 이미지입니다.
    reason: cultural_note
  - marker: c
    text: ‘여러분의 영혼에 속한 것’ 또는 ‘여러분의 영혼에 유익한 것’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 희귀한 묵시적 용어 ὁ κοσμοπλάνος를 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: e
    text: 그리스어는 정관사 없이 ‘하나님의 아들처럼’이라고 되어 있어, 참된 칭호라기보다 신적 지위를 주장하는 위장을 시사합니다.
    reason: alternative_reading
  - marker: f
    text: ἡ κτίσις τῶν ἀνθρώπων은 문자적으로 ‘사람들의 창조/피조 세계’로, 더 넓게는 ‘인류’로 이해될 수 있습니다.
    reason: alternative_reading
  - marker: g
    text: σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος는 본문상 매우 난해합니다. 전승이 훼손되었을 가능성도 있어 여러 해석이 가능합니다.
    reason: textual_variant
  - marker: h
    text: σημεῖον ἐκπετάσεως는 드문 표현으로, ‘펼쳐짐’ 또는 ‘열림’의 이미지로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: i
    text: 스가랴 14:5의 이미지를 반영하는 인용/연상입니다.
    reason: cross_reference
  - marker: j
    text: 다니엘 7:13과 복음서의 ‘인자’ 오심 이미지를 연상시킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν
  english_pob_choice: Keep watch over your life
  chosen_korean: 여러분의 생명을 두고 깨어 있으십시오
  alternatives_korean:
  - 여러분의 삶을 위해 깨어 있으십시오
  - 여러분의 생명 위에서 깨어 있으십시오
  lexicon: γρηγορέω; ὑπέρ
  rationale: 깨어 있으라는 명령과 ὑπέρ의 보호적 뉘앙스를 함께 살리기 위해 직역에 가깝게 옮기되, 한국어에서는 ‘두고’로 경계와 보호의 대상을 드러냈습니다.
- source_word: οἱ λύχνοι ... μὴ σβεσθήτωσαν / αἱ ὀσφύες ... μὴ ἐκλυέσθωσαν
  english_pob_choice: Do not let your lamps be quenched / do not let your loins be loosened
  chosen_korean: 여러분의 등불이 꺼지지 않게 하고, 여러분의 허리가 풀어지지 않게 하십시오
  alternatives_korean:
  - 여러분의 등불을 끄지 마십시오
  - 여러분의 허리를 느슨하게 하지 마십시오
  lexicon: σβέννυμι; ἐκλύω
  rationale: 등불과 허리의 이미지를 그대로 보존했습니다. ‘허리가 풀어지다’는 성경적 준비 태세의 은유를 한국어로도 최대한 직접적으로 살린 표현입니다.
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  english_pob_choice: the things that are fitting for your souls
  chosen_korean: 여러분의 영혼에 합당한 것
  alternatives_korean:
  - 여러분의 영혼에 필요한 것
  - 여러분의 영혼에 속한 것
  lexicon: ἀνήκω
  rationale: πρός/ἀνήκω 계열의 적합성·마땅함을 살려, 단순한 유익보다 도덕적·영적 ‘합당함’을 드러냈습니다.
- source_word: ὁ κοσμοπλάνος
  english_pob_choice: the world-deceiver
  chosen_korean: 세상의 속이는 자
  alternatives_korean:
  - 세상 속임수의 자
  - 세상을 미혹하는 자
  lexicon: κοσμοπλάνος
  rationale: 희귀한 묵시적 칭호를 인물형으로 풀어 한국어 독자가 이해하기 쉽게 하면서도 ‘세상’을 미혹하는 종말적 사기꾼이라는 힘을 유지했습니다.
- source_word: ὡς υἱὸς Θεοῦ
  english_pob_choice: as a son of God
  chosen_korean: 하나님의 아들인 것처럼
  alternatives_korean:
  - 하나님의 아들처럼
  - 하나님의 아들인 양
  lexicon: υἱός; Θεός
  rationale: 정관사 부재가 주는 비(非)고유칭호성을 살려, 참된 메시아 칭호를 부여하지 않고 모방적 주장으로 옮겼습니다.
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  english_pob_choice: the creation of men
  chosen_korean: 사람들의 피조 세계
  alternatives_korean:
  - 인류
  - 사람의 창조
  lexicon: κτίσις
  rationale: 이상하고 넓은 표현을 너무 매끈하게 풀지 않고, ‘피조 세계’로 두어 인간 전체를 가리키는지 혹은 더 넓은 피조물성을 내포하는지의 여지를 남겼습니다.
- source_word: σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  english_pob_choice: saved by the curse itself
  chosen_korean: 그 저주 아래에서 구원을 받을 것입니다
  alternatives_korean:
  - 그 저주 자체로 말미암아 구원을 받을 것입니다
  - 그 저주로부터 구원을 받을 것입니다
  lexicon: κατάθεμα
  rationale: 문법적으로 난해하고 신학적으로도 거친 구절이라, ‘저주 자체가 구원 수단’이라는 오해를 피하면서도 본문의 긴장을 유지하는 방향으로 옮겼습니다.
- source_word: σημεῖον ἐκπετάσεως
  english_pob_choice: a sign of an opening out in heaven
  chosen_korean: 하늘에 펼쳐지는 표징
  alternatives_korean:
  - 하늘의 펼쳐짐의 표징
  - 하늘의 열림의 표징
  lexicon: ἐκπέτασις
  rationale: '희귀어의 이미지를 자연스러운 한국어로 옮기되, 특정 해석(예: 십자가 등)을 과도하게 확정하지 않도록 했습니다.'
theological_decisions:
- issue: ὡς υἱὸς Θεοῦ의 기독론적 위장 표현
  chosen_reading: ‘하나님의 아들인 것처럼’으로 옮겨, 참된 아들 칭호가 아니라 모방과 위장임을 드러냈습니다.
  alternative_readings:
  - ‘하나님의 아들로’
  - ‘하나님의 아들처럼’
  rationale: 본문은 적그리스도적 존재의 허위 자기 계시를 묘사하므로, 참된 그리스도 칭호를 직접 부여하지 않는 번역이 문맥상 더 충실합니다.
  doctrine_reference: 마태 24:24; 데살로니가후서 2:3-4
- issue: σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος의 난해성
  chosen_reading: ‘그 저주 아래에서 구원을 받을 것입니다’로 번역해, 텍스트의 거칠음과 의미 불확실성을 드러냈습니다.
  alternative_readings:
  - ‘그 저주 자체로 말미암아 구원을 받을 것입니다’
  - ‘그가 저주받은 자 자신에 의해 구원을 받을 것입니다’
  rationale: 그리스어가 문법적으로도, 전승사적으로도 매우 난해하므로, 확정적 교리문으로 매끄럽게 정리하지 않고 본문의 불안정성을 보존했습니다.
  doctrine_reference: 본문 비평 및 묵시문학 해석
