id: DID.2.3
reference: Didache 2:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον, οὐκ ἐπιορκήσεις, οὐ ψευδομαρτυρήσεις, οὐ κακολογήσεις, οὐ μνησικακήσεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/003.yaml
  text: You shall not covet the things of your neighbor[a]; you shall not swear falsely; you shall not bear false witness; you shall not speak evil; you shall not hold a grudge.
  footnotes:
  - marker: a
    text: Or 'You shall not desire the things of your neighbor'.
    reason: previous_rendering
translation:
  language: ko
  text: 이웃의 것을 탐내지 마십시오[a]. 거짓으로 맹세하지 마십시오. 거짓 증언을 하지 마십시오. 악담하지 마십시오. 앙심을 품지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이웃의 것을 바라지 마십시오’.
    reason: ἐπιθυμέω의 보다 중립적인 한국어 표현 가능성을 제시하되, 본문에서는 십계명적 문맥의 금지된 욕망을 나타내는 ‘탐내다’를 유지합니다.
lexical_decisions:
- source_word: Οὐκ ἐπιθυμήσεις τὰ τοῦ πλησίον
  english_pob_choice: You shall not covet the things of your neighbor
  chosen_korean: 이웃의 것들을 탐내지 말며
  alternatives_korean:
  - 이웃의 것을 욕심내지 말며
  - 이웃의 것들을 바라지 말며
  lexicon: ἐπιθυμέω
  rationale: 문맥이 십계명의 금지를 반영하므로, 중립적 ‘원하다’보다 금지된 소유 욕구를 드러내는 ‘탐내다’가 더 정확합니다.
- source_word: οὐκ ἐπιορκήσεις
  english_pob_choice: you shall not swear falsely
  chosen_korean: 거짓 맹세를 하지 말고
  alternatives_korean:
  - 거짓으로 맹세하지 말고
  - 맹세를 거짓되게 하지 말고
  lexicon: ἐπιορκέω
  rationale: Ἐπιορκέω는 단순한 말실수보다 ‘거짓으로 맹세하다’는 뜻이므로, 법정적·서약적 뉘앙스를 살렸습니다.
- source_word: οὐ ψευδομαρτυρήσεις
  english_pob_choice: you shall not bear false witness
  chosen_korean: 거짓 증언을 하지 말며
  alternatives_korean:
  - 거짓 증언하지 말며
  - 거짓으로 증언하지 말며
  lexicon: ψευδομαρτυρέω
  rationale: 증언 행위 자체를 가리키므로 ‘거짓 증언’으로 간결하게 옮겼습니다.
- source_word: οὐ κακολογήσεις
  english_pob_choice: you shall not speak evil
  chosen_korean: 악담하지 말고
  alternatives_korean:
  - 남을 험담하지 말고
  - 나쁘게 말하지 말고
  lexicon: κακολογέω
  rationale: 직역하면 ‘나쁘게 말하다’이지만, 한국어에서 상대를 해치는 말이라는 기능을 가장 자연스럽게 드러내는 표현으로 ‘악담하다’를 택했습니다.
- source_word: οὐ μνησικακήσεις
  english_pob_choice: you shall not hold a grudge
  chosen_korean: 원한을 품지 마십시오
  alternatives_korean:
  - 앙심을 품지 마십시오
  - 마음에 원망을 간직하지 마십시오
  lexicon: μνησικακέω
  rationale: 지속적으로 악을 기억하며 품는 태도를 가리키므로, 관계적 적대감이 드러나는 ‘원한을 품다’가 적절합니다.
theological_decisions:
- issue: 십계명 계열 금지문의 합쇼체 종결과 열거 형식
  chosen_reading: 한국어 본문은 하나의 명령 열거로 읽히도록 ‘-지 말며 / -고 / -지 마십시오’를 섞어 리듬을 유지했습니다.
  alternative_readings:
  - 모든 항목을 동일하게 ‘-지 마십시오’로 통일
  - 모든 항목을 동일하게 ‘-지 말라’로 통일
  rationale: 원문은 연속된 부정 명령들의 나열이므로, 문장 반복의 단조로움은 피하되 명령 강도는 유지하는 방식이 적절합니다.
  doctrine_reference: Didache 2:3의 윤리적 금지문
- issue: ‘τὰ τοῦ πλησίον’의 소유 대상 구체화
  chosen_reading: ‘이웃의 것들’로 옮겨, 단순한 감정이 아니라 타인의 소유를 노리는 욕망임을 드러냈습니다.
  alternative_readings:
  - ‘이웃의 것’
  - ‘이웃의 소유물’
  rationale: ἐπιθυμέω와 결합할 때는 단순한 바람이 아니라 타인의 소유를 향한 금지된 욕망을 뜻하므로, 대상의 소유성도 보이게 했습니다.
  doctrine_reference: 출애굽기 20:17 / 신명기 5:21의 반영
