  source_fidelity: 원문의 부정적 규범 진술(Οὐκ ἔσται)과 대조 구조, 곧 ‘거짓/헛됨’의 배제와 ‘행동으로 가득함’의 요구는 초안에 대체로 반영되어 있습니다. 다만 ‘말은 거짓되거나 헛되지 말아야’보다 ‘말은 거짓이거나 헛되어서는 안 되며’가 원문의 두 서술어를 더 자연스럽고 분명하게 전달합니다. πράξει는 여기서 실제 행위·행동을 뜻하므로 ‘행동’이 적절합니다.
  naturalness: 초안의 ‘거짓되거나 헛되지 말아야 하며’는 문법상 가능하지만 다소 경직되어 있습니다. ‘거짓이거나 헛되어서는 안 되며, 행동으로 가득 차 있어야 합니다’는 현대 표준 한국어 합쇼체에서 자연스럽고 병렬 대조도 선명합니다.
  terminology: λόγος는 문맥상 ‘말’로 옮기는 것이 적절합니다. ψευδής는 ‘거짓이거나’, κενός는 비유적으로 ‘헛되어서는 안 되며’로 옮겼습니다. μεμεστωμένος πράξει는 완료분사가 나타내는 충만한 상태를 ‘행동으로 가득 차 있어야 합니다’로 보존합니다.
