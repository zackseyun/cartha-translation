  text: Your word shall not be false or empty, but filled with action.c
translation:
  language: ko
  text: 그대의 말은 거짓되거나 헛되지 말아야 하며, 행위로 가득해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔσται
  english_pob_choice: shall not be
  chosen_korean: ~말아야 합니다
  alternatives_korean:
  - ~하지 않을 것입니다
  - ~아서는 안 됩니다
  lexicon: syntactic
  rationale: 미래 부정의 진술을 한국어 합쇼체로 자연스럽게 옮기되, 규범적 권면의 뉘앙스를 살리기 위해 ‘말아야 합니다’를 선택했습니다.
- source_word: ψευδής
  english_pob_choice: 'false'
  chosen_korean: 거짓되거나
  alternatives_korean:
  - 거짓된
  - 허위의
  lexicon: 형용사
  rationale: 말이 사실과 어긋나는 상태를 직접 드러내기 위해 ‘거짓되다’ 계열을 택했습니다.
- source_word: οὐ κενός
  english_pob_choice: empty
  chosen_korean: 헛되지
  alternatives_korean:
  - 빈
  - 공허하지
  lexicon: 형용사
  rationale: 단순한 물리적 ‘비어 있음’보다, 실속 없고 무의미하다는 의미를 반영해 ‘헛되지’로 옮겼습니다.
- source_word: μεμεστωμένος πράξει
  english_pob_choice: filled with action
  chosen_korean: 행위로 가득해야 합니다
  alternatives_korean:
  - 실행으로 채워져야 합니다
  - 실천으로 충만해야 합니다
  lexicon: participial phrase
  rationale: 완료분사형의 상태적 의미를 살려 말이 실제 행위로 충만해야 함을 분명히 했습니다.
theological_decisions:
- issue: 말의 진실성보다 실천을 동반한 언어라는 윤리적 강조
  chosen_reading: 이 구절은 단지 거짓말을 금하는 수준이 아니라, 말이 실제 행위와 결합되어야 함을 요구합니다.
  alternative_readings:
  - 단순히 ‘말이 틀리지 않아야 한다’는 정도로 약화시키는 읽기
  - 추상적 진정성만 강조하는 읽기
  rationale: 원문은 ‘거짓되지 않음’과 ‘헛되지 않음’ 뒤에 ‘행위로 가득함’을 병치하여, 언어와 실천의 일치를 강하게 요구합니다.
  doctrine_reference: 기독교 윤리 / 언어와 행위의 일치
