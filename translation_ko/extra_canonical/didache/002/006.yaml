  source_fidelity: 첫 문장의 악덕 목록은 원문의 부정 명령과 각 성격 규정을 대체로 충실히 반영합니다. 그러나 δεύτε 문장의 κατὰ τοῦ πλησίον σου는 ‘이웃을 해치는’으로 결과를 해석해 제시하기보다 ‘이웃을 대적하는/해하려는’ 방향성을 직접 드러내는 편이 더 충실합니다. λήψῃ βουλὴν은 ‘악한 충고를 받아들이다’로 옮길 수 있습니다.
