  text: Οὐκ ἔσῃ πλεονέκτης οὐδὲ ἅρπαξ οὐδὲ ὑποκριτὴς οὐδὲ κακοήθης οὐδὲ ὑπερήφανος. Οὐ λήψῃ βουλὴν πονηρὰν κατὰ τοῦ πλησίον σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/006.yaml
  text: You shall not be greedy[a], nor grasping, nor a hypocrite, nor malicious, nor arrogant. You shall not take evil counsel against your neighbor.
  footnotes:
  - marker: a
    text: Or 'ill-disposed'.
    reason: previous_rendering
translation:
  language: ko
  text: 탐욕스러운 자가 되어서는 안 되며, 약탈하는 자도, 위선자도, 악의적인 자도, 교만한 자도 되어서는 안 됩니다. 또한 이웃을 해치는 악한 충고를 받아들여서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악한 충고’는 βουλὴν πονηράν의 직역에 가깝습니다. 여기서 βουλή는 단순한 ‘계획’보다 함께 의논한 결론이나 권고의 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονέκτης
  english_pob_choice: greedy
  chosen_korean: 탐욕스러운 자
  alternatives_korean:
  - 탐욕한 자
  - 욕심 많은 자
  lexicon: πλεονέκτης
  rationale: 단순한 ‘욕심’보다 지속적이고 죄책 있는 탐심을 드러내기 위해 ‘탐욕스러운 자’로 옮겼습니다.
- source_word: ἅρπαξ
  english_pob_choice: grasping
  chosen_korean: 약탈하는 자
  alternatives_korean:
  - 강탈하는 자
  - 빼앗는 자
  lexicon: ἅρπαξ
  rationale: 재물이나 것을 힘으로 ‘채가는’ 폭력성을 살리기 위해 ‘약탈하는 자’로 옮겼습니다.
- source_word: κακοήθης
  english_pob_choice: malicious
  chosen_korean: 악의적인 자
  alternatives_korean:
  - 악한 자
  - 사악한 자
  - 해로운 자
  lexicon: κακοήθης
  rationale: 문맥상 단순한 기질보다 남을 해치려는 적극적 악의를 가리키므로 ‘악의적인 자’가 가장 직접적입니다.
- source_word: βουλὴν πονηρὰν
  english_pob_choice: evil counsel
  chosen_korean: 악한 충고
  alternatives_korean:
  - 악한 계획
  - 나쁜 생각
  - 악한 꾀
  lexicon: βουλή, πονηρός
  rationale: βουλή는 내적 의도보다 ‘충고/권고/의논’의 성격이 있어, POB의 ‘counsel’에 맞춰 ‘충고’로 살렸습니다.
theological_decisions:
- issue: 악행 목록의 인격화된 죄성 표현
  chosen_reading: 형용사들을 명사화해 ‘자’ 표현으로 제시하여, 단순 행동 금지보다 그러한 성향과 삶의 방식 전체를 경계하는 뜻을 드러냈습니다.
  alternative_readings:
  - 모든 형용사를 그대로 풀어 ‘탐욕스럽지 말며…’로 번역
  rationale: 이 문맥은 도덕 교훈의 목록이므로, 원문의 성격 규정을 한국어에서 자연스럽게 인격적 범주로 드러내는 것이 적합합니다.
  doctrine_reference: Didache의 제자도/윤리 훈련 문맥
- issue: μή· + 미래형 금지문의 한국어 처리
  chosen_reading: 반복되는 부정 명령을 ‘~해서는 안 됩니다’로 통일해 강한 금지의 연속성을 살렸습니다.
  alternative_readings:
  - ‘~하지 마십시오’
  - ‘~하면 안 됩니다’
  rationale: 문장 전체가 규범적 교훈이므로, 현대 표준어의 공식적 금지 표현으로 일관성을 유지했습니다.
  doctrine_reference: Didache의 교훈체
