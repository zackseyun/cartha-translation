id: DID.2.7
reference: Didache 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μισήσεις πάντα ἄνθρωπον, ἀλλὰ οὓς μὲν ἐλέγξεις, περὶ δὲ ὧν προσεύξῃ, οὓς δὲ ἀγαπήσεις ὑπὲρ τὴν ψυχήν σου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/007.yaml
  text: You shall not hate any person, but some you shall reprove, for some you shall pray, and some you shall love more than your own life.
translation:
  language: ko
  text: 어떤 사람도 미워하지 마십시오. 그러나 어떤 이들은 책망하고, 어떤 이들을 위해서는 기도하며, 어떤 이들은 자신의 생명보다 더 사랑하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μισήσεις πάντα ἄνθρωπον
  english_pob_choice: You shall not hate any person
  chosen_korean: 어떤 사람도 미워하지 마십시오
  alternatives_korean:
  - 어떤 사람도 미워하지 말아야 합니다
  - 사람을 누구도 미워하지 마십시오
  lexicon: μισέω = 미워하다; ἄνθρωπον = 사람
  rationale: ἄνθρωπον은 성별이 아닌 일반적인 ‘사람’을 가리키므로, POB의 ‘person’에 맞춰 ‘사람’으로 옮겼습니다.
- source_word: ἐλέγξεις
  english_pob_choice: reprove
  chosen_korean: 책망하고
  alternatives_korean:
  - 꾸짖고
  - 경고하고
  - 책망하십시오
  lexicon: ἐλέγχω = 책망하다/꾸짖다/드러내다
  rationale: 단순한 질책보다 잘못을 드러내어 바로잡는 의미를 살려 ‘책망하다’를 택했습니다.
- source_word: προσεύξῃ
  english_pob_choice: pray
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도하고
  - 기도하십시오
  lexicon: προσεύχομαι = 기도하다
  rationale: 미래형의 지시적 뉘앙스를 한국어 합쇼체에서 자연스럽게 ‘-며’ 연결로 살렸습니다.
- source_word: ὑπὲρ τὴν ψυχήν σου
  english_pob_choice: more than your own life
  chosen_korean: 자신의 생명보다 더 사랑하십시오
  alternatives_korean:
  - 자기 생명보다 더 사랑하십시오
  - 자신의 목숨보다 더 사랑하십시오
  lexicon: ψυχή = 생명, 목숨
  rationale: ψυχή를 여기서는 물리적 생명으로 이해해 ‘생명’으로 옮겼고, POB의 비교 의미를 그대로 반영했습니다.
theological_decisions:
- issue: 명령문 연속의 문체
  chosen_reading: 직설적 명령을 합쇼체로 유지했습니다.
  alternative_readings:
  - 부드러운 권고형으로 완화
  - 평서형으로 전환
  rationale: 디다케의 윤리적 권면을 약화시키지 않으면서도 현대 한국어 예배/독서용으로 자연스러운 명령문을 유지하기 위해서입니다.
  doctrine_reference: Didache 1-6의 규범적 교훈 문맥
- issue: ψυχή의 의미 범위
  chosen_reading: ‘영혼’보다 ‘생명’으로 옮겼습니다.
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 문맥상 내적 영혼이 아니라 위험에 처할 수 있는 삶 전체를 가리키므로, 본문의 비교 강도를 살리는 ‘생명’이 가장 적절합니다.
  doctrine_reference: 신약/유대계 헬라어에서 ψυχή의 생명-의미
