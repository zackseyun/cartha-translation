  terminology: ἄνθρωπος를 성별 비특정의 ‘사람’으로, ἐλέγχω를 ‘책망하다’로, ψυχή를 이 문맥의 ‘생명’으로 옮긴 선택이 적절합니다. 교파적 해석을 덧붙이지 않습니다.
