  source_fidelity: 첫째 절의 φονεύσεις는 ‘살인하지 마십시오’로, 간음·음행·절도·마술/주술 금지도 원문의 열거와 명령형 어조를 충실히 반영합니다. παιδοφθορήσεις를 ‘소년을 성적으로 학대하지 마십시오’로 옮긴 것은 영어 POB의 명시적 해석 및 해당 동사의 성적 훼손 의미에 부합합니다. 다만 τέκνον ἐν φθορᾷ의 ‘유산으로’는 자연 유산까지 뜻할 수 있어, 행위 금지인 원문 및 영어 POB의 ‘by abortion’를 정확히 전달하지 못합니다. ‘낙태로 아이를 죽이지 마십시오’가 더 정확합니다.
