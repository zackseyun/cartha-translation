id: DID.2.2
reference: Didache 2:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ φονεύσεις, οὐ μοιχεύσεις, οὐ παιδοφθορήσεις, οὐ πορνεύσεις, οὐ κλέψεις, οὐ μαγεύσεις, οὐ φαρμακεύσεις, οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/002/002.yaml
  text: You shall not murder; you shall not commit adultery; you shall not sexually abuse boys;a you shall not commit sexual immorality; you shall not steal; you shall not practice magic; you shall not use sorcery; you shall not kill a child by abortion, nor kill one that has been born.b
translation:
  language: ko
  text: 살인하지 마십시오. 간음하지 마십시오. 소년을 성적으로 학대하지 마십시오.[a] 음행하지 마십시오. 도둑질하지 마십시오. 마술을 행하지 마십시오. 주술을 사용하지 마십시오. 태아를 유산으로 죽이지 마십시오. 그리고 태어난 아이도 죽이지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἡ παιδοφθορία는 보통 아동/소년에 대한 성적 학대를 가리키는 것으로 이해됩니다.
    reason: alternative_reading
  - marker: b
    text: ἐν φθορᾷ는 출생 전 생명의 훼손, 곧 유산·낙태를 가리키는 표현으로 읽을 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: Οὐ φονεύσεις
  english_pob_choice: You shall not murder
  chosen_korean: 살인하지 마십시오
  alternatives_korean:
  - 사람을 죽이지 마십시오
  - 살해하지 마십시오
  lexicon: φονεύω
  rationale: 직접적인 살인 금지를 한국어로 가장 자연스럽고 엄중하게 옮기기 위해 ‘살인하다’를 택했습니다.
- source_word: οὐ παιδοφθορήσεις
  english_pob_choice: you shall not sexually abuse boys
  chosen_korean: 소년을 성적으로 학대하지 마십시오
  alternatives_korean:
  - 소년을 더럽히지 마십시오
  - 소년을 타락시키지 마십시오
  lexicon: παιδοφθορέω
  rationale: 영문 POB의 윤리적 해석을 따르되, 그리스어의 아동/소년 대상 성적 훼손 의미를 한국어로 분명하게 드러내기 위해 ‘성적으로 학대하다’로 옮겼습니다.
- source_word: οὐ φαρμακεύσεις
  english_pob_choice: you shall not use sorcery
  chosen_korean: 주술을 사용하지 마십시오
  alternatives_korean:
  - 주술을 행하지 마십시오
  - 마법을 부리지 마십시오
  lexicon: φαρμακεύω
  rationale: φαρμακεύω의 마술/주술 실행을 현대 한국어에서 비교적 중립적이면서도 경멸적 뉘앙스를 피하지 않는 ‘주술을 사용하다’로 반영했습니다.
- source_word: οὐ φονεύσεις τέκνον ἐν φθορᾷ οὐδὲ γεννηθὲν ἀποκτενεῖς
  english_pob_choice: you shall not kill a child by abortion, nor kill one that has been born
  chosen_korean: 태아를 유산으로 죽이지 마십시오. 그리고 태어난 아이도 죽이지 마십시오
  alternatives_korean:
  - 낙태로 아이를 죽이지 마십시오. 그리고 태어난 아이도 죽이지 마십시오
  - 태중의 아이를 유산으로 죽이지 마십시오. 그리고 태어난 아이도 죽이지 마십시오
  lexicon: τέκνον ἐν φθορᾷ / γεννηθέν / ἀποκτείνω
  rationale: 영문 POB의 구분을 따라 첫 항목은 출생 전 생명을, 두 번째는 이미 태어난 생명을 지칭하도록 분리했습니다. ‘유산’은 단순 의학적 절차보다 소멸/훼손의 결과를 드러내는 표현으로 사용했습니다.
theological_decisions:
- issue: παιδοφθορήσεις의 윤리적 강도
  chosen_reading: 소년을 성적으로 학대하지 마십시오
  alternative_readings:
  - 소년을 타락시키지 마십시오
  - 소년을 더럽히지 마십시오
  rationale: 이 단어는 단순한 도덕적 타락보다 미성년자 대상 성적 폭력을 가리키는 것으로 이해하는 것이 문맥상 더 직접적이며, 한국어에서도 그 강도를 유지해야 합니다.
  doctrine_reference: 성윤리와 아동 보호에 관한 본문의 직접 명령
- issue: 태아/출생아 살해 금지의 이중 진술
  chosen_reading: 태아를 유산으로 죽이지 마십시오. 그리고 태어난 아이도 죽이지 마십시오
  alternative_readings:
  - 낙태로 아이를 죽이지 마십시오. 그리고 태어난 아이도 죽이지 마십시오
  rationale: 그리스어는 출생 전과 출생 후를 명시적으로 구분하므로, 한국어도 이 긴장을 유지해 낙태와 영아살해를 각각 분명히 금지하도록 했습니다.
  doctrine_reference: 생명윤리와 출생 전후 생명 보호
