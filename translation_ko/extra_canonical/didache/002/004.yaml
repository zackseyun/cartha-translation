  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: ko
  text: 두 마음을 품어서는 안 되며[a], 두 가지 말을 해서도 안 됩니다. 두 가지 말을 하는 것은 죽음의 올무이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
