  language: en
  yaml_path: translation/extra_canonical/didache/002/004.yaml
  text: You shall not be double-minded nor double-tongued, for double-tongued speech is a snare of death.
translation:
  language: ko
  text: 이중 마음을 품는 사람이 되어서는 안 되며, 이중 혀를 놀리는 사람도 되어서는 안 됩니다. 이중 혀를 놀리는 말은 죽음의 올무이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이중 마음’은 문자적으로는 ‘두 마음을 가진’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔσῃ διγνώμων
  english_pob_choice: You shall not be double-minded
  chosen_korean: 이중 마음을 품는 사람이 되어서는 안 되며
  alternatives_korean:
  - 두 마음을 품어서는 안 되며
  - 우유부단해서는 안 되며
  lexicon: διγνώμων
  rationale: διγνώμων은 단순한 망설임보다 마음이 둘로 갈라진 상태를 가리키므로, ‘이중 마음’으로 옮겨 내적 분열을 드러냈습니다.
- source_word: οὐδὲ δίγλωσσος
  english_pob_choice: nor double-tongued
  chosen_korean: 이중 혀를 놀리는 사람도 되어서는 안 됩니다
  alternatives_korean:
  - 이중 혀를 가진 사람도 되어서는 안 됩니다
  - 말을 이중으로 하는 사람도 되어서는 안 됩니다
  lexicon: δίγλωσσος
  rationale: δίγλωσσος는 말이 한결같지 않고 앞뒤가 다른 태도를 뜻하므로, 직역보다 한국어에서 의미가 분명한 ‘이중 혀를 놀리는 사람’으로 풀었습니다.
- source_word: παγὶς γὰρ θανάτου
  english_pob_choice: for double-tongued speech is a snare of death
  chosen_korean: 이중 혀를 놀리는 말은 죽음의 올무이기 때문입니다
  alternatives_korean:
  - 이중 혀를 놀리는 말은 죽음의 덫이기 때문입니다
  - 이중 혀는 죽음의 올무이기 때문입니다
  lexicon: παγίς
  rationale: παγίς는 사람을 잡는 덫/올무를 뜻하므로, 본문의 비유적 강도를 살리기 위해 ‘올무’를 택했습니다.
theological_decisions:
- issue: 도덕적 권면의 강도
  chosen_reading: 문장은 명령형 금지와 이유 제시를 그대로 살려 공동체 윤리 규범으로 읽히게 했습니다.
  alternative_readings:
  - 완곡한 권고문처럼 약화하여 번역하는 방식
  rationale: 디다케의 교훈체는 단순한 조언이 아니라 공동체를 위한 분명한 규범이므로, ‘되어서는 안 됩니다’로 금지의 힘을 유지했습니다.
  doctrine_reference: 초기 교회 윤리 교훈의 규범적 성격
