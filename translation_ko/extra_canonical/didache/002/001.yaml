- source_word: τῆς διδαχῆς
  english_pob_choice: of the teaching
  chosen_korean: 가르침의
  alternatives_korean:
  - 교훈의
  - 가르침에 속한
  lexicon: teaching
  rationale: didachē를 단순한 교육행위가 아니라 문서의 ‘가르침’으로 옮겨, 영어 POB의 문맥적 명사를 반영했습니다.
theological_decisions:
- issue: 문두 접속사 δὲ의 처리
  chosen_reading: “그리고”로 자연스럽게 연결했습니다.
  alternative_readings:
  - “그런데”
  - 생략
  rationale: 앞선 항목과의 연속성을 살리면서도 한국어 문장 흐름을 부드럽게 하기 위해 단순 연결로 옮겼습니다.
  doctrine_reference: 문체/담화 연결
- issue: 고대 문헌의 제목형 표현 유지
  chosen_reading: 문장처럼 읽히되, 원문의 간결한 열거형 구성을 보존했습니다.
  alternative_readings:
  - 더 풀어서 설명형으로 번역
  rationale: 본문의 기능이 설명이 아니라 항목 제시이므로, 의미를 확장하지 않고 간결한 선언형으로 유지했습니다.
  doctrine_reference: 본문 형식 보존
