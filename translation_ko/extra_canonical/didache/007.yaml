  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/007.yaml
  text: 'Now concerning baptism[a], baptize in this way: Having said all these things beforehand, baptize into the name of the Father and of the Son and of the Holy Spirit in living water. But if you do not have living water, baptize into other water; and if you cannot in cold water, then in warm. But if you have neither, pour water on the head three times into the name of the Father and of the Son and of the Holy Spirit. But before the baptism, let the one baptizing and the one being baptized fast beforehand, and any others who are able[e][d][c][b]; and you shall command the one being baptized to fast for one or two days beforehand.'
  footnotes:
  - marker: a
    text: The Greek verbs for 'baptize' in this sentence are plural, addressing the community. From verse 2 ('if you do not have...'), the verbs shift to the singular, addressing the individual performing the baptism.
    reason: cultural_note
  - marker: b
    text: “Into the name” follows the Greek preposition εἰς (eis) more closely than the traditional English “in the name,” emphasizing entrance into a relationship.
    reason: lexical_alternative
  - marker: c
    text: “Living water” refers to flowing water, such as from a spring or river, as opposed to stagnant water in a cistern or pool. The literal phrase is kept for its scriptural resonance (cf. John 4:10).
    reason: lexical_alternative
  - marker: d
    text: The Greek is elliptical, literally 'beforehand for one or two.' Days are implied by the context of fasting.
    reason: cultural_note
  - marker: e
    text: Or 'Having first proclaimed all these things'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 세례에 관하여 말하겠습니다[a]. 이렇게 세례를 베푸십시오. 이 모든 것을 먼저 말한 뒤, 아버지와 아들의 이름과 성령의 이름으로[b] 살아 있는 물[c]에 세례를 베푸십시오. 그러나 살아 있는 물이 없으면 다른 물에 세례를 베푸십시오. 차가운 물로 할 수 없으면 따뜻한 물로 하십시오. 그것도 없으면 아버지와 아들과 성령의 이름으로 머리 위에 물을 세 번 부으십시오. 세례를 베풀기 전에 세례를 베푸는 사람과 세례를 받는 사람은 미리 금식하고, 할 수 있는 다른 이들도 그렇게 하십시오. 그리고 세례를 받는 사람에게는 하루나 이틀 전에 금식하라고 명령하십시오[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 동사들은 이 문장에서 복수형으로 되어 있어 공동체 전체에 말합니다. 그러나 2절의 조건절부터는 단수형으로 바뀌어, 실제로 세례를 집례하는 개인에게 직접 말합니다.
    reason: cultural_note
  - marker: b
    text: ‘이름으로’는 전치사 εἰς의 방향성을 완전히 지우지 않으면서도 한국어에서 가장 자연스러운 예전적 표현입니다. 전통적인 ‘이름 안에’보다 원문의 initiatory 뉘앙스를 덜 가립니다.
    reason: lexical_alternative
  - marker: c
    text: ‘살아 있는 물’은 흐르는 물, 곧 샘이나 강물 같은 물을 가리킬 수 있습니다. 직역을 유지해 성경적 울림을 보존했습니다.
    reason: lexical_alternative
  - marker: d
    text: 그리스어는 문자적으로 ‘한두 개 앞서’처럼 생략되어 있으며, 문맥상 금식 일수를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: βαπτίσματος / βαπτίσατε / βάπτισον
  english_pob_choice: baptism / baptize
  chosen_korean: 세례 / 세례를 베풀다
  alternatives_korean:
  - 침례
  - 잠그다
  - 물로 씻다
  lexicon: BDAG
  rationale: 초기 그리스도교의 예전적 용어를 살리되, 한국어에서는 문맥상 ‘세례를 베풀다’가 가장 자연스럽고 교회적 기능도 유지합니다.
- source_word: ταῦτα πάντα προειπόντες
  english_pob_choice: Having said all these things beforehand
  chosen_korean: 이 모든 것을 먼저 말한 뒤
  alternatives_korean:
  - 이 모든 것을 미리 말한 뒤
  - 이 모든 것을 먼저 선포한 뒤
  lexicon: LSJ
  rationale: προειπόντες는 ‘미리 말하다/말해 두다’의 뜻이므로, ‘선포’처럼 설교적 무게를 더하지 않고 예비 교훈의 순서를 드러냈습니다.
- source_word: εἰς τὸ ὄνομα
  english_pob_choice: into the name
  chosen_korean: 이름으로
  alternatives_korean:
  - 이름 안으로
  - 이름에로
  - 이름 가운데
  lexicon: BDAG
  rationale: εἰς의 방향성을 완전히 지우지 않으면서도 한국어 예전문에서 자연스러운 표현은 ‘이름으로’입니다. 반복되는 세례 공식의 흐름을 해치지 않도록 했습니다.
- source_word: ἐν ὕδατι ζῶντι
  english_pob_choice: in living water
  chosen_korean: 살아 있는 물
  alternatives_korean:
  - 흐르는 물
  - 신선한 물
  lexicon: LSJ
  rationale: 직역적 이미지와 성경적 울림을 보존하기 위해 ‘살아 있는 물’을 유지했습니다. 이는 흐르는 물을 가리킬 수 있지만, 본문의 상징성을 열어 둡니다.
- source_word: ἔκχεον
  english_pob_choice: pour
  chosen_korean: 물을 ... 부으십시오
  alternatives_korean:
  - 부어 넣으십시오
  - 쏟으십시오
  lexicon: BDAG
  rationale: 머리 위에 물을 붓는 최종 대안 절차를 한국어로 직설적으로 옮겼습니다. 본문이 허용하는 급부식 형태를 숨기지 않습니다.
- source_word: πρὸ μιᾶς ἢ δύο
  english_pob_choice: beforehand for one or two days
  chosen_korean: 하루나 이틀 전에
  alternatives_korean:
  - 하루나 이틀 동안 미리
  - 한두 날 전에
  lexicon: LSJ
  rationale: 그리스어가 생략한 단위는 금식 기간의 문맥에서 보충됩니다. 한국어에서는 ‘하루나 이틀 전에’가 가장 자연스럽게 그 뜻을 드러냅니다.
theological_decisions:
- issue: 세례 공식의 εἰς τὸ ὄνομα 번역
  chosen_reading: ‘이름으로’로 옮겨 예전적 자연스러움과 원문의 방향성을 함께 유지합니다.
  alternative_readings:
  - ‘이름 안으로’
  - ‘이름에로’
  - ‘이름 속으로’
  rationale: 한국어 예배 언어에서는 ‘이름으로’가 가장 안정적이지만, 원문의 initiatory 뉘앙스를 과도하게 해석하지 않도록 절제했습니다. 영어 POB의 ‘into the name’과 달리 한국어에서는 문법상 자연스러운 방향 표시가 제한적이므로, 본문의 세례 공식을 훼손하지 않는 범위에서 번역했습니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; preserve theological tension rather than resolve it.'
- issue: 세례 방식의 긴장 보존
  chosen_reading: 살아 있는 물, 다른 물, 차가운/따뜻한 물, 그리고 붓는 방식까지 모두 본문 그대로 열어 둡니다.
  alternative_readings:
  - 침수만 암시하는 번역
  - 붓는 방식만 암시하는 번역
  rationale: 본문은 이상적 조건으로는 물의 종류를 제시하면서도, 부족하면 붓는 방식까지 허용합니다. 특정 교단의 세례론으로 미리 정리하지 않고, 본문의 실용적·예전적 폭을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it.'
