base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/001.yaml
  text: 'There are two ways[1], one of life and one of death, and there is a great difference between the two ways. Now this is the way of life: first, you shall love God who made you; second, your neighbor as yourself. And whatever you would not want to happen to you, do not do to another.


    And the teaching of these words is this: bless those who curse you, and pray for your enemies, and fast for those who persecute you. For what credit is it if you love those who love you? Do not even the Gentiles do the same? But you, love those who hate you, and you will not have an enemy.


    Abstain from fleshly and worldly desires. If anyone gives you a blow on the right cheek, turn to him the other also, and you will be perfect. If anyone compels you to go one mile[2], go with him two. If anyone takes away your cloak, give him your tunic also. If anyone takes from you what is yours, do not demand it back, for you are not able. Give to everyone who asks you, and do not demand it back; for the Father wills that gifts be given to all from his own gracious gifts. Blessed is the one who gives according to the commandment, for he is innocent. But woe to the one who receives. For if someone receives because he has need, he will be innocent; but the one who has no need will pay the penalty: why he received, and for what purpose. And having come under confinement, he will be examined concerning the things he did, and he will not come out from there until he repays the last quadrans.


    But about this[3], it has also been said: Let your alms sweat in your hands until you know to whom you should give.'
  footnotes:
  - marker: '1'
    text: '''Gentiles'' could also be rendered ''nations''; here it refers to those outside the covenant community.'
    reason: lexical_alternative
  - marker: '2'
    text: A quadrans was a very small Roman coin.
    reason: cultural_note
  - marker: '3'
    text: The saying 'Let your alms sweat in your hands' is a vivid metaphor urging discernment in giving rather than impulsive distribution.
    reason: cultural_note
translation:
  language: ko
  text: '길은 둘이니, 하나는 생명의 길이고 다른 하나는 죽음의 길입니다. 그리고 이 두 길 사이에는 큰 차이가 있습니다. 그러므로 생명의 길은 이렇습니다. 첫째, 너를 지으신 하나님을 사랑하십시오. 둘째, 네 이웃을 네 자신처럼 사랑하십시오. 그리고 네가 원하지 않는 것은 네게 일어나지 않도록, 다른 이에게도 그렇게 하지 마십시오.


    이 말씀들의 가르침은 이렇습니다. 너를 저주하는 사람들을 축복하고, 너희 원수를 위해 기도하며, 너희를 박해하는 사람들을 위해 금식하십시오. 네가 너를 사랑하는 사람들을 사랑한다면 무슨 대가가 있겠습니까? 이방 사람들도 똑같이 하지 않습니까? 그러나 너희는 너희를 미워하는 사람들을 사랑하십시오. 그러면 너희에게 원수가 없을 것입니다.


    육적인 욕망과 세상적인 욕망을 멀리하십시오. 누가 네 오른쪽 뺨을 치거든, 다른 쪽도 돌려 대십시오. 그러면 너희가 온전하게 될 것입니다. 누가 너를 1마일 가도록 강요하거든, 그와 함께 2마일 가십시오. 누가 네 외투를 빼앗거든, 그에게 속옷도 내주십시오. 누가 네게서 네 것을 가져가거든, 돌려 달라고 요구하지 마십시오. 그렇게 할 수 없기 때문입니다. 너에게 구하는 모든 이에게 주고, 돌려 달라고 요구하지 마십시오. 아버지께서는 자기의 은혜로운 선물에서 모든 사람에게 선물이 주어지기를 원하십니다. 계명대로 주는 사람은 복이 있습니다. 그는 무죄하기 때문입니다. 그러나 받는 사람에게는 화가 있습니다. 필요한 것이 있어 받는 사람은 무죄할 것이지만, 필요가 없는 사람은 벌을 받을 것입니다. 왜 받았는지, 또 무엇을 위해 받았는지가 따져질 것입니다. 그리고 감금된 상태에 들어가서는 그가 행한 것들에 대해 심문을 받을 것이며, 마지막 콰드란스까지 갚기 전에는 거기서 나오지 못할 것입니다.


    또 이 일에 관해서도 이렇게 말해졌습니다. 네 구제는 네 손에서 땀이 나도록 두어라. 네가 누구에게 주어야 할지 알 때까지.[1][2][3]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 여기서 '이방 사람들'은 언약 공동체 밖에 있는 사람들을 가리킬 수 있습니다.
    reason: cross_reference
  - marker: '2'
    text: 콰드란스는 매우 작은 로마 동전입니다.
    reason: cultural_note
  - marker: '3'
    text: '''네 구제는 네 손에서 땀이 나도록 두어라''는 서둘러 나누기보다 분별하며 주라는 생생한 은유입니다.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὁδοὶ δύο / ὁδὸς τῆς ζωῆς / τῆς ζωῆς ... τοῦ θανάτου
  english_pob_choice: ways / way of life / way of death
  chosen_korean: 길은 둘 / 생명의 길 / 죽음의 길
  alternatives_korean:
  - 두 가지 길 / 삶의 길 / 사망의 길
  - 두 길 / 생명의 도 / 죽음의 도
  lexicon: LSJ
  rationale: 윤리적·상징적 대비를 살리되, 한국어에서 자연스럽고 문맥상 분명한 '길'로 옮겼습니다.
- source_word: ἀγαπήσεις τὸν Θεὸν τὸν ποιήσαντά σε
  english_pob_choice: you shall love God who made you
  chosen_korean: 너를 지으신 하나님을 사랑하십시오
  alternatives_korean:
  - 너를 만드신 하나님을 사랑하십시오
  - 너를 지으신 분 하나님을 사랑하십시오
  lexicon: BDAG
  rationale: 창조 행위를 분명히 드러내는 '지으신'을 택했고, 주어는 프로젝트 기본어인 '하나님'으로 옮겼습니다.
- source_word: πλησίον σου ὡς σεαυτόν / ἄλλῳ μὴ ποίει
  english_pob_choice: your neighbor as yourself / do not do to another
  chosen_korean: 네 이웃을 네 자신처럼 사랑하십시오 / 다른 이에게도 그렇게 하지 마십시오
  alternatives_korean:
  - 네 이웃을 네 몸같이 사랑하십시오 / 남에게도 하지 마십시오
  - 네 이웃을 자신처럼 사랑하십시오 / 타인에게 하지 마십시오
  lexicon: BDAG
  rationale: 이웃 사랑의 전통적 표현을 유지하되, 부정문의 ἄλλῳ는 '다른 이'로 넓게 옮겨 원문의 일반성을 보존했습니다.
- source_word: σαρκικῶν καὶ κοσμικῶν ἐπιθυμιῶν
  english_pob_choice: fleshly and worldly desires
  chosen_korean: 육적인 욕망과 세상적인 욕망
  alternatives_korean:
  - 육체적인 욕심과 세상적인 욕망
  - 육적인 정욕과 세상적인 욕망
  lexicon: BDAG
  rationale: 초기 기독교의 윤리 어휘를 유지하면서도 현대 한국어에서 이해 가능한 표현으로 옮겼습니다.
- source_word: κοδράντην
  english_pob_choice: quadrans
  chosen_korean: 콰드란스
  alternatives_korean:
  - 사분돈
  - 아주 작은 로마 동전
  lexicon: BDAG
  rationale: 화폐명은 음역을 유지해 역사적 질감을 보존했습니다.
- source_word: ἱδρωσάτω ἡ ἐλεημοσύνη σου
  english_pob_choice: Let your alms sweat
  chosen_korean: 네 구제는 네 손에서 땀이 나도록 두어라
  alternatives_korean:
  - 네 구제는 네 손에서 땀나게 하라
  - 네 자선은 네 손에서 땀나게 두어라
  lexicon: BDAG
  rationale: 직역의 이미지를 살리되 한국어에서는 '구제'가 ἐλεημοσύνη의 자선 행위 의미를 가장 잘 전달합니다.
theological_decisions:
- issue: ἔθνη의 범위
  chosen_reading: 이방 사람들로 옮겼습니다.
  alternative_readings:
  - 민족들
  - 열방
  rationale: 문맥상 언약 공동체 밖의 사람들을 가리키므로, 한국어 독자에게 그 대상을 분명히 하는 '이방 사람들'이 가장 적절합니다.
  doctrine_reference: 문맥적 범위 보존
- issue: 마지막 문장의 비유성
  chosen_reading: 구제가 손에서 '땀이 나도록' 두라는 직역적 비유를 유지했습니다.
  alternative_readings:
  - 구제를 신중히 하라
  - 베풀 때 분별하라
  rationale: 원문의 강렬한 은유를 풀어써서 약화시키지 않고, 분별을 촉구하는 표현으로 그대로 살렸습니다.
  doctrine_reference: 비유 보존
