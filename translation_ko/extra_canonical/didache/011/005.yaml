review_pass:
  verdict: revise
  source_fidelity: 초안의 핵심 판정인 ‘사흘을 머무르면 … 거짓 예언자’는 ψευδοπροφήτης ἐστίν을 정확히 반영합니다. 다만 첫 문장의 ‘하루도’는 원문의 부정과 μίαν을 충실히 옮기지만, 이어지는 ‘필요가 있으면 다음 날까지도’와 긴장을 이루는 원문 자체의 다소 이례적인 표현을 설명 없이 두면 독자가 혼동할 수 있습니다. 제공된 그리스어 본문과 영어 감사 이력은 모두 οὐ μενεῖ를 지지하므로, 이를 긍정 명령으로 바꾸지 않았습니다.
  naturalness: 합쇼체는 적절합니다. 반복되는 문두 ‘그러나’는 그리스어 δέ를 지나치게 기계적으로 반복하여 한국어 흐름을 다소 무겁게 만듭니다. ‘다음 날까지도’는 τὴν ἄλλην(다음 날을 추가로)을 자연스럽게 표현합니다.
  terminology: ‘거짓 예언자’는 ψευδοπροφήτης에 대한 현대 표준어의 자연스러운 대응어입니다. ‘필요가 있으면’도 χρεία를 무리 없이 반영합니다.
  issues:
  - severity: medium
    issue: 각주 a가 번역문을 그대로 반복할 뿐 원문의 이례적 부정 표현이나 의미 대안을 설명하지 않습니다.
    rationale: ‘직역하면’ 뒤의 문구가 본문과 동일하므로 독자에게 추가 정보를 제공하지 못합니다. 오히려 제공된 그리스어 본문에 οὐ(‘아니다/않다’)가 있다는 점과, 이 표현이 다음 절과 긴장을 이룬다는 사실을 밝혀야 유익합니다.
  - severity: low
    issue: 문두 ‘그러나’의 반복이 한국어 문체상 부자연스럽습니다.
    rationale: δέ는 문맥에 따라 ‘그런데’, 무표지 접속, 또는 대조로 옮길 수 있습니다. 첫 두 문장에서는 무표지로 처리해도 의미 손실이 없습니다.
