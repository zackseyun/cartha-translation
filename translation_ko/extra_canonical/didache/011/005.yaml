id: DID.11.5
reference: Didache 11:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: οὐ μενεῖ δὲ ἡμέραν μίαν· ἐὰν δὲ ᾖ χρεία, καὶ τὴν ἄλλην· τρεῖς δὲ ἐὰν μείνῃ, ψευδοπροφήτης ἐστίν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/005.yaml
  text: But he shall not remain one day; but if there is need, also the next. But if he remains three days, he is a false prophet.
translation:
  language: ko
  text: 그러나 그는 하루도 머물지 않을 것입니다. 그러나 필요가 있으면 다음 날까지도 머물 수 있습니다. 그러나 사흘을 머무르면 그는 거짓 예언자입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하루도 머물지 않을 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μενεῖ
  english_pob_choice: he shall not remain
  chosen_korean: 머물지 않을 것입니다
  alternatives_korean:
  - 머물지 않습니다
  - 머무르지 않을 것입니다
  lexicon: μένω
  rationale: 부정문 οὐ μενεῖ의 핵심은 ‘머물다/남다’의 거부이므로, 문어체이면서도 현대 한국어에서 자연스러운 ‘머물지 않을 것입니다’로 옮겼습니다.
- source_word: ἡμέραν μίαν
  english_pob_choice: one day
  chosen_korean: 하루도
  alternatives_korean:
  - 하루
  - 하루 동안
  lexicon: ἡμέρα
  rationale: 원문의 ‘하루’를 간결하게 살리되, 앞의 부정과 결합해 ‘하루도’로 부정의 강도를 자연스럽게 드러냈습니다.
- source_word: χρεία
  english_pob_choice: if there is need
  chosen_korean: 필요가 있으면
  alternatives_korean:
  - 필요가 있다면
  - 사정이 있으면
  lexicon: χρεία
  rationale: χρεία는 단순한 편의가 아니라 실제 필요를 뜻하므로, 그 의미를 직접 반영해 ‘필요가 있으면’으로 옮겼습니다.
- source_word: ψευδοπροφήτης
  english_pob_choice: false prophet
  chosen_korean: 거짓 예언자
  alternatives_korean:
  - 거짓 선지자
  - 거짓 예언자
  lexicon: ψευδοπροφήτης
  rationale: 예언자/선지자 둘 다 가능하지만, 본 초안은 현대 표준어에 가까운 ‘예언자’를 택해 직역성을 유지했습니다.
theological_decisions:
- issue: 체류 규정의 규범적 경고문 투
  chosen_reading: 본문의 조건문을 그대로 살려, 방문자를 시험하는 공동체 규범으로 읽히는 경고문 형태를 유지했습니다.
  alternative_readings:
  - 단순한 관찰 진술로 완화하는 읽기
  - 전승 규칙으로만 축소하는 읽기
  rationale: 그리스어는 명령문이 아니라 조건부 판정 구조이므로, 도덕적 평가를 약화시키지 않으면서도 원문의 판정 논리를 그대로 드러내는 것이 적절합니다.
  doctrine_reference: Didache 공동체 규율 전승
