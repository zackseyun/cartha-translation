id: DID.11.2
reference: Didache 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: ἐὰν δὲ αὐτὸς ὁ διδάσκων στραφεὶς διδάσκῃ ἄλλην διδαχὴν εἰς τὸ καταλῦσαι, μὴ αὐτοῦ ἀκούσητε· εἰς δὲ τὸ προσθεῖναι δικαιοσύνην καὶ γνῶσιν Κυρίου, δέξασθε αὐτὸν ὡς Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/002.yaml
  text: But if the teacher himself turns and teaches another teaching so as to overthrow[a], do not listen to him; but if it is to add righteousness and knowledge of the Lord, receive him as the Lord.
  footnotes:
  - marker: a
    text: Or 'add to righteousness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 교사 자신이 돌아서서 다른 가르침을 가르쳐 무너뜨리려 하면, 그를 듣지 마십시오. 그러나 그것이 의와 주의 지식을 더하려는 것이라면, 그를 주님처럼 받아들이십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘더하다’는 원문 προσθεῖναι의 직역으로, ‘의와 주의 지식을 더하는’ 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: στραφεὶς
  english_pob_choice: turns
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아가서
  - 돌변하여
  lexicon: στρέφω
  rationale: 물리적 회전보다 태도와 방향의 전환을 가리키므로, 문맥상 ‘돌아서서’가 가장 자연스럽고 원문 대비 과도한 해석이 적습니다.
- source_word: διδάσκῃ ἄλλην διδαχὴν
  english_pob_choice: teaches another teaching
  chosen_korean: 다른 가르침을 가르쳐
  alternatives_korean:
  - 다른 교훈을 가르쳐
  - 이질적인 가르침을 전하여
  lexicon: διδάσκω / διδαχή
  rationale: 명사 διδαχή를 ‘가르침’으로 옮겨 중복을 살리되, 한국어에서는 ‘다른 가르침을 가르쳐’가 가장 직역에 가깝고 문장 흐름도 자연스럽습니다.
- source_word: εἰς τὸ καταλῦσαι
  english_pob_choice: so as to overthrow
  chosen_korean: 무너뜨리려
  alternatives_korean:
  - 폐하려고
  - 허물어뜨리려
  lexicon: καταλύω
  rationale: 인용된 가르침을 전복하거나 해체하는 뜻을 담아 ‘무너뜨리려’로 옮겼습니다. 교회적 완곡어보다 원문의 파괴적 함의를 직접 드러냅니다.
- source_word: δικαιοσύνην καὶ γνῶσιν Κυρίου
  english_pob_choice: righteousness and knowledge of the Lord
  chosen_korean: 의와 주의 지식
  alternatives_korean:
  - 의와 주님에 대한 지식
  - 의와 주의 앎
  lexicon: δικαιοσύνη / γνῶσις
  rationale: γραμμα적으로 προσθεῖναι의 직접목적어이므로 ‘더하다’보다 ‘더하다/더하려는’의 구조를 유지했고, γνῶσις는 단순 정보보다 관계적·실천적 ‘지식’으로 보았습니다.
- source_word: ὡς Κύριον
  english_pob_choice: as the Lord
  chosen_korean: 주님처럼
  alternatives_korean:
  - 주님으로
  - 주님으로서
  lexicon: κύριος
  rationale: 후반부의 수용 방식을 나타내므로 ‘주님처럼 받아들이십시오’가 한국어에서 가장 자연스럽고, ‘~으로’보다 경배/존중의 뉘앙스를 과장하지 않으면서 살립니다.
theological_decisions:
- issue: 원문의 마지막 수용 기준인 ὡς Κύριον의 의미
  chosen_reading: 교사를 단순히 예의상 환대하는 수준이 아니라, 주님에 상응하는 권위로 받아들이라는 뜻으로 옮겼습니다.
  alternative_readings:
  - 그를 주님으로 받아들이십시오
  - 그를 주님으로서 받아들이십시오
  rationale: 문맥상 동일 인물을 ‘주님’으로 동일시한다기보다, 그가 주님의 권위를 대표하는 방식으로 받아들여져야 함을 나타냅니다. 그래서 한국어는 동일시를 피하면서도 강한 수용 요구를 보존했습니다.
  doctrine_reference: Didache의 교회 규범 문맥과 κύριος의 기능적 수용 의미
- issue: ‘의와 주의 지식’이 증가되는 경우의 정당성
  chosen_reading: 가르침이 공동체를 허무는지, 아니면 의와 주의 지식을 더하는지에 따라 분별해야 한다는 대조를 유지했습니다.
  alternative_readings:
  - 의와 주의 지식을 ‘증가시키는’ 것으로 완화
  - ‘더하다’를 완곡하게 풀어 번역
  rationale: 앞절의 파괴적 목적과 대비되는 긍정적 목적을 분명히 해야 하므로, ‘더하려는 것’이라는 구조를 유지해 원문의 규범적 분별을 살렸습니다.
  doctrine_reference: 교훈 분별과 공동체 보존에 관한 Didache의 교회 질서
