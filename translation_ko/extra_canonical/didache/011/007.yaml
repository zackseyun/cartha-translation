id: DID.11.7
reference: Didache 11:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πάντα προφήτην λαλοῦντα ἐν πνεύματι οὐ πειράσετε οὐδὲ διακρινεῖτε· πᾶσα γὰρ ἁμαρτία ἀφεθήσεται, αὕτη δὲ ἡ ἁμαρτία οὐκ ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/007.yaml
  text: And you shall not test or judge any prophet speaking in the Spirit; for every sin will be forgiven[a], but this sin will not be forgiven.
  footnotes:
  - marker: a
    text: Or 'And every prophet speaking in the Spirit you shall not test, nor shall you judge'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 영으로 말하는 어떤 예언자도 시험하지도, 판단하지도 마십시오. 모든 죄는 용서받을 것이지만, 이 죄는 용서받지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영으로 말하는 모든 예언자를 시험하지도, 판단하지도 마십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: προφήτην
  english_pob_choice: any prophet
  chosen_korean: 어떤 예언자
  alternatives_korean:
  - 모든 예언자
  - 예언자 누구든지
  lexicon: προφήτης
  rationale: 부정문 안의 πᾶς/πάντα는 ‘아무 …도’의 포괄적 금지를 나타내므로, ‘어떤 예언자’로 옮겨 전체 금지의 뜻을 살렸습니다.
- source_word: λαλοῦντα ἐν πνεύματι
  english_pob_choice: speaking in the Spirit
  chosen_korean: 영으로 말하는
  alternatives_korean:
  - 성령 안에서 말하는
  - 영 안에서 말하는
  lexicon: πνεῦμα
  rationale: 문맥상 예언자의 발화가 영에 의해 일어나는 상태를 가리키므로, ‘성령’으로 고정하지 않고 원문 구조를 따라 ‘영으로’라고 옮겼습니다.
- source_word: οὐ πειράσετε οὐδὲ διακρινεῖτε
  english_pob_choice: you shall not test or judge
  chosen_korean: 시험하지도, 판단하지도 마십시오
  alternatives_korean:
  - 시험하지도, 분별하지도 마십시오
  - 시험하지도, 비판하지도 마십시오
  lexicon: πειράζω / διακρίνω
  rationale: πειράζω는 ‘시험하다’, διακρίνω는 여기서 단순한 분별보다 판정·판결의 뉘앙스가 강하므로, 두 동사의 병렬 금지를 자연스러운 한국어로 살렸습니다.
- source_word: ἀφεθήσεται
  english_pob_choice: will be forgiven
  chosen_korean: 용서받을 것입니다
  alternatives_korean:
  - 사함받을 것입니다
  - 면제될 것입니다
  lexicon: ἀφίημι
  rationale: 죄의 용서라는 관용적 의미를 분명히 하기 위해 ‘용서받다’를 사용했으며, 반복되는 수동형도 같은 방식으로 일관되게 처리했습니다.
theological_decisions:
- issue: ‘영으로 말하는’ 예언자의 발화 상태를 어떻게 표시할지
  chosen_reading: ‘성령’으로 단정하지 않고 원문 그대로 ‘영’으로 유지했습니다.
  alternative_readings:
  - 성령으로 말하는
  - 성령 안에서 말하는
  rationale: 본문은 πνεύμα만 사용하며 문맥상 영의 작용을 말하지만, 명시적 표현은 아니므로 한국어에서도 범위를 좁히지 않았습니다.
  doctrine_reference: 성령론의 명시성 보존
- issue: ‘판단하다’의 어조
  chosen_reading: 예언자를 정죄하거나 판결하는 행위를 금하는 뜻으로 ‘판단하다’를 유지했습니다.
  alternative_readings:
  - 분별하다
  - 비판하다
  rationale: 여기서는 신중한 식별보다 외적 판정의 금지가 중심이므로, ‘분별하다’보다 ‘판단하다’가 원문의 금지 강도를 더 잘 반영합니다.
  doctrine_reference: 교회 내 예언 분별과 권위 질서
