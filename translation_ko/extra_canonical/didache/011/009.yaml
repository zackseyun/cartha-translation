source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ πᾶς προφήτης ὁρίζων τράπεζαν ἐν πνεύματι, οὐ φάγεται ἀπ᾽ αὐτῆς, εἰδὲ μήγε ψευδοπροφήτης ἐστί·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/009.yaml
  text: And every prophet who sets a table in the Spirit shall not eat from it[a]; otherwise he is a false prophet.
  footnotes:
  - marker: a
    text: Or 'appoints a table in the Spirit shall not eat from it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 영 안에서 식사를 차리도록 지시하는 모든 예언자는 그 식사를 먹어서는 안 됩니다. 그렇지 않으면 그는 거짓 예언자입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 τράπεζα는 문자적으로 ‘식탁’이지만, 문맥상 식탁에 차려진 식사 또는 음식을 가리키는 환유일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφήτης
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  lexicon: προφήτης
  rationale: Didache의 문맥에서 기능적으로 '예언자'가 더 직접적이며, 현대 한국어에서도 예언 행위의 의미를 잘 드러냅니다.
- source_word: ὁρίζων τράπεζαν
  english_pob_choice: sets a table
  chosen_korean: 식탁을 차리라고 지시하는
  alternatives_korean:
  - 식탁을 차리는
  - 상을 차리라고 정하는
  - 식탁을 마련하는
  lexicon: ὁρίζω + τράπεζα
  rationale: τράπεζα가 여기서는 물건으로서의 '식탁'보다 식사 자체를 가리키는 메톤미로 읽히지만, 한국어에서는 그 의미를 자연스럽게 풀어 '식탁을 차리라고 지시하는'으로 옮겨 원문의 행위와 식사 준비의 함의를 함께 살렸습니다.
- source_word: ἐν πνεύματι
  english_pob_choice: in the Spirit
  chosen_korean: 영 안에서
  alternatives_korean:
  - 성령 안에서
  - 영으로
  lexicon: ἐν πνεύματι
  rationale: 본문이 명시적으로 divine Spirit의 충만한 서술을 요구하지 않으므로 '성령'보다 중립적인 '영'을 택해 원문의 표현을 보존했습니다.
- source_word: οὐ φάγεται ἀπ᾽ αὐτῆς
  english_pob_choice: shall not eat from it
  chosen_korean: 거기서 먹지 않아야 합니다
  alternatives_korean:
  - 그것에서 먹지 않아야 합니다
  - 그 식탁에서 먹지 않아야 합니다
  lexicon: φαγεῖν ἀπό
  rationale: 반복되는 지시문의 한국어 자연성을 위해 '거기서'로 간결하게 처리하되, 금지의 의미는 분명히 유지했습니다.
theological_decisions:
- issue: 거짓 예언자 판정의 조건
  chosen_reading: 영 안에서 식탁을 차리라고 지시하는 예언자가 그 음식에 참여하면 참 예언자가 아니라는, 공동체 분별 기준으로 읽었습니다.
  alternative_readings:
  - 단순히 식탁을 '차린' 예언자에 대한 금식 규정으로 읽는 방식
  - '''영 안에서''를 성령의 초자연적 계시 상황으로 한정하는 방식'
  rationale: Didache의 교훈 문맥상 이 절은 예언자 식별을 위한 윤리적·공동체적 기준을 제시하며, 식사에 참여하지 않는 행위가 참됨의 표지가 됩니다.
  doctrine_reference: Didache의 예언자 분별 전통
