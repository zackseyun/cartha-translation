id: DID.11.11
reference: Didache 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης δεδοκιμασμένος, ἀληθινός, ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας, μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ, οὐ κριθήσεται ἐφ᾽ ὑμῶν· μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν· ὡσαύτως γὰρ ἐποίησαν καὶ οἱ ἀρχαῖοι προφῆται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/011.yaml
  text: But every prophet who has been tested, genuine, doing for an earthly mystery of the church, yet not teaching others to do what he himself does, will not be judged by you; for he has his judgment with God. For in the same way the ancient prophets also did.
translation:
  language: ko
  text: 그러나 검증된 참된 모든 예언자는 교회의 세상적 신비를 위하여 행하면서도, 자신이 하는 것을 하도록 가르치지 않는다면 여러분에게 심판을 받지 않을 것입니다.[a] 그의 심판은 하나님께 달려 있기 때문입니다. 옛 예언자들도 이와 같이 했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘교회의 세상적 신비’입니다. 그리스어 표현의 정확한 뜻과 용례는 불확실하므로, 본문에서는 그 낯선 표현을 해석적으로 풀어 쓰지 않았습니다.
    reason: source_note
lexical_decisions:
- source_word: προφήτης δεδοκιμασμένος, ἀληθινός
  english_pob_choice: every prophet who has been tested, genuine
  chosen_korean: 시험을 받아 참된 모든 예언자
  alternatives_korean:
  - 시험받은 참된 예언자
  - 검증된 참된 예언자
  lexicon: προφήτης / δεδοκιμασμένος / ἀληθινός
  rationale: 데δοκιμασμένος의 ‘시험을 받다’와 ἀληθινός의 ‘참된’ 뉘앙스를 살려, 외형상 자격이 아니라 검증된 참됨을 드러내도록 옮겼습니다.
- source_word: ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας
  english_pob_choice: doing for an earthly mystery of the church
  chosen_korean: 교회의 세상적인 신비를 위해 행하되
  alternatives_korean:
  - 교회의 세상적인 신비를 위해 하되
  - 교회의 지상적 신비를 행하되
  lexicon: ποιῶν / μυστήριον / κοσμικὸν / ἐκκλησίας
  rationale: ποιῶν을 ‘행하다’로, μυστήριον κοσμικόν을 ‘세상적인 신비’로 직역에 가깝게 유지해 본문의 특이한 표현을 약화시키지 않았습니다.
- source_word: μὴ διδάσκων δὲ ποιεῖν ὅσα αὐτὸς ποιεῖ
  english_pob_choice: yet not teaching others to do what he himself does
  chosen_korean: 자기 자신이 하는 것을 남들에게 그렇게 하라고 가르치지 않으면
  alternatives_korean:
  - 자기가 하는 것을 그렇게 하라고 가르치지 않으면
  - 그가 스스로 하는 일을 하라고 가르치지 않으면
  lexicon: διδάσκων / ποιεῖν / ὅσα αὐτὸς ποιεῖ
  rationale: 영어 POB의 보정에 맞추어 ‘others/남들’ 같은 불필요한 보충을 최소화하되, ‘자기 자신이 하는 것’의 자기지시 구조를 분명히 드러냈습니다.
- source_word: οὐ κριθήσεται ἐφ᾽ ὑμῶν
  english_pob_choice: will not be judged by you
  chosen_korean: 여러분에게서 심판받지 않을 것입니다
  alternatives_korean:
  - 여러분에게서 판단받지 않을 것입니다
  - 여러분에 의해 심판되지 않을 것입니다
  lexicon: κριθήσεται / ἐφ᾽ ὑμῶν
  rationale: ἐφ᾽ ὑμῶν을 심판의 주체를 가리키는 표현으로 보고, 한국어에서는 자연스러운 수동형으로 옮겼습니다.
theological_decisions:
- issue: 후반의 ‘옛 예언자들’ 비교문의 기능
  chosen_reading: 본 절은 참된 예언자의 행위가 공동체의 즉각적 판단을 넘어설 수 있음을, 옛 예언자들의 선례로 정당화합니다.
  alternative_readings:
  - 단순히 예언자의 면책을 일반화하는 읽기
  - 예언자의 행동을 무비판적으로 승인하는 읽기
  rationale: μετὰ Θεοῦ γὰρ ἔχει τὴν κρίσιν과 ὡσαύτως γὰρ ἐποίησαν을 함께 보아, 최종 판단의 근거가 하나님께 있음을 강조했습니다.
  doctrine_reference: 공동체 분별과 하나님의 최종 심판의 긴장
