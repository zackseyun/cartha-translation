revisions:
- from: 그러나 시험을 받아 참된 모든 예언자는, 교회의 세상적인 신비를 위해 행하되 자기 자신이 하는 것을 남들에게 그렇게 하라고 가르치지 않으면, 여러분에게서 심판받지 않을 것입니다. 그에게는 하나님과 함께 그의 심판이 있기 때문입니다. 옛 예언자들도 같은 방식으로 했기 때문입니다.[a]
  to: 그러나 검증된 참된 모든 예언자는 교회의 세상적 신비를 위하여 행하면서도, 자신이 하는 것을 하도록 가르치지 않는다면 여러분에게 심판을 받지 않을 것입니다.[a] 그의 심판은 하나님께 달려 있기 때문입니다. 옛 예언자들도 이와 같이 했기 때문입니다.
  rationale: 원문에 없는 ‘남들에게’와 ‘그렇게’를 삭제하고, 자연스러운 현대 합쇼체로 다듬었습니다. 난해하고 논쟁적인 명사구는 특정 의례나 교리로 규정하지 않았으며, 각주에서 그 불확실성을 밝혔습니다. ‘하나님과 함께 심판이 있다’는 어색한 직역 대신 심판의 귀속을 드러내는 ‘하나님께 달려 있다’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:09:58Z'
