id: DID.11.1
reference: Didache 11:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς ἂν οὖν ἐλθὼν διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα, δέξασθε αὐτόν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/001.yaml
  text: Therefore, whoever comes and teaches you all these things that have been said before, receive him.
translation:
  language: ko
  text: 그러므로 누구든지 와서 이 모든 것, 곧 앞서 말한 것들을 여러분에게 가르치면, 그를 받아들이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃς ἂν οὖν
  english_pob_choice: Therefore, whoever
  chosen_korean: 그러므로 누구든지
  alternatives_korean:
  - 그러니 누구든지
  - 그러므로 어떤 사람이든지
  lexicon: ὅς ἄν
  rationale: 조건적·포괄적 표현을 자연스럽게 옮기되, 문두의 οὖν을 살려 논리적 연결을 유지했습니다.
- source_word: ἐλθὼν
  english_pob_choice: comes
  chosen_korean: 와서
  alternatives_korean:
  - 오면
  - 찾아와서
  lexicon: ἔρχομαι
  rationale: 현재적·일반적 도착을 한국어 연결어미로 간결하게 표현했습니다.
- source_word: διδάξῃ ὑμᾶς ταῦτα πάντα, τὰ προειρημένα
  english_pob_choice: teaches you all these things that have been said before
  chosen_korean: 이 모든 것, 곧 앞서 말한 것들을 여러분에게 가르치면
  alternatives_korean:
  - 이 모든 것, 곧 전에 말한 것들을 여러분에게 가르치면
  - 이전에 말한 이 모든 것을 여러분에게 가르치면
  lexicon: διδάσκω / προείρημαι
  rationale: ταῦτα πάντα와 τὰ προειρημένα의 이중 수식을 한국어에서 ‘이 모든 것’과 ‘곧 앞서 말한 것들’로 나누어, 이미 언급된 가르침이라는 점을 분명히 했습니다.
- source_word: δέξασθε αὐτόν
  english_pob_choice: receive him
  chosen_korean: 그를 받아들이십시오
  alternatives_korean:
  - 그를 영접하십시오
  - 그를 받아 주십시오
  lexicon: δέχομαι
  rationale: 단순한 환대보다 수용·인정의 의미를 넓게 살릴 수 있는 ‘받아들이십시오’를 택했습니다.
theological_decisions:
- issue: 이 문장은 공동체가 새로운 교사를 분별해 맞이하는 규범적 권면입니다.
  chosen_reading: 명령형 ‘받아들이십시오’로 옮겨, 단순한 친절 권유가 아니라 공동체적 수용의 요구를 드러냈습니다.
  alternative_readings:
  - 그를 맞이하십시오
  - 그를 환대하십시오
  rationale: δέξασθε의 공동체적·공적 수용 뉘앙스를 약화하지 않기 위해 보다 직접적인 명령으로 표현했습니다.
  doctrine_reference: 초대교회 교훈 수용과 분별(Didache의 교회 질서 문맥)
