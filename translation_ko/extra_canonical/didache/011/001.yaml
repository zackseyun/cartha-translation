  verdict: approve
  source_fidelity: 그리스어의 논리 연결(οὖν), 포괄적 조건 표현(ὃς ἄν), ‘와서 가르치다’(ἐλθὼν διδάξῃ), 앞서 언급된 모든 가르침(ταῦτα πάντα, τὰ προειρημένα), 그리고 복수 명령(δέξασθε)을 충실히 반영합니다. ‘그를 받아들이십시오’는 δέξασθε αὐτόν의 공동체적 수용 의미를 무리 없이 전달합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고 문장 구조도 명료합니다. ‘이 모든 것, 곧 앞서 말한 것들’은 원문의 동격적 설명을 보존하는 적절한 표현입니다.
  terminology: ‘가르치면’, ‘받아들이십시오’는 문맥상 교사와 그의 가르침을 공동체가 수용하는 상황에 알맞으며, 특정 교파적 해석을 덧붙이지 않습니다.
