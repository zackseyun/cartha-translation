revisions:
- from: 그러나 어떤 이가 영 안에서 “돈이나 다른 무엇이든지 나에게 주십시오”라고 말하면, 그를 듣지 마십시오. 그러나 그가 다른 필요를 가진 이들을 위해 주라고 말하면, 아무도 그를 정죄하지 마십시오.[a]
  to: 그러나 누구든지 영 안에서 “돈이나 다른 것을 나에게 주십시오”라고 말하면, 그의 말을 듣지 마십시오. 그러나 그가 궁핍한 다른 이들을 위해 주라고 말하면, 아무도 그를 판단하지 마십시오.
  rationale: 자기 이익을 위한 물질 요구와 궁핍한 사람들을 위한 요청의 대비를 보존했습니다. 원문이 명시하지 않는 성령 해석은 추가하지 않았고, ‘다른 것들’, ‘궁핍한 이들’, ‘판단하다’에 해당하는 원문의 의미 범위를 보다 정확히 반영했습니다. 반복적이고 근거 없는 대안 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:14Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 절의 자기 자신을 위한 요구는 대체로 정확히 옮겼습니다. 다만 ἕτερά τινα는 ‘다른 것들’을 뜻하므로 ‘다른 무엇이든지’보다 ‘다른 것을’이 더 직접적입니다. δεύτε 절의 ὑστερούντων은 ‘다른 필요를 가진 이들’이 아니라 결핍하거나 궁핍한 사람들을 가리킵니다. κρινέτω는 여기서 ‘정죄하다’보다 판단·비난하지 말라는 뜻을 보존하는 ‘판단하지 마십시오’가 적절합니다.
  naturalness: ‘영 안에서’는 원문의 모호성을 유지하면서도 한국어 종교 문맥에서 이해 가능한 표현입니다. ‘궁핍한 다른 이들을 위해 주라고’는 수혜자와 명령 내용을 자연스럽게 드러냅니다.
  terminology: πνεῦμα는 본문 자체가 성령을 명시하지 않으므로 ‘영’으로 유지했습니다. ἀργύρια는 현대 한국어에서 ‘돈’이 자연스럽습니다. κρίνω에 교리적으로 강한 ‘정죄’를 부여하지 않고 ‘판단하다’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘다른 필요를 가진 이들’
    rationale: ὑστερούντων은 단지 별개의 필요를 지닌 사람들이 아니라 부족하거나 궁핍한 사람들입니다.
  - severity: medium
    issue: ‘정죄하지 마십시오’
    rationale: κρινέτω는 본문에서 판단하거나 비난하지 말라는 금지이며, ‘정죄’는 원문보다 강한 신학적·법정적 뉘앙스를 더합니다.
  - severity: low
    issue: 각주 a가 본문을 그대로 반복함
    rationale: 제시된 각주는 실질적인 대안 번역이나 본문 설명을 제공하지 않으며, 앵커도 불필요합니다.
  revised_text: 그러나 누구든지 영 안에서 “돈이나 다른 것을 나에게 주십시오”라고 말하면, 그의 말을 듣지 마십시오. 그러나 그가 궁핍한 다른 이들을 위해 주라고 말하면, 아무도 그를 판단하지 마십시오.
