id: DID.11.12
reference: Didache 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὃς δ᾽ ἂν εἴπῃ ἐν πνεύματι· Δός μοι ἀργύρια ἢ ἕτερά τινα, οὐκ ἀκούσεσθε αὐτοῦ· ἐὰν δὲ περὶ ἄλλων ὑστερούντων εἴπῃ δοῦναι, μηδεὶς αὐτὸν κρινέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/012.yaml
  text: But whoever says in the Spirit[a], “Give me money or something else,” you shall not listen to him. But if he tells you to give for others who are in need, let no one judge him.
  footnotes:
  - marker: a
    text: Or '“Give me money,” or something else,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 어떤 이가 영 안에서 “돈이나 다른 무엇이든지 나에게 주십시오”라고 말하면, 그를 듣지 마십시오. 그러나 그가 다른 필요를 가진 이들을 위해 주라고 말하면, 아무도 그를 정죄하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돈이나 다른 무엇이든지 나에게 주십시오”라고 할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πνεύματι
  english_pob_choice: in the Spirit
  chosen_korean: 영 안에서
  alternatives_korean:
  - 성령 안에서
  - 성령으로
  lexicon: πνεῦμα
  rationale: 원문은 ‘영’이자 ‘성령’일 수 있는 영역을 열어 두지만, 여기서는 인격적 성령의 명시가 없어 중립적인 ‘영 안에서’로 옮겨 발화의 매개를 그대로 살렸습니다.
- source_word: ἀργύρια
  english_pob_choice: money
  chosen_korean: 돈
  alternatives_korean:
  - 은전
  - 은
  lexicon: ἀργύριον
  rationale: 문맥상 구체 화폐단위보다 ‘돈’이 더 자연스럽고, 앞뒤의 대비인 ‘다른 무엇이든지’와도 잘 맞습니다.
- source_word: ἢ ἕτερά τινα
  english_pob_choice: or something else
  chosen_korean: 다른 무엇이든지
  alternatives_korean:
  - 아무 다른 것이라도
  - 무엇이든 다른 것
  lexicon: ἕτερος + τις
  rationale: '`ἢ ἕτερά τινα`는 돈과 병렬로 이어지는 자기 몫 요구를 뜻하므로, ‘또는 다른 무엇이든지’로 한 문장 안에 묶어 요구의 범위를 분명히 했습니다.'
- source_word: μηδεὶς αὐτὸν κρινέτω
  english_pob_choice: let no one judge him
  chosen_korean: 아무도 그를 정죄하지 마십시오
  alternatives_korean:
  - 아무도 그를 판단하지 마십시오
  - 아무도 그를 비난하지 마십시오
  lexicon: κρίνω
  rationale: 여기서 `κρίνω`는 단순한 의견 판단보다 공동체적 비난/단죄의 뉘앙스가 강하므로, 금지 명령을 살리면서도 ‘정죄’로 옮겼습니다.
theological_decisions:
- issue: 영적 발화의 분별 기준
  chosen_reading: ‘영 안에서’라는 표현을 그대로 유지해, 발화의 영적 기원 주장을 무비판적으로 승인하지 않고 공동체가 분별해야 함을 드러냈습니다.
  alternative_readings:
  - 성령 안에서
  - 성령으로
  rationale: 본문은 영적 권위를 주장하는 발화와 실제 필요한 사람들을 위한 요청을 구분하므로, 번역도 그 긴장을 흐리지 않도록 중립성을 유지했습니다.
  doctrine_reference: 공동체 분별과 거짓 예언자 경계의 맥락
