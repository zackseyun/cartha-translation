source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐξερχόμενος δὲ ὁ ἀπόστολος μηδὲ λαμβανέτω εἰμὴ ἄρτον ἕως οὗ αὐλισθῇ· ἐὰν δὲ ἀργύριον αἰτῇ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/006.yaml
  text: And when the apostle departs, let him take nothing except bread until he finds lodging; but if he asks for money, he is a false prophet.
translation:
  language: ko
  text: 그리고 사도가 떠날 때에는 묵을 곳에 이를 때까지 먹을 빵 외에는 아무것도 가져가지 말아야 합니다. 그러나 돈을 요구하면 그는 거짓 예언자입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀπόστολος
  english_pob_choice: the apostle
  chosen_korean: 사도
  alternatives_korean:
  - 보내심을 받은 이
  - 사신
  lexicon: ἀπόστολος
  rationale: 초대교회 문맥에서 공식적 직분/사명을 가리키므로 기본적으로 ‘사도’로 옮겼습니다.
- source_word: μηδὲ λαμβανέτω εἰμὴ ἄρτον
  english_pob_choice: let him take nothing except bread
  chosen_korean: 빵 외에는 아무것도 받지 말아야 합니다
  alternatives_korean:
  - 빵 말고는 아무것도 받아서는 안 됩니다
  - 빵 외에는 아무것도 취하지 말아야 합니다
  lexicon: λαμβάνω / ἄρτος
  rationale: 금지의 핵심은 ‘빵’만 허용되는 제한이므로, 수신 동사를 자연스럽게 ‘받다’로 풀어 합쇼체에 맞추었습니다.
- source_word: ἕως οὗ αὐλισθῇ
  english_pob_choice: until he finds lodging
  chosen_korean: 머무를 곳을 찾기 전까지는
  alternatives_korean:
  - 묵을 곳을 찾을 때까지
  - 숙소를 얻기 전까지
  lexicon: αὐλίζω
  rationale: αὐλισθῇ는 단순한 ‘찾다’보다 ‘하룻밤 머물 곳/숙소를 얻다’의 뉘앙스가 있어 그 의미를 드러냈습니다.
- source_word: ἀργύριον αἰτῇ
  english_pob_choice: if he asks for money
  chosen_korean: 돈을 요구하면
  alternatives_korean:
  - 은전을 구하면
  - 돈을 청하면
  lexicon: ἀργύριον / αἰτέω
  rationale: ἀργύριον은 화폐 일반을 가리키므로 현대 독자가 이해하기 쉬운 ‘돈’으로 옮겼고, αἰτέω는 단순 요청보다 부당한 청탁 가능성을 살려 ‘요구하다’로 처리했습니다.
- source_word: ψευδοπροφήτης ἐστί
  english_pob_choice: he is a false prophet
  chosen_korean: 그는 거짓 예언자입니다
  alternatives_korean:
  - 그는 거짓 선지자입니다
  - 그는 거짓 예언자입니다
  lexicon: ψευδοπροφήτης
  rationale: 예언자 직함의 거짓됨을 직접 드러내는 구성으로, 초대교회 문맥의 용어를 현대 표준어로 유지했습니다.
theological_decisions:
- issue: 사도의 여행 규정이 ‘사역자’의 생계 방식에 대한 시험이라는 점
  chosen_reading: 빵만 허용하고 돈을 요구하는 자는 거짓 예언자로 판정합니다.
  alternative_readings:
  - 단순한 접대 예절 규정
  - 일반적인 여행 수칙
  rationale: 본문은 물질 요구를 분별 기준으로 삼아 참된 사도성과 거짓 예언을 구별하므로, 윤리 규정 이상으로 교회적 식별의 기준임을 보존했습니다.
  doctrine_reference: Didache 11:6의 선지자 식별 기준
