review_pass:
  verdict: revise
  source_fidelity: 초안의 전반적 의미는 원문 및 영어 감사본과 일치합니다. 다만 λαμβανέτω는 여기서 여행을 떠나는 사도가 ‘받다’라기보다 물품을 ‘가지고 가다/취하다’라는 뜻이 자연스럽습니다. 또한 ἕως οὗ αὐλισθῇ는 ‘머무를 곳을 찾다’보다 실제로 묵게 될 때까지라는 시간 한계를 나타냅니다.
  naturalness: 합쇼체와 문장 흐름은 대체로 자연스럽습니다. ‘묵을 곳에 이를 때까지 먹을 빵’으로 옮기면 여행 중 필요한 빵만 예외라는 수식 관계가 현대 한국어에서 명료해집니다.
  terminology: ‘사도’, ‘돈’, ‘거짓 예언자’는 문맥과 현대 표준어에 적절합니다. ‘거짓 예언자’는 ψευδοπροφήτης의 직접적 의미를 보존합니다.
  issues:
  - severity: medium
    issue: λαμβανέτω를 ‘받지 말아야 합니다’로 번역함
    rationale: 출발하는 여행자의 소지품을 규정하는 문맥에서 원문의 동사는 ‘가지고 가다’로 옮기는 것이 더 직접적입니다. ‘받다’는 숙주에게서 수령하는 행위로 읽힐 수 있습니다.
  - severity: low
    issue: αὐλισθῇ를 ‘머무를 곳을 찾기 전까지’로 번역함
    rationale: 원문은 숙소를 찾는 행위보다 묵게 되는 시점까지를 말합니다. ‘묵을 곳에 이를 때까지’가 원문의 시간적 의미를 더 잘 보존합니다.
  revised_text: 그리고 사도가 떠날 때에는 묵을 곳에 이를 때까지 먹을 빵 외에는 아무것도 가져가지 말아야 합니다. 그러나 돈을 요구하면 그는 거짓 예언자입니다.
