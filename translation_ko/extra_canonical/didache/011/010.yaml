id: DID.11.10
reference: Didache 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: πᾶς δὲ προφήτης διδάσκων τὴν ἀλήθειαν, εἰ ἃ διδάσκει οὐ ποιεῖ, ψευδοπροφήτης ἐστί.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/010.yaml
  text: And every prophet teaching the truth, if he does not do what he teaches, is a false prophet.
translation:
  language: ko
  text: 그리고 진리를 가르치는 모든 예언자가 자기가 가르치는 것을 행하지 않으면 거짓 예언자입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς δὲ προφήτης
  english_pob_choice: And every prophet
  chosen_korean: 그러나 진리를 가르치는 모든 예언자
  alternatives_korean:
  - 그리고 모든 예언자
  - 그러나 모든 예언자
  lexicon: πᾶς, προφήτης
  rationale: 문맥상 앞절과 이어지는 대조를 살려 δέ를 ‘그러나’로 옮기고, προφήτης는 이 문맥에서 전통적 교회어보다 직역성 있는 ‘예언자’가 원문 의미를 더 분명히 드러냅니다.
- source_word: διδάσκων τὴν ἀλήθειαν
  english_pob_choice: teaching the truth
  chosen_korean: 진리를 가르치는
  alternatives_korean:
  - 참된 것을 가르치는
  - 진실을 가르치는
  lexicon: διδάσκω, ἀλήθεια
  rationale: ἀλήθεια는 단순한 ‘사실’보다 규범적·신앙적 ‘진리’의 의미가 강하므로 ‘진리를 가르치는’이 가장 직접적입니다.
- source_word: εἰ ἃ διδάσκει οὐ ποιεῖ
  english_pob_choice: if he does not do what he teaches
  chosen_korean: 자기가 가르치는 것을 행하지 않으면
  alternatives_korean:
  - 가르치는 것을 하지 않으면
  - 자기가 가르친 대로 살지 않으면
  lexicon: ποιέω
  rationale: ἃ διδάσκει는 ‘자기가 가르치는 것’으로 받는 것이 자연스럽고, οὐ ποιεῖ는 단순한 지식 불일치가 아니라 실제 행함의 부재를 뜻하므로 ‘행하지 않으면’이 가장 밀착됩니다.
- source_word: ψευδοπροφήτης ἐστί
  english_pob_choice: is a false prophet
  chosen_korean: 거짓 예언자입니다
  alternatives_korean:
  - 거짓 선지자입니다
  - 참예언자가 아닙니다
  lexicon: ψευδοπροφήτης
  rationale: ψευδοπροφήτης는 원문의 평가어를 직접 살려 ‘거짓 예언자’로 옮기는 것이 좋고, 현대 한국어에서 ‘예언자’가 문맥상 덜 경직되어 읽힙니다.
theological_decisions:
- issue: 예언자의 참됨의 기준
  chosen_reading: 가르침의 내용이 아니라, 가르친 것을 실제로 행하는지 여부가 참예언자/거짓 예언자를 가르는 기준으로 제시됩니다.
  alternative_readings:
  - 단지 위선 비판으로만 제한하는 읽기
  - 가르침의 진리성만 강조하는 읽기
  rationale: 원문은 ‘진리를 가르치는’ 예언자라도, 그것을 행하지 않으면 거짓 예언자라고 말해 행위와 가르침의 일치를 निर्ण정 기준으로 둡니다.
  doctrine_reference: 예언의 분별과 삶의 일치
