    rationale: 한국어에서는 조건절 뒤 쉼표와 주어 대명사가 필요하지 않습니다. 삭제해도 원문의 논리나 강조는 변하지 않고 문체가 자연스러워집니다.
  revised_text: 그리고 진리를 가르치는 모든 예언자가 자기가 가르치는 것을 행하지 않으면 거짓 예언자입니다.
