revisions:
- from: 그러나 영으로 말하는 모든 사람이 예언자는 아닙니다. 다만 주님의 행실을 가져야 합니다. 그러므로 그들의 행실로 거짓 예언자와 예언자가 알려질 것입니다.[a]
  to: 그러나 영으로 말하는 사람이 모두 예언자인 것은 아닙니다. 주님의 삶의 방식을 지니고 있을 때에만 예언자입니다. 그러므로 그들의 삶의 방식으로 거짓 예언자와 예언자가 분별될 것입니다.[a]
  rationale: 조건문을 명시하여 원문의 논리, 곧 영으로 말하는 현상만으로 예언자됨이 확증되지 않고 주님의 삶의 방식을 지닌 경우에만 그렇다는 뜻을 보존했습니다. τρόποι는 ‘삶의 방식’으로 일관되게 옮겨 ὁδός와의 어휘적 구별을 유지했으며, 판별 문맥에 맞게 γνωσθήσεται를 ‘분별될 것입니다’로 자연스럽게 표현했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:38Z'
review_pass:
  verdict: revise
  source_fidelity: 그리스어의 조건문 ἀλλ᾽ ἐὰν ἔχῃ(“그러나 … 지니고 있을 경우에만”)는 예언자됨의 조건을 나타냅니다. 초안의 “다만 주님의 행실을 가져야 합니다”는 독립적인 당위 문장처럼 되어 이 조건 관계가 약화됩니다. τρόποι는 ὁδός와 구별되는 삶의 방식·행실을 가리키며, ‘영’은 본문에 정관사가 없으므로 그대로 유지하는 것이 안전합니다.
  naturalness: ‘주님의 행실을 가져야 합니다’는 한국어에서 다소 부자연스럽고, 앞 문장과의 문법적 연결도 불명확합니다. ‘주님의 삶의 방식을 지니고 있을 때에만’으로 옮기면 조건과 의미가 자연스럽게 드러납니다. 마지막 문장도 ‘알려질 것입니다’보다 사람의 진위 판별 문맥에 맞는 ‘분별될 것입니다’이 자연스럽습니다.
  terminology: ‘예언자’, ‘거짓 예언자’, ‘영’의 선택은 적절합니다. τρόποι는 디다케의 ὁδός(길)와 동일한 표지어로 처리하지 않고 ‘삶의 방식’으로 옮기는 것이 어휘상 적절합니다.
  issues:
  - severity: medium
    issue: 조건절 ἀλλ᾽ ἐὰν ἔχῃ의 의미가 독립 당위문으로 바뀜
    rationale: 원문은 영으로 말한다고 해서 모두 예언자는 아니며, 주님의 τρόποι를 지닌 경우에만 예언자라고 말합니다. ‘가져야 합니다’는 명령·당위처럼 들려 조건적 서술을 충분히 전달하지 못합니다.
  - severity: low
