    rationale: ‘행실을 지니다’ 또는 ‘삶의 방식을 지니다’가 더 자연스럽습니다. 또한 ‘삶의 방식’은 τρόπος의 생활·행동 양식을 잘 나타내며 ὁδός와의 구별도 보존합니다.
  revised_text: 그러나 영으로 말하는 사람이 모두 예언자인 것은 아닙니다. 주님의 삶의 방식을 지니고 있을 때에만 예언자입니다. 그러므로 그들의 삶의 방식으로 거짓 예언자와 예언자가 분별될 것입니다.[a]
