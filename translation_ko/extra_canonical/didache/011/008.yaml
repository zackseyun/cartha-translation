id: DID.11.8
reference: Didache 11:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ πᾶς δὲ ὁ λαλῶν ἐν πνεύματι προφήτης ἐστίν, ἀλλ' ἐὰν ἔχῃ τοὺς τρόπους Κυρίου. Ἀπὸ οὖν τῶν τρόπων γνωσθήσεται ὁ ψευδοπροφήτης καὶ ὁ προφήτης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/008.yaml
  text: Yet not everyone speaking in the Spirit is a prophet[a], but only if he has the ways of the Lord. Therefore, from their ways the false prophet and the prophet will be known.
  footnotes:
  - marker: a
    text: Or 'the ways of the Lord. So then, from their ways'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 영으로 말하는 모든 사람이 예언자는 아닙니다. 다만 주님의 행실을 가져야 합니다. 그러므로 그들의 행실로 거짓 예언자와 예언자가 알려질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주님의 행실’은 원문의 τρόπους Κυρίου를 옮긴 것으로, 디다케의 ὁδός(‘길’)와는 다른 ‘삶의 방식/행실’을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: ἐν πνεύματι
  english_pob_choice: speaking in the Spirit
  chosen_korean: 영으로 말하는
  alternatives_korean:
  - 성령으로 말하는
  - 영 안에서 말하는
  lexicon: πνεῦμα
  rationale: 문맥상 초자연적 영의 작용을 가리키지만, 본문에는 정관화된 성령 표지가 없으므로 ‘성령’보다 더 직접적인 ‘영’이 원문에 가깝습니다.
- source_word: προφήτης
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자
  lexicon: προφήτης
  rationale: 디다케의 문맥에서 미래 예고보다 하나님의 뜻을 전하는 사람을 가리키므로, 현대 한국어에서는 ‘예언자’가 더 직접적입니다.
- source_word: τοὺς τρόπους Κυρίου
  english_pob_choice: the ways of the Lord
  chosen_korean: 주님의 행실
  alternatives_korean:
  - 주님의 길
  - 주님의 방식
  - 주님의 행실과 태도
  lexicon: τρόπος
  rationale: 이 단어는 디다케의 핵심어 ‘길’(ὁδός)과 구별되는 ‘행실/삶의 방식’에 가깝기 때문에, 그 의미 차이를 살려 ‘행실’로 옮겼습니다.
- source_word: γνωσθήσεται
  english_pob_choice: will be known
  chosen_korean: 알려질 것입니다
  alternatives_korean:
  - 드러날 것입니다
  - 알려질 것입니다
  - 분별될 것입니다
  lexicon: γνωρίζω
  rationale: 미래 수동의 결과를 자연스럽게 살리되, 두 사람의 참됨이 행실을 통해 판별된다는 뜻을 드러내도록 옮겼습니다.
theological_decisions:
- issue: ‘영으로 말하는’ 사람과 참 예언자의 구별 기준
  chosen_reading: 말의 영적 현상 자체가 아니라 주님을 닮은 행실이 참 예언자의 표지입니다.
  alternative_readings:
  - 영적 은사 자체가 있으면 예언자로 볼 수 있다는 읽기
  - 예언 여부를 말의 내용만으로 판단하는 읽기
  rationale: 원문은 발화의 영적 형식보다 ‘주님의 τρόποι’를 기준으로 삼아 참예언과 거짓예언을 분별하라고 하므로, 윤리적·제자도적 기준을 분명히 해야 합니다.
  doctrine_reference: 디다케 11:8의 분별 기준; 두 길 전통
