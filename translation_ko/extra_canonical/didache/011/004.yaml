  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἀπόστολος ἐρχόμενος πρὸς ὑμᾶς δεχθήτω ὡς Κύριος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/011/004.yaml
  text: Let every apostle who comes to you be received as the Lord.
translation:
  language: ko
  text: 그러므로 여러분에게 오는 모든 사도는 주님으로 받아들이십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς δὲ ἀπόστολος
  english_pob_choice: Let every apostle
  chosen_korean: 모든 사도
  alternatives_korean:
  - 각 사도
  - 오는 모든 사도들
  lexicon: ἀπόστολος
  rationale: Πᾶς δὲ는 문맥상 ‘모든’으로 자연스럽게 옮기고, ἀπόστολος는 여기서 일반명사로서의 ‘사도’를 유지하는 것이 본문 의미에 충실합니다.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  english_pob_choice: who comes to you
  chosen_korean: 여러분에게 오는
  alternatives_korean:
  - 여러분에게 찾아오는
  - 여러분에게 다가오는
  lexicon: ἔρχομαι
  rationale: 동작의 방향성과 현재적 진행감을 살려 ‘오는’으로 간결하게 옮겼습니다.
- source_word: δεχθήτω
  english_pob_choice: be received
  chosen_korean: 받아들이십시오
  alternatives_korean:
  - 영접하십시오
  - 받으십시오
  lexicon: δέχομαι
  rationale: 단순한 수용이 아니라 공동체가 사람을 맞아들이는 행위를 나타내므로, 현대 한국어에서 가장 분명한 ‘받아들이십시오’를 선택했습니다.
- source_word: ὡς Κύριος
  english_pob_choice: as the Lord
  chosen_korean: 주님으로
  alternatives_korean:
  - 주님처럼
  - 주로
  lexicon: κύριος
  rationale: ὡς는 여기서 동일시가 아니라 수용 방식의 기준을 나타내므로 ‘~으로’가 적절하며, κύριος는 예수께 대한 존칭으로 ‘주님’이 자연스럽습니다.
theological_decisions:
- issue: 사도를 어떻게 받아들여야 하는가
  chosen_reading: 사도가 주님의 권위에 속한 사람으로서 환대되어야 한다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 사도를 거의 주님과 동등하게 받아들여야 한다는 뜻
  - 사도를 단순한 손님 이상으로 존중해야 한다는 뜻
  rationale: 본문의 ὡς는 신분 동일화보다 권위에 근거한 대우를 요구하는 표현으로 보는 것이 문맥과 더 잘 맞습니다.
  doctrine_reference: 사도직과 파송 권위
