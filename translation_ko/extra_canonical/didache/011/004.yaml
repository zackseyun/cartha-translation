review_pass:
  verdict: revise
  source_fidelity: Πᾶς δέ는 단순한 접속적 전환으로, 인과를 뜻하는 ‘그러므로’는 근거가 없습니다. 또한 ὡς Κύριος는 사도를 주님과 동일시하는 뜻이라기보다 주님을 대하듯 받아들이라는 비교적 수용 방식을 나타냅니다.
  naturalness: ‘주님으로 받아들이십시오’는 한국어에서 사도를 주님이라는 신분으로 받아들인다는 의미로 쉽게 읽힙니다. ‘주님을 대하듯이 맞이하십시오’가 현대 한국어에서 자연스럽고 뜻도 명확합니다.
  terminology: ἀπόστολος는 ‘사도’, Κύριος는 존칭적·신앙적 용례에 맞게 ‘주님’으로 유지합니다. δέ는 여기서 ‘또’로 최소한의 연결만 드러냅니다.
  issues:
  - severity: medium
    issue: ‘그러므로’가 δέ를 인과 접속으로 번역함
    rationale: δέ 자체는 일반적으로 대조·전환·첨가를 나타내며, 이 한 절에는 ‘그러므로’라는 결론적 의미를 뒷받침할 요소가 없습니다.
  - severity: medium
    issue: ‘주님으로 받아들이십시오’가 ὡς Κύριος의 비교 의미를 흐림
    rationale: 한국어 ‘~으로 받아들이다’는 대상의 신분이나 정체성을 그렇게 간주한다는 뜻으로 들릴 수 있습니다. ‘주님을 대하듯이’는 사도를 주님과 동일시하지 않으면서 요구된 대우를 정확히 표현합니다.
  revised_text: 여러분에게 오는 모든 사도는 주님을 대하듯이 맞이하십시오.
