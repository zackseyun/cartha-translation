  text: If you have anything, you shall give through your hands a ransom for your sins.
translation:
  language: ko
  text: 만일 네게 무엇이든지 있다면, 네 손으로 네 죄들의 속량을 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속량’(그리스어 λύτρωσις)은 속전 또는 해방을 위한 값을 뜻할 수 있습니다. 여기서는 ‘네 죄들의 속량’이라는 그리스어 표현의 관계를 그대로 보존한 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἔχῃς
  english_pob_choice: If you have anything
  chosen_korean: 만일 네가 무엇이든지 가지고 있다면
  alternatives_korean:
  - 네가 가지고 있다면
  - 무엇이든지 네게 있다면
  lexicon: ἐὰν + ἔχω
  rationale: 조건절의 개방성을 살려 ‘만일’과 ‘무엇이든지’를 함께 써서, 소유의 정도가 크지 않아도 해당될 수 있음을 드러냈습니다.
- source_word: διὰ τῶν χειρῶν σου
  english_pob_choice: through your hands
  chosen_korean: 네 손을 통해
  alternatives_korean:
  - 네 손으로
  - 네 손을 거쳐
  lexicon: διά + χείρ
  rationale: διά의 수단/매개 의미를 살려 직접적 행위를 가리키는 ‘손으로’보다, 행위의 매개성을 보이는 ‘손을 통해’를 택했습니다.
- source_word: λύτρωσιν
  english_pob_choice: a ransom
  chosen_korean: 속전
  alternatives_korean:
  - 대가
  - 속량
  - 몸값
  lexicon: λύτρωσις
  rationale: 구속·해방의 값을 가리키는 어감을 유지하기 위해, ‘죄를 위한 대가’보다 더 직접적인 ‘속전’을 선택했습니다.
- source_word: ἁμαρτιῶν σου
  english_pob_choice: for your sins
  chosen_korean: 네 죄들을 위한
  alternatives_korean:
  - 네 죄를 위한
  - 죄 때문에
  lexicon: ἁμαρτία
  rationale: 복수형을 반영해 ‘죄들을’로 옮기고, 목적 관계를 분명히 하기 위해 ‘위한’을 유지했습니다.
theological_decisions:
- issue: ‘λύτρωσιν ἁμαρτιῶν σου’의 구속적 의미
  chosen_reading: ‘네 죄들을 위한 속전’으로 옮겨, 단순한 기부 권고가 아니라 죄와 관련된 속량의 값을 의식하게 했습니다.
  alternative_readings:
  - ‘죄를 위한 구제금’
  - ‘죄의 속량값’
  rationale: 문맥상 행위의 금전적/실천적 차원을 넘어서 죄와 연결된 속전 개념이 핵심이므로, 이를 희석하지 않는 표현을 택했습니다.
  doctrine_reference: 속량/대속 어휘의 기본 의미 보존
