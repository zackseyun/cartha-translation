review_pass:
  verdict: revise
  source_fidelity: 그리스어는 ‘무엇이 있으면/가지고 있으면’(ἐὰν ἔχῃς)이라는 조건 아래, ‘네 손을 통하여’(διὰ τῶν χειρῶν σου) 주고, 그 목적어를 ‘네 죄들의 속량’(λύτρωσιν ἁμαρτιῶν σου)으로 둡니다. 초안의 ‘네 죄들을 위한 속전’은 속전이 죄를 위해 바쳐지는 물건이라는 뜻으로 기울 수 있어, 속량의 대상·관련을 더 직접적으로 드러내는 표현이 적절합니다.
  naturalness: ‘네 손을 통해’는 가능하지만 한국어에서는 이 문맥의 실제 행위·수단을 나타낼 때 ‘네 손으로’가 더 자연스럽습니다. 또한 ‘내어 주어야 합니다’는 μὴ ἀμφιβάλῃς δοῦναι 계열의 강한 의무 표현이 본문에 없으므로, 미래 직설법의 권면적 명령을 ‘주십시오’로 옮기는 편이 적절합니다.
  terminology: λύτρωσις는 ‘속량’으로 옮겨 구속·해방의 의미를 보존하되, 특정 속죄 이론을 덧붙이지 않습니다. ἁμαρτιῶν의 복수는 ‘죄들’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘네 죄들을 위한 속전’의 관계 표현
    rationale: ‘속전’이 ‘죄들을 위해 지불하는 값’이라는 방향으로 읽힐 수 있습니다. 속량의 목적·관련을 나타내는 그리스어 속격을 ‘네 죄들의 속량’으로 옮기면 원문의 명사구 관계를 더 투명하게 보존합니다.
  - severity: medium
    issue: ‘내어 주어야 합니다’의 강도
    rationale: δώσεις는 미래형으로, 이 권면 문맥에서는 명령적 미래로 기능할 수 있으나 ‘~해야 합니다’보다 ‘주십시오’가 원문의 직접적인 권면과 합쇼체 문체에 더 잘 맞습니다.
  - severity: low
    issue: ‘네 손을 통해’의 자연스러움
    rationale: διὰ τῶν χειρῶν σου의 수단적 표현은 ‘네 손으로’가 현대 한국어에서 더 자연스럽고 충분히 충실합니다.
