id: DID.4.2
reference: Didache 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐκζητήσεις δὲ καθ’ ἡμέραν τὰ πρόσωπα τῶν ἁγίων, ἵνα ἐπαναπαῇ τοῖς λόγοις αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/002.yaml
  text: And you shall seek out day by day the presence of the saints, so that you may find rest in their words.
translation:
  language: ko
  text: 날마다 성도들을[a] 찾아가십시오. 그러면 그들의 말에서 쉼을 얻을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘성도들의 얼굴들’입니다. 여기서는 성도들을 직접 찾아 만나라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: Ἐκζητήσεις
  english_pob_choice: you shall seek out
  chosen_korean: 찾아가십시오
  alternatives_korean:
  - 찾으십시오
  - 구하십시오
  - 찾아보십시오
  lexicon: ἐκζητέω
  rationale: 단순한 ‘찾다’보다 적극적으로 ‘찾아가다’가 목적어인 사람들의 실제 접촉과 탐문성을 함께 살려 주므로, POB의 seek out에 가장 가깝게 옮겼습니다.
- source_word: τὰ πρόσωπα
  english_pob_choice: the presence
  chosen_korean: 얼굴
  alternatives_korean:
  - 임재
  - 존재
  - 모습
  lexicon: πρόσωπον
  rationale: 원문은 직역하면 ‘얼굴들’이지만, 영어 POB는 개인적 대면의 뜻을 살려 presence로 풀었습니다. 한국어에서는 ‘얼굴’이 다소 거칠 수 있어 본문은 자연스럽게 다듬되, 어조를 과도하게 추상화하지 않기 위해 ‘얼굴’ 대신 동사 ‘찾아가십시오’로 관계적 뉘앙스를 보완했습니다.
- source_word: τῶν ἁγίων
  english_pob_choice: of the saints
  chosen_korean: 성도들의
  alternatives_korean:
  - 성인들의
  - 거룩한 이들의
  lexicon: ἅγιοι
  rationale: 파울로스적/초기 교회적 용례의 기본어인 ‘성도’를 유지해, 전통 교회 용어를 살리면서도 원문의 집단 지칭을 분명히 했습니다.
- source_word: ἐπαναπαῇ
  english_pob_choice: you may find rest
  chosen_korean: 쉼을 얻게 될 것입니다
  alternatives_korean:
  - 안식을 얻을 것입니다
  - 쉬게 될 것입니다
  - 평안을 얻게 될 것입니다
  lexicon: ἐπαναπαύω
  rationale: ‘rest’의 의미를 한국어에서 가장 자연스럽고 성경적 울림이 있는 ‘쉼’으로 옮겼고, 문맥상 결과를 나타내기 위해 ‘얻게 될 것입니다’로 풀었습니다.
theological_decisions:
- issue: 성도들과의 접촉이 주는 영적 효익의 표현
  chosen_reading: 성도들을 날마다 찾아가면 그들의 말에서 쉼을 얻게 된다고 옮겨, 공동체적 권면이 주는 실제적 유익을 살렸습니다.
  alternative_readings:
  - 성도들의 임재 안에서 쉼을 얻는다
  - 성도들의 말을 들으며 쉬게 된다
  rationale: 원문은 단순 정보 전달이 아니라, 성도들과의 일상적 접촉이 교훈과 안식으로 이어진다는 실천적 권고입니다. 이를 지나치게 추상화하지 않고 관계성과 결과를 함께 드러냈습니다.
  doctrine_reference: 초기 교회 공동체 권면과 성도의 교제
- issue: ‘말들’과 ‘쉼’의 관계
  chosen_reading: ‘그들의 말에서’로 유지해, 쉼이 단지 정서적 위안이 아니라 성도들의 말, 곧 교훈과 권면을 통해 온다는 점을 보존했습니다.
  alternative_readings:
  - 그들의 말 가운데서
  - 그들의 가르침에서
  rationale: 원문 λόγοι는 단순 대화가 아니라 권위 있는 말/가르침까지 포함할 수 있으므로, 의미를 좁히지 않는 범위에서 ‘말’로 직역성을 유지했습니다.
  doctrine_reference: 권면과 가르침의 공동체성
