  alternatives_korean:
  - 증오하십시오
  - 싫어하십시오
  lexicon: μισέω
  rationale: 직설적 금지·권면의 힘을 살리면서도 현대 한국어에서 자연스럽고 공적 문체에 맞는 명령형으로 옮겼습니다.
- source_word: πᾶσαν ὑπόκρισιν
  english_pob_choice: all hypocrisy
  chosen_korean: 모든 위선
  alternatives_korean:
  - 모든 가식
  - 모든 허위
  lexicon: ὑπόκρισις
  rationale: ὑπόκρισις의 핵심은 겉과 속이 다른 위선이므로, 교회적 관용보다 원의가 분명한 ‘위선’을 선택했습니다.
- source_word: πᾶν ὃ μὴ ἀρεστὸν τῷ Κυρίῳ
  english_pob_choice: everything that is not pleasing to the Lord
  chosen_korean: 주님께 기쁘지 않은 모든 것
  alternatives_korean:
  - 주님을 기쁘게 하지 않는 모든 것
  - 주님 마음에 들지 않는 모든 것
  lexicon: ἀρεστός / κύριος
  rationale: ‘pleasing’은 단순 선호가 아니라 주님의 뜻에 합당함을 뜻하므로, 관용적이면서도 의미가 분명한 ‘기쁘지 않은’으로 번역했습니다.
