lexical_decisions:
- source_word: Οὐ διψυχήσεις
  english_pob_choice: You shall not be double-minded
  chosen_korean: 의심해서는 안 됩니다
  alternatives_korean:
  - 두 마음을 품어서는 안 됩니다
  - 우유부단해서는 안 됩니다
  - 양쪽에 마음을 두어서는 안 됩니다
  lexicon: διψυχέω
  rationale: 이 동사는 여기서 ‘두 마음을 품다’의 상태적 표현보다, 뒤의 간접의문절과 함께 ‘의심하다/흔들리다’는 작용을 더 자연스럽게 드러냅니다. 한국어에서는 합쇼체로 간결하게 ‘의심해서는 안 됩니다’로 옮겼습니다.
- source_word: πότερον ἔσται ἢ οὔ
  english_pob_choice: whether it will be or not
  chosen_korean: 그것이 있든 없든
  alternatives_korean:
  - 그 일이 일어날지 아닐지
  - 있을지 없을지
  - 될지 안 될지
  lexicon: πότερον + ἔσται ἢ οὔ
  rationale: 원문의 핵심은 ‘그럴지 아닐지’를 두고 갈팡질팡하지 말라는 간접의문 구조입니다. 한국어에서는 매끄럽게 하면서도 결과의 불확실성을 살려 ‘그것이 있든 없든’으로 옮겼습니다.
theological_decisions:
- issue: διψυχέω의 의미를 ‘두 마음’의 관용어로 유지할지, 문맥상 작용어인 ‘의심하다’로 옮길지
  chosen_reading: 문맥상 실천적 경고를 살려 ‘의심해서는 안 됩니다’로 번역했습니다.
  alternative_readings:
  - 두 마음을 품어서는 안 됩니다
  - 우유부단해서는 안 됩니다
  rationale: 디다케 4:4의 간결한 금령은 윤리적 태도를 지적하지만, 여기서는 간접의문절이 붙어 실제 행동의 주저와 의심을 직접 겨냥합니다. 따라서 관용적 표현을 그대로 반복하기보다 문맥 기능을 드러냈습니다.
  doctrine_reference: Didache 4:4; διψυχέω in context
