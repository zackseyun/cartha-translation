review_pass:
  verdict: revise
  source_fidelity: The draft preserves the three-clause structure and accurately renders ἐκκλησία, ἐξομολογήσῃ, and the final formula, ἡ ὁδὸς τῆς ζωῆς. However, ‘당신의’ is not appropriate for a general addressee in modern Korean, and ‘잘못’ somewhat weakens παράπτωμα’s moral sense of a lapse or offense. The revision uses ‘자신의 허물’ without adding theological interpretation. ‘기도하러 나아가지 마십시오’ appropriately reflects προσελεύσῃ ἐπὶ προσευχήν, and ‘악한 양심’ retains the source’s morally qualified conscience without resolving its precise nuance beyond the Greek.
  naturalness: ‘회중 가운데서’ is more idiomatic than the somewhat compressed ‘회중에서’ while retaining the sense of a gathered assembly. Replacing the generic-address ‘당신의’ with ‘자신의’ is necessary in formal Korean. ‘악한 양심을 품고’ is a natural formal expression and maintains the attendant inner disposition.
  terminology: ‘회중’ suitably represents ἐκκλησία here as the gathered community rather than necessarily a formal institutional church. ‘허물’ is a natural, morally weightier Korean equivalent for παράπτωμα than ‘잘못.’ ‘양심’ and ‘생명의 길’ should be retained.
  issues:
  - severity: medium
    issue: ‘당신의 잘못’ uses an unsuitable generic second-person possessive and softens παράπτωμα.
    rationale: In contemporary formal Korean, ‘당신’ can sound confrontational or overly personal outside specific contexts. ‘잘못’ may denote ordinary mistakes, whereas παράπτωμα denotes moral offenses/lapses. ‘자신의 허물’ is more idiomatic and source-sensitive.
  - severity: low
    issue: ‘회중에서’ is slightly compressed in Korean prose.
    rationale: ‘회중 가운데서’ more clearly and naturally conveys confession within the assembled community, without changing the referent.
  revised_text: 회중 가운데서 자신의 허물을 고백하십시오. 그리고 악한 양심을 품고 기도하러 나아가지 마십시오. 이것이 생명의 길입니다.
  revised_footnotes: []
  revision_rationale: 'The revision makes only safe Korean-language and semantic adjustments: it replaces the marked generic ‘당신’ with ‘자신,’ strengthens ‘잘못’ to ‘허물’ for παράπτωμα, and smooths the assembly expression. It preserves the imperative force, the parallel prohibitive instruction, and the concise concluding declaration.'
