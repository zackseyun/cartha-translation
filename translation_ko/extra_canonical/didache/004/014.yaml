  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν ἐκκλησίᾳ ἐξομολογήσῃ τὰ παραπτώματά σου, καὶ οὐ προσελεύσῃ ἐπὶ προσευχήν σου ἐν συνειδήσει πονηρᾷ. Αὕτη ἐστὶν ἡ ὁδὸς τῆς ζωῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/014.yaml
  text: In the assembly you shall confess your transgressions, and you shall not come to prayer with an evil conscience. This is the way of life.
translation:
  language: ko
  text: 회중 가운데서 자신의 허물을 고백하십시오. 그리고 악한 양심을 품고 기도하러 나아가지 마십시오. 이것이 생명의 길입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκκλησίᾳ
  english_pob_choice: In the assembly
  chosen_korean: 회중에서
  alternatives_korean:
  - 모임에서
  - 교회에서
  lexicon: ἐκκλησία
  rationale: 이 문맥의 ἐκκλησία는 제도 기관보다 모인 공동체를 가리키므로, POB의 “assembly”에 맞춰 ‘회중’으로 옮겼습니다.
- source_word: ἐξομολογήσῃ
  english_pob_choice: you shall confess
  chosen_korean: 고백하십시오
  alternatives_korean:
  - 자백하십시오
  - 시인하십시오
  lexicon: ἐξομολογέομαι
  rationale: 죄책을 인정하고 드러내는 행위라는 점을 살려 ‘고백하다’를 택했고, 한국어 문장에서는 직접 명령형으로 자연스럽게 다듬었습니다.
- source_word: τὰ παραπτώματά σου
  english_pob_choice: your transgressions
  chosen_korean: 당신의 잘못을
  alternatives_korean:
  - 당신의 범죄를
  - 당신의 허물을
  lexicon: παράπτωμα
  rationale: παράπτωμα의 도덕적 일탈, 실족, 잘못의 폭을 살리면서도 현대 한국어에서 과도하게 법정화되지 않도록 ‘잘못’으로 옮겼습니다.
- source_word: ἐν συνειδήσει πονηρᾷ
  english_pob_choice: with an evil conscience
  chosen_korean: 악한 양심을 가지고
  alternatives_korean:
  - 악한 양심으로
  - 사악한 양심을 품고
  lexicon: συνείδησις / πονηρός
  rationale: ‘양심’은 행위의 내적 상태를 드러내며, πονηρᾷ는 단순한 불편함이 아니라 도덕적으로 악한 상태를 뜻하므로 ‘악한 양심’으로 유지했습니다.
theological_decisions:
- issue: “생명의 길”의 표현 보존
  chosen_reading: 이 구절의 결론을 ‘이것이 생명의 길입니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘이것이 참된 삶의 길입니다’
  - ‘이것이 생명으로 가는 길입니다’
  rationale: 원문 ἡ ὁδὸς τῆς ζωῆς는 단순한 안내가 아니라 공동체 윤리 전체를 요약하는 선언이므로, 추가 해설을 덧붙이지 않고 단정적으로 살렸습니다.
  doctrine_reference: Didache의 윤리적 결론 문구에 대한 문맥 보존
- issue: 기도와 회개를 분리하지 않고 연결함
  chosen_reading: ‘회중에서… 고백하십시오, 또… 기도하러 나아가지 마십시오’의 병렬 구조를 그대로 반영했습니다.
  alternative_readings:
  - ‘회중에서 회개하고 기도하십시오’
  - ‘기도 전에 잘못을 고백하십시오’
  rationale: 원문은 공동체 안의 고백과 부정적 명령을 병렬로 제시하여 정결한 예배 태도를 강조하므로, 순서를 바꾸거나 풀어 쓰지 않았습니다.
  doctrine_reference: 공동체 회개와 예배 정결의 윤리
