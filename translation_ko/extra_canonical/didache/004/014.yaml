revisions:
- from: 회중에서 당신의 잘못을 고백하십시오. 또 악한 양심을 가지고 기도하러 나아가지 마십시오. 이것이 생명의 길입니다.
  to: 회중 가운데서 자신의 허물을 고백하십시오. 그리고 악한 양심을 품고 기도하러 나아가지 마십시오. 이것이 생명의 길입니다.
  rationale: 'The revision makes only safe Korean-language and semantic adjustments: it replaces the marked generic ‘당신’ with ‘자신,’ strengthens ‘잘못’ to ‘허물’ for παράπτωμα, and smooths the assembly expression. It preserves the imperative force, the parallel prohibitive instruction, and the concise concluding declaration.'
