id: DID.4.1
reference: Didache 4:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τέκνον μου, τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ μνησθήσῃ νυκτὸς καὶ ἡμέρας, τιμήσεις δὲ αὐτὸν ὡς Κύριον· ὅθεν γὰρ ἡ κυριότης λαλεῖται, ἐκεῖ Κύριός ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/001.yaml
  text: My child, you shall remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken, there the Lord is.
  footnotes:
  - marker: a
    text: Or 'remember night and day the one who speaks to you the word of God, and you shall honor him'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아이야, 너는 밤낮으로 너에게 하나님의 말씀을 전하는 이를 기억해야 합니다. 그리고 그를 주님으로서 존중해야 합니다. 권위가 말해지는 곳에 주님이 계시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밤낮으로 너에게 하나님의 말씀을 전하는 이를 기억해야 하며, 그를 존중해야 합니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: Τέκνον μου
  english_pob_choice: My child
  chosen_korean: 내 아이야
  alternatives_korean:
  - 내 자녀야
  - 내 아들아
  lexicon: τέκνον
  rationale: 친밀한 훈계의 호칭을 자연스럽게 살리되, 성별을 불필요하게 한정하지 않기 위해 ‘아이야’로 옮겼습니다.
- source_word: τοῦ λαλούντός σοι τὸν λόγον τοῦ Θεοῦ
  english_pob_choice: the one who speaks to you the word of God
  chosen_korean: 너에게 하나님의 말씀을 전하는 이
  alternatives_korean:
  - 너에게 하나님의 말씀을 말하는 이
  - 너에게 하나님의 말씀을 선포하는 이
  lexicon: λαλέω; λόγος τοῦ Θεοῦ
  rationale: λαλέω는 단순 발화보다 말씀 전달의 행위를 포함하므로, 한국어에서는 ‘전하다’가 가장 자연스럽고 공적입니다.
- source_word: ὡς Κύριον
  english_pob_choice: as the Lord
  chosen_korean: 주님으로서
  alternatives_korean:
  - 주님처럼
  - 주님으로
  lexicon: κύριος
  rationale: 존칭을 유지하면서도 대상의 지위를 분명히 드러내기 위해 ‘주님으로서’라고 옮겼습니다.
- source_word: κυριότης
  english_pob_choice: lordship
  chosen_korean: 권위
  alternatives_korean:
  - 주권
  - 주되심
  - 주권적 통치
  lexicon: κυριότης
  rationale: 직역인 ‘주되심/주권’도 가능하지만, 문맥상 ‘말해지는’ 대상이 사람을 향한 권위이므로 한국어 의미 전달을 위해 ‘권위’로 옮겼습니다.
theological_decisions:
- issue: The speaker to be honored is treated “as the Lord,” but the final clause says “where lordship is spoken, there the Lord is.”
  chosen_reading: 문맥이 가리키는 예언/가르침의 권위는 주님께서 주시는 것으로 읽고, 사람에게 주님 자체의 예배를 돌리는 뜻으로 과장하지는 않았습니다.
  alternative_readings:
  - 단순히 인간 교사를 공경하라는 사회적 예절
  - 가르치는 사람을 곧바로 주님과 동일시하는 표현
  rationale: 그리스어의 ὡς와 κυριότης의 연결은 관계적 존중과 위임된 권위의 현존을 함께 말하므로, 둘 다 살리되 과도한 동일시는 피해야 합니다.
  doctrine_reference: 교회 권위와 그리스도의 주권
- issue: Future indicative forms function imperativally in the Greek text.
  chosen_reading: ‘기억해야 합니다’, ‘존중해야 합니다’로 옮겨 명령적 기능을 살리면서도 문법적 일관성을 유지했습니다.
  alternative_readings:
  - 기억하십시오, 존중하십시오
  - 기억할 것이며, 존중할 것입니다
  rationale: Didache의 교훈체 문맥과 그리스어 미래형의 명령적 용법을 함께 반영하기 위해, 한국어에서는 의무를 나타내는 평서형 보조 표현을 사용했습니다.
  doctrine_reference: 헬라어 미래형 명령용법
