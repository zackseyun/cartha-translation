revisions:
- from: 내 아이야, 너는 밤낮으로 너에게 하나님의 말씀을 전하는 이를 기억해야 합니다. 그리고 그를 주님으로서 존중해야 합니다. 권위가 말해지는 곳에 주님이 계시기 때문입니다.[a]
  to: 나의 아이야, 너는 밤낮으로 너에게 하나님의 말씀을 전하는 이를 기억해야 합니다. 그리고 주님을 공경하듯이 그를 공경해야 합니다. 주되심이 말해지는 곳에는 주님께서 계시기 때문입니다.[a]
  rationale: 원문의 미래형 명령 용법은 ‘기억해야 합니다/공경해야 합니다’로 유지했습니다. ὡς Κύριον은 인간 전달자를 주님과 동일시하지 않으면서도 요구되는 공경의 기준을 나타내도록 ‘주님을 공경하듯이’로 옮겼습니다. 마지막 절은 κυριότης와 Κύριος의 표현상 연결을 보존하기 위해 ‘주되심’과 ‘주님’을 사용했으며, 문맥상 어느 특정 교회론적 해석도 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
