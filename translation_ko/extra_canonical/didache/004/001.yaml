    issue: ‘그를 주님으로서 존중해야 합니다’
    rationale: ‘으로서’는 그 사람이 실제로 주님이라는 지위·자격을 가진다는 뜻으로 읽히기 쉽습니다. ὡς는 비교적·관계적인 ‘~을 대하듯이’의 뜻이므로 이를 구별해야 합니다.
  - severity: medium
    issue: κυριότης를 ‘권위’로 번역함
    rationale: ‘권위’는 가능한 문맥적 해석이지만, κύριος(주님)와 κυριότης(lordship)의 어근상 연결을 지우며 원문의 핵심 표현을 일반화합니다. ‘주되심’이 더 충실합니다.
  - severity: low
    issue: 각주에 ‘그를 존중해야 합니다’라고만 제시됨
    rationale: 영어 POB의 이전 번역 각주가 반영하는 대안 문구에 맞추되, 본문의 ‘공경’ 용어와 일치시켜야 합니다.
