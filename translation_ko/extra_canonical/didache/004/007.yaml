id: DID.4.7
reference: Didache 4:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ διστάσεις δοῦναι οὐδὲ διδοὺς γογγύσεις· γνώσῃ γὰρ τίς ἐστιν ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/007.yaml
  text: You shall not hesitate to give, nor grumble while giving; for you will know who is the good giver of the reward.
translation:
  language: ko
  text: 주기를 주저하지 말고, 주면서 투덜거리지 마십시오. 이는 보상을 훌륭히 갚아 주시는 분이 누구인지 알게 될 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ διστάσεις δοῦναι
  english_pob_choice: You shall not hesitate to give
  chosen_korean: 주는 일을 주저하지 말고
  alternatives_korean:
  - 주기를 망설이지 말고
  - 주는 데 머뭇거리지 말고
  lexicon: διστάζω
  rationale: δώσει/διστάσεις의 핵심은 ‘주기를 망설이다’이지만, 한국어에서는 자연스럽게 ‘주는 일을 주저하다’로 풀어 주저함 자체를 금지하는 명령성을 살렸습니다.
- source_word: διδοὺς γογγύσεις
  english_pob_choice: nor grumble while giving
  chosen_korean: 주면서 투덜거리지 마십시오
  alternatives_korean:
  - 주면서 불평하지 마십시오
  - 주는 동안 원망하지 마십시오
  lexicon: γογγύζω
  rationale: γογγύζω는 단순한 불평보다 속으로 투덜거리는 뉘앙스가 있어, ‘투덜거리지 마십시오’가 문맥의 구어적 경계감을 잘 전달합니다.
- source_word: ὁ τοῦ μισθοῦ καλὸς ἀνταποδότης
  english_pob_choice: the good giver of the reward
  chosen_korean: 상을 주시는 좋은 분
  alternatives_korean:
  - 보상을 주시는 선한 분
  - 삯을 갚아 주시는 좋은 분
  lexicon: ἀνταποδότης
  rationale: 본문은 문자적으로는 ‘보상의 갚아 주는 이’이지만, 영어 POB가 ‘giver of the reward’로 정리한 점을 따라 한국어도 ‘상을 주시는’으로 자연스럽게 옮기되, 원문의 보상/보답 개념은 ‘상’으로 유지했습니다.
theological_decisions:
- issue: 보상의 주체를 어떻게 표현할지
  chosen_reading: “그분이 누구인지”로 남기고, 뒤에서 “상을 주시는 좋은 분”으로 설명했습니다.
  alternative_readings:
  - ‘그분이 어떤 분인지’
  - ‘보답하시는 분이 누구인지’
  rationale: 본문은 청자가 결국 보상의 주체를 알게 될 것이라는 교훈을 주며, 이름을 특정하지 않고도 하나님을 염두에 둔 익명성을 유지합니다. 그래서 해설을 덧붙이되 본문 자체에서는 직접 지칭을 과도하게 확정하지 않았습니다.
  doctrine_reference: Didache의 권면 문맥과 보상/자비의 윤리
