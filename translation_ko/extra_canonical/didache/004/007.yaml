  to: 주기를 주저하지 말고, 주면서 투덜거리지 마십시오. 이는 보상을 훌륭히 갚아 주시는 분이 누구인지 알게 될 것이기 때문입니다.
  rationale: 첫 절은 자연스러운 한국어 명령문으로 다듬고, 마지막 절은 원문의 간접의문 구조를 그대로 살렸습니다. ‘보상을 훌륭히 갚아 주시는 분’은 μισθός의 보상 개념과 ἀνταποδότης의 보답 개념을 함께 보존하면서, 주체를 특정하지 않습니다.
