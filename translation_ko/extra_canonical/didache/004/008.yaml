base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/008.yaml
  text: You shall not turn away the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things?
translation:
  language: ko
  text: 궁핍한 사람을 외면하지 말고, 네 형제와는 모든 것을 함께 나누어야 하며, 그것이 자기 것이라고 말해서는 안 됩니다. 이는 여러분이 썩지 않는 것에 함께 참여하고 있다면, 썩는 것에는 얼마나 더 그러해야 하겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἴδια εἶναι는 직역하면 ‘자기 것이라고’이며, 소유 독점을 금하는 뉘앙스를 드러냅니다.
    reason: source_note
lexical_decisions:
- source_word: Οὐκ ἀποστραφήσῃ τὸν ἐνδεόμενον
  english_pob_choice: You shall not turn away the one in need
  chosen_korean: 궁핍한 사람을 외면하지 말고
  alternatives_korean:
  - 궁핍한 사람을 물리치지 말고
  - 필요한 사람을 돌아서지 말고
  lexicon: ἀποστρέφω, ἐνδεόμενος
  rationale: ἀποστραφῇς는 대상을 직접 취하는 ‘외면하다/물리치다’의 뜻이 자연스럽고, ἐνδεόμενον은 ‘궁핍한 사람’으로 간결하게 살렸습니다.
- source_word: συγκοινωνήσεις δὲ πάντα τῷ ἀδελφῷ σου
  english_pob_choice: you shall share all things with your brother
  chosen_korean: 네 형제와는 모든 것을 함께 나누어야 하며
  alternatives_korean:
  - 네 형제와 모든 것을 나누어야 하며
  - 네 형제와 모든 것을 공유해야 하며
  lexicon: συγκοινωνέω, ἀδελφός
  rationale: συγκοινωνήσεις는 단순한 ‘소유’보다 ‘함께 몫을 나누다/교제하다’의 결을 살려 ‘함께 나누다’로 옮겼고, ἀδελφός는 문맥상 신앙 공동체의 ‘형제’로 유지했습니다.
- source_word: οὐκ ἐρεῖς ἴδια εἶναι
  english_pob_choice: you shall not say they are your own
  chosen_korean: 그것이 자기 것이라고 말해서는 안 됩니다
  alternatives_korean:
  - 그것은 내 것이라고 말해서는 안 됩니다
  - 자기 소유라고 말해서는 안 됩니다
  lexicon: ἴδια εἶναι
  rationale: 직역하면 ‘자기 것이라고’이지만, 한국어에서는 대상을 중립적으로 받는 ‘그것이 자기 것’이 자연스럽고 소유 독점의 뉘앙스를 잘 드러냅니다.
- source_word: ἐν τῷ ἀθανάτῳ / ἐν τοῖς θνητοῖς
  english_pob_choice: in what is immortal / in mortal things
  chosen_korean: 썩지 않는 것 / 썩는 것
  alternatives_korean:
  - 불멸하는 것 / 죽을 것들
  - 영원한 것 / 죽을 것들
  lexicon: ἀθάνατος, θνητός
  rationale: 비교 대조는 단순한 존재론보다 ‘썩지 않음/썩음’의 대비가 한국어 독자에게 더 직접적이며, 문맥의 재산·물질 공유를 고려하면 의미가 분명해집니다.
theological_decisions:
- issue: 공동체적 소유 윤리의 강도
  chosen_reading: 명령형으로 공동체 내부의 실제 공유를 요구하는 문장으로 옮겼습니다.
  alternative_readings:
  - 권고적 표현으로 완화
  - 단순한 호의 권면으로 축소
  rationale: 본문은 부정 명령과 명령형을 병렬로 사용하여 구체적 실천을 요구하므로, 한국어에서도 윤리적 강도를 약화하지 않았습니다.
  doctrine_reference: Didache의 공동체 규범 문맥
