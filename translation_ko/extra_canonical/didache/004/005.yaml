  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μὴ γίνου πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας, πρὸς δὲ τὸ δοῦναι συσπῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/005.yaml
  text: Do not be one who stretches out his hands to receive[a], but draws them in to avoid giving.
  footnotes:
  - marker: a
    text: Or 'Do not be one who stretches out his hands to receive, but to give, draws them in.'.
    reason: previous_rendering
translation:
  language: ko
  text: 받으려고 손을 내미는 자는 되지 말고, 주려고는 손을 거두는 자가 되지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧바로 이어지는 ‘주려고는’은 헬라어 대비구조(πρὸς μὲν … πρὸς δὲ …)를 한국어로 옮긴 것으로, ‘받으려고는 내밀고, 주려고는 거두는’ 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: Μὴ γίνου
  english_pob_choice: Do not be one who...
  chosen_korean: …하는 자는 되지 마십시오
  alternatives_korean:
  - …하지 마십시오
  - …하는 사람이 되지 마십시오
  lexicon: μὴ γίνου
  rationale: 명령형의 금지를 자연스러운 합쇼체로 옮기되, 단순 행위 금지보다 ‘그런 사람이 되지 말라’는 품격 있는 경구형 권면을 살렸습니다.
- source_word: πρὸς μὲν τὸ λαβεῖν ἐκτείνων τὰς χεῖρας
  english_pob_choice: stretches out his hands to receive
  chosen_korean: 받으려고 손을 내미는
  alternatives_korean:
  - 받기 위해 손을 뻗는
  - 받으려 손을 펴는
  lexicon: ἐκτείνω τὰς χεῖρας
  rationale: 직역보다 한국어 관용에 맞는 ‘손을 내미는’으로 손의 동작을 살렸고, 목적구는 ‘받으려고’로 간결하게 처리했습니다.
- source_word: πρὸς δὲ τὸ δοῦναι συσπῶν
  english_pob_choice: draws them in to avoid giving
  chosen_korean: 주려고는 손을 거두는
  alternatives_korean:
  - 주기 싫어 손을 거두는
  - 주는 일을 피하려 손을 움츠리는
  lexicon: συσπάω
  rationale: συσπῶν의 핵심은 단순히 ‘당기다’가 아니라 베풂을 향해 손을 거두는 태도이므로, POB의 최신 보정처럼 ‘avoid giving’의 대비를 한국어로 드러냈습니다.
theological_decisions:
- issue: 수혜와 나눔의 대비를 단순 동작 묘사가 아니라 اخلاق적 권면으로 옮길지 여부
  chosen_reading: 이 절은 손동작 자체보다 인색함을 경계하는 도덕적 대비를 드러내는 것으로 번역했습니다.
  alternative_readings:
  - 손을 내미는 자가 되지 말고, 주는 자가 되지 마십시오
  - 받을 때는 손을 내밀고, 줄 때는 손을 거두지 마십시오
  rationale: 그리스어 구조와 POB의 수정 이력은 ‘받기 위해 내밀고, 주기를 피하려 거두는’ 대비를 의도합니다. 이를 한국어에서도 행위의 반대가 아니라 태도의 위선을 겨냥한 권면으로 표현했습니다.
  doctrine_reference: 기독교 윤리의 자선과 관용에 관한 권면
- issue: 직설적 문장과 경구적 톤의 유지
  chosen_reading: 짧고 대구적인 문장을 유지해 구전 교훈의 리듬을 살렸습니다.
  alternative_readings:
  - 더 설명적인 문장으로 풀어 쓰기
  - 문장을 두 절로 나누어 해설적으로 번역하기
  rationale: 디다케의 교훈체 성격상 압축된 대구가 중요하므로, 해설을 늘리기보다 원문의 경구성을 보존했습니다.
  doctrine_reference: 교훈문학의 수사적 형식
