  verdict: revise
  source_fidelity: 그리스어는 하나의 금지 명령(Μὴ γίνου) 아래 ‘받기 위해서는 손을 내밀고, 주기와 관련해서는 손을 거두는’ 사람을 묘사합니다. 초안은 핵심 대비를 충실히 전달하지만, ‘주려고는 손을 거두는’은 한국어에서 ‘주기 위해 손을 거둔다’는 목적 관계로도 읽힐 수 있습니다.
  naturalness: ‘받으려고 손을 내미는 자는 되지 말고, 주려고는 손을 거두는 자가 되지 마십시오’는 금지 표현을 둘로 나누어 다소 무겁고, 후반의 목적 표현이 어색합니다. 하나의 ‘사람이 되지 마십시오’로 묶고 ‘주려고 할 때에는’으로 풀면 현대 한국어 합쇼체에서 자연스럽고 대구도 유지됩니다.
  terminology: ‘손을 내밀다’와 ‘손을 거두다’는 각각 ἐκτείνω와 συσπάω의 비유적 동작을 적절히 반영합니다. 별도의 신학 용어 문제는 없습니다.
  issues:
  - severity: medium
    issue: ‘주려고는 손을 거두는’의 목적 관계가 모호함
    rationale: πρὸς τὸ δοῦναι는 ‘주는 일에 관하여/줄 때’를 대조하는 구문입니다. 한국어의 ‘주려고’는 통상 ‘주기 위해’라는 목적을 나타내므로, 손을 거두는 행동의 목적이 주는 것이라는 역설적 독해를 낳을 수 있습니다.
  - severity: low
