source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπὸ τοῦ υἱοῦ σου ἢ ἀπὸ τῆς θυγατρός σου, ἀλλὰ ἀπὸ νεότητος διδάξεις τὸν φόβον τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/009.yaml
  text: You shall not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God.
translation:
  language: ko
  text: 당신의 아들이나 딸에게서 손을 거두지 말고, 어릴 때부터 그들에게 하나님을 두려워함을 가르치십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἀρεῖς τὴν χεῖρά σου ἀπὸ
  english_pob_choice: You shall not take your hand away from
  chosen_korean: 네 손을 … 거두지 말고
  alternatives_korean:
  - 네 손을 … 빼지 말고
  - 네 손을 … 거두지 마십시오
  lexicon: ἀίρω
  rationale: 여기서 ‘손을 거두다’는 보호와 돌봄을 멈추지 말라는 비유를 자연스럽게 살리면서도, 원문의 ‘거두다/떼다’ 의미를 유지합니다.
- source_word: υἱοῦ / θυγατρός
  english_pob_choice: your son or from your daughter
  chosen_korean: 네 아들에게서나 네 딸에게서
  alternatives_korean:
  - 네 아들로부터나 네 딸로부터
  - 네 자녀에게서
  lexicon: υἱός / θυγάτηρ
  rationale: 원문이 아들과 딸을 각각 병렬로 제시하므로, 포괄적인 ‘자녀’보다 개별 병렬 구조를 보존했습니다.
- source_word: ἀπὸ νεότητος
  english_pob_choice: from youth
  chosen_korean: 어릴 때부터
  alternatives_korean:
  - 청년기부터
  - 젊을 때부터
  lexicon: νεότης
  rationale: 문맥상 교육의 시작 시점을 가리키므로, 한국어에서는 시간의 시작을 드러내는 ‘어릴 때부터’가 가장 자연스럽습니다.
- source_word: τὸν φόβον τοῦ Θεοῦ
  english_pob_choice: the fear of God
  chosen_korean: 하나님의 두려움
  alternatives_korean:
  - 하나님을 두려워함
  - 하나님 경외
  lexicon: φόβος τοῦ Θεοῦ
  rationale: 원문의 직접적 표현인 ‘하나님의 두려움’을 보존해 경외의 의미를 약화하지 않았습니다. POB의 ‘fear of God’에 대응하되, 전통적 완화 표현인 ‘경외’는 택하지 않았습니다.
theological_decisions:
- issue: 신앙 교육의 대상과 시작 시점
  chosen_reading: 부모가 자녀에게 하나님의 두려움을 어릴 때부터 가르쳐야 한다는 직접적 권면으로 옮겼습니다.
  alternative_readings:
  - 일반적 도덕 교육 권면
  - 공동체 전체의 종교 교육 지침
  rationale: 원문은 아들과 딸을 특정하고 ‘어릴 때부터’라는 시작 시점을 명시하므로, 가정 내 조기 신앙 교육의 실천성을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 신명기 6:7과 유사한 가정 교육의 책임
