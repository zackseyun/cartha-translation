id: DID.4.13
reference: Didache 4:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐ μὴ ἐγκαταλίπῃς ἐντολὰς Κυρίου, φυλάξεις δὲ ἃ παρέλαβες, μήτε προστιθεὶς μήτε ἀφαιρῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/013.yaml
  text: You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away.
translation:
  language: ko
  text: 주님의 계명들을 결코 버리지 마십시오. 오히려 여러분이 받은 것을 지키고, 더하지도 빼지도 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μὴ ἐγκαταλίπῃς
  english_pob_choice: You shall never forsake
  chosen_korean: 결코 버리지 마십시오
  alternatives_korean:
  - 결코 저버리지 마십시오
  - 절대로 떠나지 마십시오
  lexicon: ἐγκαταλείπω
  rationale: 부정어 조합이 강한 금지를 나타내므로, 단순한 ‘떠나다’보다 관계적·언약적 뉘앙스를 살리는 ‘버리다’가 더 자연스럽고 직접적입니다.
- source_word: ἐντολὰς Κυρίου
  english_pob_choice: the commandments of the Lord
  chosen_korean: 주님의 계명들
  alternatives_korean:
  - 주님의 명령들
  - 주님의 계명
  lexicon: ἐντολή; κύριος
  rationale: 복수형을 반영해 ‘계명들’로 옮기고, κύριος는 여기서 주님으로 번역해 한국어 성경 독법과 소리값을 함께 살렸습니다.
- source_word: φυλάξεις δὲ ἃ παρέλαβες
  english_pob_choice: but you shall keep what you received
  chosen_korean: 오히려 여러분이 받은 것을 지키고
  alternatives_korean:
  - 그러나 여러분이 받은 것을 지키고
  - 여러분이 받아들인 것을 지키고
  lexicon: φυλάσσω; παραλαμβάνω
  rationale: ‘지키다’는 단순 보관보다 받은 가르침을 충실히 보존한다는 뜻을 자연스럽게 드러내며, ‘받은 것’은 전승된 내용을 과도하게 풀지 않고 유지합니다.
- source_word: μήτε προστιθεὶς μήτε ἀφαιρῶν
  english_pob_choice: neither adding nor taking away
  chosen_korean: 더하지도 빼지도 마십시오
  alternatives_korean:
  - 더하지도 덜하지도 마십시오
  - 더하는 일도 빼는 일도 하지 마십시오
  lexicon: προστίθημι; ἀφαιρέω
  rationale: 원문의 대구를 간결하게 살려, 금지의 범위를 명확히 드러내는 표준적인 한국어 표현으로 정리했습니다.
theological_decisions:
- issue: 강한 부정명령의 톤
  chosen_reading: ‘결코 … 마십시오’와 ‘오히려 … 마십시오’로 두 금지와 권면의 대비를 분명히 했습니다.
  alternative_readings:
  - ‘반드시 … 하지 마십시오’
  - ‘…하지 말고 … 하십시오’
  rationale: Οὐ μὴ의 강한 부정을 한국어에서 가장 자연스럽게 전달하려면 단순 금지보다 강화된 금지 표현이 필요합니다.
  doctrine_reference: Didache의 교훈문체와 수신자에 대한 윤리적 권면
