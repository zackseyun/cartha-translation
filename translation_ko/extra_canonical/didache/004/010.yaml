id: DID.4.10
reference: Didache 4:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Οὐκ ἐπιτάξεις δούλῳ σου ἢ παιδίσκῃ, τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν, ἐν πικρίᾳ σου, μήποτε οὐ μὴ φοβηθήσονται τὸν ἐπ᾽ ἀμφοτέροις Θεόν· οὐ γὰρ ἔρχεται κατὰ πρόσωπον καλέσαι, ἀλλ᾽ ἐφ᾽ οὓς τὸ πνεῦμα ἡτοίμασεν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/010.yaml
  text: You shall not[a], in your bitterness, command your slave or female slave who hope in the same God, lest they should fail to fear the God who is over both; for he does not come to call according to outward standing, but upon those whom the Spirit has prepared.
  footnotes:
  - marker: a
    text: Or 'You shall not command your slave or your female slave in your bitterness—they who hope in the same God—'.
    reason: previous_rendering
translation:
  language: ko
  text: 같은 하나님께 소망을 두는 당신의 종이나 여종에게 쓰라린 마음으로 명령하지 마십시오. 그들이 양쪽 모두 위에 계신 하나님을 두려워하지 않게 될까 염려되기 때문입니다. 하나님께서는 겉모습을 따라 부르러 오시는 것이 아니라, 영이 준비한 이들에게 오십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 종이나 여종에게 명령하지 마십시오. 곧 같은 하나님께 소망을 두는 이들에게, 쓰라린 마음으로.’
    reason: 원문의 어순에 따라 ‘쓰라린 마음으로’와 ‘같은 하나님께 소망을 두는’의 수식 위치를 달리 옮길 수 있습니다.
lexical_decisions:
- source_word: δούλῳ σου ἢ παιδίσκῃ
  english_pob_choice: your slave or female slave
  chosen_korean: 당신의 종이나 여종
  alternatives_korean:
  - 당신의 노예나 여자종
  - 당신의 종 또는 여종
  lexicon: δοῦλος / παιδίσκη
  rationale: 영어 POB의 slave를 한국어에서 가장 직접적으로 옮기면 노예이지만, 본문이 주인의 권위 남용을 경계하는 훈계문맥이므로 관계적 종속을 드러내는 종/여종을 택했고, 여성형 παιδίσκη는 여종으로 대응했습니다.
- source_word: ἐν πικρίᾳ σου
  english_pob_choice: in your bitterness
  chosen_korean: 당신의 쓰라림 속에서
  alternatives_korean:
  - 당신의 비통함 속에서
  - 당신의 쓰디쓴 마음으로
  lexicon: πικρία
  rationale: πικρία는 단순한 기분 나쁨보다 속에서 우러나는 쓰라림·비통함을 가리키므로, 행위의 동기를 드러내는 부사구로 자연스럽게 옮겼습니다.
- source_word: τοῖς ἐπὶ τὸν αὐτὸν Θεὸν ἐλπίζουσιν
  english_pob_choice: who hope in the same God
  chosen_korean: 같은 하나님께 소망을 두는
  alternatives_korean:
  - 같은 하나님을 바라는
  - 같은 하나님께 희망을 두는
  lexicon: ἐλπίζω / Θεός
  rationale: ἐλπίζουσιν은 단순한 기대보다 지속적 소망을 뜻하므로 소망을 두는으로 옮겼고, Θεός는 본문 관례에 따라 하나님으로 유지했습니다.
- source_word: κατὰ πρόσωπον καλέσαι
  english_pob_choice: to call according to outward standing
  chosen_korean: 외적인 신분에 따라 부르러 오시는
  alternatives_korean:
  - 겉모습에 따라 부르러 오시는
  - 사람의 겉모양을 보고 부르시는
  lexicon: πρόσωπον / καλέω
  rationale: κατὰ πρόσωπον은 겉보기의 지위·체면을 뜻하므로 외적인 신분으로 풀어 의미를 드러냈고, καλέσαι는 문맥상 부르다/초대하다의 목적 의미를 살렸습니다.
theological_decisions:
- issue: 하나님께 대한 경외의 동기와 부르심의 보편성
  chosen_reading: 그분은 외적인 신분을 기준으로 사람을 부르지 않으시며, 준비된 이들에게 오십니다.
  alternative_readings:
  - 그분은 외모를 따라 부르지 않으시며, 영이 준비한 이들에게 오십니다.
  - 그분은 사람의 체면을 따라 부르지 않으시며, 성령이 준비한 이들에게 오십니다.
  rationale: 본문의 결론은 하나님이 사회적 지위가 아니라 영적 준비를 기준으로 부르신다는 점을 강조하므로, 이를 평이하게 드러내되 원문의 긴장을 유지했습니다.
  doctrine_reference: 하나님의 편무성 없는 부르심, 공동체 내 지위 질서의 상대화
- issue: τὸ πνεῦμα ἡτοίμασεν의 주체성
  chosen_reading: 영이 준비하신
  alternative_readings:
  - 성령이 준비하신
  - 영이 준비한
  rationale: 원문은 τὸ πνεῦμα를 주어로 두므로 인칭을 분명히 살렸고, 문맥상 신적 영으로 이해될 여지가 있으나 명시적 성령 표지는 약해 영으로 옮겼습니다.
  doctrine_reference: 성령/영의 주체적 준비 사역
