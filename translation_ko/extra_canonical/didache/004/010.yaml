review_pass:
  verdict: revise
  source_fidelity: The draft generally conveys the injunction and the shared relation to God, but its rendering of ἐπ᾽ ἀμφοτέροις as “두 사람 위에” is unnatural and potentially unclear. “외적인 신분” narrows κατὰ πρόσωπον beyond its more basic sense of outward appearance/face. The final contrast is better retained with God’s coming to those whom the Spirit has prepared.
  naturalness: “당신의 쓰라림 속에서” and “명령해서는 안 됩니다” are understandable but less idiomatic and less direct than a formal exhortation using “쓰라린 마음으로 … 명령하지 마십시오.” The revised wording is modern formal-polite Korean and reads coherently.
  terminology: “종이나 여종,” “하나님,” and “영” are suitable. “영” appropriately preserves the Greek’s wording without specifying “성령.” “겉모습을 따라” preserves πρόσωπον without importing a specific social-status interpretation.
  issues:
  - severity: medium
    issue: “외적인 신분” restricts κατὰ πρόσωπον to social standing.
    rationale: The Greek expression literally concerns face/outward appearance and can include, but does not specifically state, social status. “겉모습을 따라” is more source-faithful and preserves the expression’s breadth.
  - severity: medium
    issue: “두 사람 위에 계신 하나님” is awkward and leaves the two parties unclear.
    rationale: ἀμφοτέροις refers to both parties under God’s authority. “양쪽 모두 위에 계신 하나님” is natural Korean while retaining the relational scope.
  - severity: low
    issue: The footnote’s Korean alternative is syntactically incomplete and its dash placement is unnatural.
    rationale: The alternative must be a complete, readable Korean rendering of the alternate placement of the modifying phrases.
