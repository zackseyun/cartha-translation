- from: 당신의 쓰라림 속에서, 같은 하나님께 소망을 두는 당신의 종이나 여종에게 명령해서는 안 됩니다. 그들이 두 사람 위에 계신 하나님을 두려워하지 않게 될까 봐서입니다. 그분은 외적인 신분에 따라 부르러 오시는 것이 아니라, 영이 준비하신 이들에게 오십니다.[a]
  to: 같은 하나님께 소망을 두는 당신의 종이나 여종에게 쓰라린 마음으로 명령하지 마십시오. 그들이 양쪽 모두 위에 계신 하나님을 두려워하지 않게 될까 염려되기 때문입니다. 하나님께서는 겉모습을 따라 부르러 오시는 것이 아니라, 영이 준비한 이들에게 오십니다.[a]
