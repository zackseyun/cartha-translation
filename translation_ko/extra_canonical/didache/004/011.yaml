id: DID.4.11
reference: Didache 4:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ὑμεῖς δὲ οἱ δοῦλοι ὑποτάγησεθε τοῖς κυρίοις ὑμῶν ὡς τύπῳ Θεοῦ ἐν αἰσχύνῃ καὶ φόβῳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/011.yaml
  text: But you slaves shall be subject to your masters as to a representative of God[a], in reverence and fear.
  footnotes:
  - marker: a
    text: Or 'as to a pattern of God'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 너희 종들은 너희 주인들에게 하나님을 대표하는 이에게 하듯이 부끄러움과 두려움 가운데 복종하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 본으로’
    reason: previous_rendering
lexical_decisions:
- source_word: οἱ δοῦλοι
  english_pob_choice: you slaves
  chosen_korean: 너희 종들
  alternatives_korean:
  - 너희 노예들
  - 너희 종들아
  lexicon: δοῦλος
  rationale: 본문의 κοινωνική 관계를 살리되, 한국어에서 직설적이고 현대적인 합쇼체 문맥에 맞게 ‘종들’로 옮겼습니다. POB가 본문을 ‘slaves’로 드러낸 점은 주석으로 보존하되, 한국어 본문은 과도하게 충격적인 용어를 피했습니다.
- source_word: ὑποτάγησεθε
  english_pob_choice: shall be subject
  chosen_korean: 복종하십시오
  alternatives_korean:
  - 복종해야 합니다
  - 종속되십시오
  - 아래에 두십시오
  lexicon: ὑποτάσσω
  rationale: 수동적 ‘subject’보다 관계적·윤리적 요구를 분명히 드러내는 한국어 동사 ‘복종하다’가 본문의 명령성을 가장 자연스럽게 전달합니다.
- source_word: τύπῳ Θεοῦ
  english_pob_choice: a representative of God
  chosen_korean: 하나님을 대표하는 이에게
  alternatives_korean:
  - 하나님의 본으로
  - 하나님의 모범으로
  - 하나님의 유형으로
  lexicon: τύπος
  rationale: 영어 POB의 최신 판단처럼 τύπος는 여기서 추상적 ‘패턴’보다 사람에게 적용되는 ‘대표/표상’의 뜻이 강하므로, 한국어도 인격적 기능을 드러내는 ‘대표하는 이’로 옮겼습니다.
- source_word: ἐν αἰσχύνῃ καὶ φόβῳ
  english_pob_choice: in reverence and fear
  chosen_korean: 부끄러움과 두려움 가운데
  alternatives_korean:
  - 경외와 두려움 가운데
  - 수치와 두려움 가운데
  - 존경과 두려움 가운데
  lexicon: αἰσχύνη, φόβος
  rationale: ἔν + 명사구는 처소적/상태적 표현이므로 ‘가운데’로 살렸고, αἰσχύνη는 문맥상 단순 ‘경외’보다 자기부끄러움의 뉘앙스가 있어 그대로 드러냈습니다.
theological_decisions:
- issue: τύπος Θεοῦ를 어떻게 이해할 것인가
  chosen_reading: 주인은 하나님을 직접 대체하는 존재라기보다, 종이 그 권위를 인식하고 응답해야 하는 하나님의 대표로 제시됩니다.
  alternative_readings:
  - 주인은 하나님의 본(패턴)이다
  - 주인은 하나님을 닮은 모범이다
  rationale: 문맥은 인격적 상관관계와 권위 질서를 요구하며, POB의 수정판도 'pattern'보다 'representative'가 본문의 의도를 더 잘 반영한다고 보았습니다.
  doctrine_reference: 기독교 윤리에서의 권위와 위임된 대표성
