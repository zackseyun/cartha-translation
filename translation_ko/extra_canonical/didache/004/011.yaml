review_pass:
  verdict: revise
  source_fidelity: Ὑμεῖς δὲ οἱ δοῦλοι는 ‘그러나 너희 종들은’으로, ὑποτάγησεθε는 명령의 힘을 지닌 ‘복종하십시오’로 적절히 옮겼습니다. ὡς τύπῳ Θεοῦ는 주인을 하나님의 권위를 나타내는 인물로 보는 용례를 반영하여 ‘하나님을 대표하는 이에게 하듯이’로 번역할 수 있습니다. 다만 ἐν αἰσχύνῃ καὶ φόβῳ의 αἰσχύνη는 ‘경외’가 아니라 수치·부끄러움의 정서를 뜻하므로 이를 보존하되, ‘가운데’보다 자연스러운 방식으로 표현하는 것이 좋습니다.
  naturalness: ‘부끄러움과 두려움 가운데’는 원문의 전치사구를 지나치게 직역하여 한국어에서 다소 부자연스럽습니다. ‘수치심과 두려움으로’는 원문의 정서적·태도적 수반을 자연스럽게 전달합니다. 각주 ‘하나님의 본으로’의 ‘본’은 현대 한국어에서 어색하므로 ‘하나님의 본보기로’가 더 자연스럽습니다.
  terminology: ‘종들’은 δοῦλοι의 역사적 사회적 지위를 완전히 현대화하지 않으면서 한국어 성서 문체에도 맞는 선택입니다. ‘하나님을 대표하는 이’는 여기서 τύπος의 인격적 대표·표상 의미를 드러내며, 주인이 하나님 자신이라는 동일시를 피합니다.
  issues:
  - severity: low
    issue: ἐν αἰσχύνῃ καὶ φόβῳ의 번역이 다소 직역투입니다.
    rationale: ‘부끄러움과 두려움 가운데’도 의미는 전달하지만 현대 한국어로는 어색합니다. ‘수치심과 두려움으로’가 αἰσχύνη의 의미와 ἐν의 태도적 용법을 더 자연스럽게 살립니다.
  - severity: low
    issue: 각주의 ‘하나님의 본으로’가 현대어로 부자연스럽습니다.
    rationale: τύπος의 대안적 ‘pattern’ 이해를 보존하되, 현대 표준어에서는 ‘하나님의 본보기로’가 더 명료합니다.
  revised_text: 그러나 너희 종들은 너희 주인들에게 하나님을 대표하는 이에게 하듯이 수치심과 두려움으로 복종하십시오.[a]
