  to: 그러나 너희 종들은 너희 주인들에게 하나님을 대표하는 이에게 하듯이 수치심과 두려움으로 복종하십시오.[a]
  rationale: 본문의 주된 번역은 영어 POB의 최신 어휘 판단 및 이 구절에서의 τύπος의 인격적 용례를 따라 유지했습니다. 다만 αἰσχύνη의 ‘수치심’ 의미를 더 분명하고 자연스럽게 표현하고, 대안 번역 각주를 현대어로 다듬었습니다.
