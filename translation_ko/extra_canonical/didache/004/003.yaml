  text: Οὐ ποιήσεις σχίσμα, εἰρηνεύσεις δὲ μαχομένους· κρινεῖς δικαίως, οὐ λήψῃ πρόσωπον ἐλέγξαι ἐπὶ παραπτώμασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004/003.yaml
  text: You shall not cause division[a], but you shall reconcile those who are fighting. You shall judge justly; you shall not show partiality in reproving transgressions.
  footnotes:
  - marker: a
    text: Or 'make a schism'.
    reason: previous_rendering
translation:
  language: ko
  text: 분열을 일으키지 마십시오. 다투는 사람들을 화해시키십시오. 의롭게 판단하고, 죄를 꾸짖을 때에는 사람을 봐주지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분파를 만들지 마십시오’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ποιήσεις σχίσμα
  english_pob_choice: You shall not cause division
  chosen_korean: 분열을 일으키지 마십시오
  alternatives_korean:
  - 분파를 만들지 마십시오
  - 분열을 야기하지 마십시오
  - 분리되지 않게 하십시오
  lexicon: σχίσμα
  rationale: σχίσμα는 초기 그리스도교 맥락에서 공동체 안의 분열·갈라짐을 가리키므로, 후대 교회 용어인 ‘교회 분열/파문’의 무게를 피하고 자연스러운 현대 한국어로 ‘분열을 일으키다’라고 옮겼습니다.
- source_word: εἰρηνεύσεις δὲ μαχομένους
  english_pob_choice: but you shall reconcile those who are fighting
  chosen_korean: 다투는 사람들을 화해시키십시오
  alternatives_korean:
  - 싸우는 사람들을 화해시키십시오
  - 다투는 이들을 평화롭게 하십시오
  - 싸우는 자들을 화목하게 하십시오
  lexicon: εἰρηνεύσεις / μαχομένους
  rationale: 동사형 ‘평화를 이루다’의 결과를 한국어에서 가장 분명히 드러내기 위해 ‘화해시키다’를 택했고, μαχομένους는 현재 싸우는 사람들을 가리키므로 ‘다투는 사람들’로 자연스럽게 옮겼습니다.
- source_word: κρινεῖς δικαίως
  english_pob_choice: You shall judge justly
  chosen_korean: 의롭게 판단하고
  alternatives_korean:
  - 공정하게 판단하고
  - 정의롭게 판단하고
  - 바르게 심판하고
  lexicon: κρινεῖς δικαίως
  rationale: 여기서 δικαίως는 단순한 절차적 공정보다 ‘의롭게’라는 윤리적·판단적 의미가 강하므로, 한국어도 ‘의롭게 판단하다’로 유지했습니다.
- source_word: οὐ λήψῃ πρόσωπον
  english_pob_choice: you shall not show partiality
  chosen_korean: 사람을 봐주지 마십시오
  alternatives_korean:
  - 외모를 보고 판단하지 마십시오
  - 편파적으로 대하지 마십시오
  - 낯을 보아주지 마십시오
  lexicon: πρόσωπον λαμβάνειν
  rationale: 직역의 ‘얼굴/외모를 취하다’는 현대어에서 어색하므로, 의미상 ‘특정 사람을 봐주다, 편들다’에 해당하는 관용적 표현으로 옮겨 편파 금지를 분명히 했습니다.
theological_decisions:
- issue: 갈등 처리와 징계의 어조
  chosen_reading: 화해를 먼저 촉구하면서도, 죄를 꾸짖을 때에는 편파성을 배제하는 두 가지 책임을 함께 살렸습니다.
  alternative_readings:
  - 갈등만 중재하는 권고로 약화하기
  - 꾸짖음을 생략하고 온건한 권면으로 바꾸기
  rationale: 본문은 공동체 평화와 도덕적 책무를 함께 요구하므로, 화해와 책망을 모두 살려 균형을 유지해야 합니다.
  doctrine_reference: 공동체 윤리와 공정한 책무의 병행
