  source_fidelity: 앞의 세 명령은 원문의 의미를 충실히 반영합니다. 다만 οὐ λήψῃ πρόσωπον은 책망의 자리에서 특정 사람을 봐주거나 편들지 말라는 편파 금지이므로, 현행 표현은 ‘관대하게 대하지 말라’는 뜻으로도 들릴 수 있습니다. ‘사람에 따라 차별하지 마십시오’가 이 관용구와 ἐλέγξαι ἐπὶ παραπτώμασιν의 결합을 더 정확히 드러냅니다.
  naturalness: ‘다투는 사람들을 화해시키십시오’, ‘의롭게 판단하십시오’는 현대 표준어 합쇼체로 자연스럽습니다. 마지막 절은 ‘허물에 대하여 책망할 때에는 사람에 따라 차별하지 마십시오’로 하면 의미 관계와 문장 흐름이 분명해집니다.
  terminology: σχίσμα는 ‘분열’로, μαχομένους는 ‘다투는 사람들’로 적절히 옮겼습니다. παραπτώμασιν은 여기서 교리적으로 한정하지 않고 ‘허물’로 옮겨 원문의 일반성을 유지했습니다. πρόσωπον λαμβάνειν은 ‘사람에 따라 차별하다’로 번역하여 편파 금지라는 관용적 의미를 보존했습니다.
