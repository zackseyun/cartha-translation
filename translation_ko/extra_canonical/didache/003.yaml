base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/003.yaml
  text: My child[a], flee from every evil thing, and from everything like it. Do not become quick-tempered, for anger leads to murder; nor jealous, nor quarrelsome, nor hot-headed, for from all these murders are born. My child, do not become lustful[b], for lust leads to sexual immorality;a nor foul-mouthed, nor haughty-eyed, for from all these adulteries are born. My child, do not become an observer of omens, since it leads into idolatry; nor an enchanter, nor an astrologer, nor one who performs purifications, nor even be willing to look upon them; for from all these idolatry is born. My child, do not become a liar, since lying leads to theft; nor money-loving, nor vainglorious, for from all these thefts are born. My child, do not become a grumbler, since it leads to blasphemy;b nor self-willed, nor evil-minded, for from all these blasphemies are born. But be meek, since the meek will inherit the earth.c Become patient and merciful and guileless and quiet and good, and always trembling
    at the words that you have heard. You shall not exalt yourself, nor give bold arrogance to your soul. Your soul shall not be joined with the lofty, but you shall associate with the righteous and humble[d][c]. You shall accept the events that befall you as good,d knowing that apart from God nothing happens.
  footnotes:
  - marker: a
    text: The Greek source text has πορείαν ('journey'), but the context of lust leading to adultery strongly suggests this is a scribal error for the common moral term πορνείαν, 'sexual immorality' or 'fornication'.
    reason: textual_variant
  - marker: b
    text: '''Blasphemy'' here may also carry the broader sense of slander or abusive speech, though the religious force of speech against God suits the context well.'
    reason: lexical_alternative
  - marker: c
    text: A direct quotation from Matthew 5:5, which itself draws on Psalm 37:11.
    reason: cross_reference
  - marker: d
    text: The Greek phrase, `τὰ συμβαίνοντά σοι ἐνεργήματα`, is difficult. `ἐνεργήματα` means 'workings' or 'effects,' suggesting that events are not random but are active operations. The translation 'the events that befall you' captures the main idea of providential circumstances in a more accessible way.
    reason: alternative_reading
translation:
  language: ko
  text: 내 아이야, 모든 악한 것과 그것과 같은 모든 것에서 달아나십시오. 성급하게 화내는 사람이 되지 마십시오. 분노는 살인으로 이끌기 때문입니다. 또 질투하는 사람도, 다투는 사람도, 격한 사람도 되지 마십시오. 이런 것들에서 살인들이 생겨나기 때문입니다. 내 아이야, 욕정을 품는 사람이 되지 마십시오. 욕정은 성적 부정행위로 이끌기 때문입니다[a]. 또 더러운 말을 하는 사람도, 눈이 높은 사람도 되지 마십시오. 이런 것들에서 간음들이 생겨나기 때문입니다. 내 아이야, 점쟁이가 되지 마십시오. 그것은 우상숭배로 이끌기 때문입니다. 또 주술사도, 점성가도, 정화 의식을 행하는 자도 되지 마십시오. 그리고 그것들을 보려고 하지도 마십시오. 이런 것들에서 모든 우상숭배가 생겨나기 때문입니다. 내 아이야, 거짓말쟁이가 되지 마십시오. 거짓말은 도둑질로 이끌기 때문입니다. 또 돈을 사랑하는 사람도, 헛된 자랑을 하는 사람도 되지 마십시오. 이런 것들에서 도둑질들이 생겨나기 때문입니다. 내 아이야, 투덜거리는 사람이 되지 마십시오. 그것은 신성모독으로 이끌기 때문입니다[b]. 또 자기 고집이 센 사람도, 악한 생각을 품는 사람도 되지 마십시오. 이런 것들에서 신성모독들이 생겨나기 때문입니다. 그러나 온유한 사람이 되십시오. 온유한 사람들은 땅을 유업으로 받을 것이기 때문입니다[c]. 오래 참는 사람과 자비로운 사람과 순진한 사람과 조용한 사람과 선한 사람이 되며, 늘 들은 말씀 앞에서 떨며 지내십시오. 자신을 높이지도 말고, 자기 영혼에 대담한 오만을 주지도 마십시오. 당신의 영혼은 높은 사람들과 함께 얽히지 말고, 오히려 의인들과 겸손한 사람들과 어울리십시오. 당신에게 일어나는 일들을 선한 것으로 받아들이십시오[d]. 하나님 없이는 아무 일도 일어나지 않는다는 것을 아십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그리스어 본문에는 πορείαν('여정')이 있지만, 욕정이 간음으로 이어진다는 문맥상 일반적인 도덕 용어 πορνείαν('성적 부정행위')의 필사 오류로 보는 것이 자연스럽습니다.
    reason: textual_variant
  - marker: b
    text: 여기서 '신성모독'은 더 넓게는 험담이나 비방의 뜻을 가질 수도 있지만, 문맥상 하나님을 향한 종교적 모독의 무게가 두드러집니다.
    reason: lexical_alternative
  - marker: c
    text: 마태복음 5:5의 직접 인용으로, 시편 37:11을 배경으로 합니다.
    reason: cross_reference
  - marker: d
    text: 난해한 그리스어 구문 τὰ συμβαίνοντά σοι ἐνεργήματα는 ‘일어나는 일들’로 풀어 옮겼습니다. 여기에는 사건들이 무작위가 아니라 작용하는 일이라는 뉘앙스가 있습니다.
    reason: alternative_reading
