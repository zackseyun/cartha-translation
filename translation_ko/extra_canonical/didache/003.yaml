  rationale: 마술적·종교적 정화 행위를 가리키는 맥락을 보존하면서도, 과도하게 해석하지 않게 했습니다.
- source_word: βλασφημία
  english_pob_choice: blasphemy
  chosen_korean: 신성모독
  alternatives_korean:
