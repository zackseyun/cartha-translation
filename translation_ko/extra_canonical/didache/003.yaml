  lexicon: LSJ
  rationale: 문맥상 하나님을 향한 모독의 종교적 무게가 크므로, 더 직접적인 교회 언어를 택했습니다.
- source_word: πραῢς
  english_pob_choice: meek
  chosen_korean: 온유한
  alternatives_korean:
  - 온순한
  - 겸손한
  lexicon: LSJ
  rationale: 마태복음의 인용과 연결되는 덕목이므로, 성경적 울림이 있는 표준 번역을 유지했습니다.
- source_word: τὰ συμβαίνοντά σοι ἐνεργήματα
  english_pob_choice: the events that befall you
  chosen_korean: 당신에게 일어나는 일들
  alternatives_korean:
  - 당신에게 닥치는 일들
  - 당신에게 생기는 사건들
  lexicon: LSJ
  rationale: 난해한 구문을 자연스럽게 풀되, 사건을 우연이 아닌 ‘일어나는 일’로 받아들이는 흐름을 살렸습니다.
theological_decisions:
- issue: πορείαν의 난독/필사 오류 처리
  chosen_reading: 본문은 실제로 '행로'가 아니라 문맥에 맞는 '성적 부정행위'로 번역하되, 각주로 원문 문제를 밝혔습니다.
  alternative_readings:
  - 여정
  - 길
  rationale: 욕정이 간음으로 이어진다는 인접 문맥상 πορείαν은 의미가 맞지 않으므로, 통상 지적되는 πορνείαν 가능성을 반영했습니다.
  doctrine_reference: 본문 비평과 문맥 일치 원칙
- issue: ἄτερ Θεοῦ οὐδὲν γίνεται의 섭리 진술
  chosen_reading: ‘하나님 없이는 아무 일도 일어나지 않는다’로 옮겨, 섭리의 직접성을 유지했습니다.
  alternative_readings:
  - 하나님의 뜻 밖에서는 아무 일도 일어나지 않는다
  - 하나님 없이 아무것도 이루어지지 않는다
  rationale: 문장이 단순한 도덕훈을 넘어 사건의 궁극적 원인을 하나님께 돌리는 고백이므로, 해석을 약화하지 않았습니다.
  doctrine_reference: 섭리 교리
