  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ προφήτης ἀληθινός, θέλων καθῆσαι πρὸς ὑμᾶς, ἄξιός ἐστι τῆς τροφῆς αὐτοῦ. Ὡσαύτως διδάσκαλος ἀληθινός ἐστιν ἄξιος καὶ αὐτός, ὥσπερ ὁ ἐργάτης, τῆς τροφῆς αὐτοῦ. Πᾶσαν οὖν ἀπαρχὴν γεννημάτων ληνοῦ καὶ ἅλωνος, βοῶν τε καὶ προβάτων λαβὼν δώσεις τοῖς προφήταις· αὐτοὶ γάρ εἰσιν οἱ ἀρχιερεῖς ὑμῶν. Ἐὰν δὲ μὴ ἔχητε προφήτην, δότε τοῖς πτωχοῖς. Ἐὰν σιτιαυτοῖς, τὴν ἀπαρχὴν λαβὼν δὸς κατὰ τὴν ἐντολήν. Ὡσαύτως κεράμιον οἴνου ἢ ἐλαίου ἀνοίξας, τὴν ἀπαρχὴν λαβὼν δὸς τοῖς προφήταις· ἀργυρίου δὲ καὶ ἱματισμοῦ καὶ παντὸς κτήματος λαβὼν τὴν ἀπαρχὴν ὡς ἂν σοὶ δοξῇ, δὸς κατὰ τὴν ἐντολήν.
  language: Greek
  pages:
  - 38
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/013.yaml
  text: But every true prophet who wishes to settle among you is worthy of his food[a]. Likewise a true teacher is himself also worthy, like the worker, of his food. Therefore, taking every firstfruit of the produce of winepress and threshing floor, and of cattle and sheep, you shall give it to the prophets, for they are your high priests. But if you do not have a prophet, give it to the poor. If you make bread,a take the firstfruit and give it according to the commandment. Likewise, when you open a jar of wine or oil, take the firstfruit and give it to the prophets. And of silver and clothing and every possession, take the firstfruit,b as it seems good to you[b], and give it according to the commandment.
  footnotes:
  - marker: a
    text: The normalized source text has the difficult reading Ἐὰν σιτιαυτοῖς. The manuscript reading is likely Ἐὰν σιτίαν ποιῇς, 'If you make a batch of bread.' The translation follows this sense, which fits the context of giving firstfruits from prepared food.
    reason: textual_variant
  - marker: b
    text: '''Firstfruit'' here refers to the first portion of produce or goods set aside and given, echoing biblical firstfruits practice.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 참된 예언자라면, 여러분 가운데에 머물기를 원할 때 자기의 양식을 받을 만합니다. 마찬가지로 참된 교사도, 일꾼과 같이, 자기의 양식을 받을 만합니다. 그러므로 포도즙틀과 타작마당의 모든 첫열매와, 소와 양의 첫몫을 가져다가 예언자들에게 주십시오. 그들은 여러분의 대제사장들입니다. 그러나 예언자가 없으면 가난한 이들에게 주십시오. 빵을 만드실 때는 첫열매를 가져다가 계명대로 주십시오. 마찬가지로 포도주나 기름이 든 항아리를 열 때에도 첫열매를 가져다가 예언자들에게 주십시오. 그리고 은과 옷과 모든 소유에 대해서는, 여러분에게 좋게 여겨지는 대로 첫열매를 가져다가 계명대로 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 정규화된 원문 Ἐὰν σιτιαυτοῖς 는 난해하며, 필사본 읽기 Ἐὰν σιτίαν ποιῇς(‘빵을 만들면’)의 뜻으로 이해하는 것이 문맥에 가장 잘 맞습니다.
    reason: textual_variant
  - marker: b
    text: ‘첫열매’는 여기서 곡물만이 아니라 바쳐 따로 떼어 두는 첫 몫 전체를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: προφήτης ἀληθινός
  english_pob_choice: true prophet
  chosen_korean: 참된 예언자
  alternatives_korean:
  - 진짜 예언자
  - 참 예언자
  lexicon: BDAG
  rationale: ἀληθινός는 단순한 진위를 넘어 참됨/진정성을 띠므로, 문맥상 공동체 안에서 검증된 예언자를 뜻하는 ‘참된 예언자’가 가장 자연스럽습니다.
- source_word: καθῆσαι πρὸς ὑμᾶς
  english_pob_choice: to settle among you
  chosen_korean: 여러분 가운데에 머물기를 원할 때
  alternatives_korean:
  - 여러분 가운데 정착하려 할 때
  - 여러분과 함께 지내려 할 때
  lexicon: LSJ
  rationale: 정주·거주의 지속성을 살리면서, 공동체에 들어와 머무르려는 의향을 한국어로 풀어 옮겼습니다.
- source_word: ἄξιός ἐστι τῆς τροφῆς αὐτοῦ
  english_pob_choice: is worthy of his food
  chosen_korean: 자기의 양식을 받을 만합니다
  alternatives_korean:
  - 자기의 먹을 것을 받을 만합니다
  - 자기의 생계비를 받을 만합니다
  lexicon: BDAG
  rationale: τροφή를 단순한 ‘먹을 것’으로만 좁히지 않되, 문맥의 실제적 생계 지원을 드러내는 ‘양식’으로 옮겼습니다.
- source_word: ἀπαρχή
  english_pob_choice: firstfruit
  chosen_korean: 첫열매 / 첫몫
  alternatives_korean:
  - 첫소출
  - 첫부분
  - 첫수확물
  lexicon: BDAG
  rationale: 본문에서 농산물, 음료, 재산 전반에 반복되므로 제의적 첫부분이라는 공통 의미를 살리기 위해 ‘첫열매’를 기본으로, 소유물에는 자연스럽게 ‘첫몫’을 사용했습니다.
- source_word: ἀρχιερεῖς
  english_pob_choice: high priests
  chosen_korean: 대제사장들
  alternatives_korean:
  - 수제사장들
  - 제사장들
  lexicon: BDAG
  rationale: ἀρχιερεύς의 직함적 강도를 약화시키지 않고, Didache의 대담한 교회론적 비유를 그대로 드러내기 위해 ‘대제사장들’로 옮겼습니다.
- source_word: σιτιαυτοῖς
  english_pob_choice: If you make bread
  chosen_korean: 빵을 만드실 때는
  alternatives_korean:
  - 빵을 만드시면
  - 빵을 준비하실 때는
  lexicon: LSJ
  rationale: 정규화된 OCR이 난해하므로 POB의 주석처럼 ‘빵을 만든다’는 뜻으로 읽어 문맥에 맞게 반영했습니다.
- source_word: ὡς ἂν σοὶ δοξῇ
  english_pob_choice: as it seems good to you
  chosen_korean: 여러분에게 좋게 여겨지는 대로
  alternatives_korean:
  - 여러분이 좋다고 여기는 대로
  - 여러분이 생각하기에 좋은 만큼
  lexicon: BDAG
  rationale: 임의와 재량을 허용하는 표현이므로, 개인의 판단에 맡기는 뉘앙스를 자연스러운 합쇼체로 살렸습니다.
- source_word: κατὰ τὴν ἐντολήν
  english_pob_choice: according to the commandment
  chosen_korean: 계명대로
  alternatives_korean:
  - 명령대로
  - 계명에 따라
  lexicon: BDAG
  rationale: 공동체 규범의 권위성을 유지하면서도 한국어 성경체에서 익숙한 압축형 표현으로 옮겼습니다.
theological_decisions:
- issue: '예언자들의 지위: ‘여러분의 대제사장들’'
  chosen_reading: 직접적인 동일시를 유지해 ‘그들은 여러분의 대제사장들입니다’로 옮겼습니다.
  alternative_readings:
  - 그들은 여러분의 제사장들입니다
  - 그들은 여러분의 대제사장들처럼 여겨집니다
  rationale: 그리스어는 비교가 아니라 동일시(εἰσιν οἱ ἀρχιερεῖς ὑμῶν)를 말하므로, 교회 제도화 이전의 강한 비유를 약화하지 않는 쪽이 본문에 충실합니다.
  doctrine_reference: Ecclesiology, Ministry
- issue: σite? bread provision as ministerial support
  chosen_reading: τροφή를 ‘양식’으로 두어 실제 먹거리와 생계 지원의 둘 다를 포함하게 했습니다.
  alternative_readings:
  - 지원
  - 유지비
  rationale: 본문이 첫열매, 빵, 포도주, 기름, 은과 옷까지 구체적 물품을 나열하므로 추상화보다 물질적 지원의 성격을 드러내는 것이 적절합니다.
  doctrine_reference: Ecclesiology, Stewardship
