lexical_decisions:
- source_word: στραφεὶς
  english_pob_choice: turns aside
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌이켜
  - 벗어나
  lexicon: BDAG
  rationale: 가르침의 방향 전환과 이탈을 함께 드러내기 위해 ‘돌아서서’를 택했습니다.
- source_word: ἀλλήν διδαχήν
  english_pob_choice: another teaching
  chosen_korean: 다른 가르침
  alternatives_korean:
  - 다른 교훈
  - 별도의 가르침
  lexicon: BDAG
  rationale: δήγμα이 아니라 가르침 내용 자체의 변경이므로 자연스러운 ‘다른 가르침’이 적절합니다.
- source_word: πνεῦμα / ἐν πνεύματι
  english_pob_choice: in the Spirit
  chosen_korean: 영 안에서
  alternatives_korean:
  - 성령 안에서
  - 영으로
  lexicon: BDAG
  rationale: 본문은 예언적 발화를 가리키지만 여기서 직접적으로 성령을 명시하지 않으므로, POB 기본값에 따라 ‘영’을 유지하되 문맥상 장엄한 표현으로 옮겼습니다.
- source_word: κοσμικὸν
  english_pob_choice: earthly
  chosen_korean: 세상적
  alternatives_korean:
  - 세속적인
  - 이 세상의
  - 세상 속의
  lexicon: LSJ
  rationale: 영어 POB의 ‘earthly’가 피하려는 도덕적 뉘앙스를 반영하면서, κοσμικός의 ‘세상/세계에 속한’ 의미를 한국어로 가장 무난하게 드러냅니다.
theological_decisions:
- issue: 예언자 시험 금지와 판단 금지의 범위
  chosen_reading: 영 안에서 말하는 예언적 발화 자체는 시험하거나 판단하지 말되, 이후의 ‘길들’로 진위를 분별하는 긴장을 그대로 살렸습니다.
  alternative_readings:
  - 예언은 전면적으로 검증하지 않는다는 뜻으로 완화
  - 모든 분별 자체를 금지하는 뜻으로 읽음
  rationale: 본문은 즉시 이어서 예언자의 삶과 방식으로 분별하라고 하므로, 분별 금지를 절대화하면 문맥과 충돌합니다.
  doctrine_reference: 예언 분별
- issue: μυστήριον κοσμικὸν ἐκκλησίας
  chosen_reading: ‘교회의 세상적 비밀’로 옮겨, 표현의 난해함을 유지했습니다.
  alternative_readings:
  - 교회의 세상 속 비밀
  - 교회의 세상에 속한 비밀
  rationale: 원문 자체가 난해하므로 과도한 해석을 넣지 않고, POB의 해석 방향을 한국어로 보존했습니다.
  doctrine_reference: 교회론
