base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/004.yaml
  text: My child[a], remember night and day the one who speaks to you the word of God, and you shall honor him as the Lord; for where lordship is spoken of, there the Lord is. And you shall seek out day by day the faces of the saints, so that you may find rest in their words. You shall not make a schism, but you shall reconcile those who are fighting. You shall judge justly[b]; you shall not show partiality in reproving transgressions. You shall not be double-minded as to whether it will be or not. Do not be one who stretches out his hands to receive, but draws them in to give. If you have anything, through your hands you shall give a ransom for your sins. You shall not hesitate to give, nor grumble when giving; for you will know who is the good repayer of the reward. You shall not turn away from the one in need, but you shall share all things with your brother, and you shall not say they are your own; for if you are sharers in what is immortal, how much more in mortal things? You shall
    not take your hand away from your son or from your daughter, but from youth you shall teach them the fear of God. You shall not command your slave or your female slave in your bitterness—they who hope in the same God—lest they should fail to fear the God who is over both; for he does not come to call according to outward appearance, but upon those whom the Spirit has prepared. But you slaves shall be subject to your masters as to a pattern of God, in reverence and fear. You shall hate all hypocrisy and everything that is not pleasing to the Lord. You shall never forsake the commandments of the Lord, but you shall keep what you received, neither adding nor taking away. In the assembly you shall confess your transgressions, and you shall not come to your prayer with an evil conscience[f][e][d][c]. This is the way of life.
  footnotes:
  - marker: a
    text: Or 'the presence/persons of the saints.' The Greek literally says 'the faces of the saints,' an idiom for seeking their company.
    reason: lexical_alternative
  - marker: b
    text: '''Schism'' preserves the ecclesial sense of a divisive rupture within the community.'
    reason: cultural_note
  - marker: c
    text: The phrase 'a ransom for your sins' reflects early Christian language linking almsgiving with repentance and mercy; the wording is intentionally left strong because the Greek is strong.
    reason: lexical_alternative
  - marker: d
    text: Or 'according to appearance/face'; the point is that God does not act based on social status.
    reason: lexical_alternative
  - marker: e
    text: The Greek αἰσχύνη can mean 'shame,' but in this context of submission alongside 'fear' (φόβος), it carries the positive sense of 'reverence' or 'respect,' avoiding the modern English connotation of disgrace.
    reason: lexical_alternative
  - marker: f
    text: '''In the assembly'' may refer to the gathered church community rather than a building.'
    reason: cultural_note
translation:
  language: ko
  text: 내 자녀여, 밤낮으로 네게 하나님의 말씀을 전하는 이를 기억하고, 그를 주님으로서 존중하십시오. 이는 주권이 언급되는 곳에 주님이 계시기 때문입니다. 또 날마다 성도들의 얼굴을 찾으십시오. 그러면 그들의 말 안에서 쉼을 얻게 될 것입니다. 분열을 일으키지 말고, 다투는 이들을 화해시키십시오. 공정하게 판단하고, 잘못을 책망할 때 편을 들지 마십시오. 있을지 없을지에 대해 두 마음을 품지 마십시오. 받으려고는 손을 내밀면서도 주려고는 손을 거두는 사람이 되지 마십시오. 가진 것이 있으면, 네 손으로 네 죄에 대한 속전을 드리십시오. 주는 것을 주저하지 말고, 주면서 투덜거리지도 마십시오. 상을 잘 갚아 주시는 분이 누구인지 알게 될 것입니다. 궁핍한 이를 외면하지 말고, 형제와는 모든 것을 함께 나누십시오. 그리고 그것들이 자기 것이라고 말하지 마십시오. 불멸의 것에 함께 참여하고 있다면, 썩어질 것들에서는 얼마나 더 그러해야 하겠습니까? 자녀에게서 손을 떼지 말고, 어린 때부터 하나님을 경외하는 법을 가르치십시오. 같은 하나님께 소망을 두는 노예와 여종에게 당신의 쓰디쓴 마음으로 명령하지 마십시오. 두 사람 모두 위에 계신 하나님을 두려워하지 않게 될까 염려해서입니다. 그분은 외모를 따라 부르러 오시는 것이 아니라, 영이 예비하신 이들에게 오십니다. 그러나 너희 노예들은 두려움과 경외 가운데, 하나님을 본받는 본으로서 너희 주인에게 복종하십시오. 모든 위선을 미워하고, 주님께 기쁘지 않은 모든 것을 미워하십시오. 주님의 명령을 결코 버리지 말고, 받은 것을 지키되 더하지도 빼지도 마십시오. 회중 안에서 너희의 허물을 고백하고, 악한 양심을 품은 채 너희의 기도에 나아가지 마십시오. 이것이 생명의 길입니다.[a][b][c][d][e][f]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성도들의 얼굴’은 성도들의 ‘존재/면모’를 가리키는 관용일 수 있습니다. 여기서는 그들의 교제를 찾는다는 뜻을 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘분열’은 공동체 안의 갈라짐이라는 교회적 의미를 보존합니다.
    reason: cultural_note
  - marker: c
    text: ‘속전’은 자선과 회개를 연결하는 초기 기독교의 강한 표현을 그대로 살린 것입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘외모’는 사람의 겉모습이나 사회적 표면을 따라 판단하지 않으신다는 뜻입니다.
    reason: lexical_alternative
  - marker: e
    text: 여기서 αἰσχύνη는 ‘수치’보다 ‘경외/존중’의 뜻이 더 적절합니다.
    reason: lexical_alternative
  - marker: f
    text: ‘회중’은 건물보다 모인 공동체를 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: Τέκνον μου
  english_pob_choice: My child
  chosen_korean: 내 자녀여
  alternatives_korean:
  - 내 아들아
  - 내 아이야
  lexicon: τέκνον
  rationale: 애정 어린 훈계의 호격을 살리되, 성별을 좁히지 않고 현대 한국어에서 자연스러운 직접 호칭으로 옮겼습니다.
- source_word: ἡ κυριότης
  english_pob_choice: lordship
  chosen_korean: 주권
  alternatives_korean:
  - 주되심
  - 통치
  - 주권자 되심
  lexicon: κυριότης
  rationale: 추상명사와 κύριος(주님)의 말장난을 살리면서도 한국어에서 가장 자연스러운 권위·통치 개념으로 옮겼습니다.
- source_word: λύτρωσιν ἁμαρτιῶν σου
  english_pob_choice: a ransom for your sins
  chosen_korean: 네 죄에 대한 속전
  alternatives_korean:
  - 네 죄를 위한 속전
  - 네 죄의 속량
  lexicon: λύτρωσις
  rationale: 알맹이 없는 완화 없이, 자선을 죄와 연결하는 강한 표현을 그대로 보존했습니다.
- source_word: ἐν ἐκκλησίᾳ
  english_pob_choice: in the assembly
  chosen_korean: 회중 안에서
  alternatives_korean:
  - 회중 가운데서
  - 교회 안에서
  lexicon: ἐκκλησία
  rationale: 건물이나 제도보다 모인 공동체의 뜻을 살려, 후대의 교회 제도적 뉘앙스를 덜어냈습니다.
- source_word: κατὰ πρόσωπον
  english_pob_choice: according to outward appearance
  chosen_korean: 외모를 따라
  alternatives_korean:
  - 겉모습을 따라
  - 겉을 보고
  lexicon: πρόσωπον
  rationale: 사람의 겉모습·사회적 표면을 기준으로 하지 않으신다는 뜻을 자연스럽게 담았습니다.
- source_word: αἰσχύνη καὶ φόβος
  english_pob_choice: in reverence and fear
  chosen_korean: 두려움과 경외
  alternatives_korean:
  - 부끄러움과 두려움
  - 경건한 두려움
  lexicon: αἰσχύνη
  rationale: 이 문맥에서는 수치심보다 존중·경외의 뉘앙스가 강하므로, 현대 한국어의 오해를 피했습니다.
theological_decisions:
- issue: 주님께서 말씀을 전하는 이를 어떻게 존중하는가
  chosen_reading: 그 사람을 주님과 동일시하지 않고, 주님의 권위가 드러나는 자리로서 존중하라고 옮겼습니다.
  alternative_readings:
  - 그를 주님처럼 존중하라
  - 그를 주님으로 존중하라
  rationale: 문맥의 설명절이 ‘주권이 언급되는 곳에 주님이 계시다’고 하므로, 존재론적 동일시보다 प्रतिनिध적 권위를 보존하는 쪽이 원문에 가깝습니다.
  doctrine_reference: 원문 우선; 대표성/권위의 긴장 보존
- issue: 노예와 주인의 관계
  chosen_reading: δοῦλοι는 ‘노예’로, 상호의무와 지배 구조를 가리는 완화 없이 번역했습니다.
  alternative_readings:
  - 종
  - 하인
  rationale: 이 대목은 신분의 구속성을 드러내는 것이 중요하므로, 영어 POB의 강한 선택을 따라 사회적 현실을 분명히 했습니다.
  doctrine_reference: 사회사적 의미 보존
