base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/003.yaml
  text: 'For this is what was spoken by the Lord: “In every place and time offer me a pure sacrifice[a], because I am a great King,” says the Lord, “and my name is marvelous among the nations.”'
  footnotes:
  - marker: a
    text: Or 'For this is what was spoken by the Lord:'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 주님께서 말씀하신 바입니다. 「모든 곳과 모든 때에 내게 깨끗한 제사를 드리라. 나는 큰 왕이기 때문이니」라고 주님께서 말씀하십니다. 「그리고 내 이름은 민족들 가운데서 놀랍습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님께서 말씀하신 바입니다:’
    reason: previous_rendering
lexical_decisions:
- source_word: ῥηθεῖσα ὑπὸ Κυρίου
  english_pob_choice: what was spoken by the Lord
  chosen_korean: 주님께서 말씀하신 바
  alternatives_korean:
  - 주님께서 하신 말씀
  - 주님께서 말씀하신 것
  lexicon: ῥηθεῖσα / λέγω
  rationale: 주어-피동 구조를 살려 ‘말씀하신 바’로 옮기면, 앞 절의 여성형 지시어가 가리키는 ‘말씀/진술’이라는 연결이 자연스럽게 드러납니다.
- source_word: θυσίαν καθαράν
  english_pob_choice: a pure sacrifice
  chosen_korean: 깨끗한 제사
  alternatives_korean:
  - 정결한 제사
  - 순수한 희생 제물
  lexicon: θυσία
  rationale: 문맥상 제의적 제사를 가리키므로 ‘제사’로 두고, καθαράν은 예식적·도덕적 함의를 함께 살리는 ‘깨끗한’으로 옮겼습니다.
- source_word: βασιλεὺς μέγας εἰμί
  english_pob_choice: I am a great King
  chosen_korean: 나는 큰 왕이기 때문이니
  alternatives_korean:
  - 나는 위대한 왕이기 때문이니
  - 내가 큰 왕이기 때문이니
  lexicon: βασιλεύς
  rationale: 직접 인용 안에서 이유 절을 자연스럽게 연결하되, 신적 위엄을 담는 ‘큰 왕’으로 직역성을 유지했습니다.
- source_word: τὸ ὄνομά μου θαυμαστὸν ἐν τοῖς ἔθνεσι
  english_pob_choice: my name is marvelous among the nations
  chosen_korean: 내 이름은 민족들 가운데서 놀랍습니다
  alternatives_korean:
  - 내 이름은 나라들 가운데서 놀랍습니다
  - 내 이름은 열방 가운데서 놀랍습니다
  lexicon: ἔθνη
  rationale: ἔθνη는 이 본문에서 이방 민족들을 뜻하므로 ‘민족들’로 옮겨, 종교적 관용구를 과도하게 덧씌우지 않았습니다.
theological_decisions:
- issue: 이 구절의 말하는 주체와 성전/예배적 함의
  chosen_reading: 주님께서 이미 ‘말씀하신 바’로 제시하며, 현재의 깨끗한 제사를 예언 성취로 연결합니다.
  alternative_readings:
  - 단순한 인용 서두로만 읽는 해석
  - 제사의 의미를 일반적 도덕성으로 완화하는 해석
  rationale: 그리스어 지시어와 분사구문이 앞선 제사를 직접 가리키므로, 본문이 의도한 예언적·예전적 연결을 유지했습니다.
  doctrine_reference: Didache의 성찬/예전 이해와 말라기 인용 구조
