id: DID.14.1
reference: Didache 14:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Κατὰ κυριακὴν δὲ Κυρίου συναχθέντες κλάσατε ἄρτον καὶ εὐχαριστήσατε προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν, ὅπως καθαρὰ ἡ θυσία ὑμῶν ᾖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/001.yaml
  text: But on the Lord’s own day, when you have gathered together, break bread and give thanks, having first confessed your transgressions, so that your sacrifice may be pure.
  footnotes:
  - marker: a
    text: Or 'after you have gathered together, break bread and give thanks, after first confessing'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님의 날에 여러분이 함께 모였을 때에는 빵을 떼고, 먼저 여러분의 허물을 고백한 뒤 감사하십시오. 그러면 여러분의 제사가 깨끗할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함께 모인 뒤 빵을 떼고 감사하며, 먼저 고백한 뒤’로 옮길 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Κατὰ κυριακὴν δὲ Κυρίου
  english_pob_choice: on the Lord’s own day
  chosen_korean: 주님의 날
  alternatives_korean:
  - 주일
  - 주님의 날 가운데
  - 주님의 날에
  lexicon: κυριακός / κύριος
  rationale: κυριακὴν Κυρίου는 문자적으로 ‘주님의 날’이며, 교회식 관용어인 ‘주일’보다 원문의 소유·귀속 관계를 더 직접적으로 드러냅니다.
- source_word: συναχθέντες
  english_pob_choice: when you have gathered together
  chosen_korean: 여러분이 함께 모였을 때에는
  alternatives_korean:
  - 모였을 때
  - 함께 모인 뒤
  - 함께 모여
  lexicon: συνάγω
  rationale: 분사 συναχθέντες는 모임의 선행 상황을 나타내므로, 영어 개정처럼 시간 부사절로 옮겨 순서를 살렸습니다.
- source_word: προεξομολογησάμενοι τὰ παραπτώματα ὑμῶν
  english_pob_choice: having first confessed your transgressions
  chosen_korean: 먼저 여러분의 허물을 고백한 뒤
  alternatives_korean:
  - 먼저 여러분의 잘못을 고백한 뒤
  - 먼저 여러분의 범죄를 자백한 뒤
  - 미리 여러분의 허물을 고백하고
  lexicon: προεξομολογέομαι / παράπτωμα
  rationale: παραπτώματα는 ‘허물, 잘못, 범죄’의 폭이 있지만, 여기서는 공동체적 참회 맥락에 맞는 ‘허물’이 가장 자연스럽고 과도하게 법정화하지 않습니다.
- source_word: θυσία
  english_pob_choice: sacrifice
  chosen_korean: 제사
  alternatives_korean:
  - 희생제물
  - 희생
  - 제물
  lexicon: θυσία
  rationale: 문맥상 빵을 떼고 감사하는 예배 행위를 가리키므로, 일반적 ‘희생’보다 예배적·제의적 의미를 살리는 ‘제사’가 적절합니다.
theological_decisions:
- issue: ‘주님의 날’의 표현 유지 여부
  chosen_reading: ‘주일’로 교회 관용어화하지 않고 ‘주님의 날’로 직역했습니다.
  alternative_readings:
  - 주일
  - 주님의 날 가운데
  rationale: 본문은 특정 예배일을 가리키는 전통적 용어보다 주께 속한 날이라는 소유 의미를 강조하므로, 이를 직접 드러내는 번역이 원문 충실도에 더 맞습니다.
  doctrine_reference: 그리스도론적 귀속 표현
- issue: 마지막 절의 ‘제사’ 이해
  chosen_reading: 공동체의 감사와 정결한 회개를 하나의 ‘제사’로 묶어 옮겼습니다.
  alternative_readings:
  - 예배
  - 희생제물
  - 봉헌
  rationale: 원문은 식사 예식과 회개의 순서를 ‘깨끗한 제사’라는 제의적 결론으로 연결하므로, 이를 단순한 ‘예배’보다 더 날카롭게 살리는 것이 문맥상 적절합니다.
  doctrine_reference: 예배의 제의적 언어
