id: DID.14.2
reference: Didache 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πᾶς δὲ ἔχων τὴν ἀμφιβολίαν μετὰ τοῦ ἑταίρου αὐτοῦ μὴ συνελθέτω ὑμῖν, ἕως οὗ διαλλαγῶσιν, ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/014/002.yaml
  text: But let no one who has a dispute with his companion come together with you until they are reconciled, so that your sacrifice may not be defiled.
translation:
  language: ko
  text: 그러나 자기 동료와 다툰 사람이 있거든, 그들이 화해하기 전에는 여러분과 함께 모이지 못하게 하십시오. 그래야 여러분의 제물이 더럽혀지지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχων τὴν ἀμφιβολίαν
  english_pob_choice: who has a dispute
  chosen_korean: 다툰 사람이 있거든
  alternatives_korean:
  - 분쟁이 있는 사람
  - 논쟁을 가진 사람
  - 불화를 품은 사람
  lexicon: ἀμφιβολία
  rationale: 문맥상 단순한 의문이 아니라 동료와의 분쟁·다툼을 가리키므로, 한국어에서는 자연스럽고 의미를 분명히 하는 「다툰 사람」으로 옮겼습니다.
- source_word: μετὰ τοῦ ἑταίρου αὐτοῦ
  english_pob_choice: with his companion
  chosen_korean: 자기 동료와
  alternatives_korean:
  - 자기 साथी와
  - 자기 벗과
  - 자기 동무와
  lexicon: ἑταίρος
  rationale: ἑταίρος는 함께 있는 동료·동반자를 뜻하므로, 현대 문체에서 무난하고 관계성을 드러내는 「동료」를 선택했습니다.
- source_word: μὴ συνελθέτω ὑμῖν
  english_pob_choice: come together with you
  chosen_korean: 여러분과 함께 모이지 못하게 하십시오
  alternatives_korean:
  - 여러분과 함께 모이지 않게 하십시오
  - 여러분에게로 오지 못하게 하십시오
  - 여러분과 함께 모이게 하지 마십시오
  lexicon: συνελθέτω
  rationale: 공동체의 집회 참여를 금하는 뜻이므로, 단순한 방문보다 공동체적 집합을 나타내는 「함께 모이지 못하게 하십시오」로 옮겼습니다.
- source_word: ἕως οὗ διαλλαγῶσιν
  english_pob_choice: until they are reconciled
  chosen_korean: 그들이 화해하기 전에는
  alternatives_korean:
  - 그들이 화해할 때까지
  - 서로 화해하기 전에는
  - 그들이 다시 화목하기 전에는
  lexicon: διαλλαγῶ
  rationale: 관계 회복의 완료를 나타내므로 「화해하다」가 적절하며, 시제·조건을 살려 「전에는」으로 처리했습니다.
- source_word: ἵνα μὴ κοινωθῇ ἡ θυσία ὑμῶν
  english_pob_choice: so that your sacrifice may not be defiled
  chosen_korean: 그래야 여러분의 제물이 더럽혀지지 않을 것입니다
  alternatives_korean:
  - 그래야 여러분의 제물이 속되지 않을 것입니다
  - 그래야 여러분의 제물이 부정해지지 않을 것입니다
  - 그래야 여러분의 제사가 더럽혀지지 않을 것입니다
  lexicon: κοινόω / θυσία
  rationale: κοινωθῇ는 ‘부정하게 되다, 더럽혀지다’의 뜻이므로 제의적 뉘앙스를 살려 「더럽혀지지」로 옮겼고, θυσία는 헌물·제사보다 직역성 있는 「제물」을 택했습니다.
theological_decisions:
- issue: 공동체 예배와 관계 화해의 연결
  chosen_reading: 공동체가 드리는 제물이 관계 분열로 더럽혀질 수 있으므로, 예배 참여 전에 화해를 요구하는 규범으로 읽었습니다.
  alternative_readings:
  - 단순한 도덕 권면
  - 개인적 감정 정리 권고
  rationale: 본문은 집회 금지와 제물의 더러움이라는 공동체-예배적 결과를 직접 연결하므로, 관계 화해를 예배 질서의 필수 조건으로 표현하는 것이 source-direct입니다.
  doctrine_reference: 초대교회 공동체 규율과 예배 정결
- issue: 합쇼체 명령형의 선택
  chosen_reading: 명령형을 현대 공손체로 옮기되, 규범의 강도를 유지하기 위해 「하십시오」를 사용했습니다.
  alternative_readings:
  - 하세요
  - 하십시오요
  rationale: 본문의 금지·명령 톤을 살리면서도 표준적이고 출판 가능한 합쇼체를 유지하기 위한 선택입니다.
  doctrine_reference: 문체 일관성
