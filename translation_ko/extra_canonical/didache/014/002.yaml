revisions:
- from: 그러나 자기 동료와 다툰 사람이 있거든, 그들이 화해하기 전에는 여러분과 함께 모이지 못하게 하십시오. 그래야 여러분의 제물이 더럽혀지지 않을 것입니다.
  to: 또 자기 동료와 분쟁이 있는 사람은 서로 화해할 때까지 여러분과 함께 모이지 않게 하십시오. 그렇게 하여 여러분의 제사가 더럽혀지지 않게 하십시오.
  rationale: 분쟁이 현재 존재한다는 뜻을 ‘분쟁이 있는’으로 보존하고, 화해의 양 당사자를 ‘서로 화해할 때까지’로 명시했습니다. 또한 θυσία를 ‘제사’로 옮겨 공동체의 제의적 의미를 유지했습니다. 원문의 제3인칭 금지 명령은 한국어의 자연스러운 규범적 합쇼체 표현인 ‘모이지 않게 하십시오’로 재현했습니다.
