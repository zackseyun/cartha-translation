    rationale: ἔχων은 ‘분쟁을 가지고 있는/분쟁 상태에 있는’이라는 현재의 상태를 표현합니다.
  - severity: medium
    issue: ‘제물’이 θυσία의 제의 행위 의미를 좁힐 수 있음
    rationale: 본문의 ‘여러분의 θυσία’는 공동체가 드리는 희생제사/예배적 제사를 가리키며, 한국어 ‘제사’가 이를 더 넓고 직접적으로 전달합니다.
  - severity: low
    issue: ‘그러나’의 강한 역접
    rationale: δὲ는 여기서 단순 연결 또는 첨가로 이해하는 편이 안전합니다.
