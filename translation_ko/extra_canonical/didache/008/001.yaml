id: DID.8.1
reference: Didache 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/001.yaml
  text: But let your fasts not be with the hypocrites, for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation.
translation:
  language: ko
  text: 그런데 여러분의 금식은 위선자들과 함께하는 것이 되어서는 안 됩니다. 그들은 주의 둘째 날과 다섯째 날에 금식합니다. 그러나 여러분은 넷째 날과 준비일에 금식하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주간의 둘째 날’은 곧 월요일, ‘다섯째 날’은 목요일, ‘넷째 날’은 수요일을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: νηστεῖαι / νηστεύσατε
  english_pob_choice: fasts / fast
  chosen_korean: 금식
  alternatives_korean:
  - 단식
  - 절식
  lexicon: νηστεύω
  rationale: 의례적 금식 행위를 가리키므로 교회 문맥에서 통용되는 ‘금식’을 유지했습니다.
- source_word: ὑποκριτῶν
  english_pob_choice: the hypocrites
  chosen_korean: 위선자들
  alternatives_korean:
  - 가식하는 사람들
  - 외식하는 사람들
  lexicon: ὑποκριτής
  rationale: 단순한 예절상의 가면보다 종교적 위선을 드러내는 표현이므로, 현대 한국어에서 의미가 분명한 ‘위선자들’로 옮겼습니다.
- source_word: δευτέρα σαββάτων / πέμπτῃ / τετράδα / παρασκευήν
  english_pob_choice: the second day of the week / the fifth / the fourth day / Preparation
  chosen_korean: 주간의 둘째 날 / 다섯째 날 / 넷째 날 / 준비일
  alternatives_korean:
  - 한 주의 둘째 날 / 다섯째 날 / 넷째 날 / 준비일
  - 월요일 / 목요일 / 수요일 / 금요일
  lexicon: temporal expressions and calendrical terms
  rationale: 본문은 유대-기독교적 주간 지칭과 전통적 명칭을 함께 반영하므로, POB의 영어처럼 요일 번호를 살리되 마지막의 παρασκευήν은 관용적으로 ‘준비일’로 유지했습니다.
theological_decisions:
- issue: ‘주의 둘째 날’과 같은 요일 표기 방식
  chosen_reading: 요일의 서수 표기를 그대로 살려 공동체의 금식 규범을 전달했습니다.
  alternative_readings:
  - 월요일/목요일로 풀어 쓰기
  - 현대 달력 기준으로만 재표현하기
  rationale: 원문은 특정 요일을 규정하는 공동체 규범을 전하므로, 문화적 환원을 피하고 문서적 형태를 보존하는 것이 더 직접적입니다.
  doctrine_reference: 초대 교회의 실천 규범과 전승된 예배 관행
- issue: ‘준비일’ 유지
  chosen_reading: παρασκευήν을 단순한 금요일이 아니라 ‘준비일’로 번역했습니다.
  alternative_readings:
  - 금요일
  rationale: 본문의 표현은 요일 이름이면서도 유대적 배경을 지닌 관용어이므로, 배경 의미를 드러내는 ‘준비일’이 더 source-direct합니다.
  doctrine_reference: 유대 절기·안식일 전날을 가리키는 전승 용례
