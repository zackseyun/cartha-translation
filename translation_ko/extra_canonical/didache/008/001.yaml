revisions:
- from: 그런데 여러분의 금식은 위선자들과 함께하는 것이 되어서는 안 됩니다. 그들은 주의 둘째 날과 다섯째 날에 금식합니다. 그러나 여러분은 넷째 날과 준비일에 금식하십시오.[a]
  to: 그러나 여러분은 위선자들과 함께 금식하지 마십시오. 그들은 한 주의 둘째 날과 다섯째 날에 금식합니다. 그러나 여러분은 넷째 날과 준비일에 금식하십시오.[a]
  rationale: 원문의 금지 명령을 직접적인 한국어 명령문으로 옮기고, 오해를 낳는 ‘주의 둘째 날’을 ‘한 주의 둘째 날’로 바로잡았습니다. 요일 서수와 ‘준비일’이라는 원문의 명칭은 보존했으며, 현대 독자를 위한 요일 대응과 준비일의 뜻은 각주로 제시했습니다.
