id: DID.8.2
reference: Didache 8:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008/002.yaml
  text: 'Do not pray like the hypocrites[a], but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages.'
  footnotes:
  - marker: a
    text: Or 'Neither pray as the hypocrites'.
    reason: previous_rendering
translation:
  language: ko
  text: '위선자들처럼 기도하지 마십시오.[a] 오히려 주님께서 자신의 복음에서 명하신 대로 이렇게 기도하십시오.


    “하늘에 계신 우리 아버지,


    아버지의 이름이 거룩히 여김을 받게 하시며,

    아버지의 나라가 오게 하시며,

    아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지게 하소서.


    오늘 우리에게 그날의 양식을 주시고,

    우리의 빚을 용서해 주시되,

    우리가 우리에게 빚진 사람들을 용서하는 것같이 해 주십시오.


    우리를 시험으로 이끌지 마시고,

    오히려 악한 자에게서 건져 주십시오.[b]


    권능과 영광이 영원히 아버지의 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘위선자들처럼 기도하지도 마십시오’.
    reason: Μηδὲ는 앞선 권면과 이어지는 ‘또한/그리고 …하지 말라’의 뉘앙스를 가질 수 있습니다.
  - marker: b
    text: 또는 ‘악에서’.
    reason: τοῦ πονηροῦ는 문맥상 ‘악한 자’로 이해될 수 있으나, ‘악’으로 이해하는 번역도 가능합니다.
lexical_decisions:
- source_word: Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί
  english_pob_choice: Do not pray like the hypocrites
  chosen_korean: 위선자들처럼 기도하지 마십시오
  alternatives_korean:
  - 위선자들처럼 기도하지 마십시오
  - 위선자들처럼 기도하지 말고
  - 위선자들처럼 기도하지도 마십시오
  lexicon: ὑποκριταί → 위선자들
  rationale: ὑποκριταί는 외식하는 종교인을 가리키므로, 한국어에서도 교회 전통어보다 직접적인 의미인 ‘위선자들’을 살렸습니다. 금지문은 합쇼체로 자연스럽게 ‘...하지 마십시오’로 옮겼습니다.
- source_word: ἐν τῷ εὐαγγελίῳ αὐτοῦ
  english_pob_choice: in his gospel
  chosen_korean: 자신의 복음에서
  alternatives_korean:
  - 그의 복음에서
  - 자신의 복음에서
  - 그 복음에서
  lexicon: εὐαγγέλιον → 복음
  rationale: 단순히 ‘복음’으로 옮기되, αὐτοῦ는 주님을 가리키므로 ‘자신의’로 분명히 했습니다. ‘그의’보다 문맥상 주어를 더 또렷하게 드러내는 표현을 택했습니다.
- source_word: ὁ ἐν τῷ οὐρανῷ
  english_pob_choice: Our Father in heaven
  chosen_korean: 하늘에 계신 우리 아버지
  alternatives_korean:
  - 하늘에 계신 우리 아버지
  - 하늘에 계시는 우리 아버지
  - 하늘에 계신 우리의 아버지
  lexicon: οὐρανῷ → 하늘
  rationale: 호칭문으로서 한국어 기도문 어법에 맞게 ‘하늘에 계신 우리 아버지’로 옮겼습니다. ‘계신’은 하나님께 드리는 직접 호칭에 맞는 존칭입니다.
- source_word: ἁγιασθήτω ... ἐλθέτω ... γενηθήτω ...
  english_pob_choice: may your name be made holy / may your kingdom come / may your will be done
  chosen_korean: 아버지의 이름이 거룩하게 되게 하시며 / 아버지의 나라가 오게 하시며 / 아버지의 뜻이 ... 이루어지게 하소서
  alternatives_korean:
  - 거룩하게 되게 하시며
  - 거룩해지게 하시며
  - 거룩하게 하옵소서
  lexicon: ἁγιάζω / βασιλεία / θέλημα
  rationale: 세 개의 청원형 동사를 각각 한국어 청원문으로 풀어, 하나님의 이름·나라·뜻에 대한 연속적 간구를 유지했습니다. ‘거룩하게 되게 하시며’는 수동적 의미를 자연스럽게 살립니다.
- source_word: τὸν ἄρτον ... τὸν ἐπιούσιον
  english_pob_choice: our bread for the day
  chosen_korean: 오늘의 양식
  alternatives_korean:
  - 오늘의 양식
  - 일용할 양식
  - 그날의 양식
  lexicon: ἐπιούσιος → 오늘의 / 양식
  rationale: ἐπιούσιος는 해석이 어려운 단어이지만, POB의 ‘bread for the day’를 반영해 ‘오늘의 양식’으로 옮겼습니다. 전통적 ‘일용할’은 의미는 통하나 현대 한국어에서는 다소 고어적입니다.
- source_word: ὀφειλὴν ... ὀφειλέταις
  english_pob_choice: debt / debtors
  chosen_korean: 빚 / 빚진 사람들
  alternatives_korean:
  - 빚 / 빚진 사람들
  - 채무 / 채무자들
  - 부채 / 빚진 자들
  lexicon: ὀφειλή / ὀφειλέτης → 빚 / 빚진 사람들
  rationale: 본문의 ‘빚’ 이미지를 그대로 살려 죄를 도덕적 추상어로 바꾸지 않았습니다. ‘빚진 사람들’은 관계적 대비를 유지하면서도 현대 한국어로 이해하기 쉽습니다.
- source_word: πειρασμόν
  english_pob_choice: testing
  chosen_korean: 시험
  alternatives_korean:
  - 시험
  - 유혹
  - 시련
  lexicon: πειρασμός → 시험
  rationale: POB의 ‘testing’을 따라, 단순한 유혹보다 더 넓은 의미를 갖는 ‘시험’으로 옮겼습니다. 이 단어는 문맥에 따라 시험·유혹·시련의 폭을 가질 수 있어 지나치게 좁히지 않았습니다.
- source_word: τοῦ πονηροῦ
  english_pob_choice: the evil one
  chosen_korean: 악한 자
  alternatives_korean:
  - 악한 자
  - 악
  - 악한 것
  lexicon: πονηρός → 악한 자
  rationale: τοῦ πονηροῦ는 여기서 인격적 존재를 가리키는 것으로 이해하는 것이 자연스럽기 때문에 ‘악한 자’로 옮겼습니다. 단순 추상명사 ‘악’으로 만들면 본문의 대상을 흐릴 수 있습니다.
theological_decisions:
- issue: 주기도문의 청원형 어조를 한국어 기도문으로 어떻게 유지할 것인가
  chosen_reading: 직설적 명령형보다 하나님께 드리는 청원형 문장(‘...하게 하시며’, ‘...하게 하소서’, ‘...주십시오’)으로 통일했습니다.
  alternative_readings:
  - 명령형 위주의 번역
  - 전통 기도문식 ‘...하옵소서’
  rationale: 그리스어 청원형의 연속성을 살리면서도 현대 합쇼체 기도문으로 자연스럽게 읽히게 하려면 청원형이 가장 적절합니다. 본문 내부의 직접 호소는 존대형으로 처리해 예배적 톤을 유지했습니다.
  doctrine_reference: 기도의 수신자에 대한 경외와 간구의 문법
- issue: ‘악한 자’의 이해
  chosen_reading: 인격적 악의 주체로 읽히는 ‘악한 자’를 본문에 반영했습니다.
  alternative_readings:
  - 추상적 의미의 ‘악’
  - 유혹 자체를 가리키는 표현
  rationale: 그리스어 정관사와 형용사의 결합은 단순 추상이 아니라 대상을 암시할 수 있으며, POB도 이를 ‘the evil one’으로 풀이합니다. 따라서 본문은 인격적 대상을 드러내는 번역을 택했습니다.
  doctrine_reference: 악의 인격화에 대한 성경적 이해
