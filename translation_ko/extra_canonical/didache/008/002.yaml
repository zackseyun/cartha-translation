    rationale: 제시된 그리스어는 ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα만을 포함하며, ‘나라’(βασιλεία)는 송영에 없습니다.
  - severity: medium
    issue: ‘우리가 용서하는 것같이’라는 비교 연결이 누락됨
