  - severity: medium
    issue: τοῦ πονηροῦ의 해석상 대안이 본문 및 각주에서 보존되지 않음
    rationale: 남성형으로 ‘악한 자’라는 번역이 가능하지만, ‘악에서’라는 해석도 오래된 유력한 가능성이므로 교파적으로 단정하지 않도록 각주가 필요합니다.
