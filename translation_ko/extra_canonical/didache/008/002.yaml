  source_fidelity: 수정이 필요합니다. 특히 송영에는 원문에 없는 ‘나라’가 첨가되어 있으며, ὡς καὶ ἡμεῖς ἀφίεμεν의 비교 연결이 현재 번역에서 독립문으로 약화되었습니다. 또한 τοῦ πονηροῦ는 ‘악한 자’와 ‘악’ 사이에 문법적·해석적 여지가 있으므로 각주로 보존하는 것이 적절합니다.
  naturalness: 전반적으로 현대 합쇼체 기도문으로 자연스럽지만, ‘거룩하게 되게 하시며’는 다소 겹친 표현입니다. ‘거룩히 여김을 받게 하시며’가 청원형 수동태를 더 자연스럽게 나타냅니다. ‘왜냐하면’으로 시작하는 송영도 기도문 안에서는 더 간결하게 처리하는 편이 자연스럽습니다.
  terminology: ‘위선자들’, ‘복음’, ‘양식’, ‘빚’, ‘시험’은 적절합니다. τοῦ πονηροῦ의 주석 없는 단정은 피하고 본문은 영어 POB를 따라 ‘악한 자’로 두되 대안을 각주에 제시합니다.
  issues:
  - severity: high
