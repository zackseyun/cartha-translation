id: DID.6.2
reference: Didache 6:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Εἰ μὲν γὰρ δύνασαι βαστάσαι ὅλον τὸν ζυγὸν τοῦ Κυρίου, τέλειος ἔσῃ· εἰ δʼ οὐ δύνασαι, ὃ δύνῃ τοῦτο ποίει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/002.yaml
  text: For if you are able to bear the whole yoke of the Lord, you will be perfect; but if you are not able, do what you can.
translation:
  language: ko
  text: 만일 주님의 온 멍에를 질 수 있다면, 온전하게 될 것입니다. 그러나 그럴 수 없다면, 할 수 있는 것을 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάσαι
  english_pob_choice: to bear
  chosen_korean: 지다
  alternatives_korean:
  - 짊어지다
  - 감당하다
  lexicon: βαστάζω
  rationale: 짐이나 멍에를 ‘bear’하는 뜻을 살려 자연스럽게 ‘지다’로 옮겼습니다. ‘짊어지다’도 가능하지만, 여기서는 명령형과 조건문 흐름에서 간결한 표현이 더 적합합니다.
- source_word: ὅλον τὸν ζυγὸν
  english_pob_choice: the whole yoke
  chosen_korean: 온 멍에
  alternatives_korean:
  - 전체 멍에
  - 모든 멍에
  lexicon: ζυγός
  rationale: ζυγός는 문자적으로 멍에이지만, 비유적으로 ‘전체’라는 뜻을 함께 담아 ‘온 멍에’로 옮겼습니다. POB의 ‘whole yoke’ 의미를 유지하면서 한국어로도 자연스럽게 들리도록 했습니다.
- source_word: τέλειος
  english_pob_choice: perfect
  chosen_korean: 온전해지다
  alternatives_korean:
  - 완전해지다
  - 성숙해지다
  lexicon: τέλειος
  rationale: 도덕적 무결점보다 ‘온전함/완성됨’의 뉘앙스를 반영해 ‘온전해지다’로 번역했습니다. 한국 교회어의 ‘완전하다’보다 문맥상 부담이 적고, 목표 상태를 잘 드러냅니다.
- source_word: ὃ δύνῃ τοῦτο ποίει
  english_pob_choice: do what you can
  chosen_korean: 할 수 있는 만큼 하십시오
  alternatives_korean:
  - 할 수 있는 것을 하십시오
  - 할 수 있는 대로 하십시오
  lexicon: δύναμαι / ποιέω
  rationale: 직역하면 ‘할 수 있는 것을 하라’에 가깝지만, 한국어에서는 관용적으로 ‘할 수 있는 만큼 하십시오’가 가장 자연스럽게 본문의 한계를 인정하는 권면을 전달합니다.
theological_decisions:
- issue: ‘perfect’의 신학적 무게
  chosen_reading: ‘온전해지다’는 윤리적 완결성과 성숙을 함께 열어 두는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘완전해지다’는 무결점의 뉘앙스로 오해될 수 있습니다.
  - ‘성숙해지다’는 텍스트의 종결적 어조를 약화시킬 수 있습니다.
  rationale: Didache의 권면은 수행 가능성에 따라 요구 수준을 조정하면서도 목표를 ‘온전함’으로 제시합니다. 그래서 과도하게 약화하거나 과장하지 않는 표현이 필요합니다.
  doctrine_reference: 성화와 순종의 점진성
