  source_fidelity: 그리스어의 2인칭 단수(δύνασαι, ἔσῃ, δύνῃ, ποίει)에 맞추어 단수 독자에게 하는 권면으로 옮겨야 합니다. 또한 ὃ δύνῃ τοῦτο ποίει는 문자상 ‘할 수 있는 것을 그것을 하라’이므로 ‘할 수 있는 것을 하십시오’가 대상의 범위를 더 직접적으로 보존합니다.
  naturalness: 초안의 합쇼체는 자연스럽지만, ‘여러분’과 단수 동사형이 결합되어 수가 일치하지 않습니다. 한국어에서는 일반적 독자에게 하는 단수 권면에서 주어를 생략하는 편이 자연스럽습니다.
  terminology: ‘주님’, ‘멍에’, ‘온전하게 되다’는 각각 κύριος, ζυγός, τέλειος의 의미와 현대 한국어의 문체에 적절합니다. ‘온전하게 될 것입니다’는 무결점이라는 교리적 의미로 한정하지 않으면서 원문의 상태 진술을 유지합니다.
  issues:
