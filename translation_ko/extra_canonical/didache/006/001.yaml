revisions:
- from: 이 생명의 길에서 아무도 여러분을 그릇된 길로 이끌지 못하게 하십시오. 왜냐하면 그는 하나님과 떨어져서 여러분을 가르치고 있기 때문입니다.[a]
  to: 아무도 이 가르침의 길에서 여러분을 미혹하지 않도록 조심하십시오. 이는 그가 하나님 없이 여러분을 가르치기 때문입니다.
  rationale: 원문의 핵심 명사구 ‘이 가르침의 길’을 그대로 보존하고, πλανήσῃ의 미혹 의미와 παρεκτὸς Θεοῦ의 ‘하나님 없이/apart from God’ 의미를 해석적 확장 없이 반영했습니다. 기존 각주는 원문에 없는 ‘생명’이라는 의역을 설명하므로 삭제했습니다.
