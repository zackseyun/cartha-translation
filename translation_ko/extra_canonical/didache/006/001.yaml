    rationale: ‘생명’에 해당하는 그리스어가 본문에 없으며, 가르침의 길이라는 표현을 특정한 신학적·문맥적 의역으로 바꿉니다.
  - severity: medium
    issue: ‘그릇된 길로’라는 보충 표현
    rationale: πλανάω는 미혹하거나 길을 잃게 한다는 뜻이지만, 본문은 별도의 ‘그릇된 길’을 명시하지 않습니다.
  - severity: medium
    issue: 각주가 본문의 비직역적 변경을 정당화함
    rationale: 각주는 본문 의미를 대체할 수 없으며, 이 경우 원문에 가까운 본문으로 수정하면 각주가 필요하지 않습니다.
  revised_text: 아무도 이 가르침의 길에서 여러분을 미혹하지 않도록 조심하십시오. 이는 그가 하나님 없이 여러분을 가르치기 때문입니다.
