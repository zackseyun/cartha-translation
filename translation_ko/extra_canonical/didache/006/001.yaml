  yaml_path: translation/extra_canonical/didache/006/001.yaml
  text: See that no one leads you astray from this way of the teaching, since he teaches you apart from God.
translation:
  language: ko
  text: 이 생명의 길에서 아무도 여러분을 그릇된 길로 이끌지 못하게 하십시오. 왜냐하면 그는 하나님과 떨어져서 여러분을 가르치고 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 가르침의 길’이 될 수 있으나, 본문 전체의 제자도적 문맥을 반영해 자연스럽게 풀었습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: Ὅρα μή τις σε πλανήσῃ
  english_pob_choice: See that no one leads you astray
  chosen_korean: 아무도 여러분을 그릇된 길로 이끌지 못하게 하십시오
  alternatives_korean:
  - 아무도 여러분을 속이지 못하게 하십시오
  - 아무도 여러분을 미혹하지 못하게 하십시오
  lexicon: πλανάω
  rationale: πλανήσῃ는 단순한 정보 전달보다 ‘올바른 길에서 벗어나게 하다’는 뉘앙스가 강하므로, 문맥상 ‘그릇된 길로 이끌다’가 가장 직접적입니다.
- source_word: ἀπὸ ταύτης τῆς ὁδοῦ τῆς διδαχῆς
  english_pob_choice: from this way of the teaching
  chosen_korean: 이 생명의 길에서
  alternatives_korean:
  - 이 가르침의 길에서
  - 이 교훈의 길에서
  lexicon: ὁδός + διδαχή
  rationale: ‘길’과 ‘가르침’의 결합은 단순한 교리 체계보다 삶의 방식까지 포함하는 표현이므로, 본문의 방향성을 살리되 한국어로는 자연스럽게 풀어 ‘이 생명의 길’로 옮겼습니다.
- source_word: παρεκτὸς Θεοῦ
  english_pob_choice: apart from God
  chosen_korean: 하나님과 떨어져서
  alternatives_korean:
  - 하나님 없이
  - 하나님 바깥에서
  lexicon: παρεκτός + Θεός
  rationale: παρεκτός는 ‘~을 벗어나/떨어져’라는 분리의 의미를 가지므로, ‘하나님과 떨어져서’가 직접적이고 문맥에도 잘 맞습니다.
theological_decisions:
- issue: 『ὁδός τῆς διδαχῆς』의 의미 범위
  chosen_reading: 단순한 교리 목록이 아니라, 제자도를 포함한 삶의 길로 이해했습니다.
  alternative_readings:
  - 교훈 체계
  - 가르침의 도리
  rationale: Didache 전체의 제목적 배경을 고려할 때, 여기서의 ‘길’은 공동체가 따라야 할 실천적 삶의 길을 가리킨다고 보는 것이 자연스럽습니다.
  doctrine_reference: Didache 문맥
- issue: 『παρεκτὸς Θεοῦ』의 신학적 대비
  chosen_reading: ‘하나님과 떨어져서’로 옮겨, 가르침의 정당성이 하나님과의 연관성에서 온다는 점을 살렸습니다.
  alternative_readings:
  - 하나님 없이
  - 하나님을 떠나서
  rationale: 본문은 어떤 가르침이 하나님과 분리될 때 위험하다는 경고이므로, 단순한 무신론적 상태보다 관계적 분리를 드러내는 표현이 더 정확합니다.
  doctrine_reference: Didache 6:1
