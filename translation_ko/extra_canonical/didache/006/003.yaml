    rationale: ‘네가’는 비격식 반말 계열인데 문장 종결은 합쇼체 ‘하십시오’이므로, 요구된 현대 공식 합쇼체와 맞지 않습니다.
  - severity: medium
    issue: εἰδωλόθυτον의 지시 대상이 불명확함
    rationale: ‘우상에게 바쳐진 것’도 가능한 직역이지만, 음식에 관한 문맥과 원문의 명사 뜻을 따라 ‘우상에게 바쳐진 음식’으로 명시하는 것이 자연스럽고 정확합니다.
  - severity: medium
    issue: ‘죽은 신들의 예배’의 한국어 의미가 모호함
    rationale: 이 표현은 죽은 신들이 드리는 예배처럼도 읽힐 수 있습니다. 문맥상 λατρεία는 죽은 신들을 향한 예배 행위를 뜻하므로 목적 관계를 밝혀야 합니다.
