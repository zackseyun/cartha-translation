  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 εἰδωλόθυτον은 문맥상 우상에게 바쳐진 ‘음식’을 가리키므로 이를 명시하는 편이 정확하며, λατρεία γὰρ ἐστι θεῶν νεκρῶν은 해당 음식을 먹는 일이 죽은 신들을 향한 예배 행위가 된다는 뜻으로 자연스럽게 드러낼 필요가 있습니다.
  naturalness: 초안의 ‘네가’와 ‘하십시오’는 높임 수준이 섞여 있습니다. 또한 ‘죽은 신들의 예배’는 한국어에서 뜻이 모호하고 부자연스러워, 신들을 예배하는 행위임을 밝혀야 합니다.
  terminology: βρῶσις는 ‘음식’, βάστασον은 여기서 ‘감당하십시오’로 유지할 수 있습니다. εἰδωλόθυτον은 ‘우상에게 바쳐진 음식’, λατρεία는 문맥상 ‘예배하는 일’로 옮깁니다.
  issues:
