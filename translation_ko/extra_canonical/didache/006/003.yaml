base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/006/003.yaml
  text: And concerning food, bear what you are able; but be very careful about food sacrificed to idols, for it is the worship of dead gods.
translation:
  language: ko
  text: 그리고 음식에 관해서는, 감당할 수 있는 것은 감당하십시오. 그러나 우상에게 바쳐진 음식은 매우 조심하십시오. 이는 죽은 신들을 예배하는 일이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ τῆς βρώσεως
  english_pob_choice: And concerning food
  chosen_korean: 그리고 음식에 관해서는
  alternatives_korean:
  - 그리고 먹는 것에 관해서는
  - 그리고 음식 문제에 관해서는
  lexicon: βρῶσις
  rationale: βρῶσις를 자연스러운 현대 한국어로 풀되, 본문이 음식 자체와 식사 행위를 모두 아우를 수 있어 가장 무난한 ‘음식에 관해서는’으로 옮겼습니다.
- source_word: ὃ δύνασαι βάστασον
  english_pob_choice: bear what you are able
  chosen_korean: 네가 할 수 있는 만큼은 감당하십시오
  alternatives_korean:
  - 네가 할 수 있는 만큼만 감당하십시오
  - 네가 감당할 수 있는 것은 감당하십시오
  lexicon: δύναμαι / βαστάζω
  rationale: ‘감당하다’는 βαστάζω의 부담을 지다/견디다의 뜻을 한국어로 자연스럽게 전달하며, 할 수 있는 한도라는 의미를 살렸습니다.
- source_word: ἀπὸ δὲ τοῦ εἰδωλοθύτου λίαν πρόσεχε
  english_pob_choice: be very careful about food sacrificed to idols
  chosen_korean: 그러나 우상에게 바쳐진 것에 대해서는 매우 조심하십시오
  alternatives_korean:
  - 그러나 우상 제물은 매우 조심하십시오
  - 그러나 우상에게 바쳐진 음식은 매우 주의하십시오
  lexicon: εἰδωλόθυτον / πρόσεχε
  rationale: εἰδωλόθυτον은 단순한 ‘제물’보다 ‘우상에게 바쳐진 것’이 원뜻에 더 가깝고, πρόσεχε는 ‘조심하십시오’로 경고의 뉘앙스를 살렸습니다.
- source_word: λατρεία γάρ ἐστι θεῶν νεκρῶν
  english_pob_choice: for it is the worship of dead gods
  chosen_korean: 그것은 죽은 신들의 예배이기 때문입니다
  alternatives_korean:
  - 그것은 죽은 신들에게 드리는 예배이기 때문입니다
  - 그것은 죽은 신들의 섬김이기 때문입니다
  lexicon: λατρεία / θεῶν νεκρῶν
  rationale: λατρεία는 단순한 종교행위보다 예배로 옮기는 것이 문맥에 맞고, θεῶν νεκρῶν은 ‘죽은 신들’이라는 직설적 표현을 유지했습니다.
theological_decisions:
- issue: 우상 숭배의 실체를 어떻게 표현할 것인가
  chosen_reading: ‘죽은 신들의 예배’로 직역적 긴장을 유지했습니다.
  alternative_readings:
  - ‘죽은 신들에게 드리는 예배’
  - ‘죽은 신들을 섬기는 일’
  rationale: 본문은 우상에 바쳐진 음식의 문제를 단순한 종교적 금기가 아니라, 생명이 없는 존재를 향한 예배로 규정하므로 그 직설성을 약화하지 않았습니다.
  doctrine_reference: 초대교회 우상 숭배 경계; 신상과 실재 없는 신들의 무력함에 대한 고전적 기독교 이해
