revisions:
- from: 자주 모여서 여러분의 영혼에 합당한 것들을 구하십시오. 여러분의 믿음의 온 기간도 마지막 때에 완성되지 않으면 여러분에게 유익이 없을 것입니다.[a][b]
  to: 자주 모여 여러분의 영혼에 필요한 것들을[a] 구하십시오. 마지막 때에 온전하게 되지 않으면[b] 여러분 믿음의 전 기간이 여러분에게 유익이 없을 것입니다.
  rationale: ‘필요한 것들’은 ἀνήκοντα의 문맥상 의미를 더 자연스러운 현대 한국어로 전달합니다. ‘온전하게 되다’는 τελειωθῆτε의 수동성과 종말론적 완결의 뜻을 보존하면서 사람들에게 적용되는 한국어 표현으로 매끄럽습니다. 문장 주어를 명확히 하고, 각주를 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:13Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 τὰ ἀνήκοντα는 ‘영혼에 합당한 것들’보다 ‘영혼에 필요한 것들’로 옮길 때 한국어에서 더 자연스럽고, 본문의 권면적 의미도 더 분명합니다. ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν은 ‘믿음의 온 기간도’보다 주어를 명확히 한 ‘믿음의 전 기간이’가 적절합니다.
  naturalness: 합쇼체와 문장 흐름은 전반적으로 적절합니다. 그러나 ‘여러분의 믿음의 온 기간도’는 조사 ‘도’가 대조 대상을 전제하는 듯하여 다소 부자연스럽습니다. 또한 각주 표지는 해당 어구 바로 뒤에 두는 편이 독자의 이해와 주석 연결에 더 정확합니다.
  terminology: ψυχαῖς는 문맥상 ‘영혼’이 적절하며, ‘생명’은 가능한 넓은 대안으로 각주에 유지할 수 있습니다. τελειωθῆτε는 수동적이고 종말론적 맥락을 지니므로 ‘온전하게 되지 않으면’이 ‘완성되지 않으면’보다 사람들에게 적용되는 표현으로 자연스럽고 원문의 의미 범위를 잘 보존합니다. ‘마지막 때’는 ἐν τῷ ἐσχάτῳ καιρῷ에 적절합니다.
  issues:
  - severity: medium
    issue: τὰ ἀνήκοντα의 한국어 표현
    rationale: ‘영혼에 합당한 것들’도 직역으로는 가능하지만, 한국어에서는 무엇이 영혼에 ‘합당하다’고 말하는 방식이 다소 어색합니다. 이 문맥에서 ‘영혼에 필요한 것들’은 ἀνήκοντα의 관련성·마땅함을 자연스럽게 전달합니다.
  - severity: low
    issue: ‘믿음의 온 기간도’의 조사와 문장 구조
    rationale: 원문 주어 ὁ πᾶς χρόνος를 ‘믿음의 전 기간이’로 분명히 제시해야 조건절 뒤의 ‘여러분에게 유익이 없을 것입니다’와 자연스럽게 연결됩니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: a는 ψυχαῖς의 대안 번역을, b는 τελειωθῆτε의 대안 번역을 설명하므로 각각 해당 표현 바로 뒤에 배치해야 합니다.
  revised_text: 자주 모여 여러분의 영혼에 필요한 것들을[a] 구하십시오. 마지막 때에 온전하게 되지 않으면[b] 여러분 믿음의 전 기간이 여러분에게 유익이 없을 것입니다.
