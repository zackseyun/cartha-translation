id: DID.16.2
reference: Didache 16:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Πυκνῶς δὲ συναχθήσεσθε ζητοῦντες τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν· οὐ γὰρ ὠφελήσει ὑμᾶς ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν, ἐὰν μὴ ἐν τῷ ἐσχάτῳ καιρῷ τελειωθῆτε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/002.yaml
  text: And gather together often, seeking the things that are fitting for your souls; for the whole time of your faith will not profit you unless you are perfected in the last time.
translation:
  language: ko
  text: 자주 모여 여러분의 영혼에 필요한 것들을[a] 구하십시오. 마지막 때에 온전하게 되지 않으면[b] 여러분 믿음의 전 기간이 여러분에게 유익이 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분의 생명에 필요한 것들”로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “완성되지 않으면”으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Πυκνῶς δὲ συναχθήσεσθε
  english_pob_choice: And gather together often
  chosen_korean: 자주 모여서
  alternatives_korean:
  - 빈번히 함께 모여서
  - 자주 함께 모여서
  lexicon: συνάγω
  rationale: 공동체가 반복적으로 모이는 행동을 간결하게 살리되, 현대 한국어에서 자연스러운 부사+동사 구조로 옮겼습니다.
- source_word: τὰ ἀνήκοντα ταῖς ψυχαῖς ὑμῶν
  english_pob_choice: the things that are fitting for your souls
  chosen_korean: 여러분의 영혼에 합당한 것들
  alternatives_korean:
  - 여러분의 영혼에 맞는 것들
  - 여러분의 영혼에 적절한 것들
  lexicon: ἀνήκω
  rationale: ἀνήκοντα의 ‘마땅한/적합한’ 뜻을 살려, 도덕적·영적 적합성을 드러내는 ‘합당한’으로 옮겼습니다.
- source_word: ὁ πᾶς χρόνος τῆς πίστεως ὑμῶν
  english_pob_choice: the whole time of your faith
  chosen_korean: 여러분의 믿음의 온 기간도
  alternatives_korean:
  - 여러분 믿음의 모든 기간도
  - 여러분의 믿음의 전 기간도
  lexicon: πᾶς χρόνος
  rationale: πᾶς χρόνος를 단순한 ‘시간’보다 지속 전체를 가리키는 표현으로 보고 ‘온 기간’으로 자연스럽게 옮겼습니다.
- source_word: τελειωθῆτε
  english_pob_choice: be perfected
  chosen_korean: 완성되지 않으면
  alternatives_korean:
  - 완전하게 되지 않으면
  - 성숙하게 되지 않으면
  lexicon: τελειόω
  rationale: 문맥상 종말론적 완성의 뉘앙스를 살리되 한국어에서 지나치게 교리화된 표현을 피하면서 ‘완성되다’로 옮겼습니다.
theological_decisions:
- issue: τελειωθῆτε의 종말론적 완성 표현
  chosen_reading: ‘완성되다’는 단순한 도덕적 향상보다, 마지막 때에 이루어져야 할 공동체의/신앙의 완결을 가리키는 표현으로 보았습니다.
  alternative_readings:
  - ‘온전하게 되다’로 더 신앙적·교리적으로 옮길 수 있음
  - ‘성숙하다’로 심리적 발달처럼 읽힐 수 있음
  rationale: 원문은 ‘마지막 때’와 결합해 신앙의 전 과정을 무효화할 수 없는 종말론적 완결을 말하므로, 완성의 긴장을 남기는 번역이 적절합니다.
  doctrine_reference: 종말론적 성화/완성의 언어
- issue: ψυχαῖς ὑμῶν의 번역 범위
  chosen_reading: ‘영혼’으로 옮겨 인간의 내적 생명과 구원의 대상이 되는 내면 전체를 드러냈습니다.
  alternative_readings:
  - ‘목숨’은 본문이 요구하는 영적 차원을 약화할 수 있음
  - ‘마음’은 ψυχή의 범위를 좁힐 수 있음
  rationale: Didache의 권면은 단순한 감정이 아니라 영적 유익을 겨냥하므로, 한국어 성경 문체에서 가장 직접적인 ‘영혼’이 적합합니다.
  doctrine_reference: 인간 내면과 구원
