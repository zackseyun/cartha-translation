revisions:
- from: 여러분의 생명을 위해 깨어 있으십시오. 여러분의 등불이 꺼지지 않게 하시고, 허리가 풀어지지 않게 하십시오. 오히려 준비하고 있으십시오. 여러분은 우리 주께서 오시는 시간이 언제인지 알지 못하기 때문입니다.[a][b]
  to: 여러분의 생명을 지키며 깨어 있으십시오.[a] 여러분의 등불이 꺼지지 않게 하시고, 여러분의 허리가 풀어지지 않게 하십시오.[b] 그러나 준비되어 있으십시오. 여러분은 우리 주께서 오시는 때를 알지 못하기 때문입니다.
  rationale: 첫 명령의 전치사구가 나타내는 자기 생명에 대한 경계의 방향을 ‘지키며’로 분명히 했습니다. ‘생명’은 ζωῆς의 기본 의미를 유지하되, ‘삶’이라는 가능한 폭은 각주에 남겼습니다. ‘허리’라는 원문의 신체 표현은 본문에 보존했고, 준비 태세를 뜻하는 ‘허리띠’ 해석은 각주로 한정했습니다. 각주 표지를 해당 구절 뒤로 옮겼으며, 준비하라는 명령은 원문의 준비된 상태를 반영하도록 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:10:17Z'
