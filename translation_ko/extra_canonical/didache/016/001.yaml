  source_fidelity: 첫 구절의 ὑπὲρ τῆς ζωῆς ὑμῶν은 ‘여러분의 생명을 위해’보다 생명에 대한 경계·보호의 뜻으로 옮겨야 합니다. 또한 γίνεσθε ἕτοιμοι는 준비하는 행위보다 준비된 상태를 요구합니다. 등불과 허리에 관한 부정 명령 및 주의 도래를 알 수 없다는 진술은 원문의 뜻을 잘 반영합니다.
  naturalness: 초안의 ‘생명을 위해 깨어 있으십시오’는 한국어에서 목적·수혜를 나타내어 다소 부자연스럽고 뜻이 흐려집니다. ‘생명을 지키며 깨어 있으십시오’가 자연스럽습니다. ‘준비되어 있으십시오’는 현대 표준어 합쇼체에서 원문의 상태 명령을 명료하게 전달합니다.
  terminology: ‘등불’, ‘허리’, ‘우리 주’는 적절합니다. ὀσφύες의 문자적 표현인 ‘허리’를 본문에 유지하고, ‘허리띠’라는 관용적 해석은 각주에서 제시하는 것이 적합합니다.
