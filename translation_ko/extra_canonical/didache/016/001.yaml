id: DID.16.1
reference: Didache 16:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν· οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν, καὶ αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν, ἀλλὰ γίνεσθε ἕτοιμοι· οὐ γὰρ οἴδατε τὴν ὥραν, ἐν ᾗ ὁ Κύριος ἡμῶν ἔρχεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/001.yaml
  text: Keep watch over your life.a Do not let your lamps be quenched, and do not let your loins be loosened,b but be ready, for you do not know the hour in which our Lord is coming.
translation:
  language: ko
  text: 여러분의 생명을 위해 깨어 있으십시오. 여러분의 등불이 꺼지지 않게 하시고, 허리가 풀어지지 않게 하십시오. 오히려 준비하고 있으십시오. 여러분은 우리 주께서 오시는 시간이 언제인지 알지 못하기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여러분의 삶을 위해 깨어 있으십시오.”
    reason: alternative_reading
  - marker: b
    text: 또는 “여러분의 허리띠가 풀어지지 않게 하십시오.”
    reason: alternative_reading
lexical_decisions:
- source_word: Γρηγορεῖτε ὑπὲρ τῆς ζωῆς ὑμῶν
  english_pob_choice: Keep watch over your life.
  chosen_korean: 여러분의 생명을 위해 깨어 있으십시오
  alternatives_korean:
  - 여러분의 삶을 위해 깨어 있으십시오
  - 여러분의 생명을 지키며 깨어 있으십시오
  lexicon: γρηγορέω
  rationale: 감시하듯 주의 깊게 깨어 있으라는 뜻을 살리기 위해 ‘깨어 있으십시오’를 택했고, ὑπὲρ τῆς ζωῆς ὑμῶν은 단순한 일상생활보다 더 강한 ‘생명’을 가리키므로 ‘생명’을 유지했습니다.
- source_word: οἱ λύχνοι ὑμῶν μὴ σβεσθήτωσαν
  english_pob_choice: Do not let your lamps be quenched
  chosen_korean: 여러분의 등불이 꺼지지 않게 하시고
  alternatives_korean:
  - 여러분의 등불을 끄지 마십시오
  - 여러분의 등불이 꺼지지 않도록 하십시오
  lexicon: λύχνος / σβέννυμι
  rationale: 직역하면 ‘등불’이 자연스럽고, ‘꺼지다’가 σβέννυμι의 이미지와 맞아 소멸·소등의 뉘앙스를 보존합니다.
- source_word: αἱ ὀσφύες ὑμῶν μὴ ἐκλυέσθωσαν
  english_pob_choice: Do not let your loins be loosened
  chosen_korean: 허리가 풀어지지 않게 하십시오
  alternatives_korean:
  - 허리띠를 풀지 마십시오
  - 허리가 느슨해지지 않게 하십시오
  lexicon: ὀσφύς / ἐκλύω
  rationale: οσφύες는 문자적으로 ‘허리/허리 부분’이지만, 준비 태세의 비유이므로 한국어에서는 자연스럽게 ‘허리가 풀리다’로 옮겨 긴장 해제의 이미지를 살렸습니다.
- source_word: γίνεσθε ἕτοιμοι
  english_pob_choice: be ready
  chosen_korean: 준비하고 있으십시오
  alternatives_korean:
  - 준비하십시오
  - 늘 준비되십시오
  lexicon: ἕτοιμος
  rationale: 현재 지속의 뉘앙스를 반영해 단발적 명령보다 상태 유지의 의미가 드러나도록 했습니다.
theological_decisions:
- issue: “우리 주”와 재림 기대의 표현
  chosen_reading: ‘우리 주께서 오시는 시간’으로 옮겨, 공동체가 기다리는 주의 도래를 현재적 긴장감 속에서 표현했습니다.
  alternative_readings:
  - ‘우리 주께서 오실 시간’
  - ‘주님이 오시는 때’
  rationale: ὁ Κύριος ἡμῶν ἔρχεται는 단순 미래 예고가 아니라 임박성과 경계의 요청을 동반하므로, ‘오시는’의 진행형으로 긴박감을 보존했습니다.
  doctrine_reference: 재림/종말 경계
- issue: ‘생명’의 범위
  chosen_reading: τῆς ζωῆς ὑμῶν을 ‘여러분의 생명’으로 직역해 윤리적 삶보다 존재 전체를 지키라는 촉구를 드러냈습니다.
  alternative_readings:
  - ‘여러분의 삶’
  - ‘여러분의 영혼’
  rationale: 문맥상 도덕적 생활만이 아니라 깨어 있는 종말론적 자기 보존을 요구하므로, ‘삶’보다 더 직접적인 ‘생명’이 본문 힘을 잘 전달합니다.
  doctrine_reference: 종말론적 경계
