source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Καὶ τότε φανήσεται τὰ σημεῖα τῆς ἀληθείας· πρῶτον, σημεῖον ἐκπετάσεως ἐν οὐρανῷ, εἶτα σημεῖον φωνῆς σάλπιγγος καὶ τὸ τρίτον ἀνάστασις νεκρῶν·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/006.yaml
  text: 'And then the signs of the truth will appear: first[a], a sign of an opening in heaven; then a sign of the sound of a trumpet; and the third[b], the resurrection of the dead—'
  footnotes:
  - marker: a
    text: Or 'an opening out'.
    reason: previous_rendering
  - marker: b
    text: Or "a trumpet's voice".
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그때 진리의 표징들이 나타날 것입니다. 먼저, 하늘에 펼쳐짐의 표징이요, 다음은 나팔 소리의 표징이요, 그리고 셋째는 죽은 자들의 부활입니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἐκπέτασις는 문자적으로 ‘펼침/펴짐’의 뜻을 띠므로, 여기서는 ‘열림’보다 ‘펼쳐짐’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: φωνῆς σάλπιγγος는 문자적으로 ‘나팔의 소리’이며, 문맥상 ‘나팔의 음성’으로 의인화할 필요는 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ σημεῖα τῆς ἀληθείας
  english_pob_choice: the signs of the truth
  chosen_korean: 진리의 표징들
  alternatives_korean:
  - 진리의 징조들
  - 진실의 표징들
  lexicon: σημεῖα
  rationale: σημεῖα는 단순한 ‘증거’보다 가시적으로 드러나는 표징/징조의 의미가 강해 ‘표징들’로 옮겼고, ἀληθείας는 추상적 ‘진실’보다 문맥상 종말론적 ‘진리’가 자연스럽습니다.
- source_word: σημεῖον ἐκπετάσεως ἐν οὐρανῷ
  english_pob_choice: a sign of an opening in heaven
  chosen_korean: 하늘에 펼쳐짐의 표징
  alternatives_korean:
  - 하늘에 열림의 표징
  - 하늘에서 펼쳐짐의 표징
  lexicon: ἐκπέτασις
  rationale: ἐκπέτασις는 ‘열림’보다 ‘펼쳐짐/펴짐’의 뜻이 강하므로, 하늘의 틈을 말하기보다 하늘이 펼쳐지는 이미지를 살려 번역했습니다.
- source_word: σημεῖον φωνῆς σάλπιγγος
  english_pob_choice: a sign of the sound of a trumpet
  chosen_korean: 나팔 소리의 표징
  alternatives_korean:
  - 나팔의 소리 표징
  - 나팔 음성의 표징
  lexicon: φωνή + σάλπιγξ
  rationale: φωνή는 악기와 결합할 때 ‘목소리’보다 ‘소리’가 자연스럽고, σάλπιγγος는 소유격으로 나팔의 울림을 가리키므로 ‘나팔 소리’로 옮겼습니다.
- source_word: ἀνάστασις νεκρῶν
  english_pob_choice: the resurrection of the dead
  chosen_korean: 죽은 자들의 부활
  alternatives_korean:
  - 죽은 자의 부활
  - 죽은 이들의 부활
  lexicon: ἀνάστασις νεκρῶν
  rationale: 복수 속격 νεκρῶν을 그대로 살려 ‘죽은 자들’로 옮기면 원문의 집합적·보편적 범위를 분명히 드러낼 수 있습니다.
theological_decisions:
- issue: 종말 표징의 열거 방식
  chosen_reading: 첫째-둘째-셋째의 병렬 구조를 유지해, 하늘의 표징, 나팔 소리의 표징, 죽은 자들의 부활이 연속된 종말 징조로 읽히도록 했습니다.
  alternative_readings:
  - 세 사건을 느슨한 나열로 처리하는 번역
  - ‘그리고 그때’만 살리고 순서를 완화하는 번역
  rationale: 그리스어의 πρῶτον / εἶτα / τὸ τρίτον은 순차성과 구성을 강조하므로, 이를 명시적으로 보존하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 종말론적 표징의 순차적 전개
