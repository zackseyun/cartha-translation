id: DID.16.5
reference: Didache 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Τότε ἥξει ἡ κτίσις τῶν ἀνθρώπων εἰς τὴν πύρωσιν τῆς δοκιμασίας καὶ σκανδαλισθήσονται πολλοὶ καὶ ἀπολοῦνται, οἱ δὲ ὑπομείναντες ἐν τῇ πίστει αὐτῶν σωθήσονται ὑπ᾽ αὐτοῦ τοῦ καταθέματος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/005.yaml
  text: Then the human creation will come into the fire of testing[a], and many will be caused to stumble and will perish, but those who endure in their faith will be saved by the curse itself.
  footnotes:
  - marker: a
    text: Or 'by the accursed one himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 사람들의 창조는 시험의 불길 속으로 들어가고, 많은 사람이 넘어지고 멸망할 것입니다. 그러나 자기의 믿음 안에 끝까지 견디는 사람들은 그 저주 자체 아래에서 구원받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저주받은 그 자신에 의해’.
    reason: previous_rendering
lexical_decisions:
- source_word: ἡ κτίσις τῶν ἀνθρώπων
  english_pob_choice: the human creation
  chosen_korean: 사람들의 창조
  alternatives_korean:
  - 인간의 창조
  - 인류
  lexicon: κτίσις
  rationale: κτίσις는 단순히 ‘인류’보다 ‘창조/지음’의 뉘앙스를 살리므로, 소유격을 포함해 ‘사람들의 창조’로 옮겨 문장의 낯선 종말론적 표현을 보존했습니다.
- source_word: εἰς τὴν πύρωσιν τῆς δοκιμασίας
  english_pob_choice: into the fire of testing
  chosen_korean: 시험의 불길 속으로
  alternatives_korean:
  - 연단의 불 속으로
  - 시험의 불 속으로
  lexicon: πύρωσις / δοκιμασία
  rationale: πύρωσις의 ‘불’ 이미지를 살리면서 δοκιμασία의 시험/검증 성격을 반영해, 한국어에서도 압축된 종말론적 심판-검증 이미지를 유지했습니다.
- source_word: σκανδαλισθήσονται
  english_pob_choice: will be caused to stumble
  chosen_korean: 넘어지고
  alternatives_korean:
  - 실족하고
  - 걸려 넘어지고
  lexicon: σκανδαλίζω
  rationale: 여기서는 능동적 유발보다 결과를 강조하는 수동형이므로, 자연스러운 합쇼체 문장 안에서 ‘넘어지다’로 옮겨 실족의 결과를 드러냈습니다.
- source_word: ὑπομείναντες ἐν τῇ πίστει αὐτῶν
  english_pob_choice: those who endure in their faith
  chosen_korean: 자기의 믿음 안에 끝까지 견디는 사람들
  alternatives_korean:
  - 그들의 믿음 안에 견디는 이들
  - 믿음 가운데 끝까지 견디는 자들
  lexicon: ὑπομένω / πίστις
  rationale: ὑπομένω의 인내·견딤을 ‘끝까지 견디다’로, πίστις를 ‘믿음’으로 직역하여 지속성과 내적 신뢰를 함께 살렸습니다.
- source_word: ὑπ᾽ αὐτοῦ τοῦ καταθέματος
  english_pob_choice: by the curse itself
  chosen_korean: 그 저주 자체 아래에서
  alternatives_korean:
  - 그 저주에 의해
  - 저주 아래에서
  lexicon: κατάθεμα / ὑπό
  rationale: 이 구절은 ‘저주’(neuter)이며, 문맥상 ‘저주 자체 아래에서’처럼 ὑπό의 종속/해방 뉘앙스를 드러내는 표현이 가장 안전합니다.
theological_decisions:
- issue: 마지막 구절의 구원 주체와 저주 표현
  chosen_reading: ‘그 저주 자체 아래에서 구원받을 것입니다’로 옮겨, 구원이 저주를 행하는 어떤 인물이 아니라 저주로부터/저주 아래의 상태에서의 구출임을 드러냈습니다.
  alternative_readings:
  - ‘저주에 의해 구원받을 것입니다’
  - ‘저주받은 그 자신에 의해 구원받을 것입니다’
  rationale: 최근 교정 기록이 지적하듯 κατάθεμα를 인격적 ‘저주받은 자’로 읽으면 문법과 신학이 모두 어긋납니다. 따라서 비인격적 ‘저주’로 유지해 본문의 긴장과 종말론적 경고를 보존했습니다.
  doctrine_reference: 종말론적 심판과 구원, 본문 문맥상 비인격적 저주의 기능
