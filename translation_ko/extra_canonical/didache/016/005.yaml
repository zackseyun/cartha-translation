review_pass:
  verdict: revise
  source_fidelity: 마지막 구절의 ὑπό＋속격은 통상 행위자·수단을 나타내므로, 초안의 ‘그 저주 자체 아래에서’는 본문의 직접적인 관계를 ‘저주 아래의 상태로부터’라는 뜻으로 바꿉니다. κατάθεμα는 중성 명사이므로 ‘저주’로 옮기는 것이 문법적으로 적절하지만, 구원이 ‘저주 자체로 말미암아’ 이루어진다는 난해한 표현은 완화하거나 신학적으로 해소하지 않고 보존해야 합니다. 또한 ἡ κτίσις τῶν ἀνθρώπων은 인류 전체를 가리키는 낯선 종말론적 표현으로 보이며, ‘사람들의 창조’는 한국어에서 사람이 창조의 주체인 듯한 불필요한 오해를 낳습니다.
  naturalness: ‘인류가’는 해당 집합적 표현을 자연스러운 현대 한국어로 옮기며, ‘시험의 불 속으로’, ‘실족하여’, ‘믿음 안에서 끝까지 견디는’은 현대적인 문어 합쇼체에 적합합니다. ‘그 저주 자체로 말미암아’는 의도적으로 난해하지만 원문의 난해성과 직접성을 보존합니다.
  terminology: κτίσις τῶν ἀνθρώπων은 ‘인류’, πύρωσις τῆς δοκιμασίας는 ‘시험의 불’, σκανδαλισθήσονται는 ‘실족하여’, ὑπομείναντες ἐν τῇ πίστει αὐτῶν은 ‘자기들의 믿음 안에서 끝까지 견디는 사람들’로 처리했습니다. κατάθεμα는 중성의 ‘저주’로 유지했습니다. 기존 각주는 영어 감사 기록의 이전 번역을 반영하되, 본문에 없는 인격적 해석임을 ‘또는’으로만 제시하여 본문 번역으로 채택하지 않았습니다.
  issues:
  - severity: high
    issue: ‘그 저주 자체 아래에서’는 ὑπ᾽ αὐτοῦ τοῦ καταθέματος의 직접적인 수단/행위자 관계를 바꿉니다.
    rationale: ὑπό＋속격은 여기서 ‘~에 의해/말미암아’로 옮기는 것이 문법적으로 가장 직접적입니다. ‘아래에서’는 ὑπό의 공간·지배 의미를 도입하고 구원의 방향을 ‘저주로부터의 구출’로 해석하여 보충합니다.
  - severity: medium
    issue: ‘사람들의 창조’는 한국어 소유 관계가 모호하여 사람이 창조하는 행위 또는 사람 소유의 창조물처럼 들립니다.
    rationale: 원문의 집합적·종말론적 표현을 보존하면서도 ‘인류’로 옮기면 한국어의 불필요한 주체-소유격 혼동을 피할 수 있습니다.
  - severity: low
    issue: ‘넘어지고’는 σκανδαλισθήσονται의 종교·윤리적 ‘걸려 넘어짐/실족’의 함의를 다소 약화합니다.
    rationale: ‘실족하여’는 본문의 비유적 표현과 자연스러운 현대 문어체를 함께 살립니다.
  revised_text: 그때 인류가 시험의 불 속으로 들어갈 것이며, 많은 사람이 실족하여 멸망할 것입니다. 그러나 자기들의 믿음 안에서 끝까지 견디는 사람들은 그 저주 자체로 말미암아 구원받을 것입니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 ‘저주받은 그 자신에 의해’.
    reason: previous_rendering
  revision_rationale: 원문의 문법과 난해성을 우선하여, 마지막 ὑπό 구문을 ‘저주 자체로 말미암아’로 바로 옮겼습니다. 이는 저주를 구원의 인격적 주체로 교리화하지 않으면서도, 본문의 역설적이고 논쟁적인 표현을 삭제·완화하지 않습니다. ‘인류’와 ‘실족하여’는 각각 원문의 집합적 표현과 비유적 동사를 자연스러운 표준 한국어로 전달합니다.
