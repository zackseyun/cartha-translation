  yaml_path: translation/extra_canonical/didache/016/008.yaml
  text: Then the world will see the Lord coming upon the clouds of heaven.j
translation:
  language: ko
  text: 그때 세상은 주님께서 하늘의 구름 위에 오시는 것을 보게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κόσμος
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 온 세상
  - 사람들
  lexicon: κόσμος
  rationale: 이 문맥에서 κόσμος는 인류 전체를 가리키는 일반적 ‘세상’이 자연스럽고, ‘세계’보다 서술적이며 ‘사람들’보다 원뜻에 가깝습니다.
- source_word: τὸν Κύριον
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주님이신 하나님
  lexicon: κύριος
  rationale: 예수께 대한 호칭이므로 한국어 예배체에서 널리 읽히는 ‘주님’을 사용하되, 본문의 직접성을 유지했습니다.
- source_word: ἐρχόμενον
  english_pob_choice: coming
  chosen_korean: 오시는
  alternatives_korean:
  - 오는
  - 다가오시는
  - 내려오시는
  lexicon: ἔρχομαι
  rationale: 현재분사적 진행감을 살리면서 주님에 대한 존칭을 반영해 ‘오시는’으로 옮겼습니다.
- source_word: ἐπάνω τῶν νεφελῶν τοῦ οὐρανοῦ
  english_pob_choice: upon the clouds of heaven
  chosen_korean: 하늘의 구름 위로
  alternatives_korean:
  - 하늘의 구름 위에
  - 하늘 구름 위로
  - 하늘의 구름을 타고
  lexicon: ἐπάνω + νεφέλη + οὐρανός
  rationale: ἐπάνω의 ‘위로/위에’ 뉘앙스를 살려 움직임을 드러내고, ‘구름을 타고’처럼 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: 종말론적 장면의 서술 방식
  chosen_reading: 미래적 가시 사건으로 직설적으로 번역했습니다.
  alternative_readings:
  - 상징적 계시로 완화해 표현
  - ‘보게 될 것입니다’를 ‘알게 될 것입니다’로 바꿈
  rationale: 원문 ὄψεται는 ‘볼 것이다’라는 직접적 시각 인식을 말하므로, 종말 장면의 강도를 약화하지 않는 것이 적절합니다.
  doctrine_reference: 종말론 / 재림
- issue: ‘주님’의 정체
  chosen_reading: 본문의 Κύριον은 예수 그리스도를 가리키는 호칭으로 보아 ‘주님’으로 번역했습니다.
  alternative_readings:
  - ‘야훼’로 옮김
  - ‘주’로 단순화
  rationale: 이 절은 신약적 문맥의 ‘주님’ 이해가 자연스럽고, ‘야훼’는 구약 인용 및 명시적 대체가 확인될 때 사용하는 원칙에 따르지 않습니다.
  doctrine_reference: 그리스도론 / 호칭
