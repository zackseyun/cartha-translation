id: DID.16.3
reference: Didache 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Ἐν γὰρ ταῖς ἐσχάταις ἡμέραις πληθυνθήσονται οἱ ψευδοπροφῆται καὶ οἱ φθορεῖς καὶ στραφήσονται τὰ πρόβατα εἰς λύκους καὶ ἡ ἀγάπη στραφήσεται εἰς μῖσος·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/003.yaml
  text: For in the last days false prophets and corrupters will be multiplied, and the sheep will be turned into wolves, and love will be turned into hatred.
translation:
  language: ko
  text: 이는 마지막 날들에 거짓 예언자들과 부패시키는 자들이 많아질 것이며, 양들이 늑대로 변할 것이고, 사랑은 미움으로 변할 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῖς ἐσχάταις ἡμέραις
  english_pob_choice: in the last days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 말세에
  - 끝날들에
  lexicon: ἐσχάτος
  rationale: 직역에 가까우면서도 현대 한국어에서 자연스럽게 종말론적 시기를 드러내는 표현으로 옮겼습니다.
- source_word: οἱ ψευδοπροφῆται
  english_pob_choice: false prophets
  chosen_korean: 거짓 예언자들
  alternatives_korean:
  - 거짓 선지자들
  - 거짓 예언자들
  lexicon: ψευδοπροφήτης
  rationale: 예언자라는 중립적 직역을 택해, 후대 교회어인 선지자보다 원문 구조를 더 직접적으로 반영했습니다.
- source_word: οἱ φθορεῖς
  english_pob_choice: corrupters
  chosen_korean: 타락시키는 자들
  alternatives_korean:
  - 부패시키는 자들
  - 파괴하는 자들
  lexicon: φθορεύς
  rationale: 사람을 도덕적으로 무너뜨리고 망가뜨리는 뉘앙스를 살려, 단순한 물리적 파괴보다 더 넓은 ‘타락’의 의미를 담았습니다.
- source_word: τὰ πρόβατα εἰς λύκους
  english_pob_choice: the sheep will be turned into wolves
  chosen_korean: 양들은 늑대들로 변할 것이고
  alternatives_korean:
  - 양들은 늑대로 바뀔 것이고
  - 양들이 늑대가 될 것이고
  lexicon: πρόβατον / λύκος
  rationale: 수동태의 변질 이미지를 살리면서, 양과 늑대의 대조를 한국어에서도 선명하게 유지했습니다.
- source_word: ἡ ἀγάπη στραφήσεται εἰς μῖσος
  english_pob_choice: love will be turned into hatred
  chosen_korean: 사랑은 미움으로 변할 것입니다
  alternatives_korean:
  - 사랑이 미움으로 바뀔 것입니다
  - 사랑은 증오로 변할 것입니다
  lexicon: ἀγάπη / μῖσος
  rationale: ἀγάπη는 프로젝트 기본어인 사랑으로 유지했고, μῖσος는 문맥상 강한 증오보다 일상적 대립어인 미움이 더 직접적입니다.
theological_decisions:
- issue: 종말론적 경고의 서술 방식
  chosen_reading: 미래 시제를 유지해, 마지막 날들에 일어날 공동체적 붕괴를 예고하는 경고로 읽었습니다.
  alternative_readings:
  - 일반적 현재화로 읽기
  - 도덕적 교훈으로 완화하기
  rationale: 원문과 영어 POB 모두 예언적 미래 서술을 분명히 하므로, 경고의 긴장감을 약화시키지 않았습니다.
  doctrine_reference: Didache 16:3의 종말론적 권고 문맥
