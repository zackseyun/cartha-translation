lexical_decisions:
- source_word: οὐ πάντων δέ, ἀλλ᾽
  english_pob_choice: but not of all, but
  chosen_korean: 하지만 모든 사람에게서가 아니라
  alternatives_korean:
  - 그러나 모든 사람에게서가 아니라
  - 모든 이에게서가 아니라
  lexicon: οὐ / πᾶς
  rationale: 반대 접속과 부분적 부정을 자연스러운 한국어로 옮기되, ‘all’의 범위를 ‘모든 사람’으로 풀어 주어 문맥상 배제의 뜻을 분명히 했습니다.
- source_word: ὡς ἐρρέθη
  english_pob_choice: as it was said
  chosen_korean: 말씀하신 바와 같이입니다
  alternatives_korean:
  - 말씀된 바와 같이입니다
  - 말한 대로입니다
  lexicon: λέγω / ἐρρέθη
  rationale: 수동 표현을 살려, 단순한 과거 진술이 아니라 이미 인용된 권위 있는 말씀을 가리킨다는 점을 드러냈습니다.
- source_word: Ἥξει ὁ Κύριος
  english_pob_choice: The Lord will come
  chosen_korean: 주님께서 오시고
  alternatives_korean:
  - 주님께서 오실 것이고
  - 주님이 오시며
  lexicon: κύριος
  rationale: 미래 약속을 한국어에서 자연스럽게 풀면서도, κύριος를 주님으로 옮겨 경건한 호칭을 유지했습니다.
- source_word: οἱ ἅγιοι
  english_pob_choice: the holy ones
  chosen_korean: 모든 성도들이
  alternatives_korean:
  - 모든 거룩한 이들이
  - 모든 거룩한 자들이
  lexicon: ἅγιοι
  rationale: POB의 기본 용례에 따라 ἅγιοι를 성도로 옮기되, 집합적 의미를 살려 복수 주어로 처리했습니다.
theological_decisions:
- issue: 주님의 도래와 ‘모든 성도들’의 동행을 어떻게 읽을 것인가
  chosen_reading: 본문의 문장 구조를 따라, 주님의 오심과 함께 성도들이 동행하는 장면을 직설적으로 진술했습니다.
  alternative_readings:
  - 종말론적 인용문으로만 처리하여 약하게 번역하는 방식
  - ‘거룩한 자들’을 일반적 도덕적 표현으로 완화하는 방식
  rationale: 헬라어 본문이 인용 형식으로 미래의 도래와 동행을 결합하므로, 그 종말론적 강도를 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 종말론적 재림과 성도들의 동행에 대한 일반적 신앙 고백
