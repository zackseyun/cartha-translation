  source_fidelity: 첫 절의 πάντων은 문맥상 무엇의 ‘전부’인지를 본문 자체가 명시하지 않으므로 ‘모든 사람에게서’로 한정하면 안 됩니다. ἐρρέθη는 비인칭 수동형이므로 ‘말씀하신’보다 ‘말씀된’이 가깝습니다. οἱ ἅγιοι는 그 정체가 본문에서 확정되지 않아 ‘성도들’보다 ‘거룩한 이들’이 원문의 범위를 보존합니다.
