  terminology: κύριος는 ‘주님’으로 적절합니다. ἅγιοι를 교회 공동체로 특정하는 ‘성도들’ 대신 ‘거룩한 이들’로 옮겨, 성도 또는 천상 존재 등 가능한 지시 대상을 교리적으로 결정하지 않았습니다.
