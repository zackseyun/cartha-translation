id: DID.16.4
reference: Didache 16:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: αὐξανούσης γὰρ τῆς ἀνομίας, μισήσουσιν ἀλλήλους καὶ διώξουσι καὶ παραδώσουσι, καὶ τότε φανήσεται ὁ κοσμοπλάνος ὡς υἱὸς Θεοῦ καὶ ποιήσει σημεῖα καὶ τέρατα, καὶ ἡ γῆ παραδοθήσεται εἰς χεῖρας αὐτοῦ, καὶ ποιήσει ἀθέμιτα, ἃ οὐδέποτε γέγονεν ἐξ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/016/004.yaml
  text: For as lawlessness increases, they will hate one another and persecute and betray one another, and then the world-deceiver will appear as a son of God and will do signs and wonders, and the earth will be delivered into his hands, and he will do unlawful things such as have never happened from the beginning of the age.
translation:
  language: ko
  text: 불법이 더해질수록 그들은 서로를 미워하고 서로를 박해하며 서로를 넘겨줄 것입니다. 그러면 세상 속이는 자가 하나님의 아들처럼 나타나서 표적과 기사를 행하고, 땅은 그의 손에 넘겨질 것이며, 그는 세상 시작부터 결코 일어난 적이 없는 불법한 일들을 행할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομία
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 무법
  - 법 없음
  lexicon: ἀνομία
  rationale: 죄의 상태를 단순한 규칙 위반보다 더 강하게 드러내는 표준 대응으로 ‘불법’을 택했습니다.
- source_word: κοσμοπλάνος
  english_pob_choice: world-deceiver
  chosen_korean: 세상 속이는 자
  alternatives_korean:
  - 세상 미혹자
  - 세상 기만자
  lexicon: κοσμοπλάνος
  rationale: 직역하면 ‘세상’과 ‘속이는 자’의 결합으로, POB의 의미를 살리되 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: σημεῖα καὶ τέρατα
  english_pob_choice: signs and wonders
  chosen_korean: 표적과 기사
  alternatives_korean:
  - 표징과 이적
  - 기적과 놀라운 일
  lexicon: σημεῖα καὶ τέρατα
  rationale: 기독교 한국어에서 널리 인지되는 두 용어를 사용해, 단순한 ‘기적’보다 신호적·경이적 성격을 함께 보존했습니다.
- source_word: ἀθέμιτα
  english_pob_choice: unlawful things
  chosen_korean: 불법한 일들
  alternatives_korean:
  - 금지된 일들
  - 부당한 일들
  lexicon: ἀθέμιτα
  rationale: 앞의 ἀνομία와 어근상 호응을 살려, 도덕적 금지와 율법 위반의 뉘앙스를 함께 담았습니다.
theological_decisions:
- issue: ὡς υἱὸς Θεοῦ의 처리
  chosen_reading: ‘하나님의 아들처럼’으로 옮겨, 사칭과 모조 메시아성의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘하나님의 아들로’
  - ‘하나님의 아들인 듯이’
  rationale: 문맥상 실제 아들이 아니라 그렇게 보이게 나타나는 위장/사칭을 말하므로 ‘처럼’이 가장 정확합니다.
  doctrine_reference: 그리스도론; 거짓 메시아/적그리스도 모티프
- issue: ἐξ αἰῶνος의 처리
  chosen_reading: ‘세상 시작부터’로 옮겨, 시간의 기원을 가리키는 표현을 자연스럽게 전달했습니다.
  alternative_readings:
  - ‘영원부터’
  - ‘옛적부터’
  rationale: 영원성보다 ‘시작부터’라는 역사적 기원 강조가 본문 의미에 더 가깝습니다.
  doctrine_reference: 종말론적 과장 표현 및 역사 기원 강조
