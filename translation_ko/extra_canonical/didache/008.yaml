source:
  edition: Hitchcock & Brown 1884 (normalized OCR)
  text: Αἱ δὲ νηστεῖαι ὑμῶν μὴ ἔστωσαν μετὰ τῶν ὑποκριτῶν· νηστεύουσι γὰρ δευτέρα σαββάτων καὶ πέμπτῃ· ὑμεῖς δὲ νηστεύσατε τετράδα καὶ παρασκευήν. Μηδὲ προσεύχεσθε ὡς οἱ ὑποκριταί, ἀλλʼ ὡς ἐκέλευσεν ὁ Κύριος ἐν τῷ εὐαγγελίῳ αὐτοῦ, οὕτω προσεύχεσθε· Πάτερ ἡμῶν ὁ ἐν τῷ οὐρανῷ, ἁγιασθήτω τὸ ὄνομά σου, ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς· τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον καὶ ἄφες ἡμῖν τὴν ὀφειλὴν ἡμῶν ὡς καὶ ἡμεῖς ἀφίεμεν τοῖς ὀφειλέταις ἡμῶν, καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ πονηροῦ· ὅτι σοῦ ἐστιν ἡ δύναμις καὶ ἡ δόξα εἰς τοὺς αἰῶνας. Τρὶς τῆς ἡμέρας οὕτω προσεύχεσθε.
  language: Greek
  pages:
  - 28
  - 30
  note: This chapter comes from the normalized Hitchcock & Brown 1884 OCR layer. Line-number noise and page segmentation were cleaned, but the translation must stay anchored in the Greek wording.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/didache/008.yaml
  text: 'But let your fasts not be with the hypocrites[a], for they fast on the second day of the week and on the fifth; but you, fast on the fourth day and on Preparation. And do not pray as the hypocrites, but as the Lord commanded in his gospel, pray in this way:


    Our Father in heaven,

    may your name be made holy,

    may your kingdom come,

    may your will be done,

    as in heaven, so also on earth.

    Give us today our bread for the day,

    and forgive us our debt,

    as we also forgive our debtors,

    and do not bring us into testing,

    but rescue us from the evil one;

    for yours is the power and the glory unto the ages[i][h][g][f][e][d][c][b].


    Pray in this way three times a day.'
  footnotes:
  - marker: a
    text: '''Preparation'' was the customary name for the day before the Sabbath, that is, Friday.'
    reason: cultural_note
  - marker: b
    text: The Greek here has 'in heaven' (singular), a slight variation from the 'in the heavens' (plural) common in Matthew's version of the prayer.
    reason: textual_variant
  - marker: c
    text: Or 'hallowed be your name.'
    reason: lexical_alternative
  - marker: d
    text: The Greek adjective behind 'for the day' is rare and debated; alternatives include 'daily,' 'necessary,' or 'for tomorrow.'
    reason: lexical_alternative
  - marker: e
    text: This version uses the singular 'debt,' whereas Matthew's version often has the plural 'debts' or 'trespasses.'
    reason: textual_variant
  - marker: f
    text: '''Testing'' may also be rendered ''temptation'' or ''trial.'''
    reason: lexical_alternative
  - marker: g
    text: Or 'from evil.'
    reason: alternative_reading
  - marker: h
    text: The prayer closely parallels Matthew 6:9–13, but this version includes a shorter doxology than is found in many later manuscripts of Matthew. The Didache presents it as the Lord's command 'in his gospel' within its church-order instruction.
    reason: cross_reference
  - marker: i
    text: Or 'Neither pray as the hypocrites,'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 여러분의 금식은 위선자들과 함께하는 것이 되어서는 안 됩니다. 그들은 주간의 둘째 날과 다섯째 날에 금식합니다. 그러나 여러분은 넷째 날과 준비일에 금식하십시오. 또 위선자들처럼 기도하지 말고, 주님께서 그분의 복음에서 명하신 대로 이렇게 기도하십시오.


    “하늘에 계신 우리 아버지,


    아버지의 이름이 거룩하게 되시며,

    아버지의 나라가 오게 하시며,

    아버지의 뜻이 하늘에서처럼 땅에서도 이루어지게 하소서.

    오늘 우리에게 오늘의 양식을 주시고,

    우리가 우리에게 빚진 이들을 용서한 것처럼 우리의 빚을 용서해 주시며,

    우리를 시험에 들게 하지 마시고,

    악한 자에게서 우리를 구해 주소서.


    이는 권능과 영광이 영원히 아버지의 것이기 때문입니다.


    이렇게 하루에 세 번 기도하십시오.”[a][b][c][d][e][f][g][h][i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘준비일’은 안식일 전날, 곧 금요일을 가리키는 당시의 관용적 명칭입니다.
    reason: cultural_note
  - marker: b
    text: 그리스어 본문은 단수형 ‘하늘에’로 되어 있어, 마태복음의 흔한 복수형 ‘하늘들에’와 약간 다릅니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘이름이 거룩히 여김을 받으소서’.
    reason: lexical_alternative
  - marker: d
    text: 희귀한 형용사로, ‘일용할’, ‘필요한’, ‘내일을 위한’ 등으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 이 본문은 단수형 ‘빚’을 사용하며, 마태복음의 흔한 복수형 ‘빚들’ 또는 ‘허물들’과 다릅니다.
    reason: textual_variant
  - marker: f
    text: ‘시험’은 ‘유혹’ 또는 ‘시련’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: g
    text: 또는 ‘악에서’.
    reason: alternative_reading
  - marker: h
    text: 이 기도문은 마태복음 6:9-13과 밀접히 평행하지만, Didache는 이를 ‘그분의 복음’ 속 주님의 명령으로 제시합니다.
    reason: cross_reference
  - marker: i
    text: 또는 ‘위선자들처럼 기도하지 말고’.
    reason: previous_rendering
lexical_decisions:
- source_word: νηστεῖαι
  english_pob_choice: fasts
  chosen_korean: 금식
  alternatives_korean:
  - 금식들
  - 금식 관행
  lexicon: LSJ
  rationale: 복수형이지만 한국어에서는 관용적으로 공동체의 금식 규정을 단수 개념으로 자연스럽게 묶어 표현할 수 있어, 행위 자체를 분명히 드러내는 ‘금식’이 가장 적절합니다.
- source_word: ὑποκριτῶν
  english_pob_choice: hypocrites
  chosen_korean: 위선자들
  alternatives_korean:
  - 가식하는 자들
  - 위선하는 자들
  lexicon: BDAG
  rationale: 예수 전승에서 이미 굳어진 도덕적·논쟁적 표현이므로, 의미를 직접 드러내는 ‘위선자들’로 옮겼습니다.
- source_word: παρασκευήν
  english_pob_choice: Preparation
  chosen_korean: 준비일
  alternatives_korean:
  - 준비
  - 금요일
  lexicon: BDAG
  rationale: 고정된 유대-초기기독교 용어의 직역을 살려 본문 안에서는 ‘준비일’로 두고, 이해를 돕는 문화적 설명은 각주로 처리했습니다.
- source_word: ἁγιασθήτω
  english_pob_choice: may your name be made holy
  chosen_korean: 이름이 거룩하게 되시며
  alternatives_korean:
  - 이름이 거룩하게 되게 하소서
  - 이름이 거룩하게 하시며
  lexicon: BDAG
  rationale: 수동 명령형의 의미를 살리면서도 한국어 기도문으로 자연스럽게 읽히도록, 하나님의 이름이 ‘거룩하게 되시며’로 옮겼습니다.
- source_word: ἐπιούσιον
  english_pob_choice: for the day
  chosen_korean: 오늘의 양식
  alternatives_korean:
  - 일용할 양식
  - 그날의 양식
  - 필요한 양식
  lexicon: BDAG
  rationale: 희귀하고 논쟁적인 형용사의 의미를 과도하게 특정하지 않으면서, 당일의 공급을 가리키는 문맥을 살려 가장 읽기 자연스러운 표현으로 처리했습니다.
- source_word: ὀφειλήν / ὀφειλέταις
  english_pob_choice: debt / debtors
  chosen_korean: 빚 / 빚진 이들
  alternatives_korean:
  - 죄책 / 죄인들
  - 채무 / 채무자들
  - 빚 / 빚진 사람들
  lexicon: BDAG
  rationale: 원문의 빚 비유를 그대로 유지해, 통상적 교회 용어인 ‘죄/허물’로 바꾸지 않고 ‘빚’과 ‘빚진 이들’로 대응시켰습니다.
- source_word: πειρασμόν
  english_pob_choice: testing
  chosen_korean: 시험
  alternatives_korean:
  - 유혹
  - 시련
  lexicon: BDAG
  rationale: 그리스어의 폭넓은 의미를 살려 ‘시험’으로 옮겨, 하나님이 악을 부추기신다는 오해를 피하면서도 본문의 긴장을 보존했습니다.
- source_word: τοῦ πονηροῦ
  english_pob_choice: the evil one
  chosen_korean: 악한 자
  alternatives_korean:
  - 악
  - 악한 이
  - 악한 자들
  lexicon: BDAG
  rationale: 문법상 중성/남성 가능성이 있으나, 초기 그리스도교 기도문의 문맥을 따라 인격적 읽기를 본문에 두고, 다른 가능성은 각주로 남겼습니다.
- source_word: εἰς τοὺς αἰῶνας
  english_pob_choice: unto the ages
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원 무궁히
  lexicon: LSJ
  rationale: 직역 가능성은 있으나 한국어 기도문 문맥에서는 ‘영원히’가 가장 자연스럽고, 복수형 시간 표현의 지속성을 충분히 담아냅니다.
theological_decisions:
- issue: 주기도문의 ‘악한 자’ 해석
  chosen_reading: 본문에는 ‘악한 자’로 두어 인격적 악의 가능성을 드러내었습니다.
  alternative_readings:
  - 악
  - 악으로부터
  rationale: 원문 형태가 남성/중성 모두 가능하므로 해석을 닫지 않되, Didache와 초기 기도 전통의 문맥상 인격적 읽기를 우선했습니다.
  doctrine_reference: 마 6:13 병행구; 초기 교회 기도 전통
- issue: ‘아버지’에 대한 기도체계
  chosen_reading: 하나님께 직접 드리는 기도문이므로 ‘거룩하게 되시며’, ‘주소서’와 같은 공손한 청원형을 사용했습니다.
  alternative_readings:
  - 거룩하게 하소서
  - 거룩히 여김을 받으소서
  rationale: 원문은 인용된 기도문이므로 한국어 합쇼체 기도 문체를 유지하되, 명령형 청원의 힘을 약화시키지 않도록 했습니다.
  doctrine_reference: 마 6:9-13 주기도문 / Didache 8
