  revised_text: '이제 영혼의 매춘에 관하여, 성령께서는 여러 곳에서 예언하시며 예언자 예레미야를 통하여 이렇게 말씀하십니다.


    “남편이 아내와 이혼하고 그 여자가 가서 다른 남자를 맞이하였다면, 그 여자가 다시 그에게 돌아갈 수 있겠느냐? 그 여자는 완전히 더럽혀지지 않았겠느냐? 주께서 말씀하셨다. ‘너는 많은 목자들과 매춘하고도 내게 돌아왔다. 눈을 들어 자세히 보아라. 네가 어디에서 매춘하였는지 보아라. 네가 길거리에 앉아 네 매춘과 악행으로 땅을 더럽히지 않았느냐? 너는 많은 목자들을 네게 걸림돌이 되게 하였다. 너는 누구에게나 부끄러움을 몰랐다. 너는 나를 친족이나 아버지나 네 처녀성을 지켜 주는 이로 부르지 않았다.’” (예레미야 3:1–4)


    또한 예언자 호세아의 글에는 이렇게 기록되어 있습니다.


    “자, 너희 어머니를 고발하여라. 그 여자는 내 아내가 되지 않을 것이며, 나도 그의 남편이 되지 않을 것이다. 나는 그 여자가 내 앞에서 행하는 매춘을 없애고, 그의 두 젖가슴 사이에서 간음을 없애겠다. 그 여자가 태어난 날처럼 그를 벌거벗기고, 그를 광야로 만들며 물 없는 땅처럼 만들고, 그가 [자식 없이 애타게] 하겠다.[a] 나는 그의 자녀들을 불쌍히 여기지 않겠다. 그들은 매춘으로 낳은 자녀들이기 때문이다. 그들의 어머니는 매춘하였고, [자기 자녀들에게 수치스럽게 행동하였다].[b] [][c] 그 여자는 이렇게 말하였다. ‘나는 내 연인들을 따라가 매춘하겠다. 그들이 내 빵과 물, 내 겉옷과 속옷, 내 포도주와 기름과 내가 필요로 하는 모든 것을 주었다.’ 그러므로 보아라. 내가 그들을 가두어, 그 여자가 자기 연인들을 뒤쫓지 못하게 하겠다. 그 여자가 그들을 찾아도 만나지 못하면 이렇게 말할 것이다. ‘내가 이전 남편에게 돌아가겠다. 그때가 지금보다 더 좋았다.’” (호세아 2:2–7)


    또한 에스겔의 글에서는 이렇게 말씀하십니다.


    “주께서 말씀하셨다. ‘수많은 악행을 저지른 뒤에 너는 매음굴을 짓고 길거리에 네 아름다움을 위한 자리를 만들었다. 너는 거리마다 매음굴을 짓고 네 아름다움을 탕진하였으며, 골목마다 다리를 벌리고 매춘을 거듭하였다. 너는 네 이웃인 이집트의 아들들, 곧 살집이 큰 남자들과 매춘하였다.’” (에스겔 16:23–26)


    그러면 “이집트의 아들들, 곧 살집이 큰 남자들”이란 무엇을 뜻하겠습니까? 육체의 왕국과 감각으로 지각되는 영역과 땅의 일들을 가리키는 것이 아니고 무엇이겠습니까? 영혼은 그것들에게서 빵과 포도주와 기름과 옷을 얻으며, 몸을 둘러싼 그 밖의 감각 없는 외적 사물들, 곧 자신에게 필요하다고 믿는 것들을 얻습니다. 바로 그것들이 이곳에서 영혼을 더럽힙니다.


    그러나 구주의 사도들은 이 매춘에 관하여 “그것을 경계하고, 그것에서 자신을 깨끗하게 하십시오”라고 거듭 당부하였습니다. 이것은 육체의 매춘만이 아니라, 특히 영혼의 매춘에 해당합니다. 이 때문에 사도들은 하나님의 [교회들에게][d] 편지를 써서, [이러한 종류의 매춘이][e] 우리 가운데 생기지 않도록 하였습니다.


    그렇지만 가장 어려운 [과제][f]는 영혼의 매춘 [][g]에 관한 것입니다. 육체의 매춘도 거기에서 생겨납니다. 그러므로 바울은 고린도 사람들에게 편지하며 이렇게 말하였습니다. “내가 편지에 ‘매춘하는 자들과 어울리지 마십시오’라고 썼습니다. 이는 이 세상의 매춘하는 자들이나 탐욕스러운 자들이나 강도들이나 우상 숭배자들을 전혀 가리킨 것이 아닙니다. 그렇게 하려면 여러분이 세상 밖으로 나가야 할 것입니다.” (고린도전서 5:9–10) 여기에서 그는 영적으로 말하고 있습니다. 그가 말한 것처럼, “우리의 싸움은 살과 피를 상대하는 것이 아니라, 이 어둠의 세상 통치자들과 악의 영들을 상대하는 것입니다.” (에베소서 6:12)


    영혼이 이리저리 계속 돌아다니며 만나는 이마다 성관계를 맺고 자신을 더럽히는 동안에는, 그에 합당한 고통을 겪습니다.


