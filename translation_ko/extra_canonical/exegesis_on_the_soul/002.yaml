id: EXSO.002
reference: Exegesis on the Soul — The Prostitution of the Soul according to the Scriptures
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'Now, regarding the prostitution of the soul, the Holy Spirit prophesies in many places, saying in the prophet Jeremiah:


    If a husband divorces his wife and she goes and takes another man, can she go back to him again? Has not that woman completely polluted herself? “And you played the harlot to many shepherds and you returned to me,” said the Lord. “Take a clear look and see where you played the harlot. Were you not sitting in the streets polluting the land with your harlotries and your wickedness? And you took many shepherds as a stumbling block to you. With everyone you were without shame. You called not on me as a relative or as father or guardian of your virginity.” (Jeremiah 3:1-4)


    Again, it is written in the prophet Hosea:


    “Come, go to court with your mother, for she will not be a wife to me, and I will not be a husband to her. I shall take away her harlotry from before me, and I shall take away her adultery from between her breasts. I shall strip her naked as on the day she was born, and I shall make her a wilderness like a waterless land, and I shall make her [yearn in childlessness]. I will not have compassion on her children, for they are children of harlotry, because their mother played the harlot and [acted shamefully to her children]. [] For she said, ‘I shall play the harlot to my lovers. They gave me my bread and my water, and my vesture and my garments, and my wine and my oil, and everything I had need of.’ Behold, therefore, I shall close them in so that she cannot run after her lovers. And when she seeks them but does not find them, she will say, ‘I shall go back to my former husband; I was better off then than now.’” (Hosea 2:2-7)


    Again, he says in Ezekiel:


    “It came to pass after much wickedness,” said the Lord, “you built a brothel and you made a place for your beauty in the streets. And you built brothels on every street, and you squandered your beauty, and you spread your legs in every alley, and you multiplied your acts of harlotry. You played the harlot to the sons of Egypt, your neighbors, men great of flesh.” (Ezekiel 16:23-26)


    What, however, does “the sons of Egypt, men great of flesh” mean, except the kingdom of the flesh and the perceptible realm and earthly affairs, which sully the soul here, obtaining bread from them, and wine besides, and oil, garments, and further senseless external things around the body, things she believes are necessary for her?


    Regarding this prostitution, however, the apostles of the Savior insisted: “Guard yourselves from it; purify yourselves from it.” This pertains not only to bodily prostitution, but especially of the soul. For this cause the apostles write [to the churches] of God, so that [this kind (of prostitution)] might not happen among us.


    Nevertheless, the most difficult [challenge] pertains to the prostitution [] of the soul. From it originates also bodily prostitution. Therefore Paul, writing to the Corinthians, said, “I wrote you in the letter, ‘Do not associate with prostitutes,’ not at all (referring to) the prostitutes of this world or the greedy or robbers or idolaters, because then you would need to leave the world.” (1 Corinthians 5:9-10). In this case he is speaking spiritually, “For our struggle is not against flesh and blood,” as he said, “but against the world rulers of this darkness and the spirits of wickedness.” (Ephesians 6:12)


    For as long as the soul continues running around everywhere, having sex with everyone she meets and sullying herself, she suffers what she deserves.'
