lexical_decisions:
- source_word: prostitution / played the harlot
  choice: 매춘 / 매춘하다
  rationale: 영혼을 여성으로 의인화한 글 전체의 성적·예언자적 은유를 일관되게 보존하면서도 현대 독자가 이해할 수 있는 직접적인 표현입니다.
- source_word: shepherds
  choice: 목자들
  rationale: 인용문의 비유적 가능성을 해석으로 대체하지 않고 원 증언의 표현을 그대로 보존합니다.
- source_word: perceptible realm
  choice: 감각으로 지각되는 영역
  rationale: 철학적 의미를 살리면서 일반 독자에게 ‘감각적’의 다른 현대적 함의를 피하도록 풀어 옮겼습니다.
- source_word: men great of flesh
  choice: 살집이 큰 남자들
  rationale: 성서 인용의 육체적이고 노골적인 표현을 완곡하게 신학화하지 않고 유지합니다.
- source_word: senseless external things
  choice: 무감각한 외적 사물들
  rationale: ‘senseless’를 ‘무의미한’으로 단정하지 않고 지각 능력이 없는 물질적 대상이라는 가능한 뜻을 보존합니다.
- source_word: having sex
  choice: 성관계를 맺고
  rationale: 노골적 의미를 보존하되 현대 한국어의 품위 있는 서술어를 사용합니다.
theological_decisions:
- issue: 영혼의 매춘과 육체의 매춘의 관계
  choice: 저자의 진술대로 영혼의 매춘을 특히 강조하고 육체의 매춘도 거기에서 생긴다고 번역함
  alternative: 모든 성적 죄를 단순히 우상 숭배의 비유로 환원함
  rationale: 본문이 영적 해석을 제시하면서도 육체의 매춘을 부정하지 않으므로 그 긴장을 보존했습니다.
- issue: 바울 인용문의 ‘영적으로’라는 해석
  choice: 저자가 바울의 말을 영적으로 이해한다고 명시한 그대로 유지함
  alternative: 바울 서신의 정경적 문맥에 맞추어 인용을 교정하거나 조화시킴
  rationale: 이 문서는 해당 구절을 독자적으로 해석하므로, 번역자가 그 해석을 수정하지 않았습니다.
- issue: 성서 인용의 비표준적 문구
