translation:
  language: ko
  text: '이스라엘이 하나님께 탄식하고 노예살이의 압제 때문에 울부짖지 않았더라면, 처음에 찾아오심을 받아 이집트 땅, 곧 종살이하던 집에서 구출되는 일은 결코 없었을 것입니다.[a]


    또 시편에는 이렇게 기록되어 있습니다.


    “나는 탄식하다가 몹시 지쳤습니다.

    밤마다 눈물로 내 침상을 물에 잠기게 하고

    내 잠자리를 흠뻑 적십니다.

    나는 내 모든 원수 가운데서 늙어 버렸습니다.

    악을 행하는 자들아, 모두 내게서 떠나십시오.

    보십시오, 주님께서 내 울음소리를 들으셨고,

    주님께서 내 기도를 받아들이셨습니다.” (시편 6:6-9)[b]


    우리가 회개하면, 오래 참으시고 자비가 풍성하신 하나님께서 반드시 우리의 말을 들어 주실 것입니다. 그분께 영광이 영원무궁하도록 있기를 빕니다. 아멘!


    《영혼에 관한 해설》'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 콥트어 원문에 대한 직접 검토는 아직 이루어지지 않았습니다.
    reason: 자료 자체가 원어 검토 대기 상태임을 독자에게 투명하게 알리기 위해서입니다.
  - marker: b
    text: 인용문의 절 구분과 일부 표현은 이 작품이 전하는 시편 인용 형태를 따릅니다. 오늘날의 성경 번역이나 절 번호와 세부적으로 다를 수 있습니다.
    reason: 본문 내 인용이 특정 현대 성경 번역이 아니라 고대 작품 속 인용임을 분명히 하기 위해서입니다.
lexical_decisions:
- source_word: visited
  choice: 찾아오심을 받아
  rationale: 성경적 ‘돌보아 개입하다’라는 뜻을 살리면서, 단순한 방문으로 축소하지 않도록 피동 표현을 사용했습니다.
- source_word: house of bondage
  choice: 종살이하던 집
  rationale: 출애굽 전승의 관용적 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: groaned ... moaned
  choice: 탄식하고 … 울부짖지
  rationale: 서로 가까운 두 동사의 반복과 고통의 강도를 보존했습니다.
- source_word: tyranny of its slavery
  choice: 노예살이의 압제
  rationale: 강제된 예속과 폭압이라는 두 의미를 간결하게 함께 나타냈습니다.
- source_word: patient and richly merciful
  choice: 오래 참으시고 자비가 풍성하신
  rationale: 전통적인 성경 어휘를 유지하되 현대 독자가 쉽게 이해할 수 있게 했습니다.
theological_decisions:
- issue: 이스라엘의 탄식과 하나님의 구원 개입 사이의 조건 관계
  choice: ‘않았더라면 … 결코 없었을 것입니다’로 원문의 강한 조건문을 유지
  alternative: 하나님이 탄식을 계기로 구원하셨다고 완화하여 표현
  rationale: 본문이 제시하는 수사적·신학적 긴장을 해소하지 않고 그대로 보존했습니다.
- issue: ‘visited’의 신적 개입 의미
  choice: ‘찾아오심을 받아’로 번역
  alternative: ‘돌보심을 받아’ 또는 ‘방문을 받아’
  rationale: 돌보심과 역사적 개입을 함께 암시하면서 원문의 방문 은유도 남겼습니다.
- issue: 회개하면 하나님이 들으신다는 확언
  choice: ‘반드시 우리의 말을 들어 주실 것입니다’로 확정성을 유지
  alternative: ‘들어 주실 수 있습니다’로 가능성만 표현
  rationale: 원문의 surely를 약화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 논증 부분은 품위 있고 명료한 산문으로, 시편 인용은 행갈이를 유지한 기도문체로 옮겼습니다. 웹사이트의 FAQ, 연락처, 제휴 고지는 작품 본문이 아니므로 제외했습니다.
