  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: ko
  text: '### 오디세우스와 헬레네의 회개


    그러므로 시인의 작품에 다음과 같이 기록되어 있습니다.[a]


    > 오디세우스는 섬에 앉아 괴로워하고 슬퍼하며,

    >

    > 칼립소의 말과 매혹에서 얼굴을 돌리고,

    >

    > 자기 마을과 그곳에서 피어오르는 연기를 다시 보기를 간절히 바랐습니다.

    >

    > 그가 하늘의 도움을 [받지] 않았다면,

    >

    > [자기 마을로 돌아갈 수 없었을 것입니다].[b]

    >

    > (호메로스, 《오디세이아》 1.48–1.59)


    또 [헬레네도] 이렇게 말합니다.


    > 내 마음은 내 안에서 바뀌었습니다.

    >

    > [] 나는 내 집으로 돌아가고자 합니다.

    >

    > (호메로스, 《오디세이아》 4.260–261)


    그녀는 탄식하며 이렇게 말했습니다.


    > 나를 그릇된 길로 이끌고

    >

    > 내 마을에서 데려간 이는 아프로디테입니다.

    >

    > 나는 내 딸을 버렸고,

    >

    > 선하고 총명하며 잘생긴 내 남편도 버렸습니다.

    >

    > (호메로스, 《오디세이아》 4.261–264)


    영혼이 생식 행위를 통해 이곳에 생겨나는 아프로디테의 불충실함 때문에 자신의 완전한 남편을 버리면, 영혼은 해를 입게 됩니다. 그러나 영혼이 탄식하며 회개하면 자기 집으로 돌려보내질 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 나그함마디 문서 II,6의 콥트어 본문에 대한 직접 검토는 아직 이루어지지 않았습니다.
    reason: 직접 원어 검토가 보류된 상태라는 본문 비평상의 한계를 투명하게 밝힙니다.
  - marker: b
    text: 대괄호는 제공된 증언에서 본문 복원 또는 사본 훼손을 표시한 것입니다. 내용이 없는 ‘[]’도 그 표시를 그대로 보존한 것입니다. 호메로스 작품의 행 번호 역시 제공된 증언을 따랐습니다.
    reason: 복원된 문구와 결락 표지를 번역자가 임의로 확정한 본문으로 오해하지 않도록 합니다.
lexical_decisions:
- source_word: village
  choice: 마을
  rationale: ‘고향’으로 의미를 넓히기보다 제시된 증언의 구체적 공간 표현을 보존했습니다.
- source_word: Heaven
  choice: 하늘
  rationale: 초월적 도움의 출처를 나타내되, 원문 증언이 명시하지 않은 특정 신명이나 교리적 해석을 덧붙이지 않았습니다.
- source_word: charms
  choice: 매혹
  rationale: 말과 함께 오디세우스를 붙드는 칼립소의 유혹적 힘을 자연스럽고 함축적으로 나타냈습니다.
- source_word: disloyalty
  choice: 불충실함
  rationale: 배신이나 음행으로 뜻을 좁히지 않고 관계적 불성실이라는 긴장을 유지했습니다.
- source_word: act of begetting
  choice: 생식 행위
  rationale: ‘출산’이나 ‘창조’로 한정하지 않고 낳음·생성의 신체적 행위를 비교적 직접적으로 옮겼습니다.
- source_word: repents
  choice: 회개하면
  rationale: 문맥의 도덕적·영적 방향 전환을 드러내며, 바로 앞의 탄식과 구별했습니다.
theological_decisions:
- issue: ‘아프로디테’와 생식 행위의 관계
  choice: ‘생식 행위를 통해 이곳에 생겨나는’이 아프로디테를 수식하도록 유지했습니다.
  alternative: 생식 행위 때문에 아프로디테의 불충실함이 생긴다고 풀이할 수 있습니다.
  rationale: 제시된 영어 증언의 관계절 구조가 아프로디테를 선행사로 삼으므로 이를 따르되, 난해한 우주론적 함의를 해설로 확정하지 않았습니다.
- issue: 영혼의 성별화와 혼인 비유
  choice: ‘영혼’과 ‘자신의 완전한 남편’이라는 표현을 그대로 유지했습니다.
  alternative: 영혼을 명시적으로 ‘그녀’라고 반복하거나 남편을 신적 존재로 특정할 수 있습니다.
  rationale: 본문의 여성적 혼인 비유는 보존하되, 한국어에서 불필요한 여성 대명사를 덧붙이거나 남편의 정체를 교리적으로 확정하지 않았습니다.
- issue: 귀환의 수동 표현
  choice: ‘자기 집으로 돌아가게 될 것입니다’로 옮겼습니다.
  alternative: ‘누군가가 영혼을 집으로 돌려보낼 것입니다’로 행위자를 암시할 수 있습니다.
  rationale: 수동성과 회복의 약속은 살리면서도 원문 증언에 명시되지 않은 행위자를 추가하지 않았습니다.
translation_notes:
  register: 해설 문장은 현대 표준어 합쇼체로 통일하고, 인용시는 격조를 유지하면서도 평이하게 읽히도록 구성했습니다. 신화적 고유명사와 영혼의 혼인 비유는 낯섦을 제거하려 의역하지 않았으며, 사본의 대괄호와 빈 결락 표지를 그대로 보존했습니다.
