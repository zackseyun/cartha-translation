  source_fidelity: 전반적으로 제공된 영어 증언을 충실히 따르며, 대괄호 복원 표지와 빈 결락 표지도 보존했습니다. 다만 헬레네 인용의 “it is to my home I would return”은 귀환의 의향을 말하는데, 초안의 “내가 돌아가고 싶은 곳은 바로 내 집입니다”는 이를 장소를 정의하는 문장으로 바꾸어 의미를 약화·변경합니다. 마지막 문장의 수동형 “she will be returned”도 한국어에서 가능한 범위에서 수동성을 더 분명히 하는 편이 좋습니다.
