translation:
  language: ko
  text: '[a] 오래전에 현자들은 영혼에 여성형 이름을 붙였습니다. 영혼은 실제로 본성상 여성이며, 자궁도 있습니다.


    영혼이 아버지와 단둘이 머물러 있는 동안에는 처녀였고, 그 형상은 양성이었습니다. 그러나 영혼이 한 몸 안으로 떨어져 이 삶에 들어왔을 때, 많은 강도의 손에 떨어졌습니다. 그 잔혹한 자들은 영혼을 서로 넘겨주며 [능욕했습니다].[b] 어떤 자들은 폭력으로 영혼을 취했고, 다른 자들은 선물로 유혹했습니다. 간단히 말해, 그들은 영혼을 더럽혔고, 영혼은 [잃었습니다] [c] 처녀성을.


    영혼은 몸 안에서 매춘을 일삼으며 아무도 가리지 않고 자신을 내주었고, 자기가 껴안을 준비가 된 자마다 남편이라고 여겼습니다. 영혼은 잔혹하고 신의 없는 간음하는 자들에게 자신을 내맡겨 그들이 자신을 함부로 다루게 한 뒤에야, 깊이 탄식하며 회개했습니다.


    그러나 영혼은 그 간음하는 자들에게서 얼굴을 돌리고 나서도 다른 자들에게 달려갔습니다. 그들은 마치 자기들이 주인인 양 영혼에게 자기들과 함께 살며 침상에서 시중들도록 강요했습니다. 영혼은 수치스러워서 더는 감히 그들을 떠나지 못했습니다. 그들은 영혼을 크게 존중하는 듯, 충실하고 참된 남편인 체하며 오랫동안 영혼을 속였습니다. 그러다가 이 모든 일이 지난 뒤에 그들은 영혼을 버리고 떠나갔습니다.


    그 뒤 영혼은 의지할 데 없고 가난하며 외로운 과부가 되었습니다. 고난의 때에 영혼에게는 한 조각의 음식도 남아 있지 않았습니다. 영혼이 그들에게서 얻은 것이라고는 성관계로 말미암은 더러움뿐이었습니다. 그리고 간음하는 자들에게서 낳은 영혼의 자녀들은 말하지 못하고, 보지 못하며, 병들고, 지각이 약합니다.[d]


    그러나 높으신 아버지께서 영혼을 찾아오셔서 바라보시고, 영혼이 고통과 수치 속에서 탄식하며 자기가 일삼은 매춘을 회개하는 것을 보셨을 때, 또 영혼이 도움을 구하려고 아버지의 이름을 부르기 시작했을 때, 영혼은 [탄식하며] 온 마음으로 말했습니다. “나를 구해 주십시오, 나의 아버지. 나를 바라보아 주십시오. 제가 [아버지께 해명하겠습니다].[e] 제가 제 집을 버리고 [f] 처녀의 방에서 달아났기 때문입니다. 저를 다시 아버지께로 돌려놓아 주십시오.”


    아버지께서 영혼의 이런 처지를 보시면, 영혼에게 자비를 베풀 만하다고 여기실 것입니다. 영혼이 자기 집을 버렸기 때문에 당한 고난이 많기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫머리의 빈 대괄호는 제공된 영어 증언에서 본문 훼손 또는 누락을 표시합니다. 콥트어 원문 대조가 아직 필요합니다.
    reason: 증언의 문두 결손 신호를 보존하고 번역의 잠정성을 알리기 위해서입니다.
  - marker: b
    text: ‘[능욕했습니다]’는 훼손된 부분에 대한 편집자의 복원입니다.
    reason: 복원된 폭력적 성행위 표현이 확정된 원문과 동일한 수준의 증거를 갖지 않음을 표시하기 위해서입니다.
  - marker: c
    text: ‘[잃었습니다]’ 뒤의 빈 대괄호는 제공된 증언에 또 다른 훼손 또는 누락 표시가 있음을 나타냅니다.
    reason: 연속된 복원 및 결손 표지를 한국어 본문에서도 빠뜨리지 않기 위해서입니다.
  - marker: d
    text: ‘지각이 약합니다’는 영어 증언의 ‘weak-minded’를 옮긴 말입니다. 정확한 콥트어 어휘의 직접 검토가 필요합니다.
    reason: 현대 독자에게 불필요하게 모욕적인 표현을 피하면서도 원문의 결함 묘사를 숨기지 않기 위해서입니다.
  - marker: e
    text: ‘[아버지께 해명하겠습니다]’는 영어 증언에서 복원된 ‘[an account to you]’에 따른 잠정 번역입니다.
    reason: 구문과 복원의 의미가 불확실하므로 해석을 확정하지 않기 위해서입니다.
  - marker: f
    text: 이 지점의 빈 대괄호는 제공된 증언의 훼손 또는 누락 표시를 그대로 반영합니다.
    reason: 원자료의 본문 상태를 투명하게 드러내기 위해서입니다.
lexical_decisions:
- source_word: soul (Coptic review pending)
  choice: 영혼
  rationale: 문서의 중심 의인화 개념을 한국어 독자가 즉시 알아볼 수 있는 통상적이고 존엄한 용어로 옮겼습니다.
- source_word: androgynous
  choice: 양성
  rationale: 남성과 여성의 성격을 함께 지닌 형상이라는 의미를 간결하게 보존하며, 이를 현대적 성 정체성 범주로 과도하게 규정하지 않았습니다.
- source_word: robbers
  choice: 강도
  rationale: 폭력적으로 빼앗고 해치는 자들이라는 비유를 유지했습니다.
- source_word: practiced prostitution
  choice: 매춘을 일삼으며
  rationale: 반복적 행위를 나타내면서도 원문의 노골적인 성적·도덕적 비유를 완화하지 않았습니다.
- source_word: adulterers
  choice: 간음하는 자들
  rationale: 단순한 ‘연인’이나 ‘배우자’가 아니라 불성실하고 불법적인 성적 관계라는 원문의 긴장을 보존했습니다.
- source_word: visited
  choice: 찾아오셔서
  rationale: 아버지가 영혼의 처지를 살피기 위해 다가온다는 문맥에 자연스럽게 맞추되, 구원의 결과를 미리 확정하지 않았습니다.
- source_word: weak-minded
  choice: 지각이 약합니다
  rationale: 현대 한국어에서 모욕적으로 들릴 수 있는 표현을 피하면서 인지적 결함을 뜻하는 증언의 의미를 보존했습니다.
theological_decisions:
- issue: 영혼의 여성성 및 인격화
  choice: ‘영혼’을 반복해 여성 인물처럼 서술하되 한국어의 성별 대명사를 억지로 사용하지 않음
  alternative: ‘그녀’를 지속적으로 사용함
  rationale: 원문의 여성적 의인화는 자궁, 처녀성, 과부 등의 표현으로 분명히 보존되며, 자연스러운 현대 한국어 문체를 위해 명사 반복을 택했습니다.
- issue: 아버지와 함께 있을 때 영혼의 양성적 형상
  choice: ‘그 형상은 양성이었습니다’
  alternative: ‘남녀 양성을 모두 지녔습니다’ 또는 이를 단성적 존재로 해석함
  rationale: 본문의 역설과 존재론적 긴장을 해소하지 않고 간결하게 남겼습니다.
- issue: 타락의 원인과 책임
  choice: 몸으로의 추락, 강제적 능욕, 자발적 매춘과 회개를 모두 그대로 병치함
  alternative: 영혼을 오직 피해자 또는 오직 자발적 죄인으로 통일함
  rationale: 본문 자체가 강제와 유혹, 자발적 내맡김을 함께 말하므로 그 긴장을 유지했습니다.
- issue: 아버지의 자비가 조건적인지 확정적인지
  choice: 미래·판단 표현인 ‘자비를 베풀 만하다고 여기실 것입니다’를 유지함
  alternative: ‘반드시 자비를 베푸실 것입니다’
  rationale: 증언의 ‘will consider her worthy’가 가진 평가와 미래의 뉘앙스를 구원 확정으로 강화하지 않았습니다.
- issue: ‘account’의 불확실한 복원
  choice: ‘[아버지께 해명하겠습니다]’
  alternative: ‘[아버지께 말씀드리겠습니다]’ 또는 ‘[아버지께 셈을 바치겠습니다]’
  rationale: 문맥상 아버지 앞에서 자신의 처지를 진술한다는 뜻으로 옮겼으나, 복원문임을 대괄호로 명시하여 불확실성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 서술부도 ‘-습니다’로 통일하고, 아버지에 관한 동사에는 문맥상 자연스러운 높임을 적용했습니다. 성적 폭력과 매춘의 비유는 완곡하게 지워 버리지 않았으나 선정적으로 확대하지 않았습니다. 제공 자료가 공공 영역 영어 증언에 근거하고 콥트어 직접 검토가 보류 중이므로, 모든 대괄호와 결손 신호를 보존한 잠정 출판 초안입니다.
