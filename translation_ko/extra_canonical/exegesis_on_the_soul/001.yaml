    그러나 영혼은 그 간음하는 자들에게서 얼굴을 돌리고 나서도 다른 자들에게 달려갔습니다. 그들은 마치 자신들이 영혼의 주인인 양, 영혼에게 자기들과 함께 살며 그들의 침상에서 섬기도록 강요했습니다. 영혼은 수치스러워서 더는 감히 그들을 떠나지 못했습니다. 그들은 영혼을 크게 존중하는 듯, 충실하고 참된 남편인 체하며 오랫동안 영혼을 속였습니다. 그러다가 이 모든 일이 있은 뒤에 그들은 영혼을 버리고 떠나갔습니다.


