review_pass:
  verdict: revise
  source_fidelity: 대체로 제공된 영어 증언을 충실히 따르며, 손상·보충 표지와 문헌 내부의 비정형 인용도 잘 보존했습니다. 다만 첫 문장의 ‘겉치레의’는 outwardly에 없는 위선·과시의 뜻을 더하고, ‘영혼의 말을 들으시고’는 하나님께서 영혼 자체의 부르짖음을 들으신다는 표현을 다소 좁힙니다. 이를 바로잡았습니다.
  naturalness: 현대 표준 한국어 합쇼체는 전반적으로 자연스럽습니다. 다만 첫 단락의 연속된 당위 표현을 원문의 긴밀한 수식 관계에 맞춰 정돈하고, ‘깊은 속’과 ‘거짓을 말하는 자들’ 등의 표현을 문맥에 더 맞게 다듬었습니다.
  terminology: ‘아버지’, ‘구주’, ‘성령’, ‘영혼’, ‘회개’, ‘구원’, ‘하나님’은 일관되고 적절합니다. 누가복음 인용의 ‘영혼’ 및 ‘미워하다’의 긴장은 각주로 적절히 보존되어 있습니다. ‘duplicity’를 ‘두 마음’으로 옮긴 선택도 문맥상 타당합니다.
  issues:
  - severity: medium
    issue: ‘입술로 겉치레의 탄식을 할 것이 아니라’
    rationale: 영어 증언의 ‘not outwardly with the lips’는 입술로 겉으로 탄식하는 것과 내면의 영으로 탄식하는 것을 대비할 뿐, ‘겉치레’가 함축하는 과시·위선까지 명시하지 않습니다.
  - severity: low
    issue: ‘자신을 부르는 영혼의 말을 들으시고’
