  revised_text: '그러므로 우리는 온 영혼을 다해 아버지께 기도하고 그분을 불러야 합니다. 입술로 겉으로 탄식하지 말고, 깊은 곳에서 나오는 내면의 영으로 탄식하면서, 전에 살던 삶을 회개하고, 죄를 고백하며, 우리가 살아온 헛된 거짓과 공허한 열심을 깨달아야 합니다. 우리를 집어삼킨 어둠과 파도 때문에 통곡하고, 그분이 우리를 불쌍히 여기시도록 우리 자신을 두고 울며, 지금 우리의 모습 때문에 우리 자신을 미워해야 합니다.[a]



    구주께서 다시 말씀하셨습니다.



    “슬퍼하는 사람들은 복이 있습니다. 그들이 불쌍히 여김을 받을 것이기 때문입니다.


    주린 사람들은 복이 있습니다. 그들이 배부르게 될 것이기 때문입니다.” (마태복음 5:4, 6; 누가복음 6:21)



    그분은 또 말씀하셨습니다. “자기 영혼을 미워하지 않는 사람은 나를 따를 수 없습니다.”[b] (누가복음 14:26)



    이는 회개가 구원의 시작이기 때문입니다. 그러므로 “그리스도께서 나타나시기 전에 요한이 와서 회개의 세례를 선포했습니다.” (사도행전 13:24)



    회개는 고통과 슬픔 가운데 일어납니다. 그러나 아버지는 선하시고 사람을 사랑하십니다. 그분은 자신을 부르는 영혼의 부르짖음을 들으시고 그 영혼에게 구원의 빛을 보내십니다. 그러므로 그분은 성령을 통하여 예언자에게 말씀하셨습니다.



    내 백성의 자녀들에게 말하여라.



    “[만일] 너희 죄가 [땅에서] 하늘까지 닿고,


    진홍처럼 [붉으며],


    굵은 베보다 더 검을지라도,


    [그리고 만일] [……] 너희가 온 영혼을 다해 내게 돌아와


    ‘나의 아버지!’라고 말한다면,


    나는 거룩한 백성인 너희의 말에 귀를 기울이겠다.”[c] (클레멘스의 첫째 편지 8:3)



    또 다른 구절에는 이렇게 기록되어 있습니다. “이스라엘의 거룩하신 분, 주께서 이렇게 말씀하십니다. ‘너희가 돌아와 울면 구원을 받을 것이며, 헛된 것에 희망을 두었을 때 너희가 어디에 있었는지 깨닫게 될 것이다.’” (이사야 30:15)



    또 다른 구절에서 그분은 말씀하셨습니다.



    예루살렘은 크게 울며 “나를 불쌍히 여겨 주십시오”라고 말했습니다. 그분은 네가 우는 소리를 들으시고 너에게 은혜를 베푸실 것입니다. 그분은 보시고 너에게 응답하셨습니다. 주께서는 너에게 고난의 빵과 괴로움의 물을 주실 것입니다. 이제부터 너에게 거짓을 말하는 자들이 다시는 너에게 다가오지 못할 것입니다. 네 눈이 너에게 거짓을 말하는 자들을 보게 될 것입니다.[d] (이사야 30:19–20)



    그러므로 우리는 밤낮으로 하나님께 기도하며, 바다 한가운데서 항해하는 사람들처럼 그분께 두 손을 펼쳐야 합니다. 그들은 두 마음을 품지 않고 온 마음으로 하나님께 기도합니다. 두 마음으로 기도하는 사람들은 자기 자신을 속일 뿐이기 때문입니다. 실제로 하나님께서는 누가 구원받기에 합당한지 아시기 위해 깊은 속을 살피시고 마음의 깊은 곳을 헤아리십니다. 아직도 거짓의 처소를 사랑하는 사람은 아무도 구원받기에 합당하지 않기 때문입니다.'
