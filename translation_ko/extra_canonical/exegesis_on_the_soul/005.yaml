base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/005.yaml
  text: 'And so it is right to pray to the Father and call on him with our whole soul, sighing not outwardly with our lips, but with the inward spirit that comes from the depths. We must repent of the former life we lived, confess our sins, recognize the empty lie in which we lived and our hollow zealotry, wail because of the darkness and the wave that engulfed us, and weep for ourselves so that he may have compassion on us, hating ourselves because of what we are now.


    The Savior said again:


    “Blessed are those who mourn, for they will be shown pity.

    Blessed are those who are hungry, for they will be filled.” (Matthew 5:4,6; Luke 6:21)


    He also said, “If someone does not hate his soul, he cannot follow me.” (Luke 14:26)


    This is because repentance is the beginning of salvation. And so, “Before Christ appeared, John came, preaching the baptism of repentance.” (Acts 13:24)


    Repentance takes place in pain and sorrow. The Father, however, is good and loves humanity. He listens to the soul that calls on him and sends it the light of salvation. Therefore, through the Spirit he said to the prophet:


    Say to the children of my people:

    “[If] your sins reach [from earth to] heaven,

    and if they are [red] as scarlet,

    and blacker than sackcloth,

    [and if] [] you return to me with your whole soul,

    and say to me, ‘My Father!’

    I will listen to you as a holy people.” (1 Clement 8:3)


    Yet another passage says, “Thus says the Lord, the Holy One of Israel: ‘If you return and weep, then you will be saved, and you will know where you were when you put your hope in what is empty.’” (Isaiah 30:15)


    And in another passage he said:


    Jerusalem wept greatly, saying, “Have pity on me.” He will be gracious to you at the sound of your weeping. When he saw, he answered you. The Lord will give you bread of adversity and water of affliction. From now on, those who lie to you will no longer approach you. Your eyes will see those who lie to you. (Isaiah 30:19-20)


    And so it is right to pray to God both night and day, stretching out our hands to him like those sailing in the middle of the sea. They pray to God with their whole heart and without duplicity, because those who pray with duplicity only lie to themselves. Indeed, so that he may know who deserves salvation, God examines the inward parts and searches the depths of the heart. For no one who is still in love with the place of lies deserves salvation.'
translation:
  language: ko
  text: '그러므로 우리는 온 영혼을 다해 아버지께 기도하고 그분을 불러야 합니다. 입술로 겉치레의 탄식을 할 것이 아니라, 깊은 곳에서 나오는 내면의 영으로 탄식해야 합니다. 전에 살던 삶을 회개하고, 죄를 고백하며, 우리가 살아온 헛된 거짓과 공허한 열심을 깨달아야 합니다. 우리를 집어삼킨 어둠과 파도 때문에 통곡하고, 그분이 우리를 불쌍히 여기시도록 우리 자신을 두고 울며, 지금 우리의 모습 때문에 우리 자신을 미워해야 합니다.[a]


    구주께서 다시 말씀하셨습니다.


    “슬퍼하는 사람들은 복이 있습니다. 그들이 불쌍히 여김을 받을 것이기 때문입니다.

    주린 사람들은 복이 있습니다. 그들이 배부르게 될 것이기 때문입니다.” (마태복음 5:4, 6; 누가복음 6:21)


    그분은 또 말씀하셨습니다. “자기 영혼을 미워하지 않는 사람은 나를 따를 수 없습니다.”[b] (누가복음 14:26)


    이는 회개가 구원의 시작이기 때문입니다. 그러므로 “그리스도께서 나타나시기 전에 요한이 와서 회개의 세례를 선포했습니다.” (사도행전 13:24)


    회개는 고통과 슬픔 가운데 일어납니다. 그러나 아버지는 선하시고 사람을 사랑하십니다. 그분은 자신을 부르는 영혼의 말을 들으시고 그 영혼에게 구원의 빛을 보내십니다. 그러므로 그분은 성령을 통하여 예언자에게 말씀하셨습니다.


    내 백성의 자녀들에게 말하여라.


    “[만일] 너희 죄가 [땅에서] 하늘까지 닿고,

    진홍처럼 [붉으며],

    굵은 베보다 더 검을지라도,

    [그리고 만일] [……] 너희가 온 영혼을 다해 내게 돌아와

    ‘나의 아버지!’라고 말한다면,

    나는 거룩한 백성인 너희의 말에 귀를 기울이겠다.”[c] (클레멘스의 첫째 편지 8:3)


    또 다른 구절에는 이렇게 기록되어 있습니다. “이스라엘의 거룩하신 분, 주께서 이렇게 말씀하십니다. ‘너희가 돌아와 울면 구원을 받을 것이며, 헛된 것에 희망을 두었을 때 너희가 어디에 있었는지 깨닫게 될 것이다.’” (이사야 30:15)


    또 다른 구절에서 그분은 말씀하셨습니다.


    예루살렘은 크게 울며 “나를 불쌍히 여겨 주십시오”라고 말했습니다. 그분은 네가 우는 소리를 들으시고 너에게 은혜를 베푸실 것입니다. 그분은 보시고 너에게 응답하셨습니다. 주께서는 너에게 고난의 빵과 괴로움의 물을 주실 것입니다. 이제부터 너에게 거짓말하는 자들이 다시는 너에게 다가오지 못할 것입니다. 네 눈이 너에게 거짓말하는 자들을 보게 될 것입니다.[d] (이사야 30:19–20)


    그러므로 우리는 밤낮으로 하나님께 기도하며, 바다 한가운데서 항해하는 사람들처럼 그분께 두 손을 펼쳐야 합니다. 그들은 두 마음을 품지 않고 온 마음으로 하나님께 기도합니다. 두 마음으로 기도하는 사람들은 자기 자신을 속일 뿐이기 때문입니다. 실제로 하나님께서는 누가 구원받기에 합당한지 아시려고 사람의 가장 깊은 속을 살피시고 마음의 깊은 곳을 헤아리십니다. 아직도 거짓의 처소를 사랑하는 사람은 아무도 구원받기에 합당하지 않기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 나그함마디 문서 II,6의 콥트어 본문에 대한 직접 대조는 아직 이루어지지 않았습니다.
    reason: 번역의 자료적 한계를 독자에게 투명하게 알립니다.
  - marker: b
    text: 여기서 ‘영혼’은 문맥에 따라 ‘목숨’ 또는 ‘자기 자신’을 포함할 수 있습니다. 강한 표현인 ‘미워하다’는 완화하지 않았습니다.
    reason: 고대 용어의 의미 범위와 말씀의 긴장을 보존합니다.
  - marker: c
    text: 대괄호는 전승된 본문의 손상 부분이나 보충된 말을 나타냅니다. 이 인용문은 『클레멘스의 첫째 편지』 8:3에 전해지는 형태이며, 여러 성경 구절을 결합한 문구입니다.
    reason: 본문 비평 표지와 복합 인용의 성격을 설명합니다.
  - marker: d
    text: 이사야서 인용은 오늘날의 표준 성경 본문과 어순, 시제, 대명사 및 내용에서 차이가 있습니다. 여기서는 이 문서에 전해진 독특한 인용 형태를 보존했습니다.
    reason: 낯선 인용문을 임의로 교정하지 않은 이유를 밝힙니다.
lexical_decisions:
- source_word: soul
  choice: 영혼
  rationale: 문서 전반의 인간 내면을 가리키는 핵심 용어를 일관되게 보존했습니다. 누가복음 인용에서는 ‘목숨’이나 ‘자기 자신’일 가능성을 각주로 밝혀 의미를 단정하지 않았습니다.
- source_word: repentance
  choice: 회개
  rationale: 삶에서 돌이키는 행위와 고통·슬픔을 함께 아우르는 초기 그리스도교 문맥의 통상적이고 이해하기 쉬운 용어입니다.
- source_word: hollow zealotry
  choice: 공허한 열심
  rationale: 부정적으로 평가되는 강렬한 열성을 나타내되, ‘광신’처럼 해석을 과도하게 강화하지 않았습니다.
- source_word: duplicity
  choice: 두 마음을 품음
  rationale: 기도자의 내적 분열과 불성실을 자연스러운 한국어로 나타내며, 단순한 언어적 거짓말로 의미를 축소하지 않았습니다.
- source_word: place of lies
  choice: 거짓의 처소
  rationale: 상징적 공간 표현을 그대로 살려 특정 세계관이나 교리 체계로 환원하지 않았습니다.
theological_decisions:
- issue: 자기 영혼을 ‘미워한다’는 말씀의 의미
  choice: 강한 원문 표현인 ‘자기 영혼을 미워하다’를 본문에 유지했습니다.
  alternative: ‘자기 목숨을 버리다’ 또는 ‘자기 자신보다 그리스도를 더 사랑하다’로 완화할 수 있습니다.
  rationale: 윤리적·신학적 긴장을 번역에서 미리 해소하지 않고, 의미 범위만 각주에 제시했습니다.
- issue: 구원받기에 ‘합당하다’는 진술
  choice: 공로 또는 자격을 뜻할 수 있는 표현을 그대로 ‘합당하다’로 옮겼습니다.
  alternative: ‘구원받을 사람’처럼 자격의 뉘앙스를 약화할 수 있습니다.
  rationale: 본문이 회개 및 진실한 기도와 구원을 연결하는 방식을 교리적으로 재구성하지 않았습니다.
- issue: 아버지가 사람을 사랑한다는 진술
  choice: ‘사람을 사랑하십니다’로 옮겼습니다.
  alternative: ‘인류를 사랑하십니다’ 또는 ‘인자하십니다’로 옮길 수 있습니다.
  rationale: 보편적 인간 사랑이라는 의미를 평이하게 전달하면서 특정 신학 전문어를 피했습니다.
- issue: 성경 및 초기 그리스도교 문헌 인용문의 형태
  choice: 제시된 문헌 안의 인용 형태와 혼합된 문구를 그대로 번역했습니다.
  alternative: 현대 성경 번역의 정형화된 문구로 교정할 수 있습니다.
  rationale: 저자가 사용한 인용 전승의 독특한 형태와 본문상의 긴장을 보존하기 위해 후대의 표준 본문에 맞추어 고치지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 논설 부분은 명료하고 자연스럽게 다듬되 반복적 권면의 리듬을 살렸고, 인용문은 고풍스러운 분위기를 지나치게 강화하지 않으면서 문헌적 성격을 보존했습니다. 신명은 ‘하나님’, Father는 문맥상 ‘아버지’, Savior는 ‘구주’, Spirit은 ‘성령’으로 옮겼습니다.
