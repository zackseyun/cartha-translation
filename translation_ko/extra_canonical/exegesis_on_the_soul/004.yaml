translation:
  language: ko
  text: '그 결혼은 육적인 결혼과 같지 않기 때문입니다. 서로 성관계를 맺는 이들은 그런 성관계로 만족할 것입니다. 그리고 마치 무거운 짐을 벗어 놓듯이 육체의 욕정이 주는 번거로움을 뒤에 남겨 두고, 서로에게서 [얼굴을 돌립니다]. 그러나 이 결혼은 [다릅니다].[a] 그들이 [서로 결합하면], 하나의 생명이 됩니다.


    [……] 이 때문에 예언자는 첫 남자와 첫 여자를 두고 이렇게 말했습니다. “두 사람이 한 육체가 될 것이다.” (창세기 2:24)[b]


    그들은 처음에 아버지와 함께 살 때 서로 결합되어 있었습니다. 그러다가 여자가 자기 형제인 남자를 그릇된 길로 이끌었습니다. 이 결혼은 그들을 다시 하나로 결합했고, 영혼은 자신의 참된 사랑이며 본래의 주인인 이와 하나가 되었습니다. 기록된 것과 같습니다. “여자의 주인은 그의 남편이다.” (창세기 3:16; 에베소서 5:23)[c]


    그 뒤 영혼은 한 걸음씩 그를 알아보았습니다. 영혼은 과부로 지내며 겪었던 지난날의 수치를 기억하고 그의 앞에서 울면서 다시 기뻐했습니다. 그리고 그가 자기와 함께 머무는 것을 기뻐하도록 자신을 더욱 아름답게 꾸몄습니다.


    예언자는 시편에서 이렇게 말했습니다.


    “딸아, 듣고 바라보며 네 귀를 기울여라.

    네 백성과 네 아버지의 집을 잊어라.

    그러면 왕이 네 아름다움을 사모할 것이다.

    그가 네 주인이기 때문이다.” (시편 45:10-11)


    예언자는 영혼에게, 한때 함께 살았던 자기 백성과 수많은 간부에게서 눈을 돌리고 오직 자기 왕이자 참된 주님께 자신을 바치라고 명합니다. 또한 형편이 참혹했던 땅의 아버지 집을 잊고, 그 대신 하늘에 계신 자기 아버지를 기억하라고 명합니다.


    그와 같이 아브라함에게도 이런 말씀이 주어졌습니다. “네 땅과 네 친족과 네 아버지의 집을 떠나라.” (창세기 12:1)


    이렇게 영혼은 다시금 찬란하게 [자신을 아름답게 꾸민] 뒤에, 사랑하는 이를 경배하기를 [바랐고], [그도] 영혼을 사랑했습니다. 영혼이 그와 하나가 되었을 때, 그에게서 [……] 생명을 주는 영의 씨를 받았습니다.[d] 영혼은 그 씨로 올바른 자녀들을 낳아 기릅니다. 이것이 위대하고 완전한 출생의 기적이기 때문입니다. 이처럼 이 결혼은 아버지의 뜻으로 완성됩니다.


    영혼은 자신을 새롭게 낳아 이전의 모습으로 다시 돌아가야 합니다. 그때 영혼은 자기 뜻으로 움직이며, 새롭게 되기 위해 아버지에게서 신적 본성을 받아 처음 있던 곳으로 회복됩니다.[e]


    이것이 죽은 자들 가운데서 일어나는 부활입니다.

    이것이 종살이에서 풀려나는 구속입니다.

    이것이 하늘로 올라가는 상승의 여정입니다.

    이것이 아버지께 올라가는 길입니다.


    그러므로 예언자는 이렇게 말했습니다.


    “내 영혼아, 주님을 찬양하여라.

    내 안에 있는 모든 것아, 그 거룩한 이름을 찬양하여라.

    내 영혼아, 하나님을 찬양하여라.

    그분은 네 모든 죄악을 용서하시고,

    네 모든 질병을 고치시며,

    네 생명을 죽음에서 속량하시고,

    자비로 네게 관을 씌우시며,

    좋은 것으로 네 갈망을 채워 주신다.

    네 젊음은 독수리처럼 새로워질 것이다.” (시편 103:1-5)[f]


    영혼은 다시 젊어진 뒤에 위로 올라가, 자신을 구원한 아버지와 자기 형제를 찬양할 것입니다. 이처럼 영혼은 다시 태어남으로 구원받습니다. 이것은 정해진 문구를 되풀이하거나, 학식과 전문 지식을 쌓거나, 책에서 배움으로 이루어지는 것이 아닙니다. 오히려 [영]의 은혜로 이루어지며, 자비로우신 [하나님]께서 주시는 선물입니다.[g] 이것이 이 하늘 현실에 이르는 길입니다.


    그러므로 구주께서 외치십니다. [……] “내 아버지께서 이끌어 내게 데려오지 않으시면 아무도 내게 올 수 없다. 내가 그를 마지막 날에 다시 일으킬 것이다.” (요한복음 6:44)[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 현존 본문의 손상되거나 불확실한 부분을 번역 증언에 따라 보충한 것입니다. 이 단락의 지시어와 대조 관계는 다소 불분명합니다.
    reason: 복원 표시와 문맥적 불확실성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 인용 앞에는 판독할 수 없는 결락이 있습니다. 창세기 2:24의 인용은 이 작품이 제시하는 형태를 따라 옮겼습니다.
    reason: 빈 대괄호로 표시된 사본 결락을 보존하기 위해서입니다.
  - marker: c
    text: “여자의 주인은 그의 남편이다”라는 문구에는 창세기 3:16과 에베소서 5:23이 함께 제시되어 있습니다. 두 본문 가운데 어느 하나와 정확히 일치하도록 조정하지 않았습니다.
    reason: 증언에 실린 복합 성경 참조와 인용상의 긴장을 보존하기 위해서입니다.
  - marker: d
    text: ‘그에게서’와 ‘생명을 주는 영의 씨’ 사이에는 판독할 수 없는 말이 있습니다. 그 밖의 대괄호는 보충된 본문을 나타냅니다.
    reason: 결락으로 인해 무엇을 받았는지에 관한 수식 관계가 완전하지 않음을 밝히기 위해서입니다.
  - marker: e
    text: 본문은 영혼이 ‘자기 뜻으로’ 움직인다고 하면서 동시에 새롭게 되는 데 필요한 ‘신적 본성’을 아버지에게서 받는다고 말합니다.
    reason: 행위와 은혜 가운데 하나로 의미를 좁히지 않고 본문의 긴장을 드러내기 위해서입니다.
  - marker: f
    text: 시편 인용의 어휘와 배열은 이 작품에 보존된 형태를 따랐으므로 현대 성경의 시편 103:1-5와 일부 다를 수 있습니다.
    reason: 성경 인용을 통용 번역에 맞추어 무리하게 조화하지 않았음을 알리기 위해서입니다.
  - marker: g
    text: ‘영’과 ‘하나님’은 손상된 본문을 문맥에 따라 보충한 말입니다. 고대어 원문에 대한 직접 대조 검토는 아직 필요합니다.
    reason: 핵심 신학 용어가 복원에 의존한다는 점을 투명하게 표시하기 위해서입니다.
  - marker: h
    text: 구주의 말씀 앞에는 판독할 수 없는 결락이 있습니다. 인용은 이 작품에 제시된 요한복음 6:44의 형태를 따랐습니다.
    reason: 결락과 인용 형태를 모두 보존하기 위해서입니다.
lexical_decisions:
- source_word: carnal marriage
  choice: 육적인 결혼
  rationale: ‘육체적 결혼’보다 문맥의 욕정·성관계와 영적 결혼의 대조를 자연스럽게 드러내면서도 가치 판단을 과도하게 덧붙이지 않았습니다.
- source_word: one life
  choice: 하나의 생명
  rationale: ‘한 삶’으로 완화하지 않고, 결합을 생명론적으로 표현하는 원문의 어감을 보존했습니다.
- source_word: master / lord
  choice: 주인 / 주님
  rationale: 배우자 관계를 설명하는 일반 명사에는 ‘주인’을, 시편 인용과 신적 호칭에는 ‘주님’을 사용하여 문맥상의 차이를 살렸습니다.
- source_word: seed of the life-giving spirit
  choice: 생명을 주는 영의 씨
  rationale: 출생과 자녀의 비유를 이어 주는 ‘씨’의 구체적 이미지를 유지하고, Spirit의 해석 가능성을 열어 두었습니다.
- source_word: divine nature
  choice: 신적 본성
  rationale: 영혼이 아버지에게서 받는 것의 존재론적 긴장을 ‘은혜’나 ‘능력’으로 바꾸지 않고 보존했습니다.
- source_word: regenerates herself / being born again
  choice: 자신을 새롭게 낳다 / 다시 태어남
  rationale: 행위 주체가 영혼으로 표현되는 첫 문장과 수동적 구원 맥락을 획일화하지 않아 원문의 긴장을 남겼습니다.
- source_word: formulas
  choice: 정해진 문구
  rationale: 특정 종교 전통의 주문이나 신조를 단정하지 않고, 반복되는 언어 형식이라는 넓은 뜻을 전달했습니다.
theological_decisions:
- issue: 영혼의 구원에서 영혼의 의지와 아버지의 선물 사이의 관계
  choice: ‘자기 뜻으로 움직이며’와 ‘아버지에게서 … 받아’를 함께 유지
  alternative: 아버지의 은혜만을 강조하거나 영혼의 자력 회복으로 단일화
