  revised_text: '그 결혼은 육적인 결혼과 다르기 때문입니다. 서로 성관계를 맺을 이들은 그러한 성관계로 만족할 것입니다. 그리고 마치 무거운 짐을 벗어 놓듯이, 육체의 욕정이 주는 번거로움을 뒤에 남겨 두고 서로에게서 [얼굴을 돌립니다]. 그러나 이 결혼은 [다릅니다].[a] 그들이 [서로 결합하면], 하나의 생명이 됩니다.



    [] 이 때문에 예언자는 첫 남자와 첫 여자를 두고 이렇게 말했습니다. “두 사람이 한 육체가 될 것이다.” (창세기 2:24)[b]



    그들은 처음에 아버지와 함께 살 때 서로 결합되어 있었습니다. 그러다가 여자가 자기 형제인 남자를 그릇된 길로 이끌었습니다. 이 결혼은 그들을 다시 결합시켰고, 영혼은 자신의 참된 사랑이며 본래의 주인인 이와 하나가 되었습니다. 기록된 것과 같습니다. “여자의 주인은 그 남편이다.” (창세기 3:16; 에베소서 5:23)[c]



    그 뒤 영혼은 차츰 그를 알아보았습니다. 영혼은 과부였던 때의 지난 수치를 기억하며 그의 앞에서 울었고, 다시 기뻐했습니다. 그리고 그가 자기와 함께 머무는 것을 기뻐하도록 자신을 더욱 아름답게 꾸몄습니다.



    예언자는 시편에서 이렇게 말했습니다.



    “딸아, 듣고 바라보며 네 귀를 기울이십시오.


    네 백성과 네 아버지의 집을 잊으십시오.


    그러면 왕이 네 아름다움을 사모할 것입니다.


    그가 네 주인이기 때문입니다.” (시편 45:10-11)



    그는 영혼에게, 한때 함께 살았던 자기 백성과 간부들의 무리에게서 눈을 돌리고, 오직 자기 왕이자 참된 주님께 자신을 바치라고 명합니다. 또한 그곳에서 영혼의 처지가 참혹했던 땅의 아버지 집을 잊고, 그 대신 하늘에 계신 자기 아버지를 기억하라고 명합니다.



    그와 같이 아브라함에게도 이런 말씀이 주어졌습니다. “네 땅과 네 친족과 네 아버지의 집을 떠나라.” (창세기 12:1)



    이렇게 영혼은 다시 그 찬란함 가운데서 [자신을 아름답게 꾸민] 뒤, 사랑하는 이를 경배하기를 [바랐고], [그도] 영혼을 사랑했습니다. 영혼이 그와 하나가 되었을 때, 그에게서 [] 생명을 주는 영의 씨를 받았습니다.[d] 영혼은 그 씨로 바른 자녀들을 낳아 기릅니다. 이것이 위대하고 완전한 출생의 기적이기 때문입니다. 이처럼 이 결혼은 아버지의 뜻으로 완성됩니다.



    영혼은 자신을 새롭게 낳아 이전의 모습으로 다시 돌아가는 것이 마땅합니다. 그때 영혼은 자기 뜻으로 움직이며, 자신을 새롭게 하여 처음 있던 곳으로 되돌리기 위해 아버지에게서 신적 본성을 받습니다.[e]



    이것이 죽은 자들 가운데서 일어나는 부활입니다.


    이것이 종살이에서 풀려나는 구속입니다.


    이것이 하늘로 상승하여 가는 여정입니다.


    이것이 아버지께 올라가는 길입니다.



    그러므로 예언자는 이렇게 말했습니다.



    “내 영혼아, 주님을 찬양하십시오.


    내 안에 있는 모든 것아, 그 거룩한 이름을 찬양하십시오.


    내 영혼아, 하나님을 찬양하십시오.


    그분은 네 모든 죄악을 용서하시고,


    네 모든 질병을 고치시며,


    네 생명을 죽음에서 속량하시고,


    자비로 네게 관을 씌우시며,


    좋은 것으로 네 갈망을 채워 주십니다.


    네 젊음은 독수리처럼 새로워질 것입니다.” (시편 103:1-5)[f]



    영혼은 다시 젊어진 뒤에 위로 올라가, 자신을 구원한 아버지와 자기 형제를 찬양할 것입니다. 이처럼 영혼은 다시 태어남으로 구원받습니다. 이것은 정해진 문구를 되풀이하거나, 학식이나 전문 지식으로, 또는 책에서 배움으로 이루어지는 것이 아닙니다. 오히려 [영]의 은혜로 이루어지며, 자비로우신 [하나님]께서 주시는 선물입니다.[g] 이것이 이 하늘의 실재가 이루어지는 방식입니다.



    그러므로 구주께서 외치십니다. [] “내 아버지께서 그를 이끌어 내게 데려오지 않으시면 아무도 내게 올 수 없습니다. 내가 그를 마지막 날에 다시 일으킬 것입니다.” (요한복음 6:44)[h]'
