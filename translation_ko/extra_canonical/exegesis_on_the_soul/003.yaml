  text: 'However, when she realizes the trouble she is in, cries out before the Father, and repents, the Father will show mercy to her. He will cause her womb to turn away from the outward kingdom and return inward, making the soul reclaim her good character. For such is not the way of a woman, since the bodily womb is inward, like the other internal organs of the body.


    The womb of the soul, however, surrounds outwardly, like the male’s outward genitals. Therefore, when the womb of the soul turns inward by the will of the Father, it is baptized and immediately purified from the outward pollution which was forced on it, like filthy [garments] soaked [in water and] moved around until the dirt is gone and they are clean. Thus, the purification of the soul is a reclaiming of the renovation of [] her former nature, and a return to herself. That is her baptism.


    Then she will become mad at herself, acting like a woman during labor, writhing and raging in the hour of birth. However, because she is a female, on her own she is unable to conceive a child. From heaven the Father sent her a man—her brother, the firstborn. The bridegroom then went down to the bride. She stopped her earlier prostitution and purified herself from the pollutions of the adulterers. She was even renewed to become a bride. She purified herself in the bridal chamber, filling it with perfume, sitting there awaiting her true bridegroom. She no longer ran around the marketplace, having sex with everyone she wanted. Instead, she kept waiting for him: “When will he arrive?” And she continued to fear him, because she knew not what he looked like. She no more remembered the time she fell from her Father’s house. By the will of the Father, however, [. . .] And she dreamed of him like a woman who loves a man.


    Then, however, the bridegroom, agreeing with the Father’s will, went down to her, into the bridal chamber, which had been prepared, and he adorned the bridal chamber.'
translation:
  language: ko
  text: '그러나 영혼이 자신이 어떤 곤경에 빠졌는지 깨닫고 아버지 앞에서 부르짖으며 회개하면, 아버지께서는 그에게 자비를 베푸실 것입니다. 아버지께서는 그의 자궁이 바깥 왕국에서 돌아서 안으로 되돌아가게 하시고, 영혼이 자신의 선한 성품을 되찾게 하실 것입니다. 여자의 자궁은 본래 그런 식으로 있지 않기 때문입니다. 육체의 자궁은 몸의 다른 내장 기관들처럼 안에 있습니다.


    그러나 영혼의 자궁은 남자의 바깥 생식기처럼 바깥쪽을 둘러싸고 있습니다. 그러므로 아버지의 뜻으로 영혼의 자궁이 안으로 돌아서면, 그것은 세례를 받고 곧바로 자신에게 강제로 묻은 바깥의 오염에서 깨끗해집니다. 이는 더러운 [옷을] [물에] 담가 때가 빠져 깨끗해질 때까지 흔드는 것과 같습니다.[a] 이처럼 영혼의 정결은 자신의 이전 본성이 [] 새로워진 상태를 되찾는 것이며, 자기 자신에게로 돌아가는 것입니다.[b] 이것이 영혼의 세례입니다.


    그때 영혼은 자신에게 격분하여, 해산하는 여자처럼 출산의 때에 몸부림치며 격렬히 괴로워할 것입니다. 그러나 영혼은 여자이므로 혼자서는 아이를 잉태할 수 없습니다. 아버지께서는 하늘에서 한 남자, 곧 영혼의 오라버니인 맏아들을 보내셨습니다.[c] 그때 신랑이 신부에게 내려왔습니다. 영혼은 이전의 매춘을 그치고 간음한 자들이 남긴 오염에서 자신을 깨끗하게 했습니다. 그리고 새롭게 되어 신부가 되었습니다. 영혼은 신방을 깨끗이 하고 향기로 가득 채운 뒤, 그곳에 앉아 자신의 참된 신랑을 기다렸습니다. 더 이상 장터를 돌아다니며 원하는 모든 사람과 성관계를 맺지 않았습니다. 그 대신 계속 신랑을 기다리며 “그분은 언제 오실까?” 하고 물었습니다. 영혼은 신랑이 어떻게 생겼는지 알지 못했으므로 계속 그를 두려워했습니다. 영혼은 자신이 아버지의 집에서 떨어져 나왔던 때도 더 이상 기억하지 못했습니다. 그러나 아버지의 뜻으로 [. . .] 영혼은 한 남자를 사랑하는 여자처럼 그에 대한 꿈을 꾸었습니다.[d]


    그때 신랑은 아버지의 뜻에 따라 영혼에게, 곧 준비된 신방 안으로 내려왔으며, 그 신방을 단장했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 전승된 본문의 손상되거나 생략된 부분을 번역자가 문맥에 따라 보충한 것입니다.
    reason: 제공된 증언의 편집상 복원 표시를 독자가 식별할 수 있게 합니다.
  - marker: b
    text: “[]”는 제공된 증언에 남아 있는 빈 복원 표시입니다. 빠진 말이 무엇인지는 확정할 수 없습니다.
    reason: 본문 손상을 임의로 채우지 않고 자료의 불확실성을 보존합니다.
  - marker: c
    text: “오라버니”는 영혼이 여성으로 의인화되고 그 남자가 ‘그의 형제’로 불리는 관계를 자연스러운 한국어로 나타낸 것입니다. 여기서는 그 인물의 정체를 더 구체적으로 규정하지 않습니다.
    reason: 친족 호칭의 성별 관계를 분명히 하면서 신학적 과잉 해석을 피합니다.
  - marker: d
    text: “[. . .]”는 전승된 본문에 내용이 빠진 부분이 있음을 나타냅니다. 따라서 앞뒤 문장의 정확한 연결은 불확실합니다.
    reason: 사본 결락과 문맥적 단절을 투명하게 표시합니다.
lexical_decisions:
- source_word: soul (feminine pronouns)
  choice: 영혼 / 그
  rationale: 본문의 여성 의인화를 유지하되, 현대 한국어에서 영혼 자체를 문법적으로 여성화하지 않고 문맥상 여성 역할을 드러냈습니다.
- source_word: womb
  choice: 자궁
  rationale: 해부학적 자궁과 영혼의 비유적 자궁 사이의 반복과 충격성을 보존했습니다.
- source_word: outward kingdom
  choice: 바깥 왕국
  rationale: 의미를 내면/외면의 상태로 축소하지 않고 원문의 공간적·통치적 은유를 유지했습니다.
- source_word: good character
  choice: 선한 성품
  rationale: 윤리적 성격과 본래적 상태를 함께 암시하는 표현으로 옮겼습니다.
- source_word: baptized / baptism
  choice: 세례를 받다 / 세례
  rationale: 물에 의한 정결과 의례적 의미가 겹치는 전통 용어를 유지했습니다.
- source_word: prostitution / adulterers
  choice: 매춘 / 간음한 자들
  rationale: 성적 은유의 강도를 완화하지 않으면서 두 표현의 차이를 보존했습니다.
- source_word: bridal chamber
  choice: 신방
  rationale: 신랑과 신부가 함께하는 준비된 방이라는 혼인 맥락을 자연스럽고 품위 있게 전달합니다.
- source_word: firstborn
  choice: 맏아들
  rationale: 아버지가 보내는 남자라는 문맥에 따라 출생 순위와 아들됨을 함께 나타냈습니다.
theological_decisions:
- issue: 세례와 영혼의 회복의 관계
  choice: “이것이 영혼의 세례입니다”로 동일시를 그대로 유지
  alternative: 세례를 단순히 회복의 상징으로 풀이
  rationale: 본문은 정결, 본성의 갱신, 자기에게로의 귀환을 세례와 직접 연결하므로 이를 해설적으로 약화하지 않았습니다.
- issue: 아버지, 맏아들, 오라버니, 신랑의 관계
  choice: 동일 인물인지 여부를 별도로 규정하지 않고 본문의 호칭 전개를 보존
  alternative: 맏아들을 특정 기독론적 인물로 명시
  rationale: 이 단락 자체의 모호성과 신학적 긴장을 유지하고 교파적 동일시를 덧붙이지 않았습니다.
- issue: 영혼의 여성성
  choice: 여성 신부의 의인화로 번역하되 존재론적 성별 주장으로 확대하지 않음
  alternative: 영혼을 본질적으로 여성인 실체로 단정
  rationale: 본문의 비유와 문법적 의인화를 충실히 살리면서 그 범위를 넘어선 해석을 피했습니다.
- issue: 강제로 묻은 바깥의 오염
  choice: 오염이 영혼에게 가해졌다는 수동성을 보존
  alternative: 영혼이 자발적으로 얻은 죄로만 번역
  rationale: 원문 증언의 “forced on it”이 만드는 책임과 피해의 긴장을 그대로 남겼습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 장중하되 일반 독자가 이해할 수 있도록 구성했으며, 노골적인 성적·해부학적 은유는 원문의 논증에 필수적이므로 완곡하게 지우지 않았습니다. 현재 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 대조가 필요합니다.
