  revised_text: '그러나 영혼이 자신이 처한 곤경을 깨닫고 아버지 앞에서 부르짖으며 회개하면, 아버지께서는 그녀에게 자비를 베푸실 것입니다. 아버지께서는 그녀의 자궁이 바깥 왕국에서 돌아서 안으로 되돌아가게 하시고, 영혼이 자신의 선한 성품을 되찾게 하실 것입니다. 여자의 자궁은 본래 그런 식으로 있지 않기 때문입니다. 육체의 자궁은 몸의 다른 내장 기관들처럼 안에 있습니다.


