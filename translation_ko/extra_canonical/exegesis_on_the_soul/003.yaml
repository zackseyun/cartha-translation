review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언과 대조할 때, 핵심 비유와 결락 표시는 대체로 보존되었습니다. 다만 영혼을 가리키는 여성 의인화가 첫 단락에서 남성 지시어(‘그에게’, ‘그의 자궁’)로 바뀌었고, ‘신방에서 자신을 정결하게 했다’가 ‘신방을 깨끗이 했다’로 바뀌어 목적어가 달라졌습니다. 또한 ‘계속 기다리며’라는 진술이 ‘물었습니다’라는 발화 행위로 확대되었습니다. 콥트어 직접 대조는 제공 자료상 보류되어 있으므로, 이 평가는 영어 공공영역 증언에 대한 잠정 검토입니다.
  naturalness: 합쇼체와 현대 표준어는 전반적으로 자연스럽습니다. 다만 영혼의 여성 의인화를 일관되게 ‘그녀’로 지시하면 혼동이 줄며, ‘외적인 왕국’, ‘바깥의 더러움’, ‘신방에서 자신을 정결하게 했습니다’가 원문의 논리와 한국어 문맥을 더 정확히 드러냅니다.
  terminology: ‘영혼’, ‘자궁’, ‘세례’, ‘신방’, ‘매춘’, ‘맏아들’은 원문의 반복되는 비유와 종교적 어휘를 대체로 잘 보존합니다. ‘오라버니’는 원문에 없는 연장자 관계를 암시하므로 ‘형제’로 고쳤습니다. ‘간음한 자들이 남긴 오염’은 원문보다 ‘남김’의 뜻을 보태므로 ‘간음하는 자들의 더러움’으로 조정했습니다.
  issues:
  - severity: medium
    issue: 영혼을 가리키는 지시어의 성별 불일치
    rationale: 영어 증언은 영혼을 일관되게 여성으로 의인화하는데, 첫 단락의 ‘그에게’, ‘그의 자궁’은 남성 지시로 읽힙니다.
  - severity: medium
    issue: ‘purified herself in the bridal chamber’의 목적어 변경
    rationale: 초안의 ‘신방을 깨끗이 하고’는 방을 청소한 것으로 뜻이 바뀝니다. 원문은 영혼이 신방에서 자신을 정결하게 한 것입니다.
  - severity: low
    issue: ‘kept waiting’에 ‘물었습니다’를 추가
    rationale: 인용문은 기다림 속의 독백일 수 있으나, 증언은 단지 계속 기다렸다고 합니다. ‘물었습니다’는 원문에 없는 발화 행위를 명시합니다.
  - severity: low
    issue: ‘오라버니’가 상대적 연장자성을 첨가
