translation:
  language: ko
  text: '아버지께서는 그를 미리 알고 계셨습니다. 이는 아무것도 존재하기 전에 그가 아버지의 생각 속에 머물렀고, 아버지께서 그를 계시하신 대상들도 그곳에 함께 간직하고 계셨기 때문입니다. 아버지께서는 잠시 동안만 존속하는 것 위에 결핍을 두셨는데, 이는 자신의 충만의 영광을 위한 것이었습니다. 아버지께서 알려지지 않으셨다는 사실은 그분이 [자신을 알게 해 주심으로] 자신의 인자하심을 드러내는 계기가 되었습니다.[a]


    [본문 결락][b] 이와 같이 그는 아버지에 관한 지식을 얻었는데, 이는 아버지의 선하신 뜻이 나타난 것이며 그분의 감미로움이 지닌 풍성함이 계시된 것으로서 둘째 영광입니다. 그러므로 아버지께서는 지식을 낳으시면서도 무지의 원인으로도 이처럼 나타나셨습니다. 이것은 감추어져 있고 파악할 수 없는 지혜입니다. 그 지혜 안에서 아버지께서는 마지막 때까지 지식을 보존하십니다. 그때에는 모든 것들이 아무도 자기 지혜나 능력으로 찾아내지 못한 하나님 아버지를 찾느라 스스로를 다 소진하게 될 것입니다. 아버지께서는 그들이 그분께 끝없이 감사하는 가운데 탁월한 생각이라는 큰 선물을 알도록 은혜를 베푸십니다. 아버지께서는 흔들리지 않는 자신의 뜻을 따라, 자신의 의지로 아버지를 알기에 합당하다고 여겨진 이들에게 영원히 자신을 계시하십니다. 아버지는 본성상 알 수 없는 분이십니다. 그분은 자신의 예지 안에서, 그들이 지식과 그에 따르는 모든 좋은 것을 얻되 무지와 그 고통도 함께 맛보도록 계획하셨습니다.


    이와 같이 그들은 악한 것들을 맛보고, 한동안 그것들을 통하여 자신을 훈련할 수 있었습니다. […] 그리하여 영원히 [좋은 것들을 누릴 수 있게 되었습니다].[c] [본문 결락][d] 그들은 자신을 드러내 놓으며, 원수들에게 끊임없이 배척당하고 비방받습니다. 그러면서도 이를 장식이요 높은 것들의 놀라운 표지로 여깁니다. 이는 아버지를 알지 못하는 이들의 무지가 그들 자신에게서 비롯되었다는 것과, 그들이 아버지를 알 수 있게 한 그분의 능력이 그와 대조된다는 것을 분명히 하려는 것이었습니다.


    이 지식은 마땅히 “가능한 모든 생각에 관한 지식”과 “보물”이라고 불립니다. 더 나아가 지식을 더욱 풍성하게 하자면, 이것은 태초에 알려져 있던 이들이 드러나는 것이며, 하나 됨으로 가는 길이자 선재하는 존재입니다.[e] 그 결과, 위대함 가운데 자라나는 이들은 구원의 경륜 안에서 그 뜻에 따라 자신들에게 정해진 위대함을 버린 이들입니다. 이는 마지막이 처음과 같아지게 하려는 것입니다.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 손상되었거나 생략된 본문을 보완한 번역자의 복원입니다.
    reason: 제공된 증언의 복원 표시를 보존합니다.
  - marker: b
    text: 이 지점에는 사본의 결락 또는 판독 불능 부분이 있습니다.
    reason: 원문에 독립된 빈 대괄호가 있어 손상 신호를 독자에게 알립니다.
  - marker: c
    text: 줄임표는 사본의 결락을, 대괄호는 복원된 문구를 나타냅니다.
    reason: 두 종류의 본문 비평 표지를 구별합니다.
  - marker: d
    text: 이 지점에도 사본의 결락 또는 판독 불능 부분이 있습니다.
    reason: 원문에 표시된 두 번째 독립 결락을 보존합니다.
  - marker: e
    text: ‘선재하는 존재’가 특정 인격을 가리키는지, 선재하는 실재나 원리를 가리키는지는 문맥만으로 분명하지 않습니다.
    reason: 원문의 신학적·문법적 모호성을 보존합니다.
  - marker: f
    text: 마지막 문장의 ‘정해진 위대함을 버린’이라는 표현은 문맥상 난해하지만, 제공된 영어 증언의 의미를 고치지 않고 옮겼습니다.
    reason: 추정 교정을 피하고 본문의 긴장을 명시합니다.
lexical_decisions:
- source_word: Father
  choice: 아버지
  rationale: 문헌의 핵심 신명·관계어를 평이하면서도 존엄한 한국어로 보존했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 이 문헌의 전문적 우주론 용어일 가능성을 고려하여 일반화하지 않고 명사형으로 유지했습니다.
- source_word: deficiency
  choice: 결핍
  rationale: 충만과 대비되는 개념적 긴장을 보존하기 위해 ‘부족함’보다 용어성이 분명한 표현을 택했습니다.
- source_word: the Totalities
  choice: 모든 것들
  rationale: 집합적·우주론적 의미를 살리되, 직접 콥트어 검토 전에는 ‘전체자들’ 같은 과도한 전문 조어를 피했습니다.
- source_word: foreknowledge
  choice: 예지
  rationale: 단순한 사전 인지보다 계획과 연결된 신적 선지식을 나타내므로 ‘예지’를 사용했습니다.
- source_word: plan of salvation
  choice: 구원의 경륜
  rationale: 구원에 관한 질서와 계획이라는 문맥을 압축적으로 나타내는 현대 신학 한국어를 사용하되 특정 교파 해석은 덧붙이지 않았습니다.
- source_word: union
  choice: 하나 됨
  rationale: 존재론적 합일인지 공동체적 연합인지 확정하지 않고 원문의 폭을 유지하는 자연스러운 표현을 택했습니다.
- source_word: the pre-existent one
  choice: 선재하는 존재
  rationale: 인격적 단수와 추상적 원리를 단정하지 않도록 ‘분’이나 특정 인물명 대신 중립적으로 옮겼습니다.
theological_decisions:
- issue: ‘그’와 ‘아버지’가 가리키는 대상의 모호성
  choice: 첫 문단과 둘째 문단에서 가능한 범위 안에서 대명사를 유지하되, 문법상 명료화가 필요한 곳만 ‘아버지’를 보충했습니다.
  alternative: 모든 대명사를 특정 신적 인물이나 구원자 명칭으로 확정
  rationale: 직접 원문 검토가 보류된 상태이며 영어 증언 자체도 지시 대상이 불분명하므로 교리적으로 해소하지 않았습니다.
- issue: 아버지가 ‘무지의 원인’으로 나타난다는 진술
  choice: 충격적 역설을 그대로 보존했습니다.
  alternative: 아버지가 무지를 단지 허용하셨다고 완화
  rationale: 본문은 지식을 낳는 분이면서 무지의 원인으로 나타난다는 긴장을 의도적으로 병치하므로 이를 해석으로 제거하지 않았습니다.
- issue: 아버지는 본성상 알 수 없으나 지식을 주신다는 진술
  choice: 초월성과 자기 계시의 긴장을 모두 유지했습니다.
  alternative: ‘완전히 알 수 없다’ 또는 ‘계시를 통해 충분히 알 수 있다’로 체계화
  rationale: 본문이 말하는 불가지성과 계시 가능성을 어느 한쪽으로 조화시키지 않았습니다.
- issue: 무지와 악의 경험에 관한 신적 계획
  choice: 예지 안의 계획이라는 문장 구조를 보존했습니다.
  alternative: 악을 단순 허용 또는 인간의 독립적 선택으로만 풀이
  rationale: 본문 자체의 난해한 인과 관계를 특정 신정론으로 바꾸지 않았습니다.
- issue: 무지가 ‘그들 자신에게서 비롯되었다’는 책임 진술
  choice: 인간 측 책임과 신적 능력의 대조를 함께 보존했습니다.
  alternative: 전적인 신적 결정 또는 전적인 자력 구원으로 해석
  rationale: 본문의 양면적 긴장을 유지했습니다.
- issue: 정해진 위대함을 ‘버린’ 이들이 위대해진다는 마지막 역설
  choice: ‘버린’이라는 증언의 의미를 그대로 번역했습니다.
  alternative: 문맥에 맞게 ‘받은/붙든’으로 교정
  rationale: 전승 오류나 번역 문제일 가능성이 있어도 제공된 증언만으로 본문을 수정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문체는 존엄성을 유지하되 지나치게 고어적인 표현을 피했습니다. 현재 초안은 제공된 공공영역 영어 증언을 바탕으로 하며, 콥트어 원문 직접 검토가 보류되어 있으므로 대명사 지시, 결락 복원, 전문 우주론 용어는 잠정적입니다.
