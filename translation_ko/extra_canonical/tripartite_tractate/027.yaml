  revised_text: '아버지께서는 그를 미리 알고 계셨습니다. 이는 아무것도 존재하기 전에 그가 아버지의 생각 속에 머물렀고, 아버지께서 그를 계시하신 이들도 그곳에 함께 간직하고 계셨기 때문입니다. 아버지께서는 지나가는 기간 동안 지속되는 것 위에 결핍을 두셨는데, 이는 자신의 충만의 영광을 위한 것이었습니다. 아버지께서 알려지지 않으셨다는 사실은 그분이 [자신을 알게 해 주심으로] 자신의 인자하심을 드러내는 계기가 되었습니다.[a]



    [본문 결락][b] 이와 같이 그는 그에 관한 지식을 얻었는데, 이는 그의 인자하심이 나타난 것이며 그의 감미로움이 지닌 풍성함이 계시된 것으로서 둘째 영광입니다. 그러므로 그는 지식을 낳으시면서도 무지의 원인으로도 이처럼 나타나셨습니다. 이것은 감추어져 있고 파악할 수 없는 지혜이며, 그 안에서 그는 마지막 때까지 지식을 보존하십니다. 그때에는 모든 것들이 아무도 자기 지혜나 능력으로 찾아내지 못한 하나님 아버지를 찾느라 스스로를 다 소진하게 될 것입니다. 그분께서는 그분께 끝없이 감사하게 하심으로써, 탁월한 생각의 큰 선물에 대한 지식을 그들에게 주시기를 기꺼이 하십니다. 그분께서는 흔들리지 않는 자신의 뜻에서, 자신의 의지를 통하여 아버지에 관한 지식을 받기에 합당하다고 여겨진 이들에게 영원히 자신을 계시하십니다. 아버지는 본성상 알 수 없는 분이십니다. 그분은 자신의 예지 안에서, 그들이 지식과 그에 따르는 모든 좋은 것을 얻되 무지와 그 고통도 함께 맛볼 수 있도록 계획하셨습니다.



    이와 같이 그들은 악한 것들을 맛보고, 한동안 그것들을 통하여 자신을 훈련할 수 있게 되었습니다. […] 그리하여 영원히 [좋은 것들을 누리게 하려는 것이었습니다].[c] [본문 결락][d] 그들은 자신을 드러내며, 원수들에게 끊임없이 배척당하고 비방받습니다. 그러면서도 이를 장식이요 고귀한 것들의 놀라운 표지로 여깁니다. 이는 아버지를 알지 못하는 이들의 무지가 그들 자신에게서 비롯되었다는 것과, 그들이 아버지를 알 수 있게 한 그분의 능력이 그와 대조된다는 것을 분명히 하려는 것이었습니다.



    이 지식은 마땅히 “가능한 모든 생각에 관한 지식”과 “보물”이라고 불립니다. 또한 지식을 더욱 늘리는 것은, 태초에 알려져 있던 이들이 드러나는 것이며, 하나 됨과 선재하는 존재에게 이르는 길입니다.[e] 그 결과, 위대함 가운데 자라나는 이들은 구원의 경륜 안에서 그 뜻에 따라 자신들에게 정해진 위대함을 버린 이들입니다. 이는 마지막이 처음과 같아지게 하려는 것입니다.[f]'
