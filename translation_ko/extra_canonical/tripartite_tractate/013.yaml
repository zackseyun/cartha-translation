base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/013.yaml
  text: 'The others had a stronger lust for control because they were more honorable [] than the former ones, who had risen up against them. They refused to humble themselves, thinking that they had originated from themselves and had no beginning, and, as for giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control because of their way of being. As a result, they were flooded with powers and natures that typify mutual combat, possessing lust for control and everything else like it. From these things, empty love of glory drove them to desire control, although not one of them possessed the exalted thought or recognized it.


    The forces of this thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind had harmony among themselves. They, however, battled against the order of those of the likeness, while the order of those of the likeness waged war against the likenesses and acted against them in its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he did not cease [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse kinds of matter and powers of different kinds, intermixed in great numbers. Meanwhile, the Word, who caused them to be begotten, was awaiting in his mind a revelation of the [hope] that was to come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. As for those of the shadow, he distanced himself from them completely because they warred against him and did not humble themselves before him in the least. But he found rest in those who belonged to memory. As for those who came into being through memory, the Word produced, in an unseen manner and in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above, bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
translation:
  language: ko
  text: '다른 이들은 지배욕이 더 강했습니다. 그들에게 맞서 일어났던 앞선 자들보다 그들이 더 존귀했기 때문입니다. [] 앞선 자들은 자신을 낮추려 하지 않았습니다. 그들은 자신들이 스스로 생겨났으며 시작이 없다고 생각했고, 낳는 일에서도 자신들이 맨 먼저 다른 이들을 낳았다고 여겼습니다. 두 계층은 서로 전쟁을 벌였고, 각자의 존재 방식 때문에 지배권을 놓고 싸웠습니다. 그 결과 그들은 서로 싸우는 상황을 드러내는 세력과 본성에 휩싸였으며, 지배욕과 그와 같은 온갖 것을 지니게 되었습니다. 이런 것들에서 비롯된 헛된 명예욕이 그들을 몰아 지배권을 탐내게 했지만, 그들 가운데 어느 누구도 높은 곳의 생각을 지니지도, 알아보지도 못했습니다.


    이 생각의 세력들은 자신들이 표상하는, 선재하는 <이들>의 <이름들>과 함께 마련되었습니다.[a] 이런 부류의 계층은 서로 조화를 이루었습니다. 그러나 그들은 닮은 것들의 계층과 싸웠고, 닮은 것들의 계층도 그 닮은 것들을 상대로 전쟁을 벌이며 격분하여 그들에게 맞섰습니다. [] 이로부터 [그 일이 일어났고 … 그들] 자신의 [서로를 거슬러], 많은 […] 필연이 그들을 배치하여 […] 그들이 이길 수 있도록 […] 그는 그치지 않았고 […] 그들의 시기와 [그들의] 격분과 폭력과 욕망과 무지가 성과를 내어, 여러 종류의 물질과 서로 다른 부류의 세력들을 만들어 냈고, 그것들은 매우 많이 뒤섞였습니다.[b] 한편 그들을 낳게 한 말씀은 위로부터 자신에게 올 [소망]의 계시를 마음속으로 기다리고 있었습니다.


    말씀이 스스로 움직이기 시작하자, 높으신 분을 향한 소망과 기대를 얻었습니다. 그림자에 속한 자들은 자신과 맞서 싸우고 조금도 자신 앞에서 낮아지지 않았으므로, 말씀은 그들에게서 완전히 멀어졌습니다. 그러나 기억에 속한 자들 안에서는 안식을 찾았습니다. 기억을 통하여 생겨난 자들과 관련하여, 말씀은 그들의 본성에 맞게 보이지 않는 방식으로 높은 곳에 올라간 이를 산출했습니다. 그는 부족해진 이를 기억했습니다. 마침내 위로부터 빛이 그에게 비쳐 생명을 베풀었는데, 그 빛은 선재하는 충만들 사이의 형제 사랑의 생각에서 태어난 것이었습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 꺾쇠괄호 < >는 훼손되거나 불확실한 본문을 번역자가 복원한 말임을 나타냅니다.
    reason: 원 증거문의 본문 비평 표지를 독자가 이해하도록 설명합니다.
  - marker: b
    text: 이 대목은 사본이 크게 훼손되어 문장 연결과 주체를 확정하기 어렵습니다. 대괄호와 줄임표는 결락 또는 불확실한 복원을 나타냅니다.
    reason: 심각한 결락을 매끄럽게 보충하지 않고 본문의 불확실성을 명시합니다.
  - marker: c
    text: 마지막 문장의 대명사와 수식 관계는 모호합니다. 여기서는 ‘빛’이 생명을 베풀며 형제 사랑의 생각에서 태어난 것으로 옮겼습니다.
    reason: 문법적·신학적 긴장을 숨기지 않고 채택한 독법을 밝힙니다.
lexical_decisions:
- source_word: lust for control
  choice: 지배욕 / 지배권을 탐내다
  rationale: 권력 행사에 대한 욕망과 쟁탈의 맥락을 자연스러운 현대 한국어로 전달하면서 반복되는 핵심 개념을 보존했습니다.
- source_word: orders
  choice: 계층
  rationale: 서로 대립하는 존재 집단의 질서와 부류를 함께 나타내며, 제도적 ‘명령’으로 오해될 가능성을 피했습니다.
- source_word: the Word
  choice: 말씀
  rationale: 문헌의 우주론적 인격 주체를 나타내는 전통적이고 이해 가능한 용어를 사용하되, 그 정체를 특정 교리로 단정하지 않았습니다.
- source_word: memory
  choice: 기억
  rationale: 추상적 원리 또는 존재 영역일 수 있는 원문의 표현을 해석적으로 풀지 않고 보존했습니다.
- source_word: Fullnesses
  choice: 충만들
  rationale: 복수형을 유지하여 단일한 추상 개념으로 평준화하지 않고, 이 문헌의 전문적 우주론 용례를 드러냈습니다.
- source_word: Exalted One
  choice: 높으신 분
  rationale: 대상의 존귀함을 나타내면서도 구체적 정체를 본문 밖의 교리로 확정하지 않습니다.
theological_decisions:
- issue: ‘높은 곳의 생각’의 정체
  choice: 높은 곳의 생각
  alternative: 고귀한 사상 / 지고자의 생각
  rationale: exalted thought가 사고의 질을 뜻하는지 상위 실재에 속한 생각을 뜻하는지 불분명하므로 모호성을 유지했습니다.
- issue: 선재하는 존재들의 이름과 표상의 관계
  choice: 자신들이 표상하는, 선재하는 <이들>의 <이름들>
  alternative: 선재자들의 이름을 따라 준비됨
  rationale: 영어 증거문이 제시하는 표상 관계와 복원 표시를 보존하고 인과관계를 추가하지 않았습니다.
- issue: 마지막 문장의 ‘빛’의 출생 및 생명 부여 관계
  choice: 빛이 생명을 베풀었으며 그 빛이 … 태어남
  alternative: 생명이 형제 사랑의 생각에서 태어남
  rationale: 영어 증거문의 문법상 ‘begotten’이 light를 수식하는 독법을 채택했지만, 난해한 구문임을 각주로 밝혔습니다.
- issue: ‘높은 곳에 올라간 이’와 ‘부족해진 이’의 동일성
  choice: 서로 다른 지시 대상으로 열어 둠
  alternative: 한 존재의 두 상태로 통합
  rationale: 원문의 대명사 관계가 확정적이지 않으므로 두 표현을 임의로 동일시하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 영지주의 문헌의 전문 개념은 지나치게 교회 용어화하거나 해설적으로 치환하지 않았으며, ‘말씀’, ‘충만들’, ‘기억’, ‘그림자’ 같은 핵심 표현을 일관되게 유지했습니다. 사본의 결락·복원 표시는 원 증거문대로 보존했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증거문에 근거한 잠정 출판 초안입니다.
