  revised_text: '다른 이들은 지배욕이 더 강했습니다. 그들에게 맞서 일어났던 앞선 자들보다 그들이 더 존귀했기 때문입니다. [] 앞선 자들은 자신을 낮추려 하지 않았습니다. 그들은 자신들이 스스로 생겨났으며 시작이 없다고 생각했고, 낳는 일에서도 자신들이 맨 먼저 다른 이들을 낳았다고 여겼습니다. 두 계층은 서로 전쟁을 벌였고, 각자의 존재 방식 때문에 지배권을 놓고 싸웠습니다. 그 결과 그들은 서로 싸우는 상황을 드러내는 세력과 본성에 휩싸였으며, 그 세력과 본성은 지배욕과 그 밖의 이와 같은 온갖 것을 지니고 있었습니다. 이런 것들에서 헛된 영광을 사랑하는 마음이 일어나, 그들을 몰아 지배욕을 바라게 했습니다. 그러나 그들 가운데 어느 누구도 고귀한 생각을 지니거나 그것을 알아보지 못했습니다.



