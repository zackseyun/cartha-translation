base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: ko
  text: '그러나 예언자들은 자기 뜻으로는 아무 말도 하지 않았습니다. 오히려 그들은 각자 구원자의 선포에 관하여 보고 들은 것들을 말했습니다. 그가 선포한 것, 곧 그들의 선포의 중심 주제는 구원자가 오리라는 것이었으며, 그 도래가 이루어지리라는 것이었습니다.[a] 때로 예언자들은 그가 아직 태어나지 않은 것처럼 말하지만, 다른 때에는 구원자가 그들의 입을 빌려 말하는 듯이, 구원자가 와서 자기를 알지 못했던 이들에게 은혜를 베풀 것이라고 말합니다. 그러므로 그들이 모두 모든 것을 같은 방식으로 말한 것은 아닙니다. 도리어 각자는 그에 관하여, 또 자기가 본 장소에 관하여 말하도록 받은 능력에 따라, 구원자가 바로 그곳에서 태어나고 그곳으로부터 올 것이라고 생각했습니다. 그러므로 그들 가운데 누구도 그가 어디에서 올지, 누가 그를 낳을지 알지 못했습니다. 그들이 말할 자격을 얻은 것은 오직 이것, 곧 그가 태어나 고난을 받으리라는 것뿐이었습니다. 그가 미리 존재했다는 것과, 나지 않았으며 고난을 받을 수 없는 존재로서 영원히 존재한다는 것, <…> 육신 안에서 생겨난 말씀으로부터가 아니라는 것, []은 그들의 생각에 전혀 떠오르지 않았습니다.[b]


    그리고 이것이 장차 나타날 그의 육신에 관하여 그들이 영감을 받아 전한 메시지입니다. 그의 출생은 그들 모두의 출생과 같았지만, 무엇보다도 생겨난 것들의 원인인 영적인 말씀으로부터 비롯되었다고 합니다. 구원자가 육신을 받은 그 사람은 빛이 계시될 때, 그 계시에 관해 약속된 말씀과 일치하여, 씨의 형태로 그를 실제로 낳았습니다. 그는 비록 마지막에 태어났지만, 참으로 <이전에 있었던 것의> <한> 씨의 상태로 <있었습니다>.[c] 그러나 약속의 성취이며, 아버지께서 그를 통하여 구원을 나타내도록 정하신 이는 생명으로 내려왔을 때, 내려오는 데 필요한 모든 수단을 받았습니다. 그의 아버지는 한 분이시며, 참으로 그에게 아버지이신 유일한 분입니다. 그분은 보이지 않고 알 수 없으며 본성상 파악할 수 없는 분, 홀로 하나님이신 분입니다. 그분은 자신의 뜻과 선물로 말미암아 자신이 보이고 알려지고 파악될 수 있게 허락하셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증언을 토대로 한 잠정 번역입니다. 콥트어 원문에 대한 직접 검토가 필요합니다. ‘그가 선포한 것’의 ‘그’와 ‘그 도래’가 가리키는 대상은 문맥상 구원자 또는 구원자의 도래로 이해할 수 있으나, 문장 구조가 매끄럽지 않습니다.
    reason: 번역의 자료적 한계와 원문 증언의 대명사·구문 모호성을 알립니다.
  - marker: b
    text: 꺾쇠괄호 < >는 편집자가 복원한 것으로 보이는 부분을, 생략 부호 <…>와 빈 대괄호 []는 본문 손상이나 공백을 나타냅니다. 이 문장은 손상되어 있어 ‘말씀으로부터가 아니라’가 앞뒤와 어떻게 연결되는지 불확실합니다.
    reason: 필사본 손상 및 편집 복원 신호를 보존하고 구문 불확실성을 명시합니다.
  - marker: c
    text: ‘<이전에 있었던 것의> <한> 씨의 상태로 <있었습니다>’는 편집상 복원이 포함된 매우 불확실한 구절입니다. ‘씨’, 출생 순서, 계시의 관계를 확정적으로 풀어 쓰지 않았습니다.
    reason: 손상된 씨 모티프를 과도하게 해석하지 않고 진정한 모호성을 보존합니다.
lexical_decisions:
- source_word: Savior
  choice: 구원자
  rationale: 인물의 기능을 명확히 드러내면서 현대 한국어 독자가 자연스럽게 이해할 수 있는 용어입니다.
- source_word: proclamation
  choice: 선포
  rationale: 예언자적 공적 선언이라는 의미를 보존하며, 문맥에 따라 ‘메시지’와 구별했습니다.
- source_word: bestow/show favor
  choice: 은혜를 베풀다
  rationale: 호의나 은총을 수여한다는 의미를 자연스럽게 전달하되 특정 교파의 구원론으로 한정하지 않습니다.
- source_word: unbegotten
  choice: 나지 않은
  rationale: ‘비생성’ 같은 전문어보다 일반 독자가 이해하기 쉬우면서도 출생·발생되지 않았다는 대조를 살립니다.
- source_word: impassible
  choice: 고난을 받을 수 없는
  rationale: 감정이 없다는 뜻으로 오해될 수 있는 ‘무감각한’을 피하고, 바로 앞의 ‘고난을 받다’와의 신학적 대조를 보존합니다.
- source_word: spiritual Word / Word
  choice: 영적인 말씀 / 말씀
  rationale: 원문의 기술적이고 인격화될 수 있는 용법을 유지하고 ‘말’로 약화하지 않았습니다.
- source_word: grasped
  choice: 파악되다
  rationale: 물리적 포획보다 인식적 이해를 뜻하는 문맥을 살리며 ‘알려지다’와도 구별합니다.
theological_decisions:
- issue: 예언자들의 지식 범위
  choice: 그들은 구원자의 출생과 고난만 말할 자격을 얻었고, 기원과 선재에 관해서는 알지 못한 것으로 번역했습니다.
  alternative: 예언자들이 선재를 부분적으로 알았다고 완화할 수 있습니다.
  rationale: 증거 본문이 예언자들의 제한된 인식을 강하게 대조하므로 그 긴장을 그대로 보존했습니다.
- issue: 구원자의 선재와 육신 안에서 생겨난 말씀의 관계
  choice: 손상된 문장의 부정과 구문을 가능한 한 그대로 남겼습니다.
  alternative: ‘육신이 된 말씀의 선재’로 교리적으로 매끄럽게 재구성할 수 있습니다.
  rationale: 본문 손상과 문법적 불확실성이 커서 특정 성육신론으로 조화시키지 않았습니다.
- issue: 육신의 인간적 출생과 영적인 말씀으로부터의 기원
  choice: 두 진술을 나란히 유지했습니다.
  alternative: 인간 부모의 역할이나 영적 기원 가운데 하나를 우선해 해석할 수 있습니다.
  rationale: 본문 자체가 일반적 출생과 초월적 기원을 함께 주장하므로 그 이중성을 해소하지 않았습니다.
- issue: 보이지 않는 아버지가 보이고 알려지고 파악될 수 있음
  choice: 하나님이 자신의 뜻과 선물로 자신에 대한 인식을 허락하신 것으로 번역했습니다.
  alternative: 대명사 ‘그’를 구원자에게 돌려 구원자가 보이고 알려진다고 번역할 수 있습니다.
  rationale: 직전 주어가 아버지/하나님이므로 그 연결을 따랐지만, 원문의 대명사 지시 대상에는 잠재적 모호성이 있습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 문장은 일반 독자가 읽을 수 있도록 다듬되, 고대 문헌의 반복과 신학적 긴장, 대명사 모호성 및 손상 표시는 가능한 한 유지했습니다. ‘구원자’, ‘말씀’, ‘아버지’, ‘하나님’은 문헌의 기술적 용례를 존중했으며 특정 교파의 고유 표현은 피했습니다.
