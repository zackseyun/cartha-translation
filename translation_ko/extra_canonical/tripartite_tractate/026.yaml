  yaml_path: translation/extra_canonical/tripartite_tractate/026.yaml
  text: 'The Election shares in the nature and body of the Savior. It is like a bridal chamber because of its unity and union with him, since it was above all for its sake that Christ came. By contrast, the Calling is appointed for those who rejoice in the bridal chamber and are glad and happy about the union of the bridegroom and the bride. In this way, the place the Calling will receive is the aeon of the images, where the Word has yet to unite with the Fullness. Because of this, the Human of the Church was joyful and glad, and he hopes for her. He consists of spirit, soul, and body, corresponding to the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. He possessed what came from the [Father], which [] the places could receive. He also possessed the limbs we mentioned earlier. When the redemption was proclaimed, the Perfect Human immediately gained the knowledge of how to return quickly to his unity, to the place from which he originated. He joyfully returned to the place from which he had originated, the place from which he had come forth.


    However, his limbs needed a place of instruction, as is in the places prepared to provide it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and receive the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father, until the Totalities acquire a face like his. The restoration at the end, however, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption—that is, the path toward the incomprehensible Father, that is, the return to the pre-existent—and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not only from the control of those <of> the left, and not only an escape from the power of those of the right, whose slaves and sons we believed ourselves to be, and from whom no one escapes without quickly being caught by them again. Instead, redemption is also an ascent <to> the degrees in the Fullness and to those who received names and grasped them according to the ability of each aeon. It is also an entrance into what is silent, with no need for voice, knowledge, conceptualization, or enlightenment, but (where) all things are light, all radiant without any need for enlightenment.


    Angels as well as humans need redemption, as do the image, the Fullnesses of the aeons, and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended upon him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received naturally received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, his love, the fleshly Son, and the heavenly angels were considered worthy to form a fellowship with him on the earth. This is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed upon him, before anyone else.'
translation:
  language: ko
  text: '선택은 구원자의 본성과 몸에 참여합니다. 선택은 구원자와 하나를 이루고 그와 결합되어 있기 때문에 혼인방과 같습니다. 무엇보다도 선택을 위하여 그리스도께서 오셨기 때문입니다. 이와 달리 부르심은 혼인방을 기뻐하며, 신랑과 신부의 결합을 즐거워하고 기뻐하는 이들을 위하여 마련되어 있습니다. 이처럼 부르심이 얻게 될 자리는 형상들의 아이온[a], 곧 말씀이 아직 충만[b]과 결합하지 않은 곳입니다. 이 때문에 교회의 인간은 즐거워하고 기뻐했으며, 그는 그녀를 소망합니다.[c] 그는 영과 혼과 몸으로 이루어져 있으며, 구원의 계획을 세운 이와 상응합니다.


    그 인간 안에는 하나를 이루는 한 인간이 있었습니다. 그는 전체였고 그들 모두였기 때문입니다. 그는 [아버지]에게서 나온 것, 곧 여러 처소가 받아들일 수 있었던 [] 것을 지니고 있었습니다. 또한 그는 앞에서 말한 지체들도 지니고 있었습니다. 구속이 선포되자 완전한 인간은 즉시, 자신이 비롯된 곳인 자신의 하나 됨으로 어떻게 신속히 돌아갈지를 알게 되었습니다. 그는 자신이 비롯된 곳, 곧 자신이 나왔던 곳으로 기쁘게 돌아갔습니다.


    그러나 그의 지체들에게는 배움의 장소가 필요했습니다. 그러한 장소들은 거울처럼 형상들과 원형들을 그에게[d] 제공하도록 마련되어 있습니다. 교회의 몸에 속한 모든 지체가 같은 장소에 <결합되고>, 온몸이 나타남으로써 동시에 회복을 얻을 때까지, <…> 충만으로의 회복입니다.


    그것은 으뜸가는 공동의 조화와 결합, 곧 아버지께 속한 조화를 지니고 있으며, 이는 전체들이 아버지와 같은 얼굴을 얻을 때까지 이어집니다. 그러나 마지막의 회복은 <이루어질 것입니다>. 전체가 아들이신 분 안에서 드러난 뒤에 말입니다. 그분은 구속, 곧 이해할 수 없는 아버지께로 향하는 길이며, 이는 곧 미리 존재하던 것[e]으로 돌아가는 것입니다. 또한 전체들이 그 한 분 안에서 합당한 방식으로 자신들을 드러낸 뒤에 이루어질 것입니다. 그분은 붙잡을 수 없고 말로 표현할 수 없으며, [] 보이지 않고 이해할 수 없는 분께로 가는 길입니다. 그리하여 그것이 구속을 얻게 됩니다.[f]


    그 구속은 왼편에 속한 자들의 지배에서 풀려나는 것만도 아니고, 오른편에 속한 자들의 권세에서 벗어나는 것만도 아닙니다. 우리는 우리가 그들의 종이며 아들이라고 믿었고, 누구도 그들에게서 달아나자마자 다시 붙잡히지 않고서는 벗어날 수 없습니다. 오히려 구속은 충만 안의 단계들<로> 올라가는 것이며, 이름을 얻고 각 아이온의 역량에 따라 그것들을 파악한 이들에게로 올라가는 것입니다. 또한 구속은 고요한 것 안으로 들어가는 것입니다. 거기에는 음성도, 지식도, 개념화도, 비춤도 필요하지 않습니다. 그곳에서는 모든 것이 빛이며, 모든 것이 비춤을 전혀 필요로 하지 않은 채 찬란하기 때문입니다.


    인간뿐 아니라 천사들도 구속이 필요하며, 형상과 아이온들의 충만들, 그리고 놀랍도록 빛나는 권능들도 그러합니다. 심지어 전체의 구속을 위한 모형이신 아들 자신도 구속을 [필요로 하셨습니다]. [] 그분은 인간이 되셔서, 육신 안에 있으며 그분의 교회인 우리에게 필요한 모든 것에 자신을 내맡기셨기 때문입니다. 그 뒤 그분에게 내려온 말씀을 통하여 그분이 먼저 구속을 얻으셨을 때, 나머지 모두도 그분을 자신들의 것으로 받아들임으로써 그분에게서 구속을 얻었습니다. 이미 받은 이를 받아들인 이들은 그분 안에 있던 것을 자연히 받았기 때문입니다.


    육신을 지닌 인간들 가운데서 구속이 [베풀어지기] 시작한 때는, 그분의 맏아들과 그분의 사랑, 육신을 지닌 아들, 그리고 하늘의 천사들이 땅에서 그분과 친교를 이루기에 합당하다고 여겨졌을 때였습니다.[g] 이 때문에 그분은 “아버지의 천사적 구속”이라 불립니다. 그분은 전체에 관한 지식 때문에 슬퍼하던 이들을 위로하셨습니다. 누구보다 먼저 이 선물을 받은 분이 그분이셨기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이온’은 시대나 영원을 뜻할 수도 있지만, 이 문헌에서는 초월적 영역이나 존재 질서를 가리키는 전문 용어로도 쓰입니다.
    reason: 낯선 음역어의 의미 범위를 설명하기 위해서입니다.
  - marker: b
    text: ‘충만’은 이 문헌에서 신적 존재와 실재의 완전한 총체 또는 그 영역을 가리키는 전문 용어입니다.
    reason: 일상적 의미와 전문적 의미를 구별하기 위해서입니다.
  - marker: c
    text: ‘그’와 ‘그녀’가 각각 누구를 가리키는지는 현존 문맥에서 확정하기 어렵습니다. 번역은 증언의 성별 대명사와 모호성을 보존합니다.
    reason: 대명사의 지시 대상을 임의로 확정하지 않기 위해서입니다.
  - marker: d
    text: ‘그에게’로 옮긴 대명사의 지시 대상은 인간 또는 그의 지체일 수 있어 불확실합니다.
    reason: 영어 증언에 남은 대명사상의 모호성을 알리기 위해서입니다.
  - marker: e
    text: ‘미리 존재하던 것’은 선재한 상태, 존재 또는 영역을 가리킬 수 있습니다.
    reason: 문법적 성격과 지시 대상이 불분명한 표현을 섣불리 인격화하지 않기 위해서입니다.
  - marker: f
    text: ‘그것’이 전체, 회복, 또는 앞 문맥의 다른 대상을 가리키는지는 분명하지 않습니다.
    reason: 원 증언의 대명사 모호성을 보존했음을 밝히기 위해서입니다.
  - marker: g
    text: 이 문장의 ‘맏아들’, ‘그분의 사랑’, ‘육신을 지닌 아들’이 서로 다른 항목인지, 일부가 같은 존재를 달리 부르는 말인지는 확정하기 어렵습니다.
    reason: 손상되었거나 난해한 병렬 구문을 하나의 교리적 해석으로 통합하지 않기 위해서입니다.
lexical_decisions:
- source_word: Election
  choice: 선택
  rationale: 본문에서 인격적·집단적 실재처럼 쓰이는 전문 개념이지만, 한국어에서 자연스럽고 원문의 의미 범위를 열어 두는 ‘선택’을 사용했습니다.
- source_word: Calling
  choice: 부르심
  rationale: 단순한 소명이 아니라 특정 집단 또는 질서를 가리키는 추상명사적 전문 용법을 보존했습니다.
- source_word: aeon
  choice: 아이온
  rationale: ‘시대’나 ‘영원’만으로 번역하면 이 문헌에서의 영역·존재 질서라는 전문적 함의를 잃을 수 있어 음역하고 각주를 붙였습니다.
- source_word: Fullness / Pleroma
  choice: 충만
  rationale: 전체적 신적 영역을 가리키는 전문 의미를 살리되 일반 독자도 읽을 수 있는 전통적이고 간결한 번역어를 택했습니다.
- source_word: Totality / Totalities
  choice: 전체 / 전체들
  rationale: ‘모든 것’으로 풀어 쓰면 단일한 총체와 복수의 총체적 존재·질서 사이의 긴장이 사라지므로 수의 차이를 보존했습니다.
- source_word: restoration
  choice: 회복
  rationale: 원상 복귀와 충만으로의 귀환을 모두 포괄하며, 특정 교리 체계의 용어를 덧씌우지 않는 표현입니다.
- source_word: redemption
  choice: 구속
  rationale: 해방과 귀환을 함께 함축하는 문맥의 핵심 용어로 일관되게 옮겼습니다.
- source_word: archetypes
  choice: 원형들
  rationale: 형상들의 근원적 모형이라는 대조를 유지하고 복수형도 보존했습니다.
theological_decisions:
- issue: 아들 자신도 구속을 필요로 했다는 진술
  choice: ‘아들 자신도 구속을 [필요로 하셨습니다]’로 그대로 보존
  alternative: 아들이 다른 이들을 대신하여 구속을 이루셨다고 완화하여 번역
  rationale: 본문의 독특하고 긴장된 신학적 진술을 교리적으로 조정하지 않았으며, 보충·복원임을 나타내는 대괄호도 유지했습니다.
- issue: ‘왼편’과 ‘오른편’ 세력의 정체
  choice: 정체를 설명하거나 선악으로 치환하지 않고 문자적으로 유지
  alternative: 악한 세력과 의로운 세력 등으로 해석
  rationale: 본문 자체가 양쪽의 성격을 명시하지 않으므로 진정한 모호성을 보존했습니다.
- issue: Human of the Church의 성격
  choice: ‘교회의 인간’
  alternative: ‘교회에 속한 사람’ 또는 ‘교회의 사람’
