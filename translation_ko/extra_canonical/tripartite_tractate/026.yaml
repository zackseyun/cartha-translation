  revised_text: '선택은 구원자의 본성과 몸에 참여합니다. 선택은 구원자와 하나를 이루고 그와 결합되어 있기 때문에 혼인방과 같습니다. 무엇보다도 선택을 위하여 그리스도께서 오셨기 때문입니다. 이와 달리 부르심은 혼인방을 기뻐하며, 신랑과 신부의 결합을 즐거워하고 기뻐하는 이들을 위하여 마련되어 있습니다. 이처럼 부르심이 얻게 될 자리는 형상들의 아이온[a], 곧 말씀이 아직 충만[b]과 결합하지 않은 곳입니다. 이 때문에 교회의 인간은 즐거워하고 기뻐했으며, 그는 그녀를 소망합니다.[c] 그는 영과 혼과 몸으로 이루어져 있으며, 구원의 계획을 세운 이와 상응합니다.



    그 인간 안에는 하나를 이루는 한 인간이 있었습니다. 그는 전체였고 그들 모두였기 때문입니다. 그는 [아버지]에게서 나온 것, 곧 여러 처소가 받아들일 수 있었던 [] 것을 지니고 있었습니다. 또한 그는 앞에서 말한 지체들도 지니고 있었습니다. 구속이 선포되자 완전한 인간은 즉시, 자신이 비롯된 곳인 자신의 하나 됨으로 어떻게 신속히 돌아갈지를 알게 되었습니다. 그는 자신이 비롯된 곳, 곧 자신이 나왔던 곳으로 기쁘게 돌아갔습니다.



    그러나 그의 지체들에게는 배움의 장소가 필요했습니다. 이는 그것에[d] 거울처럼 형상들과 원형들을 제공하도록 마련된 처소들에 있는 것과 같습니다. 교회의 몸에 속한 모든 지체가 같은 장소에 <결합되고>, 온몸이 나타남으로써 동시에 회복을 얻을 때까지, <…> 충만으로의 회복입니다.



    그것은 으뜸가는 공동의 조화와 결합, 곧 아버지께 속한 조화를 지니고 있으며, 이는 전체들이 아버지와 같은 얼굴을 얻을 때까지 이어집니다. 그러나 마지막의 회복은 <이루어질 것입니다>. 전체가 아들이신 분 안에서 드러난 뒤에 말입니다. 그분은 구속, 곧 이해할 수 없는 아버지께로 향하는 길이며, 이는 곧 미리 존재하던 것[e]으로 돌아가는 것입니다. 또한 전체들이 그 한 분 안에서 합당한 방식으로 자신들을 드러낸 뒤에 이루어질 것입니다. 그분은 붙잡을 수 없고 말로 표현할 수 없으며, [] 보이지 않고 이해할 수 없는 분께로 가는 길입니다. 그리하여 그것이 구속을 얻게 됩니다.[f]



    그 구속은 왼편에 속한 자들의 지배에서 풀려나는 것만도 아니고, 오른편에 속한 자들의 권세에서 벗어나는 것만도 아닙니다. 우리는 자신들이 그들의 종이며 아들이라고 믿었습니다. 누구도 그들에게서 달아나자마자 다시 붙잡히지 않고서는 벗어날 수 없습니다. 오히려 구속은 충만 안의 단계들<로> 올라가는 것이며, 이름을 얻고 각 아이온의 역량에 따라 그것들을 파악한 이들에게로 올라가는 것입니다. 또한 구속은 고요한 것 안으로 들어가는 것입니다. 거기에는 음성도, 지식도, 개념화도, 비춤도 필요하지 않습니다. 그곳에서는 모든 것이 빛이며, 모든 것이 비춤을 전혀 필요로 하지 않은 채 찬란하기 때문입니다.



    인간뿐 아니라 천사들도 구속이 필요하며, 형상과 아이온들의 충만들, 그리고 놀랍도록 빛나는 권능들도 그러합니다. 심지어 전체의 구속을 위한 모형이신 아들 자신도 구속을 [필요로 하셨습니다]. [] 그분은 인간이 되셔서, 육신 안에 있으며 그분의 교회인 우리에게 필요한 모든 것에 자신을 복종시키셨기 때문입니다. 그 뒤 그분에게 내려온 말씀을 통하여 그분이 먼저 구속을 얻으셨을 때, 나머지 모두도 그분을 자신들의 것으로 받아들임으로써 그분에게서 구속을 얻었습니다. 이미 받은 이를 받아들인 이들은 그분 안에 있던 것을 자연히 받았기 때문입니다.



    육신을 지닌 인간들 가운데서 구속이 [베풀어지기] 시작한 때는, 그분의 맏아들과 그분의 사랑, 육신을 지닌 아들, 그리고 하늘의 천사들이 땅에서 그분과 친교를 이루기에 합당하다고 여겨졌을 때였습니다.[g] 이 때문에 그분은 “아버지의 천사적 구속”이라 불립니다. 그분은 전체에 관한 지식 때문에 슬퍼하던 이들을 위로하셨습니다. 누구보다 먼저 이 선물을 받은 분이 그분이셨기 때문입니다.'
