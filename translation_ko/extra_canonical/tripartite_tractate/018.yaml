translation:
  language: ko
  text: '그가 드린 기도와 그 기도로 말미암아 일어난 돌이킴을 생각하면, 어떤 이들은 멸망하고 어떤 이들은 유익을 얻으며 또 다른 이들은 따로 구별되는 것이 마땅합니다.[a] 그는 먼저 나타난 이에게서 받은 능력을 사용하여 불순종한 자들이 받을 형벌을 마련했습니다. 그는 그 나타난 이에게서 만물에 대한 권세를 받았으며, 이는 그가 그 이와 분리되게 하려는 것이었습니다. 그는 아래에 있는 자이며, 지극히 높으신 분과 구별된 채로 머뭅니다. 그러다가 만물을 위하여 구원의 계획을 외적으로 마련하고, 각각에게 정해진 자리를 줍니다.


    말씀은 총체들을 단장할 때 먼저 자신을 세웠습니다. 그는 생겨난 것들의 기초 원리이며 원인이며 통치자였습니다. 이는 세움의 원인이신 아버지께서 그 뒤에 가장 먼저 존재하셨던 것과 같습니다.[b] 말씀은 선재하는 형상들을 창조했으며, 감사와 찬양으로 그것들을 산출했습니다.


    그런 다음 말씀은 자신이 영광 가운데 산출한 이들을 위한 장소를 단장했습니다. 그곳은 “낙원”, “기쁨”, “양식이 가득한 환희”, “선재하는 이들의 환희”라고 불립니다.[c] 그곳은 충만 안에 거하는 모든 선한 것의 형상을 보존합니다.


    그런 다음 말씀은 왕국을 온갖 즐거운 것으로 가득한 성처럼 단장했습니다. 곧 형제 사랑과 넘치는 너그러움이며, 거룩한 영들과 그들을 다스리는 강한 권능들로 가득한 [부분]입니다.[d] 말씀은 이것들을 산출하고 능력으로 세웠습니다.


    다음으로 단장된 것은 이곳에 함께 모이는 교회를 위한 장소였습니다. 이 교회는 영겁들 안에 거하는 교회의 형상을 지니며, 아버지께 영광을 돌립니다.[e]


    이것들 뒤에 말씀은 소망에서 나오는 믿음과 순종을 위한 장소를 단장했습니다. 빛이 나타났을 때 [말씀]은 이것들을 받았습니다.[f]


    다음으로 그는 기도와 간구로 향하는 마음을 위한 장소를 단장했습니다. 그 뒤에는 용서와, 나타나실 분에 관한 말씀이 이어졌습니다.


    모든 영적 장소는 영적 능력 안에 존립합니다. 이 장소들은 기억에 속한 존재들과 다릅니다. 그 능력이 하나의 형상 안에 세워져 있고, 그 형상이 충만과 말씀을 갈라놓기 때문입니다.[g] 이와 달리 미래에 관한 예언 속에서 작용하는 능력은 선재하는 것을 위하여 생겨난 기억에 속한 존재들을 이끕니다.[h] 그리하여 그들이 말씀과 함께 머무는 것들을 바라봄으로써 존재하게 되는 것들과 뒤섞이지 않게 합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점의 원문 증언에는 판독할 수 없는 결락이 있습니다.
    reason: 영어 증언의 빈 대괄호를 본문 속 어색한 기호로만 남기지 않고 본문비평 정보로 보존했습니다.
  - marker: b
    text: 이 문장은 대명사의 지시 관계와 ‘누가 누구 다음에 먼저 존재했는가’가 불분명합니다. 번역은 제공된 영어 증언의 어순을 따릅니다.
    reason: 신학적으로 민감한 선재와 위계의 관계를 확정하지 않기 위해서입니다.
  - marker: c
    text: “선재하는 이들의 환희”에서 ‘이들의’에 해당하는 말은 증언 번역자가 보충한 것입니다.
    reason: 영어 증언의 꺾쇠괄호 보충을 표시했습니다.
  - marker: d
    text: ‘가득한’ 뒤에는 원문 증언의 결락이 있습니다. ‘[부분]’은 문장이 훼손되었음을 나타냅니다.
    reason: 두 번째 빈 대괄호의 본문 상태를 독자에게 알립니다.
  - marker: e
    text: ‘영겁들’은 흔히 ‘에온들’로도 옮기는 우주론적 용어입니다.
    reason: 일반어 번역이 가릴 수 있는 기술적 의미를 밝혔습니다.
  - marker: f
    text: ‘말씀’은 문맥에 따라 보충된 주어입니다.
    reason: 영어 증언의 대괄호 보충을 보존했습니다.
  - marker: g
    text: ‘그 형상’이 충만과 말씀을 구별한다는 이 문장의 정확한 관계는 불분명합니다.
    reason: 난해한 형이상학적 구문을 한 방향으로 단정하지 않기 위해서입니다.
  - marker: h
    text: ‘선재하는 것을 위하여 생겨난’은 증언 번역자가 결락되었거나 생략된 문구를 보충한 것입니다.
    reason: 영어 증언의 꺾쇠괄호 보충을 표시했습니다.
lexical_decisions:
- source_word: Word
  choice: 말씀
  rationale: 로고스적 인격을 가리키는 전통적이고 이해하기 쉬운 번역이며, 문맥상 인격적 행위자를 보존합니다.
- source_word: Totalities
  choice: 총체들
  rationale: 복수형과 우주론적 전문성을 보존하면서 ‘만물’과 구별했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 발렌티누스계 문헌의 기술적 개념을 교단적으로 풀어 쓰지 않고 직역에 가깝게 보존했습니다.
- source_word: aeons
  choice: 영겁들
  rationale: 시간적 의미와 실체적·우주론적 의미 사이의 긴장을 남기기 위해 음역 ‘에온’보다 일반 독자가 이해할 수 있는 표현을 택하고 복수형을 보존했습니다.
- source_word: beings of the memory
  choice: 기억에 속한 존재들
  rationale: 불분명한 기술적 표현을 특정 존재 계층으로 단정하지 않고 관계적 표현으로 옮겼습니다.
- source_word: subsists
  choice: 존립합니다
  rationale: 단순히 ‘존재한다’보다 어떤 능력 안에 근거를 두고 성립한다는 철학적 뉘앙스를 살렸습니다.
- source_word: inclination
  choice: 향하는 마음
  rationale: 기도와 간구를 향한 성향이라는 뜻을 자연스러운 현대 한국어로 표현했습니다.
theological_decisions:
- issue: ‘he’가 가리키는 인물의 불확실성
  choice: 첫 단락에서는 대명사와 ‘그’를 유지했습니다.
  alternative: 모든 대명사를 ‘말씀’으로 명시할 수 있습니다.
  rationale: 제공된 증거만으로 지시 대상을 확정하면 본문의 실제 모호성을 해소해 버리므로 이를 보존했습니다.
- issue: Father and ‘first to exist after him’ 구문의 관계
  choice: ‘아버지께서 그 뒤에 가장 먼저 존재하셨던 것과 같습니다’로 옮겼습니다.
  alternative: ‘아버지 다음으로 그가 가장 먼저 존재했다’로 재구성할 수 있습니다.
  rationale: 영어 증언 자체의 통사와 대명사 지시가 불안정하므로, 신학적 위계를 임의로 교정하지 않았습니다.
- issue: Church의 의미
  choice: ‘교회’로 번역하되 보통명사처럼 표기했습니다.
  alternative: ‘회중’ 또는 ‘에클레시아’로 옮길 수 있습니다.
  rationale: 천상적 원형과 지상적 모임의 대응을 살리면서도 특정 제도 교회를 뜻한다고 단정하지 않았습니다.
- issue: spiritual power와 holy spirits
  choice: 각각 ‘영적 능력’과 ‘거룩한 영들’로 구별했습니다.
  alternative: 둘 다 ‘영적 권능’ 계열로 통일할 수 있습니다.
  rationale: 단수의 추상적 힘과 복수의 영적 존재일 가능성을 구분하고, ‘성령’이라는 단일 위격으로 오해되지 않게 했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문체는 존엄성을 유지하되 지나친 한문투를 피했습니다. 원문이 난해한 대목에서는 유창성을 위해 의미를 확정하지 않고 통사적·신학적 모호성을 각주로 밝혔습니다. 제공 자료가 콥트어 직접 검토 전의 공공 영역 영어 증언이므로 본 번역은 잠정적이며, 결락·보충 표시는 모두 각주 표지로 본문에 연결했습니다.
