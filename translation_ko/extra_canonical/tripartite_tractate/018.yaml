    그런 다음 말씀은 자신이 영광 가운데 산출한 이들을 위한 장소를 단장하였습니다. 그곳은 “낙원”, “기쁨”, “양식이 가득한 환희”, “선재하는 이들의 환희”라고 불립니다.[c] 그곳은 충만 안에 거하는 모든 선한 것들의 형상을 보존합니다.



    그런 다음 말씀은 왕국을 온갖 즐거운 것으로 가득한 성처럼 단장하였습니다. 곧 형제 사랑과, 거룩한 영들과 그들을 다스리는 강한 권능들로 가득한 넘치는 너그러움입니다.[d] 말씀은 이것들을 산출하고 능력으로 세웠습니다.



    다음으로 단장된 것은 이곳에 함께 모이는 교회를 위한 장소였습니다. 이 교회는 영겁들 안에 거하는 교회의 형상을 지니며, 아버지의 영광을 위한 것입니다.[e]



    이것들 뒤에 말씀은 소망에서 비롯되는 믿음과 순종을 위한 장소를 단장하였습니다. 빛이 나타났을 때 [말씀]은 이것들을 받았습니다.[f]



    다음으로 그는 기도와 간구로 향하는 마음을 위한 장소를 단장하였습니다. 그 뒤에는 용서와, 나타나실 분에 관한 말씀이 이어졌습니다.



