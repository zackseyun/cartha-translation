  revised_text: '그가 드린 기도와 그 기도로 말미암아 일어난 돌이킴을 생각하면, 어떤 이들은 멸망하고 어떤 이들은 유익을 얻으며, 또 다른 이들은 따로 구별되는 것이 마땅합니다.[a] 그는 먼저 불순종한 이들을 위한 형벌을 마련하였습니다. 그는 나타난 분에게서 나온 능력을 사용하였고, 그분에게서 만물에 대한 권세를 받았는데, 이는 그가 그분과 분리되게 하려는 것이었습니다. 그는 아래에 있는 이이며, 지극히 높으신 분과 구별된 채로 머뭅니다. 그러다가 만물을 위하여 구원의 계획을 외적으로 마련하고 각각에게 정해진 자리를 줍니다.



