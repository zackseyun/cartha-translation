translation:
  language: ko
  text: '이분은 만족과 양식과 기쁨과 풍성한 깨달음을 위하여 그들에게 주어진 분입니다. 이 깨달음은 그분이 그들과 함께한 수고와 그분의 지식과 그분이 그들과 섞이신 것을 아우릅니다. 바로 이분이 ‘아들’이라 불리며 실제로 아들이신 분입니다. 그분은 ‘모든 것들’[a]이시기 때문입니다. 그들은 그분이 누구신지 알고, 그분이 자기들을 옷으로 덮어 주신다는 것도 압니다. 이분이 ‘아들’이라 불리는 분이며, 그들이 그 존재를 깨닫고 찾아다니던 분입니다. 이분은 아버지로 존재하시는 분이며, 그들이 말로 표현할 수도 파악할 수도 없는 분입니다. 이분은 생겨난 첫째 분입니다. 아무도 그분을 파악하거나 깨달을 수 없습니다. 과연 누가 높임받으신 분, 엄밀히 말해 미리 존재하시는 분께 가까이 나아갈 수 있겠습니까? 그러나 그분을 두고 생각해 낸 […] 모든 이름이나 그분을 두고 말하는 모든 이름은, 각자가 그분을 영화롭게 할 수 있는 역량에 따라 그분을 암시하며 공경하려고 쓰는 것입니다.


    그분이 자신을 펼쳐 ‘모든 것들’을 낳고 그들에게 지식을 생겨나게 하셨을 때, 그분에게서 일어나신 분, 그분은 […] 모든 이름을 거짓 없이 지니십니다. 엄밀히 말해 그분만이 유일한 첫째 분, 곧 아버지에게서 나온 인간이며, 내가 다음과 같이 [부르는] 분입니다.


    형상 없는 형상,


    몸 없는 몸,


    보이지 않는 얼굴,


    말로 표현할 수 없는 말씀,


    파악할 수 없는 마음,


    그분에게서 흘러나오는 샘,


    심긴 이들의 뿌리,


    존재하는 이들의 신,


    그분이 밝혀 주시는 이들의 빛,


    그분이 사랑하시는 이들의 사랑,


    섭리로 이끄시는 이들의 섭리,


    지혜롭게 하신 이들의 지혜,


    힘을 주신 이들의 힘,


    자기에게로 모으시는 이들의 모임,


    사람들이 찾던 것들의 계시,


    보는 이들의 눈,


    숨 쉬는 이들의 숨,


    살아 있는 이들의 생명,


    ‘모든 것들’과 섞인 이들의 하나 됨.


    이 모든 것은 한 분 안에 존속합니다. 그분은 이 모든 것을 온전히 옷처럼 입으시지만, 결코 하나의 이름만으로 불리지 않으십니다. 이 유일한 방식 안에서, 이 모든 것은 똑같이 한 분이면서 ‘모든 것들’입니다. 그분은 몸처럼 떼어 낼 수 있는 분도 아니며, 자신이 얻은 이름들에 따라 나뉘어 어떤 방식에서는 한 가지이고 […] 다른 방식에서는 [다른] 것이 되는 분도 아닙니다. 더구나 그분은 […] 안에서 변하지도 않으시며, 자신이 생각해 내는 이름들로 바뀌어 지금은 이것이 되고 다음에는 저것이 되거나, 지금은 한 가지였다가 다른 때에는 다른 것이 되지도 않으십니다. 오히려 그분은 끝까지 온전히 자기 자신으로 남으십니다. [그분은] 예외 없이 ‘모든 것들’ 전부로서 동시에 영원히 계십니다. 그분은 그 모두를 아우르는 분입니다. 그분은 ‘모든 것들’에게 아버지를 드러내셨습니다. 나아가 그분 자신이 ‘모든 것들’이십니다. 그분은 자기 자신에 대한 지식이시며 모든 속성과 능력이시기 때문입니다. 그리고 [그분] 자신이 [바로] 지식을 얻는 눈입니다. 그분은 자기 안에서 자기 자신을 철저히 바라보시며, 아들과 형상을 지니십니다.


    그러므로 그분의 능력과 속성은, 그분이 그것들을 낳으시는 방식 때문에 셀 수도 없고 들어 본 적도 없습니다. 그분의 말씀들이 낳는 이들은 셀 수 없고 서로 떼어 놓을 수도 없으며, 그분의 가르침들과 그분의 ‘모든 것들’도 그러합니다. 그분은 그들을 아십니다. 그들은 바로 그분 자신이신 것이기 때문입니다. 그들은 하나의 이름 안에 존속하며, 모두 그 이름을 통하여 말합니다. 그분은 그들을 내어 놓으셔서, 그들이 하나 된 방식 안에서 저마다의 고유한 속성에 따라 존재한다는 것을 발견하게 하십니다.


    [a] ‘모든 것들’은 원문의 우주론적 집합 개념을 나타내는 전문 용어입니다. 단순히 ‘만물’로 매끄럽게 바꾸지 않고, 복수성과 하나 됨 사이의 긴장을 보존했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 것들’은 원문의 우주론적 집합 개념을 나타내는 전문 용어입니다. 단순히 ‘만물’로 매끄럽게 바꾸지 않고, 복수성과 하나 됨 사이의 긴장을 보존했습니다.
    reason: 반복되는 핵심 전문 용어의 낯선 번역과 그 신학적·문학적 기능을 설명합니다.
lexical_decisions:
- source_word: the Totalities
  choice: ‘모든 것들’
  rationale: 문헌의 전문적 우주론 용어로서 집합적 전체와 그 구성원들의 복수성을 함께 드러내기 위해 따옴표를 붙여 일관되게 옮겼습니다.
- source_word: satisfaction and nourishment
  choice: 만족과 양식
  rationale: 추상적 충족과 먹여 기르는 기능을 구별하되 현대 한국어에서 자연스럽고 품위 있게 표현했습니다.
- source_word: mixing with them / mingled
  choice: 그들과 섞이신 것 / 섞인
  rationale: 원문의 결합 이미지를 ‘연합’ 같은 해석적 신학 용어로 순화하지 않고 보존했습니다.
- source_word: the human from the Father
  choice: 아버지에게서 나온 인간
  rationale: 낯선 표현을 ‘사람의 아들’ 등 익숙한 교리적 칭호로 바꾸지 않고 출처 관계와 인간 명칭을 그대로 살렸습니다.
- source_word: providence
  choice: 섭리
  rationale: 신적 돌봄과 인도를 함께 함축하는 전통적이면서도 널리 이해되는 한국어를 선택했습니다.
- source_word: subsist
  choice: 존속하다
  rationale: 단순한 위치를 뜻하는 ‘있다’보다 존재론적 지속을 드러내면서도 과도한 교리적 해석을 피했습니다.
theological_decisions:
- issue: 아들과 아버지의 동일성과 구별
  choice: 대명사와 반복 구조를 유지하여 본문이 말하는 동일성과 구별의 긴장을 보존함
  alternative: 삼위일체 또는 특정 영지주의 체계에 맞추어 주어를 명시적으로 구분함
  rationale: 본문 자체의 지시 관계가 유동적이므로 특정 교리 체계로 모호성을 해소하지 않았습니다.
- issue: ‘생겨난 첫째 분’과 ‘미리 존재하시는 분’의 병치
  choice: 두 표현을 모두 직역에 가깝게 유지함
  alternative: ‘처음 창조된 분’ 또는 ‘영원히 존재하는 분’으로 조화시킴
  rationale: 발생과 선재가 함께 놓이는 원문의 신학적 긴장을 그대로 남겼습니다.
- issue: ‘그분 자신이 모든 것들’이라는 진술
  choice: 동일성 진술을 약화하지 않음
  alternative: ‘모든 것들을 대표한다’ 또는 ‘모든 것들 안에 있다’로 설명함
  rationale: 존재론적 동일성을 말하는 듯한 원문의 강한 표현을 해석적으로 완화하지 않았습니다.
- issue: ‘아들과 형상을 지닌다’의 주체와 관계
  choice: 손상된 문맥의 표현을 그대로 보존함
  alternative: 아버지가 아들을 낳는다는 식으로 관계를 명확히 재구성함
  rationale: 직접 콥트어 검토가 보류된 상태이고 영어 증언도 모호하므로 확정적 해석을 피했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 찬가형 목록은 간결한 명사구와 평행 구조로 살렸습니다. 대괄호와 줄임표는 제공된 증언의 본문 손상 또는 복원 신호를 보존합니다. 꺾쇠괄호로 보충된 표현은 한국어 문장 안에 자연스럽게 반영하되 근거가 불확실한 곳은 재구성하지 않았습니다. 직접적인 콥트어 대조가 보류되어 있으므로, 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역입니다.
