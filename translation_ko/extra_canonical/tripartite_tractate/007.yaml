  source_fidelity: 영어 증언을 기준으로 볼 때, 초안은 핵심 전문어인 ‘Totalities’와 손상·복원 표지를 대체로 충실히 보존하고, 아버지·아들 관계의 유동성을 교리적으로 해소하지 않았습니다. 그러나 ‘joint labor’를 단순히 ‘함께한 수고’로 옮겨 공동성을 약화했고, 둘째 단락에서 ‘그분이 자신을 펼쳐 낳고 지식을 산출하셨다’는 구문을 ‘모든 것들’을 낳고 그들에게 지식을 생기게 한 것으로 바꾸어 목적어와 관계를 변경했습니다. 해당 문장을 바로잡고, 본문 결손부의 불확실성을 더 명시적으로 유지해야 합니다.
  naturalness: 합쇼체와 찬가형 병렬 목록은 전반적으로 자연스럽습니다. 다만 ‘생겨난 첫째 분’은 ‘first one who came to be’의 순서 의미를 ‘첫째’라는 친족·서열 어감으로 다소 치우치게 합니다. ‘생겨난 첫 번째 분’이 더 정확합니다. 또한 ‘이 모든 것은 … 이 모든 것은’의 지시와 ‘그들’을 구별하여 문단의 논리적 흐름을 약간 더 선명하게 했습니다.
  terminology: ‘모든 것들’, ‘섭리’, ‘존속하다’, ‘섞이다’의 선택은 증언의 낯선 존재론적·우주론적 어휘를 해석적으로 평탄화하지 않는 점에서 적절합니다. ‘the human from the Father’도 ‘아버지에게서 나온 인간’으로 유지했습니다. ‘unheard’는 단순히 청각 경험의 부재라기보다 알려지지 않음을 포함하므로 ‘전해진 적도 없으므로’로 조정했습니다.
  issues:
  - severity: high
    issue: 둘째 단락의 beget/produce 구문이 의미상 재배열되었습니다.
    rationale: 증언은 그분이 자신을 펼쳐 ‘모든 것들을 위하여’ 낳고 지식을 산출하실 때 그분에게서 일어난 이를 말합니다. 초안의 ‘모든 것들을 낳고 그들에게 지식을 생겨나게’는 ‘Totalities’를 낳는 직접목적어로 만들고 지식의 수혜자를 추가하여 관계를 바꿉니다.
  - severity: medium
    issue: ‘joint labor’의 공동성이 충분히 드러나지 않습니다.
    rationale: ‘그분이 그들과 함께한 수고’는 함께 수행했다는 뜻으로 읽힐 수 있으나, 원문의 결합·공동 노동의 명사적 표현을 더 직접적으로 보존하려면 ‘그분과 그들의 공동 수고’가 적절합니다.
  - severity: medium
    issue: 결손부 뒤에 ‘모든 이름을 거짓 없이 지니십니다’라는 완결된 서술을 넣었습니다.
    rationale: 영어 증언은 ‘he […] every name without falsehood’로 동사가 결손되어 있습니다. ‘지니십니다’를 확정하면 결손된 동사를 복원하는 셈이므로, 한국어에서도 줄임표와 문장 연결의 불완전성을 남겨야 합니다.
  - severity: low
    issue: ‘생겨난 첫째 분’의 ‘첫째’는 원문의 단순 순서 표현보다 친족·서열 뉘앙스가 강합니다.
    rationale: ‘the first one who came to be’에는 ‘첫 번째’가 더 중립적이며, 이어지는 ‘only first one’과의 긴장도 유지합니다.
  revised_text: '이분은 만족과 양식과 기쁨과 풍성한 깨달음을 위하여 그들에게 주어진 분입니다. 이 풍성한 깨달음은 그분과 그들의 공동 수고, 그분의 지식, 그리고 그분이 그들과 섞이신 것을 아우릅니다. 바로 이분이 ‘아들’이라 불리며 실제로 아들이신 분입니다. 그분은 ‘모든 것들’[a]이시기 때문입니다. 그들은 그분이 누구신지 알고, 그분이 자기들을 옷으로 덮으신다는 것도 압니다. 이분이 ‘아들’이라 불리는 분이며, 그들이 그 존재를 깨닫고 찾아다니던 분입니다. 이분은 아버지로 존재하시는 분이며, 그들이 말할 수도 파악할 수도 없는 분입니다. 이분은 생겨난 첫 번째 분입니다. 아무도 그분을 파악하거나 깨달을 수 없습니다. 과연 누가 높임받으신 분, 엄밀히 말해 미리 존재하시는 분께 가까이 나아갈 수 있겠습니까? 그러나 그분에 관하여 생각된 […] 이름들이나 그분에 관하여 말해진 모든 이름은, 각자가 그분을 영화롭게 할 수 있는 역량에 따라 그분을 암시하고 공경하기 위하여 쓰입니다.


    그분이 자신을 펼쳐 ‘모든 것들’을 위하여 낳고 지식을 산출하셨을 때 그분에게서 일어나신 분, 그분은 […] 모든 이름을 거짓 없이, 엄밀히 말해 그분만이 유일한 첫 번째 분, 곧 아버지에게서 나온 인간이며, 내가 다음과 같이 [부르는] 분입니다.


    형상 없는 형상,


    몸 없는 몸,


    보이지 않는 얼굴,


    말로 표현할 수 없는 말씀,


    파악할 수 없는 마음,


    그분에게서 흘러나오는 샘,


    심긴 이들의 뿌리,


    존재하는 이들의 신,


    그분이 밝혀 주시는 이들의 빛,


    그분이 사랑하시는 이들의 사랑,


    섭리로 이끄시는 이들의 섭리,


    지혜롭게 하신 이들의 지혜,


    힘을 주신 이들의 힘,


    자기에게로 모으시는 이들의 모임,


    사람들이 찾던 것들의 계시,


    보는 이들의 눈,


    숨 쉬는 이들의 숨,


    살아 있는 이들의 생명,


    ‘모든 것들’과 섞인 이들의 하나 됨.


    이 모든 것은 한 분 안에 존속합니다. 그분은 자신을 온전히 (이 모든 것으로) 입으시지만, 결코 자신의 단일한 이름으로 불리지 않으십니다. 이 단일한 방식 안에서, 그들은 똑같이 한 분이면서 ‘모든 것들’입니다. 그분은 몸처럼 떼어 낼 수 있는 분도 아니며, 자신이 얻은 이름들에 따라 나뉘어 어떤 방식에서는 한 가지이고 […] 다른 방식에서는 [다른] 것이 되는 분도 아닙니다. 더구나 그분은 […] 안에서 변하지도 않으시며, 자신이 생각해 내는 이름들로 바뀌어 지금은 이것이 되고 다음에는 저것이 되거나, 지금은 한 가지였다가 다른 때에는 다른 것이 되지도 않으십니다. 오히려 그분은 끝까지 온전히 자기 자신으로 남으십니다. [그분은] 예외 없이 ‘모든 것들’ 전부로서 동시에 영원히 계십니다. 그분은 그 모두를 아우르는 분입니다. 그분은 ‘모든 것들’에게 아버지를 드러내셨습니다. 나아가 그분 자신이 ‘모든 것들’이십니다. 그분은 자기 자신에 대한 지식이시며 모든 속성과 능력이시기 때문입니다. 그리고 [그분] 자신이 [바로] 지식을 얻는 눈입니다. 그분은 자기 안에서 자기 자신을 철저히 바라보시며, 아들과 형상을 지니십니다.


    그러므로 그분의 능력과 속성은, 그분이 그것들을 낳으시는 방식 때문에 셀 수도 없고 전해진 적도 없습니다. 그분의 말씀들이 낳는 이들은 셀 수 없고 서로 떼어 놓을 수도 없으며, 그분의 가르침들과 그분의 ‘모든 것들’도 그러합니다. 그분은 그들을 아십니다. 그들은 바로 그분 자신이신 것이기 때문입니다. 그들은 하나의 이름 안에 존속하며, 모두 그 이름을 통하여 말합니다. 그분은 그들을 낳으셔서, 그들이 하나 된 방식 안에서 저마다의 고유한 속성에 따라 존재한다는 것을 발견하게 하십니다.'
  revised_footnotes:
  - marker: a
    text: ‘모든 것들’은 원문의 우주론적 집합 개념을 나타내는 전문 용어입니다. 단순히 ‘만물’로 매끄럽게 바꾸지 않고, 복수성과 하나 됨 사이의 긴장을 보존했습니다.
    reason: 반복되는 핵심 전문 용어의 낯선 번역과 그 문학적·사상적 기능을 설명합니다.
  revision_rationale: 직접 콥트어 대조가 보류되어 있으므로 제공된 공공 영역 영어 증언을 기준으로 검토했습니다. 개정은 특히 ‘Totalities를 위하여 낳고 지식을 산출하다’라는 구문의 문법 관계를 회복하고, 결손된 동사를 임의로 보충하지 않으며, 공동성·순서성·병렬성을 더 충실히 반영합니다. 대괄호, 줄임표, 괄호는 증언의 결손·복원·부연 신호를 보존했습니다.
