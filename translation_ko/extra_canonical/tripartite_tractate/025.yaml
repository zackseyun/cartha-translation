  revised_text: '### 세 부류의 인간


    인간은 본성에 따라 세 부류, 곧 영적인 부류와 혼적인 부류와 물질적인 부류로 나뉘게 되었습니다. 이들은 말씀의 세 겹 성향에 상응하며, 그 성향에서 물질적인 이들과 혼적인 이들과 영적인 이들이 생겨났습니다. 이 세 본성의 부류는 각각 그 열매로 알려집니다. 그러나 처음부터 알려진 것은 아니며, 구원자가 와서 성도들에게 빛을 비추고 각자가 어느 부류에 속하는지를 드러냈을 때에야 비로소 알려졌습니다.


    영적인 부류는 빛에서 나온 빛과 같고 영에서 나온 영과 같습니다. 그 머리가 나타났을 때, 그것은 곧바로 자기에게 맞는 부류를 향해 서둘러 나아갔습니다. 갑자기 그것은 자기 머리를 위한 몸으로 자라났고, 계시를 통해 즉시 지식을 얻었습니다.


    그와 달리 혼적인 부류는 불에서 나온 빛과 같습니다. 그것은 자기에게 나타난 이를 알아보기를 주저했고 [][a], 믿음으로 그에게 서둘러 나아가기는 더욱 주저했습니다. 오히려 한 음성이 그것을 가르쳤고, <그것은> 그것으로 만족했습니다. 이는 그것이 약속에 대한 소망에서 멀리 떨어져 있지 않았고, 장차 올 것들에 대한 확증을 이를테면 보증의 형태로 받았기 때문입니다.


    그와 달리 물질적인 부류는 모든 면에서 이질적입니다. 그것은 어둠을 닮아서 비치는 빛을 배척하는데, 그 빛이 나타나면 자신이 소멸되기 때문입니다. 또한 그것은 그의 <오심>을 받아들이지 않았으므로 <절제하지 못하며>, 주님의 계시에 대한 악의로 가득합니다.


    영적인 부류는 모든 면에서 온전한 구원을 얻을 것입니다. 물질적인 부류는 대적자에게 일어나는 것처럼 모든 면에서 멸망할 것입니다. 혼적인 부류는 생겨난 방식으로나 본성으로나 중간 위치에 있기 때문에 양면성을 지니며, 이는 선과 악 양쪽을 향하는 그 성향에 상응합니다. 그것을 두고 정해진 것은 불확실합니다. <…> 그리고 선한 것에서 완전히 <벗어나는 것> 또한 그러합니다.[b]


    말씀이 자기 생각 속에 미리 존재하던 본에 따라 낳은 이들은, 그가 높으신 분을 기억하고 구원을 구하며 기도했을 때 곧바로 구원을 얻었습니다. [구원을 주는] 생각 때문에, 그 생각이 낳은 이들은 온전히 구원받았습니다. 이들이 다시 낳은 [이들]에게도 마찬가지이며, [] 천사든 인간이든 그러합니다. 그들은 자신들보다 더 높으신 분이 계심을 인정하고, 그분께 기도하며 그분을 찾는 데 뜻을 같이하므로, 생겨난 이들이 받은 것과 같은 구원을 그들 역시 받을 것입니다. 그들이 선한 성향에서 나왔기 때문입니다. 그들에게는 구원자가 장차 오실 것과, 오신 뒤에 자신을 드러내실 것을 선포하는 임무가 맡겨졌습니다. 천사든 인간이든, 그가 그들을 이 임무에 세웠을 때 그들은 참으로 자기 존재의 본성을 얻었습니다.


    그와 달리 지배하려는 욕망의 생각에서 나온 이들, 곧 그의 대적자들이 가한 타격으로 생겨난 이들은 그 생각에 의해 생겨났습니다. 그들은 섞인 이들이므로 불확실한 결말을 맞을 것입니다. 다만 한때 일정한 기간 동안만 그들에게 허락된 지배욕을 벗어 버리고, 영광의 주님께 영광을 돌리며, 자기 분노를 버리는 이들은 겸손에 대한 보상, 곧 끝없는 존재를 얻을 것입니다.


    그와 달리 높은 자리를 탐하는 욕망 때문에 교만하고, 지나가는 영광을 사랑하며, 권세가 오직 일정한 기간과 때에만 자신들에게 맡겨졌다는 사실을 잊은 이들이 있습니다. 그리하여 그들은 하나님의 아들이 [] 만물의 주님이시며 구원자이심을 고백하지 않았고, 자기 분노를 버리지도 악한 자들을 본받는 일을 그만두지도 않았습니다. 그들은 잘못된 길에 들어서 헤맨 이들과 함께, 자기 무지와 어리석은 욕정에 대한 보응을 받을 것입니다.


    더욱 악한 이들은 왼편의 권세들이 주님께 했던 것처럼 그분을 거슬러 합당하지 않은 일을 저지르고, 심지어 그분을 죽이기까지 한 자들입니다. 그들은 속으로 말했습니다. “전체의 왕이라고 선포된 이를 죽이면, 우리가 전체의 주인이 될 것이다.” 그들은 이 목적을 이루려고 일했습니다. 그들은 인간이든 천사든 오른편에 속한 이들의 선한 성향에서 나오지 않고 혼합에서 나온 자들입니다. 그들은 자기 영광을 택했으나, 그것은 지나가는 영광이며 욕망일 뿐입니다. 반면 영원한 안식으로 가는 길은 구원에 이르게 하는 겸손을 통과하며, 구원받을 이들인 오른편에 속한 자들의 길입니다.[c]


    그들은 주님을 찬양하고, 교회를 기쁘게 하는 것이 무엇인지 생각하며, 교회와 함께 겸손한 이들의 찬송을 힘닿는 데까지 부르고, 교회를 기쁘게 하는 일을 할 것입니다. 또한 교회의 유익을 헤아리는 이들처럼 교회의 고난과 고뇌에 함께할 것이며, 교회가 품은 소망에도 참여할 것입니다. 이는 [] 인간과 천사에게 해당합니다.


    왼편 계열에 속한 이들의 길은 멸망으로 이어집니다. 그들은 주님을 배척하고 그분을 해칠 악한 계략을 꾸몄을 뿐 아니라, 교회를 향해서도 증오와 시기와 질투를 쏟았습니다. 바로 이것이 교회를 괴롭히고, 스스로를 부추겨 교회에 <시련>을 일으킨 이들이 정죄받는 까닭입니다.'
