  revised_text: '자비를 베풀려는 마음에서 우리 구원자는, 자신이 나타나신 이들이 본능적인 격정 때문에 되어 버린 것과 같은 존재, 곧 육체와 영혼이 되셨습니다. 육체와 영혼은 끊임없이 그들을 지배하며, 그들은 멸망하고 죽습니다. 그러나 보이지 않게 [생겨난] [본문 결락][a] [보이지 않는 것으로 된] 이들에게는, 보이지 않게 자신에 관하여 가르치셨습니다. 그는 자신이 구원하려 하신 이들의 죽음을 친히[b] 짊어지셨을 뿐 아니라, 그들이 육체와 영혼을 지니고 [태어났을][b] 때 떨어져 들어간 그 비천함도 받아들이셨습니다. 이는 그가 육체와 영혼을 지닌 아기로 태어나기를 기꺼이 택하셨기 때문입니다. 그는 빛을 지닌 채 타락한 이들이 겪는 다른 모든 처지에도 참여하셨습니다. 그보다 높이 계셨지만, 죄와 더러움과 부패 없이 잉태되기를 기꺼이 택하셨기 때문입니다. 그는 생명 안에 거하시면서 육체적 생명으로 태어나셨습니다. 회심하여 스스로 움직이기 시작한 말씀에게서 나온 격정과 변하기 쉬운 성향 때문에, 양쪽이 똑같이 육체와 영혼이 되도록 정해져 있었기 때문입니다.[c]


    그러나 구원의 경륜[d]에 따라, 앞에서 말한 것들의 결과를 친히 짊어지신 분은 바로 그분이셨습니다. 곧 말씀이 자신에게로 돌이켜 스스로 움직이기 시작한 뒤, 빛을 비추는 환상과 말씀의 굳건한 생각에서 생겨난 것들을 짊어지셨습니다. 그분처럼 육체와 영혼, 또 확립과 굳건함과 지혜를 취한 이들에 관해서는, 본문이 바로 이러한 방식이라고 말합니다.[e] 미리 정해진 구원자의 오심과 함께 그들도 모이도록 미리 정해져 있었습니다. 구원자께서 결정을 내리신 뒤에야 그들도 왔습니다. 이처럼 그들은 육체적 유출에 있어서 결핍에서 생겨난 이들을 훨씬 더 뛰어넘었습니다. [본문 결락][a] 그들도 구원자처럼 그분과 하나 됨이 드러남으로써 육체적 유출을 겪었기 때문입니다.


    이들은 하나의 실체, 곧 영적인 실체에 속한 이들입니다. 그러나 구원의 경륜은 다양하여 이것은 한 가지이고 저것은 다른 것입니다. 어떤 이들은 격정과 분열에서 나와 치유가 필요합니다. 다른 이들은 병든 이를 낫게 하는 그 기도에서 나오며, 타락한 이들을 치료하도록 세움을 받습니다. 이들이 사도들과 소식의 선포자들입니다. 그들은 구원자의 제자들이며, 가르침이 필요한 이들을 가르치는 이들입니다.


    그렇다면 구원의 경륜에 따라 그들이 그러한 격정에 참여하지 않으신 구원자와 함께 한 몸 안에서 생겨났다면, 어째서 격정에서 생겨난 이들과 같은 격정에 그들도 참여합니까? 구원자는 하나인 존재의 형상이셨으며, 육체적 양태로 나타난 전체[f]이셨습니다. 그러므로 그는 나뉠 수 없음의 본을 지키셨고, 거기에서 격정에 좌우되지 않음이 나옵니다. 그러나 그들은 드러난 각 존재의 형상입니다. 그러므로 그들은 자기 본에서 분리되는 것을 받아들입니다. 하늘 아래 있는 심어진 것[g]을 위하여 형체를 취했기 때문입니다. 그 심어진 것 또한 그들이 이른 곳들을 지배하는 악에 [본문 결락][a] 참여합니다. 의지가 전체를 죄 아래 사로잡아 두었으니, 이는 의지로 그가 전체에 자비를 베풀어 그들이 구원받게 하려는 것이었습니다.[h] 생명을 주도록 선택받은 이는 하나뿐이고, 나머지는 모두 구원이 필요하기 때문입니다.


    이 때문에 그는, 자신이 다른 이들에게 선포할 자격이 있다고 여기신 이들이 선포하는 선물들을 베푸는 은혜를 얻은 이들 가운데 첫째가 되셨습니다. 예수 그리스도의 약속의 씨가 자리 잡았기 때문입니다. 우리는 그 씨가 드러나고 하나 되는 일을 섬겨 왔습니다. 그 약속은 가르침을 가능하게 했고, 그들이 처음에 어떠했는가로 돌아가는 일도 가능하게 했습니다. 그들 안에는 그곳으로 돌아가게 기울게 하는 한 방울이 있습니다. 이것을 그들은 ‘구속’이라고 부릅니다. 구속은 사로잡힘에서 풀려나 자유를 얻는 것입니다.


    사로잡힘은 무지에 노예가 된 이들의 사로잡힘입니다. 이와 달리 자유는 무지보다 먼저 존재했고, 시작도 끝도 없이 영원히 지속되는 진리를 아는 것입니다. 그것은 선한 것이며, 모든 것을 고치는 치료제이고, 사람을 노예로 삼는 본성에서 풀려나는 것입니다. 그 본성은 공허에 대한 비천한 생각에서 생겨난 이들에게 고통을 겪게 한 본성, 곧 악한 성향의 본성입니다. [본문 결락][a] 그 본성은 그들을 지배욕으로 떨어뜨리는 생각과 관련됩니다.[i] 자녀들을 굽어본 풍성한 은혜로부터 그들은 자유라는 보물을 받았습니다. 자유는 격정을 무너뜨리고, 말씀이 그것들을 자신에게서 갈라놓으셨을 때 자유가 일찍이 자신에게서 내버렸던 것들을 멸합니다. 말씀은 구원의 경륜이 끝날 때까지 그것들이 멸망하도록 정해 두셨으나, 미리 정해진 일들에 그것들도 쓸모가 있었으므로 계속 존재하도록 허락하셨습니다.'
