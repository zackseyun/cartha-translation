  source_fidelity: 제공된 영어 증언(콜론어 원문 직접 대조는 보류됨)과 대조할 때, 초안은 대체로 논지와 불확실성 표지를 보존합니다. 그러나 ‘만물’처럼 원문에 없는 총칭을 넣은 곳, ‘그리스의 현자들과 이방 민족의 현자들’처럼 수식 범위를 넓힌 곳, 그리고 ‘<before>’를 ‘그런 다음에야’로 뒤집은 곳은 수정이 필요합니다. 히브리 민족 및 물질적인 자들의 글에 관한 훼손된 문장은 문법적으로 매끈하게 만들기보다 단편성과 불확실성을 드러내도록 조정했습니다.
  naturalness: 현대 표준 한국어 합쇼체를 유지했습니다. ‘같은 열정’은 여기서 정서적 열정보다 함께 작동하게 하는 충동·정념을 가리키므로 ‘같은 충동’으로 다듬었습니다. 다만 사본 훼손과 복원으로 인해 본래 난삽한 구절들은 의미를 단정하지 않기 위해 제한적으로 난삽함을 남겼습니다.
