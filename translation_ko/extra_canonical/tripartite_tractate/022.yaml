  revised_text: '**서로 다른 견해들**


    오른편의 질서와 왼편의 질서, 이 두 질서가 그들 사이에 있는 (중재하는) 생각으로 서로 결합할 때, 그 생각은 그들에게 공동의 구원 계획을 줍니다. 그 결과 양쪽은 같은 충동으로 작용하여, 오른편에 속한 자들은 왼편에 속한 자들을 본받고 왼편에 속한 자들은 오른편에 속한 자들을 본받습니다. 때로 악한 질서가 어리석음 때문에 악을 행하기 시작하면, <지혜로운> 질서도 그들을 본받아 남성의 형태로 악을 행합니다. 마치 그 질서도 악의 권세인 것처럼 말입니다. 또 때로는 지혜로운 질서가 선한 일을 하기 시작하면, <어리석은> 질서도 그것을 본받아 선을 행하려고 합니다.[a]


    이러한 종류의 [] 행위들로 말미암아 사물들이 세워지며, 유사한 것과 상이한 것이 서로 닮도록 존재하게 됩니다. 그러므로 가르침을 받지 못한 사람들은 존재하는 것들의 원인을 알 수 없습니다. 그래서 그들은 여러 가지 설명을 내놓았습니다. 어떤 이들은 존재하는 것들이 섭리에서 존재를 얻는다고 말합니다. 이들은 창조의 움직임에서 질서와 일정한 형식을 보는 사람들입니다. 다른 이들은 존재가 낯선 어떤 것에서 비롯된다고 말합니다. 이들은 권세들의 무법함에서 <다양성>과 악을 보는 사람들입니다. 또 어떤 이들은 존재하는 것들이 운명 때문에 생긴다고 말합니다. 이들은 이 문제에 몰두한 사람들입니다. 어떤 이들은 그것이 자연의 문제라고 하고, 또 어떤 이들은 우연의 문제라고 합니다. 그러나 보이는 원소들까지만 파악한 사람들 가운데 대다수는 그것들 너머에 있는 것을 전혀 알지 못합니다.


    그리스의 현자들과 이방인들은 상상과 헛된 생각을 통해 존재하게 된 권세들, <그리고> 그들 가운데 작용하는 다툼과 반역적인 행태를 통하여 이 권세들에서 생겨난 자들까지 파악했습니다. 그 결과 그들은 자신들이 지혜라고 여긴 것들에 관하여 말할 때 하나의 <모상>에 속았습니다. 그들은 진리에 이르렀다고 믿었지만, [] 실제로는 오류에 이르렀습니다. 이 오류는 사소한 명칭들에만 관련된 것이 아니었습니다. 권세들 자체가 그들에게 자신들이 총체를 <이해했다>고 믿게 하여 그들을 가로막았습니다.[b]


    그리하여 그 질서는 자기 안에서 싸우게 되었습니다. 이는 그보다 먼저 존재한 [더 높은] 통치자의 [한 자손]이 품은 교만한 적의 때문이었습니다. 이 때문에 모든 사람이 모든 것에 관하여 완전히 의견을 달리하게 되었습니다. 철학과 여러 종류의 의술, 수사학의 여러 부류, 여러 종류의 음악, 논리학의 여러 체계가 모두 견해와 이론이 되었습니다. 그리하여 <말 많음>이 득세했고, <그들은> 혼란에 빠졌습니다. 권세를 지니고 그들에게 이론을 준 <자들>을 설명할 수 없었기 때문입니다.


    <히브리 민족> 가운데 생겨난 것들, 곧 물질적인 자들이 쓴 글들, <그리스인들이> 그 본을 따르는 것들에 관하여 말하자면, 그것을 말로 표현하려고 그들이 생각한 모든 것에 오른편의 권세들이 <…> 있었습니다. 이 권세들은 그들 모두에게 영감을 주어 말과 자기 표상을 <통해> 생각하게 했습니다. 그리하여 그들은 자기들 안에서 작용하는 혼합된 여러 권세를 사용하여 진리에 이르는 길을 걷기 시작했습니다.


