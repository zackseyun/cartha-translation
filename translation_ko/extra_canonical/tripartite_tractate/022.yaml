translation:
  language: ko
  text: '**서로 다른 견해들**


    오른편의 질서와 왼편의 질서, 이 두 질서가 그들 사이에 있는 중재의 생각으로 서로 결합할 때, 그 생각은 그들에게 공동의 구원 계획을 줍니다. 그 결과 양쪽은 같은 열정으로 움직여, 오른편에 속한 자들은 왼편에 속한 자들을 본받고 왼편에 속한 자들은 오른편에 속한 자들을 본받습니다. 때로 악한 질서가 어리석음 때문에 악을 행하기 시작하면, <지혜로운> 질서도 그들을 따라 하여 남자의 모습으로 악을 행합니다. 마치 그 질서 역시 악의 권세인 듯합니다. 또 때로는 지혜로운 질서가 선한 일을 하기 시작하면, <어리석은> 질서도 그것을 본받아 선을 행하려고 합니다.[a]


    이와 같은 행위들로 말미암아 만물이 세워졌고, 서로 같은 것과 서로 다른 것이 서로 닮아 보이게 되었습니다. 그러므로 가르침을 받지 못한 사람들은 존재하는 것들의 원인을 알 수 없습니다. 그래서 그들은 여러 가지 설명을 내놓았습니다. 어떤 이들은 존재하는 것들이 섭리에서 비롯되었다고 말합니다. 이들은 창조 세계의 움직임에서 질서와 일정한 형식을 보는 사람들입니다. 다른 이들은 존재가 낯선 어떤 것에서 비롯되었다고 말합니다. 이들은 권세들의 무법함에서 <다양성>과 악을 보는 사람들입니다. 또 어떤 이들은 존재하는 것들이 운명 때문에 생긴다고 말합니다. 이들은 이 문제에 몰두한 사람들입니다. 어떤 이들은 자연 때문이라고 하고, 또 어떤 이들은 우연 때문이라고 합니다. 그러나 보이는 원소들까지만 파악한 사람들 가운데 대다수는 그것들 너머에 있는 것을 전혀 알지 못합니다.


    그리스의 현자들과 이방 민족의 현자들이 파악한 것은, 상상과 헛된 생각을 통해 존재하게 된 권세들, <그리고> 그 권세들 가운데 작용하는 다툼과 반역적인 행태로 말미암아 그들에게서 생겨난 자들까지였습니다. 그 결과 그들은 자신들이 지혜라고 여긴 것들을 말하면서도 하나의 <모상>에 속았습니다. 그들은 진리에 이르렀다고 믿었지만, [] 실제로는 오류에 이르렀습니다. 이 오류는 사소한 명칭들에만 관련된 것이 아니었습니다. 권세들 자체가 그들에게 ‘자신들이 총체를 <이해했다>’고 믿게 하여 그들을 가로막았습니다.[b]


    그리하여 그 질서는 자기 안에서 싸우게 되었습니다. 이는 그보다 먼저 존재한 [더 높은] 통치자의 [한 자손]이 품은 교만한 적의 때문이었습니다. 이 때문에 모든 사람이 모든 것에 관하여 완전히 의견을 달리하게 되었습니다. 철학과 여러 종류의 의술, 수사학의 여러 부류, 여러 종류의 음악, 논리학의 여러 체계가 모두 견해와 이론으로 갈라졌습니다. 그리하여 <말 많음>이 득세했고, <그들은> 혼란에 빠졌습니다. 권세를 지니고 그들에게 이론을 준 <자들>을 설명할 수 없었기 때문입니다.


    <히브리 민족> 가운데 생겨난 것들에 관해서 말하자면, 물질에 속한 자들이 기록한 글들은 <그리스인들이> 그 본을 따르는 것들입니다. 그들이 그것을 말로 표현하려고 생각한 모든 것에는 오른편의 권세들이 <…> 있었습니다. 이 권세들은 그들 모두에게 영감을 주어 말과 자기 표상을 <통해> 생각하게 했습니다. 그리하여 그들은 자기들 안에서 작용하는 혼합된 여러 권세를 사용하여 진리에 이르는 길을 걷기 시작했습니다.


    그 뒤 그들은 섞이지 않은 권세들의 질서에 이르렀고, <그런 다음에야> 아버지의 닮음을 따라 세워진 이에게 이르렀습니다. 그는 본성 <때문에> 보이지 않는 것이 아닙니다. 오히려 한 지혜가 참으로 보이지 않는 분의 형상을 보존하려고 그를 감추기 때문에 보이지 않습니다. 그러므로 많은 천사가 그를 보기에 이르지 못했습니다.


    앞서 말한 히브리 민족의 사람들, 곧 의인들과 예언자들은 상상이나 허상이나 난해한 생각에서 나온 것을 생각하거나 말하지 않았습니다. 오히려 각 사람은 자기 안에서 작용하는 권세로 자신이 보고 들은 것에 주의를 기울여 정확하게 말했습니다. 그들은 자기 안에서 작용하는 그 권세들처럼 서로 조화를 이루고 뜻을 같이했습니다. 그들이 자기들의 <하나 됨>과 상호 조화를 지켰기 때문입니다. 무엇보다도 그들은 자신들보다 더 높고 더 위대한 이를 찬양했습니다. 그들은 그가 필요했기 때문에, 그는 존재하게 되었고 세움을 받았습니다.[c]


    영적인 말씀은 그들 가운데서 이 일을 이루었습니다. 이는 높으신 분을 필요로 하는 이에게 일어나는 것과 같았습니다. 곧 구원의 씨인 생각을 따라 품는 소망과 기대, 기억이 되는 빛을 비추는 말씀, 그리고 그 말씀의 자손들과 유출들로 말미암은 일이었습니다. 그 자손들과 유출들은 앞서 말한 의인들과 예언자들입니다. 그들은 자기 조상들이 드린 찬양과 위대한 것에 관한 증언을 간직합니다. 이들은 [] 소망에 찬 기대와 주의 깊은 기다림 가운데 생겨났으며, 그들 안에는 기도와 탐구의 <씨>가 뿌려졌습니다. 이 씨는 굳세어지기를 구한 많은 사람 안에도 뿌려집니다. 그것은 스스로 드러나 그들을 움직여 높으신 분을 사랑하게 하고, 이 모든 것이 오직 한 분께 속한다고 선포하게 합니다.


    그들이 말할 때에는 하나의 독특한 것이 그들 안에서 작용했습니다. 그러나 그들의 환상과 말은 다양했습니다. 그들에게 환상과 말을 전해 준 자들이 다양했기 때문입니다. 그러므로 그들이 한 말에 귀 기울인 사람들은 그 가운데 어느 것도 거부하지 않고, 성경을 여러 가지로 해석하며 받아들였습니다. 이로 말미암아 유대인들 가운데 오늘날까지 존재하는 여러 집단이 생겨났습니다. 어떤 이들은 옛 성경에서 말씀하신 하나님은 한 분이라고 말합니다. 다른 이들은 그분이 여럿이라고 말합니다. 또 어떤 이들은 하나님이 단순하시며 본질상 하나의 정신이라고 말합니다. 어떤 이들은 그분의 행위가 선과 악의 기원과 관련되어 있다고 말합니다. 또 어떤 이들은 그분 자신이 생겨난 것들을 창조하신 분이라고 말하는 한편, 다른 이들은 그분이 [] 천사들을 통하여 창조하셨다고 말합니다. 이와 같은 사상들의 다양성은 성경이 지닌 형식의 다양성과 유형의 풍성함을 반영하며, 성경은 그들의 율법 교사<들>을 낳았습니다.'
  philosophy: optimal-equivalence
