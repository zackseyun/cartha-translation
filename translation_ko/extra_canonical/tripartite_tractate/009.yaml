base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: ko
  text: '아이온들의 전체 체계에는 아버지를 완전하고 온전히 발견하려는 사랑과 갈망이 있으며, 이것이 그들의 구속받지 않는 하나 됨입니다. 아버지께서는 영원히 자신을 드러내시지만, 그들이 저절로 자신을 알게 되는 것은 바라지 않으셨습니다. 오히려 찾는 과정을 통해 자신을 붙들도록 허락하시면서, 헤아릴 수 없는 자신의 근원적 본질은 자신에게 남겨 두십니다. 아버지께서는 아이온들에게 근본적인 열망들을 주셨습니다. 그것들은 아버지께 이르는 길에 놓인 자리들이며, 행실을 훈련하는 학교와도 같기 때문입니다. 아버지께서는 그들에게 다음과 같은 것들을 주셨습니다.


    그분을 향한 믿음과 보이지 않는 분께 드리는 기도,

    붙들 수 없는 분을 향한 굳센 소망,

    보이지 않는 것을 바라보는 열매 맺는 사랑,

    영원한 정신에 대한 합당한 깨달음,

    풍요와 자유의 복,

    그리고 <그분의> 생각으로 말미암아 아버지를 영화롭게 하기를 갈망하는 깨달음입니다.


    [a] 높으신 아버지께서는 자신의 뜻에 따라, 모든 총체 안에서 숨 쉬는 영을 통하여 알려지십니다. 그 영은 그들에게 알려지지 않은 분을 찾으려는 생각까지도 불어넣습니다. 이는 향기로운 냄새가 사람으로 하여금 그 냄새의 근원을 찾게 하는 것과 같습니다. 아버지의 향기는 자연의 향기들보다 뛰어나기 때문입니다. 그분의 감미로움은 아이온들에게 말로 다 할 수 없는 기쁨을 주며, 그들 안에 그분과 하나로 어우러지려는 생각을 일으킵니다. 그분은 그들이 하나 된 방식으로 자신을 알기를 바라시며, 그들 안에 심긴 영 안에서 서로 돕기를 바라십니다. 큰 무게가 그들을 짓누르지만, 그들은 이루 말할 수 없는 방식으로 새로워집니다. 그들은 자신들이 헤아릴 수 없는 방식으로 놓여 있는 그곳에서 분리될 수 없기 때문입니다. 그들은 말하지 않고, 아버지의 영광과 말할 수 있는 분에 관하여 침묵할 것입니다. 그러나 그들은 그분에게서 형상을 얻게 될 것입니다.


    말로는 그분을 묘사할 수 없지만, 그분은 [자신을] 드러내셨습니다.[b] 그들은 생각 속에 감추어진 <그분을> 지니고 있습니다.[c] 그러므로 아이온들은 아버지께서 자신의 형상과 본질과 위대함 안에서 어떻게 존재하시는지에 관하여 침묵합니다. [d] 그러나 아이온들은 그분의 영을 통하여, 그분께서는 이름 붙일 수도 이해할 수도 없는 분임을 알 자격을 얻습니다. 그분은 자신의 영, 곧 자신을 찾게 하는 흔적을 통하여, 그들이 자신을 붙들고 자신에 관하여 말할 능력을 주십니다. 각 아이온은 하나의 이름, <곧> 아버지의 한 속성이자 능력입니다.[e] 아버지께서는 여러 이름 안에 존재하시며, 그 이름들은 서로 어우러져 조화를 이룹니다. 풍성한 말이 있으므로 그분에 관하여 말할 수 있습니다. 이와 같이 아버지께서는 하나이시기에 하나의 이름이면서도, 헤아릴 수 없이 많은 속성과 이름을 지니십니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점의 전승 본문에는 판독하거나 복원할 수 없는 공백이 있습니다.
    reason: 제공된 증언의 빈 대괄호 표지를 본문과 각주에 보존했습니다.
  - marker: b
    text: ‘자신을’은 결손된 본문을 문맥에 따라 보충한 말입니다.
    reason: 제공된 증언의 대괄호 복원 표지를 설명합니다.
  - marker: c
    text: ‘그분을’은 번역자가 문맥상 보충한 말입니다.
    reason: 제공된 증언의 꺾쇠괄호 보충 표지를 설명합니다.
  - marker: d
    text: 이 지점의 전승 본문에도 판독하거나 복원할 수 없는 공백이 있습니다.
    reason: 두 번째 빈 대괄호 표지를 보존했습니다.
  - marker: e
    text: ‘곧’은 문장의 뜻을 분명히 하려고 보충한 말입니다.
    reason: 제공된 증언의 꺾쇠괄호 보충 표지를 설명합니다.
lexical_decisions:
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌의 고유한 우주론적 존재·영역 개념을 일반어인 ‘시대들’로 환원하지 않고 음역하여 보존했습니다.
- source_word: the Totalities
  choice: 모든 총체
  rationale: 발렌티누스계 문헌의 기술적 표현일 가능성을 살리면서도 한국어 독자가 구성 의미를 파악할 수 있게 옮겼습니다.
- source_word: grasped / grasp
  choice: 붙들다
  rationale: 지적 이해와 도달·포착의 중의성을 완전히 ‘이해하다’로 평준화하지 않도록 했습니다.
- source_word: primal essence
  choice: 근원적 본질
  rationale: 시간적으로 최초라는 뜻만이 아니라 근원성과 본질성을 함께 드러냅니다.
- source_word: mind
  choice: 정신
  rationale: ‘마음’보다 형이상학적·지성적 의미를 보존하되 특정 철학 체계로 과도하게 규정하지 않았습니다.
- source_word: Spirit / spirit
  choice: 영
  rationale: 본문의 대문자 구별은 콥트어 원문 자체의 문법적 표지가 아닐 수 있으므로 한국어에서는 동일한 ‘영’으로 옮기고 문맥적 긴장을 유지했습니다.
- source_word: form
  choice: 형상
  rationale: 외형만을 뜻하는 ‘모양’보다 존재론적 함의를 열어 두는 표현입니다.
- source_word: subsists
  choice: 존재하다
  rationale: 난해한 형이상학적 문장을 자연스럽게 하면서 존재 방식에 관한 진술임을 보존했습니다.
theological_decisions:
- issue: 아버지의 자기 계시와 불가지성의 긴장
  choice: ‘자신을 드러내시지만’과 ‘근원적 본질은 자신에게 남겨 두십니다’를 함께 보존
  alternative: 계시를 부분 계시로 명시하거나 완전한 불가지론으로 정리
  rationale: 본문이 제시하는 계시 가능성과 본질의 탐구 불가능성 사이의 긴장을 해소하지 않았습니다.
- issue: 탐구를 통한 인식
  choice: ‘찾는 과정을 통해 자신을 붙들도록’
  alternative: 노력으로 하나님을 완전히 알 수 있다고 번역
  rationale: 탐구가 허용되지만 근원적 본질은 여전히 헤아릴 수 없다는 본문의 제한을 유지했습니다.
- issue: 아이온과 아버지의 관계
  choice: 각 아이온을 아버지의 ‘한 속성이자 능력’으로 표현
  alternative: 아이온을 독립된 신들이나 단순한 추상 개념으로 단정
  rationale: 본문의 동일성과 구별의 긴장을 특정 교리로 고정하지 않았습니다.
- issue: ‘하나로 어우러짐’의 의미
  choice: 관계적·통일적 표현으로 유지
  alternative: 본질적 합일 또는 단순한 공동체적 연합으로 확정
  rationale: 원문 증거 검토가 보류된 상태이므로 존재론적 의미를 과도하게 결정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 반복되는 ‘아버지’와 인식·탐구 어휘는 문헌의 신학적 논증을 살리기 위해 가능한 한 유지했습니다. 다만 콥트어 직접 대조가 아직 이루어지지 않았으므로, 이 초안은 제공된 공공영역 영어 증언에 근거한 잠정 번역이며 원문 검토 뒤 기술어와 난해 구문의 재검토가 필요합니다.
