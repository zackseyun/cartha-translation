base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/015.yaml
  text: 'And <he> invisibly sowed in him a word that was intended to become knowledge, and he gave him power to move away and to cast away from himself those who disobey him. In this way, he revealed himself to him. But to those who came into being for his sake, he revealed a form beyond their grasp. They therefore behaved with hostility toward one another. <He> suddenly revealed himself to them, drawing near in the form of lightning and departing like a flash of lightning. When finishing their mutual entanglement, he ended it [] through the sudden revelation, for which they were unprepared, were not expecting, and did not know.


    This frightened them, and they fell down because they could not endure the appearance of the light that had struck them. The one who appeared devastated the two orders. Just as the beings of memory <have been> called the Little One, so they have only a dim idea of the Exalted One who exists before them, and they have sown within themselves a feeling of astonishment at the Exalted One who is to be manifested. Therefore, they received his revelation and prostrated themselves before him. They became witnesses who were persuaded of <him>, acknowledging that the light which had appeared was stronger than those who resisted them.


    But those of the likeness became terribly afraid because they could not bear to hear about him in the beginning, that a vision of this kind could exist. Consequently, they plunged into the pit of ignorance called “the Outer Darkness,” “Chaos,” “Death,” and “the Abyss.” He placed them below the order of the beings of memory, given that it was evidently stronger than they were. They were considered worthy to rule over the indescribable darkness because they own it, and it is the lot assigned to them. He granted that they too would be of use in the plan of salvation that was to unfold, [] even that of which <they> were unaware.


    There is a [great] difference between the revelation for the one who came into being, the revelation for the one who was deficient, and the revelation for those who came into being because of him. He revealed himself to him within him because he is with him, sharing in his suffering, gradually giving him repose, causing him to grow, lifting him up, and giving himself to him to enjoy in a vision. But to those who fell outside, he revealed himself suddenly and in a flash. Then he quickly withdrew himself, not allowing them to gaze on him.'
translation:
  language: ko
  text: '그리고 <그는> 지식이 되도록 정해진 말씀을 그 안에 보이지 않게 심고, 그에게서 떠나 그에게 불순종하는 자들을 자기에게서 떨쳐 버릴 능력을 주셨습니다. 이렇게 그는 자신을 그에게 드러내셨습니다. 그러나 그로 말미암아 생겨난 자들에게는 그들이 파악할 수 없는 형상을 드러내셨습니다. 그러자 그들은 서로 적대하여 행동했습니다. <그는> 갑자기 그들에게 자신을 드러내어 번개의 형상으로 가까이 다가왔다가 번개처럼 떠나셨습니다. 그들이 서로 얽힌 일을 마치게 하실 때, 그들이 준비하지도, 예상하지도, 알지도 못했던 갑작스러운 계시로 그것을 끝내셨습니다.[a]


    이 일로 그들은 두려워 쓰러졌습니다. 그들을 내리친 빛의 나타남을 견딜 수 없었기 때문입니다. 나타나신 분은 두 질서를 무너뜨리셨습니다. 기억에 속한 존재들이 <‘작은 자’라고> 불린 것처럼, 그들도 자기들보다 먼저 계신 높으신 분을 어렴풋이 알 뿐이며, 장차 나타나실 높으신 분을 경이롭게 여기는 마음을 자기들 안에 심었습니다. 그러므로 그들은 그의 계시를 받아들이고 그 앞에 엎드렸습니다. 그들은 <그분을> 확신하는 증인들이 되었고, 나타난 빛이 자기들에게 맞서던 자들보다 더 강하다는 것을 인정했습니다.


    그러나 닮음에 속한 자들은 몹시 두려워했습니다. 처음에 그분에 관해, 곧 이런 종류의 환상이 존재할 수 있다는 말을 듣는 것조차 견디지 못했기 때문입니다. 그리하여 그들은 ‘바깥 어둠’, ‘혼돈’, ‘죽음’, ‘심연’이라 불리는 무지의 구덩이로 뛰어들었습니다. 그는 그들을 기억에 속한 존재들의 질서보다 아래에 두셨습니다. 그 질서가 그들보다 분명히 더 강했기 때문입니다. 그들은 형언할 수 없는 어둠을 다스리기에 합당하다고 여겨졌습니다. 그 어둠은 그들의 소유이며 그들에게 배정된 몫이기 때문입니다. 그는 장차 펼쳐질 구원의 계획에서 그들도 쓸모가 있게 하셨습니다. 곧 <그들> 자신도 알지 못했던 일에 쓰이게 하셨습니다.[b]


    생겨난 자를 위한 계시와 결핍된 자를 위한 계시와 그로 말미암아 생겨난 자들을 위한 계시 사이에는 [큰] 차이가 있습니다.[c] 그는 그 사람 안에서 자신을 그에게 드러내셨습니다. 이는 그와 함께 계시며 그의 고난에 동참하고, 조금씩 그에게 안식을 베풀며, 그를 자라게 하고 들어 올리며, 환상 가운데 자신을 누리도록 자신을 그에게 주시기 때문입니다. 그러나 밖으로 떨어져 나간 자들에게는 갑자기, 번쩍이는 순간에 자신을 드러내셨습니다. 그런 다음 곧 자신을 거두어 그들이 자신을 바라보지 못하게 하셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 전승 본문의 결손 또는 불확실한 대목을 포함합니다. ‘그것’이 정확히 무엇을 가리키는지도 분명하지 않습니다.
    reason: 원문 증거에 빈 대괄호로 표시된 결손과 지시 대상의 모호성을 독자에게 알리기 위함입니다.
  - marker: b
    text: 이 대목에도 전승 본문의 결손이 있으며, <그들>은 보충된 말입니다.
    reason: 제공된 증거의 결손 표시와 편집상 복원을 보존하기 위함입니다.
  - marker: c
    text: '[큰]은 손상되거나 불확실한 본문을 문맥에 따라 보충한 말입니다.'
    reason: 대괄호가 나타내는 복원 상태를 설명하기 위함입니다.
lexical_decisions:
- source_word: word
  choice: 말씀
  rationale: 지식이 되도록 심긴 계시적 내용을 가리키는 문맥을 살리되, 인격적 로고스라는 해석을 본문에서 단정하지 않았습니다.
- source_word: beings of memory
  choice: 기억에 속한 존재들
  rationale: 문헌 내부의 집단 명칭일 가능성을 보존하면서도 한국어에서 이해 가능한 관계 표현으로 옮겼습니다.
- source_word: those of the likeness
  choice: 닮음에 속한 자들
  rationale: ‘likeness’가 특정 우주론적 질서나 성질을 가리킬 수 있으므로 ‘형상에 속한 자들’로 해석을 좁히지 않았습니다.
- source_word: orders
  choice: 질서
  rationale: 존재들의 배열·등급·집단을 모두 포괄할 수 있도록 중립적인 용어를 택했습니다.
- source_word: repose
  choice: 안식
  rationale: 단순한 휴식보다 구원론적 평온을 함축할 수 있으나, 그 의미를 과도하게 풀어 쓰지 않았습니다.
- source_word: vision
  choice: 환상
  rationale: 시각적 계시 체험의 성격을 보존했으며, 객관적 실재 여부를 번역으로 판정하지 않았습니다.
- source_word: plan of salvation
  choice: 구원의 계획
  rationale: 제공된 증거의 구원론적 표현을 직접 보존하되 특정 교파의 구원 체계를 덧붙이지 않았습니다.
theological_decisions:
- issue: 대명사 ‘그’와 여러 집단의 지시 대상
  choice: 원문의 대명사 반복과 불분명성을 대체로 유지했습니다.
  alternative: 각 지시 대상을 ‘아들’, ‘결핍된 자’ 등의 명사로 명시할 수 있습니다.
  rationale: 이 발췌문만으로는 모든 지시 대상을 확정하기 어려워 신학적 동일시를 번역에 삽입하지 않았습니다.
- issue: ‘말씀’의 정체
  choice: ‘말씀’으로 옮기되 인격적 존재라고 명시하지 않았습니다.
  alternative: ‘말’ 또는 ‘로고스’로 옮길 수 있습니다.
  rationale: 계시적·신학적 울림은 살리면서도 요한 문헌의 로고스 교리를 자동으로 수입하지 않기 위함입니다.
- issue: 어둠을 다스리기에 ‘합당함’
  choice: 가치 판단의 역설을 그대로 보존했습니다.
  alternative: ‘맡게 되었다’로 완화할 수 있습니다.
  rationale: 심판인지 기능적 배정인지 모호한 긴장을 해소하지 않았습니다.
- issue: 고난에 동참하는 주체
  choice: ‘그와 함께 계시며 그의 고난에 동참하고’로 번역했습니다.
  alternative: ‘그 안에 함께 있으며 함께 고난받고’로 옮길 수 있습니다.
  rationale: 내재와 동고의 결합을 보존하되, 성육신이나 대속 교리로 구체화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문체는 고대 신학 논문의 장중함을 유지하되 지나치게 고어적이지 않게 다듬었습니다. 꺾쇠괄호와 대괄호는 제공된 증거의 복원·결손 신호를 보존했습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로 본 번역은 공개 영역 영어 증언에 근거한 잠정 원고입니다.
