  yaml_path: translation/extra_canonical/tripartite_tractate/016.yaml
  text: 'When the deficient Word became enlightened, his Fullness came into being. He escaped from those who had troubled him at first. He disentangled himself from them. He stripped off that prideful thought. When those who had at first disobeyed him prostrated and humbled themselves before him, he became mingled with the Repose.


    And <he> rejoiced because of the visitation of his visiting brothers. He glorified and praised those who had shown themselves to be a help to him. He gave thanks for escaping from those who had rebelled against him, and he esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good because they come from living things and resemble them in beauty, yet they are not equal to them in truth, because they do not come from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. Therefore, those produced from him are great, just as He Who Is is truly great.


    After he marveled at the beauty of those <who> had appeared to him, he declared his gratitude for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come into being through him, so that they could obtain something good. For he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Therefore, those whom he purposefully produced are on chariots, like those who came into being, those who appeared so that they could pass through every place of what is below, so that each of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory—a revelation of those from the decision of the aeons, which was a unity and a mercy—whereas they are only seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised [] while gazing at those whom he beseeched, so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and their hope in the promise, because they possess joy, a wealth of repose, and unsullied delights. Bestowing perfection with vision as the goal, he generated those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come into being would not perish by gazing upon the light, since they are unable to bear the great, lofty stature.'
translation:
  language: ko
  text: '결핍되어 있던 말씀이 빛을 받자, 그의 충만이 생겨났습니다. 그는 처음에 자신을 괴롭혔던 자들에게서 벗어났습니다. 그는 그들에게 얽힌 데서 풀려났고, 그 교만한 생각을 벗어 버렸습니다. 처음에 그에게 불순종했던 자들이 그 앞에 엎드려 자신을 낮추자, 그는 안식과 하나로 섞였습니다.


    그리고 그는[a] 자신을 찾아온 형제들의 방문으로 기뻐했습니다. 그는 자신에게 도움이 되었음이 드러난 이들을 영화롭게 하고 찬양했습니다. 자신에게 반역한 자들에게서 벗어난 것을 감사했으며, 위대함과 자신에게 모습을 드러내기로 한 이들을 귀하게 여기고 존중했습니다. 그는 살아 있는 형상들의 살아 있는 모상들을 낳았습니다. 그 모상들은 살아 있는 것들에서 비롯되어 아름다움에서 그것들을 닮았으므로 기쁘고 선합니다. 그러나 참됨에서는 그것들과 동등하지 않습니다. 그것들은 자신들을 낳은 이와 그에게 자신을 드러낸 이가 하나로 결합한 데서 나온 것이 아니기 때문입니다 […].[b] 그렇지만 그는 지혜와 지식으로 일하며, 말씀을 자신과 완전히 섞습니다. 그러므로 그에게서 생겨난 이들은 위대합니다. 참으로 ‘존재하는 이’께서 위대하신 것과 같습니다.


    그는 자신에게 나타난 이들의 아름다움에 놀란 뒤, 이 방문에 감사를 표했습니다. 말씀은 자신을 도운 이들의 도움을 받아 이 일을 이루었습니다. 이는 그를 통하여 생겨난 이들이 굳건해져서 좋은 것을 얻게 하려는 것이었습니다. 그가 자신이 낳은 모든 이를 위한 구원의 계획, 곧 그들을 굳게 세우려고 확정된 그 계획을 두고 기도해야 함을 기억했기 때문입니다.


    그러므로 그가 뜻을 두고 낳은 이들은, 생겨난 이들 곧 나타난 이들과 마찬가지로 병거들을 타고 있습니다. 이는 그들이 아래에 있는 모든 곳을 지나가며, 저마다 자기 본성에 알맞은 자리를 받게 하려는 것입니다.


    이것은 닮음에 속한 이들에게는 파멸을 가져오지만, 기억에 속한 이들에게는 유익합니다. 곧 아이온들의 결정에서 비롯된 이들이 드러나는 일입니다. 그 결정은 하나 됨과 자비였지만, 이들은 아직 온전한 존재에 이르지 못한 씨앗들일 뿐입니다.[c]


    나타난 이는 아버지와 조화의 얼굴이었습니다. 그는 모든 은혜를 두른 옷이었고, 말씀이 기도하고 영화롭게 하며 찬양하는 가운데 낳은 이들에게 주는 양식이었습니다. 말씀은 자신이 간청한 이들을 바라보면서 바로 이분을 영화롭게 하고 찬양했습니다 […].[d] 이는 자신이 낳은 모상들로 그들을 완전하게 하려는 것이었습니다.


    말씀은 그들이 서로 돕는 일과 약속에 두는 희망을 자라게 했습니다. 그들에게는 기쁨과 풍성한 안식과 더럽혀지지 않은 즐거움이 있기 때문입니다. 그는 보는 것을 목표로 완전함을 베풀면서, 처음에 기억했던 이들, 곧 아직 자신과 함께 있지 않았던 이들을 낳았습니다. 말씀은 모든 전체와 마찬가지로 완전하신 아버지를 향한 희망과 믿음 안에 머뭅니다. 그것은 말씀이 그것과 섞이기 전에 그에게 드러납니다. 이는 생겨난 이들이 그 빛을 바라보다가 멸망하지 않게 하려는 것입니다. 그들은 그 크고 드높은 위상을 감당할 수 없기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 증거 본문의 이 주어는 편집자가 문맥에 따라 보충한 말입니다.
    reason: 영문 증거 본문의 꺾쇠괄호로 표시된 편집상 보충을 독자에게 알립니다.
  - marker: b
    text: 이 지점에는 사본의 손상 또는 판독 불능으로 생긴 공백이 있습니다.
    reason: 첫 번째 대괄호 공백 신호를 보존합니다.
  - marker: c
    text: ‘닮음에 속한 이들’, ‘기억에 속한 이들’, ‘아이온들의 결정에서 비롯된 이들’의 정확한 관계와 문장 구조는 불확실합니다.
    reason: 증거 본문의 실제적인 통사·개념적 모호성을 숨기지 않습니다.
  - marker: d
    text: 이 지점에는 사본의 손상 또는 판독 불능으로 생긴 공백이 있습니다.
    reason: 두 번째 대괄호 공백 신호를 보존합니다.
lexical_decisions:
- source_word: Word
  choice: 말씀
  rationale: 문맥에서 인격적 주체인 로고스를 가리키므로 한국어 성서 전통에서 익숙한 ‘말씀’을 쓰되, 인격적 동작을 그대로 보존했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 발렌티누스계 문헌의 전문적 함의를 보존하면서도 일반 독자가 이해할 수 있는 직역어를 택했습니다.
- source_word: Repose
  choice: 안식
  rationale: 단순한 휴식보다 존재론적 상태를 나타내는 추상 명사로 읽히므로 ‘안식’으로 번역했습니다.
- source_word: aeons
  choice: 아이온들
  rationale: ‘시대들’로 풀면 이 문헌의 우주론적 존재라는 의미가 사라질 수 있어 음역했습니다.
- source_word: He Who Is
  choice: ‘존재하는 이’
  rationale: 신적 호칭의 성격과 원문의 존재론적 표현을 함께 살렸으며, 특정 정통 교리 용어로 과도하게 확정하지 않았습니다.
- source_word: Totalities
  choice: 모든 전체
  rationale: 복수의 총체를 가리키는 특이한 우주론적 표현을 평범한 ‘만물’로 평준화하지 않고 보존했습니다.
- source_word: likeness / memory
  choice: 닮음 / 기억
  rationale: 서로 대조되는 집단 명칭의 모호성을 해설적으로 해소하지 않고 명사적 표현으로 유지했습니다.
theological_decisions:
- issue: 말씀과 안식의 결합 방식
  choice: ‘하나로 섞였습니다’
  alternative: ‘연합했습니다’
  rationale: 원문의 mingling 이미지를 보존하고, 이를 특정한 교리적 연합 개념으로 바꾸지 않았습니다.
- issue: 살아 있는 모상들의 열등성
  choice: 아름다움에서는 닮지만 참됨에서는 동등하지 않다고 번역
  alternative: 불완전하거나 거짓된 존재라고 단정
  rationale: 본문이 제시하는 유사성과 비동등성의 긴장을 그대로 남기고 가치 판단을 덧붙이지 않았습니다.
- issue: ‘그것’의 지시 대상
  choice: 마지막 문단에서 대명사 ‘그것’을 유지
  alternative: 빛, 완전함, 아버지의 실재 등 특정 선행사로 확정
  rationale: 영어 증거 본문 자체의 지시 대상이 불분명하므로 번역에서 임의로 해소하지 않았습니다.
- issue: 아이온들의 결정에서 비롯된 이들에 관한 문장 구조
  choice: ‘드러나는 일’을 동격적 계시로 연결
  alternative: 파멸 또는 유익 자체를 계시와 동일시
  rationale: 문법적 관계가 난해하므로 가능한 연결을 제시하되, 집단들의 정체나 구원론적 지위를 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 우주론적 전문어는 가능한 한 일관되게 유지하되 문장을 현대 독자가 따라갈 수 있도록 나누었습니다. 이 초안은 제공된 공공 영역 영어 증거 본문에 근거한 잠정 번역이며, 콥트어 원문 직접 검토가 남아 있습니다.
