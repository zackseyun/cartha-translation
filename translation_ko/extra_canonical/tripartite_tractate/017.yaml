translation:
  language: ko
  text: '말씀이 다시 안정을 되찾고 자신을 통하여 생겨난 이들을 다스리게 되었을 때, 그 말씀의 생각은 그가 그 결정에 따라 낳은 모든 이를 위하여 “아이온”과 “처소”라고 불렸으며, 심지어 “구원의 회당”이라고도 불렸습니다. 이는 그가 수많은 생각으로 흩어진 상태에서 자신을 치유하여 하나의 생각으로 돌아왔기 때문입니다. 또한 그것은 그가 얻어 자신에게만 베푼 안식을 가리켜 “보물창고”라고도 불립니다. [a] 또한 그것은 결합에서 열매를 얻기를 바라며 자신을 그에게 내어 준 이, 곧 그에게 나타난 이의 기쁨 때문에 “신부”라고도 불립니다. 또한 그에게 맞서 싸운 자들을 다스리게 된 것을 기뻐하는 가운데 얻은 확고함 때문에 “나라”라고도 불립니다. 그리고 그가 자신을 입힌 기쁨 때문에 “주님의 기쁨”이라고도 불립니다.[b] 빛은 그와 함께 머물며, 그에게 속한 선한 것들, 곧 자유의 생각들에 대한 보답을 그에게 줍니다.[c]


    앞서 말한 그 아이온은 서로 싸우는 두 계층보다 높습니다. 그것은 지배권을 휘두르는 자들의 동료가 아니며, 기억과 닮음에 속하는 것들인 허약함과 약함에도 속하지 않습니다. 말씀이 자신을 두었던 곳은 온전히 기쁨에 찬 아이온이었습니다. 그것은 물질의 형상을 지녔으나 동시에 자기 원인의 본성도 지녔습니다. 그 원인이 바로 계시된 것이었기 때문입니다. 이는 그 아이온이 충만 안에 거하는 이들의 형상이었고, 그들은 ‘계시는 분’의 즐거움이 지닌 풍성함에서 생겨났기 때문입니다.


    더욱이 그는 자신을 드러낸 이의 얼굴을 보며, 그의 <즐거움>과 기대와 자신이 청한 것에 관한 약속 안에서 기뻐하였고, 아들의 이름과 그의 본질과 능력과 형상을 지니게 되었습니다.[d] 그는 말씀이 사랑하고 기뻐한 이였으며, [e] 사랑을 담아 기도를 올린 대상이었습니다. 이 아이온은 빛이었고, 굳건해지려는 열망이었으며, 배우려는 뜻이었고, 보는 눈이었습니다. 이러한 것들을 그 아이온은 높은 곳에 있는 이들에게서 받았습니다. 또한 그것은 구원의 경륜 안에서 더 낮은 곳에 자리한 자들과 맞서는 그의 생각에는 지혜였고, 말하기 위한 말이었으며, 이와 같은 다른 것들의 완성이었습니다.


    그리고 충만의 형상을 따라 그와 함께 형체를 갖춘 이들은, 자신을 드러낸 이들을 부모로 두고 있으며, 각자는 그 형상들 가운데 하나의 모사입니다. 그들은 남성성의 형상들로서 여성성인 허약함에서 비롯된 것이 아니라, 이미 그 허약함에서 벗어난 이에게서 비롯되었습니다.[f] <그들은> “교회”라는 이름을 지닙니다. 나타나게 된 이들의 모임이 이루는 조화와 그들이 조화롭게 닮았기 때문입니다. 빛의 형상을 따라 생겨난 것도 완전합니다. 그것은 유일하게 존재하는 빛, 곧 만유의 형상이기 때문입니다. 그것이 자신이 본뜬 대상보다 낮을지라도 여전히 그 대상과 분리될 수 없는 성질을 지닙니다. 그것은 분리될 수 없는 빛의 얼굴이기 때문입니다.


    그러나 각 아이온의 형상을 따라 생겨난 이들은 본질에서는 앞서 말한 그대로이지만, 작용에서는 서로 같지 않습니다. 그 작용이 각자 안에 서로 다르게 내재하기 때문입니다. 그들은 서로 하나 됨 안에서는 동등하지만, [g] 각 아이온은 자신에게 고유한 차이를 간직하였습니다. 그러므로 그들에게는 격정이 있습니다. 격정은 하나의 허약함입니다. 그들이 충만의 하나 됨에서 나온 것이 아니라, 하나가 아버지에게서 그것을 받기 전에, 또는 그의 만유와 뜻에 하나 되기 전에, 때 이르게 나왔기 때문입니다.[h]


    그런데도 이것은 장차 이루어질 구원의 경륜에 유익하였습니다. 그들은 낮은 처소들을 통과하도록 허락받았습니다. 그 처소들은 그들이 한 번에 하나씩 오지 않는 한, 갑자기 닥치는 그들의 도래를 받아들일 수 없기 때문입니다. 그들이 오는 것은 반드시 필요합니다. 모든 것이 그들을 통하여 완성될 것이기 때문입니다.


    요컨대 말씀은 모든 것, 곧 전에 있었던 것들과 지금 있는 것들과 앞으로 있을 것들에 대한 환상을 받았습니다. 존재하는 모든 것의 구원 경륜이 그에게 맡겨졌기 때문입니다. 어떤 것들은 그 배후에 목적이 있었으므로 이미 존재에 이르렀습니다. 이와 달리 말씀은 아직 존재하지 않는 씨앗들을 자신이 품은 것에 관한 약속, 곧 앞으로 생겨날 씨앗들에 대한 약속 때문에 자기 안에 보존하였습니다. 그리고 그는 자신의 자손, 곧 자신이 품은 것의 계시를 낳았습니다. 그러나 약속된 씨앗들은 한동안 존재하게 되는 것이 막혀 있었습니다. 구원자가 올 때, 그리고 그의 동료들, 곧 아버지에 대한 지식과 영광에서 으뜸인 이들이 올 때 수행할 사명을 위해 그들이 정해져 있었기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점에는 사본의 결락이 있습니다.
    reason: 제공된 증거의 빈 대괄호를 본문에 무의미하게 재현하는 대신 결락 사실을 알립니다.
  - marker: b
    text: 대괄호로 복원된 주어를 반영하면 직역은 “그가 자신을 입힌 기쁨”입니다.
    reason: 원문 증거의 편집자 복원과 문법적 불확실성을 표시합니다.
  - marker: c
    text: “생각들”은 편집자가 복수형으로 교정한 읽기입니다.
    reason: 원문의 angle-bracket 교정 표지를 독자에게 설명합니다.
  - marker: d
    text: 이 문장의 ‘그’와 ‘그의’가 각각 말씀, 계시자, 아들 가운데 누구를 가리키는지는 분명하지 않습니다.
    reason: 대명사 지시의 신학적으로 중요한 모호성을 보존합니다.
  - marker: e
    text: 이 지점에는 사본의 결락이 있습니다.
    reason: 제공된 증거의 결락 표지를 반영합니다.
  - marker: f
    text: 남성성·여성성은 이 문헌의 고대 우주론적 범주이며, 본문은 여성성을 ‘허약함’과 연결합니다.
    reason: 현대 독자가 번역자의 평가로 오해하지 않도록 역사적 개념임을 밝힙니다.
  - marker: g
    text: 이 지점에는 사본의 결락이 있습니다.
    reason: 제공된 증거의 결락 표지를 반영합니다.
  - marker: h
    text: “하나”가 누구인지, 그리고 “그것”이 무엇을 가리키는지는 분명하지 않습니다.
    reason: 난해한 통사와 지시 관계를 임의로 해결하지 않습니다.
lexical_decisions:
- source_word: Word
  choice: 말씀
  rationale: 문헌의 인격화된 로고스를 나타내는 익숙하고 품위 있는 용어이며, 단순한 발화와 구별하기 위해 일관되게 사용했습니다.
- source_word: Aeon
  choice: 아이온
  rationale: 시대, 영역, 신적 실재가 겹치는 전문 개념의 다의성을 보존하기 위해 음역했습니다.
- source_word: Place
  choice: 처소
  rationale: 단순한 물리적 장소보다 존재론적 영역을 암시하는 문맥에 맞추었습니다.
- source_word: Synagogue of Salvation
  choice: 구원의 회당
  rationale: 뒤의 Church와 어휘상 구별하면서 집회·회집의 뜻을 보존했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 이 문헌의 전문적 우주론 용어가 지닌 총체성과 완전성의 함의를 보존했습니다.
- source_word: plan of salvation
  choice: 구원의 경륜
  rationale: 단순 계획보다 구원이 전개되고 관리되는 질서를 나타내는 문맥에 맞추되 특정 교파적 해석은 피했습니다.
- source_word: energy
  choice: 작용
  rationale: 본질과 대비되는 실제 활동·발현의 뜻을 자연스러운 한국어로 전달했습니다.
- source_word: passions
  choice: 격정
  rationale: 감정 일반이 아니라 결핍과 수동적 동요를 가리키는 철학적 의미를 살렸습니다.
- source_word: Totalities
  choice: 만유
