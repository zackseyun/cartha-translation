  source_fidelity: 영어 증언을 기준으로 볼 때 전반적인 구조, 반복되는 전문어, 결락 및 편집자 보충 표지는 대체로 충실히 보존되었습니다. 그러나 “He Who Is”를 ‘계시는 분’으로 옮긴 것은 ‘존재하시는 분/있는 이’라는 존재론적 호칭을 ‘계시하다’로 바꾸는 의미 변화입니다. 또한 “the sole existent light, which is the Totalities”를 ‘유일하게 존재하는 빛, 곧 만유의 형상’으로 옮긴 것은 원문에 없는 ‘형상’을 첨가합니다. 이 두 곳은 수정이 필요합니다. 난해한 대명사와 ‘하나/그것’의 지시는 확정하지 않고 보존하였습니다.
