  revised_text: '말씀이 다시 안정을 되찾고 자신을 통하여 생겨난 이들을 다스리게 되었을 때, 그 말씀의 생각은 그가 그 결정에 따라 낳은 모든 이를 위하여 “아이온”과 “처소”라고 불렸으며, 심지어 “구원의 회당”이라고도 불렸습니다. 이는 그가 수많은 생각으로 흩어진 상태에서 자신을 치유하여 하나의 생각으로 돌아왔기 때문입니다. 또한 그것은 그가 얻어 자기 자신에게만 베푼 안식을 가리켜 “보물창고”라고도 불립니다.[a] 또한 그것은 결합에서 열매를 얻기를 바라며 자신을 그에게 내어 준 이, 곧 그에게 나타난 이의 기쁨 때문에 “신부”라고도 불립니다. 또한 그에게 맞서 싸운 자들을 다스리게 된 것을 기뻐하는 가운데 얻은 확고함 때문에 “나라”라고도 불립니다. 그리고 그가 자신을 입힌 기쁨 때문에 “주님의 기쁨”이라고도 불립니다.[b] 빛은 그와 함께 머물며, 그에게 속한 선한 것들, 곧 자유의 생각들에 대한 보답을 그에게 줍니다.[c]



    앞서 말한 그 아이온은 서로 싸우는 두 부류보다 높습니다. 그것은 지배권을 휘두르는 자들의 동료가 아니며, 기억과 닮음에 속하는 것들인 허약함과 약함에도 속하지 않습니다. 말씀이 자신을 둔 것은 온전히 기쁨에 찬 아이온이었습니다. 그것은 물질의 형상을 지녔으나, 동시에 그 원인의 본성도 지녔습니다. 그 원인은 계시된 바로 그것이었습니다. 이는 그 아이온이 충만 안에 거하는 이들의 형상이었고, 그들이 존재하시는 분의 즐거움이 지닌 풍성함에서 생겨났기 때문입니다.



    더욱이 그는 자신을 드러낸 이의 얼굴을 보며, 그의 <즐거움>과 기대와 자신이 청한 것에 관한 약속 안에서 기뻐하였고, 아들의 이름과 그의 본질과 능력과 형상을 지니게 되었습니다.[d] 그는 말씀이 사랑하고 기뻐한 이였으며,[e] 사랑을 담아 기도를 올린 대상이었습니다. 이 아이온은 빛이었고, 굳건해지려는 열망이었으며, 배우려는 뜻이었고, 보는 눈이었습니다. 이러한 것들은 그 아이온이 높은 이들에게서 지닌 것이었습니다. 또한 그것은 구원의 경륜 안에서 더 낮은 곳에 자리한 자들과 맞서는 그의 생각에는 지혜였고, 말하기 위한 말이었으며, 이와 같은 다른 것들의 완성이었습니다.



    그리고 충만의 형상을 따라 그와 함께 형체를 갖춘 이들은, 자신을 드러낸 이들을 부모로 두고 있으며, 각자는 그 형상들 가운데 하나의 모사입니다. 그들은 남성성의 형상들로서 여성성인 허약함에서 비롯된 것이 아니라, 이미 그 허약함에서 벗어난 이에게서 비롯되었습니다.[f] <그들은> “교회”라는 이름을 지닙니다. 나타나게 된 이들의 모임이 이루는 조화와 그들이 조화롭게 닮았기 때문입니다. 빛의 형상을 따라 생겨난 것도 완전합니다. 그것은 유일하게 존재하는 빛, 곧 만유의 형상이기 때문입니다. 그것이 자신이 본뜬 대상보다 낮을지라도, 여전히 분리될 수 없음을 지닙니다. 그것은 분리될 수 없는 빛의 얼굴이기 때문입니다.



    그러나 각 아이온의 형상을 따라 생겨난 이들은 본질에서는 앞서 말한 그대로이지만, 작용에서는 서로 같지 않습니다. 그 작용이 각자 안에 서로 다르게 내재하기 때문입니다. 그들은 서로 하나 됨 안에서는 동등하지만,[g] 각 아이온은 자신에게 고유한 차이를 간직하였습니다. 그러므로 그들에게는 격정이 있습니다. 격정은 하나의 허약함입니다. 그들이 충만의 하나 됨에서 나온 것이 아니라, 하나에게서 너무 일찍 생겨났기 때문입니다. 그 하나가 아버지에게서 그것을 받기 전, 또는 그의 만유와 뜻에 하나 되기 전이었습니다.[h]



    그런데도 이것은 장차 이루어질 구원의 경륜에 유익하였습니다. 그들은 낮은 처소들을 통과하도록 허락받았습니다. 그 처소들은 그들이 한 번에 하나씩 오지 않는 한, 갑자기 닥치는 그들의 도래를 받아들일 수 없기 때문입니다. 그들이 오는 것은 반드시 필요합니다. 모든 것이 그들을 통하여 완성될 것이기 때문입니다.



    요컨대 말씀은 모든 것, 곧 전에 있었던 것들과 지금 있는 것들과 앞으로 있을 것들에 대한 환시를 받았습니다. 존재하는 모든 것의 구원 경륜이 그에게 맡겨졌기 때문입니다. 어떤 것들은 그 배후에 목적이 있었으므로 이미 존재에 이르렀습니다. 이와 달리 말씀은 아직 존재하지 않는 씨앗들을, 자신이 품은 것에 관한 약속, 곧 앞으로 생겨날 씨앗들에 대한 약속 때문에 자기 안에 보존하였습니다. 그리고 그는 자신의 자손, 곧 자신이 품은 것의 계시를 낳았습니다. 그러나 약속된 씨앗들은 한동안 존재하게 되는 것이 막혀 있었습니다. 구원자가 오고 그의 동료들, 곧 아버지에 대한 지식과 영광에서 으뜸인 이들이 올 때 수행할 사명을 위해 그들이 정해져 있었기 때문입니다.'
