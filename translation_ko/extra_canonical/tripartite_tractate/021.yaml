translation:
  language: ko
  text: '**삼부 논고 — 인류와 죽음의 기원**[a]


    형태가 유동적인 물질은 세력들을 통하여 만연한 눈멂의 원인입니다. […] 그들 안에서 그 모든 것이 […] 그들이 함께 낳고 [소멸하는] 동안에 그러합니다. [오른편에] 속한 자들과 왼편에 속한 자들 사이에 놓인 생각은 [모방]의 힘입니다. 최초의 존재들이 만들고자 하는 모든 것은 마치 몸을 따라가는 그림자의 투영과 같으며, 이것이 <눈에 보이는 피조물들의> 뿌리를 이룹니다.[b]


    형상들과 표상들과 닮은꼴들을 질서 있게 마련하는 모든 준비가 생겨난 것은, 거울을 통하여 교육과 가르침과 형성을 받아야 하는 이들을 위해서였습니다. 작은 것이 한 걸음씩 자라게 하려는 것이었습니다. 이런 까닭에 그는 인류를 마지막으로 창조했으며, 먼저 그들을 위하여 창조한 것들을 마련하여 그들에게 제공했습니다.


    인류의 창조도 다른 모든 것의 창조와 같은 방식으로 이루어졌습니다. 영적인 말씀은 보이지 않게 그들을 움직였고, 데미우르고스와 [] 그의 천사 종들을 통하여 그들을 완성했습니다. 자만과 그 지배자들도 그들과 함께 형성하는 일에 참여했습니다. 인간들은 땅의 그림자와 닮았으므로, 총체들에서 끊어진 [자들]과 같이 되었습니다. 그들은 오른편에 속한 자들과 왼편에 속한 자들 모두가 만든 피조물입니다. 각 계층은 (총체) 자체가 형성되었던 것과 [같이 인간에게] 형태를 부여했습니다.


    말씀이 만들어 낸 [형태]는 부족했으며, 연약함이라는 [고통]과 같았습니다. 말씀이 그것을 [망각]과 무지와 [결핍]과 그 밖의 온갖 연약함으로 이끌었기 때문입니다. 말씀은 데미우르고스를 통하여 첫 형태만 부여했는데, 무지 가운데 <그에게 준 것>이었습니다. 이는 그가 높이 있는 무엇인가가 존재하며 자신에게 [그것]이 필요하다는 사실을 깨닫게 하려는 것이었습니다. 이것이 예언자가 “살아 있는 영”, “높이 있는 아이온들의 숨결”, “보이지 않는 것”이라고 부른 것입니다. 이것은 처음에 생명이 없던 몸에 생명을 준 살아 있는 혼입니다. 생명이 없음은 곧 무지입니다.


    그러므로 첫 인간의 혼은 영적인 말씀에서 비롯되었지만, 창조자는 자신이 그것을 만들었다고 생각했다고 보아야 마땅합니다. 불어 넣어진 것은 그를 입처럼 거쳐 갔습니다.


    창조자는 자신의 실체에서 혼들도 아래로 보냈습니다. [그] 역시 생식의 능력을 지니고 있었기 때문이며, [] 아버지의 표상에서 산출된 <존재였기> 때문입니다. 왼편에 속한 자들도 자기들에게 속한 어떤 부류의 인간을 만들어 냈습니다. 그들 역시 <존재의> 닮은꼴을 지니고 있기 때문입니다.


    영적인 실체는 하나로 통일된 것이며 하나의 표상입니다. [그러나] 그 연약함은 [여러] 형태를 띠는 상태입니다. 혼적인 자들의 실체는 이중적인 상태에 있습니다. 그것은 지식을 지니고 높이 계신 분을 찬양하지만, 자만의 성향 때문에 악으로 <기울기도> 합니다. 물질적인 자들의 실체는 그 양상이 서로 다르고 여러 형태로까지 나타납니다. 그것은 여러 종류의 성향 가운데 만연한 연약함이었습니다.


    그러므로 첫 인간은 여러 가지로 형성되고 여러 가지로 창조된 존재이며, 왼편에 속한 자들과 오른편에 속한 자들을 담는 곳입니다. 또한 그는 자신이 비롯된 두 실체 사이에서 그 지향이 나뉘어 있는 영적인 말씀입니다.


    이 때문에 그를 위하여 낙원이 심어졌다고 합니다. 그가 세 종류 나무의 열매를 먹을 수 있게 하려는 것이었습니다. 그곳은 세 계층의 동산이며 즐거움을 주는 곳이기 때문입니다. 그 안에 있던 고귀하고 선택된 실체는 <그> 피조 세계보다 더 높았고, 그것은 그들에게 해가 되었습니다. 그래서 그들은 명령을 내리며 중대한 위험, [] 곧 죽음이 그에게 닥칠 것이라고 위협했습니다. 그에게는 악한 나무들의 열매만 맛보고 누리는 것이 허락되었습니다. 다른 나무, 곧 이중성의 나무에서는 [그가] 먹도록 허락하지 않았고, 생명나무에서는 더더욱 허락하지 않았습니다. 이는 그가 그들과 [동등한] 영예를 얻지 못하게 하고, [그가 …] 그들을 막기 위해서였습니다.


    “뱀”이라 불리는 악한 세력, 곧 모든 악한 세력보다도 더 영리한 그 세력을 통하여 인간은 기억과 욕망에 속한 자들의 계획에 따라 <미혹되었습니다>. 그 세력은 인간이 계명에 불순종하게 하여 죽게 했습니다. 그리하여 인간은 그곳과 그곳의 모든 즐거움에서 쫓겨났습니다.


    이것이 그들이 인간을 벌한 추방입니다. 인간은 닮은꼴에 속한 자들과 표상에 속한 자들의 즐거움에서 쫓겨났습니다. 그러나 이것은 (실제로는) 섭리의 행위였습니다. 영원한 안식처와 달리 즐거움은 잠시만 지속된다는 사실을 인간들이 깨닫게 하려는 것이었습니다. 영은 이 일을 미리 정했습니다. 곧 인간이 큰 악인 죽음, 다시 말해 총체에 대한 철저한 무지를 겪고, 거기에서 비롯되는 모든 악도 맛보게 하려는 계획을 미리 세웠습니다. 그리고 격정과 불안과 거기에서 비롯되는 것들을 겪은 뒤에는 가장 큰 [] 선, 곧 영원한 생명을 얻게 하려는 것이었습니다. 영원한 생명은 총체들을 철저히 아는 것이며 모든 좋은 것을 얻는 것입니다.


    첫 인간의 불순종 때문에 죽음이 왕 노릇 했습니다. 죽음은 [지배권]을 쥐고 세력을 떨치는 동안 모든 인간을 죽이곤 했습니다. 죽음이 그 왕권을 받은 것은 앞서 말한 구원의 계획에 따른 것이며, 아버지의 뜻으로 말미암은 것이었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 나그함마디 문서 I,5의 콥트어 본문에 대한 직접 대조가 아직 필요합니다.
    reason: 직접적인 원어 검토가 보류된 자료 상태를 독자에게 투명하게 알립니다.
  - marker: b
    text: 대괄호와 대괄호 속 생략 부호는 사본의 결락 또는 복원된 글자를, 빈 대괄호는 복원되지 않은 결락을 나타냅니다. 꺾쇠괄호는 번역 증언의 편집자가 보충한 말을, 소괄호는 설명적 보충을 나타냅니다.
    reason: 본문의 손상과 편집상 보충을 번역자의 확정적 본문으로 오해하지 않도록 원 증언의 기호를 설명합니다.
lexical_decisions:
