  revised_text: '만유의 아버지께 속한 아이온들이 겪은 타락은, 마치 그들 자신의 체험인 듯 일어났을 뿐이며, 아버지께서 세심한 배려와 선의와 크나큰 자비로 계획하신 것이었습니다.[a] [] […] 만유는, [그 결핍]에 관하여 그들을 가르치기 위하여, 오직 [그분에게서만] 그들이 모두 결핍들을 없앨 능력을 받은 그 한 분을 통하여 …


    그 자신의 [질서는] 높은 곳으로 서둘러 올라간 <그에게서>, 또 그에게서 스스로 생겨난 것과 온전한 완전성에서 생겨났습니다. 높은 곳으로 서둘러 올라간 이는 결핍된 이를 위한 중재자가 되었으며, 존재하는 것들과 뜻을 같이하여 생겨난 아이온들의 유출도 그와 함께하였습니다. 그가 그들에게 간청하자, 그들은 하나로 뜻을 모으고 있었으므로 결핍된 이를 돕기로 기쁘고도 열렬하게, 조화로운 합의 가운데 뜻을 같이하였습니다. 그들은 함께 모여, 선한 뜻을 지니신 아버지께 위로부터 아버지에게서 도움이 오게 해 달라고, 그의 영광을 위하여 간청하였습니다. 결핍된 이가 완전해질 길은 아버지의 충만의 뜻 말고는 없었기 때문입니다. 그는 그 뜻을 자신에게로 움직이게 하여 드러내고, 결핍된 이에게 <그것을> 베풀었습니다.


    그들은 기쁨에 찬 마음에서 생겨난 조화로부터 열매를 낳았습니다. 그 열매는 그 조화에서 태어난 소생이며, 만유가 지닌 하나 됨으로서 아버지의 얼굴을 드러냈습니다. 아이온들은 아버지를 찬양하면서 그분을 생각하였고, 아버지께서 자기들과 결합해 주시기를 구하며 자기 형제를 도와 달라고 기도하였습니다. 이처럼 그들은 열렬하고 기쁘게 그 열매를 낳았습니다. 그러자 그는 그들의 상호 결합의 합의가 드러난 모습을 보이셨으니, 바로 그의 사랑하는 아들이십니다.[b] [] 만유가 기뻐하는 그 아들은 옷을 입히듯 그들에게 자기 자신을 입혀, 결핍된 이를 완전하게 하고 완전한 이들에게 힘을 주셨습니다. 엄밀히 말하면 그는 ‘구원자’, ‘속량자’, ‘기쁘게 하시는 이’, ‘사랑받는 이’, ‘파라클레토스’, ‘그리스도’, ‘선택된 이들을 위한 빛’이라 불립니다.[c] 그는 자신을 낳은 이들과 상응하는 분입니다. 자신에게 주어진 처소들의 이름이 되었기 때문입니다. 그러나 그에게 ‘아들’ 말고 무슨 다른 이름을 붙일 수 있겠습니까? 앞서 말했듯이, 그가 아버지에 관한 지식이기 때문입니다. 아버지께서는 그들이 자신을 알기를 바라셨습니다.


    앞서 기록한 대로, 아이온들은 자신들이 찬양하는 아버지의 얼굴과 자신들의 얼굴을 모두 낳았습니다. 곧 찬양하는 아이온들이 <그분의> 모습을 낳았고 자기들의 얼굴도 낳았습니다. 그들은 왕의 군대처럼 그분의 군대로 지어졌습니다. 생각에서 나온 존재들이 강력한 일치와 서로 어우러진 조화를 지니고 있기 때문입니다. 그들은 복합적인 형상으로 생겨났습니다. 이는 도움을 받을 이가 자기가 중재해 준 이들을 바라볼 수 있게 하려는 것이었습니다. 그는 또한 그것을 자기에게 베푼 이를 바라봅니다. 앞서 말한, 그와의 합의에서 나온 열매는 만유의 권능 아래 있습니다. 아버지께서 만유, 곧 전에 존재한 이들과 지금 존재하는 이들과 앞으로 존재할 이들을 그 안에 두실 수 있었기 때문입니다.[d] [] 그는 아버지께서 자기 안에 두신 이들을 드러냈습니다. 그들을 내어 준 것이 아니라 그에게 맡기신 것입니다. 그는 처음부터 받은 권위와 그 일을 위한 능력으로 보편적인 구원 계획을 실행하였습니다. 이렇게 그는 자신의 계시를 이루기 시작하였습니다.


    아버지께서 그 안에 거하시고 만유도 그 안에 거하는 이는 보지 못하는 이보다 먼저 창조되었습니다. 그는 완전한 빛의 광채를 통하여 시력을 찾던 이들에 관하여 그에게 가르쳤습니다. 먼저 그는 말로 다 할 수 없는 기쁨 가운데 그를 완전하게 하였습니다. 그를 자기 자신을 위하여 완전한 이로 온전하게 하였고, 또한 사람마다 알맞은 것을 그에게 베풀었습니다. 이것이 첫 기쁨의 성격입니다.'
