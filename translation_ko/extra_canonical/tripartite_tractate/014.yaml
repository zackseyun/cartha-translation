base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/014.yaml
  text: 'The fall experienced by the aeons of the Father of the Totalities happened only as if it were their own experience, planned by the Father with care, generosity, and great kindness. [] […] the Totality, to teach them about [the deficiency] through the one [from whom alone they] all received power to remove deficiencies.


    His own [order came] into being from <him> who hastened on high, from what produced itself from him, and from complete perfection. The one who hastened on high became an intercessor for the deficient one, together with the emanation of the aeons that had come into being in agreement with the things that exist. When he prayed to them, because they were united, they joyfully and eagerly agreed, in harmonious accord, to help the deficient one. They assembled and pleaded with the Father of generous intention that help would come from the Father above, for his glory, because there was no other way for the deficient one to become perfect except by the will of the Fullness of the Father. He had moved it toward himself, revealing and bestowing <it> on the deficient one.


    From the harmony that had come into being through their joyful inclination, they produced the fruit as an offspring of that harmony, a unity possessed by the Totalities, revealing the face of the Father. The aeons thought about the Father as they glorified him and prayed for help for their brother, asking that the Father would join with them. In this way, they eagerly and joyfully produced the fruit. He then revealed the manifestation of the agreement arising from their mutual union, who is his beloved Son. [] The Son in whom the Totalities are well pleased clothed them with himself as with a garment, imparting perfection to the deficient one and giving strength to the perfect ones. Strictly speaking, he is called “Savior,” “Redeemer,” “the Well-Pleasing One,” “the Beloved,” “the Paraclete,” “the Christ,” and “the Light for the Appointed Ones.” He is congruent with those who produced him because he became the names of the places granted to him. But what other name can be given to him
    except “the Son”? As we said before, this is because he is the knowledge of the Father, whom he desired that they know.


    The aeons generated both the face of the Father whom they glorify, as we wrote earlier, and their own face, because the aeons who glorify generated <his> appearance and their own face. They were formed as his army, like the army of a king, because the beings from the thought possess a powerful unity and a harmony blended together. They were produced in a complex form so that the one who would receive help could behold those for whom he had interceded. He also beholds the one who bestowed it on him. The fruit of the agreement with him that we mentioned earlier is subordinate to the power of the Totalities, because the Father was able to place the Totalities within him: those who existed beforehand, those who are, and those who will be. [] He revealed those whom the Father had placed within him, not giving them away but entrusting them to him. He carried out the universal plan of salvation with the authority granted to him from the beginning and with the power needed for the work. In this
    way, he began to accomplish his revelation.


    The one in whom the Father dwells and in whom the Totalities dwell <was> created before the one who is without sight. He taught him about those who sought their sight through the radiance of the perfect light. First, he perfected him in unspeakable joy. He perfected him for his own sake as a perfect one, and he also bestowed on him what is appropriate for each individual. This is the nature of the first joy.'
translation:
  language: ko
  text: '만유의 아버지께 속한 아이온들이 겪은 타락은, 마치 그들 자신의 체험인 듯 일어났을 뿐이며, 아버지께서 세심한 배려와 선의와 크나큰 자비로 계획하신 것이었습니다. [a] […] 만유를, 곧 [그 결핍]에 관하여 그들에게 가르치시기 위함이었습니다. 그들은 오직 [그분에게서만] 모든 결핍을 없앨 능력을 받았습니다.


    그 자신의 [질서는] 높은 곳으로 서둘러 올라간 <그에게서>, 또 그에게서 스스로 생겨난 것과 온전한 완전함에서 생겨났습니다. 높은 곳으로 서둘러 올라간 이는 결핍된 이를 위한 중재자가 되었습니다. 존재하는 것들과 뜻을 같이하여 생겨난 아이온들의 유출도 그와 함께하였습니다. 그가 그들에게 간청하자, 그들은 하나로 뜻을 모으고 있었으므로 결핍된 이를 돕기로 기쁘고도 열렬하게, 조화로운 합의 가운데 뜻을 같이하였습니다. 그들은 함께 모여, 선한 뜻을 지니신 아버지께 위로부터 아버지에게서 도움이 내려와 그분께 영광이 되게 해 달라고 간청하였습니다. 결핍된 이가 완전해질 길은 아버지의 충만의 뜻 말고는 없었기 때문입니다. 그는 그 뜻을 자신에게로 움직여 오게 하여 드러내고, 결핍된 이에게 <그것을> 베풀었습니다.


    그들은 기쁨에 찬 마음에서 생겨난 조화로부터 열매를 낳았습니다. 그 열매는 그 조화에서 태어난 소생이며, 만유가 지닌 하나 됨으로서 아버지의 얼굴을 드러냈습니다. 아이온들은 아버지를 찬양하면서 그분을 생각하였고, 아버지께서 자기들과 결합해 주시기를 구하며 자기 형제를 도와 달라고 기도하였습니다. 이처럼 그들은 열렬하고 기쁘게 그 열매를 낳았습니다. 그러자 그는 그들의 상호 결합에서 나온 합의가 나타난 모습을 드러냈으니, 바로 그의 사랑하는 아들이십니다. [b] 만유가 기뻐하는 그 아들은 옷을 입히듯 그들에게 자기 자신을 입혀, 결핍된 이를 완전하게 하고 완전한 이들에게 힘을 주셨습니다. 정확히 말하면 그는 ‘구원자’, ‘속량자’, ‘기쁨이 되는 이’, ‘사랑받는 이’, ‘파라클레토스’, ‘그리스도’, ‘선택된 이들을 위한 빛’이라 불립니다.[c] 그는 자신을 낳은 이들과 상응하는 분입니다. 자신에게 주어진 처소들의 이름이 되었기 때문입니다. 그러나 그에게 ‘아들’ 말고 무슨 다른 이름을 붙일 수 있겠습니까? 앞서 말했듯이, 그가 아버지에 관한 지식이기 때문입니다. 아버지께서는 그들이 자신을 알기를 바라셨습니다.


    앞서 기록한 대로, 아이온들은 자신들이 찬양하는 아버지의 얼굴과 자신들의 얼굴을 모두 낳았습니다. 곧 찬양하는 아이온들이 <그분의> 모습을 낳았고 자기들의 얼굴도 낳았습니다. 그들은 왕의 군대처럼 그분의 군대로 지어졌습니다. 생각에서 나온 존재들이 강력한 일치와 서로 어우러진 조화를 지니고 있기 때문입니다. 그들은 복합적인 형상으로 생겨났습니다. 이는 도움을 받을 이가 자기가 위하여 중재했던 이들을 바라볼 수 있게 하려는 것이었습니다. 그는 그 도움을 자기에게 베푼 이도 바라봅니다. 앞서 말한, 그와의 합의에서 나온 열매는 만유의 권능 아래 있습니다. 아버지께서 만유, 곧 전에 존재한 이들과 지금 존재하는 이들과 앞으로 존재할 이들을 그 안에 두실 수 있었기 때문입니다. [d] 그는 아버지께서 자기 안에 두신 이들을 드러냈습니다. 그들을 내어 준 것이 아니라 그에게 맡기신 것입니다. 그는 처음부터 받은 권위와 그 일을 위한 능력으로 보편적인 구원 계획을 실행하였습니다. 이렇게 그는 자신의 계시를 이루기 시작하였습니다.


    아버지께서 그 안에 거하시고 만유도 그 안에 거하는 이는 보지 못하는 이보다 먼저 창조되었습니다. 그는 완전한 빛의 광채를 통하여 시력을 찾던 이들에 관하여 그에게 가르쳤습니다. 먼저 그는 말로 다 할 수 없는 기쁨 가운데 그를 완전하게 하였습니다. 그를 자기 자신을 위하여 완전한 이로 온전하게 하였고, 또한 사람마다 알맞은 것을 그에게 베풀었습니다. 이것이 첫 기쁨의 성격입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 빈 대괄호와 생략 부호는 사본 또는 공급된 번역 증거에 본문 공백이나 훼손이 있음을 나타냅니다. 각진 대괄호 안의 말은 결손된 본문을 보충한 것이며, 꺾쇠괄호 안의 말은 번역자가 문맥상 복원한 요소입니다.
    reason: 첫 단락부터 나타나는 여러 본문 비평 표지를 독자가 해석할 수 있도록 설명합니다.
  - marker: b
    text: ‘그의’가 정확히 누구를 가리키는지는 이 대목의 문장 구조상 확정하기 어렵습니다.
    reason: 아들의 관계를 특정 주체에게 단정하여 신학적 모호성을 없애지 않기 위해서입니다.
  - marker: c
    text: ‘파라클레토스’는 돕는 이, 위로하는 이, 변호하는 이 등의 뜻을 아우를 수 있는 명칭이므로 음역했습니다.
    reason: 한 가지 한국어 신학 용어로 의미를 제한하지 않기 위해서입니다.
  - marker: d
    text: 여기의 빈 대괄호는 이 지점에도 본문상의 공백이 있음을 나타냅니다.
    reason: 문단 중간의 본문 결손 신호가 실수로 보이지 않도록 밝힙니다.
lexical_decisions:
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌의 우주론적 기술어를 일반적인 ‘영겁’이나 ‘시대’로 환원하지 않고 음역하여 고유한 의미 영역을 보존했습니다.
- source_word: Totalities / Totality
  choice: 만유 / 만유 전체
  rationale: 문맥상 존재의 총체를 가리키는 전문 개념이므로 ‘전체성들’보다 자연스럽고 장중한 ‘만유’를 사용했습니다. 첫 단락의 단수형은 훼손 문맥의 불확실성을 고려해 문장 안에서 ‘만유’로 두었습니다.
- source_word: Fullness
  choice: 충만
  rationale: 영지주의 문헌의 전문적 함의를 지니면서도 한국어 독자가 이해할 수 있는 전통적 대응어를 택했습니다.
- source_word: emanation
  choice: 유출
  rationale: 신적 실재로부터 비롯되는 발생이라는 문헌의 우주론적 개념을 보존했습니다.
- source_word: Paraclete
  choice: 파라클레토스
  rationale: ‘보혜사’, ‘위로자’, ‘변호자’ 가운데 하나로 의미를 한정하지 않고 원어계 명칭을 음역해 다의성을 보존했습니다.
- source_word: the deficient one
  choice: 결핍된 이
  rationale: 도덕적 ‘부족함’으로 좁히지 않고 존재론적 결핍을 나타내는 반복 표현을 일관되게 살렸습니다.
- source_word: universal plan of salvation
  choice: 보편적인 구원 계획
  rationale: 구원의 범위를 교리적으로 과도하게 확정하지 않으면서 원문의 보편적 규모를 반영했습니다.
theological_decisions:
- issue: 아이온들의 타락과 아버지의 계획 사이의 관계
  choice: ‘마치 그들 자신의 체험인 듯 … 아버지께서 … 계획하신 것’이라는 긴장을 그대로 유지했습니다.
  alternative: 타락이 아이온들의 책임이 아니었다거나 아버지께서 직접 일으키셨다고 명시적으로 해설할 수 있습니다.
  rationale: 본문 자체가 외관상 소유와 신적 계획을 병치하므로 인과관계나 책임 문제를 번역에서 해결하지 않았습니다.
- issue: 아들의 산출 주체와 신적 지위
  choice: 아이온들의 조화가 ‘열매를 낳았고’, 그 열매가 ‘사랑하는 아들’로 드러난다는 서술을 보존했습니다.
  alternative: 정통 교의에 맞추어 ‘낳다’를 약화하거나 아버지만을 직접적 주체로 만들 수 있습니다.
  rationale: 문헌 특유의 발생론을 교파적 언어로 교정하지 않았습니다.
- issue: ‘the knowledge of the Father’의 의미
  choice: ‘아버지에 관한 지식’으로 옮겼습니다.
  alternative: ‘아버지의 지식’으로 옮겨 아버지가 소유하거나 행사하는 지식이라는 뜻을 열어 둘 수 있습니다.
  rationale: 이어지는 ‘그들이 자신을 알기’와의 연결을 자연스럽게 드러내되, 아들이 지식과 동일시된다는 긴장을 유지했습니다.
- issue: ‘created before’와 선재성
  choice: ‘보지 못하는 이보다 먼저 창조되었습니다’로 직역에 가깝게 옮겼습니다.
  alternative: ‘먼저 생겨났습니다’로 번역하여 창조됨의 함의를 약화할 수 있습니다.
  rationale: 공급된 증거의 표현을 교리적 이유로 바꾸지 않았으며, 대상들의 정체가 불분명한 점도 그대로 두었습니다.
- issue: ‘his beloved Son’의 소유 지시 대상
