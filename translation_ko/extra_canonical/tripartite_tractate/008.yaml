translation:
  language: ko
  text: '그분은 다양한 특성들을 총체들에게 한꺼번에 드러내지 않으셨고, 자신에게서 비롯된 이들에게 자신이 자기 자신과 동등하다는 것도 드러내지 않으셨습니다. 그분에게서 비롯된 모든 이들, 곧 영원자들의 영원자들인 이들은 [a] 그분의 생식하는 본성에서 흘러나온 유출물이며 자손이므로, 그들 자신의 생식하는 본성으로 아버지의 영광을 위하여 또한 낳습니다. 그들을 세우신 원인이 바로 그분이시기 때문입니다. 앞서 말했듯이, 그분은 영원자들을 뿌리와 샘과 아버지들로 창조하십니다. 그들이 영광을 돌리는 분도 그분이십니다. 그분이 지식과 지혜를 지니고 계시며, 총체들은 자신들이 총체의 지식과 지혜에서 비롯되었음을 깨달았기 때문입니다.


    총체에 속한 이들이 각 영원자에게 고유한 역량에 따라 영광을 돌렸더라면, 그들이 산출한 것은 총체이신 아버지의 희미한 모습에 지나지 않았을 것입니다. 그러므로 그들은 영광의 노래 안에서, 또 그들이 나온 그분의 하나 됨의 능력 안에서 서로 어우러지고 뒤섞여 하나가 되었습니다. 그들은 충만의 회중으로부터 아버지께 합당한 영광을 드렸습니다. 그것은 하나이면서도 여럿인 형상이었습니다. 한 분의 영광을 위하여 산출되었고, 친히 총체들이신 분께 그들이 가까이 나아갔기 때문입니다.


    그것은 불멸자들의 첫 열매이며 영원한 존재로서 총체들을 낳으신 분께 드리는 [영원자들의] 찬양이었습니다.[b] 완전하고 충만하신 분으로 말미암아 살아 있는 영원자들에게서 완전하고 충만하게 나온 이들이 완전하게 영광을 돌렸고, 그들의 충만하고 완전한 상태는 교제 때문에 온전히 보존되었습니다. 이는 영광을 받으실 때 자신을 영화롭게 하는 그 영광도 들으시는 완전한 아버지와 같았습니다. 그들이 또한 그분과 같은 존재임을 드러내기 위해서였습니다.[c]


    그들에게 두 번째 영예가 주어진 까닭은, 그들이 서로 가운데서 아버지를 위하여 열매를 맺게 해 주는 선물을 깨달았을 때 아버지께서 그들에게 되돌려 주신 것에 있습니다. 그 결과, 그들이 아버지를 위하여 영광스럽게 생겨난 것처럼 영광을 돌리는 행위에서도 완전하게 나타났습니다.


    그들은 자신들과 함께 생겨난 자유와 능력에 부합하는 세 번째 영광 돌림의 아버지들이었습니다. 그 자유와 능력은 그들에게 함께 영광을 돌릴 역량과, 뜻에 따라 저마다 영광을 돌릴 역량을 주었습니다. 그들은 첫째와 둘째 영광 돌림이었습니다. 이 둘은 모두 완전하고 충만합니다. 완전하고 충만하신 아버지와, 완전하신 분께 드린 영광에서 나온 완전한 것들을 드러내기 때문입니다. 그러나 셋째 영광 돌림의 열매에는 각 영원자의 뜻과 아버지의 특성 하나하나와 능력 하나하나가 들어 있습니다. 영원자들이 아버지께 드리기를 원하고 드릴 수 있는 영광이 그들의 일치에서, 또한 각자에게서 나오는 한, 그 열매는 온전하고 완전합니다. 이것이 그분이 사랑하시는 것이며 그분이 권능을 행사하시는 것입니다. 이것을 통하여 아버지께서 영광을 받으시기 때문입니다. 그러므로 그들은 생각들의 생각이며 말씀들의 말씀이고, 장로들의 장로이며 단계들의 단계로 드러나, 서로보다 높이 들립니다.


    영광을 돌리는 이는 누구나 자신이 드리는 영광을 이루는 자기 자리와 높임과 거처와 안식을 지닙니다. 아버지께 영광을 돌리는 모든 이는 영원히 낳는 일을 합니다. 그들은 서로 도우며 낳습니다. 유출들이 무한하고 헤아릴 수 없으며, 아버지께서는 자신에게서 비롯된 이들이 자신과 동등하거나 자신을 닮은 것을 낳는 데 조금도 시기하지 않으시기 때문입니다. 그분은 총체들 안에 계시면서 낳으시고 자신을 드러내십니다. 그분은 원하시는 이를 아버지로 삼으시며, 참으로 그 사람의 아버지가 되십니다. 원하시는 이를 신으로 삼으시며, 참으로 그 사람의 신이 되십니다. 또 그들을 총체들로 삼으시며, 그분은 그들에게 총체가 되십니다.[d] 엄밀히 말하면, 모든 위대한 이름은 그곳을 위하여 간직되어 있습니다. 천사들도 그 이름들을 함께 지니지만, 그들은 통치자들과 함께 이 세상에서 생겨났으며 영원한 존재들과는 아무런 닮음도 없습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점의 사본에는 판독할 수 없거나 빠진 부분이 있습니다. 문장의 연결은 전승된 번역 증거에 따른 잠정적 복원입니다.
    reason: 원문 증거의 공백 표시를 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘[영원자들의]’는 문맥에 따라 보충된 말입니다.
    reason: 대괄호로 표시된 편집상 보충을 명시하기 위해서입니다.
  - marker: c
    text: 이 문장은 사본 상태와 복잡한 구문 때문에 ‘듣는’ 주체와 영광의 관계가 다소 불분명합니다.
    reason: 실제 문헌의 구문적·의미적 불확실성을 보존하기 위해서입니다.
  - marker: d
    text: 이 대목 뒤의 사본에는 판독할 수 없거나 빠진 부분이 있습니다.
    reason: 원문 증거의 두 번째 공백 표시를 반영하기 위해서입니다.
lexical_decisions:
- source_word: Totalities / Totality
  choice: 총체들 / 총체
  rationale: 문헌의 전문 우주론 용어를 보존하면서 단수와 복수의 긴장을 그대로 나타냈습니다.
- source_word: aeons
  choice: 영원자들
  rationale: 단순한 시간 단위가 아니라 인격적·발생적 존재들을 가리키므로 ‘영겁’보다 ‘영원자들’이 문맥에 적합합니다.
- source_word: Fullness
  choice: 충만
  rationale: 우주론적 집합 개념의 전문성을 유지하되 일반 독자도 이해할 수 있는 현재의 용어를 택했습니다.
- source_word: emanations
  choice: 유출물 / 유출들
  rationale: 근원에서 흘러나온 존재라는 발생 이미지를 살리고 ‘창조물’로 단정하지 않았습니다.
- source_word: procreative nature / procreate
  choice: 생식하는 본성 / 낳다
  rationale: 반복되는 생성·출산의 의미망을 보존하고 지나치게 기술적인 문장을 피했습니다.
- source_word: words of words
  choice: 말씀들의 말씀
  rationale: ‘word’의 발화·이성적 표현 가능성을 열어 두면서 문헌의 격조와 반복 구조를 살렸습니다.
- source_word: archons
  choice: 통치자들
  rationale: 음역 대신 기본 의미를 전달하되 특정 종파의 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: 아버지와 영원자들의 같음
  choice: ‘그들이 또한 그분과 같은 존재’로 번역하여 유사성 또는 존재적 대응의 진술을 보존했습니다.
  alternative: ‘그들이 곧 그분이다’ 또는 ‘그분과 동일 본질이다’
  rationale: 원문의 긴장을 특정한 동일성 교리나 정통 교의 용어로 확정하지 않았습니다.
- issue: 아버지가 다른 이들을 아버지·신으로 삼는다는 진술
  choice: 반복되는 관계 표현을 직역에 가깝게 유지했습니다.
  alternative: 파생적 신성이나 단순한 칭호로 설명하여 번역
  rationale: 본문 자체가 부여하는 높은 명칭을 약화하거나 교리적으로 재해석하지 않았습니다.
- issue: ‘그분은 총체들 안에 계신다’
  choice: 내재적 표현을 그대로 보존했습니다.
  alternative: ‘총체들을 통하여 일하신다’
  rationale: 강한 내재성의 원문 진술을 기능적 표현으로 완화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 우주론적 전문어는 일관되게 유지하되 문장을 적절히 나누어 일반 독자의 가독성을 높였습니다. 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 대조가 필요합니다. 원문의 대괄호 보충과 사본 공백은 각주 표지로 보존했고, 사본 면수 표시는 본문 흐름을 위해 생략했습니다.
