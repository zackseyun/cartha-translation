translation:
  language: ko
  text: '이것이 낳음의 온전한 본질입니다. 그것은 [그리스도]께서 그들에게 빛을 비추시며 자신이 드러내신 [빛으로] 말미암아 감당하신 것에서 비롯되었습니다. […] 그의 […]와 같고, […] 될 것이며, 그의 […]와 같습니다. 다만 전에 있었던 이들에게 존재하는 유일한 차이는


    (5행 소실)


    [] […] 존재하는 이들은 […]을 통하여 […] [내가] 앞서 말한 것과 같습니다. 그러나 물질에 속한 이들은 끝까지 버려졌다가 멸망할 것입니다. 그들이 다시 한번 [존재하지 않게 될] 것으로 돌아간다면, 자기들의 [이름]을 내어 주지 않을 것이기 때문입니다. 그들은 […]였던 것처럼 […] 아니었지만, 그들 가운데 머물던 동안에는 [그들에게] 유익했습니다. 비록 처음에는 […] 아니었지만 말입니다. 그때 […] 준비 과정에서 자기들이 지닌 지배력을 통하여 다르게 행동하고, [그들에게] 맞서려고 했습니다.


    내가 이 말들을 계속 사용하고 있지만, [그 생각들을 깨닫지는 못했습니다]. 어떤 장로들은 […] 그에게 위대함을 […].


    (5행 또는 6행 소실)


    [] […] 모든 […] 천사 […] 말과 나팔 [소리로], 빛나는 동쪽에서 오는 위대하고 온전한 회복을 선포합니다. 그 회복은 신방, 곧 아버지 하나님의 사랑 안에서 이루어지며, […] 위대함의 […] 능력에 따라, […]의 감미로움, 곧 그의 […]에 따라 이루어집니다. 이는 그가 위대한 존재들에게 자신을 드러내시기 때문입니다. […] 그의 선하심 […] 찬양과 왕권과 [영광]이 주 예수 그리스도, 곧 구원자이시며 사랑의 자비로 충만한 분께 둘러싸인 모든 이의 구속자이신 분을 통하여, [그의] 성령을 통하여, 이제부터 모든 세대에 걸쳐 영원무궁토록 있기를 빕니다. 아멘.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: begetting
  choice: 낳음
  rationale: 신학적으로 특정한 ‘출생’이나 ‘창조’로 좁히지 않고, 원문 증거가 전달하는 생성·산출의 의미와 추상성을 보존했습니다.
- source_word: material ones
  choice: 물질에 속한 이들
  rationale: ‘물질적인 자들’보다 자연스러우면서도 본문의 존재론적 범주를 교파적 용어로 해석하지 않습니다.
- source_word: complete restoration
  choice: 온전한 회복
  rationale: ‘복원’보다 종말론적·우주론적 문맥에 자연스럽되, 특정 교리 용어인 ‘만유회복’으로 단정하지 않았습니다.
- source_word: bridal chamber
  choice: 신방
  rationale: 상징적이고 의례적인 함의를 지닌 표현을 간결하고 전통적으로 이해 가능한 말로 옮겼습니다.
- source_word: greatnesses
  choice: 위대한 존재들
  rationale: 추상적 복수형을 한국어에서 이해할 수 있도록 인격적 가능성을 드러내되 정확한 정체는 확정하지 않았습니다.
- source_word: Redeemer
  choice: 구속자
  rationale: 대가를 치러 해방한다는 구원론적 의미를 보존하는 표준적 표현을 사용했습니다.
theological_decisions:
- issue: ‘material ones’의 운명
  choice: 끝까지 버려졌다가 멸망할 것입니다
  alternative: 마지막 때까지 버림받아 파괴될 것입니다
  rationale: 본문의 강한 종말론적 진술을 완화하지 않되, 이들을 특정 역사 집단이나 교리적 범주와 동일시하지 않았습니다.
- issue: 회복의 범위
  choice: 위대하고 온전한 회복
  alternative: 만유의 대회복
  rationale: ‘great complete restoration’을 충실히 옮기면서도 소실된 문맥이 그 범위를 확정하지 못하므로 보편구원 교리로 명시하지 않았습니다.
- issue: ‘one filled with loving mercy’의 지시 대상
  choice: 사랑의 자비로 충만한 분
  alternative: 사랑의 자비로 충만한 한 분
  rationale: 그리스도를 가리킬 가능성이 높지만 손상된 문장 구조의 긴장을 보존하여 명칭처럼 과도하게 확정하지 않았습니다.
- issue: 마지막 송영의 문법적 불완전성
  choice: 찬양과 왕권과 [영광]이 … 있기를 빕니다
  alternative: 찬양과 나라와 영광은 … 속합니다
  rationale: 증거 본문의 단편적 문법을 한국어 송영으로 최소한 정돈하되, 소유·귀속 관계를 임의로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 장중한 합쇼체를 사용했습니다. 제공된 영어 공개 번역 증거를 바탕으로 한 잠정 번역이며, 콥트어 원문 대조는 아직 이루어지지 않았습니다. 대괄호, 줄임표, 빈 대괄호, 소실 행 표시는 사본 훼손과 편집자 복원을 그대로 보존했습니다. 웹사이트의 FAQ, 연락처, 광고 문구는 작품 본문이 아니므로 제외했습니다.
