translation:
  language: ko
  text: '그러나 그는 그들의 견해와 반역에서 벗어나게 하는 <조력자>이자 구속자였습니다. ‘회개’라고 불리는 돌이킴이 그에게서 [오기] 때문입니다. 그것은 말씀[a]이 자신의 견해와 생각을 [바꾸었을 때] 일어났습니다. 그는 악에서 돌아서서 선한 것들을 향해 돌이켰습니다. 돌이킨 뒤에 그는 존재하는 이들과, 선한 것으로 자신을 돌이킨 이를 위한 기도를 기억했습니다. 그는 먼저 충만[b] 안에 거하시는 분께 기도하고 그분을 기억했으며, 그다음에는 자기 형제들을 한 명씩 기억하는 동시에 그들 모두를 함께 기억했습니다. 그러나 그들 모두보다 먼저 아버지를 기억했습니다.


    [……] 한마음으로 드린 기도는 그가 자기 자신에게, 그리고 전체[c]에게 돌아가는 일을 도왔습니다. 그가 태초부터 존재했던 이들을 기억하게 된 것은 그 자신이 기억되었기 때문입니다. 이것은 멀리서 외쳐 그를 돌아오게 하는, 아득한 곳의 생각이었습니다.


    그의 모든 기도와 기억은 앞에서 말한 경계와 조화를 이루는 여러 능력으로 이루어져 있었습니다. 그의 생각 안에는 아무것도 결실 없이 남지 않기 때문입니다. 그 능력들은 선했고, 닮은 형상[d]에 속한 것들보다 더 위대했습니다. 닮은 형상에 속한 것들은 [어두운] 본성에도 속하기 때문입니다. 그것들이 된 것은 닮음에 얽힌 환상과 교만에서 나온 [헛된 생각]에서 비롯되었으며, 그것들을 먼저 알았던 [한 생각]에서 비롯되었습니다. 앞의 존재들은 무엇과 같습니까? 그들은 <망각>과 깊은 잠과 같고, 불안한 꿈을 꾸는 사람들, 곧 꿈속에서 <누군가>에게 쫓기며 괴롭힘을 당하는 사람들과 같습니다. 그러나 그에게 다른 존재들은 해 뜨기를 기다리는 빛나는 피조물들과 같습니다. 그들이 그에게서 참으로 달콤한 꿈들을 보았기 때문입니다.


    곧바로 [……] 그 생각에서 흘러나온 것들은 <그쳤고>, 더는 어떠한 실체도 지니지 않았으며 더는 어떠한 영예도 누리지 못했습니다. [이는] <그것들이> 먼저 존재한 이들과 동등하지 않기 때문입니다. 그것들이 닮은 형상들보다 더 뛰어났다면, 그것들보다 높여진 유일한 까닭은 선한 뜻으로 행동했다는 데 있었습니다. 그것들은 생겨난 나약함에서 비롯되지 않았기 때문입니다. 그 선한 뜻은 기도한 뒤 자신을 선한 것에로 들어 올리며 먼저 존재하신 분을 찾은 <이의 뜻>이었습니다. 그는 그것들 안에 먼저 존재하시는 영광스러운 분을 찾고 그분께 기도하려는 성향을 심었으며, [그분을] 생각할 수 있는 능력도 심었습니다. 또한 그것들은 그것이 무엇인지 알지 못했지만, 자기들이 존재하기 전부터 자기들보다 더 위대한 무엇인가가 존재했다는 것을 생각할 수 있는 능력도 심었습니다. 그 생각이 조화와 서로 사랑하는 마음을 낳았으므로, 그것들은 하나 됨과 한마음으로 행동했습니다. 하나 됨과 한마음에서 그것들이 생겨났기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘말씀’은 이 문헌에서 인격적·우주론적 주체를 가리키는 호칭입니다. 흔히 ‘로고스’라고도 옮깁니다.
    reason: 일상적 의미의 말과 전문적 호칭을 구별하기 위해 필요합니다.
  - marker: b
    text: ‘충만’은 신적 존재들의 완전한 영역 또는 총체를 나타내는 이 문헌의 전문 용어입니다.
    reason: 일상적인 충족 상태로 오해하지 않도록 용례를 밝힙니다.
  - marker: c
    text: ‘전체’는 여기서 존재의 총체를 가리키는 전문적 표현일 수 있습니다. 본문의 ‘충만’과 같은 것인지 구별되는지는 번역에서 단정하지 않았습니다.
    reason: 두 우주론 용어의 관계에 관한 실제 모호성을 보존합니다.
  - marker: d
    text: ‘닮은 형상’은 어떤 것과 유사하게 생겨난 존재들 또는 그 영역을 가리키는 듯하지만, 정확한 지시 대상은 불확실합니다.
    reason: 불명확한 집단 명칭을 독자가 일반적 ‘유사성’으로만 읽지 않도록 돕습니다.
lexical_decisions:
- source_word: Word
  choice: 말씀
  rationale: 문헌의 우주론적 인격 주체를 나타내는 전통적이면서도 이해하기 쉬운 표현입니다. 일반적인 ‘말’과 구별하기 위해 문맥상 고유한 호칭처럼 옮겼습니다.
- source_word: conversion called “repentance”
  choice: ‘회개’라고 불리는 돌이킴
  rationale: conversion과 repentance의 어휘적 구별을 보존하면서, 한국어 독자가 관계를 이해하도록 ‘돌이킴’과 ‘회개’를 함께 제시했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 이 문헌의 전문적 우주론 용어를 교파적으로 확정하지 않고 직역에 가까운 형태로 보존했습니다.
- source_word: Totality
  choice: 전체
  rationale: ‘충만’과 구별되는 표현을 유지하고, 존재 전체를 가리킬 수 있는 원문의 개방성을 보존했습니다.
- source_word: likeness
  choice: 닮은 형상
  rationale: 단순한 유사성인지 특정 존재 집단인지 모호한 점을 유지하면서 명사적 용법이 드러나게 했습니다.
- source_word: powers
  choice: 능력들
  rationale: 인격적 세력 또는 발현된 능력일 수 있는 문헌적 긴장을 ‘권세들’로 과도하게 인격화하지 않고 보존했습니다.
- source_word: pre-existent
  choice: 먼저 존재하시는 분
  rationale: 신학적 후대 용어를 덧씌우지 않고 시간적·존재론적 선재성을 자연스러운 한국어로 나타냈습니다.
theological_decisions:
- issue: ‘Word’의 정체
  choice: ‘말씀’으로 번역하되 본문에서 특정 정통 교리의 위격과 명시적으로 동일시하지 않음
  alternative: ‘로고스’ 또는 ‘말’
  rationale: 문헌 자체의 우주론적 주체성을 보존하고, 외부 교리 체계로 정체를 미리 확정하지 않기 위해서입니다.
- issue: 기억됨이 기억을 일으키는 인과관계
  choice: ‘그 자신이 기억되었기 때문’이라는 수동 표현을 그대로 보존
  alternative: 아버지가 그를 기억하셨기 때문이라고 주어를 명시
  rationale: 제공된 증거에는 기억한 주체가 명시되지 않으므로 신학적으로 보충하지 않았습니다.
- issue: ‘good intention’의 소유자
  choice: 보충 흔적을 살려 ‘<이의 뜻>’으로 처리
  alternative: 말씀의 선한 뜻이라고 단정
  rationale: 증인의 복원과 구문이 불확실하므로 가능한 지시 대상을 하나로 확정하지 않았습니다.
- issue: ‘powers’의 존재론적 지위
  choice: ‘능력들’로 유지
  alternative: 천사들, 영적 존재들, 권세들
  rationale: 이들이 인격적 존재인지 정신 활동의 산물인지 본문이 지닌 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 고대 종교·철학 문헌에 맞는 품위를 유지했습니다. 꺾쇠괄호 < >는 번역 증인이 복원한 표현, 대괄호 [ ]는 손상되거나 보충된 표현이라는 편집 신호로 보존했습니다. 내용이 없는 손상 표시는 [……]로 나타냈습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증인에 근거한 잠정 초안입니다.
