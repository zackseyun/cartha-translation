translation:
  language: ko
  text: '**삼부 논고 — 교회**


    태초부터 존재한 것은 아들만이 아니며, 교회도 태초부터 존재했습니다. 이 주제가 수수께끼 같다는 이유로, 아들이 외아들이라는 인식이 이 진술과 모순된다고 생각하는 사람이 있다 해도, 사실은 그렇지 않습니다. [a] 아버지께서는 하나이시며 자신 외에는 누구에게도 아버지로 자신을 드러내지 않으신 것처럼, 아들도 자신 외에는 누구에게도 형제로 드러나지 않으셨습니다. 이는 그분이 태어나지 않으셨고 시작이 없으시기 때문입니다. 아버지께서는 〔아버지로서〕[b] 자신을 경이롭게 여기시며, 〔자신에게 영광〕[c]과 존귀와 〔사랑〕[d]을 돌리십니다. 더욱이 그분은 시작도 끝도 없다는 속성에 걸맞게 자신을 아들로도 생각하십니다. 이와 같이 이 일은 확증됩니다.


    그분의 셀 수 없이 많고 한계 없는 자손은 서로 떼어 놓을 수 없습니다. 존재하는 이들은 선하고 만족할 줄 모르는 생각으로 서로 입 맞추는 이들의 입맞춤처럼 아들과 아버지에게서 나왔습니다. 입맞춤은 많지만 포옹은 하나입니다. 이 말의 뜻은 교회가 아이온들보다 먼저 존재한 많은 개별자들로 이루어져 있다는 것입니다. 이를 엄밀히 말하면 “아이온들의 아이온들”이라고 합니다.[e] 이것이 썩지 않는 거룩한 영들의 특성입니다. 아들께서는 그들 위에서 안식하시는데, 이것이 그분의 본성이기 때문입니다. 이와 마찬가지로 아버지께서도 [f] 아들 위에서 안식하십니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점의 사본에는 결락이 있습니다.
    reason: 제공된 증거의 빈 대괄호가 표시하는 본문 손상을 보존하기 위해 표시했습니다.
  - marker: b
    text: ‘아버지로서’는 손상된 본문을 편집자가 복원한 말입니다.
    reason: 제공된 증거의 대괄호 복원 표시를 독자에게 알리기 위해 넣었습니다.
  - marker: c
    text: ‘자신에게 영광’은 손상된 본문을 편집자가 복원한 말입니다.
    reason: 복원된 문구를 확정적인 사본 본문과 구별했습니다.
  - marker: d
    text: ‘사랑’은 손상된 본문을 편집자가 복원한 말입니다.
    reason: 복원된 문구를 확정적인 사본 본문과 구별했습니다.
  - marker: e
    text: ‘아이온’은 이 문헌에서 영원한 영역·시대 또는 인격적 천상 존재를 가리킬 수 있는 전문 용어입니다.
    reason: 한 가지 의미로 확정하지 않은 음역어의 의미 범위를 설명했습니다.
  - marker: f
    text: 이 지점의 사본에는 결락이 있습니다.
    reason: 제공된 증거의 빈 대괄호가 표시하는 본문 손상을 보존하기 위해 표시했습니다.
lexical_decisions:
- source_word: Church
  choice: 교회
  rationale: 공동체를 가리키는 전통적이고 널리 이해되는 표현을 사용하되, 본문의 선재하는 천상적 실재라는 독특한 문맥은 그대로 보존했습니다.
- source_word: only son
  choice: 외아들
  rationale: ‘독생자’로 교리적으로 확정하기보다, 제공된 증거의 가족 관계 표현을 직접 살렸습니다.
- source_word: unity
  choice: 하나
  rationale: 추상 명사 ‘통일체’보다 자연스러우면서도 아버지의 단일성을 나타내도록 옮겼습니다.
- source_word: unbegotten
  choice: 태어나지 않으셨다
  rationale: 본문이 아들에게 적용하는 이례적인 서술을 다른 신학 용어로 교정하지 않고 보존했습니다.
- source_word: offspring
  choice: 자손
  rationale: 발출물이나 피조물처럼 해석을 선결하지 않고, 친족·기원 이미지를 유지했습니다.
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌의 전문적인 우주론 용어를 일반적인 ‘시대들’로 평준화하지 않고 음역했습니다.
- source_word: reposes
  choice: 안식하시다
  rationale: 단순히 머문다는 뜻과 신학적 안식의 울림을 함께 보존하는 표현입니다.
theological_decisions:
- issue: 아들의 유일성과 교회의 선재가 이루는 긴장
  choice: 두 진술을 모두 유지하고 본문 자체의 ‘모순되지 않는다’는 주장만 제시했습니다.
  alternative: 교회를 아들 안의 관념이나 예정된 공동체로 명시하는 번역
  rationale: 본문은 둘의 관계를 수수께끼로 남기므로 특정 교리 체계로 해소하지 않았습니다.
- issue: 아버지와 아들, 형제에 관한 자기 관계적 표현
  choice: ‘자신 외에는 누구에게도’라는 역설적인 표현을 유지했습니다.
  alternative: 아들이 교회의 구성원들에게 형제가 된다는 식으로 설명하는 번역
  rationale: 난해하더라도 제공된 문헌 증거의 자기 관계적 진술을 보존했습니다.
- issue: 아버지가 자신을 아들로 생각한다는 진술
  choice: 주어를 아버지로 유지하여 직역에 가깝게 옮겼습니다.
  alternative: 아버지가 ‘아들을 생각한다’ 또는 ‘아들을 낳는다’로 교정하는 번역
  rationale: 본문의 진정한 신학적 긴장을 후대의 삼위일체적 정식에 맞추어 완화하지 않았습니다.
- issue: 교회와 ‘아이온들의 아이온들’의 관계
  choice: 대명사 ‘이를’을 사용해 지시 대상의 여지를 남겼습니다.
  alternative: ‘교회’를 유일한 지시 대상으로 명시하는 번역
  rationale: 제공된 문장의 문법적 지시 관계가 완전히 명확하지 않으므로 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 난해한 우주론적·자기 관계적 진술은 설명적으로 평준화하지 않았습니다. 이 초안은 제공된 공개 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 대조는 아직 이루어지지 않았습니다. 〔 〕는 편집상 복원된 말을 나타내고, 각 결락과 복원은 각주로 밝혔습니다.
