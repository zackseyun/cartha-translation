  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/005.yaml
  text: 'The Father brought forth the All like a small child, like a drop from a spring, like a blossom from [a vine], like [a flower], like a <planting> [. . .], so that it needed to obtain [nourishment] and growth and perfection. He held it back for a season. The one who conceived of it from the first instant of the beginning possessed and beheld it from the first instant of the beginning, but he <concealed> it for those who were the first to originate from him. Not from envy, but that the aeons could not receive their perfection (prematurely) from the first instant of the beginning and could not lift up themselves to the glory (that belongs solely to) the Father, and could not suppose that they possess all this from themselves. Instead, just as he willed to allow them to be able to come into being, so that they could also come into being as perfect entities, at the time of his choosing he granted them the perfect idea of generosity toward them.


    The one he raised up to be a light to those who originated from himself, the one from whom they derive their name, he is the full, complete and perfect Son. He produced him mixed with what emerged out of him, [] [. . .] sharing in the glory [. . .] the Totality, congruent with [. . .], by means of which each is [able] to receive it to [himself], although each did not have this greatness before they were received by it. They, instead, exist only partially in his proper mode and form and greatness. [They] are able to see him and speak of [what they] know about him, because they wear each other, because they are able to grasp [him]. By contrast, [his] mode of being is without comparison, so that the Father could receive honor from each one and could reveal himself, despite his incomparability. Concealed and unseen, they wonder at him in mind. The greatness of his exaltedness is consequently manifested when they speak of him and behold him, hymning him for the riches of his sweetness.'
translation:
  language: ko
  text: '아버지께서는 전체[a]를 작은아이처럼, 샘에서 나온 물방울처럼, [포도나무]에서 돋은 꽃망울처럼, [꽃]처럼, <심은 것>처럼 [. . .] 낳으셨습니다. 그리하여 전체는 [양분]을 얻고 자라서 완전해질 필요가 있었습니다. 아버지께서는 한동안 그것을 붙들어 두셨습니다. 시작의 첫 순간부터 그것을 생각해 내신 분은 시작의 첫 순간부터 그것을 소유하고 바라보셨지만, 자신에게서 맨 먼저 생겨난 이들에게는 그것을 <감추셨습니다>. 이는 시기해서가 아니었습니다. 에온들[b]이 시작의 첫 순간부터 때 이르게 완전함을 얻거나, 오직 아버지께만 속한 영광에 스스로 올라서거나, 이 모든 것을 자기 힘으로 소유한다고 여기지 못하게 하시려는 것이었습니다. 오히려 아버지께서는 그들이 존재할 수 있게 하기를 뜻하셨던 것처럼, 그들이 완전한 존재들로도 이루어질 수 있도록 자신이 택하신 때에 그들을 향한 너그러움의 완전한 관념을 그들에게 주셨습니다.


    아버지께서 자신에게서 생겨난 이들에게 빛이 되도록 일으키신 분, 곧 그들이 그에게서 이름을 얻는 그분은 충만하고 온전하며 완전한 아들이십니다. 아버지께서는 자신에게서 나온 것과 그를 섞어 내셨으며, [] [. . .] 영광에 참여하는 [. . .] 총체[c], [. . .]와 일치하는 것으로서, 그것을 통하여 각자가 그것을 [자기 안에] 받아들일 [수 있게] 하셨습니다. 그러나 그것이 그들을 받아들이기 전에는 각자에게 이러한 위대함이 없었습니다. 오히려 그들은 그분 고유의 존재 방식과 형상과 위대함 안에 부분적으로만 존재합니다. [그들은] 서로를 입고 있기에, 곧 [그분]을 붙들어 이해할 수 있기에, 그분을 볼 수 있고 그분에 관해 [아는 것을] 말할 수 있습니다. 이와 달리 [그분의] 존재 방식은 견줄 데가 없습니다. 그리하여 아버지께서는 각자에게서 영예를 받으시고, 비할 데 없는 분이시면서도 자신을 드러내실 수 있습니다. 감추어져 보이지 않는 그분을 그들은 마음속으로 경이롭게 여깁니다. 그러므로 그들이 그분을 말하고 바라보며, 그분의 감미로움이 지닌 풍성함을 찬미할 때, 그분의 드높으심이 얼마나 위대한지가 드러납니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전체’는 이 문헌에서 아버지에게서 비롯된 존재들의 총괄을 가리키는 전문적 표현입니다.
    reason: 일상적인 ‘모든 것’보다 우주론적 용어라는 점을 알립니다.
  - marker: b
    text: ‘에온’은 이 문헌에서 아버지에게서 비롯된 영원한 영역 또는 존재들을 가리키는 전문 용어입니다.
    reason: 음역어의 의미 범위를 독자에게 안내합니다.
  - marker: c
    text: 여기서는 ‘전체’와 다른 영어 표현(The Totality)이 사용되었으므로 ‘총체’로 구별했습니다. 주변 본문은 훼손되어 문장 관계가 불확실합니다.
    reason: 용어 구별과 본문 결락으로 인한 불확실성을 보존합니다.
lexical_decisions:
- source_word: the All
  choice: 전체
  rationale: 문헌의 우주론적 집합 개념을 특정 교리로 풀어 쓰지 않고 보존했습니다.
- source_word: aeons
  choice: 에온들
  rationale: 고대 영지주의 문헌의 전문 개념이므로 ‘시대들’ 등으로 환원하지 않고 음역했습니다.
- source_word: Son
  choice: 아들
  rationale: 관계적·신학적 칭호를 그대로 보존하되 후대 교리적 설명을 덧붙이지 않았습니다.
- source_word: the Totality
  choice: 총체
  rationale: 앞선 ‘the All’과 원문 증언상 표현이 구별되므로 한국어에서도 ‘전체’와 달리 옮겼습니다.
- source_word: wear each other
  choice: 서로를 입고 있다
  rationale: 난해한 은유를 해석적으로 평준화하지 않고 그대로 살렸습니다.
- source_word: sweetness
  choice: 감미로움
  rationale: 감각적 은유와 찬미의 어조를 함께 보존했습니다.
theological_decisions:
- issue: 완전함이 지연된 목적
  choice: 시기 때문이 아니라 피조된 에온들이 완전함과 영광을 자력 소유로 오해하지 않게 하려는 것으로 번역
  alternative: 아버지가 의도적으로 그들의 성숙을 방해했다는 식의 번역
  rationale: 증언 본문의 부정과 목적절을 유지하면서 아버지의 동기를 교리적으로 재구성하지 않았습니다.
- issue: 아들의 완전성에 관한 삼중 표현
  choice: ‘충만하고 온전하며 완전한 아들’
  alternative: 중복을 줄여 ‘완전한 아들’로 압축
  rationale: full, complete, perfect의 누적 강조와 신학적 긴장을 보존했습니다.
- issue: 아버지의 비할 데 없음과 자기 계시
  choice: 두 진술을 병치하여 모두 유지
  alternative: 초월성과 계시 가능성 가운데 하나로 조화시켜 설명
  rationale: 본문의 역설적 긴장을 해소하지 않았습니다.
- issue: 아들과 ‘나온 것’의 혼합
  choice: ‘자신에게서 나온 것과 그를 섞어 내셨다’
  alternative: 연합, 성육신, 동일본질 등 특정 교리 용어로 해석
  rationale: 본문이 말하는 혼합의 모호성을 그대로 남겼습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 존엄한 문체를 유지하되 지나치게 고어적인 표현은 피했습니다. 대괄호, 빈 대괄호, 말줄임표, 꺾쇠괄호는 제공된 증언의 복원·결락·편집 표지를 그대로 보존했습니다. 고대 콥트어 원문 대조가 아직 이루어지지 않았으므로, 이 초안은 제공된 공용 영어 증언에 근거한 잠정 번역입니다.
