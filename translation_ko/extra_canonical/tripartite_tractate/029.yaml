  source_fidelity: 제공된 영어 증언과 대조한 결과, 초안은 전반적인 논지와 사본 훼손·복원 표지를 충실히 보존합니다. 다만 몇몇 표현이 원 증언의 논리 관계를 다소 바꾸거나 과도하게 확정합니다. 특히 ‘그리스도 안에 있는 나라’는 ‘If we profess the kingdom in Christ’의 고백 행위를 흐리며, ‘이교 신들을 버린 대가로’는 단순한 전환 관계를 거래적 대가 관계로 강화합니다. 또한 일부 훼손된 구절에서 문장 연결을 지나치게 매끈하게 하여 불확실성을 약화시켰습니다. 직접 콥트어 대조가 보류되어 있으므로 본 검토는 영어 증언에 대한 충실성을 기준으로 합니다.
  naturalness: 현대 표준 한국어 합쇼체의 문체는 대체로 안정적입니다. 다만 ‘중개되지 않은 광경’, ‘확고함’, ‘기쁜 생각들’ 등은 다소 직역투이거나 의미가 좁아질 수 있어 ‘매개 없는 봄’, ‘확증’, ‘기뻐하는 생각들’로 조정했습니다. 훼손 구절은 자연스러운 완결문으로 만들기보다, 한국어에서도 단편성과 불확실성이 드러나도록 다듬었습니다.
  terminology: ‘선택’, ‘부르심’, ‘말씀’, ‘안식’, ‘충만’, ‘아이온’, ‘존재하시는 분’의 선택은 일관되고, 특정 교파의 체계로 본문을 조화시키지 않습니다. ‘singularity’는 ‘하나 됨’으로 유지하되, ‘a singularity’의 명사적 반복을 살렸습니다. ‘confirmation’은 ‘확고함’보다 결과·확증의 의미를 열어 두는 ‘확증’으로 옮겼습니다.
