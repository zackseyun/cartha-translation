  language: ko
  text: '### 부르심에 관하여 더 말함


    선택에 관해서는 우리가 말할 수 있는 것이 훨씬 더 많고, […] 그것들을 말하는 것이 마땅하지만, 그래도 우리는 ‘오른편에 속한 이들’이라고 불리는 부르심에 속한 이들에 관해 더 <말해야> 합니다.[a] 그들을 잊는 것은 유익하지 않기 때문입니다. 우리는 전에도 그것으로 충분하다는 듯이 그들에 관해 길게 말했습니다. 그렇다면 어찌하여 우리는 그들에 관해 일부만 말했습니까?


    내가 말했듯이, 말씀에게서 생겨난 모든 이는 악한 자들에 대한 심판에서 생겨났든, 그들과 싸우는 격분에서 생겨났든, 그들에게서 돌아서 높은 곳에 있는 이들에게로 되돌아감에서 생겨났든, 먼저 존재한 이들을 위한 기도와 기억에서 생겨났든, 선한 행위로 구원을 [얻을] 수 있다는 소망과 믿음에서 생겨났든, 모두 합당하다고 여겨졌습니다. 그들이 선한 성향에서 나왔고, ‘존재하시는 분’에게서 비롯된 한 생각이 그들을 낳은 원인이 되었기 때문입니다.


    나는 또 이렇게 말했습니다. 말씀이 보이지 않는 방식으로 기꺼이 그들과 관계를 맺기 전에, 높임받으신 분이 앞에서 말한 그 생각을 그들에게 주셨습니다. 그들이 그것에 [귀를 기울였기] 때문입니다. […] 그 생각은 그들이 존재하게 된 원인이 되었습니다. 그들은 구원받았을 때, 마치 자기들보다 앞서 존재한 것이 아무것도 없는 듯이 스스로를 교만하게 높이지 않았습니다. 오히려 자기들의 존재에는 기원이 있음을 고백했고, 자기들보다 먼저 존재하신 분을 알기 원한다고 고백했습니다.


    나는 또 그들이 번개처럼 나타난 빛의 계시 앞에 엎드렸으며, 그 빛이 자기들의 구원을 위해 나타났다고 증언했다고 말했습니다.


    내가 말했듯이, 말씀에게서 생겨난 이들만 좋은 것을 얻는 것이 아닙니다. 그들이 선한 성향에 따라 낳은 이들도 선물이 풍성하기 때문에 안식을 누릴 것입니다. 지배하려는 욕망에서 생겨나 그 안에 지배욕의 씨가 있는 이들까지도, 선한 성향을 지닌 이들과 협력하고 덧없이 사라질 영광을 향한 헛된 사랑을 의도적으로 버리기 원한다면, 선행의 보상을 받을 것입니다. 그들은 영광의 주 […]의 계명을 지켜, 잠시뿐인 보잘것없는 명예 대신 영원한 나라를 상속받을 것입니다.


    우리는 앞에서 한 말을 다시 살펴볼 필요가 있었습니다. 그러나 이제 일관된 논의를 펼치려면, 오른편에 속한 이들이 섞이지 않은 이들이든 섞인 이들이든 구원과 안식의 선물을 얻을 수 있는지에 관한 원인과 결과와 <증거>를 서로 연결해야 합니다. 그러므로 설득력 있게 논증하면서 그들의 믿음이 지닌 형태에 근거하여 이를 입증해야 합니다.


    우리가 그리스도 안에 있는 나라를 고백한다면, 형태와 불평등과 변화의 온갖 다양성은 사라집니다. 시작이 하나였던 것처럼 마지막도 다시 하나가 될 것이기 때문입니다. 그곳에는 남자도 여자도 없고, 종도 자유인도 없으며, 할례받은 이도 할례받지 않은 이도 없고, 천사도 사람도 없습니다. 오직 그리스도께서 모든 것 안에서 모든 것이십니다. 처음에 존재하지 않았던 이가 어떻게 존재하는 자로 발견될 수 있습니까? 또한 종이 아니었던 이가 […] 자유인과 함께 자리를 차지하게 된다면, 그는 어떤 존재입니까? 그들은 어떤 목소리에서 나온 짧은 말만을 근거로 사정이 그러하다고 믿을 필요 없이, 중개되지 않은 광경을 직접 보게 될 것입니다.


    이는 전에 있었던 것의 회복이 하나 됨이기 때문입니다. 어떤 이들이 구원의 계획으로 말미암아 높아져서, 존재하는 것들의 원인들을 맡고 수많은 자연의 힘을 작동시키며 그것들을 기뻐한다고 하더라도, 그들이 천사이든 사람이든 나라와 확고함과 구원에 이를 것입니다.


    그 원인들은 다음과 같습니다. 육체로 나타난 이들은 그분이 오래전부터 말로 표현할 수 없고 아무도 볼 수 없었던, 알려지지 않은 하나님의 아들이심을 흔들림 없이 믿었습니다. 그들은 전에 엎드려 경배하던 자기들의 신들과 하늘과 땅의 주들을 버렸습니다. <그분이> 들려 올라가시기 전, 아직 어린아이였을 때에도 그들은 그분이 이미 선포하고 계셨다고 증언했습니다. 또 그분이 [죽은 사람으로서] 무덤에 계셨을 때에도 천사들은 그분이 살아 계시다고 믿었고, [심지어] 죽은 분에게서 생명 […]을 받았습니다.


    그들이 이교 신전에서 행하던 수많은 제의와 기이한 일은 이제 다른 분, 곧 그리스도를 섬기는 일로 바뀌었습니다. 그들이 그리스도께 가까이 가기를 서두를 때, 그분에 대한 고백이 그들에게 그렇게 바꿀 힘을 주었습니다. 그들이 이교의 준비를 받아 두었던 것은, 나중에 그것을 버리고 이 아래의 곳, 곧 세상에서 <존귀히 여김을 받지> 못한 분을 택하게 하려는 것뿐이었습니다. 그러나 그들은 이교 신들을 버린 대가로 [그리스도를 얻었습니다]. 그들은 그리스도께서 [높은] 곳에서 오셨으며, 자기들도 그분과 함께 그곳에서 왔음을 깨달았습니다. 그곳은 하나님의 다스림이 있는 곳입니다. 그들이 경배하고 돌보며 섬겼던 자들의 이름은 빌려 받은 것이었으므로, 이제 그 이름들을 마땅히 그 이름들이 가리키는 분께 옮겼습니다.


    그러나 그분이 들려 올라가신 뒤에야 비로소 그들은 그분이 자기들의 주이시며, 그분 위에는 어떤 주도 없음을 깨달았습니다. 그들은 자기들의 나라를 그분께 넘겼고, [자기들의] 왕좌에서 일어났으며, 왕관을 내어놓았습니다. 그러나 그분이 자신을 그들에게 나타내신 것은 우리가 이미 말한 원인들 때문이었습니다. 곧 그들을 치유하고, […]에 관한 선한 생각으로 [돌이키게] 하며, […] 동료와 천사들 […] 그리고 그들이 그것을 위해 행한 풍성한 선행 때문이었습니다.[b] 그리하여 그들은 선택받은 이들에게 유익한 봉사를 맡았습니다. 곧 그들의 불의를 하늘로 가져가, 부인할 수도 그릇될 수도 없는 [심판]으로 영원한 재판을 받게 하는 일이었습니다. 그들은 모든 이가 지상의 삶에 들어왔다가 삶에서 떠날 때까지 그들을 위해 이 일을 계속합니다. 그들의 몸이 땅에 [남아] 있는 동안 그들의 모든 […]을 섬기고, 성도들에게 다른 이들보다 더 많이 닥친 고통과 박해와 위험을 함께 나눕니다.


    악한 <자의> 종들에 관해서는, 악이 멸망받아 마땅하기 때문에 <…>, 모든 세계 위에 있는 [공동생활], 곧 그들의 선한 생각과 형제애 때문에 굳게 […].


    교회는 그들을 참된 친구와 충실한 종으로 기억할 것입니다. 교회가 그들에게 신방에 가득한 기쁨과, 교회의 집 안에 거하는 […]과, 생각 속에 거하는 […]과, 교회가 […]에게 빚진 것을 보상으로 [주시는] 분에게서 구속을 받은 뒤의 일입니다. […] 교회와 함께 거하시는 그리스도, 그리고 전체의 아버지를 기다리는 기대 […]. 교회가 그들에게 인도하고 섬길 천사들을 보내 줄 것이기 때문입니다.


    아이온들은 교회를 섬기려 했던 기쁜 생각들을 기억하고, 그들의 모든 숙고에 [대한] 보상을 그들에게 줄 것입니다.[c] 이것은 아이온들에게서 흘러나온 것입니다. 그리스도께서 자신의 뜻을 [이루시어] 교회의 높고 위대한 [것들]을 생겨나게 하시고 교회에 주신 것처럼, 이 흘러나옴도 이들을 위한 생각이 되어 그들이 영원히 거할 처소를 마련해 줄 것입니다. [그들이] 결핍이 아래로 끌어당기는 힘을 물리치면, 충만의 능력이 크나큰 너그러움과 먼저 존재한 아이온의 감미로움으로 그들을 위로 밀어 올릴 것입니다.


    [a] 이 번역은 현재 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 나그함마디 문서의 콥트어 본문에 대한 직접 대조는 아직 이루어지지 않았습니다.


