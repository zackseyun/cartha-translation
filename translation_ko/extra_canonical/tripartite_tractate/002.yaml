  revised_text: '그렇다면 그분은 이해할 수 없는 분이시므로 알려질 수 없고, 어떤 생각으로도 붙잡을 수 없으며, 모든 것에 보이지 않고, 어떤 말로도 표현할 수 없으며, 어떤 손도 닿을 수 없습니다. 오직 그분만이 자신이 [] 어떠한지를 아시며, 자신의 형상과 위대함과 크기가 어떠한지를 아십니다. 그분은 자신을 생각하고, 보고, 이름 짓고, 이해할 수 있으므로, 자신의 정신과 자신의 눈과 자신의 입과 자신의 형상이 자신의 존재와 동일한 유일한 분이십니다. 그러므로 그분은 자신이 생각하는 것이며, 자신이 보는 것이며, 자신이 말하는 것이며, 자신이 이해하는 것입니다. 그분 자신은 생각할 수 없고 표현할 수 없고 붙잡을 수 없으며 변하지 않는 분인 한편, 그분이 생각하고 보고 말하는 것, 곧 그분이 생각하신 것은 양식이며, 기쁘고 참되며 만족스럽고 평안합니다. 그분은 모든 지혜를 뛰어넘고, 모든 정신과 모든 영광과 모든 아름다움과 모든 감미로움과 모든 위대함과 모든 깊이와 모든 높이 위에 계십니다.



    본성상 알 수 없는 이분은, 내가 열거한 위대한 속성을 모두 지니고 계십니다. 그분이 자신의 풍성한 감미로움에서 우러나 자신을 알 수 있는 지식을 주고자 하신다면, 그렇게 하실 수 있습니다. 그렇게 하는 그분의 능력은 곧 그분의 뜻입니다. 그럼에도 만유[a]가 영원한 존재로 나오게 하시는 위대한 분은 침묵 가운데 자신을 억제하십니다.



