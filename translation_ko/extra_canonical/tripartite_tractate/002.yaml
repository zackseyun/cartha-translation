translation:
  language: ko
  text: '그렇다면 그분은 이해할 수 없는 분이므로, 따라서 알려질 수 없고, 어떤 생각으로도 붙잡을 수 없으며, 그 무엇에도 보이지 않고, 어떤 말로도 표현할 수 없으며, 어떤 손도 닿을 수 없습니다. 오직 그분만이 자신이 [] 어떠한지를 아시며, 자신의 형상과 위대함과 크기가 어떠한지를 아십니다. 그분은 자신을 생각하고, 보고, 이름 짓고, 이해할 수 있으므로, 자신의 정신과 자신의 눈과 자신의 입과 자신의 형상이 자신의 존재와 같은 유일한 분입니다. 그러므로 그분은 자신이 생각하는 것이며, 자신이 보는 것이며, 자신이 말하는 것이며, 자신이 이해하는 것입니다. 그분 자신은 생각할 수 없고 표현할 수 없고 붙잡을 수 없으며 변하지 않는 분인 한편, 그분이 생각하고 보고 말하는 것, 곧 그분이 생각해 낸 것은 양식이며, 기쁘고 참되고 흡족하며 안식을 줍니다. 그분은 모든 지혜를 뛰어넘고, 모든 정신과 모든 영광과 모든 아름다움과 모든 감미로움과 모든 위대함과 모든 깊이와 모든 높이 위에 계십니다.


    본성상 알 수 없는 이분은, 내가 열거한 위대한 속성을 모두 지니고 계십니다. 그분이 자신의 풍성한 감미로움에서 우러나 자신을 알 수 있는 지식을 주고자 하신다면, 그렇게 하실 수 있습니다. 그렇게 하는 그분의 능력은 곧 그분의 뜻입니다. 그럼에도 만유[a]가 영원한 존재로 나오게 하시는 위대한 분은 침묵 가운데 자신을 억제하십니다.


    [] 엄밀히 말하면, 그분은 표현할 수 없는 방식으로 자신을 낳으십니다. 오직 그분만이 스스로 낳은 분이기 때문이며, 자신에게서 생각되어 나왔고 자신이 어떠한지를 스스로 아시기 때문입니다. 그분은 자신의 무한한 위대함과 헤아릴 수 없는 지혜와 측량할 수 없는 능력과 맛으로는 알 수 없는 감미로움에서, 자신의 존중과 영광과 존귀와 찬양을 받기에 합당한 모든 것을 이루십니다. 그분은 낳음의 방식으로 자신을 내보내어 영광과 찬양과 존귀와 사랑을 받으시며, 자신을 영화롭게 하고 찬양하며 자신에게 존귀와 사랑을 드리십니다. 이와 같이 그분에게는 아들이 있습니다. 아들은 그분 안에 존재하며, 그분에 관하여 침묵하고, 표현할 수 없는 분 안에서 표현할 수 없고, 보이지 않는 분 안에서 보이지 않으며, 붙잡을 수 없는 분 안에서 붙잡을 수 없고, 이해할 수 없는 분 안에서 이해할 수 없습니다.


    이와 같이 아들은 아버지 안에 영원히 존재합니다. 앞서 설명했듯이, 아버지는 낳아지지 않은 방식으로 자신 안에서 자신을 아십니다. 그분은 생각으로 자신을 낳으셨고, 그분에 관한 그 생각은 자신을 지각하는 []이며, 그분의 영원한 본성의 […]입니다.[b] 그러나 엄밀히 말하면, 그것은 침묵이며 지혜이며 선물입니다. 이런 식으로 부르는 것이 정확하다면 말입니다. 엄밀히 말해 아버지께서 존재하시되, 그분보다 먼저는 아무도 [존재하지 않았고], 그분 외에는 낳아지지 않은 다른 이가 없습니다. 이와 마찬가지로 엄밀히 말해 [아들도] 존재하시되, 그보다 먼저는 아무도 존재하지 않았고 그 뒤로는 다른 아들이 존재하지 않을 것입니다. 그러므로 그는 맏아들이며 외아들입니다. 그보다 먼저 존재하는 이가 아무도 없으므로 맏아들이고, 그 뒤로 올 다른 아들이 아무도 없으므로 외아들입니다. 더욱이 그에게는 열매가 있는데, 그것은 뛰어난 위대함 때문에 알 수 없는 것입니다. 그러나 그는 자신의 풍성한 감미로움에서 우러나 그 열매가 알려지기를 원했습니다. 그리고 그는 말로 다 할 수 없는 능력을 드러내어, 그것을 자신의 풍성한 너그러움과 섞었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만유’는 이 문헌에서 존재하는 모든 것의 총체를 가리키는 독특한 표현입니다.
    reason: ‘Totalities’의 전문적이고 집합적인 성격을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 대괄호와 줄임표는 전승된 본문이 손상되었거나 복원이 불확실한 곳을 나타냅니다.
    reason: 해당 문장의 공백과 결손을 번역자가 임의로 메우지 않았음을 밝히기 위해서입니다.
lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: 이해할 수 없는 / 붙잡을 수 없는
  rationale: 서로 가까운 개념이지만 인식적 이해와 정신적·비유적 포착의 차이를 유지했습니다.
- source_word: Totalities
  choice: 만유
  rationale: 문헌의 독특한 우주론적 집합 개념을 나타내면서도 현대 한국어 독자가 이해할 수 있는 격조 있는 용어를 택하고 각주로 범위를 밝혔습니다.
- source_word: sweetness
  choice: 감미로움
  rationale: 반복되는 핵심 속성의 어휘적 일관성을 보존하고, 단순한 맛 이상의 호의와 즐거움의 함의를 열어 두었습니다.
- source_word: self-begotten
  choice: 스스로 낳은 분
  rationale: ‘자생자’ 같은 전문 조어를 피하면서 자기 발생·자기 출생이라는 원문의 역설을 보존했습니다.
- source_word: projects himself
  choice: 자신을 내보내어
  rationale: 유출론적 해석을 과도하게 확정하지 않으면서 외부로 발현한다는 동작을 나타냈습니다.
- source_word: Firstborn and only Son
  choice: 맏아들이며 외아들
  rationale: 뒤따르는 저자의 설명과 연결되도록 두 칭호의 구별을 그대로 유지했습니다.
- source_word: sustenance
  choice: 양식
  rationale: 생명을 유지하는 것이라는 의미를 간결하고 격조 있게 전달했습니다.
theological_decisions:
- issue: 아버지가 ‘자신을 낳는다’는 진술
  choice: 역설적 자기 출생 표현을 그대로 보존
  alternative: ‘자신을 드러낸다’처럼 완화
  rationale: 본문 특유의 신학적 긴장을 해소하거나 후대 교리 체계에 맞추지 않았습니다.
- issue: 아들의 아버지 안에서의 영원한 존재
  choice: ‘아들은 아버지 안에 영원히 존재합니다’
  alternative: 존재 양상을 특정 교리 용어로 해설
  rationale: 본문이 명시하는 내재성과 영원성을 번역하되 별도의 교파적 개념은 도입하지 않았습니다.
- issue: ‘맏아들’과 ‘외아들’의 의미
  choice: 본문 자체의 시간적 설명을 그대로 유지
  alternative: 정통 교리적 칭호로 재해석
  rationale: ‘앞선 이 없음’과 ‘뒤따를 아들 없음’이라는 문헌 자체의 논리를 보존했습니다.
- issue: 대명사 지시 대상이 불안정한 문장
  choice: 문맥상 아버지와 아들을 최소한으로 명시하되 손상 표시는 유지
  alternative: 모든 지시 대상을 매끄럽게 확정
  rationale: 영어 증거문과 손상된 본문이 허용하는 범위를 넘어 의미를 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 신비주의적·철학적 반복과 병렬 구조는 가능한 한 보존하되, 지나치게 번역투가 되지 않도록 문장을 나누었습니다. 현재 초안은 제공된 공공 영역 영어 증거문에 근거한 잠정 번역이며, 콥트어 원문 직접 대조가 필요합니다.
