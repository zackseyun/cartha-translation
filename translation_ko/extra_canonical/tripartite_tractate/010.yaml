base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/010.yaml
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
translation:
  language: ko
  text: '존재하는 분에게서 존재하게 된 전체들의 유출[a]은, 그들을 낳는 이가 내버린 [어떤 것]처럼 서로에게서 분리되는 방식으로 일어난 것이 아닙니다. 오히려 그들이 태어나는 방식은 펼쳐 나가는 행위와 같습니다. 곧 아버지께서 사랑하는 이들에게 자신을 펼쳐 보이셔서, 그에게서 생겨난 [이들]도 그가 될 수 있게 하시는 것과 같습니다. 현시대는 하나이지만 시간의 단위들로 나뉘고, 그 단위들은 해로, 해는 다시 계절로, 계절은 달로, 달은 날로, 날은 시간으로, 시간은 분으로 나뉩니다. 이와 마찬가지로, [] 진리의 시대는 하나이면서도 여럿이므로, 각자가 이해할 수 있는 만큼 작고 큰 이름들로 존중받습니다. 비유하자면, 이는 샘이 본래 그대로 있으면서도 흘러나와 시내와 호수와 수로와 지류로 불어나는 것과 같습니다. 또는 나무들 아래로 뻗어 나가 열매 맺는 가지들을 내는 뿌리와도 같고, 서로 떼어 낼 수 없는 방식으로 여러 갈래의 팔다리, 곧 주요한 것과 부차적인 것, 큰 것과 작은 것으로 나뉜 사람의 몸과도 같습니다.


    아이온들[b]은 자유 의지로, 또 셋째 열매가 생각하도록 그들에게 준 이해력을 따라, 자신들을 산출했습니다. 그들은 각각의 충만들[c]이 [찬양의] 말로 한마음이 되어 산출한 것과 [함께] 영광을 드리려 하지 않습니다. 또한 전체 총체와 함께 영광을 드리려 하지도 않으며, 자기보다 더 높은 장소나 상태에 이른 어느 한 아이온과 함께 영광을 돌리려 하지도 않습니다. 다만 그 아이온이 더 존귀한 이름과 더 높은 자리를 지닌 이에게서 바라던 <것>을 얻는 경우는 예외입니다. [] 그들은 더 높은 곳에서 서로를 받아들입니다. 더 높이 올라가고자 한 이는, 말하자면 자신을 낳습니다. 곧 다른 이와, 그가 지닌 것과 더불어 자신을 낳으며, 자기 형제에게서 그에게로 온 이와 함께 새로워지고, 그를 바라보며 그 일에 관해 간청합니다.


    이 일이 이런 방식으로 이루어지게 하려고, 영광을 드리고자 한 이는 그에게 이에 관해 이것 외에는 아무 말도 하지 않습니다. 충만 안에는 말의 한계가 정해져 있기 때문입니다. 그리하여 그들은 아버지를 파악할 수 없음에 관해서는 침묵하지만, 그분을 파악하려는 자기들의 열망에 관해서는 말하도록 허락받습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유출’은 근원에서 나옴을 가리키지만, 바로 이어지는 문장은 이것이 분리나 폐기와 같은 방식이 아니라고 밝힙니다.
    reason: 한국어에서 ‘유출’이 근원과 결과의 완전한 분리를 암시할 수 있어 문맥상의 제한을 밝혔습니다.
  - marker: b
    text: ‘아이온’은 문맥에 따라 ‘시대’를 뜻하기도 하지만, 여기서는 의지하고 영광을 드리는 초월적 실재들을 가리키는 기술적 명칭으로 보입니다.
    reason: 앞 문단의 ‘시대’와 인격적으로 묘사되는 aeons를 구별했습니다.
  - marker: c
    text: ‘충만’은 이 문헌에서 전체성 또는 충만한 초월 영역을 나타내는 기술적 표현입니다. 이 대목에는 복수형도 나타납니다.
    reason: Fullness의 전문적 용법과 단수·복수의 차이를 독자에게 알렸습니다.
lexical_decisions:
- source_word: emanation
  choice: 유출
  rationale: 근원에서 흘러나오되 분리되거나 버려진 것이 아니라는 문맥의 형이상학적 긴장을 보존하는 통용 학술어를 택했습니다.
- source_word: Totalities / entire Totality
  choice: 전체들 / 전체 총체
  rationale: 복수형과 집합적 단수형의 차이를 평준화하지 않고 드러냈습니다.
- source_word: aeons
  choice: 아이온들
  rationale: 문맥상 단순한 ‘시대들’보다 인격적·초월적 실재들을 가리키므로 음역하되, 앞 문단의 일반적인 age는 ‘시대’로 구별했습니다.
- source_word: Fullness(es)
  choice: 충만(들)
  rationale: 이 문헌의 기술적 용어 성격을 유지하면서 한국어 독자가 뜻을 짐작할 수 있는 직역어를 사용했습니다.
- source_word: grasp / incomprehensibility
  choice: 파악하다 / 파악할 수 없음
  rationale: 지적 이해와 도달·포착의 의미가 겹치는 표현을 일관되게 유지했습니다.
- source_word: begets himself / brought themselves forth
  choice: 자신을 낳습니다 / 자신들을 산출했습니다
  rationale: 반사적 표현의 난해함을 해소하지 않고 보존하되, 문맥에 따라 생명적 비유와 산출 개념을 구별했습니다.
theological_decisions:
- issue: 아버지에게서 생겨난 이들이 ‘그가 된다’는 진술
  choice: ‘그에게서 생겨난 [이들]도 그가 될 수 있게’로 직접 보존
  alternative: ‘그와 하나가 될 수 있게’로 완화
  rationale: 원문 증언의 강한 동일성 언어를 교리적으로 완화하거나 특정 신학 체계에 맞추지 않았습니다.
- issue: 유출과 분리의 관계
  choice: 유출을 사용하되 ‘분리되는 방식’이 아니라고 명시
  alternative: 창조 또는 분리로 의역
  rationale: 본문이 의도적으로 설정하는 비분리적 산출의 긴장을 유지했습니다.
- issue: 아이온들의 자유 의지와 자기 산출
  choice: 두 요소를 모두 명시적으로 보존
  alternative: 상위 존재가 아이온들을 창조한 것으로 정리
  rationale: 난해하더라도 본문의 행위 주체와 자유 의지 진술을 다른 창조론으로 대체하지 않았습니다.
- issue: 아버지를 파악할 수 없음과 파악하려는 열망
  choice: 침묵의 대상과 말하도록 허락된 열망을 대조하여 번역
  alternative: 아버지에 대한 모든 발화를 금지하는 것으로 단순화
  rationale: 초월성과 인식 욕구가 함께 놓이는 본문의 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 난해한 형이상학적 문장은 의미 관계를 드러내도록 다듬되, 반복·반사적 산출·대명사 지시의 모호성은 임의로 해소하지 않았습니다. 대괄호, 빈 대괄호 [], 꺾쇠괄호 < >는 제공된 영어 증언의 본문 상태 표지를 그대로 보존했습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로, 이 초안은 제공된 공개 영역 영어 증언에 근거한 잠정 번역입니다.
