  revised_text: '밖에 자리한 기억의 존재들은 낮은 이들로서, 충만의 표상을 간직하고 있습니다. 특히 그들을 꾸며 주는 이름들을 서로 함께 나누어 가지기 때문입니다. 돌이킴은 기억의 존재들을 향한 낮아짐을 낳으며, 그들을 향한 낮아짐은 또한 심판의 법, 곧 정죄와 분노입니다.


    그들을 향한 낮아짐은 또한 그들 아래로 떨어지는 자들을 떼어 놓아 멀리 보내는 힘입니다. 이 힘은 그들이 […] 기억의 존재들과 돌이킴 위로 [퍼져 나가지] 못하게 합니다.[a] 이 힘에는 두려움과 혼란과 망각과 당혹과 무지, 그리고 닮은 것이 생겨나는 방식으로 상상을 통해 생겨난 것들이 포함됩니다. 더욱이 실제로는 낮은 이것들에게 높은 이름들이 주어집니다. 교만과 지배욕과 불순종과 거짓을 통해 그것들에서 생겨난 자들에게는 <지식이 없습니다>.[b]


    그분은 그들 하나하나에게 이름을 주셨습니다. 두 질서가 이름 안에 존립하기 때문입니다. 기억과 표상에 속한 자들은 “오른편의 자들”, “혼적인 자들”, “불의 자들”, “가운데의 자들”이라고 불립니다. 교만한 생각과 닮은 것에 속한 자들은 “왼편의 자들”, “물질적인 자들”, “어둠의 자들”, “마지막 자들”이라고 불립니다.[c]


    말씀이 각각을 제 질서에 세우신 뒤, 곧 형상들과 표상들과 닮은 것들을 세우신 뒤에, 형상들의 아이온을 그것과 맞서 싸우는 모든 자에게서 순수하게 지키셨습니다. 그곳은 기쁨의 장소이기 때문입니다.[d] 그러나 기억에 속한 자들에게는 자신에게서 벗겨 내신 그 생각을 드러내셨습니다. 그들을 물질적 결합으로 옮겨 그들에게 질서 체계와 거처를 마련해 주고자 하셨습니다. 그리하여 그들 안에도 악의 유혹을 약하게 만들려는 갈망이 생겨나게 하려는 것이었습니다. 이는 그들이 주변의 영광을 지나치게 즐기며 계속 유배된 채로 있기를 그치고, 도리어 자신들이 겪는 허약함을 깨닫게 하려는 것이었습니다. […] 이와 같이 그들은 자신들의 이 연약함을 고쳐 주실 수 있는 분을 향한 사랑과 끊임없는 찾음을 낳을 수 있었습니다. 그들이 형태를 갖게 하시려고, 그분은 닮은 것에 속한 자들 위에 아름다움의 말씀을 두셨고, 심판의 법도 그들 위에 두셨습니다. 또 뿌리들이 지배욕 [가운데서] 낳은 권세들을 그들 위에 두셨습니다. 말씀은 그들이 구원의 계획에 유용하기 때문에 그들을 기뻐하셨고, 그래서 이들을 택하여 그들 위에 통치자로 세우셨습니다. 이는 아름다운 말씀의 도움이나 [법]의 위협이나 지배욕의 영향력으로 그 질서가 그것을 악으로 끌어내리려는 자들에게서 보호받게 하려는 것이었습니다.


    말씀은 두 질서가 함께 지닌 지배욕을 알고 계십니다. 그분은 이들과 다른 모든 이에게 호의로 그들의 바람을 허락하시고, 각자에게 명령하기에 알맞은 지위를 주셨습니다. 그리하여 각자는 한 장소와 활동을 다스리되, 더 높은 질서에 속한 자들에게 복종하면서 낮은 장소들의 활동을 지휘하고, 자기 존재 방식에 따라 권세를 행사하게 되었습니다. 그 결과 천사들 […]과 대천사들 가운데에는 다스리고 복종하는 지위에 지도자들과 아랫사람들이 있으며, 그 활동들은 다양하고 종류도 서로 다릅니다.


    각 통치자는 자기 종족과 특권과 함께, 제비로 배정받아 누릴 권리를 얻은 것을 누립니다. 각자는 나타난 방식에 맞게 자기 자리에 서서 구원의 계획을 맡았습니다. 하늘 끝에서 [땅] 끝까지, [땅]의 모든 지역과 땅 아래에 있는 자들에 이르기까지, 그들을 다스리는 왕권이 없는 곳은 하나도 없습니다.[e] 왕들이 있고 주들이 있으며, 명령을 받는 자들도 있습니다. 어떤 이들은 형벌을 감독하고, 어떤 이들은 정의를 감독하며, 또 어떤 이들은 안식과 치유를 베풀고, 어떤 이들은 가르침을 맡으며, 어떤 이들은 지켜봅니다.'
