base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: ko
  text: '밖에 자리한 기억의 존재들은 낮은 이들로서, 충만의 표상을 간직하고 있습니다. 특히 그들을 꾸며 주는 이름들에 서로 함께 참여하기 때문입니다. 돌이킴은 기억의 존재들을 향한 낮아짐을 낳으며, 그들을 향한 낮아짐은 또한 심판의 법, 곧 정죄와 분노입니다.


    그들을 향한 낮아짐은 또한 그들 아래로 떨어지는 자들을 떼어 놓아 멀리 보내는 힘입니다. 이 힘은 그들이 […] 기억의 존재들과 돌이킴 위로 [퍼져 나가지] 못하게 합니다.[a] 이 힘에는 두려움과 혼란과 망각과 당혹과 무지, 그리고 닮은 것이 생겨나는 방식으로 상상을 통해 생겨난 것들이 포함됩니다. 더욱이 실제로는 낮은 이것들에게 높은 이름들이 주어집니다. 교만과 지배욕과 불순종과 거짓을 통해 그것들에서 생겨난 자들에게는 <지식이 없습니다>.[b]


    그분은 그들 하나하나에게 이름을 주셨습니다. 두 질서가 이름 안에 존립하기 때문입니다. 기억과 표상에 속한 자들은 “오른편의 자들”, “혼적인 자들”, “불의 자들”, “가운데의 자들”이라고 불립니다. 교만한 생각과 닮은 것에 속한 자들은 “왼편의 자들”, “물질적인 자들”, “어둠의 자들”, “마지막 자들”이라고 불립니다.[c]


    말씀이 각각을 제 질서에 세우신 뒤, 곧 형상들과 표상들과 닮은 것들을 세우신 뒤에, 형상들의 아이온을 그것과 맞서 싸우는 모든 자에게서 순수하게 지키셨습니다. 그곳은 기쁨의 장소이기 때문입니다.[d] 그러나 기억에 속한 자들에게는 자신에게서 벗겨 내신 그 생각을 드러내셨습니다. 그들을 물질적 결합으로 옮겨 그들에게 질서 체계와 거처를 마련해 주고자 하셨습니다. 그리하여 그들 안에도 악의 유혹을 약하게 만들려는 갈망이 생겨나게 하려는 것이었습니다. 이는 그들이 주변의 영광을 지나치게 즐기며 계속 유배된 채로 있기를 그치고, 도리어 자신들이 겪는 허약함을 깨닫게 하려는 것이었습니다. […] 이와 같이 그들은 자신들의 이 연약함을 고쳐 주실 수 있는 분을 향한 사랑과 끊임없는 찾음을 낳을 수 있었습니다. 그들이 형태를 갖게 하시려고, 그분은 닮은 것에 속한 자들 위에 아름다움의 말씀을 두셨고, 심판의 법도 그들 위에 두셨습니다. 또 뿌리들이 지배욕 [가운데서] 낳은 권세들을 그들 위에 두셨습니다. 말씀은 그들이 구원의 계획에 유용하기 때문에 그들을 기뻐하셨고, 그래서 그들을 택하여 그들 위의 통치자들이 되게 하셨습니다. 이는 아름다운 말씀의 도움이나 [법]의 위협이나 지배욕의 영향력으로 그 질서가 그것을 악으로 끌어내리려는 자들에게서 보호받게 하려는 것이었습니다.


    말씀은 두 질서가 함께 지닌 지배욕을 알고 계십니다. 그분은 이들과 다른 모든 이에게 호의로 그들의 바람을 허락하시고, 각자에게 명령하기에 알맞은 지위를 주셨습니다. 그리하여 각자는 한 장소와 활동을 다스리되, 더 높은 질서에 속한 자들에게 복종하면서 낮은 장소들의 활동을 지휘하고, 자기 존재 방식에 따라 권세를 행사하게 되었습니다. 그 결과 천사들 […]과 대천사들 가운데에는 다스리고 복종하는 지위에 지도자들과 아랫사람들이 있으며, 그 활동들은 다양하고 종류도 서로 다릅니다.


    각 통치자는 자기 종족과 특권과 함께, 제비로 배정받아 누릴 권리를 얻은 것을 누립니다. 각자는 자신들이 나타난 방식에 맞게 자기 자리에 서서 구원의 계획을 맡았습니다. 하늘 끝에서 [땅] 끝까지, [땅]의 모든 지역과 땅 아래에 있는 자들에 이르기까지, 그들을 다스리는 왕권이 없는 곳은 하나도 없습니다.[e] 왕들이 있고 주들이 있으며, 명령을 받는 자들도 있습니다. 어떤 이들은 형벌을 감독하고, 어떤 이들은 정의를 감독하며, 또 어떤 이들은 안식과 치유를 베풀고, 어떤 이들은 가르침을 맡으며, 어떤 이들은 지켜봅니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호와 줄임표는 사본의 손상 또는 판독 공백을 나타냅니다. ‘퍼져 나가지’는 증언에서 보충된 말입니다.
    reason: 본문의 물리적 결손과 편집자 보충을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 꺾쇠괄호 안의 ‘지식이 없습니다’는 훼손되거나 생략된 본문을 문맥에 따라 복원한 표현입니다.
    reason: 복원된 문구를 확정된 원문처럼 보이지 않게 하기 위해서입니다.
  - marker: c
    text: ‘혼적인 자들’과 ‘물질적인 자들’은 이 문헌에서 서로 다른 존재 질서를 가리키는 전문적 명칭입니다.
    reason: 현대 일상어의 심리적·물리적 의미로만 오해되는 것을 줄이기 위해서입니다.
  - marker: d
    text: ‘아이온’은 문맥에 따라 시대, 영속적 영역, 또는 초월적 존재 질서를 가리킬 수 있는 고대 우주론의 용어입니다.
    reason: 의미가 하나로 확정되지 않는 전문어의 다의성을 보존하기 위해서입니다.
  - marker: e
    text: 이 문장의 대명사 관계와 통사는 불확실합니다. 여기서는 하늘과 땅과 지하의 모든 영역에 통치 체계가 있다는 뜻으로 옮겼습니다.
    reason: 손상된 증언에서 생기는 실제 통사적·지시적 모호성을 밝히기 위해서입니다.
lexical_decisions:
- source_word: Fullness
  choice: 충만
  rationale: 이 문헌의 우주론적 전문어가 지닌 총체성과 충일성을 보존하면서도 한국어로 이해 가능한 표현입니다.
- source_word: representation
  choice: 표상
  rationale: image 및 likeness와 구별되는 관념적 재현의 뜻을 유지하기 위해 ‘표상’으로 옮겼습니다.
- source_word: image / likeness
  choice: 형상 / 닮은 것
  rationale: 서로 다른 범주를 동일한 말로 평준화하지 않고 원문 증언의 구별을 유지했습니다.
- source_word: conversion
  choice: 돌이킴
  rationale: 회심이라는 교단적·종교적 함의를 과도하게 덧붙이지 않으면서 방향 전환의 뜻을 살렸습니다.
- source_word: humility / humble
  choice: 낮아짐 / 낮은 이들
  rationale: 문맥상 덕목인 겸손만을 뜻한다고 단정하기 어려워, 지위의 낮음과 낮추어짐을 함께 담는 표현을 택했습니다.
- source_word: Soulish
  choice: 혼적인 자들
  rationale: ‘영적’이나 단순히 ‘정신적’으로 바꾸지 않고 고대 인간론적 범주의 전문성을 보존했습니다.
- source_word: Word
  choice: 말씀
  rationale: 인격적 행위 주체이자 로고스적 명칭이라는 문맥을 살리기 위해 존칭 호응과 함께 사용했습니다.
- source_word: aeon
  choice: 아이온
  rationale: 시대와 초월적 영역·존재 질서 사이의 전문적 다의성을 ‘영겁’이나 ‘시대’로 단정하지 않고 음역했습니다.
- source_word: archons
  choice: 통치자들
  rationale: 낯선 음역어보다 기본 의미를 전달하되, 우주론적 통치 계층이라는 문맥을 유지했습니다.
- source_word: plan of salvation
  choice: 구원의 계획
  rationale: 증언의 구원론적 표현을 보존하되 특정 교파의 구원 체계로 확장하지 않았습니다.
theological_decisions:
- issue: ‘humility toward them’의 의미
  choice: 그들을 향한 낮아짐
  alternative: 그들에 대한 겸손
  rationale: 이 표현이 정죄·분노 및 분리시키는 힘과 연결되므로 윤리적 미덕으로만 해석하지 않고 공간적·위계적 낮춤의 긴장을 보존했습니다.
- issue: 두 질서의 가치 평가
  choice: 문헌의 명칭과 위계를 그대로 병렬 제시
  alternative: 선한 질서와 악한 질서로 명시
  rationale: 본문은 대비를 분명히 하지만 각 질서를 단순한 이원론적 선악으로 직접 규정하지 않으므로 해석을 덧붙이지 않았습니다.
- issue: 말씀이 지배욕의 권세들을 세운 목적
  choice: 구원의 계획에 유용한 통치 수단으로 표현
  alternative: 그 권세들을 본질적으로 선한 존재로 규정
  rationale: 본문에 있는 도구적 유용성과 도덕적 긴장을 함께 남기고 그들의 본성을 선하다고 확정하지 않았습니다.
- issue: ‘none lacks kingship over them’의 모호한 통사
  choice: 어느 영역에도 그들을 다스리는 왕권이 없지 않다는 영역 중심의 번역
  alternative: 그들 가운데 누구도 왕권이 없지 않다
  rationale: 영어 증언의 대명사 지시와 통사가 불확실하므로 문맥상 우주 전역의 통치 구조를 나타내되 개별 존재 모두가 왕이라는 단정은 피했습니다.
