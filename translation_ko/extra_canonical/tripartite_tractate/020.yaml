translation:
  language: ko
  text: '모든 아르콘 위에 그는 아무에게도 명령받지 않는 한 아르콘을 세웠습니다. 그는 그들 모두의 주입니다. 곧, 로고스가 만유의 아버지를 나타내는 형상이 되도록 자신의 생각으로 산출한 얼굴입니다. 그러므로 그는 그분을 닮은 온갖 <이름>으로 아름답게 꾸며졌습니다. 그가 모든 특성과 영광스러운 속성을 지니고 있기 때문입니다. 따라서 그는 “아버지”, “하나님”, “데미우르고스”[a], “왕”, “재판관”, “장소”, “거처”, “법”이라고까지 불립니다. 로고스는 아래에 있는 것들의 일을 질서 있게 세우기 위해 그를 손처럼 사용하고, 예언될 것을 말하게 하려고 그를 입처럼 사용합니다. 그는 말하고 질서를 세웠습니다. 그리고 (자신의 작품들이) 위대하고 선하며 놀랍다는 것을 보았을 때 기뻐하고 즐거워했습니다. 마치 [] 자기 생각으로 자신이 그것들을 말하고 행한 것처럼 여겼으나, 자기 안에서 일어난 움직임이, 그가 무엇을 원하든 예정된 방식으로 행하게끔 그를 움직이는 영에게서 비롯되었다는 사실은 알지 못했습니다.


    그에게서 생겨난 것들에 관하여 그가 말하자, 그것들은 앞서 형상들을 다루면서 언급한 영적 장소들을 닮은 모습으로 생겨났습니다. 그는 단지 일만 <한> 것이 아닙니다. 자신의 구원 계획의 아버지로 임명된 그는 자기 자신과 씨앗들을 통해서만 낳은 것이 아니라, 아래 장소들로 [그를 통하여] 내려올 선택받은 영을 [통해서도] 낳았습니다. 그는 자기 자신의 영적인 말들만 말하는 데서 [그치지] 않고, 자기 본성을 뛰어넘는 것들을 외치며 낳는 영을 통하여 은밀한 방식으로 <말합니다>. 그는 자기 본성에 따라 하나님이며 아버지이고 그 밖의 모든 존귀한 칭호를 지녔으므로, 그 칭호들이 자기 본성에 속한다고 여겼습니다.


    그는 자신에게 순종하는 이들을 위해 안식을 마련했고, 자신에게 불순종하는 이들에게는 <형벌도 제정했습니다>. 낙원과 왕국이 그와 함께 거하며, 그보다 먼저 존재한 아이온[b]에 거하는 그 밖의 모든 것도 그러합니다. 그것들은 생각과 맺는 관계 때문에 모사본들보다 더 가치가 있습니다. (이 관계)는 말하자면 [] 그림자와 옷에 견줄 만합니다. 그는 존재하는 것이 실제로 어떻게 존재하는지를 볼 수 없기 때문입니다.


    그는 자신이 행할 일과 말할 일을 돕도록 일꾼들과 종들을 세웠습니다. 그가 일하는 곳마다 아름다운 이름을 지닌 자기 얼굴을 남기며, 자신이 생각하는 것은 무엇이든 만들어 내고 선포했기 때문입니다. 그는 자기 본질로부터 자기 자리에 빛의 보이는 형상들과 [보이지 않는] 영적 [장소들]을 세웠습니다. 이와 같이 모든 곳이 그로 말미암아 아름답게 꾸며져, 그것들을 배치한 이의 형상을 비추었고, 그렇게 그것들이 세워졌습니다. 낙원들과 왕국들과 안식들과 약속들과 그의 뜻을 수행하는 수많은 종이 통치하는 주들이지만, 그것들은 자신들을 임명한 주 아래에 놓여 있습니다.


    그는 이런 식으로 그의 말을 들은 뒤, 체계의 근원을 <이루는> 빛들을 아래 것들의 질서 위에 두었습니다. 보이지 않는 영이 그를 이처럼 움직여, 그가 [] 자기 종을 통하여 다스리려는 마음을 품게 했습니다. 그는 그 종을 손으로, <입>으로, 심지어 자기 얼굴로도 사용했습니다. 그는 규율과 위협과 두려움을 만들어 냈습니다. 이는 무지에서 행동하던 자들이 […] [자신들에게 지키도록 주어진] 자리를 유지하게 하려는 것이었습니다. 그들 위에 있는 아르콘들의 [사슬에] 매여 자기 자리에 붙들려 있기 때문입니다.


    물질의 전체 본성은 세 부류로 [나뉩니다]. 영적인 로고스는 상상과 교만에서 [첫째] 권세들을 산출하고, 영적 서열에 따라 그들을 첫째 자리에 두었습니다. 이 권세들이 지배욕으로 산출한 것들은 중간 (서열)에 두었습니다. 그들이 [그 결과] 지배욕을 품은 권세들이 <되었기> 때문이며, 그 아래 세워진 것들을 다스리고 힘으로 강제 명령을 내리게 하려는 것이었습니다. 시기와 질투에서 생겨난 것들과 그러한 성향에서 나온 그 밖의 모든 소산은 노예의 서열에 두어 가장 바깥 경계를 통제하고, 존재하는 모든 것과 모든 생성을 지휘하게 했습니다. 갑자기 죽이는 질병의 (존재)들이 이들에게서 나오며, 그들은 자신들이 생겨난 곳이자 다시 돌아갈 곳에서는 아무것도 아니었으면서도 낳기를 열망합니다. 그러므로 그는 그들 위에 권위를 지닌 권세들을 세워 물질에 끊임없이 작용하게 했습니다. 그리하여 [] 존재하는 자들의 소산도 마찬가지로 끊임없이 존재하게 하려는 것이었습니다. 이것이 그들의 영광이기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데미우르고스’는 그리스어에서 본래 ‘장인, 제작자’를 뜻하며, 이 작품에서는 아래 세계의 질서를 세우는 조물자를 가리킵니다.
    reason: 독자에게 낯선 핵심 우주론 용어를 설명하되 ‘창조주’로 단정하지 않기 위해서입니다.
  - marker: b
    text: ‘아이온’은 문맥에 따라 ‘시대’ 또는 초월적인 영적 영역을 가리킬 수 있는 용어입니다.
    reason: 한국어 음역만으로 전달되지 않는 의미 범위와 진정한 모호성을 알리기 위해서입니다.
lexical_decisions:
- source_word: archon
  choice: 아르콘
  rationale: 작품 고유의 우주론적 통치 존재를 일반적인 ‘통치자’와 구별하기 위해 음역했습니다.
- source_word: Word / Logos
  choice: 로고스
  rationale: 단순한 발화나 단어가 아니라 인격화된 우주론적 원리를 가리키므로 ‘말씀’으로 교단적 함의를 더하지 않고 음역했습니다.
- source_word: Demiurge
  choice: 데미우르고스
  rationale: 본문의 특수한 조물자 개념을 보존하고 ‘창조주’와 무비판적으로 동일시하지 않도록 음역했습니다.
- source_word: Father of the Totalities
  choice: 만유의 아버지
  rationale: Totalities의 포괄적 우주론 의미를 자연스러운 한국어로 나타냈습니다.
- source_word: repose
  choice: 안식
  rationale: 단순 휴식 이상의 구원론적·공간적 의미를 유지하는 익숙하고 품위 있는 표현입니다.
- source_word: aeon
  choice: 아이온
  rationale: 시대와 초월적 영역 양쪽의 가능성을 지닌 전문 용어이므로 해석을 고정하지 않고 음역했습니다.
- source_word: powers
  choice: 권세들
  rationale: 비인격적 능력과 인격적 우주 세력의 긴장을 보존합니다.
- source_word: matter
  choice: 물질
  rationale: 본문의 우주론적 범주를 직접적으로 전달합니다.
theological_decisions:
- issue: 데미우르고스의 자기 인식과 상위 영의 작용
  choice: 그가 자기 행동의 근원이 영이라는 사실을 알지 못했다고 명시
  alternative: 그를 독립적이고 완전히 자율적인 창조주로 표현
  rationale: 본문은 그의 무지와 보이지 않는 영의 예정된 움직임을 함께 진술하므로 그 긴장을 보존했습니다.
- issue: ‘하나님’과 ‘아버지’ 칭호의 지위
  choice: 본문이 그 칭호들을 그에게 부여하면서도 그가 자기 본성에 속한다고 ‘여겼다’는 진술을 유지
  alternative: 칭호를 참되거나 거짓된 것으로 번역 단계에서 판정
  rationale: 텍스트 자체의 거리 두기와 모호성을 해소하지 않았습니다.
- issue: 영의 성별과 지시 대상
  choice: 한국어의 무성 대명 구조를 활용하고 불필요한 성별을 부여하지 않음
  alternative: 영을 남성 또는 여성으로 확정
  rationale: 제공된 증거만으로 성별과 일부 대명사의 지시 대상을 확정하기 어렵습니다.
- issue: ‘predestined manner’의 번역
  choice: ‘예정된 방식으로’
  alternative: ‘운명적으로’ 또는 ‘미리 결정된 섭리로’
