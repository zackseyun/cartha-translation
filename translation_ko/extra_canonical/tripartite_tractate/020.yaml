  revised_text: '모든 아르콘 위에 그는 아무에게도 명령받지 않는 한 아르콘을 세웠습니다. 그는 그들 모두의 주입니다. 곧, 로고스가 만유의 아버지를 나타내는 형상이 되도록 자신의 생각으로 산출한 얼굴입니다. 그러므로 그는 그를 닮은 온갖 <이름>으로 아름답게 꾸며졌습니다. 그가 모든 특성과 영광스러운 속성을 지니고 있기 때문입니다. 따라서 그는 “아버지”, “하나님”, “데미우르고스”[a], “왕”, “재판관”, “장소”, “거처”, “법”이라고까지 불립니다. 로고스는 아래에 있는 것들의 일을 질서 있게 세우기 위해 그를 손처럼 사용하고, 예언될 것을 말하게 하려고 그를 입처럼 사용합니다. 그는 말하고 질서를 세웠습니다. 그리고 (자신의 작품들이) 위대하고 선하며 놀랍다는 것을 보았을 때 기뻐하고 즐거워했습니다. 마치 [] 자기 생각으로 자신이 그것들을 말하고 행한 것처럼 여겼으나, 자기 안에서 일어난 움직임이, 그가 무엇을 원하든 예정된 방식으로 행하게끔 그를 움직이는 영에게서 비롯되었다는 사실은 알지 못했습니다.



    그에게서 생겨난 것들에 관하여 그가 말하자, 그것들은 앞서 형상들을 다루면서 언급한 영적 장소들을 닮은 모습으로 생겨났습니다. 그는 단지 일한 것 이상을 <했습니다>. 자신의 구원 계획의 아버지로 임명된 그는 자기 자신과 씨앗들을 통해서만 낳은 것이 아니라, [그] 선택받은 영을 통해서도 낳았습니다. 그 영은 아래 장소들로 [그를 통하여] 내려올 것입니다. 그는 자기 자신의 영적인 말들만 말하는 것보다 [더] <많이> 합니다. 곧, 자기 본성을 뛰어넘는 것들을 외치며 낳는 영을 통하여 은밀한 방식으로 (그렇게 합니다). 그는 자기 본성에 따라 하나님이며 아버지이고 그 밖의 모든 존귀한 칭호를 지녔으므로, 그 칭호들이 자기 본성에 속한다고 여겼습니다.



    그는 자신에게 순종하는 이들을 위해 안식을 마련했고, 자신에게 불순종하는 이들에게는 <형벌도 제정했습니다>. 낙원과 왕국이 그와 함께 거하며, 그 밖의 모든 것은 그보다 먼저 존재한 아이온[b]에 거합니다. 그것들은 생각과 맺는 관계 때문에 모사본들보다 더 가치가 있습니다. (이 관계)는 말하자면 [] 그림자와 옷에 견줄 만합니다. 그는 존재하는 것이 실제로 어떻게 존재하는지를 볼 수 없기 때문입니다.



    그는 자신이 행할 일과 말할 일을 돕도록 일꾼들과 종들을 세웠습니다. 그가 일하는 곳마다 아름다운 이름을 지닌 자기 얼굴을 남기며, 자신이 생각하는 것은 무엇이든 만들어 내고 선포했기 때문입니다. 그는 자기 본질로부터 자기 자리에 빛의 보이는 형상들과 [그] (보이지 않는) 영적 [장소들]을 세웠습니다. 이와 같이 모든 곳이 그로 말미암아 아름답게 꾸며져, 그것들을 배치한 이의 형상을 비추었고, 그렇게 그것들이 세워졌습니다. 낙원들과 왕국들과 안식들과 약속들과 그의 뜻을 수행하는 수많은 종은 통치하는 주들이지만, 자신들을 임명한 주 아래에 놓여 있습니다.



