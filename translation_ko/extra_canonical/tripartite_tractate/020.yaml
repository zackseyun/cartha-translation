    물질의 전체 본성은 세 부류로 [나뉩니다]. 영적인 로고스는 상상과 교만에서 [첫째] 권세들을 산출하고, 영적 서열에 따라 그들을 첫째 자리에 두었습니다. 이 권세들이 지배욕으로 산출한 것들은 중간 (서열)에 두었습니다. 그들이 [그 결과] 지배욕을 품은 권세들이 <되었기> 때문이며, 그 아래 세워진 것들을 다스리고 힘으로 강제 명령을 내리게 하려는 것이었습니다. 시기와 질투에서 생겨난 것들과 그러한 성향에서 나온 그 밖의 모든 소산은 노예의 서열에 두어 가장 바깥 경계를 통제하고, 존재하는 모든 것과 모든 생성을 지휘하게 했습니다. 갑자기 죽이는 질병의 (존재)들이 이들에게서 나오며, 그들은 자신들이 생겨난 곳이자 다시 돌아갈 곳에서는 아무것도 아니었으면서도 낳기를 열망합니다. 그러므로 그는 그들 위에 권위를 지닌 권세들을 세워 물질에 끊임없이 작용하게 했습니다. 그리하여 [] 존재하는 자들의 소산도 마찬가지로 끊임없이 존재하게 하려는 것이었습니다. 이것이 그들의 영광이기 때문입니다.'
