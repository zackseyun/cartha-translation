  revised_text: '[] 숭고한 일들을 논할 때에는 전체의 뿌리이신 아버지에게서 시작하는 것이 마땅합니다. 우리는 그분에게서 그분에 관하여 말할 수 있는 선물을 받았습니다. 그분 외에 다른 어떤 것도 생겨나기 전에 그분은 존재하셨습니다.


    수에서 하나라고 하듯이, 아버지는 한 분이십니다. 그분이 처음이시며 홀로 계시기 때문입니다. 그러나 그분은 단지 하나인 어떤 존재와 같지는 않습니다. 만일 그러하다면 어떻게 아버지일 수 있겠습니까? 아버지가 있으면 언제나 “아들”이라는 이름이 뒤따르기 때문입니다. 그러나 홀로 아버지이신 한 분은 가지와 열매가 달린 나무의 뿌리와 같습니다. 엄밀히 말하면 그분을 아버지라 하는데, 그분은 비길 데 없고 변하지 않으시기 때문입니다. 바로 이 때문에 엄밀히 말하면 그분은 한 분이시며 신이십니다. 아무도 그분과 신으로서 관계를 맺지 않으니, 그분에게는 아버지가 없기 때문입니다. 그분은 나지 않으신 분이어서, 다른 누구도 그분을 낳지 않았고 다른 누구도 그분을 창조하지 않았습니다. 누구든 다른 이의 아버지나 창조자인 이에게도 아버지와 창조자가 있습니다. 물론 그러한 이는 자기에게서 생겨난 이와 자기가 창조한 이의 아버지와 창조자가 될 수 있습니다. 그러나 엄밀히 말하면 그는 아버지도 아니고 신도 아닙니다. 그를 [] [낳고] 창조한 누군가가 있었기 때문입니다. 그러므로 아무에게도 나지 않으신 그분만이 엄밀히 말해 아버지요 하나님이십니다.[a] 모든 것들에 관해서는, 그분이 그것들을 낳고 창조하신 분입니다.


    그분에게는 시작도 끝도 없습니다. 그러나 그분은 단지 끝이 없기만 한 것이 아닙니다. 그분은 나지 않으셨으므로 죽지 않으십니다. 또한 영원한 존재와 자기 동일성, 그분을 확립한 것과 그분을 위대하게 하는 것에서도 변하지 않으십니다. 그분은 자신을 존재하게 하는 것에서 결코 분리되지 않으실 것이며, 아무도 그분이 뜻한 적 없는 의도를 내놓도록 강요하지 못할 것입니다. 아무도 아버지의 존재를 생겨나게 하지 않았으므로 그분은 변하지 않으십니다. 아무도 그분을, 그분이 그 안에서 존재하시는 고유한 존재와 자기 동일성에서 떼어 놓을 수 없고, 그분의 위대함에서도 떼어 놓을 수 없습니다. 그러므로 아무도 그분을 이해할 수 없습니다. 누구도 그분의 형상을 다른 것으로 바꾸거나, 그분을 낮추거나, 변화시키거나, 줄일 수 없습니다. <이렇게> 그분은 진리의 충만함 가운데 변하지도 달라지지도 않는 분이시며, 불변성을 옷으로 삼으셨습니다. 그분은 단지 “시작이 없는 분”과 “끝이 없는 분”이라 불리기만 하는 것이 아닙니다. 그분은 태어나지도 않으셨고 죽지도 않으실 것입니다. 그러므로 그분이 존재하시는 방식에서 시작도 끝도 없으신 것처럼, [] 그분의 위대함에도 다다를 수 없습니다. 그분의 지혜는 이해할 수 없고, 그분의 능력은 헤아릴 수 없으며, 그분의 감미로움은 알 수 없습니다.[b]


    엄밀히 말하면 선하신 분, 곧 나지 않으신 아버지이시며 온전히 완전하신 그분만이 자신의 자손과 모든 덕과 가치 있는 모든 것으로 충만하십니다. 그분은 그보다 더한 것도 지니시니, 모든 악의가 전혀 없으십니다. 그러므로 무엇이든 가진 모든 이는 그것을 그분께 빚지고 있음을 알 수 있습니다. 그분이 그것을 베푸시기 때문입니다. 그분은 다다를 수 없는 분이시면서도 베푸는 데 지치지 않으시고, 주시는 선물이 풍성하시며, 아낌없이 베푸시는 은총 안에서 쉬십니다.


    그분의 부류와 형상과 크나큰 규모는 이러하여, 처음부터 그분과 함께 있었던 것은 아무것도 없습니다. 그분이 거하시는 곳도, 그분이 나오시는 곳도, 그분이 들어가시는 곳도 없습니다. 그분이 일하실 때 본으로 삼는 원초적 형상도 없습니다. 그분이 무엇을 하시든 어려움이 따르지 않으며, 그분이 창조하시는 것을 창조할 때 사용할 수 있는 어떤 질료도 없습니다. 그분 안에 내재하여 그분이 낳으시는 것을 낳는 데 쓰시는 어떤 실체도 없고, 그분의 일에 동행하는 협력자도 없습니다. 이와 같은 것을 주장하는 것은 무지입니다. 오히려 그분은 선하시고, 흠이 없고, 완전하며, [] 온전하시다고 주장해야 합니다. 그분이 전체이시기 때문입니다.[c]


    생각되거나 말해지거나 보이거나 이해되는 그 어떤 이름도 그분에게 적용되지 않습니다. 그 이름들이 아무리 지극히 장엄하고 그분을 영화롭게 하며 경외를 나타낸다 해도 그렇습니다. 그러나 그분을 영화롭게 하는 이들의 역량에 따라, 그분께 영광과 존귀를 돌리려고 그러한 이름들을 말할 수는 있습니다. 그분의 실존과 존재와 형상에 내재한 것에 관해서는, 정신으로 그분을 생각할 수 없고 말로 그분을 표현할 수 없으며 눈으로 그분을 볼 수 없고 누구도 그분을 이해할 수 없습니다. 이는 헤아릴 수 없는 그분의 위대함과 붙잡을 수 없는 깊이와 끝없는 높이와 한계 없는 <펼쳐짐> 때문입니다.[d]


    나지 않은 것의 성격은 이러합니다. 그것은 제한된 것이 하듯이 다른 어떤 것에까지 뻗거나 그것과 결합하지 않습니다. 오히려 그분은 얼굴이나 형상을 지니지 않은 채 고유한 성격을 지니십니다. 얼굴과 형상은 지각으로 파악되는 것들입니다. 그러므로 그분은 이해할 수 없는 분이십니다.'
