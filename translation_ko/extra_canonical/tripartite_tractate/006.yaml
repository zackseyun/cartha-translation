base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: ko
  text: '<…>[a] 침묵들의 놀라운 행위가 영원한 생성이며 지성에서 난 자손인 것처럼, 말씀의 속성들도 영적인 유출입니다. 이것들은 말에 속하므로, [본문 결락][b] 놀라운 행위와 속성은 모두 그의 자손의 씨앗이자 생각이며, 스스로 생겨난 자손으로 나타나는 살아 있고 영원한 뿌리입니다. 이들은 아버지의 영광을 위하여 정신들과 영적인 자손들로 존재합니다.


    이들은 영들과 정신들이므로 소리와 말이 필요하지 않으며, 자신들이 이루어지기를 바라는 것을 얻기 위해 어떤 [행위]를 할 필요도 없습니다. 오히려 [아버지] 자신의 존재 방식을 본받아, 그에게서 비롯된 [이들]은 자신들이 바라는 것은 무엇이든 낳습니다. 그리고 그에게는 자녀가 있는데[c], 그 자녀는 이들이 생각하는 이, 이들이 말하는 이, 이들이 향하여 나아가는 이, 이들이 그 안에 존립하는 이, 또 이들이 그에게 찬송을 불러 영광을 돌리는 이입니다. 이것이 그들의 생식 능력이기 때문입니다. 이 능력은 그들이 비롯된 이들을 닮았고, 서로 함께 돕는 일과도 조화를 이룹니다. 이들은 태어나지 않은 이들이 그러하듯 서로 돕기 때문입니다.


    아버지는 모든 총체 위에 있는 자신의 드높은 자리에 따라 알려질 수도 붙잡힐 수도 없는 분입니다. 그분의 위대함과 규모는 너무나 커서, 그것이 갑자기 즉시 드러난다면 그에게서 비롯된 영겁들 가운데 높은 존재들을 모두 파멸시킬 것입니다. 그러므로 그분은 자신의 힘과, 자신의 [본문 결락] 존재를 이루는 무한한 자원을 억제하셨으며[d], 어떤 말로도 표현할 수 없고 어떤 이름으로도 부를 수 없는 채 모든 정신과 모든 말을 초월해 계셨습니다.


    그러나 바로 이분이 자신을 펼치셨고, 그분이 펼치신 것은 우주의 토대와 자리와 거처를 이루었습니다. 그분의 이름 가운데 하나는 ‘그로 말미암는 이’입니다. 그분이 모든 것의 아버지이시기 때문입니다. 그분은 존재하는 이들을 위하여 수고하심으로써, 그들 안에 자신을 찾으려는 생각을 심으셨습니다. 그들의 […]이 지닌 풍요는[e] 그분이 존재하신다는 것을 깨닫고, 존재해 온 것이 무엇인지 탐구하는 데 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 본문은 이 대목 앞이 결락된 채 시작됩니다.
    reason: 첫머리의 <…>가 나타내는 단편성을 독자에게 알립니다.
  - marker: b
    text: 이 자리에는 판독할 수 없는 본문이 있습니다.
    reason: 영어 증언문의 빈 대괄호가 표시하는 결락을 보존합니다.
  - marker: c
    text: ‘자녀’에 해당하는 형태의 단수와 복수 여부가 불확실합니다.
    reason: 증언문의 child<ren>이라는 편집상 불확실성을 반영합니다.
  - marker: d
    text: ‘자신의’와 ‘존재’ 사이의 본문 일부가 결락되어 정확한 수식 관계가 불확실합니다.
    reason: 무한한 자원이 무엇을 이루는지에 관한 문법적·본문적 불확실성을 보존합니다.
  - marker: e
    text: ‘그들의’ 뒤에 이어지던 말이 결락되어 무엇의 풍요를 뜻하는지 알 수 없습니다.
    reason: 마지막 문장의 소유·수식 관계를 추정으로 메우지 않습니다.
lexical_decisions:
- source_word: silences
  choice: 침묵들
  rationale: 복수로 의인화된 우주론적 실재일 가능성을 보존하고, 이를 단순한 ‘고요함’으로 풀어 쓰지 않았습니다.
- source_word: Word
  choice: 말씀
  rationale: 인격적·우주론적 함의를 지닌 용어로 읽힐 여지를 살리면서도 한국어 종교 문헌에서 익숙하고 품위 있는 표현을 택했습니다.
- source_word: emanations
  choice: 유출
  rationale: 근원에서 흘러나오는 우주론적 파생을 나타내되 ‘창조’나 ‘발출’처럼 특정 교리 체계로 의미를 한정하지 않았습니다.
- source_word: minds
  choice: 정신들
  rationale: 복수의 지성적 실재를 가리키는 문맥을 살렸으며, ‘생각’과 구별했습니다.
- source_word: Totalities
  choice: 모든 총체
  rationale: 단순히 ‘만물’로 평준화하지 않고, 복수형 우주론 용어가 지닌 집합적 성격을 보존했습니다.
- source_word: aeons
  choice: 영겁들
  rationale: 시간적 의미와 인격적·우주론적 실재라는 가능성을 함께 열어 두기 위해 음역어보다 뜻을 드러내는 표현을 사용했습니다.
- source_word: subsist
  choice: 존립하다
  rationale: 단순히 ‘살다’보다 존재론적 의존과 지속의 뉘앙스를 보존합니다.
- source_word: the One by Whom
  choice: 그로 말미암는 이
  rationale: 무엇이 그분을 통하여 성립한다는 관계적 칭호를 보존하고, 목적어를 보충해 모호성을 해소하지 않았습니다.
theological_decisions:
- issue: 아버지의 초월성과 자기 억제
  choice: 힘과 무한한 자원을 ‘억제하셨다’고 번역
  alternative: 감추셨다 / 줄이셨다
  rationale: 증언문의 동작성을 살리되, 본체 변화나 능력 상실이라는 교리적 결론을 덧붙이지 않았습니다.
- issue: 자기 발생적 자손
  choice: ‘스스로 생겨난 자손’으로 번역
  alternative: 자생한 존재 / 자존하는 자손
  rationale: 원문의 긴장을 그대로 두고, 창조·출생·비창조 가운데 하나로 신학적으로 확정하지 않았습니다.
- issue: unbegotten의 정체
  choice: ‘태어나지 않은 이들’
  alternative: 비생성자들 / 낳아지지 않은 자들
  rationale: 누구를 가리키는지 특정하지 않고 생성되지 않았다는 핵심 대조만 보존했습니다.
- issue: 영겁들의 존재론적 성격
  choice: ‘영겁들 가운데 높은 존재들’
  alternative: 높은 영겁들 / 아이온들의 고위 존재들
  rationale: 영겁 자체와 그 안의 존재 사이에 있는 영어 증언문의 문법적 긴장을 유지하면서 한국어 문장을 이해 가능하게 만들었습니다.
- issue: 마지막의 ‘존재했던 것’
  choice: ‘존재해 온 것이 무엇인지’
  alternative: 태초에 존재한 것이 무엇인지 / 먼저 있던 분이 누구인지
  rationale: 대상을 사물이나 인격으로 확정하거나 선재 교리를 명시적으로 끌어들이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 우주론적 전문어는 가능한 한 뜻을 드러내되 낯선 개념을 교파적 용어로 환원하지 않았습니다. 대괄호와 말줄임표는 보충·결락 등 편집상의 신호로 유지했습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언문에 근거한 잠정 번역입니다.
