review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언문을 기준으로 볼 때, 초안은 결락·대괄호·child<ren> 및 마지막 말줄임표를 충실히 보존하고 주요 우주론 용어도 대체로 잘 옮겼습니다. 다만 ‘what they wish to [have done]’는 초안에서 ‘자신들이 이루어지기를’로 옮겨져 행위의 대상과 주체 관계가 어색하게 바뀌었으므로 바로잡아야 합니다. 또한 ‘the One by Whom’은 ‘그로 말미암는 이’라고 하면 그분이 다른 이로 말미암아 존재한다는 뜻으로 읽히기 쉬워, ‘그분을 통하여 [만물이 있게 되는] 분’이라는 관계를 드러내는 편이 영어 증언문의 칭호에 더 가깝습니다. 콥트어 원문 직접 대조는 제공된 자료상 보류되어 있습니다.
  naturalness: 현대 격식체는 전반적으로 안정적입니다. 그러나 ‘자신의 드높은 자리에 따라’, ‘서로 함께 돕는 일’, ‘자신들이 이루어지기를 바라는 것을 얻기’는 현대 한국어에서 다소 부자연스럽거나 의미가 흐립니다. 이를 ‘드높은 지위에 걸맞게’, ‘그들이 함께 나누는 도움’, ‘그들이 [이루어지게] 하기를 바라는 것을 얻기’로 정리했습니다.
  terminology: ‘침묵들’, ‘말씀’, ‘영적인 유출’, ‘정신들’, ‘모든 총체’, ‘영겁들’, ‘존립하다’, ‘태어나지 않은 이들’은 증언문의 개념적 긴장을 대체로 유지합니다. ‘intellectual offspring’은 ‘지성에서 난 자손’보다 성격을 나타내는 ‘지성적 자손’이 더 직접적입니다. ‘One by Whom’은 위와 같이 관계 방향이 드러나도록 조정했습니다.
  issues:
  - severity: medium
    issue: ‘자신들이 이루어지기를 바라는 것’의 주체·의미가 영어 증언문의 ‘what they wish to [have done]’와 어긋납니다.
    rationale: 증언문은 그들이 어떤 일이 이루어지기를 바라는 대상을 얻기 위해 행위를 할 필요가 없다는 뜻입니다. 초안 표현은 그들 자신이 이루어지기를 바란다는 뜻으로 읽힙니다.
  - severity: medium
    issue: ‘그로 말미암는 이’는 ‘the One by Whom’의 관계 방향을 반대로 읽히게 할 수 있습니다.
    rationale: 한국어의 ‘X로 말미암는 이’는 통상 X에 의해 성립하는 이를 뜻합니다. 문맥상 이는 만물이 그분을 통하여 성립한다는 칭호이므로, 생략된 목적어를 대괄호로 표시하여 관계를 명확히 했습니다.
  - severity: low
    issue: ‘지성에서 난 자손’은 ‘intellectual offspring’을 출처·출생 관계로 한정합니다.
    rationale: 영어 증언문은 자손의 지성적 성격을 말하므로 ‘지성적 자손’이 더 중립적이고 직접적입니다.
  - severity: low
    issue: 일부 연결 표현이 직역투입니다.
    rationale: ‘드높은 지위에 걸맞게’ 및 ‘그들이 함께 나누는 도움’으로 바꾸어 의미를 유지하면서 문장을 자연스럽게 했습니다.
  revised_text: '<…>[a] 침묵들의 놀라운 행위가 영원한 생성이며 지성적 자손인 것처럼, 말씀의 속성들도 영적인 유출입니다. 이것들이 말에 속하므로, [본문 결락][b] 놀라운 행위와 속성은 모두 그의 자손에 속한 씨앗과 생각이며, 스스로 생겨난 자손으로 나타나는 살아 있고 영원한 뿌리입니다. 이들은 아버지의 영광을 위하여 정신들과 영적인 자손들로 존재합니다.



