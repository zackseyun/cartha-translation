  revised_text: '삼부 논고 — 마지막 아이온의 잘못, 말씀



    아이온들 가운데 하나에게, 붙잡을 수 없는 것을 붙잡아 그것에 영광을 돌리고, 특히 아버지의 말로 표현할 수 없음에 영광을 돌리려는 생각이 일어났습니다. 그는 하나 됨에서 나온 말씀[a]이므로 하나이지만, [그러나] 전체자들의 하나 됨에서 나온 것도 아니고, 그들을 낳으신 분, 곧 전체를 낳으신 아버지에게서 나온 것도 아닙니다. 이 아이온은 지혜를 받은 이들 가운데 하나였습니다. 그들의 생각은 미리 존재했으며, 그들은 그 생각으로 자신들이 뜻한 것을 낳았습니다. 그러므로 그는 감추어진 토대를 살펴볼 타고난 지혜를 받았으니, 그가 지혜의 열매이기 때문입니다. 전체자들과 함께 태어난 자유 의지로 말미암아, 그는 아무에게도 제지받지 않고 자신이 바라는 것을 [] 행했습니다.[b]



