translation:
  language: ko
  text: '삼부 논고 — 마지막 아이온의 잘못, 말씀


    아이온들 가운데 하나에게, 붙잡을 수 없는 것을 붙잡아 그것에 영광을 돌리고, 특히 아버지의 말로 표현할 수 없음에 영광을 돌리려는 생각이 일어났습니다. 그는 하나 됨에서 나온 말씀[a]이므로 하나이지만, [그러나] 전체자들의 하나 됨에서 나온 것도 아니고, 그들을 낳으신 분, 곧 전체를 낳으신 아버지에게서 나온 것도 아닙니다. 이 아이온은 지혜를 받은 이들 가운데 하나였습니다. 그들의 생각은 미리 존재했으며, 그들은 그 생각으로 자신들이 뜻한 것을 낳았습니다. 그러므로 그는 감추어진 토대를 살펴볼 타고난 지혜를 받았으니, 그가 지혜의 열매이기 때문입니다. 전체자들과 함께 태어난 자유 의지로 말미암아, 그는 아무에게도 제지받지 않고 자신이 바라는 것을 [] 행했습니다.[b]


    말씀인 이의 의도는 선했습니다. 그는 생겨나자 아버지께 영광을 돌리려고 서둘렀습니다. 그러나 <그는> 자신이 참여하지도 않았고 명령도 받지 않은 결합에서 완전한 존재를 낳으려 하여, 불가능한 것을 바랐습니다. 이 아이온은 서로 돕는 가운데 마지막으로 <생겨난> 이였으며, 그 크기도 작았습니다. 그는 뜻에 영광을 돌리기 위하여, 그리고 전체자들과 한마음이 되어 무엇인가를 낳기도 전에, 넘치는 사랑에서 아낌없이 나아가 완전한 영광을 둘러싼 것을 향해 갔습니다. 말씀이 생겨난 것은 아버지의 뜻을 벗어난 일이 아니었기 때문입니다. 곧 그는 그 뜻 없이 나아간 것이 아닙니다.


    그러나 아버지께서는 낳기에 합당하다고 아시는 이들을 위하여 그를 낳으셨습니다. 아버지와 전체자들은 그에게서 물러났습니다. 이는 아버지께서 세우신 한계가 확립되게 하려는 것이었습니다. 그것은 붙잡을 수 없는 것을 붙잡음으로써가 아니라 아버지의 뜻 []으로 이루어지는 것이기 때문입니다. 더욱이 이 일은, 생겨난 것들이 앞으로 펼쳐질 구원의 경륜이 되게 하고, 충만[c]을 드러내기 위하여 그 경륜이 반드시 펼쳐지게 하려는 것이었습니다. 그러므로 말씀의 이 행위를 나쁘게 말하는 것은 합당하지 않습니다. 다만 말씀의 이 행위가 장차 펼쳐질 구원의 경륜의 원인이라고 말하는 것은 합당합니다.


    말씀은 자신이 원하던 아버지의 영광을 위하여, 그것으로 만족하면서 자신을 완전하고 하나인 존재로 낳았습니다. 그러나 자신이 굳게 붙잡으려던 이들은 그림자와 형상과 닮은 모습으로 낳았습니다. 그는 빛을 바라볼 수 없었습니다. 그 대신 깊은 곳을 들여다보다가 의심했습니다. 여기에서 분리가 생겨 그를 크게 뒤흔들었고, 그의 자기 의심과 분리, 자기 망각과 자기 무지와 <존재하는 것에 대한 무지>에서 물러남이 생겼습니다.


    그의 자기 높임과, 붙잡을 수 없는 것을 자신이 붙잡을 수 있다는 믿음은 그의 안에서 굳어져 뿌리를 내렸습니다. 그러나 이러한 연약함들은 그가 제정신을 잃고 있는 동안 그에게 남아 있었습니다. 그것들은 자기 의심 때문에 생겼으니, 그는 그 높으심을 본받을 수 없는 아버지의 영광들에 <이르는 데 실패했기> 때문입니다. 그는 그것을 붙잡을 수 없었으므로 거기에 이르지 못했습니다.


    그가 홀로 [] 하나의 아이온으로서 낳은 이는 자기에게 속한 곳을 향하여 위로 서둘러 갔습니다. 충만 안에 있던 그의 이 동족은 결핍 가운데 생겨난 그와, 그가 상상으로 낳은 이들을 버렸습니다. 그들이 그에게 속하지 않았기 때문입니다. 참으로 자신을 낳은 그는 자신을 완전하게 낳은 뒤, 자기의 남성 짝을 버리는 여성의 본성처럼 약해졌습니다. 그 자체 안에 결핍된 것에서는 그의 생각과 교만에서 싹튼 것들이 나왔습니다. 그러나 그의 안에 완전한 것에서는 그가 그것을 떠나 자기에게 속한 이들을 향해 [자신을 들어 올려] 위로 갔습니다. 그는 [자신의 교만에서] 구원받았으므로, 자신에게 일깨움이 되도록 충만 안에 머물렀습니다.


    위로 서둘러 간 이와 그를 자기에게로 끌어당긴 이는 열매가 없지 않았습니다. 그들은 충만 안에서 열매를 낳아, 결핍 가운데 생겨난 것을 그 자리에서 끌어내렸습니다. 교만한 생각에서 생겨난 것들은 충만한 것들과 비슷합니다. 곧 충만한 것들의 닮은 모습과 형상과 그림자와 환영입니다. 그것들은 이성과 빛이 없고 공허한 생각에 속합니다. 아무것도 그것들을 낳지 않았기 때문입니다. [] 그러므로 그것들의 끝은 그 시작과 일치할 것입니다. 결코 존재한 적이 없는 것은 결코 존재하지 않을 것으로 돌아갈 것이기 때문입니다. 그런데도 그것들은 자신들이 그 그림자에 불과한 이름들, 곧 자신들을 [아름답게 꾸며 주는] 이름들보다 자신이 더 크고 강하며 더 [존귀하다]고 여깁니다. 그것들은 [누군가가 보는] 아름다운 반사상과 같습니다. 형상의 얼굴은 대개 그것이 반영하는 원형에서 아름다움을 얻기 때문입니다.


