translation:
  language: ko
  text: '[. . .] 교회는, 내가 처음부터 말한 대로, 아버지와 아들이 존재하시는 그 성질과 속성 안에 존재합니다. 그러므로 교회는 무수한 아이온들의 태어남 가운데 존립합니다. 교회가 [존재하는] 그 성질과 속성에 따라 아이온들도 헤아릴 수 없는 방식으로 낳습니다. 이는 이 아이온들이 서로, 또 [그들에게서] 나온 [이들과], 그리고 아들과 이루는 교회의 연합을 [구성하기] 때문입니다. 그들은 아들의 영광을 위하여 존재합니다.


    그러므로 정신은 <그들을> 생각해 낼 수 없습니다. 그분은 그곳의 완전함이시기 때문입니다.[a] 말도 그들을 묘사할 수 없습니다. 그들은 말할 수도, 이름 붙일 수도, 파악할 수도 없기 때문입니다. 오직 그들만이 자신들의 이름을 붙이고 자신들을 생각할 수 있습니다. 그들은 이곳들에 뿌리를 두고 있지 않기 때문입니다. 그곳에 있는 이들은 말로 나타낼 수 없고 헤아릴 수 없습니다. 그들의 질서는 [방식]이면서 척도이고, 기뻐함이며, 태어나지 않으시고 이름이 없으시며 이름 붙일 수 없고 파악할 수 없으며 보이지 않고 생각할 수 없는 분의 기쁨입니다.[b] 이것이 부성의 충만함이므로, 그분의 풍요는 하나의 태어남입니다.


    [] [. . .] 아이온들은 생각 속에 영원히 머물렀습니다. 아버지께서 그들에게 생각이자 처소와 같으셨기 때문입니다. 그들의 세대들이 확립되자, 모든 것을 다스리는 분은 [. . .] 안에서 부족한 것을 붙들어 낳기를 바라셨고, 자기 [안에 있던] 이들을 낳으셨습니다. 그러나 그분은 [본래 그러한] 분이시므로, 풍성히 흘러나오는 물에도 줄어들지 않는 샘이십니다.


    그들이 아버지의 생각, 곧 감추어진 깊음 안에 머물렀을 때, 그 깊음은 그들을 알았으나 그들은 자신들이 머무는 깊음을 알 수 없었습니다. 그들은 자기 자신도, 그 밖의 어떤 것도 알 수 없었습니다. 다시 말해, 그들은 아버지와 함께 머물렀으나 그들의 존재는 그들 자신을 위한 것이 아니었습니다. 오히려 그들은 씨앗처럼만 존재했으므로, 태아처럼 존재하는 것으로 드러났습니다. 그분은 말씀으로 하듯 그들을 낳으셨고, 그들은 씨의 형태로 존립했습니다. 그분이 낳으려 하신 이들은 아직 그분에게서 나와 존재에 이르지 않았습니다.


    [] 그들을 처음 생각하신 분은 아버지이셨습니다. 그분은 씨앗을 뿌리듯 하나의 생각을 심으셨습니다. 이는 그들이 그분을 위하여 존재하게 하실 뿐 아니라 그들 자신을 위하여도 존재하게 하시고, 그분의 생각 안에서 인식하는 존재로 존재하는 동시에 그들 자신을 위하여도 존재하게 하시려는 것이었습니다. 그들이 자신들을 위하여 존재하는 것을 알게 하시려고 그분은 첫 형태를 아낌없이 [베푸셨습니다]. 또한 그들을 위하여 존재하시는 [아버지가 누구이신지] [알게 하시려고], 그분은 음성을 통하여 그들에게 ‘아버지’라는 이름을 주셨습니다. 그 음성은 존재하는 것은 무엇이든 그들에게 속한 그 이름으로 존재한다고 선포했습니다.[c] 이는 그들이 그 이름 안에 머무는 높임으로 말미암아 존재에 이르렀기 때문입니다. 그러나 그들은 그 높임을 알아보지 못했습니다. 태아로 있는 동안 아기는 자기에게 충분한 것을 지니고 있지만, 자기를 씨 뿌린 이를 아직 보지 못합니다. 그러므로 그들에게 맡겨진 유일한 일은 그분이 존재하심을 깨닫고 그분을 찾으며, 존재하는 것을 발견하기를 끊임없이 갈망하는 것이었습니다.


    그러나 완전하신 아버지는 선하십니다. 그분은 그들이 자신의 생각 속에서 영원히 존재하게 하시려고 자신을 그들에게 <닫아 버리지> 않으시고, 그들 자신을 위하여도 존재에 이를 수 있게 해 주셨습니다. 그와 같이 그분은 그들에게 존재하는 것을, 곧 영원히 자신을 아는 분을 알 수 있는 선물도 주셨습니다. [] [. . .] ‘존재하시는 분’이 존재하심을 [알도록] 형태를 얻습니다. 이는 이곳에서 태어난 사람들이 빛 속으로 들어가 자기를 낳은 이들을 보게 되는 것과 같습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그분’의 정확한 지시 대상은 손상되고 모호한 문맥 때문에 확정하기 어렵습니다. 또한 <그들을>은 판본에서 편집자가 보충하거나 바로잡은 읽기입니다.
    reason: 대명사와 각괄호 복원의 불확실성을 독자에게 알립니다.
  - marker: b
    text: 이 문장은 문법적 연결이 불분명합니다. ‘질서’, ‘방식’, ‘척도’, ‘기뻐함’, ‘기쁨’의 정확한 상호 관계를 확정하지 않고 병렬적 긴장을 살렸습니다.
    reason: 손상된 전승과 난해한 구문에서 생기는 genuine ambiguity를 보존합니다.
  - marker: c
    text: ‘그들에게 속한 그 이름’이 ‘아버지’라는 이름을 가리키는지, 그들에게 주어진 다른 이름을 가리키는지는 문맥상 명확하지 않습니다.
    reason: 이름의 지시 관계에 대한 신학적 과잉 확정을 피합니다.
lexical_decisions:
- source_word: Church
  choice: 교회
  rationale: 공동체적·우주론적 실재를 가리키는 문맥이지만 익숙한 기본 용어를 유지하여 별도의 교파적 해석을 덧붙이지 않았습니다.
- source_word: aeons
  choice: 아이온들
  rationale: 시대나 영원으로 번역하면 여기서 인격적·발출적 존재들을 가리키는 전문적 용법이 사라질 수 있어 음역했습니다.
- source_word: mind
  choice: 정신
  rationale: ‘마음’보다 사유 능력 또는 지성 원리를 나타내는 철학적 의미를 보존합니다.
- source_word: depth
  choice: 깊음
  rationale: 장소와 인격화된 원리를 함께 암시하는 표현의 모호성을 보존하기 위해 ‘심연’으로 특정하지 않았습니다.
- source_word: paternity
  choice: 부성
  rationale: 단순한 ‘아버지 됨’보다 추상적 충만성이라는 문맥을 보존하는 용어입니다.
- source_word: spermatic form / spermatic seed
  choice: 씨의 형태 / 씨앗
  rationale: 생식적 비유를 유지하되 현대 한국어에서 지나치게 의학적으로 들리는 ‘정자적’을 피했습니다.
- source_word: He Who Is
  choice: 존재하시는 분
  rationale: 존재 자체를 강조하는 칭호를 보존하며 특정 성서 번역 전통의 신명으로 단정하지 않았습니다.
theological_decisions:
- issue: 교회와 아이온들의 관계
  choice: 아이온들이 서로와 아들과 이루는 연합이 교회를 구성한다고 번역
  alternative: 교회가 아이온들과 동일하다고 단정
  rationale: 본문은 구성·연합의 언어를 사용하므로 완전한 동일성이라는 후대의 체계적 해석을 넣지 않았습니다.
- issue: ‘그곳의 완전함’의 지시 대상
  choice: 대명사 ‘그분’을 유지하고 각주로 불확실성을 표시
  alternative: 정신 자체 또는 아버지/아들 가운데 하나로 명시
  rationale: 제공된 증거만으로 지시 대상을 확정하기 어렵습니다.
- issue: ‘이름’과 존재의 관계
  choice: 존재가 그 이름으로 말미암는다는 강한 표현을 유지
  alternative: 이름이 단지 존재를 알려 준다고 완화
  rationale: 본문의 이름에 대한 존재론적 긴장을 보존했습니다.
- issue: 아버지가 자신을 ‘닫지 않음’
  choice: 편집 보충 표시를 보존하여 직역
  alternative: ‘숨기지 않으셨다’로 해석적 평탄화
  rationale: 원문 증거가 간접적이고 증보된 동사이므로 복원 상태를 드러냈습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 고대 철학·신학 논문의 장중함을 유지했습니다. 대괄호, 생략 부호, 꺾쇠괄호는 제공된 판본의 손상·복원 신호로 그대로 보존했습니다. 콥트어 직접 검토가 보류된 상태이므로 이 초안은 제공된 공개 영역 영어 증언을 통한 잠정적 원문 지향 번역입니다.
