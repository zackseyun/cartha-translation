  source_fidelity: 영어 증언을 기준으로 대괄호·꺾쇠괄호·생략 표지를 대체로 충실히 보존했습니다. 다만 ‘mind would conceive’를 ‘생각해 내다’로 옮긴 것은 창안한다는 뜻을 더해 부정확하며, ‘질서’와 ‘방식·척도·기쁨’의 난해한 병렬 관계도 더 직접적으로 보존할 필요가 있습니다. 콥트어 직접 대조는 제공 자료상 보류되어 있으므로, 이 평가는 영어 공용 영역 증언에 대한 잠정 검토입니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체를 잘 유지합니다. 그러나 ‘그 이름 안에 머무는 높임’은 현대 한국어에서 부자연스럽고, ‘정신은 … 생각해 낼 수 없습니다’도 문맥상 어색합니다. 이를 각각 ‘그 이름 안에 깃든 고양’ 및 ‘정신이 … 생각으로 파악하는 것은 불가능합니다’로 다듬었습니다.
  terminology: ‘교회’, ‘아이온’, ‘깊음’, ‘부성’, ‘존재하시는 분’은 이 난해한 사변적 문맥에서 해석을 과도하게 확정하지 않는 적절한 선택입니다. ‘initial form’은 ‘첫 형태’보다 ‘최초의 형상’이 자연스럽고 원문의 형상 언어를 더 잘 살립니다.
  issues:
  - severity: medium
    issue: ‘mind would conceive of them’을 ‘정신은 <그들을> 생각해 낼 수 없습니다’로 번역함
    rationale: ‘생각해 내다’는 발명하거나 고안한다는 뉘앙스를 띱니다. 여기서는 지성이 그들을 개념적으로 파악하거나 생각할 수 없다는 뜻이므로 ‘생각으로 파악하다’가 더 충실합니다.
  - severity: medium
    issue: ‘uncountable in the system [that is] both [the mode] and the dimension, the rejoicing, the joy …’의 구문 관계가 번역에서 재구성됨
    rationale: 초안의 ‘그들의 질서는 … 기쁨입니다’는 난해한 원문의 병렬을 어느 정도 해석합니다. ‘[방식]이면서 척도인 질서 안에서는 셀 수 없다’와 이어지는 ‘기뻐하심, 곧 기쁨’의 병렬을 유지하여 불확실성을 보존하는 편이 안전합니다.
  - severity: low
    issue: ‘the exaltation that dwells in the name’을 ‘그 이름 안에 머무는 높임’으로 번역함
    rationale: ‘높임’은 이 문맥에서 명사로 자연스럽지 않습니다. ‘그 이름 안에 깃든 고양’은 원문의 추상성과 의미를 유지하면서 자연스럽습니다.
  revised_text: '[. . .] 교회는, 내가 처음부터 말한 대로, 아버지와 아들이 존재하시는 그 성질과 속성 안에 존재합니다. 그러므로 교회는 무수한 아이온들의 태어남 가운데 존립합니다. 교회가 [존재하는] 그 성질과 속성에 따라 아이온들도 헤아릴 수 없는 방식으로 낳습니다. 이는 이 아이온들이 서로, 또 [그들에게서] 나온 [이들과], 그리고 아들과 이루는 교회의 연합을 [구성하기] 때문입니다. 그들은 아들의 영광을 위하여 존재합니다.



    그러므로 정신이 <그들을> 생각으로 파악하는 것은 불가능합니다. 그분은 그곳의 완전함이시기 때문입니다.[a] 말도 그들을 묘사할 수 없습니다. 그들은 말할 수도, 이름 붙일 수도, 파악할 수도 없기 때문입니다. 오직 그들만이 자신들의 이름을 붙이고 자신들을 생각할 수 있습니다. 그들은 이러한 곳들에 뿌리를 두고 있지 않기 때문입니다. 그곳에 있는 이들은 말로 나타낼 수 없고, [방식]이면서 척도인 질서 안에서는 셀 수 없습니다. 그 질서는 태어나지 않으시고 이름이 없으시며 이름 붙일 수 없고 파악할 수 없으며 보이지 않고 생각할 수 없는 분의 기뻐하심, 곧 기쁨입니다.[b] 이것이 부성의 충만함이므로, 그분의 풍요는 하나의 태어남입니다.



    [] [. . .] 아이온들은 생각 속에 영원히 머물렀습니다. 아버지께서 그들에게 생각이자 처소와 같으셨기 때문입니다. 그들의 세대들이 확립되자, 모든 것을 다스리는 분은 [. . .] 안에서 부족한 것을 붙들어 낳기를 바라셨고, 자기 [안에 있던] 이들을 낳으셨습니다. 그러나 그분은 [본래 그러한] 분이시므로, 풍성히 흘러나오는 물에도 줄어들지 않는 샘이십니다.



    그들이 아버지의 생각, 곧 감추어진 깊음 안에 머물렀을 때, 그 깊음은 그들을 알았으나 그들은 자신들이 머무는 깊음을 알 수 없었습니다. 그들은 자기 자신도, 그 밖의 어떤 것도 알 수 없었습니다. 다시 말해, 그들은 아버지와 함께 머물렀으나 그들의 존재는 그들 자신을 위한 것이 아니었습니다. 오히려 그들은 씨앗처럼만 존재했으므로, 태아처럼 존재하는 것으로 드러났습니다. 그분은 말씀으로 하듯 그들을 낳으셨고, 그들은 씨의 형태로 존립했습니다. 그분이 낳으려 하신 이들은 아직 그분에게서 나와 존재에 이르지 않았습니다.



    [] 그들을 처음 생각하신 분은 아버지이셨습니다. 그분은 씨앗을 뿌리듯 하나의 생각을 심으셨습니다. 이는 그들이 그분을 위하여 존재하게 하실 뿐 아니라 그들 자신을 위하여도 존재하게 하시고, 그분의 생각 안에서 인식하는 존재로 존재하는 동시에 그들 자신을 위하여도 존재하게 하시려는 것이었습니다. 그들이 자신들을 위하여 존재하는 것을 알게 하시려고 그분은 최초의 형상을 아낌없이 [베푸셨습니다]. 또한 그들을 위하여 존재하시는 [아버지가 누구이신지] [알게 하시려고], 그분은 음성을 통하여 그들에게 ‘아버지’라는 이름을 주셨습니다. 그 음성은 존재하는 것은 무엇이든 그들에게 속한 그 이름으로 존재한다고 선포했습니다.[c] 이는 그들이 그 이름 안에 깃든 고양으로 말미암아 존재에 이르렀기 때문입니다. 그러나 그들은 그 고양을 알아보지 못했습니다. 태아로 있는 동안 아기는 자기에게 충분한 것을 지니고 있지만, 자기를 씨 뿌린 이를 아직 보지 못합니다. 그러므로 그들에게 맡겨진 유일한 일은 그분이 존재하심을 깨닫고 그분을 찾으며, 존재하는 것을 발견하기를 끊임없이 갈망하는 것이었습니다.



    그러나 완전하신 아버지는 선하십니다. 그분은 그들이 자신의 생각 속에서 영원히 존재하게 하시려고 자신을 그들에게 <닫아 버리지> 않으시고, 그들 자신을 위하여도 존재에 이를 수 있게 해 주셨습니다. 그와 같이 그분은 그들에게 존재하는 것을, 곧 영원히 자신을 아는 분을 알 수 있는 선물도 주셨습니다. [] [. . .] ‘존재하시는 분’이 존재하심을 [알도록] 형태를 얻습니다. 이는 이곳에서 태어난 사람들이 빛 속으로 들어가 자기를 낳은 이들을 보게 되는 것과 같습니다.'
  revised_footnotes:
  - marker: a
    text: ‘그분’의 정확한 지시 대상은 손상되고 모호한 문맥 때문에 확정하기 어렵습니다. 또한 <그들을>은 판본에서 편집자가 보충하거나 바로잡은 읽기입니다.
    reason: 대명사의 지시 대상과 꺾쇠괄호 읽기의 불확실성을 표시합니다.
  - marker: b
    text: 이 문장은 문법적 연결이 불분명합니다. 특히 ‘질서’, ‘[방식]’, ‘척도’, ‘기뻐하심’, ‘기쁨’의 정확한 상호 관계를 확정하지 않고, 증언의 병렬적 긴장을 보존했습니다.
    reason: 손상되고 난해한 구문에 대해 과도한 문법적·신학적 재구성을 피합니다.
  - marker: c
    text: ‘그들에게 속한 그 이름’이 ‘아버지’라는 이름을 가리키는지, 그들에게 주어진 다른 이름을 가리키는지는 문맥상 명확하지 않습니다.
    reason: 이름의 지시 관계에 대한 해석적 확정을 피합니다.
  revision_rationale: 안전한 수정이 필요합니다. 핵심적으로 ‘conceive’를 창안의 뜻으로 오해할 수 있는 표현을 바로잡고, ‘질서/방식/척도/기쁨’의 손상되고 난해한 병렬을 영어 증언에 더 가깝게 유지했습니다. 또한 ‘높임’을 자연스러운 추상 명사인 ‘고양’으로 교정하고 ‘initial form’을 ‘최초의 형상’으로 다듬었습니다. 괄호와 생략 표지는 모두 유지했으며, 본문의 신학적 관계나 대명사 지시 대상을 새로 확정하지 않았습니다.
