base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/028.yaml
  text: 'Concerning the true baptism, into which the Totalities descend and in which they come into being, there is no baptism other than this one. It is redemption in God the Father, the Son, and the Holy Spirit, when faith is professed in those names, [which] are the single name of the gospel, [] when someone has believed that the things told to them are real.


    For someone who believes that they exist, this means receiving, invisibly, the Father, the Son, and the Holy Spirit by testifying with firm faith and understanding them with firm hope. On this basis, attaining what someone has believed could become a return for that person, so that the Father could become one with him—the Father (and) God whom he has professed in faith and who granted that he should be made one with him in knowledge.


    The baptism mentioned earlier is called “the garment <that> those who wear it do not remove,” because it is put on by those who have received redemption. It is also called “the confirmation of the unfailing truth,” since it is unmoving and unshakable, firmly grasping those who have received <restoration> while they firmly grasp it. It is called “silence” because of its quietness and immovability. It is also called “bridal chamber” because of the harmonious and inseparable condition of those [whom] <he has> known <and who> have known him. It is also called [] “the light that does not set and is without flame,” not because it fails to give light, but because those who put it on and those whom it clothes are transformed into light. It is also called “eternal life,” which is deathlessness.


    Thus, whatever it is called, including its names <omitted> here, corresponds to all the beautiful things it contains in a manner that is simple, pleasant, inseparable, intricate, perfect, and unshakable. How, then, can it be named except as the Totality? Even if countless names were assigned to it, they would be spoken simply as a way of referring to it, when in fact it transcends all words, all voices, and all thoughts. It transcends everything, and it transcends all silence. So it is <…> with those who are what it is. This is indeed what it is, possessing a face that cannot be spoken or grasped, glorified by those who possess knowledge through what they have grasped.'
translation:
  language: ko
  text: '참된 세례에 관하여 말하자면, 만유[a]가 그 안으로 내려가고 그 안에서 존재하게 되는 세례는 이것 말고는 없습니다. 이 세례는 아버지 하나님과 아들과 성령 안에서 이루어지는 구속입니다. 곧 그 이름들—복음의 하나의 이름인 그 이름들—을 고백하며, 자신에게 전해진 것들이 참된 실재임을 믿을 때 이루어지는 구속입니다.[b]


    그분들이 존재하심을 믿는 사람에게 이것은, 굳건한 믿음으로 증언하고 굳건한 소망으로 그분들을 깨달아, 보이지 않는 방식으로 아버지와 아들과 성령을 받아들이는 것입니다. 이를 바탕으로, 사람이 믿어 온 것에 이르는 일이 그에게 귀환이 될 수 있습니다. 그리하여 그가 믿음으로 고백한 아버지, 곧 아버지이시며 하나님이신 분께서 그와 하나가 되실 수 있습니다. 그분은 그가 지식 안에서 자신과 하나가 되게 하셨습니다.


    앞서 말한 세례는 “입은 이들이 벗지 않는 옷”이라고 불립니다. 구속을 받은 이들이 그것을 입기 때문입니다. 또한 그것은 “실패하지 않는 진리의 확증”이라고 불립니다. 그것은 움직이지도 흔들리지도 않으며, <회복>을 받은 이들이 그것을 굳게 붙드는 동안 그들을 굳게 붙들기 때문입니다.[c] 그것은 고요하고 움직이지 않으므로 “침묵”이라고도 불립니다. 또한 <그분이> 아셨고 <그분을> 안 이들의 조화롭고 떼어 놓을 수 없는 상태 때문에 “신방”이라고도 불립니다.[d] 또한 “지지 않으며 불꽃도 없는 빛”이라고도 불립니다.[e] 이는 그 빛이 빛을 내지 못하기 때문이 아니라, 그것을 입는 이들과 그것이 입혀 주는 이들이 빛으로 변화되기 때문입니다. 또한 그것은 죽지 않음인 “영원한 생명”이라고도 불립니다.


    그러므로 그것을 무엇이라 부르든, 여기에서 <생략된> 그 이름들까지도, 그 이름은 그것이 단순하고 즐거우며 떼어 놓을 수 없고 복합적이며 완전하고 흔들리지 않는 방식으로 품고 있는 온갖 아름다운 것에 부합합니다. 그렇다면 그것을 만유 말고 무엇이라 이름 붙일 수 있겠습니까? 헤아릴 수 없이 많은 이름을 붙인다 해도, 그 이름들은 그저 그것을 가리키려고 말하는 것일 뿐입니다. 사실 그것은 모든 말과 모든 음성과 모든 생각을 초월하고, 모든 것을 초월하며, 모든 침묵도 초월합니다. 그것인 이들에게도 그것은 <…> 그러합니다.[f] 참으로 그것은 이와 같아서, 말로 나타낼 수도 붙잡을 수도 없는 모습을 지니며, 자신들이 붙잡은 것을 통하여 지식을 지닌 이들에게 영광을 받습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “만유”는 원문의 우주론적 총체를 가리키는 표현으로, 모든 존재 또는 충만한 전체를 뜻할 수 있습니다.
    reason: 핵심 전문 개념의 의미 범위를 설명합니다.
  - marker: b
    text: 이 대목의 사본에는 결락이 있으며, “그 이름들”과 “복음의 하나의 이름”의 정확한 문장 관계도 불확실합니다.
    reason: 제공된 본문의 대괄호 및 공백으로 표시된 손상을 알립니다.
  - marker: c
    text: “회복”은 손상된 본문을 편집자가 보충한 말입니다.
    reason: 꺾쇠괄호로 표시된 편집적 복원을 설명합니다.
  - marker: d
    text: “그분이”와 이어지는 일부 말은 손상된 본문을 보충한 것이며, 대명사의 지시 대상도 완전히 확실하지 않습니다.
    reason: 복원과 대명사 해석의 불확실성을 보존합니다.
  - marker: e
    text: 이 명칭 앞에도 사본의 결락이 있습니다.
    reason: 원문 증거의 공백을 표시합니다.
  - marker: f
    text: 이 문장에는 복원할 수 없는 결락이 있어 논리적 연결이 불완전합니다.
    reason: 생략 부호로 표시된 본문 손상을 설명합니다.
lexical_decisions:
- source_word: Totalities
  choice: 만유
  rationale: 이 문헌의 우주론적 집합 개념을 살리면서도 현대 한국어 독자가 이해할 수 있는 전통적이고 포괄적인 표현입니다. 문맥에 따라 단수적 총체와 복수적 존재 집단 사이의 긴장을 유지합니다.
- source_word: redemption
  choice: 구속
  rationale: 해방·되찾음의 종교적 의미를 담는 표준 한국어 용어이며, 특정 교파의 상세한 속죄 이론을 덧붙이지 않습니다.
- source_word: profession of faith / professed
  choice: 고백하다 / 믿음으로 고백하다
  rationale: 공적 신앙 진술이라는 의미를 자연스럽게 전달합니다.
- source_word: reality
  choice: 참된 실재
  rationale: 단순히 사실이라는 뜻보다 존재론적 실재성을 강조하는 문맥을 반영합니다.
- source_word: return
  choice: 귀환
  rationale: 근원으로 되돌아감이라는 문헌의 구원론적 방향을 보존하되 그 대상을 본문 밖에서 확정하지 않습니다.
- source_word: confirmation
  choice: 확증
  rationale: 진리의 견고함과 이를 굳게 하는 행위를 함께 나타냅니다.
- source_word: bridal chamber
  choice: 신방
  rationale: 혼인과 결합의 상징을 간결하고 품위 있게 보존합니다.
- source_word: deathlessness
  choice: 죽지 않음
  rationale: 추상적 전문어인 ‘불사성’보다 일반 독자에게 직접적이며, 영원한 생명과의 설명 관계를 유지합니다.
theological_decisions:
- issue: ‘those names’와 ‘a single name of the gospel’의 관계
  choice: “그 이름들—복음의 하나의 이름인 그 이름들—”
  alternative: 삼위의 이름을 하나의 고유한 신명으로 해석
  rationale: 복수 ‘이름들’과 단수 ‘하나의 이름’ 사이의 원문상 긴장을 해소하지 않고 보존했습니다.
- issue: “the Father (and) God”의 불안정한 연결
  choice: “아버지, 곧 아버지이시며 하나님이신 분”
  alternative: “아버지 하나님” 또는 “아버지와 하나님”
  rationale: 제공된 증거의 괄호가 암시하는 접속 불확실성을 인정하면서 한국어 문장으로 읽히게 했습니다. 각주에서 불확실성을 밝혔습니다.
- issue: 세례의 성격
  choice: 세례를 구속이며 옷·확증·침묵·신방·빛·생명으로 불리는 실재로 번역
  alternative: 물 의식이나 특정 성례 체계로 한정
  rationale: 본문의 다층적이고 신비적 묘사를 유지하고 후대 교파적 정의를 투입하지 않았습니다.
- issue: 앎과 하나 됨
  choice: “지식 안에서 자신과 하나가 되게”
  alternative: 구원받음, 신격화, 연합 중 하나로 교리적으로 확정
  rationale: 본문의 지식과 연합 언어를 그대로 유지하여 신학적 함의를 독자가 보게 했습니다.
- issue: 빛을 입는 자와 빛이 입혀 주는 자
  choice: 양방향 표현을 그대로 유지
  alternative: 둘을 동일한 뜻의 반복으로 평준화
  rationale: “입다”와 “입히다”의 역설적 상호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 인용 명칭은 신비적·시적 성격을 살리되 일반 독자가 이해할 수 있는 어휘로 옮겼습니다. 꺾쇠괄호와 생략 부호는 편집적 복원 및 본문 손상을 보존합니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제출된 공공 영역 영어 증언을 바탕으로 한 잠정 번역입니다.
