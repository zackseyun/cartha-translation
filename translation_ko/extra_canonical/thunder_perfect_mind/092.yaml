theological_decisions:
- issue: 자기현현적 1인칭 발화의 한국어 어조
  chosen_reading: 반복되는 ‘나는 …입니다’ 구조를 그대로 유지해, 시적 자기선언의 압박감과 병렬성을 살렸습니다.
  alternative_readings:
  - ‘나는 …이다’로 더 평서적으로 정리
  - 문장 사이 연결을 풀어 서술형으로 재배열
  rationale: 이 단락은 교리 진술보다 선언적 자기동일화에 힘이 있으므로, 합쇼체의 정중함을 유지하되 반복 구조는 훼손하지 않는 쪽이 원문 효과에 더 가깝습니다.
  doctrine_reference: 문학적/수사적 보존 원칙
- issue: 주체를 명시하지 않는 문장의 처리
  chosen_reading: ‘밖으로 외쳐지는 소리’처럼 수동적·비인칭적 구문을 남겨, 발화 주체를 한국어에서 임의로 확정하지 않았습니다.
  alternative_readings:
  - ‘나는 외치는 자입니다’로 능동 주체를 부여
  - ‘나는 부르는 소리입니다’로 완화
  rationale: 원문은 소리/외침의 사건성과 수신성을 강조하므로, 해석을 앞서지 않기 위해 주체를 비워 두는 번역을 택했습니다.
  doctrine_reference: 소스 제약과 서사적 모호성 보존
