  - 모든 사람의 이해됨
  lexicon: Crum; standard Sahidic usage
  rationale: 검증된 소스 판정에 따라 ⲥⲟⲃⲧⲉ를 인지어가 아니라 ‘준비/장비’ 계열로 읽어야 하므로, 한국어도 ‘준비’로 옮겨 의미의 물질성과 대비적 힘을 살렸습니다.
- source_word: ⲡⲁⲛⲟⲩⲥ
  english_pob_choice: my mind within
  chosen_korean: 내 마음은 안에 있습니다
  alternatives_korean:
  - 내 정신은 안에 있습니다
  - 내 마음 안에 있습니다
  lexicon: Greek loan νοῦς in Coptic
  rationale: ⲡⲁ-가 1인칭 소유를 표시하므로 ‘내 마음’으로 분명히 드러내고, ⲉϩⲟⲩⲛ은 ‘안에/내부에’의 위치를 자연스럽게 살렸습니다.
- source_word: ⲧⲡⲱϣⲥ
  english_pob_choice: the knowledge of my name
  chosen_korean: 내 이름의 발음
  alternatives_korean:
  - 내 이름의 구별
  - 내 이름의 분화
  - 내 이름의 지칭
  lexicon: Uncertain; Coptic semantic range around division/distinction/articulation
  rationale: 소스 판정에 따라 ⲡⲱϣⲥ는 ‘지식’이 아니라 말의 분절/발화 쪽 의미를 띠므로, 한국어는 ‘발음’으로 옮겨 소리 내어 드러나는 뉘앙스를 반영했습니다.
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  english_pob_choice: the cry that goes out
  chosen_korean: 밖으로 외쳐지는 소리
  alternatives_korean:
  - 밖으로 나가는 외침
  - 밖으로 울려 나가는 소리
  lexicon: Uncertain; ⲉⲃⲟⲗ ‘out/away’
  rationale: ⲉⲃⲟⲗ의 바깥 방향성과 ϣⲕⲁⲕ의 외침성을 함께 살려, 능동 주체를 단정하지 않는 ‘외쳐지는 소리’로 번역했습니다.
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  english_pob_choice: the one who hears
  chosen_korean: 듣는 자
  alternatives_korean:
  - 듣는 이
  - 들을 자
  lexicon: Common Sahidic relative form
  rationale: 상대적 표현을 간결한 명사구로 처리해 앞의 ‘외쳐지는 소리’와 대구를 이루도록 했습니다.
theological_decisions:
- issue: 자기현현적 1인칭 발화의 한국어 어조
  chosen_reading: 반복되는 ‘나는 …입니다’ 구조를 그대로 유지해, 시적 자기선언의 압박감과 병렬성을 살렸습니다.
  alternative_readings:
  - ‘나는 …이다’로 더 평서적으로 정리
  - 문장 사이 연결을 풀어 서술형으로 재배열
  rationale: 이 단락은 교리 진술보다 선언적 자기동일화에 힘이 있으므로, 합쇼체의 정중함을 유지하되 반복 구조는 훼손하지 않는 쪽이 원문 효과에 더 가깝습니다.
  doctrine_reference: 문학적/수사적 보존 원칙
- issue: 주체를 명시하지 않는 문장의 처리
  chosen_reading: ‘밖으로 외쳐지는 소리’처럼 수동적·비인칭적 구문을 남겨, 발화 주체를 한국어에서 임의로 확정하지 않았습니다.
  alternative_readings:
  - ‘나는 외치는 자입니다’로 능동 주체를 부여
  - ‘나는 부르는 소리입니다’로 완화
  rationale: 원문은 소리/외침의 사건성과 수신성을 강조하므로, 해석을 앞서지 않기 위해 주체를 비워 두는 번역을 택했습니다.
  doctrine_reference: 소스 제약과 서사적 모호성 보존
