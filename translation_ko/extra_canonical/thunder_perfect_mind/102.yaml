base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/102.yaml
  text: 'Take hold of yourselves[a];

    for your inside is your outside[c][b],

    and the one who fashions your outside

    is the one who shaped it.'
  footnotes:
  - marker: a
    text: The phrase ‘made him a pattern’ renders ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ (τύπος), which can also mean ‘imprinted’ or ‘stamped’; elsewhere in Thunder this semantic field overlaps with ‘seal.’
    reason: lexical_alternative
  - marker: b
    text: ⲛⲥⲁⲃⲟⲗ is read here as ⲛⲥⲃⲱⲗ ‘in endurance/patience’; damaged spacing may conceal the long vowel or double consonant.
    reason: alignment_note
  - marker: c
    text: Or 'I appeared among you;\nfor the one who endures is wise,\nand the one who molded you in endurance—\nhe made him a pattern.'.
    reason: previous_rendering
translation:
  language: ko
  text: '스스로를 붙드십시오[a];


    이는 여러분의 속이 곧 여러분의 겉이기[b] 때문이며,

    여러분의 겉을 빚는 이는

    그것을 그렇게 빚으신 분이기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사는 ‘붙들다/붙잡다’의 뜻을 가지므로, 단순한 ‘받아들이다’보다 행위의 강도를 살려 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 대칭은 ‘여러분의 속이 곧 여러분의 겉’이라는 동일성 진술입니다. 전통적 설명처럼 내부와 외부를 대비시키는 문장이 아닙니다.
    reason: source_note
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ
  english_pob_choice: Take hold of yourselves
  chosen_korean: 스스로를 붙드십시오
  alternatives_korean:
  - 자신을 붙잡으십시오
  - 스스로를 잡으십시오
  lexicon: Crum; imperative from the verb meaning grasp/hold
  rationale: 회중을 향한 직접적 권면으로 읽히므로 ‘붙드십시오’가 동작성과 자기 점검의 뉘앙스를 살리며, 단순한 정지 상태보다 원문의 촉구를 잘 드러냅니다.
- source_word: ⲥⲁϩⲟⲩⲛ
  english_pob_choice: inside
  chosen_korean: 속
  alternatives_korean:
  - 안
  - 내면
  lexicon: Crum; inner/inside
  rationale: 문맥의 대칭 구조(속/겉)를 가장 자연스럽게 살리기 위해 ‘속’을 택했습니다.
- source_word: ⲥⲁⲃⲟⲗ
  english_pob_choice: outside
  chosen_korean: 겉
  alternatives_korean:
  - 바깥
  - 외면
  lexicon: Crum; outside/exterior
  rationale: 앞의 ‘속’과 짝을 이루는 대조를 한국어에서도 간결하게 전달하기 위해 ‘겉’으로 옮겼습니다.
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  english_pob_choice: fashions / shaped
  chosen_korean: 빚는
  alternatives_korean:
  - 형성하는
  - 만드는
  - 형태를 빚는
  lexicon: Greek loanword from πλάσσω
  rationale: 원문의 조형 이미지를 살리기 위해 ‘빚다’를 사용했고, 창조적 형성이라는 감각을 유지했습니다.
theological_decisions:
- issue: 명령문과 동일성 진술의 어조
  chosen_reading: 첫 절은 자기 점검을 촉구하는 명령으로, 다음 절은 존재의 내적-외적 동일성을 단언하는 진술로 읽었습니다.
  alternative_readings:
  - 첫 절을 ‘스스로를 붙들어 매십시오’처럼 더 강한 제어로 옮기는 해석
  - 둘째 절을 윤리적 권면으로 약화시키는 해석
  rationale: 콥트어 문장 구조와 POB의 수정된 해석을 따라, 권면과 진술의 대비를 유지해야 뒤 문장의 형이상학적 긴장이 사라지지 않습니다.
  doctrine_reference: 문학적-상징적 자기 동일성 진술
