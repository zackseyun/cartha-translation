translation:
  language: ko
  text: '스스로를 붙드십시오[a].


    여러분의 속이 곧 여러분의 겉이기 때문입니다[b].


    여러분의 겉을 빚는 이는

    그것을 본으로 만드신 이입니다[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사는 ‘붙들다, 붙잡다’라는 뜻의 명령형입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 ‘여러분의 속’과 ‘여러분의 겉’을 대칭적으로 놓고 둘의 동일성을 진술합니다.
    reason: source_note
  - marker: c
    text: ‘본으로 만드신’은 ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ(τύπος)를 옮긴 것입니다. 이 표현은 ‘형상을 부여하신’ 또는 ‘각인하신’으로도 이해될 수 있습니다.
    reason: lexical_alternative
