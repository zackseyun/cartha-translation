  yaml_path: translation/extra_canonical/thunder_perfect_mind/064.yaml
  text: 'For she is wise[a], and she is a small one[e][d][c][b];

    nor turn away great things in parts

    from smallness—

    for they know smallness.'
  footnotes:
  - marker: a
    text: ⲟⲩⲕⲟⲩⲉⲓ literally ‘small/child’; here rendered ‘fool’ to sharpen the antithesis with ‘wise.’ ‘Simple/ignorant’ are viable alternatives.
    reason: lexical_alternative
  - marker: b
    text: If ⲥⲟⲩⲱⲛ is not ⲥⲟⲟⲩⲛ ‘know’ but a removal verb, the line could read ‘until they remove ignorance.’
    reason: alternative_reading
  - marker: c
    text: ‘Do not take away greatness in parts’ could also be ‘do not remove the great things by portions.’ The object may be implicit or resumed elsewhere in the larger unit.
    reason: alignment_note
  - marker: d
    text: Or 'For be wise—and be a fool;'.
    reason: previous_rendering
  - marker: e
    text: Or 'and do not take away greatness in parts;\nin ignorance, until they come to know ignorance—\nfor they know ignorance.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그녀는 지혜롭고, 또한 작은 자입니다.

    큰 것들을 작은 것들로부터 돌려놓지 말며—

    그들은 작은 것을 압니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲥⲥⲁⲃⲉ
  english_pob_choice: wise
  chosen_korean: 지혜롭고
  alternatives_korean:
  - 현명하고
  - 슬기롭고
  lexicon: Crum s.v. ⲥⲁⲃⲉ
  rationale: 여기서는 형용사적 진술로 읽혀 ‘she is wise’의 뜻을 살리며, 뒤의 ‘작은 자’와의 대비를 자연스럽게 드러내기 위해 ‘지혜롭고’로 옮겼습니다.
- source_word: ⲟⲩⲕⲟⲩⲉⲓ ⲧⲉ
  english_pob_choice: a small one
  chosen_korean: 작은 자
  alternatives_korean:
  - 작은 사람
  - 어린 자
  - 어리석은 자
  lexicon: Crum s.v. ⲕⲟⲩⲉⲓ; NH usage
  rationale: 직역하면 ‘작은 자/작은 사람’이 적절하며, 본문은 명령이 아니라 3인칭 여성 단수 서술이므로 ‘어리석은 자’보다는 원의미에 가까운 ‘작은 자’를 택했습니다.
- source_word: ⲙⲡⲣⲧⲥⲧⲟ ⲛϩⲉⲛ ⲙⲛⲧⲛⲟϭ ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ ⲉⲃⲟⲗ ϩⲛ ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  english_pob_choice: nor turn away great things in parts from smallness
  chosen_korean: 큰 것들을 작은 것들로부터 돌려놓지 말며
  alternatives_korean:
  - 큰 것들을 부분적으로 제거하지 말며
  - 큰 것을 조각내어 빼앗지 말며
  lexicon: Crum s.v. ⲧⲥⲧⲱ; ⲛⲟϭ; ⲙⲉⲣⲟⲥ
  rationale: 핵심은 ‘great things’와 ‘parts’의 긴장을 한국어로 유지하는 것이므로, 전체를 쪼개거나 떼어내는 동작을 나타내는 ‘돌려놓지 말며’로 옮겼습니다.
- source_word: ⲙⲛⲧⲕⲟⲩⲉⲓ
  english_pob_choice: smallness
  chosen_korean: 작은 것들
  alternatives_korean:
  - 작음
  - 미소함
  - 무지
  lexicon: Crum s.v. ⲕⲟⲩⲉⲓ
  rationale: 뒤의 문맥에서 ⲙⲛⲧⲕⲟⲩⲉⲓ는 ‘무지’가 아니라 ‘작음/작은 상태’로 이어지므로, 본문의 대조를 살려 ‘작은 것들’로 처리했습니다.
