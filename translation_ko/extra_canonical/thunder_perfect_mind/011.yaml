  naturalness: ‘나는 내 어머니의 몸의 지체입니다’와 ‘나는 아이를 낳지 못하는 여인입니다. 그녀의 자녀는 많습니다’는 현대 표준 한국어로 자연스럽고, 반복되는 선언의 리듬도 보존합니다. ‘아이를 낳지 못한 여인이지만’은 문장 연결이 부자연스럽고 원문에 없는 역접을 첨가합니다.
