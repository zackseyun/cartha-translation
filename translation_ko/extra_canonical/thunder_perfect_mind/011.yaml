translation:
  language: ko
  text: '나는 내 어머니의 지체입니다[a].

    그리고 나는 아이를 낳지 못한 여인이지만—그녀의 자녀들은 많습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 POB의 “members”는 더 넓은 의미를 위해 유지되었으나, 콥트어 어휘는 몸의 지체/부분을 가리킬 수 있어 ‘지체’로 옮겼습니다.
    reason: lexical_alternative
