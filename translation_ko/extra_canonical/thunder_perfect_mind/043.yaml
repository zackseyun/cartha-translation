  - 아는 사람입니다
  - 알고 있습니다
  lexicon: Crum Coptic Dictionary
  rationale: qualitative/stative 용법을 문맥상 형용사적으로 받아, '무감각'과 대조되는 역설을 가장 자연스럽게 드러내는 '지혜롭다'로 옮겼습니다.
- source_word: ⲧⲥⲟⲟⲩⲛ
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 이해
  lexicon: Crum Coptic Dictionary
  rationale: 정관사와 결합한 명사로서의 의미를 살려 '지식'으로 옮겼고, 뒤의 속격 구조를 한국어의 '...의 지식'으로 반영했습니다.
- source_word: ⲉⲗⲗⲏⲛ / ⲃⲁⲣⲃⲁⲣⲟⲥ
  english_pob_choice: Greek / barbarian
  chosen_korean: 그리스인 / 바르바로스
  alternatives_korean:
  - 그리스 사람 / 이방인
  - 헬라인 / 비그리스인
  lexicon: Greek loanwords via Coptic (LSJ)
  rationale: 본문의 그리스-바르바로스 대립을 문화적으로 약화시키지 않기 위해, 전통적 완곡어인 '이방인' 대신 음역 '바르바로스'를 유지했습니다.
