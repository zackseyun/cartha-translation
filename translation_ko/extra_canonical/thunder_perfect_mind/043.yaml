translation:
  language: ko
  text: '나는 분별이 없으나 지혜롭습니다.


    나는 그리스인과 바르바로스의 지식입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바르바로스’는 고대 그리스어에서 그리스인이 아닌 이들을 가리키던 명칭입니다. 본문은 그리스인과 바르바로스의 전통적 대조를 보존하기 위해 이를 음역했습니다.
    reason: 역사적 명칭의 범주와 번역 방침을 설명하되, 본문의 대조를 완화하거나 해석적으로 재규정하지 않습니다.
