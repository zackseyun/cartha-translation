translation:
  language: ko
  text: '나는 무감각하지만, 나는 지혜롭습니다.

    나는 그리스인의 지식이요, 바르바로스의 지식입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그리스인의 지식'입니다. 본문은 민족적 범주를 그대로 병치해 그리스인과 바르바로스의 대립을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: ⲛⲁⲥⲓⲉ
  english_pob_choice: without sense
  chosen_korean: 무감각하지만
  alternatives_korean:
  - 분별이 없지만
  - 의식이 없지만
  - 어리석지만
  lexicon: Crum Coptic Dictionary; Layton, Coptic in 20 Lessons
  rationale: privative 표현의 강한 결핍감을 살리되, 도덕적 평가가 강한 '어리석다'는 피하고 한국어로는 '무감각하다'를 택해 역설을 유지했습니다.
- source_word: ⲥⲟⲟⲩⲛ (qualitative)
