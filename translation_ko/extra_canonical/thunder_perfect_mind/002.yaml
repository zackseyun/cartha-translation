  naturalness: 합쇼체와 시적 직접 호명은 적절한 방향입니다. 다만 ‘나를 지켜보는 이들—너희 자신은—나를 들으십시오’는 한국어 통사상 어색할 뿐 아니라 원문의 두 호명과 뒤따르는 명령의 관계를 흐립니다. ‘나를 지켜보는 여러분 자신이여’와 ‘듣는 이들이여, 내 말을 들으십시오’로 나누면 자연스럽고 수사적 반복도 보존됩니다.
  terminology: ⲣⲟⲉⲓⲥ는 ‘알다’가 아니라 ‘지켜보다/깨어 기다리다’ 계열로 보는 최근 감사 기록을 따르는 것이 타당합니다. ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ은 ‘강해지다’가 아니라 ‘나를 받아들이다’이므로, 이에 반하는 현행 각주 c는 삭제해야 합니다. ⲡⲱⲧ는 문자적으로 ‘달아나다/도망치다’이므로 본문에는 ‘달아나지 마십시오’를 쓰고 관계적 독법은 각주로 제시했습니다.
