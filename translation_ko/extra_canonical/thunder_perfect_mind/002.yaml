base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/002.yaml
  text: 'Consider me[1], and I found myself among those who seek me,

    you who watch for me—you yourselves;[3]

    and you hearers, listen to me.

    You who are troubled in heart, receive me to yourselves[d][c][b][a][4][3][2],

    and do not turn away from me.[4]'
  footnotes:
  - marker: '1'
    text: 'OCR shows ⲁⲓϭⲓⲛⲉ (1sg. perfect, ‘I found’), but the chain of imperatives and the collocation with ‘those who seek me’ favor reading/understanding an imperative ϭⲓⲛⲉ ⲙⲙⲟⲓ ‘find me.’ If the indicative is confirmed, an alternative would be: ‘and I am found among those who seek me.’'
    reason: alignment_note
  - marker: '2'
    text: ϣⲟⲡⲧ ranges over ‘strength/firmness/courage’; alternatives include ‘take courage’ or ‘be firm.’
    reason: lexical_alternative
  - marker: '3'
    text: ⲉⲧⲏⲩⲧⲛ is an emphatic independent pronoun ‘you yourselves,’ intensifying the address. It can be left implicit, but we preserve it to keep the rhetorical force.
    reason: cultural_note
  - marker: '4'
    text: ⲡⲱⲧ is literally ‘run/flee’; ‘turn away’ renders the relational sense in context. ‘Do not flee from me’ is a viable alternative.
    reason: lexical_alternative
  - marker: a
    text: Or 'and find me among those who seek me,[1]'.
    reason: previous_rendering
  - marker: b
    text: Or 'you who know me—you yourselves;[3]'.
    reason: previous_rendering
  - marker: c
    text: Or 'be strong,[2]'.
    reason: previous_rendering
  - marker: d
    text: Or 'and let whoever will listen, listen to me.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나를 생각하십시오. 그러면 나를 찾는 이들 가운데서 내가 발견될 것입니다.

    나를 지켜보는 이들—너희 자신은—나를 들으십시오.

    마음이 괴로운 이들아, 나를 너희 곁으로 받아들이고,

    나에게서 돌아서지 마십시오.[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 찾으십시오’로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: b
    text: ‘너희 자신은’의 강조는 문맥상 생략할 수 있습니다.
    reason: previous_rendering
  - marker: c
    text: ‘강해지십시오’ 또는 ‘굳세십시오’로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: ‘들으려는 자는 나를 들으십시오’라는 풀이도 가능합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  english_pob_choice: Consider me
  chosen_korean: 나를 생각하십시오
  alternatives_korean:
  - 나를 숙고하십시오
  - 나를 묵상하십시오
  - 나를 헤아리십시오
  lexicon: Crum s.v. ⲙⲉⲉⲩⲉ
  rationale: ⲙⲉⲉⲩⲉ는 ‘생각하다, 숙고하다’의 뜻이므로 직접적 명령형으로 옮겼습니다. ‘묵상하다’는 종교적 어감이 강해 원문의 직설성을 다소 바꿀 수 있어 기본안에서는 피했습니다.
- source_word: ϭⲓⲛⲉ ⲙⲙⲟⲓ
  english_pob_choice: find me
  chosen_korean: 나를 찾는 이들 가운데서 내가 발견될 것입니다
  alternatives_korean:
  - 나를 찾으십시오
  - 나를 발견하십시오
  - 나를 찾는 이들 가운데서 나를 찾으십시오
  lexicon: Crum s.v. ϭⲓⲛⲉ
  rationale: POB 주석에 따라 OCR의 완료형 흔적보다 ‘찾다/발견하다’의 명령적·서술적 긴장을 살렸습니다. 한국어에서는 ‘내가 발견될 것입니다’가 주어-대상 관계를 자연스럽게 드러내면서도 원문의 상호적 구조를 유지합니다.
- source_word: ⲧⲉⲧⲛⲉⲣⲟⲉⲓⲥ ⲉⲣⲟⲓ / ⲉⲧⲏⲩⲧⲛ
  english_pob_choice: you who watch for me—you yourselves;
  chosen_korean: 나를 지켜보는 이들—너희 자신은—
  alternatives_korean:
  - 나를 지키며 기다리는 이들—너희 자신은—
  - 나를 살피는 이들—너희 자신은—
  lexicon: Crum s.v. ⲣⲟⲉⲓⲥ; Layton, Coptic Grammar §75
  rationale: ⲣⲟⲉⲓⲥ는 ‘알다’가 아니라 ‘지켜보다, 깨어 있다’의 뜻이므로 ‘지켜보는’으로 옮겼습니다. ⲉⲧⲏⲩⲧⲛ의 강조를 살리기 위해 ‘너희 자신은’으로 독립적으로 드러냈습니다.
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ
  english_pob_choice: you hearers
  chosen_korean: 이들아
  alternatives_korean:
  - 듣는 이들아
  - 청자들아
  - 들을 귀가 있는 이들아
  lexicon: Crum s.v. ⲣⲉϥ- + ⲥⲱⲧⲙ
  rationale: 이 형식은 상대방을 가리키는 복수 명사구이므로 ‘듣는 이들’의 의미를 반영하되, 앞의 청유를 매끄럽게 잇기 위해 호격 ‘이들아’로 압축했습니다.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  english_pob_choice: receive me to yourselves
  chosen_korean: 나를 너희 곁으로 받아들이고
  alternatives_korean:
  - 나를 너희에게 받아들이고
  - 나를 너희 자신에게 받아들이고
  - 나를 너희 안에 받아들이고
  lexicon: Crum s.v. ϣⲱⲡ
  rationale: 주석이 지적하듯 ϣⲟⲡⲧ는 ‘받다/받아들이다’의 명령형입니다. ⲉⲣⲱⲧⲛ의 ‘너희에게/너희 쪽으로’는 관계적 접촉을 자연스럽게 살리는 ‘너희 곁으로’로 옮겼습니다.
- source_word: ⲙⲡⲣⲡⲱⲧ ⲛⲥⲱⲓ
  english_pob_choice: do not turn away from me
  chosen_korean: 나에게서 돌아서지 마십시오
  alternatives_korean:
  - 나에게서 도망치지 마십시오
  - 나에게서 달아나지 마십시오
  - 나를 피하지 마십시오
  lexicon: Crum s.v. ⲡⲱⲧ
  rationale: ⲡⲱⲧ는 문자적으로 ‘달리다/도망치다’지만, 문맥상 관계적 이탈을 나타내므로 ‘돌아서다’로 옮겼습니다. 이는 POB의 ‘turn away’와 같은 해석적 균형을 한국어로 재현합니다.
theological_decisions:
- issue: 원문의 오라큘/지혜시적 직접 호명과 한국어 존대
  chosen_reading: 화자가 일방적으로 청중을 부르며 명령하는 시적·예언적 어조를 살려, 본문은 전체적으로 합쇼체 명령문으로 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 전통 교회체의 경어적 종결로 통일
  rationale: 이 작품의 수사적 힘은 반복되는 직접 명령에 있으므로, 한국어에서도 청중에게 바로 말을 거는 긴장을 보존하는 것이 더 충실합니다.
  doctrine_reference: 문학적/수사적 register preservation
