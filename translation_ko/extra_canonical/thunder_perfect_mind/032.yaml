  text: And you will find me in greatness; and do not look at me going out among those who are honored, and in the least places look for me.
  footnotes:
  - marker: a
    text: ⲙⲙⲛⲧⲣⲙⲁⲟ is literally ‘greatness’; some take this semantic field to include social ‘exaltation’ and, contextually, ‘riches.’
    reason: lexical_alternative
  - marker: b
    text: The cluster ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ is read here as ‘going out/coming forth’; if instead it encodes a different verb, the clause may need re-interpretation.
    reason: alignment_note
  - marker: c
    text: Traditional English presentations often read this segment as ‘Heed my poverty and my wealth’; our Coptic excerpt, as mapped, points to ‘great … least’ rather than explicit ‘poverty/wealth.’
    reason: alternative_reading
  - marker: d
    text: Or 'in greatness'.
    reason: previous_rendering
  - marker: e
    text: Or 'among the great'.
    reason: previous_rendering
  - marker: f
    text: Or 'but among the least—in the place of silence.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분께서 말씀하십니다. “너희는 나를 큰 데서 찾을 것이며, 또한 나를 높은 자들 가운데서 보지 말아야 하고, 가장 낮은 곳에서 나를 찾아야 합니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘위대함/큰 됨’의 뜻입니다. 전승된 영어 해설에서는 ‘wealth’로 읽기도 하지만, 여기서는 수정된 판독에 따라 ‘큰 데’의 의미를 살렸습니다.
    reason: source_note
  - marker: b
    text: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ는 ‘존귀한 자들/존경받는 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ는 ‘가장 작은 곳’ 또는 ‘가장 보잘것없는 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  english_pob_choice: you will find me
  chosen_korean: 나를 찾을 것이며
  alternatives_korean:
  - 나를 발견할 것이며
  - 나를 찾게 될 것이며
  lexicon: Crum; Layton
  rationale: ϭⲓⲛⲉ는 ‘찾다/발견하다’의 뜻이므로, 합쇼체에서 자연스러운 “찾을 것이며”로 옮겼습니다.
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲁⲟ
  english_pob_choice: in greatness
  chosen_korean: 큰 데서
  alternatives_korean:
  - 위대함 속에서
  - 크게 된 데서
  - 부유함 속에서
  lexicon: Crum
  rationale: ⲙⲙⲛⲧⲣⲙⲁⲟ는 문자적으로 ‘큰 됨/위대함’의 영역을 가리키므로, 한국어에서는 ‘큰 데서’로 간결하게 살렸습니다.
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  english_pob_choice: those who are honored
  chosen_korean: 높은 자들 가운데서
  alternatives_korean:
  - 존귀한 자들 가운데서
  - 존경받는 자들 가운데서
  lexicon: Coptic stative; contextual
  rationale: 수정된 판독에 따라 ‘영예를 받은/존귀한’ 사람들을 가리키므로, 의미를 살리면서도 문맥의 대비를 보존하는 “높은 자들 가운데서”를 택했습니다.
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ
  english_pob_choice: the least places
  chosen_korean: 가장 낮은 곳
  alternatives_korean:
  - 가장 작은 곳
  - 가장 낮은 장소
  - 가장 보잘것없는 곳
  lexicon: Greek loan (elachistos)
  rationale: ‘least’의 대비를 한국어의 ‘가장 낮은’으로 옮겨, 앞의 ‘높은 자들’과 대조가 분명하게 드러나도록 했습니다.
- source_word: ⲧⲟⲡⲟⲥ
  english_pob_choice: places
  chosen_korean: 곳
  alternatives_korean:
  - 장소
  - 자리
  lexicon: Greek loan (topos)
  rationale: 현대 한국어에서는 ‘곳’이 반복되는 공간적 대비를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: 화자 호칭과 1인칭 발화의 처리
  chosen_reading: 본문은 직접 발화 형식으로 읽고, 앞에 ‘그분께서 말씀하십니다’라고 덧붙여 한국어 문장 흐름을 정리했습니다.
  alternative_readings:
  - 직접 인용만 두어 화자 표지를 생략
  - 시적 문체를 유지해 서술 표지를 넣지 않음
  rationale: 이 단락은 신적/상징적 화자의 선언이므로, 인용문 자체는 원문의 직접성을 살리고 바깥 문장으로 발화 표지를 최소한으로 보완했습니다.
  doctrine_reference: 문학적 화자 표지 처리
- issue: ‘honored’와 ‘least’의 대조
  chosen_reading: ‘높은 자들’과 ‘가장 낮은 곳’의 대조로 번역해 사회적 위계의 반전을 드러냈습니다.
  alternative_readings:
  - ‘존귀한 자들’과 ‘가장 작은 곳’
  - ‘명예로운 자들’과 ‘가장 낮은 곳’
  rationale: 원문은 지위의 반전을 강조하므로, 한국어에서도 위계 대비가 즉시 느껴지도록 했습니다.
  doctrine_reference: 수사적 대조 보존
