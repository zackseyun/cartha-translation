translation:
  language: ko
  text: “너희는 위대함 가운데서 나를 찾을 것입니다.[a] 또한 내가 존귀한 이들 가운데서 나아올 때에는 나를 보지 마십시오.[b] 가장 낮은 곳들에서 나를 찾으십시오.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲙⲙⲛⲧⲣⲙⲁⲟ는 직역하면 ‘위대함’ 또는 ‘큰 됨’입니다. 문맥에 따라 ‘높아짐’이나 ‘부유함’으로 이해될 여지도 있으나, 여기서는 어휘의 기본 뜻을 따라 ‘위대함’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ는 ‘존귀한 이들’, ‘영예를 받은 이들’ 또는 ‘존경받는 이들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ는 ‘가장 낮은 곳들’이며, ‘가장 작은 곳들’ 또는 ‘가장 보잘것없는 곳들’로도 옮길 수 있습니다.
    reason: lexical_alternative
