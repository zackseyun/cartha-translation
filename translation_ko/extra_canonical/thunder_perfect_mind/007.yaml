theological_decisions:
- issue: 화자 정체와 문체의 급진적 자기진술
  chosen_reading: 이 구절은 한 인격이 서로 배타적으로 보이는 정체들을 병치하는 신비적 자기선언으로 읽고, 한국어도 그 역설성과 단정성을 그대로 드러냈습니다.
  alternative_readings:
  - 상징적 알레고리로 완화하여 번역
  - 도덕적 대립어로 순화하여 번역
  rationale: 원문의 수사적 충돌을 약화하면 텍스트의 핵심 효과가 사라지므로, 독자가 역설 자체를 인지하도록 유지했습니다.
  doctrine_reference: 문헌 비평 및 영지주의 문헌의 수사 분석
- issue: 등록어 선택에서의 노골성 유지
  chosen_reading: ‘whore’는 완곡하게 돌리지 않고 ‘창녀’로, ‘scorned’는 ‘멸시받는 자’로 옮겨 원문의 충격과 대조를 보존했습니다.
  alternative_readings:
  - 더 완곡한 ‘음녀’/‘천대받는 자’
  - 교회적 어휘로 중화
  rationale: 도발적 병치가 이 작품의 신학적·수사적 핵심이므로, 한국어에서도 불편함을 희석하지 않았습니다.
  doctrine_reference: '번역 원칙: source-direct rendering'
