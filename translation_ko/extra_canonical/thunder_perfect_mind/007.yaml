  source_fidelity: 첫째/마지막, 존귀한 자/멸시받는 자(본문 OCR의 불확실성은 주석 처리), 창녀/거룩한 자의 대조는 원문 및 영어 감사 기록을 대체로 충실히 반영합니다. 그러나 ⲥϩⲓⲙⲉ의 기본 뜻은 ‘여자’이므로, 본문을 근거 없이 ‘아내’로 확정하는 것은 영어 POB의 해석적 선택을 원문보다 우선한 것입니다. ‘여자’로 옮기고 ‘아내’ 가능성을 주석에 남기는 편이 안전합니다.
  naturalness: ‘저를 알지 못하십시오’는 합쇼체 명령으로 다소 부자연스럽고, ‘알지 못하다’를 금하는 뜻도 매끄럽게 전달하지 못합니다. ‘나를 알지 못한 채 있지 마십시오’가 인지적 경고와 현대 한국어 문법을 함께 살립니다. 각 자기선언을 완결 문장으로 처리하면 한국어의 엄숙한 선언체와 대구가 더 자연스럽습니다.
  terminology: ‘창녀’는 πορνή의 직설성과 수사적 충격을 보존하며, ‘거룩한 자’도 ⲥⲉⲙⲛⲏ의 종교적·윤리적 의미 범위를 무리 없이 반영합니다. ‘여자/처녀’는 원문 어휘에 더 직접적이며, ‘아내’는 주석의 대안으로 제시합니다.
