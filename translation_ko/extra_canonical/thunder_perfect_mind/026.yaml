  yaml_path: translation/extra_canonical/thunder_perfect_mind/026.yaml
  text: 'You who know me[a], be ignorant of me;

    and those who have not known me, let them know me[b],

    for I am knowledge and ignorance.'
  footnotes:
  - marker: a
    text: Ignorance here renders the Greek loan ἀγνωσία in Coptic; "unknowing" is a possible alternative that softens the pejorative connotation.
    reason: lexical_alternative
  - marker: b
    text: The provided OCR lines include phrases about a voice going out upon the earth, which likely belong to a different nearby passage. This translation follows the standard placement of the know/ignorance strophe in Thunder 4.
    reason: alignment_note
translation:
  language: ko
  text: '나를 아는 사람들은 나를 모른 체하십시오.

    그리고 나를 알지 못했던 사람들은 나를 알게 하십시오.

    왜냐하면 나는 지식과 무지이기 때문입니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모른 체하다’는 여기서 단순한 지식 부족이 아니라, 영어 POB가 지적한 ἀγνωσία의 강한 ‘무지/모름’의 뉘앙스를 살리려는 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지식’과 ‘무지’의 대립은 본문의 그리스어계 차용어 대구를 한국어에서 가장 또렷하게 드러냅니다. ‘앎/모름’도 가능하지만 문장 리듬은 약간 달라집니다.
    reason: lexical_alternative
