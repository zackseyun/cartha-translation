  source_fidelity: 초안의 ‘모른 체하십시오’는 ἀγνοεῖν(알지 못하다/무지하다)에 ‘알면서도 가장하다’라는 의도성을 추가하므로, 원문의 역설은 유지하되 그 함의는 제거해야 합니다. 또한 제공된 콥트어 OCR은 이 대목의 표준 본문과 맞지 않는 인접 구절을 포함하는 것으로 보이므로, 영어 POB 감사 기록처럼 표준 배치에 따른 번역임을 주석으로 밝혀야 합니다.
  naturalness: ‘나를 아는 이들은 나를 모르십시오’는 의도적으로 역설적인 명령을 자연스러운 현대 문어 합쇼체로 전달합니다. ‘나를 알지 못했던 이들은 나를 알게 하십시오’는 영어의 let them know me에 해당하는 허용·명령의 형태를 유지합니다.
  terminology: γνῶσις/ἀγνωσία의 대립은 ‘지식/무지’로 유지하는 것이 적절합니다. 이는 한국어에서도 명사 대구를 분명히 하며, 특정 교리적 해석을 덧붙이지 않습니다.
  issues:
