    text: ‘모르십시오’는 콥트어에 쓰인 그리스어계 동사 ἀγνοεῖν의 ‘알지 못하다, 무지하다’를 옮긴 것입니다. ‘모른 체하다’처럼 의도적으로 가장한다는 뜻은 본문에 명시되어 있지 않습니다.
