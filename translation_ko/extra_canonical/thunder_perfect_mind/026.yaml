theological_decisions:
- issue: 역설적 자의식 진술의 보존
  chosen_reading: 화자는 자신을 아는 이들에게조차 자신을 알지 말라고 말하며, 동시에 알지 못했던 이들에게는 자신을 알게 하라고 말하는 역설을 그대로 보존했습니다.
  alternative_readings:
  - 의미를 완화해 ‘나를 이해하지 말라’처럼 풀기
  - ‘모른 체하다’를 단순한 무지로 약화시키기
  rationale: 본문의 핵심은 ‘앎/모름’의 긴장을 극단적으로 뒤집는 데 있으므로, 문학적 충격을 줄이지 않고 한국어에서도 같은 역설이 드러나게 했습니다.
  doctrine_reference: 본문의 수사와 신비주의적 자아 진술을 보존하는 번역 원칙
- issue: ‘be ignorant of me’의 명령형 강도
  chosen_reading: ‘나를 모른 체하십시오’로 옮겨, 단순 상태가 아니라 의도적 비인식의 강도를 살렸습니다.
  alternative_readings:
  - ‘나를 모르십시오’
  - ‘나를 알지 마십시오’
  rationale: 영어 POB가 선택한 ‘be ignorant’의 날카로운 명령성을 반영하되, 한국어에서 지나치게 직역된 금지형보다 어투가 덜 평면적인 표현을 사용했습니다.
  doctrine_reference: Coptic/Greek loan의 반의어 대립 보존
