    issue: ‘모른 체하십시오’가 의도적 가장의 의미를 첨가함
    rationale: 원문의 ‘be ignorant of me’는 무지·알지 못함의 명령형 대립이지, 알고 있으면서 모르는 척한다는 행위를 명시하지 않습니다.
  - severity: medium
    issue: OCR 정렬 문제에 관한 영어 POB의 감사 주석이 한국어 주석에 반영되지 않음
    rationale: 제공된 OCR에는 ‘땅 위로 나아가는 소리’ 관련 어구가 보이며, 이는 이 표준 지식/무지 연의 본문과 일치하지 않습니다. 번역의 본문 근거를 투명하게 밝혀야 합니다.
  revised_text: '나를 아는 이들은 나를 모르십시오.[a]


    나를 알지 못했던 이들은 나를 알게 하십시오.


    나는 지식이며 무지이기 때문입니다.[b]'
  revised_footnotes:
