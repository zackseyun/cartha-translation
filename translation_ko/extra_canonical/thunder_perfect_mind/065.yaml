base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/065.yaml
  text: 'greatness in parts from smallness[a].

    For they know smallness from greatness.

    Why do you curse me and honor me?

    You have wounded, and you have shown mercy.

    Do not cast out the first things[c][b],'
  footnotes:
  - marker: a
    text: The OCR likely read ⲧⲙⲛⲧⲕⲟⲩⲉⲓ where ⲧⲙⲛⲧⲕⲟⲩⲓ (“smallness”) is expected in antithesis with “greatness.” Some editors read “understanding” here; the mapping is not certain.
    reason: alignment_note
  - marker: b
    text: ⲡⲟⲩϩⲧ is taken as “poverty” (hence wretchedness), but could be “affliction/destitution.” The prepositional complex “ⲉⲃⲟⲗ ⲛⲛϣⲟⲣⲡ” is rendered “from the beginnings” to preserve the temporal layering.
    reason: lexical_alternative
  - marker: c
    text: Or 'greatness in outlying places,\nin the smallness that grows old,[a]\nknow smallness, for\nit comes forth from the other greatness.\nDo not forget me,\nand do not cast me away.\nDo not gaze at me,\nnor bring poverty out against me from the beginnings.[b]'.
    reason: previous_rendering
translation:
  language: ko
  text: '크게는 부분들 안에 있고, 작음에서 비롯됩니다.

    왜냐하면 그들은 큼에서 작음을 알기 때문입니다.

    당신들은 왜 나를 저주하고 또 나를 존중합니까?

    당신들은 상처를 입혔고, 또 자비를 베푸셨습니다.

    첫것들을 버리지 마십시오.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲙⲛⲧⲛⲟϭ
  english_pob_choice: greatness
  chosen_korean: 크게는
  alternatives_korean:
  - 크기
  - 위대함
  lexicon: Crum, s.v. ⲛⲟϭ; abstract with ⲙⲛⲧ-
  rationale: ⲙⲛⲧ-가 만드는 추상 명사 계열을 살리되, 이 문맥에서는 뒤의 ‘작음’과의 대구가 핵심이므로 한국어에서는 명사보다 부사구처럼 자연스러운 ‘크게는’으로 옮겼습니다.
- source_word: ϩⲉⲛⲙⲉⲣⲟⲥ ⲉⲃⲟⲗ
  english_pob_choice: parts
  chosen_korean: 부분들 안에
  alternatives_korean:
  - 밖의 장소들에
  - 바깥 부분들에
  lexicon: Crum, s.v. ⲙⲉⲣⲟⲥ; ⲉⲃⲟⲗ
  rationale: ⲉⲃⲟⲗ ϩⲛ은 ‘~로부터/~안에’의 공간 대비를 이루므로, 영어의 ‘parts’보다 문맥상 관계를 살려 ‘부분들 안에’로 처리했습니다.
- source_word: ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  english_pob_choice: smallness
  chosen_korean: 작음
  alternatives_korean:
  - 작은 것
  - 보잘것없음
  lexicon: Crum, s.v. ⲕⲟⲩⲓ; abstract with ⲙⲛⲧ-
  rationale: 대조축이 분명한 추상어이므로 ‘작음’으로 두어 원문의 대칭성을 보존했습니다.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  english_pob_choice: they know
  chosen_korean: 그들은 …을 알기 때문입니다
  alternatives_korean:
  - 그들은 …을 압니다
  - 알고 있기 때문입니다
  lexicon: Crum, s.v. ⲥⲟⲩⲱⲛ
  rationale: 해당 절은 이유를 이루므로, 단순 진술보다 한국어 인과 표현이 더 자연스럽고 원문의 논리도 분명히 드러납니다.
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  english_pob_choice: you curse me
  chosen_korean: 당신들은 나를 저주하고
  alternatives_korean:
  - 당신들은 나를 비난하고
  - 당신들은 나를 헐뜯고
  lexicon: Crum, s.v. ⲥⲁϩⲟⲩ
  rationale: 수사적 대립을 강하게 만드는 동사이므로, 종교적·정서적 강도를 지닌 ‘저주하다’가 가장 직접적입니다.
- source_word: ⲧⲉⲧⲛⲧⲁⲉⲓⲟ
  english_pob_choice: you honor me
  chosen_korean: 또 나를 존중합니까
  alternatives_korean:
  - 또 나를 공경합니까
  - 또 나를 높입니까
  lexicon: Crum, s.v. ⲧⲁⲉⲓⲟ
  rationale: 원문은 ‘버리다’가 아니라 ‘존중/존귀하게 하다’의 대립이므로, 한국어에서도 호칭적 격조를 유지하는 ‘존중하다’로 옮겼습니다.
- source_word: ⲁⲧⲉⲧⲛϣⲱϥ
  english_pob_choice: you have wounded
  chosen_korean: 당신들은 상처를 입혔고
  alternatives_korean:
  - 당신들은 상하게 했고
  - 당신들은 폐허로 만들었고
  lexicon: Crum, s.v. ϣⲱϥ
  rationale: 완료 시상과 가해의 직접성을 살려, 행동 결과가 분명히 드러나는 표현을 택했습니다.
- source_word: ⲁⲧⲉⲧⲛⲛⲁ
  english_pob_choice: you have shown mercy
  chosen_korean: 또 자비를 베푸셨습니다
  alternatives_korean:
  - 또 긍휼을 보이셨습니다
  - 또 불쌍히 여기셨습니다
  lexicon: Crum, s.v. ⲛⲁ
  rationale: 완료형 대구를 살리면서도 한국어에서 가장 자연스럽게 은혜의 행위를 전달하는 표현으로 정리했습니다.
- source_word: ⲛⲛϣⲟⲣⲡ
  english_pob_choice: the first things
  chosen_korean: 첫것들
  alternatives_korean:
  - 처음 것들
  - 첫 일들
  lexicon: Crum, s.v. ϣⲟⲣⲡ
  rationale: ‘첫것들’은 다소 낯설지만 원문의 시간적·서열적 뉘앙스를 가장 압축적으로 보존합니다.
theological_decisions:
- issue: 2인칭 복수 화행의 직접성
  chosen_reading: 수신자들을 향한 강한 수사적 질책과 반전을 그대로 살려 ‘당신들은 …’의 반복으로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 ‘여러분은 …’
  - 서사적 일반화
  rationale: 원문은 대구와 역설로 긴장을 만드는 시적 발화이므로, 완곡화하면 수사적 힘이 약해집니다.
  doctrine_reference: 문학적-수사적 충실성
- issue: ‘저주/존중/상처/자비’의 대비 보존
  chosen_reading: 긍정과 부정이 한 줄 안에서 교차하는 구조를 유지해, 단순한 감정 묘사가 아니라 모순적 인식의 역설로 드러냈습니다.
  alternative_readings:
  - 감정 중심으로 재배열
  - 의미를 평탄화한 설명체
  rationale: 이 단락의 핵심은 대비의 폭발이므로, 의미를 정돈하기보다 긴장을 보존하는 편이 원문 의도에 더 가깝습니다.
  doctrine_reference: 시적 역설의 보존
