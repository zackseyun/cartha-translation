  yaml_path: translation/extra_canonical/thunder_perfect_mind/023.yaml
  text: 'Those who lie about me tell the truth about me.[a]

    Those who know me[a], let them be ignorant of me,

    and those who have not known me—let them know me.

    For I am knowledge and ignorance[b].

    I am—'
  footnotes:
  - marker: a
    text: The reading of the opening string ⲧⲁⲧϭⲉⲃⲟⲗⲉⲩⲟⲉⲓⲭⲉⲧⲙⲃⲉⲓⲟⲉⲓ is uncertain due to OCR concatenation. I render ϭⲉ/ϭⲱ + ⲃⲟⲗ as “cry/speak out openly,” consistent with Thunder’s recurring summons to hearers.
    reason: alignment_note
  - marker: a
    text: Or 'I have cried out openly.[a]'.
    reason: previous_rendering
  - marker: b
    text: Or 'Those who know me will know me,'.
    reason: previous_rendering
translation:
  language: ko
  text: '저에 대해 거짓말하는 자들은 저에 대해 진실을 말합니다.[a]

    저를 아는 자들은 저를 알지 못하게 하십시오,

    그리고 저를 알지 못한 자들은 저를 알게 하십시오.

    왜냐하면 저는 지식과 무지[b]이기 때문입니다.

    저는—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 초두의 OCR 문자열은 크게 훼손되어 있으며, POB는 이를 ‘저에 대해 거짓말하는 자들은 저에 대해 진실을 말합니다’로 복원해 옮깁니다.
    reason: source_note
  - marker: b
    text: POB의 ‘knowledge / ignorance’ 대조를 따랐습니다. 여기서 ‘무지’는 단순한 지적 결핍보다 ‘알지 못함’의 역설적 상태를 가리킵니다.
    reason: lexical_alternative
