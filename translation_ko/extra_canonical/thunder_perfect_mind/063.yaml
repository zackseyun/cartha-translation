translation:
  language: ko
  text: 그러나 당신들이 나타날 때마다, 나는 당신들에게서 나 자신을 숨길 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: 당신들이 자신을 드러낼 때마다, 나는 당신들에게서 물러날 것입니다.'
    reason: lexical_alternative
  - marker: b
    text: 이 행은 일반적으로 함께 전승되는 역설적 한 쌍의 절반입니다(“당신들이 숨을 때, 나는 나타날 것이다” / “당신들이 나타날 때, 나는 숨을 것이다”).
    reason: cross_reference
lexical_decisions:
- source_word: ⲇⲉ / but
  english_pob_choice: But whenever you appear
  chosen_korean: 그러나 당신들이 나타날 때마다
  alternatives_korean:
  - 그리고 당신들이 나타날 때마다
  - 하지만 당신들이 나타날 때마다
  lexicon: Coptic particle ⲇⲉ in the adjudicated source line; English POB revision from “For” to “But”
  rationale: 원문의 ⲇⲉ는 원인절이 아니라 대조를 이루는 접속사이므로, 한국어도 ‘그러나’로 옮겨 앞행과의 역설적 대조를 살렸습니다.
- source_word: ⲟⲩⲟⲉⲓⲉ
  english_pob_choice: appear
  chosen_korean: 나타날 때마다
  alternatives_korean:
  - 드러날 때마다
  - 보일 때마다
  - 드러내 보일 때마다
  lexicon: Crum, s.v. ouoeie
  rationale: ‘appear’의 직접적 의미를 따라, 신비적 문맥의 과도한 해석 없이 ‘나타나다’로 옮겨 역설의 긴장을 유지했습니다.
- source_word: ⲥⲧⲟ
  english_pob_choice: conceal myself
  chosen_korean: 나 자신을 숨길 것입니다
  alternatives_korean:
  - 나 자신을 감출 것입니다
  - 숨을 것입니다
  - 나를 숨길 것입니다
  lexicon: Crum, s.v. sto
  rationale: ‘conceal myself’의 능동적 자기-은폐를 한국어에서도 분명히 보이기 위해 ‘나 자신을 숨기다’로 옮겼습니다.
theological_decisions:
- issue: 대조적 역설 구조의 보존
  chosen_reading: 앞절의 ‘숨다/나타나다’와 짝을 이루는 역설을 한국어에서도 직접적으로 드러내기 위해 ‘그러나 … 나타날 때마다, 나는 … 숨길 것입니다’로 유지했습니다.
  alternative_readings:
  - ‘그리고 … 나타날 때마다’처럼 중립적으로 연결하는 읽기
  - ‘나타내 보일 때마다’처럼 해석을 덧붙이는 읽기
  rationale: 이 구절은 앞뒤 행과 함께 역설적 평행을 이루므로, 연결어를 약화시키거나 의미를 풀어 쓰면 시적 긴장이 사라집니다.
  doctrine_reference: 본문의 수사적 평행과 역설 구조
