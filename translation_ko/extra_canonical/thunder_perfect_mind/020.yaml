base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/020.yaml
  text: Why[a], you who hate me, do you love me, and hate those who love me? You who deny me, confess me[b], and you who confess me, deny me[e][d][c]. You who say—
  footnotes:
  - marker: a
    text: The opening “Concerning those who hate me” construes ⲉⲧⲃⲉ as topical; ⲡⲁⲣⲁⲛ is likely a carryover from the previous line and is not translated here due to uncertainty.
    reason: alignment_note
  - marker: b
    text: “Confess” translates ϩⲟⲙⲟⲗⲟⲅⲉⲓ (Gk. ὁμολογέω); “acknowledge” or “profess” are possible alternatives.
    reason: lexical_alternative
  - marker: c
    text: “Deny” renders ⲁⲣⲛⲁ; “disown” or “renounce” could also fit depending on register.
    reason: lexical_alternative
  - marker: d
    text: 'Or ''Concerning those who hate me[a]: you know me, and you hate those who know me.''.'
    reason: previous_rendering
  - marker: e
    text: Or 'Those who deny me confess me, and those who confess me deny me. Those who say—'.
    reason: previous_rendering
translation:
  language: ko
  text: 왜, 나를 미워하는 너희가 나를 사랑하며, 나를 사랑하는 이들을 미워합니까? 나를 부정하는 너희는 나를 고백하고, 나를 고백하는 너희는 나를 부정합니다. 너희는 말합니다—[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲉⲧⲃⲉ ⲟⲩ는 여기서 ‘왜?’로 읽는 것이 적절하며, 단순한 ‘~에 관하여’가 아닙니다.
    reason: source_note
  - marker: b
    text: ⲙⲉ는 ‘알다’가 아니라 ‘사랑하다’입니다.
    reason: source_note
  - marker: c
    text: ⲁⲣⲛⲁ는 ‘부정하다’가 직접적 의미입니다.
    reason: source_note
  - marker: d
    text: ϩⲟⲙⲟⲗⲟⲅⲉⲓ는 그리스어 ὁμολογέω 계열의 차용어로 ‘고백하다’입니다.
    reason: source_note
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  english_pob_choice: Why
  chosen_korean: 왜
  alternatives_korean:
  - 무슨 까닭으로
  - 어째서
  lexicon: Crum 472a
  rationale: 문두의 ⲉⲧⲃⲉ ⲟⲩ는 단순한 주제표시가 아니라 ‘왜?’라는 의문으로 읽는 것이 원문과 POB 수정판에 부합합니다.
- source_word: ⲙⲟⲥⲧⲉ
  english_pob_choice: hate
  chosen_korean: 미워하는
  alternatives_korean:
  - 증오하는
  - 싫어하는
  lexicon: Crum 195a
  rationale: 기본 의미는 ‘미워하다’이며, 여기서는 현재 분사적 관계절로 처리해 직접적인 호격 수식처럼 살렸습니다.
- source_word: ⲙⲉ
  english_pob_choice: love
  chosen_korean: 사랑하며
  alternatives_korean:
  - 좋아하며
  - 애정하며
  lexicon: Crum 155b
  rationale: ⲙⲉ는 ‘알다’가 아니라 ‘사랑하다’이므로, POB의 정정에 따라 ‘사랑하다’로 옮겼습니다.
- source_word: ⲁⲣⲛⲁ / ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  english_pob_choice: deny / confess
  chosen_korean: 부정하다 / 고백하다
  alternatives_korean:
  - 부인하다 / 인정하다
  - 저버리다 / 공언하다
  lexicon: Crum 19b; Crum 710a
  rationale: ⲁⲣⲛⲁ는 ‘부정하다’, ϩⲟⲙⲟⲗⲟⲅⲉⲓ는 ‘고백하다’가 가장 직접적입니다. 신앙적 고백의 뉘앙스를 유지하되 한국어에서는 ‘고백하다’가 원문의 공적 선언성을 잘 드러냅니다.
- source_word: ⲛⲉⲧϫⲉ
  english_pob_choice: You who say—
  chosen_korean: 너희는 말합니다—
  alternatives_korean:
  - 말하는 너희는—
  - 너희가 말합니다—
  lexicon: Crum 596b (ϫⲉ)
  rationale: 수정판이 지적하듯 뒤 문장은 2인칭 복수 호격으로 이어지므로, 한국어도 독립 절로 옮겨 2인칭 복수의 직접성을 유지했습니다.
theological_decisions:
- issue: 호격과 명령형의 직접성
  chosen_reading: 문장을 제3인칭 진술로 완화하지 않고, ‘너희’에게 직접 말하는 형식으로 옮겼습니다.
  alternative_readings:
  - 그 사람들은 …
  - 그들은 …
  rationale: 원문은 상대를 직접 호명하며 역설적 명령/질문을 던지는 구조이므로, 수사적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 수사적 직접화와 화행 보존
- issue: 고백/부정의 상호전도
  chosen_reading: ‘고백하다’와 ‘부정하다’를 그대로 유지해 반복되는 역설을 살렸습니다.
  alternative_readings:
  - 인정하다/거부하다
  - 시인하다/배척하다
  rationale: POB의 auditable 수정은 단순 대조가 아니라 상호 전도된 역설을 드러내므로, 한국어에서도 신앙적 고백의 어휘를 유지하는 편이 원문 의미에 충실합니다.
  doctrine_reference: 역설적 대구법
