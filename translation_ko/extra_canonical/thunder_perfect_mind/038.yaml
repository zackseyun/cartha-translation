  text: Do not hate my obedience[a][c], and do not set your love upon my self-control[b].
  footnotes:
  - marker: a
    text: Or “submission.” The Coptic ϭⲟⲟⲃ can denote obedience or being subject.
    reason: lexical_alternative
  - marker: b
    text: Or “chastity.” ⲥⲧⲱⲧ often carries the sense of enkrateia (restraint), sometimes specifically sexual restraint.
    reason: lexical_alternative
  - marker: c
    text: The OCR for this block also shows ⲫⲟⲃⲟⲥ (“fear”) and ⲧⲟⲡⲟⲥ (“place”), which may belong to adjoining lines rather than this pair; the prohibitions are supplied by the recurring pattern in this section.
    reason: alignment_note
translation:
  language: ko
  text: 저의 순종을 미워하지 말고, 저의 절제에 사랑을 두지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ϭⲟⲟⲃ
  english_pob_choice: obedience
  chosen_korean: 순종
  alternatives_korean:
  - 복종
  - 항복
  lexicon: Crum (Sahidic Coptic)
  rationale: ϭⲟⲟⲃ는 ‘obedience’ 또는 ‘being subject’의 뜻을 가지므로, 소유 구문에서는 자연스럽고 직접적인 ‘순종’이 적절합니다.
- source_word: ⲥⲧⲱⲧ
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자기통제
  - 정절
  lexicon: Crum (Sahidic Coptic)
  rationale: 윤리적 문맥에서 ⲥⲧⲱⲧ는 억제/절제를 뜻하므로, POB의 ‘self-control’을 한국어 합쇼체로 간명하게 옮기기 위해 ‘절제’를 택했습니다.
- source_word: do not hate / do not set your love upon
  english_pob_choice: Do not hate / do not set your love upon
  chosen_korean: 미워하지 말고 / 사랑을 두지 마십시오
  alternatives_korean:
  - 미워하지 마십시오 / 사랑하지 마십시오
  - 미워하지 말고 / 사랑하지 마십시오
  lexicon: English POB audit trail
  rationale: 후반의 ‘set your love upon’은 단순한 감정의 ‘사랑하다’보다 대상에 애정을 두고 집착하는 행위를 드러내므로, ‘사랑을 두다’로 번역해 동사의 방향성을 살렸습니다.
