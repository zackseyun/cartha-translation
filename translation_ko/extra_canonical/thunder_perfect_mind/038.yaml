    reason: alignment_note
translation:
  language: ko
  text: 저의 순종을 미워하지 말고[a][c], 저의 절제에 애정을 두지 마십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “복종.” 콥트어 ϭⲟⲟⲃ는 순종 또는 복종해 있는 상태를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “정절.” ⲥⲧⲱⲧ는 흔히 엔크라테이아, 곧 억제 또는 절제의 뜻을 지니며, 때로는 특히 성적 절제를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 블록의 OCR에는 ⲫⲟⲃⲟⲥ(“두려움”)와 ⲧⲟⲡⲟⲥ(“장소”)도 보입니다. 이 낱말들은 이 두 구절이 아니라 인접 행에 속할 수 있으며, 여기의 금지 명령문은 이 부분에서 반복되는 문형에 따라 보완되었습니다.
    reason: alignment_note
