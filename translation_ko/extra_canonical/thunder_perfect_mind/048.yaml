base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/048.yaml
  text: And you have called me “Lawlessness.” I am she whom you pursued[a]; and I am the one you have seized; I am she whom you scattered[g][f][e][d][c][b], and you have known.
  footnotes:
  - marker: a
    text: ‘Lawlessness’ renders anomia; alternatives include ‘law‑breaking’ or ‘iniquity,’ but these either soften or theologize the charge-title.
    reason: lexical_alternative
  - marker: b
    text: OCR shows ⲛⲥⲱⲥ (‘after him/her’), but Thunder’s formula and nearby ⲙⲙⲟⲉⲓ (‘me’) suggest ⲛⲥⲁⲓ (‘after me’). Rendering keeps ‘me’ while noting possible OCR error.
    reason: alignment_note
  - marker: c
    text: ϫⲟⲟⲩ ⲉⲃⲟⲗ can be ‘cry out’ or ‘proclaim’ with an outward/public nuance; ‘proclaimed openly’ is a valid alternative.
    reason: lexical_alternative
  - marker: d
    text: Or 'And do not call me “lawlessness.”'.
    reason: previous_rendering
  - marker: e
    text: Or 'I am the one you have chased after me;'.
    reason: previous_rendering
  - marker: f
    text: Or 'I am the one you have cried out openly—'.
    reason: previous_rendering
  - marker: g
    text: Or 'and you did not know.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희는 나를 「무법」이라 불렀습니다. 나는 너희가 추적한 그녀이며[a], 나는 너희가 붙잡은 그 사람이며, 나는 너희가 흩어 버린 그녀입니다[b][c], 그리고 너희는 알았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘추적한’은 Coptic ⲡⲱⲧ의 뒤쫓음/추적 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문 전승의 최신 교정에 따르면 ϫⲟⲟⲩ ⲉⲃⲟⲗ은 ‘흩다/분산시키다’의 뜻이며, ‘외쳐 부르다’가 아닙니다.
    reason: textual_variant
  - marker: c
    text: 마지막 동사는 완료형으로, ‘너희는 알았습니다’라고 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲁⲛⲟⲙⲓⲁ / anomia
  english_pob_choice: Lawlessness
  chosen_korean: 「무법」
  alternatives_korean:
  - 법 없음
  - 불법
  - 불의
  lexicon: Greek loanword anomia via Coptic; Crum; LSJ
  rationale: 전통적 교회어인 ‘불법’보다, 이 장면의 직설적 호칭-명칭 기능을 살려 ‘무법’으로 옮겨 비난의 날카로움을 유지했습니다.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  english_pob_choice: you pursued
  chosen_korean: 너희가 추적한
  alternatives_korean:
  - 너희가 पीछ pursued한
  - 너희가 쫓은
  - 너희가 뒤쫓은
  lexicon: Crum; Layton
  rationale: ⲡⲱⲧ의 추적/뒤쫓음 의미를 살려 관계절의 지속적 पीछ pursuit 감각을 유지했습니다.
- source_word: ⲙⲁϩⲧⲉ
  english_pob_choice: you have seized
  chosen_korean: 너희가 붙잡은
  alternatives_korean:
  - 너희가 움켜잡은
  - 너희가 사로잡은
  - 너희가 붙든
  lexicon: Crum
  rationale: 물리적이면서도 강한 포획 감각을 살리되, 한국어에서 가장 자연스럽고 직접적인 동사로 ‘붙잡다’를 택했습니다.
- source_word: ϫⲟⲟⲩ ⲉⲃⲟⲗ
  english_pob_choice: scattered
  chosen_korean: 흩어 버린
  alternatives_korean:
  - 분산시킨
  - 내어 보낸
  - 퍼뜨린
  lexicon: Crum
  rationale: 최신 교정에 따라 ‘외쳐 부르다’가 아니라 ‘흩다/분산시키다’의 의미로 반영했고, 결과의 강도를 위해 ‘버리다’를 덧붙였습니다.
- source_word: ⲥⲟⲟⲩⲛ
  english_pob_choice: you have known
  chosen_korean: 알았습니다
  alternatives_korean:
  - 알게 되었습니다
  - 알았습니다만
  - 인식했습니다
  lexicon: Crum
  rationale: 완료상에 해당하는 인식의 성립을 자연스러운 서술로 옮겼습니다.
theological_decisions:
- issue: 화자의 성별 지시를 한국어에서 어떻게 유지할지
  chosen_reading: 원문의 여성형 자기지시를 따라 ‘나는 추적한 그녀’/‘흩어 버린 그녀’로 유지했습니다.
  alternative_readings:
  - 성중립적으로 ‘나는 너희가 추적한 이’
  - 남성형 중립 대명사로 완화
  rationale: 이 단락은 여성형 시적 자아를 반복적으로 전면화하므로, 이를 지우면 원문의 문학적 구조와 목소리가 약해집니다.
  doctrine_reference: 문학적 화자 표지 보존
- issue: ⲁⲛⲟⲙⲓⲁ를 종교적 용어로 완화할지
  chosen_reading: ‘무법’으로 직역해 고발적 호칭성을 유지했습니다.
  alternative_readings:
  - 불법
  - 죄악
  - 악
  rationale: 원문은 추상적 신학어보다 상대를 향한 도전적 낙인에 가깝기 때문에, 한국어에서도 그 충돌감을 살렸습니다.
  doctrine_reference: 어휘적-수사적 긴장 보존
