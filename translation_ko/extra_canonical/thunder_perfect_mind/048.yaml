  - 인식했습니다
  lexicon: Crum
  rationale: 완료상에 해당하는 인식의 성립을 자연스러운 서술로 옮겼습니다.
theological_decisions:
- issue: 화자의 성별 지시를 한국어에서 어떻게 유지할지
  chosen_reading: 원문의 여성형 자기지시를 따라 ‘나는 추적한 그녀’/‘흩어 버린 그녀’로 유지했습니다.
  alternative_readings:
  - 성중립적으로 ‘나는 너희가 추적한 이’
  - 남성형 중립 대명사로 완화
  rationale: 이 단락은 여성형 시적 자아를 반복적으로 전면화하므로, 이를 지우면 원문의 문학적 구조와 목소리가 약해집니다.
  doctrine_reference: 문학적 화자 표지 보존
- issue: ⲁⲛⲟⲙⲓⲁ를 종교적 용어로 완화할지
  chosen_reading: ‘무법’으로 직역해 고발적 호칭성을 유지했습니다.
  alternative_readings:
  - 불법
  - 죄악
  - 악
  rationale: 원문은 추상적 신학어보다 상대를 향한 도전적 낙인에 가깝기 때문에, 한국어에서도 그 충돌감을 살렸습니다.
  doctrine_reference: 어휘적-수사적 긴장 보존
