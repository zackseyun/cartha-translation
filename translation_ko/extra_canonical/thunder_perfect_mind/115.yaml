  yaml_path: translation/extra_canonical/thunder_perfect_mind/115.yaml
  text: I am the name cried out among those who are dead; and I am the one who is present—alone and in unity. The one who will judge me by the law—
  footnotes:
  - marker: '1'
    text: The OCR shows ⲡⲓⲛⲁ, but context and common Thunder diction suggest ⲡⲓⲣⲁⲛ (“the name”).
    reason: alignment_note
  - marker: '2'
    text: ⲧⲱⲱⲛ + ⲉⲃⲟⲗ can mean ‘cast out’ or ‘proclaimed out’; ‘cried out’ was chosen to preserve the audible/voiced motif.
    reason: lexical_alternative
  - marker: '3'
    text: The OCR reads ⲛⲉⲗⲟⲥ; I take this as ⲛⲟⲙⲟⲥ (Greek ‘law’). If this is wrong, the juridical sense would change.
    reason: alignment_note
  - marker: '4'
    text: I read ⲙⲛⲧⲟⲩⲁⲁⲧ (‘unity’). Alternatives like ‘oneness’ are possible; the OCR may have dropped ⲟⲩ.
    reason: lexical_alternative
  - marker: a
    text: Or 'solitary and as unity'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 죽은 자들 가운데서 외쳐진 이름입니다. 또한 나는 홀로 있으면서도 하나됨 안에 있는 자입니다. 율법으로 나를 심판할 자는…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역 가능성: ‘솔로이면서 하나됨으로’.'
    reason: previous_rendering
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  english_pob_choice: I am
  chosen_korean: 나는
  alternatives_korean:
  - 나는 ~입니다
  - 내가
  lexicon: Coptic 기본 인칭 서술 형식
  rationale: 반복되는 자기 선언의 리듬을 살리되, 한국어에서는 서술어를 뒤에 두는 자연스러운 합쇼체로 옮겼습니다.
- source_word: '(ⲡⲓ)ⲣⲁⲛ (OCR: ⲡⲓⲛⲁ)'
  english_pob_choice: the name
  chosen_korean: 이름
  alternatives_korean:
  - 그 이름
  - 이 이름
  lexicon: Coptic ⲣⲁⲛ ‘name’
  rationale: POB가 OCR 보정에 따라 ‘the name’으로 읽은 점을 반영해, 한국어에서는 관사 없이도 명사만으로 충분한 ‘이름’을 택했습니다.
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  english_pob_choice: cried out
  chosen_korean: 외쳐진
  alternatives_korean:
  - 외쳐진 채
  - 소리쳐 나온
  lexicon: Coptic 동사 어근 tⲱⲛ/tⲱⲱⲛ + ⲉⲃⲟⲗ
  rationale: ‘cast out’나 ‘proclaimed’보다, POB 주석이 밝힌 청각적 강세를 살려 수동적 결과 상태인 ‘외쳐진’으로 옮겼습니다.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  english_pob_choice: among those who are dead
  chosen_korean: 죽은 자들 가운데서
  alternatives_korean:
  - 죽은 자들 중에서
  - 죽은 자들 안에서
  lexicon: Coptic ϩⲛ + 상대복수 구성
  rationale: 상대절의 복수성을 살리면서 한국어에서는 공간적 포함을 드러내는 ‘가운데서’가 가장 자연스럽습니다.
- source_word: ⲟⲩⲁⲁⲧ / ⲙⲛⲧⲟⲩⲁⲁⲧ
  english_pob_choice: alone and in unity
  chosen_korean: 홀로 있으면서도 하나됨 안에 있는
  alternatives_korean:
  - 홀로이며 하나됨 안에 있는
  - 고독하면서도 하나인
  lexicon: Coptic ⲟⲩⲁⲁⲧ, ⲙⲛⲧⲟⲩⲁⲁⲧ
  rationale: POB가 보존한 역설을 한국어에서도 분리해 두 요소로 살렸고, ‘하나됨’은 단순한 수량이 아니라 관계적 통일성을 드러냅니다.
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ ϩⲁ ⲡⲓ ⲛⲟⲙⲟⲥ
  english_pob_choice: The one who will judge me by the law
  chosen_korean: 율법으로 나를 심판할 자
  alternatives_korean:
  - 율법에 따라 나를 심판할 자
  - 법으로 나를 심판할 자
  lexicon: Greek loan νόμος in Coptic; κρίνειν
  rationale: POB의 ‘law’를 한국어 성경 관용에 맞춰 ‘율법’으로 옮기되, 심판의 기준/수단 관계는 조사 ‘으로’로 간결하게 표시했습니다.
theological_decisions:
- issue: 역설적 자기 규정(‘홀로’와 ‘하나됨’)의 보존
  chosen_reading: 서로 긴장하는 두 표현을 그대로 유지해, 단순한 고독이 아니라 존재론적 역설로 읽히게 했습니다.
  alternative_readings:
  - ‘고독하지만 하나인’으로 평준화
  - ‘혼자이면서도 하나’로 약화
  rationale: 이 단락은 모순적 자기 진술의 힘이 핵심이므로, 해소하지 않고 병렬로 유지하는 편이 원문 의도에 가깝습니다.
  doctrine_reference: 수사적 역설 보존 원칙
- issue: ‘율법’의 법정적 뉘앙스
  chosen_reading: POB의 ‘law’를 ‘율법’으로 두어, 단순한 일반법이 아니라 규범적·심판적 기준이라는 느낌을 살렸습니다.
  alternative_readings:
  - ‘법’
  - ‘규범’
  rationale: Coptic의 νόμος 계열은 이 문맥에서 재판 기준을 가리키므로, 한국어 성경 번역에서 더 강한 법정적 어감을 주는 ‘율법’이 적절합니다.
  doctrine_reference: 문맥적 법정 의미 보존
