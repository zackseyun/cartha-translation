  rationale: ϩⲱⲧ ⲧⲏⲩⲧⲛ̄는 ‘alone’보다 ‘also/too’의 강조로 이해하는 것이 타당하므로, 강조된 2인칭 복수를 자연스러운 한국어로 옮겼습니다.
