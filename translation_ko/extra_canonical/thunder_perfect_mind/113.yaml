  lexicon: Crum s.v. ⲧⲱⲱⲛ; ⲉⲃⲟⲗ
  rationale: 이 결합은 ‘밖으로 드러내어 지시하다’는 방향성을 가지므로, 한국어로는 ‘드러내 보이는’이 가장 무리 없이 원문의 기능을 반영합니다.
