  naturalness: 단편의 말줄임표는 원문 보존 상태를 잘 드러냅니다. 다만 ‘너희에게 … 너는 들었습니다’는 합쇼체 종결과 친근한 대명사가 충돌합니다. 원문의 복수 대 단수 전환은 유지하되, 현대 격식체에 맞게 ‘여러분에게 … 당신은 들었습니다’로 하는 것이 낫습니다.
  terminology: ⲕⲟⲗⲁⲥⲓⲥ의 ‘형벌’은 중립적이며 적절합니다. ‘찬양’은 ⲥⲁⲙⲟⲩ에 가능한 번역이지만, 해당 OCR 첫 조각의 정확한 형태와 경계가 불확실하므로 단편 명사구로만 제시해야 합니다.
