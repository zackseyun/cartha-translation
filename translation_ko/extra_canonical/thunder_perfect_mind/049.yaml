  lexicon: Crum, Coptic Dictionary
  rationale: 이 동사는 ‘밖으로 흩다/흩어 버리다’의 감각이 강하므로, 결과의 분명함을 살려 ‘흩어 버린’으로 번역했습니다.
- source_word: ϣⲓⲡⲉ
  english_pob_choice: ashamed
  chosen_korean: 부끄러워하던
  alternatives_korean:
