  rationale: ⲁⲙⲁϩⲧⲉ는 ‘붙잡다/사로잡다’의 뜻이므로, 문맥의 폭력을 과장하지 않으면서도 행위의 직접성을 살리기 위해 ‘붙잡은’으로 옮겼습니다.
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
