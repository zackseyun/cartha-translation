  yaml_path: translation/extra_canonical/thunder_perfect_mind/049.yaml
  text: And I am she whom you seized[a]. I am she whom you scattered, and you gathered me in. I am she before whom you were ashamed[b][c][d], and you were shameless toward me.
  footnotes:
  - marker: a
    text: “In Egypt” is inferred from context; the fragment shows the feminine locative ϩⲏⲧⲥ (“within her”), with the feminine noun ‘Egypt’ (ⲕⲏⲙⲉ) not visible here.
    reason: alignment_note
  - marker: d
    text: Coptic ⲣⲁⲧϣⲓ literally means “people of (another) speech/tongue.” We render it as “barbarians” to preserve the stark cultural contrast; “foreigners” is a viable alternative.
    reason: cultural_note
    anchor_ref: b
  - marker: c
    text: 'Or: “among the foreigners.”'
    reason: lexical_alternative
    anchor_ref: b-alt
  - marker: b
    text: Or 'I am the one whose image is great in Egypt[a], and I am the one without an image among the barbarians[b].'.
    reason: previous_rendering
    anchor_ref: c
translation:
  language: ko
  text: 그리고 나는 너희가 붙잡은 그 여자입니다. 나는 너희가 흩어 버린 그 여자입니다. 너희는 나를 안으로 모았습니다. 나는 너희가 부끄러워하던 그 여자입니다. 그런데 너희는 나를 향해 부끄러움 없이 행동했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic 동사들은 각각 ‘붙잡다’, ‘흩다’, ‘모으다’, ‘부끄러워하다/부끄러움이 없다’의 연속을 이룹니다.
    reason: source_note
  - marker: b
    text: ‘부끄러움 없이 행동했습니다’는 Coptic ⲣⲁⲧϣⲓ의 문자적 뜻인 ‘부끄러움이 없는’에서 풀어 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
