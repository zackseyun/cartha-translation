translation:
  language: ko
  text: 그리고 나는 너희가 붙잡은 여인입니다. 나는 너희가 흩어 버렸고 안으로 모아들인 여인입니다. 나는 너희가 부끄러워한 여인입니다. 그리고 너희는 나를 향해서는 수치심 없이 행동했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲣⲁⲧϣⲓ는 문자적으로 ‘수치심이 없는’이라는 뜻입니다. 문맥에 따라 ‘뻔뻔하게’로도 옮길 수 있으나, 여기서는 앞 절의 ‘부끄러워한’과의 대조를 보존하여 ‘수치심 없이’로 옮겼습니다.
    reason: lexical_alternative
