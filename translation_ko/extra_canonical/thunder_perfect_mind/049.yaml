  lexicon: Crum, Coptic Dictionary
  rationale: ⲣϣⲓⲡⲉ 계열은 단순한 감정 이상의 ‘수치/부끄러움’ 상태를 가리키므로, 능동적 감정을 자연스럽게 드러내는 ‘부끄러워하던’으로 옮겼습니다.
- source_word: ⲣⲁⲧϣⲓ
  english_pob_choice: shameless
