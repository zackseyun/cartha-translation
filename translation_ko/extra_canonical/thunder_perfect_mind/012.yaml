base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/012.yaml
  text: I am the midwife and she who does not give birth[a]. I am the comfort of my labor pains. I am the bride and the bridegroom[d][c][b]. I am the mother of my father and the sister of my husband.
  footnotes:
  - marker: a
    text: Many English traditions read “whose wedding is great.” The present OCR does not clearly show an adjective; pending collation may restore it.
    reason: alternative_reading
  - marker: b
    text: If a noun for ‘husband’ (e.g., ⲣⲱⲙⲉ ‘man/husband’) is confirmed in a better witness, “has not been married” could be tightened to “have not taken a husband.”
    reason: lexical_alternative
  - marker: c
    text: Subsequent lines in the OCR (virgin/mother; male/female) likely belong to adjacent ‘I am’ paradoxes and are excluded here due to block mapping.
    reason: alignment_note
  - marker: d
    text: Or 'In the wedding I am the bride, and I am she who has not been married.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 산파이며, 해산하지 않는 자입니다. 나는 내 산고의 위로입니다. 나는 신부이자 신랑입니다. 나는 내 아버지의 어머니이며 내 남편의 누이입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic OCR는 이 구절을 혼례 장면으로 읽는 전통 번역과 달리, 여기서는 ‘산파’와 ‘해산하지 않는 자’로 읽게 합니다. 더 나은 사본 대조에서는 다른 독해가 가능할 수 있습니다.
    reason: source_note
  - marker: b
    text: 이 행은 원문에서 여성·남성의 역설적 병치를 이루는 표현으로, 성별 역할의 긴장을 의도적으로 보존합니다.
    reason: theological_note
lexical_decisions:
- source_word: ⲧⲙⲉⲥⲓⲱ
  english_pob_choice: the midwife
  chosen_korean: 산파
  alternatives_korean:
  - 조산사
  - 해산을 돕는 여자
  lexicon: Coptic noun in the wedding/paradox sequence; English POB adjudication identifies it as 'midwife'
  rationale: Coptic과 영어 확정 번역이 모두 ‘midwife’를 지시하므로, 현대 한국어에서는 가장 자연스럽고 직역성 있는 ‘산파’를 택했습니다.
- source_word: ⲙⲁⲥⲙⲓⲥⲉ
  english_pob_choice: does not give birth
  chosen_korean: 해산하지 않는 자
  alternatives_korean:
  - 아이를 낳지 않는 자
  - 출산하지 않는 자
  lexicon: Negated birth/giving-birth verb in the Coptic line
  rationale: 문맥상 ‘아이를 낳지 않는다’보다 출산 행위를 직접 부정하는 표현이 더 가깝기 때문에, 문어체로 ‘해산하지 않는 자’라고 옮겼습니다.
- source_word: ⲡⲥⲟⲗⲥⲗ ⲛⲛⲁⲛⲁⲁⲕⲉ
  english_pob_choice: the comfort of my labor pains
  chosen_korean: 내 산고의 위로
  alternatives_korean:
  - 내 진통의 위로
  - 내 해산의 위로
  lexicon: Coptic noun phrase for solace/comfort in childbirth pains
  rationale: ‘산고’는 산통의 고통을 자연스럽게 담고, ‘위로’는 원문의 안정/완화의 의미를 살립니다. 영어의 ‘labor pains’도 이를 뒷받침합니다.
- source_word: ⲧⲥϩⲓⲙⲉ / ⲧⲁⲛⲏⲣ
  english_pob_choice: the bride and the bridegroom
  chosen_korean: 신부이자 신랑
  alternatives_korean:
  - 신부와 신랑
  - 혼례의 신부와 신랑
  lexicon: Standard wedding-paradox terminology in the Coptic/English tradition
  rationale: 병렬적 자기동일 선언을 유지하기 위해 ‘~이자 ~’ 구성을 썼고, 기존 교회어휘를 따르되 문체는 현대적으로 정리했습니다.
theological_decisions:
- issue: 이 본문의 여성적 자아 화자와 결합된 역설 표현
  chosen_reading: 화자가 스스로를 산파·신부·신랑·어머니·누이로 겹쳐 말하는 역설을 그대로 살렸습니다.
  alternative_readings:
  - 비유적 수사로 약화하여 일반적 지혜의 목소리로 완화
  - 성별 역설을 일부 중화
  rationale: Thunder, Perfect Mind의 핵심은 정체성의 역설적 자기선언이므로, 성별과 역할의 긴장을 완화하지 않고 직접적으로 드러내는 편이 원문 효과에 가깝습니다.
  doctrine_reference: '문학적-신학적 독해: 영지주의 문헌의 수사 구조와 자기-역설 표현'
- issue: ⲧⲙⲉⲥⲓⲱ의 의미를 ‘산파’로 확정하는 문제
  chosen_reading: 영어 POB의 판정과 Coptic 문맥을 따라 ‘산파’로 옮겼습니다.
  alternative_readings:
  - 신부
  - 산모
  - 해산하는 여자
  rationale: 주변 어휘가 출산과 고통을 가리키므로, ‘신부’보다 ‘산파’가 어휘적으로도 문맥적으로도 더 강합니다. 이를 통해 앞뒤의 모순 효과(낳지 않는 자/산고의 위로)가 선명해집니다.
  doctrine_reference: 원문 문맥 및 POB 주해 결정
