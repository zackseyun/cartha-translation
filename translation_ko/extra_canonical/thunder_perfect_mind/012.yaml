base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/012.yaml
  text: I am the midwife and she who does not give birth[a]. I am the comfort of my labor pains. I am the bride and the bridegroom[d][c][b]. I am the mother of my father and the sister of my husband.
  footnotes:
  - marker: a
    text: Many English traditions read “whose wedding is great.” The present OCR does not clearly show an adjective; pending collation may restore it.
    reason: alternative_reading
  - marker: b
    text: If a noun for ‘husband’ (e.g., ⲣⲱⲙⲉ ‘man/husband’) is confirmed in a better witness, “has not been married” could be tightened to “have not taken a husband.”
    reason: lexical_alternative
  - marker: c
    text: Subsequent lines in the OCR (virgin/mother; male/female) likely belong to adjacent ‘I am’ paradoxes and are excluded here due to block mapping.
    reason: alignment_note
  - marker: d
    text: Or 'In the wedding I am the bride, and I am she who has not been married.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 산파이며, 해산하지 않는 자입니다. 나는 내 산고의 위로입니다. 나는 신부이자 신랑입니다. 나는 내 아버지의 어머니이며 내 남편의 누이입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic OCR는 이 구절을 혼례 장면으로 읽는 전통 번역과 달리, 여기서는 ‘산파’와 ‘해산하지 않는 자’로 읽게 합니다. 더 나은 사본 대조에서는 다른 독해가 가능할 수 있습니다.
    reason: source_note
  - marker: b
    text: 이 행은 원문에서 여성·남성의 역설적 병치를 이루는 표현으로, 성별 역할의 긴장을 의도적으로 보존합니다.
    reason: theological_note
lexical_decisions:
- source_word: ⲧⲙⲉⲥⲓⲱ
  english_pob_choice: the midwife
  chosen_korean: 산파
  alternatives_korean:
