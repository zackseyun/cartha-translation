  terminology: ‘산파’는 원문의 역설적 직업 명사를 간결하게 보존합니다. ⲧⲥϩⲓⲙⲉ는 문맥에 따라 ‘여자’ 또는 ‘아내’일 수 있으나, 제공된 OCR에는 소유 표현이 없으므로 ‘내 남편의 누이’로 특정해서는 안 됩니다. ‘여자’는 해석을 최소화하는 선택입니다.
