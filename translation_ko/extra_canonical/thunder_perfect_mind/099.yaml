  text: I am among you who [...] yourselves out from the [...][a]. Who is it that will release you? Or if he releases you from it[d][c][b], who will be able to [...]?
  footnotes:
  - marker: a
    text: ⲧⲏⲛⲉ could denote bread in general or, contextually, dough/flour. “Bread” is chosen for idiomatic clarity within a milling scene.
    reason: lexical_alternative
  - marker: b
    text: ⲉⲃⲟⲗ (“out/forth”) appears in the fragment but is not rendered explicitly to avoid stilted English; the sense may underlie “prepare.”
    reason: alignment_note
  - marker: c
    text: “Within it” could refer to the mill (ⲡϫⲓⲛⲓ) or the bread; the more paradoxical reading (mind within the bread) is chosen, aligning with Thunder’s self-locations.
    reason: alternative_reading
  - marker: d
    text: Or 'I prepare bread in the mill, my mind within it.'.
    reason: previous_rendering
