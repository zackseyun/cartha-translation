  yaml_path: translation/extra_canonical/thunder_perfect_mind/022.yaml
  text: 'Those who speak the truth about me[a], lie about me,

    and those who have lied about me, speak the truth about me.

    Those who know me, be ignorant of me,

    and those who have not known me[b], let them know me.'
  footnotes:
  - marker: a
    text: ϫⲓϭⲟⲗ can also be rendered "cry" or "proclamation." We choose "utterance" to preserve the formal, self-defining tone.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am the utterance of my name.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나에 대해 참말을 하는 자들은 나에 대해 거짓말을 합니다.

    또 나에 대해 거짓말한 자들은 나에 대해 참말을 합니다.

    나를 아는 자들은 나를 모르는 자가 되고,

    나를 알지 못한 자들은 나를 알게 하십시오.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 OCR은 손상되어 있으나, 영어 감사본과 평행 구절에 따라 ‘진리/거짓말’ 대구로 이해하는 것이 가장 타당합니다.
    reason: source_note
