  rationale: 동사적 행위로서의 ‘lie’를 자연스럽게 드러내되, 앞뒤의 대칭을 살리기 위해 ‘거짓말하다’로 옮겼습니다.
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ
