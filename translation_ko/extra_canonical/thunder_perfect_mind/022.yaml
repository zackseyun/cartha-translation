  - 진실
  lexicon: Coptic ⲙⲉ as 'truth' in the Thunder paradoxical sequence; English POB preserves the direct contrast with 'lie'.
  rationale: 이 문맥에서는 추상 명사로서의 ‘진리’보다 발화의 진위를 가리키는 ‘참말’이 ‘거짓말’과의 대구를 더 또렷하게 살립니다.
- source_word: ϫⲓϭⲟⲗ
