revisions:
- from: '나에 대해 참말을 하는 자들은 나에 대해 거짓말을 합니다.

    또 나에 대해 거짓말한 자들은 나에 대해 참말을 합니다.

    나를 아는 자들은 나를 모르는 자가 되고,

    나를 알지 못한 자들은 나를 알게 하십시오.[a]'
  to: '나에 대해 진실을 말하는 이들은 나에 대해 거짓말을 합니다.


    또 나에 대해 거짓말한 이들은 나에 대해 진실을 말합니다.


    나를 아는 이들은 나를 알지 못하게 하십시오.


    나를 알지 못한 이들은 나를 아십시오.'
  rationale: 원문의 교차 대구와 ‘알다/알지 못하다’의 역설을 유지했습니다. 셋째·넷째 행은 원문의 명령적 화행을 현대 표준 한국어 합쇼체로 일관되게 반영했습니다. 손상된 OCR을 넘어서는 추정이나 신학적 해석을 각주로 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
