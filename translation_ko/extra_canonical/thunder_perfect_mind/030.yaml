lexical_decisions:
- source_word: ⲙⲡⲣⲕⲁⲁⲧ ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ
  english_pob_choice: Do not leave me cast out
  chosen_korean: 그분을 버려진 채로 두지 마십시오
  alternatives_korean:
  - 저를 버려진 채로 두지 마십시오
  - 저를 내버려 두지 마십시오
  lexicon: Coptic negated imperative with causative sense; Crum, Coptic Dictionary (ⲕⲁⲁⲧ / ⲉⲃⲟⲗ)
  rationale: 문맥상 화자의 자기발화가 뒤섞여 전승된 것으로 보이므로, 영어 POB의 조정된 읽기를 따라 배척·방치의 뜻을 살려 옮겼습니다. '버려진 채로'가 단순한 위치보다 ‘외면되어 떨어져 있음’을 드러냅니다.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  english_pob_choice: you will find me
  chosen_korean: 그분을 찾게 될 것입니다
  alternatives_korean:
  - 저를 찾게 될 것입니다
  - 그분을 발견하게 될 것입니다
  lexicon: Coptic future of ⲭⲓⲛⲉ, 'find'; Crum, Coptic Dictionary (ⲭⲓⲛⲉ)
  rationale: 영어 POB가 2인칭 복수를 유지하므로, 한국어도 예측형 종결로 대응했습니다. ‘찾게 될 것입니다’는 단순 발견보다 능동적 탐색의 뉘앙스를 보존합니다.
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲙⲁⲟ
  english_pob_choice: in riches
  chosen_korean: 부요함 가운데서
  alternatives_korean:
  - 부유함 가운데서
  - 재물 속에서
  lexicon: Coptic ⲣⲙⲙⲁⲟ, 'rich'; Crum, Coptic Dictionary (ⲣⲙⲙⲁⲟ)
  rationale: 단순한 금전 소유보다 상태·장소 감각이 있어 ‘~가운데서’로 살렸습니다. '부요함'은 전승의 추상적·상징적 어감을 유지합니다.
