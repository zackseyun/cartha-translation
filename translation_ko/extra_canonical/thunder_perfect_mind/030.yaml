  - 그분을 발견하게 될 것입니다
  lexicon: Coptic future of ⲭⲓⲛⲉ, 'find'; Crum, Coptic Dictionary (ⲭⲓⲛⲉ)
  rationale: 영어 POB가 2인칭 복수를 유지하므로, 한국어도 예측형 종결로 대응했습니다. ‘찾게 될 것입니다’는 단순 발견보다 능동적 탐색의 뉘앙스를 보존합니다.
