  source_fidelity: 수정 필요합니다. 이 대목의 코프트어 및 제공된 정정 기록은 화자의 1인칭 목적어(‘나를’)를 가리키는데, 초안은 근거 없이 이를 ‘그분’으로 바꾸었습니다. 또한 실제 해당 구절은 앞선 ‘나는 전쟁과 평화다’가 아니라, 버려진 상태로 두지 말라는 권고와 부요함 가운데에서 찾게 된다는 진술입니다.
  naturalness: ‘나를 버려진 채로 내버려 두지 마십시오’는 현대 표준 한국어 합쇼체로 자연스럽고, 2인칭 복수는 ‘여러분’으로 명시하여 보존했습니다. ‘부요함 가운데에서’는 원문의 전치사구와 다소 추상적인 표현을 무리 없이 반영합니다.
  terminology: ‘버려진 채로’는 ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ의 배척·버려짐의 상태를, ‘찾을 것입니다’는 미래형 ⲧⲉⲧⲛⲁϭⲓⲛⲉ를 반영합니다. 신적 호칭인 ‘그분’을 삽입하지 않아 원문의 불특정한 1인칭 화자와 문학적 모호성을 보존합니다.
