  rationale: 콥트 원문과 POB의 반복적 자아 진술은 성별 표지보다 대조 구조가 핵심이므로, 한국어에서는 성별을 추가로 명시하지 않아도 됩니다.
  doctrine_reference: 문학적 화자 재현
- issue: ‘형상’의 반복을 통한 대조
