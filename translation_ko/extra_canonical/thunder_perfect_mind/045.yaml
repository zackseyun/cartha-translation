theological_decisions:
- issue: 문학적 1인칭 화자의 성별 표지
  chosen_reading: 영문 POB의 'I am she'에 맞춰 한국어에서도 1인칭 여화자성을 드러내지 않고, 반복되는 '이'로 통일했습니다.
  alternative_readings:
  - 나는 그녀입니다
  - 나는 여인입니다
  rationale: 콥트 원문과 POB의 반복적 자아 진술은 성별 표지보다 대조 구조가 핵심이므로, 한국어에서는 성별을 추가로 명시하지 않아도 됩니다.
  doctrine_reference: 문학적 화자 재현
- issue: ‘형상’의 반복을 통한 대조
  chosen_reading: 이집트/바르바로이, 형상 있음/없음, 미움/사랑의 병렬을 그대로 유지했습니다.
  alternative_readings:
  - 의역하여 의미만 풀어 쓰기
  - 형상을 삭제하고 자연스러운 문장으로 재구성하기
  rationale: 원문은 대조와 역설이 핵심이므로, 매끈한 의역보다 반복 구조를 보존하는 쪽이 독자에게 더 정확한 의미를 전달합니다.
  doctrine_reference: 수사적 병렬 보존
