  lexicon: Coptic ⲭⲣⲟⲉⲓ / ⲧⲉⲣⲟⲟⲩ
  rationale: 직역보다 한국어 관용에 맞추되, ‘입을 열다’라는 발화 개시 표현을 유지해 원문의 법정적·수사적 이미지를 살렸습니다.
