    reason: lexical_alternative
  - marker: c
    text: Fragments like ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟ[ⲓ (“to judge me”) and ⲡⲉⲧⲛⲧⲁⲉⲓⲙⲟⲉⲓⲛ (“what you have thought”) suggest juridical context around this locus; these likely belong to neighboring lines.
    reason: alignment_note
  - marker: d
