  text: It is not my defense when they call[a], and the injustice you have considered[d][c][b], you leave it to open their mouths to judge me.
  footnotes:
  - marker: a
    text: The OCR shows ⲁⲡⲟⲗⲟⲅⲓⲁ (“defense”) at the head of the slice, which may belong to an adjacent clause and is not rendered here.
    reason: alignment_note
