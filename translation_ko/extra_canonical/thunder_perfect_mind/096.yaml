  - 억압
  - 부정
  lexicon: Coptic ϫⲓⲛ- + ϭⲟⲛⲥ
  rationale: 해당 합성형은 단순한 ‘수(number)’가 아니라 ‘불의/폭력’ 계열의 의미를 가지므로, 본문이 지적하는 부당함을 드러내는 ‘불의’로 옮겼습니다.
- source_word: ⲡⲉⲧⲛⲧⲁⲉⲓⲙⲟⲉⲓⲛ
  english_pob_choice: you have considered
  chosen_korean: 당신이 생각해 낸
  alternatives_korean:
  - 당신이 고려한
  - 당신이 판단한
  lexicon: Coptic ⲉⲓⲙⲟⲉⲓⲛ
  rationale: 동사는 ‘생각하다/고려하다’의 범위에 있으나, 여기서는 앞의 ‘불의’와 결합해 청중의 내적 판단을 가리키므로 한국어에서 자연스러운 ‘생각해 낸’으로 처리했습니다.
- source_word: ⲉⲣⲭⲣⲟⲉⲓ ⲧⲉⲣⲟⲟⲩ
  english_pob_choice: to open their mouths
  chosen_korean: 그들의 입을 열게 하여
