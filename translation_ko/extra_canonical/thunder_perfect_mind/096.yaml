  lexicon: Coptic ⲕⲣⲓⲛⲉ
  rationale: ⲕⲣⲓⲛⲉ는 단순 판단보다 판결/심판의 뉘앙스가 있어, 문맥상 ‘심판하다’가 가장 강한 대응입니다.
