translation:
  language: ko
  text: 제 변명이 아닙니다. 그들이 부를 때, 그리고 당신이 생각해 낸 그 불의는, 당신이 그것을 내버려 두어 그들의 입을 열게 하여 나를 심판하게 합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲁⲡⲟⲗⲟⲅⲓⲁ는 ‘변명/변론’이 모두 가능하지만, 여기서는 자기 해명을 뜻하는 쪽으로 읽었습니다.
    reason: lexical_alternative
  - marker: b
    text: ϫⲓⲛϭⲟⲛⲥ는 ‘불의’ 또는 ‘폭력’ 계열의 의미를 가지며, 이 구절에서는 부당함을 드러내는 표현으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들의 입을 열게 하여 나를 심판하게 합니다’는 법정적 이미지를 살린 번역으로, 직역은 ‘그들의 입을 열어 나를 심판하게 하도록’에 가깝습니다.
    reason: korean_style_note
