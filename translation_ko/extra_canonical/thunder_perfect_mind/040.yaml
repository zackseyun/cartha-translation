  text: Why do you hate my fear, and curse my pride?
  footnotes:
  - marker: a
    text: “A single place” reads ⲟⲩⲏⲛ ⲧⲟⲡⲟⲥ; ⲟⲩⲏⲛ is taken as “one/single” (cf. Gk. ἕν). The article/number sequence is irregular and could reflect a damaged line.
    reason: alignment_note
  - marker: b
    text: Verb restored as ⲕⲣⲓⲛⲉ (to judge) from the fragment ϯⲛⲁⲕⲣ…; consistent with Greek loan κρίνω. If misread, alternatives include “separate” or “decide.”
    reason: textual_variant
  - marker: c
    text: ⲛⲉⲧⲕⲗⲏϣ is read as “the called ones” (cf. κλῆσις/κλητός). It could alternatively be “those of the calling” (abstract noun).
    reason: lexical_alternative
  - marker: d
    text: ϣⲟϫⲛⲉ is glossed “clamor/outcry.” If the context is more introspective, “tumult” might be preferred.
    reason: lexical_alternative
  - marker: e
    text: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ is an idiom for “bring to light; make manifest.” Some editors prefer “reveal.”
    reason: lexical_alternative
  - marker: f
    text: Or 'Why—am I a single place? I am one; the other you reckon to go toward in your clamor, for I will judge. I am among the called ones, and I will bring to light.'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분은 왜 나의 두려움을 미워하고 나의 자랑을 저주합니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲙⲁ
  english_pob_choice: why
  chosen_korean: 왜
  alternatives_korean:
  - 어찌하여
  - 무슨 이유로
  lexicon: Crum; Layton (Sahidic interrogative particle)
  rationale: 수사적 질문의 기능을 그대로 살리되, 현대 한국어에서 가장 자연스럽고 간결한 의문 부사로 옮겼습니다.
- source_word: ⲧⲁϩⲟⲧⲉ
  english_pob_choice: my fear
  chosen_korean: 나의 두려움
  alternatives_korean:
  - 나의 경외
  - 나의 무서움
  lexicon: Crum (ϩⲟⲧⲉ)
  rationale: 단순한 공포감이나 경외의 뉘앙스를 모두 열어 두는 표현으로, 본문이 요구하는 감정 상태를 과장하지 않고 전달합니다.
- source_word: ⲧⲁϣⲟⲩϣⲟⲩ
  english_pob_choice: my pride
  chosen_korean: 나의 자랑
  alternatives_korean:
  - 나의 교만
  - 나의 오만
  lexicon: Crum (ϣⲟⲩϣⲟⲩ)
  rationale: 고전적 종교문맥의 도덕화된 ‘교만’보다, 원문의 자기 진술적 대비를 살리는 ‘자랑’을 기본값으로 택했습니다.
theological_decisions:
- issue: 감정/태도의 대구를 도덕적 비난어로 고정할지 여부
  chosen_reading: ‘두려움’과 ‘자랑’을 각각 원문 그대로 두어, 화자가 자신 안의 상반된 상태를 말하는 긴장을 보존했습니다.
  alternative_readings:
  - ‘경외’와 ‘교만’으로 도덕적 대비를 강화하는 읽기
  - ‘두려움’과 ‘오만’으로 강한 부정적 색채를 주는 읽기
  rationale: 이 구절은 단순한 윤리 규정이라기보다 모순적 자기 진술의 시적 긴장을 형성하므로, 해석을 지나치게 단정하는 번역을 피했습니다.
  doctrine_reference: 문학적/수사적 평행법 보존 원칙
