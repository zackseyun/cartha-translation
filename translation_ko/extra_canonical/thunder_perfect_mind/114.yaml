base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/114.yaml
  text: '… with those who were sent[a];

    I am the one cast out;

    among the dead — but I am the one who exists alone[g][f][e][d][c][b], and the everlasting.'
  footnotes:
  - marker: a
    text: The opening “… with those who have not known [—]” is provisional. The OCR may conflate the verb “to know” (ⲥⲟⲟⲩⲛ) with the noun “mind” (Greek nous), and the object pronoun is unreadable; it could be “me,” “you (pl.),” or “us.”
    reason: alignment_note
  - marker: b
    text: '“Cast out” renders ⲧⲱⲱⲛ ⲉⲃⲟⲗ; alternatives: “driven out,” “expelled.”'
    reason: lexical_alternative
  - marker: c
    text: '“Alone” translates ⲟⲩⲁⲁⲧ; alternatives: “solitary,” “unique.”'
    reason: lexical_alternative
  - marker: d
    text: ⲙⲛⲧⲁⲓ likely continues to ⲙⲛⲧⲁⲓⲱⲛ (“eternal, age(-long)”). I rendered “the everlasting”; “the eternal” is also possible.
    reason: textual_variant
  - marker: e
    text: 'Paradox is intentional: presence “in those who die” contrasted with self-existence “alone” and “everlasting.” This tension is a hallmark of Thunder’s voice and is retained rather than harmonized.'
    reason: parallelism_note
  - marker: f
    text: Or '… with those who have not known [—];'.
    reason: previous_rendering
  - marker: g
    text: Or 'in those who die'.
    reason: previous_rendering
translation:
  language: ko
  text: '… 그들을 보내신 이들과 함께하며[a];

    나는 쫓겨난 자입니다[b];

    죽은 자들 가운데서 — 그러나 나는 홀로 존재하는 이이며, 영원한 이입니다[c][d][e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문두의 ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ는 ‘보내심을 받은 자들’ 또는 ‘그들을 보내신 이들과 함께’로 읽을 수 있습니다.
    reason: source_note
  - marker: b
    text: ⲧⲱⲱⲛ ⲉⲃⲟⲗ는 ‘쫓아내다/내쫓다’라는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: ⲟⲩⲁⲁⲧ는 ‘홀로’, ‘고독한’, ‘유일한’의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: d
    text: ⲙⲛⲧⲁⲓ는 ⲙⲛⲧⲁⲓⲱⲛ(‘영원, 아이온’)으로 이어지는 형태일 가능성이 있습니다.
    reason: textual_variant
  - marker: e
    text: ‘죽은 자들 가운데서’와 ‘홀로 존재하며 영원한 이’의 대비는 의도된 역설로 보입니다.
    reason: theological_note
lexical_decisions:
- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  english_pob_choice: those who were sent
  chosen_korean: 그들을 보내신 이들과 함께하며
  alternatives_korean:
  - 보냄을 받은 이들과 함께하며
  - 그들이 보낸 이들과 함께하며
  lexicon: Crum s.v. ⲧⲛⲛⲟⲟⲩ
  rationale: Coptic 동사 ⲧⲛ̄ⲛⲟⲟⲩ는 ‘보내다’이므로, 본문을 ‘알지 못한 자들’로 읽는 것은 부정확합니다. 한국어는 수동 의미를 자연스럽게 살려 ‘보내신 이들과 함께하며’로 옮겼습니다.
- source_word: ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  english_pob_choice: cast out
  chosen_korean: 쫓겨난 자입니다
  alternatives_korean:
  - 내쫓긴 자입니다
  - 추방된 자입니다
  lexicon: Crum s.v. ⲧⲱⲱⲛ; Horner Coptic NT usage
  rationale: 관용구 ⲧⲱⲱⲛ ⲉⲃⲟⲗ는 ‘내쫓다/쫓아내다’의 뜻이므로, 선언체의 짧은 문장감을 살려 ‘쫓겨난 자’로 옮겼습니다.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ
  english_pob_choice: among the dead
  chosen_korean: 죽은 자들 가운데서
  alternatives_korean:
  - 죽은 자들 가운데
  - 죽은 이들 가운데서
  lexicon: Crum s.v. ⲙⲟⲩ / ⲙⲟⲟⲩⲧ
  rationale: 형태는 ‘죽은 상태에 있는 자들’을 가리키므로, POB의 ‘among the dead’를 따라 한국어도 집합적 표현인 ‘죽은 자들 가운데서’로 처리했습니다.
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ ⲟⲩⲁⲁⲧ
  english_pob_choice: the one who exists alone
  chosen_korean: 홀로 존재하는 이입니다
  alternatives_korean:
  - 홀로 있는 이입니다
  - 고독하게 존재하는 이입니다
  lexicon: Crum s.v. ϣⲟⲟⲡ; Crum s.v. ⲟⲩⲁⲁⲧ
  rationale: ϣⲟⲟⲡ의 존재론적 뉘앙스와 ⲟⲩⲁⲁⲧ의 ‘홀로/단독으로’라는 감각을 함께 살리기 위해 ‘홀로 존재하는 이’로 옮겼습니다.
- source_word: ⲙⲛⲧⲁⲓ(ⲱⲛ)
  english_pob_choice: the everlasting
  chosen_korean: 영원한 이입니다
  alternatives_korean:
  - 영원한 존재입니다
  - 영원한 자입니다
  lexicon: Crum s.v. ⲙⲛⲧ- + Greek ⲁⲓⲱⲛ
  rationale: 본문의 ⲙⲛⲧⲁⲓ는 ⲙⲛⲧⲁⲓⲱⲛ(‘영원/시대’)으로 이어질 가능성이 있어, 명사구적 종결을 살려 ‘영원한 이’로 옮겼습니다.
theological_decisions:
- issue: ‘among the dead’와 ‘alone/everlasting’의 역설적 병치
  chosen_reading: 모순을 조화시키지 않고, 죽은 자들 가운데 있으면서도 홀로 존재하며 영원하다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 의미를 부드럽게 하여 상징적 존재로 해석
  - 죽음과 영원을 비유적으로 완화
  rationale: 『Thunder, Perfect Mind』 특유의 역설적 자기진술은 문학적 장치이므로, 본문의 긴장을 해소하지 않고 그대로 보존하는 것이 원문 수사에 충실합니다.
  doctrine_reference: 문학적-신학적 수사 보존 원칙
