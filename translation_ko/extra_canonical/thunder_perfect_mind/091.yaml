theological_decisions:
- issue: ‘아래/위’의 공간적 대비를 어떻게 처리할지
  chosen_reading: 이 구절은 신학적 상징을 덧붙이기보다, 화자가 ‘땅 아래’에 있으며 사람들이 그에게 ‘올라온다’는 공간적 대비를 그대로 드러내는 쪽으로 옮겼습니다.
  alternative_readings:
  - 영적 차원에서 ‘심연’이나 ‘저승’으로 해석하기
  - 상징적으로만 읽어 ‘낮은 곳’으로 완화하기
  rationale: 이 본문은 Coptic 원문과 영어 POB 주석이 모두 지리적/위치적 의미를 우선하므로, mythic한 의미를 유도하는 표현은 피하고 원문의 긴장을 유지했습니다.
  doctrine_reference: 원문-우선 번역 원칙
- issue: 화자 1인칭 자기지시의 직설성
  chosen_reading: ‘나는 … 이입니다’라는 직설적 자기지시를 유지해, 원문 수사의 단호함을 살렸습니다.
  alternative_readings:
  - ‘나는 … 자입니다’로 부드럽게 바꾸기
  - 문어적 우회 표현으로 완화하기
  rationale: 『Thunder, Perfect Mind』의 반복적 자기선언 어조를 약화하지 않기 위해, 한국어에서도 직접적이고 단정한 자기진술을 유지했습니다.
  doctrine_reference: 수사적 장르 보존
