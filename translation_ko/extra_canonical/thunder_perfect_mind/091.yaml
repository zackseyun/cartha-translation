  - marker: b
    text: 'The phrase ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ is split across a line break in the OCR (ⲉⲧⲛⲟⲩϫⲉ ⲙ / ⲙⲟⲥ). It is read here as a single unit: “they ascend to me.”'
