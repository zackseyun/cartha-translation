  text: the name of the voice and the voice of the name[a]. I am the sign of the letter and the manifestation of the division[c][b]. And I [...]
  footnotes:
  - marker: a
    text: Coptic ⲥⲙⲏ typically means “the inside, interior,” contrasted with ⲉⲃⲟⲗ (“outside, outward”).
    reason: cultural_note
  - marker: b
    text: Some witnesses include an adjacent imperative “Listen!” (from Greek loan ⲁⲕⲣⲟⲁⲧ). Its presence in this segment is uncertain due to OCR/page-edge mapping.
    reason: alignment_note
  - marker: c
    text: Or 'For what is within you is what is outside you, and the one who shapes you outwardly is the one who formed what is within you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 소리의 이름과 이름의 소리입니다. 저는 글자의 표징이요 분열의 드러남입니다. 그리고 저는 …[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 Coptic ⲥⲙⲏ는 ‘소리/음성’의 뜻으로 쓰이며, 앞뒤의 대구를 살리기 위해 ‘소리’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 영어 audit trail은 이 절의 뒤부분에서 ‘manifestation’ 계열 표현을 반영합니다. 한국어는 그 의미를 ‘드러남’으로 옮겼습니다.
    reason: source_note
  - marker: c
    text: 마지막 ‘그리고 저는 …’은 제공된 OCR 말미가 절 경계에서 끊겨 있어, 현재 자료만으로는 완결 번역을 확정하기 어렵습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  english_pob_choice: name
  chosen_korean: 이름
  alternatives_korean:
  - 명칭
  - 이름표현
  lexicon: Crum (Sahidic Coptic)
  rationale: Coptic ⲡⲣⲁⲛ은 ‘이름’이므로, 영어 POB의 name에 맞추되 한국어에서는 가장 सीधे하고 자연스러운 ‘이름’으로 옮겼습니다.
- source_word: ⲥⲙⲏ
  english_pob_choice: voice
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: Crum (Sahidic Coptic)
  rationale: 이 구절의 Coptic ⲥⲙⲏ는 POB의 기존 영어 관찰처럼 ‘voice’로 기능하지만, 한국어에서는 ‘목소리’보다 더 추상적이고 시적 대구를 살리는 ‘소리’가 적절합니다.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  english_pob_choice: sign
  chosen_korean: 표징
  alternatives_korean:
  - 표적
  - 징표
  lexicon: Crum / 일반 Coptic lexical usage
  rationale: 영어 sign에 대응하는 ⲡⲥⲏⲙⲉⲓⲟⲛ은 단순한 표지보다 의미를 드러내는 ‘표징’이 문맥에 더 적합합니다.
- source_word: ⲁⲡⲟⲕⲁⲗⲩⲯⲓⲥ/‘manifestation’ 계열 표현(POB 영어 반영)
  english_pob_choice: manifestation
  chosen_korean: 드러남
  alternatives_korean:
  - 현현
  - 나타남
  lexicon: POB English audit trail
  rationale: 이 대목의 영어 audit trail이 manifestation을 쓰므로, 한국어에서는 현학적이지 않으면서도 드러나는 성격을 보존하는 ‘드러남’으로 옮겼습니다.
- source_word: ⲧⲥⲙⲏ ⲙⲡⲣⲁⲛ
  english_pob_choice: the voice of the name
  chosen_korean: 이름의 소리
  alternatives_korean:
  - 이름의 목소리
  - 이름에 속한 소리
  lexicon: Crum (Sahidic Coptic)
  rationale: Coptic의 속격 구조를 그대로 살려 ‘이름의 소리’로 옮겨, 앞구와의 상응 관계를 유지했습니다.
