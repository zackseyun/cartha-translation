  text: the name of the voice and the voice of the name[a]. I am the sign of the letter and the manifestation of the division[c][b]. And I [...]
  footnotes:
  - marker: a
    text: Coptic ⲥⲙⲏ typically means “the inside, interior,” contrasted with ⲉⲃⲟⲗ (“outside, outward”).
    reason: cultural_note
  - marker: b
    text: Some witnesses include an adjacent imperative “Listen!” (from Greek loan ⲁⲕⲣⲟⲁⲧ). Its presence in this segment is uncertain due to OCR/page-edge mapping.
    reason: alignment_note
  - marker: c
    text: Or 'For what is within you is what is outside you, and the one who shapes you outwardly is the one who formed what is within you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 소리의 이름과 이름의 소리입니다. 저는 글자의 표징이요 분열의 드러남입니다. 그리고 저는 …[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 Coptic ⲥⲙⲏ는 ‘소리/음성’의 뜻으로 쓰이며, 앞뒤의 대구를 살리기 위해 ‘소리’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 영어 audit trail은 이 절의 뒤부분에서 ‘manifestation’ 계열 표현을 반영합니다. 한국어는 그 의미를 ‘드러남’으로 옮겼습니다.
    reason: source_note
  - marker: c
    text: 마지막 ‘그리고 저는 …’은 제공된 OCR 말미가 절 경계에서 끊겨 있어, 현재 자료만으로는 완결 번역을 확정하기 어렵습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  english_pob_choice: name
  chosen_korean: 이름
  alternatives_korean:
