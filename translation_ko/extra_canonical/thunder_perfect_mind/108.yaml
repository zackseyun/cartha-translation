  - 이름표현
  lexicon: Crum (Sahidic Coptic)
  rationale: Coptic ⲡⲣⲁⲛ은 ‘이름’이므로, 영어 POB의 name에 맞추되 한국어에서는 가장 सीधे하고 자연스러운 ‘이름’으로 옮겼습니다.
- source_word: ⲥⲙⲏ
  english_pob_choice: voice
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: Crum (Sahidic Coptic)
  rationale: 이 구절의 Coptic ⲥⲙⲏ는 POB의 기존 영어 관찰처럼 ‘voice’로 기능하지만, 한국어에서는 ‘목소리’보다 더 추상적이고 시적 대구를 살리는 ‘소리’가 적절합니다.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  english_pob_choice: sign
  chosen_korean: 표징
  alternatives_korean:
  - 표적
  - 징표
  lexicon: Crum / 일반 Coptic lexical usage
  rationale: 영어 sign에 대응하는 ⲡⲥⲏⲙⲉⲓⲟⲛ은 단순한 표지보다 의미를 드러내는 ‘표징’이 문맥에 더 적합합니다.
- source_word: ⲁⲡⲟⲕⲁⲗⲩⲯⲓⲥ/‘manifestation’ 계열 표현(POB 영어 반영)
  english_pob_choice: manifestation
  chosen_korean: 드러남
  alternatives_korean:
  - 현현
  - 나타남
  lexicon: POB English audit trail
  rationale: 이 대목의 영어 audit trail이 manifestation을 쓰므로, 한국어에서는 현학적이지 않으면서도 드러나는 성격을 보존하는 ‘드러남’으로 옮겼습니다.
- source_word: ⲧⲥⲙⲏ ⲙⲡⲣⲁⲛ
  english_pob_choice: the voice of the name
  chosen_korean: 이름의 소리
  alternatives_korean:
  - 이름의 목소리
  - 이름에 속한 소리
  lexicon: Crum (Sahidic Coptic)
  rationale: Coptic의 속격 구조를 그대로 살려 ‘이름의 소리’로 옮겨, 앞구와의 상응 관계를 유지했습니다.
