    issue: ‘경멸하며 멸시하는’이 원문의 경멸 행위와 그 태도를 중복적으로 번역합니다.
    rationale: καταφρονέω 계열의 ‘멸시하다’에 ϩⲛ ⲟⲩϣⲱⲥ(경멸/조롱의 태도로)가 붙은 구조이므로, ‘조롱하며 멸시하는’처럼 태도와 행위를 구별해 옮기는 편이 충실하고 자연스럽습니다.
