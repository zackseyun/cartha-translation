  yaml_path: translation/extra_canonical/thunder_perfect_mind/076.yaml
  text: and the one they despise in scorn[a]. I am peace[c][b], and because of me war has come to be.
  footnotes:
  - marker: a
    text: The opening ⲁⲩⲱ can be read as simple “and.” I chose “But” to reflect probable contrast with a preceding reproach (the OCR hints at “you have despised…”), but this nuance is uncertain.
    reason: alignment_note
  - marker: b
    text: ϣⲱⲡⲉ may also be rendered “has arisen” or “has happened.” “Has come to be” preserves the ontic flavor common in Thunder.
    reason: lexical_alternative
  - marker: c
    text: Or 'But I am peace, and because of me war has come to be.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 경멸하며 멸시하는 그 여인을… 나는 평화입니다. 그리고 나로 말미암아 전쟁이 생겨났습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 여성형 관계절은 ‘그들이 경멸하는 그 여인’이라는 뜻입니다. 영어 POB의 “the one they despise in scorn”을 반영했습니다.
    reason: source_note
  - marker: b
    text: ‘생겨났습니다’는 ϣⲱⲡⲉ의 존재론적 뉘앙스를 살린 번역입니다. ‘일어났습니다’나 ‘발생했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘평화’는 ϯⲣⲏⲛⲏ의 직접적인 현대어 대응입니다. 교회적 어감의 ‘평강’보다 본문의 직설성과 역설을 더 분명히 드러냅니다.
    reason: lexical_alternative
