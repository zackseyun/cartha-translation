  - 화평
  lexicon: Coptic loan from Greek εἰρήνη
  rationale: 시적 자기동일화 표현으로서 현대 한국어에서 가장 직접적인 ‘평화’를 택했습니다. ‘평강’은 교회어감이 강해 본문의 날것 같은 역설을 약화시킬 수 있습니다.
