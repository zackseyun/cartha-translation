    rationale: 이 대목은 앞 문맥에서 이어지는 발췌이지만, 한국어에서는 서술 종결을 보충해도 의미를 추가하지 않습니다. 말줄임표는 원문상의 불확실성이나 생략을 시사하므로 제거하는 편이 낫습니다.
