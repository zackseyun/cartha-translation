- issue: ⲁⲩⲱ의 처리와 역접 여부
  chosen_reading: 문두의 ⲁⲩⲱ를 역접 ‘그러나’로 만들지 않고, 앞 절을 이어 받는 단순 연결로 처리했습니다.
  alternative_readings:
  - 그러나 나는 평화입니다
  - 그리고 나는 평화입니다
  rationale: 주어진 개정 내역과 영어 주석에 따르면 여기서는 앞뒤 대비를 확정할 근거가 약하므로, 원문의 접속 관계를 과장하지 않는 쪽이 더 안전합니다.
