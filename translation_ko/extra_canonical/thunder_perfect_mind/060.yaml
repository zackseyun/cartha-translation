translation:
  language: ko
  text: '그러므로 수치에서 벗어나, 부끄러움 없음 가운데서 저를 여러분 쪽으로 받아들이십시오.[a]


    그리고 부끄러움 없음과 수치에서 벗어나, 여러분 가운데 있는 내 지체들을 꾸짖으십시오.


    그리고 여러분 자신에게 다가가십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역에 가까이 옮기면 ‘수치에서 벗어나 … 부끄러움 없음 가운데서’입니다. ‘수치’와 ‘부끄러움 없음’의 역설적 대조를 유지하였습니다.
    reason: source_note
lexical_decisions:
- source_word: ϣⲟⲡⲧ
  english_pob_choice: receive me to yourselves
  chosen_korean: 저를 여러분 자신에게 받아들이십시오
  alternatives_korean:
  - 저를 여러분 자신에게 맞아들이십시오
  - 저를 여러분 자신 안에 받아들이십시오
  lexicon: Crum; Layton
  rationale: 문맥상 단순한 ‘받다’가 아니라 화자를 자기들 쪽으로 맞아들이라는 명령이므로, 합쇼체로 자연스럽게 ‘받아들이십시오’로 옮겼습니다.
- source_word: ϣⲓⲡⲉ / ⲙⲛⲧⲁⲧϣⲓⲡⲉ
  english_pob_choice: shame / shamelessness
  chosen_korean: 수치 / 부끄러움 없음
  alternatives_korean:
  - 수치 / 수치 없음
  - 부끄러움 / 부끄러움 없음
  lexicon: Crum; Layton
  rationale: 대립 구조를 살리기 위해 한쪽은 ‘수치’, 다른 쪽은 privative 형태를 반영한 ‘부끄러움 없음’으로 옮겼습니다. ‘부끄러움 없음’은 단순한 태도보다 ‘수치가 결여된 상태’라는 소스의 반전을 잘 드러냅니다.
- source_word: ϫⲡⲓⲟ
  english_pob_choice: reprove my members among yourselves
  chosen_korean: 내 지체들을 여러분 가운데서 꾸짖으십시오
  alternatives_korean:
  - 내 지체들을 여러분 가운데서 책망하십시오
  - 내 지체들을 여러분 가운데서 질책하십시오
  lexicon: Crum; Layton
  rationale: 동사는 단순 비난보다 권면적·책망적 어조가 강하므로 ‘꾸짖다’로 옮겼습니다. ‘지체들’은 POB의 members/limbs를 반영해 문자적 이미지를 유지합니다.
- source_word: ⲛⲧⲏⲩⲧⲛ / ϩⲟⲩⲛ ⲉⲣⲱⲧⲛ
  english_pob_choice: among yourselves / yourselves
  chosen_korean: 여러분 가운데서 / 여러분 자신에게
  alternatives_korean:
  - 여러분 안에서 / 여러분 안으로
  - 여러분 가운데 / 여러분에게
  lexicon: Crum
  rationale: 내적·상호적 방향성을 살리기 위해 앞 구절은 ‘여러분 가운데서’, 마지막 구절은 종결어감이 자연스러운 ‘여러분 자신에게’로 구분했습니다.
