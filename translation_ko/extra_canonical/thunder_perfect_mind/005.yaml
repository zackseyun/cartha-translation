translation:
  language: ko
  text: 경계하십시오.[a] 또 여러분의 듣는 것에 관하여는, 어떤 곳에서나 어떤 다른 생각에서도 저에게 귀먹지 마십시오[b]. 그리고 저를 알지 못한 채로 있지 마십시오. 나는 첫째이며, 나는 마지막입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: ‘경계하십시오; 주의 깊게 들으십시오.’'
    reason: lexical_alternative
  - marker: b
    text: '또는: ‘어떤 곳에서도, 또 다른 어떤 생각에 따라서도.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲱⲉⲓ
  english_pob_choice: Be watchful
  chosen_korean: 경계하십시오
  alternatives_korean:
  - 깨어 있으십시오
  - 주의하십시오
  - 방심하지 마십시오
  lexicon: Crum; Layton
  rationale: 감시와 주의를 함께 담는 경계하다가 경고적 명령의 긴장을 가장 잘 살립니다.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  english_pob_choice: your hearing
  chosen_korean: 여러분의 듣는 것
  alternatives_korean:
  - 여러분의 귀
  - 여러분의 청력
  - 여러분의 듣기
  lexicon: Crum
  rationale: 직역하면 ‘여러분의 듣는 것’이므로, 청각 기관이 아니라 행위/태도를 가리키는 표현으로 옮겼습니다.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ
  english_pob_choice: do not be deaf to me
  chosen_korean: 저에게 귀먹지 마십시오
  alternatives_korean:
  - 저의 말을 못 들은 체하지 마십시오
  - 저에게 무감각해지지 마십시오
  - 저의 말을 듣지 못한 채 있지 마십시오
  lexicon: Crum
  rationale: 부정 명령형의 핵심은 ‘듣지 못하는 상태/무감각함’을 금하는 것이어서, 직접적이고 source-direct한 ‘귀먹지 마십시오’를 채택했습니다.
- source_word: ⲕⲁⲧⲁ ⲙⲁ / ⲕⲁⲧⲁ ⲛⲕⲉⲟⲩⲙⲉⲩⲉ
  english_pob_choice: in any place or in any other thought
  chosen_korean: 어떤 곳에서나 어떤 다른 생각에서도
  alternatives_korean:
  - 어디에서든지 또 다른 어떤 생각에서도
  - 장소를 막론하고 또 다른 생각을 따라서는
  - 어떤 장소에서도 어떤 다른 사상에서도
  lexicon: Crum; Greek loanword
  rationale: POB의 audit처럼 두 병렬구를 살리되, ⲙⲁ의 장소성과 ⲟⲩⲙⲉⲩⲉ의 ‘생각’ 의미를 유지해 낯선 병치를 보존했습니다.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ
  english_pob_choice: do not be ignorant
  chosen_korean: 저를 알지 못한 채로 있지 마십시오
  alternatives_korean:
  - 저를 모른 채 있지 마십시오
  - 저를 알지 못하도록 하지 마십시오
