revisions:
- from: 바깥으로는 그러하나, 안으로는 여러분이 나를 알았습니다. 나는 여러분이 부끄러워한 그분 앞의 그녀이며, 여러분은 부끄러움을 모르셨습니다. 나는, 나는 신 없는 자이며, 나는 동정녀이고, 그녀의 하나님입니다.[a][b]
  to: … 바깥으로는, 여러분이 안으로는 나를 알았습니다.[a] 나는 여러분이 부끄러워했던 이이며, 여러분에게는 부끄러움이 없었습니다. 나는, 나는 신 없는 이이며, 나는 동정녀, 그녀의 하나님입니다.
  rationale: 원문 발췌의 시작부 절단을 말줄임표로 보존하고, 부끄러움의 대상인 여성 관계사를 자연스러운 한국어 관계 표현으로 바로잡았습니다. ‘신 없는 이’, ‘동정녀’, ‘그녀의 하나님’의 긴장되고 역설적인 자기 진술은 평탄화하거나 교리적으로 해석하지 않았습니다.
