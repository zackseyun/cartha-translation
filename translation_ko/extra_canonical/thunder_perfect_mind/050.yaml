translation:
  language: ko
  text: 바깥으로는 그러하나, 안으로는 여러분이 나를 알았습니다. 나는 여러분이 부끄러워한 그분 앞의 그녀이며, 여러분은 부끄러움을 모르셨습니다. 나는, 나는 신 없는 자이며, 나는 동정녀이고, 그녀의 하나님입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘안으로’/‘내면으로’에 해당하는 대조어로, 바깥/안쪽의 대비를 이루는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘동정녀’는 원문의 여성 명사 ‘virgin’을 살린 번역입니다. 한국어에서 ‘처녀’보다 다소 문어적입니다.
    reason: korean_style_note
