  rationale: 원문의 긴장은 도덕적 평가를 넘어 존재론적 역설에 있으므로, 현대 한국어에서도 서로 상충하는 두 자기를 함께 보이게 했습니다.
  doctrine_reference: 수사적 역설 보존
