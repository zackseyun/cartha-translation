translation:
  language: ko
  text: … 바깥으로는, 여러분이 안으로는 나를 알았습니다.[a] 나는 여러분이 부끄러워했던 이이며, 여러분에게는 부끄러움이 없었습니다. 나는, 나는 신 없는 이이며, 나는 동정녀, 그녀의 하나님입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 발췌는 이 문장의 중간에서 시작합니다. 따라서 첫 구절은 보완하지 않고 말줄임표와 함께 옮겼습니다.
    reason: source_note
