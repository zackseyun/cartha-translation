  rationale: 원문의 부정형은 ‘하나님 없음/신 없음’의 상태를 가리키므로, 전통적 도덕어인 ‘경건치 않은 자’보다 직접적이고 덜 완화된 표현을 택했습니다.
theological_decisions:
- issue: ‘her God’의 관계 표현
  chosen_reading: ‘그녀의 하나님’으로 직역해 소유/귀속의 역설을 그대로 드러냈습니다.
  alternative_readings:
  - ‘그녀에게 속한 하나님’
  - ‘그녀의 신’
  rationale: 원문은 소유격 관계를 강하게 유지하므로, 이를 평탄화하지 않고 남겨야 이 구절의 역설적 자기 동일시가 살아납니다.
  doctrine_reference: 역설적 자기-계시 표현의 보존
- issue: ‘godless’와 ‘virgin’의 병치
  chosen_reading: ‘신 없는 자’와 ‘동정녀’의 병치를 유지했습니다.
  alternative_readings:
  - ‘무신론자’와 ‘처녀’
  - ‘하나님 없는 자’와 ‘처녀’
  rationale: 원문의 긴장은 도덕적 평가를 넘어 존재론적 역설에 있으므로, 현대 한국어에서도 서로 상충하는 두 자기를 함께 보이게 했습니다.
  doctrine_reference: 수사적 역설 보존
