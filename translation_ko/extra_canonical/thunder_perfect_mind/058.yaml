translation:
  language: ko
  text: 여러분이 마음에 두었던 이는 바로 나입니다.[a] 그리고 여러분은 나를 거절하셨습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “여러분이 나에게 마음을 두었다”에 가깝습니다. ‘마음에 두다’는 내적으로 숙고하거나 깊이 주목한다는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나를 내쫓았습니다.” 콥트어 ⲧⲱⲡ ⲉⲃⲟⲗ은 문맥에 따라 추방하거나 배제한다는 더 강한 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲕⲁϩ ⲛϩⲏⲧ + ϣⲟⲡ
  english_pob_choice: set your mind (on)
  chosen_korean: 마음을 두다
  alternatives_korean:
  - 생각을 두다
  - 묵상하다
  - 생각하다
  lexicon: Crum, Coptic Dictionary; Layton, Coptic Grammar
  rationale: 내면에서 의도적으로 대상을 붙들고 숙고하는 관용을 한국어로 자연스럽게 살리면서도, 단순한 인지보다 더 강한 집중성을 유지합니다.
- source_word: ϩⲏⲧ
  english_pob_choice: mind
  chosen_korean: 마음
  alternatives_korean:
  - 생각
  - 가슴
  lexicon: Crum, Coptic Dictionary
  rationale: 콥트어 ϩⲏⲧ은 사고와 의도의 자리이므로, 한국어에서는 ‘마음’이 영어 POB의 ‘mind’보다 원문의 내적 성격을 더 넓고 자연스럽게 담습니다.
- source_word: ⲧⲱⲡ ⲉⲃⲟⲗ
  english_pob_choice: reject
  chosen_korean: 거절하다
  alternatives_korean:
  - 내쫓다
  - 배척하다
  - 버리다
  lexicon: Crum, Coptic Dictionary
  rationale: 문맥상 대상에 대한 능동적 거부를 나타내므로, 관계적·서술적으로 읽히는 ‘거절하다’가 가장 직접적입니다. ‘내쫓다’는 가능한 대안이지만 여기서는 강한 추방 뉘앙스를 본문보다 앞세우지 않기 위해 보류했습니다.
theological_decisions:
- issue: 주어가 자기진술하는 화자의 정체와 직접 호칭의 처리
  chosen_reading: 화자의 자기진술을 그대로 1인칭으로 유지하고, 종교적 해석을 과도하게 덧씌우지 않았습니다.
  alternative_readings:
  - 그리스도론적 자기계시로 읽기
  - 지혜의 인격화로 읽기
  rationale: 본 구절은 화자가 자신을 ‘마음을 두었던’ 대상으로 진술하는 구조이므로, 해석적 확대보다 텍스트의 직접적 관계 진술을 보존하는 것이 우선입니다.
  doctrine_reference: 문학적·종교사적 해석 가능성은 열어 두되, 본문 번역에서는 추가 교리를 주입하지 않음
