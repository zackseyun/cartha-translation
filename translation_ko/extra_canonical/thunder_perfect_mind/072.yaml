  - ‘신적 존재들’로 완화
  rationale: 이 구절은 의도적으로 복수 신격/존재를 나열하는 형식이므로, 단수 신론적 완화는 원문이 가진 긴장을 지워버립니다. 번역은 그 긴장을 보존해야 합니다.
