base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/072.yaml
  text: 'The voice of the angels who were sent forth in the word[a], and of the gods,

    the gods that go out by means of the counsel;

    and the spirits of humans who exist with me,

    and the women who exist within[m][l][k][j][i][h][g][f][e][d][c][b].

    I am she — you [pl.] ...'
  footnotes:
  - marker: a
    text: ⲥⲓⲥ is uncertain; it could be a noun “silence/quiet” or an imperative “be silent.” The translation adopts “silence” to preserve the catalogic structure.
    reason: alignment_note
  - marker: b
    text: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ is tentatively parsed as “those who are first.” If misread, the line may refer to a different quality of the angels.
    reason: alternative_reading
  - marker: c
    text: “Word” renders ⲡⲗⲟⲅⲟⲥ (Greek λόγος). “Logos” could be used here; we chose English for accessibility.
    reason: lexical_alternative
  - marker: d
    text: ⲛ̄ⲛⲟⲩⲧⲉ may be read as plural “gods” (as translated) or singular “God” depending on syntax; both are attested uses in Coptic.
    reason: alternative_reading
  - marker: e
    text: ⲡϣⲟϫⲛⲉ can mean “voice” or “sound”; both senses are active in Thunder’s play on speech, name, and utterance.
    reason: lexical_alternative
  - marker: f
    text: ⲡⲛⲁ is variously “mind,” “thought,” or “spirit.” Context with “of humans” led to “mind.”
    reason: lexical_alternative
  - marker: g
    text: The phrase ⲛⲓⲙⲉⲧϣⲟⲟⲡ (“the beings/existents”) likely runs across the line break (…ⲉⲛⲓⲙⲉⲧ | ϣⲟⲟⲡ…).
    reason: alignment_note
  - marker: h
    text: ⲛ̄ϩⲏⲧ literally “in (the) heart, inner part”; we rendered “within” to keep the interior emphasis broad.
    reason: lexical_alternative
  - marker: i
    text: ⲧⲉⲧ‑ marks second-person plural; the clause breaks off in the OCR, so we preserve “[pl.]” and an ellipsis.
    reason: alignment_note
  - marker: j
    text: Or 'Silence of the angels, of those who are first, within the Word'.
    reason: previous_rendering
  - marker: k
    text: Or 'by means of the voice'.
    reason: previous_rendering
  - marker: l
    text: Or 'and the mind of humans, the beings that exist with me'.
    reason: previous_rendering
  - marker: m
    text: Or 'and the wise who are within'.
    reason: previous_rendering
translation:
  language: ko
  text: '당신의 말씀 안에 있는 천사들의 소리와, 신들을


    그리고 조언으로 나아가는 신들,


    그리고 나와 함께 존재하는 사람들의 영들과,


    그리고 안에 존재하는 여자들.


    나는 그녀입니다 — 당신[복수]…[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲥⲓⲥ는 ‘침묵/고요’ 또는 명령형 ‘잠잠하라’로도 읽힐 수 있는 불확실한 형식입니다. 여기서는 목록형 구조를 살려 ‘소리’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲡϣⲟϫⲛⲉ는 ‘조언/계획/의논’의 뜻이며, 이전의 ‘voice/sound’ 판독은 수정되었습니다.
    reason: textual_variant
  - marker: c
    text: ⲧⲉⲧ-은 2인칭 복수 표지이므로, 마지막 절은 ‘당신[복수]’로 남겨 두었습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲥⲓⲥ
  english_pob_choice: silence
  chosen_korean: 소리
  alternatives_korean:
  - 침묵
  - 조용함
  lexicon: Coptic (Sahidic) general lexicon; form uncertain
  rationale: 현재 구간의 문맥이 목록형 병렬구조를 이루므로, 한국어에서는 ‘소리’로 풀어 천사들의 항목을 자연스럽게 살렸습니다. 다만 원형 자체가 불확실하므로 단정적 의미는 피했습니다.
- source_word: ϩⲙ̄ ⲡⲗⲟⲅⲟⲥ
  english_pob_choice: within the Word
  chosen_korean: 말씀 안에 있는
  alternatives_korean:
  - 말씀 속에 있는
  - 로고스 안에 있는
  lexicon: Greek λόγος via Coptic
  rationale: ‘Word’를 표준적으로 ‘말씀’으로 옮기되, 한국어에서는 자연스러운 관형형 ‘말씀 안에 있는’으로 처리했습니다.
- source_word: ⲛ̄ⲛⲟⲩⲧⲉ
  english_pob_choice: the gods
  chosen_korean: 신들
  alternatives_korean:
  - 하나님
  - 신적 존재들
  lexicon: Coptic ⲛⲟⲩⲧⲉ (God/god), plural construed by context
  rationale: 복수형 병렬을 살리기 위해 ‘신들’로 옮겼습니다. 단수 ‘하나님’은 본문의 대조와 리스트 구조를 흐릴 수 있어 배제했습니다.
- source_word: ⲉⲃⲟⲗ ϩⲓⲧⲙ̄ ⲡϣⲟϫⲛⲉ
  english_pob_choice: go out by means of the counsel
  chosen_korean: 조언으로 나아가는
  alternatives_korean:
  - 조언에 의해 나아가는
  - 계책으로 나아가는
  lexicon: Coptic ⲉⲃⲟⲗ (out), ϩⲓⲧⲙ̄ (by means of), ⲡϣⲟϫⲛⲉ (counsel/plan/advice)
  rationale: ⓥ-어미 구조를 살리면서도 한국어에서 어색한 직역을 피하기 위해 ‘조언으로 나아가는’으로 다듬었습니다. 여기서는 ‘voice’가 아니라 ‘counsel’이라는 교정된 읽기를 따랐습니다.
- source_word: ⲡⲛⲁ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 영혼
  - 마음
  lexicon: Coptic nomen sacrum for πνεῦμα
  rationale: 교정된 판독에 따라 ‘mind’가 아니라 ‘영’으로 번역했습니다. 한국어 종교어휘에서도 가장 중립적이고 원문 친화적인 선택입니다.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  english_pob_choice: women
  chosen_korean: 여자들
  alternatives_korean:
  - 여인들
  - 여성들
  lexicon: Coptic plural of ⲥϩⲓⲙⲉ (“woman”)
  rationale: 원문이 분명히 ‘women’이므로, 문어체 현대 한국어에서 직접적인 ‘여자들’을 택했습니다. ‘여성들’은 추상적이고 ‘여인들’은 문체상 과도하게 정서화됩니다.
theological_decisions:
- issue: ‘신들’이라는 복수 표현의 보존
  chosen_reading: 본문의 병렬 구조와 Coptic 복수형을 따라 ‘신들’을 유지했습니다.
  alternative_readings:
  - ‘하나님’으로 단수화
  - ‘신적 존재들’로 완화
  rationale: 이 구절은 의도적으로 복수 신격/존재를 나열하는 형식이므로, 단수 신론적 완화는 원문이 가진 긴장을 지워버립니다. 번역은 그 긴장을 보존해야 합니다.
  doctrine_reference: 원문 충실성 원칙, 다신적/영적 존재 목록의 문학적 장치 보존
