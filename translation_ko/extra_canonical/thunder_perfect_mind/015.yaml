theological_decisions:
- issue: 화자 자기정체성의 역설 보존
  chosen_reading: ‘종’과 ‘주부’의 병치를 통해 동일 화자가 종속과 권위를 동시에 선포하는 역설을 그대로 드러냈습니다.
  alternative_readings:
  - ‘노예’로 더 강하게 노예성을 드러내는 읽기
  - ‘여주인’으로 가정적 뉘앙스를 살리는 읽기
  rationale: 이 대목은 사회적 위계의 전복을 핵심 수사로 삼으므로, 완화하지 않고 양면성을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 문학적-신학적 역설, 본문 수사
