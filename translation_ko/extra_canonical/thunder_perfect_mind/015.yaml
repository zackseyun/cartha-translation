base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/015.yaml
  text: My father[a], and the sister of my husband—and he is my offspring. I am the servant of my husband[e][d][c][b], and I am the Lady.
  footnotes:
  - marker: a
    text: ‘He is the one who begot me’ reflects a paternal begetting nuance; some English versions read ‘gave birth to me,’ but the Coptic idiom distinguishes begetting (father) from bearing (mother).
    reason: lexical_alternative
  - marker: b
    text: If the underlying word is ⲡϩⲙϩⲁⲗ, the line reads ‘I am the bride and the bridegroom,’ a well-known paradox in this poem.
    reason: alternative_reading
  - marker: c
    text: ⲧϫⲟⲉⲓⲥ is the feminine counterpart to ‘lord,’ hence ‘Lady’; ‘mistress’ is another option but carries modern overtones.
    reason: cultural_note
  - marker: d
    text: Or 'the one who begot me'.
    reason: previous_rendering
  - marker: e
    text: Or 'the bride'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아버지[a], 그리고 내 남편의 누이 — 그는 내 자손입니다. 나는 내 남편의 종[e][d][c][b]이며, 나는 주부입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 아버지’입니다. 일부 영어 전승은 ‘나를 낳으신 분’으로 풀지만, 여기서는 부계적 ‘낳음/잉태됨’의 뉘앙스를 보존했습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문 단어 ⲧϩⲙϩⲁⲗ은 ‘종’ 또는 ‘노예’입니다. 주변 문맥은 신분 역설을 형성하므로 ‘브라이드(신부)’로 읽는 해석은 따르지 않았습니다.
    reason: alternative_reading
  - marker: c
    text: ⲧϫⲟⲉⲓⲥ은 여성형 ‘주(主)/lord’에 해당하므로 ‘주부’ 또는 ‘여주인’이 가능한데, 여기서는 위계적 칭호를 살리기 위해 ‘주부’를 택했습니다.
    reason: cultural_note
  - marker: d
    text: 다른 해석으로는 ‘나를 낳으신 분’이 있습니다.
    reason: previous_rendering
  - marker: e
    text: 다른 해석으로는 ‘신부’가 있습니다. 다만 원문은 ‘신부’가 아니라 ‘종’을 뜻합니다.
    reason: previous_rendering
