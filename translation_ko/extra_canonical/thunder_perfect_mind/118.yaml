    rationale: 원문은 ϣⲁⲛ-으로 시작하는 절이며, νήφω 계열은 ‘정신을 차리다/맑은 정신이 되다’라는 동사적 의미입니다. 초안은 ‘때까지’의 한계 관계를 삭제하고 ‘-으니’라는 인과 관계를 추가했습니다.
