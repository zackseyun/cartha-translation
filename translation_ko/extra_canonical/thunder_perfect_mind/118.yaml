  source_fidelity: 수정이 필요합니다. 초안은 ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ를 명사구 ‘맑은 정신’으로 바꾸고, ϣⲁⲛ-의 시간·한계 기능(‘…할 때까지’)과 동사적 ‘정신을 차리다/맑은 정신이 되다’를 누락했습니다. 이는 원문의 통사 관계를 크게 바꿉니다. 또한 ⲛⲥⲉ ⲡⲱⲧ의 주어는 앞의 열거 항목을 가리킬 가능성이 있으므로 한국어에서도 ‘그것들이’로 최소한만 보충하는 편이 안전합니다.
  naturalness: ‘무지들이 있으며’의 반복은 한국어에서 다소 부자연스럽고, ‘자기 공허함’은 복수 소유 표지 ⲡⲟⲩ-를 충분히 반영하지 못합니다. ‘무지와 … 있으며’ 및 ‘그것들의 공허함’이 현대 표준어 문장으로 더 자연스럽습니다. 불완전하게 보이는 ‘…때까지입니다’는 이 대목이 더 큰 문맥에서 절단된 발췌문이라는 점을 감안해 원문의 한계절을 보존한 처리입니다.
  terminology: ‘정념’, ‘쾌락’, ‘힘’, ‘취하다’, ‘공허함’은 대체로 적절합니다. νήφω 계열은 명사 ‘맑은 정신’보다 동사적으로 ‘정신을 차리다’로 옮겨야 하며, 이는 현대 한국어에서도 자연스럽습니다. ⲡⲣⲟⲥ 뒤의 목적어는 본문에 넣어 보완하지 않고 각주에서 불확실성을 밝혀야 합니다.
