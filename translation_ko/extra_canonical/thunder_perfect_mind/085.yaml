  lexicon: Coptic ⲉⲧϣⲏⲡ의 접근 가능/쉽게 이르는 뉘앙스
  rationale: 원문의 ‘쉽게 다가오고 닿을 수 있음’의 뉘앙스를 살리기 위해 ‘도달할 수 있는’으로 옮겼습니다.
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  english_pob_choice: cannot be grasped
  chosen_korean: 붙잡을 수 없는
  alternatives_korean:
  - 파악할 수 없는
  - 이해할 수 없는
  - 잡을 수 없는
  lexicon: 부정 상대구문 + ϣⲉ의 붙잡다/파악하다 의미 범위
  rationale: 신체적·인지적 의미를 함께 열어 두기 위해, 단순한 ‘이해하다’보다 더 넓은 ‘붙잡다’를 택해 원문의 역설성을 보존했습니다.
