  lexicon: Coptic 그리스어 차용어 ⲧⲉⲅⲕⲣⲁⲧⲓⲁ (enkrateia)
  rationale: 원문의 윤리적 자기통제 의미를 살리면서도 한국어로 간결하게 읽히도록 ‘절제’를 선택했습니다.
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ
  english_pob_choice: existing within me
  chosen_korean: 내 안에 존재합니다
  alternatives_korean:
  - 내 안에 있습니다
  - 내 안에 머뭅니다
  - 내 안에 존재하고 있습니다
  lexicon: Coptic ϣⲟⲟⲡ = exist/be present; ⲛϩⲏⲧ = within/inside
  rationale: 수정된 영어처럼 이 절은 앞의 여성 명사들을 수식하므로, 한국어에서는 ‘존재합니다’로 옮겨 상태의 현재성과 내부성을 함께 드러냈습니다.
- source_word: ⲡⲥⲱⲧⲙ
  english_pob_choice: the hearing
  chosen_korean: 들음
  alternatives_korean:
  - 청취
  - 듣는 것
  - 들을 수 있음
  lexicon: Coptic ⲥⲱⲧⲙ = hear; nominal ⲡⲥⲱⲧⲙ = hearing
  rationale: ‘hearing’의 명사성을 유지하면서도 시적 문맥에 맞게 압축된 한국어 명사형 ‘들음’을 택했습니다.
- source_word: ⲉⲧϣⲏⲡ
  english_pob_choice: that is attainable
  chosen_korean: 도달할 수 있는
  alternatives_korean:
