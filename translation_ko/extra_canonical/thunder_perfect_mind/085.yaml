  source_fidelity: 현 초안의 첫 행 ‘지각과 절제의 마음’은 ⲙⲫⲏⲧ(‘마음의’)를 ‘절제’에만이 아니라 두 명사를 포괄하는 방식으로 부자연스럽게 결속시키며, 뒤의 ‘내 안에 존재합니다’도 한국어 문법상 ‘마음’에 걸리기 쉽습니다. 원문의 여성 단수 관계형 ⲉⲥϣⲟⲟⲡ는 남성인 ‘마음’을 직접 수식하지 않으므로, ‘마음의 지각과 절제가 내 안에 있습니다’로 하여 존재 절이 선행 여성 명사구를 받게 하는 것이 안전합니다. ‘모든 사람이 가닿을 수 있는’은 ⲉⲧϣⲏⲡ의 접근 가능/도달 가능 의미를 유지합니다.
  naturalness: ‘마음의 지각과 절제’는 시적이면서도 현대 표준 한국어에서 이해 가능하며, ‘들음’은 명사적 역설을 보존하는 적절한 문어적 선택입니다. ‘내 안에 존재합니다’보다 ‘내 안에 있습니다’가 이 짧은 시문에서 자연스럽습니다.
  terminology: ϩⲟⲣⲁⲥⲓⲥ는 ‘지각’으로, ⲧⲉⲅⲕⲣⲁⲧⲓⲁ는 ‘절제’로 유지할 수 있습니다. ⲡϣⲁϫⲉ는 특정 교리적 함의를 덧붙이는 ‘말씀’ 대신 ‘말’로 옮기는 것이 중립적입니다. ‘붙잡을 수 없는’은 물리적·인지적 양의를 보존합니다.
