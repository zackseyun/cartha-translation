    reason: previous_rendering
translation:
  language: ko
  text: '그분이 나를 만드신 이에게[a].


    나는 그분의 이름을 외쳐 부를 자입니다.


    그러니 그분의 말씀을 보십시오.


    그리고 완성된 모든 글을 보십시오.


    그러므로 듣는 이들아, 들으십시오.


    그리고 너희 자신도, 천사들이여[c][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그분이 나를 만드신 이에게”는 본문에 남은 수여 구문을 따라 옮긴 것으로, 감사 기록상 이 위치 뒤에는 화자의 선포가 이어집니다.
    reason: source_note
  - marker: b
    text: 감수 기록은 이 자리를 “듣는 이들” 다음의 대구로 이해하지만, 현 OCR에는 ‘천사들’에 해당하는 흔적이 남아 있어 본문상의 긴장을 반영했습니다.
    reason: textual_variant
  - marker: c
    text: 또는 “너희 자신도, 천사들이여”로 읽을 수 있습니다.
    reason: alternative_reading
