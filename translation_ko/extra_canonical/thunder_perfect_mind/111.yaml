  rationale: 본문의 자기규정은 정체성 서술이면서 동시에 창조주를 향한 공적 선포를 뜻하므로, ‘외쳐 부를 자’로 강도를 유지했습니다.
  doctrine_reference: 문학적-신학적 화자 정체의 자기증언
- issue: 감수 복원에 따른 본문 의미
  chosen_reading: 이 구절은 OCR 조각이 아니라 감수된 복원 의미를 따라 ‘글’과 ‘듣는 이들’을 포함합니다.
  alternative_readings:
  - 현 OCR 조각을 문자적으로 따라 ‘소리/귀기울임’으로 옮김
  - 불확정 본문으로 남김
  rationale: 제공된 감사 기록이 이 부분의 전도된 OCR을 바로잡았으므로, 독자를 오도하지 않기 위해 복원된 본문 의미를 반영했습니다.
