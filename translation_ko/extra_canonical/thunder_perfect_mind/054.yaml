base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/054.yaml
  text: 'I am she from whom you hide,[a]

    and you reveal me.

    But whenever you hide yourselves,[c][b]

    I myself will appear.'
  footnotes:
  - marker: a
    text: ⲟⲩⲟⲛϩ/ⲟⲩⲟⲛϩⲧ can also mean “make alive” in other contexts; with ⲟⲩⲁⲛ (“one”), the sense “unite/gather (into one)” is most natural here.
    reason: lexical_alternative
  - marker: b
    text: The OCR snippet includes additional clauses (“I myself will be united,” references to “outside”) likely belonging to adjacent lines; this block renders only the core paradox pair.
    reason: alignment_note
  - marker: c
    text: Or 'I am the one you have scattered,\nand you have gathered me into one.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 너희가 숨기는 그 사람이며, 너희는 나를 드러냅니다.

    그러나 너희가 자신을 숨길 때마다,

    내가 스스로 나타날 것입니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 동사 ϩⲱⲡ은 여기서 ‘숨기다’의 뜻이 자연스럽습니다.
    reason: source_note
  - marker: b
    text: 원문은 ‘너희 자신’을 뜻하는 재귀적 표현을 포함합니다.
    reason: source_note
  - marker: c
    text: 여기서 ⲟⲩⲁⲛ ⲇⲉ는 ‘그러나/하지만’의 전환을 이끄는 구조로 읽는 것이 자연스럽습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲧⲁⲧⲉⲧⲛϩⲱⲡ ⲉⲣⲟⲉⲓ
  english_pob_choice: I am she from whom you hide
  chosen_korean: 나는 너희가 숨기는 그 사람이며
  alternatives_korean:
  - 나는 너희가 숨는 것을 숨기게 하는 그 사람이며
  - 나는 너희가 감추는 자이며
  lexicon: Crum, Coptic Dictionary
  rationale: ϩⲱⲡ는 이 문맥에서 ‘숨기다’가 가장 자연스럽고, ⲉⲣⲟⲓ는 ‘나에게/내게 대하여’의 관계를 나타내므로 한국어에서는 관계절로 풀어 ‘너희가 숨기는 그 사람’으로 옮겼습니다.
- source_word: ⲁⲩⲱ ⲧⲉⲧⲛⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  english_pob_choice: and you reveal me
  chosen_korean: 너희는 나를 드러냅니다
  alternatives_korean:
  - 너희는 나를 나타냅니다
  - 너희는 나를 보이게 합니다
  lexicon: Crum, Coptic Dictionary
  rationale: ⲟⲩⲟⲛϩ는 ‘드러내다/나타내다’ 계열이므로, 본문 대비를 살리면서도 한국어에서 가장 직접적인 ‘드러냅니다’를 선택했습니다.
- source_word: ⲟⲩⲁⲛ ⲇⲉ ⲉⲧⲉⲧⲛϣⲁⲛϩⲱⲡ ⲙⲙⲱⲧⲛ
  english_pob_choice: But whenever you hide yourselves
  chosen_korean: 그러나 너희가 자신을 숨길 때마다
  alternatives_korean:
  - 그러나 너희가 너희 자신을 숨길 때마다
  - 그런데 너희가 숨을 때마다
  lexicon: Crum, Coptic Dictionary
  rationale: ⲟⲩⲁⲛ ⲇⲉ는 ‘그러나/하지만 ~할 때마다’의 전환을 만들고, ⲙⲙⲱⲧⲛ은 재귀적 ‘너희 자신’을 드러내므로 이를 분명히 살렸습니다.
- source_word: ⲁⲛⲟⲕ ϩⲱⲱⲧ ϯⲛⲁⲟⲩⲟⲛϩⲧ
  english_pob_choice: I myself will appear
  chosen_korean: 내가 스스로 나타날 것입니다
  alternatives_korean:
  - 나 자신이 나타날 것입니다
  - 내가 직접 나타날 것입니다
  lexicon: Crum, Coptic Dictionary
  rationale: ϩⲱⲱⲧ은 ‘스스로/자기 자신’의 강조이므로 ‘내가 스스로’로 옮겨 주어, 단순 미래보다 자기현현의 강조를 살렸습니다.
theological_decisions:
- issue: 이 문구의 주어 화자 성별 표지
  chosen_reading: 영어 POB의 'she'를 따라 '나는 너희가 숨기는 그 사람'으로 성별을 한국어 문법상 명시하지 않고, 대신 여성 대명사 표지를 본문 밖으로 과도하게 보강하지 않았습니다.
  alternative_readings:
  - 나는 너희가 숨기는 그 여자입니다
  - 나는 너희가 숨기는 그분입니다
  rationale: 콥트어 원문은 화자 성별을 한국어처럼 직접 표지하지 않으며, 영어 POB의 'she'는 해석상 보강입니다. 한국어에서는 문맥의 신비성과 수사적 대비를 유지하기 위해 성별 명시를 완화했습니다.
  doctrine_reference: 원문 수사와 해석적 보강의 균형
- issue: ‘드러내다/나타나다’의 상호성
  chosen_reading: ‘너희는 나를 드러냅니다’와 ‘내가 스스로 나타날 것입니다’로 대조를 살려, 숨김-드러냄-자기현현의 역설을 유지했습니다.
  alternative_readings:
  - 너희는 나를 보이게 합니다 / 내가 나타날 것입니다
  - 너희는 나를 밝힙니다 / 내가 드러날 것입니다
  rationale: 원문은 단순 정보 전달이 아니라 숨김과 현현의 역설을 구성하므로, 동사의 대칭성과 긴장을 유지하는 표현이 필요합니다.
  doctrine_reference: 수사적 역설 보존
