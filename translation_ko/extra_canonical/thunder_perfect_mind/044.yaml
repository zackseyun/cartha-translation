theological_decisions:
- issue: Thunder의 자기 동일시를 한국어에서 어떻게 처리할지
  chosen_reading: ‘나는 그 여자입니다’로 여성 화자의 자기 선언을 직접 유지했습니다.
  alternative_readings:
  - 나는 그녀입니다
  - 나는 그 존재입니다
  rationale: 이 대목은 성별 표지가 문법적으로 중요한 자기지칭이므로, 중성화하거나 추상화하면 원문의 반복적 정체성 선언이 약해집니다.
  doctrine_reference: 문학적/계시문학적 화자 정체성 보존
- issue: ‘be manifest’의 계시적 뉘앙스
  chosen_reading: ‘드러나게 될’로 번역해 단순한 출현보다 계시적 가시성을 살렸습니다.
  alternative_readings:
  - 나타나게 될
  - 보이게 될
  rationale: POB의 영어 선택처럼 원문의 revelatory tone을 유지하는 것이 이 문맥의 핵심이므로, 한국어에서도 신비적 드러남을 전면화했습니다.
  doctrine_reference: 계시적 표상 보존
