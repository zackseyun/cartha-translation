  naturalness: 초안은 ‘나는 그 여자입니다’가 한국어에서 불필요하게 지시적이고, 뒤의 ‘…이며, 내가 … 여자입니다’는 병렬과 문법 연결이 어색합니다. ‘여성인 이’와 두 개의 짧은 자기 선언으로 나누면 시적 반복과 현대 한국어 문장이 함께 살아납니다.
  terminology: ‘헬라인들’은 적절합니다. ‘야만인들’은 원어의 그리스-로마권 대조 범주를 직역한 말이므로 유지할 수 있으나, 현대적 가치판단으로 오해되지 않도록 문화사 주석에서 비그리스어권을 가리키는 범주였음을 밝혀야 합니다. ⲕⲏⲙⲉ는 ‘이집트’, ⲥⲉⲓⲛⲉ는 ‘드러날’이 적절합니다.
