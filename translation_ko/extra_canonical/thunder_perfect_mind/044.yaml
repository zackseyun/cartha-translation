theological_decisions:
- issue: Thunder의 자기 동일시를 한국어에서 어떻게 처리할지
  chosen_reading: ‘나는 그 여자입니다’로 여성 화자의 자기 선언을 직접 유지했습니다.
  alternative_readings:
