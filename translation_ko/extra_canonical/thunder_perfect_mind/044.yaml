    text: 콥트어는 복수 정관사를 사용하지만, 영어 POB는 자기 동일시의 리듬을 살리기 위해 단수형처럼 제시했습니다. 한국어는 복수형을 유지해 원문 표지를 반영했습니다.
    reason: source_note
  - marker: d
