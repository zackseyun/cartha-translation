  text: I am she — the Greek and the barbarian[a][c][d]; I am she who will be manifest[b] in Egypt.
  footnotes:
  - marker: a
    text: “Greeks and barbarians” is a Greco-Roman binary contrasting Greek-speakers with all non-Greeks; Thunder frequently embraces both sides of such pairs.
    reason: cultural_note
  - marker: b
    text: Or, “appear.” “Be manifest” is chosen to retain a revelatory tone.
    reason: lexical_alternative
  - marker: c
    text: The Coptic shows plural articles (“the Greeks … the barbarians”). The English uses a singular identity pair to preserve Thunder’s self-identification cadence; sense remains inclusive of both groups.
    reason: parallelism_note
  - marker: d
    text: This block’s OCR includes two unclear segments preceding the clearer phrases; the consult English provided does not correspond to these lines. Rendering is confined to the secure phrases until better alignment is available.
    reason: alignment_note
translation:
  language: ko
  text: 나는 그 여자입니다 — 헬라인들과 야만인들[a][c][d]이며, 내가 이집트에서 드러나게 될[b] 여자입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헬라인들과 야만인들’은 그리스-로마 세계의 문화적 이분법을 가리키며, 본문의 자기 동일시 열거는 이런 대조쌍을 포괄합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘나타나게 될’.
    reason: lexical_alternative
  - marker: c
    text: 콥트어는 복수 정관사를 사용하지만, 영어 POB는 자기 동일시의 리듬을 살리기 위해 단수형처럼 제시했습니다. 한국어는 복수형을 유지해 원문 표지를 반영했습니다.
    reason: source_note
  - marker: d
    text: 이 단락의 앞부분에는 OCR이 불확실한 구절이 포함되어 있어, 확인된 핵심 표현만 번역했습니다.
    reason: textual_variant
