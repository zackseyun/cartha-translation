  - 나 때문에
  - 내게서 비롯하여
  lexicon: Crum; Layton
  rationale: 원인의 방향을 분명히 하면서도, 단순한 구어체보다 문어적이고 중립적인 인과 표현을 살렸습니다.
- source_word: ⲝⲉⲛⲟⲥ
  english_pob_choice: foreigner
  chosen_korean: 외국인
  alternatives_korean:
  - 낯선 사람
  - 나그네
  - 이방인
  lexicon: Crum; Layton; LSJ
  rationale: 뒤의 ‘시민’과 짝을 이루는 시민권적 대비를 가장 선명하게 드러내는 말로 옮겼습니다.
- source_word: ⲡⲟⲗⲓⲧⲏⲥ
  english_pob_choice: citizen
  chosen_korean: 시민
  alternatives_korean:
  - 도시 사람
  - 주민
  - 국민
  lexicon: Crum; Layton; LSJ
  rationale: ‘외국인’과의 대구를 유지하는 표준적인 공적 용어이므로 ‘시민’이 적절합니다.
theological_decisions:
- issue: 원문이 제시하는 역설적 자기 규정(평화/전쟁, 외국인/시민)을 어떻게 보존할지
  chosen_reading: 역설을 완화하지 않고 양항을 그대로 병렬하여, 동일한 화자가 상반된 정체성을 동시에 진술하는 효과를 유지했습니다.
  alternative_readings:
  - 의역하여 설명적으로 풀기
  - 대립을 약화한 표현으로 조정하기
  rationale: 이 작품의 의미는 상호모순처럼 보이는 진술의 충돌에 있으므로, 해석을 덧붙이기보다 원문의 충격을 보존하는 것이 적절합니다.
  doctrine_reference: 문학적-신학적 역설의 보존 원칙
- issue: ⲉⲓ의 완료적 의미를 한국어에서 어떻게 처리할지
  chosen_reading: ‘일어났습니다’로 옮겨 사건의 결과가 이미 발생했음을 드러냈습니다.
  alternative_readings:
  - 일어났습니다
  - 일어났습니다/생겨났습니다
  - 일어났습니다(또는 일어났습니다)
  rationale: 영문 POB의 ‘has come’과 마찬가지로 완료적 결과를 살리되, 한국어에서는 ‘일어났습니다’가 전쟁의 발발을 자연스럽게 전달합니다.
  doctrine_reference: 시제·상(aspect) 보존 원칙
