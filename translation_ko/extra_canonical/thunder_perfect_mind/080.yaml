  - 분쟁
  - 갈등
  lexicon: Crum; Layton; LSJ
  rationale: ‘전쟁’이 ‘평화’와 가장 강한 대조를 이루며, 시적 역설의 힘을 약화시키지 않습니다.
- source_word: ⲉⲧⲃⲉ ⲁⲛⲟⲕ
  english_pob_choice: because of me
  chosen_korean: 나로 말미암아
