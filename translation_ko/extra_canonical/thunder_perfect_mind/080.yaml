translation:
  language: ko
  text: '나는 평화입니다[a], 그리고 전쟁이 나로 말미암아 일어났습니다[b];

    그리고 나는 외국인이며 시민입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “낯선 사람”. ⲝⲉⲛⲟⲥ는 ‘외국인’과 ‘낯선 사람’ 모두 가능하지만, 뒤의 ‘시민’과의 시민권적 대비를 위해 ‘외국인’을 본문에 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “일어났습니다”. 완료형은 전쟁이 발발했다는 결과를 살립니다.
    reason: lexical_alternative
