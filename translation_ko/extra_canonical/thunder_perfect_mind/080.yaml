  yaml_path: translation/extra_canonical/thunder_perfect_mind/080.yaml
  text: 'I am peace[a], and war has come because of me[c][b];

    and I am a foreigner and a citizen.'
  footnotes:
  - marker: a
    text: 'Or: ''stranger''. Both are acceptable renderings of ⲝⲉⲛⲟⲥ; ''foreigner'' foregrounds the civic contrast with ''citizen''.'
    reason: lexical_alternative
  - marker: b
    text: '''Has arisen'' is also possible for the perfect of ''to come'' and preserves the sense of war breaking out.'
    reason: lexical_alternative
  - marker: c
    text: The OCR excerpt here shows unrelated Greek loans (kolasis, physis, ktisis, psychē), indicating a likely misalignment with this segment.
    reason: alignment_note
translation:
  language: ko
  text: '나는 평화입니다[a], 그리고 전쟁이 나로 말미암아 일어났습니다[b];

    그리고 나는 외국인이며 시민입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “낯선 사람”. ⲝⲉⲛⲟⲥ는 ‘외국인’과 ‘낯선 사람’ 모두 가능하지만, 뒤의 ‘시민’과의 시민권적 대비를 위해 ‘외국인’을 본문에 두었습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “일어났습니다”. 완료형은 전쟁이 발발했다는 결과를 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲓⲣⲏⲛⲏ (loan from Greek εἰρήνη)
  english_pob_choice: peace
  chosen_korean: 평화
  alternatives_korean:
  - 평강
  - 안식
  - 평온
  lexicon: Crum; Layton; LSJ (for Greek loans)
  rationale: 원문의 핵심 대립은 ‘평화/전쟁’이므로, 한국어에서도 가장 직접적이고 공개 가능한 어감의 ‘평화’를 택했습니다.
- source_word: ⲡⲟⲗⲉⲙⲟⲥ (loan from Greek πόλεμος)
  english_pob_choice: war
  chosen_korean: 전쟁
  alternatives_korean:
