  yaml_path: translation/extra_canonical/thunder_perfect_mind/047.yaml
  text: 'Among the peoples[a], they have named me “Death.”

    I am she whom they call “Law,” and you have called me “Lawlessness.”

    I am she whom you pursued, and I am she whom you seized.'
  footnotes:
  - marker: a
    text: Or 'They have named me “Law,” and you have named me “Lawlessness.”'.
    reason: previous_rendering
translation:
  language: ko
  text: '사람들 가운데에서는 나를 “죽음”이라고 불렀습니다.[a] 나는 그들이 “율법”이라고 부르는 이이며, 너희는 나를 “불법”이라고 불렀습니다.


    나는 너희가 뒤쫓은 이이며, 나는 너희가 붙잡은 이입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 나를 ‘율법’이라고 불렀고, 너희는 나를 ‘불법’이라고 불렀습니다.”
    reason: 영어 POB 감사 기록에 보존된 이전 본문 이문을 유지합니다. 이 대안은 본문의 첫 명칭 ‘죽음’을 ‘율법’으로 읽는 경우를 제시합니다.
