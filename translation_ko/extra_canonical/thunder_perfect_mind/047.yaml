  lexicon: Greek loanwords νόμος / ἀνομία in Coptic
  rationale: 대조쌍의 형식과 어감을 살리기 위해 전형적인 교회어 ‘법’보다 ‘율법’을 유지하고, 그 반대항은 어휘적 대응이 분명한 ‘불법’으로 옮겼습니다.
- source_word: ⲁⲛⲟⲕ ⲧⲉ … ⲧⲉ ϣⲁⲩⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ
