  text: For I am the first and the last[a][b].
  footnotes:
  - marker: a
    text: See Isaiah 44:6; Revelation 22:13 for similar formulae (“I am the first and I am the last”).
    reason: cross_reference
  - marker: b
    text: ⲑⲁⲉ can also be read as “the end.” The balanced rendering “the last” is chosen here.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 처음이자 마지막이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 비슷한 표현은 이사야 44:6과 요한계시록 22:13을 보십시오(“나는 처음이요 나는 마지막이다”).
    reason: cross_reference
  - marker: b
    text: ⲑⲁⲉ는 ‘끝’으로도 읽을 수 있습니다. 여기서는 앞의 ‘처음’과의 대구를 살려 ‘마지막’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  english_pob_choice: I am
  chosen_korean: 내가 …입니다
  alternatives_korean:
  - 나는 …입니다
  - 내가 …이다
  lexicon: Sahidic Coptic pronoun
  rationale: 원문은 단순 주어가 아니라 자기 동일시의 서술형 표현이므로, 한국어도 ‘내가’와 서술형 종결을 살려 존재 선언의 힘을 유지했습니다.
- source_word: ⲧϣⲟⲣⲡ
  english_pob_choice: the first
  chosen_korean: 처음
  alternatives_korean:
  - 첫째
  - 첫 번째
  lexicon: Crum; Sahidic noun meaning 'the first, the beginning'
  rationale: 이 절에서는 위격적 호칭보다 첫 항목으로서의 자기를 드러내므로, 현대 한국어에서 자연스럽고 간결한 ‘처음’을 택했습니다.
- source_word: ⲑⲁⲉ
  english_pob_choice: the last
  chosen_korean: 마지막
  alternatives_korean:
  - 끝
  - 최후
  lexicon: Crum; Sahidic noun “end, last”
  rationale: 영어 POB가 ‘the last’로 균형을 잡았고, 한국어도 대구를 유지하기 위해 ‘마지막’으로 옮겼습니다. ‘끝’은 가능하지만 이 구절의 균형감이 약해집니다.
theological_decisions:
- issue: 수사적 대구의 보존
  chosen_reading: ‘처음’과 ‘마지막’을 대칭적으로 배치해 자기 선언의 역설적 울림을 보존했습니다.
  alternative_readings:
  - ‘처음이며 끝입니다’
  - ‘첫째이며 마지막입니다’
  rationale: 원문과 영어 POB 모두 대구를 핵심으로 삼으므로, 한국어도 그 구조를 살리는 것이 의미 전달에 가장 충실합니다.
  doctrine_reference: 문학적-수사적 구조 보존
