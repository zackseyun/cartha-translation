    reason: lexical_alternative
  - marker: c
    text: 제공된 콥트어 OCR은 이 구절에서 손상·오독 가능성이 있으나, 현존 영어 대조문은 ‘Hear me in anger, and learn of me in gentleness.’로 정리됩니다.
    reason: source_note
