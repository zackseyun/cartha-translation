base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
  footnotes:
  - marker: a
    text: ⲛ̄ⲧⲉⲧⲛ̄ with ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ could also be read as “of you (pl.),” i.e., “my self‑control concerning you” or “over you.”
    reason: alignment_note
  - marker: b
    text: ⲧⲏⲛⲉ marks intensity; alternatives include “much” or “exceedingly.”
    reason: lexical_alternative
  - marker: c
    text: ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ could be understood more concretely as “the band of slaughter,” hence “those killed in violence.”
    reason: alignment_note
  - marker: d
    text: Or 'and do not send me into the assembly of violence.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나의 낮음[a]을 업신여기지 마십시오.

    그리고 너희에 대한 나의 절제[b]로 그 여자를 사랑하십시오.

    나를 지나치게[c] 비웃지 마십시오.

    그리고 나의 허물[d]을 업신여기지 말고, 나의 자랑을 저주하지 마십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ⲙⲛ̄ⲧⲥⲧⲙⲏⲧ는 도덕적 ‘겸손’보다 낮은 처지·하찮게 여겨짐을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ⲛ̄ⲧⲉⲧⲛ̄는 ‘너희의’가 아니라 ‘너희에 대한/너희를 향한’으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ⲧⲏⲛⲉ는 단순한 ‘많이’보다 강한 정도를 나타내며, ‘지나치게’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직전 판본은 이 대목을 ‘폭력의 회중’으로 잘못 읽었으나, 원문은 ‘나의 허물’을 뜻하는 방향으로 이해하는 편이 맞습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲙⲉⲥⲧⲉ
  english_pob_choice: do not despise
  chosen_korean: 업신여기지 마십시오
  alternatives_korean:
  - 멸시하지 마십시오
  - 경멸하지 마십시오
  lexicon: Crum, s.v. ⲙⲉⲥⲧⲉ
  rationale: 부정 명령의 간청문 맥락에서 ‘업신여기다’가 ‘despise’의 경멸·하찮게 여김을 자연스럽게 살립니다.
- source_word: ⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  english_pob_choice: lowliness
  chosen_korean: 낮음
  alternatives_korean:
  - 비천함
  - 낮아짐
  - 겸손
  lexicon: Crum, s.v. ⲥⲧⲙⲏⲧ
  rationale: 도덕적 미덕인 ‘겸손’보다, 여기서의 상태적·사회적 낮은 처지를 드러내는 ‘낮음’이 원문의 뉘앙스를 더 잘 보존합니다.
- source_word: ⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  english_pob_choice: self-control
  chosen_korean: 절제
  alternatives_korean:
  - 자제
  - 극기
  - 자기 절제
  lexicon: 그리스어 ἐγκράτεια 차용어
  rationale: 한국어에서 윤리적 덕목으로 굳은 표현인 ‘절제’가 간결하면서도 ‘self-control’의 의미를 유지합니다.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄
  english_pob_choice: toward you
  chosen_korean: 너희에 대한
  alternatives_korean:
  - 너희를 향한
  - 너희의
  - 너희에게
  lexicon: 콥트어 관계 표지 ⲛ̄ⲧⲉ + 의존대명사
  rationale: 관계의 방향성을 살리되 소유로 오해되지 않게 ‘너희에 대한’으로 옮겼습니다.
- source_word: ⲙⲉⲣⲓⲧⲥ
  english_pob_choice: love her
  chosen_korean: 그 여자를 사랑하십시오
  alternatives_korean:
  - 그것을 사랑하십시오
  - 그를 사랑하십시오
  lexicon: Crum, s.v. ⲙⲉⲣⲓ
  rationale: 3인칭 여성 단수 목적대명사 ⲥ를 반영해 여성형 지시를 유지했습니다.
- source_word: ⲕⲱ ⲧⲏⲛⲉ
  english_pob_choice: laugh ... excessively
  chosen_korean: 지나치게 비웃지 마십시오
  alternatives_korean:
  - 많이 비웃지 마십시오
  - 몹시 비웃지 마십시오
  lexicon: Crum, s.v. ⲕⲱ; ⲧⲏⲛⲉ
  rationale: ⲧⲏⲛⲉ의 강세를 ‘지나치게’로 옮겨 비웃음의 정도를 분명히 했습니다.
- source_word: ⲥⲁϩⲟⲩ
  english_pob_choice: do not curse
  chosen_korean: 저주하지 마십시오
  alternatives_korean:
