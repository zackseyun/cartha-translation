base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
  footnotes:
  - marker: a
    text: ⲛ̄ⲧⲉⲧⲛ̄ with ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ could also be read as “of you (pl.),” i.e., “my self‑control concerning you” or “over you.”
    reason: alignment_note
  - marker: b
    text: ⲧⲏⲛⲉ marks intensity; alternatives include “much” or “exceedingly.”
    reason: lexical_alternative
  - marker: c
    text: ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ could be understood more concretely as “the band of slaughter,” hence “those killed in violence.”
    reason: alignment_note
  - marker: d
    text: Or 'and do not send me into the assembly of violence.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나의 낮음[a]을 업신여기지 마십시오.

    그리고 너희에 대한 나의 절제[b]로 그 여자를 사랑하십시오.

    나를 지나치게[c] 비웃지 마십시오.

    그리고 나의 허물[d]을 업신여기지 말고, 나의 자랑을 저주하지 마십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ⲙⲛ̄ⲧⲥⲧⲙⲏⲧ는 도덕적 ‘겸손’보다 낮은 처지·하찮게 여겨짐을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ⲛ̄ⲧⲉⲧⲛ̄는 ‘너희의’가 아니라 ‘너희에 대한/너희를 향한’으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ⲧⲏⲛⲉ는 단순한 ‘많이’보다 강한 정도를 나타내며, ‘지나치게’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 직전 판본은 이 대목을 ‘폭력의 회중’으로 잘못 읽었으나, 원문은 ‘나의 허물’을 뜻하는 방향으로 이해하는 편이 맞습니다.
    reason: previous_rendering
