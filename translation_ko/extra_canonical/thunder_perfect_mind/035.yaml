  - 저주를 퍼붓지 마십시오
  lexicon: Crum, s.v. ⲥⲁϩⲟⲩ
  rationale: 감정적 비난을 넘어서는 주술적·선언적 저주의 어감을 살려 ‘저주하다’로 옮겼습니다.
- source_word: ϣⲟⲩϣⲟⲩ
  english_pob_choice: boasting
  chosen_korean: 자랑
  alternatives_korean:
  - 허풍
  - 과시
  - 자만
  lexicon: Crum, s.v. ϣⲟⲩϣⲟⲩ
  rationale: 원문의 자기-과시 뉘앙스를 한국어의 중립적 어휘 ‘자랑’으로 옮기되, 과도한 부정적 해석은 피했습니다.
- source_word: ⲁⲩⲱ ⲙⲡⲣ- ... ⲁⲩⲱ ⲙⲡⲣ-
  english_pob_choice: and do not ... and do not ...
  chosen_korean: 그리고 ... 마십시오 / 그리고 ... 말고
  alternatives_korean:
  - 또 ... 하지 마십시오
  - 그리고 ... 하지 마십시오
  lexicon: 콥트어 접속사 ⲁⲩⲱ 및 부정 명령 구조
  rationale: 반복되는 부정 명령을 한국어에서도 병렬로 유지해 원문의 리듬과 누적적 간청을 살렸습니다.
theological_decisions:
- issue: 원문이 낮춤/배척의 수사로 말하는 부분을 도덕적 미덕으로 완화할지 여부
  chosen_reading: ‘낮음’으로 유지하여 사회적·상태적 비하의 의미를 드러냈습니다.
  alternative_readings:
  - 겸손
  - 비천함으로 도덕화
  rationale: 문맥은 미덕 권면이 아니라 배척당하는 화자의 처지를 말하므로, ‘겸손’보다 상태성에 초점을 둔 표현이 원문 의도를 더 정확히 반영합니다.
  doctrine_reference: 수사적 자기-발화의 상태 서술 보존
- issue: ‘나의 자랑’과 그에 대한 저주를 문자적으로 유지할지 여부
  chosen_reading: ‘나의 자랑을 저주하지 마십시오’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 나의 과시를 저주하지 마십시오
  - 나의 자만을 저주하지 마십시오
  rationale: 원문은 자기-발화의 역설적 긴장을 포함하므로, 해석적으로 윤색하지 않고 문면의 표현을 보존하는 것이 적절합니다.
  doctrine_reference: 원문 수사와 긴장 보존
