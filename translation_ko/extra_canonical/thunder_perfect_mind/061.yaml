  source_fidelity: 현 OCR에는 ⲟⲩⲟⲉⲓⲉ(‘나타나다/보이다’)와 ⲉⲣⲱⲧⲛ(‘너희에게’)로 보이는 형태가 있어, 본문의 ‘내게 나타나다’는 정렬·전승상 읽기이지 OCR 자체가 확정하는 방향은 아닙니다. 따라서 영어 POB의 전통적 역설 짝을 따르되, 주석에서 방향 역전 가능성을 구체적으로 밝혀야 합니다. ‘숨다’ 부분은 이 발췌에서 온전히 확인되지 않으므로, 전승된 병행을 넘는 해석은 피했습니다.
  naturalness: 초안의 ‘나는 너희가 나에게서 숨은 자이며’는 문법적으로 가능하지만, 화자를 ‘숨은 자’로 오해하게 할 여지가 있습니다. ‘너희가 내게서 숨은 이’와 ‘너희가 내게 나타나는 이’를 병행하면 관계가 더 선명하고 현대 한국어로도 자연스럽습니다.
  terminology: 특수 신학 용어는 없습니다. ‘숨다/나타나다’는 원문의 역설적 대립을 과장 없이 유지합니다. ‘내게서’와 ‘내게’는 합쇼체 문장 안에서 자연스럽고, ‘이요 … 이입니다’는 이 선언문의 수사적 병행에 알맞습니다.
  issues:
  - severity: medium
    issue: 첫 절의 관계 지시가 모호합니다.
    rationale: ‘나는 너희가 나에게서 숨은 자’는 표면상 화자가 ‘숨은 자’인 듯 읽힐 수 있습니다. 원문의 뜻은 화자가 ‘너희가 그에게서 숨은 이’입니다.
  - severity: medium
    issue: 각주 a가 OCR의 실제 쟁점을 충분히 명시하지 않습니다.
    rationale: OCR에 보이는 ⲉⲣⲱⲧⲛ은 ‘너희에게’를 지지할 수 있으므로, 단순한 일반적 불확실성보다 본문 방향과 반대일 수 있음을 밝혀야 합니다.
  - severity: low
    issue: 각주 b의 ‘전형적 역설 쌍’ 표현은 본문 확정성을 다소 강하게 보이게 합니다.
    rationale: 이 구간은 인접 행 혼입 가능성이 있으므로, 전승·정렬에 따른 읽기임을 명시하는 편이 안전합니다.
  revised_text: 나는 너희가 내게서 숨은 이요, 너희가 내게 나타나는 이입니다.[a][b]
  revised_footnotes:
  - marker: a
    text: 이 OCR 구간에는 ⲟⲩⲟⲉⲓⲉ(‘나타나다/보이다’) 뒤에 ⲉⲣⲱⲧⲛ(‘너희에게’)로 읽힐 수 있는 형태가 보입니다. 그러므로 ‘너희가 내게 나타난다’ 대신 ‘내가 너희에게 나타난다’라는 방향을 지지할 가능성도 있습니다. 본문은 이 단락의 전통적 ‘숨다/내게 나타나다’ 병행을 따른 것입니다.
    reason: alternative_reading
