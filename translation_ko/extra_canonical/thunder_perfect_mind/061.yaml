translation:
  language: ko
  text: 나는 너희가 나에게서 숨은 자이며, 너희가 나에게 나타납니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: OCR 구간의 전치사·대명사 결합은 방향성이 약간 불확실하여, 영어 POB처럼 ‘나에게/너희에게’의 관계를 절대적으로 단정하지 않았습니다.
    reason: source_note
  - marker: b
    text: 이 대목은 ‘숨다/나타나다’의 전형적 역설 쌍으로 읽히며, 인접 행의 혼입 가능성이 주석된 영어 초안의 경고를 반영합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛⲟⲩϣⲓⲡⲉ / concealment motif
  english_pob_choice: hid yourselves
  chosen_korean: 숨은 자들
  alternatives_korean:
  - 자신을 숨긴 자들
  - 숨었던 자들
  lexicon: Coptic OCR/contextual pairing with hidden/appearing paradox
  rationale: OCR 구간에서 ‘숨다’에 해당하는 정확한 동사는 분명하지 않지만, 문맥상 ‘숨음/드러남’의 역설적 짝을 이루므로 한국어는 직접적이면서도 과도하게 해석하지 않는 ‘숨은 자들’을 택했습니다.
- source_word: ⲟⲩⲟⲉⲓⲉ
  english_pob_choice: show yourselves
  chosen_korean: 나타납니다
  alternatives_korean:
  - 드러납니다
  - 보입니다
  lexicon: Crum; common Sahidic usage for appear/be visible
  rationale: 영어 POB가 반사적 뉘앙스를 살려 ‘show yourselves’로 잡은 대목을 따라, 한국어에서는 자연스러운 현대 문체로 ‘나타납니다’라고 옮겨 ‘보이게 됨/드러남’의 역설을 유지했습니다.
- source_word: ⲉⲣⲱⲧⲛ / directionality
  english_pob_choice: to me
  chosen_korean: 나에게
  alternatives_korean:
  - 내게
  - 내 앞에
  lexicon: Standard Sahidic object-pronoun series
  rationale: 전치적 방향성은 영어 주석처럼 약간의 불확실성이 있으나, 본문 흐름상 화자 쪽 방향을 살려 가장 중립적인 ‘나에게’를 사용했습니다.
theological_decisions:
- issue: 역설적 병행(숨음/드러남)의 보존
  chosen_reading: ‘숨은 자들… 나타납니다’로 직역에 가까운 구조를 유지해 역설을 약화하지 않았습니다.
  alternative_readings:
  - ‘나를 숨기셨고… 나를 보이십니다’처럼 더 매끄럽게 조정
  - ‘내 앞에 나타납니다’로 방향성을 더 명시
  rationale: 이 문장은 신비문학 특유의 역설을 핵심 효과로 삼으므로, 평이하게 풀어 쓰기보다 숨음과 드러남의 긴장을 한국어에서도 그대로 보존하는 편이 원문 의도를 더 잘 드러냅니다.
  doctrine_reference: 문학적-수사적 보존 원칙
