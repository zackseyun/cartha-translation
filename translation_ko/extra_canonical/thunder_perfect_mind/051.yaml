theological_decisions:
- issue: 이 단락의 자기 호칭이 역설적 대조를 이룬다는 점
  chosen_reading: “생명”과 “죽음”을 직접 병렬시켜, 한 인물이 상반된 명칭을 동시에 지닌다는 역설을 보존합니다.
  alternative_readings:
  - 의역하여 의미를 완화하는 번역
  - 상징성을 풀어 설명하는 번역
  rationale: 이 텍스트는 수사적 역설이 핵심이므로, 한국어에서도 대조를 약화하지 않고 그대로 드러내는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: 문학적/수사적 보존 원칙
