  text: And what you see outside you, you see inside you; it is what is visible, and it is your garment.
translation:
  language: ko
  text: 당신이 밖에서 보는 것을 당신 안에서도 봅니다. 그것은 보이는 것이며, 당신의 옷입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲉⲃⲟⲗ
  english_pob_choice: outside
  chosen_korean: 밖에서
  alternatives_korean:
  - 바깥에서
  - 외부에서
  lexicon: Crum; Sahidic preposition/adverb
  rationale: 외부성의 대조를 살리면서 한국어에서 가장 자연스럽고 간결한 대응인 ‘밖에서’를 택했습니다.
- source_word: ⲉϩⲟⲩⲛ
  english_pob_choice: inside
  chosen_korean: 안에서도
  alternatives_korean:
  - 내부에서도
  - 안에서
  lexicon: Crum; Sahidic preposition/adverb
  rationale: ‘outside’와의 평행을 유지하기 위해 ‘안에서도’로 옮겨, 반복되는 시각적 대비를 살렸습니다.
- source_word: ⲟⲣⲁⲧⲟⲛ (Greek loan ὁρατόν)
  english_pob_choice: what is visible
  chosen_korean: 보이는 것
  alternatives_korean:
  - 볼 수 있는 것
  - 가시적인 것
  lexicon: LSJ (ὁρατός) attested as loan in Sahidic texts
  rationale: 형용사의 명사적 용법을 한국어의 관형절+명사 구조로 풀어 ‘보이는 것’으로 자연스럽게 전달했습니다.
- source_word: ⲓⲙⲁⲧⲓⲟⲛ (Greek loan ἱμάτιον)
  english_pob_choice: garment
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 겉옷
  lexicon: LSJ (ἱμάτιον) widely loaned into Coptic
  rationale: 시적 문맥에서 ‘garment’의 기본 의미를 담되, 한국어 독자에게 가장 직접적이고 무리 없는 ‘옷’으로 옮겼습니다.
theological_decisions:
- issue: ‘inside you / outside you’의 내외 대비를 어떻게 재현할지
  chosen_reading: ‘밖에서’와 ‘안에서도’를 병치해, 단순한 위치 정보가 아니라 시적·존재론적 대조로 읽히도록 했습니다.
  alternative_readings:
  - ‘바깥에서는 … 안에서는’
  - ‘외부에서는 … 내부에서는’
  rationale: 원문은 대칭 구조가 핵심이므로, 한국어에서도 동일한 대비가 즉시 드러나게 하는 것이 중요합니다.
  doctrine_reference: 문학적-존재론적 대비
