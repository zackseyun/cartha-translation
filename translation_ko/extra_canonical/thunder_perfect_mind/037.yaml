translation:
  language: ko
  text: '나의 약함을 신중히 대하십시오[a].


    그러나 나는 모든 두려움 속에 있는 이이며,


    떨림 속의 힘입니다[b].


    나는 …인 이입니다[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ϣⲟⲩϣⲟⲩ는 ‘약함, 쇠약, 허약함’을 뜻할 수 있습니다. 첫 동사는 복수에게 하는 명령으로, ‘조심하십시오’ 또는 ‘경계하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 두려움 속에’는 총칭적 표현으로, ‘모든 두려움 안에’ 또는 ‘온갖 두려움 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 단락은 여성형 관계절이 시작된 뒤 끊어집니다. 이어지는 말은 이 발췌문의 다음 부분에 있습니다.
    reason: source_note
