translation:
  language: ko
  text: 나는 두려워하는 자들 안에서 발견되는 이며, 떨림 속의 힘입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 POB의 ‘those who are afraid’는 Coptic의 관계절 형태를 따른 해석입니다.
    reason: source_note
  - marker: b
    text: ‘발견되는’은 원문 동사의 격언적 현재성을 살린 번역이며, 직역하면 ‘발견될’의 미래 뉘앙스도 가능합니다.
    reason: alternative_reading
