    text: The Coptic morphology (ⲛⲉⲧⲛ- + verb) points to ‘those who are …’ (persons), though some construe the phrase abstractly as ‘in all fears.’
    reason: lexical_alternative
  - marker: strength
    text: The noun for ‘strength’ (ⲟⲩϩⲟⲟⲩ) is expected here by parallelism and other witnesses but is not clearly visible in this OCR slice; reading supplied cautiously.
