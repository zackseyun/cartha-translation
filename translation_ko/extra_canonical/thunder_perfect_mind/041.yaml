    text: ‘She’ reflects the established feminine voice of Thunder across the tractate; Coptic ⲁⲛⲟⲕ itself is unmarked for gender.
    reason: cultural_note
  - marker: those who are afraid
    text: The Coptic morphology (ⲛⲉⲧⲛ- + verb) points to ‘those who are …’ (persons), though some construe the phrase abstractly as ‘in all fears.’
    reason: lexical_alternative
  - marker: strength
