theological_decisions:
- issue: 화자의 자기 선언을 어떻게 한국어로 유지할지
  chosen_reading: 첫 인칭 반복 구조를 보존하여 「나는 … 이며, …입니다」의 자기 증언 형태로 옮겼습니다.
  alternative_readings:
  - 저는 …입니다
  - 나는 …입니다
  rationale: 이 단락은 반복적 자기 동일시를 통해 역설을 강화하므로, ‘나는’과 보조적 연결어미 ‘-며’를 살려 원문의 수사 구조를 드러냈습니다.
  doctrine_reference: 문학적-수사적 보존 원칙
- issue: 영문 POB의 ‘she’가 가리키는 여성적 화자 표지를 한국어에서 드러낼지
  chosen_reading: 본문에는 성별 대명사를 추가하지 않고, 문맥상 여성적 화자라는 주해 없이도 성립하는 한국어로 유지했습니다.
  alternative_readings:
  - 나는 그 여자이다
  - 나는 그녀이다
  rationale: Coptic ⲁⲛⲟⲕ 자체는 성별 표시가 없고, 영어 POB의 ‘she’는 트랙테이트 전체의 확립된 화자 설정을 반영한 것이므로, 본문은 과도한 성별 명시를 피했습니다.
  doctrine_reference: source transparency / 문화적 주해 분리
