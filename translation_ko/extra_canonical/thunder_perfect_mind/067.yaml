  text: 'Do not care about [...]

    your parts that are cast out [...]

    [...]

    the one who [...]

    [...] establish [...]

    for I am among those

    who are small [...][a][b][c][d][e]'
  footnotes:
  - marker: a
    text: ⲙⲉⲗⲉⲧⲁ could be read as a verbal loan from Greek μελετάω (‘to practice, be concerned’) rather than a noun ‘limbs/members’. The parallel “you who know my …” favors ‘limbs/members’.
    reason: lexical_alternative
  - marker: b
    text: ⲧⲱⲃ︤ⲡ︥ is likely ⲧⲱⲃⲥ ‘establish’; some editors take it as ‘make good’ or ‘set upright’.
    reason: lexical_alternative
  - marker: c
    text: ⲥⲉⲥⲱ may be read ‘they are first’ (if tied to a ‘first’ lexeme elsewhere in the line) or ‘they will be raised/exalted’; translation reflects the latter but the reading is uncertain.
    reason: alternative_reading
  - marker: d
    text: The consult tradition includes ‘first creatures’ here; the present OCR segment does not securely show a ‘creatures/created’ lexeme, so that phrase is not adopted in the main line.
    reason: textual_variant
  - marker: e
    text: Or 'And draw near to me, you who know me,\nyou who know my limbs;\nand establish the great ones among the small—\nfor I am among those who are among the small, and they will be lifted up.'.
    reason: previous_rendering
translation:
  language: ko
  text: '[…]

    당신의 부분들을 버려진 것으로 여기지 마십시오 […][a]

    […]

    […]

    그리고 큰 것들을 작은 것들 가운데 세우십시오[b]

    — 나는 작은 것들 가운데 있습니다 […]

    그리고 그것들은 들어올려질 것입니다[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲙⲡⲣ-는 부정 명령이며, ⲙⲉⲗⲉⲧⲁ는 여기서 ‘지체/부분’이 아니라 ‘염려하다, 관여하다’로 읽는 것이 문맥에 더 잘 맞습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲧⲱⲃ︤ⲡ︥는 ‘세우다/확립하다’로도, 더 강하게는 ‘바로 세우다’로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲥⲉⲥⲱ는 ‘들어올려질 것이다’ 외에 ‘첫째이다’ 또는 ‘구원받을 것이다’로도 읽힐 수 있는 불확실한 형태입니다.
    reason: alternative_reading
  - marker: d
    text: 제공된 OCR 단편에는 consult 전통의 ‘first creatures’에 해당하는 어휘가 안정적으로 보이지 않으므로, 그 표현은 본문에 넣지 않았습니다.
    reason: textual_variant
