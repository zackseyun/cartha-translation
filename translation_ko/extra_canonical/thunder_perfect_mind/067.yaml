theological_decisions:
- issue: 단편 본문을 어떻게 처리할지
  chosen_reading: 의미가 확인되는 구절만 본문에 옮기고, 판독이 불안정한 부분은 생략표시로 남겼습니다.
  alternative_readings:
  - 추정 복원으로 연속 문장을 구성하는 방식
  - consult tradition을 따라 ‘draw near…’로 재구성하는 방식
  rationale: 제공된 Coptic OCR이 매우 단편적이고, POB 수정 이력도 잘못된 consult text를 교정하고 있으므로, 확인 가능한 어휘만 보수적으로 옮기는 것이 원문 충실성에 맞습니다.
  doctrine_reference: '본문비평/번역윤리: 확인 가능한 원문 우선, 추정 복원 절제'
- issue: ‘작은 것들’과 ‘들어올려질 것’의 역설적 진술
  chosen_reading: 낮은 것들이 세워지고 들어올려지는 역설을 그대로 유지했습니다.
  alternative_readings:
  - 도덕적 교훈으로 완화하는 번역
  - 상징성을 약화한 평이한 번역
  rationale: 이 단편의 핵심은 가치 전도적 역설이므로, 그 긴장을 완화하지 않고 한국어에서도 선명하게 보존했습니다.
  doctrine_reference: 문학적-신학적 수사 보존
