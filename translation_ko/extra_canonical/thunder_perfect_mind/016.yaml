    text: POB의 감수된 읽기는 ‘남편의 누이’이며, OCR 계열의 ‘주인의 여주인’ 가능성도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘offspring’는 ‘child’나 ‘son’으로도 옮길 수 있으나, 여기서는 족보적 뉘앙스를 살려 ‘자손’으로 옮겼습니다.
    reason: lexical_alternative
