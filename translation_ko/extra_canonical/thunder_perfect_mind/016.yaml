    text: The OCR sequence ‘ⲧϫⲟⲉⲓⲥ ⲙⲡⲁϫⲡⲟ’ could be read ‘mistress of my lord’; the received Thunder line is ‘sister of my husband’ (ⲧⲥⲱⲛⲧ ⲙⲡⲁⲣⲱⲙⲉ).
    reason: lexical_alternative
  - marker: c
    text: ‘Offspring’ can also be rendered ‘child’ or ‘son’; the underlying Coptic commonly uses ⲣⲏⲣⲉ for ‘child/son’.
    reason: lexical_alternative
  - marker: d
