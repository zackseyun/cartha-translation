base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/024.yaml
  text: 'Know me, let them know me.

    For I am knowledge and ignorance.

    I am shame and boldness.

    I am shameless; I am ashamed.

    I am strength, and'
  footnotes:
  - marker: a
    text: Parrhesia (ⲡⲁⲣⲣⲏⲥⲓⲁ) can mean frank speech, outspokenness, or confident boldness in public.
    reason: lexical_alternative
  - marker: b
    text: ϫⲓⲡⲏⲧ is a distinct term from ϣⲓⲡⲉ; it often denotes modesty or bashfulness rather than disgrace.
    reason: lexical_alternative
  - marker: c
    text: The initial line could be read as “Wise ones, be wise,” depending on how the jussive ⲙⲁⲣⲟⲩ is construed with ⲥⲟⲩⲱⲛⲧ.
    reason: alignment_note
  - marker: d
    text: Or 'Let the wise be wise.'.
    reason: previous_rendering
  - marker: e
    text: Or 'I am fear too.'.
    reason: previous_rendering
  - marker: f
    text: Or 'I am without shame; I am bashfulness.'.
    reason: previous_rendering
translation:
  language: ko
  text: '지혜로운 이들이 지혜로워지게 하십시오.[c]


    내가 곧 지식과 무지입니다.


    나는 수치와 대담함[a]입니다.


    나는 부끄러움이 없는 자이며, 나는 부끄러워하는 자[b]입니다.


    나는 힘이며, 그리고[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲁⲣⲣⲏⲥⲓⲁ는 공적인 자리에서의 담대함, 거리낌 없는 발언, 솔직함을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ϫⲓⲡⲏⲧ는 ϣⲓⲡⲉ(수치)와 다른 말로, 수치보다는 수줍음·겸손·부끄러워함의 뜻에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 첫 행은 ⲙⲁⲣⲟⲩ의 3인칭 권유법에 따라 ‘지혜로운 자들은 지혜로워지게 하십시오’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 마지막 ‘그리고’(ⲁⲩⲱ)는 다음 구로 이어지는 연결 표지입니다.
    reason: source_note
