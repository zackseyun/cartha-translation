base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/024.yaml
  text: 'Know me, let them know me.

    For I am knowledge and ignorance.

    I am shame and boldness.

    I am shameless; I am ashamed.

    I am strength, and'
  footnotes:
  - marker: a
    text: Parrhesia (ⲡⲁⲣⲣⲏⲥⲓⲁ) can mean frank speech, outspokenness, or confident boldness in public.
    reason: lexical_alternative
  - marker: b
    text: ϫⲓⲡⲏⲧ is a distinct term from ϣⲓⲡⲉ; it often denotes modesty or bashfulness rather than disgrace.
    reason: lexical_alternative
  - marker: c
    text: The initial line could be read as “Wise ones, be wise,” depending on how the jussive ⲙⲁⲣⲟⲩ is construed with ⲥⲟⲩⲱⲛⲧ.
    reason: alignment_note
  - marker: d
    text: Or 'Let the wise be wise.'.
    reason: previous_rendering
  - marker: e
    text: Or 'I am fear too.'.
    reason: previous_rendering
  - marker: f
    text: Or 'I am without shame; I am bashfulness.'.
    reason: previous_rendering
translation:
  language: ko
  text: '지혜로운 자들이여, 지혜로우십시오.


    내가 곧 지식과 무지입니다.

    나는 수치와 대담함입니다.

    나는 부끄러움이 없는 자이며, 나는 부끄러워하는 자입니다.

    나는 힘이며,[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲁⲣⲣⲏⲥⲓⲁ는 공적 담대함, 거리낌 없는 발언, 솔직함까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ϫⲓⲡⲏⲧ는 ϣⲓⲡⲉ와 다른 말로, 수치라기보다 수줍음·겸손·부끄러워함에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 첫 행은 ‘지혜로운 자들이여, 지혜로우십시오’처럼 이해할 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 마지막 ‘그리고’는 다음 구로 이어지는 연결 표지입니다.
    reason: source_note
lexical_decisions:
- source_word: ⲥⲟⲩⲱⲛⲧ ⲙⲁⲣⲟⲩ ⲥⲟⲩⲱⲛⲧ
  english_pob_choice: Let the wise be wise
  chosen_korean: 지혜로운 자들이여, 지혜로우십시오
  alternatives_korean:
  - 지혜로운 사람들은 지혜로우십시오
  - 지혜로운 자들아, 지혜롭게 되십시오
  lexicon: Crum, s.v. ⲥⲟⲩⲱⲛ / ⲙⲁⲣⲟⲩ
  rationale: jussive 형태와 ‘지혜로운 자들’이라는 호격적 울림을 함께 살리되, 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: ⲡⲥⲟⲟⲩⲛ
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 지혜
  lexicon: Crum, s.v. ⲥⲟⲟⲩⲛ
  rationale: ‘knowledge/ignorance’의 대칭을 살리기 위해 추상명사 ‘지식’을 택했습니다.
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  english_pob_choice: ignorance
  chosen_korean: 무지
  alternatives_korean:
  - 알지 못함
  - 무식
  lexicon: Crum, s.v. ⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  rationale: ‘지식’과 직접 대응하는 표준적 추상어로, 수사적 역설을 선명하게 유지합니다.
- source_word: ⲡⲁⲣⲣⲏⲥⲓⲁ
  english_pob_choice: boldness
  chosen_korean: 대담함
  alternatives_korean:
  - 담대함
  - 솔직함
  - 당당한 발언
  lexicon: Loan from Gk. παρρησία; Crum s.v. ⲡⲁⲣⲣⲏⲥⲓⲁ
  rationale: 공적이고 거리낌 없는 발화의 뉘앙스를 살리면서도, 앞의 ‘수치’와 대비되는 성격 특성을 자연스럽게 드러냅니다.
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ / ϫⲓⲡⲏⲧ
  english_pob_choice: I am shameless; I am ashamed.
  chosen_korean: 나는 부끄러움이 없는 자이며, 나는 부끄러워하는 자입니다.
  alternatives_korean:
  - 나는 부끄러움이 없으며, 나는 수줍어하는 자입니다
  - 나는 뻔뻔한 자이며, 나는 수줍은 자입니다
  lexicon: Crum, s.v. ϣⲓⲡⲉ; ϫⲓⲡⲏⲧ
  rationale: 두 표현의 대칭을 살리기 위해 둘 다 명사화된 인격적 진술로 옮겼고, ϫⲓⲡⲏⲧ의 ‘bashfulness/modesty’ 범위를 한국어의 ‘부끄러워하는 자’로 반영했습니다.
- source_word: ⲛⲁϣⲧⲉ
  english_pob_choice: strength
  chosen_korean: 힘
  alternatives_korean:
  - 강함
  - 견고함
  - 강인함
  lexicon: Crum, s.v. ⲛⲁϣⲧⲉ
  rationale: 주어진 교정에 따라 ‘fear’가 아니라 ‘strength/firmness’로 이해해야 하며, 한국어에서는 간결한 ‘힘’이 가장 직관적으로 대응합니다.
theological_decisions:
- issue: 절의 종결부가 다음 행으로 이어지는 미완 문장인지 여부
  chosen_reading: 현재 행은 ‘나는 힘이며,’로 끝나며, 뒤 문맥으로 이어지는 연결 형태를 보존했습니다.
  alternative_readings:
  - 나는 힘입니다.
  - 나는 힘이며, 두려움입니다.
  rationale: Coptic final ⲁⲩⲱ는 ‘그리고’로서 다음 구절로 이어지는 신호이므로, 종결형으로 닫지 않고 연속성을 살렸습니다.
