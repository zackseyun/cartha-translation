  lexicon: Crum
  rationale: 남성/여성의 대칭을 살리면서도 현대 한국어에서 자연스러운 표현이어서 ‘여자들’로 옮겼습니다.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  english_pob_choice: I am
  chosen_korean: 나는 …입니다
  alternatives_korean:
