  rationale: 공적·의례적 존귀함을 지시하는 형용적 표현이므로, ‘존귀한 이’로 옮겨 신격화하거나 교리화하지 않고도 원문의 평가적 뉘앙스를 살렸습니다.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  english_pob_choice: the one who is praised
  chosen_korean: 찬양받는 이
