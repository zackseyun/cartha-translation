translation:
  language: ko
  text: 그리고 나와 함께 있는 모든 남자의 영 안에, 또 내 안에 있는 여자들 안에, 나는 존귀한 이이며 찬양받는 이입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲙ̄ⲡⲛⲁ는 여기서 ‘바람’보다 내적 생명 또는 영의 영역을 가리키는 말로 읽었습니다.
    reason: source_note
  - marker: b
    text: ⲧⲁⲉⲓⲏⲟⲩ는 ‘형상’이 아니라 ‘존귀한 이’로 읽는 것이 원문의 문법과 어휘에 맞습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ는 ‘이름’이 아니라 ‘찬양받는 이’로 읽었습니다.
    reason: lexical_alternative
