  - ‘내 형상과 너희 이름’으로 읽는 해석
  - ‘존귀한 분’이라는 강한 신적 칭호로 고정하는 해석
  rationale: 원문과 POB audit는 패러독스적 자기 진술을 강조하므로, 한국어도 두 술어를 모두 보존해 긴장을 유지했습니다.
