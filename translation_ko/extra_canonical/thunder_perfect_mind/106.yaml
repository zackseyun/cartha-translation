base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/106.yaml
  text: 'And learn from my souls.

    Those who know me — I am

    the hearing that is accessible to all [b];

    I am the speech that no one can grasp [c].[d]'
  footnotes:
  - marker: a
    text: Possessive is not explicit in the Coptic; "your" is inferred from the 2nd-person plural verbal prefix. The object could also be "the soul(s)" in a general sense.
    reason: alignment_note
  - marker: b
    text: ϣⲏⲡ may also mean "common" or "fitting"; "accessible" is chosen to capture availability/reach.
    reason: lexical_alternative
  - marker: c
    text: '"Grasp" could also be rendered "seize" or "comprehend," preserving both physical and cognitive senses.'
    reason: lexical_alternative
  - marker: d
    text: The Coptic ends this block with a bare "I am" (ⲁⲛⲟⲕ ⲡⲉ), likely the start of the next self-identification; content not supplied here.
    reason: alignment_note
  - marker: a
    text: Or 'And you, judge your soul [a].'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 내 영혼들로부터 배우십시오.

    나를 아는 이들은 — 나는

    모든 것에 열려 있는 그 들음입니다[b];

    나는 아무도 붙잡을 수 없는 그 말입니다[c][d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ϣⲏⲡ은 ‘accessible’ 외에 ‘common’ 또는 ‘fitting’의 뜻도 가질 수 있으나, 여기서는 ‘모든 것에’와 결합한 맥락상 ‘열려 있는/접근 가능한’이 가장 적절합니다.
    reason: lexical_alternative
  - marker: c
    text: ⲙⲙⲟϥ는 ‘붙잡다’ 외에 ‘잡아채다/이해하다’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: Coptic 본문은 여기서 bare ‘I am’(ⲁⲛⲟⲕ ⲡⲉ)로 끝나며, 이어지는 자기 동일시는 다음 구절로 넘어갑니다.
    reason: source_note
