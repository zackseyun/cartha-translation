theological_decisions:
- issue: 마지막 행의 결손 처리
  chosen_reading: ‘내—의 처녀입니다’처럼 결손을 드러내어, 보존되지 않은 목적어를 추정하지 않았습니다.
  alternative_readings:
  - ‘내 아버지의 처녀입니다’로 보완
  - ‘내 것의 처녀입니다’로 추정
  rationale: 필사본의 행이 ⲙⲡⲁ에서 끊기므로, 원문이 주는 단절과 불확실성을 보존하는 것이 필요합니다.
  doctrine_reference: 본문비평 및 결손 표기 원칙
- issue: 첫 행의 역설적 병렬
  chosen_reading: ‘산파이자 어머니’로 옮겨, 영어 전통의 ‘midwife and she who bears not’ 대신 콥트어의 ‘어머니’를 유지했습니다.
  alternative_readings:
  - ‘산파이자 아이를 낳지 않는 이’
  - ‘산파이자 출산하지 않는 자’
  rationale: 주어진 콥트어가 실제로 ‘어머니’를 읽고 있으므로, 전승된 영어식 완화보다 원문 어휘가 만드는 역설을 우선했습니다.
  doctrine_reference: 원어 우선 번역 원칙
