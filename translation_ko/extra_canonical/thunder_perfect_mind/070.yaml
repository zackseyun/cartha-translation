  yaml_path: translation/extra_canonical/thunder_perfect_mind/070.yaml
  text: the finding of those who seek me[a], and the command of those who ask me, and the voice of the voices of the place of God, of the angels[d][c][b], which they utter
  footnotes:
  - marker: a
    text: Some witnesses and translations of Thunder render the positive verb here as “honor” or “praise,” while others read a verb meaning “seek/ask for.”
    reason: lexical_alternative
  - marker: b
    text: The OCR lines show material about “the name of the names … the place of God … the angels have called,” suggesting this block may be misaligned; the present question is supplied from the poem’s recurring antithetical pattern for this segment.
    reason: alignment_note
  - marker: c
    text: The negative verb ϣⲓⲛⲉ can be taken as “curse,” “revile,” or “hate.” “Revile” is chosen to keep the verbal, public-facing edge of the paradox.
    reason: lexical_alternative
  - marker: d
    text: Or 'Why do you revile me and revere me?'.
    reason: previous_rendering
translation:
  language: ko
  text: 나를 찾는 이들의 발견이며, 나를 묻는 이들의 명령이며, 하나님의 장소, 곧 천사들의 목소리들의 목소리이며, 그들이 내놓는 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic의 ⲥⲱⲉⲓ 계열은 ‘찾다/뒤따르다’의 뜻을 지니며, 영어 POB의 ‘seek me’와 대응합니다.
    reason: source_note
  - marker: b
    text: ⲡⲙⲁ ⲛⲑⲉⲱ는 문자적으로 ‘하나님의 장소’입니다.
    reason: source_note
  - marker: c
    text: 이 단락은 반복 병렬을 통해 초월적 울림을 강조합니다.
    reason: korean_style_note
