  source_fidelity: 첫 두 병렬구는 대체로 원문을 따르지만, ⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ는 ‘나를 묻다’가 아니라 ‘나에게 청하다/요청하다’입니다. 또한 마지막 관계절을 독립된 ‘그들이 내놓는 것입니다’로 처리하면 선행사와의 연결이 흐려집니다. 제공된 OCR 및 영어 감사 기록을 따라 천사들이 발하는 목소리에 연결하되, 명사 연쇄의 정확한 결속은 주석에서 유보하는 것이 안전합니다.
  naturalness: ‘나를 묻는 이들’은 현대 한국어에서 보통 ‘나에 관해 질문하는 이들’이라는 뜻이므로 부정확하고 어색합니다. ‘나에게 청하는 이들’이 요청의 대상을 자연스럽게 드러냅니다. 반복되는 명사구는 본문의 의도된 병렬을 살려 유지하되, 마지막 관계절은 ‘천사들이 발하는’으로 앞의 목소리에 결속했습니다.
  terminology: ⲥⲙⲏ/ⲛⲓⲥⲙⲏ의 반복은 ‘목소리들의 목소리’로 보존했습니다. ⲡⲙⲁ ⲛⲑⲉⲱ는 해석적으로 ‘성전’ 등으로 좁히지 않고 ‘하나님의 장소’로 유지했습니다. ‘하나님’은 ⲑⲉⲱ에 대한 중립적 표준어 대응입니다.
  issues:
  - severity: medium
    issue: ‘나를 묻는 이들의 명령’
    rationale: ⲁⲓⲧⲉⲓ는 ‘묻다’가 아니라 ‘청하다, 요청하다’이며, ⲙⲙⲟⲉⲓ는 요청의 상대를 나타냅니다.
  - severity: medium
    issue: 마지막 관계절의 독립 처리
    rationale: ‘그들이 내놓는 것입니다’는 무엇을 내놓는지 불분명합니다. 영어 감사 기록의 ‘which they utter’를 따라 목소리에 직접 연결하는 편이 더 충실합니다.
  - severity: low
    issue: ‘하나님의 장소, 곧 천사들의’라는 동격 표지
    rationale: 원문의 연속된 속격 명사구에는 ‘곧’에 해당하는 표지가 없습니다. 동격으로 단정하지 않아야 합니다.
  revised_text: 나를 찾는 이들의 발견이며, 나에게 청하는 이들의 명령이며, 하나님의 장소에 있는 천사들이 발하는 목소리들의 목소리입니다.[a][b]
  revised_footnotes:
