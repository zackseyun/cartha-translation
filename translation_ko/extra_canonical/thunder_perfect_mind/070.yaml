theological_decisions:
- issue: 이 구절은 전통적 예배어보다 반복적 병렬과 신비적 이미지가 핵심입니다.
  chosen_reading: 문학적 병렬을 그대로 유지하여 ‘발견 / 명령 / 목소리들의 목소리’의 누적 효과를 살렸습니다.
  alternative_readings:
  - 의미를 매끈하게 풀어 설명문처럼 번역함
  - 종교적 익숙한 표현으로 바꾸어 평탄화함
  rationale: 본문의 힘은 뜻풀이보다 병렬 자체에 있으므로, 해설적 확대를 줄이고 원문 배열을 보존하는 쪽이 source-grounded합니다.
  doctrine_reference: 문학적 보존과 해석 절제 원칙
- issue: 종결부 ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ의 주어·동사 관계가 불분명합니다.
  chosen_reading: ‘그들이 내놓는 것입니다’로 두어, 불확실한 동작을 중립적으로 처리했습니다.
  alternative_readings:
  - 그들이 선포하는 것입니다
  - 그들이 말해 내는 것입니다
  rationale: OCR 기반의 비정합 가능성이 있으므로, 과도한 확정 대신 가장 넓은 범주의 ‘내놓다/발화하다’ 의미를 택했습니다.
