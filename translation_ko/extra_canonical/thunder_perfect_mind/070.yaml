    text: 콥트어 ⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ는 ‘나에게 청하다/요청하다’라는 뜻입니다. 따라서 ‘나를 묻다’처럼 나에 관하여 질문한다는 뜻으로 옮기지 않았습니다.
    reason: source_note
  - marker: b
    text: ‘하나님의 장소’, ‘천사들’, ‘목소리들’이 이어지는 속격 구조와 마지막 관계절은 제공된 OCR만으로 정확한 결속을 확정하기 어렵습니다. 번역은 영어 감사 기록의 ‘천사들이 발하는’이라는 이해를 따르되, 장소를 특정한 성소나 교리적 개념으로 한정하지 않았습니다.
