  text: '[...] 그리고 자신을 자랑하는 자가 이것들을 내게 가져옵니다. 나는 이해할 수 없는 침묵이며, 그 기억이 위대한 생각입니다. 나는 그 소리가 다양한 목소리이며, 다양한 말입니다.'
  philosophy: optimal-equivalence
