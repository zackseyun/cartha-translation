    rationale: ‘여러 겹’은 층위·겹침이라는 추가 의미를 넣습니다. ⲛⲁϣⲉ의 ‘많은/다양한’ 의미에는 ‘다양한 말’이 더 직접적입니다. ‘말씀’도 문맥상 특정 종교적 어감을 부가할 수 있습니다.
