    rationale: ⲧⲉⲡⲓⲛⲟⲓⲁ ⲉⲧⲉⲛⲁϣⲉ ⲡⲉⲥⲣⲡⲙⲉⲉⲩⲉ는 ‘그 기억이 큰/위대한 생각’이라는 관계 구조입니다. 현재 표현은 한국어 어법상 어색하고 의미 관계도 불명확합니다.
  - severity: medium
