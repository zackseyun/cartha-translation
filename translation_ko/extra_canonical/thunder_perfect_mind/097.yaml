  text: 저에게서 온유함 가운데서 들으십시오[a], 그리고 저에게서 거침 가운데서 배우십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲭⲣⲟⲉⲓ는 ‘gentleness’, ‘mildness’, ‘meekness’ 범위를 가지므로, 여기서는 현대 한국어에서 덕목 의미를 유지하는 ‘온유함’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: Coptic ⲧⲉⲣⲟⲟⲩ는 ‘roughness’, ‘hardness’, ‘severity’까지 포괄할 수 있으나, 본 구절의 대구를 살리기 위해 ‘거침’을 택했습니다.
    reason: lexical_alternative
