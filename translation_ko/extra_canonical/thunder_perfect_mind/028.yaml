    issue: ‘잘’이 원문에 없는 강조를 더합니다.
    rationale: ⲛⲁⲩ ⲉⲃⲟⲗ 계열의 시선 촉구에는 주의 깊게 살피라는 별도 강조가 확인되지 않습니다.
  - severity: medium
    issue: ‘그 분뇨 더미’가 이중적인 오물 표현을 압축합니다.
    rationale: ⲕⲟⲩⲡⲣⲓⲁ와 ⲕⲱⲕ가 함께 쓰여 혐오스러운 이미지를 겹칩니다. 압축 번역은 가능하지만, 최적 등가 번역에서는 이 중첩을 본문 또는 주석에서 더 분명히 보여 주는 것이 안전합니다.
