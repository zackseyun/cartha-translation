  source_fidelity: 첫 명령은 OCR 결합 형태를 감안하여 ‘땅을 바라보십시오’로 옮기는 것이 적절합니다. ⲉⲧⲛⲏⲟⲩ는 현 제시된 철자상 ‘오는 이들’로 읽는 편이 우선적입니다. 마지막 명령에는 목적어 ‘나를’이 없으므로 이를 보충하지 않은 현 번역의 방향은 맞습니다. 다만 ⲕⲟⲩⲡⲣⲓⲁ와 ⲕⲱⲕ의 중첩은 번역문에서도 더 드러내는 편이 좋습니다.
  naturalness: ‘땅을 잘 살펴보십시오’의 ‘잘’은 원문에 없는 강조를 더하고, ‘것이며’는 두 명령문의 병렬을 다소 흐립니다. ‘땅을 바라보십시오. 그러면 … 찾게 될 것입니다. 그리고 … 보지 마십시오’가 현대 표준어 합쇼체로 더 자연스럽고 수사적 대조도 보존합니다.
  terminology: ‘오는 자들’은 뜻은 정확하나 ‘오는 이들’이 조금 더 자연스럽습니다. ‘분뇨 더미’만으로는 원문의 ‘분뇨 더미의 오물/분뇨’라는 의도적인 중첩이 희미해집니다. ‘오물로 된 그 분뇨 더미’는 불쾌하고 중첩된 이미지를 한국어에서 무리 없이 유지합니다.
  issues:
