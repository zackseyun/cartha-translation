base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/028.yaml
  text: Look out upon the earth, and you will find me among those who see; and do not look upon the dung-heap of dung.
  footnotes:
  - marker: a
    text: ⲉⲧⲛⲏⲟⲩ literally "who see" (relative + verb of seeing). It could also be taken as "the visible ones" or even "the seers" depending on context.
    reason: lexical_alternative
  - marker: b
    text: ⲕⲟⲡρία (Greek loan) + Coptic ⲕⲱⲕ both denote manure/dung; the double expression heightens the image of abjection, hence "dung-heap of dung."
    reason: cultural_note
  - marker: c
    text: Consult text gives "I am without shame; I am ashamed" for this block, but the Coptic here speaks of going out upon the earth and a dung-heap prohibition; the mismatch likely reflects a heuristic line mapping.
    reason: alignment_note
  - marker: d
    text: Or 'I will go out upon the earth; you will find me among those who see; neither look upon me on the dung-heap of dung.'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅을 잘 살펴보십시오. 그러면 오는 자들 가운데서 나를 찾게 될 것이며, 그 분뇨 더미를 보지 마십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오는 자들’은 원문 형태를 따른 직역이며, 영어 POB의 과거 ‘those who see’는 수정 전 임시 해석이었습니다.
    reason: source_note
  - marker: b
    text: ‘분뇨 더미’는 그리스어 차용어와 콥트어 어근이 중첩된 저열한 이미지를 살리기 위한 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ⲛⲁⲉⲃⲟⲗ
  english_pob_choice: Look out
  chosen_korean: 잘 살펴보십시오
  alternatives_korean:
  - 살펴보십시오
  - 내다보십시오
  lexicon: Crum; Layton
  rationale: OCR상 형태는 불안정하지만, 영어 POB의 ‘Look out’와 대응하는 감각은 시선 동작을 나타내는 명령문으로 읽는 것이 가장 자연스럽습니다. 한국어에서는 ‘잘 살펴보십시오’로 시선의 방향성과 주의 촉구를 함께 살렸습니다.
- source_word: ϩⲓ ⲡⲕⲁϩ
  english_pob_choice: upon the earth
  chosen_korean: 땅을
  alternatives_korean:
  - 땅 위를
  - 지면을
  lexicon: Crum; Layton
  rationale: ⲕⲁϩ는 earth/ground의 폭넓은 뜻이 있으므로, 현대 한국어에서는 가장 직접적인 ‘땅’을 택해 장면의 물리적 표면을 살렸습니다.
- source_word: ⲉⲧⲛⲏⲟⲩ
  english_pob_choice: those who are coming
  chosen_korean: 오는 자들
  alternatives_korean:
  - 오고 있는 자들
  - 다가오는 자들
  lexicon: Crum; Layton
  rationale: 이 형태는 ‘보는 자들’이 아니라 ‘오는/오고 있는 자들’로 읽어야 하므로, 현재 진행성을 담은 ‘오는 자들’이 가장 간결하고 원문 친화적입니다.
- source_word: ⲙⲡⲣⲛⲁⲩ
  english_pob_choice: do not look upon
  chosen_korean: 보지 마십시오
  alternatives_korean:
  - 쳐다보지 마십시오
  - 살펴보지 마십시오
  lexicon: Crum; Layton
  rationale: 부정 명령은 단순한 ‘보다’보다 시선을 두지 말라는 금지를 전달하므로, 합쇼체에서 자연스러운 ‘보지 마십시오’로 옮겼습니다.
- source_word: ⲉⲡⲓⲧⲕⲟⲩⲡⲣⲓⲁ ⲛⲧⲉ ⲡⲓⲕⲱⲕ
  english_pob_choice: the dung-heap of dung
  chosen_korean: 그 분뇨 더미
  alternatives_korean:
  - 그 거름 더미
  - 그 똥더미
  lexicon: Crum; Liddell–Scott (Greek κοπρία)
  rationale: 그리스어 차용어와 콥트어 어근이 함께 더럽고 천한 이미지를 중첩하므로, 한국어에서는 반복을 그대로 옮기기보다 의미를 압축해 ‘분뇨 더미’로 표현했습니다. ‘그’는 원문의 정관성을 반영합니다.
theological_decisions:
- issue: 명령문과 금지문의 대조
  chosen_reading: 앞부분은 상대를 향한 시각적 촉구의 명령문으로, 뒷부분은 동일한 시각 어휘를 반복한 금지문으로 읽었습니다.
  alternative_readings:
  - ‘나는 땅 위로 나가겠다’는 1인칭 미래 읽기
  - ‘너희가 나를 보게 될 것이다’라는 서술문 읽기
  rationale: 원문 형태와 수정 이력은 첫 절을 ‘look out’ 계열의 명령으로, 마지막 절을 ‘do not look’ 금지로 읽는 것이 가장 일관됨을 보입니다. 따라서 한국어도 시선 어휘의 반복을 유지해 대조를 드러냈습니다.
  doctrine_reference: 본문 해석상 초점은 교리보다 수사적 대조에 있습니다.
