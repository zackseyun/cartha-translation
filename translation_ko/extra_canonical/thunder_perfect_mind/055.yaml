  - 존재 안에서
  - 그 앞에서
  lexicon: Layton, Coptic Grammar (idiomatic prepositional phrase)
  rationale: 원문의 관용적 ‘before/in whose presence’를 한국어에서 가장 자연스럽게 옮기면서도, 앞선 ‘얼굴’ 이미지와 연결되도록 했습니다.
- source_word: ⲙⲛⲧⲁⲧ…
