theological_decisions:
- issue: 화자 자기지시의 여성성 보존
  chosen_reading: ‘나는 … 그 이입니다’로 번역해 여성 화자를 암묵적으로 유지했습니다.
  alternative_readings:
  - 나는 그 이입니다
  - 나는 그분입니다
  rationale: POB의 audit trail이 지적하듯 원문은 여성형 자기지시를 지니므로, 한국어에서 성중립으로 평준화하지 않고 화자의 여성성을 훼손하지 않는 방향을 택했습니다.
  doctrine_reference: 텍스트-비평/화자 표지 보존
- issue: ‘부끄러움 없이’의 도덕적 강도
  chosen_reading: ‘부끄러움 없이 행동했습니다’로 번역해 수치의 결여를 직접 표현했습니다.
  alternative_readings:
  - 뻔뻔하게 행동했습니다
  - 수치심 없이 행동했습니다
  rationale: 원문 대립은 단순한 태도 묘사가 아니라 관계적 수치의 결여를 드러내므로, 완곡한 표현보다 직접적인 부정 구조가 더 적절합니다.
  doctrine_reference: 수치/명예 담론
