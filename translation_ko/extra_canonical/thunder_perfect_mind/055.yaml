  language: ko
  text: 나는 여러분이 내 얼굴 앞에서 부끄러워했던 바로 그 이이며, 여러분은 나에게 부끄러움 없이 행동했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲁⲛⲟⲕ / feminine self-reference
  english_pob_choice: I am she
  chosen_korean: 나는 … 그 이입니다
  alternatives_korean:
  - 나는 그 사람입니다
  - 나는 그분입니다
  lexicon: Coptic grammar; English POB audit trail
  rationale: 원문과 POB가 반복되는 자기 선언을 유지하면서도, 한국어에서는 문법적 여성형을 자연스럽게 살리기 위해 직접적인 성별 대명사 대신 문맥적 재현으로 처리했습니다.
- source_word: ϩⲱⲱⲧ
