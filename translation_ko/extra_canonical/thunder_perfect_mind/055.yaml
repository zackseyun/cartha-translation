  rationale: ‘face’의 구체성을 살리되 한국어에서는 ‘얼굴 앞’이 가장 직접적이며, ‘존재’보다 원문의 이미지와 긴장을 더 잘 보존합니다.
- source_word: ⲙⲡ / ⲉ ⲧⲟⲟⲧϥ
