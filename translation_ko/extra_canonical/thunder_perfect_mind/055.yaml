  - 수치심 없이
  - 뻔뻔하게
  - 부끄럽지 않게
  lexicon: Crum, Coptic Dictionary (privative ⲁⲧ-; nominalizer ⲙⲛⲧ-)
  rationale: 대립쌍인 ‘부끄러워하다 / 부끄러움 없이’의 구조를 살리기 위해, 해석적 부사 ‘뻔뻔하게’보다 더 직접적인 부정 표현을 택했습니다.
- source_word: ⲁⲩⲉⲓ ⲁⲛⲧⲉⲧⲛ ⲃⲟⲗ
