  terminology: ‘순종’은 ⲟⲩⲁⲁⲧ의 선택된 독법을 반영합니다. 그러나 ‘단일한/고독한’이라는 대안이 있으므로 해당 주석은 ‘순종하는 이들이여’에 붙어야 합니다. 기존 초안은 영어 POB 감사 기록과 달리 두 주석의 표지와 내용을 서로 바꾸어 붙였습니다.
