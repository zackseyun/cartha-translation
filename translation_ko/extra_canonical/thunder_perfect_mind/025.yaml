base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/025.yaml
  text: 'The shame and the boldness[a].

    I am shameless; I am ashamed.

    I am hard, and I am trembling.

    I am the war and the peace; within me they are.

    I am she[g][f][e][d][c][b]; heed me.'
  footnotes:
  - marker: a
    text: ⲡⲁⲣⲣⲏⲥⲓⲁ can be glossed as ‘frank speech’ or ‘outspokenness.’ I chose ‘boldness’ for cadence while keeping the core sense.
    reason: lexical_alternative
  - marker: b
    text: The reading of ϫⲓⲡⲏⲧ is uncertain; ‘openness’ is tentative. An alternative could be ‘opening’ or another term paired with ‘silence.’
    reason: alignment_note
  - marker: c
    text: The imperative sense ‘heed me’ for ⲧⲣⲁⲉⲓⲏⲟⲩ is provisional, fitting Thunder’s recurring summons; confirmation against a reliable transcription is recommended.
    reason: alignment_note
  - marker: d
    text: Or 'The silence'.
    reason: previous_rendering
  - marker: e
    text: Or 'I am a silence'.
    reason: previous_rendering
  - marker: f
    text: Or 'I am an openness'.
    reason: previous_rendering
  - marker: g
    text: Or 'I am a stranger, and I am a human.'.
    reason: previous_rendering
translation:
  language: ko
  text: '수치와 담대함입니다[a].


    나는 수치가 없습니다; 나는 수치스럽습니다.

    나는 굳세며, 나는 떨고 있습니다.

    나는 전쟁이며 평화입니다 — 내 안에 그것들이 있습니다.

    나는 그녀입니다[g][f][e][d][c][b]. 나를 들으십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲡϣⲓⲡⲉ는 감사 기록상 ‘shameless’에 해당하며, 여기서 ‘수치’로 옮긴 것은 shame/shameless의 대비를 한국어에서 가장 자연스럽게 드러내기 위한 선택입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절의 ⲧⲣⲁⲉⲓⲏⲟⲩ는 감사 기록에서 명령형으로 이해되며, ‘나를 들으십시오’는 그 소환 뉘앙스를 살린 번역입니다.
    reason: source_note
  - marker: c
    text: 원문과 감사 기록은 이 자리에 ‘trembling’ 의미를 지시하므로, OCR 상의 불확실한 형태를 반영해도 최종 번역은 그 의미를 따랐습니다.
    reason: textual_variant
  - marker: d
    text: Coptic ⲣⲙⲧⲉ로 보이는 읽기는 감사 기록상 표준 정본의 ‘trembling’ 자리를 잘못 읽은 것으로 처리됩니다.
    reason: textual_variant
  - marker: e
    text: ‘I am a silence’가 아니라 ‘I am ashamed’ 계열의 읽기가 정본적입니다.
    reason: previous_rendering
  - marker: f
    text: ‘I am an openness’는 정본에 맞지 않는 이전 번역이며, 여기서는 그것을 따르지 않았습니다.
    reason: previous_rendering
  - marker: g
    text: 정본 전통의 일부에서는 이 자리에 ‘나는 낯선 사람이며, 나는 인간입니다’가 아니라 다른 역설적 자기지시가 옵니다.
    reason: previous_rendering
