theological_decisions:
- issue: 자기정체 진술의 대칭성과 긴장 유지
  chosen_reading: ‘나는 수치가 없습니다; 나는 수치스럽습니다’와 같은 역설을 그대로 살려, 단어를 완화하거나 해석적으로 풀지 않았습니다.
  alternative_readings:
  - ‘나는 부끄럽지 않습니다; 나는 부끄럽습니다’
  - ‘나는 수치가 없습니다; 나는 수치스럽습니다’보다 더 완곡한 표현
  rationale: 이 구절의 힘은 상호 모순처럼 보이는 진술의 병치에 있으므로, 독자가 역설 자체를 즉시 감지하도록 직역에 가깝게 유지했습니다.
  doctrine_reference: 문학적-신학적 역설 보존 원칙
- issue: 마지막 호명문의 존대 수준
  chosen_reading: ‘나를 들으십시오’로 현대 공식체 명령을 사용했습니다.
  alternative_readings:
  - ‘나를 들으시오’
  - ‘나를 들어라’
  rationale: 청자를 향한 소환 명령의 긴박함은 유지하되, 합쇼체 전체 문체와 일치시키기 위해 존대 명령형을 택했습니다.
  doctrine_reference: 문체 일관성과 직접 호소 보존
