translation:
  language: ko
  text: '수치와 담대함입니다[a].


    나는 수치가 없습니다. 나는 수치를 느낍니다.


    나는 단단합니다. 나는 떨고 있습니다.


    나는 전쟁이며 평화입니다. 그것들은 내 안에 있습니다.


    나는 그녀입니다. 내 말을 들으십시오[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲁⲣⲣⲏⲥⲓⲁ는 ‘담대함’ 외에 ‘솔직함’, ‘거리낌 없는 말’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 표현 ⲧⲣⲁⲉⲓⲏⲟⲩ의 판독과 정확한 문법 분석은 OCR 자료만으로 확정하기 어렵습니다. 여기서는 문맥상 화자에게 귀 기울이라는 명령으로 옮겼습니다.
    reason: textual_uncertainty
