translation:
  language: ko
  text: …그리고 내가 나올 때 나를 그대로 두십시오[a]. 그러면 여러분은 부유함 속에서 나를 발견할 것입니다. 그리고 내가 나올 때, 존귀한 이들 가운데 있는 나를 쳐다보지 마십시오[b]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲉⲧⲛⲕⲁⲁⲧ는 ‘나를 그대로 두십시오’로, ⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ은 ‘내가 나올 때’로 읽습니다.
    reason: source_note
  - marker: b
    text: 제시된 OCR 발췌의 ⲛⲉⲧⲧⲁ는 행갈이 뒤 이어지는 어형의 시작입니다. 여기서는 문맥과 이어지는 독법에 따라 ‘존귀한 이들’로 옮겼습니다.
    reason: textual_note
lexical_decisions:
- source_word: ⲉⲧⲛⲕⲁⲁⲧ
  english_pob_choice: leave me
  chosen_korean: 나를 놓아두십시오
  alternatives_korean:
  - 나를 떠나십시오
  - 나를 버려두십시오
  lexicon: Crum Coptic Dictionary
  rationale: 동사 ⲕⲁⲁⲧ는 ‘나를 놓아두다/버려두다’의 의미로 읽는 것이 맞으며, 본문 흐름상 단순한 정서적 ‘떠남’보다 접촉을 끊고 두는 뉘앙스를 살렸습니다.
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  english_pob_choice: as I come forth
  chosen_korean: 내가 나오는 대로
  alternatives_korean:
  - 내가 나아오는 대로
  - 내가 밖으로 나오는 동안
  lexicon: Crum Coptic Dictionary
  rationale: 이 구는 1인칭 단수의 분사적/상황적 표현으로 읽어야 하므로, 주어를 ‘내가’로 분명히 하고 ‘나오는 대로’로 자연스럽게 옮겼습니다.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ
  english_pob_choice: you will seek
  chosen_korean: 여러분은 찾게 될 것입니다
  alternatives_korean:
  - 여러분은 구하게 될 것입니다
  - 여러분은 찾을 것입니다
  lexicon: Crum Coptic Dictionary
  rationale: Coptic ⲧⲉⲧⲛⲁϭⲓⲛⲉ는 ‘찾다/구하다’ 계열이므로, 여기서는 반복되는 추구의 감각을 살리기 위해 ‘찾게 될 것입니다’로 옮겼습니다.
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  english_pob_choice: riches
  chosen_korean: 부유함
  alternatives_korean:
  - 부요함
  - 풍요
  - 재물
  lexicon: Crum Coptic Dictionary
  rationale: 명사형 추상어로서 ‘wealth/riches’에 해당하므로, 물질적 재물보다 상태를 드러내는 ‘부유함’이 가장 직접적입니다.
- source_word: ⲛⲉⲧⲧⲁ
  english_pob_choice: those who are honored
  chosen_korean: 존귀한 이들
  alternatives_korean:
  - 명예로운 이들
  - 존중받는 이들
  - 높임을 받는 이들
  lexicon: Crum Coptic Dictionary
  rationale: 개정된 영어 본문과 Coptic 단서를 따라 이 구는 ‘낮은 자들’이 아니라 ‘존귀한 이들’로 읽어야 하므로, 지위를 드러내는 표준어 ‘존귀한 이들’로 옮겼습니다.
theological_decisions:
- issue: 대상 호칭과 공손체 처리
  chosen_reading: 직접 청자인 ‘여러분’을 유지하되, 명령형은 공손한 청유/금지 형식으로 옮겼습니다.
  alternative_readings:
  - 무표지 2인칭 복수로 옮김
  - 더 직설적인 명령형으로 옮김
  rationale: 작품의 자기선언적·대화적 수사를 한국어 합쇼체 안에서 최대한 보존하기 위해, 직접적 대상을 분명히 하면서도 문체는 현대적 공손체로 유지했습니다.
  doctrine_reference: 문체/화용 결정
- issue: ‘부유함’과 ‘존귀한 이들’의 병치
  chosen_reading: ‘riches’와 ‘those who are honored’를 각각 상태와 사람으로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 추상명사로 평준화
  - 둘 다 ‘가난/낮음’ 계열로 역전
  rationale: 최신 교정본은 앞부분을 ‘부유함’, 뒷부분을 ‘존귀한 이들’로 읽게 하므로, 원문 대비를 훼손하지 않도록 서로 다른 범주의 어휘로 구분했습니다.
  doctrine_reference: 본문 비평/어휘 구분
