base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/021.yaml
  text: 'Those who deny me confess me[a],

    and those who confess me deny me.

    Those who speak truth about me lie about me[b],

    and those who lie about me speak truth about me.'
  footnotes:
  - marker: a
    text: The consult-orienting English for segment 16 reads “I am the voice whose sound is manifold…,” but the Coptic here is the deny/confess couplet. This suggests a mapping slip in this region of the page; translation follows the Coptic as given.
    reason: alignment_note
  - marker: b
    text: Or 'Those who deny me confess me,\nand those who confess me deny me.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나를 부인하는 자들은 나를 시인하고,

    나를 시인하는 자들은 나를 부인합니다.

    나에 대해 진실을 말하는 자들은 나에 대해 거짓말하고,

    나에 대해 거짓말하는 자들은 나에 대해 진실을 말합니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 뒤의 영어 대조본은 16절의 앞부분을 “I am the voice whose sound is manifold…”로 적었지만, 제공된 콥트어 본문은 ‘부인/시인’ 대구를 담고 있습니다.
    reason: source_note
  - marker: b
    text: 이 절은 두 개의 역설적 대구로 이루어져 있으며, 영어 대조본의 보정판에서도 뒤의 대구가 추가됩니다.
    reason: previous_rendering
