translation:
  language: ko
  text: '나를 부인하는 자들은 나를 시인하고,


    나를 시인하는 자들은 나를 부인합니다.


    나에 대해 진실을 말하는 자들은 나에 대해 거짓말하고,


    나에 대해 거짓말하는 자들은 나에 대해 진실을 말합니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 대조본의 이 구간에는 “나는 그 소리가 여러 가지인 음성이다 …”라는 다른 본문이 배정되어 있으나, 제공된 콥트어 본문은 ‘부인/시인’과 ‘진실/거짓’의 두 대구를 담고 있습니다. 따라서 번역은 제공된 콥트어 본문을 따랐습니다.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲣⲛⲁ
  english_pob_choice: deny
  chosen_korean: 부인하다
  alternatives_korean:
  - 부정하다
  - 버리다
  lexicon: Crum; Layton, A Coptic Grammar
  rationale: 콥트어에서 그리스어 ἀρνέομαι 계열의 표준 대응으로, 여기서는 신앙 고백의 역설을 살리기 위해 ‘부인하다’가 가장 직접적입니다.
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  english_pob_choice: confess
  chosen_korean: 시인하다
  alternatives_korean:
  - 고백하다
  - 인정하다
  lexicon: Crum; Liddell-Scott; Layton, A Coptic Grammar
  rationale: ὁμολογεῖν 계열의 고백/인정 의미를 가지며, 한국어에서는 종교적 색채가 과도하게 굳지 않으면서도 상호 역설을 살리기 위해 ‘시인하다’를 택했습니다.
- source_word: ⲛⲉⲧ– (relative)
  english_pob_choice: those who
  chosen_korean: -하는 자들은
  alternatives_korean:
  - -하는 이들은
  - -하는 사람들은
  lexicon: Layton, A Coptic Grammar § relative clauses
  rationale: 서술적 상대절을 주어화하는 표현으로, 문장의 반복적 역설 구조를 자연스럽게 옮깁니다.
- source_word: ⲙ̄ⲙⲟⲉⲓ
  english_pob_choice: me
  chosen_korean: 나를
  alternatives_korean:
  - 나
  - 내게
  lexicon: Layton, pronominal object forms; Crum
  rationale: 1인칭 목적어 표지에 해당하므로 한국어에서도 직접목적격 ‘나를’이 가장 정확합니다.
theological_decisions:
- issue: 문장의 역설적 대구를 직역할지 완화할지
  chosen_reading: “부인하다/시인하다”와 “진실을 말하다/거짓말하다”의 상호 역전을 그대로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 ‘모순되게 말합니다’로 완화
  - 앞뒤 대구를 평탄하게 정리
  rationale: 원문은 의도적으로 자기-역전의 역설을 구성하므로, 해석적 평탄화보다 표면 대구를 보존하는 것이 독자가 원문 효과를 이해하는 데 더 적절합니다.
  doctrine_reference: source-rhetoric; paradox preservation
- issue: “ⲉⲣⲟⲓ”의 전치사 구문을 어떻게 한국어화할지
  chosen_reading: 두 번째 대구도 첫 번째와 같은 전치사 의미를 살려 ‘나에 대해’로 반복했습니다.
  alternative_readings:
  - ‘나에 관해’
  - ‘내게 대하여’
  rationale: 콥트어 전치사구의 반복을 유지해야 대조가 분명해지므로, 가장 중립적이고 문장 흐름이 좋은 ‘나에 대해’를 일관되게 사용했습니다.
  doctrine_reference: source syntax
