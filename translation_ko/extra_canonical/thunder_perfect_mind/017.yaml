base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/017.yaml
  text: I am the servant of the one who prepared me[a]. I am the ruler of my offspring[d][c][b]. But he is the one who begot me before the day of my birth.
  footnotes:
  - marker: a
    text: Head can also be read as a leadership title (“ruler”).
    reason: lexical_alternative
  - marker: b
    text: ‘Brought me forth’ renders ⲉⲓⲛⲉ idiomatically to preserve the birth paradox; a non‑generative ‘bring/cause to come’ is possible.
    reason: lexical_alternative
  - marker: c
    text: The temporal particle ⲉⲗⲗⲱ is read here as ‘before’; other values like ‘formerly’ are attested in dialectal usage.
    reason: alignment_note
  - marker: d
    text: Or 'I am the servant of the one who commands me. I am the head of my offspring—who brought me forth before the day of my birth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 나를 준비하신 분의 종입니다. 나는 내 자녀들의 통치자입니다.[a][b] 그러나 그분은 내가 태어난 날보다 먼저 나를 낳으신 분입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲧϫⲟⲉⲓⲥ는 ‘통치자’보다 넓게 ‘주인’ 또는 ‘주권자’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲙⲛⲧϣⲏⲣⲉ는 ‘자녀들’ 또는 ‘후손’으로도 옮길 수 있는 집합적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 출생의 날 전에’입니다. 본문은 자신을 낳은 이가 자신의 출생보다 앞선다는 역설을 유지합니다.
    reason: translation_note
