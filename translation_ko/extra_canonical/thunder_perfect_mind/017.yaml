theological_decisions:
- issue: 역설적 자기 진술에서 ‘나를 낳으신 분’의 표현 유지
  chosen_reading: 출생 이전에 ‘낳으신’ 분이라는 역설을 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘나를 내신 분’으로 완화
  - ‘나를 있게 하신 분’으로 일반화
  rationale: 이 단락은 존재론적 역설을 강조하므로, ‘있게 하신’처럼 추상화하면 텍스트의 충돌감과 수사적 강도가 약해집니다.
  doctrine_reference: 문학적/수사학적 역설 보존
