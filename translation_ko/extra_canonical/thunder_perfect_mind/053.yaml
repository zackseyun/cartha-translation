  yaml_path: translation/extra_canonical/thunder_perfect_mind/053.yaml
  text: 'I am she whom you have despised,

    and I am she upon whom you have deliberated.

    I am she whom you have seized,

    and I am she whom you have made alive.'
  footnotes:
  - marker: a
    text: 'ⲛ̄ⲧⲟⲟⲧ functions here as a topic marker addressing the second-person plural: ''as for you.'''
    reason: lexical_alternative
  - marker: b
    text: A fragmentary clause follows in the OCR ('ⲟⲩⲁⲛ ⲇⲉ ⲉⲧⲉⲧⲛϣⲁⲛϩⲱⲡ ⲙⲙⲱⲧⲛ'), likely continuing into the next line-block; it is not translated here to avoid forcing a reconstruction.
    reason: alignment_note
  - marker: c
    text: Some English traditions read 'persecuted' here, but the Coptic verb visible is the loanword for 'despise' (Gk καταφρονέω).
    reason: alternative_reading
  - marker: d
    text: Or 'As for you, I am she whom you have despised,'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 당신들이 멸시한 이입니다.

    그리고 나는 당신들이 숙고한 이입니다.

    나는 당신들이 붙잡은 이입니다.

    그리고 나는 당신들이 살려 낸 이입니다.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘네가’가 아니라 복수 2인칭 대상의 행위를 전제로 하는 문맥이지만, 이 절 자체에는 별도의 주어 표지가 없으므로 한국어는 자연스러운 직접 서술로 옮겼습니다.
    reason: source_note
  - marker: b
    text: ‘deliberated’는 단순한 사색보다 숙고·논의의 뉘앙스를 지닌 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  english_pob_choice: despised
  chosen_korean: 멸시한
  alternatives_korean:
