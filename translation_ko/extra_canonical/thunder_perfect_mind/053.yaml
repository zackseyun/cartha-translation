translation:
  language: ko
  text: '나는 여러분이 멸시한 이입니다.


    또 나는 여러분이 나를 생각한 이입니다.[a]


    나는 여러분이 붙잡은 이입니다.


    또 나는 여러분이 살린 이입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 생각한’은 문맥에 따라 ‘나를 기억한’으로도 옮길 수 있습니다. 여기서는 콥트어 ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ의 넓은 의미를 보존했습니다.
    reason: lexical_alternative
