  rationale: 원문상 앞 문장에 속하는 ⲛ̄ⲧⲟⲟⲧ를 현 단락의 ‘너희에 관하여’로 옮기지 않은 점은 유지했습니다. 둘째 행은 원문의 의미 범위를 보존하도록 ‘생각한’으로 조정하고, 필요한 어휘 대안은 해당 행에 정확히 연결했습니다. 복수 2인칭은 ‘여러분이’로 자연스럽게 명시했으며, 잘못된 주어·성별 설명과 오배치된 각주를 제거했습니다.
