  - 업신여긴
  lexicon: Crum, s.v. ⲕⲁⲧⲁⲫⲣⲟⲛⲉⲓ
  rationale: Coptic loanword from Greek καταφρονέω의 기본 의미는 ‘깔보다, 멸시하다’이므로, ‘멸시한’이 POB의 의미 선택을 가장 직접적으로 반영합니다.
- source_word: ⲙ̄ⲙⲟⲉⲓ
  english_pob_choice: upon whom you have deliberated
  chosen_korean: 숙고한
  alternatives_korean:
  - 생각한
  - 의논한
  - 숙의한
  lexicon: Crum, s.v. ⲙⲉⲉⲩⲉ
  rationale: 문맥상 단순한 ‘생각하다’보다 의도성과 대상성을 살려, 숙고의 행위로 옮기되 POB의 ‘deliberated’가 지닌 신중한 논의감을 유지했습니다.
- source_word: ϩⲱⲡ
  english_pob_choice: seized
  chosen_korean: 붙잡은
  alternatives_korean:
  - 잡은
  - 체포한
  - 붙들어 맨
  lexicon: Crum, s.v. ϩⲱⲡ
  rationale: ‘seize’의 직접 대응으로 ‘붙잡다’를 택해 폭력적 포획의 뉘앙스를 살리면서도 한국어 문맥에서 자연스럽게 읽히게 했습니다.
- source_word: ⲟⲩⲱⲛϩ
  english_pob_choice: made alive
  chosen_korean: 살려 낸
  alternatives_korean:
  - 생명 주신
  - 살린
  - 생명을 준
  lexicon: Crum, s.v. ⲟⲩⲱⲛϩ
  rationale: 수동적 상태 변화가 아니라 ‘그를/그녀를 살아나게 하다’라는 타동적 힘을 살리기 위해 ‘살려 내다’를 선택했습니다.
theological_decisions:
- issue: 문장 안의 여성 지칭 유지
  chosen_reading: 나는 … 이입니다 / 나는 … 한 이입니다로 여성 화자를 드러내는 ‘she’의 성별 표지를 유지했습니다.
  alternative_readings:
  - 나는 … 한 사람입니다
  - 나는 … 자입니다
  rationale: 영어 POB가 의도적으로 ‘I am she’를 유지한 것은 화자의 여성성 표지를 평준화하지 않기 위해서이므로, 이를 한국어에서도 중성화하지 않고 보존했습니다.
  doctrine_reference: 문학적/수사적 성별 표지 보존 원칙
