theological_decisions:
- issue: 화자의 자기계시를 어떻게 옮길 것인가
  chosen_reading: ‘나, 바로 나는 자비로운 이이기 때문입니다’로 옮겨, 반복과 자기강조를 살렸습니다.
  alternative_readings:
