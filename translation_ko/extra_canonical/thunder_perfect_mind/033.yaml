  - ‘참으로 나는 자비로운 이입니다’
  rationale: 원문은 1인칭 강조를 통해 자기 선언을 극적으로 드러내므로, 한국어에서도 ‘나, 바로 나는’의 반복으로 수사적 힘을 보존했습니다.
  doctrine_reference: 본문 내부 수사와 자기계시의 강조
