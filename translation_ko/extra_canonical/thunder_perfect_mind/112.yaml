  - ‘목소리’로 옮겨 화자의 인격성을 드러내는 읽기
  rationale: 이 구절은 동일 어근의 반복과 교차 구조가 핵심이므로, 너무 인격화된 표현보다 의미 범위를 넓게 담는 번역이 원문의 수사적 긴장을 더 잘 보존합니다.
