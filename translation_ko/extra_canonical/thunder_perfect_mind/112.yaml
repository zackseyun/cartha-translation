  - marker: b
    text: The OCR region shows neighboring vocatives (‘hearers,’ ‘angels’). Letters may be misread (ⲥ for ⲫ; omission of ⲣ), so ⲡⲓⲛⲁ is read as ⲡⲣⲁⲛ (‘the name’) and ⲧⲥⲙⲏ as ⲧⲫⲱⲛⲏ (‘the voice’).
    reason: alignment_note
translation:
  language: ko
  text: 나는 소리의 이름이며, 이름의 소리입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Coptic ⲫⲱⲛⲏ는 ‘소리’와 ‘음성/목소리’ 모두를 아우를 수 있습니다. 한국어 본문은 넓은 의미를 살려 ‘소리’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: OCR 구간상 주변 문자 때문에 ⲡⲓⲛⲁ는 ⲡⲣⲁⲛ(‘이름’)으로, ⲥⲙⲏ는 ⲫⲱⲛⲏ(‘소리’)로 읽는 해석이 제시됩니다.
    reason: textual_variant
