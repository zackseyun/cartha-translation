  text: I am the name of the voice and the voice of the name[a][b].
  footnotes:
  - marker: a
    text: Voice could also be rendered ‘sound.’ Both reflect Coptic ⲫⲱⲛⲏ; ‘voice’ keeps a personal nuance, ‘sound’ a broader acoustic sense.
