translation:
  language: ko
  text: '그리고 나는 야만인들 가운데서 형상이 없는 여인입니다.[a]


    나는 여러 곳에서 미움받은 이입니다.[b]


    그리고 나는 여러 곳에서 사랑받은 이입니다.[b]


    나는 그들이 “죽음”이라고 부르는 이입니다.


    그리고 나는 그들이 “법”이라고 부르는 이입니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야만인들’은 그리스어계 차용어 barbaros를 옮긴 것입니다. 고대 그리스인이 비그리스인을 구분하며 사용한 명칭으로, 현대의 가치판단을 뜻하는 말로 사용한 것은 아닙니다.
    reason: historical_lexical_context
  - marker: b
    text: ‘여러 곳에서’로 옮긴 표현(ϩⲛ ⲙⲁⲛⲓⲙ)은 ‘사람들 가운데서’ 또는 더 일반적으로 ‘곳곳에서’로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 동사의 ϣⲁ-는 습관적·일반적 행위를 나타내므로, 미래형 ‘부를 것이다’가 아니라 현재형 ‘부르는’으로 옮겼습니다.
    reason: grammatical_note
