    rationale: 한국어 번역의 각주는 한국어로 제시해야 하며, 어휘·문법 관련 주석은 해당 표현에 직접 연결되어야 합니다. 기존 a는 번역 본문에 필요한 주석이라기보다 편집 이력의 설명이므로 삭제합니다.
  - severity: low
    issue: ‘율법’의 의미 한정 가능성
    rationale: nomos는 이 발췌문만으로 모세 율법으로 특정되지 않습니다. ‘법’은 원문의 명칭을 더 넓게 보존합니다.
