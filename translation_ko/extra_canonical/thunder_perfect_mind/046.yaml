    rationale: ‘바르바로이’는 그리스어 복수형을 한국어에 그대로 옮긴 형태로 자연스럽지 않으며, ‘가운데서는’은 불필요한 대조 보조사를 더합니다. 고대 명칭의 가치 함의를 설명하는 주석과 함께 ‘야만인들 가운데서’로 옮기는 편이 현대 표준어와 원문의 문화적 긴장을 함께 살립니다.
  - severity: medium
