review_pass:
  verdict: revise
  source_fidelity: 첫 행은 최신 대조 판정에 따라 앞선 그리스인 호격 문장이 아니라 ‘야만인들 가운데서 형상이 없는’ 여성 자기지시로 옮겨야 합니다. 이어지는 미움/사랑의 완료적 대조와 ‘죽음’ 및 ‘법’이라는 호칭은 본문에 충실합니다. ϣⲁ-는 미래가 아니라 습관·일반 현재로 처리하는 것이 적절합니다.
  naturalness: 초안의 ‘바르바로이들’은 현대 한국어에서 불필요하게 낯선 음역이며, 첫 문장의 ‘가운데서는’도 대조 초점이 없는 문맥에서는 부자연스럽습니다. ‘야만인들 가운데서’와 ‘미움받은 이’는 시적 반복과 합쇼체를 자연스럽게 유지합니다. 모든 각주를 한국어로 정리하고, 해당 표현 바로 뒤에 표지를 두었습니다.
  terminology: βάρβαρος 계열은 현대적 가치판단을 승인하지 않고 고대 그리스어의 타자화된 명칭을 반영하는 ‘야만인들’로 번역하고 주석으로 설명합니다. ⲡⲛⲟⲙⲟⲥ는 특정 종파의 율법으로 한정하지 않도록 ‘법’으로 옮겼습니다. ‘죽음’과 ‘법’의 인용부호는 명명되는 호칭임을 드러냅니다.
  issues:
