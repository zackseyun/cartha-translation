  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/046.yaml
  text: 'and she who has no image among the barbarians[1].

    I am the one they have hated in many places,

    and I am the one they have loved in many places[b][a][3][2].

    I am the one they call “Death,”

    and I am the one they call “the Law.”'
  footnotes:
  - marker: '1'
    text: “You Greeks” is supplied to match the known sequence; the vocative is not clearly visible in the OCR snippet for this segment.
    reason: alignment_note
  - marker: '2'
    text: The phrase rendered “in many places” (ϩⲛ ⲙⲁⲛⲓⲙ) may alternatively be understood as “among peoples” or a generic locative (“in places”).
    reason: lexical_alternative
  - marker: '3'
    text: The verb with ϣⲁ- is read prospectively (“will call”); depending on dialectal morphology and context it could be taken differently.
    reason: alternative_reading
  - marker: a
    text: Or 'Then why have you hated me, you Greeks?\nBecause I am a barbarian among the barbarians?'.
    reason: previous_rendering
  - marker: b
    text: Or 'they will call'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 바르바로이들 가운데서는 형상이 없는 여자입니다.

    나는 여러 곳에서 미움을 받은 이입니다.

    그리고 나는 여러 곳에서 사랑받은 이입니다.

    나는 그들이 “죽음”이라고 부르는 이입니다.

    그리고 나는 그들이 “율법”이라고 부르는 이입니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: The OCR-based source was corrected by the later adjudication to read “and she who has no image among the barbarians,” not the earlier Greek-vocative sentence.
    reason: source_note
  - marker: b
    text: ϩⲛ ⲙⲁⲛⲓⲙ may also be understood more generically as “among peoples” or simply “in many places.”
    reason: lexical_alternative
  - marker: c
    text: The habitual prefix ϣⲁ- is better reflected as “they call” rather than a future tense.
    reason: source_note
lexical_decisions:
- source_word: ⲁⲩⲱ ⲧⲉⲧⲉⲙⲛⲧⲉⲥⲉⲓⲛⲉ ⲙⲙⲁⲩ ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  english_pob_choice: and she who has no image among the barbarians
  chosen_korean: 그리고 바르바로이들 가운데서는 형상이 없는 여자입니다
  alternatives_korean:
  - 그리고 바르바리인들 가운데서는 형상이 없는 여자입니다
  - 그리고 바르바리인들 사이에 형상이 없는 여자입니다
  lexicon: Coptic ⲛⲃⲁⲣⲃⲁⲣⲟⲥ (Greek loan)
  rationale: POB의 수정된 영어가 핵심적으로 반영한 것은 ‘barbarians’와 ‘no image’의 결합이므로, 이를 직역해 문화적 긴장을 살렸습니다. ‘바르바로이’는 용례상 외래 집단을 드러내는 음역이고, ‘형상이 없는’은 source의 부정 구문을 유지합니다.
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ
  english_pob_choice: they have hated
  chosen_korean: 미움을 받은
  alternatives_korean:
  - 미워한
  - 미워함을 받은
  lexicon: Coptic perfective verb with hostile sense
  rationale: 한국어에서는 완료상 ‘have hated’를 자연스럽게 살리기보다 결과 상태를 드러내는 수동형으로 옮기면, 앞뒤의 ‘사랑받은’과의 대조가 선명해집니다.
- source_word: ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  english_pob_choice: they have loved
  chosen_korean: 사랑받은
  alternatives_korean:
  - 사랑한
  - 사랑을 받은
  lexicon: Coptic mer- root for love/affection
  rationale: 앞행과 평행을 이루도록 ‘사랑받은’으로 맞추어, 원문의 사랑/미움 대조를 한국어에서도 같은 문법 구조로 보여 줍니다.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ / ϣⲁⲩⲙⲟⲩⲧⲉ
  english_pob_choice: call
  chosen_korean: 그들이 “죽음”이라고 부르는
  alternatives_korean:
  - 그들이 “죽음”이라고 일컫는
  - 그들이 “죽음”이라 부르는
  lexicon: Coptic moute = to call/name
  rationale: 직접 호칭 동사를 살리기 위해 ‘부르다’를 택했고, 제목처럼 불리는 대상이라는 점을 유지하기 위해 인용부호를 사용했습니다.
- source_word: ⲡⲙⲟⲩ / ⲡⲛⲟⲙⲟⲥ
  english_pob_choice: Death / the Law
  chosen_korean: “죽음” / “율법”
  alternatives_korean:
  - “죽음” / “법”
  - “죽음” / “원리”
  lexicon: Standard Coptic noun / Greek loan nomos
  rationale: ⲡⲙⲟⲩ는 명사적 호칭으로서 ‘죽음’의 인격화된 명칭을 보존하고, ⲡⲛⲟⲙⲟⲥ는 본문이 지닌 그리스어-철학적 결을 살려 ‘율법’으로 옮겼습니다.
theological_decisions:
- issue: 첫 행의 성별 표지와 자기지시의 방식
  chosen_reading: ‘여자입니다’로 옮겨, 원문의 여성 1인칭 자기지시를 한국어에서 분명하게 드러냈습니다.
  alternative_readings:
  - ‘그녀입니다’
  - 성별을 드러내지 않는 번역
  rationale: 이 단락은 화자가 스스로를 여성형으로 지시하는 구조이므로, 이를 완화하지 않고 그대로 드러내는 편이 source-direct합니다.
  doctrine_reference: 문학적/서사적 성별 표지 보존 원칙
- issue: ‘율법’의 의미
  chosen_reading: ⲡⲛⲟⲙⲟⲥ를 ‘율법’으로 옮겼습니다.
  alternative_readings:
  - 법
  - 원리
  rationale: 이 호칭은 단순한 법률이 아니라 해당 전통에서 상징적·규범적 권위를 띤 이름이므로, 한국어에서도 그 무게를 유지하는 번역이 적절합니다.
  doctrine_reference: 어휘적 맥락 보존 원칙
