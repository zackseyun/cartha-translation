base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
  footnotes:
  - marker: a
    text: ‘Word’ translates ⲗⲟⲅⲟⲥ; some readers may prefer ‘Logos’ to signal a technical term.
    reason: lexical_alternative
  - marker: b
    text: Reading ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ as ‘garment of oneness’ is tentative; OCR and segmentation may be off.
    reason: alignment_note
  - marker: c
    text: ‘Shout’ for ϣⲟϫⲛⲉ could also be ‘outcry’ or ‘tumult,’ preserving the sonic imagery.
    reason: lexical_alternative
  - marker: d
    text: The phrase ‘ⲥⲓⲥ ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ’ is uncertain; translation reflects a best guess pending improved transcription.
    reason: alignment_note
  - marker: e
    text: Or 'I am the garment of oneness for those who ask me,'.
    reason: previous_rendering
  - marker: f
    text: Or 'I am one within the word'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 나를 찾는 이들의 명령이며[a],

    신들의 자리에서 들리는 목소리들의 목소리요 —

    외치는 천사들의 목소리입니다.

    말씀 안에서 그리고 신들 가운데서[f][e][d][c][b],

    외침으로 내보내진 신들입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘명령’은 Coptic ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ에 대한 정정된 이해를 반영합니다. 초기 초안의 ‘온전함/옷’ 계열 해석은 채택하지 않았습니다.
    reason: source_note
  - marker: b
    text: 마지막 행의 ‘외침으로 내보내진’은 ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ / ⲟⲩ의 행갈이 결합을 따라, ‘하나/one’이 아니라 동사 어미를 잇는 것으로 읽었습니다.
    reason: source_note
  - marker: c
    text: ‘외침’은 ϣⲟϫⲛⲉ의 소리·환호·아우성 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: 이 줄의 Coptic 표현은 불확실하며, 천사들이 ‘외친다’는 독법을 반영한 최선의 복원입니다.
    reason: textual_variant
  - marker: e
    text: 영문 POB의 이전 번역 ‘I am one within the word’는 현재 판독에서는 채택하지 않았습니다.
    reason: previous_rendering
  - marker: f
    text: 영문 POB의 이전 번역 ‘among the gods’는 복수형을 보존해 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  english_pob_choice: decree
  chosen_korean: 명령
  alternatives_korean:
  - 칙령
  - 포고
  lexicon: Crum 506a; adjudicated revision
  rationale: OCR 분절에 따른 ‘garment’ 해석은 폐기되었고, 검토본의 결론대로 이 합성어는 ‘command/decree’ 계열이므로 한국어도 본래 강제성을 살리는 ‘명령’으로 옮겼습니다.
- source_word: ⲥⲙⲏ
  english_pob_choice: voice
  chosen_korean: 목소리
  alternatives_korean:
  - 소리
  - 음성
  lexicon: Crum (Coptic)
  rationale: 반복되는 음성 이미지를 살리면서도 시적 문맥에서 자연스럽게 읽히는 ‘목소리’를 택했습니다.
- source_word: ⲛⲛⲟⲩⲧⲉ
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 신성한 존재들
  - 신격들
  lexicon: Crum (Coptic)
  rationale: 복수 형태를 유지해야 하므로 단수 ‘하나님’으로 흡수하지 않고 ‘신들’로 직역해 다신적/신화적 긴장을 보존했습니다.
- source_word: ⲁⲅⲅⲉⲗⲟⲥ
  english_pob_choice: angels
  chosen_korean: 천사들
  alternatives_korean:
  - 사자들
  - 메신저들
  lexicon: LSJ (Greek); Crum (loanword)
  rationale: 문맥상 초월적 존재를 가리키는 차용어이므로 한국어 교회 용례에 맞는 ‘천사들’을 사용했습니다.
- source_word: ⲗⲟⲅⲟⲥ
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 로고스
  lexicon: LSJ (Greek); Crum (loanword)
  rationale: 영문 POB의 ‘word’에 대응하되, 이 작품에서의 개념적 울림을 살리기 위해 너무 평면적인 ‘말’보다 ‘말씀’을 택했습니다.
theological_decisions:
- issue: ‘gods’의 복수 표지 유지
  chosen_reading: 신들로 옮겨 복수성과 이질성을 그대로 드러냅니다.
  alternative_readings:
  - 하나님들
  - 신성한 존재들
  rationale: 본문은 복수형을 분명히 표시하므로 이를 단수 신 개념으로 흡수하면 원문의 종교적 긴장과 음성적 다층성이 약화됩니다.
  doctrine_reference: 원문 의미 보존 원칙
- issue: 문장 첫머리의 주체성
  chosen_reading: ‘나는 …입니다’의 자기선언 구조를 유지합니다.
  alternative_readings:
  - 나는 …이다
  - …입니다
  rationale: 이 단편의 반복적 자기계시 형식을 한국어에서도 선명한 선언문으로 전달하기 위해 합쇼체를 사용했습니다.
  doctrine_reference: 문체/수사 보존 원칙
