  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
  footnotes:
  - marker: a
    text: ‘Word’ translates ⲗⲟⲅⲟⲥ; some readers may prefer ‘Logos’ to signal a technical term.
    reason: lexical_alternative
  - marker: b
    text: Reading ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ as ‘garment of oneness’ is tentative; OCR and segmentation may be off.
    reason: alignment_note
  - marker: c
    text: ‘Shout’ for ϣⲟϫⲛⲉ could also be ‘outcry’ or ‘tumult,’ preserving the sonic imagery.
    reason: lexical_alternative
  - marker: d
    text: The phrase ‘ⲥⲓⲥ ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ’ is uncertain; translation reflects a best guess pending improved transcription.
    reason: alignment_note
  - marker: e
    text: Or 'I am the garment of oneness for those who ask me,'.
    reason: previous_rendering
  - marker: f
    text: Or 'I am one within the word'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 나를 찾는 이들의 명령이며[a],

    신들의 자리에서 들리는 목소리들의 목소리요 —

    외치는 천사들의 목소리입니다.

    말씀 안에서 그리고 신들 가운데서[f][e][d][c][b],

    외침으로 내보내진 신들입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘명령’은 Coptic ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ에 대한 정정된 이해를 반영합니다. 초기 초안의 ‘온전함/옷’ 계열 해석은 채택하지 않았습니다.
    reason: source_note
  - marker: b
    text: 마지막 행의 ‘외침으로 내보내진’은 ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ / ⲟⲩ의 행갈이 결합을 따라, ‘하나/one’이 아니라 동사 어미를 잇는 것으로 읽었습니다.
    reason: source_note
  - marker: c
    text: ‘외침’은 ϣⲟϫⲛⲉ의 소리·환호·아우성 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: 이 줄의 Coptic 표현은 불확실하며, 천사들이 ‘외친다’는 독법을 반영한 최선의 복원입니다.
    reason: textual_variant
  - marker: e
    text: 영문 POB의 이전 번역 ‘I am one within the word’는 현재 판독에서는 채택하지 않았습니다.
    reason: previous_rendering
  - marker: f
    text: 영문 POB의 이전 번역 ‘among the gods’는 복수형을 보존해 옮겼습니다.
    reason: previous_rendering
