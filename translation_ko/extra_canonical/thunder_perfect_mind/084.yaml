translation:
  language: ko
  text: '그분은 내 앞에 오는 것을 보는 이입니다. 나는 빛입니다.

    나는 나가지 않았습니다 — 나, 바로 나 —.

    나는 어둠이 아닌 것이며, 어둠의 뿌리는 내 안에 있습니다.

    나는 어떤 비전의 욕망이며,

    내 안에 있는 마음의 자제입니다.

    나는 모든 사람에게 받아들여지는 들음입니다.[a][b][c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 앞에 오는 자를 보는 이는 나입니다’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나가지 않았습니다’는 금지형으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ⲟⲩⲟⲛ은 ‘하나’가 아니라 ‘모든 사람/누구나’의 의미로 읽힙니다.
    reason: lexical_alternative
  - marker: d
    text: ⲙⲫⲏⲧ ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ는 ‘내 안에 있는 마음’ 또는 ‘마음 안에 존재하는’으로 나눌 수 있습니다.
    reason: lexical_alternative
