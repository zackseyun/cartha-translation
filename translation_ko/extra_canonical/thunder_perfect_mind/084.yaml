theological_decisions:
- issue: 첫 문장의 화자 지시를 본문이 직접 말하지 않는지 여부
  chosen_reading: ‘그분은 내 앞에 오는 것을 보는 이입니다’로 시작해 화자/대상 관계를 과도하게 특정하지 않고, 남아 있는 난점을 드러냈습니다.
  alternative_readings:
  - ‘내 앞에 오는 것을 보는 이는 나입니다’
  - ‘보이는 이는 내 앞에 오는 자입니다’
  rationale: 해당 절의 콥트어 OCR은 문장 경계와 대명사 관계가 불안정하므로, 더 큰 문맥의 역설성을 유지하면서 한국어 본문에서는 과잉확정하지 않는 쪽을 택했습니다.
  doctrine_reference: source-critical humility / textual uncertainty handling
- issue: ‘어둠의 뿌리’ 표현의 신학적 긴장
  chosen_reading: 어둠을 외부로 밀어내지 않고 ‘내 안에 있습니다’로 남겨, 원문의 역설적 자기-귀속을 보존했습니다.
  alternative_readings:
  - ‘어둠은 밖에 있지 않습니다’
  - ‘어둠은 내 밖에 없습니다’
  rationale: POB 개정 메모가 지적한 대로 원문은 어둠의 기원을 내적 차원에 두므로, 이를 약화하지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: rhetorical paradox / apophatic-style self-presentation
