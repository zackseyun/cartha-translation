  yaml_path: translation/extra_canonical/thunder_perfect_mind/057.yaml
  text: 'This is mine:

    I came forth in an earth[a],

    and you came to be manifest in knowledge;

    an earth is in your heart—you receive those outside[c][b], in places.'
  footnotes:
  - marker: a
    text: Many published English translations place ‘I, I am godless, and I am the one whose God is great’ in this slot. The present OCR excerpt instead features ‘darkness / knowledge / places,’ suggesting a misalignment.
    reason: alignment_note
  - marker: b
    text: The phrase rendered ‘This is mine’ is uncertain due to OCR; it may intend ‘This is my voice/utterance.’
    reason: lexical_alternative
  - marker: c
    text: Or 'I came forth in a darkness,\nand you came to be manifest in knowledge;\na darkness is in your heart—you seek outside, in places.'.
    reason: previous_rendering
translation:
  language: ko
  text: '이것은 내 것입니다.


    나는 흙에서 나왔고, 당신들은 지식 안에서 드러나게 되었습니다.

    당신의 마음 안에는 흙이 있습니다 — 당신들은 바깥의 것들을, 여러 곳에서 받습니다.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 첫 행은 OCR가 불확실하여, 영어 POB 주석처럼 다른 역본들이 두는 ‘I am godless…’류의 자리와 어긋날 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘흙’은 여기서 도덕적 평가가 아니라 ⲕⲁϩ의 문자적·상징적 의미를 따르는 번역입니다.
    reason: source_note
  - marker: c
    text: ‘바깥의 것들’은 ⲛⲉⲃⲟⲗ을 단순 부사가 아니라 복수 명사구로 본 번역입니다.
    reason: source_note
