  naturalness: ‘나는 …입니다’의 반복은 현대 한국어 합쇼체 안에서 원문의 자기선언 리듬을 잘 보존합니다. ‘풀려남의 도피’는 의도적으로 낯선 병치이나, 원문의 압축된 속격 관계를 과도하게 해설하지 않는 번역으로 유지할 수 있습니다.
