    reason: previous_rendering
translation:
  language: ko
  text: 자신을 풀어 놓으십시오.[a] 또는 그에게서 자신을 풀어 놓는다면, 누가 여러분을 붙잡을 수 있겠습니까? 여러분의 안은 여러분의 밖입니다.[b] 왜냐하면 밖을 빚으신 이는 안도 빚으신 이이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: ‘자신을 놓아주십시오’, ‘자유롭게 하십시오’.'
    reason: lexical_alternative
  - marker: b
    text: '또는: ‘여러분의 내면은 여러분의 외면입니다’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  english_pob_choice: Release yourselves
  chosen_korean: 자신을 해방하십시오
  alternatives_korean:
