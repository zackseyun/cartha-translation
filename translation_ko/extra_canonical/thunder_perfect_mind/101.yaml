  - 풀려나십시오
  - 자신을 놓아주십시오
  lexicon: Coptic Crum; ⲕⲁ ... ⲉⲃⲟⲗ
  rationale: 직역적이면서도 현대 한국어에서 자연스럽게 들리는 명령형으로 옮겼습니다. 영어 POB의 ‘Release yourselves’에 맞춰 수동적 ‘풀려나십시오’보다 자기 행위를 드러내는 표현을 택했습니다.
- source_word: ⲥⲁϩⲟⲩⲛ
  english_pob_choice: inside / outside
  chosen_korean: 안
  alternatives_korean:
  - 내면
  - 속
  - 안쪽
  lexicon: Coptic Crum; sahooun
  rationale: 이 어휘는 본문에서 ‘inside’의 뜻으로 사용되므로, 공간적 대비를 살리면서도 과도하게 심리화하지 않는 ‘안’이 가장 간결합니다.
- source_word: ⲡⲉⲧⲣⲡⲗⲁⲥⲥⲉ
  english_pob_choice: the one who fashions
  chosen_korean: 빚은 이
  alternatives_korean:
  - 만드신 이
  - 형성하신 이
  - 지으신 이
  lexicon: Coptic Crum; plassein 계열
  rationale: 형태를 빚어 만드는 물질적·조형적 뉘앙스를 살리기 위해 ‘빚다’를 선택했습니다. 문맥상 창조 행위의 반복을 유지합니다.
theological_decisions:
- issue: 본문이 단순한 신비주의적 내면 대조인지, 창조론적 동일성 진술인지
  chosen_reading: 문장 구조를 따라 ‘안’과 ‘바깥’의 동일성을 진술하면서, 그것을 빚으신 이의 행위까지 함께 연결해 창조론적·존재론적 긴장을 보존했습니다.
  alternative_readings:
  - ‘안은 바깥과 같다’는 상징적 심리 독해
  - ‘내면과 외면의 통합’으로 완화하는 독해
  rationale: 원문은 대조를 약화시키기보다 역설적으로 병치합니다. 이를 지나치게 해석하지 않고 한국어에서도 같은 긴장을 유지했습니다.
  doctrine_reference: 문학적-존재론적 역설 보존
