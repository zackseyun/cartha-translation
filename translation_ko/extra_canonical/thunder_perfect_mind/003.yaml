  - 그리워하는
  lexicon: 'Crum (tošt: wait for, expect; also desire)'
  rationale: POB의 선택을 따라 anticipatory 의미를 기본으로 살렸고, 과도한 내면화는 피했습니다.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  english_pob_choice: do not cast me from your sight
  chosen_korean: 나를 너희 시야에서 내쫓지 말며
  alternatives_korean:
  - 나를 너희 얼굴에서 내치지 말며
  - 나를 너희 앞에서 버리지 말며
  lexicon: Coptic manuscript phrase around face/sight
  rationale: 문자적으로는 ‘얼굴/시야’의 이미지가 있으므로, 관계적·시각적 배제를 함께 드러내는 ‘시야에서 내쫓다’를 택했습니다.
- source_word: ⲧⲟⲩⲛ / voice-hearing idiom
  english_pob_choice: let your voice hate me, nor your hearing
  chosen_korean: 너희 목소리가 나를 미워하게도 말고, 너희 듣는 것도 그렇게 하지 마십시오
  alternatives_korean:
  - 너희 목소리를 나에게 해롭게 하지 말고, 너희 귀도 그러지 마십시오
  - 너희 목소리가 나를 싫어하게도 말고, 너희 들음도 그러지 마십시오
  lexicon: Crum on idiomatic sensory/speech usage; POB note on voice/hearing pair
  rationale: 말소리와 듣는 행위의 병렬을 유지하되, idiom의 평가적 뉘앙스를 현대 한국어에서 가장 분명하게 드러내는 방향으로 처리했습니다.
theological_decisions:
- issue: ‘do not cast me from your sight’의 관계적 거리두기 표현
  chosen_reading: 시야에서 내쫓다
  alternative_readings:
  - 얼굴에서 내치다
  - 눈앞에서 밀어내다
  rationale: 이 텍스트는 초월적 계시 화자의 요청을 감각적 배제 이미지로 말하므로, 단순한 공간 이동보다 ‘배제/거절’의 함의를 살렸습니다.
  doctrine_reference: 문헌 내 수사와 이미지의 보존 원칙
