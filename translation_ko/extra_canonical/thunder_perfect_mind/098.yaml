  source_fidelity: 현 초안과 영어 POB 본문은 제시된 콥트어 발췌문(20쪽 11행 이하)에 맞지 않습니다. 첫 어절은 ‘소리치다’가 아니라 OCR상 ⲭⲣⲟⲉⲓ로 보이는 ⲭⲣⲱ, 곧 ‘입을 다물게 하다/막다’로 읽혀야 하며, 이어지는 ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ는 ‘그들을 심판하십시오’입니다. 또한 ⲕⲁ ⲉⲃⲟⲗ은 이 문맥에서는 추방이 아니라 ‘풀어 주다, 놓아주다’입니다. 끝부분은 사본 발췌와 문장 자체가 중단되므로 한국어에서도 줄임표로 보존했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체의 명령 및 조건 구문으로 자연스럽습니다. ‘그들의 입을 막으십시오’는 원문의 강한 명령을, ‘여러분을 붙잡기 전에’는 시간적 선행을 무리 없이 드러냅니다.
  terminology: ⲣⲓⲕⲣⲓⲛⲉ는 ‘심판하십시오’로, ⲡⲕⲣⲓⲧⲏⲥ는 ‘심판자’로 일관되게 옮겼습니다. ⲡϫⲓ ⲛϭⲟⲛⲥ는 해석적 교리화를 피하여 ‘불의’로 옮겼습니다. ‘풀어 주다’는 이 대목의 ⲕⲁ ⲉⲃⲟⲗ의 문맥적 의미에 맞습니다.
  issues:
  - severity: high
    issue: 본문이 제공된 콥트어 발췌와 전혀 다른 구절(‘나는 소리치는 자이며…’)을 번역합니다.
    rationale: 제시된 본문은 ‘그들의 입을 막으십시오. 그들이 여러분을 붙잡기 전에 그들을 심판하십시오…’라는 명령문과 조건절입니다. 현 번역의 자기선언 및 ‘땅의 얼굴’은 이 발췌에 근거가 없습니다.
  - severity: high
    issue: ⲭⲣⲟⲉⲓ와 ⲕⲁ ⲉⲃⲟⲗ의 어휘 분석이 문맥과 맞지 않습니다.
    rationale: 첫 형태는 OCR 오류를 포함한 ⲭⲣⲱ로 보이며 여기서는 ‘입을 막다’입니다. 후자는 뒤의 조건절에서 ‘풀려나다/풀어 주다’이지 ‘내쫓다’가 아닙니다.
  - severity: medium
    issue: 현 각주가 ‘땅의 얼굴’이라는 비해당 구절의 불완전 보존을 설명합니다.
    rationale: 해당 표현은 제공된 발췌에 없으므로 각주를 삭제해야 합니다. 본문 끝의 미완성은 줄임표로 표시하는 것이 안전합니다.
  revised_text: 그들의 입을 막으십시오! 그들이 여러분을 붙잡기 전에 그들을 심판하십시오. 불의의 심판자가 여러분 가운데 있기 때문입니다. 여러분을 풀어 주실 이가 오실 때 여러분이 풀려나든지, 또는 여러분이 스스로를 풀어 주든지…
  revised_footnotes: []
