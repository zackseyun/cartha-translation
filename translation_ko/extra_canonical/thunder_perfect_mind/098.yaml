translation:
  language: ko
  text: '나는 소리치는 자이며,

    땅의 얼굴 위에서 내쫓긴 자입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘땅의 얼굴 위’는 원문의 보존 상태가 불완전한 관용구를 따른 표현으로, 문맥상 ‘땅의 표면/얼굴 위’를 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: ⲭⲣⲟⲉⲓ
  english_pob_choice: cry out
  chosen_korean: 소리치는 자
  alternatives_korean:
  - 외치는 자
  - 큰소리로 부르짖는 자
  - 부르짖는 자
  lexicon: Crum; Layton, Coptic in 20 Lessons
  rationale: 감탄적·공적 발화를 나타내는 동사를 한국어에서 가장 자연스럽게 살리면서도, 단순한 ‘외치다’보다 절박한 울림을 유지하기 위해 ‘소리치는 자’로 옮겼습니다.
- source_word: ⲕⲁ ⲉⲃⲟⲗ
  english_pob_choice: cast out
  chosen_korean: 내쫓긴 자
  alternatives_korean:
  - 던져진 자
  - 내던져진 자
  - 쫓겨난 자
  lexicon: 'Crum (ⲕⲁ: throw, cast) + ⲉⲃⲟⲗ ‘out’'
  rationale: 영문 POB의 ‘cast out’가 지닌 배척·배출의 날카로움을 살리기 위해 수동형 ‘내쫓긴 자’를 선택했습니다.
- source_word: ϩⲙ ⲡϫⲓⲛⲓ
  english_pob_choice: upon the face (surface)
  chosen_korean: 땅의 얼굴 위
  alternatives_korean:
  - 땅의 표면 위
  - 땅 위
  - 지면 위
  lexicon: Crum; idiomatic surface/face expression
  rationale: 보존이 불완전한 관용구의 ‘face/surface’ 감각을 유지하면서, 문맥상 보충되는 ‘땅’과 결합해 직역성을 살렸습니다.
theological_decisions:
- issue: 화자 정체의 1인칭 여성 진술 유지
  chosen_reading: 나는 소리치는 자이며
  alternative_readings:
  - 나는 외치는 여인입니다
  - 나는 외치는 자입니다
  rationale: 원문과 영문 POB 모두 화자를 여성 1인칭으로 드러내므로, 그 긴장을 약화시키지 않도록 ‘나는 … 자’ 구조를 유지했습니다.
  doctrine_reference: 텍스트 내 자기선언의 수사적 장치 보존
- issue: ‘cast out’의 강한 추방성 유지
  chosen_reading: 내쫓긴 자입니다
  alternative_readings:
  - 보내진 자입니다
  - 밖으로 던져진 자입니다
  rationale: 단순 이동이 아니라 배척과 추방의 뉘앙스가 핵심이므로, 종교적·서정적 완곡화를 피하고 expulsive force를 보존했습니다.
  doctrine_reference: 원문 수사와 의미 강도 보존
