  language: ko
  text: 왜 너희는 나를 미워합니까, 그리스인들이여? 내가 야만인이라는 이유입니까? 나는 그리스인과 야만인의 앎입니다. 나는 심판입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
