    text: 제시된 콥트어 OCR에는 여러 낱말이 심하게 훼손되어 있습니다. NHC VI,2 16:1–5의 교정 독법에 따라 이 대목은 ‘그리스인들’, ‘야만인’, ‘앎’, ‘심판’으로 읽었습니다.
    reason: source_note
