translation:
  language: ko
  text: '내 이름의 부름이니, 그것은 나입니다.

    나는 부르짖음이며, 나는 들림입니다.

    당신들은 내게 부르는 가운데 나를 듣습니다. 당신들은 당신들이 내게 주는 한 소리로 나를 부릅니다…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 행 끝은 페이지에서 끊어졌습니다. OCR은 ϩⲛ ⟟ⲩⲡ… 뒤에 ⲉⲧⲉⲧⲛⲧⲁⲩⲟ를 보여 주므로, 마지막 구절은 불완전합니다.
    reason: source_note
lexical_decisions:
- source_word: ⲡⲱϣⲥ / ⲙ̄ⲡⲁⲣⲁⲛ
  english_pob_choice: The calling of my name
  chosen_korean: 내 이름의 부름
  alternatives_korean:
  - 내 이름의 소리
  - 내 이름을 부름
  lexicon: Crum; Layton, Coptic in 20 Lessons
  rationale: POB의 ‘calling’에 맞추되, 소유구문을 자연스럽게 풀어 한국어에서 ‘내 이름의 부름’으로 옮겨 이름-부름의 모티프를 살렸습니다.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  english_pob_choice: it is I
  chosen_korean: 그것은 나입니다
  alternatives_korean:
  - 그것은 바로 나입니다
  - 내가 바로 그것입니다
  lexicon: Coptic emphatic copular construction
  rationale: 강조적 동일시를 살리기 위해 단순한 ‘나는 ~입니다’보다 ‘그것은 나입니다’로 옮겼습니다.
- source_word: ⲡⲁϣⲕⲁⲕ ⲉⲃⲟⲗ / ⲡⲥⲱⲧⲙ
  english_pob_choice: the crying out, and I am the hearing
  chosen_korean: 부르짖음이며, 나는 들림입니다
  alternatives_korean:
  - 외침이며, 나는 들음입니다
  - 부르짖는 것과 듣는 것
  lexicon: Crum s.v. ⲁϣⲕⲁⲕ, ⲥⲱⲧⲙ
  rationale: 어법상 명사화된 표현을 직역하면서도 한국어에서 ‘듣는 행위’보다 피동 뉘앙스가 살아 있는 ‘들림’으로 대응했습니다.
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  english_pob_choice: You hear me in your calling of me
  chosen_korean: 당신들은 내게 부르는 가운데 나를 듣습니다
  alternatives_korean:
  - 당신들은 나를 부르면서 나를 듣습니다
  - 당신들은 나를 부르는 중에 나를 듣습니다
  lexicon: Crum s.v. ⲥⲱⲧⲙ, ⲙⲟⲩⲧⲉ
  rationale: 전치사구의 관계를 살리면서, ‘in your calling of me’의 동시적·매개적 의미를 ‘~하는 가운데’로 자연스럽게 옮겼습니다.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ ϩⲛ ⲟⲩⲡ…
  english_pob_choice: you call me with a sound you …
  chosen_korean: 당신들이 당신들이 내게 주는 한 소리로 나를 부릅니다…
  alternatives_korean:
  - 당신들이 내게 주는 한 음성으로 나를 부릅니다…
  - 당신들이 내게 주는 소리로 나를 부릅니다…
  lexicon: Crum s.v. ⲙⲟⲩⲧⲉ; OCR reconstruction note
  rationale: 미완성된 행의 불확실성을 보존하기 위해 ‘한 소리’로 남기고 생략부호를 유지했습니다.
theological_decisions:
- issue: 명사화된 행위 표현의 직역 여부
  chosen_reading: ‘부르짖음’, ‘들림’처럼 행위 자체를 명사로 옮겨 자기 규정의 병렬 구조를 유지했습니다.
  alternative_readings:
  - ‘부르짖는 자’, ‘듣는 자’로 인격화
  - ‘외침’, ‘듣는 소리’로 순화
  rationale: 이 단락은 존재론적 자기 선언의 병렬을 이루므로, 행위자의 인격화보다 행위 자체의 명사화를 유지하는 편이 원문 구조를 더 정확히 드러냅니다.
  doctrine_reference: Source-poetic parallelism; no doctrinal harmonization
