  source_fidelity: 영어 POB의 현행 본문인 “Hear me, you who hear; and learn my words, you who know me”를 따르는 것은, 제공된 OCR 구간의 줄맞춤 신뢰도가 낮다는 경고 아래에서는 적절합니다. 다만 OCR 말미의 ⲛⲉⲥⲙⲏ는 일반적으로 ‘이름’이라기보다 ‘목소리/소리’ 계열로 이해될 여지가 크므로, 현 각주는 ‘이름들’ 가능성을 단정적으로 제시하지 않는 편이 안전합니다.
  naturalness: ‘저를 들으십시오’는 한국어에서 사람을 청각의 직접 목적어로 삼아 다소 부자연스럽고, ‘말들을 배우십시오’도 현대 한국어에서는 부자연스럽습니다. ‘내게 귀를 기울이십시오’와 ‘내 말을 배우십시오’가 합쇼체의 직접 호소와 병행 구조를 자연스럽게 보존합니다.
  terminology: ‘말씀’ 대신 ‘말’을 사용한 선택은 특정 교회적 어감을 불필요하게 부가하지 않아 적절합니다. 한국어에서는 문맥상 복수 표지를 생략한 ‘내 말’이 자연스럽고 원문의 복수 내용을 충분히 담습니다.
  issues:
