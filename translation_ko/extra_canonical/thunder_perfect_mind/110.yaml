  - severity: low
    issue: 각주의 ‘이름들/목소리들’ 병기
    rationale: 제공된 OCR의 ⲥⲙⲏ 계열은 ‘목소리/소리’ 쪽이 우선적이며, 해당 구간 자체의 정렬도 불확실합니다. 본문 미포함의 이유를 정렬 불확실성으로 한정하고, 미확정 어휘를 ‘이름들’로 제시하지 않는 것이 안전합니다.
