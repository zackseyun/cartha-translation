    text: If ⲛ̄ϭⲟⲙ is read literally, it means “strong/powerful,” giving “Obey me, you strong ones.” Many editions read a form related to ⲧⲟⲛ (“obey/obedience”), yielding “you who obey/obedient ones.”
    reason: lexical_alternative
  - marker: c
    text: Or 'Obey me, you who obey; and learn my words, you who know me.'.
    reason: previous_rendering
