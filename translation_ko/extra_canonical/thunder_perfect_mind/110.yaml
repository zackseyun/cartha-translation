  text: Hear me, you who hear; and learn my words, you who know me.
  footnotes:
  - marker: a
    text: The OCR shows “words and names” at the end of the snippet (… ϣⲁϫⲉ ⲙⲛ̄ ⲛⲉⲥⲙⲏ), but the line-break mapping is uncertain. We therefore limit the main line to “learn my words” and flag “names” for possible inclusion upon resegmentation.
