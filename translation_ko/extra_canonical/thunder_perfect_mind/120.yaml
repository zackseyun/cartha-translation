  text: And they will find me in the place that is there, and they will live, and they will not perish. Because of this, do not be disobedient to me.
  footnotes:
  - marker: a
    text: “angels who have been sent” is supplied to match the standard triad attested in other witnesses to Thunder at this point; the phrase is not visible in the lacunose OCR here.
