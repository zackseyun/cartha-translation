    rationale: 자연스러운 한국어이지만, 이 대목의 ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ의 장소성과 지시성을 보존하려면 ‘거기 있는 곳’이 더 가깝습니다.
