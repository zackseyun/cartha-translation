    reason: textual_variant
  - marker: d
    text: Or 'Listen, you who obey; and you also, angels who have been sent, and spirits who have arisen from among the dead. Come to the place that is there— they will live. Because of this, do not hold back from hearing me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그곳에서 나를 찾아낼 것이고, 그들은 살 것이며, 결코 멸망하지 않을 것입니다. 그러므로 나에게 불순종하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ
  english_pob_choice: find me
  chosen_korean: 나를 찾아낼 것입니다
  alternatives_korean:
  - 나를 찾을 것입니다
  - 나를 발견할 것입니다
  lexicon: Crum; Layton
  rationale: 동작의 결과가 드러나는 ‘찾아내다’를 택해, 단순한 탐색보다 ‘찾아서 만나게 됨’의 뉘앙스를 살렸습니다.
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  english_pob_choice: the place that is there
  chosen_korean: 그곳
  alternatives_korean:
  - 그 자리에 있는 곳
  - 거기 있는 장소
  lexicon: Crum
  rationale: 콥트어의 지시적 표현은 한국어에서 자연스럽게 ‘그곳’으로 옮기되, 문맥의 장소성을 유지했습니다.
- source_word: ⲱⲛϩ
  english_pob_choice: live
  chosen_korean: 살 것입니다
  alternatives_korean:
  - 생명을 누릴 것입니다
  - 살아 있을 것입니다
  lexicon: Crum
  rationale: 핵심 의미는 ‘살다’이므로 간결하게 옮겼고, 문장 흐름상 미래형을 사용했습니다.
- source_word: ⲙⲡⲥⲉⲧⲙⲥⲱⲧ ⲉⲃⲟⲗ
  english_pob_choice: will not perish
  chosen_korean: 결코 멸망하지 않을 것입니다
  alternatives_korean:
  - 사라지지 않을 것입니다
  - 망하지 않을 것입니다
  lexicon: Crum; Layton
  rationale: 영문 POB의 ‘perish’에 맞춰 종말적 소멸을 나타내는 ‘멸망하다’를 택해 단순 소실보다 강한 소멸감을 보존했습니다.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  english_pob_choice: do not be disobedient to me
  chosen_korean: 나에게 불순종하지 마십시오
  alternatives_korean:
  - 나를 거역하지 마십시오
  - 내 말을 거슬러 듣지 마십시오
  lexicon: Layton Syntax; Crum
  rationale: 콥트어 부정 명령은 ‘불순종하다’가 가장 직접적이며, 인격적 대상을 향한 거부를 분명히 드러냅니다.
theological_decisions:
- issue: 발화 화자에 대한 존대 수준
  chosen_reading: 직접 화법의 명령문을 유지하되, 한국어 독자에게 자연스럽도록 공손한 금지형 ‘마십시오’를 사용했습니다.
  alternative_readings:
  - 반말형 ‘하지 마라’
  - 성경식 ‘하지 말라’
  rationale: 원문의 권위적 금지 명령을 살리면서도 현대 합쇼체 문체에 맞추기 위한 선택입니다.
  doctrine_reference: 문체·화행 보존
- issue: 멸망의 강도
  chosen_reading: ‘멸망하지 않을 것입니다’로 번역해 단순한 손실이 아니라 최종적 소멸 부정으로 읽히게 했습니다.
  alternative_readings:
  - ‘사라지지 않을 것입니다’
  - ‘죽지 않을 것입니다’
  rationale: 영문 POB의 perish는 생물학적 죽음보다 더 넓은 소멸 의미를 가지므로, source가 허용하는 범위 내에서 종말론적 강도를 유지했습니다.
  doctrine_reference: 종말론적 소멸 어휘
