review_pass:
  verdict: revise
  source_fidelity: 핵심 대조와 부정 구문은 대체로 정확합니다. 특히 ⲙⲛⲧⲉⲥ ⲟⲩⲥⲓⲁ를 ‘실체가 없는 자’로, ⲉⲃⲟⲗ ϩⲛ을 ‘밖에’로, ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ을 ‘알지 못하다’로 옮긴 점은 원문 및 수정된 영어 POB와 부합합니다. 다만 ⲥⲩⲛⲟⲩⲥⲓⲁ의 관계적 의미에는 ‘결합’보다 ‘교제/관계’가 안전하며, 첫 구절의 ‘침묵’은 OCR상 이견이 있으므로 주석에서 이를 명확히 밝혀야 합니다.
  naturalness: 합쇼체의 반복 선언문은 자연스럽습니다. 그러나 ‘평강’은 일반적인 εἰρήνη의 의미보다 한국 기독교 내부의 관용어를 강하게 환기하므로, 교파적 함의를 줄이고 현대 표준어를 유지하려면 ‘평화’가 적절합니다. ‘외국인’은 ‘이방인’보다 민족·종교적 의미를 덜 덧씌우면서 foreigner/citizen의 사회적 대조를 자연스럽게 나타냅니다. ‘내 교제 밖에 있는 자들’이 ‘내 결합 밖에 있는 자들’보다 자연스럽고 원문의 association 범위를 보존합니다.
  terminology: ⲟⲩⲥⲓⲁ는 ‘실체’로 일관되게 옮길 수 있으며, 대안인 ‘본질’은 주석에 남기는 것이 좋습니다. ⲥⲩⲛⲟⲩⲥⲓⲁ는 성적 의미로 한정하지 않고 ‘교제’로 번역하되, 주석에서 ‘관계, 연합’ 등의 가능성을 밝혀 모호성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘평강’
    rationale: 원문의 εἰρήνη는 일반적으로 ‘평화’이며, ‘평강’은 특정 한국 기독교 문체 및 교리적 연상을 더합니다. 이 비정경 텍스트에서는 ‘평화’가 더 중립적입니다.
  - severity: medium
    issue: ‘내 결합 밖에 있는’
    rationale: συνουσία는 동반, 교제, 관계, 연합을 폭넓게 뜻할 수 있습니다. ‘결합’은 지나치게 물리적·성적 결합으로 좁혀 읽힐 수 있으므로 ‘교제’가 더 안전합니다.
  - severity: low
    issue: ‘이방인’
    rationale: ‘이방인’은 현대 한국어에서 종교·민족적 타자라는 뜻을 강하게 띱니다. 불확실한 ⲟⲩϣⲙⲙⲱ와 시민의 대조에는 ‘외국인’이 보다 중립적입니다.
  - severity: medium
    issue: 첫 구절의 OCR 불확실성에 대한 주석 설명
    rationale: 제시된 OCR은 ‘침묵’에 해당하는 초기 ⲥ가 탈락한 것으로 보이며, 이 복원은 문맥상 타당하나 확정적으로 ‘확인된다’고 말할 수 없습니다.
  - severity: low
    issue: 각주 e와 f의 영어 POB 수정 이력 언급
    rationale: 번역문 각주는 독자에게 필요한 원문상의 이견과 번역 선택을 설명해야 하며, 내부 영어 번역의 과거 오독·수정 과정은 본문 주석으로 남길 필요가 없습니다.
