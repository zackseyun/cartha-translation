base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/077.yaml
  text: 'I am the silence within a voice[a].

    I am peace, and because of me war came to be.

    And I am a foreigner and a citizen.

    I am the substance, and the one who has no substance[g][f][e][d][c][b]; those who exist outside my association are ignorant of me.'
  footnotes:
  - marker: a
    text: 'Silence within a voice: the noun is read as ⲥⲙⲙⲟⲥ (silence); OCR shows ⲙⲙⲟⲥ. Thunder elsewhere juxtaposes silence and voice.'
    reason: alignment_note
  - marker: b
    text: 'Foreigner: the lemma of ⲟⲩϣⲙⲙⲱ is uncertain; "stranger" is an equally possible rendering.'
    reason: lexical_alternative
  - marker: c
    text: 'Essence translates Greek οὐσία (ousia). Alternatives: substance, being.'
    reason: lexical_alternative
  - marker: d
    text: Consort renders Greek συνουσία (synousia), which can denote companionship, association, or sexual union; "companionship" or "association" are possible.
    reason: lexical_alternative
  - marker: e
    text: '"Because of me the war came to be" follows ϣⲱⲡⲉ ⲉⲧⲃⲏⲏⲧ; the causative sense could also be expressed as "on account of me war occurred."'
    reason: alignment_note
  - marker: f
    text: Or 'I am the essence, and the one with the consort; those who are within my consort make me known.'.
    reason: previous_rendering
  - marker: g
    text: Or 'I am the peace, and because of me the war came to be.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 목소리 속의 침묵입니다[a].


    나는 평화이며, 나 때문에 전쟁이 생겨났습니다.


    나는 외국인이자 시민입니다.


    나는 실체이며, 실체가 없는 자입니다[b]. 내 교제 밖에 있는 자들은 나를 알지 못합니다[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침묵’은 OCR에 ⲙⲙⲟⲥ로 보이는 어형을 ⲥⲙⲙⲟⲥ(‘침묵’)로 복원하여 옮긴 것입니다. 이 복원은 ‘목소리’와 이루는 역설 및 이 작품의 문맥에 부합하지만, OCR 판독 자체에는 불확실성이 있습니다.
    reason: source_note
  - marker: b
    text: ‘실체’는 그리스어 οὐσία에서 온 ⲟⲩⲥⲓⲁ의 번역입니다. ‘본질’ 또는 ‘존재’로도 옮길 수 있습니다. 이어지는 표현은 ‘실체가 없는 자’라는 대조를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘교제’는 그리스어 συνουσία에서 온 ⲥⲩⲛⲟⲩⲥⲓⲁ를 옮긴 말입니다. ‘관계’, ‘연합’, ‘동반’으로도 번역할 수 있습니다. ⲉⲃⲟⲗ ϩⲛ은 ‘… 밖에’를 뜻하며, 뒤의 동사는 ‘나를 알지 못하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  english_pob_choice: I am
  chosen_korean: 나는
  alternatives_korean:
  - 저는
  - 내가
  lexicon: Layton; Crum
  rationale: 첫인칭 자기선언의 반복적 운율을 살리기 위해 ‘나는’을 유지했습니다.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ / (ⲥ)ⲙⲙⲟⲥ
  english_pob_choice: silence within a voice
  chosen_korean: 목소리 안의 침묵
  alternatives_korean:
  - 목소리 속의 침묵
  - 소리 속의 침묵
  lexicon: Crum
  rationale: ‘목소리’와 ‘침묵’의 역설을 직접 드러내되, 안에/속에의 관계를 자연스러운 한국어로 옮겼습니다.
- source_word: ϯⲣⲏⲛⲏ / ⲡⲡⲟⲗⲉⲙⲟⲥ
  english_pob_choice: peace / the war
  chosen_korean: 평강 / 전쟁
  alternatives_korean:
  - 평화 / 전쟁
  - 평강 / 그 전쟁
  lexicon: Greek loanword (eirēnē) via Coptic; Greek loanword (polemos) via Coptic
  rationale: 원문의 대조를 살리되, 한국어에서 시적·선언적 울림이 큰 ‘평강’을 택했습니다. ‘그 전쟁’은 한국어 어법상 과도해 생략했습니다.
- source_word: ⲟⲩϣⲙⲙⲱ / ⲣⲙⲛⲡⲟⲗⲓⲥ
  english_pob_choice: foreigner / citizen
  chosen_korean: 이방인 / 시민
  alternatives_korean:
  - 낯선 자 / 시민
  - 외인 / 시민
  lexicon: Crum; Greek loan (polis)
  rationale: 사회적 대립항을 가장 분명하게 전달하는 대응으로 옮겼습니다. ‘시민’은 ‘도시 사람’의 관용적 의미를 자연스럽게 반영합니다.
- source_word: ⲟⲩⲥⲓⲁ / ⲙⲛⲧⲉⲥ ⲟⲩⲥⲓⲁ
  english_pob_choice: substance / one who has no substance
  chosen_korean: 실체 / 실체가 없는 자
  alternatives_korean:
  - 본질 / 본질이 없는 자
  - 존재 / 존재가 없는 자
  lexicon: Greek loanword (ousia) via Coptic
  rationale: POB의 수정본이 지적하듯 ‘무(無)실체’의 대조가 핵심이므로, 형이상학적 뉘앙스를 살리는 ‘실체’를 택했습니다.
- source_word: ⲉⲃⲟⲗ ϩⲛ
  english_pob_choice: outside of
  chosen_korean: 내 결합 밖에 있는
  alternatives_korean:
  - 내 연합 밖에 있는
  - 내 관계 밖에 있는
  lexicon: Crum
  rationale: 문맥상 ‘association’에 해당하는 결합/연결의 바깥이라는 뜻을 살려, 관계적·연합적 의미가 드러나는 표현으로 옮겼습니다.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ
  english_pob_choice: are ignorant of me
  chosen_korean: 나를 알지 못합니다
  alternatives_korean:
  - 나를 모릅니다
  - 나를 깨닫지 못합니다
  lexicon: Crum
  rationale: 영어 POB의 수정처럼 이것은 ‘알게 하다’가 아니라 ‘알지 못하다’이므로, 가장 직접적인 한국어로 옮겼습니다.
theological_decisions:
- issue: ‘peace/war’의 개념 대립과 정관사 처리
  chosen_reading: ‘평강이며, 나 때문에 전쟁이 생겨났습니다’로 옮겨 선언적·예언적 어조를 유지했습니다.
  alternative_readings:
  - ‘평화이며, 나 때문에 전쟁이 생겨났습니다’
  - ‘평강입니다, 그리고 나 때문에 전쟁이 생겨났습니다’
  rationale: 원문은 단순 정보 전달이 아니라 역설적 자기계시의 병렬 진술이므로, 한국어도 짧고 단호한 선언문처럼 구성했습니다.
  doctrine_reference: 문학적-신학적 어조 보존 원칙
