base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/082.yaml
  text: 'I am the union and the dissolution[a];

    I am the abiding[d][c][b],

    and I am the dissolution.'
  footnotes:
  - marker: a
    text: Reading ⲡⲡⲱⲧⲣ ⲙⲛ ⲡⲕⲱⲗⲉⲃⲟⲗ as “the First and the Outside.” The compound likely reflects kol + ebol (outside). Some editors might prefer “the Outer.”
    reason: lexical_alternative
  - marker: b
    text: Monē (ⲙⲟⲛⲏ) can denote dwelling, abode, or rest. “Dwelling” chosen for concreteness; “Rest” is possible contextually.
    reason: lexical_alternative
  - marker: c
    text: ⲡⲕⲱⲗ is a set phrase in Coptic Gnostic literature for “the All,” i.e., the totality.
    reason: cultural_note
  - marker: d
    text: Or 'I am the First and the Outside[a];\nI am the Dwelling[b];\nand I am the All[c] — I am.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 결합과 해체입니다.

    나는 머묾입니다.

    그리고 나는 해체입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영어 POB의 기존 ‘union/dissolution’은 오독을 바로잡은 개정 번역을 반영합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲡⲱⲧⲣ
  english_pob_choice: the union
  chosen_korean: 결합
  alternatives_korean:
  - 연합
  - 결속
  - 맺어짐
  lexicon: Crum 275a
  rationale: Coptic ⲡⲱⲧⲣ은 ‘union/joining’ 계열의 의미이므로, 영어 POB의 개정판 취지를 따라 ‘결합’으로 옮겼습니다.
- source_word: ⲕⲱⲗⲉⲃⲟⲗ / ⲕⲱⲗ
  english_pob_choice: the dissolution
  chosen_korean: 해체
  alternatives_korean:
  - 해산
  - 분해
  - 풀림
  lexicon: Crum 103b
  rationale: 해당 어형은 ‘outside’가 아니라 ‘dissolution/loosening’ 의미이므로, 물질적·형이상학적 분해감을 살려 ‘해체’로 옮겼습니다.
- source_word: ⲧⲙⲟⲛⲏ
  english_pob_choice: the abiding
  chosen_korean: 머묾
  alternatives_korean:
  - 머무름
  - 거처
  - 거함
  lexicon: Greek monē loanword in Coptic; Crum
  rationale: ⲧⲙⲟⲛⲏ는 ‘dwelling/abiding’ 계열의 뜻이므로, ‘머묾’으로 번역해 앞의 ‘해체’와 대조를 유지했습니다.
theological_decisions:
- issue: 반복되는 자기 동일시의 구조
  chosen_reading: 세 번의 ‘나는 …입니다’는 서로 다른 존재 양상을 병치하는 자기 선언으로 유지했습니다.
  alternative_readings:
  - 첫째·둘째·셋째를 명시적으로 구분하는 해석
  - 형이상학적 정의문으로 평탄화하는 해석
  rationale: 원문은 병렬적 자기 선언의 긴장을 보존하며, 이를 평탄화하면 텍스트의 수사적 힘이 약해집니다.
