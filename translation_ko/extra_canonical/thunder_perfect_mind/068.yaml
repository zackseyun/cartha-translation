translation:
  language: ko
  text: 그런데 너희는 왜 나를 작은 이들 가운데서 멸시합니까? 나는 마음[a]이며, 나의 쉼[f][e][d][c][b]입니다. 너희는 나의 족속에 대한 지식입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누스’, ‘지성’. ⲡⲛⲟⲩⲥ는 그리스어 νοῦς에서 온 차용어입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 뒤 부분은 OCR이 불안정하며, ‘나의 족속/종류’에 해당하는 반복 어구로 보는 편이 본문 검토와 더 잘 맞습니다.
    reason: textual_variant
  - marker: c
    text: 초기 초안의 ‘나의 찾음/탐색’은 본문 검토에서 기각되었습니다.
    reason: previous_rendering
  - marker: d
    text: 이 위치의 앞선 초안은 ‘작은 것/어린 것’ 관련 구문으로 읽었으나, 수정 검토에서는 화자에 대한 멸시로 재분석되었습니다.
    reason: previous_rendering
  - marker: e
    text: 초안의 다른 해석으로는 ‘나는 작은 것들 가운데 있는 자들과 함께 있다’는 읽기도 제시되었습니다.
    reason: previous_rendering
  - marker: f
    text: 또는 ‘안식’. ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ는 그리스어 ἀνάπαυσις에서 온 말입니다.
    reason: lexical_alternative
