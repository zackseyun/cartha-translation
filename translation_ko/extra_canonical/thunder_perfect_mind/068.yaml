  yaml_path: translation/extra_canonical/thunder_perfect_mind/068.yaml
  text: Why do you despise me among those who are small? I am the Mind[a], and my Rest[f][e][d][c][b]. You are the knowledge of my kind
  footnotes:
  - marker: a
    text: 'Or: Nous; Intellect. The Coptic ⲡⲛⲟⲩⲥ is a loan from Greek νοῦς.'
    reason: lexical_alternative
  - marker: b
