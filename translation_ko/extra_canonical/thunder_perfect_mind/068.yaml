  - ‘작은 이들 가운데서’가 화자 자신이 아니라 청중의 상태를 가리키는 해석
  rationale: 개정된 Coptic/POB 검토에 맞추어, 첫 절의 책망과 뒤의 ‘나는 …입니다’ 선언을 분리해 자연스럽게 재현했습니다.
  doctrine_reference: 문학적-본문비평적 판단
- issue: ⲡⲛⲟⲩⲥ 번역에서 철학적 용어를 유지할지 일상어로 바꿀지
  chosen_reading: ‘마음’을 사용해 철학적 뉘앙스를 과도하게 약화하지 않으면서도 현대 한국어의 가독성을 확보했습니다.
  alternative_readings:
  - 지성
  - 누스
  - 정신
  rationale: 이 텍스트는 고대 영지주의적 자기발화를 담고 있어 용어의 낯섦이 어느 정도 필요하지만, 본문 낭독성을 위해 완전 음역보다 의미역을 택했습니다.
  doctrine_reference: 용어 선택 원칙
