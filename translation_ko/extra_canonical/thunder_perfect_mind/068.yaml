  - 나의 본성
  - 나의 종류
  lexicon: revised source review; Thunder recurrent phrase
  rationale: 개정 검토가 이 구를 ‘my kind’에 해당하는 표현으로 정리하므로, 혈연·계열을 함축하는 ‘족속’으로 옮겨 반복 어구의 자기지시성을 살렸습니다.
- source_word: ⲛⲛⲉⲧ ⲛⲉⲣⲙⲛⲥⲁⲛⲁⲓ
  english_pob_choice: among those who are small
  chosen_korean: 작은 이들 가운데서
  alternatives_korean:
