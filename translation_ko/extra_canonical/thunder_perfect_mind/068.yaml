  - 정신
  - 누스
  lexicon: Crum; Greek νοῦς loanword
  rationale: 노에스/누스의 철학적 무게를 살리면서도 현대 한국어에서 바로 읽히는 ‘마음’을 택했습니다. ‘지성’은 다소 추상적이고, ‘누스’는 주석 없이 본문성이 약합니다.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  english_pob_choice: my Rest
  chosen_korean: 나의 쉼
  alternatives_korean:
  - 나의 안식
  - 나의 휴식
  - 나의 평안
  lexicon: Crum; Greek ἀνάπαυσις
  rationale: 원문의 소유 표현을 살려 ‘나의’로 두고, ‘Rest’의 직접 대응으로 ‘쉼’을 선택했습니다. 교회적 관용어인 ‘안식’은 의미를 넓히지만, 여기서는 보다 중립적인 ‘쉼’이 적절합니다.
- source_word: ⲡⲁⲅⲉⲛⲟⲥ / ⲡⲁⲅⲓⲛⲉ
  english_pob_choice: my kind
  chosen_korean: 나의 족속
  alternatives_korean:
