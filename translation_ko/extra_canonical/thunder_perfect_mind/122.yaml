  text: 'And do not make me known in another place or in another time. Do not make me known. Do not make me known in another place or in another time.

    For I am the one who has come to be, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance[f][e][d][c][b], and the one who will come to be.'
  footnotes:
  - marker: a
    text: 'ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ is a negative prohibitive with causative “make known,” hence “do not make me known.” Alternatives: “do not reveal/announce me.”'
    reason: lexical_alternative
  - marker: b
    text: ⲟⲩⲟⲉⲓϣ can be “crowd, multitude, assembly.” I chose “crowd” for concreteness.
    reason: lexical_alternative
  - marker: c
    text: ϣⲱⲡⲉ has a range “happen, become, come to be.” In self-revelation contexts, “come to be” carries ontological force.
    reason: lexical_alternative
  - marker: d
    text: ⲥⲩⲛⲅⲛⲱⲙⲏ ranges over “forbearance/pardon/lenience/consent/understanding.” “Forbearance” is a deliberate choice to preserve strangeness; “Pardon” or “Understanding” remain possible.
    reason: lexical_alternative
  - marker: e
    text: The consult English supplied for this segment does not correspond to these Coptic lines; mapping is low-confidence and likely offset.
    reason: alignment_note
  - marker: f
    text: Or 'And do not make me known to another place or to another crowd; do not make me known.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 다른 곳이나 다른 때에 나를 알게 하지 마십시오. 나를 알게 하지 마십시오. 다른 곳이나 다른 때에 나를 알게 하지 마십시오.


    이는 내가 되어 온 이이며, 되어 올 이이기 때문입니다.

    나는 관용입니다. 그리고 되어 올 이입니다.

    나는 관용입니다. 그리고 되어 올 이입니다.

    나는 관용[f][e][d][c][b]입니다. 그리고 되어 올 이입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ⲟⲩⲟⲉⲓϣ는 ‘때, 시기’이며, 여기서는 ‘crowd’가 아니라 시간 표현으로 이해하는 것이 옳습니다.
    reason: source_note
  - marker: c
    text: ϣⲱⲡⲉ는 ‘일어나다’보다 ‘되다, 되어 가다, 되어 오다’의 존재론적 뉘앙스가 강합니다.
    reason: lexical_alternative
  - marker: d
    text: ⲥⲩⲛⲅⲛⲱⲙⲏ는 ‘관용’ 외에도 ‘용서, 너그러움, 양해’의 범위를 가집니다.
    reason: lexical_alternative
  - marker: e
    text: 영어 대조본의 이 대목은 Coptic 줄과 정확히 일치하지 않는 부분이 있어, 본문 대조 시 주의가 필요합니다.
    reason: textual_variant
  - marker: f
    text: 또는 ‘다른 곳이나 다른 때에 나를 알게 하지 마십시오’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ
  english_pob_choice: do not make me known
  chosen_korean: 나를 알게 하지 마십시오
  alternatives_korean:
  - 나를 드러내지 마십시오
  - 나를 알리지 마십시오
  lexicon: Crum; negative prohibitive with causative of ⲥⲟⲟⲩⲛ
  rationale: Coptic의 부정 금지형은 단순히 ‘보여 주지 말라’보다 ‘알게 하지 말라’가 더 직접적으로 대응합니다. 영어 POB의 ‘make me known’도 이 방향을 따르므로 한국어는 ‘나를 알게 하지 마십시오’로 옮겼습니다.
- source_word: ⲕⲉⲙⲁ / ⲛⲕⲉⲟⲩⲟⲉⲓϣ
  english_pob_choice: another place / another time
  chosen_korean: 다른 곳 / 다른 때
  alternatives_korean:
  - 다른 장소 / 다른 시간
  - 어떤 다른 곳 / 어떤 다른 때
  lexicon: Crum
  rationale: ⲕⲉⲙⲁ는 ‘다른 곳’, ⲟⲩⲟⲉⲓϣ는 ‘때/시기’가 기본값이므로, 의미를 자연스럽게 살리면서도 원문의 병렬을 유지해 ‘다른 곳이나 다른 때’로 옮겼습니다.
- source_word: ϣⲱⲡⲉ
  english_pob_choice: has come to be / will come to be
  chosen_korean: 되어 온 이 / 되어 올 이
  alternatives_korean:
  - 생겨난 이 / 생겨날 이
  - 되어진 이 / 되어질 이
  lexicon: Crum
  rationale: 이 문맥의 ϣⲱⲡⲉ는 단순 사건보다 존재론적 ‘되다, 생겨나다’의 뉘앙스가 강하므로, ‘되어 온 이’와 ‘되어 올 이’로 현재-미래의 자기계시를 살렸습니다.
- source_word: ⲥⲩⲛⲅⲛⲱⲙⲏ
  english_pob_choice: Forbearance
  chosen_korean: 관용
  alternatives_korean:
  - 너그러움
  - 포용
  - 용서
  lexicon: LSJ; Crum
  rationale: ⲥⲩⲛⲅⲛⲱⲙⲏ는 ‘forbearance/lenience/pardon/consent’의 범위를 가지며, 영어 POB의 ‘Forbearance’를 한국어로 옮길 때 가장 자연스럽고도 긴장감을 유지하는 말이 ‘관용’입니다.
theological_decisions:
- issue: 자기계시의 중첩과 존재론적 표현
  chosen_reading: ‘나는 …입니다’와 ‘되어 온 이 / 되어 올 이’의 병렬을 유지해 화자의 자기정체성을 사건 설명이 아니라 존재의 선언으로 읽도록 했습니다.
  alternative_readings:
  - ‘나는 …한 자입니다’처럼 완화하는 읽기
  - ‘되었던/될’ 식의 단순 시제화
  rationale: 본문은 반복과 병렬을 통해 화자의 정체성을 강조하므로, 한국어도 이를 보존해야 합니다. ‘되어 온/올 이’는 어색함을 일부 감수하더라도 원문의 ontological force를 유지합니다.
  doctrine_reference: source-text theological register preservation
