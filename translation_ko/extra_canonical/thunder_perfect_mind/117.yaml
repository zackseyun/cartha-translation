theological_decisions:
- issue: 직접 명령문과 대상 호칭의 재구성
  chosen_reading: 문장의 핵심을 ‘…심판하라! …너희를 심판하라!’라는 직접 명령으로 살렸습니다.
  alternative_readings:
  - ‘그가 나를 심판할 것입니다’ 같은 서술형
  - ‘심판받을 사람들’로 완화한 표현
  rationale: 주어진 본문과 POB 역주가 모두 재판정적 촉구를 강하게 드러내므로, 설교적 완화보다 원문의 긴박한 수사적 힘을 우선했습니다.
  doctrine_reference: 수사적 명령과 심판 어휘의 보존
- issue: ‘덧없는’의 시간성 보존
  chosen_reading: ‘temporary pleasures’를 ‘덧없는 쾌락’으로 옮겨 일시성과 허무함을 함께 드러냈습니다.
  alternative_readings:
  - ‘잠깐의 쾌락’
  - ‘일시적 쾌락’
  rationale: 본문의 악덕 목록은 단순한 감각적 즐거움이 아니라 지속성 없는 욕망을 가리키므로, 시간적 허무를 드러내는 표현이 적합합니다.
  doctrine_reference: 윤리적 악덕 목록의 의미 보존
