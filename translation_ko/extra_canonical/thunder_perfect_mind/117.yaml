    reason: previous_rendering
translation:
  language: ko
  text: 나를 심판할 이가 여러 죄와, 절제하지 못함과, 공허한 정욕과, 덧없는 쾌락 가운데 있는 너희를 심판하라![a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘절제하지 못함’은 POB가 확정한 intemperances를 반영한 번역입니다. OCR의 ‘ignorances’는 보조 번역 전통과 다릅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘공허한 정욕’은 POB의 ‘empty passions’를 따른 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘덧없는 쾌락’은 POB의 ‘temporary pleasures’를 따른 번역입니다.
    reason: lexical_alternative
  - marker: d
    text: 명령형 ‘심판하라!’는 본문의 수사적 급전환을 보존하기 위한 번역입니다.
    reason: theological_note
