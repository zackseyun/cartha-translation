base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/121.yaml
  text: 'Because of this[a], do not let me be heard[b];

    and do not let me be known by judgment or by any other power.'
  footnotes:
  - marker: a
    text: The sequence ⲕⲉⲙⲁ likely represents the Greek loan ⲕⲣⲓⲙⲁ (“judgment”); OCR may have dropped ⲣⲓ. If not ⲕⲣⲓⲙⲁ, the sense is uncertain and could reflect another noun.
    reason: textual_variant
  - marker: b
    text: ⲟⲉⲓϣ commonly means “strength/power”; hence “any other power.”
    reason: cultural_note
translation:
  language: ko
  text: '그러므로 나를 듣지 마십시오[a];

    그리고 나를 심판으로도, 어떤 다른 힘으로도 알지 못하게 하십시오[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ는 직역상 ‘나를 듣게 하지 마십시오’에 가깝지만, 한국어에서는 자연스러운 금지형으로 옮겼습니다.
    reason: korean_style_note
  - marker: b
    text: 원문은 ⲕⲉⲙⲁ(아마도 그리스어 차용어 ⲕⲣⲓⲙⲁ, ‘심판’)와 ⲛⲕⲉⲟⲩⲟⲉⲓϣ(‘어떤 다른 힘’)의 병렬을 보입니다.
    reason: source_note
