base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/078.yaml
  text: 'Those who exist outside my association are ignorant of me[a],

    and those who exist in my substance are the ones who know me.

    Those who are close to me have been ignorant of me,

    and those who are far away from me are the ones who have known me.

    On the day when I am close to you, you are far away from me,

    and on the day when you are close to me, I am far away from you.'
  footnotes:
  - marker: a
    text: ⲥⲩⲛⲟⲩⲥⲓⲁ can mean ‘being-with, association, company’; some translate ‘counsel’ or ‘knowledge’ here depending on context.
    reason: lexical_alternative
  - marker: b
    text: The specific classes (angels, gods, spirits, women) are not all legible in the provided OCR lines; they follow the standard sequence in this section of Thunder and may be confirmed or adjusted with a cleaner transcription.
    reason: alignment_note
  - marker: c
    text: Or 'I am the power of the powers in my presence,\nof the angels dispatched at my word,\nand of gods among gods in my assembly,\nand of the spirits of every person who abides with me,\nand of the women who dwell within me.'.
    reason: previous_rendering
translation:
  language: ko
  text: '내 곁의 존재 밖에 있는 이들은 나를 알지 못합니다[a].

    내 실재 안에 있는 이들은 나를 아는 이들입니다.

    나에게 가까운 이들은 나를 알지 못하였고,

    나에게서 먼 이들은 나를 알게 된 이들입니다.

    내가 당신에게 가까운 날에는 당신이 나에게서 멀고,

    당신이 나에게 가까운 날에는 내가 당신에게서 멉니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲥⲩⲛⲟⲩⲥⲓⲁ는 ‘함께 있음, 교제, 동반’의 뜻을 가질 수 있으며, 문맥에 따라 ‘조언’이나 ‘지식’으로도 옮겨질 수 있습니다.
    reason: lexical_alternative
