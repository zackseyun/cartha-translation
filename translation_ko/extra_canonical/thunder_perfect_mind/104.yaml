review_pass:
  verdict: revise
  source_fidelity: 현 초안은 영어 POB의 교정된 내/외 대조 및 ‘보임/옷’의 읽기를 대체로 충실히 반영합니다. 다만 앞 문장의 목적어 ⲙⲙⲟϥ(‘그를/그것을’)가 한국어에서 빠졌고, 원문이 청자를 향해 직접 명령하는 ⲥⲱⲧⲙ은 합쇼체로 옮겨야 합니다. 제공된 Coptic OCR은 몇몇 자리가 손상되었거나 불안정해 보이며, 특히 ‘옷’에 해당하는 구절은 영어 감사 기록의 교정 독해에 의존합니다.
  naturalness: ‘여러분이 바깥에서 보는 것을, 여러분은 여러분 안에서 저를 봅니다’는 의미는 전달하지만 조사와 반복이 다소 무겁습니다. ‘여러분이 여러분 밖에서 보는 것은 여러분이 여러분 안에서 보는 저입니다’로 하면 내/외의 대조와 지시 관계를 더 자연스럽게 유지합니다. ‘들어라’는 요청된 현대 합쇼체와 맞지 않습니다.
  terminology: τύπος는 여기서 ‘모형’으로 번역할 수 있으나, 현 각주는 ‘예표적’이라는 신학적으로 좁은 뉘앙스를 더합니다. 교단적 함의를 피하여 ‘본보기/형상/모형’의 어휘 범위를 밝히는 방식이 안전합니다. 호격 ἀκροατής는 ‘듣는 이들이여’가 현대 한국어에서 자연스럽고 수사적 호소를 보존합니다.
  issues:
  - severity: medium
    issue: 첫 문장에서 ⲙⲙⲟϥ의 목적어가 누락됨
    rationale: ‘그분은 여러분 안에 모형으로 세우셨습니다’는 무엇을 세웠는지 명시하지 않아 원문의 대명사 목적어를 탈락시킵니다. 선행 문맥이 생략되어 있으므로 ‘그를’로 보존하는 편이 안전합니다.
  - severity: medium
    issue: ‘들어라’가 합쇼체 요구와 불일치
    rationale: 원문의 직접 명령형은 유지하되 표준 현대 한국어의 공손한 문체로 ‘들으십시오’라고 해야 합니다.
  - severity: low
    issue: 각주 표지가 ‘모형’이 아닌 문장 끝에 놓여 있고, 각주가 예표적 의미를 단정함
    rationale: 각주는 τύπος의 번역 선택을 설명하므로 해당 낱말 바로 뒤에 붙여야 합니다. ‘예표적’은 본문만으로 확정할 수 없는 신학적 협소화입니다.
  revised_text: …그분은 그를 여러분 안에 모형으로 만드셨습니다.[a] 여러분이 여러분 밖에서 보는 것은 여러분이 여러분 안에서 보는 저입니다. 그것은 드러나 있으며, 여러분의 옷입니다. 들으십시오, 듣는 이들이여.
  revised_footnotes:
  - marker: a
    text: ‘모형’으로 옮긴 τύπος는 문맥에 따라 본보기, 형상, 모형 등의 뜻을 지닐 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 목적어 대명사를 복원하고, 내/외 공간 대조와 화자 ‘저’를 자연스러운 한국어 문장으로 유지했습니다. 명령형을 합쇼체로 통일했으며, τύπος 각주를 해당 어휘에 연결하고 특정 신학적 독해를 피하도록 중립화했습니다.
