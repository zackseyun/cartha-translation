base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/104.yaml
  text: '...you[a], he made him a pattern within you. And what you see outside you, you see me within you. It is visible, and it is your garment. Listen to me[d][c][b], you hearers.'
  footnotes:
  - marker: a
    text: ⲛⲟⲩⲟⲛϩ ⲉⲃⲟⲗ could be read as “bring forth a living one” (taking ⲟⲛϩ as a noun) or “live outwardly” (verb + adverb). The main text reads it as an imperative “Live.”
    reason: lexical_alternative
  - marker: b
    text: This mapped block does not appear to contain the “I am justice” statement; instead it addresses “hearers” with a near/far antithesis. The segment mapping may be misaligned.
    reason: alignment_note
  - marker: c
    text: The sequence ⲥⲁⲛϩⲟⲩ is uncertain (possibly OCR error or “together/inside”); it is not explicitly rendered to avoid over-precision.
    reason: lexical_alternative
  - marker: d
    text: Or 'You who draw near—and you who are far—look; you will look toward me. Live, and awake; listen to me, you hearers.'.
    reason: previous_rendering
translation:
  language: ko
  text: '...그분은 여러분 안에 모형으로 세우셨습니다. 그리고 여러분이 바깥에서 보는 것을, 여러분은 여러분 안에서 저를 봅니다. 그것은 드러나 있으며, 그것은 여러분의 옷입니다. 들어라, 너희 듣는 자들아.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모형’은 그리스어 τύπος 계열의 형성적·예표적 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲧⲁϥⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  english_pob_choice: he made him a pattern
  chosen_korean: 모형으로 세우셨습니다
  alternatives_korean:
  - 본보기로 세우셨습니다
  - 패턴으로 만드셨습니다
  lexicon: Coptic compound with Greek loan ⲣⲧⲩⲡⲟⲥ (τύπος)
  rationale: 핵심 의미는 ‘형상/본보기/모형’이므로 한국어에서는 ‘모형’이 가장 자연스럽고 원문의 형성적 의미를 보존합니다.
- source_word: ⲥⲁⲛⲃⲟⲗ
  english_pob_choice: outside
  chosen_korean: 바깥에서
  alternatives_korean:
  - 밖에서
  - 외부에서
  lexicon: Coptic spatial term contrasted with ⲥⲁϩⲟⲩⲛ
  rationale: 내/외 대조를 분명히 살리기 위해 ‘바깥에서’로 옮겼습니다.
- source_word: ⲥⲁϩⲟⲩⲛ
  english_pob_choice: within/inside
  chosen_korean: 안에서
  alternatives_korean:
  - 내부에서
  - 속에서
  lexicon: Coptic spatial term in antithesis to ⲥⲁⲛⲃⲟⲗ
  rationale: 원문의 반복되는 내/외 대조를 가장 간결하게 드러내는 기본어로 ‘안에서’를 택했습니다.
- source_word: ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  english_pob_choice: visible / manifest
  chosen_korean: 드러나 있으며
  alternatives_korean:
  - 보이게 되어 있으며
  - 나타나 있으며
  lexicon: Coptic phrase meaning ‘be visible, manifest’
  rationale: ‘visible’의 상태적 의미를 살리면서도 한국어 문장 흐름에 맞게 ‘드러나 있으며’로 번역했습니다.
- source_word: ⲁⲕⲣⲟⲁⲧⲏⲥ
  english_pob_choice: hearers
  chosen_korean: 듣는 자들
  alternatives_korean:
  - 청자들
  - 귀 기울이는 자들
  lexicon: Greek loan ἀκροατής
  rationale: 그리스어 차용어의 수사적 호소를 살리되, 현대 한국어에서는 뜻이 바로 드러나는 ‘듣는 자들’이 가장 적절합니다.
theological_decisions:
- issue: 내/외 대조를 인격적·영적 인식의 구조로 보존할지 여부
  chosen_reading: 바깥에서 보는 것과 안에서 보는 것을 대비하는 내/외 대조를 그대로 유지했습니다.
  alternative_readings:
  - 이를 상징적으로 풀어 더 해석적인 문장으로 바꾸는 방식
  rationale: 이 단락의 핵심 수사는 시각적 대상과 내적 인식의 대조이므로, 해석을 앞세우기보다 구조 자체를 드러내는 것이 본문에 더 충실합니다.
  doctrine_reference: 문학적·영지주의적 상징 구조에 대한 직역 원칙
- issue: 명령형 ‘들어라’의 호격 대상
  chosen_reading: 직접 호소를 살리기 위해 ‘들어라, 너희 듣는 자들아’로 옮겼습니다.
  alternative_readings:
  - ‘들으십시오, 듣는 분들’처럼 공손하게 완화하는 번역
  rationale: 원문은 청중을 직접 부르는 수사적 명령이므로, 합쇼체 서술 안에서도 호격은 강하게 유지하는 것이 적절합니다.
  doctrine_reference: 수사적 명령과 호격의 재현
