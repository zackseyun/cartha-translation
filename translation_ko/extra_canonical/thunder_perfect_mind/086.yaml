review_pass:
  verdict: revise
  source_fidelity: 첫 구절의 ⲙⲫⲏⲧ를 ‘본성’으로 처리한 것은 신뢰하기 어렵습니다. 이 대목은 OCR의 분절·문자 판독 오류를 감안하면 통상 ⲙ̄ⲡϩⲏⲧ, 곧 ‘내 안에 있는 마음의’로 복원되어 앞 문장에 이어지는 단편입니다. 또한 현행 후반부의 ‘붙잡을 수 없는 말’은 본문 비판적으로 복원된 독해와 부합합니다.
  naturalness: ‘모든 사람에게 닿을 수 있는 듣는 능력’은 한국어에서 수식 관계가 다소 불명확합니다. ‘모든 사람이 얻을 수 있는 들음’은 추상명사들의 병렬을 유지하면서도 더 자연스럽습니다. 단편으로 시작하는 첫 구절은 원문의 앞 문맥 계속을 보존하므로 유지합니다.
  terminology: ⲡϩⲏⲧ에는 ‘마음’을, ⲡⲥⲱⲧⲙ에는 능력으로 과도하게 한정하지 않은 ‘들음’을, ⲡϣⲁϫⲉ에는 신학적으로 특정되지 않은 ‘말’을 사용합니다. ⲧⲉⲕⲱ의 ‘부름’도 적절합니다.
  issues:
  - severity: high
    issue: ‘본성’ 및 관련 각주
    rationale: 해당 OCR 표기는 판독 오류 가능성이 크며, 알려진 복원 독해의 ‘마음’과 맞지 않습니다. ‘본성/종류’라는 선택지와 그에 근거한 각주는 삭제·교정해야 합니다.
  - severity: medium
    issue: '[c]–[f] 각주의 근거와 앵커'
    rationale: 현 번역은 ‘나타나는 말’ 독해를 채택하지 않는데도 그 독해 및 영어 POB의 임시 주석 흔적을 중첩해 둡니다. 한국어 본문을 설명하는 데 필요한 최소한의 본문 복원 주석만 남기는 편이 정확합니다.
  - severity: low
    issue: ‘듣는 능력’
    rationale: 원문의 추상명사 ‘hearing’을 능력으로 좁힐 수 있습니다. ‘들음’이 병렬과 의미 범위를 더 잘 보존합니다.
  revised_text: …내 안에 있는 마음의 것입니다[a]. 나는 모든 사람이 얻을 수 있는 들음이며, 붙잡을 수 없는 말입니다[b]. 나는 부름입니다.
  revised_footnotes:
  - marker: a
    text: 첫 단어군은 제시된 OCR의 판독이 불안정합니다. 문맥과 통상적인 본문 복원에 따라 ‘내 안에 있는 마음의’로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 이 구절의 콥트어 전승·OCR 판독은 불확실합니다. 여기서는 본문 비판적으로 복원된 독해에 따라 ‘붙잡을 수 없는’으로 옮겼습니다. ‘파악할 수 없는’으로도 옮길 수 있습니다.
    reason: textual_variant
  revision_rationale: ‘본성’이라는 번역과 그 어휘 주석은 불안정한 OCR 표기를 그대로 따른 결과이므로, 문맥상 더 잘 뒷받침되는 ‘마음’으로 바로잡았습니다. 첫 문장은 앞 절에 이어지는 원문 단편임을 보존했습니다. 후반부는 이미 채택된 ‘붙잡을 수 없는’ 독해를 유지하되, 관련 없는 중복 각주를 제거하고 복원 불확실성을 직접 밝히는 두 주석으로 정리했습니다.
