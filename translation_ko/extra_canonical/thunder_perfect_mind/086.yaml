  - 내 안에 존재하는 본성의 것이다
  rationale: 아랍어/콥트 전승 계열의 반복적 자기 규정 문맥에서, 이 구절은 앞선 선언을 이어받는 구조로 읽는 편이 자연스럽고, POB의 수정안도 불필요한 주어 삽입을 피합니다.
