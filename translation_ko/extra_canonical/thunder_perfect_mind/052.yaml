review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 콥트어 관계구문(‘당신들이 나를 생각한 이’)이 초안에서는 ‘나는 당신들이 나를 생각해 왔습니다’로 옮겨져 화자와 ‘당신들’의 주어 관계가 뒤바뀌고 한국어 문법도 성립하지 않습니다. 또한 완료를 뜻하는 ‘~해 왔습니다’는 원문이 요구하지 않습니다. ⲁⲧⲥⲃⲱ에는 이 발췌문에서 여성을 명시하는 말이 없으므로 ‘여자’를 보태지 않는 편이 안전합니다. 반면 네 번째 선언의 여성 관계형은 ‘여인’으로 보존했습니다. 나머지 절들의 시제와 대조적 병치는 유지했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽게 읽히며, 반복되는 ‘나는’과 독립절의 리듬을 보존합니다. ‘배운 적이 없는 여자이지만’의 불필요한 성별 추가와 원문에 없는 역접 ‘-지만’을 ‘배우지 못한 이이고’로 바로잡았습니다.
  terminology: ‘생각한/생각합니다’는 ⲙⲉⲉⲩⲉ ⲉⲣⲟ-의 반복을, ‘조롱했습니다’는 ϣⲱⲥ의 모욕적 의미를, ‘경멸한’은 καταφρονέω의 의미를 적절히 반영합니다. ‘여인’은 ⲧⲉ ⲧⲉⲛⲧ-의 여성형을 보존하되 불필요하게 다른 절들까지 성별화하지 않습니다.
  issues:
  - severity: high
    issue: 첫 문장의 주어 관계와 문법이 잘못되었습니다.
    rationale: ⲁⲛⲟⲕ ⲡⲉⲛⲧⲁⲧⲉⲧⲛⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ는 ‘나는 당신들이 나를 생각한 이입니다’라는 관계구문입니다. 초안의 ‘나는 당신들이 나를 생각해 왔습니다’는 화자가 생각하는 행위의 주체인 듯하게 만들며 비문입니다.
  - severity: medium
    issue: ‘생각해 왔습니다’와 각주 a가 근거 없는 ‘숨김’ 의미를 도입합니다.
    rationale: 이 대목의 ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ는 ‘나를 생각하다’이며, ‘숨겨진/숨긴’ 대안이나 지속·완료의 ‘해 왔다’는 이 구절의 원문에 근거하지 않습니다.
  - severity: medium
    issue: 세 번째 선언에 ‘여자’와 역접 ‘-지만’이 추가되었습니다.
    rationale: 발췌된 ⲁⲧⲥⲃⲱ는 ‘배우지 못한/배움이 없는’이라는 뜻이며 여기에는 여성 명사가 없습니다. 또한 접속사 ⲁⲩⲱ는 단순 접속이므로 ‘하지만’으로 대조를 강화하지 않는 것이 좋습니다.
