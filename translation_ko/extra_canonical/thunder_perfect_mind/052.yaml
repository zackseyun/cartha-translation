translation:
  language: ko
  text: '나는 당신들이 나를 생각한 사람입니다.


    그리고 당신들은 나를 조롱했습니다.


    나는 배우지 못한 이이고, 그들은 나에게서 배웁니다.


    나는 당신들이 경멸한 여인입니다.


    그리고 당신들은 나를 생각합니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  english_pob_choice: think about
  chosen_korean: 생각해 왔습니다 / 생각합니다
  alternatives_korean:
  - 생각하다
  - 마음에 두다
  - 숙고하다
  lexicon: Crum; Layton
  rationale: ⲙⲉⲉⲩⲉ ⲉⲣⲟ-는 대상을 ‘생각하다’는 뜻이므로, 앞뒤 반복을 살려 동일 어간으로 옮겼습니다.
- source_word: ϣⲟⲥⲧ
  english_pob_choice: mocked
  chosen_korean: 조롱했습니다
  alternatives_korean:
  - 비웃었습니다
  - 조소했습니다
  - 경멸했습니다
  lexicon: Crum
  rationale: 문맥상 단순한 ‘숨기다’가 아니라 조롱/비웃음을 뜻하므로, 강한 모욕감을 살리는 ‘조롱했습니다’로 옮겼습니다.
- source_word: ⲁⲧⲥⲃⲱ
  english_pob_choice: unlearned
  chosen_korean: 배운 적이 없는 여자
  alternatives_korean:
  - 무식한 여자
  - 교육받지 못한 여자
  - 배우지 못한 여자
  lexicon: Crum
  rationale: ‘unlearned’의 의미를 살리되, ‘무식한’의 강한 멸시 뉘앙스를 피하려고 자연스러운 한국어로 풀었습니다.
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ ⲛ̄ⲧⲟⲟⲧ
  english_pob_choice: they learn from me
  chosen_korean: 나에게서 그들이 배웁니다
  alternatives_korean:
  - 그들은 나에게서 배웁니다
  - 그들이 나로부터 배웁니다
  - 나로부터 그들이 배웁니다
  lexicon: Crum; Layton
  rationale: 직역하면 ‘나에게서’의 방향성이 분명하므로, 원문의 역설을 유지하는 가장 자연스러운 한국어 어순으로 옮겼습니다.
theological_decisions:
- issue: 여성 화자 표지 보존
  chosen_reading: ‘I am she’의 여성형 자의식을 살려, 화자를 일관되게 ‘여자’로 드러냈습니다.
  alternative_readings:
  - 성별을 드러내지 않는 중립 표현
  - ‘나는 …이다’로만 처리
  rationale: Coptic 문법과 문맥상 여성형 표지가 반복되므로, 이를 지워 버리면 본문이 가진 정체성의 긴장이 약해집니다.
  doctrine_reference: source-language syntax; speaker characterization in the source
