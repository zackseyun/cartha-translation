    그리고 당신들은 나를 생각합니다.'
  rationale: 원문의 관계절과 독립절의 구별을 회복하고, 첫 절의 주어·문법 오류를 바로잡았습니다. 근거 없는 ‘숨김’ 각주, 불필요한 지속상, 세 번째 절의 성별 명사 및 역접을 제거했습니다. 네 번째 절에 명시된 여성형만 ‘여인’으로 옮겨 원문의 표지를 보존했습니다.
