theological_decisions:
- issue: 자기계시의 역설 구조
  chosen_reading: ‘존귀한 이’와 ‘평화’가 동시에 ‘전쟁’을 낳는 역설을 직설적으로 유지합니다.
  alternative_readings:
  - 의미를 완화하여 상징적 내면 갈등으로 처리
  - ‘전쟁’을 단순한 비유로 약화
  rationale: Thunder의 수사 핵심은 상반된 자기규정의 공존이므로, 평탄화하지 않고 그대로 보존하는 것이 원문 의도를 가장 잘 드러냅니다.
