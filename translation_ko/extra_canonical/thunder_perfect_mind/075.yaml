base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
  footnotes:
  - marker: a
    text: The word-final ⲣⲟⲥ is taken as the tail of ⲡⲣⲱⲧⲟⲥ (‘the First’); the beginning of the word is not visible in this OCR slice.
    reason: alignment_note
  - marker: b
    text: ⲛⲧⲁ- can mark ‘because of (me/us/etc.)’; an alternative reconstruction would yield ‘and I am War,’ which also appears in some translations of Thunder’s paradoxes.
    reason: alternative_reading
  - marker: c
    text: ϩⲛ ⲟⲩϣⲱⲥ may mean ‘in insolence’ or ‘in shamelessness’; due to uncertainty it is not rendered in the main line.
    reason: lexical_alternative
  - marker: d
    text: 'Parallels: elsewhere in Thunder the speaker says ‘I am peace, and because of me there is war,’ maintaining the paradoxical self-revelation motif.'
    reason: cross_reference
  - marker: e
    text: Or 'I have come, and they call me the First — and they despise me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 존귀한 이이며, 그들이 찬양하는 이요, 그들이 멸시로 업신여기는 이입니다. 나는 평화이며, 나로 인해 전쟁이 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들이 축복하는 이’에 가깝지만, 문맥상 존귀/찬양의 뉘앙스를 함께 담았습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 Coptic는 ‘멸시로’에 해당하는 표현을 포함하므로, 이를 한국어 본문에 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲏⲟⲩ
  english_pob_choice: the honored one
  chosen_korean: 존귀한 이
  alternatives_korean:
  - 존귀한 자
  - 영광받은 이
  lexicon: Coptic ⲉⲓⲟ ‘honor, esteem’ with qualitative force
  rationale: 이 형용적 표현은 ‘왔다’가 아니라 존귀/영예의 상태를 가리키므로, 문맥의 병행 구조를 살려 ‘존귀한 이’로 옮겼습니다.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩⲣⲟⲥ / ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  english_pob_choice: the one they bless
  chosen_korean: 그들이 찬양하는 이
  alternatives_korean:
  - 그들이 복을 비는 이
  - 그들이 축복하는 이
  lexicon: Coptic ⲥⲙⲟⲩ ‘bless/praise’
  rationale: 주어진 POB 전통은 blessing을 유지하되, 한국어에서는 ‘찬양하다’가 문맥상 ‘존귀한 이’와 더 자연스럽게 병렬되어 수식의 반복을 살립니다.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  english_pob_choice: with contempt
  chosen_korean: 멸시로 업신여기는
  alternatives_korean:
  - 무례하게
  - 수치스럽게
  lexicon: Coptic phrase of contempt/shamelessness
  rationale: 주어진 주해가 이 구절을 ‘contempt’ 계열로 처리하므로, 행위 양태를 드러내는 한국어 부사구로 반영했습니다.
- source_word: ϯⲣⲏⲛⲏ
  english_pob_choice: Peace
  chosen_korean: 평화
  alternatives_korean:
  - 평강
  lexicon: Greek εἰρήνη
  rationale: 철학적-신비주의적 대구에서는 ‘평강’보다 일반어 ‘평화’가 원문의 자기서술적 선언을 더 직선적으로 전달합니다.
- source_word: ⲛⲧⲁ ⲡⲡⲟⲗⲉⲙⲟⲥ
  english_pob_choice: because of me there is War
  chosen_korean: 나로 인해 전쟁이 있습니다
  alternatives_korean:
  - 내 때문에 전쟁이 있습니다
  - 그리고 나는 전쟁입니다
  lexicon: ⲛⲧⲁ- causative + Greek πόλεμος
  rationale: 원문의 인과 구문을 살려 ‘나로 인해’로 옮기고, 전쟁을 인격화된 대조항으로 남겨 문장 간 역설을 보존했습니다.
theological_decisions:
- issue: 자기계시의 역설 구조
  chosen_reading: ‘존귀한 이’와 ‘평화’가 동시에 ‘전쟁’을 낳는 역설을 직설적으로 유지합니다.
  alternative_readings:
  - 의미를 완화하여 상징적 내면 갈등으로 처리
  - ‘전쟁’을 단순한 비유로 약화
  rationale: Thunder의 수사 핵심은 상반된 자기규정의 공존이므로, 평탄화하지 않고 그대로 보존하는 것이 원문 의도를 가장 잘 드러냅니다.
