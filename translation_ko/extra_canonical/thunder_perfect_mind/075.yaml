base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
  footnotes:
  - marker: a
    text: The word-final ⲣⲟⲥ is taken as the tail of ⲡⲣⲱⲧⲟⲥ (‘the First’); the beginning of the word is not visible in this OCR slice.
    reason: alignment_note
  - marker: b
    text: ⲛⲧⲁ- can mark ‘because of (me/us/etc.)’; an alternative reconstruction would yield ‘and I am War,’ which also appears in some translations of Thunder’s paradoxes.
    reason: alternative_reading
  - marker: c
    text: ϩⲛ ⲟⲩϣⲱⲥ may mean ‘in insolence’ or ‘in shamelessness’; due to uncertainty it is not rendered in the main line.
    reason: lexical_alternative
  - marker: d
    text: 'Parallels: elsewhere in Thunder the speaker says ‘I am peace, and because of me there is war,’ maintaining the paradoxical self-revelation motif.'
    reason: cross_reference
  - marker: e
    text: Or 'I have come, and they call me the First — and they despise me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 존귀한 이이며, 그들이 축복하는 이요, 그들이 멸시하며 업신여기는 이입니다.[a] 나는 평화이며, 나로 인해 전쟁이 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들이 축복하는 이’에 쓰인 콥트어는 문맥에 따라 ‘찬양하다’로도 옮길 수 있으나, 여기서는 ‘축복하다’의 뜻을 따랐습니다. 마지막 표현은 멸시가 이루어지는 태도나 방식을 덧붙입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나로 인해’에 해당하는 표현은 인과적으로 읽었습니다. 본문 상태에 따라 ‘그리고 나는 전쟁이다’로 읽을 가능성도 제기되어 왔습니다.
    reason: alternative_reading
