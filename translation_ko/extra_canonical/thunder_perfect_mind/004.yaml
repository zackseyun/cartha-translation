    issue: 본문의 금지 명령이 우회적 사역 구문으로 번역됨
    rationale: ‘…일이 없게 하십시오’는 독자에게 어떤 결과를 조성하라고 말하는 인상을 주며, 원문의 직접적인 금지/권면의 힘을 약화합니다.
