    rationale: OCR에는 ‘듣다’, ‘장소에 따라’, ‘다른 생각에 따라’로 읽힐 수 있는 연속 구절이 보이는 반면, consult text는 ‘어느 곳에서나 어느 때에나 나를 알지 못하지 말라’입니다. 현 자료만으로 어느 읽기가 이 블록의 확정 본문인지 판정할 수 없으므로 원문 대조와 정렬 재검증이 필요합니다.
