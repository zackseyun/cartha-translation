  source_fidelity: 대조용 Coptic OCR 발췌는 제시된 consult text 및 영어 POB 본문과 직접적으로 일치하지 않으며(청취/장소/‘다른 생각’으로 보이는 어휘가 포함됨), 정렬 신뢰도도 medium입니다. 따라서 확정적으로 그 OCR에 맞추어 본문을 재번역하는 것은 안전하지 않습니다. 제공된 consult text와 영어 POB의 ‘Do not be unknowing of me anywhere or at any time’에 따르면, 개정문은 금지 권면과 장소·시간의 포괄성을 충실히 보존합니다.
  naturalness: 초안의 ‘나를 알지 못하는 일이 없게 하십시오’는 문법상 가능하나 우회적이고, 금지 명령이라기보다 화자가 독자에게 어떤 상태를 만들어 달라고 요구하는 듯 들릴 수 있습니다. ‘나를 알지 못한 채 있지 마십시오’가 현대 표준 한국어 합쇼체에서 더 자연스럽고 원문의 상태 금지를 잘 드러냅니다.
  terminology: ‘알지 못하다’는 여기서 단순 정보 부족보다 화자에 대한 인식·앎의 결여를 표현하는 데 적절합니다. 별도의 교리적 용어를 덧붙이지 않았습니다.
  issues:
