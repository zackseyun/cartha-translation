  language: ko
  text: 나는 어머니이고 딸입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 콥트어 ⲧⲥϩⲓⲙⲉ의 기본 의미는 ‘여자/여성’이지만, 이 대목에서는 ‘어머니’와의 대조를 살리는 문맥적 번역을 따랐습니다.
    reason: lexical_alternative
  - marker: b
    text: English POB도 이 구절을 한 번의 ‘I am’과 병렬 명사구로 읽어, 두 개의 독립절로 나누지 않았습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  english_pob_choice: I am
  chosen_korean: 나는 …입니다
  alternatives_korean:
  - 저는 …입니다
  - 나는 …이다
  lexicon: Layton; Crum
  rationale: 콥트어의 1인칭 서술문은 한국어에서도 단정적인 1인칭 평서로 옮기는 것이 자연스럽고, 반복되는 자아 선언의 리듬을 살리기 위해 ‘나는’을 유지했습니다.
- source_word: ⲧⲙⲁⲁⲩ
