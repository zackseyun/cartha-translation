theological_decisions:
- issue: 자기 동일화의 병렬 구조
  chosen_reading: ‘어머니’와 ‘딸’을 하나의 서술로 결합해, 단일한 ‘나는’ 아래의 역설적 동일화를 살렸습니다.
  alternative_readings:
  - ‘나는 어머니입니다. 나는 딸입니다.’
  - ‘나는 어머니이며 딸입니다.’
  rationale: 원문은 ⲁⲩⲱ(‘그리고’)로 두 명사를 잇는 단일 서술 구조이므로, 한국어에서도 두 절로 쪼개지 않되 병렬성과 역설을 유지하는 표현이 가장 가깝습니다.
  doctrine_reference: 원문 수사와 병렬 구조 보존
- issue: 호격/문체 조정 여부
  chosen_reading: 합쇼체의 서술문으로만 처리하고, 본문 내부의 화자 위계는 추가로 부풀리지 않았습니다.
  alternative_readings:
  - 더 시적인 단문 구조
  - 종교적 어법의 고전체
  rationale: 이 텍스트는 예언적·기도문적 한국어 관습보다 원문의 자기선언적 어조가 중요하므로, 현대 공식 문체를 유지하는 것이 적절합니다.
  doctrine_reference: 문체 일관성과 원문 화행 보존
