  terminology: ‘어머니’는 적절합니다. ‘딸’은 본문에서 영어 POB의 문맥적 선택을 따를 수 있으나, 원어의 기본 어휘 뜻이 ‘여자/여성’이라는 점을 각주에서 보존해야 합니다. 기존 각주 b는 영어 POB의 실제 주석 내용을 반영하지 않고 원어 본문상의 불확실성도 설명하지 못하므로 교체가 필요합니다.
