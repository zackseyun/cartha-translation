  alternative_readings:
  - 더 시적인 단문 구조
  - 종교적 어법의 고전체
  rationale: 이 텍스트는 예언적·기도문적 한국어 관습보다 원문의 자기선언적 어조가 중요하므로, 현대 공식 문체를 유지하는 것이 적절합니다.
  doctrine_reference: 문체 일관성과 원문 화행 보존
