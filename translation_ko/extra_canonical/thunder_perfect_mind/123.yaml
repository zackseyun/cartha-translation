translation:
  language: ko
  text: 그들이 나를 그곳에서 찾을 것이며, 그들은 살고 다시는 죽지 않을 것입니다. 그들이 나를 그곳에서 찾을 것이며, 그들은 살고 다시는 죽지 않을 것입니다. 그들이 나를 그곳에서 찾을 것이며, 그들은 살고 다시는 죽지 않을 것입니다…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘올 것인 자…’로 볼 수 있습니다. 다만 Coptic 상대미래 ⲡⲉⲧⲛⲁ-ⲥⲱⲡⲉ의 문맥상 핵심은 ‘오게 될/되어 갈 존재’라는 미래적 지시입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁϣⲱⲡⲉ
  english_pob_choice: the one who will come to be
  chosen_korean: 그들이 나를 그곳에서 찾을 것
  alternatives_korean:
  - 올 것인 자
  - 일어날 것
  - 나타날 것
  lexicon: Coptic Sahidic relative-future ⲡⲉⲧⲛⲁ- + ϣⲱⲡⲉ
  rationale: 이 구절의 실제 영어 문맥은 반복되는 ‘나를 찾을 것’이므로, OCR/주석이 가리키는 상대미래의 대상을 한국어 본문에는 자연스러운 서술로 옮기고, 반복 구조를 살리기 위해 동일한 문장을 유지했습니다.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  english_pob_choice: I am
  chosen_korean: 나를
  alternatives_korean:
  - 나는
  - 내가
  - 바로 나
  lexicon: Coptic equative/copular construction
  rationale: 영문 POB의 반복적 ‘I am’ 정체성 진술은 이 단락의 핵심이지만, 현재 주어진 영어 대조본문은 ‘they will find me there’이므로 한국어에서는 7절의 서술 의미를 우선해 ‘나를’로 반영했습니다.
- source_word: ⲧⲉⲥⲩⲛⲅⲛⲱⲙⲏ
  english_pob_choice: the forgiveness
  chosen_korean: 용서
  alternatives_korean:
  - 사면
  - 관용
  - 용서함
  lexicon: Greek loan συγγνώμη via Coptic
  rationale: 이 단위는 복합 의미(용서/사면/관용)를 가지지만, 현대 한국어에서 가장 즉각적으로 이해되는 기본값으로 ‘용서’를 택했습니다.
- source_word: ⲁⲩⲱ
  english_pob_choice: and
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 또한
  - 그리고서
  lexicon: Common Coptic coordinator
  rationale: 반복되는 병렬 연결을 한국어에서도 가장 무리 없이 살릴 수 있는 기본 접속사로 옮겼습니다.
theological_decisions:
- issue: 반복과 미완결을 어떻게 처리할지
  chosen_reading: 세 번 반복된 동일 문장을 유지하고, 마지막은 줄임표로 끝맺었습니다.
  alternative_readings:
  - 두 번만 반복하고 마침표로 종결
  - 반복 없이 한 번만 제시
  rationale: 주어진 Coptic OCR과 최신 수정 기록은 반복의 수와 리듬을 중요한 본문 특징으로 다루므로, 이를 삭제하지 않고 한국어에서도 반복과 미완결성을 보존했습니다.
  doctrine_reference: 본문비평/수사학적 보존 원칙
- issue: 현재 주어진 영어 대조본문과 Coptic OCR 사이의 긴장
  chosen_reading: 영어 POB의 원리와 주석을 참조하되, 본문은 주어진 Coptic OCR에 보이는 반복 구조를 우선하여 처리했습니다.
  alternative_readings:
  - 영어 대조본문만 따라 ‘그곳에서 나를 찾을 것이며…’로 단순화
  - OCR 반복을 무시하고 단문으로 정리
  rationale: 사용 가능한 원자료는 Coptic OCR이며, 최신 교정에서도 반복 수의 복원이 명시되어 있으므로, 영어 요약문보다 원문 구조를 우선하는 것이 source-grounded 원칙에 맞습니다.
  doctrine_reference: 원문우선 번역 원칙
