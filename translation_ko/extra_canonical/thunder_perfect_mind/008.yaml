theological_decisions:
- issue: 도덕적 대비를 통한 역설의 보존
  chosen_reading: ‘창녀’와 ‘거룩한 존재’의 병렬을 그대로 유지해, 원문이 만드는 강한 역설과 충돌을 완화하지 않았습니다.
  alternative_readings:
  - ‘매춘부와 성스러운 자’처럼 완화된 표현
  - ‘음녀와 거룩한 이’처럼 교회적 관용어로 치환
  rationale: 이 구절의 핵심은 상반된 자기 동일시의 충격이므로, 한국어에서도 정서적 강도를 보존하는 것이 원문 충실도에 더 부합합니다.
  doctrine_reference: 원문 수사 구조 보존 원칙
- issue: 합쇼체 종결
  chosen_reading: 서술형 종결을 ‘입니다’로 처리해 현대 공식 문체를 유지했습니다.
  alternative_readings:
  - 반말체
  - 고전적 종결 ‘-나이다’
  rationale: 본문 화자의 선언적 어조를 유지하면서도, 번역 본문 전체의 표준어·현대 문체 요구에 맞추기 위함입니다.
  doctrine_reference: 표준 한국어 문체 지침
