translation:
  language: ko
  text: 나는 창녀이며 존귀한 이입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲟⲣⲛⲏ(pornē)는 성을 팔거나 그 대가로 성행위를 하는 여성을 가리킵니다. ‘창녀’는 이 말의 직설성과 사회적 낙인을 반영합니다. ‘매춘부’ 또는 ‘성매매 여성’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲥⲉⲙⲛⲏ(semnē)는 ‘존귀한, 존경받는, 위엄 있는’을 뜻하며, 문맥에 따라 ‘거룩한 이’로도 이해될 수 있습니다. 본문은 이 의미 범위를 보존하기 위해 ‘존귀한 이’로 옮겼습니다.
    reason: lexical_alternative
