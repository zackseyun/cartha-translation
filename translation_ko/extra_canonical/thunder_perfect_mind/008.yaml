  text: I am the whore and the holy one[a][b].
  footnotes:
  - marker: a
    text: ⲡⲟⲣⲛⲏ (pornē) = a woman who sells sex; ‘prostitute’ is the neutral equivalent. ‘Whore’ preserves the period stigma/shock that intensifies the paradox here.
    reason: lexical_alternative
  - marker: b
    text: 'ⲥⲉⲙⲛⲏ (semnē) literally ‘revered/august’; in this context functions as ‘holy (one)’. Alternatives: ‘revered one,’ ‘august one,’ or simply ‘holy.’'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 창녀이자 거룩한 존재입니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲟⲣⲛⲏ(pornē)는 성을 판매하는 여성을 가리키며, ‘whore’는 그 시대적 낙인과 충격을 보존합니다. 한국어 ‘창녀’는 이를 직설적으로 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ⲥⲉⲙⲛⲏ(semnē)는 문자 그대로는 ‘존경받는/위엄 있는’에 가깝지만, 이 문맥에서는 ‘거룩한(존재)’로 기능합니다.
    reason: lexical_alternative
