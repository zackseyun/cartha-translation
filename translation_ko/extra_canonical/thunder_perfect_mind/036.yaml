    reason: lexical_alternative
  - marker: c
    text: ‘여자인 이’는 콥트어 여성형 관계절을 보존한 표현입니다. 이는 화자의 생물학적 성별을 별도로 확정하려는 것이 아니라 문법적 여성형 자기지시를 드러냅니다. 첫 구절의 OCR 판독도 불확실하므로 ‘분별의 말’은 잠정적 번역입니다.
