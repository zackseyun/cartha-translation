  source_fidelity: 첫 문장의 ‘내 부르심’은 ⲛⲉⲧⲛ ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ, 곧 ‘여러분이 나를 부름/부르는 것’을 ‘내가 여러분을 부름’으로 바꾸어 관계 방향을 역전시킵니다. 또한 두 번째와 세 번째 단편을 각각 ‘어떤 […]’으로 독립시켜, 불완전한 ⲟⲩⲡ— 뒤의 명사를 수식하는 ⲉⲧⲉⲧⲛⲧⲁⲩⲟ(‘여러분이 내뱉는’)의 관계를 흐립니다. 부정 완료와 ‘나는 변론이다’는 대체로 충실합니다.
  naturalness: 현행 문장은 ‘여러분이 내게 말하는 어떤 […], 여러분이 내뱉는 어떤 […]’처럼 술어와 목적어가 중복되고 문장 성분이 미완성으로 남아 자연스럽지 않습니다. 결손 표지를 유지하되, 수식 관계가 보이도록 한 문장으로 연결하는 편이 현대 한국어 합쇼체에서 명료합니다.
