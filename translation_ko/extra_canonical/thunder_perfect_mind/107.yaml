base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/107.yaml
  text: 'I am the hearing that is attainable to all[a];

    I am the speech that cannot be grasped;

    the name of the sound and the sound of the name;

    I am the sign of this[g][f][e][d][c][b], and the manifestation.'
  footnotes:
  - marker: a
    text: ϣⲏⲡ can mean “great,” but in this Thunder collocation many editors take it as “attainable/within reach,” yielding the paradox with the following clause.
    reason: lexical_alternative
  - marker: b
    text: ⲉⲙⲁⲩ/ⲙⲁⲩ is deictic (“there”). Some translations read an inaccessibility contrast here (“the speech that cannot be grasped”), which may reflect a different underlying reading.
    reason: alternative_reading
  - marker: c
    text: ⲥⲙⲁϩⲧⲉ = “remembrance/memory.” The pronominal object ⲙⲙⲟϥ (“of it/him”) likely refers to the “speech/word.”
    reason: lexical_alternative
  - marker: d
    text: ⲥⲙⲏ may be “sound,” “voice,” or “report.” I choose “sound” to preserve the abstract acoustic pair with “name.”
    reason: lexical_alternative
  - marker: e
    text: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ could be rendered “light that shines out” to make the outward aspect explicit.
    reason: lexical_alternative
  - marker: f
    text: Or 'I am the speech that is there;\nI am its remembrance—'.
    reason: previous_rendering
  - marker: g
    text: Or 'I am the sign as well, and the light that goes forth.'.
    reason: previous_rendering
translation:
  language: ko
  text: '나는 모든 사람에게 닿을 수 있는 듣는 바이며[a],

    붙잡힐 수 없는 말이며[b];

    소리의 이름이요 이름의 소리이며[c][d],

    이것의 표징이자 드러남입니다[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲉⲧϣⲏⲡ은 문맥상 ‘닿을 수 있는/도달 가능한’이라는 뜻으로 읽을 수 있습니다. 영어 POB도 이 역설을 살려 번역합니다.
    reason: lexical_alternative
  - marker: b
    text: 콥트어 ⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ는 ‘그들이 그것을 붙잡을 수 없다/파악할 수 없다’는 뜻으로 이해됩니다. 따라서 ‘붙잡힐 수 없는 말’로 옮겼습니다.
    reason: textual_variant
  - marker: c
    text: 콥트어 ⲥⲙⲏ는 ‘소리/음성/보고’가 될 수 있으나, 추상적 대응을 위해 ‘소리’로 옮겼습니다.
    reason: lexical_alternative
  - marker: d
    text: 콥트어 표기상 ‘이름’과 ‘소리’가 서로 맞물리는 대구를 이룹니다.
    reason: source_note
  - marker: e
    text: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ은 문자적으로 ‘밖으로 드러남/나타남’이며, 영어 POB의 ‘manifestation’을 따랐습니다.
    reason: source_note
lexical_decisions:
- source_word: ⲥⲱⲧⲙ
  english_pob_choice: hearing
  chosen_korean: 듣는 바
  alternatives_korean:
  - 청취
  - 들음
  lexicon: Crum; Layton
  rationale: 명사적 감각을 살리되, 추상적 ‘hearing’의 자기동일화 형식을 한국어에서 자연스럽게 드러내기 위해 ‘듣는 바’로 옮겼습니다.
- source_word: ⲉⲧϣⲏⲡ
  english_pob_choice: attainable
  chosen_korean: 닿을 수 있는
  alternatives_korean:
  - 도달 가능한
  - 접근 가능한
  lexicon: Crum; Kasser
  rationale: 이 구절의 역설적 대비를 살리기 위해 단순히 ‘크다’가 아니라 ‘닿을 수 있는/도달 가능한’으로 옮겼습니다.
- source_word: ⲡϣⲁϫⲉ
  english_pob_choice: speech
  chosen_korean: 말
  alternatives_korean:
  - 언어
  - 발화
  lexicon: Crum; Layton
  rationale: 지속적으로 울려 나오는 발화성을 살리면서도, 신학적 고정어휘인 ‘말씀’으로 과도하게 끌리지 않도록 ‘말’로 번역했습니다.
- source_word: ⲥⲙⲁϩⲧⲉ ⲙⲙⲟϥ
  english_pob_choice: the speech that cannot be grasped
  chosen_korean: 붙잡힐 수 없는 말
  alternatives_korean:
  - 파악될 수 없는 말
  - 붙들 수 없는 말
  lexicon: Crum; Layton
  rationale: 감각적·인식론적 긴장을 유지하기 위해 ‘이해할 수 없는’보다 ‘붙잡힐 수 없는’으로 옮겨, 그리스어/콥트의 ‘파악·포착’ 이미지를 보존했습니다.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ / ⲙⲡⲁⲓ
  english_pob_choice: the sign of this
  chosen_korean: 이것의 표징
  alternatives_korean:
  - 이것의 표지
  - 이것의 징표
  lexicon: Greek loanword σημεῖον via Crum
  rationale: ‘sign’의 semiotic 범위를 살리되, 종교적 전통어 ‘표징’이 원문의 추상적 자기지시와 가장 잘 맞아 ‘이것의 표징’으로 정했습니다.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  english_pob_choice: the manifestation
  chosen_korean: 드러남
  alternatives_korean:
  - 현현
  - 계시
  lexicon: Crum
  rationale: 외향적 ‘드러나 보임’의 뜻을 간결하게 살리기 위해 ‘드러남’으로 옮겼고, ‘계시’는 기독교적 전문용어의 부담이 있어 피했습니다.
theological_decisions:
- issue: 다중 자기동일화의 문체
  chosen_reading: 원문의 연쇄적 자기선언을 한국어에서도 단정한 현재형 자기동일화로 유지했습니다.
  alternative_readings:
  - 비유적 서술로 완화
  - 설명적 문장으로 풀어쓰기
  rationale: 이 단락은 설명보다 선언의 힘이 핵심이므로, 한국어에서도 반복되는 ‘나는 …입니다’ 구조를 유지해 수사적 압력을 보존했습니다.
  doctrine_reference: Thunder, Perfect Mind의 수사적 자기동일화 구조
- issue: ‘manifestation’의 번역 강도
  chosen_reading: ‘드러남’으로 번역해 신비주의적 현현성을 남기되, 기독교 교리어로 고정하지 않았습니다.
  alternative_readings:
  - 현현
  - 계시
  rationale: 본문은 원천 자체가 후대 정통 교리어보다 더 넓은 종교언어를 사용하므로, 특정 교리 범주로 협소화하지 않는 것이 더 정직합니다.
  doctrine_reference: 원문 어휘의 비정통/초교파적 수사성
