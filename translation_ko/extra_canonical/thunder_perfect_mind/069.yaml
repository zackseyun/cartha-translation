  lexicon: Crum; Greek loanword (nous)
  rationale: 영어 POB의 mind를 그대로 옮기되, 한국어에서 ‘지성’이 인격적 자기진술과 인지 능력을 함께 살리면서도 단순한 감정적 ‘마음’보다 원문에 가깝습니다.
