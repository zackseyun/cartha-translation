  lexicon: Crum; Greek loanword (anapausis)
  rationale: 문맥상 단순한 휴식보다 존재론적·영적 ‘rest’의 울림이 강해 ‘안식’이 가장 자연스럽고 격조가 있습니다.
- source_word: ⲡⲥⲟⲟⲩⲛ
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
