- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  english_pob_choice: the place of the gods
  chosen_korean: 신들의 자리
  alternatives_korean:
  - 신들의 곳
  - 신들의 장소
  - 신들의 거처
  lexicon: Crum; Greek loanword (theos)
  rationale: 단순한 ‘place’보다 제의적·거주적 뉘앙스를 살리기 위해 ‘자리’를 택했고, 영어 POB의 plural ‘gods’를 반영해 ‘신들’로 옮겼습니다.
