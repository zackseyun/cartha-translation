  rationale: 이 문장은 내용 전달보다 자기 계시의 리듬이 핵심이므로, 반복적인 1인칭 직설을 유지하는 편이 원문의 힘을 더 잘 보존합니다.
  doctrine_reference: textual rhetoric / source-form preservation
