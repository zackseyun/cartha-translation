  - 정신
  - 생각
  lexicon: Crum; Greek loanword (nous)
  rationale: 영어 POB의 mind를 그대로 옮기되, 한국어에서 ‘지성’이 인격적 자기진술과 인지 능력을 함께 살리면서도 단순한 감정적 ‘마음’보다 원문에 가깝습니다.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  english_pob_choice: rest
  chosen_korean: 안식
  alternatives_korean:
  - 쉼
  - 휴식
  - 휴안
  lexicon: Crum; Greek loanword (anapausis)
  rationale: 문맥상 단순한 휴식보다 존재론적·영적 ‘rest’의 울림이 강해 ‘안식’이 가장 자연스럽고 격조가 있습니다.
- source_word: ⲡⲥⲟⲟⲩⲛ
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 이해
  - 지성
  lexicon: Crum
  rationale: 명사적 용법이므로 ‘앎’보다 문장 균형이 좋은 ‘지식’을 택했습니다.
- source_word: ⲁϣⲓⲛⲉ / ⲛⲛⲉⲧϣⲓⲛⲉ
  english_pob_choice: seeking / those who seek me
  chosen_korean: 찾음 / 나를 찾는 자들
  alternatives_korean:
  - 구함 / 나를 구하는 자들
  - 찾아 구함 / 나를 찾아 구하는 자들
  lexicon: Crum
  rationale: OCR의 ⲅⲓⲛⲉ가 아니라 ϣⲓⲛⲉ 계열의 ‘seek’로 읽는 해석을 따라, POB의 seeking을 한국어 ‘찾음’으로 옮겨 반복 구조를 살렸습니다.
- source_word: ⲟⲩⲁϩⲥⲁϩⲛⲉ
  english_pob_choice: command
  chosen_korean: 명령
  alternatives_korean:
  - 지시
  - 분부
  - 권위
  lexicon: Crum
  rationale: 영어 POB의 documented sense가 ‘command’이므로, 원문의 통제/지시 의미를 직설적으로 드러내는 ‘명령’이 가장 적합합니다.
- source_word: ⲧⲥⲙⲏ
  english_pob_choice: voice
  chosen_korean: 목소리
  alternatives_korean:
  - 음성
  - 소리
  - 말
  lexicon: Crum
  rationale: ⲥⲙⲏ는 ‘voice’이므로 ‘목소리’로 옮겨 반복되는 음성의 층위를 살렸습니다.
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  english_pob_choice: the place of the gods
  chosen_korean: 신들의 자리
  alternatives_korean:
  - 신들의 곳
  - 신들의 장소
  - 신들의 거처
  lexicon: Crum; Greek loanword (theos)
  rationale: 단순한 ‘place’보다 제의적·거주적 뉘앙스를 살리기 위해 ‘자리’를 택했고, 영어 POB의 plural ‘gods’를 반영해 ‘신들’로 옮겼습니다.
