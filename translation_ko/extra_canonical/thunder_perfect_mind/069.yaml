  lexicon: Crum
  rationale: 영어 POB의 documented sense가 ‘command’이므로, 원문의 통제/지시 의미를 직설적으로 드러내는 ‘명령’이 가장 적합합니다.
- source_word: ⲧⲥⲙⲏ
  english_pob_choice: voice
