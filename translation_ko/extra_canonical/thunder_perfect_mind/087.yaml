translation:
  language: ko
  text: '나는 모든 존재에게 받아들여지는 듣기[a]이며,


    나는 [말해져야 할][b] 말입니다.


    그들을 믿으십시오. 나는 말하기를 위한 당신의 [부름][c]이며, 말의 침묵은 크니—


    분노 가운데서 나를 들으십시오[a][d][c][b], 그리고 [...] [d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲛⲟⲩⲟⲛ은 ‘존재하는 자들/존재들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ⲉⲧⲉ ⲙⲁⲧϣⲉ의 형태와 독해가 불확실하여, ‘말해져야 할’로 조심스럽게 옮겼습니다.
    reason: textual_variant
  - marker: c
    text: ⲧⲉⲕⲱ는 OCR상 불확실하여, ‘부름’으로 번역한 해석적 처리입니다. ‘음성’, ‘목소리’ 등으로도 읽힐 수 있습니다.
    reason: textual_variant
  - marker: d
    text: ⲛⲧⲉ로 끝나므로, 뒤에 이어질 속격 구문이 다음 줄에 계속됩니다.
    reason: source_note
