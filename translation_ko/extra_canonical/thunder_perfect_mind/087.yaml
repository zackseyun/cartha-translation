  - marker: b
    text: The OCR sequence ⲉⲧⲉ ⲙⲁⲧϣⲉ is uncertain. If the verb is ⲧϣⲉ 'to ask/request', the sense could be 'the speech that is requested.'
    reason: alignment_note
  - marker: c
    text: ⲧⲉⲕⲱ is likely corrupt or misread; possibilities include 'your ear' (ⲧⲉⲕϣⲉ) or a term for 'voice.' 'Call' is a cautious thematic rendering pending better text.
