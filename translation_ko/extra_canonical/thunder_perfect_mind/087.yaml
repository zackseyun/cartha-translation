theological_decisions:
- issue: ‘listen to me in anger’의 정조
  chosen_reading: 화자의 말을 온유하게 듣는 요청이 아니라, 분노라는 격렬한 정서 상태 안에서의 청취를 명령하는 표현으로 보존했습니다.
  alternative_readings:
  - ‘크게 소리내어 들으라’는 식의 완화
  - 단순한 감정 배경 묘사
  rationale: 어휘적으로 ϭⲱⲛ은 분노/진노를 가리키므로, 원문의 긴장감을 약화시키지 않도록 정서적 강도를 유지했습니다.
  doctrine_reference: source text literary-theological tension
- issue: ‘I am…’ 연속 자가 계시의 화법
  chosen_reading: 반복되는 ‘나는…’ 구조를 그대로 살려, 신비문학적 자가 계시의 권위와 리듬을 유지했습니다.
  alternative_readings:
  - 서술형으로 평탄화
  - 설명체로 재구성
  rationale: 원문의 자기선언적 수사를 보존하는 것이 핵심이므로, 해설적 재진술을 피했습니다.
  doctrine_reference: source text literary form
