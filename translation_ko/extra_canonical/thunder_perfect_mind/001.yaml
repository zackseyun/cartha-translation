  - 나를 찾는 이들 가운데서 저를 발견했습니다
  lexicon: Coptic ⲁⲓϭⲓⲛⲉ, ⲛⲉⲧϣⲓⲛⲉ
  rationale: Coptic의 결과적·수동적 뉘앙스를 살려 ‘발견되었습니다’로 옮겼고, 병렬 구조상 주체를 흐리지 않도록 간결하게 처리했습니다.
