  lexicon: Coptic ⲙⲉⲉⲩⲉ
  rationale: 단순한 생각보다 지속적이고 내적인 사유를 나타내므로 ‘깊이 생각하다’가 ‘meditate’의 결을 가장 무리 없이 반영합니다.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  english_pob_choice: I was found among those who seek me
