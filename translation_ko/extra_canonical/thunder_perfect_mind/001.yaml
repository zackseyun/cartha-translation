  lexicon: Coptic ⲧⲃⲣⲟⲛⲧⲏ / Greek βροντή, νοῦς, τέλειος
  rationale: 제목의 이질감과 병렬성을 살리기 위해 직역에 가깝게 옮겼고, ⲛⲟⲩⲥ는 한국어에서 ‘정신’보다 덜 추상적인 ‘마음’이 시적 호응을 더 자연스럽게 보여 줍니다.
- source_word: ⲁⲛⲟⲕ ⲉⲃ[ⲟⲗ]
  english_pob_choice: I was sent forth
  chosen_korean: 나는 권능으로부터 보내어졌고
  alternatives_korean:
  - 나는 권능에서 나왔고
  - 나는 권능으로부터 파견되었고
  lexicon: Coptic ⲧⲁⲛⲧⲁⲟⲩⲟⲉⲓ ... ⲉⲃⲟⲗ
  rationale: 수동적 파송의 뜻을 드러내기 위해 ‘보내어지다’를 택했고, 출처를 나타내는 from에는 전승상 ‘권능’이 자연스럽습니다.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  english_pob_choice: those who meditate on me
  chosen_korean: 나를 깊이 생각하는 이들
  alternatives_korean:
