base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/090.yaml
  text: 'Give heed to me in gentleness.[a]

    I am the one who remains upon the face of the earth,[b]

    and I am the one who is cast off the face of the earth.[c]

    I am the preparation of every person.[d][e][f][g]'
  footnotes:
  - marker: a
    text: 'Or: ‘in meekness.’ The noun ⲙⲏϣⲉ commonly denotes meekness/gentleness.'
    reason: lexical_alternative
  - marker: b
    text: The noun ⲧⲁϣϭⲏⲗ is taken as a substantivized quality, ‘steadfast/abiding (one).’ Alternatives include ‘the abiding one’ or abstract ‘steadfastness.’
    reason: lexical_alternative
  - marker: c
    text: ⲛⲟⲩϫⲉ primarily ‘loosen, unbind’; hence ‘loosen it off.’ ‘Dissolve’ or ‘destroy’ are interpretive alternatives depending on context.
    reason: lexical_alternative
  - marker: d
    text: ⲥⲟⲃⲧⲉ can carry shades from ‘fear’ to ‘terror/dread.’ ‘Fear’ here leaves the valence open.
    reason: lexical_alternative
  - marker: e
    text: Or 'the steadfast one dwelling'.
    reason: previous_rendering
  - marker: f
    text: Or 'who loosens it off'.
    reason: previous_rendering
  - marker: g
    text: Or 'the fear'.
    reason: previous_rendering
translation:
  language: ko
  text: '온유함으로 내게 주의를 기울이십시오.[a]

    나는 땅의 얼굴 위에 남아 있는 자이며,[b]

    나는 땅의 얼굴 위에서 떼어져 나가는 자입니다.[c]

    나는 모든 사람의 준비입니다.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ⲙⲏϣⲉ는 ‘온유함/온순함’의 뜻 범위를 가지므로, ‘온유함’이 가장 무난한 번역이지만 ‘부드러움’도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 분사 표현은 ‘남아 있는 자’ 또는 ‘머무는 자’로도 옮길 수 있으나, 본문 대조를 위해 ‘남아 있는 자’를 택했습니다.
    reason: lexical_alternative
  - marker: c
    text: 수정된 Coptic은 ‘풀어 놓는’이 아니라 ‘떼어 내다/던져 버리다’의 계열이므로, 여기서는 더 중립적인 ‘떼어져 나가는 자’로 옮겼습니다.
    reason: source_note
  - marker: d
    text: Coptic ⲥⲟⲃⲧⲉ는 ‘준비’의 뜻으로 읽는 것이 옳으며, ‘두려움’으로 읽는 번역은 원문과 맞지 않습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  english_pob_choice: Give heed to me
  chosen_korean: 내게 주의를 기울이십시오
  alternatives_korean:
  - 내게 귀를 기울이십시오
  - 내게서 가르침을 받으십시오
  lexicon: Crum; Layton
  rationale: 직역보다 한국어로는 ‘주의를 기울이다’가 명령형의 호소를 자연스럽게 살리며, 수신자에게 향한 직접적 권고를 유지합니다.
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ
  english_pob_choice: in gentleness
  chosen_korean: 온유함으로
  alternatives_korean:
  - 부드러움으로
  - 온유 안에서
  lexicon: Crum s.v. ⲙⲏϣⲉ
  rationale: ⲙⲏϣⲉ의 기본 의미 범위인 meekness/gentleness를 반영해 교회적 용례와도 접점이 있는 ‘온유함’으로 옮겼습니다.
- source_word: ⲧⲥⲟⲃⲧⲉ
  english_pob_choice: the preparation
  chosen_korean: 준비
  alternatives_korean:
  - 예비
  - 준비됨
  lexicon: Crum s.v. ⲥⲟⲃⲧⲉ
  rationale: 수정된 원문과 영어 POB의 ‘preparation’을 따라, 추상명사로서 가장 직접적인 ‘준비’를 선택했습니다.
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  english_pob_choice: of every person
  chosen_korean: 모든 사람의
  alternatives_korean:
  - 모든 인류의
  - 각 사람의
  lexicon: Crum s.v. ⲣⲱⲙⲉ
  rationale: ⲣⲱⲙⲉ를 성별 제한 없이 ‘사람’으로 옮겨, 분배적 의미인 ⲛⲓⲙ의 ‘every’를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 직접 화법의 명령형 톤
  chosen_reading: 본문의 ‘Give heed to me’는 청자를 향한 직접 권고이므로 공손한 명령형 ‘-십시오’로 옮겼습니다.
  alternative_readings:
  - 내게 주의를 기울이세요
  - 내 말을 들으십시오
  rationale: 시적·계시적 수사에서 한국어 합쇼체 명령형은 원문의 호소력을 유지하면서도 문체를 지나치게 낮추지 않습니다.
  doctrine_reference: 문체/화행 선택
- issue: ‘remains / is cast off’의 대조
  chosen_reading: ‘남아 있는 자’와 ‘떼어져 나가는 자’로 대조를 살려, 체류와 배제의 긴장을 유지했습니다.
  alternative_readings:
  - 머무는 자 / 버려지는 자
  - 남는 자 / 내던져지는 자
  rationale: 원문의 병렬적 대비를 훼손하지 않으면서도, 물리적·실존적 긴장을 한국어로 드러내기 위한 선택입니다.
  doctrine_reference: 수사 구조 보존
