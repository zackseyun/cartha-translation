  verdict: revise
  source_fidelity: 첫 행의 ‘내게 주의를 기울이십시오’와 ‘온유함으로’는 명령과 방식 표현을 잘 반영합니다. 다만 ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ ⲉⲃⲟⲗ은 ‘떼어져 나가는’보다 ‘내던져지는/내쫓기는’의 수동·배제적 의미가 더 분명하며, 영어 POB의 ‘is cast off’ 및 확정된 교정 이력에도 부합합니다. OCR 원문에는 이미 알려진 오독이 있으므로, 확정된 본문 교정에 따라 판단했습니다.
  naturalness: 합쇼체와 병렬 구조는 자연스럽습니다. 그러나 ‘땅의 얼굴 위에’는 한국어 시문에서 다소 직역투이므로 ‘땅 위에’가 더 자연스럽습니다. ‘준비’는 의미상 맞지만 ‘모든 사람의 준비’는 한국어에서 다소 불투명하므로, 원문의 낯선 추상적 술어를 보존하되 문장 전체는 간결하게 유지하는 편이 좋습니다.
  terminology: ‘온유함’, ‘모든 사람’, ‘준비’는 적절합니다. ‘떼어져 나가는 자’는 원문의 수동적 ‘cast off’와 자발적으로 떠나는 듯한 한국어 표현 사이에 차이가 있어 ‘내던져지는 자’로 고쳐야 합니다. 각주 c의 ‘수정된 Coptic’이라는 표현은 독자에게 불명확하므로, OCR과 확정 독법의 관계를 명료하게 설명해야 합니다.
