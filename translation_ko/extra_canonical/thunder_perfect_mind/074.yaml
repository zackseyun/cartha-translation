  lexicon: Crum, s.v. ϣⲟⲟⲡ; standard Sahidic prepositional form
  rationale: 직역하면 ‘존재하다/있다’이므로 단순한 동반보다 존재 상태를 살린 ‘함께 있는 자들’로 옮겼습니다.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
