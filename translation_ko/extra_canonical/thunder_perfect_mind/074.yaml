review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. ⲛⲓϩⲓⲟⲙⲉ는 ‘가난한 사람들’이 아니라 ‘여자들/여인들’이며, 첫 동사 ϣⲟⲟⲡ는 이 문맥에서 명령형 ‘있으십시오/함께하십시오’로 보입니다. 또한 ⲙⲙⲟⲥ는 여성 단수 목적어로 읽히므로 ‘그들을’이라는 주석은 원문과 맞지 않습니다. ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ 및 이어지는 관계절들은 ‘존귀한 이’, ‘그들이 찬양하는 이’, ‘그들이 업신여기는 이’라는 병렬 자기진술로 옮기는 것이 적절합니다.
  naturalness: 현 번역의 첫 문장 ‘나와 함께 있는 자들과, 그리고 안에 있는 여자들과.’는 한국어 문장으로 미완성이며, 원문의 호소/명령조도 사라집니다. ‘나와 함께 있으십시오, 안에 있는 여자들이여.’로 하면 호격과 합쇼체를 자연스럽게 살릴 수 있습니다. ‘멸시하며 경멸하는’은 의미가 중복되므로 ‘업신여기는’으로 간결하게 처리했습니다.
  terminology: ‘존귀한 이’, ‘찬양하는 이’, ‘업신여기는 이’는 원문의 반복되는 여성형 계사구문과 관계절의 대조를 보존합니다. ‘여자들’은 현대 표준어로 가능하나 호격 문맥에서는 ‘여인들이여’가 더 자연스럽고 문체상 안정적입니다. 다만 ⲛ̄ϩⲏⲧ의 보어는 발췌문만으로 확정하기 어려우므로 ‘안에’로 남기고 주석에서 불확실성을 밝혔습니다.
  issues:
  - severity: high
    issue: 첫 문장이 명령형을 명사구로 바꾸어 미완성 문장이 되었습니다.
    rationale: ϣⲟⲟⲡ는 문두에서 ‘있으십시오/함께하십시오’라는 호소로 읽는 것이 자연스럽습니다. ‘나와 함께 있는 자들’은 이 동사의 문법적 기능을 보존하지 못합니다.
  - severity: high
    issue: 각주 c가 ⲙⲙⲟⲥ를 복수 목적어로 설명합니다.
    rationale: 해당 형태는 여성 단수 목적어로 읽히며, 앞의 여성 화자 곧 ‘나’를 가리키는 것이 문법적으로 가장 직접적입니다.
  - severity: medium
    issue: 각주 d의 ‘열거의 종결부’ 설명은 ϩⲛ ⲟⲩϣⲱⲥ를 반영하지 못합니다.
    rationale: ϩⲛ ⲟⲩϣⲱⲥ는 ‘업신여기며/조롱하여’라는 멸시의 양태를 나타내는 것으로 읽는 편이 적절합니다.
  - severity: low
    issue: ‘멸시하며 경멸하는’은 중복적입니다.
    rationale: καταφρονέω 계열의 뜻은 ‘업신여기다’ 하나로도 자연스럽고 충분히 전달됩니다.
  revised_text: '나와 함께 있으십시오, 안에 있는 여인들이여.[a]


