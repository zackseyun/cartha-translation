  yaml_path: translation/extra_canonical/thunder_perfect_mind/074.yaml
  text: 'those who exist with me[a], and the poor.

    What is within, in the heart—I am she.

    I am the honored one,

    and the one whom they praise,

    and the one whom they despise in scorn[e][d][c][b].

    I am'
  footnotes:
  - marker: a
    text: The Coptic ⲧⲁⲉⲓⲏⲟⲩ here is uncertain; ‘my appearance’ is tentative. Alternatives include ‘my image,’ ‘my thought,’ or even ‘my house.’ Context with ‘face’ (ⲣⲟⲥ) motivates a visual gloss.
    reason: lexical_alternative
  - marker: b
    text: ⲥⲙⲟⲟⲩ can mean ‘bless’ or ‘praise,’ and sometimes ‘name.’ ‘Praise’ is chosen to form a clear antithesis with ‘despise.’
    reason: lexical_alternative
  - marker: c
    text: The pronoun ⲙⲙⲟⲥ (‘them’) likely refers back to ‘the poor,’ but the antecedent is not explicit in the excerpt.
    reason: alignment_note
  - marker: d
    text: ϩⲛ ⲟⲩϣⲱⲥ ⲁⲛⲟⲕ could also be taken as ‘in a voice, It is I’ or attached to the following line in some editions.
    reason: textual_variant
  - marker: e
    text: 'Or ''Be present with me, and with the poor.\nWhat is within, in the heart—I am she.\nMy appearance[a]—you praise[b] the face,\nand you despise them[c],\nwith a voice: “I am.”[d]''.'
    reason: previous_rendering
translation:
  language: ko
  text: '나와 함께 있는 자들과[a], 그리고 안에 있는 여자들과.


    나는 존귀한 이입니다.


    그리고 그들이 찬양하는 이이며,


    그들이 멸시하며 경멸하는 이입니다[b][c][d].


    나는'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문과 검토본의 대조상 첫 구는 ‘나와 함께 있는 자들’로 읽는 것이 가장 안전합니다.
    reason: source_note
  - marker: b
    text: Coptic ⲥⲙⲟⲩ는 ‘찬양하다/축복하다’가 가능하며, 여기서는 ‘찬양하다’로 택했습니다.
    reason: lexical_alternative
  - marker: c
    text: 대상 대명사는 앞의 집단을 가리키는 것으로 보이지만, 정확한 선행사는 문맥상 약간 열려 있습니다.
    reason: source_note
  - marker: d
    text: 이 대목은 열거의 종결부로서 뒤의 ‘나는’과 연결될 수 있습니다.
    reason: textual_variant
