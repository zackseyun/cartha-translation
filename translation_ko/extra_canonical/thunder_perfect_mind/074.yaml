  chosen_korean: 여자들
  alternatives_korean:
  - 여인들
  - 여자들(혹은 여인들)
  lexicon: Coptic lexeme as revised in applied review; common noun for women
  rationale: 최신 검토가 ⲛⲓϩⲓⲟⲙⲉ를 ‘여자들’로 복원하므로, POB의 수정된 원문 판단을 따라 여성 집단으로 옮겼습니다.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  english_pob_choice: the one whom they praise
  chosen_korean: 그들이 찬양하는 이
  alternatives_korean:
