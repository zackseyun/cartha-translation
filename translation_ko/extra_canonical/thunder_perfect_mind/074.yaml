  lexicon: Loan from Greek καταφρονέω
  rationale: 그리스어 차용어의 강한 경시 의미를 살리되, 한국어에서 중복을 피하지 않고 누적된 모욕감을 드러내도록 ‘멸시하며 경멸하는’으로 옮겼습니다.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  english_pob_choice: I am she
  chosen_korean: 나는 존귀한 이입니다
  alternatives_korean:
