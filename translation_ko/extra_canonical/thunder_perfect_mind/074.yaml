  lexicon: Crum, s.v. ⲥⲙⲟⲟⲩ
  rationale: ⲥⲙⲟⲩ는 ‘축복하다/찬양하다’가 가능하지만, 여기서는 뒤의 ‘멸시하다’와 강한 대조를 이루는 ‘찬양하다’가 가장 자연스럽습니다.
- source_word: ⲕⲁⲧⲁⲫⲣⲟ
  english_pob_choice: despise in scorn
  chosen_korean: 멸시하며 경멸하는
  alternatives_korean:
