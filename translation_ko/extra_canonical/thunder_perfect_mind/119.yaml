  source_fidelity: 현 초안은 저본의 실제 콥트어와 맞지 않습니다. 특히 ⲟⲩⲉⲓϣ는 ‘보십시오’라는 명령이 아니라 ‘때/시간’을 뜻하며, 후반부의 ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ ⲛⲥⲉⲱⲛϩ ⲁⲩⲱ ⲛⲥⲉⲧⲙ…은 ‘그들이 그곳에서 나를 찾고, 살며, 더 이상 죽지 않을 것이다’라는 미래 서술입니다. OCR의 중간 어형은 불확실하지만, 문맥상 ‘그들의 궁전/거처’로 읽힐 가능성이 높습니다.
  naturalness: 수정문은 현대 표준어 합쇼체의 자연스러운 미래 서술로 옮겼습니다. ‘궁전’은 OCR 및 어휘 판독의 불확실성을 각주로 밝혀 단정성을 피했습니다.
  terminology: ‘살다’와 ‘죽다’는 원문의 직접적 대립을 보존했습니다. 저본에 없는 ‘그의 말’, ‘글들’, ‘완성된’ 및 해당 각주는 삭제해야 합니다.
  issues:
