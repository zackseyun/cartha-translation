    rationale: ⲉⲡⲟⲩⲕⲏⲛⲏ ⲧⲏⲣⲓⲟⲛ은 문맥상 ‘그들의 궁전/거처’로 보이나, OCR만으로는 확정하기 어렵습니다. 각주로 판독 불확실성을 표시하는 것이 안전합니다.
