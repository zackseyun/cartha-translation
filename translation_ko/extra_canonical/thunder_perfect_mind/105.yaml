    나는…'
  rationale: ‘형통한 자들아’를 삭제하고, 현행 감사 기록이 확정한 ‘내쫓다 / 패배하다 / 내 말을 배우다’의 순서를 반영했습니다. 기존 각주는 본문상 잘못된 위치에 붙어 있고 이미 채택되지 않은 어휘 설명이므로, 첫 구절의 실제 판독 불확실성을 설명하는 각주로 교체했습니다. 마지막의 줄임표는 다음 범위로 이어지는 미완결 문장을 보존합니다.
