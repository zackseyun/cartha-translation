  source_fidelity: 현 초안의 ‘당신들 가운데 형통한 자들아’는 제시된 영어 POB의 현행 본문(‘cast out from yourselves’) 및 그 감사 기록의 교정 방향과 일치하지 않습니다. 또한 ⲧⲉⲧⲛⲣⲥⲱⲧⲉ와 ϫⲓ-ⲥⲃⲱ에 대해서는 각각 ‘패배합니다’와 ‘내 말을 배우십시오’가 적절합니다. 첫 구절의 OCR 판독·분절에는 불확실성이 남으므로, 화자가 청중에게서 내쫓겼다는 채택 읽기를 각주로 한정해 밝혔습니다.
  naturalness: ‘당신들 가운데 형통한 자들아’는 문맥상 어울리지 않으며, ‘나를 바라봅니다—…—그리고 패배합니다’라는 병렬은 원문의 대조적이고 시적인 직접 호소를 자연스럽게 살립니다. ‘듣는 이들이여’와 ‘나를 아는 이들이여’는 현대 표준어의 격식 있는 문학적 호격으로, 공손 명령형 ‘-십시오’와 조화를 이룹니다.
  terminology: ‘배우십시오’는 ϫⲓ-ⲥⲃⲱ(가르침을 받다/배우다)를 정확히 반영합니다. ‘나는…’은 뒤 범위로 이어지는 ⲁⲛⲟⲕ ⲡⲉ의 미완결 자기선언을 보존하며, ‘나는 그분이다’처럼 보충어를 덧붙이지 않습니다.
