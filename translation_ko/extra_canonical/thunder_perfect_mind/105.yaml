base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/105.yaml
  text: 'You look on me[a], cast out from yourselves,

    and you are defeated.

    Listen to me, you hearers,

    and learn my words,

    you who know me[g][f][e][d][c][b].

    I am...'
  footnotes:
  - marker: a
    text: ⲭⲓⲥⲃⲱ can be rendered ‘whisper against’ or ‘revile,’ highlighting secretive or abusive speech.
    reason: lexical_alternative
  - marker: b
    text: ⲛⲟⲩⲟⲛϩ ⲉⲃⲟⲗ is taken as an adverbial ‘in the open’; the exact idiomatic value is uncertain in this line’s segmentation.
    reason: alignment_note
  - marker: c
    text: The public/private contrast (‘in the open’/‘in your soul’) is a recurrent device in Thunder, pairing overt acknowledgment with hidden opposition.
    reason: parallelism_note
  - marker: d
    text: Or 'you who prosper in the open'.
    reason: previous_rendering
  - marker: e
    text: Or 'and you cry out.'.
    reason: previous_rendering
  - marker: f
    text: Or 'and you slander in your soul.'.
    reason: previous_rendering
  - marker: g
    text: 'Or ''Those who know me: I am the one.''.'
    reason: previous_rendering
translation:
  language: ko
  text: '당신은 나를 바라봅니다[a] — 당신들 가운데 형통한 자들아 —

    그리고 당신들은 패배합니다.

    나를 들으십시오, 듣는 자들아,

    그리고 내 말을 배우십시오,

    나를 아는 자들아.

    나는…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲭⲓⲥⲃⲱ는 초안의 ‘속삭이다/중상하다’보다 교정본의 ‘배우다’가 더 적합한 읽기입니다.
    reason: textual_variant
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟⲓ
  english_pob_choice: you look on me
  chosen_korean: 당신은 나를 바라봅니다
  alternatives_korean:
  - 당신은 나를 봅니다
  - 당신은 나를 보십니다
  lexicon: Crum; Layton
  rationale: 직접적인 시선을 살리되, 한국어에서 자연스러운 문학적 동사인 ‘바라봅니다’를 택해 ‘look on me’의 응시감을 유지했습니다.
- source_word: ⲙⲡⲉⲧⲛⲥⲁⲛϩⲟⲩ
  english_pob_choice: you who prosper
  chosen_korean: 당신들 가운데 형통한 자들아
  alternatives_korean:
  - 당신들 가운데 성공한 자들아
  - 당신들 가운데 이익을 얻은 자들아
  lexicon: Coptic context-driven; Crum
  rationale: 본문의 상대적 호칭을 살리면서, EN POB의 ‘prosper’에 맞춰 ‘형통한’으로 옮겨 대조 구조를 유지했습니다.
- source_word: ⲧⲉⲧⲛⲣⲥⲱⲧⲉ
  english_pob_choice: you are defeated
  chosen_korean: 당신들은 패배합니다
  alternatives_korean:
  - 당신들은 실패합니다
  - 당신들은 굴복합니다
  lexicon: Crum 363a
  rationale: 교정된 읽기대로 ‘패배하다/실패하다’의 의미를 반영해, 원문의 대조적 선언을 간결하게 살렸습니다.
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  english_pob_choice: listen to me
  chosen_korean: 나를 들으십시오
  alternatives_korean:
  - 나에게 귀를 기울이십시오
  - 내 말을 들으십시오
  lexicon: Standard Sahidic usage
  rationale: 명령형에 가까운 청유적 호소를 한국어 공손 명령으로 옮겨, 시적 호흡을 유지했습니다.
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  english_pob_choice: you who know me
  chosen_korean: 나를 아는 자들아
  alternatives_korean:
  - 나를 아는 이들아
  - 나를 아는 당신들아
  lexicon: Standard Sahidic
  rationale: 호격적 병행을 살리기 위해 ‘자들아’로 옮겼으며, 후속 절 ‘나는…’과의 연결을 보존했습니다.
theological_decisions:
- issue: 연설체의 직설성과 호격 처리
  chosen_reading: 화자의 자기 선언과 청중 호칭을 시적 직설로 유지하되, 한국어에서는 공손 명령형과 호격 ‘-자들아’를 사용했습니다.
  alternative_readings:
  - 문장형 서술로 완화하여 자연스러운 산문체로 옮길 수 있음
  - 전통 교회체 어미로 격상할 수 있음
  rationale: 이 단락은 수신자에게 직접 말을 거는 시적 선언문이므로, 원문의 긴장과 대조를 흐리지 않도록 직설성을 유지하는 편이 더 충실합니다.
  doctrine_reference: source-poetics
- issue: ‘learn my words’의 의미 유지
  chosen_reading: ‘그리고 내 말을 배우십시오’로 옮겨, 단순한 정보 전달이 아니라 내적 수용과 습득을 강조했습니다.
  alternative_readings:
  - ‘내 말을 들으십시오’
  - ‘내 말을 익히십시오’
  rationale: 교정본이 ‘learn my words’를 지지하므로, 청각적 경청보다 학습·수용의 의미가 드러나도록 번역했습니다.
  doctrine_reference: source-criticism
