    rationale: 각주는 ‘바라봅니다’에 붙어 있으나 내용은 ϫⲓⲥⲃⲱ의 ‘배우다’에 관한 것입니다. 해당 각주는 삭제하고, 필요한 판독상의 불확실성은 첫 구절에 정확히 연결해야 합니다.
  - severity: low
