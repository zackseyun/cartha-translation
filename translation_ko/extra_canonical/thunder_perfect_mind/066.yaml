  yaml_path: translation/extra_canonical/thunder_perfect_mind/066.yaml
  text: And you embrace me[a]. You despised me, and you saw me[e][d][c][b]. Do not scatter the first things [...] Do not ponder [...] your limbs [...]
  footnotes:
  - marker: a
    text: ⲧⲁⲉⲓⲟ can also be rendered “receive” or “welcome,” a recurring imperative in Thunder. “Embrace” is chosen for bodily resonance.
    reason: lexical_alternative
  - marker: b
    text: The OCR includes ⲙⲡⲣⲡⲟⲩϩⲧ (“do not fear”) and ⲛⲛϣⲟⲣⲡ (likely “first things/beginnings”), but the mapping to this sub-unit is uncertain; these are not carried into the main line pending firmer alignment.
    reason: alignment_note
  - marker: c
    text: ⲗⲁⲁⲧⲉ may also be translated “members.” “Limbs” keeps the corporeal edge felt in this poem’s body imagery.
    reason: lexical_alternative
  - marker: d
    text: The pair “shamelessness // shame” is preserved to keep the poem’s paradox rather than smoothing it into a single ethical stance.
    reason: parallelism_note
  - marker: e
    text: Or 'And you, embrace me without shame; and from shamelessness — and from shame — put my limbs to shame within you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희는 나를 존중하였습니다[a]. 너희는 나를 멸시하였고, 나를 보았습니다. 첫 것들을 흩뜨리지 마십시오[…] 생각하지 마십시오[…] 너희의 지체[…]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲧⲁⲉⲓⲟ는 영어 POB의 최신 정정처럼 ‘honor’ 쪽 의미를 반영할 수 있으나, 본문 맥락에서 한국어는 ‘존중하다’가 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲟ
  english_pob_choice: embrace / honor
  chosen_korean: 존중하다
  alternatives_korean:
  - 맞이하다
  - 받아들이다
  - 존중하다
  lexicon: Crum 405a
  rationale: 이 단어는 영어 POB의 이전 ‘embrace’보다 최신 정정에서 ‘honor’로 조정되었고, 한국어에서는 관계적·사회적 뉘앙스를 살리면서도 신체적 오해를 피하는 ‘존중하다’가 가장 무난합니다.
- source_word: ⲁⲧⲉⲧⲛϣⲱϥ
  english_pob_choice: you despised me
  chosen_korean: 너희는 나를 멸시하였고
  alternatives_korean:
  - 너희는 나를 경멸하였고
  - 너희는 나를 업신여겼고
  - 너희는 나를 헐뜯었고
  lexicon: Crum 608b
  rationale: 동사의 핵심은 ‘가볍게 여기다/업신여기다’ 계열이므로, 표준어에서 강도를 유지하는 ‘멸시하다’를 선택했습니다.
- source_word: ⲁⲧⲉⲧⲛⲛⲁ
  english_pob_choice: you saw me
  chosen_korean: 나를 보았습니다
  alternatives_korean:
  - 나를 보았습니다
  - 나를 목격하였습니다
  - 나를 알아보았습니다
  lexicon: Coptic OCR / POB revision
  rationale: 개정된 영어 POB가 이 구절을 단순한 시각 인지로 정리하므로, 한국어도 과잉 해석 없이 직접적으로 옮겼습니다.
- source_word: ⲙⲡⲣⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  english_pob_choice: Do not scatter
  chosen_korean: 흩뜨리지 마십시오
  alternatives_korean:
  - 흩어버리지 마십시오
  - 퍼뜨리지 마십시오
  - 흩뜨리지 마십시오
  lexicon: Crum 283a; POB reviewer note
  rationale: 이 표현은 ‘흩다/흩뜨리다’ 계열의 동작 금지를 뜻하므로, 현대 한국어에서 이미지가 분명한 ‘흩뜨리지 마십시오’를 택했습니다.
- source_word: ⲗⲁⲁⲧⲉ
  english_pob_choice: limbs / members
  chosen_korean: 지체
  alternatives_korean:
  - 팔다리
  - 지체
  - 몸의 부분
  lexicon: Crum; Layton
  rationale: 공동번역적 ‘지체’는 몸의 부분을 뜻하면서도 문체를 지나치게 낮추지 않아, 본문의 신체적 긴장을 유지하는 데 적합합니다.
theological_decisions:
- issue: 직설적 명령형의 유지
  chosen_reading: ‘너희는 나를 존중하였습니다’와 ‘~마십시오’의 명령형을 그대로 살려, 화자의 대립과 촉구를 약화시키지 않았습니다.
  alternative_readings:
  - 완곡한 서술형으로 순화
  - 권고문처럼 부드럽게 표현
  rationale: 이 단락은 시적·예언적 대조를 통해 청중의 태도를 드러내므로, 문장의 날카로움을 유지하는 것이 본문 효과에 더 충실합니다.
  doctrine_reference: 문학적·수사학적 보존 원칙
- issue: ‘지체’의 신체-상징성
  chosen_reading: ‘지체’로 옮겨 몸의 부분을 가리키는 동시에, 인간 전체의 분열된 상태를 암시하도록 두었습니다.
  alternative_readings:
  - 단순히 ‘몸’으로 평탄화
  - ‘팔다리’로 구체화
  rationale: 영어 POB가 유지한 육체성의 감각을 한국어에서도 보존하되, 불필요한 해석을 덧붙이지 않기 위함입니다.
  doctrine_reference: 본문 이미지의 보존
