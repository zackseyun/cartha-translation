  lexicon: Crum 608b
  rationale: 동사의 핵심은 ‘가볍게 여기다/업신여기다’ 계열이므로, 표준어에서 강도를 유지하는 ‘멸시하다’를 선택했습니다.
- source_word: ⲁⲧⲉⲧⲛⲛⲁ
  english_pob_choice: you saw me
  chosen_korean: 나를 보았습니다
  alternatives_korean:
