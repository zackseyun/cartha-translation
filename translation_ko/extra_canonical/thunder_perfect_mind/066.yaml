theological_decisions:
- issue: 직설적 명령형의 유지
  chosen_reading: ‘너희는 나를 존중하였습니다’와 ‘~마십시오’의 명령형을 그대로 살려, 화자의 대립과 촉구를 약화시키지 않았습니다.
  alternative_readings:
  - 완곡한 서술형으로 순화
  - 권고문처럼 부드럽게 표현
  rationale: 이 단락은 시적·예언적 대조를 통해 청중의 태도를 드러내므로, 문장의 날카로움을 유지하는 것이 본문 효과에 더 충실합니다.
  doctrine_reference: 문학적·수사학적 보존 원칙
- issue: ‘지체’의 신체-상징성
  chosen_reading: ‘지체’로 옮겨 몸의 부분을 가리키는 동시에, 인간 전체의 분열된 상태를 암시하도록 두었습니다.
  alternative_readings:
  - 단순히 ‘몸’으로 평탄화
  - ‘팔다리’로 구체화
  rationale: 영어 POB가 유지한 육체성의 감각을 한국어에서도 보존하되, 불필요한 해석을 덧붙이지 않기 위함입니다.
  doctrine_reference: 본문 이미지의 보존
