base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/019.yaml
  text: I am the voice whose sound is manifold[a], and the word whose appearance is manifold. I am the utterance of my name. Why, you who hate me, do you love me[g][f][e][d][c][b], and hate those who love me?
  footnotes:
  - marker: a
    text: ⲙⲉⲉⲩⲉ can mean thought, understanding, or counsel; I choose “counsel” here to pair an intellectual force with a ‘staff.’ Some English traditions read “power,” which is less direct to the Coptic.
    reason: lexical_alternative
  - marker: b
    text: “He is my rod when I grow old by day” renders ϩⲣⲟⲟⲩ literally; it may be idiomatic for “as I grow old” or “in old age.” ⲥⲙⲏ here is uncertain in the OCR and could reflect an implement term or be confounded with an age-term.
    reason: alignment_note
  - marker: c
    text: ⲡⲗⲟⲅⲟⲥ is left as “Logos” to preserve resonance; “Word” is a reasonable alternative.
    reason: lexical_alternative
  - marker: d
    text: ⲉⲧⲉ ⲛⲁ ϣⲉ ⲡⲉϥⲉⲓⲛⲉ could be rendered “whatever his will will happen/bring to pass,” with an implicit “for me” supplied by context in some translations.
    reason: alternative_reading
  - marker: e
    text: The closing love/hate sayings often mark a transition to the address-to-audience sections in Thunder; their presence here may reflect a stanza boundary issue in the alignment.
    reason: alignment_note
  - marker: f
    text: The staff/rod pairing forms deliberate parallelism of reciprocal support across life-stages.
    reason: parallelism_note
  - marker: g
    text: Or 'I am the staff of his counsel in his youth; and he is my rod when I grow old by day; and the Logos is what his will shall be; I am the utterance of my name—because of those who hate me, you love me, and you hate those who love me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 소리가 여러 가지인 목소리이며, 모습이 여러 가지인 말입니다. 나는 내 이름의 발화입니다. 왜 나를 미워하는 여러분은 나를 사랑하고, 나를 사랑하는 이들을 미워합니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲧⲉⲥⲙⲏ
  english_pob_choice: voice
  chosen_korean: 목소리
  alternatives_korean:
  - 음성
  - 소리
  lexicon: Crum
  rationale: Coptic ⲥⲙⲏ는 여기서 ‘voice’에 해당하며, 문맥상 말하는 주체의 자기규정이므로 ‘목소리’로 옮겨 자연스러운 현대 한국어를 유지했습니다.
- source_word: ⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  english_pob_choice: manifold sound
  chosen_korean: 소리가 여러 가지인
  alternatives_korean:
  - 다양한 소리를 지닌
  - 여러 갈래의 소리를 내는
  lexicon: Crum
  rationale: 영어 POB가 ‘manifold’로 잡은 중복·다중성을 살려, 소리의 성격을 풀어 ‘소리가 여러 가지인’으로 표현했습니다.
- source_word: ⲡⲗⲟⲅⲟⲥ
  english_pob_choice: word
  chosen_korean: 말
  alternatives_korean:
  - 로고스
  - 말씀
  lexicon: LSJ / Coptic loanword lists
  rationale: 이 문맥의 ⲡⲗⲟⲅⲟⲥ는 철학적 차원을 보존할 수 있으나, 한국어 본문에서는 독자성이 덜한 ‘말’이 ‘utterance’와의 중복을 피하면서도 원뜻을 전달합니다.
- source_word: ⲡⲉϥⲉⲓⲛⲉ
  english_pob_choice: appearance
  chosen_korean: 모습
  alternatives_korean:
  - 겉모양
  - 형상
  lexicon: Crum
  rationale: 외적 현현을 가리키는 표현이므로, 과도한 신학적 해석을 피하는 중립적 현대어 ‘모습’을 선택했습니다.
- source_word: ⲡϣⲁϫⲉ ⲙ̄ ⲡⲁⲣⲁⲛ
  english_pob_choice: the utterance of my name
  chosen_korean: 내 이름의 말
  alternatives_korean:
  - 내 이름의 발화
  - 내 이름의 선포
  lexicon: Crum
  rationale: ⲡϣⲁϫⲉ는 ‘speech/word/utterance’의 범위를 가지므로, 예언적 어조를 살리되 현대 한국어에서 자연스러운 ‘내 이름의 말’로 옮겼습니다.
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  english_pob_choice: Why?
  chosen_korean: 왜
  alternatives_korean:
  - 어찌하여
  - 무슨 까닭으로
  lexicon: Crum
  rationale: applied revision과 Coptic 문법에 따라 이유를 묻는 접속구가 아니라 독립 의문사 ‘Why?’이므로, 본문에 ‘왜’로 반영했습니다.
theological_decisions:
- issue: 대칭 구조와 반전의 수사 유지
  chosen_reading: ‘나를 미워하는 여러분은 나를 사랑하고, 나를 사랑하는 이들을 미워합니다’로 대칭과 역설을 직역에 가깝게 보존했습니다.
  alternative_readings:
  - ‘나를 미워하는 여러분이 오히려 나를 사랑하고…’로 더 풀어쓰기
  rationale: 이 단락의 핵심은 사랑/증오의 역전 구조이므로, 해석을 덧붙여 완화하기보다 원문의 날카로운 역설을 그대로 드러내는 편이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 수사적 역설 보존
- issue: ‘로고스’의 음역 여부
  chosen_reading: 본문에서는 ‘말’로 옮기고, 별도의 음역은 두지 않았습니다.
  alternative_readings:
  - ‘로고스’로 음역하여 철학적 함의를 보존
  - ‘말씀’으로 번역
  rationale: 본 단락에서 ⲡⲗⲟⲅⲟⲥ는 기독교 정경의 특정 용례보다 더 넓은 철학·수사적 개념으로 쓰이므로, 한국어 본문에서는 과도한 신학화 없이 일반어 ‘말’이 가장 안정적입니다.
  doctrine_reference: 지혜/발화 개념의 비정경적 문맥
