  lexicon: Payne Smith
  rationale: 판결적·책임 귀속의 뜻을 살리되, 원문의 반복을 따라 동일한 동사를 천사들에게도 적용했습니다.
theological_decisions:
- issue: 아담의 죄의 결과 범위
  chosen_reading: 아담의 범죄는 개인적 실패에 그치지 않고, 죽음·슬픔·고통·수고·위대함의 저하라는 창조질서 전체의 붕괴로 이어지는 것으로 번역했습니다.
  alternative_readings:
  - 개인의 도덕적 타락으로만 제한하는 읽기
  - 죽음만 강조하고 나머지 후속 결과를 약화하는 읽기
  rationale: 본문은 연속적 결과 목록으로 아담의 행위를 해석하므로, 그 폭을 축소하지 않는 것이 필요합니다.
  doctrine_reference: 창세기 3장 전승, 아담론
