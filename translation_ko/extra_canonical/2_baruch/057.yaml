    reason: previous_rendering
  - marker: g
    text: Or 'a vision of what was to come:'.
    reason: previous_rendering
translation:
  language: ko
  text: '이제 네가 본 바, 바다에서 올라와 이 땅을 덮으려 했던 큰 구름에 대해 들으십시오. 그것은 하늘과 땅의 창조를 만들려고 계획하실 때 전능하신 분께서 만드신 세상의 시작입니다. 그리고 말씀이 그분 앞에서 나오자 세상의 시작이 드러났는데, 매우 작았으며, 그것이 존재하게 될 것으로 정해진 대로 세워졌습니다.


    그리고 구름에서 그것 위로 내려온 첫째 검은 물들은—이것이 첫 사람 아담이 범한 죄책입니다. 그는 죄를 지었을 때, 제때가 아닌 죽음이 일어나게 되었고, 슬픔이 알려졌으며, 고통들이 준비되었고, 아픔들이 생겨났고, 수고가 완성되었으며, 위대함이 낮아지기 시작했습니다.


    그리고 형상으로 보이고 모습을 취한 마지막 시대에 관하여는, 때가 심판을 받으며 인류의 척도가 재어지고 그 힘이 시험받을 것임을 아십시오. 그러므로 아담이 하나님께로부터 장차 일어날 어떤 것들을 들었고, 죽은 자들의 놓임이 주어졌음을 생각하며, 또 하나님께서 그에게 명하신 것을 마음에 되새기는 동안 다섯 가지 생각을 품었습니다. 그는 자신을 책임지게 되었고, 또한 천사들도 책임지게 하였습니다. 그리고 그가 지음받던 그때에 그에게 하나의 환상이 보였는데, 쓰라린 삶과 불과 더불어 있는 원소들이었습니다. 그래서 하나님께서는 에덴에서, 지음받은 이들의 모습대로 그것들을 모으셨습니다.[a]'
  philosophy: optimal-equivalence
