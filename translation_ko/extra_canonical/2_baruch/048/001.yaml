lexical_decisions:
- source_word: ܘܗܘܐ
  english_pob_choice: And it happened
  chosen_korean: 그리고 ... 뒤에
  alternatives_korean:
  - 그리고 이르되
  - 그리고 ... 있었습니다
  lexicon: CAL
  rationale: 서사의 전환어로서 사건의 흐름을 자연스럽게 잇되, 고어투의 ‘일어나서’보다 현대 한국어의 서술 리듬을 살렸습니다.
- source_word: ܡܢ ܒܬܪ ܝܘܡܐ ܫܒܝܥܝܐ
  english_pob_choice: after the seventh day
  chosen_korean: 이레가 지난 뒤에
  alternatives_korean:
  - 일곱째 날 뒤에
  - 일곱 날이 지난 뒤에
  lexicon: CAL
  rationale: 직역적인 ‘일곱째 날’보다 기간 경과를 분명히 드러내는 ‘이레가 지난 뒤에’가 원문의 시간 관계를 자연스럽게 전달합니다.
- source_word: ܚܝܠܬܢܐ
  english_pob_choice: Mighty One
  chosen_korean: 야훼
  alternatives_korean:
  - 전능하신 분
  - 강하신 분
  lexicon: CAL
  rationale: 문맥상 하나님을 가리키는 직접 호칭이므로, 이 본문에서는 POB 기본 원칙에 따라 하나님의 고유명인 야훼를 사용해 제목적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 신적 호칭의 번역
  chosen_reading: ‘Mighty One’은 일반 형용사적 칭호가 아니라 본문에서 하나님께 드리는 호칭으로 보고, 한국어 본문에는 야훼로 옮겼습니다.
  alternative_readings:
  - 전능하신 분
  - 능하신 분
  rationale: 2 바룩에서 이 표현은 반복되는 신적 칭호이므로, 단순한 능력 묘사보다 호칭성을 우선해 처리했습니다. 이는 독자가 기도문의 대상을 즉시 식별하도록 돕습니다.
  doctrine_reference: 하나님의 주권과 능력
- issue: 직접 화법의 시제
  chosen_reading: ‘and said’는 보고체의 서술로 보고 ‘말하였습니다’로 옮겼습니다.
  alternative_readings:
  - 말했습니다
  - 이르렀습니다
  rationale: 기도문 도입부의 공손한 서술을 유지하면서도, 본문의 직접 발화가 곧 뒤따를 것을 분명히 했습니다.
  doctrine_reference: 서사-기도 전환의 문체
