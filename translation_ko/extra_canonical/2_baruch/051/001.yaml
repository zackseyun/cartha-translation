translation:
  language: ko
  text: 그리고 그 정해진 날이 지나면, 정죄된 이들의 모습은 바뀌고, 의롭다고 인정받은 이들의 영광도 바뀔 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그때 정죄된 이들의 모습은 그 후에 바뀔 것입니다.”
    reason: 원문의 시간 부사와 ‘바뀌다’의 어순을 달리 이해할 수 있다는 영문 POB 감사 이력의 대안을 한국어로 보존합니다.
lexical_decisions:
- source_word: ܒܬܪ ܕ... ܗܝܕܝܢ
  english_pob_choice: after that appointed day has passed ... then
  chosen_korean: 그 정해진 날이 지나면 … 바뀔 것입니다
  alternatives_korean:
  - 그 후에 … 바뀔 것입니다
  - 그 기한이 지난 뒤에 … 바뀔 것입니다
  lexicon: Payne Smith
  rationale: ‘정해진 날’로 시간의 지정성을 살리고, 뒤의 ‘then’을 한국어의 종속절 순서로 자연스럽게 처리했습니다.
- source_word: ܨܘܪܬܐ / ܨܘܪܬܗܘܢ
  english_pob_choice: form
  chosen_korean: 모습
  alternatives_korean:
  - 형태
  - 형상
  lexicon: Payne Smith
  rationale: 이 장의 변형 이미지를 한국어에서 가장 자연스럽게 드러내면서도, 외형적 변화라는 구체성을 유지하기 위해 ‘모습’을 택했습니다.
- source_word: ܐܙܕܩܘ
  english_pob_choice: vindicated
  chosen_korean: 의롭다 인정받은
  alternatives_korean:
  - 변호를 받은
  - 의롭다 함을 받은
  lexicon: Payne Smith
  rationale: 법정적 선언의 의미를 살리되, 후대 교리 용어로 굳어진 ‘칭의’보다 원문의 공적 판결 뉘앙스를 한국어로 직접 드러내기 위해 이렇게 옮겼습니다.
- source_word: ܬܫܒܘܚܬܗܘܢ
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 찬란함
  - 광채
  lexicon: Payne Smith
  rationale: 원문의 존귀와 현시를 아우르는 표현으로서, 이 장의 종말론적 높임을 가장 안정적으로 전달합니다.
theological_decisions:
- issue: ܐܙܕܩܘ의 교리적 중첩을 어떻게 처리할지
  chosen_reading: ‘의롭다 인정받은’으로 옮겨, 법정적 선언의 의미는 살리되 특정 교파의 칭의 용어로 고정하지 않았습니다.
  alternative_readings:
  - ‘칭의된’
  - ‘의롭다 하심을 받은’
  rationale: 이 문맥은 종말의 판결과 드러남을 말하므로, 독자가 이 절을 바울서신식 교리 공식으로 오해하지 않도록 표현을 조금 열어 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 종말론적 심판과 의롭다 인정됨의 공개적 선고
