  text: 그러나 이제 내 법으로 말미암아 의로움을 입은 자 곧 생활에 명철이 있고 그 마음에 지혜의 뿌리를 심은 자의 영광은 그 때에 그들의 광채가 변화되어 영광을 받을 것이요 그 얼굴의 모양이 그 아름다운 광채로 변하여 저희가 약속된 죽지 아니하는 세상을 받게 되리라
