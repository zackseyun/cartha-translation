revisions:
- from: 그러나 이제 내 법으로 말미암아 의로움을 입은 자 곧 생활에 명철이 있고 그 마음에 지혜의 뿌리를 심은 자의 영광은 그 때에 그들의 광채가 변화되어 영광을 받을 것이요 그 얼굴의 모양이 그 아름다운 광채로 변하여 저희가 약속된 죽지 아니하는 세상을 받게 되리라
  to: 그러나 이제 내 율법으로 말미암아 의롭다 하심을 받은 이들, 곧 삶에서 분별력이 있었고 그 마음에 지혜의 뿌리를 심은 이들의 영광에 관해서는, 그들의 광채가 그때 변모 가운데서 영화롭게 될 것이며, 그 얼굴의 모습은 그 아름다움의 빛으로 변할 것입니다. 그리하여 그들은 자신들에게 약속된 죽지 않는 세상을 받게 될 것입니다.
  rationale: 현수 주제와 주절의 구별을 한국어 문장 구조로 드러내고, 광채의 영화로움, 얼굴 모습의 변모, 약속된 불멸의 세상이라는 원문의 핵심 요소를 빠짐없이 보존했습니다. 별도 본문 이문이나 번역상 불가피한 모호성이 없어 각주를 추가하지 않았습니다.
