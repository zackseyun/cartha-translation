translation:
  language: ko
  text: 그러나 이제 내 율법으로 말미암아 의롭다 하심을 받은 이들, 곧 삶에서 분별력이 있었고 그 마음에 지혜의 뿌리를 심은 이들의 영광에 관해서는, 그들의 광채가 그때 변모 가운데서 영화롭게 될 것이며, 그 얼굴의 모습은 그 아름다움의 빛으로 변할 것입니다. 그리하여 그들은 자신들에게 약속된 죽지 않는 세상을 받게 될 것입니다.
  philosophy: optimal-equivalence
