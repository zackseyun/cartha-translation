  source_fidelity: 초안의 ‘자신들을 높이고 있는 이들’은 영어 감사본의 ‘those over whom they are now exalted’ 및 문맥상 관계를 반대로 옮겼습니다. 현재 우위에 있는 자들과 그들이 현재 군림하는 자들이 장차 각각 변화한다는 대조를 명확히 해야 합니다.
  naturalness: ‘이들 저 사람들’과 이어지는 ‘후자/전자’는 현대 한국어에서 지시 대상이 불분명하고 어색합니다. 두 집단을 명시하여 자연스럽고 분명하게 옮기는 것이 적절합니다.
  terminology: ‘영화롭게’와 ‘천사의 영광’은 가능하지만, 본문의 시각적 대조에는 ‘영광스럽게’와 ‘천사들의 광채’가 더 직접적입니다. ‘환상’과 ‘형상’은 원문의 병렬성과 영어 감사본을 보존합니다.
  issues:
