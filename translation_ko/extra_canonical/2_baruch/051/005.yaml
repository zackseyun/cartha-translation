translation:
  language: ko
  text: 그러므로 그들이 지금 군림하고 있는 이들이 그때에는 그들보다 더 높아지고 영광스럽게 되는 것을 볼 때, 현재 군림하는 이들과 그들이 군림하는 이들은 변화될 것입니다. 곧 후자는 천사들의 광채로 변할 것이나, 전자는 환상들과 형상들을 보고 더욱 놀라 쇠잔해질 것입니다.
