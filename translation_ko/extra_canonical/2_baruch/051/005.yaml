revisions:
- from: 그러므로 그들이 지금 자신들을 높이고 있는 이들이 그들보다 더 높여지고 영화롭게 되는 것을 볼 때, 이들 저 사람들은 변화될 것입니다. 후자는 천사의 영광으로 변할 것입니다. 그러나 전자는 환상과 형상을 보고 경이로움에 더욱 쇠약해질 것입니다.
  to: 그러므로 그들이 지금 군림하고 있는 이들이 그때에는 그들보다 더 높아지고 영광스럽게 되는 것을 볼 때, 현재 군림하는 이들과 그들이 군림하는 이들은 변화될 것입니다. 곧 후자는 천사들의 광채로 변할 것이나, 전자는 환상들과 형상들을 보고 더욱 놀라 쇠잔해질 것입니다.
  rationale: 현재 우위에 있는 집단과 그들에게 눌려 있는 집단의 관계를 바로잡고, ‘후자’가 바로 앞에서 명시한 두 번째 집단을 가리키도록 문장을 재구성했습니다. 두 집단의 장래 대조, 천사적 광채, 환상과 형상 앞에서의 쇠잔이라는 본문의 병렬을 보존했습니다.
