  text: 그러므로 그들이 지금 자신들을 높이고 있는 이들이 그들보다 더 높여지고 영화롭게 되는 것을 볼 때, 이들 저 사람들은 변화될 것입니다. 후자는 천사의 영광으로 변할 것입니다. 그러나 전자는 환상과 형상을 보고 경이로움에 더욱 쇠약해질 것입니다.
