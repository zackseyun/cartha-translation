  text: For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they should not come to the honor of which I told you before.
  footnotes:
  - marker: a
    text: Or 'does not grow old for those who come to it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 괴로움 없이 지나갈 수 없는 이 때를 자신들을 위하여 택했고, 그 끝이 애곡과 재앙으로 가득한 그 때를 자신들을 위하여 택했습니다. 또 그들은 그곳에 이르는 이들을 늙지 않게 하는 세상을 거절했고, 영광의 때를 거절했습니다. 이는 내가 전에 여러분에게 말한 그 영예에 이르지 못하게 하려는 것이었습니다.
  philosophy: optimal-equivalence
