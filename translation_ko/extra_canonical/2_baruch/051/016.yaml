revisions:
- from: 그들은 괴로움이 없이 지나갈 수 없는 이 때를 자기를 위하여 택하였고 그 종말에는 애곡과 화로 가득 찬 이 때를 자기를 위하여 택하였느니라. 그들은 늙지 아니하는 세상을 거절하고 영광의 때를 거절하였으니 이는 내가 전에 너희에게 말한 영광에 이르지 못하게 하려 함이니라.
  to: 그들은 괴로움 없이 지나갈 수 없는 이 때를 자신들을 위하여 택했고, 그 끝이 애곡과 재앙으로 가득한 그 때를 자신들을 위하여 택했습니다. 또 그들은 그곳에 이르는 이들을 늙지 않게 하는 세상을 거절했고, 영광의 때를 거절했습니다. 이는 내가 전에 여러분에게 말한 그 영예에 이르지 못하게 하려는 것이었습니다.
  rationale: 사역 동사인 ‘늙게 하다’의 부정을 ‘그곳에 이르는 이들을 늙지 않게 하는’으로 명시하여 원문의 의미를 보존했습니다. ‘악/재앙’의 문맥적 의미와 현대 표준어 합쇼체도 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:25Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 큰 흐름은 시리아어 본문 및 영어 감사 번역과 일치합니다. 그러나 ‘늙지 아니하는 세상’은 ‘세상 자체가 늙지 않는다’는 뜻으로 읽히기 쉬워, 그곳에 이르는 사람들을 늙지 않게 한다는 사역적 의미를 반영해야 합니다. 또한 ‘화’는 여기서 하나님의 진노라기보다 재앙·악한 일들을 가리키므로 ‘재앙’이 더 정확합니다.
  naturalness: ‘자기를 위하여’, ‘늙지 아니하는’, ‘하였느니라’는 요청된 현대 표준어 합쇼체에 맞지 않거나 부자연스럽습니다. 현대적인 문장으로 고쳤습니다.
  terminology: ‘애곡’, ‘영광의 때’, ‘영예’는 본문의 종말론적·명예 관련 어휘를 과도하게 교리화하지 않고 유지합니다. ‘영예’는 앞서 말해 준 대상에 이르는 것을 표현하는 마지막 구절에 적절합니다.
  issues:
  - severity: high
    issue: ‘늙지 아니하는 세상’이 사역적 의미를 충분히 반영하지 못함
    rationale: 시리아어는 그 세상이 그곳에 이르는 사람들을 늙게 하지 않는다는 뜻입니다. 세상 자체의 불변성으로만 이해될 수 있는 표현은 피해야 합니다.
  - severity: medium
    issue: ‘화’의 의미가 불필요하게 모호함
    rationale: 문맥상 ‘악한 일들/재앙들’의 뜻이므로 ‘재앙’이 현대 한국어에서 더 분명합니다.
  - severity: medium
    issue: 문체가 현대 합쇼체가 아님
    rationale: ‘하였느니라’와 ‘아니하는’은 고어적 성서 문체입니다. 지정된 현대 정중체에 맞추어 ‘택했습니다’, ‘않게 하는’으로 고칩니다.
  revised_text: 그들은 괴로움 없이 지나갈 수 없는 이 때를 자신들을 위하여 택했고, 그 끝이 애곡과 재앙으로 가득한 그 때를 자신들을 위하여 택했습니다. 또 그들은 그곳에 이르는 이들을 늙지 않게 하는 세상을 거절했고, 영광의 때를 거절했습니다. 이는 내가 전에 여러분에게 말한 그 영예에 이르지 못하게 하려는 것이었습니다.
