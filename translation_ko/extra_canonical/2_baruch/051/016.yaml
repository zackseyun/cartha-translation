  language: ko
  text: 그들은 괴로움이 없이 지나갈 수 없는 이 때를 자기를 위하여 택하였고 그 종말에는 애곡과 화로 가득 찬 이 때를 자기를 위하여 택하였느니라. 그들은 늙지 아니하는 세상을 거절하고 영광의 때를 거절하였으니 이는 내가 전에 너희에게 말한 영광에 이르지 못하게 하려 함이니라.
