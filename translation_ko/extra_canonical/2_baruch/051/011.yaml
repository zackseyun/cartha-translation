review_pass:
  verdict: revise
  source_fidelity: 제시된 시리아어 페이지 묶음은 51:11의 직접 대조에 필요한 해당 절 본문을 명확히 분리해 보여 주지 않으므로, 영어 POB 감사본의 의미 단위를 보조 기준으로 검토했습니다. 초안은 낙원, 보좌 아래의 생물들, 천사들의 군대, 말씀과 명령에 의해 제한된 천사들, 정해진 도래 때까지의 대기라는 핵심 내용을 대체로 보존합니다. 다만 '내 말을 붙잡아'는 천사들이 말씀을 붙잡는다는 뜻으로 읽힐 수 있어, 수동적 제한을 분명히 해야 합니다.
  naturalness: '''보여질''은 현대 표준어 문체에서 ''보일''이 더 자연스럽고, 문장 끝의 ''것이다''는 지정된 합쇼체와 맞지 않습니다. 또한 ''그들이 도착할 때까지''의 ''그들''은 천사들을 가리키는지 다른 대상을 가리키는지 불필요하게 모호합니다. ''그들의 도래 때까지''로 옮기면 영어 감사본의 의도와 연결 구조를 자연스럽게 살릴 수 있습니다.'
  terminology: '''생물들'', ''보좌'', ''천사들의 군대'', ''말씀'', ''명령''은 성서적 문맥에서 무리 없는 용어입니다. ''살아 있는 존재들''보다 ''생물들''이 보좌 주변 존재를 가리키는 전통적 표현을 유지합니다.'
  issues:
  - severity: medium
    issue: '''내 말을 붙잡아''의 행위자·의미가 불명확합니다.'
    rationale: 영어의 'held fast by my word'는 천사들이 말씀에 의해 붙들려/억제되어 있다는 수동 의미입니다. 한국어 초안은 천사들이 말씀을 붙잡는 능동 의미로도 읽힙니다.
  - severity: medium
    issue: 종결 표현이 합쇼체 요구와 일치하지 않습니다.
    rationale: 초안 마지막 절의 '서 있을 것이다'를 '서 있을 것입니다'로 고쳐야 지정된 현대 격식체를 일관되게 지킬 수 있습니다.
  - severity: low
    issue: 영어 감사본의 도래 표현에 대응하는 각주 표지가 누락되었습니다.
    rationale: 제시된 영어 POB에는 'until their arrival'에 관한 대안 독법 각주가 있으므로, 한국어에서도 해당 위치에 표지와 번역 각주를 보존하는 것이 감사 추적과 본문의 약간 중복적인 대안 표현을 유지하는 데 적절합니다.
  revised_text: 낙원의 넓은 곳들이 그들 앞에 펼쳐질 것이기 때문입니다. 또 보좌 아래에 있는 생물들의 위엄의 아름다움이 그들에게 보일 것이며, 내 말씀으로 붙들려 나타나지 못하는 천사들과 내 명령에 따라 그들의 도래 때까지 제자리에 서 있도록 지켜지는 천사들을 포함한 모든 천사의 군대도 보일 것입니다.a
  revised_footnotes:
  - marker: a
    text: 또는 “그들이 오는 때가 이를 때까지.”
    reason: 영어 POB 감사본의 ‘until their coming arrives’라는 대안 표현을 한국어로 보존합니다. 다소 중복적인 시간 표현은 본문이 아닌 각주에서 처리했습니다.
  revision_rationale: 수동적 제한 관계를 '내 말씀으로 붙들려'로 명확히 하고, '그들의 도래'로 지시 대상을 안정시켰으며, 합쇼체 종결을 일관되게 적용했습니다. 영어 감사본에 있는 대안 독법 각주도 해당 위치에 복원했습니다.
