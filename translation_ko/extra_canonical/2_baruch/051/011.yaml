  language: ko
  text: 광대한 낙원이 그들 앞에 펼쳐질 것이기 때문입니다. 그리고 보좌 아래 생물들의 위엄의 아름다움이 그들에게 보여질 것이며, 모든 천사의 군대, 곧 내 말을 붙잡아 나타나지 않도록 하는 자들과 내 명령으로 지켜지는 자들은 그들이 도착할 때까지 그 자리에 서 있을 것이다.
