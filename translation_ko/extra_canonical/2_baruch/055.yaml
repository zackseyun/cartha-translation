base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/055.yaml
  text: 'And it happened[a], when I was praying, speaking the first words of this prayer, that I was disturbed, and I was considering the seed of humankind—how many are those who have gone away, and how few are those who are preserved. And as I was considering these things, I heard a voice that said to me:


    “Son of man, why are you troubled, and why are you afraid? For before you were formed, you were known to me, and before you came forth from your mother’s womb, you were known to me. And because of this, these things that are to come were shown to you.”


    And I said to him, “My Lord, you have shown me the abundance of the times[b], and what has happened in them, but you have not shown me from what point to what point. How then may I hear of those people who have borne witness for righteousness, one by one, while each is kept in his own place?” And a multitude of good things and of evil things that are coming were made known to me, and then I went up to the mountain.


    And it happened, after seven days, that I came to that place of the spring. And as I was sitting there, behold, a chariot of a cloud took me up—not in the body, and not knowingly. And a mystery was shown to me, and I heard a voice that said to me: “See and know how, in this world, their deeds and their labors are kept, from what you saw there[d][c][b][a][e][d][c], of people who acted well and of people who acted wickedly.”'
  footnotes:
  - marker: a
    text: Literally “from hand to hand,” a Syriac idiom for “from one end to the other” (i.e., comprehensively).
    reason: lexical_alternative
  - marker: b
    text: The Syriac tewrṣā can denote instruction, arrangement, or exposition; here “for instruction” fits the context of men bearing witness.
    reason: lexical_alternative
  - marker: c
    text: The clause “one of them when a feast is being kept” is difficult; the Syriac wording is terse and its exact reference is debated. The translation preserves the phrasing without forcing an identification.
    reason: textual_variant
  - marker: d
    text: “Deeds and labors are kept” likely implies divine custody or record of human actions for evaluation.
    reason: cultural_note
  - marker: e
    text: This abrupt “—I say” marks a narrative transition. The detailed cloud-vision that follows begins in the next section; the chapter boundary here is a medium-confidence judgment based on Ceriani’s layout and the control witnesses.
    reason: alternative_reading
  - marker: a
    text: Or 'when I had finished the first words of this prayer'.
    reason: previous_rendering
  - marker: b
    text: 'Or ''but you have not shown me from end to end[a]—only what it is good to hear: the things that men have borne as testimony for instruction[b], one of them when a feast is being kept[c].''.'
    reason: previous_rendering
  - marker: c
    text: Or 'upon a chariot of a cloud, I was taken up'.
    reason: previous_rendering
  - marker: d
    text: Or 'from what you have seen, therefore, of people who are good and of people who are evil[d].”—I say[e].'.
    reason: previous_rendering
translation:
  language: ko
  text: '내가 기도하고 있을 때, 이 기도의 첫마디를 말하는 중에 나는 마음이 동요되었고, 사람의 씨를 생각하고 있었습니다. 얼마나 많은 이들이 떠나갔는지, 그리고 얼마나 적은 이들이 보존되는지 생각하고 있었습니다. 내가 이런 것들을 생각하고 있을 때, 한 음성이 내게 말하는 것을 들었습니다.


    「사람의 아들아, 왜 네가 동요하느냐? 왜 두려워하느냐? 네가 지음받기 전에 나는 너를 알았고, 네가 어머니의 태에서 나오기 전에 나는 너를 알았다. 그러므로 앞으로 일어날 일들이 너에게 보여진 것이다。」


    내가 그에게 말했습니다. 「주님, 주님은 제게 시간들의 풍성함과 그 안에서 일어난 일들은 보여주셨지만, 그것들이 어디서부터 어디까지인지 보여주지는 않으셨습니다. 그렇다면 어떻게 하면, 의를 위해 증언한 사람들에 관하여 하나하나 들을 수 있겠습니까? 각 사람은 자기 처소에 그대로 보존되어 있는데 말입니다.」 그러자 앞으로 올 많은 선한 일들과 악한 일들이 내게 알려졌고, 그다음 나는 산으로 올라갔습니다.


    그리고 칠 일 후, 나는 샘이 있는 그곳에 이르렀습니다. 내가 거기 앉아 있을 때, 보십시오, 구름의 전차가 나를 들어 올렸습니다—몸으로가 아니었고, 의식하면서도 아니었습니다. 그리고 한 비밀이 내게 보여졌고, 한 음성이 내게 말하는 것을 들었습니다. 「보고 알아두어라. 이 세상에서 그들의 행위와 수고가 어떻게 보존되는지를—거기서 네가 보았던 바, 잘 행한 사람들과 악하게 행한 사람들의 것들을 말이다.」[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܪܥܗ ܕܐܢܫܐ
  english_pob_choice: seed of humankind
  chosen_korean: 사람의 씨
  alternatives_korean:
  - 인류의 씨
  - 사람의 후손
  - 인류의 후예
  lexicon: Payne Smith, A Compendious Syriac Dictionary
  rationale: 시리아어의 ‘씨’ 은유를 살리되 한국어에서는 ‘사람의 씨’가 집합적 인류를 자연스럽게 드러내면서도 이미지가 유지됩니다.
- source_word: ܡܬܕܘܕ / ܡܬܪܗܒ
  english_pob_choice: troubled / afraid
  chosen_korean: 동요되다 / 두려워하다
  alternatives_korean:
  - 괴로워하다 / 무서워하다
  - 마음이 뒤흔들리다 / 겁내다
  lexicon: Payne Smith, A Compendious Syriac Dictionary
  rationale: 내적 불안과 두려움의 병렬을 살리면서, 합쇼체 서술에 맞는 현대적 표현으로 정리했습니다.
- source_word: ܬܬܒܪܐ / ܐܬܝܕܥܬ ܠܝ
  english_pob_choice: before you were formed / you were known to me
  chosen_korean: 네가 지음받기 전에 / 나는 너를 알았다
  alternatives_korean:
  - 네가 만들어지기 전에 / 나는 너를 알았다
  - 네가 형성되기 전에 / 너는 내게 알려져 있었다
  lexicon: Brockelmann, Lexicon Syriacum; Payne Smith, A Compendious Syriac Dictionary
  rationale: 시리아어의 ‘형성됨’과 인격적 인지를 함께 살리되, 한국어에서는 ‘지음받기’가 가장 자연스럽고 신학적 과장을 덜어 줍니다.
- source_word: ܡܢ ܐܝܕܐ ܥܕܡܐ ܠܐܝܕܐ / ܥܒܕܝ̈ܗܘܢ ܘܥܡܠܝ̈ܗܘܢ
  english_pob_choice: from what you saw there / their deeds and their labors are kept
  chosen_korean: 그것들이 어디서부터 어디까지인지 / 그들의 행위와 수고가 어떻게 보존되는지
  alternatives_korean:
  - 처음부터 끝까지 / 그들의 행위와 노고가 어떻게 지켜지는지
  - 전부 / 그들의 일들과 수고가 간직되는지
  lexicon: Payne Smith, A Compendious Syriac Dictionary; Brockelmann, Lexicon Syriacum
  rationale: ‘from hand to hand’ 계열 관용은 본문 맥락상 ‘어디서부터 어디까지’로 풀어야 하며, 마지막 구절의 ‘kept’는 심판을 위한 보존 가능성을 열어 두기 위해 ‘보존된다’로 옮겼습니다.
- source_word: ܡܪܟܒܬܐ ܕܥܢܢܐ
  english_pob_choice: chariot of a cloud
  chosen_korean: 구름의 전차
  alternatives_korean:
  - 구름 전차
  - 구름으로 된 전차
  lexicon: Payne Smith, A Compendious Syriac Dictionary
  rationale: 환시적 운반 이미지를 직역에 가깝게 살리면서 한국어에서 가장 읽히는 형태로 다듬었습니다.
theological_decisions:
- issue: ‘before you were formed…I knew you’의 예언자적 소명 함의
  chosen_reading: 예레미야식 소명 공식을 암시하더라도, 본문 자체의 발화를 그대로 유지하여 하나님의 선재적 아심과 선택을 드러내는 것으로 옮겼습니다.
  alternative_readings:
  - 예레미야 1:5의 직접적 재현으로 처리
  - 단순한 사전지식 표현으로 약화
  rationale: 시리아어는 분명한 소명 전승과 닮아 있지만, 여기서는 본문이 말하는 선재적 인지와 계시를 우선 드러내는 편이 더 충실합니다.
  doctrine_reference: 예언자 소명과 하나님의 전지에 대한 일반적 성경 신학
- issue: ‘몸으로가 아니었고, 의식하면서도 아니었습니다’의 승천 성격
  chosen_reading: 육체적 이동이 아니라 환시적 들림으로 이해되도록 그대로 옮겼습니다.
  alternative_readings:
  - 실제 육체 승천
  - 단순한 꿈
  rationale: 본문이 ‘몸으로가 아니었다’고 분명히 말하므로, 신학적으로도 환시적 체험을 보존하는 것이 가장 안전합니다.
  doctrine_reference: 종말론적 환시와 계시 체험에 대한 본문 내 진술
