  yaml_path: translation/extra_canonical/2_baruch/085.yaml
  text: '… the times are already hastening on them[a]. And the holy ones are near the truth, and the living are near the end.


    So then receive his commandments, that you may not be deprived of his great abundance, but may find rest and not be condemned.


    For there is no longer a mystery for understanding, or wisdom for the times, or lengthening for the seasons, or anyone by prayer, or by the intercession of the fathers, or by the petition of the prophets, or by the help of the righteous, or anyone by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of those born, or by the righteousness of their fathers. None of these things that were thought and seen to be helpers can help.


    For we all shall perish, each one of us by himself.


    But he will leave those in whom there is hope for him[e][d][c][b], and he will destroy at once those who are defiled with sins.'
  footnotes:
  - marker: a
    text: This Ceriani bucket appears to preserve the latter portion of the chapter traditionally numbered 85; the chapter edge remains somewhat unstable against adjacent pages, so the draft favors honesty over false precision.
    reason: textual_variant
  - marker: b
    text: The opening sequence of similes ('pitcher ... well ... ship ... harbor ... journey ... city') is supported by the broader witness tradition, but the present Ceriani OCR at this spot is rough.
    reason: textual_variant
  - marker: c
    text: The final clause could be rendered more literally as something like 'those divided among sins'; the English gives the likely sense idiomatically as 'defiled with sins.'
    reason: lexical_alternative
  - marker: d
    text: Or 'The youth of this world has passed, and the strength of creation is already spent; the coming of the times is close and already pressing in.'.
    reason: previous_rendering
  - marker: e
    text: Or 'For there is the decree of judgment, the way of fire, and the path that leads to destruction. Therefore each of us will then stand by himself alone.'.
    reason: previous_rendering
translation:
  language: ko
  text: '… 때가 이미 그들에게 다가오고 있습니다. 그리고 거룩한 이들은 진리에 가깝고, 살아 있는 이들은 끝에 가깝습니다.


    그러므로 그의 명령을 받으십시오. 그래야 그의 큰 풍성함에서 빼앗기지 않고, 안식을 얻으며 정죄를 당하지 않을 것입니다.


    이제는 깨달음을 위한 신비도, 때를 위한 지혜도, 시기를 늘이는 것도, 기도도, 조상들의 중보도, 예언자들의 간구도, 의인들의 도움도, 여인들의 울음도, 어린아이들의 다정함도, 갓난아기들의 울부짖음도, 태어난 이들의 순결도, 그들의 아버지들의 의로움도 더 이상 없습니다. 도움이라고 생각되었고 보였던 이런 것들 가운데 어느 것도 도울 수 없습니다.


    이는 우리 모두가 각자 홀로 죽을 것이기 때문입니다.


    그러나 그는 그에게 희망을 두는 이들은 남겨 두시고, 죄들 가운데서 더럽혀진 이들은 곧장 멸하실 것입니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  english_pob_choice: his commandments
  chosen_korean: 그의 명령
  alternatives_korean:
  - 그의 계명
  - 그의 명령들
  lexicon: Payne Smith
  rationale: 시리아어 복수형의 권위 있는 요구를 한국어에서 자연스럽게 살리되, 문맥의 권면성을 유지하기 위해 ‘명령’을 택했습니다. ‘계명’은 보다 종교적 전통어라서 여기서는 덜 직접적입니다.
- source_word: ܣܓܝܐܘܬܗ
  english_pob_choice: his great abundance
  chosen_korean: 그의 큰 풍성함
  alternatives_korean:
  - 그의 큰 풍요
  - 그의 큰 넘침
  lexicon: Payne Smith
  rationale: 문맥상 판단과 구원의 때에 받게 되는 충만함을 가리키므로, 추상적인 ‘풍성함’이 가장 무리 없이 대응합니다.
- source_word: ܒܒܛܝܠܘܬܐ
  english_pob_choice: by prayer
  chosen_korean: 기도
  alternatives_korean:
  - 기도로
  - 간구로
  lexicon: Payne Smith
  rationale: 열거문에서 행위 매개를 나타내는 명사구이므로, 한국어에서는 조사 없이 병렬 명사로 두어 목록성을 살렸습니다.
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  english_pob_choice: the weeping of women
  chosen_korean: 여인들의 울음
  alternatives_korean:
  - 여인들의 통곡
  - 여인들의 울부짖음
  lexicon: Payne Smith
  rationale: 원문은 감정적 애원과 애도의 소리를 가리키므로, ‘울음’이 가장 직설적이고 과장되지 않습니다.
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  english_pob_choice: the tenderness of little children
  chosen_korean: 어린아이들의 다정함
  alternatives_korean:
  - 어린아이들의 부드러움
  - 어린아이들의 사랑스러움
  lexicon: Payne Smith
  rationale: 해당 어휘는 단순한 귀여움보다도 애정 어린 호감을 뜻하므로, ‘다정함’이 문맥의 호소력을 잘 전달합니다.
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  english_pob_choice: the innocence of those born
  chosen_korean: 갓난아기들의 순결
  alternatives_korean:
  - 태어난 이들의 순수함
  - 아기들의 깨끗함
  lexicon: Payne Smith
  rationale: 원문은 태어난 존재들의 무구함을 가리키므로, 한국어에서는 더 자연스러운 생명 초기 이미지인 ‘갓난아기들’과 ‘순결’의 조합으로 옮겼습니다.
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  english_pob_choice: defiled with sins
  chosen_korean: 죄들 가운데서 더럽혀진
  alternatives_korean:
  - 죄로 더럽혀진
  - 죄들에 분열된
  lexicon: Payne Smith
  rationale: 시리아어의 상태 표현을 도덕적 오염 상태로 옮기되, 복수형 ‘죄들’의 집약성을 살리기 위해 ‘가운데서’ 구조를 사용했습니다.
theological_decisions:
- issue: 마지막 보존/멸망 대조를 어떻게 표현할지
  chosen_reading: ‘그에게 희망을 두는 이들은 남겨 두시고, 죄들 가운데서 더럽혀진 이들은 곧장 멸하실 것입니다’로 옮겼습니다.
  alternative_readings:
  - ‘그 안에 희망이 있는 이들을 남기시고’
  - ‘죄 가운데 나뉜 이들을’
  rationale: 원문은 희망의 방향이 그에게 있음을 전제하면서 보존과 즉각적 멸망을 대조합니다. 한국어에서도 그 관계를 분명히 드러내되, 본문이 요구하지 않는 추가 신학 개념은 넣지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1
- issue: ‘조상들의 중보’ 같은 열거어를 전통적 교회어로 완화할지
  chosen_reading: 시리아어 목록을 그대로 살려 기도, 조상들의 중보, 예언자들의 간구, 의인들의 도움을 병렬로 유지했습니다.
  alternative_readings:
  - 한 문장으로 ‘아무 중보도 소용없다’로 요약
  - ‘성인들의 중재’ 등 전통어 사용
  rationale: 본문의 수사학은 누적적이며, 여러 유형의 간구와 도움을 차례로 무력화합니다. 이를 요약하면 원문의 긴박함과 반복 효과가 약해집니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
