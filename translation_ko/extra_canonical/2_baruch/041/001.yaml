  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 문맥상 공동체와 하나님 사이의 관계를 가리키므로, 단순한 약속보다 언약이 더 정확하게 원문과 POB의 의미를 살립니다.
- source_word: ܢܡܘܣܐ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ‘율법의 멍에’라는 표현은 유대적·언약적 의무를 가리키므로, 보다 일반적인 ‘법’이나 ‘가르침’보다 율법이 적합합니다.
- source_word: ܡܘܒܠܐ / 불확실한 구절
  english_pob_choice: their vanity
  chosen_korean: 헛됨
  alternatives_korean:
  - 허무
  - 헛된 것
  - 공허함
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: Kmosko 대조본이 vanitatem suam을 지지하므로, 도덕적·영적 공허를 담는 ‘헛됨’으로 옮겼습니다.
- source_word: ܓܦܢ / 날개 이미지
  english_pob_choice: beneath your wings
  chosen_korean: 당신의 날개 아래로
  alternatives_korean:
  - 당신의 보호 아래로
  - 당신의 날개 밑으로
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 보호의 비유를 평이하게 풀지 않고, 성서적 이미지인 ‘날개 아래’의 직유를 보존했습니다.
- source_word: ܡܬܬܚܒܘ / 저울 이미지
  english_pob_choice: be weighed
  chosen_korean: 저울에 달려
  alternatives_korean:
  - 헤아려져
  - 달아져
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 뒤이어 저울대가 기우는 이미지가 나오므로, 판정의 비유를 ‘저울에 달리다’로 구체화하는 것이 원문에 가장 가깝습니다.
