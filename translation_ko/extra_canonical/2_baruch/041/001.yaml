- issue: 마지막 때에 대한 질문의 처리
  chosen_reading: 바룩의 질문을 그대로 열어 두어, 답을 미리 확정하지 않고 다음 문맥으로 긴장을 넘깁니다.
  alternative_readings:
  - 질문을 암시적으로 이미 판결된 것으로 정리하는 번역
  rationale: 원문은 이 두 집단이 마지막 때에 어떻게 받아들여질지 묻고 있을 뿐이므로, 해답을 앞당겨 확정하지 않는 것이 문맥에 충실합니다.
  doctrine_reference: 종말론적 심판의 유보된 질문 구조
