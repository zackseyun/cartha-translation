  rationale: 원문은 이 두 집단이 마지막 때에 어떻게 받아들여질지 묻고 있을 뿐이므로, 해답을 앞당겨 확정하지 않는 것이 문맥에 충실합니다.
  doctrine_reference: 종말론적 심판의 유보된 질문 구조
