  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
  footnotes:
  - marker: a
    text: The present Ceriani chapter bucket overlaps with the close of chapter 40 and the start of chapter 42. This question section is clear in sense, but its exact edge is clarified with Kmosko page 576.
    reason: textual_variant
  - marker: b
    text: The Syriac line here is locally uncertain in the Ceriani OCR; 'their vanity' is supported by the Kmosko Latin control witness.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 내가 말했습니다. “이 일들은 누구에게, 또 얼마나 많은 이들에게 일어나겠습니까? 그리고 그때를 보기에 합당한 이가 누구겠습니까?[a]


    그러나 저는 당신께 제가 생각하는 모든 것을 말씀드리겠습니다. 또 저는 당신의 백성 가운데 많은 이들을 보았는데, 그들은 당신의 언약을 저버리고 당신의 율법의 멍에를 스스로 벗어 던졌습니다.


    그러나 또 다른 이들은 자기들의 헛됨[b]을 버리고 당신의 날개 아래로 피했습니다.


    그렇다면 이들에게는 무슨 일이 일어나겠습니까? 또는 그 마지막 때가 그들을 어떻게 맞아들이겠습니까?


    아니면 이들이 맞이할 때가 혹시 저울에 달리고, 저울대가 기우는 대로 그들도 심판을 받겠습니까?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현재의 체리아니 장 단위 본문 묶음은 40장의 끝부분 및 42장의 시작 부분과 겹칩니다. 이 질문 부분의 의미는 분명하지만, 정확한 경계는 크모스코 576쪽으로 더 분명해집니다.
    reason: textual_variant
  - marker: b
    text: 여기의 시리아어 행은 체리아니 OCR에서 국소적으로 불확실합니다. ‘자기들의 헛됨’이라는 번역은 크모스코의 라틴어 대조 증언이 뒷받침합니다.
    reason: lexical_alternative
