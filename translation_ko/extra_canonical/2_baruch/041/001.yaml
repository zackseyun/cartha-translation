  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
  footnotes:
  - marker: a
    text: The present Ceriani chapter bucket overlaps with the close of chapter 40 and the start of chapter 42. This question section is clear in sense, but its exact edge is clarified with Kmosko page 576.
    reason: textual_variant
  - marker: b
    text: The Syriac line here is locally uncertain in the Ceriani OCR; 'their vanity' is supported by the Kmosko Latin control witness.
    reason: lexical_alternative
translation:
  language: ko
  text: '그리고 내가 말했습니다. “이 일들은 누구를 위하여, 또 몇 사람을 위하여 일어납니까? 그리고 그때를 볼 만한 자가 누구겠습니까?[a]


    그러나 저는 제 생각하는 모든 것을 당신과 말하겠습니다. 또 당신의 백성 가운데 제가 많은 수를 보았는데, 그들은 당신의 언약에서 돌아서고 당신의 율법의 멍에를 자기들에게서 벗어던졌습니다.


    그러나 또 다른 이들은 자기들의 헛됨[b]을 버리고 당신의 날개 아래로 달려갔습니다.


    그렇다면 이들에게는 무슨 일이 일어나겠습니까? 또는 그 마지막 때가 그들을 어떻게 받아들이겠습니까?


    아니면 이들의 때가 혹시 저울에 달려, 저울대가 기우는 대로 그들도 판결받겠습니까?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܝܡܐ / 언약에 해당하는 표현
  english_pob_choice: your covenant
  chosen_korean: 당신의 언약
  alternatives_korean:
  - 당신의 약속
  - 당신의 서약
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 문맥상 공동체와 하나님 사이의 관계를 가리키므로, 단순한 약속보다 언약이 더 정확하게 원문과 POB의 의미를 살립니다.
- source_word: ܢܡܘܣܐ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ‘율법의 멍에’라는 표현은 유대적·언약적 의무를 가리키므로, 보다 일반적인 ‘법’이나 ‘가르침’보다 율법이 적합합니다.
- source_word: ܡܘܒܠܐ / 불확실한 구절
  english_pob_choice: their vanity
  chosen_korean: 헛됨
  alternatives_korean:
  - 허무
  - 헛된 것
  - 공허함
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: Kmosko 대조본이 vanitatem suam을 지지하므로, 도덕적·영적 공허를 담는 ‘헛됨’으로 옮겼습니다.
- source_word: ܓܦܢ / 날개 이미지
  english_pob_choice: beneath your wings
  chosen_korean: 당신의 날개 아래로
  alternatives_korean:
  - 당신의 보호 아래로
  - 당신의 날개 밑으로
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 보호의 비유를 평이하게 풀지 않고, 성서적 이미지인 ‘날개 아래’의 직유를 보존했습니다.
- source_word: ܡܬܬܚܒܘ / 저울 이미지
  english_pob_choice: be weighed
  chosen_korean: 저울에 달려
  alternatives_korean:
  - 헤아려져
  - 달아져
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 뒤이어 저울대가 기우는 이미지가 나오므로, 판정의 비유를 ‘저울에 달리다’로 구체화하는 것이 원문에 가장 가깝습니다.
