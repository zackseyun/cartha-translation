translation:
  language: ko
  text: 1 그런데 이제 나는 당신과 당신과 같은 모든 사람에게 말합니다. 이 도시에서 떠나십시오. 2 당신의 행위는 이 도시에 견고한 기둥과 같고, 당신의 기도는 튼튼한 성벽과 같습니다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ
  english_pob_choice: all who are like you
  chosen_korean: 당신과 같은 모든 사람
  alternatives_korean:
  - 당신과 같은 사람들
  - 당신과 비슷한 사람들
  lexicon: Payne Smith
  rationale: 단순한 유사 인물이 아니라 예레미야와 함께 묶이는 동류의 무리를 가리키므로, ‘모든 사람’으로 범위를 드러내면서도 자연스러운 한국어로 옮겼습니다.
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ ܗܕܐ ܡܕܝܢܬܐ
  english_pob_choice: to leave this city
  chosen_korean: 이 도시에서 떠나십시오
  alternatives_korean:
  - 이 도시를 떠나십시오
  - 이 도시에서 물러나십시오
  lexicon: Payne Smith
  rationale: 문맥상 단순한 주의 환기가 아니라 떠날 것을 명하는 뜻이므로, ‘떠나십시오’로 직접적이고 간결하게 옮겼습니다.
- source_word: ܥܒܕ̈ܝܟܘܢ
  english_pob_choice: your deeds
  chosen_korean: 당신의 행위
  alternatives_korean:
  - 당신의 일
  - 당신의 행실
  lexicon: Payne Smith
  rationale: 도시를 붙드는 보호적 기능을 설명하는 문맥이므로, 도덕적·실천적 행위를 뜻하는 ‘행위’가 가장 적절합니다.
- source_word: ܕܐܝܟ ... ܕܝܢ
  english_pob_choice: like a firm pillar / like a strong wall
  chosen_korean: 견고한 기둥 / 튼튼한 성벽
  alternatives_korean:
  - 굳건한 기둥 / 강한 성벽
  - 든든한 기둥 / 견고한 담
  lexicon: Payne Smith
  rationale: 원문의 두 비유는 보호와 지탱의 이미지를 함께 요구하므로, ‘기둥’과 ‘성벽’의 대응을 유지하면서 수식어를 현대 한국어로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 도시를 떠나라는 명령의 기능
  chosen_reading: 이 명령은 심판이 철회되었다는 뜻이 아니라, 의인들의 존재와 기도가 도시의 보존에 실제로 관련되어 있음을 전제합니다.
  alternative_readings:
  - 단지 개인 안전을 위한 지시입니다.
  - 단순한 존경의 표현일 뿐입니다.
  rationale: 2절의 비유가 1절의 명령을 받쳐 주므로, 보호적·중보적 의미를 약화시키지 않는 쪽이 문맥에 맞습니다.
  doctrine_reference: 의인의 중보와 하나님의 역사하시는 섭리
- issue: 직설적 명령의 문체
  chosen_reading: 원문 명령형을 한국어 합쇼체로 직접 살려 ‘떠나십시오’로 옮겼습니다.
  alternative_readings:
  - 떠나세요
  - 떠나야 합니다
  rationale: 예언적 경고의 직접성을 유지하면서도 현대 표준어의 공적인 어조를 살리기 위한 선택입니다.
  doctrine_reference: 예언문체의 직접성
