revisions:
- from: '주께서 내게 대답하여 말씀하셨습니다.


    “사람의 죽음을 보고 네가 놀라는 것은 옳지만, 죄인들에게 닥치는 악에 대해 네가 판단하는 것은 옳지 않습니다.


    네가 말한 것처럼, 의인들이 거두어지고 악인들이 번성하는 일과, 사람이 당신의 심판을 알지 못한다는 그 말에 대해서도 그러합니다.


    그러므로 이제 들으십시오. 내가 당신에게 말하겠습니다. 주의 깊게 들으십시오. 내가 내 말을 들려드리겠습니다.


    진실로 사람은 율법을 받지 않았더라면, 또 내가 그에게 이해를 가르치지 않았더라면 내 심판을 이해하지 못했을 것입니다.


    그러나 이제 그는 이해한 채로 범죄하였으므로, 그 이해 때문에 반드시 심판을 받을 것입니다.


    그리고 당신이 말한 의인들에 관하여는, 세상이 그들 때문에 왔다고 하셨습니다. 올 것도 또한 그들 때문에 올 것입니다.


    이 세상은 그들에게 고난과 큰 수고가 따르는 투쟁이지만, 다가올 것은 큰 영광의 면류관입니다.”[a]'
