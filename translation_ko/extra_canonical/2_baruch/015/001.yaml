  - 분별
  lexicon: Payne Smith
  rationale: 여기서는 지혜 일반보다 가르침을 받아 분별하게 되는 인지적·도덕적 ‘이해’가 핵심이므로 그렇게 옮겼습니다.
- source_word: ܟܪܣܐ
  english_pob_choice: womb / one womb
  chosen_korean: 한 어머니의 태
  alternatives_korean:
