  english_pob_choice: the Law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 토라
  lexicon: Payne Smith
  rationale: 이 단락은 인간의 책임과 계시된 규범을 논하므로, 관례적이면서도 성경적 의미를 분명히 하는 ‘율법’을 택했습니다.
- source_word: ܚܟܡܬܐ / ܡܕܥܐ
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
