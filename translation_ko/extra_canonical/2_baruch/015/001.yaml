- issue: The scene’s moral logic of accountability
  chosen_reading: 계시된 율법과 주어진 이해가 사람의 책임을 더 분명하게 만든다는 논지를 그대로 살렸습니다.
  alternative_readings:
  - 단순히 죄를 드러내는 수준으로 완화하는 읽기
  rationale: 본문은 이해를 받지 못한 상태와 받은 후의 상태를 대비하며, 알면서 범한 죄의 책임을 강조합니다.
  doctrine_reference: 책임과 심판에 관한 본문 내부 논지
- issue: The future lot of the righteous
  chosen_reading: 의인에게는 현재의 고난과 다가올 영광의 면류관이 대비됩니다.
  alternative_readings:
  - 현재 세상만을 말하는 읽기
  - 미래 보상을 약화시키는 읽기
  rationale: 종말론적 보상과 현재의 수고를 함께 두는 본문의 균형을 유지했습니다.
  doctrine_reference: 의인의 고난과 보상에 관한 본문 내부 논지
