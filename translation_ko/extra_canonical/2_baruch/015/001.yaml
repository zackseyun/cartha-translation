  text: 'And the Lord answered and said to me:

    “You are right to be astonished at man’s passing, but your judgment about the evils that befall sinners is not right.


    And as for what you said about the righteous who are taken away and the wicked who prosper,

    and as for what you said—that man does not know your judgment—

    because of this, listen now and I will speak to you; pay attention and I will make my words heard.


    Indeed, man would not have understood my judgment if he had not received the Law and if I had not instructed him in understanding.

    But now, because he has transgressed while understanding, he will surely be punished because of that understanding.

    And as for the righteous, concerning whom you said that the world came on their account: what is coming is likewise on their account.

    For to them this world is a struggle and a labor with much trouble, but what is to come is a crown with great glory.”'
translation:
  language: ko
  text: '주께서 내게 대답하여 말씀하셨습니다.


    “사람의 죽음을 보고 네가 놀라는 것은 옳지만, 죄인들에게 닥치는 악에 대해 네가 판단하는 것은 옳지 않습니다.


    네가 말한 것처럼, 의인들이 거두어지고 악인들이 번성하는 일과, 사람이 당신의 심판을 알지 못한다는 그 말에 대해서도 그러합니다.


    그러므로 이제 들으십시오. 내가 당신에게 말하겠습니다. 주의 깊게 들으십시오. 내가 내 말을 들려드리겠습니다.


    진실로 사람은 율법을 받지 않았더라면, 또 내가 그에게 이해를 가르치지 않았더라면 내 심판을 이해하지 못했을 것입니다.


    그러나 이제 그는 이해한 채로 범죄하였으므로, 그 이해 때문에 반드시 심판을 받을 것입니다.


    그리고 당신이 말한 의인들에 관하여는, 세상이 그들 때문에 왔다고 하셨습니다. 올 것도 또한 그들 때문에 올 것입니다.


    이 세상은 그들에게 고난과 큰 수고가 따르는 투쟁이지만, 다가올 것은 큰 영광의 면류관입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܠܝܬ ... ܐܢܫ
  english_pob_choice: man / man’s passing
  chosen_korean: 사람의 죽음
  alternatives_korean:
  - 인간의 사라짐
  - 사람의 지나감
  lexicon: Payne Smith
  rationale: 문맥상 단순한 존재 일반보다 인간의 죽음과 소멸을 가리키는 대목으로 보이므로, 놀람의 대상이 되는 ‘passing’을 자연스럽게 옮겼습니다.
- source_word: ܢܡܘܣܐ
  english_pob_choice: the Law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 토라
  lexicon: Payne Smith
  rationale: 이 단락은 인간의 책임과 계시된 규범을 논하므로, 관례적이면서도 성경적 의미를 분명히 하는 ‘율법’을 택했습니다.
- source_word: ܚܟܡܬܐ / ܡܕܥܐ
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 지혜
  - 분별
  lexicon: Payne Smith
  rationale: 여기서는 지혜 일반보다 가르침을 받아 분별하게 되는 인지적·도덕적 ‘이해’가 핵심이므로 그렇게 옮겼습니다.
- source_word: ܟܪܣܐ
  english_pob_choice: womb / one womb
  chosen_korean: 한 어머니의 태
  alternatives_korean:
  - 한 태
  - 한 자궁
  lexicon: Payne Smith
  rationale: ‘한 어머니에게서 나온다’는 동일 기원을 강조하는 관용적 표현으로 보고, 의미를 분명히 하는 방향으로 옮겼습니다.
theological_decisions:
- issue: The scene’s moral logic of accountability
  chosen_reading: 계시된 율법과 주어진 이해가 사람의 책임을 더 분명하게 만든다는 논지를 그대로 살렸습니다.
  alternative_readings:
  - 단순히 죄를 드러내는 수준으로 완화하는 읽기
  rationale: 본문은 이해를 받지 못한 상태와 받은 후의 상태를 대비하며, 알면서 범한 죄의 책임을 강조합니다.
  doctrine_reference: 책임과 심판에 관한 본문 내부 논지
- issue: The future lot of the righteous
  chosen_reading: 의인에게는 현재의 고난과 다가올 영광의 면류관이 대비됩니다.
  alternative_readings:
  - 현재 세상만을 말하는 읽기
  - 미래 보상을 약화시키는 읽기
  rationale: 종말론적 보상과 현재의 수고를 함께 두는 본문의 균형을 유지했습니다.
  doctrine_reference: 의인의 고난과 보상에 관한 본문 내부 논지
