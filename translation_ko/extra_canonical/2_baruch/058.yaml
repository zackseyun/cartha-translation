base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/058.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and covering this earth: it is the world which his power made when he planned to make creation[a]. And when the word went out from before him, the beginning of the world stood forth, very small, and it was set in order according to what it was intended to become.


    And the first black waters that you saw descending upon it from the cloud—this is the sin, the transgression that the first Adam first wrought. For when he sinned, death was stirred up before its time, and mourning was made known, and sufferings were prepared, and pains were created, and toil was completed, and greatness began to be brought low.


    And as for the last water, which you saw in the appearance and took to be like it, know that the time will be sought out, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, when he heard from God something of what was to be, considered the release of the dead that had been given, and what had been commanded him by God, he kept considering it and devised five thoughts. For he made himself guilty, and by the angels also he was made guilty. And also at that time when he was created, there was shown to him a vision: the bitter life and the elements with fire. Thus God gathered in Eden[g][f][e][d][c][b], in the likeness of those that were created.'
  footnotes:
  - marker: a
    text: The supplied chapter bucket is structurally uncertain in this stretch of Ceriani. This draft translates the p0190 material assigned here without claiming the chapter edge is fully secure.
    reason: textual_variant
  - marker: b
    text: The clause rendered 'the release of the dead that had been given' is textually difficult in the present Ceriani-based substrate, so the English remains intentionally cautious.
