    reason: previous_rendering
translation:
  language: ko
  text: '너희가 본 바, 바다에서 올라와 이 땅을 덮는 큰 구름이 무엇인지 들으십시오. 그것은 그분의 능력이 창조를 만들고자 계획하셨을 때 만든 세상입니다[a]. 그리고 말씀이 그분 앞에서 나가자, 세상의 시작이 아주 작게 나타나, 그것이 마땅히 되어야 할 모습에 따라 정돈되었습니다.


    그리고 구름에서 그 위로 내려온 첫 검은 물들은, 이것이 바로 첫 아담이 처음 범한 죄요, 그 범법입니다. 그가 죄를 짓자, 때 이르게 죽음이 일어나고, 애도가 알려졌으며, 고난들이 예비되었고, 고통들이 지어졌으며, 수고가 끝났고, 위대함이 낮아지기 시작했습니다.


    또 마지막 물에 관해서는, 그 모습에서 그것을 본 대로 알라. 때가 찾아지고, 인류의 분량이 재어지며, 그 힘이 시험받을 것입니다. 그러므로 아담은 하나님께서 장차 일어날 일의 일부를 들었을 때, 주어진 죽은 자들의 풀려남[b]과 하나님께서 그에게 명령하신 것을 생각하며 계속 숙고했고, 다섯 가지 생각을 지어냈습니다. 그는 자신을 유죄하게 하였고, 천사들에 의해서도 유죄하게 되었습니다. 또 그가 창조되었을 때 그에게 환상이 보였으니, 쓴 삶과 불이 있는 원소들이었습니다. 이처럼 하나님께서는 에덴에, 창조된 것들과 같은 모습으로 이것들을 미리 모아 두셨습니다[c].'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  english_pob_choice: the sin, the transgression
  chosen_korean: 죄, 범법
  alternatives_korean:
  - 죄, 죄악
  - 죄, 위반
  lexicon: Payne Smith
  rationale: 서로 겹치지만 다른 두 항을 한국어에서도 분리해, 첫 항의 일반적 죄와 둘째 항의 경계 넘음/법적 위반의 뉘앙스를 함께 살렸습니다.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  english_pob_choice: death was stirred up
  chosen_korean: 죽음이 일어나고
  alternatives_korean:
  - 죽음이 들끓고
  - 죽음이 일어나
  lexicon: Payne Smith
  rationale: ‘stirred up’의 활성화 이미지를 살리되, 한국어에서 자연스럽게 읽히는 동적 표현으로 옮겼습니다.
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  english_pob_choice: the beginning of the world
  chosen_korean: 세상의 시작
  alternatives_korean:
  - 세상의 기원
  - 세상의 처음
  lexicon: Payne Smith
  rationale: 세계가 막 드러나는 창조적 시작을 간결하게 전달하는 표현으로 보았습니다.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  english_pob_choice: the measure of humanity
  chosen_korean: 인류의 분량
  alternatives_korean:
  - 인류의 기준
  - 인간의 척도
  lexicon: Payne Smith
  rationale: 측정과 심사의 문맥을 살리기 위해 ‘분량’을 택해, 이어지는 ‘재다’와 호응하도록 했습니다.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  english_pob_choice: the release of the dead
  chosen_korean: 죽은 자들의 풀려남
  alternatives_korean:
  - 죽은 자들의 놓임
  - 죽은 자들의 해방
  lexicon: Payne Smith
  rationale: 본문이 난해하므로 의미를 과도하게 규정하지 않고, ‘release’의 핵심을 가장 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 첫 아담의 행위와 죽음의 발생
  chosen_reading: 아담의 죄와 범법이 죽음, 애도, 고난, 고통, 수고를 연쇄적으로 불러온다는 인과를 그대로 드러냈습니다.
  alternative_readings:
  - 보다 일반적인 인간 타락 서술로 완화할 수 있습니다.
  - 죽음의 발생을 단순한 동시적 묘사로 읽을 수 있습니다.
  rationale: 시리아어 본문은 아담의 행위를 우주적 결과의 직접 원인으로 제시하므로, 그 강한 인과성을 약화하지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1-3
- issue: 에덴에 모으셨다는 결말
  chosen_reading: 마지막 문장은 에덴을 보존한 장소로 보며, 본문이 허용하는 범위 내에서 단정적으로 풀었습니다.
  alternative_readings:
  - ‘미리’의 의미를 더 강하게 살려 예비 행위로 옮길 수 있습니다.
  - 문장 파손을 이유로 더 크게 완화할 수 있습니다.
  rationale: 결구가 압축되어 있지만, 현 시리아어 본문이 말하는 모음/집합의 이미지를 그대로 살리는 편이 가장 안전합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
