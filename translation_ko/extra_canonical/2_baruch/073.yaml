base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073.yaml
  text: '1. And it shall be[d], after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]


    2. And then healing will descend in dew,[b] and disease will withdraw, and anxiety and groanings will flee from the sons of men; and gladness will be in all the earth.


    3. And no one will again die before his time, nor will anything sudden bring calamity.


    4. And judgments, and accusations, and contentions, and retaliations, and bloodshed, and cravings, and envy, and hatred, and everything like these will go into condemnation when they are removed.


    5. For these are the things that have filled this world with evils, and because of these the life of mankind was greatly troubled.[c]'
  footnotes:
  - marker: a
    text: The supplied Ceriani bucket begins chapter 73 mid-sentence. This opening clause is translated with the help of Kmosko 1907 (p. 609) to avoid a false break at the chapter edge.
    reason: textual_variant
  - marker: b
    text: The Syriac line around 'dew' is difficult in Ceriani, and the codex note marks the wording as problematic. The rendering 'healing will descend in dew' follows the sense confirmed by Kmosko's control text.
    reason: lexical_alternative
  - marker: c
    text: The Ceriani page supplied here breaks off in the middle of verse 5 after 'For these are they, and ...'. The concluding sense is completed from the control witness rather than claimed as certain from the extant bucket alone.
    reason: textual_variant
  - marker: d
    text: Or 'sickness will withdraw, and anxiety and distress and groanings will flee from the sons of men; and gladness will walk through all the earth.'.
    reason: previous_rendering
translation:
  language: ko
  text: '1. 그리고 그가 세상의 모든 것을 낮추고, 자기 나라의 왕좌에 영원히 평안히 앉으시면, 그때 기쁨이 드러나고 안식이 나타날 것입니다.[a]


    2. 그러면 치유가 이슬처럼 내려오고,[b] 질병은 물러가며, 불안과 신음이 사람의 자손들로부터 달아날 것이고, 온 땅에는 기쁨이 있을 것입니다.


    3. 그리고 아무도 다시 제때보다 먼저 죽지 않을 것이며, 갑작스러운 어떤 일도 재앙을 가져오지 않을 것입니다.


    4. 또한 심판들과 고발들과 다툼들과 보복들과 피 흘림과 갈망들과 질투와 미움과, 이와 같은 모든 것은 제거될 때 정죄로 들어갈 것입니다.


    5. 이것들은 이 세상을 악으로 가득 채운 것들이며, 이 때문에 인류의 생명은 크게 괴로움을 당하였습니다.[c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܠܡܘܢ ܝܘܡܝܗܘܢ
  english_pob_choice: no one will again die before his time
  chosen_korean: 아무도 다시 제때보다 먼저 죽지 않을 것입니다
  alternatives_korean:
  - 아무도 자기 날들을 다 채우기 전에 죽지 않을 것입니다
  - 아무도 정해진 때보다 일찍 죽지 않을 것입니다
  lexicon: Payne Smith
  rationale: ‘날들을 채우다’의 관용적 뜻은 수명의 온전한 완성을 가리키므로, 문맥상 ‘제때보다 먼저 죽지 않다’로 풀어 자연스럽고 정확하게 살렸습니다.
- source_word: ܛܠܐ / ܒܒܘܣܡܐ
  english_pob_choice: healing will descend in dew
  chosen_korean: 치유가 이슬처럼 내려오고
  alternatives_korean:
  - 치유가 이슬 가운데 내려오고
  - 이슬과 함께 치유가 내려오고
  lexicon: Payne Smith
  rationale: 이 구절은 회복의 생명 이미지를 시적으로 제시하므로, 핵심 표상을 살린 ‘이슬처럼 내려오고’가 가장 직접적입니다.
- source_word: ܡܘܪܢܐ
  english_pob_choice: anxiety
  chosen_korean: 불안
  alternatives_korean:
  - 염려
  - 근심
  - 걱정
  lexicon: Payne Smith
  rationale: 질병과 신음과 병렬되는 내적 고통을 가리키므로, 정서적·심리적 부담을 가장 잘 드러내는 ‘불안’을 택했습니다.
- source_word: ܪ̈ܓܝܓܬܐ
  english_pob_choice: cravings
  chosen_korean: 갈망
  alternatives_korean:
  - 욕망
  - 정욕
  - 욕구
  lexicon: Payne Smith
  rationale: 영어 POB의 ‘cravings’가 성적 의미로 좁혀지지 않도록 하면서도 윤리적 긴장을 유지하려면, 일반적이면서도 강한 ‘갈망’이 적절합니다.
theological_decisions:
- issue: 메시아의 통치와 종말 평화의 단계성
  chosen_reading: 이 장면은 메시아가 왕좌에 앉아 다스리는 평화의 시기를 가리키며, 최종적 완성 이전의 회복 국면으로 번역했습니다.
  alternative_readings:
  - 단순한 일반적 이상세계의 묘사
  - 완전히 종말론적인 최종 상태의 즉각적 묘사
  rationale: 문맥상 ‘자기 나라의 왕좌’와 이어지는 회복 목록은 메시아적 통치 아래의 질서 회복을 보여 주며, 본서의 단계적 종말 서술과도 맞습니다.
  doctrine_reference: 2 Baruch 72-74의 종말 단계 서술
- issue: ‘정죄로 들어갈 것입니다’의 종말적 처리
  chosen_reading: 제거된 악들이 단순히 사라지는 것이 아니라 정죄 아래로 넘겨지는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 그냥 없어진다
  - 심판받는다
  rationale: 시리아어 동사는 제거와 함께 판정적 귀결을 함께 담고 있어, 도덕적·심판적 결말을 분명히 드러내는 번역이 필요합니다.
  doctrine_reference: 악의 최종 심판과 정화라는 묵시문학적 도상
