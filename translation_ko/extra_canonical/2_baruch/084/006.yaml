review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘고난을 받은 후’와 전능하신 분에게서 받는다는 핵심을 대체로 반영합니다. 그러나 조건절의 ‘너희에게 하는 이 말’은 이미 말해진 말씀이라는 완료된 전달을 충분히 나타내지 못하며, ‘예비하시고 예비하신 것’은 같은 뜻의 부자연스러운 중복으로서 ‘마련되어 간직된 것’이라는 원문의 두 동작을 잘못 처리합니다.
  naturalness: 현대 표준어 합쇼체로 다듬을 필요가 있습니다. ‘말하노니’, ‘받으리라’는 문체가 지정된 현대 합쇼체와 맞지 않고, ‘전능하신 이에게서’는 현대 한국어에서 어색합니다.
  terminology: ܚܝܠܬܐ/‘Mighty One’는 존칭을 살려 ‘전능하신 분’으로 옮겼습니다. 원문과 영어 감사 번역이 보존하는 ‘마련되고 간직된’ 대상의 비특정성을 유지하여, 구체적으로 무엇이 예비되었는지는 보태지 않았습니다.
