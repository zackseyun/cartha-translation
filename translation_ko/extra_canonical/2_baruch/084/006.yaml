  to: 그러므로 너희가 고난을 겪은 뒤에 나도 너희에게 말합니다. 너희에게 일러 준 이 말씀들을 들으면, 너희는 전능하신 분에게서 너희를 위해 마련되고 간직된 것을 받을 것입니다.
  rationale: 영어 감사 번역과 대조되는 시리아어 본문의 해당 구절은 전승·쪽 배치가 불안정한 장 단위 자료 안에 있으나, ‘고난 뒤’, ‘말해진 말씀을 들음’, ‘능하신 분에게서 받음’, ‘마련되고 보존된 것’이라는 핵심 의미는 안전하게 확인됩니다. 이를 현대 합쇼체로 옮기고 중복 표현을 해소했습니다.
