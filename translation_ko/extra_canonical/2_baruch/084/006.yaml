  - severity: high
    issue: ‘예비하시고 예비하신 것’
    rationale: 동일한 동사를 반복하여 원문의 ‘준비됨’과 ‘보존됨’의 병렬 의미가 소실되고 문장이 비문에 가깝습니다.
  - severity: medium
