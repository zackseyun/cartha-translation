  text: 그러므로 너희가 고난을 겪은 뒤에 나도 너희에게 말합니다. 너희에게 일러 준 이 말씀들을 들으면, 너희는 전능하신 분에게서 너희를 위해 마련되고 간직된 것을 받을 것입니다.
