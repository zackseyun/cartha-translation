- from: 보십시오, 제가 아직 살아 있는 동안 이 일들을 여러분에게 알려 드립니다. 왜냐하면 제가 여러분에게 좋은 것을 배우게 해야 한다고 말했기 때문입니다. 강하신 분께서 저에게 여러분을 가르치라고 명령하셨고, 제가 죽기 전에 여러분 앞에 그분 심판의 몇 가지 규례를 제시할 것입니다.
  to: 보십시오, 제가 아직 살아 있는 동안에 이 일들을 여러분에게 알려 주었습니다. 이는 여러분이 선한 것을 배워야 한다고 제가 말했기 때문입니다. 능하신 분께서 저에게 여러분을 가르치라고 명령하셨고, 제가 죽기 전에 그분의 심판에 관한 몇 가지 규례를 여러분 앞에 제시할 것입니다.
  rationale: 완료된 가르침의 시제를 바로잡고, ‘should learn’의 수신자 당위를 한국어로 정확하고 자연스럽게 재구성했습니다. 신적 칭호와 심판·규례의 법적 어휘는 유지하되, 한국어 문장 안에서의 수식 관계를 분명히 했습니다.
  reviewer_model: gpt-5.6-terra
