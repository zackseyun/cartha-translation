base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/001.yaml
  text: Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.
translation:
  language: ko
  text: 보십시오, 제가 아직 살아 있는 동안 이 일들을 여러분에게 알려 드립니다. 왜냐하면 제가 여러분에게 좋은 것을 배우게 해야 한다고 말했기 때문입니다. 강하신 분께서 저에게 여러분을 가르치라고 명령하셨고, 제가 죽기 전에 여러분 앞에 그분 심판의 몇 가지 규례를 제시할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  english_pob_choice: the Mighty One
  chosen_korean: 강하신 분
  alternatives_korean:
  - 전능하신 분
  - 능하신 분
  - 하나님
  lexicon: Payne Smith
  rationale: 고유한 신적 호칭의 힘을 살리기 위해 일반명사화하지 않고, POB의 ‘the Mighty One’에 맞춰 직역에 가깝게 옮겼습니다.
- source_word: ܫܦܝܪ̈ܬܐ
  english_pob_choice: what is good
  chosen_korean: 좋은 것
  alternatives_korean:
  - 선한 것
  - 훌륭한 것
  - 마땅한 것
  lexicon: Payne Smith
  rationale: 권면 문맥에서 도덕적으로 좋은 것이라는 뜻이 자연스러워, 과장 없이 간결한 표준어로 옮겼습니다.
- source_word: ܦܘܩ̈ܕܢܘܗܝ
  english_pob_choice: ordinances
  chosen_korean: 규례
  alternatives_korean:
  - 명령
  - 법령
  - 법도
  lexicon: Payne Smith
  rationale: 심판의 맥락에서 단순한 지시보다 공적·규범적 성격이 강하므로, 교회 전통어를 무리하게 좁히지 않는 ‘규례’를 택했습니다.
theological_decisions:
- issue: ‘강하신 분’이라는 신적 호칭 보존
  chosen_reading: 하나님의 이름을 평탄화하지 않고, 본문의 장중한 신적 칭호를 그대로 드러냈습니다.
  alternative_readings:
  - 하나님께서
  - 주님께서
  rationale: 이 단락은 바룩의 발화 권위가 자신이 아니라 ‘강하신 분’의 명령에 근거함을 강조하므로, 호칭의 수사적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 2 Baruch의 계시-권위 구조
- issue: ‘심판의 규례’의 법정적 뉘앙스 보존
  chosen_reading: 하나님의 심판과 관련된 규범적 조항이라는 점을 살려 ‘심판의 규례’로 옮겼습니다.
  alternative_readings:
  - 판단의 명령
  - 재판의 법도
  rationale: 문맥상 단순한 교훈이 아니라 종말론적·법정적 질서를 전제하므로, 심판 관련 어휘를 유지하는 것이 본문의 의도를 더 분명히 드러냅니다.
  doctrine_reference: 신적 심판과 언약적 권면
