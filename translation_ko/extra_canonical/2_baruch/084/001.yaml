review_pass:
  verdict: revise
  source_fidelity: 영어 POB 감사본이 반영한 절의 시제와 논리 관계에 맞추어야 합니다. 초안의 현재형 ‘알려 드립니다’는 완료된 가르침/알림을 나타내는 원문 및 영어본의 과거 완료적 진술과 맞지 않습니다. 또한 ‘여러분에게 좋은 것을 배우게 해야 한다’는 ‘여러분이 좋은 것을 배워야 한다’는 당위의 내용을 부정확하고 어색하게 바꿉니다.
  naturalness: ‘이는 … 때문입니다’와 ‘여러분이 선한 것을 배워야 한다’를 사용하면 현대 표준어 합쇼체에서 자연스럽고, 바룩의 엄정한 권면 어조도 유지됩니다. ‘그분 심판의’는 한국어 소유·관계 표현으로 다소 거칠므로 ‘그분의 심판에 관한’으로 명료하게 처리했습니다.
  terminology: ܚܝܠܬܐ의 표지된 신적 칭호는 일반적인 ‘하나님’으로 평탄화하지 않고 ‘능하신 분’으로 보존했습니다. ܫܦܝܪ̈ܬܐ는 권면 문맥의 도덕적 선을 드러내는 ‘선한 것’으로, ܦܘܩ̈ܕܢܘܗܝ는 법적·규범적 성격을 유지하는 ‘규례’로 옮겼습니다.
