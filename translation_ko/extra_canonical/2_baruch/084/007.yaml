  - severity: high
    issue: ‘나의 의로움’이 ‘vindication/defense’의 의미를 바꿉니다.
    rationale: 원문은 보내신 분 앞에서 화자를 변호하거나 정당화하는 증거라는 뜻이지, 화자 자신의 도덕적·신학적 의로움 자체를 말하지 않습니다.
  - severity: medium
