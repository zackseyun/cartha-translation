base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/034.yaml
  text: Then I lifted up my eyes and wept[a]. And I said at that time, “Far be it from me that I should forsake you or forget you. But only as far as the tombs of the graves of my fathers, from distress and the anguish of lamentation, cry out, so that I may not be forgotten before you and afterward[b]; and these things I have recounted to you.”
  footnotes:
  - marker: a
    text: The closing clause is textually rough at the chapter edge. The surviving Syriac supports a remembrance formula with a third-person plural object ('them'); the most likely antecedent is the fathers just mentioned, though the transition is not fully certain.
    reason: textual_variant
  - marker: b
    text: Or 'that I should be silent toward you or forget you. But only, go as far as the tomb-house of the graves of your fathers; in affliction and in the distress of lamentation cry aloud, so that they may not be forgotten before you, now or afterward; and I too will remember them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 내가 눈을 들어 울었습니다. 그리고 그때 이렇게 말했습니다. “내가 여러분을 저버리거나 잊어버리는 일은 결코 없습니다. 다만 아버지들의 무덤들의 묘실까지, 고통과 애도의 비탄 속에서 외칠 뿐입니다. 그래서 여러분 앞에서, 그리고 그 후에도 내가 잊히지 않게 하려는 것입니다. 그리고 이 일들을 여러분에게 말해 두었습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܣ ܠܝ
  english_pob_choice: Far be it from me
  chosen_korean: 내가 … 하는 일은 결코 없습니다
  alternatives_korean:
  - 그럴 리가 없습니다
  - 감히 … 하지 않겠습니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 시리아어 관용구는 단순한 사과가 아니라 강한 거부와 혐오를 나타내므로, 한국어에서는 자연스럽게 ‘결코 없습니다’로 옮겨 그 단호함을 살렸습니다.
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  english_pob_choice: that I should be silent toward you
  chosen_korean: 여러분을 저버리거나 잊어버리는
  alternatives_korean:
  - 여러분에게 침묵하는
  - 여러분에 대해 침묵하는
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 본문의 최종 확정 읽기는 ‘침묵’이 아니라 ‘저버리다/잊다’의 축을 따라가므로, 문맥에 맞게 시리아어의 실제 의미를 반영했습니다.
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  english_pob_choice: to the tomb-house of the graves of my fathers
  chosen_korean: 아버지들의 무덤들의 묘실까지
  alternatives_korean:
  - 조상들의 묘지까지
  - 아버지들의 무덤집까지
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ‘무덤’과 ‘묘실’의 이중 이미지를 너무 평평하게 만들지 않으면서도 한국어에서 읽히는 형태로 옮겨, 장례 공간의 구체성을 보존했습니다.
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  english_pob_choice: in affliction and in the distress of lamentation cry aloud
  chosen_korean: 고통과 애도의 비탄 속에서 외칠 뿐입니다
  alternatives_korean:
  - 환난과 애통의 곤고 속에서 부르짖을 뿐입니다
  - 고난과 탄식의 괴로움 속에서 외칩니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 고통·애도·비탄의 누적된 정서가 핵심이므로, 한국어에서도 한 번에 매끈하게 합치지 않고 애도의 소리를 드러내는 표현을 택했습니다.
- source_word: ܥܘܗܕܢܘܢ
  english_pob_choice: remember them
  chosen_korean: 잊히지 않게 하려는 것입니다
  alternatives_korean:
  - 그들을 기억하려는 것입니다
  - 기억 속에 남게 하려는 것입니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 직접적인 ‘기억하다’보다, 문맥상 반복되는 remembrance 모티프를 살려 ‘잊히지 않게 하다’로 옮기면 앞뒤의 대조가 더 분명해집니다.
theological_decisions:
- issue: 본문에 없는 다음 절의 내용(거룩한 지성소, 문의, 시온, 깨달음, 귀환)을 섞지 않을 것
  chosen_reading: 34장의 현존 시리아어는 애도의 진술과 기억 요청에 머물며, 다음 절의 내용은 넣지 않았습니다.
  alternative_readings:
  - 다음 절의 내용을 일부 포함해 연결하는 읽기
  rationale: 제공된 최종 수정 판정에 따라, 본절은 무덤과 애도의 언어로 끝나야 하며 후속 절의 소재를 가져오면 본문을 왜곡합니다.
  doctrine_reference: 본문비평과 절 구분 원칙
- issue: 인칭 대명사의 대상과 기억 주체를 문맥상 자연스럽게 정리할 것
  chosen_reading: ‘여러분 앞에서, 그리고 그 후에도 내가 잊히지 않게’로 번역해, 기억/망각의 관계를 한국어에서 분명히 했습니다.
  alternative_readings:
  - ‘그들이 여러분 앞에서 잊히지 않게’처럼 삼인칭 복수로 직역하는 읽기
  rationale: 영문 주석이 지적하듯 말미는 문법적으로 거칠지만, 현재 본절의 흐름에서는 화자 자신의 망각 회피로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 본문의 난구절 처리
