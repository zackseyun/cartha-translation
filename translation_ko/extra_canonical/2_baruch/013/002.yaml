  source_fidelity: 핵심 의미는 충실합니다. 시리아어는 ‘높은 곳에서 한 음성이 와서 내게 말하였다’와 ‘바룩아, 네 발 위에 서서 전능하신 이의 말씀을 들어라’라는 뜻입니다. 다만 ‘음성이 나서’는 ‘came’의 움직임과 발화의 연결을 다소 부자연스럽게 처리합니다.
  naturalness: ‘높은 곳에서 한 음성이 들려와’가 현대 한국어에서 자연스럽고, 인용문도 요청된 합쇼체에 맞추어 ‘들으십시오’로 하는 것이 일관됩니다.
  terminology: ܐܠܗܐ ܚܝܠܬܢܐ 및 영어 POB의 ‘the Mighty One’에 맞춰 ‘전능하신 분’을 유지합니다. 이는 신적 호칭을 보존하면서도 특정 교파적 해석을 덧붙이지 않습니다.
  issues:
