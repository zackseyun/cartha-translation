  to: 그리고 높은 곳에서 한 음성이 들려와 내게 말했습니다. “바룩아, 일어서서 전능하신 분의 말씀을 들으십시오.”
  rationale: 원문의 의미와 영어 POB의 ‘Mighty One’을 보존하면서, ‘음성이 왔다’라는 표현을 자연스러운 한국어로 옮기고 직접화법을 합쇼체로 통일했습니다. ‘네 발 위에’라는 히브리어·아람어권 관용적 표현은 한국어에서 자연스러운 ‘일어서서’로 옮겼습니다.
