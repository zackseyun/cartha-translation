    issue: ‘높은 곳에서 음성이 나서’의 표현
    rationale: 원문의 ‘한 음성이 높은 곳에서 왔다’에 해당하나, 한국어에서는 ‘음성이 나서’가 다소 어색합니다. ‘한 음성이 들려와’가 자연스럽습니다.
  - severity: low
    issue: 직접화법의 종결 어미가 합쇼체와 불일치
    rationale: 본문 서술은 ‘말했습니다’인데 명령은 ‘들어라’입니다. 지정된 현대 공식-공손체에 맞게 ‘들으십시오’로 통일합니다.
  revised_text: 그리고 높은 곳에서 한 음성이 들려와 내게 말했습니다. “바룩아, 일어서서 전능하신 분의 말씀을 들으십시오.”
