translation:
  language: ko
  text: 그 일들 후에 나 바룩은 강가에 서 있었고, 높은 곳에서 음성이 와서 나에게 말했습니다:[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  english_pob_choice: after these things
  chosen_korean: 그 일들 후에
  alternatives_korean:
  - 이 일들 후에
  - 그 뒤에
  lexicon: Payne Smith
  rationale: 서사 연결어로서 시간 경과를 자연스럽게 살리되, 원문의 사건 연속성을 분명히 드러내는 표현을 택했습니다.
- source_word: ܩܐܡ ܗܘܝܬ ܥܠ ܨܝܕܐ ܕܢܗܪܐ
  english_pob_choice: was standing on the bank of the river
  chosen_korean: 강가에 서 있었고
  alternatives_korean:
  - 강둑에 서 있었고
  - 강의 언덕에 서 있었고
  lexicon: Payne Smith
  rationale: 여기서 ܨܝܕܐ ܕܢܗܪܐ는 강가/강둑의 위치를 가리키므로, 본문 주석상 대조되는 산 시온 해석을 따르지 않고 강가로 옮겼습니다.
- source_word: ܡܢ ܡܪܘܡܐ
  english_pob_choice: from the height
  chosen_korean: 높은 곳에서
  alternatives_korean:
  - 높은 데서
  - 하늘 높은 곳에서
  lexicon: Payne Smith
  rationale: ‘from the height’의 공간적 위상을 살리되, 한국어에서 어색한 직역을 피하면서도 초월적 발화를 암시하도록 했습니다.
- source_word: ܩܠܐ ... ܘܐܡ̇ܪ ܠܝ
  english_pob_choice: a voice came ... and said to me
  chosen_korean: 음성이 와서 나에게 말했습니다
  alternatives_korean:
  - 소리가 와서 나에게 말했습니다
  - 목소리가 와서 내게 말했습니다
  lexicon: Payne Smith
  rationale: 원문의 ‘음성’은 단순 소리보다 계시적 발화를 가리키므로 ‘음성’으로 옮기고, 이어지는 직접 발화를 자연스럽게 연결했습니다.
theological_decisions:
- issue: 장소 전승의 차이
  chosen_reading: 본문은 산 시온이 아니라 강가라는 시리아어 본문을 따릅니다.
  alternative_readings:
  - 산 시온으로 조정한다
  - 대조 전승에 맞춰 장소를 조화시킨다
  rationale: 이 절은 Ceriani 본문을 주본문으로 삼는 프로젝트 원칙에 따라 번역해야 하므로, 대조 전승의 이견은 본문을 바꾸지 않고 주석으로만 처리하는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
