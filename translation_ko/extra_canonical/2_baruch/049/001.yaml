base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
  footnotes:
  - marker: a
    text: Or 'which now sustain the living'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 이제 제가 전능자이신 당신께 묻고, 모든 것을 지으신 분께 자비를 구하겠습니다. 당신의 날에 살아 있는 이들은 어떤 형상으로 살겠습니까? 또는 그때 이후에 오는 이들의 광채는 어떻게 보존되겠습니까? 그들은 현재의 이 형상을 입겠습니까? 또 이 인간의 형상들은 그때에도 남아 살아 있는 존재로 세워지겠습니까? 아니면 당신께서 세상에 존재해 온 것들과 세상 자체를 바꾸시겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  english_pob_choice: O Mighty One
  chosen_korean: 전능자이신 당신
  alternatives_korean:
  - 전능하신 분
  - 능력 많으신 분
  - 능하신 분
  lexicon: Payne Smith
  rationale: 시리아어 호격의 하나님 칭호를 직역하기보다, 기도문 호칭으로 자연스러운 존칭형을 택하되 '전능자'로 신적 위엄을 분명히 드러냈습니다.
- source_word: ܐܫܐܠ ܪ̈ܚܡܐ
  english_pob_choice: I will seek mercy
  chosen_korean: 자비를 구하겠습니다
  alternatives_korean:
  - 긍휼을 구하겠습니다
  - 은혜를 구하겠습니다
  - 자비를 청하겠습니다
  lexicon: Payne Smith
  rationale: ܪ̈ܚܡܐ는 ‘자비/긍휼’의 범주이므로, 청원적 기도의 어조를 살리면서도 본문의 핵심 의미를 보존했습니다.
- source_word: ܕܡܘܬܐ
  english_pob_choice: form
  chosen_korean: 형상
  alternatives_korean:
  - 모양
  - 모습
  - 형태
  lexicon: Payne Smith
  rationale: 문맥상 죽음이 아니라 존재 방식의 ‘형상/모양’을 묻는 것이므로, 신체적·실재적 뉘앙스를 유지하는 ‘형상’을 택했습니다.
- source_word: ܡܫܟܚܝܢ / ܘܢܫܬܪܪܘܢ
  english_pob_choice: be established as living beings
  chosen_korean: 살아 있는 존재로 세워지겠습니까
  alternatives_korean:
  - 살아 있는 자로 세워지겠습니까
  - 생명체로 확립되겠습니까
  - 살아 있는 것으로 굳게 서겠습니까
  lexicon: Payne Smith
  rationale: 문장의 수동적·종말론적 구성을 살려, 단순한 생존이 아니라 ‘세워짐/확립됨’의 뉘앙스를 반영했습니다.
