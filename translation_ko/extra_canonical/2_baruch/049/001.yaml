  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
  footnotes:
  - marker: a
    text: Or 'which now sustain the living'.
    reason: previous_rendering
translation:
  language: ko
  text: 그렇지만 제가 전능자이신 당신께 묻고, 모든 것을 지으신 분께 자비를 구하겠습니다. 그분의 날들에 사는 이들은 어떤 형상으로 살겠습니까? 또는 그때 이후에 오는 이들의 영광은 어떻게 보존되겠습니까? 그들은 이제의 이 형상을 입겠습니까, 그리고 그 사람의 모습들은 그때도 남아 살아 있는 존재로 세워지겠습니까? 아니면 당신께서 이 세상에 있었던 것들, 또 세상 자체를 바꾸시겠습니까?[a][b]
  philosophy: optimal-equivalence
