base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/043/001.yaml
  text: 'But you, Baruch, fix your heart on what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will not again see the evil things that are now happening.

    Therefore go and command my people, and do not stir them up, because after these things, in the times to come, many days of affection will come. And I will make known to you and speak in your understanding.'
translation:
  language: ko
  text: 그러나 바룩이여, 네게 말해진 일에 마음을 굳게 하고, 네게 보여진 것들을 깨달으십시오. 네게는 영원한 위로가 풍성히 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܘܫ ܐܬܩܢ ܠܒܟ
  english_pob_choice: fix your heart
  chosen_korean: 마음을 두다
  alternatives_korean:
  - 마음을 정하다
  - 마음을 고정하다
  - 마음을 바로잡다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 시리아어는 내면을 굳게 세우라는 권면이므로, 한국어에서는 자연스러운 합쇼체로 ‘마음을 두다’로 옮겨 원문의 집중·준비 이미지를 살렸습니다.
- source_word: ܘܐܣܬܟܠ ܐܝܠܝܢ ܕܐܬܚܘܝ ܠܟ
  english_pob_choice: understand the things shown to you
  chosen_korean: 네게 보인 것들을 깨달으십시오
  alternatives_korean:
  - 네게 보인 것들을 이해하십시오
  - 네게 드러난 것들을 알아차리십시오
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ‘보이다’ 계열의 계시적 표현을 살리면서, 단순 인지보다 의미 파악을 담는 ‘깨닫다’가 문맥에 더 맞습니다.
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ ܕܒܠܥܕܡ
  english_pob_choice: much eternal consolation
  chosen_korean: 많은 영원한 위로
  alternatives_korean:
  - 많은 영원한 위안
  - 풍성한 영원한 위로
  - 큰 영원한 위로
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ܒܘܝܐܐ는 단순 감정적 위안보다 종말론적 위로/격려의 뉘앙스를 가지므로, POB의 의미를 따라 ‘영원한 위로’로 옮겼습니다.
theological_decisions:
- issue: 바룩에게 주어지는 위로의 성격
  chosen_reading: 현재의 고난에 대한 심리적 진정이 아니라, 영원에 속한 종말론적 위로로 읽습니다.
  alternative_readings:
  - 일반적인 위안
  - 미래에 대한 막연한 격려
  rationale: 본문은 ‘많은’과 ‘영원한’이 결합된 위로를 제시하여, 바룩의 현재 상황을 넘어서는 구속사적 위로를 강조합니다.
  doctrine_reference: apocalyptic consolation / eschatological encouragement
