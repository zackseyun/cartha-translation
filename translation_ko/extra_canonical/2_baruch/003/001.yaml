translation:
  language: ko
  text: 내가 말했습니다. “오 주님, 나의 주님, 제가 바로 이것을 위해 세상에 왔습니까? 제 어머니에게 닥친 악을 보려고 말입니까? 아닙니다, 나의 주님.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡܝ
  english_pob_choice: my mother
  chosen_korean: 제 어머니
  alternatives_korean:
  - 나의 어머니
  - 내 어머니
  - 제 도시
  lexicon: Payne Smith
  rationale: 시리아어의 ‘어머니’ 이미지를 그대로 살려 예루살렘/시온에 대한 애가적 의인화를 보존했습니다. 본문 의미를 미리 풀이해 ‘도시’로 바꾸지 않았습니다.
- source_word: ܐܬܝܬ ܠܥܠܡܐ
  english_pob_choice: have I come into the world
  chosen_korean: 내가 세상에 왔습니까
  alternatives_korean:
  - 제가 태어났습니까
  - 제가 이 세상에 들어왔습니까
  lexicon: Payne Smith
  rationale: ‘세상에 왔다’는 출생·존재 진입을 자연스럽게 드러내며, 수사적 질문의 절박함을 유지합니다.
- source_word: ܒܝܫܬܗ̇
  english_pob_choice: the evil of my mother
  chosen_korean: 어머니의 악
  alternatives_korean:
  - 어머니의 재앙
  - 어머니의 불행
  - 어머니의 파멸
  lexicon: Payne Smith
  rationale: 시리아어의 핵심어는 ‘악/나쁜 일’이며, POB의 선택을 따라 ‘악’으로 옮겨 판단적·도덕적 긴장을 남겼습니다. 이는 단순한 비극보다 더 강한 표현입니다.
- source_word: ܠܐ
  english_pob_choice: No, my Lord
  chosen_korean: 아닙니다, 나의 주님이십니다
  alternatives_korean:
  - 아닙니다, 주님
  - 아니오, 나의 주님
  lexicon: Common Korean reverential usage
  rationale: 직접 호칭에서는 존대 종결을 유지해 합쇼체 청원문의 어조를 살렸습니다.
theological_decisions:
- issue: ‘어머니’의 지시 대상
  chosen_reading: 본문의 ‘어머니’는 문자적 어머니라기보다 예루살렘/시온을 가리키는 애가적 비유로 읽었습니다.
  alternative_readings:
  - 실제 모친에 대한 개인적 탄식
  - 단순히 민족 전체를 가리키는 일반 은유
  rationale: 시온을 어머니로 부르는 유대 문학적 의인화는 비탄과 언약적 애착을 함께 전달합니다. 본문을 설명적으로 바꾸지 않고 비유를 그대로 두는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 예루살렘-시온 의인화의 예언서/애가 전통
