  verdict: revise
  source_fidelity: 시리아어 본문은 조건절(‘제가 당신 앞에서 은총을 얻었다면’) 뒤에, 주님의 ‘자비’가 화자의 영을 속히 당신께 데려가도록 해 달라는 청원을 둡니다. 현 번역은 조건절을 반영했으나 ‘당신께서 보시기에’라는 관계적 표현이 빠졌고, ‘영혼이 … 돌아가게’는 원문의 ‘내 영을 당신께로 거두다/데려가다’를 다소 약화합니다.
  naturalness: 합쇼체 청원문으로 자연스럽게 하되, 하나님께 드리는 직접 호칭에는 ‘주님’을 사용하고 ‘거두어 주십시오’로 원문의 죽음을 바라는 완곡한 청원을 자연스럽게 옮기는 것이 적절합니다.
  terminology: ܛܝܒܘܬܐ는 문맥상 ‘은총’, ܪ̈ܚܡܝܟ은 ‘자비’, ܪܘܚܝ는 ‘제 영’, ‘fathers’는 직계 부친들로 좁히지 않는 ‘조상들’로 옮깁니다. ‘어머니’는 본문의 은유를 유지합니다.
  issues:
