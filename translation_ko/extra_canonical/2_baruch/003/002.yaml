revisions:
- from: 내가 당신께 은총을 입었다면, 당신의 자비로 내 영혼이 속히 당신께로 돌아가게 해 주십시오. 그리하여 내가 내 조상들에게로 돌아가서 내 어머니의 멸망을 보지 않게 해 주십시오.
  to: 제가 주님께서 보시기에 은총을 얻었다면, 주님의 자비로 제 영을 속히 주님께로 거두어 주십시오. 그리하여 제가 제 조상들에게로 가서 제 어머니의 멸망을 보지 않게 해 주십시오.
  rationale: 조건절의 ‘주님 앞에서’를 보완하고, 자비가 화자의 영을 주님께로 취하는 원문의 청원을 ‘제 영을 … 거두어 주십시오’로 명료하게 옮겼습니다. ‘어머니’는 본문이 지닌 도시의 의인화 은유를 설명 없이 보존했습니다.
