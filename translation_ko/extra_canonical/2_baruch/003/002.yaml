    rationale: 원문 조건절은 은총을 얻은 장소·관계를 ‘당신 앞에서’로 명시합니다.
  - severity: medium
    issue: ‘내 영혼이 속히 당신께로 돌아가게’는 원문의 행위 주체와 동작을 충분히 드러내지 못합니다.
    rationale: 원문은 ‘당신의 자비가 제 영을 당신께로 데려가게/거두게 해 달라’는 청원입니다. ‘거두다’가 한국어에서 이 문맥의 죽음에 대한 청원을 자연스럽게 전달합니다.
