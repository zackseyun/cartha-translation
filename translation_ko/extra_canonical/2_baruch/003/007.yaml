  source_fidelity: 초안은 ‘악한 행실’, ‘쓴 과부’, ‘굴욕’, ‘노략물’이라는 주요 요소를 반영하지만, ‘보게 하다’를 ‘알게 하다’로 바꾸어 감각 동사를 약화했고, ‘sweet spoil’의 ‘달콤한’을 누락했습니다. 또한 ‘concerning this city’의 관계를 자연스럽게 드러낼 필요가 있습니다.
  naturalness: ‘이 성읍이 악한 행실로 말미암아 이 성읍이’는 주어가 중복되고 수식 관계가 불분명합니다. ‘이 성읍의 악한 행실 때문에’ 및 ‘쓰디쓴 과부’가 현대 표준 한국어 문장으로 더 자연스럽습니다.
  terminology: ‘성읍’은 본문의 격식 있는 성서 문맥에 적절합니다. ‘과부’와 ‘노략물’도 유지할 수 있습니다. ‘sweet spoil’은 해석적으로 완화하지 않고 ‘달콤한 노략물’로 옮겨야 합니다.
  issues:
  - severity: high
    issue: ‘sweet spoil’의 ‘sweet’가 번역에서 빠졌습니다.
    rationale: 비유의 대조와 원문/영어 감사본의 어휘 요소가 누락됩니다.
  - severity: medium
    issue: ‘see’를 ‘알게 하다’로 번역했습니다.
    rationale: 원문의 시각 동사를 유지하여 ‘보게 하다’로 옮기는 것이 최적 등가 원칙에 더 충실합니다.
  - severity: medium
    issue: ‘이 성읍이 악한 행실로 말미암아 이 성읍이’는 문법적 관계가 불명확하고 부자연스럽습니다.
    rationale: 악한 행실의 소유자를 ‘이 성읍의’로 명시하고, 뒤 절의 반복은 비교 절에서만 유지하는 편이 자연스럽습니다.
  revised_text: 또 그들이 이 성읍의 악한 행실 때문에 이 성읍이 쓰디쓴 과부 같고, 그 굴욕이 달콤한 노략물 같다는 것을 이 성읍에 관하여 보게 하시려는 것입니까?ᵃ”
  revised_footnotes:
  - marker: a
    text: 또는 ‘이 성읍에서 보게 하시려는 것입니까?’
    reason: 시리아어 전치사 ܡܢ의 ‘이 성읍에 관하여’와 ‘이 성읍에서’라는 가능한 두 해석을 보존합니다.
  revision_rationale: 직접적인 시각 동사와 ‘달콤한’의 비교어를 복원하고, 전치사구의 해석상 모호성은 각주로 보존했습니다. 문장은 합쇼체의 현대적 정중 문체로 다듬었습니다.
