translation:
  language: ko
  text: 그러나 이제 나는 너와 예레미야에게, 그리고 너희와 같은 모든 이들에게 말합니다. 이 도시를 떠나야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܟܝܠ ܕܝܢ
  english_pob_choice: But now
  chosen_korean: 그러나 이제
  alternatives_korean:
  - 이제는 그렇지만
  - 그런데 이제
  lexicon: Syriac connective usage
  rationale: 대조 접속사와 시점 전환을 간결하게 살려, 문맥상 새 국면의 발화를 자연스럽게 나타냈습니다.
- source_word: ܠܟ ܘܠܐܪܡܝܐ ܘܠܟܠ ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ
  english_pob_choice: to you, and to Jeremiah, and to all those who are like you
  chosen_korean: 너와 예레미야에게, 그리고 너희와 같은 모든 이들에게
  alternatives_korean:
  - 너와 예레미야와 너희와 같은 모든 이들에게
  - 너와 예레미야에게, 그리고 너희처럼 된 모든 이들에게
  lexicon: Syriac pronominal and comparative phrasing
  rationale: 직접 호칭의 병렬 구조를 유지하면서, 'like you'는 인물의 동일한 경향과 동류성을 드러내는 '너희와 같은'으로 옮겼습니다.
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ ܗܕܐ ܡܕܝܢܬܐ
  english_pob_choice: that you should depart from this city
  chosen_korean: 이 도시를 떠나야 합니다
  alternatives_korean:
  - 이 도시에서 물러나야 합니다
  - 이 도시에서 떠나야 합니다
  lexicon: Syriac idiom / Payne Smith
  rationale: 직역하면 '스스로를 이 도시로부터 살피다'에 가깝지만, 영어 POB의 주석대로 실제 뜻은 떠남이므로 한국어도 그 관용적 의미를 분명히 살렸습니다.
theological_decisions:
- issue: 예레미야와 '너희와 같은 모든 이들'에게 주어지는 명령의 어조
  chosen_reading: 공적 경고의 직접화된 명령으로 옮겨, 운명적 경고의 긴박함을 살렸습니다.
  alternative_readings:
  - 완곡한 권고로 풀어 쓰기
  - 미래형 설명문으로 처리하기
  rationale: 본문은 예언적 경고의 발화이므로, 한국어에서도 간명한 명령/권고 체계를 유지하는 편이 원문의 긴장과 기능에 부합합니다.
  doctrine_reference: 예언 문체와 경고 발화의 수행성
