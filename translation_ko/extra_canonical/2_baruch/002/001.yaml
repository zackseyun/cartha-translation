translation:
  language: ko
  text: 그러나 이제 내가 너와 예레미야와 너희와 같은 모든 이들에게 말합니다. 이 도시에서 떠나십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이 도시로부터 너희 자신을 살피라”입니다. 이는 물러나거나 떠나라는 뜻의 시리아어 관용 표현입니다.
    reason: lexical_choice
