translation:
  language: ko
  text: 그리고 나는 대답하여 말했습니다. “이 다가오는 환난이 오랫동안 계속되겠으며, 이 곤경이 많은 해를 품겠습니까?”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥ̣ܢܝܬ ܘܐܡ̣ܪܬ
  english_pob_choice: And I answered and said
  chosen_korean: 나는 대답하여 말했습니다
  alternatives_korean:
  - 내가 대답하여 말했습니다
  - 그리고 나는 대답하며 말했습니다
  lexicon: Smith
  rationale: 서술 공식답변 구조를 한국어에서 자연스럽게 살리되, 합쇼체 서술에 맞게 간결하게 옮겼습니다.
- source_word: ܐܘܠܨܢܐ
  english_pob_choice: tribulation
  chosen_korean: 환난
  alternatives_korean:
  - 재난
  - 고난
  - 압박
  lexicon: Payne Smith
  rationale: 종말론적 문맥에서 오는 강한 압박과 고통을 가리키므로, 한국어에서 가장 직접적인 대응어로 ‘환난’을 택했습니다.
- source_word: ܙܒܢܐ ܣܓܝܐܐ
  english_pob_choice: last a long time
  chosen_korean: 오랫동안 계속되겠으며
  alternatives_korean:
  - 긴 기간 지속되겠으며
  - 오랜 세월 이어지겠으며
  lexicon: Smith
  rationale: 지속 기간의 길이를 드러내는 표현으로, 과장 없이 시간의 장구함을 자연스럽게 전달합니다.
- source_word: ܐܚܝܕܐ ܗܝ ܐܢܢܩܝ
  english_pob_choice: will this necessity embrace many years
  chosen_korean: 이 곤경이 많은 해를 품겠습니까
  alternatives_korean:
  - 이 필연이 많은 해를 안겠습니까
  - 이 긴급한 일이 여러 해를 끌겠습니까
  lexicon: Payne Smith
  rationale: ܐܢܢܩܝ는 단순한 ‘필연’보다 절박한 강제성/곤란의 뉘앙스가 있어, 문맥상 ‘곤경’으로 옮겨 환난과 병렬을 이루게 했습니다. ‘품다’는 ܐܚܝܕܐ의 포괄·포섭 이미지를 살립니다.
theological_decisions:
- issue: 바룩의 질문이 예언적 환난의 시간성을 묻는다는 점
  chosen_reading: 문장을 직설적 질문으로 유지하여, 다가오는 환난의 지속 기간과 규모에 대한 경고를 드러냈습니다.
  alternative_readings:
  - 장황하게 풀어 ‘오랫동안 이어질 큰 환난’을 설명문처럼 처리
  - ‘필연’을 중립적으로 번역해 고통의 긴박성을 약화
  rationale: 본문은 바룩이 다가오는 고통의 기간을 묻는 장면이므로, 질문의 긴장과 종말론적 불안을 그대로 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: apocalyptic discourse; source-driven narrative tension
