    text: 직역하면 “이것들이 바로 그것들입니다.” 제시된 시리아어 본문은 이 지점에서 뒤따르는 설명이 완결되지 않은 상태이므로, 이를 보충하지 않고 말줄임표로 나타냈습니다.
    reason: 시리아어의 강조적 지시 표현을 자연스러운 한국어로 옮기고, 본문 증거의 미완결성을 표시합니다.
