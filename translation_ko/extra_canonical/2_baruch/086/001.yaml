translation:
  language: ko
  text: 그러므로 여러분이 이 편지를 받거든, 여러분의 회중에서 신중하게 읽으십시오. 그리고 주간의 날들에[a] 그 말들을 더욱 유의하여 살피십시오. 그러면 기억하고 바로잡히도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘주간들의 날들에’입니다. 이 시간 표현의 정확한 뜻은 불확실하며, 특정한 예전일을 가리키는 것으로 단정하지 않았습니다.
    reason: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ의 문자적이면서도 불안정한 표현을 보존하고, ‘주의 날들’이 유발하는 ‘주님의 날’이라는 오독을 막기 위해서입니다.
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  english_pob_choice: with care
  chosen_korean: 주의하여
  alternatives_korean:
  - 신중히
  - 세심하게
  - 조용히
  lexicon: Payne Smith
  rationale: 공개 낭독의 맥락에서 과도한 해석 없이 경청의 태도와 신중함을 함께 살리는 표현이므로, '주의하여'가 가장 자연스럽고 원문에 가깝습니다.
- source_word: ܬܬܗܪܘܢ
  english_pob_choice: give more earnest attention
  chosen_korean: 더욱 자세히 살피십시오
  alternatives_korean:
  - 더욱 간절히 ध्यान하십시오
  - 더욱 주의 깊게 생각하십시오
  - 더욱 유의하십시오
  lexicon: Payne Smith
  rationale: 동사의 핵심은 단순한 관조보다 세밀한 주목과 숙고에 있으므로, 한국어에서는 '자세히 살피다'로 옮기고 부사어 '더욱'으로 강도를 드러냈습니다.
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  english_pob_choice: on the days of the weeks
  chosen_korean: 주의 날들에
  alternatives_korean:
  - 주간의 날들에
  - 주중의 날들에
  - 주간들 속의 날들에
  lexicon: Payne Smith
  rationale: 본문이 문자적으로는 '주(週)의 날들'에 가깝지만, 이 단락의 주어진 전승과 본문 경계가 불안정하므로 영어 POB가 유지한 신중한 모호성을 한국어에서도 과도하게 풀지 않고, 의미를 가장 직접적으로 전달하는 '주의 날들'로 옮겼습니다.
- source_word: ܬܬܪܨܘܢ
  english_pob_choice: be set right
  chosen_korean: 바로잡힐 것입니다
  alternatives_korean:
  - 교정될 것입니다
  - 곧게 될 것입니다
  - 올바르게 되실 것입니다
  lexicon: Payne Smith
  rationale: 동사는 '곧게 하다/바르게 하다'의 의미를 가지므로, 결과 상태를 살리는 수동 표현 '바로잡히다'가 도덕적·교정적 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: 공동체적 낭독과 교정의 어조를 어떻게 살릴 것인가
  chosen_reading: 공동체가 편지를 주의하여 낭독하고, 그 말씀을 더 깊이 살핀 뒤 기억과 교정에 이르는 실천적 권면으로 옮겼습니다.
  alternative_readings:
  - 예배적 묵상 중심의 문장
  - 금식일 전통을 암시하는 문장
  rationale: 이 절은 교리 진술이 아니라 공동체적 실천 권면이므로, 후대의 예전 용어를 덧씌우지 않고 본문의 실제 목적어인 '읽기-살피기-기억-바로잡힘'의 흐름을 유지했습니다.
  doctrine_reference: 공동체 권면과 성경 낭독의 실천적 기능
