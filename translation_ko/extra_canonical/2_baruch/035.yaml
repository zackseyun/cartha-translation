base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/035.yaml
  text: 'And I[a], Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and my eyelids a fountain of tears[b].

    For how can I find rest over Zion?

    And how can I mourn in grief and endure?

    For the people whom I nourished

    have been shaken with terror[d][c],

    and those who were formerly my glory have seen evil.”'
  footnotes:
  - marker: a
    text: The Syriac reads 'holy gate' quite naturally. Some English renderings use 'holy place,' likely to clarify the sanctuary setting.
    reason: lexical_alternative
  - marker: b
    text: The middle of the lament on this page is textually less secure in the present substrate. The Zion/Jerusalem pairing and the reference to former priestly sacrifice follow the broader chapter tradition, but this portion should be spot-checked against a control witness when available.
    reason: textual_variant
  - marker: c
    text: Or 'How can I mourn over Jerusalem?'.
    reason: previous_rendering
  - marker: d
    text: Or 'and my eyelids a fountain of tears.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 나 바룩은 거룩한 문으로 가서, 겸손히 앉아 울며 말했습니다.


    “오 내 눈아, 샘이 되라.

    내 눈꺼풀아, 눈물의 샘이 되라.

    시온 위에서 내가 어찌 위로를 얻겠습니까?

    슬픔 가운데 내가 어찌 애통하며 견디겠습니까?

    내가 기르던 백성은 두려움에 흔들렸고,

    옛날에 내 영광이었던 이들은 악을 보았습니다.”[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  english_pob_choice: the holy gate
  chosen_korean: 거룩한 문
  alternatives_korean:
  - 거룩한 문간
  - 성스러운 문
  lexicon: Payne Smith
  rationale: Syriac ܬܪܥܐ는 기본적으로 ‘문/문짝/문간’을 뜻하므로, 성전 구역의 구체성을 살리면서도 자연스러운 한국어로 ‘거룩한 문’이라 옮겼습니다.
- source_word: ܡ̈ܟܝܟܐܝܬ
  english_pob_choice: in humility
  chosen_korean: 겸손히
  alternatives_korean:
  - 낮추어
  - 낮은 마음으로
  lexicon: Payne Smith
  rationale: 행동 양태를 나타내는 부사로서, 바룩의 애통한 자세를 간결하게 드러내는 ‘겸손히’가 가장 적절합니다.
- source_word: ܡܒܘ̈ܥܐ
  english_pob_choice: springs
  chosen_korean: 샘
  alternatives_korean:
  - 샘물
  - 근원
  lexicon: Payne Smith
  rationale: 눈이 눈물의 근원처럼 흐른다는 시적 이미지를 살리기 위해 복수적 이미지라도 한국어에서는 자연스러운 ‘샘’으로 옮겼습니다.
- source_word: ܐܡܘ̈ܬܐ ܕܡ̈ܝܐ
  english_pob_choice: a fountain of tears
  chosen_korean: 눈물의 샘
  alternatives_korean:
  - 눈물의 원천
  - 눈물의 분수
  lexicon: Payne Smith
  rationale: 제공된 시리아어 본문은 ‘물의 통로/수로’ 계열로도 읽힐 여지가 있지만, 현재 대조 본문과 영어 주석 전통이 ‘눈물의 샘’ 이미지를 지지하므로 문맥상 가장 이해 가능한 시적 표현을 취했습니다.
- source_word: ܐܬܬܢܝܚ
  english_pob_choice: find rest
  chosen_korean: 위로를 얻겠습니까
  alternatives_korean:
  - 쉬겠습니까
  - 안정을 찾겠습니까
  lexicon: Payne Smith
  rationale: 이 동사는 휴식·안정·진정의 의미를 가지므로, 시온을 향한 애통의 정서를 살리면서 한국어에서 자연스러운 감정적 귀결인 ‘위로를 얻다’로 옮겼습니다.
- source_word: ܒܙܘܥܐ ܐܬܬܙܝܥ
  english_pob_choice: have been shaken with terror
  chosen_korean: 두려움에 흔들렸고
  alternatives_korean:
  - 공포에 떨었고
  - 떨림 속에 흔들렸고
  lexicon: Payne Smith
  rationale: ‘흔들리다’는 동사적 이미지와 ‘두려움’의 감정을 함께 보존하여, 외적 충격과 내적 공포를 모두 드러냅니다.
theological_decisions:
- issue: 본문의 애통 대상 표현
  chosen_reading: 제공된 시리아어 본문을 따라 ‘시온’과 ‘내가 기르던 백성’의 애통으로 유지했습니다.
  alternative_readings:
  - ‘예루살렘’으로 해석하는 전통적 정리
  - 보다 일반적인 ‘성전/거룩한 곳’으로 완화하는 해석
  rationale: 영어 주석 전통에는 예루살렘을 보충하려는 경향이 있으나, 본문 근거가 약하므로 본문에 명시된 시온과 양육한 백성의 상실을 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: 본문비평/원문 우선 원칙
- issue: ‘눈꺼풀’ 이미지의 보존
  chosen_reading: ‘내 눈꺼풀’로 직역적 이미지를 유지하지 않고, 한국어 시적 자연성을 고려해 ‘눈물의 샘’으로 정리했습니다.
  alternative_readings:
  - ‘내 눈꺼풀’
  - ‘눈꺼풀들’
  rationale: 시리아어 전승과 영어 주석 사이에 이 부분의 본문적 불안정성이 있으므로, 독자가 즉시 이해할 수 있는 애가 표현을 택하되 각주로 대안 가능성을 남기는 것이 적절합니다.
  doctrine_reference: 시적 본문 처리 원칙
