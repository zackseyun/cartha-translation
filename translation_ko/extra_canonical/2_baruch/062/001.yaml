translation:
  language: ko
  text: 그리고 당신이 보신 일곱째 검은 물, 이것은 예로보암의 꾀로 말미암아 생긴 왜곡입니다. 그는 금송아지 두 마리를 만들려고 꾀를 냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이것들은 왜곡입니다.”
    reason: 영어 POB 감사 흔적에 보존된 대안 번역을 제시합니다. 그러나 본문은 시리아어의 여성 단수 지시·계사에 따라 ‘이것은 왜곡입니다’를 유지합니다.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܚܫ̈ܟܐ / ܐܘܟܡ̈ܐ
  english_pob_choice: black waters
  chosen_korean: 검은 물
  alternatives_korean:
  - 어두운 물
  lexicon: Syriac lexicon / apocalyptic symbol usage
  rationale: 색채 대비를 살려 심판적·상징적 이미지를 직접 전달하기 위해 ‘검은’으로 옮겼습니다.
- source_word: ܚܒܠܬܐ
  english_pob_choice: perversion
  chosen_korean: 왜곡
  alternatives_korean:
  - 타락
  - 일그러짐
  lexicon: Syriac lexicon / semantic field of corruption, distortion
  rationale: 이 구절의 핵심은 예로보암의 계략이 예배와 공동체 질서를 비틀어 놓은 것이라는 점이므로, 도덕적 타락보다 구조적·신학적 ‘왜곡’을 선택했습니다.
- source_word: ܡܠܟܐ ܕܝܘܪܒܥܡ / Jeroboam
  english_pob_choice: Jeroboam
  chosen_korean: 예로보암
  alternatives_korean:
  - 여로보암
  lexicon: established Korean biblical proper name
  rationale: 한국어 성경에서 널리 통용되는 표기를 따랐습니다.
- source_word: ܬܪ̈ܝܢ ܥ̈ܓܠܐ ܕܕܗܒܐ
  english_pob_choice: two calves of gold
  chosen_korean: 두 송아지의 금
  alternatives_korean:
  - 두 금송아지
  - 금으로 만든 두 송아지
  lexicon: Syriac syntax / nominal construct
  rationale: 원문은 ‘금’이 송아지들을 수식하는 구성이라, 과도한 의역을 피하면서도 한국어에서 자연스럽게 읽히도록 ‘두 송아지의 금’으로 옮겼습니다.
theological_decisions:
- issue: 사본/어감상 판정 어구 'this is' 대 'these are'
  chosen_reading: 문맥상 ‘이 왜곡입니다’로 단수 판정을 유지했습니다.
  alternative_readings:
  - ‘이것들은 왜곡입니다’
  - ‘이것은 왜곡입니다’
  rationale: 시리아어 원문은 여성 단수 지시사와 계사로 ‘왜곡/부패’(여성 단수)에 맞추고 있으므로, 한국어도 단수 판정을 유지하는 것이 원문 구조를 더 정확히 반영합니다.
  doctrine_reference: 원문 문법 보존
- issue: 예로보암의 행위 묘사
  chosen_reading: ‘계략으로 생긴’이라고 하여 단순한 역사 보고가 아니라 우상숭배적 기획의 도덕적 책임을 드러냈습니다.
  alternative_readings:
  - ‘생겨난’
  - ‘빚어진’
  rationale: 본문은 예로보암의 의도적 계획을 강조하므로, 중립적 발생보다 책임을 띤 원인성을 드러내는 표현이 적절합니다.
  doctrine_reference: 본문의 인과·책임성 보존
