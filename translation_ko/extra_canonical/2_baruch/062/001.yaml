revisions:
- from: 그리고 네 번째 검은 물은 — 예로보암의 계략으로 생긴 이 왜곡입니다. 그는 두 송아지의 금을 만들려고 계략을 꾸몄습니다.[a]
  to: 그리고 당신이 보신 일곱째 검은 물, 이것은 예로보암의 꾀로 말미암아 생긴 왜곡입니다. 그는 금송아지 두 마리를 만들려고 꾀를 냈습니다.[a]
  rationale: 순서 수사를 ‘일곱째’로 바로잡고, 단수 판정 구조를 명료하게 보존했습니다. ‘금송아지 두 마리’로 금이 송아지를 수식하는 원뜻을 자연스러운 한국어로 전달했으며, 의도적인 계획 행위는 ‘꾀를 내어’로 옮겼습니다.
