base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030.yaml
  text: '1 And it will happen after these things[a], when the time of the coming of the Messiah is completed and he returns in glory. Then all those who sleep in hope of him will rise.


    2 And it will happen at that time that the treasuries will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will appear together in one assembly, of one mind. And the first will rejoice, and the last will not be grieved.


    3 For they know that the time has come of which it was said, that it is the completion of the times.


    4 But the souls of the wicked will waste away all the more when they see all these things.


    5 For they know that their torment has come[b], and that their destruction has arrived.'
  footnotes:
  - marker: a
    text: 'The chapter boundary is somewhat fragile on the shared Ceriani page: the opening of chapter 30 and the transition into chapter 31 stand close together in a textually messy zone. This draft follows the standard chapter division while keeping the wording cautious where the OCRed Syriac is roughest.'
    reason: textual_variant
  - marker: b
    text: The resurrection line and the clause about the stored souls are supported by the readable Syriac signals on the page together with control orientation from the traditional chapter division; the present Ceriani bucket itself is partially corrupted at this point.
    reason: alternative_reading
translation:
  language: ko
  text: '1 그리고 이 일들이 지난 뒤에, 메시아의 오심의 때가 차서 그가 영광 가운데 돌아오실 때, 그를 소망하며 잠든 모든 이가 일어날 것입니다.


    2 그때에 의인들의 영혼의 수가 보관되어 있는 금고들이 열리고, 그들이 나올 것입니다. 그리고 수많은 영혼이 한마음으로 한 집회에 함께 나타날 것입니다. 처음인 이들은 기뻐하고, 마지막인 이들은 근심하지 않을 것입니다.


    3 그들은 그 때가 왔음을 알기 때문입니다. 곧 그것이 “때들의 완성”이라고 말해진 때입니다.


    4 그러나 악인들의 영혼은 이 모든 것을 볼 때 더욱 쇠잔해질 것입니다.


    5 그들은 자기들의 고통이 왔고 자기들의 멸망이 도착했음을 알기 때문입니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܫܝܚܐ
  english_pob_choice: the Messiah
  chosen_korean: 메시아
  alternatives_korean:
  - 그리스도
  - 기름부음받은 이
  lexicon: Smith
  rationale: 시리아어 ܡܫܝܚܐ의 종말론적 인물 호칭을 살리기 위해, 교회 제도적 표현보다 POB 기본값인 ‘메시아’를 사용했습니다.
- source_word: ܢܬܦܣܩ
  english_pob_choice: is completed
  chosen_korean: 차다
  alternatives_korean:
  - 완성되다
  - 이루어지다
  lexicon: Smith
  rationale: 문맥은 시간이 목적지에 도달하는 뜻이지, 반드시 ‘성취’나 ‘완성’의 신학적 색채를 강하게 주는 표현은 아니므로, 시간 완료의 자연스러운 한국어인 ‘차다’를 택했습니다.
- source_word: ܚܢܝܐ / ܢܣܒܪܝܢ ܒܗ
  english_pob_choice: sleep in hope of him
  chosen_korean: 그를 소망하며 잠든
  alternatives_korean:
  - 그를 바라고 잠든
  - 그에게 희망을 두고 잠든
  lexicon: Smith
  rationale: ‘잠들다’라는 죽음 은유와 그리스도/메시아를 향한 희망의 방향을 함께 보존했습니다.
- source_word: ܡܢܢܘܢ ܕܢܦܫ̈ܬܐ
  english_pob_choice: souls
  chosen_korean: 영혼
  alternatives_korean:
  - 혼
  - 목숨
  lexicon: Smith
  rationale: 이 장은 의인의 ‘영혼’이 보관되어 있다가 나온다는 상징을 사용하므로, 실체를 평준화하는 ‘목숨’보다 ‘영혼’이 더 직접적입니다.
- source_word: ܫܘܠܡܗ ܕܙܒܢܐ
  english_pob_choice: the completion of the times
  chosen_korean: 때들의 완성
  alternatives_korean:
  - 때들의 완결
  - 때들의 종결
  lexicon: Smith
  rationale: 영어 본문이 의도적으로 피한 장중한 라틴계 어휘를 따르기보다, 원문 의미를 단순하게 옮겨 ‘때들의 완성’으로 했습니다.
theological_decisions:
- issue: 메시아 오심의 시제와 종말론적 긴장
  chosen_reading: 메시아의 오심의 때가 차서 그가 영광 가운데 돌아오실 때
  alternative_readings:
  - 메시아의 오심이 이루어질 때
  - 메시아가 영광 가운데 나타나실 때
  rationale: 원문은 ‘오심의 때’가 완결된 뒤의 귀환을 병치하므로, 두 요소를 모두 살려 종말론적 시간표의 긴장을 유지했습니다.
  doctrine_reference: Source-driven apocalyptic imagery; do not flatten sequence into generic end-time summary.
- issue: 저장된 영혼과 부활 전 상태
  chosen_reading: 의인들의 영혼의 수가 보관되어 있는 금고들
  alternative_readings:
  - 의인들의 영혼이 저장된 창고들
  - 의인들의 영혼이 간직된 보물창고들
  rationale: 원문과 영어 POB는 의인들의 영혼이 어떤 장소에 ‘보관’된다고 말하므로, 이를 부활 이전의 저장 이미지로 유지했습니다.
  doctrine_reference: Preserve intermediate-state imagery rather than harmonizing it away.
