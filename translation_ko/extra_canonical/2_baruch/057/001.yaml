revisions:
- from: '당신이 보았던, 바다에서 올라와 이 땅을 덮은 큰 구름은 이것이니, 전능자가 창조를 계획하실 때 만드신 세상입니다. 그리고 그분 앞에서 말씀이 나오자 세상의 시작이 서게 되었는데, 그것은 작고 아름답게 마련되어 있었고, 정해진 대로 세워졌습니다.


    그리고 당신이 먼저 보았던, 구름에서 그것 위로 내려온 검은 물은 이것이니, 첫 آدم이 처음 범한 그 범죄입니다. 그가 죄를 지었을 때, 죽음이 — 그것의 때는 아직 아니었으나 — 움직이기 시작했고, 슬픔이 알려졌으며, 고통들이 마련되었고, 고난이 생겨났으며, 수고가 이루어졌고, 위대함이 낮아지기 시작했습니다.


    그리고 형상으로 보이고 모양을 취한 마지막 날에 관하여는, 그때에는 시간이 조사될 것이고, 인류의 분량이 재어질 것이며, 그 힘이 시험될 것임을 아십시오. 그러므로 아담은 살아 있는 동안 하나님에게서 장차 있을 일의 일부를 들었고, 죽은 자들의 해방이 주어질 것임을 이해했으며, 하나님께서 그에게 명하신 것을 생각해 보다가 다섯 가지 생각을 하였습니다. 그는 자신을 책임 아래 두었고, 또한 천사들도 책임 아래 두었습니다. 그리고 그가 지음받던 그때에도, 쓰라린 삶과 불로 된 원소들의 환상이 그에게 보였습니다. 그리하여 하나님께서는 에덴에서, 지음받은 것들과 같은 모습으로 모으셨습니다.[a][b]'
  to: '당신이 보았던, 바다에서 올라와 이 땅을 덮은[a] 큰 구름에 관하여, 잘 들으십시오. 그것은 전능자께서 창조를 이루시려고 계획하실 때 만드신 세상입니다. 그분 앞에서 말씀이 나오자 세상의 시작이 작고 아름답게 서게 되었고, 정해진 대로 세워졌습니다.


    당신이 먼저 보았던, 그 구름에서 그 위로 내려온 검은 물은 첫 아담이 처음으로 저지른 범법입니다. 그가 죄를 지었을 때 죽음이 일깨워졌으나, 아직 그 때는 아니었습니다. 슬픔이 알려졌고, 고통들이 마련되었으며, 고난이 생겨났고, 수고가 이루어졌으며, 위대함이 낮아지기 시작했습니다.


    형상으로 나타나 모양을 취한 마지막 날은 이러합니다. 그 때가 심문을 받고, 인류의 척도가 재어지며[b], 그 힘이 시험될 것임을 아십시오. 그러므로 아담은 살아 있을 때 하나님에게서 장차 있을 어떤 일을 들었고, 죽은 자들의 해방이 주어질 것을 이해했으며, 하나님께서 그에게 명하신 일을 곰곰이 생각하여 다섯 가지 생각을 품었습니다. 그는 자신이 책임을 지게 하였고, 천사들도 책임을 지게 하였습니다. 또한 그가 지음받던 때에 쓰라린 삶과 불과 함께하는 원소들에 관한 환상이 그에게 보였습니다. 그와 같이 하나님께서는 지음받은 것들의 모양으로 에덴에서 모으셨습니다.'
