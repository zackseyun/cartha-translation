- source_word: ܥܢܢܐ ܪܒܬܐ ܕܣܠܩܬ ܡܢ ܝܡܐ
  english_pob_choice: a great cloud that ascended from the sea
  chosen_korean: 바다에서 올라와 … 큰 구름
  alternatives_korean:
  - 바다에서 올라간 … 큰 구름
  - 바다에서 솟아오른 … 큰 구름
  lexicon: Syriac direct sense; English POB audit trail
  rationale: 상승 동작을 살리되, 현대 한국어에서 자연스러운 '올라와'로 옮겨 구름의 기원과 이동을 함께 드러냈습니다.
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  english_pob_choice: the beginning of the world
  chosen_korean: 세상의 시작
  alternatives_korean:
  - 세상의 기원
  - 세상의 시작과 질서
  lexicon: Payne Smith; Kmosko control support
  rationale: 문맥상 'foundation'보다 우주적 기원/개시를 가리키므로, POB의 판단을 따라 '시작'으로 간명하게 살렸습니다.
- source_word: ܡܚܝܒܢܘܗܝ
  english_pob_choice: he made himself liable
  chosen_korean: 자신을 책임 아래 두었고
  alternatives_korean:
  - 자신을 유죄로 만들었고
  - 자신에게 책임이 지워졌고
  lexicon: Payne Smith; English POB audit trail
  rationale: 법적·언약적 부담을 뜻하는 뉘앙스를 살리기 위해 '유죄'보다 '책임 아래 두다'를 택해, 본문이 말하는 부담/귀속을 보존했습니다.
- source_word: ܐܣܛܘܟܣܐ
  english_pob_choice: the elements
  chosen_korean: 원소들
  alternatives_korean:
  - 요소들
  - 초보 원리들
  lexicon: Greek loanword / Payne Smith
  rationale: 시리아어가 그리스어 stoicheia를 반영하므로, 우주론적 뉘앙스를 유지하는 '원소들'이 가장 직접적입니다.
theological_decisions:
- issue: 아담의 책임 표현
  chosen_reading: 본문의 강한 책임 언어를 약화하지 않고, 아담이 자신과 천사들을 '책임 아래' 두었다고 옮겼습니다.
  alternative_readings:
  - 아담이 단순히 '유죄'가 되었다고 완화해 옮길 수 있음
  - 천사들에 대한 언급을 난해하므로 생략할 수 있음
  rationale: 시리아어는 아담의 행위가 자신뿐 아니라 천사들에게도 미친다고 말하므로, 그 긴장을 드러내고 완화하지 않았습니다.
  doctrine_reference: 원문 보존 원칙; 죄와 책임의 확장성에 대한 묵시문학적 표현
- issue: '''마지막 날''과 ''형상/모양'' 표현'
  chosen_reading: '''형상으로 보이고 모양을 취한 마지막 날''로 옮겨, 날 자체가 시현 속에서 현현한 이미지라는 구조를 살렸습니다.'
  alternative_readings:
  - '''마지막 때''로 일반화'
  - '''모양과 형상''을 평이하게 재배열'
  rationale: 시리아어의 명시적 어순과 시각적 표현을 보존해야 이 단락의 묵시적 상징성이 살아납니다.
  doctrine_reference: 묵시문학의 상징-현현 언어
