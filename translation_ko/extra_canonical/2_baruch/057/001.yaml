theological_decisions:
- issue: 아담의 책임 표현
  chosen_reading: 본문의 강한 책임 언어를 약화하지 않고, 아담이 자신과 천사들을 '책임 아래' 두었다고 옮겼습니다.
  alternative_readings:
  - 아담이 단순히 '유죄'가 되었다고 완화해 옮길 수 있음
  - 천사들에 대한 언급을 난해하므로 생략할 수 있음
  rationale: 시리아어는 아담의 행위가 자신뿐 아니라 천사들에게도 미친다고 말하므로, 그 긴장을 드러내고 완화하지 않았습니다.
  doctrine_reference: 원문 보존 원칙; 죄와 책임의 확장성에 대한 묵시문학적 표현
- issue: '''마지막 날''과 ''형상/모양'' 표현'
  chosen_reading: '''형상으로 보이고 모양을 취한 마지막 날''로 옮겨, 날 자체가 시현 속에서 현현한 이미지라는 구조를 살렸습니다.'
  alternative_readings:
  - '''마지막 때''로 일반화'
  - '''모양과 형상''을 평이하게 재배열'
  rationale: 시리아어의 명시적 어순과 시각적 표현을 보존해야 이 단락의 묵시적 상징성이 살아납니다.
  doctrine_reference: 묵시문학의 상징-현현 언어
