  revised_text: '당신이 보았던, 바다에서 올라와 이 땅을 덮은[a] 큰 구름에 관하여, 잘 들으십시오. 그것은 전능자께서 창조를 이루시려고 계획하실 때 만드신 세상입니다. 그분 앞에서 말씀이 나오자 세상의 시작이 작고 아름답게 서게 되었고, 정해진 대로 세워졌습니다.


