  - 세상의 기틀은 물리적 구조만 뜻합니다
  rationale: 시리아어 본문은 창조적 발화와 우주 질서의 형성을 연결하므로, 그 신학적 연관을 약화시키지 않았습니다.
  doctrine_reference: 창조론/하나님의 말씀에 의한 창조
- issue: ‘죽음이 그때가 되기도 전에 일어났다’
  chosen_reading: 아담의 죄로 인해 죽음과 애도, 고난이 예정된 때보다 앞서 সক동화되었다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 아담 개인의 수명이 짧아졌다는 뜻입니다
  - 죽음이 단지 인간 존재의 일부가 되었다는 뜻입니다
  rationale: 본문의 ‘before its time’는 종말론적·우주론적 질서의 붕괴를 가리키므로, 시간성의 긴장을 살렸습니다.
  doctrine_reference: 타락론/죽음의 침투
- issue: ‘마지막 날’과 ‘시간이 요구된다’
  chosen_reading: 마지막 날은 심판의 때로서 시간이 청구되고 인류의 분량이 측정되는 날로 이해했습니다.
  alternative_readings:
  - 아담의 임종을 뜻합니다
  - 단지 한 역사적 시대를 가리킵니다
  rationale: 바로 뒤의 측정·시험 이미지와 연결되므로, 종말론적 심판 진술로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 종말론/심판
