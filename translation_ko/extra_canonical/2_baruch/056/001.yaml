base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/056/001.yaml
  text: 'That great cloud which you saw ascending from the sea and going to cover the earth—understand this: it is the ordering of the world which the Mighty One made when he resolved to create it.[1][2] And it came to pass that, when the word went forth from before him, the establishment of the world arose—fair, small—and it was prepared as it was fitting to be.[3]


    And as for the first black waters which you saw descending from that cloud, this is the sin and transgression which the first Adam committed first. For when he transgressed, death was aroused before its time, and mourning became known, and afflictions were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which appeared in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.[4][5]


    Therefore, because Adam—when he heard from God something of what was to be, and understood that the release of the dead had been given, and had been commanded by God—considered, and he thought five thoughts: for he was condemning himself; he was also condemning the angels; and even at the time when he was created in it, there was for him a seen vision, and the fierce living creatures, and the elements with fire.[6][7]


    And thus God gathered in time, in the likeness in which they had been created.'
  footnotes:
  - marker: '1'
    text: Ceriani reads ‘went and covered (ḥapith) the earth’; Kmosko’s control has ‘covered (kasyth)’. Both mean ‘covered’, with no difference in sense.
    reason: textual_variant
  - marker: '2'
    text: The Syriac here is difficult. Kmosko reads ‘this is the ordering/structure (nugra) of the world which the Mighty One made’; Ceriani’s OCR has ‘who made his power’. The translation follows the ‘ordering’ sense.
    reason: textual_variant
  - marker: '3'
    text: ‘Fair, small’ (šapir, zʿur) is striking in context; possibly indicating the initial state as nascent/embryonic before further ordering. The phrase is retained literally.
    reason: lexical_alternative
  - marker: '4'
    text: ‘The last day … took on the likeness of death’ is syntactically terse; it is taken as an eschatological aside indicating that the end will resemble death in its effects.
    reason: lexical_alternative
  - marker: '5'
    text: ‘The semblance (numsha) of humanity will be wiped away’ involves a rare term; ‘semblance/appearance’ is a cautious rendering of an obscure word and verb (mšḥ ‘to wipe’).
    reason: lexical_alternative
  - marker: '6'
    text: ‘Forgiveness for those who had died had been given’ reads šūbaqnā d-mēte as an objective genitive, i.e., forgiveness pertaining to the dead, not that Adam forgave others.
    reason: lexical_alternative
  - marker: '7'
    text: ‘Five thoughts were thought’ is followed by compressed clauses (‘he made himself liable … before the angels … in the time he was created … wild beasts … elements’). The enumeration is obscure in Syriac; the translation preserves the sequence without harmonizing.
    reason: textual_variant
  - marker: a
    text: Or 'this is the transgression which Adam the first transgressed'.
    reason: previous_rendering
  - marker: b
    text: Or 'five thoughts were thought'.
    reason: previous_rendering
translation:
  language: ko
  text: '네가 본 그 큰 구름은 바다에서 올라와 땅을 덮는 것이니—이것을 이해하십시오. 그것은 전능하신 분이 그것을 창조하기로 뜻하셨을 때 만드신 세상의 질서입니다.[a][b] 그분의 앞에서 말씀이 나가자 세상의 기틀이 일어났는데—아름답고도 작았습니다—그리고 마땅한 대로 준비되었습니다.[c]


    그리고 그 구름에서 내려오는 첫 검은 물은, 첫 آدم, 곧 첫 아담이 처음 범한 죄와 허물입니다. 그가 죄를 지었을 때 죽음이 그때가 되기도 전에 일어났고, 애도가 알려졌으며, 고난들이 예비되었고, 고통들이 생겨났으며, 수고가 완성되었고, 위대함은 서서히 쇠하기 시작했습니다.


    마지막 날은 형체를 드러내어 모습까지 취할 것이니—그때는 시간이 요구되고, 인류의 분량이 재어지며, 그 힘이 시험받을 것입니다.[d][e]


    그러므로 아담은 하나님께서 장차 일어날 어떤 일을 그에게 말씀하셨을 때, 죽은 자들의 풀림이 주어졌고 하나님께 명령도 받았다는 것을 깨닫고 생각했습니다. 그리고 그는 다섯 가지 생각을 했습니다.[f] 곧 자기 자신을 정죄했고, 또한 천사들도 정죄했으며, 그가 창조되던 바로 그때에도 그에게는 보이는 환상과 사나운 생물들과 불과 함께한 요소들이 있었습니다.[g]


    그리고 하나님은 때가 되자, 그들이 창조되었던 그 모습대로 그들을 모으셨습니다.'
  philosophy: optimal-equivalence
