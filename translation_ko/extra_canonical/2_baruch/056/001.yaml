revisions:
- from: '네가 본 그 큰 구름은 바다에서 올라와 땅을 덮는 것이니—이것을 이해하십시오. 그것은 전능하신 분이 그것을 창조하기로 뜻하셨을 때 만드신 세상의 질서입니다.[a][b] 그분의 앞에서 말씀이 나가자 세상의 기틀이 일어났는데—아름답고도 작았습니다—그리고 마땅한 대로 준비되었습니다.[c]


    그리고 그 구름에서 내려오는 첫 검은 물은, 첫 آدم, 곧 첫 아담이 처음 범한 죄와 허물입니다. 그가 죄를 지었을 때 죽음이 그때가 되기도 전에 일어났고, 애도가 알려졌으며, 고난들이 예비되었고, 고통들이 생겨났으며, 수고가 완성되었고, 위대함은 서서히 쇠하기 시작했습니다.


    마지막 날은 형체를 드러내어 모습까지 취할 것이니—그때는 시간이 요구되고, 인류의 분량이 재어지며, 그 힘이 시험받을 것입니다.[d][e]


    그러므로 아담은 하나님께서 장차 일어날 어떤 일을 그에게 말씀하셨을 때, 죽은 자들의 풀림이 주어졌고 하나님께 명령도 받았다는 것을 깨닫고 생각했습니다. 그리고 그는 다섯 가지 생각을 했습니다.[f] 곧 자기 자신을 정죄했고, 또한 천사들도 정죄했으며, 그가 창조되던 바로 그때에도 그에게는 보이는 환상과 사나운 생물들과 불과 함께한 요소들이 있었습니다.[g]


    그리고 하나님은 때가 되자, 그들이 창조되었던 그 모습대로 그들을 모으셨습니다.'
  to: '당신이 바다에서 올라와 땅을 덮은 것을 본 그 큰 구름에 관해서는, 이것을 이해하십시오. 그것은 전능하신 분께서 세상을 창조하기로 뜻하셨을 때 만드신 세상의 질서입니다.[1][2] 그분 앞에서 말씀이 나왔을 때, 세상의 기초가 아름답고 작은 모습으로 일어났으며, 마땅히 되어야 할 대로 갖추어졌습니다.[3]


    그 구름에서 내려온 첫 검은 물은 첫 아담이 처음으로 범한 죄와 허물입니다. 그가 죄를 지었을 때, 죽음이 제때가 되기 전에 일어났고, 애도가 알려졌으며, 고난들이 마련되었고, 고통들이 창조되었으며, 수고가 완성되었고, 위대함은 쇠하기 시작했습니다.


    형상으로 나타나 모습을 취한 마지막 날에 대해서는, 때가 요구될 것이며, 인간의 모습이 지워지고, 그 힘이 시험받을 것임을 당신은 알게 될 것입니다.[4][5]


    그러므로 아담은 하나님에게서 장차 있을 일에 관한 어떤 말씀을 듣고, 죽은 이들의 풀림이 주어졌음을 깨달았으며, 하나님에게서 명령을 받았을 때 생각하여, 다섯 가지 생각을 하였습니다. 그는 자기 자신을 정죄하고 있었고, 천사들도 정죄하고 있었으며, 그가 그 안에서 창조되던 때에도 그에게는 보이는 환상과 사나운 생물들과 불과 함께한 원소들이 있었습니다.[6][7]


    이와 같이 하나님께서는 때 안에서, 그들이 창조되었던 모습으로 모으셨습니다.'
