translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다. 「그때 일어나기로 되어 있는 일은 무엇이든 온 땅에 일어날 것입니다. 그러므로 살아 있는 모든 사람은 그것을 경험할 것입니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “감지할 것이다” 또는 “느낄 것이다.”
    reason: ܢܪܓܫܘܢ은 문자적으로 지각하거나 느끼는 것을 뜻할 수 있으나, 여기서는 다가올 사건을 겪는다는 의미로 ‘경험할 것입니다’로 옮겼습니다.
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  english_pob_choice: And he answered and said to me
  chosen_korean: 그가 내게 대답하여 말했습니다
  alternatives_korean:
  - 그가 내게 응답하여 말했습니다
  - 그가 내게 대답하며 말했습니다
  lexicon: source syntax
  rationale: 서사적 응답 공식을 자연스러운 현대 한국어로 옮기되, ‘내게’라는 목적어 관계를 유지했습니다.
- source_word: ܡܕܡ ܕܥܬܝܕ ܠܡܗܘܐ ܒܗܘ ܙܒܢܐ
  english_pob_choice: Whatever is destined to happen at that time
  chosen_korean: 그때 일어날 모든 일
  alternatives_korean:
  - 그때 예정된 모든 일
  - 그때 될 운명의 모든 일
  lexicon: CAL ܕܥܬܝܕ
  rationale: apocalyptic 문맥의 ‘destined’ 뉘앙스는 살리되, 한국어에서는 ‘일어날 모든 일’이 가장 자연스럽고 과도한 운명론적 표현을 피합니다.
- source_word: ܢܪܓܫܘܢ
  english_pob_choice: will experience
  chosen_korean: 경험할 것입니다
  alternatives_korean:
  - 느낄 것입니다
  - 감지할 것입니다
  - 깨닫게 될 것입니다
  lexicon: CAL ܪܓܫ
  rationale: 문맥상 단순한 ‘느낌’보다 재난적 사건을 ‘겪다/경험하다’는 뜻이 적절하므로, POB의 선택을 그대로 반영했습니다.
