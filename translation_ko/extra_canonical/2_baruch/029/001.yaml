  - 감지할 것입니다
  - 깨닫게 될 것입니다
  lexicon: CAL ܪܓܫ
  rationale: 문맥상 단순한 ‘느낌’보다 재난적 사건을 ‘겪다/경험하다’는 뜻이 적절하므로, POB의 선택을 그대로 반영했습니다.
