base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/009.yaml
  text: '1 And I[a], Baruch, came with Jeremiah, whose heart had been found pure from sins, and who had not been taken in the capture of the city.


    2 And we tore our garments, and wept, and mourned[b], and fasted seven days.'
  footnotes:
  - marker: a
    text: The chapter boundary at this point is structurally clear in the traditional numbering, but the Ceriani page is an OCR-fragile edge page. The opening verb of verse 1 is therefore kept with modest caution.
    reason: textual_variant
  - marker: b
    text: The phrase 'pure from sins' is preserved rather than softened away. It likely marks Jeremiah as not implicated in Jerusalem's rebellion and judgment, not as a systematic claim of absolute impeccability.
    reason: alternative_reading
translation:
  language: ko
  text: '1 나는 바룩이 예레미야와 함께 왔습니다. 예레미야는 죄들로부터 마음이 깨끗한 것으로 드러났고, 성이 함락될 때 붙잡히지 않았습니다.


    2 우리는 옷을 찢고, 울고, 슬퍼하고, 칠 일 동안 금식했습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܒܥ
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 돌아왔습니다
  - 갔습니다
  lexicon: Payne Smith
  rationale: 문맥상 단순한 이동 동사로 읽는 것이 가장 덜 해석적이므로, 자연스러운 과거형 ‘왔습니다’로 옮겼습니다.
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  english_pob_choice: whose heart had been found pure from sins
  chosen_korean: 죄들로부터 마음이 깨끗한 것으로 드러났고
  alternatives_korean:
  - 죄들로부터 마음이 깨끗했습니다
  - 죄들에 대하여 결백한 것으로 드러났고
  lexicon: Payne Smith
  rationale: ‘pure from sins’의 판단적 뉘앙스를 살리되, 절대적 무죄 주장처럼 굳히지 않기 위해 ‘드러났고’와 ‘마음이 깨끗한’ 표현을 택했습니다.
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  english_pob_choice: in the capture of the city
  chosen_korean: 성이 함락될 때
  alternatives_korean:
  - 성이 점령될 때
  - 도시가 사로잡힐 때
  lexicon: Smith Syriac Dictionary
  rationale: 전쟁·정복 상황의 수동적 붕괴를 자연스럽게 드러내는 한국어로 ‘함락될 때’가 가장 적절합니다.
- source_word: ܘܒܩ̈ܝ
  english_pob_choice: wept, and mourned
  chosen_korean: 울고, 슬퍼하고
  alternatives_korean:
  - 통곡하고
  - 애곡하고
  lexicon: Payne Smith
  rationale: 시리아어의 연속된 애도 동작을 두 동사로 살려, 단순한 감정 표명보다 실제 애곡 행위를 드러냈습니다.
theological_decisions:
- issue: 예레미야의 ‘죄들로부터 깨끗함’ 표현
  chosen_reading: 이 표현은 예레미야가 예루살렘의 죄책과 심판에 직접 연루되지 않았음을 가리키는 것으로 읽고, 보편적 무죄나 무흠을 단정하지 않습니다.
  alternative_readings:
  - 예레미야의 절대적 무죄 선언
  - 의례적 정결만을 말하는 표현
  rationale: 문맥이 성의 함락과 포로 여부에 초점을 두므로, 번역도 그 긴장을 유지해야 합니다. ‘드러났고’는 심판 맥락의 판정적 의미를 보존합니다.
  doctrine_reference: DOCTRINE.md
