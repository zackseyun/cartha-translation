base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/027.yaml
  text: 'And I answered and said to him[a], “After this, that time is divided into twelve parts, and each one of them is reserved for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and demons of apparitions. In the ninth part: the fall of fire[e][d][c][b]. In the tenth part: rapine and much oppression.”'
  footnotes:
  - marker: a
    text: The numeral in the present Ceriani/OCR bucket is unstable, but the context clearly proceeds by numbered parts and is best read here as twelve.
    reason: textual_variant
  - marker: b
    text: The line for the fourth part is partially disturbed in this page-edge slice; the rendering follows the clearest recoverable sense, 'the sending forth of the sword.'
    reason: textual_variant
  - marker: c
    text: This chapter bucket appears to stop on the tenth part; the traditional continuation of chapter 27 likely runs onto the adjoining page and should be checked before final publication.
    reason: alternative_reading
  - marker: d
    text: Or 'is kept'.
    reason: previous_rendering
  - marker: e
    text: Or 'and of demons, and of apparitions'.
    reason: previous_rendering
translation:
  language: ko
  text: 저는 그에게 대답하여 말했습니다[a]. “이 일 후에 그때는 열두 부분으로 나뉘며, 그 각각은 거기에 정해진 것에 대해 따로 지정되어 있습니다. 첫째 부분에는 소란의 시작이 있습니다. 둘째 부분에는 큰 자들의 살육이 있습니다. 셋째 부분에는 많은 사람의 سقوط이 있습니다. 넷째 부분에는 칼의 파견이 있습니다. 다섯째 부분에는 기근이 있습니다. 여섯째 부분에는 지진이 있습니다. 일곱째 부분에는 두려움과 재앙이 있습니다. 여덟째 부분에는 영들과 [b]데몬들의 공격과 현현이 있습니다. 아홉째 부분에는 불의 سقوط이 있습니다. 열째 부분에는 약탈과 많은 압제가 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  english_pob_choice: is divided into twelve parts
  chosen_korean: 열두 부분으로 나뉘며
  alternatives_korean:
  - 열두 시기로 나뉘며
  - 열두 때로 나뉘며
  lexicon: Payne Smith
  rationale: 오류가 섞인 수치라도 문맥상 분명히 번호가 매겨진 절기/부분들의 열거이므로, 한국어는 자연스럽게 ‘부분’으로 처리했습니다.
- source_word: ܡܬܬܝܕܥܐ
  english_pob_choice: is reserved for
  chosen_korean: 따로 지정되어 있습니다
  alternatives_korean:
  - 예약되어 있습니다
  - 간직되어 있습니다
  lexicon: Smith
  rationale: 단순히 ‘알려진다’보다, 각 몫이 특정 일에 배정·지정된다는 뜻을 살려야 하므로 ‘따로 지정되어 있습니다’로 옮겼습니다.
- source_word: ܙ̈ܘܥܐ
  english_pob_choice: upheavals
  chosen_korean: 소란
  alternatives_korean:
  - 격변
  - 동요
  - 소요
  lexicon: Payne Smith
  rationale: 뒤의 ‘지진’과 구별되는 더 넓은 사회적·우주적 동요를 가리키므로, 과도하게 기술적인 표현보다 ‘소란’이 간결합니다.
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  english_pob_choice: the sending forth of the sword
  chosen_korean: 칼의 파견
  alternatives_korean:
  - 칼의 보내심
  - 칼의 출동
  lexicon: Smith
  rationale: 칼이 마치 사자로 보내지는 듯한 능동적 이미지를 살렸습니다. ‘파견’은 전투를 뜻하는 일반어로 축소하지 않으면서도 원문의 위임/발송 느낌을 보존합니다.
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ ܘܕܫ̈ܐܕܐ ܕܦܪ̈ܨܘܦܐ
  english_pob_choice: assaults of spirits and demons of apparitions
  chosen_korean: 영들과 [b]데몬들의 공격과 현현
  alternatives_korean:
  - 영들의 공격과 데몬들의 현현
  - 영과 데몬과 현현의 공격
  lexicon: Smith
  rationale: 시리아어는 ‘영들’과 ‘데몬들’을 함께 적고, ‘현현/형상’이 그 데몬들과 수식 관계를 이룹니다. 한국어는 이 기괴한 묶음을 무리하게 평탄화하지 않고 그대로 남겼습니다.
- source_word: ܚܛܘܦܝܐ
  english_pob_choice: rapine
  chosen_korean: 약탈
  alternatives_korean:
  - 강탈
  - 노략질
  lexicon: Payne Smith
  rationale: 폭력적 탈취의 의미를 살리되 한국어에서 가장 읽기 쉬운 형식으로 옮겼습니다.
- source_word: ܐܢܘܣܝܐ
  english_pob_choice: oppression
  chosen_korean: 압제
  alternatives_korean:
  - 억압
  - 강압
  lexicon: Smith
  rationale: 후반의 사회적 고통과 강제성을 함께 드러내는 말로 ‘압제’가 가장 적절합니다.
