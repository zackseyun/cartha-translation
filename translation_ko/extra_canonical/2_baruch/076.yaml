  yaml_path: translation/extra_canonical/2_baruch/076.yaml
  text: '1. And he answered and said to me, “Because the revelation of this vision has been made plain as you prayed, hear the word of the Most High, so that you may know what will happen to you after these things.

    2. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times.

    3. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going.

    4. And this shall be after forty days.

    5. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”'
translation:
  language: ko
  text: 그가 대답하여 내게 말했습니다. “이 환상의 계시가 네가 기도할 때 분명히 드러났으니, 지극히 높으신 분의 말씀을 들으십시오. 그러면 이 일들 이후에 네게 일어날 일을 알게 될 것입니다. 너는 반드시 이 땅을 떠나게 되겠지만, 죽음에 이르는 것은 아닙니다. 오히려 정해진 때들을 위하여 보존될 것입니다. 그러므로 지금 그 산의 꼭대기로 올라가십시오. 그러면 그 땅의 여러 지역과 사람이 사는 세상의 모습과 산들의 꼭대기와 골짜기들의 깊이와 바다들의 깊이와 강들의 수가 네 앞에 지나갈 것이니, 네가 무엇을 떠나는지와 어디로 가는지를 보게 될 것입니다. 이것은 사십 일 후에 일어날 것입니다. 그러므로 지금 이 날들 동안 백성에게 네가 할 수 있는 만큼 가르치십시오. 그래서 그들이 마지막 때에 죽지 않도록, 오히려 배우고 마지막 때에 살도록 하십시오.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܠܝܢܐ / ܝܘܠܦܢܐ ܡܥܠܝܬ
  english_pob_choice: the revelation / instruction
  chosen_korean: “계시” / “가르치다”
  alternatives_korean:
  - “드러남” / “훈계하다”
  - “계시” / “교훈하다”
  lexicon: N/A
  rationale: POB가 앞부분의 핵심을 “revelation of this vision”으로 정리하므로 1차는 ‘계시’로 두고, 뒤의 ܝܘܠܦܢܐ는 단순 정보 전달이 아니라 백성을 향한 실제적 가르침이므로 ‘가르치다’로 옮겼습니다.
- source_word: ܚܘ̈ܒܐ ܡܢ ܒܥܕܐ / ܢܩ̈ܦܝܢ ܠܒܢ̈ܝ ܐܢܫܐ
  english_pob_choice: what will happen to you after these things
  chosen_korean: “이 일들 이후에 네게 일어날 일”
  alternatives_korean:
  - “이 일들 뒤에 네게 닥칠 일”
  - “이 일들 다음에 네게 생길 일”
  lexicon: N/A
  rationale: 원문은 ‘after these things’라는 시간 표지를 명확히 하며, POB의 도식에 맞춰 미래 사건을 간결하게 ‘일어날 일’로 표현했습니다.
- source_word: ܢܦܩ ܡܢ ܗܕܐ ܐܪܥܐ
  english_pob_choice: depart from this earth
  chosen_korean: “이 땅을 떠나게 되겠지만”
  alternatives_korean:
  - “이 땅에서 나가게 되겠지만”
  - “이 땅을 떠나갈 것이지만”
  lexicon: N/A
  rationale: 시리아어는 단순한 이동이 아니라 현세 세계로부터의 이탈을 말하므로, 자연스러우면서도 종말론적 뉘앙스를 살려 ‘떠나게 되다’로 옮겼습니다.
- source_word: ܠܙܒ̈ܢܐ ܡܬܬܚܡܐ
  english_pob_choice: for the appointed times
  chosen_korean: “정해진 때들을 위하여”
  alternatives_korean:
  - “지정된 시간들을 위하여”
  - “정해진 시기들을 위해”
  lexicon: N/A
  rationale: 복수 ‘times’는 특정한 단일 시점보다 하나님의 배정된 여러 시기를 가리키므로, 한국어에서도 복수를 살려 ‘때들’로 옮겼습니다.
- source_word: ܥܡܡ̈ܐ / ܒܢ̈ܝ ܐܢܫܐ
  english_pob_choice: the people
  chosen_korean: “백성”
  alternatives_korean:
  - “사람들”
  - “민족”
  lexicon: N/A
  rationale: 문맥상 브룩이 언약 백성을 향해 말하고 있으므로 일반적인 ‘사람들’보다 공동체적·언약적 함의를 가진 ‘백성’이 더 정확합니다.
theological_decisions:
- issue: “not unto death; rather, you shall be kept for the appointed times”의 보존 언어
  chosen_reading: 죽음에 이르는 것이 아니라 정해진 때들을 위하여 보존되는 것으로 옮겼습니다.
  alternative_readings:
  - “죽지 않을 것이나”
  - “죽음으로 가지는 않을 것이나”
  rationale: 단순 생존 약속이 아니라 정해진 시기를 위한 보존이라는 신학적 긴장을 살려야 하므로, 죽음의 부정과 보존의 목적을 함께 드러냈습니다.
  doctrine_reference: 섭리 / 종말론적 보존
- issue: “lest they die … but may learn so that they may live”의 목적-대조 구조
  chosen_reading: “죽지 않도록, 오히려 배우고 … 살도록”으로 대조를 유지했습니다.
  alternative_readings:
  - “죽지 않게 하려는 것이 아니라 배우게 하려는 것이다”
  - “죽음을 피하고 삶을 얻도록”
  rationale: 원문은 ‘죽음’과 ‘배움/삶’의 대조를 반복하므로, 이를 완화하지 않고 병렬 구조로 보존했습니다.
  doctrine_reference: 지혜/회개의 교육과 종말 생명
