translation:
  language: ko
  text: 그때에 거룩한 땅이 자기 소유를 긍휼히 여기고, 그때에 그 거민들을 보호할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ / holy land
  english_pob_choice: the holy land
  chosen_korean: 거룩한 땅
  alternatives_korean:
  - 성스러운 땅
  - 성별된 땅
  lexicon: Payne Smith
  rationale: 지리적 대상이면서도 언약적·종말론적 의미를 지니므로, 교회적 관용구보다 원문의 신학적 밀도를 살린 ‘거룩한 땅’이 적절합니다.
- source_word: ܬܪܚܡ / show mercy, have compassion
  english_pob_choice: shall have mercy on
  chosen_korean: 긍휼히 여기고
  alternatives_korean:
  - 자비를 베풀고
  - 불쌍히 여기고
  lexicon: Payne Smith
  rationale: 행위 주체가 땅으로 의인화된 표현이므로, 한국어에서도 능동적 자비의 뉘앙스를 유지하는 ‘긍휼히 여기고’가 가장 자연스럽습니다.
- source_word: ܕܝܠܗ̇ / belonging to it, its own
  english_pob_choice: its own
  chosen_korean: 자기 소유를
  alternatives_korean:
  - 자기 것들을
  - 자기에게 속한 이들을
  lexicon: Payne Smith
  rationale: ‘자기 소유’는 땅과 그에 속한 백성의 관계를 짧고 직접적으로 드러내며, 원문의 소속 관계를 과도하게 풀지 않습니다.
- source_word: ܬܢܛܪ / protect, keep safe
  english_pob_choice: it shall protect
  chosen_korean: 보호할 것입니다
  alternatives_korean:
  - 지켜 줄 것입니다
  - 보전할 것입니다
  lexicon: Payne Smith
  rationale: 예언문체의 단정성을 살리면서도 현대 한국어에서 분명한 뜻을 주는 ‘보호할 것입니다’가 적합합니다.
theological_decisions:
- issue: Personification of the land as acting subject
  chosen_reading: 거룩한 땅이 자기 소유를 긍휼히 여기고
  alternative_readings:
  - 하나님이 그 땅을 통해 긍휼을 베푸시고
  - 그 땅의 백성이 긍휼을 받게 되고
  rationale: 원문은 땅을 주어로 삼는 의인화된 예언 표현을 사용하므로, 이를 평탄화하지 않고 그대로 살려 종말론적 상징성을 보존합니다.
  doctrine_reference: 상징적·의인화된 예언어는 원문이 허용하는 범위 안에서 보존한다.
