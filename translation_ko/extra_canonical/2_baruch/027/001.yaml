  source_fidelity: 원문의 열두 부분, 각 부분에 정해진 재난, 그리고 첫째부터 열째까지의 열거를 대체로 충실히 반영했습니다. 다만 본문에 아랍 문자 ‘سقوط’이 두 차례 혼입되어 한국어 본문으로서는 명백한 오류이며, ‘fall’을 각각 ‘쓰러짐’과 ‘불이 떨어짐’으로 바로잡아야 합니다. 여덟째 부분은 시리아어의 어려운 속격 연결을 과도하게 해석하지 않도록 ‘환영의 악령들’이라는 묵시적 표현을 유지했습니다.
  naturalness: ‘그 안에 정해진 것이 무엇인지 알려집니다’는 다소 어색하고 주체가 불분명합니다. ‘각 부분은 그 안에 정해진 것으로 드러납니다’가 현대 표준 한국어에서 더 자연스럽고, 원문의 알려짐/지정됨 사이의 여지도 보존합니다. 열거는 모두 명사구로 통일하고, 마지막만 미래형으로 끝나는 불균형도 제거했습니다.
  terminology: ‘격변’, ‘기근’, ‘지진’, ‘공포와 재앙’, ‘약탈과 많은 압제’는 적절합니다. ‘큰 자들’은 현대 한국어에서 다소 부자연스러우므로 사회적·정치적 탁월성을 넓게 보존하는 ‘권세 있는 자들’로 조정했습니다. ‘칼이 보내어짐’은 원문의 심판 도구 이미지에 맞게 유지했습니다.
  issues:
