  - severity: medium
    issue: ‘각 부분은 그 안에 정해진 것이 무엇인지 알려집니다’의 표현이 부자연스럽습니다.
    rationale: 원문의 ‘알려지다/드러나다’와 ‘정해진 것’의 관계를 한국어에서 자연스럽게 표현할 필요가 있습니다.
