  yaml_path: translation/extra_canonical/2_baruch/027/001.yaml
  text: 'And I answered and said to him, “After this, that time is divided into twelve parts, and each one of them is known for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending forth of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and of demons of apparitions. In the ninth part: the fall of fire. In the tenth part: plundering and much oppression.”'
  footnotes:
  - marker: a
    text: Or 'assaults of spirits and demons of apparitions'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 그에게 대답하여 말했습니다. “이후에 그 시간은 열두 부분으로 나뉘며, 각 부분은 그 안에 정해진 것이 무엇인지 알려집니다. 첫째 부분에는 격변의 시작이 있고, 둘째 부분에는 큰 자들의 살육이 있으며, 셋째 부분에는 많은 이들의 سقوط이 있고, 넷째 부분에는 칼이 보내어지며, 다섯째 부분에는 기근이 있고, 여섯째 부분에는 지진이 있으며, 일곱째 부분에는 공포와 재앙이 있고, 여덟째 부분에는 영들의 습격과 환영의 악령들의 습격이 있으며, 아홉째 부분에는 불의 سقوط이 있고, 열째 부분에는 약탈과 많은 압제가 있을 것입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  english_pob_choice: is divided into twelve parts
  chosen_korean: 열두 부분으로 나뉘며
  alternatives_korean:
  - 열두 때로 나뉘며
  - 열두 시기로 구분되며
  lexicon: Payne Smith
  rationale: 뒤따르는 열거형 구조를 반영해 ‘부분’으로 옮기되, 동적이지만 원문의 분할 감각을 살렸습니다.
- source_word: ܡܬܬܝܕܥܐ
  english_pob_choice: is known
  chosen_korean: 알려집니다
  alternatives_korean:
  - 알려져 있습니다
  - 정해져 있습니다
  lexicon: Smith
  rationale: 단순한 인지보다 ‘그 안에 무엇이 정해졌는지 드러남’이 문맥상 자연스러워 ‘알려집니다’로 옮겼습니다.
- source_word: ܙ̈ܘܥܐ
  english_pob_choice: upheavals
  chosen_korean: 격변
  alternatives_korean:
  - 소동
  - 동요
  - 소요
  lexicon: Payne Smith
  rationale: 뒤의 지진과 구별되는 더 넓은 종말론적 혼란을 가리키므로 ‘격변’이 가장 적절합니다.
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  english_pob_choice: the sending forth of the sword
  chosen_korean: 칼이 보내어지며
  alternatives_korean:
  - 칼이 파견되며
  - 칼이 나가며
  - 칼의 발송이 있으며
  lexicon: Smith
  rationale: 주체적 행위가 아니라 심판 도구가 ‘보내어짐’이라는 이미지를 살렸습니다.
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ ܘܕܫ̈ܐܕܐ ܕܦܪ̈ܨܘܦܐ
  english_pob_choice: assaults of spirits and of demons of apparitions
  chosen_korean: 영들의 습격과 환영의 악령들의 습격
  alternatives_korean:
  - 영들의 공격과 나타남의 악령들의 공격
  - 영들의 습격과 형상의 악령들의 습격
  lexicon: Smith
  rationale: 영적 존재와 악령을 그대로 유지하되, ‘apparitions’는 현상 자체보다 환영/유령적 출현으로 이해해 ‘환영의 악령들’로 옮겼습니다.
- source_word: ܚܛܘܦܝܐ
  english_pob_choice: plundering
  chosen_korean: 약탈
  alternatives_korean:
  - 노략
  - 탈취
  lexicon: Payne Smith
  rationale: 폭력적 약취의 사건성을 담는 표준적인 한국어로 처리했습니다.
- source_word: ܐܢܘܣܝܐ
  english_pob_choice: oppression
  chosen_korean: 압제
  alternatives_korean:
  - 억압
  - 강압
  - 폭압
  lexicon: Smith
  rationale: 사회적·정치적 강제와 고통의 뉘앙스를 보존하기 위해 ‘압제’를 선택했습니다.
