  yaml_path: translation/extra_canonical/2_baruch/077.yaml
  text: And I[a], Baruch, went from there and came to the people, and I gathered them from the great to the small. And I said to them, “Hear, children of Israel. See how few of you are left from the twelve tribes of Israel. Yet to you and to your fathers the Lord gave the law more than to all the nations. And because your brothers transgressed the commandments of the Most High, he brought upon them what you have seen[b]. But have compassion on those who were before, and also on those who are after, lest you too be found unrighteous like your brothers. But the righteous one judges his works, because he is the Mighty One whom you seek, and he is the Mighty One in whom you hope. And he sees to preserve, not to forsake. Have you not seen what happened to Zion? Or do you think that the cedar sinned, and for this it was destroyed? Or that the land did some wrong, and for this it was handed over? And do you not know that because of you those things suffered which did not sin, and because of what
    you did, that man who did no wrong was removed from your midst? And all the people answered and said to me, ‘Because we remember the good testimonies that the Mighty One did with you, make known to us also those things that we do not know. But ask on our behalf concerning the Most High, and write also to our brothers in Babylon a letter of instruction and a writing of hope, so that you may show them also what has not departed from you. For the counsels of Israel have perished, and the lamps that gave light are extinguished, and the springs from which we used to drink have been stopped up. And we are left in darkness, and in the thick forest, and in the thirst of the wilderness.’ And I answered and said to them, “Counselors and lamps and springs come from the law; and though we depart, the law remains. If therefore you look into the law and are intent on wisdom, the lamp will not be lacking, and the shepherd will not depart[d][c], and the spring will not fail.”
  footnotes:
  - marker: a
    text: Verse 5 is partially stabilized from the Kmosko Latin control, since the Ceriani chapter edge is textually awkward at this point. ‘As a remnant’ reflects that control-backed sense.
    reason: textual_variant
  - marker: b
    text: Verses 12–16 are affected by an overlap/boundary problem in the current Ceriani chapter bucket. The renderings ‘writing of hope,’ ‘counsels,’ and the closing triad (‘lamp … shepherd … spring’) use Kmosko to clarify an unstable page transition.
    reason: alternative_reading
  - marker: c
    text: Or 'whom you worship'.
    reason: previous_rendering
  - marker: d
    text: Or 'in the deep cloud'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 바룩이 거기에서 떠나 사람들에게 와서, 큰 사람부터 작은 사람까지 그들을 모았습니다. 그리고 그들에게 말했습니다. “이스라엘 자손들아, 들으십시오. 이스라엘의 열두 지파 가운데 너희가 얼마나 적게 남았는지 보십시오. 그러나 주께서는 너희와 너희 조상들에게 모든 민족들보다 더 많은 율법을 주셨습니다. 너희 형제들이 지극히 높으신 분의 명령들을 어겼기 때문에, 그분은 너희가 본 일을 그들에게 가져오셨습니다. 그러나 먼저 있던 이들에게도, 또한 나중에 올 이들에게도 긍휼을 베푸십시오. 그래야 너희도 형제들처럼 불의한 자로 드러나지 않을 것입니다. 의로운 이는 그의 행위를 심판하십니다. 너희가 찾는 분이 바로 그 능하신 분이시며, 너희가 희망을 두는 분도 그 능하신 분이십니다. 그분은 지키시어 버리지 않으십니다. 너희는 시온에게 일어난 일을 보지 못했습니까? 또는 너희는 백향목이 죄를 지어서 그것이 무너졌다고 생각합니까? 또는 그 땅이 무슨 악을 행해서 그것이 넘겨졌다고 생각합니까? 또 너희는, 너희 때문에 죄짓지 않은 것들이 고난을 겪었고, 너희가 한 일 때문에 아무 잘못도 없는 그 사람이 너희 한가운데서 제거되었다는 것을 알지 못합니까? 그러자 온 백성이 나에게 대답하여 말했습니다. ‘우리가 능하신 분께서 당신과 함께 행하신 좋은 증언들을 기억하니, 우리가 알지 못하는 것들도 우리에게 알려 주십시오. 또 지극히 높으신 분에 관하여 우리를 위해 간구해 주시고, 바빌론에 있는 우리 형제들에게도 교훈의 편지와 희망의 글을 써 주십시오. 그러면 우리에게서 떠나지 않은 것들을 그들에게도 보여 줄 수 있을 것입니다. 이스라엘의 조언들은 사라졌고, 빛을 비추던 등불들은 꺼졌으며, 우리가 마시던 샘들은 막혀 버렸습니다. 우리는 어둠 속에, 짙은 숲 속에, 그리고 광야의 목마름 속에 남겨졌습니다.’ 그러자 내가 그들에게 대답하여 말했습니다. “조언들과 등불들과 샘들은 율법에서 나옵니다. 우리가 떠날지라도 율법은 남아 있습니다. 그러므로 너희가 율법을 살피고
    지혜에 마음을 쏟으면, 등불은 부족하지 않을 것이며, 목자도 떠나지 않을 것이며, 샘도 마르지 않을 것입니다.”[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 교훈
  lexicon: Payne Smith
  rationale: 계약적·성경적 규범을 가리키는 핵심어이므로, 본문 전반의 ‘등불/샘/지혜’와 연결되는 안정된 원천으로 ‘율법’을 유지했습니다.
- source_word: ܡܪܝܐ
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 주님
  - 야훼
  lexicon: Syr. common divine title
  rationale: 해당 본문은 직접적인 야훼 উদ্ধू/인용 표지가 아니라 서사 속 칭호이므로, POB 관례에 따라 ‘주’로 자연스럽게 옮겼습니다.
- source_word: ܪ̈ܥܘܬܐ
  english_pob_choice: counsels
  chosen_korean: 조언들
  alternatives_korean:
  - 생각들
  - 계책들
  - 목자들
  lexicon: Payne Smith
  rationale: Kmosko 계열 교정과 최신 POB 판단을 따라 ‘목자들’이 아니라 ‘counsels’ 계열로 읽고, 한국어에서는 문맥상 자연한 ‘조언들’로 옮겼습니다.
- source_word: ܫܪ̈ܓܐ
  english_pob_choice: lamps
  chosen_korean: 등불들
  alternatives_korean:
  - 등들
  - 빛들
  lexicon: Payne Smith
  rationale: 구체적 이미지인 램프/등불을 유지해 율법이 주는 인도와 계시의 은유를 살렸습니다.
- source_word: ܡܒܘ̈ܥܐ
  english_pob_choice: springs
  chosen_korean: 샘들
  alternatives_korean:
  - 샘물들
  - 근원들
  lexicon: Payne Smith
  rationale: 생명과 공급의 흐름을 드러내는 이미지이므로, 가장 간결하고 표준적인 ‘샘들’을 선택했습니다.
theological_decisions:
- issue: ‘시온/땅’이 죄를 지었는지에 대한 수사적 질문
  chosen_reading: 시온과 땅은 죄의 원인이 아니며, 파괴의 책임은 백성의 죄에 있습니다.
  alternative_readings:
  - 장소 자체에 대한 일반적 심판 진술
  - 은유적 자연 재난 묘사
  rationale: 본문의 수사 질문은 성소와 땅을 무죄로 두고 책임을 백성에게 돌리는 구조를 분명히 합니다.
  doctrine_reference: 공동체 죄와 심판의 책임 귀속
