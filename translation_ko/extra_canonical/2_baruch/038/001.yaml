  - 끊겨 버린 적이 없음을
  lexicon: Payne Smith
  rationale: 단순한 자발적 ‘떠남’보다 관계적 단절을 뜻하는 강한 표현을 살려, 문맥상의 언약적 충실성을 드러냈습니다.
