  naturalness: 합쇼체는 일관됩니다. 다만 ‘이해로 인도받는 이들’은 다소 번역투이므로 ‘깨달음으로 인도받는 이들’이 자연스럽고, ‘올곧음’보다 ‘바름’이 현대 표준어 문맥에서 더 매끄럽습니다. ‘어린 날부터’는 ‘아주 어릴 때부터’로 다듬는 편이 자연스럽습니다.
  terminology: ‘주님’, ‘율법’, ‘생명’, ‘지혜’, ‘환상’, ‘영혼’은 적절합니다. ܬܪܝܨܘܬܐ의 도덕적 곧음은 ‘바름’으로 유지했으며, ‘끊어진 적이 없다’는 관계적 단절의 강도를 보존합니다.
  issues:
  - severity: medium
    issue: ‘continually’의 의미가 번역에서 누락되었습니다.
    rationale: 영어 POB 및 해당 기도 본문의 지속적 조명 표현을 반영하여 ‘늘’을 넣어야 합니다.
  - severity: low
