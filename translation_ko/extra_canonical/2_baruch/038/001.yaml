    rationale: ‘이해로 인도받는’, ‘올곧음’, ‘어린 날’은 의미상 가능하지만 ‘깨달음으로 인도받는’, ‘바름’, ‘아주 어릴 때’가 더 자연스럽습니다.
  - severity: medium
    issue: '[a] 앵커에 대응하는 한국어 각주가 필요합니다.'
    rationale: 앵커가 있는 이상 각주는 완결되어야 합니다. OCR 기반의 상충 독법은 동등한 본문 번역으로 제시하지 않고 전사상 혼동임을 밝혀야 합니다.
  revised_text: 저는 기도하며 말했습니다. “주님, 나의 주님이시여, 주님께서는 깨달음으로 인도받는 이들에게 늘 빛을 비추십니다. 주님의 율법은 생명이고, 주님의 지혜는 바름입니다. 그러므로 이 환상의 해석을 제게 보여 주십시오. 제 영혼이 주님의 율법 안에서 걸어왔고, 아주 어릴 때부터 주님의 지혜에서 끊어진 적이 없음을 주님께서 아시기 때문입니다.”[a]
