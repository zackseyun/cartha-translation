  yaml_path: translation/extra_canonical/2_baruch/038/001.yaml
  text: And I prayed and said, “Lord, my Lord, you continually give light to those who are guided in understanding. Your law is life, and your wisdom is uprightness. Therefore show me the interpretation of this vision. For you know that my soul has walked in your law, and from my earliest days I have not been cut off from your wisdom.”
  footnotes:
  - marker: a
    text: Or 'And he answered and said to me, “Why do you ask me? You help those who are guided by understanding in your prayer. My law is life, and my wisdom is uprightness. The mystery between me and you is the interpretation of this vision. For you have seen how your going out in your prayer was persuaded by my law, and from days of old you have not departed from my wisdom.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 저는 기도하며 말했습니다. “주님, 나의 주님이시여, 주님은 이해로 인도받는 이들에게 빛을 비추십니다. 주님의 율법은 생명이고, 주님의 지혜는 올곧음입니다. 그러므로 이 환상의 해석을 저에게 보여 주십시오. 제 영혼이 주님의 율법 안에서 걸어왔고, 제 어린 날부터 주님의 지혜에서 끊어진 적이 없음을 주님께서 아시기 때문입니다.”[a]
  philosophy: optimal-equivalence
