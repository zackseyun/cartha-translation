translation:
  language: ko
  text: 당신이 본 열두 번째 빛나는 물들—이것이 그 말씀입니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것들이 바로 그것들입니다:’
    reason: 영어 POB 감사 기록에 보존된 대안적 식별 표현을 한국어로 옮겼습니다. 본문은 시리아어 ܗܕܐ ܗܝ ܡܠܬܐ에 따른 ‘이것이 그 말씀입니다’를 유지합니다.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  english_pob_choice: bright waters
  chosen_korean: 빛나는 물들
  alternatives_korean:
  - 밝은 물들
  - 환한 물들
  - 광채 나는 물들
  lexicon: Payne Smith
  rationale: 반복되는 상징어구를 살리기 위해 ‘물들’과 ‘빛나는’를 직역에 가깝게 결합했고, 물의 상징성과 시각적 대비를 유지했습니다.
- source_word: ܬܪܥܣܪ
  english_pob_choice: twelfth
  chosen_korean: 열두 번째
  alternatives_korean:
  - 열두째
  - 제12의
  lexicon: 표준 수사 표현
  rationale: 시의적이기보다 서술적 지시이므로 현대 한국어의 자연스러운 서수 표현을 사용했습니다.
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  english_pob_choice: this is the word
  chosen_korean: 이것이 그 말입니다
  alternatives_korean:
  - 이것이 말씀입니다
  - 이것이 그 의미입니다
  - 이것이 해석입니다
  lexicon: Payne Smith
  rationale: 문맥상 해설 도입 공식이므로 ‘말’로 옮겨 해석문임을 드러내면서도, 원문의 직접적인 식별 문구를 살렸습니다.
theological_decisions:
- issue: 해석 공식의 성격
  chosen_reading: 본문은 단순 설명이 아니라, 앞서 본 상징적 물을 특정 의미로 식별하는 예언적 해석 도입문입니다.
  alternative_readings:
  - 단순한 문체적 반복으로 처리
  - ‘이것이 그 의미입니다’로만 완화
  rationale: 시리아어의 정형구를 따라 상징과 해석의 관계를 분명히 해야 하므로, 식별문으로 읽히게 번역했습니다.
  doctrine_reference: apocalyptic interpretation / symbolic revelation
