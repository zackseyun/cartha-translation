    rationale: 원문과 영어 POB가 보존하는 ‘this is the word’ 공식에 대응하면서 현대 한국어 성서 문체로 자연스럽게 읽히도록 ‘이것이 그 말씀입니다’로 고치는 것이 안전합니다.
