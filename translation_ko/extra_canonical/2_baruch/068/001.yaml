  source_fidelity: 시리아어 정형구 ܗܕܐ ܗܝ ܡܠܬܐ는 앞서 본 상징에 대한 해석을 도입하는 ‘이것이 그 말씀/말입니다’라는 식별 공식입니다. 현재의 ‘그 말’은 어휘상 가능하나 한국어에서 부자연스럽고, 영어 POB의 ‘this is the word’ 및 최근의 교정 이력과도 잘 맞지 않습니다. ‘빛나는 물들’과 ‘열두 번째’는 원문의 상징 이미지와 서수를 충실히 보존합니다.
  naturalness: ‘그리고’는 문맥상 가능하지만 절 단독의 해석 도입에서는 ‘당신이 본’으로 시작하는 편이 자연스럽습니다. ‘이것이 그 말입니다’는 현대 표준 한국어에서 지시 대상이 불분명하고 번역투이므로, 성서적이되 현대적인 ‘이것이 그 말씀입니다’가 더 자연스럽습니다.
