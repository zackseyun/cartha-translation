base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/006.yaml
  text: '1 And it happened on the next day that[a], behold, the forces of the Chaldeans surrounded the city. And at evening time I, Baruch, left the people, and I went out and stood by the oak, and I was grieving over Zion and lamenting over the captivity that had come upon the people.


    2 And behold, suddenly a spirit of strength lifted me up and carried me aloft above the wall of Jerusalem; and I saw four angels standing at the four corners of the city[d][c][b], each one holding a torch.'
  footnotes:
  - marker: a
    text: The Ceriani page for this chapter overlaps with the end of chapter 5; the chapter 6 division is best taken from the section marker before 'on the next day,' but the page edge remains a medium-confidence boundary.
    reason: textual_variant
  - marker: b
    text: Several words in the opening lines are OCR-fragile in the Ceriani substrate. The rendering 'forces of the Chaldeans' and 'stood by the oak' is supported by the Kmosko control witness rather than by the Ceriani OCR alone.
    reason: alternative_reading
  - marker: c
    text: The description of what the four angels hold continues onto the next page, where the fiery character of the object is made explicit; 'torch' here anticipates that continuation.
    reason: cross_reference
  - marker: d
    text: Or 'above the square of Jerusalem'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 다음 날에, 보라, 갈대아 사람들의 군세가 도시를 에워쌌습니다. 그리고 저녁 무렵에 나 바룩은 백성들 곁을 떠나 나가서 떡갈나무 곁에 섰고, 시온 위에 일어난 일과 백성에게 닥친 포로됨을 두고 슬퍼하며 한탄하고 있었습니다.


    보라, 갑자기 능력의 영이 저를 들어 올려 예루살렘 성벽 위로 날랐습니다. 그리고 저는 도시의 네 모퉁이에 각각 서 있는 네 천사를 보았는데, 각 천사는 횃불 하나씩을 들고 있었습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  english_pob_choice: the forces of the Chaldeans
  chosen_korean: 갈대아 사람들의 군세
  alternatives_korean:
  - 갈대아 사람들의 군대
  - 갈대아 군세
  lexicon: Payne Smith
  rationale: 군사적 압박을 나타내는 복수 집합 표현을 살리되, 문맥상 ‘군대’보다 더 포괄적인 ‘군세’가 자연스럽습니다.
- source_word: ܘܐܬܬܙܝܥܝ ... ܒܟܝܐ
  english_pob_choice: I was grieving ... and lamenting
  chosen_korean: 슬퍼하며 한탄하고 있었습니다
  alternatives_korean:
  - 근심하며 울고 있었습니다
  - 슬퍼하며 애통하고 있었습니다
  lexicon: Smith Syriac Dictionary
  rationale: 내적 슬픔과 표출된 탄식을 함께 담기 위해 ‘슬퍼하며’와 ‘한탄하다’를 병렬로 옮겼습니다.
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  english_pob_choice: a spirit of strength
  chosen_korean: 능력의 영
  alternatives_korean:
  - 힘의 영
  - 강한 영
  lexicon: Payne Smith
  rationale: 문맥상 바룩을 들어 올리는 능동적 힘을 가리키므로, 한국어에서 가장 자연스럽게 전달되는 ‘능력의 영’을 택했습니다.
- source_word: ܫܘܪܐ
  english_pob_choice: the wall of Jerusalem
  chosen_korean: 예루살렘 성벽
  alternatives_korean:
  - 예루살렘 담
  - 예루살렘 벽
  lexicon: Syriac control witness / applied revision
  rationale: 교정된 대조 본문이 ܫܘܪܐ(성벽)를 지지하므로, ‘성벽’으로 반영했습니다.
- source_word: ܠܡܦܝܕܐ
  english_pob_choice: a torch
  chosen_korean: 횃불
  alternatives_korean:
  - 등불
  - 횃덩어리
  lexicon: Payne Smith
  rationale: 다음 문맥에서 불빛의 성격이 분명해지므로, 약한 ‘등불’보다 화염성을 드러내는 ‘횃불’이 적절합니다.
theological_decisions:
- issue: ‘영’의 성격과 대문자화 여부
  chosen_reading: 능력의 영을 그대로 옮기고, 성령으로 특정하지 않았습니다.
  alternative_readings:
  - 성령으로 옮김
  - 하나님의 영으로 옮김
  rationale: 시리아어 본문은 이 대목에서 성령을 명시하지 않고 ‘능력의 영’이라고만 하므로, 후대 교리 용어로 좁히지 않았습니다.
  doctrine_reference: 본문-우선 원칙; pneumatology lexical restraint
