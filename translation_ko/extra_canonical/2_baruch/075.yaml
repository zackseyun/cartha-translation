  yaml_path: translation/extra_canonical/2_baruch/075.yaml
  text: '1[a]. And I answered and said, “Who can comprehend your goodness, Lord? For it is beyond comprehension.

    2. Or who can search out your mercies, which are without end?

    3[b]. Or who can grasp your understanding?

    4. Or who can recount the thoughts of your mind?

    5. Or which of those born can hope to come to these things, unless it is one to whom you show mercy and are gracious?

    6. For unless, in compassion, you have mercy on human beings, those who are under your right hand cannot come to these things, except those who are called in the excellent number.

    7. But we who remain—if we know why we came, and have subjected ourselves to him who brought us up from Egypt—we shall come again, and we shall remember what has passed, and rejoice over what was.

    8. But if we do not now know why we came, and do not recognize what has been, neither shall the immeasurable be seen, nor shall the preeminence of him who established it from the beginning be made known[d][c]; and not a few living creatures would be astonished.”'
  footnotes:
  - marker: a
    text: The close of verse 8 is medium-confidence. The Ceriani page boundary at this chapter edge is rough, so the final clause is translated cautiously with help from the Kmosko control witness.
    reason: textual_variant
  - marker: b
    text: “Under your right hand” is kept literal rather than paraphrased, since the image likely combines rule, nearness, and protection.
    reason: lexical_alternative
  - marker: c
    text: Or 'Who can be compared, Lord, to your goodness?'.
    reason: previous_rendering
  - marker: d
    text: Or 'nor shall the preeminence of what was prepared from the beginning be made known'.
    reason: previous_rendering
translation:
  language: ko
  text: '1. 이에 제가 대답하여 말했습니다. 「주님, 누가 주님의 선하심을 헤아릴 수 있습니까? 그것은 헤아릴 수 없기 때문입니다.

    2. 또 누가 주님의 긍휼들을 끝이 없도록 다 찾아낼 수 있습니까?

    3. 또 누가 주님의 지혜를 붙잡을 수 있습니까?

    4. 또 누가 주님의 마음의 생각들을 헤아려 말할 수 있습니까?

    5. 또 태어난 자들 가운데 누가 이 일들에 이르기를 바랄 수 있겠습니까? 다만 주님께서 긍휼을 베푸시고 은혜를 주시는 이만 가능합니다.

    6. 이는 주님께서 자비로 사람들에게 긍휼을 베푸시지 않으면, 주님의 오른손 아래 있는 자들 가운데서도 이 일들에 이를 수 있는 자가 없고, 오직 탁월한 수에 부름받은 자들만 있기 때문입니다.

    7. 그러나 남아 있는 우리—우리가 왜 왔는지 알고, 우리를 애굽에서 이끌어 올리신 이에게 우리 자신을 복종시킨다면—다시 올 것이며, 지나간 것을 기억하고 있었던 것을 두고 기뻐할 것입니다.

    8. 그러나 우리가 지금 왜 왔는지 알지 못하고, 있었던 것을 알아보지 못한다면, 헤아릴 수 없는 것 또한 보이지 않을 것이며, 처음부터 그것을 세우신 분의 탁월함도 알려지지 않을 것입니다[a]; 그러면 적지 않은 생물들이 놀라게 될 것입니다。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܒܬܐ / bonitati tuae
  english_pob_choice: your goodness
  chosen_korean: 주님의 선하심
  alternatives_korean:
  - 주님의 좋으심
  - 주님의 선함
  lexicon: Payne Smith
  rationale: 하나님의 성품을 말하는 문맥에서 ‘선하심’은 단순한 친절보다 더 넓고 자연스러운 의미를 담아, POB의 ‘goodness’를 안정적으로 옮깁니다.
- source_word: ܪ̈ܚܡܝܟ / miserationes tuas
  english_pob_choice: your mercies
  chosen_korean: 주님의 긍휼들
  alternatives_korean:
  - 주님의 자비들
  - 주님의 자애들
  lexicon: Payne Smith
  rationale: 복수형을 살려 하나님의 긍휼이 단일한 성질이 아니라 풍성하고 여러 방식으로 드러나는 은혜임을 드러냈습니다.
- source_word: ܡܬܬܚܡܐ / incomprehensibilis
  english_pob_choice: beyond comprehension
  chosen_korean: 헤아릴 수 없기
  alternatives_korean:
  - 알아낼 수 없기
  - 이해할 수 없기
  lexicon: Payne Smith
  rationale: ‘헤아리다’는 지적 파악과 측량의 뉘앙스를 함께 담아, 하나님의 선하심이 인간의 인식 범위를 넘어선다는 점을 자연스럽게 보존합니다.
- source_word: ܬܚܝܬ ܝܡܝܢܟ / sub dextera tua
  english_pob_choice: under your right hand
  chosen_korean: 주님의 오른손 아래
  alternatives_korean:
  - 주님의 오른손 아래에
  - 주님의 권세 아래
  lexicon: Payne Smith
  rationale: 이미지를 그대로 유지해 통치와 보호의 함의를 함께 살렸으며, 설명적 추상어로 바꾸지 않았습니다.
- source_word: ܒܡܢܝܢܐ ܡܝܬܪܐ / in numeris praeclaris
  english_pob_choice: in the excellent number
  chosen_korean: 탁월한 수
  alternatives_korean:
  - 영광스러운 수
  - 뛰어난 수
  lexicon: Payne Smith
  rationale: 묵시적 표현의 낯설음을 유지하면서도 한국어에서 읽히는 문장성을 확보하기 위해 직역에 가깝게 옮겼습니다.
- source_word: ܐܢܫܐ ܕܐܫܬܚܪܘ / nos qui subsistimus
  english_pob_choice: we who remain
  chosen_korean: 남아 있는 우리
  alternatives_korean:
  - 남은 우리
  - 우리가 살아남은 우리
  lexicon: Payne Smith
  rationale: 공동체적 잔존을 나타내는 표현으로, 단순한 생존보다 ‘남아 있음’이라는 예언적/묵시적 어감을 살렸습니다.
- source_word: ܡܕܡ ܕܗܘܐ / quod fuit
  english_pob_choice: what was
  chosen_korean: 있었던 것
  alternatives_korean:
  - 무엇이었던 것
  - 지난 것
  lexicon: Payne Smith
  rationale: 회상 대목의 짧고 엄숙한 어조를 유지하면서, 한국어로는 자연스럽게 ‘있었던 것’으로 옮겼습니다.
theological_decisions:
- issue: Verse 6의 ‘오른손 아래’ 이미지를 설명적으로 풀지 여부
  chosen_reading: 주님의 오른손 아래 있는 자들
  alternative_readings:
  - 주님의 권세 아래 있는 자들
  - 주님의 보호 아래 있는 자들
  rationale: 이 표상은 통치와 보호를 함께 암시하므로, 한쪽 의미로 좁히지 않고 원문 이미지를 그대로 살렸습니다.
  doctrine_reference: 원문 이미지 보존; 신학적 의미를 단일 개념으로 환원하지 않음
- issue: ‘부름받은 자들’과 ‘탁월한 수’의 관계
  chosen_reading: 오직 탁월한 수에 부름받은 자들만
  alternative_readings:
  - 오직 탁월한 수 안에 세어진 자들만
  - 오직 영광스러운 수에 속한 자들만
  rationale: 원문은 특별히 정해진 무리에 대한 묵시적 표현을 유지하며, 체계화된 예정론으로 과도하게 정리하지 않습니다.
  doctrine_reference: 묵시문학적 선별성은 보존하되 교리적 과잉정리를 피함
