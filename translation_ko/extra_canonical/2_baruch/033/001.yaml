  - marker: b
    text: Or 'prepare'.
    reason: previous_rendering
translation:
  language: ko
  text: “당신의 동료 예레미야가 당신에게 내린 명령은 이것입니까? ‘이 백성을 돌보십시오. 나는 가서 바빌론에 있는 포로 된 우리 형제들 가운데 나머지를 위로하겠습니다.’ 이제 당신도 우리를 떠나신다면, 당신이 우리에게서 떠나는 것보다 우리 모두가 당신보다 먼저 죽는 편이 더 낫겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܐ
  english_pob_choice: commands
  chosen_korean: 명령들
  alternatives_korean:
  - 지시들
  - 명령
  lexicon: Payne Smith
  rationale: 복수형이고 사람들의 항의적 인용이므로, 단수보다 복수의 뉘앙스를 살린 ‘명령들’이 자연스럽고 원문의 힘을 유지합니다.
- source_word: ܚܒܪܟ
  english_pob_choice: your companion
  chosen_korean: 당신의 동료
  alternatives_korean:
  - 당신의 동행
  - 당신의 친구
  lexicon: Payne Smith
  rationale: 예레미야와 바룩의 관계를 지나치게 친분 중심으로 만들지 않으면서도, 단순한 동행보다 가까운 협력 관계를 드러내기 위해 ‘동료’를 택했습니다.
- source_word: ܐܦܝܣ
  english_pob_choice: comfort
  chosen_korean: 위로하다
  alternatives_korean:
  - 간청하다
  - 권고하다
  - 설득하다
  lexicon: Payne Smith
  rationale: 문맥상 바빌론의 형제들을 대상으로 한 돌봄과 회복의 행위이며, 영어 POB의 확정된 선택을 따라 ‘위로하다’로 옮겼습니다.
- source_word: ܕܢܦܠܘ ...
  english_pob_choice: those who have fallen into captivity
  chosen_korean: 포로로 끌려간
  alternatives_korean:
  - 포로가 된
  - 포로로 떨어진
  lexicon: Payne Smith
  rationale: 파손된 문맥이지만 유배/포로의 상태를 가리키는 구절이므로, 한국어에서 가장 직접적인 ‘포로로 끌려간’으로 압축해 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 비교 구문과 정서적 과장
  chosen_reading: “당신이 우리를 떠나는 것보다 우리가 당신 앞에서 모두 죽는 편이 더 낫겠습니다”로 옮겨, 공동체의 절박한 상실감을 직접 드러냈습니다.
  alternative_readings:
  - “당신이 우리에게서 떠나는 것보다 차라리 우리 모두 죽는 것이 낫겠습니다”
  - “당신이 우리를 버리는 것보다…”
  rationale: 원문은 단순 정보 전달이 아니라 지도자의 부재에 대한 집단적 탄원을 표현하므로, 비교 구조를 보존하면서도 한국어에서 자연스럽게 긴박함을 전달해야 합니다.
  doctrine_reference: 서사적 탄원과 공동체 보존의 긴장
