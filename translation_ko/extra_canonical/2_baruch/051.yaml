  yaml_path: translation/extra_canonical/2_baruch/051.yaml
  text: '1 And it shall be[a], after that appointed day has passed, that then the form of those who are condemned will be changed afterward, and also the glory of those who are vindicated.


    2 For the form of those who now act wickedly will become worse than it is, so that they may endure torment.


    3 But the glory of those who have now been vindicated by my law—those who had understanding in their life, and those who planted in their heart the root of wisdom—will then be glorified in transformations, and the form of their face will be turned into the light of their beauty, so that they may receive the world that does not die, which is promised to them.


    4 And above all, those who then come will be grieved, because they despised my law and stopped their ears so that they would not hear wisdom or receive understanding.


    5 When therefore they see those over whom they are now exalted, that those then are exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms.


    6 For first they will see[b], and afterward they will depart to be tormented.


    7 But for those who have been saved by their works, and for whom the law was hope, and understanding expectation, and wisdom a confidence, wonders will appear in their time.


    8 For they will see that world which is now hidden from them,


    9 and they will see the time that is now hidden from them; and time will no longer make them grow old.


    10 For they will dwell in the heights of that world, and they will be made like the angels, and be made equal to the stars; and they will be changed into every form they desire, from beauty into loveliness, and from light into the splendor of glory.


    11 For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their coming arrives.


    12 Then the excellence of the righteous will be greater than that of the angels.


    13 For the first will receive the last, those for whom they were waiting; and the last, those of whom they had heard that they had passed away.


    14 For they have been delivered from this world of affliction and have laid down the burden of distresses.


    15 For why then did men lose their life, and for what did those on the earth exchange their soul?


    16 For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not grow old for those who come to it, and they rejected the time of glory[c], so that they should not come to the honor of which I told you before.'
  footnotes:
  - marker: a
    text: The supplied Ceriani bucket overlaps a chapter edge. Following the Kmosko LI control, this draft begins with the section on the transformed forms of the condemned and the vindicated, not with the preceding resurrection-recognition material.
    reason: textual_variant
  - marker: b
    text: In verse 11, the Syriac/OCR is somewhat difficult at the phrase rendered 'the expanses of Paradise.' The sense is spatial unveiling, but the exact nuance of the noun remains less certain than the broader clause.
    reason: lexical_alternative
  - marker: c
    text: Or 'For they did not choose for themselves the time that cannot pass away without anguish; but they chose for themselves the time whose end is full of laments and evils'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 그리고 그 정해진 날이 지나면, 그때는 정죄된 이들의 형상이 그 뒤에 바뀌고, 또한 의롭다 함을 받은 이들의 영광도 바뀔 것입니다.


    2 지금 악을 행하는 이들의 형상은 지금보다 더 나빠질 것이니, 그들이 고통을 견디게 하려는 것입니다.


    3 그러나 지금 내 율법으로 의롭다 함을 받은 이들 — 곧 자기 삶 가운데서 깨달음을 가졌고, 자기 마음에 지혜의 뿌리를 심은 이들의 영광은 그때 변화 속에서 영화롭게 될 것이며, 그들의 얼굴의 형상은 아름다움의 빛으로 바뀌어, 그들에게 약속된 죽지 않는 세상을 받게 될 것입니다.


    4 그리고 무엇보다도, 그때 오는 이들은 슬퍼할 것입니다. 그들이 내 율법을 멸시하고, 지혜를 듣지 않으려고 귀를 닫아, 깨달음을 받지 않았기 때문입니다.


    5 그러므로 그들이 지금 높임을 받고 있는 이들 위에 있는 이들이 그때는 그들보다 더 높임을 받고 영화롭게 되는 것을 볼 때, 이들과 저들은 바뀔 것입니다. 뒤에 있는 이들은 천사들의 찬란함으로, 앞에 있는 이들은 더더욱 사라져가며 경이와 형상들의 모습 앞에서 놀라게 될 것입니다.


    6 그들은 먼저 보게 되고, 그 뒤에는 떠나가서 고통을 받게 될 것입니다.


    7 그러나 자기 행위로 구원을 받은 이들과, 율법이 그들에게 희망이었고, 깨달음이 기대였고, 지혜가 확신이었던 이들에게는, 자기 때에 놀라운 일들이 나타날 것입니다.


    8 그들은 지금은 자기들에게 숨겨져 있는 그 세상을 볼 것이며,


    9 지금은 자기들에게 숨겨져 있는 그 때를 볼 것이니, 그때에는 시간이 더 이상 그들을 늙게 하지 못할 것입니다.


    10 그들은 그 세상의 높은 곳에 거할 것이며, 천사들처럼 되며 별들과 동등하게 되고, 그들이 바라는 모든 형상으로 바뀔 것입니다 — 아름다움에서 사랑스러움으로, 빛에서 영광의 찬란함으로 바뀌어 갈 것입니다.


    11 그들에게는 낙원의 넓은 공간이 펼쳐질 것이며, 보좌 아래 있는 살아 있는 존재들의 위엄의 아름다움이 그들에게 보일 것이고, 또한 천사들의 모든 군대도 보일 것입니다. 곧 내 말로 붙들려 나타나지 못하게 된 자들과, 내 명령으로 자기 자리에 서서 그들의 도착 때까지 지켜지는 자들입니다.


    12 그때는 의인들의 탁월함이 천사들보다 더 클 것입니다.


    13 처음 것은 마지막 것을 받게 될 것입니다. 곧 그들이 기다리던 이들이고, 마지막 것은 그들이 이미 죽어 지나갔다고 들은 이들입니다.


    14 그들은 이 고난의 세상에서 건짐을 받았고, 괴로움의 짐을 내려놓았기 때문입니다.


    15 그러니 사람이 왜 자기 생명을 잃었으며, 땅 위의 이들은 무엇과 자기 영혼을 바꾸었습니까?


    16 그들은 고통 없이 지나가지 못하는 이때를 스스로 선택했고, 끝이 애통함과 악으로 가득한 그때를 스스로 선택했으며, 그들에게 이르러 오는 이들을 위해서는 늙지 않는 세상을 거절했고, 제가 전에 여러분에게 말한 그 명예에 이르지 못하도록 영광의 때를 거절했습니다.[a][b][c]'
  philosophy: optimal-equivalence
