  - 형태
  lexicon: Payne Smith
  rationale: 변화와 변형의 반복되는 대비를 한국어에서 가장 안정적으로 살리면서, 단순한 외형보다 존재 방식의 드러남까지 담기 위해 ‘형상’을 택했습니다.
- source_word: ܐܙܕܩܘ
  english_pob_choice: vindicated
  chosen_korean: 의롭다 함을 받은
  alternatives_korean:
  - 의롭다 함을 입은
  - 정당하다고 인정된
  lexicon: Payne Smith
  rationale: 법정적 무죄 선언보다는 본문이 말하는 종말론적 인정과 회복을 함께 드러내기 위해 ‘의롭다 함을 받은’으로 옮겼습니다.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  english_pob_choice: the root of wisdom
  chosen_korean: 지혜의 뿌리
  alternatives_korean:
  - 지혜의 근원
  - 지혜의 뿌리를
  lexicon: Payne Smith
  rationale: 마음에 ‘심는다’는 동사와 연결된 구체적 은유를 살리기 위해 ‘지혜의 뿌리’를 유지했습니다.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐܬ
  english_pob_choice: the world that does not die
  chosen_korean: 죽지 않는 세상
  alternatives_korean:
  - 죽지 않는 세계
  - 불멸의 세상
  lexicon: Payne Smith
  rationale: 직역을 지나치게 경직되게 만들지 않으면서도, 본문이 강조하는 죽음 없음의 대조를 분명히 하기 위해 ‘죽지 않는 세상’으로 옮겼습니다.
- source_word: ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ
  english_pob_choice: the expanses of Paradise
  chosen_korean: 낙원의 넓은 공간
  alternatives_korean:
  - 낙원의 지평
  - 낙원의 광활한 곳
  lexicon: Payne Smith
  rationale: 본문의 시각적·공간적 계시를 살리되, OCR가 지시하는 의미의 불확실성을 과장하지 않기 위해 넓이를 드러내는 표현으로 처리했습니다.
theological_decisions:
- issue: 의인과 천사의 관계
  chosen_reading: 의인들은 천사들처럼 되고 별들과 동등하게 되지만, 본질상 천사로 동일시되지는 않습니다.
  alternative_readings:
  - 의인들이 천사가 된다는 읽기
  - 비유적 표현일 뿐 변화가 아니라는 읽기
  rationale: 본문은 ‘천사들처럼’, ‘별들과 동등하게’, ‘천사들보다 더 크다’라는 비교를 겹쳐 사용하여, 동일화보다 영화된 지위를 말합니다.
  doctrine_reference: 종말론적 변형과 영광의 비교 표현
- issue: 율법, 행위, 지혜의 연결
  chosen_reading: 율법과 행위, 깨달음, 지혜가 종말의 의롭다 함과 영광의 기준으로 함께 제시된 본문의 구조를 그대로 드러냈습니다.
