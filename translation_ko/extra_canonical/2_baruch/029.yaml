base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/029.yaml
  text: And he answered and said to me[a], “What will happen then will happen to the whole earth. Therefore all who live will feel it. But at that time I will protect only those who are found in this land in those days. And it will be, after what is to happen in those parts has been accomplished, that the Messiah will begin to be revealed. And Behemoth will be revealed from his place, and Leviathan will ascend from the sea, those two great monsters that I created on the fifth day of creation and kept until that time. Then they will become food for all who remain. The earth also will yield its fruit, one in ten thousand. On one vine there will be a thousand branches, and one branch will produce a thousand clusters, and one cluster will produce a thousand grapes, and one grape will produce a kor of wine. And those who have hungered will rejoice, and they will see wonders every day. For winds will go out from before me to bring every morning the fragrance of aromatic fruits, and at the close
    of the day clouds distilling the dew of health. And it will happen at that same time that the treasury of manna will again descend from on high, and they will eat of it in those years[d][c][b], because these are they who have come to the consummation of time.”
  footnotes:
  - marker: a
    text: Chapter 29 is structurally control-backed. The present Ceriani bucket overlaps adjacent chapters and is textually unstable at this boundary, so the opening is translated with explicit help from Kmosko’s chapter XXIX control page rather than with false precision from the current bucket alone.
    reason: textual_variant
  - marker: b
    text: '''Behemoth'' and ''Leviathan'' are retained as traditional names for the two primeval creatures rather than translated generically.'
    reason: cross_reference
  - marker: c
    text: A 'kor' is an ancient large liquid measure. It is retained here because the verse deliberately stacks concrete abundance images rather than speaking vaguely of plenty.
    reason: cultural_note
  - marker: d
    text: Or 'the dew of healing.' The Syriac phrase on the control page supports both nuances; 'health' was chosen to keep the noun-like quality of the expression.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내게 대답하여 말했습니다[a]. “그때 일어날 일은 온 땅에 일어날 것입니다. 그러므로 살아 있는 모든 사람은 그것을 겪게 될 것입니다. 그러나 그때에는 나는 그 날들에 이 땅에 있는 사람들만 보호하겠습니다. 그리고 그 지역들에서 일어날 일이 이루어지고 나면, 메시아가 드러나기 시작할 것입니다. 그리고 베헤못은 그가 있던 곳에서 드러나고, 리워야단은 바다에서 올라올 것입니다. 곧 내가 창조의 다섯째 날에 지어 두었다가 그때까지 간직해 온 그 두 큰 괴물입니다. 그러면 그것들은 남아 있는 모든 이의 먹을거리가 될 것입니다. 땅도 그 열매를 열 배가 아니라 만 배로 내놓을 것입니다. 한 포도나무에는 천 개의 가지가 있을 것이고, 한 가지에는 천 송이의 송이가, 한 송이에는 천 알의 포도가, 한 알의 포도에는 한 고르의 포도주가 있을 것입니다. 굶주렸던 사람들은 기뻐할 것이며, 날마다 놀라운 일들을 보게 될 것입니다. 내 앞에서 바람들이 나와 향기로운 열매의 냄새를 아침마다 가져오고, 날이 저물면 건강의 이슬을 내리는 구름들이 있을 것이기 때문입니다. 그리고 그 같은 때에 만나는 창고가 다시 높은 곳에서 내려올 것이며, 그들은 그 해들에 그것을 먹을 것입니다. 그것이 시간의 완성에 이른 사람들이기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܥܠܡܐ / whole earth
  english_pob_choice: the whole earth
  chosen_korean: 온 땅
  alternatives_korean:
  - 온 세상
  - 전체 땅
  lexicon: Syriac source + POB audit trail
  rationale: 시리아어 본문과 영어 본문이 보편적 범위를 가리키므로, 국지적 땅이 아니라 전체적 심판 범위를 드러내는 ‘온 땅’이 가장 자연스럽습니다.
- source_word: ܡܬܚܙܐ / revealed
  english_pob_choice: will begin to be revealed
  chosen_korean: 드러나기 시작할 것입니다
  alternatives_korean:
  - 나타나기 시작할 것입니다
  - 계시되기 시작할 것입니다
  lexicon: Syriac source + POB audit trail
  rationale: 피동적 ‘드러나다’는 메시아의 자기발현보다 하나님에 의한 공개를 살리며, ‘시작하다’로 과정적 뉘앙스를 유지합니다.
- source_word: ܒܥܠܡܐ... ܒܪܝܬܐ / Behemoth and Leviathan
  english_pob_choice: Behemoth / Leviathan
  chosen_korean: 베헤못 / 리워야단
  alternatives_korean:
  - 거대한 짐승들
  - 바다 괴수
  lexicon: POB cross-reference terminology
  rationale: 영어 본문이 전통적 고유명칭을 유지하므로, 본문에서도 상징적 일반명사로 풀지 않고 이름을 보존하는 것이 축자성과 종말론적 이미지를 함께 살립니다.
- source_word: residui fuerint / those who remain
  english_pob_choice: all who remain
  chosen_korean: 남아 있는 모든 이
  alternatives_korean:
  - 남은 모든 사람
  - 남아 있는 자들
  lexicon: POB audit trail
  rationale: 심판 이후 생존한 이들을 가리키는 표현이므로, ‘남아 있는 모든 이’로 평이하면서도 남김의 상태를 분명히 했습니다.
- source_word: consummation of time
  english_pob_choice: the consummation of time
  chosen_korean: 시간의 완성
  alternatives_korean:
  - 때의 완성
  - 시대의 종결
  lexicon: POB audit trail
  rationale: 종말론적 관용구를 그대로 한국어화하되, 다른 성경의 고정 표현을 과도하게 끌어오지 않도록 ‘시간의 완성’으로 옮겼습니다.
theological_decisions:
- issue: 메시아의 현현을 어떻게 표현할 것인가
  chosen_reading: ‘드러나기 시작할 것입니다’로 옮겨, 공개와 개시의 의미를 함께 보존했습니다.
  alternative_readings:
  - ‘나타날 것입니다’
  - ‘임하실 것입니다’
  rationale: 본문은 단순 출현보다 점진적 계시를 강조하므로, 메시아의 도래를 해석적으로 확대하지 않고 드러남의 과정을 유지하는 것이 적절합니다.
  doctrine_reference: eschatology / messianic disclosure
- issue: ‘health’와 관련된 이미지의 처리
  chosen_reading: ‘건강의 이슬’로 직역해, 특이하고 구체적인 공급 이미지를 유지했습니다.
  alternative_readings:
  - ‘치유의 이슬’
  - ‘회복의 이슬’
  rationale: 영어 POB가 noun-like quality를 살리기 위해 health를 택한 만큼, 본문의 낯선 이미지와 축복의 물질성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: provision / healing imagery
