  alternative_readings:
  - ‘너희 동료 예언자 예레미야’
  - ‘너희 동반자 예언자 예레미야’
  rationale: 본문은 예레미야를 바룩과 연결된 예언자로 부르므로, 관계성과 소명성을 함께 살리는 표현을 택했습니다.
  doctrine_reference: 선지자 직분과 공동사역의 문맥 보존
