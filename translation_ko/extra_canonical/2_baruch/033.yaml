base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/033.yaml
  text: “Are these the commands that your companion Jeremiah the prophet gave you, saying, ‘Look after this people until I go and prepare the rest of our brothers in Babylon, those who have fallen into captivity’? And now, if you also leave us, it would be better for all of us to die before you than for you to withdraw from us.”
  footnotes:
  - marker: a
    text: The chapter boundary here is medium-confidence. Ceriani page 209 overlaps the end of chapter 32 and the start of chapter 33, so the exile clause is translated with modest caution at the page edge.
    reason: textual_variant
  - marker: b
    text: Or 'those against whom the sentence has gone out that they should be taken away captive'.
    reason: previous_rendering
translation:
  language: ko
  text: “이것들이 곧 너희 동역자 예언자 예레미야가 너희에게 명하여 말한 명령들입니까? ‘이 백성을 돌보아라. 내가 바빌론에 있는 우리 형제들, 곧 포로로 잡혀 간 이들을 준비해 둘 때까지.’ 그리고 지금 너희도 우리를 떠난다면, 너희가 우리에게서 떠나는 것보다 우리 모두가 너희 앞에서 죽는 편이 우리에게 더 낫습니다.”[a]
  philosophy: optimal-equivalence
