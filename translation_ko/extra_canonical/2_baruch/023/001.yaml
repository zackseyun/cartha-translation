- from: 제가 대답하며 말했습니다. 「아닙니다, 주님, 제 주님이십니다.」 그가 제게 대답하며 말씀하셨습니다. 「네가 알지 못하는 일로 왜 마음에 동요하느냐? 네가 알지 못하는 일들 때문에 왜 흔들리느냐? 네가 지금 존재하는 이들과 이미 지나간 이들을 잊지 않은 것처럼, 나도 장차 올 이들을 기억한다. 아담이 죄를 지었고, 태어날 이들에게 죽음이 선포되었을 때, 태어날 이들의 무리가 수를 세어졌고, 그 수를 위한 자리가 마련되었다. 그곳에는 살아 있는 자들이 거하고 죽은 자들이 보관될 것이다. 그러므로 미리 정해진 그 수가 채워지기 전에는, 피조물은 다시 살지 못한다. 내 영은 생명을 주는 이이며, 스올은 죽은 자들을 받는다. 또한 너에게는 이 시대들 뒤에 올 일을 들을 수 있도록 허락되었다. 내 구원은 참으로 가까이 왔으며, 전에는 그랬던 것처럼 멀지 않다.」[a]
