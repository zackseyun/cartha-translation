  terminology: ‘스올’과 ‘내 영’은 원문의 종교·묵시문학적 어휘를 과도하게 해석하지 않고 잘 보존합니다. ‘생명을 주는 이’도 가능한 표현이나, 한국어에서는 ‘생명을 주시는 분’이 더 자연스럽습니다. ‘수’는 예정된 총수를 가리키므로 유지하되, ‘헤아려졌고’로 표현합니다.
