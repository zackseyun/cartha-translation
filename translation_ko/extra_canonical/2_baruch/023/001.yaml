  yaml_path: translation/extra_canonical/2_baruch/023/001.yaml
  text: And I answered and said, “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near, and is not as far off as it was before.”
translation:
  language: ko
  text: 제가 대답하여 말씀드렸습니다. 「아닙니다, 주님, 나의 주님.」 그러자 그분께서 제게 대답하여 말씀하셨습니다. 「네가 알지 못하는 일로 왜 마음이 동요하느냐? 네가 알지 못하는 일들 때문에 왜 흔들리느냐? 네가 지금 존재하는 이들과 이미 지나간 이들을 잊지 않는 것처럼, 나도 장차 올 이들을 기억한다. 아담이 죄를 지었고 태어날 이들에게 죽음이 선포되었을 때, 태어날 이들의 무리의 수가 헤아려졌고 그 수를 위한 자리가 마련되었다. 그곳에서 산 자들은 살고 죽은 자들은 보존될 것이다. 그러므로 미리 정해진 그 수가 채워지기 전에는 창조 세계가 다시 살아나지 못한다. 내 영은 생명을 주시는 분이며, 스올은 죽은 자들을 받아들인다. 또한 너에게는 이 시대들 뒤에 일어날 일을 들을 수 있도록 허락되었다. 나의 구원은 참으로 가까이 왔으며, 이전처럼 멀리 있지 않다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܝܪ
  english_pob_choice: troubled / disturbed
  chosen_korean: 마음에 동요하다 / 흔들리다
  alternatives_korean:
  - 혼란스럽다
  - 괴로워하다
  lexicon: Payne Smith
  rationale: 외적 충격보다 내적 불안정과 흔들림을 드러내는 말로 옮겨, 신적 책망의 어조를 살렸습니다.
- source_word: ܡܢܝܢܐ
  english_pob_choice: number
  chosen_korean: 수
  alternatives_korean:
  - 숫자
  - 총수
  lexicon: Sokoloff
  rationale: 단순한 계산이 아니라 미리 정해진 총량이라는 묵시적 의미를 살리기 위해 ‘수’로 옮겼습니다.
- source_word: ܫܝܘܠ
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 무덤
  - 죽은 자들의 세계
  lexicon: Payne Smith
  rationale: 유대 묵시문학의 고유 개념을 유지하기 위해 음역을 택했습니다.
- source_word: ܪܘܚܝ
  english_pob_choice: my Spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 성령
  - 내 숨
  lexicon: Payne Smith
  rationale: 문맥상 생명을 주는 하나님의 영을 가리키지만, 본문 자체의 표현을 따라 ‘영’으로 유지했습니다.
theological_decisions:
- issue: ‘my Spirit is the giver of life’의 신적 생명 부여 주체
  chosen_reading: 내 영은 생명을 주는 이이며
  alternative_readings:
  - 내 영은 생명을 창조하며
  - 내 영은 생명 그 자체이며
  rationale: ‘주는 이’로 번역해 생명 부여의 능동성을 보존하되, 본문이 요구하지 않는 체계적 신학 용어는 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1; DOCTRINE.md §§ Theological stance
- issue: 아담의 죄와 이후 태어날 자들에게 선포된 죽음
  chosen_reading: 아담이 죄를 지었고, 태어날 이들에게 죽음이 선포되었을 때
  alternative_readings:
  - 아담이 죄를 지었고, 후손에게 죽음이 정해졌을 때
  - 아담의 죄로 인해 태어날 자들에게 죽음이 결정되었을 때
  rationale: 개인의 도덕적 실패보다 공동체 전체에 대한 묵시적 판정을 드러내는 문맥을 유지했습니다.
  doctrine_reference: Translation philosophy §3; DOCTRINE.md §§ Theological stance
