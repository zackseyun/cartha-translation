  text: '1. And it shall be in those days: the reapers will not grow weary, and the builders will not labor; for the works will move forward of themselves with those who do them, in much tranquility.'
translation:
  language: ko
  text: 그 날들에는 이렇게 될 것입니다. 추수하는 이들은 지치지 않고, 건축하는 이들은 수고하지 않을 것입니다. 이는 그 일을 하는 이들과 함께 일들이 저절로 이루어지고, 큰 평온 속에 있을 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the reapers
  english_pob_choice: the reapers
  chosen_korean: 추수꾼들
  alternatives_korean:
  - 수확하는 이들
  - 거두는 이들
  lexicon: Payne Smith
  rationale: 농사 이미지를 구체적으로 살리면서, 현대 한국어에서 자연스럽고 직관적인 대응으로 옮겼습니다.
- source_word: the builders
  english_pob_choice: the builders
  chosen_korean: 건축하는 이들
  alternatives_korean:
  - 건축자들
  - 짓는 이들
  lexicon: Payne Smith
  rationale: ‘builders’의 병렬성을 유지하되, 현대적 문체에 맞게 서술형으로 처리했습니다.
- source_word: will not grow weary ... will not labor
  english_pob_choice: will not grow weary ... will not labor
  chosen_korean: 지치지 않고 ... 수고하지 않을 것입니다
  alternatives_korean:
  - 피곤해지지 않고 ... 일하지 않을 것입니다
  - 지치지 않고 ... 애쓰지 않을 것입니다
  lexicon: Payne Smith
  rationale: 두 동사를 분리해 반복 구조를 살리면서, 첫째는 체력 소진, 둘째는 노동 부담의 뉘앙스를 구별했습니다.
- source_word: the works will move forward of themselves
  english_pob_choice: the works will move forward of themselves
  chosen_korean: 일들이 그것들을 하는 이들과 함께 스스로 진행될 것입니다
  alternatives_korean:
  - 일들이 저절로 진행될 것입니다
  - 일들이 저절로 나아갈 것입니다
  lexicon: Payne Smith
  rationale: ‘of themselves’의 자발성을 보이면서도, 단순 자동화가 아니라 작업과 행위자의 동행을 드러내기 위해 풀어 옮겼습니다.
- source_word: in much tranquility
  english_pob_choice: in much tranquility
  chosen_korean: 큰 평온 가운데
  alternatives_korean:
  - 큰 평안 가운데
  - 아주 고요한 가운데
  lexicon: Payne Smith
  rationale: ‘tranquility’의 정적이고 회복된 분위기를 살리되, 한국어에서 어색하지 않은 종결 표현으로 정리했습니다.
theological_decisions:
- issue: 종말적 노동의 성격
  chosen_reading: 일이 사람의 과도한 수고 없이도 스스로 진행되는 복원된 질서를 보여 줍니다.
  alternative_readings:
  - 단순히 일이 쉽게 잘됩니다.
  - 기계적으로 자동화된 세계를 말합니다.
  rationale: 본문은 성취의 용이함보다 창조 질서의 평화로운 회복을 더 강하게 드러내므로, 자동화처럼 들리지 않게 자발성과 평온을 함께 살렸습니다.
  doctrine_reference: 묵시적 회복 이미지가 요구하는 만큼만 강하게 유지하고, 의미를 축소하거나 과장하지 않습니다.
