translation:
  language: ko
  text: 오, 땅을 지으신 분이여, 제 말을 들으소서—말씀으로 궁창을 세우시고 영으로 하늘의 높이를 굳게 하신 분이여.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘ ܡܢ ܕܒܪܐ ܐܪܥܐ
  english_pob_choice: O You who created the earth
  chosen_korean: 오, 땅을 지으신 분이여
  alternatives_korean:
  - 오, 땅을 창조하신 분이여
  - 오, 땅을 만드신 분이여
  lexicon: Syriac text; POB English audit
  rationale: 호격의 기도문이므로 ‘지으신 분이여’로 자연스럽게 살리되, 창조 행위를 분명히 드러냈습니다.
- source_word: ܬܩܢܬ
  english_pob_choice: established
  chosen_korean: 세우시고
  alternatives_korean:
  - 설정하시고
  - 정하셨고
  lexicon: Payne Smith
  rationale: 궁창을 단단히 세우는 의미를 살려 한국어로는 ‘세우다’가 가장 직접적입니다.
- source_word: ܪܩܝܥܐ
  english_pob_choice: the firmament
  chosen_korean: 궁창
  alternatives_korean:
  - 창공
  - 하늘 궁창
  lexicon: 표준 성서 어휘
  rationale: 창세기적 우주론을 가리키는 전통 용어로 ‘궁창’이 원문 의도를 가장 선명하게 전달합니다.
- source_word: ܪܘܚܐ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 숨
  - 바람
  - 성령
  lexicon: Payne Smith
  rationale: 본문은 창조 행위의 매개로서 ܪܘܚܐ를 쓰며, POB가 주석에서 밝힌 바와 같이 ‘spirit’과 ‘breath’의 긴장을 유지해야 하므로, 본문은 중립적이고 신학적으로 넓은 ‘영’으로 옮겼습니다.
theological_decisions:
- issue: ܪܘܚܐ의 번역에서 ‘영’과 ‘숨/바람’ 사이의 긴장
  chosen_reading: 본문에는 ‘영’을 두고, 주석에서 ‘숨/바람’ 가능성을 열어 둡니다.
  alternative_readings:
  - 숨
  - 바람
  - 성령
  rationale: POB의 영어 본문이 ‘spirit’으로 두되 각주에서 ‘breath’ 가능성을 인정하므로, 한국어도 본문은 ‘영’으로 두고 해석의 폭을 보존했습니다.
  doctrine_reference: 창 1:2, 시 33:6의 창조적 영/호흡 이미지
