translation:
  language: ko
  text: 오, 땅을 지으신 분이여, 제 말을 들으소서—말씀으로 궁창을 세우시고 영[a]으로 하늘의 높이를 굳게 하신 분이여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 시리아어 루하(ruha)는 ‘영’ 또는 ‘숨’을 뜻할 수 있습니다. ‘말씀’과의 병렬은 시편 33:6을 떠올리게 합니다.
    reason: '어휘 선택: ܪܘܚܐ의 ‘영/숨’ 모호성을 보존합니다.'
