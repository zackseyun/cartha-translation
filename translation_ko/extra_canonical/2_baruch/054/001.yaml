  text: O You who created the earth, hear me—You who established the firmament by the word, and made firm the height of heaven by the spirit[a].
  footnotes:
  - marker: a
    text: Syriac ruha can mean 'spirit' or 'breath'; the parallel with 'word' echoes Psalm 33:6.
