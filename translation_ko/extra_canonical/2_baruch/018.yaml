translation:
  language: ko
  text: 그리고 내가 대답하며 말했습니다. “빛에서 받아 온 사람들은 그것으로 알 수 있습니다. 그러나 존재하는 많은 사람들은 아담의 어둠에서 받아 왔고, 모세의 빛 안에 세워지지 않았습니다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܒܬ / ܢܣܒܘ
  english_pob_choice: received
  chosen_korean: 받아 온
  alternatives_korean:
  - 받았습니다
  - 취했습니다
  - 가졌습니다
  lexicon: Payne Smith
  rationale: 여기서는 빛/어둠으로부터 어떤 것을 ‘받아 온’ 상태를 살려, 기원의 대조를 자연스럽게 드러내면서도 원문의 구체성을 유지합니다.
- source_word: ܢܘܗܪܐ
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 조명
  lexicon: Payne Smith
  rationale: 이 절의 핵심 대비는 빛과 어둠의 묵시적·도덕적 대조이므로, 가장 सीधे하고 본문적인 ‘빛’을 택합니다.
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  english_pob_choice: Adam’s darkness
  chosen_korean: 아담의 어둠
  alternatives_korean:
  - 아담의 흑암
  - 사람의 어둠
  lexicon: Payne Smith
  rationale: 소유격 관계를 약화시키지 않고 아담에게 직접 귀속된 어둠임을 보이기 위해 ‘아담의 어둠’으로 옮깁니다.
- source_word: ܐܬܒܣܣܘ
  english_pob_choice: were established
  chosen_korean: 세워지지 않았습니다
  alternatives_korean:
  - 기초가 놓이지 않았습니다
  - 정착되지 않았습니다
  lexicon: Payne Smith
  rationale: PBOTrail이 ‘established’로 잡은 구조를 따라, 공동체적·형성적 의미가 살아 있는 ‘세워지다’ 계열로 옮기되 부정형으로 처리합니다.
theological_decisions:
- issue: 아담과 모세의 대비
  chosen_reading: 이 절은 아담에게서 물려받은 어둠과 모세와 관련된 빛 사이의 역사적·계시적 대조를 유지합니다.
  alternative_readings:
  - 단순히 무지와 교육의 대비로 완화할 수 있습니다.
  rationale: 본문이 인물을 직접 지목하므로, 대표성 있는 구속사적 대비를 흐리지 않고 그대로 살리는 것이 source-grounded합니다.
  doctrine_reference: 대표성/계시사적 대비
- issue: ‘모세의 빛’의 성격
  chosen_reading: 모세를 빛의 근원으로 만들지 않고, 빛과 연결된 표지로만 제시합니다.
  alternative_readings:
  - 모세의 가르침
  - 모세가 비춘 빛
  rationale: 영어 POB audit trail이 ‘the light of Moses’를 유지하므로, 모세의 빛을 독립적 근원처럼 과장하지 않고 원문의 의존적 표현을 보존합니다.
  doctrine_reference: 계시의 매개성과 종속성
