translation:
  language: ko
  text: 그러면 그들의 영광이 변화되어 영광을 받을 것이며, 그들의 얼굴 모양이 그들의 아름다운 빛으로 변할 것입니다. 그리하여 그들은 그들에게 약속된 죽지 않는 세상을 얻고 받게 될 것입니다.
  philosophy: optimal-equivalence
