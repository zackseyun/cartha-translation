  source_fidelity: 시리아어 본문은 ‘그들의 영광이 변모들 가운데서 영화롭게 되고’와 ‘얼굴들의 형상이 그들의 아름다움의 빛으로 변한다’는 뜻입니다. 초안의 ‘변화되어 영광을 받을’은 같은 어근을 중복하며, 수동적으로 ‘영광을 받는다’는 의미를 더해 원문의 표현을 흐립니다. ‘아름다운 빛’도 ‘그들의 아름다움의 빛’이라는 소유·속격 관계를 보존하는 편이 정확합니다.
  naturalness: ‘변모 가운데서 영화롭게 되고’는 현대 한국어 문어체에서 자연스럽고, 본문의 종말론적·시적 표현을 과도하게 해설하지 않습니다. ‘얻고 받게 될 것입니다’는 원문의 두 동사를 보존하기 위해 유지했습니다.
  terminology: ‘영광’, ‘영화롭게 되다’, ‘변모’, ‘죽지 않는 세상’은 본문의 어휘와 격조에 맞습니다. ‘의롭다 하심을 받은’ 등 앞 문맥의 주어는 이 절의 영어 POB 범위에 포함되어 있지 않으므로 보충하지 않았습니다.
