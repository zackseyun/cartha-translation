    rationale: 원문은 수혜자들과 관련된 ‘그들의 때’라는 소유 표현을 사용합니다.
  - severity: low
    issue: ‘지금 그들에게 숨겨져 있는 그 시간’의 표현이 어색합니다.
    rationale: 시간적 국면을 뜻하는 지시어는 한국어에서 ‘그때’가 더 자연스럽습니다.
  revised_text: 그들의 때에 놀라운 일들이 그들에게 나타날 것입니다.a 왜냐하면 그들은 지금 그들에게 보이지 않는 그 세계와 지금 그들에게 숨겨져 있는 그때를 보게 될 것이기 때문입니다.
