  source_fidelity: 시리아어는 ‘그들의 때에’ 기이한 일들이 그들에게 나타나며, 현재 그들에게 보이지 않는 세계와 숨겨져 있는 때를 보게 된다는 뜻입니다. 초안의 ‘때가 되면’은 소유·지시 관계를 일반화하므로 ‘그들의 때에’로 옮기는 편이 더 충실합니다.
  naturalness: ‘그 시간을’은 한국어에서 다소 부자연스럽고 지시 대상이 흐려집니다. 문맥상 시간적 국면을 가리키는 ‘그때’를 쓰면 자연스럽고 원문의 모호성도 유지됩니다.
  terminology: ‘놀라운 일들’은 ܬܡܝ̈ܗܬܐ(기이한 일들/경이들)를 무리 없이 반영합니다. 교파적으로 특정한 ‘기적’으로 한정하지 않았습니다.
