base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/001.yaml
  text: For the earth will then certainly give back the dead whom it now receives in order to preserve them, changing nothing in their form; but as it received them, so it will restore them, and as I delivered them to it, so it will raise them.
  footnotes:
  - marker: a
    text: Or 'whom it now receives, just as they are, changing nothing in their form; as it received them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 땅은 지금 보존하려고 받아들이는 죽은 이들을 반드시 돌려주고, 그들의 형상은 조금도 바꾸지 않은 채, 그러나 그들을 받아들인 그대로 되돌려줄 것입니다. 내가 그들을 땅에 맡긴 그대로, 땅은 그들을 다시 일으킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “지금 있는 그대로 받아들이는 죽은 이들.” 그러나 시리아어 본문은 땅이 죽은 이들을 보존하려고 받아들인다는 뜻으로 읽힙니다.
    reason: 원문에 근거한 ‘보존하려고’의 목적 표현을 설명하고, 기존 앵커에 대응하는 각주를 제공합니다.
lexical_decisions:
- source_word: ܡܦܩܢܗ
  english_pob_choice: give back
  chosen_korean: 돌려주고
  alternatives_korean:
  - 내어주고
  - 되돌려 보내고
  lexicon: Payne Smith
  rationale: ‘내보내다’보다 관계적 상환을 드러내는 ‘돌려주다’가 죽은 자를 다시 반환하는 문맥에 더 가깝습니다.
- source_word: ܬܢܛܪ ܐܢܘܢ / ܐܠܐ
  english_pob_choice: in order to preserve them / but
  chosen_korean: 받아 보존하고 있는 … 받아들였던 그대로
  alternatives_korean:
  - 받아 간직하고 있는
  - 지키고 있는
  lexicon: Payne Smith
  rationale: 땅이 단순히 ‘받는’ 것이 아니라 ‘보존하기 위해 받는다’는 목적과, 뒤의 대비 접속사 ‘그러나/하지만’의 흐름을 함께 살리기 위해 ‘받아 보존하고 있는’과 ‘그대로’를 사용했습니다.
- source_word: ܒܨܘܪܬܗܘܢ
  english_pob_choice: in their form
  chosen_korean: 그들의 형상에는
  alternatives_korean:
  - 그들의 모습에는
  - 그들의 모습 안에는
  lexicon: Payne Smith
  rationale: 형체의 동일성과 식별 가능성을 보존하는 표현으로 ‘형상’이 가장 직접적입니다. ‘모습’보다 본문이 강조하는 외형적 동일성의 뉘앙스를 더 잘 드러냅니다.
- source_word: ܩܒܠܬ ܗܘܬ / ܐܫܠܡܬ
  english_pob_choice: received them / delivered them
  chosen_korean: 받아들였던 / 맡겼던
  alternatives_korean:
  - 받았던 / 넘겨주었던
  - 받아 두었던 / 내주었던
  lexicon: Payne Smith
  rationale: 앞의 ‘받다’와 뒤의 ‘맡기다’의 대응을 살려, 지면이 아니라 죽은 자를 보존 대상으로 ‘맡기는’ 관계를 자연스럽게 표현했습니다.
- source_word: ܡܩܝܡܐ
  english_pob_choice: raise
  chosen_korean: 다시 일으킬 것입니다
  alternatives_korean:
  - 일으킬 것입니다
  - 일으켜 세울 것입니다
  lexicon: Payne Smith
  rationale: 마지막 동사는 부활의 결과를 가리키므로 단순한 이동보다 ‘다시 일으키다’가 더 적절합니다.
theological_decisions:
- issue: '땅의 역할: 수동적 토양인지 보존하는 저장소인지'
  chosen_reading: 땅은 단순히 시신을 담는 곳이 아니라, 맡겨진 죽은 자를 보존했다가 다시 내어주는 보관자처럼 묘사됩니다.
  alternative_readings:
  - 단지 매장지의 의인화
  - 시적 수사일 뿐 실제 기능은 없음
  rationale: 본문의 ‘받아 보존하다’와 ‘돌려주다’의 병행은 보존과 반환의 기능을 분명히 하므로, 의인화 이상의 의미를 살렸습니다.
  doctrine_reference: 부활과 동일성의 보존
