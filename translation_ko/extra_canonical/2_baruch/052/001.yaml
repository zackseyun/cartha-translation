revisions:
- from: 그러므로 땅은 지금 자기 안에 받아 보존하고 있는 죽은 자들을 반드시 돌려주고, 그들의 형상에는 아무것도 바꾸지 않은 채, 받아들였던 그대로 그들을 되돌려주며, 내가 그것들을 땅에 맡겼던 것처럼 땅도 그들을 다시 일으킬 것입니다.[a]
  to: 그때 땅은 지금 보존하려고 받아들이는 죽은 이들을 반드시 돌려주고, 그들의 형상은 조금도 바꾸지 않은 채, 그러나 그들을 받아들인 그대로 되돌려줄 것입니다. 내가 그들을 땅에 맡긴 그대로, 땅은 그들을 다시 일으킬 것입니다.[a]
  rationale: 원문의 시간적 틀, 보존의 목적, ‘그러나’의 대조, 그리고 땅이 받은 이들을 그대로 돌려주고 다시 일으킨다는 병행을 더 분명하고 자연스러운 한국어로 옮겼습니다. 부활의 방식이나 신체성에 관한 추가 교리적 설명은 넣지 않았습니다.
