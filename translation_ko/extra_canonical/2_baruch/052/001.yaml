  naturalness: 현 문장은 의미상 이해되지만, ‘지금 자기 안에 받아 보존하고 있는’은 다소 무겁고 ‘땅도’는 앞 절과의 연결에서 불필요하게 강조됩니다. 목적을 ‘보존하려고’로 직접 표현하고, 대조를 ‘그러나’로 나타내면 현대 한국어 합쇼체로 더 자연스럽습니다.
  terminology: ‘죽은 자들’, ‘형상’, ‘돌려주다’, ‘다시 일으키다’는 본문의 부활 및 동일성 언어를 과도하게 해석하지 않고 적절히 전달합니다. 마지막의 ‘내가 그들을 땅에 맡긴 그대로’는 1인칭 화자가 땅에 죽은 이들을 맡겼다는 원문의 관계를 보존합니다.
