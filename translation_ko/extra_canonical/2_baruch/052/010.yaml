review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the sequence that they first see and then go to torment, but it shifts the passive Syriac sense ('are reckoned/count​ed') into an active reflexive sense ('regard themselves'). It also renders the plural 'heaps of sins' as a singular 'one of a sin heap.'
  naturalness: The -느니라 endings do not follow the required modern formal-polite 합쇼체. The revised wording uses contemporary formal-polite future expressions appropriate to the eschatological context.
  terminology: ‘죄의 무더기들 가운데에 헤아려지고’ preserves the passive accounting/reckoning image and plural. ‘형상의 악함’ closely reflects the difficult expression concerning the evil of their forms without overinterpreting it as moral self-assessment.
  issues:
  - severity: high
    issue: Voice and subject are changed in ‘그들은 그들 자신을 … 여기고’.
    rationale: The source and English audit trail express that they are reckoned/accounted among the heaps of sins, not that they judge themselves to be such.
  - severity: medium
    issue: ‘죄더미 가운데 하나’ changes the plural and adds ‘one.’
    rationale: The underlying expression is ‘among the heaps of sins’; no singularizing or classificatory ‘one’ is indicated.
  - severity: medium
    issue: Register is archaic rather than modern formal-polite.
    rationale: ‘-느니라’ conflicts with the requested modern 합쇼체 target variant.
  revised_text: 그들은 죄의 무더기들 가운데에 헤아려지고, 그들의 형상의 악함은 더욱 쇠해 갈 것입니다. 그들은 먼저 보고, 그 뒤에 고난을 받으러 갈 것입니다.
