  source_fidelity: 시리아어의 시간적 구성(‘그들이 서로 알아보게 될 때’)과 동격·한정 구문(‘지금 서로를 알고 있는 이들’)을 충실히 반영합니다. 이어지는 ‘지금 정죄받는 이들의 모습이 더욱 끔찍해질 것이다’라는 미래 결과도 영어 감사 문안 및 원문의 의미와 일치합니다.
  naturalness: ‘서로를 알고 있는 사람들이 서로를 알아보게 되면’은 반복을 통해 원문의 대조를 보존하면서도 현대 표준 한국어로 자연스럽습니다. 문말도 합쇼체 미래 표현으로 적절합니다.
  terminology: ‘정죄받는’은 원문의 심판·유죄 선고 맥락을 정확히 전달하며, ‘모습’과 ‘더욱 끔찍해질 것입니다’도 본문의 묘사적 어조에 맞습니다.
