revisions:
- from: 그러나 때에 의롭다 함을 얻은 자들과 생활에 명철이 있는 자들과 지혜의 뿌리를 마음에 심은 자들에게는 영광이 있으리라
  to: 그러나 자기 때에 의롭다 하심을 받은 이들, 삶에서 열매를 맺은 이들, 그리고 마음에 지혜의 뿌리를 심은 이들의 영광은—
  rationale: 원 시리아어의 어휘(특히 ܫܘܒܠܐ)를 우선하여 ‘열매’를 복원하고, 이 절이 다음 절과 문법적으로 이어지는 명사구임을 긴 대시로 보존했습니다. 영어 감사본의 ‘understanding’은 원어 본문과 상충하므로 따르지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:28Z'
review_pass:
  verdict: revise
  source_fidelity: 시리아어 본문은 이 구절을 ‘그들의 영광’이라는 명사구로 시작하고, 이어지는 구절에서 그 영광의 결과를 서술합니다. 초안의 ‘영광이 있으리라’는 본문에 없는 독립 서술을 보태어 구절 간 연결을 약화합니다. 또한 시리아어 ܫܘܒܠܐ는 여기서 ‘명철’보다 ‘열매’로 옮기는 것이 적절합니다.
  naturalness: ‘생활에 명철이 있는’은 현대 한국어에서 부자연스럽습니다. ‘삶에서 열매를 맺은’이 자연스럽고 원문의 비유를 보존합니다. 문장 미완결은 다음 절로 이어지는 원문의 구문을 나타내므로 긴 대시로 처리했습니다.
  terminology: ‘의롭다 하심을 받은’은 시리아어의 수동형 및 영어 감사본의 ‘were justified’를 충실히 반영합니다. ‘지혜의 뿌리’는 유지했습니다.
  issues:
  - severity: high
    issue: ‘생활에 명철이 있는 자들’
    rationale: 원 시리아어의 ܫܘܒܠܐ(열매/곡식 이삭 계열)를 ‘명철’로 옮긴 것은 어휘적으로 지지되기 어렵습니다. 영어 감사본의 ‘understanding’과도 차이가 있으나, 원어 우선 원칙에 따라 ‘열매’를 택해야 합니다.
  - severity: medium
    issue: ‘영광이 있으리라’라는 독립 서술
    rationale: 원문은 다음 절과 이어지는 ‘...의 영광은—’이라는 구문입니다. ‘있으리라’를 삽입하면 원문의 연결 구조와 강조가 달라집니다.
  - severity: low
    issue: ‘때에’와 ‘생활에’의 표현
    rationale: ‘자기 때에’, ‘삶에서’가 현대 표준어 문맥에서 더 자연스럽습니다.
  revised_text: 그러나 자기 때에 의롭다 하심을 받은 이들, 삶에서 열매를 맺은 이들, 그리고 마음에 지혜의 뿌리를 심은 이들의 영광은—
