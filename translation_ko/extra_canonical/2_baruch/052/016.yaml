  source_fidelity: 시리아어 본문은 ‘이 고난의 세상에서 구출되었고/벗어났으며’와 ‘고난들의 짐을 내려놓았다’는 두 병렬 서술을 담고 있습니다. 초안은 이를 충실하게 옮깁니다. ‘구원을 받고’는 여기서 문맥상 환난의 세계로부터의 구출을 자연스럽게 표현합니다.
  naturalness: ‘그들은 이 환난의 세상에서 구원을 받고 고난의 짐을 내려놓았기 때문입니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 앞 절의 이유를 제시하는 γάρ/‘때문입니다’의 기능도 적절히 보존합니다.
  terminology: ‘환난’, ‘구원’, ‘고난의 짐’은 종말론적·고난 문맥에 맞으며, 특정 교파의 해석을 덧붙이지 않습니다. 원문의 복수형 ‘고난들’은 한국어의 집합적 표현인 ‘고난의 짐’으로 무리 없이 반영되었습니다.
