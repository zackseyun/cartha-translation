    text: Or 'does not grow old for those who come to it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 고통이 지나갈 수 없는 이 시대를 자기들을 위하여 선택하였고, 그 결과는 탄식과 재난으로 가득 찬 이 때를 자기들을 위하여 선택하였느니라. 그들은 늙지 않는 세상을 거부하고 영광의 때를 거부했습니다. 이는 내가 전에 여러분에게 말한 영광에 이르지 못하게 하려는 것이었습니다.
