revisions:
- from: 그리고 그 시간은 그들에게 더 이상 늙지 않을 것입니다. 광대한 낙원이 그들 앞에 펼쳐질 것이며, 보좌 아래 생물들의 위엄의 아름다움이 그들에게 보여질 것이며, 모든 천사의 무리가 이제 내 말로 말미암아 보이지 아니하고, 그들이 정한 강림할 때까지 그 자리에 서도록 보호를 받았느니라.
  to: 그리고 시간은 그들을 더 이상 늙게 하지 않을 것입니다. 낙원의 넓은 곳들이 그들 앞에 펼쳐질 것이며, 보좌 아래에 있는 생물들의 위엄의 아름다움이 그들에게 보이게 될 것입니다. 또한 지금은 보이지 않도록 내 명령에 붙들려 있고, 그들의 정해진 때가 이를 때까지 제자리에 서 있도록 명령받은 모든 천사들의 무리도 그러할 것입니다.
  rationale: 시간이 사람들을 늙게 한다는 구문을 바로잡고, 천사들의 상태를 원문의 수동적·명령적 표현에 맞추었습니다. ‘강림’과 천사들이 때를 정한다는 부가 의미는 제거했으며, 전체를 현대 합쇼체의 일관된 미래 서술로 다듬었습니다.
