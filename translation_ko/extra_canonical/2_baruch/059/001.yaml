revisions:
- from: '당신이 본 큰 구름이 바다에서 올라와 이 땅을 덮고 지나간 것이 무엇인지 들으십시오. 그것은 그가 창조를 지으려고 생각하실 때에 그의 능력이 만드신 세상입니다. 그리고 그분 앞에서 말씀이 나오셨을 때, 세상의 구조가 아주 작게 서게 되었고, 그것이 그것에게 되어야 할 것으로 정해진 대로 세워졌습니다.


    그리고 구름에서 그것 위로 내려오는 것을 당신이 보았던 처음의 검은 물들은, 첫 사람 아담이 범한 첫 죄, 곧 그 첫 범죄입니다. 아담이 죄를 지었을 때, 죽음이 때가 이르기 전에 일으켜졌고, 애통이 알려졌으며, 슬픔들이 예비되었고, 고통이 창조되었으며, 수고가 완성되었고, 위대함이 낮아지기 시작했습니다.


    그리고 형상으로 보여지고 모습도 지닌 마지막 날에 관해서는, 때가 심판받을 것이며, 인류의 척도가 재어질 것이고, 그 힘이 시험될 것임을 아십시오. 그러므로 아담은 하나님으로부터 장차 있을 어떤 것을 듣고 있던 자로서, 주어진 죽은 자들의 놓임과 하나님께서 그에게 명령하신 것을 곰곰이 생각했습니다. 그는 계속 생각했고, 다섯 가지 생각을 지어냈습니다. 그가 자기 자신에게 책임을 지웠고, 천사들에게도 책임을 지웠기 때문입니다. 또한 그가 창조되던 바로 그때 그에게 한 환상이 보였으니, 사나운 짐승들과 불이 있는 원소들이었습니다. 그래서 하나님께서는 에덴에, 창조된 이들의 모습과 같은 방식으로 모으셨습니다.[a][b][c][d]'
  to: '당신이 본 큰 구름이 바다에서 올라와 나아가 이 땅을 덮은 것이 무엇인지 들으십시오. 그것은 하나님께서 창조를 만드시려고 생각하셨을 때 그분의 능력으로 만드신 세상입니다. 그분 앞에서 말씀이 나왔을 때, 세상의 기틀이 아주 작은 모습으로 서게 되었고, 마땅히 될 것으로 정해진 대로 세워졌습니다.


    또 당신이 구름에서 그것 위로 내려오는 것을 본 처음의 검은 물들은, 첫 아담이 범한 첫 죄, 곧 범법입니다. 그가 죄를 지었을 때 죽음이 제때가 되기도 전에 일어났고, 애통이 알려졌으며, 슬픔들이 마련되고 고통이 창조되었으며, 수고가 완성되고 위대함이 낮아지기 시작했습니다.


    또 형상으로 나타나 한 모습을 취한 마지막 날에 관해서는, 때가 살펴질 것이며 인류의 법[a]이 측량되고 그 힘이 시험될 것임을 아십시오. 그러므로 아담은 하나님께서 장차 있을 어떤 일을 그에게 들려주셨을 때, 주어진 죽은 자들의 풀려남과 하나님께서 그에게 명하신 것을 숙고했습니다. 그는 계속 숙고하여 다섯 가지 생각을 해냈습니다. 그는 스스로 책임을 지게 했고, 천사들도 책임을 지게 했습니다. 또한 그가 창조되던 바로 그때, 그에게 한 환상이 보였으니, 사나운 짐승들과 불이 함께한 원소들이었습니다. 이와 같이 하나님께서는 에덴에서 창조된 것들의 모습대로 모으셨습니다.'
  rationale: 원문을 우선하여 ܢܘܡܫܐ의 기본 의미를 본문에 회복하고, 문법적으로 뒤얽힌 구절들을 한국어에서 자연스럽고 절제된 합쇼체로 정비했습니다. ‘죽은 자들의 풀려남’, 천사들의 책임, 에덴에서의 모음이라는 난해한 진술은 교리적으로 해석을 덧붙이지 않고 보존했습니다. 각주는 실제 대안이 있고 해당 본문 위치에 연결되는 한 항목만 남겼습니다.
