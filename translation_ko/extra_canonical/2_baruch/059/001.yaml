  source_fidelity: 개정이 필요합니다. 초안은 전반적인 논지와 주요 어휘를 대체로 따르지만, ‘인류의 척도’는 시리아어 ܢܘܡܫܐ(법, 율례)를 본문에서 대체해 버렸고, 마지막 날 및 창조의 서술, 아담의 숙고와 책임의 진술에서 문법 관계가 불명확하거나 어색합니다. ‘에덴’은 유지하되, 목적어가 생략된 난해한 원문의 압축성도 유지했습니다.
  naturalness: 초안에는 높임의 불일치(‘그가 … 생각하실’, ‘말씀이 나오셨을 때’), 비자연스러운 피동·중복 표현(‘그것이 그것에게 되어야 할 것으로’), 부자연스러운 연결(‘듣고 있던 자로서’)이 있습니다. 이를 현대 표준어 합쇼체로 다듬었습니다.
  terminology: ‘첫 죄, 곧 첫 범죄’, ‘죽은 자들의 풀려남’, ‘원소들’, ‘사나운 짐승들’을 유지하거나 자연스럽게 정비했습니다. ܢܘܡܫܐ ܕܐܢܫܘܬܐ는 본문에서는 ‘인류의 법’으로 옮기고, ‘인류의 척도’ 가능성은 각주로 처리했습니다. 기존의 ‘마지막 때’, ‘쓴 생명’, ‘미리 모으셨다’ 관련 각주는 현재의 원문 판단 및 번역과 맞지 않아 삭제했습니다.
  issues:
  - severity: high
    issue: ‘인류의 척도’가 본문에서 ‘인류의 법’을 대체함
    rationale: ܢܘܡܫܐ는 ‘법/율례’가 기본 의미이며, 바로 뒤의 ‘측량되다’와 혼동하여 본문 의미를 바꾸어서는 안 됩니다. ‘척도’는 각주 대안으로만 둘 수 있습니다.
  - severity: medium
    issue: 하나님과 말씀에 대한 높임 및 문장 주어의 불일치
    rationale: ‘그가 … 생각하실 때’와 ‘말씀이 나오셨을 때’는 문법적으로 부조화하고, 말씀 자체에 불필요한 주체 높임을 부여합니다.
  - severity: medium
    issue: 마지막 날 및 아담 관련 문장이 원문의 문법 관계를 흐림
    rationale: ‘형상으로 보여지고 모습도 지닌’과 ‘듣고 있던 자로서’는 원문의 ‘형상으로 보이고 모양을 취한’ 및 ‘하나님에게서 장차 있을 일을 들은’ 관계를 자연스럽게 전달하지 못합니다.
  - severity: medium
    issue: 기존 각주 b–d가 현재 확정된 본문 판단과 충돌하거나 본문에 닻이 없음
    rationale: ‘미리 모으셨다’, ‘마지막 때’, ‘쓴 생명’은 제공된 최신 원문 검토에서 각각 에덴, 마지막 날, 사나운 짐승들로 교정되었습니다. 유효한 대안만 해당 위치에 남겨야 합니다.
  revised_text: '당신이 본 큰 구름이 바다에서 올라와 나아가 이 땅을 덮은 것이 무엇인지 들으십시오. 그것은 하나님께서 창조를 만드시려고 생각하셨을 때 그분의 능력으로 만드신 세상입니다. 그분 앞에서 말씀이 나왔을 때, 세상의 기틀이 아주 작은 모습으로 서게 되었고, 마땅히 될 것으로 정해진 대로 세워졌습니다.


    또 당신이 구름에서 그것 위로 내려오는 것을 본 처음의 검은 물들은, 첫 아담이 범한 첫 죄, 곧 범법입니다. 그가 죄를 지었을 때 죽음이 제때가 되기도 전에 일어났고, 애통이 알려졌으며, 슬픔들이 마련되고 고통이 창조되었으며, 수고가 완성되고 위대함이 낮아지기 시작했습니다.


    또 형상으로 나타나 한 모습을 취한 마지막 날에 관해서는, 때가 살펴질 것이며 인류의 법[a]이 측량되고 그 힘이 시험될 것임을 아십시오. 그러므로 아담은 하나님께서 장차 있을 어떤 일을 그에게 들려주셨을 때, 주어진 죽은 자들의 풀려남과 하나님께서 그에게 명하신 것을 숙고했습니다. 그는 계속 숙고하여 다섯 가지 생각을 해냈습니다. 그는 스스로 책임을 지게 했고, 천사들도 책임을 지게 했습니다. 또한 그가 창조되던 바로 그때, 그에게 한 환상이 보였으니, 사나운 짐승들과 불이 함께한 원소들이었습니다. 이와 같이 하나님께서는 에덴에서 창조된 것들의 모습대로 모으셨습니다.'
  revised_footnotes:
  - marker: a
    text: 또는 ‘인류의 척도’.
    reason: ܢܘܡܫܐ는 기본적으로 ‘법/율례’이나, 평가와 측량의 문맥에서 ‘척도’로 이해할 가능성을 보존합니다.
  revision_rationale: 원문을 우선하여 ܢܘܡܫܐ의 기본 의미를 본문에 회복하고, 문법적으로 뒤얽힌 구절들을 한국어에서 자연스럽고 절제된 합쇼체로 정비했습니다. ‘죽은 자들의 풀려남’, 천사들의 책임, 에덴에서의 모음이라는 난해한 진술은 교리적으로 해석을 덧붙이지 않고 보존했습니다. 각주는 실제 대안이 있고 해당 본문 위치에 연결되는 한 항목만 남겼습니다.
