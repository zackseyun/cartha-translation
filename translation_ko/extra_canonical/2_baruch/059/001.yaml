translation:
  language: ko
  text: '당신이 본 큰 구름이 바다에서 올라와 이 땅을 덮고 지나간 것이 무엇인지 들으십시오. 그것은 그가 창조를 지으려고 생각하실 때에 그의 능력이 만드신 세상입니다. 그리고 그분 앞에서 말씀이 나오셨을 때, 세상의 구조가 아주 작게 서게 되었고, 그것이 그것에게 되어야 할 것으로 정해진 대로 세워졌습니다.


    그리고 구름에서 그것 위로 내려오는 것을 당신이 보았던 처음의 검은 물들은, 첫 사람 아담이 범한 첫 죄, 곧 그 첫 범죄입니다. 아담이 죄를 지었을 때, 죽음이 때가 이르기 전에 일으켜졌고, 애통이 알려졌으며, 슬픔들이 예비되었고, 고통이 창조되었으며, 수고가 완성되었고, 위대함이 낮아지기 시작했습니다.


    그리고 형상으로 보여지고 모습도 지닌 마지막 날에 관해서는, 때가 심판받을 것이며, 인류의 척도가 재어질 것이고, 그 힘이 시험될 것임을 아십시오. 그러므로 아담은 하나님으로부터 장차 있을 어떤 것을 듣고 있던 자로서, 주어진 죽은 자들의 놓임과 하나님께서 그에게 명령하신 것을 곰곰이 생각했습니다. 그는 계속 생각했고, 다섯 가지 생각을 지어냈습니다. 그가 자기 자신에게 책임을 지웠고, 천사들에게도 책임을 지웠기 때문입니다. 또한 그가 창조되던 바로 그때 그에게 한 환상이 보였으니, 사나운 짐승들과 불이 있는 원소들이었습니다. 그래서 하나님께서는 에덴에, 창조된 이들의 모습과 같은 방식으로 모으셨습니다.[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  english_pob_choice: the structure of the world
  chosen_korean: 세상의 구조
  alternatives_korean:
  - 세상의 기틀
  - 세상의 설립
  - 세상의 토대
  lexicon: Payne Smith
  rationale: ‘구조’는 세계가 말씀이 나오자 곧바로 질서 있게 서는 장면을 살리면서, 단순한 ‘시작’보다 더 구체적인 형상을 전달합니다.
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  english_pob_choice: the first sin, the transgression
  chosen_korean: 첫 죄, 곧 그 첫 범죄
  alternatives_korean:
  - 첫 죄, 곧 그 첫 어김
  - 첫 죄, 곧 그 첫 범한 일
  lexicon: Payne Smith
  rationale: 두 표현의 중첩을 한국어에서도 살려, 아담의 행위가 단순한 실수가 아니라 근원적 범죄임을 드러냈습니다.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  english_pob_choice: death was stirred up
  chosen_korean: 죽음이 때가 이르기 전에 일으켜졌고
  alternatives_korean:
  - 죽음이 깨워졌고
  - 죽음이 움직이기 시작했고
  lexicon: Payne Smith
  rationale: ‘일으켜지다’는 죽음이 단지 존재하는 것이 아니라 죄로 인해 작동하게 되었다는 의미를 살리며, ‘때가 이르기 전에’는 문맥의 시간성을 보존합니다.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  english_pob_choice: greatness began to be brought low
  chosen_korean: 위대함이 낮아지기 시작했습니다
  alternatives_korean:
  - 위엄이 무너지기 시작했습니다
  - 위대함이 낮아지기 시작했습니다
  lexicon: Payne Smith
  rationale: ‘낮아지다’는 하강 이미지를 직접 살려, 타락 이후의 전도된 상태를 자연스럽게 전달합니다.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  english_pob_choice: the measure of humanity
  chosen_korean: 인류의 척도
  alternatives_korean:
  - 인류의 기준
  - 인류의 규범
  lexicon: Payne Smith
  rationale: 문맥이 법적 ‘법’보다 평가·측정의 뉘앙스를 가지므로, ‘척도’가 가장 직접적입니다.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  english_pob_choice: the release of the dead
  chosen_korean: 죽은 자들의 놓임
  alternatives_korean:
  - 죽은 자들의 풀려남
  - 죽은 자들의 해방
  lexicon: Payne Smith
  rationale: 문구가 난해하므로 도그마를 앞세우지 않고, ‘release’를 가장 문자적으로 살린 표현을 택했습니다.
- source_word: ܡܚܝܒܢܘܗܝ
  english_pob_choice: made liable
  chosen_korean: 책임을 지웠고
  alternatives_korean:
  - 유죄가 되게 했고
  - 부담을 지웠고
  lexicon: Payne Smith
  rationale: 이 용어의 사법적 의미를 유지하면서도, 한국어에서 자연스러운 ‘책임을 지우다’로 옮겼습니다.
- source_word: ܐܣܛܘܟܣܐ
  english_pob_choice: the elements
  chosen_korean: 원소들
  alternatives_korean:
  - 요소들
  - 기본 원소들
  lexicon: Payne Smith
  rationale: 그리스어 차용어의 우주론적 의미를 살려 ‘원소들’로 번역했습니다.
theological_decisions:
- issue: 아담의 죄와 죽음의 발동
  chosen_reading: 본문은 아담의 첫 범죄가 죽음, 애통, 슬픔, 고통, 수고의 작동을 촉발한 것으로 묘사합니다.
  alternative_readings:
  - 죽음이 단지 알려졌다고 완화할 수 있음
  - 원인-결과를 약화한 수사로 볼 수 있음
  rationale: 시리아어 본문과 POB의 대조 모두 아담의 죄를 재앙들의 실제 촉발점으로 제시하므로, 그 인과성을 흐리지 않았습니다.
  doctrine_reference: 'Cartha project doctrine: source-visible causality'
- issue: 천사들에게도 책임이 지워졌다는 진술
  chosen_reading: 본문의 난점을 지우지 않고 천사들에게도 책임이 지워졌다는 표현을 유지했습니다.
  alternative_readings:
  - 천사를 증인으로 완화할 수 있음
  - 본문 훼손 가능성으로 흐릴 수 있음
  rationale: 전승된 문구가 압축적이지만, 텍스트가 실제로 말하는 범위를 보이게 하는 것이 더 투명합니다.
  doctrine_reference: 'Cartha project doctrine: transparency where difficult'
