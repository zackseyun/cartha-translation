    ܐܢܐ ܠܐ ܐ̇ܒܕܬ ܐܢܘܢ

    47.. ܐܦ ܠܐ ܠܒܢܝ̈ܗܘܢ. ܗ̇ܘ ܕܝܢ

    ܢܦܩ̇ܘ ܘܫ̇ܪܝܘ ܐܢܘܢ.

