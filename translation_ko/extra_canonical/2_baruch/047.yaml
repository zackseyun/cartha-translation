    ܘܡܥܝܪܘܬܐ ܕܪܘܚܐ ܬܩܝܦܬܐ.

    ܒܕ̇ܩ ܐܢܬ ܣܘܦܗܘܢ

    ܕܙ̈ܒܢܐ. ܘܒܩ̈ܝܡܐ

    ܕܚܫܘܟܐ ܒ̇ܨܐ ܐܢܬ.

    ܦܩ̇ܕ ܐܢܬ ܠܡܢܝܢܐ

    ܕܥܒ̇ܪ ܘܡܬܛܪ̈ܢ. ܘܡܒܕܩ ܐܢܬ

    ܒܝܬ ܡܫܪܝܐ ܠܐܝܠܝܢ

    ܕܥܬܝܕܝܢ ܕܢܗܘܘܢ. ܐܢܬ

    ܟܣܝ ܐܢܬ ܪܢܝܬܐ

    ܕܒܥܝܪܐ ܘܐܒܝܕܐ ܕܥܠܡܝ̈ܢ

    ܠܐ ܛܥܐ ܐܢܬ. ܦܩ̇ܕ

    ܐܢܬ ܒܪܘܚܐ ܕܕܚܠܬܐ

    ܘܕܐܒܝܩܘܬܐ ܠܫܠܗܒ̈ܝܬܐ

    ܘܡܬܚ̈ܠܦܢ ܠܪ̈ܘܚܐ.

    ܘܒܡܠܬܐ ܡܩܝܡ ܐܢܬ

    ܡܕܡ ܕܠܝܬ ܗܘܐ. ܘܐܚܝܕ

    ܐܢܬ ܒܚܝܠܐ ܕ

    ܒܣܘܟܠܬܢܘܬܐ. ܘܡܚܟܡ

    ܬܐ ܡܪ̈ܝܪܬܐ ܕܢܡܘܣܟܘܢ

    ܒܣܝܡܘܬܗ. ܘܡܫܪܪܬܐ

    ܠܐ ܡܢܝܢ ܡܢܗܘܢ

    ܫܒܩܘ ܘܡܫܡܫܝܢ

    ܒܣܘܓܐܗܘܢ ܢܚܬܘ

    ܠܥܘܒܗ. ܝܬܝܪܐ ܠܥܒܕܘ

    ܘܕܘ ܠܒܥܠܕܒܒܝ. ܡܛܠ

    ܕܫܒܩܘ ܠܡ ܐܢܬܘܢ ܠܝ.

    ܘܒܥܝܬܘܢ ܡܥܠ ܬܘܒܝ.

    ܠܘܬܝ ܕܝܢ ܝܬܝܪ ܐܝܟ

    ܙܒܢ. ܘܝܬܝܪ ܐܝܟ

    ܕܐܦ ܠܐ ܗܘܝܬ ܐܢܐ

    ܥܡ ܟܠܗܘܢ ܡܛܠ ܕܠܐ

