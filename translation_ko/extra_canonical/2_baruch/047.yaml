  yaml_path: translation/extra_canonical/2_baruch/047.yaml
  text: '1 And when I had gone out and dismissed them, I went away from there and said to them, “Look, I am going to my dwelling in Hebron.”[a]


    2 And afterward my companions left me, and I came to the cedar where he had spoken with me; and I sat there and fasted seven days.[b]'
translation:
  language: ko
  text: '1 내가 그들을 내보내고 떠난 뒤, 그들에게 말했습니다. "보십시오, 저는 헤브론에 있는 제 거처로 가고 있습니다."[a]


    2 그 뒤에 내 동료들이 나를 떠났고, 나는 그분이 나와 말씀하셨던 백향목으로 갔습니다. 그리고 거기 앉아 칠 일 동안 금식했습니다.[b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܬܟܢܫܘ ... ܘܫܪܝܘ ܐܢܘܢ
  english_pob_choice: dismissed them / left them
  chosen_korean: 그들을 내보내다
  alternatives_korean:
  - 그들을 해산하다
  - 그들을 떠나보내다
  - 그들을 돌려보내다
  lexicon: ܫܪܝ / ܫܪܝܘ
  rationale: 문맥상 단순한 이별이 아니라 대상을 보내어 흩어지게 하는 동작이므로, POB의 ‘dismissed them’에 맞춰 ‘내보내다’로 옮겼습니다.
- source_word: ܕܝܪܝ ܠܚܒܪܘܢ
  english_pob_choice: my dwelling in Hebron
  chosen_korean: 헤브론에 있는 제 거처
  alternatives_korean:
  - 헤브론에 있는 내 집
  - 헤브론의 내 집
  - 헤브론에 있는 내 거처
  lexicon: ܕܝܪܐ
  rationale: ܕܝܪܐ는 단순한 주거지가 아니라 거처/숙소의 뉘앙스가 있어, 현대 한국어에서 과장 없이 그 의미를 살려 ‘거처’로 옮겼습니다.
- source_word: ܐܪܙܐ
  english_pob_choice: the cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 삼나무
  - 향나무
  - 그 백향목
  lexicon: ܐܪܙܐ
  rationale: 시리아어 ܐܪܙܐ는 일반적으로 ‘백향목’을 가리키므로, 본문 지시 대상이 되는 나무를 한국어 성경 관용과 원의미에 맞게 ‘백향목’으로 번역했습니다.
- source_word: ܨܡ̇ܬ ܫܒܥܐ ܝܘܡ̈ܝܢ
  english_pob_choice: fasted seven days
  chosen_korean: 칠 일 동안 금식했습니다
  alternatives_korean:
  - 칠 일을 금식했습니다
  - 일곱 날 동안 금식했습니다
  - 칠 일 동안 굶었습니다
  lexicon: ܨܡ
  rationale: 종교적 행위를 분명히 드러내는 동사이므로 ‘굶다’가 아니라 표준 성서어휘인 ‘금식하다’를 사용했습니다.
theological_decisions:
- issue: 화자에게서 동료들이 떠난 뒤에도 ‘백향목’으로 가는 장소성 유지
  chosen_reading: 장소를 지시하는 단순한 서술로 유지하고, 상징화하지 않았습니다.
  alternative_readings:
  - 상징적 은유로 확장하여 해석
  - 성소적 장소로 해석
  rationale: 본문은 경험 서술을 진행할 뿐이므로, 문맥이 허용하지 않는 신학적 상징을 덧붙이지 않고 원문 수준의 장소성을 보존했습니다.
  doctrine_reference: 본문 중심 해석 원칙
- issue: ‘보십시오’의 담화 표지
  chosen_reading: 직접 화법의 시작을 알리는 담화 표지로 ‘보십시오’를 사용했습니다.
  alternative_readings:
  - 보라
  - 이제 보십시오
  rationale: 헤아릴 수 없는 고어체를 피하면서도 청중의 주의를 환기하는 원문의 담화 기능을 살리기 위해 현대 합쇼체의 ‘보십시오’를 택했습니다.
  doctrine_reference: 표준어 합쇼체/직접화법 규범
