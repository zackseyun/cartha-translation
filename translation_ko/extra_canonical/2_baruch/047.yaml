    48 ܘܗܘܐ ܒܬܪ ܫܒܥܐ ܝܘܡ̈ܝܢ

    ܘܗܘܐ ܡܢ ܒܬܪ ܝܘܡܐ

    ܫܒܝܥܝܐ܆ ܨ̇ܠܝܬ ܩܕܡ

    ܚܝܠܬܢܐ ܘܐܡ̇ܪܬ. ܐܘ

