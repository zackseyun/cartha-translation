base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/020.yaml
  text: '1 Therefore[1], behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.

    2 Therefore I have now taken Zion away, so that I may visit the world more swiftly in its appointed time.

    3 And now, hold fast in your heart all that I command you, and seal it in the inner chambers of your mind.

    4 Then I will show you the judgment of my might and my ways, which are past searching out.

    5 Go[2], therefore, sanctify yourself for seven days; eat no bread, drink no water, and speak with no one.

    6 Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.'
  footnotes:
  - marker: '1'
    text: The opening of chapter 20 falls near a weak page transition in the Ceriani bucket; the draft follows the primary Syriac as far as recoverable and uses Kmosko page 560 as a control for the chapter boundary and damaged sequence.
    reason: textual_variant
  - marker: '2'
    text: 'At verse 5, the fasting command is uncertain at the chapter edge: the control Latin on Kmosko page 560 has ''drink no wine,'' while the next chapter''s fulfillment scene favors ''drink no water.'' This draft adopts ''water'' but flags the variation.'
    reason: alternative_reading
translation:
  language: ko
  text: '1 그러므로 보십시오. 날들이 오고 있습니다. 그때에는 시간이 이전의 것들보다 더 빨라지고, 지나간 계절들보다 더 신속히 지나가며, 지금의 해들보다 더 빨리 흘러갈 것입니다.

    2 그러므로 나는 지금 시온을 옮겨 놓았습니다. 정해진 때에 세상을 더 속히 방문하려고 함입니다.

    3 이제 내가 당신에게 명하는 모든 것을 마음에 굳게 붙들고, 마음의 깊은 곳에 봉인해 두십시오.

    4 그러면 내 능력의 심판과, 찾아낼 수 없는 내 길들을 당신에게 보여 주겠습니다.

    5 그러므로 가서, 칠 일 동안 스스로를 거룩하게 하십시오. 빵을 먹지 말고, 물을 마시지 말며, 아무와도 말하지 마십시오.

    6 그 뒤에 이곳으로 오십시오. 그러면 내가 거기에서 당신에게 나타나 참된 것들을 말하고, 때들이 어떻게 정해져 있는지 당신에게 가르치겠습니다. 그것들은 오고 있으며, 지체하지 않을 것입니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒ̈ܢܐ / ܙܒܢܗ
  english_pob_choice: times / the times
  chosen_korean: 때들 / 때들
  alternatives_korean:
  - 시간들
  - 시기들
  - 계절들
  lexicon: Payne Smith
  rationale: 종말론적 구간을 가리키는 말이므로 단순한 시계시간보다 ‘때들’이 원문의 넓은 의미를 가장 자연스럽게 담습니다.
- source_word: ܫܘܪܒܐ / visitation idea behind 'visit the world'
  english_pob_choice: visit the world
  chosen_korean: 세상을 방문하다
  alternatives_korean:
  - 세상을 찾아오다
  - 세상을 살피다
  - 세상을 심판하다
  lexicon: Payne Smith
  rationale: ‘방문하다’는 은유를 살리면서도 심판의 함의를 미리 한정하지 않아, 본문의 종말론적 개입을 과도하게 좁히지 않습니다.
- source_word: ܐܚܝܕ / heart-retention idiom
  english_pob_choice: hold fast in your heart
  chosen_korean: 마음에 굳게 붙들다
  alternatives_korean:
  - 마음에 간직하다
  - 마음속에 붙들다
  lexicon: Brockelmann
  rationale: 기억만이 아니라 적극적이고 충실한 내적 보관의 뉘앙스를 살리기 위해 ‘굳게 붙들다’를 택했습니다.
- source_word: ܩܕܫ
  english_pob_choice: sanctify yourself
  chosen_korean: 스스로를 거룩하게 하다
  alternatives_korean:
  - 자신을 성별하다
  - 자신을 정결하게 하다
  lexicon: Payne Smith
  rationale: 비전적 대면을 위한 준비라는 맥락에서, 한국어 성서어휘를 유지하되 ‘스스로를’로 반사적 요구를 분명히 했습니다.
- source_word: ܫܪܪܬܐ
  english_pob_choice: true things
  chosen_korean: 참된 것들
  alternatives_korean:
  - 진리
  - 참말들
  - 신실한 말들
  lexicon: Payne Smith
  rationale: 계시 내용의 복수성과 구체성을 보존하기 위해 추상명사 ‘진리’보다 ‘참된 것들’을 사용했습니다.
theological_decisions:
- issue: 시온을 옮겨 놓으셨다는 표현의 주체성과 의미
  chosen_reading: 하나님이 주권적으로 시온을 옮겨 놓으셨다는 뜻으로 번역했습니다.
  alternative_readings:
  - 시온을 제거하셨다
  - 시온을 떠나게 하셨다
  rationale: 본문은 역사적 사고의 우연성이 아니라 하나님의 주권적 조치를 전제하므로, ‘옮겨 놓았습니다’로 그 긴장을 유지했습니다.
  doctrine_reference: 섭리, 종말론적 심판과 구원사
- issue: ‘방문하다’의 신학적 뉘앙스
  chosen_reading: 마지막 때의 निर्ण적 개입이지만, 본문 자체의 표현은 ‘방문’으로 남겼습니다.
  alternative_readings:
  - 심판하다
  - 돌보러 오다
  rationale: 문맥상 심판적 성격이 강하지만, 원문이 가진 양가성—심판과 은총의 개입—을 보존하려고 한 단어로 환원하지 않았습니다.
  doctrine_reference: 종말론, 하나님의 방문 개념
