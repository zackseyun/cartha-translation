translation:
  language: ko
  text: 그리고 내 기도 가운데서도. 너희도 그 편지의 명령들을 그들에게서 배웠으며, 너희는 탁월함 가운데서 나라들을 위해 굽혀질 것이고, 또 사랑을 받을 것이며, 위로를 받을 것이니, 너희가 넘어져 고통받지 않게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  english_pob_choice: in my prayer also
  chosen_korean: 내 기도 가운데서도
  alternatives_korean:
  - 내 간구 가운데서도
  - 내 기도 안에서도
  lexicon: Payne Smith
  rationale: ‘ܒܒܥܘܬܝ’는 기도/간구/청원의 뜻을 가질 수 있으므로, 본문의 정서와 문맥에 가장 자연스러운 ‘기도’를 택하고, 뒤이은 내용과의 연결을 살려 ‘가운데서도’로 처리했습니다.
- source_word: ܝܠܦܬܘܢ
  english_pob_choice: you also have learned
  chosen_korean: 너희도 … 배웠으며
  alternatives_korean:
  - 너희도 … 배우며
  - 너희도 … 배워야 하며
  lexicon: Payne Smith
  rationale: 시리아어 동사는 ‘배우다/지도를 받다’의 완료적 의미가 자연스러워, 훈계형 미래보다 이미 받은 가르침을 드러내는 ‘배웠으며’로 옮겼습니다.
- source_word: ܦܘ̈ܩܕܢܐ
  english_pob_choice: the commandments
  chosen_korean: 명령들
  alternatives_korean:
  - 계명들
  - 훈령들
  - 교훈들
  lexicon: Payne Smith
  rationale: 이 단어는 권위를 가진 지시나 명령을 뜻하므로, 종교적 어휘로 굳어지기 쉬운 ‘계명’보다 문맥을 덜 한정하는 ‘명령들’이 원문의 직접성을 잘 살립니다.
- source_word: ܡܘܠܟܢܐ
  english_pob_choice: the promise
  chosen_korean: 나라들을 위해
  alternatives_korean:
  - 약속을 위해
  - 약속 때문에
  - 그 약속을 위해
  lexicon: Payne Smith
  rationale: 이 절의 뒤부분은 전승상 난해하며, 제공된 시리아어는 의미가 끊기거나 교란된 흔적이 있습니다. 그래서 본문을 과도하게 매끈하게 만들지 않고, 현전 텍스트가 가리키는 대로 최소한의 연결만 유지했습니다.
theological_decisions:
- issue: 본문 후반의 난해한 시리아어 구절을 어떻게 처리할 것인가
  chosen_reading: 해석을 과도하게 확장하지 않고, 원문에 남아 있는 표현을 따라 ‘탁월함 가운데서 나라들을 위해 굽혀질 것’처럼 다소 거친 구조를 유지했습니다.
  alternative_readings:
  - ‘탁월함으로 나라들을 다스리게 될 것이다’
  - ‘약속을 위해 굳세어질 것이다’
  rationale: 전달된 시리아어와 영어 주해 모두 후반부에 전승 난점이 있음을 시사합니다. 따라서 본문을 매끄러운 신학적 문장으로 재구성하기보다, 독자가 텍스트의 불확실성을 인식하도록 남겨 두는 것이 더 충실합니다.
  doctrine_reference: 원문 비평 및 번역의 투명성 원칙
