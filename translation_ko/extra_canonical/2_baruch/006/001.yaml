revisions:
- from: 그다음 날에 보니, 갈대아 사람들의 군대가 그 도성을 둘러쌌습니다. 저녁때에 나는 바룩이 백성 곁을 떠나 나가서 떡갈나무 아래에 서 있었고, 시온을 두고 슬퍼하며 백성에게 닥친 포로 됨을 두고 애통해하고 있었습니다. 그러자 나는 능력의 영으로 충만하여 예루살렘 광장 위 높은 곳으로 들려 올라갔습니다. 그리고 보니, 네 천사가 도시의 네 모퉁이에 서 있었고, 그들 하나하나는 횃불을 들고 있었습니다.[a]
  to: 이튿날, 보니 갈대아 사람들의 군대가 그 성읍을 포위하고 있었습니다. 저녁 무렵에 나 바룩은 백성을 떠나 나가 떡갈나무 곁에 서서, 시온을 두고 슬퍼하며 백성에게 닥친 포로 됨을 두고 애통하고 있었습니다. 그러자 나는 능력의 영으로 충만해져 예루살렘 광장 위로 높이 들려 올라갔습니다. 또 보니, 네 천사가 그 성읍의 네 모퉁이에 서 있었고, 저마다 횃불 하나를 들고 있었습니다.[a]
