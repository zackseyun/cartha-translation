translation:
  language: ko
  text: 이튿날, 보니 갈대아 사람들의 군대가 그 성읍을 포위하고 있었습니다. 저녁 무렵에 나 바룩은 백성을 떠나 나가 떡갈나무 곁에 서서, 시온을 두고 슬퍼하며 백성에게 닥친 포로 됨을 두고 애통하고 있었습니다. 그러자 나는 능력의 영으로 충만해져 예루살렘 광장 위로 높이 들려 올라갔습니다. 또 보니, 네 천사가 그 성읍의 네 모퉁이에 서 있었고, 저마다 횃불 하나를 들고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 앞의 두 문장만을 본 절의 번역으로 제시하는 전승상의 절 구분이 있습니다.
    reason: 영어 POB 감사 기록의 이전 번역 범위를 반영하되, 본문 자체의 대안 번역인 것처럼 오해되지 않도록 절 구분상의 차이로 명시했습니다.
lexical_decisions:
- source_word: ܡܢܐ ܕܡܚܪ
  english_pob_choice: on the next day
  chosen_korean: 그다음 날에
  alternatives_korean:
  - 이튿날에
  - 다음 날에
  lexicon: Smith Syriac Dictionary
  rationale: 표준적인 시간 전개를 자연스럽게 살리면서, 사건의 연속성을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  english_pob_choice: the forces of the Chaldeans
  chosen_korean: 갈대아 사람들의 군대
  alternatives_korean:
  - 갈대아의 군세
  - 갈대아 군대
  lexicon: Payne Smith
  rationale: 영문 audit의 ‘forces’에 대응하되, 포위하는 군사력을 분명히 보이도록 ‘군대’로 옮겼습니다.
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  english_pob_choice: a spirit of strength
  chosen_korean: 능력의 영
  alternatives_korean:
  - 힘의 영
  - 강건함의 영
  lexicon: Payne Smith
  rationale: 시리아어 표현은 사람을 들어 올리고 힘을 주는 영적 동력을 가리키므로, 문맥상 ‘능력’이 가장 자연스럽고도 강한 대응입니다.
- source_word: ܫܘܩܐ ܕܐܘܪܫܠܡ
  english_pob_choice: the square of Jerusalem
  chosen_korean: 예루살렘 광장
  alternatives_korean:
  - 예루살렘 거리
  - 예루살렘 장터
  lexicon: Smith Syriac Dictionary
  rationale: 이 단어는 거리/장터/공개 공간을 아우를 수 있어, 높은 곳에서 내려다보는 장면에 맞는 넓은 공개 공간인 ‘광장’으로 옮겼습니다.
- source_word: ܠܡܦܝܕܐ
  english_pob_choice: a torch
  chosen_korean: 횃불
  alternatives_korean:
  - 등불
  - 불꽃
  lexicon: Payne Smith
  rationale: 천사들의 손에 들린 불붙은 도구라는 이미지에 맞게, 약한 조명보다 ‘횃불’이 apocalyptic 장면을 더 정확히 전달합니다.
theological_decisions:
- issue: ‘성령’ vs. 일반적인 ‘영’
  chosen_reading: 문맥상 인물을 들어 올리는 능동적 영적 작용이므로 ‘능력의 영’으로 번역했습니다.
  alternative_readings:
  - 성령
  - 강한 영
  rationale: 본문은 특별한 성령 공식보다 힘과 들림을 일으키는 영의 작용을 말하므로, 과도한 신학적 고정 없이 원문 효과를 살렸습니다.
  doctrine_reference: 2 Baruch 6:1 서술 맥락
