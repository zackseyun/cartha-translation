base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/062.yaml
  text: '1[a]. And the seventh black waters that you saw—these are the perversion of the time that appeared through the counsel of Jeroboam, who took counsel to make two calves of gold.


    2. And all the iniquities that the kings who came after him committed in wickedness.


    3. And the curse of Jezebel, and the worship of idols that Israel practiced at that time.


    4. And the withholding of rain, and the famines that came to pass until women ate the fruit of their womb[b].


    5. And the time of their captivity that came upon the nine and a half tribes, because they were in many sins.


    6. And Shalmaneser king of Assyria came and carried them away captive.


    7. But concerning the nations, it would be too much to tell how they continually acted in impiety and wickedness and never showed themselves righteous.


    8. These are the seventh black waters that you saw.'
  footnotes:
  - marker: a
    text: The Ceriani chapter bucket for chapter 62 overlaps adjacent chapters at both edges. The surviving primary-page slice supplied here contains material from the close of chapter 61 and the opening of chapter 63, so the English draft follows the control-backed chapter identification for 2 Baruch 62 rather than forcing false precision from the unstable page boundary.
    reason: textual_variant
  - marker: b
    text: The control witness identifies this chapter as the 'seventh black waters' section between the David-Solomon bright waters of chapter 61 and the Hezekiah bright waters of chapter 63.
    reason: cross_reference
translation:
  language: ko
  text: '1[a]. 그리고 당신이 본 일곱 번째 검은 물은—여로보암의 계책을 통해 나타난 그 시대의 왜곡입니다. 그는 두 금송아지를 만들려고 계책을 세웠습니다.


    2. 그리고 그 뒤에 온 왕들이 악 가운데 저지른 모든 불의입니다.


    3. 그리고 이세벨의 저주, 그리고 그때 이스라엘이 행한 우상 숭배입니다.


    4. 그리고 비를 거두어 가심, 그리고 여인들이 자기 태의 열매[b]를 먹기까지 일어난 기근입니다.


    5. 그리고 그들이 많은 죄 가운데 있었기 때문에, 아홉 지파 반에게 임한 그 포로의 때입니다.


    6. 그리고 아시리아의 왕 살만에셀이 와서 그들을 사로잡아 끌어갔습니다.


    7. 그러나 민족들에 관해서는, 그들이 끊임없이 불경건과 악행을 행하고 결코 의롭게 드러나지 않았던 일을 말하기에는 너무 많습니다.


    8. 이것이 당신이 본 일곱 번째 검은 물입니다.'
