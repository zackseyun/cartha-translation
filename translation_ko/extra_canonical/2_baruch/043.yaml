base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/043.yaml
  text: 'But you[a], Baruch, fix your heart for what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will surely not see again those evil times.

    Therefore endure concerning my judgment, and do not be shaken; for if you do these things[b], after a time you will receive from the Most High whatever has been reserved for you, and what has been prepared for the end of the times[c].

    And this I will make known to you and speak into your understanding.'
  footnotes:
  - marker: a
    text: The chapter opening is clear from the explicit Syriac numeral 43 on p0204, but the page still carries the closing lines of the prior chapter just above it.
    reason: textual_variant
  - marker: b
    text: The middle of verse 2 is textually rough in the Ceriani witness. The draft follows the broad sense that Baruch will leave the corruptible mortal sphere, while avoiding a more exact reconstruction than the page securely supports.
    reason: textual_variant
  - marker: c
    text: Or 'many eternal comforts are kept for you'.
    reason: previous_rendering
translation:
  language: ko
  text: '바룩아, 네게 말한 것을 마음에 굳게 새기고, 네게 보여 준 것들을 깨달으십시오. 많은 영원한 위로가 네게 있습니다.


    이제부터 너는 다시는 그 악한 때를 보지 못할 것입니다.


    그러므로 내 판결에 대하여 견디고 흔들리지 마십시오. 만일 네가 이 일들을 행하면, 얼마 후 지극히 높으신 분께서 너를 위해 남겨 두신 것과 때의 끝을 위하여 예비해 두신 것을 받게 될 것입니다.


    그리고 내가 이것을 너에게 알리고, 네 이해에 말하겠습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܘܫ ܐܬܩܢ ܠܒܟ
  english_pob_choice: fix your heart
  chosen_korean: 마음을 굳게 새기고
  alternatives_korean:
  - 마음을 정하고
  - 마음을 바로잡고
  - 마음을 준비하고
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: Syriac idiom은 내면을 단단히 세우고 흔들리지 않게 하라는 권고로 보이므로, ‘굳게 새기다’로 압축해 결의와 내적 안정감을 함께 살렸습니다.
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ
  english_pob_choice: much eternal consolation
  chosen_korean: 많은 영원한 위로
  alternatives_korean:
  - 큰 영원한 위로
  - 풍성한 영원한 위로
  - 많은 영원한 위안
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 명사구의 양감과 종말론적 위로의 뉘앙스를 살려 ‘위로’로 옮겼고, singular한 강세를 한국어에서는 ‘많은’으로 자연스럽게 반영했습니다.
- source_word: ܒܠܥܕܡ
  english_pob_choice: eternal
  chosen_korean: 영원한
  alternatives_korean:
  - 끝없는
  - 영구한
  - 한없는
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 문맥이 가리키는 지속성과 종말론적 성격을 가장 직접적으로 드러내는 표준어로 ‘영원한’을 택했습니다.
- source_word: ܡܠܐ ܥܠܝܟ
  english_pob_choice: whatever has been reserved for you
  chosen_korean: 너를 위해 남겨 두신 것
  alternatives_korean:
  - 너를 위해 예비해 두신 것
  - 너에게 보존된 것
  - 너를 위해 저장해 두신 것
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 영어 POB의 보존/예약 뉘앙스를 따라, 장차 받을 몫이 이미 확보되어 있다는 뜻을 한국어의 ‘남겨 두신 것’으로 전달했습니다.
- source_word: ܐܬܚܘܝ ܠܟ / ܐܡܠܠ ܒܡܕܥܝܟ
  english_pob_choice: speak into your understanding
  chosen_korean: 네 이해에 말하겠습니다
  alternatives_korean:
  - 네 마음에 말하겠습니다
  - 네 깨달음 속에 말하겠습니다
  - 네 분별에 말씀드리겠습니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 직역하면 다소 낯설지만, 계시 내용이 단순한 청각적 전달이 아니라 내적 인식에 이르는 소통임을 드러내기 위해 ‘이해에 말하다’로 살렸습니다.
theological_decisions:
- issue: ‘많은 영원한 위로’의 성격
  chosen_reading: 현재 감정 위안이 아니라, 장차 주어질 종말론적 위로를 가리키는 표현으로 옮겼습니다.
  alternative_readings:
  - 일반적인 위안
  - 희망의 상징적 표현
  rationale: 문맥이 바룩의 장차 올 상태와 악한 때의 종결을 대비하므로, 위로를 eschatological consolation으로 유지하는 것이 source에 더 충실합니다.
  doctrine_reference: apocalyptic consolation / eschatological hope
- issue: ‘내 판결에 대하여 견디고’의 의미
  chosen_reading: 하나님의 판단을 수용하며 그 과정에서 흔들리지 않는 태도로 옮겼습니다.
  alternative_readings:
  - 심판을 견디고
  - 내 심판을 참아 내고
  rationale: Syriac의 전치사적 표현은 단순 고통 감내보다 판단에 대한 신실한 인내를 포함하므로, 합쇼체로도 긴장감을 유지했습니다.
  doctrine_reference: divine judgment and perseverance
