translation:
  language: ko
  text: 그리고 네가 본 여섯째 밝은 물은 곧 다윗과 솔로몬이 태어난 때입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  english_pob_choice: bright waters
  chosen_korean: 밝은 물
  alternatives_korean:
  - 맑은 물
  - 빛나는 물
  lexicon: Payne Smith
  rationale: 환상 표상의 대비는 검은 물과의 대조에 있으므로, ‘밝은’으로 광채와 길한 성격을 살리면서도 과도한 시적 확장을 피했습니다.
- source_word: ܫܪܒܐ ܕܝܢ ܕܣܘܓܐܐ
  english_pob_choice: the sixth bright waters
  chosen_korean: 여섯째 밝은 물
  alternatives_korean:
  - 여섯 번째 밝은 물
  - 여섯 번째의 밝은 물
  lexicon: Payne Smith
  rationale: 수열 속 항목을 가리키는 표현이므로 ‘여섯째’로 자연스럽게 옮기되, 항목 자체가 물의 환상임을 드러내기 위해 ‘밝은 물’을 유지했습니다.
- source_word: ܙܒܢܐ
  english_pob_choice: time
  chosen_korean: 때
  alternatives_korean:
  - 시간
  - 시기
  lexicon: Payne Smith
  rationale: 문맥상 단순한 물리적 시간이 아니라 다윗과 솔로몬의 출생이 속한 역사적 국면을 가리키므로, 문장 흐름이 살아나는 ‘때’를 택했습니다.
theological_decisions:
- issue: ‘이것은/이것들이 그때이다’ 식의 수량·지시 대응을 한국어에서 어떻게 처리할지
  chosen_reading: 단수 서술로 정리하여 ‘곧 … 때입니다’로 옮겼습니다.
  alternative_readings:
  - ‘이것들은 다윗과 솔로몬이 태어난 때입니다’
  - ‘이것이 다윗과 솔로몬이 태어난 때입니다’
  rationale: 영어 POB와 주석은 복수 지시와 단수 보어 사이의 문법적 긴장을 알리지만, 시리아어 본문은 환상 항목 하나를 지시하는 구조이므로 한국어에서는 의미를 명료하게 하되 긴장을 새로 만들지 않도록 단수로 처리했습니다.
  doctrine_reference: 문학적-예언적 환상 해석
