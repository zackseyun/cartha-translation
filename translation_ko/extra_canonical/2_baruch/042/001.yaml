  text: And he answered and said to me, “These things also I will show you.
translation:
  language: ko
  text: 그가 대답하여 나에게 말하였습니다. “이것들도 내가 너에게 보여 주겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡܪ ܠܝ
  english_pob_choice: said to me
  chosen_korean: 제게 말하였습니다
  alternatives_korean:
  - 내게 말하였습니다
  - 저에게 말하였습니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 대화 상대를 향한 직접 발화를 자연스러운 현대 합쇼체로 옮기되, 문어적 거리감을 유지하기 위해 ‘제게’를 선택했습니다.
- source_word: ܗܠܝܢ ܕܐܦ
  english_pob_choice: These things also
  chosen_korean: 이것들도
  alternatives_korean:
  - 이 일들도
  - 이것들까지도
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 앞 문맥에서 이어지는 추가 계시의 성격을 살리기 위해 ‘also’를 ‘-도’로 간결하게 반영했습니다.
- source_word: ܐܘܚܙܝܟ
  english_pob_choice: I will show you
  chosen_korean: 내가 너에게 보여 주겠습니다
  alternatives_korean:
  - 내가 네게 보이겠습니다
  - 내가 너에게 나타내 보이겠습니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 시리아어의 ‘보여 주다’ 의미를 직역에 가깝게 살렸고, 계시 행위의 능동성을 드러내기 위해 ‘보여 주겠습니다’를 택했습니다.
theological_decisions:
- issue: 직접 화법의 공손도
  chosen_reading: 예언/계시 장면의 직접 인용이므로 한국어 본문은 합쇼체를 유지하되, 화자 간 2인칭 대화의 친밀성을 해치지 않는 범위에서 ‘너’ 호칭을 사용했습니다.
  alternative_readings:
  - 당신에게 보여 주겠습니다
  - 네게 보여 주겠습니다
  rationale: 본문은 단순 서술이 아니라 계시적 응답이므로, 문체는 공손하되 원문의 직접성을 보존하는 쪽이 적절합니다.
  doctrine_reference: Source-language speech register preservation
