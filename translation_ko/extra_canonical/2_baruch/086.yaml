  text: So then[a], when you receive the letter, read it in your assemblies with diligence. And consider its words more carefully in the days of the weeks[c][b], so that you may remember and be set right.
  footnotes:
  - marker: a
    text: This Ceriani bucket sits on an overlap page and the boundary between chapters 85–89 remains somewhat unstable; the draft therefore renders only the material marked here for chapter 86 without claiming greater precision than the source state warrants.
