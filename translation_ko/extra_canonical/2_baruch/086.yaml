translation:
  language: ko
  text: 그러므로[a], 여러분이 그 편지를 받으면, 여러분의 회중에서 그것을 부지런히 읽으십시오. 그리고 특히 주간의 날들에 그 말씀을 더 주의 깊게 생각하여, 기억하고 바로잡히십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  english_pob_choice: with diligence
  chosen_korean: 부지런히
  alternatives_korean:
  - 주의 깊게
  - 정성껏
  - 차분히
  lexicon: Payne Smith
  rationale: 이 명사는 조용함이나 한가로움의 뉘앙스를 가질 수 있지만, 공적 낭독의 맥락에서는 단순한 속도가 아니라 성실하고 신중한 태도를 살리는 쪽이 적절하므로 ‘부지런히’로 옮겼습니다.
- source_word: ܬܬܗܪܘܢ
  english_pob_choice: consider its words more carefully
  chosen_korean: 더 주의 깊게 생각하여
  alternatives_korean:
  - 더 자세히 살펴
  - 더 간절히 헤아려
  - 곰곰이 생각하여
  lexicon: Payne Smith
  rationale: 어근은 주의 깊게 여기고 숙고하는 뜻을 가지므로, 단순한 지적보다 문맥상 ‘생각하여’에 ‘더 주의 깊게’를 붙여 권면의 힘을 자연스럽게 살렸습니다.
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  english_pob_choice: in the days of the weeks
  chosen_korean: 주간의 날들
  alternatives_korean:
  - 주들의 날들
  - 주간의 날들에
  - 주일들의 날들
  lexicon: Payne Smith
  rationale: 시리아어 본문이 문자적으로 ‘주/주간들의 날들’에 가까우므로, 다른 전통의 더 구체적인 전례적 의미를 미리 끌어오지 않고 가능한 한 근접하게 옮겼습니다.
- source_word: ܬܬܥܗܕܘܢ
  english_pob_choice: you may remember
  chosen_korean: 기억하고
  alternatives_korean:
  - 되새기고
  - 기억하여
  - 마음에 새기고
  lexicon: Payne Smith
  rationale: 동사는 기억을 환기하거나 떠올리게 한다는 뜻이어서, 앞의 권면과 짝을 이루는 결과절로 자연스럽게 읽히는 ‘기억하고’를 택했습니다.
- source_word: ܬܬܪܨܘܢ
  english_pob_choice: be set right
  chosen_korean: 바로잡히십시오
  alternatives_korean:
  - 올바르게 되십시오
  - 수정되십시오
  - 정돈되십시오
  lexicon: Payne Smith
  rationale: 이 동사는 ‘곧다/바르다’에서 나온 ‘바르게 되다, 바로잡히다’의 의미를 가지므로, 도덕적·실천적 교정의 힘을 살려 피동형 권고로 옮겼습니다.
theological_decisions:
- issue: 회중에서의 낭독을 한국 교회식 용어로 바꿀지 여부
  chosen_reading: ‘여러분의 회중에서’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘여러분의 교회에서’
  - ‘공동체 가운데서’
  rationale: 본문의 핵심은 제도적 교회보다 모인 공동체의 공적 낭독이므로, 익숙한 교회 용어로 평탄화하지 않고 회중의 의미를 보존했습니다.
  doctrine_reference: ecclesiology
- issue: 마지막 권면을 신학적으로 확장할지 여부
  chosen_reading: ‘기억하고 바로잡히십시오’로 절제된 윤리적 권면을 유지했습니다.
  alternative_readings:
  - ‘회개하고 바로 서십시오’
  - ‘깨달아 순종하십시오’
  rationale: 본문은 교리 진술이 아니라 실천적 권면이므로, 회개 같은 후대의 신학어를 덧씌우지 않고 문맥이 요구하는 수준의 교정 의미만 드러냈습니다.
  doctrine_reference: moral_exhortation
