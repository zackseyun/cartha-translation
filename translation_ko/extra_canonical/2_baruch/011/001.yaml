  yaml_path: translation/extra_canonical/2_baruch/011/001.yaml
  text: 'Then I, Baruch, said: “And I said to you, O Babylon: ‘If you had prospered, and Zion had dwelt in her glory, our grief would still have been great that you had been made equal to Zion. But now, behold, the grief is infinite and the lamentation beyond measure, because Babylon has prospered and Zion lies desolate. For who can judge concerning these things, or to whom shall we complain about what has come upon us? O Lord, how have you endured it? Our fathers went to rest without grief, and behold, the righteous sleep quietly in the earth, because they did not know this distress, nor had they heard what has happened to us. Would that you had ears, O earth, and that you had a heart, O dust, so that you might go and announce in Sheol and say to the dead, ‘Blessed are you more than we who live.’”'
  footnotes:
  - marker: a
    text: Or 'answered and said, “Why, O Israel, do you trouble yourself in your mind, and why are you grieved, O land, because of what has happened? For if you had prospered, O Zion, and Babylon had been destroyed, our grief would still have been great that Babylon had been made equal to Zion.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 나 바룩이 말했습니다. “내가 네게 말하였습니다, 바빌론아. 네가 번성하고 시온이 그 영광 가운데 머물렀더라도, 네가 시온과 동등하게 된 것 때문에 우리의 슬픔은 여전히 컸을 것입니다. 그러나 이제 보십시오. 슬픔은 끝이 없고 애곡은 헤아릴 수 없으니, 바빌론은 번성하고 시온은 황폐해졌기 때문입니다. 이 일들을 두고 누가 판단할 수 있으며, 우리에게 닥친 일을 두고 누구에게 호소하겠습니까? 주님, 어떻게 그것을 견디실 수 있습니까? 우리 조상들은 슬픔 없이 안식에 들어갔고, 보십시오, 의인들은 그 고통을 알지 못했고 우리에게 일어난 일을 듣지도 못했기에 땅에서 조용히 잠듭니다. 땅아, 네게 귀가 있었더라면! 티끌아, 네게 마음이 있었더라면! 그러면 네가 스올에 가서 그것을 알리고 죽은 자들에게 말할 수 있었을 것입니다. ‘살아 있는 우리보다 너희가 더 복됩니다.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܒܠ / Babylon
  english_pob_choice: O Babylon
  chosen_korean: 바빌론아
  alternatives_korean:
  - 오 바빌론아
  - 바빌론
  lexicon: Payne Smith
  rationale: 직접 호명의 감정을 살리기 위해 호격을 사용했고, 본문이 제국 도시 바빌론을 상대로 하는 애가이므로 도시명 자체를 유지했습니다.
- source_word: ܨܗܝܘܢ / Zion
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 시온산
  - 시온아
  lexicon: Payne Smith
  rationale: 지명/상징명의 표준 음역을 유지하여 바빌론과의 대조를 분명하게 했습니다.
- source_word: ܡܬܩܒܠܝܢ / desolate contrast
  english_pob_choice: lies desolate
  chosen_korean: 황폐해졌기 때문입니다
  alternatives_korean:
  - 폐허가 되었기 때문입니다
  - 황량해졌기 때문입니다
  lexicon: Payne Smith
  rationale: 소스의 대조 구조에서 시온의 몰락 상태를 자연스러운 현대 한국어로 나타내되, 단순한 감상적 표현으로 약화시키지 않았습니다.
- source_word: ܡܣܬܝܟ / ܠܐ ܡܣܬܝܟ
  english_pob_choice: beyond measure / infinite
  chosen_korean: 헤아릴 수 없으니
  alternatives_korean:
  - 측량할 수 없으니
  - 끝이 없으니
  lexicon: Payne Smith
  rationale: ‘측량할 수 없음’의 의미를 유지하면서도 애가의 문맥에 맞는 관용적 표현으로 옮겼습니다.
- source_word: ܫܝܘܠ
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 지옥
  - 무덤
  lexicon: Payne Smith
  rationale: 후대 교리어로 평평하게 만들지 않고, 제2성전기 유대 문맥의 사후 세계 용어를 그대로 보존했습니다.
theological_decisions:
- issue: Baruch의 격정적 탄식이 하나님께 대한 항변으로 들릴 수 있는 대목
  chosen_reading: 주님, 어떻게 그것을 견디실 수 있습니까?
  alternative_readings:
  - 주님, 어떻게 그것을 참으실 수 있습니까?
  - 주님, 어찌 이것을 허용하십니까?
  rationale: 원문의 놀람과 탄식을 살리되, 하나님을 직접 비난하는 어조로 과도하게 강화하지 않도록 ‘견디실 수 있습니까’로 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
- issue: 죽은 자와 스올에 대한 표현
  chosen_reading: 스올에서 그것을 알리고 죽은 자들에게 말할 수 있을 것입니다
  alternative_readings:
  - 음부에서 알리고
  - 무덤에서 알리고
  rationale: 본문의 우주론적 상징을 유지하여, 단순한 매장지 이상의 의미를 지닌 스올을 보존했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
