  lexicon: Payne Smith
  rationale: 축복 인사로서의 짧은 병렬을 살리되, ܪ̈ܚܡܐ의 언약적 뉘앙스를 표준적인 교회어보다 덜 평탄하게 ‘긍휼’로 옮겼습니다.
- source_word: ܕܚܒܢ / ܐܚܒܢ
  english_pob_choice: who loved us from the beginning
  chosen_korean: 태초부터 우리를 사랑하셨고
  alternatives_korean:
  - 처음부터 우리를 사랑하셨고
  - 옛적부터 우리를 사랑하셨고
  lexicon: Payne Smith
  rationale: ‘from the beginning’의 선재적·지속적 의미를 살려, 단순한 시간표현보다 신학적으로 넓은 ‘태초부터’를 택했습니다.
- source_word: ܪܕܝܘ
  english_pob_choice: has disciplined us
  chosen_korean: 징계하셨습니다
  alternatives_korean:
  - 훈계하셨습니다
  - 벌하셨습니다
  lexicon: Payne Smith
  rationale: 사랑과 미움의 대비 속에서 징계의 교정적 의미가 핵심이므로, 단순 처벌보다 ‘징계’가 문맥을 더 정확히 드러냅니다.
- source_word: ܐܣܘܪܐ ܚܕ
  english_pob_choice: one bond
  chosen_korean: 한 줄의 속박
  alternatives_korean:
  - 한 속박
  - 한 결박
  lexicon: Payne Smith
  rationale: 공동의 포로 상태를 드러내는 동시에 혈연적 연대까지 보이도록, 문자적 ‘결박’보다 자연스럽고 이미지가 살아 있는 표현을 택했습니다.
theological_decisions:
- issue: ‘우리 열두 지파 모두’의 보존
  chosen_reading: 열두 지파 전체가 한 아버지에게서 난 한 공동체라는 강조를 본문에 살렸습니다.
  alternative_readings:
  - 열두 지파를 생략하고 단순히 ‘우리 모두’로 옮김
  - ‘아홉 지파 반’만을 제목 정보로 두고 본문에서는 제외함
  rationale: 시리아어 본문과 교정 대조에서 핵심 의미는 전체 열두 지파의 공동 결박이므로, 그 신학적 강조를 한국어 본문에도 분명히 반영했습니다.
  doctrine_reference: 공동체적 정체성, 포로와 징계의 신학
