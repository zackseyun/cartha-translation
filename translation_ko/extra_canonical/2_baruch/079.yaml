translation:
  language: ko
  text: '이것들은 바룩, 느리야의 아들이, 유프라테스 건너편의 아홉 지파 반에게 보낸 편지의 말들이며, 거기 기록된 내용은 이렇습니다.


    느리야의 아들 바룩이 포로로 잡혀간 형제들에게 이르기를, “평강과 긍휼이 여러분과 함께하시기를 바랍니다. 나의 형제들이여, 우리를 지으신 분의 사랑을 나는 기억합니다. 그분은 태초부터 우리를 사랑하셨고, 우리를 완전히 미워하지 않으셨습니다. 오히려 우리를 징계하셨습니다. 참으로 나는 지금 우리 열두 지파 모두가 한 줄의 속박으로 묶여 있음을 압니다. 이는 우리가 한 아버지에게서 태어났기 때문입니다.


    그러므로 나는 죽기 전에 이 편지의 말들을 여러분에게 미리 남기기를 더욱 조심하였습니다. 이것은 여러분에게 닥친 악에 대하여 여러분이 위로를 받고, 또 여러분의 형제들에게 닥친 악에 대하여 슬퍼하며, 또한 여러분에게 포로됨이 선고된 그분의 판결을 의롭다고 선포하게 하려는 것입니다. 여러분이 겪은 것은 여러분이 행한 것에 비해 지나치지 않으니, 이후의 때에 여러분이 조상들에게 합당한 자들로 드러나게 하려는 것입니다.”[a]'
  philosophy: optimal-equivalence
lexical_decisions:
