  - 통곡하다
  lexicon: Syriac source sense; POB English audit trail
  rationale: 시온을 대상으로 한 부름은 단순한 감정표현보다 애도의 의미가 있지만, 한국어에서는 ‘슬퍼하다’가 가장 자연스럽게 그 정서를 유지합니다.
