- source_word: ܬܘܒܠܘ / mourn
  english_pob_choice: mourn
  chosen_korean: 슬퍼하다
  alternatives_korean:
  - 애도하다
  - 통곡하다
  lexicon: Syriac source sense; POB English audit trail
  rationale: 시온을 대상으로 한 부름은 단순한 감정표현보다 애도의 의미가 있지만, 한국어에서는 ‘슬퍼하다’가 가장 자연스럽게 그 정서를 유지합니다.
- source_word: ܬܐܢܚܘܢ / sigh
  english_pob_choice: sigh
  chosen_korean: 탄식하다
  alternatives_korean:
  - 한숨짓다
  - 신음하다
  lexicon: Syriac source sense; POB English audit trail
  rationale: ‘탄식하다’는 고통과 비탄이 섞인 호소를 잘 담아, 예루살렘을 향한 예언적 슬픔의 어조를 살립니다.
- source_word: ܨܗܝܘܢ
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
