  rationale: 지명은 관용적으로 ‘시온’으로 옮기는 것이 가장 읽기 쉽고, 한국 성경 독자에게도 즉시 인식됩니다.
- source_word: ܐܘܪܫܠܡ
  english_pob_choice: Jerusalem
  chosen_korean: 예루살렘
