translation:
  language: ko
  text: 나는 대답하여 말했습니다. 「주님, 누가 주님의 선하심을 헤아릴 수 있습니까? 그것은 헤아릴 수 없습니다」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܒܬܐ / bonitati tuae
  english_pob_choice: your goodness
  chosen_korean: 주님의 선하심
  alternatives_korean:
  - 주님의 좋으심
  - 주님의 인자하심
  lexicon: Payne Smith
  rationale: 하나님의 속성을 가리키는 폭넓은 표현으로 ‘선하심’이 가장 자연스럽고, 단순한 친절보다 더 포괄적인 의미를 살립니다.
- source_word: ܡܬܬܚܡܐ / incomprehensibilis
  english_pob_choice: beyond comprehension
  chosen_korean: 헤아릴 수 없습니다
  alternatives_korean:
  - 이해할 수 없습니다
  - 측량할 수 없습니다
  lexicon: Payne Smith
  rationale: ‘헤아리다’는 인지·측정의 불가능성을 함께 담아, 신적 속성의 불가해함을 한국어로 압축해 전달합니다.
- source_word: ܐܢܬ / you (divine address)
  english_pob_choice: your
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 당신
  lexicon: Syriac source context
  rationale: 직접 호칭이므로 한국어 합쇼체 기도/응답 문맥에 맞게 ‘주님’으로 풀어 존칭을 유지했습니다.
theological_decisions:
- issue: 신적 선하심의 불가해성을 어떻게 표기할 것인가
  chosen_reading: 주님의 선하심은 헤아릴 수 없습니다
  alternative_readings:
  - 주님의 선하심은 이해할 수 없습니다
  - 주님의 선하심은 측량할 수 없습니다
  rationale: 본문은 단순한 이해 부족이 아니라 신적 선하심의 근본적 불가해함을 말하므로, 그 긴장을 가장 직접적으로 드러내는 표현을 택했습니다.
  doctrine_reference: 하나님의 속성은 인간의 인식으로 완전히 포착되지 않는다는 고전적 신론
