  to: 그리고 그는 나아가 그들의 무리를 멸망시켰습니다. 그 우두머리들의 수만 십팔만 오천 명이었고, 그들 각자에게도 그와 같은 수가 있었습니다.
  rationale: 주어는 시리아어의 남성 단수 3인칭에 따라 유지하고, ‘chiefs’의 의미를 중립적으로 옮겼습니다. 마지막 절은 각 우두머리에게 동일한 수가 있었다는 원문의 수량 관계가 드러나도록 수정했습니다.
