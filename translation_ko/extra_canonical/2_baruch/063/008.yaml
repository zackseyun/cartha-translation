revisions:
- from: 그 때에 내가 안에서는 그들의 몸을 불사르고 밖으로는 그들의 의복과 무기를 보존하였으니 이는 전능자의 더욱 큰 기사를 보이고 그의 이름이 온 땅에 전파되게 하려 함이니라.
  to: 그때에 나는 그들의 몸은 속에서는 태워 버렸으나, 그들의 의복과 무기는 겉으로는 보존하였습니다. 이는 전능하신 분의 더욱 큰 기적들이 보이게 하고 그분의 이름이 온 땅에서 불리게 하려는 것이었습니다.
  rationale: 내용상의 대조와 목적절을 보존하면서, 현대 표준어 합쇼체에 맞게 표현을 다듬었습니다. ‘전능하신 분’은 Mighty One의 신적 호칭을 유지하며, 기적의 복수와 이름이 말해진다는 의미를 명시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:57Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 ‘몸을 안에서 태우고’, 의복과 무기를 외적으로 보존한 목적이 더 큰 이적의 현시와 온 땅에서의 이름의 선포라는 핵심을 충실히 옮겼습니다. 다만 ‘밖으로는’은 원문의 외적 보존이라는 대조를 한국어에서 다소 부자연스럽게 만들며, wonders의 복수와 ‘spoken’의 직접적 의미를 더 분명히 반영할 수 있습니다.
  naturalness: ‘안에서는/밖으로는’의 병렬은 직역투이므로 ‘속에서는/겉으로는’으로 다듬는 것이 자연스럽습니다. 현대 합쇼체에 맞추어 문장 종결도 현대적인 존댓말 서술형으로 조정했습니다.
  terminology: ‘전능자’는 Mighty One을 가리키는 적절한 신적 호칭입니다. 다만 소유격 표현은 ‘전능하신 분의’가 현대 한국어에서 더 자연스럽습니다. ‘기사’는 현대어에서 드물고 복수형도 드러나지 않으므로 ‘기적들’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘밖으로는’과 ‘안에서는’의 표현
    rationale: 외적 보존이라는 뜻은 유지하지만 현대 한국어에서는 ‘속에서는 … 겉으로는’이 더 자연스럽고 대조가 분명합니다.
  - severity: low
    issue: ‘기사’의 단수 및 현대어성
    rationale: 영어 감사 번역의 ‘wonders’는 복수이며, ‘기사’는 현대 표준어에서 일상적이지 않습니다.
  - severity: low
    issue: ‘이름이 … 전파되게’
    rationale: spoken의 뜻을 더 직접적으로 살려 ‘온 땅에서 불리게’로 옮기는 것이 적절합니다.
  revised_text: 그때에 나는 그들의 몸은 속에서는 태워 버렸으나, 그들의 의복과 무기는 겉으로는 보존하였습니다. 이는 전능하신 분의 더욱 큰 기적들이 보이게 하고 그분의 이름이 온 땅에서 불리게 하려는 것이었습니다.
