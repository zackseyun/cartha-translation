  text: And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.
translation:
  language: ko
  text: 그때에 나는 그들의 몸은 속에서는 태워 버렸으나, 그들의 의복과 무기는 겉으로는 보존하였습니다. 이는 전능하신 분의 더욱 큰 기적들이 보이게 하고 그분의 이름이 온 땅에서 불리게 하려는 것이었습니다.
