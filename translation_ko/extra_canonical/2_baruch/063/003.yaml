- from: 히스기야 왕이 앗수르 왕의 계략 곧 와서 그를 붙잡고 그의 백성 남은 두 지파 반을 멸하고 심지어 시온을 멸망시키려는 꾀를 들었을 때에 히스기야가 그의 행한 일을 의지하고 그의 의를 바라며 전능하신 자와 대화하였더라.
  to: 히스기야 왕이 앗수르 왕이 와서 자기를 붙잡고, 남아 있던 두 지파 반인 그의 백성을 멸하며, 심지어 시온까지 전복하려 한다는 계획을 들었을 때, 히스기야는 자기의 행위를 신뢰하고 자기의 의에 소망을 두며 전능하신 분과 말씀을 나누었습니다.
  rationale: 원문의 사건 순서와 대상, 그리고 히스기야가 자신의 행위와 의에 둔 신뢰를 보존하면서, 지파와 백성의 관계를 명확히 하고 현대 합쇼체 문장으로 다듬었습니다. ‘전복하다’는 시온에 대한 위협을 ‘멸망시키다’보다 원문의 overthrow에 가깝게 유지합니다.
