  text: 히스기야 왕이 앗수르 왕이 와서 자기를 붙잡고, 남아 있던 두 지파 반인 그의 백성을 멸하며, 심지어 시온까지 전복하려 한다는 계획을 들었을 때, 히스기야는 자기의 행위를 신뢰하고 자기의 의에 소망을 두며 전능하신 분과 말씀을 나누었습니다.
