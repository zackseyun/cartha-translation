    rationale: The source/English wording coordinates Sennacherib's preparedness and his future self-exaltation; it does not explicitly state that the latter follows because of the former.
  - severity: medium
    issue: '"높아지겠고 높아지리라" repeats one Korean predicate for two source predicates.'
    rationale: This obscures the rhetorical twofold expression "exalted and lifted up" and is unnatural in contemporary formal Korean.
