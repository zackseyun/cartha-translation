  text: And the eighth bright waters that you saw—these are the integrity and uprightness of Hezekiah king of Judah, and the gracious favor that came upon him.
translation:
  language: ko
  text: 그리고 여덟 번째로 빛나는 물은 유다의 왕 히스기야의 온전함과 올바름, 그리고 그에게 임한 은혜로운 호의입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܘܗܪ̈ܐ
  english_pob_choice: bright waters
  chosen_korean: 빛나는 물
  alternatives_korean:
  - 빛의 물
  - 찬란한 물
  lexicon: Payne Smith
  rationale: 물-상징을 그대로 살리면서도 한국어에서 자연스럽고 간결하게 ‘bright’를 반영했습니다.
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ
  english_pob_choice: integrity and uprightness
  chosen_korean: 온전함과 올바름
  alternatives_korean:
  - 정직함과 올바름
  - 정결함과 올바름
  lexicon: Payne Smith
  rationale: 두 덕목의 병렬을 유지하되, 신앙·윤리적 총체성을 드러내는 ‘온전함’과 규범적 곧음인 ‘올바름’을 택했습니다.
- source_word: ܛܝܒܘܬܐ
  english_pob_choice: gracious favor
  chosen_korean: 은혜로운 호의
  alternatives_korean:
  - 은혜
  - 은총의 호의
  - 호의
  lexicon: Payne Smith
  rationale: 단순한 ‘호의’보다 시혜적이고 은혜로운 성격을 함께 드러내기 위해 ‘은혜로운 호의’로 옮겼습니다.
theological_decisions:
- issue: 히스기야의 상태와 그에게 임한 선물을 어떻게 구분할지
  chosen_reading: 히스기야의 내적·도덕적 성품(온전함과 올바름)과 그에게 임한 외적 은혜(은혜로운 호의)를 구분해 옮겼습니다.
  alternative_readings:
  - 두 표현을 하나로 합쳐 일반적 ‘선함’으로 처리하기
  - ‘은혜로운 호의’를 삭제하고 인격적 덕목만 남기기
  rationale: 본문은 히스기야의 의로운 성품과 그 위에 더해진 선물을 병렬로 제시하므로, 두 요소를 분리해 읽히도록 보존해야 합니다.
  doctrine_reference: 성품의 칭찬과 하나님의 호의가 구별되어 제시되는 본문 직독 원칙
