  source_fidelity: 초안은 산헤립과 그와 함께한 여러 민족, 그리고 ‘멸하다’의 반복을 대체로 보존합니다. 그러나 ‘분발하여’는 ‘격동되다/선동되다’라는 원문의 수동적·격앙된 뉘앙스를 충분히 반영하지 못합니다. 영어 감사본의 시간절 및 ‘그의 진노가 타올랐다’는 인과적 진행도 더 분명히 옮길 필요가 있습니다.
  naturalness: ‘멸하려고 분발하여 … 진노하여 멸하려 하였더니’는 같은 목적 표현과 ‘멸하다’가 과도하게 겹쳐 문장이 부자연스럽습니다. ‘격동되었고’ 및 ‘진노가 타올랐을 때에’로 옮기면 현대 표준 한국어의 문어적 합쇼체 성경 문맥에 자연스럽습니다.
  terminology: ‘산헤립’은 통용되는 한국어 성서식 인명 표기이며 유지할 수 있습니다. ‘여러 나라’보다 ‘여러 민족’이 영어의 multitude of the nations와 고대 집단 지칭에 좀 더 적절합니다. 신학 용어상 별도 조정은 필요하지 않습니다.
