  text: '1. And the eleventh black waters that you saw—these are the calamity that has now come upon Zion.[a]


    2. Or do you think there is no grief, even for the angels before the Mighty One, because Zion was handed over in this way, and because, look, the nations boast in their hearts, and the throngs before their idols say, “She who long trampled others is trampled down; she who brought others into subjection has herself been subjected”?


    3. Do you think the Most High rejoices in these things, or that his name is glorified by them?


    4. But what will his righteous judgment be?


    5. Yet after these things they will understand...[b]'
  footnotes:
  - marker: a
    text: The present Ceriani bucket overlaps the end of chapter 66. Chapter 67 proper begins on the following page; page 184 mainly preserves the close of the preceding bright-waters interpretation.
    reason: textual_variant
  - marker: b
    text: The control-backed wording for chapter 67 is secure through the opening denunciation, but the available witness in this bucket breaks off after 'they will understand.' The chapter should be checked against the next Kmosko control page before a verse-complete finalization.
    reason: textual_variant
translation:
  language: ko
  text: '1. 네가 본 열한째 검은 물들은 지금 시온에 닥친 재앙입니다.


    2. 아니면, 전능하신 분 앞에 있는 천사들에게는 슬픔이 없다고 생각합니까? 시온이 이런 식으로 넘겨졌기 때문이며, 보십시오, 민족들이 그들의 마음속에서 자랑하고, 그들의 우상들 앞에 있는 무리들이 “남을 짓밟던 자가 짓밟혔고, 남을 굴복시키던 자가 스스로 굴복당했습니다”라고 말하기 때문입니다.


    3. 지극히 높으신 분이 이런 일들을 기뻐하신다고 생각합니까, 또는 그의 이름이 이것들로 말미암아 영광을 받는다고 생각합니까?


    4. 그러나 그의 의로운 심판은 어떻겠습니까?


    5. 그러나 그 뒤에는 그들이 깨닫게 될 것입니다…[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  english_pob_choice: black waters
  chosen_korean: 검은 물들
  alternatives_korean:
  - 어두운 물들
  lexicon: Syriac control text + English POB audit trail
  rationale: 아포칼립스의 반복 표지를 살려 직역성이 높은 ‘검은 물들’을 택했고, ‘어두운’보다 색채 대비가 더 분명합니다.
- source_word: ܚܝܠܬܢܐ
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 능하신 분
  - 강하신 분
  lexicon: Payne Smith + POB context
  rationale: 주변 문맥에서 심판권을 지닌 신적 호칭이므로, 한국어에서는 존칭형의 신격 호칭으로 옮기되, 기존 교회어법의 관용을 지나치게 덧씌우지 않기 위해 ‘전능하신 분’을 택했습니다.
- source_word: ܬܪܥܝܬܐ
  english_pob_choice: hearts
  chosen_korean: 마음속
  alternatives_korean:
  - 생각 속
  - 마음
  lexicon: Payne Smith
  rationale: 민족들의 내부 자만을 가리키므로, 단순한 인지보다 내적 태도까지 담는 ‘마음속’을 사용했습니다.
- source_word: ܬܫܒܘܚܬܐ
  english_pob_choice: is glorified
  chosen_korean: 영광을 받는다고
  alternatives_korean:
  - 찬양을 받는다고
  - 영광을 얻는다고
  lexicon: Payne Smith
  rationale: 하나님의 이름이 이 사건으로 실제로 높임을 받는지 묻는 문맥이므로, 수동적 결과를 드러내는 ‘영광을 받다’로 옮겼습니다.
- source_word: ܡܫܬܥܒܕܐ / passive reversal imagery
  english_pob_choice: has herself been subjected
  chosen_korean: 스스로 굴복당했습니다
  alternatives_korean:
  - 스스로 종속되었습니다
  - 자기 자신이 복종당했습니다
  lexicon: Payne Smith
  rationale: 지배-피지배의 역전된 조롱을 살리기 위해 능동적 자업자득 뉘앙스를 주는 ‘스스로 굴복당했습니다’를 택했습니다.
theological_decisions:
- issue: 천사들의 슬픔
  chosen_reading: 천사들도 시온의 넘겨짐 앞에서 슬퍼하는 존재로 제시합니다.
  alternative_readings:
  - 과장된 수사일 뿐입니다
  - 슬픔은 인간에게만 해당합니다
  rationale: 본문이 ‘전능하신 분 앞에 있는 천사들’을 직접 거론하므로, 하늘 존재의 애통을 약화하지 않고 보존했습니다.
  doctrine_reference: 천상 존재의 공감적 애통을 인정하는 묵시문학적 표현
- issue: 하나님의 이름과 시온의 수치
  chosen_reading: 시온의 수치는 하나님의 이름이 자동으로 영광을 받는 사건으로 제시되지 않으며, 의로운 심판의 문제를 남깁니다.
  alternative_readings:
  - 시온의 سقوط 자체가 하나님께 영광입니다
  - 민족들의 승리가 하나님의 최종 승인을 뜻합니다
  rationale: 본문은 민족들의 자랑을 비판하면서 ‘그의 의로운 심판’을 별도로 묻기 때문에, 수치와 영광의 긴장을 보존했습니다.
  doctrine_reference: 신적 의와 심판의 긴장
