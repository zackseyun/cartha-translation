base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/005.yaml
  text: '1 And I said[a], “And I said, “So then, I have hoped in vain, and in vain was Zion built. For if those who hate us have taken possession of her, what will you do for your great name?””


    2 And the Lord said to me, “My name and my glory endure forever; but my judgment keeps its own right in its time.


    3 And you will see with your eyes that it is not the enemies who overthrow Zion, nor burn Jerusalem, but that they are serving judgment for a time.


    4 But you, go and do whatever I have told you.”


    5 And I went and took Jeremiah and Addo and Seraiah and Jabish and Gedaliah and all the honorable men of the people[b], and I brought them to the valley of Kidron, and I told them everything that had been said to me.


    6 And they lifted up their voices, and they all wept[e][d][c]. And we sat there and fasted until evening.'
  footnotes:
  - marker: a
    text: Verse 1 is the least secure part of this chapter in the current Ceriani bucket. The page edge is textually rough, so the English is intentionally cautious; the closing question, “what will you do for your great name?”, is supported by the Kmosko control witness.
    reason: textual_variant
  - marker: b
    text: “Serving judgment for a time” means the invaders act as temporary instruments of God's sentence, not as final masters of Zion.
    reason: cross_reference
  - marker: c
    text: The valley name appears in older scholarship as Cedron; Kidron is the conventional English form.
    reason: cultural_note
  - marker: d
    text: Or 'But now, after you built and established her, I had hoped that I would again live in Zion, that her renown would be heard among the nations, and that my soul might rejoice and be gladdened. But now those whom you loved and on whom you had compassion have been given over to the place of their humiliation, to be mocked before them. And what will you do for your great name?'.
    reason: previous_rendering
  - marker: e
    text: Or 'nor those who burn Jerusalem'.
    reason: previous_rendering
translation:
  language: ko
  text: '1 나는 말했습니다. “나는 말했습니다. ‘그러므로 저는 헛되이 바랐고, 시온은 헛되이 세워졌습니다. 우리를 미워하는 자들이 그녀를 차지하였다면, 당신은 당신의 큰 이름을 위해 무엇을 하시겠습니까?’”


    2 주께서 내게 말씀하셨습니다. “내 이름과 내 영광은 영원히 지속된다. 그러나 내 심판은 그 때에 그 자신의 권리를 지닌다.


    3 네가 눈으로 보게 될 것이다. 시온을 무너뜨리는 자들도 아니고 예루살렘을 불태우는 자들도 아니며, 그들이 잠시 심판을 섬기고 있을 뿐이라는 것을.


    4 그러나 너는 가서 내가 네게 말한 것을 그대로 하여라.”


    5 그래서 나는 나가서 예레미야와 아도와 스라야와 야비쉬와 그달리야와 백성 가운데 존귀한 모든 사람을 데리고, 그들을 기드론 골짜기로 데려가서 내게 말해진 모든 것을 그들에게 말했습니다.


    6 그러자 그들은 소리를 높여 모두 울었습니다. 그리고 우리는 해 질 때까지 거기서 금식했습니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܫܬܠܡܐ / ܡܬܬܢܫܐ
  english_pob_choice: given over / be forgotten
  chosen_korean: “헛되이 세워졌습니다” / “무너뜨리는 자들”
  alternatives_korean:
  - “넘겨졌습니다” / “잊히게 됩니다”
  - “전달됩니다” / “버려집니다”
  lexicon: Payne Smith
  rationale: 문맥상 5장은 성읍의 건축 완성 여부보다 시온이 침략과 심판에 넘겨지는 비극을 말하므로, 한국어는 1절의 ‘헛되이 세워졌습니다’와 3절의 ‘무너뜨리는 자들’로 그 비극성과 동사를 살렸습니다.
- source_word: ܙܕܩܗ
  english_pob_choice: its own right
  chosen_korean: “그 자신의 권리”
  alternatives_korean:
  - “그의 공의”
  - “그의 의로움”
  lexicon: Payne Smith
  rationale: 영문 POB가 법정적 뉘앙스의 own right를 살린 것처럼, 여기서는 추상적 ‘의’보다 심판이 자기 때에 속한 정당한 권리를 가진다는 뜻을 드러내기 위해 ‘권리’로 옮겼습니다.
- source_word: ܡ̇ܫܡܫܝܢ ܒܙܒܢܐ
  english_pob_choice: serving judgment for a time
  chosen_korean: “잠시 심판을 섬기고”
  alternatives_korean:
  - “한때 심판에 봉사하고”
  - “일시적으로 심판의 도구가 되고”
  lexicon: Payne Smith
  rationale: 침략자들의 행위가 최종 주권이 아니라 하나님의 심판에 대한 한시적 봉사라는 점을 살리기 위해, ‘섬기다’를 유지하되 ‘잠시’로 시간성을 분명히 했습니다.
- source_word: ܩܕܪܘܢ
  english_pob_choice: Kidron
  chosen_korean: “기드론 골짜기”
  alternatives_korean:
  - “세드론 골짜기”
  - “기드론”
  lexicon: proper name
  rationale: 한국어 성경과 지명 관용에 맞는 표준 표기인 ‘기드론’을 쓰고, 지형명은 원문 의미를 드러내기 위해 ‘골짜기’를 덧붙였습니다.
theological_decisions:
- issue: 예루살렘 파괴의 주체와 원인
  chosen_reading: 침략자들은 시온과 예루살렘을 실제로 무너뜨리고 불태우지만, 그 행위는 하나님의 심판을 잠시 섬기는 도구적 사건입니다.
  alternative_readings:
  - 침략자들이 독자적으로 성읍을 멸망시킨다
  - 실제 파괴자는 없고 오직 상징적 표현일 뿐이다
  rationale: 3절의 대조는 역사적 행위와 신적 주권을 함께 유지합니다. 그래서 한국어도 ‘무너뜨리는 자들’과 ‘잠시 심판을 섬기고’의 긴장을 보존했습니다.
  doctrine_reference: 섭리와 심판의 도구성
- issue: 1절의 중첩된 인용과 탄식 어조
  chosen_reading: 원문의 반복된 ‘나는 말했습니다’와 질문형 탄식을 그대로 두어, 절망의 반복과 수사적 격정을 살렸습니다.
  alternative_readings:
  - 중복을 정리해 매끄럽게 만든다
  - 질문을 평서문으로 완화한다
  rationale: 본문은 문학적으로 거친 탄식 구조를 갖고 있으므로, 매끄럽게 다듬기보다 반복을 유지하는 편이 원문 효과에 더 가깝습니다.
  doctrine_reference: 본문의 수사 보존
