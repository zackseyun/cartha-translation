  text: “그 성벽을 헐어 그 기초까지 무너뜨리십시오. 대적들이 자랑하며 ‘우리가 친히 시온의 성벽을 헐었고, 능하신 하나님의 거처를 불살랐다’라고 말하지 않도록 하십시오.”
