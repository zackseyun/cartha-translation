  timestamp: '2026-07-13T20:25:17Z'
review_pass:
  verdict: revise
  source_fidelity: 시리아어 본문과 직전의 원어 검토 기록에 따르면 명령의 목적어는 단수 ‘그 성벽’이며, 도입부의 ‘이제’는 이 절의 본문에 확실히 근거하지 않습니다. 또한 인용문에서 ‘시온 성’은 ‘시온의 성벽’이어야 합니다.
  naturalness: 초안의 ‘두렵건대’와 ‘하리로다’는 현대 표준어 합쇼체에 비해 고어적입니다. 목적절을 ‘~하지 않도록’으로, 인용문을 현대적인 과거 서술로 옮기는 편이 자연스럽습니다.
  terminology: ‘전능하신 하나님’은 영어 audit trail의 ‘mighty God’보다 강한 특정 신학 용어가 될 수 있으므로, 원문의 힘/능력을 보존하는 ‘능하신 하나님’을 사용했습니다. ‘처소’는 가능하지만 ‘거처’가 현대어에서 자연스럽습니다.
