    rationale: 현재 주어진 절 범위와 최신 원문 검토 기록은 절 첫머리의 시간·담화 표지를 확정적으로 뒷받침하지 않습니다.
  - severity: high
    issue: 인용문의 ‘시온 성’이 원문의 ‘시온의 성벽’을 다른 대상으로 바꿉니다.
    rationale: 시리아어와 영어 audit trail 모두 적들이 헐었다고 자랑하는 대상은 시온의 성벽입니다.
  - severity: medium
    issue: ‘전능하신’은 ‘mighty’보다 의미를 강화할 수 있고, 문체가 고어적입니다.
    rationale: 원문의 모호하지 않은 ‘능력 있는/강한’ 수식을 과도하게 교리화하지 않고 현대 합쇼체로 옮겨야 합니다.
