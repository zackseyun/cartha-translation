revisions:
- from: “이제 담을 헐고 그 기초까지 무너뜨리라 두렵건대 대적들이 자랑하여 이르기를 우리가 시온 성을 헐었고 전능하신 하나님의 처소를 불살랐다 하리로다.”
  to: “그 성벽을 헐어 그 기초까지 무너뜨리십시오. 대적들이 자랑하며 ‘우리가 친히 시온의 성벽을 헐었고, 능하신 하나님의 거처를 불살랐다’라고 말하지 않도록 하십시오.”
  rationale: 단수 성벽을 유지하고, 근거가 불확실한 도입어를 삭제했습니다. 시온의 성벽과 하나님의 거처라는 대상을 분명히 했으며, 현대 표준어 합쇼체로 다듬었습니다.
