review_pass:
  verdict: revise
  source_fidelity: 핵심 목록과 땅을 향한 명령, 예루살렘의 일시적 넘겨짐 및 장래 회복을 대체로 충실히 옮겼습니다. 다만 ܐܬܐܡܪ(‘말해질 때까지’)의 수동적·비인칭적 표현은 보존하는 것이 좋으며, ‘나그네들’은 여기서 ‘이방인들/낯선 자들’이라는 뜻에 맞지 않습니다.
  naturalness: 현대 격식체에 맞추어 인용문 안의 명령을 ‘-십시오’로 통일하고, ‘되돌려 줄 수 있게 하라’처럼 한국어에서 부자연스러운 명령 구조를 직접적인 조건절로 고쳤습니다. ‘그것들 위에 자랑하다’도 자연스러운 ‘그것들을 두고 자랑하다’로 다듬었습니다.
  terminology: ‘지성소’, ‘휘장들’, ‘에봇’, ‘속죄소’, ‘두 돌판’, ‘향로’는 성소 기물 목록의 문맥에서 적절합니다. ‘귀한 돌들’은 ‘보석들’보다 원문의 ‘값진 돌’ 표현을 덜 해석적으로 보존하므로 유지했습니다.
  issues:
  - severity: medium
    issue: 인용문 안의 명령형이 목표 합쇼체와 일치하지 않고, ‘되돌려 줄 수 있게 하라’가 부자연스럽습니다.
    rationale: 표준 현대 합쇼체에서는 ‘들으십시오/받아 보관하십시오/지키십시오/돌려주십시오’가 일관됩니다. 원문의 ‘명령을 받으면 돌려주도록’이라는 목적·조건 관계도 직접적으로 표현할 수 있습니다.
  - severity: medium
    issue: ‘나그네들이 그것들 위에 자랑하지 못하게’는 어휘와 결합이 부정확합니다.
    rationale: 문맥의 ‘strangers’는 여행객인 ‘나그네’가 아니라 성소 기물을 두고 자랑할 수 있는 외부자, 곧 ‘이방인들’입니다. 한국어에서는 ‘그것들을 두고 자랑하다’가 자연스럽습니다.
  - severity: low
    issue: 본문 끝의 [a][b] 앵커에 대응하는 각주가 제공되지 않았습니다.
    rationale: 검증 오류 목록은 비어 있으나, 독자가 확인할 수 없는 각주 앵커는 삭제하는 편이 안전합니다. 본문 의미를 바꾸지 않습니다.
