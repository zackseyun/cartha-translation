  yaml_path: translation/extra_canonical/2_baruch/008/001.yaml
  text: And I saw that he went into the Holy of Holies, and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."
translation:
  language: ko
  text: 나는 그가 지성소로 들어가 այնտեղ서 휘장들과 에봇과 제단과 속죄소와 두 돌판과 제사장들의 거룩한 옷과 향로와 마흔여덟 개의 귀한 돌들과 장막의 모든 거룩한 기구들을 가져가는 것을 보았습니다. 그리고 그는 큰 소리로 땅에게 말했습니다. 「땅아, 땅아, 땅아, 능하신 하나님의 말씀을 들으십시오. 내가 네게 맡기는 것을 받아 보관하고, 끝날 때까지 그것들을 지키십시오. 명령을 받으면 그것들을 돌려주십시오. 이방인들이 그것들을 두고 자랑하지 못하게 하려는 것입니다. 예루살렘도 한동안 넘겨질 때가 가까이 왔기 때문입니다. 그러다가 그것이 다시 영원히 회복될 것이라고 말해질 때까지입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  english_pob_choice: the Holy of Holies
  chosen_korean: 지성소
  alternatives_korean:
  - 지성소
  - 가장 거룩한 곳
  lexicon: Payne Smith
  rationale: 시리아어의 정형화된 성소 최상급 표현에 대응하는 한국어 성경어로는 ‘지성소’가 가장 직접적이고, 목록 전체의 제의적 분위기도 가장 잘 보존합니다.
- source_word: ܦܪ̈ܘܟܬܐ
  english_pob_choice: the veils
  chosen_korean: 휘장들
  alternatives_korean:
  - 휘장들
  - 장막들
  - 커튼들
  lexicon: Payne Smith
  rationale: 성소 내부의 천막 장식물을 가리키므로 ‘휘장들’이 제의적·공간적 뉘앙스를 가장 잘 살립니다.
- source_word: ܚܘܣܝܐ
  english_pob_choice: the mercy seat
  chosen_korean: 속죄소
  alternatives_korean:
  - 속죄소
  - 은혜의 자리
  - 긍휼의 덮개
  lexicon: Payne Smith
  rationale: 문맥상 언약궤 위의 제의적 덮개를 가리키는 표현이므로, 한국어 성경에서 널리 쓰이는 ‘속죄소’를 택했습니다.
- source_word: ܘܬܪ̈ܬܝܢ ܟܘܪ̈ܣܘ
  english_pob_choice: the two tables
  chosen_korean: 두 돌판
  alternatives_korean:
  - 두 돌판
  - 두 판
  - 두 석판
  lexicon: Smith Syriac Dictionary
  rationale: 시리아어 전승과 목록의 성격상 언약의 돌판을 뜻하는 것으로 이해하는 것이 자연스러워 ‘두 돌판’으로 옮겼습니다.
- source_word: ܦܝܪܡܐ
  english_pob_choice: the censer
  chosen_korean: 향로
  alternatives_korean:
  - 향로
  - 분향기
  - 향합
  lexicon: Payne Smith
  rationale: 제사장 기구 목록 안에서의 일반적 의미를 살려 ‘향로’로 옮겼습니다.
theological_decisions:
- issue: ‘Earth, earth, earth’의 반복 호칭
  chosen_reading: 반복되는 호격을 그대로 보존하여 땅을 인격적으로 부르는 장면으로 제시했습니다.
  alternative_readings:
  - ‘땅, 땅, 땅’으로 단순화
  - ‘땅이여, 땅이여, 땅이여’로 완화
  rationale: 원문의 수사적 긴장과 공적 선언의 효과를 살리기 위해 반복을 유지하는 편이 적절합니다.
  doctrine_reference: 서사적 수사 보존
- issue: 예루살렘의 ‘넘겨짐’과 ‘회복’
  chosen_reading: 예루살렘이 한동안 넘겨지지만 마지막에는 영원히 회복된다고 옮겼습니다.
  alternative_readings:
  - 완전한 파괴 예언으로 읽기
  - 단순한 귀환 예고로 축소
  rationale: 문맥은 심판과 보존을 함께 말하므로, 일시적 이양과 최종 회복의 긴장을 그대로 유지해야 합니다.
  doctrine_reference: 포로/회복 모티프
