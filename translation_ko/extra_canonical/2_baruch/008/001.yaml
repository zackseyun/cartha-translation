- from: 그가 지성소로 들어가서 거기서 휘장들과 에봇과 제단과 속죄소와 두 돌판과 제사장들의 거룩한 옷과 향로와 마흔여덟 개의 귀한 돌들과 장막의 모든 거룩한 기구들을 가져갔습니다. 그리고 그는 큰 소리로 땅에게 말했습니다. 「땅아, 땅아, 땅아, 능하신 하나님의 말씀을 들으라. 내가 네게 맡기는 것을 받아 보관하고, 끝날 때까지 그것들을 지키라. 그렇게 해서 네가 명령받을 때 그것들을 되돌려 줄 수 있게 하라. 나그네들이 그것들 위에 자랑하지 못하게 하려는 것이다. 예루살렘도 한동안 넘겨질 때가 가까이 왔기 때문이다. 그러다가 그것이 다시 영원히 회복된다고 말해질 때까지 그렇다.」[a][b]
  to: 나는 그가 지성소로 들어가 այնտեղ서 휘장들과 에봇과 제단과 속죄소와 두 돌판과 제사장들의 거룩한 옷과 향로와 마흔여덟 개의 귀한 돌들과 장막의 모든 거룩한 기구들을 가져가는 것을 보았습니다. 그리고 그는 큰 소리로 땅에게 말했습니다. 「땅아, 땅아, 땅아, 능하신 하나님의 말씀을 들으십시오. 내가 네게 맡기는 것을 받아 보관하고, 끝날 때까지 그것들을 지키십시오. 명령을 받으면 그것들을 돌려주십시오. 이방인들이 그것들을 두고 자랑하지 못하게 하려는 것입니다. 예루살렘도 한동안 넘겨질 때가 가까이 왔기 때문입니다. 그러다가 그것이 다시 영원히 회복될 것이라고 말해질 때까지입니다.」
