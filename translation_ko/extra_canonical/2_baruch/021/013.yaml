  source_fidelity: 시리아어는 과거·현재·미래의 ‘것들’을 대조하는 세 절을 이루며, 가운데 절의 2인칭 단수 ‘당신 앞에’와 ‘당신의 것’이 모두 보존되어야 합니다. 초안의 ‘너희’는 단수 대상을 복수로 바꾸고, ‘것이 되고’는 현재 서술을 변화의 의미로 바꿉니다.
