  yaml_path: translation/extra_canonical/2_baruch/021/001.yaml
  text: And I went away from there and sat in the valley of Kidron, in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.
translation:
  language: ko
  text: 그리고 나는 거기에서 떠나 기드론 골짜기에 있는 땅의 동굴에 앉았습니다. 나는 거기에서 내 영혼을 성별하였습니다. 나는 빵을 먹지 않았지만 배고프지 않았고, 물을 마시지 않았지만 목마르지 않았습니다. 그리고 나는 그분께서 내게 명령하신 대로 일곱째 날까지 거기 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܙܠܬ ܡܢ ܬܡܢ
  english_pob_choice: And I went away from there
  chosen_korean: 나는 거기에서 떠나
  alternatives_korean:
  - 나는 거기서 갔습니다
  - 그리고 나는 거기에서 물러났습니다
  lexicon: Payne Smith
  rationale: 장소 이탈의 동작을 자연스럽게 살리되, 서술 흐름을 무리 없이 이어 주는 표현으로 옮겼습니다.
- source_word: ܘܝܬܒܬ ܒܓܘܒܐ ܕܩܝܕܪܘܢ
  english_pob_choice: sat in the valley of Kidron
  chosen_korean: 키드론 골짜기에 앉았습니다
  alternatives_korean:
  - 키드론 시내에 앉았습니다
  - 키드론 골짜기 속에 앉았습니다
  lexicon: Payne Smith
  rationale: POB의 revision에 따라 지형을 ‘골짜기’로 옮겼고, Syriac의 장소성은 유지하되 한국어에서 자연스럽게 표현했습니다.
- source_word: ܒܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  english_pob_choice: in a cave of the earth
  chosen_korean: 땅의 동굴에
  alternatives_korean:
  - 땅속 동굴에
  - 지면의 동굴에
  lexicon: Payne Smith
  rationale: 이중 이미지인 ‘of the earth’를 살리면서도 한국어에서는 직역의 어색함을 줄이기 위해 ‘땅의 동굴’로 옮겼습니다.
- source_word: ܘܩܕܫܬ ܠܢܦܫܝ
  english_pob_choice: I sanctified my soul there
  chosen_korean: 내 혼을 거룩하게 하였습니다
  alternatives_korean:
  - 내 영혼을 성결하게 하였습니다
  - 내 혼을 정결하게 하였습니다
  lexicon: Payne Smith
  rationale: Syriac의 ‘혼’(soul)을 그대로 살리고, 금식·기도의 자기 헌신을 나타내는 동사를 ‘거룩하게 하다’로 옮겼습니다.
- source_word: ܠܚܡܐ ... ܡ̈ܝܐ
  english_pob_choice: bread ... water
  chosen_korean: 빵 ... 물
  alternatives_korean:
  - 떡 ... 물
  - 양식 ... 물
  lexicon: Payne Smith
  rationale: 평이한 음식-물 대조를 현대 한국어에서 직접적으로 전달하는 표현을 택했습니다.
theological_decisions:
- issue: 자기 거룩하게 함의 의미
  chosen_reading: ‘내 혼을 거룩하게 하였습니다’로 번역해, 금식과 고립을 통한 자기 성별을 드러내되 과도한 내면화나 도덕화는 피했습니다.
  alternative_readings:
  - 내 영혼을 정결하게 하였습니다
  - 내 자신을 성결하게 하였습니다
  rationale: 문맥은 회개라기보다 예언자적 금식과 준비의 행위에 가깝기 때문에, 영적 자기 수련의 뉘앙스를 보존하는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
