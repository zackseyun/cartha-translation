  source_fidelity: 초안의 ‘그분’은 문맥상 땅과 티끌에서 창조된 인간을 가리키는 남성 단수 대명사를 불필요하게 존칭화하여 지시 대상을 흐립니다. 또한 ‘흙과 흙’은 원문의 ‘땅과 티끌’의 병렬을 소실합니다. ‘지나가는 것’은 단순 통과의 뜻으로도 읽히므로 소멸·덧없음의 문맥을 드러내는 표현이 필요합니다.
  naturalness: ‘땅과 티끌에서 창조되었으므로’ 및 ‘사라져 가는 모든 것은 거기서 제 자리로 떠나갑니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘거기서’는 앞의 땅/티끌을 함께 받으면서 원문의 지시 범위를 보존합니다.
  terminology: ‘땅’, ‘티끌’, ‘창조되다’는 창세기적 인간 기원 어휘와도 조응하며 특정 교파적 해석을 더하지 않습니다. ‘그’는 신적 존칭을 함축하는 ‘그분’보다 원문의 인간 지시를 충실히 반영합니다.
