revisions:
- from: '큰 구름이 무엇인지 들으십시오. 당신이 바다에서 올라와 이 땅을 덮는 것을 보았던 그것은, 그의 권능이 창조를 만들기로 계획할 때 만든 세상입니다. 그리고 그 앞에서 말씀이 나가자, 세상의 시작이 매우 작게 드러났고, 그것은 자기에게 예정된 바에 따라 질서 있게 세워졌습니다.


    또 당신이 구름에서 내려오는 검은 첫 물을 보았는데, 이것은 죄, 곧 첫 آدم이 범한 그 transgression입니다. 그가 죄를 지었을 때, 죽음이 때 이르게 움직이기 시작했고, 애통이 알려졌으며, 고통들이 예비되었고, 괴로움이 생겨났고, 수고가 끝났으며, 위대함이 낮아지기 시작했습니다.


    그리고 마지막 날에 대해서는, 형체로 나타나고 모습을 취한 그 날이 보였으니, 때가 조사될 것이고 인간의 분량이 측정될 것이며, 그 힘이 시험될 것임을 아십시오. 그러므로 아담이, 하나님에게서 장차 있을 어떤 것을 들었을 때, 죽은 자들의 해방에 대해 주어진 것과 하나님께서 그에게 명하신 것을 생각하며 계속 그것을 숙고했고, 다섯 생각을 지어냈습니다. 그는 스스로 책임을 지게 되었고, 그를 통해 천사들도 역시 책임을 지게 되었습니다. 또 그가 창조되었을 때 그에게 하나의 환상이 보였으니, 그것은 쓰디쓴 삶과 불과 함께한 요소들이었습니다. 그래서 하나님은 창조된 자들의 형상에 따라 이것들을 미리 모아 두셨습니다.[a]'
  to: '큰 구름이 무엇을 뜻하는지 들으십시오. 당신이 바다에서 올라와 이 땅을 덮는 것을 본 그 큰 구름은, 그분의 권능이 창조를 이루기로 계획하셨을 때 만드신 세상입니다. 그리고 그분 앞에서 말씀이 나가자, 세상의 시작이 아주 작게 드러났고, 마땅히 될 바에 따라 갖추어졌습니다.


    또 당신이 구름에서 내려오는 첫 번째 검은 물들을 보았는데, 이것은 첫 아담이 범한 첫 죄, 곧 범법입니다. 그가 죄를 지었을 때, 죽음이 제때가 되기 전에 일어났고, 애통이 알려졌으며, 고통들이 예비되었고, 괴로움이 생겨났고, 수고가 완성되었으며, 위대함이 낮아지기 시작했습니다.


    또 형상으로 나타나 모습을 취한 것으로 보인 마지막 날에 관해서는, 때가 조사되고 인간의 분량이 측정되며 그 힘이 시험될 것임을 아십시오. 그러므로 아담은 하나님에게서 장차 있을 일의 일부를 들었을 때, 죽은 이들의 해방이 주어졌다는 것과 하나님께서 그에게 명하신 것을 숙고하고, 계속 생각하여 다섯 가지 생각을 품었습니다.[a] 그는 스스로 책임을 지게 되었고, 그로 말미암아 천사들도 책임을 지게 되었습니다. 또 그가 창조되었을 때, 쓰라린 삶과 불과 함께 있는 원소들에 관한 환상이 그에게 보였습니다. 이와 같이 하나님께서는 그것들이 창조된 모습대로 미리 모으셨습니다.'
  rationale: 미번역 문자·영어를 모두 한국어로 바로잡고, 시리아어의 복수형 ‘검은 물들’, ‘해방이 주어짐’의 구문 관계, 그리고 첫 범죄의 강조를 반영했습니다. 마지막 문장의 대상과 ‘창조된 모습’의 관계는 본문 자체가 난해하므로, 해석을 덧붙이지 않은 채 비교적 직역으로 남겼습니다. 문체는 현대 표준어 합쇼체로 통일했습니다.
