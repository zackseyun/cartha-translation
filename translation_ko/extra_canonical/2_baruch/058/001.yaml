base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/058/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and covering this earth: it is the world which his power made when he planned to make creation. And when the word went out from before him, the beginning of the world stood forth, very small, and it was set in order according to what it was intended to become.


    And the first black waters that you saw descending from the cloud—this is the sin, the transgression that the first Adam committed. For when he sinned, death was stirred up before its time, and mourning was made known, and pains were prepared, and anguish was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in the form that had taken likeness, know that the time will be searched out, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, when he heard from God something of what was to be, reflected on the release of the dead that had been given, and on what had been commanded him by God, he kept considering it and devised five thoughts. For he made himself liable, and through him the angels also were made liable. And at the time when he was created, a vision was shown to him: the bitter life, and the elements with fire. Thus God gathered these beforehand in the likeness of those who were created.'
  footnotes:
  - marker: a
    text: Or 'kept considering it and devised five thoughts'.
    reason: previous_rendering
translation:
  language: ko
  text: '큰 구름이 무엇인지 들으십시오. 당신이 바다에서 올라와 이 땅을 덮는 것을 보았던 그것은, 그의 권능이 창조를 만들기로 계획할 때 만든 세상입니다. 그리고 그 앞에서 말씀이 나가자, 세상의 시작이 매우 작게 드러났고, 그것은 자기에게 예정된 바에 따라 질서 있게 세워졌습니다.


    또 당신이 구름에서 내려오는 검은 첫 물을 보았는데, 이것은 죄, 곧 첫 آدم이 범한 그 transgression입니다. 그가 죄를 지었을 때, 죽음이 때 이르게 움직이기 시작했고, 애통이 알려졌으며, 고통들이 예비되었고, 괴로움이 생겨났고, 수고가 끝났으며, 위대함이 낮아지기 시작했습니다.


    그리고 마지막 날에 대해서는, 형체로 나타나고 모습을 취한 그 날이 보였으니, 때가 조사될 것이고 인간의 분량이 측정될 것이며, 그 힘이 시험될 것임을 아십시오. 그러므로 아담이, 하나님에게서 장차 있을 어떤 것을 들었을 때, 죽은 자들의 해방에 대해 주어진 것과 하나님께서 그에게 명하신 것을 생각하며 계속 그것을 숙고했고, 다섯 생각을 지어냈습니다. 그는 스스로 책임을 지게 되었고, 그를 통해 천사들도 역시 책임을 지게 되었습니다. 또 그가 창조되었을 때 그에게 하나의 환상이 보였으니, 그것은 쓰디쓴 삶과 불과 함께한 요소들이었습니다. 그래서 하나님은 창조된 자들의 형상에 따라 이것들을 미리 모아 두셨습니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  english_pob_choice: the beginning of the world
  chosen_korean: 세상의 시작
  alternatives_korean:
  - 세상의 기원
  - 세상의 창건
  - 세상의 토대
  lexicon: Payne Smith
  rationale: 세계가 처음 드러나는 창조적 ‘시작’의 뜻이므로, 자연스러운 한국어이면서도 기원론적 뉘앙스를 살리는 ‘세상의 시작’으로 옮겼습니다.
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  english_pob_choice: the sin, the transgression
  chosen_korean: 죄, 곧 ... 범한 그 transgression
  alternatives_korean:
  - 죄, 곧 ... 범한 그 허물
  - 죄, 곧 ... 범한 그 과오
  - 죄, 곧 ... 범한 그 위반
  lexicon: Payne Smith
  rationale: 본문이 아담의 행위를 단순한 죄보다 경계 침범의 성격이 있는 사건으로 병치하므로, 뒤에 음역어를 두어 해석을 과도하게 평탄화하지 않았습니다.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  english_pob_choice: death was stirred up
  chosen_korean: 죽음이 때 이르게 움직이기 시작했고
  alternatives_korean:
  - 죽음이 stirred up 되었습니다
  - 죽음이 깨어났습니다
  - 죽음이 작동하기 시작했습니다
  lexicon: Payne Smith
  rationale: ‘stirred up’의 활성화 의미를 살리되, 한국어에서 생경하지 않게 ‘때 이르게 움직이기 시작했다’로 옮겨 죽음이 사건으로 촉발되었다는 점을 드러냈습니다.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  english_pob_choice: greatness began to be brought low
  chosen_korean: 위대함이 낮아지기 시작했습니다
  alternatives_korean:
  - 위엄이 낮아지기 시작했습니다
  - 큰됨이 낮아지기 시작했습니다
  - 위대함이 겸손해지기 시작했습니다
  lexicon: Payne Smith
  rationale: 하강·저하의 이미지를 보존하면서, 인간성의 축소라는 문맥에 맞는 ‘낮아지다’를 선택했습니다.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  english_pob_choice: the measure of humanity
  chosen_korean: 인간의 분량
  alternatives_korean:
  - 인간의 척도
  - 인류의 기준
  - 인간성의 분량
  lexicon: Payne Smith
  rationale: 시간·힘과 병렬되는 평가 항목이므로, 심판적 뉘앙스가 살아 있는 ‘분량’이 가장 적절했습니다.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  english_pob_choice: the release of the dead
  chosen_korean: 죽은 자들의 해방
  alternatives_korean:
  - 죽은 자들의 풀림
  - 죽은 자들의 놓임
  - 죽은 자들의 석방
  lexicon: Payne Smith
  rationale: 원문이 난해하므로 POB의 영어를 따라 지나친 신학적 단정 없이 비교적 직역에 가까운 표현을 유지했습니다.
theological_decisions:
- issue: 아담의 죄와 죽음의 개시
  chosen_reading: 아담의 범죄가 죽음, 애통, 고통, 수고, 위대함의 저하를 촉발한 것으로 직접 연결되도록 옮겼습니다.
  alternative_readings:
  - 단순한 인간 일반의 타락으로 완화할 수 있습니다.
  - 인과를 약화시켜 묘사적 진술로 읽을 수 있습니다.
  rationale: 시리아어는 아담의 행위를 여러 결과와 강하게 연결하므로, 종말론적-원인론적 논리를 약화하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1-3
- issue: ‘죽은 자들의 해방’의 난해한 구문
  chosen_reading: 본문이 확실히 말하는 범위 안에서 ‘죽은 자들의 해방’으로 비교적 문자적으로 두었습니다.
  alternative_readings:
  - 부활에 대한 암시로 구체화할 수 있습니다.
  - 죽음의 판결 또는 필멸성으로 풀이할 수 있습니다.
  rationale: 구문이 불명확하므로, 교리적으로 더 분명한 해석을 본문에 앞서지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
