translation:
  language: ko
  text: 그리고 므낫세 뒤에 아몬이 일어났습니다. 그는 자기 시대에 전능하신 분께서 이런 일들에 대해 책임을 묻지 않으실 것이라고 생각했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아몬이 불경하게 행했습니다.”
    reason: 영문 POB 감사 이력에 보존된 이전 번역을 반영합니다. 이는 현행 본문의 번역이 아니라 이전 번역의 이문/번역 선택을 알리는 주석입니다.
lexical_decisions:
- source_word: ܘܡܢܫܐ / after Manasseh
  english_pob_choice: And after Manasseh
  chosen_korean: 그리고 므낫세 뒤에
  alternatives_korean:
  - 므낫세 후에
  - 므낫세 다음에
  lexicon: 고유명사 표기 관례
  rationale: 문맥상 계승 순서를 자연스럽게 드러내면서도 원문의 단순한 시간 접속을 보존합니다.
- source_word: ܗܘܐ ܐܡܘܢ
  english_pob_choice: Amon arose
  chosen_korean: 아몬이 일어났으며
  alternatives_korean:
  - 아몬이 있었다고 하며
  - 아몬이 일어나
  lexicon: 고유명사 표기 관례
  rationale: 주어의 등장을 나타내는 직설적 서술로 옮겨, POB의 절제된 'arose'를 살립니다.
- source_word: ܒܙܒܢܗ
  english_pob_choice: in his own time
  chosen_korean: 자기 시대에
  alternatives_korean:
  - 그의 때에
  - 그 시대에
  lexicon: Payne Smith
  rationale: 시간 구문의 초점을 인물의 시대성에 두면서 한국어로 자연스럽게 표현합니다.
- source_word: ܚܝܒܘܬܐ
  english_pob_choice: call ... to account
  chosen_korean: 심판하지 않으실 것
  alternatives_korean:
  - 책임을 물으시지 않을 것
  - 문책하지 않으실 것
  lexicon: Payne Smith
  rationale: 원문의 사법적·책임 추궁적 뉘앙스를 살리되, 한국어 본문에서는 문맥상 가장 자연스러운 '심판하다'로 옮겼습니다.
theological_decisions:
- issue: Ḥâybûtâ(ܚܝܒܘܬܐ)의 의미를 어떻게 처리할지
  chosen_reading: 하나님께서 악을 심판하거나 책임을 물으시는 사법적 뜻으로 이해했습니다.
  alternative_readings:
  - 단순히 묻지 않으실 것
  - 조사하지 않으실 것
  rationale: 영문 POB가 'call these things to account'로 처리한 것은 단순 인지보다 법정적 책임 추궁을 시사하므로, 본문도 그 긴장을 유지했습니다.
  doctrine_reference: 하나님의 심판과 도덕적 책임성
