translation:
  language: ko
  text: 그리고 내가 대답하여 말했습니다. 「빛에서 받은 이는 그것을 알 수 있습니다. 그러나 많이 존재하는 자들은 아담의 어둠에서 받았고, 모세의 빛을 기뻐하지 않았습니다.」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܒܬ / ܢܣܒܘ
  english_pob_choice: received
  chosen_korean: 받았습니다 / 받았고
  alternatives_korean:
  - 취했습니다
  - 가져왔습니다
  - 끌어냈습니다
  lexicon: Payne Smith
  rationale: Syriac 동사는 단순한 ‘취하다’보다 더 넓게 ‘받다/취하다’의 의미를 담을 수 있어, 빛이나 어둠으로부터 무엇을 받아들인다는 이미지를 살리기 위해 ‘받다’로 옮겼습니다.
- source_word: ܢܘܗܪܐ
  english_pob_choice: light
  chosen_korean: 빛
  alternatives_korean:
  - 광명
  - 조명
  - 밝음
  lexicon: Payne Smith
  rationale: 본문의 대조축이 계시적·도덕적 ‘빛’의 이미지이므로, 추상화하지 않고 직접적인 ‘빛’을 유지했습니다.
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  english_pob_choice: Adam’s darkness
  chosen_korean: 아담의 어둠
  alternatives_korean:
  - 아담의 흑암
  - 아담의 어두움
  - 인간의 어둠
  lexicon: Payne Smith
  rationale: 속격 구조를 인물적·대표적 표현으로 유지하여, 일반적인 인간성보다 아담에게서 유래한 어둠이라는 점이 드러나도록 했습니다.
- source_word: ܐܬܒܣܣܘ
  english_pob_choice: did not rejoice
  chosen_korean: 기뻐하지 않았습니다
  alternatives_korean:
  - 세워지지 않았습니다
  - 굳게 서지 않았습니다
  lexicon: Payne Smith
  rationale: 본문의 유력 독법은 ‘기뻐하다’ 계열이므로, 영어 POB의 보정된 의미를 따라 부정형의 감정 반응으로 옮겼습니다.
theological_decisions:
- issue: 모세의 빛의 성격
  chosen_reading: 모세는 빛의 근원이 아니라, 빛과 연결된 계시를 받은 인물로 제시됩니다.
  alternative_readings:
  - 모세 자신의 내적 빛이 강조된 것으로 읽을 수 있습니다.
  - 단순히 교육이나 율법 지식을 가리키는 표현으로 약화시킬 수 있습니다.
  rationale: 문맥은 아담의 어둠과 모세의 빛을 대비하지만, 모세를 독립적 광원으로 만들지 않고 수여된 빛의 매개자로 읽는 편이 본문의 긴장을 보존합니다.
  doctrine_reference: 계시의 매개성과 수여성에 대한 본문 내 표현
- issue: ‘많이 존재하는 자들’의 보존
  chosen_reading: ‘많이 존재하는 자들’이라는 다소 직역적인 표현을 유지했습니다.
  alternative_readings:
  - ‘많은 사람들’로 자연화할 수 있습니다.
  - ‘무리들’로 완화할 수 있습니다.
  rationale: 수량 표현이 단순 인원 묘사만이 아니라, 대조를 이루는 집단적 정체성을 드러내므로 원문의 어법을 살렸습니다.
  doctrine_reference: 본문의 집단 대조 구조
