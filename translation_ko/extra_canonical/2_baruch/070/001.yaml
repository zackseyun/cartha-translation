lexical_decisions:
- source_word: ܫܡܥ (hear)
  english_pob_choice: hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으소서
  - 들어 보십시오
  lexicon: Payne Smith
  rationale: 예언적 해석 선언의 청중 호소로 이해하여, 명령형이지만 과도하게 고어적이지 않은 합쇼체로 옮겼습니다.
- source_word: ܦܫܪܐ (interpretation / explanation)
  english_pob_choice: the interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 뜻
  - 풀이
  lexicon: Payne Smith
  rationale: 상징적 이미지(검은 물)에 대한 설명이라는 점을 살려, 의미를 풀어 주는 중립적 용어인 ‘해석’을 택했습니다.
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ܐܚܪ̈ܝܐ
  english_pob_choice: the final black waters
  chosen_korean: 최후의 검은 물
  alternatives_korean:
  - 마지막 검은 물
  - 끝의 검은 물
  lexicon: Payne Smith
  rationale: POB의 상징성을 유지하면서도, 복수 형식의 물 이미지를 한국어에서 자연스럽게 집합적으로 처리했습니다.
- source_word: ܡܠܬܐ
  english_pob_choice: This is the word
  chosen_korean: 이것이 그 말씀입니다
  alternatives_korean:
  - 이것이 그 말입니다
  - 이것이 말씀입니다
  lexicon: Payne Smith
  rationale: 예언적 계시 공식으로서의 무게를 살리기 위해 ‘말씀’을 택했으며, 단순한 발화보다 권위를 분명히 했습니다.
theological_decisions:
- issue: 예언 해석문의 종결 방식
  chosen_reading: 단순한 정보 전달이 아니라, 청중에게 해석을 들려주며 계시적 선언으로 닫는 문장으로 옮겼습니다.
  alternative_readings:
  - 중립적인 설명문으로 완화하는 번역
  - 직역에 가까운 ‘이것이 그 말입니다’
  rationale: 본문은 상징 해석을 공식적으로 도입하는 문맥이므로, 계시의 권위와 종결감을 살리는 방향이 더 적절합니다.
