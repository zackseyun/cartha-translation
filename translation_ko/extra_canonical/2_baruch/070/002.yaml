- from: 보라, 세상의 때가 무르익어 악인과 선인의 씨를 추수할 날이 오나니. 그 때에 전능하신 분이 땅과 그 주민과 그 통치자들에게 영의 혼란과 마음의 놀라움을 가져오실 것입니다.
  to: 보십시오, 세상의 때가 무르익고 악한 자들과 선한 자들의 씨의 추수가 이르게 될 날들이 오고 있습니다. 그때에 능하신 분께서 땅과 그 주민들과 그 통치자들에게 영의 혼란과 마음의 경악을 가져오실 것입니다.
  rationale: 추수의 대상이 ‘씨’가 아니라 ‘악한 자들과 선한 자들의 씨의 추수’임을 명사구로 보존했습니다. 원문의 신적 호칭과 ‘영/마음’의 병렬을 직접적으로 옮기고, 현대 표준 한국어 합쇼체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:37:58Z'
review_pass:
  verdict: revise
  source_fidelity: ‘악인과 선인의 씨’는 원문의 ‘악한 자들과 선한 자들의 씨’를 대체로 반영하지만, ‘씨를 추수할 날’은 원문의 ‘씨의 추수’라는 명사구를 ‘씨를 수확하다’라는 행위로 바꾸어 의미와 결합을 흐립니다. 또한 ‘전능하신 분’은 여기의 호칭(‘the Mighty One’)보다 해석적으로 더 특정적입니다.
  naturalness: ‘씨를 추수할 날’은 현대 한국어에서 부자연스럽고, ‘마음의 놀라움’도 consternation의 심한 당혹·경악을 충분히 나타내지 못합니다. 문장 전체는 합쇼체로 자연스럽게 다듬을 수 있습니다.
  terminology: ‘능하신 분’은 원문의 신적 호칭을 자연스럽고 과도한 교리적 특정 없이 옮깁니다. ‘영의 혼란’과 ‘마음의 경악’은 각각 confusion of spirit와 consternation of heart의 병렬을 보존합니다.
  issues:
  - severity: medium
    issue: ‘악인과 선인의 씨를 추수할 날’
    rationale: 원문과 영어 감사 기록의 ‘악한 자들과 선한 자들의 씨의 추수’를 ‘씨를 추수하는’ 행위로 바꾸며, ‘씨’가 누구에게 속하는지도 덜 분명하게 합니다.
  - severity: low
    issue: ‘전능하신 분’
    rationale: ‘Mighty One’은 능력의 호칭이지 반드시 ‘전능’이라는 절대적 속성 진술은 아닙니다. ‘능하신 분’이 더 직접적입니다.
  - severity: low
    issue: ‘마음의 놀라움’
    rationale: consternation은 단순한 놀라움보다 충격과 당혹을 수반하므로 ‘경악’이 더 적절합니다.
