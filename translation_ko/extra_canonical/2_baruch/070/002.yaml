  text: 보십시오, 세상의 때가 무르익고 악한 자들과 선한 자들의 씨의 추수가 이르게 될 날들이 오고 있습니다. 그때에 능하신 분께서 땅과 그 주민들과 그 통치자들에게 영의 혼란과 마음의 경악을 가져오실 것입니다.
