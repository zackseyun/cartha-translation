  source_fidelity: 영어 POB 감사문과 제시된 시리아어 문맥은 황폐한 ‘어머니’와 포로로 끌려간 자녀들을 근거로, 다시 자녀를 낳거나 인간 본성의 씨가 다시 불리어야 할 이유를 묻는 애가의 수사 의문을 이룹니다. 초안의 마지막 행은 이를 독립 의문문으로 바꾸어 문장 관계를 훼손합니다.
  naturalness: ‘사로잡혀 갔느냐?’는 앞의 ‘이 어머니가 … 있을 때’와 문법적으로도 의미상으로도 자연스럽게 연결되지 않습니다. ‘황폐하게’와 ‘포로로 끌려가 버렸는데’를 사용하면 현대 표준어 합쇼체에서 애가의 어조와 종속 관계가 자연스럽게 살아납니다.
