  text: '그리고 태양이여, 당신은 광선의 빛을 억제하고 있습니다.

    달이여, 당신의 풍부한 빛을 꺼 주소서.

    왜 빛이 다시 솟아오르야 합니까?

    시온의 빛이 어두워진 곳은 어디인가?'
