  text: 'I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.'
translation:
  language: ko
  text: '나는 바다에서 사이렌을 부를 것이다.

    그리고 너희 릴리스들은 사막에서 왔다.

    그리고 숲에서 온 악마와 용들아:

    깨어서 애통함을 인하여 허리를 동이고

    나와 함께 슬퍼하라.

    나와 함께 슬퍼해주세요.'
