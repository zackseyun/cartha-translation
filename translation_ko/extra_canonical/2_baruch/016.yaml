translation:
  language: ko
  text: 내가 대답하여 말했습니다[a]. 「주 나의 주님, 이 시대의 해는 짧고 악한데, 누가 이처럼 짧은 때에 헤아릴 수 없는 것을 얻을 수 있습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫ̈ܢܝܗܝ
  english_pob_choice: the years
  chosen_korean: 해는
  alternatives_korean:
  - 세월은
  - 년수는
  lexicon: Payne Smith
  rationale: 시리아어는 시간의 기간을 가리키며, ‘해’는 짧음을 강조하면서도 ‘years’의 구체성을 자연스럽게 살립니다.
- source_word: ܙܒܘ̈ܢܝ
  english_pob_choice: of this age
  chosen_korean: 이 시대의
  alternatives_korean:
  - 이 때의
  - 이 세상의
  lexicon: Payne Smith
  rationale: 단순한 순간이 아니라 현재의 인간적 질서 전체를 가리키는 종말론적 표현으로 보아 ‘시대’가 가장 잘 맞습니다.
- source_word: ܡܫܟܚ
  english_pob_choice: can acquire
  chosen_korean: 얻을 수 있습니까
  alternatives_korean:
  - 획득할 수 있습니까
  - 도달할 수 있습니까
  lexicon: Payne Smith
  rationale: 질문형으로서 인간이 어떤 대상에 이르러 소유하게 되는 가능성을 묻는 뜻을 살리기 위해 ‘얻다’를 택했습니다.
- source_word: ܡܫܘܚܬܐ
  english_pob_choice: that which is immeasurable
  chosen_korean: 헤아릴 수 없는 것
  alternatives_korean:
  - 측량할 수 없는 것
  - 무한한 것
  lexicon: Payne Smith
  rationale: ‘measure’의 부정형을 자연스러운 한국어로 옮겨, 인간의 짧은 생애와 대비되는 초월적 크기를 드러냈습니다.
theological_decisions:
- issue: 이 구절의 항의가 하나님의 공의 자체를 의심하는지, 아니면 인간의 짧은 생애로는 약속된 종말에 이를 수 있는지 묻는지
  chosen_reading: 인간의 짧음 앞에서, 헤아릴 수 없는 종말의 실재를 전제한 채 그에 이를 능력을 탄식하는 말로 옮겼습니다.
  alternative_readings:
  - 하나님의 요구가 공정한지 자체를 문제 삼는 더 회의적인 해석
  rationale: 앞뒤 문맥이 삶의 길이보다 행위와 태도의 문제를 강조하므로, 본문은 목표의 실재를 부정하기보다 인간 한계를 애도하는 쪽이 더 적절합니다.
  doctrine_reference: 인간의 유한성과 종말론적 소망의 긴장
