  yaml_path: translation/extra_canonical/2_baruch/038.yaml
  text: And he answered and said to me[a], “What do you ask of me? You help those who are guided in understanding in your prayer. My law is life, and my wisdom is uprightness. Ask for the interpretation of this vision. For you have seen that in your prayer it was persuaded by my law[b], and from your days my wisdom has not been forgotten.”
  footnotes:
  - marker: a
    text: The chapter opening is textually rough in the Ceriani OCR. The main sense of the prayer is secure, but the exact wording of the first clause is clarified with the Kmosko control witness.
    reason: textual_variant
  - marker: b
    text: Or 'from my days I have not been cut off'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 나에게 대답하여 말했습니다. 「무엇을 내게 묻습니까? 당신은 당신의 기도에서 이해로 인도받는 이들을 돕습니다. 내 율법은 생명이고, 내 지혜는 올바름입니다. 그러니 이 환상의 해석을 구하십시오. 당신은 당신의 기도에서 그것이 내 율법으로 설득되었고, 당신의 날들로부터 내 지혜가 잊히지 않았음을 보았기 때문입니다.」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  english_pob_choice: those who are guided in understanding
  chosen_korean: 이해로 인도받는 이들
  alternatives_korean:
  - 이해 가운데 인도받는 이들
  - 이해에 따라 인도받는 이들
  - 깨달음으로 인도받는 이들
  lexicon: Payne Smith
  rationale: ܒܣܘܟܠܐ의 ܒ-는 ‘~안에서/로’의 수단·영역을 나타내므로, ‘이해로 인도받는’으로 옮겨 이해가 인도의 영역이자 매개임을 살렸습니다.
- source_word: ܢܡܘܣܝ ܚ̈ܝܐ ܗܘ
  english_pob_choice: My law is life
  chosen_korean: 내 율법은 생명이고
  alternatives_korean:
  - 내 율법은 생명입니다
  - 내 율법은 생명 자체입니다
  - 내 율법은 생명을 줍니다
  lexicon: Payne Smith
  rationale: 문장 구조가 단순한 등식이므로 ‘생명을 줍니다’보다 ‘생명이고’로 직역에 가깝게 유지해, 율법과 생명의 동일시를 보존했습니다.
- source_word: ܚܟܡܬܝ ܬܪܝܨܘܬܐ ܗܝ
  english_pob_choice: my wisdom is uprightness
  chosen_korean: 내 지혜는 올바름입니다
  alternatives_korean:
  - 내 지혜는 정직입니다
  - 내 지혜는 바름입니다
  - 내 지혜는 의로움입니다
  lexicon: Payne Smith
  rationale: ܬܪܝܨܘܬܐ의 핵심은 ‘곧음/바름’이므로, 후대 교리어를 과도하게 불러오지 않도록 ‘올바름’으로 자연스럽게 옮겼습니다.
- source_word: ܦܘܫܩܗ ܕܚܙܘܐ ܗܢܐ
  english_pob_choice: the interpretation of this vision
  chosen_korean: 이 환상의 해석
  alternatives_korean:
  - 이 환시의 해석
  - 이 이상의 해석
  - 이 환상의 뜻
  lexicon: Payne Smith
  rationale: 예언·종말론적 장르에서 ܚܙܘܐ는 단순한 ‘비전’보다 ‘환상/계시적 환시’가 더 적절하므로, 한국어 독자에게는 ‘환상’이 장르를 가장 분명히 드러냅니다.
- source_word: ܡܢ ܝܘ̈ܡܝ
  english_pob_choice: from your days
  chosen_korean: 당신의 날들로부터
  alternatives_korean:
  - 당신의 날들에서부터
  - 당신의 오래전 날들부터
  - 당신의 옛날부터
  lexicon: Payne Smith
  rationale: 본문의 표면형을 따라 ‘from your days’를 살리되, 시적인 소유/기원 표현을 유지하기 위해 ‘날들로부터’로 옮겼습니다.
theological_decisions:
- issue: ‘내 율법’, ‘내 지혜’의 신적 발화 유지
  chosen_reading: 문맥상 화자는 신적 화자이므로 소유격을 바꾸지 않고 ‘내 율법’, ‘내 지혜’로 유지했습니다.
  alternative_readings:
  - ‘당신의 율법’, ‘당신의 지혜’로 주체를 바꾸는 읽기
  - 일반적인 교훈 문장으로 약화하는 읽기
  rationale: 시리아어 본문과 영어 POB가 모두 신적 소유격을 보존하므로, 이를 인간 화자의 소유로 재배치하면 본문의 권위와 발화 주체가 훼손됩니다.
  doctrine_reference: 신적 자기계시의 직접 발화 보존
- issue: ‘이해로 인도받는’의 관계 보존
  chosen_reading: ‘이해로 인도받는 이들’로 옮겨 인도와 이해의 긴밀한 관계를 드러냈습니다.
  alternative_readings:
  - ‘이해를 가진 이들’로 단순 기술
  - ‘지혜로운 사람들’로 일반화
  rationale: 본문은 단지 지적 소유가 아니라 인도받는 상태를 말하므로, 행위상태를 살린 번역이 문맥에 더 가깝습니다.
  doctrine_reference: 지혜/율법의 계시적 인도성
