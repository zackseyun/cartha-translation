base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/032.yaml
  text: 'But you[a], if you prepare your hearts so as to sow in them the fruit of the law, you will be protected in that time when the Mighty One shakes the whole creation.


    For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever[b].


    Therefore we should not grieve so greatly over the evil that has come now[c], as over that which is to come.'
  footnotes:
  - marker: a
    text: The present chapter boundary is medium-confidence in the Ceriani bucket. The main sense of this chapter is controlled chiefly by Kmosko page 570 because the surviving Ceriani page span overlaps chapters 31–33 and is locally unstable.
    reason: textual_variant
  - marker: b
    text: The middle lines about Zion being shaken, rebuilt, desolated again, and later renewed in glory are enclosed in brackets because they appear as a marked block in the Kmosko control witness and the current primary-page segmentation does not let us assert their chapter placement with full precision.
    reason: textual_variant
  - marker: c
    text: Or '[For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever.]'.
    reason: previous_rendering
translation:
  language: ko
  text: '그대들이 마음을 준비하여 그 안에 율법의 열매를 뿌린다면, 야훼께서 큰 이가 온 창조 세계를 흔드실 그때에 그대들을 지키실 것입니다.


    잠시 뒤에 시온의 건물은 흔들려 다시 세워질 것이나, 바로 그 건물은 남아 있지 않을 것입니다. 오히려 때가 지난 뒤에는 다시 뿌리째 뽑혀 그때까지 황폐하게 남아 있다가, 이후에는 영광 가운데 새롭게 되어 영원히 견고히 세워질 것입니다.


    그러므로 우리는 지금 닥친 악 때문에만큼이나 앞으로 올 악 때문에도 너무 크게 슬퍼해서는 안 됩니다.[a][b][c]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminetis in eis fructus legis
  english_pob_choice: sow in them the fruit of the law
  chosen_korean: 그 안에 율법의 열매를 뿌린다면
  alternatives_korean:
  - 율법의 열매를 그 안에 심는다면
  - 그 안에 율법의 열매를 재배한다면
  lexicon: Lewis & Short; Syriac control text
  rationale: 농경 은유를 유지하되, 한국어에서는 '뿌리다'가 씨를 흩뿌리는 동작과 내적 준비의 이미지를 가장 자연스럽게 살립니다. '율법의 열매'도 일반적 의미로 풀지 않고 그대로 보존했습니다.
- source_word: Fortis
  english_pob_choice: the Mighty One
  chosen_korean: 큰 이
  alternatives_korean:
  - 전능하신 분
  - 능하신 분
  lexicon: Lewis & Short; POB audit trail
  rationale: 본문은 하나님을 가리키는 칭호이므로 단순한 형용사보다 위엄 있는 호칭으로 옮겼습니다. 다만 한국어에서 너무 낯선 직역을 피하면서도 'Mighty One'의 힘과 장엄함을 살렸습니다.
- source_word: concutiat omnem creaturam
  english_pob_choice: shakes the whole creation
  chosen_korean: 온 창조 세계를 흔드실
  alternatives_korean:
  - 모든 피조물을 흔드실
  - 온 피조세계를 뒤흔드실
  lexicon: Lewis & Short; Syriac control text
  rationale: '''creatura''의 우주적 범위를 ''창조 세계''로 옮겨 ''피조물''보다 전체적 질서를 드러냈습니다. ''흔드실''은 종말론적 동요를 과장하지 않으면서도 유지합니다.'
- source_word: aedificatio Sion
  english_pob_choice: the building of Zion
  chosen_korean: 시온의 건물
  alternatives_korean:
  - 시온의 건축물
  - 시온의 성전 건물
  lexicon: Lewis & Short; POB audit trail
  rationale: 본문의 초점은 시온의 구체적 건조물/건축된 형상에 있으므로, 상징적으로만 풀지 않고 직접적으로 옮겼습니다. '건물'은 본문의 물질성과 재건 가능성을 드러냅니다.
- source_word: renovari in gloria / perficietur in perpetuum
  english_pob_choice: renewed in glory / be established forever
  chosen_korean: 영광 가운데 새롭게 되어 영원히 견고히 세워질 것입니다
  alternatives_korean:
  - 영광 가운데 갱신되어 영원히 완성될 것입니다
  - 영광 중에 새로워져 영원히 확립될 것입니다
  lexicon: Lewis & Short; POB audit trail
  rationale: '''renewed''와 ''established forever''를 각각 살려 재생과 최종적 확정을 모두 보존했습니다. ''견고히 세워질''은 단순한 회복보다 종말론적 안정성을 강조합니다.'
theological_decisions:
- issue: 야훼의 호칭과 종말론적 심판 주체
  chosen_reading: 의미상 주어가 하나님이므로 '야훼께서'로 옮겨, 창조 세계를 흔드시는 주체가 분명히 드러나게 했습니다.
  alternative_readings:
  - 주께서
  - 전능하신 이가
  rationale: POB 기본 원칙에 따라 야훼를 본문 주어로 분명히 드러내면, 문맥 속 심판과 보존의 주체가 흐려지지 않습니다.
  doctrine_reference: Divine naming in source-direct translation; preserve covenantal specificity.
- issue: 시온 재건의 반복과 최종 확정
  chosen_reading: 시온의 건물이 한 번 세워졌다가 다시 흔들리고, 다시 황폐해졌다가 결국 영광 가운데 영원히 견고히 세워진다는 반복 구조를 그대로 살렸습니다.
  alternative_readings:
  - 중간의 재건·황폐화 대목을 완화하여 한 번의 회복으로 정리함
  - 불확실성 때문에 중간 대목을 생략함
  rationale: 본문은 단순한 회복이 아니라 흔들림-재건-황폐-영광의 재확정이라는 긴장을 담고 있으므로, 이를 완화하지 않고 보존해야 합니다.
  doctrine_reference: Preserve textual and eschatological tension rather than harmonizing it away.
