  text: And it will happen after these things, when the time of the coming of the Messiah is completed and he returns with glory, then all those who sleep in hope of him will rise.
translation:
  language: ko
  text: 이 일들이 지난 뒤에, 메시아가 오시는 때가 다 이루어지고 그가 영광과 함께 돌아오시면, 그분을 바라고 잠든 모든 이들이 일어날 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: ܗܘ̈ܦܝ ܡܥܝܪܢܘܬ ܚܕܐ ܒܚܕܐ. ܘܚܕܐ ܚܕܐ
  english_pob_choice: And it will happen after these things
  chosen_korean: 이 일들이 지난 뒤에
  alternatives_korean:
  - 이 일들 후에
  - 이런 일들이 끝난 뒤에
  lexicon: 시간 부사구
  rationale: 서술 전환을 자연스럽게 옮기되, 원문의 뒤이어짐을 간결하게 살렸습니다.
- source_word: ܙܒܢܐ ܕܡܐܬܝܬܗ ܕܡܫܝܚܐ
  english_pob_choice: the time of the coming of the Messiah
  chosen_korean: 메시아가 오시는 때
  alternatives_korean:
  - 메시아의 오심의 때
  - 메시아께서 오시는 때
  lexicon: 메시아 / 도래
  rationale: POB의 Messiah를 따라 메시아를 유지하고, 시제감은 ‘오시는 때’로 옮겨 도래의 완료를 나타냈습니다.
- source_word: ܢܦܩܐ ... ܒܕܡܝܐ
  english_pob_choice: and he returns with glory
  chosen_korean: 그가 영광과 함께 돌아오시면
  alternatives_korean:
  - 그가 영광 중에 돌아오시면
  - 영광 가운데 돌아오시면
  lexicon: 영광 / 귀환
  rationale: 전치사적 결합을 직역하면서도 한국어에서 가장 자연스러운 ‘영광과 함께’로 처리했습니다.
- source_word: ܕܠܐ ܡܬܚܒܠܐ ܠܡܘܠܟܢ ܕܡ
  english_pob_choice: those who sleep in hope of him
  chosen_korean: 그분을 바라고 잠든 모든 이들
  alternatives_korean:
  - 그분을 소망하며 잠든 이들
  - 그분에 대한 소망 가운데 잠든 자들
  lexicon: 잠들다 / 소망
  rationale: ‘hope of him’을 인격적 대상으로서의 기대·소망으로 옮기고, 죽음을 완곡하지 않게 ‘잠든’으로 유지했습니다.
theological_decisions:
- issue: 메시아 칭호 처리
  chosen_reading: 영어 POB의 Messiah에 맞추어 ‘메시아’로 일관되게 번역했습니다.
  alternative_readings:
  - 그리스도
  - 기름부음받은 이
  rationale: 이 구절은 제목적 호칭으로 쓰이며, POB의 일관된 용례를 따라 독자가 종말론적 도래 인물로 바로 인식하도록 했습니다.
  doctrine_reference: 그리스도론 / 종말론
