revisions:
- from: 그 때에 의인의 영혼 수를 두는 곳간이 열리리니 그들이 나오리라. 그리고 수많은 영혼들이 한 마음으로 한 모임에 함께 있는 것을 보게 될 것입니다. 그러면 처음 사람은 기뻐하고 나중 사람은 슬퍼하지 않을 것입니다.
  to: 그때에 의인들의 영혼 수가 보존되어 있는 보관소들이 열리고, 그들이 나올 것입니다. 수많은 영혼들이 한 마음으로 한데 모여 나타날 것이며, 첫째는 기뻐하고 마지막은 슬퍼하지 않을 것입니다.
  rationale: 수동적 출현의 의미를 ‘나타날 것입니다’로 바로 옮기고, ‘처음/마지막’에 원문에 없는 인물 지시어를 넣지 않았습니다. 또한 저장 장소를 복수형 ‘보관소들’로 옮겨 원문의 복수 표현을 반영했습니다.
  reviewer_model: gpt-5.6-terra
