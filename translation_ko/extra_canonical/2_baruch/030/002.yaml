  language: ko
  text: 그 때에 의인의 영혼 수를 두는 곳간이 열리리니 그들이 나오리라. 그리고 수많은 영혼들이 한 마음으로 한 모임에 함께 있는 것을 보게 될 것입니다. 그러면 처음 사람은 기뻐하고 나중 사람은 슬퍼하지 않을 것입니다.
