    text: Or 'and the throngs before their idols say'.
    reason: previous_rendering
translation:
  language: ko
  text: 아니면 시온이 이처럼 넘겨졌고, 보라, 열방이 마음속으로 자랑하며 자기들의 우상들 앞에 모여 이르기를, “남을 오랫동안 짓밟던 자가 짓밟혔고, 남을 굴복시키던 자가 스스로 굴복당하였다” 하기 때문에, 전능자 앞에 선 천사들에게조차 슬픔이 없다고 생각하십니까?
