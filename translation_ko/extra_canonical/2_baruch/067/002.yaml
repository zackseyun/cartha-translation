  text: 아니면 천사들도 전능자 앞에서 슬픔이 없다고 생각하느냐? 보라 열방이 마음으로 자랑하며 자기 우상 앞에 모여 이르기를 남을 오랫동안 짓밟던 자가 짓밟혔고 남을 굴복시키던 자가 굴복당하였다 하느니라.
