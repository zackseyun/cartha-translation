translation:
  language: ko
  text: 그리고 네가 본 열한 번째 검은 물은 시온에 이제 닥친 재앙입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  english_pob_choice: black waters
  chosen_korean: 검은 물
  alternatives_korean:
  - 어두운 물
  - 흑색의 물
  lexicon: Payne Smith
  rationale: 묵시적 환상 표지를 유지하기 위해 색채 이미지를 직접 살렸습니다. '어두운 물'보다 '검은 물'이 상징 구조를 더 분명하게 드러냅니다.
- source_word: ܐܫܬܒܥܬܐ / ܫܘܚܬܐ
  english_pob_choice: calamity
  chosen_korean: 재앙
  alternatives_korean:
  - 환난
  - 참화
  lexicon: Payne Smith
  rationale: 여기서는 단순한 불운이 아니라 시온에 임한 심판적 재난을 가리키므로, 무게감이 있는 '재앙'이 가장 적절합니다.
- source_word: ܨܶܝܘܢ
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 예루살렘
  - 시온 산
  lexicon: Established biblical proper noun
  rationale: 문맥상 상징적·신학적 표지로서의 시온을 가리키므로, 고유명사를 그대로 음역해 보존했습니다.
theological_decisions:
- issue: 재앙의 진술 방식
  chosen_reading: 검은 물의 환상은 시온에 '이제 닥친' 실제 재앙을 가리키는 해석 진술로 옮겼습니다.
  alternative_readings:
  - 미래에 닥칠 재앙
  - 상징적 비극 일반
  rationale: 시리아어 현재 완료적 진술과 영어 POB의 'has now come upon'을 반영하여, 이미 도래한 심판이라는 긴장을 유지했습니다.
  doctrine_reference: 예언적 심판의 현재적 성취 표현
- issue: 단수 지시사와 단수 명사
  chosen_reading: 단수형 '이 재앙'으로 읽어 1회적 심판 사건을 유지했습니다.
  alternative_readings:
  - 이 재앙들
  - 이러한 재앙
  rationale: 원문과 POB 모두 단수 지시와 단수 명사를 지지하므로, 복수화하지 않고 사건의 응집성을 살렸습니다.
  doctrine_reference: 원문 문법 일치
