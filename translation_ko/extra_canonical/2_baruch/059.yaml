translation:
  language: ko
  text: '바다에서 올라와 이 땅을 덮는 그 큰 구름이 무엇인지 들으십시오. 그것은 그분의 능력이 지으신 세상입니다. 그가 창조를 만들기를 생각하셨을 때에 말입니다[a]. 그리고 그분 앞에서 말씀이 나가자 세상의 구조가 나타나 매우 작게 섰고, 그것이 마땅히 되어야 할 바에 따라 세워졌습니다.


    그리고 구름에서 그것 위로 내려온 첫 검은 물들은, 첫 사람 아담이 범한 첫 죄, 곧 허물입니다. 아담이 죄를 지었을 때 죽음이, 그때가 아직 이르지도 않았는데, 일어나게 되었고, 애곡이 알려졌으며, 고통들이 마련되었고, 아픔이 지어졌으며, 수고가 완성되었고, 위대함이 낮아지기 시작했습니다.


    그리고 마지막 때는 모습으로 나타나 형체를 입었으니, 때가 심판받을 것이며 인류의 척도가 재어질 것이며 그 힘이 시험받을 것임을 아십시오. 그러므로 아담은 하나님에게서 장차 일어날 어떤 일을 들은 사람이었기에, 죽은 자들의 해방이 주어졌다는 것과 하나님에게서 그에게 명령된 것을 생각하였습니다. 그는 계속 생각했고, 다섯 가지 생각을 지어 냈습니다[b]. 그는 자기 자신을 책임 있게 만들었고, 천사들도 책임 있게 만들었습니다. 또 그가 창조되었을 때에도 그에게 환상이 보였으니, 쓰디쓴 생명과 불이 있는 원소들이었습니다. 그러므로 하나님께서는 미리, 지어진 이들의 모습대로 모아 두셨습니다[c].'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  english_pob_choice: the structure of the world
  chosen_korean: 세상의 구조
  alternatives_korean:
  - 세상의 시작
  - 세상의 기초
  - 세상의 성립
  lexicon: Payne Smith
  rationale: ‘구조’는 세계가 질서 있게 서 있는 상태를 살리면서, 뒤의 ‘매우 작게 섰고’와도 자연스럽게 이어집니다.
- source_word: ܚܝܠܘܗܝ
  english_pob_choice: his power
  chosen_korean: 그분의 능력
  alternatives_korean:
  - 그분의 힘
  - 그분의 권능
  lexicon: Payne Smith
  rationale: 시리아어의 כוח/능력 계열을 살리되, 현대 한국어에서 하나님의 작용을 자연스럽게 드러내는 말로 ‘능력’을 택했습니다.
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  english_pob_choice: the first sin, the transgression
  chosen_korean: 첫 죄, 곧 허물
  alternatives_korean:
  - 첫 죄, 곧 범과
  - 첫 죄, 곧 죄과
  lexicon: Payne Smith
  rationale: 두 표현의 중첩을 유지하되, ‘허물’로 앞뒤를 풀어 반복적 강조를 한국어로 옮겼습니다.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  english_pob_choice: the release of the dead
  chosen_korean: 죽은 자들의 해방
  alternatives_korean:
  - 죽은 자들의 풀려남
  - 죽은 자들의 석방
  lexicon: Payne Smith
  rationale: 문맥상 단순한 ‘방임’이 아니라 해방/풀려남의 의미가 강하므로, 의미를 보존하면서도 직역에 가까운 ‘해방’을 택했습니다.
- source_word: ܡܚܝܒܢܘܗܝ
  english_pob_choice: made liable
  chosen_korean: 책임 있게 만들었습니다
  alternatives_korean:
  - 유책하게 만들었습니다
  - 죄책을 지게 했습니다
  lexicon: Payne Smith
  rationale: 법정적 책임을 살리되 한국어 문장 흐름을 위해 ‘책임 있게 만들다’로 옮겼습니다.
- source_word: ܐܣܛܘܟܣܐ
  english_pob_choice: the elements
  chosen_korean: 원소들
  alternatives_korean:
  - 요소들
  - 기본 원리들
  lexicon: Payne Smith
  rationale: 이 그리스어 차용어는 우주론적 ‘원소들’을 가리키는 것이 가장 자연스러워, 현대 독자에게 바로 이해되는 표현을 사용했습니다.
theological_decisions:
- issue: 아담의 죄와 죽음의 발동
  chosen_reading: 본문이 아담의 첫 범죄를 죽음, 애곡, 고통, 아픔, 수고의 개시 원인으로 제시한다고 보았습니다.
  alternative_readings:
  - 죽음이 단지 알려졌다는 식으로 완화할 수 있음
  - 인과보다 수사적 병행으로 읽을 수 있음
  rationale: 시리아어의 흐름은 죄 이후 죽음이 ‘일어나게 되었다’는 인과를 분명히 말하므로, 그 힘을 약화하지 않고 옮겼습니다.
  doctrine_reference: 'Cartha project doctrine: 원문의 신학적 긴장을 완화하지 않고 보존'
