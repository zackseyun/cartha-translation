revisions:
- from: 그 때에 너희와 너희와 함께 있는 많은 사람은 지극히 높으신 이의 용납하심이 대대에 이르심을 보리라 그가 죄를 범하는 자나 의인에게나 모든 출생자에게 얼마나 오래 참으셨는지를 알게 되리라
  to: 그때에 당신은, 당신과 함께 있는 많은 이들과 더불어, 지극히 높으신 분께서 모든 세대에 걸쳐 보이신 오래 참으심을 보게 될 것입니다. 곧 그분께서 죄를 짓는 이들과 의로운 이들을 비롯하여 태어나는 모든 이를 얼마나 오래 참으셨는지를 보게 될 것입니다.
  rationale: 주어의 중복을 바로잡고, forbearance를 문맥상 ‘오래 참으심’으로 정확히 옮겼습니다. ‘모든 세대에 걸쳐’와 ‘태어나는 모든 이’를 사용하여 영어 감사 번역이 반영한 시간적·포괄적 범위를 보존했습니다.
  reviewer_model: gpt-5.6-terra
