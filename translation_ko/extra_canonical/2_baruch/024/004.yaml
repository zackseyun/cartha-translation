  terminology: ‘원수들’과 미래의 불확실성을 나타내는 표현은 적절합니다. 신적 방문을 한국어에서 자연스럽게 드러내기 위해 ‘찾아오시다’를 사용하되, 원문의 구원·심판 어느 쪽에도 한정되지 않은 방문의 의미를 유지했습니다.
