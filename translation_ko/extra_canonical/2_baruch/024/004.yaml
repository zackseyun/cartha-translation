  source_fidelity: 앞의 두 절은 원문의 의미를 충실히 옮겼습니다. 다만 ‘당신의 일을 돌아보실’은 원문의 ‘당신의 works를 방문하다’라는 표현에서 목적어를 하나님의 행위로 오해하게 할 수 있습니다. 여기서 works는 하나님께서 지으신 것들, 곧 피조 세계를 가리키는 표현으로 이해하는 것이 자연스럽습니다.
