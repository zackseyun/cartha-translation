- from: 보십시오, 날들이 오고 있습니다. 그때에는 책들이 열릴 것이며, 그 책들에는 죄를 지은 모든 이들의 죄가 기록되어 있고, 또 창조 때부터 의로웠던 모든 이들의 의가 모여 있는 창고들도 있을 것입니다.
  to: 보십시오, 날들이 오고 있습니다. 그때에는 죄를 지은 모든 이들의 죄가 기록된 책들이 열리고, 창조 세계에서 의로웠던 모든 이들의 의가 모여 있는 창고들도 드러날 것입니다.
