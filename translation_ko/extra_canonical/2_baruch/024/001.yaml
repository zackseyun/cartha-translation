base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/024/001.yaml
  text: For look, days are coming when the books will be opened, in which the sins of all who have sinned are written, and also the storehouses in which the righteousness of all who were righteous in creation is gathered.
translation:
  language: ko
  text: 보십시오, 날들이 오고 있습니다. 그때에는 죄를 지은 모든 이들의 죄가 기록된 책들이 열리고, 창조 세계에서 의로웠던 모든 이들의 의가 모여 있는 창고들도 드러날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܐܝܬ ... ܥܠ ܫܡܝܟ  / For look
  english_pob_choice: For look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: imperative discourse particle
  rationale: 서두의 주의 환기 표현은 현대 한국어에서 자연스럽고 합쇼체 문맥에 맞는 ‘보십시오’로 옮겨, 단순 서술이 아니라 임박한 계시적 경고를 드러냈습니다.
- source_word: ܢܬܦܬܚܘܢ ܟܬܒ̈ܐ / the books will be opened
  english_pob_choice: the books will be opened
  chosen_korean: 책들이 열릴 것이며
  alternatives_korean:
  - 책들이 펼쳐질 것이며
  - 책들이 열리게 될 것이며
  lexicon: books
  rationale: 문맥상 심판 장면의 ‘기록된 책들’이므로 물리적 책 자체보다 공개·심판의 행위를 살린 직역형 표현을 택했습니다.
- source_word: ܚܛܗ̈ܐ ... ܟܬܝܒܝܢ / the sins ... are written
  english_pob_choice: the sins ... are written
  chosen_korean: 죄를 지은 모든 이들의 죄가 기록되어 있고
  alternatives_korean:
  - 모든 죄가 적혀 있고
  - 죄들이 기록되어 있고
  lexicon: write/record
  rationale: 시리아어의 ‘기록되다’는 법정적·기록적 뉘앙스가 강하므로, 행위의 결과를 드러내는 ‘죄를 지은 모든 이들의 죄’로 풀어 과도한 추상화를 피했습니다.
- source_word: ܓܙ̈ܐ / storehouses
  english_pob_choice: storehouses
  chosen_korean: 창고들
  alternatives_korean:
  - 곳간들
  - 저장고들
  lexicon: storehouse
  rationale: 시리아어의 저장 장소 이미지를 가장 직접적으로 전달하는 보편적 한국어 어휘로 옮겼습니다. 다만 본문 흐름상 심판 대비의 문학적 비유가 유지되도록 ‘창고들’로 남겼습니다.
- source_word: ܙܕܝ̈ܩܐ ... ܒܒܪܝܬܐ / the righteous in creation
  english_pob_choice: those who were righteous in creation
  chosen_korean: 창조 때부터 의로웠던 모든 이들의 의
  alternatives_korean:
  - 창조 안에서 의로웠던 모든 이들의 의
  - 창조 때 의로운 모든 이들의 의
  lexicon: creation / righteous
  rationale: 시리아어의 구문은 ‘창조 시점/질서’에 속한 의를 말하므로, 사람을 한정하는 표현과 결과물(의)을 함께 살려 ‘창조 때부터 의로웠던’으로 옮겼습니다.
theological_decisions:
- issue: 심판의 책과 의의 창고라는 종말론적 대조 구조
  chosen_reading: 죄는 기록되고 의는 모여 보관되는 대비를 그대로 살려, 최종 심판에서 드러나는 공적 계시를 강조했습니다.
  alternative_readings:
  - 상징적 비유로 완화해 일반적 ‘기록’만 강조하는 읽기
  - 도덕적 교훈으로 축소하는 읽기
  rationale: 본문은 단순한 도덕 교훈이 아니라, 죄와 의가 각각 보존·공개되는 종말론적 심판 장면을 제시합니다. 이 긴장을 약화하지 않기 위해 이미지성을 유지했습니다.
  doctrine_reference: 종말론적 심판과 행위의 공개(계 20:12과 유사한 책 이미지)
