  rationale: 하나님을 가리키는 존칭적 칭호로서 ‘전능자’가 한국어에서 가장 자연스럽고, 장중한 기도체 문맥에도 잘 맞습니다.
- source_word: ܪ̈ܘܚܘܗܝ ܕܥܠܡܐ
