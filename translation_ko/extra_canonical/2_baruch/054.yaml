theological_decisions:
- issue: ‘주님은 살아 계신 분이십니다’의 호칭과 서술
  chosen_reading: 기도문 안의 하나님 직접 호칭은 합쇼체를 유지하고, 찬양·간구의 어조를 보존했습니다.
