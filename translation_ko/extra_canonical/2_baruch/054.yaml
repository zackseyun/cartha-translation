  rationale: 묵시적 환상 해석의 표준 용례에 맞춰 ‘해석’을 사용했습니다.
- source_word: ܡܘܟܟܐ
  english_pob_choice: words of humility
  chosen_korean: 겸손한 말들
  alternatives_korean:
