  alternatives_korean:
  - 세상의 바람들
  - 세상의 시대정신
  lexicon: Sokoloff (Syriac)
  rationale: 문맥이 우주론적 기도이므로 바람보다 ‘영들’이 더 적합하며, ‘세상’은 소유격 관계를 자연스럽게 살립니다.
- source_word: ܒܡܠܬܟ
  english_pob_choice: by your word
  chosen_korean: 자신의 말씀으로
  alternatives_korean:
  - 주님의 말씀으로
  - 주님의 말로
  lexicon: Sokoloff (Syriac)
  rationale: 창조의 도구성을 분명히 하면서도, 한국어에서 문장 흐름이 자연스럽게 이어지도록 ‘말씀으로’를 택했습니다.
- source_word: ܦܘܫܩܗ
  english_pob_choice: its interpretation
