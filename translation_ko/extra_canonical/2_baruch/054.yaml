translation:
  language: ko
  text: '54 바룩의 낮 기도


    그가 전능자에게 구하여 말했습니다:


    “주님, 주님만이 모든 것을 질서 있게 하십니다. 주님은 세상의 영들을 아십니다. 세상이 창조되기 전에 주님은 자신의 말씀으로 그것을 세우셨습니다. 사람의 형상들을 바르게 배열하심으로 창조의 높은 것들이 유지되며, 그 끝들도 주님께서 알려 주십니다.


    주님은 사람의 영들을 지으신 분이시며, 사람은 살펴봄으로써 찾아낼 수 있습니다. 주님은 주님을 경외하는 이들에게 앞으로 일어날 일을 드러내시는 분이십니다. — 왜냐하면 높은 곳에서 예언자들이 나오기 때문입니다. 주님은 알지 못하는 이들에게 알려 주시고, 믿지 않는 이들에게는 표를 세우시며, 어둠을 비추시고 허물이 없는 사람들에게 숨은 것들을 드러내십니다.


    그러나 주님께서 이 환상을 주님의 종에게 보여 주셨으니, 저에게도 그것의 해석을 알려 주십시오. 주님이 제가 주님께 구한 것을 저에게 드러내시리라는 것을 저는 압니다. 그것은 제가 구원받기를 바라게 하려는 것이며, 제가 구한 것은 아무것도 제게 숨겨지지 않을 것입니다. 그것이 저에게 드러날 것이며, 저는 부끄러움을 당하지 않을 것입니다.


    그리고 사람들 가운데 큰 이들로부터 주님께 찬양과 계명 준수가 드려진다 해도, 사람들 가운데 적은 자인 저는 주님께 찬양으로 보답할 수 없습니다. 또 제가 마땅히 주님을 찬양한다 해도 주님의 찬양을 모두 말할 수 없습니다. 제가 주님의 선하심을 고백하겠다고 말한다 해도—제가 무엇이기에, 제 간구 가운데 무엇이기에 그런 것입니까? 그리고 여인에게서 난 제가 무엇이기에, 이 모든 놀라운 일들을 말할 수 있겠습니까? 주님께서 지으신 분에게서 제가 흔들리지 않는 어떤 희망을 가질 수 있겠습니까?


    제가 무엇이기에 지식을 붙잡을 수 있습니까? 또 다시 제 안에서 아는 자가 될 수 있습니까? 그러나 저는 능력으로 찬양하기에 합당하지 않습니다. 오히려 겸손한 말들로 주님의 놀라운 일들을 말하겠습니다. 제가 태어날 때 주님의 놀라운 일들에 놀랐습니다. 그리고 누가 비유 속에서 주님의 생각을 더듬어낼 수 있겠습니까?


    주님은 살아 계신 분이십니다. 주님의 오른손이 지은 피조물이 말하게 하십시오. 빛의 샘에서 나는 목소리와 함께 큰 힘이 오게 하시고, 지혜의 보고가 주님의 손으로 주님의 보좌 아래에서 열리게 하십시오. 그리고 한순간에 어떤 사람도 증언할 수 없는 이들을 축복하시고, 주님의 의가 아담의 아들들을 버리지 않은 이들을 받아 주게 하십시오.”[a][b][c][d]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
