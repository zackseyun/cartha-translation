  lexicon: Sokoloff (Syriac)
  rationale: 문자적으로는 ‘겸손’이 맞고, 복수 표현을 살리기 위해 ‘말들’로 옮겼습니다.
- source_word: ܬܬܪܙܐ
  english_pob_choice: storehouse of wisdom
  chosen_korean: 지혜의 보고
  alternatives_korean:
  - 지혜의 창고
  - 지혜의 보물창고
