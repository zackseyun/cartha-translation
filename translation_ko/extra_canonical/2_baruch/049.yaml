base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/049.yaml
  text: 'But nevertheless I will ask you[a], O Mighty One, and I will seek from him who made all: In what form will those live who live in his days? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain which now sustain the living? Or will you perhaps change those things that have been in the world[d][c][b], as also the world itself?'
  footnotes:
  - marker: a
    text: The chapter boundary is slightly uncertain in this Ceriani bucket. The reply beginning 'He answered and said to me...' belongs with chapter 50 and is not included in the English draft above.
    reason: textual_variant
  - marker: b
    text: The Syriac at the word rendered 'splendor' is difficult in the supplied line and may reflect an OCR or transmission problem; the translation follows the most plausible sense supported by control witnesses.
    reason: alternative_reading
  - marker: c
    text: The Syriac says 'in his days,' even though the prayer addresses God directly. The English keeps that harder reading rather than silently changing it to 'your days.'
    reason: lexical_alternative
  - marker: d
    text: Or 'But now, tell me this also, my beloved, and speak of what is hidden:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 저는 주께 청하겠습니다, 위대하신 분이시여. 그리고 모든 것을 만드신 이에게서 묻겠습니다. 그 시대에 사는 이들은 어떤 모습으로 살겠습니까? 그때에 뒤따라오는 이들의 영광은 어떻게 보존되겠습니까? 그들은 그때에 이 현재의 모습과 같은 형체를 입겠습니까 — 그리고 지금 살아 있는 이들을 떠받치고 있는 사람의 형상들이 그대로 남아 있겠습니까? 아니면 주께서 세상에 있었던 것들을, 곧 세상 자체도 바꾸시겠습니까?[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܫܐܠ ܡܢܟ
  english_pob_choice: I will ask you
  chosen_korean: 저는 주께 청하겠습니다
  alternatives_korean:
  - 제가 주께 묻겠습니다
  - 주께 질문하겠습니다
  lexicon: Payne Smith
  rationale: 시리아어 동사는 단순한 질문보다 간청을 동반한 ‘청하다/묻다’의 뉘앙스가 있어, 합쇼체 기도문 맥락에 맞게 ‘주께 청하겠습니다’로 옮겼습니다.
- source_word: ܚܝܠܬܢܐ
  english_pob_choice: O Mighty One
  chosen_korean: 위대하신 분이시여
  alternatives_korean:
  - 전능하신 분이시여
  - 권능자이시여
  lexicon: Payne Smith
  rationale: 호격은 하나님을 직접 부르는 표현이지만, 본문은 ‘전능’보다 ‘권능/위대함’을 전면에 두므로 교회적 상투어를 피하고 원문의 호칭 성격을 살렸습니다.
- source_word: ܕܡܘܬܐ
  english_pob_choice: form
  chosen_korean: 모습
  alternatives_korean:
  - 형체
  - 형태
  - 모양
  lexicon: Payne Smith
  rationale: 이 문맥에서는 부활 이후 존재 방식의 외형을 묻는 말이므로, 추상적인 ‘형태’보다 사람에게 바로 이해되는 ‘모습’을 기본으로 하되 뒤의 ‘형체’를 병치해 원문의 신체적 뉘앙스를 보완했습니다.
- source_word: ܡܘܒܕܝ / ܡܘ̈ܒܕܢܝܗܘܢ
  english_pob_choice: splendor / those things ... in the world
  chosen_korean: 영광 / 세상에 있었던 것들
  alternatives_korean:
  - 광채 / 세상의 것들
  - 영화 / 세상에 있던 것들
  lexicon: Payne Smith
  rationale: 시리아어 전승이 난해한 지점이지만, 문맥상 ‘뒤따라오는 이들의 영광’과 ‘세상에 있었던 것들’을 가리키는 흐름이 가장 자연스럽습니다. POB의 어려운 읽기를 반영하면서도 한국어에서는 의미가 드러나도록 했습니다.
- source_word: ܡܚܠܦ
  english_pob_choice: change
  chosen_korean: 바꾸시겠습니까
  alternatives_korean:
  - 바꾸어 놓으시겠습니까
  - 변화시키시겠습니까
  lexicon: Payne Smith
  rationale: 문장은 지속성과 변형의 대비를 묻는 질문이므로, 신학적 결론을 앞서지 않는 중립적 동사 ‘바꾸시겠습니까’를 택했습니다.
theological_decisions:
- issue: 하나님 직접 호칭의 한국어 높임말
  chosen_reading: 본문의 기도체를 따라 하나님께 직접 말하는 부분은 ‘주께 청하겠습니다’처럼 주체를 높이는 합쇼체로 유지했습니다.
  alternative_readings:
  - 평서형으로 평평하게 옮기기
  - 전통적 기도체 ‘-하옵소서’로 고정하기
  rationale: 합쇼체는 현대 문어의 격식을 유지하면서도 과도한 고어화를 피합니다. 동시에 본문이 드러내는 간청의 긴장도 보존합니다.
  doctrine_reference: 기도체/문체 일관성
- issue: 종말 이후 인간 존재의 연속성과 변화
  chosen_reading: 본문의 질문을 결론 없이 열린 상태로 두어, 현재 형체의 연속 가능성과 하나님의 변형 가능성을 모두 남겼습니다.
  alternative_readings:
  - 동일한 육체의 연속을 단정하기
  - 완전한 비물질적 변화로 단정하기
  rationale: 본문은 해결이 아니라 질문을 제시하므로, 해석을 좁히지 않고 질문의 긴장을 그대로 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 부활론/종말론
