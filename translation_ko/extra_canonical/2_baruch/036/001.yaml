  rationale: 여기서는 상징적으로 넓게 펼쳐진 나무들의 집합을 가리키므로, 현대 한국어에서 자연스럽고 장면 규모를 살리는 ‘숲’이 가장 적절합니다.
- source_word: ܓܦܢ
  english_pob_choice: vine
  chosen_korean: 포도나무
  alternatives_korean:
  - 덩굴포도
  - 포도덩굴
  lexicon: Payne Smith
  rationale: 한국어 성서 문맥에서 포도나무가 가장 직관적으로 상징성을 전달하며, 본문의 대조 구조도 잘 드러냅니다.
- source_word: ܡܒܘܥܐ
  english_pob_choice: fountain
  chosen_korean: 샘
  alternatives_korean:
  - 샘물
  - 분수
  lexicon: Payne Smith
  rationale: 시적·환상적 장면이지만, 한국어에서는 물이 솟아나는 근원을 가장 자연스럽게 드러내는 ‘샘’이 적합합니다.
- source_word: ܐܪܙܐ
  english_pob_choice: cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 삼나무
  - 향목
  lexicon: Payne Smith
  rationale: 성서적 상징어로 굳어진 표현을 살리기 위해 관용적인 ‘백향목’을 택했습니다.
theological_decisions:
- issue: 환상 본문에서 상징을 미리 해석으로 고정할지 여부
  chosen_reading: 포도나무와 샘을 본문 안에서는 그대로 상징 이미지로 유지했습니다.
  alternative_readings:
  - 이 장면을 곧바로 메시아적 인물로 표지하기
  - 뒤의 해석 전통을 끌어와 설명어를 덧붙이기
  rationale: 이 단락은 환상 자체를 서술하는 대목이므로, 뒤에서 제시될 해석을 앞당겨 넣지 않고 상징의 긴장을 보존하는 것이 원문 흐름에 더 충실합니다.
