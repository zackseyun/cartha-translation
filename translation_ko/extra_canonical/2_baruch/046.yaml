base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/046.yaml
  text: '1 And the elders of the people answered and said to me[a],


    "Has the Mighty One indeed humbled us so greatly as to take you from us so suddenly?

    2 Truly, we shall be in darkness,

    and there will be no light for the people who are left.

    3 For where shall we again seek the law,

    or who will guide us from the way of death to life?"


    4 And I said to them,

    "I cannot stand against the will of the Mighty One.

    Yet Israel will not lack a wise man,

    nor the race of Jacob a son of the law.

    5 But prepare your hearts so that you may listen to the law and be merciful to your neighbors.

    6 For if you do these things, hope will be given to you—

    those things that were spoken to you before.

    7 And you will not fall into the torment about which it was told you beforehand."


    8 But the word that I was departing I did not reveal to them[f][e][d][c][b], nor to their sons.'
  footnotes:
  - marker: a
    text: The middle of v. 5 is textually difficult in this Ceriani-based OCR line. The translation keeps the secure sense—preparing the heart to heed the law—without pressing the obscurer wording too confidently.
    reason: textual_variant
  - marker: b
    text: The wording behind 'torment' is somewhat uncertain in the present substrate, but the larger sense is a warning against the punitive fate previously announced.
    reason: lexical_alternative
  - marker: c
    text: The final clause is near the chapter edge and may be unstable in the current bucket. The Ceriani OCR here is difficult; some orienting witnesses support 'nor to my son' rather than a plural reading.
    reason: textual_variant
  - marker: d
    text: Or 'And on that day my son and the elders of the people answered and said to me,'.
    reason: previous_rendering
  - marker: e
    text: Or 'I cannot stand against the Mighty One.'.
    reason: previous_rendering
  - marker: f
    text: Or 'But the word concerning my being taken away I did not make known to them, nor to my son.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그때 백성의 장로들과 내 아들이 나에게 대답하여 말했습니다.


    「전능하신 분께서 참으로 우리를 이렇게까지 낮추셔서, 당신을 우리에게서 갑자기 데려가신 것입니까? 우리는 참으로 어둠 속에 있게 될 것이며, 남아 있는 백성에게는 빛이 없을 것입니다. 우리가 다시 어디에서 율법을 찾겠으며, 누가 우리를 죽음의 길에서 생명으로 인도하겠습니까?」


    내가 그들에게 말했습니다.


    「나는 전능하신 분의 뜻을 거스를 수 없습니다. 그러나 이스라엘은 지혜로운 사람을 잃지 않을 것이며, 야곱의 집안도 율법의 아들을 잃지 않을 것입니다. 다만 여러분은 마음을 준비하여 율법에 귀를 기울이고, 이웃에게 자비를 베푸십시오. 그러면 여러분에게는 소망이 주어질 것입니다 — 전에 여러분에게 말해졌던 그것들이 말입니다. 그러면 여러분은 전에 여러분에게 미리 알려진 그 고통에 빠지지 않을 것입니다.」


    그러나 내가 떠나게 된 일은 그들에게도, 그들의 아들들에게도 알리지 않았습니다.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  english_pob_choice: the Mighty One
  chosen_korean: 전능하신 분
  alternatives_korean:
  - 능하신 분
  - 강하신 분
  lexicon: Payne Smith
  rationale: 신적 칭호로서의 장엄함을 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다. '전능하신 하나님'보다 본문의 칭호 자체를 드러내는 것이 문맥에 더 맞습니다.
- source_word: ܢܡܘܣܐ
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 토라
  lexicon: Payne Smith
  rationale: 여기서는 지혜 교훈 일반이 아니라 이스라엘의 규범적 계시를 가리키므로, POB 기본어인 '율법'을 유지했습니다.
- source_word: ܒܪ ܢܡܘܣܐ
  english_pob_choice: a son of the law
  chosen_korean: 율법의 아들
  alternatives_korean:
  - 율법의 제자
  - 율법의 사람
  lexicon: Payne Smith
  rationale: 히브리적 친족 비유를 살려, 율법에 속하고 율법을 이어받는 사람이라는 뉘앙스를 드러냈습니다. '제자'로 풀면 은유가 약해집니다.
- source_word: ܒܝܬ ܡܘܬܐ
  english_pob_choice: the house of death
  chosen_korean: 죽음의 길
  alternatives_korean:
  - 죽음의 집
  - 죽음의 영역
  lexicon: Payne Smith
  rationale: 원문 이미지는 강하지만, 한국어에서는 '죽음의 집'이 다소 부자연스러워 문맥상 기능을 유지하는 방향으로 옮겼습니다. 이 구절의 핵심은 죽음에서 생명으로의 인도입니다.
- source_word: ܨܒܝܢܗ
  english_pob_choice: the will of the Mighty One
  chosen_korean: 전능하신 분의 뜻
  alternatives_korean:
  - 전능하신 분의 의지
  - 전능하신 분의 뜻하심
  lexicon: Payne Smith
  rationale: 이 절의 항복은 단순한 힘 앞의 굴복이 아니라 하나님의 뜻에 대한 순복이므로, '뜻'을 넣어 의미를 보존했습니다.
- source_word: ܣܠܩ / ܡܣܬܠܩ
  english_pob_choice: be taken up
  chosen_korean: 데려가신 것
  alternatives_korean:
  - 올려가신 것
  - 들어 올리신 것
  lexicon: Payne Smith
  rationale: 이 문맥에서 'taken up'은 바룩의 갑작스러운 이동/철수를 가리키는 표현이므로, 한국어에서는 자연스럽고 문맥에 맞는 '데려가신 것'으로 처리했습니다.
theological_decisions:
- issue: 하나님의 칭호 번역
  chosen_reading: '''the Mighty One''을 ''전능하신 분''으로 옮겨, 장엄한 신적 칭호를 유지했습니다.'
  alternative_readings:
  - 하나님
  - 강하신 분
  rationale: 이 장르는 묵시문학적 탄식이므로, 평범한 '하나님'보다 칭호성을 살린 번역이 문체와 기능을 더 잘 보존합니다.
  doctrine_reference: apocalyptic divine epithet
- issue: 죽음과 생명의 대조
  chosen_reading: '''죽음의 길에서 생명으로''로 옮겨, 이동의 이미지와 대조를 함께 살렸습니다.'
  alternative_readings:
  - 죽음에서 생명으로
  - 죽음의 집에서 생명으로
  rationale: 원문은 단순한 추상 대비가 아니라 길/인도 이미지가 있는 진술이므로, 한국어에서도 그 흐름을 분명히 보여 주는 편이 좋습니다.
  doctrine_reference: wisdom-and-apocalyptic imagery
