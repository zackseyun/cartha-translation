  text: And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.
translation:
  language: ko
  text: 그리고 네가 본 다섯째 검은 물은 — 아모리 사람들의 행위와, 그들이 행한 마술의 주술과, 그들의 비밀의 악함과, 그들의 부정함의 뒤섞임입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: five black waters
  english_pob_choice: the fifth black waters
  chosen_korean: 다섯째 검은 물
  alternatives_korean:
  - 다섯 번째 검은 물
  - 다섯째의 검은 물
  lexicon: 기본 서술어/수량 표현
  rationale: 원문의 수량과 색채 이미지를 그대로 살리면서도 한국어에서 자연스러운 명사구로 옮겼습니다.
- source_word: Amorites
  english_pob_choice: the Amorites
  chosen_korean: 아모리 사람들
  alternatives_korean:
  - 아모리인들
  - 아모리 족속
  lexicon: 고유명사 표기
  rationale: 성서적 인명/족속 표기에서 널리 쓰이는 형태를 따르되, 문맥상 집단성을 분명히 했습니다.
- source_word: spells of their enchantments
  english_pob_choice: the spells of their enchantments
  chosen_korean: 마술의 주술
  alternatives_korean:
  - 주술의 마법
  - 주문의 마술
  lexicon: 중첩 어휘 대응
  rationale: 영문 POB가 두 층위의 마술 행위를 분리해 유지한 점을 따라, 반복적·의식적 행위를 드러내는 ‘주술’을 택했습니다.
- source_word: mysteries
  english_pob_choice: their mysteries
  chosen_korean: 비밀
  alternatives_korean:
  - 신비
  - 은밀한 일
  lexicon: 의미역
  rationale: 여기서의 ‘mysteries’는 계시적 ‘신비’보다 숨겨진 불의의 행위를 가리키므로, 소스가 허용하는 범위 안에서 ‘비밀’로 옮겼습니다.
- source_word: mingling of their uncleanness
  english_pob_choice: the mingling of their uncleanness
  chosen_korean: 그들의 부정함의 뒤섞임
  alternatives_korean:
  - 그들의 더러움이 뒤섞인 것
  - 그 부정함의 혼합
  lexicon: 행위-상태 결합 표현
  rationale: ‘mingling’의 혼합 이미지를 유지하면서, 의례적·도덕적 부정을 함께 드러내는 ‘부정함’을 택했습니다.
theological_decisions:
- issue: ‘black waters’의 상징적 기능
  chosen_reading: 검은 물은 아모리 사람들의 행위들을 가리키는 상징으로 직역해, 물의 이미지가 판단 표지라는 점을 보존했습니다.
  alternative_readings:
  - 검은 물은 아모리 사람들의 죄악을 뜻합니다
  - 흑암 같은 물은 아모리 사람들의 행위입니다
  rationale: 본문은 상징을 해석해 주므로, 해석을 풀어쓰되 상징어 자체는 유지하는 것이 원문의 설교적 구조를 더 잘 반영합니다.
  doctrine_reference: 상징-해석 구조 보존
