revisions:
- from: 그리고 네가 본 다섯째 검은 물은 — 아모리 사람들의 행위와, 그들이 행한 마술의 주술과, 그들의 비밀의 악함과, 그들의 부정함의 뒤섞임입니다.[a]
  to: 그리고 네가 비처럼 내리는 것을 본 다섯째 검은 물은 아모리 사람들이 저지른 행위들, 그들이 행한 마술 주문들, 그들의 비의의 사악함, 그리고 그들의 부정함이 뒤섞인 것입니다.
  rationale: 원문의 열거식 해석 구조와 상징어 ‘다섯째 검은 물’을 보존하되, 누락된 ‘비처럼 내리는’ 모습을 복원했습니다. 어색한 소유격 연쇄를 현대 한국어 문장으로 다듬고, mysteries의 의미 범위를 좁히지 않는 ‘비의’를 사용했습니다. 내용 없는 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:28Z'
