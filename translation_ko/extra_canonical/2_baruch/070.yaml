theological_decisions:
- issue: 결말의 방향
  chosen_reading: 재앙의 연쇄가 단순 파멸로 끝나지 않고, 결국 메시아의 손에 넘겨지는 심판의 국면으로 수렴합니다.
  alternative_readings:
  - 정치적 붕괴만을 말하는 것으로 읽기
  - 메시아적 전환을 약화시키는 읽기
  rationale: 영어 POB와 Syriac 흐름 모두 최종 국면을 메시아에게 넘겨지는 것으로 맺으므로, 종말 서사의 방향을 유지했습니다.
