  text: '1 Therefore hear the interpretation of the final black waters that follow the black waters. This is the word:

    2 Behold[a], days are coming when the time of the world has ripened and the harvest of its evil and good seeds has come. Then the Mighty One will bring confusion of spirit and consternation of heart upon the earth, its inhabitants, and its rulers.

    3 They will hate one another and provoke one another to fight; the base will rule over the honorable, and the ignoble will be exalted over the illustrious.

    4 Many will be delivered into the hands of the few. Those who were nobodies will rule over the strong, the poor will have more than the rich, and the impious will exalt themselves over the brave.

    5 The wise will be silent and the foolish will speak. Then the thought of men will not be fulfilled, nor the counsel of the strong, nor the hope of those who hope.

    6 When those things that were foretold have come to pass, confusion will fall upon all people. Some will fall in war, some will perish in tribulations,

    7 and some will be undone by their own. Then the Most High will stir up the peoples whom he prepared beforehand, and they will wage war against the rulers who remain at that time.

    8 And whoever escapes from the war will die in the earthquake, and whoever escapes from the earthquake will be burned by fire, and whoever escapes from the fire will perish by famine.

    9 And it will happen that anyone who escapes and is delivered from all these things—both those who conquered and those who were conquered—will be delivered into the hands of my servant, the Messiah.

    10 For the whole earth will devour its inhabitants.'
  footnotes:
  - marker: a
    text: The chapter edge in Ceriani is still rough here, and an earlier draft had degraded into a broken fragment. This chapter was manually rebuilt against the longer late-apocalypse control tradition while preserving the final-black-waters sequence.
    reason: textual_variant
translation:
  language: ko
  text: '그러므로 마지막 검은 물들에 대한 해석을 들으십시오. 그것은 이 말씀입니다.


    보십시오[a], 세계의 때가 무르익고 그 악한 씨와 선한 씨의 수확이 이르렀습니다. 그러면 전능하신 분이 땅과 그 주민들과 그 통치자들 위에 영의 혼란과 마음의 당황을 가져오실 것입니다.


    그들은 서로를 미워하며 서로를 부추겨 싸우게 할 것이며, 비천한 자가 존귀한 자를 다스리고, 천한 자가 유명한 자들 위에 높아질 것입니다.


    많은 사람이 소수의 손에 넘겨질 것입니다. 무가치하던 자들이 강한 자들을 다스리고, 가난한 자들이 부유한 자들보다 더 많이 가지며, 경건하지 않은 자들이 용감한 자들 위로 스스로를 높일 것입니다.


    지혜로운 자들은 잠잠하고 어리석은 자들은 말할 것입니다. 그러면 사람의 생각도 이루어지지 않고, 강한 자들의 계획도, 바라던 자들의 희망도 이루어지지 않을 것입니다.


    예언된 것들이 이루어질 때, 모든 사람에게 혼란이 임할 것입니다. 어떤 이들은 전쟁에서 쓰러지고, 어떤 이들은 환난 가운데 멸망하며,


    어떤 이들은 자기들의 것에 의해 무너질 것입니다. 그러면 지극히 높으신 분이 미리 준비하신 민족들을 일으키실 것이며, 그들은 그때 남아 있는 통치자들과 전쟁을 벌일 것입니다.


    그리고 전쟁에서 살아남는 자는 지진으로 죽을 것이며, 지진에서 살아남는 자는 불에 타 죽을 것이고, 불에서 살아남는 자는 기근으로 멸망할 것입니다.


    또 전쟁에서 벗어나고 이 모든 것에서 구출된 자, 곧 승리한 자들이든 패배한 자들이든, 모두 내 종 메시아의 손에 넘겨질 것입니다.


    이는 온 땅이 그 거주자들을 삼킬 것이기 때문입니다.'
  philosophy: optimal-equivalence
