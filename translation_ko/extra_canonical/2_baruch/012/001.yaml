  text: But I will speak as I understand, and I will speak against you, land that prospers.
translation:
  language: ko
  text: 하지만 나는 내가 이해하는 바대로 말하겠습니다. 그리고 번성하는 땅인 당신을 향해 말하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܟ ܕܡܫܬܡܥ ܐܢܐ
  english_pob_choice: as I understand
  chosen_korean: 내가 이해하는 바대로
  alternatives_korean:
  - 내가 듣는 대로
  - 내게 그렇게 보이는 대로
  lexicon: Payne Smith
  rationale: 문맥상 단순한 청취보다 화자의 분별과 인식을 나타내므로, ‘이해하는 바대로’가 더 정확하게 대응합니다.
- source_word: ܐܡܪ ܥܠ
  english_pob_choice: speak against
  chosen_korean: ~을 향해 말하다
  alternatives_korean:
  - ~을 거슬러 말하다
  - ~을 대적하여 말하다
  lexicon: Payne Smith
  rationale: 시리아어 전치사는 단순한 방향보다 비난/경고의 대상성을 띠지만, 한국어에서는 과도하게 법정적 표현보다 ‘향해 말하다’가 본문 흐름을 자연스럽게 살립니다.
- source_word: ܐܪܥܐ ... ܡܨܠܚܐ
  english_pob_choice: land that prospers
  chosen_korean: 번성하는 땅
  alternatives_korean:
  - 형통한 땅
  - 잘되는 땅
  lexicon: Payne Smith
  rationale: 땅의 상태를 묘사하는 형용적 표현으로서 ‘번성하는’이 번영의 지속성을 담되, 본문의 경고적 어조를 유지합니다.
theological_decisions:
- issue: 경고의 대상과 어조
  chosen_reading: 바룩이 번성하는 땅을 향해 공개적으로 경고하는 말로 옮기고, 중립적 설명문으로 약화시키지 않았습니다.
  alternative_readings:
  - 단순한 회고적 진술로 완화
  - 개인적 독백으로 축소
  rationale: 본문은 자기 이해에 근거한 발화와 그 대상에 대한 직접적 경고를 함께 드러내므로, 둘 사이의 긴장을 그대로 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 예언적 책망과 경고의 직접성
