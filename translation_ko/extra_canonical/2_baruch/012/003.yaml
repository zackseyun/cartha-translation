  terminology: '"번영," "기쁨," and "억압하다" are appropriate, neutral renderings. No doctrinally loaded terminology is introduced. The plural force of the Syriac is represented by "여러분이"; Korean need not repeat a plural reflexive pronoun in the following clause.'
  issues:
