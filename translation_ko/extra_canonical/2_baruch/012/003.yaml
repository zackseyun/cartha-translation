  source_fidelity: 'The draft preserves the sequence and imperatival force reflected in the Syriac/English audit trail: do not expect or hope for enduring prosperity and joy; do not exalt yourselves; do not oppress. However, "번영과 기쁨이 있을 것이라고" can be read impersonally (''that prosperity and joy will exist'') rather than as the addressees'' continuing possession/enjoyment of them. Making the second-person reference explicit better represents the plural address.'
