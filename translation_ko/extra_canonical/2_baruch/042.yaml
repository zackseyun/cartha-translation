base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042.yaml
  text: '1[a]. And he answered and said to me, “These things also I will show you.

    2. And as for what you said[b], ‘For whom and for how many will these things be?’—for those who have believed, there will be the good things spoken beforehand; but for those who despise, the opposite of these.

    3. And as for what you said concerning those who drew near and those who withdrew, this is the word:

    4. Those who formerly were subject, and afterward withdrew and mingled themselves with the seed of the mixed peoples—their former time is reckoned as nothing.

    5. But those who formerly did not know life, and afterward came to know it[d][c], and mingled with the seed of the people which has separated itself—their former time is also reckoned as nothing.”'
  footnotes:
  - marker: a
    text: The Syriac at this point is textually rough in Ceriani; Kmosko’s Latin control supports the sense 'their former time is reckoned as lofty/high.'
    reason: textual_variant
  - marker: b
    text: The surviving Ceriani page breaks this sentence before its completion. The draft therefore preserves the open ending rather than pretending to greater precision than the witness warrants.
    reason: textual_variant
  - marker: c
    text: Or 'their former time is reckoned as lofty.[a]'.
    reason: previous_rendering
  - marker: d
    text: Or 'and were mingled with the seed of the peoples ...[b]'.
    reason: previous_rendering
translation:
  language: ko
  text: '그가 저에게 대답하여 말했습니다. 「이런 것들도 내가 당신에게 보여 드리겠습니다.


    당신이 말한 것, 곧 ‘이것들은 누구를 위해, 또 얼마나 많은 사람을 위해 있을 것입니까?’에 관해서는 — 믿는 이들에게는 미리 말해진 좋은 것들이 있을 것입니다. 그러나 멸시하는 이들에게는 이것들의 반대가 있을 것입니다.


    또 당신이 다가온 이들과 물러난 이들에 관해 말한 것에 대해서는, 그 말은 이렇습니다.


    전에 복종하던 이들, 그리고 나중에 물러나 섞인 민족의 씨와 뒤섞인 이들 — 그들의 이전 때는 아무것도 아닌 것으로 여겨집니다.


    그러나 전에 생명을 알지 못하다가 나중에 그것을 알게 된 이들[d][c], 그리고 자기 자신을 갈라낸 백성의 씨와 뒤섞인 이들 — 그들의 이전 때도 아무것도 아닌 것으로 여겨집니다。」[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܣܒܪܝܢ
  english_pob_choice: those who have believed
  chosen_korean: 믿는 이들
  alternatives_korean:
  - 믿은 이들
  - 믿음을 가진 이들
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: Kmosko 라틴 대조의 crediderunt에 맞추어, 단순한 지적 동의보다 신뢰와 수용의 응답을 드러내는 ‘믿는 이들’로 옮겼습니다.
- source_word: ܡܒܐܫ
  english_pob_choice: those who despise
  chosen_korean: 멸시하는 이들
  alternatives_korean:
  - 경멸하는 이들
  - 업신여기는 이들
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 원문은 단순한 불신보다 강한 태도인 경멸·모욕의 뉘앙스를 가지므로, ‘멸시하는 이들’이 그 도덕적 강도를 가장 잘 살립니다.
- source_word: ܐܬܦܪܫܘ / ܐܬܢܣܒܘ
  english_pob_choice: drew near / withdrew
  chosen_korean: 다가온 이들 / 물러난 이들
  alternatives_korean:
  - 가까이 온 이들 / 떠난 이들
  - 접근한 이들 / 물러선 이들
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 이 짝은 물리적 이동이 아니라 언약적·도덕적 방향 전환을 가리키므로, 방향성을 살리면서도 문맥에 자연스러운 ‘다가오다/물러나다’로 처리했습니다.
- source_word: ܙܪܥܐ ܕܥܡ̈ܡܐ ܡܚܠܛ̈ܐ
  english_pob_choice: the seed of the mixed peoples
  chosen_korean: 섞인 민족의 씨
  alternatives_korean:
  - 뒤섞인 민족의 씨
  - 혼합된 민족의 씨
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: ‘씨’는 혈통·언약적 언어를 유지하므로 일반화하지 않고, POB의 직역 성향에 따라 ‘섞인 민족의 씨’로 옮겼습니다.
- source_word: ܚ̈ܝܐ
  english_pob_choice: life
  chosen_korean: 생명
  alternatives_korean:
  - 삶
  - 영생
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 문맥상 단순한 생존이 아니라 신적 진리와 연결된 ‘생명’의 무게가 있으므로, 신학적 밀도를 해치지 않는 표준어 ‘생명’을 택했습니다.
- source_word: ܡܬܚܫܒܘ ... ܐܒܕܘܗܝ
  english_pob_choice: is reckoned as nothing
  chosen_korean: 아무것도 아닌 것으로 여겨집니다
  alternatives_korean:
  - 없는 것으로 간주됩니다
  - 무효로 여겨집니다
  lexicon: Payne Smith, Compendious Syriac Dictionary
  rationale: 리뷰에서 확인된 것처럼 이 구절의 핵심은 이전의 행위나 시간의 효력을 무효화하는 데 있으며, ‘아무것도 아닌 것’이 그 판단을 가장 분명히 전달합니다.
theological_decisions:
- issue: ‘이전 때는 아무것도 아닌 것으로 여겨집니다’의 신학적 방향
  chosen_reading: 과거의 순종이나 소속은 현재의 배교/개종 여부에 의해 효력을 상실하며, 단순히 과거 공로를 축적하는 구조가 아닙니다.
  alternative_readings:
  - 과거 공로가 계속 보존된다는 읽기
  - 도덕적 평가 없이 시간만 표시하는 읽기
  rationale: 문맥은 에스겔 18장과 같은 책임 논리를 따르므로, 과거의 상태가 현재의 정체성에 의해 재평가되어 무효화되는 점을 살려야 합니다.
  doctrine_reference: 책임 있는 응답, 배교/회심의 언약적 परिणाम
- issue: ‘생명을 알지 못하다가… 알게 된 이들’의 의미
  chosen_reading: ‘생명’은 구원의 길을 풀어쓴 것이 아니라, 하나님께 속한 참된 생명의 실재를 가리키는 압축된 표현으로 유지했습니다.
  alternative_readings:
  - 구원의 길을 알게 된 이들
  - 영생을 알게 된 이들
  rationale: 원문은 짧고 응축된 표현이므로, 후대 교리어를 덧붙이기보다 본래의 밀도를 보존하는 편이 source-direct합니다.
  doctrine_reference: 종말론적 생명과 언약적 지식
