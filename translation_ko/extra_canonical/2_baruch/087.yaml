translation:
  language: ko
  text: 그리고 내 기도에도. 너희도 그 편지의 명령들을 그들에게서 이미 배웠습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  english_pob_choice: in my prayer also
  chosen_korean: 그리고 내 기도에도
  alternatives_korean:
  - 또 내 기도 안에도
  - 그리고 내 간구에도
  lexicon: Payne Smith
  rationale: ܒܒܥܘܬܝ는 기도/간구/청원을 뜻할 수 있으나, 여기서는 앞선 기억의 진술을 이어 주는 자연스러운 표지로 ‘내 기도에도’가 가장 직관적이고 문맥에 맞습니다.
- source_word: ܘܐܦ ܐܢܬܘܢ
  english_pob_choice: And you also
  chosen_korean: 너희도
  alternatives_korean:
  - 또 너희도
  - 너희 또한
  lexicon: Payne Smith
  rationale: ‘also’는 기도에 붙기보다 수신자 주어에 붙는 것이 시리아어 분절과 영어 주석 모두에 더 잘 맞으므로, 한국어도 ‘너희도’로 옮겨 강조를 살렸습니다.
- source_word: ܝܠܦܬܘܢ
  english_pob_choice: you also have learned
  chosen_korean: 이미 배웠습니다
  alternatives_korean:
  - 배웠습니다
  - 배운 바 있습니다
  lexicon: Payne Smith
  rationale: 동사는 2인칭 복수 완료형으로, 권면형이 아니라 ‘이미 배운’ 사실 진술입니다. 따라서 합쇼체의 평서문으로 처리했습니다.
- source_word: ܕܐܓܪܬܐ ܗܕܐ
  english_pob_choice: the commandments of this letter
  chosen_korean: 그 편지의 명령들을
  alternatives_korean:
  - 이 편지의 명령들을
  - 이 서신의 계명들을
  lexicon: Payne Smith
  rationale: 문맥상 ‘이 편지’는 바로 앞서 언급된 서신 전체를 가리키므로 ‘그 편지’가 지시를 더 자연스럽게 유지합니다. ܦܘ̈ܩܕܢܐ는 일반적으로 ‘명령들/계명들’이 가능하지만, 여기서는 서신의 권면적 성격을 살려 ‘명령들’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 문장 연결과 청중-기억 진술의 성격
  chosen_reading: 바룩이 수신자들을 자신의 기도 안에 계속 기억하며, 그들이 이미 서신의 명령들을 배웠다고 진술하는 평서문으로 유지했습니다.
  alternative_readings:
  - 기도를 위한 별도의 축복문으로 확장하는 읽기
  - 수신자에게 새로 배우라고 권하는 권면문으로 읽기
  rationale: 시리아어 완료형 ܝܠܦܬܘܢ은 이미 배운 상태를 나타내므로 권면으로 바꾸면 문법과 어긋납니다. 또한 ‘그리고’로 시작하는 절단된 문맥을 과도하게 매끄럽게 만들지 않고, 현행 본문의 불안정한 경계도 보존했습니다.
  doctrine_reference: 문법-주해 우선 원칙, 본문 경계의 불안정성 존중
