  yaml_path: translation/extra_canonical/2_baruch/076/001.yaml
  text: And he answered and said to me, “Because you have prayed that I show you what will happen to you after these things, for this reason I have shown you this vision, that you may see what will happen to you after these things. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going. And this shall be after forty days. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”
  footnotes:
  - marker: a
    text: Or 'And he answered and said to me, “Because you have asked me to show you what has happened and what is made, a superior lesson of understanding has been shown to you, concerning what is to be after these things.\nFor the time has come when Adam was created. But before that, there was no death; rather, afterward, sin came, and the body was filled with evil, and the first garment was taken away, and sickness came, and anguish, and pain, and labor in toil began, and many troubling thoughts were completed. And to the first Adam were assigned many days, but short years.\nThese things therefore I have said to you, that you may instruct the people as much as you are able, so that their God may not cause them to die in the last time, but that they may learn so that they may live in the last time.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 대답하여 내게 말했습니다. “이런 일들 뒤에 너에게 일어날 일을 보여 달라고 네가 기도하였기 때문에, 나는 너에게 이 환상을 보여 주었습니다. 이는 네가 이런 일들 뒤에 일어날 일을 보게 하려는 것입니다. 너는 반드시 이 땅을 떠나게 되겠지만 죽음에 이르는 것은 아니며, 정해진 때들을 위해 보존될 것입니다. 그러므로 그 산의 꼭대기로 올라가십시오. 그러면 그 땅의 여러 지역과, 사람이 사는 세상의 모습과, 산들의 봉우리와, 골짜기들의 깊은 곳과, 바다의 깊은 곳과, 강들의 수가 네 앞을 지나갈 것입니다. 그러면 네가 네가 떠나는 것과 네가 가는 곳을 보게 될 것입니다. 이것은 사십 일 후에 일어날 것입니다. 그러므로 이제 이 날들 동안 백성에게 가르칠 수 있는 만큼 가르치십시오. 그러면 그들이 배우고, 마지막 때에 죽지 않고, 배워서 마지막 때에 살게 될 것입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܒܪ ... ܒܚ̈ܛܗܐ / ܡܛܠ ܗܠܝܢ ܝܬܝܪܐܝܬ ...
  english_pob_choice: Because you have prayed ... for this reason I have shown you this vision
  chosen_korean: 네가 기도하였기 때문에 ... 나는 너에게 이 환상을 보여 주었습니다
  alternatives_korean:
  - 네가 간구하였기 때문에 ... 보여 주었습니다
  - 네가 빌었기 때문에 ... 보여 주었습니다
  lexicon: Payne Smith
  rationale: 시리아어의 원인-결과 구문을 그대로 살려, 시적이지만 직설적인 설명을 한국어로 옮겼습니다.
- source_word: ܡܫܢܐ ܡܢ ܗܕܐ ܐܪܥܐ
  english_pob_choice: depart from this earth
  chosen_korean: 이 땅을 떠나게 되겠지만
  alternatives_korean:
  - 이 땅에서 떠나가겠지만
  - 이 땅에서 옮겨가겠지만
  lexicon: Payne Smith
  rationale: ܡܫܢܐ는 단순한 ‘떠남/이동’보다 삶의 자리에서 물러나는 뉘앙스가 있어, 자연스러운 한국어로 ‘이 땅을 떠나게 되다’라고 옮겼습니다.
- source_word: ܢܛܘܪܐ ܕܙܒܢ̈ܐ
  english_pob_choice: be kept for the appointed times
  chosen_korean: 정해진 때들을 위해 보존될 것입니다
  alternatives_korean:
  - 정해진 때를 위해 지켜질 것입니다
  - 때들을 위해 간수될 것입니다
  lexicon: Payne Smith
  rationale: ‘보존되다’는 단순 생존보다 하나님의 목적 아래 محفوظ/kept 된다는 뜻을 살리면서, 본문의 종말론적 보존을 드러냅니다.
- source_word: ܬܒܝܠ
  english_pob_choice: inhabited world
  chosen_korean: 사람이 사는 세상
  alternatives_korean:
  - 거주하는 세상
  - 인간이 거주하는 세계
  lexicon: Payne Smith
  rationale: ܬܒܝܠ은 추상적 ‘세계’보다 ‘사람이 사는 세계’라는 뜻이 분명해, 독자에게 바로 이해되는 표현으로 옮겼습니다.
theological_decisions:
- issue: Baruch의 ‘떠남’과 ‘죽음이 아님’의 긴장
  chosen_reading: 본문의 긴장을 유지하여, 떠남은 말하되 그것이 죽음에 이르는 것은 아니라고 분명히 옮겼습니다.
  alternative_readings:
  - 죽지 않고 옮겨질 것입니다
  - 죽음을 겪지 않고 옮겨질 것입니다
  rationale: 본문은 일반적 죽음이 아님을 분명히 하지만, 그 방식까지 풀어서 해석하지는 않으므로 해설을 덧붙이지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
- issue: ‘마지막 때’의 반복
  chosen_reading: 두 번의 ܙܒܢܐ ܐܚܪܝܐ를 모두 ‘마지막 때’로 옮겼습니다.
  alternative_readings:
  - 마지막 시대
  - 끝때
  rationale: 시리아어의 종말론적 반복을 살리되, 한국어에서 가장 자연스럽고 엄숙한 표현을 택했습니다.
  doctrine_reference: Ceriani primary-witness priority
